  trans: "\n\n3. 在点击事件中，你通过 `$(this).index()` 获取被点击 `div` 元素的索引值。\n\n4. 你还通过 `$(this).text()`\
    \ 获取了该 `div` 现有的文本内容。\n\n5. 然后，你更新了 `div` 的文本内容，使其包含索引和原始文本内容（例如，“1 Hello World\
    \ 1”）。\n\n6. 这在被点击的 `div` 上现有文本旁边显示索引值。\n\n### 步骤 3：创建 UL 并添加带有点击事件的 LI 项目\n\n\
    1. 你正在创建一个无序列表 `<ul>`，并使用 `$(‘<ul>>’).prependTo(‘nav’)` 将其插入到 nav 元素之前。\n\n2.\
    \ 在一个运行十次的循环 `(for(let i=0;i<10;i++))` 中，你向无序列表添加列表项 `<li>`。\n\n3. 每个列表项包含类似 `“0\
    \ List Item,”`、`“1 List Item,”` 等文本。\n\n4. 对于每个列表项，你绑定了一个点击事件。\n\n5. 在列表项的点击事件中，你使用\
    \ `$(this).index()` 来获取被点击列表项的索引。\n\n6. 接着你将此索引打印到控制台。\n\n7. 这允许你确定并显示被点击列表项的索引。\n\
    \n这个练习展示了如何在各种语境下使用 `index()` 方法来获取元素的索引值。无论是按钮、`div` 还是列表项，你都在为这些元素添加点击事件以与它们交互并显示它们的索引值。\n\
    \n#### HTML\n\n```html\n<nav>\n<div class=”main”>\n<div class=”div1”>Hello World\
    \ 1</div>\n<div class=”div2”><<span>Hello World 2</span></div> <div class=”div3”\
    \ id=”div3”>Hello World 3</div>\n<div class=”div4”>Laurence Svekis</div>\n<input>\n\
    <button id=”btn1”>1</button>\n<button id=”btn2”>2</button>\n<button id=”btn3”>3</button>\n\
    <span class=”span1”>Hello</span>\n</div>\n</nav>\n<button id=”btn4”>4</button>\n\
    <button id=”btn5”>5</button>\n```\n\n#### JavaScript\n\n```javascript\n$(‘#btn1’).click(function(){\n\
    \  console.log($(this).index());\n})\n$(‘.main div’).click(function(){\n  const\
    \ val = $(this).index();\n  const temp = $(this).text();\n  $(this).text(`${val}\
    \ ${temp}`);\n})\nconst $ul = $(‘<ul>>’).prependTo(‘nav’);\nfor(let i=0;i<10;i++){\n\
    \  $(‘<li>’).text(`${i} ListItem`).appendTo($ul).click(function(){\n    console.log($(this).index());\n\
    \  })\n}\n```\n\n#### jQuery 数据方法 `(.data())`\n\n- `data()` 方法允许开发者向 HTML 元素附加自定义数据，并在以后获取这些数据。\n\
    - 它常用于存储与元素相关的状态信息或元数据。\n- 你可以在元素中存储不同类型的数据，例如字符串、数字、对象或数组。\n- 要将数据保存到元素中，你通常会选择该元素并使用\
    \ `.data(‘key’, ‘value’)`，其中 `‘key’` 是数据的唯一标识符，`‘value’` 是你想要存储的数据。\n- 你可以使用 `.data(‘key’)`\
    \ 获取所存储的数据。\n- `removeData(‘key’)` 方法用于移除与元素关联的数据。\n\n#### 页面元素索引方法 `(.index())`:\n\
    \n- `index()` 方法允许开发者获取元素相对于其同级兄弟元素的索引位置。\n- 它对于在元素列表或元素组中的特定元素执行操作非常有价值。\n- 你可以在特定元素上调用\
    \ `.index()` 来获取它在某组元素中的位置。\n- 索引是一个从 0 开始的值，表示在所选组中的内部位置。\n- 你可以使用 `:eq()` 和\
    \ `:lt()` 选择器根据元素在组中的位置来选择元素。`:eq()` 通过提供索引来选择特定元素，而 `:lt()` 则选择到指定索引之前的所有元素。\n\
    \n# 结论\n\n本章涵盖了如何使用这些方法，并提供了实际示例和练习来演示它们的用法。读者将牢固掌握如何使用 `data()` 和 `index()` 方法在\
    \ jQuery 中高效地处理页面元素。\n\n下一章将重点介绍使用 jQuery 进行事件处理，这是开发交互式 Web 的基础的基础。它将深入探讨 JavaScript\
    \ 中的事件模型，并展示如何使用 jQuery 绑定和触发事件。读者将探索 jQuery 中的各种事件方法，如 `.click()`、`.hover()`、`.submit()`\
    \ 和 `.click()`。\n\n# 多选题\n\n1. `data()` 方法的主要目的是什么？\n   a. 为 HTML 元素设置样式\n   b.\
    \ 向 HTML 元素附加自定义数据\n   c. 创建新的 HTML 元素\n   d. 解析 JSON\n\n2. 下列哪些数据类型可以通过 `data()`\
    \ 存储在元素中？\n   a. 仅字符串和数字\n   b. 仅对象和数组\n   c. 字符串、数字、对象或数组\n   d. HTML 元素\n\n\
    3. 如何使用 `data()` 从元素中检索存储的数据？\n   a. 使用 `.getData(‘key’)`\n   b. 使用 `.data(‘key’)`\n\
    \   c. 使用 `.retrieveData(‘key’)`\n   d. 使用 `fetch(‘key’)`\n\n4. jQuery 中的 `.index()`\
    \ 方法允许你确定什么？\n   a. 元素的 HTML 标签名\n   b. 元素相对于其同级元素的索引位置\n   c. DOM 中元素的总数\n  \
    \ d. 元素的 CSS 类\n\n# 答案\n\n1. b\n2. c\n3. b\n4. b\n\n"
- fmt: "\nEvents play a crucial role in creating interactive and dynamic web applications.\
    \ In this chapter, we will explore event handling with jQuery, an essential aspect\
    \ of web development. We will start with a brief overview of the event model in\
    \ JavaScript to provide a solid foundation for understanding how events work in\
    \ web development.\n\n# Structure (#toc.xhtml_s132a)\n\nIn this chapter, we will\
    \ cover the following topics:\n\n*   Overview of Event Handling in JavaScript\n\
    *   Introduction to the concept of events in web development\n*   Explanation\
    \ of how jQuery simplifies event handling\n*   Explanation of various event methods\
    \ in jQuery, including `.click()`, `.hover()`, `.submit()`, and `.keypress()`\n\
    *   Demonstrating how to use these methods to handle user interactions\n*   Event\
    \ delegation: Handling events on dynamically created elements\n*   Using the `.on()`\
    \ method to bind multiple events simultaneously\n*   Explanation of event bubbling\
    \ and propagation in the DOM\n*   Introduction to event methods like `.stopPropagation()`\
    \ and `.preventDefault()` for controlling event behavior\n*   Demonstrating how\
    \ to listen for mouse move events and handle hover events using jQuery\n*   Listening\
    \ for keyboard events\n*   Extracting values from the event object in jQuery\n\
    *   Exploring how to handle events related to HTML forms using jQuery\n\n# Understanding\
    \ Event Handling (#toc.xhtml_s133a)\n\nThe event model in JavaScript allows developers\
    \ to respond to various interactions and activities on a web page. This can include\
    \ actions like mouse clicks, keyboard inputs, form submissions, and more. However,\
    \ working with raw JavaScript to handle events can be cumbersome and complex.\
    \ This is where jQuery comes in as a powerful tool for simplifying event handling\
    \ and making it more efficient.\n\n# jQuery Event Methods (#toc.xhtml_s134a)\n\
    \njQuery provides a wide range of event methods that streamline the process of\
    \ binding and triggering events. These methods are designed to simplify event\
    \ handling, making it easier for developers to respond to user interactions effectively.\
    \ Some of the commonly used event methods include:\n\n# .click() (#toc.xhtml_s135a)\n\
    \nThe `.click()` method allows you to respond to mouse-click events on specific\
    \ elements. This is often used to create interactive features like buttons and\
    \ links.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Click Example</title>\n\
    <script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n</head>\n\
    <body>\n<button id=\"myButton\">Click me</button>\n<div id=\"output\">Click the\
    \ button to see the result.</div>\n<script>\n// Wait for the document to be ready\n\
    $(document).ready(function() {\n  // Attach a click event handler to the button\
    \ with the id \"myButton\"\n  $('#myButton').click(function() {\n    // This function\
    \ will be executed when the button is clicked\n    $('#output').text('Button clicked!');\n\
    \  });\n});\n</script>\n</body>\n</html>\n```\n\n1.  We include the jQuery library\
    \ in the `<head>` section of the HTML document.\n2.  We have a button with the\
    \ id `myButton` and a `<div>` with the id `output` in the HTML body.\n3.  Inside\
    \ the `<script>` section, we use `$(document).ready()` to ensure that the code\
    \ is executed after the document is fully loaded.\n4.  We select the button with\
    \ `$('#myButton')` and use the `.click()` method to attach a click event handler\
    \ to it.\n5.  When the button is clicked, the provided function is executed, and\
    \ it changes the text of the `<div>` with the id `output` to \"Button clicked!\"\
    \n\nThis example demonstrates a simple use case of the `.click()` method to respond\
    \ to a button click event using jQuery.\n\n# .hover() (#toc.xhtml_s136a)\n\nThe\
    \ `.hover()` method enables you to respond to mouse hover events, which occur\
    \ when the cursor enters and exits an element. This is useful for creating interactive\
    \ tooltips and dropdown menus.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Hover\
    \ Example</title>\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
    ></script>\n<style>\n#myDiv {\n  width: 200px;\n  height: 100px;\n  background-color:\
    \ lightblue;\n}\n</style>\n</head>\n<body>\n<div id=\"myDiv\">Hover over me</div>\n\
    <div id=\"output\">Mouse is not over the element.</div>\n<script>\n// Wait for\
    \ the document to be ready\n$(document).ready(function() {\n  // Select the element\
    \ with the id \"myDiv\" and use .hover() to attach hover event handlers\n  $('#myDiv').hover(\n\
    \    function() {\n      // This function is executed when the mouse enters the\
    \ element\n      $('#output').text('Mouse entered the element.');\n    },\n  \
    \  function() {\n      // This function is executed when the mouse leaves the\
    \ element\n      $('#output').text('Mouse left the element.');\n    }\n  );\n\
    });\n</script>\n</body>\n</html>\n```\n\n1.  We include the jQuery library in\
    \ the `<head>` section.\n2.  We have a `<div>` with the id `myDiv` and another\
    \ `<div>` with the id `output`.\n3.  Inside the `<script>` section, we use `$(document).ready()`\
    \ to ensure the code executes.\n4.  We select the element with the id `myDiv`\
    \ and use `.hover()` to attach hover event handlers.\n5.  When the mouse enters\
    \ or leaves the element, the text changes accordingly.\n\nThis example demonstrates\
    \ how to use the `.hover()` method to respond to mouse events.\n\n# .submit()\
    \ (#toc.xhtml_s137a)\n\nThe `.submit()` method is used to handle form submission.\
    \ It allows you to validate data and prevent the default submission.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>Submit Example</title>\n<script src=\"\
    https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n</head>\n<body>\n<form\
    \ id=\"myForm\">\n<label for=\"name\">Name:</label>\n<input type=\"text\" id=\"\
    name\" name=\"name\" required>\n<br>\n<label for=\"email\">Email:</label>\n<input\
    \ type=\"email\" id=\"email\" name=\"email\" required>\n<br>\n<input type=\"submit\"\
    \ value=\"Submit\">\n</form>\n<div id=\"output\"></div>\n<script>\n// Wait for\
    \ the document to be ready\n$(document).ready(function() {\n  // Select the form\
    \ with the id \"myForm\" and use .submit() to capture the submission event\n \
    \ $('#myForm').submit(function(event) {\n    // Prevent the default form submission\n\
    \    event.preventDefault();\n    // Get the values entered in the form\n    const\
    \ name = $('#name').val();\n    const email = $('#email').val();\n    // Display\
    \ the form data in the \"output\" div\n    $('#output').html(`Name: ${name}<br>Email:\
    \ ${email}`);\n  });\n});\n</script>\n</body>\n</html>\n```\n\n1.  We include\
    \ the jQuery library in the `<head>` section of the HTML document.\n2.  We have\
    \ a `<form>` element with the id `myForm` containing two input fields for name\
    \ and email.\n3.  Inside the `<script>` section, we use `$(document).ready()`\
    \ to ensure the code is executed.\n4.  We select the form with the id `myForm`\
    \ and use the `.submit()` method to capture the submission event.\n5.  Within\
    \ the event handler, we prevent the default form submission using `event.preventDefault()`.\n\
    6.  We retrieve the values entered in the name and email fields using `.val()`.\n"
  raw: 'Events play a crucial role in creating interactive and dynamic web applications.
    In this chapter, we will explore event handling with jQuery, an essential aspect
    of web development. We will start with a brief overview of the event model in
    JavaScript to provide a solid foundation for understanding how events work in
    web development.


    # [Structure](#toc.xhtml_s132a)


    In this chapter, we will cover the following topics:


    *   Overview of Event Handling in JavaScript


    *   Introduction to the concept of events in web development


    *   Explanation of how jQuery simplifies event handling


    *   Explanation of various event methods in jQuery, including **`.click()`**,
    **`.hover()`**, **`.submit()`**, and **`.keypress()`**


    *   Demonstrating how to use these methods to handle user interactions


    *   Event delegation: Handling events on dynamically created elements


    *   Using the **`.on()`** method to bind multiple events simultaneously


    *   Explanation of event bubbling and propagation in the DOM


    *   Introduction to event methods like **`.stopPropagation()`** and **`.preventDefault()`**
    for controlling event behavior


    *   Demonstrating how to listen for mouse move events and handle hover events
    using jQuery


    *   Listening for keyboard events


    *   Extracting values from the event object in jQuery


    *   Exploring how to handle events related to HTML forms using jQuery


    # [Understanding Event Handling](#toc.xhtml_s133a)


    The event model in JavaScript allows developers to respond to various interactions
    and activities on a web page. This can include actions like mouse clicks, keyboard
    inputs, form submissions, and more. However, working with raw JavaScript to handle
    events can be cumbersome and complex. This is where jQuery comes in as a powerful
    tool for simplifying event handling and making it more efficient.


    # [jQuery Event Methods](#toc.xhtml_s134a)


    jQuery provides a wide range of event methods that streamline the process of binding
    and triggering events. These methods are designed to simplify event handling,
    making it easier for developers to respond to user interactions effectively. Some
    of the commonly used event methods include:


    # [**`.click()`**](#toc.xhtml_s135a)


    The **`.click()`** method allows you to respond to mouse-click events on specific
    elements. This is often used to create interactive features like buttons and links.


    `<!DOCTYPE html>`


    `<html>`


    `<head>`


    `<title>Click Example</title>`


    `<script src=”https://code.jquery.com/jquery-3.6.0.min.js”></script>`


    `</head>`


    `<body>`


    `<button id=”myButton”>Click me</button>`


    `<div id=”output”>Click the button to see the result.</div>`


    `<script>`


    `// Wait for the document to be ready`


    `$(document).ready(function() {`


    `// Attach a click event handler to the button with the id “myButton”`


    `$(‘#myButton’).click(function() {`


    `// This function will be executed when the button is clicked`


    `$(‘#output’).text(‘Button clicked!’);`


    `});`


    `});`


    `</script>`


    `</body>`


    `</html>`


    1.  We include the jQuery library in the **`<head>`** section of the HTML document.


    2.  We have a button with the id “**`myButton`**” and a **`<div>`** with the id
    “**`output`**” in the HTML body.


    3.  Inside the <script> section, we use **`$(document).ready()`** to ensure that
    the code is executed after the document is fully loaded.


    4.  We select the button with **`$(‘#myButton’)`** and use the .**`click()`**
    method to attach a click event handler to it.


    5.  When the button is clicked, the provided function is executed, and it changes
    the text of the <div> with the id “**`output`**” to “**`Button`** **`clicked`**!”


    This example demonstrates a simple use case of the **`.click()`** method to respond
    to a button click event using jQuery.


    # [**`.hover()`**](#toc.xhtml_s136a)


    The **`.hover()`** method enables you to respond to mouse hover events, which
    occur when the cursor enters and exits an element. This is useful for creating
    interactive tooltips and dropdown menus.


    `<!DOCTYPE html>`


    `<html>`


    `<head>`


    `<title>Hover Example</title>`


    `<script src=”https://code.jquery.com/jquery-3.6.0.min.js”></script>`


    `<style>`


    `#myDiv {`


    `width: 200px;`


    `height: 100px;`


    `background-color: lightblue;`


    `}`


    `</style>`


    `</head>`


    `<body>`


    `<div id=”myDiv”>Hover over me</div>`


    `<div id=”output”>Mouse is not over the element.</div>`


    `<script>`


    `// Wait for the document to be ready`


    `$(document).ready(function() {`


    `// Select the element with the id “myDiv” and use .hover() to attach hover event
    handlers`


    `$(‘#myDiv’).hover(`


    `function() {`


    `// This function is executed when the mouse enters the element`


    `$(‘#output’).text(‘Mouse entered the element.’);`


    `},`


    `function() {`


    `// This function is executed when the mouse leaves the element`


    `$(‘#output’).text(‘Mouse left the element.’);`


    `}`


    `);`


    `});`


    `</script>`


    `</body>`


    `</html>`


    1.  We include the jQuery library in the **`<head>`** section of the HTML document.


    2.  We have **`<div>`** with the id “**`myDiv`**” and another <div> with the id
    “**`output`**” in the HTML body. The “**`myDiv`**” element is styled with CSS.


    3.  Inside the **`<script>`** section, we use **`$(document).ready()`** to ensure
    that the code is executed after the document is fully loaded.


    4.  We select the element with the id “**`myDiv`**” and use the **`.hover()`**
    method to attach both “**`mouseenter`**” and “**`mouseleave`**” event handlers.
    The first function is executed when the mouse enters the element, and the second
    function is executed when the mouse leaves the element.


    5.  When the mouse hovers over “**`myDiv`**,” the “**`Mouse entered the element`**”
    text is displayed in the “**`output`**” div. When the mouse leaves the element,
    the text changes to “**`Mouse left the element`**.”


    This example demonstrates how to use the **`.hover()`** method in jQuery to respond
    to mouse hover events on an element and perform actions when the mouse enters
    or leaves the element.


    # [**`.submit()`**](#toc.xhtml_s137a)


    The **`.submit()`** method is used to handle form submission events. It allows
    you to validate form data and prevent the default form submission if necessary.


    `<!DOCTYPE html>`


    `<html>`


    `<head>`


    `<title>Submit Example</title>`


    `<script src=”https://code.jquery.com/jquery-3.6.0.min.js”></script>`


    `</head>`


    `<body>`


    `<form id=”myForm”>`


    `<label for=”name”>Name:</label>`


    `<input type=”text” id=”name” name=”name” required>`


    `<br>`


    `<label for=”email”>Email:</label>`


    `<input type=”email” id=”email” name=”email” required>`


    `<br>`


    `<input type=”submit” value=”Submit”>`


    `</form>`


    `<div id=”output”></div>`


    `<script>`


    `// Wait for the document to be ready`


    `$(document).ready(function() {`


    `// Select the form with the id “myForm” and use .submit() to capture the form
    submission event`


    `$(‘#myForm’).submit(function(event) {`


    `// Prevent the default form submission`


    `event.preventDefault();`


    `// Get the values entered in the form fields`


    `const name = $(‘#name’).val();`


    `const email = $(‘#email’).val();`


    `// Display the form data in the “output” div`


    ``$(‘#output’).html(`Name: ${name}<br>Email: ${email}`);``


    `});`


    `});`


    `</script>`


    `</body>`


    `</html>`


    1.  We include the jQuery library in the **`<head>`** section of the HTML document.


    2.  We have a **`<form>`** element with the id “**`myForm`**” containing two input
    fields for name and email. There’s also a submit button.


    3.  Inside the <**`script`**> section, we use **`$(document).ready()`** to ensure
    that the code is executed after the document is fully loaded.


    4.  We select the form with the id “**`myForm`**” and use the .**`submit()`**
    method to capture the form submission event. The provided function takes the event
    object as a parameter.


    5.  Within the event handler, we prevent the default form submission using **`event.preventDefault()`**
    to stop the page from reloading.


    6.  We retrieve the values entered in the name and email fields using **`.val()`**.'
