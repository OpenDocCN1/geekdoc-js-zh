    });

    function eleClicker(e){

    console.log(e);

    }

    ```


    ![](img/fig-3.1.jpg)


    **图 3.1：** 练习输出示例


    以下是 JavaScript 代码的解析：


    *   `console.log($(‘div’).first());`: 此行使用 jQuery 选择页面上的第一个 `<div>` 元素并将其打印到控制台。

    *   `const val = ‘<h1>Laurence Svekis</h1>’;`: 此行创建一个 HTML 字符串，其中包含一个文本为 Laurence
    Svekis 的 `<h1>` 元素。

    *   `$(‘div’).first().html(val);`: 此行选择第一个 `<div>` 元素并将其 HTML 内容设置为存储在 `val` 变量中的值（即用
    `<h1>` 元素替换第一个 `<div>` 的内容）。

    *   `$(‘div’).last().text(val);`: 此行选择最后一个 `<div>` 元素并将文本内容设置为存储在 `val` 变量中的值（即将最后一个
    `<div>` 的文本更改为 Laurence Svekis）。

    *   `$(‘div’).click((e) => { … });`: 此代码为所有 `<div>` 元素绑定了点击事件处理器。当点击 `<div>` 时，会执行处理函数。它将被点击的
    `<div>` 的 HTML 内容更改为 `clicked`，将文本内容更改为 `Ready`，然后通过缓慢动画隐藏 `<div>` 元素。

    *   `$(‘button’).click((e) => { … });`: 此代码为按钮元素绑定了点击事件处理器。当点击按钮时，它以快速动画显示所有的
    `<div>` 元素，并以 4000 毫秒（4 秒）的持续时间显示 `<h1>` 元素。

    *   `function eleClicker(e) { … }`: 这似乎是一个定义的函数 `eleClicker`，它接受事件对象 `e` 作为参数，但在提供的代码中没有使用或调用。


    总结来说，JavaScript 代码使用 jQuery 来操作页面上的 HTML 元素，根据用户交互更改它们的内容和行为。代码演示了使用 jQuery 进行基础
    DOM 操控和事件处理。


    ### .toggle(): 在隐藏和显示之间切换


    `.toggle()` 方法允许你在每次点击时切换元素的可见性，为创建如可折叠区域等交互元素提供简单的方法：


    ```javascript

    $(“#toggleElement").toggle();

    ```


    # fadeIn 和 fadeOut 方法


    `.fadeIn()`、`.fadeOut()` 和 `.fadeToggle()` 方法用于在可见和隐藏状态之间创建平滑、渐进的过渡。


    ### .fadeIn(): 渐进出现


    `.fadeIn()` 方法让元素从不可见平滑过渡到完全可见。你可以指定动画时长：


    ```javascript

    $(“#fadeInElement”).fadeIn(1000); // 1000 毫秒（1 秒）

    ```


    ### .fadeOut(): 渐进消失


    相反，`.fadeOut()` 方法让元素逐渐淡出视野。与 `.fadeIn()` 类似，你可以设置动画时长：


    ```javascript

    $(“#fadeOutElement”).fadeOut(1000);

    ```


    ### .fadeToggle(): 切换淡入/淡出


    `.fadeToggle()` 方法在淡入和淡出之间切换。它非常适合创建可切换元素：


    ```javascript

    $(“#fadeToggleElement”).fadeToggle(1000);

    ```


