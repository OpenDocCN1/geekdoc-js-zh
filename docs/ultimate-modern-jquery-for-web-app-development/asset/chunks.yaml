  trans: "\n\n事件在创建交互式和动态 Web 应用中起着至关重要的作用。在本章中，我们将探索使用 jQuery 进行事件处理，这是 Web 开发中的一个重要方面。我们将首先对\
    \ JavaScript 事件模型进行简要概述，为理解事件在 Web 开发中如何工作奠坚实的基础。\n\n# 结构 (#toc.xhtml_s132a)\n\
    \n在本章中，我们将涵盖以下主题：\n\n*   JavaScript 事件处理概述\n*   Web 开发中事件概念介绍\n*   jQuery 如何简化事件处理的说明\n\
    *   jQuery 中各种事件方法的说明，包括 `.click()`、`.hover()`、`.submit()` 和 `.keypress()`\n*\
    \   演示如何使用这些方法处理用户交互\n*   事件委托：处理动态创建的元素上的事件\n*   使用 `.on()` 方法同时绑定多个事件\n*   DOM\
    \ 中事件冒泡和传播的说明\n*   介绍控制事件行为的事件方法，如 `.stopPropagation()` 和 `.preventDefault()`\n\
    *   演示如何使用 jQuery 监听鼠标移动事件并处理悬停事件\n*   监听键盘事件\n*   从 jQuery 的事件对象中提取值\n*   探索如何使用\
    \ jQuery 处理与 HTML 表单相关的事件\n\n# 理解事件处理 (#toc.xhtml_s133a)\n\nJavaScript 中的事件模型允许开发者响应\
    \ Web 页面上的各种交互和活动。这包括鼠标点击、键盘输入、表单提交等操作。然而，使用原生 JavaScript 处理事件可能会非常繁琐且复杂。这就是 jQuery\
    \ 作为一个强大工具大显身场的地方它可以简化事件处理并使其更加高效。\n\n# jQuery 事件方法 (#toc.xhtml_s134a)\n\njQuery\
    \ 提供了广泛的事件方法，简化了绑定和触发事件的流程。这些方法旨在简化事件处理，让开发者更容易有效地响应用户交互。一些常用的事件方法包括：\n\n# .click()\
    \ (#toc.xhtml_s135a)\n\n`.click()` 方法允许你响应特定元素上的鼠标点击事件。这通常用于创建按钮和链接等交互式功能。\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Click Example</title>\n<script\
    \ src=\"https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n</head>\n<body>\n\
    <button id=\"myButton\">Click me</button>\n<div id=\"output\">Click the button\
    \ to see the result.</div>\n<script>\n// Wait for the document to be ready\n$(document).ready(function()\
    \ {\n  // 为 id 为 \"myButton\" 的按钮附加点击事件处理器\n  $('#myButton').click(function()\
    \ {\n    // 当按钮被点击时，将执行此函数\n    $('#output').text('Button clicked!');\n  });\n\
    });\n</script>\n</body>\n</html>\n```\n\n1.  我们在 HTML 文档的 `<head>` 部分中包含了 jQuery\
    \ 库。\n2.  我们在 HTML `<body>` 中有了一个 id 为 `myButton` 的按钮和一个 id 为 `output` 的 `<div>`。\n\
    3.  在`<script>` 区域内部，我们使用 `$(document).ready()` 确保代码在文档完全加载后执行。\n4.  我们使用 `$('#myButton')`\
    \ 选择按钮，并使用 `.click()` 方法为其挂载一个点击事件处理器。\n5.  当点击按钮时，会执行提供的函数，并将 id 为 `output` 的\
    \ `<div>` 文本更改为“Button clicked!”。\n\n此示例演示了使用 jQuery 的 `.click()` 方法响应按钮点击事件的简单用例。\n\
    \n# .hover() (#toc.xhtml_s136a)\n\n`.hover()` 方法允许你响应鼠标悬停事件，该事件在光标进入和离开元素时发生。这对于创建交互式工具提示和下拉菜单非常有用。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Hover Example</title>\n<script\
    \ src=\"https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n<style>\n#myDiv\
    \ {\n  width: 200px;\n  height: 100px;\n  background-color: lightblue;\n}\n</style>\n\
    </head>\n<body>\n<div id=\"myDiv\">Hover over me</div>\n<div id=\"output\">Mouse\
    \ is not over the element.</div>\n<script>\n// Wait for the document to be ready\n\
    $(document).ready(function() {\n  // 选择 id 为 \"myDiv\" 的元素并使用 .hover() 附加悬停事件处理器\n\
    \  $('#myDiv').hover(\n    function() {\n      // 当鼠标进入元素时，执行此函数\n      $('#output').text('Mouse\
    \ entered the element.');\n    },\n    function() {\n      // 当鼠标离开元素时，执行此函数\n\
    \      $('#output').text('Mouse left the element.');\n    }\n  );\n});\n</script>\n\
    </body>\n</html>\n```\n\n1.  我们在 `<head>` 部分包含了 jQuery 库。\n2.  我们有一个 id 为 `myDiv`\
    \ 的 `<div>` 和另一个 id 为 `output` 的 `<div>`。\n3.  在`<script>` 区域内部，我们使用 `$(document).ready()`\
    \ 确保代码执行。\n4.  我们选择 id 为 `myDiv` 的元素并使用 `.hover()` 附加悬停事件处理器。\n5.  当鼠标进入或离开元素时，文本会随之改变。\n\
    \n此示例演示了如何使用 `.hover()` 方法响应鼠标事件。\n\n# .submit() (#toc.xhtml_s137a)\n\n`.submit()`\
    \ 方法用于处理表单提交。它允许你验证数据并阻止默认提交。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Submit\
    \ Example</title>\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
    ></script>\n</head>\n<body>\n<form id=\"myForm\">\n<label for=\"name\">Name:</label>\n\
    <input type=\"text\" id=\"name\" name=\"name\" required>\n<br>\n<label for=\"\
    email\">Email:</label>\n<input type=\"email\" id=\"email\" name=\"email\" required>\n\
    <br>\n<input type=\"submit\" value=\"Submit\">\n</form>\n<div id=\"output\"></div>\n\
    <script>\n// Wait for the document to be ready\n$(document).ready(function() {\n\
    \  // 选择 id 为 \"myForm\" 的表单并使用 .submit() 捕获提交事件\n  $('#myForm').submit(function(event)\
    \ {\n    // 阻止默认表单提交\n    event.preventDefault();\n    // 获取表单输入的值\n    const\
    \ name = $('#name').val();\n    const email = $('#email').val();\n    // 将表单数据显示在\
    \ \"output\" div 中\n    $('#output').html(`Name: ${name}<br>Email: ${email}`);\n\
    \  });\n});\n</script>\n</body>\n</html>\n```\n\n1.  我们在 HTML 文档的 `<head>` 部分中包含了\
    \ jQuery 库。\n2.  我们有一个 id 为 `myForm` 的 `<form>` 元素，包含姓名和邮箱的两个输入字段。\n3.  在`<script>`\
    \ 区域内部，我们使用 `$(document).ready()` 确保代码执行。\n4.  我们选择 id 为 `myForm` 的表单，并使用 `.submit()`\
    \ 方法捕获提交事件。\n5.  在事件处理器中，我们使用 `event.preventDefault()` 阻止默认的表单提交。\n6.  我们使用 `.val()`\
    \ 获取在姓名和邮箱字段中输入的值。\n\n"
- fmt: "\n7. Finally, we display the form data in the “`output`” div.\n\nWhen the\
    \ user submits the form, the data entered in the form fields is captured, and\
    \ their values are displayed in the “`output`” div without the page being reloaded.\
    \ This demonstrates how to use the `.submit()` method in jQuery to capture form\
    \ submission events and handle them as needed.\n\n## .keypress()\n\nThe `.keypress()`\
    \ method is used to capture keyboard input events. You can use it to create features\
    \ like search bars or keyboard shortcuts.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>Keypress Example</title>\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
    ></script>\n</head>\n<body>\n<input type=\"text\" id=\"myInput\">\n<p id=\"output\"\
    >Key pressed: </p>\n<script>\n// Wait for the document to be ready\n$(document).ready(function()\
    \ {\n  // Select the input field with the id “myInput” and use .keypress() to\
    \ capture keypress events\n  $('#myInput').keypress(function(event) {\n    //\
    \ Get the key code of the pressed key\n    const keyCode = event.which;\n    //\
    \ Display the key code in the “output” paragraph\n    $('#output').text('Key pressed:\
    \ ' + keyCode);\n  });\n});\n</script>\n</body>\n</html>\n```\n\n1. Include the\
    \ jQuery library in the `<head>` section of the HTML document.\n2. Have an `<input>`\
    \ element with the id `myInput` where users can type text.\n3. There’s a `<p>`\
    \ element with the id `output` to display information about the key pressed.\n\
    4. Inside the `<script>` section, we use `$(document).ready()` to ensure that\
    \ the code is executed after the document is fully loaded.\n5. Select the input\
    \ field with the id `myInput` and use the `.keypress()` method to capture keypress\
    \ events. The provided function takes the event object as a parameter.\n6. Within\
    \ the event handler, we use `event.which` to get the key code of the pressed key.\n\
    7. Then display the key code in the “output” paragraph.\n\nWhen you type in the\
    \ input field, the key codes of the pressed keys are captured, and their values\
    \ are displayed in the “output” paragraph.\n\n## Mouse Events\n\nIn jQuery, mouse\
    \ events allow developers to respond to user interactions with a web page through\
    \ actions like clicking, hovering, moving, and dragging the mouse cursor, enabling\
    \ the creation of an interactive and engaging user interface.\n\njQuery mouse\
    \ events respond to user mouse interactions like clicks, hovers, drags, and releases.\
    \ Easily attach listeners to HTML elements, executing custom code in response\
    \ to various mouse actions.\n\n## .hover()\n\n**Function**: This method is used\
    \ to assign functions to be executed when the mouse pointer enters and leaves\
    \ an element.\n\n**Explanation**: In the code, all the `<div>` elements with the\
    \ class `box` within the .main container have the `.hover()` method applied. When\
    \ the mouse enters any of these divs, it changes their background color to red,\
    \ and when the mouse leaves, it resets the background color to white.\n\n## .mouseup()\n\
    \nThe `.mouseup()` method in jQuery is used to assign a function that will be\
    \ executed when the mouse button is released (clicked and then released) while\
    \ the pointer is positioned over an HTML element. It allows you to perform actions\
    \ in response to the mouse button being released. For example, you can change\
    \ the appearance or behavior of an element after the user releases a mouse button.\
    \ It’s commonly used for interactive features like buttons or elements that respond\
    \ to clicks. This event can be used in conjunction with `.mousedown()` to create\
    \ click-like functionality where you respond to both mouse button presses and\
    \ releases.\n\n**Function**: This method assigns a function to be executed when\
    \ a mouse button is released over an element.\n\n**Explanation**: In the code,\
    \ when a mouse button is released over any of the `<div>` elements with the class\
    \ `box`, it changes their text content to “MOUSE UP” and the background color\
    \ to blue.\n\n## .mousedown()\n\nThe `.mousedown()` method in jQuery is used to\
    \ assign a function that will be executed when the mouse button is pressed down\
    \ (clicked) while the pointer is positioned over an HTML element. It allows you\
    \ to perform actions in response to the mouse button being pressed. For example,\
    \ you can change the appearance or behavior of an element when the user clicks\
    \ on it. It’s commonly used for creating interactive features, such as button\
    \ clicks or drag-and-drop functionality. This event is often used in conjunction\
    \ with the `.mouseup()` event to create functionality that responds to both mouse\
    \ button presses and releases.\n\n**Function**: This method assigns a function\
    \ to be executed when a mouse button is pressed down over an element.\n\n**Explanation**:\
    \ In the code, when a mouse button is pressed down over any of the `<div>` elements\
    \ with the class `box`, it changes their text content to “MOUSE DOWN” and the\
    \ background color to green.\n\n## .mouseout()\n\nThe `.mouseout()` method in\
    \ jQuery is used to assign a function that will be executed when the mouse pointer\
    \ moves out of an HTML element. It is triggered when the mouse exits the boundaries\
    \ of the selected element. This event is useful for scenarios where you want to\
    \ take action when the user moves their mouse away from a particular area, such\
    \ as hiding a tooltip when the mouse is no longer over the tooltip-triggering\
    \ element. It is the opposite of the `.mouseover()` event, which triggers when\
    \ the mouse enters an element’s boundaries.\n\n**Function**: This method assigns\
    \ a function to be executed when a mouse button leaves the element.\n\n**Explanation**:\
    \ When the mouse pointer leaves the .main container, the text content of the `<div>`\
    \ with the class `div2` changes to “Mouse OUT on MAIN!”.\n\n## .mouseover()\n\n\
    The `.mouseover()` method in jQuery is used to assign a function that will be\
    \ executed when the mouse pointer moves over an HTML element. It is triggered\
    \ when the mouse enters the boundaries of the selected element. This event is\
    \ commonly used to create interactive effects when a user hovers their mouse over\
    \ an element, such as showing tooltips or changing the appearance of an element.\
    \ It is the opposite of the `.mouseout()` event, which triggers when the mouse\
    \ leaves an element’s boundaries.\n\n**Function**: This method assigns a function\
    \ to be executed when the mouse enters the element.\n\n**Explanation**: When the\
    \ mouse enters the .main container, the text content of the `<div>` with the class\
    \ `div2` changes to “Mouse OVER on MAIN!”.\n\n## .mouseleave()\n\nThe `.mouseleave()`\
    \ method in jQuery is used to assign a function that will be executed when the\
    \ mouse pointer leaves the boundaries of an HTML element. It is triggered when\
    \ the mouse exits the area of the selected element. This event is commonly used\
    \ to create interactive effects when a user moves their mouse out of an element,\
    \ such as hiding tooltips or restoring the element’s original appearance. It is\
    \ the opposite of the `.mouseenter()` event, which triggers when the mouse enters\
    \ an element’s boundaries.\n\n**Function**: This method assigns a function to\
