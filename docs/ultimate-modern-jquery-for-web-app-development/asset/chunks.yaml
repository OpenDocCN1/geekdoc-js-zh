    \  adder(html);\n}\n```\n2. 在 divs 上添加 `mouseup()` 和 `mousedown()`，在不同的鼠标状态下更新文本和背景颜色。\n\
    ```javascript\n$('input').mouseup(function() {\n  $(this).text('MOUSE UP');\n\
