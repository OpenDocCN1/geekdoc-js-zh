  trans: "\n\n7. 最后，我们在“`output`”div 中显示表单数据。\n\n当用户提交表单时，表单字段输入的数据会被捕获，并在不刷新页的情况下显示在“`output`”div\
    \ 中。这演示了如何使用 jQuery 的 `.submit()` 方法捕获表单提交事件并根据需要进行处理。\n\n## .keypress()\n\n`.keypress()`\
    \ 方法用于捕捉键盘输入事件。你可以使用它创建如搜索栏或键盘快捷键的功能。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>Keypress Example</title>\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
    ></script>\n</head>\n<body>\n<input type=\"text\" id=\"myInput\">\n<p id=\"output\"\
    >Key pressed: </p>\n<script>\n// 等待文档就绪\n$(document).ready(function() {\n  //\
    \ 选择 id 为“myInput”的输入字段并使用 .keypress() 捕获按键事件\n  $('#myInput').keypress(function(event)\
    \ {\n    // 获取按下按键的键码\n    const keyCode = event.which;\n    // 在“output”段落中显示键码\n\
    \    $('#output').text('Key pressed: ' + keyCode);\n  });\n});\n</script>\n</body>\n\
    </html>\n```\n\n1. 在 HTML 文档的 `<head>` 部分引入 jQuery 库。\n2. 有一个 id 为 `myInput` 的\
    \ `<input>` 元素，用户可以在其中输入文本。\n3. 有一个 id 为 `output` 的 `<p>` 元素，用于显示关于按下键的信息。\n4.\
    \ 在 `<script>` 部分，我们使用 `$(document).ready()` 确保代码在文档完全加载后执行。\n5. 选择 id 为 `myInput`\
    \ 的输入字段，并使用 `.keypress()` 方法捕获按键事件。提供的函数接收事件对象作为参数。\n6. 在事件处理器内部，我们使用 `event.which`\
    \ 获取按下按键的键码。\n7. 然后在“output”段落中显示该键码。\n\n当你在输入字段中打字时，按下按键的键码会被捕获，其值将显示在“output”段落中。\n\
    \n## 鼠标事件\n\n在 jQuery 中，鼠标事件允许开发者通过点击、悬停、移动和拖动鼠标指针等操作响应用户与网页的交互，从而创建出交互性且吸引人的用户界面。\n\
    \njQuery 鼠标事件响应用户的鼠标交互，如点击、悬停、拖动和释放。可以轻松地为 HTML 元素绑定监听器，响应各种鼠标动作执行自定义代码。\n\n##\
    \ .hover()\n\n**功能**：此方法用于分配在鼠标指针进入和离开元素时执行的函数。\n\n**解释**：在代码中，.main 容器内所有类为 `box`\
    \ 的 `<div>` 元素都应用了 `.hover()` 方法。当鼠标进入这些 div 中的任意一个，背景颜色会变为红色；当鼠标离开时，背景颜色将重置为白色。\n\
    \n## .mouseup()\n\njQuery 中的 `.mouseup()` 方法用于分配一个函数，当指针位于 HTML 元素上并释放鼠标按钮（点击后释放）时执行该函数。它允许你执行响应鼠标按钮释放的操作。例如，你可以在用户释放鼠标按钮后更改元素的外观或行为。它通常用于按钮或响应点击的元素的交互功能。此事件可以与\
    \ `.mousedown()` 结合使用，创建类似点击的功能，即同时对鼠标按钮的按下和释放做出响应。\n\n**功能**：此方法分配一个在元素上释放鼠标按钮时执行的函数。\n\
    \n**解释**：在代码中，当鼠标按钮在任何类为 `box` 的 `<div>` 元素上释放时，它会将它们的文本内容改为“MOUSE UP”并将背景颜色变为蓝色。\n\
    \n## .mousedown()\n\njQuery 中的 `.mousedown()` 方法用于分配一个函数，当指针位于 HTML 元素上并按下鼠标按钮（点击）时执行该函数。它允许你执行响应鼠标按钮按下的操作。例如，当用户点击元素时，你可以更改元素的外观或行为。它通常用于创建交互功能，如按钮点击或拖放功能。此事件经常与\
    \ `.mouseup()` 事件结合使用，以创建同时对鼠标按钮按下和释放做出响应的功能。\n\n**功能**：此方法分配一个在元素上按下鼠标按钮时执行的函数。\n\
    \n**解释**：在代码中，当鼠标按钮在任何类为 `box` 的 `<div>` 元素上按下时，它会将它们的文本内容改为“MOUSE DOWN”并将背景颜色变为绿色。\n\
    \n## .mouseout()\n\njQuery 中的 `.mouseout()` 方法用于分配一个在鼠标指针移出 HTML 元素时执行的函数。它在鼠标离开所选元素边界时触发。此事件对于你希望在用户鼠标离开特定区域时采取操作的场景非常有用，例如当鼠标不再悬停在触发提示框的元素上时隐藏提示框。它是\
    \ `.mouseover()` 事件的反相反，后者在鼠标进入元素边界时触发。\n\n**功能**：此方法分配一个在鼠标按钮离开元素时执行的函数。\n\n\
    **解释**：当鼠标指针离开 .main 容器时，类为 `div2` 的 `<div>` 文本内容将变为“Mouse OUT on MAIN!”.\n\n\
    ## .mouseover()\n\njQuery 中的 `.mouseover()` 方法用于分配一个在鼠标指针移动到 HTML 元素上时执行的函数。它在鼠标进入所选元素边界时触发。此事件通常用于在用户悬停在元素上时创建交互效果，例如显示提示框或更改元素的外观。它是\
    \ `.mouseout()` 事件的反相反，后者在鼠标离开元素边界时触发。\n\n**功能**：此方法分配一个在鼠标进入元素时执行的函数。\n\n**解释**：当鼠标进入\
    \ .main 容器时，类为 `div2` 的 `<div>` 文本内容将变为“Mouse OVER on MAIN!”.\n\n## .mouseleave()\n\
    \njQuery 中的 `.mouseleave()` 方法用于分配一个在鼠标指针离开 HTML 元素边界时执行的函数。它在鼠标离开所选区域时触发。此事件通常用于在用户鼠标移出元素时创建交互效果，例如隐藏提示框或恢复元素的原始外观。它是\
    \ `.mouseenter()` 事件的反相反，后者在鼠标进入元素边界时触发。\n\n**功能**：此方法分配一个在鼠标离开元素时执行的函数。\n\n**解释**：当鼠标指针离开\
    \ .main 容器时，类为 `div3` 的 `<div>` 文本内容将变为“Mouse LEFT on MAIN!”.\n\n## .mouseenter()\n\
    \n"
- fmt: "\nThe `.mouseenter()` method in jQuery is used to assign a function that will\
    \ be executed when the mouse pointer enters the boundaries of an HTML element.\
    \ It is triggered when the mouse hovers over selected element. This event is commonly\
