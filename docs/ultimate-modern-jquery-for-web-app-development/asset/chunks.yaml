  raw: '1.  **`$(‘.selected’)`** selects the element with the class “**`selected`**.”


    2.  **`.next()`** selects the next sibling element in the DOM, which is then highlighted
    by adding the “**`highlighted`**” class.


    3.  Similarly, you can use **`.prev()`** to select the previous sibling element.


    **Benefits of **`.next()`** and **`.prev()`**:**


    *   **Precise Selection:** These methods allow you to precisely target elements
    that are adjacent to a specific element, simplifying complex DOM interactions.


    *   **Sequential Actions:** You can easily perform sequential actions on elements
    within the same parent container.


    *   **Readable Code:** Code readability is improved, as the intention of selecting
    adjacent elements is clear.


    *   **Efficient Traversal:** jQuery optimizes the traversal process, making it
    efficient for navigating sibling elements.


    In summary, the **`.next()`** and **`.prev()`** methods are valuable for selecting
    and interacting with sibling elements in the DOM, enabling you to create dynamic
    and responsive web pages with ease.


    # [Exercise: Traversing Siblings Page Elements and Other Selections with jQuery](#toc.xhtml_s109a)


    In this exercise, you will work with various sibling methods in jQuery to traverse
    elements at the same level as siblings of the selected element. You will apply
    different classes to these elements to see the effects of the traversal methods.


    **Instructions:**


    1.  Apply a class of “**`box`**” to all siblings of the selected element when
    the first button is clicked.


    2.  Add an event listener to the second button to remove all elements with the
    class “**`box`**” when clicked.


    3.  When the third button is clicked, add a class of “**`box`**” to siblings of
    an element that have a tag name of “div.”


    4.  On a button click, use the **`next()`**, **`nextAll()`**, and **`nextUntil()`**
    methods on page elements and apply classes to the selected elements.


    5.  On another button click, use the **`prev()`**, **`prevAll()`**, and **`prevUntil()`**
    methods on page elements and apply classes to the matching elements.


    **CSS**


    `.box {`


    `border: 1px solid #ddd;`


    `adding: 5px;`


    `color: red;`


    `}`


    `.box1 {`


    `border: 1px solid #ddd;`


    `ppadding: 5px;`


    `color: blue;`


    `}`


    `.box2 {`


    `border: 1px solid #ddd;`


    `padding: 5px;`


    `color: green;`


    `}`


    **HTML:**


    `<nav>`


    `<div class=”main”>`


    `<div xclass=”div1”>Hello World 1</div>`


    `<div class=”div2”><span>Hello World 2</span></div>`


    `<div class=”div3” id=”div3”>Hello World 3</div>`


    `<div class=”div4”>Laurence Svekis</div>`


    `<input>`


    `<button id=”btn1”>1</button>`


    `<button id=”btn2”>2</button>`


    `<button id=”btn3”>3</button>`


    `<span>Hello</span>`


    `</div>`


    `</nav>`


    `<button id=”btn4”>4</button>`


    `<button id=”btn5”>5</button>`


    **JavaScript Code:**


    `$(‘#btn1’).click(() => {`


    `const siblings = $(‘#btn1’).siblings();`


    `console.log(siblings);`


    `siblings.addClass(‘box’);`


    `});`


    `$(‘#btn2’).click(() => {`


    `$(‘.box’).removeClass(‘box’);`


    `});`


    `$(‘#btn3’).click(() => {`


    `$(‘#btn1’).siblings(‘div’).addClass(‘box’);`


    `});`


    `$(‘#btn4’).click(() => {`


    `$(‘#btn1’).next().addClass(‘box’);`


    `$(‘#btn1’).nextAll(‘span’).addClass(‘box’);`


    `$(‘#div3’).nextUntil(‘button’).addClass(‘box1’);`


    `});`


    `$(‘#btn5’).click(() => {`


    `$(‘#btn1’).prev().addClass(‘box2’);`


    `$(‘#btn1’).prevAll(‘span’).addClass(‘box2’);`


    `$(‘#div3’).prevUntil(‘button’).addClass(‘box2’);`


    `});`


    This exercise helps you become more familiar with jQuery’s sibling traversal methods
    and demonstrates how to apply them to elements on the same level in the DOM hierarchy.
    You’ll be able to see how different methods work in selecting and manipulating
    sibling elements.


    # [Filtering Page Elements to Select them with jQuery](#toc.xhtml_s110a)


    In this section, we’ll dive into the **`.filter()`** method in jQuery. This method
    allows you to refine a selection based on a given condition, enabling you to select
    elements that meet specific criteria within a larger set of elements. This is
    incredibly useful when you want to narrow down your selection to elements that
    match certain conditions.


    **Understanding **`.filter()`****


    Consider a scenario where you have a list of tasks represented by **`<li>`** elements,
    and you want to select and add a “**`completed-task`**” class to those tasks that
    contain the text “**`completed`**.” Here’s how you can achieve this using the
    **`.``fi``lter()`** method:


    **Example:**


    `// Select all ‘li’ elements containing the text ‘completed’`


    `$(‘li’).filter(function () {`


    `return $(this).text() === ‘completed’;`


    `}).addClass(‘completed-task’);`


    In the preceding example:


    1.  **`$(‘li’)`** selects all **`<li>`** elements on the page.


    2.  **`.filter(function () {…})`** applies a filter to the selection, evaluating
    the provided function for each element.


    3.  **`return $(this).text() === ‘completed’;`** checks if the text content of
    each `<li>` element equals `“completed`.”


    4.  **`.addClass(‘completed-task’)`** adds the `“completed-task”` class to elements
    that meet the filter condition.


    **Benefits of **`.``fi``lter()`**:**


    *   **Selective Targeting:** **`.``fi``lter()`** allows you to selectively target
    elements within a larger set based on specific conditions, making your selection
    more precise.


    *   **Dynamic Filtering:** You can dynamically filter elements based on changing
    conditions or user interactions.


    *   **Readability:** Code readability is enhanced because the filter condition
    is clearly defined within the function.


    *   **Efficiency:** jQuery optimizes the filtering process, ensuring efficient
    selection of elements.


    In summary, the **`.``fi``lter()`** method is a powerful tool for refining your
    element selection based on specific conditions or criteria, giving you fine-grained
    control over the elements you manipulate on your web page.


    # [Selecting Elements Based on Visibility and State](#toc.xhtml_s111a)


    In this section, we’ll explore how to select elements in jQuery based on their
    visibility using the **`:visible`** and **`:hidden`** selectors. These selectors
    are incredibly useful for targeting elements that are currently displayed or hidden
    on a web page, allowing you to apply specific actions or styles to them.


    **Understanding **`:visible`** and **`:hidden`****


    Consider a scenario where you have a webpage with multiple **`<div>`** elements,
    some of which are visible and others hidden. You want to select all the visible
    **`<div>`** elements and change their background color to green. Here’s how you
    can do it using the `:visible` selector:


    **Example:**


    `// Select all visible ‘div’ elements`


    `$(‘div:visible’).css(‘background-color’, ‘green’);`


    In the preceding example:


    1.  **`$(‘div:visible’)`** selects all **`<div>`** elements that are currently
    visible on the page.


    2.  **`.css(‘background-color’, ‘green’)`** changes the background color of the
    selected visible **`<div>`** elements to green.


    3.  You can similarly use **`:hidden`** to select elements that are currently
    hidden.


    **Benefits of :visible and :hidden:**


    *   **Visibility Control:** These selectors are invaluable for interacting with
    elements based on their current visibility state.


    *   **Dynamic Handling:** You can dynamically respond to changes in element visibility,
    making your website more interactive.


    *   **Efficiency:** jQuery efficiently identifies visible and hidden elements,
    optimizing performance.


    *   **User Experience:** Using these selectors, you can enhance the user experience
    by applying different styles or actions based on what the user can see.


    In summary, the `:visible` and `:hidden` selectors in jQuery are powerful tools
    for selecting elements based on their visibility, enabling you to create responsive
    and dynamic web pages that adapt to user interactions and content changes.


    **Exercise: Dynamic Page Elements with jQuery**'
