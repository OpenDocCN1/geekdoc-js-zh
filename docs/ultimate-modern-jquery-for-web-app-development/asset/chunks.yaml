    \ Get the Dimensions of Page Elements with jQuery Methods](#toc.xhtml_s99a)\n\n\
    In this exercise, we will explore how to get the dimensions and properties of\
    \ page elements using jQuery. You will add a class to page elements and use event\
    \ handlers to display various dimensions and properties when elements are clicked.\
    \ Additionally, you will use buttons to display window and document height and\
    \ width values in the console.\n\n**Instructions:**\n\n1.  Add a class to the\
    \ page elements to apply some common styling.\n\n2.  Add a click event to the\
    \ div elements on the page. When an element is clicked, display within that element\
    \ the following dimensions and properties:\n\n    *   Width\n\n    *   Height\n\
    \n    *   Inner Width\n\n    *   Inner Height\n\n    *   Outer Width\n\n    *\
    \   Outer Height\n\n    *   Outer Width (including margins)\n\n    *   Outer Height\
    \ (including margins)\n\n3.  Add a click event to the button with the id “**`btn1`**”\
    \ to display in the console the following window and document dimensions:\n\n\
    \    *   Document Width\n\n    *   Window Width\n\n    *   Document Height\n\n\
    \    *   Window Height\n\n**CSS**\n\n`.box {`\n\n`width: 200px;`\n\n`border: 5px\
    \ solid #ddd;`\n\n`padding: 20px;`\n\n`margin: 10px;`\n\n`}`\n\n**HTML**\n\n`<div\
    \ class=”div1”>Hello World 1</div>`\n\n`<div class=”div2”>Hello World 2</div>`\n\
    \n`<div class=”div3” id=”div3”>Hello World 3</div>`\n\n`<div class=”div4”>Laurence\
    \ Svekis</div>`\n\n`<input>`\n\n`<button id=”btn1”>1</button>`\n\n**JavaScript\
    \ Code**\n\n`$(‘div’).addClass(‘box’).click(function () {`\n\n``let html = `<div>Width\
    \ : ${$(this).width()}</div>`;``\n\n``html += `<div>Height : ${$(this).height()}</div>`;``\n\
    \n``html += `<div>Inner Width : ${$(this).innerWidth()}</div>`;``\n\n``html +=\
    \ `<div>Inner Height : ${$(this).innerHeight()}</div>`;``\n\n``html += `<div>Outer\
    \ Width : ${$(this).outerWidth()}</div>`;``\n\n``html += `<div>Outer Height :\
    \ ${$(this).outerHeight()}</div>`;``\n\n``html += `<div>Outer Width (incl.`` ``margins)\
    \ : ${$(this).outerWidth(true)}</div>`;``\n\n``html += `<div>Outer Height (incl.``\
    \ ``margins) : ${$(this).outerHeight(true)}</div>`;``\n\n`$(this).html(html);`\n\
    \n`});`\n\n`$(‘#btn1’).click(() => {`\n\n``console.log(`Document Width: ${$(document).width()}px`);``\n\
    \n``console.log(`Window Width: ${$(window).width()}px`);``\n\n``console.log(`Document\
    \ Height: ${$(document).height()}px`);``\n\n``console.log(`Window Height: ${$(window).height()}px`);``\n\
    \n`});`\n\nIn this exercise, you’ll learn how to retrieve and display various\
    \ dimensions and properties of HTML elements using jQuery, enhancing your understanding\
    \ of how to interact with the DOM.\n\n# [Conclusion](#toc.xhtml_s100a)\n\nIn this\
    \ chapter, we explored the power of jQuery in manipulating the appearance and\
    \ attributes of web elements. We also understood how to use various jQuery methods\
    \ to modify CSS properties, such as changing background colors with **`.css()`**.\
    \ Additionally, we also learned the techniques for getting and setting element\
    \ attributes using **`.attr()`**, adding or removing CSS classes with **`.addClass()`**\
    \ and **`.removeClass()`**, and toggling classes on and off with **`.toggleClass()`**.\n\
    \nWe also learned how to navigate and select specific page elements with precision.\
    \ In the next chapter, we will cover techniques such as using **`.find()`** to\
    \ select descendant elements, **`.closest()`** to find the nearest matching ancestor,\
    \ **`.next()`** and **`.prev()`** to choose sibling elements, and **`.filter()`**\
    \ to refine selections based on conditions. You’ll also discover how to select\
    \ elements based on their visibility and state using :visible and :hidden selectors.\n\
    \n# [Multiple Choice Questions](#toc.xhtml_s101a)\n\n1.  Which jQuery method is\
    \ used to modify the appearance of page elements by changing their CSS properties?\n\
    \n    1.  `.text()`\n\n    2.  `.addClass()`\n\n    3.  `.css()`\n\n    4.  `.attr()`\n\
    \n2.  How can you set the value of a selected attribute for an element using jQuery?\n\
    \n    1.  `.attr()`\n\n    2.  `.css()`\n\n    3.  `.addClass()`\n\n    4.  `.toggleClass()`\n\
    \n3.  What is the purpose of the **`.addClass()`** method in jQuery?\n\n    1.\
    \  To remove a class from selected elements\n\n    2.  To toggle a class on and\
    \ off for selected elements\n\n    3.  To add a class to selected elements\n\n\
    \    4.  To retrieve the CSS properties of selected elements\n\n4.  Which jQuery\
    \ method is used to toggle a class on and off for selected elements?\n\n    1.\
    \  `.toggleClass()`\n\n    2.  `.removeClass()`\n\n    3.  `.addClass()`\n\n \
    \   4.  `.attr()`\n\n5.  In jQuery, how can you modify the dimensions of an element?\n\
    \n    1.  By using the `.css()` method\n\n    2.  By using the `.attr()` method\n\
    \n    3.  By using the `.addClass()` method\n\n    4.  By using the `.toggleClass()`\
    \ method\n\n# [Answers](#toc.xhtml_s102a)\n\n1.  c) `.css()`\n\n2.  a) `.attr()`\n\
    \n3.  c) To add a class to selected elements\n\n4.  a) `.toggleClass()`\n\n5.\
    \  a) By using the `.css()` method\n\n# [CHAPTER 8](#toc.xhtml_c08)\n\n# [Traversing\
    \ Page Elements](#toc.xhtml_c08)\n\n# [Introduction](#toc.xhtml_s103a)\n\nIn this\
    \ chapter, we will explore advanced techniques for traversing and selecting page\
    \ elements using jQuery. These methods allow you to navigate the DOM tree efficiently\
    \ and select specific elements based on their relationships, attributes, and states.\n\
    \n# [Structure](#toc.xhtml_s104a)\n\nIn this chapter, we will cover the following\
    \ topics:\n\n*   Traversing descendants of page elements with jQuery\n\n*   Traversing\
    \ ancestors of page elements with jQuery\n\n*   Traversing siblings of page elements\
    \ with jQuery\n\n*   Filtering page elements to select them with jQuery\n\n# [Traversing\
    \ Descendants of Page Elements with jQuery](#toc.xhtml_s105a)"
