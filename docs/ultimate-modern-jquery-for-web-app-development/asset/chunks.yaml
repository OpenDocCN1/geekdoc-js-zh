  trans: "\n使用 `detach()` 方法移除一个元素并将其保存到全局变量中。然后在一个另一个事件中，将存储的脱离元素重新附加到页面。注意，事件和属性仍然包含在该元素中。\n\
    \n### CSS:\n\n```css\n.red {\n  color: red;\n  font-size: 0.9em;\n}\n.blue {\n\
    \  background-color: blue;\n}\n.box {\n  width: 200px;\n  height: 35px;\n  border:\
    \ 1px solid #ddd;\n}\n```\n\n### HTML:\n\n```html\n<div class=\"div1\">Hello World\
    \ 1</div>\n<div class=\"div2\">Hello World 2</div>\n<div class=\"div3\" id=\"\
    div3\">Hello World 3</div>\n<div class=\"div4\">Laurence Svekis</div>\n<input>\n\
    <button id=\"btn1\">1</button>\n<button id=\"btn2\">2</button>\n```\n\n### JavaScript\
    \ 代码:\n\n```javascript\nlet counter = 0;\nconst arr = [];\nfor (let i = 0; i <\
    \ 5; i++) {\n  $('input>').attr({\n    type: 'checkbox',\n    value: i,\n    checked:\
    \ 'checked'\n  }).appendTo('.div3').click(function () {\n    checkerInput($(this));\n\
    \  });\n}\nfor (let i = 0; i < 5; i++) {\n  $ele = $('<input>');\n  $ele.attr({\n\
    \    type: 'checkbox',\n    value: i\n  }).appendTo('.div4');\n  $ele.prop('checked',\
    \ true);\n  $ele.click(function () {\n    checkerInput($(this));\n  });\n}\nfunction\
    \ checkerInput($el) {\n  let temp = '';\n  temp += `<div>Attr : ${$el.attr('checked')}</div>`;\n\
    \  temp += `<div>Prop : ${$el.prop('checked')}</div>`;\n  temp += `<div>Is : ${$el.is(':checked')}</div>`;\n\
    \  $('.div1').html(temp);\n}\n$('.div2').click(function () {\n  counter++;\n \
    \ $('.div1').html(`<div>Counter ${counter}</div>`);\n});\n$('.div2').click(function\
    \ () {\n  console.log($(this).attr('id'));\n  const ran = Math.floor(Math.random()\
    \ * 100);\n  $(this).attr('id', `id${ran}`);\n});\n$('#btn1').click(() => {\n\
    \  if (arr.length > 0) {\n    $ele = arr.shift();\n    $('.div4').append($ele);\n\
    \  }\n  $('input').attr({\n    type: 'number',\n    min: '0',\n    max: '10',\n\
    \    value: '5'\n  });\n});\n$('#btn2').click(() => {\n  $ele = $('.div1').detach();\n\
    \  arr.push($ele);\n});\n```\n\n在此练习中，你将处理复选框、属性和元素操作，以更好地理解如何使用 jQuery 完成这些任务。\n\
    \n请注意，第二组 HTML 复选框在检查 checked 选项上将返回 `undefined`，因为属性 `'checked'` 不在对象中。\n\n#\
    \ 练习：使用 jQuery 方法获取页面元素的尺寸\n\n在此练习中，我们将探索如何使用 jQuery 获取页面元素的尺寸和属性。你将为页面元素添加类，并使用事件处理器在元素被点击时显示各种尺寸和属性。此外，你将使用按钮在控制台中显示窗口和文档的高度及宽度值。\n\
    \n### 指南：\n\n1. 为页面元素添加一个类以应用一些常用样式。\n2. 为页面上的 div 元素添加点击事件。当元素被点击时，在元素内部显示以下尺寸和属性：\n\
    \    * 宽度 (Width)\n    * 高度 (Height)\n    * 内部宽度 (Inner Width)\n    * 内部高度 (Inner\
    \ Height)\n    * 外部宽度 (Outer Width)\n    * 外部高度 (Outer Height)\n    * 外部宽度（包括外边距\
    \ Outer Width including margins）\n    * 外部高度（包括外边距 Outer Height including margins）\n\
    3. 为 id 为 `btn1` 的按钮添加点击事件，在控制台中显示以下窗口和文档尺寸：\n    * 文档宽度 (Document Width)\n  \
    \  * 窗口宽度 (Window Width)\n    * 文档高度 (Document Height)\n    * 窗口高度 (Window Height)\n\
    \n### CSS\n\n```css\n.box {\n  width: 200px;\n  border: 5px solid #ddd;\n  padding:\
    \ 20px;\n  margin: 10px;\n}\n```\n\n### HTML\n\n```html\n<div class=\"div1\">Hello\
    \ World 1</div>\n<div class=\"div2\">Hello World 2</div>\n<div class=\"div3\"\
    \ id=\"div3\">Hello World 3</div>\n<div class=\"div4\">Laurence Svekis</div>\n\
    ```\n"
- fmt: "\nIn this section, we’ll delve into the powerful `.find()` method in jQuery.\
    \ This method allows you to traverse the DOM tree and select descendant elements\
    \ of a selected element. This is particularly useful when you’re dealing with\
    \ complex HTML structures and you need to narrow down your selection to elements\
    \ within a specific container or context.\n\n### Understanding `.find()`\n\nConsider\
    \ a scenario where you have a `<div>` with a class `'container’` that contains\
    \ multiple `<p>` elements, and you want to change the text color of all those\
    \ paragraphs to blue. Here’s how you can use the method:\n\n**Example:**\n\n```javascript\n\
    // Select all ‘p’ elements within a ‘div’ with the class ‘container’\n$(‘container’).find-‘p’).css-‘color’,\
    \ ‘blue’);\n```\n\nIn the preceding example:\n\n1. `$(‘container’)` selects the\
    \ `<div>` element with the class `container`.\n2. `.find-‘p’)` traverses down\
    \ the DOM tree to find all `<p>` elements that are descendants of the selected\
    \ `<div>`.\n3. `.css-‘color’, ‘blue’)` sets the text color of all found `<p>`\
    \ elements to blue.\n\n### Benefits of `.find()`:\n\n* **Contextual Selection:**\
    \ `.find()` allows you to work within a specific context or container, ensuring\
    \ that you only affect the elements you intend to manipulate.\n* **Nested Structures:**\
    \ When dealing with nested HTML structures, `.find()` simplifies the process of\
    \ selecting elements deeply nested within parent elements.\n* **Efficient Traversal:**\
    \ jQuery optimizes the traversal process, making it efficient for complex DOM\
    \ trees.\n* **Chaining:** You can chain multiple jQuery methods together for more\
    \ complex operations.\n\nIn summary, the `.find()` method is a valuable tool for\
    \ selecting and manipulating descendant elements within a specified context, providing\
    \ greater control and precision in your web development projects.\n\n# # Exercise:\
    \ Traversing Descendants of Page Elements with jQuery Selection\n\nIn this exercise,\
    \ we will practice selecting an element and then navigating down to the descendants\
    \ of the selected element using jQuery. You will learn how to access the children\
    \ and descendants of a specific element and apply CSS styling to them.\n\n###\
    \ Instructions:\n\n1. Select an element with the class `main` and output its children\
    \ into the console when the first button is clicked.\n2. Add an event listener\
    \ to the second button. When it is clicked, get the input value from the text\
    \ field, and then search for that selector element within the `main` element.\
    \ Apply a CSS style to the found elements (for example, change their color to\
    \ blue).\n3. When the third button is clicked, select all descendants of an element\
    \ with the class `main` using the wildcard `*` and the find method. Apply CSS\
    \ styling (for example, set their background color to purple).\n\n### CSS:\n\n\
    ```css\n.box {\n  width: 200px;\n  border: 5px solid #ddd;\n  padding: 20px;\n\
    \  margin: 10px;\n}\n```\n\n### HTML:\n\n```html\n<div class=”main”>\n  <div class=”div1”>Hello\
    \ World 1</div>\n  <div class=”div2”><span>Hello World 2</span></div>\n  <div\
    \ class=”div3” id=”div3”>Hello World 3</div>\n  <div class=”div4”>Laurence Svekis</div>\n\
    \  <input>\n  <div>\n    <button id=”btn1”>1</button>\n    <button id=”btn2”>2</button>\n\
    \  </div>\n  <button id=”btn3”>3</button>\n</div>\n```\n\n### JavaScript Code:\n\
    \n```javascript\n$(‘#btn1’).click(() => {\n  const children = $(‘main’).children();\n\
    \  console.log(children);\n});\n\n$(‘#btn2’).click(() => {\n  const sel = $(‘input’).val();\n\
    \  if (sel) {\n    console.log(sel);\n    $(‘main’).find(sel).css-‘color’, ‘blue’);\n\
    \  }\n});\n\n$(‘#btn3’).click(() => {\n  $(‘main div’).find-‘*’).css-‘background-color’,\
    \ ‘purple’);\n});\n```\n\nIn this exercise, you’ll practice traversing the DOM\
    \ to select children and descendants of a specific element within the page using\
    \ jQuery, helping you become more proficient in manipulating and styling elements\
    \ based on their relationships in the DOM hierarchy. Each of the 3 buttons will\
    \ perform a different action, interacting with the page elements.\n\n#### Button\
    \ 1 (`#btn1`) Click Event:\n\nWhen the button with `id=”btn1”` is clicked, the\
    \ code retrieves all child elements of the div with the class `main`. It then\
    \ logs these child elements to the console.\n\nWhen the button with `id=”btn2”`\
    \ is clicked, the code first gets the value entered in the input field. If there\
    \ is a value (`sel`), it searches within the `div.main` for elements that match\
    \ the selector provided in the input field. It then changes the text color of\
    \ these matched elements to blue. This allows dynamic selection based on the user’s\
    \ input. For example, if the user inputs `.div1`, the text color of the first\
    \ div inside the main.\n\nWhen the button with `id=”btn3”` is clicked, select\
    \ all descendants of an element with the class `main` using the wildcard `*` and\
    \ the find method. Apply CSS styling (for example, set their background color\
    \ to purple).\n\n# # Traversing Ancestors of Page Elements with jQuery Selection\n\
    \nIn this section, we’ll delve into the powerful `.find()` method in jQuery. This\
    \ method allows you to traverse the DOM tree and select descendant elements of\
    \ a selected element. This is particularly useful when you’re dealing with complex\
    \ HTML structures and you need to narrow down your selection to elements within\
    \ a specific container or context.\n\n### Understanding `.find()`\n\nConsider\
    \ a scenario where you have a `<div>` with a class `'container’` that contains\
    \ multiple `<p>` elements, and you want to change the text color of all those\
    \ paragraphs to blue. Here’s how you can use the method:\n\n**Example:**\n\n```javascript\n\
    // Select all ‘p’ elements within a ‘div’ with the class ‘container’\n$(‘container’).find-‘p’).css-‘color’,\
    \ ‘blue’);\n```\n\nIn the preceding example:\n\n1. `$(‘container’)` selects the\
    \ `<div>` element with the class `container`.\n2. `.find-‘p’)` traverses down\
    \ the DOM tree to find all `<p>` elements that are descendants of the selected\
    \ `<div>`.\n3. `.css-‘color’, ‘blue’)` sets the text color of all found `<p>`\
    \ elements to blue.\n\n### Benefits of `.find()`:\n\n* **Contextual Selection:**\
    \ `.find()` allows you to work within a specific context or container, ensuring\
    \ that you only affect the elements you intend to manipulate.\n* **Nested Structures:**\
    \ When dealing with nested HTML structures, `.find()` simplifies the process of\
    \ selecting elements deeply nested within parent elements.\n* **Efficient Traversal:**\
    \ jQuery optimizes the traversal process, making it efficient for complex DOM\
    \ trees.\n* **Chaining:** You can chain multiple jQuery methods together for more\
    \ complex operations.\n\nIn summary, the `.find()` method is a valuable tool for\
    \ selecting and manipulating descendant elements within a specified context, providing\
    \ greater control and precision in your web development projects.\n\n# # Traversing\
    \ Siblings of Page Elements with jQuery\n\nIn this section, we’ll explore the\
    \ `.next()` and `.prev()` methods in jQuery, which are used to select the next\
    \ or previous sibling elements of a given element. These methods enable you to\
    \ perform actions on adjacent elements in the DOM tree, which can be especially\
    \ useful when you need to manipulate elements that share the same parent.\n\n\
    ### Understanding `.next()` and `.prev()`\n\nConsider a scenario where you have\
    \ a list of elements and you want to highlight the element following a specific\
    \ element with the class `'selected’` when a certain condition is met. Here’s\
    \ how you can use the `.next()` method:\n\n**Example:**\n\n```javascript\n// Select\
    \ the next sibling element of a ‘div’ with the class ‘selected’\n$(‘selected’).next()).addClass-‘highlighted’);\n\
    ```\n"
