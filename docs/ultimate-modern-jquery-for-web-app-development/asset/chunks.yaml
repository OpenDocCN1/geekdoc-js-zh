    - `send()`

    - `fetch()`

    - `getJSON()`

    - `request()`


    4. 使用 `post()` 时，发送的是什么类型的请求？

    - GET 请求

    - POST 请求

    - PUT

    -- DELETE


    5. AJAX 中“success”回调的目的是？

    - 处理错误

    - 在请求完成后执行操作

    - 向服务器发送数据

    - 处理


    6. 在 jQuery 中使用简写方法 `get()` 和 `post()` 的主要优势是什么？

    - 它们可以处理任何请求

    - 它们更安全

    - 代码更简洁易读


    ## 答案


    1. b) Asynchronous JavaScript and XML

