    This method allows you to traverse the DOM tree and select descendant elements
    of a selected element. This is particularly useful when you’re dealing with complex
    HTML structures and you need to narrow down your selection to elements within
    a specific container or context.


    **Understanding** **`.find()`**


    Consider a scenario where you have a **`<div>`** with a class **`‘container’`**
    that contains multiple **`<p>`** elements, and you want to change the text color
    of all those paragraphs to blue. Here’s how you can use the method:


    **Example:**


    `// Select all ‘p’ elements within a ‘div’ with the class ‘container’`


    `$(‘.container’).find(‘p’).css(‘color’, ‘blue’);`


    In the preceding example:


    1.  **`$(‘.container’)`** selects the **`<div>`** element with the class “**`container`**.”


    2.  **`.find(‘p’)`** traverses down the DOM tree to find all **`<p>`** elements
    that are descendants of the selected **`<div>`**.


    3.  **`.css(‘color’, ‘blue’)`** sets the text color of all found **`<p>`** elements
    to blue.


    **Benefits of **`.find()`**:**


    *   **Contextual Selection:** **`.find()`** allows you to work within a specific
    context or container, ensuring that you only affect the elements you intend to
    manipulate.


    *   **Nested Structures:** When dealing with nested HTML structures, **`.find()`**
    simplifies the process of selecting elements deeply nested within parent elements.


    *   **Efficient Traversal:** jQuery optimizes the traversal process, making it
    efficient even for complex DOM trees.


    *   **Chaining:** You can chain multiple jQuery methods together for more complex
    operations.


    In summary, the **`.find()`** method is a valuable tool for selecting and manipulating
    descendant elements within a specified context, providing greater control and
    precision in your web development projects.


    # [Exercise: Traversing Descendants of Page Elements with jQuery Selection](#toc.xhtml_s106a)


    In this exercise, we will practice selecting an element and then navigating down
    to the descendants of the selected element using jQuery. You will learn how to
    access the children and descendants of a specific element and apply CSS styling
    to them.


    **Instructions:**


    1.  Select an element with the class “**`main`**” and output its children into
    the console when the first button is clicked.


    2.  Add an event listener to the second button. When it is clicked, get the input
    value from the text field, and then search for that selector element within the
    “**`main`**” element. Apply a CSS style to the found elements (for example, change
    their color to blue).


    3.  When the third button is clicked, select all descendants of an element with
    the class “**`main`**” using the wildcard ‘**`*`**’ and the find method. Apply
    CSS styling (for example, set their background color to purple).


    **CSS:**


    `.box {`


    `width: 200px;`


    `border: 5px solid #ddd;`


    `padding: 20px;`


    `margin: 10px;`


    `}`


    **HTML:**


    `<div class=”main”>`


    `<div class=”div1”>Hello World 1</div>`


    `<div class=”div2”><span>Hello World 2</span></div>`


    `<div class=”div3” id=”div3”>Hello World 3</div>`


    `<div class=”div4”>Laurence Svekis</div>`


    `<input>`


    `<div>`


    `<button id=”btn1”>1</button>`


    `<button id=”btn2”>2</button>`


    `</div>`


    `<button id=”btn3”>3</button>`


    `</div>`


    `JavaScript Code:`


    `$(‘#btn1’).click(() => {`


    `const children = $(‘.main’).children();`


    `console.log(children);`


    `});`


    `$(‘#btn2’).click(() => {`


    `const sel = $(‘input’).val();`


    `if (sel) {`


    `console.log(sel);`


    `$(‘.main’).find(sel).css(‘color’, ‘blue’);`


    `}`


    `});`


    `$(‘#btn3’).click(() => {`


    `$(‘.main div’).find(‘*’).css(‘background-color’, ‘purple’);`


    `});`


    In this exercise, you’ll practice traversing the DOM to select children and descendants
    of a specific element within the page using jQuery, helping you become more proficient
    in manipulating and styling elements based on their relationships in the DOM hierarchy.


    Each of the 3 buttons will perform a different action, interacting with the page
    elements.


    Button 1 (**`#btn1`**) Click Event:


    When the button with **`id=”btn1”`** is clicked, the code retrieves all child
    elements of the div with the class main. It then logs these child elements to
    the console.


    When the button with **`id=”btn2”`** is clicked, the code first gets the value
    entered in the input field. If there is a value (**`sel`**), it searches within
    the **`div.main`** for elements that match the selector provided in the input
    field. It then changes the text color of these matched elements to blue. This
    allows dynamic selection based on the user’s input. For example, if the user inputs
    .div1, the text color of the first div inside **`div.main`** will change to blue.


    Clicking the button with **`id=”btn3”`** affects every descendant of all div elements
    that are direct children of **`div.main`**. It finds all descendants (**`*`**
    selector) within these divs and changes their background color to purple.


    # [Traversing Ancestors of Page Elements with jQuery](#toc.xhtml_s107a)


    In this section, we’ll explore the **`.closest()`** method in jQuery. This method
    allows you to traverse up the DOM tree and select the first ancestor element that
    matches a given selector. This is incredibly useful when you need to locate a
    specific parent element of an element, even if there are multiple levels of nesting
    in your HTML structure.


    **Understanding **`.closest()`****


    Consider a scenario where you have an HTML structure with several nested **`<div>`**
    elements, and you want to select the nearest ancestor **`<div>`** element with
    the class “**`parent`**” when a specific element is clicked. Here’s how you can
    achieve this using the **`.closest()`** method:


    **Example:**


    `// Select the nearest ancestor ‘div’ with the class ‘parent’`


    `$(‘#myElement’).closest(‘div.parent’).css(‘border’, ‘1px solid red’);`


    In the preceding example:


    1.  **`$(‘#myElement’)`** selects the target element with the id “**`myElement`**.”


    2.  **`.closest(‘div.parent’)`** traverses up the DOM tree to find the nearest
    ancestor <div> element with the class “**`parent`**.”


    3.  **`.css(‘border’, ‘1px solid red’)`** applies a red border to the found ancestor
    element.


    **Benefits of **`.closest()`****


    *   **Targeted Selection:** **`.closest()`** helps you pinpoint a specific ancestor
    element that matches the provided selector, even if there are multiple levels
    of nesting in your HTML.


    *   **Cleaner Code:** It simplifies code compared to manually traversing the DOM
    tree with multiple **`.parent()`** calls.


    *   **Maintainability:** Makes your code more maintainable and less prone to breaking
    when the structure of your HTML changes.


    *   **Efficiency:** jQuery optimizes the traversal process, ensuring quick and
    efficient selection of ancestor elements.


    In summary, the **`.closest()`** method is a valuable tool for selecting the nearest
    ancestor element that meets your criteria, simplifying complex DOM tree navigation
    and enhancing the precision of your element selections.


