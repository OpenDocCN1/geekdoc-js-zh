    # [Introduction](#toc.xhtml_s15a)


    Welcome to a crucial chapter where we delve into the essence of jQuery: the art
    of selecting page elements and traversing the Document Object Model (DOM). In
    this chapter, we will explore the fundamental tools at the heart of jQuery, starting
    with Basic Selectors that target elements by tags, classes, or IDs. We will then
    advance to Attribute Selectors and Pseudo Selectors, unveiling more intricate
    methods of pinpointing elements based on their attributes or states. Furthermore,
    we will navigate through the DOM with jQuery’s traversal techniques, enhancing
    our ability to dynamically find and manipulate elements. Finally, we wrap up with
    Filtering Elements, providing a deeper understanding of refining selections for
    more complex and responsive web interfaces.


    # [Structure](#toc.xhtml_s16a)


    In this chapter, we will discuss the following topics:


    *   Basic Selectors


    *   Attribute Selectors


    *   Pseudo Selectors


    *   Traversing DOM Elements with jQuery


    *   Filtering Elements with jQuery


    # [Selection of Page Elements and DOM Element Selection with jQuery](#toc.xhtml_s17a)


    In the world of web development, the ability to select and manipulate DOM elements
    is paramount. jQuery equips developers with powerful tools to effortlessly navigate
    and manipulate the Document Object Model (DOM), allowing for dynamic and engaging
    web experiences. In this chapter, we will delve deep into the art of selecting
    DOM elements using jQuery.


    # [Basic Selectors](#toc.xhtml_s18a)


    Selecting elements on a web page is at the core of jQuery’s capabilities. Basic
    selectors enable you to target elements by their HTML tags, classes, and IDs.
    Here’s a glimpse of how it’s done:


    `// Select by tag`


    `$(“p”) // Selects all <p> elements`


    `// Select by class`


    `$(“.highlight”) // Selects elements with class “highlight”`


    `// Select by ID`


    `$(“#header”) // Selects the element with ID “header”`


    **Exercise**: Making selections of page elements:


    1.  Create an HTML file to interact with, including elements with IDs and classes.


    2.  Make a selection of the element using the tag, class, and ID. Output the jQuery
    element object into the console.


    3.  Create variables and assign the jQuery element objects and output them to
    the page.


    **HTML:**


    `<!DOCTYPE html>`


    `<html>`


    `<head><title>jQuery Course</title></head>`


    `<body>`


    `<div>Hello World 1</div>`


    `<div class=”div2”>Hello World 2</div>`


    `<div id=”div3”>Hello World 3</div>`


    `<script`


    `src=”https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.m in.js”></script>`


    `<script src=”app2.js”></script>`


    `</body>`


    `</html>`


    **APP2.JS**


    `console.log($(‘div’));`


    `$(‘div’).html(‘Hello’);`


    `console.log($(‘.div2’));`


    `console.log($(‘#div3’));`


    `console.log($(‘#div3, .div2’));`


    `const $ele1 = $(‘div’);`


    `console.log($ele1);`


    `$ele1.html(‘Hello 2’);`


    `const $ele2 = $(‘.div2’);`


    `console.log($ele2);`


    `const $ele3 = $(‘#div3’);`


    `console.log($ele3);`


    `const $ele4 = $(‘#div3, .div2’);`


    `console.log($ele4);`


    # [Attribute Selectors](#toc.xhtml_s19a)


    Attribute selectors empower you to target elements based on their attributes and
    values. This is particularly useful for handling input validation and customization:


    `// Select by attribute`


    `$(“input[type=’text’]”) // Selects all text input elements`


    `// Select with specific attribute`


    `$(“[data-toggle]”) // Selects elements with “data-toggle” attribute`


    **Exercise: Select using the attribute:**


    **HTML:**


    `<!DOCTYPE html>`


    `<html lang=”en”>`


    `<head>`


    `<meta charset=”UTF-8”>`


    `<meta name=”viewport” content=”width=device-width, initial-scale=1.0”>`


    `<title>Attribute Selector Example</title>`


    `<script src=”https://code.jquery.com/jquery-3.6.0.min.js”></script>`


    `</head>`


    `<body>`


    `<h1>Attribute Selector Example</h1>`


    `<button data-toggle=”modal”>Open Modal</button>`


    `<button data-toggle=”sidebar”>Open Sidebar</button>`


    `<script src=”script.js”></script>`


    `</body>`


    `</html>`


    **JavaScript (script.js):**


    `$(document).ready(function() {`


    `// Attach a click event to elements with data-toggle attribute`


    `$(“[data-toggle]”).click(function() {`


    `const target = $(this).data(“toggle”);`


    ``alert(`Toggle ${target}`);``


    `});`


    `});`


    In this example, we have two buttons, each with a data-toggle attribute set to
    different values. When a button is clicked, the script uses the attribute selector
    **`$(“[data-toggle]”)`** to target all elements with the data-toggle attribute.
    The click event handler then alerts a message indicating which element was toggled.'
