    # [Introduction to AJAX with jQuery](#toc.xhtml_s164a)


    **`load()`** **`method`**


    The **`load()`** method in jQuery is a simple and convenient way to perform an
    AJAX request and load data from a server into a specific HTML element on a web
    page. It simplifies the process of fetching content from a server and updating
    the content of a designated element in your HTML. Here’s an explanation of how
    the **`load()`** method works:


    **Basic Syntax:**


    `$(selector).load(url, [data], [complete]);`


    1.  **`selector`**: This is the HTML element where you want to load the content
    from the server.


    2.  **`url`**: The URL of the server-side resource (for example, an HTML file,
    a text file, or a specific server endpoint) that you want to fetch data from.


    3.  **`data`** (optional): An optional parameter that allows you to send data
    to the server, typically used with HTTP POST requests.


    4.  **`complete`** (optional): A callback function that is executed once the request
    is complete, which can be used for additional processing.


