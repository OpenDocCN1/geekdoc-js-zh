    # [Custom Animations with jQuery](#toc.xhtml_s32a)


    Beyond the standard methods, jQuery enables you to craft custom animations using
    the **`.animate()`** method. This method grants you precise control over CSS properties
    and animation duration:


    `$(“#customAnimationElement”).animate(`


    `{`


    `width: “200px”,`


    `opacity: 0.5`


    `},`


    `1000`


    `);`


    # [CSS positioning properties](#toc.xhtml_s33a)


    To use the **`.animate()`** method in jQuery effectively, you often need to understand
    and manipulate the CSS positioning properties. CSS positioning properties determine
    how an element is positioned within its containing element or the document. In
    jQuery animations, you can animate changes to these properties to create various
    visual effects.


    Here are the key CSS positioning properties that you might need to use with the
    **`.animate()`** method, along with examples:


    # [**`position`**](#toc.xhtml_s34a)


    The **`position`** property specifies the positioning method used for an element.


    Common values include relative, absolute, fixed, and static.


    **Example:**


    `.box {`


    `position: relative;`


    `}`


    `top, right, bottom, left:`


    These properties are often used with elements whose position is set to relative,
    absolute, or fixed.


    They specify the offset from the element’s normal position.


    **Example:**


    `.box {`


    `position: relative;`


    `top: 20px;`


    `left: 30px;`


    `}`


    # [**`margin`**](#toc.xhtml_s35a)


    The **`margin`** property controls the space outside an element’s border.


    You can animate the margin to change an element’s position smoothly.


    **Example:**


    `.box {`


    `margin-left: 10px;`


    `}`


    # [**`transform`**](#toc.xhtml_s36a)


    The **`transform`** property allows you to apply transformations like translation,
    rotation, and scaling to an element.


    It’s often used with animations to create complex effects.


    **Example:**


    `.box {`


    `transform: translate(50px, 20px);`


    `}`


    # [**`z-index`**](#toc.xhtml_s37a)


    The **`z-index`** property controls the stacking order of elements with the same
    position value.


    It’s useful when you want to animate elements in and out of view, changing their
    stacking order.


    **Example:**


    `.box1 {`


    `z-index: 1;`


    `}`


    `.box2 {`


    `z-index: 2;`


    `}`


    Here’s an example of how you might use these properties with jQuery’s **`.animate()`**
    method:


    `$(document).ready(function() {`


    `$(“#moveButton”).click(function() {`


    `$(“.box”).animate(`


    `{`


    `left: “+=50px”,`


    `top: “+=30px”,`


    `margin: “10px”,`


    `transform: “rotate(45deg)”,`


    `zIndex: 2,`


    `},`


    `1000 // Duration in milliseconds`


    `);`


    `});`


    `});`


    In this example, clicking the **`moveButton`** will animate **`the .box`** elements.
    It changes their left and top positions, margin, transform (rotation), and z-index.
    This showcases how jQuery’s **`.animate()`** method can smoothly transition these
    CSS properties to create dynamic visual effects.


