    \ element?\n\n    1.  `.hideElement()`\n\n    2.  `.visibility(‘hidden’)`\n\n\
    \    3.  `.hide()`\n\n    4.  `.disappear()`\n\n2.  Which jQuery method is used\
    \ to display a hidden element?\n\n    1.  `.reveal()`\n\n    2.  `.show()`\n\n\
