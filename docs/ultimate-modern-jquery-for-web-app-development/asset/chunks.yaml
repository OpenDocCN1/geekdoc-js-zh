  trans: "\n\n在本章结束时，读者将全面理解如何使用 jQuery 中的 AJAX 方法和回调选项来创建高度交互且响应式的 Web 应用程序。\n\n\
    # 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   AJAX（异步 JavaScript 和 XML）的解释及其在不刷新网页的情况下更新网页的作用\n\
    *   介绍用于发送 HTTP 请求和处理响应的 jQuery 核心方法\n*   使用 `type`、`url`、`data` 和 `dataType`\
    \ 等选项自定义 AJAX 请求\n*   概述 jQuery 中用于常用 AJAX 请求的简写方法\n*   演示 `$.get()`、`$.post()`、`$.getJSON()`\
    \ 和 `$.getScript()` 方法\n*   如何使用 jQuery 中的 `load` 方法将外部文件的内容加载到 HTML 元素中\n*  \
    \ 解释如何使用 `$.get()` 从服务器检索 JSON 数据并在 jQuery 中对其进行处理\n*   如何使用 `$.getScript()` 和\
    \ `$.getJSON()` 等简写方法进行 GET 请求，以加载脚本和 JSON 数据\n*   介绍 jQuery 中的回调选项，包括成功（success）、错误（error）和完成（complete）回调\n\
    *   如何定义函数来处理 AJAX 响应和错误\n\n# 使用 jQuery 介绍 AJAX\n\n`load()` 方法\n\njQuery 中的 `load()`\
    \ 方法是一种简单且方便的方法，用于执行 AJAX 请求并将数据从服务器加载到 Web 上的特定 HTML 元素中。它简化了从服务器获取内容并更新 HTML\
    \ 中指定元素内容的过程。以下是 `load()` 方法的工作原理说明：\n\n**基本语法：**\n\n```\n$(selector).load(url,\
    \ [data], [complete]);\n```\n\n1.  `selector`：这是你想要从服务器加载内容的 HTML 元素。\n2.  `url`：服务器端资源的\
    \ URL（例如，HTML 文件、文本文件或特定的服务器端点），你想要从该位置获取取数据。\n3.  `data`（可选）：一个可选参数，允许你向服务器发送数据，通常用于\
    \ HTTP POST 请求。\n4.  `complete`（可选）：在请求完成后执行一次的回调函数，可用于额外的处理。\n\n# 练习：AJAX 示例连接到外部文件并将内容直接加载到页面元素中\n\
    \n*图 12.1* 显示了练习输出，带有三个可点击的按钮（练习预期的输出示例）：\n\n![](img/fig-12.1.jpg)\n\n**图 12.1：**\
    \ 带有 3 个可点击按钮的练习输出：这是练习预期的输出示例\n\n1.  创建几个文本和 HTML 文件，包含你想直接加载到页面元素中的内容。\n2. \
    \ 使用按钮上的点击事件和 `load()` 方法选择元素，并在 load 参数中添加文件路径的字符串值。\n3.  可选的回调函数可以返回响应文本、响应状态和整个\
    \ xHR 对象，这些内容可以在回调函数中使用。检查状态。如果状态返回 `success`，则向控制台加载一条消息。\n\n**HTML**\n\n```html\n\
    <div class=\"output\"></div>\n<div class=\"btns\">\n<button id=\"btn1\">1</button>\n\
    <button id=\"btn2\">2</button>\n<button id=\"btn3\">3</button>\n</div\n```\n\n\
    **JavaScript**\n\n```javascript\n$('#btn1').click(()=>{\n  $('.output').load('file1.txt',(rep,status,xhr)=>{\n\
    \    if(status == 'success'){\n      console.log(rep,status);\n      console.log('success!!!!');\n\
    \    }\n    console.log(xhr);\n  });\n})\n$('#btn2').click(()=>{\n  $('.output').load('file1.html');\n\
    })\n$('#btn3').click(()=>{\n  $('.output').load('file1.txt');\n})\n```\n\n`$.ajax()`\
    \ 方法是构建 HTTP 请求和处理服务器响应的基础。通过 `type`、`url`、`data` 和 `dataType` 等关键参数，开发者可以自定义他们的\
    \ AJAX 交互，释放广泛应用程序的潜力。jQuery 中的 `$.ajax()` 方法是一个强大且多功能的函数，用于向 Web 服务器发送异步 HTTP\
    \ 请求。它允许你从服务器检索数据、向服务器发送数据或执行其他操作，而无需重新整个 Web 页面。\n\n*   `URL (统一资源定位符)`：你指定要交互的服务器端资源的\
    \ URL。这可以是一个网页、API 端点或任何其他可以处理 HTTP 请求的资源。\n*   `HTTP Method (type)`：你可以指定 HTTP\
    \ 方法，例如 GET、POST、PUT、DELETE 等，以指示你想要发起的请求类型。GET 用于检索数据，而 POST 通常用于向服务器发送数据。\n\
    *   `Data`：你可以包含要发送到服务器的数据，通常以对象或字符串的形式。这通常用于向服务器发送表单数据或其他信息。\n*   `dataType`：你指定响应的预期数据类型，例如\
    \ JSON、HTML 或文本。jQuery 将根据此自动解析响应。\n*   `Success and Error Handlers (成功和错误处理器)`：你可以定义在请求成功时（使用\
    \ `success` 参数）或发生错误时（使用 `error` 参数）执行的函数。\n*   `Complete Handler (完成处理程序)`：你还可以定义一个无论请求成功与否都会执行的函数（使用\
    \ `complete` 参数）。\n*   `Other Settings (其他设置)`：`$.ajax()` 提供了许多用于自定义请求的设置和选项，例如设置头、处理超时、启用跨域请求。\n\
    \n总的来说，`$.ajax()` 是处理各种类型 AJAX 请求的多用途工具，使得在不重新加载整个 Web 页的情况下与远程服务器交互成为可能。在 jQuery\
    \ 的 `$.ajax()` 方法中，`fail()` 方法允许你在遇到错误时指定一个函数，提供处理和响应失败请求的方法。另一方面，`always()` 方法允许你在请求完成后定义一个执行函数。\n\
    \n# 练习：jQuery AJAX 方法和回调选项\n\n使用 `ajax()` 方法连接端点并在页面元素中使用响应数据。\n\n1.  使用 `ajax()`\
    \ 方法，在参数对象内部为源文件的 `url` 添加属性值。为 `success` 属性添加回调函数。在请求成功时，将数据值输出到网页。\n2.  使用 `ajax()`\
    \ 方法和 GET 方法类型，在 ajax 参数对象中，将 `url` 设置为端点 URL，将 `type` 设置为 GET，将 `data` 设置为输入字段值和名称的对象，将响应数据指定为\
    \ `json`。\n3.  为 `ajax()` 添加链式方法 `done()`，将在连接成功后触发回调函数。使用从服务器端点返回的数据值并将其添加到页面元素中。\n\
