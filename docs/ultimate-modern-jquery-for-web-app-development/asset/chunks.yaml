  trans: "\n\n在本节中，我们将深入探讨 jQuery 中强大的 `.find()` 方法。该方法允许你遍历 DOM 树并选择所选元素的后代元素。当你正在处理复杂的\
    \ HTML 结构，并且需要将选择范围缩小到特定容器或上下文内的元素时，这种方法特别有用。\n\n### 理解 `.find()`\n\n考虑这样一种场景：你有一个类为\
    \ `'container’ 的 `<div>`，其中包含多个 `<p>` 元素，你想将所有这些段落的文本颜色改为蓝色。以下是使用该方法的方法：\n\n**示例：**\n\
    \n```javascript\n// 选择类为 ‘container’ 的 ‘div’ 内的所有 ‘p’ 元素\n$(‘container’).find-‘p’).css-‘color’,\
    \ ‘blue’);\n```\n\n在上述示例中：\n\n1. `$(‘container’)` 选择类为 `container` 的 `<div>` 元素。\n\
    2. `.find-‘p’)` 向下遍历 DOM 树，找到所有所选 `<div>` 的后代 `<p>` 元素。\n3. `.css-‘color’, ‘blue’)`\
    \ 将所有找到的 `<p>` 元素的文本颜色设置为蓝色。\n\n### `.find()` 的优势：\n\n* **上下文选择：** `.find()` 允许你在特定的上下文或容器内工作，确保你只影响你想要操作的元素。\n\
    * **嵌套结构：** 在处理嵌套的 HTML 结构时，`.find()` 简化了选择深嵌套在父元素内部的元素的过程。\n* **高效遍历：** jQuery\
    \ 优化了遍历过程，使其处理复杂的 DOM 树时非常高效。\n* **链式调用：** 你可以将多个 jQuery 方法链在一起，以进行更复杂的操作。\n\n\
    总之，`.find()` 方法是用于在指定上下文中选择和操作后代元素的有效工具，能为你的 Web 开发项目提供更大的控制力和精确度。\n\n# # 练习：使用\
    \ jQuery 选择器遍历页面元素的后代\n\n在本次练习中，我们将练习使用 jQuery 选择一个元素，然后向下导航到所选元素的后代。你将学习如何访问特定元素的子元素和后代，并对它们应用\
    \ CSS 样式。\n\n### 指令：\n\n1. 选择一个类为 `main` 的元素，并在点击第一个按钮时将它的子元素输出到控制台。\n2. 为第二个按钮添加事件监听器。当点击它时，从文本字段获取输入值，然后在\
    \ `main` 元素内搜索该选择器元素。对找到的元素应用 CSS 样式（例如，将颜色改为蓝色）。\n3. 点击第三个按钮时，使用通配符 `*` 和 `find`\
    \ 方法选择类为 `main` 的元素的所有后代。应用 CSS 样式（例如，将它们的背景颜色设置为紫色）。\n\n### CSS:\n\n```css\n\
    .box {\n  width: 200px;\n  border: 5px solid #ddd;\n  padding: 20px;\n  margin:\
    \ 10px;\n}\n```\n\n### HTML:\n\n```html\n<div class=”main”>\n  <div class=”div1”>Hello\
    \ World 1</div>\n  <div class=”div2”><span>Hello World 2</span></div>\n  <div\
    \ class=”div3” id=”div3”>Hello World 3</div>\n  <div class=”div4”>Laurence Svekis</div>\n\
    \  <input>\n  <div>\n    <button id=”btn1”>1</button>\n    <button id=”btn2”>2</button>\n\
    \  </div>\n  <button id=”btn3”>3</button>\n</div>\n```\n\n### JavaScript 代码:\n\
    \n```javascript\n$(‘#btn1’).click(() => {\n  const children = $(‘main’).children();\n\
