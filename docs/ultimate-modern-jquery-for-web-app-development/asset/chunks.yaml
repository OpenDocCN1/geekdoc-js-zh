    \ the input field to the output element.\n4. On the input field select of text,\
    \ add a `select()` method event to the element, and output the active element\
    \ text into the output element.\n5. On the form submission, add an event which\
    \ says in the console that the form was submitted, as well as add a `preventDefault()`\
    \ to prevent the default action of form submission.\n6. On a button add when clicked,\
    \ add within the callback function that the main form is submitted.\n\n**CSS Code:**\n\
    \n```css\n.box {\n  border: 1px solid #ddd;\n  height: 50px;\n  width: 100px;\n\
    }\ninput{\n  display:block;\n}\n```\n\n**HTML:**\n\n```html\n<div class=”output”></div>\n\
    <form class=”main”>\n<input type=”text” name=”name” value=”Laurence Svekis”> <input\
    \ type=”submit” value=”Submit”>\n</form>\n<button id=”btn1”>1</button>\n```\n\n\
    **JavaScript:**\n\n```javascript\n$(‘<select>’).appendTo(‘.main’);\nfor(let i=0;i<5;i++){\n\
