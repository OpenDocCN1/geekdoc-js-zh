  trans: "\n\n1. `.keydown()`、`.keypress()` 和 `.keyup()` 事件用于捕获键盘相关的事件。这些事件会记录已按的按键的信息，并更改对应输入元素的背景颜色。`keydown`、`keypress`\
    \ 和 `keyup` 事件会被记录，同时包含发生事件的输入元素的索引。\n\n2. `.focus()` 和 `.blur()` 事件用于处理输入元素的聚焦（focus）和失焦（blur）事件。当输入元素获得焦点时，其文本颜色将变为红色；当失去焦点时，文本颜色将变为绿色。事件会连同输入元素的索引一起记录。\n\
    \n3. `.focusin()` 和 `.focusout()` 事件与 `.focus()` 和 `.blur()` 事件类似，但它们处理的是输入元素的\
    \ `focusin` 和 `focusout` 事件。获取焦点时文本颜色变为蓝色，失去焦点时变为粉色。这些事件也会连同输入元素的索引一起记录。\n\n总而言之，这段代码生成了一系列输入元素，并演示了如何使用\
    \ jQuery 处理键盘事件以及聚焦和失焦事件。这些事件会触发输入元素产生不同的视觉变化，并在控制台中记录相关信息。\n\n# jQuery 提交时的表单事件及更多\n\
    \n**练习：** 为表单元素和表单提交绑定事件：\n\n1. 向 HTML 页面添加一个带有选项的 `select` 元素。\n2. 当 `select`\
    \ 改变时，将值输出到类名为 `output` 的元素中。\n3. 选择文本类型的输入元素，并在改变（change）事件发生时，将输入字段的值输出到输出元素中。\n\
    4. 在输入字段选中（select）时，为该元素添加 `select()` 方法事件，并将激活元素的文本输出到输出元素中。\n5. 在表单提交时，添加一个事件，在控制台中输出表单已提交，同时添加\
    \ `preventDefault()` 以防止表单提交的默认行为。\n6. 为按钮添加点击（click）事件，在回调函数内部输出主表单已提交。\n\n**CSS\
    \ 代码:**\n\n```css\n.box {\n  border: 1px solid #ddd;\n  height: 50px;\n  width:\
    \ 100px;\n}\ninput{\n  display:block;\n}\n```\n\n**HTML:**\n\n```html\n<div class=”output”></div>\n\
    <form class=”main”>\n<input type=”text” name=”name” value=”Laurence Svekis”> <input\
    \ type=”submit” value=”Submit”>\n</form>\n<button id=”btn1”>1</button>\n```\n\n\
    **JavaScript:**\n\n```javascript\n$(‘<select>’).appendTo(‘.main’);\nfor(let i=0;i<5;i++){\n\
    \  const counter = `${i+1} Value`;\n  $(‘<option>’).val(counter).text(counter).appendTo(‘select’);\
    \ \n}\n$(‘select’).change(function(){\n  $(‘.output’).text($(this).val());\n})\n\
    $(‘input[type=”text”]’).change(function(){ \n  $(‘.output’).text($(this).val());\n\
    })\n$(‘:input’).select(function(){\n  $(‘.output’).text($(this).val());\n})\n\
    $(‘.main’).submit(function(e){\n  e.preventDefault();\n  console.log(‘form submitted’);\n\
    })\n$(‘#btn1’).click(()=>{\n  $(‘.main’).submit();\n})\n```\n\n1. HTML 页面中添加了一个包含多个\
    \ `<option>` 元素的 `<select>` 元素。选项通过循环生成并追加到 `select` 元素中。\n2. 为 `<select>` 元素绑定了改变事件。当下拉列表中的选中选项改变时，该选项的值将显示在类为\
    \ `output` 的元素中。这允许用户看到选中的值。\n3. 选取属性 `type=”text”` 的 `<input>` 元素，并为其绑定了改变事件。当输入字段中的文本改变时，输入字段的值将显示在\
    \ `output` 元素中。\n4. 使用 `:input` 选择器选取所有输入元素（例如文本输入框），并为它们绑定了选中事件。当输入字段被选中时（例如通过点击它），被选中输入字段的值将显示在\
    \ `output` 元素中。\n5. 选取类为 `main` 的 `<form>` 元素，并为其绑定了提交事件。当表单提交时，该事件处理器使用 `e.preventDefault()`\
    \ 防止默认的表单提交行为。它还会在控制台中记录一条消息，表示表单已提交。\n6. 选取 ID 为 `btn1` 的按钮。当该按钮被点击时，点击事件处理器通过调用\
    \ `$(‘.main’).submit()` 触发表单提交。\n\n总而言之，这段代码演示了如何使用 jQuery 处理各种表单元素的事件，以及如何防止默认的表单提交行为。它还展示了如何在点击按钮时通过程序触发表单提交。从表单元素中选中的值将显示在\
    \ `output` 元素中。\n\n"
