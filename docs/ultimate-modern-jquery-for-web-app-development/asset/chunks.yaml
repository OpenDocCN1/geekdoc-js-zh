  trans: "\n\n```javascript\n// Attach a click event handler to the button element\
    \ with the ID “myButton”\n$('#('#myButton').on('click', function() {\n  alert('Button\
    \ clicked!');\n});\n});\n```\n\n在这个示例中，当文档准备就绪（即 DOM 完全加载）时，会为 ID 为 `myButton`\
    \ 的按钮元素绑定一个点击（click）事件处理器。当按钮被点击时，它会触发点击事件，事件处理器会显示一个带有 `Button clicked!` 消息的框。\n\
    \n`.on()` 方法提供了一种处理各种事件（包括点击、悬停、按键按下等）的方法，它是 jQuery 中用于事件委托和动态事件处理的强大工具。\n\n#\
    \ [练习：使用 on 方法绑定更强大的事件]\n\n**练习：** 使用 `on()` 方法为在事件代码运行后创建的未来元素添加事件。\n\n1. 创建一个类名为\
    \ `boxes` 的元素，并将其添加到页面元素的顶端。\n2. 为类名为 `box` 的元素添加多个事件：`click()`、`mouseenter()`\
    \ 和 `mouseleave()`。\n3. 为类名为 `.btns` 的元素内部的所有按钮元素使用 `on()` 方法添加点击事件。一旦被点击，应将元素的索引值输出到类名为\
    \ `output` 的元素的文本区域中。\n4. 创建一个包含某些数据的对象，然后使用 `on()` 方法添加点击事件，包括要发送给 `adder` 回调函数的数据。\n\
    5. 在 `adder()` 函数中将事件对象数据输出到控制台。\n6. 在按钮元素上使用简写 `click` 方法，添加点击时时背景颜色变为红色，并将元素索引值输出到控制台日志中。\n\
    7. 创建页面按钮并将它们附加到 `btns` 类元素中。在添加 `click()` 事件之后创建的按钮将不会具有点击事件。\n\n**CSS:**\n\n\
    ```css\n.box {\n  border: 1px solid #ddd;\n  height: 50px;\n  width: 100px;\n\
    }\ninput{\n  display:block;\n}\n.active{\n  background-color:red;\n  color:green;\n\
    }\n```\n\n**HTML:**\n\n```html\n<div class=\"output\"></div>\n<div class=\"btns\"\
    >\n  <button id=\"btn1\">1</button>\n  <button id=\"btn2\">2</button>\n  <button\
    \ id=\"btn3\">3</button>\n</div\n```\n\n**JavaScript:**\n\n```javascript\n$('<div>').text('LaurenceSvekis').addClass('box').prependTo('body');\n\
    $('.box').on({\n  click : function() {$(this).toggleClass('active')}, \n  mouseenter:function(){$(this).css('background-color','blue')},\n\
    \  mouseleave:function(){$(this).css('background-color','white')} \n})\n$('.btns').on('click','button',function(){\n\
    \  const val = `${$(this).index()} index button`;\n  $('.output').text(val);\n\
    })\nconst obj = {\n  first : 'Laurence',\n  last : 'Svekis',\n  id : 100\n};\n\
    $('.output').on('click',obj,adder);\nfunction adder(e){\n  console.log(e.data);\n\
    }\n$('.btns button').click(function(){\n  const val = `${$(this).index()} index\
    \ button`;\n  $(this).css('background-color','red');\n  console.log(val);\n})\n\
    for(let i=0;i<5;i++){\n  const temp = `${i+4}`;\n  $('<button>').text(temp).appendTo('.btns');\n\
    }\n```\n\nHTML 文档包含一个类名为 `output` 的 div 元素和另一个类名为 `btns` 的 div 元素，后者包含三个按钮。\n\n\
    1. 动态创建一个类名为 `box` 的 div 元素，进行样式设置并添加到 body 中。\n2. 使用 `.on()` 方法为 `box` 元素绑定了事件处理。定义了三个事件（`click`、`mouseenter`\
    \ 和 `mouseleave`）。当你点击一个 `box` 时，它会切换 `active` 类，改变背景颜色和文字颜色。鼠标进入和离开事件会改变背景颜色。\n\
    3. 使用事件委托来处理 `btns` div 内的按钮点击。当按钮被点击时，其索引和消息将显示在 `output` div 中。\n4. 将一个自定义数据对象\
    \ `obj` 与 `output` div 关联，以用于点击事件。当你点击 `output` div 时，数据将记录到控制台。\n5. 为 `btns`\
    \ div 中动态创建的按钮提供了额外的事件处理。当你点击这些按钮时，将显示索引和背景颜色的变化。\n\n"
- fmt: "\n```css\nheight: 50px;\nwidth: 100px;\n}\ninput{\n  display:block;\n}\n.active{\n\
    \  background-color:red;\n  color:green;\n}\n```\n\n### HTML Code:\n```html\n\
    <div class=\"output\"></div>\n<div class=\"btns\">\n  <button id=\"btn1\">1</button>\n\
    \  <button id=\"btn2\">2</button>\n  <button id=\"btn3\">3</button>\n</div>\n\
    ```\n\n### JavaScript Code:\n```javascript\nlet counter = 1;\n$('button').click(()=>{\n\
    \  counter++;\n  const r = Math.floor(Math.random()*200)+100;\n  const c = '#'+Math.random().toString(16).substring(2,8);\n\
    \  const id = 'id'+counter;\n  $('<div>').text('New Div').css('height',r+'px').attr('id',id).css('background-color',c).appendTo('body');\n\
    \  //output\n  $('<a>').attr('href','#'+id).text(id+' ').appendTo('.output');\n\
    })\n$(window).scroll((e)=>{\n  console.log(e);\n})\n$(window).resize((e)=>{\n\
    \  console.log($(window).height());\n  console.log($(document).height());\n})\n\
    ```\n\n1. In the HTML the page has three buttons inside a div with the class `btns`,\
    \ and there’s an empty div with the class `output`.\n2. In the JavaScript section,\
    \ a `counter` variable is initialized to `1`. It tracks the number of times a\
    \ button is clicked.\n3. An event handler is set up to respond to button clicks.\
    \ When a button is clicked, the following actions occur:\n    - The `counter`\
    \ is incremented.\n    - A random height (between 100 and 300 pixels) and a random\
    \ background color are generated.\n    - An `ID` for a new `<div>` element is\
    \ created using the increment counter.\n    - A new `<div>` element is created,\
    \ with the text `New Div`, a specified height, a unique `ID`, and the generated\
    \ background color.\n    - The new `<div>` element is appended to the body of\
    \ the page.\n    - A new `<a>` element is created with an `href` attribute pointing\
    \ to the newly created `<div>`’s `ID`. This link is added to the `output` div,\
    \ creating a list of links to the generated `<div>` elements.\n4. Additional event\
    \ handlers are set up using jQuery:\n    - `$(window).scroll()`: When the user\
    \ scrolls the page, this event handler logs information about the scroll event\
    \ to the console.\n    - `$(window).resize()`: When the browser window is resized,\
    \ this event handler logs the height of the window and the height of the document\
    \ to the console.\n\nIn summary, the code dynamically generates and adds new colored\
    \ `<div>` elements to the web page with unique IDs every time a button is clicked.\
    \ It also creates a list of links to these generated `<div>` elements. Additionally,\
    \ it provides event handlers to log information when the user scrolls or resizes\
    \ the browser window.\n\n# Conclusion\n\nThis chapter provided a comprehensive\
    \ overview of event handling in web development using the jQuery library. It covered\
    \ various aspects of event management, starting with an introduction to the JavaScript\
    \ event model and then delving into how jQuery can be utilized to bind and trigger\
    \ events. The chapter discusses different jQuery event methods like `.click()`,\
    \ `.hover()`, `.submit()`, and `.keypress()` for handling user interactions. Additionally,\
    \ it explores more advanced event-handling techniques, including event delegation\
    \ for dynamically created elements and the use of the `.on()` method to bind multiple\
    \ events simultaneously. Readers will also learn about event bubbling, propagation\
    \ control using methods like `.stopPropagation()` and `.preventDefault()`, and\
    \ best practices for optimizing event handling and maintaining clear, organized\
    \ event handlers. The chapter equips readers with the knowledge and skills to\
    \ effectively manage events in web applications using jQuery. The chapter content\
    \ also provides practical examples, such as handling mouse move listeners, hover\
    \ events, keyboard events, and form events with jQuery, and demonstrates the power\
    \ of the `.on()` method for attaching more powerful events.\n\nThe upcoming chapter\
    \ focuses on the significant role of AJAX (Asynchronous JavaScript and XML) in\
    \ creating highly responsive web applications, emphasizing the elimination of\
    \ the need for page refreshes when handling user interactions. It initiates with\
    \ an introduction to jQuery’s essential AJAX capabilities, primarily the `$.ajax()`\
    \ method, which equips readers with the ability to initiate HTTP requests and\
    \ effectively manage server responses. The chapter further explores the customization\
    \ of AJAX requests through options like type, URL, data, and dataType, tailoring\
    \ them to specific application requirements.\n\nIn addition, readers will discover\
    \ the convenience of jQuery’s shorthand methods, including `$.get()`, `$.post()`,\
    \ `$.getJSON()`, and `$.getScript()`, designed to streamline the process of making\
    \ AJAX requests while improving code clarity and readability. As the chapter progresses,\
    \ it delves into the realm of callback options within jQuery, allowing developers\
    \ to define functions that execute upon the completion of AJAX requests. These\
    \ callback functions, such as success, error, and complete\n\n# Multiple Choice\
    \ Questions\n\n1. Which method in jQuery can handle user interactions, such as\
    \ clicking and hovering?\n    a) `.bind()`\n    b) `.eventHandler()`\n    c) `.interact()`\n\
    \    d) `.click()`\n2. What is the purpose of using the on() method in jQuery\
    \ for event handling?\n    a) To disable all event\n    b) To trigger event\n\
    \    c) To bind multiple events at once\n    d) To prevent propagation\n3. Which\
    \ jQuery method can be used to stop propagation?\n    a) `.halt()`\n    b) `.stopEvent()`\n\
    \    c) `.stopPropagation()`\n    d) `.preventDefault()`\n4. How can the .preventDefault()\
    \ method in jQuery be useful?\n    a) It cancels the execution completely.\n \
    \   b) It prevents event\n    c) It triggers event\n    d) It enhances event delegation\n\
    5. In jQuery, what method can be used to bind events to elements that match a\
    \ selector, including dynamically created elements?\n    a) `.register()`\n  \
    \  b) `.bind()`\n    c) `.attach()`\n    d) `.on()`\n\n# Answers\n\n1. d) `.click()`\n\
    2. c) To bind multiple events at once\n3. c) `.stopPropagation()`\n4. a) It cancels\
    \ the execution completely.\n5. d) `.on()`\n"
