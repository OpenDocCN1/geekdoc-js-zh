    ### Basic Selectors\n\nSelecting elements on a web page is at the core of jQuery’s\
    \ capabilities. Basic selectors enable you to target elements by their HTML tags,\
    \ classes, and IDs. Here’s a glimpse of how it’s done:\n\n```javascript\n// Select\
    \ by tag\n$(\"p\") // Selects all <p> elements\n\n// Select by class\n$(\".highlight\"\
    ) // Selects elements with class “highlight”\n\n// Select by ID\n$(\"#header\"\
    ) // Selects the element with ID “header”\n```\n\n**Exercise**: Making selections\
    \ of page elements:\n\n1. Create an HTML file to interact with, including elements\
    \ with IDs and classes.\n2. Make a selection of the element using the tag, class,\
    \ and ID. Output the jQuery element object into the console.\n3. Create variables\
    \ and assign the jQuery element objects and output them to the page.\n\n**HTML:**\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head><title>jQuery Course</title></head>\n\
    <body>\n<div>Hello World 1</div>\n<div class=\"div2\">Hello World 2</div>\n<div\
    \ id=\"div3\">Hello World 3</div>\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js\"\
    ></script>\n<script src=\"app2.js\"></script>\n</body>\n</html>\n```\n\n**APP2.JS**\n\
    \n```javascript\nconsole.log($(\"div\"));\n$(\"div\").html(\"Hello\");\nconsole.log($(\"\
    .div2\"));\nconsole.log($(\"#div3\"));\nconsole.log($(\"#div3, .div2\"));\nconst\
    \ $ele1 = $(\"div\");\nconsole.log($ele1);\n$ele1.html(\"Hello 2\");\nconst $ele2\
    \ = $(\".div2\");\nconsole.log($ele2);\nconst $ele3 = $(\"#div3\");\nconsole.log($ele3);\n\
    const $ele4 = $(\"#div3, .div2\");\nconsole.log($ele4);\n```\n\n### Attribute\
    \ Selectors\n\nAttribute selectors empower you to target elements based on their\
    \ attributes and values. This is particularly useful for handling input validation\
    \ and customization:\n\n```javascript\n// Select by attribute\n$(\"input[type='text']\"\
    ) // Selects all text input elements\n\n// Select with specific attribute\n$(\"\
    [data-toggle]\") // Selects elements with “data-toggle” attribute\n```\n\n**Exercise:\
    \ Select using the attribute:**\n\n**HTML:**\n\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\">\n<title>Attribute Selector Example</title>\n\
    <script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n</head>\n\
    <body>\n<h1>Attribute Selector Example</h1>\n<button data-toggle=\"modal\">Open\
    \ Modal</button>\n<button data-toggle=\"sidebar\">Open Sidebar</button>\n<script\
    \ src=\"script.js\"></script>\n</body>\n</html>\n```\n\n**JavaScript (script.js):**\n\
    \n```javascript\n$(document).ready(function() {\n  // Attach a click event to\
    \ elements with data-toggle attribute\n  $(\"[data-toggle]\").click(function()\
    \ {\n    const target = $(this).data(\"toggle\");\n    alert(`Toggle ${target}`);\n\
    \  });\n});\n```\n"
