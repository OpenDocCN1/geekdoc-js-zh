    # [Understanding Event Bubbling and Propagation](#toc.xhtml_s157a)


    Events in the Document Object Model (DOM) can propagate in different ways, affecting
    how they are handled. Understanding event bubbling and propagation is crucial
    for controlling event behavior. How events propagate through the DOM and how to
    use event methods like **`.stopPropagation()`** and **`.preventDefault()`** to
    control and modify this behavior.


    **Example of** **`.stopPropagation()`:**


    The **`.stopPropagation()`** method is used to prevent the event from propagating
    to parent elements. It stops the event from “**`bubbling up`**” the DOM tree.


    `<div id=”parent”>`


    `<button id=”child”>Click Me</button>`


    `</div>`


    `<script>`


    `$(document).ready(function() {`


    `$(“#child”).click(function(event) {`


    `alert(“Child button clicked!”);`


    `event.stopPropagation(); // Prevent the event from reaching the parent`


    `});`


    `$(“#parent”).click(function() {`


    `alert(“Parent div clicked!”);`


    `});`


    `});`


    `</script>`


    In this example, when you click the “**`Click Me`**” button, it triggers an alert,
    and the **`.stopPropagation()`** method prevents the click event from propagating
    to the parent div. So, you will only see the “**`Child button clicked!`**” alert.
    If you remove the **`.stopPropagation()`** you will see the second alert after
    the first one is closed.


    **Example of** **`.preventDefault()`:**


    The **`.preventDefault()`** method is used to prevent the default behavior of
    certain HTML elements, such as links and form submissions.


    `<a id=”link” href=”https://www.example.com”>Click Me</a>`


    `<form id=”myForm”>`


    `<input type=”text” name=”username” placeholder=”Enter your username”>`


    `<button type=”submit”>Submit</button>`


    `</form>`


    `<script>`


    `$(document).ready(function() {`


    `$(“#link”).click(function(event) {`


    `event.preventDefault(); // Prevent the link from navigating to another page`


    `alert(“Link clicked, but default behavior prevented.”);`


    `});`


    `$(“#myForm”).submit(function(event) {`


    `event.preventDefault(); // Prevent the form from submitting`


    `alert(“Form submitted, but default behavior prevented.”);`


    `});`


    `});`


    `</script>`


    In this example, when you click the “**`Click Me`**” link or submit the form,
    the **`.preventDefault()`** method is used to prevent the default behavior (navigating
    to another page or submitting the form). Instead, an alert message is displayed.


    These examples illustrate how to use **`.stopPropagation()`** and **`.preventDefault()`**
    to control event propagation and default behaviors in your web applications using
    jQuery.


