  trans: "\n\n*   创建新元素：你可以通过 jQuery 函数中指定标签名称来创建一个新的 HTML 元素。例如：\n\n    `const newDiv\
    \ = $(‘<div></div>’);`\n\n*   设置属性：要为新元素设置属性，可以链式调用 `.attr()` 方法。例如：\n\n    `const\
    \ newLink = $(‘<a></a>’).attr(‘href’, ‘https://example.com’);`\n\n*   添加内容：你还可以使用\
    \ `.html()` 或 `.text()` 方法向新元素添加内容：\n\n    `const newParagraph = $(‘<p></p>’).text(‘This\
    \ is a new paragraph.’);`\n\n*   插入 DOM：要将新创建的元素放入 DOM，你可以在现有元素上使用 `.append()`、`.prepend()`、`.before()`\
    \ 或 `.after()` 等方法。例如：\n\n    `newDiv.appendTo(‘.container’); // 将 newDiv 添加到类为‘container’的元素中`\n\
    \n# 修改元素\n\n一旦你在 DOM 中拥有了元素，jQuery 提供了修改它们的方法，例如添加内容或在页面结构中移动元素。关键方法包括：\n\n* \
    \  `.append()`：此方法将内容或元素添加到所选元素的末尾。它通常用于插入段落、图像或列表等元素。\n\n    `$(‘.container’).append(‘<p>New\
    \ content at the end.</p>’);`\n\n*   `.prepend()`：与 `.append()` 类似，`.prepend()`\
    \ 将内容或元素添加到所选元素的开头。\n\n    `$(‘.container’).prepend(‘<p>New content at the beginning.</p>’);`\n\
    \n*   `.before()` 和 `.after()`：这些方法在所选元素之前之后插入内容或元素。\n\n    `$($('..element’).before(‘<div>Before</div>’);`\n\
    \n    `$(‘.element’).after(‘<div>After</div>’);`\n\n# 移除元素\n\njQuery 提供了从 DOM\
    \ 中移除元素及其内容的方法。了解何时以及如何使用这些方法至关重要：\n\n*   `.remove()`：此方法从 DOM 中移除所选元素及其所有后代元素。\n\
    \n    `$(‘.element-to-remove’).remove();`\n\n*   `.empty()`：.empty() 方法移除所选元素中的所有子元素和内容，保留元素本身不变。\n\
    \n    `$(‘.element-to-empty’).empty();`\n\n掌握这些创建、修改和移除元素的技巧，允许你创建动态且交互式的网页，响应用户操作，并根据需要动态更新内容。这些技能是构建响应式且吸引人的\
    \ Web 应用程序的核心。\n\n# 选择和操作多个元素\n\n在本节中，我们将深入探讨使用 jQuery 选择和操作多个元素的世界。这些技术能够对 DOM\
    \ 中的元素进行精确控制，允许你遍历层级结构、针对特定的子元素并对相关的兄弟元素进行操作。\n\n# 父元素\n\n使用 jQuery 的 `.parent()`\
    \ 方法，你可以轻松选择父元素。\n\n"
- fmt: "\nThe `.replaceWith()` method in jQuery allows you to swap one element for\
    \ another, altering the DOM structure dynamically. This is useful when you want\
    \ to update content or replace an element with a different one without affecting\
    \ its surrounding elements. Here’s how it works:\n\n1. **Replacing an element**:\
    \ To replace an element, you call the `.replaceWith()` method on the jQuery object\
    \ representing the element you want to replace. For example:\n\n```javascript\n\
    const $existingElement = $(‘existing-element’);\nconst $newElement = $(‘<div>New\
    \ Content</div>’);\n$existingElement.replaceWith($newElement);\n```\n\nThe code\
    \ selects an existing element with the class `existing-element`, creates a new\
    \ div element with the text `\"New Content\"`, and then replaces the existing\
    \ element in the DOM with this new div element. The original existing element\
    \ is removed from the DOM as a result of this operation.\n\n2. **Inserting new\
    \ element**: The original element is removed from the DOM and replaced by the\
    \ new element you specify. This operation maintains the document’s integrity while\
    \ allowing you to update content dynamically.\n\n3. **Updating content**: You\
    \ can replace elements with new content, whether it’s HTML, text, or other elements.\
    \ This is commonly used for dynamic content loading and updating portions of a\
    \ page without requiring a full page refresh.\n\n# Removing wrapping elements\n\
    \nThe `.unwrap()` method in jQuery allows you to remove unnecessary wrapping elements\
    \ from around a selected element, optimizing your document’s structure. This is\
    \ useful when you want to simplify the DOM or eliminate extraneous container elements.\
    \ Here’s how it works:\n\n1. **Removing wrapping elements**: To remove wrapping\
    \ elements, you call the `.unwrap()` method on the jQuery object representing\
    \ the element you want to unwrap. For example:\n\n```javascript\n$(‘unwanted-wrapper’).unwrap();\n\
    ```\n\n2. **Optimizing structure**: This method simplifies the DOM structure by\
    \ removing unnecessary container elements. It’s commonly used in scenarios where\
    \ elements are initially wrapped for styling or layout purposes but need to be\
    \ unwrapped for easier manipulation.\n\n3. **Retaining content**: The content\
    \ of the unwrapped element remains intact; only the wrapper is removed. This ensures\
    \ that the content and layout of your page are not affected.\n\nThese advanced\
    \ techniques empower you to perform complex DOM manipulations with ease. Whether\
    \ you’re creating dynamic forms and galleries, or optimizing your document structure,\
    \ understanding how to clone elements, replace elements, and remove unnecessary\
    \ wrapping elements is invaluable for building rich and responsive web applications.\n\
    \n# Exercise: Adding, removing, and toggling element classes\n\nIn this exercise,\
    \ you’ll work with jQuery to add, remove, and toggle classes on HTML elements.\
    \ These actions will help you understand how to manipulate element classes dynamically\
    \ in response to user interactions.\n\n## Step 1: Click event and hasClass()\n\
    \nWe begin by adding a click event to all the `<div>` elements on the page.\n\n\
    ### HTML\n\n```html\n<div class=”blue”>Click me (I’m blue)</div>\n<div>Click me\
    \ (No color)</div>\n<div class=”red”>Click me (I’m red)</div>\n<div>Click me (No\
    \ color)</div>\n<div class=”blue”>Click me (I’m blue)</div>\n```\n\n### CSS\n\n\
    ```css\n.blue {\n  color: blue;\n}\n.red {\n  color: red;\n}\n```\n\n### jQuery\n\
    \n```javascript\n$(div).click(function() {\n  if ($(this).hasClass(‘blue’)) {\n\
    \    $(this).removeClass(‘blue’).addClass(‘red’);\n  } else {\n    $(this).removeClass(‘red’).addClass(‘blue’);\n\
    \  }\n});\n```\n"
