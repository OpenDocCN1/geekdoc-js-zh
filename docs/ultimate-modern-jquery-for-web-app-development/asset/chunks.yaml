    \ 元素。\n\n```javascript\n// Raw JavaScript\nconst element = document.getElementById(“myElement”);\n\
    element.style.color = “red”;\n\n// jQuery equivalent\n$(“#myElement”).css(“color”,\
    \ “red”);\n```\n\n# 轻松处理事件\n\n处理用户交互和事件是现代 Web 应用的基础。jQuery 提供了一种了一贯且直观的方法来绑定事件监听器并响应用户操作。\n\
    \n```javascript\n// Raw JavaScript\nconst button = document.getElementById(“myButton”);\n\
    button.addEventListener(“click”, function() {\n  console.log(“Button clicked!”);\n\
    });\n\n// jQuery equivalent\n$(“#myButton”).click(function() {\n  console.log(“Button\
    \ clicked!”);\n});\n```\n\n# 轻松实现动画和特效\n\n创建动画和特效曾是一项复杂的工程。jQuery 的动画方法简化了这个过程，让开发者能够轻松创建具有视觉吸引力的过渡效果。\n\
    \n```javascript\n// Raw JavaScript animation\nconst element = document.getElementById(“animatedElement”);\n\
    element.style.transition = “width 2s”;\nelement.style.width = “300px”;\n\n// jQuery\
    \ animation\n$(“#animatedElement”).animate({ width: “300px” }, 2000);\n```\n\n\
    # 选择 jQuery 的充足理由\n\n以下是选择 jQuery 的一些引人理由：\n\n- 跨浏览器兼容性\nWeb 开发中最令人沮丧的挑战之一是确保你的代码在不同浏览器中都能一致运行。jQuery\
    \ 抽象了浏览器差异，为用户提供了一致的体验。\n\n- 丰富的插件生态系统\njQuery 的插件架构导致了大量插件库的创建，为各种功能提供了现成的解决方案，从表单验证到复杂的\
    \ UI 组件。\n\n- 提高生产力\n通过简化复杂任务并减少所需的代码量，jQuery 显著提高了开发者的生产力，让他们能够专注于 Web 开发的创意方面。\n\
    \n- 学习曲线\njQuery 直观的语法和文档良好的 API 即使对于刚接触 JavaScript 的开发者来说也易上手，加速了他们的学习曲线，并使他们更快地创建印象深刻的\
    \ Web 应用。\n\n- 拥抱 jQuery 的力量\n随着你深入学习这本书，你将发现 jQuery 方法的细节，探索真实的用例，并掌握构建迷人 Web\
    \ 应用的艺术。jQuery 不仅仅是一个库；它是释放交互式 Web 开发潜力的门户。所以，让我们共同开启这段旅程，充分利用 jQuery 的力量在网页上打造卓越的用户体验。\n\
    \n# 下载并将 jQuery 添加到你的 HTML 中\n\n现在我们已经了解了 jQuery 的力量，是时候配备我们所需的工具来发挥它的潜力了。我们将引导你完成获取\
    \ jQuery 库并将其无缝集成到 HTML 文件中的过程。jQuery 有多个版本，推荐使用最新的 `3.*` 版本。jQuery 设计用于简化 HTML\
    \ DOM 树的遍历和页面元素的操作。它提供了创建 CSS 动画以及处理事件和 AJAX 请求的优秀方法。\n\n# 获取 jQuery\n\n在开始使用\
    \ jQuery 之前，我们需要获取库本身。坦率，可以从官方网站轻松获取 jQuery，方法如下所示：\n\n- 直接下载：访问 jQuery 官方网站 [`jquery.com/download/`](https://jquery.com/download/)\
    \ 并选择你想要使用的 jQuery 版本。你可以下载库的压缩版本或未压缩版本。\n建议使用压缩版本，因为可以节省带宽，且删除空格后文件大小更小。未压缩版本仅用于调试。\n\
    \n- 内容分发网络 (CDN)：或者，你可以直接从 CDN 引入 jQuery。这样做的好处是，如果用户已经访问过其他使用相同 CDN 的网站，可能会缩短他们的加载时间。\n\
    CDN 资源地址：[`developers.google.com/speed/libraries#jquery`](https://developers.google.com/speed/libraries#jquery)\n\
    \n# 将 jQuery 集成到你的 HTML 中\n\n一旦你下载了 jQuery 库，就需要将其集成到你的 HTML 文件中。这里是分步指南：\n\n\
    1. **创建一个新文件夹**：组织你的项目文件，并在项目目录内创建一个名为 `js` 的新文件夹。这就是我们存储 jQuery 文件的地方。\n2. **放置\
    \ jQuery 文件**：将下载的 jQuery 文件（例如 `jquery-3.6.0.min.js`）移动到你创建的 `js` 文件夹中。\n3. **链接\
    \ jQuery**：在你的 HTML 文件中，通常在 `</</body>>` 标签之前，包含以下代码以链接 jQuery 文件：\n`<script src=\"\
    js/jquery-3.6.0.min.js\"></script>`\n这段代码告诉浏览器从指定位置加载 jQuery 库。如果你的项目结构不同，请务必调整路径。\n\
    \n# 验证 jQuery 集成\n\n为了确保 jQuery 已成功集成到你的你的项目中，让我们进行一个简单的测试。打开你的 HTML 文件，在 jQuery\
    \ 引入下方添加以下脚本：\n\n```html\n<script>\n// jQuery test\n$(document).ready(function()\
    \ {\n  alert(“jQuery is working!”);\n});\n</script>\n```\n这段代码创建了一个简单的 jQuery\
    \ 脚本，在文档准备绪绪触发警报。当你在浏览器中加载 HTML 文件时，你应该能看到一个显示 `jQuery is working!` 消息的警告框。\n\n\
    你也可以使用浏览器编辑器检查 jQuery 是否已加载。在浏览器控制台中使用 `$` 或 `jQuery` 来检查 jQuery 是否就绪：\n\n![](img/fig-1.1.jpg)\n\
    \n**图 1.1:** 使用 $ 或 jQuery 检查 jQuery 是否就绪\n\n恭喜！你已经成功下载并将 jQuery 集成到你的 Web 项目中。现在\
    \ jQuery 已无缝集成到你的开发工作流中，你正处于创建动态、交互且具有视觉吸引力的 Web 应用的道路上。在接下来的章节中，我们将深入探讨 jQuery\
    \ 的功能，并学习如何运用其能力来打造令人深刻的用户体验。\n\n"
- fmt: "\nAs we delve deeper into the world of jQuery, it’s essential to explore alternative\
    \ methods of accessing and utilizing this powerful library. In addition to downloading\
    \ jQuery files locally, we can leverage the capabilities of CDNs to streamline\
    \ the integration process and optimize the performance of our web applications.\
    \ In this section, we’ll delve into the concept of CDN and how to harness its\
    \ advantages when incorporating jQuery into your web pages.\n\nA CDN is a distributed\
    \ network of servers strategically positioned around the world. The primary goal\
    \ of a CDN is to deliver web content—such as images, scripts, stylesheets, and\
    \ libraries—more efficiently to users by serving content from a server that is\
    \ geographically closer to the user’s location. This results in reduced latency,\
    \ faster loading times, and improved reliability.\n\nIncorporating jQuery via\
    \ a CDN offers several benefits that enhance the performance and reliability of\
    \ your web applications:\n\n*   CDNs distribute content across multiple servers,\
    \ enabling browsers to fetch assets from the nearest server. This minimizes the\
    \ distance data needs to travel, leading to faster loading times and improved\
    \ user experiences.\n*   CDNs are optimized for caching, which means that when\
    \ a user visits a site that uses a CDN-hosted jQuery version, their browser may\
    \ have already cached the jQuery file from a previous visit to another site. This\
    \ reduces redundant downloads and improves overall browser efficiency.\n*   CDNs\
    \ are designed to handle high volumes of traffic and are often equipped with advanced\
    \ security features, improving the overall reliability and availability of the\
    \ resources they host.\n\nTo include jQuery in your project using a CDN, you don’t\
    \ need to download any files. Instead, you can reference the library directly\
    \ from the CDN servers. Here’s how you can do it:\n\n```html\n<!-- Include jQuery\
    \ from Google CDN -->\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js\"\
    ></script>\n\n<!-- Include jQuery from Microsoft CDN -->\n<script src=\"https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.6.0.min.js\"\
    ></script>\n```\n\nChoose one of the provided URLs (or explore other CDN options)\
    \ and place the `<script>` tag in the `<head>` or just before the closing `</body>`\
    \ tag of your HTML document.\n\nBy incorporating jQuery via a CDN, you tap into\
    \ a global network of servers dedicated to optimizing the delivery of web content.\
    \ This approach enhances your web applications’ loading speed and overall performance,\
    \ while also reducing the burden on your own hosting resources.\n\nFollowing is\
    \ the step-by-step guide on how to add jQuery to your HTML and create a simple\
    \ element selection, event, and manipulation of element content with jQuery:\n\
    \n**Exercise**: Create a file add jQuery and write some jQuery Code:\n\n1.  Create\
    \ an HTML file and add a page element.\n2.  Add the `<script>` tag link to the\
    \ jQuery library.\n3.  Add a second `<script>` tag link to a new `js` file named\
    \ `app1.js`.\n4.  Open the HTML in the browser and check if jQuery is on the page.\n\
    5.  In `app1.js`, select the element using the same syntax as you would with CSS,\
    \ for example, `$()...`.\n6.  Add a jQuery method named `.html()`.\n7.  Add a\
    \ string value within `.html()`.\n8.  Add the `on('click')` to the element and\
    \ nest the update of the `html` inside.\n9.  Add a second `.html()` chained to\
    \ the on click method with another string value.\n\n**INDEX.HTML**\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title>jQuery Course</title>\n</head>\n<body>\n\
    \    <div>Hello World</div>\n    <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js\"\
    ></script>\n    <script src=\"app1.js\"></script>\n</body>\n</html>\n```\n\n**APP1.JS**\n\
    \n```javascript\n$('div').on('click',() => {\n    $('div').html('Laurence Sveis');\n\
    }).html('Click Me');\n```\n\nHere are some simple examples of jQuery. We will\
    \ provide more details about how they work in the upcoming chapters:\n\n1.  **Document\
    \ Ready**\n    Run code when the document is fully loaded and ready:\n    ```javascript\n\
    \    $(document).ready(function() {\n        // Your code here\n    });\n    ```\n\
    \n2.  **Click Event**\n    Execute code when an element is clicked:\n    ```javascript\n\
    \    $(\"#myButton\").click(function() {\n        // Your code here\n    });\n\
    \    ```\n\n3.  **Hide and Show**\n    Toggle the visibility of an element:\n\
    \    ```javascript\n    $(\"#toggleButton\").click(function() {\n        $(\"\
    #targetElem\").toggle();\n    });\n    ```\n\n4.  **Adding CSS**\n    Change CSS\
    \ properties of an element:\n    ```javascript\n    $(\"#myElem\").css(\"color\"\
    , \"blue\");\n    ```\n\n5.  **Adding Classes**\n    Add a CSS class to an element:\n\
    \    ```javascript\n    $(\"#myElem\").addClass(\"highlight\");\n    ```\n\n6.\
    \  **Fading Effects**\n    Apply fading effects to an element:\n    ```javascript\n\
    \    $(\"#myButton\").click(function() {\n        $(\"#targetElem\").fadeIn();\n\
    \    });\n    ```\n    ```javascript\n    $(\"#myButton\").click(function() {\n\
    \        $(\"#targetElem\").fadeOut();\n    });\n    ```\n\n7.  **Slide Effects**\n\
    \    Apply sliding effects to an element:\n    ```javascript\n    $(\"#myButton\"\
    ).click(function() {\n        $(\"#targetElem\").slideDown();\n    });\n    ```\n\
    \    ```javascript\n    $(\"#myButton\").click(function() {\n        $(\"#targetElem\"\
    ).slideUp();\n    });\n    ```\n\n8.  **AJAX Request**\n    Fetch data from a\
    \ server without reloading the page:\n    ```javascript\n    $.ajax({\n      \
    \  url: \"data\",\n        success: function(data) {\n            // Handle data\n\
    \        },\n        error: function() {\n            // Handle error\n      \
    \  }\n    });\n    ```\n\n9.  **Mouse Hover**\n    Perform actions when the mouse\
    \ enters or leaves an element:\n    ```javascript\n    $(\"#myElem\").hover(\n\
    \        function() {\n            // Mouse enter\n        },\n        function()\
    \ {\n            // Mouse leave\n        }\n    );\n    ```\n\n10. **Animations**\n\
    \    Create custom animations using jQuery’s animate method:\n    ```javascript\n\
    \    $(\"#myButton\").click(function() {\n        $(\"#targetElem\").animate({\n\
    \            width: \"200px\",\n            height: \"200px\"\n        }, 1000);\
    \ // Animation duration in milliseconds\n    });\n    ```\n\nThese examples provide\
    \ a solid starting point for exploring jQuery’s capabilities. Remember that jQuery\
    \ offers a wide array of methods and functions for manipulating DOM elements,\
    \ handling events, making AJAX requests, and creating dynamic animations. As you\
    \ gain familiarity with these basics, you’ll be well-prepared to dive into more\
    \ complex scenarios and build impressive applications.\n\n# Browser Dev Tools\n\
    \nUsing Chrome’s Developer Tools (DevTools) is a powerful way to interact with\
    \ and understand web pages. Here’s a brief description of how to use it:\n\n1.\
    \  **Accessing DevTools**: Open Chrome and navigate to the web page you want to\
    \ inspect. Right-click anywhere on the page and select `Inspect`, or use the keyboard\
    \ shortcut *Ctrl+Shift+I* (*Cmd+Opt+I* on Mac). This opens the DevTools panel.\n\
    2.  **Elements Panel**: This panel allows you to view and modify the HTML and\
    \ CSS of a page. You can inspect the DOM, change styles in real-time, and see\
    \ how these changes affect the layout and appearance of the website.\n3.  **Console**:\
    \ The Console tab is used for logging information as part of the JavaScript development\
    \ process. You can also interact with the web page by executing JavaScript commands\
    \ directly.\n4.  **Sources Panel**: This panel is where you can debug JavaScript\
    \ by setting breakpoints, stepping through the code, and inspecting variables.\
    \ You can view and edit source files directly in this panel.\n5.  **Network Panel**:\
    \ It provides information about the network activity on the current page. You\
    \ can see each file that is requested, its load time, and details like headers,\
    \ response payloads, and HTTP status codes.\n6.  **Performance Panel**: Use this\
    \ to analyze runtime performance of your web page. It helps in understanding the\
    \ resources and time taken to render, script, and load the page.\n"
