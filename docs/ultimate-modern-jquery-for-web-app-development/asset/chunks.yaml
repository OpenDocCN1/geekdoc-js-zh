    \ click event, and the event handler displays an alert with the message `Button\
    \ clicked!`.\n\nThe `.on()` method provides a way to handle various events, including\
    \ click, hover, keypress, and more, and it’s a powerful tool for event delegation\
    \ and dynamic event handling in jQuery.\n\n# [Exercise: Attach events with the\
    \ on Method with more powerful events]\n\n**Exercise:** Use of `on()` method for\
    \ adding events to future elements created after the event code is run.\n\n1.\
    \ Create an element with a class of `boxes`, and add it to the start at the top\
    \ of the page elements.\n2. Add multiple events to the element with the class\
    \ of `box`, `click()`, `mouseenter()`, and `mouseleave()`.\n3. Add to all the\
    \ button elements within the `.btns` class element, the click event with the `on()`\
    \ method. Once clicked, it should output the element index value to the text area\
    \ of the element with the class of `output`.\n4. Create an object with some data,\
    \ then, using the `on()` method, add a click event, including the data to be sent\
    \ to the callback function of the `adder`.\n5. In the `adder()` function output\
    \ the event object data into the console.\n6. Use the shorthand click on the button\
    \ elements, add when clicked that the background changes to red and the element\
    \ index value is output into the console log. 7. Create page buttons and append\
    \ them to the `btns` class element. The buttons created after the `click()` event\
    \ was added will not have the click event.\n\n**CSS:**\n\n```css\n.box {\n  border:\
    \ 1px solid #ddd;\n  height: 50px;\n  width: 100px;\n}\ninput{\n  display:block;\n\
    }\n.active{\n  background-color:red;\n  color:green;\n}\n```\n\n**HTML:**\n\n\
    ```html\n<div class=\"output\"></div>\n<div class=\"btns\">\n  <button id=\"btn1\"\
    >1</button>\n  <button id=\"btn2\">2</button>\n  <button id=\"btn3\">3</button>\n\
    </div>\n```\n\n**JavaScript:**\n\n```javascript\n$('<div>').text('LaurenceSvekis').addClass('box').prependTo('body');\n\
    $('.box').on({\n  click : function() {$(this).toggleClass('active')}, \n  mouseenter:function(){$(this).css('background-color','blue')},\n\
    \  mouseleave:function(){$(this).css('background-color','white')} \n})\n$('.btns').on('click','button',function(){\n\
    \  const val = `${$(this).index()} index button`;\n  $('.output').text(val);\n\
    })\nconst obj = {\n  first : 'Laurence',\n  last : 'Svekis',\n  id : 100\n};\n\
    $('.output').on('click',obj,adder);\nfunction adder(e){\n  console.log(e.data);\n\
    }\n$('.btns button').click(function(){\n  const val = `${$(this).index()} index\
    \ button`;\n  $(this).css('background-color','red');\n  console.log(val);\n})\n\
    for(let i=0;i<5;i++){\n  const temp = `${i+4}`;\n  $('<button>').text(temp).appendTo('.btns');\n\
    }\n```\n\nThe HTML document contains a div element with the class `output` and\
    \ another div with the class `btns` containing three buttons.\n\n1. A div element\
    \ with the class `box` is dynamically created, styled, and added to the body.\n\
    2. Event handling is attached to the `box` elements using the `.on()` method.\
    \ Three events (`click`, `mouseenter`, and `mouseleave`) are defined. When you\
    \ click a `box`, it toggles the `active` class, changing the background color\
    \ and text color. Mouse enter and leave events change the background color.\n\
    3. Event delegation is used to handle button clicks within the `btns` div. When\
    \ a button is clicked, its index and a message are displayed in the `output` div.\n\
    4. A custom data object `obj` is associated with the `output` div to be used in\
    \ click events. When you click the `output` div, the data is logged to the console.\n\
    5. Additional event handling for the dynamically created buttons in the `btns`\
    \ div. When you click these buttons, the index and a background color change are\
    \ displayed.\n"
