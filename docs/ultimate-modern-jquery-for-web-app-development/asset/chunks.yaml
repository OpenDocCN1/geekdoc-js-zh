    <button id=\"btn4\">4</button>\n<button id=\"btn5\">5</button>\n```\n\nJavaScript\
    \ 代码：\n```javascript\n$('.main div').addClass('box').hover(\n  function() { \n\
    \    $(this).css('background-color', 'red') \n  },\n  function() { \n    $(this).css('background-color',\
    \ 'white') \n  }\n).mouseenter(function(e) {\n  //$(this).text(`X:${e.pageX} Y:${e.pageY}`);\n\
