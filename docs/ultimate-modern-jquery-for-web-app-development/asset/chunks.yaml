    \n# 伪选择器 (Pseudo Selectors)\n\n伪选择器根据元素状态提供动态选择，例如 `:hover`、`:first-child` 和 `:nth-child`：\n\
    \n```javascript\n// 选择 <ul> 内部第一个 <li> 元素\n$(\"ul li:first-child\")\n```\n\n```javascript\n\
    // 选择表格中奇数的 <tr> 元素\n$(\"table tr:nth-child(odd)\")\n```\n\n**练习**：使用 jQuery 选择第一个列表项并将其背景颜色更改为蓝色：\n\
    \n**HTML:**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"\
    UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n<title>Change CSS with jQuery</title>\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
    ></script>\n</head>\n<<body>\n<h1>Change CSS with jQuery</h1>\n<ul>\n<li>Item\
    \ 1</li>\n<li>Item 2</li>\n<li>Item 3</li>\n</ul>\n<script src=\"script.js\"></script>\n\
    </body>\n</html>\n```\n\n**JavaScript (script.js):**\n\n```javascript\n$(document).ready(function()\
    \ {\n  // 更改第一个列表项的 CSS\n  $(\"ul li:first-child\").css(\"color\", \"blue\");\n\
    });\n```\n\n在此示例中，我们有一个包含三个列表项的无序列表。`script.js` 文件中的 jQuery 代码使用选择器 `$(\"ul li:first-child\"\
    )` 来定位第一个列表项。然后使用 `.css()` 方法将第一个列表项的文本颜色更改为蓝色。\n\n要运行示例，请在同一目录下创建 HTML 和 JavaScript\
    \ 文件，并在网页浏览器中打开 HTML 文件。你将看到一个带有三个项目的列表，且第一个项目的文本颜色将变为蓝色。此示例演示了如何使用 jQuery 更改列表中特定元素的\
    \ CSS 属性。\n\n# DOM 遍历 (DOM Traversal)\n\njQuery 简化了在 DOM 层级中导航的过程，允许你轻松遍历父元素、子元素和兄弟元素：\n\
    \n```javascript\n// 选择元素的父元素\n$(\"#childElement\").parent()\n```\n\n```javascript\n\
    // 选择元素的所有直接子元素\n$(\"ul\").children()\n```\n\n```javascript\n// 选择元素的下一个兄弟元素\n\
    $(\".current\").next()\n```\n\n以下是使用 jQuery 的父级方法遍历页面元素祖先的步骤：\n\n**练习**：向父 HTML\
    \ 元素向上移动，遍历到选中元素的祖先节点。\n\n1. 选择按钮元素，并在点击时输出 `parent()` 和 `parents()` 的长度。\n2.\
    \ 使用 `parentsUntil()` 选择该元素的祖先，并选择一个元素作为停止点。\n3. 使用 `each()` 遍历元素数组。为所有作为第二个按钮祖先且具有类\
    \ `main` 的元素添加一个类。\n\n**HTML:**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n<head><title>jQuery Course</title>\n<style>\n.box{\nwidth:200px;\nborder:5px\
    \ solid #ddd;\npadding:20px;\nmargin:10px;\n}\n</style>\n</head>\n<body><nav class=\"\
    main\">\n<div class=\"main\">\n<div class=\"div1\">Hello World 1</div>\n<div class=\"\
    div2\"><span>Hello World 2</span></div> <div class=\"div3\" id=\"div3\">Hello\
    \ World 3</div> <div class=\"div4\">Laurence Svekis</div>\n<input >\n<div class=\"\
    main\">\n<button id=\"btn1\">1</button>\n<button id=\"btn2\">2</button>\n</div>\n\
    <button id=\"btn1\">3</button>\n</div></nav>\n<button id=\"btn1\">4</button>\n\
    <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js\"\
    ></script>\n<script src=\"app14.js\"></script>\n</body>\n</html>\n```\n\n**app14.js**\n\
    \n```javascript\n$('#btn1').click(function(){\n  console.log($(this).parent().length);\n\
    \  console.log($(this).parents().length);\n  console.log($(this).parents());\n\
    \  console.log($(this).parentsUntil('.main'));\n})\n$('#btn2').click(function(){\n\
    \  $(this).parents('.main').each(function(){\n    addClass('parent');\n  })\n\
    ```\n\n# 过滤元素 (Filtering Elements)\n\n通过过滤符合特定条件的元素来完善你的选择。这提高了操作网页部分的精确性：\n\n\
    - 按偶数元素过滤：`$(\"even\")`\n- 按包含文本的元素过滤：`$(\"contains('jQuery')`\n\n**练习**：使用过滤选择特定元素并遍历：\n\
    \n1. 为五个按钮添加点击事件。\n2. 点击第一个按钮时，选择元素集合，然后使用 `first()`、`last()` 和 `eq()` 根据集合的位置选择特定元素，并对其应用样式。\n\
    3. 点击第二个按钮时，使用 `filter()` 选择匹配的结果并对其应用样式。\n4. 点击第三个按钮时，选择集合中不匹配的元素并对其应用样式。\n5.\
    \ 对于第四和第五个按钮，尝试使用 `filter()` 和 `not()` 的变体来选择元素并对其应用样式。\n\n**HTML:**\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<title>jQuery Course</title>\n<style>\n\
    .box {\nborder:1px solid #ddd;\npadding:5px;\ncolor: red;\n}\n.box1 {\nborder:1px\
    \ solid #ddd;\npadding:5px;\ncolor: blue;\n}\n.box2 {\nborder:1px solid #ddd;\n\
    padding:5px;\ncolor: green;\n}\n</style>\n</head>\n<body><nav>\n<div class=\"\
    main\">\n<div class=\"div1\">Hello World 1</div>\n<div class=\"div2\"><span>Hello\
    \ World 2</span></div> <div class=\"div3\" id=\"div3\">Hello World 3</div> <div\
    \ class=\"div4\">Laurence Svekis</div>\n<input>\n<button id=\"btn1\">1</button>\n\
    <button id=\"btn2\">2</button>\n<button id=\"btn3\">3</button>\n<span>Hello</span>\n\
    </div></nav>\n<button id=\"btn4\">4</button>\n<button id=\"btn5\">5</button>\n\
    <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js\"\
    ></script>\n<script src=\"app16.js\"></script>\n</body>\n</html>\n```\n\n**app16.js**\n\
    \n```javascript\n$('#btn1').click(function(){\n  console.log($(\".main\").children());\n\
    \  $main = $(\".main\").children();\n  $main.first().css('color', 'red');\n  $main.last().css('color',\
    \ 'blue');\n  $main.eq(7).css('color', 'green');\n  $main.eq(6).css('background-color',\
    \ 'green');\n})\n$('#btn2').click(function(){\n  $main = $(\".main\").children();\n\
    \  $btns = $main.filter('button');\n  $main.filter('button').css('background-color',\
    \ 'black'); $btns.css('color', 'white');\n})\n$('#btn3').click(function(){\n \
    \ $main = $(\".main\").children();\n  $btns = $main.not('button');\n  $main.not('button').css('background-color',\
    \ 'purple'); $btns.css('color', 'white');\n})\n$('#btn4').click(function(){\n\
    \  $(\".main div\").not('.div1').css('color', 'red'); })\n$('#btn5').click(function(){\n\
    \  $(\".main div\").filter('div').css('color', 'green'); })\n```\n\n# 方法链 (Chaining\
    \ Methods)\n\njQuery 的优势之一在于它的方法链调用，它允许你将多个方法组合成单行简洁的代码：\n\n```javascript\n//\
    \ 使用链式方法来选择并操作元素\n$(\"#myElement\").addClass(\"highlight\").slideUp(1000);\n```\n\
    \n**练习**：如何将多个方法链在一起：\n\n**HTML:**\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n<title>Chaining Methods with jQuery</title>\n<script src=\"\
    https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n</head>\n<body>\n<h1>Chaining\
    \ Methods with jQuery</h1>\n<div id=\"box\"></div>\n<button id=\"animateButton\"\
    >Animate</button>\n<script src=\"script.js\"></script>\n</body>\n</html>\n```\n\
    \n"
