  trans: "\n\n`data()` 方法允许开发者向 HTML 元素挂载自定义数据，并在需要时检索这些数据。\n\n使用 jQuery 的 `.data()`\
    \ 方法将值保存到元素对象是 Web 开发中的一个基础概念。该方法允许你向 HTML 元素挂载自定义数据，这对于广泛的应用程序都特别有用。让我们探索如何使用\
    \ `.data()` 方法将值保存到元素对象中，并理解为什么它是一个非常有价值的工具。\n\n## 使用 `.data()` 保存值\n\njQuery\
    \ 中的 `.data()` 方法向 DOM 元素附加额外信息，而不会改变 DOM 结构或源代码中元素的呈现方式。你可以在元素中存储任何类型的数据，例如字符串、数字、对象或数组。以下是将值保存到元素数据中的方法：\n\
    \n```javascript\n$(‘#myElement’).data(‘key’, ‘value’);\n```\n\n在这个示例中，我们将字符串值与\
    \ `#myElement` 元素中的键关联起来。\n\n你可以使用 `.data()` 方法在元素中存储数据。要做到这一点，你通常会选择想要与数据关联的元素，并调用\
    \ `.data(‘key’, ‘value’`，其中‘key’ 是数据的唯一标识符，而‘value’是你想要存储的数据。\n\n```javascript\n\
    $(‘#myElement’).data(‘userInfo’, { name: ‘Laurence’, age: 40, email: ‘laurence@example.com’\
    \ });\n```\n\n在这个示例中，我们将一个对象与 ID 为 `myElement` 的 HTML 元素的键 `userInfo` 关联起来。\n\n\
    ## 检索数据\n\n要检索已存储的数据，你可以再次使用 .data() 方法，但这次你不需要提供值。你只需要提供‘key’即可检索与该键关联的数据。\n\n\
    ```javascript\nconst userData = $(‘#myElement’).data(‘userInfo’);\n```\n\n现在，`userData`\
    \ 变量将包含我们之前存储的对象，允许你访问 name、age 和 email 等属性。\n\n## 数据\n\n你还可以通过调用 `.removeData(‘key’)`\
    \ 来移除与元素关联的数据。\n\n```javascript\n$(‘#myElement’).removeData(‘userInfo’);\n```\n\
    \n这将移除与元素关联的 `userInfo` 数据。\n\n使用 `.data()` 的优点是：\n\n*   它保持数据易于读取并与 HTML 分离。\n\
    *   它随元素管理数据并在需要时检索。\n*   它共享数据，使其更易管理。\n*   你可以存储各种类型的数据。\n*   可以在事件和特定事件信息中更好地处理数据。\n\
    \n## 练习 `data()`示例\n\n下面的代码示例是一个 jQuery 练习，演示了如何使用 jQuery `data()` 方法存储和检索从点击元素的文本内容的值。该练习包含以下步骤：\n\
    \n1.  为所有 div 添加点击事件：在这一步中，`.main` 容器内的所有 div 元素都挂载了点击事件。每当点击这些 div 元素中的一个时，就会执行一个函数。\n\
    2.  当 div 被点击时，获取当前的 `text()` 值并存储在 `data()` 中：在点击事件函数内部，使用 `$(this).text()` 获取点击的\
    \ div 元素的当前文本值。然后使用 `data()` 方法将其存储。数据的键设置为 `past`，值为文本内容。\n3.  更新元素的 `text()`：在将文本内容存储到数据之后，更新被点击的\
    \ div 元素的文本。在此练习中，文本被更新为包含一个计数器，用于跟踪该 div 被点击的次数。文本被修改为显示文本内容加上计数器。\n4.  为按钮添加事件以使用元素的数据值并将\
    \ `data()` 值作为元素的新 `text()` 输出：HTML 中提供了几个按钮（`btn1`、`btn2`、`btn3`、`btn4`）。每个按钮对应一个特定的\
    \ div 元素。点击按钮时，它使用 `.data(‘past’)` 检索之前在关联 div 被点击时存储的数据。然后将检索到的值设为对应 div 的新文本内容。\n\
    \n**HTML 代码**\n\n```html\n<nav>\n  <div class=”main”>\n    <div class=”div1”>Hello\
    \ World 1</div>\n    <div class=”div2”><span>Hello World 2</span></div> <div class=”div3”\
    \ id=”div3”>Hello World 3</div>\n    <div class=”div4”>Laurence Svekis</div>\n\
    \    <input>\n    <button id=”btn1”>1</button>\n    <button id=”btn2”>2</button>\n\
    \    <button id=”btn3”>3</button>\n    <span>Hello</span>\n  </div>\n</nav>\n\
    <button id=”btn4”>4</button>\n<button id=”btn5”>5</button>\n```\n\n**JavaScript\
    \ 代码**\n\n```javascript\nlet counter = 0;\nlet temp = ‘’;\n\n$(‘input’).val(‘Laurence\
    \ Svekis’);\n\n$(‘.main div’).click(function() {\n  $(this).data(‘past’, $(this).text());\n\
    });\n\n$(‘btn1’).click(function() {\n  let val = $(.div1).data(‘past’);\n  counter++;\n\
    \  $(.div1).text(val + \" \" + counter);\n});\n\n$(‘btn2’).click(function() {\n\
    \  let val = $(.div2).data(‘past’);\n  counter++;\n  $(.div2).text(val + \" \"\
    \ + counter);\n});\n\n$(‘btn3’).click(function() {\n  let val = $(.div3).data(‘past’);\n\
    \  counter++;\n  $(.div3).text(val + \" \" + counter);\n});\n\n$(‘btn4’).click(function()\
    \ {\n  let val = $(.div4).data(‘past’);\n  $(.div4).text(val);\n});\n```\n\n"
- fmt: "\nTo find the position of a specific element, call `.index()` on that element.\
    \ The method will return a zero-based index, indicating its position in the group.\n\
    \nSelecting elements based on their position relative to others is a common task\
    \ when working with jQuery. Knowing how to identify and choose elements based\
    \ on their relationship to neighboring elements can be very useful.\n\nThe `index()`\
    \ method in jQuery allows you to retrieve the index position of an element in\
    \ relation to its siblings. This can be very useful when you need to identify\
    \ the specific position of an element within a group of similar elements.\n\n\
    The most basic usage of the `index()` method is to call it on a jQuery object.\
    \ For example, if you have a set of sibling elements, you can call `index()` on\
    \ one of them to get its position among its siblings.\n\n```javascript\n// Assuming\
    \ you have a set of sibling elements with the class item\nconst position = $(('.item').index();\n\
    console.log(`Position: ${position}`);\n```\n\nThis will log the position (0-based\
    \ index) of the selected element among its siblings.\n\nYou can also use the `index()`\
    \ method in combination with a selector to find the index of a specific element\
    \ within a set of siblings that match the selector.\n\n```javascript\n// Assuming\
    \ you want to find the index of a specific element with the class active\nconst\
    \ position = $(('.item.active').index('.item'));\nconsole.log(`Position: ${position}`);\n\
    ```\n\nIn this case, you’re finding the index of the element with the class `active`\
    \ within its siblings with the class item.\n\nA common use case is to determine\
    \ which element was clicked within a set of elements. You can use the `index()`\
    \ method to find the index of the clicked element and then perform actions based\
    \ on that index.\n\n```javascript\n// Assuming you have a set of clickable elements\
    \ with the class clickable\n$('.clickable').click(function () {\n  const position\
    \ = $(this).index();\n  console.log(`Clicked on item at position: ${position}`);\n\
    });\n```\n\nWhen a user clicks an element with the class `clickable`,, this code\
    \ logs the position of that element within the set of its siblings.\n\nThe `:eq()`\
    \ and `:lt()` selectors are powerful tools in jQuery that allow you to pinpoint\
    \ elements within a selection based on their index. They are extremely useful\
    \ when you want to select specific elements from a set of matched elements.\n\n\
    ### Using the `:eq()` Selector:\n\nThe `:eq()` selector allows you to select a\
    \ specific element within a set by providing its index. Indexing starts from 0.\n\
    \nFor example, to select the second element within a set of elements, you would\
    \ use `:eq(1)` because it is at index 1 (remember, the index is 0-based).\n\n\
    ```javascript\n$('ul li:eq(2)').css('color', 'red');\n```\n\nIn this case, the\
    \ text color of the third `<li>` element (index 2) within a `<ul>` element is\
    \ changed to red.\n\n### Using the `:lt()` Selector:\n\nThe `:lt()` selector allows\
    \ you to select all elements up to, but not including, a specified index. This\
    \ is useful when you want to select a range of elements within a set. To select\
    \ the first three elements, you would use `:lt(3)`.\n\n```javascript\n$('ul li:lt(3)').addClass('highlight');\n\
    ```\n\nThis will add the `highlight` class to the first, second, and third `<li>`\
    \ elements within a `<ul>`.\n\nThese selectors are helpful in situations where\
    \ you want to target specific elements within a set without having to manually\
    \ count elements in the DOM structure. They provide a concise and efficient way\
    \ to work with elements based on their position within a selection, making your\
    \ code more dynamic and flexible.\n\n# Exercise: Use the `get()` method to return\
    \ the DOM element object\n\nIn this exercise, you will be using the `.get()` method\
    \ in jQuery to retrieve DOM element objects from a selected set of elements. Once\
    \ you have the DOM element object, you’ll use JavaScript’s DOM methods and properties\
    \ to interact with these elements. Specifically, you will create a click event\
    \ on buttons that will get the length of items in the jQuery selection and then\
    \ loop through these items, using the `.get()` method.\n\n### Step 1: Select the\
    \ set of elements\nIn this step, you’ll use jQuery to select the elements.\n\n\
    ### Step 2: Create a click event\nIn this step, you’ll add a click event to the\
    \ buttons.\n\n### Step 3: Loop through the items\nIn this step, you’ll use a loop\
    \ and use the `.get()` method to retrieve the DOM object.\n\n```html\n<nav>\n\
    \  <div class=\"main\">\n    <div class=\"div1\">Hello World 1</div>\n    <div\
    \ class=\"div2\">Hello World 2</div>\n    <div class=\"div3\">Hello World 3</div>\n\
    \    <div class=\"div4\">Laurence Svek</div>\n    <button id=\"btn1\">1</button>\n\
    \    <button id=\"btn2\">2</button>\n    <button id=\"btn3\">3</button>\n    <span\
    \ class=\"span1\">Hello</span>\n  </div>\n</nav>\n<button id=\"btn4\">4</button>\n\
    <button id=\"btn5\">5</button>\n```\n\n```javascript\n$('#btn1').click(() => {\n\
    \  const temp = $('.main div').get(1);\n  console.log(temp.innerHTML);\n  console.log(temp.textContent);\n\
    });\n\n$('#btn2').click(() => {\n  const len = $('.main div').length;\n  console.log(len);\n\
    \  let html = '';\n  for(let i=0; i<len; i++) {\n    const temp = $('.main div').get(i);\n\
    \    console.log(temp.textContent);\n    html += `${i}. ${temp.textContent} `;\n\
    \  }\n  $('.main .span1').text(html);\n});\n```\n"
  raw: 'To find the position of a specific element, call **`.index()`** on that element.
    The method will return a zero-based index, indicating its position in the group.


    Selecting elements based on their position relative to others is a common task
    when working with jQuery. Knowing how to identify and choose elements based on
    their relationship to neighboring elements can be very useful.


    The **`index()`** method in jQuery allows you to retrieve the index position of
    an element in relation to its siblings. This can be very useful when you need
    to identify the specific position of an element within a group of similar elements.


    The most basic usage of the **`index()`** method is to call it on a jQuery object.
    For example, if you have a set of sibling elements, you can call **`index()`**
    on one of them to get its position among its siblings.


    `// Assuming you have a set of sibling elements with the class item`


    `const position = $(‘.item’).index();`


    ``console.log(`Position: ${position}`);``


    This will log the position (0-based index) of the selected element among its siblings.


    You can also use the **`index()`** method in combination with a selector to find
    the index of a specific element within a set of siblings that match the selector.


    `// Assuming you want to find the index of a specific element with the class active`


    `const position = $(‘.item.active’).index(‘.item’);`


    ``console.log(`Position: ${position}`);``


    In this case, you’re finding the index of the element with the class **`active`**
    within its siblings with the class item.


    A common use case is to determine which element was clicked within a set of elements.
    You can use the **`index()`** method to find the index of the clicked element
    and then perform actions based on that index.


    `// Assuming you have a set of clickable elements with the class clickable`


    `$(‘.clickable’).click(function () {`


    `const position = $(this).index();`


    ``console.log(`Clicked on item at position: ${position}`);``


    `});`


    When a user clicks an element with the class **`clickable`**`,` this code logs
    the position of that element within the set of its siblings.


    The **`:eq()`** and **`:lt()`** selectors are powerful tools in jQuery that allow
    you to pinpoint elements within a selection based on their index. They are extremely
    useful when you want to select specific elements from a set of matched elements.


    **Using the **`:eq()`** Selector:**


    The `:`**`eq()`** selector allows you to select a specific element within a set
    by providing its index. Indexing starts from 0.


    For example, to select the second element within a set of elements, you would
    use **`:eq(1)`** because it is at index 1 (remember, the index is 0-based).


    `$(‘ul li:eq(2)’).css(‘color’, ‘red’);`


    In this case, the text color of the third **`<li>`** element (index 2) within
    a **`<ul>`** element is changed to red.


    **Using the **`:lt()`** Selector:**


    The **`:lt()`** selector allows you to select all elements up to, but not including,
    a specified index. This is useful when you want to select a range of elements
    within a set. To select the first three elements, you would use **`:lt(3)`**`:`


    `$(‘ul li:lt(3)’).addClass(‘highlight’);`


    This will add the **`highlight`** class to the first, second, and third **`<li>`**
    elements within a **`<ul>`**`.`


    These selectors are helpful in situations where you want to target specific elements
    within a set without having to manually count elements in the DOM structure. They
    provide a concise and efficient way to work with elements based on their position
    within a selection, making your code more dynamic and flexible.


    # [Exercise: Use the **`get()`** method to return the DOM element object](#toc.xhtml_s126a)


    In this exercise, you will be using the **`.get()`** method in jQuery to retrieve
    DOM element objects from a selected set of elements. Once you have the DOM element
    object, you’ll use JavaScript’s DOM methods and properties to interact with these
    elements. Specifically, you will create a click event on buttons that will get
    the length of items in the jQuery selection and then loop through these items,
    using the **`.get()`** method to return the DOM element object and retrieve the
    `textContent` value from each element. Finally, you’ll add the values to the page
    using jQuery.


    Here are more detailed steps to follow for this exercise:


    **Step 1: Select a jQuery Set of Elements**


    *   You’ll start by selecting a set of elements using a jQuery selector. In your
    case, you’re selecting elements with the class `main div.`


    **Step 2: Use the** **`.get()`** **Method and JavaScript DOM properties**


    *   In the first button’s click event (**`#btn1`**), you’re using the **`.get(1)`**
    method for retrieving the DOM element object at index 1\. This corresponds to
    the second element in the set (since the index is zero-based).


    *   You then use JavaScript DOM properties to interact with this element. You’re
    logging its **`innerHTML`** and `textContent` values to the console.


    **Step 3: Create a **`Click`** Event to Loop Through Elements**


    *   In the second button’s click event `(`**`#btn2`**`),` you’re performing a
    more complex operation.


    *   First, you get the length of the elements in the jQuery selection using **`.length`**.


    *   You then initialize an empty html variable to store the text content of elements.


    *   Next, you start a for loop to iterate through the elements. Inside the loop,
    you use the .**`get(i)`** method to retrieve the DOM element object at each index,
    and you log its `textConten`t value to the console.


    *   You’re also concatenating the index and `textContent` value into the html
    string.


    *   Finally, you’re using jQuery to set the **`text()`** of an element with the
    class “**`span1`**” to display the concatenated `textContent` values.


    This exercise demonstrates how to use the **`.get()`** method to access DOM element
    objects within a jQuery selection and utilize JavaScript’s DOM properties to interact
    with those elements. By adding the `textContent` values to the page, you can display
    information from the DOM elements to the user in a different format or context.


    **HTML**


    `<nav>`


    `<div class=”main”>`


    `<div class=”div1”>Hello World 1</div>`


    `<div class=”div2”><span>Hello World 2</span></div> <div class=”div3” id=”div3”>Hello
    World 3</div>`


    `<div class=”div4”>Laurence Svekis</div>`


    `<input>`


    `<button id=”btn1”>1</button>`


    `<button id=”btn2”>2</button>`


    `<button id=”btn3”>3</button>`


    `<span class=”span1”>Hello</span>`


    `</div>`


    `</nav>`


    `<button id=”btn4”>4</button>`


    `<button id=”btn5”>5</button>`


    **JavaScript**


    `$(‘#btn1’).click(()=>{`


    `const temp = $(‘.main div’).get(1);`


    `console.log(temp.innerHTML);`


    `console.log(temp.textContent);`


    `})`


    `$(‘#btn2’).click(()=>{`


    `const len = $(‘.main div’).length;`


    `console.log(len);`


    `let html = ‘’;`


    `for(let i=0;i<len;i++){`


    `const temp = $(‘.main div’).get(i);`


    `console.log(temp.textContent);`


    ``html += `${i}.`` ``${temp.textContent} `;``


    `}`


    `$(‘.main .span1’).text(html);`


    `})`


    # [Exercise: Make a selection of page elements with jQuery and return the **`index()`**
    value of the selected element](#toc.xhtml_s127a)


    This exercise focuses on using jQuery’s **`index()`** method to return the index
    value of selected elements in different scenarios. It involves adding click events
    to elements and outputting their index values into the console. Here are the detailed
    steps for this exercise:


    Step 1: Create a Button Click Event to Output Index


    1.  In this step, you’re targeting the button with the id btn1 to create a click
    event.


    2.  When this button is clicked, you’re using the **`$(this).index()`** method
    to retrieve the index of the clicked button.


    3.  You’re logging the index value to the console.


    Step 2: Add Click Events to Page Divs in the `main` Class


    1.  You’re targeting all the div elements within the main class **`(.main div)`**
    using a selector.


    2.  For each of these divs, you’re creating a click event.'
