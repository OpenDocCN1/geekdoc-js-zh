    \ the mouse pointer moves over selected HTML element. This event is triggered\
    \ continuously as the cursor is in motion within the element’s boundaries. It\
    \ is commonly used to track the mouse’s position and create interactive features\
    \ like updating coordinates or following the mouse. The event handler receives\
    \ information about the mouse’s current position, which can be used for various\
    \ purposes in web applications.\n\nFunction: This method assigns a function to\
    \ be executed when the mouse pointer moves over the document.\nExplanation: When\
    \ the mouse pointer moves anywhere over the document, the text content of the\
    \ div with class `div1` changes to display the current X and Y coordinates of\
    \ the mouse pointer.\n\n## mouse events and hover\n\nExercise: Attach various\
    \ mouse movement events to elements.\n1. Add the `hover()` event to the divs within\
    \ the `main` class. On entering, update the background color to red and on leave\
    \ set it back to white.\n2. Add `mouseup()` and `mousedown()` to the divs updating\
    \ the text and the color of the background on different mouse states.\n3. Add\
    \ `mouseout()` and `mouseleave()` to the main element, and check the difference.\n\
    4. Add `mouseenter()` and `mouseover()` to the main element, check the difference.\n\
    5. Add `mouseenter()` and `mouseleave()` to the buttons, to update the background\
    \ color just like the `hover()` event.\n6. On the main track the `mousemove()`\
    \ from the event object, get the values of `pageX` and `pageY` property values\
    \ and output them into a page element.\n\nCSS Code:\n```css\n.box{\n  border:\
    \ 1px solid #ddd;\n  height: 50px;\n  width: 100px;\n}\n```\n\nHTML Code:\n```html\n\
    <nav>\n  <div class=\"main\">\n    <div class=\"div1\">Hello World 1</div>\n \
    \   <div class=\"div2\"><span>Hello World 2</span></div>\n    <div class=\"div3\"\
    \ id=\"div3\">Hello World 3</div>\n    <div class=\"div4\">Laurence Svekis</div>\n\
    \    <button id=\"btn1\">1</button>\n    <button id=\"btn2\">2</button>\n    <button\
    \ id=\"btn3\">3</button>\n    <span class=\"span1\">Hello</span>\n  </div>\n</nav>\n\
    <button id=\"btn4\">4</button>\n<button id=\"btn5\">5</button>\n```\n\nJavaScript\
    \ Code:\n```javascript\n$('.main div').addClass('box').hover(\n  function() {\
    \ \n    $(this).css('background-color', 'red') \n  },\n  function() { \n    $(this).css('background-color',\
    \ 'white') \n  }\n).mouseenter(function(e) {\n  //$(this).text(`X:${e.pageX} Y:${e.pageY}`);\n\
    });\n\n$('.main div').mouseup(function() {\n  $(this).text('MOUSE UP');\n  $(this).css('background-color',\
    \ 'blue');\n}).mousedown(function() {\n  $(this).text('MOUSE DOWN');\n  $(this).css('background-color',\
    \ 'green');\n});\n\n$('.main').mouseout(() => {\n  $('.div2').text('Mouse OUT\
    \ on MAIN!'); \n});\n\n$('.main').mouseover(() => {\n  $('.div2').text('Mouse\
