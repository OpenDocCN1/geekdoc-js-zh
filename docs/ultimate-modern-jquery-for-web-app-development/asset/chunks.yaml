  trans: "\n\n当我们深入探索 jQuery 世界时，探索访问和使用这一强大库的替代方法至关重要。除了本地下载 jQuery 文件外，我们还可以利用 CDN（内容分发网络）的能力简化集成过程并优化\
    \ Web 应用程序的性能。在本节中，我们将深入探讨 CDN 的概念，以及在将 jQuery 整合到网页中时如何利用它的优势。\n\nCDN 是一个在世界范围内战略性部署的分布式服务器网络。CDN\
    \ 的主要目标是通过地理位置上更接近用户的服务器提供内容，从而更高效向用户交付网络内容（如图像、脚本、样式表和库）。这导致了延迟的减少、加载速度加快以及可靠性的提高。\n\
    \n通过 CDN 引入 jQuery 有许多优势，可以增强您的 Web 应用程序的性能和可靠性：\n\n*   CDN 将内容分发到多个服务器，允许浏览器从最近的服务器获取资源。这最小程度地减少了数据传输的距离，从而实现了更快的加载速度和更好的用户体验。\n\
    *   CDN 针对缓存进行了优化，当用户访问使用 CDN 托管 jQuery 版本的网站时，他们的浏览器可能已经从之前访问其他网站时缓存了 jQuery\
    \ 文件。这减少了冗余下载并提高了浏览器的整体效率。\n*   CDN 设计用于处理高大量流量，并通常配备了先进的安全功能，提高了它们所托管资源的整体可靠性和可用性。\n\
    \n要使用 CDN 将 jQuery 包含在您的项目中，您不需要下载任何文件。相反，您可以直接从 CDN 服务器引用该库。以下是操作方法：\n\n```html\n\
    <!-- 从 Google CDN 引入 jQuery -->\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js\"\
    ></script>\n\n<!-- 从 Microsoft CDN 引入 jQuery -->\n<script src=\"https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.6.0.min.js\"\
    ></script>\n```\n\n选择提供的 URL 之一（或探索其他 CDN 选项），并将 `<script>` 标签放在 HTML 文档的 `<head>`\
    \ 中或紧接在 `</body>` 结束标签之前。\n\n通过 CDN 引入 jQuery，您利用了一个专门用于优化网络内容交付的全球服务器网络。这种方法增强了您的\
    \ Web 应用程序的加载速度和整体性能，同时也减轻了自身托管资源的负担。\n\n以下是关于如何向 HTML 中添加 jQuery 并使用 jQuery 创建简单的元素选择、事件和元素内容操作的逐步指南：\n\
    \n**练习**：创建一个文件 `add jQuery`，并编写一些 jQuery 代码：\n\n1.  创建一个 HTML 文件并添加一个页面元素。\n\
    2.  添加指向 jQuery 库的 `<script>` 标签链接。\n3.  添加第二个 `<script>` 标签链接到名为 `app1.js` 的新\
    \ `js` 文件。\n4.  在浏览器中打开 HTML 并检查页面上是否有 jQuery。\n5.  在 `app1.js` 中，使用与 CSS 相同的语法选择元素，例如\
    \ `$()...`。\n6.  添加一个名为 `.html()` 的 jQuery 方法。\n7.  在 `.html()` 中添加一个字符串值。\n8.\
    \  为元素添加 `on('click')`，并将 `html` 的更新嵌套在其中。\n9.  在点击方法上链式添加第二个 `.html()`，并传入另一个字符串值。\n\
    \n**INDEX.HTML**\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>jQuery\
    \ Course</title>\n</head>\n<body>\n    <div>Hello World</div>\n    <script src=\"\
    https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js\"></script>\n\
    \    <script src=\"app1.js\"></script>\n</body>\n</html>\n```\n\n**APP1.JS**\n\
    \n```javascript\n$('div').on('click',() => {\n    $('div').html('Laurence Sveis');\n\
    }).html('Click Me');\n```\n\n这里是 jQuery 的一些简单示例。我们将在随后的章节中详细介绍它们的工作原理：\n\n1. \
    \ **文档就绪 (Document Ready)**\n    当文档完全加载并准备绪时运行代码：\n    ```javascript\n    $(document).ready(function()\
    \ {\n        //在此处编写您的代码\n    });\n    ```\n\n2.  **点击事件 (Click Event)**\n   \
    \ 当元素被点击时执行代码：\n    ```javascript\n    $(\"#myButton\").click(function() {\n \
    \       //在此处编写您的代码\n    });\n    ```\n\n3.  **隐藏与显示 (Hide and Show)**\n    切换元素的可见性：\n\
    \    ```javascript\n    $(\"#toggleButton\").click(function() {\n        $(\"\
    #targetElem\").toggle();\n    });\n    ```\n\n4.  **添加 CSS (Adding CSS)**\n  \
    \  更改元素的 CSS 属性：\n    ```javascript\n    $(\"#myElem\").css(\"color\", \"blue\"\
    );\n    ```\n\n5.  **添加类 (Adding Classes)**\n    为元素添加 CSS 类：\n    ```javascript\n\
    \    $(\"#myElem\").addClass(\"highlight\");\n    ```\n\n6.  **淡入淡出效果 (Fading\
    \ Effects)**\n    对元素应用淡入效果：\n    ```javascript\n    $(\"#myButton\").click(function()\
    \ {\n        $(\"#targetElem\").fadeIn();\n    });\n    ```\n    ```javascript\n\
    \    $(\"#myButton\").click(function() {\n        $(\"#targetElem\").fadeOut();\n\
    \    });\n    ```\n\n7.  **滑动效果 (Slide Effects)**\n    对元素应用滑动效果：\n    ```javascript\n\
    \    $(\"#myButton\").click(function() {\n        $(\"#targetElem\").slideDown();\n\
    \    });\n    ```\n    ```javascript\n    $(\"#myButton\").click(function() {\n\
    \        $(\"#targetElem\").slideUp();\n    });\n    ```\n\n8.  **AJAX 请求 (AJAX\
    \ Request)**\n    从服务器获取数据而无需刷新页面：\n    ```javascript\n    $.ajax({\n        url:\
    \ \"data\",\n        success: function(data) {\n            // 处理数据\n        },\n\
    \        error: function() {\n            // 处理错误\n        }\n    });\n    ```\n\
    \n9.  **鼠标悬停 (Mouse Hover)**\n    当进入或离开元素时执行操作：\n    ```javascript\n    $(\"\
    #myElem\").hover(\n        function() {\n            // 鼠标进入\n        },\n   \
    \     function() {\n            // 鼠标离开\n        }\n    );\n    ```\n\n10. **动画\
    \ (Animations)**\n    使用 jQuery 的 animate 方法创建动画：\n    ```javascript\n    $(\"\
    #myButton\").click(function() {\n        $(\"#targetElem\").animate({\n      \
    \      width: \"200px\",\n            height: \"200px\"\n        }, 1000); //\
    \ 动画时长，毫秒\n    });\n```\n\n这些示例为探索 jQuery 功能提供了良好的起点。请记住，jQuery 提供了用于操作 DOM、处理事件、发送\
    \ AJAX 请求和创建动态动画的各种方法和函数。当你熟悉了这些基础知识后，就准备好进入更复杂的场景并构建应用程序了。\n\n# 浏览器开发者工具\n\n\
    使用 Chrome 开发者工具（DevTools）是交互和理解网页的一种强大方法。以下是如何使用的简要说明：\n\n1.  **访问开发者工具**：打开 Chrome\
    \ 并导航到想要检查的网页。在页面任意位置右键点击并选择“检查”，或使用快捷键 *Ctrl+Shift+I*（Mac 上为 *Cmd+Opt+I*）。这将打开面板。\n\
    2.  **元素面板 (Elements)**：此面板允许查看和修改页面的 HTML 和 CSS。你可以检查 DOM、修改样式并查看这些更改对网页布局和外观的影响。\n\
    3.  **控制台 (Console)**：控制台标签用于在 JavaScript 开发过程中记录信息。你也可以通过直接执行 JavaScript 命令与网页交互。\n\
    4.  **源面板 (Sources)**：你可以在此处调试 JavaScript，设置断点、单步执行代码并检查变量。你可以直接在此面板中查看和编辑源码。\n\
    5.  **网络面板 (Network)**：它提供了有关当前页面网络活动的信息。你可以看到每个请求的文件、其加载时间以及标头、响应负载和 HTTP 状态码等详细信息。\n\
    6.  **性能面板 (Performance)**：使用此面板分析网页的运行时性能。它帮助理解渲染、脚本执行和加载页面所消耗资源和时间。\n"
