  trans: "\n\njQuery 中的 `.mouseenter()` 方法用于分配一个函数，该函数会在鼠标指针进入 HTML 元素的边界时执行。它在鼠标悬停在选定元素上时触发。此事件通常用于创建交互效果，例如显示工具提示或更改元素的外观。它通常与\
    \ `.mouseleave()` 事件配合使用，以处理元素的鼠标进入和离开事件。\n\n功能：此方法分配一个函数，当鼠标指针进入元素时执行该函数。\n解释：当鼠标指针进入\
