  trans: "\n\n1. `$(‘.selected’)` 选择类名为 `selected` 的元素。\n\n2. .next 选择 DOM 中的下一个兄弟元素，然后通过添加\
    \ `highlighted` 类对其进行高亮。\n\n3. 同样，你可以使用 `.prev()` 来选择上一个兄弟元素。\n\n### `.next()`\
    \ 和 `.prev()` 的优势：\n\n*   **精确选择：** 这些方法允许你精确地定位到特定元素相邻的元素，简化复杂的 DOM 交互。\n*  \
    \ **顺序操作：** 你可以轻松地在同一个父容器内的元素上执行顺序操作。\n*   **代码可读性：** 提高了代码的可可读性，因为选择相邻元素的意图显而易见。\n\
    *   **高效遍历：** jQuery 优化了遍历过程，使得兄弟元素之间的导航变得高效。\n\n总而言之，`.next()` 和 `.prev()` 方法对于选择和交互\
    \ DOM 中的兄弟元素非常有价值，能够让你轻松地创建动态且响应式的网页。\n\n# 练习：使用 jQuery 遍历页面兄弟元素及进行其他选择\n\n在本次练习中，你将使用\
    \ jQuery 中的各种兄弟元素方法来遍历与所选元素处于同一级的元素。你为这些元素应用不同的类，以观察遍历方法的效果。\n\n### 指南：\n\n1.\
    \ 当点击第一个按钮时，为所选元素的所有兄弟元素应用 `box` 类。\n2. 给第二个按钮添加事件监听器，点击时移除所有类名为 `box` 的元素。\n\
    3. 点击第三个按钮时，为标签名为 `div` 的元素的兄弟元素添加 `box` 类。\n4. 点击按钮时，对页面元素使用 `next()`、`nextAll()`\
    \ 和 `nextUntil()` 方法，并对所选元素应用类。\n5. 点击另一个按钮时，对页面元素使用 `prev()`、`prevAll()` 和 `prevUntil()`\
    \ 方法，并对匹配的元素应用类。\n\n### CSS\n\n```css\n.box {\n  border: 1px solid #ddd;\n  adding:\
    \ 5px;\n  color: red;\n}\n.box1 {\n  border: 1px solid #ddd;\n  ppadding: 5px;\n\
    \  color: blue;\n}\n.box2 {\n  border: 1px solid #ddd;\n  padding: 5px;\n  color:\
    \ green;\n}\n```\n\n### HTML\n\n```html\n<nav>\n  <div class=\"main\">\n    <div\
    \ xclass=\"div1\">Hello World 1</div>\n    <div class=\"div2\"><span>Hello World\
    \ 2</span></div>\n    <div class=\"div3\" id=\"div3\">Hello World 3</div>\n  \
    \  <div class=\"div4\">Laurence Svekis</div>\n    <input>\n    <button id=\"btn1\"\
    >1</button>\n    <button id=\"btn2\">2</button>\n    <button id=\"btn3\">3</button>\n\
    \    <span>Hello</span>\n  <//div>\n</nav>\n<button id=\"btn4\">4</button>\n<button\
    \ id=\"btn5\">5</button>\n```\n\n### JavaScript 代码\n\n```javascript\n$(‘#btn1’).click(()\
    \ => {\n  const siblings = $(‘#btn1’).siblings();\n  console.log(siblings);\n\
    \  siblings.addClass(‘box’);\n});\n\n$(‘#btn2’).click(() => {\n  $(‘.box’).removeClass(‘box’);\n\
    });\n\n$(‘#btn3’).click(() => {\n  $(‘#btn1’).siblings(‘div’).addClass(‘box’);\n\
    });\n\n$(‘#btn4’).click(() => {\n  $(‘#btn1’).next().addClass(‘box’);\n  $(‘#btn1’).nextAll(‘span’).addClass(‘box’);\n\
    \  $(‘#div3’).nextUntil(‘button’).addClass(‘box1’);\n});\n\n$(‘#btn5’).click(()\
    \ => {\n  $(‘#btn1’).prev().addClass(‘box2’);\n  $(‘#btn1’).prevAll(‘span’).addClass(‘box2’);\n\
    \  $(‘#div3’).prevUntil(‘button’).addClass(‘box2’);\n});\n```\n\n此练习帮助你更熟悉 jQuery\
    \ 的兄弟元素遍历方法，并展示了如何将它们应用于 DOM 层次结构中同一级的元素。你将看到不同的方法如何在选择和操作兄弟元素工作。\n\n# 过滤页面元素以使用\
    \ jQuery 选择\n\n在本节中，我们将深入研究 jQuery 中的 `.filter()` 方法。该方法允许你根据给定条件细化选择，使你能够在一个较大的元素集中选择符合特定标准的元素。当你想要将选择缩小到符合某些条件的元素时，这非常有用。\n\
    \n### 理解 `.filter()`\n\n考虑这样一种场景：你有一组由 `<li>` 元素表示的任务列表，你想选择包含特定条件的任务并为它们添加 `completed-task`\
    \ 类。\n\n### `.filter()` 的优势：\n\n*   **精确选择：** 这些方法允许你精确地定位到特定元素相邻的元素，简化了复杂的 DOM\
    \ 交互。\n*   **顺序操作：** 你可以轻松地在同一个父容器内的元素上执行顺序操作。\n*   **代码可读性：** 提高了代码的可读性，因为选择相邻元素的意图显而易见。\n\
    *   **高效遍历：** jQuery 优化了遍历过程，使得兄弟元素之间的导航变得高效。\n\n总而言之，`.filter()` 方法对于选择和交互 DOM\
    \ 中的元素非常有价值，能够让你创建动态且响应式的网页。\n\n```javascript\n$(li).filter(function() {\n  return\
    \ $(this).text() === \"completed\";\n}).addClass(\"completed-task\");\n```\n\n"
- fmt: "\nIn this exercise, you will learn how to create dynamic page elements using\
    \ jQuery. You’ll start with an array of string values and use jQuery to loop through\
    \ these items and generate dynamic content on the page.\n\n## Instructions:\n\n\
    1.  Create an array of string values containing names.\n\n2.  Use the `$.each()`\
    \ method to loop through the array items. In the callback function, add each value\
    \ as a `<div>` element to the page and assign it a class of `box.`.\n\n3.  Select\
    \ all elements with a class of `box` and use the `each()` method again to iterate\
    \ through them.\n\n4.  For each `box` element, select its text content using the\
    \ `text()` method and store it as a variable.\n\n5.  Empty the contents of the\
    \ `box` element using the `empty()` method.\n\n6.  Create a `<span>` element with\
    \ the text content you stored in step 4 and append it to the `box` element.\n\n\
    7.  Add two buttons, one with the text `Up` and the other with the text `Down,`,\
    \ to each `box` element.\n\n8.  Add a click event to the `Up` button. Inside the\
    \ event handler, select the previous sibling of the parent element and assign\
    \ it to a variable `$sel`.\n\n9.  Check if the length of the selected element\
    \ is greater than zero. If it is, add a class of `active` to the current `box`\
    \ element and slide it up slowly. When the slide-up animation is complete, remove\
    \ the `active` class, insert the `box` element before the selected element using\
    \ `insertBefore()`, and slide it down fast.\n\n10. Add a click event to the `Down`\
    \ button. Inside the event handler, select the next sibling of the parent element\
    \ and assign it to a variable `$sel`.\n\n11. Check if the length of the selected\
    \ element is greater than zero. If it is, add a class of `active` to the current\
    \ `box` element and slide it up slowly. When the slide-up animation is complete,\
    \ remove the `active` class, insert the `box` element after the selected element\
    \ using `insertAfter()`, and slide it down fast.\n\n12. Apply some animations\
    \ and styling to the `box` elements for better visual effects.\n\n## CSS:\n\n\
    ```css\n.btn {\n  background-color: black;\n  color: white;\n  font-size: 0.6em;\n\
    }\n.output span {\n  margin: 5px;\n}\n.active {\n  color: red;\n}\n```\n\n## HTML:\n\
    \n```html\n<div class=\"output\"></div>\n```\n\n## JavaScript Code:\n\n```javascript\n\
    const arr = ['Laurence', 'Larry', 'Mike', 'Dave', 'Jane', 'Joe', 'Lisa', 'Jack'];\n\
    $.each(arr, (ind, val) => {\n  let html = `${ind + 1} ${val}`;\n  $('<div>').html(html).addClass('box').appendTo('.output');\n\
    });\n$('.box').each(function () {\n  $ele = $(this);\n  $par = $ele.parent();\n\
    \  const temp = $ele.text();\n  $ele.empty();\n  $('<span>').text(temp).appendTo($ele);\n\
    \  $btn1 = $('<button>').text('Up').addClass('btn').appendTo($ele);\n  $btn2 =\
    \ $('<button>').text('Down').addClass('btn').appendTo($ele);\n  $btn1.click(function\
    \ () {\n    $sel = $(this).parent().prev();\n    if ($sel.length > 0) {\n    \
    \  $(this).parent().addClass('active');\n      $(this).parent().slideUp('slow',\
    \ function () {\n        $(this).removeClass('active');\n        $(this).insertBefore($sel);\n\
    \        $(this).slideDown('fast');\n      });\n    }\n  });\n  $btn2.click(function\
    \ () {\n    $sel = $(this).parent().next();\n    if ($sel.length > 0) {\n    \
    \  $(this).parent().addClass('active');\n      $(this).parent().slideUp('slow',\
    \ function () {\n        $(this).removeClass('active');\n        $(this).insertAfter($sel);\n\
    \        $(this).slideDown('fast');\n      });\n    }\n  });\n});\n```\n\nThis\
    \ exercise demonstrates how to dynamically create page elements, manipulate their\
    \ content, and add interactivity to them using jQuery. It’s a practical example\
    \ of creating and managing dynamic content on a web page.\n\n## Conclusion\n"
