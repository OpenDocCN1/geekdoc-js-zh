    \   Use jQuery to add event handlers to elements.\n\n    For instance, to add\
    \ a click event to the **`Add to List`** button (**`#btn1`**), use **`$(‘#btn1’).click(handlerFunction);`**.\n\
    \n    Initialize a counter variable to keep track of added items. You can declare\
