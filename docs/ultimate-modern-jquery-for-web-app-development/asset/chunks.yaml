  trans: "\n\n通过完成此练习，读者将获得使用 jQuery 创建交互式 Web 功能、基于用户交互操作 DOM 以及使用 CSS 类对元素进行设计的实用经验。本项目为使用\
    \ jQuery 进行 Web 开发提供了宝贵的实操经验。\n\n## 总结\n\n在本次练习中，你学习了如何使用 jQuery 创建交互式列表。用户可以向列表添加新项目、通过点击项目来划掉项目，并通过点击每个项目关联的删除按钮来移除项目。该练习分为几个步骤，包括使用\
    \ CSS 为列表元素设置样式、搭建 HTML 结构，以及实现 jQuery 事件处理以创建、修改和删除列表项目。\n\n## 结论\n\n本章为读者提供了实践经验，加强了他们对\
    \ jQuery 概念的理解。通过引导读者创建一个带有交互元素的动态列表，本章演示了如何应用各种 jQuery 方法来修改列表的内容和结构。读者学习了如何通过为交互元素添加事件监听器，使他们的项目功能完备。此外，我们还探索了\
    \ CSS 在列表及其元素样式化方面的关键作用，确保了项目不仅具有功能性，而且具有视觉吸引力。\n\n在下一章中，我们将使用 jQuery 深入研究 CSS\
    \ 属性和元素属性。你将学习如何使用 `.css()` 方法动态更改页面元素的外观，使用 `.attr()` 操作属性，并通过通过 `.addClass()`、`.removeClass()`\
    \ 和 `.toggleClass()` 添加或删除类来增强交互性。在下一章中，你将接触修改元素样式和属性，使你的 Web 项目更具动态且更美观。\n\n\
    ## 注意事项\n\n*   **使用 CSS 样式化：**\n    使用 CSS 选择器和属性为列表元素定义 CSS 样式。\n    例如，你可以使用\
    \ `li`、`.red` 和 `li button` 等选择器来定位特定元素。\n    定义颜色、文本装饰、字体大小、背景颜色和内边距等属性，以按需设置元素。\n\
    \n*   **HTML 结构：**\n    使用标准的 HTML 标签创建 HTML 结构。\n    包含无序列表 (`<ul>`)、用于添加项目的输入字段\
    \ (`<input>`) 以及用于触发添加项目的按钮 (`<button>`)。\n    为元素分配适当 ID 和类，以便于选择和操作。\n\n*  \
    \ **jQuery 事件处理：**\n    使用 jQuery 为元素添加事件处理器。\n    例如，要为“添加到列表”按钮 (`#btn1`) 添加点击事件，请使用\
    \ `$('#btn1').click(handlerFunction);`。\n    初始化计数器变量以跟踪已添加的项目。你可以这样声明：`let counter\
    \ = 0;`。\n\n*   **添加列表项目：**\n    使用 `$('input').val()` 获取输入字段的值。\n    使用 `$('<li>')`\
    \ 创建一个新的列表项目 (`<li>`)。\n    使用 `$('<<span>>').text(textContent)` 创建一个包含内容的 `<span>`\
    \ 元素。\n    使用 `$('button>').text('X')` 创建一个删除按钮 (`<button>`)。\n\n*   **点击时切换类：**\n\
    \    为 `<span>` 元素添加点击事件处理器，例如 `$span.click(clickHandler)`。\n    使用 `.toggleClass('red')`\
    \ 切换父元素 `<li>` 上的 `red` 类。\n\n*   **点击按钮时移除项目：**\n    为删除按钮添加点击事件处理器，例如 `$btn.click(clickHandler)`。\n\
    \    在事件处理器内部，使用 `$li.remove()` 从列表中移除父级 `<li>` 元素。\n\n*   **追加元素：**\n    使用 `.append()`\
    \ 将元素相互追加，例如 `$li.append($span).append($btn)`。\n    使用 `$('.output').append($li)`\
    \ 将生成的 `<li>` 元素追加到带有类 `output` 的 `<ul>` 中。\n\n## 选择题\n\n1. 在提供的 CSS 样式中，`red`\
    \ 类的作用是什么？\n```css\n.red span {\ncolor: red;\n}\n```\nA. 设置宽度\nB. 颜色\nC. 给文本添加下划线\n\
    D. 添加外边距\n\n2. `$(val())` 的作用是什么？\nA. 添加新项目\nB. 移除输入字段\nC. 获取值\nD. 切换文本\n\n3.\
    \ 什么触发了代码执行？\nA. 点击按钮\nB. 在输入字段中输入\nC. 刷新列表\nD. 鼠标悬停在列表上\n\n## 答案\n\n1. B\n2.\
    \ C\n3. A\n\n"
- fmt: "\n<img id=\"myImage\" src=\"image1.jpg\" alt=\"Image 1\">\n\n<button id=\"\
    toggleImage\">Toggle Image</button>\n\n### JS:\n\n```javascript\n$('#toggleImage').click(function\
    \ () {\n  const image = ($('#myImage');\n  const currentSrc = image.attr('src');\n\
    \  if (currentSrc === 'image1.jpg') {\n    image.attr('src', 'image2.jpg');\n\
    \    image.attr('alt', 'Image 2');\n  } else {\n    image.attr('src', 'image1.jpg');\n\
    \    image.attr('alt', 'Image 1');\n  }\n});\n```\n\n### Explanation:\n\nIn this\
    \ example, we have an image element `<img>` with the id of `myImage`. Initially,\
    \ it displays `Image 1` with the source attribute (src) set to `image1.jpg`.\n\
    \nWhen the `Toggle Image` button is clicked, the jQuery `.attr()` method is used\
    \ to:\n\n- Get the current value of the `src` attribute using `image.attr('src')`\
    \ and store it in the `currentSrc` variable.\n- Check the current source (`currentSrc`).\n\
    - If the current source is `image1.jpg`, it changes the `src` attribute to `image2.jpg`\
    \ and updates the alt attribute to `Image 2`. Otherwise, it reverts to `image1.jpg`\
    \ and `Image 1`.\n\nThis example demonstrates how to use the `.attr()` method\
    \ to dynamically change attributes of HTML elements based on user interactions,\
    \ such as toggling between different images.\n\n# Retrieving and Modifying Element\
    \ Dimensions with jQuery\n\n**Understanding Element Dimensions**: We’ll discuss\
    \ the concept of element dimensions, including width, height, and positioning.\n\
    \n- **Using `.width()`, `.height()`, and `.position()`**: jQuery provides methods\
    \ like `.width()` and `.height()` to retrieve and modify dimensions, as well as\
    \ `.position()` to get the position of an element within its parent container.\
    \ Examples will illustrate how to adjust the size and placement of elements.\n\
    - **Dynamic Layout Adjustments**: Readers will learn how to create responsive\
    \ designs by dynamically adjusting element dimensions based on browser window\
    \ size or user interactions.\n\n### Adding and Removing CSS Classes with jQuery:\n\
    \n**Adding and Removing CSS Classes**: We’ll delve into the `.addClass()` and\
    \ `.removeClass()` methods in jQuery, which allow us to add or remove CSS classes\
    \ from selected elements. These classes can define various styles, making it easy\
    \ to change an element’s appearance with a single method call.\n\n# Example: Toggle\
    \ CSS Classes on Button Click\n\n### CSS:\n\n```css\n.red {\n  color: red;\n}\n\
    .blue {\n  color: blue;\n}\n```\n\n### HTML:\n\n```html\n<p id=\"myText\">This\
    \ text can change color.</p>\n<button id=\"toggleRed\">Toggle Red</button>\n<button\
    \ id=\"toggleBlue\">Toggle Blue</button>\n```\n\n### JS:\n\n```javascript\n$('#toggleRed').click(function\
    \ () {\n  $('#myText').addClass('red'); // Add the red class\n  $('#myText').removeClass('blue');\
    \ // Remove the blue class\n});\n$('#toggleBlue').click(function () {\n  $('#myText').addClass('blue');\
    \ // Add the blue class\n  $('#myText').removeClass('red'); // Remove the red\
    \ class\n});\n```\n\n### Explanation:\n\nIn this example, we have paragraph element\
    \ `<p>` with the id of `myText`. Initially, it has no classes applied, so its\
    \ text color is default. We also have two buttons, `Toggle Red` and `Toggle Blue`.\n\
    \nWhen the `Toggle Red` button is clicked, jQuery’s `.addClass('red')` method\
    \ is used to add the red class to `#myText`, changing its text color to red. Then,\
    \ `.removeClass('blue')` is used to remove the blue class if present, ensuring\
    \ only the red class is applied.\n\nConversely, when the `Toggle Blue` button\
    \ is clicked, jQuery’s `.addClass('blue')` method is used to add the blue class\
    \ to `#myText`, changing its text color to blue. `.removeClass('red')` is used\
    \ to remove the red class if present, ensuring only the blue class is applied.\n\
    \nThese examples demonstrate how to use the `.addClass()` and `.removeClass()`\
    \ methods to dynamically change styling of HTML elements by toggling CSS classes\
    \ based on interactions.\n\n**Using `.toggleClass()`**: The `.toggleClass()` method\
    \ toggles a class on and off for selected elements. This is useful for creating\
    \ interactive elements that change style with interactions.\n\n# Exercise: Get\
    \ the Style Properties of an Element\n\n### HTML:\n\n```html\n<button id=\"btn1\"\
    >Button 1</button>\n<button id=\"btn2\">Button 2</button>\n<div>\n<div>\n```\n\
    **Figure 7.1**: Style properties of an element\n\nIn this exercise, we’ll explore\
    \ how to interact with the style properties of HTML elements using jQuery. We’ll\
    \ add events to buttons and elements to update style properties, generate random\
    \ colors, retrieve style properties, and increment the width of elements.\n\n\
    ### Step 1: Toggling Classes and Updating Style Properties\n\nWe start by adding\
    \ click events to two buttons, `#btn1` and `#btn2`. When clicked, these buttons\
    \ will toggle the `red` and `blue` classes on all div elements, respectively.\
    \ Additionally, they will update the width style property.\n\n```javascript\n\
    $('#btn1').click(() => {\n  $(div').toggleClass('red');\n  $(div').css('width',\
    \ '100px');\n});\n$('#btn2').click(() => {\n  $(div').toggleClass('blue');\n \
    \ $(div').css('width', '+50');\n});\n```\n\n### Step 2: Generating Random Colors\
    \ and Updating Style Properties\n\nWe add a click event to all div elements on\
    \ the page. When clicked, this event generates random colors for the color and\
    \ background-color style properties using JavaScript.\n\n```javascript\n$(div').click(function\
    \ () {\n  const rc = '#' + Math.random().toString(16).substring(2, 8);\n  const\
    \ rc2 = '#' + Math.random().toString(16).substring(2, 8);\n  $(this).css('background-color',\
    \ rc);\n  $(this).css('color', rc2);\n  // Retrieve multiple style properties\
    \ and store them in 'temp'.\n  const temp = $(this).css(['color', 'background-color',\
    \ 'height', 'font-size', 'width']);\n  // Create an HTML string to display the\
    \ style properties.\n  let elText = $(this).text();\n  let html = `<h1>${elText}</h1><ul>`;\n\
    \  for (const prop in temp) {\n    html += `<li>${prop}:${temp[prop]}</li>`;\n\
    \  }\n  html += '</ul>';\n  // Display the style properties in one of the page\
    \ elements.\n  output(html);\n});\n```\n\n### Step 3: Output Function\n\nWe create\
    \ an output function to display content within one of the page elements `(.div4)`.\n\
    \n```javascript\nfunction output(val) {\n  $('.div4').html(val);\n}\n```\n\n###\
    \ Step 4: Testing\n\nThe exercise is complete, and users can interact with the\
    \ buttons to toggle classes and update style properties, click on div elements\
    \ to change their colors and retrieve style properties, and click `.div4` to display\
    \ content.\n\nBy working through this exercise, readers will gain practical experience\
    \ in using jQuery to update and retrieve style properties of HTML elements. They\
    \ will also learn how to generate random colors, toggle classes, and dynamically\
    \ adjust element dimensions. These skills are valuable for creating dynamic and\
    \ visually appealing web applications.\n\n# Exercise: Getting and Setting Element\
    \ Attributes with jQuery\n\nIn this exercise, we will work with input checkboxes\
    \ and various attributes to understand how to get and set element properties.\
    \ We’ll also explore event handling and detaching elements for later use.\n\n\
    **Instructions:**\n\nUsing a for loop, create checkboxes with attributes. Add\
    \ a click event to each checkbox that will output the value of the element from\
    \ the attribute of `checked`, the property of `checked`, and using the `is()`\
    \ method for the `checked` state. Then, the output results to the page.\n\nUsing\
    \ another loop, create some input checkbox elements, and then using the `prop()`\
    \ method, set the checked Boolean value. Add a click event to track and output\
    \ the checked results.\n\nAdd a click event to an element. Update the value by\
    \ counting the clicks on that element.\n"
