    \ 'white') \n  }\n).mouseenter(function(e) {\n  //$(this).text(`X:${e.pageX} Y:${e.pageY}`);\n\
    });\n```\n\n添加输入字段的方法 (adder)：\n```javascript\nfunction adder(val) {\n  $('<input>').attr({\n\
    \    type: 'text',\n    value: val\n  }).appendTo('.main');\n}\n```\n\n练习步骤：\n\
    1. 使用循环在 `main` 类内部创建几个输入字段。在进入时，将背景颜色更新为红色，离开时设为白色。\n2. 在 divs 上添加 `mouseup()`\
    \ 和 `mousedown()`，在不同的鼠标状态下更新文本和背景颜色。\n3. 在主元素上添加 `mouseout()` 和 `mouseleave()`，并检查它们的区别。\n\
    4. 在主元素上添加 `mouseenter()` 和 `mouseover()`，检查它们的区别。\n5. 在按钮上添加 `mouseenter()` 和\
    \ `mouseleave()`，像 `hover()` 事件一样更新背景颜色。\n6. 在主元素上从事件对象跟踪 `mousemove()`，获取 `pageX`\
