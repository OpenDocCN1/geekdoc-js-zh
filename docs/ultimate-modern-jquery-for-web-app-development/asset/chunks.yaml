    # [**`.mousemove()`**](#toc.xhtml_s147a)


    The **`.mousemove()`** method in jQuery is used to attach a function that will
    be executed whenever the mouse pointer moves over a selected HTML element. This
    event is triggered continuously as the mouse cursor is in motion within the element’s
    boundaries. It is commonly used to track the mouse’s position and create interactive
    features like updating coordinates or following the mouse’s movement. The event
    handler receives information about the mouse’s current position, which can be
    used for various purposes in web applications.


    **Function**: This method assigns a function to be executed when the mouse pointer
    moves over the document.


    **Explanation**: When the mouse pointer moves anywhere over the document, the
    text content of the div with the class “**`div1`**” changes to display the current
    X and Y coordinates of the mouse pointer.


