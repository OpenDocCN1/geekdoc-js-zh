    }\n.active{\n  background-color:red;\n  color:green;\n}\n```\n\n### HTML 代码:\n\
    ```html\n<div class=\"output\"></div>\n<div class=\"btns\">\n  <button id=\"btn1\"\
    >1</button>\n  <button id=\"btn2\">2</button>\n  <button id=\"btn3\">3</button>\n\
    </div\n```\n\n### JavaScript 代码:\n```javascript\nlet counter = 1;\n$('button').click(()=>{\n\
    \  counter++;\n  const r = Math.floor(Math.random()*200)+100;\n  const c = '#'+Math.random().toString(16).substring(2,8);\n\
    \  const id = 'id'+counter;\n  $('<div>').text('New Div').css('height',r+'px').attr('id',id).css('background-color',c).appendTo('body');\n\
    \  //output\n  $('<a>').attr('href','#'+id).text(id+' ').appendTo('.output');\n\
    })\n$(window).scroll((e)=>{\n  console.log(e);\n})\n$(window).resize((e)=>{\n\
    \  console.log($(window).height());\n  console.log($(document).height());\n})\n\
    ```\n\n1. 在 HTML 中，页面在一个类名为 `btns` 的 `div` 元素内有三个按钮，还有一个类名为 `output` 的空 `div`。\n\
    2. 在 JavaScript 部分，变量 `counter` 被初始化为 `1`。它用于跟踪按钮被点击的次数。\n3. 设置了一个事件处理程序来响应按钮点击。当按钮被点击时，会发生以下操作：\n\
    \    - `counter` 递增。\n    - 生成一个随机高度（100 到 300 像素之间）和一种随机背景颜色。\n    - 使用递增的计数器为新的\
    \ `<div>` 元素创建一个 `ID`。\n    - 创建一个新的 `<div>` 元素，其文本为 `New Div`，指定的高度、唯一的 `ID`\
    \ 以及生成的背景颜色。\n    - 将新的 `<div>` 元素添加到页面的 `body` 中。\n    - 创建一个新的 `<a>` 元素，其 `href`\
    \ 属性指向新创建的 `<div>` 的 `ID`。该链接被添加到 `output` `div` 中，创建了一个指向所生成的 `<div>` 元素的链接列表。\n\
    4. 使用 jQuery 设置了额外的事件处理程序：\n    - `$(window).scroll()`：当用户滚动页面时，该事件处理程序会将有关滚动事件的信息打印到控制台。\n\
    \    - `$(window).resize()`：当调整浏览器窗口大时，该事件处理程序会将窗口的高度和文档的高度打印到控制台。\n\n总之，该代码每当点击一次按钮，就会动态生成并向网页添加一个具有唯一\
    \ ID 的新颜色 `<div>` 元素。它还创建一个指向这些新生成的 `<div>` 元素的链接列表。此外，它还提供了事件处理程序，在用户滚动或缩放浏览器窗口时记录信息。\n\
    \n# 结论\n\n本章全面概述了使用 jQuery 库进行 Web 开发中事件处理的各种方法。它涵盖了事件管理的各个方面，从介绍 JavaScript 事件模型开始，深入探讨了如何利用\
    \ jQuery 来绑定和触发事件。本章讨论了不同的 jQuery 事件方法，如 `.click()`、`.hover()`、`.submit()` 和 `.keypress()`，用于处理用户交互。此外，它还探索了更高级的事件处理技术，包括针对动态创建元素的事件委托，以及使用\
    \ `.on()` 方法同时绑定多个事件。读者还将学习事件冒泡、使用 `.stopPropagation()` 和 `.preventDefault()`\
    \ 等方法进行传播控制，以及优化事件处理和保持清晰、组织良好的事件处理程序的最佳实践。本章让读者掌握了使用 jQuery 在 Web 应用中有效管理事件的知识和技能。本章内容还提供了实用示例，例如使用\
    \ jQuery 处理鼠标移动监听器、悬停事件、键盘事件和表单事件，并演示了使用 `.on()` 方法附加更强大事件的能力。\n\n接下来的章节将关注 AJAX（异步\
    \ JavaScript 和 XML）在创建高响应性 Web 应用程序中的重要作用，强调在处理用户交互时消除了刷新页面的需求。该章节将从介绍 jQuery\
    \ 核心的 AJAX 能力开始，主要是 `$.ajax()` 方法，这让读者具备发起 HTTP 请求并有效管理服务器响应的能力。本章进一步探讨了通过 `type`、`URL`、`data`\
    \ 和 `dataType` 等选项对 AJAX 请求进行自定义，以适应特定的应用程序需求。\n\n此外，读者还将发现 jQuery 简写方法的便利性，包括\
    \ `$.get()`、`$.post()`、`$.getJSON()` 和 `$.getScript()`，这些方法旨在简化发起 AJAX 请求的过程，同时提高代码的清晰度和可读性。随着章节的深入，它将进入\
    \ jQuery 中的回调选项领域，允许开发者定义在 AJAX 请求完成后执行的函数。这些回调函数，例如 `success`、`error` 和 `complete`\n\
    \n# 多选题\n\n1. jQuery 中哪种方法可以处理用户交互（如点击和悬停）？\n    a) `.bind()`\n    b) `.eventHandler()`\n\
    \    c) `.interact()`\n    d) `.click()`\n2. 在 jQuery 中使用 on() 方法处理事件的目的是什么？\n\
    \    a) 禁用所有事件\n    b) 触发事件\n    c) 同时绑定多个事件\n    d) 防止传播\n3. 哪个 jQuery 方法可以停止传播？\n\
    \    a) `.halt()`\n    b) `.stopEvent()`\n    c) `.stopPropagation()`\n    d)\
    \ `.preventDefault()`\n4. jQuery 中的 .preventDefault() 方法有什么用处？\n    a) 它完全取消执行。\n\
    \    b) 防止事件\n    c) 触发事件\n    d) 增强事件委托\n5. 在 jQuery 中，哪种方法可以将事件绑定到匹配选择器的元素（包括动态创建的元素）？\n\
    \    a) `.register()`\n    b) `.bind()`\n    c) `.attach()`\n    d) `.on()`\n\n\
    # 答案\n\n1. d\n2. c\n3. c\n4. a\n5. d\n\n"
