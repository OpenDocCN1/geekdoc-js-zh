    **JavaScript JS 代码：**


    ```javascript

    console.log($(‘div’).first());

    const val = ‘<h1>Laurence Svekis</h1>’;

    $(‘div’).first().html(val);

    $(‘div’).last().text(val);

    $(‘div’).click((e)=>{

    const $el = $(e.target);

    console.log($el);

    $el.html(‘clicked’);

    $(e.target).text(‘Ready’);

    $(e.target).hide(“slow”);

    });

    $(‘button’).click((e)=>{

    $(‘div’).show(“fast”);

