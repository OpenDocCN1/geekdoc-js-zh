    \ end of this chapter, readers will have a comprehensive understanding of how\
    \ to handle events with jQuery and how to use the various event methods and techniques\
    \ to create rich, interactive web applications.\n\n*   Mouse move listeners and\
    \ hover events with jQuery\n\n*   Listening for keyboard events and getting values\
    \ from the event object with jQuery\n\n*   Handling form events with jQuery\n\n\
    *   Using the on method to attach events with more powerful events"
