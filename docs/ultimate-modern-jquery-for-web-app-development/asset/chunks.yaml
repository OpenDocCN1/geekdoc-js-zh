  trans: "\n\n要查找特定元素的位置，可以在该元素上调用 `.index()`。该方法将返回一个从 0 开始的索引，表示其在组中的位置。\n\n在使用\
    \ jQuery 时，根据元素与其他元素的相对位置来选择元素是一项常见任务。了解如何根据与相邻元素的关系来识别和选择元素是非常用的。\n\njQuery 中的\
    \ `index()` 方法允许你获取元素相对于其同级元素的索引位置。当你需要识别某个元素在一组相似元素中的特定位置时，这个方法非常有用。\n\n`index()`\
    \ 方法最基本的用法是在 jQuery 对象上调用它。例如，如果你有一组兄弟元素，你可以在其中一个元素上调用 `index()` 来获取它在兄弟元素中的位置。\n\
    \n```javascript\n// 假设你有一组类名为 item 的兄弟元素\nconst position = $(('.item').index();\n\
    console.log(`Position: ${position}`);\n```\n\n这将在控制台中输出选中元素在其兄弟元素中的位置（从 0 开始的索引）。\n\
    \n你也可以将 `index()` 方法与选择器结合使用，以便在匹配选择器的兄弟元素集中找到某个特定元素的索引。\n\n```javascript\n//\
    \ 假设你想找到类名为 active 的特定元素的索引\nconst position = $(('.item.active').index('.item'));\n\
    console.log(`Position: ${position}`);\n```\n\n在这种情况下，你正在寻找类名为 item 的兄弟元素中类名为 active\
    \ 的元素的索引。\n\n一个常见的用例是确定在一组元素中哪一个元素被点击了。你可以使用 `index()` 方法找到被点击元素的索引，然后根据该索引执行操作。\n\
    \n```javascript\n// 假设你有一组类名为 clickable 的可点击元素\n$('.clickable').click(function\
    \ () {\n  const position = $(this).index();\n  console.log(`Clicked on item at\
    \ position: ${position}`);\n});\n```\n\n当用户点击类名为 `clickable` 的元素时，这段代码将记录该元素在其兄弟元素中的位置。\n\
    \n`:eq()` 和 `:lt()` 选择器是 jQuery 中强大的工具，允许你根据索引在选择结果中精确定元素。当你想要从一组匹配的元素中选择特定的元素时，它们极其实有用。\n\
    \n### 使用 `:eq()` 选择器：\n\n`:eq()` 选择器允许你通过提供索引来选择集合中的某个特定元素。索引从 0 开始。\n\n例如，要选择一组元素中的第二个元素，你会使用\
    \ `:eq(1)`，因为它位于索引 1（记住，索引是从 0 开始的）。\n\n```javascript\n$('ul li:eq(2)').css('color',\
    \ 'red');\n```\n\n在这种情况下，`<ul>` 元素内第三个 `<li>` 元素（索引为 2）的文本颜色被改为红色。\n\n### 使用 `:lt()`\
    \ 选择器：\n\n`:lt()` 选择器允许你选择直到但不包含指定索引的所有元素。这在你想要选择集合中的范围元素时非常有用。要选择前三个元素，你会使用 `:lt(3)`。\n\
    \n```javascript\n$('ul li:lt(3)').addClass('highlight');\n```\n\n这将为 `<ul>` 元素中的第一个、第二个和第三个\
    \ `<li>` 元素添加 `highlight` 类。\n\n这些选择器在你想针对集合中的特定元素而无需手动计算 DOM 结构中的元素时非常有帮助。它们提供了一种根据元素在选择中的位置来处理元素的简洁且高效的方法，使你的代码更加动态和灵活。\n\
    \n# 练习：使用 `get()` 方法返回 DOM 元素对象\n\n在本次练习中，你将使用 jQuery 的 `.get()` 方法从选定的元素集中获取\
    \ DOM 元素对象。一旦获得 DOM 元素对象，你将使用 JavaScript 的 DOM 方法和属性与这些元素交互。具体来说，你将在按钮上创建一个点击事件，获取\
    \ jQuery 选择中项目的长度，然后遍历这些项目并使用 `.get()` 方法。\n\n### 第 1 步：选择元素集\n在这一步中，你将使用 jQuery\
    \ 选择元素。\n\n### 第 2 步：创建点击事件\n在这一步中，你将在按钮上添加点击事件。\n\n### 第 3 步：遍历项目\n在这一步中，你将使用循环并使用\
    \ `.get()` 方法获取 DOM 对象。\n\n```html\n<nav>\n  <div class=\"main\">\n    <div class=\"\
    div1\">Hello World 1</div>\n    <div class=\"div2\">Hello World 2</div>\n    <div\
    \ class=\"div3\">Hello World 3</div>\n    <div class=\"div4\">Laurence Svek</div>\n\
    \    <button id=\"btn1\">1</button>\n    <button id=\"btn2\">2</button>\n    <button\
    \ id=\"btn3\">3</button>\n    <span class=\"span1\">Hello</span>span>\n  </div>\n\
    </nav>\n<button id=\"btn4\">4</button>\n<button id=\"btn5\">5</button>\n```\n\n\
    ```javascript\n$('#btn1').click(() => {\n  const temp = $('.main div').get(1);\n\
    \  console.log(temp.innerHTML);\n  console.log(temp.textContent);\n});\n\n$('#btn2').click(()\
    \ => {\n  const len = $('.main div').length;\n  console.log(len);\n  let html\
    \ = '';\n  for(let i=0; i<len; i++) {\n    const temp = $('.main div').get(i);\n\
    \    console.log(temp.textContent);\n    html += `${i}. ${temp.textContent} `;\n\
    \  }\n  $('.main .span1').text(html);\n});\n```\n\n"
- fmt: "\n3. Within the click event, you’re obtaining the index value of the clicked\
    \ div using `$(this).index()`.\n\n4. You’re also capturing the existing text content\
    \ of the div with `$(this).text()`.\n\n5. Then, you’re updating the text content\
    \ of the div to include both the index and the original text content `(for example,\
    \ “1 Hello World 1”).`.\n\n6. This visually displays the index value alongside\
    \ the existing text on the clicked div.\n\n### Step 3: Create a UL and Add LI\
    \ Items with Click Events\n\n1. You’re creating an unordered list `<ul>` and prepending\
    \ it to the nav element using `$(‘<ul>’).prependTo(‘nav’)`.\n\n2. Inside a loop\
    \ that runs ten times `(for(let i=0;i<10;i++))`, you’re adding list items `<li>`\
    \ to the unordered list.\n\n3. Each list item contains text like `“0 List Item,”`,\
    \ `“1 List Item,”`, and so on.\n\n4. For each list item, you’re attaching a click\
    \ event.\n\n5. Within the click event for the list items, you’re using `$(this).index()`\
    \ to retrieve the index of the clicked list item.\n\n6. You’re then logging this\
    \ index to the console.\n\n7. This allows you to determine and display the index\
    \ of the clicked list item.\n\nThis exercise showcases how to use the `index()`\
    \ method to obtain the index values of elements in various contexts. Whether it’s\
    \ a button, a div, or a list item, you’re adding click events to interact with\
    \ these elements and display their index values.\n\n#### HTML\n\n```html\n<nav>\n\
    <div class=”main”>\n<div class=”div1”>Hello World 1</div>\n<div class=”div2”><<span>Hello\
    \ World 2</span></div> <div class=”div3” id=”div3”>Hello World 3</div>\n<div class=”div4”>Laurence\
    \ Svekis</div>\n<input>\n<button id=”btn1”>1</button>\n<button id=”btn2”>2</button>\n\
    <button id=”btn3”>3</button>\n<span class=”span1”>Hello</span>\n</div>\n</nav>\n\
    <button id=”btn4”>4</button>\n<button id=”btn5”>5</button>\n```\n\n#### JavaScript\n\
    \n```javascript\n$(‘#btn1’).click(function(){\n  console.log($(this).index());\n\
    })\n$(‘.main div’).click(function(){\n  const val = $(this).index();\n  const\
    \ temp = $(this).text();\n  $(this).text(`${val} ${temp}`);\n})\nconst $ul = $(‘<ul>’).prependTo(‘nav’);\n\
    for(let i=0;i<10;i++){\n  $(‘<li>’).text(`${i} ListItem`).appendTo($ul).click(function(){\n\
    \    console.log($(this).index());\n  })\n}\n```\n\n#### jQuery Data Method `(.data())`\n\
    \n- The `data()` method allows developers to attach custom data to an HTML element\
    \ and retrieve it later on.\n- It’s useful for storing state information or metadata\
    \ associated with an element.\n- You can store different types of data, such as\
    \ strings, numbers, objects, or arrays, within an element.\n- To save data into\
    \ an element, you typically select the element and use `.data(‘key’, ‘value’)`,\
    \ where `‘key’` is a unique identifier for the data, and `‘value’` is the data\
    \ you want to store.\n- You can retrieve stored data by using `.data(‘key’)`.\n\
    - The `removeData(‘key’)` method is used to remove data associated with an element.\n\
    \n#### Index of Page Element Index Method `(.index())`:\n\n- The `index()` method\
    \ enables developers to retrieve the index position of an element in relation\
    \ to its siblings.\n- It’s valuable for performing operations on a specific element\
    \ within a list or group of elements.\n- You can call `.index()` on a specific\
    \ element to obtain its position among a set of elements.\n- The index is a zero-based\
    \ value, indicating the position within the selected group.\n- You can use the\
    \ `:eq()` and `:lt()` selectors to select elements based on their position within\
    \ the group. `:eq()` selects a specific element by providing its index, while\
    \ `:lt()` selects all elements up to a specified index.\n\n# Conclusion\n\nThe\
    \ chapter covers how to use these methods and provides practical examples and\
    \ exercises to demonstrate their usage. Readers will have a solid understanding\
    \ of how to use the `data()` and `index()` methods to work efficiently with page\
    \ elements in jQuery.\n\nThe next chapter focuses on event handling with jQuery,\
    \ a fundamental aspect of developing interactive web applications. It delves into\
    \ the event model in JavaScript and shows how jQuery can be used to bind and trigger\
    \ events. Readers will explore various event methods in jQuery, such as `.click()`,\
    \ `.hover()`, `.submit()`, and `.click()`.\n\n# Multiple Questions\n\n1. What\
    \ is the primary purpose of `data()` method?\n   a. Styling HTML elements\n  \
    \ b. Attaching custom data to an HTML element\n   c. Creating new HTML elements\n\
    \   d. Parsing JSON\n\n2. Which of the following data types can be stored within\
    \ an element using `data()`?\n   a. Strings and numbers only\n   b. Objects and\
    \ arrays only\n   c. Strings, numbers, objects, or arrays\n   d. HTML elements\n\
    \n3. How do you retrieve stored data from an element using `data()`?\n   a. Using\
    \ `.getData(‘key’)`\n   b. Using `.data(‘key’)`\n   c. Using `.retrieveData(‘key’)`\n\
    \   d. Using `fetch(‘key’)`\n\n4. What does the `.index()` method in jQuery allows\
    \ you to determine?\n   a. The HTML tag name of an element\n   b. The index position\
    \ of an element in relation to its siblings\n   c. The total number of elements\
    \ in the DOM\n   d. The CSS class of an element\n\n# Answers\n\n1. b\n2. c\n3.\
    \ b\n4. b\n"
