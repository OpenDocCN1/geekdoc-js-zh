    \  $(‘<h3>Hello</h3>’).replaceAll(‘.div3’);\n  // Using .replaceWith() to replace\
    \ the entire .div2 with new content\n  $(‘.div2’).replaceWith(‘<h3>Hello 3</h3>’);\n\
    });\n```\n\nIn this step, when **#btn1** is clicked:\n"
