    7. [Timer](#text00000.html_Timer)\n\nIf you want to learn basic knowledge of HTML\
    \ CSS: << Easy Learning HTML CSS>>\n\n[https://www.amazon.com/dp/B07QHRB23X](https://www.amazon.com/dp/B07QHRB23X)\n\
    \n![](Image00001.jpg)\n\nIf you already have basic knowledge of HTML CSS, skip\
    \ it, start an exciting journey\n\n# Javascript HelloWorld\n\nJavascript is a\
    \ web page dynamic interactive language that used in web development.\n\n1. Create\
    \ a `helloworld.html` file with Notepad and open it in your browser to see the\
    \ webpage\n\n`<html>`: tag tells the browser that this is an HTML document.\n\n\
    `<head>`: tag is a container for metadata about content and charset.\n\n`<title>`:\
    \ tag defines the title of the document.\n\n`<body>`: tag defines the document's\
    \ body.\n\n`<script>`: tag is used to define a client-side script (JavaScript).\n\
    \n`document.write()`: writes HTML content to document in browser\n\n```html\n\
    <html>\n<head>\n    <meta http-equiv = \"Content-Type\" content = \"text/html;\
    \ charset=UTF-8\" >\n    <title> First Web Page </title>\n</head>\n<body>\n  \
    \  <script type = \"text/javascript\" >\n        document.write ( \"HelloWorld\"\
    \ );\n    </script>\n</body>\n</html>\n```\n\nResult:\n\n![](Image00002.jpg)\n\
    \n# Variable\n\n![](Image00003.jpg)\n\n1. Create a file : `Variable.html` and\
    \ open it in your browser\n\n`//` : single comments are not executed by javascript\n\
    \n`\"\"`: string type\n\n```javascript\n<script type = \"text/javascript\" >\n\
    \    var basket = \"Apple\" ;\n    document.write ( basket );\n</script>\n```\n\
    \nResult:\n\n![](Image00004.jpg)\n\n2. Change file : `Variable.html` Put \" orange\
    \ \" to replace \" apple \" .\n\n![](Image00005.jpg)\n\n`<br>`: html tag wrap\
    \ a new line\n\n```javascript\n<script type = \"text/javascript\" >\n    var basket\
    \ = \"Apple\" ;\n    document.write ( basket );\n    document.write ( \"<br>\"\
    \ );\n    basket = \"Orange\" ;\n    document.write ( basket );\n</script>\n```\n\
    \nRun Result:\n\n![](Image00006.jpg)\n\n# Variable and Type\n\nJavascript is dynamic\
    \ type language\n\n1. Create a `var.html` file with Notepad and open it in your\
    \ browser to see the webpage\n\n`typeof()`: find the type of a JavaScript variable\n\
    \n```javascript\n<script type = \"text/javascript\" >\n    var x ;           //undefined\n\
    \    var a = 9 ;       //number\n    var b = 1.5 ;     //number\n    var c = true\
    \ ;    //Boolean\n    var d = \"abc\" ;   //string\n    var e = 'abc' ;   //string\n\
    \    document.write ( typeof ( x ) + \"<br>\" );\n    document.write ( typeof\
    \ ( a ) + \"<br>\" );\n    document.write ( typeof ( b ) + \"<br>\" );\n    document.write\
    \ ( typeof ( c ) + \"<br>\" );\n    document.write ( typeof ( d ) + \"<br>\" );\n\
    \    document.write ( typeof ( e ) + \"<br>\" );\n</script>\n```\n\nResult:\n\n\
    ```\nundefined\nnumber\nnumber\nboolean\nstring\nstring\n```\n\n# Arithmetic Operator\n\
    \n1. Create a `ArithmeticOperator.html` file with Notepad and open it in your\
    \ browser\n\nArithmetic Operator:\n\nAdd `+`, minus `-`, multiply `*`, divisible\
    \ `/`, take modulo `%`\n\n![](Image00007.jpg)\n\n```javascript\n<script type =\
    \ \"text/javascript\" >\n    var a = 1 ;\n    var b = 2 ;\n    var c = 3 ;\n \
    \   var d = 4 ;\n    document.write ( a + b ); // = 3\n    document.write ( \"\
    <br>\" );\n    document.write ( a - b ); // = -1\n    document.write ( \"<br>\"\
    \ );\n    document.write ( a * b ); // = 2\n    document.write ( \"<br>\" );\n\
    \    document.write ( b / a ); // = 2\n    document.write ( \"<br>\" );\n    document.write\
    \ ( c % b ); // = 1 //number remaining after divide\n    document.write ( \"<br>\"\
    \ );\n</script>\n```\n\n# Function\n\n![](Image00008.jpg)\n\n![](Image00009.jpg)\n\
    \n![](Image00010.jpg)\n\n1. Create a file : `Function.html`\n\n```javascript\n\
    <script type = \"text/javascript\" >\n    function add ( a , b ){\n        return\
    \ a + b ;\n    }\n    var result = add ( 4 , 2 );\n    document.write ( result\
    \ ); // 6\n    document.write ( \"<br>\" );\n    var result = add ( 5 , 3 );\n\
    \    document.write ( result )  // 8\n</script>\n```\n\nRun Result:\n\n```\n6\n\
    8\n```\n\n2. Add 3 more functions about `-`, `*`, `/` to `Function.html`\n\n```javascript\n\
    <script type = \"text/javascript\" >\n    function add ( a , b ){\n        return\
    \ a + b ;\n    }\n    function sub ( a , b ){\n        return a - b ;\n    }\n\
    \    function multiply ( a , b ){\n        return a * b ;\n    }\n    function\
    \ divide ( a , b ){\n        return a / b ;\n    }\n    var result = add ( 4 ,\
    \ 2 );\n    document.write ( result ); // 6\n    document.write ( \"<br>\" );\n\
    \    var result = sub ( 4 , 2 );\n    document.write ( result )  // 2\n    document.write\
    \ ( \"<br>\" );\n    var result = multiply ( 4 , 2 );\n    document.write ( result\
    \ )  // 8\n    document.write ( \"<br>\" );\n    var result = divide ( 4 , 2 );\n\
    \    document.write ( result )  // 2\n</script>\n```\n\n# Class\n\n![](Image00011.jpg)\n\
    \n1. Create a file : `Caculator.html`\n"
