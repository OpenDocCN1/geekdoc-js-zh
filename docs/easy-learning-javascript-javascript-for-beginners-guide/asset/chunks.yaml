    \ | element gets focus |\n| `Onkeydown` | The key of a keyboard is pressed |\n\
    | `Onkeypress` | The key of a keyboard is pressed |\n| `Onkeyup` | The key of\
    \ a keyboard is released |\n| `Onload` | a page or image is loaded |\n| `Onmousedown`\
    \ | a mouse button is pressed |\n| `Onmousemove` | mouse is moved |\n| `Onmouseout`\
    \ | mouse is moved out from an element |\n| `Onmouseover` | mouse is moved over\
    \ an element |\n| `Onmouseup` | mouse button is released |\n| `Onreset` | reset\
