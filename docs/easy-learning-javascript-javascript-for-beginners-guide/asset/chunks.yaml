    # Timer


    ![](Image00056.jpg)


    1. Create a `Timer.html` file with Notepad and open it in your browser


    - `getFullYear()`: Get the year as a four digit number (yyyy)

    - `getMonth()`: Get the month as a number (0-11)

    - `getDate()`: Get the day as a number (1-31)

    - `getHours()`: Get the hour (0-23)

    - `getMinutes()`: Get the minute (0-59)

    - `getSeconds()`: Get the second (0-59)

    - `getTime()`: Get the time (milliseconds since January 1, 1970)

    - `setInterval()`: continue calling the function until `clearInterval()` is called.


    ```

    <div id = "dateDiv" ></div><script type = "text/javascript" >    function doSetInterval
    ()    {        var dateDiv = document.getElementById ( "dateDiv" );        var
    d = new Date ();        var dateString = d.getHours ()+ ":" + d.getMinutes ()+
    ":" + d.getSeconds ()        dateDiv.innerHTML = dateString ;    }    setInterval
    ( "doSetInterval()" , 1000 );</script>

    ```


