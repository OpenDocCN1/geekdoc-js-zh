    ## Table Create Rows Columns


    ![](Image00054.jpg)


    1. Create a `TableCreateRowsColumns.html` file with Notepad and open it in your
    browser


    `table.insertRow`: inserts a new row (`<tr>`) in a given `<table>`, returns a
    reference to the new row.


    `table.insertCell`: inserts a new col (`<td>`) in a given `<tr>`, returns a reference
    to the new col.


    ```

    <style type = "text/css" >    .tableClass{        width:600px;        border:1px
    solid #ff0000;        border-collapse: collapse;    }    .tableClass td{       
    border:1px solid #ff0000;    }</style><input type = "button" value = "Create Table"
    onclick = "doCreateTable()" /><input type = "button" value = "Create Row" onclick
    = "doCreateRow()" />Rows: <input type = "text" value = "" id = "row" /> Columns:
    <input type = "text" value = "" id = "col" /><br><br><div id = "div" ></div><script
    type = "text/javascript" >    var table ;    function doCreateTable ()    {       
    table = document.createElement ( "table" );        table.className = "tableClass"
    ;        document.getElementById ( "div" ). appendChild ( table );    }    function
    doCreateRow ()    {        var rowNum = parseInt ( document.getElementById ( "row"
