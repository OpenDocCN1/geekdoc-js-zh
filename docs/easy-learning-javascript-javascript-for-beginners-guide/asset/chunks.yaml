    \n2. 为 `WebCaculator.html` 添加另外三个函数 -、*、/\n\n```javascript\na: <input type = \"\
    text\" id = \"a\" value = \"\" />\nb: <input type = \"text\" id = \"b\" value\
    \ = \"\" />\n=<span id = \"result\" ></span>\n<br>\n<input type = \"button\" value\
    \ = \"+\" onClick = \"doAdd()\" />\n<input type = \"button\" value = \"-\" onClick\
    \ = \"doSub()\" />\n<input type = \"button\" value = \"*\" onClick = \"doMultiply()\"\
    \ />\n<input type = \"button\" value = \"/\" onClick = \"doDivide()\" />\n<script\
    \ type = \"text/javascript\" >\n    function doAdd (){\n        var aObj = document.getElementById\
    \ ( \"a\" );\n        var bObj = document.getElementById ( \"b\" );\n        var\
    \ resultObj = document.getElementById ( \"result\" );\n        var a = parseInt\
    \ ( aObj.value ); // 将字符串转换为整数\n        var b = parseInt ( bObj.value );\n   \
    \     resultObj.innerHTML = a + b ;\n    }\n    function doSub (){\n        var\
    \ aObj = document.getElementById ( \"a\" );\n        var bObj = document.getElementById\
    \ ( \"b\" );\n        var resultObj = document.getElementById ( \"result\" );\n\
    \        var a = parseInt ( aObj.value ); // 将字符串转换为整数\n        var b = parseInt\
    \ ( bObj.value );\n        resultObj.innerHTML = a - b ;\n    }\n    function\
    \ doMultiply (){\n        var aObj = document.getElementById ( \"a\" );\n    \
    \    var bObj = document.getElementById ( \"b\" );\n        var resultObj = document.getElementById\
    \ ( \"result\" );\n        var a = parseInt ( aObj.value ); // 将字符串转换为整数\n   \
    \     var b = parseInt ( bObj.value );\n        resultObj.innerHTML = a * b ;\n\
    \    }\n    function doDivide (){\n        var aObj = document.getElementById\
    \ ( \"a\" );\n        var bObj = document.getElementById ( \"b\" );\n        var\
    \ resultObj = document.getElementById ( \"result\" );\n        var a = parseInt\
    \ ( aObj.value ); // 将字符串转换为整数\n        var b = parseInt ( bObj.value );\n   \
    \     resultObj.innerHTML = a / b ;\n    }\n</script>\n```\n\n点击 + 按钮的结果：\n\n\
    ![](img/Image00017.gif)\n\n点击 - 按钮的结果：\n\n![](img/Image00018.gif)\n\n点击 * 按钮的结果：\n\
    \n![](img/Image00019.gif)\n\n点击 / 按钮的结果：\n\n![](img/Image00020.gif)\n\n## 赋值运算符\n\
    \n1. 用记事本创建一个 `AssignmentOperator.html` 文件，并在浏览器中打开它\n\n```javascript\n<script\
    \ type = \"text/javascript\" >\n    var d = 4 ;\n    document.write ( d ++); //\
    \ = 4 先打印 d，然后自增 1\n    document.write ( \"<br>\" );\n    d = 4 ;\n    document.write\
    \ (++ d ); // = 5 先自增 1，然后打印 d\n    document.write ( \"<br>\" );\n    d = 4 ;\n\
    \    document.write ( d --); // = 4 先打印 d，然后自减 1\n    document.write ( \"<br>\"\
    \ );\n    d = 4 ;\n    document.write (-- d ); // = 3 先自减 1，然后打印 d\n    var result\
    \ = 10 ;\n    result = result + 1 ;\n    document.write ( result ); // = 11\n\
    \    document.write ( \"<br>\" );\n    result = 10 ;\n    result ++;\n    document.write\
    \ ( result ); // = 11\n    document.write ( \"<br>\" );\n    result = 10 ;\n \
    \   result += 1 ;\n    document.write ( result );  // = 11\n    document.write\
    \ ( \"<br>\" );\n</script>\n```\n\n2. 创建一个数量加减器 `quantity.html`\n\n点击 + 按钮使数量增加\
    \ 1，点击 - 按钮使数量减少 1。\n\n![](img/Image00021.jpg)\n\n```javascript\nQuantity:<br>\n\
    <input type = \"text\" style = \"width:30px\" id = \"quantity\" value = \"1\"\
    \ />\n<input type = \"button\" value = \"+\" onClick = \"doAdd()\" />\n<input\
    \ type = \"button\" value = \"-\" onClick = \"doSub()\" />\n<script type = \"\
    text/javascript\" >\n    function doAdd (){\n        var quantityObj = document.getElementById\
    \ ( \"quantity\" );\n        var value = parseInt ( quantityObj.value );\n   \
    \     value ++\n        quantityObj.value = value ;\n    }\n    function doSub\
    \ (){\n        var quantityObj = document.getElementById ( \"quantity\" );\n \
    \       var value = parseInt ( quantityObj.value );\n        value --\n      \
    \  quantityObj.value = value ;\n    }\n</script>\n```\n\n## 关系运算符\n\n1. 用记事本创建一个\
    \ `RelationalOperator.html` 文件，并在浏览器中打开它\n\n关系运算符只有两个值：true、false\n\n```javascript\n\
    <script type = \"text/javascript\" >\n    document.write ( 1 > 2 ); // false\n\
    \    document.write ( \"<br>\" );\n    document.write ( 1 >= 1 ); // true\n  \
    \  document.write ( \"<br>\" );\n    document.write ( 1 < 2 ); // true\n    document.write\
    \ ( \"<br>\" );\n    document.write ( 1 <= 2 ); // true\n    document.write (\
    \ \"<br>\" );\n    document.write ( 1 == 1 ); // true\n    document.write ( \"\
    <br>\" );\n    document.write ( 1 != 2 ); // true\n</script>\n```\n\n## If 条件语句\n\
    \nIf 语句\n\n1. `if (expression){statement}`\n2. `if (expression) { statement }\
    \ else { statement }`\n3. `if (expression) {statement } else if { statement }`\n\
    \n1. 用记事本创建一个 `If.html` 文件，并在浏览器中打开它\n\n分数示例：\n\n- 如果分数 == 5：优秀\n- 否则如果分数 == 4：良好\n\
    - 否则：需要努力\n\n![](img/Image00022.jpg)\n\n"
