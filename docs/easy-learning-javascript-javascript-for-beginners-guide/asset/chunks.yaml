    \ ; j ++) {\n            mapHTML += \"<input type='button' value=' ' onClick='doButtonClick(this,\"\
    \ + maps [ i ][ j ]+ \")' />\" ;\n        }\n        mapHTML += \"<br>\" ;\n \
    \   }\n    document.getElementById ( \"result\" ). innerHTML = mapHTML ;\n   \
    \ function doButtonClick ( obj , value ){\n        if ( value == 1 ){\n      \
    \      obj.value = \"*\" ;\n        } else if ( value == 2 ){\n            obj.value\
    \ = \"Dog\" ;\n        }\n    }\n</script>\n```\n\n## 二级联动下拉菜单\n\n### 1. 使用记事本创建\
    \ Drop-down.html 文件并在浏览器中打开\n\n`window.onload`: 页面加载后执行一个函数\n\n`document.createElement()`:\
    \ 创建一个 HTML 元素\n\n![](img/Image00036.jpg)\n\n```javascript\n<select id=\"country\"\
    >\n    <option value=\"\"> --请选择国家-- </option>\n</select>\n<script type=\"text/javascript\"\
    >\n    window.onload = function ()\n    {\n        var countryObj = document.getElementById\
