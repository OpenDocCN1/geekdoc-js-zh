    \ | text is selected |\n| `Onsubmit` | submit button is clicked |\n| `Onunload`\
    \ | exit page |\n\n## Login Web Page\n\n![](Image00039.jpg)\n\n1. Create a `Login.html`\
    \ file with Notepad and open it in your browser\n\n```html\nUsername: <input type\
    \ = \"text\" id = \"username\"   value = \"\"   /> <br>Password: <input type =\
    \ \"password\"   id = \"pwd\"   value = \"\"   /> <br><input type = \"button\"\
    \ value = \"Login\" onclick = \"checkLogin()\"   /><script   type = \"text/javascript\"\
    \ >    function checkLogin ()    {        var usernameObj = document.getElementById\
    \ ( \"username\" );        var pwdObj = document.getElementById ( \"pwd\" ); \
    \       if ( usernameObj.value == \"\" )        {            alert ( \"Please\
    \ input username !\" );            return ;        }        if ( pwdObj.value\
    \ == \"\" )        {            alert ( \"Please input password !\" );       \
    \     return ;        }        alert ( \"login successfull !\" );    }</script>\n\
    ```\n\n2. Create a `Login.html` file with Notepad and open it in your browser\n\
    \n`document.onkeypress`: the event occurs when the user presses a key.\n\n```html\n\
    Username: <input type = \"text\" id = \"username\"   value = \"\"   /><br>Password:\
    \ <input type = \"password\"   id = \"pwd\"   value = \"\"   /><br><input type\
    \ = \"button\" value = \"Login\" onclick = \"checkLogin()\"   /><script   type\
    \ = \"text/javascript\" >    document.onkeypress = function ( event )    {   \
    \     var ext = window.event ? window.event : event ;        var key = ext.keyCode\
    \ ? ext.keyCode : ext.which ;        if ( key == 13 ) // press enter key will\
    \ be invoked        {            checkLogin ();        }    }    function checkLogin\
    \ ()    {        var usernameObj = document.getElementById ( \"username\" ); \
    \       var pwdObj = document.getElementById ( \"pwd\" );        if ( usernameObj.value\
    \ == \"\" )        {            alert ( \"Please input username !\" );       \
    \     return ;        }        if ( pwdObj.value == \"\" )        {          \
    \  alert ( \"Please input password !\" );            return ;        }       \
    \ alert ( \"login successfull !\" );    }</script>\n```\n\n## MouseOver Thumbnail\
    \ to Larger\n\n![1554891382(1)](Image00040.jpg)\n\n1. Create a `ThumbnailLarger.html`\
    \ file with Notepad and open it in your browser\n\n`<img>`: tag defines an image\
    \ in an HTML page.\n\n```html\n  <img src = \"images/java.jpg\" width = \"60\"\
    \   onmouseover = \"zoomImage(this)\" />  <img src = \"images/python.jpg\" width\
    \ = \"60\"   onmouseover = \"zoomImage(this)\" />  <img src = \"images/csharp.jpg\"\
    \ width = \"60\"   onmouseover = \"zoomImage(this)\" />  <hr>  <img id = \"image\"\
    \ src=\"\" /><script type = \"text/javascript\" >    function zoomImage ( obj\
    \ )    {        document.getElementById ( \"image\" ). src = obj.src ;    }</script>\n\
    ```\n\n## Element Hierarchy\n\n![](Image00041.jpg)\n\n1. Change `ElementHierarchy.html`\
    \ to get all child nodes.\n\n`obj.childNodes`: get all child nodes of current\
    \ node\n\n`obj.nodeName`: get the node’s name\n\n`obj.nodeType`: get the node’s\
    \ type\n\n`obj.innerHTML`: get the node’s html content\n\n![](Image00042.jpg)\n\
    \n`<b>`: tag specifies bold text.\n\n`<a>`: tag defines a hyperlink, which is\
    \ used to link from one page to another.\n\n```html\n<body>  <div id = \"div\"\
    \ >    <b> United State </b>    <span> Book </span>    <a href = \"#\" > VereJava\
    \ </a>  </div>  <hr>  <input type = \"button\" value = \"Get Parent Node\" onclick\
    \ = \"doGetParentNode()\" /></body><script type = \"text/javascript\" >    function\
    \ doGetParentNode ()    {        var divObj = document.getElementById ( \"div\"\
    \ );        alert ( divObj.parentNode.nodeName );    }</script>\n```\n\n2. Change\
    \ `ElementHierarchy.html` get all child nodes\n\n`obj.childNodes`: get all child\
    \ nodes of current node\n\n`obj.nodeName`: get the parent node’s name\n\n`obj.nodeType`:\
    \ get the parent node’s type\n\n`obj.innerHTML`: get the parent node’s html content\n\
    \n![](Image00043.jpg)\n\n```html\n<body>  <div id= \"div\" >    <b> United State\
    \ </b>    <span> Book </span>    <a href = \"#\" > VereJava </a>  </div>  <hr>\
    \  <input type = \"button\" value = \"Get Child Nodes\" onclick = \"doGetChildNodes()\"\
    \ /></body><script type = \"text/javascript\" >    function doGetChildNodes ()\
    \    {        var div = document.getElementById ( \"div\" );        var childNodes\
    \ = div.childNodes ;        for ( var i = 0 ; i < childNodes.length ; i ++)  \
    \      {            if ( childNodes [ i ]. nodeType == 1 )            {      \
    \          document.write ( childNodes [ i ]. nodeName + \" , \" );          \
    \      document.write ( childNodes [ i ]. nodeType + \" , \" );              \
    \  document.write ( childNodes [ i ]. innerHTML + \"<br>\" );            }   \
    \     }    }</script>\n```\n\n3. Change `ElementHierarchy.html` get book node’s\
    \ previous and next node\n\n`obj.previousSibling`: get previous node of current\
    \ node\n\n`obj.nextSibling`: get next node of current node\n\n![](Image00044.jpg)\n\
    \n```html\n<body>  <div id = \"div\" >    <b> United State </b><span id = \"book\"\
    \ > Book </span><a href = \"#\" > VereJava </a>  </div>  <hr>  <input type = \"\
    button\" value = \"Get Sliding Nodes\" onclick = \"doGetSliding()\" /></body><script\
    \ type = \"text/javascript\" >    function doGetSliding ()    {        var bookObj\
    \ = document.getElementById ( \"book\" );        document.write ( bookObj.previousSibling.innerHTML\
    \ + \"<br>\" );        document.write ( bookObj.nextSibling.innerHTML );    }</script>\n\
    ```\n\n## Create Text Node\n\n![](Image00045.jpg)\n\n1. Create a `CreateTextNode.html`\
    \ file with Notepad and open it in your browser\n\n`obj.createTextNode`: creates\
    \ a Text Node with the specified text\n\n`obj.appendChild`: appends a node as\
    \ the last child of a node\n\n```html\n<style>    div{        width:200px;   \
    \     height:100px;        border:1px solid #ff0000;    }</style><div id = \"\
    div\" ></div><input type = \"button\" value = \"Create Text Node\" onclick = \"\
    doCreateTextNode()\" /><script type = \"text/javascript\" >    function doCreateTextNode\
    \ ()    {        var divObj = document.getElementById ( \"div\" );        var\
    \ newNode = document.createTextNode ( \"Good Dreams\" );        divObj.appendChild\
    \ ( newNode );    }</script>\n```\n\n2. Create a `CreateElement.html` file with\
    \ Notepad and open it in your browser\n\n`obj.createElement`: creates an Element\
    \ Node with the specified name\n\n`obj.appendChild`: appends a node as the last\
    \ child of a node\n\n![](Image00046.jpg)\n\n```html\n<style>    div{        width:200px;\
    \        height:100px;        border:1px solid #ff0000;    }</style><div id =\
    \ \"div\" ></div><input type = \"button\" value = \"Create Element\" onclick =\
    \ \"doCreateElement()\" /><script type = \"text/javascript\" >    function doCreateElement\
    \ ()    {        var divObj = document.getElementById ( \"div\" );        var\
    \ buttonElement = document.createElement ( \"input\" );        buttonElement.type\
    \ = \"button\" ;        buttonElement.value = \"button\" ;        divObj.appendChild\
    \ ( buttonElement );    }</script>\n```\n\n## Delete Node\n\n![](Image00047.jpg)\n\
    \n1. Create a `DeleteNode.html` file with Notepad and open it in your browser\n\
    \n`obj.removeChild`: removes a specified child node\n\n```html\n<style>    div{\
    \        width:200px;        height:250px;        border:1px solid #ff0000;  \
    \  }</style><div id = \"div1\" >    <img id = \"image\" src = \"python.jpg\" /></div><br><input\
    \ type = \"button\" value = \"Remove Child\" onclick = \"doRemoveChild()\" /><script\
    \ type = \"text/javascript\" >    function doRemoveChild ()    {        var div\
    \ = document.getElementById ( \"div1\" );        var img = document.getElementById\
    \ ( \"image\" );        div.removeChild ( img );    }</script>\n```\n\n## Replace\
    \ Node\n\n![](Image00048.jpg)\n\n1. Create a `ReplaceNode.html` file with Notepad\
    \ and open it in your browser\n"
