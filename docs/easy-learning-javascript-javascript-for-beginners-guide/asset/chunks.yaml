  trans: "\n\n![](img/Image00059.jpg)\n\n# 轻松学习 JavaScript\n\n![](img/Image00000.jpg)\n\
    \n杨 胡\n\n简单是智慧的开端。本书从实践的本质出发，简明扼要地讲解概念，生动地培养编程兴趣。你将轻松快速地学会它。\n\n[`en.verejava.com`](http://en.verejava.com)\n\
    \n版权所有 © 2019 杨胡\n\n保留所有权利。\n\nISBN : 9781093504781\n\n# 目录\n\n1. JavaScript 基本概念\n\
    \    1.1 JavaScript HelloWorld\n    1.2 变量\n    1.3 变量与类型\n2. 运算操作符\n    2.1 算术运算符\n\
    \    2.2 函数\n    2.3 类\n    2.4 类型转换\n    2.5 DOM\n    2.6 事件\n    2.7 创建网页计算器\n\
    \    2.8 赋值运算符\n    2.9 关系运算符\n    2.10 If 条件语句\n    2.11 逻辑运算符\n3. 控制语句\n   \
    \ 3.1 Switch 语句\n    3.2 While 循环语句\n    3.3 For 循环语句\n4. 数组\n    4.1 一维数组\n \
    \   4.2 全选复选框\n    4.3 二维数组\n    4.4 找狗游戏\n    4.5 二级联动下拉菜单\n5. 更多事件\n    5.1\
    \ 登录网页\n    5.2 鼠标悬停缩略图放大\n6. DOM 与元素层级\n    6.1 元素层级\n    6.2 创建文本节点\n    6.3\
    \ 删除节点\n    6.4 替换节点\n    6.5 添加联系人示例\n    6.6 CSS 样式字体\n    6.7 CSS 更改类选择器\n\
    \    6.8 CSS 溢出展开与收起\n    6.9 CSS 浮动高亮\n    6.10 表格创建行列\n    6.11 删除表格行列\n7. 定时器\n\
    \n如果你想学习 HTML CSS 的基础知识：<< 轻松学习 HTML CSS >>\n\n[`www.amazon.com/dp/B07QHRB23X`](https://www.amazon.com/dp/B07QHRB23X)\n\
    \n![](img/Image00001.jpg)\n\n如果你已经掌握了 HTML CSS 的基础知识，请跳过它，开始一段激动人心的旅程\n\n# JavaScript\
    \ HelloWorld\n\nJavaScript 是一种用于网页开发的动态交互语言。\n\n1. 用记事本创建一个 `helloworld.html`\
    \ 文件，并在浏览器中打开它，即可看到网页\n\n`<html>`：标签告诉浏览器这是一个 HTML 文档。\n\n`<head>`：标签是元数据（内容和字符集）的容器。\n\
    \n`<title>`：标签定义文档的标题。\n\n`<body>`：标签定义文档的主体。\n\n`<script>`：标签用于定义客户端脚本（JavaScript）。\n\
    \n`document.write()`：向浏览器中的文档写入 HTML 内容\n\n```html\n<html>\n<head>\n    <meta\
    \ http-equiv = \"Content-Type\" content = \"text/html; charset=UTF-8\" >\n   \
    \ <title> 第一个网页 </title>\n</head>\n<body>\n    <script type = \"text/javascript\"\
    \ >\n        document.write ( \"HelloWorld\" );\n    </script>\n</body>\n</html>\n\
    ```\n\n结果：\n\n![](img/Image00002.jpg)\n\n# 变量\n\n![](img/Image00003.jpg)\n\n1.\
    \ 创建一个文件：`Variable.html` 并在浏览器中打开它\n\n`//`：单行注释，不会被 JavaScript 执行\n\n`\"\"`：字符串类型\n\
    \n```javascript\n<script type = \"text/javascript\" >\n    var basket = \"Apple\"\
    \ ;\n    document.write ( basket );\n</script>\n```\n\n结果：\n\n![](img/Image00004.jpg)\n\
    \n2. 修改文件：`Variable.html`，将 \"orange\" 替换 \"apple\"。\n\n![](img/Image00005.jpg)\n\
    \n`<br>`：HTML 标签，换行\n\n```javascript\n<script type = \"text/javascript\" >\n \
    \   var basket = \"Apple\" ;\n    document.write ( basket );\n    document.write\
    \ ( \"<br>\" );\n    basket = \"Orange\" ;\n    document.write ( basket );\n</script>\n\
    ```\n\n运行结果：\n\n![](img/Image00006.jpg)\n\n# 变量与类型\n\nJavaScript 是一种动态类型语言\n\n\
    1. 用记事本创建一个 `var.html` 文件，并在浏览器中打开它，即可看到网页\n\n`typeof()`：查找 JavaScript 变量的类型\n\
    \n```javascript\n<script type = \"text/javascript\" >\n    var x ;           //undefined\n\
    \    var a = 9 ;       //number\n    var b = 1.5 ;     //number\n    var c = true\
    \ ;    //Boolean\n    var d = \"abc\" ;   //string\n    var e = 'abc' ;   //string\n\
    \    document.write ( typeof ( x ) + \"<br>\" );\n    document.write ( typeof\
    \ ( a ) + \"<br>\" );\n    document.write ( typeof ( b ) + \"<br>\" );\n    document.write\
    \ ( typeof ( c ) + \"<br>\" );\n    document.write ( typeof ( d ) + \"<br>\" );\n\
    \    document.write ( typeof ( e ) + \"<br>\" );\n</script>\n```\n\n结果：\n\n```\n\
    undefined\nnumber\nnumber\nboolean\nstring\nstring\n```\n\n# 算术运算符\n\n1. 用记事本创建一个\
    \ `ArithmeticOperator.html` 文件，并在浏览器中打开它\n\n算术运算符：\n\n加 `+`，减 `-`，乘 `*`，除 `/`，取模\
    \ `%`\n\n![](img/Image00007.jpg)\n\n```javascript\n<script type = \"text/javascript\"\
    \ >\n    var a = 1 ;\n    var b = 2 ;\n    var c = 3 ;\n    var d = 4 ;\n    document.write\
    \ ( a + b ); // = 3\n    document.write ( \"<br>\" );\n    document.write ( a\
    \ - b ); // = -1\n    document.write ( \"<br>\" );\n    document.write ( a * b\
    \ ); // = 2\n    document.write ( \"<br>\" );\n    document.write ( b / a ); //\
    \ = 2\n    document.write ( \"<br>\" );\n    document.write ( c % b ); // = 1\
    \ //除法后的余数\n    document.write ( \"<br>\" );\n</script>\n```\n\n# 函数\n\n![](img/Image00008.jpg)\n\
