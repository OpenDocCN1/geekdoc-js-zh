    \     provinceArray [ 0 ] =[];\n     provinceArray [ 1 ] =[ \"北京\" , \"上海\" ];\n\
    \     provinceArray [ 2 ] =[ \"旧金山\" , \"纽约\" ];\n    window.onload = function\
    \ ()\n    {\n        var country = document.getElementById ( \"country\" );\n\
    \        for ( var i = 0 ; i < countryArray.length ; i ++)\n        {\n      \
    \      var option = document.createElement ( \"option\" );\n            option.text\
    \ = countryArray [ i ];\n            option.value = countryArray [ i ];\n    \
    \        country.options [ country.options.length ]= option ;\n        }\n   \
    \ }\n    function doCountryChange ( obj )\n    {\n        var provinceObj = document.getElementById\
    \ ( \"province\" );\n        provinceObj.options.length = 0 ; // 清空所有\n      \
    \  var index = obj.selectedIndex ;\n        for ( var i = 0 ; i < provinceArray\
    \ [ index ]. length ; i ++)\n        {\n            var option = document.createElement\
    \ ( \"option\" );\n            option.text = provinceArray [ index ][ i ];\n \
    \           option.value = provinceArray [ index ][ i ];\n            provinceObj.options\
    \ [ provinceObj.options.length ]= option ;\n        }\n    }\n</script>\n```\n\
    \n## 事件\n\n事件列表：\n\n| Onblur | 元素失去焦点 |\n|--------|---------------------|\n| Onchange\
    \ | 内容改变 |\n| Onclick | 鼠标点击对象 |\n| Ondblclick | 鼠标双击对象 |\n\n"
