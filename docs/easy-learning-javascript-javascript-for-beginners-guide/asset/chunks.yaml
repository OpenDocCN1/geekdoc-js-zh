    doCreateRow ()    {        var rowNum = parseInt ( document.getElementById ( "row"
    ). value );        var colNum = parseInt ( document.getElementById ( "col" ).
    value );        for ( var i = 1 ; i <= rowNum ; i ++)        {            var
    row = table.insertRow (- 1 );            for ( var j = 1 ; j <= colNum ; j ++)           
    {                var cell = row.insertCell (- 1 );                cell.innerHTML
    = "Rows: " + i + ",Columns: " + j ;            }        }    }    function doDeleteRow
    ()    {        var rowNum = parseInt ( document.getElementById ( "row" ). value
    );        table.deleteRow ( rowNum );    }    function doDeleteCol ()    {       
    var colNum = parseInt ( document.getElementById ( "col" ). value );        var
    rows = table.rows ;        for ( var i = 0 ; i < rows.length ; i ++)        {           
    rows [ i ]. deleteCell ( colNum );        }    }</script>

    ```


    # 计时器


    ![](img/Image00056.jpg)


    1. 使用记事本创建一个`Timer.html`文件，并在浏览器中打开它


    - `getFullYear()`: 获取四位数的年份（yyyy）

    - `getMonth()`: 获取月份（0-11）

    - `getDate()`: 获取日期（1-31）

    - `getHours()`: 获取小时（0-23）

    - `getMinutes()`: 获取分钟（0-59）

    - `getSeconds()`: 获取秒数（0-59）

    - `getTime()`: 获取时间（自 1970 年 1 月 1 日以来的毫秒数）

    - `setInterval()`: 持续调用该函数，直到调用`clearInterval()`为止


    ```

    <div id = "dateDiv" ></div><script type = "text/javascript" >    function doSetInterval
    ()    {        var dateDiv = document.getElementById ( "dateDiv" );        var
    d = new Date ();        var dateString = d.getHours ()+ ":" + d.getMinutes ()+
    ":" + d.getSeconds ()        dateDiv.innerHTML = dateString ;    }    setInterval
    ( "doSetInterval()" , 1000 );</script>

    ```


