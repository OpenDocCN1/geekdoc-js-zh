    country\">\n    <option value=\"\"> --请选择国家-- </option>\n</select>\n<script type=\"\
    text/javascript\">\n    var countryArray =[ \"中国\" , \"美国\" ];\n    window.onload\
    \ = function ()\n    {\n        var countryObj = document.getElementById ( \"\
