  \n`obj.childNodes`：获取当前节点的所有子节点\n\n`obj.nodeName`：获取节点名称\n\n`obj.nodeType`：获取节点类型\n\
  \n`obj.innerHTML`：获取节点的 HTML 内容\n\n![](img/Image00042.jpg)\n\n`<b>`：标签指定粗体文本。\n\n\
  `<a>`：标签定义超链接，用于从一个页面链接到另一个页面。\n\n```html\n<body>  <div id = \"div\" >    <b> United\
  \ State </b>    <span> Book </span>    <a href = \"#\" > VereJava </a>  </div> \
  \ <hr>  <input type = \"button\" value = \"Get Parent Node\" onclick = \"doGetParentNode()\"\
  \ /></body><script type = \"text/javascript\" >    function doGetParentNode () \
  \   {        var divObj = document.getElementById ( \"div\" );        alert ( divObj.parentNode.nodeName\
  \ );    }</script>\n```\n\n2. 修改 `ElementHierarchy.html` 以获取所有子节点\n\n`obj.childNodes`：获取当前节点的所有子节点\n\
  \n`obj.nodeName`：获取父节点名称\n\n`obj.nodeType`：获取父节点类型\n\n`obj.innerHTML`：获取父节点的 HTML\
  \ 内容\n\n![](img/Image00043.jpg)\n\n```html\n<body>  <div id= \"div\" >    <b> United\
  \ State </b>    <span> Book </span>    <a href = \"#\" > VereJava </a>  </div> \
  \ <hr>  <input type = \"button\" value = \"Get Child Nodes\" onclick = \"doGetChildNodes()\"\
  \ /></body><script type = \"text/javascript\" >    function doGetChildNodes () \
  \   {        var div = document.getElementById ( \"div\" );        var childNodes\
  \ = div.childNodes ;        for ( var i = 0 ; i < childNodes.length ; i ++)    \
  \    {            if ( childNodes [ i ]. nodeType == 1 )            {          \
  \      document.write ( childNodes [ i ]. nodeName + \" , \" );                document.write\
  \ ( childNodes [ i ]. nodeType + \" , \" );                document.write ( childNodes\
  \ [ i ]. innerHTML + \"<br>\" );            }        }    }</script>\n```\n\n3.\
  \ 修改 `ElementHierarchy.html` 以获取 book 节点的前一个和后一个节点\n\n`obj.previousSibling`：获取当前节点的前一个兄弟节点\n\
  \n`obj.nextSibling`：获取当前节点的后一个兄弟节点\n\n![](img/Image00044.jpg)\n\n```html\n<body>\
  \  <div id = \"div\" >    <b> United State </b><span id = \"book\" > Book </span><a\
  \ href = \"#\" > VereJava </a>  </div>  <hr>  <input type = \"button\" value = \"\
  Get Sliding Nodes\" onclick = \"doGetSliding()\" /></body><script type = \"text/javascript\"\
  \ >    function doGetSliding ()    {        var bookObj = document.getElementById\
  \ ( \"book\" );        document.write ( bookObj.previousSibling.innerHTML + \"<br>\"\
  \ );        document.write ( bookObj.nextSibling.innerHTML );    }</script>\n```\n\
  \n## 创建文本节点\n\n![](img/Image00045.jpg)\n\n1. 使用记事本创建一个 `CreateTextNode.html` 文件，并在浏览器中打开它\n\
  \n`obj.createTextNode`：使用指定的文本创建一个文本节点\n\n`obj.appendChild`：将一个节点追加为某个节点的最后一个子节点\n\
  \n```html\n<style>    div{        width:200px;        height:100px;        border:1px\
  \ solid #ff0000;    }</style><div id = \"div\" ></div><input type = \"button\" value\
  \ = \"Create Text Node\" onclick = \"doCreateTextNode()\" /><script type = \"text/javascript\"\
  \ >    function doCreateTextNode ()    {        var divObj = document.getElementById\
  \ ( \"div\" );        var newNode = document.createTextNode ( \"Good Dreams\" );\
  \        divObj.appendChild ( newNode );    }</script>\n```\n\n2. 使用记事本创建一个 `CreateElement.html`\
  \ 文件，并在浏览器中打开它\n\n`obj.createElement`：使用指定的名称创建一个元素节点\n\n`obj.appendChild`：将一个节点追加为某个节点的最后一个子节点\n\
  \n![](img/Image00046.jpg)\n\n```html\n<style>    div{        width:200px;      \
  \  height:100px;        border:1px solid #ff0000;    }</style><div id = \"div\"\
  \ ></div><input type = \"button\" value = \"Create Element\" onclick = \"doCreateElement()\"\
  \ /><script type = \"text/javascript\" >    function doCreateElement ()    {   \
  \     var divObj = document.getElementById ( \"div\" );        var buttonElement\
  \ = document.createElement ( \"input\" );        buttonElement.type = \"button\"\
  \ ;        buttonElement.value = \"button\" ;        divObj.appendChild ( buttonElement\
  \ );    }</script>\n```\n\n## 删除节点\n\n![](img/Image00047.jpg)\n\n1. 使用记事本创建一个 `DeleteNode.html`\
  \ 文件，并在浏览器中打开它\n\n`obj.removeChild`：移除指定的子节点\n\n```html\n<style>    div{       \
  \ width:200px;        height:250px;        border:1px solid #ff0000;    }</style><div\
  \ id = \"div1\" >    <img id = \"image\" src = \"python.jpg\" /></div><br><input\
  \ type = \"button\" value = \"Remove Child\" onclick = \"doRemoveChild()\" /><script\
  \ type = \"text/javascript\" >    function doRemoveChild ()    {        var div\
  \ = document.getElementById ( \"div1\" );        var img = document.getElementById\
  \ ( \"image\" );        div.removeChild ( img );    }</script>\n```\n\n## 替换节点\n\
