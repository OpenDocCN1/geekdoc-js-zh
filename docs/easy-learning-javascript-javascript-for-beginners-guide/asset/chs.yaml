  \ , div1.childNodes [ 0 ]);    }  </script>\n```\n\n## 添加联系人示例\n\n![](img/Image00049.jpg)\n\
  \n1. 使用记事本创建一个 `AddContactExample.html` 文件，并在浏览器中打开它\n\n```\n<style>    #div{       \
