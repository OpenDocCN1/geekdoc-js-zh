  ```\n\n## 表格创建行与列\n\n![](img/Image00054.jpg)\n\n1. 使用记事本创建一个 `TableCreateRowsColumns.html`\
  \ 文件，并在浏览器中打开它\n\n`table.insertRow`: 在给定的 `<table>` 中插入一个新行（`<tr>`），返回对新行的引用。\n\n\
  `table.insertCell`: 在给定的 `<tr>` 中插入一个新列（`<td>`），返回对新列的引用。\n\n```\n<style type =\
  \ \"text/css\" >    .tableClass{        width:600px;        border:1px solid #ff0000;       \
  \ border-collapse: collapse;    }    .tableClass td{        border:1px solid #ff0000;   \
  \ }</style><input type = \"button\" value = \"Create Table\" onclick = \"doCreateTable()\"\
  \ /><input type = \"button\" value = \"Create Row\" onclick = \"doCreateRow()\"\
  \ />Rows: <input type = \"text\" value = \"\" id = \"row\" /> Columns: <input type\
  \ = \"text\" value = \"\" id = \"col\" /><br><br><div id = \"div\" ></div><script\
  \ type = \"text/javascript\" >    var table ;    function doCreateTable ()    {       \
  \ table = document.createElement ( \"table\" );        table.className = \"tableClass\"\
  \ ;        document.getElementById ( \"div\" ). appendChild ( table );    }    function\
  \ doCreateRow ()    {        var rowNum = parseInt ( document.getElementById ( \"\
  row\" ). value );        var colNum = parseInt ( document.getElementById ( \"col\"\
  \ ). value );        for ( var i = 1 ; i <= rowNum ; i ++)        {            var\
  \ row = table.insertRow (- 1 );            for ( var j = 1 ; j <= colNum ; j ++)           \
  \ {                var cell = row.insertCell (- 1 );                cell.innerHTML\
  \ = \"row: \" + i + \", col: \" + j ;            }        }    }</script>\n```\n\
  \n## 删除表格行与列\n\n![](img/Image00055.jpg)\n\n1. 使用记事本创建一个 `DeleteTableRowColumn.html`\
  \ 文件，并在浏览器中打开它\n\n`table.deleteCell`: 删除当前表格行中的一个单元格。\n\n\n\n\n\n```\n<style type\
  \ = \"text/css\" >    .tableClass{        width:600px;        border:1px solid #ff0000;       \
  \ border-collapse: collapse;    }    .tableClass td{        border:1px solid #ff0000;   \
  \ }</style><input type = \"button\" value = \"Create Table\" onclick = \"doCreateTable()\"\
  \ /><input type = \"button\" value = \"Create Row\" onclick = \"doCreateRow()\"\
  \ /><br><input type = \"button\" value = \"Delete Row\" onclick = \"doDeleteRow()\"\
  \ /><input type = \"button\" value = \"Delete Col\" onclick = \"doDeleteCol()\"\
  \ /><br>Rows: <input type = \"text\" value = \"\" id = \"row\" /> Columns: <input\
  \ type = \"text\" value = \"\" id = \"col\" /><br><br><div id = \"div\" > </div><script\
  \ type = \"text/javascript\" >    var table ;    function doCreateTable ()    {       \
  \ table = document.createElement ( \"table\" );        table.className = \"tableClass\"\
  \ ;        document.getElementById ( \"div\" ). appendChild ( table );    }    function\
  \ doCreateRow ()    {        var rowNum = parseInt ( document.getElementById ( \"\
  row\" ). value );        var colNum = parseInt ( document.getElementById ( \"col\"\
  \ ). value );        for ( var i = 1 ; i <= rowNum ; i ++)        {            var\
  \ row = table.insertRow (- 1 );            for ( var j = 1 ; j <= colNum ; j ++)           \
  \ {                var cell = row.insertCell (- 1 );                cell.innerHTML\
  \ = \"Rows: \" + i + \",Columns: \" + j ;            }        }    }    function\
  \ doDeleteRow ()    {        var rowNum = parseInt ( document.getElementById ( \"\
  row\" ). value );        table.deleteRow ( rowNum );    }    function doDeleteCol\
  \ ()    {        var colNum = parseInt ( document.getElementById ( \"col\" ). value\
  \ );        var rows = table.rows ;        for ( var i = 0 ; i < rows.length ; i\
  \ ++)        {            rows [ i ]. deleteCell ( colNum );        }    }</script>\n\
  ```\n\n# 计时器\n\n![](img/Image00056.jpg)\n\n1. 使用记事本创建一个`Timer.html`文件，并在浏览器中打开它\n\
  \n- `getFullYear()`: 获取四位数的年份（yyyy）\n- `getMonth()`: 获取月份（0-11）\n- `getDate()`:\
  \ 获取日期（1-31）\n- `getHours()`: 获取小时（0-23）\n- `getMinutes()`: 获取分钟（0-59）\n- `getSeconds()`:\
  \ 获取秒数（0-59）\n- `getTime()`: 获取时间（自 1970 年 1 月 1 日以来的毫秒数）\n- `setInterval()`: 持续调用该函数，直到调用`clearInterval()`为止\n\
  \n```\n<div id = \"dateDiv\" ></div><script type = \"text/javascript\" >    function\
  \ doSetInterval ()    {        var dateDiv = document.getElementById ( \"dateDiv\"\
  \ );        var d = new Date ();        var dateString = d.getHours ()+ \":\" +\
  \ d.getMinutes ()+ \":\" + d.getSeconds ()        dateDiv.innerHTML = dateString\
  \ ;    }    setInterval ( \"doSetInterval()\" , 1000 );</script>\n```\n\n感谢学习，如果你想学习网页编码，请学习这本书\n\
