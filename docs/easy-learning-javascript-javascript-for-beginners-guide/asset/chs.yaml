- "# 轻松学习Javascript：初学者指南的Javascript\n\n如果你想学习 HTML CSS 的基础知识：<< 轻松学习 HTML CSS >>\n\
  \n[`www.amazon.com/dp/B07QHRB23X`](https://www.amazon.com/dp/B07QHRB23X)\n\n![](img/Image00001.jpg)\n\
  \n如果你已经掌握了 HTML CSS 的基础知识，请跳过它，开始一段激动人心的旅程\n\n# JavaScript HelloWorld\n\nJavaScript\
  \ 是一种用于网页开发的动态交互语言。\n\n1. 用记事本创建一个 `helloworld.html` 文件，并在浏览器中打开它，即可看到网页\n\n`<html>`：标签告诉浏览器这是一个\
  \ HTML 文档。\n\n`<head>`：标签是元数据（内容和字符集）的容器。\n\n`<title>`：标签定义文档的标题。\n\n`<body>`：标签定义文档的主体。\n\
  \n`<script>`：标签用于定义客户端脚本（JavaScript）。\n\n`document.write()`：向浏览器中的文档写入 HTML 内容\n\
  \n```html\n<html>\n<head>\n    <meta http-equiv = \"Content-Type\" content = \"\
  text/html; charset=UTF-8\" >\n    <title> 第一个网页 </title>\n</head>\n<body>\n    <script\
  \ type = \"text/javascript\" >\n        document.write ( \"HelloWorld\" );\n   \
  \ </script>\n</body>\n</html>\n```\n\n结果：\n\n![](img/Image00002.jpg)\n\n# 变量\n\n\
  ![](img/Image00003.jpg)\n\n1. 创建一个文件：`Variable.html` 并在浏览器中打开它\n\n`//`：单行注释，不会被\
  \ JavaScript 执行\n\n`\"\"`：字符串类型\n\n```javascript\n<script type = \"text/javascript\"\
  \ >\n    var basket = \"Apple\" ;\n    document.write ( basket );\n</script>\n```\n\
  \n结果：\n\n![](img/Image00004.jpg)\n\n2. 修改文件：`Variable.html`，将 \"orange\" 替换 \"apple\"\
  。\n\n![](img/Image00005.jpg)\n\n`<br>`：HTML 标签，换行\n\n```javascript\n<script type\
  \ = \"text/javascript\" >\n    var basket = \"Apple\" ;\n    document.write ( basket\
  \ );\n    document.write ( \"<br>\" );\n    basket = \"Orange\" ;\n    document.write\
  \ ( basket );\n</script>\n```\n\n运行结果：\n\n![](img/Image00006.jpg)\n\n# 变量与类型\n\n\
  JavaScript 是一种动态类型语言\n\n1. 用记事本创建一个 `var.html` 文件，并在浏览器中打开它，即可看到网页\n\n`typeof()`：查找\
  \ JavaScript 变量的类型\n\n```javascript\n<script type = \"text/javascript\" >\n    var\
  \ x ;           //undefined\n    var a = 9 ;       //number\n    var b = 1.5 ; \
  \    //number\n    var c = true ;    //Boolean\n    var d = \"abc\" ;   //string\n\
  \    var e = 'abc' ;   //string\n    document.write ( typeof ( x ) + \"<br>\" );\n\
  \    document.write ( typeof ( a ) + \"<br>\" );\n    document.write ( typeof (\
  \ b ) + \"<br>\" );\n    document.write ( typeof ( c ) + \"<br>\" );\n    document.write\
  \ ( typeof ( d ) + \"<br>\" );\n    document.write ( typeof ( e ) + \"<br>\" );\n\
  </script>\n```\n\n结果：\n\n```\nundefined\nnumber\nnumber\nboolean\nstring\nstring\n\
  ```\n\n# 算术运算符\n\n1. 用记事本创建一个 `ArithmeticOperator.html` 文件，并在浏览器中打开它\n\n算术运算符：\n\
  \n加 `+`，减 `-`，乘 `*`，除 `/`，取模 `%`\n\n![](img/Image00007.jpg)\n\n```javascript\n<script\
  \ type = \"text/javascript\" >\n    var a = 1 ;\n    var b = 2 ;\n    var c = 3\
  \ ;\n    var d = 4 ;\n    document.write ( a + b ); // = 3\n    document.write (\
  \ \"<br>\" );\n    document.write ( a - b ); // = -1\n    document.write ( \"<br>\"\
  \ );\n    document.write ( a * b ); // = 2\n    document.write ( \"<br>\" );\n \
  \   document.write ( b / a ); // = 2\n    document.write ( \"<br>\" );\n    document.write\
  \ ( c % b ); // = 1 //除法后的余数\n    document.write ( \"<br>\" );\n</script>\n```\n\
  \n# 函数\n\n![](img/Image00008.jpg)\n\n![](img/Image00009.jpg)\n\n![](img/Image00010.jpg)\n\
  \n1. 创建一个文件：`Function.html`\n\n```javascript\n<script type = \"text/javascript\"\
  \ >\n    function add ( a , b ){\n        return a + b ;\n    }\n    var result\
  \ = add ( 4 , 2 );\n    document.write ( result ); // 6\n    document.write ( \"\
  <br>\" );\n    var result = add ( 5 , 3 );\n    document.write ( result )  // 8\n\
  </script>\n```\n\n运行结果：\n\n```\n6\n8\n```\n\n2. 在 `Function.html` 中添加关于 `-`、`*`、`/`\
  \ 的 3 个函数\n\n```javascript\n<script type = \"text/javascript\" >\n    function add\
  \ ( a , b ){\n        return a + b ;\n    }\n    function sub ( a , b ){\n     \
  \   return a - b ;\n    }\n    function multiply ( a , b ){\n        return a *\
  \ b ;\n    }\n    function divide ( a , b ){\n        return a / b ;\n    }\n  \
  \  var result = add ( 4 , 2 );\n    document.write ( result ); // 6\n    document.write\
  \ ( \"<br>\" );\n    var result = sub ( 4 , 2 );\n    document.write ( result )\
  \  // 2\n    document.write ( \"<br>\" );\n    var result = multiply ( 4 , 2 );\n\
  \    document.write ( result )  // 8\n    document.write ( \"<br>\" );\n    var\
  \ result = divide ( 4 , 2 );\n    document.write ( result )  // 2\n</script>\n```\n\
  \n# 类\n\n![](img/Image00011.jpg)\n\n1. 创建一个文件：`Caculator.html`\n\n\n\n\n\n```javascript\n\
  <script type = \"text/javascript\" >\n    function Caculator (){\n        this.add\
  \ = function ( a , b ){\n            return a + b ;\n        }\n        this.sub\
  \ = function ( a , b ){\n            return a - b ;\n        }\n        this.multiply\
  \ = function ( a , b ){\n            return a * b ;\n        }\n        this.divide\
  \ = function ( a , b ){\n            return a / b ;\n        }\n    }\n    var cal\
  \ = new Caculator ();\n    var result = cal.add ( 4 , 2 );\n    document.write (\
  \ result ); // 6\n    var result = cal.sub ( 4 , 2 );\n    document.write ( result\
  \ )  // 2\n    var result = cal.multiply ( 4 , 2 );\n    document.write ( result\
  \ )  // 8\n    var result = cal.divide ( 4 , 2 );\n    document.write ( result )\
  \  // 2\n</script>\n```\n\n## 类型转换\n\n`parseInt()`：这是 JavaScript 的默认函数，可以将字符串转换为整数。\n\
  \n1. 创建一个 `TypeConversion.html` 文件\n\n```javascript\n<script type = \"text/javascript\"\
  \ >\n    var a = \"1\" ;           var b = \"2\" ;       var result = a + b ; //\
  \ + 连接两个字符串\n    document.write ( result ); // = 12\n    document.write ( \"<br>\"\
  \ );\n    result = parseInt ( a ) + parseInt ( b );\n    document.write ( result\
  \ ); // = 3\n</script>\n```\n\n结果：\n\n12\n\n3\n\n## DOM\n\nDOM：在 JavaScript 中，每个\
  \ HTML 元素都是一个类对象。\n\n文档对象模型结构图：\n\n![](img/Image00012.jpg)\n\n1. 创建一个文件：`getElementById.html`\n\
  \n`document.getElementById()`：是一个 DOM 方法，用于通过 ID 属性获取元素。\n\n`alert()`：是一个函数，用于打开信息窗口。\n\
  \n`Obj.innerHTML`：设置或返回元素的内部 HTML 内容。\n\n`<div>`：标签定义 HTML 文档中的一个分区或节。\n\n```javascript\n\
  <div id = \"word\" > Faith and Hope </div>\n<script type = \"text/javascript\" >\n\
  \    var divObj = document.getElementById ( \"word\" );\n    var htmlContent = divObj.innerHTML\
  \ ;\n    alert ( htmlContent );\n</script>\n```\n\n![](img/Image00013.jpg)\n\n2.\
  \ 修改文件：`getElementById.html`\n\n`<input type= \" text \" />`：HTML 标签，指定一个用户可以输入数据的输入字段。\n\
  \n```javascript\n<input type = \"text\" id = \"username\" value = \"Joseph\" />\n\
  <script type = \"text/javascript\" >\n    var divObj = document.getElementById (\
  \ \"username\" );\n    var value = divObj.value ;\n    alert ( value );\n</script>\n\
  ```\n\n![](img/Image00014.jpg)\n\n## 事件\n\n1. 创建一个文件：`onClick.html`\n\n`onClick`：当鼠标点击按钮时，会调用一个函数。\n\
  \n`<input type= \" button \" />`：HTML 标签，定义一个可点击的按钮。\n\n```javascript\n<input type\
  \ = \"text\" id = \"username\" value = \"Joseph\" />\n<input type = \"button\" value\
  \ = \"Click Me\" onClick = \"doClick()\" />\n<script type = \"text/javascript\"\
  \ >\n    function doClick (){\n        var divObj = document.getElementById ( \"\
  username\" );\n        var value = divObj.value ;\n        alert ( value );\n  \
  \  }\n</script>\n```\n\n![](img/Image00015.jpg)\n\n## 创建一个网页计算器\n\n1. 创建一个文件：`WebCaculator.html`\n\
  \n![](img/Image00016.jpg)\n\n```javascript\na: <input type = \"text\" id = \"a\"\
  \ value = \"\" />\nb: <input type = \"text\" id = \"b\" value = \"\" />\n=<span\
  \ id = \"result\" ></span>\n<br>\n<input type = \"button\" value = \"+\" onClick\
  \ = \"doAdd()\" />\n<script type = \"text/javascript\" >\n    function doAdd (){\n\
  \        var aObj = document.getElementById ( \"a\" );\n        var bObj = document.getElementById\
  \ ( \"b\" );\n        var resultObj = document.getElementById ( \"result\" );\n\
  \        var a = parseInt ( aObj.value ); // 将字符串转换为整数\n        var b = parseInt\
  \ ( bObj.value );\n        resultObj.innerHTML = a + b ;\n    }\n</script>\n```\n\
  \n2. 为 `WebCaculator.html` 添加另外三个函数 -、*、/\n\n```javascript\na: <input type = \"\
  text\" id = \"a\" value = \"\" />\nb: <input type = \"text\" id = \"b\" value =\
  \ \"\" />\n=<span id = \"result\" ></span>\n<br>\n<input type = \"button\" value\
  \ = \"+\" onClick = \"doAdd()\" />\n<input type = \"button\" value = \"-\" onClick\
  \ = \"doSub()\" />\n<input type = \"button\" value = \"*\" onClick = \"doMultiply()\"\
  \ />\n<input type = \"button\" value = \"/\" onClick = \"doDivide()\" />\n<script\
  \ type = \"text/javascript\" >\n    function doAdd (){\n        var aObj = document.getElementById\
  \ ( \"a\" );\n        var bObj = document.getElementById ( \"b\" );\n        var\
  \ resultObj = document.getElementById ( \"result\" );\n        var a = parseInt\
  \ ( aObj.value ); // 将字符串转换为整数\n        var b = parseInt ( bObj.value );\n     \
  \   resultObj.innerHTML = a + b ;\n    }\n    function doSub (){\n        var aObj\
  \ = document.getElementById ( \"a\" );\n        var bObj = document.getElementById\
  \ ( \"b\" );\n        var resultObj = document.getElementById ( \"result\" );\n\
  \        var a = parseInt ( aObj.value ); // 将字符串转换为整数\n        var b = parseInt\
  \ ( bObj.value );\n        resultObj.innerHTML = a - b ;\n    }\n    function doMultiply\
  \ (){\n        var aObj = document.getElementById ( \"a\" );\n        var bObj =\
  \ document.getElementById ( \"b\" );\n        var resultObj = document.getElementById\
  \ ( \"result\" );\n        var a = parseInt ( aObj.value ); // 将字符串转换为整数\n     \
  \   var b = parseInt ( bObj.value );\n        resultObj.innerHTML = a * b ;\n  \
  \  }\n    function doDivide (){\n        var aObj = document.getElementById ( \"\
  a\" );\n        var bObj = document.getElementById ( \"b\" );\n        var resultObj\
  \ = document.getElementById ( \"result\" );\n        var a = parseInt ( aObj.value\
  \ ); // 将字符串转换为整数\n        var b = parseInt ( bObj.value );\n        resultObj.innerHTML\
  \ = a / b ;\n    }\n</script>\n```\n\n点击 + 按钮的结果：\n\n![](img/Image00017.gif)\n\n\
  点击 - 按钮的结果：\n\n![](img/Image00018.gif)\n\n点击 * 按钮的结果：\n\n![](img/Image00019.gif)\n\
  \n点击 / 按钮的结果：\n\n![](img/Image00020.gif)\n\n## 赋值运算符\n\n1. 用记事本创建一个 `AssignmentOperator.html`\
  \ 文件，并在浏览器中打开它\n\n```javascript\n<script type = \"text/javascript\" >\n    var d\
  \ = 4 ;\n    document.write ( d ++); // = 4 先打印 d，然后自增 1\n    document.write ( \"\
  <br>\" );\n    d = 4 ;\n    document.write (++ d ); // = 5 先自增 1，然后打印 d\n    document.write\
  \ ( \"<br>\" );\n    d = 4 ;\n    document.write ( d --); // = 4 先打印 d，然后自减 1\n\
  \    document.write ( \"<br>\" );\n    d = 4 ;\n    document.write (-- d ); // =\
  \ 3 先自减 1，然后打印 d\n    var result = 10 ;\n    result = result + 1 ;\n    document.write\
  \ ( result ); // = 11\n    document.write ( \"<br>\" );\n    result = 10 ;\n   \
  \ result ++;\n    document.write ( result ); // = 11\n    document.write ( \"<br>\"\
  \ );\n    result = 10 ;\n    result += 1 ;\n    document.write ( result );  // =\
  \ 11\n    document.write ( \"<br>\" );\n</script>\n```\n\n2. 创建一个数量加减器 `quantity.html`\n\
  \n点击 + 按钮使数量增加 1，点击 - 按钮使数量减少 1。\n\n![](img/Image00021.jpg)\n\n```javascript\nQuantity:<br>\n\
  <input type = \"text\" style = \"width:30px\" id = \"quantity\" value = \"1\" />\n\
  <input type = \"button\" value = \"+\" onClick = \"doAdd()\" />\n<input type = \"\
  button\" value = \"-\" onClick = \"doSub()\" />\n<script type = \"text/javascript\"\
  \ >\n    function doAdd (){\n        var quantityObj = document.getElementById (\
  \ \"quantity\" );\n        var value = parseInt ( quantityObj.value );\n       \
  \ value ++\n        quantityObj.value = value ;\n    }\n    function doSub (){\n\
  \        var quantityObj = document.getElementById ( \"quantity\" );\n        var\
  \ value = parseInt ( quantityObj.value );\n        value --\n        quantityObj.value\
  \ = value ;\n    }\n</script>\n```\n\n## 关系运算符\n\n1. 用记事本创建一个 `RelationalOperator.html`\
  \ 文件，并在浏览器中打开它\n\n关系运算符只有两个值：true、false\n\n```javascript\n<script type = \"text/javascript\"\
  \ >\n    document.write ( 1 > 2 ); // false\n    document.write ( \"<br>\" );\n\
  \    document.write ( 1 >= 1 ); // true\n    document.write ( \"<br>\" );\n    document.write\
  \ ( 1 < 2 ); // true\n    document.write ( \"<br>\" );\n    document.write ( 1 <=\
  \ 2 ); // true\n    document.write ( \"<br>\" );\n    document.write ( 1 == 1 );\
  \ // true\n    document.write ( \"<br>\" );\n    document.write ( 1 != 2 ); // true\n\
  </script>\n```\n\n## If 条件语句\n\nIf 语句\n\n1. `if (expression){statement}`\n2. `if\
  \ (expression) { statement } else { statement }`\n3. `if (expression) {statement\
  \ } else if { statement }`\n\n1. 用记事本创建一个 `If.html` 文件，并在浏览器中打开它\n\n分数示例：\n\n- 如果分数\
  \ == 5：优秀\n- 否则如果分数 == 4：良好\n- 否则：需要努力\n\n![](img/Image00022.jpg)\n\n\n\n\n\n![](img/Image00023.jpg)\n\
  \n![](img/Image00024.jpg)\n\n| 请输入您的分数：<br><input type = \"text\"   id = \"score\"\
  \ value = \"\" /><input type = \"button\" value = \"提交\" onClick = \"doSubmit()\"\
  \ /><br><span id = \"message\" ></span><script type = \"text/javascript\" >    function\
  \ doSubmit (){        var scoreObj = document.getElementById ( \"score\" );    \
  \    var messageObj = document.getElementById ( \"message\" );        var score\
  \ = parseInt ( scoreObj.value );        if ( score == 5 ) {            messageObj.innerHTML\
  \ = \"优秀\" ;        } else if ( score == 4 ) {            messageObj.innerHTML =\
  \ \"良好\" ;        } else {            messageObj.innerHTML = \"需要加油\" ;        }\
  \    }</script> |\n\n## 逻辑运算符\n\n1. 用记事本创建一个 `LogicOperator.html` 文件，并在浏览器中打开\n\n\
  逻辑运算符：与 `&&`，或 `||`，非 `!`\n\n- `&&` 如果操作符两侧都为 true，则返回 true，否则返回 false\n- `||` 当操作符两侧都为\
  \ false 时结果为 false，否则为 true\n- `!` 如果返回 true，则结果为 false，否则为 true\n\n```javascript\n\
  <script type = \"text/javascript\" >\n    document.write ( true && false ); // false\n\
  \    document.write ( \"<br>\" );\n    document.write ( false && true ); // false\n\
  \    document.write ( \"<br>\" );\n    document.write ( false && false ); // false\n\
  \    document.write ( \"<br>\" );\n    document.write ( true && true ); // true\n\
  \    document.write ( \"<br>\" );\n    document.write ( true || false ); // true\n\
  \    document.write ( \"<br>\" );\n    document.write ( false || true ); // true\n\
  \    document.write ( \"<br>\" );\n    document.write ( true || true ); // true\n\
  \    document.write ( \"<br>\" );\n    document.write ( false || false ); // false\n\
  \    document.write ( \"<br>\" );\n    document.write (! true ); // false\n    document.write\
  \ ( \"<br>\" );\n    document.write (! false ); // true\n    document.write ( \"\
  <br>\" );\n</script>\n```\n\n2. 创建一个 `LogicOperator2.html`\n\n```javascript\n<script\
  \ type = \"text/javascript\" >\n    document.write ( 1 > 2 && 3 > 4 ) // = false\n\
  \    document.write ( 2 > 1 && 3 > 4 ) // = false\n    document.write ( \"--------------\"\
  \ )\n    document.write ( 2 > 1 || 3 > 4 ) // = true\n    document.write ( 2 > 1\
  \ || 3 > 4 ) // = true\n    document.write ( 1 > 2 || 3 > 4 ) // = false\n</script>\n\
  ```\n\n3. 工资税示例：\n\n税额 = 工资 * 税率\n\n等级：\n\n- 500 -- 2000 美元：税率 10%\n- 2000--5000\
  \ 美元：税率 15%\n- 5000--20000 美元：税率 20%\n- 超过 20000 美元：税率 30%\n\n```javascript\n<script\
  \ type = \"text/javascript\" >\n    var salary = 10000 ;\n    var tax = 0 ;\n  \
  \  if ( salary >= 500 && salary < 2000 ) {\n        tax = salary * 0.1 ;\n    }\
  \ else if ( salary >= 2000 && salary < 5000 ) {\n        tax = salary * 0.15 ;\n\
  \    } else if ( salary >= 5000 && salary < 20000 ) {\n        tax = salary * 0.2\
  \ ;\n    } else {\n        tax = salary * 0.3 ;\n    }\n    document.write ( \"\
  税额=\" + tax );\n</script>\n```\n\n结果：\n\n税额=2000\n\n2. 创建一个 `WebTax.html`\n\n输入工资，然后点击计算税额按钮\n\
  \n![](img/Image00025.jpg)\n\n| 工资：<input type = \"text\" id = \"salary\" value =\
  \ \"\" />=<span id = \"tax\" ></span><input type = \"button\" value = \"计算税额\" onClick\
  \ = \"doTax()\" /><script type = \"text/javascript\" >    function doTax (){   \
  \     var salaryObj = document.getElementById ( \"salary\" );        var salary\
  \ = parseInt ( salaryObj.value );        var tax = 0 ;        if ( salary >= 500\
  \ && salary < 2000 ) {            tax = salary * 0.1 ;        } else if ( salary\
  \ >= 2000 && salary < 5000 ) {            tax = salary * 0.15 ;        } else if\
  \ ( salary >= 5000 && salary < 20000 ) {            tax = salary * 0.2 ;       \
  \ } else {            tax = salary * 0.3 ;        }        document.getElementById\
  \ ( \"tax\" ). innerHTML = tax ;    }</script> |\n\n## Switch 语句\n\n1. 用记事本创建一个\
  \ `switch.html` 文件，并在浏览器中打开\n\n输入数字 1、2、3\n\n- 1：使用 Visa 卡支付\n- 2：使用 Master 卡支付\n\
  - 3：使用 Paypal 支付\n- 其他：面对面支付\n\n```javascript\n<script type = \"text/javascript\"\
  \ >\n    var num = 1 ;\n    switch ( num ) {\n        case 1 :\n            document.write\
  \ ( \"使用 Visa 卡支付\" );\n            break ; // 终止代码继续执行\n        case 2 :\n    \
  \        document.write ( \"使用 Master 卡支付\" );\n            break ;\n        case\
  \ 3 :\n            document.write ( \"使用 Paypal 支付\" );\n            break ;\n \
  \       default :\n            document.write ( \"面对面支付\" );\n    }\n</script>\n\
  ```\n\n结果：\n\n使用 Visa 卡支付\n\n2. 创建一个 `WebPay.html`\n\nthis：当前元素对象\n\n![](img/Image00026.jpg)\n\
  \n| <input type = \"radio\" name = \"card\" value = \"1\" onclick = \"doPay(this)\"\
  \ /> Visa 卡<input type = \"radio\" name = \"card\" value = \"2\" onclick = \"doPay(this)\"\
  \ /> Master 卡<input type = \"radio\" name = \"card\" value = \"3\" onclick = \"\
  doPay(this)\" /> Paypal<br><span id = \"result\" ></span><script type = \"text/javascript\"\
  \ >    function doPay ( obj ){        var num = parseInt ( obj.value );        var\
  \ resultObj = document.getElementById ( \"result\" );        switch ( num ) {  \
  \          case 1 :                resultObj.innerHTML = \"使用 Visa 卡支付\" ;     \
  \           break ;            case 2 :                resultObj.innerHTML = \"\
  使用 Master 卡支付\" ;                break ;            case 3 :                resultObj.innerHTML\
  \ = \"使用 Paypal 支付\" ;                break ;            default :             \
  \   resultObj.innerHTML = \"面对面支付\" ;        }    }</script> |\n\n## While 循环语句\n\
