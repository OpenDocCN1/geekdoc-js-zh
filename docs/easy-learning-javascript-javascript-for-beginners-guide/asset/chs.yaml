  | `Onkeypress` | 键盘按键被按下 |\n| `Onkeyup` | 键盘按键被释放 |\n| `Onload` | 页面或图像加载完成 |\n\
  | `Onmousedown` | 鼠标按钮被按下 |\n| `Onmousemove` | 鼠标移动 |\n| `Onmouseout` | 鼠标从元素上移出\
  \ |\n| `Onmouseover` | 鼠标移到元素上 |\n| `Onmouseup` | 鼠标按钮被释放 |\n| `Onreset` | 重置按钮被点击\
  \ |\n| `Onresize` | 窗口或框架大小改变 |\n| `Onselect` | 文本被选中 |\n| `Onsubmit` | 提交按钮被点击\
