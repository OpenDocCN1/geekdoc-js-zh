    ![](img/bd4041c3e441a42781fa04a5cb5b773b_94_0.png)\n\nIf you're interested in\
    \ learning more about Foundation, then I recommend SitePoint's *Jump Start Foundation*.\n\
    \n## What About the Demo App?\n\nI've used sections of the demo app so far in\
    \ examples for this chapter, but the rest of the book will not use any grid systems.\
    \ This is for clarity, so you can more easily see the examples covering other\
    \ topics without the grids getting in the way, but also to reduce compatibility\
    \ issues with certain browsers.\n\nAs an exercise, try picking your favorite grid\
    \ system from this chapter and rewriting future examples using it.\n\n## Wrap\
    \ Up\n\nNow you know how to make a page layout that can respond to any browser\
    \ size and always fit proportionally. In the next chapter, we'll look at making\
    \ the content inside the layout responsive—because, without readable and presentable\
    \ content on all devices, your work is not yet complete.\n\n# Chapter 4: Responsive\
    \ Text\n\nIf web pages are to be truly responsive, then the content of pages should\
    \ also flow and change to suit the dimensions of the device a user is viewing\
    \ it on. While web pages are becoming more image and media heavy, text is still\
    \ a crucial component, and there are numerous techniques to help make it as readable\
    \ as possible, no matter the current device.\n\nTo understand better the ways\
    \ you can represent text on a web page, it's best to take a trip into the long\
    \ history of text.\n\n## The History of Text\n\nThe principles of **typography**\
    \ (the arranging and styling of text) have been evolving for as long as people\
    \ have been printing words on pages. Measurements such as leading (the space between\
    \ lines of text), kerning (the space between letters) and tracking (the space\
    \ between words) have carried over to desktop publishing, and anyone who's used\
    \ QuarkXpress, InDesign, or their predecessors, will know how they affect text.\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_97_0.png)\n\nManual typesetting was\
    \ a laborious process, as it involved tweaking the leading, kerning and tracking\
    \ of every line of text. Desktop publishing, and more recently setting type with\
    \ CSS, has made it far easier to play with these properties in an attempt to get\
    \ the “perfect” text.\n\nCSS typography shares many of the same properties as\
    \ print typography but has some different names. In fact, it has more descriptive\
    \ names than the older print version. In the early days of the Web, the level\
    \ of typographic control was limited, but CSS3 has helped greatly, giving us more\
    \ tools to realize our designs.\n\n## Responsive Typographical Properties in CSS\n\
    \nThere are lots of text-related properties you can set with CSS. Here are some\
    \ that I consider the most useful for responsive design:\n\n- **font-size**: the\
    \ size of the font.\n- **line-height**: specifies the minimum height of lines\
    \ within block elements, and the actual line height of inline elements.\n- **font-weight**:\
    \ the \"weight\" of the font, or how bold and strong it is.\n- **text-decoration**:\
    \ used to set either underline or strike-through.\n- **text-align**: used to set\
    \ text alignment of left, right, center, or justified (aligned to the left and\
    \ right margins equally).\n- **text-transform**: used to make text display as\
    \ uppercase, lowercase or capitalized.\n- **letter-spacing**: specifies the spacing\
    \ between letters, much like leading.\n- **word-spacing**: specifies the spacing\
    \ between words, much like tracking.\n\nIt’s common to set some or all of these\
    \ properties with pixel values. For example, you could add the following to the\
