  md: "# monochrome\n\nAgain, similar to color, monochrome lets you check for the\
    \ levels of gray in a device:\n\n```\n@media all and (min-monochrome: 8) {\n \
    \   ...\n}\n```\n\n# resolution\n\nThis feature targets devices that have high-resolution\
    \ screens:\n\n```\n@media all and (min-resolution: 120dpi) {\n    ...\n}\n```\n\
    \n# scan\n\nThe scan media feature lets you check the scanning process of TVs,\
    \ the options being interlace or progressive:\n\n```\n@media all and (scan: progressive)\
    \ {\n    ...\n}\n```\n\n# grid\n\ngrid is used for checking if a device is a terminal-like\
