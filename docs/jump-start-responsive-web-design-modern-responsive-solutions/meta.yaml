- md: "## Mobile First\n\nIn Chapter 1, I introduced the “mobile first” concept. Currently,\
    \ the page works on different device sizes but is not mobile first, because the\
    \ “default” styles—that is, those not inside media queries—are really designed\
    \ for larger devices. So let’s do some rearranging and refactoring to make the\
    \ design mobile first. This won’t involve too much work.\n\nMake the following\
    \ changes to the classes outside of the media queries:\n\n```css\naside {\n  \
    \  display: none;\n}\n\nsection.showslisting {\n    margin-bottom: 25px;\n   \
    \ width: 100%;\n}\n\n.showdescription {\n    display: none;\n}\n```\n\nYou can\
    \ now remove the corresponding classes from inside the `@media only screen and\
    \ (min-width: 320px)` media query.\n\nThat’s it! In essence, all “mobile first”\
    \ means is to make the default styles relevant to mobile devices and older browsers\
    \ that don’t support media queries and add more specific styles (via media queries)\
    \ from there.\n\nThere’s another, more hidden advantage to the mobile first approach.\
    \ While all modern browsers now support media queries, some older versions (Internet\
    \ Explorer 8, for example) don’t, and in this case, the default CSS styles will\
    \ still be loaded.\n\n## The Viewport Meta Element\n\nIn the last section, I covered\
    \ making the demo page mobile first with media queries. If you try the example\
    \ in your desktop browser and resize the window, everything looks as you would\
    \ expect. But if you try it in a mobile browser, or with an emulated mobile browser,\
    \ you'll probably see something like the screenshot below and be disappointed.\
    \ Aren't media queries supposed to make pages better in a mobile browser?\n\n\
    ![](img/bd4041c3e441a42781fa04a5cb5b773b_51_0.png)\n\n40 Jump Start Responsive\
    \ Web Design\n\nMedia queries allow us to set different styles for different screen\
    \ sizes. So, if your desktop browser’s viewport is 1200px wide, any media query\
    \ styles targeting that screen width will apply. If you’re on a mobile device\
    \ with a viewport width of 320px, you’d expect that any styles targeting a 320px\
    \ wide viewport would kick into action. But there’s a very big catch. By default,\
    \ many devices, such as mobile phones and tablets, act as if they have a wider\
    \ screen than they really do.\n\nTo explain what’s going on here, let’s look at\
    \ the iPhone, where this behavior originated. The first iPhone had a screen/viewport\
    \ width of 320px. However, most websites designed for desktops were much wider\
    \ than that. To avoid only seeing the top left corner of these sites on initial\
    \ load, Apple developed the concept of a “virtual viewport” or “layout viewport”.\
    \ Websites were loaded onto this much wider viewport, which was then scaled down\
    \ to fit on the screen. So most sites got rendered on iPhones with tiny text that\
    \ you had to zoom to be able to read.\n\nApple’s virtual viewport was set at 980px,\
    \ so as long as a website was no wider than that, the whole layout would appear\
    \ on screen. Any layouts wider than 980px would still be partly hidden off to\
    \ the right, requiring sideways scrolling. And that’s still the case today. The\
    \ virtual viewport idea has been adopted by other device makers as well, though\
    \ the default width varies.\n\nWhen designing a responsive site, we really don't\
    \ want this default behavior on mobile devices. We want to know that the canvas\
    \ we're working with is the actual screen area of each device. Fortunately, there's\
    \ a simple way to tell these devices not to behave in the default way. All we\
    \ need to do is add a special meta element to the head of each page. Here's a\
    \ typical example:\n\n```html\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n```\n\nAs a general rule, the line above is all you need\
    \ to ensure your media queries do what you expect on mobile devices. The `name`\
    \ attribute specifies that we're targeting the virtual viewport, and the `content`\
    \ attribute specifies how we want the device to behave. In the example above,\
    \ we're specifying that the virtual viewport should match the actual width of\
    \ the screen, and that there should be no zoom applied to the content.\n\nWith\
    \ the viewport declaration in place, you can be sure that media queries targeting\
    \ a device that's 320px wide will actually be recognized by that device.\n\nLet's\
    \ modify our demo site to add a viewport declaration. Add the following `<meta>`\
    \ tag inside your current `<head>` element:\n\n```html\n<head>\n    <meta charset=\"\
    UTF-8\">\n    <title>App Name</title>\n    <link rel=\"stylesheet\" type=\"text/css\"\
    \ media=\"all\"\n          href=\"layout.css\">\n    <meta name=\"viewport\" content=\"\
    width=device-width,\n          initial-scale=1.0\">\n</head>\n```\n\nRefresh the\
    \ page:\n\n42 Jump Start Responsive Web Design\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_54_0.png)\n\
    \n2-11. Demo page with viewport\n\nMuch better!\n\n## The Viewport\n\n**Viewport**\
    \ is an old term in computer graphics to define the (typically rectangular) screen\
    \ area used to render the elements that users see in a browser. When web browsing\
    \ was limited to desktop browsers, the viewport still existed but was rarely changed\
    \ by designers. With the increasing variety of browser dimensions, HTML5 introduced\
    \ a `viewport` attribute to the `meta` element that allowed designers to set and\
    \ manipulate this area.\n\nThe viewport meta element was initially proposed by\
    \ Apple to set the initial state of the page to the correct size and was later\
    \ introduced as part of the HTML5 standard.\n\nGenerally, you set the viewport\
    \ to the width of the current device (with `width=device-width`) and leave the\
    \ content unscaled (with `initial-scale=1.0`).\n\nThe `width` attribute is a pixel\
    \ value, and the `device-width` constant detects the current device width, meaning\
    \ you don't need to handle the myriad sizes that may be available; the meta element\
    \ will take care of it for you. The same applies for different screen orientations:\
    \ changes between landscape and portrait are also handled for you. There's still\
    \ a lot more work needed to make a design fully responsive, but media queries\
    \ plus this viewport setting give you a fantastic start.\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_55_0.png)\n\
    \n44 Jump Start Responsive Web Design\n\nThe `content` attribute of the tag also\
    \ accepts standard methods for setting the width. For example:\n\n```html\n<head>\n\
    \    ...\n    <meta name=\"viewport\" content=\"width=500,\n    initial-scale=1.0\"\
    >\n    ...\n</head>\n```\n\nWhich will result in:\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_57_0.png)\n\
    \nThis is still a better result than a page without the viewport, but as you can\
    \ see, if the page content is wider than the width you define, it will continue\
    \ anyway. One use case for setting a manual width is if you're certain of screen\
    \ dimensions, and certain that your page content will fit perfectly—for example,\
    \ if you're only targeting one device, like an eReader, or kiosk application.\n\
    \nThere are other, less frequently used attributes for the viewport meta element\
    \ that have limited use, but which you might need for more fine-grained control\
    \ over your page layout:"
  mdcn: "\n## 移动优先\n\n在第一章中，我介绍了“移动优先”的概念。目前，该页面能在不同设备尺寸上正常显示，但并非移动优先，因为其“默认”样式——即那些未包含在媒体查询中的样式——实际上是为更大屏幕设备设计的。因此，让我们进行一些重构和调整，使其符合移动优先的设计理念。这不会涉及太多工作量。\n\
    \n请对媒体查询之外的类进行如下更改：\n\n```css\naside {\n    display: none;\n}\n\nsection.showslisting\
    \ {\n    margin-bottom: 25px;\n    width: 100%;\n}\n\n.showdescription {\n   \
    \ display: none;\n}\n```\n\n现在，你可以从 `@media only screen and (min-width: 320px)`\
    \ 媒体查询内部移除对应的类了。\n\n就是如此！本质上，“移动优先”意味着让默认样式适用于移动设备以及不支持媒体查询的老旧浏览器，然后在此基础上通过媒体查询添加更具体的样式。\n\
    \n移动优先方法还有另一个更隐蔽的优势。虽然现在所有现代浏览器都支持媒体查询，但一些较旧的版本（例如 Internet Explorer 8）并不支持，在这种情况下，默认的\
    \ CSS 样式仍然会被加载。\n\n## 视口元元素\n\n在上一节中，我介绍了如何使用媒体查询使演示页面实现移动优先。如果你在桌面浏览器中尝试该示例并调整窗口大小，一切看起来都如预期所示。但如果你在移动浏览器中，或使用模拟的移动浏览器来尝试，你可能会看到如下截图所示的效果，并感到失望。媒体查询不是应该让页面在移动浏览器中表现更好吗？\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_51_0.png)\n\n40 快速上手响应式网页设计\n\n媒体查询允许我们为不同的屏幕尺寸设置不同的样式。因此，如果你的桌面浏览器视口宽度是\
    \ 1200px，任何针对该屏幕宽度的媒体查询样式都会生效。如果你在视口宽度为 320px 的移动设备上，你会期望任何针对 320px 宽视口的样式都会生效。但这里有一个很大的陷阱。默认情况下，许多设备，如手机和平板电脑，会表现得好像它们拥有比实际更宽的屏幕。\n\
    \n为了解释这里发生的情况，让我们看看这种行为的起源地——iPhone。第一代 iPhone 的屏幕/视口宽度是 320px。然而，大多数为桌面设计的网站宽度远大于此。为了不让用户在加载时只能看到这些网站的左上角，苹果公司开发了“虚拟视口”或“布局视口”的概念。网站被加载到一个更宽的视口中，然后缩小以适应屏幕。因此，大多数网站在\
    \ iPhone 上渲染时文字非常小，需要缩放才能阅读。\n\n苹果的虚拟视口设置为 980px，所以只要网站宽度不超过 980px，整个布局就会出现在屏幕上。任何宽于\
    \ 980px 的布局仍会部分隐藏在右侧，需要横向滚动。这种情况至今依然如此。虚拟视口的概念也被其他设备制造商采纳，尽管默认宽度各不相同。\n\n在设计响应式网站时，我们真的不希望移动设备上出现这种默认行为。我们希望知道我们工作的画布是每个设备的实际屏幕区域。幸运的是，有一个简单的方法可以告诉这些设备不要按默认方式工作。我们只需要在每个页面的\
    \ `<head>` 中添加一个特殊的元元素。这里有一个典型的例子：\n\n```html\n<meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n```\n\n一般来说，上面这一行代码就是确保你的媒体查询在移动设备上按预期工作的全部所需。`name`\
    \ 属性指定我们针对的是虚拟视口，`content` 属性指定我们希望设备如何工作。在上面的例子中，我们指定虚拟视口应与屏幕的实际宽度匹配，并且内容不应被缩放。\n\
    \n有了视口声明，你可以确信针对 320px 宽设备的媒体查询将被该设备正确识别。\n\n让我们修改我们的演示站点以添加视口声明。在你当前的 `<head>`\
    \ 元素内添加以下 `<meta>` 标签：\n\n```html\n<head>\n    <meta charset=\"UTF-8\">\n    <title>App\
    \ Name</title>\n    <link rel=\"stylesheet\" type=\"text/css\" media=\"all\"\n\
    \          href=\"layout.css\">\n    <meta name=\"viewport\" content=\"width=device-width,\n\
    \          initial-scale=1.0\">\n</head>\n```\n\n刷新页面：\n\n42 快速上手响应式网页设计\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_54_0.png)\n\
    \n2-11. 带视口的演示页面\n\n效果好多了！\n\n## 视口\n\n**视口** 是计算机图形学中的一个旧术语，用于定义（通常是矩形的）屏幕区域，该区域用于渲染用户在浏览器中看到的元素。当网页浏览仅限于桌面浏览器时，视口仍然存在，但设计师很少改变它。随着浏览器尺寸的日益多样化，HTML5\
    \ 在 `meta` 元素中引入了一个 `viewport` 属性，允许设计师设置和操作这个区域。\n\n视口元元素最初由苹果提出，用于将页面的初始状态设置为正确的尺寸，后来作为\
    \ HTML5 标准的一部分被引入。\n\n通常，你将视口设置为当前设备的宽度（使用 `width=device-width`），并保持内容不缩放（使用 `initial-scale=1.0`）。\n\
    \n`width` 属性是一个像素值，`device-width` 常量检测当前设备宽度，这意味着你不需要处理可能出现的无数种尺寸；元元素会为你处理好。对于不同的屏幕方向也是如此：横屏和竖屏之间的切换也会为你处理好。要使设计完全实现响应式，仍然需要做很多工作，但媒体查询加上这个视口设置为你提供了一个极好的开端。\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_55_0.png)\n\n44 快速上手响应式网页设计\n\n标签的\
    \ `content` 属性也接受用于设置宽度的标准方法。例如：\n\n```html\n<head>\n    ...\n    <meta name=\"\
    viewport\" content=\"width=500,\n    initial-scale=1.0\">\n    ...\n</head>\n\
    ```\n\n这将导致：\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_57_0.png)\n\n这仍然是一个比没有视口的页面更好的结果，但如你所见，如果页面内容宽度超过你定义的宽度，它仍会继续扩展。设置手动宽度的一个用例是，当你确定屏幕尺寸，并且确定页面内容会完美适配时——例如，如果你只针对一种设备，如电子阅读器或信息亭应用程序。\n\
    \n视口元元素还有其他不常用的属性，其用途有限，但当你需要对页面布局进行更精细的控制时可能需要用到：\n"
