    \ grid) without too much effort, and that works in a similar way to our custom\
    \ grid. Bootstrap also has a lot of other styles available for handling images,\
    \ determining what grid elements to display at different grid sizes, and much,\
    \ much more.\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_93_0.png)\n\nIf you're\
    \ interested in learning more about Bootstrap, I recommend SitePoint's [Jump Start\
    \ Bootstrap](#).\n\n## Foundation\n\n[Foundation](#) was created in 2011 by Zurb\
