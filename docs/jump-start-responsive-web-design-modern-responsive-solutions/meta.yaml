  md: "```\n@media grid {\n    ...\n}\n```\n\nAs you can see, through combinations\
    \ of dimension- and feature-based queries, you can construct complex stylesheets\
    \ to target a multitude of devices effectively with styles that work most efficiently\
    \ for them. This is the main point of media queries: they allow you to selectively\
    \ load CSS styles for particular device configurations.\n\n# Streamlining the\
    \ Example App\n\nNow that you have a basic understanding, let's continue to build\
    \ upon the media queries added earlier to make the example site tidier.\n\nFirst,\
    \ you can consolidate the queries already written, moving the classes into two\
    \ groups of media queries:\n\n```\n/* Media Queries */\n/* For example, desktop\
    \ devices */\n@media screen and (min-width: 680px) {\n    aside {\n        width:\
    \ 33%;\n    }\n\n    section.showslisting {\n        width: 66%;\n    }\n}\n\n\
    /* For example, medium-width screens or smaller screens in landscape */\n@media\
    \ screen and (max-width: 680px), screen and (orientation: landscape) and (max-width:\
    \ 750px) {\n    aside {\n        display: none;\n    }\n}\n```"
  merge: -1
