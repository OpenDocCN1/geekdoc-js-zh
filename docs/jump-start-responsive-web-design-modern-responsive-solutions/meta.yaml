  md: "```\nsection.showslisting {\n    width: 100%;\n}\n}\n```\n\nMuch tidier! You\
    \ can keep adding new styles for each query into these sections.\n\nLet's look\
    \ back to our demo site specification outlined in [Chapter 1] for what else needs\
    \ to be optimized for each screen size. The next step will be hiding the TV show\
    \ description on small screens, and shorten it on medium-sized screens.\n\nIt\
    \ would be a lot easier to do this if the description text had a class, so add\
    \ one to each instance of the p tag that contains the show description:\n\n```\n\
    <section class=\"tvshow\">\n    <h3>Show</h3>\n    <img src=\"http://placehold.it/350x150\"\
    \n    class=\"thumbnail\">\n    <p class=\"showdescription\">Lorem ipsum dolor\
    \ sit amet,\n    consectetur adipiscing elit.</p>\n</section>\n```\n\nLet's add\
    \ new media queries to accommodate the various sizes we aim to support, and, in\
    \ doing so, tidy up the existing ones.\n\nThe specific widths at which we want\
    \ our design to reflow are known as **breakpoints**. The breakpoints we'll add\
    \ are not exhaustive: there's a huge range of device sizes, and more are appearing\
    \ all the time, so it's futile to try to target each device with separate queries.\
    \ A better approach is to assess the points at which your design needs to reflow,\
    \ and then create media queries for those breakpoints. This is the beauty of responsive\
    \ web design: you can ensure that each device will get an appropriate layout without\
    \ having to design separately for each device.\n\nAdd the following breakpoints\
    \ and refactor our existing styles into them:"
