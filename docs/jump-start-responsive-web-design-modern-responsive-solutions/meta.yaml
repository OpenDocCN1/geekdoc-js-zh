    \ The current desktop version of the site\n\nAnd the code:\n\n```html\n<body>\n\
    <header><h1>Site Name</h1></header>\n\n<nav>...</nav>\n\n<main>\n    <section>...</section>\n\
    \    <aside>...</aside>\n</main>\n\n<footer>...</footer>\n\n</body>\n</html>\n\
    ```\n\nHere's where the HTML elements are on the page:\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_27_0.png)\n\
    \nHere are the functions they perform:\n\n- A header element is used for the site\
    \ name, logo etc. Other sections of the page can also have their own header element.\n\
    - A nav element is used for navigation links, such as a top, side or footer menu.\n\
    \n## 16 Jump Start Responsive Web Design\n\n- A `section` element is used to contain\
    \ the main content of an article or a significant area of a page.\n- An `aside`\
    \ element defines a small sub-section that relates to a main section.\n- A `main`\
    \ element wraps other elements unique to the page. In our example, these are the\
    \ `section` and `aside` elements. The other elements will repeat across other\
    \ pages.\n- A `footer` element is used for the site's legal name, dates etc. Other\
    \ sections of the page can also have their own `footer` element.\n\nThe HTML5\
    \ specification lists other semantic elements that perform specific functions,\
    \ and we'll cover many of them in this book. A well-structured page is very important\
    \ for responsive design, and also helps with accessibility and SEO.\n\nHere's\
    \ more page content organized in a semantic way:\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_28_0.png)\n\
    \n1-12. The TV Shows page\n\nFirst, I've added a heading for the page, which is\
