- md: "## Battery Level\n\nThe HTML5 Battery Status API allows you to check the current\
    \ battery level of a device and respond accordingly.\n\n> **Security Concerns**\n\
    > There have been recent security concerns surrounding the Battery Status API,\
    \ so read the W3C specification for news on its future.\n\nMobile devices (and\
    \ laptops) are prone to running out of battery power just when you need it, so\
    \ for this (mostly illustrative) example, let’s help our users by noticing when\
    \ their battery level is low and making the page less consumptive.\n\nDarker colors\
    \ *can* help reduce the battery impact on certain device screens (especially AMOLED\
    \ screens), so the colors for the page are already reasonably battery friendly,\
    \ but let’s see how we can react to the battery level.\n\nA JavaScript method\
    \ is available to get a variety of information about a device’s battery.\n\nAdd\
    \ the following code inside the `index.js` file to check if the browser supports\
    \ the feature. If it does, then get the battery level, which is a value between\
    \ 0 (empty) and 1 (full):\n\n```javascript\nnavigator.getBattery().then(function\
    \ (battery) {\n    var level = battery.level;\n    console.log(level);\n});\n\
    ```\n\nIf it’s less than 20% (0.2), add a CSS class that reduces color brightness,\
    \ and remove images from the DOM (since loading and displaying images can impact\
    \ battery life, and every little bit helps):\n\n```javascript\nif (level < 0.2)\
    \ {\n    body = document.getElementsByName('body');\n    body.classList.add('battery-save');\n\
    \    images = document.getElementsByName('img');\n    var i;\n    for (i = 0;\
    \ i < images.length; i++) {\n        images[i].remove();\n    }\n}\n```\n\nAdd\
    \ the new battery-save styling to your CSS, reducing the brightness of the page\
    \ text:\n\n```css\n.battery-save {\n    color: gray;\n}\n```\n\nWhether color\
    \ schemes actually save battery life is a controversial topic that depends a lot\
    \ on the device screen, but it might be worth experimenting. Other, more definite\
    \ ideas for helping users save battery are:\n\n- reducing network calls and traffic\n\
    - reducing animations and effects\n- reducing the amount of client-side processing\
    \ by removing less essential JavaScript.\n\nAlthough we removed images from the\
    \ DOM with JavaScript, they’re still loaded before being hidden. This contradicts\
    \ the maxim of reducing network calls. As JavaScript only allows you to change\
    \ an already existing page structure, you need to change what gets delivered to\
    \ the browser in the first place. To make this work, you need to rethink the page\
    \ structure to make it more mobile friendly.\n\nAdd classes to the current HTML\
    \ to identify each TV show:\n\n```html\n<section class=\"show1\">\n    ...\n</section>\n\
    <section class=\"show2\">\n    ...\n</section>\n```\n\nNow remove all the `picture`\
    \ and `video` tags from each `tvshow` section, massively reducing the HTML file.\
    \ Back in `index.js`, replace what is already there with the following code, which\
    \ takes concepts we've already used in previous chapters (clicking the image for\
    \ a video) and consolidates it:\n\n### 6-2. Chapter6/battery_mobile_first/index.js\n\
    \n```javascript\nwindow.addEventListener(\"load\",function(event) {\n    navigator.getBattery().then(function\
    \ (battery) {\n        // Get the battery level, and load images if enough\n \
    \       var level = battery.level;\n        if (level > 0.2) {\n            //\
    \ Find all 'tvshow' divs and loop through them all\n            tvShows = document.getElementsByClassName('tvshow');\n\
    \            var i;\n            for (i = 0; i < tvShows.length; i++) {\n    \
    \            tvShow = tvShows[i];\n                // Get the show name\n    \
    \            showName = tvShow.classList[1];\n                // Create a picture\
    \ element\n                var newPictureNode = document.createElement(\"picture\"\
    );\n                // Set the source and classes for the picture, the code is\n\
    \                // identical to earlier examples, but the show name is passed\
    \ to\n                // generate for each show\n                var pictureInnerHTML\
    \ = '<source srcset=\"../images/' + showName + '-small.jpg\" media=\"(max-width:\
    \ 320px)\" class=\"thumbnail\"><source srcset=\"../images/' + showName + '-medium.jpg\"\
    \ media=\"((min-width: 320px) and (max-width: 480px))\" class=\"thumbnail\"><source\
    \ srcset=\"../images/' + showName + '-large.jpg\" media=\"(min-width: 480px)\"\
    \ class=\"thumbnail\"><img src=\"../images/' + showName + '-medium.jpg\" class=\"\
    thumbnail\">';\n                newPictureNode.innerHTML = pictureInnerHTML;\n\
    \                // Add an event listener to the picture\n                newPictureNode.addEventListener('click',\n\
    \                    toggle_visibility, false);\n\n                // Also generate\
    \ the video HTML in the same way\n                var newVideoNode = document.createElement(\"\
