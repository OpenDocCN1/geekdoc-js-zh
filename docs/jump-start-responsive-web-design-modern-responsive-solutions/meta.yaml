    @media only screen and (min-width: 768px) {\n    .showdescription {\n        text-overflow:\
    \ ellipsis;\n        display: block;\n        white-space: nowrap;\n        width:\
    \ 100px;\n        overflow: hidden;\n    }\n}\n\n/* For example, typical desktop\
