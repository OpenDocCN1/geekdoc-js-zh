  md: '# Read On


    In this chapter, I''ve introduced typographical concepts that are relevant to
    responsive design, and I''ve shown how they are represented in CSS. I''ve also
    covered the different sizing units that you can use to set these properties, and
    how to make important text on your pages readable. In the next chapter, I''ll
    look at how to do the same with the rest of your page content, such as images
    and videos.'
