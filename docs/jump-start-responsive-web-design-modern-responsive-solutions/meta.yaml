  md: "![](img/bd4041c3e441a42781fa04a5cb5b773b_155_0.png)\n\n6-6. Setting low contrast\
    \ for a dark setting\n\nRapid transitions between color schemes are disconcerting\
    \ to users, so to make this less harsh, add the following CSS to the body element\
    \ that eases the transitions between colors:\n\n```\nbody {\n    -webkit-transition:\
    \ all 0.5s ease-in-out;\n    -moz-transition: all 0.5s ease-in-out;\n    -o-transition:\
    \ all 0.5s ease-in-out;\n    transition: all 0.5s ease-in-out;\n}\n```\n\n# Vibration\n\
    \nAnother W3C innovation is the [Vibration API](https://www.w3.org/TR/vibration/),\
    \ which provides access to a mobile device's vibration mechanism to provide tactile\
    \ feedback. We could use this to add a more immersive experience to video playback\
    \ by adding vibration to a soundtrack, but it would require a lot of work. There\
    \ are other uses for this API that are handy for accessibility. For example, it\
    \ can be useful if a device vibrates slightly when a button is tapped, letting\
    \ the user know the action was detected."
  merge: -1
  pgno: 155
- img_proc: true
  md: '# # Device Orientation


    We''ve already seen how to detect and react to device orientation with media queries,
    but we could also react dynamically to device orientation. For example, we could
    switch a video file to a format more suitable for a landscape or portrait video.


    If you want to get more experimental, what about controlling playback of a video
    based on the orientation of a device? For example, if a user tilts their phone
    in one direction, we could pause the video, and vice versa.


    For this example, we''ll create a new, simplified version of the page that''s
    purely for playing one video.


    Here''s the HTML:'
