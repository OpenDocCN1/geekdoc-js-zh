- md: "# Preface\n\nThe pixel-perfect web is dead. The days of positioning elements\
    \ on a web page and expecting them to always display how we wanted are a distant\
    \ memory; we now cope with the constant barrage of new and varied devices that\
    \ our designs need to look fantastic on.\n\nThis book aims to get you started\
    \ understanding and using the suite of CSS and HTML tools for responding to this\
    \ new world of devices. It will introduce you to the building blocks that help\
    \ your pages adapt to different devices, take this a step further with grids,\
    \ show you how to make text and images readable on all devices, and, in the final\
    \ chapter, cover how to utilize more esoteric device capabilities.\n\nLet's get\
    \ started.\n\n# Who Should Read This Book\n\nThis book is for web designers and\
    \ front-end developers. You'll need to be familiar with HTML and CSS, but no previous\
    \ responsive web design experience is required. Some JavaScript familiarity is\
    \ useful for the latter parts of the book.\n\n# Conventions Used\n\nYou'll notice\
    \ that we've used certain typographic and layout styles throughout this book to\
    \ signify different types of information. Look out for the following items.\n\n\
    # Code Samples\n\nCode in this book is displayed using a fixed-width font, like\
    \ so:\n\n```\n<h1>A Perfect Summer's Day</h1>\n<p>It was a lovely day for a walk\
    \ in the park. The\nbirds were singing and the kids were all back at\nschool.</p>\n\
    ```\n\nIf the code is to be found in the book's code archive, the name of the\
    \ file will appear at the top of the program listing, like this:\n\n```\n0-1.\
    \ example.css\n\n.footer {\n    background-color: #CCC;\n    border-top: 1px solid\
    \ #333;\n}\n```\n\nIf only part of the file is displayed, this is indicated by\
    \ the word *excerpt*:\n\n```\n0-2. example.css (excerpt)\n\n.footer {\n    background-color:\
    \ #CCC;\n    border-top: 1px solid #333;\n}\n```\n\nIf additional code is to be\
    \ inserted into an existing example, the new code will be displayed in bold:\n\
    \n```\nfunction animate() {\n    new_variable = \"Hello\";\n}\n```\n\nWhere existing\
    \ code is required for context, rather than repeat all of it, `...` will be displayed:\n\
    \n```\nfunction animate() {\n    ...\n    new_variable = \"Hello\";\n}\n```\n\n\
    Some lines of code should be entered on one line, but we've had to wrap them because\
    \ of page constraints. An ⏎ indicates a line break that exists for formatting\
    \ purposes only, and should be ignored:\n\n```\nURL.open(\"http://www.sitepoint.com/responsive-web-design-real\
    \ ⏎ -user-testing/?responsive1\");\n```\n\n# Tips, Notes, and Warnings\n\n**Hey,\
    \ You!**\n\nTips provide helpful little pointers.\n\n**Ahem, Excuse Me ...**\n\
    \nNotes are useful asides that are related—but not critical—to the topic at hand.\
    \ Think of them as extra tidbits of information.\n\n**Make Sure You Always ...**\n\
    \n... pay attention to these important points.\n\n**Watch Out!**\n\nWarnings highlight\
    \ any gotchas that are likely to trip you up along the way.\n\n# Supplementary\
    \ Materials\n\n- The book's code archive contains downloadable code and sample\
    \ videos to accompany the examples presented.\n- https://www.sitepoint.com/community/\
    \ are SitePoint's forums, for help on any tricky web problems.\n- **books@sitepoint.com**\
    \ is our email address, should you need to contact us to report a problem, or\
    \ for any other reason.\n\n# Chapter 1\n\n## The Meaning and Purpose of Responsive\
    \ Web Design\n\nIt used to be so simple: you’d design a website or application\
    \ for a 15-inch monitor, and—incompatibilities between browsers aside—you were\
    \ done.\n\nThen mobile phones with web browsers came along and ruined our easy\
    \ lives. Worst of all, people loved browsing the Web on them!\n\n> **The Rise\
    \ of Mobile**\n>\n> In 2016, browsing the web on mobile devices [overtook desktop\
    \ browsing](https://example.com) for the first time.\n\nJust as developers and\
    \ designers got used to building websites for phones, along came tablets, watches,\
    \ TVs, cars, glasses, larger desktop screens, high-resolution screens, and even\
    \ web browsers built into walls. (Okay, I made that last one up.) Supporting this\
    \ seemingly endless stream of new devices is becoming ever more challenging.\n\
    \nSo how do we support this ever-increasing array of devices? The answer is *responsive\
    \ web design*, which harnesses technologies that allow websites to adapt to screens\
    \ of all sizes.\n\nA lot of older sites, or projects maintained by people with\
    \ little spare time, are unresponsive. For example, the site for the Vassal game\
    \ engine:\n\n![1-3. The Vassal website is unresponsive](img/bd4041c3e441a42781fa04a5cb5b773b_14_0.png)\n\
    \nMany other sites, like SitePoint.com, are fully responsive:\n\n![1–4. SitePoint.com\
    \ is responsive, valuing readers on all devices](img/bd4041c3e441a42781fa04a5cb5b773b_15_0.png)\n\
    \n**Responsive web design** (RWD) subscribes to the popular development maxim\
    \ “Don’t Repeat Yourself” (usually abbreviated to “DRY”). Instead of maintaining\
    \ multiple codebases for each device that you wish to support, RWD aims to use\
    \ a single codebase that adapts appropriately to each device. Using RWD techniques,\
    \ you write one set of HTML, CSS, and JavaScript, and display elements appropriately\
    \ for each platform. Many of these styles and elements can even be reused or built\
    \ upon for maximum code efficiency.\n\nSound good to you? To begin, let's go back\
    \ in time a few years.\n\n# History\n\n“Responsive” design is not necessarily\
    \ new and is a term that can mean different things to different people, making\
    \ its exact history hard to track down.\n\nIn theory, developers have been creating\
    \ responsive designs since there was more than one browser. Browsers have always\
    \ had subtle (and not so subtle) rendering differences between them, and developers\
    \ have been learning how to cope with these quirks for decades. If you're new(er)\
    \ to web development, be thankful the dominance of Internet Explorer's earlier\
    \ versions is mostly over. The days of dealing with their quirks were dark.\n\n\
    Since 2004, responsive design has adopted the more specific meaning of adapting\
    \ your designs to suit a user's device of choice—typically based on screen size,\
    \ but also other capabilities. The concepts for responsive design solidified in\
    \ 2008, but the term is also referred to as “flexible”, “liquid”, “fluid”, and\
    \ “elastic” design.\n\nIt was the inclusion of media queries in the CSS3 specification\
    \ that fully gave responsive design the potential it needed to be a genuine and\
    \ more usable concept. We'll cover media queries in detail in [Chapter 2](#chapter-2),\
    \ but in summary, they allow you to change what you show in a web page based on\
    \ pre-defined screen sizes or types. Ethan Marcotte formally coined the term “responsive\
    \ web design” [in an article for A List Apart](#a-list-apart) in 2010.\n\nThis\
    \ led to a growth and consolidation of other techniques and technologies alongside\
    \ media queries, such as flexible images and grids, all of which we'll cover in\
    \ this book.\n\nTo me, “responsive design” is something of a combination of all\
    \ these ideas and principles. It's not just adapting a design to screen sizes,\
    \ but also to other factors such as color depth, media type (say, a laptop screen,\
    \ or an eReader), or location.\n\n## Schools of Thought Within Responsive Design\n\
    \nThere are as many schools of thought about how to use responsive design as there\
    \ are interpretations of it. Some have come and gone, and others have stuck. We\
    \ won’t cover any in detail explicitly in this book, but we’ll touch upon their\
    \ practical applications. Let’s quickly cover a few of them now.\n\n### Progressive\
    \ Enhancement\n\nWhen following the more traditional principle of **progressive\
    \ enhancement**, your primary focus is on making the site content available to\
    \ all users, however simple their device or slow their connection. Then extra\
    \ features—such as more sophisticated design and functionality—are added for devices\
