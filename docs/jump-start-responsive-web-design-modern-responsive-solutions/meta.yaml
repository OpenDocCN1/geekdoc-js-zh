    # Geolocation


    The [HTML5 Geolocation API](https://www.w3.org/TR/geolocation-api/) allows you
    to detect the rough latitude and longitude of a user''s current location.


    As well as providing great video content, RWDFlix also likes to recommend shows
    that may interest a user. This example will use the current location of the user
    to highlight shows that contain content about that location.


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_147_0.png)


    6-3. Shows highlighted that match user location


    In `index.js`, replace the existing contents of the file with the following code
    that checks if the browser supports geolocation, informing the user if it doesn''t:'
- md: "window.addEventListener(\"load\", function(event) {\n    if (\"geolocation\"\
    \ in navigator) {\n\n    } else {\n        alert(\"RWDFlix uses geolocation to\
    \ recommend shows that may be relevant to you.\")\n    }\n}, false);\n\nIf the\
    \ browser does support geolocation, get the current position of the user and pass\
    \ the values to a new function:\n\n```javascript\nif (\"geolocation\" in navigator)\
    \ {\n    navigator.geolocation.getCurrentPosition(getPosition);\n} else {\n  \
    \  alert(\"RWDFlix uses geolocation to recommend shows that may be relevant to\
    \ you.\")\n}\n```\n\nThe API method returns the current latitude and longitude,\
    \ which is not that useful to us, as we really want to know the current country\
    \ of a user. Use the [Google Maps API](http://googleapis.com/) to turn it into\
    \ a more useful country code:\n\n```javascript\nfunction getPosition(position)\
    \ {\n    // Define the URL with the current latitude and longitude\n    var url\
    \ =\n    \"http://maps.googleapis.com/maps/api/geocode/json?latlng=\" +\n    position.coords.latitude\
    \ + \",\" + position.coords.longitude +\n    \"&sensor=false\";\n    // Create\
    \ a request and send the URL\n    var xmlhttp = new XMLHttpRequest();\n    xmlhttp.open(\"\
    GET\", url, true);\n    xmlhttp.send();\n    // When the request returns, process\
    \ the response\n    xmlhttp.addEventListener(\"readystatechange\", processRequest,\n\
    \    false);\n}\n```\n\nNow that we have a result from Google Maps, we can process\
    \ the results. We need to find the array that contains the country value, and\
    \ then highlight TV shows that match that country in a similar way to the time\
    \ example:\n\n```javascript\nfunction processRequest() {\n    // Is the response\
    \ OK?\n    if (this.readyState == 4 && this.status == 200) {\n        // Parse\
    \ the JSON response\n        var myArr = JSON.parse(this.responseText);\n    \
    \    var i;\n        for (i = 0; i < myArr.results.length; i++) {\n          \
    \  // Loop through the array of results and find the element we\n            //\
    \ want, then continue when we find it\n            if (myArr.results[i].types[0]\
    \ == \"country\") {\n                country = myArr.results[i].formatted_address;\n\
    \                tvShows = document.getElementsByClassName('tvshow');\n      \
    \          var j;\n                // Loop through TV Shows and highlight any\
    \ that match this\n                // value\n                for (j = 0; j < tvShows.length;\
    \ j++) {\n                    tvShow = tvShows[j];\n                    if (tvShow.classList[1]\
    \ == country ||\n                        tvShow.classList[2] == country) {\n \
    \                       tvShows[j].classList.add('highlight')\n              \
    \      }\n                }\n            }\n        }\n    }\n}\n```\n\n## Modifying\
    \ the HTML\n\nI added country classes to the `tvshow` sections. Go ahead and add\
    \ some of your own before running this example. They need to begin with a capital\
    \ letter.\n\n## Based on Network\n\nThe example site is a video site, and while\
    \ we currently have the clickable images allowing a viewer to only load a video\
    \ file when they wish too, we could make this more flexible based on the device's\
    \ network connection. Or even better, we could create a preference that users\
    \ can set if they want this feature.\n\nThe Network Information API is not widely\
    \ supported (currently only Chrome on Android), but browser manufacturers move\
    \ quickly, so it may be better supported by the time you decide to implement it.\n\
    \nFirst, the easiest (and most supported) check is to see if the user is online\
    \ at all:\n\n```javascript\nif (navigator.onLine) {\n    // Do something\n}\n\
    ```\n\nGranted, this has limited use in the example, unless you want to check\
    \ if the user has become disconnected before attempting to play a video. Still,\
    \ it's a good idea to cover all bases.\n\nWhile the Network Information API lets\
    \ you check all sorts of values, it's not much use right now. There are third-party\
    \ (paid) services for checking internet speeds, but currently, the “best” solution\
    \ is using complex code to check how long an image takes to load, and calculate\
    \ speed from that. I won't reproduce it here, but if you're interested, there's\
    \ some helpful information on Stack Overflow.\n\n### Browser Support\nWhile the\
    \ Network Information API is still in a draft state, it's an active proposal,\
    \ so by the time of reading it may be better supported. You can find out its current\
    \ status on the API's community group site.\n\n## User Preference\n\nYou have\
    \ likely experienced **cookies** in your day-to-day web browsing. Cookies are\
    \ typically used to retain state such as preferences. They can be set or read\
    \ by the client or server and are transmitted within every HTTP request. This\
    \ example will read user preferences and display page elements accordingly.\n\n\
    Often the browser will write a cookie when a user submits a form or undertakes\
    \ some other action. For this example, we'll write a setting manually:\n\n```javascript\n\
    window.addEventListener(\"load\",function(event) {\n    document.cookie = \"mature=no\"\
    ;\n    ...\n},false);\n```\n\nThis determines if the user wants to see videos\
    \ considered \"mature\" content. Using this value, we can use the same technique\
    \ for selectively rendering TV shows.\n\nTo test, add the `mature` class to the\
    \ end of the class list of a couple of the `tvshow` sections, and add `all-ages`\
