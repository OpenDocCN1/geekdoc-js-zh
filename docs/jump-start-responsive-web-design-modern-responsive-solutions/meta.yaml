    # What Is a Grid?\n\nBefore you restructure the page into a fluid grid, let's\
    \ take a quick aside to discuss what a grid is."
  merge: -1
  pgno: 65
- img_proc: true
  md: 'A **grid** is a series of columns and rows. But how many rows and columns do
    you need for your site? The number of rows is more clear: it''s as many as you
    need to fit your header, navigation, content, footer etc. What about columns?
    Well, as with other topics in this book (and technology generally), there are
    different opinions on this. It''s typically an even number, because this makes
    it easier to divide the page. Numbers divisible by three are most used. (If you''re
    interested in knowing why, [the Wikipedia article on the golden ratio](https://en.wikipedia.org/wiki/Golden_ratio)
    provides a nice explanation). Popular column values are 12, 16 and 24, but I''ll
    focus on the 12-column grid system here. 12 is popular, as it can be divided into
    a variety of commonly used sizes, such as a half, a third, and a quarter.


    # Creating Your Own Grid


    You may be wondering how a 12-column layout helps you create a 3-column layout
    like our example page—and yes, it''s confusing at first.


    The columns are more used as structural underpinnings, and through CSS you define
    how many columns you want your elements to span. To make this clearer, here''s
    an example of the 12-column 1180px grid:'
  merge: -1
  pgno: 66
- img_proc: true
  md: '![](img/bd4041c3e441a42781fa04a5cb5b773b_67_0.png)


    3-7. A 12-column, 1180px grid


    And here''s how the grid will represent this page (yes, grids within grids, or
    “nested grids”, are okay):'
