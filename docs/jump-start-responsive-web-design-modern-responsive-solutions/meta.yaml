  md: '# 56 Jump Start Responsive Web Design


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_68_0.png)


    3–8. The page as a grid


    You could set up all these columns and grids manually for each project, but it''s
    a much better idea to make something more usable and reusable. We''re going to
    create a lot of new styles and changes to our HTML and CSS files now. Then I''ll
    show easier ways to achieve the same result. Sometimes it''s a good idea to learn
    the hard way before knowing how to make it easier.


    Set up the base styles for the columns and rows, and replace any existing matching
    classes:'
  merge: -1
  pgno: 68
- img_proc: true
  md: "```\n3-9. Chapter3/vanilla_final/layout.css (excerpt)\n\n.row,\n.column {\n\
    \    box-sizing: border-box;\n}\n\n.row:before,\n.row:after {\n    content: \"\
    \ \";\n    display: table;\n}\n\n.row:after {\n    clear: both;\n}\n\n.column\
    \ {\n    position: relative;\n    float: left;\n}\n\n.column + .column {\n   \
    \ margin-left: 1.6%;\n}\n```\n\n**Using the Adjacent Sibling Selector**\n\nThe\
    \ adjacent sibling selector (+) above is a useful CSS trick that adds a margin\
    \ only to the matching element following another matching element. In our case,\
    \ it means that the first column won't have a left margin.\n\nThe first step is\
    \ to define the width of one column, not forgetting the margin between each column.\n\
    \nA single column width is equal to 100 (as we're working with percentages) minus\
    \ the margin value, multiplied by the number of columns minus 1 (you don't need\
    \ a left margin in the first column), all divided by the number of columns."
  merge: -1
  pgno: 69
- img_proc: true
  md: 'If you prefer to look at formulas:


    ```

    SingleColumnWidth = (100 - (MarginValue * (NumberOfColumns - 1))) / NumberOfColumns

    ```


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_70_0.png)


    This should give the nice, memorable result of 6.866666666667% ... but don''t
    worry: a number like this is what''s expected, and after the initial setup, you
    won''t need to remember these values.


    Next, apply this number into a new formula for each of the columns. You want to
    know the width values of column *spans*—that is, how to spread content across
    more than one column.


    A column width is equal to the `SingleColumnWidth` value multiplied by the current
    column, added to the margin value multiplied by the number of columns minus 1.


    Or as a formula:'
  merge: -1
  pgno: 70
- img_proc: true
  md: "```\nColumnWidth = (SingleColumnWidth * CurrentColumn) +\n\t (MarginValue *\
    \ (CurrentColumn - 1))\n```\n\nAs an example. here's how to find the value required\
    \ to span two columns:\n\n```\n(SingleColumnWidth * CurrentColumn)\n6.86666666667\
    \ * 2 = 13.733333333\n\n(CurrentColumn - 1)\n2 - 1 = 1\n\n(MarginValue * (CurrentColumn\
    \ - 1))\n1.6 * 1 = 1.6\n\n(SingleColumnWidth * CurrentColumn) + (MarginValue *\n\
    \t (CurrentColumn - 1))\n13.733333333 + 1.6 = 15.333333333\n```\n\nThis will result\
    \ in the following column styles, with the column-n class\nrepresenting the number\
    \ of columns you want to span. Add these to layout.css:"
  merge: -1
  pgno: 71
- img_proc: true
  md: "60 Jump Start Responsive Web Design\n\n```\n3-11. Chapter3/vanilla_final/layout.css\
    \ (excerpt)\n\n.column-1 {\n    width: 6.866666666667%;\n}\n\n.column-2 {\n  \
    \  width: 15.3333333333%;\n}\n\n.column-3 {\n    width: 23.8%;\n}\n\n.column-4\
    \ {\n    width: 32.26666666667%;\n}\n\n.column-5 {\n    width: 40.7333333333%;\n\
    }\n\n.column-6 {\n    width: 49.2%;\n}\n\n.column-7 {\n    width: 57.66666666667%;\n\
    }\n\n.column-8 {\n    width: 66.1333333333%;\n}\n\n.column-9 {\n    width: 74.6%;\n\
    }\n\n.column-10 {\n    width: 83.06666666667%;\n}\n```"
  merge: -1
