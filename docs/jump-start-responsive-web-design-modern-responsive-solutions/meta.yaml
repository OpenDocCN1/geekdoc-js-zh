    \n**咳，打扰一下...**\n\n注意是与当前主题相关——但非关键——的有用旁白。把它们当作额外的小信息点。\n\n**确保你总是...**\n\n...留意这些重要要点。\n\
    \n**当心！**\n\n警告突出显示可能在过程中让你绊倒的任何陷阱。\n\n# 补充材料\n\n- 本书的代码存档包含可下载的代码和伴随示例的示例视频。\n\
    - https://www.sitepoint.com/community/ 是 SitePoint 的论坛，可用于解决任何棘手的网页问题。\n- **books@sitepoint.com**\
    \ 是我们的电子邮件地址，如果你需要联系我们报告问题或出于任何其他原因。\n\n# 第 1 章\n\n## 响应式网页设计的含义与目的\n\n过去事情很简单：你为\
    \ 15 英寸显示器设计一个网站或应用程序，然后——除了浏览器之间的不兼容性——就完成了。\n\n然后带有网页浏览器的手机出现了，打破了我们轻松的生活。最糟糕的是，人们喜欢在手机上浏览网页！\n\
    \n> **移动设备的崛起**\n>\n> 2016 年，在移动设备上浏览网页[首次超越了桌面浏览](https://example.com)。\n\n正当开发者和设计师习惯于为手机构建网站时，平板电脑、手表、电视、汽车、眼镜、更大的桌面屏幕、高分辨率屏幕，甚至内置于墙壁的网页浏览器又出现了。（好吧，最后一个是我编的。）支持这看似无穷无尽的新设备流正变得越来越具有挑战性。\n\
    \n那么我们如何支持这日益增多的设备阵列呢？答案是 *响应式网页设计*，它利用使网站能够适应各种屏幕尺寸的技术。\n\n许多较旧的网站，或由时间不多的人维护的项目，都是非响应式的。例如，Vassal\
    \ 游戏引擎的网站：\n\n![1-3. Vassal 网站是非响应式的](img/bd4041c3e441a42781fa04a5cb5b773b_14_0.png)\n\
    \n许多其他网站，如 SitePoint.com，则是完全响应式的：\n\n![1-4. SitePoint.com 是响应式的，重视所有设备上的读者](img/bd4041c3e441a42781fa04a5cb5b773b_15_0.png)\n\
    \n**响应式网页设计** (RWD) 遵循流行的开发准则“不要重复自己”（通常缩写为“DRY”）。RWD 旨在使用单一代码库来适应每种设备，而不是为每个你希望支持的设备维护多个代码库。使用\
    \ RWD 技术，你编写一套 HTML、CSS 和 JavaScript，并为每个平台适当地显示元素。许多样式和元素甚至可以重用或基于此构建，以实现最大的代码效率。\n\
    \n听起来不错？让我们先回到几年前。\n\n# 历史\n\n“响应式”设计不一定是新事物，这个术语对不同的人可能意味着不同的东西，这使得其确切的历史难以追溯。\n\
    \n理论上，自从存在不止一种浏览器以来，开发者就一直在创建响应式设计。浏览器之间一直存在微妙（以及不那么微妙）的渲染差异，开发者们几十年来一直在学习如何处理这些怪癖。如果你是网页开发的新手（或较新手），请庆幸早期版本的\
    \ Internet Explorer 的主导地位已基本结束。处理它们怪癖的日子是黑暗的。\n\n自 2004 年以来，响应式设计采用了更具体的含义，即调整你的设计以适应用户选择的设备——通常基于屏幕尺寸，但也包括其他能力。响应式设计的概念在\
    \ 2008 年得到巩固，但该术语也被称为“弹性”、“流动”、“流体”和“可伸缩”设计。\n\n正是 CSS3 规范中包含的媒体查询，充分赋予了响应式设计所需的潜力，使其成为一个真正更实用的概念。我们将在\
    \ [第 2 章](#chapter-2) 详细讨论媒体查询，但简而言之，它们允许你根据预定义的屏幕尺寸或类型更改网页中的显示内容。Ethan Marcotte\
    \ 于 2010 年在 [A List Apart](#a-list-apart) 的一篇文章中正式提出了“响应式网页设计”这个术语。\n\n这导致了媒体查询之外的其他技术和技巧的增长与巩固，例如弹性图像和网格，我们将在本书中涵盖所有这些内容。\n\
    \n对我来说，“响应式设计”是所有这些想法和原则的某种结合。它不仅仅是使设计适应屏幕尺寸，还包括适应其他因素，如颜色深度、媒体类型（例如，笔记本电脑屏幕或电子阅读器）或位置。\n\
    \n## 响应式设计中的思想流派\n\n关于如何使用响应式设计的思想流派与对其的解释一样多。有些已经出现又消失，有些则保留了下来。本书不会明确详细地介绍任何一种，但我们会触及它们的实际应用。现在让我们快速介绍其中几种。\n\
    \n### 渐进增强\n\n当遵循更传统的 **渐进增强** 原则时，你的主要焦点是使网站内容对所有用户都可用，无论他们的设备多么简单或连接多么慢。然后为能够利用它们的设备添加额外功能——例如更复杂的设计和功能。\n\
    \n### 优雅降级\n\n移动浏览的普及颠倒了更传统的设计路径。过去，你从你工作的平台（通常是计算机）开始设计，然后剥离样式和功能以支持屏幕更小或对某些功能支持较少的设备。\n\
    \n虽然 **优雅降级** 通常应用于浏览器对特定功能缺乏支持的情况，但你也可以更广泛地理解它。其原则是你从一个功能齐全的网站版本开始，在你理想的设备和浏览器上运行，同时确保基本功能在任何（受支持的设备）上对任何用户都有效，即使他们失去了那些锦上添花的功能。\n\
    \n### 移动优先\n\n**移动优先** 类似于渐进增强，但更具体地针对响应式设计。它提出你从最小或功能最少的支持设备（通常在该原则创建时是手机）开始，然后随着设备规模的增加添加功能和样式。\n"
