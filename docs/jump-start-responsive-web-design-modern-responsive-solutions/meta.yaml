- img_proc: true
  md: "Now add a script element below the page footer, containing the following code.\
    \ This script initiates when the page loads, and accesses the video element, listening\
    \ to whether it's playing:\n\n```\n<script>\n(function () {\n    var video = document.getElementById(\"\
    show1\");\n    video.addEventListener(\"play\", control_video, false);\n\n})();\n\
    </script>\n```\n\nAdd the control_video function, and assign the video clicked\
    \ to a variable:\n\n```\nfunction control_video(e) {\n    var v = e.target;\n\
    }\n```\n\nCheck if the device supports the orientation API and if so, listen for\
    \ changes to orientation. If it doesn't, then warn the user:\n\n```\nif (window.DeviceOrientationEvent)\
    \ {\n    window.addEventListener(\"deviceorientation\", function (e) {\n\n   \
    \ }, false);\n} else {\n    alert(\"Sorry, your browser doesn't support Device\
    \ Orientation\");\n}\n```\n\nFinally, react to the changes in orientation, pausing\
    \ the video if a user rotates their phone to the right, and playing it again if\
    \ they rotate to the left:\n\n```\nif ((e.gamma < -45) && (e.gamma > -90)) {\n\
    \    v.play();\n}\n```"
  merge: -1
  pgno: 161
- img_proc: true
  md: "```\n}\n\nif ((e.gamma > 45) && (e.gamma < 90)) {\n    v.pause();\n}\n```\n\
    \n> **Getting Oriented**\n\nIf you’re interested in learning more about the three-rotation\
    \ axis that exist in the Orientation API, I recommend reading “Using Device Orientation\
    \ in HTML5”.\n\n# Responding to All\n\nIn this chapter, we’ve seen hypothetical\
    \ examples of how we can change the contents of our pages to respond to the variety\
    \ of sensors found in modern devices. These are always evolving, and I encourage\
    \ you to keep up to date on the new APIs you can take advantage of in your designs\
    \ to deliver tailored experiences to users.\n\nThis brings us to the end of our\
    \ journey with this book. Responsive design is fundamentally about crafting pages\
    \ that are usable by anyone, no matter what their device or circumstances. Whether\
    \ it be screen size, performance or other factors, it’s our responsibility to\
    \ ensure that the user’s experience is as good as it can be.\n\nYou’re beginning\
    \ your responsive adventure at a good time. There have never been better features\
    \ available and soon to arrive in the HTML and CSS specifications—features for\
    \ crafting experiences to suit the ever-changing landscape of modern web design.\
    \ Some of these features are in flux, and their final forms undecided, but this\
    \ also means you have the opportunity to test and shape their future. Get involved,\
    \ and help create the Web you want to see."
  merge: -1
  pgno: 162
