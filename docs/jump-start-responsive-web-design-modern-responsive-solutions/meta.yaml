    Email: books@sitepoint.com\n\nISBN 978-0-9943470-9-1 (print)\n\nISBN 978-0-9953827-2-5\
    \ (ebook)\nPrinted and bound in the United States of America\n\n## About Chris\
    \ Ward\n\nChris explains cool tech to the World. He’s a technical writer and blogger.\
    \ He has crazy projects in progress and will speak to anyone who listens.\n\n\
    ## About SitePoint\n\nSitePoint specializes in publishing fun, practical, and\
    \ easy-to-understand content for web professionals. Visit [http://www.sitepoint.com/](http://www.sitepoint.com/)\
    \ to access our blogs, books, newsletters, articles, and community forums. You’ll\
    \ find a stack of information on JavaScript, PHP, Ruby, mobile development, design,\
    \ and more.\n\nThis book is dedicated to 2016, as that was the year I was supposed\
    \ to finish it, but life got in the way. It was also a pretty interesting year,\
    \ wasn’t it?\n\nI should probably also dedicate this book to my wife for putting\
    \ up constantly with “Can’t do anything this weekend, got to work on the book.”\n\
    \n## Table of Contents\n\n- Preface\n    - Who Should Read This Book\n    - Conventions\
    \ Used\n        - Tips, Notes, and Warnings\n    - Supplementary Materials\n-\
    \ Chapter 1 The Meaning and Purpose of Responsive Web Design\n    - History\n\
    \    - Schools of Thought Within Responsive Design\n        - Progressive Enhancement\n\
    \        - Graceful Degradation\n        - Mobile First\n    - What Do You Need\
    \ To Support?\n        - Computers\n        - Mobile Phones\n        - Tablets\n\
    \        - Hybrid Devices\n        - Wearables\n        - TV\n        - Cars\n\
    \        - Game Consoles\n        - Print\n    - Sample Application\n        -\
    \ Introducing RWDFlix\n        - Computer Version\n        - Tablet Version\n\
    \        - Mobile Version\n        - TV Version\n    - Structuring a Page with\
    \ HTML5\n    - Ready to Respond?\n- Chapter 2 The Building Blocks of Responsive\
    \ Design\n    - Media Types\n    - Creating a Query\n        - Logical Queries\
    \ with Only and Not\n        - Query Features\n    - Streamlining the Example\
    \ App\n    - Mobile First\n    - The Viewport Meta Element\n    - Any Queries?\n\
    - Chapter 3 Better Responsive Structures with Grid Systems\n    - What Is a Grid?\n\
    \    - Creating Your Own Grid\n    - Flexbox\n    - CSS Grid Layout\n    - Making\
    \ Grids Easier with Frameworks\n        - Bootstrap\n        - Foundation\n  \
    \  - What About the Demo App?\n    - Wrap Up\n- Chapter 4 Responsive Text\n  \
    \  - The History of Text\n    - Responsive Typographical Properties in CSS\n \
    \       - Fixed Sizing\n        - Relative Sizing\n    - Creating Readable Text\n\
    \    - Read On\n- Chapter 5 Responsive Images and Video\n    - Images\n      \
    \  - Responsive Dimensions\n        - The Right Image for the Right Device\n \
    \           - `srcset`\n        - The `picture` Element\n    - Responsive Video\n\
    \        - The `video` Element\n    - Get Visual\n- Chapter 6 Responding to User\
    \ Context\n    - An API for Everything\n        - Based on Time\n        - Battery\
    \ Level\n        - Geolocation\n        - Based on Network\n        - User Preference"
