    ![](img/bd4041c3e441a42781fa04a5cb5b773b_68_0.png)


    3–8. The page as a grid


    You could set up all these columns and grids manually for each project, but it''s
    a much better idea to make something more usable and reusable. We''re going to
    create a lot of new styles and changes to our HTML and CSS files now. Then I''ll
    show easier ways to achieve the same result. Sometimes it''s a good idea to learn
    the hard way before knowing how to make it easier.


    Set up the base styles for the columns and rows, and replace any existing matching
    classes:'
- md: "## 3-9. Chapter3/vanilla_final/layout.css (excerpt)\n\n```css\n.row,\n.column\
    \ {\n    box-sizing: border-box;\n}\n\n.row:before,\n.row:after {\n    content:\
    \ \" \";\n    display: table;\n}\n\n.row:after {\n    clear: both;\n}\n\n.column\
    \ {\n    position: relative;\n    float: left;\n}\n\n.column + .column {\n   \
    \ margin-left: 1.6%;\n}\n```\n\n**Using the Adjacent Sibling Selector**\n\nThe\
    \ adjacent sibling selector (+) above is a useful CSS trick that adds a margin\
    \ only to the matching element following another matching element. In our case,\
    \ it means that the first column won't have a left margin.\n\nThe first step is\
    \ to define the width of one column, not forgetting the margin between each column.\n\
    \nA single column width is equal to 100 (as we're working with percentages) minus\
    \ the margin value, multiplied by the number of columns minus 1 (you don't need\
    \ a left margin in the first column), all divided by the number of columns.\n\n\
    If you prefer to look at formulas:\n\n```\nSingleColumnWidth = (100 - (MarginValue\
    \ * (NumberOfColumns - 1))) / NumberOfColumns\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_70_0.png)\n\
    \nThis should give the nice, memorable result of 6.866666666667% ... but don't\
    \ worry: a number like this is what's expected, and after the initial setup, you\
    \ won't need to remember these values.\n\nNext, apply this number into a new formula\
    \ for each of the columns. You want to know the width values of column *spans*—that\
    \ is, how to spread content across more than one column.\n\nA column width is\
    \ equal to the `SingleColumnWidth` value multiplied by the current column, added\
    \ to the margin value multiplied by the number of columns minus 1.\n\nOr as a\
    \ formula:\n\n```\nColumnWidth = (SingleColumnWidth * CurrentColumn) +\n\t (MarginValue\
    \ * (CurrentColumn - 1))\n```\n\nAs an example, here's how to find the value required\
    \ to span two columns:\n\n```\n(SingleColumnWidth * CurrentColumn)\n6.86666666667\
    \ * 2 = 13.733333333\n\n(CurrentColumn - 1)\n2 - 1 = 1\n\n(MarginValue * (CurrentColumn\
    \ - 1))\n1.6 * 1 = 1.6\n\n(SingleColumnWidth * CurrentColumn) + (MarginValue *\n\
    \t (CurrentColumn - 1))\n13.733333333 + 1.6 = 15.333333333\n```\n\nThis will result\
    \ in the following column styles, with the column-n class representing the number\
    \ of columns you want to span. Add these to layout.css:\n\n60 Jump Start Responsive\
    \ Web Design\n\n## 3-11. Chapter3/vanilla_final/layout.css (excerpt)\n\n```css\n\
    .column-1 {\n    width: 6.866666666667%;\n}\n\n.column-2 {\n    width: 15.3333333333%;\n\
    }\n\n.column-3 {\n    width: 23.8%;\n}\n\n.column-4 {\n    width: 32.26666666667%;\n\
    }\n\n.column-5 {\n    width: 40.7333333333%;\n}\n\n.column-6 {\n    width: 49.2%;\n\
    }\n\n.column-7 {\n    width: 57.66666666667%;\n}\n\n.column-8 {\n    width: 66.1333333333%;\n\
    }\n\n.column-9 {\n    width: 74.6%;\n}\n\n.column-10 {\n    width: 83.06666666667%;\n\
    }\n\n.column-11 {\n    width: 91.5333333333%;\n}\n\n.column-12 {\n    width: 100%;\n\
    }\n```\n\nAgain, don't worry about remembering what these values are. Once they're\
    \ defined, all that's needed is to use the CSS class.\n\n> **Saving Some Legwork**\n\
    >\n> You could also use a CSS preprocessor—such as Sass or Less—that provides\
    \ an extra framework to help generate repetitive and complex CSS for you. Among\
    \ other features, this includes making the calculations above for you.\n\nNow\
    \ you want the header and nav bar to always take up 12 columns to better fit into\
    \ the grid model, so let's rearrange the header and navigation elements into rows\
    \ and add appropriate column classes. These are the base column class and a column-12\
    \ class to fill 12 columns:\n\n```html\n<header class=\"row\">\n    <h1 class=\"\
    column column-12\">Site Name</h1>\n</header>\n<nav class=\"row\">\n    <ul class=\"\
    column column-12\">\n        <li><a href=\"#\">Menu Item</a></li>\n        <li><a\
    \ href=\"#\">Menu Item</a></li>\n        <li><a href=\"#\">Menu Item</a></li>\n\
    \    </ul>\n</nav>\n```\n\nThe left content area needs to be nine columns wide,\
    \ and the aside three columns, so add those classes:\n\n62 Jump Start Responsive\
    \ Web Design\n\n```html\n<section class=\"showslisting column column-9\">\n  \
    \  ...\n</section>\n\n<aside class=\"column column-3\">\n    ...\n</aside>\n```\n\
    \nNow add column classes to the TV shows *inside* the content area:\n\n```html\n\
    <section class=\"tvshow column column-2\">\n    ...\n</section>\n```\n\nIn the\
    \ tvshow class you can now remove the width and display properties and change\
    \ the height to auto for more responsive magic:\n\n```css\nsection.tvshow {\n\
    \    height: auto;\n}\n```\n\nThe page layout doesn’t look too much different\
    \ from how it did before, but these crucial changes allow for increased flexibility.\
    \ Want to make the TV show listings tighter? Then change the class to column-3.\n\
    \nWant a wider aside menu? Change its class to column-4 and change the listings\
    \ width class to column-8:\n\n## 3-12. The page with a wider aside\n\nAs the browser\
    \ window changes size, you’ll see page elements shrink and grow smoothly, perfect\
    \ for responsive web design. But notice what happens when you get to a smaller\
    \ screen size:\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_75_0.png)\n\n## 3-13.\
    \ What happens on a smaller screen size\n\n64 Jump Start Responsive Web Design\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_76_0.png)\n\nNot a great look: the\
    \ TV show elements have become squashed. Some of this is due to the images not\
    \ having reduced appropriately in size yet—a topic we'll cover further in Chapter\
    \ 5. This is also a problem with a fluid grid. In theory, what should happen at\
    \ smaller screen sizes is that the main content column should instead fill 100%\
    \ of the screen's width, or the class should change to column-12 to fill the full\
    \ width of the screen.\n\nOne solution is to override the percentage width of\
    \ the column-8 class at relevant breakpoints. For example:\n\n```css\nsection.showlisting.column-8\
    \ {\n    width: 100%;\n}\n...\n@media only screen and (min-width: 992px) {\n \
    \   ...\n    section.showlisting.column-8 {\n        width: 66%;\n    }\n    ...\n\
    }\n```\n\nBut this is a poor solution, and you’ll soon lose track of what class\
    \ equals what size.\n\nYou could change the class applied to the div with JavaScript,\
    \ and in the past, this was a solution to the problem. But instead, I’ll show\
    \ you some more modern (and better) options that will make the principle of grids\
    \ more useful for responsive design.\n\n# Flexbox\n\nWhile the “column method”\
    \ above isn’t that hard to understand and implement, as your layouts become more\
    \ complex you can start to introduce a lot of nested divs and CSS styles to support\
    \ them. The example above used `float` to position page elements into the desired\
    \ position. As the example was simple, it wasn’t too hard to achieve this, but\
    \ as grids get more complex, especially nested grids, `float`s quickly become\
    \ messy, and the solutions to cope with this aren’t ideal.\n\nThe CSS Flexible\
    \ Box (“flexbox”) Layout Module is a recent part of the CSS spec and already enjoys\
    \ good browser support. It was designed to provide a better and more modern solution\
    \ for this type of layout, offering you specific functionality for the task.\n\
    \nAfter an initial page restructure and learning new concepts, you’ll find that\
    \ using flexbox for your page components will drastically simplify your HTML structure\
    \ and CSS classes.\n\n66 Jump Start Responsive Web Design\n\nEverything that you\
    \ want flexbox to manage is contained within a \"flex container\". Much like earlier\
    \ examples, begin with the code from the start of this chapter and continue to\
    \ use a containing `div`:\n\n```html\n<div class=\"container\">\n    ...\n</div>\n\
    ```\n\nAnd the CSS for this container:\n\n```css\n.container {\n    display: flex;\n\
    \    flex-flow: row wrap;\n}\n```\n\nThe `display` property is set to `flex` to\
    \ enable flexbox layout. The `flex-flow` property is shorthand for two other properties.\n\
    \nThe first of these properties is `flex-direction`, which defines how the individual\
    \ items inside a flex container will be placed. The two most common values are\
    \ `row` and `column`. Using `row` will place items horizontally (left to right\
    \ or right to left, depending on your preference). And `column` works similarly,\
    \ but instead places elements from top to bottom. You can reverse the direction\
    \ by appending with `-reverse`.\n\nThe `flex` display mode is one-dimensional\
    \ (running either horizontally or vertically) and will attempt to keep fitting\
    \ items on one line. The `flex-wrap` property determines what will happen if the\
    \ container can't fit all items on one line. The items can be set to `wrap` to\
    \ the next line or be forced into one line with `nowrap`.\n\nNext, let's handle\
    \ the `header`, `nav`, and `footer` page elements, which fill the entire width\
    \ of the page container. Replace any existing styles with the following:"
  mdcn: "\n## 3-9. 第3章/vanilla_final/layout.css (摘录)\n\n```css\n.row,\n.column {\n\
    \    box-sizing: border-box;\n}\n\n.row:before,\n.row:after {\n    content: \"\
    \ \";\n    display: table;\n}\n\n.row:after {\n    clear: both;\n}\n\n.column\
    \ {\n    position: relative;\n    float: left;\n}\n\n.column + .column {\n   \
    \ margin-left: 1.6%;\n}\n```\n\n**使用相邻兄弟选择器**\n\n上面使用的相邻兄弟选择器（`+`）是一个有用的 CSS 技巧，它只为紧随另一个匹配元素之后的匹配元素添加边距。在我们的例子中，这意味着第一列不会有左边距。\n\
    \n第一步是定义单列的宽度，别忘了列与列之间的边距。\n\n单列宽度等于100（因为我们使用的是百分比）减去边距值，乘以列数减1（因为第一列不需要左边距），再除以列数。\n\
    \n如果你更喜欢看公式：\n\n```\nSingleColumnWidth = (100 - (MarginValue * (NumberOfColumns\
    \ - 1))) / NumberOfColumns\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_70_0.png)\n\
    \n这会得到一个漂亮但不太好记的结果：6.866666666667%……不过别担心：这样的数字是预料之中的，在初始设置之后，你不需要记住这些值。\n\n接下来，将这个数字应用到一个新的公式中，计算每一列的宽度。你需要知道列*跨度*的宽度值——也就是说，如何让内容跨越多列。\n\
    \n一列的宽度等于 `SingleColumnWidth` 的值乘以当前列数，再加上边距值乘以列数减1。\n\n或者用公式表示：\n\n```\nColumnWidth\
    \ = (SingleColumnWidth * CurrentColumn) +\n\t (MarginValue * (CurrentColumn -\
    \ 1))\n```\n\n举个例子，下面是计算跨越两列所需值的过程：\n\n```\n(SingleColumnWidth * CurrentColumn)\n\
    6.86666666667 * 2 = 13.733333333\n\n(CurrentColumn - 1)\n2 - 1 = 1\n\n(MarginValue\
    \ * (CurrentColumn - 1))\n1.6 * 1 = 1.6\n\n(SingleColumnWidth * CurrentColumn)\
    \ + (MarginValue *\n\t (CurrentColumn - 1))\n13.733333333 + 1.6 = 15.333333333\n\
    ```\n\n这将生成以下列样式，其中 `column-n` 类表示你想要跨越的列数。将这些添加到 layout.css 中：\n\n60 快速上手响应式网页设计\n\
    \n## 3-11. 第3章/vanilla_final/layout.css (摘录)\n\n```css\n.column-1 {\n    width:\
    \ 6.866666666667%;\n}\n\n.column-2 {\n    width: 15.3333333333%;\n}\n\n.column-3\
    \ {\n    width: 23.8%;\n}\n\n.column-4 {\n    width: 32.26666666667%;\n}\n\n.column-5\
    \ {\n    width: 40.7333333333%;\n}\n\n.column-6 {\n    width: 49.2%;\n}\n\n.column-7\
    \ {\n    width: 57.66666666667%;\n}\n\n.column-8 {\n    width: 66.1333333333%;\n\
    }\n\n.column-9 {\n    width: 74.6%;\n}\n\n.column-10 {\n    width: 83.06666666667%;\n\
    }\n\n.column-11 {\n    width: 91.5333333333%;\n}\n\n.column-12 {\n    width: 100%;\n\
    }\n```\n\n同样，别担心记住这些值。一旦定义好了，你需要做的就是使用 CSS 类。\n\n> **节省一些功夫**\n>\n> 你也可以使用 CSS\
    \ 预处理器——如 Sass 或 Less——它们提供了额外的框架来帮助你生成重复且复杂的 CSS。除其他功能外，这包括为你执行上述计算。\n\n现在你希望页头和导航栏始终占据12列，以便更好地适应网格模型，因此让我们将页头和导航元素重新排列成行，并添加适当的列类。这些是基础列类和一个填充12列的\
    \ `column-12` 类：\n\n```html\n<header class=\"row\">\n    <h1 class=\"column column-12\"\
    >站点名称</h1>\n</header>\n<nav class=\"row\">\n    <ul class=\"column column-12\"\
    >\n        <li><a href=\"#\">菜单项</a></li>\n        <li><a href=\"#\">菜单项</a></li>\n\
    \        <li><a href=\"#\">菜单项</a></li>\n    </ul>\n</nav>\n```\n\n左侧内容区域需要9列宽，侧边栏需要3列宽，所以添加这些类：\n\
    \n62 快速上手响应式网页设计\n\n```html\n<section class=\"showslisting column column-9\">\n\
    \    ...\n</section>\n\n<aside class=\"column column-3\">\n    ...\n</aside>\n\
    ```\n\n现在为内容区域*内部*的电视节目添加列类：\n\n```html\n<section class=\"tvshow column column-2\"\
    >\n    ...\n</section>\n```\n\n在 `tvshow` 类中，你现在可以移除宽度和显示属性，并将高度更改为 `auto` 以实现更多响应式效果：\n\
    \n```css\nsection.tvshow {\n    height: auto;\n}\n```\n\n页面布局看起来与之前没有太大不同，但这些关键的变化带来了更大的灵活性。想让电视节目列表更紧凑吗？那么将类改为\
    \ `column-3`。\n\n想要更宽的侧边栏菜单？将其类更改为 `column-4`，并将列表宽度类更改为 `column-8`：\n\n## 3-12.\
    \ 更宽侧边栏的页面\n\n随着浏览器窗口大小的变化，你会看到页面元素平滑地收缩和扩展，非常适合响应式网页设计。但注意当屏幕尺寸变小时会发生什么：\n\n\
    ![](img/bd4041c3e441a42781fa04a5cb5b773b_75_0.png)\n\n## 3-13. 屏幕尺寸较小时的情况\n\n\
    64 快速上手响应式网页设计\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_76_0.png)\n\n效果不佳：电视节目元素被挤压了。部分原因是图片尺寸还没有相应缩小——我们将在第5章进一步讨论这个话题。这也是流式网格的一个问题。理论上，在较小屏幕尺寸下应该发生的是，主内容列应改为填充屏幕宽度的100%，或者将类更改为\
    \ `column-12` 以填充屏幕的全宽。\n\n一个解决方案是在相关的断点处覆盖 `column-8` 类的百分比宽度。例如：\n\n```css\n\
    section.showlisting.column-8 {\n    width: 100%;\n}\n...\n@media only screen and\
    \ (min-width: 992px) {\n    ...\n    section.showlisting.column-8 {\n        width:\
    \ 66%;\n    }\n    ...\n}\n```\n\n但这是一个糟糕的解决方案，你很快就会记不清哪个类对应哪个尺寸。\n\n你可以用 JavaScript\
    \ 更改 div 应用的类，过去，这是解决问题的一种方法。但是，我将向你展示一些更现代（也更好）的选项，使网格原理对响应式设计更有用。\n\n# Flexbox（弹性盒子布局）\n\
    \n虽然上面的“列方法”并不难理解和实现，但随着布局变得越来越复杂，你可能会引入大量的嵌套 div 和 CSS 样式来支持它们。上面的例子使用 `float`\
    \ 来将页面元素定位到所需位置。由于例子很简单，实现这一点并不太难，但随着网格变得更加复杂，特别是嵌套网格，`float` 很快就会变得混乱，而应对这种情况的解决方案并不理想。\n\
    \nCSS 弹性盒子（“flexbox”）布局模块是 CSS 规范的最新部分，并且已经获得了良好的浏览器支持。它旨在为此类布局提供更好、更现代的解决方案，为你提供完成任务的特定功能。\n\
    \n在初步的页面重构和学习新概念之后，你会发现使用 flexbox 来管理页面组件将极大地简化你的 HTML 结构和 CSS 类。\n\n66 快速上手响应式网页设计\n\
    \n你希望 flexbox 管理的所有内容都包含在一个“弹性容器”中。与前面的例子类似，从本章开始的代码开始，并继续使用一个包含 `div`：\n\n```html\n\
    <div class=\"container\">\n    ...\n</div>\n```\n\n以及这个容器的 CSS：\n\n```css\n.container\
    \ {\n    display: flex;\n    flex-flow: row wrap;\n}\n```\n\n`display` 属性设置为 `flex`\
    \ 以启用弹性盒子布局。`flex-flow` 属性是另外两个属性的简写。\n\n其中第一个属性是 `flex-direction`，它定义了弹性容器内的各个项目将如何放置。两个最常见的值是\
    \ `row` 和 `column`。使用 `row` 会将项目水平放置（从左到右或从右到左，取决于你的偏好）。而 `column` 的工作方式类似，但改为从上到下放置元素。你可以通过附加\
    \ `-reverse` 来反转方向。\n\n`flex` 显示模式是一维的（水平或垂直运行），并会尝试将所有项目保持在一行上。`flex-wrap` 属性决定了当容器无法将所有项目放在一行上时会发生什么。项目可以设置为\
    \ `wrap` 到下一行，或者用 `nowrap` 强制在一行内。\n\n接下来，让我们处理 `header`、`nav` 和 `footer` 页面元素，它们填满了页面容器的整个宽度。将任何现有样式替换为以下内容：\n"
