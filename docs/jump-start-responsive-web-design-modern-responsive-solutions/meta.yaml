  md: '# Making Grids Easier with Frameworks


    In many cases, creating a grid in the way described in this chapter isn''t too
    much work, but developers and designers like to reduce repetitive tasks as much
    as possible. A simple solution is to create your own grid system that works for
    you and reuse it across your projects. But of course, other developers and designers
    have thought the same thing and have provided their grid systems (or frameworks)
    on the internet. I''ll present two of the popular ones, but it''s a topic where
    opinions are many and change is rapid. My aim here is to show you how frameworks
    *may* be able to help you save time on repetitive tasks, rather than go into detail
    over which one is "better" (a decision you''ll have to make for yourself). Many
    of these frameworks supply more than responsive grids, providing other responsive
    elements such as fonts, icons, and reusable widgets. You may prefer one framework
    over another because it gives you better options for other aspects of your web
    pages.


    # Bootstrap


    While not the first framework for responsive design, Bootstrap is the most widely
    used. You''ve probably seen it in action without realizing. Released in 2011 by
    Twitter, it uses a 12-column grid, offers flexbox layout, and has periodically
    had one of the most popular repositories on GitHub.


    Popularity is Bootstrap''s biggest advantage and disadvantage. It''s easy to use,
    encourages positive layout and CSS practices, and has plenty of documentation
    and community help. But your site can easily end up looking a lot like every other
    Bootstrap-powered site.


    # Installing Bootstrap


    The default download of Bootstrap can add a lot to the weight of your page, so
    I recommend you take a good look at the instructions to ensure you get a copy
    that''s best optimized for your use. For this example, I''ll use the CDN option,
    as it''s the simplest. If you want to follow along, add the lines provided on
    the Bootstrap page, and remove the link to the current CSS file.'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'You can find the simplified (no media queries) refactored index.html page [here](#)
    as an example. You''ve lost the custom font and background colors, which would
    be easy to re-add, but you have a responsive grid (Bootstrap also uses a 12-column
    grid) without too much effort, and that works in a similar way to our custom grid.
    Bootstrap also has a lot of other styles available for handling images, determining
    what grid elements to display at different grid sizes, and much, much more.


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_93_0.png)


    If you''re interested in learning more about Bootstrap, I recommend SitePoint''s
    [Jump Start Bootstrap](#).


    # Foundation


    [Foundation](#) was created in 2011 by Zurb (an interactive design agency). It
    also offers a lot of features (including optional flexbox), has regular releases,
    and a good community, but is less widely used. It provides more flexibility to
    create layouts (based on a 12-column grid), but generally requires more classes
    and layout elements to achieve this.'
