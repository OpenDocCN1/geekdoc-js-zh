- img_proc: true
  md: "The first part of the element is normal, as is the last `class` property, the\
    \ second and third lines are the new syntax. `srcset` is designed to allow the\
    \ browser to make the best decisions about what image to display based on information\
    \ you provide it. Each pair in the second line defines the images available and\
    \ tells the browser its width, appended with a w. The third line defines the viewport\
    \ sizes you want to load a particular image at, and what image to load.\n\nThe\
    \ example above declares:\n\n+   - Up to a viewport width of 768px, load an image\
    \ of 480px width.\n- Between a viewport width of 768 and 1800px, load an image\
    \ of 320px width.\n- If no other rule applies, then load an image of 768px.\n\n\
    You can be more subtle with these declarations, for example:\n\n```\n<img src=\"\
    ../images/show1-medium.jpg\"\n     srcset=\"../images/show1-medium.jpg 480w,\n\
    \     ../images/show1-small.jpg 320w,\n     ../images/show1-large.jpg 768w\"\n\
    \     sizes=\"(max-width: 768px) 90vw,\n     (max-width: 1800px) 24vw, 50vw\"\n\
    \     class=\"thumbnail\" />\n```\n\nThis instead declares that at the different\
    \ viewport sizes pick an image that suits best a certain viewport width (vw) size.\
    \ For this design, they are essentially the same, but it gives you an idea of\
    \ how smart you can let your browser be. It's worth noting that this smartness\
    \ can actually cause confusion when testing; I have frequently found myself wondering\
    \ why the tag wasn't working how I expected it to, only to realize that it was\
    \ due to the browser holding on to cached version of the images, or optimizing\
    \ for a retina screen, and again caching those images. To debug what's happening\
    \ while figuring out your `srcsets`, I recommend using incognito / private windows,\
    \ double-checking your screen resolution, and keeping developer tools open to\
    \ see what files the browser is actually loading.\n\nIf this smartness is too\
    \ unpredictable for you and you find yourself needing more control, then the `picture`\
    \ tag is for you."
  merge: -1
  pgno: 125
