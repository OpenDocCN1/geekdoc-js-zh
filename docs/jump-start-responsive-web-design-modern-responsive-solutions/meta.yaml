- img_proc: true
  md: "```\nwindow.addEventListener(\"load\", function(event) {\n    if (\"geolocation\"\
    \ in navigator) {\n\n    } else {\n        alert(\"RWDFlix uses geolocation to\
    \ recommend shows that may be relevant to you.\")\n    }\n}, false);\n```\n\n\
    If the browser does support geolocation, get the current position of the user\
    \ and pass the values to a new function:\n\n```\nif (\"geolocation\" in navigator)\
    \ {\n    navigator.geolocation.getCurrentPosition(getPosition);\n} else {\n  \
    \  alert(\"RWDFlix uses geolocation to recommend shows that may be relevant to\
    \ you.\")\n}\n```\n\nThe API method returns the current latitude and longitude,\
    \ which is not that useful to us, as we really want to know the current country\
    \ of a user. Use the [Google Maps API](http://googleapis.com/) to turn it into\
    \ a more useful country code:\n\n```\nfunction getPosition(position) {\n    //\
    \ Define the URL with the current latitude and longitude\n    var url =\n    \"\
    http://maps.googleapis.com/maps/api/geocode/json?latlng=\" +\n    position.coords.latitude\
    \ + \",\" + position.coords.longitude +\n    \"&sensor=false\";\n    // Create\
    \ a request and send the URL\n    var xmlhttp = new XMLHttpRequest();\n    xmlhttp.open(\"\
    GET\", url, true);\n    xmlhttp.send();\n    // When the request returns, process\
    \ the response\n    xmlhttp.addEventListener(\"readystatechange\", processRequest,\n\
    \    false);\n```"
