    \ *Jump Start Foundation*。\n\n## 演示应用程序怎么办？\n\n到目前为止，我一直在本章的示例中使用了演示应用程序的部分内容，但本书的其余部分将不使用任何网格系统。这是为了清晰起见，以便你可以更轻松地看到涵盖其他主题的示例，而不受网格的干扰，同时也为了减少与某些浏览器的兼容性问题。\n\
    \n作为练习，尝试从本章中选择你最喜欢的网格系统，并使用它重写未来的示例。\n\n## 总结\n\n现在你知道了如何制作一个可以响应任何浏览器尺寸并始终保持比例的页面布局。在下一章中，我们将探讨如何使布局内的内容响应式——因为，如果没有在所有设备上可读且可展示的内容，你的工作就尚未完成。\n\
    \n# 第4章：响应式文本\n\n如果网页要真正实现响应式，那么页面的内容也应该根据用户查看它的设备尺寸而流动和变化。虽然网页正变得越来越以图像和媒体为主，但文本仍然是一个关键组成部分，并且有许多技术可以帮助使其尽可能易于阅读，无论当前设备是什么。\n\
    \n为了更好地理解在网页上呈现文本的方式，最好回顾一下文本的悠久历史。\n\n## 文本的历史\n\n**排版**（文本的排列和样式设计）的原则自人们将文字印刷在页面上以来就一直在发展。诸如行距（文本行之间的间距）、字距（字母之间的间距）和字间距（单词之间的间距）等度量标准已沿用到桌面出版领域，任何使用过QuarkXpress、InDesign或其前身的人都会知道它们如何影响文本。\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_97_0.png)\n\n手工排版是一个艰苦的过程，因为它需要调整每一行文本的行距、字距和字间距。桌面出版，以及最近使用CSS设置排版，使得尝试这些属性以获得“完美”文本变得容易得多。\n\
    \nCSS排版与印刷排版共享许多相同的属性，但有些名称不同。事实上，它比旧的印刷版本的名称更具描述性。在Web早期，排版控制水平有限，但CSS3极大地帮助了我们，提供了更多工具来实现我们的设计。\n\
    \n## CSS中的响应式排版属性\n\n你可以用CSS设置许多与文本相关的属性。以下是我认为对响应式设计最有用的一些：\n\n- **font-size**：字体的大小。\n\
    - **line-height**：指定块元素内行的最小高度以及内联元素的实际行高。\n- **font-weight**：字体的“粗细”，即它的粗体和强度。\n\
    - **text-decoration**：用于设置下划线或删除线。\n- **text-align**：用于设置左对齐、右对齐、居中或两端对齐（与左右边距均等对齐）。\n\
    - **text-transform**：用于使文本显示为大写、小写或首字母大写。\n- **letter-spacing**：指定字母之间的间距，类似于行距。\n\
    - **word-spacing**：指定单词之间的间距，类似于字间距。\n\n通常使用像素值来设置其中部分或全部属性。例如，你可以将以下内容添加到当前演示站点的body选择器中：\n\
    \n```\nbody {\n    font-size: 18px;\n    line-height: 22px;\n    letter-spacing:\
    \ 4px;\n}\n```\n\n这将产生如下所示的文本：\n"
