  md: '# 110 Jump Start Responsive Web Design


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_122_0.png)


    This will set the image width to 100% of its container''s width, and setting image''s
    height to auto allows the image to occupy as much vertical space as needed to
    maintain its natural proportions. You''ll notice that this means the images don''t
    currently all have the same height, which affects the layout. You could swap these
    values to instead fill 100% of the height and fill the width automatically. Attempting
    to make images always fit precise dimensions can be a compromising challenge that
    depends a lot on the source of the images. If you''re able, it might be best to
    edit them first so they all have the same dimensions.


    ```

    Using `width: 100%` can mean that images will scale larger than their original
    size and render pixelated. To prevent this, try using `max-width` or `max-height`
    on the thumbnail styles relevant to each breakpoint.

    ```'
