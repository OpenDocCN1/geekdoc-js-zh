- md: "Other properties you may find useful in your designs are:\n\n- **font-style**:\
    \ sets text to italic or oblique. Italic text may not be as readable on small\
    \ screen as on large screens.\n- **text-indent**: sets the indentation (mostly)\
    \ of the first line of text in a block of text. With space at a premium on smaller\
    \ devices, it may be better to indent paragraphs than to set spaces between them.\n\
    - **text-align-last**: sets the alignment of the last line of a text block. Again,\
    \ at different devices sizes, you may want to handle this differently.\n- **white-space**:\
    \ defines the handling of white space and wrapping in a block of text.\n- **word-wrap**:\
    \ specifies if words are allowed to break over lines. This could be useful for\
    \ optimizing text based on display size.\n\nYou may be wondering how setting text\
    \ at fixed sizes could be responsive. 18px is 18px whether it's rendered on a\
    \ desktop computer or a mobile screen. You could use media queries to set different\
    \ font sizes at various screen sizes, but this would become arduous, and there's\
    \ potentially a better method.\n\nCSS allows you to use different units for sizing\
    \ elements, but especially with text. They fall into two camps: fixed sizing and\
    \ relative sizing.\n\n## Fixed Sizing\n\nFixed sizing means that the size is always\
    \ the same. There are seven possible units you can use, but I'll focus on the\
    \ two most common, `px` and `pt` values.\n\n## Pixels\n\nPixels are those little\
    \ dots of color that comprise the screens of every device. When you need to set\
    \ the size of an element in HTML, one CSS pixel equals one device pixel, right?\
    \ Well, no…\n\n**Device pixels** (also called **screen pixels**) are the actual\
    \ pixels comprising your screen, and traditionally this was the number of pixels\
    \ in the width by height of a user's screen. This may not be the same as the size\
    \ of their browser window, as desktop users frequently resize it, and browsers\
    \ don't typically operate in full-screen mode.\n\n4–3. Screen size vs browser\
    \ size\n\nThe newer, high-resolution screens—such as Apple’s “Retina” displays—complicate\
    \ matters, as they use a larger number of pixels over the same screen area. Typically,\
    \ this is achieved by doubling the number of pixels vertically and horizontally—though\
    \ increasing numbers of screens have four times as many pixels in each direction.\n\
    \nComplicating this further are users who scale or zoom their browser windows\
    \ for accessibility or other reasons. For example, the screenshot below is the\
    \ current demo site zoomed to 125%, where one *CSS pixel* now covers 1.25 *device\
    \ pixels*.\n\n# Jump Start Responsive Web Design\n\nFor these reasons, it’s best\
    \ to ignore actual device pixels and focus on **CSS pixels**—the pixel values\
    \ you set in your CSS file. The CSS pixel value is a more accurate number, which\
    \ takes into account the factors outlined above. Browsers also handle a lot of\
    \ the scaling issues for you.\n\nThe **pixel** (px) sizing unit theoretically\
    \ represents the size of one pixel of a screen. In relation to text, this means\
    \ that when setting text to 16px, the length of the lowest point in the text (such\
    \ as the bottom of a lowercase 'g') to the highest point (such as the top of a\
    \ lowercase 'h') is 16px.\n\n4-5. Text height includes ascenders and descenders\n\
    \nFor other properties, such as letter-spacing, this literally means the number\
    \ of pixels between characters at their widest point.\n\n## Points\n\nAs you saw\
    \ in the earlier screenshot from InDesign, the **point** (pt) sizing unit has\
    \ its heritage in print text and is more confusing to understand. It represents\
    \ a similar size to the pixels example, but as different operating systems and\
    \ screens represent pixels to points in different ways, they are best reserved\
    \ for print styles.\n\n## Relative Sizing\n\nRelative sizing is more suited to\
    \ web and responsive design, as sizes will change relative to a base size. But\
    \ it’s useful to understand fixed sizing (at least pixels) to appreciate how these\
    \ sizing methods work. The most popular units for relative font sizing are the\
    \ %, em, and rem values.\n\nThe first important fact to know when using relative\
    \ sizes is what these sizes are relative to. By default in all browsers, it’s\
    \ 16px, but if a user has changed this default—for example, to compensate for\
    \ low vision—then relative sizes will still scale up and down proportionally.\n\
    \n### Percent\n\nSetting a percentage value for a font size means making it a\
    \ percentage of the default font size, so if a user has the font size of their\
    \ browser set at 16px, then `font-size: 100%;` will still equal 16px, and `font-size:\
    \ 50%` will equal 8px.\n\nAs an example, let’s try applying percentage sizing\
    \ to the demo site, again with a mobile first approach, setting the base font\
    \ size for users of devices with smaller screens.\n\n> ### We're Assuming a Base\
    \ Font Size of 16px\n> For these examples, I'll assume that the base font size\
    \ is the default **16px**. If it's different in your browser, then the sizes stated\
    \ will be different.\n\nAdd a base font size to the `body` element that sets the\
    \ default font size to 75% of 16px, which is 12px:\n\n```\nbody {\n    font-size:\
    \ 75%;\n}\n```\n\nThen, in the tablet and desktop media queries, add font sizes\
    \ for the larger screen sizes:\n\n```\n...\n@media only screen and (min-width:\
    \ 768px) {\n    body {\n        font-size: 100%;\n    }\n}\n\n@media only screen\
    \ and (min-width: 992px) {\n    body {\n        font-size: 125%;\n    }\n}\n```\n\
    \nThis results in a subtly more pixelated font rendering on larger screens than\
    \ on medium-sized screens.\n\n### Em\n\nDespite its recent rise in popularity\
    \ with web designers, the em unit is an old typographical unit named after the\
    \ letter “M”. The base value of an em unit is equal to the current typeface size\
    \ in points. For example, one em in a 16-point typeface is 16 points.\n\nIn practice,\
    \ it works in a similar way to percentage sizing, but the units are smaller. So,\
    \ for example, assuming a default font size of 16px, font-size: 1em will still\
    \ equal 16px, and font-size: 0.5em will equal 8px.\n\nThe unit values are smaller\
    \ with ems, but it's easy for styles to result in large font sizes accidentally.\
    \ For example, consider font-size: 4em; while the number doesn't look large, it\
    \ actually equals 64px. Of course, you could set your default font size to something\
    \ smaller, and then increasing ems won't result in such large variations.\n\n\
    As an example, let's try applying em sizing to the demo site, again with a mobile\
    \ first approach.\n\nAdd a base font size to the body element that sets the default\
    \ font size to .75em of 16px, which is 12px:\n\n```\nbody {\n    font-size: 0.75em;\n\
    }\n```\n\nThen, in the tablet and desktop media queries, add font sizes for the\
    \ larger screen sizes:\n\n```\n@media only screen and (min-width: 768px) {\n \
    \   body {\n        font-size: 1em;\n    }\n}\n\n@media only screen and (min-width:\
    \ 992px) {\n    body {\n        font-size: 1.25em;\n    }\n}\n```\n\nI won't add\
    \ screenshots, as the results should look exactly the same as with the percentage\
    \ examples.\n\nOne neat trick with ems is that the relative sizing cascades down\
    \ nested elements. For example, modify the page's aside element to have some nested\
    \ list items:\n\n```\n<aside class=\"left\">\n    <ul>\n    <li>one\n        <ul>\n\
    \        <li>sub item</li>\n        <li>sub item</li>\n        </ul>\n    </li>\n\
    \    <li>two\n        <ul>\n            <li>sub item</li>\n            <li>sub\
    \ item</li>\n        </ul>\n    </li>\n    <li>three\n        <ul>\n         \
    \   <li>sub item</li>\n            <li>sub item</li>\n        </ul>\n    </li>\n\
    \    </ul>\n</aside>\n```\n\nThen add the following style:\n\n```\naside ul {\n\
    \    font-size: 0.75em;\n}\n```\n\n4-7. Em cascade example\n\nYou'll see that\
    \ the font size for the outer ul is .75em (15px) of the current default size (in\
    \ the screenshot this is 20px), and the inner ul is .75em of that size (11.25px).\
    \ While this technique allows for a fantastic shorthand way of creating responsive\
    \ text sizes that can cascade through your page structure, it requires careful\
    \ planning, as an element several levels deep may end up smaller or larger than\
    \ you expect.\n\n### Rem\n\nThe `rem` unit stands for \"root em\", and the sizing\
    \ representation of the unit is the same. But \"root\" implies that the relative\
    \ sizing is calculated from one base element—which is the `html` element—rather\
    \ than the immediate containing element. This gives you a more predictable alternative\
    \ to ems, as it's easier to tell what the size is relative to.\n\nAs an example,\
    \ let's try applying `rem` sizing to the demo site.\n\nAdd a base font size to\
    \ the `html` of 12px (assuming a default of 16px):\n\n```\nhtml {\n    font-size:\
    \ 75%;\n}\n```\n\nThen inside the tablet and desktop media queries, add font sizes\
    \ for the larger screen sizes:\n\n```\n@media only screen and (min-width: 768px)\
    \ {\n    html {\n        font-size: 1rem;\n    }\n}\n\n@media only screen and\
    \ (min-width: 992px) {\n    html {\n        font-size: 1.25rem;\n    }\n}\n```"
  mdcn: "\n你在设计中可能发现有用的其他属性包括：\n\n- **font-style**：将文本设置为斜体或倾斜。斜体文本在小屏幕上的可读性可能不如大屏幕。\n\
    - **text-indent**：设置文本块中文本首行的（主要是）缩进。在较小设备空间有限的情况下，缩进段落可能比设置段间距更好。\n- **text-align-last**：设置文本块最后一行的对齐方式。同样，在不同设备尺寸下，你可能需要进行不同的处理。\n\
    - **white-space**：定义文本块中的空白处理和换行。\n- **word-wrap**：指定是否允许单词在行间断开。这对于根据显示大小优化文本很有用。\n\
    \n你可能会好奇，设置固定尺寸的文本如何能实现响应式。无论是渲染在台式电脑还是移动屏幕上，18px 就是 18px。你可以使用媒体查询在不同屏幕尺寸下设置不同的字体大小，但这会变得繁琐，并且可能有一个更好的方法。\n\
    \nCSS 允许你使用不同的单位来设置元素大小，特别是文本。它们分为两大类：固定尺寸和相对尺寸。\n\n## 固定尺寸\n\n固定尺寸意味着大小始终相同。你可以使用七种可能的单位，但我将重点关注最常用的两种：`px`\
    \ 和 `pt` 值。\n\n## 像素\n\n像素是构成所有设备屏幕的那些小色点。当你需要在 HTML 中设置元素大小时，一个 CSS 像素等于一个设备像素，对吧？其实并非如此……\n\
    \n**设备像素**（也称为**屏幕像素**）是构成你屏幕的实际像素，传统上这是指用户屏幕的宽度乘以高度的像素数。这可能与他们浏览器窗口的大小不同，因为桌面用户经常调整窗口大小，并且浏览器通常不以全屏模式运行。\n\
    \n4-3. 屏幕尺寸 vs 浏览器尺寸\n\n较新的高分辨率屏幕——例如苹果的“视网膜”显示屏——使问题复杂化，因为它们在相同的屏幕区域使用了更多的像素。通常，这是通过将垂直和水平方向的像素数量加倍来实现的——尽管越来越多的屏幕在每个方向上的像素数量增加了四倍。\n\
    \n更复杂的是，用户为了无障碍访问或其他原因，会缩放或放大其浏览器窗口。例如，下面的截图是当前演示站点放大到 125%，此时一个 *CSS 像素* 现在覆盖\
    \ 1.25 个 *设备像素*。\n\n# 快速上手响应式网页设计\n\n因此，最好忽略实际的设备像素，专注于 **CSS 像素**——即在你的 CSS 文件中设置的像素值。CSS\
    \ 像素值是一个更准确的数字，它考虑了上述因素。浏览器还会为你处理很多缩放问题。\n\n**像素**（px）大小单位理论上代表屏幕一个像素的大小。对于文本，这意味着当文本设置为\
    \ 16px 时，文本中最低点（例如小写 'g' 的底部）到最高点（例如小写 'h' 的顶部）的长度为 16px。\n\n4-5. 文本高度包括升部和降部\n\
    \n对于其他属性，例如 letter-spacing，这字面上意味着字符在最宽点之间的像素数。\n\n## 磅值\n\n正如你在之前 InDesign 的截图中看到的，**磅**（pt）大小单位源于印刷文本，理解起来更令人困惑。它表示的大小与像素示例相似，但由于不同的操作系统和屏幕以不同的方式表示像素与磅的关系，因此最好将其保留用于打印样式。\n\
    \n## 相对尺寸\n\n相对尺寸更适合网页和响应式设计，因为大小会相对于一个基础大小进行更改。但了解固定尺寸（至少是像素）对于理解这些尺寸方法的工作原理很有用。用于相对字体大小的最常用单位是\
    \ %、em 和 rem 值。\n\n使用相对尺寸时，第一个重要的事实是这些尺寸相对于什么。在所有浏览器中，默认情况下是 16px，但如果用户更改了此默认值——例如为了补偿低视力——那么相对尺寸仍将按比例放大和缩小。\n\
    \n### 百分比\n\n为字体大小设置百分比值意味着使其成为默认字体大小的百分比，因此如果用户将其浏览器的字体大小设置为 16px，那么 `font-size:\
    \ 100%;` 仍将等于 16px，而 `font-size: 50%` 将等于 8px。\n\n例如，让我们尝试将百分比尺寸应用于演示站点，再次采用移动优先方法，为使用较小屏幕设备的用户设置基础字体大小。\n\
    \n> ### 我们假设基础字体大小为 16px\n> 对于这些示例，我将假设基础字体大小是默认的 **16px**。如果它在你的浏览器中不同，那么所述的大小也会不同。\n\
    \n向 `body` 元素添加一个基础字体大小，将默认字体大小设置为 16px 的 75%，即 12px：\n\n```\nbody {\n    font-size:\
    \ 75%;\n}\n```\n\n然后，在平板电脑和桌面媒体查询中，为较大的屏幕尺寸添加字体大小：\n\n```\n...\n@media only screen\
    \ and (min-width: 768px) {\n    body {\n        font-size: 100%;\n    }\n}\n\n\
    @media only screen and (min-width: 992px) {\n    body {\n        font-size: 125%;\n\
    \    }\n}\n```\n\n这导致在较大的屏幕上比中等尺寸的屏幕上字体渲染效果稍微更像素化一些。\n\n### Em\n\n尽管 em 单位在网页设计师中最近越来越受欢迎，但它是一个古老的印刷单位，以字母“M”命名。一个\
    \ em 单位的基础值等于当前字体的磅值大小。例如，16 磅字体中的 1 em 等于 16 磅。\n\n在实践中，它的工作方式与百分比尺寸类似，但单位更小。因此，例如，假设默认字体大小为\
    \ 16px，`font-size: 1em` 仍将等于 16px，`font-size: 0.5em` 将等于 8px。\n\nem 单位的值更小，但样式很容易意外导致字体尺寸过大。例如，考虑\
    \ `font-size: 4em;` 虽然数字看起来不大，但它实际上等于 64px。当然，你可以将默认字体大小设置得更小一些，然后增加 em 值就不会导致如此大的变化。\n\
    \n例如，让我们尝试将 em 尺寸应用于演示站点，再次采用移动优先方法。\n\n向 body 元素添加一个基础字体大小，将默认字体大小设置为 16px 的\
    \ 0.75em，即 12px：\n\n```\nbody {\n    font-size: 0.75em;\n}\n```\n\n然后，在平板电脑和桌面媒体查询中，为较大的屏幕尺寸添加字体大小：\n\
    \n```\n@media only screen and (min-width: 768px) {\n    body {\n        font-size:\
    \ 1em;\n    }\n}\n\n@media only screen and (min-width: 992px) {\n    body {\n\
    \        font-size: 1.25em;\n    }\n}\n```\n\n我不会添加截图，因为结果应该与百分比示例看起来完全相同。\n\n\
    使用 em 的一个巧妙技巧是相对尺寸会沿嵌套元素级联。例如，修改页面的 aside 元素，使其包含一些嵌套的列表项：\n\n```\n<aside class=\"\
    left\">\n    <ul>\n    <li>one\n        <ul>\n        <li>sub item</li>\n    \
    \    <li>sub item</li>\n        </ul>\n    </li>\n    <li>two\n        <ul>\n\
    \            <li>sub item</li>\n            <li>sub item</li>\n        </ul>\n\
    \    </li>\n    <li>three\n        <ul>\n            <li>sub item</li>\n     \
    \       <li>sub item</li>\n        </ul>\n    </li>\n    </ul>\n</aside>\n```\n\
    \n然后添加以下样式：\n\n```\naside ul {\n    font-size: 0.75em;\n}\n```\n\n4-7. Em 级联示例\n\
    \n你会看到外部 ul 的字体大小是当前默认大小（在截图中为 20px）的 0.75em（15px），而内部 ul 是该大小的 0.75em（11.25px）。虽然这种技术提供了一种绝妙的简写方式来创建可以沿页面结构级联的响应式文本大小，但它需要仔细规划，因为一个位于多个层级深度的元素最终可能会比你预期的更小或更大。\n\
    \n### Rem\n\n`rem` 单位代表“根 em”，单位的尺寸表示方式相同。但“根”意味着相对尺寸是从一个基础元素计算的——即 `html` 元素——而不是直接的包含元素。这为你提供了一个比\
    \ em 更可预测的选择，因为它更容易判断大小是相对于什么的。\n\n例如，让我们尝试将 `rem` 尺寸应用于演示站点。\n\n向 `html` 添加一个\
    \ 12px 的基础字体大小（假设默认为 16px）：\n\n```\nhtml {\n    font-size: 75%;\n}\n```\n\n然后在平板电脑和桌面媒体查询内部，为较大的屏幕尺寸添加字体大小：\n\
    \n```\n@media only screen and (min-width: 768px) {\n    html {\n        font-size:\
    \ 1rem;\n    }\n}\n\n@media only screen and (min-width: 992px) {\n    html {\n\
    \        font-size: 1.25rem;\n    }\n}\n```\n"
