  - '[PAGE 115]


    # Read On


    In this chapter, I''ve introduced typographical concepts that are relevant to
    responsive design, and I''ve shown how they are represented in CSS. I''ve also
    covered the different sizing units that you can use to set these properties, and
    how to make important text on your pages readable. In the next chapter, I''ll
    look at how to do the same with the rest of your page content, such as images
    and videos.'
  - '[PAGE 116]


    # Chapter 5


    # Responsive Images and Video


    The exchange of text-based content brought the web into existence, but images
    and other rich media have kept it evolving and made it what we all know/love/dislike.


    Options for making images responsive has developed rapidly in recent years, with
    the ability to load images perfectly suited to users'' devices. And the addition
    of new HTML elements like `video` has opened up new options for responsive design.
    It''s fresh territory, but with pitfalls, compromises, and new techniques to learn.
    So let''s get going!'
  - '[PAGE 117]


    # # Images


    Images are a powerful communication device, portraying a message, intent, explanation,
    and bringing life to your web pages.


    Images have also been a constant source of anguish for designers (web and print)
    for many years, and while HTML5 has brought a lot of improvements, adding responsive
    images to your web page still requires planning and preparation.


    For this chapter, I''ve replaced the placeholder graphics used up to this point
    on the site with images from royalty free sites to represent what a site with
    real TV shows might look like.


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_117_0.png)


    5-1. Adding show images


    There are issues with the page now that we''ve added real images. The most obvious
    is that, while the layout is still fine, all the images are forced into the same
    dimensions, which means they aren''t taking advantage of the available'
  - "[PAGE 118]\n\nscreen space. The example site is for browsing and watching videos,\
    \ so it makes sense to make the visual content as prominent and easy to see as\
    \ possible.\n\nTo show how to use responsive images, we'll change the demo site\
    \ to have different image sizes and layouts suited to each use case at the breakpoints\
    \ defined in [Chapter 3](#).\n\nFirst, change the CSS and HTML to better accommodate\
    \ the images we'll be adding. Let's give the main content area more space and\
    \ reduce the size of the aside menu:\n\n```\n@media only screen and (min-width:\
    \ 992px) {\n    aside {\n        width: 15%;\n        display: block;\n    }\n\
    \n    section.showslisting {\n        width: 75%;\n    }\n}\n```\n\nAdd the mobile\
    \ first styles for the divs that contain details about a show. This sets a maximum\
    \ width of 480px, centered, with an ideal width of *most* of the screen:\n\n```\n\
    section.tvshow {\n    width: 90%;\n    max-width: 480px;\n    margin: 0 auto;\n\
    \    display: block;\n}\n```\n\nNext, add a media query for the same div when\
    \ displayed on larger screens—still centered and filling most of the screen:"
- md: "## 108 Jump Start Responsive Web Design\n\nAs we jump to a larger screen, let’s\
    \ start showing more than one thumbnail in a row. This actually means that images\
    \ will now be smaller, and the max-width of each div should be half the maximum\
    \ screen size for this media query:\n\n```\n@media only screen and (min-width:\
    \ 480px) {\n    section.tvshow {\n        max-width: 768px;\n    }\n}\n\n@media\
    \ only screen and (min-width: 768px) {\n    section.tvshow {\n        width: 46%;\n\
    \        margin-right: 15px;\n        display: inline-block;\n        max-width:\
    \ 496px; /* The next break point divided by 2*/\n    }\n}\n\n@media only screen\
    \ and (min-width: 992px) {\n    section.tvshow {\n        width: 22%;\n      \
    \  margin-right: 15px;\n        display: inline-block;\n    }\n}\n```\n\nNext\
    \ is the media query for larger screens, where we now show four items per row\
    \ and adjust the div and image sizes accordingly. Finally, change the media query\
    \ for TV and larger screens:\n\n```\n5-2. Chapter5/image_width/layout.css (excerpt)\n\
    \n/* Large Devices, Wide Screens, TVs */\n@media only screen and (min-width: 1800px)\
    \ {\n    section.tvshow {\n        width: 46%;\n        margin-right: 15px;\n\
    \        display: inline-block;\n        max-width: 900px;  /* The next break\
    \ point divided by 2 */\n    }\n}\n```\n\nOkay, now that the containers for the\
    \ images are sorted, we can focus on the images.\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_121_0.png)\n\
    \n5-3. The page restructured at medium screen size\n\n## Responsive Dimensions\n\
    \nChange the image sizing to the following:\n\n```\n.thumbnail {\n    width: 100%;\n\
    \    height: auto;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_122_0.png)\n\
    \nThis will set the image width to 100% of its container's width, and setting\
    \ image's height to auto allows the image to occupy as much vertical space as\
    \ needed to maintain its natural proportions. You'll notice that this means the\
    \ images don't currently all have the same height, which affects the layout. You\
    \ could swap these values to instead fill 100% of the height and fill the width\
    \ automatically. Attempting to make images always fit precise dimensions can be\
    \ a compromising challenge that depends a lot on the source of the images. If\
    \ you're able, it might be best to edit them first so they all have the same dimensions.\n\
    \n```\nUsing `width: 100%` can mean that images will scale larger than their original\
    \ size and render pixelated. To prevent this, try using `max-width` or `max-height`\
    \ on the thumbnail styles relevant to each breakpoint.\n```\n\nSo that's it, you're\
    \ done, right? Unfortunately, no. Inspect one of the images in your web inspector\
    \ and you'll notice that all we're doing is resizing a very large image. Even\
    \ though it looks small, the actual file is still large, adding a lot of page\
    \ weight. Look at the network requests: these five images total nearly **4MB**,\
    \ which is a lot of data for a mobile user to load. To make your images fully\
    \ responsive, you need to make sure the right file is served to the right device.\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_123_0.png)\n\n*5-5. Image sizes*\n\n\
    ## The Right Image for the Right Device\n\nThere are two methods for handling\
    \ images responsively. One is `srcset`, an attribute to the img tag you know already,\
    \ and the other is the new HTML5 picture element. Both methods use media query\
    \ like syntax to select the image most suited to the device capabilities, but\
    \ `srcset` allows the browser to make the final decision on what image to render,\
    \ and `picture` explicitly tells the browser which image to render. For most use\
    \ cases, `srcset` will be all you need, but for design heavy sites when you want\
    \ more control over how a browser renders an image (e.g. cropping an image instead\
    \ of resizing it) then using the `picture` tag will suit you better.\n\nMuch like\
    \ the CSS rules loaded by your media queries, what image sizes you use and support\
    \ is up to you and your use case. The example project is moderately well optimized,\
    \ but could be better. For example, we could reduce the maximum size of images\
    \ loaded on smaller screens. The queries can take the same format as those outlined\
    \ in Chapter 2.\n\nI created each of the images needed for the design manually,\
    \ giving them a width roughly matching the maximum width the image will be displayed\
    \ at:\n\n- **Small Image**: 320px wide.\n- **Medium Image**: 480px wide.\n- **Large\
    \ Image**: 768px wide.\n\nCreating different versions of images manually is tedious,\
    \ but gives you control over what gets shown in each image size. If you’d rather\
    \ automate the generation of these images, there are several options, such as:\n\
    \n- batch processing in an image editor like [Photoshop](https://www.adobe.com/products/photoshop.html)\
    \ or [XnView](https://www.xnview.com/) (Windows).\n- batch processing with a build\
    \ tool such as [Gulp](https://gulpjs.com/).\n- using a plugin for your CMS or\
    \ static site generator, which is likely a wrapper around the popular [imagemagick](https://imagemagick.org/)\
    \ or [OptiPNG](http://optipng.sourceforge.net/) libraries.\n\n### srcset\n\nReplace\
    \ the existing image element with the following:\n\n```\n5-6. Chapter5/srcset/index.html\
    \ (excerpt)\n<section class=\"tvshow\">\n    <h3>Show 1</h3>\n    <img src=\"\
    ../images/show1-medium.jpg\"\n         srcset=\"../images/show1-medium.jpg 480w,\n\
    \                 ../images/show1-small.jpg 320w,\n                 ../images/show1-large.jpg\
    \ 768w\"\n         sizes=\"(max-width: 768px) 480px,\n                (max-width:\
    \ 1800px) 320px, 768px\"\n         class=\"thumbnail\" />\n    <p class=\"showdescription\"\
    >Lorem ipsum dolor sit amet,\n        consectetur adipiscing elit.</p>\n</section>\n\
    ```\n\n> ![Some Homework Icon](image:icon)\n**Some Homework**\nThis example replaces\
    \ one image, and to reduce repetition, I haven’t included code for replacing the\
    \ other four images. You can find the code for the remaining images [in the code\
    \ archive](https://code.jquery.com/) if you want to try replacing the others too.\
    \ Keep the media queries the same and replace the images with the appropriate\
    \ files.\n\nThis requires breaking down, and the layout we’re using also adds\
    \ complexity.\n\nThe first part of the element is normal, as is the last `class`\
    \ property, the second and third lines are the new syntax. `srcset` is designed\
    \ to allow the browser to make the best decisions about what image to display\
    \ based on information you provide it. Each pair in the second line defines the\
    \ images available and tells the browser its width, appended with a w. The third\
    \ line defines the viewport sizes you want to load a particular image at, and\
    \ what image to load.\n\nThe example above declares:\n\n- Up to a viewport width\
    \ of 768px, load an image of 480px width.\n- Between a viewport width of 768 and\
    \ 1800px, load an image of 320px width.\n- If no other rule applies, then load\
    \ an image of 768px.\n\nYou can be more subtle with these declarations, for example:\n\
    \n```\n<img src=\"../images/show1-medium.jpg\"\n     srcset=\"../images/show1-medium.jpg\
    \ 480w,\n     ../images/show1-small.jpg 320w,\n     ../images/show1-large.jpg\
    \ 768w\"\n     sizes=\"(max-width: 768px) 90vw,\n     (max-width: 1800px) 24vw,\
    \ 50vw\"\n     class=\"thumbnail\" />\n```\n\nThis instead declares that at the\
    \ different viewport sizes pick an image that suits best a certain viewport width\
    \ (vw) size. For this design, they are essentially the same, but it gives you\
    \ an idea of how smart you can let your browser be. It's worth noting that this\
    \ smartness can actually cause confusion when testing; I have frequently found\
    \ myself wondering why the tag wasn't working how I expected it to, only to realize\
    \ that it was due to the browser holding on to cached version of the images, or\
    \ optimizing for a retina screen, and again caching those images. To debug what's\
    \ happening while figuring out your `srcsets`, I recommend using incognito / private\
    \ windows, double-checking your screen resolution, and keeping developer tools\
    \ open to see what files the browser is actually loading.\n\nIf this smartness\
    \ is too unpredictable for you and you find yourself needing more control, then\
    \ the `picture` tag is for you."
  mdcn: "\n## 108 快速启动响应式网页设计\n\n当我们切换到更大的屏幕时，让我们开始在一排中显示多个缩略图。这实际上意味着图片将会变小，并且每个\
    \ `div` 的 `max-width` 应该是该媒体查询下最大屏幕尺寸的一半：\n\n```\n@media only screen and (min-width:\
    \ 480px) {\n    section.tvshow {\n        max-width: 768px;\n    }\n}\n\n@media\
    \ only screen and (min-width: 768px) {\n    section.tvshow {\n        width: 46%;\n\
    \        margin-right: 15px;\n        display: inline-block;\n        max-width:\
    \ 496px; /* The next break point divided by 2*/\n    }\n}\n\n@media only screen\
    \ and (min-width: 992px) {\n    section.tvshow {\n        width: 22%;\n      \
    \  margin-right: 15px;\n        display: inline-block;\n    }\n}\n```\n\n接下来是用于更大屏幕的媒体查询，我们现在每行显示四个项目，并相应地调整\
    \ `div` 和图片的大小。最后，更改适用于电视和更大屏幕的媒体查询：\n\n```\n5-2. Chapter5/image_width/layout.css\
    \ (摘录)\n\n/* 大型设备、宽屏、电视 */\n@media only screen and (min-width: 1800px) {\n   \
    \ section.tvshow {\n        width: 46%;\n        margin-right: 15px;\n       \
    \ display: inline-block;\n        max-width: 900px;  /* The next break point divided\
    \ by 2 */\n    }\n}\n```\n\n好了，现在图片的容器已经设置好了，我们可以专注于图片本身。\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_121_0.png)\n\
    \n5-3. 在中等屏幕尺寸下重构的页面\n\n## 响应式尺寸\n\n将图片尺寸设置更改为以下内容：\n\n```\n.thumbnail {\n   \
    \ width: 100%;\n    height: auto;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_122_0.png)\n\
    \n这会将图片宽度设置为其容器宽度的 100%，并将图片的高度设置为 `auto`，允许图片占据必要的垂直空间以保持其自然比例。你会注意到，这意味着目前所有图片的高度并不相同，这会影响布局。你可以交换这些值，改为填充高度的\
    \ 100% 并自动填充宽度。试图让图片总是适应精确的尺寸可能是一个需要妥协的挑战，这在很大程度上取决于图片的来源。如果可能的话，最好先编辑它们，使它们都具有相同的尺寸。\n\
    \n```\n使用 `width: 100%` 可能意味着图片会按比例放大超过其原始尺寸并导致像素化。为防止此情况，请尝试在与每个断点相关的缩略图样式上使用\
    \ `max-width` 或 `max-height`。\n```\n\n所以，就这样，你完成了，对吧？遗憾的是，并非如此。在你的网页检查器中查看其中一张图片，你会注意到我们所做的一切只是调整一个非常大图片的大小。即使它看起来很小，实际文件仍然很大，增加了大量的页面重量。看看网络请求：这五张图片总共接近\
    \ **4MB**，对于移动用户来说加载的数据量非常大。要使你的图片完全响应式，你需要确保为正确的设备提供正确的文件。\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_123_0.png)\n\
    \n*5-5. 图片尺寸*\n\n## 为正确的设备提供正确的图片\n\n有两种处理响应式图片的方法。一种是 `srcset`，这是你已经熟悉的 `img`\
    \ 标签的一个属性；另一种是新的 HTML5 `picture` 元素。两种方法都使用类似媒体查询的语法来选择最适合设备能力的图片，但 `srcset` 允许浏览器最终决定渲染哪张图片，而\
    \ `picture` 则明确告诉浏览器渲染哪张图片。对于大多数用例，`srcset` 将是您所需要的全部，但对于那些希望更多地控制浏览器如何渲染图片（例如，裁剪图片而不是调整其大小）的设计密集型网站，使用\
    \ `picture` 标签会更适合你。\n\n就像你的媒体查询加载的 CSS 规则一样，使用和支持哪些图片尺寸取决于你和你的用例。示例项目做了适度的优化，但可以更好。例如，我们可以减小在较小屏幕上加载图片的最大尺寸。查询可以采用第\
    \ 2 章中概述的相同格式。\n\n我手动创建了设计所需的每张图片，赋予它们一个大致与图片将要显示的最大宽度相匹配的宽度：\n\n- **小图片**：320px\
    \ 宽。\n- **中等图片**：480px 宽。\n- **大图片**：768px 宽。\n\n手动创建不同版本的图片很繁琐，但它让你能够控制每种图片尺寸中显示的内容。如果你想自动生成这些图片，有几种选择，例如：\n\
    \n- 在 [Photoshop](https://www.adobe.com/products/photoshop.html) 或 [XnView](https://www.xnview.com/)（Windows）等图像编辑器中进行批处理。\n\
    - 使用 [Gulp](https://gulpjs.com/) 等构建工具进行批处理。\n- 使用你的 CMS 或静态站点生成器的插件，这很可能是对流行的\
    \ [imagemagick](https://imagemagick.org/) 或 [OptiPNG](http://optipng.sourceforge.net/)\
    \ 库的封装。\n\n### srcset\n\n将现有的图片元素替换为以下内容：\n\n```\n5-6. Chapter5/srcset/index.html\
    \ (摘录)\n<section class=\"tvshow\">\n    <h3>Show 1</h3>\n    <img src=\"../images/show1-medium.jpg\"\
    \n         srcset=\"../images/show1-medium.jpg 480w,\n                 ../images/show1-small.jpg\
    \ 320w,\n                 ../images/show1-large.jpg 768w\"\n         sizes=\"\
    (max-width: 768px) 480px,\n                (max-width: 1800px) 320px, 768px\"\n\
    \         class=\"thumbnail\" />\n    <p class=\"showdescription\">Lorem ipsum\
    \ dolor sit amet,\n        consectetur adipiscing elit.</p>\n</section>\n```\n\
    \n> ![Some Homework Icon](image:icon)\n**一些作业**\n此示例替换了其中一张图片，为了减少重复，我没有包含替换其他四张图片的代码。如果你想尝试替换其他图片，可以在[代码档案](https://code.jquery.com/)中找到剩余图片的代码。保持媒体查询相同，并将图片替换为相应的文件。\n\
    \n这需要分解，我们使用的布局也增加了复杂性。\n\n该元素的第一部分是正常的，最后的 `class` 属性也是，第二和第三行是新的语法。`srcset`\
    \ 旨在让你根据提供的信息，让浏览器做出关于显示哪张图片的最佳决策。第二行中的每对定义了可用的图片并告诉浏览器其宽度，以 `w` 结尾。第三行定义了你希望加载特定图片的视口大小，以及要加载哪张图片。\n\
    \n上面的示例声明：\n\n- 最高视口宽度为 768px 时，加载宽度为 480px 的图片。\n- 视口宽度在 768px 到 1800px 之间时，加载宽度为\
    \ 320px 的图片。\n- 如果没有其他规则适用，则加载宽度为 768px 的图片。\n\n你可以让这些声明更精细，例如：\n\n```\n<img src=\"\
    ../images/show1-medium.jpg\"\n     srcset=\"../images/show1-medium.jpg 480w,\n\
    \     ../images/show1-small.jpg 320w,\n     ../images/show1-large.jpg 768w\"\n\
    \     sizes=\"(max-width: 768px) 90vw,\n     (max-width: 1800px) 24vw, 50vw\"\n\
    \     class=\"thumbnail\" />\n```\n\n这改为声明在不同的视口尺寸下，选择最适合某个视口宽度（vw）大小的图片。对于这个设计，它们本质上是相同的，但它让你了解到你可以让浏览器变得多么智能。值得注意的是，这种智能在测试时实际上可能会引起混淆；我经常发现自己想知道为什么标签没有按预期工作，结果才意识到是因为浏览器保留了图片的缓存版本，或者为\
    \ Retina 屏幕进行了优化，并再次缓存了这些图片。为了在调试 `srcset` 时了解正在发生的情况，我建议使用隐身/无痕窗口，仔细检查你的屏幕分辨率，并保持开发者工具打开，以查看浏览器实际加载了哪些文件。\n\
    \n如果这种智能对你来说太不可预测，你发现自己需要更多控制，那么 `picture` 标签就是为你准备的。\n"
