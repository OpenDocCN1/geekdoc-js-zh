    var i;\nfor (i = 0; i < images.length; i++) {\n    images[i].remove();\n}\n}\n\
    ```\n\nAdd the new battery-save styling to your CSS, reducing the brightness of\
    \ the page text:\n\n```\n.battery-save {\n    color: gray;\n}\n```\n\nWhether\
    \ color schemes actually save battery life is a controversial topic that depends\
