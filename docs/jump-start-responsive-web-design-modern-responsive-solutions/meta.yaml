  md: "Jump Start Responsive Web Design\n\n# Using a Larger Image as a Poster\n\n\
    Replacing the poster image with the large variant will mean the poster image scales\
    \ across all file sizes, but it does mean that we're loading an unnecessarily\
    \ large file at certain breakpoints.\n\nIf you want to style the poster element\
    \ further (to change the dimensions or add padding), you can target it directly\
    \ with the following selector:\n\n```\nvideo[poster] {\n    ...\n}\n```\n\n# Background\
    \ Image\n\nA way to create a responsive image representation of the video is to\
    \ remove the poster image and then instead set a background image for the video,\
    \ allowing you use media queries to load the appropriate image.\n\nYou'll need\
    \ to set a background image inline within the `video` tag, or create a CSS style\
    \ for each video to set the image, because *each* video needs a different image\
    \ set as a background.\n\nWith an inline style:\n\n```\n<video controls preload=\"\
    none\"\n    style=\"background: transparent\n    url('../images/show1-large.jpg')\n\
    \    0 0 / cover no-repeat;\">\n    ...\n</video>\n```\n\nAnd with a CSS class:"
