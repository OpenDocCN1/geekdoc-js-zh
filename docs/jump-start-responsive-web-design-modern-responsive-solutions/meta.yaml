  md: "# Based on Network\n\nThe example site is a video site, and while we currently\
    \ have the clickable images allowing a viewer to only load a video file when they\
    \ wish too, we could make this more flexible based on the device's network connection.\
    \ Or even better, we could create a preference that users can set if they want\
    \ this feature.\n\nThe Network Information API is not widely supported (currently\
    \ only Chrome on Android), but browser manufacturers move quickly, so it may be\
    \ better supported by the time you decide to implement it.\n\nFirst, the easiest\
    \ (and most supported) check is to see if the user is online at all:\n\n```\n\
    if (navigator.onLine) {\n    // Do something\n}\n```\n\nGranted, this has limited\
    \ use in the example, unless you want to check if the user has become disconnected\
    \ before attempting to play a video. Still, it's a good idea to cover all bases.\n\
    \nWhile the Network Information API lets you check all sorts of values, it's not\
    \ much use right now. There are third-party (paid) services for checking internet\
    \ speeds, but currently, the “best” solution is using complex code to check how\
    \ long an image takes to load, and calculate speed from that. I won't reproduce\
    \ it here, but if you're interested, there's some helpful information on Stack\
    \ Overflow.\n\nBrowser Support\nWhile the Network Information API is still in\
    \ a draft state, it's an active proposal, so by the time of reading it may be\
    \ better supported. You can find out its current status on the API's community\
    \ group site."
  merge: -1
  pgno: 150
- img_proc: true
  md: "# User Preference\n\nYou have likely experienced **cookies** in your day-to-day\
    \ web browsing. Cookies are typically used to retain state such as preferences.\
    \ They can be set or read by the client or server and are transmitted within every\
    \ HTTP request. This example will read user preferences and display page elements\
    \ accordingly.\n\nOften the browser will write a cookie when a user submits a\
    \ form or undertakes some other action. For this example, we'll write a setting\
    \ manually:\n\n```\nwindow.addEventListener(\"load\",function(event) {\n    document.cookie\
    \ = \"mature=no\";\n    ...\n},false);\n```\n\nThis determines if the user wants\
    \ to see videos considered \"mature\" content. Using this value, we can use the\
    \ same technique for selectively rendering TV shows.\n\nTo test, add the `mature`\
    \ class to the end of the class list of a couple of the `tvshow` sections, and\
    \ add `all-ages` to the end of all the others. In the `index.js` loop that renders\
    \ the TV shows, read the cookie value and hide/show the appropriate shows:\n\n\
    ```\nfor (i = 0; i < tvShows.length; i++) {\n    tvShow = tvShows[i];\n    var\
    \ mature = getCookie('mature');\n    if (mature == 'no' && tvShow.classList[2]\
    \ !=\n        'mature') {\n        ...\n    }\n}\n```\n\nAs all cookies are stored\
    \ in the same property, you can use a regular expression to find and read the\
    \ particular cookie you want:"
  merge: -1
  pgno: 151
- img_proc: true
  md: "```\nfunction getCookie(name) {\n    var regexp = new RegExp(\"(?:^\" + name\
    \ + \"|;\\s*\" + name + \")=(.*?)(?:;|$)\", \"g\");\n    var result = regexp.exec(document.cookie);\n\
    \    return (result === null) ? null : result[1];\n}\n```\n\n# Ambient Light\n\
    \nCombining the [Ambient Light Sensor API](https://www.w3.org/TR/ambient-light/)\
    \ with time detection could be a great way to adjust page or video brightness\
    \ dependent on the time of day and the light available to a viewer. On many mobile\
    \ devices, this is now handled by the operating system, but you could give it\
    \ a boost or add similar functionality for computer users.\n\n> Security Concerns\n\
    \nThere have been security issues recently highlighted with the Ambient Light\
    \ Sensor API. I recommend you read [the W3C specification](https://www.w3.org/TR/ambient-light/)\
    \ to check its future.\n\nLet’s make an example that changes the colors of the\
    \ page based on the current ambient luminosity (or the brightness of the surrounding\
    \ area).\n\nReplace the contents of the current `index.js` file with the following,\
    \ which adds a class to the page body depending on the level of ambient light—the\
    \ `luminosity` value:\n\n```\nwindow.addEventListener(\"devicelight\", function\
    \ (event) {\n    var luminosity = event.value;\n\n    if (luminosity <= 5) {\n\
    \        document.body.className = \"darkness\";\n    } else if (luminosity <=\
    \ 50) {\n        document.body.className = \"dim\";\n    } else if (luminosity\
    \ <= 1000) {\n        document.body.className = \"bright\";\n```"
  merge: -1
  pgno: 152
