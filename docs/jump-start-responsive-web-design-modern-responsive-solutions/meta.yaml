  md: "# 72 Jump Start Responsive Web Design\n\ndevelopers for flexible (I use this\
    \ term loosely) page layouts was using HTML tables to define page areas with rows\
    \ and columns, but these were terrible for accessibility. The grid layout is something\
    \ of a modern re-interpretation of that concept.\n\n> **Browser Support for Grid\
    \ Layout**\n\nGrid shipped for all the newest versions of the major browsers in\
    \ early 2017, so a fallback strategy is required if your layouts need to be supported\
    \ in older browsers.\nYou can [check online](https://example.com) for details\
    \ on which browser versions do and don’t support Grid.\n\nLet’s try applying the\
    \ grid layout to the demo site, starting with [the code from the beginning of\
    \ this chapter](https://example.com).\n\nAgain, make a container div inside the\
    \ body to contain the layout:\n\n```\n...\n<div class=\"container\">\n...\n</div>\n\
    ...\n```\n\nMove the aside from inside main to outside of it. This lets you treat\
    \ it like a proper column in its own right:\n\n```\n3-20. Chapter3/grid/index.html\
    \ (excerpt)\n\n...\n</main>\n<aside class=\"left\">\n    <ul>\n    <li>one</li>\n\
    \    <li>two</li>\n    <li>three</li>\n    </ul>\n</aside>\n```"
  merge: -1
  pgno: 84
- img_proc: true
  md: "In the CSS, change the `display` type to `grid`:\n\n```\n.container {\n   \
    \ display: grid;\n}\n```\n\nNow the grid display gets really cool. Add the following:\n\
    \n```\n.container {\n    display: grid;\n    grid-template-columns: 66% 33%;\n\
    }\n```\n\n> **Removing Sizing Overrides**\nAs with the flexbox layout, you can\
    \ also take this opportunity to remove all the other sizing overrides in media\
    \ queries.\n\nAnd in one simple CSS property, you've removed the need for two\
    \ of the CSS classes used so far. The `grid-template-columns` property gives you\
    \ even more possibilities. For example:\n\n+   - You can use any standard sizing\
    \ unit for defining the column, including `auto` to fill remaining space.\n- You\
    \ can use `fr` (“fractional units”) to let the grid proportionately fill space.\
    \ So you could rewrite this grid as `grid-template-columns: 2fr 1fr;`, which means\
    \ that the first column will fill two-thirds of the space, and the second one\
    \ third.\n\nGreat, but if you look at the demo site now, you'll notice that the\
    \ rows in the design that don't have a 66/33 split don't look right. This is because\
    \ you also need to define the rows with similar syntax:"
  merge: -1
  pgno: 85
- img_proc: true
  md: "74  Jump Start Responsive Web Design\n\n```\n3-22. Chapter3/grid/layout.css\
    \ (excerpt)\n\n.container {\n    display: grid;\n    grid-template-columns: 66%\
    \ 33%;\n    grid-template-rows: 80px 80px auto 20px;\n}\n```\n\n> **How Many Rows?**\n\
    \nThis is the first example where we've needed to explicitly define rows, and\
    \ there are a couple of ways you could do it. I suggest that there are four rows:\
    \ the title, the top menu, the introductory text and TV shows, and the footer.\
    \ If you want to change these divisions (for example, splitting the description\
    \ and TV shows), feel free to do so.\n\nThis syntax specifies a set height for\
    \ three elements and then lets the remaining TV shows element fill the remaining\
    \ empty space.\n\nBut again, if you load the page in the browser, little has changed.\
    \ In fact, the `footer` has now jumped up the page. This is because there's one\
    \ more step needed—to add the sub-elements into the grid:"
  merge: -1
  pgno: 86
