    \ `left` 类以及任何已使用的清除样式。\n\n## 使用框架让网格更简单\n\n在许多情况下，按照本章描述的方式创建网格工作量并不算太大，但开发者和设计师总是希望尽可能减少重复性任务。一个简单的解决方案是创建自己的、适合你的网格系统，并在项目中重用它。当然，其他开发者和设计师也曾有过同样的想法，并在网络上提供了他们的网格系统（或框架）。我将介绍其中两个流行的框架，但这是一个众说纷纭且变化迅速的话题。我的目标是向你展示框架*可能*如何帮助你在重复性任务上节省时间，而不是详细讨论哪一个“更好”（这个决定需要你自己来做）。许多这些框架提供的不仅仅是响应式网格，还包括其他响应式元素，如字体、图标和可重用组件。你可能更喜欢某个框架而不是另一个，因为它能为你的网页其他方面提供更好的选择。\n\
    \n## Bootstrap\n\n虽然不是第一个响应式设计框架，但Bootstrap是使用最广泛的。你可能在不知不觉中见过它的应用。它于2011年由Twitter发布，使用12列网格，提供弹性盒布局，并且在GitHub上曾一度是最受欢迎的仓库之一。\n\
    \n流行是Bootstrap最大的优势，也是其劣势。它易于使用，鼓励良好的布局和CSS实践，拥有丰富的文档和社区支持。但你的网站很容易变得与其他所有使用Bootstrap的网站看起来非常相似。\n\
    \n### 安装Bootstrap\n\nBootstrap的默认下载可能会为你的页面增加不少负担，因此我建议你仔细阅读说明，确保获得针对你的使用场景优化得最好的版本。对于这个示例，我将使用CDN选项，因为它最简单。如果你想跟着做，请添加Bootstrap页面上提供的行，并移除当前CSS文件的链接。\n\
    \n你可以在此处找到简化的（无媒体查询）重构后的index.html页面[here](#)作为示例。你失去了自定义字体和背景颜色（这些很容易重新添加），但你无需太多努力就获得了一个响应式网格（Bootstrap也使用12列网格），并且它的工作方式与我们自定义的网格类似。Bootstrap还有许多其他样式可用于处理图像、确定在不同网格尺寸下显示哪些网格元素等等。\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_93_0.png)\n\n如果你有兴趣了解更多关于Bootstrap的知识，我推荐SitePoint的[Jump\
    \ Start Bootstrap](#)。\n\n## Foundation\n\n[Foundation](#) 于2011年由Zurb（一家互动设计机构）创建。它也提供了许多功能（包括可选的弹性盒），有定期的发布和良好的社区，但使用范围不如前者广泛。它提供了更多的布局灵活性（基于12列网格），但通常需要更多的类和布局元素来实现这一点。\n\
    \n### 安装Foundation\n\n与Bootstrap一样，Foundation可能会增加页面的负担，因此请确保你[下载了适合你的最佳配置](http://example.com)。\n\
    \n移除当前样式表，并添加新样式表的链接：\n\n```\n<link rel=\"stylesheet\" href=\"foundation/css/foundation.css\"\
    >\n<link rel=\"stylesheet\" href=\"foundation/css/app.css\">\n```\n\n你可以在此处找到Foundation简化的（无媒体查询）重构后的index.html文件[here](http://example.com)作为示例。同样，你失去了可以替换的自定义颜色，但你应该能够看到需要添加的额外元素和类。\n\
