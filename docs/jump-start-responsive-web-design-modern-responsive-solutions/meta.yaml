- img_proc: true
  md: "```\n.column-11 {\n    width: 91.5333333333%;\n}\n\n.column-12 {\n    width:\
    \ 100%;\n}\n```\n\nAgain, don't worry about remembering what these values are.\
    \ Once they're defined, all that's needed is to use the CSS class.\n\n> Saving\
    \ Some Legwork\n\nYou could also use a CSS preprocessor—such as Sass or Less—that\
    \ provides an extra framework to help generate repetitive and complex CSS for\
