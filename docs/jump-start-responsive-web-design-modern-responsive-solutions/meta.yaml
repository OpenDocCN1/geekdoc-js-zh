  - "[PAGE 42]\n\n```\n@media all and (orientation: landscape) {\n    ...\n}\n```\n\
    \nAnd:\n\n```\n@media all and (orientation: portrait) {\n    ...\n}\n```\n\n#\
    \ color\n\nThis feature checks if a device can support a certain bit-level of\
    \ color. For example, this is how to check that a device supports at least 8-bits\
    \ of color (that is, 256 colors):\n\n```\n@media all and (min-color: 8) {\n  \
    \  ...\n}\n```\n\n# color-index\n\nThis plays a role similar to color, but lets\
    \ you check for the number of colors instead of the bit-level:\n\n```\n@media\
    \ all and (min-color-index: 256) {\n    ...\n}\n```"
  - "[PAGE 43]\n\n# monochrome\n\nAgain, similar to color, monochrome lets you check\
    \ for the levels of gray in a device:\n\n```\n@media all and (min-monochrome:\
    \ 8) {\n    ...\n}\n```\n\n# resolution\n\nThis feature targets devices that have\
    \ high-resolution screens:\n\n```\n@media all and (min-resolution: 120dpi) {\n\
    \    ...\n}\n```\n\n# scan\n\nThe scan media feature lets you check the scanning\
    \ process of TVs, the options being interlace or progressive:\n\n```\n@media all\
    \ and (scan: progressive) {\n    ...\n}\n```\n\n# grid\n\ngrid is used for checking\
    \ if a device is a terminal-like device. This also includes older phones (that\
    \ is, non-smartphones), accessible phones (for those with poor vision), and braille\
    \ devices. It returns a boolean value if true:"
  - "[PAGE 44]\n\n```\n@media grid {\n    ...\n}\n```\n\nAs you can see, through combinations\
    \ of dimension- and feature-based queries, you can construct complex stylesheets\
    \ to target a multitude of devices effectively with styles that work most efficiently\
    \ for them. This is the main point of media queries: they allow you to selectively\
    \ load CSS styles for particular device configurations.\n\n# Streamlining the\
    \ Example App\n\nNow that you have a basic understanding, let's continue to build\
    \ upon the media queries added earlier to make the example site tidier.\n\nFirst,\
    \ you can consolidate the queries already written, moving the classes into two\
    \ groups of media queries:\n\n```\n/* Media Queries */\n/* For example, desktop\
    \ devices */\n@media screen and (min-width: 680px) {\n    aside {\n        width:\
    \ 33%;\n    }\n\n    section.showslisting {\n        width: 66%;\n    }\n}\n\n\
    /* For example, medium-width screens or smaller screens in landscape */\n@media\
    \ screen and (max-width: 680px), screen and (orientation: landscape) and (max-width:\
    \ 750px) {\n    aside {\n        display: none;\n    }\n}\n```"
  - "[PAGE 45]\n\n```\nsection.showslisting {\n    width: 100%;\n}\n}\n```\n\nMuch\
    \ tidier! You can keep adding new styles for each query into these sections.\n\
    \nLet's look back to our demo site specification outlined in [Chapter 1] for what\
    \ else needs to be optimized for each screen size. The next step will be hiding\
    \ the TV show description on small screens, and shorten it on medium-sized screens.\n\
    \nIt would be a lot easier to do this if the description text had a class, so\
    \ add one to each instance of the p tag that contains the show description:\n\n\
    ```\n<section class=\"tvshow\">\n    <h3>Show</h3>\n    <img src=\"http://placehold.it/350x150\"\
    \n    class=\"thumbnail\">\n    <p class=\"showdescription\">Lorem ipsum dolor\
    \ sit amet,\n    consectetur adipiscing elit.</p>\n</section>\n```\n\nLet's add\
    \ new media queries to accommodate the various sizes we aim to support, and, in\
    \ doing so, tidy up the existing ones.\n\nThe specific widths at which we want\
    \ our design to reflow are known as **breakpoints**. The breakpoints we'll add\
    \ are not exhaustive: there's a huge range of device sizes, and more are appearing\
    \ all the time, so it's futile to try to target each device with separate queries.\
    \ A better approach is to assess the points at which your design needs to reflow,\
    \ and then create media queries for those breakpoints. This is the beauty of responsive\
    \ web design: you can ensure that each device will get an appropriate layout without\
    \ having to design separately for each device.\n\nAdd the following breakpoints\
    \ and refactor our existing styles into them:"
  - "[PAGE 46]\n\n2-5. Chapter2/demo_create/layout.css (excerpt)\n\n```\n/* Media\
    \ Queries */\n\n/* For example, older phones */\n@media only screen and (min-width:\
    \ 320px) {\n    aside {\n        display: none;\n    }\n\n    section.showslisting\
