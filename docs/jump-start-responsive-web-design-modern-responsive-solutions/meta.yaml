- img_proc: true
  md: "Resize the page. Notice that you now have the same effect as with the first\
    \ fluid grid example, but have removed a lot of CSS from the media queries. With\
    \ one set of flex properties, the sizing of page elements is handled for us. All\
    \ without the need for any JavaScript!\n\nIf you were to restructure the page,\
    \ you could remove the `flex-basis` properties, but nesting flex containers with\
    \ different row/column directions would involve further div elements, so weigh\
    \ up your HTML complexity versus CSS complexity.\n\nNext, here are the styles\
    \ for the TV show listing:\n\n```\nsection.showlisting {\n    display: flex;\n\
    \    flex-wrap: wrap;\n    flex-direction: row;\n    margin-bottom: 25px;\n}\n\
    \nsection.tvshow {\n    width: 125px;\n    height: auto;\n}\n```\n\nThis sets\
    \ the `showlistings` section as another flex container that wraps any items that\
    \ don’t fit onto one line—since, by default, flex will try to fit all items onto\
    \ one line.\n\nAt this point, you can also delete the `left` class from your HTML\
    \ and CSS, as it’s no longer needed."
