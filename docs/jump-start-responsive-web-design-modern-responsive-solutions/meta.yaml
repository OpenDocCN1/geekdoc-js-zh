    \ example, a TV show episode might have the following values stored in a back\
    \ end:\n\n- episode name\n- series\n- length\n- age rating\n\n## 18 Jump Start\
    \ Responsive Web Design\n\n- file size\n- show title\n- year\n- country of origin\n\
    - description\n- tags\n- categories\n\nBut the mobile version of the site will\
    \ only display the values most relevant to a user on a mobile device, ignoring\
    \ other values only relevant in a different context:\n\n## 19 The Meaning and\
    \ Purpose of Responsive Web Design\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_31_0.png)\n\
    \n1-15. Mobile version of site\n\n```html\n<section class=\"left\">\n    <h3>Show</h3>\n\
    \    <img src=\"http://placehold.it/125x150\"\n    class=\"thumbnail\">\n</section>\n\
    ```\n\nThe **aside** is for supplemental information, such as contacting support\
    \ and account information. The mobile version of the site is optimized for browsing\
    \ and watching videos, so the **aside** isn't displayed. This layout isn't the\
    \ only possibility, of course. You could, for example, choose to display the *aside*\
    \ at the bottom of the screen (which we'll cover when looking at grid systems).\n\
    \nAs the screen size decreases, the TV show descriptions get increasingly curtailed\
    \ to bring more attention to the thumbnails, which are resized appropriately for\
    \ a mobile device.\n\nIf you're interested in learning more about HTML5 and page\
    \ structure, I recommend you read SitePoint's *Jump Start HTML5*.\n\n### Ready\
    \ to Respond?\n\nIn this chapter, I've looked at the need for, and history of,\
    \ responsive design. I've covered the sorts of devices your website now needs\
    \ to support, and introduced the demo site I'll use to demonstrate responsive\
    \ web design principles throughout the rest of the book. We also took a brief\
    \ look at structuring a page with HTML5. Now we're ready to dig into the building\
    \ blocks of responsive design, which is the focus of the following chapter.\n\n\
    # Chapter 2\n\n## The Building Blocks of Responsive Design\n\nThere are two main\
    \ building blocks at the heart of responsive web design: media queries and viewports.\n\
    \n**Media queries** represent the glue that joins a lot of other responsive concepts\
    \ and tools together. They're a simple but powerful concept, allowing you to detect\
    \ device properties, define rules, and load different CSS properties based on\
    \ them. For example, you can optimize a navigation menu for different devices,\
    \ converting a full horizontal menu on desktop browsers to the “hamburger” menu\
    \ often encountered on mobile devices.\n\n**Viewports** are less complex, allowing\
    \ you to define the size and scaling factor of a web page appropriately, no matter\
    \ what the size of the device being used to view the page is. Without them, media\
    \ queries would only be partially useful.\n\nThis chapter will introduce media\
    \ queries first, and then show how you can make them work better for you by defining\
    \ a viewport.\n\n### Media Types\n\nYou can invoke media query dependent styles\
    \ in several ways, most commonly with the HTML link element linking to one or\
    \ more CSS files, or from directly within a CSS file with `@import`.\n\nIn HTML,\
    \ this example will load the `style.css` file if the query is true, which it will\
    \ be on all device types:\n\n```html\n<link rel=\"stylesheet\" media=\"all\" href=\"\
    /style.css\">\n```\n\nIn the following example, `@import` does the same, but from\
    \ within a CSS file:\n\n```css\n@import url(\"/style.css\") all;\n```\n\nIn the\
    \ example below, the `@media` CSS rule contains a specific set of selectors that\
    \ will load if the query is true:\n\n```css\n@media all {\n    ...\n}\n```\n\n\
    The `all` in these queries is the **media type**. There are four media types available\
    \ (at the time of writing):\n\n- `print`: for print versions of pages\n- `screen`:\
    \ for computer, tablet and phone screens\n- `speech`: for screen readers that\
    \ read pages to the user\n- `all`: for all of the above\n\nAdding a media type\
    \ allows you to specify what types of devices the query applies to. These are\
    \ broad and don't allow for a lot of control. To target devices more specifically,\
    \ you add expressions to these media types.\n\n### Creating a Query\n\nLet's try\
    \ something more useful. The aside to the main content in RWDflix is designed\
    \ to show announcements and news. Mobile and tablet visitors probably want to\
    \ focus on watching shows and nothing else, so let's hide this element for users\
    \ of smaller screened devices.\n\n> ### Method Used in This Book\n\nFor the remainder\
    \ of this chapter, I'll use the @media method shown above for media queries. It's\
    \ a personal preference, and as an experiment, you might like to try re-writing\
    \ the examples using other methods.\n\nRemove the current aside CSS class and\
    \ replace it with the following media queries:\n\n```css\n@media screen and (min-width:\
    \ 680px) {\n    aside {\n        width: 33%;\n    }\n}\n\n@media screen and (max-width:\
    \ 680px) {\n    aside {\n        display: none;\n    }\n}\n```\n\nThis pair of\
    \ media queries sets the aside element to a width of 33% if the screen is wider\
    \ than 680px (by asking if the screen is *at least* 680px wide with min-width),\
    \ and hides it if the screen is narrower than 680px (asking if the screen is *at\
    \ most* 680px wide with max-width).\n\n## 24 Jump Start Responsive Web Design\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_36_0.png)\n\n2-1. The `aside` element\
    \ hidden on smaller screens\n\nNext, make the TV listings fill the screen width\
    \ when the aside isn't showing:\n\n```css\nsection.showslisting {\n    margin-bottom:\
    \ 25px;\n}\n\n@media screen and (min-width: 680px) {\n    section.showslisting\
    \ {\n        width: 66%;\n    }\n}\n```"
  mdcn: "\n## 14 响应式网页设计快速入门\n\n让我们看看桌面网站的一个简化版本。这是一个精简的副本，我们将在下一章开始使用它进行操作：\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_26_0.png)\n\
    \n1-9. 网站的当前桌面版本\n\n以及其代码：\n\n```html\n<body>\n<header><h1>Site Name</h1></header>\n\
    \n<nav>...</nav>\n\n<main>\n    <section>...</section>\n    <aside>...</aside>\n\
    </main>\n\n<footer>...</footer>\n\n</body>\n</html>\n```\n\n以下是HTML元素在页面上的位置：\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_27_0.png)\n\n它们的功能如下：\n\n- `header`\
    \ 元素用于放置网站名称、标志等。页面的其他部分也可以有自己的 `header` 元素。\n- `nav` 元素用于导航链接，例如顶部、侧边或页脚菜单。\n\
    \n## 16 响应式网页设计快速入门\n\n- `section` 元素用于包含一篇文章的主要内容或页面的一个重要区域。\n- `aside` 元素定义了一个与主要部分相关的小型子区域。\n\
    - `main` 元素包裹了页面独有的其他元素。在我们的示例中，这些是 `section` 和 `aside` 元素。其他元素将在其他页面中重复出现。\n\
    - `footer` 元素用于放置网站的法定名称、日期等。页面的其他部分也可以有自己的 `footer` 元素。\n\nHTML5规范列出了其他具有特定功能的语义元素，我们将在本书中介绍其中的许多。一个结构良好的页面对于响应式设计非常重要，同时也有助于提升可访问性和SEO。\n\
    \n以下是更多以语义方式组织的页面内容：\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_28_0.png)\n\n\
    1-12. 电视剧页面\n\n首先，我为页面添加了一个标题，这是一个h2，因为它是页面上的第二级标题，仅次于作为h1的主站点标题。\n\n每个单独的电视剧都有自己的部分，在另一个标题下（但这次是h3，因为它比h2低一级），并附有一张图片和简短描述。\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_29_0.png)\n\n```html\n1-14. Base/index.html\n\
    <section class=\"left\">\n    <h3>Show</h3>\n    <img src=\"http://placehold.it/350x150\"\
    \n         class=\"thumbnail\">\n    <p>Lorem ipsum dolor sit amet, consectetur\n\
    \       adipiscing elit.</p>\n</section>\n```\n\n一个典型的现代应用程序由后端（存储数据）和一个或多个显示或使用该数据的应用程序组成。它们包括响应式网页、原生移动应用程序和其他后端系统。正如你将在本书中看到的，并非所有场景都会使用或显示所有可用数据，而是只显示与其使用场景最相关的数据。例如，一个电视剧剧集可能在后端存储以下值：\n\
    \n- 剧集名称\n- 剧集系列\n- 时长\n- 年龄分级\n\n## 18 响应式网页设计快速入门\n\n- 文件大小\n- 剧名\n- 年份\n- 产出国\n\
    - 描述\n- 标签\n- 分类\n\n但移动版本的网站只会显示对移动设备用户最相关的值，忽略其他仅在不同场景下相关的值：\n\n## 19 响应式网页设计的含义与目的\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_31_0.png)\n\n1-15. 网站的移动版本\n\n```html\n\
    <section class=\"left\">\n    <h3>Show</h3>\n    <img src=\"http://placehold.it/125x150\"\
    \n    class=\"thumbnail\">\n</section>\n```\n\n**aside** 用于补充信息，例如联系支持和账户信息。网站的移动版本针对浏览和观看视频进行了优化，因此不显示\
    \ **aside**。当然，这种布局并非唯一的选择。例如，你可以选择将 *aside* 显示在屏幕底部（我们将在讨论网格系统时介绍这一点）。\n\n随着屏幕尺寸减小，电视剧描述会被越来越精简，以便将更多注意力集中在缩略图上，这些缩略图会为移动设备进行适当的大小调整。\n\
    \n如果你有兴趣了解更多关于HTML5和页面结构的知识，我建议你阅读SitePoint的 *《HTML5 快速入门》* 。\n\n### 准备好响应了吗？\n\
    \n在本章中，我探讨了响应式设计的必要性和历史。我介绍了你的网站现在需要支持的各种设备类型，并引入了我将在本书其余部分用于演示响应式设计原则的演示站点。我们还简要了解了如何使用HTML5构建页面结构。现在，我们准备好深入探讨响应式设计的构建模块，这是下一章的重点。\n\
    \n# 第 2 章\n\n## 响应式设计的构建模块\n\n响应式网页设计的核心有两个主要的构建模块：媒体查询和视口。\n\n**媒体查询** 代表了将许多其他响应式概念和工具粘合在一起的粘合剂。它们是一个简单但强大的概念，允许你检测设备属性、定义规则，并基于这些属性加载不同的CSS属性。例如，你可以为不同的设备优化导航菜单，将桌面浏览器上的完整水平菜单转换为移动设备上常见的“汉堡”菜单。\n\
    \n**视口** 没那么复杂，它允许你适当地定义网页的大小和缩放比例，无论用于查看页面的设备大小如何。没有它们，媒体查询将只能部分发挥作用。\n\n本章将首先介绍媒体查询，然后展示如何通过定义视口使其更好地为你服务。\n\
    \n### 媒体类型\n\n你可以通过几种方式调用依赖于媒体查询的样式，最常见的是使用HTML `link` 元素链接到一个或多个CSS文件，或者直接在CSS文件中使用\
    \ `@import`。\n\n在HTML中，如果查询为真（在所有设备类型上都为真），此示例将加载 `style.css` 文件：\n\n```html\n\
    <link rel=\"stylesheet\" media=\"all\" href=\"/style.css\">\n```\n\n在下面的示例中，`@import`\
    \ 执行相同的操作，但从CSS文件内部进行：\n\n```css\n@import url(\"/style.css\") all;\n```\n\n在下面的示例中，`@media`\
    \ CSS规则包含一组特定的选择器，如果查询为真，这些选择器将被加载：\n\n```css\n@media all {\n    ...\n}\n```\n\
    \n这些查询中的 `all` 是 **媒体类型**。在撰写本文时，有四种可用的媒体类型：\n\n- `print`：用于页面的打印版本\n- `screen`：用于计算机、平板电脑和手机屏幕\n\
    - `speech`：用于向用户朗读页面的屏幕阅读器\n- `all`：用于以上所有类型\n\n添加媒体类型允许你指定查询适用于哪些类型的设备。这些是广泛的，不允许太多控制。为了更具体地定位设备，你需要在这些媒体类型中添加表达式。\n\
    \n### 创建查询\n\n让我们尝试一些更有用的东西。RWDflix 中主要内容旁边的侧边栏旨在显示公告和新闻。移动和平板电脑访问者可能希望专注于观看节目，不希望被其他内容干扰，因此让我们为小屏幕设备的用户隐藏这个元素。\n\
    \n> ### 本书中使用的方法\n\n在本章的剩余部分，我将使用上面所示的 `@media` 方法进行媒体查询。这是个人偏好，作为实验，你可能想尝试使用其他方法重写示例。\n\
    \n移除当前的 aside CSS类，并将其替换为以下媒体查询：\n\n```css\n@media screen and (min-width: 680px)\
    \ {\n    aside {\n        width: 33%;\n    }\n}\n\n@media screen and (max-width:\
    \ 680px) {\n    aside {\n        display: none;\n    }\n}\n```\n\n这对媒体查询设置 aside\
    \ 元素在屏幕宽度大于680px时（通过使用 `min-width` 询问屏幕是否 *至少* 680px宽）宽度为33%，并在屏幕宽度小于680px时（通过使用\
    \ `max-width` 询问屏幕是否 *至多* 680px宽）将其隐藏。\n\n## 24 响应式网页设计快速入门\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_36_0.png)\n\
    \n2-1. 在较小屏幕上隐藏的 `aside` 元素\n\n接下来，当 aside 未显示时，让电视剧列表填满屏幕宽度：\n\n```css\nsection.showslisting\
    \ {\n    margin-bottom: 25px;\n}\n\n@media screen and (min-width: 680px) {\n \
    \   section.showslisting {\n        width: 66%;\n    }\n}\n```\n"
