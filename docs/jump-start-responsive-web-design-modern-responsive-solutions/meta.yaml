    \n    class=\"thumbnail\">\n    <img src=\"../images/show1-medium.jpg\"\n    class=\"\
    thumbnail\">\n</picture>\n```\n\n# More Homework\n\nAs with the previous section,\
    \ this example replaces one image, and to reduce repetition, I haven't included\
    \ code for replacing the other four images. You can find the code for replacing\
    \ the remaining images [here](here) if you want to try replacing the others too.\
    \ Keep the media queries the same and replace the images with the appropriate\
    \ files.\n\nWe've replaced the default img with the HTML5 picture element. This\
    \ element is still considered experimental (especially with Microsoft and older\
    \ Android browsers) but should be widely used soon. Helpfully, the img inside\
    \ the picture is a fallback image for browsers that don't support picture, meaning\
    \ that the browser will load a default image if it doesn't support the newer element.\n\
    \nI chose the medium-sized image, as it's not too large or small, allowing for\
    \ a reasonable level of responsiveness on unsupported browsers."
