    \ and clearing unnecessary, so remove the `left` class from the HTML and any clearing\
    \ styles that were used.\n\n## Making Grids Easier with Frameworks\n\nIn many\
    \ cases, creating a grid in the way described in this chapter isn't too much work,\
    \ but developers and designers like to reduce repetitive tasks as much as possible.\
    \ A simple solution is to create your own grid system that works for you and reuse\
    \ it across your projects. But of course, other developers and designers have\
    \ thought the same thing and have provided their grid systems (or frameworks)\
    \ on the internet. I'll present two of the popular ones, but it's a topic where\
    \ opinions are many and change is rapid. My aim here is to show you how frameworks\
    \ *may* be able to help you save time on repetitive tasks, rather than go into\
    \ detail over which one is \"better\" (a decision you'll have to make for yourself).\
    \ Many of these frameworks supply more than responsive grids, providing other\
