- md: "flex is shorthand for three combined properties, in the following order:\n\n\
    - **flex-grow** determines how much space an item is allowed to use in a container,\
    \ and the sizes are relative to each other. If every item in a container has a\
    \ `flex-grow` value of 1, then each item is evenly distributed. If one item has\
    \ a value of 2, it will take up twice as much space as the other items.\n- **flex-shrink**\
    \ determines whether or not an item can shrink to less than its `flex-grow` value,\
    \ and if so, to which value. The default is 1, so if you want to keep proportions\
    \ no matter what, leave the value empty.\n- **flex-basis** allows you to set a\
    \ default item size before space is distributed, in any of the typical CSS sizing\
    \ units.\n\nMoving to the main content area, again replacing any existing styles,\
    \ you can also remove any of the previous methods for resizing elements inside\
    \ media queries:\n\n```\nmain {\n    flex-grow: 2;\n    flex-basis: 66%;\n}\n\n\
    aside {\n    flex-grow: 1;\n    flex-basis: 33%;\n}\n...\n@media only screen and\
    \ (min-width: 320px) {\n    aside {\n        display: none;\n    }\n\n    section.showslisting\
    \ {\n    }\n\n    .showdescription {\n        display: none;\n    }\n}\n...\n\
    @media only screen and (min-width: 992px) {\n    aside {\n        display: block;\n\
    \    }\n\n    section.showslisting {\n    }\n\n    .showdescription {\n      \
    \  white-space: normal;\n        width: 125px;\n    }\n}\n```\n\nResize the page.\
    \ Notice that you now have the same effect as with the first fluid grid example,\
    \ but have removed a lot of CSS from the media queries. With one set of flex properties,\
    \ the sizing of page elements is handled for us. All without the need for any\
    \ JavaScript!\n\nIf you were to restructure the page, you could remove the `flex-basis`\
    \ properties, but nesting flex containers with different row/column directions\
    \ would involve further div elements, so weigh up your HTML complexity versus\
    \ CSS complexity.\n\nNext, here are the styles for the TV show listing:\n\n```\n\
    section.showlisting {\n    display: flex;\n    flex-wrap: wrap;\n    flex-direction:\
    \ row;\n    margin-bottom: 25px;\n}\n\nsection.tvshow {\n    width: 125px;\n \
    \   height: auto;\n}\n```\n\nThis sets the `showlistings` section as another flex\
    \ container that wraps any items that don’t fit onto one line—since, by default,\
    \ flex will try to fit all items onto one line.\n\nAt this point, you can also\
    \ delete the `left` class from your HTML and CSS, as it’s no longer needed.\n\n\
    ## 3-18. The final flexbox layout\n\nOne other cool flexbox trick is to set the\
    \ order of elements using the order property, and a number that defines its position.\
    \ For example, you could use the following to rearrange page elements on a mobile\
    \ device:\n\n```\nnav { order: 1;}\nheader { order: 2;}\nmain { order: 3;}\nfooter\
    \ { order: 4;}\n```\n\nBut if you wanted to remove page elements, you’d still\
    \ need to use media queries.\n\nThis has been a brief example of how to use flexbox,\
    \ but as you can see, once you’ve restructured your page, flexbox handles a lot\
    \ of the manual page reflowing work for you.\n\n## CSS Grid Layout\n\nComplementary\
    \ to flexbox is the CSS Grid Layout Module, which helps you define and lay out\
    \ the regions of a page. In the past, the main option open to web developers for\
    \ flexible (I use this term loosely) page layouts was using HTML tables to define\
    \ page areas with rows and columns, but these were terrible for accessibility.\
    \ The grid layout is something of a modern re-interpretation of that concept.\n\
    \n> **Browser Support for Grid Layout**\n>\n> Grid shipped for all the newest\
    \ versions of the major browsers in early 2017, so a fallback strategy is required\
    \ if your layouts need to be supported in older browsers.\n> You can [check online](https://example.com)\
    \ for details on which browser versions do and don’t support Grid.\n\nLet’s try\
    \ applying the grid layout to the demo site, starting with [the code from the\
    \ beginning of this chapter](https://example.com).\n\nAgain, make a container\
    \ div inside the body to contain the layout:\n\n```\n...\n<div class=\"container\"\
    >\n...\n</div>\n...\n```\n\nMove the aside from inside main to outside of it.\
    \ This lets you treat it like a proper column in its own right:\n\n```\n...\n\
    </main>\n<aside class=\"left\">\n    <ul>\n    <li>one</li>\n    <li>two</li>\n\
    \    <li>three</li>\n    </ul>\n</aside>\n```\n\nIn the CSS, change the `display`\
    \ type to `grid`:\n\n```\n.container {\n    display: grid;\n}\n```\n\nNow the\
    \ grid display gets really cool. Add the following:\n\n```\n.container {\n   \
    \ display: grid;\n    grid-template-columns: 66% 33%;\n}\n```\n\n> **Removing\
    \ Sizing Overrides**\n>\n> As with the flexbox layout, you can also take this\
    \ opportunity to remove all the other sizing overrides in media queries.\n\nAnd\
    \ in one simple CSS property, you've removed the need for two of the CSS classes\
    \ used so far. The `grid-template-columns` property gives you even more possibilities.\
    \ For example:\n\n- You can use any standard sizing unit for defining the column,\
    \ including `auto` to fill remaining space.\n- You can use `fr` (“fractional units”)\
    \ to let the grid proportionately fill space. So you could rewrite this grid as\
    \ `grid-template-columns: 2fr 1fr;`, which means that the first column will fill\
    \ two-thirds of the space, and the second one third.\n\nGreat, but if you look\
    \ at the demo site now, you'll notice that the rows in the design that don't have\
    \ a 66/33 split don't look right. This is because you also need to define the\
    \ rows with similar syntax:\n\n```\n.container {\n    display: grid;\n    grid-template-columns:\
    \ 66% 33%;\n    grid-template-rows: 80px 80px auto 20px;\n}\n```\n\n> **How Many\
    \ Rows?**\n>\n> This is the first example where we've needed to explicitly define\
    \ rows, and there are a couple of ways you could do it. I suggest that there are\
    \ four rows: the title, the top menu, the introductory text and TV shows, and\
    \ the footer. If you want to change these divisions (for example, splitting the\
    \ description and TV shows), feel free to do so.\n\nThis syntax specifies a set\
    \ height for three elements and then lets the remaining TV shows element fill\
    \ the remaining empty space.\n\nBut again, if you load the page in the browser,\
    \ little has changed. In fact, the `footer` has now jumped up the page. This is\
    \ because there's one more step needed—to add the sub-elements into the grid:\n\
    \n## Better Responsive Structures with Grid Systems\n\nThe grid display layout\
    \ has two interesting methods for defining where you can place an item.\n\n1.\
    \ The first is similar to flexbox, allowing you to specify an order number.\n\
    2. The second lets you place items at named locations. To use this method, you\
    \ need to define what are called **line names**.\n\nThe code below sets the `display`\
    \ style to `grid`, then defines the columns and rows you need. For the columns,\
    \ this is a column named `left` that's 66% of the page width, and a column named\
    \ `right` that fills 33%. For the rows this defines three with a fixed height\
    \ (header, main-nav and footer) and `shows` will automatically fill any remaining\
    \ space.\n\n```\n.container {\n    display: grid;\n    grid-template-columns:\
    \ [left] 66% [right] 33%;\n    grid-template-rows: [header] 80px [main-nav] 40px\
    \ [shows]\n    auto [footer] 20px;\n}\n```\n\nAt this point, now you understand\
    \ what's going on, it's time to make this mobile first. Change the current `container`\
    \ class to the following:\n\n```\n.container {\n    display: grid;\n    grid-template-columns:\
    \ [left] 100%;\n    grid-template-rows: [header] 80px [main-nav] 40px [shows]\n\
    \    auto [footer] 20px;\n}\n```\n\nAnd for larger screen sizes:\n\n```\n@media\
    \ only screen and (min-width: 992px) {\n    .container {\n    grid-template-columns:\
    \ [left] 66% [right] 33%;\n    }\n    ...\n}\n```\n\nIf you've ever created tables\
    \ in a desktop publishing application (or remember using tables for layout in\
    \ the dark days of web design), you'll know that you need to define how an item\
    \ \"spans\" across multiple cells or rows. The technique is the same with the\
    \ grid display. Take the `header` as an example:\n\n```\nheader {\n    grid-column-start:\
    \ left;\n    grid-column-end: right;\n    grid-row-start: header;\n    grid-row-end:\
    \ header;\n```"
