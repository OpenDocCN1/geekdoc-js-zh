    \ in total. Some are quite obscure, or not really necessary, but others are more\
    \ useful after an initial learning curve. Take, for example, the vw and vh units,\
    \ which are a percentage of the width and height of the viewport respectively.\n\
    \nThere is also vmin (based on which is smallest of the viewport height and width)\
    \ and vmax (based on which is largest of the viewport height and width). These\
    \ are amazingly flexible, as the size will automatically react to the size of\
    \ the viewport, but you can lose track of what sizes fonts actually are.\n\nTake\
    \ a viewport that’s 1000px wide and 800px high:\n\n- 1vw is 1% of the total width,\
    \ i.e. 10px\n- 100vw is 100% of the width, i.e. 1000px\n- 50vw is 50% of the width,\
    \ i.e. 500px\n- 1vh is 1% of the height, i.e. 8px\n- 1vmin is 1% of the smallest\
    \ of the two sizes, i.e. 1% of 800px, which is 8px\n- 1vmax is 1% of the largest\
    \ of the two sizes, i.e. 1% of 1000px, which is 10px\n\nTry adding the following\
    \ to the body element:\n\n```\nbody {\n    font-size: 1.5vw;\n}\n```\n\nYour base\
    \ font size will now be 1.5% of your body width, which will depend on the width\
    \ of your browser window.\n\nAt first, it looks like viewport sizing is the answer\
    \ to your responsive dreams, but you’ll notice that, as you shrink the browser\
    \ window, the font size becomes unreadable, as 1.5% of a small viewport width\
    \ is a tiny font size.\n\nOf course, you could fix this with breakpoints, but\
    \ then that defeats the purpose of using this sizing unit in the first place.\
    \ There's a clever workaround for this, thanks to [Zell Liew](https://zellwk.com/)\
    \ and [Mike Riethmuller](https://www.cruip.com/):\n\n```\nbody {\n    font-size:\
    \ calc(16px + 0.25vw);\n}\n\n/* The above won't work in Safari, but the below\
    \ does */\nbody {\n    font-size: calc(100% + 0.25vw)\n}\n```\n\nThis works by\
    \ using the CSS3 `calc` function to calculate a base font size (16px or 100%)\
    \ and then adding 0.25% of the viewport width to it, reducing the amount of variation\
    \ between sizes as the viewport dimensions change. You're free to change both\
    \ the values in the calculation to suit your needs.\n\n> ### Browser Support\n\
    \nSome viewport sizing and the `calc` functions are not fully supported in all\
    \ browsers, with even recent versions of Internet Explorer and Edge not supporting\
    \ the [`vmax` property](https://caniuse.com/#feat=viewport-units), and older versions\
    \ of the Android browser not supporting all calculation types in `calc`.\n\nFor\
    \ the remainder of this chapter, I'll use the `em` unit, but before refactoring\
    \ the demo site text, let's return to typography and optimizing it for the web.\n\
    \n## Creating Readable Text\n\nYou can use all the typographical properties outlined\
    \ earlier in this chapter in conjunction with the sizing units also discussed,\
    \ allowing for fine-grained tweaking of text to make it the most readable on any\
    \ device.\n\nThere are, of course, many schools of thought on what “good text”\
    \ looks like, and it depends on how much text your pages show and how important\
    \ it is to those pages. The example site in this book has a small amount of text,\
    \ so it's relatively easy to make it readable. Text-heavy sites such as a blog\
    \ will need more thought and consideration.\n\nYou should consider what font faces,\
    \ styles, sizes, and layouts suit various screen sizes and resolutions and balance\
    \ this with any style guides your project may have.\n\nLet’s start overhauling\
    \ the text of the demo site by tweaking the base text properties:\n\n```\nbody\
    \ {\n    font-size: 1em;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_112_0.png)\n\
    \nThis sets the default font size to be the browser default, likely 16px as discussed\
    \ earlier.\n\nFor the small-screen version of the page (that is, the default styles)\
    \ the show description text is actually hidden, so we needn't worry about formatting\
    \ it. However, the main site description is taking up way too much space when\
    \ screen real estate is limited, so use a :not pseudo-class to reduce the default\
    \ font size and exclude the show descriptions:\n\n```\nsection.showslisting p:not(.showdescription)\
    \ {\n    font-size: 0.8em;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_113_0.png)\n\
    \n4-10. The site's intro text resized\n\nAs the screen size grows, apart from\
    \ watching the videos, the show descriptions are likely what people want to access,\
    \ so let's make the text slightly bigger to stand out more. With this medium screen\
    \ size, still only a text summary is shown, so this is enough to make it more\
    \ readable:\n\n```\n@media only screen and (min-width: 768px) {\n    .showdescription\
    \ {\n        font-size: 1.2em;\n    }\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_114_0.png)\n\
    \n4-11. Show descriptions are now larger\n\nAs the screen gets larger, let’s increase\
    \ the text size and tighten the line spacing, especially as people may now be\
    \ reading these descriptions from across the room as they settle in for an evening\
    \ of entertainment.\n\n```\n/* Medium devices and desktops */\n@media only screen\
    \ and (min-width: 992px) {\n    .showdescription {\n        font-size: 1.3em;\n\
    \        line-height: 1.1em;\n    }\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_114_1.png)\n\
    \n4-12. The full description text\n\n## Read On\n\nIn this chapter, I've introduced\
    \ typographical concepts that are relevant to responsive design, and I've shown\
    \ how they are represented in CSS. I've also covered the different sizing units\
    \ that you can use to set these properties, and how to make important text on\
    \ your pages readable. In the next chapter, I'll look at how to do the same with\
    \ the rest of your page content, such as images and videos.\n\n# Chapter 5\n##\
    \ Responsive Images and Video\n\nThe exchange of text-based content brought the\
    \ web into existence, but images and other rich media have kept it evolving and\
    \ made it what we all know/love/dislike.\n\nOptions for making images responsive\
    \ has developed rapidly in recent years, with the ability to load images perfectly\
    \ suited to users' devices. And the addition of new HTML elements like `video`\
    \ has opened up new options for responsive design. It's fresh territory, but with\
    \ pitfalls, compromises, and new techniques to learn. So let's get going!\n\n\
    ## Images\n\nImages are a powerful communication device, portraying a message,\
    \ intent, explanation, and bringing life to your web pages.\n\nImages have also\
    \ been a constant source of anguish for designers (web and print) for many years,\
    \ and while HTML5 has brought a lot of improvements, adding responsive images\
    \ to your web page still requires planning and preparation.\n\nFor this chapter,\
    \ I've replaced the placeholder graphics used up to this point on the site with\
    \ images from royalty free sites to represent what a site with real TV shows might\
    \ look like.\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_117_0.png)\n\n5-1. Adding\
    \ show images\n\nThere are issues with the page now that we've added real images.\
    \ The most obvious is that, while the layout is still fine, all the images are\
    \ forced into the same dimensions, which means they aren't taking advantage of\
    \ the available screen space. The example site is for browsing and watching videos,\
    \ so it makes sense to make the visual content as prominent and easy to see as\
    \ possible.\n\nTo show how to use responsive images, we'll change the demo site\
    \ to have different image sizes and layouts suited to each use case at the breakpoints\
    \ defined in [Chapter 3](#).\n\nFirst, change the CSS and HTML to better accommodate\
    \ the images we'll be adding. Let's give the main content area more space and\
    \ reduce the size of the aside menu:\n\n```\n@media only screen and (min-width:\
    \ 992px) {\n    aside {\n        width: 15%;\n        display: block;\n    }\n\
    \n    section.showslisting {\n        width: 75%;\n    }\n}\n```\n\nAdd the mobile\
    \ first styles for the divs that contain details about a show. This sets a maximum\
    \ width of 480px, centered, with an ideal width of *most* of the screen:\n\n```\n\
    section.tvshow {\n    width: 90%;\n    max-width: 480px;\n    margin: 0 auto;\n\
    \    display: block;\n}\n```\n\nNext, add a media query for the same div when\
    \ displayed on larger screens—still centered and filling most of the screen:"
  mdcn: "\n当应用到演示站点时，变化不大，因为尺寸实际上相同。现在为上面的嵌套列表示例添加以下样式：\n\n```\naside ul {\n    font-size:\
    \ 0.75rem;\n}\n```\n\n现在尺寸是当前基础字体大小的3/4。\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_109_0.png)\n\
    \n4–8. Rem级联示例\n\n## 其他相对尺寸\n\n基于百分比、ems和rems的尺寸并不是你唯一的选择。实际上总共有九种。有些相当晦涩，或者并非真正必要，但另一些在经过初步学习曲线后会更有用。例如，vw和vh单位，它们分别代表视口宽度和高度的百分比。\n\
    \n还有vmin（基于视口高度和宽度中较小的一个）和vmax（基于视口高度和宽度中较大的一个）。这些单位非常灵活，因为尺寸会自动响应视口的大小，但你可能会弄不清楚字体实际有多大。\n\
    \n假设一个宽度为1000px、高度为800px的视口：\n\n- 1vw是总宽度的1%，即10px\n- 100vw是宽度的100%，即1000px\n\
    - 50vw是宽度的50%，即500px\n- 1vh是高度的1%，即8px\n- 1vmin是两个尺寸中较小的一个的1%，即800px的1%，为8px\n\
    - 1vmax是两个尺寸中较大的一个的1%，即1000px的1%，为10px\n\n尝试向body元素添加以下内容：\n\n```\nbody {\n  \
    \  font-size: 1.5vw;\n}\n```\n\n现在你的基础字体大小将是body宽度的1.5%，这取决于你浏览器窗口的宽度。\n\n起初，视口尺寸看起来是响应式设计的完美解决方案，但你会注意到，当你缩小浏览器窗口时，字体大小会变得难以阅读，因为小视口宽度的1.5%是一个非常小的字体尺寸。\n\
    \n当然，你可以用断点来解决这个问题，但那样就违背了使用这个尺寸单元的初衷。这里有一个巧妙的变通方法，感谢[Zell Liew](https://zellwk.com/)和[Mike\
    \ Riethmuller](https://www.cruip.com/)：\n\n```\nbody {\n    font-size: calc(16px\
    \ + 0.25vw);\n}\n\n/* 上面的代码在Safari中无效，但下面的可以 */\nbody {\n    font-size: calc(100%\
    \ + 0.25vw)\n}\n```\n\n这个方法通过使用CSS3的`calc`函数来计算基础字体大小（16px或100%），然后加上视口宽度的0.25%，从而减少尺寸在视口尺寸变化时的差异。你可以根据需要自由修改计算中的值。\n\
    \n> ### 浏览器支持\n\n一些视口尺寸单位和`calc`函数并非在所有浏览器中都得到完全支持，即使是较新版本的Internet Explorer和Edge也不支持[`vmax`属性](https://caniuse.com/#feat=viewport-units)，而旧版本的Android浏览器则不支持`calc`中的所有计算类型。\n\
    \n在本章的剩余部分，我将使用`em`单位，但在重构演示站点文本之前，让我们回到排版及其为网络优化的话题。\n\n## 创建可读的文本\n\n你可以将本章前面概述的所有排版属性与同样讨论过的尺寸单位结合使用，从而对文本进行细粒度的调整，使其在任何设备上都具有最佳的可读性。\n\
    \n当然，关于“好的文本”是什么样子，有许多不同的观点，这取决于你的页面显示多少文本以及这些文本对页面的重要性。本书中的示例站点文本量较少，因此使其可读相对容易。像博客这样文本密集的站点则需要更多的思考和考量。\n\
    \n你应该考虑哪些字体、样式、大小和布局适合各种屏幕尺寸和分辨率，并将其与项目可能拥有的任何样式指南进行平衡。\n\n让我们通过调整基础文本属性来开始改进演示站点的文本：\n\
    \n```\nbody {\n    font-size: 1em;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_112_0.png)\n\
    \n这将默认字体大小设置为浏览器默认值，如前所述，很可能是16px。\n\n对于页面的小屏幕版本（即默认样式），节目描述文本实际上是隐藏的，所以我们不必担心它的格式。然而，当屏幕空间有限时，主要的站点描述占据了太多空间，因此使用`:not`伪类来减小默认字体大小并排除节目描述：\n\
    \n```\nsection.showslisting p:not(.showdescription) {\n    font-size: 0.8em;\n\
    }\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_113_0.png)\n\n4-10. 站点介绍文本已调整大小\n\
    \n随着屏幕尺寸增大，除了观看视频外，节目描述可能是人们最想访问的内容，因此让我们让文本稍微大一些以更加突出。在这个中等屏幕尺寸下，仍然只显示文本摘要，所以这足以使其更具可读性：\n\
    \n```\n@media only screen and (min-width: 768px) {\n    .showdescription {\n \
    \       font-size: 1.2em;\n    }\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_114_0.png)\n\
    \n4-11. 节目描述现在更大了\n\n随着屏幕变得更大，让我们增大文本大小并收紧行距，特别是因为人们现在可能会从房间另一头阅读这些描述，准备享受一晚的娱乐。\n\
    \n```\n/* 中等设备和桌面设备 */\n@media only screen and (min-width: 992px) {\n    .showdescription\
    \ {\n        font-size: 1.3em;\n        line-height: 1.1em;\n    }\n}\n```\n\n\
    ![](img/bd4041c3e441a42781fa04a5cb5b773b_114_1.png)\n\n4-12. 完整的描述文本\n\n## 继续阅读\n\
    \n在本章中，我介绍了与响应式设计相关的排版概念，并展示了它们如何在CSS中表示。我还涵盖了可用于设置这些属性的不同尺寸单位，以及如何使页面上的重要文本可读。在下一章中，我将探讨如何对页面的其他内容（如图像和视频）进行同样的处理。\n\
    \n# 第五章\n## 响应式图像与视频\n\n基于文本内容的交换催生了网络，但图像和其他富媒体使其不断进化，成为我们所知/喜爱/不喜的事物。\n\n近年来，使图像响应式的方法发展迅速，能够加载完美适配用户设备的图像。而新增的HTML元素，如`video`，为响应式设计开辟了新的可能性。这是一个全新的领域，但充满了陷阱、妥协和需要学习的新技术。那么，让我们开始吧！\n\
    \n## 图像\n\n图像是强大的沟通工具，传达信息、意图、解释，并为你的网页带来生机。\n\n多年来，图像也一直是设计师（网络和印刷）持续头疼的问题。虽然HTML5带来了许多改进，但为你的网页添加响应式图像仍然需要规划和准备。\n\
    \n在本章中，我将网站上至今使用的占位符图形替换为来自免版税网站的图像，以代表一个拥有真实电视节目的网站可能的样子。\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_117_0.png)\n\
    \n5-1. 添加节目图像\n\n现在我们添加了真实图像，页面出现了一些问题。最明显的是，虽然布局仍然没问题，但所有图像都被强制适应相同的尺寸，这意味着它们没有利用可用的屏幕空间。示例站点用于浏览和观看视频，因此使视觉内容尽可能突出和易于查看是有意义的。\n\
    \n为了展示如何使用响应式图像，我们将修改演示站点，使其在[第3章](#)定义的断点处，为每个用例提供不同的图像尺寸和布局。\n\n首先，更改CSS和HTML以更好地容纳我们将要添加的图像。让我们给主内容区域更多空间，并减小侧边菜单的大小：\n\
    \n```\n@media only screen and (min-width: 992px) {\n    aside {\n        width:\
    \ 15%;\n        display: block;\n    }\n\n    section.showslisting {\n       \
    \ width: 75%;\n    }\n}\n```\n\n为包含节目详细信息的div添加移动优先的样式。这设置了最大宽度为480px，居中，理想宽度为*大部分*屏幕宽度：\n\
    \n```\nsection.tvshow {\n    width: 90%;\n    max-width: 480px;\n    margin: 0\
    \ auto;\n    display: block;\n}\n```\n\n接下来，为相同div在较大屏幕上显示时添加媒体查询——仍然居中并占据屏幕的大部分：\n"
