    \        display: none;\n    }\n}\n...\n@media only screen and (min-width: 992px)\
    \ {\n    aside {\n        display: block;\n    }\n\n    section.showslisting {\n\
    \    }\n\n    .showdescription {\n        white-space: normal;\n        width:\
    \ 125px;\n    }\n}\n```"
