  md: "# Other Relative Sizes\n\nSizes based on percentages, ems and rems are not\
    \ the only options available to you. There are actually nine in total. Some are\
    \ quite obscure, or not really necessary, but others are more useful after an\
    \ initial learning curve. Take, for example, the vw and vh units, which are a\
    \ percentage of the width and height of the viewport respectively.\n\nThere is\
    \ also vmin (based on which is smallest of the viewport height and width) and\
    \ vmax (based on which is largest of the viewport height and width). These are\
    \ amazingly flexible, as the size will automatically react to the size of the\
    \ viewport, but you can lose track of what sizes fonts actually are.\n\nTake a\
    \ viewport that’s 1000px wide and 800px high:\n\n+   - 1vw is 1% of the total\
    \ width, i.e. 10px\n- 100vw is 100% of the width, i.e. 1000px\n- 50vw is 50% of\
    \ the width, i.e. 500px\n- 1vh is 1% of the height, i.e. 8px\n- 1vmin is 1% of\
    \ the smallest of the two sizes, i.e. 1% of 800px, which is 8px\n- 1vmax is 1%\
    \ of the largest of the two sizes, i.e. 1% of 1000px, which is 10px\n\nTry adding\
    \ the following to the body element:\n\n```\nbody {\n    font-size: 1.5vw;\n}\n\
    ```\n\nYour base font size will now be 1.5% of your body width, which will depend\
    \ on the width of your browser window.\n\nAt first, it looks like viewport sizing\
    \ is the answer to your responsive dreams, but you’ll notice that, as you shrink\
    \ the browser window, the font size becomes unreadable, as 1.5% of a small viewport\
    \ width is a tiny font size."
  merge: -1
  pgno: 110
- img_proc: true
  md: "Of course, you could fix this with breakpoints, but then that defeats the purpose\
    \ of using this sizing unit in the first place. There's a clever workaround for\
    \ this, thanks to [Zell Liew](https://zellwk.com/) and [Mike Riethmuller](https://www.cruip.com/):\n\
    \n```\nbody {\n    font-size: calc(16px + 0.25vw);\n}\n\n/* The above won't work\
    \ in Safari, but the below does */\nbody {\n    font-size: calc(100% + 0.25vw)\n\
    }\n```\n\nThis works by using the CSS3 `calc` function to calculate a base font\
    \ size (16px or 100%) and then adding 0.25% of the viewport width to it, reducing\
    \ the amount of variation between sizes as the viewport dimensions change. You're\
    \ free to change both the values in the calculation to suit your needs.\n\n> ###\
    \ Browser Support\n\nSome viewport sizing and the `calc` functions are not fully\
    \ supported in all browsers, with even recent versions of Internet Explorer and\
    \ Edge not supporting the [`vmax` property](https://caniuse.com/#feat=viewport-units),\
    \ and older versions of the Android browser not supporting all calculation types\
    \ in `calc`.\n\nFor the remainder of this chapter, I'll use the `em` unit, but\
    \ before refactoring the demo site text, let's return to typography and optimizing\
    \ it for the web.\n\n# ## Creating Readable Text\n\nYou can use all the typographical\
    \ properties outlined earlier in this chapter in conjunction with the sizing units\
    \ also discussed, allowing for fine-grained tweaking of text to make it the most\
    \ readable on any device.\n\nThere are, of course, many schools of thought on\
    \ what “good text” looks like, and it depends on how much text your pages show\
    \ and how important it is to those pages. The example site in this book has a\
    \ small amount of text, so it's relatively"
  merge: -1
  pgno: 111
- img_proc: true
  md: "# Jump Start Responsive Web Design\n\neasy to make it readable. Text-heavy\
    \ sites such as a blog will need more thought and consideration.\n\nYou should\
    \ consider what font faces, styles, sizes, and layouts suit various screen sizes\
