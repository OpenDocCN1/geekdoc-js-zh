    \n2-1. The `aside` element hidden on smaller screens\n\nNext, make the TV listings\
    \ fill the screen width when the aside isn’t showing:\n\n```\nsection.showslisting\
    \ {\n    margin-bottom: 25px;\n}\n\n@media screen and (min-width: 680px) {\n \
    \   section.showslisting {\n        width: 66%;\n    }\n}\n```"
- md: "## 2-2. The main content now set to full width\n\nIf you resize the page in\
    \ your desktop browser, you'll see the aside appearing and disappearing as you\
    \ widen and narrow the browser window, the main content adjusting appropriately.\n\
    \nYou can use basic logic in your media queries. This allows you to combine multiple\
    \ conditions. For example, you can use a logical AND:\n\n```\n@media only screen\
    \ and (min-width: 640px) and (max-width: 1136px) {\n  ...\n}\n```\n\nThe code\
    \ above will invoke the CSS styles within the query if a device’s screen width\
    \ is between 640px *and* 1136px. The `min-width` property is the minimum width\
    \ of the screen, and `max-width` the maximum.\n\nFor this media query to match,\
    \ both conditions need to be true. It’s also possible to match queries if only\
    \ one condition is true with a logical OR, which (confusingly) is represented\
    \ with a comma. The query below will apply on screen or print devices:\n\n```\n\
    @media only screen, print {\n  ...\n}\n```\n\nYou can also combine ANDs with ORs\
    \ to make more complex queries. Here’s the current page rendered on a larger sized\
    \ phone, but in landscape mode:\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_37_0.png)\n\
    \n## 2-3. The current phone layout in landscape mode\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_39_0.png)\n\
    \nIn the screenshot above, the screen is 732px wide, which is above the 640px\
    \ set above. Still, the aside doesn't quite fit into the window, so let's hide\
    \ it if the screen size is below 640px, or if the device is in landscape mode:\n\
    \n```\n@media screen and (max-width: 680px), screen and\n(orientation: landscape)\
    \ and (max-width: 750px) {\n    aside {\n        display: none;\n    }\n}\n```\n\
    \nAnd the corresponding media query for the listings section:\n\n```\n@media screen\
    \ and (max-width: 680px), screen and\n(orientation: landscape) and (max-width:\
    \ 750px) {\n    section.showslisting {\n        width: 100%;\n    }\n}\n```\n\n\
    You'll see that I added a `max-width` check, to show the `aside` on tablets in\
    \ landscape mode, but also to show how you can combine logical checks together.\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_40_0.png)\n\n## Logical Queries with\
    \ Only and Not\n\nYou can also make precise media queries using `only` and `not`.\
    \ For example, this media query will match devices that are at least 640px wide\
    \ and *exclude* the print media type:\n\n```\n@media not print and (min-width:\
    \ 640px) {\n    ...\n}\n```\n\nIn contrast, this query will *only* apply to screen\
    \ devices that are at least 640px wide:\n\n```\n@media only screen and (min-width:\
    \ 640px) {\n    ...\n}\n```\n\n## Query Features\n\nThe width and height queries\
    \ we've looked at so far are some of the most widely used, but there are several\
    \ other **media features** that are also useful for checking against device features.\
    \ These include color capabilities, aspect ratio, orientation, resolution, and\
    \ vendor-specific features for Mozilla- and WebKit-based browsers. Most of these\
    \ accept min- and max- prefixes that work in a similar way to the dimension queries\
    \ above.\n\n### aspect-ratio\n\nThe aspect-ratio feature allows you to check the\
    \ ratio of horizontal pixels to vertical pixels, separated by a slash. For example:\n\
    \n```\n@media screen and (min-aspect-ratio: 1/1) {\n    ...\n}\n```\n\nThe above\
    \ rule will match a device where the screen's width to height ratio is 1:1 or\
    \ more, so square or landscape.\n\nA common use for this would be to detect wider\
    \ screens, useful when you're displaying videos:\n\n```\n@media screen and (min-aspect-ratio:\
    \ 16/9) {\n    ...\n}\n```\n\n### orientation\n\nAs shown earlier, this feature\
    \ checks if the device is in landscape or portrait mode. For example:\n\n```\n\
    @media all and (orientation: landscape) {\n    ...\n}\n```\n\nAnd:\n\n```\n@media\
    \ all and (orientation: portrait) {\n    ...\n}\n```\n\n### color\n\nThis feature\
    \ checks if a device can support a certain bit-level of color. For example, this\
    \ is how to check that a device supports at least 8-bits of color (that is, 256\
    \ colors):\n\n```\n@media all and (min-color: 8) {\n    ...\n}\n```\n\n### color-index\n\
    \nThis plays a role similar to color, but lets you check for the number of colors\
    \ instead of the bit-level:\n\n```\n@media all and (min-color-index: 256) {\n\
    \    ...\n}\n```\n\n### monochrome\n\nAgain, similar to color, monochrome lets\
    \ you check for the levels of gray in a device:\n\n```\n@media all and (min-monochrome:\
    \ 8) {\n    ...\n}\n```\n\n### resolution\n\nThis feature targets devices that\
    \ have high-resolution screens:\n\n```\n@media all and (min-resolution: 120dpi)\
    \ {\n    ...\n}\n```\n\n### scan\n\nThe scan media feature lets you check the\
    \ scanning process of TVs, the options being interlace or progressive:\n\n```\n\
    @media all and (scan: progressive) {\n    ...\n}\n```\n\n### grid\n\ngrid is used\
    \ for checking if a device is a terminal-like device. This also includes older\
    \ phones (that is, non-smartphones), accessible phones (for those with poor vision),\
    \ and braille devices. It returns a boolean value if true:\n\n```\n@media grid\
    \ {\n    ...\n}\n```\n\nAs you can see, through combinations of dimension- and\
    \ feature-based queries, you can construct complex stylesheets to target a multitude\
    \ of devices effectively with styles that work most efficiently for them. This\
    \ is the main point of media queries: they allow you to selectively load CSS styles\
    \ for particular device configurations.\n\n## Streamlining the Example App\n\n\
    Now that you have a basic understanding, let's continue to build upon the media\
    \ queries added earlier to make the example site tidier.\n\nFirst, you can consolidate\
    \ the queries already written, moving the classes into two groups of media queries:\n\
    \n```\n/* Media Queries */\n/* For example, desktop devices */\n@media screen\
    \ and (min-width: 680px) {\n    aside {\n        width: 33%;\n    }\n\n    section.showslisting\
    \ {\n        width: 66%;\n    }\n}\n\n/* For example, medium-width screens or\
    \ smaller screens in landscape */\n@media screen and (max-width: 680px), screen\
    \ and (orientation: landscape) and (max-width: 750px) {\n    aside {\n       \
    \ display: none;\n    }\n\n    section.showslisting {\n        width: 100%;\n\
    \    }\n}\n```\n\nMuch tidier! You can keep adding new styles for each query into\
    \ these sections.\n\nLet's look back to our demo site specification outlined in\
    \ [Chapter 1] for what else needs to be optimized for each screen size. The next\
    \ step will be hiding the TV show description on small screens, and shorten it\
    \ on medium-sized screens.\n\nIt would be a lot easier to do this if the description\
    \ text had a class, so add one to each instance of the p tag that contains the\
    \ show description:\n\n```\n<section class=\"tvshow\">\n    <h3>Show</h3>\n  \
    \  <img src=\"http://placehold.it/350x150\"\n    class=\"thumbnail\">\n    <p\
    \ class=\"showdescription\">Lorem ipsum dolor sit amet,\n    consectetur adipiscing\
    \ elit.</p>\n</section>\n```\n\nLet's add new media queries to accommodate the\
    \ various sizes we aim to support, and, in doing so, tidy up the existing ones.\n\
    \nThe specific widths at which we want our design to reflow are known as **breakpoints**.\
    \ The breakpoints we'll add are not exhaustive: there's a huge range of device\
    \ sizes, and more are appearing all the time, so it's futile to try to target\
    \ each device with separate queries. A better approach is to assess the points\
    \ at which your design needs to reflow, and then create media queries for those\
    \ breakpoints. This is the beauty of responsive web design: you can ensure that\
    \ each device will get an appropriate layout without having to design separately\
    \ for each device.\n\nAdd the following breakpoints and refactor our existing\
    \ styles into them:\n\n## 2-5. Chapter2/demo_create/layout.css (excerpt)\n\n```\n\
    /* Media Queries */\n\n/* For example, older phones */\n@media only screen and\
    \ (min-width: 320px) {\n    aside {\n        display: none;\n    }\n\n    section.showslisting\
    \ {\n        width: 100%;\n    }\n\n    .showdescription {\n        display: none;\n\
    \    }\n}\n\n/* For example, newer phones */\n@media only screen and (min-width:\
    \ 480px) {\n}\n\n/* For example, small computer screens and larger tablets */\n\
    @media only screen and (min-width: 768px) {\n    .showdescription {\n        text-overflow:\
    \ ellipsis;\n        display: block;\n        white-space: nowrap;\n        width:\
    \ 100px;\n        overflow: hidden;\n    }\n}\n\n/* For example, typical desktop\
    \ monitors or larger tablet devices */\n@media only screen and (min-width: 992px)\
    \ {\n    aside {\n        width: 33%;\n        display: block;\n    }\n}\n```"
  mdcn: "\n## 2-2. 现在主要内容设置为全宽\n\n如果你在桌面浏览器中调整页面大小，你会看到随着浏览器窗口变宽和变窄，侧边栏会相应地出现和消失，主要内容也会随之调整。\n\
    \n你可以在媒体查询中使用基本逻辑。这允许你组合多个条件。例如，你可以使用逻辑与：\n\n```\n@media only screen and (min-width:\
    \ 640px) and (max-width: 1136px) {\n  ...\n}\n```\n\n上面的代码将在设备屏幕宽度在 640px *和*\
    \ 1136px 之间时调用查询内的 CSS 样式。`min-width` 属性是屏幕的最小宽度，`max-width` 是最大宽度。\n\n要使此媒体查询匹配，两个条件都需要为真。也可以在仅一个条件为真时使用逻辑或匹配查询，这（令人困惑地）用逗号表示。下面的查询将应用于屏幕或打印设备：\n\
    \n```\n@media only screen, print {\n  ...\n}\n```\n\n你还可以将逻辑与和逻辑或组合起来，以创建更复杂的查询。这是当前页面在较大尺寸手机上以横屏模式渲染的效果：\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_37_0.png)\n\n## 2-3. 当前手机在横屏模式下的布局\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_39_0.png)\n\n在上面的截图中，屏幕宽度为 732px，高于上面设置的\
    \ 640px。不过，侧边栏仍然无法完全容纳在窗口中，因此如果屏幕尺寸低于 640px 或设备处于横屏模式，让我们将其隐藏：\n\n```\n@media\
    \ screen and (max-width: 680px), screen and\n(orientation: landscape) and (max-width:\
    \ 750px) {\n    aside {\n        display: none;\n    }\n}\n```\n\n以及针对节目列表部分的相应媒体查询：\n\
    \n```\n@media screen and (max-width: 680px), screen and\n(orientation: landscape)\
    \ and (max-width: 750px) {\n    section.showslisting {\n        width: 100%;\n\
    \    }\n}\n```\n\n你会看到我添加了一个 `max-width` 检查，以便在平板电脑横屏模式下显示 `aside`，同时也展示了如何将逻辑检查组合在一起。\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_40_0.png)\n\n## 使用 Only 和 Not 的逻辑查询\n\
    \n你还可以使用 `only` 和 `not` 进行精确的媒体查询。例如，此媒体查询将匹配宽度至少为 640px 的设备，并*排除*打印媒体类型：\n\n\
    ```\n@media not print and (min-width: 640px) {\n    ...\n}\n```\n\n相比之下，此查询将*仅*适用于宽度至少为\
    \ 640px 的屏幕设备：\n\n```\n@media only screen and (min-width: 640px) {\n    ...\n\
    }\n```\n\n## 查询特性\n\n到目前为止我们已经看过的宽度和高度查询是一些最广泛使用的查询，但还有其他一些**媒体特性**也用于检查设备特性。这些包括颜色能力、宽高比、方向、分辨率以及\
    \ Mozilla 和 WebKit 浏览器的特定供应商特性。这些大多接受 min- 和 max- 前缀，其工作方式类似于上面的尺寸查询。\n\n### aspect-ratio\n\
    \naspect-ratio 特性允许你检查水平像素与垂直像素的比率，用斜杠分隔。例如：\n\n```\n@media screen and (min-aspect-ratio:\
    \ 1/1) {\n    ...\n}\n```\n\n上面的规则将匹配屏幕宽高比为 1:1 或更高的设备，即正方形或横向屏幕。\n\n一个常见的用途是检测更宽的屏幕，这在显示视频时很有用：\n\
    \n```\n@media screen and (min-aspect-ratio: 16/9) {\n    ...\n}\n```\n\n### orientation\n\
    \n如前所述，此特性检查设备是否处于横屏或竖屏模式。例如：\n\n```\n@media all and (orientation: landscape)\
    \ {\n    ...\n}\n```\n\n以及：\n\n```\n@media all and (orientation: portrait) {\n\
    \    ...\n}\n```\n\n### color\n\n此特性检查设备是否支持特定比特级别的颜色。例如，以下是如何检查设备是否至少支持 8 位颜色（即\
    \ 256 种颜色）：\n\n```\n@media all and (min-color: 8) {\n    ...\n}\n```\n\n### color-index\n\
    \ncolor-index 的作用类似于 color，但允许你检查颜色数量而不是比特级别：\n\n```\n@media all and (min-color-index:\
    \ 256) {\n    ...\n}\n```\n\n### monochrome\n\n同样类似于 color，monochrome 允许你检查设备的灰度级别：\n\
    \n```\n@media all and (min-monochrome: 8) {\n    ...\n}\n```\n\n### resolution\n\
    \n此特性针对具有高分辨率屏幕的设备：\n\n```\n@media all and (min-resolution: 120dpi) {\n    ...\n\
    }\n```\n\n### scan\n\nscan 媒体特性允许你检查电视的扫描过程，选项为隔行扫描或逐行扫描：\n\n```\n@media all and\
    \ (scan: progressive) {\n    ...\n}\n```\n\n### grid\n\ngrid 用于检查设备是否为终端类设备。这也包括旧式手机（即非智能手机）、无障碍手机（供视力不佳者使用）和盲文设备。如果为真，它返回一个布尔值：\n\
    \n```\n@media grid {\n    ...\n}\n```\n\n如你所见，通过组合基于尺寸和基于特性的查询，你可以构建复杂的样式表，以针对多种设备有效地应用最高效工作的样式。这就是媒体查询的主要意义：它们允许你为特定设备配置选择性地加载\
    \ CSS 样式。\n\n## 精简示例应用\n\n现在你有了基本的理解，让我们继续在之前添加的媒体查询基础上进行构建，使示例网站更加整洁。\n\n首先，你可以合并已经编写好的查询，将类移动到两组媒体查询中：\n\
    \n```\n/* 媒体查询 */\n/* 例如，桌面设备 */\n@media screen and (min-width: 680px) {\n   \
    \ aside {\n        width: 33%;\n    }\n\n    section.showslisting {\n        width:\
    \ 66%;\n    }\n}\n\n/* 例如，中等宽度屏幕或横屏模式下的较小屏幕 */\n@media screen and (max-width:\
    \ 680px), screen and (orientation: landscape) and (max-width: 750px) {\n    aside\
    \ {\n        display: none;\n    }\n\n    section.showslisting {\n        width:\
    \ 100%;\n    }\n}\n```\n\n整洁多了！你可以继续将每个查询的新样式添加到这些部分中。\n\n让我们回顾一下[第 1 章]中概述的演示网站规范，看看每个屏幕尺寸还需要优化什么。下一步是在小屏幕上隐藏电视节目描述，并在中等屏幕上缩短它。\n\
    \n如果描述文本有一个类，这将会容易得多，因此为每个包含节目描述的 p 标签实例添加一个类：\n\n```\n<section class=\"tvshow\"\
    >\n    <h3>Show</h3>\n    <img src=\"http://placehold.it/350x150\"\n    class=\"\
    thumbnail\">\n    <p class=\"showdescription\">Lorem ipsum dolor sit amet,\n \
    \   consectetur adipiscing elit.</p>\n</section>\n```\n\n让我们添加新的媒体查询以适应我们旨在支持的各种尺寸，并在此过程中整理现有的查询。\n\
    \n我们希望设计重新流式的特定宽度被称为**断点**。我们将添加的断点并非详尽无遗：设备尺寸范围巨大，并且不断有新设备出现，因此尝试为每种设备使用单独的查询是徒劳的。更好的方法是评估你的设计需要重新流式的点，然后为这些断点创建媒体查询。这就是响应式\
    \ Web 设计的美妙之处：你可以确保每种设备都能获得适当的布局，而无需为每种设备单独设计。\n\n添加以下断点，并将我们现有的样式重构到其中：\n\n##\
    \ 2-5. 第2章/demo_create/layout.css（摘录）\n\n```\n/* 媒体查询 */\n\n/* 例如，旧式手机 */\n@media\
    \ only screen and (min-width: 320px) {\n    aside {\n        display: none;\n\
    \    }\n\n    section.showslisting {\n        width: 100%;\n    }\n\n    .showdescription\
    \ {\n        display: none;\n    }\n}\n\n/* 例如，新型手机 */\n@media only screen and\
    \ (min-width: 480px) {\n}\n\n/* 例如，小型电脑屏幕和较大的平板电脑 */\n@media only screen and (min-width:\
    \ 768px) {\n    .showdescription {\n        text-overflow: ellipsis;\n       \
    \ display: block;\n        white-space: nowrap;\n        width: 100px;\n     \
    \   overflow: hidden;\n    }\n}\n\n/* 例如，典型的桌面显示器或较大的平板设备 */\n@media only screen\
    \ and (min-width: 992px) {\n    aside {\n        width: 33%;\n        display:\
    \ block;\n    }\n}\n```\n"
