  md: 'So that''s it, you''re done, right? Unfortunately, no. Inspect one of the images
    in your web inspector and you''ll notice that all we''re doing is resizing a very
    large image. Even though it looks small, the actual file is still large, adding
    a lot of page weight. Look at the network requests: these five images total nearly
    **4MB**, which is a lot of data for a mobile user to load. To make your images
    fully responsive, you need to make sure the right file is served to the right
    device.


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_123_0.png)


    *5-5. Image sizes*


    # The Right Image for the Right Device


    There are two methods for handling images responsively. One is `srcset`, an attribute
    to the img tag you know already, and the other is the new HTML5 picture element.
    Both methods use media query like syntax to select the image most suited to the
    device capabilities, but `srcset` allows the browser to make the final decision
    on what image to render, and `picture` explicitly tells the browser which image
    to render. For most use cases, `srcset` will be all you need, but for design heavy
    sites when you want more control over how a browser renders an image (e.g. cropping
    an image instead of resizing it) then using the `picture` tag will suit you better.


    Much like the CSS rules loaded by your media queries, what image sizes you use
    and support is up to you and your use case. The example project is moderately
    well optimized, but could be better. For example, we could reduce the maximum
    size of images loaded on smaller screens. The queries can take the same format
    as those outlined in Chapter 2.


    I created each of the images needed for the design manually, giving them a width
    roughly matching the maximum width the image will be displayed at:


    +   - **Small Image**: 320px wide.'
  merge: -1
  pgno: 123
- img_proc: true
  md: "112 Jump Start Responsive Web Design\n\n+   - **Medium Image**: 480px wide.\n\
    - **Large Image**: 768px wide.\n\nCreating different versions of images manually\
    \ is tedious, but gives you control over what gets shown in each image size. If\
    \ you’d rather automate the generation of these images, there are several options,\
    \ such as:\n\n+   - batch processing in an image editor like [Photoshop](https://www.adobe.com/products/photoshop.html)\
    \ or [XnView](https://www.xnview.com/) (Windows).\n- batch processing with a build\
    \ tool such as [Gulp](https://gulpjs.com/).\n- using a plugin for your CMS or\
    \ static site generator, which is likely a wrapper around the popular [imagemagick](https://imagemagick.org/)\
    \ or [OptiPNG](http://optipng.sourceforge.net/) libraries.\n\nsrcset\n\nReplace\
    \ the existing image element with the following:\n\n```\n5-6. Chapter5/srcset/index.html\
    \ (excerpt)\n<section class=\"tvshow\">\n    <h3>Show 1</h3>\n    <img src=\"\
    ../images/show1-medium.jpg\"\n         srcset=\"../images/show1-medium.jpg 480w,\n\
    \                 ../images/show1-small.jpg 320w,\n                 ../images/show1-large.jpg\
    \ 768w\"\n         sizes=\"(max-width: 768px) 480px,\n                (max-width:\
    \ 1800px) 320px, 768px\"\n         class=\"thumbnail\" />\n    <p class=\"showdescription\"\
    >Lorem ipsum dolor sit amet,\n        consectetur adipiscing elit.</p>\n</section>\n\
    ```\n\n> ![Some Homework Icon](image:icon)\n**Some Homework**\nThis example replaces\
    \ one image, and to reduce repetition, I haven’t included code for replacing the\
    \ other four images. You can find the code for the remaining images [in the code\
    \ archive](https://code.jquery.com/) if you want to try replacing the others too.\
    \ Keep the media queries the same and replace the images with the appropriate\
    \ files.\n\nThis requires breaking down, and the layout we’re using also adds\
    \ complexity."
