  md: '# # What About the Demo App?


    I''ve used sections of the demo app so far in examples for this chapter, but the
    rest of the book will not use any grid systems. This is for clarity, so you can
    more easily see the examples covering other topics without the grids getting in
    the way, but also to reduce compatibility issues with certain browsers.


    As an exercise, try picking your favorite grid system from this chapter and rewriting
    future examples using it.


    # # Wrap Up


    Now you know how to make a page layout that can respond to any browser size and
    always fit proportionally. In the next chapter, we''ll look at making the content
    inside the layout responsive—because, without readable and presentable content
    on all devices, your work is not yet complete.'
  merge: -1
