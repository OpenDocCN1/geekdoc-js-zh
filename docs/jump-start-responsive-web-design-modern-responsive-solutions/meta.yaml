  md: "# # Mobile First\n\nIn Chapter 1, I introduced the “mobile first” concept.\
    \ Currently, the page works on different device sizes but is not mobile first,\
    \ because the “default” styles—that is, those not inside media queries—are really\
    \ designed for larger devices. So let’s do some rearranging and refactoring to\
