    \    }\n}\n\n/* Small Devices and Tablets */\n@media only screen and (min-width:\
    \ 768px) {\n    section.tvshow {\n        margin-right: 15px;\n        display:\
    \ inline-block;\n    }\n    section.showslisting p {\n        line-height: 1.4em;\n\
    \        word-spacing: 0em;\n    }\n}\n\n/* Medium Devices and Desktops */\n@media\
    \ only screen and (min-width: 992px) {\n    section.tvshow {\n        margin-right:\
    \ 15px;\n        display: inline-block;\n    }\n    .showdescription {\n     \
    \   white-space: normal;\n    }\n}\n\n/* Large Devices, Wide Screens, TVs */\n\
    @media only screen and (min-width: 1800px) {\n    section.showslisting {\n   \
    \     width: 100%;\n    }\n}\n```\n\n## Jump Start Responsive Web Design\n\n```css\n\
    margin-bottom: 25px;\n}\n\nsection.tvshow {\n    margin-right: 15px;\n    display:\
    \ inline-block;\n}\n}\n```\n\nThis results in the following layout for one video:\n\
    \n![6-9. The video playback layout](img/bd4041c3e441a42781fa04a5cb5b773b_160_0.png)\n\
    \n6-9. The video playback layout\n\nNow add a script element below the page footer,\
    \ containing the following code. This script initiates when the page loads, and\
    \ accesses the video element, listening to whether it's playing:\n\n```html\n\
    <script>\n(function () {\n    var video = document.getElementById(\"show1\");\n\
    \    video.addEventListener(\"play\", control_video, false);\n\n})();\n</script>\n\
    ```\n\nAdd the control_video function, and assign the video clicked to a variable:\n\
    \n```javascript\nfunction control_video(e) {\n    var v = e.target;\n}\n```\n\n\
    Check if the device supports the orientation API and if so, listen for changes\
    \ to orientation. If it doesn't, then warn the user:\n\n```javascript\nif (window.DeviceOrientationEvent)\
    \ {\n    window.addEventListener(\"deviceorientation\", function (e) {\n\n   \
    \ }, false);\n} else {\n    alert(\"Sorry, your browser doesn't support Device\
    \ Orientation\");\n}\n```\n\nFinally, react to the changes in orientation, pausing\
    \ the video if a user rotates their phone to the right, and playing it again if\
    \ they rotate to the left:\n\n```javascript\nif ((e.gamma < -45) && (e.gamma >\
    \ -90)) {\n    v.play();\n}\n\nif ((e.gamma > 45) && (e.gamma < 90)) {\n    v.pause();\n\
    }\n```\n\n> **Getting Oriented**\n>\n> If you’re interested in learning more about\
    \ the three-rotation axis that exist in the Orientation API, I recommend reading\
    \ “Using Device Orientation in HTML5”.\n\n## Responding to All\n\nIn this chapter,\
    \ we’ve seen hypothetical examples of how we can change the contents of our pages\
    \ to respond to the variety of sensors found in modern devices. These are always\
    \ evolving, and I encourage you to keep up to date on the new APIs you can take\
    \ advantage of in your designs to deliver tailored experiences to users.\n\nThis\
    \ brings us to the end of our journey with this book. Responsive design is fundamentally\
    \ about crafting pages that are usable by anyone, no matter what their device\
    \ or circumstances. Whether it be screen size, performance or other factors, it’s\
    \ our responsibility to ensure that the user’s experience is as good as it can\
    \ be.\n\nYou’re beginning your responsive adventure at a good time. There have\
    \ never been better features available and soon to arrive in the HTML and CSS\
    \ specifications—features for crafting experiences to suit the ever-changing landscape\
    \ of modern web design. Some of these features are in flux, and their final forms\
    \ undecided, but this also means you have the opportunity to test and shape their\
    \ future. Get involved, and help create the Web you want to see."
  mdcn: "\n6-6. 为深色模式设置低对比度\n\n色彩方案之间的快速切换会让用户感到不适，因此为了使过渡更加平滑，请将以下 CSS 添加到 body 元素中，以缓和颜色之间的过渡：\n\
    \n```css\nbody {\n    -webkit-transition: all 0.5s ease-in-out;\n    -moz-transition:\
    \ all 0.5s ease-in-out;\n    -o-transition: all 0.5s ease-in-out;\n    transition:\
    \ all 0.5s ease-in-out;\n}\n```\n\n## 振动\n\nW3C 的另一项创新是 [Vibration API](https://www.w3.org/TR/vibration/)，它提供了对移动设备振动机制的访问，以提供触觉反馈。我们可以利用这一点，通过在音轨中添加振动，为视频播放带来更具沉浸感的体验，但这需要大量工作。此\
    \ API 还有其他便捷用途，特别是在无障碍访问方面。例如，当点击按钮时设备轻微振动，让用户知道操作已被识别，这会很有用。\n\n## 设备方向\n\n我们已经了解了如何通过媒体查询检测和响应设备方向，但我们也可以动态地响应设备方向。例如，我们可以根据横屏或竖屏视频，切换视频文件到更适合的格式。\n\
    \n如果你想进行更实验性的尝试，为何不根据设备方向来控制视频播放？例如，当用户将手机向某个方向倾斜时，我们可以暂停视频，反之亦然。\n\n在这个示例中，我们将创建一个新的、简化的页面版本，专门用于播放一个视频。\n\
    \n以下是 HTML 代码：\n\n6-7. Chapter6/orcintation/index.html（节选）\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"\
    viewport\" content=\"width=device-width,\n    initial-scale=1.0, user-scalable=no\"\
    >\n    <title>RWDFlix</title>\n    <link rel=\"stylesheet\" type=\"text/css\"\
    \ media=\"all\"\n    href=\"layout.css\">\n</head>\n<body>\n    <header><h1>RWDFlix</h1></header>\n\
    \    <main>\n    <section class=\"showslisting\">\n\n        <section class=\"\
    tvshow\">\n        <h3>Show 1</h3>\n        <video controls poster=\"../images/show1-medium.jpg\"\
    \n        preload=\"none\" id=\"show1\">\n            <source src=\"../videos/show1.mp4\"\
    \ type=\"video/mp4\">\n            <source src=\"../videos/show1.ogv\" type=\"\
    video/ogg\">\n            Your browser doesn't support HTML5 video tag.\n    \
    \    </video>\n        <p class=\"showdescription\">Lorem ipsum dolor sit amet,\n\
    \        consectetur adipiscing elit.</p>\n        </section>\n\n    </section>\n\
    \n    </main>\n    <footer>\n    I am a footer\n    </footer>\n</body>\n</html>\n\
    ```\n\nCSS 同样进行了简化：\n\n6-8. Chapter6/orientation/layout.css（节选）\n\n```css\nbody\
    \ {\n    background: black;\n    color: white;\n    font-family: 'Helvetica Neue',\
    \ Helvetica, Arial, sans-serif;\n    font-size: 1em;\n}\n\nsection.showslisting\
    \ {\n    width: 100%;\n    margin-bottom: 25px;\n}\n\nsection.showslisting p {\n\
    \    line-height: 1.2em;\n    word-spacing: 0.2em;\n}\n\nsection.tvshow {\n  \
    \  width: 100%;\n    margin: 0 auto;\n    display: block;\n}\n\nvideo {\n    width:\
    \ 100%;\n    height: auto;\n}\n\n.thumbnail {\n    width: 100%;\n    height: auto;\n\
    }\n\nfooter {\n    clear: both;\n}\n\n/* Media Queries */\n\n/* Extra Small Devices\
    \ and Phones */\n@media only screen and (min-width: 480px) {\n    section.tvshow\
    \ {\n        margin: 0 auto;\n        display: block;\n    }\n}\n\n/* Small Devices\
    \ and Tablets */\n@media only screen and (min-width: 768px) {\n    section.tvshow\
    \ {\n        margin-right: 15px;\n        display: inline-block;\n    }\n    section.showslisting\
    \ p {\n        line-height: 1.4em;\n        word-spacing: 0em;\n    }\n}\n\n/*\
    \ Medium Devices and Desktops */\n@media only screen and (min-width: 992px) {\n\
    \    section.tvshow {\n        margin-right: 15px;\n        display: inline-block;\n\
    \    }\n    .showdescription {\n        white-space: normal;\n    }\n}\n\n/* Large\
    \ Devices, Wide Screens, TVs */\n@media only screen and (min-width: 1800px) {\n\
    \    section.showslisting {\n        width: 100%;\n    }\n}\n```\n\n## 快速入门响应式网页设计\n\
    \n```css\nmargin-bottom: 25px;\n}\n\nsection.tvshow {\n    margin-right: 15px;\n\
    \    display: inline-block;\n}\n}\n```\n\n这将为单个视频产生如下的布局：\n\n![6-9. 视频播放布局](img/bd4041c3e441a42781fa04a5cb5b773b_160_0.png)\n\
    \n6-9. 视频播放布局\n\n现在在页面页脚下方添加一个 script 元素，包含以下代码。此脚本在页面加载时启动，访问视频元素，并监听其播放状态：\n\
    \n```html\n<script>\n(function () {\n    var video = document.getElementById(\"\
    show1\");\n    video.addEventListener(\"play\", control_video, false);\n\n})();\n\
    </script>\n```\n\n添加 control_video 函数，并将点击的视频赋值给一个变量：\n\n```javascript\nfunction\
    \ control_video(e) {\n    var v = e.target;\n}\n```\n\n检查设备是否支持方向 API，如果支持，则监听方向变化。如果不支持，则警告用户：\n\
    \n```javascript\nif (window.DeviceOrientationEvent) {\n    window.addEventListener(\"\
    deviceorientation\", function (e) {\n\n    }, false);\n} else {\n    alert(\"\
    Sorry, your browser doesn't support Device Orientation\");\n}\n```\n\n最后，对方向变化做出反应，当用户将手机向右旋转时暂停视频，向左旋转时再次播放：\n\
    \n```javascript\nif ((e.gamma < -45) && (e.gamma > -90)) {\n    v.play();\n}\n\
    \nif ((e.gamma > 45) && (e.gamma < 90)) {\n    v.pause();\n}\n```\n\n> **熟悉方向**\n\
    >\n> 如果你有兴趣了解更多关于方向 API 中存在的三轴旋转，请阅读“在 HTML5 中使用设备方向”。\n\n## 响应一切\n\n在本章中，我们看到了一些假设性的示例，展示了如何改变页面内容以响应现代设备中发现的各种传感器。这些功能不断发展，我鼓励你保持对可在设计中利用的新\
    \ API 的了解，以便为用户提供量身定制的体验。\n\n这标志着我们与本书之旅的结束。响应式设计的核心在于精心打造任何人都可使用的页面，无论其设备或情况如何。无论是屏幕尺寸、性能还是其他因素，确保用户体验尽可能好是我们的责任。\n\
    \n你正在一个好时机开始你的响应式探索。HTML 和 CSS 规范中从未有过比现在更好的功能，而且即将推出——这些功能专为打造适应现代网页设计不断变化的格局的体验而设计。其中一些功能仍在变动中，其最终形式尚未确定，但这同时也意味着你有机会测试和塑造它们的未来。参与进来，帮助创建你希望看到的\
    \ Web。\n"
