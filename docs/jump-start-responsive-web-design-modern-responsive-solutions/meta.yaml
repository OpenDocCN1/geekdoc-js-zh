  - "[PAGE 125]\n\nThe first part of the element is normal, as is the last `class`\
    \ property, the second and third lines are the new syntax. `srcset` is designed\
    \ to allow the browser to make the best decisions about what image to display\
    \ based on information you provide it. Each pair in the second line defines the\
    \ images available and tells the browser its width, appended with a w. The third\
    \ line defines the viewport sizes you want to load a particular image at, and\
    \ what image to load.\n\nThe example above declares:\n\n+   - Up to a viewport\
    \ width of 768px, load an image of 480px width.\n- Between a viewport width of\
    \ 768 and 1800px, load an image of 320px width.\n- If no other rule applies, then\
    \ load an image of 768px.\n\nYou can be more subtle with these declarations, for\
    \ example:\n\n```\n<img src=\"../images/show1-medium.jpg\"\n     srcset=\"../images/show1-medium.jpg\
    \ 480w,\n     ../images/show1-small.jpg 320w,\n     ../images/show1-large.jpg\
    \ 768w\"\n     sizes=\"(max-width: 768px) 90vw,\n     (max-width: 1800px) 24vw,\
    \ 50vw\"\n     class=\"thumbnail\" />\n```\n\nThis instead declares that at the\
    \ different viewport sizes pick an image that suits best a certain viewport width\
    \ (vw) size. For this design, they are essentially the same, but it gives you\
    \ an idea of how smart you can let your browser be. It's worth noting that this\
    \ smartness can actually cause confusion when testing; I have frequently found\
    \ myself wondering why the tag wasn't working how I expected it to, only to realize\
    \ that it was due to the browser holding on to cached version of the images, or\
    \ optimizing for a retina screen, and again caching those images. To debug what's\
    \ happening while figuring out your `srcsets`, I recommend using incognito / private\
    \ windows, double-checking your screen resolution, and keeping developer tools\
    \ open to see what files the browser is actually loading.\n\nIf this smartness\
    \ is too unpredictable for you and you find yourself needing more control, then\
    \ the `picture` tag is for you."
- md: "114 Jump Start Responsive Web Design\n\n## The `picture` Element\n\nTry replacing\
    \ the img tags with the below:\n\n```html\n5-7. Chapter5/picture_tag/index.html\
    \ (excerpt)\n\n<picture>\n    <source srcset=\"../images/show1-small.jpg\"\n \
    \   media=\"(max-width: 320px)\" class=\"thumbnail\">\n    <source srcset=\"../images/show1-medium.jpg\"\
    \n    media=\"((min-width: 320px) and (max-width: 480px))\"\n    class=\"thumbnail\"\
    >\n    <source srcset=\"../images/show1-large.jpg\"\n    media=\"(min-width: 480px)\"\
    \n    class=\"thumbnail\">\n    <img src=\"../images/show1-medium.jpg\"\n    class=\"\
    thumbnail\">\n</picture>\n```\n\n## More Homework\n\nAs with the previous section,\
    \ this example replaces one image, and to reduce repetition, I haven't included\
    \ code for replacing the other four images. You can find the code for replacing\
    \ the remaining images [here](here) if you want to try replacing the others too.\
    \ Keep the media queries the same and replace the images with the appropriate\
    \ files.\n\nWe've replaced the default img with the HTML5 picture element. This\
    \ element is still considered experimental (especially with Microsoft and older\
    \ Android browsers) but should be widely used soon. Helpfully, the img inside\
    \ the picture is a fallback image for browsers that don't support picture, meaning\
    \ that the browser will load a default image if it doesn't support the newer element.\n\
    \nI chose the medium-sized image, as it's not too large or small, allowing for\
    \ a reasonable level of responsiveness on unsupported browsers.\n\n> ## Supporting\
    \ Older Browsers\n\nIf you want to add better support for older browsers, you\
    \ can use a “polyfill” (a term for a library that plugs missing functionality).\
    \ Specifically, in this case, that's Scott Jehl's [picturefill](https://scottjehl.github.io/picturefill/).\n\
    \nOne other useful application of the picture element, enabled through its inner\
    \ source element, is to load different image formats, such as scaleable vector\
    \ images (SVGs):\n\n```html\n<picture>\n    <source srcset=\"logo.svg\" type=\"\
    image/svg+xml\">\n    <img src=\"logo.png\" alt=\"Logo\">\n</picture>\n```\n\n\
    If the browser doesn't support SVG images, then it will load the PNG instead.\n\
    \nAnother option is to load higher resolution images for high resolution screens:\n\
    \n```html\n<picture>\n    <source srcset=\"../images/show1-2x.jpg\"\n    media=\"\
    (min-resolution: 120dpi)\" class=\"thumbnail\">\n    <img src=\"../images/show1-medium.jpg\"\
    \n    class=\"thumbnail\">\n</picture>\n```\n\n## Responsive Video\n\nContinuing\
    \ the theme of semantic elements in HTML5, the respective elements for video and\
    \ audio are video and audio. Since we're building a video site in this book, I\
    \ won't focus too much on the audio element, but I think after using the picture\
    \ and video elements, you'll understand how to use it.\n\n## The video Element\n\
    \nMany years ago, I made a site of music videos. This was prior to the widespread\
    \ availability of broadband, and I spent a long time optimizing videos as much\
    \ as possible to make them viewable on slow connections. I also had to decide\
    \ what video plugin to use to display the video. Would it be best with Quicktime?\
    \ RealPlayer? Or the tool that everyone loves to hate now (but which was popular\
    \ at the time), Flash?\n\nThose video format wars are largely over now, replaced\
    \ by a series of standard formats and HTML5 elements, making a designer's life\
    \ much easier, and also reducing that user-experience-killing process of having\
    \ to download a plugin to view a video. The video element has a lot wider support\
    \ than picture, with only IE8 and early Android versions likely to cause you problems.\n\
    \nHowever, the file formats supported by the video element still present problems,\
    \ mostly thanks to vendors' differing attitudes to DRM and to which format is\
    \ the “best” to use (each vendor preferring the format it supports or helped to\
    \ develop). All browsers that support the video element support MPEG-4/H.264,\
    \ which is a compressed format. But it's also proprietary, which means browser\
    \ manufacturers must pay a license to use it. Support for the WebM and Ogg/Theora\
    \ formats (which are open formats) is less common, with really only Chrome, Firefox,\
    \ and Opera supporting them.\n\nHere's an example of the video element in use:\n\
    \n```html\n<video width=\"320\" height=\"240\" autoplay>\n  <source src=\"file.mp4\"\
    \ type=\"video/mp4\">\n  <source src=\"file.ogg\" type=\"video/ogg\">\n  Your\
    \ browser does not support the video tag.\n</video>\n```\n\nIt's a much simpler\
    \ and consolidated HTML element than the options that existed before. It loads\
    \ whichever video format is supported by the user's browser, or a default string\
    \ of text if the video element or the file formats it contains aren't supported.\
    \ The source elements are processed in the order presented. So, in the example\
    \ above, if the browser supports both formats, it will load the first one it sees.\
    \ That's about it; there isn't much particularly responsive about the video element,\
    \ except that it loads suitable video files with controls for them.\n\nThere are\
    \ a few tricks you can try to make videos more responsive, but let's start simply\
    \ by making the video player controls visible, adding a poster image (a thumbnail\
    \ shows before the video plays), and removing the manual size.\n\n```html\n<video\
    \ controls poster=\"../images/show1-medium.jpg\">\n    <source src=\"../videos/show1.ogv\"\
    \ type=\"video/ogg\">\n    <source src=\"../videos/show1.mp4\" type=\"video/mp4\"\
    >\n    Your browser does not support the video tag.\n</video>\n```\n\nEarly proposals\
    \ for the video element included having its own media queries (like the picture\
    \ element has, as we saw above). But the idea was dropped, meaning that different\
    \ video files can't be swapped out for different devices. So the only real way\
    \ to make the video responsive in any way is to use percentage widths, for example:\n\
    \n```css\nvideo {\n    width: 100%;\n    height: auto;\n}\n```\n\nThis will make\
    \ the video scale to fit its containing element, and you could use a `max-width`\
    \ property to limit the dimensional size it could grow to, or a smaller value,\
    \ such as 50%. However at larger screen sizes it won't prevent upscaling of the\
    \ video, meaning it could look pixelated if sized too large.\n\nUnless you specify\
    \ otherwise, a video will start to download to your browser once the page is loaded\
    \ (so that it's ready to view if a user chooses to watch it). Notice the potential\
    \ network overhead with a video, which isn't great for mobile users:\n\n118 Jump\
    \ Start Responsive Web Design\n\n![The video file size shown in the web inspector](img/bd4041c3e441a42781fa04a5cb5b773b_130_0.png)\n\
    \n5-8. The video file size shown in the web inspector\n\nThere's a partial solution\
    \ to this problem: add preload=\"none\" to the video tag:\n\n```html\n<video controls\
    \ poster=\"../images/show1-medium.jpg\" preload=\"none\">\n    ...\n</video>\n\
    ```\n\nNow the video will only load when a user clicks the play button, allowing\
    \ the user to choose when/if it's loaded.\n\nIn our code files, go ahead and comment\
    \ out the picture element (for now) and replace it with the video element as shown\
    \ above.\n\n![Video player example](img/bd4041c3e441a42781fa04a5cb5b773b_131_0.png)\n\
    \nIf you use a larger video, then the video scales quite well at larger sizes.\
    \ But you’ll notice that at larger player sizes (the tablet and TV breakpoints)\
    \ the poster image is pixelated.\n\nThere are no ideal solutions to this problem,\
    \ and hopefully, better solutions will emerge as the element evolves. (One possible\
    \ solution I’d like to see would be the option to set the poster image along with\
    \ the source sub-elements inside the video tags, ideally with support for breakpoints\
    \ and media format selective loading.)\n\nJump Start Responsive Web Design\n\n\
    ## Using a Larger Image as a Poster\n\nReplacing the poster image with the large\
    \ variant will mean the poster image scales across all file sizes, but it does\
    \ mean that we're loading an unnecessarily large file at certain breakpoints.\n\
    \nIf you want to style the poster element further (to change the dimensions or\
    \ add padding), you can target it directly with the following selector:\n\n```css\n\
    video[poster] {\n    ...\n}\n```\n\n## Background Image\n\nA way to create a responsive\
    \ image representation of the video is to remove the poster image and then instead\
    \ set a background image for the video, allowing you use media queries to load\
    \ the appropriate image.\n\nYou'll need to set a background image inline within\
    \ the `video` tag, or create a CSS style for each video to set the image, because\
    \ *each* video needs a different image set as a background.\n\nWith an inline\
    \ style:\n\n```html\n<video controls preload=\"none\"\n    style=\"background:\
    \ transparent\n    url('../images/show1-large.jpg')\n    0 0 / cover no-repeat;\"\
    >\n    ...\n</video>\n```\n\nAnd with a CSS class:"
  mdcn: "\n114 快速入门响应式网页设计\n\n## `picture` 元素\n\n尝试用以下代码替换 img 标签：\n\n```html\n5-7.\
    \ Chapter5/picture_tag/index.html (excerpt)\n\n<picture>\n    <source srcset=\"\
    ../images/show1-small.jpg\"\n    media=\"(max-width: 320px)\" class=\"thumbnail\"\
    >\n    <source srcset=\"../images/show1-medium.jpg\"\n    media=\"((min-width:\
    \ 320px) and (max-width: 480px))\"\n    class=\"thumbnail\">\n    <source srcset=\"\
    ../images/show1-large.jpg\"\n    media=\"(min-width: 480px)\"\n    class=\"thumbnail\"\
    >\n    <img src=\"../images/show1-medium.jpg\"\n    class=\"thumbnail\">\n</picture>\n\
    ```\n\n## 更多练习\n\n与上一节一样，这个示例替换了其中一张图片。为了减少重复，我没有包含替换其他四张图片的代码。如果你想尝试替换其他图片，可以在这里找到相关代码[here](here)。请保持媒体查询不变，并用适当的文件替换图片。\n\
    \n我们已经用 HTML5 的 picture 元素替换了默认的 img。这个元素目前仍被认为是实验性的（尤其是在 Microsoft 和较旧的 Android\
    \ 浏览器中），但预计很快就会被广泛使用。有益的是，picture 内部的 img 作为不支持 picture 元素的浏览器的后备图像，这意味着如果浏览器不支持这个新元素，它会加载一个默认图像。\n\
    \n我选择了中等大小的图像，因为它不太大也不太小，可以在不支持的浏览器上实现合理的响应性。\n\n> ## 支持较旧的浏览器\n\n如果你想为较旧的浏览器提供更好的支持，可以使用\
    \ \"polyfill\"（一个用于填补缺失功能的库的术语）。具体到这个例子，指的是 Scott Jehl 的 [picturefill](https://scottjehl.github.io/picturefill/)。\n\
    \npicture 元素的另一个有用应用是，通过其内部的 source 元素，可以加载不同的图像格式，例如可缩放矢量图像 (SVG)：\n\n```html\n\
    <picture>\n    <source srcset=\"logo.svg\" type=\"image/svg+xml\">\n    <img src=\"\
    logo.png\" alt=\"Logo\">\n</picture>\n```\n\n如果浏览器不支持 SVG 图像，它将加载 PNG 格式。\n\n\
    另一个选择是为高分辨率屏幕加载更高分辨率的图像：\n\n```html\n<picture>\n    <source srcset=\"../images/show1-2x.jpg\"\
    \n    media=\"(min-resolution: 120dpi)\" class=\"thumbnail\">\n    <img src=\"\
    ../images/show1-medium.jpg\"\n    class=\"thumbnail\">\n</picture>\n```\n\n##\
    \ 响应式视频\n\n延续 HTML5 语义元素的主题，视频和音频对应的元素分别是 video 和 audio。由于我们在本书中构建的是视频网站，我不会过多关注\
    \ audio 元素，但我相信在使用了 picture 和 video 元素之后，你会理解如何使用它。\n\n## video 元素\n\n多年前，我制作了一个音乐视频网站。那是在宽带普及之前，我花了大量时间尽可能优化视频，使其在慢速连接上也能观看。我还必须决定使用哪种视频插件来播放视频。是用\
    \ Quicktime 最好？RealPlayer？还是现在人人讨厌（但在当时很流行）的 Flash？\n\n那些视频格式大战现在基本上已经结束，被一系列标准格式和\
    \ HTML5 元素所取代，这大大简化了设计师的工作，也减少了那个破坏用户体验的不得不下载插件才能观看视频的过程。video 元素比 picture 元素的支持范围更广，只有\
    \ IE8 和早期的 Android 版本可能会给你带来麻烦。\n\n然而，video 元素支持的文件格式仍然存在问题，这主要是由于供应商对 DRM 的态度不同，以及对哪种格式是“最佳”使用格式（每个供应商都偏好自己支持或参与开发的格式）的看法不一。所有支持\
    \ video 元素的浏览器都支持 MPEG-4/H.264，这是一种压缩格式。但它也是专有的，这意味着浏览器制造商必须支付许可费才能使用它。对 WebM\
    \ 和 Ogg/Theora 格式（开放格式）的支持较少，实际上只有 Chrome、Firefox 和 Opera 支持它们。\n\n以下是 video 元素使用示例：\n\
    \n```html\n<video width=\"320\" height=\"240\" autoplay>\n  <source src=\"file.mp4\"\
    \ type=\"video/mp4\">\n  <source src=\"file.ogg\" type=\"video/ogg\">\n  Your\
    \ browser does not support the video tag.\n</video>\n```\n\n这比以前存在的选项要简单和整合得多。它会加载用户浏览器支持的视频格式，或者如果\
    \ video 元素或其包含的文件格式不被支持，则显示一段默认文本。source 元素按呈现的顺序处理。因此，在上面的示例中，如果浏览器支持两种格式，它将加载看到的第一个。大概就是这样；video\
    \ 元素本身并没有太多特别的响应式特性，除了它会加载合适的视频文件并带有控制条。\n\n你可以尝试一些技巧使视频更具响应性，但让我们先从简单开始：使视频播放器控件可见，添加海报图像（视频播放前显示的缩略图），并移除手动尺寸设置。\n\
    \n```html\n<video controls poster=\"../images/show1-medium.jpg\">\n    <source\
    \ src=\"../videos/show1.ogv\" type=\"video/ogg\">\n    <source src=\"../videos/show1.mp4\"\
    \ type=\"video/mp4\">\n    Your browser does not support the video tag.\n</video>\n\
    ```\n\nvideo 元素的早期提案包括拥有自己的媒体查询（就像我们上面看到的 picture 元素那样）。但这个想法被放弃了，这意味着不能为不同的设备更换不同的视频文件。因此，唯一真正能让视频在任何方面具有响应性的方法是使用百分比宽度，例如：\n\
    \n```css\nvideo {\n    width: 100%;\n    height: auto;\n}\n```\n\n这将使视频缩放以适应其包含元素，你可以使用\
    \ `max-width` 属性来限制其可能增长到的尺寸，或者使用更小的值，例如 50%。然而，在较大的屏幕尺寸下，它不会阻止视频的放大，这意味着如果尺寸过大，视频可能会看起来有像素感。\n\
    \n除非你特别指定，否则视频将在页面加载后立即开始下载到你的浏览器中（以便用户选择观看时已准备好）。注意视频可能带来的潜在网络开销，这对移动用户来说不太好：\n\
    \n118 快速入门响应式网页设计\n\n![Web 检查器中显示的视频文件大小](img/bd4041c3e441a42781fa04a5cb5b773b_130_0.png)\n\
    \n5-8. Web 检查器中显示的视频文件大小\n\n这个问题有一个部分解决方案：在 video 标签中添加 preload=\"none\"：\n\n\
    ```html\n<video controls poster=\"../images/show1-medium.jpg\" preload=\"none\"\
    >\n    ...\n</video>\n```\n\n现在视频只会在用户点击播放按钮时加载，允许用户选择何时/是否加载。\n\n在我们的代码文件中，请注释掉\
    \ picture 元素（暂时），并用上面所示的 video 元素替换它。\n\n![视频播放器示例](img/bd4041c3e441a42781fa04a5cb5b773b_131_0.png)\n\
    \n如果你使用更大的视频，那么视频在较大尺寸时缩放效果相当好。但你会注意到，在较大的播放器尺寸（平板和电视断点）下，海报图像会有像素感。\n\n这个问题没有理想的解决方案，希望随着元素的演进会出现更好的解决方案。（我希望能看到的一个可能的解决方案是，可以沿着视频标签内的\
    \ source 子元素一起设置海报图像，理想情况下支持断点和媒体格式选择性加载。）\n\n快速入门响应式网页设计\n\n## 使用更大的图像作为海报\n\n\
    将海报图像替换为大尺寸变体将意味着海报图像在所有文件尺寸下都能缩放，但这确实意味着我们在某些断点下加载了一个不必要的大文件。\n\n如果你想进一步设置海报元素的样式（更改尺寸或添加内边距），可以直接使用以下选择器定位它：\n\
    \n```css\nvideo[poster] {\n    ...\n}\n```\n\n## 背景图像\n\n一种创建视频响应式图像表示的方法是移除海报图像，然后为视频设置背景图像，允许你使用媒体查询加载合适的图像。\n\
