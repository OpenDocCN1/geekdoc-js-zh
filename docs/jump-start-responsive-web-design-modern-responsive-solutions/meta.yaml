    \ 768px) 480px,\n                (max-width: 1800px) 320px, 768px\"\n        \
    \ class=\"thumbnail\" />\n    <p class=\"showdescription\">Lorem ipsum dolor sit\
    \ amet,\n        consectetur adipiscing elit.</p>\n</section>\n```\n\n> ![Some\
    \ Homework Icon](image:icon)\n**Some Homework**\nThis example replaces one image,\
    \ and to reduce repetition, I haven’t included code for replacing the other four\
