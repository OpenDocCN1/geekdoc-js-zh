  md: "# Query Features\n\nThe width and height queries we've looked at so far are\
    \ some of the most widely used, but there are several other **media features**\
    \ that are also useful for checking against device features. These include color\
    \ capabilities, aspect ratio, orientation, resolution, and vendor-specific features\
    \ for Mozilla- and WebKit-based browsers. Most of these accept min- and max- prefixes\
    \ that work in a similar way to the dimension queries above.\n\n```\naspect-ratio\n\
    ```\n\nThe aspect-ratio feature allows you to check the ratio of horizontal pixels\
    \ to vertical pixels, separated by a slash. For example:\n\n```\n@media screen\
    \ and (min-aspect-ratio: 1/1) {\n    ...\n}\n```\n\nThe above rule will match\
    \ a device where the screen's width to height ratio is 1:1 or more, so square\
    \ or landscape.\n\nA common use for this would be to detect wider screens, useful\
    \ when you're displaying videos:\n\n```\n@media screen and (min-aspect-ratio:\
    \ 16/9) {\n    ...\n}\n```\n\n```\norientation\n```\n\nAs shown earlier, this\
    \ feature checks if the device is in landscape or portrait mode. For example:"
  merge: -1
  pgno: 41
- img_proc: true
  md: "```\n@media all and (orientation: landscape) {\n    ...\n}\n```\n\nAnd:\n\n\
    ```\n@media all and (orientation: portrait) {\n    ...\n}\n```\n\n# color\n\n\
    This feature checks if a device can support a certain bit-level of color. For\
    \ example, this is how to check that a device supports at least 8-bits of color\
    \ (that is, 256 colors):\n\n```\n@media all and (min-color: 8) {\n    ...\n}\n\
    ```\n\n# color-index\n\nThis plays a role similar to color, but lets you check\
    \ for the number of colors instead of the bit-level:\n\n```\n@media all and (min-color-index:\
    \ 256) {\n    ...\n}\n```"
  merge: -1
