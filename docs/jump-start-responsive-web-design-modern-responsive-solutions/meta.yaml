    \ {\n    width: 125px;\n    height: auto;\n}\n```\n\n这将`showlistings`部分设置为另一个flex容器，它会换行任何不适合一行的项目——因为默认情况下，flex会尝试将所有项目放在一行。\n\
    \n此时，你也可以从HTML和CSS中删除`left`类，因为它不再需要。\n\n## 3-18. 最终的flexbox布局\n\n另一个很酷的flexbox技巧是使用order属性设置元素的顺序，以及一个定义其位置的数字。例如，你可以使用以下代码在移动设备上重新排列页面元素：\n\
    \n```\nnav { order: 1;}\nheader { order: 2;}\nmain { order: 3;}\nfooter { order:\
    \ 4;}\n```\n\n但如果你想移除页面元素，你仍然需要使用媒体查询。\n\n这是一个关于如何使用flexbox的简要示例，但正如你所看到的，一旦你重构了页面，flexbox就会为你处理大量手动页面重排工作。\n\
    \n## CSS Grid布局\n\n与flexbox相辅相成的是CSS Grid布局模块，它帮助你定义和布局页面的区域。过去，Web开发者对于灵活（我在此宽泛地使用这个词）页面布局的主要选择是使用HTML表格来定义具有行和列的页面区域，但这些对可访问性非常糟糕。Grid布局在某种程度上是该概念的现代重新诠释。\n\
    \n> **浏览器对Grid布局的支持**\n>\n> Grid于2017年初在所有主要浏览器的最新版本中发布，因此如果你的布局需要支持旧版浏览器，则需要一个回退策略。\n\
    > 你可以[在线查看](https://example.com)哪些浏览器版本支持或不支持Grid的详细信息。\n\n让我们尝试将Grid布局应用于演示站点，从[本章开头的代码](https://example.com)开始。\n\
    \n同样，在body内创建一个容器div来包含布局：\n\n```\n...\n<div class=\"container\">\n...\n</div>\n\
    ...\n```\n\n将aside从main内部移到外部。这让你可以将其视为一个独立的列：\n\n```\n...\n</main>\n<aside class=\"\
    left\">\n    <ul>\n    <li>one</li>\n    <li>two</li>\n    <li>three</li>\n  \
    \  </ul>\n</aside>\n```\n\n在CSS中，将`display`类型更改为`grid`：\n\n```\n.container {\n\
    \    display: grid;\n}\n```\n\n现在grid显示变得非常酷。添加以下内容：\n\n```\n.container {\n  \
    \  display: grid;\n    grid-template-columns: 66% 33%;\n}\n```\n\n> **移除尺寸覆盖**\n\
    >\n> 与flexbox布局一样，你也可以借此机会移除媒体查询中所有其他的尺寸覆盖。\n\n在一个简单的CSS属性中，你已经移除了迄今为止使用的两个CSS类的需求。`grid-template-columns`属性为你提供了更多的可能性。例如：\n\
    \n- 你可以使用任何标准的尺寸单位来定义列，包括`auto`来填充剩余空间。\n- 你可以使用`fr`（“fractional units”，分数单位）让网格按比例填充空间。所以你可以将此网格重写为`grid-template-columns:\
    \ 2fr 1fr;`，这意味着第一列将占据三分之二的空间，第二列占据三分之一。\n\n很好，但如果你现在查看演示站点，你会注意到设计中没有66/33分割的行看起来不对。这是因为你还需要使用类似的语法定义行：\n\
    \n```\n.container {\n    display: grid;\n    grid-template-columns: 66% 33%;\n\
    \    grid-template-rows: 80px 80px auto 20px;\n}\n```\n\n> **需要多少行？**\n>\n> 这是我们第一个需要显式定义行的例子，有几种方法可以做到。我建议有四行：标题、顶部菜单、介绍文本和电视节目，以及页脚。如果你想更改这些划分（例如，将描述和电视节目分开），请随意操作。\n\
    \n此语法为三个元素指定了固定高度，然后让剩余的电视节目元素填充剩余的空白空间。\n\n但同样，如果你在浏览器中加载页面，变化不大。事实上，`footer`现在已经跳到了页面的上方。这是因为还需要一个步骤——将子元素添加到网格中：\n\
    \n## 使用Grid系统构建更好的响应式结构\n\nGrid显示布局有两个有趣的方法来定义你可以放置项目的位置。\n\n1. 第一种类似于flexbox，允许你指定一个顺序编号。\n\
    2. 第二种允许你将项目放置在命名的位置。要使用此方法，你需要定义所谓的**线名称**。\n\n下面的代码将`display`样式设置为`grid`，然后定义你需要的列和行。对于列，这是一个名为`left`的列，占页面宽度的66%，和一个名为`right`的列，填充33%。对于行，这定义了三个固定高度的行（header,\
    \ main-nav和footer），而`shows`将自动填充任何剩余空间。\n\n```\n.container {\n    display: grid;\n\
    \    grid-template-columns: [left] 66% [right] 33%;\n    grid-template-rows: [header]\
    \ 80px [main-nav] 40px [shows]\n    auto [footer] 20px;\n}\n```\n\n此时，既然你已经理解了发生了什么，是时候让它移动优先了。将当前的`container`类更改为以下内容：\n\
    \n```\n.container {\n    display: grid;\n    grid-template-columns: [left] 100%;\n\
    \    grid-template-rows: [header] 80px [main-nav] 40px [shows]\n    auto [footer]\
    \ 20px;\n}\n```\n\n对于更大的屏幕尺寸：\n\n```\n@media only screen and (min-width: 992px)\
    \ {\n    .container {\n    grid-template-columns: [left] 66% [right] 33%;\n  \
    \  }\n    ...\n}\n```\n\n如果你曾经在桌面出版应用程序中创建过表格（或者记得在网页设计的黑暗时代使用表格进行布局），你会知道你需要定义一个项目如何“跨越”多个单元格或行。Grid显示的技术是相同的。以`header`为例：\n\
    \n```\nheader {\n    grid-column-start: left;\n    grid-column-end: right;\n \
    \   grid-row-start: header;\n    grid-row-end: header;\n```\n"
