- img_proc: true
  md: '# Chapter 5


    # Responsive Images and Video


    The exchange of text-based content brought the web into existence, but images
    and other rich media have kept it evolving and made it what we all know/love/dislike.


    Options for making images responsive has developed rapidly in recent years, with
    the ability to load images perfectly suited to users'' devices. And the addition
    of new HTML elements like `video` has opened up new options for responsive design.
    It''s fresh territory, but with pitfalls, compromises, and new techniques to learn.
    So let''s get going!'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# # Images


    Images are a powerful communication device, portraying a message, intent, explanation,
    and bringing life to your web pages.


    Images have also been a constant source of anguish for designers (web and print)
    for many years, and while HTML5 has brought a lot of improvements, adding responsive
    images to your web page still requires planning and preparation.


    For this chapter, I''ve replaced the placeholder graphics used up to this point
    on the site with images from royalty free sites to represent what a site with
    real TV shows might look like.


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_117_0.png)


    5-1. Adding show images


    There are issues with the page now that we''ve added real images. The most obvious
    is that, while the layout is still fine, all the images are forced into the same
    dimensions, which means they aren''t taking advantage of the available'
  merge: -1
  pgno: 117
- img_proc: true
  md: "screen space. The example site is for browsing and watching videos, so it makes\
    \ sense to make the visual content as prominent and easy to see as possible.\n\
    \nTo show how to use responsive images, we'll change the demo site to have different\
    \ image sizes and layouts suited to each use case at the breakpoints defined in\
    \ [Chapter 3](#).\n\nFirst, change the CSS and HTML to better accommodate the\
    \ images we'll be adding. Let's give the main content area more space and reduce\
    \ the size of the aside menu:\n\n```\n@media only screen and (min-width: 992px)\
    \ {\n    aside {\n        width: 15%;\n        display: block;\n    }\n\n    section.showslisting\
    \ {\n        width: 75%;\n    }\n}\n```\n\nAdd the mobile first styles for the\
    \ divs that contain details about a show. This sets a maximum width of 480px,\
    \ centered, with an ideal width of *most* of the screen:\n\n```\nsection.tvshow\
    \ {\n    width: 90%;\n    max-width: 480px;\n    margin: 0 auto;\n    display:\
    \ block;\n}\n```\n\nNext, add a media query for the same div when displayed on\
    \ larger screens—still centered and filling most of the screen:"
  merge: -1
  pgno: 118
- img_proc: true
  md: "```\n@media only screen and (min-width: 480px) {\n    section.tvshow {\n  \
    \      max-width: 768px;\n    }\n}\n```\n\nAs we jump to a larger screen, let’s\
    \ start showing more than one thumbnail in a row. This actually means that images\
    \ will now be smaller, and the max-width of each div should be half the maximum\
    \ screen size for this media query:\n\n```\n@media only screen and (min-width:\
    \ 768px) {\n    section.tvshow {\n        width: 46%;\n        margin-right: 15px;\n\
    \        display: inline-block;\n        max-width: 496px; /* The next break point\
    \ divided by 2*/\n    }\n}\n```\n\nNext is the media query for larger screens,\
    \ where we now show four items per row and adjust the div and image sizes accordingly:\n\
    \n```\n@media only screen and (min-width: 992px) {\n    section.tvshow {\n   \
    \     width: 22%;\n        margin-right: 15px;\n        display: inline-block;\n\
    \    }\n}\n```\n\nFinally, change the media query for TV and larger screens:"
