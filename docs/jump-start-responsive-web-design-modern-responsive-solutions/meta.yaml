  md: '# Chapter 4


    # Responsive Text


    If web pages are to be truly responsive, then the content of pages should also
    flow and change to suit the dimensions of the device a user is viewing it on.
    While web pages are becoming more image and media heavy, text is still a crucial
    component, and there are numerous techniques to help make it as readable as possible,
    no matter the current device.


    To understand better the ways you can represent text on a web page, it''s best
    to take a trip into the long history of text.


    # The History of Text


    The principles of **typography** (the arranging and styling of text) have been
    evolving for as long as people have been printing words on pages. Measurements'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'such as leading (the space between lines of text), kerning (the space between
    letters) and tracking (the space between words) have carried over to desktop publishing,
    and anyone who''s used QuarkXpress, InDesign, or their predecessors, will know
    how they affect text.


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_97_0.png)


    4–1. Text formatting in Adobe InDesign


    Manual typesetting was a laborious process, as it involved tweaking the leading,
    kerning and tracking of every line of text. Desktop publishing, and more recently
    setting type with CSS, has made it far easier to play with these properties in
    an attempt to get the “perfect” text.


    CSS typography shares many of the same properties as print typography but has
    some different names. In fact, it has more descriptive names than the older print
    version.'
  merge: -1
  pgno: 97
- img_proc: true
  md: "In the early days of the Web, the level of typographic control was limited,\
    \ but CSS3 has helped greatly, giving us more tools to realize our designs.\n\n\
    # Responsive Typographical Properties in CSS\n\nThere are lots of text-related\
    \ properties you can set with CSS. Here are some that I consider the most useful\
    \ for responsive design:\n\n+   - font-size: the size of the font.\n- line-height:\
    \ specifies the minimum height of lines within block elements, and the actual\
    \ line height of inline elements.\n- font-weight: the “weight” of the font, or\
    \ how bold and strong it is.\n- text-decoration: used to set either underline\
    \ or strike-through.\n- text-align: used to set text alignment of left, right,\
    \ center, or justified (aligned to the left and right margins equally).\n- text-transform:\
    \ used to make text display as uppercase, lowercase or capitalized.\n- letter-spacing:\
    \ specifies the spacing between letters, much like leading.\n- word-spacing: specifies\
    \ the spacing between words, much like tracking.\n\nIt’s common to set some or\
    \ all of these properties with pixel values. For example, you could add the following\
    \ to the body selector of the current demo site:\n\n```\nbody {\n    font-size:\
    \ 18px;\n    line-height: 22px;\n    letter-spacing: 4px;\n}\n```\n\nThis will\
    \ result in text that looks like this:"
  merge: -1
  pgno: 98
- img_proc: true
  md: '![](img/bd4041c3e441a42781fa04a5cb5b773b_99_0.png)


    Other properties you may find useful in your designs are:


    +   - **font-style**: sets text to italic or oblique. Italic text may not be as
    readable on small screen as on large screens.

    - **text-indent**: sets the indentation (mostly) of the first line of text in
    a block of text. With space at a premium on smaller devices, it may be better
    to indent paragraphs than to set spaces between them.

    - **text-align-last**: sets the alignment of the last line of a text block. Again,
    at different devices sizes, you may want to handle this differently.

    - **white-space**: defines the handling of white space and wrapping in a block
    of text.

    - **word-wrap**: specifies if words are allowed to break over lines. This could
    be useful for optimizing text based on display size.


    You may be wondering how setting text at fixed sizes could be responsive. 18px
    is 18px whether it''s rendered on a desktop computer or a mobile screen. You'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'could use media queries to set different font sizes at various screen sizes,
    but this would become arduous, and there''s potentially a better method.


    CSS allows you to use different units for sizing elements, but especially with
    text. They fall into two camps: fixed sizing and relative sizing.


    # Fixed Sizing


    Fixed sizing means that the size is always the same. There are seven possible
    units you can use, but I''ll focus on the two most common, `px` and `pt` values.


    # Pixels


    Pixels are those little dots of color that comprise the screens of every device.
    When you need to set the size of an element in HTML, one CSS pixel equals one
    device pixel, right? Well, no…


    **Device pixels** (also called **screen pixels**) are the actual pixels comprising
    your screen, and traditionally this was the number of pixels in the width by height
    of a user''s screen. This may not be the same as the size of their browser window,
    as desktop users frequently resize it, and browsers don''t typically operate in
    full-screen mode.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '![](img/bd4041c3e441a42781fa04a5cb5b773b_101_0.png)


    4–3. Screen size vs browser size


    The newer, high-resolution screens—such as Apple’s “Retina” displays—complicate
    matters, as they use a larger number of pixels over the same screen area. Typically,
    this is achieved by doubling the number of pixels vertically and horizontally—though
    increasing numbers of screens have four times as many pixels in each direction.


    Complicating this further are users who scale or zoom their browser windows for
    accessibility or other reasons. For example, the screenshot below is the current
    demo site zoomed to 125%, where one *CSS pixel* now covers 1.25 *device pixels*.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Jump Start Responsive Web Design


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_102_0.png)


    For these reasons, it’s best to ignore actual device pixels and focus on **CSS
    pixels**—the pixel values you set in your CSS file. The CSS pixel value is a more
    accurate number, which takes into account the factors outlined above. Browsers
    also handle a lot of the scaling issues for you.


    The **pixel** (px) sizing unit theoretically represents the size of one pixel
    of a screen. In relation to text, this means that when setting text to 16px, the
    length of the lowest point in the text (such as the bottom of a lowercase ''g'')
    to the highest point (such as the top of a lowercase ''h'') is 16px.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '![](img/bd4041c3e441a42781fa04a5cb5b773b_103_0.png)


    4-5. Text height includes ascenders and descenders


    For other properties, such as letter-spacing, this literally means the number
    of pixels between characters at their widest point.


    # Points


    As you saw in the earlier screenshot from InDesign, the **point** (pt) sizing
    unit has its heritage in print text and is more confusing to understand. It represents
    a similar size to the pixels example, but as different operating systems and screens
    represent pixels to points in different ways, they are best reserved for print
    styles.


    # Relative Sizing


    Relative sizing is more suited to web and responsive design, as sizes will change
    relative to a base size. But it’s useful to understand fixed sizing (at least
    pixels) to appreciate how these sizing methods work. The most popular units for
    relative font sizing are the %, em, and rem values.


    The first important fact to know when using relative sizes is what these sizes
    are relative to. By default in all browsers, it’s 16px, but if a user has changed
    this default—for example, to compensate for low vision—then relative sizes will
    still scale up and down proportionally.'
  merge: -1
  pgno: 103
- img_proc: true
  md: "![](img/bd4041c3e441a42781fa04a5cb5b773b_104_0.png)\n\n# Percent\n\nSetting\
    \ a percentage value for a font size means making it a percentage of the default\
    \ font size, so if a user has the font size of their browser set at 16px, then\
    \ `font-size: 100%;` will still equal 16px, and `font-size: 50%` will equal 8px.\n\
    \nAs an example, let’s try applying percentage sizing to the demo site, again\
    \ with a mobile first approach, setting the base font size for users of devices\
    \ with smaller screens.\n\n> ### We're Assuming a Base Font Size of 16px\nFor\
    \ these examples, I'll assume that the base font size is the default **16px**.\
    \ If it's different in your browser, then the sizes stated will be different.\n\
    \nAdd a base font size to the `body` element that sets the default font size to\
    \ 75% of 16px, which is 12px:\n\n```\nbody {\n    font-size: 75%;\n}\n```\n\n\
    Then, in the tablet and desktop media queries, add font sizes for the larger screen\
    \ sizes:"
  merge: -1
  pgno: 104
- img_proc: true
  md: "```\n...\n@media only screen and (min-width: 768px) {\n    body {\n       \
    \ font-size: 100%;\n    }\n}\n\n@media only screen and (min-width: 992px) {\n\
    \    body {\n        font-size: 125%;\n    }\n}\n```\n\nThis results in a subtly\
    \ more pixelated font rendering on larger screens than on medium-sized screens.\n\
    \n# Em\n\nDespite its recent rise in popularity with web designers, the em unit\
    \ is an old typographical unit named after the letter “M”. The base value of an\
    \ em unit is equal to the current typeface size in points. For example, one em\
    \ in a 16-point typeface is 16 points.\n\nIn practice, it works in a similar way\
    \ to percentage sizing, but the units are smaller. So, for example, assuming a\
    \ default font size of 16px, font-size: 1em will still equal 16px, and font-size:\
    \ 0.5em will equal 8px.\n\nThe unit values are smaller with ems, but it's easy\
    \ for styles to result in large font sizes accidentally. For example, consider\
    \ font-size: 4em; while the number doesn't look large, it actually equals 64px.\
    \ Of course, you could set your default font size to something smaller, and then\
    \ increasing ems won't result in such large variations.\n\nAs an example, let's\
    \ try applying em sizing to the demo site, again with a mobile first approach."
  merge: -1
