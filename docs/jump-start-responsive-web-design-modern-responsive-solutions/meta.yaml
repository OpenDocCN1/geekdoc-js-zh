  md: '# 16 Jump Start Responsive Web Design


    +   - A `section` element is used to contain the main content of an article or
    a significant area of a page.

    - An `aside` element defines a small sub-section that relates to a main section.

    - A `main` element wraps other elements unique to the page. In our example, these
    are the `section` and `aside` elements. The other elements will repeat across
    other pages.

    - A `footer` element is used for the site''s legal name, dates etc. Other sections
    of the page can also have their own `footer` element.


    The HTML5 specification lists other semantic elements that perform specific functions,
    and we''ll cover many of them in this book. A well-structured page is very important
    for responsive design, and also helps with accessibility and SEO.


