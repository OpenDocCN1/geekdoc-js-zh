    ![](img/bd4041c3e441a42781fa04a5cb5b773b_57_0.png)


    This is still a better result than a page without the viewport, but as you can
    see, if the page content is wider than the width you define, it will continue
    anyway. One use case for setting a manual width is if you''re certain of screen
    dimensions, and certain that your page content will fit perfectly—for example,
    if you''re only targeting one device, like an eReader, or kiosk application.


    There are other, less frequently used attributes for the viewport meta element
    that have limited use, but which you might need for more fine-grained control
    over your page layout:'
- md: "# Any Queries?\n\n- minimum-scale: the minimum zoom level, or how much the\
    \ user can zoom out.\n- maximum-scale: the maximum zoom level, or how much the\
    \ user can zoom in.\n- user-scalable=no: disables zooming. While this has a limited\
    \ number of use cases, it significantly reduces the accessibility of your page.\n\
    \nThe selective nature of media queries makes them an essential tool in your responsive\
    \ toolbox, and in this chapter, we've learned how to create and use them.\n\n\
    Every modern browser now supports them, and they offer the potential to target\
    \ any specific environments you need to design for.\n\nIn coming chapters, we'll\
    \ leverage the responsive foundation that media queries and the viewport offer\
    \ to add polish and shine to our responsive designs.\n\n# Chapter 3\n\n# Better\
    \ Responsive Structures with Grid Systems\n\nSo far, we've looked at the underlying\
    \ principles of responsive design and the power of media queries to build page\
    \ structures optimized for different devices. In this chapter, we'll see how grid\
    \ systems can supplement and even replace some of the techniques we've covered\
    \ so far, providing more flexibility for how pages display across different devices.\n\
    \nWhile flexibility in design is endless in theory, a common design ethic in print\
    \ and digital design has been to use loose horizontal and vertical grids for element\
    \ layout. They help break up sections of a page into logical areas that are easier\
    \ to manage, and our brains like to see items in a composition in predictable\
    \ lines. Composition in artwork and photos is a long-standing field of study,\
    \ and many of its theories continue into web design.\n\n# 48 Jump Start Responsive\
    \ Web Design\n\nIf you look at the current demo page on a desktop, it's effectively\
    \ a grid consisting of four rows and two columns:\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_60_0.png)\n\
    \n3-1. The initial page grid\n\nWhen you resize the page, the media queries added\
    \ in the last chapter take care of changing the row and column layouts to fit\
    \ accordingly.\n\nThis is because the current layout is a simple example of what's\
    \ called a **fluid grid**. The main sections of the page have widths that are\
    \ percentages of the viewport width, and thus will resize accordingly.\n\nOn a\
    \ desktop, the main listing of the TV shows takes up 66% (or two thirds) of the\
    \ web page, and the menu 33% (or one third).\n\n# Better Responsive Structures\
    \ with Grid Systems 49\n\n```\n@media only screen and (min-width: 992px) {\n \
    \   aside {\n        width: 33%;\n        display: block;\n    }\n\n    section.showslisting\
    \ {\n        width: 66%;\n    }\n\n    .showdescription {\n        white-space:\
    \ normal;\n        width: 125px;\n    }\n}\n```\n\nThe fluidity of the design\
    \ can go further than this. Layouts inside a page area can also take up a percentage\
    \ of the available space. For example, you could set the individual TV listings\
    \ to have a flexible width:\n\n```\nsection.tvshow {\n    width: 20%;\n    height:\
    \ 150px;\n    display: inline-block;\n}\n```\n\nThis means that each subsection\
    \ will take up 20% of the main content area, no matter what the screen size is.\
    \ This can start to get fiddly, and is more of an example to show that percentage-based\
    \ sizes can go anywhere—on text and even media elements (both of which we’ll cover\
    \ in later chapters).\n\nWhile the current page layout is a grid, it could be\
    \ better, with more meaningful class names and a better structure.\n\nCreate a\
    \ new div element with a class of container that wraps all the current content\
    \ within the body element:\n\n50 Jump Start Responsive Web Design\n\n```\n3-3.\
    \ Chapter3/vanilla_final/index.html (excerpt)\n\n<body>\n<div class=\"container\"\
    >\n...\n</div>\n</body>\n```\n\nAdd the following styles for this div to your\
    \ stylesheet:\n\n```\n3-4. Chapter3/vanilla_final/layout.css (excerpt)\n\n.container\
    \ {\n    width: 95%;\n    margin-left: auto;\n    margin-right: auto;\n    max-width:\
    \ 1180px;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_62_0.png)\n\n3-5.\
    \ The layout with the extra container\n\nThis is a common way to set up a containing\
    \ element for page content. It sets a maximum width of 1180px, a width of 95%\
    \ of the browser window, and centers the container in the window using the handy\
    \ left and right auto margins.\n\n> ## Why 1180px?\n\nWhy is the max-width set\
    \ to 1180px? This is an arbitrary value and based upon current trends in desktop\
    \ screen sizes; it’s added to make sure the page doesn’t get *too* wide on giant\
    \ screens. For a long time, it was 960px, reflecting that most screen widths were\
    \ at most 1024px wide. As screen dimensions and resolutions have grown, this maximum\
    \ width has become larger, but is still open to different opinions. Media queries\
    \ (covered in Chapter 2) have made this maximum width less relevant than it used\
    \ to be. For now, stick with this **1180px** value.\n\nNext, add a row class to\
    \ the header, navigation, listings and footer elements. You can also now remove\
    \ the left class from these elements, as you’ll consolidate its CSS properties:\n\
    \n```\n<header class=\"row\">\n    ...\n</header>\n\n<nav class=\"row\">\n   \
    \ ...\n</nav>\n\n<main class=\"row\">\n    ...\n</main>\n\n<footer class=\"row\"\
    >\n    ...\n</footer>\n```\n\nAnd define the row CSS class:\n\n52 Jump Start Responsive\
    \ Web Design\n\n```\n.row {\n    clear: both;\n    float: left;\n}\n```\n\nThis\
    \ row fills the width of the container and floats to the left, meaning that as\
    \ a browser window resizes, it will flow with it, fixed to the left side. As you\
    \ haven't yet defined the columns in the rows, the aside menu is pushed to the\
    \ bottom on larger screen sizes.\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_64_0.png)\n\
    \n3-6. The new page structure\n\nNow that everything horizontal on the page is\
    \ in four rows, it's time to define the columns inside the rows. Some of the rows\
    \ are a single, full-width column, while others are subdivided.\n\nTo start afresh,\
    \ remove the simpler percentage widths set earlier (from all media queries), so\
    \ that you have the following:\n\n```\n@media only screen and (min-width: 320px)\
    \ {\n    aside {\n        display: none;\n    }\n\n    section.showsliding {\n\
    \    }\n\n    .showdescription {\n        display: none;\n    }\n}\n\n...\n\n\
    @media only screen and (min-width: 992px) {\n    aside {\n        display: block;\n\
    \    }\n\n    section.showsliding {\n    }\n\n    .showdescription {\n       \
    \ white-space: normal;\n        width: 125px;\n    }\n}\n```\n\nThe page is no\
    \ longer flowing so well at larger screen sizes, but you'll fix this soon.\n\n\
    # What Is a Grid?\n\nBefore you restructure the page into a fluid grid, let's\
    \ take a quick aside to discuss what a grid is.\n\nA **grid** is a series of columns\
    \ and rows. But how many rows and columns do you need for your site? The number\
    \ of rows is more clear: it's as many as you need to fit your header, navigation,\
    \ content, footer etc. What about columns? Well, as with other topics in this\
    \ book (and technology generally), there are different opinions on this. It's\
    \ typically an even number, because this makes it easier to divide the page. Numbers\
    \ divisible by three are most used. (If you're interested in knowing why, [the\
    \ Wikipedia article on the golden ratio](https://en.wikipedia.org/wiki/Golden_ratio)\
    \ provides a nice explanation). Popular column values are 12, 16 and 24, but I'll\
    \ focus on the 12-column grid system here. 12 is popular, as it can be divided\
    \ into a variety of commonly used sizes, such as a half, a third, and a quarter.\n\
    \n# Creating Your Own Grid\n\nYou may be wondering how a 12-column layout helps\
    \ you create a 3-column layout like our example page—and yes, it's confusing at\
    \ first.\n\nThe columns are more used as structural underpinnings, and through\
    \ CSS you define how many columns you want your elements to span. To make this\
    \ clearer, here's an example of the 12-column 1180px grid:\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_67_0.png)\n\
    \n3-7. A 12-column, 1180px grid\n\nAnd here's how the grid will represent this\
    \ page (yes, grids within grids, or “nested grids”, are okay):\n\n56 Jump Start\
    \ Responsive Web Design\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_68_0.png)\n\
    \n3–8. The page as a grid\n\nYou could set up all these columns and grids manually\
    \ for each project, but it's a much better idea to make something more usable\
    \ and reusable. We're going to create a lot of new styles and changes to our HTML\
    \ and CSS files now. Then I'll show easier ways to achieve the same result. Sometimes\
    \ it's a good idea to learn the hard way before knowing how to make it easier.\n\
    \nSet up the base styles for the columns and rows, and replace any existing matching\
    \ classes:"
  mdcn: "\n# 任何问题？\n\n-   `minimum-scale`：最小缩放级别，或用户可以缩小的程度。\n-   `maximum-scale`：最大缩放级别，或用户可以放大的程度。\n\
    -   `user-scalable=no`：禁用缩放。虽然这仅适用于有限的用例，但它会显著降低你页面的可访问性。\n\n媒体查询的这种选择性特质使其成为你响应式工具箱中必不可少的工具，在本章中，我们已经学习了如何创建和使用它们。\n\
    \n现在，所有现代浏览器都支持媒体查询，它们为你针对需要设计的任何特定环境提供了可能性。\n\n在接下来的章节中，我们将利用媒体查询和视口提供的响应式基础，为我们的响应式设计增添光彩和亮点。\n\
    \n# 第3章\n\n# 使用网格系统实现更好的响应式结构\n\n到目前为止，我们已经探讨了响应式设计的基本原理以及利用媒体查询构建针对不同设备优化的页面结构的强大功能。在本章中，我们将看到网格系统如何补充甚至替代我们目前涵盖的一些技术，为页面在不同设备上的显示方式提供更大的灵活性。\n\
    \n虽然设计的灵活性在理论上是无限的，但印刷和数字设计中的一个常见设计伦理是使用松散的水平和垂直网格来布局元素。它们有助于将页面的部分区域分割成更易于管理的逻辑区域，而且我们的大脑喜欢看到构图中的项目排列在可预测的线条上。艺术作品和照片中的构图是一个长期研究的领域，其许多理论一直延续到网页设计中。\n\
    \n# 48 快速入门响应式网页设计\n\n如果你在桌面上查看当前的演示页面，它实际上是一个由四行两列组成的网格：\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_60_0.png)\n\
    \n3-1. 初始页面网格\n\n当你调整页面大小时，上一章添加的媒体查询会负责相应地更改行和列布局。\n\n这是因为当前布局是一个所谓的**流式网格**的简单示例。页面的主要部分的宽度是视口宽度的百分比，因此会相应地调整大小。\n\
    \n在桌面上，电视剧的主要列表占据网页的 66%（或三分之二），菜单占据 33%（或三分之一）。\n\n# 使用网格系统实现更好的响应式结构 49\n\n\
    ```\n@media only screen and (min-width: 992px) {\n    aside {\n        width:\
    \ 33%;\n        display: block;\n    }\n\n    section.showslisting {\n       \
    \ width: 66%;\n    }\n\n    .showdescription {\n        white-space: normal;\n\
    \        width: 125px;\n    }\n}\n```\n\n设计的流动性可以更进一步。页面区域内的布局也可以占据可用空间的百分比。例如，你可以将各个电视剧列表设置为具有灵活的宽度：\n\
    \n```\nsection.tvshow {\n    width: 20%;\n    height: 150px;\n    display: inline-block;\n\
    }\n```\n\n这意味着每个子部分将占据主要区域 20% 的宽度，无论屏幕尺寸如何。这可能开始变得繁琐，但这更多是一个示例，表明基于百分比的大小可以应用于任何地方——包括文本甚至媒体元素（我们将在后面的章节中介绍这两者）。\n\
    \n虽然当前页面布局是一个网格，但它可以改进，使用更有意义的类名和更好的结构。\n\n创建一个新的 `div` 元素，类名为 `container`，它包裹\
    \ `body` 元素内的所有当前内容：\n\n50 快速入门响应式网页设计\n\n```\n3-3. Chapter3/vanilla_final/index.html\
    \ (excerpt)\n\n<body>\n<div class=\"container\">\n...\n</div>\n</body>\n```\n\n\
    为这个 `div` 添加以下样式到你的样式表：\n\n```\n3-4. Chapter3/vanilla_final/layout.css (excerpt)\n\
    \n.container {\n    width: 95%;\n    margin-left: auto;\n    margin-right: auto;\n\
    \    max-width: 1180px;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_62_0.png)\n\
    \n3-5. 带有额外容器的布局\n\n这是为页面内容设置包含元素的常用方法。它将最大宽度设置为 1180px，宽度为浏览器窗口的 95%，并使用方便的左右自动边距将容器在窗口中居中。\n\
    \n> ## 为什么是 1180px？\n\n为什么将最大宽度设置为 1180px？这是一个任意的值，基于当前桌面屏幕尺寸的趋势；添加它是为了确保页面在巨大屏幕上不会变得*太*宽。很长一段时间以来，它是\
    \ 960px，这反映了当时大多数屏幕宽度最多为 1024px。随着屏幕尺寸和分辨率的增长，这个最大宽度变得更大，但仍然存在不同的意见。（第二章介绍的）媒体查询使这个最大宽度不如以前那么重要。目前，请坚持使用这个\
    \ **1180px** 值。\n\n接下来，为 `header`、`navigation`、`listings` 和 `footer` 元素添加一个 `row`\
    \ 类。你现在也可以从这些元素中移除 `left` 类，因为你将合并它的 CSS 属性：\n\n```\n<header class=\"row\">\n\
    \    ...\n</header>\n\n<nav class=\"row\">\n    ...\n</nav>\n\n<main class=\"\
    row\">\n    ...\n</main>\n\n<footer class=\"row\">\n    ...\n</footer>\n```\n\n\
    并定义 `row` CSS 类：\n\n52 快速入门响应式网页设计\n\n```\n.row {\n    clear: both;\n    float:\
    \ left;\n}\n```\n\n这个行会填满容器的宽度并浮动到左侧，这意味着随着浏览器窗口大小的调整，它会随之流动，固定在左侧。由于你还没有在行中定义列，在较大的屏幕尺寸上，侧边菜单被推到了底部。\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_64_0.png)\n\n3-6. 新的页面结构\n\n现在页面上所有水平元素都在四个行中，是时候在行内定义列了。有些行是单个全宽列，而其他行则被细分。\n\
    \n为了重新开始，移除之前设置的简单的百分比宽度（从所有媒体查询中），这样你就有了以下内容：\n\n```\n@media only screen and\
    \ (min-width: 320px) {\n    aside {\n        display: none;\n    }\n\n    section.showsliding\
    \ {\n    }\n\n    .showdescription {\n        display: none;\n    }\n}\n\n...\n\
    \n@media only screen and (min-width: 992px) {\n    aside {\n        display: block;\n\
    \    }\n\n    section.showsliding {\n    }\n\n    .showdescription {\n       \
    \ white-space: normal;\n        width: 125px;\n    }\n}\n```\n\n页面在大屏幕尺寸下不再流动得那么好了，但你很快就会修复它。\n\
    \n# 什么是网格？\n\n在你将页面重构为流式网格之前，让我们先简要讨论一下什么是网格。\n\n**网格**是一系列列和行。但你的网站需要多少行和列呢？行数更清晰：你需要多少行来容纳你的页眉、导航、内容、页脚等。那么列数呢？嗯，就像本书（以及通常技术）中的其他主题一样，对此有不同的看法。它通常是偶数，因为这样更容易划分页面。能被\
    \ 3 整除的数字最常用。（如果你有兴趣了解原因，[关于黄金比例的维基百科文章](https://en.wikipedia.org/wiki/Golden_ratio)\
    \ 提供了一个很好的解释）。流行的列数值是 12、16 和 24，但我将在这里专注于 12 列网格系统。12 很流行，因为它可以被分割成多种常用的大小，例如一半、三分之一和四分之一。\n\
    \n# 创建你自己的网格\n\n你可能想知道 12 列布局如何帮助你创建像我们示例页面那样的 3 列布局——是的，一开始确实令人困惑。\n\n这些列更多地用作结构基础，通过\
    \ CSS，你可以定义你的元素希望跨越多少列。为了更清楚，这里是一个 12 列 1180px 网格的示例：\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_67_0.png)\n\
    \n3-7. 一个 12 列、1180px 的网格\n\n以下是如何用网格表示此页面（是的，网格内的网格，即“嵌套网格”，是允许的）：\n\n56 快速入门响应式网页设计\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_68_0.png)\n\n3–8. 作为网格的页面\n\n你可以为每个项目手动设置所有这些列和网格，但更好的方法是创建更可用和可重用的东西。我们现在将创建很多新的样式以及对\
    \ HTML 和 CSS 文件的更改。然后我会展示实现相同结果的更简单的方法。有时候，在知道如何使其变得更容易之前，先学习困难的方法是个好主意。\n\n为列和行设置基础样式，并替换任何现有的匹配类：\n"
