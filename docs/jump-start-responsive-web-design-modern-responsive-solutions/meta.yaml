    # Structuring a Page with HTML5


    Before we get started creating responsive designs and using CSS to implement them,
    it''s important to understand the underlying HTML structure that you''ll be manipulating.
    Recent developments with HTML have made changes to concepts and page structure,
    so it''s useful to recap the tools and options now available to a modern web designer.


    Before HTML5, logical sections of HTML pages were structured and organized using
    generic elements like divs and spans. These worked fine for many years, but were
    too broad and didn''t help designers or web browsers understand increasingly complex
    page structures.


    [Among other things](https://example.com), HTML5 introduced new, more semantic
    elements that describe their use more fully than a simple div. The aim of these
    new elements was to help with things like accessibility and multi-purposing content,
    but they also help with responsive web design. They include definitions such as
    the header, navigation or main content area of the page, as well as specific elements
    for video and audio. Responsive web design is fundamentally about manipulating
    page layouts to suit different use cases, and better organization and structure
    of pages helps you target the elements you need to with CSS and media queries
    (covered in [Chapter 2](https://example.com)).'
  merge: -1
