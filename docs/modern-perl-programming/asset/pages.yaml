  md: "# 14.6 Binding\n\nEach widget defined in the Tk module has a well-defined set\
    \ of events. You can also define your own event for a particular widget. Coupling\
    \ an event with a widget is called binding. For example, if a user wanted to take\
    \ some action whenever an event was selected in a list box or when a Return was\
    \ pressed in an Entry widget, then you must define the binding. In the example\
    \ below, whenever the left mouse button, Button-1, is pressed on a list item,\
    \ an event is generated. In the code below, the statement:\n\n```\n$list = $mw->Scrolled('Listbox')->pack;\n\
    $list->bind(\"Button-1\", \\select);\n```\n\nspecifies that when the left mouse\
    \ button is pressed, the select subroutine should be called.\n\n```\n#!/usr/bin/perl\n\
    #\n#nbind.pl\n#\nuse Tk;\n$mw = MainWindow->new;\n$list = $mw->Scrolled('Listbox')->pack;\n\
    $mw->Entry(width = 20, -textvariable => \\var)->pack;\n$list->bind(\"Button-1\"\
    , \\select);\\opendir(THISDIR, \".\");\n@files = readdir THISDIR;\n$list->insert('end',\
    \ @files);\nMainLoop;\n```\n\n```\n{\n  $x = $list ->curselection();\n  $var =\
    \ $list ->get($x)\n}\n```\n\nThe select subroutine will be called whenever the\
    \ left mouse button is pressed while the pointer is in the listbox widget.\n\n\
    To bind the Return key in an Entry widget, you must code as follows:\n\n```\n\
    $mw->Entry(-width = 20, -textvariable => \\var) -> pack;\n$entry -> bind(\"Return\"\
    , \\work);\n```\n\n```\nsub work\n{\n  # insert something here\n}\n```"
  merge: -1
