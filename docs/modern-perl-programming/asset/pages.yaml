  md: '# GENERATING REPORTS IN PERL


    Perl has the ability to generate reports. These reports are typically written
    by system administrators to summarize user and file activity. Perl can automatically
    generate headers and format a report body. This chapter gives the details of the
    rudimentary report writing capabilities of Perl.


    # 8.1 Introduction


    In addition to the Perl functionality that we have seen, Perl also has report
    writing capabilities. Output from Perl applications can be formatted for human
    readability using format statements and the write function. A format statement
    has the form shown below:


    ```

    format NAME =

    picture line

    argument line

    picture line

    argument line

    etc.

    ```


    NAME is a filehandle, which is STDOUT by default. A picture line consists of one
    or more formats from certain format specifiers and possibly some text. An argument
    line is one or more expressions separated by commas. There should be as many format
    specifiers as there are expressions. There can be as many (picture line, argument
    line) pairs as required. Any picture line containing text without a format is
    printed literally. The entire structure ends with a left-adjusted period alone
    on a line. Each pair is treated together. When a Perl program executes a write
    command, the data items in the argument line are written according to the format
    items in the associated picture line. If a picture line has no accompanying argument
    line, the picture line is written as pure text.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# 8.2 format


    Each format in a picture line starts with either the @ or ^ character. The length
    of the field is supplied by padding the field with zero or more characters from
    the following set:


    ```

    < left-adjust

    > right-adjust

    | center

    ##.### numerical data, possible non-integer

    @  normal value

    ^  multi-line text block fill

    ```


    The following is an illustration of writing a report in Perl, including:


    +   * The data file from which the report was built

    * The running of the report producing the report

    * The program that produced the report


    ```

    $ display data PL

    EVAL1 PL 92 02-07-01 4:53p evall.pl

    CALC PL 242 02-08-01 9:28a oops.pl

    HTML PL 394 02-08-01 8:45a html.pl

    OOPS PL 203 02-08-01 9:29a oops.pl

    TR PL 134 02-08-01 7:09a tr.pl

    QUOTES PL 234 02-07-01 8:03p quotes.pl

    HASHLORT PL 299 02-08-01 8:15a hashsort.pl

    PORTS PL 250 02-08-01 9:33a sorts.pl

    WORDS PL 68 02-08-01 8:08a words.pl

    HEREHTML PL 340 02-08-01 9:20a herehtml.pl

    DEBUG PL 316 02-07-01 9:08p debug.pl

    REMEMBER PL 115 02-08-01 3:34p remember.pl

    HERE-1 HTM 126 02-08-01 9:21a here.html

    PACK PL 339 02-08-01 1:37p pack.pl

    MAKEHTML PL 398 02-08-01 8:49a makehtml.pl

    FILE-1 HTM 126 02-08-01 8:52a file.html

    BIN PL 126 02-08-01 2:13p bin.pl

    ```


    The output from the program will list files with a suffix given on the command
    line whose size is greater than a specific size, which is also given on the command
    line. In other words, to list all files whose size is greater than 200 and whose
    name ends in "PL," we would execute the program as follows:'
