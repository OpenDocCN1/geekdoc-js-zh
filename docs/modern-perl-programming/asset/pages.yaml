  md: "If we attempt to read a record above in the conventional way, we quickly get\
    \ into.\nThat is, if you read in a line at a time and try to use split, you have\
    \ forgotten that these\nfields have no delimiters. They are of fixed length. The\
    \ proper way to deal with this kind of\nfile is to use the unpack function. The\
    \ details of this function will be shown later. The file\nshould be read in the\
    \ following way:\n\n```\nwhile($_ = <DATABASE>)\n  chop;\n  ($fname, $ln, $ct,\
    \ $st) = unpack(\"A10 A10 A15 A15\", $\\$);\n```\n\nunpack takes a series of formats\
    \ and the variable to be unpacked and returns a list of\nvalues. The Ax format\
    \ specifies that x characters are to be extracted and any trailing blanks\nare\
    \ to be thrown away.\n\nThe example program below is used to change all records\
    \ having a name given on the\ncommand line as the first argument to the replacement\
    \ name given as the second argument.\nOnce the data has been read into the program,\
    \ it's easy to see if the name for a particular\nrecord matches $ARGV[0]. If it\
    \ does, it is also easy to replace it with the replacement\nname given as $ARGV[1].\
    \ However, there are a few wrinkles to smooth out.\n\nIn particular, when you\
    \ find a record that must be changed, you have already read to the\nend of your\
    \ record. You need to \"back up\" an amount equal to the size of the record.\n\
    Then you can write the record \"over itself.\"\n\nBefore you write the record,\
    \ you must format it correctly. Use pack to accomplish this.\nHere is the code:\n\
    \n```\nif ($fname $ARGV[0]) {\n  $fname = $ARGV[1];\n  $newrec = pack(\"A10 A10\
    \ A15 A15\", $fname, $lname, $city, $state);\n  seek (DATABASE, -52, 1);\n  print\
    \ DATABASE \"$newrec\\n\";n}\n```\n\nIn the above code, the amount back up might\
    \ depend on the system you are using. I\nfirst ran the above code on Windows.\
    \ Files there map the newline character into two\ncharacters carriage return and\
    \ line feed. Therefore, the amount back up is 10 + 10 +\n15 + 15 + 2, or 52. When\
    \ I run this code on a Unix system, I used the value 51 as the\namount to back\
    \ up. You can always use the Special Perl \\$O to determine the oper-\nating system.\n\
    \nOne final item must be considered. There is a lot of operating system input\
    \ and output\nin the program that performs the update. To be sure that the buffering\
    \ of these reads and\nwrites is correct, we turn it off. This is done by opening\
    \ the input file, then selecting it,"
