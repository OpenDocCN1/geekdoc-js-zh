  md: "# Chapter 11 • Object-Oriented Programming\n\nThese problems may be overcome\
    \ by writing methods that deliver object data rather than allowing direct access\
    \ to the data. The disallowance of direct access to object data is called information\
    \ hiding. Most OO languages will generate a compiler error when direct access\
    \ to hidden data is attempted. Perl just you to \"play by the rules,\" as it has\
    \ no such feature.\n\n# 11.3.2 Accessor and mutator methods\n\nA good class is\
    \ expected to provide methods to retrieve data from an object. These methods are\
    \ called accessor methods. Likewise, a good class is expected to provide methods\
    \ to alter the state of an object. These methods are called mutator methods.\n\
    \nOther methods might simulate other behavior. For example, in the Student class,\
    \ there could be a method that determines how many courses a student is taking.\n\
    \nThe Student class should have methods that allow the setting and getting of\
    \ object data. Functionality like getattr and getattr should be supported.\n\n\
    ```\nuse Student;\n$s1 = new Student(Mike, Math, Trig, Calc);\n$s2 = new Student(Susan,\
    \ Dynamics, Statics, Art);\n$s1 -> setName(Michael);\n$name = $s1->getname();\n\
    ```\n\nWhen a method is called on a blessed reference, such as the last two lines\
    \ above, Perl knows to look in the appropriate .pm file to find the correct function.\
    \ In reality, Perl turns the last two above calls into:\n\n```\nStudent::setName($s1,\
    \ Michael);\nStudent::getname($s1);\n```\n\nso the reference is always passed\
    \ as the first argument to the method in question. Here is a revised Student.pm\
    \ file:\n\n```\n# Revised Student.pm\n#\npackage Student;\nsub new {\n    my($pkg,\
    \ $name, $major, @courses) = @_;\n    my $s = {\n        NAME => $name,\n    \
    \    MAJOR => $major,\n        COURS => [ @courses ]\n    };\n    bless $s, $pkg;\n\
    \    return $s;\n}\n```\n\ncontinued..."
