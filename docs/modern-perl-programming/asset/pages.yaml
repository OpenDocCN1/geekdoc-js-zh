  md: 'When the user selects the Evaluate Expression button, the browser constructs
    the data string that will be appended to the URL string in the ACTION attribute
    of the FORM tag. For example, in the form the user has entered the expression
    3 + 5 ** 2 and has checked binary.


    # 13.2.3 HTML form element names


    This is where the names of elements enter the picture. From the HTML form, you
    can see that the text field has the name expression, while the radio buttons have
    the name base. The browser constructs pairs of information. There is one pair
    for each input element. The pair consists of the name of the element taken from
    the HTML file and the value of the element entered by the user. For a text field,
    the value is whatever the user types; for a set of radio buttons, the value is
    whatever appears in the VALUE attribute of the checked item. In this example,
    we have:


    ```

    expression=3 + 5 ** 2

    base=binary

    ```


    # 13.2.4 URL encoding


    There is another issue. When the browser sends punctuation or blanks to the server,
    the browser encodes them using a simple scheme known as URL encoding. In this
    scheme, each blank becomes a plus (+) and most punctuation characters become %xx,
    where each x represents a hexadecimal digit. Thus, the actual data sent to the
    server is:


    ```

    expression=3+%2B+5**+2

    base=binary

    ```


    The browser takes each of the pairs above and joins them with a & between the
    pairs that the encoding becomes:


    ```

    expression=3+%2B+5**+2&base=binary

    ```


    Finally, the browser takes the value of the ACTION attribute of the FORM tag,
    joins a to it, and joins the pairs. The final URL constructed by the browser is:


    ```

    http://localhost/cgi-bin/eval.pl?

    expression=3+%2B+5**+2&base=binary

    ```


    Eventually, the server will send all information following the ? to the CGI program
    via the environment variable $ENV{QUERY_STRING}.'
