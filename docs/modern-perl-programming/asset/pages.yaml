  md: '# CHAPTER


    # 1

    A TUTORIAL

    INTRODUCTION TO PERL


    The goal in this chapter is to demonstrate many fundamental Perl features so that
    you may start writing Perl programs quickly. Subsequent chapters will drill more
    deeply into each of the topics presented here.


    # 1.1 Getting Started


    Programming languages come in all shapes and sizes. There are many ways of categorizing
    them. Some are considered high-level and some are considered low-level. The basic
    difference between these characterizations is the amount of code you need to express
    an idea. The less code you need to write, the higher the level of the language.
    Perl is a high-level programming language. Sometimes it is compiled and it is
    interpreted.


    Perl was written in the early 1980s by a modern-day Renaissance man Larry Wall.
    Perl combines the best features of the Unix shells, C language, and some of the
    famous Unix utilities such as awk, grep, and sed. Once you are familiar with Perl,
    you will probably choose Perl over any of the shells, if management gives you
    a choice.


    Perl is often referred to as a scripting language. Likewise, Perl programs are
    often called Perl scripts, but this distinction is largely irrelevant. Perl is
    currently used in a wide variety of domains, including system administration,
    client/server and CGI applications, and file processing, database retrievals,
    biomedical processing, and many other domains.


    Perl is extremely easy to learn even though there are some nominal learning curves
    to be conquered in advanced features of the language.


    You can download Perl free at the site www.activstate.com. This site has versions
    of Perl for most major platforms, including Windows variants, Unix variants, and
    Microsoft.net. For the Macintosh, you can visit www.macperl.com. For any and all
    information about Perl, visit www.perl.com.


    Similar to other pieces of software, Perl has undergone a transformation since
    the first version was released in January 1988. Perl 2.0 was released in June
    1988 and Perl 3.0 was released in October 1989. However, the most important releases
    are the Perl 4 release'
  merge: -1
  pgno: 22
- img_proc: true
  md: "# Chapter 1 • A Tutorial Introduction to Perl\n\nIn March 1991 and the Perl\
    \ 5 release in October 1994. A new version of Perl, Perl 5.6, was released in\
    \ early 2001.\n\nWe will assume that you have installed Perl on your machine and\
    \ that you are ready to write Perl programs.\n\n# 1.1.1 The first Perl program\n\
    \nHere's a simple Perl program:\n\n```\n#!/usr/bin/perl\n#\n first.pl\n#\nprint\
    \ \"Please enter your name \";\n$name = <STDIN>;\nchomp ($name);\nprint \"Your\
    \ name is $name\";\n```\n\nPerl programs are written using your favorite text\
    \ editor. Once you have typed your code into a file, there is no need to compile\
    \ it—you simply execute it.\n\nThe # is a special character in Perl. Anything\
    \ that follows is treated as a comment. A comment is terminated by the end of\
    \ a line. Thus, the first four lines above are comments (Actually, the top line\
    \ is treated in a special way on Unix systems—we will see this later.).\n\nNote\
    \ that all Perl statements end in a semicolon. The print statement places data\
    \ on the standard output file, the display. In this case, a prompt is displayed\
    \ requesting the user name. Let's assume for now that the data is printed to be\
    \ wrapped in double quotes.\n\nThe next line reads a line typed by the user on\
    \ the keyboard. The data will be stored inside the Perl variable $name. This data\
    \ includes the newline character. In Perl, variables have no punctuation associated\
    \ with them. The $ signifies that this variable can hold one value. One value\
    \ could be a number, a string, or something else. In any case, it will be treated\
    \ as a single value. In this case, the string typed by the user is held. Variables\
    \ that begin with $ are referred to as scalar variables. We will have more to\
    \ say about these variables later.\n\n<STDIN> is the Perl operator for reading\
    \ a line from the standard input file, the keyboard. A line is defined as all\
    \ of the characters up to including the newline character. Thus, the following\
    \ character is generated when you press the Return (or Enter) key. This reads\
    \ a line from the user from the keyboard:\n\n```\n$name = <STDIN>;\n```"
  merge: -1
