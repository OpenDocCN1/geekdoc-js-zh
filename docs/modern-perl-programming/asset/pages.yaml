  md: '# 4.1.5 Array slices


    Any portion of an array may be selected rather than selecting just a single element.
    This is called an array slice.


    ```

    #numbers = (1..9); # the numbers 1 through 9

    ($low, $high) = $numbers[0,8];$low = 1, $high = 9

    ```


    Be aware of the difference between the following two expressions: one has a $,
    which means it refers to one item; the other has a @, which means it is an array.
    In the latter case, you may recall from the comma operator that the subscript
    [0, 8] is evaluated in a scalar context, yielding the last element in the comma-separated
    list.


    ```

    #numbers [0,8]; # $numbers [0], $numbers [8]

    $numbers [0,8]; # $numbers [8]

    ```


    Array slices are useful in extracting elements from functions that return arrays.
    Here''s a code snippet that extracts the lowest and highest alphabetic strings
    from a list:


    ```

    #!/usr/bin/perl

    #

    # slices.pl

    #

    @a = (Bo, Al, Jo, Mike, Zeke, Sue );

    ($low, $high) = (sort(@a))[0,-1];

    print "\$low, \$high";

    ```


