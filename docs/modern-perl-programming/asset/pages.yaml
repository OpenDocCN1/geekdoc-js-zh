  md: '# CHAPTER 13

    CGI PROGRAMMING WITH PERL


    When the Internet became commercialized, a lot of new ideas began to mushroom.
    With the advent of the World Wide Web and browser software, a new style of programming
    was born. Web pages now abound with HTML fill-in forms that are processed by back-end
    programs, most of which are Perl scripts. This style of programming, usually called
    Common Gateway Interface (CGI) scripting, is the subject of this chapter.


    # 13.1 Introduction


    The CGI is a standard by which applications external to Web servers can communicate
    with form documents rendered by browsers. CGI makes static Web pages come alive
    with dynamic content.


    # 13.1.1 CGI languages


    CGI programs are commonly referred to as scripts. However, not all CGI programs
    are written in a scripting language. For the most part, you whichever language
    you wish to implement a CGI. If you choose a compiled language, then your CGI
    program will exist as an executable file on your server. Some common programming
    languages used to implement the CGI standard include C, C++, Visual Basic, the
    Unix shells, and Perl. Among these, Perl is typically the language of choice because
    of its power in handling regular expressions and hashes. It should also be noted
    that a Java servlet provides functionality that is similar to a CGI script.


    To develop Web applications using CGI, you must have at least a modest familiarity
    with HTML and knowledge of a programming language such as Perl. There are other
    bodies of knowledge that are integrated into the mix as well, including the Hypertext
    Transfer Protocol (HTTP), the client/server relationship, and the use of your
    browser.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 13.1.2 HTML forms


    CGI is typically used in conjunction with an HTML form to build database applications.
    The CGI standard specifies how your Web server interfaces with programs to extend
    the functionality of the Web server. Information on the CGI specification may
    be found at the World Wide Web Consortium site: www.w3.org/hypertext/WWW/CGI


    CGI allows Web servers to execute programs and incorporate their output into text,
    graphics, etc., which are sent to Web browsers. Without CGI, the Web consists
    only of static documents and links to other pages or servers.


    HTML forms on the Web are typically used for writing interactive quizzes, guestbook
    registrations, games, and a host of e-commerce applications. Shown in Figure 13.1
    is a typical form for a mortgage.


    ![](img/74431d7901809922ce9b915cecff17c7_253_0.png)


    Figure 13.1 A mortgage application.'
