  md: '# 8.4 The select Function


    In Perl, there is the notion of the "currently selected filehandle." By default,
    it is STDOUT. The output from all prints, printfs, and writes will be sent to
    the display. The default for the currently selected filehandle can be changed
    using the select function. select takes a filehandle or scalar containing the
    filename and makes the argument the newly selected filehandle. select returns
    the old filehandle so it may be restored later if this is desired. Here is a small
    illustration:


    ```

    #!/usr/bin/perl

    # select.pl

    #nopen(NEWFILE, " output");

    print "This goes to STDOUT by default\n"

    $oldhandle = select(NEWFILE)

    print "This goes to NEWFILE so you won''t see it\n"

    select($oldhandle)

    print "STDOUT has been restored now\n";

    ```


    You''ll sometimes see a different file selected in a subroutine and the original
    file being reselected before the subroutine returns.


    # 8.4.1 Special formatting variables: ~ and $


    ~ is the name of the report format for the currently selected output filehandle.
    You can use this variable to change the format of the currently selected filehandle.
    By default, it is value is STDOUT.


    Likewise, ^ is the name of the top-of-page format for the currently selected output
    filehandle. You can use this variable similarly to ~$. Its default is STDOUT_TOP.


    ```

    #!/usr/bin/perl

    # formats.pl

    #

    format ONE =

    This is format # 1


    format TWO =

    This is format # 2


    format ONE_TOP =

    This is format # 1 top of page


    format TWO_TOP =

    ```


    continued...'
