  md: '# 13.2 HTML and Forms


    # 13.1.3 Web servers


    A Web server is a piece of software whose task is to locate resources on the Web,
    instructed by a user''s request through a browser, and to respond with the requested
    resource. The resource is usually a file. There are many Web servers in use today.
    Probably the two most popular servers are the Apache Web Server for Unix machines
    and the Internet Information Server (IIS) for Windows machines.


    The most commonly used browsers are the Internet Explorer of Microsoft and various
    Navigator versions from Netscape. A browser is usually referred to as a client
    because it uses services provided by a Web server. When a browser talks to a server,
    it does so sending the server a Uniform Resource Locator (URL). A URL is composed
    of several distinct parts with punctuation in the header. The URL contains a protocol,
    a domain name, and perhaps some other information.


    +   - Protocol HTTP, telnet, FTP

    - Domain name www.traininggetec.com

    - Rest of URL other information


    # 13.1.5 Starting a CGI program


    A typical CGI application involves the following: A human fills out a form displayed
    by the browser. The browser collects this data, determines the first part of the
    URL from the HTML, contacts the server, and supplies the remainder of the URL
    to the server. The server translates the remaining part of the URL into a path
    and filename. If this part of the URL points to a program instead of a static
    file, the server prepares the environment for the CGI program and launches it.


    The CGI program executes and then reads the environment variables set by the server,
    STDIN, or both. The CGI program sends the MIME (Multi-purpose Mail Extension)
    headers to STDOUT. The CGI program sends the remaining output to STDOUT and terminates.
    The server sees when the CGI script terminates and breaks the connection with
    the browser. The browser displays the CGI output.


    # HTML and Forms


    The hypertext language (HTML) is a language that is used to construct files to
    be displayed by a browser. HTML documents, that is, disk files, contain two types
    of information: keywords in the HTML language, called tags, and text to be displayed
    by a browser as a function of the tags. The tags themselves are enclosed in angled
    brackets (< >). A browser will display files differently depending on the type
    of file it is. Possible types include text files, directories, HTML files, image
    files, sounds etc.


    HTML documents contain two parts: a head and a body part. Each part is delimited
    by tags. Ending tags are the same as beginning tags except that an ending tag
    also has the'
