    +   - Is the input a set of alphabetic characters?

    - Is the input some form of yes, that is, yes, y, or Y?

    - Is the input an email address?

    - Is the input a domain name?


    However, there are also many occasions when you will want to substitute one string
    for a matched string. In this case, you will need to use the substitute operator,
    s. The syntax is similar to the match operator. Here are a few examples:


    ```

    $var ~ s/Mike/Michael/;

    ```


    In $var, substitute Michael for Mike.


    ```

    s/Mike/Michael/

    $_ = s/Mike/Michael/

    ```


    In $_, substitute Michael for Mike.


    ```

    s#////XX##

    s$!////XX!

    ```


    In $_, substitute XX for ///.


    Substitutions may also have modifiers, which are single characters slightly modify
    the substitution behavior.


    # 6.7.1 The g modifier


    In the above cases, the substitution only occurs on the first occurrence of the
    match. For example:


    ```

    $_ = "this will illustrate the g "

    $/11/(11)/

    print "$_\n";

    ```


    will produce:


    this wi(11) illustrate the g'
