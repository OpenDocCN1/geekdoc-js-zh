  md: "# 1.4.2 next\n\nThe Perl next statement causes control of the program to jump\
    \ to the next iteration of the loop. One way to think of this is that when next\
    \ is executed, loop control drops to the final curly brace of the loop and normal\
    \ control is resumed. For example, to add all the positive even elements of an\
    \ array, we might code it as follows:\n\n```\nfor ( $i = 0; $i < @n; $i = $i +\
    \ 1 )\nn    if ( $n[$i] < 0 )\n    {\n        next;\n    }\n    if ( $n[$i] %\
    \ 2 == 1 ) # Note: % is the mod operator\n    {\n        next;\n    }\n    $sum\
    \ = $sum + $n[$i];\n```\n\nNote here that we have also used the modulus (or remainder)\
    \ operator, the % symbol. This operator takes two integers and produces the remainder\
    \ of the first operand by the second operand. Thus, 10 % 2 is zero and 11 % 2\
    \ is one. This is one way of determining whether a number is odd or even.\n\n\
    # 1.4.3 redo\n\nThe redo statement is not used often, but it is quite useful when\
    \ the need arises. redo redoes the current loop without modifying the control\
    \ variable.\n\n# 1.4.4 Labeled blocks\n\nOccasionally, you will need to break\
    \ out of a loop that is nested inside one or more other loops. For this, Perl\
    \ provides a labeled block. When last is used with a label, control flows to the\
    \ first statement beyond the labeled block.\n\n```\nOUT: for ( $i = 0; $i < 5;\
    \ $i = $i + 1 )\n{\n    for ( $j = 0; $j < 5; $j = $j )\n    {\n        if ($j\
    \ == $i)\n        {\n            last OUT;\n        }\n    }\n    print \"first\
    \ statement after loops\\n\";\n```"
