  md: 'And finally, the last line:


    ==============================


    is written out as pure text since there are no fornats on the next line.


    #  8.2.2 Multi-line formatting


    There will be times when you want to have several data items in a column, another
    longer data item in a block paragraph, and show the two side-by-side.


    ```

    item1               this is all

    item2               part of the

    item3               same item4

    ```


    You can achieve the above formatting using ^ rather than @ as the format specifier.

    For the blocked text, the line break is on a space, a newline, or a hyphen. The
    value of

    variable is truncated as it is printed. Be sure to allow enough picture and argument
    lines

    the blocked item.


    ```

    #!/usr/perl/bin

    # blocked.pl

    #

    format STDOUT =

    NAME: @>>>>>>>>>> <<<<<<<<<<<<<<<<<

    $name $sum1

    AGE: @>>>>>>>>>> <<<<<<<<<<<<<<<<<

    $age $sum1

    CITY: @>>>>>>>>>> <<<<<<<<<<<<<<<<<

    $city $sum1

    <<<<<<<<<<<<<<<

    $sum1

    ```


    ```

    $name = "Smith"

    $age = 25;

    $scity = "Raleigh"

    $sum1 = "Smith is an excellent worker, but he"

    $sum1 = "is sometimes prone to inactivity."

    write;

    $name = "Jones"

    $age = 31;

    $scity = "Baltimore"

    $sum1 = "Jones is not right for this job, but he"

    $sum1 = "would be right for many others."

    write;

    ```'
