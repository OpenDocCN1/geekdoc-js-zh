  md: '# Regular Expression Metacharacters


    # 6.3 Regular Expression Metacharacters


    In the regular expressions we have seen thus far, each character has represented
    itself. For example, in the expression below, the "t,""h,""r,""o," and "w" represent
    themselves:


    ```

    print "is a match\n" if (/throw/);

    ```


    More often, a regular expression is composed of a set of metacharacters, that
    is, characters that have special meanings. Regular expression metacharacters are
    divided into two categories: one category is concerned with single-character matches;
    a second category is concerned with multiple-character matches.


    # 6.3.1 Single-character matches


    Here are a few examples of single-character matches. The period character (.)
    matches any single character. Therefore, the pattern:


    ```

    /h.t/

    ```


    matches:


    ```

    hit

    hat

    hot

    shot

    hotel

    ```


    but does not match:


    ```

    hunt

    htdocs

    ```


    while the pattern:


    ```

    /h..t/

    ```


    matches:


    ```

    hoot

    shout

    haute

    ```'
