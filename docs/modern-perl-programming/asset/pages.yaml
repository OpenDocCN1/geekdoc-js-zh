    # The stat Function


    Many programs are interested in the data of a file. However, a separate class
    of programs is interested in about files. Sometimes the information is about the
    type of a file, while other times it relates to the size of a file or the modification
    date of a file. Perl uses the stat function to retrieve information about a file.
    Some of this information may only be useful on a Unix operating system. The stat
    function takes a filename or handle and returns an array of 13 elements. Table
    2.1 summarizes this information:


    Table 2.1 Return Values from the stat Function


    | Index | Meaning |

    |---||

    | 0 | device of the file |

    | 1 | inode number |

    | 2 | mode of the file |

    | 3 | number of links |

    | 4 | user ID of the owner |

    | 5 | group ID of the owner |

    | 6 | raw device |

    | 7 | size of the file |

    | 8 | file access time |

    | 9 | file modification time |

    | 10 | file creation time |

    | 11 | block size for the filesystem |

    | 12 | number of data blocks |'
