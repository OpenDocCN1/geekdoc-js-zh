  md: "# Relationship between Server and CGI Script\n\nThe HTML shown in the eval.pl\
    \ script is a little complex if you do not understand tables.\n\nThe HTML code\
    \ prepares an HTML table. These tables contain header tags, <TH>, row tags, <TR>,\
    \ and table tags, <TD>. After returning the content type and date, the script\
    \ determines the method by which it was invoked and reads the form data accordingly:\n\
    \n```\nif ($ENV{REQUEST_METHOD} eq \"GET\") {\n    $data = $ENV{QUERY_STRING};\n\
    } else {\n    read(STDIN, $data, $ENV{CONTENT_LENGTH});\n}\n```\n\nThe next step\
    \ is to take the query string and split it into (name, value) pairs:\n\n```\n\
    $pairs = split('&', $data);\n```\n\nThe script splits each pair into its corresponding\
    \ name and value. Each $value must now be decoded:\n\n```\n$value =~ /\\/\\+/g;\n\
    $value =~ s/\\%([0-9a-fA-Z][0-9a-fA-Z])/pack(\"c\", hex($1))/ge;\n```\n\nBlanks\
    \ are restored from their encoded plus signs. With vintage Perl, the %xx encodings\
    \ are decoded into their original character. And finally, an associative array\
    \ named $input is built from each of the (name, value) pairs:\n\n```\n$input{$name}\
    \ = $value;           # add element to $input\n```\n\nA set of parentheses in\
    \ a regular expression captures the parenthesized portion of a match. In this\
    \ case, we are looking for %xx, but only remembering the xx portion of the match.\
    \ If we find a match, it is replaced with a single character produced by the pack\
    \ function. hex is a function that takes hexadecimal digits, $1 in this case,\
    \ and returns their decimal value.\n\nNext, the script takes each name and value\
    \ and builds an associative array. The expression typed by the user may be easily\
    \ recalled by fetching the value:\n\n```\n$input{expression}\n```\n\nRecall that\
    \ the expression typed by the user was entered into an HTML text item whose name\
    \ was expression."
  merge: -1
  pgno: 262
- img_proc: true
  md: "# 242\n\n# Chapter 13 · CGI Programming with Perl\n\nThe eval function does\
    \ the work of evaluating any Perl expression, and thus we use it to evaluate the\
    \ expression input by the user.\n\nTo fetch the user's response to the radio buttons,\
    \ we fetch the value of:\n\n```\ninput(base)\n```\n\nThe formatting is easy using\
    \ sprintf, except there is no binary format, so we we have to resort to the pack\
    \ function and then get rid of the beginning zeroes:\n\n```\nelsif ($input[base]\
    \ eq \"binary\")\\{\n  $val = unpack(\"B32\", pack(\"N\", $result));\n  $val =\
    \ -s/0*;//\n}\n```\n\n# 13.3.2 Here strings\n\nYou can see that the above script\
    \ sends a lot of information to the server. This is accomplished through many\
    \ uses of the print function. There's too much room for error, so a better approach\
    \ is to use a here string. The syntax for this construction is borrowed from the\
    \ Unix shell's here document syntax. The following series of strings:\n\n```\n\
    print \"<TABLEORDER=2 ALIGN=CENTER><TH></TH>VALUE</TH>\"\nprint \"<TH>EXPRESSION</TH><TD\
    \ ALIGN=CENTER>$input{expression}</TD></TD>\"\nprint \"<H1><TR><TD ALIGN=CENTER>$val</TD></TR>\"\
    \nprint \"</TABLE>\"\n```\n\ncan be more easily encoded as:\n\n```\nprint <<EOF;\n\
    <TABLE ORDER=2 ALIGN=CENTER>\n<TH>EXPRESSION</TH><TH>VALUE</TH>\n<H1><TR><TD ALIGN=CENTER>$input{expression}</TD>\n\
    <H1><TD ALIGN=CENTER>$val</TD></TR>\nEOF\n```\n\nIn this series of prints, the\
    \ programmer has to worry too much about double quotes and semicolons. It's easier\
    \ to use the here string. This construction whatever is to be printed with a delimiter\
    \ of your own choosing. We have chosen the string \"EOF\". Don't forget the semicolon\
    \ at the end of the delimiter! The last use of the delimiter must be on a line\
    \ by itself, flush left. Notice also how variables in the middle of here strings\
    \ are replaced with their values."
  merge: -1
  pgno: 263
