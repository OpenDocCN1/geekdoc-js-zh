  md: "# 1.6 Regular Expressions\n\nPattern matching may be used to verify input.\
    \ Although there are many issues with regard to regular expressions and pattern\
    \ matching, our intent is to show a few examples and postone the details until\
    \ later.\n\nIn the simplest case, a regular expression is enclosed in forward\
    \ slashes and is matched at $_ Thus, the following program prints all lines that\
    \ match the pattern mike, that is, the lines contain the consecutive characters\
    \ \"m\",\"i,\"k,\" and \"e\":\n\n```\nwhile(<STDIN>)\n{\n  print if (/mike/);\n\
    }\n```\n\nOf course this is different than the question \"Does $line equal the\
    \ string mike?\" This latter question is coded as:\n\n```\nif ($line eq \"mike\"\
    )\n{\n  print $line;\n}\n```\n\nThere are many regular expression metacharacters,\
    \ that is, characters that do not represent themselves, but have special meanings.\
    \ For example, the period means \"any character\": therefore, the following program\
    \ prints any line if it matches any three-letter pattern beginning with \"r\"\
    \ and ending with \"t\":\n\n```\nwhile(<STDIN>)\n{\n  print if (/r.t/);\n}\n```\n\
    \nThis includes lines containing \"rat\",\"rot,\"rut,\" and also \"strut\" and\
    \ \"rotation.\" It would not match \"rt3 or \"rt.\" In other words, the period\
    \ must match a single character regardless of what it is. You can use ^ and $\
    \ to anchor the pattern to the beginning or end of a string, respectively. You\
    \ may also match against string, not just $_ , but in doing so, you need to use\
    \ the operator ~=. The following example illustrates points:\n\n```\nwhile($line\
    \ = <STDIN>)\n{\n  print \"\\$line\" if ($line =~ /^r.t/);\n}\n```"
  merge: -1
