  md: "# 138\n\n# Chapter 7 • Subprograms\n\nTo use any of functionality in the library\
    \ file that we constructed, we can load this file into an application that requires\
    \ any of these functions. The loading is accomplished by the require function.\
    \ require is written in a way that uses the return value from the file it loads.\
    \ Of course, the return value is the last expression evaluated in the file that\
    \ is loaded. All Perl libraries must have their last evaluation to true, or non-zero.\
    \ By convention, Perl programmers use the value 1, as we saw above in mystats.pl.\
    \ Here is a program that uses this library:\n\n```\n#!/usr/bin/perl\n#\n usemystats.pl\n\
    #\nrequire \"mystats.pl\";nprint \"Enter some numbers \";nchomp($_) = <STDIN>;\n\
    @dat = split;\n($mean, $sd) = statistics(@dat);\nprint \"MEAN = $mean, $sd\\n\"\
    ;nprint \"LARGEST of (@dat[0,1]): \\ bigger (@dat[0,1]);\n```\n\n```\n% useymlib.pl\n\
    Enter some numbers 10 11 12 13 14 15\nMEAN = 12.5, SD = 1.87082869338697\nLARGEST\
    \ of 10,11: 1\n```\n\n7.4.1.1 The @INC array. There's another issue that needs\
    \ to be addressed. The library file above needs to be placed in a directory in\
    \ the filesystem where Perl can find it. It is where Perl uses the builtin array\
    \ @INC.\n\nThe @INC array contains a colon-separated set of directories where\
    \ Perl looks to find required files. You can place a library file in any directory\
    \ as long as you add this directory to the @INC array. When you install Perl,\
    \ the @INC variable will already have some directories in it. One of them is called\
    \ site.\n\nOne way of adding a directory to the @INC array is to push or unshift\
    \ it there. Of course, you would have to do this in every program that needed\
    \ to use the library.\n\n```\npush(@INC, \"c:perl/site\");\n```\n\nAnother way\
    \ to do this is to use the -I flag on the command line:\n\n```\n% perl -I/perl/site\
    \ usemystats.pl\n```\n\nPerhaps the best way is to use the PERL5 environment variable.\
    \ This variable should contain the set of directories where your libraries exist.\
    \ If this variable exists, Perl will check it to determine where to look for libraries.\
    \ How you set the environment variable depends on your operating system. If you\
    \ are using Unix, it depends on which shell you are"
