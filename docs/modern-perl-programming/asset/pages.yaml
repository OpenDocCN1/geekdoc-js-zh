    # 16.4.4 Documenting Perl code


    Somewhere in the software development cycle, there needs to be time for documentation.
    and it is usually never on time or as well Programmers typically depict this work,
    and it might ought to be.


    In any event, documentation is traditionally kept separate from the actual code
    being documented. However, the current thinking in software development is to
    have the source code and documentation bundled into the same file. All Perl modules
    are packaged this way. When you write any OO modules, you ought to fulfill this
    conversion. The documentation style in Perl has been given the name “plain documentation,”
    or POD. You can look in any Perl module bundled with the standard distribution
    to see these so-called POD files.


    The motivation behind the documentation “language” was to facilitate the translation
    of the documentation into other formats such as HTML or Unix man pages. Several
    translation tools such as pod2html, pod2man, and pod2text are delivered with the
    standard Perl distribution.


    Like HTML files, POD uses tags interspersed with text. Each tag defines a paragraph.
    Paragraphs must be separated from one another by at least one blank line. A POD
    tag is an equal sign, =, followed by one of several currently understood keywords,
    all of which are listed below:


    ```

    head1, head2, item, over, back, cut, pod

    ```


    The first two tags, head1 and head2, specify how far the text is to be moved over
    one of the translation tools reads this file.


    +   *item * Identifies a list that will follow. Each item will have a *.

    *over Specifies that each item will be displayed four spaces to the right.

    *back Ends the list.

    *cut Allows you to inters documentation with code. Anything between =head and
    =cut will be treated as documentation.'
