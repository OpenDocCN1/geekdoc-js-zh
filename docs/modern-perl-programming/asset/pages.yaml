    # 2.2 Creating Your Own Filehandles


    When a program needs to perform some disk input or output, it needs to make an
    association between a file in the filesystem and a name in the process. As we
    have seen, there are some pre-existing filehandles: STDIN, STDOUT, and STDERR.
    In Perl, this mapping is accomplished through the open function.


    # 2.2.1 open


    This function takes two arguments: a filehandle that the programmer creates and
    the name of a disk file with some punctuation indicating the access mode. Access
    modes allow a file to be opened for reading, writing, both reading and writing,
    or appending. The open function may also be used to associate a filehandle with
    a process if your operating system allows this. You may also associate a filehandle
    with a process on a different machine. Here are several examples of opening a
    file for:


    ```

    $filename=sortedfile;

    open(OUTPUT, ">outputfile");

    open(DATAFILE, ">\$filename");

    ```


    and a few for input:


    ```

    $filename=sortedfile;

    open(OUTPUT, "\<outputfile");

    open(DATAFILE, "\$filename");

    ```


    In the last case above, notice that if there is no punctuation, the file is opened
    implicitly for reading. Once you have the handles, you can perform operations
    on the files. A program that gets the filenames from the user and copies one file
    to the other:


    ```

    #!/usr/bin/perl

    #

