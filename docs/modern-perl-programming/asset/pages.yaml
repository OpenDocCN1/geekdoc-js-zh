  md: '# # CHAPTER

    2

    INPUT AND OUTPUT IN PERL


    In this chapter, we will look more deeply into reading and writing files. Next,
    we will look at some of Perl''s operators for determining the type of a file.
    Finally, we will look at how you can determine information about files.


    # ## 2.1 Filehandles


    To perform any input or output in Perl, you need to associate the name of a disk
    file with a name in your program. The name in your program is called a filehandle
    and the mapping is accomplished through the open function.


    # ### 2.1.1 Builtin filehandles


    Some filehandles in Perl are built into the language. The more commonly used builtin
    file-handles are:


    ```

    STDIN   connected to the user''s keyboard

    STDOUT connected to the user''s display

    STDERR  connected to the user''s display

    ```


    When STDIN is used with the print function, the data to be printed ends up on
    the user''s console. If no filehandle is specified, STDOUT is assumed. Thus, the
    following two print statements are identical:


    ```

    print "hello there\n";nprint STDOUT "hello there\n";

    ```'
