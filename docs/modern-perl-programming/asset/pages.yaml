  md: "# SUBPROGRAMS\n\nAll high-level languages offer developers the ability to create\
    \ their own subroutines, blocks of code that allow generality and reuse. This\
    \ chapter examines all of the principles having to do with subroutines in Perl.\n\
    \nSome languages refer to these blocks as functions, others refer to them as subroutines;\
    \ still others refer to them as procedures. In Perl, they are referred to as either\
    \ subroutines or functions. There is no difference between these two terms in\
    \ Perl.\n\n# 7.1 Introduction\n\nAll high-level languages offer ways in which\
    \ a large program may be partitioned into pieces. This divide-and-conquer strategy\
    \ leads to easier debugging, maintenance, and readability. Different programming\
    \ languages use different names for these partitions of reusable code. Some of\
    \ these names are methods, subprograms, procedures, functions, and subroutines.\
    \ Perl tends to use the latter two names more than the other names.\n\n# 7.1.1\
    \ Organization of subroutines\n\nThe division of labor in Perl is accomplished\
    \ through the use of programmer-written subroutines, operating system calls, builtin\
    \ subroutines, and library functions. To the Perl programmer, they all look the\
    \ same. This section of the book concentrates on programmer-written subroutines.\n\
    \nA programmer-written subroutine may be defined anywhere within a Perl script.\
    \ If a subroutine is defined ahead of its use, then the subroutine may be invoked\
    \ in the following ways:\n\n```\nsub mysub {\n    print \"reached the subroutine\\\
    n\";\n}\n```"
