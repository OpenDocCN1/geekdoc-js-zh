  md: 'matches at least 5 digits surrounded by the “a” character.


    Several multiple-character patterns occur more commonly than others. Therefore,
    Perl has special expression characters for these situations. ? is equivalent to
    zero or one of what is at its left. * is equivalent to zero or more characters
    of whatever appears at the left it. + is equivalent to one or more of what is
    at its left. Keep in mind that these special symbols represent themselves when
    they are inside square brackets. The following example matches a set of optionally
    signed digits, that is, zero or more digits preceded by either a + or a -. Note
    that the two +''s below have different meanings.


    ```

    /[-+]?[0-9]+/

    ```


    # 6.3.4 Other special symbols


    To determine if a string contains one of a set of alternatives, use the | symbol:


    ```

    print if /mike|michael|mickey/;

    print if /10|15|19/;      # 10, 15, or 19

    print if /(0|5|9)/;               # 10, 15, or 19

    ```


    In the last example above, note that the parentheses were used to group a set
    of alternatives.

    Some other special symbols that may be used as shortcuts in your regular expression
    code:


    +   - \w Matches a word character (a-z_A-Z).

    - \W Matches a non-word character.

    - \s Matches a whitespace character (blank, tab, or newline).

    - \S Matches a non-whitespace character.

    - \d Matches a digit character.

    - \D Matches a non-digit character.


    # 6.4 Anchoring Patterns


    Earlier we say that the expression below matches a set of optionally signed digits:


    ```

    /[-+]?[0-9]+/

    ```


    Keep in mind that each of the following strings matches this pattern:


    ```

    -256hello

    hello256

    lyes

    t2ndone

    ```'
