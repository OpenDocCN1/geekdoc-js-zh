  md: '# CHAPTER

    5


    # HASHES


    Most programs simply cannot do without arrays. On the other hand, associative
    arrays, also called hashes, are never necessary, but are so efficient and so powerful
    that they should be mastered and applied wherever necessary. Hashes deal with
    paired data, and as it happens, there are a plethora of situations in software
    where this data structure is by far the best solution. The approach in this section
    is to demonstrate how any problem that can be solved with hashes may also be handled
    with simple arrays, albeit less efficiently. Next, we will show how hashes make
    your programming life easier and more efficient. Finally, we will show a variety
    of common problems where hashes provide the best solution.


    # 5.1 Introduction


    Most beginning Perl programmers are never taught the real power of hashes. As
    you will see shortly, hashes may be used to solve many different problems.


    An associative array, or hash, is a collection of pairs, each of which has a key
    and a value. When the key is used as a script, the value is retrieved. Other languages
    refer to this array as a map because in mathematics, a mapping function takes
    one value and translates it to another. Computer scientists refer to associative
    arrays as hashes, so we will adopt that term for the remainder of the book.


    A hash is simple to understand and is supported in many languages other than Perl.
    C++ supports hashes through the Standard Template Library (STL), and Java supports
    hashes through the Collections classes.


    In the final analysis, a hash is a simple yet clever technique for doing table
    lookups. you''ve studied searching techniques, you should recall that there are
    three fundamental approaches: linear search, binary search, and hash search. To
    completely understand hashing, it helps to create your own hashes.'
