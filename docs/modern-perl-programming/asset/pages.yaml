- img_proc: true
  md: 'You may place your command-line command within a set of back quotes. Perl will
    execute the standard output from the command. In the following example, the date
    command is executed:


    ```

    $date = `date`;

    ```


    Remember that the text inside the back quotes must be a meaningful command-line
    command on your operating system. The following two commands work fine on Unix
    systems:


    ```

    $date = `date`;

    $current_directory = `pwd`;

    ```


    However, Windows does not have a pwd command. Also be aware that on Windows, the
    date command behaves differently than it does on Unix. The portable way to handle
    each of these is as follows:


    ```

    require "ctime.pl";

    $date = ctime(time);

    ```


    ```

    use Cwd;

    $current_directory = cwd();

    ```


    In the examples thus far, all of the output from the command is being captured
    in a scalar. It may be more convenient to capture the output in an array:


    ```

    @files = `dir`;

    ```


    In this case, each line of output generated by the back quoted command becomes
    an element in the @files array.

    nThe content inside the back quotes may be arbitrarily complex and may involve
    Perl variables. The only restriction is that it must resolve to a command-line
    command.


    ```

    $pattern = EOI;

    @filenames = (text1, text2, text3);

    @files = `grep -l $pattern @filenames`;

    ```


    In the following sequence we use the Unix grep to give us the names of the files
    that contain the string "EOF.\nBe careful not to code the former when you mean
    the latter of the two constructions below. They give you very different results.
    The first gives you the exit status of the system command, while the latter gives
    you the output from the date command.'
