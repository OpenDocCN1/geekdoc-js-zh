  md: 'When the program begins, all references are assumed to be for the default package,

    which is main. To make references to another package, you must qualify the reference
    with

    the : : operator:


    ```

    Banking::deposit(50);

    Banking::withdraw(50);

    print "$Banking::name\n";

    ```


    You can always change the default package name with a package statement:


    package Banking;


    Now, Banking is the default package. To reference symbols from the main package,

    you need the : : operator:


    ```

    print "$main::name";

    ```


    Note that Perl builtin variables as $ and _ always belong to the main package

    and thus never have been referred to using the : : operator. my variables, on
    the other hand,

    are never part of a package; thus, they can never be referenced using the : :
    operator.


    # 7.61 Modules and use


    If a file contains a package, the package is usually fully contained in that file,
    but this is

    a requirement. A file could consist of more than one package. Likewise, a package
    could

    spread out over more than one file. However, neither of these arrangements are
    common

    occurrences. The name of the file in which a package is defined is irrelevant
    in Perl 4. Most

    files define packages in Perl 4 were conventionally named something.pl.


    In Perl 5, a more systematic approach is used. There is a tight connection between
    the

    filename and the package name. For example, if a package is named Math, then the
    file

    be named Math.pm. In this approach, only one package must be defined per file.

    Files that follow the Perl 5 approach are called Perl modules. Modules are included
    in a pro-

    gram with the use statement.


    The use statement only loads files whose end in .pm, that is, a Perl module as

    described above. When you use use, you need to omit the .pm portion of the file
    you are

    loading:


    ```

    use Math;

    use English;

    use Cwd;

    ```'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'There is also a technical difference between use and require. The former is
    executed during the first pass of the Perl interpreter, whereas the latter is
    executed during execution of the Perl program. Thus, the following will not work
    properly:


    ```

    $name = "Math";nuse $name;

    ```


    There are many Perl modules (.pm files) that now ship with the Perl distribution.
    We take a closer look at these modules in Chapter 11. Until then, here is a simple
    example using the Cwd module. This module allows you to keep track of which directory
    you are in, regardless of which system you are using, Windows or Unix.


    ```

    #!/usr/bin/perl

    #

    # pwd.pl

    #

    use Cwd; # make Cwd the current package

    package Cwd;

    $current = getcwd(); # get current directory name

    print "Current directory is $current\n";nprint "changing to $ARGV[0]\n";nchdir($ARGV[0]);
    # change to directory $ARGV[0]

    $pwd = getcwd();

    print "Current directory is now $pwd\n";nprint "Changing to $current\n";nchdir($current);

    print "Current directory is $current\n";n% pwd.pl ..\n

    Current directory is C:/perlbook/examples/7

    changing to ..

    Current directory is now C:/perlbook/examples

    Changing to C:/perlbook/examples/7

    Current directory is C:/perlbook/examples/7


    ```


    The program uses a system call, chdir, to change to the directory given as the
    first argument on the command line, and then changes back to the previous current
    directory.


    # 7.7 Predefined Subroutines


    You can code a subroutine named BEGIN anywhere in your Perl script. This subroutine
    will execute when your script is being translated, that is, before your program
    really begins execution. Awk programmers will recognize this subroutine.'
