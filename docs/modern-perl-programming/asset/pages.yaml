  md: '# 3.1.1 Assignment operators


    Most operators are binary in nature. This means they have two operands. For example,
    the addition operator is binary. In the line of code below, $y and $z are the
    two operands:


    ```

    $x = $y + $z;

    ```


    Any binary operator can be written using the assignment operator rather than using
    the longer and more traditional approach. Here are some traditional assignment
    statements using some simple arithmetic operators:


    ```

    $x = $x + 5;      # addition

    $x = $x / 2;      # division

    $x = $x * 2;      # multiplication

    $x = $x ** 5;      # exponentiation

    ```


    Perl has a set of operators that is collectively referred to as assignment operators.
    These operators consist of any binary operator followed by the assignment symbol.
    Here are a few examples of assignment operators. Each statement below is functionally
    equivalent to the respective statement above:


    ```

    $x += 5;      # addition

    $x /= 2;      # division

    $x *= 2;      # multiplication

    $x **= 5;      # exponentiation

    ```


    These operators may save you some typing and therefore save you some errors. For
    example, compare the following statements. Which is easier to?


    ```

    table[$index] = $table[$index] + $increment;

    table[$index] += $increment;

    ```


