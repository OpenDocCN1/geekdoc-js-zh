  md: "# 10.3.2 Complex hashes\n\nWe have concentrated mostly on arrays far. We now\
    \ turn to hashes. A hash map a key to a value. The value can be arbitrarily complex,\
    \ that is, it could be a scalar, an array, another hash, a subroutine, or any\
    \ other complex that you need. The hash contains a few (name, value) pairs. Each\
    \ name is mapped to an anonymous array.\n\n```\n%courses = (\nMike => [Cpp, Java,\
    \ Perl],\nAlan => [OCAD, Java, UML],\nRoger => [UNIX, C, Cpp]\n);\n```\n\nTo display\
    \ the courses that Mike teaches, we could simply dereference the expression $courses{Mike}.\
    \ The code would be:\n\n```\nprint @{$courses{Mike}}\n```\n\nIf we wanted a particular\
    \ course, we could just supply the appropriate subscript on the previous expression.\
    \ For example, the following expression would display Java:\n\n```\nprint @{$courses{Mike}}\
    \ [1];\n```\n\nThus, we could use the following to print all the courses:\n\n\
    ```\nforeach $key (keys (%courses))\n{\n    print @{$courses{$key}}, \"\\n\";\n\
    }\n```\n\n$courses{$key} reference above returns a reference to an array which\
    \ then must be dereferenced with @. To build an array of all the courses, we could\
    \ code:\n\n```\nforeach $key (keys (%courses))\n{\n    foreach $course (@{$courses{$key}})\n\
    \    {\n        push(@courses, $course);\n    }\n}\n```"
