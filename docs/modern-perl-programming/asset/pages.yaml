  md: '# 9.3 Process Creation


    The rename system call gives an existing file name as follows:


    ```

    rename("original", "newname");

    ```


    # 9.3 Process Creation


    A process is a program in execution. A process includes the executing program
    and some operating system information related to it. This information may differ
    from system, but it would typically include items such as the current directory,
    the owner of the file, the size of the executable, environment variables, etc.


    # 9.3.1 exec


    The exec system call replaces the program running in a process. For example, the
    program below prints the time of day and then calls the DIR command. The argument
    to the exec command must be a command that can be executed on your operating system’s
    command line.


    ```

    #!/usr/bin/perl

    #

    # exec.pl

    #

    require "ctime.pl";

    $date = ctime(time);

    print "$date";nprint "Starting the DIR command\n";nprint "---------------------------------------\n"

    exec("DIR /B");

    print "finishing the DIR command\n";n% exec.pl

    Fri Sep 7 23:20:29 2001

    Starting the DIR command

    --------------------------------------

    exec.pl

    mkdir.pl

    whereto.pl

    lines.pl

    %

    ```


    If you examine the program closely, you will see that everything proceeds as expected
    until the exec is executed. If you are using Unix, use ls -l instead of DIR. It
    is the manner in which it is executed is important. It actually replaces the Perl
    program in memory. Technically, the Perl program running in the process is replaced
    by the DIR executable. Thus, the Perl program is erased'
