  md: '# GRAPHICAL USER INTERFACES WITH THE Tk.pm MODULE


    We have seen a great deal of what Perl can do. We now want to switch the focus
    and how Perl produces GUIs using the Tk .pm module. This is a great undertaking
    as this is a vast body of knowledge. We will be demonstrating many Tk capabilities.
    All of the methods in this section take many options. We will only show a few
    for each and leave the rest for a book that specializes in writing GUIs in Perl.


    # 14.1 Introduction


    The standard Perl distribution does not ship with the Tk module, so you will have
    to download it. Depending on which system you are using, the way in which you
    download the module will vary. On my Windows system, I used the ppm utility that
    comes with the ActiveState Perl distribution to download the Tk .pm module like
    this:


    ```

    C> ppm

    PPM interactive shell (2.1.2) - type ''help'' for available commands

