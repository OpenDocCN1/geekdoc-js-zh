  md: "but does not match:\n\nhot\n\nIncidentally, all matches are case-sensitive.\
    \ You can make them case-insensitive if you / place the \"i\" character in back\
    \ of the pattern. The pattern below allows the while loop to exit if the user\
    \ types any string containing yes, regardless of case:\n\n```\nwhile(1)\n{\n \
    \ print \"answer yes or no \";n  chomp($res = <STDIN>);\n  last if $res =~ /yes/i;\n\
    }\n```\n\nThe square brackets are similar to the period except that the match\
    \ is limited to the char- actors within the brackets. Thus, the pattern:\n\n```\n\
    /aeiou]t/\n```\n\nmatches the three-letter patterns:\n\n```\nhat\nhet\nhit\nhot\n\
    hut\n```\n\nbut does not match:\n\n```\nht\nhrt\n```\n\n# 6.3.2 Within square\
    \ brackets\n\nSince certain character alternatives are more popular than others,\
