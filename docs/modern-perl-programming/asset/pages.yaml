    # 16.5 Quoting


    In languages like the Unix shells and Perl, there are many special characters.
    Quoting refers to the ways in which you can turn off the meaning of special characters.
    This can sometimes be confusing and easily lead to bugs.


    With single quotes, everything except \, which prints a \ and \'', which prints
    a '', taken literally. Within double quotes, scalar and array names are interpolated,
    as are escape sequences beginning with \, but everything else is taken literally.
    Thus, strings containing escape sequences such as \n and \t must be double quoted
    for interpretation.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# 16.5 Quoting 319


    Like the Unix shell, command substitution takes place within back quotes. Because
    of all the various quoting mechanisms, Perl allows alternative notations to lessen
    the possibility for potential errors. For example, suppose you wanted to print
    the eight characters below. Try it!


    ```

    ''$a=''5''

    ```


    One way to do this is as follows:


    ```

    print ''\$a\=\$b\'';

    ```


    The print above uses thebackslash character to turn off the special meaning of
    whatever character follows it. This solution is best hard to follow and is certainly
    error-prone. There is another approach. Instead of using a pair of single quotes,
    you can use the q character and a pair of # to enclose whatever text you wish
    to compose. Using this technique, you could code:


    ```

    print q#$a=''$b#;

    ```


    In addition to the #, you may use any of the following:


    ```

    print q#$a=''$b#;

    print q!$a=''$b!'';

    print q(''$a=''$b'');

    print q(''$a=\$b'');

    ```


    Likewise, the double quote characters have another means of expression. The following
    are equivalent:


    ```

    print "hello there"

    print qq#hello there#

    print qq!hello there!

    print qq(hello there);

    print qq(hello there)

    ```


    Perl also has a synonymous expression for back quotes:


    ```

    $x = `ls`

    $x = qx#ls#

    $x = qw!ls!

    $x = {ls};

    $x = (ls);

    ```'
  merge: -1
  pgno: 340
