  md: "# Accessing a Database from Perl\n\nvary according to the database to which\
    \ you wish to connect. For the MySQL database, the connection syntax is:\n\n```\n\
    my $dbh = DBI->connect(\"dbi:mysql:test\", $user, $password)\nor die \"Can't connect!\"\
    ;\n```\n\nThe connect method returns a database handle, $dbh. The handle is actually\
    \ an object on which you can execute methods to query the database.\n\n# 15.3.2\
    \ Executing a query\n\nReal databases normally give the user a shell interface\
    \ and a graphical interface. In the shell interface, the user types SQL commands\
    \ that are interpreted and executed by the database engine, which in turn sends\
    \ the output to the shell. This is what we have seen previously. In Perl, the\
    \ situation is similar, although there is no shell. You simply prepare the statement,\
    \ execute it, and the results are sent back to your program, where you can process\
    \ the data any way you wish. Here's a small example:\n\n```\n#!/usr/bin/perl\n\
    # database1.pl\n#\nuse DBI;\n$user=\"\"\n$password=\"\"\nmy $dbh = DBI->connect(\"\
    dbi:mysql:test\", $user, $password)\nor die \"Can't connect!\"\nprint \"connected\
    \ to mysql\\n\"\n$sth = $dbh->prepare(\"select * from staff;\")\n$sth->execute();\n\
    while (@r = $sth->fetchrow_array) {\n    printf \"%3d %-7s %3d %-13s-%15s%4d\\\
    n\",\n    $r[0], $r[1], $r[2], $r[3], $r[4], $r[5]);\n}\n```\n\nAfter the connection\
    \ has been made, we use the prepare method to prepare a SQL statement. prepare\
    \ returns a statement handle, $sth. The next step is to execute the statement\
    \ with the execute method. At this point, we may retrieve the data in various\
    \ ways. One way is with the method named fetchrow_array, which fetches a row of\
    \ data. Here is the output of database.pl:"
