  md: '# 10.2 Anonymous References


    The examples that we have seen far have included only named arrays and hashes.
    In some cases, you will want to take another approach. It''s possible to create
    an array that has no name. When you do this in Perl, the address of where the
    array is located is generated for you. This is called an anonymous array.


    # 10.2.1 Anonymous arrays


    The syntax for creating an anonymous array is shown in the following example.
    Keep in mind that the address returned by this array will be stored in a scalar,
    so you must code as shown below:


    ```

    $ref = [10, 20, 30];

    print "The entire array -> $$ref\n";nprint "A single element -> \$ref[0]\n";nprint
    "Alternative notation", \$ref->[0], "\n";

    ```


    It would be a logical error to code:


    ```

    @ref = [10, 20, 30];

    ```


    This would simply create an array of one element whose value was the address of
    where-data 10, 20, and 30 were stored. The important notion here is that the expression:


    ```

    [10, 20, 30];

    ```


    is a reference in the same sense that $ref is a reference in the line below:


    ```

    @data = (200, 300, 400);

    \$ref = \@data;

    ```


    # 10.2.2 Anonymous hashes


    You may also have anonymous hashes. In the code below:


    ```

    $states = ( MD => Annapolis,

    CA => Sacramento,

    NY => "New York City"

    };

    print "\$$states{NY}\n";nprint \$states->{NY}, "\n";

    ```'
