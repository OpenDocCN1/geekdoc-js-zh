  md: '# 8.2.1 A different view


    Suppose you want two lines of output information for each line in a file. For
    example, say you wanted your layout to appear as follows, rather than the way
    it appears above:


    ```

    CALC            242

    02-08-01        9:28a

    ====================

    HTML            394

    02-08-01        8:45a

    ====================

    ```


    To achieve this particular layout, you could use the following format (see report2.pl):


    ```

    format STDOUT =

    <<<<<<<<<<< @>>>>>>

    $info[0], $info[2]

    <<<<<<<<<< @>>>>>>

    $info[3], $info[4]

    ==================

    ```


    In this format, each time the write command is executed, then:


    ```

    $info[0] and $info[2]

    ```


    are displayed using:


    ```

    <<<<<<<<< @>>>>>>

    ```


    Likewise, the items:


    ```

    $info[3] and $info[4]

    ```


    are displayed using:


    ```

    <<<<<<<<< @>>>>>>

    ```'
