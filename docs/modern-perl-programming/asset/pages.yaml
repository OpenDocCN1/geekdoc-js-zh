    \ we change the foreach\nloop, we might sort the data either by key or by value.\n\
    \n# ### 5.2.1 Sorting by keys\n\nIn Perl, the native sort function always sorts\
    \ lexicographically, and thus it is easier\nto sort strings than numbers. Sorting\
    \ keys, therefore, is simple. Change the foreach\nloop to the following:\n\n```\n\
    foreach $word (sort (keys(%words)))\n{\n    print \"$word\\t$words{$word}\\n\"\
    ;n}\n```\n\nThe keys are sorted and then presented in turn to the foreach loop\
    \ variable.\n\n# ### 5.2.2 Sorting by values\n\nTo sort by numerical value, in\
    \ this case, the frequency, a specialized version of sort\nrequired. The code\
    \ to invoke sort would be:\n\n```\nsort numcmp keys(%words)\n```\n\nIn this case,\
    \ the two values sent to sort will be two keys. However, we want to compare\n\
    the values associated with those keys and that is why the comparison expression\
    \ is:\n\n```\n$words{$a} <= $words{$b}\n```"
