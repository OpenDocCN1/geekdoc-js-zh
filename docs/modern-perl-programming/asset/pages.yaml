  md: '# PREFACE


    Welcome to the world of Perl programming. I know that few of you reading the preface,
    but it may help to at least browse through it to make the reading of the actual
    text a little easier. In this section I will tell you a little about Perl and
    a lot about conventions used in this book. But first, I have a few questions to
    answer.


    # What Is Perl?


    Perl is a programming language that was created by Larry Wall in the early 1980s.
    The language has gained widespread popularity over the last few decades. In the
    beginning, Perl was used by a small group of Unix system administrators who needed
    a language, superior to the Unix shell, to do various system administration tasks.
    With the exponential growth of the Internet and the popularity of the World Wide
    Web''s Common Gateway Interface (CGI) programming paradigm, the number of Perl
    programmers has also grown exponentially.


    # Why program in Perl?


    Being familiar with many programming languages, I''m in a good position to judge
    you. I have had my favorite languages throughout the years: Forran, PL/I, C, C++,
    Java, and of course, Perl. Too many people argue about which language is the best.
    No language can be all things to all. Each language has its strengths and weaknesses.
    However, no language that I know has the expressive capability and use of Perl.
    You, of course, can decide for yourself when you finish reading this book.


    # Why did I write this book?


    I have been an instructor of computer programming languages for more than three
    decades. In that time, I have had the occasion to learn many languages. My typical
    approach would be to buy a book on the subject, plow through it, and write as
    many programs as I could to test out various features of the language.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'I''m critical of textbooks. Most of the textbooks that I''ve read never seemed
    to be at the correct level. Half of them seemed too elementary; the other half
    seemed too advanced. I always wanted one that was right in the middle. I tried
    to write this book for the intermediate audience because I think I can save people
    in that category a lot of time and research.


    # Who should read this book?


    This is a book about Perl programming, so anybody who is interested in writing
    Perl programs should read this book. Since Perl is a programming language, you
    would think this means only programmers should read it. Currently, there is a
    blur over who is a programmer. Many Web-sters who maintain Web pages also write
    CGI scripts. System administrators need to write scripts to support users. Managers
    personally want to write scripts to create reports for various staff members above
    and below them in the corporate hierarchy. All these groups would profit from
    reading this book.


    # Overview of the Book


    The book is organized in three sections: beginning, intermediate, and advanced.
    In the beginning section, you will see topics such as: input and output, operators,
    arrays, structures, and data types. In the intermediate section, you will see
    topics such as: associative arrays, regular expressions, subroutines, report writing,
    and accessing system resources. The advanced section includes topics such as:
    references, object-oriented programming, client/server programming, CGI programming,
    graphical user interfaces (GUIs) with the Tk module, accessing real databases
    in Perl, and debugging.


    # Chapter Summaries


    # Chapter 1: A Perl Tutorial


    demonstrates many fundamental Perl features so that you can start Perl programs
    quickly. Subsequent chapters will drill more deeply into each of the topics presented
    here.


    # Chapter 2: Simple I/O


    looks more deeply into reading and writing files. Some of Perl''s operators for
    determining the type of a file are explored. Finally, this chapter looks at how
    you can determine information about files.


    # Chapter 3: Perl Operators


    examines the Perl operators. A Perl expression is a syntactically correct combination
    of operators and operands. Perl has a plethora of operators. Many of them originated
    with the'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'C language and some of them are particular to Perl. In this chapter, we will
    explore all of the operators, including those used for bit manipulation, string
    manipulation, and regular expressions.


    # Chapter 4: Arrays and Array Functions


    +   takes an in-depth look at arrays in Perl. All programming languages use arrays
    heavily and Perl is no exception. However, you will see that Perl arrays are dynamic
    and supported by a wide variety of functions. We will take a look at some of the
    nice features of Perl arrays. Finally, we will look at many of the more common
    array functions used by Perl programmers.


    # Chapter 5: Hashes


    +   looks at a common scenario in programming languages: paired data. Associative
    arrays, also called hashes, provide an efficient way to search for values by their
    keys. In this chapter, we will show how hashes may be used to efficiently solve
    a variety of encountered problems.


    # Chapter 6: Regular Expressions


    +   refers to patterns that are expressed with characters armed with special meanings.
    These patterns may be compared to strings to see if the strings match the patterns.
    These regular expressions make it easy for Perl to validate data, make substitutions,
    or pick out portions of match.


    # Chapter 7: Subprograms


    +   investigates the wide gamut of possibilities when you write your own functions.
    This chapter examines all of the principles having to do with subroutines in Perl.
    Some languages refer to these blocks as functions, while others refer to them
    as subroutines, and still others refer to them as procedures. In Perl, they are
    referred to as either subroutines or functions. Perl does not differentiate between
    these two terms.


    # Chapter 8: Generating Reports in Perl


    +   demonstrates Perl''s report writing capabilities. Reports are typically written
    by administrators to summarize user and file activity. You can have Perl automatically
    generate headers and body formats. This chapter gives the details of the rudimentary
    report writing capabilities of Perl.'
  merge: -1
