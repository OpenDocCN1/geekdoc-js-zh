  md: "Here’s another example. This one uses the B32 format to express an integer\
    \ as a bitstream.\n\n```\n#!/usr/bin/perl\n#\n# bits.pl\n# for ($i = 1; $i <=\
    \ 31; $i++)\n{\n  $str = unpack(\"B32\", pack(\"N\", $i));\n  print substr($str,\
    \ 25, 8), \"\\n\";\n}\n```\n\n```\n% bits.pl\n000001\n0000010\n0000011\n0000100\n\
    0000101\n0000110\n0000111\n0001000\n0001001\n0001010\n0001011\n0001100\n0001101\n\
    0001110\n0001111\n0010000\n0010001\n0010010\n0010011\n0010100\n0010101\n0010110\n\
    0010111\n0011000\n0011001\n%\n```"
