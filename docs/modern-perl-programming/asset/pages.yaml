  md: "uses three sets of parentheses. Among them, the outer set can be retrieved\
    \ with $1, while the two inner sets can be obtained with $2 and $3.\n\n# 6.6 Greedy\
    \ Regular Expressions\n\nExamine the following program:\n\n```\n$_ = \"This is\
    \ an example sentence.\"\nprint \"$1\\n\" if / (.*) /;\n```\n\nThe pattern in\
    \ the above expression is “anything surrounded by single blanks.” There are several\
    \ matches described by the above regular expression. Here are a few of them:\n\
    \n```\n| is |\n| an |\n| an example |\n| an |\n an |\n```\n\nIn Perl, the regular\
    \ expression engine takes the largest possible pattern. Sometimes, pattern matching\
    \ is described as being greedy. Therefore, the following pattern is chosen:\n\n\
    ```\n| is an example |\n```\n\nIf you want the smallest match to be chosen, place\
    \ a ? behind the part to be matched:\n\n```\nprint \"$1\\n\" if / (.*?) /;\n```\n\
    \nThe matched pattern is now:\n\n```\n| is |\n```\n\nNote that in the above code,\
    \ there may be easier ways to isolate the pattern, but the idea here is to assure\
    \ that you understand the regular expression engine.\n\n# 6.7 Substitutions\n\n\
    There are numerous examples of using a regular expression to validate a user response:\n\
    \n+   - Is the input set of digits?"
