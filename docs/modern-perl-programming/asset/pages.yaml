    # 3.1 Perl Operators


    Perl has an abundance of operators. Many of them come from the C programming language,
    some come from Unix shells, and others are strictly particular to Perl. Before
    we see the complete set of Perl operators, we need to explain some preliminary
    concepts.


    Operator precedence defines the order in which operators are executed. Operator
    associativity defines the order when there are ties in the precedence. For example,
    most languages define multiplication to be higher in precedence than addition,
    and thus the following evaluates to 17, not 21:


    ```

    $x = 2 + 5 * 3;

    ```


    What if an expression involves operators of the same precedence?


    ```

    $x = 200 / 5 * 10;

    ```


    The precedence here does not tell us because / and * are at the same level in
    the hierarchy. To evaluate this expression, we need to know the associativity
    of these operators. Is it left to right or right to left?


    As it turns out, the associativity of these particular operators is left to right.
    Therefore, the above expression has the value 400. To ensure that the multiplication
    was executed first, you could use a set of parentheses as follows:'
