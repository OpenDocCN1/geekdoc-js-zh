  md: '# CHAPTER 12


    # CLIENT/SERVER APPLICATIONS


    This chapter explores some of the possibilities of client/server applications
    with sockets. After reviewing some networking fundamentals, we''ll give some examples
    of writing clients that connect to real servers. Then we will write a few servers.


    # 12.1 Introduction


    A server is a program in execution that provides some service. One server may
    offer a file transfer service, while another server may offer the time of day.
    A client is a program that needs some service, such as a file transfer or the
    time of day. In this chapter, we will show how to write clients and servers, and
    how to connect them to each other.


    # 12.1.1 TCP networks


    Two programs communicate over a network using a set of rules called protocols.
    Several well-known protocols are in wide use today. Among them, the Transmission
    Control Protocol, TCP, and the Internet Protocol, IP, are two standard protocols
    for communicating over the Internet.


    TCP/IP provides two types of data delivery mechanisms: TCP and the User Datagram
    Protocol, or UDP. TCP is a reliable data delivery service. This service guarantees
    data delivery by using error detection mechanisms and acknowledgments. Before
    any data transmission, both communicating programs need establish a TCP connection.


    UDP is a best-effort data delivery service that is connectionless and does not
    guarantee reliable data delivery. For instance, an application delivery sound
    or images might use UDP service.


    Typically, a server starts execution first and continues to accept requests without
    terminating. A client starts execution only when a service is required and terminates
    after its request has been satisfied; or, after the service is provided, the client
    may make another request of the server. For example, the client may request another
    file.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# 12.1.2 Internet addresses


    A client/server application is an example of two communicating programs on a network.
    The server program provides a service to the client program. Typical server applications
    include echo service, daytime service, telnet service, and File Transfer Protocol
    (FTP) service.


    Each computer on the Internet has a name and a 32-bit address. The name is referred
    to as the domain name and the address is referred to as the IP address. The IP
    address is typically expressed as four dot-separated integers.


    ```

    www.sun.com             192.18.97.241

    www.ford.com            164.109.71.245

    www.microsoft.com      207.46.230.220

    ```


    The Domain Name System (DNS) translates a domain name into an IP address when
    this is necessary.


    # 12.1.3 Ports


    Since there may be more than one service running on the same machine, each service
    is assigned a port. A client wishing to communicate with a server needs to know
    the address of the server and the port assigned to it. Well-known services,, such
    as ftp (21) and http (80), are reserved ports. On Unix, port numbers under 1000
    cannot be used unless you are the root user. Initially, a client establishes the
    port number on which the communication will occur. When a client connects to a
    server, the server obtains the address of the client and can therefore send information
    back to the client if necessary.


    The two communicating programs may reside on different machines, provided the
    two machines are connected by a similar network, or the two communicating programs
    may reside on the same machine.


    # 12.1.4 Sockets


    A socket is a software abstraction that behaves as an endpoint for communicating
    processes. Sockets were originally developed for Berkeley Unix systems in the
    1970s, but a version of this abstraction currently exists on all operating systems.


    The socket programming interface takes various arguments that specify which protocols
    should be used in the underlying data exchange. We will describe only those parameters
    that are used to TCP/IP programming in the Internet domain, although other domains
    exist.


    In order Perl programs, the socket subroutine required several parameters as shown
    below:'
  merge: -1
  pgno: 239
