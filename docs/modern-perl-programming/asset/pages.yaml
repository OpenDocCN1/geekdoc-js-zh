    use GradStudent;

    $stul = new Student(Mike, Math, Alg, Calc, Trig);

    print $stul->getname(), "\n"

    print $stul->getmajor(), "\n"

    $gs=new GradStudent(Dave, Math, 25000, Calc, Trig);

    #

    # reuse Student functionality

    #

    print $gs->getname(), "\n"

    print $gs->getmajor(), "\n"

    #

    # a new method

    #

    print $gs->salary(), "\n";

    ```


    # 11.4.2 Polymorphism


    Consider a set of classes related through inheritance. The classic example is
    a set of classes derived from a geometric Shape class. Each class, say Circle,
    Square, Triangle, etc. would have its own draw, area, and perimeter methods. Each
    of these methods would have a class-specific implementation. The skeleton code
    for an application for such a scenario would be:


    ```

    $circle = new Circle(5);

    # create a circle

    $square = new Square(10);

    # create a square

    print $circle->area(), "\n"

    # area of circle

    print $square->area(), "\n"

    # area of square

    ```


    The capability of a language to differentiate among several methods, all of which
    have the same name in the same inheritance hierarchy, is called polymorphism.
    Polymorphism is implemented in Perl through the bless function. When an object
    is blessed, it is bound'
