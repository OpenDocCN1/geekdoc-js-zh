  md: "# 14.4 Other Widgets\n\n![](img/74431d7901809922ce9b915cecff17c7_294_0.png)\n\
    \n**Figure 14.15** A dialog box.\n\n# 14.4.5 Dialog boxes\n\nIn a few previous\
    \ examples, whenever an Exit button was selected, the program was unconditionally\
    \ terminated. A better approach would be to allow the user to confirm or deny\
    \ this selection. This is where a dialog box is useful. See Figure 14.15.\n\n\
    A dialog box prompts the user for input and returns the string attached to the\
    \ button by the user. A dialog box requires two steps: create the dialog box with\
    \ the Dia-log method and display the dialog box with the Show method. The code\
    \ below produces rendering beneath it:\n\n```\n$d = \\$mw->Dialog(\n  -text =>\
    \ \"Really Wanna Quit?\",\n  -bitmap => \"question\",\n  -buttons => [\"Yes\"\
    , \"No\", \"Cancel\"] );\n\\$answer = \\$d->Show();\n```\n\nWhen the user selects\
    \ Yes, No, or Cancel, the \\$answer variable contains the label on the button\
    \ as a string. The GUI in Figure 14.16 allows a user to enter expressions into\
    \ an Entry widget. The user can then select a button to evaluate the expression,\
    \ clear the text widget, or exit the application. If the user selects Exit, a\
    \ dialog is presented when the following subroutine is executed:\n\n```\nsub quit\n\
    {\n  \\$d = \\$mw->Dialog(\n    -text => \"Really Wanna Quit?\",\n    -bitmap\
    \ => \"question\",\n    -buttons => [\"Yes\", \"No\", \"Cancel\"] );\n  \\$answer\
    \ = \\$d->Show();\n  exit if (\\$answer eq \"Yes\")\n}\n```"
  merge: -1
  pgno: 294
- img_proc: true
  md: "274\n\nHere is the entire program:\n\n```\n#!/usr/bin/perl\n#\n# dialog.pl\n\
    #\nuse Tk;\nuse Tk::Dialog;\nmy $mw = MainWindow->new;\nsub trans\n{\n    ++$\n\
    \    $tk->insert(\"end\", \"$i\\tcomments\");\n    $tk->insert(\"end\", \" has\
    \ the value \");\n    $result = eval @comments;\n    $ans = $? if @;\n    $tk->insert(\"\
    end\", \"$result\\n\");\n}\nsub clear\n{\n    $i = 0;\n    $tk->delete(\"1.0\"\
    , \"end\");\n    $tk->insert(\"end\", \"Watch this window\\n\");\n}\nsub quit\n\
    {\n    $d = $mw->Dialog(\n    -text => \"Really Wanna Quit\",\n    -bitmap =>\
