  md: "# 140\n\n# Chapter 7 • Subprograms\n\n```\n# Banking.pl\n#\npackage=Banking;\n\
    $name=\"Inside the Banking package\";nsub deposit\n{\n    print \"depositing $\\\
    $[0]\\n\"\n}\nsub withdraw\n{\n    print \"withdrawing $\\$[0]\\n\"\n}\n1;\n```\n\
    \nIn Perl, there is the notion of a default package. When a Perl program begins,\
    \ the default package is the main package. To use symbols from another package,\
    \ you must use the :: operator to make qualified references. First, however you\
    \ must use require to load the new package. In one sense, packages are nothing\
    \ more than named libraries. Here's an application that uses the Banking.pl library.\n\
    \n```\n#!/usr/bin/perl\n# Bankapp.pl\n#\n$name=\"Inside the main package\"\nprint\
    \ \"$name\"; # default package is main\nrequire \"Banking.pl\";nBanking::deposit(50);\
