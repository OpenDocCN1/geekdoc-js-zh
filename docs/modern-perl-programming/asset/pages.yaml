- img_proc: true
  md: '# 15.2 Review of SQL and Relational Databases


    If you are using a database other than MySQL, you''ll need to start that particular
    server and client. Once you have done this, you can enter any of the commands
    that you see below. If you''ve never written SQL code before, it''s a good idea
    to see a few queries. When you later use Perl to make the same queries, you will
    see a striking similarity.


    # 15.2.2 Retrieving data from a relational database


    Retrievals are done with the select statement. Here are a few examples:


    ```

    mysql> select name, age from Staff where city = "Columbia"

    +--------------------------------------+

    | name    | age |

    +---------+------+

    Michael | 56 |

    Susan   | 38 |

    Patti   | 35 |

    Danko   | 38 |

    Bob     | 51 |

    Mike    | 55 |

    +---------+------+

    6 rows in set (0.00 sec)

    ```


    The select statement is given by a comma-separated list of field names. The word
    is followed by the name of the table. The where keyword is followed by the selection
    criteria. Thus, the selection above yields the first name and age of all records
    that have Columbia as the city value. If you do not want to select, you may ask
    for all records using the * character.


    ```

    mysql> select * from Staff;

    +------+------+------+-------------+-----------++

    | item | name    | age | dept       | city      | years |

    +------+------+------+-------------+-----------++

    0001 | Michael | 56 | Technical  | Columbia | 12 |

    0002 | Susan   | 38 | Finance    | Columbia  | 06 |

    0003 | Erin    | 28 | Technical  | Odenton   | 03 |

    0004 | Sally   | 51 | Coursework | Silver Spring | 01 |

    0005 | Patti    | 35 | Instruction | Columbia  | 01 |

    0006 | Bob     | 58 | Marketing  | Ft. Ludderalte | 01 |

    0007 | Kim      | 34 | Marketing  | Chicago   | 01 |

    0008 | Roger   | 51 | Instruction | Silver Spring | 08 |

    0009 | Alan    | 46 | Instruction | Baltimore  | 06 |

    0010 | Danko   | 38 | Instruction | Columbia  | 07 |

    0011 | Bob     | 51 | Instruction | Columbia  | 04 |

    0012 | Mike    | 55 | Instruction | Columbia  | 01 |

    +------+------+------+-------------+-----------++

    12 rows in set (0.00 sec)

    ```'
