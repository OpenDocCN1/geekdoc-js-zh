  md: "254 Chapter 14 • Graphical User Interfaces with the Tk .pm Module\n\n```\n\
    ppm> quit\nQuit!\nC>\n```\n\n# 14.1.1 Widgets\n\nTk is a Perl module that allows\
    \ for the scripting of GUIs. This module was originally written in conjunction\
    \ with the Tcl (“tickle”) scripting language and has a Motif/X-Windows look and\
    \ feel. In a Tk application, a visual component is called a widget. Other systems\
    \ refer to their components by different names. Visual Basic calls them controls,\
    \ Java calls them components, and Motif calls them widgets as well. Here are a\
    \ few examples of widgets:\n\n+   * Buttons\n* Checkbutton\n* Labels\n* Entry\
    \ fields\n* Scrollbars\n* List boxes\n* Canvases\n* Menu buttons\n\nThe widget\
    \ program that is delivered as part of the standard Tk module demonstrates many\
    \ widget examples.\n\n# 14.1.2 Event-driven programming\n\nThe programs we have\
    \ seen thus far have typically been procedural in nature. These programs follow\
    \ a logical path that is dictated by the data input to the program.\n\n```\nwhile\
    \ (1)\n{\n    print \"What is your name? \";\n    chomp($name = <STDIN>);\n  \
    \  print \"Your name is $name!\\n\"\n}\n```\n\nEvent-driven programming executes\
    \ a section of code only after a user has responded to a GUI widget such as a\
    \ button or a checkbox. Then, the portion of the program that has been preset\
    \ to respond to that code will get executed. Pseudo-code for an event-driven program\
    \ is as follows:"
  merge: -1
  pgno: 275
- img_proc: true
  md: "# Introduction\n\n```\ninitialize everything\nwhile (1)\n{\n  read an event\n\
    \  if (event is mouse movement)\n    call mouse_movement_routine\n  elsif (event\
    \ is button click)\n    call button_click_routine\n  elsif (event is keyboard\
    \ input)\n    call keyboard_input_routine\n  #\n  #...\n  # etc.\n  # etc.\n}\n\
    ```\n\nThe program runs forever, processing events as they happen. Tk also provides\
    \ for the default processing of events so you do not have to write routines for\
    \ every possible event.\n\n# 14.1.3 A simple example\n\nHere's the smallest GUI\
    \ program. It simply places a window on the display and enters a main loop. All\
    \ GUIs will have this humble beginning.\n\n```\n#!/usr/bin/perl\n#\n# SimpleWin.pl\n\
    #\nuse Tk;\nmy $mw = MainWindow->new;\nMainLoop;\n```\n\nThe simple code opens\
    \ up a window and enters an event handling loop. The GUI produced by this code\
    \ is shown in Figure 14.1. The last line is important. It is responsible for displaying\
    \ the GUI and entering the event handling loop.\n\nYou'll notice that the application\
    \ displays a simple window with the default title SimpleWin. To provide your own\
    \ title, you may add the following line just before the call to MainLoop:\n\n\
    ```\n$mw->title(\"My Own Title!\");\n```"
  merge: -1
