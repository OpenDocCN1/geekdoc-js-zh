  md: "# 6.8 Backtracking\n\nIt is useful to understand the way in which the regular\
    \ expression engine works. Examine the following:\n\n```\n$_ = \"this:is:the:examination:string\"\
    \n/(.*):.(.*):.(.*)/\n```\n\nIn the expression above, the match is successful\
    \ if $_ has three fields separated by single colons. The regular expression is\
    \ evaluated left to right, and thus the first part is evaluated the . * on the\
    \ left side of the expression. Since . * is greedy, it consumes the entire string.\
    \ $1 is set to the entire string. Now the : must be evaluated. Thus, the regular\
    \ expression engine must back up to the last colon. Next, the second .* must be\
    \ evaluated. This consumes the last word of the string. So now we have:\n\n```\n\
    $1 = \"this:is:the:examination\"\n$2 = \"string\"\n```\n\nNow the process must\
    \ be repeated for the last : (.*) part of the expression. This yields:\n\n```\n\
    $1 = \"this:is:the\"\n$2 = \"examination\"\n$3 = \"string\"\n```\n\n# 6.9 The\
    \ tr Operator\n\nPerl also has an operator named tr. It is used in situations\
    \ that are similar to regular expression matching. The tr operator is modeled\
    \ after the tr Unix command. In its simplest form, it transliterates a target\
    \ set of characters with a replacement set. Each set of characters is delimited\
    \ by forward slashes. tr performs its action on $_ if no other variable is indicated.\
    \ tr also returns the number of substitutions made. The following program replaces\
    \ lowercase vowels with uppercase vowels and returns the number of replacements:\n\
    \n```\n#!/usr/bin/perl\n#\n# xvowels.pl\n#\nwhile(<STDIN>)\n{\n    $count = tr/aeiou/AEIOU;\n\
    \    print;\n```"
