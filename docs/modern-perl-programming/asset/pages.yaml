  md: "# Chapter 13 • CGI Programming with Perl\n\nNow we will look at the script\
    \ mylog.pl, the one that logs the data to a file. We'll use flat files here rather\
    \ than an actual database such as Oracle, Sybase, or Access. However, all major\
    \ databases do have an interface from Perl, the DBI . module, and later in this\
    \ book, we will take a look at reading from these databases.\n\n```\n#!/usr/bin/perl\n\
    #\n# mylog.pl\n#\nrequire \"ctime.pl\";\n$date = ctime(time);\nsubstr($date, 20,3)\
    \ = \"\";\nchomp($date);\nuse CGI;\nCGI::ReadParse();\nprint \"content-type: text/html\\\
    n\\n\";\n$name = $in{name};\n$company = $in{company};\n$language = $in{language};\n\
    \nif ( open MYLOG, \\>> logfile\" ) {\n    print \"OPEN FAILED\";\n} else {\n\
    \    print <<EOF;\nLOGGING THE FOLLOWING ENTRY\n<OL>\n<LI>DATE: $date</</LI>\n\
    <LI>NAME: $name</LI>\n<LI>COMPANY: $company</LI>\n<LI>LANGUAGE: $language</LI>\n\
    </OL>\nEOF\n\nprint MYLOG \"$date;$name;$company;$language\\n\";\nclose(MYLOG);\n\
    }\n```\n\nThe script above gets the date and then parses the arguments with ReadParse.\
    \ Next, the LOGFILE is opened for appending. If the open fails, we will send a\
    \ message back to the browser, if the open succeeds, we will write the \"record\"\
    \ to the disk file. Below is the script that reads the log file:"
