  md: "# 7.3.3 Returning other types\n\nPerl subroutines are not limited to returning\
    \ scalars or arrays. Later in the book, we will see examples of subroutines that\
    \ return other types such as associative arrays or references, also known as pointers.\n\
    \n# 7.4 Perl Libraries\n\nAll the subroutines above were written in the file where\
    \ they were invoked. To make these and other programmer-written subroutines reusable,\
    \ you must place them in a file and instruct Perl to include them in any script\
    \ that needs them. The files you place these subroutines are essentially Perl\
    \ library files. There are a few ways of accomplishing this task.\n\n# 7.4.1 The\
    \ require function\n\nOne way of loading a file into your program is to use the\
    \ Perl require function. To illustrate how this works, let's take the statistics\
    \ function and the bigger function from above and place them in a file by themselves.\
    \ The name of the file is not significant. We will call it mystats.pl. This file\
    \ will not be executed by itself, and therefore is not necessary to have the #\
    \ line at the top of the file even if you are on Unix.\n\n```\n#\n# mystats.pl\n\
    #\nsub bigger {\n  $_[0] >= \\$_[1] ? \\$_[0] : \\$_[1];\n}\nsub statistics {\n\
    \  $mean = 0;\n  $dev = 0;\n  foreach $item (@_) {\n    $mean += $item;\n  }\n\
    \  $mean /= @;\n  foreach $item (@_) {\n    $dev = \\$dev + ($item - \\$mean)\
    \ ** 2;\n  }\n  $dev = sqrt($dev/ (@ - 1));\n  push(@results, $mean, $dev);\n\
    }\n@results;\n# see next paragraph\n```"
  merge: -1
