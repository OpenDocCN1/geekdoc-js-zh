    The next example will demonstrate how to open a file for input. Ultimately, we
    will also need to know how to handle errors produced by open, but we will delay
    that until later.

    You may open a file for input simply by using the < symbol at the beginning of
    the second argument to the open function. Of course, the file should exist or
    an attempt to open it will cause an error. If you do not specify any punctuation
    with the second argument, then the file is opened for input by default. Thus,
    the following lines are equivalent:


    ```

    open(INPUT, "input");

    open(INPUT, "input");

    ```


    When you have created the association between the filehandle and an actual disk
    file, you may use the < > operator to read from the file.


    ```

    $line = <INPUT>;

    ```


    $line is a scalar variable used to store the line that is entered by the user.
    We saw something close to this earlier when we read a line from the standard input
    with:


    ```

    $line = <STDIN>;

    ```


    The difference between the previous two lines of code is that INPUT is a filehandle
    created in the Perl program, whereas STDIN is a filehandle predefined in the Perl
    language.'
