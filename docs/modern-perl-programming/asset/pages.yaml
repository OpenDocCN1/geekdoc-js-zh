    $x = 200 / (5 * 10);


    The above expression now has a value of 4 because whatever is in parentheses is
    evalu-ated first. In the case of nested parentheses, the innermost set is evaluated
    first.

    Knowing operators in Perl is very important because often it is the operators
    that determine how a variable will be treated. For example, in the following expression:


    ```

    $x = "20abc" + "3xyz";

    ```


    it appears as though we are attempting to add two strings. The + operator allows
    Perl to treat the strings as numbers. Perl does the best it can since the strings
    are really representa-tions of numbers. The result in $x is 23. However, if we
    use the Perl concatenation operator, the dot, expression evaluates to the string
    "20abcxyz".


    ```

    $x = "20abc" . "3xyz";

    ```


    Table 3.1 lists the hierarchy of Perl operators. Operators on Level 1 have the
    highest pre-cedence; Level 2 operators have the next highest precedence, etc.
    The first column lists the level of precedence, the second column gives the names
    of the operators on this level, and the third column gives a brief description
    of the operators on this level.

    Operators on Levels 3, 4, and 18 associate right to left. Operators on Levels
    2, 9, 10, and 16 do not have any associativity. All other levels associate left
    to right.


