    \ STDOUT_TOP =\n#\n# format body\n# goes here\n# just as before\n```\n\nPerl triggers\
    \ the triggering of this format automatically at the top of every page. The fol-low\
    \ variables are used in connection with top-of-page output:\n\n```\n$ maximum\
    \ number of lines per page\n$- number of lines remaining on this page\n$% current\
    \ page number\n```\n\nMost reports will typically print $% at the top of each\
    \ page. $- yields the number of lines left on the page. If you set this variable\
