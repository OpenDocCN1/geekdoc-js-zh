    # 2.2.2 die


    All of the examples thus far have neglected the situation when the file open fails.
    This may happen for many reasons:


    +   - lack of proper permission

    - per user file table is full

    - system wide file table is full

    - too many inodes open (Unix)

    - open for read and no file exists


    To cope with these and other errors, the die function may be used to terminate
    a program when an open failure occurs. This function is usually coded as follows:


    ```

    open(INPUT, " myfile") || die;

    ```


    The || symbols represent the logical or operator. If the open succeeds, a non-zero
    value is returned and the second part of the || is not executed. However, if the
    open fails, it returns the value 0 and the second part of the || is evaluated.
    The purpose of the die function is to terminate your program with an error message.
    You may want to rely on the default error message from die, which is:


    ```

    Died ./filename linenumber

    ```


    If you don''t like the default error message, you may add your own.


    ```

    open(INPUT, " file1") || die "can''t open myfile";

    ```


    However, the default error message will still appear. You may omit the default
    error message by simply adding a newline to your own string.


    ```

    open(INPUT, " file1") || die "can''t open myfile\n";

    ```


    Finally, you use the special Perl variable $, the operating system error message
    is displayed. Here are the various forms of die:


    ```

    open(AFILE, " basename") || die;

    open(AFILE, " basename") || die "message";

    (AFILE, " basename") || die "message\n";

    (AFILE, " basename") || die "some message $";

    (AFILE, " basename") || die "some message $\$n";

    ```'
