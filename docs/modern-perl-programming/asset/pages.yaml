  md: '```

    % report1.pl PL 200

    CALC 242

    HTML 394

    OOPS 203

    QUOTES 234

    HASHORT 299

    ORTS 250

    HERETML 340

    DEBUG 316

    PACK 339

    MAKEHTML 398

    %

    ```


    Next, we will show the Perl program producing the report:


    ```

    #!/usr/bin/perl

    #

    # report1.pl

    #

    die "$0: extension size\n" unless $ARGV == 1;

    format STDOUT =

    @<<<<<<<<@>>>>>>

    $info[0],

    $info[2],


    open(FILES, "< data") || die "error: ''files\n";

    while (<FILES>) {

    @info = split;

    write if ($info[1] $ARGV[0] && $info[2] > $ARGV[1]);

    }

    ```


    The program reads lines from the data and splits them into fields. Each line is
    sent

    to the report if it matches the file extension, which is given as $ARGV[0], and
    if the file

    size is greater than the given number, the write command causes

    the data to be written in accordance with the default format, STDOUT.


    The report has one picture line and one argument line. The line has one

    format to left-adjust in a field of 12 and another format to right-adjust in a
    field of 8.

    The formats pertain to $info[0] and $info[2], respectively. The camera needs-

    sary on the argument line, but the argument placement on line is irrelevant. They
    hap-

    pen to be placed under their associated format for clarity, as you can see below:


    ```

    format STDOUT =

    @<<<<<<<<@>>>>>>

    $pieces[0], $pieces[2]

    ```'
