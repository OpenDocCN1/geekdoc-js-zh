  md: '# CHAPTER

    11


    # OBJECT-ORIENTED

    PROGRAMMING


    With the success of graphical user interfaces, or GUIs, the software world has
    gone-crazy! Object-oriented (OO) software offers developers rich rewards down
    the road. Programs are easier to maintain and understand. This chapter gives the
    details of object-oriented programming (OOP) in Perl.


    # 11.1 Introduction


    When Perl transitioned from Perl 4 to Perl 5, one of the major enhancements to
    the language was the introduction of OOP. If you are familiar with this style
    of programming in languages such as Smalltalk, C++, and Java, you may be a little
    surprised with Perl''s implementation when you see it later in this chapter. Many
    Perl modules are written using this style of programming, and thus will serve
    you to master the OOP paradigm in Perl.


    The approach in this section is to build a new data type, a class, and then demonstrate
    how to use this in an application by creating an object or two, each of which
    uses some of the behavior defined in the class. We will demonstrate all of the
    OO terms with a series of examples that increase complexity.


    # 11.2 The Vocabulary of Object Orientation


    Before we learn how to write OO programs in Perl, we must develop an OO vocabulary.
    In the real world, we commonly think of anything physical as an object. In software,
    we extend this to things that are conceptual. Thus, you can think of anything
    that is physical or conceptual as an object. Some examples of objects are a bank
    account, a file, a person, a stack, and a circle.


    Typically, a particular application is built to solve problems in a domain-specific
    area. Any such application would likely have many objects in it; for example,
    banking software would have many accounts in it; an operating system would have
    many file and job objects in it.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Chapter 11 · Object-Oriented Programming


    Every object has a set of attributes collectively referred to as the state of
    the object. For example, a mortgage object would have among other things, a name,
    a loan amount, a pay-amount, and so on. The state of a mortgage is the collection
    of its data items such as name, loan amount, and payment. Note that attributes
    tend to be nouns.


    Each object functions in various ways. The collection of these functions can be
    thought of as the behavior of the object. For example, a mortgage has behaviors
    such as create, make payment, get balance, etc. Behaviors tend to be verbs.


    Thus, every object has state and behavior.


    In the OO software, different languages tend to use different words to describe
    the same phenomena. For example, some synonyms for attributes are fields, traits,
    characteristics, object data, and instance data. The last two are used most often.


    Behavior refers to the collection of actions that an object can perform. Behavior
    is referred to as actions, functions, operations, procedures, and methods. The
    term "method" is the most often used term. To ensure that these points are clearly
    understood, a few simple examples follow.


    Suppose we have a object—call it MyCar. Instance data for MyCar would include
    length, color, model, etc. the collection of this data is the state of the object.


    Methods for MyCar would include start, drive, turn_left, etc. The collection of
    these functions is called the behavior of the object.


    Every object contains data and behaves in a particular way based on the class
    to which it belongs to. A class is a blueprint or template from which objects
    are created. It is composed of many pieces of data. The level of complexity of
    an object is determined by the class from which it was instantiated.


    The behavior of an object is implemented by a Perl method that is defined in the
    file where the class definition is kept. The class definition is always kept in
    a .pm file, the contents of which are organized in a particular way. We will describe
    this organization as we move through this chapter.


    For example, a class named Mortgage would be defined in a file named Mortgage.pm.
    Each method that can be executed on a particular Mortgage object would also be
    defined in this file.


    Unlike traditional OO languages such as C++ and Java, in Perl there is no keyword
    named class. Rather, a class is just a Perl module, a .pm file, with other prerequisites.


    # 11.3 Defining and Using Objects


    A class usually provides a method for creating an object as well as methods for
    defining the behavior of an object. Although you may make the creation whatever
    you wish, it is usually named new in honor of C++ and Java, where it is mandatory.'
