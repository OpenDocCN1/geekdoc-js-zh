    on the language with which you are most familiar, the following Perl code may
    seem a little strange to you, since the same variable, $data, is used to store
    an integer value and then a string value.


    ```

    #!/usr/bin/perl

    #

    # scalars.pl

    #

    print "input a number "

    $data = <STDIN>

    chomp($data);

    print "$data * $data is "

    print $data * $data;

    print "\n"

    print "input your name "

    $data = <STDIN>

    print "Your name is $data\n"

    % scalars.pl

    input a number 25

    25 * 25 is 625

    input your name Michael

    your name is Michael

    %

    ```


    This is not a problem in Perl because $data is a scalar and as much may contain
    any single value. That value may be a string or any kind of number. In any expression
    concern-$data, it is the operator that determines how to treat the value held
    in the variable, that is, as a string or a number. For now, the important item
    is that $data is a scalar and thus may hold a single value.


    # 1.2.2 Arrays


    An array is an ordered list of elements typically separated by commas. Here are
    a few examples of arrays:


    ```

    @names = (Mike, "Susan Smyth", "Erin\nFlanagan");

    @bas = (.324, .298, .245);

    @record = ("Mike", 27, .324, "Columbia, Md");    # a scalar

    $data = 6;

    @numbers = (1,2,3,4,5, $data);    # an array

    ```'
