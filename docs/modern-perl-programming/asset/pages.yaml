  md: 'This program, more than any other we have seen thus far, illustrates the beauty
    of Perl. The program is succinct and yet there is quite a bit going on within
    it. Before we explain it, here is a run of the program with (), the current directory
    given as the command-line argument:


    ```

    % lines.pl LINES

    FILENAME LINES

    mkdir.pl      13

    hereto.pl     14

    lines.pl      21

    %

    ```


    The user feeds the program a command-line argument. The first few lines occur
    in the program check for errors. There are several different problems that could
    occur in this script. The first check is to ensure that an argument was provided.
    The next check assures that the argument was a directory. The final check assures
    that the directory be opened.


    ```

    die "usage: lines.pl directory\n" unless $ARGV == 0;

    die "usage: arg must be a directory\n" unless -d $ARGV[0];

    die "can''t open $ARGV[0]" unless opendir(DIR, $ARGV[0]);

    ```


    Next, the files are read from @files. Then, each file is tested to ensure that
    it is not a directory. Finally, each file is opened and read to the end. The line
    count and filename are printed and the process is repeated for each file in the
    directory.


    There are several subtleties in this program. First, each file must be closed
    after it is read or $. will not be reset to zero. The filenames have been generated
    in a particular directory, but the program itself is started in its own directory.
    Thus, chdir assures the names of the files are relative to the directory from
    which they come.


    # 9.2.4 unlink and rename


    In the Unix operating system, a file can have more than one name. This is not
    true for all operating systems. The Perl unlink system removes a name from the
    filesystem. If this is the only name for the file, it is removed. In any case,
    unlink has several interfaces.


    ```

    @files = (datafile, textile, books);

    unlink("onefile");      # remove this name

    unlink(@files);          # remove a list of names

    unlink <chap*>           # remove names starting with

    # chap

    ```'
