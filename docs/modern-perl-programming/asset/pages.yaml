  md: "that traverses the builtin parameter array, @_. We will give the full details\
    \ about arguments,\nparameters, and local variables in a later chapter.\n\nPerl\
    \ functions are versatile. They may return scalars, arrays, hashes, or just about\
    \ any-\nelse, but they all return something. Of course, if you must, you can disregard\
    \ the\nreturned value. If you want to return a value from a function, then you\
    \ can either use the\nreturn statement or you can rely on the fact that the last\
    \ expression that is evaluated\ninside the function will be returned. Thus, the\
    \ above function could have been written as:\n\n```\nsub total\n  $sum = 0;\n\
    \  foreach $item (@_)\n    $sum += $item;\n  }\n  $sum;      # last expression\
    \ evaluated\n\n```\n\nDo not fall into the following trap by coding the function\
    \ as follows:\n\n```\nsub total\n{\n  $sum = 0;\n  foreach $item (@_)\n    $sum\
    \ += $item;\n  }\n\n```\n\nIt may appear that the last expression evaluated is\
    \ the statement inside the loop, but this\nis not the case. To terminate the foreach\
    \ loop, Perl had to evaluate the elements in the\nlist to determine that the loop\
    \ was finished."
