    The staff table consists of 12 rows and 6 columns. Columns are sometimes referred
    to as fields.


    # 15.2.1 Accessing a relational database


    Accessing a relational database is done via the Structured Query Language, or
    SQL, which is pronounced "see-quel". SQL is the de facto standard database language
    so that regardless of whether you are using Oracle, Sybase, Access, MySQL, or
    some other database, all standard SQL commands should behave consistently. Each
    vendor typically adds its own set of commands, called extensions, to the base,
    standard SQL commands.


    If you have MySQL installed and the mysql server started, then you can try some
    of the commands you see here. You start the mysql client at your system prompt.
    The following line starts the mysql client with the test database; one of the
    tables is named Staff:


    ```

    C> mysql test

    Welcome to the MySQL monitor. Commands end with a ;

    ..

    ...

    mysql>

    ```'
