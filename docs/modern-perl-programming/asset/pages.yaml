  md: "# 5.1.1 Hashes as dual arrays\n\nIf you were tasked with determining the frequency\
    \ counts of words in a file, you might proceed with the following logic:\n\n```\n\
    create a word table\ncreate a frequency table\nwhile(there's another word)\n{\n\
    \    if it's not in the word table\n        add it to the word table\n    add\
    \ one to the count table for this word\n}\nforeach word you have found\n{\n  \
    \  print the word and print the count\n}\n```\n\nFor each word in the input file,\
    \ we place it in an array of words and then add to a counter for that. This requires\
    \ two arrays: one for the words and one for the counts. Here's the Perl code to\
