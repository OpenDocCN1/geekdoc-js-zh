    print $data[1];               # prints 5

    ```


    Every array also has a scalar associated with it whose name is $$array the array
    @data, this variable is named $$data. The value of this variable is the highest-script
    in the array. Thus, for @data, $$data has the value 6. You may use this fact to
    retrieve the last element of an array.


    ```

    print $data[$data];           # prints 7

    ```


    Perl also you subscript an array from the bottom element simply by using negative
    subscripts.


    ```

    print $data[-1];               # prints 7

    print $data[-2];               # prints 5

    ```


    # 4.1.4 Arrays and lists


    A list is a set of elements enclosed in parentheses. Thus, an array is really
    a named list. As you have seen, you can assign one array to another:


    ```

    @vals = @data;

    ```


    You may also assign an array to a list:


    ```

    ($a, $b, $c) = @data;

    ```


    The assignment saves you the trouble of coding the following:


    ```

    $a = $data[0];

    $b = $data[1];

    $c = $data[2];

    ```


    Here are a few other examples of arrays and lists:


    ```

    ($a, $b) = ($b, $a);           # exchange $a, $b

    ($first, @a) = @a;           # $first = shift(@a);

    ```'
