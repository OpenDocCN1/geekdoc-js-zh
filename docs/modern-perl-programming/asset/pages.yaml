  md: "# Updating Files\n\n```\n$date = system(\"date\");\n$date = \"date\";\n```\n\
    \n# 9.4 Updating Files\n\nEarlier in this book, we spoke of opening files for\
    \ either reading or writing. Although we also mentioned how to open files for\
    \ both reading and writing, we did not show how that was accomplished. In this\
    \ section, we will show an example of updating a file. We first mention a few\
    \ system-like calls that allow the user to gain information about processing a\
    \ disk.\n\n# 9.4.1 tell\n\nAs you read data from a file, the operating system\
    \ maintains a pointer into that file so it can fetch data from the correct place\
    \ for future reads. Likewise, when you are writing data into a file, the operating\
    \ system maintains a pointer into that file so writes to the file will be placed\
    \ just beyond the previous write. The tell function tells you where, as a byte\
    \ offset from the beginning of a file, you are in a file. The function takes one\
    \ argument, a filehandle. If the filehandle is omitted, tell works on the last\
    \ file that was read. Here is an example of how the tell function works:\n\n```\n\
    #!/usr/bin/perl\n#\n# tellme.pl\n#\nopen(DISK, \"> diskfile\") || die \"can't\
    \ open diskfile\\n\";\nprint \"Before first write: pos \", tell(DISK), \"\\n\"\
    ;\nwhile(1) {\n\tprint \"Enter some data: \";\n\tchomp($data = <STDIN>);\n\tlast\
    \ if ($data eq quit);\n\tprint DISK \"$data\\n\";\n\tprint \"Next write at pos\
    \ \", tell(DISK), \"\\n\";\n}\nprint \"Diskfile is \", tell(DISK), \" bytes in\
    \ length\\n\";\n```\n\n```\n# tellme.pl\nBefore first write: pos 0\nEnter some\
    \ data: the first line of data\nNext write will be at pos 25\nEnter some data:\
    \ now the next\nNext write will be at pos 41\nEnter some data: quit\nDiskfile\
    \ is 41 bytes in length\n%\n```"
