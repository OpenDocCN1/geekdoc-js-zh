    #  14.5.1 Top-level windows


    A top-level window allows for the creation of additional “windows” in an application.
    These additional windows are standalone windows. They can be created as needed
    to fit whatever “screens” your application needs. Top-level windows are created
    with the Toplevel method.


    Suppose your application needs to obtain some information about a user. You could
    make the following screen appear at the pressing of a button (see Figure 14.20).
    The main screen would appear as shown in Figure 14.21. When the Next-Screen-button
    is pressed, the GUI in Figure 14.20 is displayed.


    ![](img/74431d7901809922ce9b915cecff17c7_301_1.png)


    **Figure 14.21** A top-level window.'
