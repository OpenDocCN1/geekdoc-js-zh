  md: "# # CHAPTER 9\n ACCESSING SYSTEM RESOURCES\n\nThis section examines the functions\
    \ that are built into the operating system. Since Perl comes from Unix, there\
    \ is a strong Unix flavor to these functions. Many of them have been implemented\
    \ on Windows so that they have a consistent behavior regardless of the operating\
    \ system. However, this is not possible with all of the functions. When there\
    \ is a difference, it will be pointed out.\n\n# ## 9.1 Introduction\n\nFrom the\
    \ beginning of this book, we have been using builtin subroutines. These are subroutines\
    \ that are built into the Perl executable. Examples of these are open, print,\
    \ split, join, etc. In the previous chapter, we saw how to write our own subroutines.\
    \ We also saw subroutines from the Perl standard library. In this section, we\
    \ will look at another class of functions: those that are built into the operating\
    \ system. These are referred to as system calls because they give you access to\
    \ operating system resources such as the filesystem. Since there will always be\
    \ a strong tie between Perl and Unix, some of these calls work only on Unix, or\
    \ they may work on both Unix and Windows, but deliver slightly different information.\
    \ Where that is the case, we will point it out. If the reader has programmed in\
    \ C, many of these calls will be familiar.\n\n# ## 9.2 File and Directory System\
    \ Calls\n\nThere are a number of important system calls involving directories\
    \ and files that can be useful in a wide variety of Perl scripts. These functions\
    \ will be demonstrated with a series of programs."
  merge: -1
  pgno: 180
- img_proc: true
  md: "# 9.2.1 mkdir\n\nYou can create a directory in Perl using the mkdir system\
    \ call. mkdir takes a directory and a set of permissions for the directory. The\
    \ permissions may only be meaningful on Unix-derived systems. mkdir returns a\
    \ 1 on success and a 0 on failure. Here are a few examples of using this system\
    \ call:\n\n```\nmkdir($ARGV[0],0755) || die \"$!\\n\";nmdir(\"mydirectory\",0700)\
    \ || die \"$!\\n\";\n```\n\nIf the mkdir fails, the value 0 is returned and the\
    \ die function executes. It's your choice to whether you wish the program to terminate\
    \ or not. You could also write the code as follows:\n\n```\n#!/usr/bin/perl\n\
    #\n# mkdir.pl\n#\nprint \"Enter directory name \";\\chomp($dirname = <STDIN>);\n\
    while ($result = mkdir($dirname)) == 0) {\n    print \"$!\\n\"; # error message\n\
    \    print \"Enter directory name \";\n    chomp($dirname = <STDIN>);\n}\nprint\
    \ \"Created $dirname\\n\";\n```\n\n# 9.2.2 chdir\n\nThe chdir command requires\
    \ one argument, the directory to which you wish to change. This call also returns\
    \ the value 1 on success and the value 0 on failure. In a program, you need to\
    \ toggle between two directories. The small program below is a variation of one\
    \ that we have seen previously:\n\n```\n#!/usr/bin/perl\n#\n# wereto.pl\n#\nuse\
    \ Cwd;\n$cwd = getcwd();\nprint \"Current dir is $cwd\\n\";\nprint \"Change to\
    \ which directory? \";\nchomp($newdir = <STDIN>);\nchdir($newdir);\n```\n\ncontinued..."
