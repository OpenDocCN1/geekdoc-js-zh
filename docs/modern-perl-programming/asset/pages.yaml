    # 11.3.1 Information hiding


    Although the above code works fine, there are a few problems with it. First, it
    is cumber-some to use all of the punctuation symbols to satisfy the syntax requirements
    of Perl. Sec-ond, it places a burden on the writer the writer must be familiar
    with the field names. For example, see if you can determine why the code below
    would produce incorrect results:


    ```

    use Student;

    @courses = (Calc, Trig, DiffE);

    $ss1 = new Student (Mike, Math, @courses);

    print $ss1{name}, "\n";nprint $ss1->{name}, "\n";nprint "@${ss1->{COURSES}}",
    "\n";nprint @ss1->{COURSES}[0], "\n";

    ```


    The developer misspelled the last two indices. They should be COURSES, not COURSE.
    Users of the Student .pm file, that is, users of the Student class, should not
    have to worry about any information inside the Student .pm file, let alone the
    spelling of keys.'
