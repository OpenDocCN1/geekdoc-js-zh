  md: 'If the above code had been written as:


    ```

    use strict qw(vars);               # or use strict

    $msgtext = "start ";

    $msgtext . = "middle";      # wrong spelling

    print "$msgtext\n"

    ```


    then the above code would have yielded the following error message:\Global symbol
    $msgtext requires explicit package name at strict line 2

    Global symbol $msgtext requires explicit package name at strict line 3

    Global symbol $msgtext requires explicit package name at strict line 4


    This error message will alert you to the fact that the first line of code has
    a misspelling in the variable name. The code should have been written as:


    ```

    use strict qw(vars);               # or use strict

    my $msgtext;

    $msgtext = "start ";

    $msgtext . = "middle";

    print "$msgtext\n"

    ```


    # 16.6.3 strict refs


    The improvements in Perl 5 was the introduction of hard references.


    ```

    $var = 20;               # a variable

    $ref = \$var;                        # a hard reference

    print $ref;                           # access $var through reference

    ```


    Prior to this, Perl references were known as soft references and were difficult
    to debug.


    ```

    $var = 20;               # a variable

    $ref = "var";                        # store name of variable

    print $ref;                           # prints var

    print $ref;                           # prints 20

    ```


    In Perl, soft references can be made more than one level, increasing the difficulty
    in debugging. If you code:


    ```

    use strict qw(refs)       # or use strict

    ```


    then soft references are prohibited.'
