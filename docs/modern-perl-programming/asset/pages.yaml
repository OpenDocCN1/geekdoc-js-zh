  md: '# 8 Chapter 1 • A Tutorial Introduction to Perl


    The @numbers array contains a series of numbers. The @names array contains a series
    of strings. If any of these strings contains a blank, a newline, or a tab, it
    needs to be protected using quotes. Note also that an array, such as @record,
    may contain disparate types each of them is a scalar. The important thing is that
    an array is a list of scalars. If you need to know the size of an array, simply
    assign the array to a scalar.


    ```

    $size = @record;           # size = 4

    $size = @numbers      # size = 6

    $size = @names;        # size = 3

    ```


    An important property of Perl arrays is that they are dynamic. This is a departure
    from other languages, but it is a very useful feature.


    ```

    @numbers = (80, @numbers, 90);

    $size = @numbers;      # size = 3

    ```


    If you need to access a particular scalar in an array, then you must index the
    element with a subscript using square bracket notation, [ ]. Perl indices begin
    with 0. Here are a few examples:


    ```

    @record = ("Mike", 27, .324, "Columbia, Md");

    print "$record[0]\n";    # Mike

    print "$record[1]\n";    # 27

    ```


    An entire array can be printed by placing double quotes around the array''s name.
    This prints each element of the array with a space separating the elements. This
    is generally the way you want to see array values displayed:


    ```

    print "@record\n";           # mike 27 .324 Columbia, Md

    ```


    If you want the array elements adjacent to one another, simply omit the quotes:


    ```

    print @record;               # mike27.324Columbia, Md

    ```


    Note also that anything in single quotes will print literally::


    ```

    print ''@record'';               # @record

    ```'
