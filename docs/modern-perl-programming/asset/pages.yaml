    # 3.1.3 Modulus (remainder) operator


    The modulus operator, %, gives you the remainder when you divide one number by
    another. This can be used in a variety of problems. For example, to determine
    if a number is divisible by 10, you might code as follows:


    ```

    print "$num divisible by 10\n" if ($num % 10 ) == 0);

    ```


    Here, the remainder of dividing $num by 10 is compared against 0. Incrementally,
    the precedence of the % operator is higher than the precedence of the numerical
    equality operator, ==, and thus you might have coded the above as:


    ```

    print "$num divisible by 10\n" if ($num % 10) == 0);

    ```


    Finally, since we are using the modifier form of if, the parentheses surrounding
    the if conditional are also unnecessary.


    ```

    print "$num divisible by 10\n" if $num % 10 == 0;

    ```


