  md: "# Returning Values from Subroutines\n\nRemember that typeglobs are synonyms.\
    \ Thus, inside the function, F is just another name for whatever typeglob was\
    \ passed to the function.\n\n# Returning Values from Subroutines\n\nAlthough we\
    \ have already seen examples of subroutines that return a value, we will give\
    \ the details in this section. Without an explicit return statement, a Perl subroutine\
    \ always returns the last evaluated expression. All Perl subroutines return a\
    \ value. It must also be pointed out that on some occasions, the returned value\
    \ is ignored.\n\n# 7.3.1 Returning a scalar\n\nSubroutines can return any type\
    \ of value. The subroutine below returns a scalar which represents the larger\
    \ value of the two arguments sent to it:\n\n```\n#!/usr/bin/perl\n#\n# bigger.pl\n\
    #\nsub bigger\n{\n  $_[0] >= $_[1] ? $_[0] : $_[1];\n}\nprint \"Enter two numbers\
    \ \";\nchomp($_ = <STDIN>);\n($sa, $b) = split;\nprint bigger($sa, $b), \"is larger\\\
    n\"\n\n% bigger.pl\nEnter two numbers 5 10\n10 is larger\n%\n```\n\nNote that\
    \ we have used a conditional expression. Therefore, the last expression evaluated\
    \ is either $_[0] or $_[1]. In this example, it's fine to use elements of @ directly\
    \ since you are not changing them.\nIf you are debugging a subroutine using print\
    \ functions within the subroutine, be careful where you place your print statement.\
    \ Notice what happens if we add a print statement to the subroutine above:\n\n\
    ```\n#!/usr/bin/perl\n#\n# bigger2.pl\n#\nsub bigger\n```\n\ncontinued..."
