  md: '# 16.8.3 The hex and oct functions


    The hex function takes an argument that is interpreted as a hexadecimal string
    and returns the equivalent decimal value. In other words:


    ```

    a = hex(100);

    print "$a\n"; # 256;

    ```


    The oct function takes a string that is interpreted as an octal sequence and returns
    the equivalent decimal value:


    ```

    a = oct(100);

    print "$a\n"; # 64

    ```


    # 16.8.4 pack and unpack


    Some applications require the preparation or reception of data that must be in
    a special format. Perl handles these situations by preparing this data with the
    pack function and reading this data with the unpack function. We''ve seen a few
    examples of these packs already. Now we will give several:


    pack takes a list of values and packs it into a binary structure according to
    a format given as its first argument. It also returns the string containing that
    structure. The format string is a sequence of characters that gives the order
    and type of value.


    unpack does the reverse. These two functions have a myriad of special uses in
    Perl. Here are two examples of pack:


    ```

    $name = pack("cccc",77,73,75,69);

    print "$name\n"; # prints MIKE

    $name = pack("c4",77,73,75,69);

    print "$name\n"; # prints MIKE

    $name = pack("c4xc2",77,73,75,69,83,ord(" "));

    print "$name\n"; # prints MIKE S.

    ```


    Each format applies to the value in the list. As you can see, c4 is equivalent
    to cccc. An x places a null byte into the output string. We also used the function
    to place the value of the period into the pack function.


    The above examples merely show how to use the pack function. The next example
    shows how to write a series of integers in binary to an external file. The program
    creates ARGV[0] many random integers in the range 0 to 10000 and writes each one
    to a file. Of course, the file is not displayable as a text file. To display the
    values in the file, we need to use the read function to read each integer from
    the file. Then we use the unpack function to extract the integer into a Perl variable.'
  merge: -1
  pgno: 348
