  md: "memory. That is why the last print in the program is never executed. The program\
    \ performing the exec never returns.\n\n# 9.3.2 fork and wait\n\nThe Perl program\
    \ above was offered to explain how exec works. In reality, it would be rare if\
    \ a program performed the exec as it did done above. You do not simply dismiss\
    \ a program in the middle of its execution.\n\nexec usually works in connection\
    \ with the fork system call. fork creates a child process, which is a clone of\
    \ its parent. One would use a fork and then exec a process in the child.\n\nThe\
    \ exceeded process and the parent run at control of the operating system scheduler.\
    \ The parent process can wait for the child to terminate by executing the wait\
    \ system call. Not all operating systems allow fork. Some versions of Windows\
    \ allow fork, while other versions do not.\n\nThe difficult part to understand\
    \ about fork is that at the instant it is executed, there is a second process\
    \ that is created. The value returned by fork may be used to see which is the\
    \ parent and which is the child. The operating system arranges to return zero\
    \ to the child process, while in the parent, the returned value from fork is some\
    \ value greater than zero. On Unix, the value is the child process identification\
    \ number. This may not make sense for all operating systems.\n\nHere's a program\
    \ that uses fork, exec, and wait:\n\n```\n#!/usr/bin/perl\n# fork.pl\n#nrequire\
    \ \"ctime.pl\";\nif ($x = fork) {\n    $date = ctime(time);\n    print \"Parent\
    \ Waits at $date\"\n    wait;\n    $date = ctime(time);\n    print \"Parent returns\
    \ at $date\";n} else {\n    print \"Child executes dir in 2 seconds\\n\"\n   \
    \ $date = ctime(time);\n    print \"child sleeps at $date\"\n    sleep 2;\n  \
    \  $date = ctime(time);\n    print \"child starts dir at $date\"\n    exec \"\
    dir /B\";\n}\n```\n\nprint \"parent continues at \", ctime(time);\n\ncontinued..."
