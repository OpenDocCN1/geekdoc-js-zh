  md: "# Other Widgets\n\n# 267\n\n![](img/74431d7901809922ce9b915cecff17c7_288_0.png)\n\
    \nFigure 14.12 An entry widget.\n\n# 14.4.1 The Entry widget\n\nThis widget is\
    \ used to input a line of text. This is an important widget since it provides\
    \ a simple way of getting input to your program. You can assign the text to a\
    \ variable using:\n\n```\nmainWindow->Entry (-textvariable => \\comments );\n\
    ```\n\nWe might use this widget to get some information, such as a filename, from\
    \ the user. Then, we could display the file in a GUI component as a text widget.\
    \ For now, we will display the file on the console. Later, when we have learned\
    \ about widgets, we can display the file in a text area. See Figure 14.12 for\
    \ the rendering of the GUI.\n\nThe code producing this GUI will follow. When the\
    \ user enters some data in the entry widget, the $filename contains this data.\
    \ When the user selects the Display File button, the contents of this variable\
    \ are opened as a file. The file is displayed on the console. When the user selects\
    \ the Clear Entry Area button, this variable is set to the empty string, clearing\
    \ the entry widget's contents.\n\n```\n#!/usr/bin/perl\n#\n# viewer.pl\n#\nuse\
    \ Tk;\nsub display {\n    open(THISFILE, \"$filename\") || die;\n    print while(<THISFILE>);\n\
    \    close(THISFILE);\n}\nsub clear {\n    $filename = \"\";\n}\nmy $mw = MainWindow->new;\n\
    $mw->title(\"My Viewer!\");\n$mw->Label (-text => 'Enter File Name and Select\
    \ Display ') ->pack;\n$mw->Entry (-textvariable => \\$filename) -> pack;\n```\n\
    \ncontinued..."
