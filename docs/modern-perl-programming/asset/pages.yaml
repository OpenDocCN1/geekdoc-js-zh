  md: '# Inheritance


    # 11.4 Inheritance


    The bless function gives more information to a reference. It forces the reference
    to be of a type, Student in this case. This has several uses in Perl as we shall
    see. Using "public" methods to access "private" data is not the only benefit of
    the OO approach. Another important principle, inheritance, is the cornerstone
    of object orientation.


    Inheritance is one of the principle ways of implementing code reuse. Like all
    powerful features, it should only be used when necessary. Inheritance implements
    the "is-a" relation. The following are examples of inheritance relationships:


    +   * A Directory is a type of File.

    * A Manager is a type of Employee.

    * A Car is a type of MovingVehicle.

    * A Circle is a Shape.


    In the File/Directory relationship, we say that File is the superclass and Directory
    is a subclass. Likewise, Shape is the subclass and Circle is a subclass. C++ programmers
    tend use the words base class and derived class for superclass and subclass, respectively.


    If we already have a File class, we should not have to build the Directory class
    from scratch. Since a Directory is a File, any Directory object should be able
    to reuse (without rewriting) all of the File methods.


    To illustrate inheritance, suppose that we have a special kind of student, a GradStudent.
    For simplicity, let''s say GradStudent is a Student with a salary. The GradStudent
    class needs to specify that it is a derived class of Student. This is done by
    using the special ISA array, as you will see below. Any GradStudent object can
    reuse all methods defined in the Student package.


    GradStudent must implement a constructor and possibly a destructor, and any incremental
    behavior that specializes a GradStudent, such as getsalary, and setsalary.


    # 11.4.1 SUPER


    The constructor for a derived class can call its parent class constructor by using
    the keyword SUPER. Here is the constructor for a GradStudent. Notice how SUPER
    is used in the new method in the file GradStudent.pm:'
  merge: -1
  pgno: 232
- img_proc: true
  md: "# Chapter 11 • Object-Oriented Programming\n\n```\n#\n# GradStudent.pm\n#\n\
    package GradStudent;\nuse Student;\n#\n# The next line tells Perl that\n# GradStudent\
    \ is derived from Student\n#\nISA=qw(Student);\n# GradStudent's new\n#\nsub new\n\
    {\n    my $pkg = shift;\n    my ($name, $major, $salary, @subjs) = @_;\n\n   \
    \ # Call new in the SUPER (Student) class\n    # In the line, $pkg == GradStudent\n\
    \n    my $obj=$pkg->SUPER:new($name, $major, @subjs);\n    $obj->{'SALARY'} =\
    \ $salary;\n}\nsub salary\n{\n    my ($pkg) = shift;\n    @_ ? $pkg->{SALARY}\
    \ = shift : $pkg->{SALARY};\n}\n```\n\nWhen a new GradStudent is created, the\
    \ data for it is passed to the new constructor in the same way that a Student's\
    \ constructor is called. Then, there is a call to the Student constructor. It\
    \ is necessary for the GradStudent constructor to call the Student constructor\
    \ to construct the Student portion of the GradStudent.\n\n```\nmy $obj=$pkg->SUPER::new($name,\
    \ $major, @subjs);\n```\n\nThe line above calls the new method in the Student\
    \ class in such a way that the first argument in the call is GradStudent. This\
    \ is because GradStudent is the value of $pkg. When Student::new returns, the\
    \ returned reference has been blessed as GradStudent, not as a Student. Finally,\
    \ the salary field is added to the reference and the reference is returned."
