    # 10.1.4.1 A relaxed notation. It should also be noted that Perl allow other notations
    that are more pointer-friendly for the dereferencing of both arrays and hash references.
    Suppose we have the following:


    ```

    @data = (10,20,30,40);

    $rdata = \@data;

    ```


    We have seen above to retrieve an element of the array @data through the reference
    $$rdata, you can code:


    ```

    $$rdata[0];

    ```


    However, there is another notation that is more pointer-friendly:


    ```

    $rdata->[0];

    ```


    Just be careful; when you use this notation, you should refrain from using quotes
    in expressions such as:


    ```

    print "$rdata->[0]\n";

    ```


    because the -> will not be meaningful within single or double quotes.


    There is also an alternative notation for hash references so that if you have
    a hash such as:


    ```

    %states = (

    MD => Annapolis,

    CA => Sacramento,

    NY => "New York City"

    );

    ```'
