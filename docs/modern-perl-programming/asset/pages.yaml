  md: '# 14.2.2 grid


    The grid() method is used to place widgets in rows and columns. Each call to grid()
    creates a new row. The first widget in a row invokes the grid() method. Remaining
    widgets for the row are grid() arguments. Various arguments control positioning
    features. Here is the code that produces Figure 14.5:


    ```

    #!/usr/bin/perl

    #

    # grid1.pl

    #

    use Tk;

    my $mw = MainWindow->new;

    $button1 = $mw->Button(-text => "Open");

    $button2 = $mw->Button(-text => "Close");

    $button3 = $mw->Button(-text => "Save");

    $button4 = $mw->Button(-text => "Exit");

    $button1->grid($button2,$button3,$button4);

    $button5 = $mw->Button(-text => "Find");

    $button6 = $mw->Button(-text => "Replace");

    $button5->grid($button6,"","-","sticky => "nse");

    MainLoop;

    ```


    In the GUI, the Replace would have been rendered underneath the Close button,
    but each "-" specifies the button should occupy an extra position. The button
    would have been centered within these three positions, except that the sticky
    option fills the entire set of positions:


    $button5->grid($button6,"","-","sticky => "nse");


    ![](img/74431d7901809922ce9b915cecff17c7_281_0.png)


    Figure 14.4 pack with options.


    ![](img/74431d7901809922ce9b915cecff17c7_281_1.png)


    Figure 14.5 Using grid.'
  merge: -1
  pgno: 281
