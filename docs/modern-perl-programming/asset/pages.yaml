  md: "# Chapter 7 • Subprograms\n\n```\n# squares.pl\nNumber of arguments: 5\nFirst\
    \ arg: 5\nLast arg: 12\nOriginals: 5 10 3 8 12\nResults: 25 100 9 64 144\n```\n\
    \nThe values passed to the function are stored in the array @_. Once inside the\
    \ function, we use @_ in various ways for the purpose of showing you a few standard\
    \ Perl idioms.\nDo not confuse $_ with $[0]. The former is the default input variable\
    \ and default pattern matching, while the latter represents the first element\
    \ of the array @.\nAlthough it's not apparent in this example, it is not a good\
    \ idea to alter any value in the @array as this will alter an argument passed\
    \ to the subroutine. To see how an error could occur, examine the following code\
    \ carefully:\n\n```\n#!/usr/bin/perl\n#\n# factorial.pl\n#\nsub factorial\n{\n\
    \  $result = 1;\n  while($[0] > 1) {\n    $result *= $[0];\n    $_[0]--;\n  }\n\
    \  return $result;\n}\nprint \"Enter a number \";\nchop($number = <STDIN>);\n\
    $answer = &factorial($number);\nprint \"factorial is $answer\\n\";\n```\n\n```\n\
    # factorial.pl\nEnter a number 5\n1 factorial is 120\n```\n\nThe program changes\
    \ $[0], which is a reference to $number. Thus, $number is changed as well. Most\
    \ programming languages have pass by value mechanism in which a copy of each argument\
    \ is saved in a parameter. But the Perl mechanism of passing arguments to functions\
    \ has no parameter list, so the programmer must simulate it. It is standard practice\
    \ in Perl to store arguments in local variables.\nThis is made possible by using\
    \ my, a function that localizes a variable, or local, a Perl remnant that is still\
    \ useful."
