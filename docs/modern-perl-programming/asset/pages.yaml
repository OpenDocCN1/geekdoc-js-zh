  md: "# 6.4 Anchoring Patterns\n\nIf you wanted to match a string that contained\
    \ only digits, then the pattern above is probably not what you intended. For example,\
    \ if you asked the user for a number, you would expect responses such as the following\
    \ rather than those above:\n\n-256 +256 345\n\nTo solve this problem, we need\
    \ to demonstrate how to anchor a match to certain boundaries. The caret character\
    \ (^) allows you to match a pattern if it is at the beginning of a string. The\
    \ $ character allows you to match a pattern if it is at the end of a string.(Note\
    \ that a newline must be matched explicitly.) Finally, the \\b sequence allows\
    \ you to match a string at a word boundary.\n\n```\n/this/               # at\
    \ beginning of string\n/this$/              # at end of string\n/this/       \
    \        # anywhere in the string\n/\\bthis\\b/          # if a word\n/^this$/\
    \            # only if line contains 'this'\n```\n\nThe code below asks the user\
    \ for an integer and then checks the result with a regular expression. If the\
    \ user's input is not an integer, the program asks the user to re-enter the integer.\
    \ Eventually, the number of attempts for a correct match is printed.\n\n```\n\
    #!/usr/bin/perl\n#\n# integers.pl\n#\nprint \"Enter a number \";\n$count = 1;\n\
    while (1) {\n  $_ = <STDIN>;\n  chop;\n  last if =~ /^[-+]?[0-9]+$/;\n  print\
    \ \"$count is not a number, Re-enter \";\n  $count++;\n}\nprint \"$count tries\
    \ to enter a number\\n\"\n\n# integers.pl\nEnternEnter a number a\na number is\
    \ not a number, Re-enter seven\nseven is not a number, Re-enter 23.45\n23.45 is\
    \ not a number, Re-enter 23\ntries to enter a number\n%\n```"
  merge: -1
