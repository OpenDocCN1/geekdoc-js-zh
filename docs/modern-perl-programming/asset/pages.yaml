  md: "# 168\n\n# Chapter 9 • Accessing System Resources\n\nThere are several things\
    \ to notice. Before you write any data to the file, you are positioned at the\
    \ beginning of the file. tell tells you that you are at 0. When you are at the\
    \ end of the file, tell returns the file size. If you attempt to tell on a closed\
    \ filehandle, -1 is returned.\n\n# 9.4.2 seek\n\nThere are many applications where\
    \ you must perform both reads and writes on the same file. The classic example\
    \ is when you are updating a file; that is, you are perhaps changing a date or\
    \ name for certain records. In these situations, you must first read a record,\
    \ to see if it needs to be changed, make the change on the in-memory copy of the\
    \ record, and then write the changes to the disk. We will assume that the records\
    \ are actual lines.\n\nIn problems like these, once you have read a record, you\
    \ are positioned at the end of the record. You must move the file pointer back\
    \ to the beginning of the record before you do the writing of the in-memory modified\
    \ record.\n\nPerl provides the seek function to move the file pointer. This function\
    \ takes three arguments: a filehandle, an offset, and an origin. The pointer for\
    \ the filehandle is offset number of bytes from the origin. The origin is given\
    \ as an integer: 0, 1, or 2, representing the beginning position, the current\
    \ position, and the end position of the file. Here are a few examples:\n\n```\n\
    open(DISK, \"+<\") || die;      # open for read and write\nseek(DISK, 0, 0); \
    \              # seek 0 bytes from origin\n                               # i.e.,\
    \ rewind\nseek(DISK, 0, 2);               # seek 0 bytes from end\n          \
    \                     # i.e., move to end of file\nseek(DISK, -30, 1);       \
    \       # seek 30 bytes toward the\n                               # the beginning\
    \ of the file\n                               # from current position\n```\n\n\
    In some problems, you may need to read a data file more than once. You may always\
    \ close the file and reopen it, but it is more efficient to seek back to the beginning\
    \ of the file. In the following example, search.pl uses the command line argument.\
    \ The program displays lines from a file that contains those words. Every time\
    \ a search is made for the next word, the input file needs to be \"rewound.\"\n\
    \n```\n#!usr/bin/perl\n#\n# search.pl\n#\ndie \"usage: inputfile patterns...\\\
    n\" unless $ARGV >= 1;\nopen(DISK, \"<ARGV[0]\") || die \"can't open datafile\\\
    n\"\n```\n\ncontinued..."
