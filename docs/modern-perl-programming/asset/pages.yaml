  md: "# 7.3 Returning Values from Subroutines\n\nHere is a version of the subroutine\
    \ that determines the correct number of arguments was supplied. In this case,\
    \ we decided to exit, but that choice is ultimately yours.\n\n```\nsub bigger\n\
    {\n    if ( @_ != 2 ) {\n        print STDERR \"bigger: wrong number of args\\\
    n\";n        exit;\n    }\n    $_[0] >= \\$[1] ? \\$[0] : \\$[1];\n}\n```\n\n\
    It should also be pointed out that Perl is very permissive about how values are\
    \ sent to subroutines. Each of the following is a correct way of sending arguments\
    \ to bigger:\n\n```\n# send the first and last elements\n# of the @data array\
    \ to the subroutine\n@data = (5,10,20,30,8,50);\n\\$x = bigger(@data[0,-1]);\n\
    print \\$x; # prints 50\n#nsplit \\$_ on whitespace and thus\n# send the list\
    \ (10 20) to the subroutine\n#n\\$_ = \"10 20\";n\\$x = bigger(split);\nprint\
    \ \\$x; # print 20\n\\$a = 10;\n\\$b = 50;\n#nsend two simple expressions to the\
    \ subroutine\n#n\\$x = bigger(\\$a + 20, \\$b - 25);\nprint \\$x; # prints 30\n\
    ```\n\n# 7.3.2 Returning an array\n\nYou can also write subroutines that return\
    \ arrays. Here’s an example of a subroutine that returns a two-element array consisting\
    \ of the mean and standard deviation of a set of numbers. The subroutine adds\
    \ the entries and divides by the number to get the mean. The standard deviation\
    \ is a little more complex. You need to compute the sum of the squared differences\
    \ between the mean and each data item. Finally, you need to take the square root\
    \ of this mean divided by less number of items. (It’s more complicated to express\
    \ this idea in English than it is to write the code in Perl.)"
