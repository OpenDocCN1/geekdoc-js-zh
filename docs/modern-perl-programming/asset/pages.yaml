  md: "# 10.4 Collections of Records\n\nA record is a set of related data fields.\
    \ For example, name, address, phone number, etc. is a set of fields which, when\
    \ taken together, forms a payroll record. Keep in mind that Perl not have any\
    \ formal treatment of records; thus, the programmer must be creative. Most programmers\
    \ keep track of records by using anonymous hashes. If you are a C programmer,\
    \ you will appreciate the similarity between record creation in C and Perl. The\
    \ C approach might be:\n\n```\nstruct record {\n    char name[100];\n    int age;\n\
    };\\ypef struct record RECORD;\nRECORD create(char *name, int age)\n{\n    RECORD\
    \ r;\n    strcpy(r.name, name);\n    r.age = age;\n    return r;\n}\nmain() {\n\
    \    struct record a,b;\n    a = create(\"Mike\",54);\n    printf(\"%s %d\\n\"\
    , a.name, a.age);\n}\n```\n\nIn Perl, the record would be constructed as:\n\n\
    ```\nsub create {\n    my ($name,$age) = @_;\n    my $rec = {\n        name =>\
    \ $name,\n        age => $age\n    };\n    return $rec;\n}\n$a = create(\"Mike\"\
    ,54);\nprint $a -> {name}, \"\\n\";nprint $a -> {age}, \"\\n\";\n```\n\ncreate\
    \ is a function that takes its input and inserts it into a hash keyed by two meaningful\
    \ fields: name and age. The important issue is that the hash is anonymous, and\
    \ thus, the result is stored in a reference. When the subroutine returns this\
    \ reference, the \"record\" is created."
