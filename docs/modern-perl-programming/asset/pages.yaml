  md: "```\n#!/usr/bin/perl\n#\n# stats.pl\n#\nsub statistics\n{\nmy $mean = 0;\n\
    my $dev = 0;\nmy(@results)\nforeach $item (@_) {\n  $mean += $item;\n}\nmy $mean\
    \ /= @;\nforeach $item (@_) {\n  $dev = $dev / ($item - $mean) ** 2;\n}\n$dev\
    \ = sqrt($@ - 1));\npush(@results, $mean, $dev);\n@results;\n}\nprint \"Enter\
    \ some numbers \";\\chomp(_) = <STDIN>;\n@data = split;\n($mean, $sd) = statistics(@data);\n\
    print \"MEAN = $mean, SD = $sd\\n\"\n# stats.pl\nEnter some numbers 10 11 12 13\
    \ 14 15\nMEAN = 12.5, SD = 1.8708269338697\n```\n\nThe return statement in the\
    \ subroutine is coded as:\n\n```\n@results;\n```\n\nbut it could also have been\
    \ coded as:\n\n```\nreturn @results;\nreturn ($mean, $dev);\n($mean, $dev);\n\
    ```\n\nIn the last two lines above, the parentheses are necessary. Without them,\
    \ the expressions are evaluated with the comma operator in a scalar context, thus\
    \ yielding the last item:\n\n```\nreturn $mean, $dev;\n# returns $dev\n$mean,\
    \ $dev;\n# returns $dev\n```"
