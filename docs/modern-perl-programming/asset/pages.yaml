  md: "# Chapter 7 • Subprograms\n\nIn this case, the identities of a1 and r1, and\
    \ alike a2 and r2, are the same through the argument/parameter relationship. Since\
    \ my feature was added to Perl in Perl 5, you must use type globs. Inside the\
    \ subroutine, @a1 and @a2 can be referenced using @r1 and @r2, respectively. Note\
    \ that two globs must be sent to the function rather than arrays:\n\n```\n@lengths\
    \ = lengths(*a1, *a2); # correct\n@lengths = lengths(@a1, @a2); # incorrect\n\
    ```\n\nTypeglobs must be used in connection with filehandles in certain cases.\
    \ Filehandles are not first-class citizens; that is, there are certain operations\
    \ that are disallowed by filehandles. For example, you cannot assign a filehandle\
    \ or create a local one. Since filehandles don't have their own prefix (such as\
    \ $, %, &, @), Perl thinks they are constants in situations as:\n\n```\nlocal\
    \ (FH);\nFH1 = FH2;\nfun(FH);\n```\n\nIf you need to parameterize a filehandle,\
    \ a typeglob is necessary. Here’s an example of sending a filehandle to a function:\n\
    \n```\n#!/usr/bin/perl\n#\n# handles.pl\n#\nsub process\n{\n    local (*F) = @_;\n\
    \    my $ct = 0;\n    $ct++ while(<F>);\n    $ct;\n    print \"Enter a filename\
    \ \";\n    chomp($fn = <STDIN>);\n    print \"processing $fn\\n\";\n    open(HANDLE1,\"\
    $fn\") or die;\n    $lc = process(*HANDLE1);\n    print \"$fn contains $lc lines\\\
    n\";\n    print \"Enter another filename \";\n    chomp($fn = <STDIN>);\n    print\
    \ \"processing $fn\\n\";\n    open(HANDLE2,\"$fn\") or die;\n    $lc = process(*HANDLE2);\n\
    \    print \"$fn contains $lc lines\\n\";\n```"
