  md: "# 1.7 Writing Your Own Functions\n\nFunctions are typically written once and\
    \ stored in a library so that they can be used in a wide variety of programs.\
    \ Later in the book, we will demonstrate how that can be done. For now, we will\
    \ assume that any function you write be coded at the beginning of the file in\
    \ which you wish to use the function. Perl functions are defined with the word\
    \ \"sub\", fol- by the name of the function, followed by a pair of curly braces\
    \ that enclose the body of the function.\n\n```\nsub functionname\n{\n    body\
    \ of function\n}\n```\n\nTo invoke a Perl function, give the name of the function\
    \ preceded by the & symbol. If the function has arguments, list them within a\
    \ set of parentheses following the function name. Inside the function, the arguments\
    \ are accessed through the special Perl builtin array @_. Here's an example that\
    \ demonstrates a function that sums the elements of the array passed to it. Note\
    \ that we've just given the bare essentials of writing your own functions. Later,\
    \ we will have more to say about this topic.\n\n```\n#!/usr/bin/perl\n#\n# function.pl\n\
    #\nsub total\n{\n    $sum = 0;\n    foreach $item (@)\n    {\n        $sum +=\
    \ $item;\n    }\n    return $sum;\n}\n@datal = (1,2,3,4);\n$result = total(@datal);\n\
    print \"Sum of @datal is $result\\n\";\n@data2 = (1,2,3,4,5);\n$result = total(@data2);\n\
    print \"Sum of @data2 is $result\\n\";\n$result = total(@datal, @data2);\nprint\
    \ \"Sum of @datal and @data2 is $result\\n\";\n\n% funcs.pl\nSum of 1 2 3 4 is\
    \ 10\nSum of 1 2 3 4 5 is 15\nSum of 1 2 3 4 and 1 2 3 4 5 is 25\n```\n\nThe function\
    \ returns all arguments sent to as one array. Thus, you can send an actual array,\
    \ a list of values, or combinations of these. Inside the function, there is simply\
    \ a loop"
