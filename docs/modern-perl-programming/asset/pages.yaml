  md: 'Note the FORM tag has an ACTION attribute whose value is a URL, the CGI script
    to be executed when this form is submitted. In this case, the script is on the
    local machine and its name is amortize.pl in the server''s cgi-bin directory.
    Where the scripts are actually kept on a server is a server configuration issue.


    CGI forms have many INPUT tags. Each INPUT tag places an element on the form,
    the TYPE attribute determines the kind of element that is placed on the form,
    is a text field, a button, or some other type. There are also few special types,
    SUBMIT and CLEAR, which yield buttons. In the HTML code, there are several fields,
    a mutually exclusive radio buttons, a few list boxes, a text area, an Apply button,
    and a Clear Form button.


    It''s very important to notice that all of the INPUT types have a NAME attribute
    associated with them. When the CGI script processes the form data, these names
    and the values entered into these elements become associated and ultimately parsed
    by the CGI script.


    # 13.2.2 GET method vs. POST method


    Another aspect of CGI is the method used to send form data to the server and ultimately
    to the Perl script. There are several methods, but the most common ones are GET
    and POST, of which either is specified by the ACTION attribute of the FORM tag.
    When the GET method is used, the data is sent to the script through variables.
    When the POST method is used, the data is sent to the script via STDIN. Your script
    determines which request method is used by the %ENV array constructed by the server
    and by all CGI scripts. The exact reference is %ENV[REQUEST_METHOD].


    GET is the default method. It sends request information as a set of parameters
    appended to the URL. These parameters are also available through the %ENV array.
    GET limits the amount of data that can be sent to the script, whereas POST has
    no limit. Your HTML specifies the POST method, then the data filled in by the
    user is ultimately sent to the script via STDIN. The script must be prepared to
    read the data regardless of how it is sent.


    To illustrate what the URL string looks like when the GET method has chosen, let''s
    look at a simple form. First the HTML will be shown, and then we will show the
    rendering of the page by the browser (see Figure 13.3).


