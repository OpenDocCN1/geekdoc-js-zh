  md: "The above example prints all lines if they begin with \"r;\" then have \"any\
    \ character,\" and end with \"t.\" Case-sensitivity is always honored with regular\
    \ expressions. To ignore case, just place an \"i\" after the pattern.\n\n```\n\
    while ($line = <STDIN>{\n  print \"$line\" if ($line =~ /r.t$/i);\n}\n```\n\n\
    The above code prints lines that end with \"r,\" \"any character,\" \"t,\" regardless\
    \ of case. Keep in mind that regular expressions are with respect to strings and\
    \ not lines, even though the examples thus far have all dealt with lines.\n\n\
    # 1.6.2 Substitutions\n\nAnother reason for doing a pattern match is to make a\
    \ substitution if there is a match. Perl uses the s operator for this action.\
    \ The following code will print each line entered on the standard output with\
    \ Michael replacing Mike:\n\n```\nwhile (<STDIN>{\n  s/Mike/Michael/g;\n  print;\n\
    }\n```\n\nThe substitution operator automatically operates on $_ If you omit the\
    \ \"g,\" then the substitution only occurs on the first occurrence of the pattern\
    \ on each line. In either case, the match is made against $$, unless a specific\
    \ variable is named. If you need to name the variable, you may code it as shown\
    \ here:\n\n```\nwhile ($line = <STDIN>{\n  $line -= s/Mike/Michael/g;\n  print\
    \ $line;\n}\n```\n\n# 1.7 Writing Your Own Functions\n\nFunctions in a programming\
    \ language serve two important purposes. They allow you to reuse code and they\
    \ serve to generalize an algorithm that can be used on different data. Perl has\
    \ several hundred built-in functions: open, chomp, push, pop, etc. In this section\
    \ of the tutorial, you will learn how to write your own functions."
