  md: '# CHAPTER

    16


    # DEBUGGING PERL SCRIPTS


    Debugging a piece of software is a difficult task in any programming language.
    Some would say that it is even more difficult in Perl since the language is so
    permissive. This chapter gives the details of various ways in which you can effectively
    debug Perl programs.


    # 16.1 Introduction


    There are various ways of debugging Perl programs. One common technique is to
    use print statements profusely. Another technique is to use command-line switches
    that will give warnings about potential errors in Perl programs. Perl programmers
    also have at their disposal some Perl modules that can find program errors. Finally,
    there is the Perl debugger, a wonderful Perl program that can help find bugs when
    all fails.


    # 16.2 Using the print Function


    It''s always a good idea to strategically place a lot of calls to print functions
    in your programs so that you can see the flow of control in your program and the
    values of key variables. Placing print function calls at the beginnings of subroutines
    can help in determining exactly what you have passed to the subroutines. Be careful
    about placing them at the end of subroutines, however. Notice the following function,
    which computes the length of the hypotenuse of a right triangle given the first
    two:'
  merge: -1
  pgno: 328
- img_proc: true
  md: "# Chapter 16 • Debugging Perl Scripts\n\n```\n#!/usr/bin/perl\n#\n# hypot.pl\n\
    #\nsub hypot\n{\n    my ($sidel, $side2, $hypot) = @_;\n    $sidel *= $sidel;\n\
    \    $side2 *= $side2;\n    $hypot = $sidel + $side2;\n}\n```\n\n$first = 3;\n\
    $second = 4;\n$hypot = hypot($first, $second);\nprint \"$hypot\\n\";\n\nIt should\
    \ be clear to the reader that the writer of this subroutine forgot to take the\
    \ square root of $hypot just before the subroutine ended. It might not be as clear\
    \ as the writer of this code, In an attempt to track down the bug, the writer\
    \ might try to place a print function before the subroutine returns.\n\n```\n\
    sub hypot\n{\n    my ($sidel, $side2, $hypot) = @_;\n    $sidel *= $sidel;\n \
    \   $side2 *= $side2;\n    $hypot = $sidel + $side2;\n    print \"From hypot:\
    \ Value = $hypot\\n\"\n}\n```\n\nIf you proceed as above, you will affect the\
    \ return value from the subroutine. Recall that the return value of a subroutine\
    \ is the value of the last statement evaluated inside the routine. In this case,\
    \ it is the value of the print function. Even though it is rarely used, print\
    \ will typically return the value 1. This isn't the world's greatest debugging\
    \ tip, but it will save you once or twice now that you have seen this example.\n\
    \n# 16.2.1 The warn function\n\nWe have already given the details of the die function.\
    \ Perl also contains the warn function, which behaves exactly like die except\
    \ the program does not terminate. Whether you use die or warn is up to you. It\
    \ depends on the severity of the error you find.\n\nWhen should check for errors?\
    \ That's also up to you, but there are a few cases when you absolutely should:\n\
    \n+   - check on the number of arguments to a script\n- check on the status of\
    \ the open or operendir function\n- check on whether a user has input the desired\
    \ type"
