  md: '# Writing style


    In a book about a programming language, the author is faced with many different
    decisions. Since this book contains many complete code examples, I must show you
    the code and explain it. This leads to two inevitable choices: show the code and
    then write about it, or write about it and show the code. There are drawbacks
    and advantages to each choice. For the most part, I have given the code first
    and then given the explanation. When you become frustrated reading some of the
    code, have a little patience, for the explanation will surely follow.


    # Displaying files


    Occasionally, you may need to display a few data files so you can interpret the
    results of programs. On Unix systems, this is usually accomplished with the cat
    command; on Windows, this is usually accomplished with the type command. To stay
    neutral, we will use a mythical display command as follows:


    ```

    % display datafile

    | Michael Saltman Columbia Maryland |

    | Susan Saltzman Charleston South Carolina |

    | Erin Flanagan Annapolis Maryland |

    | Patti Ordonez Columbia Maryland |

    | Maria Gonzalez Pikesville Maryland |

    | Dave Flanagan Bowie Maryland |

    | Bob Knox Ft. Lauderdale Florida |

    %

    ```


    # Source files


    All of the code found in the examples is available online, as well as the solutions
    to the exercises that appear in each chapter. Please go to www.phptr.com/saltzman/
    to retrieve this material.


    # Acknowledgments


    There are those that I wish to thank for this work. Robert Oberg originally put
    me in touch with the folks at Prentice Hall. Without him, this work would never
    have happened. I also want to thank Michael DaConta and Scott Meyers. Each of
    them has inspired me to become an author. I also want to thank the /training/etc
    staff, who aided me in various ways as this book went from an idea to a publication.
    They are are Bob Knox, Erin Flanagan, Patti Ordonez, Dave Flanagan, Maria Gonzales,
    and last, but certainly not least, Susan Saltzman, my partner at work and at home.'
  merge: -1
