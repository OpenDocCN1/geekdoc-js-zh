  md: '# 14.2 Geometry Management


    In the Button method, we have used a few pairs as parameters: the first pair specifies
    the text to be placed on the button; the second pair is a reference to a subroutine
    that will be called when the user clicks on this button. The Button method has
    many other parameters, of which we will discuss later. It''s not enough to create
    the button, how-ever; it must be placed somewhere on the GUI. Where it is placed
    on the GUI is part of a larger topic called geometry management.


    It should also be noted that there are many different styles of Tk programming.
    This is true even in the previous simple program. For example, we could have made
    the subroutine anonymous, and coded it as follows:


    ```

    Smw->Button(-text => "Quit",

    -command => sub {exit 0} ) ->pack;

    ```


    Note that we packed directly in the code above rather than on the returned reference
    from Smw->Button.


    # 14.2 Geometry Management


    When several widgets are displayed in the same window, a part of the software
    must be responsible for how the widgets are rendered with respect to one another.
    This is called geometry management. There are three flavors of geometry managers
    in the Tk module:


    +   - pack()

    - grid()

    - place


    # 14.2.1 pack


    Only one geometry manager should be used per window. pack() is the most commonly
    used manager. It may be used with or without arguments. pack() allows you to control
    widget positioning, size, and spacing. Here''s an example that shows the default
    placement of widgets when using pack() (see Figure 14.3). The code follows the
    display.


    ![](img/74431d7901809922ce9b915cecff17c7_278_0.png)


    Figure 14.3 pack with defaults.'
  merge: -1
  pgno: 278
