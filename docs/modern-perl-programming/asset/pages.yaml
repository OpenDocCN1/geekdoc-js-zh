    # 16.6 Useful Perl Modules


    In addition to all the debugging techniques that we have seen so far, there are
    also a few Perl modules that are helpful in debugging.


    # 16.6.1 strict.pm


    The strict module forces Perl programmers to conform to certain coding practices.
    There are three main categories enforced by the strict module: variables, subroutines,
    and references. If your program contains the line:


    ```

    use strict;

    ```


    then all three categories are enforced.


    # 16.6.2 strict vars


    To limit the capabilities of the strict module so that it just checks on variable
    use, you need to code:


    ```

    use strict qw(vars);

    ```


    In this case, Perl makes sure that your use of variables is limited to my variables
    or full package name variables. This virtually removes the chances of making the
    following error:


    ```

    $msgtxt = "start ";

    $msgtxt .= "middle";      # wrong spelling

    print "$msgtxt\n";

    ```'
