  md: '# 4 Chapter 1 • A Tutorial Introduction to Perl


    Note that throughout the book, what the user types will be in bold letters. You
    can also see all non-comment lines end with the semicolon character. Syntactically,
    the semicolon is a statement separator, not a statement terminator; the last statement
    in a script, or the last statement of any block (statements delimited by curly
    braces {{}}), does not have to be terminated with a semicolon. However, it is
    good practice to place one there since you may later add some Perl code to the
    end of the script.


    # 1.1.2 Some elementary I/O


    Thus, we have seen the print function used several times. We now would like to
    explore how a Perl program performs input and output. Whenever you want to place
    some information on the user''s display, you use the print function. By default,
    your data will be sent to the standard output file, the display. Perl programs
    understand the concept of a filehandle, a name that is associated with a file.
    Perl defines a few builtin handles, one of which is STDOUT. If you wish, you may
    use a filehandle in the print function to explicitly specify the destination for
    the data to be printed. The following two lines are functionally identical to
    one another:


    ```

    print STDOUT "this string gets sent to the display";

    print "this string gets sent to the display";

    ```


    You may also create your own filehandle by using the open function. This function
    associates a filehandle with an actual disk file. open contains two arguments,
    the first of which is a filehandle and the second of which contains the name of
    the file to be created and the mode (input or output) of the file. The access
    mode is given as a punctuation symbol. The following open function associates
    the file named mydict with the filehandle OUTPUT. The > symbol specifies that
    the file will be used as an output file. Be careful if the file already exists,
    it will be truncated.


    The name OUTPUT is one of our choices. We have called it OUT or anything else.
    When you create a filehandle, using a naming convention that is mnemonically sound.


    Here''s a sample program, iodem.pl, which creates a file and sends some data to
    the file associated with the filehandle and to the display:


    ```

    #!/usr/bin/perl

    #

    # iodem.pl


    open(OUTPUT,">mydata");

    print STDOUT "Welcome to the Perl language\n";nprint OUTPUT "This data goes to
    a file\n";nprint STDOUT "I think you will enjoy it\n";nprint OUTPUT "Likewise
    this goes to a file also\n";

    ```'
