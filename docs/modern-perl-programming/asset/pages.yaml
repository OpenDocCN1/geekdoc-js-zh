  md: "# Remembering Parts of Matches\n\nprint \"$1\\n\" if /\\[.\\d+\\]/;\n\nYou\
    \ are not limited to a single set of parentheses. For example, the following expression\
    \ remembers two different parts of a match, the left and right sides of an assignment:\n\
    \n```\n#!/usr/bin/perl\n# assign.pl\n#while(<STDIN>) {\n  print \"$LHS: RHS =\
    \ $2\\n\" if /(.+) *= *(.+)/;\n}\n```\n\nIn the pattern above, remember that +\
    \ and * pertain to what precedes it. Both *'s pertain to a block and the + pertains\
    \ to any character. As an illustration of the output produced by the above program,\
    \ we use the following input file as the data file:\n\n```\n# display perlprog\n\
    $a = 30;\n$b = $s + 10;\n$c = 5;\nprint \"hello\";\n%\n```\n\n```\nassign.pl <\
    \ perlprog\nLHS = $a : RHS = 30\nLHS = $b : RHS = $s + 10\nLHS = $c : RHS = 5\n\
    %\n```\n\nHow many remembered portions are there? As many as you want! You may\
    \ also nest them. For example, the following regular expression uses four remembered\
    \ parts of patterns:\n\nprint \"$1:$2:$3:$3\\n\" if /((.)((.))((.)((.))/;\n\n\
    The pattern below uses six remembered parts of patterns:\n\nprint \"$1:$2:$3:$3\\\
    n\" if /((.)((.))((.)((.))/;\n\nIn the expression above, the bold part of the\
    \ pattern:\n\n```\n((.)((.))\n```"
