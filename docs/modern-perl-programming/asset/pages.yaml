  md: "# 90 Chapter 5 • Hashes\n\nnext version of this program requires that we code\
    \ our hash algorithm. It is worth a look because this is exactly the step you\
    \ would be saving if you had used Perl's hashing instead of our own algorithm.\n\
    \nA hashing algorithm takes a string and maps it to a number. There are many hashing\
    \ algorithms, but all we require is a simple one. Our hashing algorithm consists\
    \ of summing the numerical values for each character in the string. Then, the\
    \ algorithm divides this by the size of the table where we take the remainder\
    \ of this division and use it as an index into this table. Here's the code to\
    \ produce such an algorithm:\n\n```\n#!/usr/bin/perl\n# hashing.pl\nsub hash\n\
    {\n  ($string, $table_size) = @;\n  @chars = split(\"\", $string);\n  $hvalue\
    \ = 0;\n  foreach $character (@chars) {\n    $hvalue += ord($character);\n  }\n\
    \  $hvalue % $table_size;\n}\nwhile(<STDIN> {\n  @words = split;;\n  foreach $word\
    \ (@words) {\n    print \"$word \",hash($word,100), \"\\n\";\n  }\n}\n```\n\n\
    The hash function is shown below. It simply takes each character of a word and\
    \ gets its numerical value using the ord function. Notice the use of split to\
    \ split a string into array of single characters. The remainder of the division\
    \ is returned using the modulus operator.,\n\nsub hash\n\n```\n($string, $table_size)\
    \ = @_;\n@chars = split(\"\", $string);\n$hvalue = 0;\nforeach $character (@chars)\
    \ {\n  $hvalue += ord($character);\n}\n$hvalue % $table_size;\n```"
