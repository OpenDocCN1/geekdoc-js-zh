    }\nelse {\n    read(STDIN, $data, $ENV{CONTENT_LENGTH});\n    @pairs = split('&',\
    \ $data);\n    foreach $item (@pairs) {\n        ($name, $value) = split(\"=\"\
    , $item);\n        $value = s/\\s+//g;\n        $value = s/\\[[0-9a-zA-Z]\\] [0-9a-zA-Z]//g;\n\
    \        pack(\"c\",hex($1));\n        $input{$name} = $value;\n    }\n}\nprint\
    \ \"<H1><CENTER>YOU HAVE CHOSEN<CENTER></H1>\";\nprint \"<H1><CENTER>$input(base)<CENTER></H1>\"\
    ;\n$result = eval $input(expression);\nif ($input(base) eq \"octal\") {\n    $val\
    \ = sprintf(\"%o\", $result);\n} elsif ($input(base) eq \"hex\") {\n    $val =\
    \ sprintf(\"%x\", $result);\n} elsif ($input(base) eq \"binary\") {\n    $val\
    \ = unpack(\"B32\", pack(\"N\", $result));\n    $val ~~ s/\\0*\\//;\n} else {\n\
    \    $val = $result;\n}\nprint \"<TABLE ORDER=2 ALIGN=CENTER>\";\nprint \"<TH>EXPRESSION</TH><TH>VALUE</TH>\"\
    ;\nprint \"<H1><TR><TD ALIGN=CENTER>$input(expression)</TD></TR>\";\nprint \"\
    <TD ALIGN=CENTER>$val</TD></></H1>\";\nprint \"</TABLE>\";\n```"
