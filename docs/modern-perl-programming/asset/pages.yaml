  md: '# Chapter 13 · CGI Programming with Perl


    Here''s a list of some of the variables that are displayed:


    +   - SERVER_ADMIN: E-mail address of server administrator

    - SERVER_SOFTWARE: Specific server software that launched the CGI

    - REMOTE_HOST: Machine domain name of client

    - REMOTE_ADDR: Machine IP address of client

    - REMOTE_USER: Full name of user issuing client

    - REMOTE_IDENT: Login name of user

    - CONTENT_TYPE: MIME type

    - HTTP_USER_AGENT: Browser software

    -HTTP_REFERER: URL of the document containing the link to this script


    # 13.4 cgi-lib.pl and cgi-pm


    In the Perl script that evaluated expressions, we decoded the form values ourselves.
    Since this is such a common piece of code, a few libraries have been written to
    perform this task. In order Perl 4 scripts, the library is called cgi-lib.pl.
    That library contains a ReadParse subroutine that builds an associative array
    for using typeglobs.


    require "CGI-LIB.pl";

    &ReadParse(*input);


    Note the use of a typeglob as the input to ReadParse. In Perl 5, there is a module
    named CGI.pm that contains a ReadParse routine. You simply code as below and the
    data will be prepared in an associative array named %in:


    ```

    use CGI;

    CGI::ReadParse();

    ```


    # 13.5 CGI Scripts and Databases


    In the evaluation script, there was very little to do besides using eval and testing
    to see which base the user required. Most CGI scripts need to access a database
    to modify, or retrieve records. For example, if you use the Web to make airline
    or hotel reservations, much of the data that is displayed for real database such
    as Oracle or Sybase. The next CGI application is one in which we present the user
    with a registration form and then ask the user to either log their information
    or view a history of what has been logged to date. In the interest of simplicity,
    we use a simple text file rather than an actual database.


    Figure 13.4 is the rendering of the HTML file, followed by the HTML code and CGI
    script itself:'
