  md: '# # CHAPTER 15 ACCESSING REAL DATABASES IN PERL


    Most computer software applications interface with databases sooner or later.
    Certainly, this is true of CGI applications. When we looked at CGI earlier, we
    used a flat file database. In this chapter, we will show the details of connecting
    to real databases such as Oracle and Sybase in Perl. However, rather than favoring
    a particular vendor, we will be using the MySQL database system, which can be
    downloaded at www.mysql.com. With this database, we can demonstrate the principles
    of accessing all databases in Perl, regardless of the vendor.


    # ## 5.1 Introduction


    If you want to test some of the programs in this section, there are a few Perl
    modules that you will need to download in addition to downloading the actual MySQL
    database program. In particular, you will need the DBI.pm and DBD-Mys.pm modules.
    If you are using Windows and a Perl port from ActiveState, you can download these
    modules with the Perl Package Manager as follows:


    ```

    C> ppm

    PPM interactive shell (2.1.2) - type ''help'' for available commands

    pm> install DBI

    ...

    pm> install DBD-MySQL

    ...

    quit

    C>

    ```'
  merge: -1
  pgno: 308
- img_proc: true
  md: 'If you are using a Unix variant, then you will have to go to the CPAN site
    and download these modules.


    # 15.1.1 What is DBI?


    The database interface (DBI) module is a package that allows you to access relational
    databases from a Perl script. It is of the de facto standard for database access
    from Perl. DBI provides the means for writing code that is database vendor-independent.
    Databases access via DBI include:


    +   - Informix

    - Ingress

    - Interbase

    - MySQL

    - Oracle

    - Sybase


    DBI also provides an interface for Open Database Connectivity (ODBC).


    # 15.1.2 What is DBD?


    The DBI module specifies the programming interface regardless of the actual database
    that is being used. In other words, when you want to make a database request from
    Perl, the Perl statement that you use is independent of the database being used.
    The DBI module funnels this request and processes it, perhaps returning a result.
    Each database requires its own driver. The DBD module takes the request and processes
    it In the Perl world, these drivers are contained in specialized modules with
    names such as DBD::Oracle, DBD::Sybase, DBD::MySQL, etc.


    # 15.1.3 The DBI architecture


    When you access a real database in Perl, there are certain levels of function
    calls that are hidden from you. Your Perl code calls a routine in the DBI module,
    which calls a routine in a DBD-specific module, which talks to the database. Figure
    15.1 shows the various levels that funnel data into the DBI architecture:'
  merge: -1
  pgno: 309
- img_proc: true
  md: '![](img/74431d7901809922ce9b915cecff17c7_310_0.png)


    # A Review of SQL and Relational Databases


    Data in a relational database is stored in one or more related tables. A table
    is a collection of rows and columns. Each row is best thought of as a record.
    The record, or row, is divided into fields called columns.


    When you download the MySQL database, you are given a database with a few tables.
    However, we created our own database, named test, with a table, named Staff. The
    Staff table is pictured on the next page (Table 15–1).'
