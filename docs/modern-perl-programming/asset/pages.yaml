- img_proc: true
  md: "# 1.5 A Special Perl Variables\n\nYou can also use labels in connection with\
    \ next or redo. With next, control flows to the next iteration of the labeled\
    \ block. With redo, the loop of the labeled block is redone.\n\n# 1.5 A Special\
    \ Perl Variables\n\nAs you become more familiar with Perl, you will see many predefined\
    \ names. Some of these names are filehandles, others are functions, while still\
    \ others are arrays and variables. A few of these are used so often that we wanted\
    \ to introduce them early in the book.\n\n# 1.5.1 $ _\n\nThe predefined variable\
    \ $ _ has many uses in Perl. Often it is a default string for various operations.\
    \ For example, the following code reads lines from a file until the end of the\
    \ file is reached:\n\n```\nwhile($line = <STDIN>)\n{\n    print $line;\n}\n```\n\
    \nYou may write this code more succinctly by relying on the default variable,\
    \ $ _. That is, if you do not specify the variable that receives the line being\
    \ read, then it is as though you have coded as follows:\n\n```\nwhile($_ = <STDIN>)\n\
    {\n    print $_;\n}\n```\n\nOf course, there’s no need to code as above, since\
    \ the following is equivalent:\n\n```\nwhile(<STDIN>)\n{\n    print $_;\n}\n```\n\
    \n$ _ can also be the default variable to be printed. Thus, the above may be written\
    \ as:\n\n```\nwhile(<STDIN>)\n{\n    print;\n}\n```"
