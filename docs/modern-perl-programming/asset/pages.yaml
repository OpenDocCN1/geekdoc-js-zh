  md: '# CHAPTER 10 PERL REFERENCES


    This is the first chapter where the concepts are slightly advanced. We will concentrate
    on a thorough treatment of references, Perl''s version of pointers. References
    are used for almost all advanced Perl topics.


    # 10.1 Introduction


    When Perl transitioned from Perl 4 to Perl 5, one of the most significant changes
    to the language was the introduction of references. If you are a C programmer,
    you will find references very similar to pointers. Of course, the syntax for Perl
    references is different than the syntax for C pointers. References have many uses
    in Perl. We will see a myriad of them in this and future chapters.


    # 10.1.1 What is a reference?


    You can think of a Perl reference as a scalar whose value is the address in memory
    where a piece of data is stored. Of course, the piece of data may be a simple
    value such as a string:


    ```

    [mike]

    ```


    or it might be more complex such as a record consisting of a name, an occupation,
    and a series of elements relating to the occupation:


    ```

    [mike] [C, C++, Perl, Java]

    ```


    In Perl, a reference is a scalar variable that contains the address of some arbitrarily
    complex piece of data.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 10.1.2 Scalar references


    One way to create a reference is by using the \ symbol. You can think of this
    symbol as the “address of” symbol because that is what it returns. Here’s an example
    of creating a reference:


    ```

    $data = 20; # scalar: integer value of 20

    $rdata = \data; # reference: address of $data

    ```


    The scalar $rdata is a reference to $data, which is itself a scalar. Once a reference
    to a variable is created, you may use it to access the variable that is being
    referenced. To access a variable through a reference, you will need to use $,
    the scalar dereferencing operator. Assembly language programmers will recognize
    this as indirect addressing. All of the ideas are collected into the following
    example:


    ```

    #!/usr/bin/perl

    #

    # scalarref.pl

    $data = 20; # create the reference

    $rdata = \$data; # print the data directly

    print "$data\n"; # print the reference

    print "$rdata\n"; # change the data indirectly

    \$$rdata = 50; # print the data indirectly

    print "$data\n"; # prove it


    % scalarref.pl

    20SCALAR(0xbe7420) 20

    50

    %

    ```


    If you print a reference, you''ll get an address. Normally, this is not what you
    want, don''t forget to put the extra $ in front of the reference to get the value
    to which it is pointing.


    # 10.1.3 Array references


    References to any of Perl''s data types can be created. To create a reference
    to an array, you would proceed as follows:


    ```

    @values = (10, 20 , 30);

    $rvalues = \@values;

    ```'
