    use CGI;\nCGI::ReadParse();\nprint \"content-type: text/html\\n\\n\";\nif (! open\
    \ (MYLOG, \"logfile\") ) {\n{\n    print \"OPEN FAILED\";\n}\nelse {\n    print\
