  md: '# 13.3 Relationship between Server and CGI Script


    The server is also responsible for setting the environment for the script. The
    CGI script needs to determine how the data is sent. It simply checks the environment
    array, ${ENV{REQUEST_METHOD}; If the value is GET, the script reads the data from
    ${ENV{QUERY_STRING}; if the value is POST, the script must check ${ENV{CONTENT_LENGTH}
    and then use the read function to parse the data from STDIN. In either case, the
    script needs to parse the data from the form:


    ```

    var=value1&var2=value2&var3=value3...etc.

    ```


    # 13.3 Relationship between Server and CGI Script


    Keep in mind that servers extend their functionality using CGI scripts. The server
    starts these scripts, and the two processes together constitute a parent and child
    relationship. When the CGI wants to send output back to the server, it does so
    by using the print command.


    HTTP demands that the server response contain header information before any data
    is sent. One of these headers is the content-type header, which must precede any
    data that the script sends and must be followed immediately by a blank line. Thus,
    all scripts will have the following line, which specifies the type of document
    being returned as the first print function. There are other headers, but we are
    not concerned with them here.


    ```

    print "content-type: text/html\n";

    ```


    Beyond that, the script contains the "business logic" for which it was invoked.
    Below we will show the script, eval.pl that does the expression calculation. To
    test this script or any other script, you will not only need an HTTP server, but
    you will also need to know where in the server directories to install your Web
    pages and scripts. This is for a server-dependent activity, you will need to consult
    your server documentation.


    # 13.3.1 A Perl CGI script


    Now we will look at an actual Perl script, the one that processes the expression
    form from above. In general, the Perl script needs to parse the data from the
    query string, implement any business logic it deems necessary, and formulate some
    HTML to send back to the browser through the server. Often, there are some database
    inquiries that are part of the business logic.'
  merge: -1
  pgno: 260
