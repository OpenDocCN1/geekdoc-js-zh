  md: "# Here is the code for the application depicted in Figure 14.21:\n\n```\n#/usr/bin/perl\n\
    #\n# topLevel.pl\n#\nuse Tk;\nmy $mw = MainWindow->new;\n$mw->geometry(\"200x200\"\
    );\n$bl = $mw->Button(-text => \"Next Screen\",\n                  -command =>\
    \ \\next) -> pack;\n$b2 = $mw->Button(-text => \"Quit\",\n-command => sub { exit\
    \ }) -> pack;\nopen(INFO, \"info\");\nMainLoop;\nsub next {\n    if (! Exists($t))\
    \ # do not confuse with with\n    {\n        $t=$mw->TopLevel();\n        $t->geometry(\"\
    150x150\");\n        $t->Label(-text => \"Name\") -> pack;\n        $t->Entry(-variable\
    \ =>\\$name) -> pack;\n        $t->Label(-text => \"Age\") -> pack;\n        $t->Entry(-variable\
    \ =>\\$age) -> pack;\n        $t->Button(-text => \"Save\",\n                \
    \  -command => \\&save) -> pack;\n    }\n}\nsub save {\n    print INFO \"$name\
    \ $age\\n\";\n}\nclose(INFO);\n```\n\nNote that top-level windows, including MainWindow,\
    \ have methods defined on them. We've shown the use of one of them, the geometry\
    \ method, in the code above. This method allows you to specify the height and\
    \ width of the window. You may also specify the placement of the upper left-hand\
    \ pixel of the window. For example, the string in the geometry method:\n\n```\n\
    $mw -> geometry(\"300x200+50+50\");\n```\n\nspecifies that the window will be\
    \ 300 x 200 pixels and that the upper left-hand pixel will be at position 50,50\
    \ relative to the entire desktop."
