  md: '# 16.7 The Perl Debugger


    The Perl debugger is set in motion by the -d flag. It does not run as a separate
    program. To start the Perl debugger, type the following:


    ```

    $ perl -d program.pl

    ```


    You will see:


    Loading DB routines from perl5db.pl version 1.07

    Editor support available.


    Enter h or ''h'' for help.


    ```

    main::(programl.pl:1):  $b = $;

    DB<1>

    ```


    This tells you that you are debugging the script program.pl and that you are about
    to execute the following command from that script:


    ```

    $b = $;

    ```


    Now you can start to enter debugger commands. The line:


    ```

    DB<1>

    ```


    is the debugger prompt. By entering the h command at this prompt, you will get
    a list of debugger commands. If you want a simple explanation of a specific command,
    simply enter:


    ```

    h command_name

    ```


    Here are some examples of debugger commands:


    +   - Set a breakpoint at line 25 b 25

    - Run the program to the breakpoint r

    - Print a value type print $val

    - Place debugger in trace mode t

    - Print a data structure pointed to by $ref x $ref

    - Single-step through the program s

    - Step over subroutines n'
