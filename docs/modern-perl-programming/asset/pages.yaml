    ```


    # 13.2.1 Form tags


    The HTML seen above is responsible for the mortgage form, although we have altered
    the text somewhat so it would fit on this printed page. A form can be placed anywhere
    in an HTML document. The form is created by the <FORM> and </FORM> tags. When
    the user clicks the Apply button, the browser sends the form data to the server.
    When the user clicks the Clear button, the form data is erased.'
