    \ Passing Arguments to Subroutines\n\nperl scripts should be divided into subroutines.\
    \ Whenever necessary, these subroutines can be invoked from various places within\
    \ the script. This is a form of code reuse. This strategy works best if each invocation\
    \ of the subroutine processes specific data, called arguments to the subroutine,\
    \ and the subroutines are coded using names that are known locally to the subroutine\
    \ and nowhere else.\n\nThe relationship between arguments and parameters in Perl\
    \ is unusual, aleit. In fact, there are no formal parameters as there are in other\
    \ popular languages such as C++ and Java. Rather, the arguments are collected\
    \ and passed into the subroutine, where they are available in a special array\
    \ named @_. Before we go any further, it's a good idea to drill down a little\
    \ bit into the variable @:\n\n```\n#!/usr/bin/perl\n#\n# squares.pl\n#\nsub square\n\
    {\n  $args = @;\n  print \"Number of arguments: $args\\n\";n  print \"First arg:\
    \ $\\$[0]\\n\";n  print \"Last arg: $_[-1]\\n\";n  foreach $value (@_) {\n   \
    \ push(@squares, $value * $value);\n  }\n  @squares;\n}\n@data = (5, 10, 3, 8,\
    \ 12);\n@results = square (@data);\nprint \"Originals: @data\\n\";nprint \"Results:\
    \ @results\\n\";\n```\n\ncontinued..."
