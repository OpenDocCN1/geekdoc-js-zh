    \ you wanted to do something with all of the sets, you should have used the g\
    \ modifier and a loop. The regular expression logic keeps track of the position\
    \ in the string where the last match occurred and subsequently looks ahead for\
    \ the next match.\n\n```\n#!/usr/bin/perl\n#\n# sumnums.pl\n#\nwhile<STDIN>\n\
    \    while(/(\\d+)/g)\n    {\n        $sum += $1;\n    }\nprint \"$sum\\n\"\n\
    ```\n\n# 6.7.2 The i modifier\n\nRecall that the i modifier makes the match insensitive\
    \ to case.\n\n```\ns/thy/thine/ig\n```\n\nThe above substitution takes all occurrences\
    \ of thy, regardless of case, and replaces them with thine."
