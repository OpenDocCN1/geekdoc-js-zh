  md: '# 14.2 Geometry Management


    Note that the sticky parameter is with respect to directions such as north (n),
    (s), (e), and west (w).


    # 14.2.3 place: Absolute coordinates


    The place geometry manager allows you to specify absolute or relative x,y coordinates
    for a widget. The Tk coordinate system positions the point (0,0) at the upper
    left-corner of the window, with the x coordinate increasing to the right and the
    y coordinate increasing downward.


    ```

    #!/usr/bin/perl

    #

    # placel.pl

    #

    use Tk;

    my $mw = MainWindow->new;

    $button1=$mw->Button(text=''button1'');

    $button2=$mw->Button(text=''button2'');

    $button1->place(-x => 0, -y => 0);

    $button2->place(-x => 20, -y => 17);

    MainLoop;

    ```


    Figure 14.6 is the GUI produced by the above code. -relx and -rely options.


    You can locate a widget anywhere in the window using the -relx and -rely options.
    When you use these parameters, Tk assumes the upper left corner to be (0,0) and
    the lower right corner to be (1,1). To place a widget in the center of the window,
    you can code:


    ```

    $button1 = $mw->Button (text => ''button1'');

    $button1->place(-relx => 0.5, -rely => 0.5);

    ```


    However, this will center the upper left corner point of the button rather than
    the button itself. You can fix this by changing the anchor position of the widget
    from the upper left-hand corner of the widget to the center of the widget (see
    Figure 14.7).


    ![](img/74431d7901809922ce9b915cecff17c7_282_0.png)


    Figure 14.6 Using grid.'
