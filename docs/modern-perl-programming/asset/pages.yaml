  md: "# 7.2.1 local vs. my\n\nlocal may be used to limit the scope of a variable\
    \ to a specific subroutine and all subroutines called from it. This is known as\
    \ dynamic scoping.\nmy defines a subroutine that is limited to a specific subroutine,\
    \ excluding those called from within. This is called lexical scoping; my is always\
    \ preferred to local. It is always a sound practice to localize variables; otherwise,\
    \ all variables referenced in a subroutine would be global variables. Here is\
    \ the correct way to write the factorial function:\n\n```\nsub factorial {\n \
    \ my $f = $[0];\n  my $result = 1;\n  while($f > 1) {\n    $result *= $f;\n  \
    \  $f--;\n  }\n  return $result;\n}\n```\n\n```\n% factorial.pl\nenter a number\
    \ 5\n1 factorial is 120\n%\n```\n\nThe value of $[0] is saved in $f, a variable.\
    \ Likewise, $result is also localized so it will not collide with a variable of\
    \ the same name potentially used in another part of the program.\n\n# 7.2.2 Typeglobs\n\
    \nNormally, it is a big advantage to be able to pass to a subroutine an argument\
    \ list whose size can vary from invocation to another. For example, the totals\
    \ function below may take any number of arguments and return the sum of them.\
    \ Notice some of the ways in which it may be invoked:\n\n```\n#!/usr/bin/perl\n\
    #\n#  totals.pl\n#\nsub totals {\n  my($sum) = 0;\n  foreach $item (@_)\n\n```"
