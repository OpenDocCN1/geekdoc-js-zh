  md: '# Bottom-of-Page Formatting


    This is format # 2 top of page


    ```

    $^ = ONE_TOP;

    $- = ONE;

    write;

    $- = 0;          # force top of page

    $- = TWO;

    $^ = TWO_TOP;

    write;

    ```


    Note that you can always force a top-of-page format to be printed by making $-
    have the value 0. Remember that this variable represents the number of lines remaining
    on the printed page. If you set it to 0, Perl thinks you now want a top-of-page
    format.


    ```

    % formats.pl

    This is format # 1 top of page

    This is format # 1

    This is format # 2 top of page

    This is format # 2

    %

    ```


    # 8.5 Bottom-of-Page Formatting


    There is no automatic bottom-of-page format generation, but you could create one-
    yourself by using $- or your own counter to detect when you are near the bottom
    of a page. Once you''ve done it, you could install the new format for the bottom
    of the page, execute the write, and then reinstall the old format for the body
    of the next page. Here is the output from running the program bottom.pl. The source
