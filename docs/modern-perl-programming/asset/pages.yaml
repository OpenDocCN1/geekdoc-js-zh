  md: "# 6.5 Remembering Parts of Matches\n\nThere are occasions when you need to\
    \ determine whether a string matches a pattern so that you can remember a portion\
    \ of the match. For example, suppose you wish to examine a Web server log file\
    \ that contains many lines, each of which contains a URL with some other information.\
    \ Your task might be recover the XXX part from names such as www.XXX.com When\
    \ a regular expression contains a set of parentheses, the pattern does not change\
    \ because of it. The two regular expressions represent the same pattern, a set\
    \ of digits:\n\n```\n/[0-9]+/\n/([0-9]+)/\n```\n\nIf a match occurs, the parenthesized\
    \ portion of the match is remembered and can be recalled by using the special\
    \ variable $1. In the following code, each line that contains a set of digits\
    \ will have those digits printed. Only the first set will be printed in the case\
    \ where there are multiple sets.\n\n```\n#!/usr/bin/perl\n#\n  numbers.pl\n#\n\
    while(<STDIN>)\n{\\    print \"$1\\n\" if /([0-9]+)/;\n}\n```\n\nLikewise, the\
    \ URL problem from above may be solved as follows:\n\n```\n#!/usr/bin/perl\n#\n\
    \  urls.pl\n#\nwhile(<STDIN>)\n{\\    push (@URLS), $1) if /w{3}\\.(.*)\\.com;\n\
    }\nprint join(\"\\n\", @URLS);\n```\n\nNote that in the above, a backspace character\
    \ (\\), is used to escape the special meaning of the period. The backspace character\
    \ is thus a metacharacter well. Its meaning is to remove the special meaning of\
    \ the character that follows. The following regular expression prints a set of\
    \ digits and their surrounding square brackets if $_ contains a set of bracketed\
    \ digits:"
