    \n# 1.6 Regular Expressions\n\nPerl is rich with capabilities. Probably the two\
    \ most important features of Perl are hashes and regular expressions, each of\
    \ which is described further in a separate chapter. In this section, we will introduce\
    \ regular expressions and give a few simple examples. A regular expression is\
    \ a set of characters used to express a pattern. This pattern is used to determine\
    \ if a string matches. Once a pattern is matched, it may be stored, printed, replaced,\
    \ or some action can be taken as a result of the match.\n\n# 1.6.1 Pattern matching\n\
    \nIt is a recurring theme that a program needs to verify that some input is an\
