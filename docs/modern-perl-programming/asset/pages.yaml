    xvii


    be downloaded at www.mysql.com. With this database, we will demonstrate the prin-ples
    of accessing all databases in Perl, regardless of whether the actual database
    is Oracle, Sybase, Access, etc.


    # Chapter 16: Debugging Perl Scripts


    ... explores many of the possibilities of debugging your Perl code. Debugging
    a piece of software is a difficult task in any programming language. Since Perl
    is so permissive, there is much room for error. This chapter shows many techniques
    for finding errors, including the use of the Perl debugger itself.


    # Conventions Used in this Book


    # Spelling


    In any technical field, a new vocabulary is introduced. These new words may cause
    spelling debates. To no small degree, this applies to any subject matter concerned
    with software. Here are a few words and the spelling we will use:


    +   - A filehandle refers to a name within a Perl program that is connected to
    an actual disk file. We will spell this word as filehandle, not file handle.

    - A database is a set of data that is connected together in some form. We will
    spell this word as database, not data base.

    - A filename is the name given to a file. We will spell this as filename, not
    file name.

    - A newline character is the character generated when you press the Enter key.
    We will spell this as newline, not new line.

    - The word "builtin" will be used to indicate that certain items are built into
    the language. For example, we might say that the length function is a builtin
    Perl function.


    # Fonts


    Various fonts will be used in this book to emphasize certain components of the
    book. All Perl keywords, variable names, reserved words, and code will be set
    in the Courier font. For example:


    The following code illustrates the push and print functions in Perl:


    ```

    push(@values,10);

    print "@values \n";

    ```


    # Unix vs. Windows


    Perl programs run in many environments, though the two major operating systems
    in the marketplace of 2002 are Unix and Windows (and their variants). As you will
    see, there is a slight difference between executing a Perl program in these two
    environments. To normal-'
  merge: -1
