- img_proc: true
  md: 'However, for those cases in which there is only one statement inside the control
    structure, Perl allows a shorter form called the modifier form. This form may
    be used with if, unless while, and until. To use this form, simply code one statement
    before the control structure.


    ```

    $x = 50;

    $y = 10;

    $name = "Mike"; if $x > $y;

    print "$name\n" unless $x < $y;

    print "$name\n" while $y++ < $x;      # ++ to be explained later

    print "$name\n" until $x > $y++;    # ++ to be explained later

    ```


    Keep mind the control structure is still evaluated first, so any statement execution
    depends on the truth of the test. When you use this form, the set of parentheses
    that delimits the condition is not required.


    # 1.3.8 What is true and what is false?


    In many of the control structures above, a test must be made to determine if the
    body of the control structure is executed. When an expression is tested for true
    or false, Perl only cares whether the expression has the value zero or not. Zero
    is considered false and anything else is considered true. There are different
    versions of zero, however! Each of the following is considered to be zero: "",
    "0", 0, and 0.0.


    # 1.4 Altering Loop Control Flow


    Often, the programmer needs to alter the usual behavior of loop iteration. Each
    of the following works equally well with any of Perl’s looping constructs:


    ```

    next

    redo

    last

    ```


    # 1.4.1 last


    The Perl keyword last breaks the loop and causes control to be thrown to the first
    statement following the loop. For example, suppose we wanted to find the index
    of the first negative element in an array.'
