  md: "# 5.2 Sorting Hashes\n\nWhen two frequencies are out of order, then their respective\
    \ keys are swapped such that the entire array ends up sorted in an order reflective\
    \ of their associated values. Here's the special:\n\n```\nsub numcmp\n{\n  $words{$a}\
    \ => $words{$b}\n}\n```\n\nThis subroutine uses the signed comparison operator,\
    \ <=, which returns -1, 0, or +1, depending on the results of the comparison.\
    \ Zero is returned when the two items being compared are the same, and -1 is returned\
    \ when the item on the left is less than the item on the right.\n\n```\nforeach\
    \ $word (sort numcmp keys(%words))\n{\n  print \"$word\\t$words{$word}\\n\";\n\
    }\n```\n\nIt might help to see the original hash and the results:\n\n```\nsort\
    \ numcmp keys(%words)\n```\n\nIf the original pairs were:\n\n```\nMike => 5\n\
    Zeke => 7\nAlice => 3\nMary => 10\n```\n\nthen the results of the above sort would\
    \ be:\n\n```\nAlice 3\nMike 5\nZeke 7\nMary 10\n```\n\nWe've listed the frequencies\
    \ with the keys so you can see the results of the orderings. If these keys were\
    \ presented in accordance with the above sort, the actual output would be:\n\n\
    ```\nAlice 3\nMike 5\nZeke 7\nMary 10\n```"
