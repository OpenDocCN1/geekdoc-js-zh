    Before we show how first.pl is executed, we need to make a slight diversion and
    mention a few differences between running your Perl scripts on a Unix system vs.
    running scripts on a Windows system. On Unix, the first line of every Perl script
    must appear as:


    ```

    #!/usr/bin/perl

    ```


    Unix programmers may recognize this. The first two characters are interpreted
    as special by any of the Unix shells. These two characters, #!, tell the Unix
    shell to use the command /usr/bin/perl to execute this script. So if you are on
    a Unix system, change the first line of your scripts to complete the pathname
    of the Perl executable, which in our case is #/usr/bin/perl.


    On Unix, after you have prepared your script, it should be made executable using
    the chmod command. We''ll use the % as the system prompt for all of our examples:


    ```

    % chmod 755 first.pl

    ```


    Now you can simply execute the program as follows:


    ```

    % first.pl

    ```


    On a Windows machine, the easiest way to proceed is to open a DOS window and type
    the following to execute first.pl. On Windows, the #! line is treated as a comment.


    ```

    % first.pl

    Please enter your name Michael

    Your name is Michael

    %",

    ```


    Here''s an example of how to execute this program on Unix:


    ```

    % first.pl

