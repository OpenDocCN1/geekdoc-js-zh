  md: "# 126\n\n# Chapter 7 • Subprograms\n\n```\nmysub;\n&mysub;\nmysub();\n&mysub();\n\
    ```\n\nHowever, if the subroutine is defined below its use, then the first form\
    \ cannot be used unless there has been a forward reference as we will see shortly.\
    \ This distinction is usually unimportant because Perl subroutines are written,\
    \ tested, and stored in libraries for use in any Perl scripts. Nevertheless, many\
    \ of the examples in this section will show subroutines in the same file from\
    \ which they are invoked simply so we can defer the topic of libraries for a short\
    \ time.\n\n```\n#!/usr/bin/perl\n#\n# subs.pl\n#\nsub sub2; # forward reference\n\
