  md: "# 134\n\n# Chapter 7 • Subroutines\n\n```\n{\n  $_[0] >= $_[1] ? $_[0] : $_[1];\n\
    \  print \"returning from bigger\\n\";n}\nprint \"Enter two numbers \";\n($a =\
    \ <STDIN>);\n($a, $b) = split;\nprint bigger($a, $b), \"is larger\\n\";\n```\n\
    \n```\n% bigger2.pl\nEnter two numbers 5 10\nreturning from bigger\n1 is larger\n\
    #\n```\n\nRemember that the last expression evaluated is what is returned. In\
    \ this case, it is the print statement that is evaluated. Although it is rarely\
    \ material, print returns the value if successful. If you use any debugging statements\
    \ inside a function, make sure the last statement inside the subroutine is not\
    \ one of them.\n\nSome subroutines can take any number of arguments, but this\
    \ one requires exactly two. What happens if the wrong number of arguments is passed\
    \ to a subroutine? It depends on your philosophy in writing the routine. If you\
    \ desire, you can issue an error message; or, if it makes sense, you can proceed\
    \ by processing the arguments received by the subroutine. We will show you how\
    \ to determine if the correct number of arguments were passed, but ultimately,\
    \ the decision of trapping this error or not rests with the writer of the subroutine.\n\
    \nIn the program below, the subroutine is invoked with too many arguments. As\
    \ you can see, this subroutine proceeds by processing the first two elements:\n\
    \n```\n#!/usr/bin/perl\n#\n# bigger3.pl\n#\nsub bigger\n(\n  $_[0] >= $_[1] ?\
    \ $_[0] : $_[1];\nn)\n@data = (5,10,20,30,8,50);\nprint bigger(@data), \"is larger\\\
    n\";\n```\n\n```\n% bigger3.pl\n10 is larger\n#\n```"
