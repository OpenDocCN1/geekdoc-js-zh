  md: "References to arrays have great utility in Perl. For example, the subroutine\
    \ lengths\nrece array references and returns an array consisting of the lengths\
    \ of the arrays being\nreferenced. We wrote a similar program previously using\
    \ typglobs. The function below\ncan receive any number of arrays:\n\n```\n#!/usr/bin/perl\n\
    #\n# lengths.pl\n#\nsub lengths\n{\n    my(@ans);\n    foreach $array (@_) {\n\
    \        push(@ans, scalar($array));\n    }\n    @ans;\n}\n@v1 = (10, 20, 30,\
    \ 40, 50, 60);\n@v2 = (10, 20, 30, 40, 50);\n@v3 = (10, 20, 30, 40);\n@results\
    \ = lengths(\\@v1, @\\v2, @\\v3);\nprint \"@results\\n\"\n% lengths.pl\n6 5 4\n\
    ```\n\nIn the program, the subroutine retrieves three references and loops through\
    \ them\nin the foreach loop. In each case, a scalar context is forced through\
    \ the use of the builtin\nscalar function. Thus, the length of each array referred\
    \ to is pushed on to the @ans array,\nwhich is ultimately returned to the caller.\n\
    \nKeep in mind that if you do not pass references in this case, and instead pass\
    \ arrays,\nthey be flattened into one long list and returned in @_.\n\n# 10.3.1\
    \ Prototypes.\n\nThe program works fine, but there is a slight burden to the\n\
    user of the lengths subroutine. The user must remember to pass references rather\
    \ than\narrays. It would be nice if the user could pass the actual array and the\
    \ subroutine\nbehave as references were sent. This is where a Perl prototype is\
    \ useful.\n\nA prototype is a set of symbols that inform Perl about incoming parameter\
    \ types. These\nsymbols are placed within a set of parentheses in back of the\
    \ function name. Some of the\nsymbols that may be used:\n\n+   * Force scalar\
    \ context on incoming arguments\n* Force array reference context\n* Rest of arguments\
    \ are optional"
