- img_proc: true
  md: "# Chapter 11 • Object-Oriented Programming\n\n```\nmy $s = {\n    NAME => $name,\n\
    \    MAJOR => $major,\n    COURSES => [@courses]\n};\nbless $s, $pkg;\nreturn\
    \ $s;\n};\n```\n\nThe first method that we will illustrate is called new. Its\
    \ purpose is to construct a new Student object. Note that the name of this method\
    \ is irrelevant, but in deference to C++ and Java, most Perl coders choose the\
    \ name new. Further, this method is typically referred to as the constructor for\
    \ the Student class because it is used to construct new Student objects.\n\nThe\
    \ intent is to invoke the constructor and pass to it the arguments it needs to\
    \ build a Student object. The Perl syntax for invoking the constructor is shown\
    \ below. For reasons that will become clear shortly, we also pass the package\
    \ name as the first argument.\n\n```\n@courses = (Calc, Trig, DiffE);\n$s1 = Student::new(Student,\
    \ Mike, Math, @courses);\n```\n\nThere is an alternative and equivalent way in\
    \ which to invoke the Student::new method:\n\n```\n$s1 = new Student(Mike, Math,\
    \ @courses);\n```\n\nThe alternative method is closer to the C++ and Java syntax.\
    \ When you use this form, Perl translates it to the original form. The following\
    \ two statements are equivalent:\n\n```\n$s1 = new Student(Mike, Math, @courses);\n\
    $s1 = Student::new(Student, Mike, Math, @courses);\n```\n\nThere is a third notation\
    \ that is equivalent to the first two:\n\n```\n$s1 = Student->new(Mike, Math,\
    \ @courses);\n```\n\nThe new method creates a reference to an anonymous hash,\
    \ and then fills the hash with parameters. Before this method returns the reference,\
    \ it adds to the reference an additional property, the package name, that is,\
    \ Student. This is accomplished with the bless function. Now the reference is\
    \ a blessed hash reference and not simply a hash reference. This additional property\
    \ will be useful when we discuss inheritance. Inheritance is the cornerstone of\
    \ object orientation. It allows you to define one class from another. For example,\
    \ a GradStudent class could be derived from a Student class."
