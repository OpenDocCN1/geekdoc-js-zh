  md: "# 6.3 Regular Expression Metacharacters\n\n```\n[abcdefghijklmnopqrstuvwxyz]\n\
    ```\n\n```\n[a-fA-F]\n[abcdefABCDEF]\n```\n\nThe following regular expression\
    \ matches a string that contains a lowercase character, followed by a digit, followed\
    \ by an uppercase character:\n\n```\n/[a-z] [0-9] [A-Z]/\n```\n\nThe dash only\
    \ has this special meaning when it is used to specify a range. In the following\
    \ example, the match is against any string with a dash followed by a digit. This\
    \ illustrates two distinct uses of the dash.\n\n```\n/-[0-9]/\n```\n\nThe caret\
    \ character (^) has a special meaning if it is the first character within square\
    \ brackets. In this case, it represents all characters except those that follow.\
    \ The program below prints lines that do not contain a digit. Note the importance\
    \ of chomping away the newline character. If you do not, the newline qualifies\
    \ as a non-digit character.\n\n```\nwhile (<STDIN>)\n  chomp:\n    print \"$_\\\
    n\" if /[^0-9]/;\n```\n\n# 6.3.3 Multiple-character matches\n\nYou may use a set\
    \ of curly braces to match multiple occurrences of characters. The numbers inside\
    \ the curly braces correspond to the character indicated at the left of the curly\
    \ braces. Here are several examples:\n\n```\n/[0-9]{2}x/\n```\n\nmatches exactly\
    \ 2 digits surrounded by the “x” character.\n\n```\n/[0-9]{2,5}x/\n```\n\nmatches\
    \ 2–5 digits surrounded by the “x” character.\n\n```\n/[0-9]{5,a}/\n```"
