  md: "Now we have done our own hashing! There's a problem, however! More than one\
    \ string could hash to the same value. This is called a collision, and it is evident\
    \ from the program output where is and si hash to the same value, as do life and\
    \ file.\n\nIn the example above, not all entries of the @table array will have\
    \ a value. We must test each element of the array to determine which elements\
    \ have a value.\n\n```\nif ($table[$i]) {\n    print $table[$i],\" \",\\$count[$i],\"\
    \\n\";\n}\n```\n\nOf course, the counts in the above program are incorrect because\
    \ of the collisions.\n\n# 5.1.3 Builtin hashing\n\nIt would not be difficult to\
    \ write code to handle the collisions. However, since this is a book about Perl\
    \ and not data structures, we will opt to use Perl's support for hashing, the\
    \ associative array. Whenever you code:\n\n```\n$hash{\"John\"} = 21;\n```\n\n\
    Perl stores the value 21 in the place in memory to which John hashes. Of course,\
    \ each time John is hashed, it will hash to the same value. Others may also hash\
    \ to that same value, but Perl handles the collisions. Here's the solution using\
    \ a Perl hash:\n\n```\n#!/usr/bin/perl\n#\n# assn.pl\n#\nwhile(<STDIN>) {\n  \
    \  @words = split;\n    foreach $word (@words) {\n        $words($word)++;\n \
    \   }\n}\nforeach $word (keys (%words)) {\n    print \"$word\\t$words{$word}\\\
    n\";\n}\n```\n\ncontinued..."
