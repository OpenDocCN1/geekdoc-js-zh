    # 1.2 Perl Variables


    Perl does not have a strict type system, although there is a distinction between
    three different kinds of variables. A scalar variable must begin with $. A scalar
    may hold a single value. An array variable must begin with @. An array is a collection
    of scalars. A hash variable must begin with #. A hash, sometimes called an associative
    array, hash pairs of values.


    Perl variables are case-sensitive. They may be composed of any number of characters.
    It is also allowable, albeit confusing to programmers, to have a scalar variable
    with the same name as an array variable, both of which have the same name as a
    hash. In other words, each of the following is a different variable:


    ```

    $names scalar named names

    @names array named names

    #names hash named names

    ```'
