    ```


    # 14.4.4 Scrollbars


    List boxes, text, and Entry widgets can also have scrollbars built around them.
    The most common way of creating a scroll is by using the Scrolled method when
    the parent window is created. The first argument to the Scrolled method specifies
    the type of widget to be created. The second argument specifies the placement
    of the scrollbars as follows:


    +   - Above widget

    - Below widget

    - At the right of the widget

    - At the left of the widget

    - Only display scrollbar if necessary'
