  md: "If you wish the substitution to occur on all occurrences of the match, you\
    \ must use the g modifier.\n\n```\n$_ = \"will illustrate the g\"\ns/11/(11)/g;\n\
    print \"$_\\n\"\n```\n\nwill produce:\n\n```\nthis wi(11) i(11)ustrate the g\n\
    ```\n\nThe g modifier has another use as well. Earlier we wrote the code to print\
