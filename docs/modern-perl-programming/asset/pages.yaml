    # 7.5 The Perl Standard Library


    As we have seen, programmers can always build their own libraries. There is, however,
    a standard Perl library that is delivered by the Perl distribution and located
    in the lib-directory of your Perl installation. This library contains many useful
    functions for Perl programs. We will illustrate the use of this library with the
    c function, which delivers the date and time as a string. You do not need to worry
    about @INC here because it has been pre-set to include the standard library directory.


    ```

    #!/usr/bin/perl

    #

    # usestdlib.pl

    #

    require "ctime.pl"

    $time = time;           # builtin time function

    print "$time";          # as an integer

    $x=ctime($time);       # standard library function

    print $x;               # date format

    % usestdlib.pl

    99800151

    Thu Sep 6 14:15:51 2001

    %

    ```


    # 7.6 Packages


    The scope of a variable refers to that section of the program where the variable
    can be accessed. In a Perl program without any subroutines, all variables are
    global to the program. We have seen how scope can be limited to a subroutine either
    dynamically with local, or lexically through the use of my. Now we will look at
    the Perl package capability that allows for a further division of scope.


    By default, a program has one package, the main package. You can create other
    packages by using the package statement. Packages provide a separate namespace
    that to avoid naming collisions. These collisions may happen if you are using
    libraries from two sources and each source happens to choose the same name for
    a function or a variable. Below is a simple package contained in Banking.pl:'
