    # 1.2.4 Arrays and STDIN


    Recall that the following code reads a line from the standard input:


    ```

    $name = <STDIN>;

    ```


    If the variable above been an array rather than a scalar, then Perl would have
    read the entire file into the array. Each line of the file would have become the
    next element of the array.


    ```

    @data = <STDIN>;              # read entire file

    ```


    This makes copying a file (STDIN to STDOUT) as easy as:


    ```

    @data = <STDIN>;              # read all lines from STDIN

    print @data;                             # print each element (i.e. each line)

    ```


    Of course, the key issue here is the fact that the variable at the left of the
    = is an array. Thus, we could read all the lines from any file as long as we have
    a filehandle associated with that file.


    ```

    open(INPUT, " mydata");      # open file named ''mydata''

    @lines = <INPUT>;                        # read all lines from file

    ```


    Many files have header information in the first line and the actual data in succeeding
    lines. Using the concept in this section, we can use the script justdata.pl to
    read such a file.'
