  md: "# Preface\n\n```\n#!/usr/bin/perl\n#\n# length.pl\nwhile ( 1 ) # always true\n\
    {\n    print \"-> \"; # issue a prompt\n    $line = <STDIN>; # read a line\n \
    \   chomp($line); # nix the newline\n    $len = length($line); # comp line length\n\
    \    print \"$len is length of $line\"\n}\n```\n\n# Standard input and standard\
    \ output redirections\n\nPerl matured on Unix. On those systems, there is a common\
    \ notion of two popular files—the standard input file (the keyboard) and the standard\
    \ output file (the display). This nomenclature has been adopted by the Windows\
    \ world as well. Thus, we will often speak of a program that reads from the standard\
    \ input, and we will also speak of a program that writes to the standard output.\
    \ The following program is one of them:\n\n```\n% addinput.pl\nter first number\
    \ 25\nter second number 50\nSum is 75\n%\n```\n\nThe < symbol may be used to redirect\
    \ the standard input so that the data can come from a disk file. The > symbol\
    \ may be used to redirect the standard output to a disk file. We will use these\
    \ notations whenever necessary. For example, the following demonstrates how to\
    \ read from a disk file and write to another disk file:\n\n```\n% printlines.pl\
    \ < outputfile\n```\n\nBecause of the < symbol, the program takes its input from\
    \ the file named inputFile rather than the keyboard. Likewise, the program directs\
    \ its output to the disk file named outputfile than to the display.\n\n# The newline\
    \ character\n\nIf you are a Unix user, you are familiar with the newline character.\
    \ It is generated when the user presses the Return (or Enter) key. Perl scripts\
    \ honor this convention regardless of the operating system."
