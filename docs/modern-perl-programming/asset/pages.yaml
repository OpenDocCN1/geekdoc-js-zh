    The wait call in the parent ensures that the parent does not progress until the
    child finishes. sleep causes a suspension in the program for a specified number
    of seconds.


    # 9.3.3 system


    The system may be used to execute any command-line command from your Perl script.
    system is similar to the combination of fork and exec, except you do not to handle
    any of the details. system can be invoked in any of the following ways:


    ```

    #

    # A string

    #

    system("dir"); # on Windows, for example

    #

    # A list whose first argument is a command

    #

    @command = ("ls", "-l", "/"); # on Unix, for example

    system(@command);

    ```


    system returns the value 0 on success and some non-zero value on failure. determine
    whether it succeeded or not, just code as below:


    ```

    system(@list) || die "your own message here\n";

    ```


    # 9.3.4 Back quotes


    When you use system, it is not possible to retrieve the standard output from the
    command you are executing. It is sent to the display. To execute a command-line
    command and have the output sent to your program, you may use the same technique
    that Unix programmers use.'
