  md: 'ize the way a Perl program is executed in this book, we will always use the
    % symbol as

    system prompt. If you are using Unix, the first line of every script needs to
    be:


    ```

    #!/usr/bin/perl

    ```


    where the first two characters are #! and the rest of the line is the complete
    pathname for

    the Perl executable. We used /usr/bin/perl, where it is located on Linux, but
    it may

    differ from on system.


    We will simply give the name of a Perl program to execute it, although on Windows,

    you''ll need to put the word "perl" in front of the executable file. On Unix,
    you will want

    to make each file executable by using the chmod command. We will not show the
    chmod

    command executed each time. We will simply show the execution of Perl scripts
    as

    follows:


    ```

    %countfiles.pl

    There are 10 files in the current directory

    %

    ```


    # Filenames for Perl scripts


    In the Perl world, there is no restriction on the naming of Perl executable files.
    Despite this

    lack of restriction, we will always name our example scripts with the .pl extension.


    # User input


    When a program requires user input, it will always be in boldface font, as shown
    in the fol-

    lowing example:


    ```

    % addinput.pl

    nEnter first number 25

    ter second number 30

    Sum is 75

    %

    ```


    # Displaying programs


    Whenever we display a program file, it will always have the same format. The first
    four

    lines will be comments. The first line will have the name of the Perl executable
    used to exe-

    cute script. There will be also comments to describe what each program is doing.

    Comments in Perl begin with the # character and are terminated with an end of
    line. Here

    is an example program file:'
  merge: -1
