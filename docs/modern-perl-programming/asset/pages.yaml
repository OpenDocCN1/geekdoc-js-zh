    # 3.1.9 Bit manipulation operators


    A programmer can spend many years writing software before running into a problem
    where the manipulation of bits is needed. On the other hand, if you are a systems
    programmer, you have undoubtedly run into many situations where these techniques
    are needed. Perl uses the same bitwise manipulation operators that C uses:


    ```

    bitwise logical not      ~

    bitwise logical and       &

    bitwise logical or       &

    bitwise exclusive or

    shift right               >>

    shift left               <<

    ```


    Here are a few examples of rudimentary bit manipulation operations. You can represent
    octal and hexadecimal constants in Perl by using a leading 0 or leading 0x, respectively,
    in front of a number. These constants are used in bit manipulation problems. Here
    are a few elementary bit operations:


    ```

    $x = 0555;          # ..000 101 101

    \$z = -$x             # ..111 010 010 010

    \$a = 0645;          # ..000 000 100 101

    \$b = 0666;          # ..000 000 110 110

    \$c = \$a | \$b       # ..000 000 110 111

    \$d = \$a & \$b       # ..000 000 100 100

    \$d = \$d << 11      # ..000 001 001 000

    ```


    The above lines of code are intentionally messy so that you can see the results
    of various bit manipulation operations. For completeness, we offer a function
