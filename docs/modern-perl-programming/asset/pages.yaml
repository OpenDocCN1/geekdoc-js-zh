    # 3.1.11 Some string functions


    We''ve already discussed the concatenation and replication operators. In reality,
    these are the only string operators. However, there are many string functions
    whose use is closely related to the string operators; therefore, we present them
    here.

    The length function returns the length of a string.


    ```

    $string="Susan\tis\tthe\npresident\ttthe\ncompany"

    $len = length($string); # length = 38

    ```


    Remember that the "\t" sequence represents the tab character and the "\n" sequence
    represents the newline character. Thus, each of these sequences counts as a single
    character in the code above.

    The index function returns the first position (zero-based) within a string where
    the second string is found or -1 if the second is not found. index can also have
    a third argument: an integer specifying how much to skip in the first string before
    you start indexing.


    ```

    $s = "if you don''t succeed, try again"

    $pos1 = index($s,"try"); # pos = 22

    $pos2 = index($s,"try"); # pos = -1

    $pos3 = index($s,"try", $pos1 + 1); # pos = 26

    ```


    The ridicul function behaves like index, but returns the index of the last occurrence
    of the second string.


    ```

    $s = "He had had had where she had had had"

    $pos = index($s,"had"); # pos = 37

    ```


    The substr function returns a portion of a string starting at a specified position
    for a specified length. If the length is not given, the entire string from the
    beginning position is returned.'
