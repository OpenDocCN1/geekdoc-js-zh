  md: "# 6.7.3 The e modifier\n\nAnother useful modifier is the e modifier. The replacement\
    \ string is evaluated as a Perl expression and the result of the expression is\
    \ substituted for the target.\n\n```\n#!/usr/bin/perl\n# square.pl\n#\nsub square\
    \ {\n    return $\\$[0] * $\\$[0];\n}\nwhile(<STDIN>) {\n    s/(\\d+)/square($1)/ge;\n\
    \    print;\n}\n```\n\n```\n. square.pl\n10 and 10 is 100\n100 and 100 is 10000\n\
    ```\n\nIn the code, each set of digits is remembered as $1 and then used in the\
    \ part of the substitution. Because of the e modifier, the expression square($1)\
    \ is evaluated. The result of this evaluation is then substituted for the target—the\
    \ set of digits.\n\n# 6.7.4 The m modifier\n\nAnother useful modifier is m (multiple).\
    \ This forces Perl to treat a string as if it has several lines within it. The\
    \ $ and ^ symbols are enforced at the beginning and end of each line rather than\
    \ for the entire string.\n\n```\n$text = \"This stringhas severalnewlines\\n\"\
    ;\nprint $text if $text =~^has/; # no match\nprint $text if $text =~has/m; # match\n\
    print $text if $text =~ing$/; # no match\nprint $text if $text =~ing$/m; # a match\n\
    ```"
