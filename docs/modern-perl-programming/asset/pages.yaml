  md: "# Defining Using Objects\n\nThe data contained in an object is composed of\
    \ many pieces. A Student object, for example, might contain the attributes NAME,\
    \ MAJOR, and COURSES. One way to model this in Perl code is to create an anonymous\
    \ hash as:\n\n```\n#!/usr/bin/perl\n#\n# object.pl\n#\n$student = {\n  NAME =>\
    \ Mike,\n  MAJOR => Math,\n  COURSES => [Calc, Trig, DiffE ]\n};\nprint $student->{NAME},\
    \ \"\\n\"\nprint $student->{MAJOR}, \"\\n\"\nprint \"@${student->{COURSES}}\"\
    , \"\\n\"\nprint \"@${student->{COURSES}}[1]\", \"\\n\";\n```\n\n```\n% object.pl\n\
    Mike\nMath\nCalc Trig DiffE\nTig\n%\n```\n\nThe above code demonstrates a way\
    \ to create a set of related data. But an object should be constructed more formally,\
    \ and in such a way that it knows to which class it belongs. In particular, there\
    \ should be a way to create as many Student objects as an application requires.\
    \ What is needed is correct packaging. To do this, we create a Student.pm whose\
    \ first line is:\n\nUltimately, we are creating a new data type named Student.\
    \ In this file, we place a method for the creation of a Student object. Any code\
    \ in this method would look similar to the code above. The application could use\
    \ this method as many times as it wished to create as many Student objects as\
    \ needed. Methods to implement behaviors for Student objects are required as well.\
    \ We will see them shortly. Here's how the file would appear with this new packaging:\n\
    \n```\n# Student.pm\n#\npackage Student;\nsub new\n{\n  my($pkg, $name, $major,\
    \ @courses) = @_;\n```\n\ncontinued..."
