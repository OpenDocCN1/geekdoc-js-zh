  md: '# 15.2.3 Data modification commands


    There are three types of data modification commands:

    insert--Add new rows to a table:


    ```

    insert into Staff values

    (13, "Tom", 57, "Sales", "MD", 0);

    ```


    ```

    update--Modify one or more columns of a table:

    ```


    ```

    update Staff set City = "Baltimore", where item = 1;

    ```


    ```

    delete--Delete rows from a table:

    ```


    ```

    delete from Staff where item = 13;

    ```


    There are also commands to return information about a database, such as the names
    of the tables and the names of the columns.


    # 15.3 Accessing a Database from Perl


    Now that we have seen several SQL commands, we will turn our attention to the
    database interface in Perl. To do this, we first have to learn about handles.


    # 15.3.1 Database handles


    Most database activity from a Perl script has to do with executing SQL commands
    from within a script, just like most I/O in a Perl program has to do with reading
    and writing files. Of course, with a file, you must first create a filehandle
    to be able to perform reads and writes. With a database, you must first connect
    to it before you can execute statements.


    Connecting to a database is a little more complex than opening a file because
    there are potentially more security issues involved. For example


    A database handle is created when connectivity to a database is established. Multiple
    database handles may be created. This might be the strategy to use if you want
    to connect to more than one database from the same script. Although the syntax
    for the connection usually involves the DBD name, a username, and a password,
    it is the DBD name that will'
