    ```

    print "is a match\n" if ( $input =~ m#throw );

    print "is a match\n" if ( $input =~ m!throw );

    print "is a match\n" if ( $input =~ m(throw) );

    ```


    You may also use the ~ operator to mean "does not match the pattern."


    ```

    print "is a match\n" if ( $input =~ m#throw );

    print "is a match\n" if ( $input =~ m!throw );

    print "is a match\n" if ( $input ~ m(throw) );

    print "is a match\n" if ( $input ~ //throw/ );

    ```


    If you use the slashes, the m operator is not necessary.


    ```

    print "is a match\n" if ( $input =~ /throw/ );

    print "is a match\n" if ( $input =~ m#throw );

    print "is a match\n" if ( $input =~ m!throw );

    ```


    If the target variable is $, then you may take some liberties in your code. Although
    the following are identical, last one is the preferred coding style:


    ```

    print "is a match\n" if ( $_ =~ m/throw/ );

    print "is a match\n" if ( m/throw/ );

    print "is a match\n" if ( /throw/ );

    ```


    Be careful about spaces. A space is a character like any other. Notice the difference
    between the two patterns. The first matches the five-letter pattern throw, while
    the second matches the seven-letter pattern surrounded by blanks.


    ```

    print "is a match\n" if ( /throw/ );

    print "is a match\n" if ( / throw / );

    ```


    A regular expression may also be contained in a variable as in:


    ```

    $_ = throw;

    print "matches" if $ARGV[0] / ;

    ```'
