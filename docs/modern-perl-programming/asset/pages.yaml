  md: "# 3.1 Perl Operators\n\n# 3.1.8 Logical operators\n\nLogical operators operate\
    \ on compound conditions. In Perl, these are \"short-circuit\" operators; they,\
    \ stop evaluating when they have determined the truth condition. The logical operators\
    \ are:\n\n```\nLogical not       !\nLogical and       &&\nLogical or       ||\n\
    ```\n\nYou may also use the English words not, and, or as respective synonyms\
    \ for the above operators.\nShort-circuit operators add efficiency to programs.\
    \ For example, if $x has the value zero, then it would be inefficient to evaluate\
    \ the second and third comparisons of the compound condition\n\n```\nif ($x ==\
    \ 0 || $y == 0 || $z == 0)\n{\n  # something\n```\n\nSometimes this can make a\
    \ difference in the flow of data through your program. For example, in the code\
    \ below, a line will be read only if $x does not have the value zero:\n\n```\n\
    if ($x == 0 || ($y = <STDIN>))\n{\n  # do something\n}\n```\n\nIn this particular\
    \ example, the inner parentheses are necessary. To understand why this is the\
    \ case, first notice that there are three operators in the evaluated condition.\
    \ Without the inner parentheses, they will be evaluated in the order =, |, , and\
    \ =, as if the condition had been parenthesized as:\n\n```\nif (($a == 0) || $b)\
    \ = <STDIN>)\n```\n\nNow you can see the problem! The evaluation of the || is\
    \ either true or false, generating a one or a zero. In either case, this constant\
    \ value cannot be the recipient of the line input with <STDIN>."
