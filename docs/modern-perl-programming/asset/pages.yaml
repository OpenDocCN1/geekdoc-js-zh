  md: "# CHAPTER\n6\nREGULAR EXPRESSIONS\n\nMany applications will have an opportunity\
    \ to validate data. In Perl, this is accomplished through pattern matching with\
    \ regular expressions. Although this is a common use for regular expressions,\
    \ there are many other uses as well. Among all programming languages, none can\
    \ match the power of regular expressions in Perl.\n\n# 6.1 Introduction\n\nA regular\
    \ expression is a string of characters, some with special meaning, that describes\
    \ patterns. The regular expression is compared to a target string to determine\
    \ whether the target string matches the regular expression or not. The regular\
    \ expression string is composed of a combination of characters, some of which\
    \ represent themselves, and some of which have a special meaning.\n\n# 6.2 The\
    \ Match Operator\n\nThe =~ operator is used to determine whether the target string\
    \ is a match or not. For example, to determine whether a string matches the string\
    \ throw, you would code:\n\n```\n$input = <STDIN>;nchop($input);\nif ( $input\
    \ =~ m/throw/ ) {\n    print \"input is a match\\n\";n}\n```"
