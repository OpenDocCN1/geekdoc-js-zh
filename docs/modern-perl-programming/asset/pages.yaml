  md: '# Introduction


    ```

    $AF_INET = 2;

    $SOCK_STREAM = 1;

    $proto_num = (getprotobyname(''tcp''))[3];

    socket($s, $AF_INET, $SOCK_STREAM, $proto_num) || die("$");

    ```


    The constants specify the type of stream. There are different types for different
    delivery services. For example, TCP requires one type of stream, while UDP receives
    another. There are also different domains, or families, such as the Internet domain
    or the Unix domain. Consult a different networking text to get all the details
    of these parameters. The last argument to the socket call is the protocol number
    of the socket being used.


    Once you have a socket, you need to bind the client to the socket. However, the
    bind function must already have this information in the correct format. It is
    this kind of detail that makes this style of programming difficult.


    ```

    $sockaddr = ''S n a4 x8''; # correct format

    $hostname = ''localhost''; # hostname

    ($client_addr) = (getprotobyname($host_name)) [4];

    $client = pack($sockaddr, $AF_INET, 0, $client_addr);

    bind($s, $client) || die("bind: $\$");

    ```


    Now the client must execute the connect function to connect to the server. Of
    course, the server must already have started or the client will fail at this step.
    The second parameter to the connect function must be a packed address of the remote
    server. The packing and connecting code is as follows:


    ```

    $port_number = 1500; # for example

    $server_name = ''localhost''; # hostname of server

    ($server_addr) = (gethostobyname($server_name)) [4];

    $server = pack($sockaddr, $AF_INET, $port_number, $server_addr);

    connect($s, $server) || die("connect: $\$");

    ```


    Once the connect function has been executed, the client can send data over socket
    S. In other words:


    ```

    print "send to display\n";nprint S "sent to server\n";

    ```


    If you put all of this together, you have:'
