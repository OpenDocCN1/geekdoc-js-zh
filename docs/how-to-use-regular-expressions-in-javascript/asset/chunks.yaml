  trans: "\n\n![](img/cover.jpeg)\n\n# 如何在 JavaScript 中使用正则表达式\n\nVLIGHT\n\n## 目录\n\
    \n- 修饰符\n  - ♥ i\n  - ♥ g\n  - ♥ m\n- 方括号\n  - ♥ [abc]\n  - ♥ [^abc]\n  - ♥ [0-9]\n\
    \  - ♥ [⁰-9]\n  - ♥ (x|y)\n- 元字符\n  - ♥ .\n  - ♥ \\w\n  - ♥ \\W\n  - ♥ \\d\n \
    \ - ♥ \\D\n  - ♥ \\s\n  - ♥ \\S\n  - ♥ \\b\n  - ♥ \\B\n  - ♥ \\0\n  - ♥ \\n\n\
    \  - ♥ \\f\n  - ♥ \\r\n  - ♥ \\t\n  - ♥ \\v\n  - ♥ \\xxx\n  - ♥ \\xdd\n  - ♥ \\\
    uxxxx\n- 量词\n  - ♥ n+\n  - ♥ n*\n  - ♥ n?\n  - ♥ n{X}\n  - ♥ n{X,Y}\n  - ♥ n{X,}\n\
    \  - ♥ n$\n  - ♥ ^n\n  - ♥ ?=n\n  - ♥ ?!n\n- RegExp 对象方法\n  - ♥ exec()\n  - ♥\
    \ test()\n  - ♥ toString()\n\n# 修饰符\n\n## ♥ i\n\n☺ 描述\n\n执行不区分大小写的匹配\n\n☺ 示例代码\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>点击按钮在字符串中执行不区分大小写的搜索 \"Youtube\"\
    。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"demo\"></p>\n<script>\n\
    function myFunction() {\n    var str = \"Visit youtube\";\n    var pattern = /Youtube/i;\n\
    \    var result = str.match(pattern);\n    document.getElementById(\"demo\").innerHTML\
    \ = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\nYoutube\n\n## ♥ g\n\
    \n☺ 描述\n\n执行全局匹配（查找所有匹配项，而不是在第一个匹配后停止）\n\n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<p>点击按钮在字符串中执行全局搜索 \"Welcome\"。</p>\n<button onclick=\"myFunction()\"\
    >测试</button>\n<p id=\"demo\"></p>\n<script>\nfunction myFunction() {\n    var\
    \ str = \"Welcome to my books! Again welcome\";\n    var pattern = /Welcome/g;\n\
    \    var result = str.match(pattern);\n    document.getElementById(\"demo\").innerHTML\
