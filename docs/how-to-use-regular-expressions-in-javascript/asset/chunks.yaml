- fmt: "\n![](cover.jpeg)\n\n# How to use Regular Expressions in JavaScript\n\nVLIGHT\n\
    \n## Table of Contents\n\n- Modifiers\n  - ♥ i\n  - ♥ g\n  - ♥ m\n- Brackets\n\
    \  - ♥ [abc]\n  - ♥ [^abc]\n  - ♥ [0-9]\n  - ♥ [^0-9]\n  - ♥ (x|y)\n- Metacharacters\n\
    \  - ♥ .\n  - ♥ \\w\n  - ♥ \\W\n  - ♥ \\d\n  - ♥ \\D\n  - ♥ \\s\n  - ♥ \\S\n \
    \ - ♥ \\b\n  - ♥ \\B\n  - ♥ \\0\n  - ♥ \\n\n  - ♥ \\f\n  - ♥ \\r\n  - ♥ \\t\n\
    \  - ♥ \\v\n  - ♥ \\xxx\n  - ♥ \\xdd\n  - ♥ \\uxxxx\n- Quantifiers\n  - ♥ n+\n\
    \  - ♥ n*\n  - ♥ n?\n  - ♥ n{X}\n  - ♥ n{X,Y}\n  - ♥ n{X,}\n  - ♥ n$\n  - ♥ ^n\n\
    \  - ♥ ?=n\n  - ♥ ?!n\n- RegExp Object Methods\n  - ♥ exec()\n  - ♥ test()\n \
    \ - ♥ toString()\n\n# Modifiers\n\n## ♥ i\n\n☺ Description\n\nPerform case-insensitive\
    \ matching\n\n☺ Sample Code\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click\
    \ the button to do a case-insensitive search for \"Youtube\" in a string.</p>\n\
    <button onclick=\"myFunction()\">Test</button>\n<p id=\"demo\"></p>\n<script>\n\
    function myFunction() {\n    var str = \"Visit youtube\";\n    var pattern = /Youtube/i;\n\
    \    var result = str.match(pattern);\n    document.getElementById(\"demo\").innerHTML\
    \ = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ Output\n\nYoutube\n\n##\
    \ ♥ g\n\n☺ Description\n\nPerform a global match (find all matches rather than\
    \ stopping after the first match)\n\n☺ Sample Code\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<p>Click the button to do a global search for \"Welcome\" in a\
    \ string.</p>\n<button onclick=\"myFunction()\">Test</button>\n<p id=\"demo\"\
    ></p>\n<script>\nfunction myFunction() {\n    var str = \"Welcome to my books!\
    \ Again welcome\";\n    var pattern = /Welcome/g;\n    var result = str.match(pattern);\n\
    \    document.getElementById(\"demo\").innerHTML = result;\n}\n</script>\n</body>\n\
    </html>\n```\n\n♣ Output\n\nWelcome\n\n## ♥ m\n\n☺ Description\n\nPerform multiline\
    \ matching\n\n☺ Sample Code\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click\
    \ the button to do a multiline search for \"Welcome\" at the beginning of each\
    \ line in a string.</p>\n<button onclick=\"myFunction()\">Test</button>\n<p id=\"\
    demo\"></p>\n<script>\nfunction myFunction() {\n    var str = \"\\nWelcome to\
    \ my books! \\nWelcome again!\";\n    var pattern = /^Welcome/m;\n    var result\
    \ = str.match(pattern);\n    document.getElementById(\"demo\").innerHTML = result;\n\
    }\n</script>\n</body>\n</html>\n```\n\n♣ Output\n\nWelcome\n\n# Brackets\n\n##\
    \ ♥ [abc]\n\n☺ Description\n\nFind any character between the brackets\n\n☺ Sample\
    \ Code\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click the button to do\
    \ a global search for the character \"o\" in a string.</p>\n<button onclick=\"\
    myFunction()\">Test</button>\n<p id=\"demo\"></p>\n<script>\nfunction myFunction()\
    \ {\n    var str = \"Welcome to my books!\";\n    var pattern = /[o]/g;\n    var\
    \ result = str.match(pattern);\n    document.getElementById(\"demo\").innerHTML\
    \ = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ Output\n\no,o,o,o\n\n##\
    \ ♥ [^abc]\n\n☺ Description\n\nFind any character NOT between the brackets\n\n\
    ☺ Sample Code\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click the button\
    \ to do a global search for characters NOT inside the brackets [o] in a string.</p>\n\
    <button onclick=\"myFunction()\">Test</button>\n<p id=\"demo\"></p>\n<script>\n\
    function myFunction() {\n    var str = \"Welcome to my books!\";\n    var pattern\
    \ = /[^o]/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
    demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ Output\n\
    \nW,e,l,c,m,e, ,t, ,m,y, ,b,k,s,!\n\n## ♥ [0-9]\n\n☺ Description\n\nFind any digit\
    \ between the brackets\n\n☺ Sample Code\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<p>Click the button to do a global search for the numbers 1 to 4 in a\
    \ string.</p>\n<button onclick=\"myFunction()\">Test</button>\n<p id=\"demo\"\
    ></p>\n<script>\nfunction myFunction() {\n    var str = \"1234567890\";\n    var\
    \ pattern = /[3-5]/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
    demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ Output\n\
    \n3,4,5\n\n## ♥ [^0-9]\n\n☺ Description\n\nFind any digit NOT between the brackets\n\
    \n☺ Sample Code\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click the button\
    \ to do a global search for numbers that are NOT 1 to 4 in a string.</p>\n<button\
    \ onclick=\"myFunction()\">Test</button>\n<p id=\"demo\"></p>\n<script>\nfunction\
    \ myFunction() {\n    var str = \"1234567890\";\n    var pattern = /[^3-5]/g;\n\
    \    var result = str.match(pattern);\n    document.getElementById(\"demo\").innerHTML\
    \ = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ Output\n\n1,2,6,7,8,9,0\n\
    \n## ♥ (x|y)\n\n☺ Description\n\nFind any of the alternatives specified\n\n☺ Sample\
    \ Code\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click the button to do\
    \ a global search for any of the specified alternatives (2|0).</p>\n<button onclick=\"\
    myFunction()\">Test</button>\n<p id=\"demo\"></p>\n<script>\nfunction myFunction()\
    \ {\n    var str = \"123456789024680\";\n    var pattern = /(2|0)/g;\n    var\
    \ result = str.match(pattern);\n    document.getElementById(\"demo\").innerHTML\
    \ = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ Output\n\n2,0,2,0\n\n# Metacharacters\n\
    \n## ♥ .\n\n☺ Description\n\nFind a single character, except newline or line terminator\n\
    \n☺ Sample Code\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click the button\
    \ to do a global search for \"W.l\" in a string.</p>\n<button onclick=\"myFunction()\"\
    >Test</button>\n<p id=\"demo\"></p>\n<script>\nfunction myFunction() {\n    var\
    \ str = \"Welcome to my books! Welcome again!\";\n    var pattern = /W.l/g;\n\
    \    var result = str.match(pattern);\n    document.getElementById(\"demo\").innerHTML\
    \ = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ Output\n\nWel,Wel\n\n##\
    \ ♥ \\w\n\n☺ Description\n\nFind a word character\n\n☺ Sample Code\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<p>Click the button to do a global search for\
    \ word characters in a string.</p>\n<button onclick=\"myFunction()\">Test</button>\n\
    <p id=\"demo\"></p>\n<script>\nfunction myFunction() {\n    var str = \"Welcome\
    \ to my books!.\";\n    var pattern = /\\w/g;\n    var result = str.match(pattern);\n\
    \    document.getElementById(\"demo\").innerHTML = result;\n}\n</script>\n</body>\n\
    </html>\n```\n\n♣ Output\n\nW,e,l,c,o,m,e,t,o,m,y,b,o,o,k,s\n\n## ♥ \\W\n\n☺ Description\n\
    \nFind a non-word character\n\n☺ Sample Code\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<p>Click the button to do a global search for non-word characters in a\
    \ string.</p>\n<button onclick=\"myFunction()\">Test</button>\n<p id=\"demo\"\
    ></p>\n<script>\nfunction myFunction() {\n    var str = \"Welcome to my books!.\"\
    ;\n    var pattern = /\\W/g;\n}\n</script>\n</body>\n</html>\n```\n"
