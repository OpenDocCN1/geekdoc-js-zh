  </html>\n```\n\n♣ 输出\n\n```\nIs,is\n```\n\n## RegExp 对象方法\n\n### ♥ exec()\n\n☺ 描述\n\
  \n在字符串中测试匹配。返回第一个匹配项\n\n☺ 语法\n\n`RegExpObject.exec(string)`\n\n☺ 参数\n\n`string`：必需，要搜索的字符串\n\
  \n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>The exec() method returns\
  \ the matched text if it finds a match, otherwise it returns null.</p>\n<p>Click\
  \ the button to search a string for the character \"o\".</p>\n<button onclick=\"\
  myFunction()\">Test</button>\n<p id=\"demo\"></p>\n<script>\nfunction myFunction()\
  \ {\n    var str = \"Welcome to my books!\";\n   var pattern = new RegExp(\"o\"\
