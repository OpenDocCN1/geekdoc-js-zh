  \ = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\n```\ntrue\n```\n\n###\
  \ ♥ toString()\n\n☺ 描述\n\n返回正则表达式的字符串值\n\n☺ 语法\n\n`RegExpObject.toString()`\n\n\
  ☺ 参数\n\n无\n\n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click the button\
