- "# JavaScript 正则表达式使用指南\n\n\n## 修饰符\n\n### ♥ i\n\n☺ 描述\n\n执行不区分大小写的匹配\n\n☺ 示例代码\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>点击按钮在字符串中执行不区分大小写的搜索 \"Youtube\"\
  。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"demo\"></p>\n<script>\n\
  function myFunction() {\n    var str = \"Visit youtube\";\n    var pattern = /Youtube/i;\n\
  \    var result = str.match(pattern);\n    document.getElementById(\"demo\").innerHTML\
  \ = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\nYoutube\n\n### ♥ g\n\
  \n☺ 描述\n\n执行全局匹配（查找所有匹配项，而不是在第一个匹配后停止）\n\n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<p>点击按钮在字符串中执行全局搜索 \"Welcome\"。</p>\n<button onclick=\"myFunction()\">测试</button>\n\
  <p id=\"demo\"></p>\n<script>\nfunction myFunction() {\n    var str = \"Welcome\
  \ to my books! Again welcome\";\n    var pattern = /Welcome/g;\n    var result =\
  \ str.match(pattern);\n    document.getElementById(\"demo\").innerHTML = result;\n\
  }\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\nWelcome\n\n### ♥ m\n\n☺ 描述\n\n执行多行匹配\n\
  \n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>点击按钮在字符串的每一行开头执行多行搜索 \"\
  Welcome\"。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"demo\"></p>\n\
  <script>\nfunction myFunction() {\n    var str = \"\\nWelcome to my books! \\nWelcome\
  \ again!\";\n    var pattern = /^Welcome/m;\n    var result = str.match(pattern);\n\
  \    document.getElementById(\"demo\").innerHTML = result;\n}\n</script>\n</body>\n\
  </html>\n```\n\n♣ 输出\n\nWelcome\n\n## 方括号\n\n### ♥ [abc]\n\n☺ 描述\n\n查找方括号内的任意字符\n\
  \n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>点击按钮在字符串中执行全局搜索字符 \"o\"\
  。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"demo\"></p>\n<script>\n\
  function myFunction() {\n    var str = \"Welcome to my books!\";\n    var pattern\
  \ = /[o]/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\no,o,o,o\n\
  \n### ♥ [^abc]\n\n☺ 描述\n\n查找不在方括号内的任意字符\n\n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<p>点击按钮在字符串中执行全局搜索不在方括号 [o] 内的字符。</p>\n<button onclick=\"myFunction()\"\
  >测试</button>\n<p id=\"demo\"></p>\n<script>\nfunction myFunction() {\n    var str\
  \ = \"Welcome to my books!\";\n    var pattern = /[^o]/g;\n    var result = str.match(pattern);\n\
  \    document.getElementById(\"demo\").innerHTML = result;\n}\n</script>\n</body>\n\
  </html>\n```\n\n♣ 输出\n\nW,e,l,c,m,e, ,t, ,m,y, ,b,k,s,!\n\n### ♥ [0-9]\n\n☺ 描述\n\
  \n查找方括号内的任意数字\n\n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>点击按钮在字符串中执行全局搜索数字\
  \ 1 到 4。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"demo\"></p>\n\
  <script>\nfunction myFunction() {\n    var str = \"1234567890\";\n    var pattern\
  \ = /[3-5]/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\n3,4,5\n\
  \n### ♥ [⁰-9]\n\n☺ 描述\n\n查找不在方括号内的任意数字\n\n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<p>点击按钮在字符串中执行全局搜索不是 1 到 4 的数字。</p>\n<button onclick=\"myFunction()\">测试</button>\n\
  <p id=\"demo\"></p>\n<script>\nfunction myFunction() {\n    var str = \"1234567890\"\
  ;\n    var pattern = /[³-5]/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\n1,2,6,7,8,9,0\n\
  \n### ♥ (x|y)\n\n☺ 描述\n\n查找指定的任意一个选项\n\n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<p>点击按钮在字符串中执行全局搜索指定的任意一个选项 (2|0)。</p>\n<button onclick=\"myFunction()\"\
  >测试</button>\n<p id=\"demo\"></p>\n<script>\nfunction myFunction() {\n    var str\
  \ = \"123456789024680\";\n    var pattern = /(2|0)/g;\n    var result = str.match(pattern);\n\
  \    document.getElementById(\"demo\").innerHTML = result;\n}\n</script>\n</body>\n\
  </html>\n```\n\n♣ 输出\n\n2,0,2,0\n\n## 元字符\n\n### ♥ .\n\n☺ 描述\n\n查找单个字符，除了换行或行终止符\n\
  \n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>点击按钮在字符串中执行全局搜索 \"W.l\"\
  。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"demo\"></p>\n<script>\n\
  function myFunction() {\n    var str = \"Welcome to my books! Welcome again!\";\n\
  \    var pattern = /W.l/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\nWel,Wel\n\
  \n## ♥ \\w\n\n☺ 描述\n\n查找单词字符\n\n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>点击按钮在字符串中执行全局搜索单词字符。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"\
  demo\"></p>\n<script>\nfunction myFunction() {\n    var str = \"Welcome to my books!.\"\
  ;\n    var pattern = /\\w/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\nW,e,l,c,o,m,e,t,o,m,y,b,o,o,k,s\n\
  \n## ♥ \\W\n\n☺ 描述\n\n查找非单词字符\n\n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>点击按钮在字符串中执行全局搜索非单词字符。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"\
  demo\"></p>\n<script>\nfunction myFunction() {\n    var str = \"Welcome to my books!.\"\
  ;\n    var pattern = /\\W/g;\n}\n</script>\n</body>\n</html>\n```\n\n\n\n\n\n```\n\
      var result = str.match(pattern);\n    document.getElementById(\"demo\").innerHTML\
  \ = result;\n}\n</script>\n</body>\n</html>\n```\n♣ 输出\n, , ,!,.\n\n## ♥ \\d\n####\
  \ ☺ 描述\n查找一个数字\n#### ☺ 示例代码\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>点击按钮对字符串中的数字进行全局搜索。</p>\n\
  <button onclick=\"myFunction()\">测试</button>\n<p id=\"demo\"></p>\n<script>\nfunction\
  \ myFunction() {\n    var str = \"Welcome to my books! 2nd 3rd 4th\";\n    var pattern\
  \ = /\\d/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n♣ 输出\n2,3,4\n\n\
  ## ♥ \\D\n#### ☺ 描述\n查找一个非数字字符\n#### ☺ 示例代码\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<p id=\"demo\">点击按钮对字符串中的非数字字符进行全局搜索。</p>\n<button onclick=\"myFunction()\"\
  >测试</button>\n<script>\nfunction myFunction() {\nvar str = \"Welcome to my books!\
  \ 2nd 3rd 4th\";\nvar pattern = /\\D/g;\nvar result = str.match(pattern);\ndocument.getElementById(\"\
  demo\").innerHTML=result;\n}\n</script>\n</body>\n</html>\n```\n♣ 输出\nW,e,l,c,o,m,e,\
  \ ,t,o, ,m,y, ,b,o,o,k,s,!, ,n,d, ,r,d, ,t,h\n\n## ♥ \\s\n#### ☺ 描述\n查找一个空白字符\n\
  #### ☺ 示例代码\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>点击按钮对字符串中的空白字符进行全局搜索。</p>\n\
  <button onclick=\"myFunction()\">测试</button>\n<p id=\"demo\"></p>\n<script>\nfunction\
  \ myFunction() {\n    var str = \"Welcome to my books!\";\n    var pattern = /\\\
  s/g;\n    var result = str.match(pattern);\n    document.getElementById(\"demo\"\
  ).innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n♣ 输出\n, ,\n\n## ♥ \\\
  S\n#### ☺ 描述\n查找一个非空白字符\n#### ☺ 示例代码\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>点击按钮搜索字符串中的非空白字符。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"\
  demo\"></p>\n<script>\nfunction myFunction() {\n    var str = \"Welcome to my books!\"\
  ;\n    var pattern = /\\S/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n♣ 输出\nW,e,l,c,o,m,e,t,o,m,y,b,o,o,k,s,!\n\
  \n### ♥ \b\n#### ☺ 描述\n查找单词开头或结尾处的匹配\n#### ☺ 示例代码\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<p>点击按钮对字符串中单词开头或结尾处的 \"boo\" 进行全局搜索。</p>\n<button onclick=\"myFunction()\"\
  >测试</button>\n<p id=\"demo\"></p>\n<script>\nfunction myFunction() {\n    var str\
  \ = \"Welcome to my books! books.\";\n    var pattern = /\\bboo/g;\n    var result\
  \ = str.match(pattern);\n    document.getElementById(\"demo\").innerHTML = result;\n\
  }\n</script>\n</body>\n</html>\n```\n♣ 输出\nboo,boo\n\n## ♥ \\B\n#### ☺ 描述\n查找不在单词开头或结尾处的匹配\n\
  #### ☺ 示例代码\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p id=\"demo\">点击按钮对字符串中不在单词开头或结尾处的\
  \ \"ok\" 进行全局搜索。</p>\n<button onclick=\"myFunction()\">测试</button>\n<script>\nfunction\
  \ myFunction() {\nvar str = \"Welcome to my books!\";\nvar pattern = /\\Bok/g;\n\
  var result = str.match(pattern);\ndocument.getElementById(\"demo\").innerHTML=result;\n\
  }\n</script>\n</body>\n</html>\n```\n♣ 输出\nok\n\n### ♥ \0\n#### ☺ 描述\n查找 NUL 字符\n\
  #### ☺ 示例代码\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>点击按钮返回字符串中 NUL 字符的位置。</p>\n\
  <button onclick=\"myFunction()\">测试</button>\n<p id=\"demo\"></p>\n<script>\nfunction\
  \ myFunction() {\n    var str = \"Hello JavaScript.\\0It is awesome!\";\n    var\
  \ pattern = /\\0/;\n    var result = str.search(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n♣ 输出\n17\n\n###\
  \ ♥ \n\n#### ☺ 描述\n查找换行符\n#### ☺ 示例代码\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>点击按钮返回字符串中换行符的位置。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"\
  demo\"></p>\n<script>\nfunction myFunction() {\n    var str = \"JavaScript.\\nIt\
  \ is awesome!\";\n    var pattern = /\\n/;\n    var result = str.search(pattern);\n\
      document.getElementById(\"demo\").innerHTML = result;\n}\n</script>\n</body>\n\
  </html>\n```\n♣ 输出\n11\n\n### ♥ \f\n#### ☺ 描述\n查找换页符\n#### ☺ 示例代码\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>点击按钮返回字符串中换页符的位置。</p>\n<button onclick=\"myFunction()\"\
  >测试</button>\n<p id=\"demo\"></p>\n<script>\nfunction myFunction() {\n    var str\
  \ = \"JavaScript.\\fIt is awesome!\";\n    var pattern = /\\f/;\n    var result\
  \ = str.search(pattern);\n    document.getElementById(\"demo\").innerHTML = result;\n\
  }\n</script>\n</body>\n</html>\n```\n♣ 输出\n11\n\n### ♥ \r\n#### ☺ 描述\n查找回车符\n####\
  \ ☺ 示例代码\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>点击按钮返回字符串中回车符的位置。</p>\n<button\
  \ onclick=\"myFunction()\">测试</button>\n<p id=\"demo\"></p>\n<script>\nfunction\
  \ myFunction() {\n    var str = \"JavaScript.\\rIt is awesome!\";\n    var pattern\
  \ = /\\r/;\n    var result = str.search(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n♣ 输出\n11\n\n###\
  \ ♥ \t\n#### ☺ 描述\n查找制表符\n#### ☺ 示例代码\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>点击按钮返回字符串中制表符的位置。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"\
  demo\"></p>\n<script>\nfunction myFunction() {\n    var str = \"JavaScript.\\tIt\
  \ is awesome!\";\n    var pattern = /\\t/;\n    var result = str.search(pattern);\n\
      document.getElementById(\"demo\").innerHTML = result;\n}\n</script>\n</body>\n\
  </html>\n```\n♣ 输出\n11\n\n### ♥ \v\n#### ☺ 描述\n查找垂直制表符\n#### ☺ 示例代码\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>点击按钮返回字符串中垂直制表符的位置。</p>\n<button onclick=\"myFunction()\"\
  >测试</button>\n<p id=\"demo\"></p>\n<script>\nfunction myFunction() {\n    var str\
  \ = \"JavaScript.\\vIt is awesome!\";\n    var pattern = /\\v/;\n    var result\
  \ = str.search(pattern);\n    document.getElementById(\"demo\").innerHTML = result;\n\
  }\n</script>\n</body>\n</html>\n```\n♣ 输出\n11\n\n## ♥ \\xxx\n#### ☺ 描述\n查找由八进制数\
  \ xxx 指定的字符\n#### ☺ 示例代码\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>点击按钮对字符串中的八进制数\
  \ 127 (W) 进行全局搜索。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"demo\"\
  ></p>\n<script>\nfunction myFunction() {\n    var str = \"Welcome to my books!\"\
  ;\n    var pattern = /\\127/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n♣ 输出\nW\n\n##\
  \ ♥ \\xdd\n#### ☺ 描述\n查找由十六进制数 dd 指定的字符\n#### ☺ 示例代码\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<p>点击按钮对字符串中的十六进制数 57 (W) 进行全局搜索。</p>\n<button onclick=\"myFunction()\"\
  >测试</button>\n<p id=\"demo\"></p>\n<script>\nfunction myFunction() {\n    var str\
  \ = \"Welcome to my books!\";\n    var pattern = /\\x57/g;\n    var result = str.match(pattern);\n\
      document.getElementById(\"demo\").innerHTML = result;\n}\n</script>\n</body>\n\
  </html>\n```\n♣ 输出\nW\n\n## ♥ \\uxxxx\n#### ☺ 描述\n查找由十六进制数 xxxx 指定的 Unicode 字符\n\
  #### ☺ 示例代码\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>点击按钮对字符串中的十六进制数 0057 (W)\
  \ 进行全局搜索。</p>\n<button onclick=\"myFunction()\">测试</button>\n<p id=\"demo\"></p>\n\
  <script>\nfunction myFunction() {\n    var str = \"Welcome to my books!\";\n   \
  \ var pattern = /\\u0057/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n♣ 输出\nW\n\n\n\n\
  \n\n## 量词\n\n### ♥ n+\n\n☺ 描述\n\n匹配任何包含至少一个 `n` 的字符串\n\n☺ 示例代码\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>Click the button to do a global search for at least\
  \ one \"o\" in a string.</p>\n<button onclick=\"myFunction()\">Test</button>\n<p\
  \ id=\"demo\"></p>\n<script>\nfunction myFunction() {\n    var str = \"Welcome to\
  \ my books!\";\n    var pattern = /o+/g;\n    var result = str.match(pattern);\n\
  \    document.getElementById(\"demo\").innerHTML = result;\n}\n</script>\n</body>\n\
  </html>\n```\n\n♣ 输出\n\n```\no,o,oo\n```\n\n### ♥ n*\n\n☺ 描述\n\n匹配任何包含零个或多个 `n`\
  \ 的字符串\n\n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click the button\
  \ to do a global search for an \"b\", followed by zero or more \"o\" characters.</p>\n\
  <button onclick=\"myFunction()\">Test</button>\n<p id=\"demo\"></p>\n<script>\n\
  function myFunction() {\n    var str = \"Welcome to my books! book\";\n    var pattern\
  \ = /bo*/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\n```\n\
  boo,boo\n```\n\n### ♥ n?\n\n☺ 描述\n\n匹配任何包含零个或一个 `n` 的字符串\n\n☺ 示例代码\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p>Click the button to do a global search for a\
  \ \"5\", followed by zero or one \"0\" characters.</p>\n<button onclick=\"myFunction()\"\
  >Test</button>\n<p id=\"demo\"></p>\n<script>\nfunction myFunction() {\n   var str\
  \ = \"51, 5000, 350, 35\";\n    var pattern = /50?/g;\n    var result = str.match(pattern);\n\
  \    document.getElementById(\"demo\").innerHTML = result;\n}\n</script>\n</body>\n\
  </html>\n```\n\n♣ 输出\n\n```\n5,50,50,5\n```\n\n### ♥ n{X}\n\n☺ 描述\n\n匹配任何包含连续 X\
  \ 个 `n` 的字符串\n\n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click the\
  \ button to do a global search for a substring that contains a sequence of three\
  \ digits.</p>\n<button onclick=\"myFunction()\">Test</button>\n<p id=\"demo\"></p>\n\
  <script>\nfunction myFunction() {\n   var str = \"5,555,5555,555555\";\n    var\
  \ pattern = /\\d{3}/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\n```\n\
  555,555,555,555\n```\n\n### ♥ n{X,Y}\n\n☺ 描述\n\n匹配任何包含连续 X 到 Y 个 `n` 的字符串\n\n☺ 示例代码\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click the button to global search\
  \ for a substring that contains a sequence of three to five digits.</p>\n<button\
  \ onclick=\"myFunction()\">Test</button>\n<p id=\"demo\"></p>\n<script>\nfunction\
  \ myFunction() {\n    var str = \"5,55,555,5555,55555,5555555\";\n    var pattern\
  \ = /\\d{3,5}/g;\n    var result = str.match(pattern);\n    document.getElementById(\"\
  demo\").innerHTML = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\n```\n\
  555,5555,55555,55555\n```\n\n### ♥ n{X,}\n\n☺ 描述\n\n匹配任何包含至少 X 个连续 `n` 的字符串\n\n\
  ☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click the button to global\
  \ search for a substring that contains a sequence of at least two digits.</p>\n\
  <button onclick=\"myFunction()\">Test</button>\n<p id=\"demo\"></p>\n<script>\n\
  function myFunction() {\n    var str = \"5,55,555,5555\";\n    var pattern = /\\\
