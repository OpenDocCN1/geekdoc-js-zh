  \ = result;\n}\n</script>\n</body>\n</html>\n```\n\n♣ 输出\n\n```\no\n```\n\n### ♥\
  \ test()\n\n☺ 描述\n\n在字符串中测试匹配。返回 `true` 或 `false`\n\n☺ 语法\n\n`RegExpObject.test(string)`\n\
  \n☺ 参数\n\n`string`：必需，要搜索的字符串\n\n☺ 示例代码\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
