  md: '# CHAPTER

    8 CONNECT


    NODE.JS PROVIDES basic APIs for common network applications. So far, you have
    looked at the basic APIs for TCP servers and an API for HTTP that builds on top
    of it.


    Under the images directory, you have four images:


    ```

    $ ls website/images/

    1.jpg 2.jpg 3.jpg 4.jpg

    ```


    Most real-world applications, however, perform a series of common tasks that you
    probably don''t want to re-implement on top of primitive APIs over and over again.


    The index.html simply displays the four images, and you want to access the website
    through http://localhost/ in other examples (see Figure 8-1):


    Connect is a toolkit that sits on top of the HTTP server to provide a new way
    of organizing code that interfaces with request and responses, around units called
    middleware.


    ```

    <html>My website/</html>

    ```


    ```

    <img src="images/1.jpg">

    <img src="images/2.jpg">

    <img src="images/3.jpg">

    <img src="images/4.jpg>

    ```


    To illustrate the benefits of code reuse through middleware, assume this sample
    structure for a website:


    ```

    $ ls website/

    index.html images/

    ```'
