  md: '# CHAPTER 3 • Blocking and Non-blocking IO 29


    +   - Node handles the first request and returns returns the books. The second
    request returns no books.

    - PHP returns books in both cases.


    The difference lies in the fundamental schemes. Node is a long-running process,
    whereas Apache spawns multiple threads (one per request), which start with a fresh
    state every time. In PHP, the next interpreter runs, the variable $books gets
    repopulated, whereas in Node, the function serveBooks gets called again, and the
    scope variable is not affected.


    ```

    | | APACHE |

    |---------+-------+

    | | |

    | +--+---+--+

    | +---++---+---+

    | PHP | PHP | PHP |

    | | | | |

    | THREAD | THREAD | THREAD |

    | +--+---+---+--+

    | | |

    |---------+-------+---------+

    | REQUEST | REQUEST | REQUEST |

    |---------+-------+---------+

    ```


    ```

    | | |

    | NODE.JS |

    | | |

    | PROCESS |

    | | |

    |---------+--------+

    | | |

    | REQUEST | REQUEST | REQUEST |

    |---------+-------+---------+

    ```


    With great power comes great responsibility.


    Keeping this in mind at all times is essential for writing Node.JS programs that
    don''t experience problems during their executions.


    An equally important aspect is understanding what is meant by blocking and non-blocking
    IO.


    # BLOCKING-NESS


