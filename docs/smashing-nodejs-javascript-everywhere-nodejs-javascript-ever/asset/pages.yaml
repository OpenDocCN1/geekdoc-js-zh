    \ this case,\nfindOne:\n\n```\napp.post('/login', function (req, res) {\n  User.findOne({\
    \ email: req.body.user.email, password: req.body.user.password },\n  function\
    \ (err, doc) {\n    if (err) return next(err);\n    if (!doc) return res.send('<p>User\
    \ not found. Go back and try again>');\n    req.session.loggedIn = doc._id.toString();\n\
    \    res.redirect('/');\n  });\n});\n```\n\nAs mentioned before, models can be\
    \ used statically (as shown in those two examples), but\nare are also constructors.\n\
    \nThe POST signup route shows thus as follows:\n\n```\napp.post('/signup', function\
    \ (req, res, next) {\n  var user = new User(req.body.user).save(function (err)\
    \ {\n    if (err) return next(err);\n    res.redirect('/login/' + user.email);\n\
    \  });\n});\n```"
