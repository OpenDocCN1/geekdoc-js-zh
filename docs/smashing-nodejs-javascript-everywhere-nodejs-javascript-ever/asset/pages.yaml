  md: "A similar example is console, which was originally implemented by Firebug,\
    \ the Firefox plugin to aid development. As a result, Node includes a global console\
    \ object with useful methods, such as console.log and console.error.\n\n# THE\
    \ MODULE SYSTEM\n\nJavaScript, in its pure form, is a world of globals. The APIs\
    \ that are normally used in the browser setTimeout, document, and so on are globally\
    \ defined.\n\nWhen you include third-party modules, the expectation is that they\
    \ also expose a global variable (or many). For example, when you include <script\
    \ src=\"http://code.jquery-1.6.0.js\"> in an HTML document, you later refer to\
    \ this module through the global jquery object:\n\n```\n<script>\n(function ()\
    \ {\n  alert('hello world!');\n})}\n</script>\n```\n\nThe fundamental reason for\
    \ this is that in its specification, JavaScript doesn't describe an API for module\
    \ dependency and isolation. As a result, including multiple \"modules\" in this\
    \ way results in a pollution of the global namespace and potential naming collisions.\n\
    \nNode ships with a lot of useful modules that are the fundamental toolkit for\
    \ building out modern applications; they include http, net, fs, and many more.\
    \ And as you saw in Chapter 1, \"The Setup,\" especially with the help of NPM,\
    \ you can easily install hundreds of more.\n\nInstead of defining a number of\
    \ globals (or evaluating a lot of code that you might not use), Node decided to\
    \ implement a simple yet extremely powerful module system, the roots of which\
    \ are three globals: require, module, and exports.\n\n# ABSOLUTE AND RELATIVE\
    \ MODULES\n\nI use the term absolute modules for the ones that Node finds by internally\
    \ inspecting the node_modules directory, or modules that Node ships within its\
    \ core, like fs.\n\nAs you saw in Chapter 1, if you have a colors module installed,\
    \ its path becomes /node_modules/colors.\n\nTherefore, you can require that module\
    \ by its name without pointing to any directory:\n\n```\nrequire('colors')\",\n\
    ```"
