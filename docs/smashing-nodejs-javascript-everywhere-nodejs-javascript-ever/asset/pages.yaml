  md: '# CHAPTER 16 • Testing 293


    Expect.js is completely interoperable with any module that already works with
    assert. Just like any of the functions exposed in the assert module, when an expectation
    is not met, an AssertionError is thrown.


    Some of the most useful methods exposed by expect.js as of 0.1.2 are the following:


    +   * ok: Asserts that the value is true or not

    expect(1).to.be.ok();

    expect(true).to.be.ok();

    expect((1)).to.be.ok();

    expect(0).to.not.be.ok();


    +   * be / equals: === equality

    expect(1).to.be(1);

    expect(NaN).to.not.equal(NaN);

    expect(1).not.be.true(true);

    expect(''1'').to.not.be(1);


    +   * eql: Asserts loose equality that works with objects

    expect({a: ''b''}).to.eql({a: ''n''});

    expect(1).to.eql(''1'');


    +   * a/an: Asserts type with support for array type and instanceof

    // type with optional array

    expect(5).to.an(''number'');

    expect([1]).to.an(''array''); // works

    expect({1}).to.an(''object''); // works too, since it uses typeof

    // constructors

    expect(5).to.be(Number);

    expect([1]).to.be(Array);

    expect(tobi).to.be(Ferret);

    expect(person).to.be.a(Mammal));


    +   * match: Asserts String expression match

    expect(program.version).to.match(/[0-9]+\.[0-9]+\.[0-9]+/);


    +   * contain: Asserts indexOf for an array or string

    expect([1, 2]).to.contain(1);

    expect(''hello world'').to.contain(''world'');


    +   * length: Asserts that an array is empty or not

    expect({}).to.have.length(0);

    expect([1,2,3]).to.have.length(3);


    +   * empty: Asserts that an array is empty or not

    expect({}).to.be.empty();

    expect([1,2,3]).to.not.be.empty();


    +   * property: Asserts presence of an property (and value optionally)

    expect(window).to.have.property(''expect'');expect(window).to.have.

    property(''expect'', ''expect'');

    expect({a: ''b''}).to.have.property(''a'');'
