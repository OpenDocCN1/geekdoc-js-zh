  md: "# maxAge\n\nThe static middleware takes an option called max that specifies\
    \ how long a certain resource can be cached in the client's user agent. This capability\
    \ is useful when you know a certain asset is not going to change, and you don't\
    \ want the user's browser to re-request it.\n\nFor example, it's common practice\
    \ for web applications to bundle all the client-side JavaScript into a file that\
    \ represents a revision number. You can add the maxAge option to ensure it gets\
    \ cached forever:\n\n```\nserver.use('/js', connect.static('/path/to/bundles/',\
    \ { maxAge: 10000000000000 }));\n```\n\n# hidden\n\nThe other option static takes\
    \ hidden. If this option is set to true, Connect serves files that begin with\
    \ a dot (.) and are considered hidden in Unix systems:\n\n```\nserver.use(connect.static('/path/to/resources/',\
    \ { hidden: true }));\n```\n\n# QUERY\n\nSometimes in your applications you have\
    \ optional data associated with a URL that you send as part of the query string.\n\
    \nFor example, the client url /blog-posts?page=5. If you point your browser to\
    \ that URL, Node populates req.url with a string:\n\n```\nserver.use(function\
    \ (req) {\n  // req.url = \"/blog-posts?page=5\"\n});\n```\n\nMost likely, though,\
    \ you actually want to access the value contained in that querystring.\n\nIf you\
    \ implement the query middleware, you get a req.query object automatically with\
    \ those values:\n\n```\nserver.use(connect.query);\nserver.use(function (req,\
    \ res) {\n  // req.query.page == \"5\"\n});\n```\n\nAgain, parsing the query string\
    \ is a common task for applications that Connect greatly simplifies. Just as in\
    \ the static example where you stopped including the require call for the fs module,\
    \ you no longer need to worry about using the querystring module.\n\nThis middleware\
    \ is included automatically for you in Express, the web framework subject of the\
    \ next chapter. Another very useful middleware is logger, which is described next."
  merge: -1
