    \ you made sure to store isLoggedIn as a string by calling the toString method.\n\
    \nRemember to remove the { authenticated: false } test value you set up earlier\
    \ in the index route, which should now look like this (see Figure 12-4):\n\n![](img/c641d3b47d2abe2a65f037111c97ed26_229_0.png)\n\
    \n```\napp.get('/', function (req, res) {\n  res.render('index');\n});\n```\n\n\
    Figure 12-4: The screen after the user successfully logs in\n\nThe previous application\
    \ didn't take into consideration a few fundamental features that real-world applications\
    \ require. The following three sections discuss those features.\n\n# VALIDATION\n\
    \nWhat happens if the user submits a form that's too large? In the previous example,\
    \ he could potentially insert a large document right into the database.\n\nIn\
    \ addition, you might want to ensure that the email field is actually an email\
    \ field prior to storing it and that the password is at least six characters long\
    \ and a string and not a Date or Number.\n\nYou also don't want to repeat these\
    \ rules every time you create, update, or query your database."
  merge: -1
  pgno: 229
- img_proc: true
  md: "Mongoose solves this problem by allowing you to define schemas in your application\
    \ layer that enforce certain properties but are still flexible and easily modifiable.\
    \ They are called models.\n\n# ATOMICITY\n\nSay you're writing a blogging engine\
    \ on top of Express MongoDB. Naturally, one of the sections of the application\
    \ allows you to edit the title and content of the post and maybe another allows\
    \ you to edit and remove tags.\n\nMongoDB document-oriented design fits this situation\
    \ perfectly. In the posts collection, you might imagine a document that looks\
    \ like this:\n\n```\n{\n  \"title\": \"I just bought Smashing Node.JS\"\n  \"\
    author\": \"John Ward\"\n  \"content\": \"I went to the bookstore and picked up.\
    \ ..\"\n  \"tags\": [\"node.js\", \"learning\", \"book\"]\n}\n```\n\nNow at the\
    \ same time, user A is trying to edit the title of the document and user B is\
    \ trying to add a tag.\n\nIf you use an update operation with a copy of the entire\
    \ document each, only one copy prevails. One of the users is unable to make his\
    \ change.\n\nIf you want to ensure the atomicity of an operation, MongoDB exposes\
    \ different operators such as $set and $push:\n\n```\ndb.blogposts.update({ _id:\
    \ <id> }, { $set: { title: 'My title' } })\ndb.blogposts.update({ _id: <id> },\
    \ { tags: { push: 'new tag' } })\n```\n\nMongoose solves this by detecting the\
    \ changes you make to a document and altering only the specific properties affected.\
    \ If you're operating on an array (including arrays of documents), atomicity is\
    \ still retained.\n\n# SAFE MODE\n\nWhen you use the driver, as mentioned earlier,\
    \ you can optionally supply a hash of options to operations:\n\n```\napp.users.insert({\
    \ }, { <options> })\n```\n\nOne of those options is called safe, which enables\
    \ the safe mode of making changes to the database."
  merge: -1
  pgno: 230
- img_proc: true
  md: "By default, MongoDB does not notify you right away after an error occurs after\
    \ an operation. The driver needs to make a special call db.getLastError after\
    \ the operation is executed to find out whether the data is altered successfully.\n\
    \nThe reason behind this is that in many applications, speed is more important\
    \ than knowing whether a particular operation failed. For example, if you keep\
    \ a collection of logs, missing some of them isn't the end of the world, maximizing\
    \ performance is desired.\n\nMongoose, by default, enables safe mode for all operations,\
    \ and you can still turn it off if required.\n\n# INTRODUCING MONGOOSE\n\nAs usual,\
    \ the first thing you want to do starting with Mongoose is to define it in your\
    \ package.json as a dependency and then to require it:\n\n```\nvar mongoose =\
    \ require('mongoose')\n```\n\nThe first simplification that Mongoose makes over\
    \ the raw driver is that it assumes most applications work with a single database,\
    \ which makes getting started significantly easier. To connect, you simply call\
    \ mongoose.connect with a mongodb:// URI:\n\n```\nmongoose.connect('mongodb://localhost/my_database');\n\
    ```\n\nIn addition, with mongoose it doesn't matter when the connection is actually\
    \ established, as it will buffer commands and send them to MongoDB as soon as\
    \ it connects. This means you don't have to listen on a connection callback. You\
    \ can connect and start querying in the following line.\n\n# DEFINING A MODEL\n\
    \nModels are simply instances of the Schema class. When you specify a field, you\
    \ simply use the JavaScript native constructor that matches the desired type:\n\
    \n```\nvar Schema = mongoose.Schema(\n, ObjectId = Schema.ObjectId;\n\nvar PostSchema\
    \ = new Schema({\n  author : ObjectId\n  title : String\n  body : String\n  date\
    \ : Date\n});\n```\n\nThese types are:\n\n+   - Date\n- String"
  merge: -1
  pgno: 231
- img_proc: true
  md: "+   - Number\n\n+   - Array\n\n+   - Object\n\nIn addition, MongoDB has a specific\
    \ type ObjectId, which you can reference as Schema.ObjectId.\n\nIn the example\
    \ of this blog post, you can store the ObjectId of the user who created the blog\
    \ post.\n\nMongoose accepts different options for any given key. When you want\
    \ to supply options, you need to reference the aforementioned constructors as\
    \ a type key in an object. As an example, if you want a key to be automatically\
    \ populated with a default, you would pass the default and type options as follows:\n\
    \n```\nvar PostSchema = new Schema({\n  author : ObjectId\n  title : { type: String,\
    \ default: 'Untitled' }\n  body : String\n  date : Date\n});\n```\n\nAfter creating\
    \ the Schema, you register a Model with mongoose:\n\n```\nvar Post = mongoose.model('BlogPost',\
    \ PostSchema);\n```\n\nMongoose sets your collection name to blogposts for this\
    \ case, unless you specify other-via the third parameter. It always lowercases\
    \ and pluralizes the name of your model, convention.\n\nIf you want to retrieve\
    \ the Model later, you can call mongoose.model with just one parameter:\n\n```\n\
    var Post = mongoose.model('BlogPost');\n```\n\nYou can then operate on it. If\
    \ you want to create a blog post, all you need to do is the new operator:\n\n\
    ```\nnew Post({ title: 'My title' }).save(function (err) {\n  console.log('that\
    \ was easy!');\n});\n```\n\nIt's important to note that the Schema is just a simple\
    \ abstraction that describes what your model looks like and how it works. The\
    \ interaction with the data occurs in the model, not the Schema.\n\nTherefore,\
    \ when it comes to querying, you execute the static Post.find (or others, which\
    \ are listed below) as opposed to initializing a Post with the new keyword."
  merge: -1
  pgno: 232
- img_proc: true
  md: "# DEFINING NESTED KEYS\n\nFor the sake of organization, sometimes it's useful\
    \ to organize keys within substructures.\n\n```\nvar BlogPost = new Schema({\n\
    \  author : ObjectId\n  title : String\n  body : String\n  meta : {\n    votes\
    \ : Number\n    favs : Number\n  }\n});\n```\n\nIn MongoDB, use you dot notation\
    \ to operate on these properties. If you want to find by number of votes, for\
    \ example, you define your query like this:\n\n```\ndb.blogposts.find({ 'meta.votes':\
    \ 5 })\n```\n\n# DEFINING EMBEDDED DOCUMENTS\n\nIn MongoDB, documents can be big\
    \ and deep. This means that if you have a document for your blog post, you can\
    \ include the comments inside it instead of in a separate collection:\n\n```\n\
    var Comments = new Schema({\n  title : String\n  body : String\n  date : Date\n\
    });\n```\n\n```\nvar BlogPost = new Schema({\n  author : ObjectId\n  title : String\n\
    \  body : String\n  buf : Buffer\n  date : Date\n  comments : [Comments]\n  meta\
    \ : {\n    votes : Number\n    favs : Number\n  }\n});\n```\n\nMongoose also naturally\
    \ allows you to define the types that you expect for that field.\n\n# SETTING\
    \ UP INDEXES\n\nAs I mentioned before, indexes are a key ingredient to ensuring\
    \ fast queries in a MongoDB database."
  merge: -1
  pgno: 233
- img_proc: true
  md: "In order to set up an index for any given key, pass an option index with the\
    \ Boolean value true to it.\n\nAs an example, if you want to index by the title\
    \ key, and set the uid key as unique:\n\n```\nvar BlogPost = new Schema({\n  author:\
    \ ObjectId\n  , title: { type: String, index: true }\n  , uid: { type: Number,\
    \ unique: true }\n});\n```\n\nTo set up more complicated indexes (like compound\
    \ indexes), you can leverage the static index method:\n\n```\nBlogPost.post.index({\
    \ key: -1, otherKey: 1 });\n```\n\n# MIDDLEWARE\n\nIn most applications of respectable\
    \ size, sometimes the data is altered in different ways and places.\n\nCentralizing\
    \ the interaction with your database around a model interface is a useful way\
    \ of avoiding code repetition.\n\nMongoose aids with this goal by introducing\
    \ middleware. Middleware in Mongoose works in a similar fashion to Express middleware.\
    \ You can define methods that are executed prior to distinct actions: save and\
    \ remove.\n\nFor example, you want to email an author when his blog post is removed:\n\
    \n```\nBlogpost.pre('remove', function (next) {\n  emailAuthor(this.email, 'Blog\
    \ post removed!');\n  next();\n});\n```\n\nYou can define middleware multiple\
    \ times per action to perform any sort of operation, especially asynchronous ones.\n\
    \n# INSPECTING THE STATE OF THE MODEL\n\nMany times, you want to perform actions\
    \ that depend on what changes have been made to the particular instance of your\
    \ model you are interacting with:\n\n```\nBlogpost.pre('save', function (next)\
    \ {\n  if (this.isNew) {\n    // doSomething\n  } else {\n    // doSomethingElse\n\
    ```"
  merge: -1
  pgno: 234
- img_proc: true
  md: "# 224 PART IV\n\n}\n));\n\nYou can also access what keys have been altered\
    \ by referencing this.dirtyPaths.\n\n# QUERING\n\nAll the common operations are\
    \ exposed to the Model instance:\n\n+   - find\n- findOne\n- remove\n- update\n\
    - count\n\nMongoose also findById, which takes an ObjectId and matches it against\
    \ the _id property of your document.\n\n# EXTENDING QUERIES\n\nIf you don't supply\
    \ a callback to a particular Query, you can keep mutating until you call run:\n\
    \n```\nPost.find({ author: '4ef2cbff1bd9807fa7000001' )\n  .where('title', 'My\
    \ title')\n  .sort('content', -1)\n  .limit(5)\n  .run(function(err, post) {\n\
    \    //\n    ..\n  })\n```\n\n# SORTING\n\nTo sort, simply supply the key and\
    \ its direction:\n\n```\nquery.sort('key', 1)\nquery.sort('some.key', -1)\n```\n\
    \n# MAKING SELECTIONS\n\nIf you have large documents and want to select only certain\
    \ keys, you can call Query#select.\n\nFor example, if you want to show a list\
    \ of blog posts with links, you don't need to retrieve all the fields (some of\
    \ which could be really large):\n\n```\nPost.find()\n  .select('field', 'field2')\n\
    ```"
  merge: -1
  pgno: 235
- img_proc: true
  md: "# LIMITING\n\nIf you want to limit the number of results to a certain ceiling,\
    \ call `Query#limit:`\n\n```\nquery.limit(5)\n```\n\n# SKIPPING\n\nTo skip a certain\
    \ number of documents, you use\n\n```\nquery.skip(10)\n```\n\nThis capability\
    \ is useful in combination with `Model#count` to do pagination:\n\n```\nPost.count(function\
    \ (err, totalPosts) {\n  var numPages = Math.ceil(totalPosts / 10);\n});\n```\n\
    \n# POPULATING KEYS AUTOMATICALLY\n\nIn the `BlogPost` model example, you store\
    \ the ID of the user who owns it as the `author` property.\n\nMany times, querying\
    \ a blog post, you also want to retrieve the associated user. You can supply the\
    \ `ref` property to an `ObjectId` type:\n\n```\nvar BlogPost = new Schema({\n\
    \  author: { type: ObjectId, ref: 'Author' }\n  title: String\n  body: String\n\
    \  meta: {\n    votes: Number\n    favs: Number\n  }\n});\n```\n\nYou can later\
    \ query documents that autopopulate the author! Simply call `populate` for each\
    \ key that you want to populate:\n\n```\nPost.find({ title: 'My title'})\n.populate('author')\n\
    .run(function (err, doc) {\n  console.log(doc.author.email);\n});\n```\n\n# CASTING\n\
    \nBecause Mongoose knows in advance what data types to expect, it always tries\
    \ to `cast` types for you."
  merge: -1
  pgno: 236
- img_proc: true
  md: "# 226 PART IV\n\nFor example, assume you have an age property, and you indicate\
    \ in your Schema Number. If someone posts a regular form on your website, chances\
    \ are that if no JSON or custom logic is involved, you receive a string instead\
    \ of a number. Mongoose takes advantage of the fact that you are dealing with\
    \ a dynamic language and has no problem converting '21' (as String) to 21 (as\
    \ Number) prior to its storage.\n\nThe same occurs for the ObjectId. In the previous\
    \ example, you had to leverage the $oid modifier to make the query with an ObjectId\
    \ string successful, but this is something far common to be so verbose. If you\
    \ pass \"4ef2cbd77bb50b163a7000001\" to Mongoose, it is cast automatically to\
    \ ObjectId (\"4ef2cbd77bb50b163a7000001\"),\n\nIn addition, if a value mismatch\
    \ occurs the casting fails, Mongoose raises a validation error and prevents the\
    \ document from being stored. This behavior ensures ease of use while preserving\
    \ consistent and clean storage of your documents.\n\n# A MONGOOSE EXAMPLE\n\n\
    Just like you did with the node http module, improved by Connect and later Express,\
    \ you're going to see what Mongoose brings to the table in terms of expressiveness\
    \ by refactoring your previous application.\n\nTo kick it off, you'll create a\
    \ new package.json with the mongoose dependency.\n\n# SETTING UP THE APPLICATION\n\
    \nYour new package.json file should look like this:\n\n```\n{\n  \"name\": \"\
    mongoose-example\",\n  \"version\": \"0.0.1\",\n  \"dependencies\": {\n    \"\
    express\": \"2.5.2\",\n    \"mongoose\": \"2.5.10\"\n  }\n}\n```\n\nTry out that\
    \ it works successfully by running npm install, as usual. Next, you'll work on\
    \ refactoring your main server code.\n\n# REFACTORING\n\nCopy your server.js file\
    \ and views from the previous example in this chapter to get started.\n\nThe first\
    \ thing you'll want to do is replace the requirement for the mongodb module for\
    \ mongoose, since it's no longer present in the package.json file. Internally,\
    \ mongoose leverages the mongodb module for us."
  merge: -1
  pgno: 237
- img_proc: true
  md: "# CHAPTER 12 • MongoDB 227\n\nThe top part of your server.js file should now\
    \ look like this:\n\n```\n/**\n * Module dependencies.\n */\n\nvar express = require('express')\n\
    \n mongoose = require('mongoose')\n```\n\nNow you're going to focus on the bottom\
    \ part of the file, where the connection to the database occurs\n\n```\n/**\n\
    \ * Connect to the database.\n */\n\nvar server = new mongoose.Server('127.0.0.1',\
    \ 27017)\n // .\n```\n\nAs mentioned before, mongoose greatly simplifies how you\
    \ connect to a database, access collections, set indexes and much more. This will\
    \ translate in the following simplification for the last part of the server.js\
    \ file:\n\n```\n/**\n * Connect to the database.\n */\n\nmongoose.connect('mongodb://127.0.0.1/my-website');\n\
    app.listen(3000, function () {\n  console.log('\\033[96m\\033[39m listening on\
    \ *:3000');\n});\n```\n\nNext up, you're going to define the model that will replace\
    \ the reference to app.users and set up the indexes you were previously setting\
    \ up in that section.\n\n# SETTING UP MODELS\n\nModels can be defined with Mongoose\
    \ anywhere in the file. It doesn't matter whether Mongoose has connected yet or\
    \ not.\n\nAt the end of the file, append the model definition:\n\n```\n/**\n *\
    \ Define model.\n */\n\nvar Schema = mongoose.Schema\n\nvar User = mongoose.model('User',\
    \ new Schema({\n```"
  merge: -1
