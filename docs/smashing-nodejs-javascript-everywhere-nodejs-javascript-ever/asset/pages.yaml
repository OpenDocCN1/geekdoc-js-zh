  md: '# # 14 REDIS


    **NOW THAT YOU** have successfully leveraged two major databases with Node.JS—MongoDB
    and MySQL—it’s time learn about Redis.


    Redis is a database, but it would be more accurately described as a datastructure
    server, a definition that resonates more with MongoDB than MySQL.'
  merge: -1
  pgno: 270
- img_proc: true
  md: "Instead of interacting with rows in tables or documents in collections, you\
    \ always access data in Redis. As a result, you can think of Redis as a key-value\
    \ store like the following-JavaScript object:\n\n```\n(\n  'key': 'some value'\n\
    \  'key.2': 'some other value'\n)\n```\n\nBut because it is a datructure server,\
    \ the value is not always a simple string. The following are the fundamental data\
    \ types that you can assign to keys in Redis:\n\n+   - string\n- list\n- set\n\
    - hash\n- sorted set\n\nA fundamental difference between Redis and MongoDB, however,\
    \ is that Redis document structure is always flat. Even though a key, for example,\
    \ can contain something that resembles a JavaScript object very closely—a hash—that\
    \ hash cannot contain nested data structures like it could in MongoDB.\n\nAnother\
    \ difference is how you persist data. Redis is designed to be an extremely in-memory\
    \ store with configurable persistence to disk. It's important to remember persistence\
    \ to disk matters because anything stored in memory is volatile and susceptible\
    \ to be lost upon a system crash or reboot.\n\nWhat this means is Redis usage\
    \ and configuration should be carefully reviewed prior to its deployment for sensitive\
    \ information systems (such as those involving financial transactions). Even though\
    \ Redis stores its working dataset (that is, all the data you work with and query)\
    \ in memory, it has different strategies for ensuring a copy of it stays in the\
    \ hard drive. The problem is that its default configuration and behavior is not\
    \ as well suited for sensitive systems as MySQL could, for example. That is why\
    \ Redis is commonly regarded as \"not durable, but such a categorization is not\
    \ truly informative.\n\nIf you're planning to deploy Redis for the first time,\
    \ I encourage you to review the different options related to persistence in the\
    \ official website: http://redis.io/topics/persistence. In summary, you can think\
    \ of Redis as a single, big, flat (key-value) JavaScript object, where the values\
    \ can be special data structures (a hash, a set, a string, and so on) It's designed\
    \ for lookup and write speed (it keeps everything in memory). How safe the data\
    \ is after writing to it is configurable, but it could be a bad choice for certain\
    \ types of systems if used out of the box."
  merge: -1
  pgno: 271
