    ```\n\nAnd it returns results like this:\n\n```\n{\n  \"Url\": \"http://\\/tinysong.com\\\
    /7Wm7\",\n  \"SongID\": 881585,\\n  \"SongName\": \"Moonlight Sonata\",\n  \"\
    ArtistID\": 1833,\\n  \"ArtistName\": \"Beethoven\",\n  \"AlbumID\": 258724,\\\
    n  \"AlbumName\": \"Beethoven\"\n},\n{\n  \"Url\": \"http://\\/tinysong.com\\\
    /6Jk3\",\n  \"SongID\": 564004,\n  \"SongName\": \"Fur Elise\",\n  \"ArtistID\"\
    : 1833,\\n  \"ArtistName\": \"Beethoven\",\n  \"AlbumID\": 268605,\\n  \"AlbumName\"\
