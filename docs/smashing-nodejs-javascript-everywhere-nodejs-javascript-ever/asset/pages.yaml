    obj[''profile.1''].name = ''Guillermo'':

    ```


    To retrieve all keys and values for a given hash, you use HGETALL and supply the
    key:


    ```

    redis 127.0.0.1:6379 HGETALL profile.1

    1) "name"

    2) "Guillermo"

