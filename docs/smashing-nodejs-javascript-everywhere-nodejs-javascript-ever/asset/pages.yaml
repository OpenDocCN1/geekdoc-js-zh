    # SUMMARY


    In this chapter you learned how to leverage Express, the most popular Node.JS
    web framework.


    The main benefit you''ll see from your usage and implementation of Express is
    that it''s simple, largely unopinionated but flexible, and it builds on top of
    other battle-tested and clean abstractions like Connect.


    Unlike web frameworks and libraries, Express can be easily molded to fit different
    needs, structures, and patterns. You learned how to use it with minimal implementation
    overhead in the first application example, just like the Node.JS Hello World.


    As a matter of fact, you might have noticed that Express tries to stay close to
    the Node.JS core API and extend it, as opposed to creating a new world on top
    of it. That''s why route handlers still receive the native Node request and response
    objects, the same we received in the first HTTP server we wrote. You learned and
    appreciated the usefulness of these extensions, and for example they make writing
    writing APIs that respond with JSON a breeze with res.send.


    Finally, you learned how to put different pieces together to create maintainable
    code. Again, the main strategy of staying close to the Node.JS core APIs pays
    off: leveraging is one of the most powerful tools for superior code organization.'
