  md: "In the same spirit as expect.js, test.js, the process of describing and organizing\
    \ tests\nnatural.\n\nAll you need to do to run the tests is to leverage the mocha\
    \ command. To get the mocha\ncommand, make sure to run npm install -g mocha. Then\
    \ use\n\n```\nmocha test.js\n```\n\nMocha can leverage multiple reporters to display\
    \ the tests passing and running:\n\n```\nmocha test.js\n```\n\n```\n2 tests complete\
    \ (0ms)\n```\n\nAn alternative reporter, for example, is a list:\n\n```\nmocha\
    \ -R list test.js\n```\n\n```\na topic should test something: 0ms\na topic another\
    \ topic should test something else: 0ms\n```\n\n```\n2 tests complete (1ms)\n\
    ```\n\nAs you see later, Mocha also has an HTML reporter, which enables you to\
    \ take your tests tonthe browser.\n\n# TESTING ASYNCHRONOUS CODE\n\nBy default,\
    \ Mocha executes one test after another immediately. Many times, however,\nwant\
    \ to delay the execution of the next test after some async event occurs.\n\nConsider\
    \ the following test:\n\n```\nit('should not throw', function () (\n  setTimeout(function\
    \ () {\n    throw new Error('An error!');\n  }, 100);\n));\n```\n\nThis test always\
    \ passes. The reason is that the timer is set, and there's nothing left to do,\n\
    Mocha continues with the next one. Because no exceptions are raised immediately\
    \ after settingnthe timeout, the test passes.\n\nFor tests in which exceptions\
    \ could be raised in the future (that is, as a result of asynchronousnbehavior),\
    \ you want to tell Mocha that you will notify it when you consider the test complete."
