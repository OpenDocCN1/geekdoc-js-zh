  md: '# CHAPTER


    # 15 CODE

    SHARING


    IN THE INTRODUCTION of the book, I referred to one of the most appealing aspects
    of Node.JS: the fact that JavaScript, the language it empowers, is the only language
    supported by browsers.


    you haven''t taken advantage of the unique opportunity of writing code *once*
    and running it *everywhere*.


    Even though so far you have been writing code in JavaScript alone, which reduces
    the mental overhead of having to switch contexts between languages when working
    on web applications,


    This chapter analyzes what use cases are optimal for code sharing and how to solve
    common language compatibility problems. You also learn how you can write modular
    code with the best practices of Node that can be *compiled* to run in the browser
    without bloat by using `browserbuild`.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# WHAT CAN BE SHARED?


    The easiest way to answer whether a certain piece of code can be shared between
    the browser and server is to break down this question into two questions:


    +   - Is it worthwhile to run the codebase in both environments?

    - Do the APIs it depends on exist in both environments? If not, can easily be
    replaced or added (also known as *shimming*)?


    Answering the first question is normally easy, and the answer itself depends exclusively
    on your program and project. The second question can be a little tricky.


    In Chapter 2, you saw that certain APIs that you commonly associate with JavaScript
    are not a formal part of the language but a *standard* API added on top of it
    by browsers. Examples of these APIs are XMLHttpRequest, WebSocket, the DOM, Canvas
    API, and so on.


    Although XMLHttpRequest is available as part of the core Node.JS engine, you can
    completely shim its API and make it work on top of the normal Node.JS HTTP client
    APIs. A project in NPM named `xmlhttp` does exactly this.


    In other cases, certain modules interact only with native APIs, and those are
    normally the easiest to write in such a way that they run in both environments.


    Examples of these are


    +   - Date manipulation toolkits: They normally extend or work with the Date API.

    - Template engines: They usually take a *String*, parse it with regular expressions
    or for loops, generate (compile) a function, which outputs a String.

    - Math and crypto libraries: They normally depend exclusively on Number and Math.

    - OOP frameworks: They provide syntax sugar for writing classes in JavaScript.
    In other words, they provide different APIs to make writing object-oriented code
    in JavaScript more similar to classical OOP languages.


    # WRITING COMPATIBLE JAVASCRIPT


    The first challenge you need to solve is executing JavaScript code that has been
    written with the Node.JS module system, which is not available in the browser.


    # EXPOSING MODULES


    The first challenge you face is the lack of a *module* global in the browser environment.
    Even if your file doesn''t rely on required dependencies, the way that a certain
    file becomes useful to other parts of a Node program is by leveraging `module.exports`
    or `exports.'
  merge: -1
  pgno: 291
- img_proc: true
  md: "# CHAPTER 15 • Code Sharing 281\n\nAssume you want to write a simple function\
    \ that sums two numbers:\n\n```\nadd.js\nmodule.exports = function (a, b) {\n\
    \  return a + b;\n}\n```\n\nIn Node, you can simply leverage the function by calling\
    \ require('./.add') from another file. In the browser, you most likely want to\
    \ expose the module as a global variable add.\n\nTo avoid modifying the existing\
    \ code, you can simulate module.exports for the browser by prefixing the code\
    \ with a fake object:\n\n```\nif ('undefined' == typeof module) {\n  module =\
    \ { exports: {} };\n}\n```\n\nAt the end of the module, after the object is populated,\
    \ you can expose it to the window:\n\n```\nif ('undefined' != typeof window) {\n\
    \  window.add = module.exports;\n}\n```\n\nUnlike Node.JS, in the browser, files\
    \ get evaluated in the global scope. Therefore, you would be introducing a global\
    \ module variable to the rest of the program that you don't want.\n\nWrapping\
    \ your module in a self-invoking function is therefore a good idea:\n\n```\n{function\
    \ (module) {\n  module.exports = function (a, b) {\n    return a + b;\n  }\nif\
    \ ('undefined' != typeof window) {\n  window.add = module.exports;\n}\n}}('undefined'\
    \ == typeof module ? module: { exports: {} } : module);\n```\n\nTa-da! The module\
    \ can still be required:\n\n```\n$ node\n> require('./.add')(1,2)\n3\n```"
  merge: -1
  pgno: 292
- img_proc: true
  md: "And you can include it in the DOM:\n\n```\nadd.html\n<script src=\"add.js\"\
    ></script>\n<script>\n  console.log(add(1,2));\n</script>\n```\n\n# SHIMMING ECMA\
    \ APIS\n\nThe next challenge you usually face is the reliance on modern JavaScript\
    \ features not available to all browsers and JavaScript engines.\n\nThe v8 engine\
    \ in Node is even more up to date than that has been shipped by the Google Chrome\
    \ browser to millions of computers. In other cases, such as Function#bind, otherwise-modern\
    \ engines like the JavaScriptCore VM empower safari miss certain implementations.\
    \ You have to pay special care to what features are used if you intend your code\
    \ to run everywhere.\n\nThere are two distinct approaches to adding missing functionality:\
    \ the pure shim of a missing implementation by extending the native prototype\
    \ or the use of utility functions.\n\n# Extending prototypes\n\nSay a particular\
    \ module you're writing and intend to run in Node and browsers uses Function#bind:\n\
    \n```\nvar myfn = fn.bind(this);\n```\n\nBecause bind is not available everywhere,\
    \ you can add it if it's missing:\n\n```\nif (!Function.prototype.bind) {\n  Function.prototype.bind\
    \ = function () {\n    // code that replicates bind behavior\n  }\n}\n```\n\n\
    A project called es5-shim goes above and beyond by implementing all the missing\
    \ ECMA-standard APIs in a cross-browser whenever possible. You can find it at\
    \ https://github.com/kriskowal/es5-shim.\n\nThe obvious advantage of this technique\
    \ is that you can include the shim and mostly worry about changing your code."
  merge: -1
  pgno: 293
- img_proc: true
  md: "The disadvantage is that the evaluation of your library in the browser affects\
    \ prototypes used or extended by others, which is more obtrusive than it could\
    \ be.\n\n# Utilities\n\nAnother approach is defining simple functions that receive\
    \ the native object as an argument, try to leverage existing implementations if\
    \ present, or re-implement the functionality otherwise.\n\nAn example of a missing\
    \ API in many browsers that you commonly use in Node Object.keys.\n\nYou can then\
    \ create a utility as follows:\n\n```\nvar keys = Object.keys || function (obj)\
    \ {\n  var ret = {};\n  for (var i in obj) {\n    if (Object.prototype.hasOwnProperty.call(obj,\
    \ i)) {\n      ret.push(i);\n    }\n  }\n  return ret;\n}\n```\n\nThe advantages\
    \ of this technique are that it works everywhere, it's not unobtrusive, and it\
    \ makes clear to the developer what areas are simulated instead of native, which\
    \ can aid in detecting performance loopholes in certain browsers.\n\nOn the downside,\
    \ you have to be careful about remembering to leverage the utility instead of\
    \ the original.\n\nIn addition, the resulting code sometimes looks more convoluted.\
    \ If you're trying to achieve compatibility with old versions of IE Array#forEach\
    \ and Array#map/Array#filter are missing, you might use code like this:\n\n```\n\
    arr.filter(function () {}).map(function () {}).forEach(function () {})\n```\n\n\
    However, this code looks less clear when utilities are leveraged:\n\n```\neach(map(filter(arr,\
    \ function () {}), function () {}), function () {}))\n```\n\n# SHIMMING NODE APIs\n\
    \nSome Node APIs as EventEmitter are likely to be leveraged by your own custom\
    \ classes. Fortunately, the community has written versions of Node APIs that work\
    \ in all environments."
  merge: -1
