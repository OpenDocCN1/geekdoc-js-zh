  md: '# FOREWORD


    MOST WEB APPLICATIONS have both a client side and a server side. Implementing
    the server side has traditionally been complex and cumbersome. Creating a simple
    server side required expert knowledge about multi-threading, scalability, and
    server deployment. An additional complication is that web client software is implemented
    using HTML and JavaScript whereas server code most is implemented using more static
    programming languages. This split forces the programmer to use multiple programming
    languages and make early design decisions about where certain program logic should
    reside.


    A few years ago, it would have been unthinkable to implement server software in
    JavaScript. Poor runtime performance, toy-like memory management, and lack of
    ordering system integration had to be fixed before JavaScript could be considered
    a viable solution for servers. As part of Google Chrome, we designed the V8 JavaScript
    engine to tackle the first two problems. V8 is available as an open source project
    with a simple API for embedding.


    Ryan Dahl saw the opportunity in bringing JavaScript to the server side by embedding
    V8 into an OS integration layer that featured asynchronous interfaces to the underlying
    operating system. That was the inception of Node.js. The benefits were obvious.
    Programmers could now use the same programming language on both client and server
    side. The dynamic nature of JavaScript made it trivial to develop and experiment
    with server code freeing the programmer from the traditional slow tool-heavy programming
    model.


    Node.js became an instant success, spawning a vibrant open source community, supporting
    companies, and even necessitating its own conference. I would attribute this success
    to a combination of simplicity, improved programming productivity, and high performance.
    I''m pleased V8 played a small part in this.


    This book will take the reader through all steps of creating the server side of
    a web application on top of Node.js including how to organize asynchronous server
    code and interface to databases.


    Enjoy the book,


    Lars Bak, Virtual Machinist'
  merge: -1
