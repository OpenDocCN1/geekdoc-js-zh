  md: "# 252 PART IV\n\n+   2. You prevent the default behavior by calling preventDefault.\
    \ That is, you prevent the browser from attempting to POST the form automatically,\
    \ since you're going to do it with the AJAX request.\n\n+   3. You call jQuery.$.ajax\
    \ to make a POST request with the form serialized as a query string as the body\
    \ (which you achieve by passing the result of form.serialize as the data property).\n\
    \nWhen the JSON comes back, you reconstruct the item to inject into the list of\
    \ projects or tasks. If it's a project, you insert a link to the tasks and a delete\
    \ link. If it's a task, you inject a span and a delete link.\n\nYou now populate\
    \ the .post routes in the Express application. You leverage the .build method\
    \ exposed in each model:\n\n```\nserver.js\n/**\n * Project creation route.\n\
    \ */\napp.post('/projects', function (req, res, next) {\n  Project.build(req.body).save(\n\
    \    .success(function (obj) {\n      res.send(obj);\n    })\n    .error(next)\n\
    });\n/**\n * Add task for project.\n */\napp.post('/project/:id/tasks', function\
    \ (req, res, next) {\n  req.body.id = req.params.id;\n  Task.build(req.body).save(\n\
    \    .success(function (obj) {\n      res.send(obj);\n    })\n    .error(next)\n\
    });\n```\n\nIt's very important to keep in mind that you should only pass the\
    \ entire request body like this (such as `pass req.body`) when there are no security\
    \ implications from the user being able to set any field in your database, as\
    \ in the case of this example application. Even if you only create a few inputs\
    \ in a form, never forget that the user can forge any type of request manually."
