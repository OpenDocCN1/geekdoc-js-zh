  md: "```\nhttp.Server(function (req, res) {\n  var buf = '';\n  req.on('data', function\
    \ (data) {\n    buf += data;\n  });\n  req.on('end', function () {\n    console.log('All\
    \ the data is ready!');\n  });\n});\n```\n\nThis is a common use-case in NodeJS:\
    \ **you buffer the contents of the request** (data event), and then you can do\
    \ something with it when you're sure all the data has been received (end event).\n\
    \nIn order for Node to let you know that a request has the server as soon as possible,\
    \ regardless of whether all its data is present or not, it needs to rely on events.\
    \ Events in Node are the mechanism by which you can get notified of things that\
    \ haven't occurred yet, but are bound to occur.\n\nWhether an event will be fired\
    \ or not depends on the API that implements it. For example, you know that Server\
    \ inherits from `EventEmitter`, and now you also know that it emits `data` and\
    \ `end` events.\n\nCertain APIs emit *error* events, which might or might not\
    \ happen at all. There are events that only fire once (like *end*), or others\
    \ that could fire more than once (like *data*). Some APIs only emit a certain\
    \ event when certain conditions are met. For example, after a certain event happens\
    \ some other event might be guaranteed not to be fired. In the case for HTTP request,\
    \ you fully expect *no data* events to happen after an *end* event. Otherwise,\
    \ your app would malfunction.\n\nSimilarly, sometimes for the use case of your\
    \ application you only registering a callback for an event only once, regardless\
    \ if it fires again in the future. Node provides a shortcut method for this:\n\
    \n```\na.once('an event', function () {\n  // this function will be called only\
    \ once, even if the event is triggered again\n});\n```\n\nTo understand what type\
    \ of events are available and what their *contracts* (the \"rules\") given API\
    \ defines for triggering them), you usually refer to the API documentation of\
    \ the given module. Throughout the book you'll learn the core Node module APIs\
    \ and some of the most important events, but always keeping the API handy will\
    \ be a very helpful habit.\n\n# BUFFERS\n\nAnother deficiency in the language\
    \ that Node makes up for, besides modules, handling of binary data."
