  md: "# DEFINING YOUR OWN MODULE\n\nTo define your module, you need to create a package.json\
    \ file. Defining your own module has three fundamental benefits:\n\n+   - Allows\
    \ you to share the dependencies of your application with others, without sending\
    \ along the node_modules directory. Because npm install takes care of fetching\
    \ everything, distributing this directory wouldn't make sense. This is especially\
    \ important in SCM systems like Git.\n- Allows you to track the versions of the\
    \ modules you depend on that you know. For example, when you wrote a particular\
    \ project, you run npm install colors and that installed colors 0.5.0. A year\
    \ later, to API changes, perhaps the latest colors are no longer compatible with\
    \ your project, and if you were to run npm without specifying the version, your\
    \ project would break.\n- Makes redistribution possible. Did your project turn\
    \ out fine and you want to share it with others? Because you have a package.json,\
    \ the command npm publishes it to the NPM registry for everyone to install.\n\n\
    The directory created earlier (my-project), remove the node_modules directory\
    \ and create a package.json file:\n\n```\n$ rm -r node_modules\n$ vim package.json\n\
    ```\n\nThen add the following contents:\n\n```\n{\n  \"name\": \"my-colors-project\"\
    ,\n  \"version\": \"0.0.1\",\n  \"dependencies\": {\n    \"colors\": \"0.5.0\"\
    \n  }\n}\n```\n\n> Note: The contents of this file must be valid JSON. JavaScript\
    \ is not enough. This means that you must make sure, for example, to use double\
    \ quotes for all strings, including property names.\n\nThe package.json file is\
    \ the file that describes your project to both Node.js and NPM. The only required\
    \ fields are name and version. Normally, modules have dependencies, which is an\
    \ object that references other projects by the name and version they defined in\
    \ their package.json files.\n\nSave the file, install the local project, and run\
    \ index.js again:"
