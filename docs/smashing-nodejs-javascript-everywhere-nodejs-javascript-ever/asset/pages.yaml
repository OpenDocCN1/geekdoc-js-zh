  md: "# MIDDLEWARE\n\nTo understand middleware better, go back to the node HTTP example.\
    \ Remove the logic and focus for a minute on what you're trying to do:\n\n```\n\
    if ('GET' == req.method && '/images' == req.url.substr(0, 7)) {\n  // serve image\n\
    } else if ('GET' == req.method && '/' == req.url) {\n  // serve index\n} else\
    \ {\n  // display 404\n}\n```\n\nAs you see, the application tries to do *only\
    \ one* of three things every time a request comes. If you also want to log requests,\
    \ for example, you would add this piece of code to the top:\n\n```\nconsole.error('%\
    \ %s %s', req.method, req.url);\n```\n\nNow imagine a larger application that\
    \ can do *many* different things, depending on the different variables at play\
    \ for each request:\n\n+   * Log requests and how long they take\n* Serve static\
    \ files\n* Perform authorization\n\nThese tasks can make handling code in a single\
    \ event handler (the callback that you pass to createServer) a very convoluted\
    \ process.\n\n> Simply put, *middleware* is made up of functions that handle the\
    \ *req* and *res* objects but also receive a *next function* that allows you to\
    \ do flow control.\n\nIf you want to write the same application using the middleware\
    \ pattern, it would look like this:\n\n```\nserver.use(function (req, res, next)\
    \ {\n  // you always log\n  console.error('% %s %s', req.method, req.url);\n \
    \ next();\n});\n\nserver.use(function (req, res, next) {\n  if ('GET' == req.method\
    \ && '/images' == req.url.substr(0, 7)) {\n    // serve image\n} else {\n```"
