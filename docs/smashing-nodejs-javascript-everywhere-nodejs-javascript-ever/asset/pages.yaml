  md: '# EventEmitter


    Implementations of the node EventEmitter can be found at https://github.com/Wolfy87/
    EventEmitter and https://github.com/tmpvar/node-eventemitter.


    # assert


    The assert module has been ported to the browser: https://github.com/Jxck/assert.


    # SHIMMING BROWSER APIS


    In many situations, you want Node to run APIs that some or all browsers natively
    expose.


    # XMLHttpRequest


    The node-XMLHttpRequest project (found at https://github.com/driverdan/node-XMLHttpRequest
    Request) brings the shimmed API to Node by simply requiring it:


    ```

    var XMLHttpRequest = require(''xmlhttprequest'')

    ```


    # DOM


    A complete and tested implementation of DOM levels I, II, and III exist at https://github.com/tmpvar/jsdom.


    # WebSocket


    The WebSocket client API (https://github.com/einaros/ws) is available to Node
    as well:


    ```

    var WebSocket = require(''ws'')

    ```


    # node-canvas


    The canvas 2D context for image manipulation is available to Node thanks to node-canvas.
    https://github.com/learnboost/node-canvas.


    # CROSS-BROWSER INHERITANCE


    A common need in modules is to make a class inherit from another. In Chapter 2,
    you learned about __proto__, which is a proprietary extension and also impossible
    to shim directly.


    A simple alternative is declaring a utility function as follows:


    +   * Inheritance utility.

    * @param {Function} constructor'
