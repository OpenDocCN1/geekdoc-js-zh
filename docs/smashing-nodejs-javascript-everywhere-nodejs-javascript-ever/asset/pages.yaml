  md: "# STREAMS\n\nThe method fs.createRead allows you to create a readable Stream\
    \ object for a particular file.\n\nTo understand the power of streams, consider\
    \ the difference between the following examples:\n\n```\nfs.readFile('my-file.txt',\
    \ function (err, contents) {\n  // do something with file\n});\n```\n\nIn this\
    \ case, the callback function that you supply fires after the entire file is read,\
    \ placed in RAM, and ready to use.\n\nIn the following example, chunks of varying\
    \ sizes are read, and each time a callback is fired:\n\n```\nvar stream = fs.createReadStream('my-file.txt');\n\
    stream.on('data', function(chunk) {\n  // do something with part of the file\n\
    });\nstream.on('end', function(chunk) {\n  // reached the end\n});\n```\n\nWhy\
    \ is this capacity important? Imagine you have a large video you need to upload\
    \ to a web service. You don't really need to read the entire video to start uploading\
    \ it, so using Stream immediately translates into a speed advantage.\n\nThis is\
    \ also the case for logging, especially with a writable stream. If you use a web\
    \ app to log visitors to your website, it might not be efficient to tell the operating\
    \ system to open and close the file (and therefore seek it in your disk each time)\
    \ because you will be writing to the file a lot.\n\nTherefore, that's a good use\
    \ case for a fs.WriteStream. Open the file once and then call .write for each\
    \ log entry.\n\nAnother great fit for Node's non-blocking design is watching.\n\
    \n# WATCH\n\nNode allows you to watch files and directories for changes. Watching\
    \ means that upon a file (or files contained within, in the case for watching\
