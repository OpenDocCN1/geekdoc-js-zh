  md: "```\nfirst: String\nlast: String\nemail: { type: String, unique: true }\npassword:\
    \ { type: String, index: true };\n```\n\nNow, leveraging it by looking at the\
    \ occurrences for app.users. The first one is in the\nauthentication middleware.\
    \ Replace the $soid search with the convenient Mongoose method\nfindById:\n\n\
    ```\napp.use(function (req, res, next) {\n  if (req.session.loggedIn) {\n    res.local('authenticated',\
    \ true);\n    User.findById(req.session.loggedIn, function (err, doc) {\n    \
    \  if (err) return next(err);\n      res.local('me', doc);\n      next();\n  \
    \  });\n  } else {\n    res.local('authenticated', false);\n    next();\n  }\n\
