  md: "If you modify a followers list, but something happens afterward and the followers\
    \ alteration fails, you could end up with inconsistent and fault-prone data. You\
    \ therefore need to execute both commands as part of a transaction.\n\nFinally,\
    \ you also want to be able to retrieve the IDs of follows and followers:\n\n```\n\
    User.prototype.getFollowers = function (fn) {\n  client.members('user:' + this.id\
    \ + ':followers', fn);\n};\n\nUser.prototype.getFollows = function (fn) {\n  client.members('user:'\
    \ + this.id + ':follows', fn);\n};\n```\n\n# Computing intersections\n\nBesides\
    \ follows and followers, you can also compute a third type of relationship: friendship.\n\
    \nYou can say two users are friends if they follow each other. In other words,\
    \ if a user ID appears both in the follows and followers sets of a given user,\
    \ that user is a friend.\n\nAdding the getFriends method is as easy as calling\
    \ the SINTER command to compute the intersection between the two sets:\n\n```\n\
    User.prototype.getFriends = function (fn) {\n  client.sinter('user:' + this.id\
    \ + ':follows', 'user:' + this.id + ':followers', fn);\n};\n```\n\n# Testing it\
    \ out\n\nTo test the model, you are going to create a few users that would be\
    \ representative of those created through a web application.\n\nThe first step\
    \ is to compile the model you worked above into its own file for reusability,\
    \ that you you can require it easily. Notice that I added the appropriate module.exports\
    \ line:\n\nmodel.js\n\n```\n/**\n * Module dependencies\n */\n\nvar redis = require('redis')\n\
    \n/**\n * Module exports\n```"
