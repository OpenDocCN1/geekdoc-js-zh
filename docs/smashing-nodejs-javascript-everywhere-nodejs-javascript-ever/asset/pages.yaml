  md: 'Another interesting feature of the browserbuild compilation process is the
    if node block, which allows you to use JavaScript comments to tell the compiler
    that a certain section of code should be stripped when compiling the module for
    the browser:


    # nodeonly.js


    ```

    // if node

    process.exit(1);

    // end


    console.log(''browser and node'');

    ```


    In this case, the block gets removed from the browser version. If you execute


    ```

    browserbuild --main nodeonly.js

    ```


    You''ll notice the process.exit line will be:


    ```

    //

    require.register(''nodeonly.js'', function(module, exports, require, global)

    console.log(''browser and node'');

    });nodeonly = require(''nodeonly'');

    }}

    ```


    To learn more about the different available options, you can execute browserbuild
    --help or refer to the project page located at http://github.com/learnboost/browserbuild.


    # SUMMARY


    As it''s highlighted throughout the book, Node.js has done a remarkable job at
    making writing JavaScript on the server-side a very pleasant activity.


    At the core of its innovation lies the module system, something for which the
    browser environment has no de-facto equivalent.


    This chapter outlined the basic runtime methods of making code that can execute
    both on the server and the browser. By performing typeof checks, one can accomplish
    the feature detection of the module system, and provide an alternative exposure
    mechanism for the browser, such as globals.


    But wrapping manually in self-invoking functions, and executing typeof checks
    for every file of your library can definitely counteract the beautiful simplicity
    of the required system in Node, and that''s the problem browserbuild allows you
    to solve. You are empowered to write modules for Node.js that can be compiled
    and executed in the browser with minimal friction.


    The main advantage of this method is that your library eventually exposed as a
    global in the browser environment,'
