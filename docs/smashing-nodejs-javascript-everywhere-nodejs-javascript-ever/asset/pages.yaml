  md: '# CHAPTER


    # 6 TCP


    TRANSMISSION CONTROL PROTOCOL

    TCP) is a connection-oriented protocol that provides reliable and ordered delivery
    of data from one computer to another.


    First, you are going to learn the characteristics of the protocol. For example,
    what guarantees you have when you send a message from one computer to another
    using TCP. If you send two messages in a row, will they get to the other end?
    Understanding the protocol is essential to understanding any software that leverages
    it. Most of the times you connect and talk to a database like MySQL, you''re doing
    so over a TCP socket, for example.


    In other words, TCP is the transport protocol you use whenever you want to ensure
    that all the bytes you send from one point reach the other completely and in the
    correct order.


    For these and other reasons, most protocols you use now, such as HTTP, are built
    on top of TCP. When you send the HTML for a page, you want it to get to the other
    end in the exact form that you sent it, and if that is not possible, an error
    should be triggered. If one character (byte) of the stream were to be misplaced,
    a browser might not be able to render the page.


    The Node HTTP server is built on top of the Node TCP server. To you programmers,
    this translates into the Node module. Server inheriting from the net.Server (net
    is the TCP module).


    Node.js is a framework designed with the development of network applications in
    modern. Today, applications in network communicate over the transport known as
    TCP/IP. Therefore it''s crucial that we have an understanding about how TCP/IP
    basically works, and how Node.js executes it with amazingly simple APIs.


    In addition to web browsers and servers (HTTP), applications you run on daily
    leverage TCP like email clients (SMTP/IMAP/POP), chat programs (IRC/XMPP), remote
    shells (SSH), and a lot more.


    Knowing as much as possible familiarizing yourself with the Node.js APIs it will
    help you create or establish network programs with a variety of uses and applications.'
  merge: -1
