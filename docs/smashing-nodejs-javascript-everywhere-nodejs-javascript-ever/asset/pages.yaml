  md: "# MIDDLEWARE\n\nBecause Express is built on top of Connect, when you create\
    \ an Express server, you can use it to enable Connect-compatible middleware. For\
    \ example, to serve images under an images/folder, you can leverage the static\
    \ middleware like th this:\n\n```\napp.use(express.static(__dirname + '/images'));\n\
    ```\n\nOr if you wanted to leverage connect sessions, you would do it just like\
    \ we did for Connect:\n\n```\napp.use(express.cookieParser());\napp.use(express.session());\n\
    ```\n\nNotice that you can access Connect middleware directly as part of the Express\
    \ requirement. There's no need to require('connect') or add connect as a dependency\
    \ to your package.json file. Middleware is easily accessible to you.\n\nMore interestingly,\
    \ Express also allows for middleware that gets appended only after a certain route\
    \ matched, as opposed to every request.\n\nImagine a situation in which you want\
    \ to check that the user is authenticated, but only for protected routes. In this\
    \ case, you can define a secure middleware that sends the status code 403 Not\
    \ Authorized if the req.session.logged_in is not true:\n\n```\nfunction secure\
    \ (req, res, next) {\n  if (!req.session.logged_in) {\n    return res.send(403);\n\
    \  }\n\n  next();\n}\n```\n\nThen you can apply it to routes:\n\n```\napp.get('/home',\
    \ function () {\n  // accessible to everyone\n});\n\napp.get('/financials', secure,\
    \ function () {\n  // secure!\n});\n\napp.get('/about', function () {\n  // accessible\
    \ to everyone\n});\n\napp.get('/roadmap', secure, function () {\n  // secure!\n\
    });\n```"
  merge: -1
  pgno: 172
- img_proc: true
  md: "You can define more than one middleware function for each route:\n\n```\napp.post('/route',\
    \ a, b, c, function () { }); });\n```\n\nIn some situations, you want to call\
    \ next from route middleware in a way that the rest\nof the middleware for that\
    \ route gets skipped, and Express resumes processing at the next\nroute.\n\nFor\
    \ example, if instead of sending 403, you want to let Express check other routes,\
    \ you could\nuse the following approach:\n\n```\nfunction secure (req, res, next)\
    \ {\nif (req.session.logged_in) {\n  return next('/route');\n}\n}\nnext();\n```\n\
    \nBy calling next('/route'), you ensure the current route gets skipped.\n\nAs\
    \ applications grow and the number of routes and middleware increases, it's useful\
    \ to have\nsome code organization strategies in mind. The next section describes\
    \ the most fundamental\nways of achieving this.\n\n# ORGANIZATION STRATEGIES\n\
    \nThe first rule for any Node.JS application, including Express web apps, is always\
    \ to be modular.\nNode.JS gives us a very powerful code organization strategy\
    \ through the simple require\nAPI.\n\nFor example, consider an application that\
    \ has three distinct sections /blog, /pages, and\n/tags, with each other routes\
    \ under their hierarchy. For example, /blog/search,\n/pages/list, or /tags/cloud.\n\
    \nA successful organization strategy would be to maintain a server.js file with\
    \ the route map and\nin include the routes as modules blog.js, pages.js, and tags.js.\
    \ First, you\ndefine the dependencies and initialize the app, include middleware,\
    \ and so on:\n\n```\nvar express = require('express')\n  blog = require('./blog')\n\
    \  pages = require('./pages')\n  tags = require('./tags')\n\n// initialize app\n\
    var app = express.createServer();\n\n// here you would include middleware, settings,\
    \ etc\n```"
  merge: -1
  pgno: 173
- img_proc: true
  md: "Then you define what I refer to as route map, which is simply laying out all\
    \ the URLs that you want to handle in a single place:\n\n```\n// blog routes\n\
    app.get('/blog', blog.home);\napp.get('/blog/search', blog.search);\napp.post('/blog/create',\
    \ blog.create);\n```\n\n```\n// pages routes\napp.get('/pages', pages.home);\n\
    app.get('/pages/list', pages.list);\n```\n\n```\n// tags routes\napp.get('/tags',\
    \ tags.home);\napp.get('/tags/search', tags.search);\n```\n\nThen, for each specific\
    \ file you will leverage exports. Consider the example for blog.js:\n\n```\nexports.home\
    \ = function (req, res, next) {\n  // home\n};\n\\exports.search = function (req,\
    \ res, next) {\n  // search functionality\n};\n```\n\nModules offer great flexibility.\
    \ You could take this to a next level and divide modules by methods. For example:\n\
    \n```\nexports.get = {};nexports.get.home = function (req, res, next) {}{\nexports.post.create\
    \ = function (req, res, next) {};\n```\n\nThe other way in which applications\
    \ can be decoupled is to export an entire Express app as a module (which you could\
    \ obtain from NPM), and mount it to your existing application, making the routes\
    \ seamlessly.\n\nConsider the example of an application that needs a blog. You\
    \ can define a blog with all its routes /categories, and /search, and export that\
    \ as blog.js:\n\n```\nvar app = module.exports = express.createServer();\napp.get('/',\
    \ function (req, res, next) {});napp.get('/categories', function (req, res, next)\
    \ {});napp.get('/search', function (req, res, next) {});\n```\n\nNotice that the\
    \ routes are defined in absolute terms, without a prefix. Then, in your main app,\
    \ all you have to do is require it and pass it to app.use:"
  merge: -1
