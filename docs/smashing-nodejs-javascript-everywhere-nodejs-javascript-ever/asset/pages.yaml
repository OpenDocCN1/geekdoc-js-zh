  md: "If an error occurs, you want to make sure to next it so that you can display\
    \ an \"Error 500\" page. Although infrequent, errors occur and it's important\
    \ that the application deals with them.\n\nA common gotta is to forget return\
    \ after taking care of the error. That mistake could end up producing unexpected\
    \ behavior in the application. For example, in this situation if an error occurs,\
    \ the doc variable is undefined, and the code throws an uncaught exception.\n\n\
    After a successful insertion, you redirect to the login route supplying the email.\n\
    \nIn the login route, you capture this parameter and expose it to the view:\n\n\
    +   **\n* Login route\n/\n\n```\napp.get('/login:signupEmail', function (req,\
    \ res) {\n  res.render('login', { signupEmail: req.params.signupEmail });\n});\n\
    ```\n\nIn the view, you display a message:\n\n```\nif (signupEmail)\n p Congratulations\
    \ on signing up! Please login below\n```\n\nThen you prepopulate the input:\n\n\
    ```\ninput(name=\"user[email]\", type=\"text\", value=signupEmail)\n```\n\nNow\
    \ launch the application and try signing up! If you launch the mongo client and\
    \ find the command on the new collection, you will see the document(s) you created:\n\
    \n> Brian: in the mongo client things appear like this$ mongo my-website\n> db.users.find({\n\
    \  \"first\": \"A\", \"last\": \"B\", \"email\": \"aob.com\", \"password\": \"\
    d\", \"id\": Object\nId(\"4e2fc2bd77bb50163a700001\")\n})\n\nNotice that the document\
    \ looks identical to what you expected, with minimal effort on your part. In addition,\
    \ Mongo adds an _id field automatically that lets you uniquely identify your document.\
    \ Handy!\n\n# FINDING DOCUMENTS\n\nNow you have created a document, you can look\
    \ it up in the /login route. Essentially, you want to retrieve the document that\
    \ matches an email and password combination.\n\nIn MongoDB, no fixed schema determines\
    \ a collection, every time you know you are going to query a collection in a particular\
    \ way, making sure it's properly indexed is a good idea. If a"
  merge: -1
