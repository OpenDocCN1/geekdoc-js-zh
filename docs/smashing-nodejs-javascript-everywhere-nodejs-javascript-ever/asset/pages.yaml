  md: '# CHAPTER 7 • HTTP 99


    ![](img/c641d3b47d2abe2a65f037111c97ed26_112_0.png)


    As you can see, you''re dealing with two different variables of the request: the
    URL and the method.


    Node JS puts the url property everything that follows the hostname. If you navigate
    to http://myhost.com/url?this+is+a+long+url, the contents of url are /url?this+is+a+long+url.


    The reigning protocol of the web, HTTP/1.1 (as you may remember from the telnet
    example in Chapter 6), establishes different methods for a request:


    +   - GET (the default)

    - POST

    - PUT

    - DELETE

    - PATCH (the method)


    The idea behind this is that an HTTP client picks a method to alter a resource
    on a server, which is located by its URL, with certain data as the body of the
