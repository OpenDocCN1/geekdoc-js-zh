- img_proc: true
  md: "```\nclient.set('my key', 'my value', function (err) {\n  // . . .\n}}\n```\n\
    \nThe same applies to all other commands, such as SMEMBERS or HEXISTS.\n\n# Defining\
    \ the model\n\nThe basic premise is that you can create different Redis sets for\
    \ follows and followers for each user, including IDs as part of the key:\n\n```\n\
    user:<id>:follows\nuser:<id>:followers\n```\n\nWhen one user (id \"1*\") follows\
    \ another (id \"2*\"), you want to execute two operations:\n\n+   - Add user id\
    \ \"2\" to the user:1:follows\n- Add user id \"1\" to the user:2:followers\n\n\
    In addition, you store the user profile as a hash:\n\n```\nuser:<id>:data\n```\n\
    \nYou start by defining the basic model:\n\n```\n/**\n * User model\n */\n```\n\
    \n```\nfunction User(id, data) {\nthis.id = id;\nthis.data = data;\n}\n```\n\n\
    Each instance of a User contains an id that identifies that user and the data\
    \ of the user account.\n\nYou expose a static method find for populating a User\
    \ instance from Redis:\n\n```\nUser.find = function (id, fn) {\n  client.hgetall('user:'\
    \ - id - ':data', function (err, obj) {\n    if (err) return fn(err);\n    fn(null,\
    \ new User(id, obj));\n  });\n}\n```\n\n# Creating and modifying users\n\nIt's\
    \ desirable for the model to be able to find a user, change some of his data,\
    \ and save it back into Redis. And you should also be able to run new User, set\
    \ some data, and save it into Redis."
