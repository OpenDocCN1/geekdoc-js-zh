  md: '# METHODOVERIDE


    Older browsers are incapable of creating requests (like Ajax) of certain methods
    such as PUT, DELETE, or PATCH. A common way to address this shortcoming for these
    specific user agents is to send a GET or POST request and append a _method variable
    to the query string of the URL with the real intended method.


    For example, if you want to PUT a resource from IE, you could send a request like
    this:


    ```

    POST /url1?method=PUT HTTP/1.1

    ```


    For your middleware to think that your request is actually a PUT request, you
    can include the methodOverride middleware:


    ```

    server.use(connect.methodOverride())

    ```


    Remember that middleware gets executed sequentially, so make sure it''s placed
    before you include other middleware that handles requests.


    # BASICAUTH


    For certain projects, sometimes you just need a basic authentication layer (see
    Figure 8-15) that''s controlled by the user agent.


    ![](img/c641d3b47d2abe2a65f037111c97ed26_154_0.png)


    Figure 8-15: A login dialog shown by the browser (basic authentication)'
  merge: -1
