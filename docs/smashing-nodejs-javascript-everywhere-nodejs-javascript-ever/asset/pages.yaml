- img_proc: true
  md: 'This behavior is, of course, undesirable. As I explained previously, the event
    loop is the foundation of all IO in Node. If a timeout can be delayed, so can
    an incoming HTTP request or other forms of IO. That means the HTTP server would
    handle fewer requests per second and not perform efficiently.


    For this reason, the great majority of modules available for node are non-blocking
    and performs tasks asynchronously.


    If you have only one thread of execution, which means that as a function is running
    no others can be executed concurrently, how is Node.JS so good at managing a lot
    of network concurrency? For example, in a normal laptop, a simple HTTP server
    written in Node is able to handle thousands of clients per second.


    For this to happen, you must first understand the concept of call stacks.


    When v8 calls a function, it starts what is commonly known as a call stack or
    execution stack.


    If that function calls another function, v8 adds it to the call stack. Consider
    the following example:


    ```

    function a () {

    b();

    }

    function b()();

    ```


    The call stack in this example is composed of "a" followed by "b". When "b" is
    reached, v8 doesn''t have anything left to execute.


    Return to the HTTP server:


    ```

    http.createServer(function () {

    a();

    });

    function a() {

    b();

    }

    function b()();

    ```


    In this example, whenever an HTTP client connects to Node, the event loop dispatches
    a notification. Eventually, the callback function is executed, and the call stack
    becomes "a" > "b".


    Since Node is running in a single thread, while that call stack is being unused
    no other client or HTTP request can be handled.


    You might be thinking, then, that Node maximum concurrency is 1! And that would
    be correct. Node does not offer true parallelism, because that would require the
    introduction of many parallel threads of execution.'
