  md: "Notice despite having specified a header with the writeHead API call, still\
    \ includes two other headers: Transfer-Encoding and Connection.\n\nThe default\
    \ value for the Transfer-Encoding header is chunked. The main reason for this\
    \ is that to Node asynchronous nature, it's not rare for a response to be created\
    \ progressively.\n\nConsider the following example:\n\n```\nrequire('http').createServer(function\
    \ (req, res) {\n  res.writeHead(200);\n  res.write('Hello');\n\n  setTimeout(function\
    \ () {\n    res.end('World');\n  }, 500);\nn}).listen(3000);\n```\n\nNotice that\
    \ you can send data as part of multiple write calls, before the first you call\
    \ end. In the spirit of trying to respond as fast as possible to clients, the\
    \ first time write is called, Node can already send all the response headers and\
    \ the first chunk of data(Hello).\n\nLater on, when the setTimeout callback is\
    \ fired, another chunk can be written. Since this time around you use instead\
    \ of write, Node finishes the response and no further writers are allowed.\n\n\
    Another instance where writing in chunks is efficient when the file system is\
    \ involved. It's not uncommon for web servers to serve files like images that\
    \ are somewhere in the hard drive. Since Node can write a response in chunks,\
    \ and also allows us to read a file in chunks, you can leverage the ReadStream\
    \ filesystem APIs for this purpose.\n\nThe following example reads the image.png\
    \ and serves it with the right Content-Type header:\n\n```\nrequire('http').createServer(function\
    \ (req, res) {\n  res.writeHead(200, {'Content-Type': 'image/png'});\n  var stream\
    \ = require('fs').createReadStream('image.png');\n  stream.on('data', function\
    \ (data) {\n    res.write(data);\n  });\n  stream.on('end', function () {\n  \
    \  res.end();\n  });\n}).listen(3000);\n```"
  merge: -1
  pgno: 105
- img_proc: true
  md: "# CHAPTER 7\n\nBy writing the image as a series of chunks, you ensure:\n\n\
    +   - Efficient memory allocation. If you read the image completely for each request\
    \ prior to writing it (by leveraging fs.readFile), you'd probably end up using\
    \ more memory over time when handles lots of requests.\n- You write data as soon\
    \ as it becomes available to you.\n\nIn addition, notice that what you're piping\
    \ one Stream (as FS one) onto another (an http.ServerResponse object). As I've\
    \ mentioned before, streams are a very important abstraction in Node.JS. Piping\
    \ streams are a very common action, so Node.JS offers a method to make the above\
    \ example succinct:\n\n```\nrequire('http').createServer(function (req, res) {\n\
    \  res.writeHead(200, { 'Content-Type': 'image/png' });\n  require('fs').createReadStream('image.png').pipe(res);\n\
    }).listen(3000);\n```\n\nNow that you use Node defaults to a chunked transfer\
    \ encoding, let's talk about connections.\n\n# CONNECTIONS\n\nIf you compare your\
    \ TCP server implementation and your HTTP server implementation by side, you notice\
    \ they're similar. In both cases, you call createServer, and in both cases, you\
    \ get a callback when a client connects.\n\nA fundamental difference, however,\
    \ is the type of object you get in that callback. In the case of the net server,\
    \ you get a connection, and in the case of an HTTP server, you get request and\
    \ response objects.\n\nThe reason for this is two-fold. The first, the HTTP server\
    \ is a higher-level API that gives you tools to handle the specific set of functionality\
    \ and behaviors inherent to the HTTP protocol.\n\nFor example, look at the headers\
    \ property of the request object (the req parameter in the example) when a common\
    \ web browser accesses the server (see Figure 7-6). For this experiment, use console.log(req.headers):\n\
    \n```\nrequire('http').createServer(function (req, res) {\n  console.log(req.headers);\n\
    \  res.writeHead(200, { 'Content-Type': 'text/html' });\n  res.end('Hello <b>World</b>');\n\
    }).listen(3000);\n```"
  merge: -1
  pgno: 106
- img_proc: true
  md: "# 94 PART II\n\n# 1. node\n\n```\n// server.js\n{\n  host: '127.0.0.1:3000',\n\
    \  'user-agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_8) AppleWebKit/537.36\
    \ (KHTML, like Gecko) Version/9.0.2 Safari/537.36',\n  'accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,**',\n\
    \  'cache-control': 'max-age=0',\n  'accept-language': 'en-us',\n  'accept-encoding':\
    \ 'gzip, deflate',\n  connection: 'keep-alive'\n}\n```\n\nFigure 7-6: The Server\
    \ headers property as output by console.log.\n\nNotice that Node does a lot of\
    \ the heavy work for you. It takes the incoming message by the browser, parses\
    \ it, and constructs a JavaScript object that you can conveniently use from your\
    \ scripts. It even makes headers lowercase so that you don't have to remember\
    \ if it was Content-type or Content-Type or Content-Type.\n\nThe second, even\
    \ more important reason is that browsers don't use a single connection when they\
    \ access websites. Modern browsers can open up to eight connections to the same\
    \ host and send requests over all of them in an effort to make websites load faster.\n\
    \nNode makes it easy for you to worry about requests and not connections. Therefore,\
    \ even though you can still access the TCP connection through the property connection,\
    \ you are mostly going to get involved with the request and response abstractions\
    \ here.\n\nBy default, Node tells browsers to keep the connection alive and send\
    \ more requests through it. This is expressed by the keep-alive value of the Connection\
    \ header you saw previously. Normally this is the desired behavior in terms of\
    \ performance (since browsers don't need to waste time tearing down and restarting\
    \ new TCP connections), but you can also override this header by passing a different\
    \ value to the writeHead call, such as Close.\n\nFor your next project, you utilize\
    \ the Node HTTP APIs to perform a real-world task: process a form that the user\
    \ submits.\n\n# A SIMPLE WEB SERVER\n\nThroughout this project you'll leverage\
    \ some of the key concepts outlined above, like the Content-Type header.\n\nYou'll\
    \ also learn how web browsers exchange encoded data as part of submissions, and\
    \ how to parse them into JavaScript data structures."
  merge: -1
  pgno: 107
- img_proc: true
  md: "# CREATING THE MODULE\n\nAs usual, you start by creating the directory where\
    \ your project is going to live and a package.json file:\n\n```\n{\n  \"name\"\
    : \"http-form\",\n  \"description\": \"An HTTP server that processes forms\",\n\
    \  \"version\": \"0.0.1\"\n}\n```\n\nYou test it by running npm install. An empty\
    \ line should be printed because the project has no dependencies.\n\n# PRINTING\
    \ OUT THE FORM\n\nJust as in the Hello <b>World</b> example, you are going to\
    \ print out some HTML. In this case, you want to represent a place. The following\
    \ contents in your server.js file\n\n```\nrequire('http').createServer(function\
    \ (req, res) {\n  res.writeHead(200, { 'Content-Type': 'text/html' });\n  res.end(\n\
    \    <form method=\"POST\" action=\"/url\">\n      <h1>My form</h1>\n      <fieldset>\n\
    \        <label>Personal information</label>\n        <p>What is your name?</p>\n\
    \        <input type=\"text\" name=\"name\">\n        <p><button type=\"submit\"\
    >Submit</button></p>\n      </fieldset>\n    </form>\n  );\n}).listen(3000);\n\
    ```\n\nNotice that for the sake of syntax clarity, I structured the response as\
    \ an array that has combined into a string with the join method. Otherwise, the\
    \ example is equivalent to Hello World.\n\nNotice that the <form> contains an\
    \ endpoint URL /url and a method POST. Also notice that the input the user types\
    \ has a name of name.\n\nNow you can run the server:\n\n```\nnode server.js\n\
    ```"
  merge: -1
  pgno: 108
