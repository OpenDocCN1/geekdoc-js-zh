  md: "If you use the typeof and instanceof operators on these two variables, however,\
    \ they will\nget interesting:\n\n```\ntypeof a; // 'string'\ntypeof b; // 'object'\n\
    a instanceof String; // false\nb instanceof String; // true\n```\n\nHowever, both\
    \ are definitely strings that have the same prototypical methods:\n\n```\na.substr\
    \ == b.substr; // true\n```\n\nAnd they evaluate in the same way with the == operator\
    \ but not with ===:\n\n```\na == b; // true\na === b; // false\n```\n\nConsidering\
