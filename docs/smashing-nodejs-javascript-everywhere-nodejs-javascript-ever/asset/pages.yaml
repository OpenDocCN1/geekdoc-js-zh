    \ (req, res, next) {\n  if ('GET' == req.method && '/' == req.url) {\n    // serve\
    \ index\n  } else {\n    // let other middleware handle it\n    next();\n  }\n\
    });\n\nserver.use(function (req, res, next) {\n  // last middleware, if you got\
    \ here you don't know what to do with this\n  res.writeHead(404);\n  res.end('Not\
    \ found');\n});\n```\n\nYou not only benefit from the expressive power (the ability\
    \ to break down the app into smaller units), but also benefit from the reusability.\
    \ As you will see, Connect already ships middleware- that performs common tasks.\
    \ To request logging, you can simply use the following:\n\n```\napp.use(connect.logger('dev'))\n\
    ```\n\nAnd that handles logging!\n\nThe next section explains how to write middleware\
    \ that alerts you when a certain request is taking a long time to respond.\n\n\
    # WRITING REUSABLE MIDDLEWARE\n\nMiddleware that notifies you when a request is\
    \ taking too long can be useful under many circumstances. For example, imagine\
    \ you have a page that makes a series of requests to a database. Under your tests,\
    \ everything responds within 100 milliseconds (ms), but you want to make sure\
    \ you log whenever processing is taking longer than that.\n\nYou start by creating\
    \ middleware in a separate module (file) called request-time.js.\n\nThe purpose\
    \ of this module is to expose a function that returns a function. This is a very\
    \ common pattern for middleware that allows for configurability. When you summoned\
    \ connect.logger in the previous example, you passed a parameter to it, and returns\
    \ the function that eventually handles the requests.\n\nThe module for now takes\
    \ a single option, the number of milliseconds after which you want to log the\
    \ request as problematic:"
