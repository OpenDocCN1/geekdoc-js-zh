  md: "# 296 PART V\n\nFor that, you simply define an argument as part of the callback.\
    \ In other words, as you saw in Chapter 2, you set the arity of the function (or\
    \ the function#length) to 1:\n\n```\nit('should not throw', function (done) {\n\
    \  setTimeout(function () {\n    assert.ok(1 == 1);\n  }, 1000);\n});\n});\n```\n\
    \nThe test now behaves similarly to middleware. Mocha waits until the done function\
    \ is called. If the function is not called within 2 seconds (default), a timeout\
    \ exception is raised to inform you on which test it stuck. You can vary this\
    \ timeout by using the -t option to the mocha command. You can also customize\
    \ it per test as follows:\n\n```\nit('will fail', function () {\n  this.timeout(100);\n\
    \  setTimeout(function () {\n    // the test will timeout before this occurs\n\
    \    done();\n  }, 1000);\n});\n```\n\nTo make the test, invoke done before the\
    \ assertions are done:\n\n```\nit('should not throw', function (done) {\n  setTimeout(function\
    \ () {\n    assert.ok(1 == 1);\n    done();\n  }, 1000);\n});\n```\n\nThus, you\
    \ could rewrite the Bieber Twitter client in Mocha like this:\n\n```\nit('should\
