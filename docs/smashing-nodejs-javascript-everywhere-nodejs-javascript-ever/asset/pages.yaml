- img_proc: true
  md: '# CHAPTER 9 EXPRESS


    WHEREAS CONNECT PROVIDES the foundation for the common set of basic tasks that
    are normally performed on top of the HTTP module, Express provides convenient
    APIs on top of Connect to build entire websites and web applications.


    Express builds on top of Connect and therefore on the idea that you can reuse
    middleware that performs certain basic tasks. This means you get an expressive
    API for your web''applications, without sacrificing a rich ecosystem of reusable
    components that sit on top of the HTTP stack.


    Throughout the examples in Chapter 8, you might have noticed most of the tasks
    performed in the interaction between a web browser and web server are organized
    around methods and URLs.s. The combination of these two is what is sometimes referred
    to as routes, a concept that sets the foundation for an Express app.


    To see the expressiveness hands-on, write a small application powered entirely
    by Express to search the Twitter API.'
