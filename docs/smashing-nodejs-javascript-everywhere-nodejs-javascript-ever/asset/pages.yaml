  md: "You leverage assert.ok to guarantee that the value supplied is truthy (that\
    \ is, it evaluates to true even if it's not true). If the number is divisible\
    \ by 2 with no remainder, it means the number is even.\n\nNow run the program\
    \ a few times and look at the timestamps:\n\n```\n$ simple-testing node assert-example.js\n\
    1325520251830\n$ simple-testing node assert-example.js\n1325520252742\n$ simple-testing\
    \ node assert-example.js\n1325520253637\n```\n\n```\nnode.js:134\n throw: // process.nextTick\
    \ error, or 'error' event on first tick\n\nAssertionError: true = false\nat Object.<anonymous>\
    \ (assert-example.js:14:8)\nat Module..compile (module.js:411:26)\nat Object..js\
    \ (module.js:417:10)\nat Module.load (module.js:343:31)\nat Function.__load (module.js:302:12)\n\
    at Array.<anonymous> (module.js:430:10)\nat EventEmitter..tickCallback (node.js:126:26)\n\
    ```\n\nIn the first two cases, it's an even number, so the test exits cleanly.\
    \ In the third execution, the timestamp is an odd number, and therefore you get\
    \ a stack trace.\n\n# THE TEST PROGRAM\n\nNow leverage superagent to make a GET\
    \ request with the search term bieber and then analyze the response:\n\n```\n\
    /*\n * Module dependencies.\n */\nvar request = require('superagent')\n , assert\
    \ = require('assert')\n\n/**\n * Tests /search?q=<tweet>\n */\nrequest.get('http://localhost:3000')\n\
    \  .data({ q: 'bieber' })\n  .exec(function (res) {\n```"
