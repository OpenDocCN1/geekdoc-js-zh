  md: "# TRANSPORTS\n\nOne of the most appealing features about Socket.IO is that\
    \ communication is based on transports, not all of which are WebSocket, which\
    \ means Socket.IO works on a large variety of browsers and devices, all the way\
    \ from IE6 to iOS.\n\nFor example, you can utilize AJAX as a method for real-time\
    \ communication when using a technique called long polling. Basically, this technique\
    \ consists of making serial AJAX calls, but if the server doesn't have any data\
    \ to send to you, the connection stays open for 20-50 seconds so that no extra\
    \ data transfer due to HTTP request/response headers occurs.\n\nSocket.IO automatically\
    \ leverages complex and convoluted techniques such as long polling for you, without\
    \ making the API any more complicated than WebSocket.\n\nIn addition, if WebSocket\
    \ is supported by the browser but blocked by proxies or firewalls, Socket.IO can\
    \ still handle that situation gracefully.\n\n# DISCONNECTED VERSUS CLOSED\n\n\
    Another fundamental feature Socket.IO brings to the table is timeouts. as discussed\
    \ in Chapters 6 and 10, an application that relies on perfectly closed TCP connections\
    \ is not ready for real-world usage.\n\nThroughout your use of Socket.IO in this\
    \ chapter, you listen on connect instead of open, and disconnect instead of close.\
    \ The reason is that Socket.IO provides reliable events. If the client stops transmitting\
    \ data but doesn't properly close the connection after a certain amount of time\
    \ elapses, Socket.IO considers him disconnected.\n\nThis approach allows you to\
    \ focus on the core of your application logic instead of all of the possible hiccups\
    \ of networks.\n\nSocket.IO also takes care of reconnecting when the connection\
    \ is lost, which happens automatically by default.\n\n# EVENTS\n\nSo far you that\
    \ typical communication on the web has been oriented around retrieving (requesting)\
    \ documents (resources) over HTTP. The real-time web, however, is about the transmission\
    \ of events.\n\nEven though Socket.IO still allows you to transmit simple text\
    \ back and forth like WebSocket, it also enables you to emit and listen on events\
    \ that send JSON data back and forth. In the following example you can see Socket.IO\
    \ acting as:\n\n```\nio.sockets.on('connection', function (socket) {\n  socket.emit('a');\n\
    \  socket.on('message', function (msg) {\n```"
