  md: '# THE SETUP


    **INSTALLING NODE.JS** is a painless process. Since its conception, one of its
    goals has been maintaining a small number of dependencies that would make the
    compilation or installation of the project very seamless.


    This chapter describes the installation process for Windows, OS X, and Linux systems.
    For the latter, you''re going to ensure that you have the correct dependencies
    and compile it from the source.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Note: When you see lines prefixed with $ in the code snippets in the book,
    you should type these expressions into your OS shell.


    # INSTALLING ON WINDOWS


    On Windows, go to http://nodejs.org and download the MSI installer. Every release
    of node has a corresponding MSI installer that you need to download and execute.


    The filename follows the format node-v?.?.?.msi, simply follow the instructions
    in the setup wizard shown in Figure 1-1.


    To ensure that the installation worked, open the shell or command prompt by running
    cmd. exe and typing $ node -version.


    The name of the package you just installed should display.


    ![](img/c641d3b47d2abe2a65f037111c97ed26_21_0.png)


    # INSTALLING ON OS X


    On the Mac, similarly to Windows, you can leverage an installer package. From
    the Node.JS website, download the PKG file that follows the format node-v?.?.?.pkg.
    If you want to compile it instead, you have XCode installed and follow the Compilation
    instructions for Linux.


    Run the downloaded package and follow the simple steps (see Figure 1-2).


    To ensure installation was successful, open the shell or terminal by running Terminal
    . app (you can type in "Terminal" in Spotlight to locate it) and type in $ node
    -version.


    The version of Node you just installed should be outputted.


    ![](img/c641d3b47d2abe2a65f037111c97ed26_21_1.png)


    # INSTALLING ON LINUX


    Compiling Node.JS is almost as easy as installing binaries. To compile it in most
    *nix systems, simply make sure a C/C++ compiler and the OpenSSL libraries are
    available.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Most Linux distributions come with a package manager that allows for the easy
    installation of these.


    For example, for Amazon Linux, you use


    ```

    > sudo yum install gcc gcc-c++ openssl-devel curl

    ```


    On Ubuntu, the installation is slightly different; you use


    ```

    > sudo apt-get install g++ libssl-dev apache2-utils curl

    ```


    # COMPILING


    From your OS terminal, execute the following commands:


    > Note: Replace with the latest available version of node in the following example.


    ```

    $ curl -O http://nodejs.org/dist/node-v-?.?.?.tar.gz

    $ tar -xzf node-v-?.?.?.tar.gz

    $ cd node-v-?.?.?

    $ ./configure

    $ make

    $ make test

    $ make install

    ```


    If the make test command aborts with errors, I recommend you stop the installation
    and post a log of the . ./configure, make, and make test commands to the Node.JS
    mailing list.


    # ENSURING THAT IT WORKS


    Launch a terminal or equivalent, such as XTerm, and type in $ node-version.


    The version of Node you just installed should be outputted.


    # THE NODE REPL


    To run the Node REPL, simply type node.


    Try running some JavaScript expressions. For example:


    ```

    > Object.keys(global)

    ```


    > Note: When you see lines prefixed with > in the code snippets in the book, you
    should run these expressions in the REPL.'
  merge: -1
  pgno: 22
- img_proc: true
  md: "The REPL is one of my favorite tools for quickly verifying different Node or\
    \ vanilla JavaScript APIs work as expected. While developing larger modules, it\
    \ is often useful to check a certain API works exactly as you remember when unsure.\
    \ To that end, opening a separate terminal tab and quickly evaluating some JavaScript\
    \ primitives in REPL helps immensely.\n\n# EXECUTING A FILE\n\nLike most scripting\
    \ languages, Node can interpret the contents of a file by appending a path to\
    \ the node command.\n\nWith your favorite text editor, create a file called my-web-server.js,\
    \ with the following contents:\n\n```\nvar http = require('http');\nvar serv =\
    \ http.createServer(function (req, res) {\n  res.writeHead(200, { 'Content-Type':\
    \ 'text/html' });\n  res.end('<marquee>Smashing Node!</marquee>');\n});\nserv.listen(3000);\n\
    ```\n\n$ node my-web-server.js\n\nThen, as shown in Figure 1-3, point your web\
    \ browser to http://localhost:3000.\n\nIn this snippet, you're leveraging the\
    \ power of Node to script a fully compliant HTTP server that serves a basic HTML\
    \ document. This is the traditional example used whenever Node.JS is being discussed,\
    \ because it demonstrates the power of creating a web server just like Apache\
    \ or IIS with only a few lines of JavaScript.\n\n![](img/c641d3b47d2abe2a65f037111c97ed26_23_0.png)\n\
    \n# NPM\n\nThe Node Package Manager (NPM) allows you to easily manage modules\
    \ in projects by downloading packages, resolving dependencies, running tests,\
    \ and installing command-line utilities.\n\nEven though doing so is not essential\
    \ to the core functionality of the project, you truly need to work efficiently\
    \ on projects that rely on any other pre-existing modules released by third parties."
  merge: -1
  pgno: 23
- img_proc: true
  md: 'NPM is a program written in Node.JS and shipped with the binary packages (the
    MSI Windows installer, and the PKG for the Mac). If you compiled node from the
    source files, you want to install NPM as follows:


    ```

    curl http://npmjs.org/install.sh | sh

    ```


    To ensure successful installation, issue the following command:


    ```

    $ npm --version

    ```


    The NPM version should be displayed.


    # INSTALLING MODULES


    To illustrate the installation of a module with NPM, install the colors library
    in the directory my-project and create an index.js file:


    ```

    $ mkdir my-project/

    $ cd my-project/

    $ npm install colors

    ```


    Verify that the project was installed by ensuring the path node_modules/colors
    was created.


    Then edit index.js with your favorite editor:


    ```

    $ vim index.js

    ```


    And add the following contents:


    ```

    require(''colors'');

    console.log(''smashing node''.rainbow);

    ```


