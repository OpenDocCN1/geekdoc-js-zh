  md: "Finally, you should always let other middleware look at the request, so you\
    \ call next. Otherwise, your app wouldn't do anything!\n\nnext();\n\nThe complete\
    \ middleware code looks like this:\n\n```\n/*\n * Request time middleware.\n *\
    \ Options:\n * - 'time' ('Number'): number of ms after which we log (100)\n *\
    \ @param (Object) options\n * @api public\n */\nmodule.exports = function (opts)\
    \ {\n  var time = opts.time || 100;\n  return function (req, res, next) {\n  \
    \  var timer = setTimeout(function () {\n      console.log(\n        '\\033[90m%%\
    \ %s \\033[39m \\033[91mis taking too long!\\033[39m',\n        req.method,\n\
    \        req.url\n      );\n    },\n    time);\n  };\n\n  var end = res.end;\n\
    \  res.end = function (chunk, encoding) {\n    res.end = end;\n    res.end(chunk,\
    \ encoding);\n    clearTimeout(timer);\n  });\n  next();\n  };\n};\n```\n\nTo\
    \ test this example, create a quick Connect app that has two different routes:\
    \ one that gets resolved quickly and one that takes a second:\n\nYou start with\
