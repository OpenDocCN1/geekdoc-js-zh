  md: '![](img/c641d3b47d2abe2a65f037111c97ed26_212_0.png)


    Figure 11-4: The DJ+Chat application in action


    # # SUMMARY


    Socket.IO is a really simple but extremely powerful API to build applications
    that communicate data back-and-forth really fast, in real time. Socket.IO gives
    you the confidence that this data exchange happens not as fast as possible, but
    also that it works on every browser and lots of mobile devices.


    During this chapter you learned how to structure a really simple application that
    takes advantage of some of the API sugar it provides. You leveraged events as
    a way of organizing the different type of information that gets sent back forth
    between users and the server.


    A fundamental part of writing real time applications is broadcasting. You learned
    how to convey an event to everyone in the server, but also how to have one person
    convey something to everyone else. You used this technique, for example, to enable
    a DJ to announce what song is currently playing to everyone else.


    One thing to keep in mind is that a lot of functionality is contained in the client
    side: you need to have code ready to restructure the interface according the variety
    of events that can happen. Since this chapter focuses solely on Socket.IO, I made
    sure to stay away from templating libraries or higher-level frameworks that can
    be leveraged on the client-side and worked on top of the DOM APIs directly, but
    in the real world this get quite complicated as the application grows.'
