  md: '# PART I • Getting Started: Setup and Concepts


    Buffer is a global object that represents a fixed memory allocation (that is,
    the number of bytes that are put aside for a buffer to be known in advance), which
    behaves like an array of octets, effectively letting you represent binary data
    in JavaScript.


    A part of its functionality is the capability to convert data between encodings.
    For example, you can create a buffer from the base64 representation of an image
    and then write it down to a file as a binary PNG that can actually be used:


    buffers/index.js


    ```

    var mybuffer = new Buffer(''==ij2j3h3i23h'',''base64'');

    console.log(mybuffer);

    require(''fs'').writeFile(''logo.png'', mybuffer);

    ```


    For those not with base64, it is essentially a way of writing binary data with
    only ASCII characters. In other words, it allows you to represent something as
    complex as an image in simple English characters (therefore taking up a lot more
    hard drive space).


    Most of Node.JS APIs that do data IO and export data as buffers. In this example,
    the writeFile API from the filesystem module takes a buffer as a parameter to
    write out the file logo.gif.


    ![](img/c641d3b47d2abe2a65f037111c97ed26_61_0.png)


    Run it and open the file (see Figure 4-5).


    ```

    $ node index

    $ open logo.png

    ```


    As you can see the result of the Buffer object, log call with a simple interface
    to the raw bytes that make an image.


    # SUMMARY


    You have now looked at the major differences between the JavaScript you write
    for the browser and the one you write for Node.JS.


    You have a basic grasp of the APIs that Node added for patterns that are extremely
    common in day-to-day JavaScript but absent from the main language specification,
    such as timers, events, binary data, and modules.


    You know the equivalent of window in Node, and that you can leverage existing
    developer utilities like'
