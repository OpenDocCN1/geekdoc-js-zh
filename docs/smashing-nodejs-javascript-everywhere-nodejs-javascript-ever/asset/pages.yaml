    # SUMMARY


    In this chapter you were introduced to one of the most popular databases in the
    Node.JS world: MongoDB.


    You learned the basics of how document databases work, and explored the utilization
    of the MongoDB driver in Node.JS.


    You noticed how natural it is to work with data in this way, and how well it maps
    to how data is usually sent back and forth between a browser and the web server.


    By refactoring our first example, you now appreciate the significant advantages
    introduced by a framework that introduces the notion of models, among other very
    convenient APIs.'
