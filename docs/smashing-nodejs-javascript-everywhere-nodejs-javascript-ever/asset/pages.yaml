  md: "# STRINGS\n\nStrings in Redis contemplate both the Number and String data type\
    \ in JavaScript.\n\nIn addition to using SET and GET, you can increment and decrement\
    \ numbers:\n\n```\nredis 127.0.0.1:6379 SET online.users 0\nOK\nredis 127.0.0.1:6379\
    \ INCR online.users\n(integer) 1\nredis 127.0.0.1:6379 INCR online.users\n(integer)\
    \ 2\n```\n\n# HASHES\n\nIn the Redis world, hashes are the equivalent of subobjects.\
    \ Those subobjects are limited to keys and values that are strings, unlike MongoDB.\n\
    \nSay you want to store a user profile in Redis that looks like this:\n\n```\n\
    {\n  \"name\": \"Guillermo\",\n  \"last\": \"Rauch\",\n  \"age\": \"21\"\n}\n\
    ```\n\nBecause both keys and values are strings (or integers), it's a suitable\
    \ data structure for a hash.\nIn the profiles, you need to include the user ID\
    \ as part of the key to uniquely identify it. The Redis database looks something\
    \ like this:\n\n```\n{\n  \"profile:1\": { name\": \"Guillermo\", \"last\": \"\
    Rauch\", . . . },\n  \"profile:2\": { name\": \"Tobi\", \"last\": \"Rauch\", .\
    \ . }\n}\n```\n\nThe use of the colon (:) in this case is completely up to you.\
    \ You could use a dot, an underscore, or nothing. The fundamental premise is that\
    \ each key remains unique key to avoid collisions when interacting with the documents\
    \ and that it contains information for you to access easily from your application.\n\
    \nThe basic command for operating with hashes is HSET:\n\n```\nredis 127.0.0.1:6379\
    \ HSET profile.1 name Guillermo\n(integer) 1\n```\n\nThis command is equivalent\
    \ to simply setting a key in JavaScript:"
