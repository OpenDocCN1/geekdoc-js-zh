  md: "And then you complete the `/create` route:\n\n# server.js\n\n/**\n * Item creation\
    \ route.\n */\n\n```\napp.post('/create', function (req, res, next) {\n  db.query('INSERT\
    \ INTO item SET title = ?, description = ?',\n    [req.body.title, req.body.description],\
    \ function (err, info) {\n      if (err) return next(err);\n      console.log('-\
    \ item created with id %s', info.insertId);\n      res.redirect('/');\n    });\n\
    });\",\n```\n\nThis code has two interesting aspects. The first is that `db.query`\
    \ allows for replacing tokens with properly escaped data. By replacing tokens,\
    \ the code avoids concatenation and ensures that your app is not vulnerable to\
    \ SQL injection attacks. If you include a query, you pass an array of values to\
    \ replace as the second parameter.\n\nThe other interesting aspect is the `info`\
    \ object. In this case, to get the ID of the inserted item, you look for `itemId`\
    \ in the review. This property is always present provided an error doesn't occur.\
    \ If an error does occur, you want to interrupt all flow and next it.\n\nThe review\
    \ creation route is similar:\n\n/**\n * Item review creation route.\n */\n\n```\n\
    app.post('/item/:id/review', function (req, res, next) {\n  db.query('INSERT INTO\
    \ review SET item_id = ?, stars = ?',\n    [req.params.id, req.body.stars, req.body.text],\
    \ function (err, info) {\n      if (err) return next(err);\n      console.log('-\
    \ review created with id %s', info.insertId);\n      res.redirect('/item/' + req.params.id);\n\
    \    });\n});\n```\n\nYou test by running the app and creating an item (illustrated\
    \ in Figure 13-2)."
