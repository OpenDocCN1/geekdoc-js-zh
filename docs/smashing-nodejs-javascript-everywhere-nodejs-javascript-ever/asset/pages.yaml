  md: "# config.json\n\n```\n{\n  \"host\": \"localhost\",\n  \"database\": \"cart-example\"\
    \n}\n```\n\nNote that JavaScript is not necessarily valid JSON. For this example,\
    \ you add add quotation marks around all keys and ensure all values are surrounded\
    \ with double quotation marks instead of single quotation marks.\n\nStarting with\
    \ Node 0.6, you can use require to load JSON files without relying on JSON.parse\
    \ and fs#readFileSync. You then edit the dependencies:\n\n# server.js\n\n```\n\
    /*\n * Module dependencies.\n */\n\nvar express = require('express')\n  , mysql\
    \ = require('mysql')\n  , config = require('./config')\n\n// ... ...\n```\n\n\
    In the connection line, you replace the object with the config reference:\n\n\
    # server.js\n\n```\nvar db = mysql.createClient(config);\n```\n\nYou are now ready\
    \ to create the setup script. It depends only on mysql and the config because\
