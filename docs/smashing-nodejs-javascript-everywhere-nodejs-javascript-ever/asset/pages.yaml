- img_proc: true
  md: "certain key is not indexed, especially if it's found within a nested structure,\
    \ it could result in a tablescan lookup and a performance decrease in your application.\n\
    \nMongoDB has a command called ensureIndex that, as the name implies, you can\
    \ call regardless of whether an index exists to ensure it's there before querying.\
    \ You can do so at the initialization step of the application.\n\nAfter setting\
    \ up, you should then add two ensureIndex calls:\n\n```\nclient.ensureIndex('users',\
    \ 'email', function (err) {\n  if (err) throw err;\n  client.ensureIndex('users',\
    \ 'password', function (err) {\n    if (err) throw err;\n    console.log('\\u033[96m\
    \ + \\u033[39m ensured indexes');\n  }\n});\n\n// listen\napp.listen(3000, function\
    \ () {\n  console.log('\\u033[96m + \\u033[39m app listening on *:3000');\n});\n\
    }\n```\n\nIf you relaunch the app, you notice the extra log:\n\n```\n$ node server.js\n\
    + connected to mongodb\n+ ensured indexes\n+ app listening on :3000\n```\n\nYou\
    \ can now start querying!\n\n```\n/**\n * Login process route\n */\napp.post('/login',\
    \ function (req, res) {\n  app.users.findOne({ email: req.body.user.email, password:\
    \ req.body.user.password }, function (err, doc) {\n    if (err) return next(err);\n\
    \    if (!doc) return res.send('<p>User not found. Go back and try again</p>');\n\
    \    req.session.loggedIn = doc.id.toString();\n    res.redirect('/');\n  });\n\
    });\n```\n\nIn the same way as the insert command, the findOne command takes a\
    \ MongoDB query document."
