  md: "# ACCESSING MONGODB: A USER AUTHENTICATION EXAMPLE\n\nThe most essential way\
    \ of accessing MongoDB documents through Node.JS is with a driver. What is normally\
    \ called a driver in Node.JS is a basic API that understands the protocol of the\
    \ network access layer of the database and how to encode and decode the data that\
    \ it stores.\n\nThe project of choice is called node-mongodb-native, created by\
    \ Christian Amor Kvalheim. You can find it in the Node Package Manager (NPM) with\
    \ name mongodb.\n\nFor the first example, you create a simple Express application\
    \ that stores users' information in MongoDB and allows you to log in and sign\
    \ up.\n\n# SETTING UP THE APPLICATION\n\nYou create your package.json with the\
    \ dependencies for the project. In this, they're simply express and mongodb. In\
    \ addition, for the templates, you use jade:\n\n```\n{\n  \"name\": \"user-auth-example\"\
    ,\n  \"version\": \"0.0.1\",\n  \"dependencies\": {\n    \"express\": \"2.5.8\"\
    ,\n    \"mongodb\": \"0.9.9\",\n    \"jade\": \"0.20.3\"\n  }\n}\n```\n\n# CREATING\
    \ THE EXPRESS APP\n\nYou start by requiring your dependencies as you normally\
    \ using require:\n\n```\n/**\n * Module dependencies\n */\n```\n\n```\nvar express\
    \ = require('express');\nmongodb = require('mongodb');\n```\n\nThis application\
    \ deals with form processing, so you are going to implement the bodyParser middleware.\n\
    \nBecause you also want to authenticate users and retain that information, you\
    \ also leverage the session middleware (which depends on the cookieParser Connect\
    \ middleware, as explained in Chapter 8).\n\n```\n/**\n * Set up application.\n\
    ```"
