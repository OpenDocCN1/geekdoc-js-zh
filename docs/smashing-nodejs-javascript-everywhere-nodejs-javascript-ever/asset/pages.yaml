  md: "# A SIMPLE EXPRESS APP\n\nThis app, albeit simple, by definition dynamic. When\
    \ the user requests \"tweets\" for their search term, you need to produce HTML\
    \ that contains them. Instead of concatenating strings that make up HTML manually\
    \ in our request handlers, you'll be leveraging a simple template language that\
    \ will split the logic of the controller from the view.\n\nThe first step will\
    \ be to ensure we have the module requirements that satisfy these needs.\n\n#\
    \ CREATING THE MODULE\n\nCreate package.json as usual, but this time add two extra\
    \ dependencies: ejs, the template engine for this example, and superagent, to\
    \ simplify the HTTP requests for the Twitter searches.\n\n```\n{\n  \"name\":\
    \ \"express-tweet\",n  \"version\": \"0.0.1\",n  \"dependencies\": {\n    \"express\"\
    : \"2.5.9\",n    \"ejs\": \"0.4.2\",n    \"superagent\": \"0.3.0\"\n  }\n}\n```\n\
    \nPlease notice that even though I'm using Express 2 for this example, the code\
    \ should be completely compatible with Express 3 (under development at the time\
    \ of this writing).\n\nThe next step after defining the meta data for the project\
    \ will be to create the templates that produce the HTML you need.\n\n# HTML\n\n\
    Unlike did in the previous applications, you are going to use a simple template\
    \ language to avoid having HTML code directly in the application logic (what is\
    \ normally called controllers or route handlers). This template language is called\
    \ EJS (or embedded js), and is similar to embedding PHP in HTML.\n\nYou start\
    \ by defining index.js folder/ The templates can live anywhere, but for the sake\
    \ of project structure, put them in a separate directory.\n\nThe first template\
    \ gets served for the default route (the home page). It prompts the user to submit\
    \ a search term to crawl Twitter:\n\n```\n<h1>Twitter app</h1>\n<p>Please enter\
    \ your search term:</p>\n<form action=\"/search\" method=\"GET\">\n  <input type=\"\
    text\" name=\"q>\n```"
