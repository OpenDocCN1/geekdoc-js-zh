- img_proc: true
  md: "You can create the database from the command line as follows. Remember to replace\
    \ root with your MySQL user in the Sequelize constructor and follow the command\
    \ below:\n\n```\n$ mysqldmin -u root -p create todo-example\n```\n\n# DEFINING\
    \ MODELS AND SYNCHRONIZING\n\nTo define a model, you call sequelize.define. You\
    \ can do this directly after requiring sequelize. The first parameter is the name\
    \ that identifies the model, and the second is an object of properties.\n\n```\n\
    server.js\nvar Project = sequelize.define('Project', {\n  title: Sequelize.STRING,\n\
    \  description: Sequelize.TEXT,\n  created: Sequelize.DATE\n});\n```\n\nAs you\
    \ can see, you map keys to the following sequelize types. Next to each of them,\
    \ you can see the MySQL type they map to:\n\n+   - Sequelize.STRING // VARCHAR(255)\n\
    - Sequelize.BOOLEAN // TININT(1)\n- Sequelize.TEXT // TEXT\n- Sequelize.DATE //\
    \ DATETIME\n- Sequelize.INTEGER // INT\n\nIn addition to passing the types, you\
    \ can supply options by passing an object. For example, to set a default value,\
    \ pass\n\n```\ntitle: { type: Sequelize.STRING, defaultValue: 'No title' }\n```\n\
    \nYou then set the task model:\n\n```\nserver.js\n/**\n * Define task model.\n\
    \ */\nvar Task = sequelize.define('Task', {\n  title: Sequelize.STRING\n});\n\
    ```"
  merge: -1
