  md: "# CHAPTER 15 • Code Sharing 285\n\n```\n* @param {Function} constructor you\
    \ inherit from\n* @api private\n*/\n\nfunction c inherits (a, b) {\n  function\
    \ c () {}\n  c.prototype = b.prototype;\n  a.prototype = new c;\n}\n```\n\nYou\
    \ can then leverage it for both Node and browsers:\n\n```\nfunction A () {}\n\
    function B () {}\n\ninherits(A, B);\n// instead of A.prototype.__proto__ = B.prototype\n\
    ```\n\n# PUTTING IT TOGETHER: BROWSERBUILD\n\nWrapping your modules with self-invoking\
    \ functions and performing typeof checks all over the place can be a daunting\
    \ experience.\n\nI created a project called browserbuild whose basic premise is\
    \ to empower you to write modules in Node style (that is, that leverage require,\
    \ module.exports, and exports are broken into multiple files). By simply running\
    \ a command, you can compile a browser version.\n\nBrowserbuild makes it possible\
    \ to write the add example you wrote above in Node style, and then generate the\
    \ version you include in the HTML as <script> through a compilation process.\n\
    \nBrowserbuild is available as an NPM module that sets up a browserbuild command-line\
    \ script. To install it globally on your computer, you can run the following:\n\
    \n```\nnpm install -g browserbuild\nbrowserbuild --version\n```\n\nThe second\
    \ command should output the installed version of browserbuild. The version I'll\
    \ use for this section is 0.4.8.\n\nAlternatively, you can install it in the working\
    \ directory and leverage it through the .bin directory locally:\n\n```\nnpm install\
    \ browserbuild\n./node_modules/browserbuild/.bin/browserbuild --version\n```"
