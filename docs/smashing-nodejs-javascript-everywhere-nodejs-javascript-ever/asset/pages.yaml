  md: "To apply the different concepts and features that sequelize brings to the table,\
    \ create a simple TODO tasks can be grouped as projects. You can add, create,\
    \ and remove projects, and you can add, create, and remove tasks for a given project.\n\
    \n# SETTING UP SEQUELIZE\n\nBecause sequelize uses the node-mysql driver internally,\
    \ the dependencies list looks like this:\n\n```\npackage.json\n{\n  \"name\":\
    \ \"todo-list-example\",\n  \"version\": \"0.0.1\",\n  \"dependencies\": {\n \
    \   \"express\": \"2.5.2\",\n    \"jade\": \"0.19.0\",\n    \"sequelize\": \"\
    1.3.7\"\n  }\n}\n```\n\n# SETTING UP THE EXPRESS APP\n\nThis particular application\
    \ deviates a bit from the traditional style and introduces some AJAX interaction\
    \ for creating and removing items. You can make the application more RESTful by\
    \ introducing the usage of the DELETE method. If you're not familiar with REST,\
    \ it's a set of principles that introduce a broader usage of the protocol constructs\
    \ that HTTP makes available to us, such as methods like PATCH or DELETE status\
    \ codes that are normally not utilized.\n\nThe routes look as follows:\n\n+  \
    \ * / (GET): retrieves projects.\n* /projects (POST): creates projects.\n* /project/:id\
    \ (DELETE): deletes a project.\n* /project/:id/id/tasks (GET): retrieves tasks.\n\
    * /project/:id/id/tasks (POST): adds tasks.\n* /task/:id (DELETE): removes a task.\n\
    \n```\n/**\n * Module dependencies.\n */\nvar express = require('express');\n\
    ```"
