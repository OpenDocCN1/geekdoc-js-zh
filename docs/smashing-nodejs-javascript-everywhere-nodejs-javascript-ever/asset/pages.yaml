  md: '# CHAPTER


    # 5 CLI AND FS APIS: YOUR FIRST APPLICATION


    THIS CHAPTER EXAMINES some of the most essential Node.JS APIs: those related to
    the handling of stdin and stdout of a process (stdio) and those related to the
    filesystem (fs).


    As discussed in the preceding chapter, the Node approach to concurrency inherently
    involves the use of callbacks and events. These APIs provide


    your first contact with the flow control involved in nonblocking evented I/O programming.


    In addition to learning how all these APIs interact together, you create your
    first application: a simple command-line explorer, whose goal is to allow the
    user to read and create files.'
