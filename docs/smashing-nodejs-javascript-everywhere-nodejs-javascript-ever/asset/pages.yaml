  md: '# CHAPTER

    13 MYSQL


    DESPITE THE INTRODUCTION increasing popularity of NoSQL, SQL databases are still
    empowering the majority of applications today.


    Node.js has a rich ecosystem of modules designed to work with SQL databases, especially
    the one that is the focus of this chapter: MySQL.


    In the same fashion as Chapter 12 on MongoDB, here you first learn how to leverage
    the raw power of the driver (a project called node-mysql).


    With node-mysql, you write your own SQL queries to interact with the database.


    In addition to the driver, you''re going to learn how to use an Object-Relational
    Mapper (ORM) for MySQL called node-sequelize. As you''ll see, an gives you a mapping
    between JavaScript instances of a model and data contained in your MySQL database,
    making it easier to work with relationships, data sanitization, and much more.'
