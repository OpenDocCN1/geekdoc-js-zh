    \nFigure 14-2: Followers and friends in the social graph\n\n# SUMMARY\n\nRedis\
    \ is in my opinion one of the most important up coming databases, which is why\
    \ I spent the initial part of this chapter teaching you about its fundamentals.\n\
    \nSince it acts as a datructure server, it can not only be used as a regular database\
    \ but also be used as the glue to provide interoperability between small programs.\n\
    \nFor example, in Chapter 9 you learned how to make sure sessions would stick\
    \ around reloading a Node process with connect-redis. Redis could hold those same\
    \ data structures in memory as well, but by separating the data into a different\
    \ process that you can connect over TCP with a simple protocol, you gain freedom\
    \ and independence: your programs can be stopped and started at will, and the\
    \ data will remain accessible.\n\nA surprising number of programs and web applications\
    \ have very simple data models, and the datasets fit very well in memory. For\
    \ those scenarios, I recommend you consider Redis due to its simplicity, reliability,\
    \ and ease of use from Node.js. A testament to this is the very example covered\
    \ in this chapter: you wrote an entire model that covers an important aspect of\
    \ social applications today with the Redis driver!"
