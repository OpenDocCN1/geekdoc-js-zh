  md: '# FUNCTIONS


    Functions are of utmost importance in JavaScript.


    They''re first class: they can be stored in variables as references, and then
    you can pass them around as if they were any other object:


    ```

    var a = function () {

    console.log(a); // passing the function as a parameter

    ```


    All functions in JavaScript can be named. It''s important to distinguish between
    the function name and the variable name:


    ```

    var a = function a () {

    ''function'' = typeof a; // true

    }

    ```


    # THIS, FUNCTION#CALL, AND FUNCTION#APPLY


    When the following function is called, the value of this is the global object.
    In the browser, that''s window:


    ```

    function a () {

    window == this; // true

    }

    ```


    ```

    a();

    ```


    By using the .call and .apply methods, you can change the reference of this to
    a different object when calling the function:


    ```

    function a () {

    this.a = ''b''; // true

    }

    ```


    ```

    a.call({ a: ''b'' });

    ```


    The difference between call and apply is that call takes a list of parameters
    to pass to the function, whereas apply takes an array:


    ```

    function a (b, c) {

    b = ''first''; // true

    c = ''second''; // true

    }

    ```


    ```

    a.call({ a: ''b'' }, ''first'', ''second'');

    a.apply({ a: ''b'' }, [''first'', ''second'']);

    ```'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# FUNCTION ARITY


    An interesting property of a function is its arity, which refers to the number
    of arguments the function was declared with. In JavaScript, this equates to the
    length property of a function:


    ```

    var a = function (a, b, c);

    a.length == 3; // true

    ```


    Even though less common in the browser, this feature is important to us because
    it''s leveraged by some Node.JS frameworks to offer different functionality depending
    on the number of parameters the functions you pass around.


    # CLOSURES


    In JavaScript, every time a function is called, a new scope is defined.


    Variables defined within a scope are accessible only to that scope and inner scopes
    (that is, scopes defined within that scope):


    ```

    var a = 5;


    function woot() {

    a == 5; // true


    var a = 6;


    function test() {

    a == 6; // true

    }


    test();

    };

    }


    woot();

    ```


    Self-invoked functions are a mechanism by which you declare and call an anonymous
    function where your only goal is defining a new scope:


    ```

    var a = 3;


    {function () {

    var a = 5;

    ))();

    ```


    These functions are very useful when you want to declare private variables that
    shouldn''t be exposed to another piece of code.'
