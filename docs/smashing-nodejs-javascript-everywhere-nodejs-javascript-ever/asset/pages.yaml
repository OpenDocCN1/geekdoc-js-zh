  md: "# THE GLOBAL OBJECT\n\nIn the browser, window is the global object. Anything\
    \ that you define in window becomes available to all parts of your code. For example,\
    \ setTimeout is in reality window.\nsetTimeout, and document is window.\n\nNode\
    \ has two similar objects that provide a cleaner separation:\n\n+   - global:\
    \ Just like window, any property attached to global becomes a variable you can\
    \ anywhere.\n- process: Everything that pertains to the global context of execution\
    \ is in the process object. In the browser, there's only one window, and in Node,\
    \ there's only one process at any given time. As an example, in the browser, the\
    \ window name is window.name, and in Node, the name of the process is process.title.\n\
    \nLater chapters dig deeper into the process object because it provides broad\
    \ and interesting functionality, pertaining to command-line programs.\n\n# USEFUL\
    \ GLOBALS\n\nSome functions and utilities available in the browser are not part\
    \ of the language specification but rather are useful things that browsers added\
    \ on top, which today are generally considered to be JavaScript. These are exposed\
    \ as globals.\n\nFor example, setTimeout is not part of ECMAScript, but a function\
    \ that browsers deemed important to implement. As a matter of fact, even if you\
    \ tried, you wouldn't be able to rewrite that in pure JavaScript.\n\nOther APIs\
    \ are in the process of being introduced to the language (and are at the proposal\
    \ stage), but Node.JS adds them because they're needed for us to write our programs\
    \ effectively. An example of this is a setImmediate API, which in Node.js finds\
    \ its equivalent in process.nextTick\n\nThis function allows you to schedule the\
    \ execution of a function at the next iteration of the event loop:\n\n```\nconsole.log(1);\n\
    process.nextTick(function () {\n  console.log(3);\n});\nconsole.log(2);\n```\n\
    \nImagine it something similar to setTimeout(fn, 1) or \"call this function in\
    \ the most immediate future in an asynchronous way.\" You can then understand\
    \ why the previous example will output the numbers in the order 1, 2, 3."
  merge: -1
