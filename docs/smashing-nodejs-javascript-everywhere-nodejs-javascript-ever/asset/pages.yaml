  md: "As you saw in Chapter 9, the res.send method from Express allows you to send\
    \ JSON easily.\n\nWhen you call .save on a model instance, as shown below, sequelize\
    \ can either emit a success event with the built in order or failure with an error.\
    \ Even though the following code is valid within sequelize:\n\n```\nTask.build(req.body).save()\n\
    \  .on('success', function (obj) {\n    res.send(obj);\n  })\n  .on('failure',\
