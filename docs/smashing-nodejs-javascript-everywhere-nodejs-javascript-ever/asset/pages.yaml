  md: "To write a module that does this, you start defining its dependencies. In this\
    \ case, you're only\ngoing to need superagent.\n\n```\nvar request = require('superagent');\n\
    ```\n\nSince the HTTP request made to the Twitter web service we make is essential\
    \ to the function-\ning of your application, you want to make sure the search\
    \ module does proper error handling.\n\nFor example, if the Twitter API is down\
    \ or malfunctioning, you want to pass an error object so\nthat ultimately the\
    \ user sees an error page (for example, showing HTTP status code error 500).\n\
    \n```\n/*\n* Search function.\n* @param (String) search query\n* @param (Function)\
    \ callback\n* @api public\n*/\n```\n\n```\nmodule.exports = function search(query,\
    \ fn) {\nrequest.get('http://search.twitter.com/search.json')\n.data({ q: query\
    \ })\nend(function(res) {\n  if (res.body && Array.isArray(res.body.results))\
    \ {\n    return fn(null, res.body.results);\n  }\n  fn(new Error('Bad twitter\
    \ response'));\n});\n};\n```\n\nSimilar to the other superagent examples, you\
    \ want to make a GET request, sending the\nquerystring data field q with the search\
    \ term. The URL request hit for the search\nterm hello world would be something\
    \ like http://search.twitter.com/search.\njson?q=hello-world.\n\nIn the response\
    \ handler, you're actively making sure that the request works and satisfies our\n\
    expectations completely. Instead of looking at HTTP status codes and verifying\
    \ you got 200\ninstead of something else, it's smarter to ask the question: did\
    \ I get an array of tweets as part\nof the response?\n\nIf you remember from Chapter\
    \ 7, if superagent gets a JSON response, it will automatically\ndecode it and\
    \ place its contents as part of the res.body variable. Since the Twitter API\r\
    esponds with a JSON object with key results containing an array of tweets, the\
    \ following\nsnippet from the code above is all you need for error handling:\n\
    \n```\nif (res.body && Array.isArray(res.body.results)) {\n  return fn(null, res.body.results);\n\
    };\n```"
