  md: '# CHAPTER 9


    The template is the search results, search.ejs. Highlight the current term and
    then walk through the results (if any) or otherwise display a message:


    ```

    <button>Search</button>

    </form>

    <h1>Tweet results for <%= search %></h1>

    <% if (results.length) { %%

    <ul>

    <% for (var i = 0; i < results.length; i++) { %%

    <li><%= results[i].text %> - <span><%= results[i].from_user %></span></li>

    <% } %>

    </ul>

    <% } else { %%

    <p>No results</p>

    <% %>

    ```


    As you can see, all we did was embed JavaScript between the special <% and %>
    EJS tags. In order to print out variables, you need to add extra "=" after <%=.


    # SETUP


    As usual, define your dependencies in a server.js file:


    ```

    var express = require(''express'');

    ```


    After requiring Express, you need to initialize your web server with it. Express
    provides a shortcut method createServer just like Connect that returns an Express
    HTTP server. Add the following line:


    ```

    var app = express.createServer();

    ```


    Unlike popular web frameworks, Express does not require configuration or a specific
    filesystem structure. It''s flexible enough to let you customize every single
    aspect of its functionality.


    For this app, set the template engine (so that you don''t have to include it every
    time you reference your views) and where your views files (templates) are located.
    The method you called earlier, express.createServer, augments servers with a configuration
    system. You can call set to change configuration flags. Add afterwards:


    ```

    app.set(''view engine'', ''ejs'');

    app.set(''views'', __dirname + ''/views/'');

    app.set(''view options'', { layout: false });

    ```


    The third parameter view options defines configuration options that are passed
    to every template when rendering a view. The value layout is set to false here,
    to match what will become a default with Express 3.'
