    \ so before you make the server listen. Because the logic of the application depends\
    \ completely on the database, it wouldn't make sense to allow requests to come\
    \ in before you're ready to query data for them.\n\nBecause you're using the MongoDB\
    \ driver directly, the API is verbose. The goal, however, is to expose the MongoDB\
    \ collection API as app.users so that any route can access it easily.\n\nYou first\
    \ initialize the server by creating a mongodb.Server and supplying an IP and port:"
