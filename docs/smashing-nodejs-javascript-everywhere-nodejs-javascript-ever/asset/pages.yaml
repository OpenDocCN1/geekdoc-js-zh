  md: '![](img/c641d3b47d2abe2a65f037111c97ed26_69_0.png)


    Figure 5-6: Writing Hello World in the first case yields a newline, but not in
    the second case


    Now look at the source:


    ```

    // example-1.js

    console.log(''Hello world'');

    ```


    and


    ```

    // example-2.js

    process.stdout.write(''Hello world'');

    ```


    The process global contains three Stream objects that match the three Unix Standard
    Streams:


    +   - **stdin**: Standard input

    - **stdout**: Standard output

    - **stderr**: Standard error


    These Stream objects are illustrated in Figure 5-7.


    The first one, stdin, is a readable stream, whereas stdout and stderr are writeable
    streams.


    The default state of the stdin Stream is paused. Normally, when a program is executed,
    it does something and then exits. Sometimes, however, and such is the case in
    this application, you need to keep the program running so that the user can enter
    some data.


    ![](img/c641d3b47d2abe2a65f037111c97ed26_69_1.png)


    Figure 5-7: The stdin, stdout, and stderr objects in the context of a traditional
    text terminal


    When you resume Stream, Node watches the underlying file descriptor (that in Unix
    receives the number 0), keeping the event loop running and not exiting your program,
    waiting for events to be triggered. Node.JS always exits automatically, unless
    it''s waiting on IO.'
