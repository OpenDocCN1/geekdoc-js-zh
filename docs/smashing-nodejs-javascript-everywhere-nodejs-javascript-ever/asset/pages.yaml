  md: "# TDD STYLE\n\nThe next style is called test-driven development (TDD). It's\
    \ similar to BDD, but the organization is set around suites and tests.\n\nEach\
    \ suite can have setup and teardown functions associated with them. These functions\
    \ are executed prior to each test in the suite, and avoid code repetition while\
    \ maximizing testing isolation.\n\nFor example, say you want to test the Node\
    \ net client. At the beginning of each test of the suite, you might want to initialize\
    \ a client because each test in the suite leverages one, and at the end, you want\
    \ to close the connection.\n\n```\nsuite('net', function () {\n\nsuite('Stream',\
    \ function () {\n\n  var client;\n\n  suiteSetup(function () {\n    client = net.connect(3000,\
    \ 'localhost');\n  });\n\n  test('connect event', function (done) {\n    client.on('connect',\
    \ done);\n  });\n\n  test('receiving data', function (done) {\n    client.write('');\n\
    \    client.once('data', done);\n  });\n\n  suiteTeardown(function () {\n    client.end();\n\
    \  });\n\n});\n\n});\n```\n\n# EXPORTS STYLE\n\nThe exports style leverages the\
    \ node module system to expose tests.\n\nEach key exported constitutes the equivalent\
    \ of a suite, and nested suites can appear as subobjects:"
