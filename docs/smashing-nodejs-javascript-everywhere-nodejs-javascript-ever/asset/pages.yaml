  md: "You therefore write\n\n```\nclient.on('connect', function () {\n  client.write('NICK\
    \ mynick\\r\\n');\n  client.write('USER mynick 0 *:realname\\r\\n');\n  client.write('JOIN\
    \ #node.js\\r\\n');\n});\n```\n\nNote that after each command you need to include\
    \ the delimiter \\r\\n. This is the equivalent to using Telnet and pressing Enter\
    \ in our previous example. \\r\\n is also the delimiter used by the HTTP protocol\
    \ to separate header lines.\n\n# TESTING WITH A REAL-WORLD IRC SERVER\n\nFire\
    \ up an IRC client (such as mIRC on Windows, xChat on Linux, or Colloquy/Linkinus\
    \ on Mac) and point it to\n\n```\nirc.freenode.net\n#node.js\n```\n\nThen start\
    \ the client and watch for mynick to connect:\n\n```\n![] (http://f.cl.ly/items/1b3g3i1w1202U028I23G/Image%202011.11.07%202:31:35%20AM.png)\n\
    ```\n\n# SUMMARY\n\nThis chapter described a simple implementation of a net Client.\
    \ You saw it successfully interoperate with a TCP server that's not your own.\n\
    \nAs an exercise, listen on data events and attempt to parse the incoming data\
    \ that you can print out the messages that other users send to the #node.js channel.\
    \ You can then combine it with the existing code to produce an IRC bot that responds\
    \ to commands automatically. For example, if someone says \"date\"which you can\
    \ detect in the data events), you can output the result of new Date().\n\nMoving\
    \ forward, you will learn about HTTP, the protocol of the web that Node.JS is\
    \ largely famous for. You now have a very solid understanding of the building\
    \ blocks, and learning the HTTP APIs as a \"layer\" on top of TCP gives you true\
    \ in-depth knowledge of the Node.JS core functioning."
