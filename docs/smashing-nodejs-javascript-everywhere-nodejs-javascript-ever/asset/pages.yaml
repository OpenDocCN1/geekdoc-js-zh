  md: '# INSTALLING REDIS


    Redis is officially distributed as a tarball with its complete source code and
    supported under Mac OS and Linux. If you''re familiar with compiling software,
    you can head directly to http://redis.io/download and download the latest stable
    version.


    For the Mac, however, the easiest way to install Redis is with homebrew:


    ```

    $ brew install redis

    ```


    Or with ports:


    ```

    $ sudo port install redis

    ```


    These two package managers will set it up to load upon bootup, unlike when you
    install from the source code. To make it run when compiling, you can run the following
    command:


    ```

    $ nohup redis-server &

    ```


    For Windows, there''s unofficial ports that are well maintained. Refer to the
    URL above for the latest up-to-date information about Windows support.


    # THE REDIS QUERY LANGUAGE


    To start learning the Redis query language (the equivalent of SQL in the Redis
    world, in other words), make sure the server is running; then execute


    ```

    $ redis-cli

    ```


    As you execute node, redis-cli takes you to a prompt that''s not unlike establishing
    a telnet connection to the Redis server. In other words, the commands you''re
    about to execute are almost the same as the Node client executes when it establishes
    a TCP connection to Redis.


    The first command to execute KEYS. Commands in Redis are not case sensitive, but
    by convention they usually are uppercase.


    Like function calls, commands can take an arbitrary number of arguments. If you
    execute the KEYS command without arguments, Redis comes back with an error:


    ```

    redis-127.0.0.1:6379> KEYS

    (error) ERR wrong number of arguments for ''keys'' command

    ```


    The KEYS command takes a pattern to match keys against and returns them. You supply
    * to match all keys:'
  merge: -1
  pgno: 272
- img_proc: true
  md: '```

    redis 127.0.0.1:6379> KEYS *

    (empty list or set)

    ```


    Because the Redis installation is new here, it comes back with no results.


    You now use the SET command to assign a string to a key. Redis returns OK:


    ```

    redis 127.0.0.1:6379> SET my.key test

    OK

    ```


    Running GET my.key should return the value you just stored:


    ```

    redis 127.0.0.1:6379> GET my.key

    "test"

    ```


    And executing KEYS * should reflect the new key:


    ```

    redis 127.0.0.1:6379> KEYS *

    1) "my.key"

    ```


    The majority of Redis commands depend on which data type you''re working with.
    You use GET and SET to operate with strings, somewhat unintuitively, you can''t
    use GET to "get" as hash.


    # DATA TYPES


    One of the fundamental benefits of Redis''s simple design is that the developer
    can easily predict performance. The database is not a black box, but simply a
    process that holds known data structures in memory that you can access from other
    programs through a simple protocol.


    If you look for the command HEXIST in the official Redis documentation manual,
    you can see that one of the sections contemplated time complexity.


    In the case of the HEXIST command, the time complexity is O(1), or constant time.
    This means that running the HEXIST command takes the same amount of time always,
    no matter the size of the dataset.


    If you look at the SMEMBERS command, the time complexity is O(n), or linear time,
    and it varies according the size of the set. This means that the amount of Redis
    takes to complete the response is directly proportional to how much data you are
    holding in that particular key.


    Because the Redis object model is roughly equivalent to a big, flat JSON, the
    easiest way to understand the different data types is to think of their JavaScript
    counterparts. For each data type, the following sections provide examples of their
    rough equivalents in the JS'
