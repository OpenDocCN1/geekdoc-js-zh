    Next up, you''ll go through the built-in middleware that Connect ships with due
    to the high level of reusability they have in common web applications.


    # STATIC MIDDLEWARE


    Static middleware is probably among the most common type of middleware you will
    use during the development of web applications with Node.


    # Mounting


    Connect allows middleware to be mounted to specific URLs. For middleware like
    static, this can be really useful because it allows you to map an arbitrary URL
    to any directory in your filesystem.


    For example, assume you want to serve a directory called /images when the URL
    /my-images is requested. You can do it with:


    ```

    server.use(''/my-images'', connect.static(path: ''images''));

    ```'
