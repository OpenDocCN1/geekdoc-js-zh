  md: "# LOGGER\n\nThe logger middleware is a useful diagnostics tool for your web\
    \ application. It prints out information about incoming requests and outgoing\
    \ responses to the terminal.\n\nThere are different built-in logging formats you\
    \ can use\n\n+   - default\n- dev\n- short\n- tiny\n\nFor example, in order to\
    \ leverage the dev logger format you would initialize the logger middleware as\
    \ follows:\n\n```\nserver.use(connect.logger('dev'));\n```\n\nConsider the following\
    \ example, a typical \"Hello World\" HTTP server with the logger middleware in\
    \ use:\n\n```\nvar connect = require('connect');\nconnect.createServer({\n  connect.logger('dev'),\n\
    \  function (req, res) {\n    res.write(200);\n    res.end('Hello world');\n \
    \ }\n}).listen(3000);\n```\n\nNotice that I passed a series of middleware functions\
    \ as parameters to the createServer helper function. This is equivalent to initializing\
    \ a Connect server and calling use twice.\n\nWhen you go to http://127.0.0.1:3000\
    \ in your browser, you'll notice two lines get output:\n\n```\nGET / 200 0ms\n\
    GET /favicon.ico 200 2ms\n```\n\nThe browser is requesting /favicon.ico and /,\
    \ and the connect logger is displaying the method for the request, in addition\
    \ to the response code, and how long the process took.\n\ndev is a concise and\
    \ short logging format, giving you insight into behavior and performance while\
    \ you're testing out your web apps.\n\nThe logger middleware allows custom strings\
    \ that represent the format of your output."
  merge: -1
  pgno: 142
