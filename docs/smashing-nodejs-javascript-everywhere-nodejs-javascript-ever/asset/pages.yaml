  md: "# CONNECTING TO MYSQL\n\nThe next step is to add the node-mysql dependency:\n\
    \n# server.js\n\n```\nvar express = require('express')\nmysql = require('mysql')\n\
    ```\n\nTo initialize the connection, you call MongoClient in a similar way to\
    \ the Node API for creating a net client.\n\nIn a similar way Mongoose does for\
    \ mongodb, node-mysql accepts commands before it connects to MySQL, buffers them\
    \ (that is, keeps them around memory), and after the connection is established,\
    \ sends them all to MySQL.\n\nYou therefore don't need to listen on a connection\
    \ callback event, and you simply initialize the client with your settings. Add\
    \ the following after the configuration section of the app:\n\n# server.js\n\n\
    ```\n/*\n* Connect to MySQL.\n */\nvar db = mysql.createClient({\nhost: 'localhost',\n\
    database: 'cart-example'\n});\n```\n\nIf you set a user and password for your\
    \ database, make sure to include them as the user and password options passed\
    \ to the MongoClient API. For more advanced usage, reference to the documentation\
    \ of node-mysql available at http://github.com/felixge/node-mysql.\n\n# INITIALIZING\
    \ THE SCRIPT\n\nPrior to using a SQL database from the application, you almost\
    \ always need to set up the necessary database and tables.\n\nTo make this reusable,\
    \ you create a simple script called setup.js that runs the necessary CREATE TABLE\
    \ commands.\n\nBecause the connection parameters are the same as the ones used\
    \ for the application, you first need to abstract out the configuration as a config.json\
    \ file:"
