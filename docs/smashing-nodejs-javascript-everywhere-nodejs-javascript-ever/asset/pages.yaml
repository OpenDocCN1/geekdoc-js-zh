  md: "# PART III\n\nIf you wanted to obtain a configuration setting, you would call\
    \ app.set with just one flag. For example, if you wanted to print the value of\
    \ the setting views, you would call it like this:\n\n```\nconsole.log(app.set('views'));\n\
    ```\n\nMoving forward, we'll leverage additional methods Express adds to expressively\
    \ define routes, something that you've done a lot bit in Chapter 7 and Chapter\
    \ 8.\n\n# DEFINING ROUTES\n\nInstead of defining middleware that checks the properties\
    \ method and url manually every time, you can use Express to progressively define\
    \ routes by calling the function corresponding to the HTTP method you want to\
    \ handle and then supplying the URL and the handler middleware.\n\nThe methods\
    \ Express adds to the server are get, post, del, patch, and head, matching HTTP\
    \ verbs GET, PUT, POST, DELETE, PATCH, and HEAD, respectively. The following are\
    \ examples of route definitions with:\n\n```\napp.get('/', (req, res, next) =>\
    \ {});\napp.put('/::name', function (req, res, next) => {});\napp.post('/signup',\
    \ function (req, res, next) => {});\napp.del('/user/:id', function (req, res,\
    \ next) => {});\napp.patch('/user/:id', function (req, res, next) => {});\napp.head('/user/:id',\
    \ function (req, res, next) => {});\n```\n\nThe first parameter is the route,\
    \ and the second is the route handler. Route handlers work just like middleware.\n\
    \nNote that routes can take a special format to define variables within them.\
    \ In the example /user/:id, id can take different values and the route will still\
