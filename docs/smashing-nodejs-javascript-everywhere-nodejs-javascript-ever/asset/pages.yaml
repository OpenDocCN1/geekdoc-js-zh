  md: 'After having implemented a TCP server successfully, you should learn how to
    implement TCP clients in Node.JS.


    The client APIs will bear a lot of resemblance to other clients, such as the HTTP
    clients you use to query web services like Twitter, it''s crucial that you understand
    them fully.


    # AN IRC CLIENT PROGRAM


    IRC, which stands for Internet Relay Chat, is yet another protocol based on TCP
    that''s in common. It is normally used through desktop apps, similar to the one
    shown in Figure 6-14, that act as clients to IRC servers.


    ![](img/c641d3b47d2abe2a65f037111c97ed26_96_0.png)


    Figure 6-14: An IRC client (Linkinus) in action on the Mac. Linkinus implements
    the IRC protocol over TCP sockets.


    Because you successfully created a TCP server in the previous part, you''re now
    going to create a TCP client.


    Creating a client involves implementing the IRC protocol. This means that you
    will need to make sure that incoming and outgoing data adhere to the set of commands
    that IRC servers "speak".


    For example, to set a nickname, you send the following string:


    ```

    NICK mynick",

    ```


    IRC is a very straightforward and simple protocol. You can achieve a lot and experience
    interoperability with existing applications and servers (like the one shown in
    Figure 6-14) with just a few simple commands.


    Read on learn how to write a very basic client in Node.JS that connects to a server,
    joins a room and relays a message.


    # CREATING THE MODULE


    As usual, start by creating the directory where your project is going to live
    and a package.json file:'
  merge: -1
  pgno: 96
- img_proc: true
  md: "```\n{\n  \"name\": \"irc-client\",\n  \"description\": \"Our first TCP client\"\
    ,\n  \"version\": \"0.0.1\"\n}\n```\n\nTest it by running npm install. An empty\
    \ line should be printed because the project has no dependencies.\n\n# UNDERSTANDING\
    \ THE NET#STREAM API\n\nIn the same way that you use createServer, the net API\
    \ offers a method called connect with an API, as follows:\n\n```\nnet.connect(port[,\
    \ host], callback])\n```\n\nIf a function is supplied, it's equivalent to listening\
    \ on the connect event of the resulting object.\n\n```\nvar client = net.connect(3000,\
    \ 'localhost');\nclient.on('connect', function () { });\n```\n\nis therefore equivalent\
    \ to\n\n```\nnet.connect(300, 'localhost', function () { });\n```\n\nIn addition,\
    \ similar to the API you saw previously, you can listen on data and close events.\n\
    \n# IMPLEMENTING PART OF THE IRC PROTOCOL\n\nYou first initialize the client.\
    \ Then attempt to log on to the #node.js channel on irc.freenode.net.\n\n```\n\
    var client = net.connect(6667, 'irc.freenode.net');\n```\n\nYou set the encoding\
    \ to utf-8:\n\n```\nclient.setEncoding('utf-8')\n```\n\nWhen you're connected,\
    \ you send your desired nickname. In addition, you write the USER command, which\
    \ is required by servers. You send data like this:\n\n```\nNICK mynick\nUSER mynick\
    \ 0 * :realname\nJOIN #node.js\n```"
