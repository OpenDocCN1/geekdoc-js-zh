  md: '# WHAT ARE THE CHARACTERISTICS OF TCP?


    In order to use TCP, you don''t need to understand how it works internally, or
    what decisions were made about how the protocol works.


    But understanding that can be a big help when analyzing problems with higher-level
    protocols and servers, such as web servers or databases.


    The first thing to understand about TCP is that it''s connection-oriented.


    # CONNECTION-ORIENTED COMMUNICATION AND SAME-ORDER DELIVERY


    When you work with TCP, you can think of the communication between a client and
    server as a connection or data stream. This is a useful abstraction for the development
    of services and applications because the Internet Protocol (IP) on which TCP sits
    is connectionless.


    IP is based on the transmission of datagrams. These datagrams are packets of data
    that are sent and received independently whose order of arrival is arbitrary.


    How does TCP ensure these independent datagrams are part of an ordered stream?


    If using IP means having potentially irregular arrival times of data packets,
    and these packets do not belong to any data stream or connection, how is it possible
    if you open two TCP/IP connections to a server, the packets you send don''t get
    mixed up?


    The answer to these two questions is what explains the existence of TCP. When
    we send data in the context of a TCP connection, the IP datagrams that are sent
    out contain information that identifies the connection they belong to and the
    order in the data stream.


    Imagine splitting up a message into four parts. If a server gets parts 1 and 4,
    and both belong to connection A, it knows to wait for parts 2 and 3 to arrive
    in other datagrams.


    When you write a server that implements TCP, you''re really going to do with Node,
    you simply don''t worry about this underlying complexity. You always think of
    connections, and when you write to a socket, you know the other end will receive
    it in that order, or if a network error occurs, the connection will be considered
    erroneous and aborted.


    # BYTE ORIENTATION


    TCP doesn''t know about characters, or character encodings, and rightfully so.
    As you saw in Chapter 4, different text encoding can result in a different number
    of bytes being transmitted.


    TCP therefore allows you to transmit data that could be a succession of ASCII
    characters (1 byte each) or Unicode that could take up to 4 bytes each.'
  merge: -1
