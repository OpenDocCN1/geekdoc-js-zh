  md: "Sometimes, a test can pass only when more than one asynchronous run in parallel\
    \ completes.\n\nFor this approach, you can use the typical trick of keeping a\
    \ counter:\n\n```\nit('should complete three requests', function (done) {\n  var\
    \ total = 0;\n  request.get('http://localhost:3000/1', function (res) {\n    if\
    \ (200 != res.status) throw new Error('Request error');--total || done();\n  });\n\
    \  request.get('http://localhost:3000/2', function (res) {\n    if (200 != res.status)\
    \ throw new Error('Request error');--total || done();\n  });\n  request.get('http://localhost:3000/3',\
    \ function (res) {\n    if (200 != res.status) throw new Error('Request error');\n\
    \    --total || done();\n  });\n});\n```\n\nNote that Mocha is smart enough to\
    \ recognize that a certain uncaught exception belongs to a specific test. Because\
    \ Mocha executes only one test at a time at any, it knows to link any uncaught\
    \ exceptions that are captured through process.on('uncaughtException') handler\
    \ to the appropriate test.\n\n# BDD STYLE\n\nThe style described in the preceding\
    \ section is called behavior-driven development (BDD).\n\nIn the following example,\
    \ you test the behavior of Jade when used as a template that contains a paragraph.\
    \ You use it in combination with expect.js\n\nFirst, you install Jade, Mocha,\
    \ and expect.js:\n\n```\n$ npm install expect.js jade mocha\n```\n\n```\nbdd.js\n\
    var expect = require('expect.js')\njade = require('jade');\ndescribe('jade.render',\
    \ function () {\n  it('should render a paragraph', function () {\n    expect(jade.render('<p\
    \ A paragraph>')).to.be('<p>A paragraph</p>');\n  });\n});\n```\n\nBecause you\
    \ installed Mocha locally, you can execute it by finding it in ./node_modules/bin:\n\
    \n```\n./node_modules/.bin/mocha bdd.js\n```"
