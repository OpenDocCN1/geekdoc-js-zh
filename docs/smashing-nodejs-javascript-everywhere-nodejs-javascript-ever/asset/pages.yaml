    Socket.IO always tries to find a method for connection that is faster for the
    user and performs best for your server, but it always ensures a connection despite
    adverse conditions.


    # EVENTS AND BROADCASTING


    Now that you have successfully connected, it''s time to identify the fundamental
    pieces of the Socket.IO server.


    # Broadcasting upon join


    Whenever a user connects, you want to notify everyone else that she did. Because,this
    is to be a special message not sent by anyone in particular, you can call this
    an announcement and style it accordingly.


    The first thing to do from the client perspective is to ask what the user''s name
    is.


    Because you want to disallow any interaction with the chat until the user is actually
    connected, you need to hide the chat:


