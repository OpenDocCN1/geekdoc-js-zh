  md: "# SETTINGS\n\nOne of the interesting features Express provides that proves\
    \ necessary for any type of web application is the ability to manage environments\
    \ and settings.\n\nFor example, during production you can make a performance enhancement\
    \ and let express cache the templates so they serve faster. However, if you enable\
    \ this feature during development, you would need to restart Node every time you\
    \ make a change to a template to test the result.\n\nExpress lets you set this\
    \ environment by calling configure:\n\n```\napp.configure('production', function\
    \ () {\n  app.enable('view cache');\n});\n```\n\nIn this case, app.enable is the\
    \ equivalent to calling app.set like you saw in the simple Express example above\
    \ for the views config flag.\n\n```\napp.set('view cache', true);\n```\n\nTo know\
    \ whether a configuration flag is enabled you can also call app.enabled. app.disable\
    \ and app.disabled are also available.\n\nWhen the environment variable NODE_ENV\
    \ is set to production, the callback we defined with app.configure gets executed.\n\
    \nTo test it, run\n\n```\n$ NODE_ENV=production node server\n```\n\nIf node NODE_ENV\
    \ is defined, the environment defaults to development:\n\n```\napp.configure('development',\
    \ function () {\n  // gets called in the absence of NODE_ENV too!\n});\n```\n\n\
    Some other useful built-in settings are\n\n+   * case sensitive routes: Enable\
    \ case-sensitive routing. By default, when you define a route as follows:\n\n\
    ```\napp.get('/my/route', function (req, res) {\n```\n\nExpress will match that\
    \ route for /my/route and /MY/ROUTE. By enabling this, routes will match if the\
    \ cases match."
  merge: -1
  pgno: 166
- img_proc: true
  md: '+   strict routing: When enabled trailing trails are no longer ignored. For
    example, the previous example route matches the URLs /my/route and /my/route/.
    If strict routing is enabled, however, only /my/route would match, since that''s
    how it was defined with app.get.


    +   jsonp callback: Enable via res.send() / res.json() transparent jsonp support.
    JSONP is a technique for serving cross-domain JSON that consists in wrapping the
    response with the callback provided by the user.


    +   When JSONP is requested, the URL would look like this: /my/route?callback=myCallback.
    Express can automatically detect the callback parameter and wrap the response
    with the myCallback text. To enable this behavior, call app.enable(''jsonp callback'').
    Please note that this only applies when you call res.send or res.json in a route,
    which are discussed later in the chapter.


    # TEMPLATE ENGINES


    To use ejs in the preceding example, you must take two steps:


    +   1. You use the ejs module through NPM.

    2. You declare the view engine as ejs.


    In the same way other templates are commonly used with Express:


    +   - Haml

    - Jade

    - CoffeeKup

    - jQuery Templates for node


    Express tries to call require with the extension of the template or the configured
    view engine.


    For example, you can call


    ```

    res.render(''index.html'')

    ```


    In this case, Express tries to require the html engine. Because it can''t find
    one, the call results in an error.


    You can map extensions to known template engines by using the app.register API.
    For example, to map html extensions to the jade template engine, run


    ```

    app.register(''.html'', require(''jade''));

    ```


    Jade is one of the most popular template languages, and definitely worth learning.
    To find out more about it, refer to its website http://jade-lang.org.'
