  md: 'Notice that you also didn''t need to encode the query string manually, since
    superagent knows that if you try to send data with a GET request, that means encoding
    it as part of the URI, away query string.


    To set a header for the request, you can do so by calling set. In the following
    example I set the Date header with the request:


    ```

    var request = require(''superagent'');

    request.get(''http://twitter.com/search.json'')

    .send({ q: ''justin bieber'' })

    .set(''Date'', new Date)

    .end(function (res) { console.log(res.body); });

    ```


    Both send and set can be called multiple times, which makes it a progressive API:
    you can build out the object progressively, and then can end when you''re done.


    The simplicity of the API does not stop at GET requests. Similarly, superagent
    exposes post, head, and del methods.


    The following example POSTs a JSON-encoded object:


    ```

    var request = require(''superagent'');

    request.post(''http://example.com/'')

    .send({ json: ''encoded'' })

    .end();

    ```


    JSON is the default encoding. If you want to change it, simply adjust the Content-Type
    of the request by calling set.


    # RELOADING HTTP SERVERS WITH UP


    By now, you probably already noticed that it can get somewhat annoying to continuously
    reload a Node process manually in order for a web browser to reflect the changes
    you make to your servers code with your text editor.


    The most naive way to tackle this problem is to reload the process every time
    a code change is detected. This can work well for development, but when you deploy
    your web servers to production, you probably want to make sure requests that are
    in-flight (in other words, requests that are in progress at the time you want
    to reload your code) are not killed along the old process.


    I developed a tool called up to tackle this problem in a very safe and reliable
    way. For development, simply install the up executable with NPM:


    ```

    $ npm install -g up

    ```'
