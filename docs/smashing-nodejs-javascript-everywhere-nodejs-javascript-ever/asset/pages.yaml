  md: '# SUMMARY


    In this chapter you learned the benefits of leveraging middleware as building
    blocks for code organization and reusability around requests and responses in
    HTTP servers. In this case, Connect is the module that supplies the infrastructure
    to do this in a very expressive way.


    You compared having a single request handler in contrast with separating logic
    into smaller units connected by the next middleware function parameter.


    You also looked at the middleware that Connect bundles that solves a variety of
    common needs for the development of websites and web applications. You now understand
    how to write your own middleware, and how to make them reusable through the Node.JS
    module system.'
