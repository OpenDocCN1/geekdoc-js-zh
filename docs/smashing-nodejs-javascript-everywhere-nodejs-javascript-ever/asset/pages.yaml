    module.exports = function (str) {

    return console.log(str);

    }


    mymodule = require(''main'');

    }();

    ```


    The first section of the script is the implementation of the require function
    that the rest of the script uses. It''s compiled into one line of code that the
    compilation process on the length of the file is minimized.


    The other interesting piece is the require.register function. This is so that
    you don''t have to rely on detecting whether a window is available to expose a
    global. You can write your scripts relying on Node.js''s global object, and in
    the browser it will print to the window.


    Finally, the last section of the code exposes the global (in this case myymodule)
    and explains why we need to tell browserbuild which module is the main one:


    ```

    mymodule = require(''main'');

    ```'
