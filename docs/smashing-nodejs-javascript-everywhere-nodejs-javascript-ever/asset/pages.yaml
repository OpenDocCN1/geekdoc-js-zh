    # A DJ-BY-TURNS


    How could it be if you empowered the users of your chat application to be DJs?


    +   - The server starts by selecting a DJ.

    - The DJ is given the ability to query an API, get search results, and select
    a song. He can then broadcast the song to others.

    - When the DJ leaves, he leaves the spot open for the next user to be elected.


    # EXTENDING THE CHAT


    The foundations of the chat application are solid enough to add this functionality
    to it.


    The first thing to do select a DJ if none is selected. Since you also want to
    keep track of the current song, you''ll define two state variables: `currentSong`
    and `dj`.


    Since the DJ can change, you''ll define an `elect` function that performs the
    DJ selection task and announcements. When the `join` event is emitted, a DJ can
    be elected or the current song (`currentSong`) is relayed to the user. Later,
    when you implement search, `currentSong` is going to be populated with an object.'
