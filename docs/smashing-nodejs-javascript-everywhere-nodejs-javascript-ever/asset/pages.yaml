  md: "Next up, you'll learn about callbacks for events, and how they can help you\
    \ add a new feature.\n\n# ENSURING RECEPTION\n\nIn the chat, example you callMessage\
    \ immediately upon the user pressing Enter, creating the illusion that everyone\
    \ else is seeing the message at that exact instant.\n\nAnd just like WebSocket,\
    \ Socket.IO does not enforce responses for each message you send. Sometimes, the\
    \ need for confirmation that a message was received arises. Socket.IO calls this\
    \ type of confirmation an acknowledgment.\n\nTo implement acknowledgments, all\
    \ you have to pass a function whenever you are emitting an event.\n\nFirst, you're\
    \ going to return a reference to the element you create in the addMessage function\
    \ so that you can add a CSS class to it after the message is confirmed as received.\
    \ Then you can display a nice icon next to it.\n\n# /chat.js\n\n```\nfunction\
    \ addMessage(from, text) {\n  // /\n  return li;\n}\n```\n\nNext, you add the\
    \ callback. Socket.IO can also receive data along with these acknowledgments.\
    \ For this example, you can send a timestamp indicating when the message was received:\n\
    \n# /chat.js\n\n```\ndocument.getElementById('form').onsubmit = function () {\n\
    \  var li = addMessage('me', input.value);\n  socket.emit('text', input.value,\
    \ function (date) {\n    li.className = 'confirmed';\n    li.title = date;\n \
    \ });\n```\n\nOn the server side, Socket.IO appends a callback as the last parameter\
    \ of the event:\n\n# /server.js/\n\n```\nsocket.on('text', function (msg, fn)\
    \ {\n  // /\n  // confirm the reception\n  fn(Date.now());\n});\n```"
  merge: -1
  pgno: 201
