    # CREATING DOCUMENTS\n\nThe API for insertion is simple. You simply call Collection#insert\
    \ by supplying the\ndocument and a callback. As with most callbacks in Node, the\
    \ first parameter is an error, and\nin this case, the second one is an array of\
    \ the inserted documents:\n\n```\ncollection.insert({ my: 'document' }, function\
    \ (err, docs) {\n  //...\n});\n```\n\nAn additional options object is an optional\
    \ second parameter, which you look at later.\n\nIf you look at the signup form\
    \ again, you can see that the input names follow this format:\nuser[field]. For\
    \ example:\n\n```\ninput(name=\"user[name]\", type=\"text\")\n```\n\nWhen bodyParser\
    \ encounters that format, as you can see, it exposes the field as req.\nbody.user.name.\n\
    \nThis functionality is particularly handy for you because you can insert the\
    \ document directly\ninto MongoDB. skip data validation (which is very important).\n\
    \nThe signup processing route is thus very simple:\n\n```\n\"/\n* Signup processing\
    \ route\n//\napp.post('/signup', function (req, res, next) {\n  app.users.insert(req.body.user,\
    \ function (err, doc) {\n    if (err) return next(err);\n    res.redirect('/login/'\
    \ + doc[0].email);\n  }\n});\n```"
