  md: '# CHAPTER

    12 MONGODB


    MONGODB IS A document-oriented, schema-less database that has been shown to fit
    in really well with Node.JS applications and cloud deployments.


    One of its most interesting features is that unlike MySQL or PostgreSQL, which
    store data in tables that are generally fixed in their design (schema), MongoDB
    can store documents of any kind in collections (schema-less).'
  merge: -1
  pgno: 216
- img_proc: true
  md: "For example, say you create a table that holds the user profiles of a web application:\n\
    \n| First | Last | Email | Twitter |\n|---|---|---|---|n| Guillermo | Rauch |\
    \ rauch@gmail.com | rauch |\n\nWhen you build your application, you decide how\
    \ your users' information will be structured around this particular design design.\
    \ You expect to have one or more of the following: first name, last name, email,\
    \ and Twitter ID.\n\nAs applications evolve, business needs change, as time passes\
    \ and new needs arise, you might need to add or remove some of those columns.\n\
    \nThe fundamental problem, however, with the way most traditional (SQL) databases\
    \ are optimized to work is it's very expensive to make changes to the table design,\
    \ both operationally and in terms of performance.\n\nEvery time you need to make\
    \ a change to that design, in MySQL, for example, you need to run a command to\
    \ add a column:\n\n```\n$ mysql\n> ALTER TABLE profiles ADD COLUMN . . .\n```\n\
    \nAnd the same occurs if you remove one or more columns.\n\nWith MongoDB, you\
    \ can think of your data as documents that are flexible in their design. And,\
    \ as it happens, these documents are stored in a format that resembles JSON very\
    \ closely (or completely, for most purposes):\n\n```\n{\n  \"name\": \"Guillermo\"\
    ,\n  \"last\": \"Rauch\",\n  \"email\": \"rauch@gmail.com\",\n  \"age\": 21,\n\
    \  \"twitter\": \"rauch\"\n}\n```\n\nAnother important characteristic of MongoDB\
    \ that sets it apart from NoSQL databases that are key-value is that documents\
    \ can have arbitrary depth.\n\nFor example, instead of adding all the possible\
    \ social networks as keys of your document, you can store them as a data structure\
    \ within:\n\n```\n{\n  \"name\": \"Guillermo\",\n  \"last\": \"Rauch\"\n}\n```"
  merge: -1
  pgno: 217
