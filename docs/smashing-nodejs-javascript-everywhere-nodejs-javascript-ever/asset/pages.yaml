  md: "# 42 PART I\n\nThis particular module alters String.prototype, so it doesn't\
    \ export an API. The fs module, however, exports a number of functions that you\
    \ can leverage:\n\n```\nvar fs = require('fs');\nfs.readFile('/some/file', function\
    \ (err, contents) {\n  if (err) console.log(contents);\n});\n```\n\nModules can\
    \ also leverage the module system internally, to produce code with a clean separation\
    \ of APIs and relations. But instead of declaring each part of a certain module\
    \ or as a separate module with its own package.json file, you can leverage what\
    \ I'll call relative modules.\n\nRelative modules point require to a JavaScript\
