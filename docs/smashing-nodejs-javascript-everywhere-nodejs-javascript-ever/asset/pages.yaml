  md: "# Request\n\n```\nGET /ws HTTP/1.1\nHost: example.com\nUpgrade: websocket\n\
    Connection: Upgrade\nSec-WebSocket-Version: 6\nSec-WebSocket-Origin: http://pmx\n\
    Sec-WebSocket-Extensions: deflate-stream\nSec-WebSocket-Key: x3JJHbDL1ElZk9CBhXDW=\n\
    ```\n\n# Response\n\n```\nHTTP/1.1 101 Switching Protocols\nUpgrade: websocket\n\
    Connection: Upgrade\nSec-WebSocket-Accept: HMarc0nM1YUKaGmm50PPG2HaGwk=\n```\n\
    \nWebSockets are still based on HTTP, which means it's easy to implement the protocol\
    \ on top of existing servers. The main difference is that as soon as the handshake\
    \ is complete, a minimalistic TCP-like socket is available to you.\n\nTo understand\
