- img_proc: true
  md: "Finally, you set a hasMany association:\n\n```\nserver.js\n/**\n * Set up association.\n\
    \ */\n\nTask.belongsTo(Project);\nProject.hasMany(Task);\n```\n\nSequelize takes\
    \ care of setting up the appropriate columns, primary keys, and indices to make\
    \ the relationships.\n\nThe implication of a belongsTo association is that each\
    \ Task has a field pointing to the project it belongs to. The other implication\
    \ is that the instances of the task model have a method called getProject to easily\
    \ access the parent project.\n\nAs for hasMany, the result will be that when you\
    \ access Project instances later on by calling find, they will have a method getTasks\
    \ to easily access the project's tasks.\n\nThe other relationship type supported\
    \ by sequelize which you won't use for this example hasOne: the symmetrical opposite\
    \ of belongsTo.\n\nFinally, you need to make sure the schema is synchronized to\
    \ the database without having to manually run CREATE TABLE commands:\n\n```\n\
    /**\n * Synchronize.\n */\n\nsequelize.sync();\n```\n\nDuring development, you\
    \ are bound to change the tables a lot. You can tell sequelize to always drop\
    \ the table and create it again to ensure that changes are always reflected by\
    \ supplying the option { force: true }.\n\n```\nserver.js\nsequelize.sync();\n\
    ```\n\n# CREATING DATA\n\nFor both the projects and tasks lists, you want to attach\
    \ a jQuery listener when the form is submitted.\n\nWhen you send the AJAX call,\
    \ you expect a JSON response with the model instance data."
