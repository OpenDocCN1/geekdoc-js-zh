    If you were to re-imagine the cursor example from Chapter 10 with Socket.IO, the
    application code would be greatly simplified:


    # Client code


    ```

    var socket = io.connect();


    socket.on(''position'', move);

    nsnsocket.on(''remove'', remove);

    ```


    Notice instead of having to parse the incoming strings of a single event (message),
    we can channel data according to its meaning within the applications. Events can
    receive any number of parameters in any of the types JSON encodes: Number, Array,
    String, Object, and so on.


    # NAMESPACES


    Another powerful feature that Socket.IO offers the ability to separate a single
    connection into namespaces that are isolated from each other.


    Sometimes your application requires separation of logic into distinct parts, but
    for performance or speed reasons it is still desirable to leverage the same connection.
    Considering you can''t make assumptions about how fast the clients are or how
    capable their browsers are, is it a good idea to listen on too many connections
    simultaneously?


    Therefore, Socket.IO allows you to listen on the connection event of multiple
    namespaces:


    ```

    io.sockets.on(''connection'');

    io.of(''/some/namespace'').on(''connection'');

    io.of(''/some/other/namespace'').on(''connection'');

    ```


    Even though you''ll get different connection objects, when you connect from the
    browser like in this example, a single transport (like a WebSocket connection)
    will be used:


    ```

    var socket = io.connect();

    var socket2 = io.connect(''/some/namespace'');

    var socket3 = io.connect(''/some/other/namespace'');

    ```


    In some cases, modules or parts of your application are written in such a way
    that for the sake of abstraction are completely isolated from the rest. Some part
    of your client side JavaScript codebase might be completely unaware of that''s
    executing in parallel.'
