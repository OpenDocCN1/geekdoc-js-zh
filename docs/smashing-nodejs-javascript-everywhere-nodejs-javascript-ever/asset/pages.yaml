  md: "# CHAPTER 3\n\nperform. In the same fashion internally Node loops and triggers\
    \ a notification when the timeout is complete, it uses the event loop to trigger\
    \ notifications about file descriptors.\n\nFile descriptors abstract handles that\
    \ reference open files, sockets, pipes, and so on. Essentially, when Node gets\
    \ an HTTP request from a browser, the underlying TCP connection allocates a file\
    \ descriptor. If the client sends data to the server, Node gets a notification\
    \ about this and fires a callback in your JavaScript code.\n\n# A SINGLE-THREADED\
    \ WORLD\n\nIt's important to note that Node uses a single thread of execution.\
    \ It's not possible, without the help of third-party modules, to change this fact.\n\
    \nTo illustrate what this means and how it relates to the event loop, consider\
    \ the following example:\n\n```\nvar start - Date.now();\nsetTimeout(function\
    \ () {\n  console.log(Date.now() - start);\n});\nfor (var i = 0; i < 1000000000;\
    \ i++) {\n  // 0000;\n}\nsetTimeout(function () {\n  console.log(Date.now() -\
    \ start);\n}, 2000);\n```\n\nThese two timeouts print how many seconds elapsed\
    \ from the moment they're set to the moment the functions are called. The output\
    \ in my computer looks like Figure 3-1.\n\n![](img/c641d3b47d2abe2a65f037111c97ed26_44_0.png)\n\
    \nFigure 3-1: This program shows the elapsed time when each setTimeout is executed,\
    \ which doesn't correlate to the values in the code.\n\nWhat happens internally\
    \ is that the event loop is blocked by the JavaScript code. When the first event\
    \ is dispatched, the JavaScript callback is run. Because you are doing a lot of\
    \ intense computation (a very long for loop), by the time the next iteration of\
    \ the event loop is executed, more than two seconds have elapsed; therefore, the\
    \ JavaScript timeouts don't match actual clock seconds."
