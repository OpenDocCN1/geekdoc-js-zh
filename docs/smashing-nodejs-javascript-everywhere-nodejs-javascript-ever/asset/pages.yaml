  md: '# PART III


    In Figure 8-14, you''ve returned to the main page after a successful login.


    ![](img/c641d3b47d2abe2a65f037111c97ed26_153_0.png)


    Figure 8-14: The result of going back to the main page once logged in


    In order to have sessions work in a production-ready manner, you should learn
    how to persist them with Redis.


    # REDIS SESSIONS


    Try the following: while logged in, restart your node server and then refresh
    your browser. Notice that the session is now gone!


    The reason is that the default store for the session middleware is Memory. This
    means that the session data is stored in memory, and when the process dies, the
    sessions die with it.


    This result is not a bad thing while you''re developing applications, but it can
    certainly be detrimental for production applications. In those scenarios, you
    should swap the store with one that persist reloading your node application, as
    Redis (more on Redis in Chapter 12).


    Redis is a small, fast database that a module connect-redis leverages to store
    session data that it lives outside the Node process.


    You can set it up like this (you must have Redis installed):


    ```

    var connect = require(''connect'')

    , RedisStore = require(''connect-redis'')(connect);

    ```


    Then you include it by passing the store option to the session middleware:


    ```

    server.use(connect.session({ store: new RedisStore, secret: ''my secret'' }))

    ```


    Now you''re done! Sessions outlive your Node processes.'
