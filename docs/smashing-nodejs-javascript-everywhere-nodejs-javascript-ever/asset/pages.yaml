    apps. Smashing Node.js shows what Node.js is and how to put it to work on your
    next project. Packed with real-world examples that demonstrate why Node.js is
    quickly becoming the tool of choice among web developers everywhere, it gets you
    up and running with the knowledge and skills you need to:


    +   - MAKE SENSE OF NODE’S EVENT-LOOP ARCHITECTURE, NON-BLOCKING I/O, AND EVENT-DRIVEN
    PROGRAMMING


    +   - MASTER THE INS AND OUTS OF NODE’S APIs


    +   - EFFORTLESSLY IMPLEMENT REAL-TIME TECHNOLOGIES, SUCH AS SOCKET.IO AND HTML5
    WEBSOCKET


    +   - PROGRAM APPS THAT SCALE UP TO SUPPORT VAST NUMBERS OF SIMULTANEOUS CONNECTIONS
    ACROSS MULTIPLE SERVERS


    +   - LEAGE NODE’S ABILITY TO SUPPORT AN ARRAY OF DATABASE AND DATA STORE


    +   - WRITE CODE THAT CAN HANDLE TENS OF THOUSANDS OF CONNECTIONS AT A TIME MACHINE


    +   - INTERACT IN REAL-TIME WITH OTHER DEVELOPERS ON A COMPANION WEB SITE WITH
    ADDITIONAL CHAPTERS AND MORE ANNOTATED EXAMPLES—SOURCE CODE INCL


    Beautifully illustrated with tons of full-color illustrations and packed with
    useful source code, Smashing Node.js is your total guide to the revolutionary
    web development tool.


    Guillermo Rauch is CTO and co-founder of San Francisco-based education startup
    LearnBoost. He is the inventor of several renowned Node.js projects, and he has
    been a speaker at JSConf as well as Node.js workshops.


