    In this route, you also call render, but you pass an object as second parameters.\
    \ The contents\nof that object get exposed. Notice how you pass tweets and search,\
    \ both of\nwhich get referred directly in search.js. You can call this object\
    \ locals object\nbecause its keys become local to the template.\n\n# # SEARCH\n\
    \nThe search module exposes a simple function to query the Twitter Search API.\
    \ The file this\nmodule will reside in, search.js, goes in the same directory\
    \ as server.js for this\nexample.\n\nIn the function call above, you pass the\
    \ search term, and the function callback\npassed back an error (if any), and an\
