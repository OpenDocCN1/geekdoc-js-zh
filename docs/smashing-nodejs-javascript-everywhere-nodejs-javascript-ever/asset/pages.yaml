  md: "# ERROR HANDLING\n\nIt's natural in the Node environment to pass around error\
    \ objects as the result of non-blocking I/O callbacks. In our example in this\
    \ chapter, we expected the possibility of an Error object when we performed the\
    \ Twitter API search.\n\nWhat you normally to do with them in the context of Express\
    \ routes is pass this error objects to next. By default, Express will show an\
    \ error page and send the status code 500.\n\nMost web applications however want\
    \ to customize error pages, or even set up custom backend reporting.\n\nYou can\
    \ define special handlers with app.error that act as middleware for errors:\n\n\
    ```\napp.error(function (err, req, res, next) {\n  if ('bad twitter response'\
    \ == err.message) {\n    res.render('twitter-error');\n  } else {\n    next();\n\
    \  }\n});\n```\n\nNotice that in that example I'm inspecting the error message\
    \ to decide whether the middleware will handle the error or not, and call next\
    \ otherwise.\n\nYou can set up multiple .error handlers that have different actions.\
    \ For example, the last error handler can send a 500 Internal Server Error and\
    \ render a generic error page:\n\n```\napp.error(function (err, req, res) {\n\
    \  res.render('error', { status: 500 });\n});\n```\n\nIf you call next and another\
    \ handler is not available, the default Express error handler will kick in.\n\n\
    # CONVENIENCE METHODS\n\nExpress provides a series of extensions to Node's Request\
    \ and Response objects that greatly simplify different tasks.\n\nThe extensions\
    \ to the Request object are\n\n+   - header: This extension allows for easily\
    \ retrieving a header as a function in a way that is not case sensitive:\n\n```\n\
    req.header('Host')\nreq.header('host')\n```"
  merge: -1
  pgno: 168
- img_proc: true
  md: "# 156 PART III\n\n+   * accepts: This extension analyzes the Accept header\
    \ of the request according to the supplied value and returns true or false:\n\n\
    ```\nreq.accepts('html')\nreq.accepts('text/html')\n```\n\n+   * is: This extension\
    \ is similar to accepts, but it checks the Content-Type header:\n\n```\nreq.is('json')\n\
    req.is('text/html')\n```\n\nThe extensions to the Response object\n\n+   * header:\
    \ This extension takes one argument to check whether header has been set for the\
    \ response:\n\n```\nres.header('content-type')\n```\n\nOr arguments to set a header:\n\
    \n```\nres.header('content-type', 'application/json')\n```\n\n+   * render: You\
    \ have learned most of the usage of render already. In the previous example, you\
    \ might have noticed you passed the status local. This is a special type of local\
    \ that, when set, sets the status code of the response.\n\n+   * In addition,\
    \ you can supply a third parameter to render to obtain the HTML without sending\
    \ it automatically as the response.\n\n```\nres.render('template', function (err,\
    \ html) {\n  // do something with html\n});\n```\n\n+   * send: This magic method\
    \ acts based on the type of the supplied argument.\n\n+   * Number: Sends a status\
    \ code:\n\n```\nres.send(500)\n```\n\n+   * String: Sends HTML:\n\n```\nres.send('<p>html</p>');\n\
    ```\n\n+   * Object/Array: Serializes it into JSON, sending the appropriate Content-Type\
    \ header:\n\n```\nres.send({ hello: 'world' }); res.send([1,2,3]);\n```\n\n+ \
    \  * json: This extension is similar to send for most situations. It explicitly\
    \ sends a value as JSON.\n\n```\nres.json(5)\n```\n\nYou want to use this method\
    \ when the type of the value is unknown. res.send relies on type checking for\
    \ an object to decide whether to call JSON.stringify. If a number is supplied,\
    \ it assumes you want to send a status code and finish the response. res.json,\
    \ however, would pass the number through JSON.stringify.\n\nSince most of the\
    \ time you'll want to encode objects, res.send is still the most common choice."
  merge: -1
  pgno: 169
- img_proc: true
  md: "+   - redirect: Redirect offers a helper for sending the 302 (Moved Temporarily)\
    \ status code and the following:\n\n```\nres.redirect('/some/other/url')\n```\n\
    \nis effectively equivalent to:\n\n```\nres.header('Location', '/some/other/url');\n\
    ```\n\nwhich in turn is equivalent to the following native Node.JS:\n\n```\nres.send(302);\n\
    res.writeHead(302, { 'Location': '/some/other/url' });\n```\n\n+   - redirect\
    \ also takes a custom status code as the second parameter. For example, if you\
    \ want to send Moved Permanently instead you would set it to 301:\n\n```\nres.redirect('/some/other/url',\
    \ 301)\n```\n\n+   - sendfile: This extension is similar in spirit to the Connect\
    \ static middleware, but is used for individual files:\n\n```\nres.sendfile('image.jpg')\n\
    ```\n\nBeyond our usage of routes in the simple example app, there's a lot more\
    \ to them that can be really useful for larger web applications.\n\n# ROUTES\n\
    \nRoutes can define custom parameters:\n\n```\napp.get('/post/:name', function\
    \ () {\n  // ...\n})\n```\n\nIn this case, the variable name is populated inside\
    \ the req.params object. For example, if you point your browser to '/post/hello-world',\
    \ the object req.params gets populated accordingly:\n\n```\napp.get('/post/:name',\
    \ function () {\n  req.params.name == 'hello-world'\n})\n```\n\nYou can make parameters\
    \ optional by appending a question mark (?) after them. In the previous route,\
    \ if you point your browser to /post, there won't be a match. The route is defined\
    \ by the requirement of a parameter:\n\n```\napp.get('/post/:name?', function\
    \ (req, res, next) {\n  // this will match for /post and /post/a-post-here\n})\n\
    ```\n\nRoutes that include parameters like these compile down to regular expressions\
    \ internally. This means for more advanced route matching you can also pass a\
    \ RegExp object directly."
  merge: -1
  pgno: 170
- img_proc: true
  md: "example, if you wanted to make route match only for alphanumeric characters\
    \ and ndashes, you could use the following:\n\n```\napp.get(/^/post\\/[a-z\\d-]+*/),\
    \ function (req, res, next) {\n  // req.params contains the matches set by the\
    \ RegExp capture groups\n}\n```\n\nIn the same spirit as middleware, you can use\
    \ next to control the flow of route matching.\nEven when a route is executed,\
    \ you can still force Express to continue matching the request against other different\
    \ routes.\n\nFor example, make a route that accepts only parameters that start\
    \ with an 'h':\n\n```\napp.get('/post/:name', function (req, res, next) {\n  if\
    \ ('h' != req.params.name[0]) return next();\n  // ..\n}\n```\n\nThis fine-grained\
    \ route control solves a variety of situations gracefully thanks to its flexibility.\n\
    \nFor example, many web applications allow routes such as /home and /about, but\
    \ they also want to have permalinks that point to dynamic content, such as vanity\
    \ URLs.\n\nAfter you define all your routes, you can define what captures usernames\
    \ and makes a database call. If the username is not found, you can next and send\
    \ a 404; otherwise, you will render his profile.\n\n```\napp.get('/home', function\
    \ (req, res) {\n  //..\n}\n```\n\n```\napp.get('/:username', function (req, res,\
    \ next) {\n  // if you get here, no prior application routes matches\n  getUser(req.params.username,\
    \ function (err, user) {\n    if (err) return next(err);\n\n```\n\n```\nif (exists)\
    \ {\n  res.render('profile');\n} else {\n  next();\n}\n```\n\nExpress takes the\
    \ concept of middleware you're already familiar with and expands on it. Read on\
    \ to learn more about it."
  merge: -1
