  md: '![](img/c641d3b47d2abe2a65f037111c97ed26_255_0.png)


    # # SEQUEL


    In the preceding example, you experienced some of the gotchas of working with
    SQL databases.


    The first one is that the process of setting up the tables is manual (therefore
    time consuming), and the table definitions are not part of the project itself.
    The application doesn''t know that an item has a title property that allows a
    maximum of 255 characters. If it did, you could, for example, perform automatic
    validation of user input with error messages.


    The solution to this problem is elegantly packaged for you by sequelize: you can
    define schemas and models can also leverage synchronization features to create
    tables for you based on these definitions. The `setup.js` part of the preceding
    example is therefore completely removed.


    Because the schemas are part of the application, you can also use them to leverage
    type conversion or casting. If you want to insert an item with specific data,
    you can pass a JavaScript `Date` object instead of having to manually compose
    the date format that MySQL expects.


    Last but not least is associations. In the preceding example, you manually retrieved
    the reviews for an item, but you could also retrieve them automatically.'
