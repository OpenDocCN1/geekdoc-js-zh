  md: "# 30 PART I\n\n```\n// PHP\nprint('Hello');\n\nsleep(5);\n\nprint('World');\n\
    ```\n\nAnd this Node example:\n\n```\n// node\nconsole.log('Hello');\n\nsetTimeout(function\
    \ () {\n  console.log('World');\n  ), 5000);\n```\n\nNode.JS uses a callback because\
    \ these examples epitomize distinction between blocking and non-blocking code.\
    \ In the first example, PHP sleep() blocks the thread of execution. While the\
    \ program is sleeping, it's not doing anything else.\n\nNode.JS, on the other\
    \ hand, leverages the event loop here, so setTimeout is non-blocking.\n\nThis\
    \ means that if you introduce a console.log statement immediately after the setTimeout,\
    \ it is called immediately:\n\n```\nconsole.log('Hello');\n\nsetTimeout(function\
    \ () {\n  console.log('World');\n  ), 5000);\n```\n\n```\nconsole.log('Bye');\n\
    \n// this script will output:\n// Hello\n// Bye\n// World\n```\n\nWhat does it\
    \ mean to leverage the event loop? Essentially, Node registers events and runs\
    \ an infinite loop to poll the kernel to know whether these events are ready to\
    \ be dispatched. When they are, the associated function callbacks are fired, and\
    \ it moves on. If no events are polled, Node keeps running until all new events\
    \ are ready.\n\nIn contrast, in the PHP world, when sleep is executed, the execution\
    \ is blocked for however you specified, and no other instructions are executed\
    \ until time elapsed, which means it's synchronous. setTimeout, instead of blocking,\
    \ registers an event for the future and lets the program to continue, therefore\
    \ being asynchronous.\n\nThe event loop constitutes Node's approach to concurrency.\
    \ Previously for timeouts it is utilized for all the IO native modules such as\
    \ http or net"
