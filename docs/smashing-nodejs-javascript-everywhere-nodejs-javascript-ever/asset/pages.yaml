  md: '# LISTS


    A Redis list is the equivalent of a JavaScript array of strings.


    The two fundamental operations you can perform in Redis are RPUSH (push to the
    right, and tail of the list) and LPUSH (push to the left, or head of the list).


    You operate on lists similarly to the way you do with hashes:


    ```

    redis 127.0.0.1:6379 RPUSH profile.1.jobs *job 1*\n(integer) 1\nredis 127.0.0.1:6379
    RPUSH profile.1.jobs *job 2*\n(integer) 2

    ```


    You can then access a specified range of the array:


    ```

    redis 127.0.0.1:6379 LRANGE profile.1.jobs 0 -1\n1) "job 1*\n2) "job 2*

    ```


    LPUSH is also intuitively similar:


    ```

    redis 127.0.0.1:6379 LPUSH profile.1.jobs *job 0*\n(integer) 3\nredis 127.0.0.1:6379
    LRANGE profile.1.jobs 0 -1\n1) "job 0*\n2) "job 1*\n3) "job 2*

    ```


    RPUSH is the equivalent of pushing to an array in JavaScript:


    ```

    obj{''profile.1.jobs''}.push(''job 2'');

    ```


    LPUSH is the equivalent of shifting:


    ```

    obj{''profile.1.jobs''}.unshift(''job 2'');

    ```


    The LRANGE command returns a range of items in the list. It''s similar but not
    identical to an array slice in JavaScript. In particular, if the second argument
    is -1, it returns all the values of the list.


    # SETS


    Sets lie somewhere in between a list and a hash. They share the property of hashes
    that each item in a set (or key in a hash) is unique and unrepeatable. With keys
    in a hash, operating on members of a set happens in constant time (that is, no
    matter how big the set, removing, adding, or looking up members of a set takes
    the same amount of time).'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'Redis lists and unlike hashes, a set holds only single values (strings) without
    keys. But sets also have their own unique and interesting properties. Redis allows
    you to compute the intersection between sets, unions, the retrieval of random
    members, and so on.


    To add a member to a set, you use SADD:


    ```

    redis 127.0.0.1:6379 SADD myset "a member"

    (integer) 1

    ```


    To retrieve all members in a set, you use SMEMBERS:


    ```

    redis 127.0.0.1:6379 SMEMBERS myset

    1) "a member"

    ```


    Calling SADD again with the same value does nothing:


    ```

    redis 127.0.0.1:6379 SADD myset "a member"

    (integer) 0

    redis 127.0.0.1:6379 SMEMBERS myset

    1) "a member"

    ```


    To remove an item from a set, you use SREM:


    ```

    redis 127.0.0.1:6379 SREM myset "a member"

    (integer) 1

    ```


    # SORTED SETS


    Sorted sets share all the characteristics of Redis sets, but as the name implies,
    they are sorted. Their use cases in the Redis world are notably more rare and
    advanced.


    # REDIS AND NODE


    Because JavaScript already has these data structures readily available to you
    (easily achievable) and operating with them doesn''t require the existence of
    a protocol and server, how is Redis useful to you?


    One of the fundamental reasons is if you shut down the Node process, the data
    you are holding in memory goes away with it.


    In Chapter 9, you saw how to leverage Redis to store user session data. If you
    store it in each Node process, you have two fundamental disadvantages:


    +   The application could never be powered by more than one process As applications
    and a single process is not able to sustain all the load or traffic, you need
    to scale an application to multiple processes or computers.'
  merge: -1
  pgno: 277
- img_proc: true
  md: "+   You lose session data each time you reload your application: for example,\
    \ upon deploying new code.\n\nRedis also has other important advantages, such\
    \ as interoperability between programming languages, eventual persistence, and\
    \ other features that are not so easily attainable without writing a complete\
    \ data store solution.\n\n# # IMPLEMENTING A SOCIAL GRAPH WITH NODE-REDIS\n\n\
    For a sample application with Redis and Node, you can leverage the power of sets\
    \ and intersections to create a social graph of follows and followers, very much\
    \ like Twitter.\n\n# # Setting up the application\n\nThe Redis client of choice\
    \ comes from a project called node_redis (https://github.com/mranney/node_redis)\
    \ The NPM package is simply redis:\n\n```\npackage.json\n{\n  \"name\": \"sample-social-graph\"\
    ,\n  \"version\": \"0.0.1\",\n  \"dependencies\": {\n    \"redis\": \"0.7.1\"\n\
    \  }\n}\n```\n\n# # Connecting to redis\n\nnode-redis obeys a design that's similar\
    \ to the MySQL client you already looked at in Chapter 13.\n\nFirst, you require\
    \ the module and then initialize a client with createClient:\n\n```\n/**\n * Module\
    \ dependencies\n */\nvar redis = require('redis')\n\n/**\n * Create client.\n\
    \ */\nvar client = redis.createClient();\n```\n\nThe client exposes all the commands\
    \ as simple functions. For example, say you want to use SET:"
