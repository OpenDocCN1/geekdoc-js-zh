  md: "# 236 PART IV • JavaScript\n\n```\nsetup.js\n/**\n * Initialize client.\n */\n\
    delete config.database;\nvar db = mysql.createClient(config);\n```\n\nThe API\
    \ that node-mysql exposes executing queries is simple: client.query(sql, callback).\
    \ The API for closing the connection is client.end.\n\nBecause you are dealing\
    \ with essentially a single TCP connection, the server receives all the commands\
    \ you send out in the order you write them. This means that you don't need to\
    \ nest callbacks to ensure proper order of execution:\n\n```\n// this is unnecessary!\n\
    db.query('CREATE TABLE ..', function (err) {\ndb.query('CREATE TABLE ..', function\
    \ (err) {\ndb.query('CREATE TABLE ..', function (err) { });\n});\n});\n```\n\n\
    Because you should still make sure errors that occur are reported to the user,\
    \ you can listen on the db error event:\n\n```\ndb.on('error', function () {\n\
    \  handle error\n});\n```\n\nFor the terminal program, however, the desired behavior\
    \ when an error occurs is to display the error and its stack trace to the user\
    \ and abort execution. As you might recall from Chapter 4, when an error is emitted\
    \ on an EventEmitter, Node throws the error to ensure the programmer is aware\
    \ that there are no listeners (that is, the error unhandled), Node throws error\
    \ the program's potential point of failure instead of silently avoiding it. As\
    \ a result, you don't really need to attach an error handler for this particular\
    \ program, and Node takes care of notifying the user of the unhandled error.\n\
    \nFirst, you need to create the database and tell MySQL it's the one to keep using:\n\
    \n```\nsetup.js\n/**\n * Create database.\n */\ndb.query('CREATE DATABASE IF NOT\
    \ EXISTS `cart-example`');\ndb.query('USE `cart-example`');\n```"
