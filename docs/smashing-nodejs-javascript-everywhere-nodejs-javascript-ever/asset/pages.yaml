- img_proc: true
  md: "The key is that you do not need to handle more than one at the same instant,\
    \ provided that the call stack executes really fast. And that's why v8 coupled\
    \ with non-blocking IO are so good: v8 is really fast at executing JavaScript,\
    \ and non-blocking IO ensures the single thread of execution doesn't get hung\
    \ up on external uncertainties, like reading a database or hard disk.\n\nA real-example\
    \ of the utility of non-blocking IO is the cloud. In most cloud deployments like\
    \ the Amazon cloud (\"AWS”), operating systems are virtualized and hardware resources\
    \ are shared between tenants (since you are essentially \"renting hardware\").\
    \ What this means is if the hard drive, for example, is seeking a file for another\
    \ tenant, and you are trying to seek, the latency will increase. Since the IO\
    \ performance for the hard drive is very unpredictable, if we blocked our thread\
    \ of execution when we're reading a file, our program could behave erratically\
    \ and slowly.\n\nA common example of IO in our applications is getting data from\
    \ databases. Imagine a situation where you need to get some data from the database\
    \ to respond to a request.\n\n```\nhttp.createServer(function (req, res) {\n \
    \ database.getInformation(function (data) {\n    res.writeHead(200);\n    res.end(data);\n\
    \  });\n});\n```\n\nIn this case, once a request comes in, the call stack is just\
    \ composed of the database call. Since the call is non-blocking, it's up to the\
    \ event loop once again to initiate a new call stack when the database IO completes.\
    \ After after you tell Node \"let me know when you have the database response,\"\
    \ Node can continue to do other things. Namely, handling HTTP clients and requests!\n\
    \nA topic covered throughout the book that very much has to do with the way Node\
    \ is architected is error handling, described next.\n\n# ERROR HANDLING\n\nFirst\
    \ and foremost, as you saw earlier in the chapter, Node applications rely on big\
    \ processes with a lot of shared state.\n\nIf an error occurs in a particular\
    \ callback of a particular HTTP request, for example, the whole process is compromised:\n\
    \n```\nvar http = require('http');\n\nhttp.createServer(function () {\n  throw\
    \ new Error('This will be uncaught')\n}).listen(3000);\n```"
  merge: -1
