  md: "# EXPOSING APIS\n\nFor a module to expose an API that's expressed as the return\
    \ value of a require call, two globals, module and exports ,come into play.\n\n\
    By default, each module exports an empty object {}. If you want to add properties\
    \ to it, you can simply reference exports:\n\n```\nmodule_a.js\nexports.name =\
    \ 'john';\nexports.data = 'this is some data';\n\nvar privateVariable = 5;\n\n\
    exports.getPrivate = function () {\n  return privateVariable;\n}\n```\n\nNow test\
    \ it out (see Figure 4-3):\n\n```\nindex.js\nvar a = require('./module_a');\n\
    console.log(a.name);\nconsole.log(a.data);\nconsole.log(a.getPrivate());\n```\n\
    \n![](img/c641d3b47d2abe2a65f037111c97ed26_57_0.png)\n\nFigure 4-3: Showing the\
    \ values exposed by the API of module_a\n\nIn this case, exports happens to be\
    \ a reference to module.exports, which is an object by default. If setting individual\
    \ keys in this object is not enough, you can also override module completely.\
    \ This is a common use case for modules that export constructors (see Figure 4-4):"
