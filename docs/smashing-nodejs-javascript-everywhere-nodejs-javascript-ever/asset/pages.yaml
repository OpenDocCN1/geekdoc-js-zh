- img_proc: true
  md: "When a user first connects, you want to send everyone's positions to him as\
    \ the first message.\nThat way, when the first user loads the page, he can see\
    \ everyone who is connected.\n\nTo that end, you encode the positions object as\
    \ JSON:\n\n```\nws.on('connection', function (socket) {\n  // you give the socket\
    \ id\n  socket.id = ++total;\n\n  // you send the positions of everyone else\n\
    \  socket.send(JSON.stringify(positions));\n});\n```\n\nWhen a client sends a\
    \ message, you assume he's sending his position as JSON (as an object\\with x\
    \ and y coordinates). You then store it in the positions object:\n\n```\nsocket.on('message',\
    \ function (msg) {\n  try {\n    var pos = JSON.parse(msg);\n  } catch (e) {\n\
    \    return;\n  }\n\n  positions[socket.id] = pos;\n});\n```\n\nFinally, when\
    \ the user disconnects, you clear his position:\n\n```\nsocket.on('close', function\
    \ () {\n  delete positions[socket.id];\n});\n```\n\nWhat is missing here? Broadcasting\
    \ of course. When a position is received, you want to send\nit to everyone. And\
    \ when the socket connects, you want to notify everyone else that the user\ndisconnected\
    \ so his cursor is removed from the screen.\n\nYou declare a broadcast function\
    \ to go through the rest of the clients and send them\na message. Include it right\
    \ after you register the ws connection listener:\n\n```\nfunction broadcast (msg)\
    \ {\n  for (var i = 0, l = ws.clients.length; i < l; i++) {\n    // you avoid\
    \ sending a message to the same socket that broadcasts\n    if (ws.clients[i]\
    \ && socket.id != ws.clients[i].id) {\n      // you call 'send' on the other clients\n\
    \      ws.clients[i].send(msg);\n    }\n  }\n}\n```"
