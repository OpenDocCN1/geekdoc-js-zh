  md: 'It''s important to mention that in future versions of Node, machinery will
    be in place to make errors thrown by asynchronous handlers easier to track down.


    # SUMMARY


    You now understand how all the actors involved—the event loop, non-blocking IO,
    and v8—work efficiently together to give developers interfaces to write very fast
    networked applications.


    You understand that Node offers great simplicity to the programmer by having a
    single thread of execution, but also that this architecture makes it unwise to
    perform blocking IO when you''re trying to write network applications. You also
    understand that all the state is maintained in a single memory space for that
    thread, which means you need to be extra careful when writing programs.


    You also clearly see that non-blocking IO and callbacks introduce new paradigms
    for debugging and error handling that are strikingly different from programs you
    write with blocking IO.'
