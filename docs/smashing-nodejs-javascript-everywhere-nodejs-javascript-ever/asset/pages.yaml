  md: "Thankfully, operating on hashes from Node is simpler than it would be with\
    \ Redis commands.\nThe functions hgetall and hmset operate with native JavaScript\
    \ objects, there making this possible:\n\n```\nclient.hmset('somehash', { a: 'key',\
    \ another: 'key' });\n```\n\nThe equivalent of this command in the Redis command-line\
    \ interface (CLI) would be\n\n```\nHMSET somehash \"key\" \"value\" \"anotherkey\"\
    \ \"anothervalue\"\n```\n\nAnd when you are retrieving with hgetall, the second\
    \ parameter is a JavaScript object:\n\n```\nclient.hgetall('somehash', function\
    \ (err, obj) {\n  // obj.a = 'key'\n});\n```\n\nYou can then add a save method\
    \ to the model that executes hmset to enable the\ncreation and modification of\
    \ user records:\n\n```\nUser.prototype.save = function (fn) {\n  if (!this.id)\
    \ {\n    this.id = String(Math.random().substr(3));\n  }\n  client.hmset('user:'\
    \ + this.id + ':data', this.data, fn)\n});\n```\n\n# Defining graph methods\n\n\
    The basic two operations that you want to perform for a given user are to follow\
    \ and unfollow\nanother:\n\n```\nUser.prototype.follow = function (user_id, fn)\
    \ {\n  client.multi())\n  .sadd('user:' + user_id + ':followers', this.id)\n \
    \ .sadd('user:' + this.id + ':followers', user_id)\n  .exec(fn);\n}\n\nUser.prototype.unfollow\
    \ = function (user_id, fn) {\n  client.multi())\n  .srem('user:' + user_id + ':followers',\
    \ this.id)\n  .srem('user:' + this.id + ':followers', user_id)\n  .exec(fn);\n\
    }\n```\n\nNotice that unlike the previous example, this one calls client.multi.\
    \ Calling multi tells\nt Redis client that all the commands executed up until\
    \ exec is called are part of a trans-\nnion and should be executed together."
