- img_proc: true
  md: "```\n/**\n* Request time middleware\n* Options:\n* 'time' ('Number'): number\
    \ of ms after which you log (100)\n* @param (Object) options\n* @api public\n\
    */\n```\n\n```\nmodule.exports = function (opts) {\n  // -\n};\n```\n\nFirst,\
    \ you default the time to 100:\n\n```\nvar time = opts.time || 100;\n```\n\nThen\
    \ you return the function that will become the middleware:\n\n```\nreturn function\
    \ (req, res, next) {\n```\n\nIn the middleware itself, you should first create\
    \ a timer that fires within the time specified:\n\n```\nvar timer = setTimeout(function\
    \ () {\n  console.log(\n    '\\033[90m%s %\\033[90m \\033[91m taking too long!\\\
    033[39m',\n    req.method,\n    req.url\n  );\n}, time);\n```\n\nNow you have\
    \ to make sure to clear (that is, stop or cancel) the timer if the response finishes\
    \ within 100ms. Another common pattern in middleware is to override functions\
    \ (also known as monkey-patch) so that when another middleware calls them, you\
    \ can perform a certain action.\n\nIn this case, when the response end()s, you\
    \ want to clear the timer:\n\n```\nvar end = res.end;\nres.end = function (chunk,\
    \ encoding) {\n  res.end = end;\n  res.end(chunk, encoding);\n  clearTimeout(timer);\n\
    };\n```\n\nYou first keep a reference around the original function (var end =\
    \ res.end). Then, within the overridden function, you restore the original, call\
    \ it, and then clear the timer."
