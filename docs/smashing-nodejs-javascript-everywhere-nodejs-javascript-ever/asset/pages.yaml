  md: '# BASIC JAVASCRIPT


    This chapter assumes you''re somewhat familiar with JavaScript and its syntax.
    It goes over some fundamental concepts you must understand if you want to work
    with Node.js.


    # TYPES


    You can divide JavaScript types into two groups: *primitive* and *complex*. When
    one of the primitive types is accessed, you work directly on its value. When a
    complex type is accessed, you work on a reference to the value.


    +   - The primitive types are *number, boolean, string, null, and undefined.*

    - The complex types are *array, function, and object.*


    To illustrate:


    ```

    // primitives

    var a = 5;

    var b = a;

    b = 6;

    a; // will be 5

    b; // will be 6


    // complex

    var a = [''hello'', ''world''];

    var b = a;

    b[0] = ''bye'';

    a[0]; // will be ''bye''

    b; // will be ''bye''

    ```


    In the second example, `b` contains the *same reference* to the value as a does.
    Hence, when you access the first member of the array, you alter the original,
    so `a[0] === b[0]`.


    # TYPE HICCUPS


    Correctly identifying the type of value a certain variable holds remains a challenge
    in JavaScript.


    Because JavaScript has constructors for most primitives like in other languages
    with object-oriented features, you can create a string in two ways:


    ```

    var a = ''woot'';

    var b = new String(''woot'');

    a + b; // ''woot''

    ```'
