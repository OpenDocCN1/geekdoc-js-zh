  md: "# CHAPTER 12  MongoDB 213\n\n```\n/**\n * Connect to the database.\n */\n```\n\
    \n```\nvar server = new mongodb.Server('127.0.0.1', 27017)\n```\n\nYou tell the\
    \ driver to connect to the database. For this example, call it my-website. In\
    \ MongoDB, if a certain name you pick doesn't exist, it creates the database for\
    \ you.\n\n```\nnew mongodb.Db('my-website', server).open(function (err, client)\
    \ {\n```\n\nIf you can't connect, you want to abort the process:\n\n```\n// don't\
