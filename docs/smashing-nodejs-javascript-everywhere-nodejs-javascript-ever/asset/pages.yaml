  md: '# THE CHALLENGES AHEAD


    Even though you get the basic example functioning, these applications need some
    more work to become ready for real-world usage.


    # CLOSE DOESN''T MEAN DISCONNECT


    When a close event fires on a WebSocket server or client, it means something specific:
    the TCP connection was appropriately close. In the real world, however, this is
    not always the case. Your computer can shut down unexpectedly, a network error
    can occur, or you spill a glass of water on your motherboard. In a lot of scenarios,
    close might never fire!


    The solution for this problem is to rely on timeouts and heartbeats. For your
    application to handle these scenarios, you need to send dummy messages every number
    of seconds to make sure the client is alive and otherwise consider him forcefully
    disconnected.


    # JSON


    As examples get more complicated, the variety of messages that the server and
    clients exchange increases.


    The second example here relied heavily on encoding and decoding JSON packets manually.
    Because this is a common pattern in applications, that work should be done for
    you as part of another abstraction.


    # RECONNECTIONS


    What happens if the client temporarily disconnects? Most applications try to get
    the user reconnected automatically. In these examples, if a disconnection occurs,
    the only way to reconnect is to refresh the browser.


    # BROCASTCAST


    Broadcasting is a common pattern in real-time applications where interaction with
    other clients is expected. You shouldn''t need to define your own broadcasting
    mechanism manually.


    # WEBSOCKETS ARE HTML5: OLDER BROWSERS DON''T SUPPORT THEM


    WebSocket is a recent technology. Many browsers, proxies, firewalls, and antivirus
    software are still not ready to work completely with this new protocol and way
    of communicating. A solution for older browsers is needed.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# THE SOLUTION


    Fortunately, all these problems have solutions. In the next chapter, you work
    with a module called socket.io whose goal is to fix all the aforementioned issues
    while retaining the simplicity and speed of WebSocket-based communication.


    # SUMMARY


    You now understand the fundamentals of the WebSocket API and the WebSocket protocol,
    and how you can use Node.JS to leverage it for very fast message exchange. In
    the first example you familiarized yourself with its most basic usage.


    You created a multi-user application that exhibits the strengths of WebSocket:
    its minimal framing allows for sending lots of short messages that arrive to other
    clients as fast as possible.


    Finally, I described the weaknesses in terms of API and browser support that we
    can improve upon thanks to the socket.io framework, described in the next chapter.'
