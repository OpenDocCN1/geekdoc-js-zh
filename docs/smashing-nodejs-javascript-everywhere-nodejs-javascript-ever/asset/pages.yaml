  md: "# SIMPLE TESTING\n\nTo get started, you'll need to identify a test subject.\
    \ In other words, you'll decide what script or functionality you want to write\
    \ tests for.\n\n# THE TEST SUBJECT\n\nThe test subject for this chapter is the\
    \ application you wrote in Chapter 9 for searching tweets.\n\nHere, you write\
    \ a program which asserts that upon submitting a search keyword, a list of tweets\
    \ is returned after the program looks for some indicative pieces of HTML. In this\
    \ case, a list of tweets is composed of one or more `<li>` elements. Asserting\
    \ the search keyword and the `<li>` string as part of the HTTP response should\
    \ be sufficient for establishing that the application worked.\n\nTo navigate,\
    \ check the code examples and ensure that the application is running. Then point\
    \ your browser to `http://localhost:3000`.\n\n# THE TEST STRATEGY\n\nThe most\
    \ basic form of testing is writing a new node program whose exit code is 0 if\
    \ the test passes or 1 if the test doesn't succeed.\n\nIf an exception is thrown,\
    \ Node automatically exits with a failure error code for you, which fits this\
    \ model nicely. In addition, you get a stack trace to understand where the error\
    \ comes from. Therefore, when you write your tests, your goal is to assert that\
    \ certain conditions are met or an exception otherwise. To this end, Node has\
    \ a core module called `assert`-ensures that a condition passes; otherwise, it\
    \ raises an `AssertionError` as an exception.\n\nAs an example, write a test program\
    \ that succeeds if the current timestamp is an even number or fails with a stack\
    \ trace if it's an odd number:\n\n```\n/**\n * Module dependencies\n */\n\nvar\
    \ assert = require('assert');\n\n/**\n * Assert condition\n */\n\nvar now = Date.now();\n\
    console.log(now);\nassert.ok(now % 2 == 0);\n```"
