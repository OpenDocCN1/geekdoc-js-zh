    \ to it in your server:\n\n```\nvar express = require('express')\n wsio = require('websocket.io')\n\
    \n/**\n* Create express app.\n*/\nvar app = express.createServer();\n\n/**\n*\
    \ Attach websocket server.\n*/\nvar ws = wsio.attach(app);\n\n/**\n* Serve your\
    \ code\n*/\napp.use(express.static('public'))\n\n/**\n* Listening on connections\n\
    */\nws.on('connection', function (socket) {\n// ..\n});\n\n/**\n* Listen\n*/\n\
    app.listen(3000);\n```\n\nIn this case, you want to take a different action when\
    \ a user connects. You want to keep track of everyone's positions in memory in\
    \ a simple object. You also keep track of the total number of clients that have\
    \ connected so that you can give each client a unique ID. That identifies the\
    \ client's position in the positions object:\n\n```\nvar positions = {}\n total\
    \ = 0\nws.on('connection', function (socket) {\n// ..\n});\n```"
