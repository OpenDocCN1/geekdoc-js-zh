    \ = 0;\nif (a) {\n  // this will never execute\n}\na == false; // true\na ===\
    \ false; // false\n```\n\nAlso noteworthy is the fact that typeof doesn't recognize\
    \ null as its own type:\n\n```\ntypeof null == 'object'; // true, unfortunately\n\
    ```\n\nAnd the same goes for arrays, even if defined with [], as shown here:\n\
    \n```\ntypeof [] == 'object'; // true\n```\n\nYou can be thankful v8 provides\
