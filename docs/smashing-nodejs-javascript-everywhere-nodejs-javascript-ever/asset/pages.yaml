- img_proc: true
  md: 'By not enforcing a particular message format, TCP offers great flexibility.


    # RELIABILITY


    TCP is based on a fundamentally unreliable service, it must implement a series
    of mechanisms to achieve reliability based on acknowledgments and timeouts.


    When a data packet is sent, the sender expects an acknowledgment (a tiny response
    indicating that the packet was received). If, after a certain window of time,
    the acknowledgment is not received, the sender retries to send the packet.


    This behavior effectively deals with unpredictable conditions such as network
    errors and network congestions.


    # FLOW CONTROL


    What happens when two computers communicate and one has a significantly faster
    connection than the other?


    TCP also ensures a balance in the flow of packets between the two ends by means
    of flow control.


    # CONGESTION CONTROL


    TCP has built-in mechanisms to ensure rates of packet delay and loss within a
    network do not drastically increase to ensure a good quality of service (QoS).


    Similarly to flow control, which prevents the sender from overwhelming the receiver,
    TCP tries to avoid congestive collapse by regulating the rate at which packets
    are sent, for example.


    Now that you have some basic understanding of how TCP theoretically works, it
    is time to get practical. In order to test or play with TCP servers, you can leverage
    the Telnet utility.


    # TELNET


    Telnet is an old network protocol intended to provide a bidirectional virtual
    terminal. It was mostly used before SSH existed as a means of controlling remote
    computers, such as remote server administration. It''s (no surprise!) a layer
    on top of the TCP protocol.


    Even though it almost completely fallen into disuse since the 2000s, all modern
    operating systems today ship with a telnet client (all illustrated in Figure 6-1):


    ```

    $ telnet

    ```


    The port over which Telnet communications occurs is 23. If you try to connect
    to a server over this port (telnet host.com 23 or simply telnet host.com), the
    program attempts to speak the Telnet protocol over TCP.'
