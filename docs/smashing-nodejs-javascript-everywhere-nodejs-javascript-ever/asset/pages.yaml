    \ (connection) {\n  connection.on('error', function (err) {\n    // err is an\
    \ error object\n  });\n}).\nlisten(4000);\n```\n\nThroughout Node, many of the\
    \ native modules such as http and net emit error events. If\nthese events go unhandled,\
    \ an uncaught exception is thrown.\n\nAside from the uncaughtException and error\
