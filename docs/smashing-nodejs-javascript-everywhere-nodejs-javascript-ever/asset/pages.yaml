  md: "# CHAPTER 5 • CLI and FS APIs:Your First Application 55\n\nAs discussed in\
    \ Chapter 3, to create fast programs that can handle a lot of concurrency in only\
    \ one thread, you create asynchronous event programs.\n\nSuch are not the circumstances\
    \ for this little CLI program (since only one person will be reading files at\
    \ a time), but for the sake of learning the most important and challenging parts\
    \ of Node.JS, you will write these in an async style.\n\nTo get the list of files,\
