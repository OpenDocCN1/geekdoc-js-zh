  md: "# INTRODUCTION\n\nLate in 2009, Ryan Dahl announced a technology named Node.JS\
    \ (http://nodejs.org/) at a JavaScript conference in Berlin. Interestingly, and\
    \ to the surprise of the attendees, this technology wasn't designed to run in\
    \ the browser, the land that JavaScript had conquered and that many developers\
    \ thought it would always be confined to.\n\nThis technology was about running\
    \ JavaScript in the server. That simple phrase immediately sparked the imagination\
    \ of the minds, which celebrated the announcement in standing ovation.\n\nIf done\
    \ right, we could write web applications in just one language.\n\nThat was, undoubtedly,\
    \ the first thought in everyone's minds. After all, to produce a rich and modern\
    \ web application, one must be proficient with JavaScript, but server technologies\
    \ are varied and require specialization. For an example, Facebook recently revealed\
    \ that its codebase has four times the number of lines of JS as PHP, its back-end\
    \ language of choice.\n\nBut what Ryan was interested in showing beyond that simple\
    \ yet powerful premise. Ryan showed that the \"hello world\" program of Node.JS\
    \ creates a web server:\n\n```\nvar http = require('http');\nvar server = http.createServer(function\
    \ (req, res) {\n  res.writeHead(200);\n  res.end('Hello world!');\n});\nserver.listen(80);\n\
    ```\n\nIt so happens this websocket is not just a toy, but a high-performance\
    \ web server that happens to fare just well (or even better) than established\
    \ and tested software like Apache and Nginx in a multitude of scenarios. Node.JS\
    \ was presented as a tool specifically aimed to design network applications the\
    \ right way.\n\nNode.JS owes its incredible speed and performance to a technique\
    \ called the event loop and the fact that it runs on top of V8, the JavaScript\
    \ interpreter and virtual machine that Google created to make their Chrome web\
    \ browser run impossibly fast.\n\nWhen it comes to web development, Node.JS changes\
    \ the panorama. You are no longer writing scripts that are executed by a web server\
    \ you install separately, such as the traditional LAMP model, which usually involves\
    \ PHP and Apache."
  merge: -1
  pgno: 14
- img_proc: true
  md: '# INTRODUCTION


    Taking back control of the web server, as you''ll see, resulted in a new category
    of applications being developed on top of Node.JS: real time web apps. Very fast
    data streaming between a server and thousands of concurrent clients is common
    currency in Node. This means that not only are you to creating more efficient
    programs, you''ll be part of a community that''s pushing the boundaries of what
    we thought was achievable in the web world.


    With Node, you are in charge. And with that capability comes a set of new challenges
    and responsibilities that this book carefully examines.


    # APPROACH


    First and foremost, Smashing Node.JS is a book about JavaScript. Your knowledge
    of JavaScript is absolutely required, and therefore I dedicate an initial chapter
    to the concepts of JavaScript that, in my opinion and experience, matter more.


    As you learn later, Node.JS strives to create an environment where the browser
    developer feels comfortable. Common expressions that are not part of the language
    specification but were added by browsers instead, such as `setTimeout`, `console.log`,
    are still available in Node.JS to this end.


    After you make it past the "memory refreshing" phase, you go into Node. Node comes
    with a lot of useful modules as part of its core, and a revolutionary simple package
    manager NPM. This book teaches you to build things using the Node core modules,
    and a selection of the most useful abstractions the community has built on top
    of it, that you can install with NPM.


    Before we jump into a module designed for solving a specific problem, I usually
    try to go through the hurdles of solving the same problem without them first.
    The best way to understand a tool is to understand why the tool exists in the
    first place. Therefore, before you learn about a web framework, you''ll learn
    why it''s better than Node.JS HTTP primitives. Before you''ll learn how to build
    an app with a cross-browser real time framework like Socket. IO, you''ll learn
    the limitations of barebones HTML5 WebSockets.


    This book is all about examples. Every step of the way you''ll be building a small
    application or testing different APIs. You can execute all the code examples in
    this book with the `node` command, which you can use in two ways:


    +   - Through node REPL (Read-Eval-Print Loop). In the same spirit as the Firebug
    or Web Inspector JavaScript consoles, this approach allows you to type in some
    JavaScript code, press Enter, and get it executed, right from your operating system''s
    command-line interface.

    - As files that you run through the `node` command. This approach requires you
    to use a text editor, which you obviously already have. I recommend vim (http://vim.org/)
    for this purpose, but any of them are good.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'In most cases, you''ll be writing the code examples step-by-step, reproducing
    the way it was built the first time around. I''ll guide you through different
    challenges and refactors. When you hit important milestones, I usually include
    a screenshot of what you should be seeing, either in your terminal or in a browser
    window, depending on what you''re developing.


    Sometimes, no matter how much thought went into the construction of these examples,
    problems are inevitable. I put together a collection of resources that can aid
    you.


    # RESOURCES


    Should you get stuck on any part of the book, there are a few ways you can get
    help.


    For general Node.JS support, check out the following:


    +   - The Node.JS mailing list (http://groups.google.com/group/nodejs)

    - On the irc.reenode.net server, the #nodejs channel


    For help related to specific projects, such as socket.io or express, check out
    the official support channels or, or if none are available, general forums such
    as Stack Overflow (http://stackoverflow.com/questions/tagged/node.js) certainly
    prove helpful.


    The majority of Node.JS modules are hosted on GitHub. If you''re certain you''ve
    found a bug, locate their GitHub repository and contribute a test case.


    Try your best to identify whether your problem is Node.JS or JavaScript related.
    It''s usually best to keep your Node.JS help requests strictly Node related.


    If you want to discuss a specific issue about this book, you can reach me at rauchg@gmail.com.'
