  md: "```\napp.get('/', function (req, res, next) {\n  db.query('SELECT id, title,\
    \ description FROM item', function (err, results) {\n    res.render('index', {\
    \ items: results });\n  });\n});\n```\n\nOnce your /route looks like this, you\
    \ should be able to relaunch your application and see a list\nof the items you\
    \ created previously.\n\nAs for the item route, which we link to that list, you\
    \ want to retrieve the item, make sure\nit exists, and fetch the reviews with\
    \ it. If the item does not exist, you want to send a 404\nstatus code.\n\nTo avoid\
    \ making the code hard to follow, break the logic into functions that are defined\
    \ in the\nlogical order they are executed:\n\nserver.js\n\n```\n/**\n * Item route.\n\
    \ */\n\napp.get('/item/:id', function (req, res, next) {\n  function getItem(fn)\
    \ {\n    db.query('SELECT id, title, description FROM item WHERE id = ? LIMIT\
    \ 1',\n      [req.params.id], function (err, results) {\n        if (err) return\
    \ next(err);\n        if (!results[0]) return res.send(404);\n        fn(results[0]);\n\
    \    });\n  }\n\n  function getReviews(item_id, fn) {\n    db.query('SELECT text,\
    \ stars FROM review WHERE item_id = ?',\n      [item_id], function (err, results)\
    \ {\n        if (err) return next(err);\n        fn(results);\n    });\n  }\n\n\
    \  getItem(function (item) {\n    getReviews(item.id, function (reviews) {\n \
    \     res.render('item', { item: item, reviews: reviews });\n    });\n  });\n\
    });\n```\n\nFigure 13-4 shows the completed application. You can now browse the\
    \ items, submit reviews\nfor them, and see them reflect in the interface."
