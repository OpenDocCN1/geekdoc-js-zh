  md: "# AJAX\n\nThe Web 2.0 marked the uprising of the web application. One of its\
    \ key ingredients was AJAX, which translated into a snier user experience for\
    \ a fundamental reason: you no longer had to retrieve an entire HTML document\
    \ every time the user interacted with the server.\n\nFor example, if you are updating\
    \ your profile on a social networking application, you can make an asynchronous\
    \ POST request and get a simple OK in return. With one of the readily available\
    \ JavaScript frameworks, you can alter the view to represent the user action.\n\
    \nAlternatively, when you click Remove on a table, you can send a DELETE request\
    \ and erase the row without having the browser fetch lot of unnecessary data,\
    \ images, scripts, stylesheets and then rerender the entire page.\n\nIn essence,\
    \ AJAX was important because it allowed you to get rid of a lot of data transfer\
    \ and rendering overhead that you didn't need for many of the things that web\
    \ applications were trying to do with web applications.\n\nIn recent times, however,\
    \ many applications have been transferring data in ways in which the traditional\
    \ HTTP request+response model results in significant overhead. Consider the example\
    \ of the application you are going to build in this chapter. Say you want to show\
    \ the cursors of every visitor of your website are in real time. Every time a\
    \ visitor moves your mouse, you send your coordinates.\n\nSay you jQuery to send\
    \ AJAX requests. The first idea that comes to mind is $.post to send a POST request\
    \ with the cursor location every time the mousemove event is triggered, as shown\
    \ here:\n\n```\n$document.mousemove(function(ev) {\n  $.post('/position', { x:\
    \ ev.clientX, y: ev.clientY });\n};\n```\n\nThis code, despite looking straightforward,\
    \ has a fundamental problem: you have no control over the order in which the server\
    \ receives requests.\n\nWhen your code makes a request, the browser can send it\
    \ any of its available sockets because browsers open multiple sockets to the target\
    \ server to enhance performance. For example, while an image is being downloaded,\
