- img_proc: true
  md: 'Connect makes it really easy to add this layer through the basicAuth middleware.


    As an example, create a tou authentication system that relies on the administration
    authorization-users through the command line.


    You first receive user input:


    ```

    process.stdin.resume();

    process.stdin.setEncoding(''ascii'');

    ```


    Then you add the basicAuth middleware:


    ```

    connect.basicAuth(function (user, pass, fn) {

    process.stdout.write(''Allow user \033[96m '' + user + ''\033[39m '' \n+ with
    pass \033[90m '' + pass + ''\033[39m [y/n]:'');

    process.stdin.on(''data'', function (data) {

    if (data[0] == ''y'') {

    fn(null, { username: user });

    } else fn(new Error(''Unauthorized''));

    }

    });});

    ```


    Notice that you use the once method on the stdin EventEmitter because you only
    care about receiving data from the command line once per request.


    The middleware is simple to use. It supplies the user and pass as parameters,
    and it supplies a callback to be invoked upon successful or failed authorization.


    If the authentication succeeds, you pass null as the first argument (or an Error
    if it doesn''t succeed) and the user object to populate req.remoteUser with.


    You then declare the next middleware, which gets executed only if the authentication
    succeeds:


    ```

    function (req, res) { res.writeHead(200); res.end(''Welcome to the protected area,''
    \n + req.remoteUser.username); }

    ```


    Then you submit your credentials (see Figure 8-16).'
