    # EXPLORING THE NPM REGISTRY


    Once you get comfortable with the Node.js module system in Chapter 4, you should
    be able to write programs that leverage any module in the ecosystem.


    NPM has a rich registry that contains thousands of modules. Two commands are instrumental
    in your exploration of the registry: search and view.


    If you want to search for plugins related to realtime, for example, you would
    execute the following:


    ```

    $ npm search realtime

    ```


    This will search all the published modules that contain MySQL in their name, tags,
    and description fields.


    Once you find a package that interests you, you can see its package.json and other
    properties related to the NPM registry by running npm view followed by the module
    name. For example:


    ```

    $ npm view socket.io

    ```


    > Tip: If you want to learn more about a certain NPM command, type "npm help <command>".
    For example, "npm help publish" will teach you more about how to publish modules.


    # SUMMARY


    After this chapter, you should now have a working Node.JS + NPM environment.


    In addition to being able to run the node and npm commands, you should now have
    a basic understanding of how to execute simple scripts, but also how to put together
    modules with dependencies.


    You now know that an important keyword in Node.JS is require, which allows for
    module and API interoperability, and which will be an important subject in Chapter
    4, after quickly reviewing the language basics.


    You are now aware of the NPM registry, which is the gateway to the Node.js ecosystem.
    Node.js is an open source project, and as a result many of the programs that are
    written with it are also open source and available for you to reuse, a few keystrokes
    away.'
