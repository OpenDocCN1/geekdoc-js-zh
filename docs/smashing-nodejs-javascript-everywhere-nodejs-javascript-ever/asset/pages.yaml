    # EXPECT.JS


    In the preceding examples, you leverage assert.ok and a basic JavaScript expression.


    When you''re reading through tests, you might find it hard to understand what
    exactly is being tested. For example, to assert that a string contains another,
    the easiest way to test it is to check for indexOf and apply the - operator, like
    you did previously.


    Here, expect.js offers a single function called expect that turns


    ```

    assert.ok(-res.text.indexOf(''<li>''));

    ```


    into


    ```

    expect(res.text).to.contain(''<li>''));

    ```


    The expressiveness of expectations in something reminiscent of natural language
    makes writing and understanding tests a simpler task.


    Expect.js is available through NPM as expect.js and its documentation can be found
    at https://github.com/learnboost/expect.js.


    Next you will learn some of the basics of the expect.js API.


    # API OVERVIEW


    The expect function is obtained by requiring the expect.js module:


    ```

    var expect = require(''expect.js'');

    ```'
