  md: '# CHAPTER

    HTTP


    HYPERTEXT TRANSFER PROTOCOL, or HTTP, is the protocol that powers the web, and,
    as discussed in Chapter 6, it sits on top of the TCP stack,


    Throughout this chapter you''ll learn how to leverage the Node.JS Server and Client
    APIs. Both are relatively easy to get started, but you''ll also learn some of
    the shortcomings that come up when building actual websites and web applications
    with them. For that, in the coming chapters I will introduce you to abstractions
    that sit on the HTTP server to introduce reusable components.


    Keep in mind that since you''re programming both the server and the website as
    part of the same code, every time you make changes to your text editor to code
    that''s ruining, you need to restart the Node process that powers it to have the
    changes reflect. At the end of this chapter, I''ll teach you how to leverage a
    tool to make this process straightforward.


    To get started, let''s review the anatomy of the HTTP protocol.'
  merge: -1
  pgno: 100
- img_proc: true
  md: "# THE STRUCTURE OF HTTP\n\nThe protocol is structured around the concept of\
    \ requests and responses, materialized in Node. JS as objects of the http.ServerRequest\
    \ and http.Server constructors, respectively.\n\nWhen a user first browses to\
    \ a website, the user agent (the browser) creates a request that is sent to the\
    \ web server over TCP, and a response is emitted.\n\nWhat do requests and responses\
    \ look like? To find out, first create a Hello World HTTP server that listens\
    \ on http://localhost:3000:\n\n```\nrequire('http').createServer(function (req,\
    \ res) {\n  res.writeHead(200);\n  res.end('Hello World');\n}).listen(3000);\n\
    ```\n\nNext, establish a telnet connection and write your own request:\n\n```\n\
    GET / HTTP/1.1\n```\n\nAfter typing GET / HTTP/1.1, press Enter twice.\n\nThe\
    \ response, illustrated in Figure 7-1, comes in right after!\n\n![](img/c641d3b47d2abe2a65f037111c97ed26_101_0.png)\n\
    \nThe response text looks like this:\n\n```\nHTTP/1.1 200 OK\nConnection: keep-alive\n\
    Transfer-Encoding: chunked\n```"
  merge: -1
  pgno: 101
- img_proc: true
  md: "CHAPTER 7 • HTTP 89\n\nb\nHello World\n0\n\nThe first relevant section of this\
    \ response is the *headers*, which you'll read about next.\n\n# # HEADERS\n\n\
    As you can see, HTTP is a protocol in the same fashion as IRC. Its purpose is\
    \ to enable the exchange of documents. It utilizes *headers* that precede both\
    \ requests and responses to describe different aspects of the communication and\
    \ the content.\n\nAs an example, think of the different types of content that\
    \ web pages deliver: text, HTML, XML, JSON, PNG and JPEG images, and a large number\
    \ of other possibilities.\n\nThe *type* of content that's sent is annotated by\
    \ the `Content-Type` header.\n\nLook at how this applies in practice. Bring back\
    \ hello world, but this time add some HTML in there:\n\n```\nrequire('http').createServer(function\
    \ (req, res) {\n  res.writeHead(200);\n  res.end('Hello <b>World</b>');\n}\n).listen(3000);\n\
    ```\n\nNotice that the word World is surrounded by bold tags. You can check it\
    \ out with the rudimentary TCP client again (see Figure 7-2).\n\n![](img/c641d3b47d2abe2a65f037111c97ed26_102_0.png)\n\
    \n*Figure 7-2: The Hello <b>World</b> response*\n\nThe response is just what you\
    \ might expect:"
  merge: -1
  pgno: 102
- img_proc: true
  md: "# 90 PART II • Web Servers\n\n```\nGET / HTTP/1.1\n\nHTTP/1.1 200 OK\nConnection:\
    \ keep-alive\nTransfer-Encoding: chunked\n```\n\n12\nHello <b>World</b>\n0\n\n\
    Now, however, see what happens when you look at it with a browser (see Figure\
    \ 7-3).\n\n![](img/c641d3b47d2abe2a65f037111c97ed26_103_0.png)\n\nThat doesn't\
    \ look like rich text, but why?\n\nAs it occurs, the HTTP client (browser) doesn't\
    \ know what type of content you're sending because you didn't include that as\
    \ part of your communication. The browser therefore considers what you're seeing\
    \ as content type text/plain, or normal plain text, and doesn't to render it as\
    \ HTML.\n\nIf you adjust the code to include the appropriate header, you fix the\
    \ problem (see Figure 7-4):\n\n```\nrequire('http').createServer(function (req,\
    \ res) {\n  res.writeHeader(200, { 'Content-Type': 'text/html' });\n  res.end('Hello\
    \ <b>World</b>');\n\n}).listen(3000);\n```"
