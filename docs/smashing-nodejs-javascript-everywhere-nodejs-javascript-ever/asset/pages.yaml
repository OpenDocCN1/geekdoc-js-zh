  md: "# WITH GREAT POWER COMES GREAT RESPONSIBILITY\n\nNode introduces a complexity\
    \ to JavaScript that's probably not really used in managing much in the browser:\
    \ shared-state concurrency. As a matter of fact, this complexity is nonexistent\
    \ in traditional models for making web applications like Apache and mod_php or\
    \ Nginx and FastCGI.\n\nIn less technical terms, in Node you have to be careful\
    \ about how your callbacks modify the variables around them (state) that are currently\
    \ in memory. Thus you need to be careful about how you handle errors that can\
    \ potentially alter this state in unexpected ways and potentially render the entire\
    \ process unusable.\n\nTo understand this, imagine the following function which\
    \ gets every time the user makes a request to the URL /books. Imagine also that\
    \ the \"state\" is a collection of books that'll ultimately use to return an HTML\
    \ list of books.\n\n```\nvar books = [\n  'Metamorphosis'\n  'Crime and punishment'\n\
    ];\n```\n\n```\nfunction serveBooks () {\n  // I'm going to serve some HTML to\
