- img_proc: true
  md: "# CHAPTER 12 • MongoDB 217\n\nYou store the _id as part of the session so that\
    \ you can retrieve this user in subsequent routes. Notice that you're explicitly\
    \ storing it as a string, which for a MongoDB ObjectId this is a hexadecimal representation.\n\
    \nFinally, you can also implement the /logout route, which simply clears the session.\
    \ Remember, you can freely alter the req.session object, and after you produce\
    \ a response (a redirect in this case), Express saves it down automatically.\n\
    \n```\n/**\n * logout route.\n */\n\napp.get('/logout', function (req, res) {\n\
    \  req.session.loggedIn = null;\n  res.redirect('/');\n});\n```\n\nIn this case,\
    \ you preserve the session and set the ID to null. Alternatively, if you want\
    \ to wipe the session entirely, you can call req.session.regenerate().\n\n# AUTHENTICATION\
    \ MIDDLEWARE\n\nIt's likely that most applications you develop will require access\
    \ to the authenticated user in more than one place.\n\nIf you take a look at index.jade\
    \ again, the expectation is that you can access the object me to access the document\
    \ matching and that you can verify whether the user is authenticated through the\
    \ authenticated local:\n\n```\nif (authenticated)\n  p Welcome back, #{me.name}\n\
    \  <a href=\"/logout\"> Logout\n```\n\nYou can define this middleware that exposes\
    \ both variables automatically for to any template you render. Now you can leverage\
    \ the res.local Express API:\n\n```\n/**\n * Authentication middleware.\n */\n\
    \napp.use(function (req, res, next) {\n  if (req.session.loggedIn) {\n    res.local('authenticated',\
    \ true);\n    app.users.findOne({ _id: req.session.loggedIn }, function (err,\
    \ doc) {\n      if (err) return next(err);\n      res.local('me', doc);\n    \
    \  next();\n    });\n  }\n}\n});\n```"
