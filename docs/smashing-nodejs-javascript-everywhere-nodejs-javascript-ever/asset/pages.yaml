  md: 'The ideal case for this particular web application starts to resemble TCP (like
    that in the chat application in Chapter 6) more than it resembles HTTP. Ideally,
    you would want to write the positions to a socket sequentially with minimal framing
    (that is, the data that surrounds the data you care about).


    If you think in terms of telnet, ideally you would like the browser to send


    ```

    x=6&y=7 \nx=10&y=15 \n..

    ```


    Now, thanks to HTML5, you have a solution: WebSocket. WebSocket is the TCP of
    the web, a low-level bidirectional socket that gives control of the communication
    back to you.


    # HTML5 WEBSOCKET


    When you discuss WebSocket, you''re talking about two distinct parts: the WebSocket
    API implemented by browsers, and the WebSocket Protocol implemented by servers.
    Both have been designed and developed in conjunction with other technologies as
    part the HTML5 initiative and movement, but are not a formal part of the HTML5
    specification. The former is being standardized by the W3C, and the latter has
    been standardized by the IETF RFC 6455.


    The API as it''s implemented by the browser looks like this:


    ```

    var ws = new WebSocket(''ws://host/path'');

    ws.onopen = function () {

    ws.send(''data'');

    }

    ws.onclose = function () {

    ws.ondata = function (ev) {

    alert(ev.data);

    }

    ```


    The simplicity of this API is, not coincidentally, reminiscent of the TCP client
    you wrote in Chapter 6. As you can see, unlike XMLHttpRequest (AJAX), it''s not
    oriented around requests and responses, but messages sent with the send method.
    You can send and receive messages in UTF-8 or binary encoding very easily, through
    the data event, and learn about the connection being opened or closed through
    the open and close events.


    Connection must first be established with a handshake. The handshake looks like
    a normal HTTP request, but after the server responds to it, the client and server
    beginning exchanging data with minimal framing:'
