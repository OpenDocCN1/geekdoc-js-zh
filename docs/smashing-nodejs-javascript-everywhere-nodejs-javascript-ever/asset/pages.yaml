    \ to mongodb');\n```\n\nThen you set up the collection:\n\n```\n// set up collection\
    \ shortcuts\napp.users = new mongodb.Collection(client, 'users');\n```\n\nAnd\
    \ finally you make Express ready to take in connections:\n\n```\n// listen\napp.listen(3000,\
    \ function () {\n  console.log('\\\\033[96m +\\033[39m app listening on *:3000');\n\
    });\n```\n\nIf you run the application (always ensuring your database is running\
    \ as well), the output should now look like this:\n\n```\n$ node server.js\n+\
    \ connected to mongodb\n+ app listening on *:3000\n```\n\nIf you go to the mongo\
    \ client again and run show log global, you should, as illustrated in Figure 12-3,\
    \ see your connection!\n\n```\n$ mongo\n> show log global;\n... \n[date] [initandlisten]\
    \ connection accepted from 127.0.0.1:53649 #16\n```"
