  md: "# A BASIC EXAMPLE\n\nFor this example you're going to write a module that depends\
    \ on a logging utility.\n\nFirst, write the main file main.js:\n\n```\nmain.js\n\
    var log = require('./log');\n\nmodule.exports = function () {\n  log('Executed\
    \ my module');\n}\n```\n\nThis is the equivalent of that main file in an NPM package\
    \ or the file that you normally require when you are going to leverage a certain\
    \ module.\n\n```\nnode.js\nmodule.exports = function (str) {\n  return console.log(str);\n\
    }\n```\n\nIn Node, you would simply use\n\n```\nnode.js\nvar mymodule = require('./main');\n\
    mymodule();\n```\n\nFor the browser, you want to export it as a global called\
    \ module. You therefore run browserbuild pointing to the working directory and\
    \ supplying the name of the global variable to export and the main file:\n\n```\n\
    browserbuild --main main --global mymodule main.js log.js > out.js.\n```\n\nWhat\
    \ you're telling the browserbuild command is: compile the files main.js and log.js\
    \ together, with the main module being exposed as the global mymodule.\n\nIn addition,\
    \ notice that at the end of the command I use > compiled.js. This ensures that\
    \ the output that the command generates goes into the compiled.js file.\n\nWhen\
    \ you need to implement the library in the browser, all you do is include the\
    \ <script> tag pointing to the compiled.js script:\n\n```\n<script src='compiled.js\"\
    >\n```"
