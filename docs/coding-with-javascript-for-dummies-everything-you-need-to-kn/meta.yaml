  md: "# WHILE loop\n\nThese loops are used when we want to repeat the execution of\
    \ some sentences an indefinite number of times, as long as a condition is met.\
    \ It is easier to understand that the FOR loop, since it does not incorporate\
    \ in the same line the initialization of the variables its condition to continue\
    \ executing and its update. Only the condition that must be met for an iteration\
    \ to be performed is indicated, as we will see below.\n\n```\nwhile (condition)\
    \ {\n    // statements to execute\n}\n```\n\nAn example of code where this loop\
    \ is used can be seen below.\n\n```\nvar color = \"\"\nwhile (color! = \"red\"\
    ) {\n    color = prompt (\"give me a color (write red to exit)\", \"\")\n}\n```\n\
    \nThis is an example of the simplest thing to do with a while loop. What it does\
    \ is ask the user to enter a color and it does it repeatedly, as long as the entered\
    \ color is not red. To execute a loop like this we first have to initialize the\
    \ variable that we are going to use in the loop iteration condition. With the\
    \ initialized variable we can write the loop, which will check to execute that\
    \ the color variable is different from \"red\". In each iteration of the loop\
    \ a new color is requested from the user to update the color variable and the\
    \ iteration is finished, so we return to the beginning of the loop, where we have\
    \ to re-evaluate if what is in the color variable is \"red\" and so on as long\
    \ as the text \"red\" has not been entered as a color."
