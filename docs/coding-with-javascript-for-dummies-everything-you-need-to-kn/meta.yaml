    ## JavaScript 函数库


    在所有编程语言中，都有用于执行各种非常重复性编程任务的函数库。编程语言中的库可以省去程序员编写常用函数的麻烦。一门发展完善的编程语言会有相当数量的库。有时候，要充分了解所有库比学习这门语言本身还要困难。


    JavaScript 在其库中包含了大量的函数。由于它是一种面向对象的语言，许多库是通过对象实现的。例如，数学或字符串处理函数就是通过 Math 和 String
    对象来实现的。然而，也有一些函数不与任何对象关联，这些就是我们在本章中要介绍的函数，因为我们目前还不太了解对象，而且也不需要为了学习它们而去研究对象。


    ### JavaScript 内置函数


    这些是 JavaScript 提供给程序员使用的函数。


    - **eval(string)**：该函数接收一个字符串，并将其作为 JavaScript 语句执行。


    - **parseInt(string, base)**：接收一个字符串和一个基数。返回将字符串转换为指定基数数字后的数值。


    - **parseFloat(string)**：将字符串转换为数字并返回。


    - **escape(character)**：返回以 ISO Latin 1 编码格式表示的接收参数字符。


    - **unescape(character)**：执行与 escape 函数完全相反的操作。


    - **isNaN(number)**：根据接收到的参数返回一个布尔值。如果不是数字则返回 true，如果是数字则返回 false。


    通过对象实现的库以及浏览器处理相关的库（同样通过对象管理），我们将在后面介绍。


    注意：我们并不希望用这短短的内置 JavaScript 函数列表来误导大家。实际上还有许多其他函数会在本手册中逐一介绍，只不过它们与对象相关联。例如，正如我们提到的，有字符串处理函数与字符串对象相关联，有用于高级数学计算的函数与
    Math 类相关联，有用于浏览器窗口对象的函数，以及与文档相关的函数等等。


    ### JavaScript 内置函数的使用示例


    到目前为止，我们仅仅了解了 JavaScript 语言原生函数的列表。现在我们可以看几个 JavaScript 原生函数的使用示例，这些函数在任何浏览器和任何版本的
    JavaScript 中都可以使用。


    我们将介绍三个来自不同领域的函数，它们在日常工作中相当基础，通过示例进行讲解。


    ## eval 函数


    这个函数非常重要，重要到有些 JavaScript 应用程序如果不使用它就无法实现。它的使用非常简单，但要理解在哪些情况下使用它可能稍微复杂一些，因为有时候它的应用有点微妙。


    以我们目前的知识还无法构建一个非常复杂的例子，但至少可以看到该函数的工作方式。我们将把它用在一个有点奇怪且相当无用的语句中，但如果我们能理解它，也就理解了
    eval 函数。


    ```javascript

    var myText = "3 + 5"

    eval("document.write(" + myText + ")")

    ```


    首先我们创建一个包含文本的变量，在下一行我们使用 eval 函数，并传入一个写入屏幕的 JavaScript 指令作为参数。如果我们将 eval 函数括号内的字符串拼接起来，就得到了这个。


    ```javascript

    document.write(3 + 5)

    ```


    eval 函数执行通过参数传递给它的指令，因此它会执行这条语句，结果是在网页上写入 8。首先解决括号内的加法运算，得到 8，然后执行屏幕写入指令。


    ## parseInt 函数


    该函数接收一个以字符串形式书写的数字，以及一个表示基数的数字。实际上它可以接收其他类型的变量，因为 JavaScript 中的变量没有类型，但通常的使用方式是传入一个字符串，将文本变量转换为数字。


    该函数可以接收的不同基数有 2、8、10 和 16。如果我们没有传入任何基数，函数将基数解释为十进制。函数返回的值始终以 10 为基数，所以如果基数不是 10，它会在返回前将数字转换为该基数。


    让我们看一系列对 parseInt 函数的调用，看看它返回什么，以便更多地了解这个函数。


    ```javascript

    document.write(parseInt("34"))

    ```


    返回数字 34


    ```javascript

    document.write(parseInt("101011", 2))

    ```


    返回数字 43


    ```javascript

    document.write(parseInt("34", 8))

    ```


    返回数字 28


    ```javascript

    document.write(parseInt("3F", 16))

    ```


    返回数字 63


    这个函数在实际中用于许多不同的数字处理场景，例如获取小数的整数部分。


    ```javascript

    document.write(parseInt("3.38"))

    ```


    返回数字 3


    它也非常常用于判断一个变量是否为数字，因为如果我们传给函数的文本不是数字，它将返回 NaN（Not a Number，非数字）。


    ```javascript

    document.write(parseInt("develoloweb.com"))

    ```


    返回 NaN


    这个同样的例子稍作修改后很有趣，因为如果我们传入字母和数字的组合，它会给出以下结果。


    ```javascript

    document.write(parseInt("16XX3U"))

    ```


    返回数字 16


    ```javascript

    document.write(parseInt("TG45"))

    ```


    返回 NaN


    如你所见，该函数尝试将字符串转换为数字，如果无法转换则返回 NaN。


    所有这些看起来有些不成体系的 parseInt 工作原理示例，稍后会在处理表单操作等更实际的例子中进行回顾。


    ## isNaN 函数


    该函数根据接收到的参数是否为数字返回一个布尔值。它只能接收数字或表达式 NaN。如果接收到 NaN 则返回 true，如果接收到数字则返回 false。这是一个非常容易理解和使用的函数。


    该函数通常与 parseInt 或 parseFloat 函数配合使用，以判断这两个函数返回的是否为数字。


    ```javascript

    miInteger = parseInt("A3.6")

    isNaN(myInteger)

    ```


    在第一行中，我们给变量 miInteger 赋值，尝试将文本 A3.6 转换为整数。由于该文本无法转换为数字，parseInt 函数返回 NaN。第二行检查前一个变量是否为
    NaN，如果是则返回 true。


    ```javascript

    miFloat = parseFloat("4.7")

    isNaN(miFloat)

    ```


    在这个例子中，我们将文本转换为带小数的数字。该文本可以完美转换，因为它对应一个数字。当接收到数字时，isNaN 函数返回 false。


    我们有一个非常有趣的 JavaScript 实践工坊，旨在巩固这些章节的知识。它是一个验证表单字段的脚本，以确保我们确知该字段中始终是一个整数。现在阅读它可能会非常有趣，因为我们使用了
    isNaN() 和 parseInt() 函数。请参见实践工坊。


    我们希望这篇文章中的示例能够引起您的兴趣。然而，正如我们之前提到的，还有许多其他原生的 JavaScript 函数值得我们了解，但它们与原生 JavaScript
    类和对象相关联。但在进入这一点之前，我们想提供一个关于在 JavaScript 中进行面向对象编程的小型基础指南。

