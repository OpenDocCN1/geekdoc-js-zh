    \ was introduced in Javascript 1.2, so not all browsers support it, only version\
    \ 4 or higher. In any case, any code you want to write with DO ... WHILE can also\
    \ be written using a WHILE loop, so in older browsers you will have to translate\
    \ your DO ... WHILE loop into a WHILE loop.\n\nThe syntax is as follows:\n\n```\n\
