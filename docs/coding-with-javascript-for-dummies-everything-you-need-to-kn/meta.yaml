    # Conditional expressions


    The expression to evaluate is always placed in parentheses and is made up of variables
    that are combined with each other using conditional operators. We recall that
    conditional operators related two variables and always returned a boolean result.
    For example, a conditional operator is the operator "is equal" (==), which returns
    true if the two operands are the same or false if they are different.


    ```

    if (age> 18)


    document.write("you can see this page for adults")

    ```


    In this example we use the conditional operator "is greater" (>). In this case,
    it returns true if the variable age is greater than 18, so the following line
    would be executed, informing us that the adult content can be seen.


    Conditional expressions can be combined with logical expressions to create more
    complex expressions. We remember that logical expressions are those that have
    Booleans as operands and that return another Boolean value. They are the logical
    negation, logical AND, and logical OR operators.


    ```

    if (battery <0.5 && redElectrica == 0)


    document.write("your laptop will shutdown in seconds")

    ```


    What we do is check if the battery of our supposed computer is less than 0.5 (it
    is almost finished) and we also check if the computer has no electrical network
    (it is unplugged). Then the logical operator matches them to a Y, so if it is
    almost without battery AND without power, it reports that the computer is going
    to shut down.


    Note: The list of operators that can be used with IF structures can be seen in
    the chapter on conditional operators and logical operators.


    The if structure is one of the most used in programming languages, to make'
