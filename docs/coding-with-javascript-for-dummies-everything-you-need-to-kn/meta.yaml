  md: "# Where do we put the Javascript functions\n\nFunctions are one of the main\
    \ components of programs, in most programming languages. In the Javascript Manual\
    \ we have already begun to explain what a function is and how we can create and\
    \ invoke it in this language. Now we are going to deal with a topic that is not\
    \ so much about syntax and programming, but has more to do with the correct and\
    \ habitual use that is made of the functions in Javascript, which is none other\
    \ than the placement of the code of the functions in the Web page.\n\nIn principle,\
    \ we can place the functions anywhere on the page, always between <SCRIPT> tags,\
    \ of course. However, there is a limitation when placing it in relation to the\
    \ places from which it is called. We anticipate that the easiest is to place the\
    \ function before any call to it and thus we will surely never make a mistake.\n\
    \nThere are two possible options to put the code of a function:\n\na) Put the\
    \ function in the same script block: Specifically, the function can be defined\
    \ in the <SCRIPT> block where the function call is, although it does not matter\
    \ if the call is before or after the function code , within the same <SCRIPT>\
    \ block.\n\n```\n<SCRIPT>\nmyFunction ()\nfunction myFunction () {\n  // I do\
    \ something ...\n  document.write (\"This is fine\")\n}\n</SCRIPT>\n```"
  merge: -1
