    we will use ES5, which is the version of the language that works in all current
    browsers.


    As general information, we will summarize we will comment on the different versions
    of Javascript:


    Really, any moderately modern browser will now have all the Javascript functionalities
    that we are going to need and above all, those that we can use in our first steps
    with the language. However, it may be useful to know the first versions of Javascript
    that we discussed in this article, as a curiosity.


    Javascript 1: It was born with Netscape 2.0 and it supported a large number of
    instructions and functions, almost all that exist now have already been introduced
    in the first standard.


    Javascript 1.1: It is the Javascript version that was designed with the arrival
    of 3.0 browsers. It implemented little more than its previous version, such as
    dynamically processing images and creating arrays.


    Javascript 1.2: The version of browsers 4.0. This has the disadvantage that it
    is a little different on Microsoft and Netscape platforms, since both browsers
    grew differently and were in full fight for the market.


    Javascript 1.3: Version implemented by 5.0 browsers. In this version, some differences
    and rough edges between the two browsers have been filed.


    Javascript 1.5: Current version, at the time of this writing, implemented by Netscape
    6.


    For its part, Microsoft has also evolved to present its 5.5 version of JScript
    (that''s what they call the javascript used by Microsoft''s browsers).


    In 2009 the version of ECMAScript 5 was published. This is the version that'
  merge: -1
