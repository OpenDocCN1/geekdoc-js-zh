- md: '## Hide Javascript scripts in old browsers


    Throughout the previous chapters of the Javascript Manual we have already seen
    that the language was implemented as of Netscape 2.0 and Internet Explorer 3.0.
    Even for those who do not know it, it is okay to say that there are browsers that
    work on operating systems, where you can only display text and where certain technologies
    and applications are not available, such as the use of images, different typographic
    fonts or Javascript itself.


    Thus, not all browsers that can be used by users who visit our page understand
    Javascript. In cases where the scripts are not interpreted, browsers assume that
    their code is text from the page itself and as a consequence, present the scripts
    in the body of the document, as if it were normal text. To prevent script text
    from being written to the page when browsers don''t understand it, you have to
    hide them with HTML comments (`<!-- HTML comment -->`). In addition, in this article
    we will also see how to display a message that is seen only in browsers that do
    not support Javascript.


    Updated: At the present time we can say that almost 100% of the available browsers
    support Javascript, or at least they recognize script tags, so, even if it is
    disabled, they will not show the text of our Javascript programs. Therefore, currently
    it is no longer essential to perform the operation of hiding the code of the page
    scripts for old browsers. However, if we want to make a completely correct page,
    it will be useful to learn how to hide a script so that it is never displayed
    as text on the page.


    ## Hide Javascript code with HTML comments


    Let''s look at a code example where HTML comments have been used to hide Javascript,
    or better said, the code the Javascript scripts.


    ```javascript

    <SCRIPT>

    <!--

    Javascript code

    // -->

    </SCRIPT>

    ```


    We see that the beginning of the HTML comment is identical to how we know it in
    HTML, but the closing of the comment has a peculiarity, which begins with a double
    slash. This is because the end of the comment contains several characters that
    Javascript recognizes as operators and when trying to parse them it throws a syntax
    error message. So that Javascript does not launch an error message, this double
    bar is placed before the HTML comment, which is nothing more than a Javascript
    comment, which we will know later when we talk about syntax.


    The beginning of the HTML comment is not necessary to comment it with the double
    bar, since Javascript understands well that it is simply intended to hide the
    code. A clarification at this point: if we put the two bars on this line, they
    would be seen in old browsers as being outside the HTML comments. `<SCRIPT>` tags
    are not understood by older browsers, therefore they are not interpreted, as they
    are with any unknown tag.


    ## Show a message for old browsers with `<NOSCRIPT>`


    There is the possibility of indicating an alternative text for browsers that do
    not understand Javascript, to inform them that a script should be executed in
    that place and that the page is not working at 100% of its capacities. We may
    also suggest that visitors update their browser to a language-compatible version.
    To do this we use the `<NOSCRIPT>` tag and between this tag and its corresponding
    closing we can place the alternative text to the script.


    ```html

    <SCRIPT>

    javascript code

    </SCRIPT>

    <NOSCRIPT>

    This browser does not understand the scripts that are running, you must update
    your browser version to a newer one.

    <br> <br>

    <a href="http://netscape.com"> Netscape </a>. <br>

    <a href="http://microsoft.com"> Microsoft </a>.

    </NOSCRIPT>

    ```


    ## More about scripting


    In this article we will show one of the attributes that can be indicated in the
    SCRIPT label, which indicates the language that we are going to use. In addition,
    we will show another very useful way of associating Javascript code on the page,
    by means of an external file. This point is fundamental and we will have to pay
    special attention, since it is without a doubt the way of working that is used
    most often.


    ## Interesting methods of placing Javascript scripts


    ### Indicate the language we are using


    Updated: Today it is no longer necessary to specify the scripting language we
    are using. The reason is that Javascript is the only industry accepted language
    for scripting on Web pages. Therefore, the "language" attribute is really unnecessary.


    The `<SCRIPT>` tag has an attribute that is used to indicate the language that
    we are using, as well as its version. For example, we can indicate that we are
    programming in Javascript 1.2 or Visual Basic Script, which is another language
    for programming scripts in the client browser that is only compatible with Internet
    Explorer.


    The attribute in question is "language" and the most common is to simply indicate
    the language in which the scripts have been programmed. The default language is
    Javascript, so if we do not use this attribute, the browser will understand that
    the language with which it is being programmed is Javascript. One detail where
    people often make mistakes without realizing it is that language is written with
    two -g- and not with -g- and with -j- as in Spanish.


    ```html

    <script language="javascript">

    ```


    Use of the "type" attribute:

    When we put a SCRIPT tag we must use the "type" attribute to indicate what type
    of script encoding we are doing and the language used.


    ```html

    <script type="text/javascript">

    ```


    The "type" attribute is necessary for you to correctly validate your document
    in the most current versions of HTML.


    Note on HTML versions: With the advent of HTML5, the need to specify the language
    and type (language and type attributes) was removed, therefore, with the script
    tag it is more than enough to open a block of Javascript code. However, in previous
    versions of HTML we are required to define the "type" attribute. Although in HTML
    4.01 transitional we correctly validate the language attribute, it will not validate
    if we are doing strict HTML, so we do not recommend using "language" in any case.
    In the examples of DesarrolloWeb.com where language was used, please ignore it.


    ## Include external Javascript files


    Another way to include scripts on web pages, implemented as of Javascript 1.1,
    is to include external files where you can put many functions that are used on
    the page. Files usually have a .js extension and are included in this way.


    ```html

    <script src="external_file.js"></script>

    ```


    Within the `<SCRIPT>` tags, any text can be written and will be ignored by the
    browser, however, browsers that do not understand the SRC attribute will have
    this text by instructions. It is very rare for this to happen in the browser landscape.
    So it is not really advisable to put any Javascript code inside a script block
    that we are using to include an external file.


    The file we include (in this case "external_file.js") must contain only Javascript
    statements. We must not include HTML code of any kind, not even the `<SCRIPT>`
    and `</SCRIPT>` tags.


    ## The Importance of Using External Javascript Code Files


    At the didactic level in this manual we use a lot of the practice of including
    the Javascript code inside the HTML document itself. It is something that comes
    very comfortable to express small Javascript examples. However, at a professional
    level it is not a good practice, but the recommendation is to put all, or most
    of your Javascript code in ".js" files that you include externally. There are
    several reasons to recommend this practice, among which we can highlight:


    - From the point of view of code separation, each file should have only one language.
    HTML documents are placed in ".html" files, CSS documents in ".css" files and
    Javascript also separated in their ".js" files.


    - The external file allows the browser to cache it, so when the page is revisited,
    the code is already in the browser and you don''t have to redownload it. This
    point is especially important when we have many pages that load the same Javascript
    code, since the browser will actually download the ".js" file once and the other
    times will consume it from the cache, saving transfer and increasing loading speed.


    - When you have more advanced notions about Javascript you will see that in the
    script tag you can use attributes like "defer" or "async". Both attributes cause
    the browser not to stop executing an external script that is in the middle of
    the HTML content, but to continue analyzing the page and rendering its content
    while the file is downloaded. Therefore, both attributes optimize the page load
    and improve the speed with which the browser presents the content to the user.


    Note: When you use "defer" the file load is done in parallel with parsing the
    HTML and other external files, but the execution is deferred until the browser
    has finished parsing and rendering the page. When you use "async" you mean that
    the script is downloaded at the same time that the page is analyzed and that,
    once downloaded, it is executed, although it did not take long to analyze.'
