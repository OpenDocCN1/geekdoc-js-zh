  md: '# Break and continue


    Javascript has different control structures to implement loops, such as FOR, WHILE
    and DO ... WHILE, which we have already been able to explain in previous chapters
    of the Javascript Manual. As we have seen, with these loops we can cover a large
    number of needs, but perhaps over time you will find that you are missing some
    possibilities of controlling the repetitions of the loops.


    Imagine for example that you are doing a very long loop to find something on hundreds
    or thousands of sites. But put yourself in the case that during the first iterations
    you find that value you were looking for. Then there would be no point in going
    through the rest of the loop to search for that item, as you had already found
    it. In these situations it is convenient for us to know for the loop to cancel
    the rest of the iterations. Obviously, this is just one example of how we might
    need to control the loop a bit more. In real life as a programmer you will find
    many other occasions where you will be interested in doing this or other things
    with them.


    Thus, there are two instructions that can be used in the different control structures
    and mainly in the loops, which will help you control two types of situations.
    They are the break and continue instructions:


    break: It means stopping the execution of a loop and leaving it.

    continue: Used to stop the current iteration and return to the beginning of the
    loop to perform another iteration, if applicable.


    # Break


    A loop is stopped using the word break. Stopping a loop means exiting it and leaving
    everything as is to continue the program flow immediately after the loop.'
