  md: "# Javascript SWITCH structure\n\nControl structures are the way in which you\
    \ can control the flow of programs, to do different things depending on the states\
    \ of the variables. In the Javascript Manual we already started to see the control\
    \ structures and now it is SWITCH's turn, a slightly more complex structure that\
    \ allows multiple operations depending on the state of a variable.\n\nIn this\
    \ article we will see that switch helps us to make decisions based on different\
    \ states of the variables. This expression is used when we have multiple possibilities\
    \ as a result of evaluating a sentence.\n\nThe SWITCH structure was incorporated\
    \ from version 1.2 of Javascript (Netscape 4 and Internet Explorer 4). Its syntax\
    \ is as follows.\n\n```\nswitch (expression) {\n  case value1:\n    Statements\
    \ to execute if the expression has a value of value1\n    break\n  case value2:\n\
    \    Statements to execute if the expression has a value of value2\n    break\n\
    \  case value3:\n    Statements to execute if the expression is valued at value3\n\
    \    break\n  default:\n    Statements to execute if the value is not one of the\
    \ above\n}\n```"
  merge: -1
  pgno: 127
- img_proc: true
  md: "The expression is evaluated, if it is worth value1 the sentences related to\
    \ that case are executed. If the expression is worth value2, the instructions\
    \ related to that value are executed, and so on, for as many options as we want.\
    \ Finally, for all cases not previously contemplated, the default case is executed.\n\
    \nThe word break is optional, but if we do not put it after a value is found,\
    \ all the sentences related to this and all the following will be executed. That\
    \ is, if in our previous scheme there were no breaks and the expression were value1,\
    \ the sentences related to value1 would be executed, as well as those related\
    \ to value2, value3 and default.\n\nThe default option or default option is also\
    \ optional.\n\nLet's see an example of using this structure. Suppose we want to\
    \ indicate what day of the week it is. If the day is 1 (Monday) get a message\
    \ indicating it, if the day is 2 (Tuesday) we must get a different message and\
    \ so on for each day of the week, except on the 6 (Saturday) and 7 (Sunday) that\
    \ we want show the message \"it's weekend\". For days greater than 7 we will indicate\
    \ that this day does not exist.\n\n```\nswitch (day_of_the_week) {\n  case 1:\n\
    \    document.write (\"It's Monday\")\n    break\n  case 2:\n    document.write\
    \ (\"It's Tuesday\")\n    break\n  case 3:\n    document.write (\"It's Wednesday\"\
    )\n    break\n```"
