- md: "## undefined in JavaScript\n\nThe undefined public property represents the\
    \ undefined initial value in JavaScript.\n\nThe property attributes are undefined:\n\
    \n- Writable – no\n- Statistically – no\n- Adjustable – No\n\n### General structure\n\
    \n```\nundefined\n```\n\n### The description\n\nThe undefined property is a property\
    \ of the global object, that is, it is a variable in the public domain, and the\
    \ primary value of the undefined property is the undefined initial data type.\n\
    \nThe undefined property is not configurable and is not writable in modern browsers\
    \ (starting with the ECMAScript 5 standard), but try to avoid overwriting it.\n\
    \nVariables that have not been assigned a value will have an undefined value and\
    \ the expressions will be undefined if a value is not assigned to the variable.\
    \ A function will return the undefined value if we do not specify a value to return\
    \ that function via the return expression.\n\nIt is true that we can use the word\
    \ undefined as an identifier in any field other than the public domain (because\
    \ undefined is not a reserved word), but it is not appropriate to do so, and this\
    \ will make it difficult to maintain and debug program errors.\n\n```\n// Do not\
    \ do this at all\n// \"foo string\"\n(function () {\n  var undefined = 'foo';\n\
    \  console.log (undefined, typeof undefined);\n}) ();\n```\n\n// \"foo string\"\
    \n(function (undefined) {\n  console.log (undefined, typeof undefined);\n}) ('foo');\n\
    ```\n\n## Examples\n\n### Comparison with undefined\n\nYou can use the strict\
    \ equality operator (===) with undefined to see if a variable has a value. In\
    \ the following code, the value of variable x is not known, and the result of\
    \ the if expression is true:\n\n```\nvar x;\nif (x === undefined) {\n  // The\
    \ software expressions will be implemented here\n}\nelse {\n  // The software\
    \ expressions will not be implemented here\n}\n```\n\nNote that we used the strict\
    \ equality operator (===) instead of using the normal equality operator (==),\
    \ because x == undefined will return true if x is null, while the corresponding\
    \ strict equality is not null. See the Comparison Transactions page for details.\n\
    \n#### The typeof operator is the undefined value\n\nAlternatively, we can use\
    \ the typeof operator to see if the value of the variable is undefined:\n\n```\n\
    var x;\nif (typeof x === 'undefined') {\n  // The software expressions will be\
    \ implemented here\n}\n```\n\nOne reason for using the typeof operator is that\
    \ it will not throw an error when the variable is not declared:\n\n```\n// The\
    \ variable is not known yet\nif (typeof x === 'undefined') { // without problems\n\
    \  // The software expressions will be implemented here\n}\n\nif (x === undefined)\
    \ {  // Throws ReferenceError\n}\n```\n\n### The void operator and the value undefined\n\
    \nA third way to check if the value of an undefined variable is to use the void\
    \ operator:\n\n```\nvar x;\nif (x === void 0) {\n    // The software expressions\
    \ will be implemented here\n}\n```\n\n```\n// This variable has not been known\
    \ before\nif (y === void 0) {\n    // The error will be called a - Uncaught ReferenceError:\
    \ y is not defined\n}\n```\n\n## Null in JavaScript\n\nNull represents the intentional\
    \ absence of object value, which is an initial value type in JavaScript.\n\n###\
    \ General structure\n\n```\nnull\n```\n\n### The description\n\nNull is used via\
    \ null, note that null is not an identifier of a property in the public object\
    \ (i.e. it is not like the undefined property), but null indicates that there\
    \ is no definition from the baseline, and indicates that the variable does not\
    \ refer to any object.\n\n```\n// The variable does not exist, as it has not been\
    \ known or created before\nconsole.log (foo); // ReferenceError: foo is not defined\n\
    \n// The variable is present but has no type and no value\nvar foo = null;\nconsole.log\
    \ (foo); // null\n```\n\n#### The difference between null and undefined\n\nWhen\
    \ checking for null or undefined, consider the difference between the equality\
    \ operator (==) and the strict equality operator (===). The first factor will\
    \ convert the types before comparison:\n\n```\ntypeof null // \"object\" (not\
    \ \"null\" for historical reasons)\ntypeof undefined // \"undefined\"\nnull ===\
    \ undefined // false\nnull == undefined // true\nnull === null // true\nnull ==\
    \ null // true\n! null // true\nisNaN (1 + null) // false\nisNaN (1 + undefined)\
    \ // true\n```\n\n## Word processing\n\nThese objects represent text strings and\
    \ the ways they are processed and modified.\n\n- String\n- RegExp\n\n### The String\
    \ object in JavaScript\n\nThe String object is a syntax function for text strings,\
    \ or a set of characters.\n\n#### General structure\n\nThe initial values of text\
    \ strings can take the following form:\n\n```\n'string text'\n\"string text\"\n\
    \" 中文 español deutsch English हिन्दी العربية português বাংলা русский 日 日本語 ਪੰਜਾਬੀ\
    \ ਪੰਜਾਬੀ កោ ម៉ារាំង Hebrew\"\n```\n\nText strings can be created using the String\
    \ public object directly:\n\n```\nString (thing)\nthing\n```\n\n**Any value we\
    \ want to convert to a text string.**\n\n#### Templates\n\nStarting with the ECMAScript\
    \ 2015, template literals can be created:\n\n```\n`hello world`\n`hello!\n  world!`\n\
    `hello ${who}`\nescape `<a> ${who} </a>`\n```\n\n#### Escape characters\n\nIn\
    \ addition to the regular characters, special characters can be included by escaping\
    \ them as follows:\n\n| Code | Output |\n| :--- | :--- |\n| `\\0` | The character\
    \ is NULL |\n| `\\'` | Single quotation mark |\n| `\\\"` | Double quotation mark\
    \ |\n| `\\\\` | Backslash |\n| `\\n` | New line (new line) |\n| `\\r` | Return\
    \ carriage to the beginning of the line (carriage return) |\n| `\\v` | Vertical\
    \ tab space |\n| `\\t` | Tabulation distance (tab) |\n| `\\b` | Backspace |\n\
    | `\\f` | Move to a new page (form feed) |\n| `\\uXXXX` | Unicode codepoint format\
    \ |\n| `\\u{X}...` | Unicode codepoint format |\n| `\\xXX` | Latin-1 (Latin-1)\
    \ |\n\nIn contrast to some other programming languages, JavaScript does not differentiate\
    \ between text strings enclosed in single quotation marks and text strings surrounded\
    \ by double quotation marks; therefore, the previous escape characters will work\
    \ regardless of the type of quotation marks around them.\n\n#### Long text strings\n\
    \nSometimes the code will contain some very long text strings, and instead of\
    \ the long line or the line wrap in the editor, we can divide these text strings\
    \ into several lines of code without affecting the content of the text strings\
    \ itself. There are two ways to do this.\n\nWe can use the + operator to add text\
    \ strings to each other as follows:\n\n```\nlet longString = \"This is a very\
    \ long string which needs\" +\n        \"to wrap across multiple lines because\"\
    \ +\n        \"otherwise my code is unreadable.\";\n```\n\nYou can also use the\
    \ backslash at the end of each line to indicate that the text string will be completed\
    \ in the next line; but make sure that there is no space or any other character\
    \ after the backslash (except for the new line), otherwise it will not work. Here's\
    \ an example of this method:\n\n```\nlet longString = \"This is a very long string\
    \ which needs \\\nto wrap across multiple lines because \\\notherwise my code\
    \ is unreadable.\";\n```\n\nBoth previous examples will produce the same text\
    \ string.\n\n### The description\n\nText strings are useful for holding data that\
    \ represents textual words. One of the most commonly used operations on text strings\
    \ is to check their length (via the length property), to concatenate text strings\
    \ using + , and to search for or extract subtext strings using the indexOf() function\
    \ and the substring() function.\n\n### Access the characters\n\nThere are two\
    \ ways to access the characters in a text string. The first is to use charAt():\n\
    \n```\nreturn 'cat'.charAt (1); // \"a\"\n```\n\nAnother method added to the ECMAScript\
    \ 5.1 standard is to treat the text string as array-like objects. The characters\
    \ are associated with a numeric index:\n\n```\nreturn 'cat' [1]; // \"a\"\n```\n\
    \nWhen you access characters using square brackets, trying to delete or assign\
    \ a value to those attributes will not work; these attributes will not be writable\
    \ or settable."
  mdcn: "\n## JavaScript 中的 undefined\n\n`undefined`公共属性表示 JavaScript 中的未定义初始值。\n\n\
    该属性的特性如下：\n\n- 可写性（Writable） – 否\n- 可枚举性（Statistically） – 否\n- 可配置性（Adjustable）\
    \ – 否\n\n### 通用结构\n\n```\nundefined\n```\n\n### 描述\n\n`undefined`属性是全局对象的一个属性，也就是说，它是公共域中的一个变量，而`undefined`属性的初始值是未定义的初始数据类型。\n\
    \n在现代浏览器中（从 ECMAScript 5 标准开始），`undefined`属性是不可配置且不可写的，但请尽量避免覆写它。\n\n未赋值的变量将具有`undefined`值，如果变量未被赋值，则表达式的结果将是`undefined`。如果我们没有通过`return`表达式指定要返回的值，函数将返回`undefined`值。\n\
    \n诚然，我们可以在公共域以外的任何字段中使用`undefined`作为标识符（因为`undefined`不是保留字），但这样做并不合适，这将使程序错误的维护和调试变得困难。\n\
    \n```\n// 根本不要这样做\n// \"foo string\"\n(function () {\n  var undefined = 'foo';\n\
    \  console.log (undefined, typeof undefined);\n}) ();\n```\n\n// \"foo string\"\
    \n(function (undefined) {\n  console.log (undefined, typeof undefined);\n}) ('foo');\n\
    ```\n\n## 示例\n\n### 与 undefined 进行比较\n\n你可以使用严格相等运算符（`===`）与`undefined`来检查变量是否具有值。在下面的代码中，变量`x`的值未知，`if`表达式的结果为`true`：\n\
    \n```\nvar x;\nif (x === undefined) {\n  // 软件表达式将在此处执行\n}\nelse {\n  // 软件表达式将不会在此处执行\n\
    }\n```\n\n请注意，我们使用了严格相等运算符（`===`）而不是普通相等运算符（`==`），因为如果`x`为`null`，`x == undefined`将返回`true`，而对应的严格相等比较则不是`null`。详情请参阅比较运算符页面。\n\
    \n#### typeof 运算符与 undefined 值\n\n或者，我们可以使用`typeof`运算符来查看变量的值是否为`undefined`：\n\
    \n```\nvar x;\nif (typeof x === 'undefined') {\n  // 软件表达式将在此处执行\n}\n```\n\n使用`typeof`运算符的一个原因是，当变量未声明时，它不会抛出错误：\n\
    \n```\n// 变量尚未被知晓\nif (typeof x === 'undefined') { // 没有问题\n  // 软件表达式将在此处执行\n\
    }\n\nif (x === undefined) {  // 抛出 ReferenceError\n}\n```\n\n### void 运算符与 undefined\
    \ 值\n\n检查变量值是否为`undefined`的第三种方法是使用`void`运算符：\n\n```\nvar x;\nif (x === void 0)\
    \ {\n    // 软件表达式将在此处执行\n}\n```\n\n```\n// 此变量之前尚未被知晓\nif (y === void 0) {\n \
    \   // 错误将被称为 - 未捕获的引用错误：y 未定义\n}\n```\n\n## JavaScript 中的 Null\n\n`null`表示对象值的有意缺失，这是\
    \ JavaScript 中的一种初始值类型。\n\n### 通用结构\n\n```\nnull\n```\n\n### 描述\n\n通过`null`使用`null`，请注意`null`不是公共对象中属性的标识符（即它不像`undefined`属性），但`null`表示从基线开始没有定义，并表示变量不引用任何对象。\n\
    \n```\n// 变量不存在，因为它之前未被知晓或创建\nconsole.log (foo); // 引用错误：foo 未定义\n\n// 变量存在，但没有类型也没有值\n\
    var foo = null;\nconsole.log (foo); // null\n```\n\n#### null 和 undefined 之间的区别\n\
    \n在检查`null`或`undefined`时，请考虑相等运算符（`==`）和严格相等运算符（`===`）之间的区别。第一个运算符（`==`）会在比较前转换类型：\n\
    \n```\ntypeof null // \"object\"（由于历史原因，不是 \"null\"）\ntypeof undefined // \"undefined\"\
    \nnull === undefined // false\nnull == undefined // true\nnull === null // true\n\
    null == null // true\n! null // true\nisNaN (1 + null) // false\nisNaN (1 + undefined)\
    \ // true\n```\n\n## 文本处理\n\n这些对象表示文本字符串以及处理和修改它们的方式。\n\n- String\n- RegExp\n\n\
    ### JavaScript 中的 String 对象\n\n`String`对象是用于文本字符串或字符集的语法函数。\n\n#### 通用结构\n\n文本字符串的初始值可以采用以下形式：\n\
    \n```\n'string text'\n\"string text\"\n\" 中文 español deutsch English हिन्दी العربية\
    \ português বাংলা русский 日 日本語 ਪੰਜਾਬੀ ਪੰਜਾਬੀ កោ ម៉ារាំង Hebrew\"\n```\n\n文本字符串可以直接使用`String`公共对象创建：\n\
    \n```\nString (thing)\nthing\n```\n\n**任何我们想要转换为文本字符串的值。**\n\n#### 模板字面量\n\n从\
    \ ECMAScript 2015 开始，可以创建模板字面量：\n\n```\n`hello world`\n`hello!\n  world!`\n`hello\
    \ ${who}`\nescape `<a> ${who} </a>`\n```\n\n#### 转义字符\n\n除了常规字符外，还可以通过以下转义方式包含特殊字符：\n\
    \n| 代码 | 输出 |\n| :--- | :--- |\n| `\\0` | NULL 字符 |\n| `\\'` | 单引号 |\n| `\\\"\
    ` | 双引号 |\n| `\\\\` | 反斜杠 |\n| `\\n` | 换行符（新行） |\n| `\\r` | 回车符（回车） |\n| `\\v`\
    \ | 垂直制表符 |\n| `\\t` | 制表符（Tab） |\n| `\\b` | 退格符 |\n| `\\f` | 换页符 |\n| `\\uXXXX`\
    \ | Unicode 码点格式 |\n| `\\u{X}...` | Unicode 码点格式 |\n| `\\xXX` | 拉丁-1（Latin-1）\
    \ |\n\n与某些其他编程语言不同，JavaScript 不区分用单引号括起来的文本字符串和用双引号括起来的文本字符串；因此，无论引号类型如何，前面的转义字符都会生效。\n\
    \n#### 长文本字符串\n\n有时代码会包含一些非常长的文本字符串，为了避免长行或编辑器中的换行，我们可以将这些文本字符串分成几行代码，而不会影响文本字符串本身的内容。有两种方法可以做到这一点。\n\
    \n我们可以使用`+`运算符将文本字符串连接在一起，如下所示：\n\n```\nlet longString = \"This is a very long\
    \ string which needs\" +\n        \"to wrap across multiple lines because\" +\n\
    \        \"otherwise my code is unreadable.\";\n```\n\n你也可以在每行末尾使用反斜杠来表示文本字符串将在下一行继续；但请确保反斜杠后面没有空格或任何其他字符（换行符除外），否则它将不起作用。以下是此方法的一个示例：\n\
    \n```\nlet longString = \"This is a very long string which needs \\\nto wrap across\
    \ multiple lines because \\\notherwise my code is unreadable.\";\n```\n\n前面两个示例将产生相同的文本字符串。\n\
    \n### 描述\n\n文本字符串对于保存表示文本词语的数据非常有用。对文本字符串最常用的操作之一是检查其长度（通过`length`属性），使用`+`连接文本字符串，以及使用`indexOf()`函数和`substring()`函数搜索或提取子文本字符串。\n\
    \n### 访问字符\n\n有两种方法可以访问文本字符串中的字符。第一种是使用`charAt()`：\n\n```\nreturn 'cat'.charAt\
    \ (1); // \"a\"\n```\n\nECMAScript 5.1 标准中添加的另一种方法是将文本字符串视为类数组对象。字符与数字索引相关联：\n\
    \n```\nreturn 'cat' [1]; // \"a\"\n```\n\n当你使用方括号访问字符时，尝试删除或为这些属性赋值将不起作用；这些属性将是不可写或不可设置的。\n"
