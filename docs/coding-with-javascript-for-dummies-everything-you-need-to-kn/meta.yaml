    \ String 对象的一部分来使用。\n\n#### 示例\n以下示例展示了 `fromCodePoint()` 函数的使用：\n\n```javascript\n\
    String.fromCodePoint(42); // \"*\"\nString.fromCodePoint(65, 90); // \"AZ\"\n\
