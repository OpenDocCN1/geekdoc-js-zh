  merge: -1
  pgno: 55
- img_proc: true
  md: '# Javascript is written to the HTML document


    The most important and basic thing that we can highlight at this moment is that
    Javascript programming is done within the HTML document itself. That is, the Javascript
    code, in most cases, is mixed with the HTML code itself to generate the page.


    This means that we must learn to mix the two programming languages and we will
    quickly see that, so that these two languages can coexist without problems between
    them, delimiters must be included that separate the HTML tags from the Javascript
    instructions. These delimiters are the <SCRIPT> and </SCRIPT> tags. All the Javascript
    code that we put on the page has to be inserted between these two tags.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# # The placement of the scripts does matter


