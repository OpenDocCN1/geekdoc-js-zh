- img_proc: true
  md: '# Frontend developer:


    He is the professional who deals with client-side development, although he can
    have various activities in addition to programming, such as design, layout, user
    interface development, client-side SPA applications, etc. Javascript knowledge
    is essential in all areas of action of a frontend developer.


    # Backend developer:


    As a backend we understand server-side programming. For backend, the truth is
    that Javascript (with NodeJS) is just one of the many possibilities. However,
    NodeJS offers many advantages such as its asynchrony, speed and optimization,
    making it ideal for many types of projects.


    # Fullstack developer:


    Fullstack developer is one that is capable of working on both the client and server
    side. In reality it is a rare breed, so much that it is often said that it does
    not really exist, because it requires a lot of knowledge from the developer and
    therefore it is very complicated, or impossible, that a single profile brings
    them all together. However, in my opinion it is a reality in many jobs since there
    are professionals who must have global knowledge in various areas (autonomous
    freelancers are the main example) and therefore it is a figure that really does
    exist. Today, the fact of Javascript serving both the client and the server side,
    makes the figure of the fullstack developer much easier and makes life easier
    for thousands of developers, as it saves them the mental fatigue of moving from
    language to language. another constantly.


    Note: Specialization is also present in these professions. It is truly amazing
    to see how profiles develop in the world of the web and how new specialized professions
    are generated year after year. What we used to call frontend, simply, today we
    can subdivide it into dozens of specific profiles or professions such as "frontend
    engineer", "frontend web designer", "CSS architect", "mobile frontend developer",
    "frontend devops" ...'
  merge: -1
  pgno: 28
