  md: '# Javascript function library


    In all programming languages there are libraries of functions that serve to do
    different and very repetitive things when programming. Libraries in programming
    languages save you the trouble of writing common functions that programmers may
    usually need. A well-developed programming language will have a fair amount of
    them. Sometimes it is more difficult to know all the libraries well than to learn
    to program in the language.


    Javascript contains a good number of functions in its libraries. As it is a language
    that works with objects, many of the libraries are implemented through objects.
    For example, math or string handling functions are implemented using Math and
    String objects. However, there are some functions that are not associated with
    any object and are the ones that we will see in this chapter, since we still do
    not know the objects and we will not need them to study them.


    Built-in Javascript functions

    These are the functions that Javascript makes available to programmers.


    eval (string)

    This function receives a character string and executes it as if it were a Javascript
    statement.


    parseInt (string, base)

    Receive a chain and a base. Returns a numeric value resulting from converting
    the string to a number in the indicated base.


    parseFloat (string)

    Converts the string to a number and returns it.'
