  md: '# # Escape characters in text strings


    There are a series of special characters that are used to express certain controls
    in a text string, such as a line break or a tab. These are the escape characters
    and are written with special notation that starts with a backslash (a forward
    slash opposite the normal one ") and then the code for the character to be displayed
    is placed.


    A very common character is the line break, which is achieved by typing n. Another
    very common character is to place quotation marks, because if we put quotation
    marks without their special character, the quotation marks that we put in will
    start to close the character string. The quotation marks must then be entered
    with "o(''(double or single quotation marks). There are other escape characters,
    which we will see in the table below, which are more summarized, although the
    one used to write a backslash should also be highlighted as the usual character.
    , so as not to confuse it with the start of an escape character, which is the
    double backslash.


    Table with all escape characters


    +   - **Line break**: `\n`

    - **Single quote**: `''\''`

    - **Double quote**: `""`

    - **Tab**: `\t`

    - **Carriage return**: `\r`

    - **Page advance**: `\f`

    - **Move back space**: `\b`

