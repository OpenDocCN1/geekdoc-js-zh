  md: "# Direct execution of Javascript code\n\nIt is the most basic method of running\
    \ scripts. In this case, the instructions are included inside the <SCRIPT> tag,\
    \ as we have previously commented. When the browser reads the page and finds a\
    \ script, it interprets the lines of code and executes them one after the other.\
    \ We call this way direct execution because when the page is read the scripts\
    \ are executed directly.\n\n```\n<! DOCTYPE html>\n<html lang = \"is\">\n<head>\n\
    \  <meta charset = \"UTF-8\">\n  <meta name = \"viewport\" content = \"width =\
    \ device-width, initial-scale = 1.0\">\n  <meta http-equiv = \"X-UA-Compatible\"\
    \ content = \"ie = edge\">\n  <title> Example of direct execution </title>\n</head>\n\
    <body>\n  <h1> Page with Javascript </h1>\n  <p> This page has a dialog box, which\
    \ will be displayed as soon as the browser processes it. </p>\n\n /<script>\n\
    \    var people = 4;\n    var amountEntrance = 9.50;\n    alert ('You need' +\
    \ people * ticket amount + 'euros for everyone to enter the cinema');\n  </script>\n\
    \n  <p> When the user clicks accept in the dialog box, the browser will display\
    \ the full page. </p>\n</body>\n</html>\n```"
  merge: -1
  pgno: 59
- img_proc: true
  md: 'That Javascript code will execute as the page opens. When the browser, when
    processing the page, finds this code, it will stop reading the page to execute
    the Javascript script. As a result it will show in a dialog box "You need 38 euros
    for everyone to enter the cinema". When the user clicks the "accept" button, they
    will continue reading the rest of the page and displaying the content of the entire
    page in the browser window. Of course we will see many other examples throughout
