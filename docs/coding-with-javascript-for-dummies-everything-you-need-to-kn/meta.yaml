- md: "## Arrays in Javascript\n\nIn programming languages there are special data\
    \ structures that help us store more complex information than simple variables.\
    \ A typical structure in all languages is the Array, which is like a variable\
    \ where we can enter several values, instead of just one as it happens with normal\
    \ variables.\n\nArrays allow us to save several variables and access them independently,\
    \ it is like having a variable with different compartments where we can enter\
    \ different data. For this we use an index that allows us to specify the compartment\
    \ or position to which we are referring.\n\nNote: The arrays were introduced in\
    \ Javascript versions 1.1 or higher, that is, we can only use them from browsers\
    \ 3.0. For older browsers you can simulate the array using object-oriented programming\
    \ syntax, but the truth is that currently this limitation should not concern us.\
    \ Furthermore, given the complexity of the task of simulating an array by means\
    \ of objects, at least at the time we meet and the few occasions when we will\
    \ need it, we think that it is better to forget about that matter and simply work\
    \ with arrays usually. So in this article and the following we are going to see\
    \ how to use the authentic Javascript array.\n\n## Creation of Javascript Arrays\n\
    \nThe first step in using an array is to create it. For this we use a Javascript\
    \ object already implemented in the browser. We will now see a topic to explain\
    \ what object orientation is, although it will not be necessary to understand\
    \ the use of arrays. This is the statement to create an array object:\n\n```javascript\n\
    var myArray = new Array ()\n```\n\nThis creates an array on the page that is running.\
    \ The array is created without any content, that is, it will not have any boxes\
    \ or compartments created. We can also create the Javascript array specifying\
    \ the number of compartments it will have.\n\n```javascript\nvar myArray = new\
    \ Array (10)\n```\n\nIn this case, we indicate that the array will have 10 positions,\
