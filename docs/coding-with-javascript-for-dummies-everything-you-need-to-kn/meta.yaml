    \nAs a difference with the previous examples, it should be noted that in this\
    \ case the Javascript instruction is inside an HTML attribute, onclick, which\
    \ indicates that this instruction has to be executed in response to the button\
    \ click.\n\nThe ease with which some interesting actions can be carried out has\
    \ been verified. As you can imagine, there would be many other simple Javascript\
    \ samples that we reserve for later chapters.\n\n## Javascript language\n\nLet's\
    \ see how to insert the Javascript code into an HTML document. In this article\
    \ we will explain some important rules and the most basic ways of executing Javascript\
    \ in the context of a page.\n\nIn this part of the manual on Javascript we are\
    \ going to know the most basic way of working with the language. In this article\
    \ we will give the first information on how to include scripts, mixing the Javascript\
    \ code itself with the HTML.\n\nThen we will also see how code should be placed\
    \ so that our website is compatible with all browsers, even those that do not\
    \ support Javascript. Many ideas of how Javascript works have already been described\
    \ in previous chapters, but with the aim of leaving nothing in the pipeline, we\
    \ will try to grab from here all the important data of this language.\n\n## Javascript\
    \ is written to the HTML document\n\nThe most important and basic thing that we\
    \ can highlight at this moment is that Javascript programming is done within the\
    \ HTML document itself. That is, the Javascript code, in most cases, is mixed\
    \ with the HTML code itself to generate the page.\n\nThis means that we must learn\
    \ to mix the two programming languages and we will quickly see that, so that these\
    \ two languages can coexist without problems between them, delimiters must be\
    \ included that separate the HTML tags from the Javascript instructions. These\
    \ delimiters are the <SCRIPT> and </SCRIPT> tags. All the Javascript code that\
    \ we put on the page has to be inserted between these two tags.\n\n### The placement\
    \ of the scripts does matter\n\nWe can enter several scripts on the same page,\
    \ each one that could be entered within different <SCRIPT> tags. The placement\
    \ of these scripts is not irrelevant. In the beginning, with what we know so far\
    \ and the scripts that we have carried out for testing, it gives us a little the\
    \ same where to place them, but in certain cases this placement will be very important.\
    \ In each case, and when the time comes, it will be reported accordingly.\n\n\
    Javascript can also be written within certain page attributes, such as the onclick\
    \ attribute. These attributes are related to user actions and are called event\
    \ handlers.\n\nBelow we are going to take a closer look at these two ways of writing\
    \ scripts, which have as their main difference the moment in which the sentences\
    \ are executed.\n\n### Ways to write Javascript scripts\n\nUntil now in the Javascript\
    \ Manual we have already had the opportunity to try some simple scripts, however,\
    \ we still have to learn one of the bases to be able to work with the language\
    \ and that is to learn the two ways of executing Javascript code. There are two\
    \ fundamental ways to run scripts on the page. The first of these ways is direct\
    \ script execution, the second is execution in response to user action.\n\nWe\
    \ will now explain each of these forms of execution available, but for those who\
    \ want it, we also recommend watching the video on Ways to include and execute\
    \ scripts.\n\n## Direct execution of Javascript code\n\nIt is the most basic method\
    \ of running scripts. In this case, the instructions are included inside the <SCRIPT>\
    \ tag, as we have previously commented. When the browser reads the page and finds\
    \ a script, it interprets the lines of code and executes them one after the other.\
    \ We call thisflux this way direct execution because when the page is read the\
    \ scripts are executed directly.\n\n```\n<!DOCTYPE* html>\n<html lang=\"is\">\n\
    <head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"ie=edge\"\
    >\n  <title>Example of direct execution</title>\n</head>\n<body>\n  <h1>Page with\
    \ Javascript</h1>\n  <p>This page has a dialog box, which will be displayed as\
    \ soon as the browser processes it.</p>\n\n  <script>\n    var people = 4;\n \
    \   var amountEntrance = 9.50;\n    alert('You need ' + people * amountEntrance\
    \ + ' euros for everyone to enter the cinema');\n  </script>\n\n  <p>When the\
    \ user clicks accept in the dialog box, the browser will display the full page.</p>\n\
    </body>\n</html>\n```\n\nThat Javascript code will execute as the page opens.\
    \ When the browser, when processing the page, finds this code, it will stop reading\
    \ the page to execute the Javascript script. As a result it will show in a dialog\
    \ box \"You need 38 euros for everyone to enter the cinema\". When the user clicks\
    \ the \"accept\" button, they will continue reading the rest of the page and displaying\
    \ the content of the entire page in the browser window. Of course we will see\
    \ many other examples throughout the manual.\n\nThis method will be the one we\
    \ use preferably in most of the examples in this part of the Javascript Manual.\
    \ In the second part of the Javascript Manual we can learn many things and among\
    \ them we will see in detail the second way of executing scripts that we are going\
    \ to relate below.\n\n## Running javascript in response to an event\n\nIt is the\
    \ other way to run scripts, but before we see it we must talk about events. Events\
    \ are actions performed by the user. Programs like Javascript are prepared to\
    \ catch certain actions performed, in this case on the page, and perform actions\
    \ in response. In this way, interactive programs can be carried out, since we\
    \ control the movements of the user and respond to them. There are many different\
    \ types of events, for example, the push of a button, the movement of the mouse,\
    \ or the selection of text on the page.\n\nThe actions that we want to perform\
    \ in response to an event can be indicated in many different ways, for example\
    \ within the same HTML code, in attributes that are placed inside the tag that\
    \ we want to respond to the user's actions. In the chapter where we saw a quick\
    \ example we already verified that if we wanted a button to perform actions when\
    \ it was clicked, we had to indicate them within the onclick attribute of the\
    \ button.\n\nWe therefore check that Javascript code can be inserted into certain\
    \ attributes of HTML tags. However, it is not the only possible method. We can\
    \ also select page elements directly with Javascript and associate functions that\
    \ will be executed in response to events. Although it is a bit early so that you\
    \ can understand this whole process in detail, we are going to see a simple example.\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"is\">\n<head>\n  <meta charset=\"UTF-8\"\
    >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n  <meta http-equiv=\"X-UA-Compatible\" content=\"ie=edge\">\n  <title>Example\
    \ hover over</title>\n</head>\n<body>\n  <h1>Javascript Example</h1>\n  <span\
    \ id=\"myElement\">Mouse over here</span>\n  <script>\n    var passes = 0;\n \
    \   function announcePast() {\n        passes = passes + 1;\n        alert('Mouse\
    \ over ' + passes + ' times');\n    }\n    document.getElementById('myElement').addEventListener('mouseenter',\
    \ announcePast);\n  </script>\n</body>\n</html>\n```\n\nThis time you have the\
    \ code for an entire page. In it you can find the Javascript code embedded inside\
    \ the body of the page. Unlike the previous code, when the browser reads the page\
    \ it doesn't execute anything. It simply memorizes the script and associates the\
    \ function with the element that has been defined. Specifically, we have defined\
    \ an event of type \"mouseenter\" on an element of the page that has an identifier\
    \ \"myElement\". This means that each time the user places the mouse pointer over\
    \ the element \"myElement\", it will execute the function \"announcePast\".\n\n\
    As we say, perhaps it is a little early to see examples of this style, so do not\
    \ worry if you have not understood everything. We are just starting the Javascript\
    \ manual and you will be able to learn all this and much more little by little.\
    \ So, we will see later this type of in-depth execution and the types of events\
    \ that exist. To get there we still have to learn many other things from Javascript.\
    \ In the next article we will show how we can hide the Javascript code for old\
    \ browsers."
