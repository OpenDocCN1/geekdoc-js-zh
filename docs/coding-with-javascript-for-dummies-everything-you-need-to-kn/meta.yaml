    # # Javascript typeof operator for type control


    We have been able to verify that, for certain operators, the type of data they
    are handling is important, since if the data is of one type, different operations
    will be performed than if they are of another.


    For example, when we used the operator +, if it was numbers it added them, but
    if it was character strings it concatenated them. We see then that the type of
    data we are using does matter and that we will have to be aware of this detail
    if we want our operations to be carried out as expected.


    To check the type of a data you can use another operator that is available as
    of javascript 1.1, the typeof operator, which returns a text string that describes
    the type of the operator that we are checking.


    Note: throughout our experience with Javascript we will see that many times it
    is more useful to change the data type of a variable before doing a check with
