- img_proc: true
  md: '# # The Importance of Using External Javascript Code Files


    At the didactic level in this manual we use a lot of the practice of Include the
    Javascript code inside the HTML document itself. It is something that comes very
    comfortable to express small Javascript examples. However, at a professional level
    it is not a good practice, but the recommendation is to put all, or most of your
    Javascript code in ".js" files that you include externally. There are several
    reasons to recommend this practice, among which we can highlight:


    From the point of view of code separation, each file should have only one language.
    HTML documents are placed in ".html" files, CSS documents in ".css" files and
    Javascript also separated in their ".js" files.


    The external file allows the browser to cache it, so when the page is revisited,
    the code is already in the browser and you don''t have to redownload it. This
    point is especially important when we have many pages that load the same Javascript
    code, since the browser will actually download the ".js" file once and the other
    times will consume it from the cache, saving transfer and increasing loading speed.


    When you have more advanced notions about Javascript you will see that in the
    script tag you can use attributes like "defer" or "async". Both attributes cause
    the browser not to stop executing an external script that is in the middle of
    the HTML content, but to continue analyzing the page and rendering its content
    while the file is downloaded. Therefore, both attributes optimize the page load
    and improve the speed with which the browser presents the content to the user.


    Note: When you use "defer" the file load is done in parallel with parsing the
    HTML and other external files, but the execution is deferred until the browser
    has finished parsing and rendering the page. When you use "async" you mean that
    the script is downloaded at the same time that the page is analyzed and that,
    once downloaded, it is executed, although it did not take long to analyze'
  merge: -1
