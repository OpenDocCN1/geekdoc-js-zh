  md: '# # Separation of instructions


    The different instructions that our scripts contain must be conveniently separated
    so that the browser does not indicate the corresponding syntax errors. Javascript
    has two ways of separating instructions. The first is through the semicolon (;)
    character and the second is through a line break.


    For this reason Javascript statements do not need to end with a semicolon unless
    we put two instructions on the same line.


    It is not a bad idea, anyway, to get used to using the semicolon after each instruction
