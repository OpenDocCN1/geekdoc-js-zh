  mdcn: "\n## 比较文本字符串\n\n开发者使用 `strcmp()` 来比较文本字符串；在 JavaScript 中，你可以使用大于和小于运算符：\n\
    \n```javascript\nvar a = 'a';\nvar b = 'b';\nif (a < b) {  // true\n  console.log\
    \ (a + ' is less than ' + b);\n} else if (a > b) {\n  console.log (a + ' is greater\
    \ than ' + b);\n} else {\n  console.log (a + ' and ' + b + ' are equal.');\n}\n\
    ```\n\n通过使用 String 对象副本中可用的 `localeCompare()` 函数，可以获得与上述类似的结果。\n\n## 原始文本字符串与\
    \ String 对象的区别\n\n请注意，JavaScript 语言区分 String 对象和初始文本字符串（Boolean 和 Number 对象同样如此）。\n\
    \n由双引号或单引号定义的文本字符串，以及未使用 `new` 保留字而由 String 函数返回的文本字符串都是原始字符串，JavaScript 会自动将这些初始值转换为\
    \ String 对象。当在初始字符串上使用函数（或尝试访问属性）时，JavaScript 会将初始文本字符串封装在一个对象中，并调用相应的函数（或所需的属性）：\n\
    \n```javascript\nvar s_prim = 'foo';\nvar s_obj = new String (s_prim);\n\nconsole.log\
    \ (typeof s_prim); // \"string\"\nconsole.log (typeof s_obj); // \"object\"\n\
    ```\n\n请注意，String 对象和初始文本字符串在与 `eval()` 函数配合使用时会产生不同的结果，因为传递的文本字符串将被视为 eval 执行，而\
    \ String 对象将表现得像其他对象一样，即返回该对象。以下示例说明了这一点：\n\n```javascript\nvar s1 = '2 + 2';\
    \ // 创建一个文本字符串\nvar s2 = new String ('2 + 2'); // 创建一个对象\nconsole.log (eval (s1));\
    \ // 4\nconsole.log (eval (s2)); // 文本字符串 2 + 2\n```\n\n由于这些原因，当你遇到 String 对象而不是原始文本字符串时，代码可能无法正常工作，但开发者并不会忽视这些区别。我们可以使用\
    \ `valueOf()` 函数将 String 对象转换为等效的初始文本字符串：\n\n```javascript\nconsole.log (eval\
    \ (s2.valueOf ())); // 4\n```\n\n## String 函数的功能\n\n- **String.prototype**\n该属性允许添加可用于所有类型为\
    \ String 的对象的属性。\n\n### String.fromCharCode()\n使用一组 Unicode 值创建文本字符串。\n\n### String.fromCodePoint()\n\
    使用一组字符值（码点）创建文本字符串。\n\n### String.raw()\n从原始模板创建文本字符串。\n\n### String.fromCharCode()\
    \ 详解\n\n`String.fromCharCode()` 静态函数使用一组 Unicode 字符值返回一个构建的文本字符串。\n\n#### 通用结构\n\
    ```javascript\nString.fromCharCode (num1 [, ... [, numN]])\n```\n- **num1, ...,\
    \ numN**: 代表 Unicode 值的数字序列。允许的范围在 0 到 65535（即 0xFFFF）之间，大于 0xFFFF 的数字将被截断。\n\n\
    #### 返回值\n一个包含与传递给函数的 Unicode 值相对应的字符的字符串。\n\n#### 描述\n此函数返回一个原始文本字符串，而不是返回一个\
    \ String 对象。\n\n由于 `fromCharCode` 函数是 String 对象的静态方法，你应当始终将其用作 `String.fromCharCode()`，因为你不能将其作为\
    \ String 对象的一部分来使用。\n\n#### 示例\n以下示例展示了 `fromCharCode()` 函数的使用：\n\n```javascript\n\
    String.fromCharCode (65, 66, 67); // \"ABC\"\nString.fromCharCode (0x2014); //\
    \ \"—\"\nString.fromCharCode (0x12014); // \"—\" 字符 1 将被忽略\n```\n\n#### 处理超过最大值的数值\n\
    Unicode 值通常由 16 位字符表示（正如 JavaScript 起草过程中的预期）。我们可以使用 `fromCharCode()` 函数从大多数值（UCS-2\
    \ 值，它们是 UTF-16 的子集——最常见的字符所在范围）中重建单个字符。\n\n对于所有有效的 Unicode 值（最高 21 位），仅使用 `fromCharCode()`\
