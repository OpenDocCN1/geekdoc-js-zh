    \ item is higher than the money available, I report the situation and send the\
    \ browser to the page where your shopping cart is displayed.\n\n## Conditional\
    \ expressions\n\nThe expression to evaluate is always placed in parentheses and\
    \ is made up of variables that are combined with each other using conditional\
    \ operators. We recall that conditional operators related two variables and always\
    \ returned a boolean result. For example, a conditional operator is the operator\
    \ \"is equal\" (==), which returns true if the two operands are the same or false\
    \ if they are different.\n\n```\nif (age > 18)\n    document.write(\"you can see\
    \ this page for adults\")\n```\n\nIn this example we use the conditional operator\
    \ \"is greater\" (>). In this case, it returns true if the variable age is greater\
    \ than 18, so the following line would be executed, informing us that the adult\
    \ content can be seen.\n\nConditional expressions can be combined with logical\
    \ expressions to create more complex expressions. We remember that logical expressions\
    \ are those that have Booleans as operands and that return another Boolean value.\
    \ They are the logical negation, logical AND, and logical OR operators.\n\n```\n\
    if (battery < 0.5 && redElectrica == 0)\n    document.write(\"your laptop will\
    \ shutdown in seconds\")\n```\n\nWhat we do is check if the battery of our supposed\
    \ computer is less than 0.5 (it is almost finished) and we also check if the computer\
    \ has no electrical network (it is unplugged). Then the logical operator matches\
    \ them to a Y, so if it is almost without battery AND without power, it reports\
    \ that the computer is going to shut down.\n\nNote: The list of operators that\
    \ can be used with IF structures can be seen in the chapter on conditional operators\
    \ and logical operators.\n\nThe if structure is one of the most used in programming\
    \ languages, to make decisions based on the evaluation of a sentence. In the previous\
    \ article in the Javascript Manual we already started to explain the if structure\
    \ and now we are going to see some more advanced uses.\n\n## Nested IF statements\n\
    \nTo make conditional structures more complex we can nest IF statements, that\
    \ is, put IF structures inside other IF structures. With a single IF we can evaluate\
    \ and perform one action or another according to two possibilities, but if we\
    \ have more possibilities to evaluate we must nest IFs to create the necessary\
    \ code flow to decide correctly.\n\nFor example, if I want to check if one number\
    \ is less than or equal to another, I have to evaluate three different possibilities.\
    \ First I can check if the two numbers are equal, if they are, I have already\
    \ solved the problem, but if they are not equal I will still have to see which\
    \ of the two is greater. Let's look at this example in Javascript code.\n\n```\n\
    var number1 = 23\nvar number2 = 63\nif (number1 == number2) {\n    document.write\
    \ (\"The two numbers are the same\")\n} else {\n    if (number1 > number2) {\n\
    \        document.write (\"The first number is greater than the second\")\n  \
    \  } else {\n        document.write (\"The first number is less than the second\"\
    )\n    }\n}\n```\n\nThe flow of the program is as we mentioned before, first it\
    \ is evaluated if the two numbers are equal. If positive, a message is displayed\
    \ informing you of this. Otherwise we already know that they are different, but\
    \ we still have to find out which of the two is greater. For this, another comparison\
    \ is made to find out if the first is greater than the second. If this comparison\
    \ gives positive results, we display a message saying that the first is greater\
    \ than the second, otherwise we will indicate that the first is less than the\
    \ second.\n\nWe note again that the keys are optional in this case, since only\
    \ one statement is executed for each case. In addition, line breaks and indents\
    \ are also optional in any case and serve to see the code in a more orderly way.\
    \ Keeping the code well structured and written in an understandable way is very\
    \ important, since it will make life more pleasant when programming and later\
    \ when we have to review the programs.\n\nNote: In this manual I will use a notation\
    \ like the one you have seen in the previous lines. Also, I will keep that notation\
    \ at all times. This will undoubtedly make the codes with examples easier to understand,\
    \ if we did not do so it would be a real nuisance to read them. This same recipe\
    \ is applicable to the codes that you have to create and the main beneficiary\
    \ will be yourself and the colleagues who get to read your code.\n\n## IF operator\n\
    \nThere is an operator that we haven't seen yet and it's a more schematic way\
    \ of doing some simple IFs. It comes from the C language, where very few lines\
    \ of code are written and where the less we write the more elegant we will be.\
    \ This operator is a clear example of saving lines and characters when writing\
    \ scripts. We will see it quickly, because the only reason I include it is so\
    \ that you know that it exists and if you find it on some occasion out there you\
    \ can identify it and how it works.\n\nAn example of using the IF operator can\
    \ be seen below.\n\n**Variable = (condition)? value1: value2**\n\nThis example\
    \ not only performs a value comparison, it also assigns a value to a variable.\
    \ What it does is evaluate the condition (placed in parentheses) and if it is\
    \ positive, it assigns the value1 to the variable and otherwise it assigns it\
    \ the value2. Let's see an example:\n\n**moment = (current_time < 12)? \"Before\
    \ noon\": \"After noon\"**\n\nThis example looks to see if the current time is\
    \ less than 12. If so, it is now before noon, so assign \"Before Noon\" to the\
    \ variable time. If the hour is greater than or equal to 12, it is already after\
    \ noon, so the text \"After noon\" is assigned to the moment variable."
  mdcn: "\n另一个显而易见细节是在正例和反例要执行的指令块中，我们放置了缩进（页边距）。这种缩进完全是可选的，我们这样做只是为了让 IF 结构在视觉上更容易被理解。换行同样不是必须的，也是为了让结构看起来更清晰。我们完全可以将整个\
    \ IF 语句写在同一行代码中，但这无助于让事情变得清晰。\n\n注意：我们以及任何在编程领域有一定经验的人，都会建议使用必要的缩进和换行，以便指令能被更好地理解。也许在你编写代码的那天，你很清楚自己做了什么以及为什么要这样做，但一个月后，当你不得不重新阅读这段代码时，你对脚本内容的记忆可能会模糊，那时你会感激一个友好的格式，因为它能让人们轻松阅读。如果你在团队中工作，这些建议将更加重要，因为阅读他人编写的源代码会更加困难。\n\
    \n让我们来看看一些 IF 条件语句的示例。\n\n```\nif (dia == \"monday\")\n    document.write (\"\
    Have a happy start to the week\")\n```\n\n如果是周一，你将祝我们这一周愉快。除此之外，它不会执行任何操作。由于在这个例子中我们只为正例指定了一条指令，因此不需要使用花括号（尽管建议加上）。另外请注意，条件运算符由两个等号组成。\n\
    \n现在让我们看另一个稍微长一点的例子。\n\n```\nif (credit >= price) {\n    document.write (\"you\
    \ have bought the article\" + new article) // show purchase\n    cart += newArticle\
    \ // insert the item in the shopping cart\n    credit -= price // I decrease the\
    \ credit according to the price of the item\n} else {\n    document.write(\"you\
    \ have run out of credit\") // I report that you are short of money\n    window.location\
    \ = \"shoppingcart.html\" // I go to the cart page\n}\n```\n\n这个例子稍微复杂一些，也带有一定的虚构成分。我所做的是检查我是否有足够的额度来完成一次所谓的购买。为此，我查看额度是否大于或等于商品的价格，如果是，我将通知购买成功，将商品放入购物车，并从累计额度中扣除价格。如果商品价格高于可用资金，我将报告这种情况，并将浏览器重定向到显示购物车的页面。\n\
    \n## 条件表达式\n\n待评估的表达式总是放在圆括号中，由通过条件运算符相互组合的变量组成。我们回顾一下，条件运算符关联两个变量并始终返回一个布尔结果。例如，条件运算符中的“等于”运算符\
    \ (==)，如果两个操作数相同则返回 true，如果不同则返回 false。\n\n```\nif (age > 18)\n    document.write(\"\
    you can see this page for adults\")\n```\n\n在这个例子中，我们使用了条件运算符“大于” (>)。在这种情况下，如果变量\
    \ age 大于 18，它将返回 true，因此将执行下一行代码，告知我们可以看到成人内容。\n\n条件表达式可以与逻辑表达式相结合，以创建更复杂的表达式。我们要记得，逻辑表达式是以布尔值为操作数并返回另一个布尔值的表达式。它们包括逻辑非、逻辑与（AND）和逻辑或（OR）运算符。\n\
    \n```\nif (battery < 0.5 && redElectrica == 0)\n    document.write(\"your laptop\
    \ will shutdown in seconds\")\n```\n\n我们所做的是检查假设的计算机电池电量是否低于 0.5（几乎耗尽），并且我们还检查计算机是否没有连接电源（未插电）。然后逻辑运算符将它们与“与”相匹配，所以如果电池几乎耗尽**且**没有电源，它就会报告计算机即将关机。\n\
    \n注意：可用于 IF 结构的运算符列表可以在关于条件运算符和逻辑运算符的章节中查看。\n\nif 结构是编程语言中使用最广泛的结构之一，用于根据句子的评估结果做出决定。在《Javascript\
    \ 手册》的前一篇文章中，我们已经开始解释 if 结构，现在我们将探讨一些更高级的用法。\n\n## 嵌套 IF 语句\n\n为了使条件结构更复杂，我们可以嵌套\
    \ IF 语句，也就是说，将 IF 结构放在其他 IF 结构内部。通过单个 IF，我们可以根据两种可能性评估并执行某项操作，但如果我们有更多需要评估的可能性，就必须嵌套\
    \ IF 来创建必要的代码流以做出正确决定。\n\n例如，如果我想检查一个数字是否小于或等于另一个数字，我必须评估三种不同的可能性。首先，我可以检查两个数字是否相等，如果相等，问题就解决了；但如果它们不相等，我仍然需要查看两者中哪个更大。让我们在\
    \ Javascript 代码中看看这个例子。\n\n```\nvar number1 = 23\nvar number2 = 63\nif (number1\
    \ == number2) {\n    document.write (\"The two numbers are the same\")\n} else\
    \ {\n    if (number1 > number2) {\n        document.write (\"The first number\
    \ is greater than the second\")\n    } else {\n        document.write (\"The first\
    \ number is less than the second\")\n    }\n}\n```\n\n程序的流程正如我们之前提到的，首先评估两个数字是否相等。如果是，则显示一条告知此信息的提示。否则，我们已经知道它们不同，但仍需找出其中哪个更大。为此，进行另一次比较以确定第一个是否大于第二个。如果这次比较结果为正，我们显示一条信息说第一个大于第二个，否则我们将指出第一个小于第二个。\n\
    \n我们再次注意到，在这种情况下花括号是可选的，因为每种情况仅执行一条语句。此外，换行和缩进在任何情况下也都是可选的，其作用是让代码看起来更有序。保持代码结构良好且以易于理解的方式编写非常重要，因为这会让我们在编程时以及之后审查程序时感到更加愉快。\n\
    \n注意：在本手册中，我将使用像前几行看到的那种记法。此外，我将始终保持该记法。这无疑会使示例代码更容易理解，否则阅读起来将非常令人厌烦。同样的方案也适用于你要创建的代码，而主要受益者将是你自己以及阅读你代码的同事。\n\
    \n## IF 运算符（三元运算符）\n\n还有一个我们尚未见过的运算符，它是一种实现简单 IF 语句的更简练的方式。它源自 C 语言，在那里代码行数极少，写得越少就越优雅。这个运算符是编写脚本时节省行数和字符的典型例子。我们会快速浏览一下，因为我将其包含在内的唯一原因是让你知道它的存在，这样如果你在某个地方遇到它，你可以识别它以及它是如何工作的。\n\
    \n下面可以看到使用 IF 运算符的示例。\n\n**Variable = (condition)? value1: value2**\n\n这个示例不仅执行了值比较，还将一个值分配给变量。它所做的是评估条件（放在圆括号中），如果结果为正，则将\
    \ value1 分配给变量，否则将其分配为 value2。让我们看一个例子：\n\n**moment = (current_time < 12)? \"\
    Before noon\": \"After noon\"**\n\n这个例子旨在查看当前时间是否小于 12。如果是，那么现在是中午之前，因此将 \"Before\
    \ noon\" 分配给变量 time。如果小时数大于或等于 12，那么已经是中午之后，因此将文本 \"After noon\" 分配给 moment 变量。\n"
