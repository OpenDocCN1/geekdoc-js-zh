    例如，`alert()` 函数与 `Alert()` 函数不同。前者在对话框中显示文本，而后者（首字母大写 A）根本不存在，除非我们自行定义它。如你所见，为了让
    Javascript 识别该函数，你必须全部使用小写。当我们处理变量时，会看到另一个明显的例子，因为我们给变量起的名称同样区分大小写。


    作为一个通用规则，Javascript 中的命名通常采用小写，除非使用了包含多个单词的名称，在这种情况下，第一个单词之后的每个单词的首字母都要大写。例如 `document.bgColor`（这是保存网页背景颜色的地方），它使用了大写
    "C"，因为它是第二个单词的首字母。在某些情况下，你也可以在第一个单词的首字母使用大写，例如类的名称，不过我们稍后会看到这些具体情况以及什么是类。


    ### 指令的分隔


    我们的脚本中所包含的不同指令必须妥善分隔，以免浏览器提示相应的语法错误。Javascript 有两种分隔指令的方式：第一种是通过分号 (;) 字符，第二种是通过换行。


    因此，除非我们在同一行放置两条指令，否则 Javascript 语句不需要以分号结尾。


    无论如何，养成在每条指令后使用分号的习惯并不是个坏主意，因为 Java 或 C 等其他语言强制要求使用，这样我们将习惯于使用一种与高级编程环境更相似的语法。


    ## Javascript 中的变量


    这是我们在 Javascript 手册中专门讨论 Javascript 变量的第一篇文章。我们将看到（如果还不知道的话），无论是在 Javascript 还是在大多数现有编程语言中，变量都是编写程序时的基本元素之一。


    那么，让我们先从了解变量的概念开始，学习如何在 Javascript 中声明变量，并详细解释它们在语言中的用途。


    ### 变量概念


    变量是内存中的一个空间，用于存储数据；在这个空间里，我们可以存储执行程序操作所需的任何类型的信息。我们可以将其想象成一个盒子，用来存储数据。这个盒子有一个名称，以便我们以后可以引用该变量，检索数据以及在需要时为变量赋值。


    例如，如果我们的程序执行加法运算，将参与运算的不同加数以及求和结果存储在变量中是非常常见的。效果如下所示：


    ```

    adding1 = 23

    adding2 = 33

    sum = adding1 + adding2

    ```


    在这个例子中，我们有三个变量：adding1、adding2 和 sum（用于保存结果）。我们可以看到，对我们而言，使用变量就像拥有一个保存数据的部分，只需输入其名称即可访问。


    ### Javascript 变量命名规则


    变量名必须由字母数字字符（数字和字母）、下划线 (_) 和美元符号 $ 组成。除此之外，构建变量名还有一些额外规则。最重要的一点是，变量名不能以数字字符开头。我们不能使用罕见字符，如
    + 号、空格或 - 号。支持的变量名可以是：


    - Age

    - country_of_birth

    - _Name

    - $element

    - Other$_Names


    我们还必须避免使用保留字作为变量名，例如，我们不能将变量命名为 `return` 或 `for` 等词汇，因为我们将看到这些词用于语言自身的结构。现在来看一些不允许使用的变量名：


    - 12months

    - your name

    - return

    - for

    - more or less

    - pe%pe


    ### Javascript 变量名区分大小写


    请记住，Javascript 是一门区分大小写的语言，因此变量也受此区分的影响。因此，名为 "myname" 的变量与变量 "myName" 不同。"Age"
    与 "age" 也不相同。


    请记住这个细节，因为它是代码中常见的错误来源，有时难以检测。这是因为有时你认为自己在调用一个应该包含某些数据的变量，但如果你在书写时出错，在不该大写的地方使用了大写（或反之），那么它就变成了另一个不同的变量，其中不包含预期的数据。由于
    Javascript 不强制要求声明变量，程序将运行而不会产生错误，然而，执行结果将不会产生预期的效果。


    ### Javascript 变量的声明


    声明变量是指定义并顺便通知系统你将要使用一个变量。在编程语言中，明确指定程序中要使用的变量是一种通用习惯。在许多编程语言中，声明变量有严格的规则，但事实上，Javascript
    相当宽松。


    Javascript 忽略了许多规则，在编程时是一种较为自由的语言，其中一个给予自由的情况就是声明变量，因为我们没有义务这样做，这与 Java、C、C# 等许多其他编程语言的情况相反。


    ### 使用 var 声明变量


    Javascript 拥有 "var" 关键字，当我们想要声明一个或多个变量时会使用它。不出所料，该词用于在变量使用前对其进行定义。


    注意：虽然 Javascript 不强制我们显式声明变量，但建议在变量使用前进行声明，从现在起我们将看到这同样是一个好习惯。此外，在随后的文章中我们将看到，在某些特殊情况下，声明了变量的脚本和未声明变量的脚本产生的结果并不完全相同，因为声明会影响变量的作用域。


    ```

    var operand1

    var operand2

    ```


    你也可以在声明变量的同时为其赋值：


    ```

    var operand1 = 23

    var operand2 = 33

    ```


    同样允许在同一行声明多个变量，前提是用逗号分隔。


    ```

    var operand1, operand2

    ```

    '
