  md: '# Creation of javascript arrays


    The first step in using an array is to create it. For this we use a Javascript
    object already implemented in the browser. We will now see a topic to explain
    what object orientation is, although it will not be necessary to understand the
    use of arrays. This is the statement to create an array object:


    ```

    var myArray = new Array ()

    ```


    This creates an array on the page that is running. The array is created without
    any content, that is, it will not have any boxes or compartments created. We can
    also create the Javascript array specifying the number of compartments it will
    have.


    ```

    var myArray = new Array (10)

    ```


    In this case, we indicate that the array will have 10 positions, that is, 10 boxes
    where to save data.


    It is important to note that the word Array in Javascript code is written with
    the first letter capitalized. As in uppercase and lowercase javascript if they
    matter, if we write it in lowercase it will not work.


    Whether or not the number of boxes in the javascript array is indicated, we can
    enter any data in the array. If the box is created it is simply entered and if
    the box was not created it is created and then the data is entered, so the final
    result is the same. This checkbox creation is dynamic and occurs at the same time
    that the scripts are executed. Let''s see below how to enter values in our arrays.


    ```

    myArray [0] = 290

    myArray [1] = 97

    myArray [2] = 127

    ```'
