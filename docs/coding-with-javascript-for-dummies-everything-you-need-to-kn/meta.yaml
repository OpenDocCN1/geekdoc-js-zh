- img_proc: true
  md: "# Running javascript in response to an event\n\nIt is the other way to run\
    \ scripts, but before we see it we must talk about events. Events are actions\
    \ performed by the user. Programs like Javascript are prepared to catch certain\
    \ actions performed, in this case on the page, and perform actions in response.\
    \ In this way, interactive programs can be carried out, since we control the movements\
    \ of the user and respond to them. There are many different types of events, for\
    \ example, the push of a button, the movement of the mouse, or the selection of\
    \ text on the page.\n\nThe actions that we want to perform in response to an event\
    \ can be indicated in many different ways, for example within the same HTML code,\
    \ in attributes that are placed inside the tag that we want to respond to the\
    \ user's actions. In the chapter where we saw a quick example we already verified\
    \ that if we wanted a button to perform actions when it was clicked, we had to\
    \ indicate them within the onclick attribute of the button.\n\nWe therefore check\
    \ that Javascript code can be inserted into certain attributes of HTML tags. However,\
    \ it is not the only possible method. We can also select page elements directly\
    \ with Javascript and associate functions that will be executed in response to\
    \ events. Although it is a bit early so that you can understand this whole process\
    \ in detail, we are going to see a simple example.\n\n```\n<! DOCTYPE html>\n\
    <html lang = \"is\">\n<head>\n  <meta charset = \"UTF-8\">\n  <meta name = \"\
    viewport\" content = \"width = device-width, initial-scale = 1.0\">\n  <meta http-equiv\
    \ = \"X-UA-Compatible\" content = \"ie = edge\">\n  <title> Example hover over\
    \ </title>\n</head>\n<body>\n```"
  merge: -1
  pgno: 61
- img_proc: true
  md: "```\n<h1> Javascript Example </h1>\n<span id = \"honeydew\"> Mouse over here\
    \ </span>\n<script>\nvar passes = 0;\nfunction announcePast () {\n    passes =\
    \ passes + 1;\n    alert ('Mouse over' + passes + 'times');\n}\ndocument.getElementById\
    \ ('my element'). addEventListener ('mouseenter', announcePast);\n</script>\n\
    </body>\n</html>\n```\n\nThis time you have the code for an entire page. In it\
    \ you can find the Javascript code embedded inside the body of the page. Unlike\
    \ the previous code, when the browser reads the page it doesn't execute anything.\
    \ It simply memorizes the script and associates the function with the element\
    \ that has been defined. Specifically, we have defined an event of type \"mouseenter\"\
    \ on an element of the page that has an identifier \"my element\". This means\
    \ that each time the user places the mouse pointer over the element \"my element\"\
    , it will execute the function \"announcePasses\".\n\nAs we say, perhaps it is\
    \ a little early to see examples of this style, so do not worry if you have not\
    \ understood everything. We are just starting the Javascript manual and you will\
    \ be able to learn all this and much more little by little. So, We will see later\
    \ this type of in-depth execution and the types of events that exist. To get there\
    \ we still have to learn many other things from Javascript. In the next article\
    \ we will show how we can hide the Javascript code for old browsers."
  merge: -1
