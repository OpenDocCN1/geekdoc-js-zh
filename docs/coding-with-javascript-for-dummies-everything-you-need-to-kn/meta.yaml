  md: '# Upper case and lower case


    In Javascript uppercase and lowercase letters must be respected. If we make a
    mistake when using them, the browser will respond with an error message, either
    syntax or indefinite reference.


    For example, the alert () function is not the same as the Alert () function. The
    first displays text in a dialog box, and the second (with the first capital A)
    simply does not exist, unless we define it ourselves. As you can see, for the
    function to recognize Javascript, you have to write all lowercase. We will see
    another clear example when we deal with variables, since the names we give to
    the variables are also case sensitive.


    As a general rule, the names of things in Javascript are always written in lowercase,
    unless a name with more than one word is used, since in this case the initials
    of the words following the first will be capitalized. For example document.bgColor
    (which is a place where the background color of the web page is saved), it is
    written with the capital "C", as it is the first letter of the second word. You
    can also use capital letters in the initials of the first words in some cases,
    such as the names of the classes, although we will see later what these cases
    are and what the classes are.'
  merge: -1
