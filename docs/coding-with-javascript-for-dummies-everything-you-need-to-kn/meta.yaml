    \nMemlnc.com\n\n## 引言\n\n- [JavaScript 无处不在](#)\n- [Web 中的 JavaScript](#)\n  -\
    \ [网站](#)\n  - [单页应用](#)\n  - [Web 开发中的库、框架与“原生 JavaScript”](#)\n  - [HTML5 APIs](#)\n\
    \  - [Web 组件](#)\n- [后端中的 JavaScript](#)\n- [JavaScript 作为设备应用语言](#)\n- [JavaScript\
    \ 作为桌面应用语言](#)\n- [JavaScript 作为第一门语言](#)\n  - [易于使用](#)\n  - [应用领域广泛](#)\n  -\
    \ [它是一种开放的、标准化的 Web 语言](#)\n  - [多种职业从 JavaScript 开始](#)\n    - [前端开发者：](#)\n\
    \    - [后端开发者](#)\n    - [全栈开发者](#)\n- [如何学习 JavaScript](#)\n  - [学习 JavaScript\
    \ 本身，而非其衍生品](#)\n  - [了解 Web 平台](#)\n- [Java 与 JavaScript 的区别](#)\n- [开放语言 / 专有语言](#)\n\
    - [开始之前](#)\n- [JavaScript 的用途](#)\n\n## 使用 JavaScript 需要什么\n\n建议的先修知识\n\n## 第一章\n\
    \nJAVASCRIPT 语言版本\n\nJAVASCRIPT 的演进\n\nECMASCRIPT 标准\n\nHTML 5 APIs\n\n语言版本\n\n\
    关于 JavaScript 版本与兼容性的结论\n\n## 第二章\n\n打开子窗口\n\n欢迎信息\n\n当前日期\n\n返回按钮\n\nJAVASCRIPT\
    \ 语言\n\nJAVASCRIPT 写入 HTML 文档\n\n脚本的放置位置确实重要\n\n编写 JAVASCRIPT 脚本的方式\n\n直接执行 JAVASCRIPT\
    \ 代码\n\n响应事件运行 JAVASCRIPT\n\n在旧浏览器中隐藏 JAVASCRIPT 脚本\n\n使用 HTML 注释隐藏 JAVASCRIPT\
    \ 代码\n\n使用 <NOSCRIPT> 为旧浏览器显示消息\n\n更多关于脚本的内容\n\n放置 JAVASCRIPT 脚本的有趣方法\n\n指明我们使用的语言\n\
    \n包含外部 JAVASCRIPT 文件\n\n使用外部 JAVASCRIPT 代码文件的重要性\n\n## 第三章\n\n### JAVASCRIPT 语法\n\
    \n- 代码中的注释\n- 大写与小写\n- 语句分隔\n- Javascript 中的变量\n- 变量概念\n- Javascript 变量命名规则\n\
    - Javascript 变量名区分大小写\n- Javascript 中的变量声明\n- 使用 var 声明变量\n- 使用 let 和 const 声明\
    \ Javascript 变量\n- Javascript 中的变量作用域\n- 变量作用域概念\n- 全局变量\n- 局部变量\n- 使用 var 声明变量与不声明变量的区别\n\
    - 使用 let 声明变量\n- 变量中可以保存什么\n- Javascript 中的数据类型\n- 数值数据类型\n- 布尔类型\n- 字符串数据类型\n\
    - 文本字符串中的转义字符\n\n## 第四章\n\n### JAVASCRIPT 运算符\n\n- 使用运算符的示例\n- 算术运算符\n- 赋值运算符\n\
    - 示例\n- 链式运算符\n- 逻辑运算符\n- 条件运算符\n- 位级运算符\n- 运算符优先级\n- 用于类型控制的 JAVASCRIPT typeof\
    \ 运算符\n- typeof 使用建议\n- JAVASCRIPT 控制结构\n- 条件判断\n- JAVASCRIPT 中的 IF 结构\n- 条件表达式\n\
    - 嵌套 IF 语句\n- IF 运算符\n- JAVASCRIPT SWITCH 结构\n- JAVASCRIPT 中的 FOR 循环\n- FOR 循环练习示例\n\
    - WHILE 和 DO WHILE 循环\n- WHILE 循环\n- DO ... WHILE 循环\n- WHILE 循环使用示例\n- BREAK\
    \ 和 CONTINUE\n- BREAK\n- CONTINUE\n- BREAK 语句的补充示例\n- JAVASCRIPT 中的嵌套循环\n- JAVASCRIPT\
    \ 函数\n- 什么是函数\n- 如何编写函数\n- 如何调用函数\n\n# Javascript 函数放在哪里\n\n# 函数参数\n\n# 参数\n\n\
    # 多个参数\n\n# 参数按值传递\n\n# Javascript 函数中的返回值\n\n# 函数中返回值\n\n# 多重返回\n\n# 函数中变量的作用域\n\
    \n# Javascript 函数库\n\n# Eval 函数\n\n# ParseInt 函数\n\n# Javascript 中的数组\n\n# Javascript\
    \ 数组的创建\n\n# 数组中的数据类型\n\n# 数组声明与摘要初始化\n\n# 数组长度\n\n# Javascript 中的多维数组\n\n# 数组初始化\n\
    \n# Javascript 对象概览\n\n# 什么是对象\n\n# 如何访问对象属性和方法\n\n# 如何创建对象\n\n# 从函数创建并实例化对象\n\
    \n# • Object.freeze\n\n# 冻结对象\n\n# 冻结矩阵\n\n# 深度冻结\n\n# Javascript 中的 Undefined\n\
    \n# Javascript 中的 Null\n\n# 字符串处理\n\n# 字符转义\n\n# 长文本字符串\n\n# 访问字符\n\n# 比较文本字符串\n\
    \n- String.fromCharCode\n\n# 处理超出最大值的值\n\n- String.fromCodePoint\n\n# String.raw\
    \ ()\n\n# 引言\n\n入门很容易，但如果你想表达语言的所有可能性，还有很长的路要走。Javascript 是 Web 的标准语言之一，因此非常适合许多计划投身于此领域的专业人士。但即使你不想专门为\
    \ Web 开发，Javascript 也是制作移动应用或桌面应用的绝佳选择。\n\n也许并非所有开发者都需要达到 Javascript 的高级水平，但基础知识无疑在其职业生涯的许多阶段都大有裨益。无论如何，一旦学习完成，无限的机遇将触手可及。\n\
    \n我们将首先探讨 Javascript 的现状（2017年）以及 Javascript 为何值得普遍使用。然后我们将专注于解释如何学习 Javascript\
    \ 并达到我们设定的任何水平。\n\n# Javascript 无处不在\n\nJavascript 已成为一门理想的语言，因为它应用广泛且多样，同时还为初学者提供了简便性。要运行它，我们只需要一个浏览器，尽管目前\
    \ Javascript 已经超越了 Web 客户端的范围，几乎无处不在。\n\n# Web 中的 JavaScript\n\nJavaScript 首次出现的环境是\
    \ Web。其执行范围集中在一个网页内，允许开发者提供交互性、操作文档或浏览器窗口、执行计算等。网景导航者（Netscape Navigator），一个如今已消失的浏览器，有幸引入了\
    \ JavaScript 这门语言，尽管如今它已被用户浏览的所有 Web 客户端所支持。\n\n在浏览器环境中为 Web 使用 JavaScript，也被称为客户端编程。如今它仍然是\
    \ JavaScript 执行最常见的环境，但它真的只是众多可能性中的一个而已。\n\n# 后端中的 JavaScript\n\n某些开发者想到，他们可以将\
    \ JavaScript 运行时（之前仅在浏览器范围内可用）提取出来，用于 Web 客户端之外的任何其他目的。NodeJS 就此诞生，它不过是浏览器之外的\
    \ JavaScript。\n\n通过 NodeJS，我们可以使用 JavaScript 编程，开发直接运行在操作系统上并能解决任何类型问题的应用程序。借助这项技术，JavaScript\
    \ 成为了一种通用编程语言。\n\nNodeJS 最常见的用途之一是后端编程。它允许你编写能够在服务器上运行的应用程序，提供对数据库、文件系统以及任何其他服务器端资源的访问。然而，NodeJS\
    \ 功能非常全面，可用于许多其他任务，例如自动化、优化或应用部署等操作。\n"
