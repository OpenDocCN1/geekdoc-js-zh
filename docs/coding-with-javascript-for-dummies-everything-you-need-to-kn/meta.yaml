- md: " # Back button\n\nAnother quick example can be seen below. It is a button to\
    \ go back, like the one we have in the toolbar of the browser. Now we will see\
    \ a line of code that mixes HTML and Javascript to create this button that shows\
    \ the previous page in the history, if any.\n\n```\n<input type=\"button\" value=\"\
    Back\" onclick=\"history.go(-1)\">\n```\n\nThe button would be similar to the\
