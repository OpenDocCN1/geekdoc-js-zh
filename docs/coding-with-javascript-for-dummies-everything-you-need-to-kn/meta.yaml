  md: '# How to learn Javascript


    Learning Javascript at an advanced level takes months of study, but getting started
    is easy and in no time you will be able to do amazing things with little effort.
    In the Javascript manual you will be able to know the language, but to start we
    want to give you a couple of tips.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# # Learn Javascript and not a derivative


    Our first tip if you are just starting out is to learn Javascript and not a library
    or framework. In the end, all the projects on the web use Javascript and everything
    you can do with a library or framework can also be done with Javascript, so the
    correct thing to do is to start by mastering the language, and then set new objectives
    in the medium or long term.


    **In short, don''t learn jQuery**: learn Javascript. Do not learn Angular: learn
    Javascript, do not learn React: learn Javascript ... With a solid base of Javascript
    it will be much easier for you to learn later any library or framework on which
    you want to base. Also, you will not have problems in the future, when you want
    to do things for which that library is not intended or you want to customize any
    detail of your application.


    What should accompany the knowledge and use of Javascript are your skills in everything
    that the browser (the web platform) offers you by default: HTML5 and Web Components.
    Everything you do based on Javascript "Vanilla", HTML5 and Web Components you
    have the certainty that it can be used in any project where you can get to work,
    regardless of the library or framework that is being used in each case.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# # Knowledge of the web platform


    Our second advice is that, if you are going to work in this medium, you must bear
    in mind each of the peculiarities of the web platform. There is a lot of general
    knowledge that you need to acquire that will give you a foundation on which to
    build your skills in the world of web development.


    **Knowledge of the medium:** You must know what the Internet is, the Web, the
    HTTP protocol, the domain name system and of course the fundamental languages
    to specify the content and form: HTML and CSS.


    **Design knowledge:** Although your profile may be more of a programmer, it is
    ideal to have a vision, at least technical, of the design characteristics for
