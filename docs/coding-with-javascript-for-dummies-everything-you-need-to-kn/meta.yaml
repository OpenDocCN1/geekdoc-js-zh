- md: "## Parameters\n\nParameters are used to send values to functions. A function\
    \ will work with the parameters to perform the actions. To put it another way,\
    \ parameters are the input values that a function receives.\n\nTo give an example\
    \ easy to understand, a function that performs a sum of two numbers would have\
    \ those two numbers as parameters. The two numbers are the input, as well as the\
    \ output would be the result of the sum, but we will see that later.\n\nLet's\
    \ look at a previous example in which we created a function to display a welcome\
    \ message on the web page, but now we are going to pass a parameter that will\
    \ contain the name of the person to be greeted.\n\n```\nfunction writeWelcome(name)\
    \ {\n    document.write(\"<H1> Hello\" + name + \"</H1>\")\n}\n```\n\nAs we can\
    \ see in the example, to define a parameter in the function we have to put the\
    \ name of the variable that is going to store the data that we pass to it. That\
    \ variable, which in this case is called name, will have as value the data that\
    \ we pass to the function when we call it. In addition, the variable where we\
    \ receive the parameter will have life during the execution of the function and\
    \ will cease to exist when the function finishes its execution.\n\nTo call a function\
    \ that has parameters, place the value of the parameter in parentheses. To call\
    \ the example function you would have to write:\n\n```\nwriteWelcome(\"Alberto\
    \ García\")\n```\n\nWhen calling the function like this, the name parameter takes\
    \ the value \"Alberto García\" and when writing the greeting on the screen it\
    \ will write \"Hello Alberto García\" between <H1> tags.\n\nThe parameters can\
    \ receive any type of data, numeric, textual, boolean or an object. We do not\
    \ really specify the type of the parameter, so we must take special care when\
    \ defining the actions we perform within the function and passing values to it,\
    \ to ensure that everything is consistent with the types of data that we expect\
    \ our variables or parameters to have.\n\n## Multiple parameters\n\nA function\
    \ can receive as many parameters as we want and to express it the names of the\
    \ parameters are separated by commas, inside the parentheses. Let's quickly see\
    \ the syntax for the function from before, but made so that it receives two parameters,\
    \ the first the name to greet and the second the color of the text.\n\n```\nfunction\
    \ writeWelcome(name, colorText) {\n    document.write(\"<FONT color = '\" + colorText\
    \ + \"'>\")\n    document.write(\"<H1> Hello\" + name + \"</H1>\")\n    document.write(\"\
    </FONT>\")\n}\n```\n\nWe would call the function with this syntax. Between the\
    \ brackets we will place the values of the parameters.\n\n```\nvar myName = \"\
    Pepe\"\nvar myColor = \"red\"\nwriteWelcome(myName, myColor)\n```\n\nI have placed\
    \ two variables in parentheses instead of two quoted texts. When we put variables\
    \ between the parameters what we are actually passing to the function are the\
    \ values that the variables contain and not the variables themselves.\n\n## Parameters\
    \ are passed by value\n\nIn line with the use of parameters in our Javascript\
    \ programs, we have to know that the parameters of the functions are passed by\
    \ value. This means that we are passing values and not variables. In practice,\
    \ even if we modify a parameter in a function, the original variable that we had\
    \ passed will not change its value. It can be easily seen with an example.\n\n\
    ```\nfunction stepValue(myParameter) {\n    myParameter = 32\n    document.write(\"\
    I have changed the value to 32\")\n}\n\nvar myVariable = 5\nstepValue(myVariable)\n\
    document.write(\"the value of the variable is:\" + myVariable)\n```\n\nIn the\
    \ example we have a function that receives a parameter and modifies the value\
    \ of the parameter assigning it the value 32. We also have a variable, which we\
    \ initialize to 5 and later we call the function passing this variable as a parameter.\
    \ As within the function we modify the value of the parameter, it could happen\
    \ that the original variable changes its value, but since the parameters do not\
    \ modify the original value of the variables, it does not change its value.\n\n\
    In this way, once the function is executed, when printing the value of myVariable\
    \ on screen, the number 5 will be printed, which is the original value of the\
    \ variable, instead of 32, which was the value with which we had updated the parameter.\n\
    \nIn Javascript you can only pass variables by value.\n\n## Return values in Javascript\
    \ functions\n\nWe are learning about the use of functions in Javascript and at\
    \ the moment we may have already realized the great importance they have in making\
    \ programs more or less advanced. In this article of the Javascript Manual we\
    \ will continue learning things about functions and specifically that with them\
    \ you can also return values. In addition, we will see some interesting use case\
    \ on the functions that can clarify a bit the scope of local and global variables.\n\
    \n## Returning values in functions\n\nJavascript functions can also return values.\
    \ In fact, this is one of the most essential utilities of the functions, which\
    \ we must know, not only in Javascript but in general in any programming language.\
    \ So, by invoking a function, you can perform actions and offer a value as output.\n\
    \nFor example, a function that calculates the square of a number will have that\
    \ number as input and as the output it will have the value resulting from finding\
    \ the square of that number. The data entry in the functions we saw earlier in\
    \ the article on function parameters. Now we have to learn about the exit.\n\n\
    Let's look at an example of a function that calculates the mean of two numbers.\
    \ The function will receive both numbers and return the value of the mean.\n\n\
    ```\nfunction media(value1, value2) {\n    var result\n    result = (value1 +\
    \ value2) / 2\n    return result\n}\n```\n\nTo specify the value that the function\
    \ will return, the word return is used, followed by the value that you want to\
    \ return. In this case, the content of the result variable is returned, which\
    \ contains the calculated mean of the two numbers.\n\nWe may now ask ourselves\
    \ how to receive a data returned by a function. Actually, in the source code of\
    \ our programs we can invoke the functions in the place that we want. When a function\
    \ returns a value, the function call is simply replaced by that value it returns.\
    \ So, to store a return value of a function, we have to assign the call to that\
    \ function as content in a variable, and we would do that with the assignment\
    \ operator =.\n\nTo illustrate this, you can see this example, which will call\
    \ the media() function and save the result of the mean in a variable and then\
    \ print it on the page.\n\n```\nvar myAverage\nmyAverage = media(12, 8)\ndocument.write(myAverage)\n\
    ```\n\n## Multiple return\n\nActually in Javascript functions can only return\
    \ one value, so in principle we cannot make functions that return two different\
    \ data.\n\nNote: in practice nothing prevents us from having a function return\
    \ more than one value, but since we can only return one thing, we would have to\
    \ put all the values that we want to return in a data structure, such as an array.\
    \ However, that would be a more or less advanced use that we are not going to\
    \ see at the moment.\n\nNow, although we can only return one data, in the same\
    \ function we can place more than one return. As we say, we are only going to\
    \ be able to return one thing, but depending on what has happened in the function\
    \ it may be of one type or another, with some data or others.\n\nIn this function\
    \ we can see an example of using multiple return. This is a function that returns\
    \ 0 if the received parameter was even and the value of the parameter if it was\
    \ odd.\n\n```\nfunction multipleReturn(number) {\n    var remainder = number %\
    \ 2\n    if (remainder == 0)\n        return 0\n    else\n        return number\n\
    }\n```\n\nTo find out if a number is even we find the remainder of the division\
    \ by dividing it by 2. If the remainder is zero it is that it was even and we\
    \ return 0, otherwise - the number is odd - we return the received parameter.\n\
    \n## Scope of variables in functions\n\nWithin the functions we can declare variables.\
    \ On this matter we must know that all the variables declared in a function are\
    \ local to that function, that is, they will only be valid during the execution\
    \ of the function.\n\nNote: Even if we think about it, we can realize that the\
    \ parameters are like variables that are declared in the function's header and\
    \ that are initialized when calling the function. The parameters are also local\
    \ to the function and will be valid only when the function is running.\n\nIt could\
    \ be the case that we can declare variables in functions that have the same name\
    \ as a global variable to the page. So, inside the function, the variable that\
    \ will be valid is the local variable and outside the function the global variable\
    \ to the page will be valid.\n\nOn the other hand, if we do not declare the variables\
    \ in the functions, it will be understood by javascript that we are referring\
    \ to a global variable to the page, so if the variable is not created it creates\
    \ it, but always global to the page instead of local to the function.\n\nLet's\
    \ look at the following code.\n\n```\nfunction variables_glogales_y_locales()\
    \ {\n    var localVariable = 23\n    globalVariable = \"qwerty\"\n}\n```\n\nIn\
    \ this case variableLocal is a variable that has been declared in the function,\
    \ so it will be local to the function and will only be valid during its execution.\
    \ On the other hand, variableGlobal has not been declared (because before"
  mdcn: "\n## 参数\n\n参数用于向函数发送值。函数将利用这些参数来执行相关操作。换句话说，参数是函数接收的输入值。\n\n举一个易于理解的例子，一个执行两个数字求和的函数，这两个数字就是它的参数。这两个数字是输入，而求和的结果则是输出，但这部分我们稍后会讨论。\n\
    \n让我们回顾之前的例子，我们创建了一个在网页显示欢迎消息的函数，但现在我们要传递一个包含被问候者姓名的参数。\n\n```\nfunction writeWelcome(name)\
    \ {\n    document.write(\"<H1> Hello\" + name + \"</H1>\")\n}\n```\n\n正如我们在示例中看到的，要在函数中定义参数，我们需要放入一个变量名，用于存储传递给它的数据。在这个例子中，该变量被命名为\
    \ `name`，它的值将是我们调用函数时传递给它的数据。此外，接收参数的变量在函数执行期间具有生命周期，并在函数执行结束时停止存在。\n\n要调用一个带有参数的函数，请在括号中放入参数的值。要调用示例函数，你需要这样写：\n\
    \n```\nwriteWelcome(\"Alberto García\")\n```\n\n像这样调用函数时，`name` 参数将获得值 \"Alberto\
    \ García\"，并在屏幕上写入问候语时，它将在 `<H1>` 标签之间写入 \"Hello Alberto García\"。\n\n参数可以接收任何类型的数据，包括数值、文本、布尔值或对象。我们并没有明确指定参数的类型，因此在定义函数内执行的操作以及向其传递值时，必须格外小心，以确保一切都与我们期望变量或参数所具有的数据类型保持一致。\n\
    \n## 多个参数\n\n一个函数可以接收任意数量的参数，在表达方式上，参数名称在括号内用逗号分隔。让我们快速看一下之前的函数语法，但这次将其修改为接收两个参数：第一个是被问候的名字，第二个是文本的颜色。\n\
    \n```\nfunction writeWelcome(name, colorText) {\n    document.write(\"<FONT color\
    \ = '\" + colorText + \"'>\")\n    document.write(\"<H1> Hello\" + name + \"</H1>\"\
    )\n    document.write(\"</FONT>\")\n}\n```\n\n我们将使用这种语法调用函数。在括号之间，我们将放入参数的值。\n\
    \n```\nvar myName = \"Pepe\"\nvar myColor = \"red\"\nwriteWelcome(myName, myColor)\n\
    ```\n\n我在括号中放入了两个变量，而不是两个带引号的文本。当我们把变量放在参数位置时，我们实际上传递给函数的是变量所包含的**值**，而不是变量本身。\n\
    \n## 参数按值传递\n\n在 JavaScript 程序中使用参数时，我们需要知道函数的参数是**按值传递**的。这意味着我们传递的是值而不是变量。在实践中，即使我们在函数内部修改了参数，我们传递的原始变量的值也不会改变。通过一个例子可以很容易地看出这一点。\n\
    \n```\nfunction stepValue(myParameter) {\n    myParameter = 32\n    document.write(\"\
    I have changed the value to 32\")\n}\n\nvar myVariable = 5\nstepValue(myVariable)\n\
    document.write(\"the value of the variable is:\" + myVariable)\n```\n\n在这个例子中，我们有一个函数，它接收一个参数并将该参数的值修改为\
    \ 32。我们还有一个变量，将其初始化为 5，然后调用该函数并将此变量作为参数传递。由于我们在函数内部修改了参数的值，可能会认为原始变量的值也会改变，但由于参数不会修改变量的原始值，因此它的值没有改变。\n\
    \n这样一来，一旦函数执行完毕，在屏幕上打印 `myVariable` 的值时，打印出的是数字 5（变量的原始值），而不是 32（我们更新参数时所用的值）。\n\
    \n在 JavaScript 中，变量只能按值传递。\n\n## Javascript 函数中的返回值\n\n我们正在学习 JavaScript 中函数的用法，此时你可能已经意识到它们在构建高级程序中的重要性。在这一篇\
    \ JavaScript 手册的文章中，我们将继续学习关于函数的知识，特别是你可以通过函数**返回一个值**。此外，我们将看到一些关于函数的有趣用例，这可以进一步阐明局部变量和全局变量的作用域。\n\
    \n## 在函数中返回数值\n\nJavaScript 函数也可以返回数值。事实上，这是函数最核心的功能之一，不仅在 JavaScript 中，而且在任何编程语言中都是如此。因此，通过调用一个函数，你可以执行某些操作并提供一个输出值。\n\
    \n例如，一个计算数字平方的函数，其输入将是该数字，输出则是计算该数字平方后得到的值。我们在之前的函数参数文章中学习了函数的数据输入，现在我们需要学习输出。\n\
    \n让我们来看一个计算两个数字平均值的函数示例。该函数将接收这两个数字并返回平均值。\n\n```\nfunction media(value1, value2)\
    \ {\n    var result\n    result = (value1 + value2) / 2\n    return result\n}\n\
    ```\n\n为了指定函数将返回的值，使用 `return` 关键字，后面跟着你想要返回的值。在这个例子中，返回的是 `result` 变量的内容，其中包含了计算出的两个数字的平均值。\n\
    \n我们现在可能会问，如何接收函数返回的数据。实际上，在程序的源代码中，我们可以在任何想要的地方调用函数。当一个函数返回一个值时，函数调用会被简单地替换为它返回的那个值。因此，要存储函数的返回值，我们需要将该函数的调用作为内容赋值给一个变量，我们将使用赋值运算符\
    \ `=` 来完成。\n\n为了说明这一点，你可以参考这个示例：它将调用 `media()` 函数，将平均值结果保存到一个变量中，然后将其打印在页面上。\n\
    \n```\nvar myAverage\nmyAverage = media(12, 8)\ndocument.write(myAverage)\n```\n\
    \n## 多个返回\n\n实际上，JavaScript 函数只能返回**一个**值，因此原则上我们不能创建返回两个不同数据的函数。\n\n注意：在实践中，没有什么能阻止一个函数返回多个值，但由于我们只能返回一个东西，我们必须将所有想要返回的值放入一个数据结构中，例如数组。然而，那属于较为高级的用法，我们目前不讨论。\n\
    \n现在，虽然我们只能返回一个数据，但在同一个函数中我们可以放置**多个 return 语句**。如前所述，我们最终只能返回一个东西，但取决于函数内部发生了什么，返回的可能是某种类型或另一种类型，或者是某些数据或另一些数据。\n\
    \n在这个函数中，我们可以看到使用多个 return 的例子。这是一个如果接收到的参数是偶数则返回 0，如果是奇数则返回参数本身值的函数。\n\n```\n\
    function multipleReturn(number) {\n    var remainder = number % 2\n    if (remainder\
    \ == 0)\n        return 0\n    else\n        return number\n}\n```\n\n为了判断一个数是否为偶数，我们通过除以\
    \ 2 来求余数。如果余数为零，则它是偶数，我们返回 0；否则（该数为奇数），我们返回接收到的参数。\n\n## 函数中变量的作用域\n\n在函数内部，我们可以声明变量。关于这一点，我们必须知道：所有在函数中声明的变量对于该函数来说都是**局部**的，也就是说，它们仅在函数执行期间有效。\n\
    \n注意：仔细思考就会发现，参数就像是在函数头部声明并在调用函数时初始化的变量。参数同样是函数的局部变量，且仅在函数运行期间有效。\n\n可能会出现这种情况：我们在函数中声明的变量与页面的全局变量同名。在这种情况下，在函数内部，生效的是局部变量；而在函数外部，生效的是页面的全局变量。\n\
    \n另一方面，如果我们在函数中没有声明变量，JavaScript 会认为我们指的是页面的全局变量。因此，如果该变量尚未创建，它会将其创建，但始终是页面的全局变量，而不是函数的局部变量。\n\
    \n让我们看看以下代码。\n\n```\nfunction variables_glogales_y_locales() {\n    var localVariable\
    \ = 23\n    globalVariable = \"qwerty\"\n}\n```\n\n在这种情况下，`localVariable` 是在函数中声明的变量，因此它是函数的局部变量，仅在执行期间有效。另一方面，`globalVariable`\
    \ 没有被声明（因为之前...\n"
