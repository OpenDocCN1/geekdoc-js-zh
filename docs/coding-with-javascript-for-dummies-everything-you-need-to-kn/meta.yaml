- md: "## Javascript SWITCH结构\n\n控制结构是控制程序流程的方式，可以根据变量的状态执行不同的操作。在Javascript手册中，我们已经开始了解控制结构，现在轮到SWITCH了，这是一种略复杂的结构，允许根据变量的状态执行多个操作。\n\
    \n在本文中，我们将看到switch如何帮助我们根据变量的不同状态做出决策。当我们对一条语句求值产生多种可能结果时，就会使用此表达式。\n\nSWITCH结构从Javascript\
    \ 1.2版本（Netscape 4和Internet Explorer 4）开始引入。其语法如下。\n\n```\nswitch (expression)\
    \ {\n  case value1:\n    如果表达式的值为value1，则执行此处的语句\n    break\n  case value2:\n\
    \    如果表达式的值为value2，则执行此处的语句\n    break\n  case value3:\n    如果表达式的值为value3，则执行此处的语句\n\
    \    break\n  default:\n    如果值不是上述任何一个，则执行此处的语句\n}\n```\n\n对表达式进行求值，如果其值为value1，则执行与该case相关的语句。如果表达式的值为value2，则执行与该值相关的指令，依此类推，有多少个选项就执行多少。最后，对于所有先前未涉及的情况，将执行default\
    \ case。\n\n单词break是可选的，但如果我们在找到值后不放置break，那么与该值相关的所有语句以及后续的所有语句都将被执行。也就是说，如果在我们前面的结构中没有break，并且表达式的值为value1，那么与value1相关的语句将被执行，同样与value2、value3和default相关的语句也会被执行。\n\
    \ndefault选项也是可选的。\n\n让我们看一个使用此结构的例子。假设我们想指出是星期几。如果日期是1（星期一），则显示相应的消息；如果是2（星期二），则显示不同的消息，依此类推，星期六和星期日除外，我们希望显示“是周末”的消息。对于大于7的日期，我们将指出该日期不存在。\n\
    \n```\nswitch (day_of_the_week) {\n  case 1:\n    document.write (\"今天是星期一\")\n\
    \    break\n  case 2:\n    document.write (\"今天是星期二\")\n    break\n  case 3:\n\
    \    document.write (\"今天是星期三\")\n    break\n  case 4:\n    document.write (\"\
    今天是星期四\")\n    break\n  case 5:\n    document.write (\"今天是星期五\")\n    break\n\
    \  case 6:\n  case 7:\n    document.write (\"是周末\")\n    break\n  default:\n \
    \   document.write (\"该日期不存在\")\n}\n```\n\n这个例子相对简单，可能只有一个小小的难点，即理解case 6和7的情况，我们之前说过要显示相同的消息。在case\
    \ 6中，我们实际上没有指定任何指令，但由于没有放置break，因此将执行下一条或多条语句，即case 7中指出的语句，也就是告知是周末的消息。如果是case\
    \ 7，则简单地指出是周末，如预期所示。\n\n注意：我们还有一个关于Javascript SWITCH的视频教程，可以很好地帮助理解一切。\n\n## FOR循环\n\
    \nFOR循环用于将一条或多条指令重复执行一定的次数。在所有循环中，当我们确切知道希望它运行多少次时，通常使用FOR循环。for循环的语法如下所示。\n\n\
    ```\nfor (初始化; 条件; 更新) {\n    // 每次迭代要执行的语句\n}\n```\n\nFOR循环包含括号中的三个部分，帮助我们定义如何执行重复。第一部分是初始化，仅在开始第一次循环迭代时执行。此部分通常放置我们将用于记录循环执行次数的变量。\n\
    \n第二部分是条件，将在每次循环迭代开始时进行评估。包含一个表达式，用于决定何时停止循环，或者更确切地说，是循环继续运行必须满足的条件。\n\n最后是更新，用于指示我们希望在每次循环迭代结束时对变量进行的更改，然后再检查是否应继续执行。\n\
    \n在for之后，是我们在每次迭代中要执行的语句，包含在花括号中。\n\n下面可以看到一个使用此循环的例子，其中将打印数字0到10。\n\n```\nvar\
    \ i\nfor (i = 0; i <= 10; i ++) {\n    document.write (i)\n    document.write\
    \ (\"<br>\")\n}\n```\n\n在这种情况下，变量i初始化为0。作为执行迭代的条件，必须满足变量i小于或等于10。作为更新，变量i将增加1。\n\
    \n如您所见，这个循环非常强大，因为在单行中我们可以指示许多不同且多样的事情，从而实现快速配置循环和巨大的灵活性。\n\n例如，如果我们想以两个为一组从1写到1000，将编写以下循环。\n\
    \n```\nfor (i = 1; i <= 1000; i += 2)\n    document.write (i)\n```\n\n请注意，在每次迭代中，我们将i的值增加2个单位。\n\
    \n注意：另一个细节，我们没有使用包含FOR循环指令的花括号，因为它只有一条语句，在这种情况下不是强制的，就像IF指令的情况一样。\n\n如果我们想从343倒数到10，我们将使用这个循环。\n\
    \n```\nfor (i = 343; i >= 10; i--)\n    document.write (i)\n```\n\n在这种情况下，我们在每次迭代中将变量i减1，从值343开始，只要变量的值大于或等于10。\n\
    \n## 示例for循环练习\n\n我们将暂停一下，通过一个练习来巩固for循环，如果我们已经理解了循环的操作，这个练习就没有任何难度。\n\n这是一个在网页上打印从<H1>到<H6>的标题，文本为“第x级标题”的循环。\n\
    \n我们想用Javascript在网页上打印的内容如下：\n\n<H1> 第1级标题 </H1>\n<H2> 第2级标题 </H2>\n<H3> 第3级标题\
    \ </H3>\n<H4> 第4级标题 </H4>\n<H5> 第5级标题 </H5>\n<H6> 第6级标题 </H6>\n\n为此，我们必须制作一个从1开始到6结束的循环，在每次迭代中打印相应的标题。\n\
    \n```\nfor (i = 1; i <= 6; i ++) {\n    document.write (\"<H\" + i + \"> 第\" +\
    \ i + \"级标题</ H\" + i + \">\")\n}\n```\n\n现在我们已经熟悉了for循环，我们可以学习如何操作其他用于重复的控制结构，例如while和do\
    \ ... while循环。\n\n## WHILE和DO WHILE循环\n\n我们正在处理Javascript语言中存在的不同控制结构，特别是研究我们可以在此编程语言中实现的不同类型的循环。在Javascript手册的前几篇文章中，我们已经看到了我们应该知道的第一个循环，即for循环，现在我们将处理另外两种用于重复的控制结构。因此，让我们现在看看我们可以使用的两种类型的WHILE循环以及各自的用途。\n\
    \n## WHILE循环\n\n当我们希望重复执行某些语句无限次，只要满足条件时，就会使用这些循环。它比FOR循环更容易理解，因为它没有在同一行中包含变量初始化、继续执行的条件及其更新。只指示执行迭代必须满足的条件，如下所示。\n\
    \n```\nwhile (条件) {\n    // 要执行的语句\n}\n```\n\n下面可以看到一个使用此循环的代码示例。\n\n```\nvar\
    \ color = \"\"\nwhile (color! = \"红色\") {\n    color = prompt (\"给我一种颜色（输入红色以退出）\"\
    , \"\")\n}\n```\n\n这是使用while循环可以做的最简单的示例。它所做的就是要求用户输入一种颜色，并重复执行，只要输入的颜色不是红色。要执行这样的循环，我们首先必须初始化将在循环迭代条件中使用的变量。使用初始化的变量，我们可以编写循环，循环将检查color变量是否不等于“红色”。在每次循环迭代中，都会向用户请求一种新的颜色来更新color变量，并且迭代结束，因此我们返回到循环的开头，必须重新评估color变量中的内容是否为“红色”，只要没有输入文本“红色”作为颜色，就会一直这样。"
  mdcn: "\n## Javascript SWITCH 结构\n\n控制结构是控制程序流程的方式，可以根据变量的状态执行不同的操作。在 Javascript\
    \ 手册中，我们已经开始了解控制结构，现在轮到 **SWITCH** 了。这是一种略复杂的结构，允许根据变量的状态执行多个操作。\n\n在本文中，我们将看到\
    \ `switch` 如何帮助我们根据变量的不同状态做出决策。当我们对一个表达式求值并产生多种可能结果时，就会使用此结构。\n\nSWITCH 结构从 Javascript\
    \ 1.2 版本（Netscape 4 和 Internet Explorer 4）开始引入。其语法如下：\n\n```\nswitch (expression)\
    \ {\n  case value1:\n    如果表达式的值为value1，则执行此处的语句\n    break\n  case value2:\n\
    \    如果表达式的值为value2，则执行此处的语句\n    break\n  case value3:\n    如果表达式的值为value3，则执行此处的语句\n\
    \    break\n  default:\n    如果值不是上述任何一个，则执行此处的语句\n}\n```\n\n系统会对表达式进行求值，如果其值为\
    \ `value1`，则执行与该 `case` 相关的语句。如果表达式的值为 `value2`，则执行与该值相关的指令，依此类推，根据选项的数量执行相应的分支。最后，对于所有先前未匹配的情况，将执行\
    \ `default` 分支。\n\n关键字 `break` 是可选的，但如果我们不在匹配到值后放置 `break`，那么当前匹配分支以及后续的所有语句都将被执行（这种情况称为“穿透”）。也就是说，如果在结构中没有\
    \ `break` 且表达式的值为 `value1`，那么与 `value1` 相关的语句将被执行，同时与 `value2`、`value3` 和 `default`\
    \ 相关的语句也会被依次执行。\n\n`default` 选项也是可选的。\n\n让我们看一个使用此结构的例子。假设我们想指出今天是星期几：如果日期是 1（星期一），则显示相应消息；如果是\
    \ 2（星期二），则显示不同消息，依此类推。但对于星期六和星期日，我们希望显示“是周末”的消息。对于大于 7 的日期，我们将指出该日期不存在。\n\n```\n\
    switch (day_of_the_week) {\n  case 1:\n    document.write (\"今天是星期一\")\n    break\n\
    \  case 2:\n    document.write (\"今天是星期二\")\n    break\n  case 3:\n    document.write\
    \ (\"今天是星期三\")\n    break\n  case 4:\n    document.write (\"今天是星期四\")\n    break\n\
    \  case 5:\n    document.write (\"今天是星期五\")\n    break\n  case 6:\n  case 7:\n\
    \    document.write (\"是周末\")\n    break\n  default:\n    document.write (\"该日期不存在\"\
    )\n}\n```\n\n这个例子相对简单，唯一的小难点在于理解 `case 6` 和 `7` 的情况：我们希望它们显示相同的消息。在 `case 6` 中，我们实际上没有指定任何指令，但由于没有放置\
    \ `break`，程序将执行下一条语句，即 `case 7` 中指出的语句，从而告知“是周末”。如果是 `case 7`，则直接指出是周末，符合预期。\n\
    \n**注意：** 我们还有一个关于 Javascript SWITCH 的视频教程，可以帮助您更好地理解。\n\n## FOR 循环\n\n**FOR 循环**用于将一条或多条指令重复执行一定的次数。在所有循环中，当我们确切知道希望循环运行多少次时，通常使用\
    \ FOR 循环。`for` 循环的语法如下所示：\n\n```\nfor (初始化; 条件; 更新) {\n    // 每次迭代要执行的语句\n}\n\
    ```\n\nFOR 循环在括号中包含三个部分，用于定义重复执行的方式：\n1. **初始化**：仅在开始第一次循环迭代时执行一次。此部分通常用于定义记录循环执行次数的计数变量。\n\
    2. **条件**：在每次循环迭代开始前进行评估。它包含一个表达式，用于决定何时停止循环，或者更确切地说，是循环继续运行必须满足的条件。\n3. **更新**：指示在每次循环迭代结束时对变量进行的更改，随后再次检查条件以决定是否继续执行。\n\
    \n在 `for` 语句之后，包含在花括号 `{}` 中的是我们在每次迭代中要执行的语句。\n\n下面是一个使用此循环打印数字 0 到 10 的例子：\n\n\
    ```\nvar i\nfor (i = 0; i <= 10; i ++) {\n    document.write (i)\n    document.write\
    \ (\"<br>\")\n}\n```\n\n在这种情况下，变量 `i` 初始化为 0。迭代执行的条件是变量 `i` 必须小于或等于 10。在更新步骤中，变量\
    \ `i` 每次增加 1。\n\n如您所见，这个循环非常强大，因为我们可以在单行中定义多样化的控制逻辑，从而实现快速配置和极高的灵活性。\n\n例如，如果我们想以\
    \ 2 为步长从 1 写到 1000，可以编写如下循环：\n\n```\nfor (i = 1; i <= 1000; i += 2)\n    document.write\
    \ (i)\n```\n\n请注意，在每次迭代中，我们将 `i` 的值增加 2 个单位。\n\n**注意：** 另一个细节是，这里我们没有使用花括号，因为循环体中只有一条语句。在这种情况下，花括号不是强制性的，这与\
    \ `if` 指令的情况相同。\n\n如果我们想从 343 倒数到 10，可以使用这个循环：\n\n```\nfor (i = 343; i >= 10;\
    \ i--)\n    document.write (i)\n```\n\n在这种情况下，我们从值 343 开始，只要变量的值大于或等于 10，就在每次迭代中将变量\
    \ `i` 减 1。\n\n## 示例 for 循环练习\n\n我们暂停一下，通过一个练习来巩固 for 循环。如果您已经理解了循环的操作，这个练习将非常简单。\n\
    \n目标是在网页上打印从 `<H1>` 到 `<H6>` 的标题，文本为“第 x 级标题”。\n\n我们希望在网页上打印的内容如下：\n\n<H1> 第1级标题\
    \ </H1>\n<H2> 第2级标题 </H2>\n<H3> 第3级标题 </H3>\n<H4> 第4级标题 </H4>\n<H5> 第5级标题 </H5>\n\
    <H6> 第6级标题 </H6>\n\n为此，我们必须创建一个从 1 开始到 6 结束的循环，在每次迭代中打印相应的标题：\n\n```\nfor (i =\
    \ 1; i <= 6; i ++) {\n    document.write (\"<H\" + i + \"> 第\" + i + \"级标题</ H\"\
    \ + i + \">\")\n}\n```\n\n现在我们已经熟悉了 `for` 循环，可以学习如何操作其他用于重复的控制结构，例如 `while` 和\
    \ `do ... while` 循环。\n\n## WHILE 和 DO WHILE 循环\n\n我们正在研究 Javascript 语言中存在的不同控制结构，特别是实现循环的不同类型。在之前的文章中，我们学习了\
    \ `for` 循环，现在我们将处理另外两种用于重复的控制结构。让我们看看两种类型的 **WHILE** 循环及其各自的用途。\n\n## WHILE 循环\n\
    \n当我们希望在条件满足时重复执行某些语句（次数不确定，甚至可能是无限次）时，就会使用此类循环。它比 FOR 循环更容易理解，因为它没有将变量初始化、条件和更新语句全部挤在同一行，而仅指示执行迭代必须满足的条件，如下所示：\n\
    \n```\nwhile (条件) {\n    // 要执行的语句\n}\n```\n\n下面是一个使用此循环的代码示例：\n\n```\nvar color\
    \ = \"\"\nwhile (color != \"红色\") {\n    color = prompt (\"给我一种颜色（输入红色以退出）\",\
    \ \"\")\n}\n```\n\n这是 `while` 循环最简单的示例。它的逻辑是：要求用户输入一种颜色，只要输入的颜色不是“红色”，就重复执行该请求。要运行这样的循环，我们必须先初始化将在循环条件中使用的变量。在本例中，循环会检查\
    \ `color` 变量是否不等于“红色”。在每次迭代中，通过 `prompt` 更新 `color` 变量，然后返回循环开头重新评估。只要用户没有输入“红色”，循环就会一直继续。\n"
