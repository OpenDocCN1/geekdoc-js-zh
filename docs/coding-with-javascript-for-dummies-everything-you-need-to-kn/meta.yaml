    \ With a single IF we can evaluate and perform one action or another according\
    \ to two possibilities, but if we have more possibilities to evaluate we must\
    \ nest IFs to create the necessary code flow to decide correctly.\n\nFor example,\
    \ if I want to check if one number is less than or equal to another, I have to\
    \ evaluate three different possibilities. First I can check if the two numbers\
    \ are equal, if they are, I have already solved the problem, but if they are not\
    \ equal I will still have to see which of the two is greater. Let's look at this\
    \ example in Javascript code.\n\n```\nvar number1 = 23\nvar number2 = 63\nif (number1\
    \ == number2) {\n  document.write (\"The two numbers are the same\")\n} else {\n\
    \  if (number1> number2) {\n    document.write (\"The first number is greater\
    \ than the second\")\n  } else {\n    document.write (\"The first number is less\
    \ than the second\")\n  }\n}\n```\n\nThe flow of the program is as we mentioned\
