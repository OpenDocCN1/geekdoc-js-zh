    ```\n<SCRIPT>\nvar number = 2\nfunction myFunction () {\n    var number = 19\n\
    \    document.write (number) // print 19\n}\ndocument.write (number) // print\
    \ 2\n</SCRIPT>\n```\n\nNote: To understand this code you will surely find it useful\
    \ to consult the chapter on creating functions in Javascript. A tip for beginners\
    \ might be to not declare variables with the same names, so there is never confusion\
    \ about which variable is valid at any given time.\n\n## Differences between declaring\
