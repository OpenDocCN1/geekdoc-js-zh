  - '[PAGE 186]


    # # General introduction to objects in Javascript


    We are going to introduce ourselves to a very important Javascript topic such
    as objects. It is a topic that we have not yet seen and on which we are going
    to constantly deal with since most of the things in Javascript, even the simplest,
    we are going to do through the handling of objects. In fact, in the examples made
    so far we have made great efforts not to use objects and even so we have used
    them on occasion, since it is very difficult to find examples in Javascript that,
    although simple, do not make use of them.


    Object Oriented Programming (OOP) represents a new way of thinking when making
    a program. Javascript is not a pure object-oriented programming language because,
    although it uses objects many times, we don''t need to program all of our programs
    based on them. In fact, what we are generally going to do with Javascript is use
    objects and not so much object oriented programming. Therefore, the way of programming
    is not going to change much compared to what we have seen so far in the Javascript
    Manual. In summary, what we have seen so far regarding syntax, functions, etc.
    it is still perfectly valid and can be used just as indicated. We are only going
    to learn a kind of new structure such as objects.


    Note: To start getting a bit soaked about objects we have a small article published
    in DesarrolloWeb about object-oriented programming. It would be highly recommended
    that you read it, because several concepts are explained in which we will not
    go into so much detail. If you already know the POO, continue reading without
    pause, but if you want to go deeper, remember that we also have a complete Object
    Orientation Manual. If you like to watch videos we also recommend the What are
    the objects class taught in the Video Programming Course.'
- md: "## What is an object\n\nAlthough we are not going to go into detail with the\
    \ concepts, as they are very well explained in references that we have already\
    \ indicated, objects are a programming language tool in which two fundamental\
    \ things come together: data and functionality. Every computer program basically\
    \ deals with those two things in some way. With what we have seen so far we had\
    \ the data in variables and the functionality in functions, right? Because in\
    \ the world of objects, both data and functionality are in the same structure,\
    \ the object.\n\nThe thing is that now you need to learn new names with which\
    \ to refer to the data and functionality grouped into an object:\n\n- Properties:\
    \ In objects the properties refer to the data\n- Methods: In objects, methods\
    \ refer to functionality\n\nImagine you have a button object (a browser button,\
    \ something you can press to perform an action). The button has a written text,\
    \ because that text would be a data and therefore we would call it property. Another\
    \ property of a button would be whether or not it is activated. On the other hand,\
    \ a button could have associated functionality, which would be in a method, such\
    \ as processing the action of a click. Imagine something more generic like a phone.\
    \ The phone may have properties such as make, model, operating system, and methods\
    \ such as turning on, off, calling a number, etc.\n\nIn pure object-oriented programming\
    \ languages, such as Java, you always have to program based on objects. To program\
    \ you would have to create \"classes\", which are a kind of \"molds\" from which\
    \ objects are created. The program would solve any need by creating objects based\
    \ on those molds (classes), there being several (tens, hundreds or thousands)\
    \ of objects of different classes. The objects would have to collaborate with\
    \ each other to solve any type of action, as just in systems like an airplane\
    \ there are various objects (the engine, propellers, controls ...) that collaborate\
    \ with each other to solve the need to carry passengers or merchandise on trips\
    \ aerial.\n\nHowever, as we have been saying, in Javascript it is not so much\
    \ object-oriented programming, but using objects. Many times they will be objects\
    \ already created by the browser itself (the browser window, an HTML document\
    \ being displayed, an image or a form within that HTML document, etc.), and other\
    \ times they will be objects created by yourself or by other developers that help\
    \ you do specific things. Therefore, what we want to know to get started is the\
    \ syntax you need to use objects, basically access their properties and execute\
    \ their methods.\n\nNote: To know what the browser objects are, which we have\
    \ available in Javascript to solve the needs of web pages, you have to read the\
    \ manual on working with Javascript to use and manipulate browser resources.\n\
    \n## How to access object properties and methods\n\nIn Javascript we can access\
    \ the properties and methods of objects in a similar way to what we do in other\
    \ programming languages, with the operator dot (\".\").\n\nThe properties are\
    \ accessed by placing the name of the object followed by a period and the name\
    \ of the property to be accessed. In this way:\n\n```\nmyObject.myProperty\n```\n\
    \nTo call the methods we use a similar syntax, but putting the parameters that\
    \ we pass to the methods in parentheses. As follows:\n\n```\nmyObject.myMethod\
    \ (parameter1, parameter2)\n```\n\nIf the method does not receive parameters we\
    \ put the parentheses too, but with nothing inside.\n\n```\nmyObject.myMethod\
    \ ()\n```\n\n## How to create objects\n\nAs we have said, most of the objects\
    \ with which you are going to work in Javascript in order to create interaction,\
    \ effects and diverse behaviors on web pages, they give you ready-made. The browser\
    \ itself offers them to you so you simply have to use them. That's study material\
    \ from the Javascript Manual and browser objects. Having clarified that point,\
    \ it should be noted that Javascript is somewhat particular when creating objects,\
    \ basically because traditionally there is no \"class\" concept.\n\nTo be more\
    \ exact, in Javascript ES5, classes are created by means of functions and with\
    \ the new operator you create objects from those functions, but there are no classes\
    \ like the ones we know in other more traditional languages.\n\nNote: Classes\
    \ already exist in ES6 and Javascript is capable of generating classes and from\
    \ them producing objects, like other languages. You get more information in the\
    \ ES6 Manual.\n\nThe other alternative to create objects in Javascript is by means\
    \ of object literals, which are nothing more than the definition of the object\
    \ by means of code enclosed in curly braces, indicating their properties or methods\
    \ as is.\n\n```\n{\n  name: 'Miguel Angel Alvarez',\n  SitioWeb: 'DesarrolloWeb.com'\n\
    }\n```\n\nIn the previous code we have only defined properties, but we have other\
    \ articles where you can see how to define methods as well. To know more about\
    \ object literals we recommend reading the article on Javascript object literals,\
    \ where we will explain more carefully this usual syntax for creating objects\
    \ in this language.\n\nIn traditional Javascript we have said that classes do\
    \ not exist, but we can create instances of objects from functions, as we will\
    \ see in the next point.\n\n## Create and instantiate objects from functions\n\
    \nFor those who do not know, instantiating an object is the action of creating\
    \ an instance of a class, so that you can work with it later. Class is the definition\
    \ of the characteristics and functionalities of an object. Classes do not work\
    \ directly, these are only definitions. To work with a class we must have an instantiated\
    \ object of that class. We remember that in Javascript there are no classes, but\
    \ we can use functions.\n\nThis simple function could be used as a template to\
    \ build objects of the Person class:\n\n```\nfunction Person (name) {\n  this.name\
    \ = name;\n}\n```\n\nYou will notice that we are using the word \"this\" inside.\
    \ That word is a reference to the object to be created with this function. In\
    \ Javascript to create an object from a function the new statement is used, in\
    \ this way.\n\n**var miguel = new Person ('Miguel Angel Alvarez');**\n\nIn a variable\
    \ we call \"miguel\" I assign a new instance of the Person class. The parentheses\
    \ are filled with the data that the class needs to initialize the object, if there\
    \ are no parameters to enter, the parentheses are placed empty. Actually what\
    \ you do when you create an object is to call the function that builds it and\
    \ the function itself will take care of initializing the properties of the object\
    \ (which is what the \"this\" reference uses).\n\n## Modify property\n\nWhen the\
    \ property is already present, `Object.defineProperty()` will try to modify it\
    \ according to the values in the property descriptor and adjust the current object.\
    \ If the property descriptor in the object has set the configurable value to false,\
    \ the property is not set and cannot be modified (only modify the value of the\
    \ writable key to false [and vice versa]); it is not possible to switch between\
    \ properties of properties (access properties and data properties) when the property\
    \ is not adjustable.\n\nThe TypeError error will be called when you try to change\
    \ non-adjustable properties (except for a writable value as shown above).\n\n\
    ## The key is writable\n\nWhen you set the value of the writable key to false,\
    \ the property is not writable, that is, the values cannot be re-assigned:\n\n\
    ```\nvar o = {};\nObject.defineProperty(o, 'a', {\n  value: 1,\n  enumerable:\
    \ true\n});\nObject.defineProperty(o, 'b', {\n  value: 2,\n  enumerable: false\n\
    });\nObject.defineProperty(o, 'c', {\n  value: 3\n}); // property not enumerated\n\
    o.d = 4; // statistic property because we created it via\n         // Assign value\
    \ to a property directly\n```\n\n```\nfor (var i in o) {\n    console.log(i);\n\
    }\n// 'a' and 'd' (unordered)\n```\n\n```\nObject.keys(o); // ['a', 'd']\n```\n\
    \n```\no.propertyIsEnumerable('a'); // true\no.propertyIsEnumerable('b'); // false\n\
    o.propertyIsEnumerable('c'); // false\n```\n\n## The key is configurable\n\nThe\
    \ configurable key controls whether the property can be deleted from the object\
    \ (via the delete parameter), and whether the rest of the keys can be changed\
    \ (except that the value of the key is writable to false):\n\n```\nvar o = {};\n\
    Object.defineProperty(o, 'a', {\n    get: function () {return 1; },\n    configurable:\
    \ false\n});\n```\n\n```\nObject.defineProperty(o, 'a', {\n    configurable: true\n\
    }); // throws a TypeError\n```"
  mdcn: "\n## 什么是对象\n\n尽管我们不会深入探讨这些概念，因为它们在我们已经指出的参考资料中得到了很好的解释，但对象是一种编程语言工具，它融合了两个基本要素：**数据**和**功能**。每个计算机程序基本上都是以某种方式处理这两件事。就我们目前所学的知识而言，数据存储在变量中，功能实现在函数中，对吧？因为在对象的世界里，数据和功能都位于同一个结构中，即对象。\n\
    \n关键在于，现在你需要学习新的术语来指代组合在对象中的数据和功能：\n\n-   属性：在对象中，属性指的是数据\n-   方法：在对象中，方法指的是功能\n\
    \n想象一下，你有一个按钮对象（一个浏览器按钮，你可以按下它来执行某个操作）。按钮上有文字，因为文字是数据，所以我们称之为属性。按钮的另一个属性是它是否处于激活状态。另一方面，按钮可以有关联的功能，这些功能将通过方法来实现，例如处理点击操作。想象一些更通用的东西，比如一部手机。手机可能有品牌、型号、操作系统等属性，以及开机、关机、拨打电话等方法。\n\
    \n在纯粹的面向对象编程语言（如Java）中，你总是必须基于对象进行编程。为此，你需要创建“类”，这是一种创建对象的“模具”。程序将通过基于这些模具（类）创建对象来解决任何需求，从而产生多个（几十、几百或几千个）不同类的对象。这些对象必须相互协作以解决任何类型的操作，就像在飞机这样的系统中，有各种对象（发动机、螺旋桨、控制装置……）相互协作，以满足将乘客或货物运送到空中的需求。\n\
    \n然而，正如我们一直说的，在Javascript中，它并不是那么多的面向对象编程，而是使用对象。很多时候，这些对象是由浏览器本身已经创建好的（浏览器窗口、正在显示的HTML文档、该HTML文档中的图像或表单等），其他时候则是你或其它开发者创建的对象，这些对象帮助你执行特定任务。因此，我们入门时需要知道的是使用对象的语法，主要是访问它们的属性并执行它们的方法。\n\
    \n注意：要了解浏览器对象是什么，以及我们在Javascript中有哪些对象可用于满足网页的需求，你必须阅读使用Javascript操作和控制浏览器资源的手册。\n\
    \n## 如何访问对象属性和方法\n\n在Javascript中，我们访问对象属性和方法的方式类似于其他编程语言，使用点操作符（`.`）。\n\n访问属性时，将对象名称后跟一个句点，然后是要访问的属性名称，像这样：\n\
    \n```\nmyObject.myProperty\n```\n\n调用方法时，我们使用类似的语法，但将传递给方法的参数放在括号中。如下所示：\n\n```\n\
    myObject.myMethod (parameter1, parameter2)\n```\n\n如果方法不接收参数，我们也要放括号，但括号内为空。\n\
    \n```\nmyObject.myMethod ()\n```\n\n## 如何创建对象\n\n正如我们所说，你在Javascript中为了在网页上创建交互、效果和各种行为而要使用的大部分对象，都是现成提供给你的。浏览器本身就为你提供了这些对象，所以你只需使用它们即可。这是《Javascript手册》和浏览器对象的学习材料。在明确了这一点之后，需要注意的是，Javascript在创建对象方面有些特殊，基本上是因为传统上不存在“类”的概念。\n\
    \n更准确地说，在Javascript ES5中，类是通过函数创建的，并使用`new`操作符从这些函数创建对象，但并不存在像其他更传统语言中我们知道的那种类。\n\
    \n注意：ES6中已经存在类，Javascript能够生成类并从它们产生对象，就像其他语言一样。你可以在ES6手册中获得更多信息。\n\n在Javascript中创建对象的另一个方法是通过对象字面量，这不过是通过花括号中的代码来定义对象，直接指明它们的属性或方法。\n\
    \n```\n{\n  name: 'Miguel Angel Alvarez',\n  SitioWeb: 'DesarrolloWeb.com'\n}\n\
    ```\n\n在前面的代码中，我们只定义了属性，但在其他文章中你可以看到如何同时定义方法。要了解更多关于对象字面量的内容，我们建议阅读关于Javascript对象字面量的文章，我们将在那里更详细地解释这种在Javascript中创建对象的常用语法。\n\
    \n在传统的Javascript中，我们说过没有类，但我们可以从函数创建对象实例，正如我们将在下一点中看到的那样。\n\n## 从函数创建和实例化对象\n\n\
    对于不了解的人来说，实例化对象是创建类的实例的操作，以便之后可以使用它。类是对象特征和功能的定义。类不能直接工作，它们只是定义。要使用类，我们必须拥有该类的一个实例化对象。我们要记住，在Javascript中没有类，但我们可以使用函数。\n\
    \n这个简单的函数可以用作模板来构建`Person`类的对象：\n\n```\nfunction Person (name) {\n  this.name\
    \ = name;\n}\n```\n\n你会注意到我们在内部使用了`this`这个词。这个词是对此函数将要创建的对象的引用。在Javascript中，要从函数创建对象，使用`new`语句，像这样。\n\
    \n**var miguel = new Person ('Miguel Angel Alvarez');**\n\n在一个名为“miguel”的变量中，我分配了一个新的`Person`类实例。括号中填充了类初始化对象所需的数据，如果没有需要输入的参数，括号就留空。实际上，当你创建一个对象时，你所做的就是调用构造它的函数，函数本身会负责初始化对象的属性（这就是`this`引用的作用）。\n\
    \n## 修改属性\n\n当属性已经存在时，`Object.defineProperty()`将尝试根据属性描述符中的值进行修改并调整当前对象。如果对象中的属性描述符将`configurable`值设置为`false`，则该属性未被设置且无法修改（只能将`writable`键的值修改为`false`，反之亦然）；当属性不可配置时，无法在访问属性和数据属性之间切换。\n\
    \n当你尝试更改不可配置的属性（除非是如上所示的`writable`值为`false`）时，将抛出`TypeError`错误。\n\n## 键是可写的\n\n\
    当你将`writable`键的值设置为`false`时，该属性不可写，即不能重新赋值：\n\n```\nvar o = {};\nObject.defineProperty(o,\
    \ 'a', {\n  value: 1,\n  enumerable: true\n});\nObject.defineProperty(o, 'b',\
    \ {\n  value: 2,\n  enumerable: false\n});\nObject.defineProperty(o, 'c', {\n\
    \  value: 3\n}); // 属性未被枚举\no.d = 4; // 静态属性，因为我们通过直接给属性赋值创建了它\n         // Assign\
    \ value to a property directly\n```\n\n```\nfor (var i in o) {\n    console.log(i);\n\
    }\n// 'a' 和 'd'（顺序不确定）\n```\n\n```\nObject.keys(o); // ['a', 'd']\n```\n\n```\n\
    o.propertyIsEnumerable('a'); // true\no.propertyIsEnumerable('b'); // false\n\
    o.propertyIsEnumerable('c'); // false\n```\n\n## 键是可配置的\n\n`configurable`键控制属性是否可以从对象中删除（通过`delete`参数），以及其余的键是否可以更改（除非`writable`键的值为`false`）：\n\
    \n```\nvar o = {};\nObject.defineProperty(o, 'a', {\n    get: function () {return\
    \ 1; },\n    configurable: false\n});\n```\n\n```\nObject.defineProperty(o, 'a',\
    \ {\n    configurable: true\n}); // 抛出 TypeError\n```\n"
