    # The evolution of Javascript


    In the article of the introduction to Javascript we already explained some of
    the history of the language. We saw that in its beginnings its objectives were
    simple and that nowadays with Javascript we can manage to create really complex
    pages, user interfaces and effects. Therefore, as the demands of the developers
    grew, so did the language itself.


    **It is important to mention that the language has evolved in two ways:**


    On the one hand, the language itself has been incorporating operators, control
    structures, syntax rules to do repetitive things with less code. We owe these
    improvements in the language to the ECMAScript standard, which we will talk about
    immediately.


    On the other hand, browsers have been incorporating new instructions, to be able
    to manipulate modern elements of the page, such as divisions, CSS styles and systems
    such as local storage, full-screen work, geolocation and a long etc. All these
    improvements are defined under the standards of HTML 5 and its Javascript APIs.


    In any case, what should be clear is that Javascript has been improving its features
    as a language, while browsers have been offering greater support to advanced functionalities
    for the control of page elements. That is why in Javascript we generally have
    to be careful with the browser market and compatibility with the functionalities
    that we want to use.'
  - '[PAGE 45]


    # # ECMAScript Standard


    Javascript as a language is standardized by the organization "ECMA International".
    This company is dedicated to creating standards for communication and information
    processing. One of its best known standards is ECMAScript.


    ECMAScript is the standard definition of the Javascript language, which any client
    that supports Javascript must support. Over time, different versions of ECMAScript
    have been published, with the latest ECMAScript 2015, also known as ES6.


    ES6 is supported by all current browsers except Internet Explorer. Therefore,
    if you support IE programs, you could not use ES6 in principle.


    This is half true, since there are systems that allow the code to be translated
    from one version to another of the standard, although at the moment we do not
    want to get into these details. If you are interested, we recommend reading the
    Webpack Manual, which is one of the many tools that you can use to carry out this
    task.'
