  md: '# Hide Javascript scripts in old browsers


    Throughout the previous chapters of the Javascript Manual we have already seen
    that the language was implemented as of Netscape 2.0 and Internet Explorer 3.0.
    Even for those who do not know it, it is okay to say that there are browsers that
    work on operating systems, where you can only display text and where certain technologies
    and applications are not available, such as the use of images, different typographic
    fonts or Javascript itself. .


    Thus, not all browsers that can be used by users who visit our page understand
    Javascript. In cases where the scripts are not interpreted, browsers assume that
    their code is text from the page itself and as a consequence, present the scripts
    in the body of the document, as if it were normal text. To prevent script text
    from being written to the page when browsers don''t understand it, you have to
    hide them with HTML comments (<! - HTML comment ->). In addition, in this article
    we will also see how to display a message that is seen only in browsers that do
    not support Javascript.


    Updated: At the present time we can say that almost 100% of the available browsers
    support Javascript, or at least they recognize script tags, so, even if it is
    disabled, they will not show the text of our Javascript programs. Therefore, currently
    it is no longer essential to perform the operation of hiding the code of the page
    scripts for old browsers. However, if we want to make a completely correct page,
    it will be useful to learn how to hide a script so that it is never displayed
    as text on the page.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Hide Javascript code with HTML comments


    Let''s look at a code example where HTML comments have been used to hide Javascript,
    or better said, the code the Javascript scripts.


    ```

    <SCRIPT>

    <! -

    Javascript code

    // ->

    </SCRIPT>

    ```


    We see that the beginning of the HTML comment is identical to how we know it in
