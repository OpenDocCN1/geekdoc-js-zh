    \ = myNumber + myString1 // result1 的值为 \"23pepe\"\nresult2 = myNumber + myString2\
    \ // result2 的值为 \"23456\"\nmyString2 += myNumber // myString2 现在是 \"45623\"\n\
    ```\n\n正如我们所见，在 `+=` 运算符的情况下，如果处理的是混合数字的文本字符串，它同样会将两个操作数都视为字符串处理。\n\n注意：正如你可能想象的那样，许多对字符串进行的典型操作缺少对应的运算符。这是因为这些功能需要通过\
    \ Javascript 的 String 类来实现，我们稍后会看到。\n\n## 逻辑运算符\n\n这些运算符用于执行逻辑运算，即产生真（true）或假（false）结果的运算，用于在我们的脚本中做出决策。执行此类操作不使用数字，而是使用我们之前了解的布尔操作数，即真（true）和假（false）。逻辑运算符将布尔操作数关联起来，产生另一个布尔操作数，正如我们在下面的例子中所看到的。\n\
    \n**如果我饿了而且我有食物，那么我就开始吃东西**\n\n我们的 Javascript 程序在这个例子中会使用一个布尔操作数来做决策。首先，它会检查我是否饿了，如果为真（true），它会检查我是否有食物。如果两者都为真，就可以吃。如果我没有食物或者我不饿，我就不会吃，就像如果我不饿或者没有食物一样。这里讨论的操作数是\
    \ AND 操作数，只有当两个操作数都为真时，结果才为真。\n\n注意：为了不产生误导，应该说明逻辑运算符可以与其他非布尔数据类型结合使用，但在这种情况下，我们必须在使它们成为布尔值的表达式中使用它们。在本文接下来要处理的运算符组中，我们将讨论条件运算符，它们可以与逻辑运算符一起使用来构建我们需要的所有复杂句子。例如：\n\
    \n```javascript\nif (x == 2 && y != 3) {\n  // 变量 x 的值是 2 并且变量 y 不等于 3\n}\n```\n\
    \n在上面的条件表达式中，我们正在评估两个与逻辑运算符相关的检查。一方面，如果变量 x 等于 2，`x == 2` 将返回 true；另一方面，当变量 y\
    \ 的值不等于 3 时，`y != 3` 将返回 true。每个检查都返回一个布尔值，然后应用逻辑运算符 `&&` 来检查两个检查是否同时满足。\n\n不言而喻，要查看条件运算符的示例，我们需要学习控制结构，如\
    \ `if`，我们还没有讲到。\n\n-   `!` 非运算符或否运算符。如果为真，则变为假，反之亦然。\n-   `&&` 与运算符，如果两者都为真，则为真。\n\
    -   `||` 或运算符，如果至少一个为真，则为真。\n\n### 示例\n\n**myBoleano = true**\n**myBoleano = !myBoleano\
    \ // myBoleano 现在值为 false**\n**hunger = true**\n**gotFood = true**\n**comoMeal\
    \ = hunger && gotFood**\n\n## 条件运算符\n\n它们用于根据需要构建尽可能复杂的条件表达式。这些表达式用于基于各种元素的比较来做出决策，例如一个数字是否大于另一个或它们是否相等。\n\
    \n注意：条件运算符当然也用于比较其他数据类型的表达式。没有什么能阻止比较两个字符串，例如，看它们是否相同或不同。我们甚至可以比较布尔值。\n\n条件运算符用于条件表达式中进行决策。由于这些条件表达式将在后面学习，最好稍后再描述条件运算符。不过，这里我们可以看到条件运算符的表格。\n\
    \n| 运算符 | 描述 |\n| :--- | :--- |\n| == | 检查两个值是否相等 |\n| != | 检查两个值是否不同 |\n| > |\
    \ 大于，如果第一个操作数大于第二个，则返回 true |\n| < | 小于，当左边的项小于右边的项时为真 |\n| >= | 大于等于 |\n| <=\
    \ | 小于等于 |\n\n当我们解释控制结构（如 `if` 条件语句）时，我们将看到条件运算符的示例。\n\n此外，在本文中，我们将讨论一个在一般编程中相当重要的议题，即运算符的优先级，每当我们在同一个表达式中使用不同的运算符时，我们必须考虑到这一点，以便它们能够按照我们计划的方式相互关联并进行求值。\n\
    \n## 位级运算符\n\n这些运算符非常少见，你可能永远不会用到。它们用于执行涉及零和一的运算。计算机处理的所有内容都是零和一，尽管我们在变量中使用数字和字母，实际上这些值在内部是以零和一的形式存储的。在某些情况下，我们可能需要将变量视为零和一来执行运算，为此我们将使用这些运算符。在本手册中，讨论这类运算符有点过于冗长，但这里你可以查看这些运算符，以防万一你需要用到它们。\n\
    \n-   `&` 与位\n-   `^` 异或位\n-   `|` 或位\n-   `<<` `>>` `>>>` `>>=` `<<=` `&=` `^=`\
    \ `|=` 各种位移和位运算赋值\n\n## 运算符优先级\n\n我们在前面示例中看到的句子求值相当简单且易于解释，但当一个句子中涉及大量不同的运算符时，在解释它并阐明哪些运算符先于其他运算符执行时可能会产生混淆。为了在句子的求值中设定一些准则，并确保它们总是以相同且合理的方式执行，存在运算符的优先级，这只不过是它们所代表的操作被执行的顺序。最初，所有运算符都是从左到右求值的，但存在附加规则，据此某些运算符会先于其他运算符求值。许多这样的优先级规则源自数学，并且对于其他语言也是通用的，我们可以在下面看到它们。\n\
    \n-   **`()` `[]` `.` 括号、方括号和对象的点运算符**\n-   **`!` `-` `++` 取反、负数和递增**\n-   **`*`\
    \ `/` `%` 乘法、除法和取模**\n-   **`+` `-` 加法和减法**\n-   **`<<` `>>` `>>>` 位级移位**\n- \
    \  **`<=` `>=` 条件运算符**\n-   **`==` `!=` 相等和不等条件运算符**\n-   **`&` `^` `|` 位级逻辑**\n\
    -   **`&&` `||` 布尔逻辑**\n-   **`=` `+=` `-=` `*=` `/=` `%=` `<<=` `>>=` `&=` `^=`\
    \ `|=` 赋值**\n\n在下面的示例中，我们可以看到表达式可能变得多么混乱，但借助运算符优先级表，我们将能够毫无错误地理解它们的执行顺序。\n\n```javascript\n\
    12 * 3 + 4 - 8/2% 3\n```\n"
