    \ Javascript 代码都必须插入在这两个标签之间。\n\n### 脚本的放置位置很重要\n\n我们可以在同一个页面中输入多个脚本，每个脚本都可以输入在不同的\
    \ `<SCRIPT>` 标签内。这些脚本的放置位置并非无关紧要。在开始阶段，基于我们目前所知的情况和为了测试而执行的脚本，放置在哪里对我们来说没什么区别，但在某些情况下，这种放置将非常重要。在每种具体情况以及时机成熟时，都会进行相应说明。\n\
    \nJavascript 也可以写在某些页面属性中，例如 `onclick` 属性。这些属性与用户操作相关，被称为事件处理器（event handlers）。\n\
    \n下面我们将详细研究这两种编写脚本的方式，它们的主要区别在于语句执行的时机。\n\n### 编写 Javascript 脚本的方式\n\n直到现在，在 Javascript\
    \ 手册中，我们已经有机会尝试一些简单的脚本，然而，为了能够使用这种语言，我们仍需学习其中一个基础，那就是学习执行 Javascript 代码的两种方式。在页面上运行脚本有两种基本方式：第一种是直接脚本执行，第二种是响应用户操作的执行。\n\
    \n我们现在将解释每一种可用的执行形式，但对于有需要的人，我们还建议观看关于“包含和执行脚本的方式”的视频。\n\n## Javascript 代码的直接执行\n\
    \n这是运行脚本最基本的方法。在这种情况下，指令包含在 `<SCRIPT>` 标签内部，正如我们之前所评论的。当浏览器读取页面并发现脚本时，它会解释代码行并依次执行。我们将这种流程称为直接执行，因为当页面被读取时，脚本会被直接执行。\n\
    \n```\n<!DOCTYPE* html>\n<html lang=\"is\">\n<head>\n  <meta charset=\"UTF-8\"\
    >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n  <meta http-equiv=\"X-UA-Compatible\" content=\"ie=edge\">\n  <title>Example\
    \ of direct execution</title>\n</head>\n<body>\n  <h1>Page with Javascript</h1>\n\
    \  <p>This page has a dialog box, which will be displayed as soon as the browser\
    \ processes it.</p>\n\n  <script>\n    var people = 4;\n    var amountEntrance\
    \ = 9.50;\n    alert('You need ' + people * amountEntrance + ' euros for everyone\
    \ to enter the cinema');\n  </script>\n\n  <p>When the user clicks accept in the\
    \ dialog box, the browser will display the full page.</p>\n</body>\n</html>\n\
    ```\n\n这段 Javascript 代码将在页面打开时执行。浏览器在处理页面时，一旦发现这段代码，就会停止读取页面以执行 Javascript 脚本。结果，它将在对话框中显示“You\
    \ need 38 euros for everyone to enter the cinema”。当用户点击“接受”按钮后，浏览器将继续读取页面的其余部分，并在浏览器窗口中显示整个页面的内容。当然，我们在整个手册中还会看到许多其他示例。\n\
    \n这种方法将是我们在这个 Javascript 手册部分的大多数示例中优先使用的方法。在 Javascript 手册的第二部分中，我们可以学习很多东西，其中我们将详细介绍下面我们将阐述的第二种执行脚本的方式。\n\
    \n## 响应事件运行 Javascript\n\n这是运行脚本的另一种方式，但在查看它之前，我们必须讨论事件。事件是用户执行的操作。像 Javascript\
    \ 这样的程序被设计用来捕获执行的某些操作（在这种情况下是在页面上），并做出相应动作。通过这种方式，可以实现交互式程序，因为我们可以控制用户的动作并对其做出响应。事件有许多不同类型，例如，按钮的按下、鼠标的移动或页面上文本的选择。\n\
    \n我们想要响应事件而执行的操作可以用多种不同方式指明，例如在同一个 HTML 代码中，在放置于我们要响应用户操作的标签内部的属性中。在看到快速示例的章节中，我们已经验证了如果我们希望按钮在被点击时执行操作，我们必须在按钮的\
    \ `onclick` 属性中指明它们。\n\n因此，我们确认 Javascript 代码可以插入到 HTML 标签的某些属性中。然而，这并不是唯一可行的方法。我们还可以直接使用\
    \ Javascript 选择页面元素，并关联将在响应事件时执行的函数。虽然现在让你详细理解整个过程还为时过早，但我们将看一个简单的示例。\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"is\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta\
    \ http-equiv=\"X-UA-Compatible\" content=\"ie=edge\">\n  <title>Example hover\
    \ over</title>\n</head>\n<body>\n  <h1>Javascript Example</h1>\n  <span id=\"\
    myElement\">Mouse over here</span>\n  <script>\n    var passes = 0;\n    function\
    \ announcePast() {\n        passes = passes + 1;\n        alert('Mouse over '\
    \ + passes + ' times');\n    }\n    document.getElementById('myElement').addEventListener('mouseenter',\
    \ announcePast);\n  </script>\n</body>\n</html>\n```\n\n这次你拥有一个完整页面的代码。其中你可以发现嵌入在页面主体（body）内部的\
    \ Javascript 代码。与之前的代码不同，当浏览器读取页面时，它不会执行任何操作。它只是记住脚本，并将该函数与定义好的元素关联起来。具体来说，我们在一个具有标识符\
    \ `myElement` 的页面元素上定义了一个 `mouseenter` 类型的事件。这意味着每当用户将鼠标指针置于元素 `myElement` 之上时，它将执行\
    \ `announcePast` 函数。\n\n正如我们所说，现在来看这种风格的示例可能有点早，所以如果你没有完全理解，请不要担心。我们才刚刚开始 Javascript\
    \ 手册，你将能够循序渐进地学习所有这些以及更多内容。因此，我们稍后将详细探讨这种深入执行方式以及存在的事件类型。为了达到那个目标，我们还需要学习 Javascript\
    \ 的许多其他内容。在下一篇文章中，我们将展示如何为旧版浏览器隐藏 Javascript 代码。\n"
