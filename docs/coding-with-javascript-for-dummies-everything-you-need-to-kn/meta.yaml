    \n-   **Const 声明：** 实际上，“const” 声明的不是变量，而是常量，其值在程序执行期间不能改变。\n\n也许在这个 JavaScript\
    \ 手册的这个阶段，没有必要深入探讨这些声明模式。对于正在学习的我们，建议专注于使用 “var” 进行声明。但是，如果你想了解更多关于这些新变量类型的信息，我们在文章《Let\
    \ 和 const：ECMAScript 2015 中的变量》中进行了解释。如果你想了解 2015 年发布的 JavaScript 标准的其他新内容，我们建议阅读《ES6\
    \ 手册》。\n\n## JavaScript 中变量的作用域\n\n变量的作用域是我们在处理变量时必须了解的最重要概念之一，不仅在 JavaScript\
    \ 中，在大多数编程语言中都是如此。\n\n在上一篇文章中，我们已经开始了关于变量是什么以及如何声明它们的讲解。在这篇 JavaScript 手册文章中，我们旨在详细解释这个变量作用域的概念，并提供示例以便更好地理解。\n\
    \n在文章开头，我们将讨论使用 “var” 声明的变量的作用域。然而，现在有一种更新的变量声明方式，即使用 “let”，它直接影响变量的作用域。最后，我们还将提供一些说明和参考以帮助理解。\n\
    \n### 变量作用域的概念\n\n变量作用域是指变量可用的范围。通常，当我们声明一个变量时，我们在其被声明的位置使其可用。这在所有编程语言中都是如此，并且由于\
