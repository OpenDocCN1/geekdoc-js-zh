    -   16进制或十六进制系统，是使用16个数字的记数系统，包括0到9的数字和A到F的字母，以填补缺失的数字。要书写一个十六进制数，必须在数字前加上0和x，例如0x3EF。


    ## 布尔类型


    布尔类型用于存储“是”或“否”，换句话说，即“真”或“假”。它用于执行逻辑操作，通常用于在变量内容为真或假时执行某些操作。


    如果变量为真——我执行一些指令

    如果不为真——我执行其他指令

    布尔变量可以拥有的两个值是true或false。


    ```javascript

    myBoleana = true

    myBoleana = false

    ```


    ## 字符串数据类型


    最后一种数据类型用于存储文本。Javascript只有一种数据类型来存储文本，并且可以输入任意数量的字符。文本可以由数字、字母和任何其他类型的字符和符号组成。文本用引号书写，双引号或单引号均可。


    ```javascript

    myText = "Pepe is going to fish"

    myText = ''23 %% $ Letters & * - * ''

    ```


    所有被引号包围的内容，如前面的示例所示，无论引号内放置什么，都被视为字符串。例如，在一个文本变量中，我们可以存储数字，在这种情况下，我们必须记住文本变量和数值变量是不同的东西，数值变量用于进行数学计算，而文本变量则不是。


    ### 文本字符串中的转义字符


    有一些特殊字符用于表达文本字符串中的某些控制，例如换行符或制表符。这些就是转义字符，它们使用以反斜杠（与正常斜杠相反）开头的特殊表示法编写，然后放置要显示的字符代码。


    一个非常常见的字符是换行符，通过输入\n实现。另一个非常常见的字符是放置引号，因为如果我们不使用其特殊字符放置引号，我们放入的引号将开始关闭字符串。因此，引号必须用\"或\''输入。还有其他转义字符，我们将在下面的表格中看到，这些字符更简要，但用于书写反斜杠的字符也应该被强调为常用字符，以免与转义字符的开始混淆，后者是双反斜杠。


    **所有转义字符表格**


    | 转义字符 | 描述 |

    | :--- | :--- |

    | `\n` | 换行符 |

    | `\''` | 单引号 |

    | `\"` | 双引号 |

    | `\t` | 制表符 |

    | `\r` | 回车符 |

    | `\f` | 换页符 |

    | `\b` | 退格符 |

    | `\\` | 反斜杠 |


    这些字符中的一些您可能永远不会用到，因为它们的功能有点奇怪，有时也不太明确。


    ## 第四章


    ### Javascript运算符


    在任何语言中开发程序时，都会使用运算符，这些运算符用于进行实现目标所需的计算和操作。即使是最小的程序也需要运算符来做事，因为一个不执行操作的程序只会局限于总是做同样的事情。


    正是操作的结果使得程序能够根据其要处理的数据改变其行为，并为使用它的用户提供相关的结果。有更简单或更复杂的操作，可以使用不同类型的操作数来执行，例如数字或文本，我们将在本章和下一章中详细查看Javascript中所有这些可用的运算符。


    ## 使用运算符的示例


    在列出不同类型的运算符之前，让我们看几个这样的例子，以帮助我们更准确地了解它们是什么。在第一个示例中，我们将使用加法运算符执行加法。


    3 + 5


    这是一个非常基本的表达式，本身没有太大意义。它计算两个操作数3和5的和，但用处不大，因为结果没有被使用。通常，会组合多个运算符来创建更有用的表达式。以下表达式是两个运算符的组合，一个执行数学运算，另一个用于保存结果。


    **myVariable** = 23 * 5


    在前面的示例中，运算符*用于执行乘法，运算符=用于将结果赋给一个变量，因此我们保存该值以备后用。


    运算符可以根据它们执行的操作类型进行分类。接下来，我们将查看这些运算符组中的每一个，并描述每个运算符的功能。


    ## 算术运算符


    它们是用于执行简单数学运算的运算符，如加法、减法或乘法。在Javascript中，它们如下：


    -   `+` 两个值的和

    -   `-` 两个值的差，如果与单个操作数一起使用，也可以用于更改数字的符号（例如，-23）

    -   `*` 两个值的乘积

    -   `/` 两个值的商

    -   `%` 两个数相除的余数（3 % 2 将返回1，即3除以2的余数）

    -   `++` 递增一个单位，与单个操作数一起使用

    -   `--` 递减一个单位，与单个操作数一起使用


    ```javascript

    price = 128 // 我在价格变量中输入128

    units = 10 // 另一个赋值，稍后我们将看到赋值运算符

    invoice = price * units // 价格乘以数量，我得到发票价值

    remainder = invoice % 3 // 我获得发票变量除以3的余数

    price ++ // 价格增加一个单位（现在值为129）

    ```

