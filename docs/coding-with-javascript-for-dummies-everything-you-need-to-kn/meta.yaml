- md: "## Compare text strings\n\nString developers use `strcmp()` to compare text\
    \ strings; in JavaScript, you can use operators larger than and smaller than:\n\
    \n```javascript\nvar a = 'a';\nvar b = 'b';\nif (a < b) {  // true\n  console.log\
    \ (a + ' is less than ' + b);\n} else if (a > b) {\n  console.log (a + ' is greater\
    \ than ' + b);\n} else {\n  console.log (a + ' and ' + b + ' are equal.');\n}\n\
    ```\n\nA result similar to the above can be obtained by using the `localeCompare()`\
    \ function that is available in the String object copies.\n\n## Differences between\
    \ primary text strings and String objects\n\nNote that JavaScript language distinguishes\
    \ between String objects and initial text strings (the same applies to Boolean\
    \ and Number objects).\n\nText strings defined by double or single quotation marks\
    \ and text strings returned from the String function without the use of the `new`\
    \ reserved word are primitive strings, and JavaScript automatically converts these\
    \ initial values to String objects. When using the function (or trying to access\
    \ a property) on an initial string, JavaScript encapsulates the initial text string\
    \ within an object and calls the respective function (or required property):\n\
    \n```javascript\nvar s_prim = 'foo';\nvar s_obj = new String (s_prim);\n\nconsole.log\
    \ (typeof s_prim); // \"string\"\nconsole.log (typeof s_obj); // \"object\"\n\
    ```\n\nNote that String objects and initial text strings produce different results\
    \ when used with the `eval()` function, as the passed string of text will be treated\
    \ as eval, and String objects will behave like other objects, i.e., the object\
    \ will be returned. The following example illustrates this:\n\n```javascript\n\
    var s1 = '2 + 2'; // Create a text string\nvar s2 = new String ('2 + 2'); // Create\
    \ an object\nconsole.log (eval (s1)); // 4\nconsole.log (eval (s2)); // Text string\
    \ 2 + 2\n```\n\nFor these reasons, codes can not work when you encounter String\
    \ objects instead of primary text strings, but developers do not throw away these\
    \ differences. We can convert the String object to the initial text string that\
    \ is equivalent by using the `valueOf()` function:\n\n```javascript\nconsole.log\
    \ (eval (s2.valueOf ())); // 4\n```\n\n## Functions of the String function\n\n\
    - **String.prototype**\nThis property allows adding attributes that are available\
    \ to all objects whose type is String.\n\n### String.fromCharCode()\nCreate a\
    \ text string using a string of Unicode values.\n\n### String.fromCodePoint()\n\
    Create a text string using a string of character values (code points).\n\n###\
    \ String.raw()\nCreate a text string from a raw template.\n\n### String.fromCharCode()\
    \ detailed\n\nThe `String.fromCharCode()` static function returns a constructed\
    \ text string using a string of Unicode character values.\n\n#### General structure\n\
    ```javascript\nString.fromCharCode (num1 [, ... [, numN]])\n```\n- **num1, ...,\
    \ numN**: A string of numbers representing Unicode values. The allowed domain\
    \ is between 0 and 65535 (i.e., 0xFFFF), and the larger numbers of 0xFFFF will\
    \ be truncated.\n\n#### Returned value\nA string containing characters that are\
    \ linked to the Unicode values passed to the function.\n\n#### Description\nThis\
    \ function returns a primitive text string and does not return a String object.\n\
    \nSince the `fromCharCode` function is a static method of the String object, you\
    \ should always use it as `String.fromCharCode()`, since you can not use it as\
    \ part of your String object.\n\n#### Examples\nThe following example shows the\
    \ use of the `fromCharCode()` function:\n\n```javascript\nString.fromCharCode\
    \ (65, 66, 67); // \"ABC\"\nString.fromCharCode (0x2014); // \"—\"\nString.fromCharCode\
    \ (0x12014); // \"—\" The character 1 will be ignored\n```\n\n#### Handle values\
    \ larger than the maximum\nIt is true that Unicode values are commonly represented\
    \ by a 16-bit character (as previously expected during the JavaScript drafting\
    \ process). We could use the `fromCharCode()` function to recreate a single character\
    \ from the majority of values (UCS-2 values, which are a subset of UTF-16 - where\
    \ the most common characters are).\n\nFor all valid Unicode values (up to 21 bits),\
    \ using the `fromCharCode()` function alone is not appropriate, because characters\
    \ with large values use two digits to represent a single character; therefore,\
    \ `String.fromCodePoint()` was added as part of the ECMAScript 2015 standard (ES6)\
    \ to return such pairs, allowing the representation of characters with values\
    \ greater than the maximum.\n\nSupports all browsers.\n\n### String.fromCodePoint()\
    \ detailed\n\nThe `String.fromCodePoint()` static function returns a constructed\
    \ text string using a string of code points.\n\n#### General structure\n```javascript\n\
    String.fromCodePoint (num1 [, ... [, numN]])\n```\n- **num1, ..., numN**: A string\
    \ of numbers that represent the values of the characters (code points).\n\n####\
    \ Returned value\nA text string that contains characters associated with the values\
    \ of the characters passed to the function.\n\n#### Exceptions\nThe `RangeError`\
    \ exception will be called if an invalid Unicode character value is passed (for\
    \ example: \"RangeError: NaN is not a valid code point\").\n\n#### Description\n\
    This function returns a primitive text string and does not return a String object.\n\
    \nSince the `fromCodePoint` function is a static method of the String object,\
    \ you should always use it as `String.fromCodePoint()`, since you can not use\
    \ it as part of your String object.\n\n#### Examples\nThe following examples show\
    \ the use of the `fromCodePoint()` function:\n\n```javascript\nString.fromCodePoint(42);\
    \ // \"*\"\nString.fromCodePoint(65, 90); // \"AZ\"\nString.fromCodePoint(0x404);\
    \ // \"\\u0404\"\nString.fromCodePoint(0x2F804); // \"\\uD87E\\uDC04\"\nString.fromCodePoint(194564);\
    \ // \"\\uD87E\\uDC04\"\nString.fromCodePoint(0x1D306, 0x61, 0x1D307); // \"\\\
    uD834\\uDF06a\\uD834\\uDF07\"\n```\n\n```javascript\nString.fromCodePoint('_');\
    \ // RangeError\nString.fromCodePoint(Infinity); // RangeError\nString.fromCodePoint(-1);\
    \ // RangeError\nString.fromCodePoint(3.14); // RangeError\nString.fromCodePoint(3e-2);\
    \ // RangeError\nString.fromCodePoint(NaN); // RangeError\n```\n\nThe `String.fromCharCode()`\
    \ function cannot find characters whose values are greater than the maximum. The\
    \ following example will return a 4-byte character, plus 2-byte characters (i.e.,\
    \ it returns one character that represents a 2-bit text string instead of 1):\n\
    \n```javascript\nconsole.log(String.fromCodePoint(0x2F804));\n```\n\n#### Reduced\
    \ support for browsers\nThe `String.fromCodePoint` function has been added to\
    \ ECMAScript 2015 (ES6) and is not yet supported in all browsers, so the following\
