  md: '# Differences between Java and Javascript


    We are counting various interesting issues and curiosities that serve as an introduction
    to the Javascript Manual and we want to discuss one of the most typical associations
    that are made when hearing about Javascript. We mean to relate it to another programming
    language, called Java, which doesn''t have much to do with it.


    Javascript was really called that because Netscape (the browser that launched
    Javascript), which was allied with the creators of Java at the time (Sun Microsystems),
    wanted to take advantage of the brand image and popularity of Java, as a maneuver
    for the expansion of its new language. All in all, a product was created that
    had certain similarities, such as language or name syntax. He was made to understand
    that he was a little brother and'
