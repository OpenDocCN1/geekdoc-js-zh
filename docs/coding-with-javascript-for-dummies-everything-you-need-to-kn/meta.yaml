    专门用于在网页上执行操作，但也让许多人陷入了它们是同一种语言的误区。


    我们要明确一点：Javascript 与 Java 毫无关系，除了正如人们所读到的，这两种语言的创建者之间有一项合作协议。它们一直是完全不同的产品，除了相同的语法之外，彼此之间没有任何关联，尽管事实上，两者的语法都继承自另一种流行的编程语言——C。


    ## Java 和 Javascript 的区别


    Java 和 Javascript 之间最显著的差异


    这两种语言之间一些最具代表性的差异如下：


    - **编译器。** 使用 Java 编程需要开发工具包和编译器。然而，Javascript 并不是一种需要编译程序的语言，而是由浏览器在读取页面时进行解释执行。


    - **面向对象。** Java 是一种面向对象的编程语言。（稍后我们会介绍面向对象的含义，如果你还不了解的话。）Javascript 是一种"多范式"语言；它不要求面向对象编程，但也允许这样做。这意味着我们可以用
    Javascript 编程而不必创建类，就像在 C 或 Pascal 等结构化编程语言中那样。


    - **用途。** Java 原则上比 Javascript 强大得多，因为它是一种通用编程语言。使用 Java 可以开发各种各样的应用程序；然而，使用 Javascript
    只能编写在网页上运行的程序。不过说实话，从上个十年开始，Javascript 已经大幅扩展，如今我们可以用这种语言制作各种类型的应用程序，如控制台程序、移动应用、桌面应用等。因此，今天可以说
    Javascript 几乎和 Java 一样强大，甚至更加强大。


    - **静态类型。** Java 是一种强类型编程语言（也称为静态类型）。这意味着在 Java 中声明变量时，我们必须指定其类型，并且在整个程序执行过程中不能更改为其他类型。而
    Javascript 没有这一特性，它是一种动态类型语言（或弱类型语言），我们可以在变量中存放任何类型的数据。此外，我们可以随时更改变量的数据类型。


    - **开放语言 / 专有语言。** 另一个重要的区别是，Javascript 基于开放标准，没有特定的所有者，因此任何厂商都可以自由地在其系统上实现它。而
    Java 是由公司（目前是 Oracle）拥有的语言，因此它是以特定的商业方向来运作的。


    - **其他特性。** 如我们所见，Java 要复杂得多，但也更加强大和健壮。Java 比 Javascript 拥有更多的功能，需要更深入的学习才能掌握。Javascript
    让学习变得简单，即使对于没有编程经验的人也是如此，并且可以快速编写程序，用少量代码和精力就能获得相当不错的效果。


    因此，Java 和 Javascript 之间的差异是非常显著的。它们也用于截然不同的用途。Java 更适合开发复杂的应用程序，面向商业领域，或为 Android
    手机开发应用。Javascript 则主要用于开发较重的应用程序，主要面向 Web。


    我们要指出的是，目前 Javascript 的 Web 定位并不一定被视为唯一的用途。正如我们所说，几乎可以使用 Javascript 制作任何类型的程序，近年来它已经占据了越来越多的领域。此外，随着
    Javascript 标准新版本的推出，它变得更加健壮，也更适合大型应用。


    ## 开始之前


    作为 Javascript 手册的引言，有几点我们想在开始编程之前说明。首先，最好对这种语言可能的应用有一个更具体的概念，这些应用可以在无数网站上找到。此外，我们还想讨论开始工作所需的工具和先验知识。


    ## Javascript 的用途


    也许今天再说 Javascript 的用途显得多余，但让我们简要了解一下这种语言在网络中的一些应用，以便了解它的可能性。


    就拿 DesarrolloWeb.com 来说，它使用 Javascript 来实现顶部菜单，在每个主选项中显示不同的链接。我们偶尔会更改页面，但在当前网站设计中，诸如"登录"框等元素也通过
    Javascript 实现了动态效果。


    目前几乎所有稍有复杂程度的网页都使用 Javascript，因为它已成为所谓的 Web 2.0 和丰富用户体验的标志性技术之一。例如，Facebook、Twitter
    或 Youtube 等热门网站大量使用 Javascript。更具体地说，当我们在社交网络上点击链接评论某事时，页面上会显示一个小表单，仿佛变魔术般出现，然后无需离开页面即可发送。同样，当我们在
    YouTube 上对视频投票，或者 Twitter 短消息中输入的字符被计数时，Javascript 都被用来实现仅靠 HTML 无法完成的小功能。实际上，你可以在任何稍有复杂度的页面中看到
    Javascript 的例子。一些我们无数次见过的例子包括：用于选择日期的动态日历、计算器或货币转换器、富文本编辑器、动态浏览器等。


    在网页上发现 Javascript 用来实现简单或不那么简单的效果更为常见，比如动态浏览器、打开辅助窗口、表单验证等。我们敢说这种语言在这些情况下确实非常有用，因为这些典型效果的复杂度刚好可以在几分钟内实现，且不会有出错的可能。然而，除了这些简单的例子，我们还可以在互联网上找到许多应用程序，它们的部分功能基于
    Javascript，使网页变成了真正的交互式程序，用于管理各种资源。明显的例子包括在线办公应用，如 Google Docs、Office Online 或
    Google Calendar。


    ## 使用 Javascript 需要什么


    用 Javascript 编程基本上与用 HTML 开发网页所需的工具相同。一个文本编辑器和一个兼容 Javascript 的浏览器。任何一台现代电脑都具备用
    Javascript 编程所需的一切。例如，Windows 用户在其典型操作系统安装中就有一个文本编辑器——记事本，以及一个浏览器——Internet Explorer。


    ## 推荐的先验知识


    事实上，开始用 Javascript 编程不需要太多知识基础。很可能，如果你正在阅读这些文字，你已经具备了工作所需的一切，因为你已经对网站开发有了一定的了解，并且会发现要做某些事情，了解一些
    Javascript 是很有帮助的。


    不过，最好能够熟练掌握 HTML，至少足以编写该语言的代码而不需要思考你在做什么。对 CSS 的中等程度了解以及一些编程语言的先前经验也会很有用，尽管在 DesarrolloWeb.com
    的这本手册中，我们将尝试让从未编过程的人也能理解 Javascript。


    ## 第一章

    ### 浏览器和 Javascript 版本


    在继续介绍 Javascript 的同时，也有必要介绍存在的不同 Javascript 版本，它们随着浏览器版本的演变而不断发展。这种语言在其发展历程中不断进步，能力也在不断增强。


    这是一个有趣的知识点，因为当我们使用 Javascript 开发时，我们直接依赖于执行平台以及是否与现代语言特性兼容。


    首先要提前告知大家，在这本 Javascript 手册中，我们将使用在所有浏览器中都完全普及的版本，因此我们解释的任何内容都可以毫无问题地应用。

