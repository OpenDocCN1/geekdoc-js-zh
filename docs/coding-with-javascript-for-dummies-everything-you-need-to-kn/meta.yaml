    \ the Javascript Manual and browser objects. Having clarified that point, it should\
    \ be noted that Javascript is somewhat particular when creating objects, basically\
    \ because traditionally there is no \"class\" concept.\n\nTo be more exact, in\
    \ Javascript, ES5, classes are created by means of functions and with the new\
    \ operator you create objects from those functions, but there are no classes like\
    \ the ones we know in other more traditional languages.\n\nNote: Classes already\
    \ exist in ES6 and Javascript is capable of generating classes and from them producing\
    \ objects, like other languages. You get more information in the ES6 Manual.\n\
    \nThe other alternative to create objects in Javascript is by means of object\
    \ literals, which are nothing more than the definition of the object by means\
