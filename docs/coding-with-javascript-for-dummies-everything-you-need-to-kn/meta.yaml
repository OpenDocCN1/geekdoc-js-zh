  md: '# # Operators precedence


    The evaluation of a sentence that we have seen in the previous examples is quite
    simple and easy to interpret, but when a multitude of different operators come
    into play in a sentence, there may be confusion when interpreting it and elucidating
    which operators are the ones that they run before others. To set some guidelines
    in the evaluation of the sentences and that they are always executed the same
    and with common sense, there is the precedence of operators, which is nothing
    more than the order in which the operations they represent will be executed. Initially,
    all operators are evaluated from left to right, but there are additional rules,
    whereby certain operators are evaluated before others. Many of these rules of
    precedence are derived from mathematics and are common to other languages, we
    can see them below.


    +   - **() []. Parentheses, square brackets, and the dot operator for objects**

    - **! - ++ - negation, negative and increments**

    - *** /% Multiplication division and module**

    - **+ - Add and subtract**

    - **<< >> >>> Bit level changes**

    - **<<=>> = Conditional operators**

    - **==! = Conditional operators of equality and inequality**

    - **& ^ | Bit-level logic**

    - **&& || Boolean logicians**

    - **= += -= *= /= %= <<= >>= >>= &= ^= =! = Assignment**


    In the following examples we can see how expressions could become confusing, but
    with the operator precedence table we will be able to understand without errors
    what is the order in which they are executed.


    ```

    12 * 3 + 4 - 8/2% 3

    ```'
