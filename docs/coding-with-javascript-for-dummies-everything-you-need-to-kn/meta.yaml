    ## 在旧浏览器中隐藏 Javascript 脚本


    在 Javascript 手册之前的章节中，我们已经看到该语言是从 Netscape 2.0 和 Internet Explorer 3.0 开始实现的。即便对于那些不了解的人来说，也可以这么说：存在一些运行在特定操作系统上的浏览器，在这些浏览器中你只能显示文本，且某些技术和应用程序不可用，例如图像的使用、不同的排版字体或
    Javascript 本身。


    因此，并非所有访问我们页面的用户所使用的浏览器都能理解 Javascript。在脚本未被解析的情况下，浏览器会认为其代码是页面本身的文本，从而将脚本在文档正文中呈现，就像普通文本一样。为了防止浏览器在不理解脚本时将其文本写入页面，你必须使用
    HTML 注释（`<!-- HTML comment -->`）来隐藏它们。此外，在本文中，我们还将学习如何在仅不支持 Javascript 的浏览器中显示一条消息。


    更新：目前我们可以说，几乎 100% 的可用浏览器都支持 Javascript，或者至少能识别 script 标签，因此，即使该功能被禁用，它们也不会显示我们
    Javascript 程序的文本。因此，目前对于旧浏览器来说，执行隐藏页面脚本代码的操作已不再至关重要。然而，如果我们想制作一个完全正确的页面，学习如何隐藏脚本以使其永远不会在页面上显示为文本仍然是有用的。


    ## 使用 HTML 注释隐藏 Javascript 代码


    让我们看一个使用 HTML 注释来隐藏 Javascript（或者更准确地说，隐藏 Javascript 脚本代码）的代码示例。


    ```javascript

    <SCRIPT>

    <!--

    Javascript code

    // -->

    </SCRIPT>

    ```


    我们看到 HTML 注释的开始部分与我们在 HTML 中所熟知的一样，但注释的结束部分有一个特点，它以双斜杠开头。这是因为注释的结尾包含几个 Javascript
    识别为运算符的字符，在尝试解析它们时会抛出语法错误消息。为了让 Javascript 不地发出错误消息，在 HTML 注释之前放置这个双斜杠，而这本身就一个
    Javascript 注释，我们在稍后讨论语法时会了解到。


    HTML 注释的开始部分不需要用双斜杠来注释，因为 Javascript 能很好地理解这仅仅是为了隐藏代码。此处澄清一点：如果我们在这行加上两条斜杠，它们在旧浏览器中会被视为在
    HTML 注释之外。旧浏览器不理解 `<SCRIPT>` 标签，因此它们不会像处理任何未知标签那样被解析。


    ## 使用 `<NOSCRIPT>` 为旧浏览器显示消息


    我们可以为不理解 Javascript 的浏览器指定一段替代文本，以告知它们此处应执行脚本，且页面未能以 100% 的能力运行。我们还可以建议访问者将浏览器更新到兼容语言的版本。为此，我们使用
    `<NOSCRIPT>` 标签，在该标签及其对应的闭合标签之间，我们可以放置脚本的替代文本。


    ```html

    <SCRIPT>

    javascript code

    </SCRIPT>

    <NOSCRIPT>

    This browser does not understand the scripts that are running, you must update
    your browser version to a newer one.

    <br> <br>

    <a href="http://netscape.com"> Netscape </a>. <br>

    <a href="http://microsoft.com"> Microsoft </a>.

    </NOSCRIPT>

    ```


    ## 关于脚本的更多内容


    在本文中，我们将介绍 SCRIPT 标签中可以指定的一个属性，该属性用于指示我们将要使用的语言。此外，我们将展示另一种在页面上关联 Javascript 代码的非常有用且基础的方法：通过外部文件。这一点至关重要，我们需要特别注意，因为这无疑是最常用的工作方式。


    ## 放置 Javascript 脚本的有趣方法


    ### 指明我们使用的语言


    更新：如今不再需要指定我们使用的脚本语言。原因是 Javascript 是唯一被工业界认可的 Web 页面脚本语言。因此，“language”属性实际上是不必要的。


    `<SCRIPT>` 标签有一个属性用于指示我们使用的语言及其版本。例如，我们可以指明我们使用的是 Javascript 1.2 或 Visual Basic
    Script（另一种仅兼容 Internet Explorer 的客户端浏览器脚本编程语言）。


    该属性即为 "language"，最常见的是简单地指明脚本编写所用的语言。默认语言是 Javascript，所以如果我们不使用这个属性，浏览器会认为编程语言是
    Javascript。一个人们经常在无意中犯错的细节是，language 是用两个 -g- 编写的，而不是像西班牙语那样用 -g- 和 -j-。


    ```html

    <script language="javascript">

    ```


    “type” 属性的使用：

    当我们放置 SCRIPT 标签时，必须使用 “type” 属性来指明我们所做的脚本编码类型以及所使用的语言。


    ```html

    <script type="text/javascript">

    ```


    “type” 属性对于在最新版本的 HTML 中正确验证您的文档是必要的。


    关于 HTML 版本的注意：随着 HTML5 的出现，指定语言和类型（language 和 type 属性）的需求被取消了，因此，使用 script 标签就足以开启一个
    Javascript 代码块。然而，在之前的 HTML 版本中，我们需要定义 “type” 属性。虽然在 HTML 4.01 过渡版中我们可以正确验证 language
    属性，但在严格 HTML 模式下它将无法通过验证，因此我们不建议在任何情况下使用 “language”。在 DesarrolloWeb.com 使用了 language
    的示例中，请忽略它。


    ## 引入外部 Javascript 文件


    另一种在 Web 页面中引入脚本的方法（自 Javascript 1.1 起实现）是引入外部文件，你可以在其中放置许多在页面上使用的函数。文件通常具有 `.js`
    扩展名，并按以下方式引入。


    ```html

    <script src="external_file.js"></script>

    ```


    在 `<SCRIPT>` 标签内可以编写任何文本，浏览器都会忽略它；然而，不理解 SRC 属性的浏览器会根据指令显示这段文本。这种情况在目前的浏览器环境中非常罕见。因此，并不建议在用于引入外部文件的脚本块内部放置任何
    Javascript 代码。


    我们引入的文件（在本例中为 "external_file.js"）必须仅包含 Javascript 语句。我们不得包含任何形式的 HTML 代码，甚至不能包含
    `<SCRIPT>` 和 `</SCRIPT>` 标签。


    ## 使用外部 Javascript 代码文件的重要性


    在本书的教学层面，我们经常采用将 Javascript 代码直接包含在 HTML 文档内部的实践。这在表达小型 Javascript 示例时非常方便。然而，在专业层面，这不是一个好的实践，建议将所有或大部分
    Javascript 代码放在外部引入的 “.js” 文件中。推荐这种实践的原因有 several，其中我们可以强调：


    - 从代码分离的角度来看，每个文件应该只包含一种语言。HTML 文档放在 “.html” 文件中，CSS 文档放在 “.css” 文件中，Javascript
    也同样分离在其 “.js” 文件中。


    - 外部文件允许浏览器对其进行缓存，因此当再次访问页面时，代码已在浏览器中，无需重新下载。这一点在许多页面加载相同的 Javascript 代码时尤为重要，因为浏览器实际上只需下载一次
    “.js” 文件，其余时间将从缓存中读取，从而节省传输量并提高加载速度。


    - 当你掌握了更高级的 Javascript 知识后，你会发现可以在 script 标签中使用像 “defer” 或 “async” 这样的属性。这两个属性都会让浏览器在执行位于
    HTML 内容中间的外部脚本时不再停止，而是继续分析页面并渲染其内容，同时下载文件。因此，这两个属性都能优化页面加载，提高浏览器向用户呈现内容的速度。


    注意：当你使用 “defer” 时，文件加载与解析 HTML 及其他外部文件并行地进行，但执行会被推迟，直到浏览器完成页面的解析和渲染。当你使用 “async”
    时，意味着脚本在页面分析的同时被下载，并且一旦下载完成就会立即执行，而无需等待分析完成。

