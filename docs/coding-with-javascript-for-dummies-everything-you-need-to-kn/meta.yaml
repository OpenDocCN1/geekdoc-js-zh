  md: '# Exceptions


    The TypeError exception will be called if the first broker is not a properly defined
    object.


    # the description


    In most cases, the String.raw () function is used with text strings that represent
    the templates. The first format mentioned above is rarely used, because the JavaScript
    engine will automatically call this format with the necessary arguments.


    # Examples


    The following examples show that the raw () function is used:


    ```

    String.raw`Hi \n $ {2 + 3}! `;

    // ''Hi \n5!'', The character after ''Hi''

    // is not a newline character,

    // ''\'' and ''n'' are two characters.


    String.raw`Hi \u000A! `;

    // ''Hi \u000A!'', Same here, this time we will get the

    // \, u, 0, 0, 0, A, 6 characters.

    // All kinds of escape characters will be ineffective

    // and backslashes will be present in the output string.

    // You can confirm this by checking the .length property

    // of the string.

    ```'
