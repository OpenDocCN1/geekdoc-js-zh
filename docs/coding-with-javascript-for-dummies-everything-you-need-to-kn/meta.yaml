  md: '# What is a function


    When making a slightly large program, there are certain processes that can be
    conceived independently, and which are easier to solve than the whole problem.
    Furthermore, these are usually carried out repeatedly throughout the execution
    of the program. These processes can be grouped into a function, defined so that
    we do not have to repeat that code over and over in our scripts, but simply call
    the function and it is in charge of doing everything it should.


    So we can see a function as a series of instructions that we include within the
    same process. This process can then be executed from any other site just by calling
    it. For example, on a web page there may be a function to change the color of
    the background and from any point on the page we could call it to change the color
    when we want.


    **Note: If we want, we can expand this description of the functions in the article
    Function concept.**


    The functions are constantly used, not only those that you write, but also those
    that are already defined in the system, since all programming languages usually
    have a lot of functions to carry out common processes, such as obtaining the time,
    printing a message on the screen or convert variables from one type to another.
    We''ve already seen some function in our simple examples above. For example, when
    we were making a document.write () we were actually calling the write () function
    associated with the page document, which writes text to the page.


    In the chapters of functions we will first see how to perform our own functions
    and how to call them later. Throughout the manual we will see many of the functions
    defined in Javascript that we must use to perform different types of common actions.'
  merge: -1
