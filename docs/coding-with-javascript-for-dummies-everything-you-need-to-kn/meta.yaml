    It is true that Unicode values are commonly represented by a 16-bit character
    (as previously expected during the JavaScript drafting process). We could use
    the fromCharCode () function to recreate a single character from the majority
    of values (UCS-2 values, which are a subset of UTF 16 - where the most common
    characters).


