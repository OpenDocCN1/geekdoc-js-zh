    \n特别注意：\n- **bold** 标记保留并翻译内容\n- `code` 不翻译\n- [link](url) 保留格式但翻译文本\n- 代码块保持原样\n\
    - 不能重复输出原文\n\n让我开始逐段翻译...\n\n原始比较长，我需要完整翻译所有部分，确保不遗漏任何细节。\n\n[content]\n## JavaScript\
    \ 中的数组\n\n在编程语言中，有一些特别的数据结构帮助我们存储比简单变量更复杂的信息。在所有语言中，一个典型的结构就是**数组**，它就像一个可以输入多个值的变量，而不像普通变量那样只能存储一个值。\n\
    \n数组允许我们保存多个变量并独立访问它们，这就像拥有一个带有不同隔间的变量，我们可以在其中输入不同的数据。为此我们使用一个索引，用以指定我们正在引用的隔间或位置。\n\
    \n注意：数组在 JavaScript 1.1 或更高版本中引入，也就是说，我们只能从支持该版本的浏览器（如 3.0 及以上版本）中使用它们。对于较旧的浏览器，你可以使用面向对象编程语法来模拟数组，但事实上，目前我们不必担心这种限制。此外，考虑到通过对象模拟数组的复杂性，至少在我们初次接触时以及少数需要的情况下，我们认为最好还是忘记那件事，直接使用数组。因此，在本篇文章和后续文章中，我们将介绍如何使用真正的\
    \ JavaScript 数组。\n\n## JavaScript 数组的创建\n\n使用数组的第一步是创建它。为此我们使用浏览器中已经实现的一个 JavaScript\
    \ 对象。我们稍后会解释什么是面向对象编程，但目前不需要理解这个概念也能使用数组。以下是创建数组对象的语句：\n\n```javascript\nvar myArray\
    \ = new Array ()\n```\n\n这会在当前运行的页面上创建一个数组。该数组在创建时没有任何内容，也就是说，它没有创建任何隔间或分格。我们也可以创建数组时指定隔间数量：\n\
    \n```javascript\nvar myArray = new Array (10)\n```\n\n在这种情况下，我们指示数组将有 10 个位置，即\
    \ 10 个可以存储数据的空间。\n\n需要注意的是，在 JavaScript 代码中，**Array** 这个词的首字母需要大写。由于在 JavaScript\
    \ 中大小写是有区别的，如果写成小写将无法工作。\n\n无论是否指定了 JavaScript 数组的隔间数量，我们都可以向数组中输入任何数据。如果隔间已创建，数据直接存入；如果隔间尚未创建，则会自动创建再存入数据，因此最终结果是相同的。这种隔间创建是动态发生的，与脚本执行同步。下面我们来看如何向数组中输入值。\n\
    \n```javascript\nmyArray[0] = 290\nmyArray[1] = 97\nmyArray[2] = 127\n```\n\n\
    通过在方括号中指定要保存数据的索引位置来引入数据。在这个例子中，我们在位置 0 存入了 290，在位置 1 存入了 97，在位置 2 存入了 127。\n\n\
    JavaScript 中的数组总是从位置 0 开始，因此一个拥有 10 个位置的数组，例如，将有从 0 到 9 的隔间。要从数组中获取数据，我们采用同样的方法：在方括号中放入要访问的位置索引。下面来看如何将数组的内容打印到屏幕上。\n\
    \n```javascript\nvar myArray = new Array (3)\n\nmyArray[0] = 155\nmyArray[1] =\
    \ 4\nmyArray[2] = 499\n\nfor (i = 0; i < 3; i++) {\n  document.write (\"Position\
    \ \" + i + \" of the array: \" + myArray[i])\n  document.write (\"<br>\")\n}\n\
    ```\n\n我们创建了一个具有三个位置的数组，然后在每个位置中输入了一个值，最后将它们打印出来。通常，遍历数组以打印其位置或进行其他操作，都是通过循环来实现的。在这个例子中，我们使用了一个\
    \ FOR 循环，从 0 遍历到 2。\n\n我们可以在另一个页面中查看运行示例。\n\n## 数组中的数据类型\n\n在数组的隔间中，我们可以保存任何类型的数据。下面是一个存储字符数据的数组示例：\n\
    \n```javascript\nmyArray[0] = \"Hello\"\nmyArray[1] = \"a\"\nmyArray[2] = \"all\"\
    \n```\n\n甚至在 JavaScript 中，我们可以在同一个数组的不同隔间中保存不同类型的数据。也就是说，我们可以在某些隔间中存入数字，在其他隔间中存入文本、布尔值或任何其他我们想要的内容。\n\
    \n```javascript\nmyArray[0] = \"develololoweb.com\"\nmyArray[1] = 1275\nmyArray[1]\
    \ = 0.78\nmyArray[2] = true\n```\n\n## 数组声明与简写初始化\n\n在 JavaScript 中，我们有一种简化的方式来声明数组并在同一步骤中加载值。请看以下代码：\n\
    \n```javascript\nvar arrayRapido = [12, 45, \"array initialized in its declaration\"\
    ]\n```\n\n正如你所见，我们定义了一个名为 arrayRapido 的变量，并在方括号中指示了多个用逗号分隔的值。这等同于使用 `Array()`\
    \ 函数声明数组，然后再逐个加载值。\n\n## 数组长度\n\n在《JavaScript 手册》的上篇文章中，我们开始介绍数组的概念及其在 JavaScript\
    \ 中的使用。在这篇文章中，我们将继续深入这个话题，展示其 length 属性的用法。\n\nJavaScript 中的所有数组，除了存储每个隔间的值之外，还存储了它们拥有的位置数量。为此，它们使用数组对象的一个属性，即\
    \ **length** 属性。我们将在后续关于对象的文章中解释什么是属性，但在当前情况下，我们可以将其想象为一个额外的变量，除了位置外，它还存储了一个等于数组隔间数量的数字。\n\
    \n要访问对象的属性，必须使用点运算符（.）。我们写出想要访问其位置数量的数组名称，不带括号，后跟一个点和 **length** 这个词。\n\n```javascript\n\
    var myArray = new Array ()\n\nmyArray[0] = 155\nmyArray[1] = 499\nmyArray[2] =\
    \ 65\n\ndocument.write (\"Array length: \" + myArray.length)\n```\n\n这段代码会在屏幕上打印数组的位置数量，本例中为\
    \ 3。我们应注意，拥有 3 个位置的数组其索引范围是从 0 到 2。\n\nlength 属性非常常用于遍历数组中的所有位置。为了说明这一点，我们将看到一个遍历此数组以显示其值的示例。\n\
    \n```javascript\nfor (i = 0; i < myArray.length; i++) {\n  document.write (myArray[i])\n\
    }\n```\n\n请注意，for 循环在 i 小于数组长度时执行，长度值取自其 length 属性。\n\n下面的示例将帮助我们更好地理解数组的遍历、length\
    \ 属性的工作原理以及位置的动态创建。我们将创建一个具有 2 个位置的数组并填充其值。随后在数组的第 5 个位置引入一个值。最后，我们将打印数组的所有位置，看看会发生什么。\n\
    \n```javascript\nvar myArray = new Array (2)\n```\n\n```javascript\nmyArray[0]\
    \ = \"Colombia\"\nmyArray[1] = \"United States\"\n```\n\n```javascript\nmyArray[5]\
    \ = \"Brazil\"\n```\n\n```javascript\nfor (i = 0; i < myArray.length; i++) {\n\
    \  document.write (\"Position \" + i + \" of the array: \" + myArray[i])\n  document.write\
    \ (\"<br>\")\n}\n```\n\n这个示例很简单。可以看到我们遍历了数组，从 0 到数组的位置数（由 length 属性指示）。在遍历过程中，我们打印了位置编号及其对应的数组内容。但我们可能会有一个疑问：这个数组的元素数量是多少？因为我们最初声明了\
    \ 2 个位置，随后又在第 5 个位置引入了第三个。通过查看程序输出，我们就会知道答案。输出大致如下：\n\n**Array position 0: Colombia**\n\
    **Array position 1: United States**\n**Array position 2: null**\n**Array position\
    \ 3: null**\n**Array position 4: null**\n**Array position 5: Brazil**\n\n可以清楚地看到，数组的长度已经变为\
    \ 6，从 0 到 5。当在第 5 个位置输入数据时，系统动态扩展了数组大小，并填充了中间位置。这是一个关于数组动态性质的优秀示例。\n"
