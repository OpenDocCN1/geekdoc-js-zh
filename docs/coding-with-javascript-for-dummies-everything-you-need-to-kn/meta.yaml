  md: '# # General introduction to objects in Javascript


    We are going to introduce ourselves to a very important Javascript topic such
    as objects. It is a topic that we have not yet seen and on which we are going
    to constantly deal with since most of the things in Javascript, even the simplest,
    we are going to do through the handling of objects. In fact, in the examples made
    so far we have made great efforts not to use objects and even so we have used
    them on occasion, since it is very difficult to find examples in Javascript that,
    although simple, do not make use of them.


    Object Oriented Programming (OOP) represents a new way of thinking when making
    a program. Javascript is not a pure object-oriented programming language because,
    although it uses objects many times, we don''t need to program all of our programs
    based on them. In fact, what we are generally going to do with Javascript is use
    objects and not so much object oriented programming. Therefore, the way of programming
    is not going to change much compared to what we have seen so far in the Javascript
    Manual. In summary, what we have seen so far regarding syntax, functions, etc.
    it is still perfectly valid and can be used just as indicated. We are only going
    to learn a kind of new structure such as objects.


    Note: To start getting a bit soaked about objects we have a small article published
    in DesarrolloWeb about object-oriented programming. It would be highly recommended
    that you read it, because several concepts are explained in which we will not
    go into so much detail. If you already know the POO, continue reading without
    pause, but if you want to go deeper, remember that we also have a complete Object
    Orientation Manual. If you like to watch videos we also recommend the What are
    the objects class taught in the Video Programming Course.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# # What is an object


    Although we are not going to go into detail with the concetos, as they are very
    well explained in references that we have already indicated, objects are a programming
    language tool in which two fundamental things come together: data and functionality.
    Every computer program basically deals with those two things in some way. With
    what we have seen so far we had the data in variables and the functionality in
    functions, right? because in the world of objects, both data and functionality
    are in the same structure, the object.


    The thing is that now you need to learn new names with which to refer to the data
    and functionality grouped into an object:


    +   - Properties: In objects the properties refer to the data

    - Methods: In objects, methods refer to functionality


    Imagine you have a button object (a browser button, something you can press to
    perform an action). The button has a written text, because that text would be
    a data and therefore we would call it property. Another property of a button would
    be whether or not it is activated. On the other hand, a button could have associated
    functionality, which would be in a method, such as processing the action of a
    click. Imagine something more generic like a phone. The phone may have properties
    such as make, model, operating system, and methods such as turning on, off, calling
    a number, etc.


    In pure object-oriented programming languages, such as Java, you always have to
    program based on objects. To program you would have to create "classes", which
    are a kind of "molds" from which objects are created. The program would solve
    any need by creating objects based on those molds (classes), there being several
    (tens, hundreds or thousands) of objects of different classes. The objects would
    have to collaborate with each other to solve any type of action, as just in systems
    like an airplane there are various objects (the engine, propellers, controls ...)
    that collaborate with each other to solve the need to carry passengers or merchandise
    on trips aerial.'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'However, as we have been saying, in Javascript it is not so much object-oriented
    programming, but using objects. Many times they will be objects already created
    by the browser itself (the browser window, an HTML document being displayed, an
    image or a form within that HTML document, etc.), and other times they will be
    objects created by yourself or by others. developers that help you do specific
    things. Therefore, what we want to know to get started is the syntax you need
    to use objects, basically access their properties and execute their methods.


    Note: To know what the browser objects are, which we have available in Javascript
    to solve the needs of web pages, you have to read the manual on working with Javascript
    to use and manipulate browser resources.'
