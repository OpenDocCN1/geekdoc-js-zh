    这话只说对了一半，因为存在一些系统可以将代码从一个版本转换到另一个版本，不过目前我们不想深入这些细节。如果你感兴趣，我们建议阅读 Webpack 手册，它是众多可用于执行此任务的工具之一。


    # HTML5 API


    API 是应用程序编程接口（Application Programming Interface）的缩写。它基本上定义了如何访问系统的功能或服务，通过哪些指令以及什么流程。


    浏览器定义了 API，用于访问我们可以操作页面状态以及与外设、存储等资源交互的功能。


    浏览器 API 通常由 W3C 规范制定，并且所有网络客户端都必须忠实实现。


    这与语言版本的情况有些相似。如果浏览器版本很旧，可能不支持某些 API，因此我们必须谨慎。实际上，主要需要注意 Internet Explorer 和一些老旧的移动浏览器。


    在本手册的第一部分，我们不会涉及 HTML5 API 或浏览器资源访问的内容。这一领域是第二部分的研究主题，即客户端 JavaScript 开发。


    # 语言版本


    在本手册的第一部分，目标是学好 JavaScript，因此我们将专注于语言本身的研究。在这个意义上，我们将使用 ES5，这是能够在所有当前浏览器中工作的语言版本。


    作为一般信息，我们将总结并介绍 JavaScript 的不同版本：


    实际上，任何中等现代化的浏览器现在都具备我们需要的所有 JavaScript 功能，最重要的是，我们在学习这门语言的起步阶段可以使用的那些功能。然而，了解一下我们在本文中讨论过的
    JavaScript 早期版本可能会有些用处，权当一种趣闻。


    Javascript 1：诞生于 Netscape 2.0，支持大量的指令和函数，几乎现在存在的所有功能在第一个标准中就已经引入了。


    Javascript 1.1：这是为 3.0 浏览器到来而设计的 JavaScript 版本。相比前一个版本，它实现的功能不多，比如动态处理图像和创建数组。


    Javascript 1.2：浏览器 4.0 的版本。它的缺点是在 Microsoft 和 Netscape 平台上有一些差异，因为两款浏览器的发展路线不同，当时正处于激烈的市场争夺中。


    Javascript 1.3：5.0 浏览器实现的版本。在这个版本中，两款浏览器之间的一些差异和粗糙之处得到了修正。


    Javascript 1.5：当前版本，在撰写本文时，由 Netscape 6 实现。


    另一方面，微软也推出了其 JScript 5.5 版本演变（这是微软浏览器所使用的 JavaScript 的名称）。


    2009 年，ECMAScript 5 版本发布。这是本手册主要要讲的版本，它在市场上所有浏览器中都能工作。


    2015 年，ECMAScript 的第六个版本发布，带来了数量非常可观的新特性。这个版本完全可以使用，除了 Internet Explorer 之外。它的改进如此重要，以至于所有专业开发者都在使用，如果有必要，代码会被转译以支持旧版浏览器。这个版本在
    ES6 手册中讲解。


    目前承诺每年发布一个版本的 ECMAScript 标准。因此，存在多个标准，包含小型的增量变更，这些变更在不同浏览器中的整合速度各不相同。


    # JavaScript 版本与兼容性结论


    显而易见，在写下这些文字之后，JavaScript 还会呈现或已经呈现许多其他版本，因为随着浏览器的改进和 HTML 版本的发布，动态元素编程不断产生新的需求。然而，我们在本手册中将要学习的一切，甚至包括其他更高级的用法，都已经实现在当今存在的任何
    JavaScript 中了。


    # 第二章


    ## JavaScript 快速特效


    在深入正题之前，我们可以看看一系列可以用 JavaScript 编程实现的快速特效，这能让我们更清楚地了解这门语言的能力和威力。下面我们来看几个例子，之所以在
    JavaScript 手册的简介部分重点介绍它们，是因为它们具有最小的复杂度，而且虽然非常基础，但在阅读后续章节时，能帮助我们更准确地理解 JavaScript
    是什么。


    # 打开子窗口


    首先，让我们看看用一行 JavaScript 就能做出相当有吸引力的效果。例如，我们可以看看如何打开一个不带菜单栏的辅助窗口，显示 Google 搜索引擎。代码如下：


    ```html

    <script>

    window.open("http://www.google.com", "", "width = 550, height = 420, menubar =
    no")

    </script>

    ```


    # 欢迎消息


    我们也可以在网站首页加载完成时显示一个弹出文本框，向访客表示欢迎。


    ```html

    <script>

    window.alert ("欢迎来到我的网站。谢谢……")

    </script>

    ```


    # 当前日期


    现在让我们看看显示今天日期的简单脚本。有时候在网站上显示日期非常有趣，可以营造出页面"与时俱进"的效果，即页面是更新的。


    ```html

    <script> document.write (new Date ()) </script>

    ```


    这几行代码应该插入到页面 body 中我们希望显示最后更新日期的位置。我们可以在这里看到运行示例。


    注意：需要强调的一个细节是，日期显示的格式有些奇怪，还会显示时间和其他属性，但我们将学会如何以正确的格式精确获取我们想要的内容。

