- md: "## Javascript functions\n\nWe continue working and expanding our knowledge\
    \ of Javascript. With what we have seen so far in the Javascript Manual we already\
    \ have a certain fluency to work in this interesting programming language. But\
    \ we still have a long way to go.\n\nNow we are going to see a very important\
    \ topic, especially for those who have never programmed and with Javascript they\
    \ are taking their first steps in the world of programming since we will see a\
    \ new concept, that of function, and the uses it has. For those who already know\
    \ the concept of function it will also be a useful chapter, because we will also\
    \ see the syntax and operation of functions in Javascript.\n\n## What is a function\n\
    \nWhen making a slightly large program, there are certain processes that can be\
    \ conceived independently, and which are easier to solve than the whole problem.\
    \ Furthermore, these are usually carried out repeatedly throughout the execution\
    \ of the program. These processes can be grouped into a function, defined so that\
    \ we do not have to repeat that code over and over in our scripts, but simply\
    \ call the function and it is in charge of doing everything it should.\n\nSo we\
    \ can see a function as a series of instructions that we include within the same\
    \ process. This process can then be executed from any other site just by calling\
    \ it. For example, on a web page there may be a function to change the color of\
    \ the background and from any point on the page we could call it to change the\
    \ color when we want.\n\n**Note: If we want, we can expand this description of\
    \ the functions in the article Function concept.**\n\nThe functions are constantly\
    \ used, not only those that you write, but also those that are already defined\
    \ in the system, since all programming languages usually have a lot of functions\
    \ to carry out common processes, such as obtaining the time, printing a message\
    \ on the screen or convert variables from one type to another. We've already seen\
    \ some function in our simple examples above. For example, when we were making\
    \ a document.write() we were actually calling the write() function associated\
    \ with the page document, which writes text to the page.\n\nIn the chapters of\
    \ functions we will first see how to perform our own functions and how to call\
    \ them later. Throughout the manual we will see many of the functions defined\
    \ in Javascript that we must use to perform different types of common actions.\n\
    \n## How to write a function\n\nA function must be defined with a special syntax\
    \ that we will know next.\n\n```\nfunction functionname () {\n    function instructions\n\
    \    ...\n}\n```\n\nFirst write the word function, reserved for this use. Then\
    \ the name of the function is written, which, like variable names, can have numbers,\
    \ letters and some additional character as in underscore. Then the different instructions\
    \ of the function are placed in braces. The braces in the case of functions are\
    \ not optional, and it is also useful to always place them as seen in the example,\
    \ so that the structure of instructions included in the function is easily recognized.\n\
    \nLet's see an example of a function to write a welcome message on the page inside\
    \ `<H1>` tags so that it is more highlighted.\n\n```\nfunction writeWelcome ()\
    \ {\n    document.write (\"<H1> Hello everyone </H1>\")\n}\n```\n\nJust write\
    \ text on the page. We admit that it is such a simple function that the example\
    \ does not sufficiently express the concept of a function, but we will see other\
    \ more complex ones. H1 tags are not shown on the page, but are interpreted as\
    \ the meaning of the page, in this case we write a level 1 header. Since we are\
    \ writing on a web page, when putting HTML tags they are interpreted as what they\
    \ are.\n\n## How to call a function\n\nTo execute a function we have to invoke\
    \ it anywhere on the page. With this we will get all the instructions that the\
    \ function has between the two keys to be executed.\n\nTo execute the function\
    \ we use its name followed by the parentheses. For example, this would call the\
    \ writeWelcome() function we just created.\n\n```\nwriteWelcome ()\n```\n\n##\
    \ Where do we put the Javascript functions\n\nFunctions are one of the main components\
    \ of programs, in most programming languages. In the Javascript Manual we have\
    \ already begun to explain what a function is and how we can create and invoke\
    \ it in this language. Now we are going to deal with a topic that is not so much\
    \ about syntax and programming, but has more to do with the correct and habitual\
    \ use that is made of the functions in Javascript, which is none other than the\
    \ placement of the code of the functions in the Web page.\n\nIn principle, we\
    \ can place the functions anywhere on the page, always between `<SCRIPT>` tags,\
    \ of course. However, there is a limitation when placing it in relation to the\
    \ places from which it is called. We anticipate that the easiest is to place the\
    \ function before any call to it and thus we will surely never make a mistake.\n\
    \nThere are two possible options to put the code of a function:\n\na) Put the\
    \ function in the same script block: Specifically, the function can be defined\
    \ in the `<SCRIPT>` block where the function call is, although it does not matter\
    \ if the call is before or after the function code, within the same `<SCRIPT>`\
    \ block.\n\n```\n<SCRIPT>\nmyFunction ()\nfunction myFunction () {\n  // I do\
    \ something ...\n  document.write (\"This is fine\")\n}\n</SCRIPT>\n```\n\nThis\
    \ example works correctly because the function is declared in the same block as\
    \ its call.\n\nb) Put the function in another script block: It is also valid that\
    \ the function is in a `<SCRIPT>` block before the block where the call is.\n\n\
    ```\n<HTML>\n<HEAD>\n  <TITLE> MY PAGE </TITLE>\n<SCRIPT>\nfunction myFunction\
    \ () {\n  // I do something ...\n  document.write (\"This is fine\")\n}\n</SCRIPT>\n\
    </HEAD>\n<BODY>\n\n<SCRIPT>\nmyFunction ()\n</SCRIPT>\n\n</BODY>\n</HTML>\n```\n\
    \nWe see a complete code on how a web page could be where we have Javascript functions.\
    \ As you can see, the functions are at the top of the page (inside the HEAD).\
    \ This is an excellent place to put them, because it is assumed that they will\
    \ not be used in the header yet and we can always enjoy them in the body because\
    \ we know for sure that they have already been declared.\n\nTo make this issue\
    \ of function placement clear, let's look at the following example, which would\
    \ give an error. Look carefully at the following code, which will throw an error,\
    \ because we make a call to a function that is declared in a subsequent `<SCRIPT>`\
    \ block.\n\n```\n<SCRIPT>\nmyFunction ()\n</SCRIPT>\n\n<SCRIPT>\nfunction myFunction\
    \ () {\n  // I do something ...\n  document.write (\"This is fine\")\n}\n</SCRIPT>\n\
    ```\n\nWith this we hope to have resolved all the doubts about the placement of\
    \ the code of the Javascript functions. In the following articles we will see\
    \ other interesting topics such as the parameters of the functions.\n\n## Function\
    \ parameters\n\nIn the Javascript Manual we have previously talked about functions.\
    \ Specifically, this is the third article that we address on the subject.\n\n\
    The ideas that we have previously explained about functions are not the only ones\
    \ that we must learn to handle them to their full potential. Functions also have\
    \ data input and output. In this article we will see how we can send data to Javascript\
    \ functions."
  mdcn: "\n## Javascript 函数\n\n我们继续学习和扩展关于 Javascript 的知识。通过到目前为止在 Javascript 手册中所学的内容，我们已经具备了一定的能力来使用这门有趣的编程语言。但我们还有很长的路要走。\n\
    \n现在我们要讨论一个非常重要的话题，特别是对于那些从未编程过、正在通过 Javascript 开启编程之旅的人来说，因为我们将介绍一个新概念——函数，以及它的用途。对于那些已经了解函数概念的人来说，这一章同样有用，因为我们还将介绍\
    \ Javascript 中函数的语法和运行方式。\n\n## 什么是函数\n\n在编写稍大的程序时，有些过程可以独立设计，并且比整个问题更容易解决。此外，这些过程通常在程序执行过程中被反复执行。这些过程可以被组合成一个函数，定义好之后，我们就不必在脚本中一遍又一遍地重复编写那段代码，只需调用这个函数，它就会负责完成所有应该做的事情。\n\
    \n因此，我们可以将函数视为一组包含在同一过程中的指令。这个过程之后可以在任何其他地方被执行，只需调用它即可。例如，网页上可能有一个函数用于改变背景颜色，我们可以在页面的任何位置调用它来按需更改颜色。\n\
    \n**注意：如果需要，我们可以在函数概念一文中扩展关于函数的这个描述。**\n\n函数被频繁使用，不仅包括你自己编写的函数，还包括系统中已定义的函数，因为所有编程语言通常都有大量函数来执行常见操作，例如获取时间、在屏幕上打印消息或将变量从一种类型转换为另一种类型。我们在之前的简单示例中已经见过一些函数。例如，当我们使用\
    \ document.write() 时，我们实际上是在调用与页面文档关联的 write() 函数，它用于向页面写入文本。\n\n在函数章节中，我们将首先了解如何创建自己的函数以及如何调用它们。在整个手册中，我们将看到许多\
    \ Javascript 中预定义的函数，我们需要使用它们来执行各种常见操作。\n\n## 如何编写函数\n\n函数必须使用特殊的语法来定义，接下来我们将了解这种语法。\n\
    \n```\nfunction functionname () {\n    function instructions\n    ...\n}\n```\n\
    \n首先写上 `function` 这个关键字，它是为此用途保留的。然后写上函数的名称，与变量名一样，可以包含数字、字母以及一些附加字符如下划线。接着将函数的不同指令放在花括号中。函数中的花括号是必不可少的，并且最好像示例中那样始终放置它们，以便清晰地识别函数中包含的指令结构。\n\
    \n让我们看一个函数示例，该函数在页面上使用 `<H1>` 标签写入欢迎消息，使其更加醒目。\n\n```\nfunction writeWelcome ()\
    \ {\n    document.write (\"<H1> Hello everyone </H1>\")\n}\n```\n\n只是在页面上写入文本。我们承认这是一个非常简单的函数，示例不足以充分表达函数的概念，但我们之后会看到其他更复杂的示例。H1\
    \ 标签不会在页面上显示为标签本身，而是被解析为页面的含义，在本例中我们写入了一个一级标题。由于我们是在网页上编写内容，当使用 HTML 标签时，它们会被解析为对应的含义。\n\
    \n## 如何调用函数\n\n要执行一个函数，我们需要在页面的任意位置调用它。通过这样做，函数中两个花括号之间的所有指令都将被执行。\n\n要执行函数，我们使用函数名后跟圆括号。例如，以下代码将调用我们刚刚创建的\
    \ writeWelcome() 函数。\n\n```\nwriteWelcome ()\n```\n\n## Javascript 函数放在哪里\n\n\
    在大多数编程语言中，函数是程序的主要组成部分之一。在 Javascript 手册中，我们已经初步介绍了什么是函数，以及如何在这门语言中创建和调用它。现在我们要讨论的主题并不那么侧重于语法和编程，而是更多地涉及函数在\
    \ Javascript 中的正确和惯用方式，即函数代码在网页中的放置位置。\n\n原则上，我们可以将函数放在页面的任何位置，当然始终要在 `<SCRIPT>`\
    \ 标签之间。但是，放置位置与调用位置之间存在一定的限制。我们可以提前说明，最简单的做法是在调用函数之前放置函数定义，这样就一定不会出错。\n\n有两种放置函数代码的方式：\n\
    \na) 将函数放在同一个脚本块中：具体来说，函数可以定义在 `<SCRIPT>` 块中，与函数调用在同一个块内，无论调用是在函数代码之前还是之后，只要在同一个\
    \ `<SCRIPT>` 块内即可。\n\n```\n<SCRIPT>\nmyFunction ()\nfunction myFunction () {\n\
    \  // I do something ...\n  document.write (\"This is fine\")\n}\n</SCRIPT>\n\
    ```\n\n这个示例可以正确运行，因为函数在与调用相同的块中声明。\n\nb) 将函数放在另一个脚本块中：函数放在调用位置之前的 `<SCRIPT>` 块中也是有效的。\n\
    \n```\n<HTML>\n<HEAD>\n  <TITLE> MY PAGE </TITLE>\n<SCRIPT>\nfunction myFunction\
    \ () {\n  // I do something ...\n  document.write (\"This is fine\")\n}\n</SCRIPT>\n\
    </HEAD>\n<BODY>\n\n<SCRIPT>\nmyFunction ()\n</SCRIPT>\n\n</BODY>\n</HTML>\n```\n\
    \n我们看到了一个完整的代码示例，展示了包含 Javascript 函数的网页可以是什么样的。如你所见，函数位于页面的顶部（在 HEAD 内部）。这是一个放置函数的绝佳位置，因为我们假设在头部中还不会使用它们，而且我们始终可以在\
    \ body 中调用它们，因为我们确定它们已经被声明过了。\n\n为了让函数放置位置的问题更加清晰，让我们看以下这个会产生错误的示例。仔细阅读以下代码，它会抛出错误，因为我们在调用一个在后续\
    \ `<SCRIPT>` 块中才声明的函数。\n\n```\n<SCRIPT>\nmyFunction ()\n</SCRIPT>\n\n<SCRIPT>\n\
    function myFunction () {\n  // I do something ...\n  document.write (\"This is\
    \ fine\")\n}\n</SCRIPT>\n```\n\n通过以上内容，我们希望已经解决了关于 Javascript 函数代码放置位置的所有疑问。在接下来的文章中，我们将讨论其他有趣的话题，例如函数的参数。\n\
    \n## 函数参数\n\n在 Javascript 手册中，我们之前已经讨论过函数。具体来说，这是我们讨论该主题的第三篇文章。\n\n我们之前解释的关于函数的思路并不是充分发挥函数潜力所需的全部知识。函数还有数据的输入和输出。在本文中，我们将了解如何向\
    \ Javascript 函数发送数据。\n"
