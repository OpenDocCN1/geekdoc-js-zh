  md: "# FOR loop in Javascript\n\nThe FOR loop is used to repeat one or more instructions\
    \ a certain number of times. Among all the loops, the FOR is usually used when\
    \ we know for sure the number of times we want it to run. The for loop syntax\
    \ is shown below.\n\n```\nfor (initialization; condition; update) {\n    // statements\
    \ to execute in each iteration\n}\n```\n\nThe FOR loop has three parts included\
    \ in parentheses, which help us define how we want repetitions to be performed.\
    \ The first part is initialization, which is executed only when starting the first\
    \ iteration of the loop. In this part, the variable that we will use to keep count\
    \ of the times the loop is executed is usually placed.\n\nThe second part is the\
    \ condition, which will be evaluated every time an iteration of the loop begins.\
    \ Contains an expression to decide when to stop the loop, or rather, the condition\
    \ that must be met for the loop to continue running.\n\nFinally we have the update,\
    \ which serves to indicate the changes that we want to execute in the variables\
    \ every time the loop iteration ends, before checking if it should continue executing.\n\
    \nAfter the for, the sentences that we want to execute in each iteration are placed,\
    \ enclosed in curly braces.\n\nAn example of using this loop can be seen below,\
    \ where the numbers from 0 to 10 will be printed."
  merge: -1
  pgno: 130
