    An API is an application programming interface. Basically it indicates how the
    functionalities or services of a system are going to be accessed, through which
    instructions and what procedures.


    Browsers define an API to access the resources we have to manipulate the state
    of the page and accord to peripherals, storage, etc.


    Browser APIs are generally specified by the W3C and must be faithfully implemented
    by all web clients.


    It happens a bit the same as with the language versions. If the browser is very
    old it may not have support for some APIs, so we have to be cautious. In practice
    more than anything with Internet Explorer and some old mobile browser.


    In this first part of the manual we are not going to cover the HTML 5 APIs or
    access to the browser resources. This area is the subject of study in the second
    part, dedicated to Client-side Javascript Development.'
