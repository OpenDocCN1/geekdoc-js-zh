  md: '# IF operator


    There is an operator that we haven''t seen yet and it''s a more schematic way
    of doing some simple IFs. It comes from the C language, where very few lines of
    code are written and where the less we write the more elegant we will be. This
    operator is a clear example of saving lines and characters when writing scripts.
    We will see it quickly, because the only reason I include it is so that you know
    that it exists and if you find it on some occasion out there you can identify
    it and how it works.


    An example of using the IF operator can be seen below.


    **Variable = (condition)? value1: value2**


    This example not only performs a value comparison, it also assigns a value to
    a variable. What it does is evaluate the condition (placed in parentheses) and
    if it is positive, it assigns the value1 to the variable and otherwise it assigns
    it the value2. Let''s see an example:


    **moment = (current_time <12)? "Before noon": "After noon"**


    This example looks to see if the current time is less than 12. If so, it is now
    before noon, so assign "Before Noon" to the variable time. If the hour is greater
    than or equal to 12, it is already after noon, so the text "After noon" is assigned
    to the moment variable.'
