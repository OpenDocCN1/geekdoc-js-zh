  md: "# Parameters are passed by value\n\nIn line with the use of parameters in our\
    \ Javascript programs, we have to know that the parameters of the functions are\
    \ passed by value. This means that we are passing values and not variables. In\
    \ practice, even if we modify a parameter in a function, the original variable\
    \ that we had passed will not change its value. It can be easily seen with an\
    \ example.\n\n```\nfunction stepValue(myParameter) {\n    myparameter = 32\n \
    \   document.write(\"I have changed the value to 32\")\n}\n\nvar myVariable =\
    \ 5\nstepValue(myVariable)\ndocument.write(\"the value of the variable is:\" +\
    \ myVariable)\n```\n\nIn the example we have a function that receives a parameter\
    \ and modifies the value of the parameter assigning it the value 32. We also have\
    \ a variable, which we initialize to 5 and later we call the function passing\
    \ this variable as a parameter. As within the function we modify the value of\
    \ the parameter, it could happen that the original variable changes its value,\
    \ but since the parameters do not modify the original value of the variables,\
    \ it does not change its value.\n\nIn this way, once the function is executed,\
    \ when printing the value of miVariable on screen, the number 5 will be printed,\
    \ which is the original value of the variable, instead of 32, which was the value\
    \ with which we had updated the parameter.\n\nIn Javascript you can only pass\
    \ variables by value."
