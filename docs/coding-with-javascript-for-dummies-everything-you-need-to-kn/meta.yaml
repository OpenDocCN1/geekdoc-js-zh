    \ and occurs at the same time that the scripts are executed. Let's see below how\
    \ to enter values in our arrays.\n\n```javascript\nmyArray[0] = 290\nmyArray[1]\
    \ = 97\nmyArray[2] = 127\n```\n\nThey are introduced by indicating in square brackets\
    \ the index of the position where we wanted to save the data. In this case we\
    \ enter 290 in position 0, 97 in position 1 and 127 in position 2.\n\nArrays in\
    \ Javascript always start at position 0, so an array that has 10 positions, for\
    \ example, will have boxes from 0 to 9. To collect data from an array we do the\
    \ same: putting the index of position in square brackets which we want to access.\
    \ Let's see how the content of an array would be printed on the screen.\n\n```javascript\n\
    var myArray = new Array (3)\n\nmyArray[0] = 155\nmyArray[1] = 4\nmyArray[2] =\
    \ 499\n\nfor (i = 0; i < 3; i++) {\n  document.write (\"Position \" + i + \" of\
    \ the array: \" + myArray[i])\n  document.write (\"<br>\")\n}\n```\n\nWe have\
    \ created an array with three positions, then we have entered a value in each\
    \ of the positions of the array and finally we have printed them. In general,\
    \ traversing arrays to print their positions, or anything else, is done using\
    \ loops. In this case we use a FOR loop that goes from 0 to 2.\n\nWe can see the\
    \ example running on another page.\n\n## Data Types in Arrays\n\nIn the boxes\
    \ of the arrays we can save data of any type. We can see an array where we enter\
    \ character data.\n\n```javascript\nmyArray[0] = \"Hello\"\nmyArray[1] = \"a\"\
    \nmyArray[2] = \"all\"\n```\n\nEven in Javascript we can save different types\
    \ of data in the boxes of the same array. That is, we can enter numbers in some\
    \ boxes, texts in others, Booleans or anything else we want.\n\n```javascript\n\
    myArray[0] = \"develololoweb.com\"\nmyArray[1] = 1275\nmyArray[1] = 0.78\nmyArray[2]\
    \ = true\n```\n\n## Array Declaration and Summary Initialization\n\nIn Javascript\
    \ we have at our disposal a summarized way to declare an array and load values\
    \ in the same step. Let's look at the following code:\n\n```javascript\nvar arrayRapido\
    \ = [12, 45, \"array initialized in its declaration\"]\n```\n\nAs you can see,\
    \ we are defining a variable called fastArray and we are indicating in the square\
    \ brackets several values separated by commas. This is the same as having declared\
    \ the array with the Array() function and then loading the values one by one.\n\
    \n## Array Length\n\nIn the previous article in the Javascript Manual we started\
    \ to explain the concept of array and its use in Javascript. In this article,\
    \ we will continue with the topic, showing the use of its length property.\n\n\
    All arrays in javascript, apart from storing the value of each of their boxes,\
    \ also store the number of positions they have. To do this they use a property\
    \ of the array object, the length property. We will see in objects what a property\
    \ is, but in our case we can imagine that it is like a variable, in addition to\
    \ the positions, that stores a number equal to the number of boxes that the array\
    \ has.\n\nTo access a property of an object, the dot operator must be used. The\
    \ name of the array that we want to access is written to the number of positions\
    \ it has, without brackets or parentheses, followed by a period and the word length.\n\
    \n```javascript\nvar myArray = new Array ()\n\nmyArray[0] = 155\nmyArray[1] =\
    \ 499\nmyArray[2] = 65\n\ndocument.write (\"Array length: \" + myArray.length)\n\
    ```\n\nThis code would print on the screen the number of positions of the array,\
    \ which in this case is 3. We remember that an array with 3 positions ranges from\
    \ position 0 to 2.\n\nIt is very common for the length property to be used to\
    \ traverse an array through all its positions. To illustrate it, we are going\
    \ to see an example of a walk through this array to show its values.\n\n```javascript\n\
    for (i = 0; i < myArray.length; i++) {\n  document.write (myArray[i])\n}\n```\n\
    \nNote that the for loop is executed whenever i is less than the length of the\
    \ array, taken from its length property.\n\nThe following example will help us\
    \ to better understand the routes through the arrays, the operation of the length\
    \ property and the dynamic creation of new positions. We are going to create an\
    \ array with 2 positions and fill its value. Later we will introduce a value in\
    \ position 5 of the array. Finally we will print all the positions of the array\
    \ to see what happens.\n\n```javascript\nvar myArray = new Array (2)\n```\n\n\
    ```javascript\nmyArray[0] = \"Colombia\"\nmyArray[1] = \"United States\"\n```\n\
    \n```javascript\nmyArray[5] = \"Brazil\"\n```\n\n```javascript\nfor (i = 0; i\
    \ < myArray.length; i++) {\n  document.write (\"Position \" + i + \" of the array:\
    \ \" + myArray[i])\n  document.write (\"<br>\")\n}\n```\n\nThe example is simple.\
    \ It can be seen that we walk through the array from 0 to the number of positions\
    \ in the array (indicated by the length property). Along the way we are printing\
    \ the number of the position followed by the content of the array in that position.\
    \ But we can have a doubt when we ask ourselves what will be the number of elements\
    \ in this array, since we had declared it with 2 and then we have introduced a\
