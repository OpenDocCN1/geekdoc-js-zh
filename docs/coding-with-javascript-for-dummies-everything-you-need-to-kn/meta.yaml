    \ {\n  \"use strict\"\n  a[0] = 1;\n  a.push(2);\n}\n\nfail();\n```\n\n### 深度冻结\n\
    \n虽然冻结的对象不可调整，但它不一定是“固定”的；在下面的示例中，冻结是浅层的：\n\n```javascript\nobj1 = {\n  internal:\
    \ {}\n};\n\nObject.freeze(obj1);\nobj1.internal.a = 'aValue';\n\nobj1.internal.a\
    \ // 'aValue'\n```\n\n为了使对象完全休眠（不可变），该对象的每个属性都必须被冻结。这被称为“深度冻结”：\n\n```javascript\n\
    function deepFreeze(obj) {\n  // 获取对象中的属性名称\n  var propNames = Object.getOwnPropertyNames(obj);\n\
    \n  // 在冻结对象之前冻结这些属性\n  propNames.forEach(function(name) {\n    var prop = obj[name];\n\
    \n    // 如果属性是对象，则对其进行冻结\n    if (typeof prop == 'object' && prop != null)\n \
    \     deepFreeze(prop);\n  });\n\n  // 冻结对象本身\n  return Object.freeze(obj);\n\
    }\n\nobj2 = {\n internal: {}\n};\n\ndeepFreeze(obj2);\nobj2.internal.a = 'anotherValue';\n\
    obj2.internal.a; // undefined\n```\n\n这些通用属性返回一个简单值，它们不代表对象的函数或属性。\n\n- Infinity\n\
    - NaN\n- Undefined\n- Null\n\n## 1.1 Infinity\n\nInfinity 通用属性是一个代表无穷大的数值。\n\n\
    **Infinity 属性特征**\n\n| 特征 | 值 |\n| :--- | :--- |\n| 可写 | 否 |\n| 静态 | 否 |\n| 可调\
    \ | 否 |\n\n**通用结构**\n\nInfinity\n\n**描述**\n\nInfinity 属性是全局对象的一个属性，也就是说，它是公共域中的一个变量。\n\
    \nInfinity 属性的值是 `Number.POSITIVE_INFINITY`，其值大于任何其他数字。该值遵循数学中无穷大值的行为。例如，任何数乘以\
    \ Infinity 的结果都是 Infinity，任何数除以 Infinity 的结果是 0。\n\n**示例**\n\n以下示例显示了对 Infinity\
    \ 值进行数学运算的结果：\n\n```javascript\nconsole.log(Infinity); // Infinity\nconsole.log(Infinity\
    \ + 1); // Infinity\nconsole.log(Math.pow(10, 1000)); // Infinity\nconsole.log(Math.log(0));\
    \ // -Infinity\nconsole.log(1 / Infinity); // 0\n```\n\n## 1.2 NaN\n\n公共属性 NaN\
    \ 是一个不代表数字的值（Not-A-Number 的缩写）。\n\n### NaN 属性的特征\n\n| 特征 | 值 |\n| :--- | :---\
    \ |\n| 可写 | 否 |\n| 静态 | 否 |\n| 可调 | 否 |\n\n### 通用结构\n\n```javascript\nNaN\n```\n\
    \n### 描述\n\nNaN 属性是全局对象的一个属性，也就是说，它是公共域中的一个变量。\n\nNaN 属性的初始值是 `Number.NaN`。在现代浏览器中，NaN\
    \ 属性不可配置且不可写，但请尽量避免对其写入。\n\nNaN 的值在程序中很少被直接使用，但当 Math 对象的函数（如 `Math.sqrt(-1)`）失败或数字值转换（如\
    \ `parseInt(\"blabla-abla\")`）失败时，它将作为返回值。\n\n### 测试值是否为 NaN\n\nNaN 的值（通过 ==,\
    \ !=, === 和 !== 参数）不等于任何其他值，包括另一个 NaN 值；因此请使用 `Number.isNaN()` 或 `isNaN()` 来查看相关值是否为\
    \ NaN，或者尝试将该值与其自身进行比较，NaN 值是唯一不等于自身的值。\n\n```javascript\nNaN === NaN; // false\n\
    Number.NaN === NaN; // false\nisNaN(NaN); // true\nisNaN(Number.NaN); // true\n\
    ```\n\n```javascript\nfunction valueIsNaN(v) {\n  return v != v; \n}\nvalueIsNaN(1);\
    \ // false\nvalueIsNaN(NaN); // true\nvalueIsNaN(Number.NaN); // true\n```\n"
