- md: '## Web Components


    The next development revolution for the Internet, which has not yet exploited
    in the middle of 2017, is called Web Components. It is based on a new API (with
    several specifications together) aimed at creating components. Components are
    like new HTML tags that any developer can create to solve common or particular
    application problems.


    With web components developers can extend HTML by creating new components capable
    of doing anything and with advanced encapsulation capabilities, to respect their
    autonomy and capable of being used in any project, maximizing code reuse capabilities
    without the need to be based on any type of library or framework.


    Like HTML5, Web Components are part of the possibilities offered by browsers by
    default, although their support right now is not as universal.


    Note: In the coming months, all browsers are expected to support Web Components
    V1 and we can use it without any restrictions. Meanwhile there is a Polyfill that
    allows to extend the support to Web Components to browsers that do not yet have
    it. Polyfills are literally "gap fillers", which make up for the deficiencies
    of old browsers with respect to the standards. In the HTML5 APIs they have already
    begun to be used intensively to allow the use of new features of the web languages
    in old or slightly updated clients.


    ## Javascript as the first language


    If you are learning programming, Javascript is an excellent bet to start. Basically
    for three main reasons:


    ### Easy to use


    We only need a browser to be able to execute Javascript. It does not require any
    kind of compilation (process to create a binary executable file for a particular
    operating system) but is interpreted. This involves a more streamlined workflow,
    making the first steps easy. In addition, Javascript is dynamic typing and its
    syntax is less elaborate than that of other languages and allows things to be
    done in different ways, according to the skill, preferences or customs of each
    programmer.


    ### Wide application areas


    As we have seen, Javascript has practically unlimited uses. It means that you
    can use the language practically for what you need. By learning a single language
    you will be able to reach any purpose you set for yourself.


    ### It is an open and standard language for the web


    At some point in their professional activity, most developers will work on the
    web environment. Learning programming with Javascript assures us that the knowledge
    will be applied directly at various points in the professional career of students.


    These are the reasons why we have been teaching how to program with Javascript
    for more than 10 years and why in 2017 the prestigious universities of Stanford
    have abandoned their introductory course to programming with Java in favor of
    Javascript.


    ## Multiple professions start with Javascript


    Another reason why it is worth starting with Javascript is because language is
    one of the fundamental pillars to perform multiple professions in demand within
    the scope of the web.


    ### Frontend developer


    He is the professional who deals with client-side development, although he can
    have various activities in addition to programming, such as design, layout, user
    interface development, client-side SPA applications, etc. Javascript knowledge
    is essential in all areas of action of a frontend developer.


    ### Backend developer


    As a backend we understand server-side programming. For backend, the truth is
    that Javascript (with NodeJS) is just one of the many possibilities. However,
    NodeJS offers many advantages such as its asynchrony, speed and optimization,
