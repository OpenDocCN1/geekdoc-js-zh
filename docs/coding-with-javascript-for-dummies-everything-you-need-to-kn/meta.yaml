  md: "# String.raw ()\n\nThe String.raw () function is a tag function for template\
    \ literals, similar to the preceding r in Python or the previous @ in C # (but\
    \ there are differences between them). Used to get the raw text string from the\
    \ template (ie, unexplained text).\n\n# General structure\n\n```\nString.raw (callSite,\
    \ ... substitutions)\n```\n\nString.raw`templateString` \ncallSite \nObject to\
    \ call template like: {raw: ['foo', 'bar', 'baz']}.\n\n... substitutions \nThe\
    \ values to be replaced.\n\ntemplateString \nA text string representing the template,\
    \ and the values to be replaced ($ {...}).\n\n# Returned value\n\nA raw text string\
    \ for the text string that represents the template."
