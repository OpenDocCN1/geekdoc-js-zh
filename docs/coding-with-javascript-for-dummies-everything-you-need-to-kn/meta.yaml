    # Arrays in Javascript


    In programming languages there are special data structures that help us store
    more complex information than simple variables. A typical structure in all languages
    is the Array, which is like a variable where we can enter several values, instead
    of just one as it happens with normal variables.


    Arrays allow us to save several variables and access them independently, it is
    like having a variable with different compartments where we can enter different
    data. For this we use an index that allows us to specify the compartment or position
    to which we are referring.


    Note: The arrays were introduced in Javascript versions 1.1 or higher, that is,
    we can only use them from browsers 3.0. For older browsers you can simulate the
    array using object-oriented programming syntax, but the truth is that currently
    this limitation should not concern us. Furthermore, given the complexity of the
    task of simulating an array by means of objects, at least at the time we meet
    and the few occasions when we will need it, we think that it is better to forget
    about that matter and simply work with arrays usually. So in this article and
    the following we are going to see how to use the authentic Javascript array.'
