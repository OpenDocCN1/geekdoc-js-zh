  md: '# Multidimensional arrays in Javascript


    As we are seeing, arrays are quite important in Javascript and also in most programming
    languages. Specifically, we have already learned to create arrays and use them
    in previous articles in the Javascript Manual. But we still have some important
    things to explain, such as arrays of various dimensions.


    Multidimensional arrays are a data structure that stores values in more than one
    dimension. The arrays that we have seen so far store values in one dimension,
    so we only use an index to access positions. 2-dimensional arrays store their
    values, so to speak, in rows and columns and therefore we will need two indexes
    to access each of their positions.


    In other words, a multidimensional array is like a container that stores more
    values for each position, that is, as if the elements of the array were in turn
    other arrays.


    In Javascript there is no real multidimensional array-object. To use these structures
    we can define arrays that where in each of their positions there will be another
    array. In our programs we can use arrays of any dimension, we will see below how
    to work with two-dimensional arrays, which will be the most common.


    In this example we are going to create a two-dimensional array where we will have
    cities on the one hand and the average temperature in each one during the winter
    months on the other.


    ```

    var city_media_temperatures0 = new Array (3)

    city_media_temperatures0 [0] = 12

    city_media_temperatures0 [1] = 10

    city_media_temperatures0 [2] = 11

    ```'
