    ## Operators precedence\n\nThe evaluation of a sentence that we have seen in the\
    \ previous examples is quite simple and easy to interpret, but when a multitude\
    \ of different operators come into play in a sentence, there may be confusion\
    \ when interpreting it and elucidating which operators are the ones that they\
