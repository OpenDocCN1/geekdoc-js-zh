- md: '## Javascript function library


    In all programming languages there are libraries of functions that serve to do
    different and very repetitive things when programming. Libraries in programming
    languages save you the trouble of writing common functions that programmers may
    usually need. A well-developed programming language will have a fair amount of
    them. Sometimes it is more difficult to know all the libraries well than to learn
    to program in the language.


    Javascript contains a good number of functions in its libraries. As it is a language
    that works with objects, many of the libraries are implemented through objects.
    For example, math or string handling functions are implemented using Math and
    String objects. However, there are some functions that are not associated with
    any object and are the ones that we will see in this chapter, since we still do
    not know the objects and we will not need them to study them.


    ### Built-in Javascript functions


    These are the functions that Javascript makes available to programmers.


    - **eval (string)**: This function receives a character string and executes it
    as if it were a Javascript statement.


    - **parseInt (string, base)**: Receives a chain and a base. Returns a numeric
    value resulting from converting the string to a number in the indicated base.


    - **parseFloat (string)**: Converts the string to a number and returns it.


    - **escape (character)**: Returns a character that it receives as a parameter
    in an ISO Latin 1 encoding.


    - **unescape (character)**: It does the exact opposite of the escape function.


    - **isNaN (number)**: Returns a boolean depending on what it receives per parameter.
    If it is not a number it returns true, if it is a number it returns false.


    The libraries that are implemented through objects and those of the browser handling,
    which are also managed with objects, we will see later.


    Note: We don''t want to mislead people with this short list of native Javascript
    functions. There really are many other functions that we will see throughout this
    manual, what happens is that they are associated with objects. For example, as
    we have pointed out, there are character string functions, which are associated
    with string objects, functions for working with advanced mathematical calculations,
    which are associated with the Math class, functions for working with the object
    of the browser window, with the document, etc.


    ### Examples of using the functions incorporated in Javascript


    So far we have simply known a list of the native functions of the Javascript language.
    Now we can see several examples of the use of native Javascript functions, which
    we have available in any browser and in any version of Javascript.


    We will see three functions from different fields that are quite fundamental in
    the usual work with this language, explained through examples.


    ## Eval function


    This function is very important, so much so that there are some Javascript applications
    that could not be performed if we do not use it. Its use is very simple, but it
    may be a little more complex to understand in which cases to use it because sometimes
    its application is a little subtle.


    With current knowledge we cannot make a very complicated example, but at least
    we can see the function working. We are going to use it in a slightly strange
    and quite useless statement, but if we can understand it, we will also understand
    the function eval.


    ```javascript

    var myText = "3 + 5"

    eval ("document.write (" + myText + ")")

    ```


    First we create a variable with a text, in the next line we use the function eval
    and as a parameter we pass a javascript instruction to write to the screen. If
    we concatenate the strings that are inside the parentheses of the function eval,
    we are left with this.


    ```javascript

    document.write (3 + 5)

    ```


    The eval function executes the instruction passed to it by parameter, so it will
    execute this statement, which will result in an 8 being written to the web page.
    First the sum in parentheses is solved, so we get the 8 and then the write on
    screen instruction is executed.


    ## ParseInt function


    This function receives a number, written as a string, and a number that indicates
    a base. You can actually receive other types of variables, since variables have
    no type in Javascript, but it is usually used by passing a string to convert the
    text variable to a number.


    The different bases that the function can receive are 2, 8, 10 and 16. If we do
    not pass any value as a base, the function interprets the base as decimal. The
    value returned by the function always has base 10, so if the base is not 10 it
    converts the number to that base before returning it.


    Let''s look at a series of calls to the parseInt function to see what it returns
    and to understand the function a little more.


    ```javascript

    document.write(parseInt("34"))

    ```


    Returns the number 34


    ```javascript

    document.write(parseInt("101011", 2))

    ```


    Returns the number 43


    ```javascript

    document.write(parseInt("34", 8))

    ```


    Returns the number 28


    ```javascript

    document.write(parseInt("3F", 16))

    ```


    Returns the number 63


    This function is used in practice for a lot of different things in number handling,
    for example getting the integer part of a decimal.


    ```javascript

    document.write (parseInt ("3.38"))

    ```


    Returns the number 3


    It is also very common to use it to know if a variable is numeric, because if
    we pass a text to the function that is not numeric it will return NaN (Not a Number)
    which means that it is not a Number.


    ```javascript

    document.write (parseInt ("develoloweb.com"))

    ```


    Returns the NaN number


    This same example is interesting with a modification, because if we pass a combination
    of letters and numbers it will give us the following.


    ```javascript

    document.write (parseInt ("16XX3U"))

    ```


    Returns the number 16


    ```javascript

    document.write (parseInt ("TG45"))

    ```


    Returns the NaN number


    As you can see, the function tries to convert the string to number and if it can''t
    it returns NaN.


    All of these somewhat unrelated examples of how parseInt works will be reviewed
    later in more practical examples when dealing with working with forms.


    ## IsNaN function


    This function returns a boolean depending on whether it receives a number or not.
    The only thing you can receive is a number or the expression NaN. If it receives
    a NaN it returns true and if it receives a number it returns false. It is a very
    simple function to understand and use.


    The function usually works in combination with the parseInt or parseFloat function,
    to know if what these two functions return is a number or not.


    ```javascript

    miInteger = parseInt("A3.6")

    isNaN(myInteger)

    ```


    In the first line we assign the variable miInteger the result of trying to convert
    the text A3.6 to an integer. Since this text cannot be converted to a number,
    the parseInt function returns NaN. The second line checks if the previous variable
    is NaN and parse as if it is, it returns true.


    ```javascript

    miFloat = parseFloat("4.7")

    isNaN(miFloat)

    ```


    In this example we convert a text to a number with decimals. The text converts
    perfectly because it corresponds to a number. When receiving a number the function
    isNaN returns a false.


    We have a very interesting Javascript Workshop that has been carried out to strengthen
    the knowledge of these chapters. It is a script to validate a form field so that
    we know for sure that within the field there is always an integer. It can be very
    interesting to read it now, since we use the isNaN () and parseInt () functions.
    See the workshop.


    We hope that the examples seen in this article have been interesting. However,
    as we noted earlier, there are quite a few other native Javascript functions that
    we should be aware of, but which are associated with native Javascript classes
    and objects. But before moving on to that point we want to offer a small basic
    guide for working with object-oriented programming in Javascript.'
