- img_proc: true
  md: '# How to access object properties and methods


    In Javascript we can access the properties and methods of objects in a similar
    way to what we do in other programming languages, with the operator dot (".").


    The properties are accessed by placing the name of the object followed by a period
    and the name of the property to be accessed. In this way:


    ```

    myObject.myProperty

    ```


    To call the methods we use a similar syntax, but putting the parameters that we
    pass to the methods in parentheses. As follows:


    ```

    myObject.myMethod (parameter1, parameter2)

    ```


    If the method does not receive parameters we put the parentheses too, but with
    nothing inside.


    ```

    myObject.myMethod ()

    ```'
  merge: -1
  pgno: 189
