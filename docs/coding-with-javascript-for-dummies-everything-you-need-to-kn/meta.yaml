  md: '# Array initialization


    To finish with the topic of arrays, we are going to see a way to initialize its
    values at the same time that we declare it, so we can carry out the process of
    entering values in each of the positions of the array in a faster way.


    The normal method of creating an array we saw was through the Array object, putting
    the number of boxes in the array in parentheses or not putting anything, so that
    the array is created without any position. To introduce values to an array it
    is done the same, but putting the values with which we want to fill the cells
    separated by commas between the parentheses. Let''s see it with an example that
    creates an array with the names of the days of the week.


    ```

    var diasWeek = new Array ("Monday", "Tuesday", "Wednesday,",

    "Thursday", "Friday", "Saturday", "Sunday")

    ```


    The array is created with 7 boxes, from 0 to 6 and in each box the uninterrupted
    by its uncongenital of the week is written (In quotes because it is a text).


    Now we are going to see something more complicated, it is about declaring the
    two-dimensional array that we used before for the temperatures of the cities in
    the months in a single line, entering the values at the same time.


    ```

    var cities_temperatures = new Array (new Array (12,10,11), new Array

    (5,0,2), new Array (10,8,10))

    ```


    In the example we introduce in each box of the array another array that has as
    values the temperatures of a city in each month.


    Javascript still has a more summarized way than the one we just saw, which we
    explained in the first article where we covered arrays. To do this we simply put
    the data of the array we are creating in square brackets. To finish we will show
    an example on how to use this syntax to declare arrays of more'
