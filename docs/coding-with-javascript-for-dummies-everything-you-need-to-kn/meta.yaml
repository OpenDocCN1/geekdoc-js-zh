  md: '# # Variable concept


    A variable is a space in memory where data is stored, a space where we can store
    any type of information that we need to carry out the actions of our programs.
    We can think of it as a box, where we store data. That box has a name, so that
    later we can refer to the variable, retrieve the data as well as assign a value
    to the variable whenever we want.


    For example, if our program performs sums, it will be very normal for us to store
    in variables the different addends that participate in the operation and the result
    of the sum. The effect would be something like this.


    ```

    adding1 = 23

    adding2 = 33

    sum = adding1 + adding2

    ```


    In this example we have three variables, adding1, adding2 and sum, where we save
    the result. We see that their use for us is as if we had a section where to save
    a data and that they can be accessed just by putting their name.'
