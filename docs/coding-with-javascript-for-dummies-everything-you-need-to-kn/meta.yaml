  md: '+   - Object.defineProperties ()


    The Object.defineProperties () function defines new properties on an object directly,
    modifies properties that already exist in an object, and then reopens that object.


    # General structure


    ```

    Object.defineProperties (obj, props)

    ```


    obj

    The object in which you want to define properties or modify them.


    props

    An object with its own enumerated properties specifying the property descriptors
    that will be added to or modified by the object and which will be associated with
    attribute names. There are two types of descriptors: data descriptors and accessor
    descriptors, see the Object.defineProperty () function page for more details.


    Data descriptors and access descriptors are objects, sharing the following required
    keys:


    * configurable: If the value of this key is true, you can modify the property
    descriptor (not the value of the property) and the property can be deleted'
  merge: -1
  pgno: 199
