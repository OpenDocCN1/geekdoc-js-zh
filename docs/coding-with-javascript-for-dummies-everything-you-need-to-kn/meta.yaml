    \ answer our questions. It will look something like this:\n\n**Array position\
    \ 0: Colombia**\n**Array position 1: United States**\n**Array position 2: null**\n\
    **Array position 3: null**\n**Array position 4: null**\n**Array position 5: Brazil**\n\
    \nIt can be clearly seen that the number of positions is 6, from 0 to 5. What\
    \ has happened is that when entering a data in position 5, all the boxes that\
    \ were not created until the fifth are also created.\n\nPositions 2 through 4\
    \ are uninitialized. In this case our browser has written the word null to express\
    \ this, but other browsers may use the word undefined. We will see later what\
    \ this null is and where we can use it, the important thing now is that you understand\
    \ how arrays work and use them correctly."
  mdcn: " 标签内\n\n让我逐段翻译：\n\n第一部分：数组介绍\n- \"In programming languages...\" → 在编程语言中...\n\
