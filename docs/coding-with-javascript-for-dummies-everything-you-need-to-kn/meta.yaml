  md: '# # Uses of Javascript


    Perhaps today it is superfluous to say what Javascript is for, but let''s briefly
    see some uses of this language that we can find on the web to get an idea of the
    possibilities it has.


    Without going any further, DesarrolloWeb.com uses Javascript for the top menu,
    which shows different links within each main option. We are changing the page
    from time to time, but in the current design of this website, elements such as
    the "Login" box also have their dynamism with Javascript.


    Currently almost all the slightly advanced pages use Javascript, as it has become
    one of the insignia of what is called Web 2.0 and the rich user experience. For
    example, popular websites like Facebook, Twitter or Youtube use Javascript in
    abundance. To be more specific, when we click on a link on the social network
    to comment on something, a small form is displayed on the page that appears as
    if by a video on magicians and is then sent without leaving the page itself. Also
    when we vote for a video on YouTube or when the characters that we have written
    in the Twitter mini-posts are counted, Javascript is used to perform small functionalities
    that cannot be done with HTML alone. You can actually see Javascript examples
    inside any slightly complex page. Some that we will have seen countless times
    are dynamic calendars to select dates, calculators or currency converters, rich
    text editors, dynamic browsers, etc.


    It is much more common to find Javascript to perform simple effects on web pages,
    or not so simple, such as dynamic browsers, opening secondary windows, form validation,
    etc. We dare to say that this language is really useful in these cases, since
    these typical effects have just enough complexity to be implemented in a matter
    of minutes without the possibility of errors. However, apart from those simple
    examples, we can find many applications on the Internet that base part of their
    operation on Javascript, which make a web page become a true interactive program
    for managing any resource. Clear examples are online office applications, such
    as Google Docs, Office'
