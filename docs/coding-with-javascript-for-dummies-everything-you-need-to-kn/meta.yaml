- md: '# Javascript language versions


    # The evolution of Javascript


    In the article of the introduction to Javascript we already explained some of
    the history of the language. We saw that in its beginnings its objectives were
    simple and that nowadays with Javascript we can manage to create really complex
    pages, user interfaces and effects. Therefore, as the demands of the developers
    grew, so did the language itself.


    **It is important to mention that the language has evolved in two ways:**


    On the one hand, the language itself has been incorporating operators, control
    structures, syntax rules to do repetitive things with less code. We owe these
    improvements in the language to the ECMAScript standard, which we will talk about
    immediately.


    On the other hand, browsers have been incorporating new instructions, to be able
    to manipulate modern elements of the page, such as divisions, CSS styles and systems
    such as local storage, full-screen work, geolocation and a long etc. All these
    improvements are defined under the standards of HTML 5 and its Javascript APIs.


    In any case, what should be clear is that Javascript has been improving its features
    as a language, while browsers have been offering greater support to advanced functionalities
    for the control of page elements. That is why in Javascript we generally have
    to be careful with the browser market and compatibility with the functionalities
    that we want to use.


    # ECMAScript Standard


    Javascript as a language is standardized by the organization "ECMA International".
    This company is dedicated to creating standards for communication and information
    processing. One of its best known standards is ECMAScript.


    ECMAScript is the standard definition of the Javascript language, which any client
    that supports Javascript must support. Over time, different versions of ECMAScript
    have been published, with the latest ECMAScript 2015, also known as ES6.


    ES6 is supported by all current browsers except Internet Explorer. Therefore,
    if you support IE programs, you could not use ES6 in principle.


    This is half true, since there are systems that allow the code to be translated
    from one version to another of the standard, although at the moment we do not
    want to get into these details. If you are interested, we recommend reading the
    Webpack Manual, which is one of the many tools that you can use to carry out this
    task.


    # HTML 5 APIs


    An API is an application programming interface. Basically it indicates how the
    functionalities or services of a system are going to be accessed, through which
    instructions and what procedures.


    Browsers define an API to access the resources we have to manipulate the state
    of the page and accord to peripherals, storage, etc.


    Browser APIs are generally specified by the W3C and must be faithfully implemented
    by all web clients.


    It happens a bit the same as with the language versions. If the browser is very
    old it may not have support for some APIs, so we have to be cautious. In practice
    more than anything with Internet Explorer and some old mobile browser.


    In this first part of the manual we are not going to cover the HTML 5 APIs or
    access to the browser resources. This area is the subject of study in the second
    part, dedicated to Client-side Javascript Development.


    # Language versions


    In the first part of this manual the objective is to learn Javascript well, so
    we will limit ourselves to the study of language in particular. In this sense
    we will use ES5, which is the version of the language that works in all current
    browsers.


    As general information, we will summarize we will comment on the different versions
    of Javascript:


    Really, any moderately modern browser will now have all the Javascript functionalities
    that we are going to need and above all, those that we can use in our first steps
    with the language. However, it may be useful to know the first versions of Javascript
    that we discussed in this article, as a curiosity.


    Javascript 1: It was born with Netscape 2.0 and it supported a large number of
    instructions and functions, almost all that exist now have already been introduced
    in the first standard.


    Javascript 1.1: It is the Javascript version that was designed with the arrival
    of 3.0 browsers. It implemented little more than its previous version, such as
    dynamically processing images and creating arrays.


    Javascript 1.2: The version of browsers 4.0. This has the disadvantage that it
    is a little different on Microsoft and Netscape platforms, since both browsers
    grew differently and were in full fight for the market.


    Javascript 1.3: Version implemented by 5.0 browsers. In this version, some differences
    and rough edges between the two browsers have been filed.


    Javascript 1.5: Current version, at the time of this writing, implemented by Netscape
    6.


    For its part, Microsoft has also evolved to present its 5.5 version of JScript
    (that''s what they call the javascript used by Microsoft''s browsers).


    In 2009 the version of ECMAScript 5 was published. This is the version that we
    are going to deal with mainly in the manual, which works in all browsers on the
    market.


    In 2015 the sixth version of ECMAScript is launched, with a very significant number
    of new features. This version is fully usable, except in Internet Explorer. Its
    improvements are so important that all professional developers use them and, if
    necessary, the code is translated to support older browsers. This version is explained
    in the ES6 Manual.


    There is currently a commitment to release one version of the ECMAScript standard
    per year. Therefore, there are various standards with small incremental changes,
    which have been incorporated at different rates between browsers.


    # Conclusion to Javascript versions and compatibility


    It is obvious that, after writing these lines, many other versions of Javascript
    will be presented or will have been presented, because, as browsers are improved
    and HTML versions are released, new needs arise for programming dynamic elements.
    However, everything we are going to learn in this manual, even other much more
    advanced uses, is already implemented in any Javascript that exists today.


    # Chapter II


    ## Quick effects with Javascript


    Before diving into the matter, we can see a series of quick effects that can be
    programmed with Javascript, which can give us a clearer idea of the capabilities
    and power of the language. Below we will see several examples, which we have highlighted
    for this introduction in the Javascript Manual, for having a minimum of complexity
    and although they are very basic, they will come in handy to have a more accurate
    idea of what Javascript is when it comes to going through the following chapters.


    # Open a child window


    First let''s see that with a javascript line we can do quite attractive things.
    For example we can see how to open a secondary window without menu bars that shows
    the Google search engine. The code would be the following.


    ```html

    <script>

    window.open("http://www.google.com", "", "width = 550, height = 420, menubar =
    no")

    </script>

    ```


    # A welcome message


    We may display a pop-up text box upon completion of loading the cover of our website,
    which might welcome visitors.


    ```html

    <script>

    window.alert ("Welcome to my website. Thanks ...")

    </script>

    ```


    # Current date


    Now let''s look at a simple script to show today''s date. Sometimes it is very
    interesting to show it on the websites to give an effect that the page is "up
    to date", that is, it is updated.


    ```html

    <script> document.write (new Date ()) </script>

    ```


    These lines should be inserted inside the body of the page where we want the last
    update date to appear. We can see the example running here.


    Note: A detail to highlight is that the date appears in a somewhat strange format,
    also indicating the time and other attributes of the same, but we will learn to
    get exactly what we want in the correct format.'
