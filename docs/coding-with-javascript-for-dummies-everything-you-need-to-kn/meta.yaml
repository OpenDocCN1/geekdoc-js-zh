    \ than, returns true if the first operand is greater than the second |\n| < |\
    \ Less than, is true when the item on the left is less than the one on the right\
    \ |\n| >= | Greater equal |\n| <= | Less equal |\n\nWe will see examples of conditional\
    \ operators when we explain control structures, such as the if conditional.\n\n\
    Additionally, in this text we will see an issue of considerable importance in\
