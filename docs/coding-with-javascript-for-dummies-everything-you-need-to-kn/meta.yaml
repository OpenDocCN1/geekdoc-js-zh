- md: "# CODING WITH JAVASCRIPT FOR DUMMIES\n\nEVERYTHING YOU NEED TO KNOW ABOUT JAVASCRIPT\
    \ PROGRAMMING\n1ST EDITION - 2020 / 7 / 14\n\nPENGUIN RANDOM HOUSE LLC\n\n1ST\
    \ EDITION\nBY CLAUDIA ALVES\n\n# Coding with JavaScript For Dummies\n\nEverything\
    \ you need to know about Javascript programming\n\n1st edition\n2020\n\nBy Claudia\
    \ Alves\n\n> \"Programming isn't about what you know; it's about what you can\
    \ figure out.\"\n\n- *Chris Pine*\n\nMemlnc.com\n\n## INTRODUCTION\n\n- [JavaScript\
    \ is everywhere](#)\n- [JavaScript on the web](#)\n  - [Websites](#)\n  - [Single\
    \ Page Applications](#)\n  - [Libraries, frameworks and development \"Vanilla\
    \ JavaScript\" for the web](#)\n  - [HTML5 APIs](#)\n  - [Web Components](#)\n\
    - [JavaScript in the backend](#)\n- [JavaScript as language for device apps](#)\n\
    - [JavaScript as a language for desktop applications](#)\n- [JavaScript as the\
    \ first language](#)\n  - [Easy to use](#)\n  - [Wide application areas](#)\n\
    \  - [It is an open and standard language for the web](#)\n  - [Multiple professions\
    \ start with JavaScript](#)\n    - [Frontend developer:](#)\n    - [Backend developer](#)\n\
    \    - [Fullstack developer](#)\n- [How to learn JavaScript](#)\n  - [Learn JavaScript\
    \ and not a derivative](#)\n  - [Knowledge of the web platform](#)\n- [Differences\
    \ between Java and JavaScript](#)\n- [Open language / proprietary language](#)\n\
    - [Before starting](#)\n- [Uses of JavaScript](#)\n\n## WHAT DO YOU NEED TO WORK\
    \ WITH JAVASCRIPT\n\nRECOMMENDED PRIOR KNOWLEDGE\n\n## CHAPTER I\n\nJAVASCRIPT\
    \ LANGUAGE VERSIONS\n\nTHE EVOLUTION OF JAVASCRIPT\n\nECMASCRIPT STANDARD\n\n\
    HTML 5 APIs\n\nLANGUAGE VERSIONS\n\nCONCLUSION TO JAVASCRIPT VERSIONS AND COMPATIBILITY\n\
    \n## CHAPTER II\n\nOPEN A CHILD WINDOW\n\nA WELCOME MESSAGE\n\nCURRENT DATE\n\n\
    BACK BUTTON\n\nJAVASCRIPT LANGUAGE\n\nJAVASCRIPT IS WRITTEN TO THE HTML DOCUMENT\n\
    \nTHE PLACEMENT OF THE SCRIPTS DOES MATTER\n\nWAYS TO WRITE JAVASCRIPT SCRIPTS\n\
    \nDIRECT EXECUTION OF JAVASCRIPT CODE\n\nRUNNING JAVASCRIPT IN RESPONSE TO AN\
    \ EVENT\n\nHIDE JAVASCRIPT SCRIPTS IN OLD BROWSERS\n\nHIDE JAVASCRIPT CODE WITH\
    \ HTML COMMENTS\n\nSHOW A MESSAGE FOR OLD BROWSERS WITH <NOSCRIPT>\n\nMORE ABOUT\
    \ SCRIPTING\n\nINTERESTING METHODS OF PLACING JAVASCRIPT SCRIPTS\n\nINDICATE THE\
    \ LANGUAGE WE ARE USING\n\nINCLUDE EXTERNAL JAVASCRIPT FILES\n\nTHE IMPORTANCE\
    \ OF USING EXTERNAL JAVASCRIPT CODE FILES\n\n## CHAPTER III\n\n### JAVASCRIPT\
    \ SYNTAX\n\n- Comments in the code\n- Upper case and lower case\n- Separation\
    \ of instructions\n- Variables in Javascript\n- Variable concept\n- Rules for\
    \ variable naming in Javascript\n- Variable names in Javascript are case sensitive\n\
    - Declaration of variables in Javascript\n- Variable declaration with var\n- Declaration\
    \ of Javascript variables with let and const\n- Scope of variables in Javascript\n\
    - Variable scope concept\n- Global variables\n- Local variables\n- Differences\
    \ between declaring variables with var, or not declaring them\n- Variable declaration\
    \ with let\n- What can we save in variables\n- Data types in Javascript\n- Numeric\
    \ data type\n- Boolean type\n- Data type character string\n- Escape characters\
    \ in text strings\n\n## CHAPTER IV\n\n### JAVASCRIPT OPERATORS\n\n- Examples of\
    \ using operators\n- ARITHMETIC OPERATORS\n- ASSIGNMENT OPERATORS\n- EXAMPLES\n\
    - CHAIN OPERATORS\n- LOGICAL OPERATORS\n- CONDITIONAL OPERATORS\n- BIT-LEVEL OPERATORS\n\
    - OPERATORS PRECEDENCE\n- JAVASCRIPT TYPEOF OPERATOR FOR TYPE CONTROL\n- RECOMMENDATIONS\
    \ WITH TYPEOF\n- JAVASCRIPT CONTROL STRUCTURES\n- DECISION MAKING\n- IF STRUCTURE\
    \ IN JAVASCRIPT\n- CONDITIONAL EXPRESSIONS\n- NESTED IF STATEMENTS\n- IF OPERATOR\n\
    - JAVASCRIPT SWITCH STRUCTURE\n- FOR LOOP IN JAVASCRIPT\n- SAMPLE FOR-LOOP EXERCISE\n\
    - WHILE AND DO WHILE LOOPS\n- WHILE LOOP\n- DO ... WHILE LOOP\n- EXAMPLE OF THE\
    \ USE OF WHILE LOOPS\n- BREAK AND CONTINUE\n- BREAK\n- CONTINUE\n- ADDITIONAL\
    \ EXAMPLE OF THE BREAK STATEMENT\n- NESTED LOOPS IN JAVASCRIPT\n- JAVASCRIPT FUNCTIONS\n\
    - WHAT IS A FUNCTION\n- HOW TO WRITE A FUNCTION\n- HOW TO CALL A FUNCTION\n\n\
    # Where do we put the Javascript functions\n\n# Function parameters\n\n# Parameters\n\
    \n# Multiple parameters\n\n# Parameters are passed by value\n\n# Return values\
    \ in Javascript functions\n\n# Returning values in functions\n\n# Multiple return\n\
    \n# Scope of variables in functions\n\n# Javascript function library\n\n# Eval\
    \ function\n\n# ParseInt function\n\n# Arrays in Javascript\n\n# Creation of Javascript\
    \ arrays\n\n# Data types in arrays\n\n# Array declaration and summary initialization\n\
    \n# Array length\n\n# Multidimensional arrays in Javascript\n\n# Array initialization\n\
    \n# General introduction to objects in Javascript\n\n# What is an object\n\n#\
    \ How to access object properties and methods\n\n# How to create objects\n\n#\
    \ Create and instantiate objects from functions\n\n# • Object.freeze\n\n# Freeze\
    \ objects\n\n# Freeze matrices\n\n# Deep freezing\n\n# Undefined in JavaScript\n\
    \n# Null in JavaScript\n\n# Word Processing\n\n# Smuggling of characters\n\n#\
    \ Long text strings\n\n# Access the characters\n\n# Compare text strings\n\n-\
    \ String.fromCharCode\n\n# Handle values larger than the maximum\n\n- String.fromCodePoint\n\
    \n# String.raw ()\n\n# Introduction\n\nGetting started is easy, but there is a\
    \ long way to go if you want to express all the possibilities of language. Javascript\
    \ is one of the standard languages of the web and therefore ideal for many of\
    \ the professionals who plan to dedicate themselves to this medium. But even if\
    \ you don't want to develop specifically for the web, Javascript is an excellent\
    \ alternative for making mobile applications or desktop applications.\n\nPerhaps\
    \ not all developers need to reach an advanced level of Javascript, but a basic\
    \ knowledge will certainly be of great help at many points in their professional\
    \ careers. In any case, once the learning is completed, you will have endless\
    \ opportunities at your fingertips.\n\nWe'll start by looking at the state of\
    \ Javascript today (2017) and the reasons why Javascript is worth using in general.\
    \ Then we will take care of explaining how you can learn Javascript and get to\
    \ whatever level we set ourselves.\n\n# Javascript is everywhere\n\nJavascript\
    \ has become an ideal language to learn, since it has many and varied applications,\
    \ in addition to providing simplicity for people who are starting out. To run\
    \ it we only need a browser, although at the moment Javascript has surpassed the\
    \ scope of web clients, to be located almost anywhere.\n\n# Javascript on the\
    \ web\n\nThe environment where Javascript first appeared was the web. Its execution\
    \ focused on the scope of a web page and allowed developers to provide interactivity,\
    \ manipulate the document or the browser window, perform calculations, etc. Netscape\
    \ Navigator, a browser that disappeared today, has the honor of having introduced\
    \ Javascript as a language, although today it is supported by all web clients\
    \ with which a user can navigate.\n\nUsing Javascript for the web, in the browser\
    \ environment, is also known as client-side programming. Today it is still the\
    \ most common environment for Javascript execution, but it really is just one\
    \ more among its possibilities.\n\n# Javascript in the backend\n\nCertain developers\
    \ came up with the idea that they could extract the Javascript runtime, which\
    \ until then had only been available within the scope of the browser, to use it\
    \ for any other purpose outside the web client. This is how NodeJS was born, which\
    \ is nothing more than Javascript outside the browser.\n\nWith NodeJS we can program\
    \ with Javascript applications that run directly on the operating system and that\
    \ are capable of solving any type of problem. With this technology, Javascript\
    \ became a general-purpose programming language.\n\nOne of the most common uses\
    \ of NodeJS is backend programming. It allows you to program applications that\
    \ are capable of running on the server, providing access to databases, the file\
    \ system, and any other server-side resources. However, NodeJS is so comprehensive\
    \ that it can be used for many other tasks, such as automation, optimization,\
    \ or application deployment, among other operations."
  mdcn: "\n# 笨办法学 JavaScript 编程\n\n你需要知道的关于 JavaScript 编程的一切\n第1版 - 2020 / 7 / 14\n\
    \n企鹅兰登书屋有限责任公司\n\n第1版\n作者：克劳迪娅·阿尔维斯\n\n# 笨办法学 JavaScript 编程\n\n你需要知道的关于 JavaScript\
