    # # Introduction


    Getting started is easy, but there is a long way to go if you want to express
    all the possibilities of language. Javascript is one of the standard languages
    of the web and therefore ideal for many of the professionals who plan to dedicate
    themselves to this medium. But even if you don''t want to develop specifically
    for the web, Javascript is an excellent alternative for making mobile applications
    or desktop applications.


    Perhaps not all developers need to reach an advanced level of Javascript, but
    a basic knowledge will certainly be of great help at many points in their professional
    careers. In any case, once the learning is completed, you will have endless opportunities
    at your fingertips.


    We''ll start by looking at the state of Javascript today (2017) and the reasons
    why Javascript is worth using in general. Then we will take care of explaining
    how you can learn Javascript and get to whatever level we set ourselves.'
  - '[PAGE 12]


    # # Javascript is everywhere


    Javascript has become an ideal language to learn, since it has many and varied
    applications, in addition to providing simplicity for people who are starting
    out. To run it we only need a browser, although at the moment Javascript has surpassed
    the scope of web clients, to be located almost anywhere.'
  - '[PAGE 13]


    # Javascript on the web


    The environment where Javascript first appeared was the web. Its execution focused
    on the scope of a web page and allowed developers to provide interactivity, manipulate
    the document or the browser window, perform calculations, etc. Netscape Navigator,
    a browser that disappeared today, has the honor of having introduced Javascript
    as a language, although today it is supported by all web clients with which a
    user can navigate.


    Using Javascript for the web, in the browser environment, is also known as client-side
    programming. Today it is still the most common environment for Javascript execution,
    but it really is just one more among its possibilities.'
  - '[PAGE 14]


    # Javascript in the backend


    Certain developers came up with the idea that they could extract the Javascript
    runtime, which until then had only been available within the scope of the browser,
    to use it for any other purpose outside the web client. This is how NodeJS was
    born, which is nothing more than Javascript outside the browser.


    With NodeJS we can program with Javascript applications that run directly on the
    operating system and that are capable of solving any type of problem. With this
    technology, Javascript became a general-purpose programming language.


    One of the most common uses of NodeJS is backend programming. It allows you to
    program applications that are capable of running on the server, providing access
    to databases, the file system, and any other server-side resources. However, NodeJS
    is so comprehensive that it can be used for many other tasks, such as automation,
    optimization, or application deployment, among other operations.'
- md: '## Javascript as a language for device apps


    For years it has also been possible to use Javascript as a language for creating
    applications for devices (mobile apps, tablets, TVs ...). The applications developed
    are installed from the corresponding app stores of the main mobile systems and
    the user in principle does not perceive any difference from these with respect
    to the applications developed with the native languages. But, due to the fact
    that they are programmed with Javascript and HTML5, they open a new field of action
    for people experienced in developing for the web and dispense with the learning
    of native languages for each mobile platform.


    Initially, to run applications made in Javascript and HTML5, a "Web View" was
    required. Basically the function of the web view is to offer a framework for the
    execution of the app, so that it runs within a browser, even if the user does
    not perceive it. This situation has various advantages and disadvantages that
    we will not go into, but today there is also the possibility of using Javascript
    as a development language for native applications, which do not require a web
    view to function.


    Examples of frameworks for the development of applications based on web view we
    have Apache Cordova, Phone Gap or Ionic. Examples of frameworks for developing
    native applications using Javascript include Native Script and React Native. All
    the alternatives have the important advantage of producing apps for Android and
    iOS with the same code base, as well as for other minority systems.


    ## Javascript as a language for desktop applications


    Another area in which Javascript has penetrated strongly is in the development
    of applications for personal computers. With Javascript we are able to create
    advanced applications, capable of using all the resources of a computer and also
    run on any operating system we need.


    Using Javascript for desktop applications is easy thanks to projects such as Electron,
    which allows us to produce cross-platform applications, that is, they can be installed
    on Windows, Mac OS X and Linux. There are quite a few well-known applications
    developed with Electron, such as Atom, Visual Studio Code, Slack, Hyper, etc.


    ## Javascript on the web


    The field of action of Javascript is very wide, providing alternatives for almost
    any execution environment. However, if we want to start learning Javascript, the
    most suitable place is the web.


    Within the discipline of client-side development (Javascript executed within the
    browser environment) we can find different types of projects, which also require
    different approaches and knowledge.


    ## Websites


    When we refer to websites here we mean sites where the most important part is
    content, be they blogs, news pages, and even e-commerce.


    Javascript in these cases is dedicated to providing functionality and interaction,
    allowing for dynamic user interfaces, response to user actions, form validation,
    etc.


    ## Single Page Applications


    In recent years, the web has become popular as a platform for business applications.
    Applications called "management", which were previously run with desktop programs,
    today have web fronts that allow us to use them from the cloud, that is, from
    any browser connected to the Internet and without the need to install software
    on the machine. In this type of application, it is common to carry a large part
    of the processing load from the server side to the client. In this new paradigm,
    the browser is responsible for doing many more things than in traditional websites,
    such as creating the HTML code to visualize the data or navigating between screens
    or application routes.


    In Single Page Applications, also known as SPA, it is normal for the server to
    deliver only the raw business data and for the browser to do all the work of presenting
    that data in a suitable format (HTML is produced in the browser to represent that
    data). But what most characterizes a SPA is that navigation is always done within
    the same page and Javascript is in charge of presenting one or another screen
    to the user without having to reload the entire page.


    The two main factors that characterize SPAs, 1) the fact of bringing raw data
    from the server (lighter) and 2) all navigation is done within the same document,
    they produce web applications with a very fast response, providing an experience
    of use close to that of a desktop application.


    ## Libraries, frameworks and development "Vanilla Javascript" for the web


    The creation of a SPA is a much more advanced task than the development of a website
    and in order to carry out this work it is important that the development team
    is based on a Javascript framework, such as Angular, React, VueJS, Ember or Polymer.


    > Note: React and Polymer are considered more libraries, but with a series of
    add-ons, which they themselves provide in many cases, they offer as many features
    as those found in a framework. In some case someone does not know yet, a library
    is a set of functions, or classes and objects, that allows us to perform a range
    of common tasks for the development of certain application needs. A framework
    is mainly distinguished from a library because, in addition to providing code
    to solve common problems, it offers an architecture that developers must follow
    to produce applications and ensure better code quality and greater ease of maintenance.
    In other words, the framework, in addition to offering diverse utilities, marks
    a style and workflow when developing applications.


    For the development of websites, it would generally be sufficient to use pure
    Javascript, without the need to rely on any additional library. That "pure" Javascript
    development is generally known as "Vanilla Javascript".


    > Note: It should be clear that "Vanilla" is not a trademark or any flavor of
    Javascript beyond that of the language itself. It''s like a joke to indicate that
    with Javascript (and nothing else) you can solve all the things that libraries
    and ready-made frameworks offer you.


    However, it is also common for libraries such as jQuery to be used in website
    development. jQuery is a set of objects and functions (general utility code) that
    aims to help you manipulate the page, saving the differences between different
    browsers and allowing you to write a single code that runs correctly in any web
    client. In addition, jQuery offers you many functions that are really useful for
    the development of many common website tasks, which you can use faster than if
    you only work with Javascript.


    Note: Regarding jQuery, it is worth mentioning that there is a current of developers
    who warn that using jQuery is not absolutely necessary in most cases. Using jQuery
    is not bad, but many people implement it to solve needs that a little bit of Javascript
    "Vanilla" is capable of. Sometimes jQuery is loaded by default, perhaps for convenience,
    to get carried away or simply due to ignorance of the Javascript language itself,
    and yet very few of its functions are used.


    There are more specialized libraries to solve each and every one of the things
    that a general library like jQuery offers and that take up much less download
    weight and processing time for browsers.


    But beyond libraries and frameworks we must know that today, in addition to the
    language itself, there are many other Javascript-based technologies in browsers
    to solve a wide range of needs.


    ## HTML5 APIs


    With the advent of HTML5, there was a greater standardization of browsers, reaching
    a commitment by manufacturers to support web languages (HTML + CSS + Javascript)
    as dictated by their specifications. But it also produced an abundant stream of
    new specifications to work with the widest range of browser, computer, or device
    resources.


    HTML5 offers APIs for working with elements such as the camera, geolocation, storage,
    bitmap or vector drawing, audio, video, etc. Everything HTML5 offers is available
    in all browsers and is part of the Javascript developer''s toolkit, without using
    any library or framework.'
  mdcn: '

    ## Javascript 作为设备应用的编程语言


    多年来，Javascript 也一直可以作为创建设备应用程序（手机应用、平板电脑应用、电视应用……）的编程语言。开发出的应用程序从主要移动系统的相应应用商店安装，用户原则上不会感知到它与使用原生语言开发的应用程序之间有何区别。但是，由于它们是使用
    Javascript 和 HTML5 编程的，这为具有 Web 开发经验的人开辟了新的行动领域，免去了学习每个移动平台原生语言的需要。


    最初，要运行用 Javascript 和 HTML5 制作的应用程序，需要一个 "Web View"（网页视图）。基本上，Web View 的功能是为应用程序的执行提供一个框架，使其运行在浏览器中，即使用户并未察觉。这种情况有各种优缺点，我们在此不作深入探讨，但如今也有可能将
    Javascript 作为原生应用程序的开发语言，这类应用程序无需 Web View 即可运行。


    基于 Web View 开发应用程序的框架示例包括 Apache Cordova、Phone Gap 或 Ionic。使用 Javascript 开发原生应用程序的框架示例包括
    Native Script 和 React Native。所有这些方案都有一个重要的优势，即可以用同一套代码库为 Android 和 iOS 生成应用程序，同时也能支持其他小众系统。


    ## Javascript 作为桌面应用的编程语言


    Javascript 强势渗透的另一个领域是个人电脑应用程序的开发。借助 Javascript，我们能够创建高级应用程序，充分利用计算机的所有资源，并且可以在我们所需的任何操作系统上运行。


    借助 Electron 等项目，使用 Javascript 开发桌面应用程序变得非常容易，Electron 允许我们生成跨平台应用程序，即可以安装在 Windows、Mac
    OS X 和 Linux 上。有不少知名应用程序是使用 Electron 开发的，例如 Atom、Visual Studio Code、Slack、Hyper
    等。


    ## Javascript 在 Web 上的应用


    Javascript 的行动领域非常广泛，几乎为任何执行环境提供了替代方案。然而，如果我们想开始学习 Javascript，最合适的地方就是 Web。


    在客户端开发领域（在浏览器环境中执行的 Javascript），我们可以找到不同类型的项目，这些项目也需要不同的方法和知识。


    ## 网站


    当我们在此提及网站时，我们指的是内容为最重要部分的站点，无论是博客、新闻页面，还是电子商务网站。


    在这些情况下，Javascript 专注于提供功能和交互性，允许动态用户界面、响应用户操作、表单验证等。


    ## 单页应用程序


    近年来，Web 已经成为一个流行的企业应用程序平台。以前通过桌面程序运行的所谓"管理"应用程序，如今有了 Web 前端，允许我们从云端使用它们，即从任何连接到互联网的浏览器使用，无需在机器上安装软件。在这类应用程序中，将大部分处理负载从服务器端转移到客户端是很常见的。在这种新范式中，浏览器负责完成比传统网站多得多的工作，例如创建
    HTML 代码来显示数据，或在屏幕或应用程序路由之间导航。


    在单页应用程序（也称为 SPA）中，服务器通常只提供原始业务数据，而浏览器负责将这些数据以合适的格式呈现出来（在浏览器中生成 HTML 来表示这些数据）。但
    SPA 最大的特点在于，导航始终在同一页面内完成，Javascript 负责向用户展示一个又一个屏幕，而无需重新加载整个页面。


    SPA 的两个主要特征是：1）从服务器获取原始数据（更轻量）以及 2）所有导航都在同一文档内完成，它们使得 Web 应用程序具有极快的响应速度，提供了接近桌面应用程序的使用体验。


    ## 库、框架和用于 Web 的"原生 Javascript"开发


    创建 SPA 是比开发网站高级得多的任务，为了完成这项工作，开发团队基于 Javascript 框架（如 Angular、React、VueJS、Ember
    或 Polymer）进行开发非常重要。


    > 注意：React 和 Polymer 更多被认为是库，但借助一系列附件（在许多情况下它们自己提供），它们能提供与框架一样多的功能。对于某些还不知道的人来说，库是一组函数、类和对象，允许我们执行一系列常见任务以满足特定应用程序的开发需求。框架与库的主要区别在于，除了提供解决常见问题的代码外，它还提供了一种开发者必须遵循的架构来生产应用程序，以确保更好的代码质量和更高的可维护性。换句话说，框架除了提供各种实用工具外，还规定了开发应用程序时的风格和工作流程。


    对于网站开发，通常使用纯 Javascript 就足够了，无需依赖任何额外的库。这种"纯"Javascript 开发通常被称为"原生 Javascript"（Vanilla
    Javascript）。


    > 注意：应该明确的是，"Vanilla"不是商标，也不是Javascript 本身的任何一种变体。这只是个玩笑，意在说明仅用 Javascript（不借助其他东西）就能解决库和现成框架提供给你的所有问题。


    然而，在网站开发中使用 jQuery 等库也是很常见的。jQuery 是一组对象和函数（通用工具代码），旨在帮助你操作页面，屏蔽不同浏览器之间的差异，让你编写一份代码就能在任何
    Web 客户端中正确运行。此外，jQuery 为你提供了许多对常见网站开发任务非常有用的功能，使用起来比仅用 Javascript 更加快捷。


    注意：关于 jQuery，值得一提的是，有一部分开发者认为在大多数情况下使用 jQuery 并不是绝对必要的。使用 jQuery 本身没有错，但很多人使用它来解决一点"原生"Javascript
    就能处理的需求。有时 jQuery 被默认加载，也许是出于方便、随大流，或者仅仅是因为对 Javascript 语言本身缺乏了解，然而其功能却只用到了很少一部分。


    还有一些更专业的库，可以分别解决像 jQuery 这样的通用库所提供的每一项功能，而且它们的下载体积更小，浏览器处理时间也更短。


    但除了库和框架之外，我们必须知道，如今除了语言本身之外，浏览器中还有许多其他基于 Javascript 的技术，可以解决各种各样的需求。


    ## HTML5 API


    随着 HTML5 的出现，浏览器实现了更大程度的标准化，厂商达成了按照规范支持 Web 语言（HTML + CSS + Javascript）的共识。但同时它也产生了大量新的规范，用于与尽可能广泛的浏览器、计算机或设备资源进行交互。


    HTML5 提供了用于处理摄像头、地理定位、存储、位图或矢量绘图、音频、视频等元素的 API。HTML5 提供的所有内容在所有浏览器中都可用，是 Javascript
    开发者工具包的一部分，无需使用任何库或框架。

    '
