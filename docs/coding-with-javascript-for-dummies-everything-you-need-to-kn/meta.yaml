    ## Web Components


    互联网的下一次开发革命，截至2017年中尚未得到充分开发，被称为Web Components。它基于一组新的API（由多个规范共同组成），旨在创建组件。组件就像是新的HTML标签，任何开发者都可以创建它们来解决通用或特定的应用问题。


    借助Web Components，开发者可以通过创建具备高级封装能力的新型组件来扩展HTML，这些组件能够实现任何功能，同时尊重其自治性，并且可以在任何项目中使用，从而最大化代码复用能力，而无需依赖任何特定的库或框架。


    与HTML5一样，Web Components是浏览器默认提供的可能性之一，尽管目前其支持度尚不普遍。


    注意：在未来几个月内，预计所有浏览器都将支持Web Components V1，届时我们可以毫无限制地使用它。目前有一个Polyfill可以扩展浏览器对Web
    Components的支持，使其能够在尚不支持该特性的浏览器中使用。Polyfill字面意思是“间隙填充器”，用于弥补旧浏览器在标准支持上的不足。在HTML5
    API中，它们已开始被广泛使用，以允许在旧版或更新较少的客户端中使用网络语言的新特性。


    ## Javascript作为第一门语言


    如果你正在学习编程，Javascript是一个绝佳的入门选择。主要基于三个核心原因：


    ### 易于使用


    我们只需要一个浏览器就能执行Javascript。它不需要任何类型的编译（为特定操作系统创建二进制可执行文件的过程），而是解释型的。这带来了更简洁的工作流程，使入门变得容易。此外，Javascript是动态类型语言，其语法比其他语言更简洁，并且允许根据每位程序员的技能、偏好或习惯以不同方式完成任务。


    ### 应用领域广泛


    正如我们所见，Javascript的用途几乎不受限制。这意味着你几乎可以将这种语言用于任何你需要的场景。通过学习一种语言，你就能达成为自己设定的任何目标。


    ### 它是开放的、标准化的Web语言


    在职业生涯的某个阶段，大多数开发者将在Web环境中工作。学习Javascript编程确保了学生所学的知识能够直接应用于职业生涯的各个阶段。


    这些原因解释了为什么我们十多年来一直教授Javascript编程，以及为什么在2017年，著名的斯坦福大学将其用Java编写的编程入门课程改为了Javascript。


    ## 多种职业始于Javascript


    另一个值得从Javascript开始的原因是，该语言是在Web领域内从事多种需求职业的基本支柱之一。


    ### 前端开发者


    这是负责客户端开发的专业人员，尽管除了编程外，他还可能从事设计、布局、用户界面开发、客户端SPA应用等多种活动。Javascript知识对于前端开发者的各个工作领域都至关重要。


    ### 后端开发者


    后端我们理解为服务器端编程。对于后端来说，Javascript（配合NodeJS）确实是众多可能性之一。然而，NodeJS提供了许多优势，例如其异步性、速度和优化性，使其成为许多类型项目的理想选择。


    ### 全栈开发者


    全栈开发者是指能够同时处理客户端和服务器端工作的开发人员。实际上这是一种稀缺人才，以至于常有人说它实际上并不存在，因为它要求开发者掌握大量知识，因此单一的个人资料很难集所有技能于一身，或者说几乎不可能。然而，在我看来，在许多工作中这确实是一种现实，因为有些专业人员必须在多个领域拥有全面的知识（自主自由职业者是主要例子），因此这是一个真实存在的角色。如今，Javascript能够同时服务于客户端和服务器端，这使得全栈开发者的角色变得容易得多，并为成千上万的开发者带来了便利，因为它免除了他们在不同语言间频繁切换的思维疲劳。


    注意：专业化也存在于这些职业中。看到网络世界中个人资料如何发展，以及新的专业化职业如何年复一年地产生，确实令人惊叹。我们过去简单称为前端的东西，如今我们可以细分为数十种具体的职业或角色，例如“前端工程师”、“前端网页设计师”、“CSS架构师”、“移动端前端开发者”、“前端DevOps”……


    ## 如何学习Javascript


    达到Javascript的高级水平需要数月的学习，但入门很容易，并且很快你就能毫不费力地做出令人惊叹的事情。在Javascript手册中你将了解这门语言，但在开始之际，我们想给你几条建议。


    ### 学习Javascript本身，而非其衍生品


    如果你是初学者，我们的第一条建议是学习Javascript本身，而不是某个库或框架。归根结底，网络上的所有项目都使用Javascript，而你能用库或框架完成的一切，同样可以用Javascript实现。因此，正确的做法是首先掌握语言本身，然后在中长期设定新的目标。


    **简而言之，不要学习jQuery：学习Javascript。不要学习Angular：学习Javascript，不要学习React：学习Javascript……**
    掌握坚实的Javascript基础后，你以后学习任何想要基于的库或框架都会容易得多。此外，当你将来想做那些库不适用的事情，或想自定义应用程序的任何细节时，也不会遇到问题。


    除了Javascript的知识和使用，你还需要掌握浏览器（Web平台）默认提供给你的一切：HTML5和Web Components。基于“原生”Javascript、HTML5和Web
    Components所构建的一切，你都可以确信它能在你将来参与的任何项目中使用，无论该项目使用的是哪种库或框架。


    ### 了解Web平台


    我们的第二条建议是，如果你要在这个领域工作，必须牢记Web平台的每一个特性。你需要获取许多通用知识，这将为你在Web开发世界中的技能构建打下基础。


    - **了解媒介：** 你必须知道什么是互联网、Web、HTTP协议、域名系统，当然还有用于指定内容和形式的基本语言：HTML和CSS。

    - **设计知识：** 即使你的角色可能更偏向程序员，但至少从技术角度了解网页设计特性也是理想的。用户体验、可用性、通用图形设计或无障碍性都是重要方面。

    - **编程知识：** 如果你打算从事编程职业，仅仅掌握代码和结构化编程的基础知识是不够的，最好还要对面向对象编程、软件分析与设计、设计模式、数据库等产生兴趣。

    - **工具知识：** 专业人员还必须了解大量日常工作的工具，从命令行终端和服务器的基本管理，到任务自动化，再到版本控制工具（优先选择Git）和优化。


    ## Java与Javascript的区别


    我们正在介绍各种有趣的问题和冷知识，作为Javascript手册的引子，我们想讨论一下听到Javascript时最常产生的典型联想之一。我们指的是将它与另一种名为Java的编程语言联系起来，而这两者其实关系不大。


    Javascript之所以被这样命名，是因为推出Javascript的网景公司（Netscape），当时与Java的创造者Sun Microsystems结盟，想要利用Java的品牌形象和流行度，作为其推广新语言的策略。最终，创造出了一种在语法或名称上具有一定相似性的产品。它被塑造成一个“小兄弟”的形象，而

