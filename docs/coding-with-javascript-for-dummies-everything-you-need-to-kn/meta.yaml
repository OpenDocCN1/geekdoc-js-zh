    # # Chapter IV


    # ## Javascript operators


    When developing programs in any language, operators are used, which are used to
    make the calculations and operations necessary to carry out your objectives. Even
    the smallest program imaginable needs operators to do things, since a program
    that does not perform operations would only limit itself to always doing the same.


    It is the result of operations that makes a program vary its behavior according
    to the data it has to work with and offers us results that are relevant to the
    user who uses it. There are simpler or more complex operations, which can be performed
    with operands of different types, such as numbers or texts, we will see in this
    chapter, and the following, in detail, all these operators available in Javascript.'
  - '[PAGE 100]


    # Examples of using operators


    Before going to list the different types of operators, let''s see a couple of
    examples of these to help us get a more accurate idea of what they are. In the
    first example we are going to perform a sum using the sum operator.


    3 + 5


    This is a very basic expression that doesn''t make much sense on its own. It does
    the sum between the two operands number 3 and 5, but it does not help much because
    nothing is done with the result. Usually more than one operator is combined to
    create more useful expressions. The following expression is a combination between
    two operators, one performs a mathematical operation and the other is used to
    save the result.


    **myVariable** = 23 * 5


    In the previous example, the operator * is used to perform a multiplication and
    the operator = is used to assign the result in a variable, so we save the value
    for later use.


    Operators can be classified according to the type of actions they perform. Next,
    we will look at each of these groups of operators and describe the function of
    each one.'
  - '[PAGE 101]


    # Arithmetic operators


    They are those used to carry out simple mathematical operations such as addition,
    subtraction or multiplication. In javascript they are the following:


    +   + Sum of two values

    - Subtraction of two values, can also be used to change the sign of a number if
    we use it with a single operand -23

    * Multiplication of two values

    / Division of two values

    % The remainder of dividing two numbers (3% 2 would return 1, the remainder of
    dividing 3 by 2)

    ++ Increment in one unit, used with a single operand

    - Decrement in one unit, used with a single operand


    ```

    price = 128 // I introduce a 128 in the price variable

    units = 10 // another assignment, then we will see assignment operators

    invoice = price * units // multiply price by units, I get the invoice value

    remainder = invoice% 3 // I get the remainder from dividing the invoice variable
    by 3

    price ++ // increase the price by one unit (now worth 129)

    ```'
