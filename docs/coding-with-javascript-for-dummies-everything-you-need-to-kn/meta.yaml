  md: '# Array length


    In the previous article in the Javascript Manual we started to explain the concept
    of array and its use in Javascript. In this article, we will continue with the
    topic, showing the use of its length property.


    All arrays in javascript, apart from storing the value of each of their boxes,
    also store the number of positions they have. To do this they use a property of
    the array object, the length property. We will see in objects what a property
    is, but in our case we can imagine that it is like a variable, in addition to
    the positions, that stores a number equal to the number of boxes that the array
    has.


    To access a property of an object, the dot operator must be used. The name of
    the array that we want to access is written to the number of positions it has,
    without brackets or parentheses, followed by a period and the word length.


    ```

    var myArray = new Array ()


    myArray [0] = 155

    myArray [1] = 499

    myArray [2] = 65


    document.write ("Array length:" + myArray.length)

    ```


    This code would print on the screen the number of positions of the array, which
    in this case is 3. We remember that an array with 3 positions ranges from position
    0 to 2.


    It is very common for the length property to be used to traverse an array through
    all its positions. To illustrate it, we are going to see an example of a'
