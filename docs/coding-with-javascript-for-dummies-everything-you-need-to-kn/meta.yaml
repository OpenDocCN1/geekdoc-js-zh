    ## Data types in Javascript


    In our scripts we are going to handle various kinds of information variables,
    such as texts or numbers. Each of these kinds of information are the data types.
    Javascript distinguishes between three types of data and all the information that
    can be stored in variables will be embedded in one of these data types. Let''s
    take a closer look at what these three types of data are.


    ### Numeric data type


    There is only one numeric data type in this language, unlike in most of the better-known
    languages. All the numbers are therefore of the numerical type, regardless of
    the precision they have or if they are real or integer numbers. Integers are non-comma
    numbers, such as 3 or 339. Real numbers are fractional numbers, such as 2.69 or
    0.25, which can also be written in scientific notation, for example 2.482e12.


    With Javascript we can also write numbers in other bases, such as hexadecimal.
    Bases are numbering systems that use more or fewer digits to write numbers. There
    are three bases with which we can work:


    - Base 10 is the system that we usually use, the decimal system. Any number, by
    default, is understood to be written in base 10.

    - Base 8, also called the octal system, which uses digits from 0 to 7. To write
    a number in octal, just write that number preceded by 0, for example 045.

    - Base 16 or hexadecimal system, is the numbering system that uses 16 digits,
    those between 0 and 9 and the letters from A to F, for the missing digits. To
    write a number in hexadecimal we must write it preceded by a zero and an x, for
    example 0x3EF.


    ## Boolean type


    The type boolean is used to save a yes or no or in other words, a true or a false.
    It is used to perform logical operations, generally to perform actions if the
    content of a variable is true or false.


    If a variable is true then —— I execute some instructions

    If not —— I execute others

    The two values that boolean variables can have are true or false.


    ```javascript

    myBoleana = true

    myBoleana = false

    ```


    ## Data type character string


    The last type of data is the one used to save a text. Javascript has only one
    data type to save text and any number of characters can be entered. A text can
    be composed of numbers, letters and any other type of characters and signs. Texts
    are written in quotation marks, double or single.


    ```javascript

    myText = "Pepe is going to fish"

    myText = ''23 %% $ Letters & * - * ''

    ```


    Everything that is enclosed in quotation marks, as in the previous examples, is
    treated as a character string regardless of what we put inside the quotation marks.
    For example, in a text variable we can save numbers and in that case we have to
    take into account that text and numeric variables are not the same thing and while
    numerical variables are used to make mathematical calculations, text variables
    are not.


    ### Escape characters in text strings


    There are a series of special characters that are used to express certain controls
    in a text string, such as a line break or a tab. These are the escape characters
    and are written with special notation that starts with a backslash (a forward
    slash opposite the normal one) and then the code for the character to be displayed
    is placed.


    A very common character is the line break, which is achieved by typing \n. Another
    very common character is to place quotation marks, because if we put quotation
    marks without their special character, the quotation marks that we put in will
    start to close the character string. The quotation marks must then be entered
    with \" or \''. There are other escape characters, which we will see in the table
    below, which are more summarized, although the one used to write a backslash should
    also be highlighted as the usual character, so as not to confuse it with the start
    of an escape character, which is the double backslash.


    **Table with all escape characters**


    | Escape Character | Description |

    | :--- | :--- |

    | `\n` | Line break |

    | `\''` | Single quote |

    | `\"` | Double quote |

    | `\t` | Tab |

    | `\r` | Carriage return |

    | `\f` | Page advance |

    | `\b` | Move back space |

    | `\\` | Counterbar (backslash) |


    Some of these characters will probably never be used by you, as their function
    is a bit strange and sometimes unclear.


    ## Chapter IV


    ### Javascript operators


    When developing programs in any language, operators are used, which are used to
    make the calculations and operations necessary to carry out your objectives. Even
    the smallest program imaginable needs operators to do things, since a program
    that does not perform operations would only limit itself to always doing the same.


    It is the result of operations that makes a program vary its behavior according
    to the data it has to work with and offers us results that are relevant to the
    user who uses it. There are simpler or more complex operations, which can be performed
    with operands of different types, such as numbers or texts, we will see in this
    chapter, and the following, in detail, all these operators available in Javascript.


    ## Examples of using operators


    Before going to list the different types of operators, let''s see a couple of
    examples of these to help us get a more accurate idea of what they are. In the
    first example we are going to perform a sum using the sum operator.


    3 + 5


    This is a very basic expression that doesn''t make much sense on its own. It does
    the sum between the two operands number 3 and 5, but it does not help much because
    nothing is done with the result. Usually more than one operator is combined to
    create more useful expressions. The following expression is a combination between
    two operators, one performs a mathematical operation and the other is used to
    save the result.


    **myVariable** = 23 * 5


    In the previous example, the operator * is used to perform a multiplication and
    the operator = is used to assign the result in a variable, so we save the value
    for later use.


    Operators can be classified according to the type of actions they perform. Next,
    we will look at each of these groups of operators and describe the function of
    each one.


    ## Arithmetic operators


    They are those used to carry out simple mathematical operations such as addition,
    subtraction or multiplication. In javascript they are the following:


    - `+` Sum of two values

    - `-` Subtraction of two values, can also be used to change the sign of a number
    if we use it with a single operand (e.g., -23)

    - `*` Multiplication of two values

    - `/` Division of two values

    - `%` The remainder of dividing two numbers (3 % 2 would return 1, the remainder
    of dividing 3 by 2)

    - `++` Increment in one unit, used with a single operand

    - `--` Decrement in one unit, used with a single operand


    ```javascript

    price = 128 // I introduce a 128 in the price variable

    units = 10 // another assignment, then we will see assignment operators

    invoice = price * units // multiply price by units, I get the invoice value

    remainder = invoice % 3 // I get the remainder from dividing the invoice variable
    by 3

    price ++ // increase the price by one unit (now worth 129)

    ```'
