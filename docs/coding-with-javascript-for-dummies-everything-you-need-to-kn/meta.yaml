- md: "## Multidimensional arrays in Javascript\n\nAs we are seeing, arrays are quite\
    \ important in Javascript and also in most programming languages. Specifically,\
    \ we have already learned to create arrays and use them in previous articles in\
    \ the Javascript Manual. But we still have some important things to explain, such\
    \ as arrays of various dimensions.\n\nMultidimensional arrays are a data structure\
    \ that stores values in more than one dimension. The arrays that we have seen\
    \ so far store values in one dimension, so we only use an index to access positions.\
    \ 2-dimensional arrays store their values, so to speak, in rows and columns and\
    \ therefore we will need two indexes to access each of their positions.\n\nIn\
    \ other words, a multidimensional array is like a container that stores more values\
    \ for each position, that is, as if the elements of the array were in turn other\
    \ arrays.\n\nIn Javascript there is no real multidimensional array-object. To\
    \ use these structures we can define arrays where in each of their positions there\
    \ will be another array. In our programs we can use arrays of any dimension; we\
    \ will see below how to work with two-dimensional arrays, which will be the most\
    \ common.\n\nIn this example we are going to create a two-dimensional array where\
    \ we will have cities on the one hand and the average temperature in each one\
    \ during the winter months on the other.\n\n```javascript\nvar city_media_temperatures0\
    \ = new Array(3);\ncity_media_temperatures0[0] = 12;\ncity_media_temperatures0[1]\
    \ = 10;\ncity_media_temperatures0[2] = 11;\n```\n\n```javascript\nvar city_media_temperatures1\
    \ = new Array(3);\ncity_media_temperatures1[0] = 5;\ncity_media_temperatures1[1]\
    \ = 0;\ncity_media_temperatures1[2] = 2;\n```\n\n```javascript\nvar city_media_temperatures2\
    \ = new Array(3);\ncity_media_temperatures2[0] = 10;\ncity_media_temperatures2[1]\
    \ = 8;\ncity_media_temperatures2[2] = 10;\n```\n\nWith the previous lines we have\
    \ created three 1-dimensional arrays with three elements, like the idea we already\
    \ knew. Now we will create a new array of three elements and we will introduce\
    \ into each of its boxes the arrays created previously, with which we will have\
    \ an array of arrays, that is, a 2-dimensional array.\n\n```javascript\nvar cities_temperatures\
    \ = new Array(3);\ncities_temperatures[0] = city_media_temperatures0;\ncities_temperatures[1]\
    \ = city_media_temperatures1;\ncities_temperatures[2] = city_media_temperatures2;\n\
    ```\n\nWe see that to introduce the entire array we refer to it without parentheses\
    \ or brackets, but only with its name. The array `cities_temperatures` is our\
    \ two-dimensional array.\n\nIt's also interesting to see how a tour of a two-dimensional\
    \ array is performed. For this we have to make a loop that goes through each of\
    \ the squares of the two-dimensional array and within these make a new path for\
    \ each of its internal squares. That is, a tour of one array within another.\n\
    \nThe method of looping through another is to put one loop inside another, which\
    \ is called a nested loop. In this example we are going to put one FOR loop inside\
    \ another. In addition, we are going to write the results in a table, which will\
    \ complicate the script a bit, but this way we will be able to see how to build\
    \ a table from Javascript as we make the nested tour of the loop.\n\n```javascript\n\
    document.write(\"<table width = 200 border = 1 cellpadding = 1 cellspacing = 1>\"\
    );\nfor (i = 0; i < cities_temperatures.length; i++) {\n  document.write(\"<tr>\"\
    );\n  document.write(\"<td><b> City\" + i + \"</b></td>\");\n  for (j = 0; j <\
    \ cities_temperatures[i].length; j++) {\n    document.write(\"<td>\" + cities_temperatures[i][j]\
    \ + \"</td>\");\n  }\n  document.write(\"</tr>\");\n}\ndocument.write(\"</table>\"\
    );\n```\n\nThis script is a little more complex than those seen previously. The\
    \ first action is to write the table header, that is, the `<TABLE>` tag along\
    \ with its attributes. With the first loop we make a journey to the first dimension\
    \ of the array and use the variable `i` to keep track of the current position.\
    \ For each iteration of this loop we write a row and to start the row we open\
    \ the `<TR>` tag. In addition, we write in a box the number of the city that we\
    \ are visiting at that time. Later we put another loop that goes through each\
    \ of the cells of the array in its second dimension and write the temperature\
    \ of the current city in each of the months, inside its `<TD>` tag. Once the second\
    \ loop ends, all three temperatures have been printed and therefore the row is\
    \ finished. The first loop continues repeating until all cities are printed and\
    \ once finished we close the table.\n\nNote: You may have noticed that sometimes\
    \ generating HTML code from Javascript becomes complex. But the problem is not\
    \ only that the code is difficult to produce, but the worst thing is that you\
    \ create a code that is difficult to maintain, in which both the part of the programming\
    \ in Javascript is mixed with the part of the presentation in HTML. What you have\
    \ also seen is just a very simple code, with a really elementary table; imagine\
    \ what would happen when the table or the data were more complex. Fortunately,\
    \ there are better ways to generate HTML output than we have seen now, although\
    \ it is a bit advanced at the moment. Anyway, we leave you a link to the manual\
    \ of the Javascript Handlebars templates system, which is a simple library alternative\
    \ to generate HTML output from Javascript.\n\nWe can see the running example and\
    \ examine the entire script code.\n\n## Array initialization\n\nTo finish with\
    \ the topic of arrays, we are going to see a way to initialize its values at the\
    \ same time that we declare it, so we can carry out the process of entering values\
    \ in each of the positions of the array in a faster way.\n\nThe normal method\
    \ of creating an array we saw was through the Array object, putting the number\
    \ of boxes in the array in parentheses or not putting anything, so that the array\
    \ is created without any position. To introduce values to an array it is done\
    \ the same, but putting the values with which we want to fill the cells separated\
    \ by commas between the parentheses. Let's see it with an example that creates\
    \ an array with the names of the days of the week.\n\n```javascript\nvar diasWeek\
    \ = new Array(\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"\
    , \"Saturday\", \"Sunday\");\n```\n\nThe array is created with 7 boxes, from 0\
    \ to 6 and in each box the corresponding day of the week is written (in quotes\
    \ because it is a text).\n\nNow we are going to see something more complicated:\
    \ it is about declaring the two-dimensional array that we used before for the\
    \ temperatures of the cities in the months in a single line, entering the values\
    \ at the same time.\n\n```javascript\nvar cities_temperatures = new Array(new\
    \ Array(12, 10, 11), new Array(5, 0, 2), new Array(10, 8, 10));\n```\n\nIn the\
    \ example we introduce in each box of the array another array that has as values\
    \ the temperatures of a city in each month.\n\nJavascript still has a more summarized\
    \ way than the one we just saw, which we explained in the first article where\
    \ we covered arrays. To do this we simply put the data of the array we are creating\
    \ in square brackets. To finish we will show an example on how to use this syntax\
    \ to declare arrays of more than one dimension.\n\n```javascript\nvar arrayMuchasDimensiones\
    \ = [1, [\"hello\", \"que\", \"tal\", [\"these\", \"we are\", \"I am\"], [\"good\"\
    , \"bad\"], \"I just\"], 2, 5];\n```\n\nIn this example we have created a very\
    \ uneven array, because it has boxes with content of simple integers and others\
    \ with content of strings and others that are other arrays. We could access some\
    \ of their boxes and display their values like this:\n\n```javascript\nalert(arrayMuchasDimensiones[0]);\n\
    alert(arrayMuchasDimensiones[1][2]);\nalert(arrayMuchasDimensiones[1][3][1]);\n\
    ```\n\n## General introduction to objects in Javascript\n\nWe are going to introduce\
    \ ourselves to a very important Javascript topic such as objects. It is a topic\
    \ that we have not yet seen and on which we are going to constantly deal with\
    \ since most of the things in Javascript, even the simplest, we are going to do\
    \ through the handling of objects. In fact, in the examples made so far we have\
    \ made great efforts not to use objects and even so we have used them on occasion,\
    \ since it is very difficult to find examples in Javascript that, although simple,\
    \ do not make use of them.\n\nObject Oriented Programming (OOP) represents a new\
    \ way of thinking when making a program. Javascript is not a pure object-oriented\
    \ programming language because, although it uses objects many times, we don't\
    \ need to program all of our programs based on them. In fact, what we are generally\
    \ going to do with Javascript is use objects and not so much object oriented programming.\
    \ Therefore, the way of programming is not going to change much compared to what\
    \ we have seen so far in the Javascript Manual. In summary, what we have seen\
    \ so far regarding syntax, functions, etc. is still perfectly valid and can be\
    \ used just as indicated. We are only going to learn a kind of new structure such\
    \ as objects.\n\nNote: To start getting a bit soaked about objects we have a small\
    \ article published in DesarrolloWeb about object-oriented programming. It would\
    \ be highly recommended that you read it, because several concepts are explained\
    \ in which we will not go into so much detail. If you already know the OOP, continue\
    \ reading without pause, but if you want to go deeper, remember that we also have\
    \ a complete Object Orientation Manual. If you like to watch videos we also recommend\
    \ the \"What are the objects\" class taught in the Video Programming Course."
  mdcn: "\n## Javascript 中的多维数组\n\n正如我们所看到的，数组在 Javascript 以及大多数编程语言中都非常重要。具体来说，我们已经在\
    \ Javascript 手册的前面文章中学习了如何创建和使用数组。但仍有一些重要的内容需要讲解，例如各种维度的数组。\n\n多维数组是一种在多个维度上存储值的数据结构。我们之前看到的数组都只在一维上存储值，因此我们只需要一个索引来访问各个位置。二维数组将值存储在行和列中，因此我们需要两个索引来访问每个位置。\n\
    \n换句话说，多维数组就像一个容器，每个位置可以存储更多的值，就好像数组的元素本身又是数组一样。\n\n在 Javascript 中并没有真正的多维数组对象。要使用这种结构，我们可以定义数组，使得每个位置都是另一个数组。在我们的程序中，可以使用任意维度的数组；下面我们将介绍如何使用二维数组，它是最常见的。\n\
    \n在这个例子中，我们将创建一个二维数组，一边是城市，另一边是每个城市在冬季各月的平均温度。\n\n```javascript\nvar city_media_temperatures0\
    \ = new Array(3);\ncity_media_temperatures0[0] = 12;\ncity_media_temperatures0[1]\
    \ = 10;\ncity_media_temperatures0[2] = 11;\n```\n\n```javascript\nvar city_media_temperatures1\
    \ = new Array(3);\ncity_media_temperatures1[0] = 5;\ncity_media_temperatures1[1]\
    \ = 0;\ncity_media_temperatures1[2] = 2;\n```\n\n```javascript\nvar city_media_temperatures2\
    \ = new Array(3);\ncity_media_temperatures2[0] = 10;\ncity_media_temperatures2[1]\
    \ = 8;\ncity_media_temperatures2[2] = 10;\n```\n\n通过前面的代码，我们创建了三个一维数组，每个数组有三个元素，就像我们已经了解的那样。现在我们将创建一个包含三个元素的新数组，并将之前创建的数组放入其中，这样我们就得到了一个数组的数组，也就是一个二维数组。\n\
    \n```javascript\nvar cities_temperatures = new Array(3);\ncities_temperatures[0]\
    \ = city_media_temperatures0;\ncities_temperatures[1] = city_media_temperatures1;\n\
    cities_temperatures[2] = city_media_temperatures2;\n```\n\n我们可以看到，在引入整个数组时，只需使用其名称，而不需要括号或方括号。数组`cities_temperatures`就是我们的二维数组。\n\
    \n同样有趣的是了解如何遍历二维数组。为此，我们需要一个循环来遍历二维数组的每个单元格，并在这些单元格内部再为每个内部单元格进行新的遍历。也就是说，一个数组嵌套在另一个数组中进行遍历。\n\
    \n遍历另一个循环的方法是将一个循环放在另一个循环内部，这称为嵌套循环。在这个例子中，我们将把一个 FOR 循环放在另一个内部。此外，我们将结果写入一个表格，这会使脚本稍微复杂一些，但通过这种方式，我们可以在进行嵌套循环遍历的同时，了解如何从\
    \ Javascript 构建表格。\n\n```javascript\ndocument.write(\"<table width = 200 border\
    \ = 1 cellpadding = 1 cellspacing = 1>\");\nfor (i = 0; i < cities_temperatures.length;\
    \ i++) {\n  document.write(\"<tr>\");\n  document.write(\"<td><b> City\" + i +\
    \ \"</b></td>\");\n  for (j = 0; j < cities_temperatures[i].length; j++) {\n \
    \   document.write(\"<td>\" + cities_temperatures[i][j] + \"</td>\");\n  }\n \
    \ document.write(\"</tr>\");\n}\ndocument.write(\"</table>\");\n```\n\n这个脚本比之前看到的稍微复杂一些。第一步是写入表格的表头，即带有属性的`<TABLE>`标签。通过第一个循环，我们遍历数组的第一维，并使用变量`i`来跟踪当前位置。每次循环迭代时，我们写入一行，并以打开`<TR>`标签开始该行。此外，我们在一个单元格中写入当前正在访问的城市编号。然后，我们放置另一个循环来遍历数组第二维中的每个单元格，并在每个`<TD>`标签内写入当前城市各月的温度。第二个循环结束后，三个温度值都已打印完毕，因此该行结束。第一个循环继续重复，直到所有城市都打印完毕，最后我们关闭表格。\n\
    \n注意：你可能已经注意到，从 Javascript 生成 HTML 代码有时会变得很复杂。但问题不仅在于代码难以编写，更糟糕的是你创建了一个难以维护的代码，其中\
    \ Javascript 的编程部分和 HTML 的展示部分混杂在一起。你之前看到的只是一个非常简单的代码，包含一个非常基础的表格；想象一下当表格或数据更复杂时会发生什么。幸运的是，有比我们目前看到的更好的方式来生成\
    \ HTML 输出，虽然这目前有些超前。无论如何，我们为你提供了一个 Javascript Handlebars 模板系统的手册链接，这是一个简单的库，可以替代从\
    \ Javascript 生成 HTML 输出的方式。\n\n我们可以查看运行示例并检查整个脚本代码。\n\n## 数组初始化\n\n作为数组主题的最后部分，我们将介绍一种在声明数组的同时初始化其值的方法，这样我们可以更快地完成向数组每个位置输入值的过程。\n\
    \n我们之前看到的创建数组的正常方法是通过 Array 对象，在括号中放入数组的元素数量，或者不放任何内容，这样数组就会在没有任何位置的情况下创建。向数组引入值的方法相同，但将要填充单元格的值以逗号分隔放在括号中。让我们通过一个创建包含星期几名称的数组的例子来看一下。\n\
    \n```javascript\nvar diasWeek = new Array(\"Monday\", \"Tuesday\", \"Wednesday\"\
    , \"Thursday\", \"Friday\", \"Saturday\", \"Sunday\");\n```\n\n数组被创建了 7 个单元格，从\
    \ 0 到 6，每个单元格中写入了相应的星期几名称（因为是文本，所以用引号括起来）。\n\n现在我们来看一些更复杂的内容：将我们之前用于城市温度与月份对应的二维数组在一行中声明，并同时输入值。\n\
    \n```javascript\nvar cities_temperatures = new Array(new Array(12, 10, 11), new\
    \ Array(5, 0, 2), new Array(10, 8, 10));\n```\n\n在示例中，我们在数组的每个单元格中放入另一个数组，其值为某个城市各月的温度。\n\
    \nJavascript 还有比我们刚才看到的更简洁的方式，这在我们介绍数组的第一篇文章中已经解释过。为此，我们只需将要创建的数组的数据放在方括号中。最后，我们将展示一个使用这种语法声明多维数组的例子。\n\
    \n```javascript\nvar arrayMuchasDimensiones = [1, [\"hello\", \"que\", \"tal\"\
    , [\"these\", \"we are\", \"I am\"], [\"good\", \"bad\"], \"I just\"], 2, 5];\n\
    ```\n\n在这个例子中，我们创建了一个非常不规则的数组，因为它包含简单整数内容的单元格、字符串内容的单元格，以及其他数组单元格。我们可以像这样访问其中的一些单元格并显示其值：\n\
    \n```javascript\nalert(arrayMuchasDimensiones[0]);\nalert(arrayMuchasDimensiones[1][2]);\n\
    alert(arrayMuchasDimensiones[1][3][1]);\n```\n\n## Javascript 中对象的概述\n\n我们将介绍一个非常重要的\
    \ Javascript 主题——对象。这是一个我们尚未学习的主题，也是我们将持续讨论的内容，因为在 Javascript 中，即使是最简单的操作，我们也将通过对象的处理来完成。事实上，在目前所做的例子中，我们一直在努力不使用对象，但尽管如此我们还是在某些地方使用了它们，因为在\
    \ Javascript 中很难找到既简单又不使用对象的例子。\n\n面向对象编程（OOP）代表了一种编程的新思维方式。Javascript 不是一种纯粹的面向对象编程语言，因为尽管它经常使用对象，但我们并不需要将所有程序都基于对象来编写。事实上，我们通常在\
    \ Javascript 中做的是使用对象，而不是真正的面向对象编程。因此，与我们目前在 Javascript 手册中所学的内容相比，编程方式不会有太大变化。总之，我们目前在语法、函数等方面看到的内容仍然完全有效，可以按照所述方式使用。我们只是要学习一种新的结构——对象。\n\
    \n注意：要开始了解对象，我们在 DesarrolloWeb 上发表了一篇关于面向对象编程的小文章。强烈建议你阅读它，因为其中解释了我们将不会深入讨论的几个概念。如果你已经了解\
    \ OOP，可以继续阅读下去；但如果你想深入了解，请记住我们还有一个完整的面向对象手册。如果你喜欢观看视频，我们还推荐\"什么是对象\"这节课，它在视频编程课程中讲授。\n"
