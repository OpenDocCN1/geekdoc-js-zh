  md: "# Parameters\n\nParameters are used to send values to functions. A function\
    \ will work with the parameters to perform the actions. To put it another way,\
    \ parameters are the input values that a function receives.\n\nTo give an example\
    \ easy to understand, a function that performs a sum of two numbers would have\
    \ those two numbers as parameters. The two numbers are the input, as well as the\
    \ output would be the result of the sum, but we will see that later.\n\nLet's\
    \ look at a previous example in which we created a function to display a welcome\
    \ message on the web page, but now we are going to pass a parameter that will\
    \ contain the name of the person to be greeted.\n\n```\nfunction write Welcome\
    \ (name) {\n  document.write (\"<H1> Hello\" + name + \"</H1>\")\n}\n```\n\nAs\
    \ we can see in the example, to define a parameter in the function we have to\
    \ put the name of the variable that is going to store the data that we pass to\
    \ it. That variable, which in this case is called name, will have as value the\
    \ data that we pass to the function when we call it. In addition, the variable\
    \ where we receive the parameter will have life during the execution of the function\
    \ and will cease to exist when the function finishes its execution.\n\nTo call\
    \ a function that has parameters, place the value of the parameter in parentheses.\
    \ To call the example function you would have to write:\n\n```\nwriteWelcome (\"\
    Alberto García\")\n```"
  merge: -1
