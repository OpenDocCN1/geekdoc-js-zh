    \n## Javascript typeof operator for type control\n\nWe have been able to verify\
    \ that, for certain operators, the type of data they are handling is important,\
    \ since if the data is of one type, different operations will be performed than\
    \ if they are of another.\n\nFor example, when we used the operator +, if it was\
    \ numbers it added them, but if it was character strings it concatenated them.\
    \ We see then that the type of data we are using does matter and that we will\
    \ have to be aware of this detail if we want our operations to be carried out\
    \ as expected.\n\nTo check the type of a data you can use another operator that\
    \ is available as of Javascript 1.1, the typeof operator, which returns a text\
    \ string that describes the type of the operator that we are checking.\n\nNote:\
    \ throughout our experience with Javascript we will see that many times it is\
    \ more useful to change the data type of a variable before doing a check with\
    \ typeof to see if we can use it as an operand. There are several functions to\
    \ try to change the type of a variable, such as parseInt (), which we will see\
    \ later in the Second Part of the Javascript Manual.\n\n```javascript\nvar booleanVar\
    \ = true;\nvar numericVar = 22;\nvar floatingNumber = 13.56;\nvar text = \"my\
    \ text\";\nvar date = new Date();\ndocument.write(\"<br> Boolean type is: \" +\
    \ typeof booleanVar);\ndocument.write(\"<br> The numeric type is: \" + typeof\
    \ numericVar);\ndocument.write(\"<br> The type of floatingNumber is: \" + typeof\
    \ floatingNumber);\ndocument.write(\"<br> The text type is: \" + typeof text);\n\
    document.write(\"<br> The date type is: \" + typeof date);\n```\n\nIf we execute\
    \ this script we will obtain that the following text will be written on the page:\n\
    \n**Boolean type is: boolean**\n**The numeric type is: number**\n**The type of\
    \ floatingNumber is: number**\n**The text type is: string**\n**The date type is:\
    \ object**\n\nIn this example we can see that the different types of variables\
    \ are printed on the page. These can be the following:\n\n**boolean, for boolean\
    \ data. (True or false)**\n**number, for the numerical ones.**\n**string, for\
    \ character strings.**\n**object, for objects.**\n**function, for functions.**\n\
    **undefined, for declared variables that have not been assigned values.**\n\n\
    We want to highlight just two more details:\n\nNumbers, whether or not they have\
    \ a decimal part, are always of the numeric data type.\nOne of the variables is\
    \ a little more complex, it is the date variable which is an object of the Date\
    \ () class, which is used for handling dates in scripts. We will see it later,\
    \ as well as the objects.\nAlso note that Javascript functions are treated as\
    \ the\n\n## Recommendations with typeof\n\nIn our opinion it is not very appropriate\
    \ to constantly ask the type of a variable, to do different things when it has\
    \ one type or another. The normal thing is that you are clear about what type\
    \ of operation you want to perform at a given moment and that, if you are not\
    \ sure if the variable of one type or another has arrived, you convert it with\
    \ some function such as parseInt () or parseFloat (), that we will see later.\n\
    \nThe most useful case I can now remember is asking if the type of a variable\
    \ is undefined, which can give you the answer about whether the variable has been\
    \ initialized or not.\n\n```javascript\nlet variable;\nif (typeof variable ==\
    \ 'undefined') {\n    console.log('The variable is undefined, it has no defined\
    \ value.');\n}\n```\n\nAnother case that is often used a lot is when debugging,\
    \ when you need to find errors in your code, in the face of erratic and unexpected\
    \ operations. In those cases it is useful to consult the type of the variables,\
    \ because sometimes in Javascript they bring you surprises that make your programs\
    \ not work well.\n\n## Javascript control structures\n\nThe scripts seen so far\
    \ in the Javascript Manual have been tremendously simple and linear: simple statements\
    \ were executed one after the other from start to finish. However, this does not\
    \ always have to be the case and in fact, in most cases things are much more complex.\n\
    \nIf we have any experience in programming we will know that in programs it will\
    \ generally be necessary to do different things depending on the state of our\
    \ variables or to carry out the same process many times without writing the same\
    \ lines of code over and over again. Control structures are used to do more complex\
    \ things in our scripts. With them we can make decisions and loops. In the following\
    \ chapters we will learn about the different control structures that exist in\
    \ Javascript.\n\n## Decision making\n\nThey are used to perform some actions or\
    \ others depending on the state of the variables. That is, make decisions to execute\
    \ some instructions or others depending on what is happening at that moment in\
    \ our programs.\n\nFor example, depending on whether the user who enters our page\
    \ is of legal age or not, we may or may not allow him to view the contents of\
    \ our page.\n\n```\nIf age is greater than 18 then\n    I let you see the adult\
    \ content\nIf not\n    I'm sending you off the page\n```\n\nIn Javascript we can\
    \ make decisions using two different statements.\n\n- IF\n- SWITCH\n\n## Loops\n\
    \nLoops are used to perform certain actions repeatedly. They are widely used at\
    \ all levels in programming. With a loop we can, for example, print the numbers\
    \ from 1 to 100 on a page without having to write the print instruction a hundred\
    \ times.\n\n```\nFrom 1 to 100\n    Print the current number\n```\n\nIn Javascript\
    \ there are several types of loops, each one is indicated for a different type\
    \ of iteration and they are the following:\n\n- FOR\n- WHILE\n- DO WHILE\n\nAs\
    \ we have already pointed out, control structures are very important in Javascript\
    \ and in any programming language. That is why in the following chapters we will\
    \ see each of these structures carefully, describing their use and offering some\
    \ examples.\n\n## IF structure in Javascript\n\nIn the Javascript Manual of DesarrolloWeb.com\
    \ we have already begun to explain what control structures are. In this article,\
    \ we are going to show how the if statement works, which is the most common structure\
    \ used to make decisions in computer programs.\n\nIF is a control structure used\
    \ to make decisions. It is a conditional that is used to perform one or the other\
    \ operations based on an expression. It works as follows, an expression is evaluated\
    \ first, if it gives a positive result the actions related to the positive case\
    \ are performed.\n\nThe syntax of the IF structure is as follows.\n\n> Note: All\
    \ control structures are lowercase in Javascript. Although sometimes we can write\
    \ the name of the structure in the text of the manual in capital letters, in the\
    \ code of our scripts we always have to put it in lower case. Otherwise we will\
    \ receive an error message.\n\n```javascript\nif (expression) {\n    // actions\
    \ to be taken in the positive case\n    // ...\n}\n```\n\nOptionally, actions\
    \ can be indicated in case the evaluation of the sentence returns negative results.\n\
    \n```javascript\nif (expression) {\n    // actions to be taken in the positive\
    \ case\n    // ...\n} else {\n    // actions to be taken in the negative case\n\
    \    // ...\n}\n```\n\nLet's look at several things. To start, we see how the\
    \ keys include the actions that we want to carry out in case the expressions are\
    \ fulfilled or not. These keys must always be placed, except in the case that\
    \ there is only one instruction as actions to be performed, which are optional.\n\
    \nNote: Although the keys to encompass the statements to be executed in both the\
    \ positive and negative cases are optional when we want to execute a single statement,\
    \ the recommendation is to always place them, because we will thus obtain a clearer\
    \ source code. For example:\n\n```javascript\nif (it rains)\n  alert(\"Water falls\"\
    );\n```\n\nIt would be exactly like this code:\n\n```javascript\nif (it rains)\
    \ {\n  alert(\"Water falls\");\n}\n```\n\nOr even, just like this other:\n\n```javascript\n\
    if (it rains) alert(\"Water falls\");\n```\n\nHowever, when we use the keys, the\
    \ code is much clearer, because you can see at a glance what instructions are\
    \ depending on the positive case of the if. This is a detail that may not be very\
    \ important now, but it will be appreciated when the program is more complex or\
    \ when several programmers are in charge of touching the same code."
  mdcn: "\n在这种情况下，`/` 和 `%` 运算符首先从左到右执行。首先是乘法，然后是除法，因为除法在取模运算符的左侧。\n\n```\n36 + 4\
    \ - 4 % 3\n```\n\n现在执行取模运算。\n\n```\n36 + 4 - 1\n```\n\n最后从左到右执行加法和减法。\n\n```\n\
    40 - 1\n```\n\n从而得出以下数值。\n\n```\n39\n```\n\n无论如何，重要的是意识到使用括号可以省去很多麻烦，最重要的是，无需死记硬背运算符优先级表。当我们觉得语句执行顺序不清晰时，可以使用括号，从而强制先计算括号内的表达式片段。\n\
    \n## Javascript 用于类型控制的 typeof 运算符\n\n我们已经能够验证，对于某些运算符，它们处理的数据类型非常重要，因为如果数据是一种类型，执行的操作将与另一种类型时不同。\n\
    \n例如，当我们使用 `+` 运算符时，如果是数字，它会进行相加；但如果是字符串，它会进行拼接。由此可见，我们使用的数据类型确实很重要，如果我们希望操作按预期执行，就必须注意到这个细节。\n\
    \n要检查数据的类型，可以使用 Javascript 1.1 版本起提供的另一个运算符：`typeof` 运算符，它会返回一个描述我们正在检查的运算符类型的文本字符串。\n\
    \n注：在学习 Javascript 的过程中，我们会发现，在多次使用 `typeof` 检查是否可以用作操作数之前，先更改变量的数据类型往往更有用。有几个函数可以尝试更改变量的类型，例如\
    \ `parseInt()`，我们将在 Javascript 手册的第二部分稍后看到。\n\n```javascript\nvar booleanVar =\
    \ true;\nvar numericVar = 22;\nvar floatingNumber = 13.56;\nvar text = \"my text\"\
    ;\nvar date = new Date();\ndocument.write(\"<br> Boolean type is: \" + typeof\
    \ booleanVar);\ndocument.write(\"<br> The numeric type is: \" + typeof numericVar);\n\
    document.write(\"<br> The type of floatingNumber is: \" + typeof floatingNumber);\n\
    document.write(\"<br> The text type is: \" + typeof text);\ndocument.write(\"\
    <br> The date type is: \" + typeof date);\n```\n\n如果执行此脚本，我们将在页面上看到以下文本：\n\n**Boolean\
    \ type is: boolean**\n**The numeric type is: number**\n**The type of floatingNumber\
    \ is: number**\n**The text type is: string**\n**The date type is: object**\n\n\
    在这个例子中，我们可以看到页面上打印了不同类型的变量。它们可能是以下类型：\n\n**boolean，用于布尔数据。（真或假）**\n**number，用于数值类型。**\n\
    **string，用于字符字符串。**\n**object，用于对象。**\n**function，用于函数。**\n**undefined，用于已声明但未赋值的变量。**\n\
    \n我们想额外强调两点：\n\n无论数字是否具有小数部分，它们始终属于数值数据类型。\n其中一个变量稍微复杂一些，即日期变量，它是 `Date()` 类的对象，用于在脚本中处理日期。我们稍后将详细介绍它以及对象。\n\
    同时请注意，Javascript 函数被视为...\n\n## 关于 typeof 的建议\n\n在我们看来，不断询问变量的类型，并根据它是某种类型还是另一种类型来执行不同的操作，这并不太合适。正常情况应该是你清楚地知道在特定时刻想要执行什么类型的操作，如果你不确定传入的变量是哪种类型，你应该使用某些函数将其转换，例如\
    \ `parseInt()` 或 `parseFloat()`，我们稍后会介绍。\n\n我目前能想到的最实用场景是询问变量的类型是否为 `undefined`，这可以告诉你变量是否已被初始化。\n\
    \n```javascript\nlet variable;\nif (typeof variable == 'undefined') {\n    console.log('The\
    \ variable is undefined, it has no defined value.');\n}\n```\n\n另一种经常被使用的场景是在调试时，当你面对不稳定且意外的操作需要寻找代码中的错误时。在这种情况下，查询变量的类型很有用，因为\
    \ Javascript 有时会给你带来惊喜，导致程序运行不畅。\n\n## Javascript 控制结构\n\n到目前为止在 Javascript 手册中看到的脚本都极其简单且线性：简单的语句从开始到结束一个接一个地执行。然而，情况并非总是如此，事实上，在大多数情况下，事情要复杂得多。\n\
    \n如果我们有任何编程经验，就会知道在程序中通常需要根据变量的状态执行不同的操作，或者在不重复编写相同代码行的情况下多次执行同一个过程。控制结构用于在脚本中实现更复杂的功能。通过它们，我们可以进行决策和循环。在接下来的章节中，我们将学习\
    \ Javascript 中存在的不同控制结构。\n\n## 决策制定（条件判断）\n\n它们用于根据变量的状态执行某些操作。也就是说，根据程序在此时刻发生的情况，做出决定来执行某些指令。\n\
    \n例如，根据进入页面的用户是否成年，我们可以允许或不允许其查看页面的内容。\n\n```\n如果年龄大于 18 那么\n    我允许你查看成人内容\n\
    否则\n    我将把你移出页面\n```\n\n在 Javascript 中，我们可以使用两种不同的语句进行决策：\n\n- IF\n- SWITCH\n\
    \n## 循环\n\n循环用于重复执行某些动作。它们在编程的所有层级中都被广泛使用。通过循环，例如，我们可以地在页面上打印 1 到 100 的数字，而无需将打印指令写一百次。\n\
    \n```\n从 1 到 100\n    打印当前数字\n```\n\nJavascript 中有几种类型的循环，每种都适用于不同类型的迭代，它们分别是：\n\
    \n- FOR\n- WHILE\n- DO WHILE\n\n正如我们已经指出的，控制结构在 Javascript 和任何编程语言中都非常重要。因此，在接下来的章节中，我们将仔细查看每一种结构，描述其用法并提供一些示例。\n\
    \n## Javascript 中的 IF 结构\n\n在 DesarrolloWeb.com 的 Javascript 手册中，我们已经开始解释什么是控制结构。在本文中，我们将展示\
    \ `if` 语句是如何工作的，它是计算机程序中用于做出决策最常见的结构。\n\n`IF` 是一个用于做出决策的控制结构。它是一个条件语句，用于根据一个表达式执行某一项或另一项操作。它的工作原理如下：首先评估一个表达式，如果结果为正（真），则执行与正例相关的操作。\n\
    \n`IF` 结构的语法如下。\n\n> 注：Javascript 中的所有控制结构均为小写。虽然有时我们在手册的文本中会用大写字母写结构名称，但在脚本的代码中，我们必须始终将其写成小写。否则，我们将收到错误消息。\n\
    \n```javascript\nif (expression) {\n    // 正例时采取的行动\n    // ...\n}\n```\n\n可选地，可以在语句评估结果为负（假）时指定操作。\n\
    \n```javascript\nif (expression) {\n    // 正例时采取的行动\n    // ...\n} else {\n  \
    \  // 负例时采取的行动\n    // ...\n}\n```\n\n让我们看看几件事。首先，我们看到大括号包含了我们在表达式成立或不成立时想要执行的操作。这些大括号必须始终放置，除非只有一条指令作为要执行的操作，在这种情况下大括号是可选的。\n\
    \n注：虽然当我们只想执行单条语句时，包含正例和负例语句的大括号是可选的，但建议始终放置它们，因为这样可以获得更清晰的源代码。例如：\n\n```javascript\n\
    if (it rains)\n  alert(\"Water falls\");\n```\n\n这与以下代码完全一样：\n\n```javascript\n\
    if (it rains) {\n  alert(\"Water falls\");\n}\n```\n\n甚至与下面这个一样：\n\n```javascript\n\
    if (it rains) alert(\"Water falls\");\n```\n\n然而，当我们使用大括号时，代码会清晰得多，因为你可以一眼看出哪些指令取决于\
    \ `if` 的正例情况。这个细节现在可能不那么重要，但当程序变得更复杂或有多个程序员负责修改同一段代码时，它的价值就会体现出来。\n"
