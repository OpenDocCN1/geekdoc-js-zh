    ## Differences between Java and Javascript


    Most notable differences between Java and Javascript


    Some of the most representative differences between these two languages are the
    following:


    - **Compiler.** To program in Java we need a Development Kit and a compiler. However,
    Javascript is not a language that requires your programs to be compiled, but rather
    they are interpreted by the browser when it reads the page.


    - **Object oriented.** Java is an oriented programming language to objects. (Later
    we will see what it means object-oriented, for which you do not know yet). Javascript
    is a "multi-paradigm" language; it does not require object-oriented programming,
    although it does allow it. This means that we will be able to program in Javascript
    without creating classes, as is done in structured programming languages such
    as C or Pascal.


    - **Purpose.** Java in principle is much more powerful than Javascript, because
    it is a general-purpose language. With Java you can make applications of the most
    varied; however, with Javascript we can only write programs to run on web pages.
    Although to tell the truth, since the last decade Javascript has expanded so much
    that today we can use the language to make applications of all kinds, such as
    console programs, mobile applications, desktop applications, etc. Therefore, today
    it is Javascript we could say that it is almost as powerful, or more, than Java
    is.


    - **Static typing.** Java is a strongly typed programming language (also called
    static typing). This means that when declaring a variable in Java we will have
    to indicate its type and it will not be able to change from one type to another
    throughout the execution of the program. For its part, Javascript does not have
    this feature, but is a dynamic typing language (or slightly typed) and we can
    put the information we want in a variable, regardless of its type. In addition,
    we can change the data type of a variable when we want.


    - **Open language / proprietary language.** Another important difference is that
    Javascript is based on an open standard, which does not have a particular owner
    and therefore any manufacturer can freely implement it on their systems. However
    Java is a language owned by a company (currently Oracle), so it is directed with
    a particular and commercial approach.


    - **Other features.** As we see, Java is much more complex, but also more powerful
    and robust. Initially, Java has more functionalities than Javascript and requires
    much more intense learning to master it. Javascript makes learning easy, even
    for people with no programming experience, and allows you to make programs quickly,
    obtaining quite attractive results with little code and effort.


    The differences that separate Java from Javascript are therefore remarkable. They
    are also used for very different things. Java is more thought to make complex
    applications, oriented to the business world, or applications for Android phones.
    Javascript is intended to make applications heavier, mainly web-oriented.


    We want to point out that currently the Javascript web approach does not have
    to be considered unique. As we have said, it is possible to make almost any type
    of program using Javascript and in recent years it has been occupying more and
    more plots. Also, as new versions of the Javascript standard have been introduced,
    it has become more robust and suitable also for large applications.


    ## Before starting


    There are several points that we want to comment on as an introduction to the
    Javascript Manual and that you may want to know before starting to program. First,
    it would be good to get a more concrete idea of the possible applications that
    the language could have and that can be found on innumerable websites. In addition
    we also want to discuss the tools and prior knowledge we need to get down to work.


    ## Uses of Javascript


    Perhaps today it is superfluous to say what Javascript is for, but let''s briefly
    see some uses of this language that we can find on the web to get an idea of the
    possibilities it has.


    Without going any further, DesarrolloWeb.com uses Javascript for the top menu,
    which shows different links within each main option. We are changing the page
    from time to time, but in the current design of this website, elements such as
    the "Login" box also have their dynamism with Javascript.


    Currently almost all the slightly advanced pages use Javascript, as it has become
    one of the insignia of what is called Web 2.0 and the rich user experience. For
    example, popular websites like Facebook, Twitter or Youtube use Javascript in
    abundance. To be more specific, when we click on a link on the social network
    to comment on something, a small form is displayed on the page that appears as
    if by a video on magicians and is then sent without leaving the page itself. Also
    when we vote for a video on YouTube or when the characters that we have written
    in the Twitter mini-posts are counted, Javascript is used to perform small functionalities
    that cannot be done with HTML alone. You can actually see Javascript examples
    inside any slightly complex page. Some that we will have seen countless times
    are dynamic calendars to select dates, calculators or currency converters, rich
    text editors, dynamic browsers, etc.


    It is much more common to find Javascript to perform simple effects on web pages,
    or not so simple, such as dynamic browsers, opening secondary windows, form validation,
    etc. We dare to say that this language is really useful in these cases, since
    these typical effects have just enough complexity to be implemented in a matter
    of minutes without the possibility of errors. However, apart from those simple
    examples, we can find many applications on the Internet that base part of their
    operation on Javascript, which make a web page become a true interactive program
    for managing any resource. Clear examples are online office applications, such
    as Google Docs, Office Online or Google Calendar.


    ## What do you need to work with Javascript


    To program in Javascript we need basically the same as to develop web pages with
    HTML. A text editor and a browser compatible with Javascript. Any minimally current
    computer has everything it needs to be able to program in Javascript. For example,
    a Windows user has within their typical installation of the operating system,
    a text editor, Notepad, and a browser: Internet Explorer.


