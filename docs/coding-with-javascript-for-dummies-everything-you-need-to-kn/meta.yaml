- img_proc: true
  md: '# # Differences between Java and Javascript


    Most notable differences between Java and Javascript


    Some of the most representative differences between these two languages are the
    following:


    **Compiler.** To program in Java we need a Development Kit and a compiler. However,
    Javascript is not a language that requires your programs to be compiled, but rather
    they are interpreted by the browser when it reads the page.


    Object oriented. Java is a oriented programming language


    to objects. (Later we will see what it means object-oriented, for which you do
    not know yet). Javascript is a "multi-paradigm" language, it does not require
    object-oriented programming, although it does allow it. This means that we will
    be able to program in Javascript without creating classes, as is done in structured
    programming languages such as C or Pascal.


    **Purpose.** Java in principle is much more powerful than Javascript, because
    it is a general-purpose language. With Java you can make applications of the most
    varied, however, with Javascript we can only write programs to run on web pages.
    Although to tell the truth, since the last decade Javascript has expanded so much
    that today we can use the language to make applications of all kinds, such as
    console programs, mobile applications, desktop applications, etc. Therefore, today
    it is Javascript we could say that it is almost as powerful, or more, than Java
    is.


    **Static typing.** Java is a strongly typed programming language (also called
    static typing). This means that when declaring a variable in Java we will have
    to indicate its type and it will not be able to change from one type to another
    throughout the execution of the program. For its part, Javascript does not have
    this feature, but is a dynamic typing language (or slightly typed) and we can
    put the information we want in a variable, regardless of its type. In addition,
    we can change the data type of a variable when we want.'
  merge: -1
  pgno: 34
