    \ 0x61, 0x1D307); // \"\\uD834\\uDF06a\\uD834\\uDF07\"\n```\n\n```javascript\n\
    String.fromCodePoint('_'); // RangeError\nString.fromCodePoint(Infinity); // RangeError\n\
    String.fromCodePoint(-1); // RangeError\nString.fromCodePoint(3.14); // RangeError\n\
    String.fromCodePoint(3e-2); // RangeError\nString.fromCodePoint(NaN); // RangeError\n\
    ```\n\n`String.fromCharCode()` 函数无法找到数值大于最大值的字符。以下示例将返回一个 4 字节字符，加上 2 字节字符（即，它返回一个代表\
    \ 2 位文本字符串的字符，而不是 1 个）：\n\n```javascript\nconsole.log(String.fromCodePoint(0x2F804));\n\
    ```\n\n#### 浏览器支持较低\n`String.fromCodePoint` 函数是在 ECMAScript 2015 (ES6) 中添加的，尚未在所有浏览器中得到支持，因此可以使用以下代码来识别/兼容它：\n\
