  md: '**​**


    **HTML structure**


    You don’t need any special markup, just consistency. Each page should have the


    same overall skeleton:


    `<``**main**` `id=``"content"``>`​


    `<!-- your page markup -->`​


    `<``**h1**``>``Page 1``</``**h1**``>`​


    `<``**p**``>``Some content...``</``**p**``>`​


    `</``**main**``>`​


    ​


    `<``**nav**``>`​


    `<``**a**` `href=``"index.html"` `class=``"active"``>``Page 1``</``**a**``>`​


    `<``**a**` `href=``"page2.html"``>``Page 2``</``**a**``>`​


    `<``**a**` `href=``"page3.html"``>``Page 3``</``**a**``>`​


    `<``**a**` `href=``"page4.html"``>``Page 4``</``**a**``>`​


    `</``**nav**``>`


    The <main> region will hold the part of the page that changes, while the <nav>


    stays consistent. Keeping this structure identical across pages helps the browser


    align transitions cleanly.


    **​**


    **Opting into transitions**


    To activate view transitions across same-origin pages, add this global rule:


    `@``**view**``-``**transition**` `{`​


    `**navigation**``:` `**auto**``;`​


    `}`


    This tells the browser: “when navigating between documents, try to animate


    instead of instantly replacing.” If either the current page or the destination
    page


    lacks this rule, the transition won’t run. Browsers that don’t support the feature


    simply fall back to normal navigation, so you lose nothing.


