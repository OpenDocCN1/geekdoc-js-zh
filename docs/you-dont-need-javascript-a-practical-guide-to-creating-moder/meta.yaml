  md: 'PART 1 - Everyday Features


    Every website, no matter how simple, needs a handful of core building blocks.
    A


    smooth in-page navigation, a modal, an accordion, … These are the patterns


    visitors expect to work out of the box. In this part we’ll re-create those familiar


    features with modern HTML and CSS, keeping things accessible and lightweight.


    They’re the everyday components you’ll reach for again and again.


    So let’s jump right in!


    **I.1** **- Conditionally Styling with :has()**


    For a long time, CSS selectors only looked downward into the DOM. You could


    target children, descendants, or siblings, but you couldn’t ask anything about
    a


    parent. That gap forced developers to use JavaScript for what felt like a styling


    problem.


    The :has() pseudo-class finally closes that gap. Often nicknamed the “parent


    selector”, it lets you apply styles to an element based on what it contains. With


    :has(), CSS can now look both ways: not just down at descendants, but up and


    sideways into context.​


    **Understanding :has()**


    At its simplest, :has() matches an element when something inside it meets a


    condition. In practice, that usually means checking whether it contains a certain


    descendant. The syntax is intuitive:


    `/* Targets .card only if it contains an .active element */`​


    `.card``:has(.active)` `{`​


    `border-color``: green;`​


    `}`


    5'
