    \n### III.1 - 滚动驱动动画\n\n通常，CSS 动画是基于时钟运行的：你定义一个时长，浏览器随着时间的推移推进关键帧。在滚动驱动动画中，“时钟”被滚动位置取代了。当你移动页面时，浏览器将你的进度映射到动画的进度。\n\
    \n这些动画离线程运行，这意味着它们由浏览器的合成器（图形引擎）处理，而不是主 JavaScript 线程。益处是：运动更流畅且卡顿更少，因为它们不会与页面的脚本或布局工作竞争。\n\
    \n最终结果：滚动指示器根据页面滚动而增长。\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_83_0.png)\n\
    \n**基础 HTML 结构**\n\n我们需要一个可滚动的页面和一个显示进度的位置。思路是：一个包含进度条的头部，以及一个长到可以滚动的主区域。\n\n\
    ```html\n<header>\n  <h1>滚动动画</h1>\n  <div class=\"progress\"></div>\n</header>\n\
    \n<main>\n  <!-- 你的内容 -->\n</main>\n```\n\n在这里，`.progress` 是条容器。我们将在 `.progress`\
    \ 身上绘制固定背景，并使用 `::before` 伪元素绘制移动的填充，这样就不额外的 HTML 标记。\n\n**绘制轨道**\n\n```css\n\
    .progress {\n  background: #000;\n  height: 8px;\n  position: relative;\n}\n```\n\
    \n这创建了一个实心的黑色条。`position: relative;` 非常重要，因为它为我们将要添加的伪元素提供了定位上下文。将其想象为填充条将在其之上的“空轨道”。\n\
    \n**添加填充**\n\n```css\n.progress::before {\n  content: '';\n  position: absolute;\n\
    \  background: #55ad9b;\n  width: 100%;\n  height: 8px;\n  transform: scaleX(0);\n\
    \  transform-origin: left;\n}\n```\n\n在这里，伪元素是填充条。我们不是从 `width: 0` 开始，而是设置 `width:\
    \ 100%` 并通过 `scaleX(0)` 将其缩小。\n\n- `transform: scaleX(0)` 将其压缩为零。\n- `transform-origin:\
    \ left` 确保它从左边缘开始扩展。\n\n这样，我们只对 `transform` 执行动画，这对 GPU 是友好的，并且避免了布局偏移。\n\n**定义动画**\n\
    \n```css\n@keyframes grow {\n  to {\n    transform: scaleX(1);\n  }\n}\n```\n\n\
    此动画将条从无（`scaleX(0)`）缩放到它的完整宽度（`scaleX(1)`）。\n\n**将动画链接到滚动**\n\n```css\n.progress::before\
    \ {\n  ...\n  animation: grow linear both; /* 播放关键帧 */\n  animation-timeline:\
    \ scroll();\n}\n```\n\n在这里我们应用了 `grow` 关键帧，然后通过 `animation-timeline: scroll()`\
    \ 改变它们的“时钟”。浏览器将动画映射到页面的滚动位置。结果很容易理解：当你位于页面顶部时，条是折叠的；当你到达底部时，它完全展开，在之间它的缩放匹配你的滚动进度。\n\
