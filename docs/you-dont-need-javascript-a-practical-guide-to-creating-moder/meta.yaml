    ℹ️ **Browser Compatibility**


    -​


    Scroll-driven animations (animation-timeline: scroll() /


    view(), plus animation-range) work in current Chrome/Edge.


    Global browser support of ~76%.


    -​


    Use @supports so unsupported browsers just see a static track:


    `@``**supports**` `(animation-timeline: scroll()) {`​


    `.progress``:before` `{`​


    `animation``: grow linear forwards;`​


    `animation-timeline``:` `scroll``();`​


    `}`​


    `}`


    -​


    There are community polyfills that bring


    ScrollTimeline/ViewTimeline to more browsers (JavaScript-driven),


    e.g. flackr/scroll-timeline. Use only if the effect is critical and you


    accept the JS cost.


    ✅ **Key Takeaways**


    -​


    You’re not changing the animation, you’re changing the clock that


    drives it.


    -​


    animation-timeline: scroll() maps page scroll to keyframe


    progress, no duration required.


    -​


    Your animation stays tiny: one track, one pseudo-element, one


    keyframe block.


    -​


    Use @supports and design so the page reads fine without the


    animation, enhanced when supported.


