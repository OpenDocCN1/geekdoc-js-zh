  - '[PAGE 121]


    **​**


    **5- sibling-index() and sibling-count()**


    These functions return an element’s 1-based index among siblings and the total


    siblings count—integers you can drop into calc(), timing, or sizes. They’re


    shipping in Chrome/Edge 138+; other engines are evaluating.


    `/***** Simple stagger *****/`​


    `.card` `{`​


    `animation``: fade-up` `400ms` `ease both;`​


    `animation-delay``:` `calc``((sibling-index() -` `1``) *` `80ms``);`​


    `}`​


    ​


    `/***** Scale cards based on how many are in a row *****/`​


    `.row` `>` `.card` `{`​


    `--n``:` `sibling-count``();`​


    `flex-basis``:` `calc``(100% / var(--n));`​


    `}`​


    ​


    `/* Gate usage so older browsers ignore the fancy bits */`​


    `@``**supports**` `(z-index: sibling-index()) {`​


    `.card` `{`


    `outline-offset``:` `calc``(2px * sibling-index());`


    `}`​


    `}`​


    ​


    `@``**keyframes**` `fade-up {`


    `**from**` `{`


    `opacity``:` `0``;`


    `translate``:` `0``10px``;`


    `}`


    `}`


    This is fantastic for pure-CSS staggers and dynamic sizing without extra classes.


    **​**


    **6- More powerful attr()**


    The classic attr() could only feed strings into content. The redesigned


    attr() lets you read an element’s attribute, cast it to a type, and use it on
    any


    CSS property like numbers, colors, lengths, idents, percentages, even unitized


    121'
  - '[PAGE 122]


    values like deg and px. In Chrome 133+ this ships broadly. Other engines are


    exploring it, so treat it as progressive enhancement for now.


    `<``**div**` `class=``"chip"` `data-accent=``"#8b5cf6"` `data-w=``"16"`


    `data-rot=``"-6"``></``**div**``>`


    `/* Baseline styles */`​


    `.chip` `{`​


    `padding``: .``65rem``1rem``;`​


    `border``:` `2px` `solid rebeccapurple;` `/* fallback color */`​


    `inline-size``:` `16ch``;` `/* fallback width */`​


    `rotate``:` `0deg``;` `/* fallback angle */`​


    `}`​


    ​


    `/* Enhance where typed attr() is supported */`​


    `@``**supports**` `(border-color: attr(data-accent type(<color>))) {`​


    `.chip` `{`​


    `border-color``:` `attr``(data-accent type(<color>), rebeccapurple);`​


    `inline-size``:` `attr``(data-w ch, 16ch);` `/* unitized number` → `ch`


    `*/`​


    `rotate``:` `attr``(data-rot deg, 0deg);` `/* number` → `degrees */`​


    `}`​


    `}`


    You can also pull structured types, e.g. view-transition-name: attr(id


    type(<custom-ident>), none);, or accept multiple types: attr(data-size


    type(<length> | <percentage>), 24px). The key is that casting gives CSS


    a concrete value it can compute with, not just a string.


    Typed attr() across properties is Chrome/Edge 133+ today. MDN still marks


    non-content usage as experimental. Gate with @supports and provide


    readable fallbacks.


    **​**


    **7- field-sizing (auto-growing form controls)**


    field-sizing changes how form controls pick their size. With field-sizing:


    content, text inputs, textareas, selects, and file inputs shrinkwrap their content


