    **​**


    **Stacking everything with grid**


    We need the panels and slider to overlap perfectly. One option would be


    absolute positioning with top: 0; left: 0; right: 0; bottom: 0;. But


    that requires extra CSS and breaks easily when the container resizes.


    Instead, we let CSS Grid do the work:


    `.compare` `{`​


    `display``: grid;`​


    `}`


    ​


    `.compare` `> * {`​


    `grid-area``:` `1` `/` `1``;` `/* stack sections + slider */`​


    `}`​


    ​


    `**section**` `{`​


    `display``: grid;`​


    `align-items``: center;`​


    `justify-content``: center;`​


    `text-align``: center;`​


    `}`


    Because every child shares the same grid cell, they naturally stack without math


    or offsets. Resize the container, and everything still lines up.


    ​


    Everything elements are now on top of each other.


