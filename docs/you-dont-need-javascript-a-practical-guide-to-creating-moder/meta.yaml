- md: "\n## 3- Masonry-style layout via Item Flow\n\n\"Item Flow\" is a proposal to\
    \ unify placement across Flexbox and Grid and,\ncrucially, to make masonry a first-class\
    \ variant of Grid. It’s still being debated; the\nlatest WebKit posts show what\
    \ the syntax might look like and why.\n\n```css\n/* Proposal sketch from WebKit's\
    \ write-up */\n.gallery {\n  display: grid;\n  grid-template-columns: repeat(auto-fill,\
    \ minmax(14rem, 1fr));\n  item-flow: row collapse; /* collapse rows → classic\
    \ masonry \"waterfall\" */\n  gap: 1rem;\n}\n```\n\nDon’t ship this yet. It’s\
    \ for experimentation and feedback to the CSSWG.\n\n## 4- True randomness with\
    \ random()\n\nA CSS random() function is emerging that returns random values or\
    \ choices\nright in CSS. Great for offsets, delays, subtle texture, etc. Safari\
    \ Technology\nPreview has an early implementation.\n\n```css\n/* Safari Technology\
    \ Preview today; gate carefully */\n@supports (left: random(0px, 1px)) {\n  .confetti\
    \ > i {\n    animation-delay: random(0ms, 600ms, 50ms); /* stepped randomness\
    \ */\n    translate: random(-30vw, 30vw) random(-10vh, 10vh);\n  }\n}\n```\n\n\
    Use sparingly: it’s experimental and non-deterministic by definition.\n\n## 5-\
    \ sibling-index() and sibling-count()\n\nThese functions return an element’s 1-based\
    \ index among siblings and the total\nsiblings count—integers you can drop into\
    \ calc(), timing, or sizes. They’re\nshipping in Chrome/Edge 138+; other engines\
    \ are evaluating.\n\n```css\n/**** Simple stagger *****/\n.card {\n  animation:\
    \ fade-up 400ms ease both;\n  animation-delay: calc((sibling-index() - 1) * 80ms);\n\
    }\n\n/****** Scale cards based on how many are in a row *****/\n.row > .card {\n\
    \  --n: sibling-count();\n  flex-basis: calc(100% / var(--n));\n}\n\n/* Gate usage\
    \ so older browsers ignore the fancy bits */\n@supports (z-index: sibling-index())\
    \ {\n  .card {\n    outline-offset: calc(2px * sibling-index());\n  }\n}\n\n@keyframes\
    \ fade-up {\n  from {\n    opacity: 0;\n    translate: 0 10px;\n  }\n}\n```\n\n\
    This is fantastic for pure-CSS staggers and dynamic sizing without extra classes.\n\
    \n## 6- More powerful attr()\n\nThe classic attr() could only feed strings into\
    \ content. The redesigned\nattr() lets you read an element’s attribute, cast it\
    \ to a type, and use it on any\nCSS property like numbers, colors, lengths, idents,\
    \ percentages, even unitized\nvalues like deg and px. In Chrome 133+ this ships\
    \ broadly. Other engines are\nexploring it, so treat it as progressive enhancement\
    \ for now.\n\n```html\n<div class=\"chip\" data-accent=\"#8b5cf6\" data-w=\"16\"\
    \ data-rot=\"-6\"></div>\n```\n\n```css\n/* Baseline styles */\n.chip {\n  padding:\
    \ .65rem 1rem;\n  border: 2px solid rebeccapurple; /* fallback color */\n  inline-size:\
    \ 16ch; /* fallback width */\n  rotate: 0deg; /* fallback angle */\n}\n\n/* Enhance\
    \ where typed attr() is supported */\n@supports (border-color: attr(data-accent\
    \ type(<color>))) {\n  .chip {\n    border-color: attr(data-accent type(<color>),\
    \ rebeccapurple);\n    inline-size: attr(data-w ch, 16ch); /* unitized number\
    \ → ch */\n    rotate: attr(data-rot deg, 0deg); /* number → degrees */\n  }\n\
    }\n```\n\nYou can also pull structured types, e.g., view-transition-name: attr(id\
    \ type(<custom-ident>), none);, or accept multiple types: attr(data-size type(<length>\
    \ | <percentage>), 24px). The key is that casting gives CSS\na concrete value\
    \ it can compute with, not just a string.\n\nTyped attr() across properties is\
    \ Chrome/Edge 133+ today. MDN still marks\nnon-content usage as experimental.\
    \ Gate with @supports and provide\nreadable fallbacks.\n\n## 7- field-sizing (auto-growing\
    \ form controls)\n\nfield-sizing changes how form controls pick their size. With\
    \ field-sizing:\ncontent, text inputs, textareas, selects, and file inputs shrinkwrap\
    \ their content\nand grow as the user types—the browser does the measuring you\
    \ used to write\nJS for. Constrain with min/max-* so fields don’t collapse or\
    \ balloon.\n\n```html\n<label>\n  Name\n  <input type=\"text\" placeholder=\"\
    Ada Lovelace\">\n</label>\n\n<label>\n  Comment\n  <textarea rows=\"1\">Hi!</textarea>\n\
    </label>\n```\n\n```css\n/* One line to enable content-based sizing */\ninput,\
    \ textarea {\n  field-sizing: content;\n}\n\n/* Defensive limits (recommended)\
    \ */\ninput {\n  min-inline-size: 7ch;\n}\n\ntextarea {\n  min-block-size: 10rem;\n\
    \  min-inline-size: 20ch;\n  max-inline-size: 50ch;\n}\n```\n\nText inputs start\
    \ as wide as their caret or placeholder and grow until hitting your\nmax and textareas\
    \ expand inline, then add rows.\n\nShipping in Chrome/Edge (see the Chrome docs).\
    \ MDN lists it as limited\navailability and experimental, with other engines in\
    \ progress. Use as progressive\nenhancement and keep sane min/max guards.\n\n\
    ## Closing Thoughts\n\nWe’ve explored how many common UI patterns and effects\
    \ can be built today\nwithout heavy JavaScript. Smooth scrolling, modals, accordions,\
    \ carousels,\nanimations, validation… features that once meant dozens of lines\
    \ of\nscript are now possible with HTML and CSS. The guiding idea hasn’t changed:\
    \ **use the least power that gets the job\ndone**. By leaning on semantics and\
    \ native behavior, you get\nperformance, accessibility, and simplicity almost\
    \ for free. This doesn’t mean leaving JavaScript behind. It still shines where\
    \ it always has:data fetching, application logic, dynamic state. But when you\
    \ reach for it, it should be intentional. Not because “that’s how always done,”\
    \ but because it\ntruly adds value. As browsers evolve, the set of things you\
    \ don’t need JavaScript for will only grow. Staying curious and keeping up with\
    \ these changes ensures you’re building sitesthat are lighter, more resilient,\
    \ and kinder to both users and devices. So the next time you sit down to solve\
    \ a problem, take a moment before writing\nyour script. Ask yourself: Can HTML\
    \ and CSS do this?You might be surprised how often the answer is.\n\n## A Short\
    \ Checklist\n\n- Can semantics + CSS handle it? If yes, do that.\n- If not, can\
    \ a native element or attribute get you 80% there?\n- If you add JS, is it necessary,\
    \ small, and resilient?\n- Do you have graceful fallbacks and accessibility covered?\n\
    - Did you measure the impact (bundle size, CLS/LCP, battery/CPU)?\n\nBuild with\
    \ the least power necessary, and let the platform do the heavy lifting.\n\n##\
    \ Get Touch\n\nHave a question, found a typo, or want to suggest an improvement?\
    \ I’d love to\nhear from you!\n\nEmail me at hey@theosoti.com\n\nNeed help with\
    \ your CSS or website project? I’m available for freelance work\n\nLet’s work\
    \ together, just reach out!\n\nWant to keep learning more about modern CSS and\
    \ web design?Check out theosoti.com for articles, code examples, and updates.\n"
  mdcn: "\n\n## 3- 通过 Item Flow 实现瀑布布局（Masonry-style）\n\n“Item Flow”是一项旨在统一 Flexbox\
    \ 和 Grid 布局位置的提案，至关重要的是，它让瀑布布局（masonry）成为 Grid 的原生一级变体。目前该提案仍在讨论中；最新的 WebKit 文章展示了语法可能的样子以及原因。\n\
    \n```css\n/* 来自 WebKit 文章的提案草稿 */\n.gallery {\n  display: grid;\n  grid-template-columns:\
    \ repeat(auto-fill, minmax(14rem, 1fr));\n  item-flow: row collapse; /* 折叠行 →\
    \ 经典的瀑布“水流”效果 */\n  gap: 1rem;\n}\n```\n\n现在不要发布它。它用于实验以及向 CSSWG 收集反馈。\n\n## 4-\
    \ 使用 random() 实现真随机性\n\n一个 CSS `random()` 函数正在出现，它可以直接在 CSS 中返回随机值或选择。非常适合用于偏移量、延迟、微妙的纹理等。Safari\
    \ Technology Preview 已有了早期的实现。\n\n```css\n/* 今天的 Safari Technology Preview；请谨慎使用\
    \ */\n@supports (left: random(0px, 1px)) {\n  .confetti > i {\n    animation-delay:\
    \ random(0ms, 600ms, 50ms); /* 阶梯式随机 */\n    translate: random(-30vw, 30vw) random(-10vh,\
    \ 10vh);\n  }\n}\n```\n\n谨慎使用：它是实验性的，根据定义它是非确定性的。\n\n## 5- sibling-index() 和 sibling-count()\n\
    \n这些函数返回元素在同兄弟元素中从 1 开始的索引以及同兄弟元素的总数——这些整数可以放入 `calc()`、计时（timing）或尺寸属性中。它们将在\
    \ Chrome/Edge 138+ 中发布；其他引擎正在评估中。\n\n```css\n/**** 简单的交错效果 *****/\n.card {\n \
    \ animation: fade-up 400ms ease both;\n  animation-delay: calc((sibling-index()\
    \ - 1) * 80ms);\n}\n\n/****** 根据每行的数量缩放卡片 *****/\n.row > .card {\n  --n: sibling-count();\n\
    \  flex-basis: calc(100% / var(--n));\n}\n\n/* 限制用法，让旧浏览器忽略这些高级特性 */\n@supports\
    \ (z-index: sibling-index()) {\n  .card {\n    outline-offset: calc(2px * sibling-index());\n\
    \  }\n}\n\n@keyframes fade-up {\n  from {\n    opacity: 0;\n    translate: 0 10px;\n\
    \  }\n}\n```\n\n这对于纯 CSS 的交错效果和动态尺寸（无需额外的类名）来说太棒了。\n\n## 6- 更强大的 attr()\n\n经典的\
    \ `attr()` 只能向 `content` 传递字符串。重新设计的 `attr()` 允许你读取元素的属性，将其转换为某种类型，并将其应用于任何 CSS\
    \ 属性，如数字、颜色、长度、标识符、百分比，甚至是像 `deg` 和 `px` 这样带有单位的值。在 Chrome 133+ 中已广泛发布。其他引擎正在探索它，因此目前将其视为渐进式增强。\n\
    \n```html\n<div class=\"chip\" data-accent=\"#8b5cf6\" data-w=\"16\" data-rot=\"\
    -6\"></div>\n```\n\n```css\n/* 基础样式 */\n.chip {\n  padding: .65rem 1rem;\n  border:\
