  md: '✅ **Key Takeaways**


    -​


    Start with scroll-snap. It gives you pagination for free.


    -​


    Add buttons and markers by generating them in CSS, the browser


    wires up behavior and accessibility.


    -​


    Use anchor positioning so controls stay glued to the track as layouts


    change.


    -​


    Ship as progressive enhancement until support broadens. Your


    carousel is still great without the extras.


    **III.6** **- And more to come...**


    A handful of features are taking shape in specs and preview builds that could


    simplify whole classes of problems. They’re not production-ready yet, but they’re


    worth tracking and trying behind flags to shape the standards. Below you’ll find


    what each feature is with a tiny example.


    **​**


    **1- Native custom functions and mixins**


    The CSS Working Group published a Functions & Mixins draft. You can define


    your own dashed functions with @function and return computed values right


    inside CSS. Mixins (rule-level reuse) are planned in the same module but are not


    yet defined in the draft. Try custom functions today in experimental builds.


    `/* Define a dashed custom function that multiplies spacing */`​


    `@``**function**` `--space(--n <number> :` `1``) {`​


    `**result**``:` `**calc**``(1``**rem**` `*` `**var**``(``**--n**``));`​


    `}`​


    ​


    `.card` `{`​


    `/* Use the function like any other value */`​


