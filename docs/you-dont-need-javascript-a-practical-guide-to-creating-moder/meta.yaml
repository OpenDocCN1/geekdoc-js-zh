  md: '**​**


    **Associating the Tooltip**


    Now we need to tell the tooltip which anchor to follow. That’s done with


    position-anchor.


    `.tip` `{`​


    `position``: absolute;` `/* required for anchor positioning */`​


    `position-anchor``: --btn;` `/* bind to the button by name */`​


    `z-index``:` `10``;`​


    ​


    `/* visual skin (just for the demo) */`​


    `padding``: .``5rem` `.``75rem``;`​


    `background``:` `#111``;`​


    `color``: white;`​


    `border-radius``: .``5rem``;`​


    `}`


    Two rules make anchoring work:


    1.​ The element must be positioned (absolute or fixed), otherwise it has


    nothing to “lock” against.


    2.​ It must declare which anchor it belongs to with position-anchor.


    Think of it like this: “I’m absolutely positioned… but not relative to the container,


    I’m relative to the anchor named --btn.”


    **​**


    **Placing with anchor()**


    By default, the tooltip would stack in the top-left corner of the anchor. To control


    the exact relationship, we use the anchor() function:


    `.tip` `{`​


    `/* vertical: place top edge just below the anchor''s bottom */`​


    `top``:` `calc``(anchor(bottom) +` `8px``);`​


    ​


    `/* horizontal: center on the anchor */`​


    `left``: anchor(left);`


    `}`


