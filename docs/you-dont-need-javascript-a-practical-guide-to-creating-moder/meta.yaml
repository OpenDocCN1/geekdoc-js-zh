    \ how even the smallest details can transform a component and make interfaces\
    \ feel more polished. These flourishes demonstrate the creative power CSS has\
    \ gained in recent years. Now, let’s see how entire page changes can be animated.\n\
    \n## II.2 - View Transitions\n\nPage changes on the web have traditionally felt\
    \ abrupt. Click a link, and the old page instantly disappears while the new one\
    \ appears. That’s fast, but it lacks the kind of smoothness we associate with\
    \ native apps.\n\nThe View Transitions API changes that. It lets the browser capture\
    \ a snapshot of your content *before* and *after* navigation, then animate between\
    \ them automatically. Under the hood, the browser freezes the old content, layers\
    \ the new one on top, and runs a transition. By default it cross-fades, but you\
    \ can style it however you like: sliding, scaling, fading, or even more elaborate\
    \ effects.\n\nFinal result: pages transitioning by sliding from left to right.\n\
    \n![](img/3a45eae12017b03ce41b30e896bc70ee_55_0.png)\n\n### HTML structure\n\n\
    You don’t need any special markup, just consistency. Each page should have the\
    \ same overall skeleton:\n\n```html\n<main id=\"content\">\n  <!-- your page markup\
    \ -->\n  <h1>Page 1</h1>\n  <p>Some content...</p>\n</main>\n\n<nav>\n  <a href=\"\
    index.html\" class=\"active\">Page 1</a>\n  <a href=\"page2.html\">Page 2</a>\n\
    \  <a href=\"page3.html\">Page 3</a>\n  <a href=\"page4.html\">Page 4</a>\n</nav>\n\
    ```\n\nThe <main> region will hold the part of the page that changes, while the\
    \ <nav> stays consistent. Keeping this structure identical across pages helps\
    \ the browser align transitions cleanly.\n\n### Opting into transitions\n\nTo\
    \ activate view transitions across same-origin pages, add this global rule:\n\n\
    ```css\n@view-transition {\n  navigation: auto;\n}\n```\n\nThis tells the browser:\
    \ “when navigating between documents, try to animate instead of instantly replacing.”\
    \ If either the current page or the destination page lacks this rule, the transition\
    \ won’t run. Browsers that don’t support the feature simply fall back to normal\
    \ navigation, so you lose nothing.\n\n### Choosing what animates\n\nBy default,\
    \ the whole viewport fades. To take control, assign a transition name to the part\
    \ of the page you want to animate:\n\n```css\n#content {\n  view-transition-name:\
    \ content;\n}\n```\n\nHere, the browser takes a snapshot of #content on both pages\
    \ and links them together under the name content. Only elements with the same\
    \ name across both pages are paired up for animation.\n\n### Styling the snapshots\n\
    \nThe magic happens through two special pseudo-elements:\n\n```css\n::view-transition-old(content)\
    \ {\n  animation: translate-out 400ms linear both;\n}\n\n::view-transition-new(content)\
    \ {\n  animation: translate-in 400ms linear both;\n}\n```\n\n- ::view-transition-old(content)\
    \ targets the frozen snapshot of the element from the *previous* page.\n- ::view-transition-new(content)\
    \ targets the snapshot of the element on the *next* page.\n\nIn this example,\
    \ the old content slides out while the new content slides in. Remember, if you\
    \ don’t provide custom animations, the browser defaults to a cross-fade.\n\n###\
    \ Defining the motion\n\nThe keyframes below create a simple left-to-right swap:\n\
    \n```css\n@keyframes translate-out {\n  to {\n    translate: 100vw 0;\n  }\n}\n\
    \n@keyframes translate-in {\n  from {\n    translate: -100vw 0;\n  }\n}\n```\n\
    \nThe old snapshot moves right off-screen, while the new one enters from the left.\
    \ Because these animations run on snapshots, the actual layout of either page\
    \ stays completely stable. Your DOM is updated instantly, the user only sees the\
    \ transition layered above it.\n\nI have no codepen to share because we can’t\
    \ navigate in it. But you can check an example here: https://view-transitions.chrome.dev/pagination/spa/\n\
    \n### Respect reduced-motion\n\nAlways offer a fallback for users who prefer no\
    \ animation.\n\n```css\n@media (prefers-reduced-motion: reduce) {\n  @view-transition\
    \ {\n    animation: none;\n  }\n}\n```\n\nℹ️ **Browser Compatibility**\n\n- @view-transition:\
    \ ~81% global support.\n- ::view-transition-old() & ::view-transition-new(): ~89%\
    \ global support.\n- In unsupported browsers, it is simply ignored\n\n✅ **Key\
    \ Takeaways**\n\n- One at-rule and an attribute to animate view changes.\n- Mark\
    \ your element → enable transitions → style old → style new → define keyframes.\n\
    - Graceful fallback included.\n\nPage-to-page transitions proved that CSS can\
    \ now handle big, structural animations natively, without frameworks or plugins.\
    \ This is a huge win for smoother, faster navigation.\n\nNext up, we’ll guide\
    \ elements along custom paths.\n\n## II.3 - CSS Motion Path\n\nMotion Path is\
    \ the name of the specification that introduces offset-path, offset-distance,\
    \ and related properties. Together, these let you describe a shape (the path)\
    \ and move an element along it, in pure CSS.\n\nWe’ll keep this as small as possible:\
    \ one container, one SVG path, one square. No extra.\n\nFinal result: going from\
    \ left to right.\n\n### The Basic HTML Structure\n\nWe’ll start by creating an\
    \ SVG path for the element to follow. In this example we use a curve.\n\n```html\n\
    <div class=\"container\">\n  <svg viewBox=\"0 0 300 140\" aria-hidden=\"true\"\
    >\n    <path d=\"M16,120 C80,20 220,20 284,120\" />\n  </svg>\n  <div class=\"\
    box\"></div>\n</div>\n```\n\n### Draw the route\n\nAt this point the path exists,\
    \ but by default it shows up as a filled shape (because SVG paths have a fill\
    \ unless you override it). Here we just need the curve to be visible as a line.\n\
    \nFirst, we make sure the SVG stretches over the container:\n\n```css\nsvg {\n\
    \  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n}\n```\n\
    \nThen we style the path:\n\n```css\npath {\n  fill: none;\n  stroke: #999;\n\
    \  stroke-width: 2px;\n}\n```\n\nYou should now see a thin gray curve across the\
    \ container. This curve is the track for the motion path.\n\n### Make the Container\
    \ Match the SVG\n\nHere’s a subtle but critical detail: the container (here <div\
    \ class=\"container\">) must match the SVG’s dimensions. Why? Because the Motion\
    \ Path positions the moving element relative to the container. If your SVG defines\
    \ its drawing area with viewBox=\"0 0 300 140\", that means the path is drawn\
    \ on a grid that is 300px wide and 140px tall.\n\nTo make the path and the moving\
    \ element line up, the container should be set to the same size:\n\n```css\n.container\
    \ {\n  position: relative;\n  width: 300px;\n  height: 140px;\n}\n```\n\nIf the\
    \ sizes don’t match, the square will still move, but it won’t appear to follow\
    \ the visible curve.\n\n### Draw the square\n\nLet’s create a square 14px wide.\
    \ By default, the motion path positions the element’s center on the curve, so\
    \ the square will sit neatly on the path without extra alignment.\n\n[Note: Images\
    \ are referenced for context]\n![](img/3a45eae12017b03ce41b30e896bc70ee_55_0.png)\n\
    ![](img/3a45eae12017b03ce41b30e896bc70ee_60_0.png)\n![](img/3a45eae12017b03ce41b30e896bc70ee_61_0.png)\n\
    ![](img/3a45eae12017b03ce41b30e896bc70ee_62_0.png)\n"
