  md: 'Here the parent .card changes only when one of its children has the class


    .active.


    Think of :has() as a conditional filter: “apply this rule, but only if…”


    **​**


    **Practical Use Cases**


    Let''s examine real-world scenarios where :has() simplifies conditional styling


    therefore eliminating unnecessary JavaScript.


    ​


    1\. Styling based on form input


    Highlight a fieldset when one of its checkboxes is checked.


