    **III.5** **- Native CSS Carousels**


    Browsers can now generate real carousel controls (buttons + markers) that you


    style, while scroll-snap gives you the paginated feel. Ship the snap-only baseline


    everywhere, then layer the new bits as progressive enhancement.


    ​


    Final result: a fully functioning carousel.


    **​**


    **The Basic HTML Structure**


    A plain list becomes a carousel once we add CSS.


    `<``**ul**` `class=``"carousel"``>`​


    `<``**li**``><``**h3**``>``Slide 1``</``**h3**``></``**li**``>`​


    `<``**li**``><``**h3**``>``Slide 2``</``**h3**``></``**li**``>`​


    `<``**li**``><``**h3**``>``Slide 3``</``**h3**``></``**li**``>`​


    `<``**li**``><``**h3**``>``Slide 4``</``**h3**``></``**li**``>`​


    `</``**ul**``>`


    Short, semantic markup keeps the fallback great: without the new features,


    users still swipe/scroll a simple horizontal list.


    **​**


    **Lay out the track**


    `.carousel` `{`​


    `display``: flex;`​


    `gap``:` `4em``;`​


    `padding``:` `1em``;`​


    112


    ![](img/3a45eae12017b03ce41b30e896bc70ee_112_0.png)'
  - '[PAGE 113]


    `width``:` `800px``;`​


    `height``:` `500px``;`​


    `margin``: auto;`​


    ​


    `/* scrolling + pagination */`​


    `overflow-x``: hidden;`​


    `scroll-behavior``: smooth;`​


    `scroll-snap-type``: x mandatory;`​


    `overscroll-behavior-x``: contain;`​


    `}`​


    ​


    `.carousel` `>` `**li**` `{`​


    `list-style``: none;`​


    `flex``:` `0``0``100%``;`​


    `background``:` `#eee``;`​


    `border``:` `2px` `solid` `#000``;`​


    `scroll-snap-align``: center;`​


    ​


    `/* center the slide content */`​


    `display``: flex;`​


    `align-items``: center;`​


    `justify-content``: center;`​


    `}`


    Here the list becomes a snap container (scroll-snap-type: x mandatory)


    so each gesture lands on a defined stop, and each slide declares where it should


    settle (scroll-snap-align: center).


    We’ve also enabled scroll-behavior: smooth, which gives a gentle glide for


    programmatic navigation (we’ll trigger that with markers and arrows later).


    overflow-x: hidden creates the scroll container without exposing a rail.


    Users won’t drag the track, but the generated controls will still paginate it.
    If you


    want both drag and controls, swap to overflow-x: scroll.


