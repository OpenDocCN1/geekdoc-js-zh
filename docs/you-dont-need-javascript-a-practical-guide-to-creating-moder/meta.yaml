  md: 'Introduction


    JavaScript is powerful. No argument there. But what if much of what you''re


    solving with JS could be handled just as well, or even better, using modern CSS


    and semantic HTML? This book is based on a simple principle: use the least


    powerful tool that gets the job done.


    **The Rule of Least Power**


    This principle originates from the philosophy behind web standards: always


    choose the simplest tool that effectively accomplishes the job. Start with


    semantic HTML to structure your content, enhance presentation and


    interactions with CSS, and reach for JavaScript only when absolutely necessary.


    HTML and CSS are declarative languages. You describe your intent (the final look


    and behavior) and the browser determines the most efficient way to execute it.


    This approach inherently leads to simpler, more maintainable, and more


    accessible websites. JavaScript, however, is imperative. It demands that you


    explicitly define every step the browser must take, increasing complexity,


    performance overhead, and potential points of failure.


    **Why Do We Default to JavaScript?**


    It''s easy and tempting to reach for JavaScript. Popular frameworks such as React,


    Vue, and Angular have made rapid prototyping and rich interactivity extremely


    convenient. While this convenience has significant advantages, it also often leads


    to bloated bundles, slower load times, and unnecessary complexity.


    On the other hand, browsers have significantly evolved. Modern CSS and HTML


    have caught up remarkably, offering powerful capabilities once reserved solely


    for JavaScript. You can now implement sophisticated UI patterns such as modals,


    accordions, carousels, toggles, and animations purely through native browser


    technologies.


    2'
  merge: -1
  pgno: 2
- img_proc: true
  md: '**Why it Matters**


    Using minimal JavaScript translates to leaner codebases, improved accessibility,


    better performance, and reduced reliance on third-party libraries. Moreover, it


    results in decreased energy consumption, both for users and servers,


    significantly lowering your site''s environmental footprint.


    However, the aim isn''t to entirely remove JavaScript. Certain tasks like real-time


    data fetching, complex business logic, advanced interactivity, will always benefit


    from JS. The goal is balance: employ JavaScript exactly where it provides genuine


    value, not simply because it''s familiar or convenient.


    By embracing a CSS-first approach, you enhance accessibility inherently.


    Semantic HTML and native browser behaviors are optimized for assistive


    technologies, supporting a broader audience by default.


    **Performance and Sustainability**


    A lighter reliance on JavaScript also means faster initial load times, reduced
    CPU


    usage, and less battery drain. For instance, substituting a JavaScript slider
    library


    (which typically weighs 50-100KB of minified JS) with a pure CSS implementation


    reduces overhead and significantly boosts performance.


    This book invites you to pause before reaching for JavaScript. Always ask


    yourself first: Can CSS handle this? You''ll find that the answer is "yes" more
    often


    than you''d expect, empowering you to build faster, cleaner, and more accessible


    websites from the start.


    **Get in Touch**


    Have a question, found a typo, or want to suggest an improvement? I’d love to


    hear from you!​


    Email me at hey@theosoti.com


