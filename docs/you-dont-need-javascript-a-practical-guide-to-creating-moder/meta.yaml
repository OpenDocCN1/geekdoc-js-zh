    **​**


    **The Basic HTML Structure**


    Clean and semantic: a button (the anchor) and a tooltip.


    `<``**button**` `class=``"btn"` `aria-describedby=``"tip"``>``More options``</``**button**``>`


    ​


    `<``**div**` `class=``"tip"` `id=``"tip"` `role=``"tooltip"``>``Hello from CSS
    anchor`


    `positioning` 👋`</``**div**``>`


    -​


    The button is our anchor.


    -​


    The tooltip points to it with aria-describedby for accessibility.


    -​


    No wrappers or helper containers needed, the magic happens in CSS.


    **​**


    **Declaring the Anchor**


    To use an element as a reference point, you must give it a name with the


    anchor-name property:


    `.btn` `{`​


    `anchor-name``: --btn;` `/* this can be targeted by anchored elements`


    `*/`​


    `}`


    This is like putting a label on the button. Later, any other element (tooltip,


    dropdown, etc.) can say: “Stick to the anchor called --btn.”


    The double dashes are just a naming convention (like custom properties), you


    can call it --trigger, --menu, or anything you like.


