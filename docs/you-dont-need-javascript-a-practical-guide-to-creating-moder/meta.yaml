  md: '-​


    Ideal for form interactions, navigation highlights, and state-based


    component styling.


    -​


    Enhances accessibility and UI responsiveness directly through CSS.


    -​


    Use carefully to maintain performance and compatibility.


    ​


    CSS is evolving, giving us tools like :has() that revolutionize how we build for


    the web. Embracing these features simplifies our work and creates more


    efficient, elegant experiences.


    Next, let’s see how to create a dark mode to adapt our designs seamlessly to


    user preferences and modern browsing environments.


    **I.2** **-** **Dark Mode in CSS**


    Modern operating systems let people choose between light and dark themes,


    and websites are now expected to adapt automatically. Supporting both modes


    isn’t just about aesthetics, it improves readability in low-light conditions,
    reduces


    eye strain, and makes your site feel like it belongs on the platform.


    The good news: you can build a robust dark mode with very little JavaScript.


    In this chapter, we’ll walk through each of the new CSS tools, step by step, and


    show how to combine them into a flexible dark mode system that respects both


    system defaults and user choices.


    Final result: Darkmode on the left. Lightmode on the right.


    12


    ![](img/3a45eae12017b03ce41b30e896bc70ee_12_0.png)'
  merge: -1
  pgno: 12
- img_proc: true
  md: '**​**


    **Detecting the System Preference**


    The first piece of the puzzle is detecting whether the operating system is set
    to


    light or dark mode. CSS gives us a built-in media feature for this:


    prefers-color-scheme.


    `@``**media**` `(prefers-color-scheme: dark) {`​


    `:root` `{`​


    `--text-color``: white;`​


    `--link-color``: deeppink;`​


    `--background-color``: black;`​


    `}`​


    `}`​


    ​


    `@``**media**` `(prefers-color-scheme: light) {`​


    `:root` `{`​


    `--text-color``: black;`​


    `--link-color``: green;`​


    `--background-color``: white;`​


    `}`​


    `}`


    Here’s what’s happening:


    -​


    :root is a special selector that matches the top-level element of the


    document (the <html> element in HTML pages). It’s often used as a


    central place to define CSS variables.​


    -​


    CSS variables (technically called custom properties) are the


    --text-color, --link-color, and --background-color you see


    above. Unlike ordinary CSS properties, these act like reusable variables:


    you define them once and reference them anywhere with var(--name).


    So in this example, when the OS is in dark mode, the first block runs and sets
    the


    variables to light-on-dark colors. When it’s in light mode, the second block runs


    and sets dark-on-light values.


    This means that as soon as someone visits your site, the browser applies the


    right theme automatically.


    13'
  merge: -1
  pgno: 13
- img_proc: true
  md: '**​**


    **The light-dark() Helper Function**


    Writing both light and dark theme values separately can get repetitive. A new


    CSS function, light-dark(), helps streamline this.


    `:root` `{`​


    `color-scheme``: light dark;`​


    `/* light-dark(lightValue, darkValue) picks the correct one */`​


    `--text-color``:` `light-dark``(black, white);`​


