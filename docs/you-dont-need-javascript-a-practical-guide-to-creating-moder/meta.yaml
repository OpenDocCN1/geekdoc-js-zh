  - '[PAGE 91]


    **​**


    **The Basic HTML Structure**


    Every popover needs two parts:


    1.​ A trigger element (often a button)


    2.​ A popover element (any element with the popover attribute)


    `<``**button**` `popovertarget=``"more"``>``More options``</``**button**``>`​


    ​


    `<``**div**` `id=``"more"` `popover>`​


    `<``**p**``>``Native popover` 👋`</``**p**``>`​


    `</``**div**``>`


    Here’s what’s happening:


    -​


    The button has popovertarget="more". This wires it to the element


    with id="more".


    -​


    The <div popover> is now a real popover.


    -​


    When the button is clicked, the browser shows/hides the popover


    automatically.


    The browser also takes care of focus (moving it into the popover) and


    light-dismiss (closing on outside click or ESC). You don’t need a single line
    of


    JavaScript for those behaviors.


    **​**


    **Minimal skin (make it look like a card)**


    A popover is just another DOM element. To make it feel like a card, you add


    ordinary CSS:


    `[popover]` `{`​


    `padding``: .``75rem``1rem``;`​


    `border``:` `1px` `solid` `#e5e7eb``;`​


    `border-radius``: .``5rem``;`​


    `background``:` `#fff``;`​


    `box-shadow``:` `0``10px``30px``rgb``(0 0 0 / .12);`​


