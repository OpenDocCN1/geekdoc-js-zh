    </dialog>\n```\n\n这里有几个重要的细节：\n\n- aria-labelledby=\"modal-title\" 将对话框与其标题关联，以便屏幕阅读器使用。\n\
    - <form method=\"dialog\"> 内部的任何按钮都会通过调用 `modal.close()` 自动关闭对话框。不需要脚本。\n- 当对话框打开时，浏览器将把焦点锁定在其内部，并默认使背景变为非活动（inert）。\n\
    \n23\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_23_0.png)\n\n### 使用 JavaScript\
