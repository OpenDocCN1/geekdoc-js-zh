  mdcn: "\n\n```css\nimg {\n  animation: rotate-cover both;\n  animation-timeline:\
    \ view(inline);\n}\n```\n\n这里的技巧在于 `view(inline)`：动画进度不是绑定到页面滚动，而是绑定到每个元素的水平移动。一个动画调整堆叠顺序让中间的卡片位于最上方，而另一个动画在卡片跨越屏幕时对其旋转和缩放。\n\
    \n指向 codepen 的链接。\n\n## 区域元素显示\n\n你还可以让元素在滚动进入视图时逐渐出现。\n\n最终结果：滚动页面会使图片出现/消失。\n\
    \n```html\n<article>\n  <p>Some content</p>\n  <img src=\"https://picsum.photos/id/400/600/300\"\
    \ alt=\"placeholder\" />\n  <p>Some content</p>\n  <img src=\"https://picsum.photos/id/500/600/300\"\
    \ alt=\"placeholder\" />\n  <p>Some content</p>\n</article>\n```\n\n```css\nimg\
    \ {\n  position: relative;\n  left: -200px;\n  opacity: 0;\n  animation: fadeIn\
    \ linear forwards;\n  animation-timeline: view(); /* 进入时开始，退出时结束 */\n  animation-range-start:\
    \ 100px; /* 进入后 100px 开始动画 */\n  animation-range-end: 500px; /* 在视口中间附近完成 */\n\
    }\n\n@keyframes fadeIn {\n  to {\n    opacity: 1;\n    left: 0;\n  }\n}\n```\n\
    \n在这里，`view()` 将动画绑定到图片通过视口的过程。范围（100px → 500px）延迟了效果，使得图片不会在边缘立即出现，而是随着你向下滚动，更平滑地淡入并移动到位置。\n\
    \n指向 codepen 的链接。\n\n你可以在滚动驱动动画（Scroll Driven Animation）中找到很多其他用例和演示。\n\nℹ️ **浏览器兼容性**\n\
    \n- 滚动驱动动画（`animation-timeline: scroll() / view()` 加上 `animation-range`）在当前的 Chrome/Edge\
    \ 中可用。全局浏览器支持率约为 76%。\n- 使用 `@supports` 让不支持的浏览器显示静态轨道：\n```css\n@supports (animation-timeline:\
    \ scroll()) {\n  .progress:before {\n    animation: grow linear forwards;\n  \
    \  animation-timeline: scroll();\n  }\n}\n```\n- 存在社区补丁程序（polyfills），可以将 ScrollTimeline/ViewTimeline\
    \ 引入更多浏览器（由 JavaScript 驱动），例如 `scroll-timeline`。仅当效果至关重要且你接受 JS 开销时才使用。\n\n✅ **核心要点**\n\
    \n- 你不是在改变动画，而是在改变驱动它的“时钟”。\n- `animation-timeline: scroll()` 将页面滚动映射到进度，不需要持续时间。\n\
    - 你的动画保持非常精简：一个轨道、一个元素、一个关键帧块。\n- 使用 `@supports` 并进行设计，确保在不支持动画的情况下页面也能正常阅读。\n\
    \n滚动驱动的动画展示了 CSS 现在如何将效果与用户的滚动行为同步，使布局变得动态且生动。这是一个以自然方式将动作与意图连接的功能。\n\n## III.\
    \ 原生弹出层 (Native Popovers)\n\n菜单、工具提示、提示框……这些无处不在。但在历史上，构建它们非常混乱：你必须连接属性、处理焦点、管理\
    \ z-index 堆叠，并为打开/关闭切换以及外部点击关闭编写 JavaScript。\n\nPopover API 解决了所有这些问题。只需两个属性，你就能获得：\n\
    - 自动顶层堆叠（始终在最上方）\n- 焦点管理（打开时焦点在内部，关闭时返回）\n- 轻量级点按（ESC 键和外部点击）\n- 无需 JavaScript\
    \ 的整洁、可访问行为\n\n在此基础上叠加 CSS 进行设计。无需库，无样板代码。最终结果：左侧 - 弹出层；右侧 - 显示弹出层。\n\n### 基础结构\n\
    \n每个弹出层都需要两个部分：\n1. 一个触发元素（通常是按钮）\n2. 一个弹出层元素（任何带有 `popover` 属性的元素）\n\n```html\n\
    <button popovertarget=\"more\">Options</button>\n<div id=\"more\" popover>\n \
    \ <p>Native popover</p>\n</div>\n```\n\n这里正在发生的是：\n- 按钮拥有 `popovertarget=\"more\"\
    `。这将其连接到 id 为 `more` 的元素。\n- `popover` 现在是一个真正的弹出层。当点击按钮时，浏览器会自动显示/隐藏弹出层。浏览器还会处理焦点（将其移动到弹出层内）和轻量级点按（点击外部时关闭）。你不需要为这些行为编写任何\
    \ JavaScript 代码。\n\n### 极简皮肤（使其看起来像卡片）\n\n弹出层只是另一个 DOM 元素。要让它看起来像卡片，只需添加普通的 CSS：\n\
    \n```css\n[popover] {\n  padding: 0.7rem 1rem;\n  border: 1px solid #e5e7eb;\n\
    \  border-radius: 0.5rem;\n  background: #fff;\n  box-shadow: 0 10px 30px rgb(0\
    \ 0 0 / .12);\n}\n```\n\n这赋予了它一种轻量、悬浮的样式。ℹ️ 注意你不需要处理 `position`、`inset` 或 `margin`。位置由浏览器的顶层系统处理。如果你覆盖了它，可能会可能会破坏内置逻辑。\n\
    \n### 内置关闭控制\n\n你通常希望弹出层能从内部关闭（例如一个 ✕ 按钮）。这同样是内置的：\n\n```html\n<div id=\"more\"\
    \ popover>\n  <p>Native popover</p>\n  <button popovertarget=\"more\" popovertargetaction=\"\
    hide\" aria-label=\"Close\">✕</button>\n</div>\n```\n\n`popovertarget` 属性将此按钮链接到同一个弹出层。而\
    \ `popovertargetaction` 属性控制行为：\n- toggle（默认）→ 关闭时则打开，打开时则关闭\n- show → 始终打开它\n\
    - hide → 始终关闭它\n\n这是声明式控制，浏览器在没有事件监听器或脚本的情况下处理状态变化。\n\n### 添加动画\n\n默认情况下，弹出层只是“弹出”出现和消失。这虽然功能可行，但不精致。要为它们添加动画，请定义关闭状态和打开状态，然后让\
    \ CSS 过渡完成剩余工作。\n\n```css\n/* 添加到你的基础规则中 */\n[popover] {\n  transform: translateY(-50px);\n\
    \  opacity: 0;\n  transition: transform 0.5s, opacity 0.5s, display 0.5s;\n  transition-behavior:\
    \ allow-discrete; /* Enables关闭动画 */\n}\n\n/* 添加到你的打开状态规则中 */\n[popover]:popover-open\
    \ {\n  transform: translateY(0);\n  opacity: 1;\n  /* 进入过渡的初始值 */\n  @starting-style\
    \ {\n    transform: translateY(-50px);\n    opacity: 0;\n  }\n}\n```\n\n这里发生的是：\n\
    - 在关闭状态下，弹出层向上偏移且完全透明。\n- 当打开时 (`:popover-open`)，它移动到位置并淡入。\n- `@starting-style`\
    \ 定义了进入过渡开始的帧。\n- `transition-behavior: allow-discrete` 允许在弹出层从 DOM 流中移除之前播放关闭动画。\n\
    \n结果是：进入和退出时都有平滑的滑入和淡入效果。\n\n## 另一个用例：侧边栏菜单\n\n最终结果：整个菜单像抽屉一样从右侧出现。\n\n使用 popover\
    \ 作为右侧抽屉菜单。一个按钮显示菜单，一个\n\n"
