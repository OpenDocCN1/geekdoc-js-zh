  md: 'On the html element, this makes the whole page scroll smoothly whenever you


    navigate to an anchor (#section-id).


    By default, browsers keep this behavior consistent and safe: if the property isn’t


    supported, scrolling simply falls back to normal jumps, nothing breaks.


    To ensure consistent behavior everywhere, you can handle it yourself:


    `@``**media**` `(prefers-reduced-motion: reduce) {`​


    `**html**` `{`​


    `scroll-behavior``: auto;`​


    `}`​


    `}`


    **​**


    **Smooth scrolling in scrollable containers**


    scroll-behavior also works on elements with their own scrollbars. This is


    useful for things like sidebars, chat windows, or code panels.


    `.sidebar` `{`​


    `overflow-y``: auto;`​


    `scroll-behavior``: smooth;`​


    `}`


    With this in place:


    -​


    If JavaScript scrolls the container (element.scrollTo() or


    element.scrollIntoView()), the scroll will animate.


    -​


    If a user tabs through inputs or focusable items inside the container, the


    browser will scroll smoothly to reveal them.


    So, setting html { scroll-behavior: smooth; } makes all in-page links


    scroll smoothly across the entire page. But you’re not limited to the page itself.


    You can also enable smooth scrolling inside any scrollable element, like sidebars,


    chat windows, or code panels.


