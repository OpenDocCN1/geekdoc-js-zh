    entirely, if you don’t need a visible trace.\n\nFor example, you can hide the\
    \ outline simply by removing the stroke\nproperties:\n\npath {\n  fill: none;\n\
    \  /* stroke removed -- path is now invisible */\n}\n\nThe square (or whatever\
    \ element you animate) will still follow the curve\nperfectly.\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_65_0.png)\n\
    \nThe square is moving without the visual line.\n\nUse the outline when you want\
    \ users to see a track, skip it when you want a\n“floating” effect.\n\n## Accessibility\n\
    \nAnimations can be distracting or uncomfortable for some users. As always, we\n\
    should respect their preferences by checking prefers-reduced-motion:\n\n@media\
    \ (prefers-reduced-motion: reduce) {\n  .box {\n    animation: none; /* stop the\
    \ movement */\n  }\n}\n\nIn some cases, the moving element doesn’t add any real\
    \ value on its own. If it’s\npurely decorative, it might be better to hide it\
    \ entirely when motion is disabled:\n\n@media (prefers-reduced-motion: reduce)\
    \ {\n  .box {\n    display: none; /* remove it if animation isn't meaningful */\n\
    \  }\n}\n\nThat way you respect the user’s preferences and keep the page free\
    \ of distractions.\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_66_0.png)\n\n##\
    \ Troubleshooting\n\nIf the square travels near the line rather than on it, check\
    \ these three things in\norder:\n\n- Make sure the container’s CSS width and height\
    \ match the dimensions\ndefined in the SVG’s viewBox (300 × 140 in this example).\n\
    - Verify that the CSS path('...') string and the SVG d=\"...\" value are\ncharacter-for-character\
    \ identical.\n- Ensure the square starts at the origin with top: 0; left: 0.\n\
    \nWhen you need the curve to resize fluidly with the layout, the simplest approach\n\
    is to scale the entire stage. If the curve must actually reshape, you’ll need\
    \ to\nupdate the path data, which is one of the few cases where a tiny bit of\
    \ JavaScript\nto generate coordinates can be justified.\n\nHere’s a Codepen to\
    \ see the demo.\n\nℹ️ **Browser Compatibility**\n\n- offset-path, offset-distance,\
    \ and offset-rotate: ~93,5%\nglobal support.\n- In older engines that ignore these\
    \ properties, the square remains\nstatic while the rest of the page renders normally.\
    \ Ship a\nnon-animated fallback if your audience includes those browsers.\n\n\
    ✅ **Key Takeaways**\n\n- Use offset-path: path('...') and animate offset-distance\
    \ to move an element along any curve.\n- Keep the container size equal to the\
    \ SVG viewBox and reuse the same d string in CSS for perfect alignment.\n- Start\
    \ with a simple shape (a square or dot) so the center rides the path naturally.\
    \ Add offset-rotate (and, if needed, offset-anchor) only for directional artwork.\n\
    - Honor prefers-reduced-motion to provide a no-animation experience.\n- Treat\
    \ responsiveness by scaling the whole component, regenerate path data only if\
    \ the curve itself must reshape.\n\nMotion Path gives you the ability to choreograph\
    \ precise movement, bringing individuality and playfulness to your designs. It\
    \ shows how CSS animation has matured beyond simple transforms.\n\nNow, let’s\
    \ discover how masks can shape what’s visible.\n\n## II.4 - CSS Mask Effects\n\
    \nMasks let you control which parts of an element are visible using another image\n\
    or gradient as a visibility map. Opaque areas of the mask reveal the element,\n\
    while transparent areas hide it. Think of it as cutting a stencil and then shining\
    \ your element through it.\n\nIn this chapter we’ll use masks to build a practical\
    \ before/after slider powered by a native <input type=\"range\">. Then we’ll explore\
    \ two more use cases to show how flexible this technique can be.\n\nFinal result:\
    \ 2 sections that can show or hide by a percentage.\n\n## The Basic HTML Structure\n\
    \nTwo sibling sections (.before and .after) sit in the same slot, plus a native\n\
    range on top. This example uses text panels, but you can drop in images just the\
    \ same.\n\n<label for=\"compare-range\">Compare</label>\n\n<div class=\"compare\"\
    \ style=\"--pos: 50%\">\n  <section class=\"before\">I'm the left section \U0001F63B\
    </section>\n  <section class=\"after\">I'm the right section \U0001F640</section>\n\
    \  <input type=\"range\" id=\"compare-range\" min=\"0\" max=\"100\" step=\"0.1\"\
    \ value=\"50\" aria-label=\"Comparison\" />\n</div>\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_69_0.png)\n\
    \nThe two panels are now on top.\n\n## Stacking with grid\n\nWe need the panels\
    \ to overlap without absolute positioning. Grid.\n\n.compare {\n  display: grid;\n\
    }\n\n.compare > * {\n  display: grid;\n  align-items: center;\n  justify-content:\
    \ center;\n  text-align: center;\n}\n\nBecause every child shares the same grid\
    \ cell, they naturally stack. Resize the container, and everything still lines\
    \ up.\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_70_0.png)\n\n## Complementary\
    \ masks\n\nNow the panels need to split at the slider’s position. That’s where\
    \ masks come in.\n\n/* Left side: show from 0 to --pos, then hide */\n.before\
    \ {\n  background: #fff8f0;\n  -webkit-mask: linear-gradient(to right, #000 0,\
    \ var(--pos), transparent 0);\n  mask: linear-gradient(to right, #000 0, var(--pos),\
    \ transparent 0);\n}\n\n/* Right side: hide from 0 to --pos, then show */\n.after\
    \ {\n  background: #122b1f;\n  color: #fff8f0;\n  -webkit-mask: linear-gradient(to\
    \ right, transparent 0, var(--pos), #000 0);\n  mask: linear-gradient(to right,\
    \ transparent 0, var(--pos), #000 0);\n}\n\n\U0001F4A1Safari/WebKit tip: for broader\
    \ coverage, duplicate each mask: as -webkit-mask: with the same gradient.\n"
  mdcn: "\n\n.box {\n  position: absolute;\n  top: 0;\n  left: 0;\n  width: 14px;\n\
    \  height: 14px;\n  background: #e6007a;\n}\n\n正方形在这里，但我们必须正确地放置它。\n\n## 给它一条遵循路径\n\
    \n将 SVG 中相同的 `d` 字符串粘贴到 `offset-path: path('...')` 中。\n\n重复相同的数字可以保持动画和绘制的完美对齐。\n\
    \n同时设置 `offset-distance: 0%`，让正方形从路径的起点开始。\n\n```\n.box {\n  offset-path: path('M16,120\
    \ C80,20 220,20 284,120');\n  offset-distance: 0%;\n}\n```\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_63_0.png)\n\
    \n现在一切都就位了。\n\n## 沿曲线动画\n\n通过将 `offset-distance` 从 0% 动画到 100% 来驱动运动。`alternate`\
    \ 方向会让正方形在无需额外工作的情况下返回。如果你稍后将正方形替换为箭头，并希望它面朝移动方向，请添加 `offset-rotate: auto`。\n\n\
    ```css\n@keyframes move {\n  to {\n    offset-distance: 100%;\n  }\n}\n\n.box\
    \ {\n  animation: move 3s ease-in-out infinite alternate;\n}\n```\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_64_0.png)\n\
    \n正方形现在正在移动。\n\n## 可选的路径可见性\n\n我们绘制的可见 SVG 线段只是一个指南。在开发过程中，看到元素正在遵循的曲线是有帮助的，但对于动画运行并不是必需的。\n\
    \n唯一的关键部分是你粘贴到 `offset-path` 中的 `d` 字符串。一旦动画就绪，你可以安全地移除 `stroke`，或者如果你不需要可见的轨迹，甚至可以完全移除\
    \ `<svg>`。\n\n例如，你可以通过移除 `stroke` 属性简单地隐藏轮廓：\n\n```css\npath {\n  fill: none;\n\
    \  /* stroke removed -- path 现在变为隐藏 */\n}\n```\n\n正方形（或你动画化的任何元素）仍然将完美地遵循曲线。\n\
    \n![](img/3a45eae12017b03ce41b30e896bc70ee_65_0.png)\n\n正方形在没有视觉线条的情况下移动。\n\n\
    当你想要用户看到轨迹时使用轮廓，当你想获得“悬浮”效果时跳过它。\n\n## 无障碍辅助\n\n动画对某些用户可能会分散注意力或引起不适。一既往，我们应该通过\
    \ `prefers-reduced-motion` 来尊重他们的偏好：\n\n```css\n@media (prefers-reduced-motion:\
    \ reduce) {\n  .box {\n    animation: none; /* 移动 */\n  }\n}\n```\n\n在某些情况下，移动元素本身并没有添加真正的价值。如果它纯是装饰性的，在禁用运动时完全隐藏它可能更好：\n\
    \n```css\n@media (prefers-reduced-motion: reduce) {\n  .box {\n    display: none;\
    \ /* 如果动画没有意义，则移除它 */\n  }\n}\n```\n\n这样你就尊重了用户的偏好，并保持页面不受干扰。\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_66_0.png)\n\
    \n## 故障排除\n\n如果正方形是在线条附近而不是在线上移动，请顺序检查这三点：\n\n- 确保容器的 CSS `width` 和 `height` 与\
    \ SVG `viewbox` 中定义的尺寸匹配（在本例中为 300 × 140）。\n- 验证 CSS `path('...')` 字符串与 SVG `d=\"\
    ...\"` 值字符上完全一致。\n- 确保正方形从 `top: 0; left: 0` 的起点开始。\n\n当你需要曲线随布局流式缩放时，简单的方法是缩放整个舞台。如果曲线必须实际重塑，你需要更新路径数据，这是少数可以合理使用少量\
    \ JavaScript 生成坐标的案例之一。\n\n这里有一个 Codepen 可以查看演示。\n\nℹ️ **浏览器兼容性**\n\n- `offset-path`、`offset-distance`\
    \ 和 `offset-rotate`：全球支持率 ~93,5%。\n- 在忽略这些属性的旧版引擎中，正方形将保持静态，而页面其他部分正常渲染。如果你的观众包含这些浏览器，请提供非动画的备用方案。\n\
    \n✅ **核心要点**\n\n- 使用 `offset-path: path('...')` 并动画 `offset-distance` 让元素沿任何曲线移动。\n\
    - 保持容器尺寸等于 SVG `viewBox`，并在 CSS 中复用相同的 `d` 字符串以实现完美对齐。\n- 从简单形状（正方形或点）开始，让中心自然地通过路径。仅对方向性艺术添加\
    \ `offset-rotate`（以及如果需要，添加 `offset-anchor`）。\n- 尊重 `prefers-reduced-motion` 以提供无动画体验。\n\
    - 通过缩放整个组件来处理响应式，仅在曲线本身必须重塑时重新生成路径数据。\n\n运动路径（Motion Path）赋予了你编排精确运动的能力，为你的设计带来了个性和趣味性。它展示了\
    \ CSS 动画如何超越了简单的变换（transforms）。\n\n现在，让我们发现掩罩（masks）如何塑造可见内容。\n\n## II.4 - CSS\
    \ 掩罩效果\n\n掩罩允许你使用另一个图像或渐变作为可见性映射，控制元素的哪些部分可见。掩罩的不透明区域显示元素，而透明区域隐藏它。将其想象成切割一个模板，然后让你的元素透过它。\n\
    \n在本章中，我们将使用掩罩构建一个由原生 `<input type=\"range\">` 驱动的实用前后对比滑块。然后我们将探索另外两个用例，展示这种技术的灵活性的。\n\
    \n最终结果：两个可以按百分比显示或隐藏的部分。\n\n## 基础 HTML 结构\n\n两个兄弟级部分（.before 和 .after）位于同一个插槽内，上方有一个原生范围控件。此示例使用了文本面板，但你同样可以放入图像。\n\
    \n<label for=\"compare-range\">比较</label>\n\n<div class=\"compare\" style=\"--pos:\
    \ 50%\">\n  <section class=\"before\">我是左侧部分 \U0001F63B</section>\n  <section\
    \ class=\"after\">我是右侧部分 \U0001F640</section>\n  <input type=\"range\" id=\"compare-range\"\
    \ min=\"0\" max=\"100\" step=\"0.1\" value=\"50\" aria-label=\"Comparison\" />\n\
    </div>\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_69_0.png)\n\n两个面板现在叠在一起。\n\n\
    ## 使用 grid 堆叠\n\n我们需要面板在不使用绝对定位的情况下重叠。使用 Grid。\n\n```css\n.compare {\n  display:\
    \ grid;\n}\n\n.compare > * {\n  display: grid;\n  align-items: center;\n  justify-content:\
    \ center;\n  text-align: center;\n}\n```\n\n由于每个子元素共享同一个网格单元，它们自然堆叠。调整容器大小，一切依然对齐。\n\
    \n![](img/3a45eae12017b03ce41b30e896bc70ee_70_0.png)\n\n## 互补掩罩\n\n现在面板需要在滑块的位置进行分割。这就是掩罩大用用场。\n\
    \n```css\n/* 左侧：从 0 到 --pos 显示，然后隐藏 */\n.before {\n  background: #fff8f0;\n  -webkit-mask:\
    \ linear-gradient(to right, #000 0, var(--pos), transparent 0);\n  mask: linear-gradient(to\
    \ right, #000 0, var(--pos), transparent 0);\n}\n\n/* 右侧：从 0 到 --pos 隐藏，然后显示 */\n\
    .after {\n  background: #122b1f;\n  color: #fff8f0;\n  -webkit-mask: linear-gradient(to\
    \ right, transparent 0, var(--pos), transparent 0);\n  mask: linear-gradient(to\
    \ right, transparent 0, var(--pos), transparent 0);\n}\n```\n\n\U0001F4A1 Safari/WebKit\
    \ 提示：为了更好的兼容性，请将每个掩罩复制为 `-webkit-mask:` 并使用相同的渐变。\n\n"
