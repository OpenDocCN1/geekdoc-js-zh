    **I.3** **-** **Smooth Scrolling to Sections**


    On long pages with multiple sections, anchor links (<a href="#section-id">)


    are essential for navigation. By default, clicking one jumps instantly to the
    target.


    This works, but the abrupt snap can feel jarring. You lose context of where you


    came from, and if your site has a fixed header, the heading you navigated to


    often ends up hidden underneath it.


    Modern CSS solves this with native smooth scrolling and scroll offsets. With just


    a few properties, you can create smooth, accessible navigation without writing
    a


    single line of JavaScript.


    **​**


    **Smooth scrolling**


    The scroll-behavior property tells the browser how to move the viewport


    when a scroll happens. Either instantly (auto) or smoothly (smooth).


    html {​


    scroll-behavior: smooth;​


    }


