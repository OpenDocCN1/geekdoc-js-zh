    Here’s a Codepen to see the demo.


    ​


    5\. Changing layouts with a toggle


    Perhaps the most dramatic effect is flipping layouts entirely with a single state.


    Imagine a list of cards that should switch between a two-column grid and


    single-column list, controlled by a checkbox.


