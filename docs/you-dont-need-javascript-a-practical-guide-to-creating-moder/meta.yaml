  - '[PAGE 92]


    `}`


    This gives it a lightweight, elevated style.


    ℹ️Notice: you don’t need to mess with position, inset, or margin.


    Placement is handled by the browser’s top-layer system. If you override it,


    you risk breaking the built-in logic.


    **​**


    **Built-in close control**


    You’ll often want the popover to close from inside (e.g. a “✕” button). That’s
    also


    built-in:


    `<``**div**` `id=``"more"` `popover>`​


    `<``**p**``>``Native popover` 👋`</``**p**``>`​


    `<``**button**` `popovertarget=``"more"` `popovertargetaction=``"hide"`


    `aria-label=``"Close"``>`✕`</``**button**``>`​


    `</``**div**``>`


    The popovertarget attribute links this button to the same popover. Whereas


    the popovertargetaction attribute controls the behavior:


    -​


    toggle (default) → open if closed, close if open


    -​


    show  → always open it


    -​


    hide  → always close it


    This is declarative control, the browser handles state changes without event


    listeners or scripts.


