    This is where a lot of historical “custom dropdown” code disappears. Hover and


    focus styling is now just CSS. Keyboard navigation and type-ahead continue to


    work because the element is still a select.


    **​**


    **Keeping the Button Tidy**


    Often your options contain icons or secondary text, but the face should remain


    compact. Because <selectedcontent> mirrors the chosen option, you can


    selectively hide pieces *only* in the mirrored view while leaving them visible
    in the


    list.


    `**selectedcontent**``.icon` `{`


    `display``: none;`


    `}`


    The result: rich options in the popup, a clean label in the face. If you do want
    the


    icon in the face, remove that rule and the mirror will include it automatically.


