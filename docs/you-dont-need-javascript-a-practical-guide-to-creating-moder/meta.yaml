    \n1\n\nIntroduction\n\nJavaScript is powerful. No argument there. But what if\
    \ much of what you're solving with JS could be handled just as well, or even better,\
    \ using modern CSS and semantic HTML? This book is based on a simple principle:\
    \ use the least powerful tool that gets the job done.\n\n**The Rule of Least Power**\n\
    \nThis principle originates from the philosophy behind web standards: always choose\
    \ the simplest tool that effectively accomplishes the job. Start with semantic\
    \ HTML to structure your content, enhance presentation and interactions with CSS,\
    \ and reach for JavaScript only when absolutely necessary. HTML and CSS are declarative\
    \ languages. You describe your intent (the final look and behavior) and the browser\
    \ determines the most efficient way to execute it. This approach inherently leads\
    \ to simpler, more maintainable, and more accessible websites. JavaScript, however,\
    \ is imperative. It demands that you explicitly define every step the browser\
    \ must take, increasing complexity, performance overhead, and potential points\
    \ of failure.\n\n**Why Do We Default to JavaScript?**\n\nIt's easy and tempting\
    \ to reach for JavaScript. Popular frameworks such as React, Vue, and Angular\
    \ have made rapid prototyping and rich interactivity extremely convenient. While\
    \ this convenience has significant advantages, it also often leads to bloated\
    \ bundles, slower load times, and unnecessary complexity.\n\nOn the other hand,\
    \ browsers have significantly evolved. Modern CSS and HTML have caught up remarkably,\
    \ offering powerful capabilities once reserved solely for JavaScript. You can\
    \ now implement sophisticated UI patterns such as modals, accordions, carousels,\
    \ toggles, and animations purely through native browser technologies.\n\n2\n\n\
    **Why it Matters**\n\nUsing minimal JavaScript translates to leaner codebases,\
    \ improved accessibility, better performance, and reduced reliance on third-party\
    \ libraries. Moreover, it results in decreased energy consumption, both for users\
    \ and servers, significantly lowering your site's environmental footprint.\n\n\
    However, the aim isn't to entirely remove JavaScript. Certain tasks like real-time\
    \ data fetching, complex business logic, advanced interactivity, will always benefit\
    \ from JS. The goal is balance: employ JavaScript exactly where it provides genuine\
    \ value, not simply because it's familiar or convenient.\n\nBy embracing a CSS-first\
    \ approach, you enhance accessibility inherently. Semantic HTML and native browser\
    \ behaviors are optimized for assistive technologies, supporting a broader audience\
    \ by default.\n\n**Performance and Sustainability**\n\nA lighter reliance on JavaScript\
    \ also means faster initial load times, reduced CPU usage, and less battery drain.\
    \ For instance, substituting a JavaScript slider library (which typically weighs\
    \ 50-100KB of minified JS) with a pure CSS implementation reduces overhead and\
    \ significantly boosts performance.\n\nThis book invites you to pause before reaching\
    \ for JavaScript. Always ask yourself first: Can CSS handle this? You'll find\
    \ that the answer is \"yes\" more often than you'd expect, empowering you to build\
    \ faster, cleaner, and more accessible websites from the start.\n\n**Get in Touch**\n\
    \nHave a question, found a typo, or want to suggest an improvement? I’d love to\
    \ hear from you!\n\nEmail me at hey@theosoti.com\n\n3\n\nNeed help with your CSS\
    \ or website project? I’m available for freelance work.\n\nLet’s work together,\
    \ just reach out!\n\nWant to keep learning more about modern CSS and web design?\n\
    \nCheck out theosoti.com for articles, code examples, and updates.\n\n4\n\nPART\
    \ 1 - Everyday Features\n\nEvery website, no matter how simple, needs a handful\
    \ of core building blocks. A smooth in-page navigation, a modal, an accordion,\
    \ … These are the patterns visitors expect to work out of the box. In this part\
    \ we’ll re-create those familiar features with modern HTML and CSS, keeping things\
    \ accessible and lightweight. They’re the everyday components you’ll reach for\
    \ again and again.\n\nSo let’s jump right in!\n\n**I.1 - Conditionally Styling\
    \ with :has()**\n\nFor a long time, CSS selectors only looked downward into the\
    \ DOM. You could target children, descendants, or siblings, but you couldn’t ask\
    \ anything about a parent. That gap forced developers to use JavaScript for what\
    \ felt like a styling problem.\n\nThe :has() pseudo-class finally closes that\
    \ gap. Often nicknamed the “parent selector”, it lets you apply styles to an element\
    \ based on what it contains. With :has(), CSS can now look both ways: not just\
    \ down at descendants, but up and sideways into context.\n\n**Understanding :has()**\n\
    \nAt its simplest, :has() matches an element when something inside it meets a\
    \ condition. In practice, that usually means checking whether it contains a certain\
    \ descendant. The syntax is intuitive:\n\n`/* Targets .card only if it contains\
    \ an .active element */`\n\n```css\n.card:has(.active) {\n  border-color: green;\n\
    }\n```\n\n5\n"
