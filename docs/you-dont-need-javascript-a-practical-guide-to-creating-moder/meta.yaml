    \    opacity: 0;\n  }\n}\n```\n\nWhat’s happening here:\n- In the closed state,\
    \ the popover is shifted up and fully transparent.\n- When opened (:popover-open),\
    \ it moves into place and fades in.\n- @starting-style defines the frame where\
    \ the opening transition begins.\n- transition-behavior: allow-discrete allows\
    \ the closing animation to play before the popover is removed from the DOM flow.\n\
    \nThe result: a smooth slide-and-fade both on entry and exit.\n\n## Another Use\
    \ Case: Off-Canvas Menu\n\nFinal result: a whole menu appearing on the right like\
    \ a drawer.\n\nUse a popover as a right-hand off-canvas menu. One button shows\
