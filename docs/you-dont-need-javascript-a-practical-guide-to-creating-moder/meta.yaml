    **​**


    **Styling the Dropdown and Its Options**


    The popup is the *picker* and is targetable as ::picker(select). Inside it, each


    <option> is stylable. The customizable model allows options to participate in


    layout (flex is common), which means text and small icons align cleanly without


    hacks.


