    ​


    `/* Right side: hide from 0` → `--pos, then show */`​


    `.after` `{`​


    `background``:` `#122b1f``;`​


    `color``:` `#fff8f0``;`​


    `-webkit-mask``:` `linear-gradient``(to right, transparent 0,`


    `var(--pos),` `#000``0``);`​


