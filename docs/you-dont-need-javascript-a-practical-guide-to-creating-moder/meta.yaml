  md: 'component and make interfaces feel more polished. These flourishes


    demonstrate the creative power CSS has gained in recent years.


    Now, let’s see how entire page changes can be animated.


    **II.2** **- View Transitions**


    Page changes on the web have traditionally felt abrupt. Click a link, and the
    old


    page instantly disappears while the new one appears. That’s fast, but it lacks
    the


    kind of smoothness we associate with native apps.


    The View Transitions API changes that. It lets the browser capture a snapshot
    of


    your content *before* and *after* navigation, then animate between them


    automatically. Under the hood, the browser freezes the old content, layers the


    new one on top, and runs a transition. By default it cross-fades, but you can
    style


    it however you like: sliding, scaling, fading, or even more elaborate effects.


    ​


