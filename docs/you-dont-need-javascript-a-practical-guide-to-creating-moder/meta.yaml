    **​**


    **Browser Support and Fallbacks**


    Browser support for :has() is already excellent (over 93% globally), but it’s


    always smart to plan for the edge cases. That’s where @supports comes in.


    Think of @supports as CSS’s built-in feature detection. Instead of trying to guess


    which browser is being used, you simply ask the browser: “Do you understand


