    \ `showModal()`。\n\n如果你需要通过程序关闭对话框，可以调用 `modal.close()`。\n\n### 为对话框添加动画\n\n默认情况下<dialog>\
    \ 在打开和关闭时出现或消失。为了让它看起来更精致，我们可以使用 CSS 过渡添加简单的动画。在这个示例中，对话框在打开时会淡入并滑入位置：\n\n```css\n\
    dialog {\n  opacity: 0;\n  translate: 0 -25vh;\n  transition: translate 0.6s ease,\
