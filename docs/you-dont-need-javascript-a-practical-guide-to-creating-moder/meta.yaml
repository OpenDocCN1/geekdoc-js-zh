    \n## III.4 - 锚点定位 (Anchor Positioning)\n\n工具提示、下拉列表、弹出层……这些 UI 元素一直很棘手。传统上使用 JavaScript\
    \ 测量偏移或依赖定位库。现代 CSS 现在通过锚点定位优雅地解决了这个问题。\n\n通过此功能，你可以将一个元素“绑定”到另一个元素上：命名一个锚点（如按钮），并使用\
    \ `anchor()` 函数相对于它定位另一个元素（如工具提示）。无需手动计算，无需 DOM 测量，浏览器会自动完成工作，保持响应式，并在空间不足时甚至翻转位置。\n\
    \n106\n\n最终结果：自动调整锚点。\n\n### 基础 HTML 结构\n\n简洁且语义化：一个按钮（锚点）和一个工具提示。\n```html\n\
    <button class=\"btn\" aria-describedby=\"tip\">更多选项</button>\n```\n```html\n<div\
    \ class=\"tip\" id=\"tip\" role=\"tooltip\">来自 CSS 锚点定位的问 \U0001F44B</div>\n```\n\
    \n- 按钮是我们的锚点。\n\n- 工具提示通过 `aria-describedby` 指向它以确保可访问性。\n- 不需要包装器或辅助容器，魔法发生在\
    \ CSS 中。\n\n### 声明锚点\n\n要将一个元素作为引用点，你必须通过 `anchor-name` 属性给它命名：\n```css\n.btn\
    \ {\n  anchor-name: --btn; /* 这可以被锚定的元素定位 */\n}\n```\n\n这就像在按钮上贴上一个标签。之后，任何其他元素（工具提示、下拉列表等）都可以说：“贴在名为\
    \ --btn 的锚点上。”双连线是一种命名约定（类似于自定义属性），你可以将其称为 `--trigger`、`--menu` 或任何你喜欢的名称。\n\n\
    107\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_107_0.png)\n\n### 关联工具提示\n\n现在我们需要告诉工具提示应该跟随哪个锚点。这通过\
    \ `position-anchor` 实现。\n```css\n.tip {\n  position: absolute; /* 锚点定位所需的 */\n\
    \  position-anchor: --btn; /* 通过名称绑定到按钮 */\n  z-index: 10;\n\n  /* 视觉皮肤（仅用于演示）\
    \ */\n  padding: .5rem .75rem;\n  background: #111;\n  color: white;\n  border-radius:\
    \ .5rem;\n}\n```\n\n两个规则使锚点定位生效：\n1. 元素必须是定位的（绝对或固定定位），否则它没有可以“锁定”的对象。\n2. 它必须通过\
    \ `position-anchor` 声明它属于哪个锚点。\n\n可以这样想：“我是绝对定位的……但不是相对于容器，我是相对于名为 --btn 的锚点的。”\n\
    \n### 使用 anchor() 放置\n\n默认情况下，工具提示会堆叠在锚点的左上角。为了控制精确的关系，我们使用 `anchor()` 函数：\n```css\n\
    .tip {\n  /* 垂直方向：将顶边缘放在锚点底部下方 */\n  top: calc(anchor(bottom) + 8px);\n\n  /*\
    \ 水平方向：在锚点上居中 */\n  left: anchor(left);\n}\n```\n\n- `anchor(bottom)` 提供按钮底部边缘的位置。\n\
    - `anchor(left)` 提供左边缘的位置。\n- 你也可以使用 `anchor(top)`、`anchor(right)` 甚至 `anchor(center)`\
    \ 来居中。\n\n由于 `anchor()` 返回的是长度，你可以将其与 `calc()` 结合以微调间隙、偏移或居中数学计算。\n\n### 使用回退机制避免裁剪\n\
    \n如果按钮位于屏幕底部，没有空间放置工具提示怎么办？你可以提供备份策略：\n```css\n.tip {\n  position-try: flip-block\
    \ flip-inline; /* 尝试放在上方，如果需要则向左/右 */\n}\n```\n\n- `flip-block` = 如果下方没有空间，尝试放在上方。\n\
    - `flip-inline` = 如果水平方向没有空间，向左或右移动。\n\n这让工具提示和下拉列表在没有 JavaScript 的情况下也具有韧性。浏览器为你完成了智能定位。\n\
    \n### 匹配锚点宽度（可选）\n\n下拉菜单通常需要匹配其触发器的宽度。你也可以这样做：\n```css\n.tip {\n  inline-size:\
    \ anchor-size(width); /* 相对于锚点宽的大小 */\n}\n```\n\n- `anchor(bottom)` 提供按钮底部边缘的位置。\n\
    - `anchor(left)` 提供左边缘的位置。\n- 你也可以使用 `anchor(top)`、`anchor(right)` 甚至 `anchor(center)`\
    \ 来居中。\n\n由于 `anchor()` 返回的是长度，你可以将其与 `calc()` 结合以微调间隙、偏移或居中数学计算。\n\n- `anchor-size(width)`\
