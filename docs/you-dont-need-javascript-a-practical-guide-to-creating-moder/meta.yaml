- md: "\n## Driving the count with keyframes\n\nNow we create an animation that modifies\
    \ --c over time:\n\n`/* Timeline from 0` → `target */`\n\n`@keyframes countUp\
    \ {`\n  `from {`\n  `--c: 0;`\n  `}`\n  `to {`\n  `--c: 10;`\n  `}`\n}`\n\nAs\
    \ the animation runs, the browser interpolates between the values and rewrites\
    \ --c frame by frame. On its own, this doesn’t produce visible text, we still\
    \ need to display the number.\n\n## Print the counter\n\nWe can expose the changing\
    \ value by copying --c into a real counter and then printing that counter with\
    \ content:\n\n`/* Generate text from the running total */`.ticker::after {`\n\
    \  `counter-reset: n var(--c);`\n  `content: counter(n);`\n`}`\n\nHere counter-reset\
    \ takes the current --c value and stores it in a counter named n. The content\
    \ property then prints that counter as text inside a ::after pseudo-element.\n\
    \n## Putting it all together\n\nNow we tie the pieces together:\n\n`/* Kick off\
    \ the animation */`.ticker {`\n  `animation: countUp 5s linear forwards;`\n}`\n\
    \n`/* Big monospace digits, centred */`.ticker::after {`\n  `font-size: 10rem;`\n\
    \  `display: block;`\n  `text-align: center;`\n}`\n\nThe .ticker element runs\
    \ the countUp animation once, taking five seconds to complete. Because we use\
    \ forwards, the animation doesn’t reset, it stops on the final frame, leaving\
    \ the counter at 10. The ::after pseudo-element renders the digits in a large\
    \ monospace font, centered on the screen.\n\n## Respecting reduced motion\n\n\
    Animations can be distracting or uncomfortable for some users. As always, we should\
    \ respect their preferences by checking prefers-reduced-motion:\n\n`@media (prefers-reduced-motion:\
    \ reduce) {`\n  `.ticker {`\n    `animation: none;`\n  }`\n  `.ticker::after {`\n\
    \    `content: \"10\"; /* jump straight to the value */`\n  `}`\n}`\n\nThis disables\
    \ the animation for those users and simply shows the final value immediately.\n\
    \nHere’s multiple Codepen to see what you can do:\n\n- Heading counter\n- Counter\
    \ up\n- Count the number of selected items\n\nℹ️ **Browser Compatibility**\n\n\
    - @property: Fully supported in all modern browsers. with over 92.5% global support.\n\
    - Browsers who don’t support it just won’t display the animation.\n\n✅ **Key Takeaways**\n\
    \n- @property + @keyframes moves the value from 0 to the target.\n- Display each\
    \ frame by copying --c into a counter (counter-reset) and printing it with content:\
    \ counter(n).\n- Expose --target and --duration so anyone can change the goal\
    \ or speed with one line.\n- Include the final number in markup (e.g., aria-label=\"\
    10\") because pseudo-elements aren’t read aloud.\n- Wrap the animation in @media\
    \ (prefers-reduced-motion) to show the static value when users prefer minimal\
    \ motion.\n\nYou've now mastered handling everyday interactions and dynamic content\
    \ using primarily HTML and CSS. But CSS doesn’t stop there! Its latest capabilities\
    \ can handle even more sophisticated UI patterns and interactions, pushing the\
    \ boundaries of what’s possible without JavaScript. In the next part, we'll explore\
    \ these modern CSS power moves, introducing you to advanced components and creative\
    \ techniques that will elevate your frontend skills even further.\n\nPART 2 -\
    \ Modern CSS Power Moves\n\nIn this part we’ll explore components and effects\
    \ that are a little less common, but increasingly visible in modern interfaces:\
    \ animated borders, mask effects, transition between pages, and more. These are\
    \ the flourishes that give a site its personality. And we’ll build them the same\
    \ way as before: semantic, accessible, and almost entirely free of JavaScript.\n\
    \n## II.1 - Custom Border Animations\n\nAnimated borders used to require heavy\
    \ tricks: JavaScript continuously redrawing gradients, or SVG filters layered\
    \ behind content. Today, modern CSS gives us all the ingredients natively. With\
    \ a pseudo-element, a conic gradient, and the new @property rule, we can create\
    \ glowing, rotating borders that feel alive.\n\nFinal result: glowing border moving\
    \ indefinitely.\n\n## The Basic HTML Structure\n\nThe markup is minimal:\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_48_0.png)\n\
    \n`<div class=\"card\">`\n  <!-- Your card content goes here -->`\n`</div>`\n\n\
    The work all happens in CSS.\n\n## Preparing the card\n\nThe card needs to establish\
    \ itself as a positioning context so that its pseudo-elements can sit exactly\
    \ behind it. It also needs a solid background to prevent the animated gradient\
    \ from leaking through.\n\n`.card {`\n  `position: relative;`\n  `z-index: 1;\
    \ /* keep content above the border */`\n  `background-color: white; /* hides gradient\
    \ behind the face */`\n`}`\n\nWithout the background color, the gradient layer\
    \ we’ll add would bleed through, competing with the card’s content.\n\nResult\
    \ if you don’t add a background to the card.\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_49_0.png)\n\
    \n## Adding a border layer\n\nWe create the “border” not with border itself, but\
    \ with a pseudo-element stretched slightly larger than the card.\n\n`.card::after\
    \ {`\n  `content: \"\";`\n  `position: absolute;`\n  `inset: -4px; /* expand 4px\
    \ beyond every edge */`\n  `z-index: -1; /* push it behind the card */`\n  `border-radius:\
    \ inherit;`\n`}`\n\n## Declaring an animatable property\n\nWe want this border\
    \ to rotate smoothly, but not all properties can animate by default.\n\n`@property\
    \ --angle {`\n  `syntax: \"<angle>\";`\n  `initial-value: 0deg;`\n  `inherits:\
    \ false;`\n}`\n\nThis registers --angle as an angle type, starting at 0deg.\n\n\
    ## Drawing the gradient\n\nNow we paint the border using a conic gradient.\n\n\
    `.card::after {`\n  `/* previous declarations */`\n  `background: conic-gradient(from\
    \ var(--angle), #ff4545, #0099, #00aff, #ff0095, #ff4545);`\n}`\n\n## Animating\
    \ the spin\n\nTo bring it to life, animate --angle from 0 to 360 degrees in infinite\
    \ loop:\n\n`@keyframes spin {`\n  `to {`\n    `--angle: 360deg;`\n  `}`\n}`\n\n\
    `.card::after {`\n  `/* previous declarations */`\n  `animation: spin 3s linear\
    \ infinite;`\n}`\n\nThe result is a smooth, rotating border.\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_51_0.png)\n\
    \n## Adding the glow\n\nThe border already rotates, but we can make it feel more\
    \ alive by giving it a halo. We do this by duplicating the gradient in another\
    \ pseudo-element and applying blur.\n\n`/* Shared border setup for both layers\
    \ */\n`.card::after, .card::before {`\n  `content: \"\";`\n  `position: absolute;`\n\
    \  `inset: -4px;`\n  `z-index: -1;`\n  `border-radius: inherit;`\n  `background:\
    \ conic-gradient(from var(--angle), #ff4545, #0099, #00aff, #ff0095, #ff4545);`\n\
    \  `animation: spin 3s linear infinite;`\n}`\n\n`/* Blur and fade the ::before\
    \ layer for a glow effect */\n`.card::before {`\n  `filter: blur(1.5rem);`\n \
    \ `opacity: 0.8;`\n}`\n\nHere’s what’s happening in layers:\n\n- The ::after pseudo-element\
    \ is our crisp, sharp border.\n- The ::before pseudo-element is the exact same\
    \ gradient, but blurred and semi-transparent. The blur makes the bright colors\
    \ spill outward the edge, softening into a glow.\n- Because both are positioned\
    \ in the same place, the sharp version sits on top and the blurred version radiates\
    \ beneath it.\n\nTogether, they produce the illusion of a glowing border.\n\n\
    ## Respecting reduced motion\n\nAnimations should never be forced on users who\
    \ prefer static interfaces. We can turn the spin off gracefully with a media query:\n\
    \n`@media (prefers-reduced-motion: reduce) {`\n  `.ticker {`\n    `animation:\
    \ none;`\n  }`\n  `.ticker::after {`\n    `content: \"10\"; /* jump straight to\
