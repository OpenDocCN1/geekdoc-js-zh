  mdcn: "\n\n## 使用关键帧驱动计数\n\n现在，我们创建一个随时间修改 `--c` 的动画：\n\n`/* 时间轴从 0` → `目标 */`\n\n\
    `@keyframes countUp {`\n  `from {`\n  `--c: 0;`\n  `}`\n  `to {`\n  `--c: 10;`\n\
    \  `}`\n}`\n\n随着动画的运行，浏览器会在这些值之间进行插值，并逐帧重写 `--c`。单靠其本身，这并不会产生可见的文本，我们仍然需要显示数字。\n\
    \n## 打印计数器\n\n我们可以通过将 `--c` 复制到一个真实的计数器，然后使用 `content` 打印该计数器来暴露变化的值：\n\n`/* 从运行总和生成文本\
    \ */`.ticker::after {`\n  `counter-reset: n var(--c);`\n  `content: counter(n);`\n\
    `}`\n\n在这里，`counter-reset` 获取当前的 `--c` 值并将其存储在名为 `n` 的计数器中。随后，`content` 属性将该计数器作为文本在\
    \ `::after` 伪元素内部打印。\n\n## 整合一切\n\n现在，我们将这些部分组合在一起：\n\n`/* 启动动画 */`.ticker {`\n\
    \  `animation: countUp 5s linear forwards;`\n}`\n\n`/* 大号等宽数字，居中 */`.ticker::after\
    \ {`\n  `font-size: 10rem;`\n  `display: block;`\n  `text-align: center;`\n}`\n\
    \n`.ticker` 元素运行一次 `countUp` 动画，耗时五秒完成。由于我们使用了 `forwards`，动画不会重置，而是停止在最后一帧，让计数器保持在\
    \ 10。`::after` 伪元素使用大等宽字体渲染数字，并在屏幕上居中。\n\n## 尊重减少运动请求\n\n动画对某些用户来说可能会分散注意力或引起不适。一如既常，我们应该通过检查\
    \ `prefers-reduced-motion` 来尊重他们的偏好：\n\n`@media (prefers-reduced-motion: reduce)\
    \ {`\n  `.ticker {`\n    `animation: none;`\n  }`\n  `.ticker::after {`\n    `content:\
    \ \"10\"; /* 直接跳转到数值 */`\n  `}`\n}`\n\n这为那些用户禁用了动画，并直接显示最终值。\n\n这里有多个 Codepen\
    \ 可以让你看到可以实现：\n\n- 标题计数器\n- 计数器增加\n- 统计选中项目的数量\n\nℹ️ **浏览器兼容性**\n\n- `@property`：在所有现代浏览器中均完全支持。全球支持率超过\
    \ 92.5%。\n- 不支持该性的浏览器将不会显示动画。\n\n✅ **核心要点**\n\n- `@property` + `@keyframes` 将值从\
    \ 0 移动到目标值。\n- 通过将 `--c` 复制到计数器（`counter-reset`）并使用 `content: counter(n)` 打印来显示每一帧。\n\
    - 暴露 `--target` 和 `--duration`，以便任何人都能一行代码更改目标或速度。\n- 在标记中包含最终数字（例如 `aria-label=\"\
    10\"`），因为伪元素的内容不会被读屏器读取。\n- 将动画封装在 `@media (prefers-reduced-motion)` 中，以便在用户偏好减少运动时显示静态值。\n\
    \n你现在已经掌握了主要使用 HTML 和 CSS 处理日常交互和动态内容。但 CSS 并不止于此！它最新的功能可以处理更复杂的 UI 模式和交互，在不使用\
    \ JavaScript 的情况下推向可能的边界。在下一部分，我们将探索这些现代 CSS 高级操作，向你介绍高级组件和创意技巧，这些将进一步提升你的前端技能。\n\
    \n第 2 部分 - 现代 CSS 高级操作\n\n在这一部分，我们将探索一些不那么常见但在现代界面中日益可见组件和效果：动画边框、遮罩效果、页面切换等。这些是赋予网站个性的点缀。我们将像以前一样构建构建它们：语义化、可访问，且几乎完全不需要\
    \ JavaScript。\n\n## II.1 - 自定义边框动画\n\n动画边框过去需要复杂的技巧：JavaScript 持续重绘渐变，或者在内容后面堆叠\
    \ SVG 过滤器。今天，现代 CSS 原生为我们提供了所有原料。通过伪元素、锥形渐变和新的 `@property` 规则，我们可以创建出栩如生的发光旋转边框。\n\
    \n最终结果：无限移动的发光边框。\n\n## 基础 HTML 结构\n\n标记非常简单：\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_48_0.png)\n\
    \n`<div class=\"card\">`\n  <!-- 你的卡片内容在这里 -->`\n`</div>`\n\n所有工作都在 CSS 中完成。\n\
    \n## 准备卡片\n\n卡片需要建立一个定位上下文，以便它的伪元素可以恰好位于它后面。它还需要一个固定的背景，防止动画渐变漏出。\n\n`.card {`\n\
    \  `position: relative;`\n  `z-index: 1; /* 保持内容在边框上方 */`\n  `background-color:\
    \ white; /* 隐藏脸后的渐变 */`\n`}`\n\n如果没有背景颜色，我们将添加的渐变层会渗透，与卡片内容竞争。\n\n如果不在卡片上添加背景的结果。\n\
    \n![](img/3a45eae12017b03ce41b30e896bc70ee_49_0.png)\n\n## 添加边框层\n\n我们不是通过 `border`\
    \ 本身来创建“边框”，而是使用一个比卡片稍大一点的伪元素。\n\n`.card::after {`\n  `content: \"\";`\n  `position:\
    \ absolute;`\n  `inset: -4px; /* 向外扩展 4px */`\n  `z-index: -1; /* 放在卡片下方 */`\n\
    \  `border-radius: inherit;`\n}`\n\n## 声明可动画属性\n\n我们希望这个边框流畅旋转，但并不是所有属性都可以动画化。\n\
    \n`@property --angle {`\n  `syntax: \"<angle>\";`\n  `initial-value: 0deg;`\n\
    \  `inherits: false;`\n}`\n\n这注册了 `--angle` 为角度类型，初始值为 0deg。\n\n## 绘制渐变\n\n现在我们使用锥形渐变绘制边框。\n\
    \n`.card::after {`\n  `/* 之前的声明 */`\n  `background: conic-gradient(from var(--angle),\
    \ #ff4545, #0099, #00aff, #ff0095, #ff4545);`\n}`\n\n## 旋转\n\n为了让它活起来，让 `--angle`\
    \ 从 0 动画到 360 度，无限循环：\n\n`@keyframes spin {`\n  `to {`\n    `--angle: 360deg;`\n\
    \  `}`\n}`\n\n`.card::after {`\n  `/* 之前的声明 */`\n  `animation: spin 3s linear\
    \ infinite;`\n}`\n\n结果是一个平滑的旋转边框。\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_51_0.png)\n\
    \n## 添加光晕\n\n边框已经在旋转，但我们可以通过给它光晕让它看起来更有活力。这是通过另一个伪元素中复制渐变并应用模糊来实现的。\n\n`/* 两个层的共享边框设置\
    \ */`\n`.card::after, .card::before {`\n  `content: \"\";`\n  `position: absolute;`\n\
    \  `inset: -4px;`\n  `z-index: -1;`\n  `border-radius: inherit;`\n  `background:\
    \ conic-gradient(from var(--angle), #ff4545, #0099, #00aff, #ff0095, #ff4545);`\n\
    \  `animation: spin 3s linear infinite;`\n}`\n\n`/* 模糊并淡化 ::before 层以实现光晕效果 */`\n\
    `.card::before {`\n  `filter: blur(1.5rem);`\n  `opacity: 0.8;`\n}`\n\n这里层发生了什么：\n\
    \n- `::after` 伪元素是我们清晰、锐利的边框。\n- `::before` 伪元素是相同的渐变，但经过了模糊且半透明。模糊让亮色向边缘扩散，化为光晕。\n\
    - 由于两者都位于同一个位置，锐利的版本在上方，模糊的版本在下方放射。\n\n它们共同创造了发光边框的幻觉。\n\n## 尊重减少运动请求\n\n动画不应该强加给偏好静态界面的用户。我们可以通过媒体查询优雅地关闭旋转：\n\
    \n`@media (prefers-reduced-motion: reduce) {`\n  `.ticker {`\n    `animation:\
    \ none;`\n  }`\n  `.ticker::after {`\n    `content: \"10\"; /* 直接跳转到数值 */`\n \
    \ `}`\n}`\n\n边框 + 光晕效果结果。\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_53_0.png)\n\
    \n"
