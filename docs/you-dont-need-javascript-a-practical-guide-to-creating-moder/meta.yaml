    `**.nav-list**` `**>**` `**li**``**:has(ul)**` `**>**` `**a**``**::after**` `**{**`**​**


    `**content**``**:**` `**">"**``**;**`**​**


    `**transform**``**:**` `**rotate**``**(45deg);**`**​**


    `**}**`


