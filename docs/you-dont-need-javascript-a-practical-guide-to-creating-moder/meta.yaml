  - '[PAGE 119]


    `padding``:` `--space``(1.5);`​


    `}`​


    ​


    `/* Progressive enhancement: only run where functions parse */`​


    `@``**supports**` `(padding: --space(``2``)) {`​


    `.stack` `> * {`


    `margin-block-start``:` `--space``(1);`


    `}`​


    `}`


    This behaves like “parameterized custom properties”, evaluated at the point of


    use. Great for consistent spacing, shadows, and derived values without a


    preprocessor.


    **​**


    **2- Inline conditionals with if()**


    if() lets a single property’s value vary based on a style query, media query,
    or


    feature query, without wrapping the whole block in @media/@supports. It’s


    explicitly marked experimental / limited availability on MDN, so treat it as


    progressive enhancement.


    `/* Fallback first, then override with if() where supported */`​


    `.card` `{`


    `padding``:` `1rem``;`


    `}`


    ​


    `.card` `{`​


    `padding``:` `if``(media(width < 700px): .``75rem``;` `else``:` `1.25rem``);`​


    `}`​


    ​


    `/* Feature-query example inside if() */`​


    `.button` `{`​


    `color``:` `if``(supports(color: lch(55% 60 310)):` `lch``(55% 60 310);`


    `else``:` `rgb``(32 32 32));`​


    `}`


    Because non-supporting browsers ignore the if() value, you keep a safe


    baseline via the preceding declaration.


