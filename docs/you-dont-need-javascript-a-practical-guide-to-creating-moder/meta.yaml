  - '[PAGE 90]


    Scroll-driven animations showed how CSS can now synchronize effects directly


    with the user’s scrolling, making layouts feel dynamic and alive without scripting.


    It’s a feature that connects motion to intent in a natural way.


    Next, let’s move on to overlays and see how popovers are now handled natively


    in the browser.


    **III.2** **- Native Popovers**


    Menus, tooltips, callouts… these are everywhere in web interfaces. But


    historically, building them has been messy: you had to wire up aria- attributes,


    handle keyboard focus, manage z-index stacking, and write JavaScript for


    open/close toggles and outside-click dismissal.


    The Popover API solves all of that. With just two HTML attributes, you get:


    -​


    Automatic top-layer stacking (always on top)


    -​


    Focus management (focus moves inside when opened, returns when


    closed)


    -​


    Light-dismiss (ESC key and outside clicks close it)


    -​


    Clean, accessible behavior with no JavaScript


    You then layer CSS on top for design. No library, no boilerplate.


    ​


    Final result: Left - no popover. Right - a showing popover.


