  - '[PAGE 93]


    **​**


    **Adding animation**


    By default, popovers just “pop” in and out. That’s functional, but not polished.
    To


    animate them, you define both a closed state and an open state, then let CSS


    transitions do the rest.


    `/* add to your base rule */`​


    `[popover]` `{`​


    `transform``:` `translateY``(-50px);`​


    `opacity``:` `0``;`​


    `transition``: transform` `0.5s``, opacity` `0.5s``, display` `0.5s``;`​


    `transition-behavior``: allow-discrete;` `/* enables closing`


    `animation */`​


    `}`​


    ​


    `/* add to your open-state rule */`​


    `[popover]:popover-open` `{`​


    `transform``:` `translateY``(0);`​


    `opacity``:` `1``;`​


    `/* starting values for the entry transition */`​


    `@starting-style {`​


    `transform``:` `translateY``(-50px);`​


    `opacity``:` `0``;`​


    `}`​


    `}`


    What’s happening here:


    -​


    In the closed state, the popover is shifted up and fully transparent.


    -​


    When opened (:popover-open), it moves into place and fades in.


    -​


    @starting-style defines the frame where the opening transition


    begins.


    -​


    transition-behavior: allow-discrete allows the closing animation


    to play before the popover is removed from the DOM flow.


    The result: a smooth slide-and-fade both on entry and exit


