    \ the square back without further work. If you later\nreplace the square with\
    \ an arrow and want it to face the direction of travel, add\noffset-rotate: auto.\n\
    \n@keyframes move {\n  to {\n    offset-distance: 100%;\n  }\n}\n\n.box {\n  animation:\
    \ move 3s ease-in-out infinite alternate;\n}\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_64_0.png)\n\
    \nThe square is now moving.\n\n## Optional Path Visibility\n\nThe visible SVG\
    \ line we drew is just a guide. It helps during development to see\nthe curve\
    \ your element is following, but it isn’t required for the animation to\nwork.\n\
    \nThe only critical piece is the d string that you paste into offset-path. Once\
