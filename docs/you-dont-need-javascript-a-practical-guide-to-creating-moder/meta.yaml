  md: '**​**


    **Handling fixed headers**


    If your site uses a fixed header, there’s a common problem: the section title
    gets


    hidden behind the header when you scroll to it. CSS provides two ways to fix


    this, depending on how global or precise you want to be.


    ​


    Option A - Global offset​


    `**html**` `{`​


    `scroll-behavior``: smooth;`​


    `scroll-padding-top``:` `80px``;` `/* match your header''s height */`​


    `}`


    This adds an invisible buffer above every scroll target. No matter which section


    you navigate to, it always leaves 80px of space at the top.


    ​


    Option B — Per-element offset​


    `**section**` `{`​


    `scroll-margin-top``:` `80px``;` `/* match your header''s height */`​


    `}`


    Here, the offset applies only to the elements you choose (for example, specific


    headings or sections). That means:


    -​


    Sections you don’t tag with scroll-margin-top won’t get extra spacing.


    -​


    You can give different elements different offsets, depending on their


    layout.


    This is handy when some sections require more (or less) space than others.


