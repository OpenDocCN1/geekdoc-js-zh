    **III.1** **- Scroll-Driven Animations**


    Normally, CSS animations run against a clock: you define a duration, and the


    browser advances keyframes as time passes. With scroll-driven animations, the


    “clock” is replaced by scroll position. As you move through the page, the browser


    maps your progress to the animation’s progress.


    These animations run off-thread, meaning they’re handled by the browser’s


    compositor (the graphics engine) instead of the main JavaScript thread. The


    benefit: smoother motion and less jank, because they don’t compete with your


    page’s scripts or layout work.


    ​


    Final result: Scroll indicator growing depending on the scroll of the page.


