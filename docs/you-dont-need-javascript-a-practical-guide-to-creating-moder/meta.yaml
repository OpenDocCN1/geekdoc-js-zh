- md: "\n```css\n**option**:checked {\n  font-weight: 700;\n}\n\n**option**::checkmark\
    \ {\n  order: 1; /* move the marker to the end of the row */\n  margin-left: auto;\n\
    \  content: \"☑️\"; /* swap the icon if you like */\n}\n```\n\nThe checkmark content\
    \ is purely visual; assistive tech announces the selection\nbased on the native\
    \ control, not the decoration. This keeps you free to change\nthe icon without\
    \ compromising accessibility.\n\nNow even the checkmark is customized.\n\nHere’s\
    \ a Codepen to see the demo.\n\n⚠️ **Tips & troubleshooting**\n\n104\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_104_0.png)\n\
    \n- Some frameworks block these features or mis-hydrate when a\n<button> appears\
    \ inside <select>. If you you SSR, test hydration or\nguard with @supports.\n\n\
    - You can style just the button and leave the OS dropdown by\napplying appearance:\
    \ base-select only to select, not\n::picker(select).\n\n- The picker is a popover\
    \ anchored to its button. You can animate\nwith :popover-open or reposition with\
    \ anchor positioning if\nneeded.\n\nℹ️ **Browser Compatibility**\n\n- Customizable\
    \ Select (appearance: base-select, ::picker,\n<selectedcontent>, ::checkmark,\
    \ and ::picker-icon) work in\ncurrent Chrome/Edge. Global browser support of ~66.8%.\n\
    \n- Gating with @supports:\n```css\n@supports (appearance: base-select) {\n  select,\n\
    \  ::picker(select) {\n    appearance: base-select;\n  }\n  /* ...your customizable\
    \ rules here... */\n}\n```\n\n- Non-supporting browsers ignore the new bits and\
    \ fall back to a\nclassic select, your form still works.\n\n105\n\n✅ **Key Takeaways**\n\
    \n- No more appearance: none, keep the real <select> and style it\nvia appearance:\
    \ base-select and friends.\n\n- Target the button (the closed state), the arrow\
    \ (::picker-icon),\nthe dropdown (::picker(select)), the selected option\n(:checked),\
    \ and the checkmark (::checkmark). All with plain CSS.\n\n- It’s progressive by\
