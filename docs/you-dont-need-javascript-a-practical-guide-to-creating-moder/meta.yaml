    \ stays tiny: one track, one element, one keyframe block.\n- Use @supports and\
    \ design so page reads fine without animation when supported.\n\nScroll-driven\
    \ animations showed how CSS can now synchronize effects with the user’s scrolling,\
    \ making layouts dynamic and alive. It’s a feature that connects motion to intent\
    \ in a natural way.\n\n## III. Native Popovers\n\nMenus, tooltips, callouts… these\
    \ are everywhere. But historically, building them has been messy: you had to wire\
    \ up attributes, handle focus, manage z-index stacking, and write JavaScript for\
    \ open/close toggles and outside dismissal.\n\nThe Popover API solves all of that.\
    \ With just two attributes, you get:\n- Automatic top-layer stacking (always on\
    \ top)\n- Focus management (focus inside when opened, returns when closed)\n-\
    \ Light-dismiss (ESC key and outside clicks)\n- Clean, accessible behavior with\
    \ no JavaScript\n\nLayer CSS on top for design. No library, no boilerplate. Final\
    \ result: Left - popover. Right - showing popover.\n\n### Basic Structure\n\n\
    Every popover needs two parts:\n1. A trigger element (often a button)\n2. A popover\
    \ element (any element with popover attribute)\n\n```html\n<button popovertarget=\"\
    more\">Options</button>\n<div id=\"more\" popover>\n  <p>Native popover</p>\n\
    </div>\n```\n\nHere’s what’s happening:\n- The button has popovertarget=\"more\"\
