    Motion Path gives you the ability to choreograph precise movement, bringing


    individuality and playfulness to your designs. It shows how CSS animation has


    matured beyond simple transforms.


    Now, let’s discover how masks can shape what’s visible.


    **II.4** **- CSS Mask Effects**


    Masks let you control which parts of an element are visible using another image


    or gradient as a visibility map. Opaque areas of the mask reveal the element,


    while transparent areas hide it. Think of it as cutting a stencil and then shining


    your element through it.


    In this chapter we’ll use masks to build a practical before/after slider powered
    by


    a native <input type="range">. Then we’ll explore two more use cases to


    show how flexible this technique can be.


