  - '[PAGE 107]


    ​


    Final result: automatically adjusting anchor.


    **​**


    **The Basic HTML Structure**


    Clean and semantic: a button (the anchor) and a tooltip.


    `<``**button**` `class=``"btn"` `aria-describedby=``"tip"``>``More options``</``**button**``>`


    ​


    `<``**div**` `class=``"tip"` `id=``"tip"` `role=``"tooltip"``>``Hello from CSS
    anchor`


    `positioning` 👋`</``**div**``>`


    -​


    The button is our anchor.


    -​


    The tooltip points to it with aria-describedby for accessibility.


    -​


    No wrappers or helper containers needed, the magic happens in CSS.


    **​**


    **Declaring the Anchor**


    To use an element as a reference point, you must give it a name with the


    anchor-name property:


    `.btn` `{`​


    `anchor-name``: --btn;` `/* this can be targeted by anchored elements`


    `*/`​


    `}`


    This is like putting a label on the button. Later, any other element (tooltip,


    dropdown, etc.) can say: “Stick to the anchor called --btn.”


    The double dashes are just a naming convention (like custom properties), you


    can call it --trigger, --menu, or anything you like.


    107


    ![](img/3a45eae12017b03ce41b30e896bc70ee_107_0.png)'
  - '[PAGE 108]


    **​**


    **Associating the Tooltip**


    Now we need to tell the tooltip which anchor to follow. That’s done with


    position-anchor.


    `.tip` `{`​


    `position``: absolute;` `/* required for anchor positioning */`​


    `position-anchor``: --btn;` `/* bind to the button by name */`​


    `z-index``:` `10``;`​


    ​


    `/* visual skin (just for the demo) */`​


    `padding``: .``5rem` `.``75rem``;`​


    `background``:` `#111``;`​


    `color``: white;`​


    `border-radius``: .``5rem``;`​


    `}`


    Two rules make anchoring work:


    1.​ The element must be positioned (absolute or fixed), otherwise it has


    nothing to “lock” against.


    2.​ It must declare which anchor it belongs to with position-anchor.


    Think of it like this: “I’m absolutely positioned… but not relative to the container,


    I’m relative to the anchor named --btn.”


    **​**


    **Placing with anchor()**


    By default, the tooltip would stack in the top-left corner of the anchor. To control


    the exact relationship, we use the anchor() function:


    `.tip` `{`​


    `/* vertical: place top edge just below the anchor''s bottom */`​


    `top``:` `calc``(anchor(bottom) +` `8px``);`​


    ​


    `/* horizontal: center on the anchor */`​


    `left``: anchor(left);`


    `}`


    108'
  - '[PAGE 109]


    -​


    anchor(bottom) gives the position of the button’s bottom edge.


    -​


    anchor(left) gives the left edge.


    -​


    You can also use anchor(top), anchor(right), or even


    anchor(center) for centering.


    Because anchor() returns a length, you can combine it with calc() to


    fine-tune gaps, offsets, or centering math.


    **​**


    **Avoiding Clipping with Fallbacks**


    What if the button is near the bottom of the screen and there’s no room for the


    tooltip? You can provide backup strategies:


    `.tip` `{`​


    `position-try``: flip-block flip-inline;` `/* try above, then`


    `left/right if needed */`​


    `}`


    -​


    flip-block = if there’s no space below, try placing it above.


    -​


    flip-inline = if there’s no space horizontally, nudge left or right.


    This gives tooltips and dropdowns resilience without JavaScript. The browser


    does the smart positioning for you.


    **​**


    **Matching the Anchor’s Width (Optional)**


    Dropdown menus often need to match their trigger’s width. You can do that too:


    `.tip` `{`​


    `inline-size``:` `anchor-size``(width);` `/* size relative to the`


    `anchor''s width */`​


    `}`


    -​


    anchor-size(width) returns the anchor’s width as a usable length.


    -​


    There’s also anchor-size(height) for vertical alignment cases.


    -​


    Since it’s a length, you can calc() with it to add caps, max-widths, or


    margins.


