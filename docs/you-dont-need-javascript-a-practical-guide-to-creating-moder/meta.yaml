- md: "\n```css\nleft: calc(var(--width) * -1);\n}\n}\n```\n\nEach item begins at\
    \ left: 100%, just outside the right edge of the container. Over the course of\
    \ --duration, it travels left until it has fully exited the view (-1 × width).\
    \ Because the animation is linear and infinite, the motion is perfectly constant\
    \ and loops forever.\n\nThe real trick lies in the animation-delay. Instead of\
    \ starting all logos at once, we stagger them:\n\n- A full loop lasts --duration.\n\
    - The gap between logos is loop / quantity.\n- Each item’s index (--position)\
    \ sets how far behind it should be.\n- Finally, subtracting one loop ensures the\
    \ first frame already shows a full sequence in motion, so you never see an empty\
    \ track.\n\n```css\nloop = var(--duration)\ngap = loop / var(--quantity)\nindex\
    \ = var(--position) - 1\nanimation-delay = gap × index - loop\n```\n\nThink of\
    \ it like a relay race: each runner starts exactly when the previous one has advanced\
    \ enough, so the baton never stops moving.\n\nAlternative explanation of the formula.\n\
    \n## Pausing on Hover and Focus\n\nAn infinite motion can become distracting,\
    \ so it’s important to give users control. With just a few lines of CSS, we can\
    \ let them pause it:\n\n```css\n/* Hover with a mouse */\n.slider:hover.item,\n\
    /* Focus with keyboard */\n.slider:focus.item {\n  animation-play-state: paused;\n\
    }\n```\n\nHovering with a mouse stops the animation, and focusing with the keyboard\
    \ (thanks to tabindex=\"0\") does the same. Here’s a Codepen to see the demo.\n\
    \n![](img/3a45eae12017b03ce41b30e896bc70ee_37_0.png)\n\n## ℹ️ Browser Compatibility\n\
    \n- mask-image: well supported with 95% browser support. But you can also use\
    \ a simple fade-in/out gradient with ::before and ::after.\n- animation-play-state:\
    \ Fully supported in all modern browsers with over 95.5% global support.\n- You\
    \ can also respect the prefers-reduced-motion media query to turn off autoplay\
    \ entirely for users who disable animations in their system settings.\n\n## ✅\
    \ Key Takeaways\n\n- Inline custom properties make the slider copy-paste portable\
    \ and editable by every user.\n- @keyframes + calculated animation-delay yield\
    \ a seamless, gap-free loop without JS timers.\n- mask-image gives a professionally\
    \ faded entrance/exit without repaint cost.\n- :has() delivers focus-pause accessibility\
    \ previously only possible with JavaScript.\n\nAfter mastering dynamic animations\
    \ with pure CSS sliders, let’s delve into another powerful feature often overlooked:\
    \ CSS counters. You’ll see how CSS alone can automatically number headings and\
    \ animate numbers, simplifying content management and dynamic displays.\n\n##\
    \ I.7 - Auto-Numbered Headings\n\nIf you’ve ever written a long document, you\
    \ know the pain of keeping section numbers in sync. Change the order of a chapter,\
    \ insert a new subsection, and suddenly you’re renumbering everything by hand.\n\
    \nCSS has a solution: counters. Think of them as a built-in page-numbering machine.\
    \ Once set up, each heading labels itself automatically. You can shuffle, remove,\
    \ or duplicate sections as much as you want, and the numbers always stay correct.\n\
    \nFinal result: Numbers in front of each headings.\n\nCounters follow a simple\
    \ rhythm:\n\n1. **Reset** → start a counter at zero.\n2. **Increment** → add one\
    \ each time an element appears.\n3. **Read** → display the current value with\
    \ content.\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_39_0.png)\n\nThat’s all\
    \ it takes. Let’s walk through an example where <h2> elements become numbered\
    \ section headings, and <h3> elements become numbered subsections.\n\n### The\
    \ Basic HTML Structure\n\nHere’s a minimal structure with a couple of sections,\
    \ each containing one or more sub-headings:\n\n```html\n<main>\n  <section>\n\
    \    <h2>First title of the page</h2>\n    <h3>First sub-title of the section</h3>\n\
    \    <h3>Second sub-title of the section</h3>\n  </section>\n  <section>\n   \
    \ <h2>Second title of the page</h2>\n    <h3>First sub-title of the section</h3>\n\
    \    <h3>Second sub-title of the section</h3>\n    <h3>Third sub-title of the\
    \ section</h3>\n  </section>\n  ...\n</main>\n```\n\n### Numbering top-level headings\n\
    \nWe begin by creating a counter called h2. Setting counter-reset: h2 on the <main>\
    \ element ensures the count starts fresh at the beginning of the document:\n\n\
    ```css\nmain {\n  counter-reset: h2;\n}\n```\n\nEach time the browser encounters\
    \ an <h2>, it increments this counter:\n\n```css\nh2 {\n  counter-increment: h2;\
    \ /* +1 for every h2 */\n}\n```\n\nNow the counter exists and moves forward, but\
    \ we don’t see it yet. To display it, we use a ::before pseudo-element:\n\n```css\n\
    h2::before {\n  content: counter(h2, decimal-leading-zero) \" - \";\n}\n```\n\n\
    The decimal-leading-zero style ensures numbers like 01, 02, 03…, which helps line\
    \ things up neatly. At this point, every <h2> is automatically prefixed with its\
    \ section number.\n\nNumbered h2 headings.\n\n### Numbering nested sub-headings\n\
    \nThe real power comes when counters cascade. We can give each <section> its own\
    \ local counter for <h3> elements. This way, every new section restarts its sub-heading\
    \ numbers.\n\n```css\nsection {\n  counter-reset: h3;\n}\n```\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_41_0.png)\n\
    \n```css\nh3 {\n  counter-increment: h3;\n}\n\nh3::before {\n  content: counter(h2)\
    \ \".\" counter(h3) \" - \";\n}\n```\n\nHere’s how it works:\n\n- Each <section>\
    \ resets the h3 counter to zero.\n- Every <h3> increments it.\n- The ::before\
    \ combines the current h2 value with the current h3 value.\n\nSo under <h2>Second\
    \ title of the page</h2> the first subsection becomes 2.1, the second becomes\
    \ 2.2, and so on.\n\nNumbered h3 sub-headings.\n\n### Variations and styles\n\n\
    Counters aren’t limited to decimals. The counter() function accepts a parameter:\
    \ For example:\n\n- counter(h2, decimal-leading-zero) → 01, 02, 03\n- counter(h2,\
    \ upper-roman) → I, II, III\n- counter(h3, lower-alpha) → a, b, c\n\n```css\n\
    h3::before {\n  content: counter(h2) \".\" counter(h3, lower-alpha);\n}\n```\n\
    \nThis would yield something like 3-a, 3-b, and so on. Here’s a Codepen to see\
    \ the demo. We can now pivot from static labels to dynamic digits.\n\n## I.8 -\
    \ Other Use Case of Counter\n\nNumbering headings is the most common use of counters,\
    \ but they can do much more. Because counters are dynamic and can be tied to animations,\
    \ they can label, inform, or even simulate behaviors we once thought required\
    \ JavaScript. One good example is an animated counter. The kind of effect you\
    \ see in dashboards or landing pages, where a number rolls up from 0 to a target\
    \ value. Traditionally this required JavaScript, but with modern CSS we can achieve\
    \ it entirely in styles.\n\nFinal result: counter from 0 to 10.\n\n### The Basic\
    \ HTML\n\nWe only need a single element in the markup:\n\n```html\n<div class=\"\
    ticker\" aria-label=\"10\"></div>\n```\n\nVisually, this element will display\
    \ the rolling number. But since the digits are generated with CSS, they aren’t\
    \ announced to assistive technologies. To fix that, we use aria-label=\"10\".\
    \ That way, screen readers report the final value even if the animation itself\
    \ is hidden from them.\n\n### Making a custom property animatable\n\nTo animate\
    \ a number, we first need a custom property that accepts integers. CSS gives us\
    \ the @property rule for exactly this:\n\n```css\n/* Declare an animatable integer\
    \ */\n@property --c {\n  syntax: \"<integer>\";\n  initial-value: 10;\n  inherits:\
    \ true;\n}\n```\n\nHere we define --c as an integer type. This makes it animatable,\
    \ just like opacity or transform. Over time, we’ll update c from 0 up to the target\
    \ value.\n"
  mdcn: "\n\n```css\nleft: calc(var(--width) * -1);\n}\n}\n```\n\n每个项目都从 `left: 100%`\
    \ 开始，位于容器右边缘的外侧。在 `--duration` 期间，它向左移动，直到完全离开视野（-1 × width）。由于动画是线性的且无限的，这种运动是完全恒定的并永远循环。\n\
    \n真正的秘诀在于 `animation-delay`。我们并没有让所有 logo 同时启动，而是让它们错位排列：\n\n- 一个完整的循环耗时 `--duration`。\n\
    - 两个 logo 之间的间距是 `loop / quantity`。\n- 每个项目的索引 (`--position`) 决定了它应该落后多远。\n- 最后，减去一个循环可以确保第一帧就已经显示出运动中的完整序列，因此你永远不会看到空轨道。\n\
    \n```css\nloop = var(--duration)\ngap = loop / var(--quantity)\nindex = var(--position)\
    \ - 1\nanimation-delay = gap × index - loop\n```\n\n把它想象成一场接力赛：每个跑步者在在前一个人前进足够远时正好开始，这样接力棒就永远不会停止移动。\n\
    \n公式的另一种解释。\n\n## 悬停和聚焦时暂停\n\n无限的运动可能会分散注意力，因此给用户提供控制权至关重要。只需几行 CSS，我们就可以让他们让动画暂停：\n\
    \n```css\n/* 鼠标悬停 */\n.slider:hover.item,\n/* 键盘聚焦 */\n.slider:focus.item {\n\
    \  animation-play-state: paused;\n}\n```\n\n用鼠标悬停会停止动画，使用键盘聚焦（得益于 `tabindex=\"\
    0\"`）也具有相同的效果。这里有一个 Codepen 可以查看演示。\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_37_0.png)\n\
    \n## ℹ️ 浏览器兼容性\n\n- mask-image: 支持良好良好，浏览器支持率达 95%。但你也可以使用 `::before` 和 `::after`\
    \ 配合简单的淡入/淡出渐变。\n- animation-play-state: 在所有现代浏览器中均完全支持，全球支持率超过 95.5%。\n- 你还可以尊重\
    \ `prefers-reduced-motion` 媒体查询，为系统设置中禁用动画的用户完全关闭自动播放。\n\n## ✅ 核心要点\n\n- 内联自定义属性使滑块具有可拷贝的移植性，并且每个用户都可以编辑。\n\
    - `@keyframes` + 计算出的 `animation-delay` 在无需 JS 计时器的情况下实现了无缝、无间隙的循环。\n- `mask-image`\
    \ 提供了专业的淡入/淡出效果，且没有重绘代价。\n- `:has()` 实现了以前只有通过 JavaScript 才能聚焦暂停无障碍功能。\n\n在掌握了纯\
    \ CSS 滑块的动态动画后，让我们深入另一个经常被忽视的强大功能：CSS 计数器（counters）。你将看到仅通过 CSS 就能自动为标题编号并让数字动画，简化内容管理和动态显示。\n\
    \n## I.7 - 自动编号标题\n\n如果你写过长文档，你就知道同步章节编号的痛苦。改变一个章节的顺序，插入一个新的子章节，突然你就必须手动对所有内容重新编号。\n\
    \nCSS 有解决方案：计数器。把它们想象成内置的页码机。一旦设置好，每个标题都会自动标记自己。你可以随意调整、删除或复制章节，数字始终保持正确。\n\n\
    最终结果：每个标题前的数字。\n\n计数器遵循一个简单的节奏：\n\n1. **重置 (Reset)** → 将计数器重置为零。\n2. **递增 (Increment)**\
    \ → 每当元素出现一次时加一。\n3. **读取 (Read)** 在内容中显示当前值。\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_39_0.png)\n\
    \n这就足够了。让我们来看一个例子，其中 `<h2>` 元素变成编号的章节标题，`<h3>` 元素变成编号的子章节。\n\n### 基础 HTML 结构\n\
    \n这是一个包含几个章节的极简结构，每个章节包含一个或多个子标题：\n\n```html\n<main>\n  <section>\n    <h2>页面的第一个标题</h2>\n\
    \    <h3>章节的第一个子标题</h3>\n    <h3>章节的第二个子标题</h3>\n  </section>\n  <section>\n \
    \   <h2>页面的第二个标题</h2>\n    <h3>章节的第一个子标题</h3>\n    <h3>章节的第二个子标题</h3>\n    <h3>章节的第三个子标题</h3>\n\
    \  </section>\n  ...\n</main>\n```\n\n### 为顶层标题编号\n\n我们首先创建一个名为 `h2` 的计数器。在 `<main>`\
    \ 元素上设置 `counter-reset: h2;` 确保计数从文档开始处重新开始：\n\n```css\nmain {\n  counter-reset:\
    \ h2;\n}\n```\n\n每当浏览器遇到 `<h2>` 时，就会递增这个计数器：\n\n```css\nh2 {\n  counter-increment:\
    \ h2; /* 递增计数器 */\n}\n```\n\n现在我们使用 `::before` 伪元素来显示计数值：\n\n```css\nh2::before\
    \ {\n  content: counter(h2) \" \";\n}\n```\n\n这会产生每个标题前都有数字。\n\n### 嵌套子标题编号\n\n\
    我们可以为 `h3` 设置计数器：\n\n```css\nmain {\n  counter-reset: h3;\n}\n```\n\n### 嵌套子标题编号\n\
    \n当计数器级联时，真正的威力出现了。我们可以为每个 `<section>` 设置它自己的局部计数器：\n\n```css\nsection {\n  counter-reset:\
    \ h3;\n}\n```\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_41_0.png)\n\n```css\n\
    h3 {\n  counter-increment: h3;\n}\n\nh3::before {\n  content: counter(h2) \".\"\
    \ counter(h3) \" \";\n}\n```\n\n它的工作原理：\n\n- 每个 `<section>` 将 `h3` 计数器归零。\n- 每个\
    \ `<h3>` 递增它。\n- `::before` 结合当前的 `h2` 值和当前的 `h3` 值。\n\n这样，第一个子章节是 2.1，第二个是 2.2，以此此类推。\n\
    \n### 变体与样式\n\n计数器不仅限于进制。`counter()` 函数接受一个参数：例如：\n\n- `counter(h2, decimal-leading-zero)`\
    \ → 01, 02, 03\n- `counter(h2, upper-roman)` → I, II, III\n- `counter(h3, lower-alpha)`\
    \ → a, b, c\n\n```css\nh3::before {\n  content: counter(h2) \".\" counter(h3,\
    \ lower-alpha);\n}\n```\n\n这会产生类似 3-a, 3-b 等效果。这里有一个 Codepen 可以查看演示。\n\n## I.8\
    \ - 计数器的其他用途\n\n标题编号是计数器常用的用途，但它们可以做更多。由于计数器是动态的并且可以与动画绑定，它们可以标记、告知甚至模拟我们曾经认为需要\
    \ JavaScript 的行为。很好的例子是动态数字。你在仪表板或落地页上看到的这种效果，数字从0滚动到目标值。传统上需要 JavaScript，但通过现代\
    \ CSS 我们可以完全在样式中实现。\n\n最终结果：从 0 计数到 10。\n\n### 基础 HTML\n\n在标记中我们需要一个元素：\n\n```html\n\
    <div class=\"ticker\" aria-label=\"10\"></div>\n```\n\n### 让自定义属性可动画\n\n为了动画数字，我们首先需要一个接受整数的自定义属性。CSS\
    \ 提供了 `@property` 规则专门为此：\n\n```css\n/* 声明可动画的整数 */\n@property --c {\n  syntax:\
    \ \"<integer>\";\n  initial-value: 10;\n  inherits: true;\n}\n```\n\n在这里我们将 `--c`\
    \ 定义为整数类型。这使得它是可动画的，就像不度或变换一样。随着时间的推移，我们将 `c` 从 0 更新到目标值。\n\n"
