  md: '**​**


    **3- Masonry-style layout via Item Flow**


    “Item Flow” is a proposal to unify placement across Flexbox and Grid and,


    crucially, to make masonry a first-class variant of Grid. It’s still being debated;
    the


    latest WebKit posts show what the syntax might look like and why.


    `/* Proposal sketch from WebKit''s write-up */`​


    `.gallery` `{`​


    `display``: grid;`​


    `grid-template-columns``:` `repeat``(auto-fill, minmax(14rem, 1fr));`​


    `item-flow``: row collapse;` `/* collapse rows` → `classic masonry`


    `"waterfall" */`​


    `gap``:` `1rem``;`​


    `}`


    Don’t ship this yet. It’s for experimentation and feedback to the CSSWG.


    **​**


    **4- True randomness with random()**


    A CSS random() function is emerging that returns random values or choices


    right in CSS. Great for offsets, delays, subtle texture, etc. Safari Technology


    Preview has an early implementation.


    `/* Safari Technology Preview today; gate carefully */`​


    `@``**supports**` `(left: random(``0px``,` `1px``)) {`​


    `.confetti` `>` `**i**` `{`​


    `animation-delay``:` `random``(0ms, 600ms, 50ms);` `/* stepped`


    `randomness */`​


    `translate``:` `random``(-30vw, 30vw)` `random``(-10vh, 10vh);`​


    `}`​


    `}`


    Use sparingly: it’s experimental and non-deterministic by definition.


