    hide\" aria-label=\"Close\">✕</button>\n</div>\n```\n\nThe popovertarget attribute\
    \ links this button to the same popover. Whereas the popovertargetaction attribute\
    \ controls the behavior:\n- toggle (default) → open if closed, close if open\n\
    - show → always open it\n- hide → always close it\n\nThis is declarative control,\
    \ the browser handles state changes without event listeners or scripts.\n\n###\
    \ Adding animation\n\nBy default, popovers just “pop” in and out. That’s functional,\
