    ​


    `<``**div**` `class=``"compare"` `style=``"--pos: 50%"``>`​


    `<``**section**` `class=``"before"``>``I''m the left section` 😻`</``**section**``>`​


    `<``**section**` `class=``"after"``>``I''m the right section` 🙀`</``**section**``>`​


    ​


    `<``**input**`​


    `type=``"range"`​


    `id=``"compare-range"`​


    `min=``"0"` `max=``"100"` `step=``"0.1"` `value=``"50"`​


    `aria-label=``"Comparison position"`​


    `/>`​


    `</``**div**``>`


    The range stays native (keyboard/touch accessible) and provides a value you can


    read or submit. Here’s the explanation:


    -​


    min / max  → define the scale. We use 0–100 so the slider value maps


    directly to a percent for --pos.


    -​


    step  → sets granularity (and keyboard increments). 0.1 is silky, 1 is


    whole percent.


    -​


    value  → the starting position so the divider and --pos match on load.


