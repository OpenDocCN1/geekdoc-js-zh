    \n1\n\n引言\n\nJavaScript 确实强大，这点毫无悬疑。但如果你正在用 JS 解决的大部分问题，其实可以通过现代 CSS 和语义化 HTML\
    \ 同样良好、甚至更好地处理，呢？本书基于一个简单的原则：使用能够完成任务的“最弱”的工具。\n\n**最小能力原则 (The Rule of Least\
    \ Power)**\n\n这一原则源于 Web 标准背后的哲学：始终选择能有效完成任务的最简单工具。从使用语义化 HTML 构建内容结构开始，通过 CSS\
    \ 增强表现和交互，仅在绝对必要时才使用 JavaScript。HTML 和 CSS 是声明式语言。你描述你的意图（最终的样式和行为），而浏览器决定执行该意图的最有效方式。这种方法天生就能带来更简单、更易维护且可访问性更高的网站。然而，JavaScript\
    \ 是命令式的。它要求你显式地定义浏览器必须采取的每一步，增加了复杂性、性能开销和潜在的故障点。\n\n**为什么我们默认选择 JavaScript？**\n\
    \n使用 JavaScript 既容易又极人诱惑。React、Vue 和 Angular 等流行的框架使得快速原型设计和丰富的交互变得极其方便。虽然这种便利性具有显著优势，但它也往往会导致包体积臃肿、加载速度缓慢以及不必要的复杂性。\n\
    \n另一方面，浏览器已经发生了巨大的进化。现代 CSS 和 HTML 已经取得了惊人的追赶，提供了曾经仅保留给 JavaScript 的强大功能。你现在可以仅通过原生浏览器技术来实现复杂的\
    \ UI 模式，如对话框、折叠面板、轮播图、开关和动画。\n\n2\n\n**为什么这很重要**\n\n使用最少的 JavaScript 意味着更精简的代码库、更好的可访问性、更高的性能以及对第三方库依赖减少。此外，它还减少了用户和服务器的能量消耗，显著降低了你网站的环境足迹。\n\
    \n然而，目标并不是完全移除 JavaScript。某些任务，如实时数据获取、复杂的业务逻辑，仍然需要它。目标是平衡：仅在提供真正价值时使用 JavaScript，而不是仅仅因为它方便或熟悉。\n\
    \n通过采用 CSS 优先的方法，你从根本上增强了可访问性。语义 HTML 和原生浏览器行为对辅助技术进行了优化。\n\n**性能与可持续性**\n\n减少对\
    \ JavaScript 的依赖意味着更快的初始加载时间、更低的 CPU 占用和电量消耗。例如，用纯 CSS 代替 JavaScript 库（通常会有 50-100KB\
    \ 的压缩代码），可以降低开销并显著提升性能。\n\n本书引导你在使用 JavaScript 之前停顿一下。始终问自己：CSS 能处理吗？你会发现答案往往比你想象的要确定，从而从一开始就开始构建更快、更干净、更具访问性的网站。\n\
    \n**联系我们**\n\n有任何问题、发现错误或想提出建议？我很乐意听到你的反馈！\n\n给我发送邮件：hey@theosoti.com\n\n3\n\n\
    需要 CSS 或网站项目方面的帮助吗？我接受兼职工作。\n\n让我们合作吧，请随时联系我！\n\n想学习更多关于现代 CSS 和网页设计的知识吗？\n\n\
    请访问 theosoti.com 查看文章、代码示例和更新。\n\n4\n\n第一部分 - 日常功能\n\n每个网站无论多简单，都需要一些核心构建区块。平滑的页内导航、对话框、折叠面板……这些是访问者开箱即用的模式。在本部分中，我们将使用现代\
    \ HTML 和 CSS 重新创建这些熟悉的功能，保持其轻量化。它们是你会频繁使用的日常组件。\n\n让我们直接进入正题！\n\n**I.1 - 使用 :has()\
    \ 进行条件样式设置**\n\n长期以来，CSS 选择器只能向下查看 DOM。你可以针对子元素、后代或兄弟元素进行选择，但无法查询关于父元素的任何信息。这种空白迫使开发者使用\
    \ JavaScript 来解决看似是样式的问题。\n\n:has() 伪类终于填补了这个空白。它通常被称为“父级选择器”，允许你根据元素的内容对元素应用样式。\n\
    \n**理解 :has()**\n\n在最简单的情况下，当元素内部满足某些条件时，has() 会匹配该元素。在实践中，这通常意味着检查它是否包含某个后代。语法非常直观：\n\
    \n`/* 仅当 .card 包含 .active 元素时匹配 .card */`\n\n```css\n.card:has(.active) {\n  border-color:\
    \ green;\n}\n```\n\n5\n\n"
