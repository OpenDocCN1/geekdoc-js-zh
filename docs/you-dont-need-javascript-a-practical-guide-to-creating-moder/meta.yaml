    Why this works:


    -​


    In the customizable select model, the first child button replaces the


    default face.


    -​


    <selectedcontent> acts as a live mirror, the browser copies the chosen


    option’s content into it automatically.


    -​


    In non-supporting browsers, the extra children are ignored. You get a


    classic <select> with full functionality.


    That makes this naturally progressive: one markup, two behaviors depending on


    browser support.


    **​**


    **Opting In**


    To enable customization, you opt in with:


    `**select**``,`​


    `::picker(select)` `{`​


    `appearance``: base-select;` `/* opt-in to the customizable select`


    `model */`​


    `}`


    This removes the OS chrome but keeps semantics, keyboard UX, and screen


    reader behavior. You can apply it only to the button if you prefer the native


    dropdown, or to both for full styling control.


