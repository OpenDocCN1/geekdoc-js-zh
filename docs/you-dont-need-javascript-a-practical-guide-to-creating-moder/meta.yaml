  md: '​


    3\. Advanced Combinations


    :has() doesn’t live in isolation. You can combine it with pseudo-classes to


    create rich conditional effects.


    Here’s an “inverted hover” pattern: when one card is hovered, all the others blur.


    ​


    Final result: hover an element blurs everything else​


    `.cardlist``:has(.card:hover)``.card``:not(:hover)` `{`​


    `filter``:` `blur``(4px);`​


    `}`


    The parent .cardlist is what enables the effect. The :has(.card:hover)


    part checks if at least one card inside is being hovered. Once that condition
    is


    true, the selector matches the whole .cardlist.


    From there, the .card:not(:hover) part comes into play. It says: “inside this


    card list, select all the cards that are not hovered.” Those are the elements
    that


    get blurred.


    The result is that the hovered card stays sharp, while every other card in the
    list


    gets blurred.


    Here’s a Codepen to see the demo.


    ​


    4\. Checking adjacent siblings


    Because :has() can look sideways as well as down, you can style an element


    based on what comes after it. For example, only apply a style to <h2> elements


    that are immediately followed by a paragraph:


