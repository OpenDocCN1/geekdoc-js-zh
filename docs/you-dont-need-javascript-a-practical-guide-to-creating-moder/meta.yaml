  - '[PAGE 110]


    This is perfect for dropdown menus, autocomplete panels, or tooltips that


    should feel visually tied to their trigger.


    Here’s a Codepen to see the demo.


    ⚠️  **Tips & troubleshooting**


    -​


    anchor() is valid inside inset properties


    (top/left/right/bottom and logical variants). If you put a


    horizontal side in a vertical inset (or vice versa), the fallback value (if


    any) is used. Prefer logical values for i18n.


    -​


    Add gaps with calc(anchor(...) + 8px) or plain margins (e.g.,


    margin-top: 8px when anchoring below).


    -​


    You can reference different named anchors on different sides (e.g.,


    top to A, left to B) but the element associates (scrolls/hides with) a


    single position-anchor.


    ℹ️  **Browser Compatibility**


    -​


    Anchors (anchor(), anchor-name, position-anchor,


    anchor-size(), and position-try) work in current


    Chrome/Edge. Global browser support of ~74%.


    -​


    Gate styles so non-supporting browsers get a normal, usable UI:


    `@``**supports**` `(``anchor-name``: --btn) {`​


    `.btn` `{`


    `anchor-name``: --btn;`


    `}`


    ​


    `.tip` `{`


    110'
  - '[PAGE 111]


    `position``: absolute;`


    `position-anchor``: --btn;`


    `top``:` `calc``(anchor(bottom) +` `8px``);`


    `left``:` `calc``(anchor(center) -` `50%``);`


    `}`​


    `}`


    -​


    Content still works without anchoring. You just won’t get the


    tethered placement.


    ✅ **Key Takeaways**


    -​


    Name an anchor, associate a positioned element, and place it with


    anchor()


    -​


    anchor()returns a length, so you can calc() spacing and


    centering. Use logical sides for writing-mode friendliness.


    -​


    Fallbacks with position-try keep popovers/tooltips visible by


    flipping when they’d overflow.


    -​


    anchor-size() lets you size the popup relative to the anchor (e.g.,


    match trigger width).


    -​


    Guard with @supports and design for a graceful static layout when


    unsupported.


    ​


    Anchor positioning showed how elements can stay neatly attached to their


    triggers with pure CSS, even as layouts shift. It’s a simple, resilient way to


    manage menus and tooltips.​


    Now let’s look at a classic: building a carousel entirely in CSS.


