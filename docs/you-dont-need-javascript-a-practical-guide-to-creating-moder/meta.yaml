    ​


    Final result: second title is different because it has no paragraph.​


    `**h2**``:has(+``**p**``) {`​


    `border-bottom``:` `2px` `solid black;`​


    `color``:` `#555``;`​


    `}`


    This lets you keep your headings context-aware without littering the HTML with


