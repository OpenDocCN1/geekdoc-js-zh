  md: '**I.7** **- Auto**‑**Numbered Headings**


    If you’ve ever written a long document, you know the pain of keeping section


    numbers in sync. Change the order of a chapter, insert a new subsection, and


    suddenly you’re renumbering everything by hand.


    CSS has a solution: counters. Think of them as a built-in page-numbering


    machine. Once set up, each heading labels itself automatically. You can shuffle,


    remove, or duplicate sections as much as you want, and the numbers always


    stay correct.


    Final result: Numbers in front of each headings.


    ​


    Counters follow a simple rhythm:


    1.​ **Reset**  → start a counter at zero.


    2.​ **Increment**  → add one each time an element appears.


    3.​ **Read**  → display the current value with content.​


