    `**syntax**``: "<``**integer**``>";`​


    `**initial-value**``: 10;`​


    `**inherits**``:` `**true**``;`​


    `}`


    Here we define --c as an integer type. This makes it animatable, just like


    opacity or transform. Over time, we’ll update --c from 0 up to the target


    value.


