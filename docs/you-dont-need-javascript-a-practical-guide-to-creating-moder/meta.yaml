    ## Custom Arrow with :after


    We’ll now add our own arrow at the end of the summary using the ::after pseudo-element:


    `span` {

    `display: flex;`

    `justify-content: space-between;`

    }


    `span:after` {

    `content: "\276F";`

    `transform: rotate(90deg);`

    `transition: transform 0.3s ease;`

    }


    This uses a Unicode arrow (›) rotated 90 degrees so it points down. We space the
    arrow from the title using Flexbox.


    To animate the arrow when the accordion opens, we update its rotation like this:


    `details[open]span:after` {

    `transform: rotate(270deg);`

    }


    This gives the arrow a flipped effect to show the expanded state.


    ## Smooth Content Animation


    To animate the opening and closing of content, we use a clever trick with CSS
    Grid. Instead of placing the paragraph directly inside <details>, we put it in
    a sibling .content div. This lets us animate the height of the content when the
    details element opens.


    `.content` {

    `display: grid;`

    `grid-template-rows: 0fr;`

    `transition: grid-template-rows 0.3s ease;`

    }


    `.inner` {

    `overflow: hidden;`

    `margin: 0;`

    }


    The inner paragraph’s overflow is hidden to ensure that text expands smoothly
    without any jumpy layout changes.


    When the accordion opens, we increase the grid row height:


    `details[open]+content` {

    `grid-template-rows: 1fr;`

    }


    With just that, you have a fully functional and animated accordion. You just need
    to add your own style and you are ready to go!


