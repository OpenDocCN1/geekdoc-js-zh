- md: "\nThe sections are now split in half.\n\n## Styling the slider\n\nThe range\
    \ input needs to look like a clean divider rather than a native control.\n\nFirst,\
    \ we strip away the default styles and hide the track:\n\n```css\n.compare input[type=\"\
    range\"] {\n  z-index: 1;\n  appearance: none;\n  background: transparent;\n}\n\
    ```\n\nAt this point, the slider is still functional, but invisible. Next we redefine\
    \ its thumb (the draggable part) so it becomes a vertical bar:\n\n```css\n/* The\
    \ thumb becomes the vertical divider */\n.compare input[type=\"range\"]::-webkit-slider-thumb\
    \ {\n  appearance: none;\n  inline-size: 4px;\n  block-size: 100%;\n  background:\
    \ #000;\n}\n\n.compare input[type=\"range\"]::-moz-range-thumb {\n  appearance:\
    \ none;\n  inline-size: 4px;\n  block-size: 100%;\n  background: #000;\n}\n```\n\
    \nWith these rules, the thumb itself *is* the divider. Dragging it will update\
    \ the mask position, so visually it feels like you’re pulling the line that separates\
    \ the two panels.\n\nℹ️ Browsers use different range-thumb pseudo-elements. If\
    \ you group them in one rule, each browser sees an unknown selector and drops\
    \ the entire rule. Write two separate rules so each engine applies the one it\
    \ recognizes.\n\n## Updating the divider with JavaScript\n\nThe range input updates\
    \ the --pos variable, which both masks use as their cut point. A small script\
    \ handles this:\n\n```javascript\nconst range = document.getElementById(\"compare-range\"\
    );\nrange.oninput = () =>\n  document.body.style.setProperty(\"--pos\", range.value\
    \ + \"%\");\n```\n\nEach time the slider moves, --pos changes, and the masks redraw\
    \ instantly so the divider follows.\n\nLink to the codepen.\n\n## Accessibility\n\
    \nSince the slider is a standard `<input type=\"range\">`, it already works with:\n\
    \n- Mouse and touch\n- Keyboard (arrows, PageUp/Down, Home/End)\n- Assistive technologies\n\
    \nProvide a visible label or an aria-label to name the control. Because the fill\
    \ is a mask change rather than a moving element, there’s no additional motion\
    \ to disable.\n\n## Other use cases\n\nOnce you understand masks, you’ll start\
    \ to see them everywhere. Here are two quick examples.\n\n### Read-only stars\
    \ rating\n\nFinal result: Star rating.\n\nStack two identical star rows and reveal\
    \ the top row with a left-to-right mask driven by a percentage. Great for displaying\
    \ ratings.\n\n```html\n<div class=\"stars\" style=\"--p: 70%\">\n  <div class=\"\
    row row--bg\" aria-hidden=\"true\">★★★★★</div>\n  <div class=\"row row--fg\" aria-hidden=\"\
    true\">★★★★★</div>\n</div>\n```\n\n```css\n.stars {\n  position: relative;\n \
    \ display: inline-grid;\n}\n\n.stars > * {\n  grid-area: 1/1;\n  font-size: 40px;\n\
    \  letter-spacing: 4px;\n}\n\n.row--bg {\n  color: #cbd5e1;\n}\n\n.row--fg {\n\
    \  color: #f59e0b;\n  -webkit-mask: linear-gradient(to right, #000 0, var(--p,0%),\
    \ transparent 0);\n  mask: linear-gradient(to right, #000 0, var(--p,0%), transparent\
    \ 0);\n}\n```\n\nLink to the codepen.\n\n### Masked banner silhouette\n\nFinal\
    \ result: Svg covering an image.\n\nShow a background photo only inside a PNG\
    \ silhouette by masking a full-bleed pseudo-element. The content remains normal,\
    \ the art is revealed through the mask.\n\n```html\n<div class=\"banner\">\n \
    \ <div class=\"content\">\n    <h1>Great mask effect</h1>\n  </div>\n</div>\n\
    ```\n\n```css\n.banner {\n  position: relative;\n  height: 100vh;\n}\n\n/* The\
    \ masked artwork lives behind ::before */\n.banner::before {\n  content: \"\"\
    ;\n  position: absolute;\n  inset: 0;\n  z-index: -1;\n  background-image: url(\"\
    img.jpeg\");\n  background-size: cover;\n  background-position: top;\n  /* Key:\
    \ reveal the photo only where PNG is opaque */\n  -webkit-mask: url(img.png);\n\
    \  mask: url(img.png);\n  mask-size: cover;\n  mask-position: center;\n}\n```\n\
    \nLink to the codepen.\n\nℹ️ Browser Compatibility\n- CSS masks (mask, plus -webkit-mask\
    \ for WebKit/Safari): Supported in all modern browsers (~96%).\n- -moz-range-thumb\
    \ & -webkit-slider-thumb: Combined across modern browsers (~92%).\n\n✅ Key Takeaways\n\
    - Use two complementary masks that meet at a shared (--pos) to reveal one layer\
    \ while hiding the other.\n- Keep the control native, it stays accessible and\
    \ gives you a value you can submit immediately.\n- Drive everything from a single\
    \ custom property, your script updates --pos.\n- Masks introduced a creative dimension\
    \ to layout and effects, cutouts that once demanded complex solutions. They give\
    \ you more control over how information is presented.\n\nNext, let’s return to\
    \ usability with form validation.\n\n## CSS-Only Form Validation\n\nModern CSS\
    \ lets you style validation states without nagging users too early. :valid / :invalid\
    \ always reflect validity. The newer :user-valid / :user-invalid only flip after\
    \ the user interacts (typing, blurring, or trying to submit). That means no \"\
    red errors\" on untouched fields, while still updating as the user corrects.\n\
    \nFinal result: A form with validation messages.\n\n### The HTML\n\nWe’ll use\
    \ your exact markup: two inputs (text + email), each followed by a state readout.\
    \ The submit button is a normal type=\"submit\". Pressing it on an untouched field\
    \ also counts as user interaction for the :user-* selectors.\n\n```html\n<form>\n\
    \  <div class=\"field\">\n    <label for=\"input\">Input Text</label>\n    <input\
    \ id=\"input\" required=\"required\" type=\"text\"/>\n    <ul class=\"validation\"\
    \ role=\"list\">\n      <li data-matches=\"valid\">:valid</li>\n      <li data-matches=\"\
    invalid\">:invalid</li>\n      <li data-matches=\"user-valid\">:user-valid</li>\n\
    \      <li data-matches=\"user-invalid\">:user-invalid</li>\n    </ul>\n  </div>\n\
    \n  <div class=\"field\">\n    <label for=\"email\">Input Email</label>\n    <input\
    \ id=\"email\" required=\"required\" type=\"email\" pattern=\"[^@\\s]+@[^@\\s]+\\\
    .[^@\\s]+\"/>\n    <ul class=\"validation\" role=\"list\">\n      <li data-matches=\"\
    valid\">:valid</li>\n      <li data-matches=\"invalid\">:invalid</li>\n      <li\
    \ data-matches=\"user-valid\">:user-valid</li>\n      <li data-matches=\"user-invalid\"\
    >:user-invalid</li>\n    </ul>\n  </div>\n  <div class=\"buttons\">\n    <input\
    \ type=\"submit\" value=\"Submit\"/>\n  </div>\n</form>\n```\n\n\U0001F4A1 Note\
    \ on constraints: the email field uses both type=\"email\" and a pattern. The\
    \ pattern adds an extra rule on top of the built-in email validity. Use it only\
    \ if you truly need stricter formatting.\n\nBase styling and a hidden message\
    \ list\n\nStart by giving inputs a neutral look and hide all messages by default.\
    \ A CSS variable --state-color will be our single source of truth for borders\
    \ and shadows.\n\n```css\n/* messages start hidden */\n.validation[data-matches]\
    \ {\n  display: none;\n}\n\n/* neutral input shell */\ninput {\n  --state-color:\
    \ black; /* default color until a state matches\n```\n"
  mdcn: "\n\n现在区域被分为两半。\n\n## 为滑块设置样式\n\nrange 输入框需要看起来像一个整洁的分割线，而不是原生控件。\n\n首先，我们移除默认样式并隐藏轨道：\n\
    \n```css\n.compare input[type=\"range\"] {\n  z-index: 1;\n  appearance: none;\n\
    \  background: transparent;\n}\n```\n\n此时，滑块仍然有效，但是不可见的。接下来，我们重新定义它的滑块（可拖动部分），使其变成一条垂直条：\n\
    \n```css\n/* 滑块变为垂直分割线 */\n.compare input[type=\"range\"]::-webkit-slider-thumb\
    \ {\n  appearance: none;\n  inline-size: 4px;\n  block-size: 100%;\n  background:\
    \ #000;\n}\n\n.compare input[type=\"range\"]::-moz-range-thumb {\n  appearance:\
    \ none;\n  inline-size: 4px;\n  block-size: 100%;\n  background: #000;\n}\n```\n\
    \n通过这些规则，滑块本身*就是*分割线。拖动它会更新遮罩的位置，因此视觉上感觉就像你正在拉动分离两个面板的线。\n\nℹ️ 浏览器使用不同的范围滑块伪元素。如果你将它们组合在一条规则中，每个浏览器都会看到未知选择器并丢弃整条规则。请编写两条独立的规则，以便每个引擎应用它识别的规则。\n\
    \n## 使用 JavaScript 更新分割线\n\nrange 输入框更新 --pos 变量，两个遮罩都将其作为切分点。一个简单的脚本处理了这一点：\n\
    \n```javascript\nconst range = document.getElementById(\"compare-range\");\nrange.oninput\
    \ = () =>\n  document.body.style.setProperty(\"--pos\", range.value + \"%\");\n\
    ```\n\n滑块每移动一次，--pos 就会发生变化，遮罩会立即重绘，使分割线随之移动。\n\n指向 codepen 的链接。\n\n## 无障碍性\n\n\
    由于滑块是标准的 `<input type=\"range\">`，它已经支持：\n\n- 鼠标和触摸\n- 键盘（方向键、PageUp/PageDown、Home/End）\n\
    - 辅助技术\n\n提供一个可见的标签或 aria-label 来命名该控件。因为填充是通过改变遮罩实现的，而不是移动元素，所以没有额外的动画需要禁用。\n\
    \n## 其他用例\n\n一旦理解了遮罩，你就会开始随处看到它们。这里有两个快速示例。\n\n### 只读的星级评分\n\n最终结果：星级评分。\n\n堆叠两个相同的星级行，并通过百分比驱动的从左到右的遮罩显示顶行。非常适合显示评分。\n\
    \n```html\n<div class=\"stars\" style=\"--p: 70%\">\n  <div class=\"row row--bg\"\
    \ aria-hidden=\"true\">★★★★★</div>\n  <div class=\"row row--fg\" aria-hidden=\"\
    true\">★★★★★</div>\n</div>\n```\n\n```css\n.stars {\n  position: relative;\n \
    \ display: inline-grid;\n}\n\n.stars > * {\n  grid-area: 1/1;\n  font-size: 40px;\n\
    \  letter-spacing: 4px;\n}\n\n.row--bg {\n  color: #cbd5e1;\n}\n\n.row--fg {\n\
    \  color: #f59e0b;\n  -webkit-mask: linear-gradient(to right, #000 0, var(--p,0%),\
    \ transparent 0);\n  mask: linear-gradient(to right, #000 0, var(--p,0%), transparent\
    \ 0);\n}\n```\n\n指向 codepen 的链接。\n\n### 遮罩横幅轮廓\n\n最终结果：覆盖图像的 Svg。\n\n通过遮罩全屏伪元素，只在\
    \ PNG 轮廓内部显示背景照片。内容保持正常，艺术通过遮罩展现。\n\n```html\n<div class=\"banner\">\n  <div class=\"\
    content\">\n    <h1>很棒的遮罩效果</h1>\n  </div>\n</div>\n```\n\n```css\n.banner {\n\
    \  position: relative;\n  height: 100vh;\n}\n\n/* 遮罩后的艺术作品位于 ::before 之后 */\n\
    .banner::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  z-index:\
    \ -1;\n  background-image: url(\"img.jpeg\");\n  background-size: cover;\n  background-position:\
    \ top;\n  /* 关键：仅在 PNG 不透明的地方显示照片 */\n  -webkit-mask: url(img.png);\n  mask: url(img.png);\n\
    \  mask-size: cover;\n  mask-position: center;\n}\n```\n\n指向 codepen 的链接。\n\n\
    ℹ️ 浏览器兼容性\n- CSS masks (mask，以及用于 WebKit/Safari 的 -webkit-mask)：所有现代浏览器均支持 (~96%)。\n\
    - -moz-range-thumb & -webkit-slider-thumb：现代浏览器共同支持 (~92%)。\n\n✅ 核心要点\n- 使用两个共享\
    \ (--pos) 的补充遮罩来显示一个层同时隐藏另一个层。\n- 保持控件原生，它可以保持可访问性并提供你可以立即提交的值。\n- 从单个自定义属性驱动一切，你的脚本更新\
    \ --pos。\n- 遮罩为布局和效果引入了创意维度，解决了曾经需要复杂解决方案的镂空问题。它们让你对信息的呈现方式有更多控制权。\n\n接下来，让我们回到表单验证的可用性。\n\
    \n## 纯 CSS 表单验证\n\n现代 CSS 允许你为验证状态设置样式，而不会过早地骚扰用户：.valid / :invalid 始终反映有效性。较新的\
    \ :user-valid / :user-valid 只在用户交互（输入、失去焦点或尝试提交）后才会翻转。这意味着在未处理的字段上不会出现“红色错误”，但在用户纠正时仍会更新。\n\
    \n最终结果：带有验证消息的表单。\n\n### HTML 部分\n\n我们将使用你完全相同的标记：两个输入框（文本 + 电子邮件），每个后面跟着一个状态读取。提交按钮是普通的\
    \ `type=\"submit\"`。在未处理的字段上按下它也被视为对 `:user-*` 选择器的用户交互。\n\n```html\n<form>\n\
    \  <div class=\"field\">\n    <label for=\"input\">输入文本</label>\n    <input id=\"\
    input\" required=\"required\" type=\"text\"/>\n    <ul class=\"validation\" role=\"\
    list\">\n      <li data-matches=\"valid\">:valid</li>\n      <li data-matches=\"\
    invalid\">:invalid</li>\n      <li data-matches=\"user-valid\">:user-valid</li>\n\
    \      <li data-matches=\"user-invalid\">:user-invalid</li>\n    </ul>\n  </div>\n\
    \n  <div class=\"field\">\n    <label for=\"email\">输入电子邮件</label>\n    <input\
    \ id=\"email\" required=\"required\" type=\"email\" pattern=\"[^@\\s]+@[^@\\s]+\\\
    .[^@\\s]+\"/>\n    <ul class=\"validation\" role=\"list\">\n      <li data-matches=\"\
    valid\">:valid</li>\n      <li data-matches=\"invalid\">:invalid</li>\n      <li\
    \ data-matches=\"user-valid\">:user-valid</li>\n      <li data-matches=\"user-invalid\"\
    >:user-invalid</li>\n    </ul>\n  </div>\n  <div class=\"buttons\">\n    <input\
    \ type=\"submit\" value=\"提交\"/>\n  </div>\n</form>\n```\n\n\U0001F4A1 关于限制的说明：电子邮件字段同时使用了\
    \ `type=\"email\"` 和 `pattern`。`pattern` 在内置的电子邮件有效性基础上增加了一个额外规则。只有在你确实需要更严格的格式时才使用它。\n\
    \n基础样式和隐藏的消息列表\n\n首先给输入框一个中性的外观，并默认隐藏所有消息。CSS 变量 `--state-color` 将是我们边框和阴影的单一事实来源。\n\
    \n```css\n/* 消息默认隐藏 */\n.validation[data-matches] {\n  display: none;\n}\n\n/*\
    \ 中性输入外壳 */\ninput {\n  --state-color: black; /* 直到状态匹配之前的默认颜色 */\n```"
