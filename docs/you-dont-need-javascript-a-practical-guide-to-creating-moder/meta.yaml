- md: "\nHere the parent .card changes only when one of its children has the class\
    \ .active.\n\nThink of :has() as a conditional filter: “apply this rule, but only\
    \ if…”\n\n## Practical Use Cases\n\nLet's examine real-world scenarios where :has()\
    \ simplifies conditional styling therefore eliminating unnecessary JavaScript.\n\
    \n### 1. Styling based on form input\n\nHighlight a fieldset when one of its checkboxes\
    \ is checked.\n\nFinal result: change color of fieldset when input is checked.\n\
    \n```html\n<form>\n  <fieldset>\n    <legend>Select Extras</legend>\n    <label><input\
    \ type=\"checkbox\">Extra Cheese</label>\n  </fieldset>\n</form>\n```\n\nWith\
    \ :has(), the CSS is as direct as the requirement:\n\n```css\nfieldset:has(input[type=\"\
    checkbox\"]:checked) {\n  border-color: green;\n}\n```\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_6_0.png)\n\
    \nNo JavaScript, no extra classes. The parent reacts instantly to its child.\n\
    \nHere’s a Codepen to see the demo.\n\n### 2. Conditional Styles for Navigation\n\
    \nNavigation menus often need to signal when a list item has a submenu. With :has(),\
    \ you can check if a <li> contains a nested <ul> and style its link accordingly:\n\
    \nFinal result: arrow showing when the header has a submenu.\n\n```css\n/* Show\
    \ the arrow only if <li> has <ul> */\n.nav-list > li:has(ul) > a::after {\n  content:\
    \ \">\";\n  transform: rotate(45deg);\n}\n```\n\nThe arrow appears only where\
    \ it makes sense, without any manual markup. \n\nHere’s a Codepen to see the demo.\n\
    \n![](img/3a45eae12017b03ce41b30e896bc70ee_7_0.png)\n\n### 3. Advanced Combinations\n\
    \n:has() doesn’t live in isolation. You can combine it with pseudo-classes to\
    \ create rich conditional effects.\n\nHere’s an “inverted hover” pattern: when\
    \ one card is hovered, all the others blur.\n\nFinal result: hover an element\
    \ blurs everything else\n\n```css\n.cardlist:has(.card:hover).card:not(:hover)\
    \ {\n  filter: blur(4px);\n}\n```\n\nThe parent .cardlist is what enables the\
    \ effect. The :has(.card:hover) part checks if at least one card inside is being\
    \ hovered. Once that condition is true, the selector matches the whole .cardlist.\n\
    \nFrom there, the .card:not(:hover) part comes into play. It says: “inside this\
    \ card list, select all the cards that are not hovered.” Those are the elements\
    \ that get blurred.\n\nThe result is that the hovered card stays sharp, while\
    \ every other card in the list gets blurred.\n\nHere’s a Codepen to see the demo.\n\
    \n### 4. Checking adjacent siblings\n\nBecause :has() can look sideways as well\
    \ as down, you can style an element based on what comes after it. For example,\
    \ only apply a style to <h2> elements that are immediately followed by a paragraph:\n\
    \n![](img/3a45eae12017b03ce41b30e896bc70ee_8_0.png)\n\nFinal result: second title\
    \ is different because it has no paragraph.\n\n```css\nh2:has(+p) {\n  border-bottom:\
    \ 2px solid black;\n  color: #555;\n}\n```\n\nThis lets you keep your headings\
    \ context-aware without littering the HTML with extra classes.\n\nHere’s a Codepen\
    \ to see the demo.\n\n### 5. Changing layouts with a toggle\n\nPerhaps the most\
    \ dramatic effect is flipping layouts entirely with a single state. Imagine a\
    \ list of cards that should switch between a two-column grid and single-column\
    \ list, controlled by a checkbox.\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_9_0.png)\n\
    \nFinal result: Change the display of your content by checking a checkbox.\n\n\
    ```css\n.card-list {\n  display: grid;\n  grid-template-columns: 1fr; /* default:\
    \ single column */\n  gap: 1em;\n  padding: 0;\n  margin: 0;\n}\n\n/* if the checkbox\
    \ with “grid” id is checked, flip to two columns */\nbody:has(#grid:checked).card-list\
    \ {\n  grid-template-columns: 1fr 1fr;\n}\n```\n\nThe trick is that :has() watches\
    \ for the state of the checkbox. When it’s checked, the body matches the rule,\
    \ and the grid definition is swapped. Uncheck it, and the layout collapses back\
    \ to one column.\n\nHere’s a Codepen to see the demo\n\n## Browser Support and\
    \ Fallbacks\n\nBrowser support for :has() is already excellent (over 93% globally),\
    \ but it’s always smart to plan for the edge cases. That’s where @supports comes\
    \ in.\n\nThink of @supports as CSS’s built-in feature detection. Instead of trying\
    \ to guess which browser is being used, you simply ask the browser: “Do you understand\
    \ this feature?” If the answer is yes, the styles inside the block apply. If not,\
    \ they’re ignored.\n\nHere’s a simple example with :has():\n\n```css\n/* Fallback\
    \ styling */\n.feature {\n  opacity: 0.5;\n}\n\n@supports selector(:has(*)) {\n\
    \  .feature:has(.enabled) {\n    opacity: 1;\n  }\n}\n```\n\nIn a modern browser,\
    \ the @supports query succeeds and the enhanced rule kicks in. In an older browser,\
    \ it fails gracefully, and the fallback style remains.\n\nOne last word on performance:\
    \ :has() is powerful, but like any relational selector, it asks the browser to\
    \ do extra work. A rule like article:has(section ul li .active) forces the browser\
    \ to look several levels deep for every article, which can add up on large pages.\
    \ Keeping your conditions simple (for example, article:has(.active)) is both faster\
    \ and easier to maintain.\n\nIn short, use @supports to layer enhancements safely,\
    \ and keep your :has() selectors focused. That way, you get the benefits of modern\
    \ CSS without creating new bottlenecks.\n\n✅ **Key Takeaways**\n\n- :has() dramatically\
    \ reduces JavaScript reliance for conditional styling.\n- Ideal for form interactions,\
    \ navigation, and state-based components.\n- Enhances accessibility and UI.\n\
    - Use carefully to maintain performance.\n\n## II. Dark Mode in CSS\n\nModern\
    \ operating systems let people choose between light and dark themes. The good\
    \ news: you can build a dark mode with very JavaScript. In this chapter, we’ll\
    \ walk through each of the new tools, step by step, and show how to combine them\
    \ into a flexible dark mode that respects system defaults and user choices.\n\n\
    Final result: Darkmode on the left. Lightmode on the right.\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_12_0.png)\n\
    \n### Detecting the System Preference\n\nThe first piece of the puzzle is detecting\
    \ whether the operating system is set to light or dark mode. CSS gives us a built-in\
    \ media feature for this: prefers-color-scheme.\n\n```css\n@media (prefers-color-scheme:\
    \ dark) {\n  :root {\n    --text-color: white;\n    --link-color: deeppink;\n\
    \    --background-color: black;\n  }\n}\n\n@media (prefers-color-scheme: light)\
    \ {\n  :root {\n    --text-color: black;\n    --link-color: green;\n    --background-color:\
    \ white;\n  }\n}\n```\n\nHere’s what’s happening:\n\n- :root is a special selector\
    \ that matches the top-level element of the document (the html> element in HTML\
    \ pages). It’s often used as a central place to define CSS variables.\n- CSS variables\
    \ (technically called custom properties) are the --text-color, --link-color, and\
    \ --background-color you see above. Unlike ordinary CSS properties, these act\
    \ like reusable variables: you define them once and reference them anywhere with\
    \ var(--name).\n\nSo in this example, when the OS is in dark mode, the first block\
    \ runs and sets the variables to light-on-dark colors. When it’s in light mode,\
    \ the second block runs and sets dark-on-light values.\n\nThis means that as soon\
    \ as someone visits your site, the browser applies the right theme automatically.\n"
  mdcn: "\n在这里，父级 .card 仅当其一个子元素拥有 .active 类时才会发生变化。\n\n将 :has() 想象成一个条件过滤器：“应用此规则，但仅当……”\n\
    \n## 实际用例\n\n让我们来看看现实场景，在这些场景中 :has() 如何简化条件样式，从而消除了不必要的 JavaScript。\n\n### 1.\
    \ 基于表单输入进行样式设置\n\n当 fieldset 中的其中一个复选框被勾选时，高亮该 fieldset。\n\n最终结果：当 input 被勾选时，更改\
    \ fieldset 的颜色。\n\n```html\n<form>\n  <fieldset>\n    <legend>选择额外选项</legend>\n\
    \    <label><input type=\"checkbox\">额外芝士</label>\n  </fieldset>\n</form>\n```\n\
    \n使用 :has()，CSS 的写法与需求一样直接：\n\n```css\nfieldset:has(input[type=\"checkbox\"]:checked)\
    \ {\n  border-color: green;\n}\n```\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_6_0.png)\n\
    \n无需 JavaScript，无需额外的类。父元素对其子元素即时响应。\n\n这里有一个 Codepen 可以查看演示。\n\n### 2. 导航的条件样式\n\
    \n导航菜单通常需要指示列表项何时包含子菜单。使用 :has()，你可以检查 <li> 是否包含嵌套的 <ul>，并据此对其链接进行样式设置：\n\n最终结果：当页眉有子菜单时，显示箭头。\n\
    \n```css\n/* 仅当 <li> 拥有 <ul> 时显示箭头 */\n.nav-list > li:has(ul) > a::after {\n \
    \ content: \">\";\n  transform: rotate(45deg);\n}\n```\n\n箭头只出现在有意义的地方，而无需任何手动标记。\n\
    \n这里有一个 Codepen 可以查看演示。\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_7_0.png)\n\
    \n### 3. 高级组合\n\n:has() 并不是孤立存在的。你可以将它与伪类结合起来以创建丰富的条件效果。\n\n这是一个“反向悬停”模式：当一个卡片被悬停时，所有其他卡片都会模糊。\n\
    \n最终结果：悬停一个元素会模糊所有其他元素。\n\n```css\n.cardlist:has(.card:hover).card:not(:hover)\
    \ {\n  filter: blur(4px);\n}\n```\n\n父级 .cardlist 是启用该效果的关键。:has(.card:hover)\
    \ 部分检查内部是否至少有一张卡片正被悬停。一旦该条件成立，选择器就会匹配整个 .cardlist。\n\n从这里开始，.card:not(:hover)\
    \ 部分开始起作用。它说：“在这个卡片列表中，选择所有未被悬停的卡片。”这些就是被模糊的元素。\n\n结果是，被悬停的卡片保持清晰，而列表中的其他每张卡片都会变模糊。\n\
    \n这里有一个 Codepen 可以查看演示。\n\n### 4. 检查相邻兄弟元素\n\n由于 :has() 既可以向侧看也可以向下看，因此你可以根据元素之后的内容对元素进行样式设置。例如，仅对紧跟段落的\
    \ <h2> 元素应用样式：\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_8_0.png)\n\n最终结果：第二个标题是不同的，因为它没有段落。\n\
    \n```css\nh2:has(+p) {\n  border-bottom: 2px solid black;\n  color: #555;\n}\n\
    ```\n\n这让你保持标题的上下文感知能力，而无需在 HTML 中充斥额外的类名。\n\n这里有一个 Codepen 可以查看演示。\n\n### 5.\
    \ 使用切换器更改布局\n\n也许最具戏剧性的效果是通过单个状态完全翻转布局。想象有一个卡片列表，它应该在复选框的控制下切换双列网格和单列列表。\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_9_0.png)\n\
    \n最终结果：通过勾选复选框更改内容的显示。\n\n```css\n.card-list {\n  display: grid;\n  grid-template-columns:\
    \ 1fr; /* 默认：单列 */\n  gap: 1em;\n  padding: 0;\n  margin: 0;\n}\n\n/* 如果 id 为“grid”的复选框被勾选，则切换为两列\
    \ */\nbody:has(#grid:checked).card-list {\n  grid-template-columns: 1fr 1fr;\n\
    }\n```\n\n技巧在于 :has() 监听复选框的状态。当它被勾选时，body 匹配规则，网格定义被切换。取消勾选，布局将收回为单列。\n\n这里有一个\
    \ Codepen 可以查看演示\n\n## 浏览器支持与回退方案\n\n:has() 的浏览器支持已经非常好，但使用 @supports 会更智能。在使用\
    \ :has() 强大时，使用 @supports 来处理增强。\n\n这是一个简单的 :has() 示例：\n\n```css\n/* 回退样式 */\n\
    .feature {\n  opacity: 0.5;\n}\n\n@supports(:has(*)) {\n  .feature:has(.enabled)\
    \ {\n    opacity: 1;\n  }\n}\n```\n\n在现代浏览器中，@supports 查询成功，增强生效。在旧版浏览器中，它失效，回退样式保留。\n\
    \n总之，使用 :has() 减少了对 JavaScript 的依赖。\n\n✅ **核心要点**\n\n- :has() 极大减少了条件样式对 JavaScript\
    \ 的依赖。\n- 适用于表单、导航和基于状态的组件。\n- 增强无障碍体验。\n- 注意性能。\n\n## CSS 中的黑暗模式\n\n现代操作系统允许用户在亮度和黑暗主题之间切换。好消息是：你不需要\
    \ JavaScript 就能构建黑暗模式。在本章中，我们将逐步每一个工具，并展示如何将它们组合成尊重系统设置的灵活黑暗模式。\n\n最终结果：左侧是黑暗模式，右侧是亮色模式。\n\
    \n![](img/3a45eae12017b03ce41b30e896bc70ee_12_0.png)\n\n### 检测系统偏好\n\n谜的第一部分是检测操作系统设置为亮色还是黑暗模式。CSS\
    \ 为我们提供了一个内置的媒体功能来实现：prefers-color-scheme。\n\n```css\n@media (prefers-color-scheme:\
    \ dark) {\n  :root {\n    --text-color: white;\n    --link-color: deeppink;\n\
    \    --background-color: black;\n  }\n}\n\n@media (prefers-color-scheme: light)\
    \ {\n  :root {\n    --text-color: black;\n    --link-color: green;\n    --background-color:\
    \ white;\n  }\n}\n```\n\n这里正在发生什么：\n\n- :root 是一个特殊的选择器，匹配文档的顶层元素（HTML 页面中的 <html>\
    \ 元素）。它通常用作定义 CSS 变量的中心。\n- CSS 变量（技术上称为自定义属性）就是你看到的 --text-color,--link-color\
    \ 和 --background-color。与普通的 CSS 属性不同，这些就像可重用的变量：你定义一次，然后在任何地方通过 var(--name) 引用。\n\
    \n因此在示例中，当系统处于黑暗模式时，第一个块运行并将变量设置为浅色背景黑色。当处于亮色模式时，第二个块运行并设置为深色背景白色值。\n\n这意味着当有人访问你的网站时，浏览器会自动应用正确的主题。\n"
