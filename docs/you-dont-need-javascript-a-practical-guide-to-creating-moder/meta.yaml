    ​


    Step 1: all slides are hidden, no buttons/navigation yet.


    **​**


    **Add pagination dots**


    Turn on a scroll-marker group and generate one marker per slide. The browser


    wires them up like anchors: click a dot → scroll to that slide. Style them as
    you


    like.


    `/* turn on & position the marker group */`​


    `.carousel` `{`​


    `scroll-marker-group``: after;`​


    `anchor-name``: --carousel;`​


    `}`​


    ​


    `.carousel``::scroll-marker-group` `{`​


    `position``: absolute;`​


    `position-anchor``: --carousel;`​


    `top``:` `calc``(anchor(bottom));`​


    ​


    `display``: flex;`​


    `justify-content``: center;`​


    `gap``:` `1em``;`​


    `inset-inline``:` `0``;`​


    `}`​


    ​


    `/* one dot per slide */`​


    `.carousel` `>` `**li**``::scroll-marker` `{`​


    `content``:` `""``;`​


    `inline-size``:` `14px``;`​


    114


    ![](img/3a45eae12017b03ce41b30e896bc70ee_114_0.png)'
  - '[PAGE 115]


    `block-size``:` `14px``;`​


    `border-radius``:` `50%``;`​


    `border``:` `2px` `solid` `#000``;`​


    `background``: transparent;`​


    `color``: green;` `/* drives the "filled" color */`​


    `}`​


    ​


    `.carousel` `>` `**li**``::scroll-marker:target-current` `{`​


    `background``: currentColor;`​


    `}`


    scroll-marker-group is a property you turn on on the scroll container. It


    causes the browser to generate a ::scroll-marker-group box either before


    or after the scroller in the visual and tab order.


    Inside that group, each slide can generate its own ::scroll-marker when you


    set content, activate a marker and the browser scrolls the container to its


    originating slide. The :target-current pseudo-class matches the active


    marker so the “filled” state becomes a one-liner.


    ​


    Final result: navigation is showing and already working.


    **​**


    **Add navigation arrows**


    ::scroll-button() generates real, accessible previous/next buttons inside


    the scroll container when content isn’t none.


    `.carousel``::scroll-button(``*) {`​


    115


    ![](img/3a45eae12017b03ce41b30e896bc70ee_115_0.png)'
  - '[PAGE 116]


    `position``: absolute;`​


    `text-align``: center;`​


    `position-anchor``: --carousel;`​


    ​


    `inline-size``:` `44px``;`​


    `block-size``:` `44px``;`​


    ​


    `border-radius``:` `50%``;`​


    `background``:` `#fff``;`​


    `cursor``: pointer;`​


    `border``:` `2px` `solid` `#000``;`​


    `}`​


    ​


    `.carousel``::scroll-button(left)` `{`​


    `content``:` `"<"``;`​


    `right``:` `calc``(anchor(left) +` `1em``);`​


    `top``:` `calc``(anchor(center));`​


    `}`​


    ​


    `.carousel``::scroll-button(right)` `{`​


    `content``:` `">"``;`​


    `left``:` `calc``(anchor(right) +` `1em``);`​


    `top``:` `calc``(anchor(center));`​


    `}`​


    ​


    `.carousel``::scroll-button(``*)``:disabled` `{`​


    `opacity``:` `0.35``;`​


    `cursor``: default;`​


    `}`


    ::scroll-button() generates real previous/next buttons inside the scroller as


    soon as content isn’t none. The browser wires behavior and disables them at


    the ends, you handle visuals. Anchor positioning keeps them glued to the track


    across breakpoints. The track exposes anchor-name: --carousel, the


    buttons tether with position-anchor: --carousel, and anchor() gives you


    resilient placement.


