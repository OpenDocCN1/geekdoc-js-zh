- md: "\n## The light-dark() Helper Function\n\nWriting both light and dark theme\
    \ values separately can get repetitive. A new CSS function, light-dark(), helps\
    \ streamline this.\n\n```css\n:root {\n  color-scheme: light dark;\n  /* light-dark(lightValue,\
    \ darkValue) picks the correct one */\n  --text-color: light-dark(black, white);\n\
    \  --link-color: light-dark(green, deeppink);\n  --background-color: light-dark(white,\
    \ black);\n}\n```\n\n- The color-scheme property tells the browser your page supports\
    \ both light and dark themes.\n\n- The light-dark(lightValue, darkValue) function\
    \ picks the right value automatically based on the current scheme.\n\nSo if the\
    \ scheme is dark, light-dark(black, white) resolves to white.\n\n\U0001F4A1 Note:\
    \ The light-dark() function is an emerging feature and not yet widely supported\
    \ in all browsers. I will use it in this example for simplicity, but for maximum\
    \ compatibility, you should still rely on prefers-color-scheme media queries mentioned\
    \ previously.\n\n## Adding a User Toggle\n\nSystem detection is great, but some\
    \ users want manual control. For that, we can build a small theme switcher.\n\n\
    Here’s a simple toggle using a <select> element:\n\n```html\n<label for=\"theme-select\"\
    >Theme:</label>\n<select id=\"theme-select\" name=\"color-scheme\">\n  <option\
    \ value=\"system\">System</option>\n  <option value=\"light\">Light</option>\n\
    \  <option value=\"dark\">Dark</option>\n</select>\n```\n\nNow, with the power\
    \ of :has(), we can conditionally set the color-scheme on :root depending on which\
    \ option is checked:\n\n```css\n:root {\n  --text-color: light-dark(black, white);\n\
    \  --link-color: light-dark(green, deeppink);\n  --background-color: light-dark(white,\
    \ black);\n}\n\n/* If the <select> element's value attribute matches, switch schemes\
    \ */\n:root:has(option[value=\"system\"]:checked) {\n  color-scheme: light dark;\n\
    }\n\n:root:has(option[value=\"light\"]:checked) {\n  color-scheme: light;\n}\n\
    \n:root:has(option[value=\"dark\"]:checked) {\n  color-scheme: dark;\n}\n\nbody\
    \ {\n  color: var(--text-color);\n  background-color: var(--background-color);\n\
    }\n\na {\n  color: var(--link-color);\n}\n```\n\nUsers can pick their preferred\
    \ theme from the dropdown, and the page will update instantly once you apply the\
    \ selected value to the html element’s color-scheme property.\n\n## Persisting\
    \ User Choice with localStorage\n\n\U0001F4A1 Note: We’re bending our “no JS”\
    \ rule here with a tiny script. But just a few lines to remember your choice is\
    \ a small price for a flawless experience!\n\nThere’s one last problem: CSS alone\
    \ can’t remember the user’s choice when they reload the page. For persistence,\
    \ we add a tiny bit of JavaScript.\n\n```javascript\ndocument.addEventListener(\"\
    DOMContentLoaded\", () => {\n  const select = document.getElementById(\"theme-select\"\
    );\n\n  // 1. Load the saved theme, or fall back to the system preference\n  select.value\
    \ = localStorage.getItem(\"darkmode\") || \"system\";\n  select.setAttribute(\"\
    value\", select.value);\n\n  // 2. Persist changes and keep CSS toggles in sync\n\
    \  select.onchange = () => {\n    localStorage.setItem(\"darkmode\", select.value);\n\
    \    select.setAttribute(\"value\", select.value);\n  };\n});\n```\n\nWhat this\
    \ does:\n1. On page load, we check localStorage for a saved theme.\n2. If found,\
    \ we set the <select> to that value (or “System” if not).\n3. Whenever the user\
    \ changes the dropdown, we update both the <select> and localStorage.\n\nThis\
    \ keeps the CSS :has() selectors working and ensures the theme is remembered across\
    \ visits.\n\nHere’s a Codepen to see the demo.\n\nℹ️ **Browser Compatibility**\n\
    \n- prefers-color-scheme: Fully supported in all modern browsers with over 95%\
    \ global support.\n- :has(): Fully supported in all modern browsers with over\
    \ 93% global support.\n- light-dark(): Not fully supported with around ~86% browser\
    \ support. Prefer using prefers-color-scheme for now.\n\n✅ **Key Takeaways**\n\
    \n- Detect system preference with the prefers-color-scheme media feature to provide\
    \ automatic theming on first visit.\n- You can use the light-dark() function to\
    \ write concise, inline theme variables. But beware of browser support.\n- Leverage\
    \ CSS variables together with the :has() selector on form controls to switch themes\
    \ without extra script logic.\n- Persist user choice in localStorage so that manual\
    \ theme selections survive reloads and revisits.\n\nNow that your website gracefully\
    \ adapts to user theme preferences, let's enhance another fundamental interaction:\
    \ navigation. Using CSS alone, you'll create smooth scrolling effects that drastically\
    \ improve the user’s browsing experience.\n\n## I.3 - Smooth Scrolling to Sections\n\
    \nOn long pages with multiple sections, anchor links (<a href=\"#section-id\"\
    >) are essential for navigation. By default, clicking one jumps instantly to the\
    \ target. This works, but the abrupt snap can feel jarring. You lose context of\
    \ where you came from, and if your site has a fixed header, the heading you navigated\
    \ to often ends up hidden underneath it.\n\nModern CSS solves this with native\
    \ smooth scrolling and scroll offsets. With just a few properties, you can create\
    \ smooth, accessible navigation without writing a single line of JavaScript.\n\
    \n### Smooth scrolling\n\nThe scroll-behavior property tells the browser how to\
    \ move the viewport when a scroll happens. Either instantly (auto) or smoothly\
    \ (smooth).\n\n```css\nhtml {\n  scroll-behavior: smooth;\n}\n```\n\nOn the html\
    \ element, this makes the whole page scroll smoothly whenever you navigate to\
    \ an anchor (#section-id). By default, browsers keep this behavior consistent\
    \ and safe: if the property isn’t supported, scrolling simply falls back to normal\
    \ jumps, nothing breaks.\n\nTo ensure consistent behavior everywhere, you can\
    \ handle it yourself:\n\n```css\n@media (prefers-reduced-motion) {\n  html {\n\
    \    scroll-behavior: auto;\n  }\n}\n```\n\n### Smooth scrolling in scrollable\
    \ containers\n\nscroll-behavior also works on elements with their own scrollbars.\
    \ This is useful for things like sidebars, chat windows, or code panels.\n\n```css\n\
    .sidebar {\n  overflow-y: auto;\n  scroll-behavior: smooth;\n}\n```\n\nWith this\
    \ in place:\n- If JavaScript scrolls the container (scrollTo() or scrollIntoView()),\
    \ the scroll will animate.\n- If a user tabs through inputs or focusable items\
    \ inside the container, the browser will scroll smoothly to reveal them.\n\nSo,\
    \ setting html { scroll-behavior: smooth; } makes all in-page links scroll smoothly\
    \ across the entire page. But you’re not limited to the page itself. You can also\
    \ enable smooth scrolling inside any scrollable element, like sidebars, chat windows,\
    \ or code panels.\n\n## Handling fixed headers\n\nIf your site uses a fixed header,\
    \ there’s a common problem: the section title gets hidden the header when you\
    \ scroll to it. CSS provides two ways to fix this, depending on how global or\
    \ precise you want to be.\n\n#### Option A - Global offset\n\n```css\nhtml {\n\
    \  scroll-behavior: smooth;\n  scroll-padding-top: 80px; /* match your header's\
    \ height */\n}\n```\n\nThis adds an invisible buffer above every scroll target.\
    \ No matter which section you navigate to, it always leaves 80px of space at the\
    \ top.\n\n#### Option B — Per-element offset\n\n```css\nsection {\n  scroll-margin-top:\
    \ 80px; /* match your header's height */\n}\n```\n\nHere, the offset applies only\
    \ to the elements you choose (for example, specific headings or sections). That\
    \ means:\n- Sections you don’t tag with scroll-margin-top won’t get extra spacing.\n\
    - You can give different elements different offsets, depending on their layout.\n\
    \nThis is handy when some sections require more (or less) space than others.\n"
  mdcn: "\n\n## light-dark() 辅助函数\n\n分别编写浅色和深色主题的值可能会非常重复。一个新的 CSS 函数 `light-dark()`\
    \ 有助于简化这一过程。\n\n```css\n:root {\n  color-scheme: light dark;\n  /* light-dark(浅色值,\
    \ 深色值) 会选择正确的那个 */\n  --text-color: light-dark(black, white);\n  --link-color:\
    \ light-dark(green, deeppink);\n  --background-color: light-dark(white, black);\n\
    }\n```\n\n- `color-scheme` 属性告诉浏览器你的页面同时支持浅色和深色主题。\n\n- `light-dark(lightValue,\
    \ darkValue)` 函数会根据当前的方案自动选择正确的值。\n\n因此，如果方案是深色模式，`light-dark(black, white)` 将解析为\
    \ `white`。\n\n\U0001F4A1 注意：`light-dark()` 函数是一个新兴特性，目前尚未在所有浏览器中广泛支持。为了简单起见，我在示例中使用了它，但为了获得最大的兼容性，你仍然应该依赖之前提到的\
    \ `prefers-color-scheme` 媒体查询。\n\n## 添加用户切换器\n\n系统检测很棒，但有些用户想要手动控制。为此，我们可以构建一个小型的主题切换器。\n\
    \n这是一个使用 `<select>` 元素的简单切换器：\n\n```html\n<label for=\"theme-select\">主题:</label>\n\
    <select id=\"theme-select\" name=\"color-scheme\">\n  <option value=\"system\"\
    >系统</option>\n  <option value=\"light\">浅色</option>\n  <option value=\"dark\"\
    >深色</option>\n</select>\n```\n\n现在，利用 `:has()` 的功能，我们可以根据选中的选项，有条件地在 `:root` 上设置\
    \ `color-scheme`：\n\n```css\n:root {\n  --text-color: light-dark(black, white);\n\
    \  --link-color: light-dark(green, deeppink);\n  --background-color: light-dark(white,\
    \ black);\n}\n\n/* 如果 <select> 元素的 value 属性匹配，则切换方案 */\n:root:has(option[value=\"\
    system\"]:checked) {\n  color-scheme: light dark;\n}\n\n:root:has(option[value=\"\
    light\"]:checked) {\n  color-scheme: light;\n}\n\n:root:has(option[value=\"dark\"\
    ]:checked) {\n  color-scheme: dark;\n}\n\nbody {\n  color: var(--text-color);\n\
    \  background-color: var(--background-color);\n}\n\na {\n  color: var(--link-color);\n\
    }\n```\n\n用户可以从下拉列表中选择他们喜欢的主题，一旦你将选中的值应用到 html 元素的 `color-scheme` 属性，页面将立即更新。\n\
    \n## 使用 localStorage 持久化用户选择\n\n\U0001F4A1 注意：我们在这里打破了不使用 JS 的规则，但为了让用户体验更流畅，这是值得的。如果不进行持久化，用户刷新页面后设置会丢失。我们可以通过一小段\
    \ JavaScript 逻辑来实现：\n\n```javascript\ndocument.addEventListener(\"DOMContentLoaded\"\
    , () => {\n  const select = document.getElementById(\"theme-select\");\n  // 加载用户之前保存的主题\n\
    \  const savedTheme = localStorage.getItem(\"theme\") || \"system\";\n  document.documentElement.setAttribute(\"\
    color-scheme\", savedTheme);\n  select.value = savedTheme;\n\n  // 监听切换事件并保存结果\n\
    \  select.addEventListener(\"change\", (e) => {\n    const theme = e.target.value;\n\
    \    document.documentElement.setAttribute(\"color-scheme\", theme);\n    localStorage.setItem(\"\
    theme\", theme);\n  });\n});\n```\n\n这段代码的作用是：\n1. 在页面加载完成后，首先从 `localStorage`\
    \ 获取用户保存的主题。如果没有，则默认为“system”。\n2. 将该主题设置为根元素的 `color-scheme` 属性，并同步下拉框的值。\n3.\
    \ 监听下拉框的更改事件，当用户切换主题时，更新属性并将主题保存到 `localStorage` 中。\n\n"
