    PART 2 - Modern CSS Power Moves


    In this part we’ll explore components and effects that are a little less common,


    but increasingly visible in modern interfaces: animated borders, mask effects,


    transition between pages, and more. These are the flourishes that give a site
    its


    personality. And we’ll build them the same way as before: semantic, accessible,


    and almost entirely free of JavaScript.


    **II.1** **- Custom Border Animations**


    Animated borders used to require heavy tricks: JavaScript continuously


    redrawing gradients, or SVG filters layered behind content. Today, modern CSS


    gives us all the ingredients natively. With a pseudo-element, a conic gradient,


    and the new @property rule, we can create glowing, rotating borders that feel


    alive.


