    }\n```\n\nThis gives it a lightweight, elevated style. ℹ️ Notice you don’t need\
    \ to mess with position, inset, or margin. Placement is handled by the browser’s\
    \ top-layer system. If you override it, you risk breaking built-in logic.\n\n\
    ### Built-in close control\n\nYou’ll often want the popover to close from inside\
    \ (e.g. a ✕ button). That’s also built-in:\n\n```html\n<div id=\"more\" popover>\n\
