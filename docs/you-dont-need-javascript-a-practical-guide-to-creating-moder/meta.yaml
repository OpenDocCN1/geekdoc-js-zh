    **I.8** **- Other Use-Case of Counter**


    Numbering headings is the most common use of CSS counters, but they can do


    much more. Because counters are dynamic and can be tied to animations, they


    can label, inform, or even simulate behaviors we once thought required


    JavaScript.


    One good example is an animated stat counter. The kind of effect you see in


    dashboards or landing pages, where a number rolls up from 0 to a target value.


    Traditionally this required JavaScript, but with modern CSS we can achieve it


    entirely in styles.


    The effect we’ll build here is a simple speedometer-like counter that climbs from


    0 to 10.​


