  md: '**​**


    **Choosing what animates**


    By default, the whole viewport fades. To take control, assign a transition name
    to


    the part of the page you want to animate:


    `#content` `{`​


    `view-transition-name``: content;`​


    `}`


    Here, the browser takes a snapshot of #content on both pages and links them


    together under the name content. Only elements with the same name across


    both pages are paired up for animation.


    **​**


    **Styling the snapshots**


    The magic happens through two special pseudo-elements:


    `::view-transition-old(content)` `{`​


    `animation``: translate-out` `400ms` `linear both;`​


    `}`


    ​


    `::view-transition-new(content)` `{`​


    `animation``: translate-in` `400ms` `linear both;`​


    `}`


    -​


    ::view-transition-old(content) targets the frozen snapshot of the


    element from the *previous* page.


    -​


    ::view-transition-new(content) targets the snapshot of the


    element on the *next* page.


    In this example, the old content slides out while the new content slides in.


    Remember, if you don’t provide custom animations, the browser defaults to a


    cross-fade.


