  - '[PAGE 106]


    ✅ **Key Takeaways**


    -​


    No more appearance: none, keep the real <select> and style it


    via appearance: base-select and friends.


    -​


    Target the button (the closed state), the arrow (::picker-icon),


    the dropdown (::picker(select)), the selected option


    (:checked), and the checkmark (::checkmark). All with plain CSS.


    -​


    It’s progressive by design: unsupported browsers see a normal


    select, supporting ones get the custom skin with native a11y intact.


    ​


    Styling selects proved that even the most basic form controls can be aligned with


    your design system using modern CSS. It keeps interfaces consistent while


    preserving accessibility.


    Next, let’s explore precision placement with anchors.


    **III.4** **- Anchor Positioning**


    Tooltips, dropdowns, popovers… these UI elements have always been tricky.


    Traditionally you had to measure offsets with JavaScript or rely on positioning


    libraries. Modern CSS now solves this elegantly with anchor positioning.


    With this feature, you can “tether” one element to another: name an anchor (like


    a button) and position another element (like a tooltip) relative to it using the


    anchor() function. No manual math, no DOM measurements, the browser


    does the work, keeps it responsive, and even flips placement when there’s not


    enough space.


