    **Styling the Button Face**


    Once you’ve opted in, the <select> is yours to style. Treat it like any other


    button:


    `**select**` `{`​


    `display``: inline-block;`​


    `border``:` `2px` `solid` `#d1d5db``;`​


    `background``:` `#f3f4f6``;`​


    `padding``: .``5rem` `.``75rem``;`​


    `border-radius``: .``5rem``;`​


    `transition``: background .``25s``;`​


    `}`


    ​


    `**select**``:hover``,`​


    `**select**``:focus` `{`


    `background``:` `#e5e7eb``;`


    `}`


    At this point you have a face that looks and feels like the rest of your UI while
    still


    being a genuine form control. The browser continues to announce it correctly


    and submit its value.


