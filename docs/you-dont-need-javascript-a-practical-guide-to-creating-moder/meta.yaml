    ## I.6 - Pure-CSS Automatic Slider


    Partner-logo strips are everywhere — they signal trust and traction by showing
    who you work with. But look under the hood and most of them are bloated. A single-direction,
    no-controls marquee often ships with an entire slider library, runs jittery setInterval
    code that stutters on low-end devices, and leaves keyboard users unable to pause
    the motion.


    With modern CSS, we can do better. Hardware-accelerated animations let us build
    a smooth, infinite carousel that needs no JavaScript at all. It’s lean, responsive,
    and accessible.


    Final result: an infinite carousel moving from right to left.


    ## The Basic HTML Structure


    The markup is compact: a wrapper <div>, an unordered list of items, and a set
    of inline custom properties that configure the component.


    `<div class="slider" tabindex="0" aria-label="Logo carousel" style="--width:150px;
    --height:150px; --quantity:10; --duration: 10s;">`


    `<ul class="list">

    `<li class="item" style="--position:1"><img src="img1.png" alt="img1"></li>

    `<li class="item" style="--position:2"><img src="img2.png" alt="img2"></li>

    ...

    `</ul>`

    `</div>`


    Each inline property defines the slider’s logic:

    - --width: the size of each card.

    - --quantity: how many items make up one cycle.

    - --duration: how long full loop takes.

    - --position: the item’s place in the sequence.


    By using inline properties, the slider becomes self-contained. You can drop it
    anywhere on a page and configure its size, speed, or number of items.


    ## The Slider Container


    The .slider acts as a viewing window. Its overflow: hidden ensures only the visible
    part of the list is shown. To make the motion feel polished, we also add fading
    at the edges.


    `.slider` {

    `width: 100%;`

    `height: var(--height);`

    `overflow: hidden;`

    `mask-image: linear-gradient(to right, transparent, #000 10% 90%, transparent);`

    }


    The mask-image creates a GPU-accelerated layer that fades out content near the
    edges. If the browser doesn’t support masks, the slider still works — logos will
    just appear abruptly. A more widely supported fallback is use pseudo-elements
    with gradients. That sacrifices a bit of performance but guarantees the same fading
    effect.


    Inside the slider, the .list holds the items in a row:


    `.list {

    `display: flex;`

    `min-width: calc(var(--width) * var(--quantity));`

    `position: relative;`

    }


    Here min-width ensures there’s room for all items, and position: relative sets
    up the coordinate system for absolutely positioned children, which we’ll use in
    a moment.


    ## Animating the Items


    The key to the continuous loop is the .item animation. Each logo card has a fixed
    size, starts off-screen to the right, and moves steadily to the left.


    `.item` {

    `/* 1. Dimensions */`

    `width: var(--width);`

    `height: var(--height);`


    `/* 2. Off-screen start */`

    `position: absolute;`

    `left: 100%;`


    `/* 3. Slide animation */`

    `animation: slide var(--duration) linear infinite;`


    `/* 4. Staggered delay */`

    `animation-delay: calc((var(--duration) / var(--quantity)) * (var(--position)
    - 1) - var(--duration));`

    }


    `/* 5. Animation */`

    `@keyframes slide {

    **from** {

    `left: 100%;`

    }

    **to** {

    `left: -100%;`

    }

    }`

