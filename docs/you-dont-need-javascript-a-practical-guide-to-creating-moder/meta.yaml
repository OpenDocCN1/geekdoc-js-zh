- md: "\nSection title without offset.\n\nSection title with offset.\n\nHere’s a Codepen\
    \ to see the demo.\n\nℹ️ **Browser Compatibility**\n\n- scroll-behavior: smooth:\
    \ Fully supported in all modern browsers with over 94% global support.\n- scroll-padding-top\
    \ & scroll-margin-top: Fully supported in all modern browsers with over 94% global\
    \ support.\n- Browsers who don’t support it just won’t display the animation.\n\
    \n21\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_21_0.png) ![](img/3a45eae12017b03ce41b30e896bc70ee_21_1.png)\n\
    \n✅ **Key Takeaways**\n\n- scroll-behavior: controls *how* scrolling happens,\
    \ works on the page (html) or any scrollable container.\n- scroll-padding-top:\
    \ defines a global “safe space” above all scroll targets.\n- scroll-margin-top:\
    \ defines an offset on a per-element basis.\n- Native CSS scrolling is fast to\
    \ load, easy to maintain, and automatically respects accessibility.\n\nWith your\
    \ page navigation now elegantly handled through CSS, let’s move on to interactive\
    \ UI components. You'll learn how the native HTML <dialog> element simplifies\
    \ modals, delivering robust accessibility with minimal JavaScript.\n\n## I.4 -\
    \ Native Modals with <dialog>\n\nModals are everywhere: login forms, alerts, confirmation\
    \ boxes. They let you display important information without leaving the current\
    \ page. But for years, developers had to re-build them with a lot of JavaScript:\n\
    \n- Toggle visibility,\n- Prevent interaction with the background,\n- Trap keyboard\
    \ focus inside the modal,\n- Close it when pressing Escape.\n\nThat meant dozens\
    \ of lines of code and a lot of accessibility edge cases. The <dialog> element\
    \ changes that. It’s a native HTML element designed for dialogs, with built-in\
    \ support for focus, background blocking, and accessibility. With a little CSS\
    \ and one line of JavaScript, you get a modal that feels professional and reliable.\n\
    \n22\n\nFinal result: dialog opened.\n\n### The Basic HTML Structure\n\nA dialog\
    \ is just another element in your markup. To open it, you need a regular interactive\
    \ element (most often a button) that you’ll connect with a tiny script.\n\n```html\n\
    <button id=\"open-dialog\">Open Dialog</button>\n\n<dialog id=\"modal\" aria-labelledby=\"\
    modal-title\">\n  <h2 id=\"modal-title\">Dialog Title</h2>\n  <p>This is a native\
    \ modal using the HTML `<dialog>` element.</p>\n  <form method=\"dialog\">\n \
    \   <button>Close</button>\n  </form>\n</dialog>\n```\n\nA few important details\
    \ here:\n\n- aria-labelledby=\"modal-title\" links the dialog to its heading for\
    \ screen readers.\n- Any button inside a <form method=\"dialog\"> will automatically\
    \ close the dialog by calling modal.close(). No script needed.\n- When the dialog\
    \ is open, the browser will trap focus inside it and make the background inert\
    \ by default.\n\n23\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_23_0.png)\n\n\
    ### Opening the Dialog with JavaScript\n\nTo open the dialog, all we need is a\
    \ single script:\n\n```javascript\nconst modal = document.getElementById('modal');\n\
    const button = document.getElementById('open-dialog');\n\nbutton.addEventListener('click',\
    \ () => {\n  modal.showModal();\n});\n```\n\nCalling showModal() tells the browser\
    \ to open the <dialog> in “modal mode”. That means interaction with the rest of\
    \ the page is automatically blocked, focus is kept inside the dialog, and pressing\
    \ the Escape key will close it. There’s also a second method, show(), which opens\
    \ the dialog without blocking the background. More like a popover than a modal.\
    \ For most use cases you’ll want showModal().\n\nIf you need to close the dialog\
    \ programmatically, you can call modal.close().\n\n### Animating the Dialog\n\n\
    By default, <dialog> just appears or disappears when opened and closed. To make\
    \ it feel more polished, we can add a simple animation using CSS transitions.\
    \ In this example, the dialog fades and slides into place when it opens:\n\n```css\n\
    dialog {\n  opacity: 0;\n  translate: 0 -25vh;\n  transition: translate 0.6s ease,\
    \ opacity 0.6s ease;\n}\n\ndialog[open] {\n  translate: 0 0;\n  opacity: 1;\n\
    }\n```\n\n24\n\n@starting-style {\n  opacity: 0;\n  translate: 0 -25vh;\n}\n\n\
    When the dialog is open, the browser will trap focus inside it and make the background\
    \ inert by default. (Wait, looking at logic flow: The <dialog> element changes\
    \ that. It’s a native HTML element designed for dialogs, with built-in support\
    \ for focus, background blocking, and accessibility. With a little CSS and one\
    \ line of JavaScript, you get a modal that feels professional and reliable.)\n\
    \n### Styling the Backdrop\n\nEvery dialog comes with a backdrop. It’s a special\
    \ pseudo-element that covers the page. You can style it like any other element:\n\
    \n```css\ndialog::backdrop {\n  background: rgba(0, 0, 0, 0.6);\n}\n```\n\n25\n\
    \n![](img/3a45eae12017b03ce41b30e896bc70ee_25_0.png)\n\nThe @starting-style rule\
    \ defines what the dialog looks like it is open. Browsers that don't support it\
    \ simply fall back to the default state.\n\n26\n\nHaving streamlined modals with\
    \ native capabilities, let’s tackle another common UI pattern: accordions.\n\n\
    ## I.5 - Accordions with Pure CSS\n\nAccordions are ideal for FAQs and optional\
    \ content that you want to keep out of the main flow until needed. They organize\
    \ content dynamically.\n\n### The Basic HTML Structure\n\nWe’ll begin with semantic\
    \ HTML. The core of our accordion uses the <details> and <summary> elements, an\
    \ often-overlooked pair that gives us toggle behavior for free.\n\n```html\n<div\
    \ class=\"accordion\">\n  <details>\n    <summary aria-describedby=\"accordion\"\
    >\n      <span role=\"term\">Accordion title</span>\n    </summary>\n    <div\
    \ class=\"content\">\n      <p class=\"inner\" role=\"definition\" id=\"accordion\"\
    >\n        Lorem ipsum sit amet, consectetur elit...\n      </p>\n    </div>\n\
    \  </details>\n</div>\n```\n\n27\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_27_0.png)\n\
    \n### Hiding the Default Triangle\n\nDefault browser arrows.\n\nBrowsers add a\
    \ default triangle (called a disclosure marker) to <summary>. We remove it so\
    \ we can use our own custom arrow:\n\n```css\nsummary {\n  display: block;\n}\n\
    \nsummary::-webkit-details-marker {\n  display: none;\n}\n```\n\n28\n"
  mdcn: "\n\n无偏移的章节标题。\n\n带偏移的章节标题。\n\n这里有一个 Codepen 可以演示。\n\nℹ️ **浏览器兼容性**\n\n- scroll-behavior:\
    \ smooth: 所有现代浏览器中均完全支持，全球支持率超过 94%。\n- scroll-padding-top & scroll-margin-top:\
    \ 所有现代浏览器中均完全支持，全球支持率超过 94%。\n- 不支持这些的浏览器将不会显示动画。\n\n21\n\n![](img/3a45eae12017b03ce41b30e896bc70ee_21_0.png)\
    \ ![](img/3a45eae12017b03ce41b30e896bc70ee_21_1.png)\n\n✅ **核心要点**\n\n- scroll-behavior:\
