- md: "\n## III.5 - Native CSS Carousels\n\nBrowsers can now generate real carousel\
    \ controls (buttons + markers) that you style, while scroll-snap gives you the\
    \ paginated feel. Ship the snap-only baseline everywhere, then layer the new bits\
    \ as progressive enhancement.\n\nFinal result: a fully functioning carousel.\n\
    \n### The Basic HTML Structure\n\nA plain list becomes a carousel once we add\
    \ CSS.\n\n```html\n<ul class=\"carousel\">\n  <li><h3>Slide 1</h3></li>\n  <li><h3>Slide\
    \ 2</h3></li>\n  <li><h3>Slide 3</h3></li>\n  <li><h3>Slide 4</h3></li>\n</ul>\n\
    ```\n\nShort, semantic markup keeps the fallback great: without the new features,\
    \ users still swipe/scroll a simple horizontal list.\n\n### Lay out the track\n\
    \n```css\n.carousel {\n  display: flex;\n  gap: 4em;\n  padding: 1em;\n  width:\
    \ 800px;\n  height: 500px;\n  margin: auto;\n\n  /* scrolling + pagination */\n\
    \  overflow-x: hidden;\n  scroll-behavior: smooth;\n  scroll-snap-type: x mandatory;\n\
    \  overscroll-behavior-x: contain;\n}\n\n.carousel > li {\n  list-style: none;\n\
    \  flex: 0 0 100%;\n  background: #eee;\n  border: 2px solid #000;\n  scroll-snap-align:\
    \ center;\n\n  /* center the slide content */\n  display: flex;\n  align-items:\
    \ center;\n  justify-content: center;\n}\n```\n\nHere the list becomes a snap\
    \ container (scroll-snap-type: x mandatory) so each gesture lands on a defined\
    \ stop, and each slide declares where it should settle (scroll-snap-align: center).\n\
    \nWe’ve also enabled scroll-behavior: smooth, which gives a gentle glide for programmatic\
    \ navigation (we’ll trigger that with markers and arrows later). overflow-x: hidden\
    \ creates the scroll container without exposing a rail. Users won’t drag the track,\
    \ but the generated controls will still paginate it. If you want both drag and\
    \ controls, swap to overflow-x: scroll.\n\nStep 1: all slides are hidden, no buttons/navigation\
    \ yet.\n\n### Add pagination dots\n\nTurn on a scroll-marker group and generate\
    \ one marker per slide. The browser wires them up like anchors: click a dot →\
    \ scroll to that slide. Style them as you like.\n\n```css\n/* turn on & position\
    \ the marker group */\n.carousel {\n  scroll-marker-group: after;\n  anchor-name:\
    \ --carousel;\n}\n\n.carousel::scroll-marker-group {\n  position: absolute;\n\
    \  position-anchor: --carousel;\n  top: calc(anchor(bottom));\n  display: flex;\n\
    \  justify-content: center;\n  gap: 1em;\n  inset-inline: 0;\n}\n\n/* one dot\
    \ per slide */\n.carousel > li::scroll-marker {\n  content: \"\";\n  inline-size:\
    \ 14px;\n  block-size: 14px;\n  border-radius: 50%;\n  border: 2px solid #000;\n\
    \  background: transparent;\n  color: green; /* drives the \"filled\" color */\n\
    }\n\n.carousel > li::scroll-marker:target-current {\n  background: currentColor;\n\
    }\n```\n\nscroll-marker-group is a property you turn on on the scroll container.\
    \ It causes the browser to generate a ::scroll-marker-group box before or after\
    \ the scroller in visual order. Inside that group, each slide can generate its\
    \ own ::scroll-marker when you set content, activate a marker and the browser\
    \ scrolls the container to its slide. The :target-current-class matches the active\
    \ marker so the “filled” state becomes a one-liner.\n\nFinal result: navigation\
    \ is showing and already working.\n\n### Add navigation arrows\n\n::scroll-button()\
    \ generates real, accessible previous/next buttons inside the scroll container\
    \ when content’t none.\n\n```css\n.carousel::scroll-button(*) {\n  position: absolute;\n\
    \  text-align: center;\n  position-anchor: --carousel;\n  inline-size: 44px;\n\
    \  block-size: 44px;\n  border-radius: 50%;\n  background: #fff;\n  cursor: pointer;\n\
    \  border: 2px solid #000;\n}\n\n.carousel::scroll-button(left) {\n  content:\
    \ \"<\";\n  right: calc(anchor(left) + 1em);\n  top: calc(anchor(center));\n}\n\
    \n.carousel::scroll-button(right) {\n  content: \">\";\n  left: calc(anchor(right)\
    \ + 1em);\n  top: calc(anchor(center));\n}\n\n.carousel::scroll-button(*):disabled\
    \ {\n  opacity: 0.35;\n  cursor: default;\n}\n```\n\n::scroll-button() generates\
    \ real previous/next buttons inside the scroller as soon as content’t none. The\
    \ browser wires behavior and disables them at the ends, you handle visuals. Anchor\
    \ positioning keeps them glued to the track across breakpoints. The track exposes\
    \ anchor-name: --carousel, the buttons tether with position-anchor: --carousel,\
    \ and anchor() gives you resilient placement.\n\nArrows are showing and also working.\
    \ Here’s a Codepen to see the demo.\n\nℹ️ **Browser Compatibility**\n\n- scroll-snap\
    \ has a global browser support of ~95%.\n- ::scroll-button, ::scroll-marker and\
    \ ::scroll-marker-group have a global browser support of ~67%.\n- Gating with\
    \ @supports:\n\n```css\n@supports selector(::scroll-button(*)) and selector(::scroll-marker)\
    \ and selector(::scroll-marker-group) {\n  .carousel {\n    /* your style */\n\
    \  }\n}\n```\n\n✅ **Key Takeaways**\n\n- Start with scroll-snap. It gives you\
    \ pagination for free.\n- Add buttons and markers by generating them in CSS, the\
    \ browser wires up behavior and accessibility.\n- Use anchor positioning so controls\
    \ stay glued to the track as layouts change.\n- Ship as progressive enhancement\
    \ until support broadens. Your carousel is still great without the extras.\n\n\
    ## III.6 - And more to come...\n\nA handful of features are taking shape in specs\
    \ and preview builds that could simplify whole classes of problems. They’re not\
    \ production-ready yet, but they’re worth tracking. Below you’ll find what each\
    \ feature is with a tiny example.\n\n### 1- Native custom functions and mixins\n\
    \nThe CSS Working Group published a Functions & Mixins draft. You can define your\
    \ own functions with @function and return computed values inside CSS. Mixins (rule-level\
    \ reuse) are planned in the same but not yet defined. Try custom functions today\
    \ in experimental builds.\n\n```css\n/* Define a dashed function that multiplies\
    \ spacing */\n@function --space(--n: number) {\n  result: calc(1rem * var(--n));\n\
    }\n\n.card {\n  /* Use the function like other value */\n  padding: --space(1.5);\n\
    }\n\n/* Progressive enhancement: only run where functions parse */\n@supports\
    \ (padding: --space(2)) {\n  .stack > * {\n    margin-block-start: --space(1);\n\
    \  }\n}\n```\n\n### 2- Inline conditionals with if()\n\nif() lets a single property’s\
    \ value vary based on a style query, media query, or feature query, without wrapping\
    \ the whole block in @media/@supports. It’s explicitly marked experimental / limited\
    \ availability on MDN, so treat it as progressive enhancement.\n\n```css\n/* Fallback\
    \ first, then override with if() where supported */\n.card {\n  padding: 1rem;\n\
    }\n\n.card {\n  padding: if (media(width < 700px): .75rem; else: 1.25rem);\n}\n\
    \n/* Feature-query example inside if() */\n.button {\n  color: if (supports(color:\
    \ lch(55% 60 310)): lch(55% 60 310); else: rgb(32 32 32));\n}\n```\n"
  mdcn: "\n\n## III.5 - 原生 CSS 轮图\n\n浏览器现在可以生成真实的轮播控件（按钮 + 标记），你可以对它们进行样式化，而 `scroll-snap`（滚动捕捉）则为你提供了分页感。在任何地方部署仅包含捕捉的基础方案，然后将新特性作为渐进式增强进行叠加。\n\
    \n最终结果：一个功能完整的轮图。\n\n### 基础 HTML 结构\n\n一旦添加了 CSS，普通的列表就变成了轮图。\n\n```html\n<ul\
    \ class=\"carousel\">\n  <<li><h3>幻灯片 1</h3></li>\n  <li><h3>幻灯片 2</h3></li>\n\
    \  <li><h3>幻灯片 3</h3></li>\n  <li><h3>幻灯片 4</h3></li>\n</ul>\n```\n\n```注\n\n\
    简短且具语义化的标记确保了回退方案的优越性：在没有新功能的情况下，用户仍然可以滑动/滚动一个简单的水平列表。\n\n### 布局轨道\n\n```css\n\
    .carousel {\n  display: flex;\n  gap: 4em;\n  padding: 1em;\n  width: 800px;\n\
    \  height: 500px;\n  margin: auto;\n\n  /* 滚动 + 分页 */\n  overflow-x: hidden;\n\
    \  scroll-behavior: smooth;\n  scroll-snap-type: x mandatory;\n  overscroll-behavior-x:\
    \ contain;\n}\n\n.carousel > li {\n  list-style: none;\n  flex: 0 0 100%;\n  background:\
    \ #eee;\n  border: 2px solid #000;\n  scroll-snap-align: center;\n\n  /* 居中幻灯片内容\
    \ */\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\
    ```\n\n在这里，列表变成了捕捉容器（`scroll-snap-type: x mandatory`），因此每个手势都会落在定义的停止点，且每个幻灯片都声明了它应该停留的位置（`scroll-snap-align:\
    \ center`）。\n\n我们还启用了 `scroll-behavior: smooth`，这为程序化导航提供了平滑的滑动效果（稍后我们将通过标记和箭头来触发它）。`overflow-x:\
    \ hidden` 创建了滚动容器但没有暴露滚动轨道。用户无法拖动轨道，但生成的控件仍对其进行分页。如果你既想要拖动又想要控件，请切换到 `overflow-x:\
    \ scroll`。\n\n第 1 步：所有幻灯片均隐藏，暂无按钮/导航。\n\n### 添加分页点\n\n开启滚动标记组（scroll-marker-group）并为每个幻灯片生成一个标记。浏览器像锚点一样将它们连接起来：点击点\
    \ → 滚动到该幻灯片。按你喜欢对其进行样式化。\n\n```css\n/* 开启并定位标记组 */\n.carousel {\n  scroll-marker-group:\
    \ after;\n  anchor-name: --carousel;\n}\n\n.carousel::scroll-marker-group {\n\
    \  position: absolute;\n  position-anchor: --carousel;\n  top: calc(anchor(bottom));\n\
    \  display: flex;\n  justify-content: center;\n  gap: 1em;\n  inset-inline: 0;\n\
    }\n\n/* 每个幻灯片一个点 */\n.carousel > li::scroll-marker {\n  content: \"\";\n  inline-size:\
    \ 14px;\n  block-size: 14px;\n  border-radius: 50%;\n  border: 2px solid #000;\n\
    \  background: transparent;\n  color: green; /* 驱动“填充”颜色 */\n}\n\n.carousel >\
    \ li::scroll-marker:target-current {\n  background: currentColor;\n}\n```\n\n\
    `scroll-marker-group` 是一个在滚动容器上开启的属性。它导致浏览器在视觉顺序的滚动器之前之后生成一个 `::scroll-marker-group`\
    \ 框。在该组内部，当你设置了 `content`、激活标记且浏览器滚动容器到对应幻灯片时，每个幻灯片都可以生成自己的 `::scroll-marker`。`:target-current-class`\
    \ 匹配激活标记，因此“填充”状态变得只需一行代码。\n\n最终结果：导航已显示且已经可以工作。\n\n### 添加导航箭头\n\n当内容不为空时，`::scroll-button()`\
    \ 会在滚动容器内部生成真实的、可辅助的上一个/后一个按钮。\n\n```css\n.carousel::scroll-button(*) {\n  position:\
    \ absolute;\n  text-align: center;\n  position-anchor: --carousel;\n  inline-size:\
    \ 44px;\n  block-size: 44px;\n  border-radius: 50%;\n  background: #fff;\n  cursor:\
    \ pointer;\n  border: 2px solid #000;\n}\n\n.carousel::scroll-button(left) {\n\
    \  content: \"<\";\n  right: calc(anchor(left) + 1em);\n  top: calc(anchor(center));\n\
    }\n\n.carousel::scroll-button(right) {\n  content: \">\";\n  left: calc(anchor(right)\
    \ + 1em);\n  top: calc(anchor(center));\n}\n\n.carousel::scroll-button(*):disabled\
    \ {\n  opacity: 0.35;\n  cursor: default;\n}\n```\n\n一旦内容不为空，`::scroll-button()`\
    \ 就会在滚动器内部生成真实的上一个/后一个按钮。浏览器处理行为并在末端禁用它们，你只需处理视觉部分。锚点定位（Anchor positioning）确保它们在跨断点时始终粘在轨道上。轨道暴露了\
    \ `anchor-name: --carousel`，按钮通过 `position-anchor: --carousel` 绑定，而 `anchor()`\
    \ 提供了稳健的放置位置。\n\n箭头已显示且同样工作。这里有一个 Codepen 可以演示。\n\nℹ️ **浏览器兼容性**\n\n- `scroll-snap`\
    \ 的全局浏览器支持率约为 95%。\n- `::scroll-button`、`::scroll-marker` 和 `::scroll-marker-group`\
    \ 的全局支持率约为 67%。\n- 使用 `@supports` 进行限制：\n\n```css\n@supports selector(::scroll-button(*))\
    \ and selector(::scroll-marker) and selector(::scroll-marker-group) {\n  .carousel\
    \ {\n    /* 样式 */\n  }\n}\n```\n\n✅ **要点总结**\n\n- 从 `scroll-snap` 开始。它免费提供了分页功能。\n\
    - 通过生成添加按钮和标记，浏览器会处理行为。\n- 使用锚点定位让控件在布局变化时保持粘合。\n- 在支持范围扩大前作为渐进式增强发布。你的轮图在没有这些额外功能的情况下依然很好。\n\
    \n## III.6 - 更多后续...\n\n一些特性正在规范和预览版本中成型，可以简化整类问题。它们尚未准备好绪，但值得关注。下面是每个特性的说明及示例。\n\
    \n### 1- 原生自定义函数和 Mixins\n\nCSS 工作组发布了函数与 Mixins 草案。你可以使用 `@function` 定义自定义函数并在\
    \ CSS 内部返回计算值。Mixins（规则复用）也在计划中但尚未定义。你现在可以在实验性版本中使用自定义函数。\n\n```css\n/* 定义一个乘以间距的函数\
    \ */\n@function --space(--n: number) {\n  result: calc(1rem * var(--n));\n}\n\n\
    .card {\n  /* 像其他值一样使用函数 */\n  padding: --space(1.5);\n}\n\n/* 渐进式增强：仅在支持函数运行时\
    \ */\n@supports (padding: --space(2)) {\n  .stack > * {\n    margin-block-start:\
    \ --space(1);\n  }\n}\n```\n\n### 2- 内联条件判断\n\n`if()` 允许单个属性的值根据样式查询、媒体查询或功能查询发生变化，而无需将整个块包裹在\
    \ `@media/@supports` 中。它在 MDN 上被明确标记为实验性/有限可用，因此请将其视为渐进式增强。\n\n```css\n/* 先写回退，然后在支持时使用\
    \ if() 覆盖 */\n.card {\n  padding: 1rem;\n}\n\n.card {\n  padding: if (media(width\
    \ < 700px): .75rem; else: 1.25rem);\n}\n\n/* if() 内部的功能查询示例 */\n.button {\n  color:\
    \ if (supports(color: lch(55% 60 310)): lch(55% 60 310); else: rgb(32 32 32));\n\
    }\n```\n\n"
