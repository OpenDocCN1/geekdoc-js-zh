- md: "# Addison-Wesley’s\n## JavaScript Reference Card\n### Kathleen M. Goelz and\
    \ Carol J. Schwartz, Rutgers University\n\n**Javascript:** A scripting language\
    \ designed to be integrated into HTML code to produce enhanced, dynamic, interactive\
    \ web pages.\n\n## DATA TYPES\n\n*Definition:* The classification of values based\
    \ on the specific categories in which they are stored.\n\n*Primitive Types:* String,\
    \ Boolean, Integer, Floating Point, Null, Void\n\n*Composite Types:* Object, Array,\
    \ Function. Composite data types are in separate sections of the code.\n\n###\
    \ NUMERIC\n\n**Integer:** Positive or negative numbers with no fractional parts\
    \ or decimal places.\n\n**Floating Point:** Positive or negative numbers that\
    \ contain a decimal point or exponential notations.\n\n**String:** A sequence\
    \ of readable characters or text, surrounded by single or double quotes.\n\n**Boolean:**\
    \ The logical values True/False, etc. used to compare data or make decisions.\n\
    \n**Null:** The variable does not have a value; nothing to report. Null is not\
    \ the same as zero, which is a numeric value.\n\n**Casting:** Moving the contents\
    \ of a variable of one type to a variable of a different type. You don't move\
    \ the contents to a different variable; it stays in the same variable but the\
    \ data type is changed or \"re-cast\".\n\n## VARIABLES\n\n*Definition:* A placeholder\
    \ for storing data. In JavaScript, a declaration statement consists of the reserved\
    \ word `var` and the name (identifier) of one or more variables.\n\n*Format:*\n\
    \n```\nvar variable_name\n[var command is used to declare (create) variables]\n\
    ```\n\n*Examples:*\n\n```\nvar myHouseColor\nvar myAddress\nvar vacation_house,\
    \ condominium, primaryResidence\n```\n\n*Rules for Naming Variables:*\n\n1. Variables\
    \ cannot be reserved words.\n2. Variables must begin with a letter or underscore\
    \ and cannot begin with symbols, numbers, or arithmetic notations.\n3. Spaces\
    \ cannot be included in a variable name.\n\n**Hints:**\n\n1. Although variables\
    \ in JavaScript can be used without being declared, it is good programming practice\
    \ to declare (initialize), all variables.\n2. Variable names are case sensitive;\
    \ for example X does not equal x.\n\n## INITIALIZING VARIABLES\n\nUse the declaration\
    \ statement to assign a value to the variable. The value is on the right of the\
    \ equal sign; the variable is on the left.\n\nFormat:\n\n```\nvar variable_name\
    \ = value\n```\n\nExamples:\n\n```\nvar myHouseColor = \"yellow\"\n[literal string\
    \ value yellow assigned to variable myHouseColor]\n\nvar myAddress = 473\n[numeric\
    \ value 473 assigned to variable myAddress]\n\nvar bookTitle = \"Time Capsule\"\
    , cost = 28.95, publisher = \"Tucker Bay\"\n[multiple variables can be assigned\
    \ in one statement]\n```\n\n## DECISION MAKING AND CONTROL STRUCTURES\n\n**Definition:**\
    \ Statements and structures used to change the order in which computer operations\
    \ will occur.\n\n**Types:**\n\nConditional Branching IF, IF-ELSE, IF-ELSE IF,\
    \ SWITCH, WHILE, DO, FOR\n\n## CONDITIONALS\n\nIF Statement: A conditional branching\
    \ statement used to determine whether a stated condition is TRUE.\n\nFormat:\n\
    \n```\nif (condition) {\n    statements if condition is TRUE\n}\n```\n\nExample:\n\
    \n```\nif (score >= 65) {\n    grade = \"Pass\";\n    message = \"Congratulations\"\
    ;\n}\n```\n\nIF-ELSE Statement: A conditional branching statement that includes\
    \ a path to follow if the condition is TRUE and a path to follow if the condition\
    \ is FALSE.\n\nFormat:\n\n```\nif (condition) {\n    statements if condition is\
    \ TRUE;\n} else {\n    statements if condition is FALSE;\n}\n```\n\nExample:\n\
    \n```\nif (score >= 65) {\n    grade = \"Pass\";\n    message = \"Congratulations\"\
    ;\n} else {\n    grade = \"Fail\"\n    message = \"Try again\";\n}\n```\n\nIF-ELSE\
    \ IF Statement: A conditional branching statement that allows for more than two\
    \ possible paths. The first time a true condition is encountered, the statement\
    \ is executed and the remaining conditions will not be tested.\n\nFormat:\n\n\
    ```\nif (condition) {\n    Statements if condition is TRUE;\n} else if (condition)\
    \ {\n    Statements if condition is TRUE;\n} else {\n    Statements if no prior\
    \ condition is true;\n}\n```\n\nExample:\n\n```\nif (score>=90) {\n    grade=\"\
    A\";\n}\nelse if (score>=80) {\n    grade=\"B\";\n}\nelse if (score>=70) {\n \
    \   grade=\"C\";\n}\nelse if (score>=65) {\n    grade=\"D\";\n}\nelse {\n    grade=\"\
    F\";\n}\n```\n\nSWITCH Statement: An alternative to the IF-ELSE IF statement for\
    \ handling multiple options. Compares the expression to the test values to find\
    \ a match.\n\nFormat:\n\n```\nswitch (expression or variable name) {\n    case\
    \ label:\n        statements if expression matches this label;\n        break;\n\
    \    case label:\n        statements if expression matches this label;\n     \
    \   break;\n    default:\n        statements if expression does not match any\
    \ label;\n        break;\n}\n```\n\nExample:\n\n```\nswitch (colorchoice) {\n\
    \    case \"red\":\n        document.bgColor=\"red\";\n        break;\n    case\
    \ \"blue\":\n        document.bgColor=\"blue\";\n        break;\n    default:\n\
    \        document.bgColor=\"white\";\n        break;\n}\n```\n\n## LOOPS\n\nLoops\
    \ cause a segment of code to repeat until a stated condition is met. You can use\
    \ any loop format for any type of code\n\nFOR LOOP:\n\nFormat:\n\n```\nFor (intialize;\
    \ conditional test; increment/decrement) {\n    Statements to execute;\n}\n```\n\
    \nExample:\n\n```\nFor (var i=0; i<=10; i++) {\n    document.write (\"This is\
    \ line \" + i);\n}\n```\n\nDO/WHILE LOOP:\n\nFormat:\n\n```\ndo {\n    Statements\
    \ to execute;\n} while (condition);\n```\n\nExample:\n\n```\nvar i=0;\ndo {\n\
    \    document.write (\"This is line \" + i);\n    i++;\n} while (i <=10);\n```\n\
    \nWHILE LOOP:\n\nFormat:\n\n```\nwhile (condition) {\n    Statements;\n    Increment/decrement;\n\
    }\n```\n\nExample:\n\n```\nvar i = 0;\nwhile (i<=10) {\n    document.write (\"\
    This is line \" + i);\n    i++;\n}\n```\n\nHint: Watch out for infinite loops,\
    \ which do not have a stopping condition or have a stopping condition that will\
    \ never be reached.\n\n## OBJECTS\n\nDefinition: Objects are a composite data\
    \ type which contain properties and methods. JavaScript contains built-in objects\
    \ and allows the user to create custom objects.\n\nCreating Objects: Use the `new`\
    \ constructor\n\n```\nvar X = new Array()\n```\n\nExamples:\ndate, time, math,\
    \ strings, arrays\n\n## ARRAY OBJECT\n\nDefinition: Array object is a variable\
    \ that stores multiple values. Each value is given an index number in the array\
    \ and each value is referred to by the array name and the index number. Arrays,\
    \ like simple variables, can hold any kind of data. You can leave the size blank\
    \ when you create an array. The size of the array will be determined by the number\
    \ of items placed in it.\n\nFormat:\n\n```\nvar arrayname = new Array(size)\n\
    ```\n\nHint: When you create an array, you create a new instance of the array\
    \ object. All properties and methods of the array object are available to your\
    \ new array.\n\nExample:\n\n```\nvar days = new Array (7)\n```\n\nThis creates\
    \ an array of seven elements using the array constructor.\nThe first item is `days[0]`,\
    \ the last item is `days[6]`.\n\n### Initializing Arrays:\n\nArray items can be\
    \ treated as simple variables:\n\n```\ndays[0] = \"Sunday\";\ndays[1] = \"Monday\"\
    ;\netc.\n```\n\n## STRING OBJECT\n\nDefinition: String object is created by assigning\
    \ a string to a variable, or by using the new object constructor.\n\nExample:\n\
    \n```\nvar name = \"Carol\";\nvar name = new String(\"Carol\");\n```\n\nProperties:\n\
    - **Length:** returns the number of characters in the string\n- **Prototype:**\
    \ allows the user to add methods and properties to the string\n\nMethods:\n- String\
    \ formatting methods (similar to HTML formatting tags)\n    - `String.big`\n \
    \   - `String.blink`\n    - `String.italics`\n- Substring methods (allow user\
    \ to find, match, or change patterns of characters in the string)\n    - `indexOf()`\n\
    \    - `charAt()`\n    - `replace()`\n\n## MATH OBJECT\n\nDefinition: Math object\
    \ allows arithmetic calculations not supported by the basic math operators. Math\
    \ is a built-in object that the user does not need to define.\n\nExamples:\n-\
    \ `Math.abs(number)` returns absolute value of the numeric argument\n- `Math.cos(number)`\
    \ returns the cosine of the argument, in radians\n- `Math.round(number)` rounds\
    \ number to the nearest integer\n\n## DATE/TIME OBJECTS\n\nDate object provides\
    \ methods for getting or setting information about the date and time.\nNote: Dates\
    \ before January 1, 1970 are not supported."
  mdcn: "\n# Addison-Wesley公司\n## JavaScript 参考卡片\n### Kathleen M. Goelz 和 Carol J.\
    \ Schwartz，罗格斯大学\n\n**Javascript：** 一种脚本语言，旨在集成到HTML代码中，以创建增强的、动态的、交互式的网页。\n\n\
    ## 数据类型\n\n*定义：* 根据值存储的具体类别对其进行的分类。\n\n*基本类型：* 字符串、布尔值、整数、浮点数、空值、无定义值\n\n*复合类型：*\
    \ 对象、数组、函数。复合数据类型在代码中位于单独的部分。\n\n### 数值型\n\n**整数：** 没有小数部分或小数点的正数或负数。\n\n**浮点数：**\
    \ 包含小数点或科学记数法的正数或负数。\n\n**字符串：** 由单引号或双引号括起来的可读字符或文本序列。\n\n**布尔值：** 用于比较数据或做出决策的逻辑值，例如\
    \ True/False。\n\n**空值：** 变量没有值；没有值可报告。Null与零不同，零是一个数值。\n\n**类型转换：** 将一种类型的变量内容移动到不同类型的变量中。你并非将内容移动到不同的变量；它保持在同一个变量中，但数据类型被改变或“重新转换”。\n\
    \n## 变量\n\n*定义：* 用于存储数据的占位符。在JavaScript中，声明语句由保留字 `var` 和一个或多个变量的名称（标识符）组成。\n\n\
    *格式：*\n\n```\nvar variable_name\n[var 命令用于声明（创建）变量]\n```\n\n*示例：*\n\n```\nvar\
    \ myHouseColor\nvar myAddress\nvar vacation_house, condominium, primaryResidence\n\
    ```\n\n*变量命名规则：*\n\n1. 变量不能是保留字。\n2. 变量必须以字母或下划线开头，不能以符号、数字或算术符号开头。\n3. 变量名中不能包含空格。\n\
    \n**提示：**\n\n1. 虽然JavaScript中的变量可以在未声明的情况下使用，但良好的编程实践是声明（初始化）所有变量。\n2. 变量名区分大小写；例如，X\
    \ 不等于 x。\n\n## 初始化变量\n\n使用声明语句为变量赋值。值在等号的右边；变量在左边。\n\n格式：\n\n```\nvar variable_name\
    \ = value\n```\n\n示例：\n\n```\nvar myHouseColor = \"yellow\"\n[将字符串字面量值 yellow\
    \ 赋值给变量 myHouseColor]\n\nvar myAddress = 473\n[将数值 473 赋值给变量 myAddress]\n\nvar\
    \ bookTitle = \"Time Capsule\", cost = 28.95, publisher = \"Tucker Bay\"\n[可以在一条语句中为多个变量赋值]\n\
    ```\n\n## 决策与控制结构\n\n**定义：** 用于改变计算机操作执行顺序的语句和结构。\n\n**类型：**\n\n条件分支 IF、IF-ELSE、IF-ELSE\
    \ IF、SWITCH、WHILE、DO、FOR\n\n## 条件语句\n\nIF 语句：一种条件分支语句，用于判断指定条件是否为真。\n\n格式：\n\n\
    ```\nif (condition) {\n    条件为真时执行的语句\n}\n```\n\n示例：\n\n```\nif (score >= 65)\
    \ {\n    grade = \"Pass\";\n    message = \"Congratulations\";\n}\n```\n\nIF-ELSE\
    \ 语句：一种条件分支语句，包含条件为真时执行的路径和条件为假时执行的路径。\n\n格式：\n\n```\nif (condition) {\n    条件为真时执行的语句;\n\
    } else {\n    条件为假时执行的语句;\n}\n```\n\n示例：\n\n```\nif (score >= 65) {\n    grade\
    \ = \"Pass\";\n    message = \"Congratulations\";\n} else {\n    grade = \"Fail\"\
    \n    message = \"Try again\";\n}\n```\n\nIF-ELSE IF 语句：一种允许有两个以上可能路径的条件分支语句。当第一次遇到为真的条件时，执行该语句，其余条件将不再被测试。\n\
    \n格式：\n\n```\nif (condition) {\n    条件为真时执行的语句;\n} else if (condition) {\n   \
    \ 条件为真时执行的语句;\n} else {\n    如果没有先前的条件为真，则执行的语句;\n}\n```\n\n示例：\n\n```\nif (score>=90)\
    \ {\n    grade=\"A\";\n}\nelse if (score>=80) {\n    grade=\"B\";\n}\nelse if\
    \ (score>=70) {\n    grade=\"C\";\n}\nelse if (score>=65) {\n    grade=\"D\";\n\
    }\nelse {\n    grade=\"F\";\n}\n```\n\nSWITCH 语句：处理多个选项时，IF-ELSE IF 语句的一种替代方案。将表达式与测试值进行比较以找到匹配项。\n\
    \n格式：\n\n```\nswitch (expression or variable name) {\n    case label:\n      \
    \  如果表达式匹配此标签，则执行的语句;\n        break;\n    case label:\n        如果表达式匹配此标签，则执行的语句;\n\
    \        break;\n    default:\n        如果表达式不匹配任何标签，则执行的语句;\n        break;\n\
    }\n```\n\n示例：\n\n```\nswitch (colorchoice) {\n    case \"red\":\n        document.bgColor=\"\
    red\";\n        break;\n    case \"blue\":\n        document.bgColor=\"blue\"\
    ;\n        break;\n    default:\n        document.bgColor=\"white\";\n       \
    \ break;\n}\n```\n\n## 循环\n\n循环使一段代码重复执行，直到满足指定条件。你可以对任何类型的代码使用任何循环格式。\n\nFOR\
    \ 循环：\n\n格式：\n\n```\nFor (initialization; conditional test; increment/decrement)\
    \ {\n    要执行的语句;\n}\n```\n\n示例：\n\n```\nFor (var i=0; i<=10; i++) {\n    document.write\
    \ (\"This is line \" + i);\n}\n```\n\nDO/WHILE 循环：\n\n格式：\n\n```\ndo {\n    要执行的语句;\n\
    } while (condition);\n```\n\n示例：\n\n```\nvar i=0;\ndo {\n    document.write (\"\
    This is line \" + i);\n    i++;\n} while (i <=10);\n```\n\nWHILE 循环：\n\n格式：\n\n\
    ```\nwhile (condition) {\n    语句;\n    递增/递减;\n}\n```\n\n示例：\n\n```\nvar i = 0;\n\
    while (i<=10) {\n    document.write (\"This is line \" + i);\n    i++;\n}\n```\n\
    \n提示：注意无限循环，它们没有停止条件，或者停止条件永远无法达到。\n\n## 对象\n\n定义：对象是一种复合数据类型，包含属性和方法。JavaScript包含内置对象，并允许用户创建自定义对象。\n\
    \n创建对象：使用 `new` 构造函数\n\n```\nvar X = new Array()\n```\n\n示例：\n日期、时间、数学、字符串、数组\n\
    \n## 数组对象\n\n定义：数组对象是存储多个值的变量。每个值在数组中都有一个索引编号，每个值都通过数组名和索引编号来引用。数组与简单变量一样，可以保存任何类型的数据。在创建数组时，你可以将大小留空。数组的大小将由放置在其中的项目数量决定。\n\
    \n格式：\n\n```\nvar arrayname = new Array(size)\n```\n\n提示：当你创建数组时，你创建了数组对象的一个新实例。数组对象的所有属性和方法都可用于你的新数组。\n\
    \n示例：\n\n```\nvar days = new Array (7)\n```\n\n这使用数组构造函数创建了一个包含七个元素的数组。\n第一个项目是\
    \ `days[0]`，最后一个项目是 `days[6]`。\n\n### 初始化数组：\n\n数组项目可以当作简单变量处理：\n\n```\ndays[0]\
    \ = \"Sunday\";\ndays[1] = \"Monday\";\n等等。\n```\n\n## 字符串对象\n\n定义：字符串对象通过将字符串赋值给变量来创建，或者使用新的对象构造函数来创建。\n\
    \n示例：\n\n```\nvar name = \"Carol\";\nvar name = new String(\"Carol\");\n```\n\n\
    属性：\n- **长度：** 返回字符串中的字符数\n- **原型：** 允许用户为字符串添加方法和属性\n\n方法：\n- 字符串格式化方法（类似于HTML格式化标签）\n\
    \    - `String.big`\n    - `String.blink`\n    - `String.italics`\n- 子字符串方法（允许用户查找、匹配或更改字符串中的字符模式）\n\
    \    - `indexOf()`\n    - `charAt()`\n    - `replace()`\n\n## 数学对象\n\n定义：数学对象允许进行基本算术运算符不支持的算术计算。Math是一个内置对象，用户不需要定义。\n\
    \n示例：\n- `Math.abs(number)` 返回数值参数的绝对值\n- `Math.cos(number)` 返回参数的余弦值，以弧度为单位\n\
    - `Math.round(number)` 将数字四舍五入到最接近的整数\n\n## 日期/时间对象\n\n日期对象提供用于获取或设置日期和时间信息的方法。\n\
    注意：不支持1970年1月1日之前的日期。\n"
