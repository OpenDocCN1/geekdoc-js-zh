    \ options. Compares the expression to the test values to find a match.\n\nFormat:\n\
    \n```\nswitch (expression or variable name) {\n    case label:\n        statements\
    \ if expression matches this label;\n        break;\n    case label:\n       \
    \ statements if expression matches this label;\n        break;\n    default:\n\
    \        statements if expression does not match any label;\n        break;\n\
    }\n```\n\nExample:\n\n```\nswitch (colorchoice) {\n    case \"red\":\n       \
    \ document.bgColor=\"red\";\n        break;\n    case \"blue\":\n        document.bgColor=\"\
    blue\";\n        break;\n    default:\n        document.bgColor=\"white\";\n \
    \       break;\n}\n```\n\n# LOOPS\n\nLoops cause a segment of code to repeat until\
    \ a stated condition is met. You can use any loop format for any type of code\n\
    \nFOR LOOP:\n\nFormat:\n\n```\nFor (intialize; conditional test; increment/decrement)\
    \ {\n    Statements to execute;\n}\n```\n\nExample:\n\n```\nFor (var i=0; i<=10;\
    \ i++) {\n    document.write (\"This is line \" + i);\n}\n```\n\nDO/WHILE LOOP:\n\
    \nFormat:\n\n```\ndo {\n    Statements to execute;\n} while (condition);\n```\n\
    \nExample:\n\n```\nvar i=0;\ndo {\n    document.write (\"This is line \" + i);\n\
    \    i++;\n} while (i <=10);\n```"
  - "[PAGE 3]\n\n# WHILE LOOP:\n\nFormat:\n`while (condition) {`\n    `Statements;`\n\
    \    `Increment/decrement;`\n`}`\n\nExample:\n`var i = 0;`\n`while (i<=10) {`\n\
    \    `document.write (\"This is line \" + i);`\n    `i++;`\n`}`\n\nHint: Watch\
    \ out for infinite loops, which do not have a stopping condition or have a stopping\
    \ condition that will never be reached.\n\n# OBJECTS\n\nDefinition: Objects are\
    \ a composite data type which contain properties and methods. JavaScript contains\
    \ built-in objects and allows the user to create custom objects.\n\nCreating Objects:\
    \ Use the `new` constructor\n`var X = new Array()`\n\nExamples:\ndate, time, math,\
    \ strings, arrays\n\n# ARRAY OBJECT\n\nDefinition: Array object is a variable\
    \ that stores multiple values. Each value is given an index number in the array\
    \ and each value is referred to by the array name and the index number. Arrays,\
    \ like simple variables, can hold any kind of data. You can leave the size blank\
    \ when you create an array. The size of the array will be determined by the number\
    \ of items placed in it.\n\nFormat:\n`var arrayname = new Array(size)`\n\nHint:\
    \ When you create an array, you create a new instance of the array object. All\
    \ properties and methods of the array object are available to your new array.\n\
    \nExample:\n`var days = new Array (7)`\nThis creates an array of seven elements\
    \ using the array constructor.\nThe first item is `days[0]`, the last item is\
    \ `days[6]`.\n\n# Initializing Arrays:\n\nArray items can be treated as simple\
    \ variables:\n`days[0] = \"Sunday\";`\n`days[1] = \"Monday\";`\netc.\n\n# STRING\
    \ OBJECT\n\nDefinition: String object is created by assigning a string to a variable,\
    \ or by using the new object constructor.\n\nExample:\n`var name = \"Carol\";`\n\
    `var name = new String(\"Carol\");`\n\nProperties:\n**Length:** returns the number\
    \ of characters in the string\n**Prototype:** allows the user to add methods and\
    \ properties to the string\n\nMethods:\nString formatting methods (similar to\
    \ HTML formatting tags)\n`String.big`\n`String.blink`\n`String.italics`\n\nSubstring\
    \ methods (allow user to find, match, or change patterns of characters in the\
    \ string)\n`indexOf()`\n`charAt()`\n`replace()`\n\n# MATH OBJECT\n\nDefinition:\
    \ Math object allows arithmetic calculations not supported by the basic math operators.\
    \ Math is a built-in object that the user does not need to define.\n\nExamples:\n\
    `Math.abs(number)` returns absolute value of the numeric argument\n`Math.cos(number)`\
    \ returns the cosine of the argument, in radians\n`Math.round(number)` rounds\
    \ number to the nearest integer\n\n# DATE/TIME OBJECTS\n\nDate object provides\
    \ methods for getting or setting information about the date and time.\nNote: Dates\
    \ before January 1, 1970 are not supported."
- md: "## FUNCTIONS\n\n*Definition:* A pre-written block of code that performs a specific\
    \ task. Some functions return values; others perform a task like sorting, but\
    \ return no value. Function names follow the same rules as variables names. There\
    \ may or may not be an argument or parameter in the parenthesis, but the parenthesis\
    \ has to be there.\n\n**User-defined Functions:**\n\n*Example:*\n\n`parseInt()`\
    \ or `parseFloat()` convert a string to a number.\n\nTo create a function:\n\n\
    Format:\n\n```\nfunction name_of_function (arguments) {\n    statements to execute\
    \ when\n    function is called;\n}\n```\n\nExample:\n\n```\nfunction kilosToPounds\
    \ (){\n    pounds=kilos*2.2046;\n}\n```\n\nThis new function takes the value of\
    \ the variable kilos, multiplies it by 2.2046, and assigns the result to the variable\
    \ pounds.\n\nTo call a *function*: Give the name of the function followed by its\
    \ arguments, if any\n\n`parseInt(X)`; converts the data stored in the variable\
    \ X into a numeric value.\n\n`kilosToPounds(17)`; converts 17 kilos to the same\
    \ mass in pounds, returning the value 37.4782.\n\n## PUTTING IT TOGETHER: JAVASCRIPT\
    \ AND HTML ON THE WEB\n\n**Cookies:** Text-file messages stored by the browser\
    \ on the user's computer\n\n*Purpose:* To identify the user, store preferences,\
    \ and present customized information each time the user visits the page\n\n*Types:*\n\
    \n*Temporary* (transient, session) — stored in temporary memory and available\
    \ only during active browser session\n\n*Persistent* (permanent, stored) — remain\
    \ on user's computer until deleted or expired\n\n**Browser Detection:** A script\
    \ written to determine which browser is running; determine if the browser has\
    \ the capabilities to load the webpage and support the javascript code; and, if\
    \ needed, load alternate javascript code to match the browser and platform.\n\n\
    **Sniffing:** A script written to determine whether a specific browser feature\
    \ is present; i.e., detecting the presence of Flash before loading a webpage.\n\
    \n**Event Handling:** Use HTML event attributes (mouseover, mouse click, etc.)\
    \ and connect event to a JavaScript function called an event handler\n\n## METHODS\n\
    \n*Definition:* A special kind of function used to describe or instruct the way\
    \ the object behaves. Each object type in JavaScript has associated methods available.\n\
    \n*Examples:*\n\n```\narray.sort();\ndocument.write();\nstring.length();\n```\n\
    \n**Calling:** To call or use a method, state the method name followed by its\
    \ parameters in parentheses.\n\n*Example:*\n\n```\ndocument.write(\"Hello, world!\"\
    );\n```\n\n## OPERATORS\n\n### ARITHMETIC\n\n| Symbol | Name | Description |\n\
    | :--- | :--- | :--- |\n| + | addition | adds two numbers |\n| - | subtraction\
    \ | subtracts one number from another |\n| * | multiplication | multiplies two\
    \ numbers |\n| / | division | divides one number by another |\n| % | modulus |\
    \ returns the integer remainder after dividing two numbers |\n| ++ | increment\
    \ | adds one to a numeric variable |\n| -- | decrement | subtracts one from a\
    \ numeric variable |\n\n### STRING\n\n| Symbol | Name | Description |\n| :---\
    \ | :--- | :--- |\n| + | concatenation | concatenates or joins two strings or\
    \ other elements |\n| += | concatenation/assignment | concatenates two string\
    \ variables and assigns the result to the first variable |\n\n### LOGICAL\n\n\
    | Symbol | Name | Description |\n| :--- | :--- | :--- |\n| && | logical AND |\
    \ Compares two operands; returns true if both are true, otherwise returns false\
    \ |\n| || | logical OR | Compares two operands; returns true if either operand\
    \ is true, otherwise returns false |\n| ! | logical NOT | Returns false if its\
    \ operand can be converted to true, otherwise returns false |\n\n### COMPARISON\n\
    \n| Symbol | Description |\n| :--- | :--- |\n| == | Returns true if the operands\
    \ are equal |\n| != | Returns true if the operands are not equal |\n| === | Returns\
    \ true if the operands are equal and the same data type |\n| !== | Returns true\
    \ if the operands are not equal and/or not the same data type |\n| > | Returns\
    \ true if the first operand is greater than the second |\n| >= | Returns true\
    \ if the first operand is greater than or equal to the second |\n| < | Returns\
    \ true if the first operand is less than the second |\n| <= | Returns true if\
    \ the first operand is less than or equal to the second |\n\n### ASSIGNMENT\n\n\
    | Symbol | Description |\n| :--- | :--- |\n| = | Assigns the value of the second\
    \ operand to the first operand |\n| += | Adds two numeric operands and assigns\
    \ the result to the first operand |\n| -= | Subtracts the second operand from\
    \ the first, and assigns the result to the first |\n| *= | Multiplies two operands,\
    \ assigns the result to the first |\n| /= | Divides the first operand by the second,\
    \ assigns the result to the first |\n| %= | Finds the modulus of two numeric operands,\
    \ and assigns the result to the first |\n\n### RESERVED WORDS\n\n| Word | Word\
    \ | Word | Word |\n| :--- | :--- | :--- | :--- |\n| abstract | else | instanceof\
    \ | switch |\n| boolean | enum | int | synchronized |\n| break | export | interface\
    \ | this |\n| byte | extends | long | throw |\n| case | false | native | throws\
    \ |\n| catch | final | new | transient |\n| char | finally | null | true |\n|\
    \ class | float | package | try |\n| const | for | private | typeof |\n| continue\
    \ | function | protected | var |\n| debugger | goto | public | void |\n| default\
    \ | if | return | volatile |\n| delete | implements | short | while |\n| do |\
    \ import | static | with |\n| double | in | super | |"
  mdcn: "\n## 函数\n\n*定义：* 一个预编写的代码块，用于执行特定任务。有些函数会返回值；其他函数则执行排序等任务，但不返回值。函数名遵循与变量名相同的规则。括号中可以有参数，也可以没有，但括号必须存在。\n\
    \n**用户自定义函数：**\n\n*示例：*\n\n`parseInt()` 或 `parseFloat()` 将字符串转换为数字。\n\n创建一个函数：\n\
    \n格式：\n\n```\nfunction 函数名 (参数) {\n    函数被调用时\n    要执行的语句;\n}\n```\n\n示例：\n\n\
    ```\nfunction kilosToPounds (){\n    pounds=kilos*2.2046;\n}\n```\n\n这个新函数获取变量\
    \ `kilos` 的值，乘以 2.2046，然后将结果赋值给变量 `pounds`。\n\n调用一个 *函数*：给出函数名，后面跟上参数（如果有的话）\n\
    \n`parseInt(X)`；将变量 `X` 中存储的数据转换为数值。\n\n`kilosToPounds(17)`；将 17 公斤转换为相同质量的磅数，返回值\
    \ 37.4782。\n\n## 综合应用：网络中的 JavaScript 与 HTML\n\n**Cookies：** 浏览器在用户计算机上存储的文本文件消息\n\
    \n*目的：* 识别用户、存储偏好设置，并在用户每次访问页面时呈现定制化信息\n\n*类型：*\n\n*临时*（临时的、会话）— 存储在临时内存中，仅在浏览器会话期间可用\n\
    \n*持久*（永久的、存储的）— 保留在用户计算机上，直到被删除或过期\n\n**浏览器检测：** 一个脚本，用于确定正在运行的是哪个浏览器；确定浏览器是否有能力加载网页并支持\
    \ JavaScript 代码；以及在需要时，加载备用的 JavaScript 代码以匹配浏览器和平台。\n\n**嗅探：** 一个脚本，用于确定是否存在特定的浏览器功能；例如，在加载网页前检测\
    \ Flash 的存在。\n\n**事件处理：** 使用 HTML 事件属性（鼠标悬停、鼠标点击等）并将事件连接到一个称为事件处理器的 JavaScript\
    \ 函数\n\n## 方法\n\n*定义：* 一种特殊类型的函数，用于描述或指示对象的行为方式。JavaScript 中的每种对象类型都有相关的方法可供使用。\n\
    \n*示例：*\n\n```\narray.sort();\ndocument.write();\nstring.length();\n```\n\n**调用：**\
    \ 要调用或使用一个方法，请说明方法名，后跟括号中的参数。\n\n*示例：*\n\n```\ndocument.write(\"Hello, world!\"\
    );\n```\n\n## 运算符\n\n### 算术运算符\n\n| 符号 | 名称 | 描述 |\n| :--- | :--- | :--- |\n|\
    \ + | 加法 | 两个数字相加 |\n| - | 减法 | 从一个数字中减去另一个数字 |\n| * | 乘法 | 两个数字相乘 |\n| / | 除法\
    \ | 一个数字除以另一个数字 |\n| % | 取模 | 返回两个数字相除后的整数余数 |\n| ++ | 自增 | 数值变量加一 |\n| -- | 自减\
    \ | 数值变量减一 |\n\n### 字符串运算符\n\n| 符号 | 名称 | 描述 |\n| :--- | :--- | :--- |\n| + |\
    \ 连接 | 连接或连接两个字符串或其他元素 |\n| += | 连接/赋值 | 连接两个字符串变量并将结果赋值给第一个变量 |\n\n### 逻辑运算符\n\
    \n| 符号 | 名称 | 描述 |\n| :--- | :--- | :--- |\n| && | 逻辑与 | 比较两个操作数；如果两者都为 true，则返回\
    \ true，否则返回 false |\n| \\|\\| | 逻辑或 | 比较两个操作数；如果任一操作数为 true，则返回 true，否则返回 false\
    \ |\n| ! | 逻辑非 | 如果其操作数可以转换为 true，则返回 false，否则返回 false |\n\n### 比较运算符\n\n| 符号\
    \ | 描述 |\n| :--- | :--- |\n| == | 如果操作数相等，则返回 true |\n| != | 如果操作数不相等，则返回 true\
    \ |\n| === | 如果操作数相等且数据类型相同，则返回 true |\n| !== | 如果操作数不相等和/或数据类型不同，则返回 true |\n\
    | > | 如果第一个操作数大于第二个，则返回 true |\n| >= | 如果第一个操作数大于或等于第二个，则返回 true |\n| < | 如果第一个操作数小于第二个，则返回\
    \ true |\n| <= | 如果第一个操作数小于或等于第二个，则返回 true |\n\n### 赋值运算符\n\n| 符号 | 描述 |\n| :---\
    \ | :--- |\n| = | 将第二个操作数的值赋给第一个操作数 |\n| += | 两个数值操作数相加，并将结果赋值给第一个操作数 |\n| -=\
    \ | 从第一个操作数中减去第二个操作数，并将结果赋值给第一个 |\n| *= | 两个操作数相乘，并将结果赋值给第一个 |\n| /= | 第一个操作数除以第二个操作数，并将结果赋值给第一个\
    \ |\n| %= | 计算两个数值操作数的模，并将结果赋值给第一个 |\n\n### 保留字\n\n| 字 | 字 | 字 | 字 |\n| :--- |\
    \ :--- | :--- | :--- |\n| abstract | else | instanceof | switch |\n| boolean |\
    \ enum | int | synchronized |\n| break | export | interface | this |\n| byte |\
    \ extends | long | throw |\n| case | false | native | throws |\n| catch | final\
    \ | new | transient |\n| char | finally | null | true |\n| class | float | package\
    \ | try |\n| const | for | private | typeof |\n| continue | function | protected\
    \ | var |\n| debugger | goto | public | void |\n| default | if | return | volatile\
    \ |\n| delete | implements | short | while |\n| do | import | static | with |\n\
    | double | in | super | |\n"
