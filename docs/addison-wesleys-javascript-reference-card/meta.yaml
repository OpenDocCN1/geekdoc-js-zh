  md: "# FUNCTIONS\n\n*Definition:* A pre-written block of code that performs a specific\
    \ task. Some functions return values; others perform a task like sorting, but\
    \ return no value. Function names follow the same rules as variables names. There\
    \ may or may not be an argument or parameter in the parenthesis, but the parenthesis\
    \ has to be there.\n\n**User-defined Functions:**\n\n*Example:*\n\n`parseInt()`\
    \ or `parseFloat()` convert a string to a number.\n\nTo create a function:\n\n\
    Format:\n\n```\nfunction name_of_function (arguments) {\n    statements to execute\
    \ when\n    function is called;\n}\n```\n\nExample:\n\n```\nfunction kilosToPounds\
    \ (){\n    pounds=kilos*2.2046;\n}\n```\n\nThis new function takes the value of\
    \ the variable kilos, multiplies it by 2.2046, and assigns the result to the variable\
    \ pounds.\n\nTo call a *function*: Give the name of the function followed by its\
    \ arguments, if any\n\n`parseInt(X)`; converts the data stored in the variable\
    \ X into a numeric value.\n\n`kilosToPounds(17)`; converts 17 kilos to the same\
    \ mass in pounds, returning the value 37.4782.\n\n# PUTTING IT TOGETHER: JAVASCRIPT\
    \ AND HTML ON THE WEB\n\n**Cookies:** Text-file messages stored by the browser\
    \ on the user's computer\n\n*Purpose:* To identify the user, store preferences,\
    \ and present customized information each time the user visits the page\n\n*Types:*\n\
    \n*Temporary* (transient, session) — stored in temporary memory and available\
    \ only during active browser session\n\n*Persistent* (permanent, stored) — remain\
    \ on user's computer until deleted or expired\n\n**Browser Detection:** A script\
    \ written to determine which browser is running; determine if the browser has\
    \ the capabilities to load the webpage and support the javascript code; and, if\
    \ needed, load alternate javascript code to match the browser and platform.\n\n\
    **Sniffing:** A script written to determine whether a specific browser feature\
    \ is present; i.e., detecting the presence of Flash before loading a webpage.\n\
    \n**Event Handling:** Use HTML event attributes (mouseover, mouse click, etc.)\
    \ and connect event to a JavaScript function called an event handler\n\n# METHODS\n\
    \n*Definition:* A special kind of function used to describe or instruct the way\
    \ the object behaves. Each object type in JavaScript has associated methods available.\n\
    \n*Examples:*\n\n```\narray.sort();\ndocument.write();\nstring.length();\n```\n\
    \n**Calling:** To call or use a method, state the method name followed by its\
    \ parameters in parentheses.\n\n*Example:*\n\n```\ndocument.write(\"Hello, world!\"\
    );\n```"
  merge: -1
  pgno: 4
