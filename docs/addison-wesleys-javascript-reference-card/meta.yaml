  md: "# # INITIALIZING VARIABLES\n\nUse the declaration statement to assign a value\
    \ to the variable. The value is on the right of the equal sign; the variable is\
    \ on the left.\n\nFormat:\n\n```\nvar variable_name = value\n```\n\nExamples:\n\
    \n```\nvar myHouseColor = \"yellow\"\n[literal string value yellow assigned to\
    \ variable myHouseColor]\n\nvar myAddress = 473\n[numeric value 473 assigned to\
    \ variable myAddress]\n\nvar bookTitle = \"Time Capsule\", cost = 28.95, publisher\
    \ = \"Tucker Bay\"\n[multiple variables can be assigned in one statement]\n```\n\
    \n# # DECISION MAKING AND CONTROL STRUCTURES\n\n**Definition:** Statements and\
    \ structures used to change the order in which computer operations will occur.\n\
    \n**Types:**\n\nConditional Branching IF, IF-ELSE, IF-ELSE IF, SWITCH, WHILE,\
    \ DO, FOR\n\n# # CONDITIONALS\n\nIF Statement: A conditional branching statement\
    \ used to determine whether a stated condition is TRUE.\n\nFormat:\n\n```\nif\
    \ (condition) {\n    statements if condition is TRUE\n}\n```\n\nExample:\n\n```\n\
    if (score >= 65) {\n    grade = \"Pass\";\n    message = \"Congratulations\";\n\
    }\n```\n\nIF-ELSE Statement: A conditional branching statement that includes a\
    \ path to follow if the condition is TRUE and a path to follow if the condition\
    \ is FALSE.\n\nFormat:\n\n```\nif (condition) {\n    statements if condition is\
    \ TRUE;\n} else {\n    statements if condition is FALSE;\n}\n```\n\nExample:\n\
    \n```\nif (score >= 65) {\n    grade = \"Pass\";\n    message = \"Congratulations\"\
    ;\n} else {\n    grade = \"Fail\"\n    message = \"Try again\";\n}\n```\n\nIF-ELSE\
    \ IF Statement: A conditional branching statement that allows for more than two\
    \ possible paths. The first time a true condition is encountered, the statement\
    \ is executed and the remaining conditions will not be tested.\n\nFormat:\n\n\
    ```\nif (condition) {\n    Statements if condition is TRUE;\n} else if (condition)\
    \ {\n    Statements if condition is TRUE;\n} else {\n    Statements if no prior\
    \ condition is true;\n}\n```"
  merge: -1
  pgno: 1
- img_proc: true
  md: "Example:\n\n```\nif (score>=90) {\n    grade=\"A\";\n}\nelse if (score>=80)\
    \ {\n    grade=\"B\";\n}\nelse if (score>=70) {\n    grade=\"C\";\n}\nelse if\
    \ (score>=65) {\n    grade=\"D\";\n}\nelse {\n    grade=\"F\";\n}\n```\n\nSWITCH\
    \ Statement: An alternative to the IF-ELSE IF statement for handling multiple\
    \ options. Compares the expression to the test values to find a match.\n\nFormat:\n\
    \n```\nswitch (expression or variable name) {\n    case label:\n        statements\
    \ if expression matches this label;\n        break;\n    case label:\n       \
    \ statements if expression matches this label;\n        break;\n    default:\n\
    \        statements if expression does not match any label;\n        break;\n\
    }\n```\n\nExample:\n\n```\nswitch (colorchoice) {\n    case \"red\":\n       \
    \ document.bgColor=\"red\";\n        break;\n    case \"blue\":\n        document.bgColor=\"\
    blue\";\n        break;\n    default:\n        document.bgColor=\"white\";\n \
    \       break;\n}\n```\n\n# LOOPS\n\nLoops cause a segment of code to repeat until\
    \ a stated condition is met. You can use any loop format for any type of code\n\
    \nFOR LOOP:\n\nFormat:\n\n```\nFor (intialize; conditional test; increment/decrement)\
    \ {\n    Statements to execute;\n}\n```\n\nExample:\n\n```\nFor (var i=0; i<=10;\
    \ i++) {\n    document.write (\"This is line \" + i);\n}\n```\n\nDO/WHILE LOOP:\n\
    \nFormat:\n\n```\ndo {\n    Statements to execute;\n} while (condition);\n```\n\
    \nExample:\n\n```\nvar i=0;\ndo {\n    document.write (\"This is line \" + i);\n\
    \    i++;\n} while (i <=10);\n```"
  merge: -1
  pgno: 2
- img_proc: true
  md: "# WHILE LOOP:\n\nFormat:\n`while (condition) {`\n    `Statements;`\n    `Increment/decrement;`\n\
    `}`\n\nExample:\n`var i = 0;`\n`while (i<=10) {`\n    `document.write (\"This\
    \ is line \" + i);`\n    `i++;`\n`}`\n\nHint: Watch out for infinite loops, which\
    \ do not have a stopping condition or have a stopping condition that will never\
    \ be reached.\n\n# OBJECTS\n\nDefinition: Objects are a composite data type which\
    \ contain properties and methods. JavaScript contains built-in objects and allows\
    \ the user to create custom objects.\n\nCreating Objects: Use the `new` constructor\n\
    `var X = new Array()`\n\nExamples:\ndate, time, math, strings, arrays\n\n# ARRAY\
    \ OBJECT\n\nDefinition: Array object is a variable that stores multiple values.\
    \ Each value is given an index number in the array and each value is referred\
    \ to by the array name and the index number. Arrays, like simple variables, can\
    \ hold any kind of data. You can leave the size blank when you create an array.\
    \ The size of the array will be determined by the number of items placed in it.\n\
    \nFormat:\n`var arrayname = new Array(size)`\n\nHint: When you create an array,\
    \ you create a new instance of the array object. All properties and methods of\
    \ the array object are available to your new array.\n\nExample:\n`var days = new\
    \ Array (7)`\nThis creates an array of seven elements using the array constructor.\n\
    The first item is `days[0]`, the last item is `days[6]`.\n\n# Initializing Arrays:\n\
    \nArray items can be treated as simple variables:\n`days[0] = \"Sunday\";`\n`days[1]\
    \ = \"Monday\";`\netc.\n\n# STRING OBJECT\n\nDefinition: String object is created\
    \ by assigning a string to a variable, or by using the new object constructor.\n\
    \nExample:\n`var name = \"Carol\";`\n`var name = new String(\"Carol\");`\n\nProperties:\n\
    **Length:** returns the number of characters in the string\n**Prototype:** allows\
    \ the user to add methods and properties to the string\n\nMethods:\nString formatting\
    \ methods (similar to HTML formatting tags)\n`String.big`\n`String.blink`\n`String.italics`\n\
    \nSubstring methods (allow user to find, match, or change patterns of characters\
    \ in the string)\n`indexOf()`\n`charAt()`\n`replace()`\n\n# MATH OBJECT\n\nDefinition:\
    \ Math object allows arithmetic calculations not supported by the basic math operators.\
    \ Math is a built-in object that the user does not need to define.\n\nExamples:\n\
    `Math.abs(number)` returns absolute value of the numeric argument\n`Math.cos(number)`\
    \ returns the cosine of the argument, in radians\n`Math.round(number)` rounds\
    \ number to the nearest integer\n\n# DATE/TIME OBJECTS\n\nDate object provides\
    \ methods for getting or setting information about the date and time.\nNote: Dates\
    \ before January 1, 1970 are not supported."
  merge: -1
