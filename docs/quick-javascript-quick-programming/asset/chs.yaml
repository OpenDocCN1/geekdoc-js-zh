  ;\n```\n\n```javascript\nObject.defineProperty(car, \"style\", {\n  value: \"sedan\"\
  ,\n  enumerable: false\n});\n\nconsole.log(car);\nconsole.log(car.style); // \"\
  sedan\"\n```\n\n```javascript\nObject.defineProperty(car, \"style\", {\n  value:\
  \ \"sedan\",\n  enumerable: false\n});\n\nconsole.log(car);\nconsole.log(car.style);\
  \ // \"sedan\"\n```\n\n```javascript\nObject.defineProperty(car, \"style\", {\n\
  \  value: \"sedan\",\n  enumerable: false\n});\n\ndelete car.style;\nconsole.log(car.style);\
  \ // undefined\n```\n\n```javascript\nlet car = {\n  make: \"Subaru\",\n  year:\
  \ 2018,\n  toString() {\n    return this.year + \" \" + this.make;\n  }\n};\n\n\
  car.style = \"sedan\";\n```\n\n```javascript\nObject.defineProperty(car, \"style\"\
  , {\n  value: \"sedan\",\n  enumerable: false\n});\n\nconsole.log(car);\nconsole.log(car.style);\
  \ // \"sedan\"\n```\n\n```javascript\nObject.defineProperty(car, \"style\", {\n\
  \  value: \"sedan\",\n  enumerable: false\n});\n\ndelete car.style;\nconsole.log(car.style);\
  \ // undefined\n```\n\n\n\n\n\n一个 `class` 描述了一类对象。它是一个蓝图，或者是创建该类型对象的配方。类是 JavaScript\
  \ 中一个较新的的特性，并且始终在严格模式下运行。类基于原型，与仅仅使用原型相比，提供的优势很少，甚至没有。\n\n以下是类的模板：\n\n```\nclass\
  \ ClassName {\n  fields;\n  constructor(arguments) {\n    code\n  }\n  set name(value)\
  \ {\n    this.someOtherName = value;\n  }\n  get name() {\n    return this.someOtherName;\n\
  \  }\n  methodName(arguments) {\n    code\n  }\n}\n```\n\n> **提醒**：在方法（属于对象的函数）中，`this`\
  \ 指向包含它的对象。构造函数、setter 和 getter 也是如此。\n\n一个类有一个 `constructor`，并可能拥有若干个 `fields`、`getters`、`setters`\
  \ 和 `methods`。为了描述这些内容，我们将继续使用我们的“汽车”示例。\n\n```\n class Car {\n    fuel = \"gasoline\"\
  ; // 注意：没有 \"let\"\n    constructor(make, year) {\n     this.make = make;\n    \
  \ this.year = year;\n    }\n   }\n\n   let myCar = new Car(\"Subaru\", 2018);\n\
  ```\n\n`new` 单词调用构造函数。在构造函数内部，`make` 和 `year` 指向构造函数的参数，而 `this.make` 和 `this.year`\
  \ 是属于正在构造的对象的新字段。构造函数可以用于创建具有不同值的其他 `Car` 对象。\n\n> **技术说明**：从构造函数创建的对象获得一个 `constructor`\
  \ 属性，该属性又有一个 `name` 属性，因此 `myCar.constructor.name` 是 `\"Car\"`。\n\n通过上述定义，`myCar`\
  \ 的字段 `fuel`、`make` 和 `year` 可以被直接访问，通过 `myCar.fuel`、`myCar.make` 和 `myCar.year`。有时，为了提供更多的“保护”，类可以包含\
  \ setter 和 getter。这些是具有特殊语法的方法：\n\n```\nset name(value) {…} 和\nget name() {…}\n\
  ```\n\n`setter` 通常用于设置字段的值。setter 经常被用于在保存值之前检查该值的合法性。它可能会以不同于提供的值的形式保存信息（例如，将英里转换为公里）。\n\
  \n`getter` 通常返回对象字段的值。或者，getter 可能会以其他方式计算一个值并返回它，例如，将公里转换回英里。\n\n要使用这些 setter 和\
  \ getter，*代码中不需要任何更改*。如果一个字段有 setter，任何更改字段值的尝试（例如，`myCar.make = \"VW\"`）都会调用该 setter。任何读取字段值的尝试都会调用其\
  \ getter。\n\n当为一个变量定义了 setter 时，*每次*设置该变量值的尝试都会调用其 setter。这可能会导致一个问题。特别是，以下代码会导致“无限”递归，因为\
  \ setter 调用了它自己。\n\n```\n set make(value) {\n    this.make = value; // 错误！\n   }\
  \ \n```\n\n可以通过使用其他名称保存变量来避免递归。由于下划线在变量名中是合法的，一种惯例是在名称前面加上一个下划线来创建一个新名称。这仅仅是一种惯例；下划线并没有特殊之处。\n\
  \n```\n set make(value) {\n    this._make = value; // 正确\n   }\n```\n\n新变量 `_make`\
  \ 必须在整个类定义中使用，而旧变量 `make` 应该在类定义外部使用。\n\ngetter 和 setter 通常应该成对定义。带有 setter 的变量必须存储其他名称下，而没有\
  \ setter 的变量不受影响。\n\n> **注意**：虽然使用 setter 可以防止意外更改值，但它无法防止恶意用户。使用上述为 `make` 定义的\
  \ setter，信息实际上存储在变量 `_make` 中，而该变量是可以直接访问的。\n\n`method`（方法）是属于对象的函数；而类是对象的一种。在类内部，方法的写法像函数一样，只是省略了\
  \ `function` 单词。\n\n以下是 `Car` 类的实现：\n\n```\n class Car {\n    fuel = \"gasoline\"\
  ;\n\n    constructor(make, year) {\n     this._make = make;\n     this._year = year;\n\
  \    }\n\n    set make(arg) { this._make = arg; }\n\n    get make() { return this._make;\
  \ }\n\n    set year(arg) {\n     if (arg < 1903 ||\n       arg > new Date().getFullYear())\
  \ {\n      alert(\"Bad year: \" + arg);\n     }\n     else {\n      this._year =\
  \ arg;\n     }\n    }\n\n    get year() { return this._year; }\n\n    age() { //\
  \ 方法\n     let now = new Date().getFullYear();\n     return now - this._year;\n\
  \    }\n\n    toString() {\n     return this._year + \" \" + this._make;\n    }\n\
  \   }\n```\n\n对 `myCar` 进行赋值将创建一个带有 `make` 和 `year` 字段的对象。在此之后，测试 `myCar instanceof\
  \ Car` 将返回 `true`。\n\n> **注意**：`this` 单词在运行时求值，并取决于它发生的上下文。\n\n### 1. 继承\n\n类可以继承另一个类。被继承的类称为子类，继承它的类称为父类。子类使用\
  \ `extends` 关键字来指示其父类。\n\n子类继承父类的所有属性和方法。你也可以向子类添加新功能。\n\n```\nclass Animal {}\n\
  class Dog extends Animal {}\n```\n\n#### 构造函数\n\n每个类都必须构造函数，构造函数应该首先调用父类的构造函数。这必须在任何使用\
  \ `this` 之前完成。\n\n如果没有指定构造函数，JavaScript 会自动提供一个。它假设构造函数接收与父类构造函数相同的参数。如果我们能看到它，它应该是这样的：\n\
  \n```\nconstructor(...args) { super(...args); }\n```\n\n展开运算符 (`...`) 用于将任意数量的参数收集到数组中，并提供任意数量。\n\
  \n#### 方法覆盖\n\n子类还可以覆盖其父类的一个或多个方法。当子类需要为方法提供不同的实现时，这是非常有用的。\n\n```javascript\nclass\
  \ Animal {\n  eat() {\n    console.log(\"eating...\");\n  }\n}\n\nclass Dog extends\
  \ Animal {\n  eat() {\n    console.log(\"eating dog food...\");\n  }\n}\n```\n\n\
  #### `super` 函数\n\n`super` 函数用于调用父类的构造函数。它也可以从子类调用父类方法。\n\n```javascript\nclass\
  \ Animal {\n  constructor(name) {\n    this.name = name;\n  }\n  move() {\n    console.log(this.name\
  \ + \" moves.\");\n  }\n}\n\nclass Dog extends Animal {\n  constructor(name, breed)\
  \ {\n    super(name);\n    this.breed = breed;\n  }\n  move() {\n    super.move();\n\
  \    console.log(this.name + \" is running.\");\n  }\n}\n```\n\n### 2. 静态方法和属性\n\
  \n类可以拥有静态方法和属性。这些属于类本身，而不是类的任何实例。它们使用 `static` 关键字定义。\n\n```javascript\nclass Animal\
  \ {\n  static species = \"mammal\";\n  static logInfo() {\n    console.log(\"Animal\
  \ info\");\n  }\n}\n\nconsole.log(Animal.species);\nAnimal.logInfo();\n```\n\n静态方法和属性在类的实例上不可用。然而，它们会被子类继承。\n\
  \n```javascript\nclass Animal {\n  static logInfo() {\n    console.log(\"Generic\
  \ info\");\n  }\n}\n\nclass Dog extends Animal {\n  static logInfo() {\n    console.log(\"\
  Dog info\");\n  }\n}\n\nAnimal.logInfo(); // Generic info\nDog.logInfo(); // Dog\
  \ info\n```\n\n\n\n\n```\n let person = new Person(\"Sally\");\n let cust = new\
  \ Customer(\"Bill\", 123);\ncust.name = \"William\";\n```\n\n> **注意**：对象并不非要从类创建才能拥有\
  \ getter 和 setter 方法。使用 `get` 和 `set` 关键字的语法与上面所示的语法相同。\n\n#### 3.11.10.3 重写方法和字段\n\
  \n在类类中定义的字段和方法可以在子类中被重新定义，或被“重写”（`overridden`）。例如，`Object` 类定义了一个 `toString` 方法。这个方法并不好用，因为它总是返回`\"\
  [object Object]\"`，但它确实存在。\n\n你只需通过定义一个同名的新方法就可以重写方法。例如，我们可能会向 `Person` 类中添加以下方法：\n\
  \n```\n toString() {\n    return \"My name is \" + this.name;\n   }\n```\n\n> **注意**：在大多数浏览器中，`console.log(obj)`\
  \ 方法并不使用 `toString`；它会打印对象的结构。如果这不是你想要的，可以显式地调用 `toString`，或者简单地向参数拼接一个空字符串，`console.log(obj\
  \ + \"\")`。\n\n字段也可以被重写。然而，`this` 关键字始终指向“点之前的对象”。例如：\n\n```\n class Over {\n  \
  \  value = 100;\n    show() {\n     return \"value is \" + this.value;\n    }\n\
  \   }\n\n   class Under extends Over {\n    value = 50;\n   }\n\n   let under =\
  \ new Under();\n   console.log(under.show());\n```\n\n这会输出 `\"value is 50\"`。虽然\
  \ `show()` 定义在 `Over` 中，但变量 `under` 的类型是 `Under`，因此 `this.value` 是 `50` 而不是 `100`。\n\
  \n如果 `value` 没有在 `Under` 中定义，那么 `under` 将从 `Over` 继承它，而 `this.value` 将是 `100`。\n\
  \n#### 3.11.10.4 类原型\n\n如之前，你可以构造一个使用现有对象作为其原型的对象。\n\n```\nlet newObj = Object.create(oldObj);\n\
  ```\n\n`newObj` 初始 own 任何自己的属性，但稍后可以添加属性。任何查找 `newObj` 属性的尝试都会首先在 `newObj` 内部查找，如果那里没有找到，JavaScript\
  \ 将在它的原型 `oldObj` 中查找。\n\n方法 `Object.getPrototypeOf(newObj)` 将返回 `oldObj`，但也有一种旧的访问原型的方法：`newObj.__proto__`。非枚举的\
  \ `__proto__` 属性不应在新代码中使用。\n\n在类中也会发生类似的情况。\n\n```\n class Person {…}\n class Customer\
  \ extends Person {…}\n let sally = new Customer(…);\n```\n\n对象 `sally` 可以访问在 `Customer`\
  \ 中声明的方法以及在 `Person` 中声明的方法（除非它们被 `Customer` 中同名的方法所重写）。\n\n当你声明一个函数或创建一个带有构造函数的类时，该函数或类会获得一个命名非常误导的属性：`prototype`。该属性的值是一个包含函数名和定义的对象。\n\
  \n> **注意**：不要将类的 `prototype` 属性（`class.prototype`）与对象的原型（`obj.__proto__`）混淆。\n\n\
  你可以通过给其 `prototype` 赋值为该类的所有实例附加一个方法：\n\n```\n Person.prototype.initial = function()\
  \ {\n    return this.name[0];\n   }\n```\n\n方法 `initial` 将返回人名字的第一个字符（假设 `Person`\
  \ 拥有一个 `name` 属性）。\n\n## 3.12 转译器与补丁程序（Polyfills）\n\nJavaScript 正在演进并（希望）变得更好。遗憾的是，旧版浏览器可能不支持某些最新特性。为了让\
  \ JavaScript 代码在“处处”运行，可以采取两种不同的方法：\n\n1. 只使用在处处运行的成熟特性。\n2. 使用转译器（transpilers）和/或补丁程序（polyfills）。\n\
  \n转译器 `transpiler` 会将较新的语法特性（如 `??` 运算符）编译为较旧但等价的语法。`Babel` 是一个著名的转译器。\n\n`polyfill`\
  \ 是一个函数或函数库，当前可能包含也可能不包含。缺失的函数可以直接添加到代码中。补丁库可以从补丁服务器加载，尽管这会增加加载时间。关于使用哪个补丁库（如果有的话）存在更多争议，但\
  \ `polyfill.io` 相当流行。\n\n## 3.13 JSON\n\n`JSON`（JavaScript 对象表示）是一种将数据表示为文本的方法。这对于在文件中存储数据或在服务器之间传输数据非常有用。JSON\
  \ 是人类可读且可编辑的；它与 JavaScript 数据非常相似。\n\n有两个方法：\n\n* `JSON.stringify(value)`——将 JavaScript\
  \ `value` 转换为 JSON 字符串。\n* `JSON.parse(string)`——将 JSON `string` 转换为 JavaScript\
  \ 对象。\n\n# 4 客户端 JavaScript\n\n在几个介绍性章节之后，书的其余部分分为部分：**图形界面**（Graphical Interfaces），这是程序员需要的所有内容；以及**使用\
  \ DOM**（Using the DOM），它描述了……\n\n## 4.1 基础 HTML\n\n`HTML 页面`是一个包含标签的文本文件。\n\n大多数`标签`都是容器。它们由一个起始标签（start\
  \ tag）、一些内容和一个结束标签（end tag）组成。\n\n语法如下：\n\n```\n<tagName> contents </tagName>\n\
  ```\n\n容器标签可以包含文本和其他标签，且嵌套深度任意。\n\n少数几种标签是空的，即不是容器。例如，`<br>` 是换行符，`<hr>` 是水平线。不需要结束标签。此类标签有时写为\
  \ `<tagName/>`。\n\n一个 HTML 页面至少包含四个标签：\n\n* `document` 标签，标识该文件为 HTML。它不是容器。\n*\
  \ `html` 标签，包含 head 和 body 标签。\n* `head` 标签，包含关于页面的元数据，大部分不显示。它通常包含一个命名页面的 `<title>`\
  \ 标签。\n* `body` 标签，包含给用户的信息以及指定显示方式的其他众多标签。\n\n这是一个简单的 HTML 页面示例：\n\n```html\n<!DOCTYPE\
  \ html>\n   <html>\n    <head>\n     <title>示例 页面</title>\n    </head>\n    <body>\n\
  \     <p id=\"p1\">用户可以看到这部分。</p>\n    </body>\n   </html>\n```\n\n起始标签可以包含属性（attributes），形式为\
  \ `name=\"value\"`。其中一种属性是 `id`，用于为单个标签分配唯一标识符。\n\nJavaScript 是区分大小写的，但 HTML 中的标签名和属性不区分大小写。\n\
  \n最初，所有的样式都在 HTML 内部完成的。现在，大多数样式通过一个或多个关联样式表（stylesheets）应用，使用 CSS（级联样式表）。\n\n##\
  \ 4.2 在 HTML 中添加 JavaScript\n\n可以通过以下方式向 HTML 页面添加 JavaScript：\n\n* 将 JavaScript\
  \ 放在 `<script>`……`</script>` 标签中，位于 head 或 body 中。\n* 将 JavaScript 放在具有 `.js` 扩展名的独立文件中，并在\
  \ head 元素中使用 `<script src=\"URL.js\"></script>` 加载它。在这种情况下，`<script>` 标签内的任何代码将被忽略。\n\
  * 将 JavaScript 写在 HTML “事件处理程序”属性的值。\n\n\n\n\n\n函数定义最好放置在 HTML 文档的 `<head>` 中。位于\
  \ `<body>` 部分的脚本会随着页面加载按顺序执行，并且通常会产生显示在页面相应位置的输出。\n\n并不是每个人都允许 JavaScript 在浏览器中运行。`<noscript>`text`</noscript>`\
  \ 标签内的文本仅当 JavaScript 不可用用或被禁用时才会显示。\n\n大量的 JavaScript 和在多个页面使用的脚本应该被存放在一个或多个文件中，而不是放在\
  \ HTML 页面上。\n\n## 4.3 DOM 概述\n\n`HTML DOM`（`文档对象模型`）将 HTML 页面上的所有内容表示为 `Node` 节点树，甚至\
  \ HTML 注释和每一处空白也是如此。DOM 中的所有内容都可以被 JavaScript 访问并更改，JavaScript 进行的任何更改都会立即反映在页面上展示给用户。这种功能远超大多数应用程序所需的。\n\
  \n图 4.1 显示了 `Node` 的主要子类，而不是 DOM 树的结构。DOM 树的根是一个名为 `document` 的 `Node`，类型为 `Document`，它有一个子节点，即代表\
  \ `<html>` 标签的 `Element`。`document` 节点拥有属性 `head` 和 `tail`，可以访问整个节点树。\n\n![](img/fig4_1_B.jpg)\n\
  \n图 4.1 DOM 树。\n\n每个 HTML 标签都由一个 `Element` 表示。`Element` 拥有一个 `tagName`，它是 HTML 标签的名称。DOM\
  \ 中的名称始终大写：`HTML`、`HEAD`、`BODY`、`TITLE`、`SCRIPT` 等。`Element` 可能会拥有 `Attribute`（`Node`\
  \ 的另一个子类）。\n\n> **注意**：`Element` 只是 `Node` 的一种类型，但它无处不在，以至于两者有时会被混淆。增加混乱的是，`Element`\
  \ 是 `Node` 的子类，因此所有 `Node` 属性和方法都可以用于 `Element`。\n\n由于节点处于树形结构中，因此有一些 `Node` 属性允许在树中移动：`parentNode`、`firstChild`、`nextSibling`、`previousSibling`\
  \ 和 `lastChild`。\n\n文本和注释由 `Text` 和 `Comment` 节点表示，而不是 `Element` 节点，因此它们不会出现在只返回\
  \ `Element` 的属性和方法中。例如，一个 `Element` 有一个 `childNodes` 属性，它是所有子节点的集合；而 `children`\
  \ 属性是仅包含那些 `Element` 类型子节点的集合。\n\n除了 HTML 描述的网页外，还有大量的事件在不断发生。每一次击键、每一次鼠标移动以及许多其他事情都会导致事件的发生。交互式网页会“监听”并响应这些事件中的一小部分。\n\
  \n## 4.4 图形用户界面\n\n`图形用户界面`（或 `GUI`）是允许程序与用户交互的手段。它通常由熟悉的控件或 `widgets`（部件）组成，例如按钮、文本框、复选框、菜单项等。\n\
  \nGUI 可以用于创建独立程序，也可以用于收集信息并发送回服务器（例如订购商品时）。`form` 是控件的容器，其目的是将信息收集成一个包。\n\n### 4.4.1\
  \ 事件\n\nGUI 程序与其他程序不同。GUI 程序不是从头运行到尾的连续代码序列，而是`事件驱动`的。当发生“有趣”的事件时，会触发某些代码来`handle`（处理）它。代码执行完毕，在另一个“有趣”事件发生之前，什么都不会发生。\n\
  \n“有趣”的事件简单是指程序员编写了一些代码来处理的事件。事件一直在发生；实际上任何发生的事情都会产生一个或多个事件。鼠标悬过 HTML 元素？这是一个事件。鼠标移出\
  \ HTML 元素？这是另一个事件。事实上，只要鼠标移动，那就是一个事件。有超过 70 种事件，所有名称都以“`on` 开头，例如 `onclick`。\n\n\
  关键在于事件一直在发生；程序员不需要做任何事情来创建它们。如果用户点击按钮，那是一个（通常情况下）应该被处理的事件。如果用户点击段落中的一个单词，可能该事件应该被忽略。程序员可以决定处理哪些事件。\n\
  \n### 4.4.2 Widgets\n\n`Widgets` 是 GUI 元素。每个部件都由 HTML 中的一个标签表示，以及 DOM 中对应的 `Element`\
  \ 表示。典型的部件有按钮、文本字段、文本区域、复选框、单选按钮、滚动条以及许多其他类型。\n\n大多数 GUI 元素可以使用带有 `type` 属性的 `<input>`\
  \ 标签来编写。如果省略 `type`，则默认为 `text`；这是一个允许输入单行文本的框。\n\n以下是 `type` 的可能值：`button`、`checkbox`、`color`、`date`、`datetime-local`、`email`、`file`、`hidden`、`image`、`month`、`number`、`password`、`radio`、`range`、`reset`、`search`、`submit`、`tel`（电话）、`text`、`time`、`url`、`week`。\n\
  \n有一些部件自己的标签，而不是 `type` 的值：`button`、`fieldset`、`label`、`option`。\n\n### 4.4.3 按钮\n\
  \n按钮是`活动元素`：当用户点击按钮时，应该发生某些事情。此外，提供视觉提示是礼貌的。例如，如果用户点击 `Save` 按钮保存文件，用户可能会感到沮丧并反复点击按钮。\n\
  \n创建按钮有两种方法：\n\n```\n<input type=\"button\" value=\"Click me\" onclick=\"alert('Hello')\"\
  >\n\n<button onclick=\"alert('Hello')\">Click me</button>\n```\n\n这些每一个都会出现在网页上。`onclick`\
  \ 属性的值应该是包含 JavaScript 代码的字符串，当按钮被点击时执行——这就是事件处理器。通常事件处理器是一个单一函数调用，这样所有 JavaScript\
  \ 代码就可以放在一起，而不是分散在整个 HTML 页面。在上面的示例中，调用的函数是 `alert` 函数。\n\n> **注意**：事件处理器中的 JavaScript\
  \ 代码必须是引号字符串。由于代码本身可能包含引号字符串，通常使用两种引号，例如双引号内的单引号。\n\n按钮上的文本可以通过 JavaScript 更改。对于使用\
  \ `input` 标签定义的按钮，其文本位于 `value` 属性中；对于使用 `button` 标签定义的按钮，其文本位于其 `innerHTML` 中。\n\
  \n### 4.4.4 查找 Widgets\n\n有多种方法指定特定的部件。这里是两种：\n\n*   `document.getElementById(\"\
  id\")` —— 返回页面上具有属性 `id=\"id\"` 的唯一元素。id 在页面上必须是唯一的。\n\n*   `document.getElementsByTagName(\"\
  tagName\")` —— 获取页面上具有给定 `tagName` 的所有元素的可索引集合。\n\nDOM 中有两种常用的 `collection` 类型。`getElementsByTagName`\
  \ 方法返回一个元素的*活的* `HTMLCollection`，而节点的 `childNodes` 属性是节点的的*活的* `NodeList`。\n\n\n\
  \n\n两种类型的集合都有一个 `length` 属性，并且都可以像数组一样被索引，或者（冗余地）通过 `item(index)` 方法进行索引。这些集合是“动态的”（live），这意味着它们可以被视为指向\
  \ DOM 的窗口，而不是一个快照。如果 DOM 树发生了变化（例如插入或删除节点），这些集合的内容和长度也会随之改变。所有的 `HTMLCollection`\
  \ 都是动态的，但某些 `NodeList` 是静态的（static）——它们不会随着 DOM 树的变化而改变。\n\n`Array.from(collection)`\
  \ 方法返回一个来自 `collection` 的值的静态数组。\n\n### 4.4.5 文本字段\n\n文本字段是一个“被动元素”（passive element）。点击它或向其中输入文本不应该引起任何反应。随后的操作（如点击按钮）可以访问并使用输入的文本。\n\
  \n> **注意**：从技术上讲，任何元素都可以变为激活状态。你*可以*在文本字段中放置一个 `onclick` 属性，它会起；但几乎没有情况下这样做是个好主意。\n\
  \n对于文本字段，没有 `<text>` 标签，只有 `<input>` 标签的一种变体。\n\n```\n <input type=\"text\" size=\"\
  12\" value=\"Initial text\">\n```\n\n`size` 属性用于衡量文本字段中可以显示多少个字符；默认值为 20。无论一次显示多少字符，都可以在文本字段中输入任意数量的字符。\n\
  \n以下是读取用户输入内容的方法。首先，找到文本字段（可以使用 `document.getElementById`），然后读取其 `value` 条目。\n\n\
  ```\n <input id='tx1' type=\"text\">\n   <br>\n   <input type=\"button\"\n     \
  \ value=\"Look in text field\"\n      onclick=\"alert('You entered: ' +\n      \
  \ document.getElementById('tx1').value)\">\n```\n\n它的工作方式正如你预期的。在文本字段中输入内容，点击按钮，它就会出现在提示消息中。\n\
  \n通常情况下，组件的操作不应该比调用单个函数更复杂。通过将函数放在文档头部，可以将上面的代码写得更整洁：\n\n```\n <script>\n    function\
  \ showText(id) {\n     var field = document.getElementById(id);\n     alert('You\
  \ entered: ' + field.value);\n    }\n   </script>\n```\n\n按钮的处理程序可以被写为简单的函数调用。\n\
  \n```\n <input type=\"button\" value=\"Look in text field\"\n      onclick=\"showText('tx1')\"\
  >\n```\n\n### 4.4.6 按钮与表单\n\nJavaScript 的一个常见用途是向服务器发送信息。通常会有多条信息：姓名、地址、信用卡号等。为了将多条信息收集到单次提交中，使用了表单（form）。\n\
  \n`form` 是一个容器，具有起始标签 `<form>` 和结束标签 `</form>`。其目的是包含各种组件，如按钮和文本字段，但也可以包含任何有效的 HTML。默认情况下，将\
  \ HTML 封装在 `<form>` 中不会在屏幕上产生任何视觉上的差异。\n\n我们已经描述了标准的按钮类型，即使用 `<button>` 或 `<input\
  \ type=\"button\">`。这里有另外两种对表单特别相关的按钮类型。每种类型都有旧版本（使用 `<input>`）和一个较新版本（使用 `<button>`）。为了对比，我们在这里展示了所有类型的按钮。首先是旧方法：\n\
  \n```\n <input type=\"button\" value=\"Click me\">\n <input type=\"submit\" value=\"\
  Send it\">\n <input type=\"reset\" value=\"Forget it\">\n```\n\n然后是新方法：\n\n```\n\
  \ <button type=\"button\">Click me</button>\n <button type=\"submit\">Send it</button>\n\
  \ <button type=\"reset\">Forget it</button>\n```\n\n旧方法将按钮的文本放在 `value` 属性中，因此只能是文本。新方法将其放在\
  \ `<button>` 和 `</button>` 之间，因此可以是几乎任何内容。\n\n*   当点击“普通”按钮（`type=\"button\"`）时，不会发生默认操作。\n\
  *   `submit button`（提交按钮）具有默认文本 `Submit`，默认操作是将所在表单上的所有信息发送到服务器。（稍后将详细介绍。）\n*  \
  \ `reset button`（重置按钮）具有默认文本 `Reset`默认操作是将表单上的所有内容恢复为原始值。这种操作往往会让用户感到反感。\n\n> **注意**：没有显式\
  \ `type` 属性的按钮行为类似于 `type=\"button\"`，*在表单内部*除外，在那里它的行为类似于 `type=\"submit\"` 按钮。\n\
  \n表单的一个非常方便的特性是它们定义了一个范围。表单内的任何组件都可以有一个 `name` 属性，这个名称可以被同一表单内的其他组件使用。例如：\n\n```\n\
  \ <form>\n    <input name='tx1' type=\"text\">\n    <input type=\"button\"\n   \
  \  value=\"Look in text field\"\n     onclick=\"alert('You entered: ' + tx1.value)\"\
  >\n   </form>\n```\n\n`id` 在整个 HTML 页面上必须是唯一的，可以通过脚本内部调用 `getElementById(id)` 来访问；`name`\
  \ 在表单内应该是唯一的，并且可以通过同一表单内的其他组件直接访问。任何组件都可以拥有 `name` 和 `id`。\n\n很少需要多个一个表单。页面上可以有多个表单，但表单不能嵌套。表单内的\
  \ `submit` 按钮将触发带有 `action` 属性的表单。`form` 标签可以包含 `action=\"URL\"`（统一资源定位符），指定信息要发送到的\
  \ URL。如果不存在 `action` 属性，则使用表单所在的页面 URL。\n\n### 4.4.7 表单验证\n\n当用户点击 `Submit` 按钮时，通常在将其发送到服务器之前检查表单中的信息。并不是所有内容都可以检查，但很多内容可以。必填字段是否为空？数字字段中是否有意外字符？\n\
  \n如果 `<input type=\"text\"...>` 包含 `required` 属性（没有值，只有单词 `required`），尝试提交表单会导致检查该字段是否为空。如果为空，字段旁边会出现一个弹出提示显示“Please\
  \ fill in this field.”\n\n文本字段可以有一个 `pattern=\"regexp\"` 属性，通过正则表达式 `regexp` 确切指定可以输入的内容；点击\
  \ `Submit` 按钮时将进行检查。错误的输入将被标记为“Please match the requested format.” `regexp` 以字符串给出，不带斜杠边界。\n\
  \n文本字段可以有一个 `placeholder=\"text\"` 属性；`text` 显示为对用户的提示。当用户向字段输入内容时，`text` 会消失，当字段再次为空时会重新出现。\n\
  \n进行任意验证的一种方法是在 `<form>` 标签中放置 `onsubmit` 属性，其值语法为 `return function_call()`；例如：\n\
  \n```\n <form onsubmit=\"return validate()\">\n    Type a number:\n    <input name='num'\
  \ type=\"text\">\n    <br>\n    <input type=\"submit\">\n   </form>\n```\n\n在这个示例中，当点击\
  \ `submit` 按钮时将调用 `validate()` 函数。如果验证失败，函数应该调用 `event.preventDefault()`，否则提交将成功。无论何种，告知用户都是合适的。\n\
  \n### 4.4.8 表单提交\n\n当表单被提交时，`form` 标签的 `action` 属性告诉程序将数据发送到哪里，而 `method` 属性告诉*如何*发送数据。\n\
  \n`method` 属性最常用的两个值是 `\"get\"` 和 `\"post\"`。\n\n#### 4.4.8.1 Get 请求\n\n\n\n\n一个\
  \ `get request`，`<form method=\"get\">` 是一个简单的信息请求。当发送的数据可能会更改服务器上的某些内容时，不应使用它。例如，永远不应用于下单。\n\
  \n表单数据附加到 URL 中，语法为 `?``name`=``value``&``name`=``value``&…`，例如 `google.com/search?q=octopus`。由于信息在\
  \ URL 中可见且可能会保留在浏览器历史记录中，因此 `get` 请求永远不应用于敏感信息。\n\n如果省略了 `method` 属性，它默认为 `get`。\n\
  \nURL 被限制为 2048 个 ASCII（*不是* Unicode）字符，因此这限制了可以被提交的数据量。对于大量信息，必须使用 `post`。\n\n\
  `Get` 请求可以加签。\n\n#### 4.4.8.2 Post 请求\n\n一个 `post request`，`<form method=\"post\"\
  >` 通常用于除简单信息请求之外的所有情况。数据发送在请求体中，而不是 URL 中，因此可以发送大量数据。在正文中，其格式为 ``name`=``value``&``name`=``value``&…`。文件上传具有更复杂的结构。\n\
  \n`post` 请求比 `get` 请求更安全，因为它在 URL 中可见，不会被缓存，也不会留在浏览器的历史记录中。\n\n#### 4.4.8.3 其他请求\n\
  \n还有其他几种 `method` 请求类型，例如 `head` 只请求页面头部而不请求主体，以及 `put` 请求服务器存储数据。\n\n服务器决定接受并处理哪些\
  \ `method` 请求。例如，服务器可能接受 `get` 请求但不接受 `post` 请求。\n\n服务器端代码可以用几乎任何语言编写。服务器端编码在在本书的范围之外。\n\
  \n## 4.4.9 额外的文本控件\n\n除了 `<input type=\"text\">` 之外，许多其他控件也允许文本输入。除了 `textarea`\
  \ 外，以下所有内容都写为 `<input type=\"``type`\">`。\n\n*   `password` — 密码字段中的所有字符都显示为点。这种区别仅影响用户看到的内容；输入的文本会被记录并可以像往常一样访问。\n\
  *   `search` — 这类似于 `<input type=\"text\">`，但在右端有一个小图标，点击它可以选择字段中之前的条目。\n*   `email`\
  \ — 一个可以输入电子邮件地址的文本字段。该条目会自动检查（在提交时），以确保它包含 `@` 字符。如果控件包含 `multiple` 标记，可以输入多个电子邮件地址，并用逗号分隔。\n\
  *   `number` — 一个可以输入整数的文本字段。它提供了上下箭头，用于在显示的数字上加或减一。如果提供了 `value` 属性，它将用作初始显示的初始数字。\n\
  *   `URL` — 一个可以输入 URL 的文本字段。该字段会自动检查（在提交时），以确保该条目是一个句法上正确的 URL。\n*   `textarea`\
  \ — `<textarea name=\"``name`\" rows=\"``nrows`\" cols=\"``ncols`\">` 控件提供了一个多行文本输入区域，由\
  \ `nrows` 行组成，宽度足够显示 `ncols` 个字符。\n    *   需要一个结束标签 `</textarea>`。起始标签和结束标签之间的文本（`innerHTML`）是文本区域中最初显示的内容。\n\
  \    *   文本区域中的文本将以等宽字体显示。\n    *   如果省略了 `name` 属性，在提交表单时文本区域中的数据将不会被包含。\n\n有一些额外的输入控件可用于选择日期和时间，但这些在所有浏览器上尚未支持。\n\
  \n*   `date` — 用于选择日历日期。\n*   `time` — 用于选择一天中的时间。\n*   `datetime-local` — 用于选择日期时间。\n\
  *   `week` — 用于选择周。\n\n## 4.4.10 其他输入控件\n\n除了 `button`、`text`、`submit` 和 `password`，`<input>`\
  \ 标签的 `type` 属性还有许多其他值。记住，对于 `<input>`，所有信息都在起始标签中；不使用结束 `</input>` 标签。\n\n这些控件中的许多一个没有向用户指示它们的用途，因此它们应该始终伴有一个\
  \ `label`，最好带有包含 `for` 属性的 label。\n\n*   `radio` — 控件 `<input type=\"radio\" id=\"\
  ``id`\" name=\"``group`\" value=\"``value`\">` 定义了一个单选按钮。单选按钮始终成组使用，每个单选按钮的 `name`\
  \ 属性具有相同的值。选择一组中的一个单选按钮会取消该组中所有其他单选按钮。\n    *   在 `form` 中，`group.value` 是所选单选按钮的值。如果不在表单中，必须单独检查单选按钮。\n\
  \    *   如果没有选择单选按钮，该组的 `value` 为空字符串。要从开始选中一个按钮，请给它加上 `checked` 标记。\n*   `checkbox`\
  \ — 控件 `<input type=\"checkbox\" id=\"``id`\" name=\"``group`\" value=\"``value`\"\
  >` 定义了一个单选按钮（注：原文此处应为复选框）。单选按钮始终成组使用，每个单选按钮的 `name` 属性具有相同的值。选择一组中的一个单选按钮会取消该组中所有其他单选按钮。\n\
  \    *   在 `form` 中，`group.value` 是所选单选按钮的值。如果不在表单中，必须单独检查单选按钮。\n    *   如果没有选择单选按钮，该组的\
  \ `value` 为空字符串。要从开始选中一个按钮，请给它加上 `checked` 标记。\n    （注：此处原文英文对 checkbox 的描述似乎误用了\
  \ radio 的逻辑，已按字面意思翻译）\n\n\n\n\n\n事件名称有时使用驼峰命名法（camelCase），例如使用 `onClick` 而不是 `onclick`。这是因为标签是在\
  \ HTML 中的，而 HTML 是不区分大小写的，但在引号内的 JavaScript 中，它是区分大小写的。\n\n以下事件可以在 `<body>` 或 `<frame>`\
  \ 元素中处理（`frame` 是一个作为页面部分加载的独立 URL 文件）：\n\n*   `onload` — 文档或框架已完成加载。可以使用它来执行一个函数以完成任何所需的初始化。\n\
  *   `onunload` — 文档或框架已卸载。可以使用它来执行任何最终的清理工作。\n\n大多数元素都可以处理以下事件：\n\n*   `onclick`\
  \ — 元素被点击。按钮几乎总是会处理 `onclick` 事件。大多数其他控件都会自动处理针对给定类型控件的所有常规操作。\n*   `ondblclick`\
  \ — 元素在短时间内被点击了两次。\n*   `onmousedown` — 鼠标悬停在控件上时按下鼠标键（或键盘等效键）。要区分按下的是哪个鼠标键，请使用\
  \ `onmousedown` 而不是 `onclick`。`event.button` 的值对于左键、中键和右键分别为 `0`、`1` 或 `2`。\n* \
  \  `onmouseup` — 鼠标悬停在控件上时释放鼠标键。此事件通常被忽略，转而处理 `onclick` 事件。\n*   `onmouseover` —\
  \ 鼠标移动到控件上。\n*   `onmouseout` — 鼠标移出控件。\n*   `onmousemove` — 鼠标移动。\n\n现代设备可能具有触摸屏或手写笔。上述\
  \ `onmouse` 事件可以被 `onpointer` 事件取代，后者对鼠标和触摸事件都同样有效。\n\n以下事件由 `<body>` 元素以及 `input`\
  \ 和 `textarea` 控件处理：\n\n*   `onkeypress` — 在此控件获得焦点时点击了按键。\n*   `onkeydown` — 在此控件获得焦点时按下按键。\n\
  *   `onkeyup` — 在此控件获得焦点时释放按键。\n*   `onfocus` — 控件获得焦点（例如，用户通过 Tab 键切换）。\n*   `onblur`\
  \ — 控件失去焦点。\n*   `onchange` — 控件失去焦点时，其值与获得焦点时的值不同。\n\n以下事件通常在封装的 `<form>` 标签中处理：\n\
  \n*   `onselect` — 选择了部分文本。要检索选中的文本，使用 `document.getSelection()`。\n*   `onreset`\
  \ — 用户点击了重置按钮。如果 `onreset` 属性值为 `\"return false\"` 或 `\"return someFunction()\"\
  `（其中 `someFunction` 返回 `false`），则取消重置。\n*   `onsubmit` — 用户点击了提交按钮。如果 `onsubmit`\
  \ 属性值为 `\"return false\"` 或 `\"return someFunction()\"`（其中 `someFunction` 返回 `false`），则取消提交。\n\
  \n以下事件通常由 `<img>` 标签处理：\n\n*   `onabort` — 图像加载被中断。\n*   `onerror` — 加载图像时发生错误。\n\
  \n事件处理器可以访问 `event`。在处理器中：`event.type` 是事件类型。`event.target` 是触发事件的元素。`event.currentTarget`\
  \ 是事件监听器绑定的元素。`event.button` 表示按下了哪个鼠标键：`0` 代表左键，`1` 代表中键，`2` 代表右键。`event.clientX`\
  \ 和 `event.clientY` 表示鼠标相对于浏览器视口的位置。`event.key` 是被按下的键值。\n\n```javascript\nconsole.log(\"\
  Wow!\");\n```\n\n### 4.4 冒泡\n\n当事件发生时，它首先命中目标元素，然后向其祖先传播。这被称为冒泡。可以通过调用 `event.stopPropagation()`\
  \ 停止事件冒泡。要防止事件的默认行为，请使用 `event.preventDefault()`。\n\n### 4.5 Window 对象\n\n`window`\
  \ 对象是浏览器中的全局对象。它有许多属性和方法。\n\n#### 4.5.1 Window 属性\n\n是一些 `window` 属性：\n\n*   `appName`\
  \ — 浏览器，例如 `Netscape`。\n*   `platform` — 运行浏览器的计算机，例如 `Win32` 或 `MacIntel`。\n* \
  \  `userAgent` — 平台的详细描述。\n*   `self` — 对当前窗口的引用。\n*   `length` — 窗口中帧的数量。\n*  \
  \ `parent` — 直接封装的窗口。\n*   `document` — 在此窗口显示的 HTML 文档。\n*   `top` — 最外层的窗口。\n\
  *   `location` — 文档的 URL。\n\n#### 4.5.1.2 Window 方法\n\n是一些可用方法：\n\n*   `alert(string)`\
  \ — 显示一个包含字符串和“确定”按钮的警报对话框。\n*   `confirm(string)` — 显示一个包含字符串以及“取消”和“确定”按钮的确认框。\n\
  *   `prompt(string)` — 显示一个包含字符串、文本字段以及“取消”和“确定”按钮的提示框。\n*   `open(URL)` — 打开包含\
  \ URL 指定文档的新窗口。\n*   `close()` — 关闭给定的窗口，但仅当它是由 `open` 打开时。\n*   `setTimeout(function,\
  \ delay, arg1, ..., argN)` — 设置定时器，在 `delay` 毫秒后调用 `function`，并带有可选参数 `arg1` 到 `argN`。\n\
  *   `clearTimeout(timeoutId)` — 取消由 `setTimeout` 启动的待定定时。\n*   `setInterval(code,\
  \ interval)` — 设置定时器，每隔 `interval` 毫秒执行一次 `code`。\n*   `clearTimeout(intervalId)`\
  \ — 取消由 `setInterval` 启动的周期性执行。\n\n\n\n\n\n**注意**：从技术角度来说，需要注意的是，窗口可用的 `timeout`\
  \ 和 `interval` 方法并没有定义在 `Window` 对象中，而是继承自其他地方。这在实际应用中没有太大区别。\n\n#### 4.5.1.3 Window\
  \ 示例\n\n假设我们在 HTML 文档的 `<head>` 中有以下 JavaScript 代码（位于 `<script>` 标签内）：\n\n```\n\
  \ \"use strict\";\n   let win2, timer;\n\n   function display(str) {\n    let e\
  \ = document.getElementById(\"para\");\n    e.innerHTML = str;\n   }\n\n   function\
  \ google(str) {\n    console.log(window);\n    win2 = window.location =\n     \"\
  <uri>https://google.com</uri>\" + \"?q=\" + str;\n   }\n\n   function googleIt()\
  \ {\n    display(\"Going to Google in 5 seconds.\");\n    let term =\n     document.getElementById(\"\
  search\").value;\n    timer = setTimeout(google, 5000, term);\n   }\n\n   function\
  \ cancel() {\n    display(\"\");\n    clearTimeout(timer);\n   }\n```\n\n并且在 `<body>`\
  \ 中：\n\n```\n <button onclick=\"googleIt()\">Google</button>\n   <input type=\"\
  text\" id=\"search\">\n   <button onclick=\"cancel()\">Cancel</button>\n   <br>\n\
  \   <p id=\"para\"></p>\n```\n\n当 HTML 页面加载时，它会显示一个标记为 `Google` 的按钮、一个文本字段以及另一个标记为\
  \ `Cancel` 的按钮。\n\n当点击第一个按钮时，它会调用 `googleIt()` 函数。该函数调用 `display` 来寻找 id 为 `para`\
  \ 的 `Element`（该段落最初是为空的），并将其内容设置为“Going to Google in 5 seconds.”的文本。然后，`googleIt()`\
  \ 函数找到 id 为 `search` 的文本字段，并将其文本获取到名为 `term` 的变量中。最后，`googleIt` 会设置一个定时器，在 5 秒后（5000\
  \ 毫秒后）使用参数 `term` 调用 `google` 函数。\n\n> **注意**：只有在浏览器允许的情况下，此操作才会生效，这取决于浏览器的设置。\n\
  \n如果在五秒内点击了 `Cancel` 按钮，`cancel` 方法将擦除 id 为 `para` 的段落中的文本，然后取消定时器（其 id 已保存在全局变量\
  \ `timer` 中）。因此，定时器事件不会发生，`google()` 也不会被调用。\n\n如果没有点击 `Cancel` 按钮，`google` 函数将尝试打开浏览器标签页访问\
  \ [google.com](https://google.com)，并将搜索词作为参数传递传递，并将窗口 id 保存到名为 `win2` 的全局变量中。\n\n\
  > **注意**：附加在 URL 后的 `?` 以 `name`=`value` 键对的形式向服务器提供。多个 `name`=`value` 对通过 ampersands\
  \ (`&`）分隔。Google 识别的名称中，包括 `q` 表示“query”（查询）。\n\n### 4.5.2 Document 对象\n\n`document`\
  \ 代表一个 HTML 页面。\n\n名称 `window` 指向显示 HTML 的窗口；`window.document` 指向窗口中的 HTML（或更准确地说，是代表该\
  \ HTML 的 `Node` 树）。文档属性和方法必须以 `document.` 为前缀。\n\n构造函数 `new Document()` 将返回一个新的\
  \ HTML 页面，包含一个空的 head 和 body。\n\n#### 4.5.2.1 文档属性\n\n以下是 `document` 的一些属性：\n\n\
  *   `document.documentElement` — 一个 `HTMLHtmlElement`，其 `innerHTML` 是 `<html>` 标签的文本。\n\
  \n*   `document.head` — 一个 `HTMLHeadElement`，其 `innerHTML` 是文档中 `<head>` 部分的文本。\n\
  \n*   `document.body` — 一个 `HTMLBodyElement`，其 `innerHTML` 是文档中 `<body>` 部分的文本。\n\
  \n*   `document.title` — 文档标题。\n\n*   `document.URL` — 只读的文档 URL。\n\n*   `document.bgColor`\
  \ — 文档的背景颜色。\n\n*   `document.fgColor` — 文档的前景颜色。\n\n*   `document.links` — 文档中的链接集合。\n\
  \n*   `document.images` — 文档中的图像集合。\n\n*   `document.links` — 文档中的超链接集合。\n\n*  \
  \ `document.forms` — 文档中的表单集合。\n\n*   `document.scripts` — 文档中的脚本集合。\n\n*   `document.cookie`\
  \ — 文档的 Cookie。\n\n*   `document.domain` — 文档的域名。\n\n*   `document.referrer` — 指向来源页面的\
  \ URL。\n\n*   `document.characterSet` — 文档字符集。\n\n*   `document.write()` — 向文档写入内容的方法。\n\
  \n*   `document.open()` — 打开一个新的文档流。\n\n*   `document.close()` — 关闭文档流。\n\n*   `document.clear()`\
  \ — 清除整个文档的内容。\n\n*   `document.replaceChild()` — 替换子节点。\n\n*   `document.insertBefore()`\
  \ — 插入一个子节点。\n\n*   `document.createElement()` — 创建一个新的元素节点。\n\n*   `document.createTextNode()`\
  \ — 创建一个新的文本节点。\n\n*   `document.importNode()` — 从另一个文档导入节点。\n\n*   `document.importDocument()`\
  \ — 从另一个文档导入文档。\n\n*   `document.createDocumentFragment()` — 创建一个新的文档片段。\n\n*  \
  \ `document.createRange()` — 创建一个新的范围对象。\n\n*   `document.createSelection()` — 创建一个新的选择对象。\n\
  \n*   `document.createComment()` — 创建一个新的注释节点。\n\n*   `document.createDocumentType()`\
  \ — 创建一个新的文档类型。\n\n*   `document.createTextSection()` — 创建一个新的文本节。\n\n*   `document.createDataNode()`\
  \ — 创建一个新的数据节点。\n\n*   `document.createEntityNode()` — 创建一个新的实体节点。\n\n*   `document.createEntityReferenceNode()`\
  \ — 创建一个新的实体引用节点。\n\n*   `document.createCDATASectionNode()` — 创建一个新的 CDATA 节点。\n\
  \n*   `document.removeChild()` — 移除一个子节点。\n\n*   `document.appendChild()` — 添加一个子节点。\n\
  \n*   `document.replaceChild()` — 替换子节点。\n\n*   `document.insertBefore()` — 插入一个子节点。\n\
  \n*   `document.cloneNode()` — 克隆节点。\n\n*   `document.getElementsByTagName()` —\
  \ 获取所有指定标签元素的集合。\n\n*   `document.getElementsByClassName()` — 获取具有指定类名的元素的集合。\n\n\
  *   `document.getElementById()` — 获取具有指定 id 的元素。\n\n*   `document.querySelector()`\
  \ — 根据 CSS 选择器获取第一个匹配元素。\n\n*   `document.querySelectorAll()` — 根据 CSS 选择器获取所有匹配元素的列表。\n\
  \n#### 4.5.2.2 查找节点\n\n为了操作 DOM，必须找到特定的元素。例如，有几种方法可以实现：\n\n*   `document.getElementById(id)`\
  \ — 获取指定 id 的元素。\n\n*   `document.getElementsByTagName(tagName)` — 获取所有指定标签元素的动态集合。\n\
  \n*   `document.getElementsByClassName(className)` — 获取具有指定类名的元素的动态集合。\n\n*   `document.querySelector(selector)`\
  \ — 根据 CSS 选择器获取文档中的第一个匹配元素。\n\n*   `document.querySelectorAll(selector)` — 获取文档中所有匹配\
  \ CSS 选择器的元素列表。\n\n一些选择器如下：\n\n*   `tagName` — 选择所有指定标签的元素。\n\n*   `#id` — 选择指定\
  \ id 的唯一元素。\n\n*   `.className` — 选择具有指定类名的所有元素。\n\n*   `tagName.className` — 选择具有指定标签且具有指定类名的元素（已弃）。\n\
  \n*   `*` — 选择所有元素。\n\n*   `selector1, selector2` — 选择所有类型为 `selector1` 和 `selector2`\
  \ 的元素。\n\n*   `selector1 > selector2` — 选择作为 `selector1` 元素的直接子 `selector2` 元素。\n\
  \n*   `selector1 selector2` — 选择作为 `selector1` 元素的后代的 `selector2` 元素。\n\n*   `selector1\
  \ ~ tagName2` — 选择所有作为 `selector1` 元素后续兄弟的 `tagName2` 元素。\n\n*   `selector1 + selector2`\
  \ — 选择紧跟在 `selector1` 元素之后的 `selector2` 元素。\n\n\n\n\n\n* `document.forms` — 所有 `<form>`\
  \ 元素的列表。\n* `document.images` — 所有 `<<<img>` 元素的列表。\n* `document.links` — 所有超链接的列表（带有\
  \ `href` 属性的 `<a>` 和 `<area>` 元素）。\n* `document.scripts` — 所有 `<script>` 元素的列表。\n\
  \n#### 4.5.2.3 创建节点\n\n你已经学习了用于查找节点的文档方法。这里是一些创建节点的方法。\n\n* `document.createElement(tagName)`\
  \ — 返回一个具有给定 `tagName` 的新 `Element`。\n* `document.createAttribute(name)` — 返回一个具有给定\
  \ `name` 的新属性。稍后可以为其赋值值。\n* `document.createComment(text)` — 返回一个具有给定 `text` 的新注释节点。\n\
  * `document.createTextNode(text)` — 返回一个具有给定 `text` 的新 `Text` 文本节点。\n* `node.cloneNode(deep)`\
  \ — 返回 `node` 的副本；如果 `deep` 为 `true`，则所有祖先节点（`node` 的完整子树）也会被复制。\n\n一旦创建了节点，就可以使用\
  \ `Node` 方法将其添加到文档中。\n\n### 4.5.3 节点对象\n\n如前所述，HTML 页面上的所有内容在 DOM 中都有表示，并且可以通过名为\
  \ `document` 的变量访问，该类型为 `Document`。`Document` 类是 `Node` 类的子类。`Node` 的其他子类是 `CharacterData`、`Element`\
  \ 和 `Attr`。\n\n类型层次庞大且复杂。幸运的是，通常将 DOM 视为 `Node` 树就足够了，其中大部分是 `Element`。最有用的是 `document.body`，它是整个\
  \ `<body>` 子树的根。\n\n#### 4.5.3.1 节点属性\n\n这里是 `Node`的一些属性：\n\n* `parentNode`、`firstChild`、`nextSibling`、`previousSibling`\
  \ 和 `lastChild` 是只读属性，允许从一个 `Node` 移动到另一个。\n* `ownerDocument` — `Node` 所属的 `Document`。\n\
  * `nodeType` 是表示节点类型的整数。共有 12 类型；`1` 代表元素，`2` 代表属性，`3` 代表文本，`9` 代表文档，以及其他几种。\n*\
  \ `children` — 该节点所有为 `Element` 类型的子节点的动态 `HTMLCollection`。不包含其他节点类型。\n* `childNodes`\
  \ — 该节点所有所有子节点（不分类型）的动态 `NodeList`。\n* `textContent` — `Node` 及其所有后代的完整文本，去除了 HTML\
  \ 标签。换句话说，就是在屏幕上看到的无样式文本。\n\n> **注意**：替换 `Element` 的 `innerHTML` 会导致新文本被解析为 HTML，而替换其\
  \ `textContent` 则将导致新文本按原样显示。\n\n#### 4.5.3.2 节点方法\n\n节点可以添加、替换或删除。这里是 `Node` 的一些方法：\n\
  \n* `node.before(sibs)` — 在 `node` 之前将 `sibs` 作为兄弟节点（相同节点的节点）插入。\n* `node.prepend(children)`\
  \ — 在任何现有子节点之前，将 `children` 作为 `node` 的子节点插入。\n* `node.append(children)` — 在任何现有子节点之后，将\
  \ `children` 作为 `node` 的子节点插入。\n* `node.after(sibs)` — 在 `node` 之后将 `sibs` 作为兄弟节点（相同节点的节点）插入。\n\
  * `node.replaceWith(replacements)` — 用若干替换节点或字符串替换 `node`。\n* `node.remove()` —\
  \  `node`。\n\n在上述操作中，参数（`sibs`、`children`、`replacements`）可以是一个或多个节点或字符串。字符串将作为文本节点插入。\n\
  \n移除或替换节点也会移除或替换该节点的所有后代。\n\n### 4.5.4 元素\n\nHTML 页面中的每个标签在 DOM 树中都由一个 `Element`\
  \ 对象表示，标签中的每个属性由 DOM 中的一个 `Attribute` 对象表示。对 DOM 对象的修改会立即反映在 HTML 页面的显示上。\n\n####\
  \ 4.5.4.1 元素属性\n\n这里是 `Element`的一些属性：\n\n* `element.tagName` — 标签的只读名称，全大写形式（例如\
  \ `\"HEAD\"`）。\n* `element.innerHTML` — 开始标签和结束标签之间的文本。\n* `element.outerHTML` —\
  \ 由开始标签、`innerHTML` 和结束标签组成的字符串。\n* `element.attributes` — `element` 属性的 `NamedNodeMap`（见下文）。\n\
  \n`NamedNodeMap` 是 `Attr` 对象的动态集合。（尽管名字这么说，但它是 `NamedNodeMap` 中唯一一种 `Node` 类型）。它是类数组的，但*不是*数组。它有一个\
  \ `length` 属性，并且可以像数组一样进行索引。\n\n#### 4.5.4.2 元素方法\n\n这里是 `Element` 的一些方法：\n\n* `element.hasAttributes()`\
  \ — 如果 `element` 具有属性则返回 `true`。\n* `element.getAttributeNames()` — 属性名称的数组（可能为空）。\n\
  * `element.getAttribute(name)` — 返回命名属性的值。\n* `element.setAttribute(name, value)`\
  \ — 添加或更新命名属性的值。\n* `element.removeAttribute(name)` — 移除命名属性。\n* `element.getElementsByTagName(tagName)`\
  \ — 在元素内搜索。\n* `element.getElementsByClassName(className)` — 在元素内搜索。\n* `element.querySelector(selector)`\
  \ — 返回第一个匹配元素。\n* `element.querySelectorAll(selector)` — 返回所有匹配元素。\n\nHTML 文本可以通过以下方法解析并插入\
  \ DOM：\n\n* `element.insertAdjacentHTML(where, html)` — 解析 `html` 并将结果插入到字符串 `where`\
  \ 指定的位置，`where` 为以下之一：\n\n    * `\"beforebegin\"` — `element` 之前。\n    * `\"afterbegin\"\
  ` — 作为 `element` 的第一个子节点。\n    * `\"beforeend\"` — 作为 `element` 的最后一个子节点。\n    *\
  \ `\"afterend\"` — `element` 之后。\n\n### 4.5.5 CharacterData\n\n有三种 `CharacterData`\
  \ 类型：`Text`、`Comment` 和 `ProcessingInstruction`（此处未介绍）。它们具有 `Node` 的所有属性和方法，外加：\n\
  \n* `data` — 文本内容。\n* `length` — 文本的字符数。\n* `nodeName` — 字符串 `\"#text\"`。\n* `appendData(data)`\
  \ — 在文本末尾添加 `data`。\n* `insertData(offset, data)` — 在给定的 `offset` 处向文本插入 `data`。\n\
  * `deleteData(offset, count)` — 从给定的 `offset` 开始从文本中删除 `count` 个字符。\n* `replaceData(offset,\
  \ count, data)` — 用 `data` 替换从 `offset` 开始的 `count` 个字符。\n* `substringData(offset,\
  \ count)` — 返回从 `offset` 开始的 `count` 个字符。\n* `remove()` — 从 de DOM 树中移除该节点。\n\n\
  ### 4.5.6 示例：ShowTree\n\n下面的 HTML 页面在点击按钮时，会将完整的 `Element` 树写入控制台，尽管文本经过了严重压缩。必须打开控制台才能看到结果。\n\
  \n\n\n\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n  <title>showTree Example</title>\n\
  \n  <script>\n  function abbreviate(str) {\n    let oneLine = str.replaceAll(/\\\
  s+/g, \" \").trim();\n    if (oneLine.length <= 45) return oneLine;\n    return\
  \ \"'\" + oneLine.substr(0, 30) +\n     \" … \" + oneLine.substr(-8, 10) + \"'\"\
  ;\n  }\n\n  function onlyWhitespace (str) {\n    return /^\\s+$/.test(str);\n  }\n\
  \n  function showTree(e, indent=\"\") {\n    let s = indent + e.nodeName + \" \"\
  ;\n    if (e instanceof CharacterData) {\n      if (onlyWhitespace(e.textContent))\
  \ {\n        s += \"[whitespace] \";\n      } else {\n        s += abbreviate(e.textContent);\n\
  \      }\n    }\n    if (e.hasAttributes) {\n      let attrs = e.attributes;\n \
  \     for (let i = 0; i < attrs.length; i += 1) {\n        if (attrs[i].value !=\
  \ null) {\n          s += attrs[i].name + \":\" +\n            attrs[i].value +\
  \ \" \";\n        }\n      }\n    }\n    if (e.innerHTML) {\n      s += abbreviate(e.innerHTML);\n\
  \    }\n    console.log(s);\n    for (node of e.children) {\n      showTree(node,\
  \ indent + \"| \");\n    }\n  }\n  </script>\n</head>\n\n<body>\n  <!-- Steve Jobs\
  \ quote -->\n  <p><i>Everyone</i> should learn how to program\n  a computer because\
  \ it teaches you how to think.</p>\n  <button onclick=\"showTree(document)\"> Show\
  \ Tree</button>\n</body>\n</html>\n```\n\n第 51 行定义了一个按钮，点击时它将带有 `document` 节点调用\
  \ `showTree` 方法。\n\n在第 19 行，`showTree` 开始创建字符串 `s`，该字符串以一些缩进和参数的 `tagName` 开始。\n\
  \n第 20 行测试参数是否为 `CharacterData`（无论是 `Text` 或 `Comment`）。如果是，则向 `s` 添加文本的缩写版本，或者指示该文本完全由空白字符组成。如上所示，配合第\
  \ 40 行的 `e.children`，这段代码永远不会被使用（但见下文）。\n\n第 27 行到 35 行检查参数是否有属性，如果有，则将其添加到字符串 `s`\
  \ 中。\n\n第 36 行到 38 行如果节点有 `innerHTML`，则添加其缩写版本，并在第 39 行显示结果。\n\n`innerHTML` 的缩写是由第\
  \ 7 行到 12 行完成的。这种缩写防止了输出比原始 HTML 长很多倍。\n\n第 40 行到 42 行获取参数节点 `e` 的 `children`，它们都是\
  \ `Element`，并带有一些缩进进行递归。结果如下：\n\n```\ndocument\n| HTML <head><title>showTree Example\
  \ …</body>'\n| HEAD <title>showTree Example …</title>'\n| TITLE showTree Example\n\
  | SCRIPT 'function abbreviate(str) { let … } }'\n| BODY '<!-- Steve Jobs quote -->\
  \ <p><i>Everyone</i> should learn … think.'\n| BUTTON onclick:showTree(document)\n\
  ```\n\n上面的重复是因为元素包含其他元素。例如，`showTree` 位于 `TITLE` 标签中，而该标签又位于 `HEAD` 标签中，所以它显示了三次。如果将第\
  \ 40 行的 `e.children` 替换为 `e.childNodes`，那么 `e` 的所有子节点将被打印。这包括 `Text` 节点。\n\n`innerHTML`\
