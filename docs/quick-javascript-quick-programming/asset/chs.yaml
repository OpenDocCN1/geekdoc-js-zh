  \ HTML 长很多倍。\n\n\n\n\n\nJavaScript 方法 `Math.min` 和 `Math.max` 分别接受任意数量的参数；它们*不*接受数组。然而，展开运算符（`...`）可以将数组转换为值序列，因此\
  \ `Math.min(...array)` 和 `Math.max(...array)` 可以可以正常工作。\n\n# 附录 B：高阶方法\n\n许多内置数组方法接受函数作为参数。箭头函数经常被用作参数，尽管也可以使用其他方式定义的函数。在下文中，我们用\
  \ `f` 表示接受一个参数的函数，用 `f2` 表示接受两个参数的函数。\n\n*   `array.sort(f2)` — 原地排序数组并返回排序后的数组。如果\
  \ `f2(x, y)` 返回负值，则 `x` 被认为小于 `y`；如果为 0，则两者相等；如果为正值，则 `x` 大于 `y`。\n    *   例如，`a.sort((x,\
  \ y) => x - y))` 按数字升序排序数组 `a`。\n*   `array.forEach(f)` — 为 `array` 中的每个元素调用函数 `f`。为了使其有用，`f`\
  \ 应该具有副作用，因为 `f` 返回的任何值都会被忽略。\n*   `array.find(f)` — 查找并返回 `array` 中第一个让 `f` 返回真值的元素（如果未找到则返回\
  \ `undefined`）。\n*   `array.findIndex(f)` — 查找并返回 `array` 中第一个让 `f` 返回真值的元素的索引（如果未找到则返回\
  \ `-1`）。\n*   `array.map(f)` — 将 `f` 应用于 `array` 的每个元素，返回一个包含结果的数组。如果存在空位（holes），会被保留。\n\
  *   `array.flatMap(f)` — 将 `f` 应用于 `array` 的每个元素。如果生成的数组是多维的，则移除一层嵌套，将所有值提升到下一个高层。\n\
  *   `array.filter(f)` — 返回一个数组，其中包含 `array` 中所有且仅包含 `f` 返回真值的值。\n*   `array.reduce(f2,\
  \ initial)` — 给定有两个参数的函数 `f2`，将 `f2` 应用于 `initial` 和 `array` 的第一个元素，然后将 `f2` 应用于该结果和第二个元素，依此类推，最终得到一个值。\n\
  \    *   如果 `array` 为空，则返回 `initial`。\n    *   如果确定 `array` 非空，则可以省略 `initial`。\n\
  \    *   例如，`array.reduce((x, y) => x + y)` 返回 `array` 中所有元素的和。\n*   `array.reduceRight(f2)`\
  \ — 与 `reduce` ，但是从右到左而不是从左到右工作的。\n*   `array.some(f)` — 如果数组包含至少一个让 `f` 返回真值的元素，则返回\
  \ `true`。\n    *   `array.every(f)` — 如果数组中的每个元素让 `f` 都返回真值，则返回 `true`。\n\n# 附录\
  \ C：字符串方法\n\n这里是字符串的一些重要方法。字符串是*不可变的*（不能被修改），因此所有字符串方法都会返回一个新的字符串。\n\n*   `string.charAt(n)`\
  \ — 返回字符串的第 `n` 个字符。与 `string[n]` 相同。\n*   `string.charCodeAt(n)` — 返回字符串中第 `n`\
  \ 个字符的数值 Unicode 值。\n*   `string.concat(string1, …,, stringN)` — 返回所有给定字符串的拼接。\n\
  *   `string.fromCharCode(c1, …,, cN)` — 从给定的数值 Unicode 值创建字符串。\n*   `string.includes(substr)`\
  \ — 如果 `substr` 作为 `string` 的子字符串出现，则返回 `true`，否则返回 `false`。\n*   `string.includes(substr,\
  \ start)` — 如果 `substr` 从 `start` 或之后作为 `string` 的子字符串出现，则返回 `true`，否则返回 `false`。\n\
  *   `string.indexOf(substring)` — 返回 `substring` 在 `string` 中第一个字符的位置，如果未找到则返回 `-1`。\n\
  *   `string.indexOf(substring, start)` — 返回 `substring` 在 `string` 中从位置 `start`\
  \ 或之后开始的第一个字符的位置，如果未找到则返回 `-1`。\n*   `string.lastIndexOf(substring)` — 返回 `substring`\
  \ 在 `string` 中最后一次出现处的第一个字符的位置，如果找不到子字符串则返回 `-1`。\n*   `string.lastIndexOf(substring,\
  \ start)` — 返回 `substring` 在 `string` 中在位置 `start` 或之前之前的最后一次出现处的第一个字符的位置，如果找不到子字符串则返回\
  \ `-1`。\n*   `string.match(regexp)` — 返回一个包含正则表达式匹配结果的数组，如果没有找到匹配项则返回 `null`：\n\
  \    *   如果设置了标记 `g`，数组包含匹配的子字符串。\n    *   如果未设置 `g`，数组 `0` 包含匹配的文本以及括号内的子表达式。`index`\
  \ 属性给出第一次匹配的位置。\n*   `string.padEnd(length, string2)` — 向 `string` 的末尾添加来自 `string2`\
  \ 的字符，重复次数所需的直到形成一个长度为 `length` 的新字符串。如果省略，`string2` 默认为空格。如果 `string` 的长度已经达到 `length`\
  \ 或更大，则结果就是 `string` 本。\n*   `string.padStart(length, string2)` — 向 `string` 的开头添加来自\
  \ `string2` 的字符，重复次数所需的直到形成一个长度为 `length` 的新字符串。如果省略，`string2` 默认为空格。如果 `string`\
  \ 的长度已经达到 `length` 或更大，则结果就是 `string` 本。\n*   `string.repeat(n)` — 返回一个由 `n` 个 `string`\
  \ 拷贝组成的字符串。\n*   `string.replace(target, replacement)` — 返回一个字符串，其中 `target` 的第一次出现处已被\
  \ `replacement` 替换。\n    *   `target` 可以是字符串或正则表达式。如果正则表达式设置了 `g` 标记，则替换所有出现的 `target`。\n\
  \    *   `replacement` 可以是一个单参数函数的名称（*不是*方法）。该函数被应用于匹配的 `target` 以获取实际的替换值。\n* \
  \  `string.replaceAll(target, replacement)` — 与 `replace` 相似，区别是替换所有 `target` 出现处。如果\
  \ `target` 是正则表达式，*必须*使用 `g` 标记 (!)。\n*   `string.search(target)` — 返回匹配字符串或正则表达式\
  \ `target` 的字符串第一个字符的索引，如果找不到此类字符串则返回 `-1`。\n*   `string.slice(start, end)` — 返回从位置\
  \ `start` 开始到 `end-1` 结束的字符串子串。如果省略 `end`，则返回 `start` 之后的所有字符。参数 `start` 和 `end`\
  \ 可以为负数：`-1` 是 `string` 的最后一个字符，`-2` 是倒数第二个，依此类推。\n*   `string.split(string2)` —\
  \ 使用 `string2` 作为分隔符将 `string` 分割成子字符串，并返回结果数组。如果 `string2` 是空字符串，则返回字符数组。可以使用正则表达式代替\
  \ `string2`。\n*   `string.substr(start, length)` — 返回从 `string` 位置 `start` 开始的最多\
  \ `length` 个字符的子字符串。如果剩余字符少于 `length`，将返回所有剩余字符。参数 `start` 可以为负数：`-1` 是 `string`\
  \ 的最后一个字符，`-2` 是倒数第二个，依此类推。\n\n\n\n\n\n*   `string.substring(start, end)` — 返回 `string`\
  \ 中从位置 `start` 开始、到位置 `end-1` 处结束的子字符串。如果省略了 `end`，则返回 `start` 处及之后的所有字符。负索引被视为零。\n\
  *   `string.toLowerCase()` — 返回 `string` 的小写版本。\n*   `string.toUpperCase()` — 返回\
  \ `string` 的大写版本。\n*   `string.trim()` — 返回一个去除了开头和结尾空白的字符串。\n*   `string.trimEnd()`\
  \ 或 `string.trimRight()` — 返回一个去除了结尾空白的字符串。\n*   `string.trimStart()` 或 `string.trimLeft()`\
  \ — 返回一个去除了开头空白的字符串。\n\n# 附录 D：正则表达式\n\n每种语言可能会添加自己的特色，但基础正则表达式在各种语言中都是非常标准的。在正则表达式内部可能包含以下内容：\n\
  \n*   `Literals`（字面量）是代表自身的字符。示例包括字母、数字和空白字符。正则表达式 `/cat/` 将尝试匹配单词“cat”的出现。\n* \
  \  `Metacharacters`（元字符）是在正则表达式中具有特殊含义的字符。元字符有：`\\ | ( ) [ { ^ $ * + . ?` \n*  \
  \ `Escaped characters`（转义字符）是前面带有反斜杠的字符，以便将其作为字面量而非元字符使用，或者因为它们难以用其他表示。例如，问号在正则表达式中有特殊含义，所以如果你想让它仅表示字面字符，必须对其进行转义：`\\\
  ?`\n\n[Table A.1] 列出了元字符及其含义。\n\n### 表格 A.1\n\n| 表达式 | 含义 | 示例 | 解释 |\n| --- | ---\
  \ | --- | --- |\n| 字面字符 | 相同的字符 | `M` | 大写字母 `M` |\n| `XY` | 一个 `X` 后紧跟一个 `Y` |\
  \ `cat` | 按顺序的三个字符 `c a t` |\n| `[XYZ]` | `X`、`Y` 或 `Z` 中的任意一个字符 | `b[aeiou]g` |\
  \ 单词 `bag`、`beg`、`big`、`bog` 或 `bug` 中的其中一个 |\n| `[X-Y]` | `X` 和 `Y` 之间的任意字符（包含边界）\
  \ | `[0-9][a-zA-Z]` | 任意数字；任意字母 |\n| `[^X-Y]` | 不在 `X` 和 `Y` 之间的任意字符（包含边界） | `[^a-zA-Z]`\
  \ | 任意非字母 |\n| `X*` | `X` 的零次或多次出现 | `\\s*` | 任意数量的空白 |\n| `X+` | `X` 的一次或多次出现 |\
  \ `\\s+` | 至少一个空白字符 |\n| `X?` | 可选的 `X` | `dogs?` | `dog` 或 `dogs` |\n| `X{n,m}`\
  \ | `X` 的 `n` 到 `m` 次出现 | `his{2,4}` | `hiss` 或 `hisss` 或 `hissss` |\n| `X{n,}`\
  \ | `X` 的 `n` 次或更多出现 | `his{2,}` | `hiss` 或 `hisss` 或 `hissss`，依此类推 |\n| `X{n}`\
  \ | `X` 恰好 `n` 次出现 | `his{2}` | Hiss |\n| `X|Y` | `X` 或 `Y` | `The (boy|girl)` |\
  \ `The boy` 或 `The girl` |\n| `^X` | 字符串开头的 `X` | `^[A-Z]` | 首大写字母（`^` 本身匹配空字符串）\
  \ |\n| `X$` | 字符串结尾的 `X` | `[\\.\\?!]$` | 以句、问号或感叹号结尾（`$` 本身匹配空字符串） |\n| `\\b` |\
  \ 单词字符 `(\\w)` 和非单词字符 (`\\W`) 之间的空字符串 | `\\bC\\b` | 语言中的单词 `C` |\n| `\\B` | 不在单词字符\
  \ (`\\w`) 和非单词字符(`\\W`) 之间的空字符串 | `un\\B` | 单 healthy、undulate 等单词的开头部分 |\n| `(?=pat)`\
  \ | 正向先行断言，确保模式 `pat` 将匹配后续，但不将其计入匹配部分 | `\\w+(?= )` | 一个单词，前提是后面跟着一个空格 |\n| `(?!pat)`\
  \ | 反向先行断言，确保模式 `pat` 将不会匹配后续 | `\\w+(?!- )` | 一个单词，前提是后面不是跟着连字符 |\n| `(X)` | 将表达式\
  \ `X` 分组为一个单元，并记住它匹配的内容 | `(\\/\\/.*$)` | `//` 风格的注释（留作稍后参考） |\n| `(?:X)` | 将表达式\
  \ `X` 分组为一个单元，但不记住它匹配的内容 | `(?:\\/\\/.*$)` | `//` 风格的注释（丢弃它） |\n\n*不要在正则表达式中包含额外的空格！*\
  \ 空格是一个字面字符，正则表达式中的空格需要在搜索字符串中也存在一个空格。\n\n`character class`（字符类）代表字符集中的任意一个字符。有几个预定义的字符类：\n\
  \n*   `\\w` 单词字符；等同于 `[a-zA-Z0-9_]`\n*   `\\W` 非单词字符；等同于 `[^a-zA-Z0-9_]`\n*   `\\\
  s` 空白字符\n*   `\\S` 非空白字符\n*   `\\d` 数字；等同于 `[0-9]`\n*   `\\D` 非数字；等同于 `[⁰-9]`\n\
  *   `.` 除换行符以外的任意字符\n\n其他字符类可以使用括号描述。例如，字符类 `[aeiouAEIO]` 可识别元音。\n\n正则表达式后面可以紧跟一个标记。两个重要的标记是\
  \ `g` 表示“全局”，`i` 表示“不区分大小写”。\n\n# 参考文献\n\n*   Crockford, Douglas. *JavaScript: The\
