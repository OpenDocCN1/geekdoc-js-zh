- "# JavaScript 快速编程\n\n\n\n![](img/9781032417561.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  *美国国会图书馆编目出版数据*\n\n\n\n\n\n\n\nLC 记录可用于 [`lccn.loc.gov/2022046807`](https://lccn.loc.gov/2022046807)\n\
  \n\n\n\n\n采用 Minion 字体\n\n由 SPi Technologies India Pvt Ltd (Straive) 设计\n\n*献给我所有的学生*\n\
  \n*过去、现在和未来*\n\n# 作者\n\n我是 David Matuszek，大多数学生称我为“Dave 博士”。\n\n1963 年，我在打卡片上写了我的第一个程序，并立刻就迷上了它。\n\
  \n1970 年，我作为德克萨斯大学奥斯汀分校计算机科学的研究生教了我的第一门计算机课。我最终在那里获得了博士学位，从那以后一直从事教学。诚然，我在工业界待了十多年，即使在那时，我也担任诺瓦瓦大学的兼职教师。\n\
  \n我最终离开了工业界，全职加入诺瓦瓦大学教职员工队伍了几年，然后搬到了宾夕法尼亚大学，在那里，我为从其他学科进入计算机科学的学生指导了一个硕士项目（`MCIT`，计算机与信息技术硕士）。\n\
  \n在我的职业生涯中，我的主要兴趣是人工智能（AI）和编程语言。我用过*很多*编程语言。\n\n我在 2017 年退休了，但我无法停止教学，所以我正在写一系列关于编程和编程语言的“快速入门”书籍。我还写了两本科幻小说，《冰马手》（Ice\
  \ Jockey）和《全真价值》（All True Value），我预计还会写更多。去看看它们吧！\n\n如果你觉得这本书有用，如果你能发表评论将将太棒了。评论，即使是批评性的，也有书籍销售。\n\
  \n而且，嘿，如果你是以前的学生或同事，请给 david.matuszek@gmail.com 给我封邮件。我很期待收到你的消息！\n\n# 前言\n\n如果你是一个想要尽快开始学习\
  \ JavaScript 编程的程序员，这本书是为你准备的。\n\n如果你希望将 JavaScript 作为你的第一门编程语言，这本书是为你准备的。\n\n#\
  \ JavaScript 版本\n\nJavaScript 是一个不断演变的语言。它由一系列名为 `ECMAScript` 的标准定义。\n\n# 第一章 引言\n\
  \nDOI: [10.1201/9781003359609](https://dx.doi.org/10.1201/9781003359609)\n\n## 1.1\
  \ Hello, World!\n\n传统上，一种新语言的第一个程序是输出“Hello, World!”我们将遵循这一传统。\n\n需要的 JavaScript\
  \ 代码是：\n\n```\nalert(\"Hello, World!\");\n```\n\n执行这段代码，我们有几种选择：\n\n*   将其放入网页中并在浏览器中运行。\n\
  *   在 `IDE`（集成开发环境）中运行。\n*   在编辑器应用程序中运行。\n*   在在线 JavaScript 编辑中运行。\n\n## 1.2 浏览器中的\
  \ JavaScript\n\n如果你将以下文本保存在文件中并在浏览器中打开，将弹出一个包含 `Hello, World!` 文本的警告框。\n\n```html\n\
  <!DOCTYPE html>\n   <html>\n    <head>\n     <title>使用 JavaScript</title>\n    </head>\n\
  \    <body>\n     <script>\n      alert(\"Hello, World!\");\n     </script>\n  \
  \  </body>\n   </html>\n```\n\n*   `<!DOCTYPE html>` 标签表示这是一个 HTML 文档。\n*   整个页面封装在\
  \ `<html>` 到 `</html>` 的容器中。以 `</` 开头的标签表示容器的结束。在这个例子中，只有 `!DOCTYPE` 标签不是容器。\n*\
  \   `<title>` 标签包含显示在页面标题栏的文本。\n*   HTML 文档分为两个部分：`<head>` 包含杂项信息，<body>` 包含显示的部分。\n\
  *   `<script>` 标签包含 JavaScript 代码。通常，JavaScript 函数定义在 `<head>` 中的 `<script>` 标签中，并在\
  \ `<body>` 中的 `<script>` 标签或“事件处理程序”中进行调用。\n\n## 1.3 浏览器控制台\n\n\n\n\n\n要运行 JavaScript，你可以使用任何文本编辑器将其包含在\
  \ HTML 页面的 `<script>` 标签中，并将页面加载到任何浏览器中。\n\n这不是编写程序的最佳方式。浏览器的设计初衷是`忽略`错误；毕竟，用户不想看到它们。而你，却想要看到并修正它们。为了这一点，你需要打开浏览器的\
  \ `console`（控制台）。控制台会显示错误信息（以及其他内容）。\n\n打开控制台：\n\n*   在大多数浏览器中：按下 `F12`。\n*   在\
  \ Safari (Macintosh) 中：前往`偏好设置：高级`，并勾选`在菜单栏中显示开发菜单`。完成后，使用 `cmd-opt-C` 显示控制台。\n\n\
  浏览器控制台具有许多辅助编程和调试的功能。这些功能各不相同且需要一些时间学习；本书将不会涵盖这些内容。\n\n## 1.4 运行 JavaScript\n\n\
  有几个 IDE（集成开发环境）可以用于 JavaScript。[Visual Studio Code](https://code.visualstudio.com)\
  \ 可能是最流行的；它是跨平台的且免费的。（不要将其与 Visual Studio 混淆，后者既不是跨平台的也不是免费的。）[NetBeans](https://netbeans.apache.org)\
  \ 和 [Eclipse](https://eclipseide.org)（带有合适的插件）是其他流行的 IDE。\n\n某些编辑器可以配置为命令行运行 JavaScript。这是一种运行单文件\
  \ JavaScript 程序的方便方法。[Sublime Text](https://www.sublimetext.com)（跨平台）和 [Notepad++](https://notepad-plus-plus.org)（Windows\
  \ 和 Linux）就是示例。\n\n另一种选择是使用在线 JavaScript 编辑器。搜索“JavaScript online”可以找到几个工具；[jsfiddle.net](http://jsfiddle.net)\
  \ 是我经常使用的一个。它们在功能上有所不同，但大多数都会显示输出和控制台。由于它们在浏览器中运行，在那里编写的 JavaScript 代码执行文件 I/O 的有限。\n\
  \n最后，所有主流浏览器都有“开发者模式”，可以直接在浏览器中编写和测试代码。\n\n## 1.5 获取输入\n\n有两个函数会请求用户输入：\n\n*   `result\
  \ = prompt(`prompt`, `default`)`\n    *   这会在模态对话框中显示 `prompt`，并为用户提供一个输入文本的地方。第二个参数是可选的；如果提供了，它将显示在字段字段。\n\
  \    *   对话框有两个按钮：`OK`，返回用户的输入内容作为字符串；以及 `Cancel`，返回 `null`。\n*   `result = confirm(`question`)`\n\
  \    *   这会在模态对话框中显示 `question`，并有两个按钮：`OK` 返回 `true`，`Cancel` 返回 `false`。\n\n##\
  \ 1.6 生成输出\n\n有几个函数可以显示你代码的结果。在浏览器中使用时，请记住将你的函数调用放在 `<script>`…`</script>` 标签内。\n\
  \n*   `alert(`arg`)`\n    *   这是查看结果最简单的方法。调用带有任意类型单个参数的 `alert` 将弹出一个包含给定值的对话框。这种方法有两个缺点：对话框是模态的，这意味着在继续计算之前必须先关掉它；而且你一次只能看到一条消息。\n\
  *   `console.log(`args`)`\n    *   如果你打开了控制台，此方法将在其上显示某些内容，但具体显示什么高度取决于实现。它可能会显示由空格或换行符分隔的\
  \ `args`，也可能只显示第一个参数。尝试一下，看看在你偏好的任何控制台中它的效果如何。\n    *   由于 `console.log` 主要用于调试，大多数实现会显示\
  \ `args` 的实际结构，而不使用 `toString` 方法。\n    *   `console` 还有许多其他方法，如 `clear()` 和 `trace()`。实现方式各异。\n\
  *   `document.write(`args`)`\n    *   这将其参数写入 HTML 的 body 中。如果在页面加载时执行，它将把参数直接写入该位置。但如果在\
  \ body 加载后调用 `write`（例如从从函数中调用），该调用将替换整个 HTML body；这可能不是你想要的结果。\n*   `document.writeln(`args`)`\n\
  \    *   它的作用与 `write` 相同，不同在于该方法在最后一个参数之后写入换行符。由于 HTML 会忽略换行符，这几乎没有用处。要获得不被忽略的换行，请编写字符串\
  \ `\"<br>\"`。\n\n`alert` 和 `write` 方法的优点是它们不需要你打开控制台即可查看结果。\n\n# 第 2 章 JavaScript\
  \ 基础知识\n\nDOI: [10.1201/9781003359609-2](https://dx.doi.org/10.1201/9781003359609-2)\n\
  \n本章和第 3 章 将 JavaScript 简单描述为语言，不涉及 Web 编程。它分为两个大部分：\n\n**基础知识**——这一部分旨在让你尽快开始 JavaScript\
  \ 编程。最好的方法就是尝试。\n\n**详细介绍**——这部分涵盖相同的内容，并填补空白。\n\n## 2.1 注释\n\n`//` 引入一个延伸到行行的注释。\n\
  \n多行注释以 `/*` 开始，以 `*/` 结束。在引用的字符串或正则表达式内部，`//` 和 `/*` 没有意义。\n\n## 2.2 数据类型\n\n###\
  \ 2.2.1 原始类型\n\n有八种数据类型：\n\n*   `number` 可以带有或不带有小数点，但所有数字都存储为双精度浮点数。\n*   `bigint`\
  \ 是具有任意位数的整数。\n*   两个 `boolean` 值是 `true` 和 `false`。\n*   `string` 可以包含在单引号、双引号或反引号（``）中。没有“字符”类型。\n\
  *   `symbol` 是一个保证唯一的数值；没有其他值等于它。symbol 是通过调用 `Symbol()` 或 `Symbol(`name`)` 创建的，其中\
  \ `name` 是一个（不一定唯一）值，可能对调试有帮助。\n*   `undefined` 类型有一个值，`undefined`。它是已声明但未赋赋值的变量的值。\n\
  *   `null` 类型有一个值，`null`，意味着该值不存在。\n*   `object` 是任何更复杂的数据类型。函数、数组、集合、映射、正则表达式、错误和日期都是特殊类型的对象。\n\
  \n值的类型可以通过 `typeof` 确定，它可以既用作运算符 `typeof x`，也可以用作函数 `typeof(x)`。它将以字符串的形式返回上述任一类型名称（例如，`\"\
  number\"`）。\n\n上述内容有两个特外情况：\n\n*   `typeof(null)` 的值为 `\"object\"`。这在通常被认为是语言设计中的一个错误。\n\
  *   对于函数以外的任何对象类型，`typeof` 将返回 `\"object\"`。应用于函数时，`typeof` 将返回 `\"function\"`。\n\
  \n### 2.2.2 用户定义对象\n\n`object` 是一组命名值的集合，称为其 `properties`（属性）。你可以通过在大括号内放置 `property`:`value\
  \ 对来定义对象，稍后通过 `object.property` 语法引用这些值。例如，\n\n```javascript\nlet friend = { givenName:\
  \ \"Anna\",\n              surname: \"Lang\" };\nalert(\"Hello, \" + friend.givenName);\n\
  ```\n\n如果属性名称存储在变量中或可以计算，可以通过 `object[expression]` 语法进行访问，例如 `friend[\"given\" +\
  \ \"Name\"]`。\n\n\n\n\n\n测试 `property` `in` `object`（其中 `property` 为字符串），当且仅当 `object`\
  \ 具有该 `property` 时将返回 `true`。对不存在的属性进行请求将得到值 `undefined`。\n\n### 2.2.3 内置对象类型\n\n\
  JavaScript 提供了许多内置或预定义的对象类型。这些数组（arrays）、集合（sets）、映射（maps）、日期（dates）和正则表达式（regular\
  \ expressions）。\n\n### 2.2.4 数组\n\n`array` 是值的有序集合。可以通过在方括号中包含逗号分隔的值来定义 `array literal`（数组字面量）：\n\
  \n```\nlet ary = [\"cat\", \"dog\", \"mouse\"];\n```\n\n逗号可以放在值*之间*也可以放在值*之后*，因此上述赋值完全等于：\n\
  \n```\nlet ary = [\"cat\", \"dog\", \"mouse\", ];\n```\n\n最后一个逗号有时被称为 `trailing\
  \ comma`（尾随逗号）。\n\n数组索引从 0 开始；上述数组的第一个元素是 `ary[0]`，最后一个是 `ary[ary.length – 1]`。\n\
  \n可以通过简单地嵌套数组字面量来创建高维数组：\n\n```\nlet ary2d = [[11, 12], [21, 22]];\n```\n\n在上述赋值后，`ary2d[1]`\
  \ 是 `[21, 22]`，`ary2d[1][0]` 是 `21`。\n\n较少使用的形式是 `Array(values)`：\n\n```\nlet ary\
  \ = new Array(\"cat\", \"dog\", \"mouse\");\n```\n\n这种形式通常不推荐。它的一个奇特性是，如果参数是单一数值\
  \ `Array(n)`，结果是一个包含 `n` 个位置的 `sparse array`（稀疏数组），而不是一个包含单个值 `n` 的数组。\n\n在稀疏数组中，在为元素赋值之前，不会为数组元素分配存储；未赋值的位置将显示为\
  \ `undefined`。稀疏数组可以是任意大的（只有其中的实际值会贡献其大小），但处理起来速度较慢。\n\n数组的 `length` 属性总是最大索引加一。由于数组可能是稀疏的，`length`\
  \ 并不是数组中值的个数。\n\n数组可以从 `iterable types`（可以迭代的类型）中创建。\n\n*   `Array.from(set)` —\
  \ 返回一个包含 `set` 元素的数组。\n*   `Array.from(string)` — 返回一个来自 `string` 的字符数组，每个字符都是字符串。\n\
  *   `Array.from(map)` — 返回一个包含 `[key, value]` 数组的数组。\n*   `Array.from(array)` —\
  \ 返回 `array` 的（浅）拷贝。\n\n数组可以包含不同类型值的混合。\n\n### 2.2.5 集合\n\n`set` 是值的集合，其中：(1) 没有值出现超过一次，(2)\
  \ 值在集合中出现的顺序无关。\n\n操作操作有：\n\n*   `new Set(iter)` — 创建并返回一个包含可迭代对象 `iter`（通常是数组）中值的集合。要创建一个空集合，省略\
  \ `iter`。\n    *   如果 `iter` 是一个 map，结果是一个包含 `[key, value]` 数组的集合。\n*   `set.has(value)`\
  \ — 测试 `value` 是否是 `set` 的成员。\n*   `set.add(value)` — 如果 `value` 尚不存在，则将其添加到 `set`\
  \ 并返回 `set`。\n*   `set.delete(value)` — 如果 `value` 在 `set` 中，则将其删除。`delete` 不返回\
  \ `set`；如果 `value` 在 `set` 中则返回 `true`，否则返回 `false`。\n*   `set.clear()` — 移除 `set`\
  \ 中的所有值并返回 `undefined`。\n*   `set.size` — 返回 `set` 中的元素数量。\n\n### 2.2.6 映射\n\nMaps\
  \ 是查找表。map 中的每个条目由一个键值对组成。键必须是唯一的，但相同的值可以多次。\n\n操作有：\n\n*   `new Map()` — 创建并返回一个空的\
  \ map。\n*   `new Map(array_or_set)` — `array_or_set` 必须由 `[key, value]` 数组组成；这返回一个包含这些键和值的\
  \ map。\n*   `map.has(key)` — 测试 `map` 是否包含给定的 `key`。\n*   `map.set(key, value)`\
  \ — 设置或更改与 `key` 关联的值为 `value` 并返回修改后的 `map`。\n*   `map.get(key)` — 返回与 `key` 关联的值，如果\
  \ `key` 不在 map 中则返回 `undefined`。\n*   `map.delete(key)` — 从 map 中移除 `key` 及其关联的\
  \ `value`。如果 `map` 发生了变化则返回 `true`，如果在 map 中未找到 `key` 则返回 `false`。\n*   `map.clear()`\
  \ — 移除所有值并返回 `undefined`。\n\n### 2.2.7 日期\n\n`Date` 对象表示时间中的某一个时刻，测量为自 Unix 元（1970\
  \ 年 1 月 1 日 00:00:00 UTC）以毫秒数。\n\n要访问 `Date` 对象的特定组件，使用以下方法：\n\n*   `date.getFullYear()`\
  \ 和 `date.setFullYear(year)` — `setFullYear` 也可以接收 `month` 和 `day`。\n*   `date.getMonth()`\
  \ 和 `date.setMonth(month)` — `month` 为 0（1 月）到 11（12 月）。\n*   `date.getDate()` 和\
  \ `date.setDate(day)` — `day` 为 1 到 31。\n*   `date.getHours()` 和 `date.setHours(hours)`\
  \ — `hours` 为 0 到 23。\n*   `date.getMinutes()` 和 `date.setMinutes(minutes)` — `minutes`\
  \ 为 0 到 59。\n*   `date.getSeconds()` 和 `date.setSeconds(seconds)` — `seconds` 为\
  \ 0 到 59。\n*   `date.getMilliseconds()` 和 `date.setMilliseconds(ms)` — `ms` 为 0\
  \ 到 999。\n*   `date.getTime()` 和 `date.setTime(n)` — `n` 是自元以来的毫秒数。\n    *   `Date.now()`\
  \ 也返回自元以来的毫秒数，但比 `new Date().getTime()` 短。\n*   `date.getDay()` 返回 0 到 6，其中 0 代表星期日（无论你在哪里，尽管\
  \ ISO 8601 指定周一为一周的第一天）。\n\n内部，`Dates` 被存储为自元以来的毫秒数。这使得日期运算变得非常简单，因为各种 `set` 方法的参数不受限于\
  \ `get` 方法返回的范围。例如：\n\n```\n let date = new Date();\n let day_of_month = date.getDate();\n\
  \ date.setDate(day_of_month + 100);\n```\n\n会将 `date` 设置为未来精确 100 天的 `Date`，具有正确的月份和年份。\n\
  \n### 2.2.8 正则表达式\n\n正则表达式 `regexp` 定义了一个应用于字符串的模式，用于确定该模式是否匹配字符串，或者在字符串中搜索匹配模式的子字符串。\n\
  \n\n\n\n\n正则表达式在很大程度上是标准的，因此除了极少数特殊的模式外，所有的模式都可以在 JavaScript 中使用。在本节中，我们假设你已经具备正则表达式的知识，仅描述如何在\
  \ JavaScript 中使用它们。对于不熟悉正则表达式的读者，附录 D 中简短的讨论。\n\n正则表达式写在正斜杠之间，后面可以跟上标志位（flags）。例如，`/[a-z]+/gi`\
  \ 是正则表达式 `[a-z]+`，并带有全局 (`g`) 和不区分大小写 (`i`) 标志位。（`[a-z]+` 将匹配任何小写字母序列。）\n\n括号用于对正则表达式的部分进行分组。组从左到右编号，从\
  \ `1` 开始；找到组编号的简单方法是只计算左（开启）括号的数量。组 `0` 是整个匹配部分。例如，在模式中：\n\n```javascript\n a =\
  \ \"Call 1-800-555-1212 today!\"\n b = /1-800-((\\d\\d\\d)-(\\d\\d\\d\\d))/\n //\
  \ 0 12 3\n c = a.match(b)\n```\n\n结果将是：\n\n```\n c[0] = \"1-800-555-1212\"\n c[1]\
  \ = \"555-1212\"\n c[2] = \"555\"\n c[3] = \"1212\"\n```\n\n可以使用以下方法应用正则表达式：\n\n\
  *   `string`.search(`regexp`)` — 返回 `string` 中匹配 `regexp` 的第一个子字符串的起始索引，如果没有找到，则返回\
  \ `null`。如果存在全局修饰符 `g`，它会被忽略。\n*   `string`.replace(`regexp`,` replacement`) — 在\
  \ `string` 中搜索 `regexp`，如果找到，则将其替换为 `replacement`。如果存在全局修饰符 `g`，该方法将所有的 `regexp`\
  \ 出现替换为 `replacement`。\n    *   如果 `regexp` 包含分组，则 `replacement` 可以使用 `$1` 表示第一个匹配组，使用\
  \ `$2` 表示第二个匹配组，依此类推。\n*   `string`.match(`regexp`)` — 在 `string` 中搜索 `regexp` 并返回一个数组。\n\
  \    *   如果设置了 `g` 标志，`match` 返回匹配的子字符串数组，如果没有找到匹配，则返回 `null`。\n    *   如果没有设置 `g`\
  \ 标志，`match` 返回一个数组，其第一个元素是（第一个）匹配的子字符串，其余元素（如果有）是 `regex` 中每个括号分组匹配的子字符串。参见本节开头的示例。\n\
  *   `string`.matchAll(`pattern`)` — 在 `g` 标志下，`matchAll` 为 `string` 中匹配 `pattern`\
  \ 的每个子字符串返回一个迭代器。这非常便于配合 `for/of` 循环使用。\n*   `string`.split(`regexp`)` — 返回 `string`\
  \ 的子字符串数组，其中 `regexp` 的每次出现都会分隔 `string` 中的子字符串。\n\n以下是 `regexp` 的方法而非 `string`\
  \ 的方法：\n\n*   `regexp`.exec(`string`)` — 在 `string` 中搜索 `regexp` 并记住它在 `string`\
  \ 中的位置。\n    *   该方法设计用于在循环中使用。如果设置了 `g` 标志，每次调用 `exec` 都将返回下一个匹配的子字符串，在没有剩余项时返回\
  \ `null`。在返回 `null` 后，`regex` 将重置并可以再次使用。\n    *   如果没有设置 `g` 标志，`exec` 的行为类似于未设置\
  \ `g` 标志的 `match`。\n*   `regexp`.test(`string`)` — 如果 `regexp` 在 `string` 某处匹配，则返回\
  \ `true`，否则返回 `null`（注：此处原文为 null，通常 JS 中返回 false）。\n\n## 2.3 标识\n\n标识由字母、数字、下划线和美元符号组成。标识不能以数字开头。\n\
  \n## 2.4 var\n\n在比较不同类型时，JavaScript 尝试将它们转换为数字。尽管 `undefined` 转换为 `NaN` 且 `null`\
  \ 转换为 `0`，但 `undefined==null` 仍然是 `true`。\n\n## 2.5 let 和 const\n\n现代声明变量的方式是 `let`。旧式使用\
  \ `var` 应该被避免。\n\n*   如果 `var` 声明了但没有赋值，它具有特殊值 `undefined`。\n*   如果 `var` 声明了多次，不会抛出错误：\n\
  \n```javascript\n var x = 1;\n var x = 2; // x 现在是 2\n```\n\n*   如果 `var` 声明在函数内部，它是局部的：\n\
  \n```javascript\n function foo() {\n  var x = 1;\n}\n```\n\n*   如果 `var` 声明在函数外部，它是全局的：\n\
  \n```javascript\n var x = 1;\n```\n\n## 2.6 运算符\n\n这里是数字最常用的运算符：\n\n*   `+` 加法\n\
  *   `-` 减法或一元负\n*   `*` 乘法\n*   `/` 除法，产生浮点结果\n*   `%` 余数（模）\n*   `**` 幂\n\n布尔值常用的运算符：\n\
  \n*   `&&` 与\n*   `||` 逻辑\n*   `!` 非\n\n比较运算符，产生布尔值结果：\n\n*   `<` 小于\n*   `<=` 小于或等于\n\
  *   `==` 等于\n*   `===` 严格相等（相等且类型相同）\n*   `!=` 不等于\n*   `!==` 严格不相等（不同类型或值）\n* \
  \  `>=` 大于或等于\n*   `>` 大于\n\n> **注意**：比较不同类型的值时，JavaScript 会尝试将它们转换为数字。如果其中一个或两个值可能是\
  \ `null` 或 `undefined`，请不要比较它们；请先使用 `===` 进行检查，这是总是安全的。\n\n> \n\n> **注意**：与几乎所有语言一样，比较两个浮点数的相等性是不明智的。例如，`11*(100/11)`\
  \ 不等于 `100`，因为它们在第 14 位小数处不同。一种潜在的解决方法是使用方法 `.toFixed(`n``)，它将返回一个带有 `n` 位小数的字符串，然后进行字符串比较。\n\
  \n字符串拼接：\n\n*   `+` 拼接（连接）两个字符串，或一个字符串与任何其他值。\n\n\n\n\n算术比较运算符也可以用于字符串，从而提供字典顺序排序。所有大写字母都在所有小写字母之前，因此\
  \ `\"Cat\" < \"cat\"`。\n\n### 赋值：\n\n- `=`: ***赋值运算符***——可以用作表达式；该表达式的值就是被赋值的值。\n\
  \nJavaScript 还有 `+` 和 `-` 一元运算符。当 `+` 运算符应用于非数值值（如字符串）时，它会尝试将该值转换为数字，如果无法转换，则返回\
  \ `NaN`（即“不是数字”）。\n\n- `?:`: ***三元运算符***：在表达式 `test` `?` `valueIfTrue`:`valueIfFalse`\
  \ 中，`test` 决定了使用随后的两个值中的哪一个。\n\n如果你熟悉 Java，那么大多数 Java 运算符也可以在 JavaScript 中使用，包括所有的位操作符。位操作符会将操作数转换为整数，在整数上执行操作，并将结果转换回（浮点）数。\n\
  \n优先级顺序与大多数语言相同：首先执行一元加和减，然后是幂运算，紧接着是乘法和除法，然后是加法和减法，最后是赋值。\n\n## 2.7 等价与标识\n\n`==`\
  \ 和 `!=` 比较运算符尝试将操作数转换为相同类型。结果可能会令人惊讶。例如，使用 `==` 时，`123`、 `\"123\"`、`[123]` 甚至 `[\"\
  123\"]` 都被认为是相等。\n\n“严格”测试 `===` 和 `!==` 在值的类型不同时将认为它们不相等。除非你需要自动转换，否则应优先使用这些运算符。\n\
  \n对于对象（数组、集合等），“等价”运算符实际上是对***标识***identity）的测试。也就是说，一个对象只与它本身相等，而不等于任何其他对象。比较 `[1]\
  \ == [1]` 为 `false`，因为创建了两个数组，然后对其进行比较。\n\n对象的赋值*不会*创建新对象。在执行序列 `a = [1]; b = a;`\
  \ 之后，测试 `a == b` 将返回 `true`。因为 `a` 和 `b` 现在指向同一个对象的引用。通过 `a` 或 `b` 对对象进行的更改对另一个变量是可见的。\n\
  \nJavaScript 没有内置的对象等价性测试；要实现这一点，需要将对象拆解为原始组件。这需要大量的代码。`underscorejs.com` 和 `lodash.com`\
  \ 网站都提供了此类及其他用途的经过测试的大型库。\n\n## 2.8 转换\n\nJavaScript 自动执行大部分***转换***（也称为***强制类型转换***）。以下是一些可能需要注意的转换。\n\
  \n在原始值上执行的任何算术操作都会导致它们转换为数字。数字字符串将以显而的方式转换。布尔 `true` 将转换为 `1`，`null` 和 `false` 将转换为\
  \ `0`，`undefined` 将转换为 `NaN`。\n\n> **异常**：*二元* `+` 运算符既是加法也是字符串拼接，但拼接的优先级更高；`2 +\
  \ \"2\"` 是 `\"22\"`。*一元*运算符 `+` 将尝试将其操作数转换为数字，因此 `2 + +\"2\"` 是 `4`。\n\n在布尔上下文中（如\
  \ `if` 语句的条件）中的任何值，如果是 `0`、`undefined`、`null`、`NaN` 或空字符串，都将被视为 `false`。所有其他值（包括\
  \ `\"0\"`）都被视为 `true`。\n\n当数组被转换为字符串时，结果是一个由逗号分隔的值的字符串；括号会被省略。因此，多维数组很容易被误认为是一维数组。\n\
  \n## 2.9 语句\n\nJavaScript 中的许多语句与 Java 中的语句几乎相同。为了方便 Java 程序员理解，这些语句与 JavaScript\
  \ 特有的语句分开了描述的。\n\n### 2.9.1 分号\n\n每个 JavaScript 语句都应该以分号结束。如果你习惯于用 Java 或 C 语言中的某一种进行编程，请继续按照你习惯的方式使用分号。\n\
  \n虽然每个语句*应该*用分号终止，但 JavaScript 使用了一项名为 ***ASI***（***自动分号插入***）的工具，它会在某种程度上在适当的行末尾自动添加分号。如果你漏掉了几个分号可能没关系，但依赖\
  \ ASI 来为你做这一点是不明智的。\n\n当一组语句被包含在大括号 `{} ` 中时，这形成了一个***复合语句***（或***块***block）。在右括号后不需要分号。\n\
  \n如果一个语句需要跨越两行，请在第一行无法被理解为完整语句的地方将其分开。断开语句的好位置是在运算符之后或括号表达式内部。\n\n如果某行以左圆括号、左括号或算术运算符开头，它将被视为上一行的延续。如果这不是你的意图，请在上一行的末尾加上分号。\n\
  \n在同一行上分隔两个或多个语句时，需要分号。\n\n### 2.9.2 声明\n\nJavaScript 中的变量可以持有任何类型的值，因此它们的类型不是其声明的一部分。\n\
  \n- `let x;`\n- `var y = 5; // 旧样式 - 避免使用`\n- `let z = 26;`\n- `let a = 5, b = 10,\
  \ c;`\n\n重复声明变量是一个错误。\n\n### 2.9.3 函数定义\n\n***函数***（function）是一个可以被***调用***（invoked）的代码块。声明函数最常用的方法是使用这种语法：\n\
  \n```\nfunction name(args) {\n\n    statements\n\n}\n```\n\n示例定义：\n\n```\nfunction\
  \ average(x, y) {\n    let sum = x + y; // x, y 和 sum 是局部的\n    return sum / 2;\n\
  }\n```\n\n示例调用：\n\n```\nlet avg = average(5, 10); // 7.5\n```\n\n在函数体内部声明的任何变量都是函数的局部变量。参数也是函数的局部变量。\n\
  \n函数可以访问全局变量。函数定义会被***提升***（hoisted）。这仅意味着所有函数定义在执行任何其他代码之前被处理，因此它们不需要在词法顺序上必须在调用之前出现。\n\
  \n### 2.9.4 熟悉语句\n\nJavaScript 中的许多语句与 Java 和 C++ 中的语句相同。如果你熟悉其中某一种语言，可以随意跳过到*JavaScript\
  \ 特有的语句*。 \n\n> **注意 1**：虽然传统的 `for` 语句是相同的，但其***初始化***部分自然会使用 `let` 而不是控制变量的类型。\n\
  \n> **注意 2**：`switch` 语句允许每个 `case` 指定一个表达式，而不仅仅是常量值。\n\n以下是相同的语句列表：\n\n```\n •\
  \ variable = expression;\n    • expression;\n    • { statements }\n    • if (condition)\
  \ {\n        statements\n      }\n    • if (condition) {\n        statements\n \
  \     } else {\n        statements\n      }\n    • while (condition) {\n       \
  \ statements\n      }\n    • for (initialization; condition; update) {\n       \
  \ statements\n      }\n    • do {\n        statements\n      } while (condition)\n\
  \    • switch (expression) {\n         case expression:\n             statements;\n\
  \              break;\n          case expression:\n\t      statements;\n\t     \
  \ break;\n            …\n            default:\n                statements;\n   \
  \    }\n    • label: statement;\n    • break;\n    • break label;\n    • continue;\n\
  \    • continue label;\n    • return value;\n    • return;\n    •; // 空语句\n```\n\
  \n#### 2.9.4.1 赋值语句\n\n***赋值语句***给变量赋一个值。例如，\n\n`x = 5;` 给 `x` 赋值 `5`。\n\n\n\n\n\
  变量的值可以被改变。例如，赋值语句\n\n```\nx = \"abc\";\n```\n\n将给 `x` 赋予新值 `\"abc\"`。\n\n对于每个算术操作符\
  \ `op`，表达式\n\n```\nvariable op= expression;\n```\n\n是以下语句的简写：\n\n```\nvariable =\
  \ variable op expression;\n```\n\n例如，`x += 1;` 是向 `x` 加上 `1`。\n\n### 2.9.4.2 表达式\n\
  \n任何表达式都可以作为语句；表达式的值（如果有的话）会被丢弃。\n\n允许表达式作为语句使用，因为它们可以产生副作用。例如，如果 `a` 是一个数组，`a.sort()`\
  \ 会对该数组进行排序。\n\n返回结果但没有副作用的表达式可以作为语句使用，但它们不会产生任何作用。例如，使用 `2+2` 作为语句是合法的，但没用。\n\n\
  这可能会导致错误。如果 `str` 是字符串 `\"Hello\"`，表达式 `str.toUpperCase()` 返回字符串 `\"HELLO\"`，这个值可以赋值给变量，但将\
  \ `str.toUpperCase()` 作为语句则不起任何作用。\n\n### 2.9.4.3 复合语句\n\n`复合语句`（或`块`）是若干个（可能为零）声明和语句，它们被括在在大括号\
  \ `{}` 之中。复合语句本身被视为一个语句。\n\n控制语句（如 `if` 语句和循环）控制单个语句的执行。如果你想控制不仅仅是一个语句，你必须将这些语句封装在大括号中，以使其变成一个（单一的）复合语句。\n\
  \n函数或方法的体体始终是一个复合语句。（异常：“箭头”函数，稍后将讨论。）\n\n良好的风格要求块内的语句相对于块的开始位置进行缩进。JavaScript 的通常缩进是两个空格。\n\
  \n### 2.9.4.4 If 语句\n\n`if 语句`测试一个条件。如果条件为真，则执行后续的语句（通常是复合语句）。如果条件不为真，则 `if` 语句什么都不做。其语法如下：\n\
  \n```\nif (condition) {\n  statements\n}\n```\n\n例如，下面的 `if` 语句在 `x` 变为负数时将其重置为零。\n\
  \n```javascript\nif (x < 0) {\n    x = 0;\n}\n```\n\n`if` 语句也可以有一个 `else` 分句。如果条件为真，则执行条件之后的语句。如果条件不为真，则执行\
  \ `else` 单词之后的语句。这两条语句通常都是复合语句。其语法如下：\n\n```\nif (condition) { \n   some statements\n\
  }\nelse {\n   some other statements\n}\n```\n\n例如：\n\n```javascript\nif (x % 2 ==\
  \ 0) {\n    x = x / 2;\n}\nelse {\n    x = 3 * x + 1;\n}\n```\n\n如果任何部分都只包含一个（非复合）语句，可以省略大括号。在这种情况下，良好的风格是将单个语句与\
  \ `if` 或 `else` 放在同一行。\n\n```javascript\nif (x % 2 == 0) x = x / 2;\nelse x = 3\
  \ * x + 1;\n```\n\n### 2.9.4.5 While 循环\n\n`while 循环`是一种在顶部进行测试的循环。其语法如下：\n\n```\n\
  while (condition) {\n   statements\n}\n```\n\n首先，测试 `condition`；如果它为假，则不再进行其他操作，循环在从未执行\
  \ `statements` 的情况下退出。如果 `condition` 为真，则执行 `statements`，然后整个循环（从测试开始）再次执行。\n\n\
  例如，一个数字 `x` 的近似常用对数（即以 10 为底的对数）可以这样计算：\n\n```javascript\nlet log = 0;\nwhile (x\
  \ > 1) {\n    log = log + 1;\n    x = x / 10;\n}\n```\n\n### 2.9.4.6 Do-While 循环\n\
  \n`do-while 循环`是一种在底部进行测试，而不是顶部的循环。其语法如下：\n\n```\ndo {\n  statements\n} while (condition);\n\
  ```\n\n首先执行 `statements`，然后测试 `condition`；如果条件为真，则循环再次执行。这种循环通常在循环体至少执行一次时使用。\n\n\
  例如，假设你想选择一个 `0` 到 `1` 之间的随机数：\n\n```javascript\ndo {\n  x = Math.random();\n} while\
  \ (x <= 0.5);\n```\n\n### 2.9.4.7 For 循环\n\n`for 循环`是一种在顶部进行测试的循环。其语法如下：\n\n```\n\
  for (initialization; condition; update) {\n   statements\n}\n```\n\n`initialization`首先执行且仅执行一次。之后，测试\
  \ `condition`，如果为真，则执行 `statements` 并执行 `update`；然后返回 `condition`。换句话说，`for` 循环的行为类似于下面的\
  \ `while` 循环：\n\n```\ninitialization;\nwhile (condition) {\n    statements;\n  \
  \  update;\n}\n```\n\n`initialization` 可以具有以下形式之一：\n\n*   对变量赋值，例如 `i = 0` 或 `let\
  \ i = 0`。\n*   对多个变量赋值，用逗号分隔，例如 `let i = 0, j = 0`（这种形式很少使用）。\n\n如果使用了 `let`，它必须位于初始化中第一个变量之前。\n\
  \n`update` 是以下之一：\n\n*   一个表达式，通常是赋值语句，如 `i += 1`。（赋值语句是一种表达式。）\n*   表达式的逗号列表，如\
  \ `i += 1, j += 2`。\n\n大括号表示 `statements` 块。如果只有一个语句，可以省略大括号；然而，良好的风格是始终包含大括号。\n\
  \n作为一个示例，声明一个数组并输出其内容：\n\n```javascript\nlet ary = [3, 1, 4, 1, 6];\nfor (let i\
  \ = 0; i < ary.length; i += 1) {\n    console.log(ary[i]);\n}\n```\n\n### 2.9.4.8\
  \ 循环中的作用域\n\n考虑：\n\n```\nfor (let variable = value; condition; update) { statements\
  \ }\n```\n\n`variable` 的作用域是整个 `for` 语句；它在语句外部不可访问。如果省略了关键字 `let`，`variable` 必须预声明；如果将\
  \ `let` 替换为 `var`，则 `variable` 是全局的。\n\n\n\n当循环体是单条语句时，建议使用大括号但并非强制。在这种情况下，将整个循环写在一行内是一种良好的风格。\n\
  \n```\nfor (let variable = value; condition; update) statement;\n```\n\n`variable`\
  \ 的“块级作用域”是整个 `for` 语句，就像存在大括号一样。\n\n### 2.9.4.9 Switch 语句 (Switch Statements)\n\
  \n就像 `if` 语句根据布尔值在两个代码块之间提供选择一样，`switch 语句` 根据任何类型的值在多个代码块之间提供选择。\n\n其语法相当复杂：\n\n\
  ```javascript\n switch (expression) {\n  case expression:\n    statements;\n   \
  \ break;\n  case expression:\n    statements;\n    break;\n  …\n  case expression:\n\
  \    statements;\n    break;\n  default:\n    statements;\n    break;\n}\n```\n\n\
  操作如下：求值 `switch` `expression`，然后顺序与每个 `case` `expression` 进行比较。当找到与 `switch` `expression`\
  \ 严格相等的 `case` `expression` 时，从随后的语句开始执行，直到遇到 `break` 或 `return`，或者直到整个 `switch`\
  \ 语句结束。\n\n> **注意：** `===` 运算符用于相等性测试。只有当两个值的类型相同且值相同时，才会返回 true 结果。\n\n每个 case\
  \ 的末尾不需要 `break` 语句；如果省略了它，控制流将进入下一组语句执行。这通常不是你希望发生的情况。在极少数这种这是预期行为的情况下，最好包含一个注释，说明这种省略是有故意的，否则你或其他人可能会在日后“纠正”这个显而易见的问题。\n\
  \n一个 `case` `expression:` 后面可以紧跟另一个 `case` `expression:`，中间没有间隔的语句（或 `break`）。如果其中一个\
  \ `expression` 匹配 `switch` `expression`，将执行随后的 `statements`。\n\n`default` 情况是可选的，并且通常应该放在最后。如果没有找到匹配的\
  \ `expression`，则执行 `default` 情况中的 `statements`。如果没有找到匹配的 `expression` 且没有 `default`\
  \ 情况，则 `switch` 语句将在不执行任何操作的情况下退出。\n\n良好的风格是始终包含一个 `default` 情况，即使你认为已经涵盖了所有可能性。\n\
  \n`statements` 可以是任意零或多条语句的序列。没有必要使用大括号将语句（包括随后的 `break` 语句）分组为一个复合语句，尽管有时会这样做。\n\
  \n这是一个人为构造的示例：\n\n```javascript\n let v = 123.0;\n   let kind;\n   switch (v) {\n\
  \    case 120 + 3:\n     kind = \"number\";\n     break;\n    case \"123\":\n  \
  \   kind = \"string\";\n     break;\n    default:\n     kind = \"other\";\n   }\n\
  \   console.log(v, \"is a\", kind);\n```\n\n这将导致输出 `123 is a number`，因为严格相等测试不区分整数和浮点数；它们的类型都是\
  \ `number`。\n\n### 2.9.4.10 标签语句 (Labeled Statements)\n\n`标签语句` 的语法是：\n\n```javascript\n\
  identifier: statement;\n```\n\n任何语句都可以用标识符标记标签，但只有对循环语句和 `switch` 语句标记标签才有意义。标签与\
  \ `break` 和 `continue` 语句配合使用。\n\n### 2.9.4.11 Break 语句 (Break Statements)\n\n`break\
  \ 语句` 由关键字 `break` 组成，后面可选跟一个语句标签。\n\n`break` 语句只能在循环或 `switch` 语句内部使用。\n\n执行 `break`\
  \ 会导致闭包的循环或 `switch` 语句退出。如果 `break` 语句位于嵌套循环和或 `switch` 语句内部且没有标签，则只退出直接闭包的循环或\
  \ `switch` 语句。\n\n执行带有标签的 `break` 语句会导致带有该标签的闭包循环或 `switch` 语句退出，无论嵌套深度如何。\n\n给定一个数字数组，考虑找到两个数字，其中一个恰好是另一个十倍。以下代码解决了这个问题。\n\
  \n```javascript\n let ary = [7, 30, 9, 20, 3, 5];\n   let i, j;\n   id: for (i =\
  \ 0; i < ary.length; i += 1) {\n     for (j = 0; j < ary.length; j += 1) {\n   \
  \   if (ary[i] == 10 * ary[j] && ary[i] != 0) {\n       break id;\n      }\n   \
  \  }\n    }\n   console.log(ary[i] + \", \" + ary[j]);\n```\n\n一些程序员不喜欢 `break`\
  \ 语句，事实上，通常有更好的方法在使用它的情况下解决问题。\n\n### 2.9.4.12 Continue 语句 (Continue Statements)\n\
  \n`continue 语句` 由关键字 `continue` 组成，后面可选跟一个语句标签。\n\n`continue` 语句只能在循环内部使用。这与 `break`\
  \ 语句不同，`break` 语句也可以在 `switch` 语句内部使用。\n\n执行 `continue` 会导致闭包循环返回测试，或者在传统的 `for`\
  \ 循环中，返回到……（注：原文此处存在大量重复的错误文本，已根据核心逻辑进行翻译）。\n\n\n\n\n\n*   对于数组，`element` 是索引以及可能分配给数组的任何属性；可以通过\
  \ `object`[`element`] 访问值。\n    *   `for/in` 循环将数组视为任何其他对象处理。它比 `for/of` 循环慢得多。\n\
  *   对于字符串，`element` 是索引；可以通过 `object`[`element`] 访问单个字符。\n\n对象可能具有不可枚举的、“隐藏”属性，而稀疏数组可能具有“缺失”的元素。`for/in`\
  \ 循环会跳过这些。\n\n### 2.9.5.3 throw（抛出语句）\n\n程序员可以使用 `throw statement` 故意导致异常。并没有特定的“异常（Exception）”类型——任何类型的值都可以被“抛出”。\n\
  \n> **注意**：JavaScript 不区分“错误（errors）”和“异常（exceptions）”。\n\n`throw` 语句将异常“抛出”到其他地方，以免用用于处理（希望是罕见的）异常情况的代码来干扰程序的正常执行。`try/catch`\
  \ 语句的目的（在第 2.9.5.4 节中描述）是捕获抛出的异常。\n\n`throw` 语句的语法为：\n\n```\nthrow expression;\n\
  ```\n\n其中 `expression` 可以是任何类型，但通常是错误代码、错误消息，或者（如预定义异常所示）具有 `name` 和 `message` 属性的对象。\n\
  \n被抛出的异常会发生什么？\n\n*   如果在 `try-catch-finally` 语句的 `try` 部分发生异常，则由 `catch` 部分处理该异常。\n\
  *   否则，如果在一个函数中发生异常，该函数将立即返回到调用该函数的地方。执行继续，就像异常在该点被抛出一样（这可能涉及返回到嵌套函数调用中的上一个级别）。\n\
  *   否则，如果异常在顶层代码中发生，或者在异常到达顶层时仍未被处理，则由系统来采取措施。在 IDE 中，异常将报告给程序员。在浏览器中，异常可能会被忽略。\n\
  \n### 2.9.5.4 Try-catch-finally\n\n`try-catch-finally statement` 用于将错误处理代码与处理“正常”情况的代码分离。该语句的工作原理与\
  \ Java 中对应的语句完全相同，但有两个细微的语法差异。\n\n*   `try-catch-finally` 语句只能有一个 `catch` 子句。\n\
  *   `catch` 单词后的 `(`variable`)` 没有声明类型，且可以省略。\n\n更详细地说，语法如下：\n\n```\ntry {\n statements\n\
  }\ncatch (variable) {\n statements\n}\nfinally {\n statements\n}\n```\n\n可以省略 `catch`\
  \ 部分或 `finally` 部分，但不能两者都省略。\n\n执行过程如下：\n\n1.  执行 `try` 块中的代码。\n    *   如果没有发生异常，则跳过\
  \ `catch` 块。\n    *   如果发生异常，控制权立即跳转到 `catch` 部分。可选的 `variable` 持有异常提供的值；它是 `catch`\
  \ 部分的局部变量。\n2.  无论是否发生异常，都会执行 `finally` 部分。\n\n例如，以下代码将弹出一个包含“I am an exception”字字的警告框：\n\
  \n```\n try {\n    throw \"I am an exception\";\n   }\n   catch (v) {\n    alert(v);\n\
  \   }\n```\n\n许多在其他语言中会抛出异常的情况在 JavaScript 中不会抛出异常。特别是，算术表达式永远不会抛出异常。\n\n产生了一个小的复杂性，是因为\
  \ JavaScript 保证如果存在 `finally` 部分，它*总是*执行。如果 `try` 或 `catch` 部分的代码尝试执行 `return`、`break`\
  \ 或 `continue` 语句，控制权将立即传递到 `finally` 部分，而 `return`、`break` 或 `continue` 语句将推迟到\
  \ `finally` 部分完成后执行。\n\n`try-catch-finally` 语句的 `catch` 或 `finally` 部分也可能发生异常。新异常将替换正在处理的异常，并被视为新异常。\n\
  \n### 2.9.5.5 with 语句\n\n严格模式下不允许使用 `with` 语句，但你可能会旧代码中看到它。\n\n```\nwith object\
  \ {\n statements\n}\n```\n\n这使用 `object` 作为变量的默认前缀；也就是说，语句内的任何变量 `var` 在任何合理的情况下都被视为\
  \ `object`.`var`。\n\n## 2.10 示例：质数\n\n这是一个简单的程序，用于打印 2 到 100 的所有质数，并正确地嵌入 HTML 页面中。它可以保存为\
  \ `.html` 扩展的文件并在浏览器中查看。\n\n```html\n <!DOCTYPE html>\n   <html\n   <title>Using\
  \ JavaScript</title>\n   <head>\n   <script>\n    function isPrime(n) {\n     let\
  \ divisor = 2;\n     while (divisor * divisor <= n) {\n      if (n % divisor ==\
  \ 0) {\n       return false;\n      }\n      divisor += 1;\n     }\n     return\
  \ true;\n    }\n   </script>\n   </head>\n   <<body>\n   <script>\n    for (let\
  \ n = 2; n <= 100; n++) {\n      if (isPrime(n)) {\n        console.log(n);\n  \
  \    }\n    }\n   </script>\n   </body>\n </html>\n```\n\n## 2.11 测试\n\n### 2.11.1\
  \ Mocha 测试框架\n\n上面的 URL 很长，在书中无法单行显示，但你应该在代码中编写它们。在 `<head>` 部分中，使用以下内容加载 Mocha：\n\
  \n```html\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/mocha/8.0.1/mocha.css\"\
  >\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/mocha/8.0.1/mocha.min.js\"\
  ></script>\n```\n\n以下是初始化 Mocha 的一种简单方法：\n\n```html\n<script>\n mocha.setup('bdd');\n\
  </script>\n```\n\n使用以下内容加载 Chai：\n\n```html\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/chai/4.2.0/chai.min.js\"\
  ></script>\n```\n\n在 body 中需要两个东西。首先，你需要以下行来指定在页面上放置测试结果的位置：\n\n```html\n<div id=\"\
  mocha\"></div>\n```\n\n最后一步（位于 HTML 体的底部或附近）是运行测试的代码：\n\n```html\n<script> mocha.run();\
  \ </script>\n```\n\n### 2.11.2 使用 Chai 进行测试\n\n粗来说，Mocha 是测试框架，而 Chai 提供了实际的测试断言。如果你熟悉测试风格，Chai\
  \ 支持 `assert`、`should` 和 `expect` 风格。我们将使用 `assert` 风格。\n\n一个测试看起来如下：\n\n```javascript\n\
  describe(title, function() {\n  it(\"English_description_of_what_it_does\", function()\
  \ {\n    // 测试写在这里\n  });\n});\n```\n\n这里是 `chai` 对象中一些非常有用的测试。它们应该是是易于理解的。\n\n\
  *   `assert(expression)`\n*   `assert.isTrue(expression)`\n    *   与 `assert(expression)`\
  \ 相同\n*   `assert.isFalse(expression)`\n*   `assert.equal(actual, expected)`\n \
  \   *   通常 `actual` 是一个函数调用，`expected` 是函数应该返回的值。\n*   `assert.notEqual(actual,\
  \ expected)`\n*   `assert.strictEqual(actual, expected)`\n\n\n\n\n\n*   `assert.notStrictEqual(`actual`,\
  \ `expected`)`\n*   `assert.approximately(`actual`, `expected`, `delta`)`\n    *\
  \   `delta` 是两个数字之间的接近程度，例如，`0.001`。\n*   `assert.deepEqual(`actual`, `expected`)`\n\
  \    *   检查对象的内容，而不仅仅是标识性。\n\n上述所有方法都可以接受一个 `message` 作为额外参数。只有当有有用信息可以提供时，该参数才有用。\n\
  \n### 2.11.3 测试示例\n\n我们之前展示了一个 JavaScript 函数示例，用于测试一个数字是否为质数。我们在这里重复该示例。为了简洁起见，删除了用于打印结果的代码。使用了\
  \ `<!--` `comment` `-->` 语 HTML 注释来指出相关部分。\n\n```\n <!DOCTYPE html>\n   <html>\n\
  \   <head>\n    <title>使用 Mocha 和 Chai 测试质数</title>\n\n    <!-- 加载 Mocha, Chai 和一些\
  \ CSS 格式 -->\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/mocha/8.0.1/mocha.css\"\
  >\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/mocha/8.0.1/mocha.js\"\
  ></script>\n    <script>mocha.setup('bdd');</script>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/chai/4.2.0/chai.js\"\
  ></script>\n\n    <!-- 要测试的函数 -->\n    <script>\n     function isPrime(n) {\n  \
  \    let divisor = 2;\n      while (divisor <= n / divisor) {\n       if (n % divisor\
  \ == 0) {\n        return false;\n       }\n       divisor += 1;\n      }\n    \
  \  return true;\n     }\n    </script>\n\n    <!-- 测试代码；这里我们从文件中加载 -->\n    <script\n\
  \     src='isPrimeMochaTest.js'>\n    </script>\n\n   </head>\n   <body>\n    这段文本位于结果之前。\n\
  \n    <!-- 测试结果将显示在这里 -->\n    <div id=\"mocha\"></div>\n\n    这段文本位于结果之后。\n\n \
  \   <!-- 运行测试并将结果放在 \"mocha\" div 中 -->\n    <script>\n     mocha.run();\n    </script>\n\
  \n   </body>\n   </html>\n```\n\n测试代码可以直接放在 HTML 页面中，也可以从文件中加载。在上面，测试代码位于名为 `isPrimeMochaTest.js`\
  \ 的文件中。该文件的内容如下：\n\n```\n describe(\"isPrime\", function() {\n    let assert = chai.assert;\n\
  \    it(\"Tests if n is a prime number\", function() {\n     assert(isPrime(2));\n\
  \     assert.isTrue(isPrime(3));\n     let x = 4;\n     assert.isFalse(isPrime(x));\n\
  \     assert.equal(isPrime(5), true);\n    });\n   });\n```\n\n（记住 `.js` 文件中不使用\
  \ `<script>` 标签）。为了示例起见，使用了几个可能的 `assert` 测试，并额外抛了一个 `let` 语句，用以演示普通的 JavaScript\
  \ 代码（而不只是断言）也可以包含在内。\n\n如果一切顺利，预计会有两个结果。在 HTML 页面的右上角（由 CSS 文件放置）应该显示如下内容：\n\n```\n\
  passes: 1 failures: 0 duration: 0.00s 100%\n```\n\n在“mocha” `div` 的位置你应该看到：\n\n\
  ```\n isPrime\n    √ Tests if n is a prime number\n```\n\n# 第 3 章 JavaScript 详细介绍\n\
  \nDOI: [10.1201/9781003359609-3](https://dx.doi.org/10.1201/9781003359609-3)\n\n\
  JavaScript 是一种大型、复杂且不断演变的语言。前面的章节对其主要特征进行了了快速回顾。然而，缺失的是任何关于创建交互式网页的内容——而这终究底是使用\
  \ JavaScript 的主要原因。\n\n如果你渴望学习客户端 JavaScript 编程，你现在应该已经足够的知识跳转到 第 4 章。如果你希望深化对 JavaScript\
  \ 的知识，请继续阅读。\n\n## 3.1 严格模式\n\n没有语言是完美的。JavaScript 允许一些回想起来不应该被允许的操作。JavaScript\
  \ 现在有了 `strict mode`（严格模式）来禁止这些功能并修改其他功能。要全局开启严格模式，请将字符串\n\n```\n\"use strict\"\
  ;\n```\n\n作为脚本中的第一个内容；要仅对某一个函数开启严格模式，请将该字符串放在函数内部的第一行。\n\n开启严格模式会使以下行为非法：\n\n* \
  \  给未用 `var`、`let` 或 `const` 声明的变量赋值。\n*   `with` 语句。\n*   在条件语句或循环语句中定义函数。\n* \
  \  使用 `eval` 创建变量。\n*   使用 `delete` 删除变量、对象、函数或不可删除的属性（例如 `prototype`）。\n*   修改只读或仅可读属性。\n\
  \n## 3.2 标识符\n\n标识符由字母（Unicode）、数字、下划线和美元符号组成。\n\n## 3.3 解构\n\n解构是将对象的部分部分赋值给不同变量的方法。例如，我们使用以下对象：\n\
  \n```\nlet p = {givenName: \"Sally\", familyName: \"Willis\", occupation: \"doctor\"\
  };\n```\n\n我们可能希望将该对象的各个赋值给独立的变量：\n\n```\nlet givenName = p.givenName;\nlet familyName\
  \ = p.familyName;\nlet occupation = p.occupation;\n```\n\n解构是用更短的方式来实现完全相同的事情：\n\
  \n```\nlet {givenName, familyName, occupation} = p;\n```\n\n属性名不需要排序，也不需要每个名称都被提及。可以给出不在对象的属性名；它们将接收\
  \ `undefined`。\n\n为了处理相同类型的相似对象，例如 `p2`，不能再次使用 `let`，因为变量只能声明一次。\n\n```\nlet {givenName,\
  \ familyName, occupation} = p2;\n// SyntaxError: Identifier 'givenName' has\n//\
  \ already been declared\n```\n\n不能简单地省略 `let` 字，因为以大括号 `{` 开始表示一个块。\n\n```\n{givenName,\
  \ familyName, occupation} = p2;\n// SyntaxError: Unexpected token '='\n```\n\n解决方案是将整个语句（直到分号）包含在括号中。\n\
  \n```\n({givenName, familyName, occupation} = p2);\n```\n\n对象可以解构为不同的变量名。\n\n```\n\
  let {familyName: name, occupation: occ} = p;\n// name = \"Willis\", occ = \"doctor\"\
  \n```\n\n在对象缺少给定属性的情况下，可以给出默认值。\n\n```\n({givenName: name, country = \"USA\"} =\
  \ p);\n// name = \"Sally\", country = \"USA\"\n```\n\n重命名和给出默认值可以组合。\n\n```\n({givenName:\
  \ name=\"Joe\", age=40} = p);\n// name = \"Sally\", age = 40\n```\n\n当调用函数时，值会被赋值给参数，这些参数的操作类似于赋值语句；因此，解构也可以用于参数列表。\n\
  \n```\nfunction f({familyName, occupation: occ,\n                    age=40, gender:\
  \ g=\"male\"}) {\n    // 当使用 f(p) 调用时，familyName =\n    // \"Willis\", occ = \"\
  doctor\", age = 40,\n    // and g = \"male\"\n   }\n```\n\n\n\n\n解构也可以用于数组。使用逗号来表示被跳过的数组元素。\n\
  \n```\n let a = [11, 22, 33, 44];\n let [, x, , y] = a;\n // x = 22, y = 44\n```\n\
  \n## 3.4 数据类型\n\n### 3.4.1 数字\n\n`number` 可以写成整数或实数。无论如何编写，数字（`bigints` 除外）都被存储为双精度浮点数，并遵循《IEEE\
  \ 浮点运算标准》（`IEEE 754`）。\n\n为了提高可读性，数字可以包含下划线，例如，一百可以写成 `1_000_000`。\n\n> **注意**：将字符串转换为数字的方法（`Number`、`parseInt`\
  \ 和 `parseFloat`）无法识别数字中的下划线。\n\n有一些特殊的预定义“数字”：\n\n*   `NaN`（“**N**ot **a N**umber”）是如\
  \ `0/0` 和 `\"one\"/\"two\"` 等表达式的结果。\n\n    *   你可以将其写为 `Number.NaN`，或直接写 `NaN`。\n\
  \n    *   尽管名称如此，`NaN` *确实*是一个数字，且 `typeof(NaN)` 将返回 `\"number\"`。\n\n    *   涉及\
  \ `NaN` 的算术运算结果为 `NaN`。\n\n*   `Infinity` 是如 `1/0` 等表达式的结果。\n\n*   `-Infinity` 是表达式\
  \ `-1/0` 的结果。\n\n    *   `isFinite(x)` 对于 `-Infinity`、`Infinity` 和 `NaN` 将返回 `false`。\n\
  \n*   `Number.MIN_VALUE` 是可以表示的最小数字，约为 `5e-324`。\n\n*   `Number.EPSILON` 约为 `2.220446049250313e-16`。它是与\
  \ 1 相加结果不同于 1 的最小数字。\n\n*   `Number.MAX_VALUE` 是可以表示的最大数字，约为 `1.7976931348623157e+308`。\n\
  \n*   `Number.MAX_SAFE_INTEGER` 是 `9007199254740991`；它是可以被唯一表示为双精度浮点数的最大整数。\n\n\
  *   `Number.MIN_SAFE_INTEGER` 是 `-9007199254740991`。\n\n上述所有内容都被视为数字。任何算术表达式永远不会导致异常。\n\
  \n> **注意**：函数 `isNaN(value)` 在 `value` 为 `NaN` 时返回 `true`，但它对任何无法转换为数字的 `value`\
  \ 也返回 `true`。要测试变量 `v` 的值是否真的*是* `NaN`，请使用测试 `v != v`。这是因为 `NaN` 是唯一不等于自身的值。\n\n\
  一些额外的方法是 `Number.isInteger(n)`、`Number.isSafeInteger(n)` 和 `Number.isFinite(n)`。\n\
  \n`bigint` 是一个带有 `n` 后缀的整数，例如，`123n`。`bigints` 可以有任意数量的数字。`bigints` 可以进行所有常用的数字操作，但元加运算符除外：`+123n`\
  \ 是非法的。\n\n`bigints` 和（普通）数字不能在算术表达式中混合使用，但 `bigints` 和数字可以进行比较（使用 `<`, `<=` 等）。要在两种类型之间转换，请使用\
  \ `BigInt(number)` 和 `Number(bigint)`。\n\n十六进制字面量以 `0x` 或 `0X` 开头。八进制字面量以 `0o` 或\
  \ `0O` 开头。\n\n在严格模式下，编写带有前导零的数字（例如 `0123`）是非法的，零除外。在非严格模式下，某些实现会将此类数字视为八进制，另一些则将其视为十进制。\n\
  \n### 3.4.2 字符串\n\n`string` 是零或多个 UTF-16 字符的序列，由单引号（`'hello'`）、双引号（`\"hello\"`）或反引号（```hello``）包含。不支持\
  \ UTF-32。\n\n一种引号可以使用另一种引号包含的字符串内，例如，`\"Don't go.\"`。与包含类型相同的引号必须转义（见下文）。\n\n由反引号包含的字符串是特殊的。它们可以跨多行，并且字符串中任何出现\
  \ `${expression}` 的地方，`expression` 被求并成为字符串的一部分。这样的字符串被称为模板字面量。\n\n没有“字符”数据类型。某些无法直接写在字符串中的字符可以被“转义”，即通过反斜杠后跟字母或十六进制数字来指定。这样编写的字符仍然被视为单个字符。\n\
  \n转义字符是：\n\n*   `\\0` NUL\n*   `\\b` 退格\n*   `\\f` 换页\n*   `\\n` 换行\n*   `\\r` 回车\n\
  *   `\\t` 水平制表符\n*   `\\v` 垂直制表符\n*   `\\\\` 反斜杠\n*   `\\'` 单引号\n*   `\\\"` 双引号\n\
  \n### 3.4.3 布尔值\n\n`boolean` 有两个值：`true` 和 `false`。这些值是逻辑操作和比较的结果。\n\n```\n let\
  \ a = true;\n let b = false;\n let c = a && b; // false\n let d = a || b; // true\n\
  \ let e = !a; // false\n```\n\n### 3.4.4 空和未定义\n\n`null` 表示任何对象值的有意缺失。`undefined`\
  \ 意味着变量已声明但未赋值值。\n\n```\n let a; // undefined\n let b = null;\n```\n\n> **注意**：`typeof\
  \ null` 返回 \"object\"。\n\n### 3.4.5 对象\n\n`object` 是属性的集合，其中每个属性都是从字符串键到值的映射。\n\n\
  ```\n let user = {name: \"Alice\", age: 30};\n```\n\n可以使用点符号法或中括号表示法访问属性：\n\n```\n\
  \ console.log(user.name); // Alice\n console.log(user[\"name\"]); // Alice\n```\n\
  \n可以添加、修改或删除属性：\n\n```\n user.city = \"New York\";\n user.age = 31;\n delete user.age;\n\
  ```\n\n\n\n\n*   `array`.pop()`—移除并返回 `array` 中的最后一个元素，并更新其 `length`。\n*   `array`.unshift(elems)`—将\
  \ `elems` 添加到 `array` 头部后，返回 `array` 的新长度。\n*   `array`.shift()`—移除并返回 `array` 中的第一个元素，并更新数组的\
  \ `length`。\n\n`push` 和 `pop` 操作可以高效地实现栈（stacks）。\n\n`push` 和 `shift`、或 `pop` 和\
  \ `unshift` 配对可以实现队列（queues）；这四个方法结合使用可以实现双端队列（deques）。\n\n由于 `unshift` 和 `shift`\
  \ 方法实际上会移动数组中的元素，它们的效率比 `push` 和 `pop` 低得多。\n\n附录 A 中描述了几个额外的数组方法。\n\n### 3.4.6\
  \ 稀疏数组\n\n在大多数语言中，数组是**密集的**：大小为 `n` 的数组占用 `n` 个连续的内存位置。JavaScript 中的数组可以是密集的，也可以是稀疏的。\n\
  \n`稀疏数组`（sparse array）是指只有包含实际值的位置才占用计算机内存；所有其他位置似乎都包含特殊值 `undefined`。稀疏数组占的内存较少，但处理需要更多时间。\n\
  \n以下是创建稀疏数组的几种方法：\n\n*   使用 `Array(length)` 形式创建数组。\n*   使用 `delete array[i]` 删除\
  \ `array` 中的某些现有元素。\n*   给 `array[i]` 赋值，其中 `i > array.length`。\n    *   给 `array[array.length]`\
  \ 赋值不会强制使数组变为稀疏。\n*   将数组的 `length` 属性设置为较大的值。\n    *   如果你将 `length` 设置为较小的值，则该索引及之后的数组元素将被丢弃。\n\
  *   使用连续的逗号编写字面量数组，例如 `[\"cat\",, \"dog\",,,]`。\n    *   该数组的长度为五（而不是六）；最后一个一个逗号被视为尾随逗号。\n\
  \n为了更好地理解稀疏数组，记住 `undefined` 是 JavaScript 中的一个实际值，因此会占用内存中的实际空间。但如果我们请求稀疏数组中某个位置的值并得到\
  \ `undefined`，这可能意味着两种情况之一：(1) 该位置没有内容，或 (2) 该位置确实包含值 `undefined`。\n\n这具有一些实际影响。`for/in`\
  \ 循环将遍历数组的所有索引，无论该位置是否有内容。`for/of` 循环则只会遍历实际值（其中某些值可能是 `undefined`）。\n\n方法 `array`.hasOwnProperty(i)`\
  \ 会在 `array[i]` 包含实际值时返回 `true`，否则返回 `false`。\n\n### 3.4.7 集合 (Sets)\n\nJavaScript\
  \ 并没有直接提供对集合的常用操作（并集、交集、差集、对称差集）。使用“展开运算符”（`...`）将数组转换为值序列，可以通过以下方式实现这些操作。\n\n```javascript\n\
  function union(a, b) {\n  return new Set([...a, ...b]);\n}\n\nfunction intersection(a,\
  \ b) {\n  return new Set([...a].filter(x => b.has(x)));\n}\n\nfunction difference(a,\
  \ b) {\n  return new Set([...a].filter(x => !b.has(x)));\n}\n\nfunction symmetricDifference(a,\
  \ b) {\n  return difference(union(a, b), intersection(a, b));\n}\n```\n\n### 3.4.8\
  \ Map\n\n在许多语言中，使用可变对象作为键是不可取的。这在 JavaScript 中并不是问题，因为 JavaScript 比较键的是标识性（identity）而不是相等性（equality）。无论对作为键的对象进行什么更改，它都会保留其标识性；无法使用另一个“相等”的对象来恢复关联的值。\n\
  \n> **注意**：无论对作为键的对象进行什么更改，它都会保留其标识性；无法使用另一个“相等”的对象来恢复关联的值。\n\n`Map` 最近添加了三个新方法：\n\
  \n*   `map`.keys()`——返回键的迭代器。\n*   `map`.values()`——返回值的迭代器。\n*   `map`.entries()`——返回键值对的迭代器。\n\
  \n### 3.4.9 弱映射 (WeakMaps)\n\n`WeakMap` 是 `Map` 的变体，它的键必须是弱引用的。如果键对象没有其他强引用，它就会被垃圾回收。\n\
  \n`WeakMap` 不可迭代，因此无法使用 `for...of` 循环。\n\n`WeakMap` 只有三个方法：\n\n*   `set(key, value)`——设置键值对，并返回\
  \ WeakMap 对象本身。\n*   `get(key)`——获取与键关联的值；如果键不存在则返回 `undefined`。\n*   `has(key)`——检查是否存在指定的键。\n\
  *   `delete(key)`——删除指定的键；如果删除成功，则返回 `true`。\n\n### 3.4.10 Promise\n\n如果你有一个不需要立即结果的长运行任务（例如文件传输），你可能希望启动它，同时你的代码继续执行。`promise`\
  \ 是异步运行并“承诺”在某个时间完成任务的代码。\n\n以下赋值语句创建一个 `Promise` 对象，将其保存在 `promise` 中，并开始执行函数：\n\
  \n```javascript\nlet promise = new Promise(function);\n```\n\n> **注意**：记住*函数*和*函数调用*之间的区别。如果我们定义\
  \ `function f(){}`，那么 `f` 是函数本身，而 `f()` 是该函数的调用。`Promise` 构造函数的参数必须是一个函数。\n\nPromise\
  \ 有三种终止方式：通过报告“成功”、报告“失败”或抛出异常。为了处理这种情况，Promise 使用的函数应该有两个参数，每个参数都是一个函数（有时称为回调）。Promise\
  \ 代码应该调用第一个函数来报告成功，或者调用第二个来报告失败。\n\n通常方便使用**箭头函数**（后文介绍）来编写 Promise 的回调函数。如下：\n\n\
  ```javascript\nnew Promise((onSuccess, onFailure) => {code});\n```\n\n在这种语法中，`code`\
  \ 是要执行的（可能是长运行）），`onSuccess` 是 `code` 成功时执行的函数，`onFailure` 是代码失败时执行的函数。特别注意传递给参数\
  \ `onSuccess` 和 `onFailure` 的参数必须是函数；每个函数可以接受一个参数，也可以不接受参数。\n\nPromise 的 `then`\
  \ 方法提供了 Promise 使用的函数。\n\n*   `promise`.then(successFunction, failureFunction)`——告诉\
  \ Promise 在成功或失败时调用哪个函数。\n    *   调用任何 `successFunction` 或 `failureFunction` 都会终止\
  \ promise。\n    *   如果发生未处理的异常，将调用 `failureFunction`。\n\n\n\n\n以下示例使用了三个函数：`yes`\
  \ 和 `no` 仅打印它们的参数，而 `doSomething` 会选择一个随机数，如果数字大于 `0.5` 则“成功”，如果数字较小则抛出异常。（为了简单起见，示例使用了\
  \ `Math.random` 代替某些可能实际耗长时间的任务。）\n\n```javascript\n function yes(r) {\n    console.log(\"\
  yes, \" + r);\n   }\n\n   function no(e) {\n    console.log(\"no, \" + e);\n   }\n\
  \n   function doSomething(resolve, reject) {\n    let r = Math.random();\n    if\
  \ (r > 0.50) resolve(r); // succeed\n    throw r + \" is too low\"; // fail\n  \
  \ }\n```\n\n在这里我们利用了这些函数：\n\n```javascript\n let promise = new Promise(doSomething);\n\
  \ // other work\n promise.then(yes, no);\n console.log(\"END\");\n```\n\n示例结果：\n\
  \n`````` \"END\"\n \"no, 0.18252962330109224 is too low\"\n\n \"END\"\n \"yes, 0.938714265780423\"\
  \n```\n\n`then` 返回的结果是一个 `Promise`。这允许 promise 进行“链式”，使得 `then` 返回的值可以传递给另一个 `then`。下面的示例将创建一个随机数，然后将其乘以\
  \ 100，再加上 1000，最后显示结果。\n\n```javascript\n let promise2 = new Promise(\n    someFun\
  \ => { return someFun(Math.random());\n    }).then(function(result) { return 100\
  \ * result;\n    }).then(function(result) { return 1000 + result;\n    }).then(function(result)\
  \ { console.log(result);\n    });\n```\n\n该语法不允许向 `Promise` 传递额外的参数；它所需要的任何额外信息必须从环境中获取。\n\
  \n### 3.4.11 转换\n\nJavaScript 会自动执行大多数转换（强制类型转换）。你也可以使用函数 `Number(x)`、`String(x)`、`Boolean(x)`、`BigInt(x)`、`parseInt(x,\
  \ base)` 和 `parseFloat(x)` 进行显式转换。\n\n> **注意**：如果你对 `Number`、`String` 或 `Boolean`\
  \ 之一的函数使用 `new`，结果将是一个“包装对象”，即一个包含该值的对象，*而不是*命名类型的值。这在大多数情况下仍然可以工作（布尔对象除外，它始终为“真”）。\n\
  \n所有对象都有 `toString` 方法，可以通过 `object.toString()` 调用。为自己的对象重写此方法通常是一个好主意。\n\n以下函数可以在字符串和数字之间转换：\n\
  \n* `Number(string)`—如果可能，将整个 `string` 转换为数字，否则返回 `NaN`（**N**ot **a N**umber）。\n\
  \n* `parseInt(string)`—如果可能，将 `string` 的起始字符转换为数字，否则返回 `NaN`。`ParseInt` 忽略任何不属于整数的后续字符，例如小数点。\n\
  \n* `parseFloat(string)`—如果可能，将 `string` 的起始字符转换为数字，否则返回 `NaN`。`parseFloat` 忽略任何不属于数字的后续字符。\n\
  \n* `variable.toFixed(d)`—将 `variable` 中的数字转换为带有小数点后 `d` 位数字的字符串。\n\n* `variable.toString(base)`—将\
  \ `variable` 中的数字转换为该数字在给定 `base`（2 到 36）下的字符串表示。\n\n对于 `toFixed` 和 `toString`，如果使用字面量整数代替\
  \ `variable`，则需要两个点——一个作为数字的一部分，另一个用于指示方法调用（例如，`123..toString(8)` 或 `123.0.toString(8)`）。\n\
  \n可以在普通对象、map 和二元素数组数组之间进行转换。\n\n* `array = Array.from(map);`\n\n* `array = Object.entries(object);`\n\
  \n* `map = new Map(array);`\n\n* `map = new Map(Object.entries(object));`\n\n* `object\
  \ = Object.fromEntries(map);`\n\n* `object = Object.fromEntries(array);`\n\n## 3.5\
  \ 数学\n\n`Math` 类提供了常量 `Math.E` (e)、`Math.PI` (π)、`Math.LN2` (log[e]2) 和 `Math.LN10`\
  \ (log[e]10) 等。\n\n`Math` 类提供的一些方法包括：\n\n* `Math.abs(x)`—返回 `x` 的绝对值。\n\n* `Math.sign(x)`—返回与\
  \ `x` 相同的 `-1`、`0` 或 `1` 之一。\n\n* `Math.trunc(x)`—返回 `x` 的整数部分。\n\n* `Math.round(x)`—返回最接近\
  \ `x` 的整数。\n\n* `Math.floor(x)`—返回小于或等于 `x` 的最大整数。\n\n* `Math.ceil(x)`—返回大于或等于 `x`\
  \ 的最小整数。\n\n* `Math.max(x1, x2, ..., xN)`—返回参数中最大的。\n\n* `Math.min(x1, x2, ...,\
  \ xN)`—返回参数中最小的。\n\n* `Math.sqrt(x)`—返回 `x` 的正平方根。\n\n* `Math.cbrt(x)`—返回 `x` 的立方根。\n\
  \n* `Math.random()`—返回范围在 `0 <= r < 1` 内的伪随机数 `r`。\n\n`Math` 类还提供了标准的对数和三角函数 `exp`、`log`、`log10`、`log2`、`sin`、`cos`、`tan`、`asin`、`acos`、`atan`，以及\
  \ `sinh`、`cosh`、`tanh`、`asinh`、`acosh` 和 `atanh`。\n\n## 3.6 关键字\n\n大多数语言都有一组保留字或关键字，它们具有特殊含义且不能用标识符。JavaScript\
  \ 的特殊之处在于保留字集不断变化。\n\n| `arguments` | `else` | `in` | `super` |\n| `await` | `enum`\
  \ | `instanceof` | `switch` |\n| `case` | `export` | `let` | `this` |\n| `catch`\
  \ | `finally` | `package` | `throw` |\n| `const` | `extends` | `null` | `try` |\n\
  | `class` | `false` | `new` | `typeof` |\n| `continue` | `for` | `private` | `var`\
  \ |\n| `debugger` | `function` | `protected` | `void` |\n| `default` | `if` | `public`\
  \ | `while` |\n| `delete` | `implements` | `return` | `with` |\n| `do` | `import`\
  \ | `static` | `yield` |\n\n你应该避免将以下内容用标识符：\n\n*   不再是保留字的词：`abstract`、`boolean`、`byte`、`char`、`double`、`final`、`float`、`goto`、`int`、`long`、`native`、`short`、`synchronized`、`throws`、`transient`\
  \ 和 `volatile`。\n\n*   JavaScript 对象、属性和方法的名称，例如 `Array`。\n\n*   HTML 对象和属性名称，例如\
  \ `button`。\n\n*   HTML 事件处理程序的名称，例如 `onkeypress`。\n\n## 3.7 良好的运算符\n\n表达式是指任何产生值的\
  \ JavaScript 代码。表达式可以是简单的单个常量或单个变量。\n\n优先级（由较大的数字表示）较高的运算符会在优先级较低的运算符之前执行。例如，在表达式\
  \ `2 * 3 + 4 * 5` 中，乘法在加法之前执行，因为乘法的优先级高于加法。许多不被认为是运算符的东西（例如括号和数组索引）也有优先级。\n\n当运算符优先级相同时，它们的结合性（“从左到右”或“从右到左”）决定了先执行哪些操作。例如，减法是*左结合的*，所以\
  \ `10 - 5 - 3` 意味着 `(10 - 5) - 3` 而不是 `10 - (5 - 3)`。大多数二进制运算符（幂之外）都是左结合的；赋值运算符是右结合的，所以\
  \ `a = b = c + 5` 意味着 `a = (b = c + 5)` 而不是 `(a = b) = c + 5`。\n\n\n\n\n括号用于覆盖上述规则并指定的求值顺序。当求值顺序可能不直观时，括号也用于显示求值顺序。\n\
  \n表 3.2 列出了最重要的运算符。其中许多运算符的意义显而易见；不常用的运算符将根据需要进行解释。\n\n表 3.2 JavaScript 的“良好”运算符\n\
  \n| 运算符 | 目的 | 结合性 | 优先级 |\n| --- | --- | --- | --- |\n| `( )` | 分组 | n/a | 21 |\n\
  | `obj` `.`prop` | 属性访问 | 左 | 20 |\n| `ary`[`index`]` | 数组索引 | 左 | 20 |\n| `new`\
  \ `type`(`args`)` | 对象创建 | n/a | 20 |\n| `fun`(`args`)` | 函数调用 | 左 | 20 |\n| `obj`\
  \ `?.` `prop` | 可选链 | 左 | 20 |\n| `new` `type` | 对象创建 | 右 | 19 |\n| `!` `value`\
  \ | 逻辑非 | 右 | 17 |\n| `+` `value` | 一元加 | 右 | 17 |\n| `-` `value` | 一元减 | 右 | 17\
  \ |\n| `typeof` `value` | 类型（字符串形式） | 右 | 17 |\n| `void` `value` | 视为 undefined\
  \ | 右 | 17 |\n| `delete` `obj`.`prop` | 删除属性 | 右 | 17 |\n| `expr` `**` `expr` |\
  \ 幂 | 右 | 16 |\n| `expr` `*` `expr` | 乘法 | 左 | 15 |\n| `expr` `/` `expr` | 除法 |\
  \ 左 | 15 |\n| `expr` `%` `expr` | 取余 | 左 | 15 |\n| `expr` `+` `expr` | 加法 | 左 |\
  \ 14 |\n| `expr` `-` `expr` | 减法 | 左 | 14 |\n| `expr` `<` `expr` | 小 | 左 | 12 |\n\
  | `expr` `<=` `expr` | 小于等于 | 左 | 12 |\n| `expr` `>` `expr` | 大 | 左 | 12 |\n| `expr`\
  \ `>=` `expr` | 大于等于 | 左 | 12 |\n| `expr` `in` `expr` | 对象拥有属性 | 左 | 12 |\n| `expr`\
  \ `instanceof` `type` | 对象是某类型 | 左 | 12 |\n| `expr` `==` `expr` | 等于 | 左 | 11 |\n\
  | `expr` `!=` `expr` | 不等于 | 左 | 11 |\n| `expr` `===` `expr` | 严格相等 | 左 | 11 |\n\
  | `expr` `!==` `expr` | 不严格相等 | 左 | 11 |\n| `expr` `&&` `expr` | 逻辑与 | 左 | 6 |\n\
  | `expr` `||` `expr` | 逻辑或 | 左 | 5 |\n| `test` `?` `expr` `:` `expr` | 如果-那么-否则\
  \ | 右 | 4 |\n| `id` `=` `expr` | 简单赋值 | 右 | 3 |\n| `id op expr`, 其中 `op` 是 `=` `/%=%=+=-=&&=`\
  \ `||`=` `?=` 之一 | 代表 `id` `=`id op expr` | 右 | 3 |\n| `yield` `expr` | 协程退出 | 右\
  \ | 2 |\n| `expr` , `expr` | 多次求值 | 左 | 1 |\n\n## 3.8 运算符说明\n\n`&&` 运算符意味着“与”。`||`\
  \ 运算符意味着“或”。\n\n逻辑运算符 `&&` 和 `||` 是**短路**运算符。也就是说，如果从第一个（左侧）表达式已经知道了结果，则不会对第二个（右侧）表达式进行求值。因为\
  \ JavaScript 具有“真值”（truthy）和“假值”（falsy），`&&` 和 `||` 运算符并不一定返回 `true` 或 `false`，而是可能返回一个真值或假值。\n\
  \n*   `expr1` `&&` `expr2`——如果 `expr1` 为假值，结果为 `expr1`，否则结果为 `expr2`。\n*   `expr1`\
  \ `||` `expr2`——如果 `expr1` 为真值，结果为 `expr1`，否则结果为 `expr2`。\n\n对于一组由 `&&` 连接的值，结果是遇到的第一个假值，要么是最后一个真值。同样，对于一组由\
  \ `||` 连接的值，结果是遇到的第一个真值，要么是最后一个假值。这一事实有时会以一种“巧妙”的方式使用；例如，表达式 `x || 5` 当 `x` 为 0（或其他假值）时其值为\
  \ `5`，否则其值为 `x` 的值。\n\n各种赋值运算符**确实是**运算符。\n\n\n\n\n*   这是一个**具名函数字面量**。名称 `sqr`\
  \ 的作用域是函数块，因此它**仅**在函数体内部可用，在函数体内部它可以用于递归调用该函数。\n\n```javascriptlet square = (x)\
  \ => x * x;\n```\n\n*   这是一个**箭头函数**。如果只有一个参数，可以省略括号。箭头后的单个表达式就是结果。\n\n```javascript\n\
  let square = (x) => { return x * x; }\n```\n\n*   这是另一个**箭头函数**，展示了可以使用大括号，在这种情况下需要\
  \ `return` 语句。\n\n所有函数都有一个 `name` 属性。\n\n*   如果使用 `Function` 构造函数创建函数，则名称为 `\"anonymous\"\
  `。\n*   如果名称紧跟在 `function` 关键字之后，那么该名称就是函数的名称。\n*   如果将一个匿名函数立即赋值给变量，则该变量将成为函数的名称。\n\
  *   否则，函数的名称为空字符串。\n\n函数语句可以定义在其他函数内部，但它们应该位于函数的顶层，而不是在循环或 `if` 语句等语句内部。此类函数对于闭包函数是局部的：\n\
  \n```javascript\n function hypotenuse(x, y) {\n    function square(x) { return x\
  \ * x }\n    return Math.sqrt(square(x) + square(y));\n   }\n```\n\n原始值（`number`、`string`、`boolean`）是**按值**传递给函数的；对象是**按引用**传递的。这意味着函数接收的是原始值的副本，因此对它们进行的任何操作都不会在调用程序中产生影响。对于对象，函数接收的是实际对象的引用；对对象内部的任何更改都将由调用程序看到。\n\
  \n换句话说，在函数内部更改参数的值不会改变函数外部的值，但更改作为参数传递的对象的属性会改变函数外部的值。\n\n### 3.10.2 参数 (Parameters)\
  \ 与 实 (Arguments)\n\n我们使用以下术语：**参数**（parameter）是函数定义头部的变量；**参数**（argument）是调用该函数时的表达式。\n\
  \nJavaScript 并不要求调用函数时的参数数量与其参数数量相同。多余的参数会被忽略，而缺失的参数值值为 `undefined`。\n\n在函数中，特殊变量\
  \ `arguments` 是一个类数组对象，保存了函数调用时传递的**所有**参数，无论函数定义中使用了多少参数。它可以像数组一样被索引，或者用 `for`\
  \ 循环进行遍历，但缺乏数组的大多数其他功能。`arguments` 变量主要用于旧代码；在严格模式下是不允许使用的。现代代码更有可能使用剩余参数（rest parameters，见下文）。\n\
  \n参数可以赋予默认值；如果缺少参数，则使用默认值。默认值的形式为赋值，并且可以在表达式中使用之前的参数。例如：\n\n```javascript\n function\
  \ foo(a, b = 10, c = a * b) {\n    return a + b + c;\n   }\n   console.log(foo(3));\
  \ // 结果为 43\n```\n\n因为参数是通过位置与参数匹配的，所以所有没有默认值的参数必须在所有带默认值的参数之前。\n\n**剩余参数**（rest\
  \ parameter）是将所有剩余参数收集到数组中的参数。剩余参数通过在其前面加上三个点（`...`）来指定。例如，如果定义一个函数：\n\n```javascript\n\
  \ function foo(x, y, ...z) {\n    console.log(`x is ${x}`);\n    console.log(`y\
  \ is ${y}`);\n    console.log(`z is ${z}`);\n   }\n```\n\n并进行调用：\n\n```javascript\n\
  \ foo(1, 2, 3, 4, 5);\n```\n\n那么控制台将写入内容：\n\n```\n \"x is 1\"\n \"y is 2\"\n \"\
  z is 3,4,5\"\n```\n\n由于 `...` 收集了所有剩余参数，它只能作为最后一个参数使用。\n\n点也可以反向使用，在函数的参数中。当它被放在函数调用中的数组之前时，数组中的值会被拆分成单独参数。这对于接收任意数量参数的很有用。\n\
  \n```javascript\n let ary = [2, 7, 1, 3];\n let m = Math.max(...ary);\n```\n\n像这样使用时，点被称为**展开**（spread）。展开也可以应用于集合（sets）和映射（maps）。\n\
  \n展开可以用于创建数组的浅拷贝。\n\n```javascript\n let ary2 = [...ary];\n```\n\n### 3.10.3 函数是数据\n\
  \n函数名称后面如果没有跟着参数列表，则指代函数本身。函数可以赋值给变量：\n\n```javascript\n function square(x) {\n\
  \    return x * x;\n   }\n\n   let square2 = square;\n   let result = square2(5);\
  \ // 25\n\n   let myArray = new Array();\n   myArray[10] = square;\n   result =\
  \ myArray10; // 49\n```\n\n函数可以被打印。调用 `square.toString()` 将返回函数的列表，就像上面显示的那样。\n\n\
  函数可以赋值给属性。赋值给属性的函数被称为**方法**（method）。在方法内部，`this` 指向该对象。\n\n### 3.10.4 函数是对象\n\n\
  函数名称后面如果没有跟着参数列表，则指代函数本身。函数可以赋值给变量：（见上文）。\n\n函数可以被打印。调用 `square.toString()` 将返回函数的列表，就像上面显示的那样。\n\
  \n函数可以赋值给属性。赋值给属性的函数被称为**方法**（method）。在方法内部，`this` 指向该对象。\n\n### 3.10.5 函数方法\n\n\
  **方法**（method）是属于一个对象的函数。但函数本身也是对象，并且拥有方法。考虑：\n\n```javascript\n let car = { make:\
  \ \"Subaru\", year: 2018,\n     age(now) { return now - this.year; } };\n   let\
  \ fn = car.age;\n```\n\n此时 `fn` 是一个函数，具体来说是函数 `age() {return now - this.year}`。它不再附加到对象，因此它不再是一个方法。\n\
  \n\n\n\n\n* `fn.apply(car, [2021])` — 返回 `3`。\n\n* `let g = f.bind(obj, \"arg1,\
  \ ..., argN\")` — 返回一个新函数 `g`，它使用 `obj` 作为 `this` 的值，并填充了前 `N` 个参数。\n\n* `let g\
  \ = fn.bind(car)` — 给 `g` 分配一个期望 `year` 参数的函数。\n\n* `let h = bind(car, 2021)` —\
  \ 给 `h` 分配一个不接受参数并返回 `3` 的函数。\n\n### 3.10.6 闭包 (Closures)\n\n假设一个函数定义在另一个函数内部；我们将它们称为“外部函数”和“内部函数”。外部函数构成了内部函数的环境，因此内部函数可以使用外部函数的局部变量。如果外部函数返回，其所有的局部变量（通常情况下）都会被回收。\n\
  \n但如果内部函数在外部函数消失后仍然存在呢？这种情况是有 way——（此前的）内部函数可以存储在变量中，或者作为外部函数的结果返回。如果执行了内部函数，它仍然需要访问外部函数的局部变量。\n\
  \n解决方案是，这些局部变量不会被回收——它们被“闭获”并保留以供（此前的）内部函数使用。\n\n```\n function make_counter() {\n\
  \    let n = 0;\n    let count = function() {\n     n += 1;\n     return n;\n  \
  \  }\n    return count;\n   }\n\n   let counter = make_counter();\n   console.log(counter());\
  \ // 1\n   console.log(counter()); // 2\n```\n\n在这里，`make_counter` 函数声明了一个局部变量 `n`，它在\
  \ `count` 函数内部使用。`count` 函数作为 `make_counter` 的结果返回，但它仍然可以访问变量 `n` 所使用的存储位置，该位置被\
  \ `count` “闭获了”。这被称为*闭包*。（变量 `n` 被回收且不再可访问，但它使用的存储空间并未被释放。）\n\n每次调用 `make_counter`\
  \ 都会创建一个*新的*局部变量 `n`，它与之前的任何变量都独立。通过这种方式，可以创建多个独立的计数器。\n\n创建闭包并不一定非要使用嵌套函数。在代码块中创建并使用该块变量的函数，可以放入作用比代码块更大的变量中。结果仍然是一个闭包。\n\
  \n```\n let v; // 代码块外部\n   { let n = 0;\n     let count = function() {\n      \
  \ n += 1;\n       return n;\n     }\n     v = count;\n   }\n\n   console.log(v());\
  \ // 1\n   console.log(v()); // 2\n```\n\n### 3.10.7 生成器 (Generators)\n\n*生成器*是一种特殊的函数，它会记住自己在函数中的执行位置，并在再次被使用时，会从上次停止的地方继续。这对于产生一个（可能是无限的）序列非常有用。\n\
  \n定义生成器：\n\n* 使用 `function*` 而不是 `function`。\n\n* 使用 `yield value` 代替 `return value`。当执行\
  \ `yield` 时，它返回一个对象 `{value: value, done: false}`。\n\n    * 生成器的下一次使用将从 `yield`\
  \ 语句之后继续执行。\n\n    * 使用 `return` 语句或到达函数末尾将终止生成器；返回的值是对象 `{value: undefined, done:\
  \ true}`。\n\n使用生成器：\n\n* 调用用 `function*` 定义的函数。这返回一个*生成器对象*，而不是生成器计算的值。\n\n* 在 `for/of`\
  \ 循环中使用生成器对象（而不是 `for/in`，后者将无所作为）；**或者**\n\n* 根据需要多次调用生成器的 `next()` 方法。这会返回一个上述的对象。\n\
  \n    * 生成器只能使用一次。一旦生成器完成，它就结束了。不过，你可以随时创建一个新的。\n\n作为一个示例，我们将编写一个非常生成器，它接收一个参数 `n`\
  \ 并反复将其减半（向下取整到最接近的整数），直到返回 `1`。\n\n```\n function* half(n) {\n    yield n;\n  \
  \  while (n > 1) {\n     n = Math.floor(n / 2);\n     yield n;\n    }\n   }\n```\n\
  \n我们可以这样使用它：\n\n```\n let gen = half(10);\n   for (i of gen) {\n    console.log(i);\n\
  \   }\n```\n\n这将产生值 `10`、`5`、`2` 和 `1`。\n\n或者，我们可以显式地使用生成器的 `next()` 方法。\n\n```\n\
  \ gen = half(10);\n   let obj = gen.next();\n   while (! obj.done) {\n    console.log(obj.value);\n\
  \    obj = gen.next();\n   }\n```\n\n这将产生相同的值序列。\n\n### 3.10.8 迭代器 (Iterators)\n\
  \n*迭代器*（iterable）是任何可以逐一个元素进行遍历的对象。*迭代器*（iterator）是一个实现了遍历方法的对象。\n\n## 11 对象 (Objects)\n\
  \n### 3.11.1 对象的定义\n\nJavaScript 是一种面向对象的语言。\n\n在 JavaScript 中，你可以创建对象而无需定义类。这一节关于对象；类将在稍后介绍。\n\
  \n*对象*是具命值的值的集合（称为*属性*或*字段*）。对象使用点表示法，与其他面向对象的语言一样，但它们的行为更像哈希表（也称为映射或字典）。\n\n你可以通过在大括号中封装\
  \ `key:`value` 对来编写*对象字面量*。例如：\n\n```\n let car = {make: \"Subaru\", year: 2018}\n\
  ```\n\n这定义了具有 `make` 和 `year` 属性的对象 `car`。你可以使用点表示法引用字段。例如，语句\n\n```\n console.log(car.make\
  \ + \" \" + car.year);\n```\n\n向控制台写入 `\"Subaru 2018\"`。如果你没有打开控制台，将看不到结果；在这种情况下，你可能希望使用\n\
  \n```\n alert(car.make + \" \" + car.year);\n```\n\n替代。\n\n我们可以向现有对象添加属性：\n\n```\n\
  \ car.mileage = 25041;\n```\n\n或者删除它们：\n\n```\n delete car.mileage;\n```\n\n属性名（`key`:`value`\
  \ 中的“键”部分）始终是字符串（不需要引号）或符号。看起来可能不像那样；以下代码是合法的：\n\n```\n let nums = {2: \"two\",\
  \ 3.1416: \"pi\"}\n```\n\n在这段代码中，键实际上是*字符串* `\"2\"` 和 `\"3.1416\"`。\n\n\n\n\n访问属性的第二方法：你可以使用方括号\
  \ `[]` 而不是点表示法。与其使用 `nums.2` 或 `nums.3.1416`（这些都是非法的语法）不同，你可以说 `nums[2]` 和 `nums[3.1416]`。括号内的任何表达式都会被求值，并将结果转换为字符串；因此\
  \ `nums[5-3]` 等于 `nums[\"2\"]`。\n\n在创建或向对象添加属性时，也可以使用括号。继续上面的示例，可以使用以下两个语句之一向 `car`\
  \ 添加属性 `mileage`，或者如果 `mileage` 已经是一个属性，则更新它的值：\n\n```javascript\n car.mileage =\
  \ 25300;\n car[\"mileage\"] = 25300;\n```\n\n在创建对象时，可以使用括号来计算属性名（键）、值或两者都有。\n\n\
  ```javascript\n let property = \"make\";\n let make = \"Subaru\";\n let age = 2;\n\
  \ car = {[property]: [make], year: 2020 - age}\n```\n\n如果你有一些包含值的变量，并想创建一个具有相同名称和值的对象，可以使用一种非常方便的简写方法。只写变量名等同于添加一个同名的属性以及该变量的值。例如，如果\n\
  \n```javascript\n let make = \"Subaru\";\n let year = 2018;\n```\n\n那么\n\n```javascript\n\
  \ let car = {make, year}\n```\n\n是以下内容的简写：\n\n```javascript\n let car = {make: \"\
  Subaru\", year: 2018}\n```\n\n要测试对象是否存在特定属性，使用 `in` 运算符。例如，`\"make\" in car` 返回\
  \ `true`。\n\n你可以使用 `for/in` 循环遍历对象的所有属性。以下代码：\n\n```javascript\n for (prop in car)\
  \ {\n    console.log(prop + \" is \" + car[prop])\n   }\n```\n\n将在控制台上显示以下内容：\n\n\
  ```\n \"make is Subaru\"\n \"year is 2018\"\n```\n\n### 3.11.2 创建对象\n\n在上一节中，我们通过编写对象字面量\
  \ `{make: \"Subaru\", year: 2018}` 创建了一个对象，然后将其赋值给变量 `car`。\n\n创建 `car` 对象的另一种方法是先创建一个“空”对象，然后为其添加属性：\n\
  \n```javascript\n let car = Object(); // 或 let car = {};\n car.make = \"Subaru\"\
  ; // 这里不要用 'let'\n car.year = 2018;\n```\n\n创建此对象的第三种方法是编写一个函数，为关键字 `this` 的属性赋值，然后通过显式地返回\
  \ `this` 作为结果。\n\n```javascript\n function Car(make, year) {\n    this.make = make;\n\
  \    this.year = year;\n    return this;\n   }\n```\n\n我们可以以通常的方式调用此函数。\n\n```javascript\n\
  \ let car = Car(\"Subaru\", 2018);\n```\n\n注意，该函数将 `make` 和 `year` 同时用作变量名和属性名。这并非必须；我们可以为变量和属性使用不同的名称。但能够使用相同的名称是方便的，而没必去想同义词。\n\
  \n创建 `car` 对象的还有一种方法。我们再次写一个函数，但这次我们没有显式地返回 `this` 作为结果。\n\n```javascript\n function\
  \ Car(make, year) {\n    this.make = make;\n    this.year = year;\n   }\n```\n\n\
  由于没有显式的 `return` 语句，如果按通常方式，此函数将返回 `undefined`。尽管如此，我们可以通过在函数调用中使用关键字 `new` 来获取\
  \ `car` 对象。\n\n```javascript\n let car = new Car(\"Subaru\", 2018);\n```\n\n在函数调用前加上\
  \ `new` 会做两件事：它在函数内部创建一个名为 `this` 的新局部变量，并隐式地返回 `this` 作为结果。\n\n这样使用的函数充当对象的构造函数。惯例是将构造函数的首字母大写（因此是\
  \ `Car` 而不是 `car`）。当需要定义多个相似的对象时（例如，多个 `car` 对象），就会使用构造函数。\n\n> **注意**：默认情况下，构造函数返回新创建的对象\
  \ `this`。可以使用 `return` 语句显式地返回另一个对象，但不是原始类型。尝试返回原始值没有效果。\n\n当通过调用构造函数创建对象时，测试 `instanceof`\
  \ 构造函数（例如 `car instanceof Car`）将测试该对象是否是使用该构造函数创建的。这与 `typeof(car)` 相对，后者将返回字符串\
  \ `\"object\"`。\n\n`Object.create(proto)` 方法使用现有对象 `proto` 作为新对象的原型。新创建的对象没有它自己的属性；它是“透明”的，这意味着任何读取其属性的尝试都会“穿过它”并读取原型的属性。\n\
  \n```javascript\n let car2 = Object.create(car);\n car2.make = \"VW\";\n car2.color\
  \ = \"blue\";\n```\n\n执行这些语句后，`car` 将保持不变，但 `car2` 将具有 `\"VW\"` 作为其 `make`，将 `\"\
  blue\"` 作为其 `color`。\n\n### 3.11.3 拷贝对象\n\n遵循这些语句后，`car` 将保持不变，但 `car2` 将具有 `\"\
  VW\"` 作为其 `make`，`\"blue\"` 作为其颜色，以及 `2018` 作为其 `year`。（注：原文此处逻辑可能存在乱码，已根据语境翻译）\n\
  \n*(注：由于提供的原文中 3.11.3 之后的内容出现了大量重复和逻辑断层，以下翻译基于对原文文本的字面还原)*\n\n如果你有一些包含值的变量，并想创建一个具有相同名称和值的对象，可以使用一种非常方便的简写方法。……（此处重复前文内容）\n\
  \n要测试对象是否存在特定属性，使用 `in` 运算符。例如，`\"make\" in car` 返回 `true`。\n\n你可以使用 `for/in` 循环遍历对象的所有属性。……（此处重复前文内容）\n\
  \n### 3.11.4 方法\n\n方法是附加到对象上的函数。\n\n```javascript\n let now = new Date().getFullYear();\n\
  \   let car = {\n    make: \"Subaru\",\n    year: 2018,\n    age: function() {\n\
  \                       return now - this.year;\n                    }\n       \
  \     }\n```\n\n在上述，`new Date()` 返回一个 `Date` 对象，其方法 `getFullYear()` 返回四位数字。\n\n\
  上面的 `car` 对象有一个名为 `year` 的属性。它不是一个变量；你不能直接说 `year`，必须说明它属于哪个对象。关键字 `this` 意味着“同一个对象”。\n\
  \n对象字面量内部的方法可以通过省略冒号和 `function` 单词来缩写。在 `car` 中，`age` 可以定义如下：\n\n```javascript\n\
  \ age() { return now - this.year; }\n```\n\n`age` 后的括号足以指示这是一个函数。\n\n### 3.11.5\
  \ 可选链\n\n对象可以包含其他对象的引用。例如，`Customer` 对象有一个 `address` 属性，而 `Address` 可能有一个 `number`\
  \ 属性。\n\n```javascript\n let cust = {\n    name: \"Jones\",\n    address: { number:\
  \ 29, street: \"main\" }\n   }\n```\n\n使用此对象你说 `cust.address.number`。这是一个链的示例。\n\
  \n有时信息缺失或不完整。如果 `cust` 或 `cust.address` 为 `undefined` 或 `null`，那么 `cust.address.number`\
  \ 将导致错误。\n\n为了避免这种错误，可以使用可选链运算符 `?.`。它将错误转换为 `undefined` 值。因此，`cust?.address?.number`\
  \ 要么有效，要么返回 `undefined`，但不会引起错误。\n\n\n\n\n可选链也可以用于以下场景：\n\n*   使用方括号访问属性：`cust?.[\"\
  address\"]`，\n*   对数组进行索引：`ary?.[n]`，以及\n*   调用可能未定义的方法：`cust.getOrder?.()`。\n \
  \   *   如果 `cust.getOrder` 属性存在但不是函数，这将导致错误。\n\n### 3.11.6 this\n\n> 你一直在用那个词。我不认为它的意思如你认为的那样。\n\
  > —威廉·戈德曼，《新娘娘的故事》\n\n在 JavaScript 中，`this` 关键字有多种含义。下面列出的前两个是最常见的用法。\n\n*   **在方法中**（属于对象的函数），`this`\
  \ 指向包含它的对象。\n    *   这类似于 `Java` 或 `C++` 中 `this` 的用法，或者 `Python` 中的 `self`。\n*\
  \   **在构造函数中**（通过通过 `new` 调用的函数），`this` 指向正在构造的对象。\n*   **在程序的顶层**，`this` 指向 `global\
  \ object`（全局对象）。\n    *   在浏览器中，全局对象是 `Window` 对象。\n*   **在函数中**，\n    *   **在非严格模式下**，`this`\
  \ 指向 `global object`。在浏览器中，全局对象是 `Window` 对象。\n    *   **在严格模式下**，`this` 的值为 `undefined`。\n\
  \    *   **在方法内部的函数中**，`this` 的含义与其在顶层函数中的含义相同；它不指向拥有方法的对象。\n*   **在箭头函数中**，`this`\
  \ 的含义与其在周围上下文中（而不是在箭头函数内部）的含义相同。\n*   **在事件处理器中**，`this` 指向接收事件的 `HTML element`（HTML\
  \ 元素）。\n\n`this` 的值是在运行时定义的，而不是在编译时定义的。例如，`this` 单词可能在函数中使用，，其初始值为 `undefined`。随后，该函数可能会被存储为对象的方法，导致\
  \ `this` 指向该对象。\n\n全局对象并不总是 `Window`。在 `Node.js` 中，全局对象是 `global`，而在 `Web Workers`\
  \ 中是 `self`。对于可以在任何这些环境任运行的代码，请使用 `globalThis` 来引用全局对象。\n\n### 3.11.7 高阶函数\n\n`高阶函数/方法`\
  \ 是期望将函数作为参数之一的函数或方法。数组有许多高阶方法。作为参数使用的函数通常在方法调用中使用箭头表示法直接定义，这很常见。在本节中，我们提供了几个示例；更完整的列表位于附录\
  \ B。\n\n> **提示**：箭头函数的语法为 `(parameters) => expression` 。\n\n`sort` 方法接受一个带有两个参数的函数，如果该函数的第一个参数小于、等于或大于第二个参数，该函数分别返回负值、零或正值。\n\
  \n```\nlet nums = [12, 43, 115, 9, 65, 1001, 902];\n\nnums.sort((a, b) => a - b);\n\
  // nums 是 [9, 12, 43, 65, 115, 902, 1001]\n\nnums.sort((a, b) => b - a);\n// nums\
  \ 是 [1001, 902, 115, 65, 43, 12, 9]\n\nnums.sort((a, b) => a % 10 - b % 10);\n//\
  \ nums 是 [1001, 902, 12, 43, 115, 65, 9]\n```\n\n上一个示例根据数字的个位（数字模 10）对数字进行排序。\n\n\
  高阶方法可以替换许多循环，产生更短且更具读性的代码。例如，`map` 方法将函数应用到数组的每个元素上，生成一个结果数组。\n\n```\na = [1, 2,\
  \ 3, 4, 5];\nasq = a.map(e => e ** 2);\n// asq = [1, 4, 9, 16, 25]\n```\n\n`filter`\
  \ 方法从数组中移除不需要的值，返回一个新的、更短的数组。\n\n```\na = [87, -1, 92, -1, -1, 98];\nafil = a.filter(x\
  \ => x >= 0);\n// afil = [87, 92, 98]\n```\n\n`reduce` 方法成对地对所有元素应用函数，返回一个单一值。下一个示例找到数组中数字之和。\n\
  \n```\na = [1, 2, 3, 4, 5];\nasum = a.reduce((x, y) => x + y);\n// asum = 15\n```\n\
  \n### 3.11.8 原型\n\n每个对象都有一个 `prototype`（原型），它是另一个“站在它后面”的对象，或者是它“基于的”的对象。如果没有特殊说明，对象的原型是\
