    * `document.scripts` — A list of all the `<script>` elements.\n\n#### 4.5.2.3\
    \ Creating Nodes\n\nYou have already met the document methods for finding nodes.\
    \ Here are some methods for creating nodes.\n\n* `document.createElement(tagName)`\
    \ — Returns a new `Element` with the given `tagName`.\n* `document.createAttribute(name)`\
    \ — Returns a new attribute with the given `name`. A value can be assigned to\
    \ it later.\n* `document.createComment(text)` — Returns a new comment node with\
    \ the given `text`.\n* `document.createTextNode(text)` — Returns a new `Text`\
    \ node with the given `text`.\n* `node.cloneNode(deep)` — Returns a copy of `node`;\
    \ if `deep` is true, all ancestors (the complete subtree of `node`) is also copied.\n\
    \nOnce nodes are created, they can be added to the document with `Node` methods.\n\
    \n### 4.5.3 Node Objects\n\nAs noted earlier, everything on an HTML page is represented\
    \ in the DOM, and accessible from the variable named `document`, which is of type\
    \ `Document`. The `Document` class is a subclass of the `Node` class. Other subclasses\
    \ of `Node` are `CharacterData`, `Element`, and `Attr`.\n\nThe type hierarchy\
    \ is large and complex. Fortunately, it is usually sufficient to think of the\
    \ DOM as a tree of `Node`s, most of which are `Element`s. Most useful is `document.body`,\
    \ which is the root of the entire `<body>` subtree.\n\n#### 4.5.3.1 Node Properties\n\
    \nHere are some of the properties of a `Node`:\n\n* `parentNode`, `firstChild`,\
    \ `nextSibling`, `previousSibling`, and `lastChild` are read-only properties that\
    \ allow movement from one `Node` to another.\n* `ownerDocument` — The `Document`\
    \ to which the `Node` belongs.\n* `nodeType` is an integer denoting the type of\
    \ node. There are 12 types; `1` for elements, `2` for attributes, `3` for text,\
    \ `9` for documents, and several others.\n* `children` — A live `HTMLCollection`\
    \ of all the child nodes of this node which are `Element`s. Other node types are\
    \ not included.\n* `childNodes` — A live `NodeList` of all the child nodes of\
    \ this node, regardless of type.\n* `textContent` — The complete text of the `Node`\
    \ and all its descendants, minus the HTML tags. In other words, the unstyled text\
    \ as it would be seen on the screen.\n\n> **Note**: Replacing the `innerHTML`\
    \ of an `Element` will cause the new text to be parsed as HTML, while replacing\
    \ its `textContent` will result in the new text being displayed as written.\n\n\
    #### 4.5.3.2 Node Methods\n\nNodes can be added, replaced, or deleted. Here are\
    \ some of the methods of a `Node`:\n\n* `node.before(sibs)` — Inserts `sibs` as\
    \ siblings (children of the same node) just before `node`.\n* `node.prepend(children)`\
    \ — Inserts `children` as children of `node` before any existing children.\n*\
    \ `node.append(children)` — Inserts `children` as children of `node` after any\
    \ existing children.\n* `node.after(sibs)` — Inserts `sibs` as siblings (children\
    \ of the same node) just after `node`.\n* `node.replaceWith(replacements)` — Replaces\
    \ `node` with some number of replacement nodes or strings.\n* `node.remove()`\
    \ — Removes `node`.\n\nIn the above, the arguments (`sibs`, `children`, `replacements`)\
    \ may be one or more nodes or strings. Strings will be inserted as text nodes.\n\
    \nRemoving or replacing a node also removes or replaces all the descendants of\
    \ that node.\n\n### 4.5.4 Elements\n\nEvery tag in an HTML page is represented\
    \ by an `Element` object in the DOM tree, and every attribute in a tag is represented\
    \ by an `Attribute` object in the DOM. Modifications to a DOM object are immediately\
    \ reflected in the appearance of the HTML page.\n\n#### 4.5.4.1 Element Properties\n\
    \nHere are some of the properties of an `Element`:\n\n* `element.tagName` — The\
    \ read-only name of the tag, in uppercase (e.g. `\"HEAD\"`).\n* `element.innerHTML`\
    \ — The text between the start tag and end tag.\n* `element.outerHTML` — A string\
    \ consisting of the start tag, the `innerHTML`, and the end tag.\n* `element.attributes`\
    \ — A `NamedNodeMap` (see below) of the attributes of `element`.\n\nA `NamedNodeMap`\
    \ is a live collection of `Attr` objects. (Despite the name, this is the only\
    \ kind of `Node` in a `NamedNodeMap`.) It is array-like, but is *not* an array.\
    \ It has a `length` property, and can be indexed into like an array.\n\n#### 4.5.4.2\
    \ Element Methods\n\nHere are some of the methods of `Element`:\n\n* `element.hasAttributes()`\
    \ — Returns true if `element` has attributes.\n* `element.getAttributeNames()`\
    \ — Array (possibly empty) of the names of attributes.\n* `element.getAttribute(name)`\
    \ — Returns the value of the named attribute.\n* `element.setAttribute(name, value)`\
    \ — Adds or updates the value of the named attribute.\n* `element.removeAttribute(name)`\
    \ — Removes the named attribute.\n* `element.getElementsByTagName(tagName)` —\
    \ Search within the element.\n* `element.getElementsByClassName(className)` —\
    \ Search within the element.\n* `element.querySelector(selector)` — Returns the\
    \ first matching element.\n* `element.querySelectorAll(selector)` — Returns all\
    \ matching elements.\n\nHTML text can be parsed and inserted into the DOM with\
    \ the following method:\n\n* `element.insertAdjacentHTML(where, html)` — Parses\
    \ the `html` and inserts the result into the DOM at the location specified by\
    \ the string `where`, which is one of:\n\n    * `\"beforebegin\"` — Before `element`.\n\
    \    * `\"afterbegin\"` — As the first child of `element`.\n    * `\"beforeend\"\
    ` — As the last child of `element`.\n    * `\"afterend\"` — After `element`.\n\
    \n### 4.5.5 CharacterData\n\nThere are three kinds of `CharacterData`: `Text`,\
    \ `Comment`, and `ProcessingInstruction` (not covered here). These have all the\
    \ properties and methods of `Node`, plus the following:\n\n* `data` — The text\
    \ content.\n* `length` — The number of characters in the text.\n* `nodeName` —\
    \ The string `\"#text\"`.\n* `appendData(data)` — Adds `data` to the end of the\
    \ text.\n* `insertData(offset, data)` — Inserts `data` into the text at the given\
    \ `offset`.\n* `deleteData(offset, count)` — Removes `count` characters from the\
    \ `text`, starting at the given `offset`.\n* `replaceData(offset, count, data)`\
    \ — Replaces `count` characters starting at `offset` with `data`.\n* `substringData(offset,\
    \ count)` — Returns `count` characters from the text, starting at `offset`.\n\
    * `remove()` — Removes the node from the DOM tree.\n\n### 4.5.6 Example: ShowTree\n\
    \nThe following HTML page will, when the button is clicked, write out the complete\
    \ tree of `Element`s to the console, though with severely abbreviated text. The\
    \ console must be open to see the results.\n"
