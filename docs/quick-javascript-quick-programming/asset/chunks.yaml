  trans: "\n\n一个 `get request`，`<form method=\"get\">` 是一个简单的信息请求。当发送的数据可能会更改服务器上的某些内容时，不应使用它。例如，永远不应用于下单。\n\
    \n表单数据附加到 URL 中，语法为 `?``name`=``value``&``name`=``value``&…`，例如 `google.com/search?q=octopus`。由于信息在\
    \ URL 中可见且可能会保留在浏览器历史记录中，因此 `get` 请求永远不应用于敏感信息。\n\n如果省略了 `method` 属性，它默认为 `get`。\n\
    \nURL 被限制为 2048 个 ASCII（*不是* Unicode）字符，因此这限制了可以被提交的数据量。对于大量信息，必须使用 `post`。\n\n\
    `Get` 请求可以加签。\n\n## 4.4.8.2 Post 请求\n\n一个 `post request`，`<form method=\"post\"\
    >` 通常用于除简单信息请求之外的所有情况。数据发送在请求体中，而不是 URL 中，因此可以发送大量数据。在正文中，其格式为 ``name`=``value``&``name`=``value``&…`。文件上传具有更复杂的结构。\n\
    \n`post` 请求比 `get` 请求更安全，因为它在 URL 中可见，不会被缓存，也不会留在浏览器的历史记录中。\n\n## 4.4.8.3 其他请求\n\
    \n还有其他几种 `method` 请求类型，例如 `head` 只请求页面头部而不请求主体，以及 `put` 请求服务器存储数据。\n\n服务器决定接受并处理哪些\
    \ `method` 请求。例如，服务器可能接受 `get` 请求但不接受 `post` 请求。\n\n服务器端代码可以用几乎任何语言编写。服务器端编码在在本书的范围之外。\n\
    \n## 4.4.9 额外的文本控件\n\n除了 `<input type=\"text\">` 之外，许多其他控件也允许文本输入。除了 `textarea`\
    \ 外，以下所有内容都写为 `<input type=\"``type`\">`。\n\n*   `password` — 密码字段中的所有字符都显示为点。这种区别仅影响用户看到的内容；输入的文本会被记录并可以像往常一样访问。\n\
    *   `search` — 这类似于 `<input type=\"text\">`，但在右端有一个小图标，点击它可以选择字段中之前的条目。\n*   `email`\
    \ — 一个可以输入电子邮件地址的文本字段。该条目会自动检查（在提交时），以确保它包含 `@` 字符。如果控件包含 `multiple` 标记，可以输入多个电子邮件地址，并用逗号分隔。\n\
    *   `number` — 一个可以输入整数的文本字段。它提供了上下箭头，用于在显示的数字上加或减一。如果提供了 `value` 属性，它将用作初始显示的初始数字。\n\
    *   `URL` — 一个可以输入 URL 的文本字段。该字段会自动检查（在提交时），以确保该条目是一个句法上正确的 URL。\n*   `textarea`\
    \ — `<textarea name=\"``name`\" rows=\"``nrows`\" cols=\"``ncols`\">` 控件提供了一个多行文本输入区域，由\
    \ `nrows` 行组成，宽度足够显示 `ncols` 个字符。\n    *   需要一个结束标签 `</textarea>`。起始标签和结束标签之间的文本（`innerHTML`）是文本区域中最初显示的内容。\n\
    \    *   文本区域中的文本将以等宽字体显示。\n    *   如果省略了 `name` 属性，在提交表单时文本区域中的数据将不会被包含。\n\n\
    有一些额外的输入控件可用于选择日期和时间，但这些在所有浏览器上尚未支持。\n\n*   `date` — 用于选择日历日期。\n*   `time` — 用于选择一天中的时间。\n\
    *   `datetime-local` — 用于选择日期时间。\n*   `week` — 用于选择周。\n\n## 4.4.10 其他输入控件\n\n\
    除了 `button`、`text`、`submit` 和 `password`，`<input>` 标签的 `type` 属性还有许多其他值。记住，对于\
    \ `<input>`，所有信息都在起始标签中；不使用结束 `</input>` 标签。\n\n这些控件中的许多一个没有向用户指示它们的用途，因此它们应该始终伴有一个\
    \ `label`，最好带有包含 `for` 属性的 label。\n\n*   `radio` — 控件 `<input type=\"radio\" id=\"\
    ``id`\" name=\"``group`\" value=\"``value`\">` 定义了一个单选按钮。单选按钮始终成组使用，每个单选按钮的 `name`\
    \ 属性具有相同的值。选择一组中的一个单选按钮会取消该组中所有其他单选按钮。\n    *   在 `form` 中，`group.value` 是所选单选按钮的值。如果不在表单中，必须单独检查单选按钮。\n\
    \    *   如果没有选择单选按钮，该组的 `value` 为空字符串。要从开始选中一个按钮，请给它加上 `checked` 标记。\n*   `checkbox`\
    \ — 控件 `<input type=\"checkbox\" id=\"``id`\" name=\"``group`\" value=\"``value`\"\
    >` 定义了一个单选按钮（注：原文此处应为复选框）。单选按钮始终成组使用，每个单选按钮的 `name` 属性具有相同的值。选择一组中的一个单选按钮会取消该组中所有其他单选按钮。\n\
    \    *   在 `form` 中，`group.value` 是所选单选按钮的值。如果不在表单中，必须单独检查单选按钮。\n    *   如果没有选择单选按钮，该组的\
    \ `value` 为空字符串。要从开始选中一个按钮，请给它加上 `checked` 标记。\n    （注：此处原文英文对 checkbox 的描述似乎误用了\
    \ radio 的逻辑，已按字面意思翻译）\n\n"
- fmt: '

    Event names are sometimes written in camelCase, for example `onClick` instead
    of `onclick`. This works because tags are in HTML, which is case insensitive,
    but does not work in the quoted JavaScript, which is case sensitive.


    The following events can be handled in `<body>` or `<frame>` elements (a `frame`
    is a separate URL file that is loaded as a part of a page):


    *   `onload` — the document or frame has completed loading. This can be used to
    execute a function to do any initialization required.

    *   `onunload` — the document or frame is unloaded. This can be used to perform
    any final cleanup actions.


    The following events can be handled by most elements.


    *   `onclick` — the element is clicked. Buttons will almost always handle an `onclick`
    event. Most other widgets handle all the usual actions automatically for the given
    type of widget.

    *   `ondblclick` — the element is clicked twice in close succession.

    *   `onmousedown` — one of the mouse buttons (or the keyboard equivalent) is pressed
    while over the widget. To distinguish which mouse button is pressed, use `onmousedown`
    instead of `onclick`. The value of `event.button` will be `0`, `1`, or `2` for
    the left, middle, and right mouse buttons, respectively.

    *   `onmouseup` — the mouse button is released while over the widget. This event
    is usually ignored in favor of handling the `onclick` event.

    *   `onmouseover` — the mouse is moved over the widget.

    *   `onmouseout` — the mouse is moved away from the widget.

    *   `onmousemove` — the mouse is moved.


    Modern devices may have touch screens or pens. The above `onmouse` events may
    be replaced with `onpointer` events which work equally well with both mouse and
    touch events.


    The following events can be handled by the `<body>` element and the `input` and
    `textarea` widgets.


    *   `onkeypress` — a key is clicked while this widget has focus.

    *   `onkeydown` — a key is depressed while this widget has focus.

    *   `onkeyup` — a key is released while this widget has focus.

    *   `onfocus` — the widget gains focus (for example, by the user tabbing to it).

    *   `onblur` — the widget loses the focus.

    *   `onchange` — the widget loses focus with a different value than it had when
    it gained focus.


    The following events are often handled in the enclosing `<form>` tag.


    *   `onselect` — a portion of text is selected. To retrieve the selected text,
    use `document.getSelection()`.

    *   `onreset` — the user has clicked a Reset button. If the value of the `onreset`
    attribute is `"return false"` or `"return someFunction()"` where `someFunction`
    returns `false`, the reset is cancelled.

    *   `onsubmit` — the user has clicked a Submit button. If the value of the `onsubmit`
    attribute is `"return false"` or `"return someFunction()"` where `someFunction`
    returns `false`, the submission is cancelled.


    The following events are usually handled by the `<img>` tag.


    *   `onabort` — image loading has been interrupted.

    *   `onerror` — there was an error loading the image.


    Event handlers have access to `event`. In the handler: `event.type` is the type
    of event. `event.target` is the element that triggered the event. `event.currentTarget`
    is the element the event listener is attached to. `event.button` indicates which
    mouse button was pressed: `0` for left, `1` for middle, and `2` for right. `event.clientX`
    and `event.clientY` indicate the position of the mouse relative to the browser
    viewport. `event.key` is the key that was pressed.


    ```javascript

    console.log("Wow!");

    ```


    ### 4.4 Bubbling


    When an event happens, it first hits the target element and then propagates up
    through its ancestors. This is called bubbling. You can stop the event from bubbling
    by calling `event.stopPropagation()`. To prevent the default action of an event,
    use `event.preventDefault()`.


    ### 4.5 The Window Object


    The `window` object is the global object in the browser. It has many properties
    and methods.


    #### 4.5.1 Window Properties


    Here are some of the `window` properties:


    *   `appName` — the name of the browser, such as `Netscape`.

    *   `platform` — the computer running the browser, such as `Win32` or `MacIntel`.

    *   `userAgent` — A detailed description of the platform.

    *   `self` — a reference to the current window.

    *   `length` — the number of frames in the window.

    *   `parent` — the immediately enclosing window.

    *   `document` — The HTML document displayed in this window.

    *   `top` — the outermost window.

    *   `location` — The URL of the document.


    #### 4.5.1.2 Window Methods


    Here are some available methods:


    *   `alert(string)` — Displays an alert dialog box containing the string and an
    OK button.

    *   `confirm(string)` — Displays a confirmation box containing the string along
    Cancel and OK buttons.

    *   `prompt(string)` — Displays a prompt box containing the string, a text field,
    and Cancel and OK buttons.

    *   `open(URL)` — Opens a new window containing the document specified by the
    URL.

    *   `close()` — Closes the given window, but only if it was opened by `open`.

    *   `setTimeout(function, delay, arg1, ..., argN)` — Sets a timer to call the
    `function` with optional arguments `arg1` through `argN` after `delay` milliseconds.

    *   `clearTimeout(timeoutId)` — Cancels a pending timeout started by `setTimeout`.

    *   `setInterval(code, interval)` — Sets a timer to execute the `code` every `interval`
    milliseconds.

    *   `clearTimeout(intervalId)` — Cancels the periodic execution of code started
    by `setInterval`.

