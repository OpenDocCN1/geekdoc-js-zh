    \ | Left | 1 |\n\n## 3.8 Operator Notes\n\nThe `&&` operator means “and.” The\
    \ `||` operator means “or.”\n\nThe logical operators `&&` and `||` are ***short-circuit***\
    \ operators. That is, if the result is known from the first (left-hand) expression,\
