  trans: "\n访问属性的第二方法：你可以使用方括号 `[]` 而不是点表示法。与其使用 `nums.2` 或 `nums.3.1416`（这些都是非法的语法）不同，你可以说\
    \ `nums[2]` 和 `nums[3.1416]`。括号内的任何表达式都会被求值，并将结果转换为字符串；因此 `nums[5-3]` 等于 `nums[\"\
    2\"]`。\n\n在创建或向对象添加属性时，也可以使用括号。继续上面的示例，可以使用以下两个语句之一向 `car` 添加属性 `mileage`，或者如果\
    \ `mileage` 已经是一个属性，则更新它的值：\n\n```javascript\n car.mileage = 25300;\n car[\"mileage\"\
    ] = 25300;\n```\n\n在创建对象时，可以使用括号来计算属性名（键）、值或两者都有。\n\n```javascript\n let property\
    \ = \"make\";\n let make = \"Subaru\";\n let age = 2;\n car = {[property]: [make],\
    \ year: 2020 - age}\n```\n\n如果你有一些包含值的变量，并想创建一个具有相同名称和值的对象，可以使用一种非常方便的简写方法。只写变量名等同于添加一个同名的属性以及该变量的值。例如，如果\n\
    \n```javascript\n let make = \"Subaru\";\n let year = 2018;\n```\n\n那么\n\n```javascript\n\
    \ let car = {make, year}\n```\n\n是以下内容的简写：\n\n```javascript\n let car = {make:\
    \ \"Subaru\", year: 2018}\n```\n\n要测试对象是否存在特定属性，使用 `in` 运算符。例如，`\"make\" in car`\
    \ 返回 `true`。\n\n你可以使用 `for/in` 循环遍历对象的所有属性。以下代码：\n\n```javascript\n for (prop\
    \ in car) {\n    console.log(prop + \" is \" + car[prop])\n   }\n```\n\n将在控制台上显示以下内容：\n\
    \n```\n \"make is Subaru\"\n \"year is 2018\"\n```\n\n### 3.11.2 创建对象\n\n在上一节中，我们通过编写对象字面量\
    \ `{make: \"Subaru\", year: 2018}` 创建了一个对象，然后将其赋值给变量 `car`。\n\n创建 `car` 对象的另一种方法是先创建一个“空”对象，然后为其添加属性：\n\
    \n```javascript\n let car = Object(); // 或 let car = {};\n car.make = \"Subaru\"\
    ; // 这里不要用 'let'\n car.year = 2018;\n```\n\n创建此对象的第三种方法是编写一个函数，为关键字 `this` 的属性赋值，然后通过显式地返回\
    \ `this` 作为结果。\n\n```javascript\n function Car(make, year) {\n    this.make =\
    \ make;\n    this.year = year;\n    return this;\n   }\n```\n\n我们可以以通常的方式调用此函数。\n\
    \n```javascript\n let car = Car(\"Subaru\", 2018);\n```\n\n注意，该函数将 `make` 和 `year`\
    \ 同时用作变量名和属性名。这并非必须；我们可以为变量和属性使用不同的名称。但能够使用相同的名称是方便的，而没必去想同义词。\n\n创建 `car` 对象的还有一种方法。我们再次写一个函数，但这次我们没有显式地返回\
    \ `this` 作为结果。\n\n```javascript\n function Car(make, year) {\n    this.make =\
    \ make;\n    this.year = year;\n   }\n```\n\n由于没有显式的 `return` 语句，如果按通常方式，此函数将返回\
    \ `undefined`。尽管如此，我们可以通过在函数调用中使用关键字 `new` 来获取 `car` 对象。\n\n```javascript\n let\
    \ car = new Car(\"Subaru\", 2018);\n```\n\n在函数调用前加上 `new` 会做两件事：它在函数内部创建一个名为 `this`\
    \ 的新局部变量，并隐式地返回 `this` 作为结果。\n\n这样使用的函数充当对象的构造函数。惯例是将构造函数的首字母大写（因此是 `Car` 而不是\
    \ `car`）。当需要定义多个相似的对象时（例如，多个 `car` 对象），就会使用构造函数。\n\n> **注意**：默认情况下，构造函数返回新创建的对象\
    \ `this`。可以使用 `return` 语句显式地返回另一个对象，但不是原始类型。尝试返回原始值没有效果。\n\n当通过调用构造函数创建对象时，测试\
    \ `instanceof` 构造函数（例如 `car instanceof Car`）将测试该对象是否是使用该构造函数创建的。这与 `typeof(car)`\
    \ 相对，后者将返回字符串 `\"object\"`。\n\n`Object.create(proto)` 方法使用现有对象 `proto` 作为新对象的原型。新创建的对象没有它自己的属性；它是“透明”的，这意味着任何读取其属性的尝试都会“穿过它”并读取原型的属性。\n\
    \n```javascript\n let car2 = Object.create(car);\n car2.make = \"VW\";\n car2.color\
    \ = \"blue\";\n```\n\n执行这些语句后，`car` 将保持不变，但 `car2` 将具有 `\"VW\"` 作为其 `make`，将 `\"\
    blue\"` 作为其 `color`。\n\n### 3.11.3 拷贝对象\n\n遵循这些语句后，`car` 将保持不变，但 `car2` 将具有 `\"\
    VW\"` 作为其 `make`，`\"blue\"` 作为其颜色，以及 `2018` 作为其 `year`。（注：原文此处逻辑可能存在乱码，已根据语境翻译）\n\
    \n*(注：由于提供的原文中 3.11.3 之后的内容出现了大量重复和逻辑断层，以下翻译基于对原文文本的字面还原)*\n\n如果你有一些包含值的变量，并想创建一个具有相同名称和值的对象，可以使用一种非常方便的简写方法。……（此处重复前文内容）\n\
    \n要测试对象是否存在特定属性，使用 `in` 运算符。例如，`\"make\" in car` 返回 `true`。\n\n你可以使用 `for/in`\
    \ 循环遍历对象的所有属性。……（此处重复前文内容）\n\n### 3.11.4 方法\n\n方法是附加到对象上的函数。\n\n```javascript\n\
    \ let now = new Date().getFullYear();\n   let car = {\n    make: \"Subaru\",\n\
    \    year: 2018,\n    age: function() {\n                       return now - this.year;\n\
    \                    }\n            }\n```\n\n在上述，`new Date()` 返回一个 `Date` 对象，其方法\
    \ `getFullYear()` 返回四位数字。\n\n上面的 `car` 对象有一个名为 `year` 的属性。它不是一个变量；你不能直接说 `year`，必须说明它属于哪个对象。关键字\
    \ `this` 意味着“同一个对象”。\n\n对象字面量内部的方法可以通过省略冒号和 `function` 单词来缩写。在 `car` 中，`age` 可以定义如下：\n\
    \n```javascript\n age() { return now - this.year; }\n```\n\n`age` 后的括号足以指示这是一个函数。\n\
    \n### 3.11.5 可选链\n\n对象可以包含其他对象的引用。例如，`Customer` 对象有一个 `address` 属性，而 `Address`\
    \ 可能有一个 `number` 属性。\n\n```javascript\n let cust = {\n    name: \"Jones\",\n \
    \   address: { number: 29, street: \"main\" }\n   }\n```\n\n使用此对象你说 `cust.address.number`。这是一个链的示例。\n\
    \n有时信息缺失或不完整。如果 `cust` 或 `cust.address` 为 `undefined` 或 `null`，那么 `cust.address.number`\
    \ 将导致错误。\n\n为了避免这种错误，可以使用可选链运算符 `?.`。它将错误转换为 `undefined` 值。因此，`cust?.address?.number`\
    \ 要么有效，要么返回 `undefined`，但不会引起错误。\n\n"
- fmt: "\nOptional chaining can also be used when:\n\n*   Using brackets to access\
    \ a property: `cust?.[\"address\"]`,\n*   Indexing into an array: `ary?.[n]`,\
    \ and\n*   Calling a possibly undefined method: `cust.getOrder?.()`.\n    *  \
    \ This will result in an error if the `cust.getOrder` property exists but is not\
    \ a function.\n\n### 3.11.6 This\n\n> You keep using that word. I do not think\
    \ it means what you think it means.\n> —William Goldman, The Princess Bride\n\n\
    In JavaScript, the keyword `this` has a number of meanings. The first two given\
    \ below are the most common uses.\n\n*   **In a method** (a function belonging\
    \ to an object), `this` refers to the containing object.\n    *   This is similar\
    \ to the use of `this` in `Java` or `C++`, or `self` in `Python`.\n*   **In a\
    \ constructor** (a function called with `new`), `this` refers to the object under\
    \ construction.\n*   **At the top level** of a program, `this` refers to the `global\
    \ object`.\n    *   In a browser, the global object is the `Window` object.\n\
    *   **In a function**,\n    *   **In nonstrict mode**, `this` refers to the `global\
    \ object`. In a browser, the global object is the `Window` object.\n    *   **In\
    \ strict mode**, `this` has the value `undefined`.\n    *   **In a function inside\
    \ a method**, `this` has the same meaning it does in a top-level function; it\
    \ does not refer to the object that owns the method.\n*   **In an arrow function**,\
    \ the meaning of `this` is the same as it would be if it were in the surrounding\
    \ context (not in the arrow function).\n*   **In an event handler**, `this` refers\
    \ to the `HTML element` that received the event.\n\nThe value of `this` is defined\
    \ at run time, not at compile time. For example, the word `this` may be used in\
    \ a function, where it initially has the value `undefined`. Later, that function\
    \ may be stored as a method of an object, with the result that `this` refers to\
    \ the object.\n\nThe global object isn’t always `Window`. In `Node.js` the global\
    \ object is `global`, while in `Web Workers` it is `self`. For code that will\
    \ work in any of these environments, use `globalThis` to refer to the global object.\n\
    \n### 3.11.7 Higher-Order Functions\n\nA `higher-order function/method` is a function\
    \ or method that expects a function as one of its arguments. Arrays have a number\
    \ of higher-order methods. It is common for a function used as an agument to be\
    \ defined directly in the method call, using the arrow notation. In this section\
    \ we provide a couple of examples; a more complete list is in [Appendix B](#appendix2.xhtml).\n\
    \n> **Reminder**: An arrow function has the syntax `(parameters) => expression`\
    \ .\n\nThe `sort` method takes a function of two arguments that returns a negative,\
    \ zero, or positive value if the first argument to that function is less than,\
    \ equal to, or greater than the second argument, respectively.\n\n```\nlet nums\
    \ = [12, 43, 115, 9, 65, 1001, 902];\n\nnums.sort((a, b) => a - b);\n// nums is\
    \ [9, 12, 43, 65, 115, 902, 1001]\n\nnums.sort((a, b) => b - a);\n// nums is [1001,\
    \ 902, 115, 65, 43, 12, 9]\n\nnums.sort((a, b) => a % 10 - b % 10);\n// nums is\
    \ [1001, 902, 12, 43, 115, 65, 9]\n```\n\nThis last example sorts numbers according\
    \ to their one’s digit (the number modulo 10).\n\nHigher-order methods can be\
    \ used to replace many kinds of loops, resulting in shorter and more readable\
    \ code. For example, the `map` method will apply a function to every element of\
    \ an array, producing an array of results.\n\n```\na = [1, 2, 3, 4, 5];\nasq =\
    \ a.map(e => e ** 2);\n// asq = [1, 4, 9, 16, 25]\n```\n\nThe `filter` method\
    \ removes unwanted values from an array, returning a new, shorter array.\n\n```\n\
    a = [87, -1, 92, -1, -1, 98];\nafil = a.filter(x => x >= 0);\n// afil = [87, 92,\
    \ 98]\n```\n\nThe `reduce` method applies the function pairwise to all elements,\
    \ returning a single value. The next example finds the sum of the numbers in an\
    \ array.\n\n```\na = [1, 2, 3, 4, 5];\nasum = a.reduce((x, y) => x + y);\n// asum\
    \ = 15\n```\n\n### 3.11.8 Prototypes\n\nEvery object has a `prototype`, which\
    \ is another object that “stands behind it,” or that it is “based on.” If not\
    \ otherwise specified, an object’s prototype is `Object`.\n\n```javascript\nlet\
    \ car = {\n  make: \"Subaru\",\n  year: 2018\n};\n```\n\nThe `car` object has\
    \ a `toString` method:\n\n```javascript\ncar.toString = function() {\n  return\
    \ this.year + \" \" + this.make;\n};\n```\n\nIf we call `car.toString()`, it returns\
    \ `\"2018 Subaru\"`.\n\nWe can add a property to the object:\n\n```javascript\n\
    car.wheels = 4;\n```\n\nThe `car` object now has a `prototype`:\n\n```javascript\n\
    let proto = Object.getPrototypeOf(car);\n```\n\nThe `proto` object is another\
    \ object:\n\n```javascript\n{\n  wheels: 4\n}\n```\n\nIf we add a property to\
    \ the prototype:\n\n```javascript\nproto.style = \"sedan\";\n```\n\nNow, if we\
    \ check `car.style`, it returns `\"sedan\"` because it finds it on the prototype.\n\
    \n```javascript\ndelete car.wheels;\n```\n\nThe `wheels` property is removed from\
    \ `car`, but it still exists on the prototype.\n\n```javascript\n{\n  make: \"\
    Sub,\n\n  :: 2018\n\ntoString: function() {\n    return this.year + \" \" + this.make;\n\
    \  }\n }\n```\n\nIf we loop over `car` properties, we only see its own properties:\n\
    \n```javascript\nfor (let e in car) {\n  console.log(e + \"=\" + car[e]);\n}\n\
    ```\n\nThe output is:\n\n```\nmake=Subaru\nyear=2018\ntoString=function() {\n\
    \  return this.year + \" \" + this.make;\n  }\n```\n\nWait, `toString` is not\
    \ listed because it is not `enumerable` by default. If we set `enumerable` to\
    \ `true`:\n\n```javascript\nObject.defineProperty(car, \"toString\", {\n  enumerable:\
    \ true,\n  configurable: true\n});\n```\n\nNow `toString` will appear in the loop.\n\
    \n```javascript\nlet proto.style = \"sedan\";\n```\n\nIf we set a flag to `false`:\n\
    \n```javascript\nObject.defineProperty(car, \"toString\", {\n  enumerable: false,\n\
    \  configurable: false\n});\n```\n\nNow `enumerable` can never be changed back\
    \ to `true`.\n\n### 3.11.9 Descriptors\n\nObjects have properties and values,\
    \ but the properties themselves have `descriptors`. The descriptors (flags) are:\n\
    \n*   `enumerable` — `true` if the property is listed when we loop over objects.\n\
    *   `writable` — `true` if the value can be changed.\n*   `configurable` — `true`\
    \ if the property can be deleted or flags modified.\n\nOur running example is:\n\
    \n```javascript\nlet car = {\n  make: \"Subaru\",\n  year: 2018,\n  toString()\
    \ {\n    return this.year + \" \" + this.make;\n  }\n};\n```\n\nIf we check the\
    \ descriptors of `car.year`:\n\n```javascript\nObject.getOwnPropertyDescriptor(car,\
    \ \"year\");\n```\n\nwe get:\n\n```javascript\n[object Object] {\n  configurable:\
    \ true,\n  enumerable: true,\n  value: 2018,\n  writable: true\n}\n```\n\nThese\
    \ two methods operate on the descriptors:\n\n*   `Object.getOwnPropertyDescriptor(obj,\
    \ property);`\n*   `Object.defineProperty(obj, property, {flag: boolean, …});`\n\
    \n### 3.11.10 Classes and Inheritance\n\n#### 3.11.10.1 Classes\n"
  raw: "Optional chaining can also be used when:\n\n*   Using brackets to access a\
    \ property: `cust?.[\"address\"]`,\n\n*   Indexing into an array: `ary?.[n]`,\
    \ and\n\n*   Calling a possibly undefined method: `cust.getOrder?.()`.\n\n   \
    \ *   This will result in an error if the `cust.getOrder` property exists but\
    \ is not a function.\n\n### 3.11.6 This\n\n> You keep using that word. I do not\
    \ think it means what you think it means.\n\n> \n\n> —William Goldman, The Princess\
    \ Bride\n\nIn JavaScript, the keyword `this` has a number of meanings. The first\
    \ two given below are the most common uses.\n\n*   **In a method** (a function\
    \ belonging to an object), `this` refers to the containing object.\n\n    *  \
    \ This is similar to the use of `this` in Java or C++, or `self` in Python.\n\n\
    *   **In a constructor** (a function called with `new`), `this` refers to the\
    \ object under construction.\n\n*   **At the top level** of a program, `this`\
    \ refers to the ***global object***.\n\n    *   In a browser, the global object\
    \ is the `Window` object.\n\n*   **In a function**,\n\n    *   **In nonstrict\
    \ mode**, `this` refers to the *global object*. In a browser, the global object\
    \ is the `Window` object.\n\n    *   **In strict mode**, `this` has the value\
    \ `undefined`.\n\n    *   **In a function inside a method**, `this` has the same\
    \ meaning it does in a top-level function; it does not refer to the object that\
    \ owns the method.\n\n*   **In an arrow function**, the meaning of `this` is the\
    \ same as it would be if it were in the surrounding context (not in the arrow\
    \ function).\n\n*   **In an event handler**, `this` refers to the HTML element\
    \ that received the event.\n\nThe value of `this` is defined at run time, not\
    \ at compile time. For example, the word `this` may be used in a function, where\
    \ it initially has the value `undefined`. Later, that function may be stored as\
    \ a method of an object, with the result that `this` refers to the object.\n\n\
    The global object isn’t always `Window`. In `Node.js` the global object is `global`,\
    \ while in `Web Workers` it is `self`. For code that will work in any of these\
    \ environments, use `globalThis` to refer to the global object.\n\n### 3.11.7\
    \ Higher-Order Functions\n\nA ***higher-order function/method*** is a function\
    \ or method that expects a function as one of its arguments. Arrays have a number\
    \ of higher-order methods. It is common for a function used as an agument to be\
    \ defined directly in the method call, using the arrow notation. In this section\
    \ we provide a couple of examples; a more complete list is in [Appendix B](#appendix2.xhtml).\n\
    \n> **Reminder**: An arrow function has the syntax `(`***parameters***) `=>` ***expression***.\n\
    \nThe `sort` method takes a function of two arguments that returns a negative,\
    \ zero, or positive value if the first argument to that function is less than,\
    \ equal to, or greater than the second argument, respectively.\n\n```\n let nums\
    \ = [12, 43, 115, 9, 65, 1001, 902];\n\n nums.sort((a, b) => a - b);\n // nums\
    \ is [9, 12, 43, 65, 115, 902, 1001]\n\n nums.sort((a, b) => b - a);\n // nums\
    \ is [1001, 902, 115, 65, 43, 12, 9]\n\n nums.sort((a, b) => a % 10 - b % 10);\n\
    \ // nums is [1001, 902, 12, 43, 115, 65, 9]\n```\n\nThis last example sorts numbers\
    \ according to their one’s digit (the number modulo 10).\n\nHigher-order methods\
    \ can be used to replace many kinds of loops, resulting in shorter and more readable\
    \ code. For example, the `map` method will apply a function to every element of\
    \ an array, producing an array of results.\n\n```\n a = [1, 2, 3, 4, 5];\n asq\
    \ = a.map(e => e ** 2);\n // asq = [1, 4, 9, 16, 25]\n```\n\nThe `filter` method\
    \ removes unwanted values from an array, returning a new, shorter array.\n\n```\n\
    \ a = [87, -1, 92, -1, -1, 98];\n afil = a.filter(x => x >= 0);\n // afil = [87,\
    \ 92, 98]\n```\n\nThe `reduce` method applies the function pairwise to all elements,\
    \ returning a single value. The next example finds the sum of the numbers in an\
    \ array.\n\n```\n a = [1, 2, 3, 4, 5];\n asum = a.reduce((x, y) => x + y);\n //\
    \ asum = 15\n```\n\n### 3.11.8 Prototypes\n\nEvery object has a ***prototype***,\
    \ which is another object that “stands behind it,” or that it is “based on.” If\
    \ not otherwise specified, an object’s prototype is `Object`.\n\nHere is our running\
    \ example:\n\n```\nlet myCar = {make: \"Subaru\", year: 2018};\n```\n\nIf we call\
    \ `myCar.toString()`, we get the string `\"[object Object]\"`. While this isn’t\
    \ very useful, it does show that `myCar` has a `toString` method. Where did it\
    \ come from? It came from `Object`, which is a prototype for all objects.\n\n\
    If we use a `for/in` loop to print `myCar` we will see its `make` and `year`,\
    \ but will not see the `toString` property of its prototype. The `for/in` loop\
    \ only loops through the direct properties of an object, not the properties inherited\
    \ from its prototype.\n\nWe can get the prototype of an object:\n\n```\n let proto\
    \ = Object.getPrototypeOf(myCar);\n```\n\nand having gotten it, we can add features\
    \ to it.\n\n```\n proto.style = \"sedan\";\n\n   proto.toString = function() {\n\
    \    return this.year + \" \" + this.make; };\n```\n\nWhen we ask for a property\
    \ of an object, be it a field like `make` or a method like `toString`, JavaScript\
    \ first looks at the object itself. If it is found, that is what is used. If it\
    \ isn’t a property of the object, JavaScript looks for it in the object’s prototype.\
    \ If still not found, JavaScript looks in the prototype’s prototype, and so on\
    \ all the way up to `Object`. Eventually the property will be found or `undefined`\
    \ will be returned.\n\nSetting a property of an object sets the property on *that*\
    \ object; it does not look at its prototype. If we set `myCar.wheels = 4`, the\
    \ `Car` object is unaffected. Getting a value from an object will look up to its\
    \ prototype if necessary, but setting a value never does.\n\n### 3.11.9 Descriptors\n\
    \nObjects have properties and values, but the properties themselves have ***descriptors***.\
    \ The descriptors (or boolean ***flags***) of a property are:\n\n*   `enumerable`\
    \ — `true` if the property will be listed when we ask for the keys of an object,\
    \ or when we loop over the properties.\n\n*   `writable` — `true` if the value\
    \ can be changed.\n\n*   `configurable` — `true` if the property can be deleted\
    \ or the flags modified.\n\n    *   Once a `configurable` flag is set to `false`,\
    \ it cannot be changed back to `true`.\n\nOur running example is\n\n```\n let\
    \ car = {\n    make: \"Subaru\", year: 2018,\n    toString() { return this.year\
    \ + \" \" + this.make; }\n   }\n```\n\nWhen we loop over the properties of the\
    \ `car` object, printing its keys and values, all of the fields that we defined\
    \ (`make`, `year`, `toString`) will be processed because all three are `enumerable`\
    \ by default.\n\n```\n for (let e in car) {\n    console.log(e + \"=\" + car[e]);\n\
    \   }\n```\n\nThe above code prints:\n\n```\n make=Subaru\n   year=2018\n   toString=toString()\
    \ {\n              return this.year + \" \" + this.make;\n            }\n```\n\
    \nThese two methods operate on the descriptors:\n\n*   `Object.getOwnPropertyDescriptor(`***obj***`,`\
    \ ***property***`);`\n\n*   `Object.defineProperty(`***obj***`,` ***property***`,\
    \ {`***flag***`:` ***boolean***`, …});`\n\nIf we display the result of\n\n```\n\
    \ Object.getOwnPropertyDescriptor(car, \"year\");\n```\n\nwe get\n\n```\n [object\
    \ Object] {\n    configurable: true,\n    enumerable: true,\n    value: 2018,\n\
    \    writable: true\n   }\n```\n\nIf we don’t want the `toString` method to appear\
    \ when we loop over the `car` object, we can write\n\n```\n Object.defineProperty(car,\
    \ \"toString\",\n                          {enumerable: false,\n             \
    \             configurable: false});\n```\n\nSetting `enumerable` to `false` keeps\
    \ `toFunction` from being visible as a key of `car` (it still exists and can be\
    \ used). Setting `configurable` to `false` prevents `enumerable` from ever being\
    \ changed back to `true`.\n\n### 3.11.10 Classes and Inheritance\n\n#### 3.11.10.1\
    \ Classes"
