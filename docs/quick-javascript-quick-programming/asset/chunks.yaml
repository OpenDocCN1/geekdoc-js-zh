  trans: "\n以下示例使用了三个函数：`yes` 和 `no` 仅打印它们的参数，而 `doSomething` 会选择一个随机数，如果数字大于 `0.5`\
    \ 则“成功”，如果数字较小则抛出异常。（为了简单起见，示例使用了 `Math.random` 代替某些可能实际耗长时间的任务。）\n\n```javascript\n\
    \ function yes(r) {\n    console.log(\"yes, \" + r);\n   }\n\n   function no(e)\
    \ {\n    console.log(\"no, \" + e);\n   }\n\n   function doSomething(resolve,\
    \ reject) {\n    let r = Math.random();\n    if (r > 0.50) resolve(r); // succeed\n\
    \    throw r + \" is too low\"; // fail\n   }\n```\n\n在这里我们利用了这些函数：\n\n```javascript\n\
    \ let promise = new Promise(doSomething);\n // other work\n promise.then(yes,\
    \ no);\n console.log(\"END\");\n```\n\n示例结果：\n\n`````` \"END\"\n \"no, 0.18252962330109224\
    \ is too low\"\n\n \"END\"\n \"yes, 0.938714265780423\"\n```\n\n`then` 返回的结果是一个\
    \ `Promise`。这允许 promise 进行“链式”，使得 `then` 返回的值可以传递给另一个 `then`。下面的示例将创建一个随机数，然后将其乘以\
    \ 100，再加上 1000，最后显示结果。\n\n```javascript\n let promise2 = new Promise(\n    someFun\
    \ => { return someFun(Math.random());\n    }).then(function(result) { return 100\
    \ * result;\n    }).then(function(result) { return 1000 + result;\n    }).then(function(result)\
    \ { console.log(result);\n    });\n```\n\n该语法不允许向 `Promise` 传递额外的参数；它所需要的任何额外信息必须从环境中获取。\n\
    \n### 3.4.11 转换\n\nJavaScript 会自动执行大多数转换（强制类型转换）。你也可以使用函数 `Number(x)`、`String(x)`、`Boolean(x)`、`BigInt(x)`、`parseInt(x,\
    \ base)` 和 `parseFloat(x)` 进行显式转换。\n\n> **注意**：如果你对 `Number`、`String` 或 `Boolean`\
    \ 之一的函数使用 `new`，结果将是一个“包装对象”，即一个包含该值的对象，*而不是*命名类型的值。这在大多数情况下仍然可以工作（布尔对象除外，它始终为“真”）。\n\
    \n所有对象都有 `toString` 方法，可以通过 `object.toString()` 调用。为自己的对象重写此方法通常是一个好主意。\n\n以下函数可以在字符串和数字之间转换：\n\
    \n* `Number(string)`—如果可能，将整个 `string` 转换为数字，否则返回 `NaN`（**N**ot **a N**umber）。\n\
    \n* `parseInt(string)`—如果可能，将 `string` 的起始字符转换为数字，否则返回 `NaN`。`ParseInt` 忽略任何不属于整数的后续字符，例如小数点。\n\
    \n* `parseFloat(string)`—如果可能，将 `string` 的起始字符转换为数字，否则返回 `NaN`。`parseFloat` 忽略任何不属于数字的后续字符。\n\
    \n* `variable.toFixed(d)`—将 `variable` 中的数字转换为带有小数点后 `d` 位数字的字符串。\n\n* `variable.toString(base)`—将\
    \ `variable` 中的数字转换为该数字在给定 `base`（2 到 36）下的字符串表示。\n\n对于 `toFixed` 和 `toString`，如果使用字面量整数代替\
    \ `variable`，则需要两个点——一个作为数字的一部分，另一个用于指示方法调用（例如，`123..toString(8)` 或 `123.0.toString(8)`）。\n\
    \n可以在普通对象、map 和二元素数组数组之间进行转换。\n\n* `array = Array.from(map);`\n\n* `array = Object.entries(object);`\n\
