  trans: "\n可选链也可以用于以下场景：\n\n*   使用方括号访问属性：`cust?.[\"address\"]`，\n*   对数组进行索引：`ary?.[n]`，以及\n\
    *   调用可能未定义的方法：`cust.getOrder?.()`。\n    *   如果 `cust.getOrder` 属性存在但不是函数，这将导致错误。\n\
    \n### 3.11.6 this\n\n> 你一直在用那个词。我不认为它的意思如你认为的那样。\n> —威廉·戈德曼，《新娘娘的故事》\n\n在 JavaScript\
    \ 中，`this` 关键字有多种含义。下面列出的前两个是最常见的用法。\n\n*   **在方法中**（属于对象的函数），`this` 指向包含它的对象。\n\
    \    *   这类似于 `Java` 或 `C++` 中 `this` 的用法，或者 `Python` 中的 `self`。\n*   **在构造函数中**（通过通过\
    \ `new` 调用的函数），`this` 指向正在构造的对象。\n*   **在程序的顶层**，`this` 指向 `global object`（全局对象）。\n\
    \    *   在浏览器中，全局对象是 `Window` 对象。\n*   **在函数中**，\n    *   **在非严格模式下**，`this` 指向\
    \ `global object`。在浏览器中，全局对象是 `Window` 对象。\n    *   **在严格模式下**，`this` 的值为 `undefined`。\n\
    \    *   **在方法内部的函数中**，`this` 的含义与其在顶层函数中的含义相同；它不指向拥有方法的对象。\n*   **在箭头函数中**，`this`\
    \ 的含义与其在周围上下文中（而不是在箭头函数内部）的含义相同。\n*   **在事件处理器中**，`this` 指向接收事件的 `HTML element`（HTML\
    \ 元素）。\n\n`this` 的值是在运行时定义的，而不是在编译时定义的。例如，`this` 单词可能在函数中使用，，其初始值为 `undefined`。随后，该函数可能会被存储为对象的方法，导致\
    \ `this` 指向该对象。\n\n全局对象并不总是 `Window`。在 `Node.js` 中，全局对象是 `global`，而在 `Web Workers`\
    \ 中是 `self`。对于可以在任何这些环境任运行的代码，请使用 `globalThis` 来引用全局对象。\n\n### 3.11.7 高阶函数\n\n\
    `高阶函数/方法` 是期望将函数作为参数之一的函数或方法。数组有许多高阶方法。作为参数使用的函数通常在方法调用中使用箭头表示法直接定义，这很常见。在本节中，我们提供了几个示例；更完整的列表位于附录\
    \ B。\n\n> **提示**：箭头函数的语法为 `(parameters) => expression` 。\n\n`sort` 方法接受一个带有两个参数的函数，如果该函数的第一个参数小于、等于或大于第二个参数，该函数分别返回负值、零或正值。\n\
    \n```\nlet nums = [12, 43, 115, 9, 65, 1001, 902];\n\nnums.sort((a, b) => a -\
    \ b);\n// nums 是 [9, 12, 43, 65, 115, 902, 1001]\n\nnums.sort((a, b) => b - a);\n\
    // nums 是 [1001, 902, 115, 65, 43, 12, 9]\n\nnums.sort((a, b) => a % 10 - b %\
    \ 10);\n// nums 是 [1001, 902, 12, 43, 115, 65, 9]\n```\n\n上一个示例根据数字的个位（数字模 10）对数字进行排序。\n\
    \n高阶方法可以替换许多循环，产生更短且更具读性的代码。例如，`map` 方法将函数应用到数组的每个元素上，生成一个结果数组。\n\n```\na = [1,\
    \ 2, 3, 4, 5];\nasq = a.map(e => e ** 2);\n// asq = [1, 4, 9, 16, 25]\n```\n\n\
    `filter` 方法从数组中移除不需要的值，返回一个新的、更短的数组。\n\n```\na = [87, -1, 92, -1, -1, 98];\nafil\
    \ = a.filter(x => x >= 0);\n// afil = [87, 92, 98]\n```\n\n`reduce` 方法成对地对所有元素应用函数，返回一个单一值。下一个示例找到数组中数字之和。\n\
    \n```\na = [1, 2, 3, 4, 5];\nasum = a.reduce((x, y) => x + y);\n// asum = 15\n\
    ```\n\n### 3.11.8 原型\n\n每个对象都有一个 `prototype`（原型），它是另一个“站在它后面”的对象，或者是它“基于的”的对象。如果没有特殊说明，对象的原型是\
    \ `Object`。\n\n```javascript\nlet car = {\n  make: \"Subaru\",\n};\n```\n\n```javascript\n\
    let car = {\n  make: \"Subaru\",\n  year: 2018,\n  toString() {\n    return this.year\
    \ + \" \" + this.make;\n  }\n};\n```\n\n如果没有特殊说明，`car` 对象的原型是 `Object`。\n\n```javascript\n\
    let car = {\n  make: \"Subaru\",\n  year: 2018,\n  toString() {\n    return this.year\
    \ + \" \" + this.make;\n  }\n};\n\nlet proto = Object.getPrototypeOf(car);\n//\
