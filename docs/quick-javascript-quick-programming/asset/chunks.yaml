  trans: "\n\n测试 `property` `in` `object`（其中 `property` 为字符串），当且仅当 `object` 具有该 `property`\
    \ 时将返回 `true`。对不存在的属性进行请求将得到值 `undefined`。\n\n### 2.2.3 内置对象类型\n\nJavaScript 提供了许多内置或预定义的对象类型。这些数组（arrays）、集合（sets）、映射（maps）、日期（dates）和正则表达式（regular\
    \ expressions）。\n\n### 2.2.4 数组\n\n`array` 是值的有序集合。可以通过在方括号中包含逗号分隔的值来定义 `array\
    \ literal`（数组字面量）：\n\n```\nlet ary = [\"cat\", \"dog\", \"mouse\"];\n```\n\n逗号可以放在值*之间*也可以放在值*之后*，因此上述赋值完全等于：\n\
    \n```\nlet ary = [\"cat\", \"dog\", \"mouse\", ];\n```\n\n最后一个逗号有时被称为 `trailing\
    \ comma`（尾随逗号）。\n\n数组索引从 0 开始；上述数组的第一个元素是 `ary[0]`，最后一个是 `ary[ary.length – 1]`。\n\
    \n可以通过简单地嵌套数组字面量来创建高维数组：\n\n```\nlet ary2d = [[11, 12], [21, 22]];\n```\n\n在上述赋值后，`ary2d[1]`\
    \ 是 `[21, 22]`，`ary2d[1][0]` 是 `21`。\n\n较少使用的形式是 `Array(values)`：\n\n```\nlet\
    \ ary = new Array(\"cat\", \"dog\", \"mouse\");\n```\n\n这种形式通常不推荐。它的一个奇特性是，如果参数是单一数值\
    \ `Array(n)`，结果是一个包含 `n` 个位置的 `sparse array`（稀疏数组），而不是一个包含单个值 `n` 的数组。\n\n在稀疏数组中，在为元素赋值之前，不会为数组元素分配存储；未赋值的位置将显示为\
    \ `undefined`。稀疏数组可以是任意大的（只有其中的实际值会贡献其大小），但处理起来速度较慢。\n\n数组的 `length` 属性总是最大索引加一。由于数组可能是稀疏的，`length`\
    \ 并不是数组中值的个数。\n\n数组可以从 `iterable types`（可以迭代的类型）中创建。\n\n*   `Array.from(set)`\
    \ — 返回一个包含 `set` 元素的数组。\n*   `Array.from(string)` — 返回一个来自 `string` 的字符数组，每个字符都是字符串。\n\
    *   `Array.from(map)` — 返回一个包含 `[key, value]` 数组的数组。\n*   `Array.from(array)`\
    \ — 返回 `array` 的（浅）拷贝。\n\n数组可以包含不同类型值的混合。\n\n### 2.2.5 集合\n\n`set` 是值的集合，其中：(1)\
    \ 没有值出现超过一次，(2) 值在集合中出现的顺序无关。\n\n操作操作有：\n\n*   `new Set(iter)` — 创建并返回一个包含可迭代对象\
    \ `iter`（通常是数组）中值的集合。要创建一个空集合，省略 `iter`。\n    *   如果 `iter` 是一个 map，结果是一个包含 `[key,\
    \ value]` 数组的集合。\n*   `set.has(value)` — 测试 `value` 是否是 `set` 的成员。\n*   `set.add(value)`\
    \ — 如果 `value` 尚不存在，则将其添加到 `set` 并返回 `set`。\n*   `set.delete(value)` — 如果 `value`\
    \ 在 `set` 中，则将其删除。`delete` 不返回 `set`；如果 `value` 在 `set` 中则返回 `true`，否则返回 `false`。\n\
    *   `set.clear()` — 移除 `set` 中的所有值并返回 `undefined`。\n*   `set.size` — 返回 `set`\
    \ 中的元素数量。\n\n### 2.2.6 映射\n\nMaps 是查找表。map 中的每个条目由一个键值对组成。键必须是唯一的，但相同的值可以多次。\n\
    \n操作有：\n\n*   `new Map()` — 创建并返回一个空的 map。\n*   `new Map(array_or_set)` — `array_or_set`\
    \ 必须由 `[key, value]` 数组组成；这返回一个包含这些键和值的 map。\n*   `map.has(key)` — 测试 `map` 是否包含给定的\
    \ `key`。\n*   `map.set(key, value)` — 设置或更改与 `key` 关联的值为 `value` 并返回修改后的 `map`。\n\
    *   `map.get(key)` — 返回与 `key` 关联的值，如果 `key` 不在 map 中则返回 `undefined`。\n*   `map.delete(key)`\
    \ — 从 map 中移除 `key` 及其关联的 `value`。如果 `map` 发生了变化则返回 `true`，如果在 map 中未找到 `key`\
    \ 则返回 `false`。\n*   `map.clear()` — 移除所有值并返回 `undefined`。\n\n### 2.2.7 日期\n\n\
    `Date` 对象表示时间中的某一个时刻，测量为自 Unix 元（1970 年 1 月 1 日 00:00:00 UTC）以毫秒数。\n\n要访问 `Date`\
    \ 对象的特定组件，使用以下方法：\n\n*   `date.getFullYear()` 和 `date.setFullYear(year)` — `setFullYear`\
    \ 也可以接收 `month` 和 `day`。\n*   `date.getMonth()` 和 `date.setMonth(month)` — `month`\
    \ 为 0（1 月）到 11（12 月）。\n*   `date.getDate()` 和 `date.setDate(day)` — `day` 为 1\
    \ 到 31。\n*   `date.getHours()` 和 `date.setHours(hours)` — `hours` 为 0 到 23。\n\
    *   `date.getMinutes()` 和 `date.setMinutes(minutes)` — `minutes` 为 0 到 59。\n*\
    \   `date.getSeconds()` 和 `date.setSeconds(seconds)` — `seconds` 为 0 到 59。\n*\
    \   `date.getMilliseconds()` 和 `date.setMilliseconds(ms)` — `ms` 为 0 到 999。\n\
    *   `date.getTime()` 和 `date.setTime(n)` — `n` 是自元以来的毫秒数。\n    *   `Date.now()`\
    \ 也返回自元以来的毫秒数，但比 `new Date().getTime()` 短。\n*   `date.getDay()` 返回 0 到 6，其中 0\
    \ 代表星期日（无论你在哪里，尽管 ISO 8601 指定周一为一周的第一天）。\n\n内部，`Dates` 被存储为自元以来的毫秒数。这使得日期运算变得非常简单，因为各种\
    \ `set` 方法的参数不受限于 `get` 方法返回的范围。例如：\n\n```\n let date = new Date();\n let day_of_month\
    \ = date.getDate();\n date.setDate(day_of_month + 100);\n```\n\n会将 `date` 设置为未来精确\
    \ 100 天的 `Date`，具有正确的月份和年份。\n\n### 2.2.8 正则表达式\n\n正则表达式 `regexp` 定义了一个应用于字符串的模式，用于确定该模式是否匹配字符串，或者在字符串中搜索匹配模式的子字符串。\n\
    \n"
- fmt: "\nRegular expressions are largely standardized, so all but the most idiosyncratic\
    \ patterns can be used in JavaScript. In this section, we assume a knowledge of\
    \ regular expressions and only describe how to use them in JavaScript. For the\
    \ reader unfamiliar with regular expressions, there is a brief discussion in Appendix\
    \ D.\n\nA regular expression is written inside forward slashes, and may be followed\
    \ by flags. For example, `/[a-z]+/gi` is the regular expression `[a-z]+` with\
    \ the global (`g`) and case-insensitive (`i`) flags. (`[a-z]+` will match any\
    \ sequence of lowercase letters.)\n\nParentheses are used to group parts of the\
    \ regular expression. Groups are numbered left to right, starting with `1`; an\
    \ easy way to find the number of a group is to count only the left (opening) parentheses.\
    \ Group `0` is the entire matched part. For example, in the pattern\n\n```\n a\
    \ = \"Call 1-800-555-1212 today!\"\n b = /1-800-((\\d\\d\\d)-(\\d\\d\\d\\d))/\n\
    \ // 0 12 3\n c = a.match(b)\n```\n\nThe results will be\n\n```\n c[0] = \"1-800-555-1212\"\
    \n c[1] = \"555-1212\"\n c[2] = \"555\"\n c[3] = \"1212\"\n```\n\nThe following\
    \ methods can be used to apply regular expressions:\n\n*   `string`.search(`regexp`)`\
    \ — Returns the index of the start of the first substring in `string` that matches\
    \ `regexp`, or `null` if no match is found. If the global modifier `g` is present,\
    \ it is ignored.\n*   `string`.replace(`regexp`,` `replacement`)` — Searches `string`\
    \ for `regexp` and, if found, replaces it with `replacement`. If the global modifier\
    \ `g` is present, the method replaces all occurrences of `regexp` with `replacement`.\n\
    \    *   If `regexp` contains parenthesized groups, then `replacement` may use\
    \ `$1` to represent the first group matched, `$2` to represent the second group\
    \ matched, and so on.\n*   `string`.match(`regexp`)` — Searches `string` for `regexp`\
    \ and returns an array.\n    *   If the `g` flag is set, `match` returns an array\
    \ of matched substrings, or `null` if no matches are found.\n    *   If the `g`\
    \ flag is not set, `match` returns an array whose first element is the (first)\
    \ matched substring and whose remaining elements, if any, are the substrings matched\
    \ by each parenthesized group in `regex`. See the example at the beginning of\
    \ this section.\n*   `string`.matchAll(`pattern`)` — With the `g` flag, `matchAll`\
    \ returns an iterator for each of the substrings of `string` that match `pattern`.\
    \ This makes it convenient for use with a `for/of` loop.\n*   `string`.split(`regexp`)`\
    \ — Returns an array of substrings of `string`, where each occurrence of `regexp`\
    \ separates the substrings in `string`.\n\nThe following are methods of `regexp`\
    \ rather than of `string`:\n\n*   `regexp`.exec(`string`)` — Searches `string`\
    \ for `regexp` and remembers its position in `string`.\n    *   This method is\
    \ designed to be used in a loop. If the `g` flag is set, each call of `exec` will\
    \ return the next matching substring, or `null` when no more remain. After a `null`\
    \ is returned, the `regex` is reset and can be used again.\n    *   If the `g`\
    \ flag is not set, `exec` behaves like `match` without the `g` flag set.\n*  \
    \ `regexp`.test(`string`)` — Returns `true` if `regexp` matches somewhere in `string`,\
    \ and `null` otherwise. The `g` flag is handled the same way that it is for `exec`.\n\
    \n## 2.3 Identifiers\n\nIdentifiers consist of letters, digits, underscores, and/or\
    \ dollar signs; the first character may not be a digit.\n\nBy convention, variable\
    \ and function names begin with a lowercase letter, while class names begin with\
    \ a capital. The usual convention is to use “camel case” for multiword names,\
    \ such as `newUser`. Constants are often written in all capital letters.\n\nKeywords\
    \ (`if`, `true`, `class`, etc.) cannot be used as identifiers.\n\n## 2.4 let and\
    \ const\n\nJavaScript variables are untyped: Any variable can hold any type of\
    \ value.\n\nVariables are declared with the keyword `let`, along with an optional\
    \ initial value; for example, `let x` or `let x = 5`. More than one variable can\
    \ be declared in a `let` statement, for example:\n\n```\n let x = 5, y, z = 3;\
    \ // leaves y undefined\n```\n\nConstants are declared with the word `const` and\
    \ must be given a value at the time of declaration. Often the names of constants\
    \ are written with all capital letters. For example:\n\n```\n const zero = 0;\n\
    \ const RED = \"#FF0000\";\n```\n\nUsing a `const` `name` = `object`;` declaration\
    \ prevents any later assignment to `name`, so `name` will always refer to the\
    \ same object, but it does not prevent changes to that object.\n\n```\n const\
    \ card = {suit: \"clubs\"};\n```\n`card = {suit: \"spades\"};` // error\n`card.suit\
    \ = \"spades\";` // legal\n\n## 2.5 var\n\nThe modern way to declare a variable\
    \ is with `let`. Older way, using `var`, should be avoided.\n\n*   If a variable\
    \ is declared with `var` but not assigned a value, it has the special value `undefined`.\n\
    *   If a variable is declared with `var` more than once, it does not throw an\
    \ error:\n\n```\n var x = 1;\n var x = 2; // x is now 2\n```\n\n*   If a variable\
    \ is declared inside a function, it is local to that function:\n\n```\n function\
    \ foo() {\n  var x = 1;\n}\n```\n\n*   If a variable is declared outside a function,\
    \ it is global.\n\n```\n var x = 1;\n```\n\n## 2.6 Operators\n\nHere are the most\
    \ common operators on numbers:\n\n*   `+` add\n*   `-` subtract or unary minus\n\
    *   `*` multiply\n*   `/` divide, giving a floating-point result\n*   `%` remainder\
    \ (modulus)\n*   `**` exponentiation\n\nCommon operators on booleans:\n\n*   `&&`\
    \ and\n*   `||` or\n*   `!` not\n\nComparison operators, giving a boolean result:\n\
    \n*   `<` less than\n*   `<=` less than or equal to\n*   `==` equal to\n*   `===`\
    \ strictly equal to (equal and same type)\n*   `!=` not equal\n*   `!==` strictly\
    \ unequal (different types or values)\n*   `>=` greater than or equal to\n*  \
    \ `>` greater than\n\n> **Caution**: When comparing values of different types,\
    \ JavaScript attempts to convert them to numbers. Despite the fact that `undefined`\
    \ is converted to `NaN` and `null` is converted to `0`, nevertheless `undefined==null`\
    \ is true. Don’t compare values if one or both of them could be `null` or `undefined`;\
    \ check first using `===`, which is always safe.\n\n> \n\n> **Caution**: As in\
    \ almost all languages, it is unwise to compare two floating point numbers for\
    \ equality. For example, `11*(100/11)` is not equal to `100`, as these differ\
    \ in the 14th decimal place. One potential workaround is to use the method `.toFixed(`n``)`,\
    \ which will return a string with `n` digits after the decimal point, then do\
    \ string comparisons.\n\nString concatenation:\n\n*   `+` concatenate (join together)\
    \ two strings, or a string and any other value.\n"
  raw: "Regular expressions are largely standardized, so all but the most idiosyncratic\
    \ patterns can be used in JavaScript. In this section, we assume a knowledge of\
    \ regular expressions and only describe how to use them in JavaScript. For the\
    \ reader unfamiliar with regular expressions, there is a brief discussion in Appendix\
    \ D.\n\nA regular expression is written inside forward slashes, and may be followed\
    \ by flags. For example, `/[a-z]+/gi` is the regular expression `[a-z]+` with\
    \ the global (`g`) and case-insensitive (`i`) flags. (`[a-z]+` will match any\
    \ sequence of lowercase letters.)\n\nParentheses are used to group parts of the\
    \ regular expression. Groups are numbered left to right, starting with `1`; an\
    \ easy way to find the number of a group is to count only the left (opening) parentheses.\
    \ Group `0` is the entire matched part. For example, in the pattern\n\n```\n a\
    \ = \"Call 1-800-555-1212 today!\"\n b = /1-800-((\\d\\d\\d)-(\\d\\d\\d\\d))/\n\
    \ // 0 12 3\n c = a.match(b)\n```\n\nThe results will be\n\n```\n c[0] = \"1-800-555-1212\"\
    \n c[1] = \"555-1212\"\n c[2] = \"555\"\n c[3] = \"1212\"\n```\n\nThe following\
    \ methods can be used to apply regular expressions:\n\n*   ***string***`.search(`***regexp***`)`\
    \ — Returns the index of the start of the first substring in ***string*** that\
    \ matches ***regexp***, or `null` if no match is found. If the global modifier\
    \ `g` is present, it is ignored.\n\n*   ***string***`.replace(`***regexp***`,`\
    \ ***replacement***`)` — Searches ***string*** for ***regexp*** and, if found,\
    \ replaces it with ***replacement***. If the global modifier `g` is present, the\
    \ method replaces all occurrences of ***regexp*** with ***replacement***.\n\n\
    \    *   If ***regexp*** contains parenthesized groups, then ***replacement***\
    \ may use `$1` to represent the first group matched, `$2` to represent the second\
    \ group matched, and so on.\n\n*   ***string***`.match(`***regexp***`)` — `S`earches\
    \ ***string*** for ***regexp*** and returns an array.\n\n    *   If the `g` flag\
    \ is set, `match` returns an array of matched substrings, or `null` if no matches\
    \ are found.\n\n    *   If the `g` flag is not set, `match` returns an array whose\
    \ first element is the (first) matched substring and whose remaining elements,\
    \ if any, are the substrings matched by each parenthesized group in ***regex***.\
    \ See the example at the beginning of this section.\n\n*   ***string***`.matchAll(`***pattern***`)\
    \ —` With the `g` flag, `matchAll` returns an iterator for each of the substrings\
    \ of ***string*** that match ***pattern***. This makes it convenient for use with\
    \ a `for/of` loop.\n\n*   ***string***`.split(`***regexp***`) —` Returns an array\
    \ of substrings of ***string***, where each occurrence of ***regexp*** separates\
    \ the substrings in ***string***.\n\nThe following are methods of ***regexp***\
    \ rather than of ***string***.\n\n*   ***regexp***`.exec(`***string***`) — S`earches\
    \ ***string*** for ***regexp*** and remembers its position in ***string***.\n\n\
    \    *   This method is designed to be used in a loop. If the `g` flag is set,\
    \ each call of `exec` will return the next matching substring, or `null` when\
    \ no more remain. After a `null` is returned, the ***regex*** is reset and can\
    \ be used again.\n\n    *   If the `g` flag is not set, `exec` behaves like `match`\
    \ without the `g` flag set.\n\n*   ***regexp***`.test(`***string***`) —` Returns\
    \ `true` if ***regexp*** matches somewhere in ***string***, and `null` otherwise.\
    \ The `g` flag is handled the same way that it is for `exec`.\n\n## 2.3 Identifiers\n\
    \n***Identifiers*** consist of letters, digits, underscores, and/or dollar signs;\
    \ the first character may not be a digit.\n\nBy convention, variable and function\
    \ names begin with a lowercase letter, while class names begin with a capital.\
    \ The usual convention is to use “camel case” for multiword names, such as `newUser`.\
    \ Constants are often written in all capital letters.\n\nKeywords (`if`, `true`,\
    \ `class`, etc.) cannot be used as identifiers.\n\n## 2.4 let and const\n\nJavaScript\
    \ variables are ***untyped***: Any variable can hold any type of value.\n\nVariables\
    \ are declared with the keyword `let`, along with an optional initial value; for\
    \ example, `let x` or `let x = 5`. More than one variable can be declared in a\
    \ `let` statement, for example,\n\n```\n let x = 5, y, z = 3; // leaves y undefined\n\
    ```\n\nConstants are declared with the word `const` and must be given a value\
    \ at the time of declaration. Often the names of constants are written with all\
    \ capital letters. For example,\n\n```\n const zero = 0;\n const RED = \"#FF0000\"\
    ;\n```\n\nUsing a `const` ***name*** `=` ***object***`;` declaration prevents\
    \ any later assignment to ***name***, so ***name*** will always refer to the same\
    \ object, but it does not prevent changes to that object.\n\n```\n const card\
    \ = {suit: \"clubs\", pips: 2};\n card = {suit: \"clubs\", pips: 10}; // illegal\n\
    \ card.pips = 10; // legal\n```\n\nVariables declared with `let` or `const` at\
    \ the top level of the program, not within any block, are global to the program;\
    \ they can be accessed anywhere.\n\nVariables and constants declared within a\
    \ block have ***block scope***. A ***block*** is a group of statements and/or\
    \ expressions enclosed in braces, `{…}`. The ***scope*** of an identifier is that\
    \ portion of the program in which the variable is visible and can be used.\n\n\
    In other words, variables and constants declared in a block are visible and can\
    \ be used only in the innermost block in which they are declared. Outside that\
    \ block, these variables and constants do not exist; their names can be recycled\
    \ for other uses.\n\nIt is an error to attempt to get the value of a variable\
    \ that has been declared but not yet given a value.\n\n## 2.5 var\n\nThe modern\
    \ way to declare a variable is with `let`. The older way, using `var` in place\
    \ of `let`, or simply assigning a value to a variable, should be avoided. Variables\
    \ declared the old way follow unusual, and generally undesirable, scope rules.\n\
    \n*   It is not an error to use `var` to declare the same variable more than once\
    \ in the same scope.\n\n*   The parameters to a function, and any variables declared\
    \ with `var` inside that function, are local to the function. They may be used\
    \ anywhere inside that function, even before the declaration. This is different\
    \ from block scope.\n\n*   If a value is assigned to a new variable without declaring\
    \ the variable with `let`, `var` or `const`, that variable has ***global scope***:\
    \ It can be used anywhere in the program.\n\n    *   This can only be done in\
    \ ***non-strict mode*** (sometimes called “***sloppy mode***”).\n\n*   If a variable\
    \ has been declared with `var` but not assigned a value, it has the special value\
    \ `undefined`.\n\n## 2.6 Operators\n\nHere are the most common operators on numbers:\n\
    \n`+`\n\nadd\n\n`-`\n\nsubtract or unary minus\n\n`*`\n\nmultiply\n\n`/`\n\ndivide,\
    \ giving a floating-point result\n\n`%`\n\nremainder (modulus)\n\n`**`\n\nexponentiation\n\
    \nCommon operators on booleans:\n\n`&&`\n\nand\n\n`||`\n\nor\n\n`!`\n\nnot\n\n\
    Comparison operators, giving a boolean result:\n\n`<`\n\nless than\n\n`<=`\n\n\
    less than or equal to\n\n`==`\n\nequal to\n\n`===`\n\nstrictly equal to (equal\
    \ and same type)\n\n`!=`\n\nnot equal to\n\n`!==`\n\nstrictly unequal (different\
    \ types or values)\n\n`>=`\n\ngreater than or equal to\n\n`>`\n\ngreater than\n\
    \n> **Caution**: When comparing values of different types, JavaScript attempts\
    \ to convert them to numbers. Despite the fact that `undefined` is converted to\
    \ `NaN` and `null` is converted to `0`, nevertheless `undefined==null` is true.\
    \ Don’t compare values if one or both of them could be `null` or `undefined`;\
    \ check first using `===`, which is always safe.\n\n> \n\n> **Caution**: As in\
    \ almost all languages, it is unwise to compare two floating point numbers for\
    \ equality. For example, `11*(100/11)` is not equal to `100`, as these differ\
    \ in the 14^(th) decimal place. One potential workaround is to use the method\
    \ `.toFixed(`***n***`)`, which will return a *string* with ***n*** digits after\
    \ the decimal point, then do string comparisons.\n\nString ***concatenation***:\n\
    \n*   + concatenate (join together) two strings, or a string and any other value."
