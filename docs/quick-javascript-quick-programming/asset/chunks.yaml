  trans: "\n\n*   `array`.pop()`—移除并返回 `array` 中的最后一个元素，并更新其 `length`。\n*   `array`.unshift(elems)`—将\
    \ `elems` 添加到 `array` 头部后，返回 `array` 的新长度。\n*   `array`.shift()`—移除并返回 `array`\
    \ 中的第一个元素，并更新数组的 `length`。\n\n`push` 和 `pop` 操作可以高效地实现栈（stacks）。\n\n`push` 和 `shift`、或\
    \ `pop` 和 `unshift` 配对可以实现队列（queues）；这四个方法结合使用可以实现双端队列（deques）。\n\n由于 `unshift`\
    \ 和 `shift` 方法实际上会移动数组中的元素，它们的效率比 `push` 和 `pop` 低得多。\n\n附录 A 中描述了几个额外的数组方法。\n\
    \n### 3.4.6 稀疏数组\n\n在大多数语言中，数组是**密集的**：大小为 `n` 的数组占用 `n` 个连续的内存位置。JavaScript 中的数组可以是密集的，也可以是稀疏的。\n\
    \n`稀疏数组`（sparse array）是指只有包含实际值的位置才占用计算机内存；所有其他位置似乎都包含特殊值 `undefined`。稀疏数组占的内存较少，但处理需要更多时间。\n\
    \n以下是创建稀疏数组的几种方法：\n\n*   使用 `Array(length)` 形式创建数组。\n*   使用 `delete array[i]`\
    \ 删除 `array` 中的某些现有元素。\n*   给 `array[i]` 赋值，其中 `i > array.length`。\n    *   给\
    \ `array[array.length]` 赋值不会强制使数组变为稀疏。\n*   将数组的 `length` 属性设置为较大的值。\n    *  \
    \ 如果你将 `length` 设置为较小的值，则该索引及之后的数组元素将被丢弃。\n*   使用连续的逗号编写字面量数组，例如 `[\"cat\",, \"\
    dog\",,,]`。\n    *   该数组的长度为五（而不是六）；最后一个一个逗号被视为尾随逗号。\n\n为了更好地理解稀疏数组，记住 `undefined`\
    \ 是 JavaScript 中的一个实际值，因此会占用内存中的实际空间。但如果我们请求稀疏数组中某个位置的值并得到 `undefined`，这可能意味着两种情况之一：(1)\
    \ 该位置没有内容，或 (2) 该位置确实包含值 `undefined`。\n\n这具有一些实际影响。`for/in` 循环将遍历数组的所有索引，无论该位置是否有内容。`for/of`\
    \ 循环则只会遍历实际值（其中某些值可能是 `undefined`）。\n\n方法 `array`.hasOwnProperty(i)` 会在 `array[i]`\
    \ 包含实际值时返回 `true`，否则返回 `false`。\n\n### 3.4.7 集合 (Sets)\n\nJavaScript 并没有直接提供对集合的常用操作（并集、交集、差集、对称差集）。使用“展开运算符”（`...`）将数组转换为值序列，可以通过以下方式实现这些操作。\n\
    \n```javascript\nfunction union(a, b) {\n  return new Set([...a, ...b]);\n}\n\n\
    function intersection(a, b) {\n  return new Set([...a].filter(x => b.has(x)));\n\
    }\n\nfunction difference(a, b) {\n  return new Set([...a].filter(x => !b.has(x)));\n\
    }\n\nfunction symmetricDifference(a, b) {\n  return difference(union(a, b), intersection(a,\
    \ b));\n}\n```\n\n### 3.4.8 Map\n\n在许多语言中，使用可变对象作为键是不可取的。这在 JavaScript 中并不是问题，因为\
    \ JavaScript 比较键的是标识性（identity）而不是相等性（equality）。无论对作为键的对象进行什么更改，它都会保留其标识性；无法使用另一个“相等”的对象来恢复关联的值。\n\
    \n> **注意**：无论对作为键的对象进行什么更改，它都会保留其标识性；无法使用另一个“相等”的对象来恢复关联的值。\n\n`Map` 最近添加了三个新方法：\n\
    \n*   `map`.keys()`——返回键的迭代器。\n*   `map`.values()`——返回值的迭代器。\n*   `map`.entries()`——返回键值对的迭代器。\n\
    \n### 3.4.9 弱映射 (WeakMaps)\n\n`WeakMap` 是 `Map` 的变体，它的键必须是弱引用的。如果键对象没有其他强引用，它就会被垃圾回收。\n\
    \n`WeakMap` 不可迭代，因此无法使用 `for...of` 循环。\n\n`WeakMap` 只有三个方法：\n\n*   `set(key, value)`——设置键值对，并返回\
    \ WeakMap 对象本身。\n*   `get(key)`——获取与键关联的值；如果键不存在则返回 `undefined`。\n*   `has(key)`——检查是否存在指定的键。\n\
    *   `delete(key)`——删除指定的键；如果删除成功，则返回 `true`。\n\n### 3.4.10 Promise\n\n如果你有一个不需要立即结果的长运行任务（例如文件传输），你可能希望启动它，同时你的代码继续执行。`promise`\
    \ 是异步运行并“承诺”在某个时间完成任务的代码。\n\n以下赋值语句创建一个 `Promise` 对象，将其保存在 `promise` 中，并开始执行函数：\n\
    \n```javascript\nlet promise = new Promise(function);\n```\n\n> **注意**：记住*函数*和*函数调用*之间的区别。如果我们定义\
    \ `function f(){}`，那么 `f` 是函数本身，而 `f()` 是该函数的调用。`Promise` 构造函数的参数必须是一个函数。\n\n\
    Promise 有三种终止方式：通过报告“成功”、报告“失败”或抛出异常。为了处理这种情况，Promise 使用的函数应该有两个参数，每个参数都是一个函数（有时称为回调）。Promise\
    \ 代码应该调用第一个函数来报告成功，或者调用第二个来报告失败。\n\n通常方便使用**箭头函数**（后文介绍）来编写 Promise 的回调函数。如下：\n\
    \n```javascript\nnew Promise((onSuccess, onFailure) => {code});\n```\n\n在这种语法中，`code`\
    \ 是要执行的（可能是长运行）），`onSuccess` 是 `code` 成功时执行的函数，`onFailure` 是代码失败时执行的函数。特别注意传递给参数\
    \ `onSuccess` 和 `onFailure` 的参数必须是函数；每个函数可以接受一个参数，也可以不接受参数。\n\nPromise 的 `then`\
    \ 方法提供了 Promise 使用的函数。\n\n*   `promise`.then(successFunction, failureFunction)`——告诉\
    \ Promise 在成功或失败时调用哪个函数。\n    *   调用任何 `successFunction` 或 `failureFunction` 都会终止\
    \ promise。\n    *   如果发生未处理的异常，将调用 `failureFunction`。\n\n"
- fmt: "\nThe following example uses three functions: `yes` and `no` just print their\
    \ argument, while `doSomething` chooses a random number and “succeeds” if the\
    \ number is greater than `0.5`, or throws an exception if the number is smaller.\
    \ (For simplicity, the example uses `Math.random` instead of some task that might\
    \ actually take a long time.)\n\n```javascript\n function yes(r) {\n    console.log(\"\
    yes, \" + r);\n   }\n\n   function no(e) {\n    console.log(\"no, \" + e);\n \
    \  }\n\n   function doSomething(resolve, reject) {\n    let r = Math.random();\n\
    \    if (r > 0.50) resolve(r); // succeed\n    throw r + \" is too low\"; // fail\n\
    \   }\n```\n\nHere we make use of those functions:\n\n```javascript\n let promise\
    \ = new Promise(doSomething);\n // other work\n promise.then(yes, no);\n console.log(\"\
    END\");\n```\n\nExample results:\n\n`````` \"END\"\n \"no, 0.18252962330109224\
    \ is too low\"\n\n \"END\"\n \"yes, 0.938714265780423\"\n```\n\nThe result returned\
    \ by `then` is a `Promise`. This allows promises to be “chained,” so that the\
    \ value returned by `then` can be fed into another `then`. The following example\
    \ will create a random number, then multiply it by 100, then add 1000, then display\
    \ the result.\n\n```javascript\n let promise2 = new Promise(\n    someFun => {\
    \ return someFun(Math.random());\n    }).then(function(result) { return 100 *\
    \ result;\n    }).then(function(result) { return 1000 + result;\n    }).then(function(result)\
    \ { console.log(result);\n    });\n```\n\nThe syntax does not allow extra arguments\
    \ to be passed to a `Promise`; any additional information it needs must be taken\
    \ from the environment.\n\n### 3.4.11 Conversions\n\nJavaScript performs most\
    \ conversions (coercions) automatically. You can also do explicit conversions\
    \ with the functions `Number(x)`, `String(x)`, `Boolean(x)`, `BigInt(x)`, `parseInt(x,\
    \ base)`, and `parseFloat(x)`.\n\n> **Caution**: If you use the word `new` with\
    \ one of the functions `Number`, `String`, or `Boolean`, the result will be a\
    \ “wrapper object,” that is, an object containing the value, *not* a value of\
    \ the named type. This will mostly continue to work (except for a Boolean object,\
    \ which is always “truthy”).\n\nAll objects have a `toString` method, which can\
    \ be called as `object.toString()`. It is usually a good idea to override this\
    \ method for your own objects.\n\nThe following functions convert between strings\
    \ and numbers:\n\n* `Number(string)`—Converts the entire `string` into a number,\
    \ if possible, otherwise it returns `NaN` (**N**ot **a N**umber).\n\n* `parseInt(string)`—Converts\
    \ the initial characters of `string` into a number, if possible, otherwise it\
    \ returns `NaN`. `ParseInt` ignores any following characters that do not belong\
    \ in an integer, such as a decimal point.\n\n* `parseFloat(string)`—Converts the\
    \ initial characters of `string` into a number, if possible, otherwise it returns\
    \ `NaN`. `parseFloat` ignores any following characters that do not belong in a\
    \ number.\n\n* `variable.toFixed(d)`—Converts the number in `variable` to a string\
    \ with `d` digits after the decimal point.\n\n* `variable.toString(base)`—Converts\
    \ the number in `variable` to a string representation of that number in the given\
    \ `base` (2 to 36).\n\nFor both `toFixed` and `toString`, if a literal integer\
    \ is used in place of the `variable`, two dots are required—one as part of the\
    \ number, the second to indicate a method call (for example, `123..toString(8)`\
    \ or `123.0.toString(8)`).\n\nConversions can be made between plain objects, maps,\
    \ and arrays of two-element arrays.\n\n* `array = Array.from(map);`\n\n* `array\
    \ = Object.entries(object);`\n\n* `map = new Map(array);`\n\n* `map = new Map(Object.entries(object));`\n\
    \n* `object = Object.fromEntries(map);`\n\n* `object = Object.fromEntries(array);`\n\
    \n### 3.5 Math\n\nThe `Math` class supplies the constants `Math.E` (e), `Math.PI`\
    \ (π), `Math.LN2` (log[e]2), and `Math.LN10` (log[e]10), among others.\n\nSome\
    \ of the methods supplied by the `Math` class are:\n\n* `Math.abs(x)`—Returns\
    \ the absolute value of `x`.\n\n* `Math.sign(x)`—Returns the one of `-1`, `0`,\
    \ or `1` that has the same sign as `x`.\n\n* `Math.trunc(x)`—Returns the integer\
    \ portion of `x`.\n\n* `Math.round(x)`—Returns the integer nearest to `x`.\n\n\
    * `Math.floor(x)`—Returns the largest integer less than or equal to `x`.\n\n*\
    \ `Math.ceil(x)`—Returns the smallest integer greater than or equal to `x`.\n\n\
    * `Math.max(x1, x2, ..., xN)`—Returns the largest of its arguments.\n\n* `Math.min(x1,\
    \ x2, ..., xN)`—Returns the smallest of its arguments.\n\n* `Math.sqrt(x)`—Returns\
    \ the positive square root of `x`.\n\n* `Math.cbrt(x)`—Returns the cube root of\
    \ `x`.\n\n* `Math.random()`—Returns a pseudo-random number `r` in the range `0\
    \ <= r < 1`.\n\nThe `Math` class also supplies the standard logarithmic and trignometric\
    \ functions `exp`, `log`, `log10`, `log2`, `sin`, `cos`, `tan`, `asin`, `acos`,\
    \ `atan`, as well as `sinh`, `cosh`, `tanh`, `asinh`, `acosh`, and `atanh`.\n\n\
    ### 3.6 Reserved Words\n\nMost languages have a set of reserved words, or keywords,\
    \ that have special meaning and cannot be used for identifiers. JavaScript is\
    \ unusual in that the set of reserved words keeps changing.\n\n| `arguments` |\
    \ `else` | `in` | `super` |\n| `await` | `enum` | `instanceof` | `switch` |\n\
    | `case` | `export` | `let` | `this` |\n| `catch` | `finally` | `package` | `throw`\
    \ |\n| `const` | `extends` | `null` | `try` |\n| `class` | `false` | `new` | `typeof`\
    \ |\n| `continue` | `for` | `private` | `var` |\n| `debugger` | `function` | `protected`\
    \ | `void` |\n| `default` | `if` | `public` | `while` |\n| `delete` | `implements`\
    \ | `return` | `with` |\n| `do` | `import` | `static` | `yield` |\n\nYou should\
    \ avoid using the following as identifiers:\n\n*   Words that are no longer reserved:\
    \ `abstract`, `boolean`, `byte`, `char`, `double`, `final`, `float`, `goto`, `int`,\
    \ `long`, `native`, `short`, `synchronized`, `throws`, `transient`, and `volatile`.\n\
    \n*   The names of JavaScript objects, properties, and methods, such as `Array`.\n\
    \n*   The names of HTML objects and properties, such as `button`.\n\n*   The names\
    \ of HTML event handlers, such as `onkeypress`.\n\n### 3.7 Good Operators\n\n\
    An `expression` is any JavaScript code that results in a value. Expressions may\
    \ be as simple as a single constant or single variable.\n\nOperators with higher\
    \ `precedence` (indicated by larger numbers) are performed before those with lower\
    \ precedence. For example, in the expression `2 * 3 + 4 * 5`, the multiplications\
    \ are done before the addition because multiplication has higher precedence than\
    \ addition. A number of things not thought of as operators, for example parentheses\
    \ and array indexing, also have precedence.\n\nWhen operators have equal precedence,\
    \ their `associativity` (“left to right” or “right to left”) determines which\
    \ operations are done first. For example, subtraction is *left associative*, so\
    \ `10 - 5 - 3` means `(10 - 5) - 3` rather than `10 - (5 - 3)`. Almost all binary\
    \ operators (except exponentiation) are left associative; the assignment operators\
    \ are right associative, so `a = b = c + 5` means `a = (b = c + 5)` rather than\
    \ `(a = b) = c + 5`.\n"
