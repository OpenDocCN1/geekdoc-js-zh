    \ 3.11.10.3 Overriding Methods and Fields\n\nFields and methods defined in one\
    \ class may be redefined, or ***overridden***, in a subclass. For example, the\
    \ `Object` class defines a `toString` method. This method isn’t very useful because\
    \ it always returns `\"[object Object]\"`, but it does exist.\n\nYou can override\
    \ a method simply by defining a new method with the same name. For example, we\
    \ might add the following method to the `Person` class:\n\n```\n toString() {\n\
    \    return \"My name is \" + <uri xlink_href=\"http://this.name\">this.name</uri>\"\
    ;\n   }\n```\n\n> **Note**: In most browsers, the `console.log(`***obj***`)` method\
    \ *does not use* `toString`; instead, it prints the *structure* of the object.\
    \ If this isn’t what you want, you can call `toString` explicitly, or simply concatenate\
    \ an empty string to the argument, `console.log(`***obj*** `+ \"\")`.\n\nFields\
    \ can also be overridden. However, the word `this` always refers to “the object\
    \ before the dot.” For example:\n\n```\n class Over {\n    value = 100;\n    show()\
    \ {\n     return \"value is \" + this.value;\n    }\n   }\n\n   class Under extends\
    \ Over {\n    value = 50;\n   }\n\n   let under = new Under();\n   console.log(under.show());\n\
    ```\n\nThis prints `\"value is 50\"`. Although `show()` is defined in `Over`,\
    \ the variable `under` is of type `Under`, so `this.value` is `50`, not `100`.\n\
    \nIf `value` were *not* defined in `Under`, then `under` would inherit it from\
    \ `Over`, and `this.value` would be `100`.\n\n#### 3.11.10.4 Class Prototypes\n\
    \nAs noted earlier, you can construct an object that uses an existing object as\
    \ its *prototype*.\n\n```\nlet newObj = Object.create(oldObj);\n```\n\nThe ***newObj***\
    \ will not initially have any properties of its own, but properties can be added\
    \ later. Any attempt to look up a property of ***newObj*** will look first in\
    \ ***newObj*** itself, but if not found there, JavaScript will look in its prototype,\
    \ ***oldObj***.\n\nThe method `Object.getPrototypeOf(`***newObj***`)` will return\
    \ ***oldObj***, but there is also an older way to access the prototype: ***newObj***`.\
    \ __proto__` . The non-enumerable `__proto__` property should not be used in new\
    \ code.\n\nSomething similar happens with classes.\n\n```\n class Person {…}\n\
    \ class Customer extends Person {…}\n let sally = new Customer(…);\n```\n\nThe\
    \ object `sally` has access to the methods declared in `Customer` plus the methods\
    \ declared in `Person` (unless they are overridden by methods with the same name\
    \ in `Customer`).\n\nWhen you declare a function or create a class with a constructor,\
    \ that function or class gets a property confusingly named `prototype`. The value\
    \ of this property is an object containing function names and definitions.\n\n\
    > **Note**: Do not confuse the `prototype` property of a class, ***class***`.prototype`,\
    \ with an object’s prototype, ***obj***`.__proto__`.\n\nYou can attach a method\
    \ to all instances of a class by assigning to its `prototype`:\n\n```\n Person.prototype.initial\
    \ = function() {\n    return <uri xlink_href=\"http://this.name\">this.name</uri>[0];\n\
    \   }\n```\n\nThe method `initial` will return the first character of a person’s\
    \ name (assuming that `Person` has a `name` property).\n\n## 3.12 Transpilers\
    \ and Polyfills\n\nJavaScript evolves and (hopefully) gets better. Unfortunately,\
    \ older browsers may not support some of the newest features. In order for JavaScript\
    \ code to work “everywhere,” there are two different approaches that may be taken:\n\
    \n1.  Use only well-established features that work everywhere.\n\n2.  Use transpilers\
    \ and/or polyfills.\n\nA ***transpiler*** “compiles” newer syntactic features,\
    \ such as the `??` operator, into older but equivalent syntax. **Babel** is a\
    \ well-known transpiler.\n\nA ***polyfill*** is a function or a library of functions\
    \ that may or may not be currently included. A missing function can be added directly\
    \ to the code. A library of polyfills may be loaded from a polyfill server, although\
    \ this increases load time. There is more controversy about which polyfill library\
    \ to use, if any, but [**polyfill.io**](https://polyfill.io) is reasonably popular.\n\
    \n## 3.13 JSON\n\n***JSON*** (***JavaScript Object Notation***) is a way of representing\
    \ data as text. This is useful for storing the data on a file, or transmitting\
    \ it to or from a server. JSON is human-readable and editable; it is quite similar\
    \ to data in JavaScript.\n\nThere are two methods:\n\n*   `JSON.stringify(`***value***`)`—Converts\
    \ a JavaScript ***value*** to a JSON string.\n\n*   `JSON.parse(`***string***`)`—Converts\
    \ a JSON ***string*** to a JavaScript object.\n\nBoth JSON methods can be given\
    \ additional parameters, not described here, to modify values as they are processed.\n\
    \nLimitations:\n\n*   Functions, symbols, `undefined`, `Infinity`, and `NaN` cannot\
    \ be represented in JSON. They are replaced by `null`.\n\n*   Dates are converted\
    \ to strings, and not automatically converted back into Dates.\n\n*   Non-enumerable\
    \ properties, and properties whose key is a symbol, are ignored.\n\nAny object\
    \ can be given a `toJSON()` method if the default representation is not satisfactory.\n\
    \n# Chapter 4 Client-Side JavaScript\n\nDOI: [10.1201/9781003359609-4](https://dx.doi.org/10.1201/9781003359609-4)\n\
    \nAfter a few introductory sections, the remainder of the book is divided into\
    \ two parts: **Graphical User Interfaces**, which is all that many JavaScript\
    \ programmers need, and **Using the DOM**, which describes the powerful understructure\
    \ of web pages.\n\n## 4.1 Essential HTML\n\nAn ***HTML page*** is a text file,\
    \ usually in Unicode, containing tags.\n\nMost ***tags*** are containers. They\
    \ consist of a ***start tag***, some ***contents***, and an ***end tag***. The\
    \ contents are the `innerHTML` of the tag.The syntax is:\n\n```\n<tagName> contents\
    \ </tagName>\n```\n\nContainer tags can contain text and other tags, to any level.\n\
    \nA few kinds of tags are *empty*, that is, not containers. For example, `<br>`\
    \ is a line break, and `<hr>` is a horizontal rule. No end tag is needed. Such\
    \ tags are sometimes written as `<`***tagName***`/>`.\n\nAn HTML page consists\
    \ of at least four tags:\n\n*   A ***document tag***, which identifies the file\
    \ as HTML. It is not a container.\n\n*   An ***html tag***, containing the head\
    \ and body tags.\n\n*   A ***head tag***, containing meta-information about the\
    \ page, most of which is not displayed. This usually includes a `<title>` tag\
    \ to name the page.\n\n*   A ***body tag***, containing information to be displayed\
    \ to the user, and numerous other tags to specify just how it should be displayed.\n\
    \nHere is a minimal HTML page.\n\n```\n <!DOCTYPE html>\n   <html>\n    <head>\n\
    \     <title>Example HTML Page</title>\n    </head>\n    <body>\n     <p id=\"\
    p1\">The user sees this part.</p>\n    </body>\n   </html>\n```\n\nStart tags\
    \ can contain ***attributes***, which have the form ***name***`=\"`***value***`\"\
    `. One such attribute is `id`, to assign a unique identifier to an individual\
    \ tag.\n\nJavaScript is case-sensitive, but tag names and attributes in HTML are\
    \ not case sensitive.\n\nOriginally, all styling was done in the HTML itself.\
    \ Today, most styles are applied by one or more associated ***stylesheets***,\
    \ written in CSS, Cascading Style Sheets.\n\n## 4.2 Adding JavaScript to HTML\n\
    \nJavaScript can be added to an HTML page by:\n\n*   Putting the JavaScript within\
    \ `<script>`…`</script>` tags, in either the head or the body.\n\n*   Putting\
    \ the JavaScript in a separate file that has a `.js` extension, and loading it\
    \ with `<script src=\"`***URL***`.js\"></script>` in the head element. In this\
    \ case, any code within the `<script>` tags will be ignored.\n\n*   Writing the\
    \ JavaScript as the value of an HTML “event handler” attribute."
