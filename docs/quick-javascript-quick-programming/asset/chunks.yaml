  trans: "\n\n要运行 JavaScript，你可以使用任何文本编辑器将其包含在 HTML 页面的 `<script>` 标签中，并将页面加载到任何浏览器中。\n\
    \n这不是编写程序的最佳方式。浏览器的设计初衷是`忽略`错误；毕竟，用户不想看到它们。而你，却想要看到并修正它们。为了这一点，你需要打开浏览器的 `console`（控制台）。控制台会显示错误信息（以及其他内容）。\n\
    \n打开控制台：\n\n*   在大多数浏览器中：按下 `F12`。\n*   在 Safari (Macintosh) 中：前往`偏好设置：高级`，并勾选`在菜单栏中显示开发菜单`。完成后，使用\
    \ `cmd-opt-C` 显示控制台。\n\n浏览器控制台具有许多辅助编程和调试的功能。这些功能各不相同且需要一些时间学习；本书将不会涵盖这些内容。\n\n\
    ## 1.4 运行 JavaScript\n\n有几个 IDE（集成开发环境）可以用于 JavaScript。[Visual Studio Code](https://code.visualstudio.com)\
    \ 可能是最流行的；它是跨平台的且免费的。（不要将其与 Visual Studio 混淆，后者既不是跨平台的也不是免费的。）[NetBeans](https://netbeans.apache.org)\
    \ 和 [Eclipse](https://eclipseide.org)（带有合适的插件）是其他流行的 IDE。\n\n某些编辑器可以配置为命令行运行 JavaScript。这是一种运行单文件\
    \ JavaScript 程序的方便方法。[Sublime Text](https://www.sublimetext.com)（跨平台）和 [Notepad++](https://notepad-plus-plus.org)（Windows\
    \ 和 Linux）就是示例。\n\n另一种选择是使用在线 JavaScript 编辑器。搜索“JavaScript online”可以找到几个工具；[jsfiddle.net](http://jsfiddle.net)\
    \ 是我经常使用的一个。它们在功能上有所不同，但大多数都会显示输出和控制台。由于它们在浏览器中运行，在那里编写的 JavaScript 代码执行文件 I/O\
    \ 的有限。\n\n最后，所有主流浏览器都有“开发者模式”，可以直接在浏览器中编写和测试代码。\n\n## 1.5 获取输入\n\n有两个函数会请求用户输入：\n\
    \n*   `result = prompt(`prompt`, `default`)`\n    *   这会在模态对话框中显示 `prompt`，并为用户提供一个输入文本的地方。第二个参数是可选的；如果提供了，它将显示在字段字段。\n\
    \    *   对话框有两个按钮：`OK`，返回用户的输入内容作为字符串；以及 `Cancel`，返回 `null`。\n*   `result = confirm(`question`)`\n\
    \    *   这会在模态对话框中显示 `question`，并有两个按钮：`OK` 返回 `true`，`Cancel` 返回 `false`。\n\n\
    ## 1.6 生成输出\n\n有几个函数可以显示你代码的结果。在浏览器中使用时，请记住将你的函数调用放在 `<script>`…`</script>` 标签内。\n\
    \n*   `alert(`arg`)`\n    *   这是查看结果最简单的方法。调用带有任意类型单个参数的 `alert` 将弹出一个包含给定值的对话框。这种方法有两个缺点：对话框是模态的，这意味着在继续计算之前必须先关掉它；而且你一次只能看到一条消息。\n\
    *   `console.log(`args`)`\n    *   如果你打开了控制台，此方法将在其上显示某些内容，但具体显示什么高度取决于实现。它可能会显示由空格或换行符分隔的\
    \ `args`，也可能只显示第一个参数。尝试一下，看看在你偏好的任何控制台中它的效果如何。\n    *   由于 `console.log` 主要用于调试，大多数实现会显示\
    \ `args` 的实际结构，而不使用 `toString` 方法。\n    *   `console` 还有许多其他方法，如 `clear()` 和 `trace()`。实现方式各异。\n\
    *   `document.write(`args`)`\n    *   这将其参数写入 HTML 的 body 中。如果在页面加载时执行，它将把参数直接写入该位置。但如果在\
    \ body 加载后调用 `write`（例如从从函数中调用），该调用将替换整个 HTML body；这可能不是你想要的结果。\n*   `document.writeln(`args`)`\n\
    \    *   它的作用与 `write` 相同，不同在于该方法在最后一个参数之后写入换行符。由于 HTML 会忽略换行符，这几乎没有用处。要获得不被忽略的换行，请编写字符串\
    \ `\"<br>\"`。\n\n`alert` 和 `write` 方法的优点是它们不需要你打开控制台即可查看结果。\n\n# 第 2 章 JavaScript\
    \ 基础知识\n\nDOI: [10.1201/9781003359609-2](https://dx.doi.org/10.1201/9781003359609-2)\n\
    \n本章和第 3 章 将 JavaScript 简单描述为语言，不涉及 Web 编程。它分为两个大部分：\n\n**基础知识**——这一部分旨在让你尽快开始\
    \ JavaScript 编程。最好的方法就是尝试。\n\n**详细介绍**——这部分涵盖相同的内容，并填补空白。\n\n## 2.1 注释\n\n`//`\
    \ 引入一个延伸到行行的注释。\n\n多行注释以 `/*` 开始，以 `*/` 结束。在引用的字符串或正则表达式内部，`//` 和 `/*` 没有意义。\n\
    \n## 2.2 数据类型\n\n### 2.2.1 原始类型\n\n有八种数据类型：\n\n*   `number` 可以带有或不带有小数点，但所有数字都存储为双精度浮点数。\n\
    *   `bigint` 是具有任意位数的整数。\n*   两个 `boolean` 值是 `true` 和 `false`。\n*   `string`\
    \ 可以包含在单引号、双引号或反引号（``）中。没有“字符”类型。\n*   `symbol` 是一个保证唯一的数值；没有其他值等于它。symbol 是通过调用\
    \ `Symbol()` 或 `Symbol(`name`)` 创建的，其中 `name` 是一个（不一定唯一）值，可能对调试有帮助。\n*   `undefined`\
    \ 类型有一个值，`undefined`。它是已声明但未赋赋值的变量的值。\n*   `null` 类型有一个值，`null`，意味着该值不存在。\n* \
    \  `object` 是任何更复杂的数据类型。函数、数组、集合、映射、正则表达式、错误和日期都是特殊类型的对象。\n\n值的类型可以通过 `typeof`\
    \ 确定，它可以既用作运算符 `typeof x`，也可以用作函数 `typeof(x)`。它将以字符串的形式返回上述任一类型名称（例如，`\"number\"\
    `）。\n\n上述内容有两个特外情况：\n\n*   `typeof(null)` 的值为 `\"object\"`。这在通常被认为是语言设计中的一个错误。\n\
    *   对于函数以外的任何对象类型，`typeof` 将返回 `\"object\"`。应用于函数时，`typeof` 将返回 `\"function\"\
    `。\n\n### 2.2.2 用户定义对象\n\n`object` 是一组命名值的集合，称为其 `properties`（属性）。你可以通过在大括号内放置\
    \ `property`:`value 对来定义对象，稍后通过 `object.property` 语法引用这些值。例如，\n\n```javascript\n\
    let friend = { givenName: \"Anna\",\n              surname: \"Lang\" };\nalert(\"\
    Hello, \" + friend.givenName);\n```\n\n如果属性名称存储在变量中或可以计算，可以通过 `object[expression]`\
    \ 语法进行访问，例如 `friend[\"given\" + \"Name\"]`。\n\n"
- fmt: "\nThe test `property` `in` `object`, where `property` is given as a string,\
    \ will return `true` if and only if `object` has that `property`. A request for\
    \ a property that does not exist will get the value `undefined`.\n\n### 2.2.3\
    \ Built-In Object Types\n\nJavaScript comes with a number of built-in, or predefined,\
    \ object types. Among these are arrays, sets, maps, dates, and regular expressions.\n\
    \n### 2.2.4 Arrays\n\nAn `array` is an ordered collection of values. An `array\
    \ literal` can be defined by enclosing comma-separated values in square brackets:\n\
    \n```\nlet ary = [\"cat\", \"dog\", \"mouse\"];\n```\n\nCommas can be used either\
    \ *between* values or *after* values, so the above assignment is exactly equivalent\
    \ to:\n\n```\nlet ary = [\"cat\", \"dog\", \"mouse\", ];\n```\n\nThe last comma\
    \ is sometimes called a `trailing comma`.\n\nArray indexing is zero-based; the\
    \ first element of the above array is `ary[0]` and the last is `ary[ary.length\
    \ – 1]`.\n\nArrays of higher dimension can be created simply by nesting array\
    \ literals:\n\n```\nlet ary2d = [[11, 12], [21, 22]];\n```\n\nAfter the above\
    \ assignment, `ary2d[1]` is `[21, 22]` and `ary2d[1][0]` is `21`.\n\nA less-often\
    \ used form is `Array(values)`:\n\n```\nlet ary = new Array(\"cat\", \"dog\",\
    \ \"mouse\");\n```\n\nThis form is not generally recommended. One odd feature\
    \ of it is that if the argument is a single numeric value, `Array(n)`, the result\
    \ is a `sparse array` of `n` locations, not an array containing the single value\
    \ `n`.\n\nIn a sparse array, no storage is allocated for the elements of the array\
    \ until they have been assigned values; unassigned locations will appear to have\
    \ the value `undefined`. A sparse array can be arbitrarily large (only the actual\
    \ values in it contribute to its size), but it is slower to work with.\n\nThe\
    \ `length` property of an array is always one more than the largest index. Since\
    \ an array may be sparse, `length` is not necessarily a count of the number of\
    \ values in the array.\n\nArrays can be created from `iterable types` (types that\
    \ can be stepped through).\n\n*   `Array.from(set)` — Returns an array containing\
    \ the elements of `set`.\n*   `Array.from(string)` — Returns an array of characters\
    \ from `string`, each as a string.\n*   `Array.from(map)` — Returns an array of\
    \ `[key, value]` arrays.\n*   `Array.from(array)` — Returns a (shallow) copy of\
    \ `array`.\n\nArrays may contain a mix of different types of values.\n\n### 2.2.5\
    \ Sets\n\nA `set` is a collection of values, such that (1) no value appears more\
    \ than once, and (2) the order in which the values occur in the set is irrelevant.\n\
    \nOperations are:\n\n*   `new Set(iter)` — Creates and returns a new set containing\
    \ the values in the iterable object `iter` (often an array). To create an empty\
    \ set, omit `iter`.\n    *   If `iter` is a map, the result is a set of `[key,\
    \ value]` arrays.\n*   `set.has(value)` — Tests if `value` is a member of `set`.\n\
    *   `set.add(value)` — Adds `value` to `set` if it is not already present, and\
    \ returns `set`.\n*   `set.delete(value)` — If `value` is in `set`, it is deleted.\
    \ `delete` does not return `set`; it returns `true` if `value` was in `set`, and\
    \ `false` otherwise.\n*   `set.clear()` — Removes all values from `set` and returns\
    \ `undefined`.\n*   `set.size` — Returns the number of elements in `set`.\n\n\
    ### 2.2.6 Maps\n\nMaps are lookup tables. Each entry in a map consists of a key-value\
    \ pair. Keys must be unique, but the same value may occur multiple times.\n\n\
    Operations are:\n\n*   `new Map()` — Creates and returns a,, empty map.\n*   `new\
    \ Map(array_or_set)` — The `array_or_set` must consist of `[key, value]` arrays;\
    \ this returns a map with those keys and values.\n*   `map.has(key)` — Tests if\
    \ `map` contains the given `key`.\n*   `map.set(key, value)` — Sets or changes\
    \ the value associated with `key` to `value` and returns the modified `map`.\n\
    *   `map.get(key)` — Returns the value associated with `key`, or `undefined` if\
    \ `key` is not in the map.\n*   `map.delete(key)` — Removes `key` and its associated\
    \ `value` from `map`. Returns `true` if `map` was changed, `false` if `key` wasn’t\
    \ found in `map`.\n*   `map.clear()` — Removes all values from `set` and returns\
    \ `undefined`.\n\n### 2.2.7 Dates\n\nThe `Date` object represents a single moment\
    \ in time, measured as the number of milliseconds since the Unix epoch (January\
    \ 1, 1970, 00:00:00 UTC).\n\nTo access specific components of a `Date` object,\
    \ use the following methods:\n\n*   `date.getFullYear()` and `date.setFullYear(year)`\
    \ — `setFullYear` may also be given `month` and `day`.\n*   `date.getMonth()`\
    \ and `date.setMonth(month)` — `month` is 0 (January) to 11 (December).\n*   `date.getDate()`\
    \ and `date.setDate(day)` — `day` is 1 to 31.\n*   `date.getHours()` and `date.setHours(hours)`\
    \ — `hours` is 0 to 23.\n*   `date.getMinutes()` and `date.setMinutes(minutes)`\
    \ — `minutes` is 0 to 59.\n*   `date.getSeconds()` and `date.setSeconds(seconds)`\
    \ — `seconds` is 0 to 59.\n*   `date.getMilliseconds()` and `date.setMilliseconds(ms)`\
    \ — `ms` is 0 to 999.\n*   `date.getTime()` and `date.setTime(n)` — `n` is milliseconds\
    \ since epoch.\n    *   `Date.now()` also returns milliseconds since epoch but\
    \ is shorter than `new Date().getTime()`.\n*   `date.getDay()` returns 0 to 6,\
    \ where 0 means Sunday (regardless of where you are, and despite ISO 8601 specifying\
    \ Monday as the first day of the week).\n\nInternally, `Dates` are kept as milliseconds\
    \ since epoch. This makes arithmetic on dates very easy because the arguments\
    \ to the various `set` methods are not limited to the same ranges as the `get`\
    \ methods return. For example,\n\n```\n let date = new Date();\n let day_of_month\
    \ = date.getDate();\n date.setDate(day_of_month + 100);\n```\n\nsets `date` to\
    \ be a `Date` exactly 100 days in the future, with the correct month and year.\n\
    \n### 2.2.8 Regular Expressions\n\nA regular expression, or `regexp`, defines\
    \ a pattern to be applied to a string, to determine whether the pattern matches\
    \ the string, or to search the string for substrings that do match.\n"
  raw: "The test ***property*** `in` ***object***, where ***property*** is given as\
    \ a string, will return `true` if and only if ***object*** has that ***property***.\
    \ A request for a property that does not exist will get the value `undefined`.\n\
    \n### 2.2.3 Built-In Object Types\n\nJavaScript comes with a number of built-in,\
    \ or predefined, object types. Among these are arrays, sets, maps, dates, and\
    \ regular expressions.\n\n### 2.2.4 Arrays\n\nAn ***array*** is an ordered collection\
    \ of values. An ***array literal*** can be defined by enclosing comma-separated\
    \ values in square brackets:\n\n```\nlet ary = [\"cat\", \"dog\", \"mouse\"];\n\
    ```\n\nCommas can be used either *between* values or *after* values, so the above\
    \ assignment is exactly equivalent to:\n\n```\nlet ary = [\"cat\", \"dog\", \"\
    mouse\", ];\n```\n\nThe last comma is sometimes called a ***trailing comma***.\n\
    \nArray indexing is zero-based; the first element of the above array is `ary[0]`\
    \ and the last is `ary[ary.length – 1]`.\n\nArrays of higher dimension can be\
    \ created simply by nesting array literals:\n\n```\nlet ary2d = [[11, 12], [21,\
    \ 22]];\n```\n\nAfter the above assignment, `ary2d[1]` is `[21, 22]` and `ary2d[1][0]`\
    \ is `21`.\n\nA less-often used form is `Array(`***values***`)`:\n\n```\nlet ary\
    \ = new Array(\"cat\", \"dog\", \"mouse\");\n```\n\nThis form is not generally\
    \ recommended. One odd feature of it is that if the argument is a single numeric\
    \ value, `Array(`***n***`)`, the result is a ***sparse array*** of ***n*** locations,\
    \ *not* an array containing the single value ***n***.\n\nIn a sparse array, no\
    \ storage is allocated for the elements of the array until they have been assigned\
    \ values; unassigned locations will appear to have the value `undefined`. A sparse\
    \ array can be arbitrarily large (only the actual values in it contribute to its\
    \ size), but it is slower to work with.\n\nThe `length` property of an array is\
    \ always one more than the largest index. Since an array may be sparse, `length`\
    \ is not necessarily a count of the number of values in the array.\n\nArrays can\
    \ be created from ***iterable types*** (types that can be stepped through).\n\n\
    *   `Array.from(`***set***`)` — Returns an array containing the elements of ***set***.\n\
    \n*   `Array.from(`***string***`)` — Returns an array of characters from ***string***,\
    \ each as a string.\n\n*   `Array.from(`***map***`)` — Returns an array of `[`***key***`,`\
    \ ***value***`]` arrays.\n\n*   `Array.from(`***array***`)` — Returns a (shallow)\
    \ copy of ***array***.\n\nArrays may contain a mix of different types of values.\n\
    \n### 2.2.5 Sets\n\nA ***set*** is a collection of values, such that (1) no value\
    \ appears more than once, and (2) the order in which the values occur in the set\
    \ is irrelevant.\n\nOperations are:\n\n*   `new Set(`***iter***`)` — Creates and\
    \ returns a new set containing the values in the iterable object ***iter*** (often\
    \ an array). To create an empty set, omit ***iter***.\n\n    *   If ***iter***\
    \ `is` a map, the result is a set of `[`***key***`,` ***value***`]` arrays.\n\n\
    *   ***set***`.has(`***value***`)` — Tests if ***value*** is a member of ***set***.\n\
    \n*   ***set***`.add(`***value***`)` — Adds ***value*** to ***set*** if it is\
    \ not already present, and returns ***set***.\n\n*   ***set***`.delete(`***value***`)`\
    \ — If ***value*** is in ***set***, it is deleted. `delete` does *not* return\
    \ ***set***; it returns `true` if ***value*** was in ***set***, and `false` otherwise.\n\
    \n*   ***set***`.clear()` — Removes all values from ***set*** and returns `undefined`.\n\
    \n*   ***set***`.size` — Returns the number of elements in ***set***.\n\n### 2.2.6\
    \ Maps\n\n***Maps*** are lookup tables. Each entry in a map consists of a key-value\
    \ pair. Keys must be unique, but the same value may occur multiple times.\n\n\
    Operations are:\n\n*   `new Map()` — Creates and returns a new, empty map.\n\n\
    *   `new Map(`***array_or_set***`)` — The ***array_or_set*** must consist of `[`***key***`,`\
    \ ***value***`]` arrays; this returns a map with those keys and values.\n\n* \
    \  ***map***`.has(`***key***`)` — Tests if ***map*** contains the given ***key***.\n\
    \n*   ***map***`.set(`***key***`,` ***value***`)` — Sets or changes the value\
    \ associated with ***key*** to ***value*** and returns the modified ***map***.\n\
    \n*   ***map***`.get(`***key***`)` — Returns the value associated with ***key***,\
    \ or `undefined` if ***key*** is not in the map.\n\n*   ***map***`.delete(`***key***`)`\
    \ — Removes ***key*** and its associated ***value*** from ***map***. Returns `true`\
    \ if ***map*** was changed, `false` if ***key*** wasn’t found in ***map***.\n\n\
    *   ***map***`.clear()` — Removes all values from ***map*** and returns `undefined`.\n\
    \n*   ***map***`.size` — Returns the number of key-value pairs in ***map***.\n\
    \nMaps can use values of any type as keys.\n\n**Caution**: The notations ***map***`.`***value***\
    \ and ***map***`[`***value***`]` refer to map properties, not to map entries.\
    \ Use `set` and `get` to access the entries.\n\n### 2.2.7 Dates\n\nJavaScript\
    \ has a `Date` object, which can be created in any of the following ways:\n\n\
    *   `new Date()` — Returns the current date and time in the browser’s time zone.\n\
    \n*   `new Date(`***ms***`)` — Returns the date that corresponds to the number\
    \ of milliseconds since “epoch” (January 1, 1970).\n\n*   `new Date(`***year***`,`\
    \ ***month***`,` ***day***`,` ***hours***`,` ***minutes***`,` ***seconds***`,`\
    \ ***milliseconds***`)`\n\n    *   Up to five arguments may be omitted from the\
    \ right end, for example, new `Date(`***year***, ***month***, ***day***`)`.\n\n\
    \    *   You cannot supply just a year, because a single argument will be taken\
    \ as milliseconds.\n\n    *   If the ***year*** is less than 100, 1900 will be\
    \ added to it.\n\n*   `new Date(`***string***`)` — Converts ***string*** into\
    \ a `Date`, if possible, and returns it. The International Standard format is\
    \ ***yyyy***`-`***mm***`-`***dd***, but many other formats are recognized.\n\n\
    \    **Caution**: Without `new` in front of it, `Date()` returns a string, not\
    \ a date, and is equivalent to `String(new Date())`.\n\nTo access specific components\
    \ of a `Date` object, use the following methods:\n\n*   ***date***`.getFullYear()`\
    \ and ***date***`.setFullYear(`***year***`)`\n\n    *   ***date***`.setFullYear`\
    \ may also be given ***month*** and ***day*** arguments.\n\n*   ***date***`.getMonth()`\
    \ and ***date***`.setMonth(`***n***`)`, where ***n*** is 0 (January) to 11 (December).\n\
    \n*   ***date***`.getDate()` and ***date***`.setDate(`***n***`)`, where ***n***\
    \ is 1 to 31.\n\n*   ***date***`.getHours()` and ***date***`.setHours(`***n***`)`,\
    \ where ***n*** is 0 to 23.\n\n*   ***date***`.getMinutes()` and ***date***`.setMinutes(`***n***`)`,\
    \ where ***n*** is 0 to 59.\n\n*   ***date***`.getSeconds()` and ***date***`.setSeconds(`***n***`)`,\
    \ where ***n*** is 0 to 59.\n\n*   ***date***`.getMilliseconds()` and ***date***`.setMilliseconds(`***n***`)`,\
    \ where ***n*** is 0 to 999.\n\n*   ***date***`.getTime()` and ***date***`.setTime(`***n***`)`,\
    \ where ***n*** is milliseconds since epoch.\n\n    *   `Date.now()` also returns\
    \ milliseconds since epoch but is shorter than `new Date().getTime()`.\n\n*  \
    \ ***date***`.getDay()` returns 0 to 6, where 0 means Sunday (regardless of where\
    \ you are, and despite ISO 8601 specifying Monday as the first day of the week).\n\
    \nInternally, `Dates` are kept as milliseconds since epoch. This makes arithmetic\
    \ on dates very easy because the arguments to the various `set` methods are not\
    \ limited to the same ranges as the `get` methods return. For example,\n\n```\n\
    \ let date = new Date();\n let day_of_month = date.getDate();\n date.setDate(day_of_month\
    \ + 100);\n```\n\nsets `date` to be a `Date` exactly 100 days in the future, with\
    \ the correct month and year.\n\n### 2.2.8 Regular Expressions\n\nA ***regular\
    \ expression***, or ***regexp***, defines a pattern to be applied to a string,\
    \ to determine whether the pattern matches the string, or to search the string\
    \ for substrings that do match."
