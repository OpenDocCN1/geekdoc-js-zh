    \ from the text, starting at ***offset***.\n\n*   `remove()` — Removes the node\
    \ from the DOM tree.\n\n### 4.5.6 Example: ShowTree\n\nThe following HTML page\
    \ will, when the button is clicked, write out the complete tree of `Element`s\
    \ to the console, though with severely abbreviated text. The console must be open\
    \ to see the results."
