  trans: "\n\n*   `string.substring(start, end)` — 返回 `string` 中从位置 `start` 开始、到位置\
    \ `end-1` 处结束的子字符串。如果省略了 `end`，则返回 `start` 处及之后的所有字符。负索引被视为零。\n*   `string.toLowerCase()`\
    \ — 返回 `string` 的小写版本。\n*   `string.toUpperCase()` — 返回 `string` 的大写版本。\n*   `string.trim()`\
    \ — 返回一个去除了开头和结尾空白的字符串。\n*   `string.trimEnd()` 或 `string.trimRight()` — 返回一个去除了结尾空白的字符串。\n\
    *   `string.trimStart()` 或 `string.trimLeft()` — 返回一个去除了开头空白的字符串。\n\n# 附录 D：正则表达式\n\
    \n每种语言可能会添加自己的特色，但基础正则表达式在各种语言中都是非常标准的。在正则表达式内部可能包含以下内容：\n\n*   `Literals`（字面量）是代表自身的字符。示例包括字母、数字和空白字符。正则表达式\
    \ `/cat/` 将尝试匹配单词“cat”的出现。\n*   `Metacharacters`（元字符）是在正则表达式中具有特殊含义的字符。元字符有：`\\\
    \ | ( ) [ { ^ $ * + . ?` \n*   `Escaped characters`（转义字符）是前面带有反斜杠的字符，以便将其作为字面量而非元字符使用，或者因为它们难以用其他表示。例如，问号在正则表达式中有特殊含义，所以如果你想让它仅表示字面字符，必须对其进行转义：`\\\
    ?`\n\n[Table A.1] 列出了元字符及其含义。\n\n### 表格 A.1\n\n| 表达式 | 含义 | 示例 | 解释 |\n| --- |\
    \ --- | --- | --- |\n| 字面字符 | 相同的字符 | `M` | 大写字母 `M` |\n| `XY` | 一个 `X` 后紧跟一个\
    \ `Y` | `cat` | 按顺序的三个字符 `c a t` |\n| `[XYZ]` | `X`、`Y` 或 `Z` 中的任意一个字符 | `b[aeiou]g`\
    \ | 单词 `bag`、`beg`、`big`、`bog` 或 `bug` 中的其中一个 |\n| `[X-Y]` | `X` 和 `Y` 之间的任意字符（包含边界）\
    \ | `[0-9][a-zA-Z]` | 任意数字；任意字母 |\n| `[^X-Y]` | 不在 `X` 和 `Y` 之间的任意字符（包含边界） | `[^a-zA-Z]`\
    \ | 任意非字母 |\n| `X*` | `X` 的零次或多次出现 | `\\s*` | 任意数量的空白 |\n| `X+` | `X` 的一次或多次出现\
    \ | `\\s+` | 至少一个空白字符 |\n| `X?` | 可选的 `X` | `dogs?` | `dog` 或 `dogs` |\n| `X{n,m}`\
    \ | `X` 的 `n` 到 `m` 次出现 | `his{2,4}` | `hiss` 或 `hisss` 或 `hissss` |\n| `X{n,}`\
    \ | `X` 的 `n` 次或更多出现 | `his{2,}` | `hiss` 或 `hisss` 或 `hissss`，依此类推 |\n| `X{n}`\
    \ | `X` 恰好 `n` 次出现 | `his{2}` | Hiss |\n| `X|Y` | `X` 或 `Y` | `The (boy|girl)`\
    \ | `The boy` 或 `The girl` |\n| `^X` | 字符串开头的 `X` | `^[A-Z]` | 首大写字母（`^` 本身匹配空字符串）\
    \ |\n| `X$` | 字符串结尾的 `X` | `[\\.\\?!]$` | 以句、问号或感叹号结尾（`$` 本身匹配空字符串） |\n| `\\b`\
    \ | 单词字符 `(\\w)` 和非单词字符 (`\\W`) 之间的空字符串 | `\\bC\\b` | 语言中的单词 `C` |\n| `\\B` |\
    \ 不在单词字符 (`\\w`) 和非单词字符(`\\W`) 之间的空字符串 | `un\\B` | 单 healthy、undulate 等单词的开头部分\
    \ |\n| `(?=pat)` | 正向先行断言，确保模式 `pat` 将匹配后续，但不将其计入匹配部分 | `\\w+(?= )` | 一个单词，前提是后面跟着一个空格\
    \ |\n| `(?!pat)` | 反向先行断言，确保模式 `pat` 将不会匹配后续 | `\\w+(?!- )` | 一个单词，前提是后面不是跟着连字符\
    \ |\n| `(X)` | 将表达式 `X` 分组为一个单元，并记住它匹配的内容 | `(\\/\\/.*$)` | `//` 风格的注释（留作稍后参考）\
    \ |\n| `(?:X)` | 将表达式 `X` 分组为一个单元，但不记住它匹配的内容 | `(?:\\/\\/.*$)` | `//` 风格的注释（丢弃它）\
    \ |\n\n*不要在正则表达式中包含额外的空格！* 空格是一个字面字符，正则表达式中的空格需要在搜索字符串中也存在一个空格。\n\n`character\
    \ class`（字符类）代表字符集中的任意一个字符。有几个预定义的字符类：\n\n*   `\\w` 单词字符；等同于 `[a-zA-Z0-9_]`\n\
    *   `\\W` 非单词字符；等同于 `[^a-zA-Z0-9_]`\n*   `\\s` 空白字符\n*   `\\S` 非空白字符\n*   `\\\
    d` 数字；等同于 `[0-9]`\n*   `\\D` 非数字；等同于 `[⁰-9]`\n*   `.` 除换行符以外的任意字符\n\n其他字符类可以使用括号描述。例如，字符类\
    \ `[aeiouAEIO]` 可识别元音。\n\n正则表达式后面可以紧跟一个标记。两个重要的标记是 `g` 表示“全局”，`i` 表示“不区分大小写”。\n\
    \n# 参考文献\n\n*   Crockford, Douglas. *JavaScript: The Good Parts*. O’Reilly Media;\
    \ 第一版 (2008 年 5 月)。\n*   Flagan, David. *JavaScript: The Definitive Guide: Master\
    \ the World’s Most-Used Language*. O’Reilly Media; 第七版 (2020 年 6 月 23 日)。\n\n\
    # 索引\n\n*   `!DOCTYPE` [#ch1.xhtml_p2)\n*   `&&` (与运算符) [#ch3.xhtml_p71)\n*  \
    \ `++` (加 1 运算符) [#ch3.xhtml_p72)\n*   `--` (减 1 运算符) [#ch3.xhtml_p72)\n*   `...`\
    \ (剩余参数) [#ch3.xhtml_p76)\n*   `...` (展开运算符) [#ch3.xhtml_p77], [#ch3.xhtml_p103)\n\
    *   `/*` (多行注释) [#ch2.xhtml_p2)\n*   `//` (注释) [#ch2.xhtml_p2)\n*   `?` (可选运算符)\
    \ [#ch3.xhtml_p92)\n*   `??` (空合并运算符) [#ch3.xhtml_p72)\n*   `||` (或运算符) [#ch3.xhtml_p71)\n\
    *   `~` (测试) [#ch3.xhtml_p57)\n*   `__proto__` 属性 [#ch3.xhtml_p106)\n*   `action`\
    \ 属性 [#ch4.xhtml_p21)\n*   `active` 元素 [#ch4.xhtml_p114)\n*   `alert` 函数 [#ch2.xhtml_p4)\n\
    *   `apply` (函数方法) [#ch3.xhtml_p80)\n*   `argument` [#ch3.xhtml_p75)\n*   `array`\
    \ [#ch2.xhtml_p9)\n*   `array` 字面量 [#ch2.xhtml_p9)\n*   `array` 方法 [#appendix1.xhtml_p149)\n\
    *   `Array.from` 函数 [#ch2.xhtml_p10)\n*   `arrays` [#ch3.xhtml_p59)\n*   `arrow\
    \ functions` [#ch3.xhtml_p63], [#ch3.xhtml_p74)\n*   `arrow notation` [#ch3.xhtml_p94)\n\
    *   `ASI` [#ch2.xhtml_p22)\n*   `assert` 方法 [#ch2.xhtml_p45)\n*   `assign` (对象方法)\
    \ [#ch3.xhtml_p90)\n*   `assignment operator` [#ch2.xhtml_p20)\n*   `assignment\
    \ statement` [#ch2.xhtml_p26)\n*   `associativity` [#ch3.xhtml_p69)\n*   `ATTR`\
    \ [#ch4.xhtml_p140)\n*   `attributes` [#ch4.xhtml_p110)\n*   `automatic garbage\
    \ collection` [#ch3.xhtml_p62)\n*   Automatic Semicolon Insertion [#ch2.xhtml_p22)\n\
    *   `Babel` [#ch3.xhtml_p107)\n*   `backticks` [#ch3.xhtml_p55)\n*   `bad operators`\
    \ [#ch3.xhtml_p72)\n*   `bigint` [#ch2.xhtml_p8], [#ch3.xhtml_p54)\n*   `bind`\
    \ (函数方法) [#ch3.xhtml_p80)\n*   `bitwise operators` [#ch3.xhtml_p72)\n*   `blank\
    \ object` [#ch3.xhtml_p88)\n*   `block` [#ch2.xhtml_p18], [#ch2.xhtml_p23], [#ch2.xhtml_p27)\n\
