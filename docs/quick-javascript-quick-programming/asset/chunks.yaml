    \ of the following except `textarea` are written as `<input type=\"`***type***`\"\
    >`.\n\n*   `password` — All characters in the password field are displayed as\
    \ bullets. This difference affects only what the user sees; entered text is recorded\
    \ and can be accessed as usual.\n\n*   `search` — This is like `<input type=\"\
    text\">` but has a small icon in the right end that can be clicked to select previous\
    \ entries in the field.\n\n*   `email` — A text field in which an email address\
    \ can be entered. The entry is automatically checked (when submitted) to ensure\
    \ that it contains the `@` character. If the widget contains the `multiple` flag,\
    \ more than one email address can be entered, separated by commas.\n\n*   `number`\
    \ — A text field in which an integer can be entered. It is provided with up and\
    \ down arrows for adding or subtracting one from the displayed number. If the\
    \ `value` attribute is provided, it is used as the initial number displayed.\n\
    \n*   **URL** — A text field in which a URL can be entered. The field is automatically\
    \ checked (when submitted) to ensure that the entry is a syntactically correct\
    \ URL.\n\n*   `textarea` — The `<textarea name=\"`***name***`\" rows=\"`***nrows***`\"\
    \ cols=\"`***ncols***`\">` widget provides a multiline text-entry area, consisting\
    \ of ***nrows*** rows and wide enough to display ***ncols*** characters.\n\n \
    \   *   A closing tag `</textarea>` is required. Text between the opening and\
    \ closing tags (the `innerHTML`) is what is initially displayed in the text area.\n\
    \n    *   Text in the text area will be displayed in a monospace font.\n\n   \
    \ *   If the `name` attribute is omitted, the data in the text area will not be\
    \ included when the form is submitted.\n\nSome additional input widgets are available\
    \ for choosing dates and times, but these are not yet supported on all browsers.\n\
    \n*   `date` — For choosing a calendar date.\n\n*   `time` — For choosing a time\
    \ of day.\n\n*   `datetime-local` — For choosing a date and time.\n\n*   `week`\
    \ — For choosing a week.\n\n### 4.4.10 Other Input Widgets\n\nAlong with `button`,\
    \ `text`, `submit`, and `password`, there are a number of other values that the\
    \ `type` attribute of an `<input>` tag can take. Recall that for `<input>`, all\
    \ the needed information is in the start tag; no end `</input>` tag is used.\n\
    \nMany of these widgets give no indication to the user what they are intended\
    \ for, so they should always be accompanied by a `label`, preferably with one\
    \ that includes the `for` attribute.\n\n*   `radio` — The widget `<input type=\"\
    radio\" id=\"`***id***`\" name=\"`***group***`\" value=\"`***value***`\">` defines\
    \ a radio button. Radio buttons are always used in groups, where every radio button\
    \ has the same value for the `name` attribute. Selecting one radio button of a\
    \ group deselects all the others in that group.\n\n    *   In a `form`, ***group***`.value`\
    \ is the value of the selected radio button. If not in a form, the radio buttons\
    \ must be checked individually.\n\n    *   If no radio button has been selected,\
    \ the `value` of that group is the empty string. To start with one button checked,\
    \ give it the `checked` flag.\n\n*   `checkbox` — The `<input type=\"checkbox\"\
    \ id=\"`***id***`\">` widget is displayed as a small square that can be checked\
    \ or unchecked, independently of any other checkboxes. The `checked` attribute\
    \ (not the `value` attribute) of a checkbox will be `true` or `false`.\n\n*  \
    \ `file` — The `<input type=\"file\">` widget displays a rectangle containing\
    \ the words `\"Choose File\"`. When clicked, it brings up a file chooser. The\
    \ file chosen is accessible as the `value` attribute of the field. If the widget\
    \ contains the `multiple` flag, multiple files can be selected.\n\n*   `image`\
    \ — The `<input type=\"image\" src=\"`***path***`\">` widget displays the indicated\
    \ image.\n\n*   `color` — The `<input type=\"color\">` widget displays a small\
    \ rectangle containing a color (black, by default). Clicking it brings up a color\
    \ chooser. The `value` attribute sets the initial color, which must be of the\
    \ form `\"#`***RRGGBB***`\"` (six hex digits representing the amounts of red,\
    \ green, and blue).\n\n*   `<input type=\"hidden\">` widget is not visible to,\
    \ and cannot be modified by, the user.\n\n    *   When interaction with a server\
    \ occurs in a sequence of pages, the server can collect information from one page\
    \ and store it as attributes of a hidden widget in the next page. In this way,\
    \ a server can maintain information for a given user across a series of transactions.\n\
    \n    *   Hidden fields are not a security device. The underlying HTML of a page,\
    \ including hidden fields, can be viewed in any browser.\n\n*   `<input type=\"\
    range\">` displays a slider, to be used for choosing a number in a given range.\
    \ The default attributes are `min=\"0\"`, `max=\"100\"`, `step=\"1\"`, and `value=\"\
    50\".`\n\nUsually each checkbox and radio button has an associated label immediately\
    \ to its right. Checkboxes and radio buttons are small and a bit difficult to\
    \ click on, so each should have a `label` with a `for=\"`***id***`\"` attribute.\n\
    \n*   `<label for=\"`***id***`\">`***text***`</label>` — Clicking on the label\
    \ is the same as clicking on the widget whose id is specified by the `for` attribute.\n\
    \n### 4.4.11 Events\n\nUser actions (typing something, moving the mouse, clicking\
    \ the mouse, etc.) cause ***events*** to occur. One or more ***event handlers***\
    \ will be executed when certain events occur.\n\nEach form element (“widget”)\
    \ can have attributes that act as event handlers. For example, a button may be\
    \ defined as follows:\n\n```\n <input type=\"button\" onclick=\"save()\" value=\"\
    Save\">\n```\n\nHere, `onclick` is an event handler that tells JavaScript what\
    \ to do; in this case, call the `save()` function when the button is clicked.\
    \ Event handlers should generally be implemented as function calls.\n\nNumerous\
    \ events can occur, and not every widget can respond to every event. Browsers\
    \ differ somewhat in which form elements will handle which events. This section\
    \ describes the events and which form elements should be able to handle them."
