- fmt: "\nBoth types of collection have a `length` property, and both can be indexed\
    \ like an array or (redundantly) by the `item(index)` method. The fact that these\
    \ are “live” means that they can be thought of as a window into the DOM, rather\
    \ than a snapshot. If the DOM tree is changed, for instance by insertion or deletion\
    \ of nodes, the contents and length of these collections change correspondingly.\
    \ All `HTMLCollection`s are live, but some `NodeList`s are `static`—they don’t\
    \ change as the DOM tree changes.\n\nThe method `Array.from(collection)` returns\
    \ a static array of values from the `collection`.\n\n### 4.4.5 Text Fields\n\n\
    A text field is a `passive element`. Clicking on it or entering text into it should\
    \ not cause anything to happen. Later actions, such as button clicks, can access\
    \ and use the text that was entered.\n\n> **Note**: Technically, any element can\
    \ be made active. You *can* put an `onclick` property in a text field, and it\
    \ will work; but there is almost no situation in which this would be a good idea.\n\
    \nFor text fields, there isn’t a `<text>` tag, just a variation on the `<input>`\
    \ tag.\n\n```\n <input type=\"text\" size=\"12\" value=\"Initial text\">\n```\n\
    \nThe `size` attribute is a measure of how many characters can be displayed in\
    \ the text field; it defaults to 20. Any number of characters can be entered into\
    \ a text field, regardless of how many are displayed at a time.\n\nHere’s how\
    \ to read what the user has entered. First, find the text field (perhaps by using\
    \ `document.getElementById`), then read its `value` entry.\n\n```\n <input id='tx1'\
    \ type=\"text\">\n   <br>\n   <input type=\"button\"\n      value=\"Look in text\
    \ field\"\n      onclick=\"alert('You entered: ' +\n       document.getElementById('tx1').value)\"\
    >\n```\n\nThis works as you might expect. Enter something in the text field, click\
    \ the button, and it shows up in an alert message.\n\nIn general, widgets should\
    \ do nothing more complicated than call a single function. The above code can\
    \ be written more cleanly by putting the function in the head of the document:\n\
    \n```\n <script>\n    function showText(id) {\n     var field = document.getElementById(id);\n\
    \     alert('You entered: ' + field.value);\n    }\n   </script>\n```\n\nThe handler\
    \ for the button can then be written as a simple function call.\n\n```\n <input\
    \ type=\"button\" value=\"Look in text field\"\n      onclick=\"showText('tx1')\"\
    >\n```\n\n### 4.4.6 Buttons and Forms\n\nA common use for JavaScript is to send\
    \ information to a server. Usually there is more than one piece of information:\
    \ name, address, credit card number, and so on. To collect multiple pieces of\
    \ information into a single submission, a form is used.\n\nA `form` is a container,\
    \ with start tag `<form>` and end tag `</form>`. The purpose is to contain various\
    \ widgets, such as buttons and text fields, but any valid HTML can also be included.\
    \ By default, enclosing HTML in a `<form>` does not make any visible difference\
    \ on the screen.\n\nWe have already described the standard button type, using\
    \ either `<button>` or `<input type=\"button\">`. There are two other button types\
    \ particularly relevant to forms. Each has an old version (with `<input>`) and\
    \ a newer form (with `<button>`). For comparison, we show all three kinds of buttons\
    \ here. First, the old way:\n\n```\n <input type=\"button\" value=\"Click me\"\
    >\n <input type=\"submit\" value=\"Send it\">\n <input type=\"reset\" value=\"\
    Forget it\">\n```\n\nThen, the new way:\n\n```\n <button type=\"button\">Click\
    \ me</button>\n <button type=\"submit\">Send it</button>\n <button type=\"reset\"\
    >Forget it</button>\n```\n\nThe old way puts the text of the button in a `value`\
    \ property, so it can only be text. The new way puts it between `<button>` and\
    \ `</button>`, so it can be almost anything.\n\n*   When a “plain” button (`type=\"\
    button\"`) is clicked, no default action occurs.\n*   A `submit button` has the\
    \ default text `Submit`, and the default action of sending all the information\
    \ on the enclosing form to the server. (More on this shortly.)\n*   A `reset button`\
    \ has the default text `Reset`, and the default action of clearing everything\
    \ on the form to its original values. This action tends to annoy users.\n\n> **Note**:\
    \ A button without an explicit `type` attribute behaves like `type=\"button\"\
    ` *except in a form*, where it behaves like a `type=\"submit\"` button.\n\nOne\
    \ very convenient feature of forms is that they define a scope. Any widget within\
    \ a form can have a `name` property, and this name can be used by other widgets\
    \ in the same form. For example:\n\n```\n <form>\n    <input name='tx1' type=\"\
    text\">\n    <input type=\"button\"\n     value=\"Look in text field\"\n     onclick=\"\
    alert('You entered: ' + tx1.value)\">\n   </form>\n```\n\nAn `id` must be unique\
    \ on the entire HTML page and can be accessed by calling `getElementById(id)`\
    \ from within scripts; a `name` should be unique within a form, and can be accessed\
    \ directly by other widgets in the same form. Any widget can have a `name` and\
    \ an `id`.\n\nThere is seldom any need for more than one form. It is possible\
    \ to have more than one form on a page, but forms cannot be nested. A `submit`\
    \ button within a form will, the form with the `action` attribute.\n\nA `form`\
    \ tag may contain `action=\"URL\"` (Uniform Resource Locator) specifying the URL\
    \ to which the information is to be sent. If the `action` property is not present,\
    \ the URL of the page containing the form is used.\n\n### 4.4.7 Form Verification\n\
    \nWhen a user clicks a `Submit` button, it usually makes sense to check the information\
    \ in the form before sending it to the server. Not everything can be checked,\
    \ but many things can. Have required fields been left? Are there unexpected characters\
    \ in numeric fields?\n\nIf a tag `<input type=\"text\"...>` contains the attribute\
    \ `required` (with no value, just the word `required`), attempting to submit that\
    \ form will cause the text field to be checked to make sure it is not blank. If\
    \ it is blank, a small pop-up will appear next to the field containing the words\
    \ “Please fill in this field.”\n\nA text field may have an `pattern=\"regexp\"\
    ` attribute to specify by a regular expression `regexp` exactly what may be entered\
    \ into the field; it will be checked when the `Submit` button is clicked. An erroneous\
    \ entry will be flagged with “Please match the requested format.” The `regexp`\
    \ is given as a string, not bounded by slashes.\n\nA text field may have a `placeholder=\"\
    text\"` attribute; the `text` is displayed as a hint to the user about what should\
    \ be entered. The `text` will disappear when the user types into the field but\
    \ reappears if the field becomes blank again.\n\nOne way to do arbitrary validation\
    \ testing is to put an `onsubmit` property in the `<form>` tag, with a value that\
    \ has the syntax `return function_call()`; for example,\n\n```\n <form onsubmit=\"\
    return validate()\">\n    Type a number:\n    <input name='num' type=\"text\"\
    >\n    <br>\n    <input type=\"submit\">\n   </form>\n```\n\nIn this example,\
    \ the function `validate()` will be called when the `submit` button is clicked.\
    \ If validation fails, the function should call `event.preventDefault()`, otherwise\
    \ the submission will succeed. Either way, it is appropriate to inform the user.\n\
    \n### 4.4.8 Form Submission\n\nWhen a form is submitted, the `action` attribute\
    \ of the `form` tag tells the program *where* to send the data, and the `method`\
    \ attribute tells *how* to send the data.\n\nThe two most commonly used values\
    \ of the `method` attribute are `\"get\"` and `\"post\"`.\n\n#### 4.4.8.1 Get\
    \ Requests\n"
