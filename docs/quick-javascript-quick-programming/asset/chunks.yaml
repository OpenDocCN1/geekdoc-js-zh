  trans: "\n\nJavaScript 方法 `Math.min` 和 `Math.max` 分别接受任意数量的参数；它们*不*接受数组。然而，展开运算符（`...`）可以将数组转换为值序列，因此\
    \ `Math.min(...array)` 和 `Math.max(...array)` 可以可以正常工作。\n\n# 附录 B：高阶方法\n\n许多内置数组方法接受函数作为参数。箭头函数经常被用作参数，尽管也可以使用其他方式定义的函数。在下文中，我们用\
    \ `f` 表示接受一个参数的函数，用 `f2` 表示接受两个参数的函数。\n\n*   `array.sort(f2)` — 原地排序数组并返回排序后的数组。如果\
    \ `f2(x, y)` 返回负值，则 `x` 被认为小于 `y`；如果为 0，则两者相等；如果为正值，则 `x` 大于 `y`。\n    *   例如，`a.sort((x,\
    \ y) => x - y))` 按数字升序排序数组 `a`。\n*   `array.forEach(f)` — 为 `array` 中的每个元素调用函数\
    \ `f`。为了使其有用，`f` 应该具有副作用，因为 `f` 返回的任何值都会被忽略。\n*   `array.find(f)` — 查找并返回 `array`\
    \ 中第一个让 `f` 返回真值的元素（如果未找到则返回 `undefined`）。\n*   `array.findIndex(f)` — 查找并返回 `array`\
    \ 中第一个让 `f` 返回真值的元素的索引（如果未找到则返回 `-1`）。\n*   `array.map(f)` — 将 `f` 应用于 `array`\
    \ 的每个元素，返回一个包含结果的数组。如果存在空位（holes），会被保留。\n*   `array.flatMap(f)` — 将 `f` 应用于 `array`\
    \ 的每个元素。如果生成的数组是多维的，则移除一层嵌套，将所有值提升到下一个高层。\n*   `array.filter(f)` — 返回一个数组，其中包含\
    \ `array` 中所有且仅包含 `f` 返回真值的值。\n*   `array.reduce(f2, initial)` — 给定有两个参数的函数 `f2`，将\
