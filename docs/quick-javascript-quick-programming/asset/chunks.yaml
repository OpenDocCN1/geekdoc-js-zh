  trans: "\n\n解构也可以用于数组。使用逗号来表示被跳过的数组元素。\n\n```\n let a = [11, 22, 33, 44];\n let\
    \ [, x, , y] = a;\n // x = 22, y = 44\n```\n\n## 3.4 数据类型\n\n### 3.4.1 数字\n\n\
    `number` 可以写成整数或实数。无论如何编写，数字（`bigints` 除外）都被存储为双精度浮点数，并遵循《IEEE 浮点运算标准》（`IEEE 754`）。\n\
    \n为了提高可读性，数字可以包含下划线，例如，一百可以写成 `1_000_000`。\n\n> **注意**：将字符串转换为数字的方法（`Number`、`parseInt`\
    \ 和 `parseFloat`）无法识别数字中的下划线。\n\n有一些特殊的预定义“数字”：\n\n*   `NaN`（“**N**ot **a N**umber”）是如\
    \ `0/0` 和 `\"one\"/\"two\"` 等表达式的结果。\n\n    *   你可以将其写为 `Number.NaN`，或直接写 `NaN`。\n\
    \n    *   尽管名称如此，`NaN` *确实*是一个数字，且 `typeof(NaN)` 将返回 `\"number\"`。\n\n    *  \
    \ 涉及 `NaN` 的算术运算结果为 `NaN`。\n\n*   `Infinity` 是如 `1/0` 等表达式的结果。\n\n*   `-Infinity`\
    \ 是表达式 `-1/0` 的结果。\n\n    *   `isFinite(x)` 对于 `-Infinity`、`Infinity` 和 `NaN`\
    \ 将返回 `false`。\n\n*   `Number.MIN_VALUE` 是可以表示的最小数字，约为 `5e-324`。\n\n*   `Number.EPSILON`\
    \ 约为 `2.220446049250313e-16`。它是与 1 相加结果不同于 1 的最小数字。\n\n*   `Number.MAX_VALUE`\
    \ 是可以表示的最大数字，约为 `1.7976931348623157e+308`。\n\n*   `Number.MAX_SAFE_INTEGER` 是\
    \ `9007199254740991`；它是可以被唯一表示为双精度浮点数的最大整数。\n\n*   `Number.MIN_SAFE_INTEGER` 是\
    \ `-9007199254740991`。\n\n上述所有内容都被视为数字。任何算术表达式永远不会导致异常。\n\n> **注意**：函数 `isNaN(value)`\
    \ 在 `value` 为 `NaN` 时返回 `true`，但它对任何无法转换为数字的 `value` 也返回 `true`。要测试变量 `v` 的值是否真的*是*\
    \ `NaN`，请使用测试 `v != v`。这是因为 `NaN` 是唯一不等于自身的值。\n\n一些额外的方法是 `Number.isInteger(n)`、`Number.isSafeInteger(n)`\
    \ 和 `Number.isFinite(n)`。\n\n`bigint` 是一个带有 `n` 后缀的整数，例如，`123n`。`bigints` 可以有任意数量的数字。`bigints`\
    \ 可以进行所有常用的数字操作，但元加运算符除外：`+123n` 是非法的。\n\n`bigints` 和（普通）数字不能在算术表达式中混合使用，但 `bigints`\
    \ 和数字可以进行比较（使用 `<`, `<=` 等）。要在两种类型之间转换，请使用 `BigInt(number)` 和 `Number(bigint)`。\n\
    \n十六进制字面量以 `0x` 或 `0X` 开头。八进制字面量以 `0o` 或 `0O` 开头。\n\n在严格模式下，编写带有前导零的数字（例如 `0123`）是非法的，零除外。在非严格模式下，某些实现会将此类数字视为八进制，另一些则将其视为十进制。\n\
    \n### 3.4.2 字符串\n\n`string` 是零或多个 UTF-16 字符的序列，由单引号（`'hello'`）、双引号（`\"hello\"\
    `）或反引号（```hello``）包含。不支持 UTF-32。\n\n一种引号可以使用另一种引号包含的字符串内，例如，`\"Don't go.\"`。与包含类型相同的引号必须转义（见下文）。\n\
    \n由反引号包含的字符串是特殊的。它们可以跨多行，并且字符串中任何出现 `${expression}` 的地方，`expression` 被求并成为字符串的一部分。这样的字符串被称为模板字面量。\n\
    \n没有“字符”数据类型。某些无法直接写在字符串中的字符可以被“转义”，即通过反斜杠后跟字母或十六进制数字来指定。这样编写的字符仍然被视为单个字符。\n\n\
    转义字符是：\n\n*   `\\0` NUL\n*   `\\b` 退格\n*   `\\f` 换页\n*   `\\n` 换行\n*   `\\r` 回车\n\
    *   `\\t` 水平制表符\n*   `\\v` 垂直制表符\n*   `\\\\` 反斜杠\n*   `\\'` 单引号\n*   `\\\"` 双引号\n\
    \n### 3.4.3 布尔值\n\n`boolean` 有两个值：`true` 和 `false`。这些值是逻辑操作和比较的结果。\n\n```\n let\
    \ a = true;\n let b = false;\n let c = a && b; // false\n let d = a || b; // true\n\
    \ let e = !a; // false\n```\n\n### 3.4.4 空和未定义\n\n`null` 表示任何对象值的有意缺失。`undefined`\
    \ 意味着变量已声明但未赋值值。\n\n```\n let a; // undefined\n let b = null;\n```\n\n> **注意**：`typeof\
    \ null` 返回 \"object\"。\n\n### 3.4.5 对象\n\n`object` 是属性的集合，其中每个属性都是从字符串键到值的映射。\n\
    \n```\n let user = {name: \"Alice\", age: 30};\n```\n\n可以使用点符号法或中括号表示法访问属性：\n\n\
    ```\n console.log(user.name); // Alice\n console.log(user[\"name\"]); // Alice\n\
    ```\n\n可以添加、修改或删除属性：\n\n```\n user.city = \"New York\";\n user.age = 31;\n delete\
    \ user.age;\n```\n"
- fmt: "\n*   `array`.pop()`—Removes and returns the last element in `array` and updates\
    \ its `length`.\n*   `array`.unshift(elems)`—Returns the new length of `array`\
    \ after adding `elems` to the beginning of `array`.\n*   `array`.shift()`—Removes\
    \ and returns the first element in `array` and updates the array’s `length`.\n\
    \nThe `push` and `pop` operations may be used to implement stacks efficiently.\n\
    \nThe pairs `push` and `shift`, or `pop` and `unshift`, may be used to implement\
    \ queues; all four methods together may be used to implement deques.\n\nBecause\
    \ the `unshift` and `shift` methods actually move the elements in the array, they\
    \ are much less efficient than `push` and `pop`.\n\nSeveral additional array methods\
    \ are described in [Appendix A](#appendix1.xhtml).\n\n### 3.4.6 Sparse Arrays\n\
    \nIn most languages, arrays are `dense`: an array of size `n` takes up `n` consecutive\
    \ memory locations. Arrays in JavaScript may be either dense or sparse.\n\nA `sparse\
    \ array` is one in which only locations containing actual values take up memory\
    \ in the computer; all other locations appear to contain the special value `undefined`.\
    \ Sparse arrays occupy less memory but take more time to process.\n\nHere are\
    \ some ways to make a sparse array:\n\n*   Use the form `Array(length)` to create\
    \ the array.\n*   Use `delete array[i]` to delete some existing element of `array`.\n\
    *   Assign a value to `array[i]`, where `i > array.length`.\n    *   Assigning\
    \ a value to `array[array.length]` does not force the array to be sparse.\n* \
    \  Set the `length` property of an array to a larger value.\n    *   If you set\
    \ `length` to a smaller value, array elements at that index and beyond are discarded.\n\
    *   Write a literal array using consecutive commas, for example, `[\"cat\",, \"\
    dog\",,,]`.\n    *   The length of this array is five (not six); the last comma\
    \ is taken as a trailing comma.\n\nTo better understand sparse arrays, it helps\
    \ to remember that `undefined` is an actual value in JavaScript, and as such takes\
    \ up actual space in memory. But if we ask for the value in some location of a\
    \ sparse array and get `undefined`, this could mean either (1) there is nothing\
    \ in that location, or (2) the location really does contain the value `undefined`.\n\
    \nThis has some practical implications. The `for/in` loop will loop through all\
    \ indices of an array, whether there is something at that location or not. The\
    \ `for/of` loop will only loop through actual values (some of which may be `undefined`).\n\
    \nThe method `array`.hasOwnProperty(i)` will return `true` if `array[i]` contains\
    \ an actual value, `false` if it doesn’t.\n\n### 3.4.7 Sets\n\nJavaScript does\
    \ not supply the usual operations on sets (union, intersection, difference, symmetric\
    \ difference). Using the `spread operator` (`...`), which turns an array into\
    \ a sequence of values, these operations can be implemented as follows.\n\n```javascript\n\
    function union(a, b) {\n  return new Set([...a, ...b]);\n}\n\nfunction intersection(a,\
    \ b) {\n  return new Set([...a].filter(x => b.has(x)));\n}\n\nfunction difference(a,\
    \ b) {\n  return new Set([...a].filter(x => !b.has(x)));\n}\n\nfunction symmetricDifference(a,\
    \ b) {\n  return difference(union(a, b), intersection(a, b));\n}\n```\n\n### 3.4.8\
    \ Maps\n\nIn many languages, it is undesirable to use mutable objects as keys.\
    \ This is not an issue in JavaScript, which compares keys for identity rather\
    \ than equality. No matter what changes are made to an object used as a key, it\
    \ retains its identity; a different “equal” object cannot be used to recover the\
    \ associated value.\n\n> **Caution**: Every object literal is a unique object.\
    \ If you use an object literal as a key, you will never be able to “recreate”\
    \ that key. You can, however, iterate over the map.\n\nThree new methods have\
    \ recently been added to `Map`s:\n\n*   `map`.keys()`—Returns an iterator for\
    \ the keys of `map`.\n*   `map`.values()`—Returns an iterator for the values in\
    \ `map`.\n*   `map`.entries()`—Returns an iterator for the entries of `map`, where\
    \ each entry is returned as a `[key, value]` array.\n\nThe `for (let var of iterator)\
    \ {…}` loop is the easiest way to use an iterator.\n\n### 3.4.9 WeakMaps\n\nJavaScript\
    \ uses `automatic garbage collection`: Space is allocated for objects when needed,\
    \ and reclaimed when those objects become inaccessible. Objects become inaccessible\
    \ when the program no longer has any way to refer to them.\n\nAs a trivial example:\n\
    \n```javascript\nlet car = {make: \"Suburu\", year: 2018};\ncar = {make: \"Toyota\"\
    , color: \"white\"};\n```\n\nAfter the second assignment, there is no longer any\
    \ way to access the object `{make: \"Suburu\", year: 2018}`, therefore it can\
    \ be garbage collected.\n\nA `WeakMap` is like a `Map`—it matches keys to values.\
    \ Here are the differences:\n\n*   The constructor is `WeakMap()`.\n*   Only objects,\
    \ not primitives, can be used as keys.\n*   `get(key)`, `set(key, value)`, `has(key)`,\
    \ and `delete(key)` are provided.\n*   `WeakMap`s are not iterable, so you cannot\
    \ use `for/of` with them.\n*   The state of a `WeakMap` at any given time may\
    \ be nondeterministic.\n*   Garbage collection can happen at unpredictable times.\
    \ The allowable methods are for which this will not be an issue.\n*   Objects\
    \ with temporary existence can be garbage collected.\n\n### 3.4.10 Promises\n\n\
    If you have a long-running task whose results are not needed immediately, such\
    \ as a file transfer, you may wish to start it asynchronously while your code\
    \ continues to do things. A `promise` is code that runs asynchronously and “promises”\
    \ to complete a task at some time.\n\nThe following assignment statement creates\
    \ a `Promise` object, saves it in `promise`, and starts the `function` executing:\n\
    \n```javascript\nlet promise = new Promise(function);\n```\n\n> **Caution**: Keep\
    \ in mind the distinction between a *function* and a *function call*. If we define\
    \ `function f(){}`, then `f` is the function itself, while `f()` is a call to\
    \ that function. The argument to the `Promise` constructor must be a function.\n\
    \nThere are three ways a promise can terminate: By reporting “success,” by reporting\
    \ “failure,” or by throwing an exception. To deal with this, the `function` used\
    \ by the promise should have two parameters, each of which is also a function\
    \ (sometimes called a *callback*). The promise code should call the first function\
    \ to report success, or the second to report failure.\n\nIt is often convenient\
    \ to use *arrow functions* (described later) to write the callback functions of\
    \ a promise. Like this:\n\n```javascript\nnew Promise((onSuccess, onFailure) =>\
    \ {code});\n```\n\nIn this syntax, `code` is the (possibly long-running) code\
    \ to be executed, `onSuccess` is a function to execute if `code` is successful,\
    \ and `onFailure` is a function to execute if the code fails. Note especially\
    \ that the arguments given to the parameters `onSuccess` and `onFailure` must\
    \ be functions; each of these functions may take one argument, or none.\n\nThe\
    \ promise’s `then` method supplies the functions for the promise to use.\n\n*\
    \   `promise`.then(successFunction, failureFunction)`—Tells the promise which\
    \ function to call upon success or failure.\n    *   Calling either `successFunction`\
    \ or `failureFunction` will terminate the promise.\n    *   If an unhandled exception\
    \ occurs, the `failureFunction` is called.\n"
