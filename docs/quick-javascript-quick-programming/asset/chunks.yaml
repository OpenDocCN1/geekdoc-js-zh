    # Appendix D: Regular Expressions


    Although each language may add its own flourishes, basic regular expressions are
    quite standardized across languages. Inside a regular expression there may be
    the following:


    *   `Literals` are characters that stand for themselves. Examples include letters,
    digits, and whitespace characters. The regular expression `/cat/` will try to
    match an occurrence of the word “cat.”

    *   `Metacharacters` are characters that have special meaning in a regular expression.
    The metacharacters are: `\ | ( ) [ { ^ $ * + . ?`

    *   `Escaped characters` are characters that are preceded by a backslash in order
    to use them as literals rather than as metacharacters or because they are difficult
    to represent otherwise. For example, the question mark has a special meaning in
    a regular expression so if you want it to mean just the literal character, you
    have to escape it.: `\?`


    [Table A.1] lists the metacharacters and their meanings.


    ### Table A.1


    | Expression | Meaning | Examples | Explanation |

    | --- | --- | --- | --- |

    | a literal character | That same character | `M` | The capital letter `M` |

    | `XY` | An `X` followed by a `Y` | `cat` | The three characters `c a t`, in that
    order |

    | `[XYZ]` | Any one of the characters `X`, `Y`, or `Z`. | `b[aeiou]g` | One of
    the words `bag`, `beg`, `big`, `bog`, or `bug` |

    | `[X-Y]` | Any one character between `X` and `Y`, inclusive | `[0-9][a-zA-Z]`
    | Any decimal digit; Any letter |

    | `[^X-Y]` | Any one character not between `X` and `Y`, inclusive | `[^a-zA-Z]`
    | Any non-letter |

    | `X*` | Zero or more occurrences of `X` | `\s*` | Any amount of whitespace |

    | `X+` | One or more occurrences of `X` | `\s+` | At least one whitespace character
    |

    | `X?` | An optional `X` | `dogs?` | Either `dog` or `dogs` |

    | `X{n,m}` | From `n` to `m` occurrences of `X` | `his{2,4}` | `hiss` or `hisss`
    or `hissss` |

    | `X{n,}` | `n` or more occurrences of `X` | `his{2,}` | `hiss` or `hisss` or
    `hissss`, and so on |

    | `X{n}` | Exactly `n` occurrences of `X` | `his{2}` | Hiss |

    | `X|Y` | Either `X` or `Y` | `The (boy|girl)` | Either `The boy` or `The girl`
    |

    | `^X` | `X` at the beginning of the string | `^[A-Z]` | An initial capital letter
    (the `^` itself matches the empty string) |

    | `X$` | `X` at the end of the string | `[\.\?!]$` | Ends with a period, question
    mark or exclamation point (the `$` itself matches the empty string) |

    | `\b` | The empty string between a word character `(\w)` and a nonword character
    (`\W`) | `\bC\b` | The word `C`, as in the language |

    | `\B` | An empty string that is not between a word character (`\w`) and a nonword
    character(`\W`) | `un\B` | The initial part of the words unhealthy, undulate,
    etc. |

    | `(?=pat)` | Look ahead to make sure that the pattern `pat` will match next,
    but do not count it in the matched part | `\w+(?= )` | A word, provided it is
    followed by a space |

    | `(?!pat)` | Look ahead to make sure that the pattern `pat` will not match next
    | `\w+(?!- )` | A word, provided it is not followed by a hyphen |

    | `(X)` | Group the expression `X` into a single unit, and remember what it matches
    | `(\/\/.*$)` | A `//`-style comment (keep for later reference) |

    | `(?:X)` | Group the expression `X` into a single unit, but do not remember what
    it matches | `(?:\/\/.*$)` | A `//-`style comment (discard it) |


    *Do not include extra spaces in regular expressions!* A space is a literal character
    and a space in a regular expression requires a space in the string being searched.


    A `character class` represents any one of the set of characters. There are several
    predefined character classes:


    *   `\w` A word character; same as `[a-zA-Z0-9_]`

    *   `\W` A nonword character; same as `[^a-zA-Z0-9_]`

    *   `\s` A whitespace character

    *   `\S` A non-whitespace character

    *   `\d` A digit; same as `[0-9]`

    *   `\D` A nondigit; same as `[^0-9]`

    *   (A period, not escaped) Any character except a line terminator


    Other character classes can be described by using brackets. For example, the character
    class `[aeiouAEIOU]` could be used to recognize vowels.


    A regular expression may be followed immediately by a flag. Two important flags
    are `g` for “global,” meaning “do it everywhere,” and `i` for “case insensitive.”


