    括号用于覆盖上述规则并指定的求值顺序。当求值顺序可能不直观时，括号也用于显示求值顺序。


    表 3.2 列出了最重要的运算符。其中许多运算符的意义显而易见；不常用的运算符将根据需要进行解释。


    表 3.2 JavaScript 的“良好”运算符


    | 运算符 | 目的 | 结合性 | 优先级 |

    | --- | --- | --- | --- |

    | `( )` | 分组 | n/a | 21 |

    | `obj` `.`prop` | 属性访问 | 左 | 20 |

    | `ary`[`index`]` | 数组索引 | 左 | 20 |

    | `new` `type`(`args`)` | 对象创建 | n/a | 20 |

    | `fun`(`args`)` | 函数调用 | 左 | 20 |

    | `obj` `?.` `prop` | 可选链 | 左 | 20 |

    | `new` `type` | 对象创建 | 右 | 19 |

    | `!` `value` | 逻辑非 | 右 | 17 |

    | `+` `value` | 一元加 | 右 | 17 |

    | `-` `value` | 一元减 | 右 | 17 |

    | `typeof` `value` | 类型（字符串形式） | 右 | 17 |

    | `void` `value` | 视为 undefined | 右 | 17 |

    | `delete` `obj`.`prop` | 删除属性 | 右 | 17 |

    | `expr` `**` `expr` | 幂 | 右 | 16 |

    | `expr` `*` `expr` | 乘法 | 左 | 15 |

    | `expr` `/` `expr` | 除法 | 左 | 15 |

    | `expr` `%` `expr` | 取余 | 左 | 15 |

    | `expr` `+` `expr` | 加法 | 左 | 14 |

    | `expr` `-` `expr` | 减法 | 左 | 14 |

    | `expr` `<` `expr` | 小 | 左 | 12 |

    | `expr` `<=` `expr` | 小于等于 | 左 | 12 |

    | `expr` `>` `expr` | 大 | 左 | 12 |

    | `expr` `>=` `expr` | 大于等于 | 左 | 12 |

    | `expr` `in` `expr` | 对象拥有属性 | 左 | 12 |

    | `expr` `instanceof` `type` | 对象是某类型 | 左 | 12 |

    | `expr` `==` `expr` | 等于 | 左 | 11 |

    | `expr` `!=` `expr` | 不等于 | 左 | 11 |

    | `expr` `===` `expr` | 严格相等 | 左 | 11 |

    | `expr` `!==` `expr` | 不严格相等 | 左 | 11 |

    | `expr` `&&` `expr` | 逻辑与 | 左 | 6 |

    | `expr` `||` `expr` | 逻辑或 | 左 | 5 |

    | `test` `?` `expr` `:` `expr` | 如果-那么-否则 | 右 | 4 |

    | `id` `=` `expr` | 简单赋值 | 右 | 3 |

    | `id op expr`, 其中 `op` 是 `=` `/%=%=+=-=&&=` `||`=` `?=` 之一 | 代表 `id` `=`id op
    expr` | 右 | 3 |

    | `yield` `expr` | 协程退出 | 右 | 2 |

    | `expr` , `expr` | 多次求值 | 左 | 1 |


    ## 3.8 运算符说明


    `&&` 运算符意味着“与”。`||` 运算符意味着“或”。


    逻辑运算符 `&&` 和 `||` 是**短路**运算符。也就是说，如果从第一个（左侧）表达式已经知道了结果，则不会对第二个（右侧）表达式进行求值。因为 JavaScript
    具有“真值”（truthy）和“假值”（falsy），`&&` 和 `||` 运算符并不一定返回 `true` 或 `false`，而是可能返回一个真值或假值。


    *   `expr1` `&&` `expr2`——如果 `expr1` 为假值，结果为 `expr1`，否则结果为 `expr2`。

    *   `expr1` `||` `expr2`——如果 `expr1` 为真值，结果为 `expr1`，否则结果为 `expr2`。


    对于一组由 `&&` 连接的值，结果是遇到的第一个假值，要么是最后一个真值。同样，对于一组由 `||` 连接的值，结果是遇到的第一个真值，要么是最后一个假值。这一事实有时会以一种“巧妙”的方式使用；例如，表达式
    `x || 5` 当 `x` 为 0（或其他假值）时其值为 `5`，否则其值为 `x` 的值。


    各种赋值运算符**确实是**运算符。

