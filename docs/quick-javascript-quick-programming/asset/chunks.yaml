  trans: "\n\n一个 `class` 描述了一类对象。它是一个蓝图，或者是创建该类型对象的配方。类是 JavaScript 中一个较新的的特性，并且始终在严格模式下运行。类基于原型，与仅仅使用原型相比，提供的优势很少，甚至没有。\n\
    \n以下是类的模板：\n\n```\nclass ClassName {\n  fields;\n  constructor(arguments) {\n\
    \    code\n  }\n  set name(value) {\n    this.someOtherName = value;\n  }\n  get\
    \ name() {\n    return this.someOtherName;\n  }\n  methodName(arguments) {\n \
    \   code\n  }\n}\n```\n\n> **提醒**：在方法（属于对象的函数）中，`this` 指向包含它的对象。构造函数、setter 和\
    \ getter 也是如此。\n\n一个类有一个 `constructor`，并可能拥有若干个 `fields`、`getters`、`setters` 和\
    \ `methods`。为了描述这些内容，我们将继续使用我们的“汽车”示例。\n\n```\n class Car {\n    fuel = \"gasoline\"\
    ; // 注意：没有 \"let\"\n    constructor(make, year) {\n     this.make = make;\n  \
    \   this.year = year;\n    }\n   }\n\n   let myCar = new Car(\"Subaru\", 2018);\n\
    ```\n\n`new` 单词调用构造函数。在构造函数内部，`make` 和 `year` 指向构造函数的参数，而 `this.make` 和 `this.year`\
    \ 是属于正在构造的对象的新字段。构造函数可以用于创建具有不同值的其他 `Car` 对象。\n\n> **技术说明**：从构造函数创建的对象获得一个 `constructor`\
    \ 属性，该属性又有一个 `name` 属性，因此 `myCar.constructor.name` 是 `\"Car\"`。\n\n通过上述定义，`myCar`\
    \ 的字段 `fuel`、`make` 和 `year` 可以被直接访问，通过 `myCar.fuel`、`myCar.make` 和 `myCar.year`。有时，为了提供更多的“保护”，类可以包含\
    \ setter 和 getter。这些是具有特殊语法的方法：\n\n```\nset name(value) {…} 和\nget name() {…}\n\
    ```\n\n`setter` 通常用于设置字段的值。setter 经常被用于在保存值之前检查该值的合法性。它可能会以不同于提供的值的形式保存信息（例如，将英里转换为公里）。\n\
    \n`getter` 通常返回对象字段的值。或者，getter 可能会以其他方式计算一个值并返回它，例如，将公里转换回英里。\n\n要使用这些 setter\
    \ 和 getter，*代码中不需要任何更改*。如果一个字段有 setter，任何更改字段值的尝试（例如，`myCar.make = \"VW\"`）都会调用该\
    \ setter。任何读取字段值的尝试都会调用其 getter。\n\n当为一个变量定义了 setter 时，*每次*设置该变量值的尝试都会调用其 setter。这可能会导致一个问题。特别是，以下代码会导致“无限”递归，因为\
    \ setter 调用了它自己。\n\n```\n set make(value) {\n    this.make = value; // 错误！\n \
    \  } \n```\n\n可以通过使用其他名称保存变量来避免递归。由于下划线在变量名中是合法的，一种惯例是在名称前面加上一个下划线来创建一个新名称。这仅仅是一种惯例；下划线并没有特殊之处。\n\
    \n```\n set make(value) {\n    this._make = value; // 正确\n   }\n```\n\n新变量 `_make`\
    \ 必须在整个类定义中使用，而旧变量 `make` 应该在类定义外部使用。\n\ngetter 和 setter 通常应该成对定义。带有 setter 的变量必须存储其他名称下，而没有\
    \ setter 的变量不受影响。\n\n> **注意**：虽然使用 setter 可以防止意外更改值，但它无法防止恶意用户。使用上述为 `make` 定义的\
    \ setter，信息实际上存储在变量 `_make` 中，而该变量是可以直接访问的。\n\n`method`（方法）是属于对象的函数；而类是对象的一种。在类内部，方法的写法像函数一样，只是省略了\
    \ `function` 单词。\n\n以下是 `Car` 类的实现：\n\n```\n class Car {\n    fuel = \"gasoline\"\
    ;\n\n    constructor(make, year) {\n     this._make = make;\n     this._year =\
    \ year;\n    }\n\n    set make(arg) { this._make = arg; }\n\n    get make() {\
    \ return this._make; }\n\n    set year(arg) {\n     if (arg < 1903 ||\n      \
    \ arg > new Date().getFullYear()) {\n      alert(\"Bad year: \" + arg);\n    \
    \ }\n     else {\n      this._year = arg;\n     }\n    }\n\n    get year() { return\
    \ this._year; }\n\n    age() { // 方法\n     let now = new Date().getFullYear();\n\
    \     return now - this._year;\n    }\n\n    toString() {\n     return this._year\
    \ + \" \" + this._make;\n    }\n   }\n```\n\n对 `myCar` 进行赋值将创建一个带有 `make` 和 `year`\
    \ 字段的对象。在此之后，测试 `myCar instanceof Car` 将返回 `true`。\n\n> **注意**：`this` 单词在运行时求值，并取决于它发生的上下文。\n\
    \n### 1. 继承\n\n类可以继承另一个类。被继承的类称为子类，继承它的类称为父类。子类使用 `extends` 关键字来指示其父类。\n\n子类继承父类的所有属性和方法。你也可以向子类添加新功能。\n\
    \n```\nclass Animal {}\nclass Dog extends Animal {}\n```\n\n#### 构造函数\n\n每个类都必须构造函数，构造函数应该首先调用父类的构造函数。这必须在任何使用\
    \ `this` 之前完成。\n\n如果没有指定构造函数，JavaScript 会自动提供一个。它假设构造函数接收与父类构造函数相同的参数。如果我们能看到它，它应该是这样的：\n\
    \n```\nconstructor(...args) { super(...args); }\n```\n\n展开运算符 (`...`) 用于将任意数量的参数收集到数组中，并提供任意数量。\n\
    \n#### 方法覆盖\n\n子类还可以覆盖其父类的一个或多个方法。当子类需要为方法提供不同的实现时，这是非常有用的。\n\n```javascript\n\
    class Animal {\n  eat() {\n    console.log(\"eating...\");\n  }\n}\n\nclass Dog\
    \ extends Animal {\n  eat() {\n    console.log(\"eating dog food...\");\n  }\n\
    }\n```\n\n#### `super` 函数\n\n`super` 函数用于调用父类的构造函数。它也可以从子类调用父类方法。\n\n```javascript\n\
    class Animal {\n  constructor(name) {\n    this.name = name;\n  }\n  move() {\n\
    \    console.log(this.name + \" moves.\");\n  }\n}\n\nclass Dog extends Animal\
    \ {\n  constructor(name, breed) {\n    super(name);\n    this.breed = breed;\n\
    \  }\n  move() {\n    super.move();\n    console.log(this.name + \" is running.\"\
    );\n  }\n}\n```\n\n### 2. 静态方法和属性\n\n类可以拥有静态方法和属性。这些属于类本身，而不是类的任何实例。它们使用 `static`\
    \ 关键字定义。\n\n```javascript\nclass Animal {\n  static species = \"mammal\";\n  static\
    \ logInfo() {\n    console.log(\"Animal info\");\n  }\n}\n\nconsole.log(Animal.species);\n\
    Animal.logInfo();\n```\n\n静态方法和属性在类的实例上不可用。然而，它们会被子类继承。\n\n```javascript\nclass\
    \ Animal {\n  static logInfo() {\n    console.log(\"Generic info\");\n  }\n}\n\
    \nclass Dog extends Animal {\n  static logInfo() {\n    console.log(\"Dog info\"\
    );\n  }\n}\n\nAnimal.logInfo(); // Generic info\nDog.logInfo(); // Dog info\n\
    ```\n"
- fmt: "\n```\n let person = new Person(\"Sally\");\n let cust = new Customer(\"Bill\"\
    , 123);\ncust.name = \"William\";\n```\n\n> **Note**: Objects don’t have to be\
    \ created from a class in order to have getter and setter methods. The syntax,\
    \ using the `get` and `set` keywords, is the same as that shown above.\n\n###\
    \ 3.11.10.3 Overriding Methods and Fields\n\nFields and methods defined in one\
    \ class may be redefined, or `overridden`, in a subclass. For example, the `Object`\
    \ class defines a `toString` method. This method isn’t very useful because it\
    \ always returns `\"[object Object]\"`, but it does exist.\n\nYou can override\
    \ a method simply by defining a new method with the same name. For example, we\
    \ might add the following method to the `Person` class:\n\n```\n toString() {\n\
    \    return \"My name is \" + this.name;\n   }\n```\n\n> **Note**: In most browsers,\
    \ the `console.log(obj)` method does not use `toString`; instead, it prints the\
    \ structure of the object. If this isn’t what you want, you can call `toString`\
    \ explicitly, or simply concatenate an empty string to the argument, `console.log(obj\
    \ + \"\")`.\n\nFields can also be overridden. However, the word `this` always\
    \ refers to “the object before the dot.” For example:\n\n```\n class Over {\n\
    \    value = 100;\n    show() {\n     return \"value is \" + this.value;\n   \
    \ }\n   }\n\n   class Under extends Over {\n    value = 50;\n   }\n\n   let under\
    \ = new Under();\n   console.log(under.show());\n```\n\nThis prints `\"value is\
    \ 50\"`. Although `show()` is defined in `Over`, the variable `under` is of type\
    \ `Under`, so `this.value` is `50`, not `100`.\n\nIf `value` were not defined\
    \ in `Under`, then `under` would inherit it from `Over`, and `this.value` would\
    \ be `100`.\n\n### 3.11.10.4 Class Prototypes\n\nAs noted earlier, you can construct\
    \ an object that uses an existing object as its prototype.\n\n```\nlet newObj\
    \ = Object.create(oldObj);\n```\n\nThe `newObj` will not initially have any properties\
    \ of its own, but properties can be added later. Any attempt to look up a property\
    \ of `newObj` will look first in `newObj` itself, but if not found there, JavaScript\
    \ will look in its prototype, `oldObj`.\n\nThe method `Object.getPrototypeOf(newObj)`\
    \ will return `oldObj`, but there is also an older way to access the prototype:\
    \ `newObj.__proto__`. The non-enumerable `__proto__` property should not be used\
    \ in new code.\n\nSomething similar happens with classes.\n\n```\n class Person\
    \ {…}\n class Customer extends Person {…}\n let sally = new Customer(…);\n```\n\
    \nThe object `sally` has access to the methods declared in `Customer` plus the\
    \ methods declared in `Person` (unless they are overridden by methods with the\
    \ same name in `Customer`).\n\nWhen you declare a function or create a class with\
    \ a constructor, that function or class gets a property confusingly named `prototype`.\
    \ The value of this property is an object containing function names and definitions.\n\
    \n> **Note**: Do not confuse the `prototype` property of a class, `class.prototype`,\
    \ with an object’s prototype, `obj.__proto__`.\n\nYou can attach a method to all\
    \ instances of a class by assigning to its `prototype`:\n\n```\n Person.prototype.initial\
    \ = function() {\n    return this.name[0];\n   }\n```\n\nThe method `initial`\
    \ will return the first character of a person’s name (assuming that `Person` has\
    \ a `name` property).\n\n## 3.12 Transpilers and Polyfills\n\nJavaScript evolves\
    \ and (hopefully) gets better. Unfortunately, older browsers may not support some\
    \ of the newest features. In order for JavaScript code to work “everywhere,” there\
    \ are two different approaches that may be taken:\n\n1. Use only well-established\
    \ features that work everywhere.\n2. Use transpilers and/or polyfills.\n\nA `transpiler`\
    \ “compiles” newer syntactic features, such as the `??` operator, into older but\
    \ equivalent syntax. `Babel` is a well-known transpiler.\n\nA `polyfill` is a\
    \ function or a library of functions that may or may not be currently included.\
    \ A missing function can be added directly to the code. A library of polyfills\
    \ may be loaded from a polyfill server, although this increases load time. There\
    \ is more controversy about which polyfill library to use, if any, but `polyfill.io`\
    \ is reasonably popular.\n\n## 3.13 JSON\n\n`JSON` (`JavaScript Object Notation`)\
    \ is a way of representing data as text. This is useful for storing the data on\
    \ a file, or transmitting it to or from a server. JSON is human-readable and editable;\
    \ it is quite similar to data in JavaScript.\n\nThere are two methods:\n\n* `JSON.stringify(value)`—Converts\
    \ a JavaScript `value` to a JSON string.\n* `JSON.parse(string)`—Converts a JSON\
    \ `string` to a JavaScript object.\n\n# 4 Client-Side JavaScript\n\nAfter a few\
    \ introductory sections, the remainder of the book is divided into two parts:\
    \ **Graphical Interfaces**, which is all that programmers need, and **Using the\
    \ DOM**, which describes the.\n\n## 4.1 Essential HTML\n\nAn `HTML page` is a\
    \ text file, containing tags.\n\nMost `tags` are containers. They consist of a\
    \ `start tag`, some `contents`, and an `end tag`. The syntax is:\n\n```\n<tagName>\
    \ contents </tagName>\n```\n\nContainer tags can contain text and other tags,\
    \ to any level.\n\nA few kinds of tags are empty, that is, not containers. For\
    \ example, `<br>` is a line break, and `<hr>` is a horizontal rule. No end tag\
    \ is needed. Such tags are sometimes written as `<tagName/>`.\n\nAn HTML page\
    \ consists of at least four tags:\n\n* A `document tag`, which identifies the\
    \ file as HTML. It is not a container.\n* An `html tag`, containing the head and\
    \ body tags.\n* A `head tag`, containing meta-information about the page, most\
    \ of which is not displayed. This usually includes a `<title>` tag to name the\
    \ page.\n* A `body tag`, containing information to be displayed to the user, and\
    \ numerous other tags to specify just it should be displayed.\n\nHere is a minimal\
    \ HTML page.\n\n```html\n<!DOCTYPE html>\n   <html>\n    <head>\n     <title>Example\
    \ HTML Page</title>\n    </head>\n    <body>\n     <p id=\"p1\">The user sees\
    \ this part.</p>\n    </body>\n   </html>\n```\n\nStart tags can contain `attributes`,\
    \ which have the form `name=\"`value`\"`. One such attribute is `id`, to assign\
    \ a unique identifier to an individual tag.\n\nJavaScript is case-sensitive, but\
    \ tag names and attributes in HTML are not case sensitive.\n\nOriginally, all\
    \ styling was done in the HTML itself. Today, most styles are applied by one or\
    \ more associated `stylesheets`, written in CSS, Cascading Style Sheets.\n\n##\
    \ 4.2 Adding JavaScript to HTML\n\nJavaScript can be added to an HTML page by:\n\
    \n* Putting the JavaScript within `<script>`…`</script>` tags, in either the head\
    \ or the body.\n* Putting the JavaScript in a separate file that has a `.js` extension,\
    \ and loading it with `<script src=\"`URL`.js\"></script>` in the head element.\
    \ In this case, any code within the `<script>` tags will be ignored.\n* Writing\
    \ the JavaScript as the value of an HTML “event handler” attribute.\n"
