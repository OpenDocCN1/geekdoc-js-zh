    \ for a class:\n\n```\nclass ClassName {\n  fields;\n  constructor(arguments)\
    \ {\n    code\n  }\n  set name(value) {\n    this.someOtherName = value;\n  }\n\
    \  get name() {\n    return this.someOtherName;\n  }\n  methodName(arguments)\
    \ {\n    code\n  }\n}\n```\n\n> **Reminder**: In a method (a function belonging\
    \ to an object), this refers to the containing object. The same holds for constructors,\
    \ setters, and getters.\n\nA class has a ***constructor*** and may have some number\
    \ of ***fields***, ***getters***, ***setters***, and ***methods***. To describe\
    \ these, we will continue with our “car” example.\n\n```\n class Car {\n    fuel\
    \ = \"gasoline\"; // note: no \"let\"\n    constructor(make, year) {\n     this.make\
    \ = make;\n     this.year = year;\n    }\n   }\n\n   let myCar = new Car(\"Subaru\"\
    , 2018);\n```\n\nThe word `new` calls the constructor. Within the constructor,\
    \ `make` and `year` refer to the arguments of the constructor, while `this.make`\
    \ and `this.year` are new fields belonging to the object being constructed. The\
    \ constructor can be used to create other `Car` objects with different values.\n\
    \n> **Technical note**: An object created from a constructor gets a `constructor`\
    \ property, and that property has a `name` property, so `myCar.constructor.name`\
    \ is `\"Car\"`.\n\nWith the above definitions, the fields `fuel`, `make`, and\
    \ `year` of `myCar` can be addressed directly, with `myCar.fuel`, `myCar.make`,\
    \ and `myCar.year`. Sometimes, to provide a bit more “protection,” a class can\
    \ contain setters and getters. These are methods with the special syntax\n\n```\n\
    set name(value) {…} and\nget name() {…}\n```\n\nA ***setter*** typically sets\
    \ the value of a field. Setters are often used to check the legality of a value\
    \ before saving it. It may save the information in a form other than the form\
    \ provided to it (for example, miles may be converted to kilometers).\n\nA ***getter***\
    \ typically returns the value of an object’s field. Alternatively, a getter may\
    \ compute a value in some other way and return it, for example, converting kilometers\
    \ back to miles.\n\nTo use these setters and getters, *no change in the code*\
    \ is involved. If a field has a setter, any attempt to change the value of a field\
    \ (for example, `myCar.make = \"VW\"`) will invoke that setter. Any attempt to\
    \ read the value of a field will invoke its getter.\n\nWhen a setter is defined\
    \ for a variable, *every* attempt to set the value of that variable calls its\
    \ setter. This can be a problem. In particular, the following code would cause\
    \ an “infinite” recursion, as the setter calls itself.\n\n```\n set make(value)\
    \ {\n    this.make = value; // bad!\n   } \n```\n\nThe recursion can be avoided\
    \ by saving the variable under some other name. Since underscores are legal in\
    \ variable names, one convention is to make a new name by prepending an underscore.\
    \ This is only a convention; there is nothing special about underscores.\n\n```\n\
    \ set make(value) {\n    this._make = value; // okay\n   }\n```\n\nThe new variable\
    \ `_make` must be used throughout the class definition, while the old variable\
    \ `make` should be used outside the class definition.\n\nGetters and setters should\
    \ normally be defined in pairs. Variables with setters must be stored under some\
    \ other name, while variables without setters are unaffected.\n\n> **Caution**:\
    \ While the use of a setter can protect against accidentally changing a value,\
    \ it is no protection against malicious users. With the above setter for `make`,\
    \ the information is actually stored in a variable `_make`, and this variable\
    \ is directly accessible.\n\nA ***method*** is a function belonging to an object;\
    \ and a class is a kind of object. Inside a class, a method is written like a\
    \ function, except that the word `function` is omitted.\n\nHere is an implementation\
    \ of a `Car` class:\n\n```\n class Car {\n    fuel = \"gasoline\";\n\n    constructor(make,\
    \ year) {\n     this._make = make;\n     this._year = year;\n    }\n\n    set\
    \ make(arg) { this._make = arg; }\n\n    get make() { return this._make; }\n\n\
    \    set year(arg) {\n     if (arg < 1903 ||\n       arg > new Date().getFullYear())\
    \ {\n      alert(\"Bad year: \" + arg);\n     }\n     else {\n      this._year\
    \ = arg;\n     }\n    }\n\n    get year() { return this._year; }\n\n    age()\
    \ { // method\n     let now = new Date().getFullYear();\n     return now - this._year;\n\
    \    }\n\n    toString() {\n     return this._year + \" \" + this._make;\n   \
    \ }\n   }\n```\n\nAn assignment to `myCar` will create an object with the fields\
    \ `make` and `year`. After this, the test `myCar instanceof Car` will return `true`.\n\
    \n> **Caution**: The word `this` is evaluated at run time, and depends on the\
    \ context in which it occurs. Calling `myCar.age()` directly works fine, but `myCar.age`\
    \ is an incomplete function with no fixed value for `this`. The solution is to\
    \ replace the definition `age() {…}` with `age = () => {…}`, which creates a new\
    \ `age` function for each `Car`.\n\n#### 3.11.10.2 Inheritance\n\nEvery class\
    \ except `Object` ***extends*** (adds information to) some other class—its ***superclass***.\
    \ If no superclass is specified, as in `Person`, it defaults to extending `Object`.\n\
    \nA class may have any number of ***subclasses***. A subclass builds upon (“extends”)\
    \ its superclass by adding or replacing features.\n\nHere is a first example:\n\
    \n```\n class Person {} // extends Object\n\n class Customer extends Person {}\n\
    ```\n\nWhen you ask JavaScript to create a new `Customer`, it starts by creating\
    \ a new `Object`; then it then it adds to that object all the features of `Person`;\
    \ finally, it adds all the features of `Customer`. In this way, an object of a\
    \ class is built “on top of” an object of its superclass.\n\nEvery class must\
    \ have a constructor, and the constructor should begin by calling the constructor\
    \ for its superclass, with `super(`***args***`)`. This isn’t necessarily the very\
    \ first thing that must be done, but it must happen before any use of `this` is\
    \ attempted.\n\nIf no constructor is specified, JavaScript automatically supplies\
    \ one. JavaScript assumes that the constructor will take the same arguments as\
    \ the constructor in its superclass. If we could see it, it would look something\
    \ like this:\n\n```\n constructor(...args) { super(...args); }\n```\n\nThe ***spread\
    \ operator*** (`...`) is used in the above both to collect an arbitrary number\
    \ of arguments into an array and to supply an arbitrary number from an array.\n\
    \nSince the above classes have constructors, we can create objects with `new Person()`\
    \ and `new Customer()`.\n\n> **Note**: Although the classes `Person` and `Customer`\
    \ have no properties or methods, they are not necessarily useless. Features can\
    \ be added to them later, by assigning to the class *prototype*, for example,\
    \ `Person.prototype.name` `= \"anonymous\";`.\n\nAn object created from a class\
    \ is still just an object. You can, for example, add properties to it.\n\n```\n\
    \ let friend = new Person();\nfriend.name = \"Sally\";\n```\n\n> **Technical note**:\
    \ The `instanceof` test will test for membership not only in the immediate class\
    \ but also in all superclasses, so both `friend instanceof Person` and `friend\
    \ instanceof Object` will return `true`.\n\nWith this in mind, let us revise the\
    \ above classes so that every `Person` has a `name` and every `Customer` has an\
    \ `id`. We will also provide a setter and a getter for a person’s `name`, but\
    \ insist that a `name` be a string.\n\n```\n class Person {\n   constructor(name)\
    \ {\n     this._name = name;\n    }\n\n    set name(value) {\n     if (typeof\
    \ value == \"string\") {\n      this._name = value;\n     } else {\n      alert(value\
    \ + \" is not a string.\");\n     }\n    }\n\n    get name() { return this._name;\
    \ }\n   }\n\n   class Customer extends Person {\n    constructor(name, id) {\n\
    \     super(name);\n     this.id = id;\n    }\n   }\n```\n\nWe can use these classes\
    \ like this:"
