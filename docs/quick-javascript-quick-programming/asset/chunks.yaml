    事件名称有时使用驼峰命名法（camelCase），例如使用 `onClick` 而不是 `onclick`。这是因为标签是在 HTML 中的，而 HTML
    是不区分大小写的，但在引号内的 JavaScript 中，它是区分大小写的。


    以下事件可以在 `<body>` 或 `<frame>` 元素中处理（`frame` 是一个作为页面部分加载的独立 URL 文件）：


    *   `onload` — 文档或框架已完成加载。可以使用它来执行一个函数以完成任何所需的初始化。

    *   `onunload` — 文档或框架已卸载。可以使用它来执行任何最终的清理工作。


    大多数元素都可以处理以下事件：


    *   `onclick` — 元素被点击。按钮几乎总是会处理 `onclick` 事件。大多数其他控件都会自动处理针对给定类型控件的所有常规操作。

    *   `ondblclick` — 元素在短时间内被点击了两次。

    *   `onmousedown` — 鼠标悬停在控件上时按下鼠标键（或键盘等效键）。要区分按下的是哪个鼠标键，请使用 `onmousedown` 而不是
    `onclick`。`event.button` 的值对于左键、中键和右键分别为 `0`、`1` 或 `2`。

    *   `onmouseup` — 鼠标悬停在控件上时释放鼠标键。此事件通常被忽略，转而处理 `onclick` 事件。

    *   `onmouseover` — 鼠标移动到控件上。

    *   `onmouseout` — 鼠标移出控件。

    *   `onmousemove` — 鼠标移动。


    现代设备可能具有触摸屏或手写笔。上述 `onmouse` 事件可以被 `onpointer` 事件取代，后者对鼠标和触摸事件都同样有效。


    以下事件由 `<body>` 元素以及 `input` 和 `textarea` 控件处理：


    *   `onkeypress` — 在此控件获得焦点时点击了按键。

    *   `onkeydown` — 在此控件获得焦点时按下按键。

    *   `onkeyup` — 在此控件获得焦点时释放按键。

    *   `onfocus` — 控件获得焦点（例如，用户通过 Tab 键切换）。

    *   `onblur` — 控件失去焦点。

    *   `onchange` — 控件失去焦点时，其值与获得焦点时的值不同。


    以下事件通常在封装的 `<form>` 标签中处理：


    *   `onselect` — 选择了部分文本。要检索选中的文本，使用 `document.getSelection()`。

    *   `onreset` — 用户点击了重置按钮。如果 `onreset` 属性值为 `"return false"` 或 `"return someFunction()"`（其中
    `someFunction` 返回 `false`），则取消重置。

    *   `onsubmit` — 用户点击了提交按钮。如果 `onsubmit` 属性值为 `"return false"` 或 `"return someFunction()"`（其中
    `someFunction` 返回 `false`），则取消提交。


    以下事件通常由 `<img>` 标签处理：


    *   `onabort` — 图像加载被中断。

    *   `onerror` — 加载图像时发生错误。


    事件处理器可以访问 `event`。在处理器中：`event.type` 是事件类型。`event.target` 是触发事件的元素。`event.currentTarget`
    是事件监听器绑定的元素。`event.button` 表示按下了哪个鼠标键：`0` 代表左键，`1` 代表中键，`2` 代表右键。`event.clientX`
    和 `event.clientY` 表示鼠标相对于浏览器视口的位置。`event.key` 是被按下的键值。


    ```javascript

    console.log("Wow!");

    ```


    ### 4.4 冒泡


    当事件发生时，它首先命中目标元素，然后向其祖先传播。这被称为冒泡。可以通过调用 `event.stopPropagation()` 停止事件冒泡。要防止事件的默认行为，请使用
    `event.preventDefault()`。


    ### 4.5 Window 对象


    `window` 对象是浏览器中的全局对象。它有许多属性和方法。


    #### 4.5.1 Window 属性


    是一些 `window` 属性：


    *   `appName` — 浏览器，例如 `Netscape`。

    *   `platform` — 运行浏览器的计算机，例如 `Win32` 或 `MacIntel`。

    *   `userAgent` — 平台的详细描述。

    *   `self` — 对当前窗口的引用。

    *   `length` — 窗口中帧的数量。

    *   `parent` — 直接封装的窗口。

    *   `document` — 在此窗口显示的 HTML 文档。

    *   `top` — 最外层的窗口。

    *   `location` — 文档的 URL。


    #### 4.5.1.2 Window 方法


    是一些可用方法：


    *   `alert(string)` — 显示一个包含字符串和“确定”按钮的警报对话框。

    *   `confirm(string)` — 显示一个包含字符串以及“取消”和“确定”按钮的确认框。

    *   `prompt(string)` — 显示一个包含字符串、文本字段以及“取消”和“确定”按钮的提示框。

    *   `open(URL)` — 打开包含 URL 指定文档的新窗口。

    *   `close()` — 关闭给定的窗口，但仅当它是由 `open` 打开时。

    *   `setTimeout(function, delay, arg1, ..., argN)` — 设置定时器，在 `delay` 毫秒后调用 `function`，并带有可选参数
    `arg1` 到 `argN`。

    *   `clearTimeout(timeoutId)` — 取消由 `setTimeout` 启动的待定定时。

    *   `setInterval(code, interval)` — 设置定时器，每隔 `interval` 毫秒执行一次 `code`。

    *   `clearTimeout(intervalId)` — 取消由 `setInterval` 启动的周期性执行。


