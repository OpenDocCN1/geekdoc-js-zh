    \ 部分的文本。\n\n*   `document.title` — 文档标题。\n\n*   `document.URL` — 只读的文档 URL。\n\n\
    *   `document.bgColor` — 文档的背景颜色。\n\n*   `document.fgColor` — 文档的前景颜色。\n\n*  \
    \ `document.links` — 文档中的链接集合。\n\n*   `document.images` — 文档中的图像集合。\n\n*   `document.links`\
    \ — 文档中的超链接集合。\n\n*   `document.forms` — 文档中的表单集合。\n\n*   `document.scripts` —\
    \ 文档中的脚本集合。\n\n*   `document.cookie` — 文档的 Cookie。\n\n*   `document.domain` —\
