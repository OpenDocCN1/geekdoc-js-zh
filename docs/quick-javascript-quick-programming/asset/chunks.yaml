    \nA ***number*** may be written as an integer or as a real number. However written,\
    \ numbers (other than bigints) are stored as double precision floating point numbers\
    \ and follow the ***IEEE Standard for Floating-Point Arithmetic*** (***IEEE 754***).\n\
