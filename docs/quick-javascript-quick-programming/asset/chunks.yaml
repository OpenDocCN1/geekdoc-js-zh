    ## 3.1 Strict Mode\n\nNo language is perfect. JavaScript allows some things that,\
    \ in retrospect, should not have been allowed. JavaScript now has a `strict mode`\
    \ to disallow those features and to modify others. To turn strict mode on globally,\
    \ put the string\n\n```\n\"use strict\";\n```\n\nas the `first` thing in a script;\
    \ to turn strict mode on for just one function, put that string as the first line\
    \ inside the function.\n\nTurning on strict mode makes the following things illegal:\n\
    \n*   Assigning to a variable that has not been declared with `var`, `let`, or\
    \ `const`.\n*   The `with` statement.\n*   Defining a function within a conditional\
    \ or a loop statement.\n*   Using `eval` to create variables.\n*   Using `delete`\
    \ to delete a variable, object, function, or an undeletable property (such as\
    \ `prototype`).\n*   Modifying a read-only or get-only property.\n\n## 3.2 Identifiers\n\
    \nIdentifiers consist of letters (Unicode), digits, underscores, and dollar signs.\n\
    \n## 3.3 Destructuring\n\nDestructuring is a way to assign parts of an object\
    \ into different variables. As an example, we use the following object:\n\n```\n\
    let p = {givenName: \"Sally\", familyName: \"Willis\", occupation: \"doctor\"\
    };\n```\n\nWe may wish to assign the parts of this object into separate variables:\n\
    \n```\nlet givenName = p.givenName;\nlet familyName = p.familyName;\nlet occupation\
    \ = p.occupation;\n```\n\nDestructuring is a shorter way to do exactly the same\
    \ thing:\n\n```\nlet {givenName, familyName, occupation} = p;\n```\n\nProperty\
    \ names need not be in order, and not every name has to be mentioned. Property\
    \ names that are not part of the object may be given; they will receive `undefined`.\n\
    \nTo work with a similar object of the same type, say `p2`, you cannot use `let`\
    \ again because variables may only be declared once.\n\n```\nlet {givenName, familyName,\
    \ occupation} = p2;\n// SyntaxError: Identifier 'givenName' has\n// already been\
    \ declared\n```\n\nNeither can you simply omit the word `let` because starting\
    \ with an open brace, `{`, indicates a block.\n\n```\n{givenName, familyName,\
    \ occupation} = p2;\n// SyntaxError: Unexpected token '='\n```\n\nThe solution\
    \ is to enclose the entire statement, up the semicolon, in parentheses.\n\n```\n\
    ({givenName, familyName, occupation} = p2);\n```\n\nAn object may be destructured\
    \ into different variable names.\n\n```\nlet {familyName: name, occupation: occ}\
    \ = p;\n// name = \"Willis\", occ = \"doctor\"\n```\n\nDefault values may be given,\
    \ in case the object lacks the given properties.\n\n```\n({givenName: name, country\
    \ = \"USA\"} = p);\n// name = \"Sally\", country = \"USA\"\n```\n\nRenaming and\
    \ giving default values may be combined.\n\n```\n({givenName: name=\"Joe\", age=40}\
    \ = p);\n// name = \"Sally\", age = 40\n```\n\nWhen a function is called, values\
    \ are assigned to its parameters, and these act like assignment statements; therefore,\
    \ destructuring may also be used in the parameter list.\n\n```\nfunction f({familyName,\
    \ occupation: occ,\n                    age=40, gender: g=\"male\"}) {\n    //\
    \ When called with f(p), familyName =\n    // \"Willis\", occ = \"doctor\", age\
    \ = 40,\n    // and g = \"male\"\n   }\n```"
