  trans: "\n\n**注意**：从技术角度来说，需要注意的是，窗口可用的 `timeout` 和 `interval` 方法并没有定义在 `Window`\
    \ 对象中，而是继承自其他地方。这在实际应用中没有太大区别。\n\n### 4.5.1.3 Window 示例\n\n假设我们在 HTML 文档的 `<head>`\
    \ 中有以下 JavaScript 代码（位于 `<script>` 标签内）：\n\n```\n \"use strict\";\n   let win2,\
