    \ pressed while over the widget. To distinguish which mouse button is pressed,\
    \ use `onmousedown` instead of `onclick`. The value of `event.button` will be\
    \ `0`, `1`, or `2` for the left, middle, and right mouse buttons, respectively.\n\
    \n*   `onmouseup` — the mouse button is released while over the widget. This event\
    \ is usually ignored in favor of handling the `onclick` event\n\n*   `onmouseover`\
    \ — the mouse is moved over the widget.\n\n*   `onmouseout` — the mouse is moved\
    \ away from the widget.\n\n*   `onmousemove` — the mouse is moved.\n\nModern devices\
    \ may have touch screens or pens. The above `onmouse` events may be replaced with\
    \ `onpointer` events which work equally well with both mouse and touch events.\n\
    \nThe following events can be handled by the `body` element and the `input` and\
    \ `textarea` widgets.\n\n*   `onkeypress` — a key is clicked while this widget\
    \ has focus.\n\n*   `onkeydown` — a key is depressed while this widget has focus.\n\
    \n*   `onkeyup` — a key is released while this widget has focus.\n\n*   `onfocus`\
    \ — the widget gains focus (for example, by the user tabbing to it).\n\n*   `onblur`\
    \ — the widget loses the focus.\n\n*   `onchange` — the widget loses focus with\
    \ a different value than it had when it gained focus.\n\nThe following events\
    \ are often handled in the enclosing `<form>` tag.\n\n*   `onselect` — a portion\
    \ of text is selected. To retrieve the selected text, use `document.getSelection()`.\n\
    \n*   `onreset` — the user has clicked a Reset button. If the value of the `onreset`\
    \ attribute is `\"return false\"` or `\"return` ***someFunction***`()\"` where\
    \ ***someFunction*** returns `false`, the reset is cancelled.\n\n*   `onsubmit`\
    \ — the user has clicked a Submit button. If the value of the `onsubmit` attribute\
    \ is `\"return false\"` or `\"return` ***someFunction***`()\"` where ***someFunction***\
    \ returns `false`, the submission is cancelled.\n\nThe following events are usually\
    \ handled by the `<img>` tag.\n\n*   `onabort` — image loading has been interrupted.\n\
    \n*   `onerror` — there was an error loading the image.\n\nEvent handlers have\
    \ access to an `event` variable. In the handler:\n\n*   `event.type` is the part\
    \ after `\"on\"` (e.g. for `onclick`, `event.type` is `\"click\"`).\n\n*   `event.target`\
    \ is the widget at which the event occurred.\n\n*   `event.currentTarget` is the\
    \ current widget, when, as a result of bubbling (see next section), the immediate\
    \ target does not handle the event.\n\n*   For mouse clicks, `event.clientX` and\
    \ `event.clientY` indicate the mouse position; `event.button` is `0`, `1`, or\
    \ `2` for left click, middle click, and right click, respectively.\n\n*   For\
    \ key presses, `event.key` holds the character typed.\n\nFor example, the following\
    \ code displays a button which, when clicked, writes a message to `console.log`:\n\
    \n```\n <input type=\"button\" value=\"Wow!\" id=\"bait\"\n   onclick=\"console.log(event.type\
    \ +\n                        event.target.id);\">\n```\n\n### 4.4.12 Bubbling\n\
    \nWhen an event happens on an element, the element can either handle it or ignore\
    \ it. Either way, the element’s *parent element* then gets a chance to handle\
    \ the event, then the parent’s parent, and so on, all the way up to the root (the\
    \ global object). This process is called ***bubbling***, and is generally desirable.\n\
    \nFor example, if a button is clicked, and the button is in a form, and the form\
    \ is in a document, and the document is in a window, any or all of these elements\
    \ can do something in response to the button click.\n\n*   `event.target` is the\
    \ most deeply nested element, and the one that first has a chance to respond.\n\
    \n*   `event.currentTarget` is the one currently handling the event (it is equal\
    \ to `this`).\n\n*   `event.stopPropagation()` stops any further bubbling. Not\
    \ generally recommended.\n\n*   `event.preventDefault()` prevents default actions\
    \ from occurring, such as form submission or following a link.\n\n## 4.5 Using\
    \ the DOM\n\n### 4.5.1 The Window Object\n\nIt is easy to think of `document`\
    \ as the root of the HTML tree. In a browser, `document` is actually a child of\
    \ another node, `window`. It is not necessary to say `window.document`, because\
    \ `window` is assumed by default.\n\nThe `window` object is an indexable collection\
    \ of ***frames*** or ***iframes***; it is of zero length if these features are\
    \ not used.\n\nWindows, like documents, have properties and methods.\n\n#### 4.5.1.1\
    \ Window Properties\n\nHere are some of the properties of a `Window` object. With\
    \ the exception of `location`, all of these properties are read only.\n\n*   `window`\
    \ — A self-reference to the current window (not usually needed). Programmer-defined\
    \ global variables are actually properties of this object.\n\n*   `self`, `frames`,\
    \ `globalThis` — On the web, these are all the same as `window`.\n\n*   `length`\
    \ — The number of frames contained in this window.\n\n*   `parent` — If in a frame,\
    \ the immediately enclosing window.\n\n*   `document` — The HTML document being\
    \ displayed in this window.\n\n*   `top` — If in a frame, the outermost enclosing\
    \ window.\n\n*   `location` — The URL of the document being displayed in this\
    \ window. If you set this property to a new URL, that URL will be loaded into\
    \ this window. Calling `location.reload()` will refresh the window.\n\n*   `navigator`\
    \ — A reference to the browser object. Some properties of `navigator` are:\n\n\
    \    *   `appName` — the name of the browser, such as `Netscape`.\n\n    *   `platform`\
    \ — the computer running the browser, such as `Win32` or `MacIntel`.\n\n    *\
    \   `userAgent` — A detailed description of the platform.\n\n#### 4.5.1.2 Window\
    \ Methods\n\nHere are some of the available methods on windows.\n\n*   `alert(`***string***`)`\
    \ — Displays an alert dialog box containing the string and an OK button.\n\n*\
    \   `confirm(`***string***`)` — Displays a confirmation box containing the string\
    \ along with Cancel and OK buttons. Returns `true` if OK is pressed, `false` if\
    \ Cancel is pressed.\n\n*   `prompt(`***string***`)` — Displays a prompt box containing\
    \ the string, a text field, and Cancel and OK buttons. Returns the string entered\
    \ by the user if OK is pressed, `null` if Cancel is pressed.\n\n*   ***window***\
    \ `= open(`***URL***`)` — Opens a new window containing the document specified\
    \ by the URL.\n\n*   ***window***`.close()` — Closes the given window, but only\
    \ if it was opened by `open`.\n\n*   ***timeoutId*** = `setTimeout(`***function***`,`\
    \ ***delay***`,` ***arg1***`,` ***…***`,` ***argN***`)` — Sets a timer to call\
    \ the ***function*** with optional arguments ***arg1*** through ***argN*** after\
    \ ***delay*** milliseconds. Returns a numeric ***timeoutId***.\n\n*   `clearTimeout(`***timeoutId***`)`\
    \ — Cancels a pending timeout started by `setTimeout`.\n\n*   ***intervalId***\
    \ `= setInterval(`***code***`,` ***interval***`)` — Sets a timer to execute the\
    \ ***code*** (which may be a function or a string) every ***interval*** milliseconds.\
    \ Returns a numeric ***intervalId***.\n\n*   `clearTimeout(`***intervalId***`)`\
    \ — Cancels the periodic execution of code started by `setInterval`. This is the\
    \ same method as the one above to clear a timeout id."
