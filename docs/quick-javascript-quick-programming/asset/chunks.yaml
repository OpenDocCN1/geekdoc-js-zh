    \ `x = x++` does nothing. As complete statements, `x += 1` is at least as clear\
    \ as `x++` and doesn’t require that many more keystrokes.\n\nThe ***bitwise operators***\
    \ (`&`, `|`, `^`, `~`, `>>`, `>>>`, `<<`) convert their operands to 32-bit integers—a\
    \ data type that JavaScript supposedly does not have—perform the operation, and\
    \ convert back. This works, but is slow.\n\nThe reader may have noticed that the\
    \ comparison operators `==` and `!=` are in both the “good” and the “bad” tables.\
    \ It is fine to use these operators with values of the same type. If the operands\
    \ of `==` or `!=` are of different types, JavaScript first tries to convert them\
    \ to the same type. In most cases this works, but the rules are complex and confusing.\
    \ The operators `===` and `!==` do no type conversion, so values of different\
    \ types are unequal.\n\n## 3.10 Functions\n\n### 3.10.1 Defining Functions\n\n\
    JavaScript provides several ways to define functions. As an example, the function\
    \ `square` may be defined in any of these ways:\n\n*   `function square(x) { return\
    \ x * x; }`\n\n    *   This is a ***function statement***.\n\n*   `let square\
    \ = new Function(\"x\", \"return x * x\");`\n\n    *   This uses the `Function()`\
    \ ***constructor***. The arguments to the function are given as strings, and the\
    \ final string is the function body.\n\n*   `let square = function(x) { return\
    \ x * x; }`\n\n    *   The part following the equals sign is a ***function literal***.\n\
    \n*   `let square = function sqr(x) { return x * x; }`"
