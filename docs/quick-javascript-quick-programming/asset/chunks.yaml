    \ love to hear from you!\n\n# Preface\n\nIf you are a programmer who wants to\
    \ get started programming in JavaScript as quickly as possible, this book is for\
    \ you.\n\nIf you are hoping to learn JavaScript as your first programming language,\
    \ this book is **not** for you.\n\nIf you want a comprehensive encyclopedia of\
    \ JavaScript, this book is **not** for you. For that, let me recommend the excellent\
    \ *JavaScript: The Definitive Guide* (David Flanagan, O’Reilly).\n\n# Versions\
    \ of JavaScript\n\nJavaScript is an evolving language. It is defined by a series\
    \ of standards known as ***ECMAScript*** by Ecma International.\n\nAs a language,\
    \ JavaScript looks much like Java or C++. Unlike these languages, the original\
    \ version of JavaScript is widely regarded as a hastily written, poorly designed\
    \ language. Because of this perception, other languages have been written for\
    \ use on HTML pages (CoffeeScript, Dart, etc.), but these must be compiled to\
    \ JavaScript in order to be used by browsers. JavaScript is the only language\
    \ understood by browsers.\n\nIn order to make significant changes to the JavaScript\
    \ language without breaking existing programs, ECMAScript 2015 introduced ***strict\
    \ mode***. Strict mode eliminates or modifies the worst parts of JavaScript. All\
    \ new programming should be done in strict mode.\n\nTo invoke strict mode for\
    \ an entire program, put \"use strict\"; (complete with quotes) at the first line\
    \ of a program. To invoke strict mode for a single function, put that string as\
    \ the first line inside the function.\n\nThe primary use of JavaScript is to add\
    \ interactivity to web pages. Web pages are written in ***HTML***, ***HyperText\
    \ Markup Language***. This book is not about HTML, but it does cover the minimum\
    \ necessary.\n\nWhen running in a browser, JavaScript cannot do arbitrary file\
    \ I/O, nor can it communicate with web servers other than the one from which it\
    \ came. This is necessary for security; you do not want web pages to access your\
    \ files without your knowledge. Other environments, such as IDEs, may allow these\
    \ operations.\n\n# Chapter 1 Introduction\n\nDOI: [10.1201/9781003359609-1](https://dx.doi.org/10.1201/9781003359609-1)\n\
    \n## 1.1 Hello, World!\n\nTraditionally, the first program to be written in a\
    \ new language is one that prints out “Hello, World!” We will follow that tradition.\n\
    \nThe one line of JavaScript needed is:\n\n```\n alert(\"Hello, World!\");\n```\n\
    \nTo execute this code, we have several options.\n\n*   Put it in a web page and\
    \ run it in a browser.\n\n*   Run it in an ***IDE*** (***Integrated Development\
    \ Environment***).\n\n*   Run it from an editor application.\n\n*   Run it from\
    \ an online JavaScript editor.\n\n## 1.2 JavaScript in the Browser\n\nIf you save\
    \ the following text in a file and then open the file in a browser, an alert dialog\
    \ containing the text “`Hello, World!`” will appear.\n\n```\n <!DOCTYPE html>\n\
    \   <html>\n    <head>\n     <title>Using JavaScript</title>\n    </head>\n  \
    \  <body>\n     <script>\n      alert(\"Hello, World!\");\n     </script>\n  \
    \  </body>\n   </html>\n```\n\n*   The `<!DOCTYPE html>` tag says that this is\
    \ an HTML document.\n\n*   The entire page is enclosed in the “container” `<html>`\
    \ down to `</html>`. Tags beginning with “`</`” denote the end of a container.\
    \ In this example, only the `!DOCTYPE` tag is not a container.\n\n*   The `<title>`\
    \ tag contains the text that will be displayed in the header bar of the page.\n\
    \n*   The HTML document is divided into two parts: The `<head>` contains assorted\
    \ information that is not displayed and the `<body>` contains the part that is\
