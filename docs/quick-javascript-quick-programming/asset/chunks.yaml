- fmt: "\n*   This is a **named function literal**. The scope of the name `sqr` is\
    \ the function block, so it is available **only** within the function body, where\
    \ it can be used to invoke the function recursively.\n\n```javascriptlet square\
    \ = (x) => x * x;\n```\n\n*   This is an **arrow function**. If there is only\
    \ one parameter, the parentheses may be omitted. The single expression after the\
    \ arrow is the result.\n\n```javascript\nlet square = (x) => { return x * x; }\n\
    ```\n\n*   This is another **arrow function**, showing that braces may be used,\
    \ in which case the `return` statement is needed.\n\nAll functions have a `name`\
    \ property.\n\n*   If the function is created using the `Function` constructor,\
    \ the name is `\"anonymous\"`.\n*   If a name immediately follows the word `function`,\
    \ that is the name of the function.\n*   If an unnamed function is immediately\
    \ assigned to a variable, that variable becomes the name of the function.\n* \
    \  Otherwise, the name of the function is the empty string.\n\nFunction statements\
    \ may be defined within other functions, but they should be at the top level of\
    \ the function, not within another statement such as a loop or if statement. Such\
    \ functions are local to the enclosing function:\n\n```javascript\n function hypotenuse(x,\
    \ y) {\n    function square(x) { return x * x }\n    return Math.sqrt(square(x)\
    \ + square(y));\n   }\n```\n\nPrimitive values (`number`, `string`, `boolean`)\
    \ are passed to a function **by value**; objects are passed **by reference**.\
    \ What this means is that functions receive a copy of primitive values, so there\
    \ is nothing that can be done to them that will be seen by calling program. For\
    \ objects, functions receive a reference to the actual object; any changes made\
    \ to the interior of the object will be seen by the calling program.\n\nIn other\
    \ words, changing the value of a parameter within a function does not change the\
    \ value outside the function, but changing the properties of an object passed\
    \ as a parameter does change their values outside the function.\n\n### 3.10.2\
    \ Parameters and Arguments\n\nWe use the following terminology: A **parameter**\
    \ is a variable in the head of a function definition; an **argument** is an expression\
    \ in a call to that function.\n\nJavaScript does not require that a function be\
    \ called with the same number of arguments as it has parameters. Excess arguments\
    \ are ignored, while missing arguments have the value `undefined`.\n\nIn a function,\
    \ the special variable `arguments` is an array-like object that holds **all**\
    \ the arguments the function was called with, regardless of how many parameters\
    \ were used in the function definition. It can be indexed like an array, or looped\
    \ over with `for` loops, but lacks most of the other capabilities of an array.\
    \ The `arguments` variable is used mostly in older code; it isn’t allowed in strict\
    \ mode. Modern code is more likely to use rest parameters (see below).\n\nParameters\
    \ may be given default values; if the argument is missing, the default value is\
    \ used. Default values have the form of assignments, and previous parameters may\
    \ be used in the expression. For example:\n\n```javascript\n function foo(a, b\
    \ = 10, c = a * b) {\n    return a + b + c;\n   }\n   console.log(foo(3)); //\
    \ result is 43\n```\n\nBecause arguments are matched to parameters by position\
    \ (first argument goes to first parameter, etc.), all parameters without default\
    \ values must precede all parameters with default values.\n\nA **rest parameter**\
    \ is a parameter that collects all the remaining arguments into an array. A rest\
    \ parameter is designated by preceding it with three dots (`...`). For example,\
    \ if a function is defined with:\n\n```javascript\n function foo(x, y, ...z) {\n\
    \    console.log(`x is ${x}`);\n    console.log(`y is ${y}`);\n    console.log(`z\
    \ is ${z}`);\n   }\n```\n\nand called with:\n\n```javascript\n foo(1, 2, 3, 4,\
    \ 5);\n```\n\nthen the following is written to the console:\n\n```\n \"x is 1\"\
    \n \"y is 2\"\n \"z is 3,4,5\"\n```\n\nSince the `...` collects all the remaining\
    \ arguments, it can only be used as the last parameter.\n\nThe dots can also be\
    \ used in reverse, in the arguments to a function. When placed before an array\
    \ in a function call, the values in the array are separated into individual arguments.\
    \ This is useful for functions that take an arbitrary number of arguments.\n\n\
    ```javascript\n let ary = [2, 7, 1, 3];\n let m = Math.max(...ary);\n```\n\nUsed\
    \ in this way, the dots are called a **spread**. Spreads can also be applied to\
    \ sets and maps.\n\nSpreads can be used to make shallow copies of arrays.\n\n\
    ```javascript\n let ary2 = [...ary];\n```\n\n### 3.10.3 Functions Are Data\n\n\
    The name of a function, not followed by an argument list, refers to the function\
    \ itself. Functions may be assigned to variables:\n\n```javascript\n function\
    \ square(x) {\n    return x * x;\n   }\n\n   let square2 = square;\n   let result\
    \ = square2(5); // 25\n\n   let myArray = new Array();\n   myArray[10] = square;\n\
    \   result = myArray[10](7); // 49\n```\n\nFunctions can be printed. The call\
    \ `square.toString()` will return a listing of the function, much as it appears\
    \ above.\n\nFunctions may be assigned to properties. A function assigned to a\
    \ property is called a **method**. Within a method, `this` refers to the object.\n\
    \n### 3.10.4 Functions Are Objects\n\nThe name of a function, not followed by\
    \ an argument list, refers to the function itself. Functions may be assigned to\
    \ variables: (see above).\n\nFunctions can be printed. The call `square.toString()`\
    \ will return a listing of the function, much as it appears above.\n\nFunctions\
    \ may be assigned to properties. A function assigned to a property is called a\
    \ **method**. Within a method, `this` refers to the object.\n\n### 3.10.5 Function\
    \ Methods\n\nA **method** is a function that belongs to an object. But functions\
    \ themselves are objects, and have methods. Consider:\n\n```javascript\n let car\
    \ = { make: \"Subaru\", year: 2018,\n     age(now) { return now - this.year; }\
    \ };\n   let fn = car.age;\n```\n\nAt this point `fn` is a function, specifically\
    \ the function `age() {return now - this.year}`. It is no longer attached to an\
    \ object, therefore it is no longer a method.\n"
