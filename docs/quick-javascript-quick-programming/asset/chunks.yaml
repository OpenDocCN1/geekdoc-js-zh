    para\");\n    e.innerHTML = str;\n   }\n\n   function google(str) {\n    console.log(window);\n\
    \    win2 = window.location =\n     \"<uri>https://google.com</uri>\" + \"?q=\"\
    \ + str;\n   }\n\n   function googleIt() {\n    display(\"Going to Google in 5\
    \ seconds.\");\n    let term =\n     document.getElementById(\"search\").value;\n\
    \    timer = setTimeout(google, 5000, term);\n   }\n\n   function cancel() {\n\
    \    display(\"\");\n    clearTimeout(timer);\n   }\n```\n\n并且在 `<body>` 中：\n\n\
    ```\n <button onclick=\"googleIt()\">Google</button>\n   <input type=\"text\"\
    \ id=\"search\">\n   <button onclick=\"cancel()\">Cancel</button>\n   <br>\n \
    \  <p id=\"para\"></p>\n```\n\n当 HTML 页面加载时，它会显示一个标记为 `Google` 的按钮、一个文本字段以及另一个标记为\
    \ `Cancel` 的按钮。\n\n当点击第一个按钮时，它会调用 `googleIt()` 函数。该函数调用 `display` 来寻找 id 为 `para`\
    \ 的 `Element`（该段落最初是为空的），并将其内容设置为“Going to Google in 5 seconds.”的文本。然后，`googleIt()`\
    \ 函数找到 id 为 `search` 的文本字段，并将其文本获取到名为 `term` 的变量中。最后，`googleIt` 会设置一个定时器，在 5 秒后（5000\
    \ 毫秒后）使用参数 `term` 调用 `google` 函数。\n\n> **注意**：只有在浏览器允许的情况下，此操作才会生效，这取决于浏览器的设置。\n\
    \n如果在五秒内点击了 `Cancel` 按钮，`cancel` 方法将擦除 id 为 `para` 的段落中的文本，然后取消定时器（其 id 已保存在全局变量\
    \ `timer` 中）。因此，定时器事件不会发生，`google()` 也不会被调用。\n\n如果没有点击 `Cancel` 按钮，`google` 函数将尝试打开浏览器标签页访问\
    \ [google.com](https://google.com)，并将搜索词作为参数传递传递，并将窗口 id 保存到名为 `win2` 的全局变量中。\n\
    \n> **注意**：附加在 URL 后的 `?` 以 `name`=`value` 键对的形式向服务器提供。多个 `name`=`value` 对通过 ampersands\
    \ (`&`）分隔。Google 识别的名称中，包括 `q` 表示“query”（查询）。\n\n### 4.5.2 Document 对象\n\n`document`\
    \ 代表一个 HTML 页面。\n\n名称 `window` 指向显示 HTML 的窗口；`window.document` 指向窗口中的 HTML（或更准确地说，是代表该\
    \ HTML 的 `Node` 树）。文档属性和方法必须以 `document.` 为前缀。\n\n构造函数 `new Document()` 将返回一个新的\
    \ HTML 页面，包含一个空的 head 和 body。\n\n#### 4.5.2.1 文档属性\n\n以下是 `document` 的一些属性：\n\n\
