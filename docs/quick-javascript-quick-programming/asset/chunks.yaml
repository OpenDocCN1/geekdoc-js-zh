    \ that will call the `google` function with the argument `term` after 5 seconds\
    \ (5000 milliseconds).\n\n> **Note**: This will only work if the browser permits\
    \ it, which depends on the browser’s settings.\n\nIf the `Cancel` button is clicked\
    \ within five seconds, the `cancel` method will erase the text in the paragraph\
    \ whose `id` is `\"para\"`, then cancel the timer (whose id has been saved in\
    \ the global variable `timer`). Consequently, the timer event will not occur,\
    \ and `google()` will not be called.\n\nIf the `Cancel` button is not clicked,\
    \ the `google` function will try to open a browser tab to [google.com](https://google.com),\
    \ with the search term passed to it as an argument, and will save the window id\
    \ in a global variable named `win2`.\n\n> **Note**: The `?` appended to the URL\
    \ provides information to the server as ***name***`=`***value*** pairs. Multiple\
    \ ***name***`=`***value*** pairs are separated by ampersands (`&`). Google recognizes,\
    \ among other names, `q` for “query.”\n\n### 4.5.2 The Document Object\n\nA ***document***\
    \ represents an HTML page.\n\nThe name `window` refers to the window displaying\
    \ the HTML; `window.document` refers to the HTML in that window (or more accurately,\
    \ the tree of `Node`s representing that HTML). Document properties and methods\
    \ must be prefixed by `document.`.\n\nThe constructor `new Document()` will return\
    \ a new HTML page, complete with an empty head and body.\n\n#### 4.5.2.1 Document\
    \ Properties\n\nHere are a few of the properties of `document`:\n\n*   `document.documentElement`\
    \ — An `HTMLHtmlElement` whose `innerHTML` is the text of the `<html>` tag.\n\n\
    *   `document.head` — An `HTMLHeadElement` whose `innerHTML` is the text in the\
    \ document’s `<head>`.\n\n*   `document.body` — An `HTMLBodyElement` whose `innerHTML`\
    \ is the text in the document’s `<body>`.\n\n*   `document.title` — The document’s\
    \ title, as a string.\n\n*   `document.URL` — The document’s read-only URL as\
    \ a string, including the protocol (such as `http://`).\n\n*   `document.bgColor`\
    \ — The background color of the document; may be changed by assignment. The assigned\
    \ value should be a string such as `\"red\"`, `\"#ff0000\"`, or `\"ff0000\"`,\
    \ not a JavaScript-style hexadecimal number.\n\n*   `document.fgColor` — The foreground\
    \ (text) color of the document, assignable in the same way as `bgColor`.\n\nThe\
    \ purpose of HTML has always been to describe the *structure* of a document, but\
    \ from the beginning it had a number of features to control style. Modern HTML\
    \ has deprecated many of these, with style elements (colors, borders, fonts, etc.)\
    \ being described instead by ***CSS***, ***Cascading Style Sheets***. There are\
    \ a huge number of style attributes; below is a brief sampling.\n\n```\n document.body.style.backgroundColor\
    \ = \"#EEEEEE\"\n document.body.style.color = \"#999999\"\n document.body.style.border\
    \ = \"thick solid #0000FF\";\n document.body.style.borderColor = \"#00ff00\";\n\
    \ document.body.style.fontFamily = \"Courier New, Impact\"\n document.body.style.fontSize\
    \ = \"24pt\"\n```\n\nIn order, these (1) set the background color to light gray,\
    \ (2) set the text color to a hard-to-read dark gray, (3) set the border around\
    \ the entire document to a thick blue line, (4) change the border color to green,\
    \ (5) set the font to Courier New if available, or Impact if Courier New is not\
    \ available, and (6) set the font size to 24 points.\n\n> **Note**: In JavaScript,\
    \ a hex number is written as `0x`***digits*** or `0X`***digits***. In HTML, a\
    \ hex number is written as the string `#`***digits***. Allowable digits are `0`\
    \ to `9` and `A` to `F` (or `a` to `f`).\n\nThe above examples used `document.body`,\
    \ but any selectable `Element` can be used. Again, the use of CSS is preferred.\n\
    \n#### 4.5.2.2 Finding Nodes\n\nTo manipulate the DOM, it is necessary to be able\
    \ to find specific elements. For example, a button click may need to find, read,\
    \ and use the contents of a particular text field. There are several ways this\
    \ can be done.\n\n*   `document.getElementById(`***id***`)` — Returns the `Element`\
    \ with the property `id=\"`***id***`\"`. Ids must be unique within the page.\n\
    \n*   `document.getElementsByTagName(`***tagName***`)` — Returns a live collection\
    \ of all the `Elements` with the given ***tagName***.\n\n*   `document.getElementsByClassName(`***className***`)`\
    \ — Returns an HTMLCollection of all the `Element`s that have the property `class=\"\
    `***className***`\"`.\n\n> **Note**: The `class` attribute of an HTML tag is used\
    \ to apply a named CSS style to the HTML element.\n\n*   `document.querySelector(`***selector***`)`\
    \ — Returns the first element within the `document` that is matched by the CSS\
    \ ***selector***. The ***selector*** is given as a string.\n\n*   `document.querySelectorAll(`***selector***`)`\
    \ — Returns all elements within the `document` that are matched by the CSS ***selector***.\
    \ The ***selector*** is given as a string.\n\nSome selectors are:\n\n*   ***tagName***\
    \ — To select all elements with the given ***tagName***.\n\n*   `#`***id*** —\
    \ To select the one specific element with the given ***id***.\n\n*   `.`***className***\
    \ — To select all elements with the attribute `class=\"`***className***`\"`. Notice\
    \ the initial period.\n\n*   ***tagName***`.`***className*** — To select all elements\
    \ that have the given ***tagName*** and also have the attribute `class=\"`***className***`\"\
    `.\n\n*   `*` — To select all elements.\n\n*   ***selector1***`,` ***selector2***\
    \ — To select all elements of type ***selector1*** and all elements of type ***selector2***.\n\
    \n*   ***selector1*** `>` ***selector2*** — To select all elements of type ***selector2***\
    \ that are children of elements selected by ***selector1***.\n\n*   ***selector1\
    \ selector2*** — To select all elements of type ***selector2*** that are descendants\
    \ (children, children of children, etc.) of elements selected by ***selector1***.\n\
    \n*   ***selector1*** `~` ***tagName2*** — To select all elements of type ***selector2***\
    \ that are subsequent (later) siblings of ***selector1*** elements.\n\n*   ***selector1***\
    \ `+` ***selector2*** — To select each element of type ***selector2*** that immediately\
    \ follows (is the next sibling of) ***selector1*** elements.\n\nSome properties\
    \ are returned as an `HTMLCollection` (list) of the corresponding elements. Individual\
    \ elements can be accessed with brackets or with the `index` function, for example,\
    \ `document.forms[0]` or `document.forms.item(0)`.\n\n*   `document.embeds` —\
    \ A list of the `<object>` elements."
