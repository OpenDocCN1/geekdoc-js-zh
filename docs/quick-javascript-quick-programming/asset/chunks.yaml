  trans: "\n算术比较运算符也可以用于字符串，从而提供字典顺序排序。所有大写字母都在所有小写字母之前，因此 `\"Cat\" < \"cat\"`。\n\n\
    ### 赋值：\n\n- `=`: ***赋值运算符***——可以用作表达式；该表达式的值就是被赋值的值。\n\nJavaScript 还有 `+` 和 `-`\
    \ 一元运算符。当 `+` 运算符应用于非数值值（如字符串）时，它会尝试将该值转换为数字，如果无法转换，则返回 `NaN`（即“不是数字”）。\n\n- `?:`:\
    \ ***三元运算符***：在表达式 `test` `?` `valueIfTrue`:`valueIfFalse` 中，`test` 决定了使用随后的两个值中的哪一个。\n\
    \n如果你熟悉 Java，那么大多数 Java 运算符也可以在 JavaScript 中使用，包括所有的位操作符。位操作符会将操作数转换为整数，在整数上执行操作，并将结果转换回（浮点）数。\n\
    \n优先级顺序与大多数语言相同：首先执行一元加和减，然后是幂运算，紧接着是乘法和除法，然后是加法和减法，最后是赋值。\n\n## 2.7 等价与标识\n\n\
    `==` 和 `!=` 比较运算符尝试将操作数转换为相同类型。结果可能会令人惊讶。例如，使用 `==` 时，`123`、 `\"123\"`、`[123]`\
    \ 甚至 `[\"123\"]` 都被认为是相等。\n\n“严格”测试 `===` 和 `!==` 在值的类型不同时将认为它们不相等。除非你需要自动转换，否则应优先使用这些运算符。\n\
    \n对于对象（数组、集合等），“等价”运算符实际上是对***标识***identity）的测试。也就是说，一个对象只与它本身相等，而不等于任何其他对象。比较\
    \ `[1] == [1]` 为 `false`，因为创建了两个数组，然后对其进行比较。\n\n对象的赋值*不会*创建新对象。在执行序列 `a = [1];\
    \ b = a;` 之后，测试 `a == b` 将返回 `true`。因为 `a` 和 `b` 现在指向同一个对象的引用。通过 `a` 或 `b` 对对象进行的更改对另一个变量是可见的。\n\
    \nJavaScript 没有内置的对象等价性测试；要实现这一点，需要将对象拆解为原始组件。这需要大量的代码。`underscorejs.com` 和 `lodash.com`\
    \ 网站都提供了此类及其他用途的经过测试的大型库。\n\n## 2.8 转换\n\nJavaScript 自动执行大部分***转换***（也称为***强制类型转换***）。以下是一些可能需要注意的转换。\n\
    \n在原始值上执行的任何算术操作都会导致它们转换为数字。数字字符串将以显而的方式转换。布尔 `true` 将转换为 `1`，`null` 和 `false`\
    \ 将转换为 `0`，`undefined` 将转换为 `NaN`。\n\n> **异常**：*二元* `+` 运算符既是加法也是字符串拼接，但拼接的优先级更高；`2\
    \ + \"2\"` 是 `\"22\"`。*一元*运算符 `+` 将尝试将其操作数转换为数字，因此 `2 + +\"2\"` 是 `4`。\n\n在布尔上下文中（如\
    \ `if` 语句的条件）中的任何值，如果是 `0`、`undefined`、`null`、`NaN` 或空字符串，都将被视为 `false`。所有其他值（包括\
    \ `\"0\"`）都被视为 `true`。\n\n当数组被转换为字符串时，结果是一个由逗号分隔的值的字符串；括号会被省略。因此，多维数组很容易被误认为是一维数组。\n\
    \n## 2.9 语句\n\nJavaScript 中的许多语句与 Java 中的语句几乎相同。为了方便 Java 程序员理解，这些语句与 JavaScript\
    \ 特有的语句分开了描述的。\n\n### 2.9.1 分号\n\n每个 JavaScript 语句都应该以分号结束。如果你习惯于用 Java 或 C 语言中的某一种进行编程，请继续按照你习惯的方式使用分号。\n\
    \n虽然每个语句*应该*用分号终止，但 JavaScript 使用了一项名为 ***ASI***（***自动分号插入***）的工具，它会在某种程度上在适当的行末尾自动添加分号。如果你漏掉了几个分号可能没关系，但依赖\
    \ ASI 来为你做这一点是不明智的。\n\n当一组语句被包含在大括号 `{} ` 中时，这形成了一个***复合语句***（或***块***block）。在右括号后不需要分号。\n\
    \n如果一个语句需要跨越两行，请在第一行无法被理解为完整语句的地方将其分开。断开语句的好位置是在运算符之后或括号表达式内部。\n\n如果某行以左圆括号、左括号或算术运算符开头，它将被视为上一行的延续。如果这不是你的意图，请在上一行的末尾加上分号。\n\
    \n在同一行上分隔两个或多个语句时，需要分号。\n\n### 2.9.2 声明\n\nJavaScript 中的变量可以持有任何类型的值，因此它们的类型不是其声明的一部分。\n\
    \n- `let x;`\n- `var y = 5; // 旧样式 - 避免使用`\n- `let z = 26;`\n- `let a = 5, b =\
    \ 10, c;`\n\n重复声明变量是一个错误。\n\n### 2.9.3 函数定义\n\n***函数***（function）是一个可以被***调用***（invoked）的代码块。声明函数最常用的方法是使用这种语法：\n\
    \n```\nfunction name(args) {\n\n    statements\n\n}\n```\n\n示例定义：\n\n```\nfunction\
    \ average(x, y) {\n    let sum = x + y; // x, y 和 sum 是局部的\n    return sum / 2;\n\
    }\n```\n\n示例调用：\n\n```\nlet avg = average(5, 10); // 7.5\n```\n\n在函数体内部声明的任何变量都是函数的局部变量。参数也是函数的局部变量。\n\
    \n函数可以访问全局变量。函数定义会被***提升***（hoisted）。这仅意味着所有函数定义在执行任何其他代码之前被处理，因此它们不需要在词法顺序上必须在调用之前出现。\n\
    \n### 2.9.4 熟悉语句\n\nJavaScript 中的许多语句与 Java 和 C++ 中的语句相同。如果你熟悉其中某一种语言，可以随意跳过到*JavaScript\
    \ 特有的语句*。 \n\n> **注意 1**：虽然传统的 `for` 语句是相同的，但其***初始化***部分自然会使用 `let` 而不是控制变量的类型。\n\
    \n> **注意 2**：`switch` 语句允许每个 `case` 指定一个表达式，而不仅仅是常量值。\n\n以下是相同的语句列表：\n\n```\n\
    \ • variable = expression;\n    • expression;\n    • { statements }\n    • if\
    \ (condition) {\n        statements\n      }\n    • if (condition) {\n       \
    \ statements\n      } else {\n        statements\n      }\n    • while (condition)\
    \ {\n        statements\n      }\n    • for (initialization; condition; update)\
    \ {\n        statements\n      }\n    • do {\n        statements\n      } while\
    \ (condition)\n    • switch (expression) {\n         case expression:\n      \
    \       statements;\n              break;\n          case expression:\n\t    \
    \  statements;\n\t      break;\n            …\n            default:\n        \
    \        statements;\n       }\n    • label: statement;\n    • break;\n    • break\
    \ label;\n    • continue;\n    • continue label;\n    • return value;\n    • return;\n\
    \    •; // 空语句\n```\n\n#### 2.9.4.1 赋值语句\n\n***赋值语句***给变量赋一个值。例如，\n\n`x = 5;`\
    \ 给 `x` 赋值 `5`。\n\n"
- fmt: "\nThe value of a variable may be changed. For example, the assignment statement\n\
    \n```\nx = \"abc\";\n```\n\nwill give `x` the new value `\"abc\"`.\n\nFor each\
    \ arithmetic operator `op`, the expression\n\n```\nvariable op= expression;\n\
    ```\n\nis shorthand for\n\n```\nvariable = variable op expression;\n```\n\nFor\
    \ example, `x += 1;` adds `1` to `x`.\n\n### 2.9.4.2 Expressions\n\nAny expression\
    \ can be used as a statement; the value of the expression, if any, is discarded.\n\
    \nExpressions are allowed to act as statements because they can have side effects.\
    \ For example, if `a` is an array, `a.sort()` sorts the array.\n\nExpressions\
    \ that return a result but do not have side effects can be used as statements,\
    \ but they don’t do anything. For example, using `2+2` as a statement is legal\
    \ but useless.\n\nThis can lead to errors. If `str` is the string `\"Hello\"`,\
    \ the expression `str.toUpperCase()` returns the string `\"HELLO\"`, and this\
    \ can be assigned to a variable, but using `str.toUpperCase()` as a statement\
    \ does nothing.\n\n### 2.9.4.3 Compound Statements\n\nA `compound statement`,\
    \ or `block`, is some number (possibly zero) of declarations and statements, enclosed\
    \ in braces, `{}`. A compound statement is itself considered to be a statement.\n\
    \nControl statements, such as `if` statements and loops, control the execution\
    \ of a single statement. If you want to control more than just one statement,\
    \ you must enclose those statements in braces to make them into a (single) compound\
    \ statement.\n\nThe body of a function or method must always be a compound statement.\
    \ (Exception: “arrow” functions, to be discussed later.)\n\nGood style dictates\
    \ that statements within a block be indented relative to the start of the block.\
    \ The usual indentation for JavaScript is two spaces.\n\n### 2.9.4.4 If Statements\n\
    \nAn `if statement` tests a condition. If the condition is true, the following\
    \ statement (typically, a compound statement) is executed. If the condition is\
    \ not true, the `if` statement does nothing. The syntax is:\n\n```\nif (condition)\
    \ {\n  statements\n}\n```\n\nFor example, the following `if` statement resets\
    \ `x` to zero if it has become negative.\n\n```\nif (x < 0) {\n    x = 0;\n}\n\
    ```\n\nAn `if` statement may also have an `else` clause. If the condition is true,\
    \ the statement following the condition is executed. If the condition is not true,\
    \ the statement following the word `else` is executed. Both statements are typically\
    \ compound statements. The syntax is:\n\n```\nif (condition) { \n   some statements\n\
    }\nelse {\n   some other statements\n}\n```\n\nFor example,\n\n```\nif (x % 2\
    \ == 0) {\n    x = x / 2;\n}\nelse {\n    x = 3 * x + 1;\n}\n```\n\nIf either\
    \ part contains only a single (non-compound) statement, the braces may be omitted.\
    \ In this case, it is good style to put the single statement on the same line\
    \ as the `if` or the `else`.\n\n```\nif (x % 2 == 0) x = x / 2;\nelse x = 3 *\
    \ x + 1;\n```\n\n### 2.9.4.5 While Loops\n\nA `while loop` is a loop with the\
    \ test at the top. The syntax is:\n\n```\nwhile (condition) {\n   statements\n\
    }\n```\n\nFirst, the `condition` is tested; if it is false, nothing more is done,\
    \ and the loop exits without ever executing the `statements`. If the `condition`\
    \ is true, the `statements` are executed, then the entire loop (starting with\
    \ the test) is executed again.\n\nFor example, the approximate common log (that\
    \ is, log base ten) of a number `x` can be computed by:\n\n```\nlet log = 0;\n\
    while (x > 1) {\n    x = x / 10;\n    log = log + 1;\n}\n```\n\nThe braces indicate\
    \ a block of statements. If there is only one statement, the braces may be omitted;\
    \ however, it is good style to always include the braces.\n\nNormally, the statements\
    \ controlled by the loop must affect the condition being tested. In the above\
    \ example, `x` is compared to `1`, and the controlled statements change the value\
    \ of `x`. If the controlled statements never make the condition false, then the\
    \ loop never exits, and the program “hangs” (stops responding). This is a kind\
    \ of error commonly, if inaccurately, called an `infinite loop`.\n\nTwo additional\
    \ statement types, `break` and `continue`, can also control the behavior of `while`\
    \ loops. These statements can be used with statement labels.\n\n### 2.9.4.6 Do-While\
    \ Loops\n\nA `do-while loop` is a loop with the test at the bottom, rather than\
    \ the more usual test at the top. The syntax is:\n\n```\ndo {\n  statements\n\
    } while (condition);\n```\n\nFirst, the `statements` are executed, then the `condition`\
    \ is tested; if it is true, then the entire loop is executed again. The loop exits\
    \ when the `condition` gives a false result.\n\nThis kind of loop is most often\
    \ used when the test doesn’t make any sense until the loop body has been executed\
    \ at least once. For most purposes, the `while` loop is preferable.\n\nFor example,\
    \ suppose you want to choose a random number between `0` and `1`.\n\n```\ndo {\n\
    \  x = Math.random();\n} while (x <= 0.5);\n```\n\n### 2.9.4.7 Traditional For\
    \ Loops\n\nA `for loop` is a loop with the test at the top. The syntax is:\n\n\
    ```\nfor (initialization; condition; update) {\n   statements\n}\n```\n\nThe `initialization`\
    \ is performed first, and only once. After that, the `condition` is tested and,\
    \ if true, the `statements` are executed and the `update` is performed; then control\
    \ returns to the `condition`. In other words, the `for` loop behaves almost like\
    \ the following `while` loop:\n\n```\ninitialization;\nwhile (condition) {\n \
    \   statements;\n    update;\n}\n```\n\nThe `initialization` may have one of the\
    \ following forms:\n\n*   Assignment to a variable, for example `i = 0` or `let\
    \ i = 0`.\n*   Assignment to more than one variable, separated by commas, for\
    \ example `let i = 0, j = 0;` (this form is rarely used).\n\nThe word `let`, if\
    \ used, must precede the first variable in the initialization.\n\nThe `update`\
    \ is one of:\n\n*   An expression, typically an assignment statement such as `i\
    \ += 1`. (An assignment statement is a kind of expression.)\n*   A comma-separated\
    \ list of expressions, such as `i += 1, j += 2`.\n\nThe braces indicate a block\
    \ of `statements`. If there is only one statement, the braces may be omitted;\
    \ however, it is good style to always include the braces.\n\nAs an example, an\
    \ array can be declared and its contents written out by:\n\n```\nlet ary = [3,\
    \ 1, 4, 1, 6];\nfor (let i = 0; i < ary.length; i += 1) {\n    console.log(ary[i]);\n\
    }\n```\n\n### 2.9.4.8 Scope in Loops\n\nConsider:\n\n```\nfor (let variable =\
    \ value; condition; update) { statements }\n```\n\nThe scope of `variable` is\
    \ the entire `for` statement; it is not accessible outside this statement. If\
    \ the keyword `let` is omitted, `variable` must have been declared previously;\
    \ if `let` is replaced with `var`, `variable` is global.\n"
  raw: "The value of a variable may be changed. For example, the assignment statement\n\
    \n```\n x = \"abc\";\n```\n\nwill give `x` the new value `\"abc\"`.\n\nFor each\
    \ arithmetic operator ***op***, the expression\n\n```\nvariable op= expression;\n\
    ```\n\nis shorthand for\n\n```\nvariable = variable op expression;\n```\n\nFor\
    \ example, x += 1; adds `1` to `x`.\n\n#### 2.9.4.2 Expressions\n\nAny expression\
    \ can be used as a statement; the value of the expression, if any, is discarded.\n\
    \nExpressions are allowed to act as statements because they can have side effects.\
    \ For example, if `a` is an array, `a.sort()` sorts the array.\n\nExpressions\
    \ that return a result but do not have side effects can be used as statements,\
    \ but they don’t do anything. For example, using `2+2` as a statement is legal\
    \ but useless.\n\nThis can lead to errors. If `str` is the string `\"Hello\"`,\
    \ the expression `str.toUpperCase()` returns the string `\"HELLO\"`, and this\
    \ can be assigned to a variable, but using `str.toUpperCase()` as a statement\
    \ does nothing.\n\n#### 2.9.4.3 Compound Statements\n\nA ***compound statement***,\
    \ or ***block***, is some number (possibly zero) of declarations and statements,\
    \ enclosed in braces, `{}`. A compound statement is itself considered to be a\
    \ statement.\n\nControl statements, such as `if` statements and loops, control\
    \ the execution of a single statement. If you want to control more than just one\
    \ statement, you must enclose those statements in braces to make them into a (single)\
    \ compound statement.\n\nThe body of a function or method must always be a compound\
    \ statement. (Exception: “arrow” functions, to be discussed later.)\n\nGood style\
    \ dictates that statements within a block be indented relative to the start of\
    \ the block. The usual indentation for JavaScript is two spaces.\n\n#### 2.9.4.4\
    \ If Statements\n\nAn ***if statement*** tests a condition. If the condition is\
    \ true, the following statement (typically, a compound statement) is executed.\
    \ If the condition is not true, the `if` statement does nothing. The syntax is:\n\
    \n```\nif (condition) {\n  statements\n}\n```\n\nFor example, the following `if`\
    \ statement resets `x` to zero if it has become negative.\n\n```\n if (x < 0)\
    \ {\n    x = 0;\n   }\n```\n\nAn `if` statement may also have an `else` clause.\
    \ If the condition is true, the statement following the condition is executed.\
    \ If the condition is not true, the statement following the word `else` is executed.\
    \ Both statements are typically compound statements. The syntax is:\n\n```\nif\
    \ (condition) { \n   some statements\n}\nelse {\n   some other statements\n}\n\
    ```\n\nFor example,\n\n```\n if (x % 2 == 0) {\n    x = x / 2;\n   }\n   else\
    \ {\n    x = 3 * x + 1;\n   }\n```\n\nIf either part contains only a single (non-compound)\
    \ statement, the braces may be omitted. In this case, it is good style to put\
    \ the single statement on the same line as the `if` or the `else`.\n\n```\n if\
    \ (x % 2 == 0) x = x / 2;\n else x = 3 * x + 1;\n```\n\n#### 2.9.4.5 While Loops\n\
    \nA ***while loop*** is a loop with the test at the top. The syntax is:\n\n```\n\
    while (condition) {\n   statements\n}\n```\n\nFirst, the ***condition*** is tested;\
    \ if it is false, nothing more is done, and the loop exits without ever executing\
    \ the ***statements***. If the ***condition*** is true, the ***statements*** are\
    \ executed, then the entire loop (starting with the test) is executed again.\n\
    \nFor example, the approximate common log (that is, log base ten) of a number\
    \ `x` can be computed by:\n\n```\n let log = 0;\n   while (x > 1) {\n    x = x\
    \ / 10;\n    log = log + 1;\n   }\n```\n\nThe braces indicate a block of statements.\
    \ If there is only one statement, the braces may be omitted; however, it is good\
    \ style to always include the braces.\n\nNormally, the statements controlled by\
    \ the loop must affect the condition being tested. In the above example, `x` is\
    \ compared to `1`, and the controlled statements change the value of `x`. If the\
    \ controlled statements never make the condition false, then the loop never exits,\
    \ and the program “hangs” (stops responding). This is a kind of error commonly,\
    \ if inaccurately, called an ***infinite loop***.\n\nTwo additional statement\
    \ types, `break` and `continue`, can also control the behavior of `while` loops.\
    \ These statements can be used with statement labels.\n\n#### 2.9.4.6 Do-While\
    \ Loops\n\nA ***do-while loop*** is a loop with the test at the bottom, rather\
    \ than the more usual test at the top. The syntax is:\n\n```\ndo {\n  statements\n\
    } while (condition);\n```\n\nFirst, the ***statements*** are executed, then the\
    \ ***condition*** is tested; if it is true, then the entire loop is executed again.\
    \ The loop exits when the ***condition*** gives a false result.\n\nThis kind of\
    \ loop is most often used when the test doesn’t make any sense until the loop\
    \ body has been executed at least once. For most purposes, the `while` loop is\
    \ preferable.\n\nFor example, suppose you want to choose a random number between\
    \ `0` and `1000` that is divisible by `7`. You cannot test the number until after\
    \ you have chosen it, so `do-while` is appropriate.\n\n```\n let x;\n   do {\n\
    \    x = Math.round(1000 * Math.random());\n   } while (x % 7 != 0);\n```\n\n\
    As with a `while` loop, an infinite loop will result if the exit condition is\
    \ never satisfied.\n\nThe `do-while` loop is a little harder to think about than\
    \ a `while` loop. Since we want a number that *is* divisible by `7`, the loop\
    \ has to test that the number *is not* divisible by `7`.\n\nUnlike other kinds\
    \ of control statements, the braces in a `do-while` are required, even if only\
    \ a single statement is in the loop.\n\nThe following code does *not* work:\n\n\
    ```\n do {\n    let x = Math.round(1000 * Math.random());\n   } while (x % 7 !=\
    \ 0); // error\n```\n\nVariables declared within a block are local to that block.\
    \ If the variable `x` is declared within the braces of the `do-while` loop, it\
    \ cannot be used in the condition, which lies outside of the block.\n\nTwo additional\
    \ statement types, `break` and `continue`, can also control the behavior of `do-while`\
    \ loops. These statements can be used with statement labels.\n\n#### 2.9.4.7 Traditional\
    \ For Loops\n\nA ***for loop*** is a loop with the test at the top. The syntax\
    \ is:\n\n```\nfor (initialization; condition; update) {\n statements\n}\n```\n\
    \nThe ***initialization*** is performed first, and only once. After that, the\
    \ ***condition*** is tested and, if true, the ***statements*** are executed and\
    \ the ***update*** is performed; then control returns to the ***condition***.\
    \ In other words, the `for` loop behaves almost exactly like the following `while`\
    \ loop:\n\n```\n initialization;\n while (condition) {\n    statements;\n    update;\n\
    \ }\n```\n\nThe ***initialization*** may have one of the following forms:\n\n\
    *   Assignment to a variable, for example, `i = 0` or `let i = 0`.\n\n*   Assignment\
    \ to more than one variable, separated by commas, for example `let i = 0, j =\
    \ 0;` (this form is rarely used).\n\nThe word `let`, if used, must precede the\
    \ first variable in the initialization.\n\nThe ***update*** is one of:\n\n*  \
    \ An expression, typically an assignment statement such as `i += 1`. (An assignment\
    \ statement is a kind of expression.)\n\n*   A comma-separated list of expressions,\
    \ such as `i += 1, j += 2`.\n\nThe braces indicate a block of ***statements***.\
    \ If there is only one statement, the braces may be omitted; however, it is good\
    \ style to always include the braces.\n\nAs an example, an array can be declared\
    \ and its contents written out by:\n\n```\n let ary = [3, 1, 4, 1, 6];\n   for\
    \ (let i = 0; i < ary.length; i += 1) {\n    console.log(ary[i]);\n   }\n```\n\
    \nTwo additional statement types, `break` and `continue`, can also control the\
    \ behavior of `for` loops. These statements, which will be described shortly,\
    \ can be used with statement labels.\n\n#### 2.9.4.8 Scope in Loops\n\nConsider:\n\
    \n```\nfor (let variable = value; condition; update) { statements }\n```\n\nThe\
    \ scope of ***variable*** is the entire `for` statement; it is not accessible\
    \ outside this statement. If the keyword `let` is omitted, ***variable*** must\
    \ have been declared previously; if `let` is replaced with `var`, ***variable***\
    \ is global."
