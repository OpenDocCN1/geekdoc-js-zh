    \ we will write a very simple generator that takes an argument `n` and repeatedly\
    \ cuts it in half, rounding down to the nearest integer, until `1` is returned.\n\
    \n```\n function* half(n) {\n    yield n;\n    while (n > 1) {\n     n = Math.floor(n\
    \ / 2);\n     yield n;\n    }\n   }\n```\n\nWe can use it like this:\n\n```\n\
    \ let gen = half(10);\n   for (i of gen) {\n    console.log(i);\n   }\n```\n\n\
    This will produce the values `10`, `5`, `2`, and `1`.\n\nAlternatively, we can\
    \ explicitly use the generator’s `next()` method.\n\n```\n gen = half(10);\n \
    \  let obj = gen.next();\n   while (! obj.done) {\n    console.log(obj.value);\n\
    \    obj = gen.next();\n   }\n```\n\nThis will produce the same sequence of values.\n\
    \n### 3.10.8 Iterators\n\nAn ***iterable*** is any object that can be stepped\
    \ through, one element after another. An ***iterator*** is an object that implements\
    \ a method for stepping through the elements of an iterable. Arrays, sets, maps,\
    \ and strings are all iterable objects; the `for/of` statement uses an iterator\
    \ to step through them.\n\nYou can make an iterator for objects you create. The\
    \ requirements are:\n\n*   The object must have a property whose name is the system-defined\
    \ `Symbol.iterator`.\n\n*   The value of that property must be a method named\
    \ `next`, which takes no arguments and returns an object with the fields `value`\
    \ and `done`.\n\n    *   If `done` is true, the iteration ends and `value` is\
    \ ignored.\n\nThe syntax for creating an iterator can get quite confusing. One\
    \ simplification is to define the required `next()` method as a generator, since\
    \ generators are a kind of function and return the required kind of value.\n\n\
    As an example, we define a `range` object:\n\n```\n let range = {start:10, step:\
    \ 5, end: 25};\n```\n\nNext we will add to this object an iterator that will produce\
    \ the values `start`, `start+step`, and so on, up to but not including `end`.\n\
    \n```\n range[Symbol.iterator] =\n   function* next() {\n     n = this.start;\n\
    \     while (n < this.end) {\n       yield n;\n       n += this.step;\n     }\n\
    \    };\n```\n\nand test it:\n\n```\n for (let e of range) {\n      console.log(e);\n\
    \   }\n```\n\nThis gives the correct values `10`, `15`, and `20`.\n\nNotice the\
    \ use of the word `this`. As mentioned earlier, when `this` is used in a method\
    \ (a function belonging to an object), it refers to the containing object.\n\n\
    In the above, an iterator was added to an existing object. It can also be added\
    \ when an object is created.\n\n```\n {start:12, step: 5, end: 30,\n   [Symbol.iterator]:\
    \ function* next() {…} }.\n```\n\n## 3.11 Objects\n\n### 3.11.1 Definition of\
    \ Objects\n\nJavaScript is an object-oriented language.\n\nIn JavaScript, you\
    \ can create objects without having to first define a class. This section is about\
    \ objects; classes will be covered later.\n\nAn ***object*** is a collection of\
    \ named values (called ***properties*** or ***fields***). Objects use dot notation,\
    \ as in other object-oriented languages, but they behave more like hash tables\
    \ (also called maps or dictionaries).\n\nYou can write an ***object literal***\
    \ by enclosing ***key***`:`***value*** pairs in braces. For example:\n\n```\n\
    \ let car = {make: \"Subaru\", year: 2018}\n```\n\nThis defines the object `car`\
    \ with the properties `make` and `year`. You can refer to the fields with ***dot\
    \ notation***. For example, the statement\n\n```\n console.log(car.make + \" \"\
    \ + car.year);\n```\n\nwill write `\"Subaru 2018\"` to the console. If you don’t\
    \ have a console open, you won’t see the result; in that case you may wish to\
    \ use\n\n```\n alert(car.make + \" \" + car.year);\n```\n\ninstead.\n\nWe can\
    \ add properties to an existing object:\n\n```\n car.mileage = 25041;\n```\n\n\
    or delete them:\n\n```\n delete car.mileage;\n```\n\nProperty names (the “key”\
    \ part of ***key***`:`***value***) are always either strings (which do not need\
    \ to be quoted) or symbols. It may not look that way; the following is legal:\n\
    \n```\n let nums = {2: \"two\", 3.1416: \"pi\"}\n```\n\nIn this code, the keys\
    \ are actually the *strings* `\"2\"` and `\"3.1416\"`."
