  trans: "\n\n*   对于数组，`element` 是索引以及可能分配给数组的任何属性；可以通过 `object`[`element`] 访问值。\n\
    \    *   `for/in` 循环将数组视为任何其他对象处理。它比 `for/of` 循环慢得多。\n*   对于字符串，`element` 是索引；可以通过\
    \ `object`[`element`] 访问单个字符。\n\n对象可能具有不可枚举的、“隐藏”属性，而稀疏数组可能具有“缺失”的元素。`for/in`\
    \ 循环会跳过这些。\n\n### 2.9.5.3 throw（抛出语句）\n\n程序员可以使用 `throw statement` 故意导致异常。并没有特定的“异常（Exception）”类型——任何类型的值都可以被“抛出”。\n\
    \n> **注意**：JavaScript 不区分“错误（errors）”和“异常（exceptions）”。\n\n`throw` 语句将异常“抛出”到其他地方，以免用用于处理（希望是罕见的）异常情况的代码来干扰程序的正常执行。`try/catch`\
    \ 语句的目的（在第 2.9.5.4 节中描述）是捕获抛出的异常。\n\n`throw` 语句的语法为：\n\n```\nthrow expression;\n\
    ```\n\n其中 `expression` 可以是任何类型，但通常是错误代码、错误消息，或者（如预定义异常所示）具有 `name` 和 `message`\
    \ 属性的对象。\n\n被抛出的异常会发生什么？\n\n*   如果在 `try-catch-finally` 语句的 `try` 部分发生异常，则由 `catch`\
    \ 部分处理该异常。\n*   否则，如果在一个函数中发生异常，该函数将立即返回到调用该函数的地方。执行继续，就像异常在该点被抛出一样（这可能涉及返回到嵌套函数调用中的上一个级别）。\n\
    *   否则，如果异常在顶层代码中发生，或者在异常到达顶层时仍未被处理，则由系统来采取措施。在 IDE 中，异常将报告给程序员。在浏览器中，异常可能会被忽略。\n\
    \n### 2.9.5.4 Try-catch-finally\n\n`try-catch-finally statement` 用于将错误处理代码与处理“正常”情况的代码分离。该语句的工作原理与\
    \ Java 中对应的语句完全相同，但有两个细微的语法差异。\n\n*   `try-catch-finally` 语句只能有一个 `catch` 子句。\n\
    *   `catch` 单词后的 `(`variable`)` 没有声明类型，且可以省略。\n\n更详细地说，语法如下：\n\n```\ntry {\n statements\n\
    }\ncatch (variable) {\n statements\n}\nfinally {\n statements\n}\n```\n\n可以省略\
    \ `catch` 部分或 `finally` 部分，但不能两者都省略。\n\n执行过程如下：\n\n1.  执行 `try` 块中的代码。\n    *\
    \   如果没有发生异常，则跳过 `catch` 块。\n    *   如果发生异常，控制权立即跳转到 `catch` 部分。可选的 `variable`\
    \ 持有异常提供的值；它是 `catch` 部分的局部变量。\n2.  无论是否发生异常，都会执行 `finally` 部分。\n\n例如，以下代码将弹出一个包含“I\
    \ am an exception”字字的警告框：\n\n```\n try {\n    throw \"I am an exception\";\n \
    \  }\n   catch (v) {\n    alert(v);\n   }\n```\n\n许多在其他语言中会抛出异常的情况在 JavaScript\
    \ 中不会抛出异常。特别是，算术表达式永远不会抛出异常。\n\n产生了一个小的复杂性，是因为 JavaScript 保证如果存在 `finally` 部分，它*总是*执行。如果\
    \ `try` 或 `catch` 部分的代码尝试执行 `return`、`break` 或 `continue` 语句，控制权将立即传递到 `finally`\
    \ 部分，而 `return`、`break` 或 `continue` 语句将推迟到 `finally` 部分完成后执行。\n\n`try-catch-finally`\
    \ 语句的 `catch` 或 `finally` 部分也可能发生异常。新异常将替换正在处理的异常，并被视为新异常。\n\n### 2.9.5.5 with\
    \ 语句\n\n严格模式下不允许使用 `with` 语句，但你可能会旧代码中看到它。\n\n```\nwith object {\n statements\n\
    }\n```\n\n这使用 `object` 作为变量的默认前缀；也就是说，语句内的任何变量 `var` 在任何合理的情况下都被视为 `object`.`var`。\n\
    \n## 2.10 示例：质数\n\n这是一个简单的程序，用于打印 2 到 100 的所有质数，并正确地嵌入 HTML 页面中。它可以保存为 `.html`\
    \ 扩展的文件并在浏览器中查看。\n\n```html\n <!DOCTYPE html>\n   <html\n   <title>Using JavaScript</title>\n\
    \   <head>\n   <script>\n    function isPrime(n) {\n     let divisor = 2;\n  \
    \   while (divisor * divisor <= n) {\n      if (n % divisor == 0) {\n       return\
    \ false;\n      }\n      divisor += 1;\n     }\n     return true;\n    }\n   </script>\n\
    \   </head>\n   <<body>\n   <script>\n    for (let n = 2; n <= 100; n++) {\n \
    \     if (isPrime(n)) {\n        console.log(n);\n      }\n    }\n   </script>\n\
    \   </body>\n </html>\n```\n\n## 2.11 测试\n\n### 2.11.1 Mocha 测试框架\n\n上面的 URL 很长，在书中无法单行显示，但你应该在代码中编写它们。在\
    \ `<head>` 部分中，使用以下内容加载 Mocha：\n\n```html\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/mocha/8.0.1/mocha.css\"\
    >\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/mocha/8.0.1/mocha.min.js\"\
    ></script>\n```\n\n以下是初始化 Mocha 的一种简单方法：\n\n```html\n<script>\n mocha.setup('bdd');\n\
    </script>\n```\n\n使用以下内容加载 Chai：\n\n```html\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/chai/4.2.0/chai.min.js\"\
    ></script>\n```\n\n在 body 中需要两个东西。首先，你需要以下行来指定在页面上放置测试结果的位置：\n\n```html\n<div\
    \ id=\"mocha\"></div>\n```\n\n最后一步（位于 HTML 体的底部或附近）是运行测试的代码：\n\n```html\n<script>\
    \ mocha.run(); </script>\n```\n\n### 2.11.2 使用 Chai 进行测试\n\n粗来说，Mocha 是测试框架，而\
    \ Chai 提供了实际的测试断言。如果你熟悉测试风格，Chai 支持 `assert`、`should` 和 `expect` 风格。我们将使用 `assert`\
    \ 风格。\n\n一个测试看起来如下：\n\n```javascript\ndescribe(title, function() {\n  it(\"English_description_of_what_it_does\"\
    , function() {\n    // 测试写在这里\n  });\n});\n```\n\n这里是 `chai` 对象中一些非常有用的测试。它们应该是是易于理解的。\n\
    \n*   `assert(expression)`\n*   `assert.isTrue(expression)`\n    *   与 `assert(expression)`\
    \ 相同\n*   `assert.isFalse(expression)`\n*   `assert.equal(actual, expected)`\n\
    \    *   通常 `actual` 是一个函数调用，`expected` 是函数应该返回的值。\n*   `assert.notEqual(actual,\
    \ expected)`\n*   `assert.strictEqual(actual, expected)`\n\n"
