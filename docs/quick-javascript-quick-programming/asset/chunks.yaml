    \n# 作者\n\n我是 David Matuszek，大多数学生称我为“Dave 博士”。\n\n1963 年，我在打卡片上写了我的第一个程序，并立刻就迷上了它。\n\
    \n1970 年，我作为德克萨斯大学奥斯汀分校计算机科学的研究生教了我的第一门计算机课。我最终在那里获得了博士学位，从那以后一直从事教学。诚然，我在工业界待了十多年，即使在那时，我也担任诺瓦瓦大学的兼职教师。\n\
    \n我最终离开了工业界，全职加入诺瓦瓦大学教职员工队伍了几年，然后搬到了宾夕法尼亚大学，在那里，我为从其他学科进入计算机科学的学生指导了一个硕士项目（`MCIT`，计算机与信息技术硕士）。\n\
    \n在我的职业生涯中，我的主要兴趣是人工智能（AI）和编程语言。我用过*很多*编程语言。\n\n我在 2017 年退休了，但我无法停止教学，所以我正在写一系列关于编程和编程语言的“快速入门”书籍。我还写了两本科幻小说，《冰马手》（Ice\
    \ Jockey）和《全真价值》（All True Value），我预计还会写更多。去看看它们吧！\n\n如果你觉得这本书有用，如果你能发表评论将将太棒了。评论，即使是批评性的，也有书籍销售。\n\
    \n而且，嘿，如果你是以前的学生或同事，请给 david.matuszek@gmail.com 给我封邮件。我很期待收到你的消息！\n\n# 前言\n\n\
    如果你是一个想要尽快开始学习 JavaScript 编程的程序员，这本书是为你准备的。\n\n如果你希望将 JavaScript 作为你的第一门编程语言，这本书是为你准备的。\n\
    \n# JavaScript 版本\n\nJavaScript 是一个不断演变的语言。它由一系列名为 `ECMAScript` 的标准定义。\n\n# 第一章\
    \ 引言\n\nDOI: [10.1201/9781003359609](https://dx.doi.org/10.1201/9781003359609)\n\
    \n## 1.1 Hello, World!\n\n传统上，一种新语言的第一个程序是输出“Hello, World!”我们将遵循这一传统。\n\n需要的 JavaScript\
    \ 代码是：\n\n```\nalert(\"Hello, World!\");\n```\n\n执行这段代码，我们有几种选择：\n\n*   将其放入网页中并在浏览器中运行。\n\
    *   在 `IDE`（集成开发环境）中运行。\n*   在编辑器应用程序中运行。\n*   在在线 JavaScript 编辑中运行。\n\n## 1.2\
    \ 浏览器中的 JavaScript\n\n如果你将以下文本保存在文件中并在浏览器中打开，将弹出一个包含 `Hello, World!` 文本的警告框。\n\
    \n```html\n<!DOCTYPE html>\n   <html>\n    <head>\n     <title>使用 JavaScript</title>\n\
    \    </head>\n    <body>\n     <script>\n      alert(\"Hello, World!\");\n   \
    \  </script>\n    </body>\n   </html>\n```\n\n*   `<!DOCTYPE html>` 标签表示这是一个 HTML\
    \ 文档。\n*   整个页面封装在 `<html>` 到 `</html>` 的容器中。以 `</` 开头的标签表示容器的结束。在这个例子中，只有 `!DOCTYPE`\
    \ 标签不是容器。\n*   `<title>` 标签包含显示在页面标题栏的文本。\n*   HTML 文档分为两个部分：`<head>` 包含杂项信息，<body>`\
    \ 包含显示的部分。\n*   `<script>` 标签包含 JavaScript 代码。通常，JavaScript 函数定义在 `<head>` 中的\
    \ `<script>` 标签中，并在 `<body>` 中的 `<script>` 标签或“事件处理程序”中进行调用。\n\n## 1.3 浏览器控制台\n\
    \n"
- fmt: "\nTo run JavaScript, you can use any text editor to include it in `<script>`\
    \ tags in an HTML page, and load the page into any browser.\n\nThis is not the\
    \ best way to write programs. Browsers are designed to `ignore` errors; after\
    \ all, the user doesn’t want to see them. You, on the other hand, want to see\
    \ them and correct them. For this you need to open your browser’s `console`. A\
    \ console will display error messages (among other things).\n\nTo open the console:\n\
    \n*   In most browsers: Press `F12`.\n*   In Safari (Macintosh): Go to `Preferences:\
    \ Advanced` and check `Show Develop menu in menu bar`. Once this is done, use\
    \ `cmd-opt-C` to show the console.\n\nBrowser consoles have a number of features\
    \ to assist in programming and debugging. These vary and take some time to learn;\
    \ they are not covered in this book.\n\n## 1.4 Running JavaScript\n\nThere are\
    \ several IDEs (Integrated Development Environments) that can be used for JavaScript.\
    \ [Visual Studio Code](https://code.visualstudio.com) is perhaps the most popular;\
    \ it is cross-platform and free. (Don’t confuse this with Visual Studio, which\
    \ is neither cross-platform nor free.) [NetBeans](https://netbeans.apache.org)\
    \ and [Eclipse](https://eclipseide.org) (with a suitable plugin) are other popular\
    \ IDEs.\n\nSome editors can be configured to run JavaScript on command. This can\
    \ be a convenient way to run JavaScript programs that consist of a single file.\
    \ [Sublime Text](https://www.sublimetext.com) (cross-platform) and [Notepad++](https://notepad-plus-plus.org)\
    \ (Windows and Linux) are examples.\n\nYet another alternative is to use an online\
    \ JavaScript editor. A search for “JavaScript online” will find several of these;\
    \ [jsfiddle.net](http://jsfiddle.net) is one I have used extensively. They differ\
    \ in features, but most will display both output and console. Since they run in\
    \ a browser, JavaScript code written there has limited ability to do file I/O.\n\
    \nFinally, all the major browsers have a “developer mode” so that code can be\
    \ written and tested directly in the browser.\n\n## 1.5 Getting Input\n\nThere\
    \ are two functions that will ask for input from the user:\n\n*   `result = prompt(`prompt`,\
    \ `default`)`\n    *   This displays the `prompt` in a modal dialog box, with\
    \ a place for the user to enter text. The second parameter is optional; if given,\
    \ it will be shown in the text field.\n    *   The dialog box has two buttons:\
    \ `OK`, to return the user’s entry as a string, and `Cancel`, to return `null`.\n\
    *   `result = confirm(`question`)`\n    *   This displays the `question` in a\
    \ modal dialog box with two buttons: `OK`, to return `true`, and `Cancel`, to\
    \ return `false`.\n\n## 1.6 Producing Output\n\nThere are several functions to\
    \ display the results of your code. For browser use, remember to put your function\
    \ calls inside `<script>`…`</script>` tags.\n\n*   `alert(`arg`)`\n    *   This\
    \ is the simplest way to see a result. Calling `alert` with one argument of any\
    \ type will pop up a dialog box containing the given value. There are two disadvantages:\
    \ The dialog box is modal, which means that it must be dismissed before computation\
    \ can continue; and you only get to see one message at a time.\n*   `console.log(`args`)`\n\
    \    *   If you have a console open, this method will display something on it,\
    \ but exactly what it displays is highly implementation dependent. It may display\
    \ the `args` separated by spaces or by newlines, or it may display only the first\
    \ argument. Try it to see what it does in whatever console you prefer to use.\n\
    \    *   Since `console.log` is intended primarily for debugging, most implementations\
    \ will display the actual structure of the `args`, without using the `toString`\
    \ method.\n    *   The `console` has a number of other methods, such as `clear()`\
    \ and `trace()`. Implementation varies.\n*   `document.write(`args`)`\n    * \
    \  This will write its arguments to the body of the HTML. If executed as the page\
    \ is being loaded, it writes the arguments directly in that location. But if `write`\
    \ is called after the body has been loaded (for example, from a function), the\
    \ call replaces the entire HTML body; this is probably not what you want.\n* \
    \  `document.writeln(`args`)`\n    *   This acts just like `write`, except that\
    \ the method writes a newline after the last argument. Since HTML ignores newlines,\
    \ this is fairly useless. To get a newline that isn’t ignored, write the string\
    \ `\"<br>\"`.\n\nThe advantage of the `alert` and `write` methods is that they\
    \ do not require you to have a console open in order to view results.\n\n# Chapter\
    \ 2 JavaScript The Bare Minimum\n\nDOI: [10.1201/9781003359609-2](https://dx.doi.org/10.1201/9781003359609-2)\n\
    \nThis chapter and [Chapter 3](#ch3.xhtml) describe JavaScript simply as a language,\
    \ without reference to Web programming. It is in two major parts:\n\n**The Bare\
    \ Minimum**—This section is intended to get you started programming in JavaScript\
    \ as quickly as possible. The best way to do that is to try things out.\n\n**In\
    \ More Detail**—This goes over the same material, filling in gaps.\n\n## 2.1 Comments\n\
    \n`//` introduces a comment that extends to the end of the line.\n\nMulti-line\
    \ comments start with `/*` and end with `*/`. Inside a quoted string or regular\
    \ expression, `//` and `/*` have no meaning.\n\n## 2.2 Data Types\n\n### 2.2.1\
    \ Primitives\n\nThere are eight data types:\n\n*   A `number` may be written with\
    \ or without a decimal point, but all numbers are stored as double precision floating\
    \ point.\n*   A `bigint` is an integer with an arbitrarily large number of digits.\n\
    *   The two `boolean` values are `true` and `false`.\n*   A `string` may be enclosed\
    \ in either single quotes, double quotes, or backticks (`). There is no “character”\
    \ type.\n*   A `symbol` is a value that is guaranteed to be unique; no other value\
    \ is equal to it. A symbol is created by calling `Symbol()` or `Symbol(`name`)`,\
    \ where `name` is a (not necessarily unique) value that may be helpful in debugging.\n\
    *   The `undefined` type has a single value, `undefined`. It is the value of a\
    \ variable that has been declared but not given a value.\n*   The `null` type\
    \ has a single value, `null`, meaning that the value does not exist.\n*   An `object`\
    \ is any more complicated data type. Functions, arrays, sets, maps, regular expressions,\
    \ errors, and dates are all special types of object.\n\nThe type of a value can\
    \ be determined by `typeof`, which can be used as either an operator, `typeof\
    \ x`, or as a function, `typeof(x)`. It will return, as a string, one of the type\
    \ names given above (for example, `\"number\"`).\n\nThere are two exceptions to\
    \ the above:\n\n*   The value of `typeof(null)` is `\"object\"`. This is generally\
    \ regarded as an error in the design of the language.\n*   For any type of object\
    \ except a function, `typeof` will return `\"object\"`. Applied to a function,\
    \ `typeof` will return `\"function\"`.\n\n### 2.2.2 User-Defined Objects\n\nAn\
    \ `object` is a collection of named values, called its `properties`. You can define\
    \ an object by putting `property`:`value` pairs inside braces and later refer\
    \ to the values with the syntax `object.property`. For example,\n\n```javascript\n\
    let friend = { givenName: \"Anna\",\n              surname: \"Lang\" };\nalert(\"\
    Hello, \" + friend.givenName);\n```\n\nIf the name of a property is stored in\
    \ a variable or can be computed, it can be accessed by the syntax `object[expression]`,\
    \ for example, `friend[\"given\" + \"Name\"]`.\n"
  raw: "To run JavaScript, you can use any text editor to include it in `<script>`\
    \ tags in an HTML page, and load the page into any browser.\n\nThis is not the\
    \ best way to write programs. Browsers are designed to *ignore* errors; after\
