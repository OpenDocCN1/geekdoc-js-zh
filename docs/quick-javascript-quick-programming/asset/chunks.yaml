  trans: "\n\n* `document.forms` — 所有 `<form>` 元素的列表。\n* `document.images` — 所有 `<<<img>`\
    \ 元素的列表。\n* `document.links` — 所有超链接的列表（带有 `href` 属性的 `<a>` 和 `<area>` 元素）。\n\
    * `document.scripts` — 所有 `<script>` 元素的列表。\n\n#### 4.5.2.3 创建节点\n\n你已经学习了用于查找节点的文档方法。这里是一些创建节点的方法。\n\
    \n* `document.createElement(tagName)` — 返回一个具有给定 `tagName` 的新 `Element`。\n* `document.createAttribute(name)`\
    \ — 返回一个具有给定 `name` 的新属性。稍后可以为其赋值值。\n* `document.createComment(text)` — 返回一个具有给定\
    \ `text` 的新注释节点。\n* `document.createTextNode(text)` — 返回一个具有给定 `text` 的新 `Text`\
    \ 文本节点。\n* `node.cloneNode(deep)` — 返回 `node` 的副本；如果 `deep` 为 `true`，则所有祖先节点（`node`\
    \ 的完整子树）也会被复制。\n\n一旦创建了节点，就可以使用 `Node` 方法将其添加到文档中。\n\n### 4.5.3 节点对象\n\n如前所述，HTML\
    \ 页面上的所有内容在 DOM 中都有表示，并且可以通过名为 `document` 的变量访问，该类型为 `Document`。`Document` 类是\
    \ `Node` 类的子类。`Node` 的其他子类是 `CharacterData`、`Element` 和 `Attr`。\n\n类型层次庞大且复杂。幸运的是，通常将\
    \ DOM 视为 `Node` 树就足够了，其中大部分是 `Element`。最有用的是 `document.body`，它是整个 `<body>` 子树的根。\n\
    \n#### 4.5.3.1 节点属性\n\n这里是 `Node`的一些属性：\n\n* `parentNode`、`firstChild`、`nextSibling`、`previousSibling`\
    \ 和 `lastChild` 是只读属性，允许从一个 `Node` 移动到另一个。\n* `ownerDocument` — `Node` 所属的 `Document`。\n\
    * `nodeType` 是表示节点类型的整数。共有 12 类型；`1` 代表元素，`2` 代表属性，`3` 代表文本，`9` 代表文档，以及其他几种。\n\
    * `children` — 该节点所有为 `Element` 类型的子节点的动态 `HTMLCollection`。不包含其他节点类型。\n* `childNodes`\
    \ — 该节点所有所有子节点（不分类型）的动态 `NodeList`。\n* `textContent` — `Node` 及其所有后代的完整文本，去除了\
    \ HTML 标签。换句话说，就是在屏幕上看到的无样式文本。\n\n> **注意**：替换 `Element` 的 `innerHTML` 会导致新文本被解析为\
    \ HTML，而替换其 `textContent` 则将导致新文本按原样显示。\n\n#### 4.5.3.2 节点方法\n\n节点可以添加、替换或删除。这里是\
    \ `Node` 的一些方法：\n\n* `node.before(sibs)` — 在 `node` 之前将 `sibs` 作为兄弟节点（相同节点的节点）插入。\n\
    * `node.prepend(children)` — 在任何现有子节点之前，将 `children` 作为 `node` 的子节点插入。\n* `node.append(children)`\
    \ — 在任何现有子节点之后，将 `children` 作为 `node` 的子节点插入。\n* `node.after(sibs)` — 在 `node`\
    \ 之后将 `sibs` 作为兄弟节点（相同节点的节点）插入。\n* `node.replaceWith(replacements)` — 用若干替换节点或字符串替换\
    \ `node`。\n* `node.remove()` —  `node`。\n\n在上述操作中，参数（`sibs`、`children`、`replacements`）可以是一个或多个节点或字符串。字符串将作为文本节点插入。\n\
    \n移除或替换节点也会移除或替换该节点的所有后代。\n\n### 4.5.4 元素\n\nHTML 页面中的每个标签在 DOM 树中都由一个 `Element`\
    \ 对象表示，标签中的每个属性由 DOM 中的一个 `Attribute` 对象表示。对 DOM 对象的修改会立即反映在 HTML 页面的显示上。\n\n\
    #### 4.5.4.1 元素属性\n\n这里是 `Element`的一些属性：\n\n* `element.tagName` — 标签的只读名称，全大写形式（例如\
    \ `\"HEAD\"`）。\n* `element.innerHTML` — 开始标签和结束标签之间的文本。\n* `element.outerHTML`\
    \ — 由开始标签、`innerHTML` 和结束标签组成的字符串。\n* `element.attributes` — `element` 属性的 `NamedNodeMap`（见下文）。\n\
    \n`NamedNodeMap` 是 `Attr` 对象的动态集合。（尽管名字这么说，但它是 `NamedNodeMap` 中唯一一种 `Node` 类型）。它是类数组的，但*不是*数组。它有一个\
    \ `length` 属性，并且可以像数组一样进行索引。\n\n#### 4.5.4.2 元素方法\n\n这里是 `Element` 的一些方法：\n\n\
    * `element.hasAttributes()` — 如果 `element` 具有属性则返回 `true`。\n* `element.getAttributeNames()`\
    \ — 属性名称的数组（可能为空）。\n* `element.getAttribute(name)` — 返回命名属性的值。\n* `element.setAttribute(name,\
    \ value)` — 添加或更新命名属性的值。\n* `element.removeAttribute(name)` — 移除命名属性。\n* `element.getElementsByTagName(tagName)`\
    \ — 在元素内搜索。\n* `element.getElementsByClassName(className)` — 在元素内搜索。\n* `element.querySelector(selector)`\
    \ — 返回第一个匹配元素。\n* `element.querySelectorAll(selector)` — 返回所有匹配元素。\n\nHTML 文本可以通过以下方法解析并插入\
    \ DOM：\n\n* `element.insertAdjacentHTML(where, html)` — 解析 `html` 并将结果插入到字符串 `where`\
    \ 指定的位置，`where` 为以下之一：\n\n    * `\"beforebegin\"` — `element` 之前。\n    * `\"afterbegin\"\
    ` — 作为 `element` 的第一个子节点。\n    * `\"beforeend\"` — 作为 `element` 的最后一个子节点。\n  \
    \  * `\"afterend\"` — `element` 之后。\n\n### 4.5.5 CharacterData\n\n有三种 `CharacterData`\
    \ 类型：`Text`、`Comment` 和 `ProcessingInstruction`（此处未介绍）。它们具有 `Node` 的所有属性和方法，外加：\n\
    \n* `data` — 文本内容。\n* `length` — 文本的字符数。\n* `nodeName` — 字符串 `\"#text\"`。\n* `appendData(data)`\
    \ — 在文本末尾添加 `data`。\n* `insertData(offset, data)` — 在给定的 `offset` 处向文本插入 `data`。\n\
    * `deleteData(offset, count)` — 从给定的 `offset` 开始从文本中删除 `count` 个字符。\n* `replaceData(offset,\
    \ count, data)` — 用 `data` 替换从 `offset` 开始的 `count` 个字符。\n* `substringData(offset,\
    \ count)` — 返回从 `offset` 开始的 `count` 个字符。\n* `remove()` — 从 de DOM 树中移除该节点。\n\n\
    ### 4.5.6 示例：ShowTree\n\n下面的 HTML 页面在点击按钮时，会将完整的 `Element` 树写入控制台，尽管文本经过了严重压缩。必须打开控制台才能看到结果。\n\
    \n"
- fmt: "\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>showTree Example</title>\n\
    \n  <script>\n  function abbreviate(str) {\n    let oneLine = str.replaceAll(/\\\
    s+/g, \" \").trim();\n    if (oneLine.length <= 45) return oneLine;\n    return\
    \ \"'\" + oneLine.substr(0, 30) +\n     \" … \" + oneLine.substr(-8, 10) + \"\
    '\";\n  }\n\n  function onlyWhitespace (str) {\n    return /^\\s+$/.test(str);\n\
    \  }\n\n  function showTree(e, indent=\"\") {\n    let s = indent + e.nodeName\
    \ + \" \";\n    if (e instanceof CharacterData) {\n      if (onlyWhitespace(e.textContent))\
    \ {\n        s += \"[whitespace] \";\n      } else {\n        s += abbreviate(e.textContent);\n\
    \      }\n    }\n    if (e.hasAttributes) {\n      let attrs = e.attributes;\n\
    \      for (let i = 0; i < attrs.length; i += 1) {\n        if (attrs[i].value\
    \ != null) {\n          s += attrs[i].name + \":\" +\n            attrs[i].value\
    \ + \" \";\n        }\n      }\n    }\n    if (e.innerHTML) {\n      s += abbreviate(e.innerHTML);\n\
    \    }\n    console.log(s);\n    for (node of e.children) {\n      showTree(node,\
    \ indent + \"| \");\n    }\n  }\n  </script>\n</head>\n\n<body>\n  <!-- Steve\
    \ Jobs quote -->\n  <p><i>Everyone</i> should learn how to program\n  a computer\
    \ because it teaches you how to think.</p>\n  <button onclick=\"showTree(document)\"\
    > Show Tree</button>\n</body>\n</html>\n```\n\nLine 51 defines a button which,\
    \ when clicked, will call the `showTree` method with the `document` node.\n\n\
    At line 19, `showTree` begins the creation of a string `s`, starting with some\
    \ indentation and the `tagName` of the parameter.\n\nLine 20 tests if the argument\
    \ is `CharacterData` (either `Text` or `Comment`). If it is, either an abbreviated\
    \ version of the text is added to `s`, or an indication that the text consists\
    \ entirely of whitespace. As written above, with `e.children` in line 40, this\
    \ code will never be used (but see below).\n\nLines 27 through 35 check if the\
    \ argument has attributes, and if so, adds them to string `s`.\n\nLines 36 through\
    \ 38 add an abbreviated version of the node’s `innerHTML`, if it has one, and\
    \ line 39 displays the result.\n\nThe abbreviation of `innerHTML` is done by lines\
    \ 7 through 12. This abbreviation prevents the output from several times as long\
    \ as the original HTML.\n\nLines 40 to 42 get the `children` of the argument node\
    \ `e`, all of which are `Element`s, and recur with some indentation. Here is the\
    \ result:\n\n```\ndocument\n| HTML <head><title>showTree Example …</body>'\n|\
    \ HEAD <title>showTree Example …</title>'\n| TITLE showTree Example\n| SCRIPT\
    \ 'function abbreviate(str) { let … } }'\n| BODY '<!-- Steve Jobs quote --> <p><i>Everyone</i>\
    \ should learn … think.'\n| BUTTON onclick:showTree(document)\n```\n\nThe duplication\
    \ in the above is because elements contain other elements. For example, `showTree`\
    \ is in a `TITLE` tag, which is in a `HEAD` tag, so it shows up three times. If\
    \ `e.children` in line 40 is replaced with `e.childNodes`, then all child nodes\
    \ of `e` will be printed. This includes `Text` and `Comment` nodes.\n\n# Afterword\n\
    \nJavaScript was pressed into service by Netscape in 1995, during the “browser\
    \ wars.” It was initially named `LiveScript`, but the name was changed after only\
    \ three months because Java was quickly gaining in popularity. There is no real\
    \ relationship between the two languages; both borrowed heavily from C.\n\nMicrosoft\
    \ responded in 1996 with a knock-off version called JScript. Netscape submitted\
    \ JavaScript to ECMA International, a standards organization. Microsoft participated\
    \ for a few years, then dropped its support. Subsequently, Firefox and Chrome\
    \ gained large enough market share to get Microsoft to rejoin the party. To make\
    \ a long story, standardization finally succeeded in 2009 with ECMAScript 5, and\
    \ later with ECMAScript 6 in 2015. Subsequent versions (through 11) have only\
    \ minor changes.\n\nThe Oracle Corporation currently owns the name “JavaScript,”\
    \ so the official name of the language is ECMAScript. The history of the HTML\
    \ DOM follows a similar trajectory. Standards are currently maintained by the\
    \ Web Hypertext Application Working Group; this is the ultimate source for complete,\
    \ detailed information. More approachable documentation for HTML, CSS, and JavaScript\
    \ can be found at MDN Web Docs. This book has attempted to provide a reasonably\
    \ simple, coherent subset of JavaScript and the HTML DOM. Even so, the book is\
    \ half as long as anticipated, and a great deal has been omitted. My hope is that\
    \ it will provide a suitable starting point for your future studies.\n\n# Appendix\
    \ A: Array Methods\n\nAlthough negative array indices are not allowed, array methods\
    \ use negative numbers as indices, with `-1` denoting the last location, `-2`\
    \ the next to last, and so on.\n\n* `Array.from(iter)` — Creates and returns an\
    \ array of values from an iterable object `iter`.\n* `Array.isArray(obj)` — Tests\
    \ if `obj` is an array.\n* `array.concat(arg1, …, argN)` — Creates and returns\
    \ a new array with all the elements of the old array and also the elements `arg1`,\
    \ …, `argN`.\n* `array.flat(depth)` — Removes one level of nesting from arrays\
    \ of arrays (…).\n* `array.includes(value)` — Tests if `value` occurs in `array`.\n\
    * `array.join(sep)` — Converts all the elements of the array to strings and concatenates\
    \ them, using `sep` as a separator. If `sep` is omitted, commas are used. Holes,\
    \ `undefineds`, and `nulls` are converted to empty strings.\n* `array.pop()` —\
    \ Removes and returns the last value in the array and decrements the length of\
    \ the array.\n* `array.push(value1, …, valueN)` — Adds the values to the end of\
    \ the array and returns the new length of the array.\n* `array.shift()` — Removes\
    \ and returns the first value in the array. Remaining elements are all shifted\
    \ down one place.\n* `array.slice(start, end)` — Returns a new array consisting\
    \ of elements `start` through `end - 1` of the original array.\n* `array.sort()`\
    \ — Sorts the array in place, in alphabetical (lexicographic) order; numbers are\
    \ sorted according to their string representations, so `200 < 5`.\n* `array.splice(start)`\
    \ — Removes all elements from index location `start` to the end of the array and\
    \ returns them in a new array.\n* `array.splice(start, count)` — Removes `count`\
    \ elements from the array, starting at index location `start`, and returns them\
    \ in a new array.\n* `array.splice(start, count, value1, …, valueN)` — Removes\
    \ `count` elements from the array, starting at index location `start`, and replaces\
    \ them with new elements `value1`, …, `valueN`. The removed elements are returned\
    \ in a new array.\n* `array.toString()` — Creates and returns a comma-separated\
    \ list of the string representations of each element in the array. This method\
    \ may not show brackets, so a higher-dimensional array will appear one-dimensional.\n\
    * `array.unshift(value1, …, valueN)` — Adds `value1`, …, `valueN` to the beginning\
    \ of the array; the return value is the new length of the array.\n"
