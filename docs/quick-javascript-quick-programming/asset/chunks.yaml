    Function definitions are best placed in the `<head>` of the HTML document. Scripts
    in the `<body>` section are executed in order as the page is loaded, and typically
    produce output that is displayed at that point in the page.


    Not everyone allows JavaScript to run in their browser. Text within a `<noscript>`text`</noscript>`
    tag will be displayed if and only if JavaScript is unavailable or disabled.


    Large amounts of JavaScript and scripts that are used on more than a single page
    should be put in a file or files, not on the HTML page.


    ## 4.3 DOM Overview


    The `HTML DOM` (`Document Object Model`) represents everything on the HTML page
    as a tree of `Node`s, even the HTML comments and every bit of whitespace. Everything
    in the DOM is accessible to JavaScript and can be changed, and every change made
    by JavaScript is reflected immediately in the page as shown to the user. This
    is far more power than is needed for most applications.


    [Figure 4.1](#ch4.xhtml_fig4_1) shows the main subclasses of `Node`, not the structure
    of the DOM tree. The root of the DOM tree is a `Node` named `document`, of type
    `Document`, and it has one child, an `Element` representing the `<html>` tag.
    The `document` node has properties `head` and `tail`, which give access to the
    entire tree of nodes.


    ![](images/fig4_1_B.jpg)


    [Figure 4.1 The DOM tree.](#ch4.xhtml_R_fig4_1)


    Every HTML tag is represented by an `Element`. An `Element` has a `tagName`, which
    is the name of the HTML tag. The name in the DOM is always uppercase: `HTML`,
    `HEAD`, `BODY`, `TITLE`, `SCRIPT`, and so on. `Element`s may have `Attribute`s
    (another subclass of `Node`).


    > **Note**: An `Element` is just one kind of `Node`, but it is so pervasive that
    the two are sometimes confused. Adding to the confusion, `Element` is a subclass
    of `Node`, so all the `Node` properties and methods can be used with `Element`s.


    Because the nodes are in a tree structure, there are `Node` properties that allow
    movement in the tree: `parentNode`, `firstChild`, `nextSibling`, `previousSibling`,
    and `lastChild`.


    Text and comments are represented by `Text` and `Comment` nodes, not `Element`
    nodes, so they do not show up in properties and methods that return only `Element`s.
    For example, an `Element` has a `childNodes` property that is a collection of
    all its children, and a `children` property that is a collection of only those
    children that are `Element`s.


    In addition to the web page as described by the HTML, there are a large number
    of events happening all the time. Every keystroke, every mouse movement, and many
    other things cause events to occur. An interactive web page “listens for” and
    responds to a small subset of these events.


    ## 4.4 Graphical User Interfaces


    A `Graphical User Interface`, or `GUI`, is a means of allowing the program to
    interact with a user. It typically consists of familiar controls, or `widgets`,
    such as buttons, text boxes, checkboxes, menu items, and the like.


    GUIs can be used to create stand-alone programs, or they can be used to collect
    information to send back to a server (such as when ordering merchandise). A `form`
    is a container for widgets whose purpose is to collect information into a single
    bundle.


    ### 4.4.1 Events


    GUI programs are different from other programs. Instead of one continuous sequence
    of code that runs from beginning to end, GUI programs are `event-driven`. When
    an “interesting” event occurs, some code is triggered to `handle` it. The code
    finishes, then nothing more happens until another “interesting” event occurs.


    An “interesting” event is simply one that the programmer has written some code
    to handle. Events are happening all the time; practically anything that happens
    generates one or more events. The mouse moves over an HTML element? That’s an
    event. The mouse moves out of an HTML element? That’s another event. In fact,
    if the mouse moves at all, that’s an event. There are over 70 kinds of events,
    all with names beginning with “`on`, such as `onclick`.


    The key point is that events are happening all the time; the programmer doesn’t
    have to do anything to create them. If the user clicks a button, that’s an event
    that (normally) should be handled. If the user clicks a word in a paragraph, probably
    that event should be ignored. The programmer gets to decide which events to handle.


    ### 4.4.2 Widgets


    `Widgets` are GUI elements. Each is represented by a tag in HTML, and a corresponding
    `Element` in the DOM. Typical widgets are buttons, text fields, text areas, checkboxes,
    radio buttons, scroll bars, and a number of other types.


    Most GUI elements can be written using an `<input>` tag with a `type` attribute.
    If `type` is omitted, `text` is assumed; this is a box allowing one line of text
    to be entered.


    Here are the possible values for `type`: `button`, `checkbox`, `color`, `date`,
    `datetime-local`, `email`, `file`, `hidden`, `image`, `month`, `number`, `password`,
    `radio`, `range`, `reset`, `search`, `submit`, `tel` (telephone), `text`, `time`,
    `url`, `week`.


    There are a few widgets that have their own tag, rather than being a value of
    `type`: `button`, `fieldset`, `label`, `option`.


    ### 4.4.3 Buttons


    Buttons are `active elements`: When the user clicks a button, it should cause
    something to happen. Moreover, it is only polite to provide a visual cue that
    something has been done. For example, if the user clicks a `Save` button to save
    a file, the user may get frustrated and click the button over and again.


    There are two ways to create a button:


    ```

    <input type="button" value="Click me" onclick="alert(''Hello'')">


    <button onclick="alert(''Hello'')">Click me</button>

    ```


    Each of these will appear on the web page. The value of the `onclick` property
    should be a string containing JavaScript code, to be executed when the button
    is clicked—this is an event handler. Typically an event handler is a single function
    call, so that all JavaScript code can be kept in one place rather than scattered
    throughout the HTML page. In the above examples, the function called is the `alert`
    function.


    > **Note**: The JavaScript code in an event handler must be a quoted string. Since
    the code itself may contain quoted strings, two kinds of quotes are commonly used,
    such as single quotes within double quotes.


    The text on a button can be changed by JavaScript. For buttons defined with an
    `input` tag, the button’s text is in its `value` attribute; for buttons defined
    with the `button` tag, the button’s text is in its `innerHTML`.


    ### 4.4.4 Finding Widgets


    There are a number of ways to specify a particular widget. Here are two:


    *   `document.getElementById("id")` — Returns the one element on the page whose
    tag has the attribute `id="id"`. Ids must be unique on the page.


    *   `document.getElementsByTagName("tagName")` — Get an indexable collection of
    all the elements on the page with the given `tagName`.


    There are two commonly used types of `collection` in the DOM. The `getElementsByTagName`
    method returns a *live* `HTMLCollection` of elements, while the `childNodes` property
    of a node is a *live* `NodeList` of nodes.

