  trans: "\n\n正则表达式在很大程度上是标准的，因此除了极少数特殊的模式外，所有的模式都可以在 JavaScript 中使用。在本节中，我们假设你已经具备正则表达式的知识，仅描述如何在\
    \ JavaScript 中使用它们。对于不熟悉正则表达式的读者，附录 D 中简短的讨论。\n\n正则表达式写在正斜杠之间，后面可以跟上标志位（flags）。例如，`/[a-z]+/gi`\
    \ 是正则表达式 `[a-z]+`，并带有全局 (`g`) 和不区分大小写 (`i`) 标志位。（`[a-z]+` 将匹配任何小写字母序列。）\n\n括号用于对正则表达式的部分进行分组。组从左到右编号，从\
    \ `1` 开始；找到组编号的简单方法是只计算左（开启）括号的数量。组 `0` 是整个匹配部分。例如，在模式中：\n\n```javascript\n a\
    \ = \"Call 1-800-555-1212 today!\"\n b = /1-800-((\\d\\d\\d)-(\\d\\d\\d\\d))/\n\
    \ // 0 12 3\n c = a.match(b)\n```\n\n结果将是：\n\n```\n c[0] = \"1-800-555-1212\"\n\
    \ c[1] = \"555-1212\"\n c[2] = \"555\"\n c[3] = \"1212\"\n```\n\n可以使用以下方法应用正则表达式：\n\
    \n*   `string`.search(`regexp`)` — 返回 `string` 中匹配 `regexp` 的第一个子字符串的起始索引，如果没有找到，则返回\
    \ `null`。如果存在全局修饰符 `g`，它会被忽略。\n*   `string`.replace(`regexp`,` replacement`) —\
    \ 在 `string` 中搜索 `regexp`，如果找到，则将其替换为 `replacement`。如果存在全局修饰符 `g`，该方法将所有的 `regexp`\
    \ 出现替换为 `replacement`。\n    *   如果 `regexp` 包含分组，则 `replacement` 可以使用 `$1` 表示第一个匹配组，使用\
    \ `$2` 表示第二个匹配组，依此类推。\n*   `string`.match(`regexp`)` — 在 `string` 中搜索 `regexp`\
    \ 并返回一个数组。\n    *   如果设置了 `g` 标志，`match` 返回匹配的子字符串数组，如果没有找到匹配，则返回 `null`。\n  \
    \  *   如果没有设置 `g` 标志，`match` 返回一个数组，其第一个元素是（第一个）匹配的子字符串，其余元素（如果有）是 `regex` 中每个括号分组匹配的子字符串。参见本节开头的示例。\n\
    *   `string`.matchAll(`pattern`)` — 在 `g` 标志下，`matchAll` 为 `string` 中匹配 `pattern`\
    \ 的每个子字符串返回一个迭代器。这非常便于配合 `for/of` 循环使用。\n*   `string`.split(`regexp`)` — 返回 `string`\
    \ 的子字符串数组，其中 `regexp` 的每次出现都会分隔 `string` 中的子字符串。\n\n以下是 `regexp` 的方法而非 `string`\
    \ 的方法：\n\n*   `regexp`.exec(`string`)` — 在 `string` 中搜索 `regexp` 并记住它在 `string`\
    \ 中的位置。\n    *   该方法设计用于在循环中使用。如果设置了 `g` 标志，每次调用 `exec` 都将返回下一个匹配的子字符串，在没有剩余项时返回\
    \ `null`。在返回 `null` 后，`regex` 将重置并可以再次使用。\n    *   如果没有设置 `g` 标志，`exec` 的行为类似于未设置\
    \ `g` 标志的 `match`。\n*   `regexp`.test(`string`)` — 如果 `regexp` 在 `string` 某处匹配，则返回\
    \ `true`，否则返回 `null`（注：此处原文为 null，通常 JS 中返回 false）。\n\n## 2.3 标识\n\n标识由字母、数字、下划线和美元符号组成。标识不能以数字开头。\n\
    \n## 2.4 var\n\n在比较不同类型时，JavaScript 尝试将它们转换为数字。尽管 `undefined` 转换为 `NaN` 且 `null`\
    \ 转换为 `0`，但 `undefined==null` 仍然是 `true`。\n\n## 2.5 let 和 const\n\n现代声明变量的方式是\
    \ `let`。旧式使用 `var` 应该被避免。\n\n*   如果 `var` 声明了但没有赋值，它具有特殊值 `undefined`。\n*   如果\
    \ `var` 声明了多次，不会抛出错误：\n\n```javascript\n var x = 1;\n var x = 2; // x 现在是 2\n\
    ```\n\n*   如果 `var` 声明在函数内部，它是局部的：\n\n```javascript\n function foo() {\n  var\
    \ x = 1;\n}\n```\n\n*   如果 `var` 声明在函数外部，它是全局的：\n\n```javascript\n var x = 1;\n\
    ```\n\n## 2.6 运算符\n\n这里是数字最常用的运算符：\n\n*   `+` 加法\n*   `-` 减法或一元负\n*   `*` 乘法\n\
    *   `/` 除法，产生浮点结果\n*   `%` 余数（模）\n*   `**` 幂\n\n布尔值常用的运算符：\n\n*   `&&` 与\n*  \
    \ `||` 逻辑\n*   `!` 非\n\n比较运算符，产生布尔值结果：\n\n*   `<` 小于\n*   `<=` 小于或等于\n*   `==`\
    \ 等于\n*   `===` 严格相等（相等且类型相同）\n*   `!=` 不等于\n*   `!==` 严格不相等（不同类型或值）\n*   `>=`\
    \ 大于或等于\n*   `>` 大于\n\n> **注意**：比较不同类型的值时，JavaScript 会尝试将它们转换为数字。如果其中一个或两个值可能是\
    \ `null` 或 `undefined`，请不要比较它们；请先使用 `===` 进行检查，这是总是安全的。\n\n> \n\n> **注意**：与几乎所有语言一样，比较两个浮点数的相等性是不明智的。例如，`11*(100/11)`\
    \ 不等于 `100`，因为它们在第 14 位小数处不同。一种潜在的解决方法是使用方法 `.toFixed(`n``)，它将返回一个带有 `n` 位小数的字符串，然后进行字符串比较。\n\
    \n字符串拼接：\n\n*   `+` 拼接（连接）两个字符串，或一个字符串与任何其他值。\n\n"
- fmt: "\nThe arithmetic comparison operators can also be used on strings, giving\
    \ lexicographic ordering. All capital letters precede all lowercase letters, thus\
    \ `\"Cat\" < \"cat\"`.\n\n### Assignment:\n\n- `=`: the ***assignment operator***—can\
    \ be used as an expression; the value of the expression is the value that is assigned.\n\
    \nJavaScript also has the `+` and `-` unary operators. The `+` operator, when\
    \ applied to a non-numeric value (such as a string), attempts to convert that\
    \ value into a number, returning `NaN` (“not a number”) if it cannot.\n\n- `?:`:\
    \ The ***ternary operator***: In the expression `test` `?` `valueIfTrue`:`valueIfFalse`,\
    \ the `test` determines which of the two succeeding values is used.\n\nIf you\
    \ are familiar with Java, most of the Java operators can also be used in JavaScript,\
    \ including all of the bit-manipulation operators. The bit-manipulation operators\
    \ convert their operands to integers, do the operation on integers, and convert\
    \ the results back to (floating-point) numbers.\n\nOrder of precedence is the\
    \ same as in most languages: Unary plus and minus are done first, then exponentiation,\
    \ then multiplication and division, then addition and subtraction, then assignment.\n\
    \n## 2.7 Equality and Identity\n\nThe `==` and `!=` comparison operators try to\
    \ convert their operands to the same type. The results may be surprising. For\
    \ example, `123`, `\"123\"`, `[123]`, and even `[\"123\"]` are all considered\
    \ equal when using `==`.\n\nThe “strict” tests `===` and `!==` will regard values\
    \ as unequal if they are of different types. Unless you want the automatic conversion,\
    \ these operators should be preferred.\n\nFor objects (arrays, sets, etc.), the\
    \ “equality” operators are actually tests of ***identity*. That is, an object\
    \ is “equal” only to itself, not to any other object. The comparison `[1] == [1]`\
    \ is `false` because two arrays are created, then compared.\n\nAssignment of objects\
    \ does *not* create new objects. After the sequence `a = [1]; b = a;`, the test\
    \ `a == b` will return `true`. This is because `a` and `b` are now references\
    \ to the same object. Changes made to the object from either `a` or `b` will be\
    \ visible to the other variable.\n\nJavaScript has no built-in equality testing\
    \ for objects; to do this, the objects need to be broken down into primitive components.\
    \ This requires significant amounts of code. The sites `underscorejs.com` and\
    \ `lodash.com` both provide large, well-tested libraries for this and other purposes.\n\
    \n## 2.8 Conversions\n\nJavaScript performs most ***conversions*** (also called\
    \ ***coercions*) automatically. Here are some that might require some care.\n\n\
    Any arithmetic performed on primitives will cause them to be converted to numbers.\
    \ Strings of digits will be converted in the obvious way. Boolean `true` will\
    \ be converted to `1`, `null` and `false` to `0`, and `undefined` to `NaN`.\n\n\
    > **Exception**: The *binary* `+` operator is both addition and string concatenation,\
    \ but concatenation has priority; `2 + \"2\"` is `\"22\"`. The *unary* operator\
    \ `+` will attempt to convert its operand to a number, so `2 + +\"2\"` is `4`.\n\
    \nAny value in a boolean context (such as the condition of an `if` statement)\
    \ will be treated as `false` if it is `0`, `undefined`, `null`, `NaN`, or the\
    \ empty string. All other values, including `\"0\"`, are considered to be true.\n\
    \nWhen an array is converted to a string, the result is a string of comma-separated\
    \ values; the brackets are omitted. Thus, a multidimensional array can readily\
    \ be mistaken for a one-dimensional array.\n\n## 2.9 Statements\n\nMany statements\
    \ in JavaScript are almost identical to those in Java. For the convenience of\
    \ Java programmers, these statements are described separately from statements\
    \ unique to JavaScript.\n\n### 2.9.1 Semicolons\n\nEvery JavaScript statement\
    \ should end with a semicolon. If you are used to programming in Java or one of\
    \ the C languages, continue using semicolons the way you are used to.\n\nAlthough\
    \ each statement *should* be terminated by a semicolon, JavaScript uses a tool\
    \ called ***ASI*** (***Automatic Semicolon Insertion*), which will, up to a point,\
    \ put semicolons at the ends of lines where appropriate. If you miss a few semicolons\
    \ it’s probably okay, but it’s unwise to depend on ASI to do this for you.\n\n\
    When a group of statements is enclosed in braces, `{}`, this forms a ***compound\
    \ statement*** (or ***block*). A semicolon is not needed after the closing brace.\n\
    \nIf a statement needs to extend over two lines, separate it in a place where\
    \ the first line cannot be understood as a complete statement. Good places to\
    \ break a statement are after an operator or inside a parenthesized expression.\n\
    \nIf a line begins with an opening parenthesis, opening bracket, or arithmetic\
    \ operator, it will be taken as a continuation of the previous line. If this is\
    \ not your intent, end the previous line with a semicolon.\n\nSemicolons are required\
    \ to separate two or more statements on the same line.\n\n### 2.9.2 Declarations\n\
    \nVariables in JavaScript may hold any type of value, so their type is not a part\
    \ of their declaration.\n\n- `let x;`\n- `var y = 5; // old style - avoid`\n-\
    \ `let z = 26;`\n- `let a = 5, b = 10, c;`\n\nIt is an error to declare a variable\
    \ more than once.\n\n### 2.9.3 Function Definitions\n\nA ***function*** is a block\
    \ of code that can be ***invoked*** (called). The most common way of declaring\
    \ a function is with this syntax:\n\n```\nfunction name(args) {\n\n    statements\n\
    \n}\n```\n\nExample definition:\n\n```\nfunction average(x, y) {\n    let sum\
    \ = x + y; // x, y and sum are local\n    return sum / 2;\n}\n```\n\nExample call:\n\
    \n```\nlet avg = average(5, 10); // 7.5\n```\n\nAny variables declared within\
    \ the function body are local to the function. The parameters are also local to\
    \ the function.\n\nFunctions may access global variables. Function definitions\
    \ are ***hoisted***. This simply means that all function definitions are processed\
    \ before any other code is executed so that they need not lexically occur before\
    \ calls can be made.\n\n### 2.9.4 Familiar Statements\n\nMany of the statements\
    \ in JavaScript are identical to those in Java and C++. If you are experienced\
    \ in one of those languages, feel free to skip ahead to *JavaScript-Specific Statements*.\
    \ \n\n> **Note 1:** While the traditional `for` statement is the same, its ***initialization***\
    \ part will, of course, use `let` rather than the type of the control variable.\n\
    \n> **Note 2:** The `switch` statement allows each `case` to specify an expression,\
    \ not just a constant value.\n\nHere is a list of statements that are the same:\n\
    \n```\n • variable = expression;\n    • expression;\n    • { statements }\n  \
    \  • if (condition) {\n        statements\n      }\n    • if (condition) {\n \
    \       statements\n      } else {\n        statements\n      }\n    • while (condition)\
    \ {\n        statements\n      }\n    • for (initialization; condition; update)\
    \ {\n        statements\n      }\n    • do {\n        statements\n      } while\
    \ (condition)\n    • switch (expression) {\n         case expression:\n      \
    \       statements;\n              break;\n          case expression:\n\t    \
    \  statements;\n\t      break;\n            …\n            default:\n        \
    \        statements;\n       }\n    • label: statement;\n    • break;\n    • break\
    \ label;\n    • continue;\n    • continue label;\n    • return value;\n    • return;\n\
    \    •; // empty statement\n```\n\n#### 2.9.4.1 Assignment Statements\n\nAn ***assignment\
    \ statement*** gives a value to a variable. For example,\n\n`x = 5;` gives `x`\
    \ the value `5`.\n"
  raw: "The arithmetic comparison operators can also be used on strings, giving lexicographic\
    \ ordering. All capital letters precede all lowercase letters, thus `\"Cat\" <\
    \ \"cat\"`.\n\nAssignment:\n\n*   = ***assignment operator***—can be used as an\
    \ expression; the value of the expression is the value that is assigned.\n\nJavaScript\
    \ also has the `+` and `-` unary operators. The `+` operator, when applied to\
    \ a non-numeric value (such as a string), attempts to convert that value into\
    \ a number, returning `NaN` (“not a number”) if it cannot.\n\n*   ?: The ***ternary\
    \ operator***: In the expression ***test*** `?` ***valueIfTrue***`:` ***valueIfFalse***,\
    \ the ***test*** determines which of the two succeeding values is used.\n\nIf\
    \ you are familiar with Java, most of the Java operators can also be used in JavaScript,\
    \ including all of the bit-manipulation operators. The bit-manipulation operators\
    \ convert their operands to integers, do the operation on integers, and convert\
    \ the results back to (floating-point) numbers.\n\nOrder of precedence is the\
    \ same as in most languages: Unary plus and minus are done first, then exponentiation,\
    \ then multiplication and division, then addition and subtraction, then assignment.\n\
    \n## 2.7 Equality and Identity\n\nThe `==` and `!=` comparison operators try to\
    \ convert their operands to the same type. The results may be surprising. For\
    \ example, `123`, `\"123\"`, `[123]`, and even `[\"123\"]` are all considered\
    \ equal when using `==`.\n\nThe “strict” tests `===` and `!==` will regard values\
    \ as unequal if they are of different types. Unless you want the automatic conversion,\
    \ these operators should be preferred.\n\nFor objects (arrays, sets, etc.), the\
    \ “equality” operators are actually tests of ***identity***. That is, an object\
    \ is “equal” only to itself, not to any other object. The comparison `[1] == [1]`\
    \ is **false** because two arrays are created, then compared.\n\nAssignment of\
    \ objects does *not* create new objects. After the sequence `a = [1]; b = a;`,\
    \ the test `a == b` will return `true`. This is because `a` and `b` are now references\
    \ to the same object. Changes made to the object from either `a` or `b` will be\
    \ visible to the other variable.\n\nJavaScript has no built-in equality testing\
    \ for objects; to do this, the objects need to be broken down into primitive components.\
    \ This requires significant amounts of code. The sites `underscorejs.com` and\
    \ `lodash.com` both provide large, well-tested libraries for this and other purposes.\n\
    \n## 2.8 Conversions\n\nJavaScript performs most ***conversions*** (also called\
    \ ***coercions***) automatically. Here are some that might require some care.\n\
    \nAny arithmetic performed on primitives will cause them to be converted to numbers.\
    \ Strings of digits will be converted in the obvious way. Boolean `true` will\
    \ be converted to `1`, `null` and `false` to `0`, and `undefined` to `NaN`.\n\n\
    > **Exception**: The *binary* `+` operator is both addition and string concatenation,\
    \ but concatenation has priority; `2 + \"2\"` is `\"22\"`. The *unary* operator\
    \ `+` will attempt to convert its operand to a number, so `2 + +\"2\"` is `4`.\n\
    \nAny value in a boolean context (such as the condition of an `if` statement)\
    \ will be treated as `false` if it is `0`, `undefined`, `null`, `NaN`, or the\
    \ empty string. All other values, including `\"0\"`, are considered to be true.\n\
    \nWhen an array is converted to a string, the result is a string of comma-separated\
    \ values; the brackets are omitted. Thus, a multidimensional array can readily\
    \ be mistaken for a one-dimensional array.\n\n## 2.9 Statements\n\nMany statements\
    \ in JavaScript are almost identical to those in Java. For the convenience of\
    \ Java programmers, these statements are described separately from statements\
    \ unique to JavaScript.\n\n### 2.9.1 Semicolons\n\nEvery JavaScript statement\
    \ should end with a semicolon. If you are used to programming in Java or one of\
    \ the C languages, continue using semicolons the way you are used to.\n\nAlthough\
    \ each statement *should* be terminated by a semicolon, JavaScript uses a tool\
    \ called ***ASI*** (***Automatic Semicolon Insertion***), which will, up to a\
    \ point, put semicolons at the ends of lines where appropriate. If you miss a\
    \ few semicolons it’s probably okay, but it’s unwise to depend on ASI to do this\
    \ for you.\n\nWhen a group of statements is enclosed in braces, `{}`, this forms\
    \ a ***compound statement*** (or ***block***). A semicolon is not needed after\
    \ the closing brace.\n\nIf a statement needs to extend over two lines, separate\
    \ it in a place where the first line cannot be understood as a complete statement.\
    \ Good places to break a statement are after an operator or inside a parenthesized\
    \ expression.\n\nIf a line begins with an opening parenthesis, opening bracket,\
    \ or arithmetic operator, it will be taken as a continuation of the previous line.\
    \ If this is not your intent, end the previous line with a semicolon.\n\nSemicolons\
    \ are required to separate two or more statements on the same line.\n\n### 2.9.2\
    \ Declarations\n\nVariables in JavaScript may hold any type of value, so their\
    \ type is not a part of their declaration.\n\n*   `let x;`\n\n*   `var y = 5;\
    \ // old style - avoid`\n\n*   `let z = 26;`\n\n*   `let a = 5, b = 10, c;`\n\n\
    It is an error to declare a variable more than once (except with `var`).\n\n###\
    \ 2.9.3 Function Definitions\n\nA ***function*** is a block of code that can be\
    \ ***invoked*** (called). The most common way of declaring a function is with\
    \ this syntax:\n\n```\nfunction  name  (args) {\n\n statements\n\n}\n```\n\nFunctions\
    \ in HTML should normally be defined in the `<head>` element to ensure that they\
    \ will be defined before they are needed. Functions may be recursive. Functions\
    \ may be nested within other functions.\n\nExample definition:\n\n```\n function\
    \ average(x, y) {\n    let sum = x + y; // x, y, and sum are local\n    return\
    \ sum / 2;\n   }\n```\n\nExample call:\n\n```\n let avg = average(5, 10); // 7.5\n\
    ```\n\nAny variables declared within the function body are local to the function.\
    \ The parameters are also local to the function.\n\nFunctions may access variables\
    \ in the environment in which the function occurs (unless there is a local variable\
    \ with the same name). All functions may access global variables. Functions declared\
    \ within another function may access the variables available at the point of declaration.\n\
    \nFunction definitions are ***hoisted***. This simply means that all function\
    \ definitions are processed before any other code is executed so that they need\
    \ not lexically occur before calls to them can be made.\n\n### 2.9.4 Familiar\
    \ Statements\n\nMany of the statements in JavaScript are identical to those in\
    \ Java and C++. If you are experienced in one of those languages, feel free to\
    \ skip ahead to [Section 2.9.5](#ch2.xhtml_sec2_9_5), *JavaScript-Specific Statements*.\n\
    \n> **Note 1:** While the traditional `for` statement is the same, its ***initialization***\
    \ part will, of course, use `let` rather than the type of the control variable.\n\
    \n> \n\n> **Note 2:** The `switch` statement allows each `case` to specify an\
    \ expression, not just a constant value.\n\nHere is a list of statements that\
    \ are the same:\n\n```\n • variable = expression;\n    • expression;\n    • {\
    \ statements }\n    • if (condition) {\n        statements\n      }\n    • if\
    \ (condition) {\n        statements\n      } else {\n        statements\n    \
    \  }\n    • while (condition) {\n        statements\n      }\n    • for (initialization;\
    \ condition; update) {\n        statements\n      }\n    • do {\n        statements\n\
    \      } while (condition)\n    • switch (expression) {\n         case expression:\n\
    \             statements;\n              break;\n          case expression:\n\t\
    \      statements;\n\t      break;\n            …\n            default:\n    \
    \            statements;\n       }\n    • label: statement;\n    • break;\n  \
    \  • break label;\n    • continue;\n    • continue label;\n    • return value;\n\
    \    • return;\n    •; // empty statement\n```\n\n#### 2.9.4.1 Assignment Statements\n\
    \nAn ***assignment statement*** gives a value to a variable. For example,\n\n\
    ```\n x = 5;\n```\n\ngives `x` the value `5`."
