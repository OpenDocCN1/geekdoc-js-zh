    \ begins with `0x` or `0X`. An ***octal literal*** begins with `0o` or `0O`.\n\
    \nIn strict mode, it is illegal to write a number with a leading zero (e.g. `0123`),\
    \ except for zero itself. In nonstrict mode, some implementations will treat such\
    \ numbers as octal and others will treat them as decimal.\n\n### 3.4.2 Strings\n\
    \nA ***string*** is a sequence of zero or more UTF-16 characters enclosed in either\
    \ single quotes (`'hello'`), double quotes (`\"hello\"`), or backticks (``hello``).\
    \ UTF-32 is not supported.\n\nQuote marks of one type may be used within a string\
    \ enclosed by a different type of quote mark, for example, `\"Don't go.\"`. Quote\
    \ marks of the same type as the enclosing type must be escaped (see below).\n\n\
    Strings enclosed in backticks are special. They may span several lines, and anywhere\
    \ in the string that `${`***expression***`}` occurs, the ***expression*** is evaluated\
    \ and becomes part of the string. Strings like this are called ***template literals***.\n\
    \nThere is no “character” data type. Some characters that cannot be written directly\
    \ in a string can be “escaped,” that is, specified by a backslash followed by\
    \ a letter or hex number. Characters written in this way still count as single\
    \ characters.\n\nEscaped characters are:\n\n*   `\\0` NUL\n\n*   `\\b` backspace\n\
    \n*   `\\f` form feed\n\n*   `\\n` newline\n\n*   `\\r` carriage return\n\n* \
    \  `\\t` horizontal tab\n\n*   `\\v` vertical tab\n\n*   `\\\\` backslash\n\n\
    *   `\\'` single quote\n\n*   `\\\"` double quote\n\n*   `\\`` backtick\n\n* \
    \  `\\x`***DD*** Unicode hex ***DD***\n\n*   `\\x`***DDDD*** Unicode hex ***DDDD***\n\
    \nThe `length` property of a string is the number of characters in it. Escaped\
    \ characters, although written with more than one character, still count as a\
    \ single character; so `\"abc\\n\".length` is `4`.\n\nStrings can be indexed,\
    \ so ***string***`[`***n***`]` is the ***n***^(th) character in string. However,\
    \ strings are ***immutable***, so you cannot assign a new value to ***string***`[`***n***`]`.\n\
    \nThe comparisons `<`, `<=`, `==`, `!=`, `===`, `!==`, `>=`, `>` can be used with\
    \ strings. The comparison is according to the Unicode values of the letters, with\
    \ all uppercase letters preceding (less than) all lowercase letters.\n\nA number\
    \ of string methods are given in Appendix C.\n\n### 3.4.3 Booleans\n\nA ***boolean***\
    \ has one of two values: `true` or `false`.\n\nJavaScript also has “***truthy***”\
    \ and “***falsy***” values. When used as a test, the following values are considered\
    \ `false`:\n\n*   `0` and `0.0`\n\n*   The empty string, `\"\"` or `\"` or ``\n\
    \n*   `undefined`\n\n*   `null`\n\n*   `NaN`\n\nWhile this feature can be convenient,\
    \ it makes code less readable.\n\nOlder code may use `~n` as a test; it is equivalent\
    \ to `n != −1`.\n\n### 3.4.4 Symbols\n\nA ***symbol*** can be created with or\
    \ without a description:\n\n```\n let sym1 = Symbol();\n let sym2 = Symbol(\"\
    secret\");\n```\n\nA symbol is a unique identifier; it cannot be confused with\
    \ any other identifier. Two symbols created with the same description are still\
    \ different from each other.\n\nObjects have properties, and those properties\
    \ can be modified or added to. Suppose you have an object that is not one you\
    \ created—it may be a built-in object, or one from someone else’s code—and you\
    \ want to add a property to it. The property is strictly for your own use; its\
    \ existence should not affect anyone else’s code. The solution is to use a symbol\
    \ as the property name.\n\nAlternatively, suppose you have an object, and you\
    \ want to add ***meta-information*** to the object—that is, information that is\
    \ *about* the object, but isn’t *part of* the object. Again, use a symbol as the\
    \ property name.\n\nHere is a short map of distances from the sun for various\
    \ planets:\n\n```\n let sun_dist = {\"Venus\": 108.2, \"Earth\": 149.6, \"Mars\"\
    : 227.9};\n```\n\nThe distances happen to be in millions of kilometers, but that\
    \ may not be obvious. Let’s add that information.\n\n```\n let unit = Symbol(\"\
    mkm\");\n sun_dist[unit] = \"millions of kilometers\";\n```\n\nWe can recover\
    \ that information by asking for `sun_dist[unit]`, but it is not visible to most\
    \ code. In particular, the `for/in` loop will skip right over it.\n\n```\n for\
    \ (let e in sun_dist) {\n      console.log(e + \" = \" + sun_dist[e]);\n     }\n\
    \nwill print\n     Venus = 108.2\n     Earth = 149.6\n     Mars = 227.9 \n```\n\
    \nWhen a string is needed, for example for printing, JavaScript will automatically\
    \ convert almost anything into its string representation. It does not do this\
    \ for symbols. To get a string representation of a symbol, you have to explicitly\
    \ call the `toString()` method.\n\n```\n console.log(unit.toString());\n\nwill\
    \ print\n     \"Symbol(mkm)\"\n```\n\nIf a symbol is defined with a description,\
    \ that description is saved in a field named `description`. For example,\n\n```\n\
    \ console.log(sym2.description);\n\nwill print\n     \"secret\"\n```\n\n### 3.4.5\
    \ Arrays\n\n***Arrays*** in JavaScript do not have a fixed size; elements may\
    \ be added to or removed from either end of the array.\n\n*   ***array***`.push(`***elems***`)`—Returns\
    \ the new length of ***array*** after adding ***elems*** to the end."
