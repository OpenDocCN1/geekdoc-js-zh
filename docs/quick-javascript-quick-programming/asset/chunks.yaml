    \ `break`). If either `expression` matches the `switch` `expression`, the following\
    \ `statements` will be executed.\n\nThe `default` case is optional and usually\
    \ should come last. If no matching `expression` is found, the `statements` in\
    \ the `default` case are executed. If no matching `expression` is found and there\
