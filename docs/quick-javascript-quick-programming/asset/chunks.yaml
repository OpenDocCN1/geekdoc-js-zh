- fmt: "\nA `class` describes a category of objects. It is a blueprint, or recipe,\
    \ for making objects of that type. Classes are a relatively new addition to JavaScript,\
    \ and are always in strict mode. Classes are based on prototypes, and provide\
    \ little if any advantage over just using prototypes.\n\nHere is the template\
    \ for a class:\n\n```\nclass ClassName {\n  fields;\n  constructor(arguments)\
    \ {\n    code\n  }\n  set name(value) {\n    this.someOtherName = value;\n  }\n\
    \  get name() {\n    return this.someOtherName;\n  }\n  methodName(arguments)\
    \ {\n    code\n  }\n}\n```\n\n> **Reminder**: In a method (a function belonging\
    \ to an object), `this` refers to the containing object. The same holds for constructors,\
    \ setters, and getters.\n\nA class has a `constructor` and may have some number\
    \ of `fields`, `getters`, `setters`, and `methods`. To describe these, we will\
    \ continue with our “car” example.\n\n```\n class Car {\n    fuel = \"gasoline\"\
    ; // note: no \"let\"\n    constructor(make, year) {\n     this.make = make;\n\
    \     this.year = year;\n    }\n   }\n\n   let myCar = new Car(\"Subaru\", 2018);\n\
    ```\n\nThe word `new` calls the constructor. Within the constructor, `make` and\
    \ `year` refer to the arguments of the constructor, while `this.make` and `this.year`\
    \ are new fields belonging to the object being constructed. The constructor can\
    \ be used to create other `Car` objects with different values.\n\n> **Technical\
    \ note**: An object created from a constructor gets a `constructor` property,\
    \ and that property has a `name` property, so `myCar.constructor.name` is `\"\
    Car\"`.\n\nWith the above definitions, the fields `fuel`, `make`, and `year` of\
    \ `myCar` can be addressed directly, with `myCar.fuel`, `myCar.make`, and `myCar.year`.\
    \ Sometimes, to provide a bit more “protection,” a class can contain setters and\
    \ getters. These are methods with the special syntax\n\n```\nset name(value) {…}\
    \ and\nget name() {…}\n```\n\nA `setter` typically sets the value of a field.\
    \ Setters are often used to check the legality of a value before saving it. It\
    \ may save the information in a form other than the form provided to it (for example,\
    \ miles may be converted to kilometers).\n\nA `getter` typically returns the value\
    \ of an object’s field. Alternatively, a getter may compute a value in some other\
    \ way and return it, for example, converting kilometers back to miles.\n\nTo use\
    \ these setters and getters, *no change in the code* is involved. If a field has\
    \ a setter, any attempt to change the value of a field (for example, `myCar.make\
    \ = \"VW\"`) will invoke that setter. Any attempt to read the value of a field\
    \ will invoke its getter.\n\nWhen a setter is defined for a variable, *every*\
    \ attempt to set the value of that variable calls its setter. This can be a problem.\
    \ In particular, the following code would cause an “infinite” recursion, as the\
    \ setter calls itself.\n\n```\n set make(value) {\n    this.make = value; // bad!\n\
    \   } \n```\n\nThe recursion can be avoided by saving the variable under some\
    \ other name. Since underscores are legal in variable names, one convention is\
    \ to make a new name by prepending an underscore. This is only a convention; there\
    \ is nothing special about underscores.\n\n```\n set make(value) {\n    this._make\
    \ = value; // okay\n   }\n```\n\nThe new variable `_make` must be used throughout\
    \ the class definition, while the old variable `make` should be used outside the\
    \ class definition.\n\nGetters and setters should normally be defined in pairs.\
    \ Variables with setters must be stored under some other name, while variables\
    \ without setters are unaffected.\n\n> **Caution**: While the use of a setter\
    \ can protect against accidentally changing a value, it is no protection against\
    \ malicious users. With the above setter for `make`, the information is actually\
    \ stored in a variable `_make`, and this variable is directly accessible.\n\n\
    A `method` is a function belonging to an object; and a class is a kind of object.\
    \ Inside a class, a method is written like a function, except that the word `function`\
    \ is omitted.\n\nHere is an implementation of a `Car` class:\n\n```\n class Car\
    \ {\n    fuel = \"gasoline\";\n\n    constructor(make, year) {\n     this._make\
    \ = make;\n     this._year = year;\n    }\n\n    set make(arg) { this._make =\
    \ arg; }\n\n    get make() { return this._make; }\n\n    set year(arg) {\n   \
    \  if (arg < 1903 ||\n       arg > new Date().getFullYear()) {\n      alert(\"\
    Bad year: \" + arg);\n     }\n     else {\n      this._year = arg;\n     }\n \
    \   }\n\n    get year() { return this._year; }\n\n    age() { // method\n    \
    \ let now = new Date().getFullYear();\n     return now - this._year;\n    }\n\n\
    \    toString() {\n     return this._year + \" \" + this._make;\n    }\n   }\n\
    ```\n\nAn assignment to `myCar` will create an object with the fields `make` and\
    \ `year`. After this, the test `myCar instanceof Car` will return `true`.\n\n\
    > **Caution**: The word `this` is evaluated at run time, and depends on the context\
    \ in which it occurs.\n\n### 1. Inheritance\n\nA class can inherit from another\
    \ class. The class that inherits is called a subclass, and the class it inherits\
    \ from is called the superclass. The subclass uses the `extends` keyword to indicate\
    \ its superclass.\n\n```\nclass Animal {}\nclass Dog extends Animal {}\n```\n\n\
    The subclass inherits all the properties and methods of the superclass. You can\
    \ also add new features to the subclass.\n\n```javascript\nclass Animal {\n  eat()\
    \ {\n    console.log(\"eating...\");\n  }\n}\n\nclass Dog extends Animal {\n \
    \ bark() {\n    console.log(\"woof!\");\n  }\n}\n```\n\n#### Constructors\n\n\
    Every class must have a constructor, and the constructor should begin by calling\
    \ the constructor for its superclass. This isn’t necessarily the very first thing\
    \ that must be done, but it must happen before any use of `this` is attempted.\n\
    \nIf no constructor is specified, JavaScript automatically supplies one. JavaScript\
    \ assumes that the constructor will take the same arguments as the constructor\
    \ in its superclass. If we could see it, it would look like this:\n\n```\nconstructor(...args)\
    \ { super(...args); }\n```\n\nThe `spread operator` (`...`) is used in the above\
    \ both to collect an arbitrary number of arguments into an array and to supply\
    \ an arbitrary number from an array.\n\n#### Overriding methods\n\nA subclass\
    \ can also override one or more methods of its superclass. This is useful when\
    \ the subclass needs to provide a different implementation for a method.\n\n```javascript\n\
    class Animal {\n  eat() {\n    console.log(\"eating...\");\n  }\n}\n\nclass Dog\
    \ extends Animal {\n  eat() {\n    console.log(\"eating dog food...\");\n  }\n\
    }\n```\n\n#### The `super` function\n\nThe `super` function is used to call the\
    \ constructor of the superclass. It can also be used to call methods of the superclass\
    \ from the subclass.\n\n```javascript\nclass Animal {\n  constructor(name) {\n\
    \    this.name = name;\n  }\n  move() {\n    console.log(this.name + \" moves.\"\
    );\n  }\n}\n\nclass Dog extends Animal {\n  constructor(name, breed) {\n    super(name);\n\
    \    this.breed = breed;\n  }\n  move() {\n    super.move();\n    console.log(this.name\
    \ + \" is running.\");\n  }\n}\n```\n\n### 2. Static methods and properties\n\n\
    A class can have static methods and properties. These belong to the class itself\
    \ rather than to any instance of the class. They are defined using the `static`\
    \ keyword.\n\n```javascript\nclass Animal {\n  static species = \"mammal\";\n\
    \  static logInfo() {\n    console.log(\"Animal info\");\n  }\n}\n\nconsole.log(Animal.species);\n\
    Animal.logInfo();\n```\n\nStatic methods and properties are not available on instances\
    \ of the class. However, they are inherited by subclasses.\n\n```javascript\n\
    class Animal {\n  static logInfo() {\n    console.log(\"Generic info\");\n  }\n\
    }\n\nclass Dog extends Animal {\n  static logInfo() {\n    console.log(\"Dog info\"\
    );\n  }\n}\n\nAnimal.logInfo(); // Generic info\nDog.logInfo(); // Dog info\n\
    ```\n"
