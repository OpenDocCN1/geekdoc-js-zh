    ## 3.8 Operator Notes


    The `&&` operator means “and.” The `||` operator means “or.”


    The logical operators `&&` and `||` are `short-circuit` operators. That is, if
    the result is known from the first (left-hand) expression, the second (right-hand)
    expression is not evaluated. Because JavaScript has “truthy” and “falsy” values,
    the `&&` and `||` operators don’t necessarily return either `true` or `false`,
    but may instead return a truthy or falsy value.


    *   `expr1` `&&` `expr2`—If `expr1` is falsy, the result is `expr1`, else the
    result is `expr2`.

    *   `expr1` `||` `expr2`—If `expr1` is truthy, the result is `expr1`, else the
    result is `expr2`.


    Given a sequence of values connected with `&&`, the result is either the first
    falsy value encountered, or the final truthy value. Similarly, given a sequence
    of values connected with `||`, the result is either the first truthy value encountered,
    or the final falsy value. This fact is sometimes used in a “clever” way; for example,
    the expression `x || 5` has the value `5` if `x` is zero (or some other falsy
    value), otherwise it has the value of `x`.


