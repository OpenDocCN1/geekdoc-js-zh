    \ not within another statement such as a loop or if statement. Such functions\
    \ are local to the enclosing function:\n\n```\n function hypotenuse(x, y) {\n\
    \    function square(x) { return x * x }\n    return Math.sqrt(square(x) + square(y));\n\
    \   }\n```\n\nPrimitive values (`number`, `string`, `boolean`) are passed to a\
    \ function ***by value***; objects are passed ***by reference***. What this means\
    \ is that functions receive a copy of primitive values, so there is nothing that\
    \ can be done to them that will be seen by the calling program. For objects, functions\
    \ receive a reference to the actual object; any changes made to the interior of\
    \ the object will be seen by the calling program.\n\nIn other words, changing\
    \ the value of a parameter within a function does not change the value outside\
    \ the function, but changing the properties of an object passed as a parameter\
    \ does change their values outside the function.\n\n### 3.10.2 Parameters and\
    \ Arguments\n\nWe use the following terminology: A ***parameter*** is a variable\
    \ in the head of a function definition; an ***argument*** is an expression in\
    \ a call to that function.\n\nJavaScript does not require that a function be called\
    \ with the same number of arguments as it has parameters. Excess arguments are\
    \ ignored, while missing arguments have the value `undefined`.\n\nIn a function,\
    \ the special variable `arguments` is an array-like object that holds *all* the\
    \ arguments the function was called with, regardless of how many parameters were\
    \ used in the function definition. It can be indexed like an array, or looped\
    \ over with `for` loops, but lacks most of the other capabilities of an array.\
    \ The `arguments` variable is used mostly in older code; it isn’t allowed in strict\
    \ mode. Modern code is more likely to use rest parameters (see below).\n\nParameters\
    \ may be given default values; if the argument is missing, the default value is\
    \ used. Default values have the form of assignments, and previous parameters may\
    \ be used in the expression. For example,\n\n```\n function foo(a, b = 10, c =\
    \ a * b) {\n    return a + b + c;\n   }\n   console.log(foo(3)); // result is\
    \ 43\n```\n\nBecause arguments are matched to parameters by position (first argument\
    \ goes to first parameter, etc.), all parameters without default values must precede\
    \ all parameters with default values.\n\nA ***rest parameter*** is a parameter\
    \ that collects all the remaining arguments into an array. A rest parameter is\
    \ designated by preceding it with three dots (`...`). For example, if a function\
    \ is defined with\n\n```\n function foo(x, y, ...z) {\n    console.log(`x is ${x}`);\n\
    \    console.log(`y is ${y}`);\n    console.log(`z is ${z}`);\n   }\n```\n\nand\
    \ called with\n\n```\n foo(1, 2, 3, 4, 5);\n```\n\nthen the following is written\
    \ to the console:\n\n```\n \"x is 1\"\n \"y is 2\"\n \"z is 3,4,5\"\n```\n\nSince\
    \ the `...` collects all the remaining arguments, it can only be used as the last\
    \ parameter.\n\nThe dots can also be used in reverse, in the arguments to a function.\
    \ When placed before an array in a function call, the values in the array are\
    \ separated into individual arguments. This is useful for functions that take\
    \ an arbitrary number of arguments.\n\n```\n let ary = [2, 7, 1, 3];\n let m =\
    \ Math.max(...ary);\n```\n\nUsed in this way, the dots are called a ***spread***.\
    \ Spreads can also be applied to sets and maps.\n\nSpreads can be used to make\
    \ shallow copies of arrays.\n\n```\n let ary2 = [...ary];\n```\n\n### 3.10.3 Functions\
    \ Are Data\n\nThe name of a function, not followed by an argument list, refers\
    \ to the function itself. Functions may be assigned to variables:\n\n```\n function\
    \ square(x) {\n    return x * x;\n   }\n\n   let square2 = square;\n   let result\
    \ = square2(5); // 25\n\n   let myArray = new Array();\n   myArray[10] = square;\n\
    \   result = myArray[10](7); // 49\n```\n\nFunctions can be printed. The call\
    \ `square.toString()` will return a listing of the function, much as it appears\
    \ above.\n\nFunctions may be assigned to properties. A function assigned to a\
    \ property is called a ***method***. Within a method, `this` refers to the call\
    \ object, that is, to the object that holds the property.\n\nFunctions may be\
    \ passed as arguments to another function:\n\n```\n myArray.sort(function(a,b)\
    \ { return a - b });\n```\n\nIn this example, the `sort` method uses the function\
    \ to determine how to compare elements of `myArray`.\n\n### 3.10.4 Functions Are\
    \ Objects\n\nFunctions are objects, and objects have ***properties***.\n\nThe\
    \ `length` property of a function is the number of parameters in its definition.\
    \ A rest parameter (one preceded by `...`) is not included in the count.\n\nThe\
    \ `name` property of a function is, of course, its name. JavaScript is quite clever\
    \ at determining the name of a function. For example, given the definition\n\n\
    ```\n let square = (x) => x * x;\n```\n\nthe function is defined as an anonymous\
    \ literal function, but the assignment to the variable `square` is enough to let\
    \ JavaScript decide that the function is named `\"square\"`.\n\nFunctions may\
    \ be ***recursive***; that is, they may call themselves. A simple example is computing\
    \ the factorial function:\n\n```\n let factorial = function f(n) {\n    if (n\
    \ == 0) return 1;\n    return n * f(n - 1);\n   };\n```\n\nThis example uses a\
    \ ***named function literal***. With this definition, the name `f` can be used\
    \ only within the function definition, while the name `factorial` can be used\
    \ both inside and outside the function.\n\nFunction properties are often a good\
    \ alternative to global variables. For example,\n\n```\n nextInt.counter = 0;\n\
    \   function nextInt() {\n    nextInt.counter += 1;\n    return nextInt.counter;\n\
    \   }\n```\n\nThe first call to `nextInt` will return `1`, the second will return\
    \ `2`, and so on because the function changes the value of its `counter` property.\
    \ Also, note that because functions are ***hoisted*** (processed first), the assignment\
    \ to a function property can occur lexically before the function definition.\n\
    \n### 3.10.5 Function Methods\n\nA ***method*** is a function that belongs to\
    \ an object. But functions themselves are objects, and have methods. Consider:\n\
    \n```\n let car = { make: \"Subaru\", year: 2018,\n     age(now) { return now\
    \ - this.year; } };\n   let fn = car.age;\n```\n\nAt this point `fn` is a function,\
    \ specifically the function `age() {return year - this.year}`. It is no longer\
    \ attached to an object, therefore it is no longer a method. Unfortunately, it\
    \ still refers to `this`, which has also lost its attachment to the original object.\n\
    \nThere are three methods that can help solve the problem with `this`.\n\n*  \
    \ ***f***`.call(`***obj***`,` ***arg1, ..., argN***`)` — Calls the function or\
    \ method ***f*** with the given arguments, using ***obj*** as the value of `this`.\
    \ If no object is required, ***obj*** may be `null`.\n\n    *   `fn.call(car,\
    \ 2021)` — Returns `3`. Note that the function `fn` can be applied to any object\
    \ with a `year` property.\n\n*   ***f***`.apply(`***obj***`,` ***args***`)` —\
    \ Does the same as `call`, but expects an array of arguments."
