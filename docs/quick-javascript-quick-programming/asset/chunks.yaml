    \ a primitive value has no effect.\n\nWhen an object is created by calling a constructor,\
    \ the test ***object*** `instanceof` ***constructor*** (for example, `car instanceof\
    \ Car)` will test whether the object was created using that constructor. This\
    \ is in contrast to `typeof(car)`, which will return the string `\"object\"`.\n\
    \nThe `Object.create(`***proto***`)` method uses an existing object ***proto***\
    \ as the ***prototype*** for a new object. The newly created object has no properties\
    \ of its own; it is “transparent,” in the sense that any attempt to read its properties\
    \ will “see through it” and read the properties of the prototype.\n\n```\n let\
    \ car2 = Object.create(car);\n car2.make = \"VW\";\n car2.color = \"blue\";\n\
    ```\n\nFollowing these statements, `car` will be unchanged, but `car2` will have\
    \ `\"VW\"` as its `make`, `\"blue\"` as its color, and `2018` as its `year`.\n\
    \n### 3.11.3 Copying Objects\n\nAs is the case with most languages, a variable\
    \ holds only a small amount of information, such as a single number. Objects,\
    \ including arrays, sets, maps, and user-created objects, take up a great deal\
    \ more room. Consequently, what is actually “in” a variable is a ***reference***\
    \ (or ***pointer*** or ***machine address***), specifying where to find the object.\n\
    \nIf `obj1` is a variable whose value is an object, then the assignment `obj2\
    \ = obj1` copies the *reference* into `obj2`, not the object itself. The result\
    \ is that `obj1` and `obj2` both point to the same object. Any changes to that\
    \ object are equally visible from both variables.\n\nThere is no way in JavaScript\
    \ to directly copy an object. However, there is a way to copy all the properties\
    \ of an object, or even several objects, into another object\n\n```\nlet newObj\
    \ = Object.assign({}, oldObj);\n```\n\nThe `Object.assign` method takes an empty\
    \ object `{}`, given as the first parameter, and copies all the properties of\
    \ the second parameter into it, returning the result.\n\nIn fact, the `assign`\
    \ method is quite general. It can take any number of objects as parameters, and\
    \ copy the properties of all succeeding objects into the first object. It also\
    \ returns the first object as a result.\n\n```\nObject.assign(newObj, oldObj1,\
    \ …, oldObjN);\n```\n\nIf there is a conflict, later values of a property overwrite\
    \ earlier ones.\n\nThis is a ***shallow copy***: The keys and values of the properties\
    \ are copied, but if a value is itself an object, it is the *reference* to that\
    \ object that is copied, not the object itself.\n\n### 3.11.4 Methods\n\nA ***method***\
    \ is a function attached to an object.\n\n```\n let now = new Date().getFullYear();\n\
    \   let car = { make: \"Subaru\",\n               year: 2018,\n              \
    \ age: function() {\n                       return now - this.year;\n        \
    \            }\n            }\n```\n\nIn the above, `new Date()` returns a `Date`\
    \ object, and its method `getFullYear()` returns a four-digit number.\n\nThe above\
    \ `car` object has a property named `year`. It isn’t a variable; you can’t just\
    \ say `year`, you have to say which object it belongs to. The keyword `this` means\
    \ “this same object.”\n\nA method inside an object literal can be abbreviated\
    \ by leaving out the colon and the word `function`. Within `car`, `age` could\
    \ be defined as follows:\n\n```\n age() { return now - this.year; }\n```\n\nThe\
    \ parentheses after `age` are enough to indicate that it is a function.\n\n###\
    \ 3.11.5 Optional Chaining\n\nObjects can contain references to other objects.\
    \ For example, a `Customer` object might have an `address` property, while an\
    \ `Address` might have a `number` property.\n\n```\n let cust = {\n    name: \"\
    Jones\",\n    address: { number: 29, street: \"main\" }\n   }\n```\n\nWith this\
    \ object you might say `cust.address.number`. This is an example of ***chaining***.\n\
    \nSometimes information is missing or incomplete. If either `cust` or `cust.address`\
    \ is `undefined` or `null`, then `cust.address.number` will result in an error.\n\
    \nTo avoid this error, the ***optional chaining operator*** `?.` can be used.\
    \ It converts errors into the `undefined` value. Hence, `cust?.address?.number`\
    \ will either work or it will return `undefined`, but it won’t cause an error."
