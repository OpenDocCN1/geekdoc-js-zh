    proto.make = \"Subaru\";\nproto.wheels = 4;\n```\n\n```javascript\nlet car = {\n\
    \  make: \"Subaru\",\n  year: 2018,\n  toString() {\n    return this.year + \"\
    \ \" + this.make;\n  }\n};\n\nlet proto = Object.getPrototypeOf(car);\nproto.make\
    \ = \"Subaru\";\nproto.wheels = 4;\n\nconsole.log(car.make); // \"Subaru\"\n```\n\
    \n```javascript\nlet car = {\n  make: \"Subaru\",\n  year: 2018,\n  toString()\
    \ {\n    return this.year + \" \" + this.make;\n  }\n};\n\nlet proto = Object.getPrototypeOf(car);\n\
    proto.make = \"Subaru\";\nproto.wheels = 4;\n\nconsole.log(car.wheels); // 4\n\
    ```\n\n```javascript\nlet car = {\n  make: \"Subaru\",\n  year: 2018,\n  toString()\
    \ {\n    return this.year + \" \" + this.make;\n  }\n};\n\nlet proto = Object.getPrototypeOf(car);\n\
    proto.make = \"Subaru\";\nproto.wheels = 4;\n\nconsole.log(car.make); // \"Subaru\"\
    \nconsole.log(car.wheels); // 4\nconsole.log(car.toString()); // \"2018 Subaru\"\
    \n```\n\n```javascript\nlet car = {\n  make: \"Subaru\",\n  year: 2018,\n  toString()\
