    \     mocha.run();\n    </script>\n\n   </body>\n   </html>\n```\n\n测试代码可以直接放在\
    \ HTML 页面中，也可以从文件中加载。在上面，测试代码位于名为 `isPrimeMochaTest.js` 的文件中。该文件的内容如下：\n\n```\n\
    \ describe(\"isPrime\", function() {\n    let assert = chai.assert;\n    it(\"\
    Tests if n is a prime number\", function() {\n     assert(isPrime(2));\n     assert.isTrue(isPrime(3));\n\
    \     let x = 4;\n     assert.isFalse(isPrime(x));\n     assert.equal(isPrime(5),\
    \ true);\n    });\n   });\n```\n\n（记住 `.js` 文件中不使用 `<script>` 标签）。为了示例起见，使用了几个可能的\
    \ `assert` 测试，并额外抛了一个 `let` 语句，用以演示普通的 JavaScript 代码（而不只是断言）也可以包含在内。\n\n如果一切顺利，预计会有两个结果。在\
    \ HTML 页面的右上角（由 CSS 文件放置）应该显示如下内容：\n\n```\npasses: 1 failures: 0 duration: 0.00s\
    \ 100%\n```\n\n在“mocha” `div` 的位置你应该看到：\n\n```\n isPrime\n    √ Tests if n is\
    \ a prime number\n```\n\n# 第 3 章 JavaScript 详细介绍\n\nDOI: [10.1201/9781003359609-3](https://dx.doi.org/10.1201/9781003359609-3)\n\
    \nJavaScript 是一种大型、复杂且不断演变的语言。前面的章节对其主要特征进行了了快速回顾。然而，缺失的是任何关于创建交互式网页的内容——而这终究底是使用\
    \ JavaScript 的主要原因。\n\n如果你渴望学习客户端 JavaScript 编程，你现在应该已经足够的知识跳转到 第 4 章。如果你希望深化对\
    \ JavaScript 的知识，请继续阅读。\n\n## 3.1 严格模式\n\n没有语言是完美的。JavaScript 允许一些回想起来不应该被允许的操作。JavaScript\
    \ 现在有了 `strict mode`（严格模式）来禁止这些功能并修改其他功能。要全局开启严格模式，请将字符串\n\n```\n\"use strict\"\
    ;\n```\n\n作为脚本中的第一个内容；要仅对某一个函数开启严格模式，请将该字符串放在函数内部的第一行。\n\n开启严格模式会使以下行为非法：\n\n\
    *   给未用 `var`、`let` 或 `const` 声明的变量赋值。\n*   `with` 语句。\n*   在条件语句或循环语句中定义函数。\n\
    *   使用 `eval` 创建变量。\n*   使用 `delete` 删除变量、对象、函数或不可删除的属性（例如 `prototype`）。\n*  \
    \ 修改只读或仅可读属性。\n\n## 3.2 标识符\n\n标识符由字母（Unicode）、数字、下划线和美元符号组成。\n\n## 3.3 解构\n\n\
    解构是将对象的部分部分赋值给不同变量的方法。例如，我们使用以下对象：\n\n```\nlet p = {givenName: \"Sally\", familyName:\
    \ \"Willis\", occupation: \"doctor\"};\n```\n\n我们可能希望将该对象的各个赋值给独立的变量：\n\n```\n\
    let givenName = p.givenName;\nlet familyName = p.familyName;\nlet occupation =\
    \ p.occupation;\n```\n\n解构是用更短的方式来实现完全相同的事情：\n\n```\nlet {givenName, familyName,\
    \ occupation} = p;\n```\n\n属性名不需要排序，也不需要每个名称都被提及。可以给出不在对象的属性名；它们将接收 `undefined`。\n\
    \n为了处理相同类型的相似对象，例如 `p2`，不能再次使用 `let`，因为变量只能声明一次。\n\n```\nlet {givenName, familyName,\
    \ occupation} = p2;\n// SyntaxError: Identifier 'givenName' has\n// already been\
    \ declared\n```\n\n不能简单地省略 `let` 字，因为以大括号 `{` 开始表示一个块。\n\n```\n{givenName, familyName,\
    \ occupation} = p2;\n// SyntaxError: Unexpected token '='\n```\n\n解决方案是将整个语句（直到分号）包含在括号中。\n\
    \n```\n({givenName, familyName, occupation} = p2);\n```\n\n对象可以解构为不同的变量名。\n\n\
    ```\nlet {familyName: name, occupation: occ} = p;\n// name = \"Willis\", occ =\
    \ \"doctor\"\n```\n\n在对象缺少给定属性的情况下，可以给出默认值。\n\n```\n({givenName: name, country\
    \ = \"USA\"} = p);\n// name = \"Sally\", country = \"USA\"\n```\n\n重命名和给出默认值可以组合。\n\
    \n```\n({givenName: name=\"Joe\", age=40} = p);\n// name = \"Sally\", age = 40\n\
    ```\n\n当调用函数时，值会被赋值给参数，这些参数的操作类似于赋值语句；因此，解构也可以用于参数列表。\n\n```\nfunction f({familyName,\
    \ occupation: occ,\n                    age=40, gender: g=\"male\"}) {\n    //\
    \ 当使用 f(p) 调用时，familyName =\n    // \"Willis\", occ = \"doctor\", age = 40,\n\
    \    // and g = \"male\"\n   }\n```\n"
- fmt: "\nDestructuring may also be used with arrays. Commas are used to indicate\
    \ array elements that are skipped over.\n\n```\n let a = [11, 22, 33, 44];\n let\
    \ [, x, , y] = a;\n // x = 22, y = 44\n```\n\n## 3.4 Data Types\n\n### 3.4.1 Numbers\n\
    \nA `number` may be written as an integer or as a real number. However written,\
    \ numbers (other than `bigints`) are stored as double precision floating point\
    \ numbers and follow the `IEEE Standard for Floating-Point Arithmetic` (`IEEE\
    \ 754`).\n\nTo improve readability, numbers may include underscores, for example,\
    \ one million may be written as `1_000_000`.\n\n> **Caution**: The methods to\
    \ convert strings to numbers (`Number`, `parseInt`, and `parseFloat`) cannot yet\
    \ recognize underscores in numbers.\n\nThere are some special predefined “numbers”:\n\
    \n*   `NaN` (“**N**ot **a N**umber”) is the result of expressions such as `0/0`\
    \ and `\"one\"/\"two\"`.\n\n    *   You can write this as `Number.NaN`, or just\
    \ `NaN`.\n\n    *   Despite the name, `NaN` *is* a number, and `typeof(NaN)` will\
    \ return `\"number\"`.\n\n    *   Arithmetic involving `NaN` results in `NaN`.\n\
    \n*   `Infinity` is the result of expressions such as `1/0`.\n\n*   `-Infinity`\
    \ is the result of expressions such as `-1/0`.\n\n    *   `isFinite(x)` will return\
    \ `false` for `-Infinity`, `Infinity`, and `NaN`.\n\n*   `Number.MIN_VALUE` is\
    \ the smallest number that can be represented, approximately `5e-324`.\n\n*  \
    \ `Number.EPSILON` is approximately `2.220446049250313e-16`. It is the smallest\
    \ number that, when added to one, gives a result different from one.\n\n*   `Number.MAX_VALUE`\
    \ is the largest number that can be represented, approximately `1.7976931348623157e+308`.\n\
    \n*   `Number.MAX_SAFE_INTEGER` is `9007199254740991` ; it is the largest integer\
    \ that can be uniquely represented as a double precision floating point number.\n\
    \n*   `Number.MIN_SAFE_INTEGER` is `-9007199254740991`.\n\nAll of the above are\
    \ considered to be numbers. No arithmetic expression will ever cause an exception.\n\
    \n> **Caution**: The function `isNaN(value)` returns `true` if `value` is `NaN`,\
    \ but it also returns `true` for any `value` that cannot be converted to a number.\
    \ To test if the value of variable `v` really *is* `NaN`, use the test `v != v`.\
    \ This works because `NaN` is the only value that is not equal to itself.\n\n\
    Some additional methods are `Number.isInteger(n)`, `Number.isSafeInteger(n)`,\
    \ and `Number.isFinite(n)`.\n\nA `bigint` is an integer written with an `n` suffix,\
    \ for example, `123n`. Bigints can have an arbitrary number of digits. All the\
    \ usual numeric operations are available on bigints, except for unary plus: `+123n`\
    \ is illegal.\n\nBigints and (ordinary) numbers cannot be mixed in an arithmetic\
    \ expression, but bigints and numbers can be compared (using `<`, `<=`, etc.).\
    \ To convert between the two types, use `BigInt(number)` and `Number(bigint)`.\n\
    \nA `hexadecimal literal` begins with `0x` or `0X`. An `octal literal` begins\
    \ with `0o` or `0O`.\n\nIn strict mode, it is illegal to write a number with a\
    \ leading zero (e.g. `0123`), except for zero itself. In nonstrict mode, some\
    \ implementations will treat such numbers as octal and others will treat them\
    \ as decimal.\n\n### 3.4.2 Strings\n\nA `string` is a sequence of zero or more\
    \ UTF-16 characters enclosed in either single quotes (`'hello'`), double quotes\
    \ (`\"hello\"`), or backticks (``hello````). UTF-32 is not supported.\n\nQuote\
    \ marks of one type may be used within a string enclosed by a different type of\
    \ quote mark, for example, `\"Don't go.\"`. Quote marks of the same type as the\
    \ enclosing type must be escaped (see below).\n\nStrings enclosed in backticks\
    \ are special. They may span several lines, and anywhere in the string that `${expression}`\
    \ occurs, the `expression` is evaluated and becomes part of the string. Strings\
    \ like this are called `template literals`.\n\nThere is no “character” data type.\
    \ Some characters that cannot be written directly in a string can be “escaped,”\
    \ that is, specified by a backslash followed by a letter or hex number. Characters\
    \ written in this way still count as single characters.\n\nEscaped characters\
    \ are:\n\n*   `\\0` NUL\n*   `\\b` backspace\n*   `\\f` form feed\n*   `\\n` newline\n\
    *   `\\r` carriage return\n*   `\\t` horizontal tab\n*   `\\v` vertical tab\n\
    *   `\\\\` backslash\n*   `\\'` single quote\n*   `\\\"` double quote\n\n### 3.4.3\
    \ Booleans\n\nA `boolean` has two values: `true` and `false`. These values are\
    \ the result of logical operations and comparisons.\n\n```\n let a = true;\n let\
    \ b = false;\n let c = a && b; // false\n let d = a || b; // true\n let e = !a;\
    \ // false\n```\n\n### 3.4.4 Null and Undefined\n\n`null` represents the intentional\
    \ absence of any object value. `undefined` means a variable has been declared\
    \ but not not assigned a value.\n\n```\n let a; // undefined\n let b = null;\n\
    ```\n\n> **Note**: `typeof null` returns \"object\".\n\n### 3.4.5 Objects\n\n\
    An `object` is a collection of properties, where each property is a mapping from\
    \ a string key to a value.\n\n```\n let user = {name: \"Alice\", age: 30};\n```\n\
    \nProperties can be accessed using dot notation or bracket notation:\n\n```\n\
    \ console.log(user.name); // Alice\n console.log(user[\"name\"]); // Alice\n```\n\
    \nProperties can be added, modified, or deleted:\n\n```\n user.city = \"New York\"\
    ;\n user.age = 31;\n delete user.age;\n```\n"
