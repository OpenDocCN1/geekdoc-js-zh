    \n```\n <input type=\"button\" value=\"Click me\">\n <input type=\"submit\" value=\"\
    Send it\">\n <input type=\"reset\" value=\"Forget it\">\n```\n\nThen, the new\
    \ way:\n\n```\n <button type=\"button\">Click me</button>\n <button type=\"submit\"\
    >Send it</button>\n <button type=\"reset\">Forget it</button>\n```\n\nThe old\
    \ way puts the text of the button in a `value` property, so it can only be text.\
    \ The new way puts it between `<button>` and `</button>`, so it can be almost\
    \ anything.\n\n*   When a “plain” button (`type=\"button\"`) is clicked, no default\
    \ action occurs.\n\n*   A ***submit button*** has the default text `Submit`, and\
    \ the default action of sending all the information on the enclosing form to the\
    \ server. (More on this shortly.)\n\n*   A ***reset button*** has the default\
    \ text `Reset`, and the default action of clearing everything on the form to its\
    \ original values. This action tends to annoy users.\n\n> **Note**: A button without\
    \ an explicit `type` attribute behaves like `type=\"button\"` *except in a form*,\
    \ where it behaves like a `type=\"submit\"` button.\n\nOne very convenient feature\
    \ of forms is that they define a scope. Any widget within a form can have a `name`\
    \ property, and this name can be used by other widgets in the same form. For example:\n\
    \n```\n <form>\n    <input name='tx1' type=\"text\">\n    <input type=\"button\"\
    \n     value=\"Look in text field\"\n     onclick=\"alert('You entered: ' + tx1.value)\"\
    >\n   </form>\n```\n\nAn `id` must be unique on the entire HTML page and can be\
    \ accessed by calling `getElementById(`***id***`)` from within scripts; a `name`\
    \ should be unique within a form, and can be accessed directly by other widgets\
    \ in the same form. Any widget can have a `name` and an `id`.\n\nThere is seldom\
    \ any need for more than one form on a page, so it can be referenced by `document.getElementsByTagName(\"\
    form\")[0]`, or by its `id` if it has one. It is possible to have more than one\
    \ form on a page, but forms may not be nested; that is, you cannot have a form\
    \ inside a form.\n\nA `submit` button within a form will, when clicked, submit\
    \ that form. Outside a form, a `submit` button can use the attribute `form=\"\
    `***formId***`\"` to submit the form with that id.\n\n> **Caution**: If a form\
    \ has a `submit` button, pressing Enter when in an input field of the form will\
    \ also submit the form.\n\n### 4.4.7 Form Verification\n\nWhen a user clicks a\
    \ `Submit` button, it usually makes sense to check the information in the form\
    \ before sending it to the server. Not everything can be checked, of course, but\
    \ many things can. Have any required fields been left blank? Are there unexpected\
    \ characters in numeric fields? Does a credit card number have the right number\
    \ of digits?\n\nIf a tag `<input type=\"text\" …>` contains the attribute `required`\
    \ (with no value, just the word `required`), attempting to submit that form will\
    \ cause the text field to be checked to make sure it is not blank. If it is blank,\
    \ a small pop-up will appear next to the text field containing the words “Please\
    \ fill in this field.”\n\nA text field may have an attribute `pattern=\"`***regexp***`\"\
    ` to specify by a regular expression ***regexp*** exactly what may be entered\
    \ into the text field; it will be checked when the `Submit` button is clicked.\
    \ An erroneous entry will be flagged with “Please match the requested format.”\
    \ The ***regexp*** is given as a string, not bounded by slashes.\n\nA text field\
    \ may have a `placeholder=\"`***text***`\"` attribute; the ***text*** is displayed\
    \ as a hint to the user about what should be entered. The ***text*** will disappear\
    \ when the user types into the field but reappears if the field becomes blank\
    \ again.\n\nOne way to do arbitrary validation testing is to put an `onsubmit`\
    \ property in the `<form>` tag, with a value that has the syntax `return` ***function_call***;\
    \ for example,\n\n```\n <form onsubmit=\"return validate()\">\n    Type a number:\n\
    \    <input name='num' type=\"text\">\n    <br>\n    <input type=\"submit\">\n\
    \   </form>\n```\n\nIn this example, the function `validate()` will be called\
    \ when the `submit` button is clicked. If validation fails, the function should\
    \ call `event.preventDefault()`, otherwise the submission will succeed. Either\
    \ way, it is appropriate to inform the user.\n\n### 4.4.8 Form Submission\n\n\
    When a form is submitted, the `action` attribute of the `form` tag tells the program\
    \ *where* to send the data, and the `method` attribute tells *how* to send the\
    \ data.\n\nA `form` tag may contain `action=\"`***URL***`\"` (Uniform Resource\
    \ Locator) specifying the URL to which the information is to be sent. If the `action`\
    \ property is not present, the URL of the page containing the form is used.\n\n\
    The two most commonly used values of the `method` attribute are `\"get\"` and\
    \ `\"post\"`.\n\n#### 4.4.8.1 Get Requests"
