    \ in a modal dialog box, with a place for the user to enter text. The second parameter\
    \ is optional; if given, it will be shown in the text field.\n\n    *   The dialog\
    \ box has two buttons: `OK`, to return the user’s entry as a string, and `Cancel`,\
    \ to return `null`.\n\n*   ***result*** `= confirm(`***question***`);`\n\n   \
    \ *   This displays the ***question*** in a modal dialog box with two buttons:\
    \ `OK`, to return `true`, and `Cancel`, to return `false`.\n\n## 1.6 Producing\
    \ Output\n\nThere are several functions to display the results of your code. For\
    \ browser use, remember to put your function calls inside `<script>`…`</script>`\
    \ tags.\n\n*   `alert(`***arg***`)`\n\n    *   This is the simplest way to see\
    \ a result. Calling `alert` with one argument of any type will pop up a dialog\
    \ box containing the given value. There are two disadvantages: The dialog box\
    \ is modal, which means that it must be dismissed before computation can continue;\
    \ and you only get to see one message at a time.\n\n*   `console.log(`***args***`)`\n\
    \n    *   If you have a console open, this method will display something on it,\
    \ but exactly what it displays is highly implementation dependent. It may display\
    \ the ***args*** separated by spaces or by newlines, or it may display only the\
    \ first argument. Try it to see what it does in whatever console you prefer to\
    \ use.\n\n    *   Since `console.log` is intended primarily for debugging, most\
    \ implementations will display the actual structure of the ***args***, without\
    \ using the `toString` method.\n\n    *   The `console` has a number of other\
    \ methods, such as `clear()` and `trace()`. Implementation varies.\n\n*   `document.write(`***args***`)`\n\
    \n    *   This will write its arguments to the body of the HTML. If executed as\
    \ the page is being loaded, it writes the arguments directly in that location.\
    \ But if `write` is called *after* the body has been loaded (for example, from\
    \ a function), the call *replaces* the entire HTML body; this is probably not\
    \ what you want.\n\n*   `document.writeln(`***args***`)`\n\n    *   This acts\
    \ just like `write`, except that the method writes a newline after the last argument.\
    \ Since HTML ignores newlines, this is fairly useless. To get a newline that isn’t\
    \ ignored, write the string `\"<br>\"`.\n\nThe advantage of the `alert` and `write`\
    \ methods is that they do not require you to have a console open in order to view\
    \ results.\n\n# Chapter 2 JavaScript The Bare Minimum\n\nDOI: [10.1201/9781003359609-2](https://dx.doi.org/10.1201/9781003359609-2)\n\
    \nThis chapter and [Chapter 3](#ch3.xhtml) describe JavaScript simply as a language,\
    \ without reference to Web programming. It is in two major parts:\n\n**The Bare\
    \ Minimum**—This section is intended to get you started programming in JavaScript\
    \ as quickly as possible. The best way to do that is to try things out as you\
    \ go.\n\n**In More Detail**—This goes over the same material again, filling in\
    \ a lot of the gaps. To some extent, it can also be used as a reference.\n\n##\
    \ 2.1 Comments\n\n`//` introduces a comment that extends to the end of the line.\n\
    \nMulti-line comments start with `/*` and end with `*/`.\n\nInside a comment,\
    \ `//` and `/*` have no special meaning (so you cannot “nest” comments). Inside\
