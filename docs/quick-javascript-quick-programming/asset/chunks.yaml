    \n## 2.2 Data Types\n\n### 2.2.1 Primitives\n\nThere are eight data types:\n\n\
    *   A ***number*** may be written with or without a decimal point, but all numbers\
    \ are stored as double precision floating point.\n\n*   A ***bigint*** is an integer\
