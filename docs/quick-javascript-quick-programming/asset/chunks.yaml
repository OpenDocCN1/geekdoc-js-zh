    \ By convention, the names of variables, properties, functions, and methods should\
    \ begin with a lowercase letter; names of constructors should begin with a capital\
    \ letter. Names may be any length.\n\nCase is significant in JavaScript *but not\
    \ in HTML*. Since JavaScript names are frequently used in HTML, this can lead\
    \ to some strange errors if you are not careful about case.\n\nAs in most other\
    \ languages, you cannot use a reserved word as an identifier.\n\n## 3.3 Destructuring\n\
    \n***Destructuring*** is a way to assign the parts of an object or array into\
    \ several different variables.\n\nAs an example, we use the following object:\n\
    \n```\n let p = { givenName: \"Sally\",\n             familyName: \"Willis\",\n\
    \             occupation: \"doctor\" };\n```\n\nWe may wish to assign the parts\
    \ of this object into separate variables, as\n\n```\n let givenName = p.givenName;\n\
    \ let familyName = p.familyName;\n let occupation = p.occupation;\n```\n\nDestructuring\
    \ is a shorter way to do exactly the same thing:\n\n```\n let {givenName, familyName,\
    \ occupation} = p;\n```\n\nProperty names need not be given in order, and not\
    \ every name has to be mentioned. Property names that are not actually part of\
    \ the object may be given; they will receive the value `undefined`.\n\nTo work\
    \ with a similar object of the same type, say `p2`, you cannot use `let` again\
