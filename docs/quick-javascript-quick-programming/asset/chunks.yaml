- fmt: "\nThe JavaScript methods `Math.min` and `Math.max` each take an arbitrary\
    \ number of arguments; they do *not* take arrays. However, the spread operator\
    \ (`...`) will turn an array into a sequence of values, so `Math.min(...array)`\
    \ and `Math.max(...array)` work fine.\n\n# Appendix B: Higher-Order Methods\n\n\
    There are a number of built-in array methods that take a function as a parameter.\
    \ Arrow functions are often used as arguments, though functions defined in other\
    \ ways may be used. In the following, we use `f` for a function that takes one\
    \ argument and `f2` for a function that takes two arguments.\n\n*   `array.sort(f2)`\
    \ — Sorts the array in place and also returns the sorted array. If `f2(x, y)`\
    \ returns a negative result, `x` is considered to be less than `y`; if zero, equal;\
    \ if positive, `x` is greater than `y`..\n    *   For example, `a.sort((x, y)\
    \ => x - y))` sorts the array `a` in ascending numeric order.\n*   `array.forEach(f)`\
    \ — Calls the function `f` for each element of `array`. To be useful, `f` should\
    \ have side effects, since any values returned by `f` are ignored.\n*   `array.find(f)`\
    \ — Finds and returns the first value in `array` for which `f` returns a truthy\
    \ value (or `undefined` if none is found)\n*   `array.findIndex(f)` — Finds and\
    \ returns the first index of a value in `array` for which `f` returns a truthy\
    \ value (or `-1` if none is found).\n*   `array.map(f)` — Applies `f` to each\
    \ element of `array`, returning an array of the results. Holes, if any, are preserved.\n\
    *   `array.flatMap(f)` — Applies `f` to each element of `array`. If the resulting\
    \ array is multidimensional, one level of nesting is removed, promoting all values\
    \ to the next higher level.\n*   `array.filter(f)` — Returns an array containing\
    \ all and only those values of `array` for which `f` returns a truthy value.\n\
    *   `array.reduce(f2, initial)` — Given a function `f2` of two parameters, applies\
    \ `f2` to `initial` and the first element of `array`, then applies `f2` to that\
    \ result and the second element, and so on, resulting in a single value.\n   \
    \ *   If `array` is empty, `initial` is returned.\n    *   If `array` is known\
    \ to be nonempty, `initial` may be omitted.\n    *   For example, `array((x, y)\
    \ => x + y)` returns the sum of all the elements of `array`.\n*   `array.reduceRight(f2)`\
    \ — Like `reduce`, but works right to left instead of left to right.\n*   `array.some(f)`\
    \ — Returns `true` if array contains at least one element for which `f` returns\
    \ a truthy value.\n    *   `array.every(f)` — Returns `true` if `f` returns a\
    \ truthy value for every element of the array.\n\n# Appendix C: String Methods\n\
    \nHere are some of the more important methods on strings. Strings are *immutable*\
    \ (cannot be modified), hence all string methods return a new string.\n\n*   `string.charAt(n)`\
    \ — Returns the `nth` character of a string. Same as `string[n]`.\n*   `string.charCodeAt(n)`\
    \ — Returns the numeric Unicode value of the `nth` character of a string.\n* \
    \  `string0.concat(string1, …,, stringN)` — Returns the concatenation (joining)\
    \ of all the given strings.\n*   `string.fromCharCode(c1, …,, cN)` — Creates a\
    \ string from the given numeric Unicode values.\n*   `string.includes(substr)`\
    \ — returns `true` if `substr` occurs as a substring of `string`, otherwise `false`.\n\
    *   `string.includes(substr, start)` — returns `true` if `substr` occurs as a\
    \ substring of `string` starting at or after `start`, otherwise `false`.\n*  \
    \ `string.indexOf(substring)` — Returns the position of the first character of\
    \ `substring` in `string`, or `-1` if not found.\n*   `string.indexOf(substring,\
    \ start)` — Returns the position of the first character of `substring` in `string`\
    \ that begins at or after position `start`, or `-1` if not found.\n*   `string.lastIndexOf(substring)`\
    \ — Returns the position of the first character of the last occurrence of `substring`\
    \ in `string`, or `-1` if the substring cannot be found.\n*   `string.lastIndexOf(substring,\
    \ start)` — Returns the position of the first character of the last occurrence\
    \ of `substring` in `string` that occurs at or before position `start`, or `-1`\
    \ if the substring cannot be found.\n*   `string.match(regexp)` — Returns an array\
    \ containing the results of regular expression match, or `null` if no match found:\n\
    \    *   If flag `g` is set, array contains matched substrings.\n    *   If `g`\
    \ is not set, array `0` contains matched text, and parenthesized subexpressions.\
    \ The `index` property gives position of first match.\n*   `string.padEnd(length,\
    \ string2)` — Adds characters from `string2` to the end of `string` as many times\
    \ as needed to form a new string of length `length`. If omitted, `string2` defaults\
    \ to blanks. If `string` is already of length `length` or greater, the result\
    \ is just `string`.\n*   `string.padStart(length, string2)` — Adds characters\
    \ from `string2` to the beginning of `string` as many times as needed to form\
    \ a new string of length `length`. If omitted, `string2` defaults to blanks. If\
    \ `string` is already of length `length` or greater, the result is just `string`.\n\
    *   `string.repeat(n)` — Returns a string consisting of `n` copies of `string`.\n\
    *   `string.replace(target, replacement)` — Returns a string in which the first\
    \ occurrence of `target` has been replaced by `replacement`.\n    *   The `target`\
    \ may be either a string or regular expression. If the `g` flag of a regular expression\
    \ is set, all occurrences of `target` are replaced.\n    *   The `replacement`\
    \ may be the name of a one-parameter function (*not* a method). The function is\
    \ applied to the matched `target` to get the actual replacement value.\n*   `string.replaceAll(target,\
    \ replacement)` — Like `replace`, except that all occurrences of `target` are\
    \ replaced. If `target` is a regular expression, the `g` flag *must* be used (!).\n\
    *   `string.search(target)` — Returns the index of the first character of a string\
    \ that matches the string or regular expression `target`, or `-1` if no such string\
    \ can be found.\n*   `string.slice(start, end)` — Returns a substring of `string`\
    \ starting at position `start` and ending position `end`-1`. If `end` is omitted,\
    \ all characters at and after `start` are returned. The arguments `start` and\
    \ `end` may be negative: `-1` is the last character of `string`, `-2` is the next\
    \ to last, and so on.\n*   `string.split(string2)` — Breaks `string` up into substrings\
    \ using `string2` as a separator, and returns an array of the results. If `string2`\
    \ is the empty string, an array of characters is returned. A regular expression\
    \ may be used in place of `string2`.\n*   `string.substr(start, length)` — Returns\
    \ a substring of at most `length` characters, starting from position `start` of\
    \ `string`. If there are fewer than `length` characters remaining, all remaining\
    \ characters will be returned. The argument `start` may be negative: `-1` is the\
    \ last character of `string`, `-2` is the next to last, and so on.\n"
  raw: "The JavaScript methods `Math.min` and `Math.max` each take an arbitrary number\
    \ of arguments; they do *not* take arrays. However, the spread operator (`...`)\
    \ will turn an array into a sequence of values, so `Math.min(...`***array***`)`\
    \ and `Math.max(...`***array***`)` work fine.\n\n# Appendix B: Higher-Order Methods\n\
    \nThere are a number of built-in array methods that take a function as a parameter.\
    \ Arrow functions are often used as arguments, though functions defined in other\
    \ ways may be used. In the following, we use ***f*** for a function that takes\
    \ one argument and ***f2*** for a function that takes two arguments.\n\n*   ***array***`.sort(`***f2***`)`\
    \ — Sorts the array in place and also returns the sorted array. If ***f2***`(`***x***`,`\
    \ ***y***`)` returns a negative result, ***x*** is considered to be less than\
    \ ***y***; if zero, equal; if positive, ***x*** is greater than ***y***..\n\n\
    \    *   For example, `a.sort((x, y) => x - y))` sorts the array `a` in ascending\
    \ numeric order.\n\n*   ***array***`.forEach(`***f***`)` — Calls the function\
    \ ***f*** for each element of ***array***. To be useful, ***f*** should have side\
    \ effects, since any values returned by ***f*** are ignored.\n\n*   ***array***`.find(`***f***`)`\
    \ — Finds and returns the first value in ***array*** for which ***f*** returns\
    \ a truthy value (or `undefined` if none is found)\n\n*   ***array***`.findIndex(`***f***`)`\
    \ — Finds and returns the first index of a value in ***array*** for which ***f***\
    \ returns a truthy value (or `-1` if none is found).\n\n*   ***array***`.map(`***f***`)`\
    \ — Applies ***f*** to each element of ***array***, returning an array of the\
    \ results. Holes, if any, are preserved.\n\n*   ***array***`.flatMap(`***f***`)`\
    \ — Applies ***f*** to each element of ***array***. If the resulting array is\
    \ multidimensional, one level of nesting is removed, promoting all values to the\
    \ next higher level.\n\n*   ***array***`.filter(`***f***`)` — Returns an array\
    \ containing all and only those values of ***array*** for which ***f*** returns\
    \ a truthy value.\n\n*   ***array***`.reduce(`***f2***`,` ***initial***`)` — Given\
    \ a function ***f2*** of two parameters, applies ***f2*** to ***initial*** and\
    \ the first element of ***array***, then applies ***f2*** to that result and the\
    \ second element, and so on, resulting in a single value.\n\n    *   If ***array***\
    \ is empty, ***initial*** is returned.\n\n    *   If ***array*** is known to be\
    \ nonempty, ***initial*** may be omitted.\n\n    *   For example, ***array***`((x,\
    \ y) => x + y)` returns the sum of all the elements of ***array***.\n\n*   ***array***`.reduceRight(`***f2***`)`\
    \ — Like `reduce`, but works right to left instead of left to right.\n\n*   ***array***`.some(`***f***`)`\
    \ — Returns `true` if array contains at least one element for which ***f*** returns\
    \ a truthy value.\n\n    *   ***array***`.every(`***f***`)` — Returns `true` if\
    \ ***f*** returns a truthy value for every element of the array.\n\n# Appendix\
    \ C: String Methods\n\nHere are some of the more important methods on strings.\
    \ Strings are ***immutable*** (cannot be modified), hence all string methods return\
    \ a new string.\n\n*   ***string***`.charAt(`***n***`)` — Returns the ***nth***\
    \ character of a string. Same as ***string***`[`***n***`]`.\n\n*   ***string***`.charCodeAt(`***n***`)`\
    \ — Returns the numeric Unicode value of the ***nth*** character of a string.\n\
    \n*   ***string0***`.concat(`***string1***`,` …`,` ***stringN***`)` — Returns\
    \ the concatenation (joining) of all the given strings.\n\n*   ***string***`.fromCharCode(`***c1***`,`\
    \ …`,` ***cN***`)` — Creates a string from the given numeric Unicode values.\n\
    \n*   ***string***`.includes(`***substr***`)` — returns `true` if ***substr***\
    \ occurs as a substring of ***string***, otherwise `false`.\n\n*   ***string***`.includes(`***substr***`,`\
    \ ***start***`)` — returns `true` if ***substr*** occurs as a substring of ***string***\
    \ starting at or after ***start***, otherwise `false`.\n\n*   ***string***`.indexOf(`***substring***`)`\
    \ — Returns the position of the first character of ***substring*** in ***string***,\
    \ or `-1` if not found.\n\n*   ***string***`.indexOf(`***substring***`,` ***start***`)`\
    \ — Returns the position of the first character of ***substring*** in ***string***\
    \ that begins at or after position ***start***, or `-1` if not found.\n\n*   ***string***`.lastIndexOf(`***substring***`)`\
    \ — Returns the position of the first character of the last occurrence of ***substring***\
    \ in ***string***, or `-1` if the substring cannot be found.\n\n*   ***string***`.lastIndexOf(`***substring***`,`\
    \ ***start***`)` — Returns the position of the first character of the last occurrence\
    \ of ***substring*** in ***string*** that occurs at or before position ***start***,\
    \ or `-1` if the substring cannot be found.\n\n*   ***string***`.match(`***regexp***`)`\
    \ — Returns an array containing the results of the regular expression match, or\
    \ `null` if no match is found. On a successful match:\n\n    *   If the flag `g`\
    \ is set, the array contains the matched substrings.\n\n    *   If `g` is not\
    \ set, array location `0` contains the matched text, and remaining locations contain\
    \ text matched by any parenthesized subexpressions. The array `index` property\
    \ gives the position of the first character of the match.\n\n*   ***string***`.padEnd(`***length***`,`\
    \ ***string2***`)` — Adds characters from ***string2*** to the end of ***string***\
    \ as many times as needed to form a new string of length ***length***. If omitted,\
    \ ***string2*** defaults to blanks. If ***string*** is already of length ***length***\
    \ or greater, the result is just ***string***.\n\n*   ***string***`.padStart(`***length***`,`\
    \ ***string2***`)` — Adds characters from ***string2*** to the beginning of ***string***\
    \ as many times as needed to form a new string of length ***length***. If omitted,\
    \ ***string2*** defaults to blanks. If ***string*** is already of length ***length***\
    \ or greater, the result is just ***string***.\n\n*   ***string***`.repeat(`***n***`)`\
    \ — Returns a string consisting of ***n*** copies of ***string***.\n\n*   ***string***`.replace(`***target***`,`\
    \ ***replacement***`)` — Returns a string in which the first occurrence of ***target***\
    \ has been replaced by ***replacement***.\n\n    *   The ***target*** may be either\
    \ a string or a regular expression. If the `g` flag of a regular expression is\
    \ set, all occurrences of ***target*** are replaced.\n\n    *   The ***replacement***\
    \ may be the name of a one-parameter function (*not* a method). The function is\
    \ applied to the matched ***target*** to get the actual replacement value.\n\n\
    *   ***string***`.replaceAll(`***target***`,` ***replacement***`)` — Like `replace`,\
    \ except that all occurrences of target are replaced. If ***target*** is a regular\
    \ expression, the `g` flag *must* be used (!).\n\n*   ***string***`.search(`***target***`)`\
    \ — Returns the index of the first character of a string that matches the string\
    \ or regular expression ***target***, or `-1` if no such string can be found.\n\
    \n*   ***string***`.slice(`***start***`,` ***end***`)` — Returns a substring of\
    \ ***string*** starting at position ***start*** and ending position ***end***`-1`.\
    \ If ***end*** is omitted, all characters at and after ***start*** are returned.\
    \ The arguments ***start*** and ***end*** may be negative: `-1` is the last character\
    \ of ***string***, `-2` is the next to last, and so on.\n\n*   ***string***`.split(`***string2***`)`\
    \ — Breaks ***string*** up into substrings using ***string2*** as a separator,\
    \ and returns an array of the results. If ***string2*** is the empty string, an\
    \ array of characters is returned. A regular expression may be used in place of\
    \ ***string2***.\n\n*   ***string***`.substr(`***start***`,` ***length***`)` —\
    \ Returns a substring of at most ***length*** characters, starting from position\
    \ ***start*** of ***string***. If there are fewer than ***length*** characters\
    \ remaining, all remaining characters will be returned. The argument ***start***\
    \ may be negative: `-1` is the last character of ***string***, `-2` is the next\
    \ to last, and so on."
