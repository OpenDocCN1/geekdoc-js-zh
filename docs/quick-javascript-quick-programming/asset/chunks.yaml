    \ have a higher precedence than `??`.\n\n> **Note**: When `??` is used in an expression\
    \ with either `&&` or `||`, parentheses *must* be used to show the desired order\
    \ of operations.\n\n## 3.9 Bad Operators\n\nIn his excellent book *JavaScript:\
    \ The Good Parts*, Douglas Crockford made the case that there are features of\
    \ JavaScript that should not be used. We mention a number of these, with brief\
    \ explanations, in [Table 3.3](#ch3.xhtml_table3_3).\n\n[Table 3.3 JavaScript’s\
    \ “Bad” Operators](#ch3.xhtml_R_table3_3)\n\n| Operator | Purpose | Associativity\
