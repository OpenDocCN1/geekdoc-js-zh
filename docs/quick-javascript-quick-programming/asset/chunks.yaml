    \ = p;\n // name = \"Willis\", occ = \"doctor\"\n```\n\nDefault values may be\
    \ given, in case the object lacks the given properties.\n\n```\n ({givenName:\
    \ name, country = \"USA\"} = p);\n // name = \"Sally\", country = \"USA\"\n```\n\
    \nRenaming and giving default values may be combined.\n\n```\n ({givenName: name=\"\
    Joe\", age=40} = p);\n // name = \"Sally\", age = 40\n```\n\nWhen a function is\
