- fmt: "\n**Note**: To be technically correct, it should be noted that the `timeout`\
    \ and `interval` methods available to windows are not defined in the `Window`\
    \ object, but inherited from elsewhere. This makes little practical difference.\n\
    \n### 4.5.1.3 Window Example\n\nSuppose we have the following JavaScript code\
    \ (enclosed in `<script>` tags) in the head of the HTML document:\n\n```\n \"\
    use strict\";\n   let win2, timer;\n\n   function display(str) {\n    let e =\
    \ document.getElementById(\"para\");\n    e.innerHTML = str;\n   }\n\n   function\
    \ google(str) {\n    console.log(window);\n    win2 = window.location =\n    \
    \ \"<uri>https://google.com</uri>\" + \"?q=\" + str;\n   }\n\n   function googleIt()\
    \ {\n    display(\"Going to Google in 5 seconds.\");\n    let term =\n     document.getElementById(\"\
    search\").value;\n    timer = setTimeout(google, 5000, term);\n   }\n\n   function\
    \ cancel() {\n    display(\"\");\n    clearTimeout(timer);\n   }\n```\n\nand in\
    \ the body:\n\n```\n <button onclick=\"googleIt()\">Google</button>\n   <input\
    \ type=\"text\" id=\"search\">\n   <button onclick=\"cancel()\">Cancel</button>\n\
    \   <br>\n   <p id=\"para\"></p>\n```\n\nWhen the HTML page is loaded, it shows\
    \ a button labeled `Google`, a text field, and a second button labeled `Cancel`.\n\
    \nWhen the first button is clicked, it calls the `googleIt()` function. That function\
    \ calls `display` to find the `Element` with the id `para`, which is an initially\
    \ empty paragraph, and sets it to contain the text “Going to Google in 5 seconds.”\
    \ Then the `googleIt()` function finds the text field with the id `search` and\
    \ gets its text into a variable named `term`. Finally, `googleIt` sets a timer\
    \ that will call the `google` function with the argument `term` after 5 seconds\
    \ (5000 milliseconds).\n\n> **Note**: This will only work if the browser permits\
    \ it, which depends on the browser’s settings.\n\nIf the `Cancel` button is clicked\
    \ within five seconds, the `cancel` method will erase the text in the paragraph\
    \ whose `id` is `para`, then cancel the timer (whose id has been saved in the\
    \ global variable `timer`). Consequently, the timer event will not occur, and\
    \ `google()` will not be called.\n\nIf the `Cancel` button is not clicked, the\
    \ `google` function will try to open a browser tab to [google.com](https://google.com),\
    \ with the search term passed to it as an argument, and will save the window id\
    \ in a global variable named `win2`.\n\n> **Note**: The `?` appended to the URL\
    \ provides information to the server as `name`=`value` pairs. Multiple `name`=`value`\
    \ pairs are separated by ampersands (`&`). Google recognizes, among other names,\
    \ `q` for “query.”\n\n### 4.5.2 The Document Object\n\nA `document` represents\
    \ an HTML page.\n\nThe name `window` refers to the window displaying the HTML;\
    \ `window.document` refers to the HTML in that window (or more accurately, the\
    \ tree of `Node`s representing that HTML). Document properties and methods must\
    \ be prefixed by `document.`.\n\nThe constructor `new Document()` will return\
    \ a new HTML page, complete with an empty head and body.\n\n#### 4.5.2.1 Document\
    \ Properties\n\nHere are a few of the properties of `document`:\n\n*   `document.documentElement`\
    \ — An `HTMLHtmlElement` whose `innerHTML` is the text of the `<html>` tag.\n\n\
    *   `document.head` — An `HTMLHeadElement` whose `innerHTML` is the text in the\
    \ document’s `<head>`.\n\n*   `document.body` — An `HTMLBodyElement` whose `innerHTML`\
    \ is the text in the document’s `<body>`.\n\n*   `document.title` — The document’s\
    \ title, as a string.\n\n*   `document.URL` — The document’s read-only URL as\
    \ a string, including the protocol (such as `http://`).\n\n*   `document.bgColor`\
    \ — The background color of the document; may be changed by assignment. The assigned\
    \ value should be a string such as `\"red\"`, `\"#ff0000\"`, or `\"ff0000\"`,\
    \ not a JavaScript-style hexadecimal number.\n\n*   `document.fgColor` — the foreground\
    \ (text) color of the document, assignable in the same way as `bgColor`.\n\nThe\
    \ purpose of HTML has always been to describe the structure of a document, but\
    \ from the beginning it had a number of features to control style. Modern HTML\
    \ has deprecated many of these, with style elements (colors, borders, fonts, etc.)\
    \ being described instead by `CSS`, `Cascading Style Sheets`. There are a huge\
    \ number of style attributes; below is a brief sampling.\n\n```javascript\n document.body.style.backgroundColor\
    \ = \"#EEEEEE\"\n document.body.style.color = \"#999999\"\n document.body.style.border\
    \ = \"thick solid #0000FF\";\n document.body.style.borderColor = \"#00ff00\";\n\
    \ document.body.style.fontFamily = \"Courier New, Impact\"\n document.body.style.fontSize\
    \ = \"24pt\"\n```\n\nIn order, these (1) set the background color to light gray,\
    \ (2) set the text color to a hard-to-read dark gray, (3) set the border around\
    \ the entire document to thick blue, (4) set the border color to green, (5) set\
    \ the font to Courier New, (6) set the font size to 24pt.\n\n#### 4.5.2.2 Finding\
    \ Nodes\n\nTo manipulate the DOM, it is necessary to be able to find specific\
    \ elements. For example, there are several ways this can be done.\n\n*   `document.getElementById(id)`\
    \ — Returns the `Element` with the id.\n\n*   `document.getElementsByTagName(tagName)`\
    \ — Returns a live collection of all the `tagName`.\n\n*   `document.getElementsByClassName(className)`\
    \ — Returns an HTMLCollection of all the elements with the class.\n\n*   `document.querySelector(selector)`\
    \ — Returns the first element within the `document` that is matched by the CSS\
    \ selector.\n\n*   `document.querySelectorAll(selector)` — Returns all elements\
    \ within the `document` that are matched by the CSS selector.\n\nSome selectors\
    \ are:\n\n*   `tagName` — To select all elements with the given `tagName`.\n\n\
    *   `#id` — To select the one specific element with the given id.\n\n*   `.className`\
    \ — To select all elements with the attribute `className`.\n\n*   `tagName.className`\
    \ — To select all elements that have the given `tagName` and also have the attribute\
    \ `className`.\n\n*   `*` — To select all elements.\n\n*   `selector1, selector2`\
    \ — To select all elements of type `selector1` and all elements of type `selector2`.\n\
    \n*   `selector1 > selector2` — To select all elements of type `selector2` that\
    \ are children of elements selected by `selector1`.\n\n*   `selector1 selector2`\
    \ — To select all elements of type `selector2` that are descendants (children\
    \ of children, etc.) of elements selected by `selector1`.\n\n*   `selector1 ~\
    \ tagName2` — To select all elements of type `tagName2` that are subsequent (later)\
    \ siblings of `selector1` elements.\n\n*   `selector1 + selector2` — To select\
    \ each element of type `selector2` that immediately follows (is the next sibling\
    \ of) `selector1` elements.\n"
