    \nLC record available at [https://lccn.loc.gov/2022046807](https://lccn.loc.gov/2022046807)\n\
    \nISBN: 978-1-032-41757-8 (hbk)\n\nISBN: 978-1-032-41756-1 (pbk)\n\nISBN: 978-1-003-35960-9\
    \ (ebk)\n\nDOI: [10.1201/9781003359609](https://dx.doi.org/10.1201/9781003359609)\n\
    \nTypeset in Minion\n\nby SPi Technologies India Pvt Ltd (Straive)\n\n*To all\
    \ my students*\n\n*past, present, and future*\n\n# Author\n\nI’m David Matuszek,\
    \ known to most of my students as “Dr. Dave.”\n\nI wrote my first program on punched\
    \ cards in 1963 and immediately got hooked.\n\nI taught my first computer classes\
    \ in 1970 as a graduate student in computer science at the University of Texas\
    \ at Austin. I eventually earned a PhD there, and I’ve been teaching ever since.\
    \ Admittedly, I spent over a dozen years in industry, but even then I taught as\
    \ an adjunct for Villanova University.\n\nI finally escaped from industry and\
    \ joined the Villanova faculty full time for a few years, and then moved to the\
    \ University of Pennsylvania, where I directed a master’s program (`MCIT`, Masters\
    \ in Computer and Information Technology) for students coming into computer science\
    \ from another discipline.\n\nThroughout my career, my main interests have been\
    \ in artificial intelligence (AI) and programming languages. I’ve used a *lot*\
    \ of programming languages.\n\nI retired in 2017, but I can’t stop teaching, so\
    \ I’m writing a series of “quick start” books on programming and programming languages.\
    \ I’ve also written two science fiction novels, *Ice Jockey* and *All True Value*,\
    \ and I expect to write more. Check them out!\n\nIf you found this book useful,\
    \ it would be wonderful if you would post a review. Reviews, even critical ones,\
    \ help to sell books.\n\nAnd, hey, if you’re a former student or colleague, drop\
    \ me a note at [david.matuszek@gmail.com](mailto:david.matuszek@gmail.com). I’d\
    \ love to hear from you!\n\n# Preface\n\nIf you are a programmer who wants to\
    \ get started programming in JavaScript as quickly as possible, this book is for\
    \ you.\n\nIf you are hoping to learn JavaScript as your first programming language,\
    \ this book is for you.\n\n# Versions of JavaScript\n\nJavaScript is an evolving\
    \ language. It is defined by a series of standards known as `ECMAScript`.\n\n\
    # Chapter 1 Introduction\n\nDOI: [10.1201/9781003359609](https://dx.doi.org/10.1201/9781003359609)\n\
    \n## 1.1 Hello, World!\n\nTraditionally, the first program to be written in a\
    \ new language is one that prints out “Hello, World!” We will follow that tradition.\n\
    \nThe one line of JavaScript needed is:\n\n```\nalert(\"Hello, World!\");\n```\n\
    \nTo execute this code, we have several options:\n\n*   Put it in a web page and\
    \ run it in a browser.\n*   Run it in an `IDE` (*Integrated Development Environment*).\n\
    *   Run it from an editor application.\n*   Run it from an online JavaScript editor.\n\
    \n## 1.2 JavaScript in the Browser\n\nIf you save the following text in a file\
    \ and then open the file in a browser, an alert dialog containing the text `Hello,\
    \ World!` will appear.\n\n```html\n<!DOCTYPE html>\n   <html>\n    <head>\n  \
    \   <title>Using JavaScript</title>\n    </head>\n    <body>\n     <script>\n\
    \      alert(\"Hello, World!\");\n     </script>\n    </body>\n   </html>\n```\n\
    \n*   The `<!DOCTYPE html>` tag says that this is an HTML document.\n*   The entire\
    \ page is enclosed in the \"container\" `<html>` down to `</html>`. Tags beginning\
    \ with `</` denote the end of a container. In this example, only the `!DOCTYPE`\
    \ tag is not a container.\n*   The `<title>` tag contains the text that will be\
    \ displayed in the header bar of the page.\n*   The HTML document is divided into\
    \ two parts: the `<head>` contains assorted information that is not displayed\
    \ and the `<body>` contains the part that is displayed.\n*   The `<script>` tag\
    \ contains the JavaScript code. Typically, JavaScript functions are defined in\
    \ `<script>` tags in the `<head>` and calls to them are made in `<script>` tags\
    \ or in “event handlers” in the `<body>`.\n\n## 1.3 Browser Consoles\n"
