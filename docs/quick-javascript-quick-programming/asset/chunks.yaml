    \ `firstChild`, `nextSibling`, `previousSibling`, and `lastChild`.\n\nText and\
    \ comments are represented by `Text` and `Comment` nodes, not `Element` nodes,\
    \ so they do not show up in properties and methods that return only `Element`s.\
    \ For example, an `Element` has a `childNodes` property that is a collection of\
    \ all its children, and a `children` property that is a collection of only those\
    \ children that are `Element`s.\n\nIn addition to the web page as described by\
    \ the HTML, there are a large number of *events* happening all the time. Every\
    \ keystroke, every mouse movement, and many other things cause events to occur.\
    \ An interactive web page “listens for” and responds to a small subset of these\
    \ events.\n\n## 4.4 Graphical User Interfaces\n\nA ***Graphical User Interface***,\
    \ or ***GUI***, is a means of allowing the program to interact with a user. It\
    \ typically consists of familiar controls, or ***widgets***, such as buttons,\
    \ text boxes, checkboxes, menu items, and the like.\n\nGUIs can be used to create\
    \ stand-alone programs, or they can be used to collect information to send back\
    \ to a server (such as when ordering merchandise). A ***form*** is a container\
    \ for widgets whose purpose is to collect information into a single bundle.\n\n\
    ### 4.4.1 Events\n\nGUI programs are different from other programs. Instead of\
    \ one continuous sequence of code that runs from beginning to end, GUI programs\
    \ are ***event-driven***. When an “interesting” event occurs, some code is triggered\
    \ to ***handle*** it. The code finishes, then nothing more happens until another\
    \ “interesting” event occurs.\n\nAn “interesting” event is simply one that the\
    \ programmer has written some code to handle. Events are happening all the time;\
    \ practically anything that happens generates one or more events. The mouse moves\
    \ over an HTML element? That’s an event. The mouse moves out of an HTML element?\
    \ That’s another event. In fact, if the mouse moves at all, that’s an event. There\
    \ are over 70 kinds of events, all with names beginning with “`on`,” such as `onclick`.\n\
    \nThe key point is that events are happening all the time; the programmer doesn’t\
    \ have to do anything to create them. If the user clicks a button, that’s an event\
    \ that (normally) should be handled. If the user clicks a word in a paragraph,\
    \ probably that event should be ignored. The programmer gets to decide which events\
    \ to handle.\n\n### 4.4.2 Widgets\n\n***Widgets*** are GUI elements. Each is represented\
    \ by a tag in HTML, and a corresponding `Element` in the DOM. Typical widgets\
    \ are buttons, text fields, text areas, checkboxes, radio buttons, scroll bars,\
    \ and a number of other types.\n\nMost GUI elements can be written using an `<input>`\
    \ tag with a `type` attribute. If `type` is omitted, `text` is assumed; this is\
    \ a box allowing one line of text to be entered.\n\nHere are the possible values\
    \ for `type`: `button`, `checkbox`, `color`, `date`, `datetime-local`, `email`,\
    \ `file`, `hidden`, `image`, `month`, `number`, `password`, `radio`, `range`,\
    \ `reset`, `search`, `submit`, `tel` (telephone), `text`, `time`, `url`, `week`.\n\
    \nThere are a few widgets that have their own tag, rather than being a value of\
    \ `type`: `button`, `fieldset`, `label`, `option`, `optgroup`, `output`, `select`.\n\
    \n### 4.4.3 Buttons\n\nButtons are ***active elements***: When the user clicks\
    \ a button, it should cause something to happen. Moreover, it is only polite to\
    \ provide a visual cue that something has been done. For example, if the user\
    \ clicks a `Save` button to save a file, and nothing visible occurs, the user\
    \ may well get frustrated and click the button over and over again.\n\nThere are\
    \ two ways to create a button:\n\n```\n <input type=\"button\" value=\"Click me\"\
    \ onclick=\"alert('Hello')\">\n\n <button onclick=\"alert('Hello')\">Click me\n\
    \ </button>\n```\n\nEach of these will appear on the web page as a button containing\
    \ the words `Click me`. Each of them, when clicked, calls the `alert` function\
    \ with the argument `'Hello'`. The `<button>` tag requires a closing tag; the\
    \ `<input>` tag does not. The `<button>` tag is newer and more flexible; for example,\
    \ its `innerHTML` can be an image (using the `<img>`) tag, rather than just text.\n\
    \n```\n <button onclick=\"alert('Ouch!')\">\n    <img src=\"band-aid.png\"></button>\n\
    ```\n\nThe value of the `onclick` property should be a string containing JavaScript\
    \ code, to be executed when the button is clicked—this is an ***event handler***.\
    \ Typically an event handler is a single function call, so that all substantive\
    \ JavaScript code can be kept in one place rather than scattered throughout the\
    \ HTML page. In the above examples, the function called is the `alert` function.\n\
    \n> **Note**: The JavaScript code in an event handler must be a quoted string.\
    \ Since the code itself may contain quoted strings, two kinds of quotes are commonly\
    \ used, such as single quotes within double quotes.\n\nThe text on a button can\
    \ be changed by JavaScript. For buttons defined with an `input` tag, the button’s\
    \ text is in its `value` attribute; for buttons defined with the `button` tag,\
    \ the button’s text is in its `innerHTML`.\n\n### 4.4.4 Finding Widgets\n\nThere\
    \ are a number of ways to specify a particular widget. Here are two:\n\n*   `document.getElementById(\"\
    `***id***`\")` — Returns the one element on the page whose tag has the attribute\
    \ `id=\"`***id***`\"`. Ids must be unique on the page.\n\n*   `document.getElementsByTagName(\"\
    `***tagName***`\")` — Get an indexable collection of all the elements on the page\
    \ with the given ***tagName***.\n\nThere are two commonly used types of ***collection***\
    \ in the DOM. The `getElementsByTagName` method returns a *live* `HTMLCollection`\
    \ of elements, while the `childNodes` property of a node is a *live* `NodeList`\
    \ of nodes."
