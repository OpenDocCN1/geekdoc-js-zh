  trans: "\n\n*   这是一个**具名函数字面量**。名称 `sqr` 的作用域是函数块，因此它**仅**在函数体内部可用，在函数体内部它可以用于递归调用该函数。\n\
    \n```javascriptlet square = (x) => x * x;\n```\n\n*   这是一个**箭头函数**。如果只有一个参数，可以省略括号。箭头后的单个表达式就是结果。\n\
    \n```javascript\nlet square = (x) => { return x * x; }\n```\n\n*   这是另一个**箭头函数**，展示了可以使用大括号，在这种情况下需要\
    \ `return` 语句。\n\n所有函数都有一个 `name` 属性。\n\n*   如果使用 `Function` 构造函数创建函数，则名称为 `\"\
    anonymous\"`。\n*   如果名称紧跟在 `function` 关键字之后，那么该名称就是函数的名称。\n*   如果将一个匿名函数立即赋值给变量，则该变量将成为函数的名称。\n\
    *   否则，函数的名称为空字符串。\n\n函数语句可以定义在其他函数内部，但它们应该位于函数的顶层，而不是在循环或 `if` 语句等语句内部。此类函数对于闭包函数是局部的：\n\
    \n```javascript\n function hypotenuse(x, y) {\n    function square(x) { return\
    \ x * x }\n    return Math.sqrt(square(x) + square(y));\n   }\n```\n\n原始值（`number`、`string`、`boolean`）是**按值**传递给函数的；对象是**按引用**传递的。这意味着函数接收的是原始值的副本，因此对它们进行的任何操作都不会在调用程序中产生影响。对于对象，函数接收的是实际对象的引用；对对象内部的任何更改都将由调用程序看到。\n\
    \n换句话说，在函数内部更改参数的值不会改变函数外部的值，但更改作为参数传递的对象的属性会改变函数外部的值。\n\n### 3.10.2 参数 (Parameters)\
    \ 与 实 (Arguments)\n\n我们使用以下术语：**参数**（parameter）是函数定义头部的变量；**参数**（argument）是调用该函数时的表达式。\n\
    \nJavaScript 并不要求调用函数时的参数数量与其参数数量相同。多余的参数会被忽略，而缺失的参数值值为 `undefined`。\n\n在函数中，特殊变量\
    \ `arguments` 是一个类数组对象，保存了函数调用时传递的**所有**参数，无论函数定义中使用了多少参数。它可以像数组一样被索引，或者用 `for`\
    \ 循环进行遍历，但缺乏数组的大多数其他功能。`arguments` 变量主要用于旧代码；在严格模式下是不允许使用的。现代代码更有可能使用剩余参数（rest\
    \ parameters，见下文）。\n\n参数可以赋予默认值；如果缺少参数，则使用默认值。默认值的形式为赋值，并且可以在表达式中使用之前的参数。例如：\n\
    \n```javascript\n function foo(a, b = 10, c = a * b) {\n    return a + b + c;\n\
    \   }\n   console.log(foo(3)); // 结果为 43\n```\n\n因为参数是通过位置与参数匹配的，所以所有没有默认值的参数必须在所有带默认值的参数之前。\n\
    \n**剩余参数**（rest parameter）是将所有剩余参数收集到数组中的参数。剩余参数通过在其前面加上三个点（`...`）来指定。例如，如果定义一个函数：\n\
    \n```javascript\n function foo(x, y, ...z) {\n    console.log(`x is ${x}`);\n\
    \    console.log(`y is ${y}`);\n    console.log(`z is ${z}`);\n   }\n```\n\n并进行调用：\n\
    \n```javascript\n foo(1, 2, 3, 4, 5);\n```\n\n那么控制台将写入内容：\n\n```\n \"x is 1\"\n\
    \ \"y is 2\"\n \"z is 3,4,5\"\n```\n\n由于 `...` 收集了所有剩余参数，它只能作为最后一个参数使用。\n\n点也可以反向使用，在函数的参数中。当它被放在函数调用中的数组之前时，数组中的值会被拆分成单独参数。这对于接收任意数量参数的很有用。\n\
    \n```javascript\n let ary = [2, 7, 1, 3];\n let m = Math.max(...ary);\n```\n\n\
    像这样使用时，点被称为**展开**（spread）。展开也可以应用于集合（sets）和映射（maps）。\n\n展开可以用于创建数组的浅拷贝。\n\n```javascript\n\
    \ let ary2 = [...ary];\n```\n\n### 3.10.3 函数是数据\n\n函数名称后面如果没有跟着参数列表，则指代函数本身。函数可以赋值给变量：\n\
    \n```javascript\n function square(x) {\n    return x * x;\n   }\n\n   let square2\
    \ = square;\n   let result = square2(5); // 25\n\n   let myArray = new Array();\n\
    \   myArray[10] = square;\n   result = myArray10; // 49\n```\n\n函数可以被打印。调用 `square.toString()`\
    \ 将返回函数的列表，就像上面显示的那样。\n\n函数可以赋值给属性。赋值给属性的函数被称为**方法**（method）。在方法内部，`this` 指向该对象。\n\
    \n### 3.10.4 函数是对象\n\n函数名称后面如果没有跟着参数列表，则指代函数本身。函数可以赋值给变量：（见上文）。\n\n函数可以被打印。调用\
    \ `square.toString()` 将返回函数的列表，就像上面显示的那样。\n\n函数可以赋值给属性。赋值给属性的函数被称为**方法**（method）。在方法内部，`this`\
    \ 指向该对象。\n\n### 3.10.5 函数方法\n\n**方法**（method）是属于一个对象的函数。但函数本身也是对象，并且拥有方法。考虑：\n\
    \n```javascript\n let car = { make: \"Subaru\", year: 2018,\n     age(now) { return\
    \ now - this.year; } };\n   let fn = car.age;\n```\n\n此时 `fn` 是一个函数，具体来说是函数 `age()\
    \ {return now - this.year}`。它不再附加到对象，因此它不再是一个方法。\n\n"
- fmt: "\n* `fn.apply(car, [2021])` — Returns `3`.\n\n* `let g = f.bind(obj, \"arg1,\
    \ ..., argN\")` — Returns a new function `g` that uses `obj` as the value of `this`,\
    \ and with the first `N` arguments filled in.\n\n* `let g = fn.bind(car)` — Assigns\
    \ to `g` a function that expects an argument for the `year` parameter.\n\n* `let\
    \ h = bind(car, 2021)` — Assigns to `h` a function that expects no arguments and\
    \ returns `3`.\n\n### 3.10.6 Closures\n\nSuppose one function is defined inside\
    \ another; call them the “outer function” and the “inner function.” The outer\
    \ function forms the environment of the inner function, so the inner function\
    \ can use the local variables of the outer function. If the outer function returns,\
    \ all its local variables will (normally) recycled.\n\nBut what if the inner function\
    \ continues to exist after the outer function vanishes? That can happen—the (previously)\
    \ inner function could be stored in a variable, or perhaps returned as a result\
    \ of the outer function. If the inner function is executed, it still needs access\
    \ to the local variables of the outer function.\n\nThe solution is that those\
    \ local variables don’t get recycled—they are “closed over” and kept for use of\
    \ the (previously) inner function.\n\n```\n function make_counter() {\n    let\
    \ n = 0;\n    let count = function() {\n     n += 1;\n     return n;\n    }\n\
    \    return count;\n   }\n\n   let counter = make_counter();\n   console.log(counter());\
    \ // 1\n   console.log(counter()); // 2\n```\n\nHere the `make_counter` function\
    \ declares a local variable `n`, which is used in the `count` function. The `count`\
    \ function is then returned as a result of `make_counter`, but it still has access\
    \ to the storage location used by variable `n`, which is “closed over” by `count`.\
    \ This is termed a *closure*. (The name `n` is recycled and no longer accessible,\
    \ but the storage it used is not released.)\n\nEach time `make_counter` is called\
    \ it creates a *new* local variable `n`, independent of any previous ones. In\
    \ this way, multiple independent counters can be created.\n\nIt isn’t necessary\
    \ to use nested functions to create closures. A function created in a block, using\
    \ variables of that block, can be put in a variable with a scope larger than the\
    \ block. The result is still a closure.\n\n```\n let v; // outside the block\n\
    \   { let n = 0;\n     let count = function() {\n       n += 1;\n       return\
    \ n;\n     }\n     v = count;\n   }\n\n   console.log(v()); // 1\n   console.log(v());\
    \ // 2\n```\n\n### 3.10.7 Generators\n\nA *generator* is a special kind of function\
    \ that remembers where it is at in the function, and when used again, resumes\
    \ from where it left off. This is useful for producing a (possibly infinite) sequence\
    \ of values.\n\nTo define a generator:\n\n* Begin with `function*` rather than\
    \ `function`.\n\n* Use `yield value` instead of `return value`. When `yield` is\
    \ executed, it returns an object `{value: value, done: false}`.\n\n    * The next\
    \ use of the generator will resume execution right after the `yield` statement.\n\
    \n    * Using a `return` statement, or reaching the end of the function, will\
    \ terminate the generator; the value returned is the object `{value: undefined,\
    \ done: true}`.\n\nTo use a generator:\n\n* Call the function defined with `function*`.\
    \ This returns a *generator object*, not a value computed by the generator.\n\n\
    * Use the generator object in a `for/of` loop (not `for/in`, which will do nothing);\
    \ **or**\n\n* Call the generator’s `next()` method as many times as desired. This\
    \ returns an object as described above.\n\n    * A generator can only be used\
    \ once. Once a generator is done, it’s done. You can always make a new one, though.\n\
    \nAs an example, we will write a very simple generator that takes an argument\
    \ `n` and repeatedly cuts it in half, rounding down to the nearest integer, until\
    \ `1` is returned.\n\n```\n function* half(n) {\n    yield n;\n    while (n >\
    \ 1) {\n     n = Math.floor(n / 2);\n     yield n;\n    }\n   }\n```\n\nWe can\
    \ use it like this:\n\n```\n let gen = half(10);\n   for (i of gen) {\n    console.log(i);\n\
    \   }\n```\n\nThis will produce the values `10`, `5`, `2`, and `1`.\n\nAlternatively,\
    \ we can explicitly use the generator’s `next()` method.\n\n```\n gen = half(10);\n\
    \   let obj = gen.next();\n   while (! obj.done) {\n    console.log(obj.value);\n\
    \    obj = gen.next();\n   }\n```\n\nThis will produce the same sequence of values.\n\
    \n### 3.10.8 Iterators\n\nAn *iterable* is any object that can be stepped through,\
    \ one element after another. An *iterator* is an object that implements a method\
    \ for stepping through.\n\n## 11 Objects\n\n### 3.11.1 Definition of Objects\n\
    \nJavaScript is an object-oriented language.\n\nIn JavaScript, you can create\
    \ objects without having to define a class. This section is about objects; classes\
    \ will be covered later.\n\nAn *object* is a collection of named values (called\
    \ *properties* or *fields*). Objects use dot notation, as in other object-oriented\
    \ languages, but they behave more like hash tables (also called maps or dictionaries).\n\
    \nYou can write an *object literal* by enclosing `key`:`value` pairs in braces.\
    \ For example:\n\n```\n let car = {make: \"Subaru\", year: 2018}\n```\n\nThis\
    \ defines the object `car` with the properties `make` and `year`. You can refer\
    \ to the fields with *dot notation*. For example, the statement\n\n```\n console.log(car.make\
    \ + \" \" + car.year);\n```\n\nwill write `\"Subaru 2018\"` to the console. If\
    \ you don’t have a console open, you won’t see the result; in that case you may\
    \ wish to use\n\n```\n alert(car.make + \" \" + car.year);\n```\n\ninstead.\n\n\
    We can add properties to an existing object:\n\n```\n car.mileage = 25041;\n```\n\
    \nor delete them:\n\n```\n delete car.mileage;\n```\n\nProperty names (the “key”\
    \ part of `key`:`value`) are always either strings (which do not need to be quoted)\
    \ or symbols. It may not look that way; the following is legal:\n\n```\n let nums\
    \ = {2: \"two\", 3.1416: \"pi\"}\n```\n\nIn this code, the keys are actually the\
    \ *strings* `\"2\"` and `\"3.1416\"`.\n"
