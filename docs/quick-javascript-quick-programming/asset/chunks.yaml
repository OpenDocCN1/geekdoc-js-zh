  trans: "\n\n* `fn.apply(car, [2021])` — 返回 `3`。\n\n* `let g = f.bind(obj, \"arg1,\
    \ ..., argN\")` — 返回一个新函数 `g`，它使用 `obj` 作为 `this` 的值，并填充了前 `N` 个参数。\n\n* `let\
    \ g = fn.bind(car)` — 给 `g` 分配一个期望 `year` 参数的函数。\n\n* `let h = bind(car, 2021)`\
    \ — 给 `h` 分配一个不接受参数并返回 `3` 的函数。\n\n### 3.10.6 闭包 (Closures)\n\n假设一个函数定义在另一个函数内部；我们将它们称为“外部函数”和“内部函数”。外部函数构成了内部函数的环境，因此内部函数可以使用外部函数的局部变量。如果外部函数返回，其所有的局部变量（通常情况下）都会被回收。\n\
    \n但如果内部函数在外部函数消失后仍然存在呢？这种情况是有 way——（此前的）内部函数可以存储在变量中，或者作为外部函数的结果返回。如果执行了内部函数，它仍然需要访问外部函数的局部变量。\n\
    \n解决方案是，这些局部变量不会被回收——它们被“闭获”并保留以供（此前的）内部函数使用。\n\n```\n function make_counter()\
    \ {\n    let n = 0;\n    let count = function() {\n     n += 1;\n     return n;\n\
    \    }\n    return count;\n   }\n\n   let counter = make_counter();\n   console.log(counter());\
    \ // 1\n   console.log(counter()); // 2\n```\n\n在这里，`make_counter` 函数声明了一个局部变量\
    \ `n`，它在 `count` 函数内部使用。`count` 函数作为 `make_counter` 的结果返回，但它仍然可以访问变量 `n` 所使用的存储位置，该位置被\
    \ `count` “闭获了”。这被称为*闭包*。（变量 `n` 被回收且不再可访问，但它使用的存储空间并未被释放。）\n\n每次调用 `make_counter`\
    \ 都会创建一个*新的*局部变量 `n`，它与之前的任何变量都独立。通过这种方式，可以创建多个独立的计数器。\n\n创建闭包并不一定非要使用嵌套函数。在代码块中创建并使用该块变量的函数，可以放入作用比代码块更大的变量中。结果仍然是一个闭包。\n\
    \n```\n let v; // 代码块外部\n   { let n = 0;\n     let count = function() {\n    \
    \   n += 1;\n       return n;\n     }\n     v = count;\n   }\n\n   console.log(v());\
    \ // 1\n   console.log(v()); // 2\n```\n\n### 3.10.7 生成器 (Generators)\n\n*生成器*是一种特殊的函数，它会记住自己在函数中的执行位置，并在再次被使用时，会从上次停止的地方继续。这对于产生一个（可能是无限的）序列非常有用。\n\
    \n定义生成器：\n\n* 使用 `function*` 而不是 `function`。\n\n* 使用 `yield value` 代替 `return\
    \ value`。当执行 `yield` 时，它返回一个对象 `{value: value, done: false}`。\n\n    * 生成器的下一次使用将从\
    \ `yield` 语句之后继续执行。\n\n    * 使用 `return` 语句或到达函数末尾将终止生成器；返回的值是对象 `{value: undefined,\
    \ done: true}`。\n\n使用生成器：\n\n* 调用用 `function*` 定义的函数。这返回一个*生成器对象*，而不是生成器计算的值。\n\
    \n* 在 `for/of` 循环中使用生成器对象（而不是 `for/in`，后者将无所作为）；**或者**\n\n* 根据需要多次调用生成器的 `next()`\
    \ 方法。这会返回一个上述的对象。\n\n    * 生成器只能使用一次。一旦生成器完成，它就结束了。不过，你可以随时创建一个新的。\n\n作为一个示例，我们将编写一个非常生成器，它接收一个参数\
    \ `n` 并反复将其减半（向下取整到最接近的整数），直到返回 `1`。\n\n```\n function* half(n) {\n    yield n;\n\
    \    while (n > 1) {\n     n = Math.floor(n / 2);\n     yield n;\n    }\n   }\n\
    ```\n\n我们可以这样使用它：\n\n```\n let gen = half(10);\n   for (i of gen) {\n    console.log(i);\n\
    \   }\n```\n\n这将产生值 `10`、`5`、`2` 和 `1`。\n\n或者，我们可以显式地使用生成器的 `next()` 方法。\n\n```\n\
    \ gen = half(10);\n   let obj = gen.next();\n   while (! obj.done) {\n    console.log(obj.value);\n\
    \    obj = gen.next();\n   }\n```\n\n这将产生相同的值序列。\n\n### 3.10.8 迭代器 (Iterators)\n\
    \n*迭代器*（iterable）是任何可以逐一个元素进行遍历的对象。*迭代器*（iterator）是一个实现了遍历方法的对象。\n\n## 11 对象 (Objects)\n\
    \n### 3.11.1 对象的定义\n\nJavaScript 是一种面向对象的语言。\n\n在 JavaScript 中，你可以创建对象而无需定义类。这一节关于对象；类将在稍后介绍。\n\
    \n*对象*是具命值的值的集合（称为*属性*或*字段*）。对象使用点表示法，与其他面向对象的语言一样，但它们的行为更像哈希表（也称为映射或字典）。\n\n\
    你可以通过在大括号中封装 `key:`value` 对来编写*对象字面量*。例如：\n\n```\n let car = {make: \"Subaru\"\
    , year: 2018}\n```\n\n这定义了具有 `make` 和 `year` 属性的对象 `car`。你可以使用点表示法引用字段。例如，语句\n\
    \n```\n console.log(car.make + \" \" + car.year);\n```\n\n向控制台写入 `\"Subaru 2018\"\
    `。如果你没有打开控制台，将看不到结果；在这种情况下，你可能希望使用\n\n```\n alert(car.make + \" \" + car.year);\n\
    ```\n\n替代。\n\n我们可以向现有对象添加属性：\n\n```\n car.mileage = 25041;\n```\n\n或者删除它们：\n\n\
    ```\n delete car.mileage;\n```\n\n属性名（`key`:`value` 中的“键”部分）始终是字符串（不需要引号）或符号。看起来可能不像那样；以下代码是合法的：\n\
    \n```\n let nums = {2: \"two\", 3.1416: \"pi\"}\n```\n\n在这段代码中，键实际上是*字符串* `\"\
    2\"` 和 `\"3.1416\"`。\n\n"
- fmt: "\nThere is a second way to access properties: You can use brackets, `[]`,\
    \ instead of dot notation. Instead of `nums.2` or `nums.3.1416`, which are illegal\
    \ syntax, you can say `nums[2]` and `nums[3.1416]`. Any expression within the\
    \ brackets will be evaluated and the result converted to a string; so `nums[5-3]`\
    \ is the same as `nums[\"2\"]`.\n\nBrackets can also be used when creating or\
    \ adding to an object. Continuing the above example, either of the following two\
    \ statements could be used to add the property `mileage` to `car`, or update the\
    \ value of `mileage` if it is already a property:\n\n```\n car.mileage = 25300;\n\
    \ car[\"mileage\"] = 25300;\n```\n\nWhen creating an object, brackets can be used\
    \ to compute the name of a property (the key), the value, or both.\n\n```\n let\
    \ property = \"make\";\n let make = \"Subaru\";\n let age = 2;\n car = {[property]:\
    \ [make], year: 2020 - age}\n```\n\nIf you have some variables containing values\
    \ and you want to create an object with the same names and values, there is a\
    \ very convenient shorthand you can use. Writing just a variable name is the same\
    \ as adding a property with that name and the variable’s value. For example, if\n\
    \n```\n let make = \"Subaru\";\n let year = 2018;\n```\n\nthen\n\n```\n let car\
    \ = {make, year}\n```\n\nis shorthand for\n\n```\n let car = {make: \"Subaru\"\
    , year: 2018}\n```\n\nTo test whether an object has a particular property, use\
    \ the `in` operator. For example, `\"make\" in car` returns `true`.\n\nYou can\
    \ use the `for/in` loop to step through all the properties of an object. The code\n\
    \n```\n for (prop in car) {\n    console.log(prop + \" is \" + car[prop])\n  \
    \ }\n```\n\nwill display the following on the console:\n\n```\n \"make is Subaru\"\
    \n \"year is 2018\"\n```\n\n### 3.11.2 Creating Objects\n\nIn the previous section\
    \ we made an object by writing an object literal, `{make: \"Subaru\", year: 2018}`,\
    \ which we then assigned to the variable `car`.\n\nAnother way to create the `car`\
    \ object is to first create a “blank” object, then add properties to it:\n\n```\n\
    \ let car = Object(); // or let car = {};\n car.make = \"Subaru\"; // don't use\
    \ 'let' here\n car.year = 2018;\n```\n\nYet another way to create this object\
    \ is to write a function that assigns values to properties of the keyword `this`,\
    \ then explicitly returns `this` as a result.\n\n```\n function Car(make, year)\
    \ {\n    this.make = make;\n    this.year = year;\n    return this;\n   }\n```\n\
    \nWe can call this function in the usual way.\n\n```\n let car = Car(\"Subaru\"\
    , 2018);\n```\n\nNotice that the function uses the names `make` and `year` both\
    \ as variables and as property names. This is by no means necessary; we could\
    \ have used different names for the variables as for the properties. But it is\
    \ convenient to be able to use the same names, rather than having to think up\
    \ synonyms.\n\nThere is yet another way to create a `car` object. Again we write\
    \ a function, but this time we do not explicitly return `this` as a result.\n\n\
    ```\n function Car(make, year) {\n    this.make = make;\n    this.year = year;\n\
    \   }\n```\n\nBecause there is no explicit `return` statement, this function will\
    \ return `undefined` if called in the usual way. Nevertheless, we can use it to\
    \ get a `car` object by putting the keyword `new` in the function call.\n\n```\n\
    \ let car = new Car(\"Subaru\", 2018);\n```\n\nPutting `new` in front of a function\
    \ call does two things. It creates a new local variable named `this` inside the\
    \ function, and it implicitly returns `this` as a result.\n\nA function used in\
    \ this way acts as a constructor for objects. It is conventional to capitalize\
    \ the first letter of a constructor (hence, `Car` rather than `car`). Constructors\
    \ are used when it is desirable to define a number of similar objects, for example,\
    \ a number of `car` objects.\n\n> **Note**: By default, a constructor returns\
    \ the newly created object `this`. A different object, but not a primitive, may\
    \ be explicitly returned by using the `return` statement. Attempting to return\
    \ a primitive value has no effect.\n\nWhen an object is created by calling a constructor,\
    \ the test `instanceof` constructor (for example, `car instanceof Car)` will test\
    \ whether the object was created using that constructor. This is in contrast to\
    \ `typeof(car)`, which will return the string `\"object\"`.\n\nThe `Object.create(proto)`\
    \ method uses an existing object `proto` as the prototype for a new object. The\
    \ newly created object has no properties of its own; it is “transparent,” in the\
    \ sense that any attempt to read its properties will “see through it” and read\
    \ the properties of the prototype.\n\n```\n let car2 = Object.create(car);\n car2.make\
    \ = \"VW\";\n car2.color = \"blue\";\n```\n\nFollowing these statements, `car`\
    \ will be unchanged, but `car2` will have `\"VW\"` as its `make`, `\"blue\"` as\
    \ its color, and `2018` as its `year`.\n\n### 3.11.3 Copying Objects\n\nAs is\
    \ the case with most languages, a variable holds only a small amount of information,\
    \ such as a single number. Objects, including arrays, sets, maps, and user-created\
    \ objects, take up a great deal more room. Consequently, what is actually “in”\
    \ a variable is a reference (or pointer or machine address), specifying where\
    \ to find the object.\n\nIf `obj1` is a variable whose value is an object, then\
    \ the assignment `obj2 = obj1` copies the reference into `obj2`, not the object\
    \ itself. The result is that `obj1` and `obj2` both point to the same object.\
    \ Any changes to that object are equally visible from both variables.\n\nThere\
    \ is no way in JavaScript to directly copy an object. However, there is a way\
    \ to copy all the properties of an object, or even several objects, into another\
    \ object\n\n```\nlet newObj = Object.assign({}, oldObj);\n```\n\nThe `Object.assign`\
    \ method takes an empty object `{}`, given as the first parameter, and copies\
    \ all the properties into it, returning the result. In fact, the `assign` method\
    \ is quite general. It can take any number of objects as parameters.\n\n```\n\
    Object.assign(newObj, old1, …, oldN);\n```\n\nIf there is a conflict, later values\
    \ of a property overwrite earlier ones. This is a shallow copy: The keys and values\
    \ of the properties are copied, but if a value is itself an object, it is the\
    \ reference to that object that is copied, not the object itself.\n\n### 3.11.4\
    \ Methods\n\nA method is a function attached to an object.\n\n```\n let now =\
    \ new Date().getFullYear();\n   let car = {\n    make: \"Subaru\",\n    year:\
    \ 2018,\n    age: function() {\n                       return now - this.year;\n\
    \                    }\n            }\n```\n\nIn the above, `new Date()` returns\
    \ a `Date` object, and its method `getFullYear()` returns a four-digit number.\n\
    \nThe above `car` object has a property named `year`. It isn’t a variable; you\
    \ can’t say `year`, you have to say which object it belongs to. The keyword `this`\
    \ means “this same object.”\n\nA method inside an object literal can be abbreviated\
    \ by leaving out the colon and the word `function`. Within `car`, `age` could\
    \ be defined as follows:\n\n```\n age() { return now - this.year; }\n```\n\nThe\
    \ parentheses after `age` are enough to indicate that it is a function.\n\n###\
    \ 3.11.5 Optional Chaining\n\nObjects can contain references to other objects.\
    \ For example, a `Customer` object might have an `address` property, while an\
    \ `Address` might have a `number` property.\n\n```\n let cust = {\n    name: \"\
    Jones\",\n    address: { number: 29, street: \"main\" }\n   }\n```\n\nWith this\
    \ object you say `cust.address.number`. This is an example of chaining.\n\nSometimes\
    \ information is missing or incomplete. If either `cust` or `cust.address` is\
    \ `undefined` or `null`, then `cust.address.number` will result in an error.\n\
    \nTo avoid this error, the optional chaining operator `?.` can be used. It converts\
    \ errors into the `undefined` value. Hence, `cust?.address?.number` will either\
    \ work or it will return `undefined`, but it won’t cause an error.\n"
