    \ `case` `expression` 进行比较。当找到与 `switch` `expression` 严格相等的 `case` `expression`\
    \ 时，从随后的语句开始执行，直到遇到 `break` 或 `return`，或者直到整个 `switch` 语句结束。\n\n> **注意：** `===`\
    \ 运算符用于相等性测试。只有当两个值的类型相同且值相同时，才会返回 true 结果。\n\n每个 case 的末尾不需要 `break` 语句；如果省略了它，控制流将进入下一组语句执行。这通常不是你希望发生的情况。在极少数这种这是预期行为的情况下，最好包含一个注释，说明这种省略是有故意的，否则你或其他人可能会在日后“纠正”这个显而易见的问题。\n\
    \n一个 `case` `expression:` 后面可以紧跟另一个 `case` `expression:`，中间没有间隔的语句（或 `break`）。如果其中一个\
    \ `expression` 匹配 `switch` `expression`，将执行随后的 `statements`。\n\n`default` 情况是可选的，并且通常应该放在最后。如果没有找到匹配的\
    \ `expression`，则执行 `default` 情况中的 `statements`。如果没有找到匹配的 `expression` 且没有 `default`\
    \ 情况，则 `switch` 语句将在不执行任何操作的情况下退出。\n\n良好的风格是始终包含一个 `default` 情况，即使你认为已经涵盖了所有可能性。\n\
    \n`statements` 可以是任意零或多条语句的序列。没有必要使用大括号将语句（包括随后的 `break` 语句）分组为一个复合语句，尽管有时会这样做。\n\
    \n这是一个人为构造的示例：\n\n```javascript\n let v = 123.0;\n   let kind;\n   switch (v)\
    \ {\n    case 120 + 3:\n     kind = \"number\";\n     break;\n    case \"123\"\
    :\n     kind = \"string\";\n     break;\n    default:\n     kind = \"other\";\n\
    \   }\n   console.log(v, \"is a\", kind);\n```\n\n这将导致输出 `123 is a number`，因为严格相等测试不区分整数和浮点数；它们的类型都是\
    \ `number`。\n\n## 2.9.4.10 标签语句 (Labeled Statements)\n\n`标签语句` 的语法是：\n\n```javascript\n\
    identifier: statement;\n```\n\n任何语句都可以用标识符标记标签，但只有对循环语句和 `switch` 语句标记标签才有意义。标签与\
    \ `break` 和 `continue` 语句配合使用。\n\n## 2.9.4.11 Break 语句 (Break Statements)\n\n\
    `break 语句` 由关键字 `break` 组成，后面可选跟一个语句标签。\n\n`break` 语句只能在循环或 `switch` 语句内部使用。\n\
    \n执行 `break` 会导致闭包的循环或 `switch` 语句退出。如果 `break` 语句位于嵌套循环和或 `switch` 语句内部且没有标签，则只退出直接闭包的循环或\
    \ `switch` 语句。\n\n执行带有标签的 `break` 语句会导致带有该标签的闭包循环或 `switch` 语句退出，无论嵌套深度如何。\n\n\
    给定一个数字数组，考虑找到两个数字，其中一个恰好是另一个十倍。以下代码解决了这个问题。\n\n```javascript\n let ary = [7, 30,\
    \ 9, 20, 3, 5];\n   let i, j;\n   id: for (i = 0; i < ary.length; i += 1) {\n\
    \     for (j = 0; j < ary.length; j += 1) {\n      if (ary[i] == 10 * ary[j] &&\
    \ ary[i] != 0) {\n       break id;\n      }\n     }\n    }\n   console.log(ary[i]\
    \ + \", \" + ary[j]);\n```\n\n一些程序员不喜欢 `break` 语句，事实上，通常有更好的方法在使用它的情况下解决问题。\n\n\
    ## 2.9.4.12 Continue 语句 (Continue Statements)\n\n`continue 语句` 由关键字 `continue`\
    \ 组成，后面可选跟一个语句标签。\n\n`continue` 语句只能在循环内部使用。这与 `break` 语句不同，`break` 语句也可以在 `switch`\
    \ 语句内部使用。\n\n执行 `continue` 会导致闭包循环返回测试，或者在传统的 `for` 循环中，返回到……（注：原文此处存在大量重复的错误文本，已根据核心逻辑进行翻译）。\n\
    \n"
- fmt: "\n*   For arrays, the `element`s are the indices, along with any properties\
    \ that may have been assigned to the array; the value can be accessed with `object`[`element`]`.\n\
    \    *   The `for/in` loop treats arrays like any other object. It is much slower\
    \ than a `for/of` loop.\n*   For strings, the `element`s are the indices; the\
    \ individual characters can be accessed with `object`[`element`]`.\n\nAn object\
    \ may have non-enumerable, “hidden” properties, and a sparse array may have “missing”\
    \ elements. These are skipped over by the `for/in` loop.\n\n### 2.9.5.3 Throw\n\
    \nThe programmer can use the `throw statement` to deliberately cause an exception.\
    \ There is no “Exception” type—any type of value may be “thrown.”\n\n> **Note**:\
    \ JavaScript makes no distinction between “errors” and “exceptions.”\n\nThe `throw`\
    \ statement “throws” the exception to somewhere else, so as not to clutter up\
    \ the normal execution of the program with code to handle (hopefully rare) exceptional\
    \ conditions. The purpose of the `try/catch` statement (described in [Section\
    \ 2.9.5.4](#ch2.xhtml_sec2_9_5_4)) is to catch a thrown exception.\n\nThe `throw`\
    \ statement has the syntax:\n\n```\nthrow expression;\n```\n\nwhere `expression`\
    \ can be any type, but is typically an error number, an error message, or (as\
    \ is the case with predefined exceptions), an object with `name` and `message`\
    \ properties.\n\nWhat happens to the thrown exception?\n\n*   If an exception\
    \ occurs in the `try` portion of a `try-catch-finally` statement, the `catch`\
    \ part handles the exception.\n*   Otherwise, if an exception occurs in a function,\
    \ the function will return immediately to the point at which the function was\
    \ called. Execution continues as if the exception was thrown at that point (which\
    \ may involve returning up another level in a nest of function calls).\n*   Otherwise,\
    \ if an exception occurs in top-level code, or hasn’t been handled by the time\
    \ the exception reaches the top level, it is up to the system to do something\
    \ about it. In an IDE, the exception will be reported to the programmer. In a\
    \ browser, the exception will probably be ignored.\n\n### 2.9.5.4 Try-catch-finally\n\
    \nThe `try-catch-finally statement` is used to separate error handling code from\
    \ code that handles the “normal” case. This statement works exactly like the corresponding\
    \ statement in Java, but with two minor syntactic differences.\n\n*   The `try-catch-finally`\
    \ statement can have only one `catch` clause.\n*   The `(`variable`)` after the\
    \ word `catch` does not have a declared type, and may be omitted.\n\nIn more detail,\
    \ here is the syntax:\n\n```\ntry {\n statements\n}\ncatch (variable) {\n statements\n\
    }\nfinally {\n statements\n}\n```\n\nEither the `catch` part or the `finally`\
    \ part, but not both, may be omitted.\n\nExecution is as follows:\n\n1.  The code\
    \ in the `try` block is executed.\n    *   If no exception occurs, the `catch`\
    \ block is skipped.\n    *   If an exception occurs, control goes immediately\
    \ to the `catch` part. The optional `variable` holds a value supplied by the exception;\
    \ it is a local variable of the `catch` part.\n2.  Whether or not an exception\
    \ occurred, the `finally` part is executed.\n\nFor example, the following code\
    \ will put up an alert box containing the words “I am an exception”:\n\n```\n\
    \ try {\n    throw \"I am an exception\";\n   }\n   catch (v) {\n    alert(v);\n\
    \   }\n```\n\nMany things that would throw an exception in other languages do\
    \ not throw an exception in JavaScript. In particular, arithmetic expressions\
    \ never throw an exception.\n\nA minor complexity arises because JavaScript guarantees\
    \ that the `finally` part, if present, will *always* be executed. If the code\
    \ in the `try` or `catch` part tries to execute a `return`, `break`, or `continue`\
    \ statement, control will pass immediately to `finally` part, and the `return`,\
    \ `break`, or `continue` statement will be postponed until after the `finally`\
    \ part has finished.\n\nIt is also possible for an exception to occur in either\
    \ the `catch` or the `finally` parts of a `try-catch-finally` statement. The new\
    \ exception will replace the one being handled and will be treated as a new exception.\n\
    \n### 2.9.5.5 The with Statement\n\nThe `with` statement is not allowed in strict\
    \ mode, but you may see it in older code.\n\n```\nwith object {\n statements\n\
    }\n```\n\nThis uses the `object` as the default prefix for variables; that is,\
    \ any variable `var` within the statements is treated as `object`.`var`, wherever\
    \ this makes sense.\n\n## 2.10 Example: Prime Numbers\n\nHere is a simple program\
    \ to print all the prime numbers from 2 to 100, properly embedded in an HTML page.\
    \ This can be saved in a file with the `.html` extension and viewed in a browser.\n\
    \n```html\n <!DOCTYPE html>\n   <html>\n   <title>Using JavaScript</title>\n \
    \  <head>\n   <script>\n    function isPrime(n) {\n     let divisor = 2;\n   \
    \  while (divisor * divisor <= n) {\n      if (n % divisor == 0) {\n       return\
    \ false;\n      }\n      divisor += 1;\n     }\n     return true;\n    }\n   </script>\n\
    \   </head>\n   <body>\n   <script>\n    for (let n = 2; n <= 100; n++) {\n  \
    \    if (isPrime(n)) {\n        console.log(n);\n      }\n    }\n   </script>\n\
    \   </body>\n </html>\n```\n\n## 2.11 Testing\n\n### 2.11.1 Mocha Test Framework\n\
    \nThe above URLs are long and don’t fit on a single line in this book, but you\
    \ should write them in your code. In the `<head>` section, use the following to\
    \ load Mocha:\n\n```html\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/mocha/8.0.1/mocha.css\"\
    >\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/mocha/8.0.1/mocha.min.js\"\
    ></script>\n```\n\nThe following is one simple way to initialize Mocha:\n\n```html\n\
    <script>\n mocha.setup('bdd');\n</script>\n```\n\nUse the following to load Chai:\n\
    \n```html\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/chai/4.2.0/chai.min.js\"\
    ></script>\n```\n\nThere are two things to put in the body. First, you need the\
    \ following line to specify where on the page to put the test results:\n\n```html\n\
    <div id=\"mocha\"></div>\n```\n\nThe final step, which should be at or near the\
    \ bottom of the HTML body, is code to run the tests:\n\n```html\n<script> mocha.run();\
    \ </script>\n```\n\n### 2.11.2 Testing with Chai\n\nVery roughly, Mocha is the\
    \ testing framework, while Chai provides the actual tests. If you are familiar\
    \ with testing styles, Chai supports the `assert`, `should`, and `expect` styles.\
    \ We will use the `assert` style.\n\nA test looks like this:\n\n```javascript\n\
    describe(title, function() {\n  it(\"English_description_of_what_it_does\", function()\
    \ {\n    // tests go here\n  });\n});\n```\n\nHere are are a few of the most useful\
    \ tests in the `chai` object. They should be relatively self-explanatory.\n\n\
    *   `assert(expression)`\n*   `assert.isTrue(expression)`\n    *   Same as `assert(expression)`\n\
    *   `assert.isFalse(expression)`\n*   `assert.equal(actual, expected)`\n    *\
    \   Usually the `actual` is a function call, and the `expected` is what the function\
    \ should return.\n*   `assert.notEqual(actual, expected)`\n*   `assert.strictEqual(actual,\
    \ expected)`\n"
