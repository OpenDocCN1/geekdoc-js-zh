  trans: "\n变量的值可以被改变。例如，赋值语句\n\n```\nx = \"abc\";\n```\n\n将给 `x` 赋予新值 `\"abc\"`。\n\
    \n对于每个算术操作符 `op`，表达式\n\n```\nvariable op= expression;\n```\n\n是以下语句的简写：\n\n```\n\
    variable = variable op expression;\n```\n\n例如，`x += 1;` 是向 `x` 加上 `1`。\n\n###\
    \ 2.9.4.2 表达式\n\n任何表达式都可以作为语句；表达式的值（如果有的话）会被丢弃。\n\n允许表达式作为语句使用，因为它们可以产生副作用。例如，如果\
    \ `a` 是一个数组，`a.sort()` 会对该数组进行排序。\n\n返回结果但没有副作用的表达式可以作为语句使用，但它们不会产生任何作用。例如，使用\
    \ `2+2` 作为语句是合法的，但没用。\n\n这可能会导致错误。如果 `str` 是字符串 `\"Hello\"`，表达式 `str.toUpperCase()`\
    \ 返回字符串 `\"HELLO\"`，这个值可以赋值给变量，但将 `str.toUpperCase()` 作为语句则不起任何作用。\n\n### 2.9.4.3\
    \ 复合语句\n\n`复合语句`（或`块`）是若干个（可能为零）声明和语句，它们被括在在大括号 `{}` 之中。复合语句本身被视为一个语句。\n\n控制语句（如\
    \ `if` 语句和循环）控制单个语句的执行。如果你想控制不仅仅是一个语句，你必须将这些语句封装在大括号中，以使其变成一个（单一的）复合语句。\n\n函数或方法的体体始终是一个复合语句。（异常：“箭头”函数，稍后将讨论。）\n\
    \n良好的风格要求块内的语句相对于块的开始位置进行缩进。JavaScript 的通常缩进是两个空格。\n\n### 2.9.4.4 If 语句\n\n`if\
    \ 语句`测试一个条件。如果条件为真，则执行后续的语句（通常是复合语句）。如果条件不为真，则 `if` 语句什么都不做。其语法如下：\n\n```\nif\
    \ (condition) {\n  statements\n}\n```\n\n例如，下面的 `if` 语句在 `x` 变为负数时将其重置为零。\n\n\
    ```javascript\nif (x < 0) {\n    x = 0;\n}\n```\n\n`if` 语句也可以有一个 `else` 分句。如果条件为真，则执行条件之后的语句。如果条件不为真，则执行\
    \ `else` 单词之后的语句。这两条语句通常都是复合语句。其语法如下：\n\n```\nif (condition) { \n   some statements\n\
    }\nelse {\n   some other statements\n}\n```\n\n例如：\n\n```javascript\nif (x % 2\
    \ == 0) {\n    x = x / 2;\n}\nelse {\n    x = 3 * x + 1;\n}\n```\n\n如果任何部分都只包含一个（非复合）语句，可以省略大括号。在这种情况下，良好的风格是将单个语句与\
    \ `if` 或 `else` 放在同一行。\n\n```javascript\nif (x % 2 == 0) x = x / 2;\nelse x =\
    \ 3 * x + 1;\n```\n\n### 2.9.4.5 While 循环\n\n`while 循环`是一种在顶部进行测试的循环。其语法如下：\n\n\
    ```\nwhile (condition) {\n   statements\n}\n```\n\n首先，测试 `condition`；如果它为假，则不再进行其他操作，循环在从未执行\
    \ `statements` 的情况下退出。如果 `condition` 为真，则执行 `statements`，然后整个循环（从测试开始）再次执行。\n\n\
    例如，一个数字 `x` 的近似常用对数（即以 10 为底的对数）可以这样计算：\n\n```javascript\nlet log = 0;\nwhile\
    \ (x > 1) {\n    log = log + 1;\n    x = x / 10;\n}\n```\n\n### 2.9.4.6 Do-While\
    \ 循环\n\n`do-while 循环`是一种在底部进行测试，而不是顶部的循环。其语法如下：\n\n```\ndo {\n  statements\n}\
    \ while (condition);\n```\n\n首先执行 `statements`，然后测试 `condition`；如果条件为真，则循环再次执行。这种循环通常在循环体至少执行一次时使用。\n\
    \n例如，假设你想选择一个 `0` 到 `1` 之间的随机数：\n\n```javascript\ndo {\n  x = Math.random();\n\
    } while (x <= 0.5);\n```\n\n### 2.9.4.7 For 循环\n\n`for 循环`是一种在顶部进行测试的循环。其语法如下：\n\
    \n```\nfor (initialization; condition; update) {\n   statements\n}\n```\n\n`initialization`首先执行且仅执行一次。之后，测试\
    \ `condition`，如果为真，则执行 `statements` 并执行 `update`；然后返回 `condition`。换句话说，`for` 循环的行为类似于下面的\
    \ `while` 循环：\n\n```\ninitialization;\nwhile (condition) {\n    statements;\n\
    \    update;\n}\n```\n\n`initialization` 可以具有以下形式之一：\n\n*   对变量赋值，例如 `i = 0` 或\
    \ `let i = 0`。\n*   对多个变量赋值，用逗号分隔，例如 `let i = 0, j = 0`（这种形式很少使用）。\n\n如果使用了 `let`，它必须位于初始化中第一个变量之前。\n\
    \n`update` 是以下之一：\n\n*   一个表达式，通常是赋值语句，如 `i += 1`。（赋值语句是一种表达式。）\n*   表达式的逗号列表，如\
    \ `i += 1, j += 2`。\n\n大括号表示 `statements` 块。如果只有一个语句，可以省略大括号；然而，良好的风格是始终包含大括号。\n\
    \n作为一个示例，声明一个数组并输出其内容：\n\n```javascript\nlet ary = [3, 1, 4, 1, 6];\nfor (let\
    \ i = 0; i < ary.length; i += 1) {\n    console.log(ary[i]);\n}\n```\n\n### 2.9.4.8\
    \ 循环中的作用域\n\n考虑：\n\n```\nfor (let variable = value; condition; update) { statements\
    \ }\n```\n\n`variable` 的作用域是整个 `for` 语句；它在语句外部不可访问。如果省略了关键字 `let`，`variable` 必须预声明；如果将\
    \ `let` 替换为 `var`，则 `variable` 是全局的。\n"
- fmt: "\nWhen the loop body is a single statement, the braces are recommended but\
    \ not required. In this case, it is good style to write the entire loop on a single\
    \ line.\n\n```\nfor (let variable = value; condition; update) statement;\n```\n\
    \nThe \"block scope\" of `variable` is the entire `for` statement, just as if\
    \ the braces were present.\n\n## 2.9.4.9 Switch Statements\n\nJust as the `if`\
    \ statement provides a choice between two blocks of code, based on a boolean value,\
    \ the `switch statement` provides a choice between several blocks of code, based\
    \ on a value of any type.\n\nThe syntax is fairly complex:\n\n```javascript\n\
    \ switch (expression) {\n  case expression:\n    statements;\n    break;\n  case\
    \ expression:\n    statements;\n    break;\n  …\n  case expression:\n    statements;\n\
    \    break;\n  default:\n    statements;\n    break;\n}\n```\n\nOperation is as\
    \ follows. The `switch` `expression` is evaluated, and then compared against each\
    \ `case` `expression` in order. When a `case` `expression` is found that is strictly\
    \ equal to the `switch` `expression`, execution begins with the following statements\
    \ and continues until either a `break` or a `return` is encountered, or until\
    \ the end of the entire `switch` statement.\n\n> **Note:** The `===` operator\
    \ is used for the equality test. This will return a true result only if the two\
    \ values are the same type as well as the same value.\n\nThe `break` statement\
    \ is not required at the end of each case; if it is omitted, control will flow\
    \ into the next group of statements. This is seldom what you want to happen. On\
    \ the rare occasion that this is the desired behavior, it is best to include a\
    \ comment that the omission is intentional, otherwise you or someone else may\
    \ \"correct\" this apparent problem at a later date.\n\nOne `case` `expression`:`\
    \ may be followed immediately by another `case` `expression:` with no intervening\
    \ statements (or `break`). If either `expression` matches the `switch` `expression`,\
    \ the following `statements` will be executed.\n\nThe `default` case is optional\
    \ and usually should come last. If no matching `expression` is found, the `statements`\
    \ in the `default` case are executed. If no matching `expression` is found and\
    \ there is no `default` case, the `switch` statement exits without doing anything.\n\
    \nIt is good style to always include a `default` case, even if you believe that\
    \ all possibilities have been covered.\n\nThe `statements` may be any sequence\
    \ of zero or more statements. It is not necessary to use braces to group the statements\
    \ (including the following `break` statement) into a compound statement, although\
    \ this is sometimes done.\n\nHere is a contrived example:\n\n```javascript\n let\
    \ v = 123.0;\n   let kind;\n   switch (v) {\n    case 120 + 3:\n     kind = \"\
    number\";\n     break;\n    case \"123\":\n     kind = \"string\";\n     break;\n\
    \    default:\n     kind = \"other\";\n   }\n   console.log(v, \"is a\", kind);\n\
    ```\n\nThis will result in the output `123 is a number`, since the strict equality\
    \ test makes no distinction between integers and floating point numbers; they\
    \ are both of type `number`.\n\n## 2.9.4.10 Labeled Statements\n\nThe syntax of\
    \ a `labeled statement` is\n\n```javascript\nidentifier: statement;\n```\n\nAny\
    \ statement may be labeled with an identifier, but it really only makes sense\
    \ to label loop statements and `switch` statements. Labels are used in conjunction\
    \ with the `break` and `continue` statements.\n\n## 2.9.4.11 Break Statements\n\
    \nA `break statement` consists of the keyword `break` optionally followed by a\
    \ statement label.\n\nA `break` statement can only be used within a loop or a\
    \ `switch` statement.\n\nExecution of the `break` causes the enclosing loop or\
    \ `switch` statement to exit. If the `break` statement is within nested loops\
    \ and/or switch statements and does not have a label, only the immediately enclosing\
    \ loop or switch statement is exited.\n\nExecution of a `break` statement with\
    \ a label causes the enclosing loop or `switch` statement with that label to exit,\
    \ regardless of nesting level.\n\nGiven an array of numbers, consider the problem\
    \ of finding two numbers such that one is exactly ten times the other. The following\
    \ code solves this problem.\n\n```javascript\n let ary = [7, 30, 9, 20, 3, 5];\n\
    \   let i, j;\n   id: for (i = 0; i < ary.length; i += 1) {\n     for (j = 0;\
    \ j < ary.length; j += 1) {\n      if (ary[i] == 10 * ary[j] && ary[i] != 0) {\n\
    \       break id;\n      }\n     }\n    }\n   console.log(ary[i] + \", \" + ary[j]);\n\
    ```\n\nSome programmers dislike the `break` statement, and indeed, there is usually\
    \ a better way to solve a problem without using it.\n\n## 2.9.4.12 Continue Statements\n\
    \nA `continue statement` consists of the keyword `continue` optionally followed\
    \ by a statement label.\n\nA `continue` statement can only be used within a loop.\
    \ This is unlike a `break` statement, which can also be used within a `switch`\
    \ statement.\n\nExecution of the `continue` causes the enclosing loop to return\
    \ to the test, or in the case of a traditional `for` loop, to the. This is unlike\
    \ a `break` statement, which can also be used within a `switch` statement.\n\n\
