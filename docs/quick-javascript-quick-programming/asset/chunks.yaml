  trans: '


    函数定义最好放置在 HTML 文档的 `<head>` 中。位于 `<body>` 部分的脚本会随着页面加载按顺序执行，并且通常会产生显示在页面相应位置的输出。


    并不是每个人都允许 JavaScript 在浏览器中运行。`<noscript>`text`</noscript>` 标签内的文本仅当 JavaScript
    不可用用或被禁用时才会显示。


    大量的 JavaScript 和在多个页面使用的脚本应该被存放在一个或多个文件中，而不是放在 HTML 页面上。


    ## 4.3 DOM 概述


    `HTML DOM`（`文档对象模型`）将 HTML 页面上的所有内容表示为 `Node` 节点树，甚至 HTML 注释和每一处空白也是如此。DOM 中的所有内容都可以被
    JavaScript 访问并更改，JavaScript 进行的任何更改都会立即反映在页面上展示给用户。这种功能远超大多数应用程序所需的。


    图 4.1 显示了 `Node` 的主要子类，而不是 DOM 树的结构。DOM 树的根是一个名为 `document` 的 `Node`，类型为 `Document`，它有一个子节点，即代表
    `<html>` 标签的 `Element`。`document` 节点拥有属性 `head` 和 `tail`，可以访问整个节点树。


    ![](img/fig4_1_B.jpg)


    图 4.1 DOM 树。


    每个 HTML 标签都由一个 `Element` 表示。`Element` 拥有一个 `tagName`，它是 HTML 标签的名称。DOM 中的名称始终大写：`HTML`、`HEAD`、`BODY`、`TITLE`、`SCRIPT`
    等。`Element` 可能会拥有 `Attribute`（`Node` 的另一个子类）。


    > **注意**：`Element` 只是 `Node` 的一种类型，但它无处不在，以至于两者有时会被混淆。增加混乱的是，`Element` 是 `Node`
    的子类，因此所有 `Node` 属性和方法都可以用于 `Element`。


    由于节点处于树形结构中，因此有一些 `Node` 属性允许在树中移动：`parentNode`、`firstChild`、`nextSibling`、`previousSibling`
    和 `lastChild`。


    文本和注释由 `Text` 和 `Comment` 节点表示，而不是 `Element` 节点，因此它们不会出现在只返回 `Element` 的属性和方法中。例如，一个
    `Element` 有一个 `childNodes` 属性，它是所有子节点的集合；而 `children` 属性是仅包含那些 `Element` 类型子节点的集合。


    除了 HTML 描述的网页外，还有大量的事件在不断发生。每一次击键、每一次鼠标移动以及许多其他事情都会导致事件的发生。交互式网页会“监听”并响应这些事件中的一小部分。


    ## 4.4 图形用户界面


    `图形用户界面`（或 `GUI`）是允许程序与用户交互的手段。它通常由熟悉的控件或 `widgets`（部件）组成，例如按钮、文本框、复选框、菜单项等。


    GUI 可以用于创建独立程序，也可以用于收集信息并发送回服务器（例如订购商品时）。`form` 是控件的容器，其目的是将信息收集成一个包。


    ### 4.4.1 事件


    GUI 程序与其他程序不同。GUI 程序不是从头运行到尾的连续代码序列，而是`事件驱动`的。当发生“有趣”的事件时，会触发某些代码来`handle`（处理）它。代码执行完毕，在另一个“有趣”事件发生之前，什么都不会发生。


    “有趣”的事件简单是指程序员编写了一些代码来处理的事件。事件一直在发生；实际上任何发生的事情都会产生一个或多个事件。鼠标悬过 HTML 元素？这是一个事件。鼠标移出
    HTML 元素？这是另一个事件。事实上，只要鼠标移动，那就是一个事件。有超过 70 种事件，所有名称都以“`on` 开头，例如 `onclick`。


    关键在于事件一直在发生；程序员不需要做任何事情来创建它们。如果用户点击按钮，那是一个（通常情况下）应该被处理的事件。如果用户点击段落中的一个单词，可能该事件应该被忽略。程序员可以决定处理哪些事件。


    ### 4.4.2 Widgets


    `Widgets` 是 GUI 元素。每个部件都由 HTML 中的一个标签表示，以及 DOM 中对应的 `Element` 表示。典型的部件有按钮、文本字段、文本区域、复选框、单选按钮、滚动条以及许多其他类型。


    大多数 GUI 元素可以使用带有 `type` 属性的 `<input>` 标签来编写。如果省略 `type`，则默认为 `text`；这是一个允许输入单行文本的框。


    以下是 `type` 的可能值：`button`、`checkbox`、`color`、`date`、`datetime-local`、`email`、`file`、`hidden`、`image`、`month`、`number`、`password`、`radio`、`range`、`reset`、`search`、`submit`、`tel`（电话）、`text`、`time`、`url`、`week`。


    有一些部件自己的标签，而不是 `type` 的值：`button`、`fieldset`、`label`、`option`。


    ### 4.4.3 按钮


    按钮是`活动元素`：当用户点击按钮时，应该发生某些事情。此外，提供视觉提示是礼貌的。例如，如果用户点击 `Save` 按钮保存文件，用户可能会感到沮丧并反复点击按钮。


    创建按钮有两种方法：


    ```

    <input type="button" value="Click me" onclick="alert(''Hello'')">


    <button onclick="alert(''Hello'')">Click me</button>

    ```


    这些每一个都会出现在网页上。`onclick` 属性的值应该是包含 JavaScript 代码的字符串，当按钮被点击时执行——这就是事件处理器。通常事件处理器是一个单一函数调用，这样所有
    JavaScript 代码就可以放在一起，而不是分散在整个 HTML 页面。在上面的示例中，调用的函数是 `alert` 函数。


    > **注意**：事件处理器中的 JavaScript 代码必须是引号字符串。由于代码本身可能包含引号字符串，通常使用两种引号，例如双引号内的单引号。


    按钮上的文本可以通过 JavaScript 更改。对于使用 `input` 标签定义的按钮，其文本位于 `value` 属性中；对于使用 `button`
    标签定义的按钮，其文本位于其 `innerHTML` 中。


    ### 4.4.4 查找 Widgets


    有多种方法指定特定的部件。这里是两种：


    *   `document.getElementById("id")` —— 返回页面上具有属性 `id="id"` 的唯一元素。id 在页面上必须是唯一的。


    *   `document.getElementsByTagName("tagName")` —— 获取页面上具有给定 `tagName` 的所有元素的可索引集合。


    DOM 中有两种常用的 `collection` 类型。`getElementsByTagName` 方法返回一个元素的*活的* `HTMLCollection`，而节点的
    `childNodes` 属性是节点的的*活的* `NodeList`。


