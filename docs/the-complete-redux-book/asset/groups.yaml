  - "[PAGE 30]\n\n# Our First Application\n\nTo learn how to use different parts of\
    \ Redux, we will be building a Recipe Book application. It will allow adding recipes\
    \ and ingredients for each recipe, and will fetch an initial recipe list from\
    \ a remote server. In accordance with Redux principles, the application will keep\
    \ all its state in our global store, including some parts of the UI.\n\nThe first\
    \ step with Redux-based app is to plan how data will be arranged in the store.\
    \ Our recipe object will start out holding only the recipe's name (we will add\
    \ more fields as needed). To store the current list, we can use a regular array:\n\
    \n# Simple state\n\n```\nrecipes = [\n  { name: 'Omelette' },\n  ...\n];\n```\n\
    \nIngredients for each recipe will contain a name and a quantity. Connecting them\
    \ to the state will be a bigger challenge. There are three general approaches\
    \ to make this connection.\n\nThe nested objects approach is to hold the ingredients\
    \ as an array inside a recipe itself:\n\n# Nested objects state\n\n```\nstate\
    \ = {\n  recipes: [\n    {\n      name: 'omelette',\n      ingredients: [\n  \
    \      {\n          name: 'eggs',\n          quantity: 2\n        }\n      ]\n\
    \    },\n    ...\n  ]\n};\n```\n\nThe nested reference approach is to store the\
    \ recipe ingredient information directly in the state and hold an array of \"\
    recipe ingredient IDs\" in each recipe:"
  - "[PAGE 31]\n\n# Nested reference state\n\n```\nstate = {\n  recipes: [\n    {\n\
    \      name: 'omelette',\n      ingredients: [2, 3]\n    },\n    ingredients:\
    \ {\n      name: 'eggs',\n      quantity: 2\n    },\n    3: {\n      name: 'milk',\n\
    \      quantity: 1\n    }\n  }\n};\n```\n\nThe separate object approach is to\
    \ store the ingredients as a standalone array in the state, and put the ID of\
    \ the recipe array is connected to inside of it:\n\n# Separate objects state\n\
    \n```\nstate = {\n  recipes: [\n    {\n      id: 10,\n      name: 'omelette'\n\
    \    },\n    ingredients: [\n    {\n      recipe_id: 10,\n      name: 'eggs',\n\
    \      quantity: 2\n    },\n    {\n      recipe_id: 10,\n      name: 'milk',\n\
    \      quantity: 1\n    }\n  ]\n};\n```"
  - "[PAGE 32]\n\nChapter 2. Your First Redux Application\n\n27\n\n```\n}\n\n  }\n\
    };\n```\n\nWhile all the approaches have their upsides and downsides, we will\
    \ quickly discover in Redux, keeping the structure as flat and normalized as possible\
    \ (as in the second and third Examples shown here) makes the code cleaner and\
    \ simpler. The state's structure implies the use of two separate reducers for\
    \ recipes and ingredients. We process both independently.\n\nThe biggest difference\
    \ between the second and third options is how the link is made (who holds the\
    \ ID of whom). In the second example, adding an ingredient will require an update\
    \ in two different parts of the state—in both the recipes and ingredients subtrees—while\
    \ in the third approach, we can always update one part of the tree. In this example\
    \ we will use this method.\n\n> The subject of state management is covered in\
    \ detail in the State Management Chapter Part 2.\n\n# Setting Up the Store\n\n\
    We will start by creating the store. In Redux there is only one store, which is\
    \ created and initialized by the createStore() method. Let's open our index.js\
    \ file and create the store:\n\nCreating the Redux store\n\n```\n1 import { createStore\
    \ } from 'redux';\n3 const reducer = (state, action) => state;\n4 const store\
    \ = createStore(reducer);\n```\n\nThe createStore() function can receive a number\
    \ of parameters, while with only one being required—in our example, the reducer\
    \ returns the same state regardless of the action.\n\nTo make things more interesting,\
    \ we can provide a default state to the store. This is useful when learning, but\
    \ the real use of this feature is mainly with server rendering, where you precalculate\
    \ the state of the application on the server and then can create the store with\
    \ the precalculated state on the client."
