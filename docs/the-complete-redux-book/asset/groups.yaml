    \ 方法立即可用。对于初始 action，请参第 9 章。\n\n相同的技术可以被开发工具用于热更新机制，以获得更好的开发者体验。热更新是一个概念，源代码的变化不会导致整个页面刷新，而是受影响的代码会被特殊软件进行替换，而整个应用程序保持在代码更改之前的状态。\n\
