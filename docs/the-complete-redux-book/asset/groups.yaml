  - "[PAGE 116]\n\n# # Chapter 7. The Store\n\nIn contrast to other Flux implementations,\
    \ in Redux there is a single store that holds all of the application state in\
    \ one object. The store is also responsible for changing the state when something\
    \ happens in our application. In fact, we could say that Redux is the store. When\
    \ we talk about accessing the state, dispatching an action, or listening to state\
    \ changes, it is the store that is responsible for all of it.\n\n> > Sometimes\
    \ the concern is raised storing the whole state in one huge JavaScript object\
    \ might be wasteful. But since objects are reference-type and the value is just\
    \ an object holding a reference to other objects, it doesn't have any memory implications;\
    \ it is the same as storing objects in different variables.\n\n# ## Creating a\
    \ Store\n\nTo create the store we use the createStore() factory function exported\
    \ by Redux. It accepts three arguments: a mandatory reducer function, an optional\
    \ initial state, and an optional state enhancer. We will cover state enhancers\
    \ in this chapter and start by creating a basic store with a dummy reducer that\
    \ ignores actions and returns the state as it is:\n\nSample store\n\n```\nimport\
    \ { createStore } from 'redux';\nnconst initialState = {\n  recipes: [],\n  ingredients:\
    \ []\n}\nconst reducer = (state, action) => state;\nconst store = createStore(initialState);\n\
    ```\n\n> > The initialState parameter is optional, and usually we delegate the\
    \ task of building an initial state to reducers, as described in the Redux Chapter.\
    \ However, it is still useful when you want to load the initial state from the\
    \ server to speed up page load times. State management is covered extensively\
    \ in the State Management Chapter.\n\nThe simple store that we have just created\
    \ has five methods that allow us to access, change, and observe the state. Let's\
    \ examine each of them."
  - "[PAGE 117]\n\n# Accessing the State\n\nThe `getState()` method returns the reference\
    \ to the current state:\n\nGet current state from getState():\n\n```\nstore.getState();\n\
    // => { recipes: [], ingredients: [] }\n```\n\n# Changing the State\n\nRedux does\
    \ not allow external changes to the state. Using the state object received from\
    \ getState() and changing values directly is prohibited. The only way to cause\
    \ a change of the state is by passing actions to the reducer function. Actions\
    \ are sent to the reducer and the result is used as the new global state.\n\n\
    Sending actions to reducers is done via the store using the store's `dispatch()`\
    \ method, which accepts a single argument, the action object:\n\nDispatch action\
    \ to store\n\n```\nconst action = { type: 'ADD_RECIPE', ... };\nstore.dispatch(action);\n\
    ```\n\nNow we can rewrite our reducer to make it create an updated state for actions\
    \ of type 'ADD_RECIPE' and return the current state otherwise:\n\nSample reducer\
    \ code\n\n```\nconst reducer(state, action) => {\n  switch (action.type) {\n \
    \   case 'ADD_RECIPE':\n      return Object.assign(...);\n    default:\n     \
    \ return state;\n  }\n};\n```\n\n# Listening to Updates\n\nNow that we know how\
    \ the store updates the state, we need a way to update the UI or other parts of\
    \ our application when the state changes. The store allows us to subscribe to\
    \ state changes using the subscribe() method. It accepts a callback function,\
    \ which will be executed after every action has been dispatched:"
