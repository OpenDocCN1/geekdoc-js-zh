  - "[PAGE 101]\n\n# Chapter 6. Tests\n\nWhile we can try to catch these mistakes\
    \ by manually verifying that the initial state did not change, a simpler approach\
    \ would be to \"freeze\" the initial state and have changes to it automatically\
    \ stop the tests. To achieve this we can use the excellent deep-freeze² library,\
    \ installed as follows:\n\nInstalling deep-freeze\n\n```\nnpm install deep-freeze\
    \ --save\n```\n\nTo use deep-freeze, we wrap our initial state with a call to\
    \ deepFreeze(),\n\nUsing deep-freeze\n\n```\nimport deepFreeze from 'deep-freeze';\n\
    const initialState = deepFreeze(reducer(undefined, { type: 'INIT' }));\n```\n\n\
    Any attempt by any parts of our code to modify initialState will now automatically\
    \ throw an error:\n\nAutomatically catch changes attempts\n\n```\ninitialState.push('test');\n\
    TypeError: Can't add property 0, object is not extensible\n```\n\nTo ensure that\
    \ our reducers never change the original state, we can always call deepFreeze()\
    \ on the state passed as the first parameter to a reducer:\n\nUpdated to non-empty\
