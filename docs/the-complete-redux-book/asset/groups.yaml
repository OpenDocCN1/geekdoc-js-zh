    \ 章. 服务器通信\n\n处理用户流的示例中间件\n\n```javascript\nconst userFlowMiddleware = ({ dispatch\
    \ }) => next => action => {\n  switch (action.type) {\n    case FETCH_CURRENT_USER:\n\
    \      dispatch(fetchCurrentUser());\n      break;\n    case SET_CURRENT_USER:\n\
    \      dispatch(fetchProfile(action.payload.userId));\n      break;\n  }\n\n \
    \ return next(action);\n}\n```\n\n遗憾的是，这种方法也有它的问题。这种设置会导致每当有人分发 `SET_CURRENT_USER`\
    \ 时，都会触发一次 `fetchProfile()` action。可能会出现一种情况：我们并不需要获取数据，但无法阻止中间件对其进行调度。\n\n我们可以通过创建一个特殊的\
    \ action 流来解决这个问题，该流的行为与 `fetchCurrentUser()` 相似，但也会触发 `fetchProfile()` action。这可以通过创建一个新的\
    \ action 构造器和 action 来：\n\n### 使用自定义 action 处理 fetch\n\n```javascript\nconst fetchCurrentUser\
    \ = (next = SET_CURRENT_USER) => ({\n  type: API,\n  url: 'user',\n  next\n});\n\
    \nconst userFlowMiddleware = ({ dispatch }) => next => action => {\n  switch (action.type)\
    \ {\n    case FETCH_CURRENT_USER:\n      dispatch(fetchCurrentUser(SPECIAL_SET_CURRENT_USER));\n\
    \      break;\n\n    case SPECIAL_SET_CURRENT_USER:\n      dispatch(setCurrentUser(action.payload));\n\
    \      dispatch(fetchProfile(action.payload.userId));\n      break;\n  }\n  next(action);\n\
    }\n```\n\n这种方法需要以某种不太清晰的方式修改我们的 actor 构造器。虽然它行得通，但如果我们忘记在特殊 action 处理器中发出常规的 `setCurrent()`\
    \ 调用，可能会导致 bug。好的一方面是，它更容易调试，因为可以清楚地知道我们正在执行什么种类型的 fetch。\n\n更简洁的方法是允许我们的异步 actor\
    \ 构造器解析一个 action 数组，API 中间件在请求成功完成后需要 `dispatch()` 这些 action：\n\n### Actor 构造器允许多个成功回调\n\
    \n```javascript\nconst fetchCurrentUser = (extraActions = []) => ({\n  type: API,\n\
    \  payload: {\n    url: 'user',\n    success: extraActions.concat(SET_CURRENT_USER)\n\
    \  }\n});\n```\n\n### 支持多个成功回调的 API 中间件\n\n```javascript\nconst notify = (data)\
    \ => {\n  action.next.each(type => dispatch({ type, data }));\n};\n\nfetch(`user/${id}`)\n\
    \  .then(response => response.json())\n  .then(notify)\n  .catch(error => dispatch(apiError(error)));\n\
    ```\n\n这个新功能将允许我们清理流中间件：\n\n### 使用多个 action 处理流\n\n```javascript\nconst userFlowMiddleware\
    \ = ({ dispatch }) => next => action => {\n  switch (action.type) {\n    case\
    \ FETCH_CURRENT_USER:\n      dispatch(fetchCurrentUser(FETCH_PROFILE));\n    \
    \  break;\n    case FETCH_PROFILE:\n      dispatch(fetchProfile(action.payload.userId));\n\
    \      break;\n  }\n  next(action);\n}\n```\n\n这种方法允许我们在更新或不更新 profile 的情况下获取当前用户\n\
    \n### 在更新或不更新 profile 的情况下获取当前用户\n\n```javascript\n// 常规获取当前用户\ndispatch(fetchCurrentUser());\n\
    \n// 带上 profile 更新获取\ndispatch(fetchCurrentUser(FETCH_PROFILE));\n```\n\n在中间件章节中，关于流处理有许多建议，它们可能会让这种流的管理变得更简单——例如，使用\
    \ sagas。\n\n### 使用 Sagas 处理流\n\n更简洁的流管理方法是使用 redux-saga。这个库允许我们使用 sagas 和 effects\
    \ 构建复杂的异步流管理解决方案。从本质上说，它使用特殊的中间件向 Redux 世界添加一个新的 actor。\n\n虽然本书中没有详细介绍 Redux sagas，但可以在这里看到一个使用\
    \ sagas 控制流的简单示例：\n\n### 使用 redux saga 进行流控制\n\n```javascript\nimport { call,\
    \ put } from 'redux-saga/effects'\nexport function *fetchCurrentUser() {\n  while\
    \ (true) {\n    yield take(FETCH_CURRENT_USER);\n    const action = yield take(SET_CURRENT_USER);\n\
    \    yield put(fetchUserProfile(action.payload.userId));\n  }\n}\n```\n\n在这个示例中，我们有一个无限循环，等待\
    \ `FETCH_CURRENT_USER` action 的分发。当此发生发生时，以 `FETCH_CURRENT_USER` action 开头的代码开始执行。payload\
    \ 可用于分发 `fetchUserProfile()` action，以便从服务器获取对应的 `SET_CURRENT_USER` profile。\n\n\
    这是一个非常基础的 saga 使用示例，并没有处理错误或允许取消流的请求。有关 sagas 的更多信息，请参阅官方 redux-saga 文档网站上的详尽文档²\n\
    \n### 取消 API 请求\n\n在应用的流过程中，我们可能会发出许多需要取消的长耗请求（例如，当用户导航到应用的不同页面时）。某些 promise 实现支持此功能，但通过\
    \ API 中间件方法也是完全可以实现的。\n\n为了允许取消，我们需要为每个发送的请求提供一个唯一的 ID，并在取消阶段保留它。这要求我们在 action\
    \ 构造器中添加对 ID 支持：\n\n### 支持 ID 的 action 构造器\n\n```javascript\nconst fetchUser =\
    \ (id, cancelable) => ({\n  type: API,\n  url: `user/${id}`,\n  next: cancelable\n\
    });\n```\n\nconst actionID = uuid.generate();\ndispatch(fetchUser(id, actionID));\n\
    \n（注：此处原文由于 OCR 错误出现了重复的 block。我将正确处理文本，并提取内容。）\n"
