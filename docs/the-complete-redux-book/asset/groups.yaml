- md: '

    ## Should I Read This Book?


    There are many tutorials and blog posts about Redux on the Internet. The library
    also has great official documentation. This book isn''t supposed to be either
    a tutorial or documentation. The goal is to provide a methodical explanation of
    Redux core concepts and how those can be extended and used in large and complex
    Redux applications.


    As a frontend consultancy, we help dozens of companies build great projects using
    Redux. Many projects face the same problems and ask the same questions. How should
    we structure the application? What is the best way to implement server communication?
    What is the best solution for form validation? Where should we handle side effects?
    How will Redux benefit our applications?


    This book is intended to serve as a companion for developers using Redux on a
    daily basis. It aims to give answers to many of the above questions and provide
    solutions to the most common problems in real-world applications. It can be used
    to learn Redux from the ground up, to better understand the structure of a large
    application, and as a reference during development.


    The book is structured in a way that doesn''t force the reader to read it to finish
    but rather allows you to skip parts and come back to them when you face the problem
    at hand or have free time to deepen your knowledge. We love Redux, and we have
    tried to share our excitement about this book. We hope that you will find it useful.


    ## How to Read This Book


    While Redux in itself is a small library, the underlying concepts and the ecosystem
    around it are large and complex. In this book we cover the core and common concepts
    and methods a developer needs to work with Redux on both small and large-scale
    applications.


    The book is separated into three parts. In the first part you will learn the basics
    of Redux. Chapter 1 covers the core concepts behind Redux, introducing the different
    "actors" and how it is built. Chapter 2, we build an example project step by step;
    here, you will learn how to use Redux in a project.


    The second part of the book is about examples and use cases from real applications.
    Redux has a great ecosystem, and there are a lot of tips, tricks, and libraries
    that can be applied to many projects of different scale. We provide you with solutions
    for common problems including server communications, authorization, internationalization,
    routing, forms, wizards, and more.


    The third part is a deep dive into Redux usage. It is separated into chapters
    by Redux entity types: actions, middleware, reducers, and the store and store
    enhancers. The chapters in this section include advanced explanations of Redux
    internals and how to properly use them in complex scenarios, and they are a must-read
    for anyone considering building large applications with Redux.


    It is highly recommended that you start by reading the first part as a whole.
    Even if you already have knowledge of Redux and have used it, the opening chapters
    will clarify all the underlying concepts and lay down the groundwork for the code
    we will use throughout the second and third parts of the book.


    No matter who you are—an explorer learning Redux for fun, or a hard-working professional
    who needs to solve real problems fast—this book will provide new ideas and insights
    to help you on your path.


    ## Acknowledgements


    Writing a technical book on a popular JavaScript library nowadays isn''t a simple
    task. New techniques, best practices and opinions keep popping up every other
    week. Combined with daily job and a family makes it even harder. The only way
    we could succeed is with a help from other awesome people along the way.


    To Redux creators, Dan Abramov and Andrew Clark, as well as many contributors
    to Redux and its ecosystem, thank you for improving data management and making
    this book relevant.


    To our technical copy editor, Rachel Head¹, thank you so much for fixing our English
    and making this book more understandable.


    To all our colleagues at 500Tech², thanks for being awesome and making us feel
    good every day.


    And obviously thank you, our dear reader, for deciding to spend your time and
    money on reading this book. We hope you enjoy reading it as much as we did writing
    it.


    Boris Ilya


    ¹https://fr.linkedin.com/in/rachel-head-a45258a2

    ²http://500tech.com


    ## Code Repository


    The code samples from this book are available in the book repository on Github
    and should work in all modern browsers.


    https://github.com/redux-book


    # Part 1. Introduction to Redux


    ## Chapter 1. Core Concepts of Flux and Redux


    Penicillin, x-rays, and pacemaker are famous examples of unintended discoveries*.
    Redux, in a similar way, wasn''t meant to become a library, but turned out to
    be a great Flux implementation. In 2015, one of its authors, Dan Abramov*, submitted
    a talk to the ReactEurope conference about "hot reloading and time travel." admits
    he had no idea how to implement time travel at that point. With some help from
    Andrew Clark* and inspired by some elegant ideas from the Elm* language, he eventually
    came up with a very neat architecture. When people started catching on it, he
    decided to mark it as a library.


    In less half a year, that small (only 2 KB) library became the go-framework for
    React developers, with its tiny size, easy-to-read code, and very simple neat
    ideas much easier to get to with than competing Flux implementations. In fact,
    Redux is not a Flux library, though it evolved through the ideas behind Facebook''s
    Flux. The official definition of Redux is a predictable state container for JavaScript
    applications. This means that you store all of your application state in one place
    and know what the state is at any given point in time.


    ### What Is Flux?


    Before diving into Redux, we should get familiar with its base, Flux. "Flux" is
    a generic architecture or pattern, rather than a specific implementation. Its
    ideas were first introduced by Bill Fisher and Jing Chen at F8 conference in April
    2014. Flux was tasked with redefining the previous ideas of MVC (Model-View-Controller)
    and MVVM (Model-View-ViewModel) and two-way binding introduced by other frameworks
    by suggesting a new flow of events, called unidirectional data flow.


    In events are managed one at a time in a circular flow with a number of actors:
    dispatcher, stores, and actions. An action is a structure describing any change
    in the system: mouse clicks, timeout events, Ajax requests, and so on. Actions
    are sent to dispatcher, a single point in the system where anyone can submit an
    action. The application state is then maintained in stores that holds the part
    of the application state and reacts to commands from the dispatcher.


    *http://www.businessinsider.com/these-10-inventions-were-made-by-mistake-2010-11-07

    *http://survejs.com/blog/redux-interview/

    *https://twitter.com/asc

    *http://elm-lang.org/

    *http://redux.js/


    Here is the simplest Flux flow:


    1. Stores subscribe to a subset of actions.

    2. An action is sent to the dispatcher.

    3. The dispatcher notifies subscribed stores of the action.

    4. Stores update their state based on the action.

    5. The view updates according to the new state in the stores.

    6. The next action can then be processed.


    ![](img/fbb45cbd9118f0a7f1feb2a04f50e708_12_0.png)


    Flux ensures that it''s easy to reason about how actions flow in the system, what
    will cause the state to change, and how it will change. Consider an example from
    a jQuery or AngularJS application. A click on a button can cause multiple callbacks
    to be executed, each updating different parts of the system, which might trigger
    updates in other places. In this scenario it is virtually impossible for the developer
    of a large application to know how a single event might modify the application''s
    state, and in what order changes will occur.


    In Flux, the event will generate a single action that will mutate the store and
    return the view. Any actions created by the store or other components during this
    process will be queued and executed after the first action is done and the view
    is updated.


    Facebook''s developers did not initially open-source their implementation of Flux,
    but rather released only parts of it, like the dispatcher. This caused a lot of
    open-source implementations to be built by the community, some of them significantly
    different and some only slightly changing the original.

