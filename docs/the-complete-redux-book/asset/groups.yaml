    # Chapter 10. Middleware


    # Customizable middleware


    ```

    import { createStore, applyMiddleware } from ''redux'';

    import reducer from ''reducers/root'';

    import nullMiddleware from ''middleware/null'';


    const store = createStore(reduce, applyMiddleware(nullMiddleware(''OH_NO'')));

    {};

    ```


    Here we want our nullMiddleware to dispatch ''OH_NO'' instead of the default ''UNKNOWN''.
    To support this we must turn our middleware into a "middleware creator":


    # Null middleware creator


    ```

    const nullMiddlewareCreator = param => store => next => action => {

    next(action) !== null ? action : { type: param || ''UNKNOWN'' };

    };

    ```


    export default nullMiddlewareCreator;


    Now instead of returning the middleware directly, we return a function that creates
    a middleware with custom parameters passed in.

    This behavior can be further extended and allow for creation of complex middleware
    as libraries that can be easily added to the store.


    # How Are Middleware Used?


    In real-life applications, middleware are often where most of the logic and complex
    code resides. They also hold most of the utility functionality, such as logging,
    error reporting, analytics, authorization, and more. Many of the enhancements
    used in this book require the addition of their custom middleware to the chain
    in order to support their functionality.

    There a long list of open projects that implement various middleware. A few examples
    are:


    +   - redux-analytics⁴

    - redux-thunk⁵⁰

    - redux-logger⁵¹


    > ⁴https://github.com/markdalgeish/redux-analytics

    ⁵⁰://github.com/gaeron/redux-thunk

    ⁵¹https://github.com/fcmbh/redux-logger'
