- md: "\n## Chapter 3. State Management\n\n## Large nested state\n\n```javascript\n\
    const state = {\n  db: {\n    books: {},\n    recipes: {},\n    ingredients: {},\n\
    \  },\n  local: {\n    activeRequests: 0,\n    user: {\n      name: 'Kipi',\n\
    \      accessToken: 'topsecrettoken'\n    }\n  },\n  vendor: {\n    forms: {},\n\
    \    router: {}\n  }\n};\n```\n\nThis allows for easier management of the different\
