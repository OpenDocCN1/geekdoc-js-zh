    \nHandle API errors with generic callback only\n\n```\nconst handleError = error\
    \ => dispatch(apiError(error));\n\nfetch(BASE_URL + action.url)\n  .then(response\
    \ => {\n    if (response.status >= 300) {\n      handleError(response.status);\n\
