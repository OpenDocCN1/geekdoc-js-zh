  mdcn: "\n\n## 第 10 章 中间件\n\n### 简单的空中间件\n\n```javascript\nconst nullMiddleware =\
    \ () => next => action => {\n  next(action !== null ? action : { type: 'UNKNOWN'\
    \ });\n};\n```\n\n在这个中间件中，我们捕获任何尝试代替 `dispatch()` 发送 `null` 的行为，并转而发送虚假的 `{ type:\
    \ 'UNKNOWN' }`。虽然这个中间件没有实际价值，但显而易见，我们可以利用中间件的力量来改变 action 以支持任何输入类型。著名的 *redux-thunk*\
    \ 本质上就是以下代码：\n\n### 简化的 redux-thunk\n\n```javascript\nconst thunkMiddleware =\
    \ ({dispatch, getState}) => next => action => {\n  if (typeof action === 'function')\
    \ {\n    return action(dispatch, getState);\n  }\n  return next(action);\n};\n\
    ```\n\n它检查传递的 action 是否为“函数”而不是普通的对象；如果是函数，它会“调用”它，并传递 `dispatch()` 和 `getState()`。\n\
    \n其他中间件也使用了类似的方法，它们能够接受以下及更多内容：\n\n- Promises（例如：解析时分发普通 action）\n- 错误对象（例如：报告错误）\n\
    - 数组（例如：并行或顺序执行 action 列表）\n\n### next() 和 dispatch() 的区别\n\n一个常见的困惑是传递给中间件的 `next()`\
    \ 和 `dispatch()` 函数之间的区别。虽然它们都接受 action，但在 Redux 中它们遵循不同的流。\n\n在中间件内部调用 `next()`\
    \ 将将 action 沿中间件链（从当前中间件）传递给 reducer。调用 `dispatch()` 则将从头（链中的第一个中间件）开始 action\
    \ 流，因此它最终也会到达当前的中间件。\n\n*https://github.com/gaearon/redux-thunk\n\n## 第 10 章 中间件\n\
    \n### Store 设置\n\n```javascript\ncreateStore(reducer,\n  applyMiddleware(\n  \
    \  middlewareA,\n    middlewareB,\n    middlewareC\n  )\n);\n```\n\n在 `middlewareB`\
    \ 中调用 `next(action)` 将导致 action 传递给 `middlewareC`，然后是 reducer。\n\n在 `middlewareB`\
    \ 中调用 `dispatch(action)` 将导致 action 传递给 `middlewareA`，然后是 `middlewareB`、`middlewareC`，最后到达\
    \ reducer，并将执行权返回给 `middlewareB`。\n\n多次调用 `dispatch()` 是一种常见且有效的做法。`next()` 也可以调用多次，但不推荐，因为任何传递给\
    \ `next()` 的 action 都会跳过当前之前的中间件（例如，跳过日志中间件）。\n\n### 基于参数的间件\n\n在本章目前为止讨论的中间件外，某些中间件可能是可复用的，并支持在创建时传递参数。\n\
    \n例如，我们在本章早期创建的 `nullMiddleware`：\n\n简单的空中间件\n\n```javascript\nconst nullMiddleware\
    \ = () => next => action => {\n  next(action !== null ? action : { type: 'UNKNOWN'\
    \ });\n};\n```\n\n```javascript\nexport default nullMiddleware;\n```\n\n'UNKNOWN'\
    \ 键在我们的中间件中是硬编码的，无法在项目中方便地复用。为了让这个中间件更具通用性，我们可能希望支持任意 action 类型，并使用 `applyMiddleware()`\
    \ 阶段来指定我们希望中间件的行为：\n\n## 第 10 章 中间件\n\n### 可自定义的中间件\n\n```javascript\nimport {\
    \ createStore, applyMiddleware } from 'redux';\nimport reducer from 'reducers/root';\n\
    import nullMiddleware from 'middleware/null';\n\nconst store = createStore(reducer,\
    \ applyMiddleware(nullMiddleware('OH_NO')));\n```\n\n在这里，我们希望 `nullMiddleware`\
    \ 分发 'OH_NO' 而不是默认的 'UNKNOWN'。为了支持这一点，我们必须将中间件转换为“中间件创建器”：\n\n### 空中间件创建器\n\n\
