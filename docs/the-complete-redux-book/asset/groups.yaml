    \ and the recipe service to make the recipe as using imperial measurements. In\
    \ Redux, these are the reducers.\n\nWe want to add another layer, the middleware.\
    \ Every action will be first passed through a list of middleware. Unlike reducers,\
    \ middleware can modify, stop, or add actions. Examples might include: a logging\
    \ middleware, an authorization middleware that checks if the user has permissions\
    \ to run the action, or an API middleware that sends something to the server.\n\
    \nThis simple example shows the base of Redux. We have a single store to control\
    \ the state, actions to describe the changes we want to, reducers (services, in\
    \ our example) that know how to mutate the state based on the requested action,\
    \ and middleware to handle the housekeeping tasks.\n\nWhat makes Redux special,\
    \ and sometimes hard to understand, that reducers never change the state (in our\
    \ case, the recipe book), because it is immutable. Instead, the reducers must\
    \ create a new copy of the book, make the needed changes to the copy, and return\
    \ the new, modified book to the store. This approach allows Redux and the view\
    \ layers to easily do change detection. In later chapters we will discuss in detail\
    \ why and how this approach is used.\n\nIt is important to note that the whole\
    \ application state is kept in a single location, the store. Having a single source\
    \ of data provides enormous benefits during debugging, serialization, and development,\
    \ as will become apparent in the examples in this book.\n\n![](img/fbb45cbd9118f0a7f1feb2a04f50e708_14_0.png)\n\
    \nRedux overview\n\n## Redux Terminology\n\n### Actions and Action Creators\n\n\
    The only way for an application to change the state is by processing actions.\
    \ In most cases, actions in Redux are nothing more than plain JavaScript objects\
    \ passed to the store that hold all the information needed for the store to be\
    \ able to modify the state:\n\nExample of an action object\n\n```\n{\n  type:\
    \ 'INCREMENT',\n  payload: {\n    counterId: 'main',\n    amount: -10\n  }\n}\n\
    ```\n\nSince these objects might have some logic and be used in multiple places\
    \ in an application, they are commonly wrapped in a function that can generate\
    \ the objects based on a parameter:\n\nA function that creates an action object\n\
    \n```\nfunction incrementAction(counterId, amount) {\n  return {\n    type: 'INCREMENT',\n\
    \    payload: {\n      counterId,\n      amount\n    }\n  };\n};\n```\n\nAs these\
    \ functions create action objects, they are aptly named action creators.\n\n###\
    \ Reducers\n\nOnce an action is sent to the store, the store needs to figure out\
    \ how to change the state accordingly. To do so, it calls a function, passing\
    \ the current state and the received action:\n\nA function that calculates the\
    \ next state\n\n```\nfunction calculateNextState(currentState, action) {\n  ...\n\
    \  return nextState;\n}\n```\n\nThis function is called a reducer. In Redux applications,\
    \ there will be one root reducer function that will call additional reducer functions\
    \ to calculate the nested state.\n\nA simple reducer implementation\n\n```\nfunction\
    \ rootReducer(state, action) {\n  switch (action.type) {\n    case 'INCREMENT':\n\
    \      return { ...state, counter: state.counter + action.payload.amount };\n\
    \    default:\n      return state;\n  }\n}\n```\n\n> Reducers never modify the\
    \ state; they always create a new copy with the needed modifications.\n\n### Middleware\n\
    \nMiddleware is a more advanced feature of Redux and will be discussed in detail\
    \ in later chapters. The middleware act like interceptors for actions before they\
    \ reach the store: they can modify actions, create actions, and much more. Since\
    \ the middleware has access to the actions, the dispatch() function, and the store,\
    \ they are the most versatile and powerful entities in Redux.\n\n### Store\n\n\
    Unlike other implementations, Redux has a single store that holds the application\
    \ information but no user logic. The role of the store is to receive actions,\
    \ pass them through all middleware, and then use reducers to calculate a new state\
    \ and save it.\n\nWhen it receives an action that causes a change to the state,\
    \ the store will notify all the listeners that a change has been made. This will\
    \ allow various parts of the system, like the UI, to update according to the new\
    \ state.\n\n## General Concepts\n\nRedux is about functional programming and pure\
    \ functions. Understanding these concepts is crucial to understanding the underlying\
    \ principles of Redux.\n\nFunctional programming has become a trendy topic in\
    \ the web development domain lately, but it was invented around the 1950s. The\
    \ paradigm shifts around avoiding changing state and mutable data—in other words,\
    \ making your code predictable and free of side effects.\n\nJavaScript allows\
    \ you to write code in a functional style, as it treats functions as first-class\
    \ objects. This means you can store functions in variables, pass them as arguments\
    \ to other functions, and return them as values of other functions. But since\
    \ JavaScript was not designed to be a functional programming language per se,\
    \ there are some caveats that you will need to keep in mind. To get started with\
    \ Redux, you need to understand pure functions and mutation.\n\n### Pure and Impure\
    \ Functions\n\nA pure function returns values by using only its arguments: it\
    \ uses no additional data and changes no data structures, touches storage, and\
    \ emits no external events (like network calls). This means that you can be completely\
    \ sure that every time you call the function with the same arguments, it will\
    \ always get the same result. Here are some examples of pure functions:\n\nAn\
    \ example of a pure function\n\n```\nfunction square(x) {\n  return x * x;\n}\n\
    \nMath.sin(y);\narr.map((item) => item.id);\n```\n\nIf a function uses any variables\
    \ not passed in arguments or creates side effects, the function is impure. When\
    \ a function depends on variables or functions outside of its lexical scope, you\
    \ can never be sure that the function will behave the same every time it's called.\
    \ For example, the following are impure functions:\n"
