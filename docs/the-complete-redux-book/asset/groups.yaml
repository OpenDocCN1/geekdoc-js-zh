    Redux an object that contains the getState() and dispatch() functions. The middleware
    returns back a function that receives next() and in turn returns another function
    that receives action and finally contains our middleware code.


    > From the user''s perspective, a simple concept myMiddleware = (( getState, dispatch,
    next, action )) => {} might have seemed sufficient. The more complicated structure
    is due to Redux internals.


    The getState() and dispatch() methods should be familiar as they are APIs of the
    Redux store. The action parameter is the Redux action being passed to the store.
    The only next() function should look unfamiliar at this point.


    > It is sometimes incorrectly noted in teaching material that the parameter passed
    to the middleware is store (as it appears to have getState() and dispatch()).
    In practice, it''s an object holding only those two APIs and not the other APIs
    exported by the Redux store.'
  - "[PAGE 165]\n\n# Understanding next()\n\nIf we were to build our own implementation\
    \ of a middleware, we would probably want the ability to run code both before\
    \ an action is passed to the reducers and after. One approach would be to define\
    \ two different callbacks for before and after.\n\nRedux middleware takes a different\
    \ approach and gives us the next() function. Calling with an action will cause\
    \ it to propagate down the middleware chain, calling the root reducer and updating\
    \ the state of the store. We can add code before and after passing the action\
    \ to the reducers:\n\n```\nconst logMiddleware = ({getState, dispatch}) => next\
    \ => action => {\n  console.log(\"Before reducers have run\");\n  next(action);\n\
    \  console.log(\"After the reducers have run\");\n};\n```\n\nThis nifty trick\
    \ gives us more power than might initially be apparent. Since we are responsible\
    \ for calling next() and passing the action, we can choose to suppress next()\
    \ in certain conditions or even modify the current action before passing it. Failing\
    \ to call-next(action) inside a middleware will prevent the action from reaching\
    \ the other middleware and the store.\n\n# Our First Middleware\n\nTo demonstrate\
    \ the power of middleware, let's build a special debug middleware that measures\
    \ how much time it takes for our reducers to process an action.\n\n# Folder Structure\n\
    \nA common approach is to keep all our middleware implementations in a middleware\
    \ directory at our application root (similar to reducers and actions). As our\
    \ application grows, we might find ourselves adding subdirectories to organize\
    \ the middleware, usually by functionality (utility or authorization).\n\n> As\
    \ with software and hardware, we use middleware as both the singular and the plural\
    \ form of the word. In some sources, including the code for applyMiddleware()\
    \ shown in Chapter 8, you may see middlewares used as the plural form.\n\n# The\
    \ Measure Middleware\n\nOur time measuring middleware looks like this:"
  - "[PAGE 166]\n\n# Chapter 10. Middleware\n\nmiddleware/measure.js\n\n```\nconst\
    \ measureMiddleware = () => next => action => {\n  console.time(action.type);\n\
    \  next(action);\n  console.timeEnd(action.type);\n};\n\nexport default measureMiddleware;\n\
    ```\n\nTo create this middleware we use the time() and timeEnd() console methods\
    \ that record a benchmark with the name provided as a string. We start the timing\
    \ before running any action, using the action.type as a name. Then, we tell the\
    \ browser to print the timing after the action is done. This way we can catch\
    \ poorly performing reducer implementations.\n\nAn interesting to note here is\
    \ that this middleware completely ignores the first parameter (the object get\
    \ getState() and dispatch()), as we don't need it for our example.\n\n# Connecting\
    \ to Redux\n\nAdding a middleware to the Redux store can be done only during the\
    \ store creation process:\n\nRegular Redux store\n\n```\nimport { createStore\
    \ } from 'redux';\nimport reducer from 'reducers/root';\nconst store = createStore(reducer);\n\
    \n```\n\nThe simplest way to connect a middleware to the Redux store is to use\
    \ the applyMiddleware() store enhancer available as an API from Redux itself (store\
    \ enhancers are explained in Chapter 8:\n\nCreate store and register the measureMiddleware\n\
    \n```\nimport { createStore, applyMiddleware } from 'redux';\nimport reducer from\
    \ 'reducers/root';\nimport measureMiddleware from 'middleware/measure';\nconst\
    \ store = createStore(reducer, applyMiddleware(measureMiddleware));\n```\n\nThe\
    \ applyMiddleware() function can receive an arbitrary number of middleware as\
    \ arguments and create a chain to be connected to the store:"
- md: "\n## Chapter 10. Middleware\n\napplyMiddleware(middlewareA, middlewareB, middlewareC);\n\
    \n> Note that the order of registration is important. The first middleware, in\
    \ our case middlewareA, will get the action before middlewareB. And if the code\
    \ decides to modify or suppress the action, it will never reach middlewareB or\
    \ middlewareC.\n\nIn real-world applications, we prefer to apply some middleware\
    \ only in development or production environments. For example, our measureMiddleware\
    \ might output unwanted information in the live product, and an analyticsMiddleware\
    \ might report false analytics in development.\n\nUsing the spread operator from\
    \ ES2016, we can apply middleware to the state conditionally:\n\n```javascript\n\
    const middleware = [apiMiddleware];\nif (development) {\n  middleware.push(measureMiddleware);\n\
    } else {\n  middleware.push(analyticsMiddleware);\n}\nconst store = createStore(reducer,\
    \ applyMiddleware(...middleware));\n```\n\n# Async Actions\n\nWhat makes middleware\
    \ so powerful is the access to both getState() and dispatch(), as these functions\
    \ allow a middleware to run asynchronous actions and give it access to the store.\
    \ A very simple example would be an action debounce middleware. Suppose we have\
    \ an autocomplete field, and we want the AUTO_COMPLETE action from running as\
    \ the user types in a search term. We would probably want to wait 500ms for the\
    \ user to type in the search string, and then run the query with the latest value.\n\
    \nWe can create a debounce middleware that will catch any action with the debounce\
    \ key set in its metadata and ensure it is delayed by that number of milliseconds.\
    \ Any additional action of the same type that is passed before the debounce timer\
    \ expires will not be passed to reducers but only saved as the “latest action”\
    \ and executed once the debounce timer has expired:\n\n# Debounce flow\n\n```\n\
    0ms: dispatch({ type: 'AUTO_COMPLETE', payload: 'c', meta: { debounce: 50 } });\n\
    // Suppressed\n10ms: dispatch({ type: 'AUTO_COMPLETE', payload: 'ca', meta: {\
    \ debounce: 50 } });\n// Suppressed\n20ms: dispatch({ type: 'AUTO_COMPLETE', payload:\
    \ 'cat', meta: { debounce: 50 } });\n// Suppressed\n50ms:\n// The action with\
    \ payload 'cat' is dispatched by the middleware.\n```\n\nThe skeleton of our middleware\
    \ needs to inspect only actions that have the required debounce time set in their\
    \ metadata.\n\n# Debounce middleware skeleton\n\n```javascript\nconst debounceMiddleware\
    \ = () => next => action => {\n  const { debounce } = action.meta || {};\n\n \
    \ if (!debounce) {\n    return next(action);\n  }\n\n  // TODO: Handle debouncing\n\
    };\n\nexport default debounceMiddleware;\n```\n\nSince we want each action type\
    \ to have a different debounce queue, we will create a pending object that will\
    \ hold information for each action type. In our case, we only need a handle to\
    \ the latest timeout for each action type.\n\n# Saving latest debounced action\
    \ object\n\n```javascript\n// Object to hold debounced actions (referenced by\
    \ action.type)\nconst pending = {};\n\nconst debounceMiddleware = () => next =>\
    \ action => {\n  const { debounce } = action.meta || {};\n\n  if (debounce) {\n\
    \    return next(action);\n  }\n\n  if (pending[action.type]) {\n    clearTimeout(pending[action.type]);\n\
    \  }\n\n  // Save latest debounced action\n  pending[action.type] = setTimeout(()\
    \ => {\n    // implement debounce\n  }, debounce);\n};\n```\n\nIf there is already\
    \ a pending action of this type, we can cancel the timeout and create a new timeout\
    \ to handle this. The previous one can be safely ignored—for example, in case\
    \ an action { type: 'AUTO_COMPLETE', payload: 'cat' } comes right after { type:\
    \ 'AUTO_COMPLETE', payload: 'ca' }, we can safely ignore the one with 'ca' and\
    \ only call the autocomplete API for 'cat'.\n\n# Timeout handler code\n\n```javascript\n\
    setTimeout(\n  () => {\n    delete pending[action.type];\n    next(action);\n\
    \  }, debounce);\n```\n\nOnce the timeout for the latest action has elapsed, we\
    \ clear the key from our pending object and next() method to allow the last delayed\
    \ action to finally pass through to the other middleware and the store:\n\n# Complete\
    \ debounce middleware code\n\n```javascript\n// Object to hold debounced actions\
    \ (referenced by action.type)\nconst pending = {};\nconst debounceMiddleware =\
    \ () => next => action => {\n  const { debounce } = action.meta || {};\n\n  if\
    \ (debounce) {\n    return next(action);\n  }\n\n  if (pending[action.type]) {\n\
    \    clearTimeout(pending[action.type]);\n  }\n\n  pending[action.type] = setTimeout(()\
    \ => {\n    delete pending[action.type];\n    next(action);\n  }, debounce);\n\
    };\n\nexport default debounceMiddleware;\n```\n\nWith this basic middleware we\
    \ have created a powerful tool for our developers. A simple meta setting on an\
    \ action can now support debouncing of any action in the system. We have also\
    \ used the middleware's support for the next() method to selectively suppress\
    \ actions. The Server Communication Chapter we will learn more about advanced\
    \ uses of the async flow to handle generic API requests.\n\n# Using Middleware\
    \ for Flow Control\n\nOne important usage of middleware is for the control of\
    \ application flow and logic. Let's consider a sample user login flow:\n\n- Send\
    \ POST request to server to login\n- Save access token in store\n- Fetch current\
    \ user's profile information\n- Fetch latest notifications\n\nUsually our flow\
    \ will begin with a 'LOGIN' action containing the login credentials:\n\n# Example\
    \ of login action\n\n```\n{\n  type: 'LOGIN',\n  payload: {\n    email: 'info@redux.com',\n\
    \    password: 'will-tell'\n  }\n}\n```\n\nAfter the server completes successfully,\
    \ another action will be dispatched, similar to:\n\n# Successful login\n\n```\n\
    {\n  type: 'SUCCESSFUL_LOGIN',\n  payload: 'access_token'\n}\n```\n\nOne of the\
    \ readers will make sure to update the access token in the state, but it is unclear\
    \ who is responsible for issuing the two actions required: info and notifications.\
    \ We could always use complex action creators:\n\n```javascript\nconst login =\
    \ (email, password) => dispatch => {\n  postServer({email, password})\n    .then((response)\
    \ => {\n      dispatch(successfulLogin(response.accessToken));\n    });\n}\n```\n\
    \nBut this might cause a code reuse problem. If in the future we want to support\
    \ Facebook Connect, it will require a different action altogether, which will\
    \ still need to include info and notifications.\n\nA simple solution to the problem\
    \ is to cause the actions to be dispatched only after the login is successful.\
    \ In the regular Redux flow, there is only one actor that can listen for and react\
    \ to events—the middleware:\n\n# Login flow middleware\n\n```javascript\nconst\
    \ loginFlowMiddleware = ({ dispatch }) => next => action => {\n  // Let the reducer\
    \ save the access token in the state\n  next(action);\n  if (action.type === SUCCESSFUL_LOGIN)\
    \ {\n    dispatch(fetchUserInfo());\n    dispatch(fetchNotifications());\n  }\n\
    };\n```\n\nOur new code holds the flow in a single place and will allow us to\
    \ easily support login via Twitter, Google Apps, and more.\n\nIn practice we can\
    \ combine flows together and add conditions and more complicated logic, as have\
    \ full access to both dispatch() and getState().\n\n> There are a few external\
    \ libraries to make flow management easier, such as redux-saga. # Other Action\
    \ Types\n\nWhen learning the bases of Redux, developers are usually taught that\
    \ actions in Redux can only be objects and must contain the 'type' key. In practice,\
    \ reading this book and online material, you'll notice Error objects, functions,\
    \ and promises being passed to dispatch().\n\nThe underlying rule is simple: our\
    \ root reducer requires an object as an action, but our middleware has no limits\
    \ and is free to handle any type of data passed to dispatch().\n\nTry running\
    \ dispatch(null). You should get an error from Redux similar to:\n\n```\nstore.dispatch(null);\n\
    > Uncaught TypeError: Cannot read property 'type' of null(...)\n```\n\nTo add\
    \ support for null we can create our own nullMiddleware:\n"
  mdcn: "\n\n## 第 10 章 中间件\n\napplyMiddleware(middlewareA, middlewareB, middlewareC);\n\
    \n> 注意，注册的顺序非常重要。第一个中间件（在我们的例子中是 middlewareA）将在 middlewareB 之前获取到 action。如果代码决定修改或抑制该\
    \ action，它将永远不会到达 middlewareB 或 middlewareC。\n\n在实际应用中，我们倾向于只在开发环境或生产环境中使用某些中间件。例如，我们的\
    \ `measureMiddleware` 可能在正式产品中输出不需要的信息，而 `analyticsMiddleware` 可能会在开发环境中报告虚假的分析数据。\n\
    \n使用 ES2016 的展开运算符，我们可以根据条件对状态应用中间件：\n\n```javascript\nconst middleware = [apiMiddleware];\n\
    if (development) {\n  middleware.push(measureMiddleware);\n} else {\n  middleware.push(analyticsMiddleware);\n\
    }\nconst store = createStore(reducer, applyMiddleware(...middleware));\n```\n\n\
    # 异步动作\n\n中间件之所以强大，是因为它可以同时访问 `getState()` 和 `dispatch()`，因为这些函数允许中间件运行异步动作并让其访问\
    \ store。一个非常简单的例子是 action 防抖（debounce）中间件。假设我们有一个自动完成字段，我们不希望在用户输入搜索词时运行 `AUTO_COMPLETE`\
    \ 动作。我们可能希望等待 500ms 让用户输入完搜索字符串，然后使用最新值执行查询。\n\n我们可以创建一个防抖中间件，它会捕获任何元数据中设置了 `debounce`\
    \ 键的 action，并确保它延迟相应的毫秒数。在防抖计时器过期之前传递的任何相同类型的额外 action 都不会传递给 reducers，而仅会被保存为“最新动作”，并在防抖计时过期后执行一次：\n\
    \n# 防抖流程\n\n```\n0ms: dispatch({ type: 'AUTO_COMPLETE', payload: 'c', meta: {\
    \ debounce: 50 } });\n// 被抑制\n10ms: dispatch({ type: 'AUTO_COMPLETE', payload:\
    \ 'ca', meta: { debounce: 50 } });\n// 被抑制\n20ms: dispatch({ type: 'AUTO_COMPLETE',\
    \ payload: 'cat', meta: { debounce: 50 } });\n// 被抑制\n50ms:\n// payload 为 'cat'\
    \ 的 action 由中间件分发。\n```\n\n我们的中间件骨架只需要检查元数据中设置了所需防抖时间的 action。\n\n# 防抖中间件骨架\n\n\
    ```javascript\nconst debounceMiddleware = () => next => action => {\n  const {\
    \ debounce } = action.meta || {};\n\n  if (!debounce) {\n    return next(action);\n\
    \  }\n\n  // TODO: 处理防抖\n};\n\nexport default debounceMiddleware;\n```\n\n由于我们希望每个\
    \ action type 都有不同的防抖队列，我们将创建一个 `pending` 对象，存储每个 action type 的信息。在我们的例子中，我们只需要每个\
    \ action type 的最新超时处理句柄。\n\n# 保存最新的防抖动作对象\n\n```javascript\n// 用于存储防抖动作的对象（通过\
    \ action.type 引用）\nconst pending = {};\n\nconst debounceMiddleware = () => next\
    \ => action => {\n  const { debounce } = action.meta || {};\n\n  if (debounce)\
    \ {\n    return next(action);\n  }\n\n  if (pending[action.type]) {\n    clearTimeout(pending[action.type]);\n\
    \  }\n\n  // 保存最新的防抖动作\n  pending[action.type] = setTimeout(() => {\n    // 实现防抖\n\
    \  }, debounce);\n};\n```\n\n如果已经存在此类型的待处理动作，我们可以取消当前的超时并创建一个新的超时来处理。之前的那个可以安全地忽略——例如，当\
    \ action { type: 'AUTO_COMPLETE', payload: 'cat' } 紧跟在 { type: 'AUTO_COMPLETE',\
    \ payload: 'ca' } 之后出现时，我们可以安全地忽略 'ca' 的那个，仅为 'cat' 调用自动完成 API。\n\n# 超时处理器代码\n\
    \n```javascript\nsetTimeout(\n  () => {\n    delete pending[action.type];\n  \
    \  next(action);\n  }, debounce);\n```\n\n一旦 action 的超时完成，中间件将从 `pending` 对象中删除它，并通过\
    \ `next()` 方法将 action 传递到 store：\n\n# 完整的中间件代码\n\n```javascript\n// 用于存储防抖动作的对象（通过\
    \ action.type 引用）\nconst pending = {};\nconst debounceMiddleware = () => next\
    \ => action => {\n  const { debounce } = action.meta || {};\n\n  if (!debounce)\
    \ {\n    return next(action);\n  }\n\n  if (pending[action.type]) {\n    clearTimeout(pending[action.type]);\n\
    \  }\n\n  // 保存最新的防抖动作\n  pending[action.type] = setTimeout(() => {\n    // 实现防抖\n\
    \    delete pending[action.type];\n    next(action);\n  }, debounce);\n};\n\n\
    export default debounceMiddleware;\n```\n"
