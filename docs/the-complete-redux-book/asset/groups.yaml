    arr.map((item) => calculate(item));\n```\n\n## 变异对象\n\n另一个让开始接触 Redux 的开发者经常头疼的概念是不可变性（immutability）。JavaScript\
    \ 管理不可变对象的工具有限，我们通常需要使用外部库。\n\n不可变性意味着某些东西不能被改变，它向开发者保证：如果你创建了一个对象，它将永远具有相同的属性和值。例如，让我们声明一个简单的对象为常量：\n\
    \nJavaScript 中定义为 const 的对象\n\n```javascript\nconst colors = {\n  red: '#FF0000',\n\
    \  green: '#00FF00',\n  blue: '#0000FF'\n};\n```\n\n即使 `colors` 对象是一个常量，我们仍然可以改变它的内容，因为\
    \ `const` 只会检查对象的引用是否发生：\n\nJavaScript 允许更改 const 定义的对象\n\n```javascript\ncolors\
    \ = {};\nconsole.log(colors);\ncolors.red = '#FFFFFF';\nconsole.log(colors.red);\n\
    ```\n\n尝试在开发者控制台中编写这段代码。你会发现你无法为 `colors` 重新赋值空对象，但可以更改它的内部值。\n\n为了让 `colors`\
    \ 对象看起来是不可变的，我们可以使用 `Object.freeze()` 方法：\n\n### 让普通对象变为不可变\n\n```javascript\n\
    Object.freeze(colors);\ncolors.red = '#F00000';\nconsole.log(colors.red);\n```\n\
    \n`red` 属性的值将不会是 `'#FFFFFF'`。如果你认为值应该是 `'#FF0000'`，那么你忽略了我们在冻结之前已经修改了 `red` 属性。这是一个说明在实际应用中遗漏此类问题的绝佳例子。\n\
    \n在这里，我们使用了 `Object.freeze()`，`colors` 对象变得不可变了。在实践中，情况通常更复杂，尽管 JavaScript 没有提供让数据结构完全不可变的原生方法。`Object.freeze()`\
    \ 不冻结嵌套对象：\n\nObject.freeze() 不冻结嵌套对象\n\n```javascript\nconst orders = {\n  bread:\
    \ {\n    price: 10\n  },\n  milk: {\n    price: 20\n  }\n};\nObject.freeze(orders);\n\
    orders.milk.price -= 15;\nconsole.log(orders.milk.price);\n```\n\n为了应对我们喜爱的语言的特性，我们必须使用第三方库，如\
    \ *deep-freeze* 或 *ImmutableJS*¹。我们将在书的后部分讨论不同的不可变库。\n\n## Redux 和 React\n\nRedux\
    \ 最初是对 React 的响应，但它已开始通过 Angular 等其他框架吸引大量的追随者。从根本上说，Redux 是完全框架无关的，它可以轻松与任何 JavaScript\
    \ 框架配合，处理状态和变化。\n\n> *https://github.com/substack/deep-freeze\n>¹https://facebook.github.io/immutable-js/\n\
    \n与不同框架的连接是通过第三方库实现的，这些库为每个框架提供了一套便利函数，以便无缝连接到 Redux。我们将用于连接 Redux 和 React 的库称为\
    \ `react-redux`，我们将在书中对其进行详细介绍。\n\n## 基础 Redux 实现\n\n人们喜欢 Redux 是因为它的简单。事实上，它简单到我们可以在几行代码中实现它的大部分功能。与其他框架不同（其他框架学习的唯一方法是研究\
    \ API），在这里我们可以自己开始实现 Redux。\n\nRedux 的基本假设是：所有的应用程序状态都保存在一个地方，即 store（存储器）。要在应用程序中使用这一思想，我们需要找到一种方法来：\n\
    \n1. 根据事件（用户生成的或来自服务器的）修改状态。\n2. 监控状态变化以便我们可以更新 UI。\n\n第一部分可以分为两个功能块：\n\n1. 通知状态已经发生了一个动作（action）。\n\
    2. 帮助 store 根据我们的应用程序逻辑确定如何修改状态。\n\n使用这种结构，让我们构建一个实现计数器的简单应用程序。我们的应用程序将使用纯 JavaScript\
    \ 和 HTML，不需要任何额外的库。我们将有两个按钮，允许我们增加和减少一个简单的计数器，并有一个可以查看当前计数器值的地方：\n\nindex.html\
    \ 文件\n\n```html\n<div>\n  Counter:\n  <span id='counter'></</span>\n  <button\
    \ id='inc'>Increment</button>\n  <button id='dec'>Decrement</button>\n</div>\n\
    ```\n\n我们的应用程序状态将将简单地持有计数器值：\n\n一个持有计数器的简单状态\n\n```javascript\nlet state = {\n\
    \  counter: 3\n};\n```\n\n为了让我们的演示运行起来，让我们为每个按钮创建一个点击处理程序，它将使用 `dispatch()` 函数来存储我们需要执行某项动作的状态：\n\
    \n### 基础 dispatch API\n\n```javascript\nfunction dispatch(action) { ... };\n```\n\
    \n将点击事件连接到 dispatch\n\n```javascript\n// 监听点击事件\ndocument.querySelector('#inc').onclick\
    \ = () => dispatch('INC');\ndocument.querySelector('#dec').onclick = () => dispatch('DEC');\n\
    ```\n\n我们将在本章稍后部分回到它的实现。此外，我们定义了一个更新的函数：\n\n更新计数器的代码\n\n```javascript\n// 更新视图（这可能在实际应用中）\n\
    function updateView() {\n  document.querySelector('#counter').innerText = state.counter;\n\
    }\n```\n\n由于我们希望视图代表当前状态，我们需要在状态每次变化时更新它。为了这一点，我们将使用 `subscribe()` 函数，我们也将实现它：\n\
    \n### 订阅变化\n\n```javascript\nsubscribe(updateView);\n```\n\n我们现在创建了一个基础应用程序结构，拥有简单的状态，实现了一个根据状态更新\
    \ HTML 的函数，并定义了两个“神奇”函数——`dispatch()` 和 `subscribe()`——用于调度动作和订阅变化。但仍然缺少一件事：我们的迷你\
    \ Redux 如何知道如何处理事件并更改应用程序状态？\n\n为此，我们定义了一个额外的函数。在每次调度动作时，Redux 都会调用该函数。为了符合 Redux\
    \ 的术语，我们将该函数命名为 reducer。reducer 的工作是理解动作，并据此创建一个新状态。\n\n在我们的简单示例中，状态将持有计数器，其值将根据动作增加或减少：\n\
    \n用于 INC 和 DEC 动作的简单 reducer\n\n```javascript\n// 我们的 reducer 函数根据动作创建新状态\nfunction\
    \ reducer(state, action) {\n  switch (action) {\n    case 'INC':\n      return\
    \ { ...state, counter: state.counter + 1 };\n    case 'DEC':\n      return { ...state,\
    \ counter: state.counter - 1 };\n    default:\n      return state;\n  }\n}\n```\n\
    \n记住的一点是，reducers 必须返回状态的新修改副本。它们不应该改变现有状态，就像这个示例所示：\n\n更改状态的方法\n\n```javascript\n\
    // 这是错误的！\nstate.counter = state.counter + 1;\n```\n\n在书的后部分，你将学习如何在不借助外部库的情况下避免\
    \ JavaScript 中的变异。\n\n现在是实现状态实际更改了。由于我们正在构建通用框架，我们不会包含增加/减少计数器的代码（因为它是应用程序特定的），而是调用一个我们期望用户提供的函数，称为\
    \ `reducer()`。`dispatch()` 函数调用应用程序创建者实现的 `reducer()`，传递当前状态和收到的动作。这些信息足以让 `reducer()`\
    \ 函数计算新状态。然后我们检查新状态是否与旧状态不同，如果是，则替换旧状态并通知所有监听者变化。\n\n"
