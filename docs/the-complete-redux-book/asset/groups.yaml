    \ 已经发生了变化，它现在支持一个可选的 store 装饰参数。\n\n## 高阶函数\n\n在继续之前，让我们快速概述一下什么是高阶函数。我们可以将该术语定义为接受一个或多个函数作为参数、返回一个函数作为结果或两者兼有的函数。这里有一个示例：\n\
    \n高阶函数示例\n\n```javascript\nfunction output(message) {\n  console.log(message);\n\
    }\nfunction addTimestamp(fn) {\n  return function(...args) {\n    console.log(`Executed\
