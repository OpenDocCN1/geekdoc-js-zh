    \ splitting）的技术——将包拆分为多个文件并在用户执行某些操作时按需加载。热更新工具不在本书的范围内，但你可能想知道代码分割可以通过 replaceReducer\
    \ 方法应用于 store。\n\n让我们来看一个针对已登录用户的简单示例。初始加载时，我们的 store 只处理 substate：\n\n## 第7章\
