    \ Jest 将快照版本更新为新版本。\n\n## 动态动作创建器\n\n在某些情况下，动作创建器（action creators）可能包含逻辑，根据输入参数发射不同的\
    \ action 对象。只要不涉及异步代码或外部实体（如 `localStorage`），我们就可以通过向动作创建器提供不同的输入参数并验证每个对象来轻松测试逻辑：\n\
    \n修改输入的动作创建器\n\n```javascript\nexport const addRecipe = (title) => ({\n  type:\
    \ actions.ADD_RECIPE,\n  payload: title || \"Default\"\n});\n```\n\n如果用户没有提供标题，修改后的\
    \ `addRecipe()` 动作创建器会将 `payload` 设置为 \"Default\"。为了测试此行为，我们可以创建两个测试：一个提供参数（如我们之前做的那样），另一个提供空字符串。一个完全全面的测试可能包含针对\
    \ `null`、`undefined` 和 `''` 的“空字符串”情况：\n\n多个空输入值的组合测试\n\n```javascript\nit('should\
    \ add recipe with default parameter', () => {\n  expect(actions.addRecipe(undefined)).toMatchSnapshot();\n\
    \  expect(actions.addRecipe(null)).toMatchSnapshot();\n  expect(actions.addRecipe('')).toMatchSnapshot();\n\
    });\n```\n\n与我们之前讨论的不同的是，我们尝试将多个 `expect()` 函数放在同一个测试中。这种方法可以运行，但在发生错误时，将很难识别是哪个测试失败了。\n\
    \n由于我们使用 JavaScript 编写测试，我们可以轻松地为每个输入值创建测试用例，而不会显著增加代码体积（通过为每个用例创建一个 `it()` 子句）。我们可以通过将所有可能的输入放入数组中并自动创建\
