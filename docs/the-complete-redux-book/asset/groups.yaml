    \ API 占用加上强大的通用性，使得 Redux 如此吸引人且易于理解。\n\n## 装饰 Store\n\nRedux 的基础 store 功能非常简单，足以应对大多数用例。有时，我们需要稍微修改其中一个方法，甚至添加新方法以支持更高级的用例。这可以通过装饰\
