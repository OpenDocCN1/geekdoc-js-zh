    \ [...ingredients, action.payload];\n  }\n};\n```\n\nThere are two things to note\
    \ in this implementation compared to what we saw with the denormalized state:\n\
    \n- The books reducer is not even mentioned. Nesting levels only affect the parent\
    \ and children, never the grandparents. The recipes reducer only adds an ID to\
