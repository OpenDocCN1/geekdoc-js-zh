    # Chapter 7. The Store


    # Basic reducer setup


    ```

    import { combineReducers } from ''redux'';

    import { currentUser } from ''reducers/current-user'';

    const reducer = (state, action) => combineReducers({ currentUser });

    const store = createStore(reducer);

    ```


    If combineReducers() looks unfamiliar to you, take a look at Chapter 9 to learn
    about this technique. For now, let''s assume the functions inside are handling
    a currentUser state. After the user signs in, we load the new functionality. We
    need to make our store aware of the new subset of our application state and the
    function that should handle it. Here is the replaceReducer() method in handy:


    # Replacing the root reducer


    ```

    const newReducer = (state, action) => combineReducers({ currentUser, recipes });

    store.replaceReducer(reducer);

    ```


    Keep in mind that when you replaceReducer(), Redux automatically calls the initial
    action it calls when the new reducer automatically gets and the new state is immediately
    available via the store.getState() method. For on the initial action, see Chapter
    9.


    The same technique can be used by development tools to implement the hot reloading
    mechanism for a better developer experience. Hot reloading is a concept where
    source code changes don''t cause a full page reload, but rather the affected code
    is swapped in place by special software and the application as whole is kept in
    the state that it was before the code change. Hot reloading tools are outside
    the scope of this book, but you can easily find more information online.


    # Store as Observable


    Starting from version 3.5.0, Redux store can also act as an Observable. This allows
    libraries like RxJS to subscribe to the store''s state changes. This subscription
    method is different from the regular subscribe() method of the store: when subscribing
    to the store as an observable, the latest state is passed without the need to
    call store.getState().


    > To support older browsers, Redux uses the symbol-observable² polyfill when Symbol.observable
    is not supported.


    ²https://github.com/bleish/symbol-observable'
