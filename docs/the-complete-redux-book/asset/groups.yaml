    \n```\nconst thunkMiddleware = ({dispatch, getState}) => next => action => {\n\
    if (typeof action === 'function') {\n  return action(dispatch, getState);\n}\n\
    return next(action);\n```\n\nIt checks if the action passed is 'function' instead\
    \ of the regular object, and if it is a function it\n\"calls\" it, passing dispatch()\
    \ and getState().\n\nA similar approach is used by other middleware that know\
