    \ API 来返回一个成功的响应。我们将使用在本章“异步动作创建者”部分中创建的 `mockFetch()` 工具。\n我们的基础测试需要检查 `API_FINISHED`\
    \ 是否被分发了一次，以及我们的 `success()` 动作创建者是否被调用、传递响应并分发到 store：\n\n成功测试框架\n\n```javascript\n\
