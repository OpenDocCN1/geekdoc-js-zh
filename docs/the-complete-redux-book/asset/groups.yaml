    ## Mutating Objects\n\nAnother concept that often causes headaches for developers\
    \ starting to work with Redux is immutability. JavaScript has limited tooling\
    \ for managing immutable objects, and we are often required to use external libraries.\n\
    \nImmutability means something that cannot be changed, guaranteeing developers\
    \ that if you create an object, it will have the same properties and values forever.\
    \ For example, let's declare a simple object as a constant:\n\nObject defined\
    \ as const in JavaScript\n\n```javascript\nconst colors = {\n  red: '#FF0000',\n\
    \  green: '#00FF00',\n  blue: '#0000FF'\n};\n```\n\nEven though the colors object\
    \ is a constant, we can still change its content, as const will only check the\
    \ reference to the object is changed:\n\nJavaScript allows changes of const defined\
    \ objects\n\n```javascript\ncolors = {};\nconsole.log(colors);\ncolors.red = '#FFFFFF';\n\
    console.log(colors.red);\n```\n\nTry writing this in the developer console. You\
    \ will see that you can't reassign an empty object to colors, but you can change\
    \ its internal value.\n\nTo make the colors object appear immutable, we can use\
    \ the Object.freeze() method:\n\n### Making a plain object immutable\n\n```javascript\n\
    Object.freeze(colors);\ncolors.red = '#F00000';\nconsole.log(colors.red);\n```\n\
    \nThe value of the red property will not be '#FFFFFF'. If you thought that value\
    \ should be '#FF0000', you missed that we changed the red property before we froze\
    \ it. This is a good example of how easy it is to miss this kind of thing in real\
    \ applications.\n\nHere, we used Object.freeze(), the colors object became immutable.\
    \ In practice things are often more complicated, though JavaScript does not provide\
    \ native ways to make data structures fully immutable. Object.freeze() won't freeze\
    \ nested objects:\n\nObject.freeze() does not freeze nested objects\n\n```javascript\n\
    const orders = {\n  bread: {\n    price: 10\n  },\n  milk: {\n    price: 20\n\
    \  }\n};\nObject.freeze(orders);\norders.milk.price -= 15;\nconsole.log(orders.milk.price);\n\
    ```\n\nWork around the nature of our beloved language, we have to use third-party\
    \ libraries like deep-freeze* or ImmutableJS¹. We will talk about different immutable\
    \ libraries later in the book.\n\n## Redux and React\n\nRedux started out as a\
    \ reaction to React, but has started to gather a major following with other frameworks\
    \ like Angular. At its base Redux is fully framework-agnostic, and it can easily\
    \ be used with any JavaScript framework to handle state and changes.\n\n> *https://github.com/substack/deep-freeze\n\
    >¹https://facebook.github.io/immutable-js/\n\nThe connection to different frameworks\
    \ is done with the help of third-party libraries that provide a set of convenience\
    \ functions for each framework in order to seamlessly connect to Redux. The library\
    \ that we will use to connect Redux and React is called react-redux, and we will\
    \ be covering it extensively in the book.\n\n## Basic Redux Implementation\n\n\
    People love Redux because of its simplicity. In fact, it is so simple that we\
    \ can implement most of it in a handful of lines of code. Unlike with other frameworks,\
    \ where the only way to learn is to study the API, here we can start implementing\
    \ Redux ourselves.\n\nThe basic premise behind Redux is the idea that all the\
    \ application state is saved in one place, the store. To use this idea in applications\
    \ we will need to find a way to:\n\n1. Modify the state as a result of events\
    \ (user-generated or from the server).\n2. Monitor state changes so we can update\
    \ the UI.\n\nThe first part can be split into two blocks of functionality:\n\n\
    1. Notify the state that an action has happened.\n2. Help the store figure out\
    \ how to modify the state according to our application’s logic.\n\nUsing this\
    \ structure, let's build a simple application that will implement a counter. Our\
    \ application will use pure JavaScript and HTML and require no additional libraries.\
    \ We are going to have two buttons that allow us to increment and decrement a\
    \ simple counter, and a place where we can see the current counter value:\n\n\
    The index.html file\n\n```html\n<div>\n  Counter:\n  <span id='counter'></span>\n\
    \  <button id='inc'>Increment</button>\n  <button id='dec'>Decrement</button>\n\
    </div>\n```\n\nOur application state will simply hold the counter value:\n\n###\
    \ A simple state holding a counter\n\n```javascript\nlet state = {\n  counter:\
    \ 3\n};\n```\n\nTo make our demo functional, let's create a click handler for\
    \ each button that will use a dispatch() function to store our state that an action\
    \ needs to be performed:\n\n### A basic dispatch API\n\n```javascript\nfunction\
    \ dispatch(action) { ... };\n```\n\nConnect click events to dispatch\n\n```javascript\n\
    // Listen to click events\ndocument.querySelector('#inc').onclick = () => dispatch('INC');\n\
    document.querySelector('#dec').onclick = () => dispatch('DEC');\n```\n\nWe will\
    \ come back to its implementation later in this chapter. Also, we define a function\
    \ that updates the:\n\n### Code to update the counter\n\n```javascript\n// Update\
    \ view (this might be in a real app)\nfunction updateView() {\n  document.querySelector('#counter').innerText\
    \ = state.counter;\n}\n```\n\nSince we want our view to represent the current\
    \ state, we need it to be updated every time the state changes. For that, we will\
    \ use the subscribe() function, we will also implement it:\n\n### Subscribe to\
    \ changes\n\n```javascript\nsubscribe(updateView);\n```\n\nWe have now created\
    \ a basic application structure with a simple state, implemented a function that\
    \ updates the HTML based on the state, and defined two \"magic\" functions–dispatch()\
    \ and subscribe()–to dispatch actions and subscribe to changes. But there is still\
    \ one thing missing. How will our mini-Redux know how to handle the events and\
    \ change the application state?\n\nFor this, we define an additional function.\
    \ On each action dispatched, Redux will call this function. To be compliant with\
    \ Redux's terminology, we will call the function reducer. The job of the reducer\
    \ will be to understand the action, and based on it, create a new state.\n\nIn\
    \ our simple example state will hold a counter, and its value will be incremented\
    \ or decremented based on the action:\n\n### Simple reducer for INC and DEC actions\n\
    \n```javascript\n// Our reducer function creates a new state based on the action\n\
    function reducer(state, action) {\n  switch (action) {\n    case 'INC':\n    \
    \  return { ...state, counter: state.counter + 1 };\n    case 'DEC':\n      return\
    \ { ...state, counter: state.counter - 1 };\n    default:\n      return state;\n\
    \  }\n}\n```\n\nAn important thing to remember is that reducers must always return\
    \ a new, modified copy of the state. They shouldn't mutate the existing state,\
    \ like in this example:\n\n### Incorrect way to change state\n\n```javascript\n\
    // This is wrong!\nstate.counter = state.counter + 1;\n```\n\nLater in the book\
    \ you will learn how to avoid mutations in JavaScript and without the help of\
    \ external libraries.\n\nNow it's time to implement the actual change of the state.\
    \ Since we are building a generic framework, we will not include the code to increment/decrement\
    \ the counter (as it is application-specific) but will call a function that we\
    \ expect the user to provide, called reducer(). The dispatch() function calls\
    \ the reducer() implemented by the application creator, passing both the current\
    \ state and the action it received. This information should be enough for the\
    \ reducer() function to calculate a new state. We then check if the new state\
    \ differs from the old one, and if it does, we replace the old state and notify\
    \ all the listeners of the change.\n"
  mdcn: "\n\n## 第 1 章 Flux 和 Redux 的核心概念\n\n一个纯函数的示例\n\n```javascriptfunction getUser(userId)\
