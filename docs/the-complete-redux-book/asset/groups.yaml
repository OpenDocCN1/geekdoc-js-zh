    \ id: 'XXX', type: 'ADD_MESSAGE', msg: 'Hello' }。我们的 store 可以通过将消息添加到当前的消息数组中立即处理此操作，并通过\
    \ WebSocket 将其“原样”发送到服务器。相反，服务器可以将消息广播给所有其他客户端。每个客户端都会收到一个完全标准的 Redux action，该\
    \ action 可以直接传递给 store。\n\n通过这种方式，我们的前端就可以使用 Redux action 在浏览器窗口和机器之间传递信息，并将服务器作为通用的分发器。我们的服务器可能会执行一些额外的工作，例如身份验证和校验以防止滥用，但本质上，我们可以充当消息传递者。\n\
    \n一个理想的 Redux WebSocket 实现应该允许我们 `dispatch()` action 并在需要时将其智能地路由到服务器，并将任何来自 WebSocket\
    \ 的 action 分发到 store。\n\n## 代码实现\n\n对于任何与基础设施相关的代码，中间件（middleware）是实现 WebSocket\
    \ 的完美位置。它将允许我们捕获任何通过 WebSocket 发送的 action，并 `dispatch()` 任何来自服务器的内容。\n\nWebSocket\
    \ 设置的基本结构\n\n```\nconst WS_ROOT = \"ws://echo.websocket.org/\";\nconst websocket\
    \ = new WebSocket(WS_ROOT);\nwebsocket.onopen = () => {};\nwebsocket.onclose =\
    \ () => {};\nwebsocket.onerror = event => {};\nwebsocket.onmessage = event =>\
    \ {};\n```\n\n为了使代码更具读性，我们可以使用单个 `Object.assign()` 来替换这四个不同的赋值，并使用类似的代码：\n\n###\
