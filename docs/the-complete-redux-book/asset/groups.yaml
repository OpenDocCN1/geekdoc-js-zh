    # Chapter 9. Reducers


    There are a number of ways to detect a change made to a tree, each with its pros
    and cons. Among the many solutions, one is to mark where changes were made in
    the tree. We can use simple methods like setting a dirty flag, use more complicated
    approaches like adding a version to each node, or (the preferred Redux way) use
    reference comparison.


    > If you are unsure of how references work, jump ahead to the next two chapters
    and come back to this one after.


    Redux and its accompanying libraries rely on reference comparison. After the root
    reducer has run, we should be able to compare the state at each level of the state
    tree with the same level on the previous tree to determine if it has changed.
    But instead of comparing each key and value, we can compare only the reference
    or the pointer to the structure.


    In Redux, each changed node or leaf is replaced by a new copy of itself that has
    the changed data. Since the node''s parent still points to the old copy of the
    node, we need to create a copy of it as well, with the new copy pointing to the
    new child. This process continues with each parent being recreated until we reach
    the root of the tree. This means that a change to a leaf must cause its parent,
    the parent''s parent, etc. to be modified—i.e., it causes new objects to be created.
    The following illustration shows the state before and after it is run through
    a reducer tree and highlights the changed nodes.'
- md: "\n![](img/fbb45cbd9118f0a7f1feb2a04f50e708_156_0.png)\n\nThe main reason reference\
    \ comparison is used is that this method ensures that each reference to the previous\
    \ state is kept coherent. We can examine it at any time and get the state exactly\
    \ as it was before a change. We create an array and push the current state into\
    \ before running actions, we will be able to pick any of the pointers to the previous\
    \ state in the array and see the state tree exactly as it was before all the subsequent\
    \ actions happened. And no matter how many more actions we process, our original\
    \ pointers stay exactly as they were.\n\nThis might sound similar to copying the\
    \ state each time before changing it, but the reference system will not require\
    \ 10 times the memory for 10 states. It will smartly reuse all the unchanged nodes.\
    \ Consider the next illustration, where two different actions have been run on\
    \ the state, and how the three trees look afterward.\n\n## Chapter 9. Reducers\n\
    \n152\n\n![](img/fbb45cbd9118f0a7f1feb2a04f50e708_157_0.png)\n\n### Example of\
    \ saving references\n\nThe first action added a new node, C3, under B1. If we\
    \ look closely we can see that the reducer didn't change anything in the original\
    \ A tree. It only created a new A' object that holds B2 and a new B' that holds\
    \ the original C1 and C2 and the new C3'. At this point we can still use the A\
    \ tree and access to all the nodes like were before before. What's more, the new\
    \ A' tree didn't copy the old one, but created some new links that allow efficient\
    \ memory reuse.\n\nThe next action modified the B2 subtree. The only change is\
    \ a new A' root object that points to the previous B1' and the new B2'. The old\
    \ states of A and A' are still intact and memory is reused over all three trees.\n\
    \nSince we have a coherent version of each previous state, we can implement nifty\
    \ features like undo and redo (we simply save the previous state in an array,\
    \ and in the case of \"undo,\" make it the current one). We can also implement\
    \ more advanced features like \"time travel,\" where we can easily jump between\
    \ versions of our state for debugging.\n\n## What Is Immutability?\n\nThe ideas\
    \ we discussed are the root of the concept of immutability. If you are familiar\
    \ with immutability in JavaScript, feel free to skip the remainder of this discussion\
    \ and proceed to the \"Ensuring Immutability\" section.\n\nLet's define what the\
    \ word mutation means. In JavaScript, there are two types of variables: ones that\
    \ are copied by value, and ones that are passed by reference. Primitive values\
    \ such as numbers, strings, and booleans are copied when you assign them to other\
    \ variables, and a change to the target variable will not affect the source:\n\
    \n## Chapter 9. Reducers\n\n### Primitive values example\n\n```javascript\nlet\
    \ string = \"Hello\";\nlet copiedString = string;\ncopiedString += \" World!\"\
    ;\nconsole.log(string); // => \"Hello\"\nconsole.log(copiedString); // => \"Hello\
    \ World!\"\n```\n\nIn contrast, collections in JavaScript are not copied when\
    \ you assign them; they only receive a pointer to the location in memory of the\
    \ object pointed to by the source variable. This means that any change to the\
    \ new variable will modify the same memory location, which is pointed to by both\
    \ the old and new variables:\n\n### Collections example\n\n```javascript\nconst\
    \ object = {};\nconst referencedObject = object;\nreferencedObject.number = 42;\n\
    console.log(object); // => { number: 42 }\nconsole.log(referencedObject); // =>\
    \ { number: 42 }\n```\n\nAs you see, the original object is changed when we change\
    \ the copy. We used const here to emphasize that a constant in JavaScript holds\
    \ only a pointer to the object, not its value, and no error will be thrown if\
    \ you change the properties of the object (or the contents of an array). This\
    \ is also true for collections passed as arguments to functions, as what is passed\
    \ is the reference and not the value itself.\n\nLucky for us, ES2016 lets us avoid\
    \ mutations collections in a much cleaner way than before, thanks to the Object.assign()\
    \ method and the spread operator.\n\n> The spread operator is fully supported\
    \ by the ES2016 standard. More information is available on MDN³.\n\n## Chapter\
    \ 9. Reducers\n\n154\n\n### Objects\n\nObject.assign() can be used to copy all\
    \ the key/value pairs of one or more source objects into one target object. The\
    \ method receives the following parameters:\n\n1. The target object to copy\n\
    2. One or more source objects to copy from\n\n> Complete Object.assign() documentation\
    \ is available on MDN.\n\nSince our reducers need to create a new object and make\
    \ some changes to it, we will pass a new empty object to the first parameter to\
    \ Object.assign(). The second parameter will be the original subtree to copy and\
    \ the third will contain any changes we want to make to the object. This will\
    \ result in us having a fresh object with a new reference, having all the key/value\
    \ pairs from the original state and any overrides needed by the current action:\n\
    \nExample of Object.assign()\n\n```javascript\nfunction reduce(state, action)\
    \ {\n  const overrides = { price: 0 };\n  return Object.assign({}, state, overrides);\n\
    }\nconst state = { ... };\nconst newState = reducer(state, action);\nstate ===\
    \ newState; // false!\n```\n\nDeleting properties can be done in a simple way\
    \ using ES2016 syntax. To delete the key name from our state we can use the following:\n\
    \nExample of deleting a key from an object\n\n```javascript\nreturn Object.assign({},\
    \ state, { name: undefined });\n```\n\n### Arrays\n\nArrays are a bit trickier,\
    \ since they have multiple methods for adding and removing values. In general,\
    \ you have to remember which methods create a new copy of the array and which\
    \ change the original one. For your convenience, here is a table outlining the\
    \ basic array methods.\n\n> https://developer.mozilla.org/en/docs/Web/JavaScript/Global_Objects/Object/assign\n\
    \n## Mutating arrays\n\n| Safe methods | Mutating methods |\n| :--- | :--- |\n\
    | - concat() | - push() |\n| - slice() | - pop() |\n| - map() | - shift() |\n\
    | - reduce() | - un() |\n| - reduceRight() | - fill() |\n| - filter() | - reverse()\
    \ |\n| | - sort() |\n\nThe basic array operations we will be doing in most reducers\
    \ are appending, deleting, and modifying an array. To keep to the immutability\
    \ principles, we can achieve these using the following methods:\n\nAdding items\
    \ to an array with ES2016\n\n```javascript\nfunction reducer(state, action) {\n\
    \  return state.concat(newValue);\n}\n```\n\nRemoving items from an array with\
    \ ES2016\n\n```javascript\nfunction reducer(state, action) {\n  return state.filter(item\
    \ => item !== action.payload);\n}\n```\n\nChanging items in an array with ES2016\n\
    \n```javascript\nfunction reducer(state, action) {\n  return state.map(item =>\n\
    \    item === action.id\n      ? item\n      : Object.assign({}, item, action.payload)\n\
    \  );\n}\n```\n\n## Ensuring Immutability\n\nThe bitter truth is that in teams\
    \ more than one developer, we can't always rely on everyone avoiding state all\
    \ the time. As humans, we make mistakes, and even with the strictest pull request,\
    \ code review, and testing practices, sometimes they crawl into the code base.\
    \ Fortunately,\n\nOne approach is to use libraries like deep-freeze that will\
    \ throw errors everyone tries to mutate a \"frozen\" object. While JavaScript\
    \ provides an Object.freeze() method, it freezes the object it is applied to,\
    \ not its children. deep-freeze and similar libraries perform nested freezes and\
    \ method overrides to better catch errors.\n\nAnother approach is to use libraries\
    \ that manage immutable objects. While they add additional dependencies to the\
