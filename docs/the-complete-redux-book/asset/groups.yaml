    \ `meta` 字段来决定是否通过 WebSocket 发送。\n\n### 完整的中间件代码\n\nmiddleware/ws.js\n\n```javascript\n\
    import { wsConnected, wsDisconnected } from 'actions';\nimport { WS_ROOT } from\
    \ 'const/global';\n\nconst SOCKET_STATES = {\n  CONNECTING: 0,\n  OPEN: 1,\n \
    \ CLOSING: 2,\n  CLOSED: 3\n};\n\nconst wsMiddleware = ({ dispatch }) => next\
    \ => {\n  const websocket = new WebSocket(WS_ROOT);\n  Object.assign(websocket,\
    \ {\n    onopen() {\n      active = true;\n      dispatch(wsConnected());\n  \
    \  },\n    onclose() {\n      active = false;\n      dispatch(wsDisconnected());\n\
    \    },\n    onerror(error) {\n      console.log(`WS Error: ${error.data}`);\n\
    \    },\n    onmessage(event) {\n      dispatch(JSON.parse(event.data));\n   \
    \ }\n  });\n\n  return action => {\n    if (websocket.readyState === SOCKET_STATES.OPEN\
