    \ 入点。\n- app/assets/stylesheets/main.css – 示例项目的基础 CSS。\n\n### .gitignore\n\n\
    这是 Git¹ 版本控制系统的特殊配置，该文件指示 Git 哪些文件和目录不由它管理（例如 node_modules）。\n\n### package.json\n\
