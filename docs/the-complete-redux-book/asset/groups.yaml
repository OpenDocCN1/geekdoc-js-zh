    \ actions、创建 actions 等等。由于中间件可以访问 actions、`dispatch()` 函数和 store，它们是 Redux 中多灵活且强大的实体。\n\
    \n### Store\n\n与其他实现不同，Redux 有一个单一 store，持有应用程序信息但不包含用户逻辑。store 的作用是接收 actions，将其通过所有中间件，然后使用\
