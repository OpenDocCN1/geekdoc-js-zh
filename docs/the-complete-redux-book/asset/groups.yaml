    ```\n\nUsing this structure, our middleware will be rebuilt before each test and\
    \ all the mocked functions will be reset, keeping the test code itself as short\
    \ as possible.\n\n# Testing Async Middleware\n\nFor a more complete example, let's\
    \ use an API middleware similar to the one discussed in the Server Communication\
    \ Chapter:\n\nAPI middleware\n\n```\nimport 'whatwg-fetch';\n{ API } from 'consts';\n\
    import { apiStarted, apiFinished, apiError } from 'actions/ui';\nconst apiMiddleware\
    \ = (( dispatch }) => next => action => {\n  if (action.type === API) {\n    return\
    \ next(action);\n  }\n  const { url, success } = action.payload;\n  dispatch(apiStarted());\n\
    \  return fetch(url)\n    .then(response => response.json())\n    .then(response\
    \ => {\n      dispatch(apiFinished());\n      dispatch(success(response));\n \
    \   })\n    .catch(({ status, searchText }) =>\n      dispatch(apiError(new Error({\
    \ status, searchText })));\n});\nexport default apiMiddleware;\n```\n\nOur middleware\
    \ catches any actions of the type 'API', which must contain a payload key with\
    \ a url to make a request to next() and and a success parameter that holds an\
    \ action creator to call with the returned data."
  - "[PAGE 107]\n\n# Sample API action\n\n```\nconst setData = data => ({\n  type:\
    \ 'SET_DATA',\n  payload: data\n});\n\nconst apiAction = () => ({\n  type: API,\n\
    \  payload: {\n    success: setData,\n    url: 'fake.json'\n  }\n});\n```\n\n\
    In our Redux call, calling dispatch(apiAction()) will result in our API middleware\
    \ doing a GET request for server/fake.json and (if successful) dispatching the\
    \ SET_DATA action with payload to the response. When there is an error, an action\
    \ created by apiError() will be dispatched containing status and statusText.\n\
    \nAnother important feature of the API middleware is that it will dispatch apiStarted()\
    \ before contacting the server and apiFinished() on success (or apiError() on\
    \ failure). This allows the application to keep track of the number of active\
    \ requests to the server and display a spinner or some other user indication.\n\
    \nTo fully test this middleware we can split the tests into three groups: general\
    \ tests, success tests, and failure tests.\n\n# Setup\n\nTo make our tests cleaner\
    \ we will be using the structure discussed previously and mocking the fetch()\
    \ API as discussed in the “Async Action Creators” section of this chapter.\n\n\
    We will also use the sample API action creators from earlier to drive the tests\
    \ and a fake data response from the server:"
- md: "\n# Chapter 6. Tests\n\nBase of the API middleware tests\n\n```javascript\n\
    import apiMiddleware from 'middleware/api';\nimport { mockFetch, mockError } from\
    \ 'test-utils';\nimport { API_STARTED, API_FINISHED, API_ERROR } from 'consts';\n\
    \nconst data = { title: 'hello' };\n\nconst setData = data => ({\n  type: 'SET_DATA',\n\
    \  payload: data\n});\n\nconst apiAction = () => ({\n  type: 'API_ACTION',\n \
    \ payload: {\n    success: setData,\n    url: 'fake.json'\n  }\n});\n\ndescribe('api\
    \ middleware', () => {\n  let next, dispatch, middleware;\n\n  beforeEach(() =>\
    \ {\n    next = jest.fn();\n    dispatch = jest.fn();\n    middleware = apiMiddleware({\
    \ dispatch })((next);\n  });\n\n  describe('general', () => {\n    // TODO\n \
    \ });\n\n  describe('success', () => {\n    // TODO\n  });\n\n  describe('error',\
    \ () => {\n    // TODO\n  });\n});\n```\n\n# General tests\n\nThe first test for\
    \ any middleware is to ensure that it passes unknown actions down the chain. We\
    \ forget to use next(action), no actions will reach the reducers:\n\nVerify unknown\
    \ actions are handled correctly\n\n```javascript\nit('should ignore non-API actions',\
    \ () => {\n  const sampleAction = { type: 'SAMPLE_ACTION' };\n\n  middleware(sampleAction);\n\
    \  expect(dispatch.mock.calls.length).toBe(0);\n  expect(next.mock.calls).toEqual([sampleAction]);\n\
    });\n```\n\nHere we verify that dispatch() is never called and next() is called\
    \ exactly once with our sampleAction. Since we will be using dispatch.mock.calls\
    \ and next.mock.calls very often in our tests, we can shorten it a little by adding\
    \ the following to our setup code:\n\nImprove the setup code\n\n```javascript\n\
    let next, dispatch, middleware, dispatchCalls, nextCalls;\nbeforeEach(() => {\n\
    \  next = jest.fn();\n  dispatch = jest.fn();\n  dispatchCalls = dispatch.mock.calls;\n\
    \  nextCalls = next.mock.calls;\n  middleware = apiMiddleware({ dispatch })((next);\n\
    });\n```\n\nInstead of expect(next.mock.calls) we can use expect(nextCalls).\n\
    \nAnother general test could be to verify that the API_STARTED action is dispatched\
    \ every time the middleware is about to access the server:\n\n# Chapter 6. Tests\n\
    \nTest that API_STARTED is dispatched\n\n```javascript\nit('should dispatch API_STARTED',\
    \ () => {\n  middleware(apiAction());\n  expect(dispatchCalls[0]).toEqual([{ type:\
    \ API_STARTED }]);\n});\n```\n\nOur expect(call) only checks that the first dispatch()\
    \ action is API_STARTED because the middleware might catch additional actions\
    \ later on.\n\n# Successful server access\n\nIn the success scenario, we need\
    \ to mock a fetch() API to return a successful response. We will be using the\
    \ mockFetch() utility created in the \"Async Action Creators\" section of this\
    \ chapter.\nOur basic tests need to check that API_FINISHED is dispatched once\
    \ and that our success() action creator is called, passed the response, and dispatched\
    \ to the store:\n\nSuccess tests framework\n\n```javascript\ndescribe('success',\
    \ () => {\n  beforeEach(() => mockFetch('recipes.json', 200, JSON.stringify(data)));\n\
    \  it('should dispatch API_FINISHED');\n  it('should dispatch SET_DATA');\n});\n\
    ```\n\nA attempt at testing the first case might look similar to the API_STARTED\
    \ test:\n\nTest that API_FINISHED is dispatched\n\n```javascript\nit('should dispatch\
    \ API_FINISHED', () => {\n  middleware(apiAction());\n  expect(dispatchCalls[2]).toEqual([{\
    \ type: API_FINISHED }]);\n});\n```\n\nUnfortunately, this code will not work.\
    \ Since API_FINISHED is only dispatched after the fetch() promise is resolved,\
    \ we need to wait for that before calling expect().\nAs discussed in the \"Async\
    \ Action Creators\" section of this chapter, we rely on our call to the middleware\
    \ to return a promise that resolves before the fetch() call completes. Only then\
    \ can we run assertions and verify that everything behaved according to our expectations:\n\
    \n# Chapter 6. Tests\n\nThe correct API_FINISHED test\n\n```javascript\nit('should\
    \ dispatch API_FINISHED', () => {\n  return middleware(apiAction())\n    .then(()\
    \ => {\n      expect(dispatchCalls[2]).toEqual({ type: API_FINISHED });\n    });\n\
    });\n```\n\nIn this version of the test, only once the promise returned by the\
    \ call to middleware() is resolved we check the array of calls to dispatch().\
    \ Since our new test is a one-liner, we can use ES2016 magic and Jest's toSnapshot()\
    \ to shorten the code:\n\n# Short API_FINISHED test\n\n```javascript\nit('should\
    \ dispatch API_FINISHED', () =>\n  middleware(apiAction()).then(() =>\n    expect(dispatchCalls[2]).toSnapshot());\n\
    ```\n\nTesting the API middleware correctly sends the response from the server\
    \ via the action creator provided in action.payload. success here is similar:\n\
    \nTest that SET_DATA was dispatched\n\n```javascript\nit('should dispatch SET_DATA',\
    \ () =>\n  middleware(apiAction()).then(() =>\n    expect(dispatchCalls[1]).toEqual({data:\
    \ setData(data))));\n```\n\nAfter the fetch() method is done, we check that the\
    \ third call to dispatch() sent the same object as a direct call to setData(data)\
    \ action creator.\n\n> Remember that we mocked the server response for fetch()\
    \ with mockFetch(), passing the stringified version of data.\n\n# Failed server\
    \ access\n\nThe failing case is similar to the success one, except that we mock\
    \ fetch() to fail. There are two tests in this scenario, verifying that API_FINISHED\
    \ was not dispatched and API_ERROR was dispatched instead:\n\n# Chapter 6. Tests\n\
    \nThe failure case scenario tests\n\n```javascript\ndescribe('error', () => {\n\
    \  beforeEach(() => mockFetchError('recipes.json', 404, 'Not found'));\n\n  it('should\
    \ NOT dispatch API_FINISHED', () =>\n    middleware(apiAction()).then(() =>\n\
    \      expect(dispatchCalls[0].type).not.toBe(API_FINISHED));\n  });\n\n  it('should\
    \ dispatch error', () =>\n    middleware(apiAction()).then(() =>\n      expect(dispatchCalls[0]).toMatchSnapshot()));\n\
    });\n```\n\n# Middleware Summary\n\nAs our application grows, more complex and\
    \ asynchronous code will be moved to middleware. The basic structure discussed\
    \ here for the API middleware should be enough to cover most implementations.\n\
    \nWe have left getState() as an exercise for the reader.\n\n# Integration Tests\n\
    \nThe role of integration tests is to verify that all the parts of the application\
    \ work together. A comprehensive unit test suite will ensure all the reducers,\
    \ creators, middleware, and libraries are correct. With integration tests, we\
    \ will try to run them in a single test to check system-wide behavior.\n\nAs an\
    \ example of an integration test, we will verify that fetchRecipes() action creator\
    \ is dispatched, data is correctly fetched from the server and the state is updated.\
    \ In this flow we will check that the API middleware is correctly set up, all\
    \ the required action creators are correct, and the recipes reducer updates the\
    \ state as needed.\n\n# Chapter 6. Tests\n\n# Basic Setup\n\nSince the integration\
    \ tests will be using the real store, we can simple require and initialize it\
    \ as in our regular application:\n\nIntegration test skeleton\n\n```javascript\n\
    import store from 'store';\nndescribe('integration', () => {\n  it('should fetch\
    \ recipes from server', () => {\n    // TODO\n  });\n});\n```\n\n# Basic Integration\
    \ Test\n\nOur test will include four steps:\n\n1. Verify the initial state.\n\
    2. Mock the data returned from the server.\n3. Dispatch the action created by\
    \ fetchRecipes().\n4. Verify that our state's recipes key holds the data returned\
    \ from the server.\n\nThe full test looks like this:\n\nFull integration test\n\
    \n```javascript\nimport store from 'store';\nimport { fetchRecipes } from 'actions/recipes';\n\
    import { mockFetch } from 'test-utils';\nndescribe('integration', () => {\n  it('should\
    \ fetch recipes from server', () => {\n    const data = [{ title: 'test']];\n\n\
    \    expect(store.getState().recipes).toEqual([]);\n\n    mockFetch('recipes.json',\
    \ 200, JSON.stringify(data));\n\n    return store.dispatch(fetchRecipes())\n \
    \     .then(() => expect(store.getState().recipes).toEqual(data));\n  });\n});\n\
    ```\n"
