    \  return store.dispatch(actions.fetchRecipe(100))\n    .then(() => expect(store.getActions()).toEqual([]));\n\
    });\n```\n\nThe expect() clause is similar to what we used in our previous tests.\
    \ We are using the mocked store's getActions() method to get an array of all the\
    \ actions dispatched to the store. In our implementation we expect a successful\
    \ call to fetch() to dispatch the result of the setRecipe() action creator.\n\n\
    Running this test now will fail, since we didn't mock the fetch() API. Using the\
    \ small utility library we created previously, we can create the mock that will\
    \ result in the correct action sequence:"
- md: "\n## Chapter 6. Tests\n\nFull async test\n\n```javascript\nit('should fetch\
    \ recipe if it exists', () => {\n  mockFetch('recipe/100', 200, {'title':'hello'});\n\
    \n  return store.dispatch(actions.fetchRecipe(100))\n    .then(() => expect(store.getAction()).toMatchSnapshot());\n\
    });\n```\n\nHere we mock a 200 successful response from the fetch() API and expect\
    \ that dispatch the async action created by fetchRecipe(100) results in a later\
    \ dispatch of the action created by setRecipe().\n\n## Async Tests Summary\n\n\
    As can be seen from this minimal example, testing async action creators is much\
    \ more complicated than testing regular creators. If we add proper error handling\
    \ and branching, the tests quickly become hard to reason about and out.\n\nThe\
    \ Middleware Chapter offers an alternative to async action creators by moving\
    \ the asynchronous logic into middleware. This allows us to test and concentrate\
    \ all the async code of an application in a single place.\n\n## Reducer Tests\n\
    \nTesting reducers is very similar to testing action creators, as reducers by\
    \ definition are idempotent (given a state and an action, the same new state will\
    \ be returned every time).\n\nThis makes reducer tests very easy to write, as\
    \ we simply need to call the reducer with different combinations of input to verify\
    \ the correctness of the output.\n\n## Basic Reducer Test\n\nFor our test, we\
    \ can create a very crude reducer that handles a single ADD_RECIPE action and\
    \ whose state is simply an array of recipes:\n\n## Chapter 6. Tests\n\n## Simple\
    \ recipes reducer\n\n```javascript\nimport { ADD_RECIPE } from 'consts.js';\n\
    const reducer = (state = initialState, action) => {\n  switch(action.type) {\n\
    \    case ADD_RECIPE:\n      return state.concat({ title: action.payload });\n\
    \  }\n  return state;\n};\nexport default reducer;\n```\n\nThere are two main\
    \ test cases to consider, adding a recipe to an empty list and a non-empty one.\
    \ We can test the first case as follows:\n\n## Simple recipes reducer test\n\n\
    ```javascript\nimport reducer from 'reducers/recipes';\nimport { ADD_RECIPE }\
    \ from 'consts';\ndescribe(\"recipes reducer\", () => {\n  it('should add recipe\
    \ to empty list', () => {\n    const initialState = [];\n    const action = {\
    \ type: ADD_RECIPE, payload: 'test' };\n    const expected = [{ title: \"test\"\
    \ }];\n    const actual = reducer(initialState, action);\n    expect(actual).toEqual(expected);\n\
    \  });\n});\n```\n\n## Chapter 6. Tests\n\nThe steps taken here should already\
    \ be familiar:\n\n+ 1. Calculate the initial state (an empty array in case).\n\
    2. Build the action to send.\n3. Set the expected state the reducer should return.\n\
    4. Call reducer() to calculate the state based on the empty array and our action.\n\
    5. Verify that the actual and expected states match.\n6. Calculating the initial\
    \ state\n\nWhen we simplify the code, let's consider the second test case, adding\
    \ a recipe to a non-empty list:\n\n## Test of adding a recipe to a non-empty list\n\
    \n```javascript\nit('add recipe to non-empty list', () => {\n  const initialState\
    \ = [{ title: \"first\" }];\n  const action = { type: ADD_RECIPE, payload: 'test'\
    \ };\n  const expected = [{ title: \"first\" }, { title: \"test\" }];\n  const\
    \ actual = reducer(initialState, action);\n\n  expect(actual).toEqual(expected);\n\
    });\n```\n\nIn this test we start with a list containing a single item and update\
    \ our expected result to match. While this works, it has a maintenance problem.\
    \ What will happen if our recipes contain more fields in the future?\n\nUsing\
    \ this method of writing tests, we will need to find each test definition's initial\
    \ state and more properties to it. Luckily, we already have a way to create non-empty\
    \ states: the reducer! Since we already tested adding to an empty list in the\
    \ first test, we can rely on our reducer to create a non-empty list with all the\
    \ required recipe information:\n\n## Build initial state using the reducer\n\n\
    ```javascript\nconst initialState = reducer([], { type: ADD_RECIPE, payload: 'first'\
    \ });\n```\n\nThis only partially solves the problem, though, we are still treating\
    \ the initial state as an empty array ([]). While this is true in our test case,\
    \ other reducers might have more complicated structures to deal with. A simple\
    \ solution would be to create a `const initialState = {}` at the root of the tests\
    \ and rely on it when needed:\n\n## Chapter 6. Tests\n\n## Set initial state for\
    \ all tests\n\n```javascript\ndescribe(`recipes reducer`, () => {\n  const initialState\
    \ = [];\n\n  it(`should add recipe to empty list`, () => {\n    const action =\
    \ { type: ADD_RECIPE, payload: 'test' };\n    const expected = [{ title: \"test\"\
    \ }];\n    const actual = reducer(initialState, action);\n\n    expect(actual).toEqual(expected);\n\
    \  });\n\n  it(`should add recipe to non-empty list`, () => {\n    const testState\
    \ = reducer(initialState, { type: ADD_RECIPE, payload: 'first' });\n    const\
    \ action = { type: ADD_RECIPE, payload: 'test' };\n    const expected = [{ title:\
    \ \"first\" }, { title: \"test\" }];\n    const actual = reducer(testState, action);\n\
    \n    expect(actual).toEqual(expected);\n  });\n});\n```\n\nThe same initialState\
    \ is used in all the tests, but it is still hardcoded in our test file. If our\
    \ reducer changes the state built, we will be forced to update the test files\
    \ accordingly. To remove this dependency we can rely on a feature that is forced\
    \ by Redux's combineReducers(). It mandates that any reducer called with an undefined\
    \ state must return its part of the initial state structure:\n\nExcerpt from our\
    \ reducer\n\n```javascript\nconst initialState = [];\nconst reducer = (state =\
    \ initialState, action) => {\n  ...\n};\n```\n\nThis means we can use the reducer\
    \ to get the initial state to use for all of our tests, simply by calling it with\
    \ undefined and any action:\n\n## Chapter 6. Tests\n\n## Generate the initial\
    \ state using our reducer\n\n```javascript\nconst initialState = reducer(undefined,\
    \ { type: 'INIT' });\n```\n\nThe result will put the same [ ] in the initial state,\
    \ but now changes to what the reducer considers to be the initial state will be\
    \ automatically picked up by the tests as well.\n\n## Making the Tests Pretty\n\
    \nNow that we've solved the functionality issues, we can use the same tricks we\
    \ used in the action creator tests to simplify our reducer tests. Here are the\
    \ original tests:\n\n## Original tests\n\n```javascript\nit('should add recipe\
    \ to empty list', () => {\n  const initialState = [];\n  const action = { type:\
    \ ADD_RECIPE, payload: 'test' };\n  const expected = [{ title: \"test\" }];\n\
    \  const actual = reducer(initialState, action);\n  expect(actual).toEqual(expected);\n\
    });\n\nit('should add recipe to non-empty list', () => {\n  const initialState\
    \ = [{ title: \"first\" }];\n  const action = { type: ADD_RECIPE, payload: 'test'\
    \ };\n  const expected = [{ title: \"first\" }, { title: \"test\" }];\n  const\
    \ actual = reducer(initialState, action);\n\n  expect(actual).toEqual(expected);\n\
    });\n```\n\nThe first step will be to combine action, actual, and expect() into\
    \ a single line:\n\n## Chapter 6. Tests\n\n## Simplified tests\n\n```javascript\n\
    it('should add recipe to empty list', () => {\n  const expected = [{ title: \"\
    test\" }];\n\n  expect(reducer(initialState, { type: ADD_RECIPE, payload: 'test'})).toEqual(expected);\n\
    });\n\nit('should add recipe to non-empty list', () => {\n  const baseState =\
    \ reducer(initialState, { type: ADD_RECIPE, payload: 'first' });\n  const expected\
    \ = [{ title: \"first\" }, { title: \"test\" }];\n\n  expect(reducer(baseState,\
    \ { type: ADD_RECIPE, payload: 'test'})).toEqual(expected);\n});\n```\n\nThe second\
    \ step is to use Jest's snapshots instead of manually expected values:\n\n## Simplified\
    \ tests, stage 2\n\n```javascript\nit('should add recipe to empty list', () =>\
    \ {\n  expect(reducer(initialState, { type: ADD_RECIPE, payload: 'test'})).toMatchSnapshot();\n\
    });\n\nit('should add recipe to non-empty list', () => {\n  const baseState =\
    \ reducer(initialState, { type: ADD_RECIPE, payload: 'first' });\n\n  expect(reducer(baseState,\
    \ { type: ADD_RECIPE, payload: 'test'})).toMatchSnapshot();\n});\n```\n\n## Avoiding\
    \ Mutations\n\nOne requirement is that our reducers never modify the state, but\
    \ create a new one. Our current tests do not catch issues (try changing .concat()\
    \ to .push() in the reducer implementation).\n\n## Chapter 6. Tests\n\nWhile we\
    \ can try to catch these mistakes by manually verifying that the initial state\
    \ did not change, a simpler approach would be to \"freeze\" the initial state\
    \ and have changes to it automatically stop the tests. To achieve this we can\
    \ use the excellent deep-freeze² library, installed as follows:\n\nInstalling\
    \ deep-freeze\n\n```bash\nnpm install deep-freeze --save\n```\n\nTo use deep-freeze,\
    \ we wrap our initial state with a call to deepFreeze(),\n\nUsing deep-freeze\n\
    \n```javascript\nimport deepFreeze from 'deep-freeze';\nconst initialState = deepFreeze(reducer(undefined,\
    \ { type: 'INIT' }));\n```\n\nAny attempt by any parts of our code to modify initialState\
    \ will now throw an error:\n\nAutomatically catch changes attempts\n\n```javascript\n\
    initialState.push('test');\nTypeError: Can't add property 0, object is not extensible\n\
    ```\n\nTo ensure that our reducers never change the original state, we can always\
    \ call deepFreeze() on the state passed as the first parameter to a reducer:\n\
    \nUpdated to non-empty list test\n\n```javascript\nit('should add recipe to empty\
    \ list', () => {\n  const baseState = reducer(initialState, { type: ADD_RECIPE,\
    \ payload: 'first' });\n  expect(reducer(\n    deepFreeze(baseState),\n    { type:\
    \ ADD_RECIPE, payload: 'test' }\n  )).toMatchSnapshot();\n});\n```\n\n²https://github.com/substack/deep-freeze\n"
  mdcn: "\n\n## 第 6 章.测试\n\n全异步测试\n\n```javascript\nit('should fetch recipe if it\
    \ exists', () => {\n  mockFetch('recipe/100', 200, {'title':'hello'});\n\n  return\
    \ store.dispatch(actions.fetchRecipe(100))\n    .then(() => expect(store.getAction()).toMatchSnapshot());\n\
    });\n```\n\n在这里，我们模拟了 `fetch()` API 返回的 200 成功响应，并期望 dispatch 由 `fetchRecipe(100)`\
    \ 创建的异步 action 随后会 dispatch 一个由 `setRecipe()` 创建的 action。\n\n## 异步测试总结\n\n从这个简单的示例中可以看出，测试异步\
    \ action 创建器比测试普通的 action 创建器要复杂得多。如果我们添加了适当的错误处理和分支逻辑，测试将迅速变得难以理解和编写。\n\n“中间件”章节提供了一种异步\
    \ action creator 的替代方案，将异步逻辑移动到中间件中。这允许我们在一个地方测试并集中处理应用程序所有的异步代码。\n\n## Reducer\
    \ 测试\n\n测试 reducer 与测试 action creator 非常相似，因为根据定义，reducer 是幂等的（给定一个状态和一个 action，每次都会返回相同的新状态）。\n\
    \n这使得 reducer 测试非常容易编写，因为我们只需要用不同的输入组合调用 reducer 来验证输出的正确性。\n\n## 基础 Reducer 测试\n\
    \n对于我们的测试，我们可以创建一个非常粗略的 reducer，它处理单个 `ADD_RECIPE` action，其状态简单是一个 recipe 数组：\n\
    \n## 第 6 章.测试\n\n## 简单的 recipes reducer\n\n```javascript\nimport { ADD_RECIPE\
    \ } from 'consts.js';\nconst reducer = (state = initialState, action) => {\n \
    \ switch(action.type) {\n    case ADD_RECIPE:\n      return state.concat({ title:\
    \ action.payload });\n  }\n  return state;\n};\nexport default reducer;\n```\n\
    \n有两个主要的测试用例需要考虑：向空列表添加 recipe 以及向非空列表添加。我们可以按照如下方式测试第一个用例：\n\n## 简单的 recipes\
    \ reducer 测试\n\n```javascript\nimport reducer from 'reducers/recipes';\nimport\
    \ { ADD_RECIPE } from 'consts';\ndescribe(\"recipes reducer\", () => {\n  it('should\
    \ add recipe to empty list', () => {\n    const initialState = [];\n    const\
    \ action = { type: ADD_RECIPE, payload: 'test' };\n    const expected = [{ title:\
    \ \"test\" }];\n    const actual = reducer(initialState, action);\n    expect(actual).toEqual(expected);\n\
    \  });\n});\n```\n\n## 第 6 章.测试\n\n这里采取的步骤应该已经熟悉了：\n\n+ 1. 计算初始状态（情况下是一个空数组）。\n\
    2. 构建要发送的 action。\n3. 设置 reducer 应该的预期状态。\n4. 调用 `reducer()` 根据空数组和我们的 action\
    \ 计算状态。\n5. 验证实际状态和预期状态是否匹配。\n6. 计算初始状态\n\n当我们简化代码时，让我们考虑第二个测试用例：向非空列表添加 recipe：\n\
    \n## 向非空列表添加 recipe 的测试\n\n```javascript\nit('add recipe to non-empty list', ()\
    \ => {\n  const initialState = [{ title: \"first\" }];\n  const action = { type:\
    \ ADD_RECIPE, payload: 'test' };\n  const expected = [{ title: \"first\" }, {\
    \ title: \"test\" }];\n  const actual = reducer(initialState, action);\n\n  expect(actual).toEqual(expected);\n\
    });\n```\n\n在这个测试中，我们从一个包含单个项目的列表开始，并更新我们的预期结果以匹配它。虽然这种方法可行，但它存在维护问题。如果未来我们的 recipes\
    \ 包含更多字段会发生什么？\n\n使用这种编写测试的方法，我们需要找到每个测试定义的初始状态并向其添加更多属性。幸运的是，我们已经有了一种创建非空状态的方法：使用\
    \ reducer！由于我们已经在第一个测试中测试了向空列表添加内容，我们可以依赖 reducer 来创建一个包含所有所需 recipe 信息的非空列表：\n\
    \n## 使用 reducer 构建初始状态\n\n```javascript\nconst initialState = reducer([], { type:\
    \ ADD_RECIPE, payload: 'first' });\n```\n\n尽管如此，这只部分解决了问题，我们仍然将初始状态视为空数组（`[]`）。虽然在我们的测试用例中确实如此，但其他\
    \ reducer 可能有更复杂的结构需要处理。一个简单的解决方案是在测试的根部创建一个 `const initialState = {}` 并在需要依赖它：\n\
    \n## 第 6 章.测试\n\n## 为所有测试设置初始状态\n\n```javascript\ndescribe(`recipes reducer`,\
    \ () => {\n  const initialState = [];\n\n  it(`should add recipe to empty list`,\
    \ () => {\n    const action = { type: ADD_RECIPE, payload: 'test' };\n    const\
    \ expected = [{ title: \"test\" }];\n    const actual = reducer(initialState,\
    \ action);\n\n    expect(actual).toEqual(expected);\n  });\n\n  it(`should add\
    \ recipe to non-empty list`, () => {\n    const testState = reducer(initialState,\
    \ { type: ADD_RECIPE, payload: 'first' });\n    const action = { type: ADD_RECIPE,\
    \ payload: 'test' };\n    const expected = [{ title: \"first\" }, { title: \"\
    test\" }];\n    const actual = reducer(testState, action);\n\n    expect(actual).toEqual(expected);\n\
    \  });\n});\n```\n\n相同的 `initialState` 被用于所有测试，但它仍然硬编码在我们的测试文件中。如果我们的 reducer\
    \ 更改了构建的状态，我们将被迫相应地更新测试文件。为了消除这种依赖，我们可以依靠 Redux 的 `combineReducers()` 强制的一种特性。它强制任何带有\
    \ `undefined` 状态调用的 reducer 必须返回其对应的初始状态结构部分：\n\n我们 reducer 的节选\n\n```javascript\n\
    const initialState = [];\nconst reducer = (state = initialState, action) => {\n\
    \  ...\n};\n```\n\n这意味着我们可以通过简单传递 `undefined` 和任何 action 来调用 reducer，从而获取用于我们所有测试的初始状态：\n\
    \n## 第 6 章.测试\n\n## 使用我们的 reducer 生成初始状态\n\n```javascript\nconst initialState\
    \ = reducer(undefined, { type: 'INIT' });\n```\n\n结果将在 `initialState` 中放入相同的 `[\
    \ ]`，但现在对 reducer 认为的初始状态的更改也将被测试自动捕捉。\n\n## 让测试更美观\n\n现在我们已经解决了功能性问题，可以使用我们在\
    \ action creator 测试中使用的相同花技巧来简化我们的 reducer 测试。以下是原始测试：\n\n## 原始测试\n\n```javascript\n\
    it('should add recipe to empty list', () => {\n  const initialState = [];\n  const\
    \ action = { type: ADD_RECIPE, payload: 'test' };\n  const expected = [{ title:\
    \ \"test\" }];\n  const actual = reducer(initialState, action);\n  expect(actual).toEqual(expected);\n\
    });\n\nit('should add recipe to non-empty list', () => {\n  const initialState\
    \ = [{ title: \"first\" }];\n  const action = { type: ADD_RECIPE, payload: 'test'\
    \ };\n  const expected = [{ title: \"first\" }, { title: \"test\" }];\n  const\
    \ actual = reducer(initialState, action);\n\n  expect(actual).toEqual(expected);\n\
    });\n```\n\n第一步是将 `action`、`actual` 和 `expect()` 合并为一行：\n\n## 第 6 章.测试\n\n## 简化后的测试\n\
    \n```javascript\nit('should add recipe to empty list', () => {\n  const expected\
    \ = [{ title: \"test\" }];\n\n  expect(reducer(initialState, { type: ADD_RECIPE,\
    \ payload: 'test'})).toEqual(expected);\n});\n\nit('should add recipe to non-empty\
    \ list', () => {\n  const baseState = reducer(initialState, { type: ADD_RECIPE,\
    \ payload: 'first' });\n  const expected = [{ title: \"first\" }, { title: \"\
    test\" }];\n\n  expect(reducer(baseState, { type: ADD_RECIPE, payload: 'test'})).toEqual(expected);\n\
    });\n```\n\n第二步是使用 Jest 的快照代替手动预期值：\n\n## 简化后的测试（阶段 2）\n\n```javascript\nit('should\
    \ add recipe to empty list', () => {\n  expect(reducer(initialState, { type: ADD_RECIPE,\
    \ payload: 'test'})).toMatchSnapshot();\n});\n\nit('should add recipe to non-empty\
    \ list', () => {\n  const baseState = reducer(initialState, { type: ADD_RECIPE,\
    \ payload: 'first' });\n\n  expect(reducer(\n    baseState,\n    { type: ADD_RECIPE,\
    \ payload: 'test' }\n  )).toMatchSnapshot();\n});\n```\n\n## 避免变异\n\n一个要求是 reducer\
    \ 从不修改状态，而是创建一个新的。我们目前的测试无法捕捉此类问题（尝试在 reducer 中将 `.concat()` 改为 `.push()`）。\n\n\
    ## 第 6 章.测试\n\n虽然我们可以通过手动验证初始状态没有更改来捕捉这些错误，但更简单的方法是“冻结”初始状态并让更改自动停止测试。为了实现这一点，我们可以使用优秀的\
    \ `deep-freeze`² 库，安装方式如下：\n\n安装 deep-freeze\n\n```bash\nnpm install deep-freeze\
    \ --save\n```\n\n使用 `deep-freeze` 时，我们用 `deepFreeze()` 调用包裹我们的初始状态：\n\n使用 deep-freeze\n\
    \n```javascript\nimport deepFreeze from 'deep-freeze';\nconst initialState = deepFreeze(reducer(undefined,\
    \ { type: 'INIT' }));\n```\n\n代码中任何部分修改 `initialState` 的尝试现在都会抛出错误：\n\n自动捕捉更改尝试\n\
    \n```javascript\ninitialState.push('test');\nTypeError: Can't add property 0,\
    \ object is not extensible\n```\n\n为了确保我们的 reducer 从不更改原始状态，我们可以对作为 reducer 第一个参数的状态调用\
    \ `deepFreeze()`：\n\n更新后的非空列表测试\n\n```javascript\nit('should add recipe to empty\
    \ list', () => {\n  const baseState = reducer(initialState, { type: ADD_RECIPE,\
    \ payload: 'first' });\n  expect(reducer(\n    deepFreeze(baseState),\n    { type:\
    \ ADD_RECIPE, payload: 'test' }\n  )).toMatchSnapshot();\n});\n```\n\n²https://github.com/substack/deep-freeze\n\
