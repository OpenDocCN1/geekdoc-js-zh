    \ action 回调块之外进行初始化：\n\n在中间件中初始化的正确方式\n\n```javascript\nconst wsMiddleware = ({\
    \ dispatch, getState }) => next => {\n  // TODO: 初始化\n  return action => {\n \
    \   // TODO: 中间件\n  };\n};\n```\n\n让我们回到初始化代码，考虑如何处理四个回调中的每一个：open, onclose, onerror\
    \ 和 onmessage。\n\n### onopen\n\n这主要是一个信息性阶段；我们需要向自己指示 socket 已经准备好接收数据，并可能选择通知\
    \ Redux 程序的其他部分 socket 已就绪（可能用于在 UI 中显示某些指示）。\n\n一旦 socket 开启，我们就 `dispatch` 一个简单的\
