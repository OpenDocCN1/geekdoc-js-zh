    used in their children. Any changes or additions will require us to check multiple
    reducers for code changes, breaking the encapsulation of multireducer composition
    and greatly complicating our code.


    The second option is for reducers to pass all actions to their children:


    Action-passing reducer


    ```

    1 const booksReducer = (books, action) => {

    2 const newBooks = handleBookActions(books, action);

    3

    4 // Apply recipes reducers

    5 return newBooks.map(book => Object.assign({}, book, {

    6 recipes: recipesReducer(book.recipes, action)

    7 }));

    8 };

    9

    10 constReducer = (recipes, action) => {

    11 const newRecipes = handleRecipeActions(book, action);

    12

    13 // Apply ingredients reducers

    14 return newRecipes.map(recipe => Object.assign({}, recipe, {

    15 ingredients: ingredientsReducer(recipe.ingredients, action)

    16 }));

    17 };

    ```


    In this implementation, we separate the reducer logic each into two parts: one
    to allow any child reducers to run and the second to handle the actions for the
    reducer itself.


    While this implementation doesn''t require the parent to know about the actions
    supported by its children, we are forced to run a very large number of reducers
    for each recipe. A single call to an action unrelated to recipes, like UPDATE_PROFILE,
    will run recipesReducer() for each recipe, and have it in turn ingredientsReducer()
    for each of the ingredients.


