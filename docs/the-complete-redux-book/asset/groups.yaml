    \n>* https://github.com/indexiatech/redux-immutable\n\n有多种方法可以检测树的变化，每种方法都有优缺点。在许多解决方案中，一种方法是标记树中发生更改的地方。我们可以使用简单的方法，如设置脏标记（dirty\
    \ flag），使用更复杂的方法如为每个节点添加版本号，或者（Redux 推荐的方法）使用引用比较。\n\n> 如果你不确定引用是如何工作的，请跳到接下来的两章然后再回到这一章。\n\
    \nRedux 及其配套库依赖引用比较。在根 reducer 运行之后，我们应该能够将状态树每个层级的状态与上一棵树的相同级别进行比较，以判断它是否发生了变化。但不是比较每个键和值，我们可以只比较结构的引用或指针。\n\
    \n在 Redux 中，每个更改的节点或叶子节点都会被其包含更改数据的新副本所替换。由于节点的父节点仍然指向节点的旧副本，我们需要也为它创建一个副本，让新副本指向新节点。这个过程一直持续到每个父节点重新创建，到达树的根。这意味着对叶子的更改将导致其父节点、父结的父节点等被修改——即它导致了新对象的创建。下面的插展示了状态在通过\
