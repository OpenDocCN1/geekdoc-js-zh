  - "[PAGE 138]\n\n# Chapter 8. Actions and Action Creators\n\nstore/store.js\n\n\
    ```\nimport { createStore, applyMiddleware } from 'redux';\nimport thunk from\
    \ 'redux-thunk';\nimport rootReducer from 'reducers/index';\n\nconst store = createStore(\n\
    \  rootReducer,\n  applyMiddleware(thunk)\n);\n\nexport default store;\n```\n\n\
    This is generic code for adding middleware to your project. We will cover this\
    \ in more detail in the Middleware Chapter.\n\nWith redux-thunk installed, we\
    \ can start writing action creators that return functions instead of objects.\
    \ Going back to our previous example, let's create an action creator that simulates\
    \ server communication by using a delay:\n\n# Sample action\n\n```\nimport { trimmedTitle\
    \ } from 'utils/strings';\nimport { ADD_RECIPE_STARTED } from 'actions/recipes';\n\
    \nfunction addRecipe(title) {\n  return function (dispatch, getState) {\n    const\
    \ trimmedTitle = trimmedTitle(title);\n\n    dispatch({ type: ADD_RECIPE_STARTED\
    \ });\n\n    setTimeout(\n      () => dispatch({ type: ADD_RECIPE, title: trimmedTitle\
    \ }),\n      1000\n    );\n  }\n}\n```\n\nThe main difference from our previous\
    \ creators is that we are no longer returning an object but rather a function:"
  - "[PAGE 139]\n\n# Sample action\n\n```\nfunction addRecipe(title) {\n  return function(dispatch,\
    \ getState) {\n    // Action creator's code\n  }\n}\n```\n\nOr, if we used the\
    \ ES2016 arrow function style:\n\nSample action using ES2016 style\n\n```\nconst\
    \ addRecipe = (title) => (dispatch, getState) => {\n  // Action creator's code\n\
    }\n```\n\nFirst, we use a helper function to remove unneeded whitespace from our\
    \ titles:\n\nUsing helpers in action creators\n\n```\nconst trimmedTitle = trimTitle(title);\n\
    ```\n\nNext, we dispatch an action that might show a spinner in our application\
    \ by setting a fetching somewhere in our state:\n\nDispatch on load\n\n```\ndispatch({\
    \ type: ADD_RECIPE_STARTED });\n```\n\nThe last step is to add the ADD_RECIPE\
    \ action, delayed by one second:\n\nSet timeout to add recipe after a delay\n\n\
    ```\nsetTimeout(\n  () => dispatch({ type: ADD_RECIPE, title: trimmedTitle }),\n\
    \  1000\n);\n```\n\nIn this example one action ended up dispatching two different\
    \ actions. This gives us a tool, allowing us to generate as many granular actions\
    \ as needed and even to dispatch no actions at all in certain conditions.\n\n\
    # Server Communication\n\nThe redux-thunk method can be used to allow simple server\
    \ communications, simply by replacing the setTimeout() call from the previous\
    \ example with an Ajax call to the server:"
  - "[PAGE 140]\n\n# Chapter 8. Actions and Action Creators\n\nAn action that goes\
    \ to the server\n\n```\nimport * as consts from 'constants/action-types';\nfunction\
    \ checkStatus(response) {\n  if (response.status >= 200 && response.status < 300)\
    \ {\n    return response;\n  }\n\nthrow (new Error(response.statusText));\n}\n\
    const getRecipes = (limit = 100) => (dispatch) => {\n  dispatch({ type: consts.FETCH_RECIPES_START,\
    \ limit });\n};\n\nfetch(`recipes?limit=${limit}`)\n  .then(checkStatus)\n  .then(response\
    \ => response.json())\n  .then(data => dispatch({type: consts.FETCH_RECIPES_DONE,\
    \ data}))\n  .catch(error => dispatch({type: consts.FETCH_RECIPES_ERROR, error}));\n\
    };\n\nexport getRecipes;\n```\n\nThis code might might be good for a very simple\
    \ project, but it includes a lot of boilerplate that will be needed for every\
    \ API we call. In the Middleware Chapter we will discuss a more generic and cleaner\
    \ approach to server communication.\n\n# Using State\n\nAnother feature we gain\
    \ by using redux-thunk is access to the state when processing the action. This\
    \ allows us to dispatch or suppress actions according to the current application\
    \ state. For example, we can prevent actions from trying to add duplicate titles:"
  - "[PAGE 141]\n\n# Chapter 8. Actions and Action Creators\n\n# An action that accesses\
    \ state\n\n```\nconst addRecipe = (title) => (dispatch, getState) => {\n  const\
    \ trimmedTitle = trimTitle(title);\n\n  // We don't allow duplicate titles\n \
    \ if (getState().recipes.find(place => place.title == trimmedTitle)) {\n    return;\
    \ // No action is performed\n  }\n\n  dispatch({\n    type: ADD_RECIPE,\n    payload:\
    \ { title: trimmedTitle }\n  });n}\n```\n\nTwo new concepts can be seen in this\
    \ code. We use getState() to get access to the full application state and used\
    \ a return statement that made our action creator emit no action at all:\n\n#\
    \ An action that accesses state\n\n```\nif (getState().recipes.find(place => place.title\
    \ == trimmedTitle)) {\n  return; // No action is performed\n}\n```\n\nIt is important\
    \ to consider where such checks are performed. While multiple actions might dispatch\
    \ recipe-related manipulations, we might think it is best to do the check on the\
    \ reducer level (as it is the one modifying state). Unfortunately, there is no\
    \ way for the reducer to communicate the problem back to you, and while it can\
    \ prevent an action from adding duplicate titles to the list, cannot dispatch\
    \ a message out. The only thing a reducer can do in this case is add the error\
    \ directly to the state tree.\n\nWhile this approach might work, it adds complications\
    \ to the reducer and causes it to be aware of multiple parts of the state tree—in\
    \ example, not just recipes but also the notifications area—which will make it\
    \ harder to test and break down to multiple reducers. Thus, it is better to have\
    \ the validation logic in actions or middleware.\n\n# Testing\n\nTesting redux-thunk-based\
    \ actions is usually more complicated than testing regular actions, as it may\
    \ require the use of mocks and spies. As such, it is recommended to keep the actions\
    \ as simple as possible and break them into multiple functions and helpers to\
    \ ease testing and understanding.\n\nLet’s create a sample redux-thunk-based action:"
  - "[PAGE 142]\n\n# Chapter 8. Actions and Action Creators\n\n# Sample redux-thunk\
    \ action\n\n```\nexport const myFunction = () => (dispatch, getState) => {\n \
    \ const payload = getState();\n\n  dispatch({\n    type: 'MY_ACTION',\n    payload\n\
    \  });\n}\n```\n\nOur action will use the dispatch() method to send an action\
    \ of type 'MY_ACTION' and use the application's state, obtained via getState(),\
    \ as a payload.\n\nUnlike regular actions, we can't just compare the return value\
    \ and verify it's a valid object. Instead, we will need to rely on a new feature,\
    \ createSpy(). jasmine.createSpy() creates a special function that records every\
    \ call it made to our application. This allows our test to check if the function\
    \ was called, and how many times and with what parameters:\n\n# Sample test for\
    \ redux-thunk action\n\n```\ndescribe(actions, () => {\n  it('MY_ACTION', () =>\
    \ {\n    const getState = () => 'DATA';\n    const dispatch = jasmine.createSpy();\n\
    \    const expectedAction = { type: 'MY_ACTION', payload: getState() };\n\n  \
    \  myAction(dispatch, getState);\n\n    expect(dispatch).toHaveBeenCalledWith(expectedAction);\n\
    \  });\n});\n```\n\nIn this example we pass the action myFunction() two mocked\
    \ functions: a getState() function returns a const value and a mocked dispatch().\
    \ Thus, after calling the action creator, we can verify that the dispatch() function\
    \ was called correctly and a valid action was passed.\n\n# redux-actions\n\nWhen\
    \ you start a large number of actions, you will notice that most of the code looks\
    \ the same and feels like a lot of boilerplate. There are multiple third-party\
    \ libraries to make the process"
  - "[PAGE 143]\n\n# Chapter 8. Actions and Action Creators\n\neasier and cleaner.\
    \ The redux-actions³ library is one of the recommended ones, as it is both simple\
    \ and FSA-compliant. The library allows us to easily create new actions using\
    \ the newly provided createAction() function. For example:\n\nactions/recipe.js\n\
    \n```\nimport { createAction } from 'redux-actions';\nimport { ADD_RECIPE } from\
    \ 'constants/action-types';\nconst addRecipePayload = (title) => ({ title });\n\
    export const addRecipe = createAction(ADD_RECIPE, addRecipePayload);\n```\n\n\
    This code generates an action creator that will return an FSA-compliant action.\
    \ The generated action creator will have functionality to this function:\n\nGenerated\
    \ action creator\n\n```\nfunction addRecipe(title) {\n  return {\n    type: ADD_RECIPE,\n\
    \    payload: {\n      title\n    }\n  };\n};\n```\n\nIf the title is our only\
    \ payload, we could simplify the call by omitting the second argument:\n\nSimpler\
    \ action creator\n\n```\nexport const addRecipe = createAction(ADD_RECIPE);\n\
    ```\n\nThe resulting action creator would be as follows:\n\n> ³https://github.com/acdlite/redux-actions"
- md: "\n## Chapter 8. Actions and Action Creators\n\n### Simpler creator's result\n\
    \n```javascript\nfunction addRecipe(title) {\n  return {\n    type: ADD_RECIPE,\n\
    \    payload: {\n      title\n    }\n  };\n};\n```\n\nWe could also pass metadata\
    \ to the FSA action. For that, we could include a metadata object as a third argument:\n\
    \n### Passing metadata\n\n```javascript\nexport const addRecipe = createAction(\n\
    \  ADD_RECIPE,\n  (title) => ({ title }),\n  { silent: true }\n);\n```\n\nOr,\
    \ instead of a metadata object, we could use a function to calculate the metadata\
    \ based on the parameters we pass in the payload:\n\n### Dynamic metadata\n\n\
    ```javascript\nconst addRecipeMetadata = (title) => ({\n  silent: true,\n  notifyAdmin:\
    \ title === 'Omelette'\n});\n```\n\n```javascript\nexport const addRecipe = createAction(\n\
    \  ADD_RECIPE,\n  (title) => ({ title }),\n  addRecipeMetadata\n);\n```\n\nThe\
    \ usage of the action creator is the same as before. We simply call it with the\
    \ desired parameters:\n\n### Resulting object with dynamic metadata\n\n```javascript\n\
    dispatch(addRecipe('Belgian Waffles'));\n// The dispatched object:\n{\n  type:\
    \ 'ADD_RECIPE',\n  error: false,\n  payload: {\n    title: 'Belgian Waffles'\n\
    \  },\n  meta: {\n    silent: true,\n    notifyAdmin: false\n  }\n}\n```\n\n###\
    \ Errors\n\nThe action creator will automatically handle errors for us if passed\
    \ an Error object. It will generate an object with error = true and the payload\
    \ set to the Error object:\n\n### Dispatching errors\n\n```javascript\nconst error\
    \ = new Error('Server responded with 500');\ndispatch(addRecipe(error));\n// The\
    \ dispatched object:\n{\n  type: 'ADD_RECIPE',\n  error: true,\n  payload: Error(...),\n\
    \  meta: { ... }\n}\n```\n\n### createAction() Example\n\nHere's a full example\
    \ of using createAction():\n\n### Dispatching errors\n\n```javascript\nconst addRecipe\
    \ = createAction(\n  ADD_RECIPE,\n  (title, description) => (...args),\n  { silent:\
    \ true }\n);\nconst addRecipeAsync = (title, description = '') => {\n  const details\
    \ = { ...args };\n\n  return (dispatch) => {\n    fetch('/recipes', {\n      method:\
    \ 'post',\n      body: JSON.stringify(details)\n    })\n    .then(\n      response\
    \ => dispatch(addRecipe(details)),\n      error => dispatch(addRecipe(new Error(error)))\n\
    \    )\n  };\n};\n```\n\nIn this example, we use the fetch promise to determine\
    \ whether to create a successful action or an error one:\n\n### Passing the promise\
    \ directly to the action creator\n\n```javascript\nresponse => dispatch(addRecipe(details)),\n\
    error => dispatch(addRecipe(new Error(error)))\n```\n\n### Using redux-actions\
    \ with redux-promise\n\nredux-actions can be used in conjunction with redux-promise³⁵\
    \ to simplify the code even more.\nThe redux-promise library can automatically\
    \ dispatch FSA-compliant actions and set the error and payload fields for us.\
    \ It adds the ability to dispatch() a promise (not just an object or function)\
    \ and knows how to automatically handle the resolve and reject functionality of\
    \ promises:\n\n> ⁵https://github.com/acdlite/redux-promise\n\n### Automatically\
    \ handling promises\n\n```javascript\nconst addRecipe = createAction(ADD_RECIPE);\n\
    export function addRecipeAsync(details) {\n  return () => addRecipe(\n    fetch('/recipes',\
    \ {\n      method: 'post',\n      body: JSON.stringify(details)\n    })\n    .then(response\
    \ => response.json())\n  );\n}\n```\n\nThe magic part is here that we pass a promise\
    \ to addRecipe() that will take care of creating the appropriate FSA-compliant\
    \ action depending on whether the promise is resolved or rejected:\n\n### Passing\
    \ a promise to an action creator\n\n```javascript\nreturn () => addRecipe(\n \
    \ fetch('/recipes',\n```\n\nOur only use of then() is to convert the data we get\
    \ from fetch() into JSON:\n\n### Adding another stage to promise resolution\n\n\
    ```javascript\n.then(response => response.json())\n```\n\nThis line doesn't return\
    \ data, but only modifies the promise that we return from the action creator and\
    \ that the caller will send to dispatch().\n\n### Summary\n\nIn this chapter we\
    \ covered action creators, the fuel running the application. We saw how action\
    \ creators simplify the code. We saw how to pass metadata and dynamic metadata.\
    \ We saw how to handle errors automatically. We saw how to use redux-actions with\
    \ redux-promise. In the next chapter, we will look at reducers.\n"
  mdcn: "\n\n## 第 8 章 动作与动作创建器\n\n### 更简单的创建器结果\n\n```javascript\nfunction addRecipe(title)\
    \ {\n  return {\n    type: ADD_RECIPE,\n    payload: {\n      title\n    }\n \
    \ };\n};\n```\n\n我们也可以向 FSA 动作传递元数据（metadata）。为此，我们可以将元数据对象作为第三个参数：\n\n### 传递元数据\n\
    \n```javascript\nexport const addRecipe = createAction(\n  ADD_RECIPE,\n  (title)\
    \ => ({ title }),\n  { silent: true }\n);\n```\n\n或者，我们可以使用元数据对象，可以使用一个函数根据传入\
    \ payload 的参数来计算元数据：\n\n### 动态元数据\n\n```javascript\nconst addRecipeMetadata =\
    \ (title) => ({\n  silent: true,\n  notifyAdmin: title === 'Omelette'\n});\n```\n\
    \n```javascript\nexport const addRecipe = createAction(\n  ADD_RECIPE,\n  (title)\
    \ => ({ title }),\n  addRecipeMetadata\n);\n```\n\n动作创建器的用法与之前相同。我们只需带上所需的参数调用它即可：\n\
    \n### 带有动态元数据的结果对象\n\n```javascript\ndispatch(addRecipe('Belgian Waffles'));\n\
    // 出的对象：\n{\n  type: 'ADD_RECIPE',\n  error: false,\n  payload: {\n    title:\
    \ 'Belgian Waffles'\n  },\n  meta: {\n    silent: true,\n    notifyAdmin: false\n\
    \  }\n}\n```\n\n### 错误\n\n如果传递了 Error 对象，动作创建器将自动为我们处理错误。它将生成一个 `error = true`\
    \ 且 `payload` 设置为 Error 对象的对象：\n\n### 派发错误\n\n```javascript\nconst error = new\
    \ Error('Server responded with 500');\ndispatch(addRecipe(error));\n// 出的对象：\n\
    {\n  type: 'ADD_RECIPE',\n  error: true,\n  payload: Error(...),\n  meta: { ...\
    \ }\n}\n```\n\n### createAction() 示例\n\n这是一个使用 `createAction()` 的完整示例：\n\n###\
    \ 派发错误\n\n```javascript\nconst addRecipe = createAction(\n  ADD_RECIPE,\n  (title,\
    \ description) => (...args),\n  { silent: true }\n);\nconst addRecipeAsync = (title,\
    \ description = '') => {\n  const details = { ...args };\n\n  return (dispatch)\
    \ => {\n    fetch('/recipes', {\n      method: 'post',\n      body: JSON.stringify(details)\n\
    \    })\n    .then(\n      response => dispatch(addRecipe(details)),\n      error\
    \ => dispatch(addRecipe(new Error(error)))\n    )\n  };\n};\n```\n\n在这个示例中，我们使用\
    \ `fetch` 的 promise 来决定是创建一个成功动作还是错误动作：\n\n### 直接将 promise 传递给动作创建器\n\n```javascript\n\
    response => dispatch(addRecipe(details)),\nerror => dispatch(addRecipe(new Error(error)))\n\
    ```\n\n### 配合 redux-promise 使用 redux-actions\n\n`redux-actions` 可以结合 `redux-promise`³⁵\
    \ 进一步简化代码。\n`redux-promise` 库可以自动派发符合 FSA 标准的动作并为我们设置 `error` 和 `payload` 字段。它增加了\
    \ `dispatch()` 一个 promise（而不只是对象或函数）的能力，并知道如何自动处理 promise 的 resolve 和 reject 功能：\n\
    \n> ⁵https://github.com/acdlite/redux-promise\n\n### 自动处理 promise\n\n```javascript\n\
    const addRecipe = createAction(ADD_RECIPE);\nexport function addRecipeAsync(details)\
    \ {\n  return () => addRecipe(\n    fetch('/recipes', {\n      method: 'post',\n\
    \      body: JSON.stringify(details)\n    })\n    .then(response => response.json())\n\
    \  );\n}\n```\n\n神奇之处在于，我们向 `addRecipe()` 传递了一个 promise，它将根据 promise 的解析或拒绝来创建相应的符合\
    \ FSA 标准的动作：\n\n### 向动作创建器传递 promise\n\n```javascript\nreturn () => addRecipe(\n\
    \  fetch('/recipes',\n```\n\n### 为 promise 的解析增加一个阶段\n\n```javascript\n.then(response\
    \ => response.json())\n```\n\n这一行并没有返回数据，它只是我们将从 `fetch()` 获取的数据转换为 JSON，并修改了我们从动作创建器返回的\
    \ promise，而调用者将将其发送给 `dispatch()`。\n\n### 总结\n\n在本章中，我们涵盖了动作（actions），它是应用程序运行的燃料。我们看到了动作创建器如何简化代码。我们看到了如何传递元数据和动态元数据。我们看到了如何自动处理错误。我们看到了如何配合\
    \ `redux-promise` 使用 `redux-actions`。在下一章中，我们将查看减少器（reducers）。\n\n"
