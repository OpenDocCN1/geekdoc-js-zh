    \      (composed, f) => f(composed),\n      last(...args)\n    )\n  }\n}\n```\n\
    \n## Store Enhancers\n\nStore enhancers are higher-order functions used to enhance\
    \ the default behavior of the Redux store. In contrast to middleware and reducers,\
    \ they have access to all internal store methods (even those not available to\
    \ middleware, such as subscribe()).\n\nTo give a few examples, there are store\
