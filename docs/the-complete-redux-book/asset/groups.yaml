    \ an exercise to add support for custom error handling for actions (a way for\
    \ an action creator to specify if it wants a different error flow than the default).\n\
    \n## Loading Indicator (Spinner)\n\nA common question when using Redux is how\
    \ to show a spinner when server requests are in progress. The middleware approach\
    \ provides an answer using additional `dispatch()` calls. Before a request starts\
    \ or after it completes, we can dispatch a special action to be caught by reducers\
    \ responsible for the UI state. We dispatch apiStart() action before any server\
    \ communication and dispatch apiDone() on successful and failed server responses:\n\
    \nShow and hide spinner\n\n```\ndispatch(apiStart());\nfetch(BASE_URL + action.payload.url)\n\
    \  .then(response => {\n    dispatch(apiDone());\n    //\n  })\n  .catch(error\
    \ => {\n    dispatch(apiDone());\n    //\n  });\n```\n\nTo keep track of pending\
    \ requests, we can keep a counter in the state under a `serverStatus` or ui containers\
    \ in the state. The counter can be used by the UI to show a spinner if the number\
    \ of pending requests is greater than zero:\n\nUI reducer to handle the requests\
    \ counter\n\n```javascript\nconst uiReducer = (state, action) => {\n  switch (action.type)\
    \ {\n    case API_START:\n      return Object.assign({}, state, {\n        requests:\
    \ state.requests + 1\n      });\n    case API_DONE:\n      return Object.assign({},\
    \ state, {\n        requests: state.requests - 1\n      });\n  }\n};\n```\n\n\
    ## Dynamic Action Types\n\nBuilding on the loading indicator example, we might\
    \ want to handle multiple indicators for different parts of our application, by\
    \ having multiple subtrees in the ui state sub-tree. Unfortunately, this does\
    \ not work with generic success/error actions.\n\nOne way to handle multiple pending,\
    \ success, and error actions is to pass them in the dispatched action:\n\nAction\
    \ creator with custom pending action\n\n```javascriptconst fetchRecipes = () =>\
    \ ({\n  type: 'API',\n  payload: {\n    url: 'recipes.json',\n    pending: 'FETCH_RECIPES_PENDING',\n\
    \    success: 'FETCH_RECIPES_SUCCESS',\n    error: 'FETCH_RECIPES_FAILURE'\n \
    \ }\n});\n```\n\nThis method allows us to handle different action types in different\
    \ reducers. However, this approach is not flexible, encourages code repetition,\
    \ and forces us to have multiple action types defined for every API action.\n\n\
    Another approach is to store the response status in the dispatched action:\n\n\
    ```javascript\ndispatch({ type: FETCH_RECIPES, status: 'SUCCESS', response: });\n\
    ```\n\nThis might look simple, as you can reuse one action in the middleware,\
    \ but it causes reducers to contain more control flow and logic and it makes logging\
    \ and debugging more difficult (because we get the same action types in the log\
