  - "[PAGE 151]\n\n# Chapter 9. Reducers\n\nThis approach results in smaller, cleaner,\
    \ more testable reducers. Each of the reducers receives a subset of the whole\
    \ state tree and is responsible only for that, without being aware of the other\
    \ parts of the state. As the project and the complexity of the state grow, more\
    \ nested reducers appear, each responsible for a smaller subset of the state tree.\n\
    \n# Combining Reducers\n\nThis technique of reducer combination is so convenient\
    \ and broadly used that Redux provides a very useful function named combineReducers()\
    \ to facilitate it. This helper function does exactly what rootReducer() in our\
    \ previous example, with some additions and validations:\n\nRoot reducer using\
    \ combineReducers()\n\n```\nimport combineReducers } from 'redux';\nimport recipesReducers\
    \ from 'reducers/recipes';\nimport ingredientsReducers from 'reducers/ingredients';\n\
    \nconst rootReducer = combineReducers({\n  recipes: recipesReducer,\n  ingredients:\
    \ ingredientsReducer\n});\n```\n\nWe can make this even simpler by using ES2016's\
    \ property shorthand feature:\n\nUsing ES2016 syntax in combineReducers()\n\n\
    ```\nimport { combineReducers } from 'reducers';\nimport recipes from 'reducers/recipes';\n\
    import ingredients from 'reducers/ingredients';\n\nconst rootReducer = combineReducers({\
    \ recipes, ingredients });\n\nexport const store = createStore(rootReducer);\n\
    ```\n\nIn this example we provided combineReducers() with a configuration object\
    \ holding two keys named reducers and ingredients. The ES2016 syntax we automatically\
    \ assigned the value of each key to be the corresponding reducer.\n\nIt is important\
    \ to note that combineReducers() is not limited to the root reducer. As our state\
    \ grows in size and depth, nested reducers will be combining other reducers for\
    \ substate calculations. Using nested combineReducers() calls and other combination\
    \ methods is a common practice in larger projects."
