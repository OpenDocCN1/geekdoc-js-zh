    # Chapter 5. WebSockets


    Sample communication flow


    ```

    > TO-SERVER: { type: ''GET_USER'', id: 100 }

    < FROM-SERVER: { type: ''USER_INFO'', data: { ... } }

    ```


    A robust example might be a chat server, where we can dispatch to the store message
    similar to: { id: ''XXX'', type: ''ADD_MESSAGE'', msg: ''Hello'' }. Our store
    can handle this immediately by adding the message to the current messages array
    and send it "as is" over a WebSocket to the server. The server, in turn, can broadcast
    the message to all other clients. Each will get a perfectly standard Redux action
    that can be passed directly to stores.


    This way our frontend can use Redux actions to pass information between browser
    windows and machines, using the server as a generic dispatcher. Our server might
    do some additional work, like authentication and validation to prevent abuse,
    but in essence we can serve as a message passer.


    An ideal WebSocket implementation for Redux would allow us to dispatch() actions
    and have them smartly routed to the server when needed, and have any actions coming
    from the WebSocket dispatched to the store.


    # Code Implementation


    With any infrastructure-related code, middleware is the perfect place for our
    WebSocket implementation. It will allow us to catch any actions that are required
    to be sent over the WebSocket and dispatch() anything coming from the server.


    Basic structure of a WebSocket setup


    ```

    const WS_ROOT = "ws://echo.websocket.org/";

    const websocket = new WebSocket(WS_ROOT);

    websocket.onopen = () => {};nwebsocket.onclose = () => {};nwebsocket.onerror =
    event => {};nwebsocket.onmessage = event => {};

    ```


    To make the code more readable, we can replace the four different assignments
    with a single use of Object.assign() and use code similar to this:'
