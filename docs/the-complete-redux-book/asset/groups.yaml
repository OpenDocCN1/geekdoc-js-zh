    \n# 第 6 章 测试\n\n正确的 API_FINISHED 测试\n\n```javascript\nit('should dispatch API_FINISHED',\
    \ () => {\n  return middleware(apiAction())\n    .then(() => {\n      expect(dispatchCalls[2]).toEqual({\
