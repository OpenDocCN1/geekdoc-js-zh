    <button id='dec'>Decrement</button>\n```\n\n### The JavaScript\n\n```javascript\n\
    // Our mutation (Reducer) function,\n// create a new_state based on the action\
    \ passed\nfunction reducer(state, action) {\n  switch(action.type) {\n    case\
    \ 'INC':\n      return ( ...state, counter: state.counter + 1 );\n    case 'DEC':\n\
    \      return ( ...state, counter: state.counter - 1 );\n    default:\n      return\
    \ state;\n  }\n}\n\nconst initialState = {\n  counter: 3\n};\n\nconst store =\
    \ Redux.createStore(reducer, initialState);\n\n// Update view (this might be React\
    \ in a real app)\nfunction updateView() {\n  document.querySelector('#counter').innerText\
    \ = store.getState().counter;\n}\n\nstore.subscribe(updateView);\n```\n\n```javascript\n\
