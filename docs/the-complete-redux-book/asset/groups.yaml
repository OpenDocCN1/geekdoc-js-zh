    export const FETCH_RECIPES = asyncActionType('FETCH_RECIPES');\n```\n\nWith this\
    \ approach we can use the same action type constant to handle three cases for\
    \ async actions:\nreducers/recipes.js\n\n```javascript\nimport { FETCH_RECIPES\
