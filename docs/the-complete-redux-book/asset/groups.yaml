  - "[PAGE 148]\n\n# # Chapter 9. Reducers\n\nThe word **reducer** is commonly associated\
    \ in computer science with a function that takes an array or object and converts\
    \ it to a simpler structure—for example, summing all the items in an array. In\
    \ Redux, the role of the reducer is somewhat different: reducers create a new\
    \ state out of the old one, based on an action.\n\nIn essence, a reducer is a\
    \ simple JavaScript function that receives two parameters (two objects) and returns\
    \ an object (a modified copy of the first argument):\n\nA simple reducer example\n\
    \n```\nconst sum = (result, next) => result + next;\n[1,2,3].reduce(sum); // ->\
    \ 6\n```\n\nReducers in Redux are **pure functions**, meaning they don't have\
    \ any side effects such as changing local storage, contacting the server, or saving\
    \ any data in variables. A typical reducer looks like this:\n\nBasic reducer\n\
    \n```\nfunction reducer(state, action) {\n  switch (action.type) {\n    case 'ADD_RECIPE':\n\
    \      // Create new state with a recipe\n    default:\n      return state;\n\
    \  }\n}\n```\n\n# # Reducers in Practice\n\nIn Redux, reducers are the final stage\
    \ in the unidirectional data flow. After an action is dispatched to the store\
    \ and has passed through all the middleware, reducers receive the current state\
    \ of the application. Then they create a new state that has been modified according\
    \ to the action and return it to the store."
  - "[PAGE 149]\n\n# Chapter 9. Reducers\n\nThe way we connect the store and the reducers\
    \ is via the createStore() method, which can receive three parameters: a reducer,\
    \ an optional initial state, and an optional store enhancer (covered in detail\
    \ in the Store and Store Enhancers Chapter).\n\nAs an example, we use the application\
    \ built in Chapter 2–a simple Recipe Book application. Our state contains three\
    \ substates:\n\n+   - Recipes – A list of recipes\n- Ingredients – A list of ingredients\
    \ and amounts used in each recipe\n- UI – An object containing the state of various\
    \ UI elements\n\nWe support a number of actions, like ADD_RECIPE, FETCH_RECIPES,\
    \ and we use a large switch statement that knows how to handle all the actions\
    \ our application supports. But it is quite clear that this approach will break\
    \ fast as our application (and the number of actions) grows.\n\nUsing a switch\
    \ statement to reduce a reducer\n\n```\nswitch (action.type) {\n  case 'ADD_RECIPE':\n\
    \    /* handle add recipe action */\n  case 'FETCH_RECIPES':\n    /* handle fetch\
    \ recipes action */\n  ...\n}\n```\n\n# Reducer Separation\n\nThe obvious solution\
    \ would be to find a way to split the reducer code into multiple chunks. The way\
    \ redux handles this is by creating multiple reducers. The reducer passed as a\
    \ first argument to createStore() is a plain function, and we can extract code\
    \ of it to put in other functions.\n\nSplitting and writing reducers becomes a\
    \ much easier job if we correctly build the structure of the state in our store.\
    \ Given our example of the Recipe Book, we can see that we can create a reducer\
    \ for each of the substates. What's more, each of the reducers only needs to know\
    \ about its part of the state, and they have no dependency on each other. For\
    \ example, the recipes reducer only handles recipe management, like adding and\
    \ removing recipes, and doesn't care about how UI states are managed."
  - "[PAGE 150]\n\n# Chapter 9. Reducers\n\n145\n\nFollowing this separation of concerns,\
    \ we can put each reducer into a different file and have a single root reducer\
    \ manage all of them. Another side of this approach is that the root reducer will\
    \ pass each of its children only the part of the state that it cares about (e.g.,\
    \ the ingredients reducer will only get the ingredients substate of the store).\
    \ This ensures the individual reducers can't “break out” of their encapsulation.\n\
    \n# Recipes reducer\n\n```\nconst initialState = [];\n\nexport default function\
    \ recipesReducer(recipes = initialState, action) {\n  switch (action.type) {\n\
    \    case ADD_RECIPE:\n      return [...recipes, action.payload];\n    ...\n \
    \ }\n}\n```\n\n# Ingredients reducer\n\n```\nconst initialState = [];\n\nexport\
    \ default function ingredientsReducer(ingredients = initialState, action) {\n\
    \  switch (action.type) {\n    case ADD_INGREDIENT:\n      return [...ingredients,\
    \ action.payload];\n    ...\n  }\n}\n```\n\n# Root reducer\n\n```\nimport reducers\
    \ from 'reducers/recipes';\nimport ingredientsReducer from 'reducers/ingredients';\n\
    \nconst rootReducer = (state = {}, action) => Object.assign({}, state, {\n  recipes:\
    \ recipesReducer(state.recipes, action),\n  ingredients: ingredientsReducer(state.ingredients,\
    \ action)\n});\n\nexport default rootReducer;\n```"
- md: "\n# Chapter 9. Reducers\n\nThis approach results in smaller, cleaner, more\
    \ testable reducers. Each of the reducers receives a subset of the whole state\
    \ tree and is responsible only for that, without being aware of the other parts\
    \ of the state. As the project and the complexity of the state grow, more nested\
    \ reducers appear, each responsible for a smaller subset of the state tree.\n\n\
    ## Combining Reducers\n\nThis technique of reducer combination is so convenient\
    \ and broadly used that Redux provides a very useful function named `combineReducers()`\
    \ to facilitate it. This helper function does exactly what `rootReducer()` in\
    \ our previous example, with some additions and validations:\n\nRoot reducer using\
    \ combineReducers()\n\n```javascript\nimport { combineReducers } from 'redux';\n\
    import recipesReducers from 'reducers/recipes';\nimport ingredientsReducers from\
    \ 'reducers/ingredients';\n\nconst rootReducer = combineReducers({\n  recipes:\
    \ recipesReducer,\n  ingredients: ingredientsReducer\n});\n```\n\nWe can make\
    \ this even simpler by using ES2016's property shorthand feature:\n\nUsing ES2016\
    \ syntax in combineReducers()\n\n```javascript\nimport { combineReducers } from\
    \ 'redux';\nimport recipes from 'reducers/recipes';\nimport ingredients from 'reducers/ingredients';\n\
    \nconst rootReducer = combineReducers({ recipes, ingredients });\n\nexport const\
    \ store = createStore(rootReducer);\n```\n\nIn this example we provided `combineReducers()`\
    \ with a configuration object holding two keys named `reducers` and `ingredients`.\
    \ The ES2016 syntax we automatically assigned the value of each key to be the\
    \ corresponding reducer.\n\nIt is important to note that `combineReducers()` is\
    \ not limited to the root reducer. As our state grows in size and depth, nested\
    \ reducers will be combining other reducers for substate calculations. Using nested\
    \ `combineReducers()` calls and other combination methods is a common practice\
    \ in larger projects.\n\n## Default Values\n\nOne of the requirements of `combineReducers()`\
    \ is for each reducer to define the default value for its substrate. But our recipes\
    \ and ingredients reducers defined the initial state for their subtrees as an\
    \ empty object. Using this approach, the structure of the state tree as a whole\
    \ is not defined in a single place but built up by the reducers. This guarantees\
    \ that changes to the tree require us to only change the applicable reducers and\
    \ do not affect the rest of the tree.\n\nThis is possible because when the store\
    \ is created, Redux dispatches a special action called `@redux/INIT`. Each reducer\
    \ receives that action together with the undefined initial state, which gets replaced\
    \ by the parameter defined inside the reducer. Since our switch statements do\
    \ not process this action type and simply return the state (previously assigned\
    \ by the default parameter), the initial state of the store is automatically populated\
    \ by the reducers.\n\n## Tree Mirroring\n\nThis brings us to an important conclusion:\
    \ we want to structure our reducers tree to mimic the application state tree.\
    \ As a rule of thumb, we will need to have a reducer for each leaf of the tree.\
    \ It would also be handy to mimic the folder structure in the reducers directory,\
    \ as it will be self-depicting of how the state tree is structured.\n\nAs complicated\
    \ manipulations might be required to add some parts of the tree, some reducer\
    \ might fall into this pattern. We might find ourselves having two or more reducers\
    \ process the same subtree (sequentially), or a single reducer operating on multiple\
    \ branches (if it needs to update structures at two different branches). This\
    \ might cause complications in the structure and composition of our application.\
    \ Such issues can usually be avoided by normalizing the tree, splitting a single\
    \ action into multiple ones, and other Redux tricks.\n\n## Alternative to switch\
    \ Statements\n\nAfter a while, it becomes apparent that most reducers are just\
    \ switch statements over action type. Since the switch syntax can be hard to read\
    \ and prone to errors, there are a few libraries that try to make writing reducers\
    \ easier and cleaner.\n\n> While it is most common for a reducer to examine the\
    \ type property of the action to determine if it should, in some other cases property\
    \ of the action's object are used. For example, you might want to show an error\
    \ notification on every action that has an error in the payload.\n\nA common library\
    \ is `redux-create-reducer`, which builds a reducer from a configuration object\
    \ that defines how to respond to different actions:\n\n³⁶ https://github.com/kolodny/redux-create-reducer\n\
    \nReducer using redux-create-reducer\n\n```javascript\nimport { createReducer\
    \ } from 'redux-create-reducer';\nconst initialState = [];\nconst recipesReducer\
    \ = createReducer(initialState, {\n  [ADD_RECIPE](recipes, action) {\n    return\
    \ [...recipes, action.payload];\n  },\n  [REMOVE_RECIPE](recipes, action) {\n\
    \    const index = recipes.indexOf(action.payload);\n    return {\n      ...recipes.slice(0,\
    \ index),\n      ...recipes.slice(index + 1)\n    };\n  }\n}));\nexport default\
    \ recipesReducer;\n```\n\nRemoving the case and default statements can make the\
    \ code easier to read, especially when combined with the ES2016 property shorthand\
    \ syntax. The implementation is trivial:\n\nReducer using redux-create-reducer\
    \ with ES2016 syntax\n\n```javascript\nfunction createReducer(initialState, handlers)\
    \ {\n  return function(state, action) {\n    if (state === undefined) state =\
    \ initialState;\n    if (handlers.hasOwnProperty(action.type)) {\n      return\
    \ handlers[action.type](state, action);\n    } else {\n      return state;\n \
    \   }\n  };\n}\n```\n\nIf you are using the redux-actions library described in\
    \ the previous chapter, you can also use the `handleActions()` utility function\
    \ from that library. It behaves basically the same way as `createReducer()`, with\
    \ one distinction—initialState is passed as a second argument:\n\nUsing redux-actions\
    \ instead of createReducer()\n\n```javascript\nimport { handleActions } from 'redux-actions';\n\
    const initialState = [];\nconst recipesReducer = handleActions({\n  [ADD_RECIPE](recipes,\
    \ action) {\n    return [...recipes, action.payload];\n  },\n  [REMOVE_RECIPE](recipes,\
    \ action) {\n    const index = recipes.indexOf(action.payload);\n    return [\n\
    \      ...recipes.slice(0, index),\n      ...recipes.slice(index + 1)\n    ];\n\
    \  },\n}, initialState);\n```\n\nIf you are using Immutable.js, you might also\
    \ want to look at the redux-immutablejs* library, which provides you with `createReducer()`\
    \ and `combineReducers()` functions that are aware of Immutable.js features like\
    \ getters and setters.\n\n## Avoiding Mutations\n\nThe most important thing about\
    \ reducers in Redux is that they should never mutate the existing state. There\
    \ are a number of functions in JavaScript that can help when working with immutable\
    \ objects.\n\n## Why Do We Need to Avoid Mutations?\n\nOne of the reasons behind\
    \ the immutability requirement for the reducers is due to change detection requirements.\
    \ After the store processes the current state and action, the various UI components\
    \ of the application need a way to determine what changes, if any, have happened.\
    \ For small objects, a deep copy or similar methods might suffice. But if the\
    \ state is large and only a small part may have changed, we need a faster and\
    \ better method.\n\n>* https://github.com/indexiatech/redux-immutable\n\nThere\
    \ are a number of ways to detect a change made to a tree, each with its pros and\
    \ cons. Among the many solutions, one is to mark where changes were made in the\
    \ tree. We can use simple methods like setting a dirty flag, use more complicated\
    \ approaches like adding a version to each node, or (the preferred Redux way)\
    \ use reference comparison.\n\n> If you are unsure of how references work, jump\
    \ ahead to the next two chapters and come back to this one.\n\nRedux and its accompanying\
    \ libraries rely on reference comparison. After the root reducer has run, we should\
    \ be able to compare the state at each level of the state tree with the same level\
    \ on the previous tree to determine if it has changed. But instead of comparing\
    \ each key and value, we can compare only the reference or the pointer to the\
    \ structure.\n\nIn Redux, each changed node or leaf is replaced by a new copy\
    \ of itself that has the changed data. Since the node's parent still points to\
    \ the old copy of the node, we need to create a copy of it as well, with the new\
    \ copy pointing to the new child. This process continues with each parent being\
    \ recreated until we reach the root of the tree. This means that a change to a\
    \ leaf must cause its parent, the parent's parent, etc. to be modified—i.e., it\
    \ causes new objects to be created. The following illustration shows the state\
    \ before and after it is run through a reducer tree and highlights the changed\
    \ nodes.\n"
  mdcn: "\n\n# 第 9 章. Reducers\n\n这种方法可以产生更小、更整洁、更于测试的 reducer。每个 reducer 接收整个状态树的子集，并只负责该部分，而不感知状态的其他部分。随着项目的发展和状态复杂性的增加，会出现更多嵌套的\
    \ reducer，每个 reducer 负责状态树中更小的子集。\n\n## 合并 reducer (Combining Reducers)\n\n这种\
    \ reducer 组合技术非常方便且被广泛使用，因此 Redux 提供了一个名为 `combineReducers()` 的有用函数来方便实现。这个辅助函数的作用与我们之前示例中的\
    \ `rootReducer()` 完全相同，但增加了一些功能和校验：\n\n使用 combineReducers() 的根节点 reducer\n\n```javascript\n\
    import { combineReducers } from 'redux';\nimport recipesReducers from 'reducers/recipes';\n\
    import ingredientsReducers from 'reducers/ingredients';\n\nconst rootReducer =\
    \ combineReducers({\n  recipes: recipesReducer,\n  ingredients: ingredientsReducer\n\
    });\n```\n\n通过使用 ES2016 的属性简写特性，我们可以使其更加简单：\n\n在 combineReducers() 中使用 ES2016\
    \ 语法\n\n```javascript\nimport { combineReducers } from 'redux';\nimport recipes\
    \ from 'reducers/recipes';\nimport ingredients from 'reducers/ingredients';\n\n\
    const rootReducer = combineReducers({ recipes, ingredients });\n\nexport const\
    \ store = createStore(rootReducer);\n```\n\n在这个示例中，我们为 `combineReducers()` 传递了一个包含两个名为\
    \ `recipes` 和 `ingredients` 键的配置对象。通过 ES2016 语法，我们自动将每个键的值赋值为相应的 reducer。\n\n\
    需要注意的是，`combineReducers()` 不限于根节点 reducer。随着我们状态的大小和深度的增加，嵌套的 reducer 将组合其他的 reducer\
    \ 以进行子状态计算。在大型项目中，使用嵌套的 `combineReducers()` 调用和其他组合方法是一项常见做法。\n\n## 默认值 (Default\
    \ Values)\n\n`combineReducers()` 的要求之一是每个 reducer 都要为其基底（substrate）定义默认值。但我们的\
    \ recipes 和 ingredients reducer 将其子树的初始状态定义为空对象。使用这种方法，整个状态树的结构并没有定义在一个单一的地方，而是由\
    \ reducer 逐步构建起来的。这保证了对树的更改只需要我们只修改相关的 reducer，而不会影响树的其余部分。\n\n这之所以可能，是因为在创建 store\
    \ 时，Redux 会触发一个名为 `@redux/INIT` 的特殊 action。每个 reducer 都会接收该 action 以及 `undefined`\
    \ 的初始状态，该状态会被 reducer 内部定义的参数所替换。由于我们的 switch 语句没有处理此 action 类型并简单地返回状态（之前由默认参数赋值），store\
    \ 的初始状态会自动由 reducer 填充。\n\n## 树的镜像 (Tree Mirroring)\n\n这带给我们一个重要的结论：我们希望构建 reducer\
    \ 树结构来模仿应用程序的状态树。根据经验法则，我们需要为树的每个叶子节点准备一个 reducer。同时，模仿 reducers 目录中的文件夹结构也会很有帮助，因为它能自解释地展示状态树的结构。\n\
    \n由于添加树的某些部分可能需要复杂的处理，某些 reducer 可能会陷入这种模式。我们可能会发现有两个或多个 reducer 处理同一个子树（按顺序），或者单个\
    \ reducer 在多个分支上操作（如果它需要更新两个不同分支的结构）。这可能会导致应用程序的结构和组合变得复杂。此类问题通常可以通过归一化树、将单个 action\
    \ 拆分为多个 action 以及其他 Redux 技巧来避免。\n\n## switch 语句的替代方案 (Alternative to switch Statements)\n\
    \n一段时间后，你会发现大多数 reducer 只是基于 action type 的 switch 语句。由于 switch 语法难以阅读且容易出错，有一些库尝试让编写\
    \ reducer 变得更简单更整洁。\n\n> 虽然 reducer 最常见的做法是检查 action 的 type 属性来判断是否应该处理，但在其他情况下，action\
    \ 对象的属性会被用到。例如，你可能希望在每个 payload 包含错误的 action 上都显示错误通知。\n\n一个常用的库是 `redux-create-reducer`，它从一个配置对象构建\
    \ reducer，该对象定义了如何响应不同的 action：\n\n³⁶ https://github.com/kolodny/redux-create-reducer\n\
    \n使用 redux-create-reducer 的 reducer\n\n```javascript\nimport { createReducer }\
    \ from 'redux-create-reducer';\nconst initialState = [];\nconst recipesReducer\
    \ = createReducer(initialState, {\n  [ADD_RECIPE](recipes, action) {\n    return\
    \ [...recipes, action.payload];\n  },\n  [REMOVE_RECIPE](recipes, action) {\n\
    \    const index = recipes.indexOf(action.payload);\n    return {\n      ...recipes.slice(0,\
    \ index),\n      ...recipes.slice(index + 1)\n    };\n  }\n}));\nexport default\
    \ recipesReducer;\n```\n\n移除 case 和 default 语句可以让代码更易读，特别是当与 ES2016 属性简写语法结合时。其实现非常简单：\n\
    \n使用 ES2016 语法的 redux-create-reducer  reducer\n\n```javascript\nfunction createReducer(initialState,\
    \ handlers) {\n  return function(state, action) {\n    if (state === undefined)\
    \ state = initialState;\n    if (handlers.hasOwnProperty(action.type)) {\n   \
    \   return handlers[action.type](state, action);\n    } else {\n      return state;\n\
    \    }\n  };\n}\n```\n\n如果你正在使用上一章介绍的 `redux-actions` 库，你也可以使用该库中的 `handleActions()`\
    \ 工具函数。它的行为基本上与 `createReducer()` 相同，唯一的区别是 `initialState` 作为第二个参数传递的：\n\n使用 redux-actions\
