    # 第一部分. Redux 简介


    ## 第 1 章. Flux 和 Redux 的核心概念


    青霉素、X 射线和起搏器都是意外发现的著名例子。Redux 也是如此，它原本并不是成为一个库，但证明是一个出色的 Flux 实现。2015 年，其作者之一
    Dan Abramov* 在 ReactEurope 大会议上提交了一场关于“热加载和时间旅行”的演讲，他承认当时他完全不知道如何实现时间旅行。在 Andrew
    Clark* 的帮助下以及受 Elm* 语言一些优雅理念的启发下，他最终想出了一种非常整洁的架构。当人们开始跟上它时，他决定将其标记为一个库。


    在不到半年的时间里，那个很小的（仅 2 KB）库变成了 React 开发者的首选框架，由于其微小的体积、易读的代码和非常简单整洁的理念，它比竞争性的 Flux
    实现更容易上手。事实上，Redux 并不是一个 Flux 库，尽管它是通过 Facebook Flux 背后的理念演变而来的。Redux 的官方定义是 JavaScript
    应用程序的可预测状态容器。这意味着你将所有的应用程序状态都存储在一个地方，并知道任何给定时间点的状态是什么。


    ### 什么是 Flux？


    在深入研究 Redux 之前，我们应该熟悉它的基础 Flux。“Flux”是一种通用的架构或模式，而不是一个特定的实现。它的理念最早由 Bill Fisher
    和 Jing Chen 在 2014 年 4 月的 F8 会上提出。Flux 重新定义了之前的 MVC（模型-视图-控制器）和 MVVM（模型-视图-模型）以及双向绑定，提出了一种新的事件流，称为单向数据流。


    事件以循环的方式一次一次进行管理，涉及多个参与者：dispatcher（分发器）、stores（存储器）和 actions（动作）。action 是描述系统中任何变化的结构：鼠标点击、超时事件、Ajax
    请求等。actions 被发送到 dispatcher，它是系统中任何人都可以提交 action 的单点。应用程序状态随后维护在 stores 中，它们响应来自
    dispatcher 的命令。


    *http://www.businessinsider.com/these-10-inventions-were-made-by-mistake-2010-11-07

    *http://survejs.com/blog/redux-interview/

    *https://twitter.com/asc

    *http://elm-lang.org/

    *http://redux.js/


    这是简单的 Flux 流：


    1. stores 订阅一部分 actions。

    2. action 被发送到 dispatcher。

    3. dispatcher 通知订阅的 stores 该 action。

    4. stores 根据 action 更新其状态。

    5. 视图根据 stores 中的新状态进行更新。

    6. 随后可以处理下一个 action。


    ![](img/fbb45cbd9118f0a7f1feb2a04f50e708_12_0.png)


    Flux 确保了推断动作是如何流动的、什么会导致状态变化以及状态将如何变化的容易。考虑一个 jQuery 或 AngularJS 应用的例子。点击按钮可以触发多个回调函数的执行，每个回调更新系统的不同部分，这可能会触发其他地方的更新。在这种情况下，大型应用的开发者几乎无法知道单个事件将如何修改应用程序的状态，以及变化以什么顺序发生。


    在 Flux 中，事件将产生单个 action，该 action 将变动 store 并返回视图。在此过程中，由 store 或组件创建的任何 action
    都会被放入队列，并在第一个 action 完成且视图更新后执行。


    Facebook 的开发者最初并没有开源他们的 Flux 实现，而是只发布了部分内容，例如 dispatcher。这导致社区构建了许多开源实现，其中有些与原始版本差异巨大，有些只是对原始版本略有微调。


