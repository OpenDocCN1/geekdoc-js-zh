    \ some cases, action creators might contain logic that emits different action\
    \ objects based on its input parameters. As long as no asynchronous code or external\
    \ entities (like localStorage) are touched, we can easily test the logic by providing\
    \ different input parameters to the action creator and verifying it every object\
    \ time:\n\nAn action creator that modifies the input\n\n```javascript\nexport\
    \ const addRecipe = (title) => ({\n  type: actions.ADD_RECIPE,\n  payload: title\
    \ || \"Default\"\n});\n```\n\nThe modified addRecipe() action creator will set\
    \ payload to \"Default\" if the user does not provide a title. To test this behavior\
    \ we can create two tests, one that provides a parameter (as we already did) and\
    \ one that provides an empty string. A fully comprehensive test might contain\
    \ \"empty string\" cases, for null, undefined, and '' :\n\nCombined test of multiple\
    \ empty input values\n\n```javascript\nit('should add recipe with default parameter',\
    \ () => {\n  expect(actions.addRecipe(undefined)).toMatchSnapshot();\n  expect(actions.addRecipe(null)).toMatchSnapshot();\n\
    \  expect(actions.addRecipe('')).toMatchSnapshot();\n});\n```\n\nIn contrast to\
    \ what we discussed earlier, we tried putting multiple expect() functions into\
    \ the same test. This approach will work, but it will be harder to identify which\
    \ test failed in the event of an error.\n\nSince we are using JavaScript to write\
