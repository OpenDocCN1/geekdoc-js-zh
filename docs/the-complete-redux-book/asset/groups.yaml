    \ action);\n\n  if (newState !== state) {\n    state = newState;\n\n    listeners.forEach(listener\
    \ => listener());\n  }\n}\n```\n\n再次，非常重要的一点是，我们期望一个 reducer 创建一个新的状态，而不仅仅是修改现有的状态。我们将使用简单的引用比较来检查状态是否发生了变化。\n\
    \n剩余的一个任务是通知视图状态的变化。在我们的示例中，我们只有一个监听器（listener），但我们可以通过允许多个回调函数注册“状态变化”事件，来实现完整的监听器支持。我们将通过维护一个所有已注册回调的列表来实现这一点。\n\
    \n## 实现 subscribe API\n\n```javascript\nconst listeners = [];\nfunction subscribe(callback)\
    \ {\n  listeners.push(callback);\n}\n```\n\n这可能会让你感到惊讶，但我们刚刚实现了 Redux 框架的大部分。真实的代码^11\
    \ 并没有长多少，我们强烈建议你花半小时时间来阅读它。\n\n## 使用真实的 Redux\n\n为了完成我们的示例，让我们切换到真实的 Redux 库，看看解决方案仍然保持多相似相似。首先我们将添加\
