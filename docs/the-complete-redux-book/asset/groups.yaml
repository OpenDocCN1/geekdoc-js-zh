    # Chapter 5. WebSockets


    WebSockets have brought a robust socket communication method directly into our
    browsers. What started as a solution for polling data changes on the server is
    slowly taking over more and more responsibilities from traditional REST endpoints.
    The action-based architecture of Redux makes working with WebSockets exceptionally
    easy and natural, as it involves using WebSockets as a pipe to pass actions to
    and from the server.


    # Basic Architecture


    WebSockets allow us to open a connection to a server and send or receive messages
    in a fully asynchronous way. The native implementation in browsers has only four
    callback methods that are required to fully support WebSockets:


    +   - onopen - A connection has become active.

    - onclose - A connection has been closed.

    - onerror - An error related to WebSocket communication has been raised.

    - onmessage - A new message has been received.


    While multiple WebSockets might be used, most applications will require a single
    or at most a few connections for different servers based on function (chat server,
    notifications server, etc.).


    To start, we will build a system to communicate with a single WebSocket, which
    can later be extended for multi-WebSocket support.


    # Redux Link


    The Redux architecture is all about sending well-defined messages to the store.
    This general scheme can work perfectly for server communication over WebSockets.
    The same structure of plain objects with the type property can be sent to the
    server, and we can receive a similarly structured response back:'
- md: "\n## Chapter 5. WebSockets\n\nSample communication flow\n\n```\n> TO-SERVER:\
    \ { type: 'GET_USER', id: 100 }\n< FROM-SERVER: { type: 'USER_INFO', data: { ...\
    \ } }\n```\n\nA robust example might be a chat server, where we can dispatch to\
    \ the store message similar to: { id: 'XXX', type: 'ADD_MESSAGE', msg: 'Hello'\
    \ }. Our store can handle this immediately by adding the message to the current\
    \ messages array and send it \"as is\" over a WebSocket to the server. The server,\
    \ in turn, can broadcast the message to all other clients. Each will get a perfectly\
    \ standard Redux action that can be passed directly to stores.\n\nThis way our\
    \ frontend can use Redux actions to pass information between browser windows and\
    \ machines, using the server as a generic dispatcher. Our server might do some\
    \ additional work, like authentication and validation to prevent abuse, but in\
    \ essence we can serve as a message passer.\n\nAn ideal WebSocket implementation\
    \ for Redux would allow us to dispatch() actions and have them smartly routed\
    \ to the server when needed, and have any actions coming from the WebSocket dispatched\
    \ to the store.\n\n## Code Implementation\n\nWith any infrastructure-related code,\
    \ middleware is the perfect place for our WebSocket implementation. It will allow\
    \ us to catch any actions that are required to be sent over the WebSocket and\
    \ dispatch() anything coming from the server.\n\nBasic structure of a WebSocket\
    \ setup\n\n```\nconst WS_ROOT = \"ws://echo.websocket.org/\";\nconst websocket\
    \ = new WebSocket(WS_ROOT);\nwebsocket.onopen = () => {};\nwebsocket.onclose =\
    \ () => {};\nwebsocket.onerror = event => {};\nwebsocket.onmessage = event =>\
    \ {};\n```\n\nTo make the code more readable, we can replace the four different\
    \ assignments with a single use of Object.assign() and use code similar to this:\n\
    \n### Using Object.assign\n\n```\nObject.assign(websocket, {\n  open() { },\n\
    \  onclose() { },\n  onerror(e) { },\n  onmessage(e) { }\n});\n```\n\nIn our middleware,\
    \ we want to make sure a WebSocket is created only once. Thus, we cannot the setup\
    \ code inside the action handler:\n\nThe wrong way to initialize in middleware\n\
    \n```\nconst wsMiddleware = ({ dispatch, getState }) => next => action => {\n\
    \  // Initialization not allowed\n};\n```\n\nThe code in the innermost block gets\
    \ every time an action is dispatched, so this would our setup and WebSocket creation\
    \ code be called multiple times. To prevent this, we can do the initialization\
    \ outside the action callback block:\n\nCorrect way to initialize in middleware\n\
    \n```\nconst wsMiddleware = ({ dispatch, getState }) => next => {\n  // TODO:\
    \ Initialization\n  return action => {\n    // TODO: Middleware\n  };\n};\n```\n\
    \nLet's get back to the initialization code and consider how to handle each of\
    \ the four callbacks: open, onclose, onerror, and onmessage.\n\n### onopen\n\n\
    This is mainly an informative stage; we need to indicate to ourselves that the\
    \ socket is ready to receive data and might choose to notify the rest of the Redux\
    \ application that the socket is ready (perhaps to show some indication in the\
    \ UI).\n\nOnce the socket is open, we dispatch a simple { type: 'WS_CONNECTED'\
    \ } action to notify the rest of Redux:\n\n### Handling onopen\n\n```\nwebsocket.onopen\
    \ = () => dispatch(wsConnected());\n```\n\nThe wsConnected() function is a simple\
    \ action creator that should be implemented in one of the action creator files:\n\
    \napp/actions/ui.js\n\n```\nimport { WS_CONNECTED } from 'consts/action-types';\n\
    const wsConnected = () => ({ type: WS_CONNECTED });\n```\n\n### onclose\n\nThe\
    \ close or disconnect event is very similar to onopen and can be handled in the\
    \ exact same way:\n\nHandling onclose\n\n```\nwebsocket.onclose = () => dispatch(wsDisconnected());\n\
    ```\n\n### onerror\n\nThe WebSocket implementation in a browser can provide information\
    \ on various failures in the underlying socket communication. Handling these errors\
    \ is similar to handling regular REST API errors, and might involve dispatching\
    \ an action to update the UI or closing the socket if needed.\n\nIn this example\
    \ we will stop at a generic console.log() and leave it to the reader to consider\
    \ more advanced error handling:\n\nHandling onmessage\n\n```\nWeb.onerror = (error)\
    \ =>\nconsole.log(\"WS Error\", error.data);\n```\n\n### onmessage\n\nThis callback\
    \ is called every time a new message is received over a WebSocket. If we have\
    \ built our server to be fully compatible with Redux actions, the message can\
    \ simply be dispatched to the store:\n\n### Handling onmessage\n\n```\nwebsocket.onmessage\
    \ = (event) => dispatch(JSON.parse(event.data));\n```\n\n### Handling Outgoing\
    \ Messages and Actions\n\nWith all the WebSocket callbacks handled, we need to\
    \ consider how and when to pass actions from Redux to the server:\n\n```\nreturn\
    \ action => {\n// TODO: Pass action to server\n\nnext(action);\n}\n```\n\nBefore\
    \ sending any actions, we need to make sure that the WebSocket is open and ready\
    \ for transmissions. WebSockets have a readyState that returns the current socket\
