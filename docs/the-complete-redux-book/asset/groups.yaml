    17 > Hello World!\n```\n\nThe output() function prints our message to the console.\
    \ The addTimestamp() function is a higher-order function that can take any other\
    \ function and log the time of execution. Calling addTimestamp() with output()\
    \ as the parameter creates a new \"wrapped\" function that has enhanced functionality.\
    \ It still has the signature of the original output() function but now also prints\
    \ the timestamp.\n\n## The compose()\n\nThe use of higher-order functions is very\
    \ common in Redux applications, as it allows us to easily extend the behavior\
    \ of other parts of the code. Take a look at an imaginary example where we have\
    \ to wrap our original function in three wrappers:\n\nMultiple decoration\n\n\
    ```javascript\n1 const wrapped = third(second(first(originalFn)));\n```\n\n```javascript\n\
