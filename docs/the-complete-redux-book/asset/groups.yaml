    \ = reducer(initialState, { type: ADD_RECIPE, payload: 'first' })\nn  expect(reducer(\n\
    \    deepFreeze(baseState),\n    { type: ADD_RECIPE, payload: 'test' }\n  )).toMatchSnapshot();\n\
    });\n```\n\n> ²https://github.com/substack/deep-freeze"
- md: "\n## Action Creators and Reducers\n\nWhen writing unit tests it is recommended\
    \ to test each part of the system separately and only test connections and interfaces\
    \ in the integration tests. In the case of Redux, though, it is worth considering\
    \ the connection between action creators and reducers.\n\nIn the current we've\
    \ built our tests, the ADD_RECIPE action object is defined in three different\
    \ places: the recipe's action creators, the recipe's tests, and the reducer's\
    \ tests.\n\nIf, in the future, we decide to change the structure of the ADD_RECIPE\
    \ action, our action creator will catch the change and remind us to update the\
    \ test code. But the reducer's tests will continue to pass unless we remember\
    \ to change the hardcoded ADD_RECIPE action objects used in those tests.\n\nThis\
    \ can lead to painful cases where all the tests pass, but the system doesn't work.\
    \ To avoid this, we stop using hardcoded action objects in reducers and rely on\
    \ action creators directly:\n\n```javascript\nit('should add recipe to empty list',\
    \ () => {\n  expect(reducer(initialState, addRecipe('test'))).toMatchSnapshot();\n\
    });\n\nit('should add recipe to empty list', () => {\n  const baseState = deepFreeze(reducer(initialState,\
    \ addRecipe('first')));\n  expect(reducer(baseState, addRecipe('test'))).toMatchSnapshot();\n\
    });\n```\n\nWhile repeating the unit test, combining the reducers with action\
    \ creators results in cleaner code, fewer bugs, and less duplication.\n\n## Unknown\
    \ Actions\n\nOne last issue to test with reducers is that they gracefully handle\
    \ unknown actions and return the original state passed to them without modifications.\n\
    \n> every action can propagate to the whole reducer tree, it is important for\
    \ the reducer to return the original state and not a modified copy. This will\
    \ allow UI libraries to identify changes in the tree using reference comparison.\n\
    \nWe can do this as follows:\n\n### Unknown actions test\n\n```javascript\nit('should\
    \ handle unknown actions', () => {\n  expect(reducer(initialState, { type: 'FAKE'\
    \ })).toBe(initialState);\n});\n```\n\nAn important thing to note about this test\
    \ is the use of .toBe() instead of .toEqual() or .toMatchSnapshot(). Unlike the\
    \ others, .toBe() expects the result of the reducer to be the exact same object,\
    \ not a similar object with the data:\n\n### Example of use\n\n```javascript\n\
    const a = { name: 'test' };\nconst b = { name: 'test' };\n\nit('passing test',\
    \ () => {\n  expect(a).toEqual(b);\n});\n\nit('failing test', () => {\n  expect(a).toBe(b);\n\
    });\n```\n\nThe main goal of this test is to verify that our reducer returns the\
    \ original state if the action sent was not intended:\n\n### Correct reducer code\n\
    \n```javascript\nconst reducer = (state = initialState, action) => {\n  switch(action.type)\
    \ {\n    case ADD_RECIPE: return state.concat(action.payload);\n  }\n  return\
    \ state;\n};\n```\n\n## Testing Middleware\n\nMiddleware are where the complex\
    \ logic of our application will reside. Since they have full access to the store's\
    \ dispatch() and getState() methods as well as control over actions via next(),\
    \ middleware can become quite complex with nontrivial asynchronous flows.\n\n\
    At their core middleware are functions that receive actions to process, albeit\
    \ with a complicated signature (a function, returning a function, returning a\
    \ function). The first two function calls are made by Redux during startup. Only\
    \ the last call is made dynamically, when new actions need to be processed. The\
    \ basic signature looks like this:\n\n### Middleware signature\n\n```javascript\n\
    function sampleMiddleware({ dispatch, getState }) {\n  return function nextWrapper(next)\
    \ {\n    return function innerCode(action) {\n      // TODO: Implement middleware\n\
    \      next(action);\n    }\n  }\n}\n```\n\nTo test middleware we will need to\
    \ mock dispatch(), getState(), and call sampleMiddleware() and nextWrapper() to\
    \ get our target, the innerCode() function:\n\n### Setting up middleware tests\n\
    \n```javascript\nconst next = jest.fn();\nconst dispatch = jest.fn();\nconst getState\
    \ = jest.fn();\nconst middleware = sampleMiddleware({ dispatch, getState })(next);\n\
    ```\n\nWe can now use the regular Jest tests to test the middleware function we\
    \ built by calling it with action objects:\n\n### Simple middleware test call\n\
    \n```javascript\nit('should process action', () => {\n  const next = jest.fn();\n\
    \  const dispatch = jest.fn();\n  const getState = jest.fn();\n  const middleware\
    \ = sampleMiddleware({ dispatch, getState })(next);\n  const sampleAction = {\
    \ type: 'SAMPLE_ACTION' };\n  middleware(sampleAction);\n});\n```\n\n## Chapter\
    \ 6. Tests\n\nIn the case of our simple middleware, we want to verify that it\
    \ passed the action correctly down the chain by calling next(action). Since Jest's\
    \ function mocking, we can get a full history of calls to each mock by accessing\
    \ next.mock.calls.\n\n### Verify correct calls to next\n\n```javascript\nexpect(next.mock.calls.length).toBe(1);\n\
    expect(next.mock.calls[0].length).toBe(1);\nexpect(next.mock.calls[0]).toEqual(sampleAction);\n\
    ```\n\nOur test verified that there was only one call to next(). In that call\
    \ there was one parameter passed, and that parameter was the sample action. We\
    \ could do all the tests in one by:\n\n### Combine test cases\n\n```javascript\n\
    expect(next.mock.calls).toEqual([[sampleAction]]);\n```\n\n### Simplifying The\
    \ Test Structure\n\nTo avoid duplicating the test setup before every it() clause,\
    \ we can use Jest's beforeEach() method to combine the setup in one place:\n\n\
    ### Generic setup\n\n```javascript\ndescribe(`sample middleware`, () => {\n  let\
    \ next, dispatch, getState, middleware;\n\n  beforeEach(() => {\n    next = jest.fn();\n\
    \    dispatch = jest.fn();\n    getState = jest.fn();\n    middleware = sampleMiddleware({\
    \ dispatch, getState })(next);\n  });\n\n  it('should process action', () => {\n\
    \    const sampleAction = { type: 'SAMPLE_ACTION' };\n\n    middleware(sampleAction);\n\
    \    expect(next.mock.calls).toEqual([[sampleAction]]);\n  });\n});\n```\n\nUsing\
    \ this structure, our middleware will be rebuilt before each test and all the\
    \ mocked functions will be reset, keeping the test code itself as short as possible.\n\
    \n## Testing Async Middleware\n\nFor a more complete example, let's use an API\
    \ middleware similar to the one discussed in the Server Communication Chapter:\n\
    \n### API middleware\n\n```javascript\nimport 'whatwg-fetch';\nimport { API }\
    \ from 'consts';\nimport { apiStarted, apiFinished, apiError } from 'actions/ui';\n\
    const apiMiddleware = (( dispatch }) => next => action => {\n  if (action.type\
    \ === API) {\n    return next(action);\n  }\n  const { url, success } = action.payload;\n\
    \  dispatch(apiStarted());\n  return fetch(url)\n    .then(response => response.json())\n\
    \    .then(response => {\n      dispatch(apiFinished());\n      dispatch(success(response));\n\
    \    })\n    .catch(({ status, searchText }) =>\n      dispatch(apiError(new Error({\
    \ status, searchText })));\n});\nexport default apiMiddleware;\n```\n\nOur middleware\
    \ catches any actions of the type 'API', which must contain a payload key with\
    \ a url to make a request to next() and a success parameter that holds an action\
    \ creator to call with the returned data.\n\n### Sample API action\n\n```javascript\n\
    const setData = data => ({\n  type: 'SET_DATA',\n  payload: data\n});\n\nconst\
    \ apiAction = () => ({\n  type: API,\n  payload: {\n    success: setData,\n  \
    \  url: 'fake.json'\n  }\n});\n```\n"
  mdcn: "\n\n## Action 创建器（Action Creators）与 Reducer\n\n在编写单元测试时，建议分别测试系统的每个部分，仅在集成测试中测试连接和接口。然而，在\
    \ Redux 中，考虑 action 创建器和 reducer 之间的连接是值得的。\n\n在我们目前构建的测试中，`ADD_RECIPE` action\
    \ 对象被定义在三个不同的地方：食谱的 action 创建器、食谱的测试以及 reducer 的测试。\n\n如果将来我们决定更改 `ADD_RECIPE`\
    \ action 的结构，我们的 action 创建器会捕获到变化并提醒我们更新测试代码。但除非我们记得更改这些测试中硬编码的 `ADD_RECIPE` action\
    \ 对象，否则 reducer 的测试将继续通过。\n\n这可能会导致痛苦的情况：所有测试都通过了，但系统无法工作。为了避免这种情况，我们停止在 reducer\
    \ 中使用硬编码 action 对象，而是直接依赖 action 创建器：\n\n```javascript\nit('should add recipe\
    \ to empty list', () => {\n  expect(reducer(initialState, addRecipe('test'))).toMatchSnapshot();\n\
    });\n\nit('should add recipe to empty list', () => {\n  const baseState = deepFreeze(reducer(initialState,\
    \ addRecipe('first')));\n  expect(reducer(baseState, addRecipe('test'))).toMatchSnapshot();\n\
    });\n```\n\n在重复单元测试时，将 reducer 与 action 创建器结合可以产生更整洁的代码、更少的 bug 以及更少的重复。\n\n##\
    \ 未知 action（Unknown Actions）\n\n测试 的最后一个问题是它们能够优雅地处理未知 action，并返回传递给它们的原始状态而不进行任何修改。\n\
    \n> 每个 action 都可能传播到整个 reducer 树，因此 reducer 返回原始状态而不是修改后的副本至关重要。这将允许 UI 库使用引用比较来识别树中的变化。\n\
    \n我们可以这样实现：\n\n### 未知 action 测试\n\n```javascript\nit('should handle unknown actions',\
    \ () => {\n  expect(reducer(initialState, { type: 'FAKE' })).toBe(initialState);\n\
    });\n```\n\n关于此测试需要注意的重要的一点是使用 `.toBe()` 而不是 `.toEqual()` 或 `.toMatchSnapshot()`。与其他测试不同，`.toBe()`\
    \ 期望 reducer 的结果是完全相同的对象，而不是具有相同数据的相似对象：\n\n### 使用示例\n\n```javascript\nconst a\
    \ = { name: 'test' };\nconst b = { name: 'test' };\n\nit('passing test', () =>\
    \ {\n  expect(a).toEqual(b);\n});\n\nit('failing test', () => {\n  expect(a).toBe(b);\n\
    });\n```\n\n此测试的主要目标是验证如果发送的 action 不是预期的，我们的 reducer 将会返回原始状态：\n\n### 正确的 reducer\
    \ 代码\n\n```javascript\nconst reducer = (state = initialState, action) => {\n \
    \ switch(action.type) {\n    case ADD_RECIPE: return state.concat(action.payload);\n\
    \  }\n  return state;\n};\n```\n\n## 测试中间件（Middleware）\n\n中间件是我们应用程序复杂逻辑所在的地方。由于它们完全访问\
    \ store 的 `dispatch()` 和 `getState()` 方法，并且可以通过 `next()` 控制 action，中间件在处理非平凡的异步流时可能会变得非常复杂。\n\
    \n中间件的核心是接收 action 并进行处理的函数，尽管其签名很复杂（一个返回函数的函数，再返回一个函数的函数）。前两次函数调用是由 Redux 在启动时进行的。只有最后一次调用是在处理新\
    \ action 时动态调用的。基本签名如下：\n\n### 中间件签名\n\n```javascript\nfunction sampleMiddleware({\
    \ dispatch, getState }) {\n  return function nextWrapper(next) {\n    return function\
    \ innerCode(action) {\n      // TODO: Implement middleware\n      next(action);\n\
    \    }\n  }\n}\n```\n\n为了测试中间件，我们需要 mock `dispatch()`、`getState()`，并调用 `sampleMiddleware()`\
    \ 和 `nextWrapper()` 来获取我们的目标——`innerCode()` 函数：\n\n### 设置中间件测试\n\n```javascript\n\
    const next = jest.fn();\nconst dispatch = jest.fn();\nconst getState = jest.fn();\n\
    const middleware = sampleMiddleware({ dispatch, getState })(next);\n```\n\n现在我们可以使用常规\
    \ Jest 测试，通过传入 action 对象来测试我们构建的中间件函数：\n\n### 简的中间件测试调用\n\n```javascript\nit('should\
    \ process action', () => {\n  const next = jest.fn();\n  const dispatch = jest.fn();\n\
    \  const getState = jest.fn();\n  const middleware = sampleMiddleware({ dispatch,\
    \ getState })(next);\n  const sampleAction = { type: 'SAMPLE_ACTION' };\n  middleware(sampleAction);\n\
    });\n```\n\n## 第 6 章 测试\n\n对于我们的简单中间件，我们希望通过调用 `next(action)` 来验证它是否正确将 action\
    \ 传递给链下游。由于 Jest 的函数 mock，我们可以通过访问 `next.mock.calls` 获取每个 mock 的完整调用历史。\n\n###\
    \ 验证 next 的正确调用\n\n```javascript\nexpect(next.mock.calls.length).toBe(1);\nexpect(next.mock.calls[0].length).toBe(1);\n\
    expect(next.mock.calls[0]).toEqual(sampleAction);\n```\n\n我们的测试验证了 `next()` 只被调用了一次。在该次调用中传递了一个参数，该参数就是\
    \ sample action。我们可以在一行中完成所有测试：\n\n### 合并测试用例\n\n```javascript\nexpect(next.mock.calls).toEqual([[sampleAction]]);\n\
    ```\n\n### 简化测试结构\n\n为了避免在每个 `it()` 之前重复编写测试设置，我们可以使用 Jest 的 `beforeEach()` 方法将设置合并在一个处：\n\
    \n### 通用设置\n\n```javascript\ndescribe(`sample middleware`, () => {\n  let next,\
    \ dispatch, getState, middleware;\n\n  beforeEach(() => {\n    next = jest.fn();\n\
    \    dispatch = jest.fn();\n    getState = jest.fn();\n    middleware = sampleMiddleware({\
    \ dispatch, getState })(next);\n  });\n\n  it('should process action', () => {\n\
    \    const sampleAction = { type: 'SAMPLE_ACTION' };\n\n    middleware(sampleAction);\n\
    \    expect(next.mock.calls).toEqual([[sampleAction]]);\n  });\n});\n```\n\n使用这种结构，我们的中间件会在每个测试之前重建，所有\
    \ mock 函数都被重置，保持测试代码尽可能短。\n\n## 测试异步中间件\n\n为了一个更完整的示例，让我们使用在服务器通信章节中讨论过的类似的 API\
    \ 中间件：\n\n### API 中间件\n\n```javascript\nimport 'whatwg-fetch';\nimport { API }\
    \ from 'consts';\nimport { apiStarted, apiFinished, apiError } from 'actions/ui';\n\
    const apiMiddleware = (( dispatch }) => next => action => {\n  if (action.type\
    \ === API) {\n    return next(action);\n  }\n  const { url, success } = action.payload;\n\
    \  dispatch(apiStarted());\n  return fetch(url)\n    .then(response => response.json())\n\
    \    .then(response => {\n      dispatch(apiFinished());\n      dispatch(success(response));\n\
    \    })\n    .catch(({ status, searchText }) =>\n      dispatch(apiError(new Error({\
    \ status, searchText })));\n});\nexport default apiMiddleware;\n```\n\n我们的中间件捕获所有类型为\
    \ 'API' 的 action，这些 action 必须包含一个 `payload` key，其中包含一个用于 `next()` 发请求的 `url` 以及一个用于处理返回数据的\
    \ action 创建器 `success` 参数。\n\n### 示例 API action\n\n```javascript\nconst setData\
    \ = data => ({\n  type: 'SET_DATA',\n  payload: data\n});\n\nconst apiAction =\
    \ () => ({\n  type: API,\n  payload: {\n    success: setData,\n    url: 'fake.json'\n\
