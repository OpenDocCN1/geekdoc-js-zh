    \    SUCCESS: 'FETCH_RECIPES_SUCCESS',\n    ERROR: 'FETCH_RECIPES_FAILURE'\n \
    \ }\n}\n```\n\n# Authentication\n\nA common place to store the current user's\
    \ information (such as the access token) is in Redux store. As all API logic is\
    \ now located in one place and the middleware have access to the store using the\
    \ getState() method, we can extract the accessToken from the state and set it\
    \ as a header for our server requests:\n\nSetting access token\n\n```javascript\n\
    const { accessToken } = getState();\n\nif (accessToken) {\n  // Set headers\n\
    }\n```\n\nOur server calls will now automatically get headers without us having\
    \ to worry about this in any other parts of the.\n\n# More Extensions\n\nThere\
    \ are still quite a few things missing from our API middleware to make it usable\
    \ in the real world. We need support for more verbs (not just GET), setting of\
    \ headers, timeouts, caching, and more. Much of this can be done by taking data\
    \ from the action object or from the store. A robust API middleware solution is\
    \ already available as [redux-middleware](https://github.com/agraboso/redux-middleware).\n\
    \n68\n\n# Chaining APIs\n\nSometimes fetching data from a server requires a number\
