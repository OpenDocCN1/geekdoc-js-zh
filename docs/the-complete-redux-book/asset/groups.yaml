  - '[PAGE 156]


    ![](img/fbb45cbd9118f0a7f1feb2a04f50e708_156_0.png)


    The main reason reference comparison is used is that this method ensures that
    each reference to the previous state is kept coherent. We can examine it at any
    time and get the state exactly as it was before a change. We create an array and
    push the current state into before running actions, we will be able to pick any
    of the pointers to the previous state in the array and see the state tree exactly
    as it was before all the subsequent actions happened. And no matter how many more
    actions we process, our original pointers stay exactly as they were.


    This might sound similar to copying the state each time before changing it, but
    the reference system will not require 10 times the memory for 10 states. It will
    smartly reuse all the unchanged nodes. Consider the next illustration, where two
    different actions have been run on the state, and how the three trees look afterward.'
  - '[PAGE 157]


    Chapter 9. Reducers


    152


    ![](img/fbb45cbd9118f0a7f1feb2a04f50e708_157_0.png)


    Example of saving references


    The first action added a new node, C3, under B1. If we look closely we can see
    that the reducer didn''t change anything in the original A tree. It only created
    a new A'' object that holds B2 and a new B'' that holds the original C1 and C2
    and the new C3''. At this point we can still use the A tree and access to all
    the nodes like were before. What''s more, the new A'' tree didn''t copy the old
    one, but created some new links that allow efficient memory reuse.


    The next action modified the B2 subtree. The only change is a new A'' root object
    that points to the previous B1'' and the new B2''. The old states of A and A''
    are still intact and memory is reused over all three trees.


    Since we have a coherent version of each previous state, we can implement nifty
    features like undo and redo (we simply save the previous state in an array, and
    in the case of "undo," make it the current one). We can also implement more advanced
    features like "time travel," where we can easily jump between versions of our
    state for debugging.


    # What Is Immutability?


    The ideas we discussed are the root of the concept of immutability. If you are
    familiar with immutability in JavaScript, feel free to skip the remainder of this
    discussion and proceed to the "Ensuring Immutability" section.


    Let''s define what the word mutation means. In JavaScript, there are two types
    of variables: ones that are copied by value, and ones that are passed by reference.
    Primitive values such as numbers, strings, and booleans are copied when you assign
    them to other variables, and a change to the target variable will not affect the
    source:'
  - '[PAGE 158]


    # Chapter 9. Reducers


    Primitive values example


    ```

    let string = "Hello";nlet copiedString = string;

    copiedString += " World!";

    console.log(string); // => "Hello"

    console.log(copiedString); // => "Hello World!

    ```


    In contrast, collections in JavaScript are not copied when you assign them; they
    only receive a pointer to the location in memory of the object pointed to by the
    source variable. This means that any change to the new variable will modify the
    same memory location, which is pointed to by both the old and new variables:


    # Collections example


    ```

    const object = {};nconst referencedObject = object;

    referencedObject.number = 42;

    console.log(object); // => { number: 42 }

    console.log(referencedObject); // => { number: 42 }

    ```


    As you see, the original object is changed when we change the copy. We used const
    here to emphasize that a constant in JavaScript holds only a pointer to the object,
    not its value, and no error will be thrown if you change the properties of the
    object (or the contents of an array). This is also true for collections passed
    as arguments to functions, as what is passed is the reference and not the value
    itself.


    Lucky for us, ES2016 lets us avoid mutations collections in a much cleaner way
    than before, thanks to the Object.assign() method and the spread operator.


    > The spread operator is fully supported by the ES2016 standard. More information
    is available on MDN³.'
