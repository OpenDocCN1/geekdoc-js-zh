  - "[PAGE 67]\n\n# Action with custom status handling\n\n```\n{\n  type: 'API',\n\
    \  payload: {\n    url: 'recipes',\n    PENDING: 'RECIPES_PENDING',\n    SUCCESS:\
    \ 'RECIPES_SUCCESS',\n    ERROR: 'RECIPES_ERROR'\n  }\n}\n```\n\n# Authentication\n\
    \nA common place to store the current user's information (such as the access token)\
    \ is in the Redux store. As all our API logic is now located in one place and\
    \ the middleware have full access to the store using the getState() method, we\
    \ can extract the accessToken from the state and set it as a header for our server\
    \ requests:\n\nSetting access token\n\n```\nconst { accessToken } = getState().currentUser;\n\
    \n```javascript\nif (accessToken) {\n  // Set headers\n}\n``````\n```\n\nOur server\
    \ calls will now automatically get the correct headers without us having to worry\
    \ about this in any other parts of our application.\n\n# More Extensions\n\nThere\
    \ are still quite a few things missing from our API middleware to make it usable\
    \ in the real world. We need support for more verbs (not just GET), setting of\
    \ custom headers, timeouts, caching, and more. Much of this can be done by taking\
    \ data from the action object or from the store itself. A robust API middleware\
    \ solution is already available as (redux-api-middleware](https://github.com/agraboso/redux-api-middleware)."
  - "[PAGE 68]\n\n# Chaining APIs\n\nSometimes fetching data from a server requires\
    \ a number of different calls—for instance, when the returned data from one is\
    \ needed to issue additional calls. A simple example might be fetching the current\
    \ user and the user's profile. If we were to use promises in an action creator,\
    \ the solution would appear to quite straightforward:\n\nChaining promises\n\n\
    ```\nconst fetchCurrentUser = () => (dispatch) => fetch(`user`)\n  .then(response\
    \ => response.json())\n  .then(userData => {\n    dispatch(setUserData(userData));\n\
    \    \n    // Get user's profile\n    fetch(`profile/${userData.profileid}`)\\\
    n      .then(response => response.json())\n      .then(profileData => dispatch(setProfileData(profileData)));\n\
    \  });\n```\n\nScary stuff there. There are a few issues with this code:\n\n+\
    \   - Error handling – Exact branching and catching of errors is not obvious and\
    \ can become complex as the chain grows.\n- Debugging – It is hard to debug and\
    \ understand what stage in the chain we are at.\n- Cancellation and recovery –\
    \ It is nearly impossible to cancel or abort the chain if the user navigates to\
    \ a different part of the UI and the current request is no longer needed.\n\n\
    We can see, chaining promises is not an ideal solution. When working with Redux\
    \ we have two alternatives to use, middleware and sagas.\n\n# Using Middleware\
    \ for Flow\n\nIn the middleware approach, we split the code handling server access\
    \ and logic flow. Our API middleware stays the same, and we only need to find\
    \ another place to put the logic flow. One approach, discussed in the Middleware\
    \ Chapter, is to create additional middleware to handle flow management:"
- md: "\n## Chapter 4. Server Communication\n\nSample middleware to handle user flow\n\
    \n```javascript\nconst userFlowMiddleware = ({ dispatch }) => next => action =>\
    \ {\n  switch (action.type) {\n    case FETCH_CURRENT_USER:\n      dispatch(fetchCurrentUser());\n\
    \      break;\n    case SET_CURRENT_USER:\n      dispatch(fetchProfile(action.payload.userId));\n\
    \      break;\n  }\n\n  return next(action);\n}\n```\n\nUnfortunately, this approach\
    \ has its problems too. This setup will cause the fetchProfile() action to be\
    \ dispatched every time someone dispatches SET_CURRENT_USER. There might be a\
    \ flow where we don't need the fetch but can't prevent the middleware from scheduling\
    \ it.\n\nWe can solve this by creating a special action flow that has similar\
    \ behavior to fetchCurrentUser() but also triggers the fetchProfile() action.\
    \ This can be done by creating a new action creator and action:\n\n### Handle\
    \ fetch fetch with custom action\n\n```javascript\nconst fetchCurrentUser = (next\
    \ = SET_CURRENT_USER) => ({\n  type: API,\n  url: 'user',\n  next\n});\n\nconst\
    \ userFlowMiddleware = ({ dispatch }) => next => action => {\n  switch (action.type)\
    \ {\n    case FETCH_CURRENT_USER:\n      dispatch(fetchCurrentUser(SPECIAL_SET_CURRENT_USER));\n\
    \      break;\n\n    case SPECIAL_SET_CURRENT_USER:\n      dispatch(setCurrentUser(action.payload));\n\
    \      dispatch(fetchProfile(action.payload.userId));\n      break;\n  }\n  next(action);\n\
    }\n```\n\nThis approach requires changing our actor creators in a somewhat unclear\
