    \ basic example of saga usage and does not handle error or allows to cancel requests\
    \ of flows. For more information on sagas, consult the extensive documentation\
    \ at the official redux-saga documentation site².\n\n### Canceling API Requests\n\
    \nDuring the app's flow we might issue a number of long requests that we need\
    \ to cancel (e.g., when the user navigates to a different page of the app). Some\
    \ promise implementations support this feature, but it is also quite doable with\
    \ the API middleware approach.\n\nTo allow canceling we need to give a unique\
    \ ID to each request being sent and keep it for the cancellation phase. This will\
    \ require us to add ID support to our action creators:\n\n### Action creator with\
    \ ID support\n\n```javascript\nconst fetchUser = (id, cancelable) => ({\n  type:\
    \ API,\n  url: `user/${id}`,\n  next: cancelable\n});\n```\n\nconst actionID =\
    \ uuid.generate();\ndispatch(fetchUser(id, actionID));\n\nTo allow canceling we\
    \ need to give a unique ID to each request being sent and keep it for the cancellation\
    \ phase. This will require us to add ID support to our action creators:\n\n###\
    \ Action with ID support\n\n```javascript\nconst fetchUser = (id, cancelable)\
    \ => ({\n  type: API,\n  url: `user/${id}`,\n  next: cancelable\n});\n```\n\n\
    (Note: The OCR text was highly repetitive at the end; I have provided the cleaned\
    \ logic based on the unique segments provided.)\n\n### API middleware with support\
    \ \n\n```javascript\nconst canceled = {};\nconst apiMiddleware = ({ dispatch })\
    \ => next => action => {\n  const handleResponse = (data) => {\n    if (action.cancelable\
    \ && canceled[action.id]) {\n      return;\n    }\n    dispatch({ type: action.next,\
    \ data });\n  }\n\n  switch (action.type) {\n    case API:\n      fetch(BASE_URL\
    \ + action.url)\n        .then(response => response.json())\n        .then(handleResponse)\n\
    \      return;\n    case CANCEL_API:\n      canceled[action.id] = true;\n    \
    \  setTimeout(() => delete canceled[action.id], 5000);\n  }\n  return next(action);\n\
    };\n```\n\n### Summary\n\nIn this chapter we have learned how to set up a comprehensive\
    \ mechanism for server communication. We have used Redux's concept of middleware\
    \ to move most of the complicated and asynchronous logic away from action creators\
    \ and created a single place where error handling, caching, and other aspects\
    \ of server requests can be concentrated.\n\nIn the next chapter we will cover\
    \ WebSocket communication and how well it can work with the.\n\n## Chapter 5.\
    \ WebSockets\n\nWebSockets have brought a robust socket communication method directly\
    \ into our browsers. What started as a solution for polling data changes on the\
    \ server is slowly taking over more and more responsibilities from traditional\
    \ endpoints. The action-based architecture of Redux makes working with WebSockets\
    \ exceptionally easy and natural, as it involves using WebSockets as a pipe to\
    \ pass actions to and from the server.\n\n### Basic Architecture\n\nWebSockets\
    \ allow us to open a connection to a server and send or receive messages in a\
    \ fully asynchronous way. The native implementation in browsers has only four\
    \ callback methods that are required to fully support WebSockets:\n\n- onopen:\
    \ A connection has become.\n- onclose: A connection has been closed.\n- onerror:\
    \ An error related to WebSocket communication has been raised.\n- onmessage: A\
    \ new message has been received.\n\nWhile multiple WebSockets might be used, most\
    \ applications will require a single or at most a few connections for different\
    \ servers based on function (chat server, notifications server, etc.).\n\nTo start,\
    \ we will build a system to communicate with a single WebSocket, which can later\
    \ be extended for multi-WebSocket support.\n\n### Redux Link\n\nThe Redux architecture\
    \ is all about sending well-defined messages to the store. This general scheme\
    \ can work perfectly for server communication over WebSockets. The same structure\
    \ of plain objects with the type property can be sent to the server, and we can\
    \ receive a similarly structured response back:\n"
