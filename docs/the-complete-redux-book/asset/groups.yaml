- md: "\nTo make sure our reducer updates the state, we first verify that our initial\
    \ recipes list is empty and check that it was changed to contain the server-returned\
    \ data after the fetchRecipes() action completed.\n\n## Integration Tests Summary\n\
    \nAs can be seen from this simple test, doing integration tests in Redux is usually\
    \ fairly straightforward. Since everything is driven by actions, in most cases\
    \ our integration tests will follow the four steps outlined above: we verify the\
    \ initial state of the system, mock any external dependencies, dispatch an action,\
    \ and verify that the state has changed and any external APIs were called as expected.\n\
    \n## Summary\n\nIn this chapter we have discussed in detail various methods of\
    \ testing Redux using the Jest library. Given the clear division of responsibilities\
    \ in Redux and in keeping with its plain JavaScript objects and idempotent functions,\
    \ most unit tests (and integration tests) are short and simple to write.\n\nThis\
    \ is in turn means that we, as developers, can minimize the time we spend writing\
    \ tests and still have a comprehensive and understandable testing suite.\n\nThis\
    \ is the last chapter in the “Real World” part of this book. In the next part,\
    \ “Advanced Redux,” we will delve deeper into each of Redux’s actors and learn\
    \ advanced methods for organizing and managing our code.\n\n## Part 3. Advanced\
    \ Concepts\n\n## Chapter 7. The Store\n\nIn contrast to other Flux implementations,\
    \ in Redux there is a single store that holds all of the application state in\
    \ one object. The store is also responsible for changing the state when something\
    \ happens in our application. In fact, we could say that Redux is the store. When\
    \ we talk about accessing the state, dispatching an action, or listening to state\
    \ changes, it is the store that is responsible for all of it.\n\n> Sometimes the\
    \ concern is raised storing the whole state in one huge JavaScript object might\
    \ be wasteful. But since objects are reference-type and the value is just an object\
    \ holding a reference to other objects, it doesn't have any memory implications;\
    \ it is the same as storing objects in different variables.\n\n## Creating a Store\n\
    \nTo create the store we use the createStore() factory function exported by Redux.\
    \ It accepts three arguments: a mandatory reducer function, an optional initial\
    \ state, and an optional state enhancer. We will cover state enhancers in this\
    \ chapter and start by creating a basic store with a dummy reducer that ignores\
    \ actions and returns the state as it is:\n\nSample store\n\n```javascript\nimport\
    \ { createStore } from 'redux';\nconst initialState = {\n  recipes: [],\n  ingredients:\
    \ []\n}\nconst reducer = (state, action) => state;\nconst store = createStore(initialState);\n\
    ```\n\n> The initialState parameter is optional, and usually we delegate the task\
    \ of building an initial state to reducers, as described in the Redux Chapter.\
    \ However, it is still useful when you want to load the initial state from the\
    \ server to speed up page load times. State management is covered extensively\
    \ in the State Management Chapter.\n\nThe simple store that we have just created\
    \ has five methods that allow us to access, change, and observe the state. Let's\
    \ examine each of them.\n\n## Accessing the State\n\nThe `getState()` method returns\
    \ the reference to the current state:\n\nGet current state from getState():\n\n\
    ```javascript\nstore.getState();\n// => { recipes: [], ingredients: [] }\n```\n\
    \n## Changing the State\n\nRedux does not allow external changes to the state.\
    \ Using the state object received from getState() and changing values directly\
    \ is prohibited. The only way to cause a change of the state is by passing actions\
    \ to the reducer function. Actions are sent to the reducer and the result is used\
    \ as the new global state.\n\nSending actions to reducers is done via the store\
    \ using the store's `dispatch()` method, which accepts a single argument, the\
    \ action object:\n\nDispatch action to store\n\n```javascript\nconst action =\
    \ { type: 'ADD_RECIPE', ... };\nstore.dispatch(action);\n```\n\nNow we can rewrite\
    \ our reducer to make it create an updated state for actions of type 'ADD_RECIPE'\
    \ and return the current state otherwise:\n\nSample reducer code\n\n```javascript\n\
    const reducer = (state, action) => {\n  switch (action.type) {\n    case 'ADD_RECIPE':\n\
    \      return Object.assign(...);\n    default:\n      return state;\n  }\n};\n\
    ```\n\n## Listening to Updates\n\nNow that we know how the store updates the state,\
    \ we need a way to update the UI or other parts of our application when the state\
    \ changes. The store allows us to subscribe to state changes using the subscribe()\
    \ method. It accepts a callback function, which will be executed after every action\
    \ has been dispatched:\n\n## Chapter 7. The Store\n\n### The subscribe method\n\
    \n```javascript\nconst store = createStore((state) => state);\nconst onStoreChange\
    \ = () => console.log(store.getState());\nstore.subscribe(onStoreChange);\n```\n\
    \n> The subscribed callback does not get any arguments, and we need to access\
    \ the state. We, must call store.getState() ourselves.\n\nThe value of the subscribe()\
    \ method is a function that can be used to unsubscribe from the store. It is important\
    \ to remember to call unsubscribe() for all subscriptions to prevent memory leaks:\n\
    \nUnsubscribing from store updates\n\n```javascript\nconst unsubscribe = store.subscribe(onStoreChange);\n\
    // When the subscription is no longer needed\nunsubscribe();\n```\n\n## Replacing\
    \ the Reducer\n\nWhen creating the Redux store, a reducer function (often referred\
    \ to as the root reducer) is passed as the first parameter to createStore(). During\
    \ runtime we can use the store's replaceReducer() to replace this function. Usually\
    \ this method is used in development to allow hot replacement of reducers. In\
    \ complex applications it might be used to dynamically replace reducers.\n\n>\
    \ If your application is too large to bundle into a single file or if you want\
    \ to gain extra performance, you use a technique called code splitting—separating\
    \ the production bundle into multiple files and loading them on demand when the\
    \ user performs some interaction. Hot reloading tools are outside the scope of\
    \ this book, but you might want to know that code splitting can be applied to\
    \ the Redux store, thanks to the replaceReducer() method.\n\nLet's look at a simple\
    \ example with some functionality available for authenticated users. Initial load,\
    \ our store will only handle the substate:\n\n## Chapter 7. The Store\n\n### Basic\
    \ reducer setup\n\n```javascript\nimport { combineReducers } from 'redux';\nimport\
    \ { currentUser } from 'reducers/current-user';\nconst reducer = (state, action)\
    \ => combineReducers({ currentUser });\nconst store = createStore(reducer);\n\
    ```\n\nIf combineReducers() looks unfamiliar to you, take a look at Chapter 9\
    \ to learn about this technique. For now, let's assume the functions inside are\
    \ handling currentUser state. After the user signs in, we load the new functionality.\
    \ We need to make our store aware of the new subset of our application state and\
    \ the function that should handle it. Here is the replaceReducer() method in handy:\n\
    \n## Replacing the root reducer\n\n```javascript\nconst newReducer = (state, action)\
    \ => combineReducers({ currentUser, recipes });\nstore.replaceReducer(newReducer);\n\
    ```\n\nKeep in mind that when you replaceReducer(), Redux automatically calls\
    \ the initial action it calls when the new reducer automatically gets and the\
    \ new state is immediately available via the store.getState() method. For the\
    \ initial action, see Chapter 9.\n\nThe same technique can be used by development\
    \ tools to implement the hot reloading mechanism for a better developer experience.\
    \ Hot reloading is a concept where source code changes don't cause a full page\
    \ reload, but rather the affected code is swapped in place by special software\
    \ and the application as whole is kept in the state that it was before the code\
    \ change.\n\n## Store as Observable\n\nStarting from version 3.5.0, Redux store\
    \ can also act as an Observable. This allows libraries like RxJS to subscribe\
    \ to the store's state changes. This subscription method is different from the\
    \ regular subscribe() method of the store: when subscribing to the store as an\
    \ observable, the latest state is passed without the need to call store.getState().\n\
    \n> To support older browsers, Redux uses the symbol-observable² polyfill when\
    \ Symbol.observable is not supported.\n\n²https://github.com/bleish/symbol-observable\n"
  mdcn: "\n\n为了确保我们的 reducer 更新了状态，我们首先验证初始配方列表为空，并检查在 `fetchRecipes()` action 完成后，它已更改为包含服务器返回的数据。\n\
    \n## 集成测试总结\n\n从这个简单的测试可以看出，在 Redux 中进行集成测试通常非常直观。由于一切都是由 action 驱动的，在大多数情况下，我们的集成测试将遵循上述的四个步骤：验证系统的初始状态、模拟（mock）任何外部依赖、分发（dispatch）一个\
    \ action，并验证状态已改变以及任何外部 API 是否按预期调用。\n\n## 总结\n\n在本章中，我们详细讨论了使用 Jest 库测试 Redux\
    \ 的各种方法。鉴于 Redux 清晰的职责分工，并保持其纯 JavaScript 对象和幂等函数的特性，大多数单元测试（以及集成测试）写起来都短小且简单。\n\
    \n这意味着我们作为开发者，可以度地减少花费在编写测试上的时间，同时拥有一套全面且易于理解的测试套件。\n\n这是本书“真实世界”部分的最后一个章节。在下一部分“高级\
    \ Redux”中，我们将深入探讨 Redux 的每个执行者，并学习组织和管理代码的高级方法。\n\n## 第3部分 高级概念\n\n## 第7章 Store（存储器）\n\
    \n与其他 Flux 的实现不同，Redux 中有一个单一的 store，将所有的应用程序状态存储在一个对象中。store 还负责在我们的应用程序发生某些变化时更改状态。事实上，我们可以说\
    \ Redux 本身就是 store。当我们谈论访问状态、分发 action 或监听状态变化时，都是 store 在负责所有这一切。\n\n> 有时会产生一种疑虑，将整个状态存储在一个巨大的\
    \ JavaScript 对象中可能是浪费的。但由于对象是引用类型，且值只是一个持有其他对象引用的对象，因此不会产生任何内存影响；这与在不同的变量中存储对象是一样的。\n\
    \n## 创建 Store\n\n要创建 store，我们使用 Redux 导出的 `createStore()` 工厂函数。它接受三个参数：一个强制性的\
    \ reducer 函数、一个可选的初始状态以及一个可选的状态增强器（state enhancer）。我们将在本章中介绍状态增强器，并从创建一个带有 dummy\
    \ reducer 的基础 store 开始，它会忽略 action 并按样返回状态：\n\n示例 store\n\n```javascript\nimport\
    \ { createStore } from 'redux';\nconst initialState = {\n  recipes: [],\n  ingredients:\
    \ []\n}\nconst reducer = (state, action) => state;\nconst store = createStore(initialState);\n\
    ```\n\n> `initialState` 参数是可选的，通常我们将构建初始状态的任务委托给 reducers，正如 Redux 章节中描述的那样。然而，当你想要从服务器加载初始状态以加快页面加载速度时，它仍然很有用。状态管理将在“状态管理”章节中进行广泛介绍。\n\
    \n我们刚刚创建的简单 store 拥有五个方法，允许我们访问、更改和观察状态。让我们检查每一个方法。\n\n## 访问状态\n\n`getState()`\
    \ 方法返回当前状态的引用：\n\n从 `getState()` 获取当前状态：\n\n```javascript\nstore.getState();\n\
    // => { recipes: [], ingredients: [] }\n```\n\n## 更改状态\n\nRedux 不允许从外部更改状态。禁止直接使用从\
    \ `getState()` 接收到的状态对象并修改值。导致状态改变的唯一方法是通过向 reducer 函数传递 actions。actions 被发送到\
    \ reducer，其结果将用用作新的全局状态。\n\n向 reducer 发送 action 是通过 store 的 `dispatch()` 方法完成的，该方法接受一个参数，即\
    \ action 对象：\n\n向 store 分发 action\n\n```javascript\nconst action = { type: 'ADD_RECIPE',\
    \ ... };\nstore.dispatch(action);\n```\n\n现在我们可以重写 reducer，使其为类型为 'ADD_RECIPE'\
    \ 的 action 创建一个更新后的状态，在其他情况下返回当前状态：\n\n示例 reducer 代码\n\n```javascript\nconst reducer\
    \ = (state, action) => {\n  switch (action.type) {\n    case 'ADD_RECIPE':\n \
    \     return Object.assign(...);\n    default:\n      return state;\n  }\n};\n\
    ```\n\n## 监听更新\n\n现在我们已经知道了 store 如何更新状态，我们需要一种方法在状态更改时更新 UI 或我们应用程序的其他部分。store\
    \ 允许我们使用 `subscribe()` 方法订阅状态变化。它接受一个回调函数，该回调会在每个 action 被分发后执行：\n\n## 第7章 Store\n\
    \n### subscribe 方法\n\n```javascript\nconst store = createStore((state) => state);\n\
