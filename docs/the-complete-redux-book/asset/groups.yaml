- md: "\n## Our First Application\n\nTo learn how to use different parts of Redux,\
    \ we will be building a Recipe Book application. It will allow adding recipes\
    \ and ingredients for each recipe, and will fetch an initial recipe list from\
    \ a remote server. In accordance with Redux principles, the application will keep\
    \ all its state in our global store, including some parts of the UI.\n\nThe first\
    \ step with Redux-based app is to plan how data will be arranged in the store.\
    \ Our recipe object will start out holding only the recipe's name (we will add\
    \ more fields as needed). To store the current list, we can use a regular array:\n\
    \n### Simple state\n\n```javascript\nrecipes = [\n  { name: 'Omelette' },\n  ...\n\
    ];\n```\n\nIngredients for each recipe will contain a name and a quantity. Connecting\
    \ them to the state will be a bigger challenge. There are three general approaches\
    \ to make this connection.\n\nThe nested objects approach is to hold the ingredients\
    \ as an array inside a recipe itself:\n\n### Nested objects state\n\n```javascript\n\
    state = {\n  recipes: [\n    {\n      name: 'omelette',\n      ingredients: [\n\
    \        {\n          name: 'eggs',\n          quantity: 2\n        }\n      ]\n\
    \    },\n    ...\n  ]\n};\n```\n\nThe nested reference approach is to store the\
    \ recipe ingredient information directly in the state and hold an array of \"\
    recipe ingredient IDs\" in each recipe:\n\n### Nested reference state\n\n```javascript\n\
    state = {\n  recipes: [\n    {\n      name: 'omelette',\n      ingredients: [2,\
    \ 3]\n    },\n    ingredients: {\n      name: 'eggs',\n      quantity: 2\n   \
    \ },\n    3: {\n      name: 'milk',\n      quantity: 1\n    }\n  }\n};\n```\n\n\
    The separate object approach is to store the ingredients as a standalone array\
    \ in the state, and put the ID of the recipe array is connected to inside of it:\n\
    \n### Separate objects state\n\n```javascript\nstate = {\n  recipes: [\n    {\n\
    \      id: 10,\n      name: 'omelette'\n    },\n    ingredients: [\n    {\n  \
    \    recipe_id: 10,\n      name: 'eggs',\n      quantity: 2\n    },\n    {\n \
    \     recipe_id: 10,\n      name: 'milk',\n      quantity: 1\n    }\n  ]\n};\n\
    ```\n\nChapter 2. Your First Redux Application\n\nWhile all the approaches have\
    \ their upsides and downsides, we will quickly discover in Redux, keeping the\
    \ structure as flat and normalized as possible (as in the second and third Examples\
    \ shown here) makes the code cleaner and simpler. The state's structure implies\
    \ the use of two separate reducers for recipes and ingredients. We process both\
    \ independently.\n\nThe biggest difference between the second and third options\
    \ is how the link is made (who holds the ID of whom). In the second example, adding\
    \ an ingredient will require an update in two different parts of the state—in\
    \ both the recipes and ingredients subtrees—while in the third approach, we can\
    \ always update one part of the tree. In this example we will use this method.\n\
    \n> The subject of state management is covered in detail in the State Management\
    \ Chapter Part 2.\n\n## Setting Up the Store\n\nWe will start by creating the\
    \ store. In Redux there is only one store, which is created and initialized by\
    \ the createStore() method. Let's open our index.js file and create the store:\n\
    \n### Creating the Redux store\n\n```javascript\n1 import { createStore } from\
    \ 'redux';\n3 const reducer = (state, action) => state;\n4 const store = createStore(reducer);\n\
    ```\n\nThe createStore() function can receive a number of parameters, while with\
    \ only one being required—in our example, the reducer returns the same state regardless\
    \ of the action.\n\nTo make things more interesting, we can provide a default\
    \ state to the store. This is useful when learning, but the real use of this feature\
    \ is mainly with server rendering, where you precalculate the state of the application\
    \ on the server and then can create the store with the precalculated state on\
    \ the client.\n\nChapter 2. Your First Redux Application\n\n### Create store with\
    \ an initial state\n\n```javascript\nconst initialState = {\n  recipes: [\n  \
    \  {\n      name: 'Omelette'\n    }\n  ],\n  ingredients: [\n    {\n      recipe:\
    \ 'Omelette',\n      name: 'Egg',\n      quantity: 2\n    }\n  ]\n};\nconst reducer\
    \ = (state, action) => state;\nconst store = createStore(reducer, initialState);\n\
    window.store = store;\n```\n\nIn the last line we make the store globally by putting\
    \ it on the window object. If we go to the JavaScript code, we can now try playing\
    \ with it:\n\n### Trying out the APIs in the console\n\n```javascript\nstore.getState();\n\
    // Object {recipes: Array[1], ingredients: Array[1]}\nstore.subscribe(() => console.log(\"\
    Store changed\"));\nstore.dispatch({ type: 'ACTION' });\n// Store changed\n```\n\
    \nAs you can see, we use the store to access the current state using getState(),\
    \ subscribe to get notifications on store changes using subscribe(), and send\
    \ actions using dispatch().\n\n## Adding Recipes\n\nTo implement adding recipes,\
    \ we need to find a way to modify our store. As we learned in the previous chapter,\
    \ store modifications can only be done in response to actions. This means we need\
    \ to define an action structure and modify our (very lean) reducer to support\
    \ it.\n\nChapter 2. Your First Redux Application\n\nActions in Redux are nothing\
    \ more than plain objects that have a mandatory type property. We will be using\
    \ strings to name our actions, the most appropriate in this case being 'ADD_RECIPE'.\
    \ Since a recipe has a name, we will add it to the action's data when dispatching:\n\
    \n### Dispatching a Redux object\n\n```javascript\nstore.dispatch({ type: 'ADD_RECIPE',\
    \ name: 'Pancake' });\n```\n\nLet's modify our reducer to support the new action.\
    \ A simple approach might appear to be the following:\n\n### Reducer supports\
    \ ADD_RECIPE =>\n\n```javascript\nconst reducer = (state, action) => {\n  switch\
    \ (action.type) {\n    case 'ADD_RECIPE':\n      state.recipes.push({ name: action.name\
    \ });\n    }\n  return state;\n};\n```\n\nWhile this looks correct (and works\
    \ when tested in our simple example), this violates the basic Redux principle\
    \ of store immutability. Our reducers must never change the state, but only create\
    \ a new copy of it, with any modifications made. Thus, our reducer code needs\
    \ to be modified:\n\n### Correct way to build a reducer\n\n```javascript\nconst\
    \ reducer = (state, action) => {\n  switch (action.type) {\n    case 'ADD_RECIPE':\n\
    \      return Object.assign({}, state, {\n        recipes: state.recipes.concat({\
    \ name: action.name })\n      });\n  }\n  return state;\n};\n```\n\nThe 'ADD_RECIPE'\
    \ case has become more complex but works as expected. We are using the Object.assign()\
    \ method Object.assign({}, state, { key: value }) to create a new object that\
    \ has all the key/value pairs from our old state, but overrides the recipes with\
    \ a new value. To calculate the list of new recipes we use concat() instead of\
    \ push(), as push() modifies the original array while concat() creates a new array\
    \ containing the original values and the new one.\n\nMore information about the\
    \ Object.assign() method is available in the Reducers Chapter.\n\n## Adding Ingredients\n\
    \nSimilar to adding recipes, this step will require us to modify the reducer again\
    \ to add support for adding ingredients:\n\n### Adding ADD_INGREENT to the reducer\n\
    \n```javascript\nconst reducer = (state, action) => {\n  switch (action.type)\
    \ {\n    case 'ADD_RECIPE':\n      return Object.assign({}, state, {\n       \
    \ recipes: state.recipes.concat({ name: action.name })\n      });\n    case 'ADD_INGREDIENT':\n\
    \      const newIngredient = {\n        name: action.name,\n        recipe: action.recipe,\n\
    \        quantity: action.quantity\n      };\n      return Object.assign({}, state,\
    \ {\n        ingredients: state.ingredients.concat(newIngredient)\n      });\n\
    \  }\n  return state;\n}\n```\n\nOne problem you might encounter while dispatching\
    \ actions from the console to test the store is that it's hard to remember the\
    \ properties that need to be passed in the action object. Among other reasons,\
    \ is why in Redux we use the concept of action creators: functions that create\
    \ the action object.\n\n### A function to create the action object\n\n```javascript\n\
    const addIngredient = (recipe, name, quantity) => ({\n  type: 'ADD_INGREDIENT',\
    \ recipe, name, quantity\n});\n```\n\n```javascript\nstore.dispatch(addIngredient('Omelette',\
    \ 'Eggs', 3));\n```\n\nThis function hides the structure of the action from the\
    \ user and allows us to modify the action, setting default values for properties,\
    \ performing cleanup, trimming names, and so on.\n"
  mdcn: "\n\n## 我们的第一个应用\n\n为了学习如何使用 Redux 的不同部分，我们将构建一个食谱应用。它将允许为每个食谱添加食谱和配料，并从远程服务器获取初始食谱列表。根据\
    \ Redux 原则，应用程序将所有状态都保存在我们的全局 store（仓库）中，包括 UI 的某些部分。\n\n基于 Redux 的应用的第一步是规划数据如何在\
    \ store 中排列。我们的食谱对象最初将只包含食谱名称（我们将根据需要添加更多字段）。为了存储当前列表，我们可以使用普通数组：\n\n### 简单状态\n\
    \n```javascript\nrecipes = [\n  { name: 'Omelette' },\n  ...\n];\n```\n\n每个食谱的配料将包含名称和数量。将它们连接到状态将是一个更大的挑战。通常有三种方法来实现这种连接。\n\
    \n嵌套对象方法是将配料作为数组存储在食谱内部：\n\n### 嵌套对象状态\n\n```javascript\nstate = {\n  recipes:\
    \ [\n    {\n      name: 'omelette',\n      ingredients: [\n        {\n       \
    \   name: 'eggs',\n          quantity: 2\n        }\n      ]\n    },\n    ...\n\
    \  ]\n};\n```\n\n嵌套引用方法是将食谱配料信息直接存储在状态中，并在每个食谱保留一个“食谱配料 ID”数组：\n\n### 嵌套引用状态\n\
    \n```javascript\nstate = {\n  recipes: [\n    {\n      name: 'omelette',\n   \
    \   ingredients: [2, 3]\n    },\n    ingredients: {\n      name: 'eggs',\n   \
    \   quantity: 2\n    },\n    3: {\n      name: 'milk',\n      quantity: 1\n  \
    \  }\n  }\n};\n```\n\n独立对象方法是将配料作为独立的数组存储在状态中，并将食谱数组的 ID 连接到其内部：\n\n### 独立对象状态\n\
    \n```javascript\nstate = {\n  recipes: [\n    {\n      id: 10,\n      name: 'omelette'\n\
    \    },\n    ingredients: [\n    {\n      recipe_id: 10,\n      name: 'eggs',\n\
    \      quantity: 2\n    },\n    {\n      recipe_id: 10,\n      name: 'milk',\n\
    \      quantity: 1\n    }\n  ]\n};\n```\n\n第 2 章. 你的第一个 Redux 应用\n\n虽然所有方法都有优缺点，但我们在\
    \ Redux 中会很快发现，将结构保持尽可能扁平化和规范化（此处所示的第二个和第三个示例）会让代码更整洁、简单。状态的结构意味着为食谱和配料使用两个独立的\
    \ reducer（还原器）。我们独立地处理两者。\n\n第二和第三种方案之间的最大区别在于连接是如何建立的（谁持有谁的 ID）。在第二个示例中，添加配料将需要更新状态的两个不同部分——在\
    \ recipes 和 ingredients 子树中——而在第三种方法中，我们始终可以更新树的一个部分。在这个示例中，我们将使用这种方法。\n\n> 状态管理主题将在“状态管理章节”第\
    \ 2 部分中详细介绍。\n\n## 设置 Store\n\n我们将从创建 store 开始。在 Redux 中，只有一个 store，它通过 `createStore()`\
    \ 方法创建并初始化。让我们打开 `index.js` 文件并创建 store：\n\n### 创建 Redux store\n\n```javascript\n\
    1 import { createStore } from 'redux';\n3 const reducer = (state, action) => state;\n\
    4 const store = createStore(reducer);\n```\n\n`createStore()` 函数可以接收多个参数，其中唯一一个是要求的——在我们的示例中，无论\
    \ action 是什么，reducer 都返回相同的状态。\n\n为了让事情变得更有趣，我们可以为 store 提供一个默认状态。这在学习时很有用，但实际用途是当我们需要在服务器端或客户端渲染时有初始数据时。\n\
    \n第 2 章. 你的第一个 Redux 应用\n\n### 使用初始状态创建 store\n\n```javascript\nconst initialState\
    \ = {\n  recipes: [\n    {\n      name: 'Omelette'\n    }\n  ],\n  ingredients:\
    \ [\n    {\n      name: 'eggs',\n      quantity: 2\n    }\n  ]\n};\n\nconst reducer\
    \ = (state = initialState, action) => state;\nconst store = createStore(reducer);\n\
    ```\n\n### 检查初始状态\n\n```javascript\nconsole.log(store.getState());\n```\n\n###\
    \ 触发一个 action\n\n要改变状态，我们需要通过 `store.dispatch()` 发送 action：\n\n```javascript\n\
    store.dispatch({ type: 'ADD_RECIPE' });\n```\n```\n\n### 添加食谱\n\n为了添加食谱，我们需要修改\
    \ reducer 以支持这种操作。在 Redux 中，action 仅仅是具有 `type` 属性的普通对象。我们将使用 action 创建器来简化：\n\
    \n```javascript\nconst reducer = (state, action) => {\n  switch (action.type)\
    \ {\n    case 'ADD_RECIPE':\n      return Object.assign({}, state, {\n       \
    \ recipes: state.recipes.concat({ name: 'Pancake' })\n      });\n  }\n  return\
    \ state;\n};\n```\n\n### 使用 action 创建器\n\n```javascript\nconst addRecipe = (name)\
    \ => ({\n  type: 'ADD_RECIPE',\n  name\n});\n\nstore.dispatch(addRecipe('Pancake'));\n\
    ```\n\n### 检查状态\n\n```javascript\nconsole.log(store.getState());\n```\n\n### 添加配料\n\
    \n类似于添加食谱，我们需要我们需要再次修改 reducer 以支持添加配料：\n\n```javascript\nconst reducer = (state,\
    \ action) => {\n  switch (action.type) {\n    case 'ADD_RECIPE':\n      return\
    \ Object.assign({}, state, {\n        recipes: state.recipes.concat({ name: 'Pancake'\
    \ })\n      });\n    case 'ADD_INGREDIENT':\n      const newIngredient = {\n \
    \       name: action.name,\n        recipe: action.recipe,\n        quantity:\
    \ action.quantity\n      };\n      return Object.assign({}, state, {\n       \
    \ ingredients: state.ingredients.concat(newIngredient)\n      });\n  }\n  return\
    \ state;\n}\n```\n\n### 使用 action 创建器\n\n```javascript\nconst addIngredient =\
    \ (recipe, name, quantity) => ({\n  type: 'ADD_INGREDIENT',\n  recipe,\n  name,\n\
    \  quantity\n});\n\nstore.dispatch(addIngredient('Omelette', 'Eggs', 3));\n```\n\
    \n### 检查状态\n\n```javascript\nconsole.log(store.getState());\n```\n\n"
