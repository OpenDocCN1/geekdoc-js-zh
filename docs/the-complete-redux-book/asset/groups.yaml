    \ can consider this similar to putting data in a database or keeping it temporarily\
    \ in memory. Some information can be safely lost without affecting the user's\
    \ experience or corrupting his data.\n\n## Summary\n\nIn this chapter we discussed\
    \ the structure of our Redux state and how it should be managed for easier integration\
    \ with reducers and the UI. We also learned that the state should be considered\
    \ the application's database and be designed separately from the presentation\
    \ or logic layers.\n\nIn the next chapter we will talk about server communication,\
    \ the best method of sending and receiving data to and from our server using middleware.\n\
    \n## Chapter 4. Server Communication\n\nServer communication is one of the more\
    \ important parts of any application. And while the basic implementation can be\
    \ done in a few lines of code, it can quickly grow into a complicated mechanism\
    \ to handle authentication, caching, error handling, WebSockets, and a myriad\
    \ of other functionality and edge cases.\n\nOnline tutorials usually devote little\
    \ time to this topic, and suggest using regular promises and the redux-thunk middleware\
    \ to let action creators dispatch() actions when data is fetched. When a project\
    \ grows, however, it becomes clear that it's best to have a single place to handle\
    \ authentication (setting custom headers), error handling, and features like caching.\
    \ Considering this, we need to be able to access and dispatch asynchronous events—which\
    \ is the perfect job for a middleware.\n\n> Before reading this chapter, it is\
    \ strongly recommended that you read the Middleware Chapter.\n\n## Using Promises\
    \ in Action Creators\n\nLet's start looking at server communication when implemented\
    \ using async action creators (using libraries such as redux-thunk, to understand\
    \ the underlying pitfalls of this approach:\n\nPromise in action creator\n\n```javascript\n\
    const fetchUser = id => (dispatch) =>\n  fetch(`${id}`)\n  .then(response => response.json())\n\
    \  .then(userData => dispatch(setUserData(userData)))\n  .catch(error => dispatch(apiError(error)));\n\
    ```\n\nDid you notice we handled the error in response.json() instead of fetch()\
    \ API?\n\n## Chapter 4. Server Communication\n\nThere are a few issues with this\
    \ code:\n\n1. We can't see an action going out in our logs before the fetch()\
    \ completes, preventing the regular Redux debug flow.\n2. Every action creator\
    \ will need to have the repetitive functionality to handle errors and set headers.\n\
    3. Testing gets harder as more async action creators are added.\n4. If you want\
    \ to change the server communication strategy (e.g., replace fetch() with WebSockets),\
    \ you need to change multiple places in the code.\n\nKeeping the code as short\
    \ and stateless as possible, in keeping with the spirit of Redux, is easier when\
    \ all the action creators are simple functions. This makes them easier to understand,\
    \ debug, and test. Keeping the action creators 'clean' from async code means moving\
    \ it into another part of the stack. Luckily, we have the perfect candidate-middleware.\
    \ As we will see, this approach can keep the action creators simple and generate\
    \ actions that contain all the information needed for a middleware to perform\
    \ the API request.\n\n> Here, we are using the Fetch API to access the server.\
    \ Our target URL is built from a constant specifying the root (e.g., 'http://google.com/')\
    \ and the sub-URL we want to access, passed to the action object.\n\n## API Middleware\n\
    \nOur goal is to create a generic middleware that can serve any API request and\
    \ requires only the information passed to it action. The simplest solution is\
    \ to define a new action type that is unique to API-related events:\n\nSimple\
    \ API middleware\n\n```javascript\nconst apiMiddleware = ({ dispatch }) => next\
    \ => action => {\n  if (action.type === 'API') {\n    return next(action);\n \
    \ }\n\n  // Handle API code\n};\n```\n\nOur middleware will listen to any action\
    \ with type 'API' and use the information in its payload to make a request to\
    \ the server. It will let any other actions flow down the middleware chain.\n\n\
    https://developer.mozilla.org/en/docs/Web/API/Fetch_API\n\n## Moving Code from\
    \ Action Creators\n\nThe original async example used the following code to communicate\
    \ with the server:\n\nPromise in action creator\n\n```javascript\nfetch(`user/${id}`)\n\
    .then(response => response.json())\n.then(userData => dispatch(setUserData(userData)))\n\
    .catch(error => dispatch(apiError(error)));\n```\n\nThis code has a few hardcoded\
    \ issues that we will need to address in our generic API:\n\n- How to construct\
    \ the URL\n- What HTTP verb to use (GET/POST/etc)\n- What action to dispatch on\
    \ success or error\n\nSince we plan to pass all this information inside our action\
    \ object, we can expect the corresponding action creator to pass in all the required\
    \ parameters.\n\nThe URL-building issue is simple to solve, simply by passing\
    \ the required URL in the action object (we will start with GET-only APIs):\n\n\
    Target URL\n\n```javascript\nfetch(BASE_URL + action.url)\n```\n\n> To make things\
    \ more generic, actions will only hold the relative part of the server's full\
    \ URL. This will allow us to set the BASE_URL to be different in production, development,\
    \ and testing.\n\nHandling the return value from the call is a bit complex, as\
    \ our middleware needs to figure out what action to dispatch. A simple solution\
    \ is to pass the next action be dispatched inside the API action. In our case\
    \ we use the Flux Standard Action (FSA) convention and put the ID of the next\
    \ action inside the success key (i.e., action.payload.success):\n\nHandling the\
    \ result\n\n```javascript\ndispatch({ type: action.payload.success, response });\n\
    ```\n\n## Chapter 4. Server Communication\n\nCombining these two ideas results\
    \ in the following basic API middleware:\n\n## Basic API middleware\n\n```javascript\n\
    const apiMiddleware = ({ dispatch }) => next => action => {\n  if (action.type\
    \ !== 'API') {\n    return next(action);\n  }\n  const { payload } = action;\n\
    \nfetch(BASE_URL + action.url)\n    .then(response => response.json())\n    .then(response\
    \ => dispatch({ type: payload.success, response }));\n};\n```\n\n## Using the\
    \ API Middleware\n\nTo use our middleware we need to craft a special action object\
    \ for it:\n\nSample action creator\n\n```javascript\nimport { API, SET_RECIPES\
    \ } from 'constants/action-types';\nconst fetchRecipes = () => ({\n  type: API,\n\
    \  payload: {\n    url: 'recipes.json',\n    success: SET_RECIPES\n  }\n});\n\
    ```\n\nOur middleware should call the server and resume the regular application\
    \ flow. At a later time, once the call from the server completes, it should dispatch\
    \ a new action to the store.\n"
  mdcn: "\n\n## 第3章 状态管理\n\n## 大规模嵌套状态\n\n```javascript\nconst state = {\n  db: {\n\
    \    books: {},\n    recipes: {},\n    ingredients: {},\n  },\n  local: {\n  \
    \  activeRequests: 0,\n    user: {\n      name: 'Kipi',\n      accessToken: 'topsecrettoken'\n\
    \    }\n  },\n  vendor: {\n    forms: {},\n    router: {}\n  }\n};\n```\n\n这在决定哪些部分需要同步到本地存储或清除状态数据时，允许更方便地管理不同部分。\n\
    \n通常情况下，状态是前端的数据库，应该被视为数据库。定期检查当前布局和任何重构非常重要，以确保状态结构清晰、简洁且易于扩展。\n\n## 状态中应该存放什么\n\
    \n在使用 Redux 时，一个常见的问题是决定哪些内容放入状态中，哪些内容留在外部（即 React 的状态、Angular 的服务或其他 UI 库的其他存储方法中）。\n\
    \n在决定是否将某些内容添加到状态中时，需要考虑以下几个问题：\n\n- 这些数据是否需要在跨页面刷新时保持持久化？\n- 这些数据是否需要在跨路由变化时保持持久化？\n\
    - 这些数据是否在 UI 的多个地方被使用？\n\n如果这些任何一个问题的答案是“是”，那么这些数据就应该进入状态中。如果所有问题的答案都是“否”，它们仍然可以进入状态中，但并非必须如此。\n\
    \n以下是一些可以保存在状态之外的数据示例：\n\n- 页面上标签页控件中当前选中的标签页\n- 控件上的悬停可见/不可见状态\n- 弹出层灯框（Lightbox）的打开/关闭状态\n\
    - 当前显示的错误\n\n我们可以将此比作将数据存入数据库或将其临时保存在内存中。某些信息的丢失是安全的，不会影响用户体验或损坏其数据。\n\n## 总结\n\
    \n在本章中，我们讨论了 Redux 状态的结构，以及如何对其进行管理以便于与 reducers 和 UI 集成。我们还学习了状态应该被视为应用程序的数据库，并与表示层或逻辑层分开设计。\n\
    \n在下一章中，我们将讨论服务器通信，以及使用中间件与服务器之间发送和接收数据的最佳方法。\n\n## 第4章 服务器通信\n\n服务器通信是任何应用程序中最重要的部分之一。虽然基础实现可以用几行代码完成，但它会迅速变成一个复杂的机制，用于处理身份验证、缓存、错误处理、WebSockets\
    \ 以及无数其他功能和边缘情况。\n\n在线教程通常对这个主题投入的时间较少，并建议使用普通的 promises 和 `redux-thunk` 中间件，让\
    \ action 创建者在获取数据时 `dispatch()` 动作。然而，随着项目的增长，显而易见的是最好的做法是有一个单一的地方来处理身份验证（设置自定义请求头）、错误处理以及缓存等功能。考虑到这一点，我们需要能够访问并分发异步事件——这正是中间件的绝佳工作。\n\
    \n> 在阅读本章之前，强烈建议你先阅读“中间件”章节。\n\n## 在 action 创建者中使用 Promises\n\n让我们开始查看使用异步 action\
    \ 创建者实现服务器通信的示例（使用诸如 `redux-thunk` 等库），以理解这种方法的底层潜在陷阱：\n\naction 创建者中的 Promise\n\
    \n```javascript\nconst fetchUser = id => (dispatch) =>\n  fetch(`${id}`)\n  .then(response\
    \ => response.json())\n  .then(userData => dispatch(setUserData(userData)))\n\
    \  .catch(error => dispatch(apiError(error)));\n```\n\n你是否注意到我们在 `response.json()`\
    \ 中处理了错误，而不是在 `fetch()` API 中处理？\n\n## 第4章 服务器通信\n\n这段代码存在几个问题：\n\n1. 在 `fetch()`\
    \ 完成之前，我们无法在日志中看到一个发出的 action，这阻止了常规的 Redux 调试流程。\n2. 每个 action 创建者都需要包含重复性的功能来处理错误和设置请求头。\n\
    3. 随着更多异步 action 创建者的添加，测试变得越来越困难。\n4. 如果你想更改服务器通信策略（例如用 WebSockets 替换 `fetch()`），你需要修改代码中的多处地方。\n\
    \n保持代码尽可能简短和无状态（以符合 Redux 的精神），当所有 action 创建者都是简单函数时会变得更容易实现。这使得它们更容易被理解、调试和测试。保持\
    \ action 创建者远离异步代码的“纯洁”，意味着将其移动到堆栈的其他部分。幸运的是，我们有完美的候选者——中间件。正如我们所看到的，这种方法可以保持\
    \ action 创建者的简单性，并生成包含中间件执行 API 请求所需所有信息的 action。\n\n> 在这里，我们使用 Fetch API 访问服务器。我们的目标\
    \ URL 由一个指定根路径（例如 'http://google.com/'）的常量以及我们要访问的子 URL 构建，并传递给 action 对象。\n\n\
    ## API 中间件\n\n我们的目标是创建一个通用的中间件，可以于任何 API 请求，并且只需要传递给它的 action 信息。最简单的解决方案是定义一种与\
    \ API 相关事件唯一的新的 action 类型：\n\n简单的 API 中间件\n\n```javascript\nconst apiMiddleware\
    \ = ({ dispatch }) => next => {\n  if (action.type === 'API') {\n    return next(action);\n\
    \  }\n\n// ...\n```\n\n我们的中间件将监听类型为 'API' 的任何 action，并使用其 payload 信息向服务器发送请求。它会让其他\
    \ action 在中间件链中流动。\n\nhttps://developer.mozilla.org/en-docs/Web/API/Fetch_API\n\
    \n## 从 action 创建者移动代码\n\n原始示例中，异步 action 创建者使用以下代码与服务器通信：\n\naction 创建者中的 Promise\n\
    \n```javascript\nfetch(`user/${id}`)\n.then(response => response.json())\n.then(userData\
    \ => dispatch(setUserData(userData)))\n.catch(error => dispatch(apiError(error)));\n\
    ```\n\n这段代码有几个硬编码问题，我们需要在通用 API 中解决：\n\n- 如何构建 URL\n- 使用什么 HTTP 动词（GET/POST 等）\n\
    - 成功或错误时分发什么 action\n\n由于我们计划将所有这些信息放在 action 对象中，我们可以预期相应的 action 创建者传入所有参数。\n\
    \nURL 构建问题很容易解决，只需通过在 action 对象中传递所需的 URL（我们将从仅 GET API 开始）：\n\n目标 URL\n\n```javascript\n\
    fetch(BASE_URL + action.url)\n```\n\n> 为了更加通用，action 将持有服务器完整 URL 的部分。这将允许我们在生产、开发和测试设置不同的\
    \ BASE_URL。\n\n处理调用返回值有点复杂，因为我们的中间件需要确定分发哪个 action。一个简单的解决方案是将下一个 action 放在 API\
    \ action 中。在这种情况下，我们使用 Flux Standard Action (FSA) 规范，并将下一个 action ID 放在 success\
    \ 键中（即 `action.payload.success`）：\n\n处理结果\n\n```javascript\ndispatch({ type: action.payload.success,\
    \ response });\n```\n\n结合这两个想法得到了下面的基础 API 中间件：\n\n## 基础 API 中间件\n\n```javascript\n\
    const apiMiddleware = ({ dispatch }) => next => action => {\n  if (action.type\
    \ !== 'API') {\n    return next(action);\n  }\n  const { payload } = action;\n\
    \nfetch(BASE_URL + action.url)\n    .then(response => response.json())\n    .then(response\
    \ => dispatch({ type: payload.success, response }));\n};\n```\n\n## 使用 API 中间件\n\
    \n为了使用我们的中间件，我们需要为它构建一个特殊的 action 对象：\n\n示例 action 创建者\n\n```javascript\nimport\
    \ { API, SET_RECIPES } from 'constants/action-types';\nconst fetchRecipes = ()\
    \ => ({\n  type: API,\n  payload: {\n    url: 'recipes.json',\n    success: SET_RECIPES\n\
    \  }\n});\n```\n\n我们的中间件应该调用服务器并恢复常规应用程序流程。稍后，一旦服务器的调用完成，它应该向 store 分发一个新的 action。\n\
    \n"
