    const initialState = {\n  counter: 3\n};\n```\n\n我们可以使用它来创建一个 Redux store\n\n\
    ### 创建一个 Redux store\n\n```javascript\nconst store = Redux.createStore(reducer,\
    \ initialState);\n```\n\n如你所示，我们正在使用之前的 Redux。对 reducer 唯一需要更改的是 `switch` 语句。不再这样做：\n\
    \n### 之前的 reducer 代码\n\n```javascript\nswitch (action)\n```\n\n而是改为：\n\n### 新的\
