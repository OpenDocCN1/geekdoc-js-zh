    \ });\n      websocket.send(JSON.stringify(cleanAction));\n    }\n    next(action);\n\
    \  };\n};\n\nexport default wsMiddleware;\n```\n\n### 身份验证\n\n在许多应用程序中，处理 WebSocket\
    \ 的身份验证可能有点棘手，WebSocket 与普通的 HTTP 请求并用使用。身份验证通常通过普通的 REST 或 OATH 调用完成，并授予前端一个令牌——存储在\
