    \ 函数。\n\n## 避免变异 (Avoiding Mutations)\n\nRedux 中 reducer 最重要的一点是它们永远不要修改现有状态。JavaScript\
    \ 中有很多函数在处理不可变对象时可以提供帮助。\n\n## 为什么我们需要避免变异？\n\nreducer 不变性要求背后的原因之一是更改检测的需求。在\
