- md: "\nFor more information on action creators, consult the Actions and Action Creators\
    \ Chapter Part 3.\n\n## Structuring the Code\n\nHaving all our code in a single\
    \ file is obviously a bad idea. In Redux, it's common for the directory structure\
    \ to follow the names of the Redux \"actors.\" Reducers are placed in the reducers\
    \ directory, and the main reducer (commonly called the root reducer) is placed\
    \ in the root.js file. Action creators go in the actions directory, divided by\
    \ the type of object or data they handle—in our case, actions/recipes.js and actions/ingredients.js.\
    \ Since we only have a single store, we can put all into one file: store/store.\n\
    \nAfter the changes, the index.js file should look like the following:\n\nFinal\
    \ index.js\n\n```javascript\nimport store from './store/store';\nimport { addRecipe\
    \ } from './actions/recipes';\nimport { addIngredient } from './actions/ingredients';\n\
    \nstore.dispatch(addRecipe('Pancake'));\nstore.dispatch(addIngredient('Pancake',\
    \ 'Eggs', 3));\n\nwindow.store = store;\n```\n\n## A Closer Look at Reducers\n\
    \nIf you open the reducers/root.js file, you will find that the same reducer is\
    \ now taking care of different parts of our state tree. As our application grows,\
    \ more properties will be added to both the recipes and the ingredients subtrees.\
    \ Since the handlers are not interdependent, we can split it further into three\
    \ reducers, each responsible for a different part of the state:\n\n## Chapter\
    \ 2. Your First Redux Application\n\n## Multi-responsibility reducer\n\n```javascript\n\
    const recipesReducer = (recipes, action) => {\n  switch (action.type) {\n    case\
    \ 'ADD_RECIPE':\n      return recipes.concat({name: action.name});\n  }\n  return\
    \ recipes;\n}\nconst ingredientsReducer = (ingredients, action) => { ... }\nconst\
    \ rootReducer = (state, action) => {\n  return Object.assign(state, {\n    recipes:\
    \ recipesReducer(state.recipes, action),\n    ingredients: ingredientsReducer(state.ingredients,\
    \ action)\n  });\n};\n```\n\nThere are three main benefits. First, our root reducer\
    \ is now very simple. All it does is create a new state object by combining the\
    \ old state and the results of each of the subreducers. Second, our recipes reducer\
    \ is much simpler as it only has to handle the recipes part of the state. And\
    \ best of all, our root, ingredients, and any other reducers that we might create\
    \ don't need to know or care about the internal structure of the recipes subtree.\
    \ Thus, changes to that part of the tree will only affect the recipes part. A\
    \ side effect of this is that we can tell each reducer to initialize its subtree\
    \ using default parameters from ES2016:\n\nReducer for recipes\n\n```javascript\n\
    const recipesReducer = (recipes = [], action) => { ... };\n```\n\nNote the default\
    \ [] set for recipes.\n\nSince combining multiple reducers is a very common pattern,\
    \ Redux has a special utility function, `combineReducers()`, which does exactly\
    \ what our root reducer does:\n\n## Chapter 2. Your First Redux Application\n\n\
    ## Combining multiple reducers\n\n```javascript\nexport default combineReducers({\n\
    \  recipes: recipesReducer,\n  ingredients: ingredientsReducer\n});\n```\n\nHere\
    \ we created a root reducer that employs two subreducers, one sitting in the recipes\
    \ subtree and the other in the ingredients subtree. This is a good time to split\
    \ our reducers into their own files, reducers/recipes.js and reducers/ingredients.js.\n\
