    \nRedux 概述\n\n## Redux 术语\n\n### Actions 和 Action 创建器（Action Creators）\n\n应用程序更改状态的唯一方法是通过处理\
    \ actions。在大多数情况下，Redux 中的 actions 仅仅是传递给 store 的普通 JavaScript 对象，它们包含了 store\
    \ 修改状态所需的所有信息：\n\naction 对象的示例\n\n```\n{\n  type: 'INCREMENT',\n  payload: {\n\
