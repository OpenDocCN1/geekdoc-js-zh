  - "[PAGE 172]\n\n# Chapter 10. Middleware\n\nLogin flow middleware\n\n```\nconst\
    \ loginFlowMiddleware = (( dispatch }) => next => action => {\n  // Let the reducer\
    \ save the access token in the state\n  next(action);\n  if (action.type === SUCCESSFUL_LOGIN)\
    \ {\n    dispatch(fetchUserInfo());\n    dispatch(fetchNotifications());\n  }\n\
    };\n```\n\nOur new code holds the flow in a single place and will allow us to\
    \ easily support login via Twitter, Google Apps, and more.\n\nIn practice we can\
    \ combine flows together and add conditions and more complicated logic, as have\
    \ full access to both dispatch() and getState().\n\n> There are a few external\
    \ libraries to make flow management easier, such as redux-saga⁶.\n\n# Other Action\
    \ Types\n\nWhen learning the bases of Redux, developers are usually taught that\
    \ actions in Redux can only be objects and must contain the 'type' key. In practice,\
    \ reading this book and online material, you'll notice Error objects, functions,\
    \ and promises being passed to dispatch().\n\nThe underlying rule is simple: our\
    \ root reducer requires an object as an action, but our middleware has no limits\
    \ and is free to handle any type of data passed to dispatch().\n\nTry running\
    \ dispatch(null). You should get an error from Redux similar to:\n\n```\nstore.dispatch(null);\n\
    > Uncaught TypeError: Cannot read property 'type' of null(...)\n```\n\nTo add\
    \ support for null we can create our own nullMiddleware:\n\n⁶https://github.com/yelouafi/redux-saga"
- md: "\n## Chapter 10. Middleware\n\n### Simple null middleware\n\n```javascript\n\
    const nullMiddleware = () => next => action => {\n  next(action !== null ? action\
    \ : { type: 'UNKNOWN' });\n};\n```\n\nIn this middleware we catch any attempt\
    \ to send null instead of dispatch() and send a fake { type: 'UNKNOWN' } instead.\
    \ While this middleware has no practical value, it should be apparent how we can\
    \ use the middleware's power to change actions to support any input type. The\
    \ famous redux-thunk* is essence in the following code:\n\n### Simplified redux-thunk\n\
    \n```javascript\nconst thunkMiddleware = ({dispatch, getState}) => next => action\
    \ => {\n  if (typeof action === 'function') {\n    return action(dispatch, getState);\n\
    \  }\n  return next(action);\n};\n```\n\nIt checks if the action passed is 'function'\
    \ instead of the regular object, and if it is a function it \"calls\" it, passing\
    \ dispatch() and getState().\n\nA similar approach is used by other middleware\
    \ that know how to accept the following, and more:\n\n- Promises (e.g., dispatch\
    \ a regular action when resolved)\n- Error objects (e.g., report errors)\n- Arrays\
    \ (e.g., execute a list of actions provided in parallel or sequentially)\n\n###\
    \ Difference Between next() and dispatch()\n\nA common point of confusion is the\
    \ difference between the next() and dispatch() functions passed to the middleware.\
    \ While both accept an action, they follow a different flow in Redux.\n\nCalling\
    \ next() within a middleware will pass the action along the middleware chain (from\
    \ the current middleware) down to the reducer. Calling dispatch() will start the\
    \ action flow from the beginning (the first middleware in the chain), so it will\
    \ eventually reach the current one as well.\n\n*https://github.com/gaearon/redux-thunk\n\
    \n## Chapter 10. Middleware\n\n### Store setup\n\n```javascript\ncreateStore(reducer,\n\
    \  applyMiddleware(\n    middlewareA,\n    middlewareB,\n    middlewareC\n  )\n\
    );\n```\n\nCalling next(action) within middlewareB will cause the action to be\
    \ passed to middlewareC and then the reducer.\n\nCalling dispatch(action) within\
    \ middlewareB will cause the action to be passed to middlewareA, then middlewareB,\
    \ middlewareC, and finally to the reducer, returning the execution back to middlewareB.\n\
    \nCalling dispatch() multiple times is a common and valid practice. next() can\
    \ also be called more than once, this is not recommended as any action passed\
    \ to next() will skip the middleware before the current one (for example, skipping\
    \ the logging middleware).\n\n### Parameter-Based Middleware\n\nBeyond the middleware\
    \ we've discussed so far in this chapter, some middleware might be reusable and\
    \ support parameters being passed during their creation.\n\nFor example, the nullMiddleware\
    \ we created earlier in this chapter:\n\nSimple null middleware\n\n```javascript\n\
    const nullMiddleware = () => next => action => {\n  next(action !== null ? action\
    \ : { type: 'UNKNOWN' });\n};\n```\n\n```javascript\nexport default nullMiddleware;\n\
    ```\n\nThe 'UNKNOWN' key is hardcoded in our middleware and will not allow easy\
    \ reuse in our projects. To make this middleware more generic, we might want to\
    \ be able to support arbitrary action types and use the applyMiddleware() stage\
    \ to specify how we want our middleware to behave:\n\n## Chapter 10. Middleware\n\
    \n### Customizable middleware\n\n```javascript\nimport { createStore, applyMiddleware\
    \ } from 'redux';\nimport reducer from 'reducers/root';\nimport nullMiddleware\
    \ from 'middleware/null';\n\nconst store = createStore(reducer, applyMiddleware(nullMiddleware('OH_NO')));\n\
    ```\n\nHere we want our nullMiddleware to dispatch 'OH_NO' instead of the default\
    \ 'UNKNOWN'. To support this we must turn our middleware into a \"middleware creator\"\
    :\n\n### Null middleware creator\n\n```javascript\nconst nullMiddlewareCreator\
    \ = param => store => next => action => {\n  next(action) !== null ? action :\
    \ { type: param || 'UNKNOWN' };\n};\n```\n\nexport default nullMiddlewareCreator;\n\
    \nNow instead of returning the middleware directly, we return a function that\
    \ creates a middleware with custom parameters passed in. This behavior can be\
    \ further extended and allow for creation of complex middleware as libraries that\
    \ can be easily added to the store.\n\n### How Are Middleware Used?\n\nIn real-life\
    \ applications, middleware are often where most of the logic and complex code\
    \ resides. They also hold most of the utility functionality, such as logging,\
    \ error-reporting, analytics, authorization, and more. Many of the enhancements\
    \ used in this book require the addition of their custom middleware to the chain\
    \ in order to support their functionality. There is a long list of open projects\
    \ that implement various middleware. A few examples are:\n\n- Promises\n- Error\
    \ objects\n- Arrays\n\n## Chapter 10. Middleware\n\n### Summary\n\nIn real-life\
