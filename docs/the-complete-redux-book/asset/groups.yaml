- md: "\n## Chapter 7. The Store\n\n### applyMiddleware()\n\nOne of the best-known\
    \ store enhancers is called applyMiddleware(). This is currently the only store\
    \ enhanced by Redux (if you aren't familiar with middleware\n\n#### Implementation\
    \ of applyMiddleware\n\n```javascript\nexport default function applyMiddleware(...middlewares)\
    \ {\n  return (createStore) => (reducer, preloadedState, enhancer) => {\n    var\
    \ store = createStore(reducer, preloadedState, enhancer)\n    var dispatch = store.dispatch\n\
    \    var chain = []\n\n    var middlewareAPI = {\n      getState: store.getState,\n\
    \      dispatch: (action) => dispatch(action)\n    }\n    chain = middlewares.map(middleware\
    \ => middleware(middlewareAPI))\n    dispatch = compose(...chain)(store.dispatch)\n\
    \n    return { ...store, dispatch }\n  }\n}\n```\n\n> In this example, the word\
    \ middlewares is used as plural form to distinguish between singular form in the\
    \ 'map' function. It is the actual source code of applyMiddleware().\n\nAt its\
    \ core, applyMiddleware() changes the store's default dispatch() method to pass\
    \ the action through the chain of middleware provided:\n\n### Setup of store\n\
    \n```javascript\nvar store = createStore(reducer, preloadedState, enhancer)\n\
    var dispatch = store.dispatch\nvar chain = []\n\nvar middlewareAPI = {\n  getState:\
    \ store.getState,\n  dispatch: (action) => dispatch(action)\n}\n```\n\nFirst store\
    \ is created and the core getState() and dispatch() methods are wrapped into something\
    \ called middlewareAPI. This is the object middleware receives as the first parameter\
    \ (commonly confused with store):\n\n### Building the middleware chain\n\n```javascript\n\
    chain = middlewares.map(middleware => middleware(middlewareAPI))\n```\n\nThe array\
    \ of middleware is transformed into the result of calling middleware() with middlewareAPI\
    \ as its argument. The structure of the middleware is api => next => action =>\
    \ {}, after the transformation, chain holds arrays of functions type next => action\
    \ => {}\n\nThe last stage is to use compose() to decorate the middleware one another:\n\
    \n### Building the dispatch chain\n\n```javascript\ndispatch = compose(...)(store.dispatch)\n\
    ```\n\nThis line causes each middleware to decorate the chain of previous ones\
    \ in a fashion similar to:\n\n### Composing middleware without compose\n\n```javascript\n\
    middlewareA(middlewareB(middlewareC(store.dispatch)))\n```\n\nThe original store.dispatch()\
    \ is passed as a parameter to the first wrapper in the chain.\n\n> This implementation\
    \ employs the strange syntax of the Redux middleware (the 3-function structure):\n\
    \n```javascript\nconst myMiddleware =\n  ({ getState, dispatch }) => (next) =>\
    \ (action) => { }\n```\n\n### Other Uses\n\nStore enhancers are powerful tools\
    \ that allow us to debug stores\n\n- 30 https://github.com/markerson/redux-ecosystem-links/blob/master/store.md\n\
    - 31 https://github.com/markerson/redux-ecosystem-links\n\n### Summary\n\nIn this\
    \ chapter we learned about the central, most important part of Redux, the store.\
    \ It holds the whole state of the application, receives actions, passes them to\
    \ the reducer function to replace the state, and notifies us on every change.\
    \ Basically, you could say that Redux is the store implementation.\n\nWe learned\
    \ about higher-order functions, a very powerful functional programming concept\
    \ that gives us incredible power to enhance code without touching the source.\
    \ We also covered uses for store enhancers in Redux, and took a look at the most\
    \ common store enhancer, `applyMiddleware()`. This function allows us to intercept\
    \ and transform dispatched actions before they are propagated to reducers, and\
    \ we will take a deeper look at it in Chapter 10.\n\nIn the next chapter we will\
    \ look at actions and action creators, the entities we dispatch to the store to\
    \ make changes to the application state.\n\n## Chapter 8. Actions and Action Creators\n\
    \nActions are the driving force of every dynamic application, as they are the\
    \ medium by which all changes are communicated within a Redux application. In\
    \ a Redux application we have two sides: the senders of actions and their reducers.\
    \ The senders might be event handlers (like keypresses), timeouts, network events,\
    \ or middleware. The receivers are more limited; in the case of Redux they are\
    \ middleware and reducers.\n\nA connection between a sender and a receiver is\
    \ not necessarily one-to-one. A keypress might cause a single action to be sent\
    \ that will in turn cause both middleware and a reducer to change the state, resulting\
    \ in a pop-up appearing. This also holds true in the other direction, where a\
    \ single reducer might be listening to multiple actions. While simple Redux applications\
    \ there might be a reducer for each action and vice versa, in large applications\
    \ this relation breaks down, and we have multiple actions handled by a single\
    \ reducer and multiple middleware listening to a single action.\n\nSince the emitting\
    \ actions don't know who might be listening to it, our actions have to carry all\
    \ the information needed for the receiving end to be able to understand how to\
    \ respond.\n\nThe simplest way to hold information in JavaScript is to use a plain\
    \ object, and that is exactly what an action is:\n\n### Plain object-based Action\n\
    \n```javascript\nconst action = { type: 'MARK_FAVORITE' };\n```\n\nActions are\
    \ plain objects containing one required property, the type. The type is a unique\
    \ key describing the action, and it is used by the receiving end to distinguish\
    \ between actions.\n\n> The value of the type property can be anything, though\
    \ it is considered good practice to use strings to identify actions. While first\
    \ numbers or ES2016 symbols might sound like a better solution, they have practical\
    \ downsides: using numbers makes it hard to debug an application and gives little\
    \ benefit spacewise, whereas ES2016 symbols will cause issues with server rendering\
    \ and sending actions across the network to other clients.\n\nIn Redux, we send\
    \ actions to the store, which passes them to middleware and to reducers.\n\n###\
    \ Dispatching an action\n\nIn Redux, we send actions to the store, which passes\
    \ them to middleware and to reducers. In order to notify the store, we use the\
    \ dispatch() method. Unlike many frameworks, the store's is not globally available.\
    \ We have a few options to access it:\n\n1. By holding reference to store\n2.\
    \ Inside middleware\n3. Through methods provided by different frameworks\n\nHere's\
    \ a simple example of dispatching actions by holding:\n\n#### Simple action\n\n\
    ```javascript\nimport { store } from './store';\ndispatch({ type: 'MARK_FAVORITE'\
    \ });\n```\n\n### Action Creators\n\nAs our applications grow and develop, we\
    \ will start encountering more and more code like this:\n\n#### Direct dispatch\n\
    \n```javascript\ndispatch({\n  type: 'ADD_RECIPE',\n  title: title.trim(),\n \
    \ description: description ? description.trim() : ''\n});\n```\n\nIf we use the\
    \ same action in other places, we will end up duplicating the logic in multiple\
    \ locations. Such code is hard to maintain, as we will have to synchronize all\
    \ the changes between all occurrences of the action.\n\nA better approach is to\
    \ keep the action in one place. We can create a function that will create the\
    \ action object for us:\n\n#### Function to create action object\n\n```javascript\n\
    const addRecipe = (title, description = '') => ({\n  type: 'ADD_RECIPE',\n  title:\
    \ title.trim(),\n  description: description.trim()\n});\n```\n\nNow we can use\
    \ it in our code:\n\n#### Using an action creator\n\n```javascript\ndispatch(addRecipe(title,\
    \ description));\n```\n\nAny modification to the content or logic of the action\
    \ can now be handled in one place: the action creation function, also known as\
    \ the action creator. Beyond improving the maintainability of our applications,\
    \ moving the action object creation to a function allows us to write simpler tests.\
    \ We can test the logic separately from the branch from which the function is\
    \ called.\n\nIn a large project, not all of our actions will have a corresponding\
    \ action creator function. We will try to never call the dispatch() method by\
    \ handcrafting the appropriate action object, but rather use an action creator.\
    \ This might appear to be a lot of overhead initially, but its value will become\
    \ apparent as the project grows. Also, to help reduce boilerplate, there are a\
    \ number of libraries and concepts that ease the creation and use of action creators.\
    \ Those will be discussed later in this chapter.\n\n### Directory Organization\n\
    \nIn order to better manage our action creators, we will create a separate directory\
    \ for them in our code base. For smaller projects, it may be enough to group actions\
    \ in files according to their usage in reducers:\n\nThe object passed to dispatch()\
    \ will be available in reducers:\n\n```javascript\nfunction reducer(state, action)\
    \ {\n  console.log(action);\n  return state;\n}\n// -> { type: 'MARK_FAVORITE',\
    \ recipeId: 21, ... }\n```\n"
  mdcn: "\n\n## 第 7 章 Store（存储器）\n\n### applyMiddleware()\n\n最为人知的 store 增强器被称为 `applyMiddleware()`。这是目前\
    \ Redux 唯一增强过的 store（如果你不熟悉中间件的话）。\n\n#### applyMiddleware 的实现\n\n```javascript\n\
    export default function applyMiddleware(...middlewares) {\n  return (createStore)\
    \ => (reducer, preloadedState, enhancer) => {\n    var store = createStore(reducer,\
    \ preloadedState, enhancer)\n    var dispatch = store.dispatch\n    var chain\
    \ = []\n\n    var middlewareAPI = {\n      getState: store.getState,\n      dispatch:\
    \ (action) => dispatch(action)\n    }\n    chain = middlewares.map(middleware\
    \ => middleware(middlewareAPI))\n    dispatch = compose(...chain)(store.dispatch)\n\
    \n    return { ...store, dispatch }\n  }\n}\n```\n\n> 在此示例中，单词 `middlewares` 用作复数形式，以与\
    \ `map` 函数中的单数形式区分来。它是 `applyMiddleware()` 的实际源代码。\n\n从本质上说，`applyMiddleware()`\
    \ 修改了 store 默认 `dispatch()` 方法，将 action 传递到提供的中间件链中：\n\n### store 的设置\n\n```javascript\n\
    var store = createStore(reducer, preloadedState, enhancer)\nvar dispatch = store.dispatch\n\
    var chain = []\n\nvar middlewareAPI = {\n  getState: store.getState,\n  dispatch:\
    \ (action) => dispatch(action)\n}\n```\n\n首先创建 store，并将核心的 `getState()` 和 `dispatch()`\
    \ 方法封装在一个名为 `middlewareAPI` 的对象中。这是中间件作为第一个参数接收到的对象（通常与 `store` 混淆）：\n\n### 构建中间件链\n\
    \n```javascript\nchain = middlewares.map(middleware => middleware(middlewareAPI))\n\
    ```\n\n中间件数组被转换为调用 `middleware()` 并以 `middlewareAPI` 作为其参数的结果。中间件的结构是 `api =>\
    \ next => action => {}`，转换后，`chain` 包含了类型为 `next => action => {}` 的函数数组\n\n最后阶段是使用\
    \ `compose()` 将中间件相互装饰：\n\n### 构建 dispatch 链\n\n```javascript\ndispatch = compose(...)(store.dispatch)\n\
    ```\n\n这一行代码导致每个中间件以类似于下面的方式装饰之前中间件的链：\n\n### 不使用 compose 组合中间件\n\n```javascript\n\
    middlewareA(middlewareB(middlewareC(store.dispatch)))\n```\n\n原始的 `store.dispatch()`\
    \ 作为参数传递给链中的第一个包装器。\n\n> 此实现采用了 Redux 中间件的奇特语法（3 函数结构）：\n\n```javascript\nconst\
    \ myMiddleware =\n  ({ getState, dispatch }) => (next) => (action) => { }\n```\n\
    \n### 其他用途\n\nstore 增强器是强大的工具，允许我们调试 store\n\n- 30 https://github.com/markerson/redux-ecosystem-links/blob/master/store.md\n\
    - 31 https://github.com/markerson/redux-ecosystem-links\n\n### 总结\n\n在本章中，我们学习了\
    \ Redux 的核心、也是最重要的部分——store。它持有了应用程序的整个状态，接收 actions，将它们传递给 reducer 函数以替换状态，并在每次变化时通知我们。基本上，你可以说\
    \ Redux 就是 store 的实现。\n\n我们学习了高阶函数，这是一个非常强大的函数式编程概念，它赋予了我们在不触源码的情况下增强代码的惊人能力。我们还涵盖了\
    \ Redux 中 store 增强器的用途，并查看了最常用的 store 增强器 `applyMiddleware()`。该函数允许我们在分发的 actions\
    \ 传播到 reducer 之前拦截并转换它们，我们将在第 10 章深入研究它。\n\n在下一章中，我们将查看 actions 和 action creators（动作创建器），这些是我们分发到\
    \ store 以更改应用程序状态的实体。\n\n## 第 8 章 Actions 和 Action Creators\n\nActions 是每个动态应用程序的驱动力，因为它们是\
    \ Redux 应用程序内部通信所有变化的媒介。在 Redux 应用程序中，我们有两个端：actions 的发送者和它们的 reducer。发送者可能是事件处理器（如按键按下）、定时器、网络事件或中间件。接收者则相对有限；在\
    \ Redux 的情况下，接收者是中间件和 reducer。\n\n发送者和接收者之间的连接并不一定是一一的。一次按键可能会发送一个 action，该 action\
    \ 又会导致中间件和 reducer 改变状态，从而弹出一个窗口。反向情况也是如此，一个 reducer 可能会监听多个 actions。在简单的 Redux\
    \ 应用中，每个 action 可能都有一个 reducer，反之亦然；但在大型应用中，这种关系会被打破，我们有多个 action 由单个 reducer\
    \ 处理，以及多个中间件监听单个 action。\n\n由于发出的 action 并不知道可能在监听它，因此我们的 actions 必须携带接收端能够理解如何响应所需的所有信息。\n\
    \n在 JavaScript 中存储信息最简单的方法是使用普通对象（plain object），而这正是 action 的本质：\n\n### 基于普通对象的\
    \ Action\n\n```javascript\nconst action = { type: 'MARK_FAVORITE' };\n```\n\n\
    Actions 是包含一个属性的普通对象，即 `type`。\n\nActions 是包含一个必需属性的普通对象，它被接收端用于区分 actions。\n\n\
    >  type 属性的值可以是任何内容，但良好的实践是使用字符串来标识 actions。虽然使用数字听起来像是更好的解决方案，但它们在调试时很困难；使用2016\
    \ 符号可能会带来问题，它们在 action 出现处没有实际益处。\n\n我们将 actions 发送到 store，以将它们传递给中间件和 reducer。\n\
    \n在 Redux 中，我们将 actions 发送到 store，以将它们传递给中间件和 reducer。\n\n在 Redux 中，我们将 actions\
