    - Hover visibility/invisiblty on a control

    - Lightbox being open/closed

    - Currently displayed errors


    We can consider this similar to putting data in a database or keeping it temporarily
    in memory. Some information can be safely lost without affecting the user''s experience
    or corrupting his data.


    # Summary


    In this chapter we discussed the structure of our Redux state and how it should
    be managed for easier integration with reducers and the UI. We also learned that
    the state should be considered the application''s database and be designed separately
    from the presentation or logic layers.


    In the next chapter we will talk about server communication, the best method of
    sending and receiving data to and from our server using middleware.'
