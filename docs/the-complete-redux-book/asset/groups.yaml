    # Summary


    In this chapter we learned about the central, most important part of Redux, the
    store. It holds the whole state of the application, receives actions, passes them
    to the reducer function to replace the state, and notifies us on every change.
    Basically, you could say that Redux is the store implementation.


    We learned about higher-order functions, a very powerful functional programming
    concept that gives us incredible power to enhance code without touching the source.
    We also covered uses for store enhancers in Redux, and took a look at the most
    common store enhancer, `applyMiddleware()`. This function allows us to intercept
    and transform dispatched actions before they are propagated to reducers, and we
    will take a deeper look at it in Chapter 10.


    In the next chapter we will look at actions and action creators, the entities
    we dispatch to the store to make changes to the application state.'
  - '[PAGE 129]


    # Chapter 8. Actions and Action Creators


    Actions are the driving force of every dynamic application, as they are the medium
    by which all changes are communicated within a Redux application. In a Redux application
    we have two sides: the senders of actions and their reducers. The senders might
    be event handlers (like keypresses), timeouts, network events, or middleware.
    The receivers are more limited; in the case of Redux they are middleware and reducers.


    A connection between a sender and a receiver is not necessarily one-to-one. A
    keypress might cause a single action to be sent that will in turn cause both middleware
    and a reducer to change the state, resulting in a pop-up appearing. This also
    holds true in the other direction, where a single reducer might be listening to
    multiple actions. While simple Redux applications there might be a reducer for
    each action and vice versa, in large applications this relation breaks down, and
    we have multiple actions handled by a single reducer and multiple middleware listening
    to a single action.


    Since the emitting actions don''t know who might be listening to it, our actions
    have to carry all the information needed for the receiving end to be able to understand
    how to respond.


    The simplest way to hold information in JavaScript is to use a plain object, and
    that is exactly what an action is:


    Plain object-based Action


    ```

    const action = { type: ''MARK_FAVORITE'' };

    ```


    Actions are plain objects containing one required property, the type. The type
    is a unique key describing the action, and it is used by the receiving end to
    distinguish between actions.


    > The value of the type property can be anything, though it is considered good
    practice to use strings to identify actions. While first numbers or ES2016 symbols
    might sound like a better solution, they have practical downsides: using numbers
    makes it hard to debug an application and gives little benefit spacewise, whereas
    ES2016 symbols will cause issues with server rendering and sending actions across
    the network to other clients.


    In Redux, we send actions to the store, which passes them to middleware and to
    reducers. In order to notify a store about an action, we use the store''s dispatch()
    method.


    Unlike many Flux implementations, in Redux the store''s dispatch() API is not
    globally available. You have a few options to access it:'
  - "[PAGE 130]\n\n+   1. By holding a reference to the store\n2. Inside middleware\n\
    3. Through methods provided by special libraries for different frameworks\n\n\
    Here's a simple example for dispatching actions by holding a direct reference\
    \ to the store:\n\n# Dispatching a simple action\n\n```\nimport { store } from\
    \ './lib/store';\nstore.dispatch({ type: 'MARK_FAVORITE' });\n```\n\n# Passing\
    \ Parameters to Actions\n\nWhile the type property in an action is enough for\
    \ reducers and middleware to know what action to process, in most cases more information\
    \ will be required. For example, instead of sending the INCREMENT_COUNTER action\
    \ 10 times, we could send a single action and specify the amount as an additional\
    \ parameter. Since actions in Redux are more than objects, we are free to add\
    \ as many properties as needed. The only limitation is that the type property\
    \ is required by Redux:\n\n# Standard action object\n\n```\nstore.dispatch({\n\
    \  type: 'MARK_FAVORITE',\n  recipeId: 21\n  ...\n});\n```\n\nThe object passed\
    \ to dispatch() will be available in our reducers:\n\n# Accessing actions in reducers\n\
    \n```\nfunction reducer(state, action) {\n  console.log(action);\n  return state;\n\
    }\n// -> { type: 'MARK_FAVORITE', recipeId: 21, ... }\n```\n\nTo keep our actions\
    \ consistent across a large code base, it is a good idea to define a clear scheme\
    \ for how the action objects should be structured. We will discuss the scheme\
    \ later in this chapter.\n\n# Action Creators\n\nAs our applications grow and\
    \ develop, we will start encountering more and more code like this:"
  - "[PAGE 131]\n\n# Direct object dispatch\n\n```\ndispatch({\n  type: 'ADD_RECIPE',\n\
    \  title: title.trim(),\n  description: description ? description.trim() : ''\n\
    });\n```\n\nIf we use the same action in other places, we will end up duplicating\
    \ the logic in multiple locations. Such code is hard to maintain, as we will have\
    \ to synchronize all the changes between all the occurrences of the action.\n\n\
    A better approach is to keep the action in one place. We can create a function\
    \ that will create the action object for us:\n\n# Function to create action object\n\
    \n```\nconst addRecipe = (title, description = '') => {\n  type: 'ADD_RECIPE',\n\
    \  title: title.trim(),\n  description: description.trim()\n};\n```\n\nNow we\
    \ can use it in our code:\n\n# Using an action creator\n\n```\ndispatch(addRecipe(title,\
    \ description));\n```\n\nAny modification to the content or logic of the action\
    \ can now be handled in one place: the action creation function, also known as\
    \ the action creator.\n\nBeyond improving the maintainability of our applications,\
    \ moving the action object creation to a function allows us to write simpler tests.\
    \ We can test the logic separately from the branch from which the function is\
    \ called.\n\nIn a large project,if not all of our actions will have a corresponding\
    \ action creator function. We will try to never call the dispatch() method by\
    \ handcrafting the appropriate action object, but rather use an action creator.\
    \ This might appear to be a lot of overhead initially, but its value will become\
    \ apparent as the project grows. Also, to help reduce boilerplate, there are a\
    \ number of libraries and concepts that ease the creation and use of action creators.\
    \ Those will be discussed later in this chapter.\n\n# Directory Organization\n\
    \nIn order to better manage our action creators, we will create a separate directory\
    \ for them in our code base. For smaller projects, it may be enough to group actions\
    \ in files according to their usage in reducers:"
- md: "\n# Simple directory structure\n\n```\nactions/\nrecipes.js // Recipe manipulation\
    \ actions\nauth.js // User actions (login, logout, etc.)\n```\n\nBut as projects\
    \ grow in size and complexity, we will subdivide our action creator directory\
    \ structure even more. The common approach is to nest actions based on the data\
    \ type they modify:\n\n# Advanced directory structure\n\n```\nactions/\nrecipes/\n\
    favorites.js // Handle favorite recipe logic\n...\nauth/\nresetting-password.js\
    \ // Handle password reset\npermissions.js // Some actions for permissions\n...\n\
    ```\n\n> At first glance it might look easier to put action creators with their\
    \ corresponding reducers, sometimes even in the same files. While this approach\
    \ might work perfectly in the beginning, it will start breaking down in large\
    \ projects. As the complexity grows, the application might have multiple reducers\
    \ acting on the same action or multiple actions watched by a single reducer. In\
    \ these cases the grouping stops working, and the developer is forced to start\
    \ decoupling some of the actions or moving them, ending up with the structure\
    \ suggested here.\n\n# Flux Standard Actions\n\nAs projects and teams grow in\
    \ size, it is important to create a convention on the structure of action objects.\
    \ To this end, the open-source community has come together to create the Flux\
    \ Standard Action (FSA) specification. The goal is to have consistency across\
    \ both a project and third-party libraries.\n\nThe FSA spec defines the structure\
    \ of actions and a number of optional and required properties. At its base, an\
    \ action should have up to four fields:\n\n# Chapter 8. Actions and Action Creators\n\
    \nFSA object sample\n\n```\nconst action = {\n  type,\n  error,\n  payload,\n\
    \  meta\n};\n```\n\nEach field has a distinct role:\n\n- type is a Redux action\
    \ identifier.\n- The error property is a Boolean that indicates whether the action\
    \ is in an error state. The rationale behind this is that instead of having multiple\
    \ actions, like 'ADD_RECIPE_SUCCESS' and 'ADD_RECIPE_ERROR', we can have only\
    \ one action, 'ADD_RECIPE', and use the error flag to determine the status.\n\
    - payload is an object holding all information needed by the reducers. In our\
    \ example, the title and description would be passed as the payload property of\
    \ the action.\n- The meta property holds additional metadata about the action\
    \ that is not necessarily needed by the reducers, but could be consumed by middleware.\
    \ We will go into detail on how the meta property could be used in the Middleware\
    \ Chapter.\n\nImplemented as an FSA, our action looks like this:\n\nFSA action\
    \ example\n\n```\nstore.dispatch({\n  type: 'ADD_RECIPE',\n  payload: {\n    title:\
    \ 'Omelette',\n    description: 'Fast and simple'\n  }\n});\n```\n\nIf the action\
    \ were in the error state (for example, in the event of a rejected promise or\
    \ API failure), the payload would hold the error itself, it would be an Error()\
    \ object or any other value defining the error:\n\n# Chapter 8. Actions and Action\
    \ Creators\n\nFSA action in error state\n\n```\nconst action = {\n  type: 'ADD_RECIPE',\n\
    \  error: true,\n  payload: new Error('Could not add recipe because...')\n};\n\
    ```\n\n# String Constants\n\nIn Chapter 2 we briefly discussed the issue of using\
    \ string constants. To better illustrate the reasoning behind this approach, let's\
    \ consider the problems that using strings for type can cause in a large base:\n\
    \n- Spelling mistakes—If we spell the same string incorrectly in the action or\
    \ the reducer, action will fire but result in no changes to the state. Worst of\
    \ all, this will be a silent failure without any message to indicate why our action\
    \ failed to produce its desired effect.\n- Duplicates—Another developer, in a\
    \ different part of the code base, might use the same string for an action. This\
    \ will result in issues that are very hard to debug, as our action will suddenly\
    \ change that developer's reducer to fire, creating unexpected changes to the\
    \ state.\n\nTo avoid these issues, we need to ensure a unique naming convention\
    \ for our actions to allow both action creators and reducers to use the exact\
    \ same keys. Since JavaScript doesn't have native enum structures, we use shared\
    \ constants to achieve this goal. All the keys used for type are stored in a single\
    \ constants file and imported by both action creators and reducers. Using a single\
    \ file allows us to rely on itself to catch duplication errors. The file will\
    \ have this form:\n\nconstants/action-types\n\n```\nexport const MARK_FAVORITE\
    \ = 'MARK_FAVORITE';\nexport const ADD_RECIPE = 'ADD_RECIPE';\n...\n```\n\nIn\
    \ large applications the naming convention will be more complicated to allow developers\
    \ freedom to create constants for different parts of the application. Even in\
    \ our simple example, being able to mark both recipes and comments as favorites\
    \ will require two different MARK_FAVORITE actions (e.g., RECIPE__MARK_FAVORITE\
    \ and COMMENT__MARK_FAVORITE):\n\n# Chapter 8. Actions and Action Creators\n\n\
    constants/action-types.js\n\n```\n// Recipes\nexport const ADD_RECIPE = 'ADD_RECIPE';\n\
    export const DELETE_RECIPE = 'DELETE_RECIPE';\nexport const RECIPE__MARK_FAVORITE\
    \ = 'RECIPE__MARK_FAVORITE';\n\n// Comments\nexport const ADD_COMMENT = 'ADD_COMMENT';\n\
    export const DELETE_COMMENT = 'DELETE_COMMENT';\nexport const COMMENT__MARK_FAVORITE\
    \ = 'COMMENT__MARK_FAVORITE';\n...\n```\n\n# Full Action Creators and React Example\n\
    \nHere's the full example code for using action creators:\n\nconstants/action-types.js\n\
    \n```\nexport const MARK_FAVORITE = 'MARK_FAVORITE';\n```\n\nactions/places.js\n\
    \n```javascript\nimport { MARK_FAVORITE } from 'constants/action-types';\nconst\
    \ markFavorite = (recipeId) => ({\n  type: MARK_FAVORITE,\n  recipeId,\n  timestamp:\
    \ Date.now()\n});\n\nexport default markFavorite;\n```\n\n# Chapter 8. Actions\
    \ and Action Creators\n\ncomponents/recipe.js\n\n```javascript\nimport React from\
    \ 'react';\nimport { connect } from 'react-redux';\nimport { markFavorite } from\
    \ 'actions/recipes';\n\nconst Recipe = ({ recipe, dispatch }) => (\n  <li>\n \
    \   <h3>{recipe.title}</h3>\n    <button onClick={() => dispatch(markFavorite(recipe.id))}>\n\
    \      {recipe.favorite ? 'Unlike' : 'Like'}\n    </button>\n  </li>\n);\n\nexport\
    \ default connect()(Recipe);\n```\n\n# Testing Action Creators\n\nSince action\
    \ creators are nothing more than JavaScript functions that should require nothing\
    \ constants and do not rely on state, they are very easy to test. Given the same\
    \ input, they will always return the same output (unlike functions that read state).\
    \ Action creators never modify state directly, but rather only return an object.\
    \ Thus, we can simply pass values to action creators and verify that the correct\
    \ object is returned. Sample test\n\n```javascript\nimport { ADD_RECIPE } from\
    \ 'constants/action-types';\nimport { addRecipe } from 'actions/recipes';\n\n\
    describe('Recipes Actions', () => {\n  it('addRecipe', () => {\n    const title\
    \ = 'Omelette';\n    const description = 'Fast and simple';\n    const expectedAction\
    \ = {\n      type: ADD_RECIPE,\n      title,\n      description\n    };\n    expect(addRecipe(title,\
    \ description)).to.equal(expectedAction);\n  });\n});\n```\n\n# Chapter 8. Actions\
    \ and Action Creators\n\n```javascript\nit('should set timestamp to now if not\
    \ given', () => {\n  const description = 'Fast and simple';\n  const expectedAction\
    \ = {\n    type: ADD_RECIPE,\n    title: 'Untitled',\n    description\n  };\n\
    \  expect(addRecipe(null, description)).to.equal(expectedAction);\n});\n```\n\n\
    More complex action creators might use helper functions to build the action object.\
    \ A simple example might be a helper function trimTitle() that removes whitespace\
    \ from a string and is used by SET_TITLE. We would test the method separately\
    \ from the action creator, only verifying that the action creator called method\
    \ and passed the needed parameters.\n\n# redux-thunk\n\nThe real power of actions\
    \ comes with the use of various middleware (discussed more in the Middleware Chapter).\
    \ One of the most common and useful ones for learning Redux is redux-thunk³. In\
    \ contrast to what we learned actions passed to dispatch() don't have to be objects,\
    \ as the only part of Redux requires actions to be objects is the reducers. Since\
    \ the middleware gets called before an action is passed to the reducers, they\
    \ can take any type of input and convert it into an object.\n\nThis is exactly\
    \ what redux-thunk does. When it notices that the action is of type \"function\"\
    \ instead of \"object\", it calls the function, passing the dispatch() and getState()\
    \ functions as parameters, and passes on the return value of this function as\
    \ the action. That is, it replaces the function with its return value, which should\
    \ be the JavaScript object reducers expect.\n\nAdding redux-thunk to a project\
    \ has two steps:\n\n- 1. Add the middleware to your project by running npm install\
    \ --save redux-thunk.\n- 2. Load the middleware by adding it to the store using\
    \ the applyMiddleware() function:\n\n> ³https://github.com/gaearon/redux-thunk\n"
  mdcn: "\n\n# 简单的目录结构\n\n```\nactions/\nrecipes.js // 菜谱操作动作\nauth.js // 用户动作（登录、注销等）\n\
    ```\n\n但随着项目规模和复杂性的增加，我们将进一步细分 action 创建器的目录结构。通用的方法是根据它们所修改的数据类型对 actions 进行嵌套：\n\
    \n# 高级的目录结构\n\n```\nactions/\nrecipes/\nfavorites.js // 处理收藏菜谱逻辑\n...\nauth/\n\
    resetting-password.js // 处理重置密码\npermissions.js // 一些关于权限的动作\n...\n```\n\n> 初看之下，将\
    \ action 创建器与其对应的 reducer 放在一起可能更简单，有时甚至可以放在同一个文件中。虽然这种方法在开始时可能运行得很好，但在大型项目中会开始失效。随着复杂性的增加，应用程序可能会有多个\
    \ reducer 作用于同一个 action，或者一个 reducer 监听多个 action。在这些情况下，分组将不再起作用，开发者被迫开始解耦某些 action\
    \ 或将它们移动，最终形成此处处建议的结构。\n\n# Flux 标准动作 (Flux Standard Actions)\n\n随着项目和团队规模的扩大，为\
    \ action 对象的结构建立规范变得非常重要。为此，开源社区共同创建了 Flux 标准动作 (FSA) 规范。其目标是确保项目内部和第三方库之间的一致性。\n\
    \nFSA 规范定义了 action 的结构以及一系列可选和必的属性。从底部，一个 action 应该包含最多四个字段：\n\n# 第 8 章 动作与 Action\
    \ 创建器\n\nFSA 对象示例\n\n```\nconst action = {\n  type,\n  error,\n  payload,\n  meta\n\
    };\n```\n\n每个字段都有独特的角色：\n\n- type 是 Redux action 的标识符。\n- error 属性是一个布尔值，指示 action\
    \ 是否处于错误状态。这种设计的背后的原理是，与其拥有多个动作（如 'ADD_RECIPE_SUCCESS' 和 'ADD_RECIPE_ERROR'），我们只需要一个动作\
    \ 'ADD_RECIPE$，并使用 error 标记来判断状态。\n- payload 是一个包含 reducer 需要的所有信息的对象。在我们的示例中，标题和描述将作为\
    \ action 的 payload 属性传递。\n- meta 属性持有关于 action 的额外元数据，这些数据 reducer 并不一定需要，但可以被中间件使用。我们将在中间件章节详细介绍如何使用\
    \ meta 属性。\n\n实现为 FSA 后，我们的 action 看起来如下：\n\nFSA action 示例\n\n```\nstore.dispatch({\n\
    \  type: 'ADD_RECIPE',\n  payload: {\n    title: 'Omelette',\n    description:\
    \ 'Fast and simple'\n  }\n});\n```\n\n如果 action 处于错误状态（例如，在 promise 被拒绝或 API 失败时），payload\
    \ 将包含错误本身，它是一个 Error() 对象或任何定义错误的值：\n\n# 第 8 章 动作与 Action 创建器\n\n错误状态下的 FSA action\n\
    \n```javascript\nconst action = {\n  type: 'ADD_RECIPE',\n  error: true,\n  payload:\
    \ new Error('Could not add recipe because...')\n};\n```\n\n# 字符串常量\n\n在第 2 章中，我们简要讨论了使用字符串常量的问题。为了更好地说明这种方法的原理，让我们考虑一下在大型代码库中使用字符串作为\
    \ type 可能导致的问题：\n\n- 拼写错误——如果我们在 action 或 reducer 中错误地拼写同一个字符串，action 将触发，但状态不会发生任何变化。最糟糕的是，这将导致无声失败，没有任何消息指示为什么我们的\
    \ action 未能产生预期的效果。\n- 重复——另一个开发者在代码库的不同部分可能会为 action 使用相同的字符串。这将导致非常难以调试的问题，因为我们的\
    \ action 会突然触发该开发者的 reducer，从而对状态产生意料之外的变化。\n\n为了避免这些问题，我们需要确保为 action 建立唯一的命名规范，以便\
    \ action 创建器和 reducer 都能使用完全相同的键。由于 JavaScript 没有原生的枚举 (enum) 结构，我们使用共享常量来实现这一目标。所有用于\
    \ type 的键都存储在单个常量文件中，并被 action 创建器和 reducer 导入。使用单个文件允许我们依靠文件本身来捕捉重复错误。该文件的格式如下：\n\
    \nconstants/action-types\n\n```\nexport const MARK_FAVORITE = 'MARK_FAVORITE';\n\
    export const ADD_RECIPE = 'ADD_RECIPE';\n...\n```\n\n在大型应用中，命名规范将更加复杂，以便允许开发者自由地为应用程序的不同部分创建常量。即使在我们简单的示例中，能够将菜谱和注释都标记为收藏也两个不同的\
    \ MARK_FAVORITE action（例如 RECIPE__MARK_FAVORITE 和 COMMENT__MARK_FAVORITE）：\n\n\
    # 第 8 章 动作与 Action 创建器\n\nconstants/action-types.js\n\n```\n// Recipes\nexport\
    \ const ADD_RECIPE = 'ADD_RECIPE';\nexport const DELETE_RECIPE = 'DELETE_RECIPE';\n\
    export const RECIPE__MARK_FAVORITE = 'RECIPE__MARK_FAVORITE';\n\n// Comments\n\
    export const ADD_COMMENT = 'ADD_COMMENT';\nexport const DELETE_COMMENT = 'DELETE_COMMENT';\n\
    export const COMMENT__MARK_FAVORITE = 'COMMENT__MARK_FAVORITE';\n...\n```\n\n\
    # 完整的 Action 创建器与 React 示例\n\n这里是使用 action 创建器的完整示例代码：\n\nconstants/action-types.js\n\
    \n```\nexport const MARK_FAVORITE = 'MARK_FAVORITE';\n```\n\nactions/places.js\n\
    \n```javascript\nimport { MARK_FAVORITE } from 'constants/action-types';\n\nconst\
    \ markFavorite = (recipeId) => ({\n  type: MARK_FAVORITE,\n  payload: recipeId\n\
    });\n\nexport default markFavorite;\n```\n\n# 第 8 章 动作与 Action 创建器\n\ncomponents/recipe.js\n\
    \n```javascript\nimport React from 'react';\nimport { connect } from 'react-redux';\n\
    import { markFavorite } from '../actions/places';\n\nconst Recipe = ({ recipe,\
    \ dispatch }) => (\n  <li>\n    <h3>{recipe.title}</h3>\n    <button onClick={()\
    \ => dispatch(markFavorite(recipe.id))}>\n      {recipe.favorite ? 'Unlike' :\
    \ 'Like'}\n    </button>\n  </li>\n);\n\nexport default connect()(Recipe);\n```\n\
    \n# 测试 Action 创建器\n\n由于 action 创建器只是不依赖状态的 JavaScript 函数，它们非常容易测试。示例测试\n\n```javascript\n\
    import { ADD_RECIPE } from '../constants/action-types';\nimport { addRecipe }\
    \ from '../actions/recipes';\n\ndescribe('Recipes Actions', () => {\n  it('addRecipe',\
    \ () => {\n    const title = 'Omelette';\n    const description = 'Fast and simple';\n\
    \    const expectedAction = {\n      type: ADD_RECIPE,\n      title,\n      description\n\
    \    };\n    expect(addRecipe(title, description)).to.equal(expectedAction);\n\
    \  });\n});\n```\n\n# 第 8 章 动作与 Action 创建器\n\n```javascript\n  it('should set\
    \ timestamp to now if not given', () => {\n    const description = 'Fast and simple';\n\
    \    const expectedAction = {\n      type: ADD_RECIPE,\n      title: 'Untitled',\n\
    \      description\n    };\n    expect(addRecipe(null, description)).to.equal(expectedAction);\n\
    \  });\n```\n\n更复杂的 action 创建器可能会使用辅助函数来构建 action 对象。一个简单的示例可能是辅助函数 trimTitle()，它可以删除字符串中的空格并用于\
    \ SET_TITLE。我们将单独测试该方法，只需验证 action 创建器调用了该方法并传递了所需的参数。\n\n# redux-thunk\n\naction\
    \ 的真正威力来自于使用各种中间件（在中间件章节详细介绍）。学习 Redux 最常用且有用之一是 redux-thunk³。与我们学到的相反，传递给 dispatch()\
    \ 的 action 不需要是对象，因为 Redux 中只有 reducer 要求 action 是对象。由于中间件在 action 传递给 reducer\
    \ 之前调用，它可以接收任何类型的输入并转换为对象。\n\n这正是 redux-thunk 所做的。当它发现 action 类型为“函数”而不是“对象”时，它调用该函数，并将\
    \ dispatch() 和 getState() 函数作为参数传递，然后将函数的返回值作为 action 传递。也就是说，它用返回值替换函数，该返回值应该是\
    \ reducer 预期的 JavaScript 对象。\n\n将 redux-thunk 添加到项目有两个步骤：\n\n- 1. 运行 `npm install\
    \ --save redux-thunk` 将中间件添加到项目中。\n- 2. 通过使用 `applyMiddleware()` 函数将中间件加载到 store\
    \ 中：\n\n> ³https://github.com/gaearon/redux-thunk\n\n"
