- md: "\n# Sample Flow\n\nA simple way to implement authentication might be to send\
    \ an API action to our server containing an email and a password:\n\nSample action\
    \ to authenticate with the server\n\n```\ndispatch({\n  type: API,\n  payload:\
    \ {\n    url: 'login',\n    method: 'POST',\n    success: LOGIN_SUCCESS,\n   \
    \ data: {\n      email: 'info@redux-book.com',\n      password: 'top secret'\n\
    \    }\n  }\n});\n```\n\nIf successful, our API Middleware will dispatch the LOGIN_SUCCESS\
    \ action containing the information returned from the server:\n\nAction dispatched\
    \ on successful login\n\n```\n{\n  type: LOGIN_SUCCESS,\n  payload: {\n    token:\
    \ 'xxxYYYzzzz'\n  }\n}\n```\n\nOur user's reducer will probably act on this action\
    \ to add the token to the state - to be passed in headers of future API requests\
    \ to the server.\n\nTo make WebSockets authenticate using this token, we can add\
    \ special code to our WebSocket API that will check for LOGIN_SUCCESS (and LOGOUT_SUCCESS)\n\
    \n# Chapter 5. WebSockets\n\nAuthentication code in the WebSocket middleware\n\
    \n```\nif (action.type === LOGIN_SUCCESS) {\n  dispatch({\n    type: WEBSOCKET_AUTH,\n\
    \    payload: action.payload.token,\n    meta: { websocket: true }\n  });\n}\n\
    \nif (action.type === LOGOUT_SUCCESS) {\n  dispatch({\n    type: WEBSOCKET_LOGOUT,\n\
    \    meta: { websocket: true }\n  });\n}\n```\n\nNow the passage of LOGIN_SUCCESS\
    \ will cause a new WebSocket enabled action to be dispatched and processed by\
    \ our middleware to authenticate with the server.\n\nThe flow of actions\n\n-\
    \ Store:\n  { type: API, payload: ... }\n- Server:\n  POST http://../login\n-\
    \ Store:\n  { type: LOGIN_SUCCESS, payload: token }\n- Store:\n  { type: WEBSOCKET_AUTH,\
    \ payload: token, meta: { websocket: true } }\n- WebSocket:\n  { type: WEBSOCKET_AUTH,\
    \ payload: token }\n\n# Notes\n\nFor a full flow of the WebSocket middleware,\
    \ it would be best to keep track of the authentication state of the WebSocket\
    \ and prevent actions from being sent or received before the WebSocket has been\
