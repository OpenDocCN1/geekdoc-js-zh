- md: "\n# Chapter 9. Reducers\n\nThe last approach is to use special helper functions\
    \ that can receive a regular object and an instruction on how to change it and\
    \ return a new object as result. There is an immutability helper* named `update()`.\
    \ Its syntax might look a bit weird, but if you don't want to work with immutable\
    \ objects and clog object prototypes of new functions, it might be a good option.\n\
    \nExample of the update function\n\n```javascript\nimport update from 'immutability-helper';\n\
    \nconst newData = update(myData, {\n  x: { y: { z: {$set: 7} }},\n  a: { b: {$push:\
    \ [9]} } }\n});\n```\n\n# Higher-Order Reducers\n\nThe power of Redux is that\
    \ it allows you to solve complex problems using functional programming. One approach\
    \ is to use higher-order functions. Since reducers are nothing more than pure\
    \ functions, we can wrap them in other functions and create very simple solutions\
    \ for very complicated problems.\n\nThere are a few good examples of using higher-order\
    \ reducers—for example, for implementing undo/redo functionality. There is a library\
    \ called redux-undo* that takes your reducer and enhances it with functionality.\
    \ It creates three substates: past, present, and future. Every time your reducer\
    \ creates a new state, the previous one is pushed to the past states and the new\
    \ becomes the present state. You can use special actions to undo, redo, or reset\
    \ the present state.\n\nUsing a higher-order reducer is as simple as passing your\
    \ reducer into an imported function:\n\n```javascript\nimport { combineReducers\
    \ } from 'redux';\nimport recipesReducer from 'reducers/recipes';\nimport ingredientsReducer\
    \ from 'reducers/ingredients';\nimport undoable from 'redux-undo';\n\nconst rootReducer\
    \ = combineReducers({\n  recipes: undoable(recipesReducer),\n  ingredients: ingredientsReducer\n\
    });\n```\n\n> *https://github.com/kolodny/immutability-helper*\n\n> **https://github.com/omnidan/redux-undo*\n\
    \n# Chapter 9. Reducers\n\nAnother example of a higher-order reducer is redux-ignore*.\
    \ This library allows your reducers to immediately return the current state without\
    \ handling the passed action, or to handle only a defined subset of actions.\n\
    \nThe following example will disable removing recipes from our recipe book. You\
    \ might even use it to filter allowed actions based on user roles:\n\nUsing the\
    \ ignoreActions() higher-order reducer\n\n```javascript\nimport combineReducers\
    \ from 'redux';\nimport recipesReducer from 'reducers/recipes';\nimport ingredientsReducer\
    \ from 'reducers/ingredients';\nimport ignoreActions from 'redux-ignore';\nimport\
    \ { REMOVE_RECIPE } from 'constants/action-types';\n\nconst rootReducer = combineReducers({\n\
    \  recipes: ignoreActions(recipesReducer, [REMOVE_RECIPE]),\n  ingredients: ingredientsReducer\n\
    });\n```\n\n# Testing Reducers\n\nThe fact that reducers are pure functions allows\
    \ us to write small and concise tests for them. To test a reducer we need to define\
    \ an initial state, an action and the state we expect to have. Calling the reducer\
    \ with the first two should always produce the expected state.\n\nThis idea works\
