    \ but the createStore() API has changed and it now supports an optional parameter\
    \ for a store decorator.\n\n## Higher-Order Functions\n\nBefore we proceed, let’s\
    \ do a quick overview of what higher-order functions are. We can define the term\
    \ as referring to a function that takes one or more functions as arguments, returns\
    \ a function as its result, or does both. Here’s an example:\n\nSample higher-order\
    \ function\n\n```javascript\nfunction output(message) {\n  console.log(message);\n\
