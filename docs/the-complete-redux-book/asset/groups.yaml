    \ to addRecipe() that will take care of creating the appropriate FSA-compliant\
    \ action depending on whether the promise is resolved or rejected:\n\nPassing\
    \ a promise to an action creator\n\n```\nreturn () => addRecipe(\n  fetch('/recipes',\n\
    ```\n\nOur only use of then() is to convert the data we get from fetch() into\
    \ JSON:\n\nAdding another stage to promise resolution\n\n```\n.then(response =>\
    \ response.json())\n```\n\nThis line doesn't return data, but only modifies the\
    \ promise that we return from the action creator and that the caller will send\
    \ to dispatch().\n\n# Summary\n\nIn this chapter we covered action creators, the\
    \ fuel running our application's engine. We saw Redux is all about simplicity—actions\
    \ are plain objects and action creators are just functions returning plain objects.\n\
    \nWe also saw how we can benefit from ES2016 by dramatically simplifying our syntax.\n\
    \nIn the next chapter we will look at reducers, the components of our Redux application\
