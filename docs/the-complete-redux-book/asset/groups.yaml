- md: "\n## Chapter 1. Core Concepts of Flux and Redux\n\n## Implementation of the\
    \ dispatch API\n\n```javascript\nlet state = null;\nfunction dispatch(action)\
    \ {\n  const newState = reducer(state, action);\n\n  if (newState !== state) {\n\
    \    state = newState;\n\n    listeners.forEach(listener => listener());\n  }\n\
    }\n```\n\nAgain, it is very important to note that we expect a reducer to create\
    \ a new state and not just modify the existing one. We will be using a simple\
    \ comparison by reference to check whether the state has changed.\n\nOne remaining\
    \ task is to notify our view of the state change. In our example we only have\
    \ a single listener, but we could implement full listener support by allowing\
    \ multiple callbacks to register for the \"state change\" event. We will implement\
    \ this by keeping a list of all the registered callbacks.\n\n## Implementation\
    \ of the subscribe API\n\n```javascript\nconst listeners = [];\nfunction subscribe(callback)\
    \ {\n  listeners.push(callback);\n}\n```\n\nThis might surprise you, but we have\
    \ just implemented the major part of the Redux framework. The real code^11 isn't\
    \ much longer, and we highly recommend that you take half an hour to read it.\n\
    \n## Using the Real Redux\n\nTo complete our example, let's switch to the real\
    \ Redux library and see how similar the solution remains. First we'll add the\
    \ Redux library, for now using CDNJS:\n\n> ^11:https://github.com/reactjs/redux/tree/master/src\n\
    \n## Adding Redux to a project\n\n```html\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/redux/3.6.0/redux.min.js\"\
    ></ />\n```\n\nWe will change our previous state definition to be a constant that\
    \ only defines the initial value of the state:\n\n### The initial state\n\n```javascript\n\
    const initialState = {\n  counter: 3\n};\n```\n\nWe can use it to create a Redux\
    \ store\n\n### Creating a Redux store\n\n```javascript\nconst store = Redux.createStore(reducer,\
    \ initialState);\n```\n\nAs you can see, we are using our Redux from before. The\
    \ only change that needs to be made to the reducer is the switch statement. Instead\
    \ of doing:\n\n### Previous reducer code\n\n```javascript\nswitch (action)\n```\n\
    \nChanges to\n\n### New reducer code\n\n```javascript\nswitch (action.type)\n\
    ```\n\nThe reason behind this is that actions in Redux are objects that have the\
