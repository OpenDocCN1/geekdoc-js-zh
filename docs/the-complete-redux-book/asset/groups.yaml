    \nFavorite recipes selector\n\n```javascript\nconst getFavorites = (state) =>\n\
    \  state.recipes.filter(recipe => recipe.favorite);\n```\n\nThe main improvement\
    \ is that we do not need to be aware of the structure of the state to access deeply\
    \ nested information. Rather, we treat our state as a conventional database from\
    \ which to extract information for the UI.\n\n## Keeping a Normalized State\n\n\
    While normalized state might seem like a great idea, often the data returned from\
    \ the server is structured in a deeply nested way. A possible example of fetching\
    \ data from the /recipes/123 API endpoint might look like this:\n\n### Data returned\
    \ from /recipes/123\n\n```javascript\n{\n  id: 63,\n  name: 'Omelette',\n  favorite:\
    \ true,\n  preparation: 'How to prepare...',\n  ingredients: [\n    {\n      id:\
    \ 152,\n      name: 'Egg',\n      quantity: 2\n    },\n    {\n      id: 121,\n\
    \      name: 'Milk',\n      quantity: 'cups'\n    }\n  ]\n}\n```\n\nSince the\
    \ only way to update the Redux store is by sending actions to the reducers, we\
    \ must build a payload that can be easily handled by our reducers and find a way\
    \ to extract the payload from the denormalized server data.\n\n### Building the\
    \ Generic Action\n\nPotentially, we would like each of our reducers to be able\
    \ to handle a special UPDATE_DATA action and extract the relevant parts:\n\nSample\
    \ UPDATE_DATA action\n\n```javascript\nconst updateData = ({\n  type: UPDATE_DATA,\n\
    \  payload: {\n    recipes: {\n      63: {\n        name: 'Omelette',\n      \
    \  favorite: true,\n        preparation: 'How to prepare...',\n        ingredients:\
    \ [\n          {\n            id: 152,\n            name: 'Egg',\n           \
    \ quantity: 2\n          },\n          {\n            id: 121,\n            name:\
    \ 'Milk',\n            quantity: 'cups'\n          }\n        ]\n      }\n   \
    \ },\n    ingredients: {\n      152: {\n        name: 'Egg',\n        quantity:\
    \ 2\n      },\n      121: {\n        name: 'Milk',\n        quantity: 'cups'\n\
    \      }\n    }\n  }\n});\n```\n\nUsing this approach, our recipes reducer's support\
    \ for UPDATE_DATA can be as simple as:\n\nRecipes reducer for UPDATE_DATA\n\n\
    ```javascript\nconst recipesReducer = (state, action) => {\n  switch (action.type)\
    \ {\n    case UPDATE_DATA:\n      if (!('recipes' in action.payload)) return state;\n\
    \      return Object.assign({}, state, {\n        recipes: Object.assign({}, state.recipes,\
    \ action.payload.recipes)\n      });\n  }\n};\n```\n\nOur reducer checks if the\
    \ payload contains any recipes and merges the new data with the old object (thus\
    \ adding or modifying as needed).\n\n## Normalizing the Data\n\nWith the reducers\
    \ updated and the action structure defined, we are left with the problem of extracting\
    \ the payload from the denormalized data got from the server. A simple approach\
    \ might be to have a custom function that knows each API's return data and normalizes\
    \ the returned JSON into a flat structure with custom code.\n\nSince this is quite\
    \ a common practice, the custom code can be replaced by a normalizer library.\
    \ Using this library, we can define the schema of the data coming from the server\
    \ and have our nested JSON turned into a normalized structure we can pass directly\
    \ into our UPDATE_DATA action.\n\n## Persisting State\n\nIn many cases, we will\
    \ want to keep the current state across a page refresh or the application's tab\
    \ being closed. The simplest approach to persisting the state is keeping it in\
    \ the browser's local storage.\n\nTo easily sync our state with local storage\
    \ (or any other storage engine), we can use the redux-persist library. This will\
    \ automatically serialize and save our state once it has been modified.\n\nTo\
    \ use the library, simply install it with npm and modify the store creation file\
    \ to wrap createStore with an enhancer:\n\nSetting up redux-persist\n\n```javascript\n\
    import { createStore } from 'redux';\nimport { persistStore, autoRehydrate } from\
    \ 'redux-persist';\nimport rootReducer from 'reducers/root';\n\nconst store =\
    \ createStore(rootReducer, autoRehydrate());\npersistStore(store);\n```\n\nOnce\
    \ persistStore(store) has been called, our store and the browser's local storage\
    \ will automatically be in sync and our state will persist across page refresh.\n\
    \n## Advanced State Sync\n\nThe redux-persist library has advanced functionality\
    \ that will allow us to whitelist only part of the state to persist and specify\
    \ special serializers for the part of the state that cannot be serialized with\
    \ JSON.stringify() (functions, symbols, etc.). We recommend reviewing the library's\
    \ documentation for the most advanced features.\n\n> ¹⁷ https://github.com/paularmstrong/normalizr\n\
    > ¹⁸ https://github.com/rt2rz/redux-persist\n\n## Real-World State\n\nIn a real-world\
    \ application, our state will usually contain a number of different entities,\
    \ including the application data itself (preferably normalized) and auxiliary\
    \ data (e.g., current access token, pending notifications, etc.).\n\n## Structure\
    \ of a Common State\n\nUnlike the data coming from the server, some information\
    \ will be used exclusively by our frontend application for its internal needs.\
    \ A common example would be keeping the total number of active server requests\
    \ in order to know whether to display a spinner. Or we might have a currentUser\
    \ property where we keep information about the current user, such as the username\
    \ and access token:\n\nSample state\n\n```javascript\nconst state = {\n  books:\
    \ {},\n  recipes: {},\n  ingredients: {},\n  ui: {\n    activeRequests: 0\n  },\n\
    \  currentUser: {\n    name: 'Kipi',\n    access: 'topsecrettoken'\n  }\n};\n\
    ```\n\nAs our application grows, more types of state entities will creep in. Some\
    \ of these will come from external libraries like redux-forms, react-redux-router,\
    \ and others that require their own place in our state. Other entities will come\
    \ from the application's business needs.\n\nFor example, if we need to support\
    \ editing of the user's profile with the option to cancel, our implementation\
    \ might create a new temp key where we will store a copy of the profile while\
    \ it is being edited. Once the user clicks \"confirm\" or \"cancel\", the temp\
    \ copy will either be copied over to become the new profile or simply deleted.\n\
    \n## Keeping the State Manageable\n\nTo make things as simple as possible, it\
    \ is best to have a reducer for each key in the base state. This will allow for\
    \ an encapsulation approach where it is immediately clear who can modify parts\
    \ of our state.\n\nFor a very large project, it might be beneficial to separate\
    \ the \"server data\" and the \"auxiliary/temp data\" under different root keys:\n"
