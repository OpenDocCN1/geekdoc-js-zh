    \nThe Redux store will also give you all the features we implemented ourselves\
    \ before, like subscribe() and dispatch(). Thus, we can safely delete these methods.\n\
    \nTo subscribe to store changes, we will simply call the subscribe() method of\
    \ the store:\n\n### Subscribing to store updates\n\n```javascript\nstore.subscribe(updateView);\n\
    ```\n\nSince subscribe() does not pass the state to the callback, we will need\
    \ to access it store.getState():\n\n### Update view by getting the state out of\
    \ the store\n\n```javascript\n// Update view (this might be React in a real app)\n\
    function updateView() {\n  document.querySelector('#counter').innerText = store.getState().counter;\n\
    }\nstore.subscribe(updateView);\n```\n\nThe last change is in the dispatch() method.\
    \ As mentioned previously, our actions now need to have the type property. Thus,\
    \ instead of simply sending the string 'INC' as the action, we now need to send\
    \ { type: 'INC' }.\n\n## The Complete Example\n\n### The HTML\n\n```html\n<script\
    \ src=\"https://cdn.cloudflare.com/ajax/libs/redux/3.6.0/redux.min.js\"></script>\n\
