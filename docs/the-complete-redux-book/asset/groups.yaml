    \ - 1]\n    const rest = funcs.slice(0, -1)\n\n    return rest.reduceRight(\n\
    \      (composed, f) => f(composed),\n      last(...args)\n    )\n  }\n}\n```\n\
    \n## Store Enhancers（增强器）\n\nStore 增强器是用于增强 Redux store 默认行为的高阶函数。与中间件和 reducer\
    \ 不同，它们可以访问所有的内部 store 方法（即使是中间件无法使用的方法，如 `subscribe()`）。\n\n举几个例子，存在以下 store\
    \ 增强器：\n\n- Store 同步（浏览器标签之间甚至网络客户端之间）\n- 状态持久化\n- 与开发者工具集成\n\n让我们构建一个示例增强器，它可以持久化状态并从\
