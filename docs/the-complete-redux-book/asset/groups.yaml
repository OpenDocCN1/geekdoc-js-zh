    \ timedOutput = addTimestamp(output);\n```\n\n```javascript\n13 timedOutput('Hello\
    \ World!');\n```\n\n```javascript\n16 > Executed at: 1469000000001\n```\n\n```javascript\n\
    17 > Hello World!\n```\n\n`output()` 函数将我们的消息打印到控制台。`addTimestamp()` 函数是一个阶函数，它可以接收任何其他函数并记录执行时间。将\
    \ `output()` 作为参数调用 `addTimestamp()` 创建了一个增强功能的新“包装”函数。它仍然具有原始 `output()` 函数的签名，但现在还会打印时间戳。\n\
    \n## compose()\n\n高阶函数在 Redux 应用中非常常见，因为它允许我们轻松地扩展代码其他部分的行为。看这个想象的示例，我们必须用三个包装器包裹我们的原始函数：\n\
    \n多次装饰\n\n```javascript\n1 const wrapped = third(second(first(originalFn)));\n\
    ```\n\n```javascript\n3 wrapped();\n```\n\n使用多个装饰器是一种有效且实用的方法，但生成的代码可能难以阅读，并且看起来有些繁琐。相反，Redux\
    \ 提供了 `compose()` 函数来更简洁地处理多个包装器：\n\n使用 compose 的多个包装\n\n```javascript\n1 import\
