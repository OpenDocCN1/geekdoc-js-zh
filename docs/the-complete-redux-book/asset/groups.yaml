  - "[PAGE 102]\n\n# Action Creators and Reducers\n\nWhen writing unit tests it is\
    \ recommended to test each part of the system separately and only test connections\
    \ and interfaces in the integration tests. In the case of Redux, though, it is\
    \ worth considering the connection between action creators and reducers.\n\nIn\
    \ the current we've built our tests, the ADD_RECIPE action object is defined in\
    \ three different places: the recipe's action creators, the recipe's tests, and\
    \ the reducer's tests.\n\nIf, in the future, we decide to change the structure\
    \ of the ADD_RECIPE action, our action creator will catch the change and remind\
    \ us to update the test code. But the reducer's tests will continue to pass unless\
    \ we remember to change the hardcoded ADD_RECIPE action objects used in those\
    \ tests as.\n\nThis can lead to painful cases where all the tests pass, but the\
    \ system doesn't work. To avoid this, we stop using hardcoded action objects in\
    \ reducers and rely on action creators directly:\n\n```\nit('should add recipe\
    \ to empty list', () => {\n  expect(reducer(initialState, addRecipe('test'))).toMatchSnapshot();\n\
    });\n\nit('should add recipe to empty list', () => {\n  const baseState = deepFreeze(reducer(initialState,\
    \ addRecipe('first')));\n  expect(reducer(baseState, addRecipe('test'))).toMatchSnapshot();\n\
    });\n```\n\nWhile repeating the unit test, combining the reducers with action\
    \ creators results in cleaner code, fewer bugs, and less duplication.\n\n# Unknown\
    \ Actions\n\nOne last issue to test with reducers is that they gracefully handle\
    \ unknown actions and return the original state passed to them without modifications.\n\
    \n> every action can propagate to the whole reducer tree, it is important for\
    \ the reducer to return the original state and not a modified copy. This will\
    \ allow UI libraries to identify changes in the tree using reference comparison.\n\
    \nWe can do this as follows:"
  - "[PAGE 103]\n\n# Unknown actions test\n\n```\nit('should handle unknown actions',\
    \ () => {\n  expect(reducer(initialState, { type: 'FAKE' })).toBe(initialState);\n\
    });\n```\n\nAn important thing to note about this test is the use of .toBe() instead\
    \ of .toEqual() or .toMatchSnapshot(). Unlike the others, .toBe() expects the\
    \ result of the reducer to be the exact same object, not a similar object with\
    \ the data:\n\n# Example of use toBe\n\n```\nconst a = { name: 'Kipi' };\nconst\
    \ b = { name: 'Kipi' };\n```\n\n```\nit('passing test', () => {\n  expect(a).toEqual(b);\n\
    });\nit('failing test', () => {\n  expect(a).toBe(b);\n});\n```\n\nThe main goal\
    \ of this test is to verify that our reducer returns the original state if the\
    \ action sent was not intended for:\n\n# Correct reducer code\n\n```\nconst reducer\
    \ = (state = initialState, action) => {\n  switch(action.type) {\n    case ADD_RECIPE:\
    \ return state.concat({ title: action.payload });\n  }\n  return state;\n};\n\
    ```\n\n# Testing Middleware\n\nMiddleware are where of the complex logic of our\
    \ application will reside. Since they have full access to the store's dispatch()\
    \ and getState() methods as well as control over the actions' flow via next(),\
    \ middleware can become quite complex with nontrivial asynchronous flows."
  - "[PAGE 104]\n\n# Middleware Test Structure\n\nAt their core middleware are functions\
    \ that receive actions to process, albeit with a complicated signature (a function,\
    \ returning a function, returning a function). The first two function calls are\
    \ made by Redux during startup. Only the last call is made dynamically, when new\
    \ actions need to be processed. The basic signature looks like this:\n\nMiddleware\
    \ signature\n\n```\nfunction sampleMiddleware({ dispatch, getState }) {\n  return\
    \ function nextWrapper(next) {\n    return function innerCode(action) {\n    \
    \  // TODO: Implement the middleware\n    }\n    next(action);\n  }\n}\n```\n\n\
    To test middleware we will need to mock dispatch(), getState(), and mock() and\
    \ call sampleMiddleware() and nextWrapper() to get our test target, the innerCode()\
    \ function:\n\nSetting up middleware for tests\n\n```\nconst next = jest.fn();\n\
    const dispatch = jest.fn();\nconst getState = jest.fn();\nconst middleware = apiMiddleware({\
    \ dispatch, getState })((next);\n```\n\nWe can now use the regular Jest tests\
    \ to test the middleware() function we built by calling it with action objects:\n\
    \nSimple middleware test call\n\n```\nit('should process action', () => {\n  const\
    \ next = jest.fn();\n  const dispatch = jest.fn();\n  const getState = jest.fn();\n\
    \  const middleware = sampleMiddleware({ dispatch, getState })(next);\n  const\
    \ sampleAction = { type: 'SAMPLE_ACTION' };\n  middleware(sampleAction);\n```"
