    \n  $(document).on('click', '.recipes > button', handleAdd);\n  updateUI();\n\
    }\n```\n\n## Chapter 2. Your First Redux Application\n\n## Logging\n\nNow that\
    \ our UI allows us to add new recipes, we find that it's hard to see what actions\
