  - '[PAGE 132]


    # Simple directory structure


    ```

    actions/

    recipes.js // Recipe manipulation actions

    auth.js // User actions (login, logout, etc.)

    ```


    But as projects grow in size and complexity, we will subdivide our action creator
    directory structure even more. The common approach is to nest actions based on
    the data type they modify:


    # Advanced directory structure


    ```

    actions/

    recipes/

    favorites.js // Handle favorite recipe logic

    ...

    auth/

    resetting-password.js // Handle password reset

    permissions.js // Some actions for permissions

    ...

    ```


    > At first glance it might look easier to put action creators with their corresponding
    reducers, sometimes even in the same files. While this approach might work perfectly
    in the beginning, it will start breaking down in large projects. As the complexity
    grows, the application might have multiple reducers acting on the same action
    or multiple actions watched by a single reducer. In these cases the grouping stops
    working, and the developer is forced to start decoupling some of the actions or
    moving them, ending up with the structure suggested here.


    # Flux Standard Actions


    As projects and teams grow in size, it is important to create a convention on
    the structure of action objects. To this end, the open-source community has come
    together to create the Flux Standard Action (FSA) specification. The goal is to
    have consistency across both a project and third-party libraries.


    The FSA spec defines the structure of actions and a number of optional and required
    properties-party. At its base, an action should have up to four fields:'
  - "[PAGE 133]\n\n# Chapter 8. Actions and Action Creators\n\nFSA object sample\n\
    \n```\nconst action = {\n  type,\n  error,\n  payload,\n  meta\n};\n```\n\nEach\
    \ field has a distinct role:\n\n+   - type is a Redux action identifier.\n- The\
    \ error property is a Boolean that indicates whether the action is in an error\
    \ state. The rationale behind this is that instead of having multiple actions,\
    \ like 'ADD_RECIPE_SUCCESS' and 'ADD_RECIPE_ERROR', we can have only one action,\
    \ 'ADD_RECIPE', and use the error flag to determine the status.\n- payload is\
    \ an object holding all information needed needed the reducers. In our example,\
    \ the title and description would be passed as the payload property of the action.\n\
    - The meta property holds additional metadata about the action that is not necessarily\
    \ needed by the reducers, but could be consumed by middleware. We will go into\
    \ detail on how the meta property could be used in the Middleware Chapter.\n\n\
    Implemented as an FSA, our action looks like this:\n\nFSA action example\n\n```\n\
    store.dispatch({\n  type: 'ADD_RECIPE',\n  payload: {\n    title: 'Omelette',\n\
    \    description: 'Fast and simple'\n  }\n});\n```\n\nIf the action were in the\
    \ error state (for example, in the event of a rejected promise or API failure),\
    \ the payload would hold the error itself, it be an Error() object or any other\
    \ value defining the error:"
  - "[PAGE 134]\n\nChapter 8. Actions and Action Creators\n\nFSA action in error state\n\
    \n```\nconst action = {\n  type: 'ADD_RECIPE',\n  error: true,\n  payload: new\
    \ Error('Could not add recipe because...')\n};\n```\n\n# String Constants\n\n\
    In Chapter 2 we briefly discussed the issue of using string constants. To better\
    \ illustrate the reasoning behind this approach, let's consider the problems that\
    \ using strings for type can cause in a large base:\n\n+   - Spelling mistakes—If\
    \ we spell the same string incorrectly in the action or the reducer, action will\
    \ fire but result in no changes to the state. Worst of all, this will be a silent\
    \ failure without any message to indicate why our action failed to produce its\
    \ desired effect.\n- Duplicates—Another developer, in a different part of the\
    \ code base, might use the same string for an action. This will result in issues\
    \ that are very hard to debug, as our action will suddenly change that developer's\
    \ reducer to fire, creating unexpected changes to the state.\n\nTo avoid these\
    \ issues, we need to ensure a unique naming convention for our actions to allow\
    \ both action creators and reducers to use the exact same keys. Since JavaScript\
    \ doesn't have native enum structures, we use shared constants to achieve this\
    \ goal. All the keys used for type are stored in a single constants file and imported\
    \ by both action creators and reducers. Using a single file allows us to rely\
    \ on itself to catch duplication errors. The file will have this form:\n\nconstants/action-types\n\
    \n```\nexport const MARK_FAVORITE = 'MARK_FAVORITE';\nexport const ADD_RECIPE\
    \ = 'ADD_RECIPE';\n...\n```\n\nIn large applications the naming convention will\
    \ be more complicated to allow developers freedom to create constants for different\
    \ parts of the application. Even in our simple example, being able to mark both\
    \ recipes and comments as favorites will require two different MARK_FAVORITE actions\
    \ (e.g., RECIPE__MARK_FAVORITE and COMMENT__MARK_FAVORITE):"
