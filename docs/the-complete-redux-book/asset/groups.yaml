    \ further, the implementation of UPDATE_RECIPE would not require any change to\
    \ the recipes reducer, as it is wholly handled by the recipes reducer.\n\n## Access\
    \ to Multiple Nested Data Entities\n\nGetting a list of favorite recipes is much\
    \ simpler in the normalized state, as we only need to scan the recipes \"table\"\
    . This can be done in the UI using a function called a selector. If you think\
