    \ 是具有特殊 `type` 属性的对象，这使得 reducer 的创建和 action 的数据更加一致。\n\nRedux store 还会提供我们之前自己实现的所有功能，如\
    \ `subscribe()` 和 `dispatch()`。因此，我们可以安全地删除这些方法。\n\n要订阅 store 的变化，我们只需调用 store\
    \ 的 `subscribe()` 方法：\n\n### 订阅 store 更新\n\n```javascript\nstore.subscribe(updateView);\n\
    ```\n\n由于 `subscribe()` 不会将状态传递给回调函数，我们需要通过 `store.getState()` 来访问它：\n\n### 通过从\
    \ store 获取状态来更新视图\n\n```javascript\n// 更新视图（在实际应用中这可能是 React）\nfunction updateView()\
