    \ action 能够到达 reducer：\n\n验证未知动作被正确处理\n\n```javascript\nit('should ignore non-API\
    \ actions', () => {\n  const sampleAction = { type: 'SAMPLE_ACTION' };\n\n  middleware(sampleAction);\n\
    \  expect(dispatch.mock.calls.length).toBe(0);\n  expect(next.mock.calls).toEqual([sampleAction]);\n\
    });\n```\n\n在这里我们验证了 `dispatch()` 始终未被调用，且 `next()` 正好被调用一次并传入了我们的 sampleAction。由于我们在测试中会频繁使用\
    \ `dispatch.mock.calls` 和 `next.mock.calls`，可以通过在设置代码中添加以下内容来简化它：\n\n改进设置代码\n\n\
    ```javascript\nlet next, dispatch, middleware, dispatchCalls, nextCalls;\nbeforeEach(()\
