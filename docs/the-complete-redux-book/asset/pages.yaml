  md: "# Chapter 10. Middleware\n\n# Store setup\n\n```\ncreateStore(reducer,\n  applyMiddleware(\n\
    \    middlewareA,\n    middlewareB,\n    middlewareC\n  )\n);\n```\n\nCalling\
    \ next(action) within middlewareB will cause the action to be passed to middlewareC\
    \ and then the reducer.\n\nCalling dispatch(action) within middlewareB will cause\
    \ the action to be passed to middlewareA, then middlewareB, middlewareC, and finally\
    \ to the reducer, returning the execution back to middlewareB.\n\nCalling dispatch()\
    \ multiple times is a common and valid practice. next() can also be called more\
    \ than once, this is not recommended as any action passed to next() will skip\
    \ the middleware before the current one (for example, skipping the logging middleware).\n\
    \n# Parameter-Based Middleware\n\nBeyond the middleware we've discussed so far\
    \ in this chapter, some middleware might be reusable and support parameters being\
    \ passed during their creation.\n\nFor example, the nullMiddleware we created\
    \ earlier in this chapter:\n\nSimple null middleware\n\n```\nconst nullMiddleware\
    \ = () => next => action => {\nnext(action !== null ? action : { type: 'UNKNOWN'\
    \ });\n};\n```\n\n```\nexport default nullMiddleware;\n```\n\nThe 'UNKNOWN' key\
    \ is hardcoded in our middleware and will not allow easy reuse in our projects.\
    \ To make this middleware more generic, we might want to be able to support arbitrary\
    \ action types and use the applyMiddleware() stage to specify how we want our\
    \ middleware to behave:"
