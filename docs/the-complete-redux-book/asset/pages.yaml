  md: "# Real-World State\n\nIn a real-world application, our state will usually contain\
    \ a number of different entities, including the application data itself (preferably\
    \ normalized) and auxiliary data (e.g., current access token, pending notifications,\
    \ etc.).\n\n# Structure of a Common State\n\nUnlike the data coming from the server,\
    \ some information will be used exclusively by our frontend application for its\
    \ internal needs. A common example would be keeping the total number of active\
    \ server requests in order to know whether to display a spinner. Or we might have\
    \ a currentUser property where we keep information about the current user, such\
    \ as the username and access token:\n\nSample state\n\n```\nconst state = {\n\
    \  books: {},\n  recipes: {},\n  ingredients: {},\n  ui: {\n    activeRequests:\
    \ 0\n  },\n  currentUser: {\n    name: 'Kipi',\n    access:: 'topsecretretken'\n\
    \  }\n};\n```\n\nAs our application grows, more types of state entities will creep\
    \ in. Some of these will come from external libraries like redux-forms, react-redux-router,\
    \ and others that require their own place in our state. Other entities will come\
    \ from the application's business needs.\n\nFor example, if we need to support\
    \ editing of the user's profile with the option to cancel, our implementation\
    \ might create a new temp key where we will store a copy of the profile while\
    \ it is being edited. Once the user clicks \"confirm\" or \"cancel\", the temp\
    \ copy will either be copied over to become the new profile or simply deleted.\n\
    \n# Keeping the State Manageable\n\nTo make things as simple as possible, it is\
    \ best to have a reducer for each key in the base state. This will allow for an\
    \ encapsulation approach where it is immediately clear who can modify parts of\
    \ our state.\n\nFor a very large project, it might be beneficial to separate the\
    \ \"server data\" and the \"auxiliary/temp data\" under different root keys:"
  merge: -1
