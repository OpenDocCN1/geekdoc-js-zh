  md: '# # Should I Read This Book?


    There are many tutorials and blog posts about Redux on the Internet. The library
    also has great official documentation. This book isn''t supposed to be either
    a tutorial or documentation. The goal is to provide a methodical explanation of
    Redux core concepts and how those can be extended and used in large and complex
    Redux applications.


    As a frontend consultancy, we help dozens of companies build great projects using
    Redux. Many projects face the same problems and ask the same questions. How should
    we structure the application? What is the best way to implement server communication?
    What is the best solution for form validation? Where should we handle side effects?
    How will Redux benefit our applications?


    This book is intended to serve as a companion for developers using Redux on a
    daily basis. It aims to give answers to many of the above questions and provide
    solutions to the most common problems in real-world applications. It can be used
    to learn Redux from the ground up, to better understand the structure of a large
    application, and as a reference during development.


    The book is structured in a way that doesn''t force the reader to read it to finish
    but rather allows you to skip parts and come back to them when you face the problem
    at hand or have free time to deepen your knowledge. We love Redux, and we have
    tried to share our excitement about this book. We hope that you will find it useful.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# How to Read This Book


    While Redux in itself is a small library, the underlying concepts and the ecosystem
    around it are large and complex. In this book we cover the core and common concepts
    and methods a developer needs to work with Redux on both small and large-scale
    applications.


    The book is separated into three parts. In the first part you will learn the basics
    of Redux. Chapter 1 covers the core concepts behind Redux, introducing the different
    "actors" and how it is built. Chapter 2, we build an example project step by step;
    here, you will learn how to use Redux in a project.


    The second part of the book is about examples and use cases from real applications.
    Redux has a great ecosystem, and there are a lot of tips, tricks, and libraries
    that can be applied to many projects of different scale. We provide you with solutions
    for common problems including server communications, authorization, internationalization,
    routing, forms, wizards, and more.


    The third part is a deep dive into Redux usage. It is separated into chapters
    by Redux entity types: actions, middleware, reducers, and the store and store
    enhancers. The chapters in this section include advanced explanations of Redux
    internals and how to properly use them in complex scenarios, and they are a must-read
    for anyone considering building large applications with Redux.


    It is highly recommended that you start by reading the first part as a whole.
    Even if you already have knowledge of Redux and have used it, the opening chapters
    will clarify all the underlying concepts and lay down the groundwork for the code
    we will use throughout the second and third parts of the book.


    No matter who you are—an explorer learning Redux for fun, or a hard-working professional
    who needs to solve real problems fast—this book will provide new ideas and insights
    to help you on your path.'
