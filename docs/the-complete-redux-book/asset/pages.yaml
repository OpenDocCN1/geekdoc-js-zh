  md: "# Chapter 10. Middleware\n\n# Simple null middleware\n\n```\nconst nullMiddleware\
    \ = () => next => action => {\n  next(action !== null ? action : { type: 'UNKNOWN'\
    \ });\n};\n```\n\nIn this middleware we catch any attempt to send null instead\
    \ of dispatch()\na fake { type: 'UNKNOWN' } instead. While this middleware has\
    \ no practical value, it should be\naparent how we can use the middleware's power\
    \ to change actions to support any input type.\nThe famous redux-thunk* is essence\
    \ in the following code:\n\n# Simplified redux-thunk\n\n```\nconst thunkMiddleware\
    \ = ({dispatch, getState}) => next => action => {\nif (typeof action === 'function')\
    \ {\n  return action(dispatch, getState);\n}\nreturn next(action);\n```\n\nIt\
    \ checks if the action passed is 'function' instead of the regular object, and\
    \ if it is a function it\n\"calls\" it, passing dispatch() and getState().\n\n\
    A similar approach is used by other middleware that know how to accept the following,\
    \ and\nmore:\n\n+   - Promises (e.g., dispatch a regular action when resolved)\n\
    - Error objects (e.g., report errors)\n- Arrays (e.g., execute a list of actions\
    \ provided in parallel or sequentially)\n\n# Difference Between next() and dispatch()\n\
    \nA common point of confusion is the difference between the next() and dispatch()\
    \ functions passed\nto the middleware. While both accept an action, they follow\
    \ a different flow in Redux.\n\nCalling next() within a middleware will pass the\
    \ action along the middleware chain (from the\ncurrent middleware) down to the\
    \ reducer. Calling dispatch() will start the action flow from the\beginning (the\
    \ first middleware in the chain), so it will eventually reach the current one\
    \ as well.\n\n*https://github.com/gaearon/redux-thunk"
