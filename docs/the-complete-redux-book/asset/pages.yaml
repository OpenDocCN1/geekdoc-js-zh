    # Using Snapshots


    The approach of calculating the expected value and then comparing it to dynamically
    calculated values is very common in Redux. By saving time and making the code
    cleaner, we can use one of its greatest features, snapshots⁴.


    Instead of building the expected result, we can ask Jest to run the expect() block
    and save the result in a special .snap file, generating our expected object automatically
    and managing it for us:


    Test with snapshot


    ```

    1 it(''should create an action to add a recipe'', () => {

    2 expect(actions.addRecipe(''test'')).toMatchSnapshot();

    3 }});

    ```


    The expected calculation is gone, and instead of using isEqual(), Jest will now
    compare the result of the expression inside expect() to a version it has saved
    down on disk. The actual snapshot is placed in a __snapshots__/directory in a
    file with the same name as the test file plus the .snap extension:

    snap/action.test.js


    ```

    1 exports[''actions should create an action to add a recipe 1''] = =

    2 Object {

    3 "payload": "test",

    4 "type": "ADD_RECIPE",

    5 }

    6;

    ```


    ⁴https://facebook.github.io/jest/docs/tutorial-react.html#snapshot-testing'
