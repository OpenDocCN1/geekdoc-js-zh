  md: "# Chapter 7. The Store\n\nUnsubscribing from changes\n\n```\nconst observable\
    \ = store[Symbol.observable]();\nconst unsubscribe = observable.subscribe(observer)\n\
    un();\n```\n\n# Full Store API\n\nThe five methods of the store—getState(), dispatch(),\
    \ subscribe(), replaceReducer(), and the observable symbol—make up the whole of\
    \ the store’s API and most of the API exports. In the first chapter of this book\
    \ we learned enough to build a fully functional application. This low API footprint,\
    \ coupled with strong versatility, is what makes Redux so compelling and easy\
    \ to understand.\n\n# Decorating the Store\n\nThe basic store functionality in\
    \ Redux is very simple and sufficient for most use cases. Sometimes it is useful\
    \ to slightly change one of the methods, or even add new ones to support more\
    \ advanced use cases. This can be done by decorating the store, but because of\
    \ complicated syntax, the previous versions of Redux (prior to 3.1.0) higher-order\
    \ functions were used to decorate the store, but the createStore() API has changed\
    \ and it now supports an optional parameter for a store decorator.\n\n# Higher-Order\
    \ Functions\n\nBefore we proceed, let’s do a quick overview of what higher-order\
    \ functions are. We can define the term as referring to a function that takes\
    \ one or more functions as arguments, returns a function as its result, or does\
    \ both. Here’s an example:\n\nSample higher-order function\n\n```\nfunction output(message)\
    \ {\n  console.log(message);\n}\nfunction addTimestamp(fn) {\n  return function(...args)\
    \ {\n    console.log(`Executed at: ${Date.now()}`);\n    fn(...args);\n  }\n}\n\
    ```"
