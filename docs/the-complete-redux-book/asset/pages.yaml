  md: "# Chapter 4. Server Communication\n\nServer communication is one of the more\
    \ important parts of any application. And while the basic implementation can be\
    \ done in a few lines of code, it can quickly grow into a complicated mechanism\
    \ to handle authentication, caching, error handling, WebSockets, and a myriad\
    \ of other functionality and edge cases.\n\nOnline tutorials usually devote little\
    \ time to this topic, and suggest using regular promises and the redux-thunk middleware\
    \ to let action creators dispatch() actions when data is fetched. When a project\
    \ grows, however, it becomes clear that it's best to have a single place to handle\
    \ authentication (setting custom headers), error handling, and features like caching.\
    \ Considering this, we need to be able to access and dispatch asynchronous events—which\
    \ is the perfect job for a middleware.\n\n> Before reading this chapter, it is\
    \ strongly recommended that you read the Middleware Chapter.\n\n# Using Promises\
    \ in Action Creators\n\nLet's start looking at server communication when implemented\
    \ using async action creators (using libraries such as redux-thunk, to understand\
    \ the underlying pitfalls of this approach:\n\nPromise in action creator\n\n```\n\
    const fetchUser = id => (dispatch) =>\n  fetch(`${id}`)\n  .then(response => response.json())\n\
    \  .then(userData => dispatch(setUserData(userData)))\n  .catch(error => dispatch(apiError(error)));\n\
    ```\n\nDid you notice we handled the error in response.json() instead of fetch()\
    \ API?"
  merge: -1
  pgno: 59
- img_proc: true
  md: "Chapter 4. Server Communication\n\nThere are a few issues with this code:\n\
    \n+   1. We can't see an action going out in our logs before the fetch() completes,\
    \ preventing the regular Redux debug flow.\n2. Every action creator will need\
    \ to have the repetitive functionality to handle errors and set headers.\n3. Testing\
    \ gets harder as more async action creators are added.\n4. If you want to change\
    \ the server communication strategy (e.g., replace fetch() with WebSockets), you\
    \ need to change multiple places in the code.\n\nKeeping the code as short and\
    \ stateless as possible, in keeping with the spirit of Redux, is easier when all\
    \ the action creators are simple functions. This makes them easier to understand,\
    \ debug, and test. Keeping the action creators 'clean' from async code means moving\
    \ it into another part of the stack. Luckily, we have the perfect candidate-middleware.\
    \ As we will see, this approach can keep the action creators simple and generate\
    \ actions that contain all the information needed for a middleware to perform\
    \ the API request.\n\n> Here, we are using the Fetch API to access the server.\
    \ Our target URL is built from a constant specifying the root (e.g., 'http://google.com/')\
    \ and the sub-URL we want to access, passed to the action object.\n\n# API Middleware\n\
    \nOur goal is to create a generic middleware that can serve any API request and\
    \ requires only the information passed to it action. The simplest solution is\
    \ to define a new action type that is unique to API-related events:\n\nSimple\
    \ API middleware\n\n```\nconst apiMiddleware = ({ dispatch }) => next => action\
    \ => {\n  if (action.type === 'API') {\n    return next(action);\n  }\n\n  //\
    \ Handle API code\n};\n```\n\nOur middleware will listen to any action with type\
    \ 'API' and use the information in its payload to make a request to the server.\
    \ It will let any other actions flow down the middleware chain.\n\nhttps://developer.mozilla.org/en/docs/Web/API/Fetch_API"
