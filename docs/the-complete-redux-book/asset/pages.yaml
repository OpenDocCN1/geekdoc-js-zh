  md: '# Chapter 3. State Management


    A simple approach might be to have a custom function that knows each API''s return
    data and normalizes the returned nested JSON into a flat structure with custom
    code.


    Since this is quite a common practice, the custom code can be replaced by the
    normalizer library. Using this library, we can define the schema of the data coming
    from the server and have the normalizer turn our nested JSON into a normalized
    structure we can pass directly into our new UPDATE_DATA action.


    # Persisting State


    In many cases, we will want to keep the current state even across a page refresh
    or the application''s tab being closed. The simplest approach to persisting the
    state is keeping it in the browser''s local storage.


    To easily sync our state with local storage (or any other storage engine), we
    can use the redux-persist library. This will automatically serialize and save
    our state once it has been modified.


    To use the library, simply install it with npm and modify the store creation file
    to wrap createStore with an enhancer:


    Setting up redux-persist


    ```

    import { createStore } from ''redux'';

    import { persist, autoRehydrate } from ''redux-persist'';

    import rootReducer from ''reducers/root'';


    const store = createStore(rootReducer, autoRehydrate());

    persistStore(store);

    ```


    Once persistStore(store) has been called, our store and the browser''s local storage
    will automatically be in sync and our state will persist across page refresh.


    # Advanced State Sync


    The redux-persist library has advanced functionality that will allow us to whitelist
    only part of the state to persist and specify special serializers for the part
    of the state that cannot be serialized with JSON.stringify() (functions, symbols,
    etc.). We recommend reviewing the library''s documentation for the most advanced
    features.


    > ¹⁷ https://github.com/paularmstrong/normalizr

    ¹⁸ https://github.com/rt2rz/redux-persist'
