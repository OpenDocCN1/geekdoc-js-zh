  md: '# Chapter 1. Core Concepts of Flux and Redux


    affect more than one service. For example, changing the measurements from grams
    to ounces will cause the ingredient service to recalculate the amounts and the
    recipe service to make the recipe as using imperial measurements. In Redux, these
    are the reducers.


    We want to add another layer, the middleware. Every action will be first passed
    through a list of middleware. Unlike reducers, middleware can modify, stop, or
    add actions. Examples might include: a logging middleware, an authorization middleware
    that checks if the user has permissions to run the action, or an API middleware
    that sends something to the server.


    This simple example shows the base of Redux. We have a single store to control
    the state, actions to describe the changes we want to, reducers (services, in
    our example) that know how to mutate the state based on the requested action,
    and middleware to handle the housekeeping tasks.


    What makes Redux special, and sometimes hard to understand, that reducers never
    change the state (in our case, the recipe book), because it is immutable. Instead,
    the reducers must create a new copy of the book, make the needed changes to the
    copy, and return the new, modified book to the store. This approach allows Redux
    and the view layers to easily do change detection. In later chapters we will discuss
    in detail why and how this approach is used.


    It is important to note that the whole application state is kept in a single location,
    the store. Having a single source of data provides enormous benefits during debugging,
    serialization, and development, as will become apparent in the examples in this
    book.


    ![](img/fbb45cbd9118f0a7f1feb2a04f50e708_14_0.png)


    Redux overview'
