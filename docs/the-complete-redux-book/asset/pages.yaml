    # Structuring the Code


    Having all our code in a single file is obviously bad idea. In Redux, it''s common
    for the directory structure to follow the names of the Redux "actors." Reducers
    are placed in the reducers directory, and the main reducer (commonly called the
    root reducer) is placed in the root.js file. Action creators go in the actions
    directory, divided by the type of object or data they handle—in our case, actions/recipes.js
    and actions/ingredients.js. Since we only have a single store, we can put all
    into one file: store/store.


    After the changes, the index.js file should look like the following:


    Final index.js


    ```

    import store from ''./store/store'';

    import { addRecipe } from ''./actions/recipes'';

    import { addIngredient } from ''./actions/ingredients'';


    store.dispatch(addRecipe(''Pancake''));

    store.dispatch(addIngredient(''Pancake'', ''Eggs'', 3));


    window.store = store;

    ```


