  md: '# Further Reading


    Despite its small size, the Redux library has had a huge effect on the way developers
    handle data management in single-page applications. It''s already used in many
    large production applications and has grown a large ecosystem around itself.


    Today, there are a lot of great materials about Redux over the Internet. This
    book attempts to group together all the best practices for real-world use of Redux
    and how to show how to use it correctly in large applications. But since the web
    world is constantly moving forward, it is always good to keep up to date and explore
    new libraries and methods. In this section of the book, we would like to mention
    some Redux-related sources for further learning.


    # Resource Repositories


    The Redux repository on GitHub has an Ecosystem documentation section² where you''ll
    find a curated list of Redux-related tools and resources.


    There is also a curated (and much larger) Redux catalog managed by the community
    called Awesome Redux³ contains a good amount of resources to use Redux with different
    libraries such as Angular, Vue, and others.


    If you are looking for more React/Redux-focused material, Mark Erikson⁴ maintains
    a resource repository called React/Redux Links⁵. The materials are separated by
    difficulty level, and a broad range of topics are covered (state management, performance,
    forms, and many others).


    The same author maintains a more Redux-focused curated list Redux Ecosystem Links⁶,
    which has a similar structure.


    # Useful Libraries


    The Redux ecosystem includes dozens (if not hundreds) of useful libraries that
    complement or extend its features. Here''s a short list of libraries that gained
    widespread popularity and are strongly recommended for use in large Redux projects—we
    recommend that you check out the source code of these libraries to get a deeper
    understanding of the extensibility of Redux:


    +   ⁵https://github.com/reactjs/redux/blob/master/docs/introduction/Ecosystem.md

    ⁶https://github.com/xgromm/awesome-redux

    ⁷https://github.com/markirikson/redux-links

    ⁸https://github.com/markirikson/redux-ecosystem-links'
