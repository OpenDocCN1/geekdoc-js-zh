  md: "Chapter 1. Core Concepts of Flux and Redux\n\n# General Concepts\n\nRedux is\
    \ about functional programming and pure functions. Understanding these concepts\
    \ is crucial to understanding the underlying principles of Redux.\n\nFunctional\
    \ programming has become a trendy topic in the web development domain lately,\
    \ but it was invented around the 1950s. The paradigm shifts around avoiding changing\
    \ state and mutable data—in other words, making your code predictable and free\
    \ of side effects.\n\nJavaScript allows you to write code in a functional style,\
    \ as it treats functions as first-class objects. This means you can store functions\
    \ in variables, pass them as arguments to other functions, and return them as\
    \ values of other functions. But since JavaScript was not designed to be a functional\
    \ programming language per se, there are some caveats that you will need to keep\
    \ in mind. To get started with Redux, you need to understand pure functions and\
    \ mutation.\n\n# Pure and Impure Functions\n\nA pure function returns values by\
    \ using only its arguments: it uses no additional data and changes no data structures,\
    \ touches storage, and emits no external events (like network calls). This means\
    \ that you can be completely sure that every time you call the function with the\
    \ same arguments, it will always get the same result. Here are some examples of\
    \ pure functions:\n\nAn example of a pure function\n\n```\nfunction square(x)\
    \ {\n  return x * x;\n}\n\nMath.sin(y);\narr.map((item) => item.id);\n```\n\n\
    If a function uses any variables not passed in arguments or creates side effects,\
    \ the function is impure. When a function depends on variables or functions outside\
    \ of its lexical scope, you can never be sure that the function will behave the\
    \ same every time it's called. For example, the following are impure functions:"
  merge: -1
  pgno: 17
