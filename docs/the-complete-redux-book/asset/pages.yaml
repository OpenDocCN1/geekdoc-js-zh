  md: "# Sample API action\n\n```\nconst setData = data => ({\n  type: 'SET_DATA',\n\
    \  payload: data\n});\n\nconst apiAction = () => ({\n  type: API,\n  payload:\
    \ {\n    success: setData,\n    url: 'fake.json'\n  }\n});\n```\n\nIn our Redux\
    \ call, calling dispatch(apiAction()) will result in our API middleware doing\
    \ a GET request for server/fake.json and (if successful) dispatching the SET_DATA\
    \ action with payload to the response. When there is an error, an action created\
