  md: "# Logging\n\n```\n$$(document).on('click', '.recipes > button', handleAdd);\n\
    updateUI();\n}\n```\n\nNow that our UI allows us to add new recipes, we find that\
    \ it's hard to see what actions are sent to the store. One option is to receive\
    \ logged actions from the root reducer—but as we see shortly, this can be problematic.\
    \ Another option is to use the `middleware` we discussed in the previous chapter.\n\
    The store holds a connection to all the middleware and they get actions from the\
    \ reducers, which means they have access to any actions dispatched to the store.\
    \ To test this, let's create a simple logging middleware that will print any action\
    \ sent to the store:\n\nA simple logging middleware\n\n```\nconst logMiddleware\
    \ = ((getState, dispatch) => (next) => (action) => {\n  console.log(`Action: ${action.type}`);\n\
    \n  next(action);\n};\n\nexport default logMiddleware;\n```\n\nThe structure might\
    \ seem strange at first, as we are creating a function that returns a function\
    \ that returns a function. While this might be a little confusing, it is required\
    \ by the way Redux combines middlewares in its core. In practice, in the inner\
    \ function we have access to the `dispatch()` and `getState()` methods from the\
    \ store, the current action being processed, and the `next()` method, which allows\
    \ us to call the next middleware in line.\nOur logger prints the current action\
    \ and then calls `next(action)` to pass the action to the next middleware. In\
    \ some cases, middleware might suppress actions or change them. That is why implementing\
    \ a logger in a reducer is not a viable solution: some of the actions might not\
    \ reach.\nTo connect the middleware to our store, we need to modify our `store/store.js`\
    \ file to use Redux's `applyMiddleware()` utility function:"
