  md: "# The Complete Example\n\nThe HTML\n\n```\n<script src=\"https://cdn.cloudflare.com/ajax/libs/redux/3.6.0/redux.min.js\"\
    \ />\n<div>\n  Counter:\n  <span id='counter'></span>\n</div>\n\n<button id='inc'>Increment</button>\n\
    <button id='dec'>Decrement</button>\n```\n\nThe JavaScript\n\n```\n// Our mutation\
    \ (Reducer) function,\n// create a new_state based on the action passed\nfunction\
    \ reducer(state, action) {\n  switch(action.type) {\n    case 'INC':\n      return\
    \ ( ...state, counter: state.counter + 1 );\n    case 'DEC':\n      return ( ...state,\
    \ counter: state.counter - 1 );\n    default:\n      return state;\n  }\n}\n\n\
    const initialState = {\n  counter: 3\n};\n\nconst store = Redux.createStore(reducer,\
