    # # Error Handling\n\nOur current example ignores any error handling. To solve\
    \ this problem, we need to extend our middleware to catch server errors and dispatch\
    \ events when they happen.\n\nError handling could be done in a number of ways:\n\
    \n+   - Dispatch a custom error message (based on data in the action object) on\
    \ an error event.\n- Dispatch a generic API error action to be handled by a special\
    \ reducer or another middleware.\n- Combine both approaches with a fallback for\
    \ #2 if #1 was not provided.\n\nFor example, we are using FSA-compliant action\
    \ creators to send a generic apiError() message on any failed server request:\n\
    \nHandle API errors with generic callback only\n\n```\nconst handleError = error\
    \ => dispatch(apiError(error));\n\nfetch(BASE_URL + action.url)\n  .then(response\
    \ => {\n    if (response.status >= 300) {\n      handleError(response.status);\n\
    \    } else {\n      response.json()\n        .then(data => dispatch({ type: action.next,\
    \ data }))\n    }\n  })\n  .catch(handleError);\n```\n\nWe leave it to you as\
    \ an exercise to add support for custom error handling for actions (a way for\
    \ an action creator to specify if it wants a different error flow than the default)."
