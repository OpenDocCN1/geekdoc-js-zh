  md: '# Chapter 10. Middleware


    Middleware are one of Redux''s most powerful concepts and will hold the bulk of
    our application''s logic and generic service code.


    To understand the concept of middleware, it''s best first to examine the regular
    data flow in Redux. Any action dispatched to the store is passed to the root reducer
    together with the current state to generate a new one. The concept of middleware
    allows us to add code that runs before the action is passed to the reducer.


    In essence, we can monitor all the actions being sent to the Redux store and execute
    arbitrary code before allowing an action to continue to the reducer. Multiple
    middleware can be added in a chain, allowing each to run its own logic, one after
    another, before letting the action pass through. The basic structure of a middleware
    is as follows:


    Basic structure of a middleware


    ```

    const myMiddleware = (( getState, dispatch )) => next => action => {

    next(action);

    };

    ```


    This declaration might seem confusing, but it should become clear once if it''s
    examined step by step. At its base, a middleware is a function that receives from
    Redux an object that contains the getState() and dispatch() functions. The middleware
    returns back a function that receives next() and in turn returns another function
    that receives action and finally contains our middleware code.


    > From the user''s perspective, a simple concept myMiddleware = (( getState, dispatch,
    next, action )) => {} might have seemed sufficient. The more complicated structure
    is due to Redux internals.


    The getState() and dispatch() methods should be familiar as they are APIs of the
    Redux store. The action parameter is the Redux action being passed to the store.
    The only next() function should look unfamiliar at this point.


    > It is sometimes incorrectly noted in teaching material that the parameter passed
    to the middleware is store (as it appears to have getState() and dispatch()).
    In practice, it''s an object holding only those two APIs and not the other APIs
    exported by the Redux store.'
