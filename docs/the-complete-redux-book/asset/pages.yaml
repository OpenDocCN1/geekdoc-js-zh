  md: "# Redux Terminology\n\n# Actions and Action Creators\n\nThe only way for an\
    \ application to change the state is by processing actions. In most cases, actions\
    \ in Redux are nothing more than plain JavaScript objects passed to the store\
    \ that hold all the information needed for the store to be able to modify the\
    \ state:\n\nExample of an action object\n\n```\n{\n  type: 'INCREMENT',\n  payload:\
    \ {\n    counterId: 'main',\n    amount: -10\n  }\n}\n```\n\nSince these objects\
    \ might have some logic and be used in multiple places in an application, they\
    \ are commonly wrapped in a function that can generate the objects based on a\
    \ parameter:\n\nA function that creates an action object\n\n```\nfunction incrementAction(counterId,\
    \ amount) {\n  return {\n    type: 'INCREMENT',\n    payload: {\n      counterId,\n\
    \      amount\n    }\n  };\n};\n```\n\nAs these functions create action objects,\
    \ they are aptly named action creators.\n\n# Reducers\n\nOnce an action is sent\
    \ to the store, the store needs to figure out how to change the state accordingly.\
    \ To do so, it calls a function, passing the current state and the received action:"
  merge: -1
  pgno: 15
- img_proc: true
  md: "# Chapter 1. Core Concepts of Flux and Redux\n\n# A function that calculates\
    \ the next state\n\n```\nfunction calculateNextState(currentState, action) {\n\
    \  ...\n  return nextState;\n}\n```\n\nThis function is called a reducer. In Redux\
    \ applications, there will be one root reducer function that will call additional\
    \ reducer functions to calculate the nested state.\n\n# A simple reducer implementation\n\
    \n```\nfunction rootReducer(state, action) {\n  switch (action.type) {\n    case\
    \ 'INCREMENT':\n      return { ...state, counter: state.counter + action.payload.amount\
    \ };\n    default:\n      return state;\n  }\n}\n```\n\n> Reducers never modify\
    \ the state; they always create a new copy with the needed modifications.\n\n\
    # Middleware\n\nMiddleware is a more advanced feature of Redux and will be discussed\
    \ in detail in later chapters. The middleware act like interceptors for actions\
    \ before they reach the store: they can modify the actions, create more actions,\
    \ suppress actions, and much more. Since the middleware has access to the actions,\
    \ the dispatch() function, and the store, they are the most versatile and powerful\
    \ entities in Redux.\n\n# Store\n\nUnlike other Flux implementations, Redux has\
    \ a single store that holds the application information but no user logic. The\
    \ role of the store is to receive actions, pass them through all the registered\
    \ middleware, and then use reducers to calculate a new state and save it.\n\n\
    When it receives an action that causes a change to the state, the store will notify\
    \ all the registered listeners that a change to the state has been made. This\
    \ will allow various parts of the system, like the UI, to update themselves according\
    \ to the new state."
