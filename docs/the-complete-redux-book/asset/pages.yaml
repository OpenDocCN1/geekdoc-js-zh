  md: "# Chapter 7. The Store\n\n# Implementation of compose\n\n```\nfunction compose(...funcs)\
    \ {\n  return (...args) => {\n    const last = funcs[funcs.length - 1]\n    const\
    \ rest = funcs.slice(0, -1)\n\n    return rest.reduceRight(\n      (composed,\
    \ f) => f(composed),\n      last(...args)\n    )\n  }\n}\n```\n\n# Store Enhancers\n\
    \nStore enhancers are higher-order functions used to enhance the default behavior\
    \ of the Redux store. In contrast to middleware and reducers, they have access\
    \ to all internal store methods (even those not available to middleware, such\
    \ as subscribe()).\n\nTo give a few examples, there are store enhancers for:\n\
    \n+   - Store synchronization (between browser tabs or even network clients)\n\
    - State persistence\n- Integration with developer tools\n\nLet's build an example\
    \ enhancer that will persist state changes and load initial state from localStorage.\
