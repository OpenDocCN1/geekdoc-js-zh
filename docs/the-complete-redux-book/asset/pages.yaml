  md: "# Stubbing fetch()\n\nBefore we move on the actual tests, we need to lay out\
    \ some infrastructure for stubbing the fetch() API. We are going to create a mock\
    \ response object and stub the fetch() API on our window object:\n\nCreate a fake\
    \ response object\n\n```\nexport const mockResponse = (status, statusText, response)\
    \ => {\n  return new window.Response(response,\n    status: status,\n    statusText:\
    \ statusText,\n    headers: {\n    'Content-type': 'application/json'\n  }\n});\n\
    ```\n\nStub a successful fetch\n\n```\nexport const mockFetch = (status, data)\
    \ => {\n  window.fetch = jest.fn().mockImplementation(\n    () => Promise.resolve(mockResponse(status,\
    \ null, data));\n  );\n};\n```\n\nStub a failing fetch\n\n```\nexport const mockFetchError\
    \ = (state, error) => {\n  window.fetch = jest.fn().mockImplementation(\n    ()\
    \ => Promise.reject(mockResponse(state, error, '{}'));\n  );\n};\n```\n\nThe mock\
    \ fetch() will return a resolved promise that is similar to the real result from\
    \ a fetch() call:\n\nSample mocked fetch code\n\n```\nmockFetch(200, {\"key\"\
    :\"value\"});\nfetch('test.json');\n```\n\nThis code allows us to call mockFetch()\
    \ or mockFetchError(), causing the next call to fetch() to return with our mocked\
    \ response. The only issue with this implementation is that it stubs all the fetch()\
    \ calls in the system, regardless of the URL.\n\nSince the first parameter to\
    \ fetch() is the URL, we can use the common handleResponse() function to first\
    \ verify that the URL passed to fetch() is the URL we stubbed:"
