  md: '# Moving Code from Action Creators


    The original async example used the following code to communicate with the server:


    Promise in action creator


    ```

    fetch(`user/${id}`)

    .then(response => response.json())

    .then(userData => dispatch(setUserData(userData)))

    .catch(error => dispatch(apiError(error)));

    ```


    This code has a few hardcoded issues that we will need to address in our generic
    API:


    +   - How to construct the URL

    - What HTTP verb to use (GET/POST/etc)

    - What action to dispatch on success or error


    Since we plan to pass all this information inside our action object, we can expect
    the corresponding action creator to pass in all the required parameters.


    The URL-building issue is simple to solve, simply by passing the required URL
    in the action object (we will start with GET-only APIs):


    Target URL


    ```

    fetch(BASE_URL + action.url)

    ```


    > To make things more generic, actions will only hold the relative part of the
    server''s full URL. This will allow us to set the BASE_URL to be different in
    production, development, and testing.


    Handling the return value from the call is a bit more complex, as our middleware
    needs to figure out what action to dispatch. A simple solution is to pass the
    next action to be dispatched inside the API action. In our case we use the Flux
    Standard Action (FSA) convention and put the ID of the next action inside the
    success key (i.e., action.payload.success):


    Handling the result


    ```

    dispatch({ type: action.payload.success, response });

    ```'
