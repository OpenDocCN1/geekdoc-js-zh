  md: "# Chapter 1. Core Concepts of Flux and Redux\n\nAdding Redux to a project\n\
    \n```\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/redux/3.6.0/redux.min.js\"\
    > />\n```\n\nWe will change our previous state definition to be a constant that\
    \ only defines the initial value of the state:\n\nThe initial state\n\n```\nconst\
    \ initialState = {\n  counter: 3\n};\n```\n\nWe can use it to create a Redux store\n\
    \nCreating a Redux store\n\n```\nconst store = Redux.createStore(reducer, initialState);\n\
    ```\n\nAs you can see, we are using our Redux from before. The only change that\
    \ needs to be made to the reducer is the switch statement. Instead of doing:\n\
    \nPrevious reducer code\n\n```\nswitch (action)\n```\n\nChanges to\n\nNew reducer\
    \ code\n\n```\nswitch (action.type)\n```\n\nThe reason behind this is that actions\
    \ in Redux are objects that have the special type property, which makes reducer\
    \ creation and action data more consistent.\n\nThe Redux store will also give\
    \ you all the features we implemented ourselves before, like subscribe() and dispatch().\
    \ Thus, we can safely delete these methods.\n\nTo subscribe to store changes,\
    \ we will simply call the subscribe() method of the store:"
