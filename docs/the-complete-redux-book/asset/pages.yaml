  md: "# Chapter 1. Core Concepts of Flux and Redux\n\nstill one thing missing. How\
    \ will our mini-Redux know how to handle the events and change the application\
    \ state?\n\nFor this, we define an additional function. On each action dispatched,\
    \ Redux will call our function, passing the current state and the action. To be\
    \ compliant with Redux's terminology, we will call the function a reducer. The\
    \ job of the reducer will be to understand the action, and based on it, create\
    \ a new state.\n\nIn our simple example state will hold a counter, and its value\
    \ will be incremented or decremented based on the action:\n\nSimple reducer for\
    \ INC and DEC actions\n\n```\n// Our mutation (reducer) function creates a new\
    \ state based on the action passed\nfunction reducer(state, action) {\n  switch\
    \ (action) {\n    case 'INC':n      return { ...state, counter: state.counter\
    \ + 1 };\n    case 'DEC':\\      return { ...state, counter: state.counter - 1\
    \ };\n    default:\n      return state;\n  }\n}\n```\n\nAn important thing to\
    \ remember is that reducers must always return a new, modified copy of the state.\
    \ They shouldn't mutate the existing state, like in this example:\n\nIncorrect\
    \ way to change state\n\n```\n// This is wrong!\nstate.counter = state.counter\
    \ + 1;\n```\n\nLater in the book you will learn how to avoid mutations in JavaScript\
    \ and without the help of external libraries.\n\nNow it's time to implement the\
    \ actual change of the state. Since we are building a generic framework, we will\
    \ not include the code to increment/decrement the counter (as it is application-specific)\
    \ but will call a function that we expect the user to provide, called reducer().\
    \ This is the reducer we mentioned before.\n\nThe dispatch() function calls the\
    \ reducer() implemented by the application creator, passing both the current state\
    \ and the action it received. This information should be enough for the reducer()\
    \ function to calculate a new state. We then check if the new state differs from\
    \ the old one, and if it does, we replace the old state and notify all the listeners\
    \ of the change:"
  merge: -1
  pgno: 22
