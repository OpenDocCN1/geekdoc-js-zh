  md: '# # Chapter 6. Tests


    One of the key strengths of Redux is its ease of testability. To fully automate
    the testing suite, we can create unit tests for each of the defect actors (reducers,
    action creators, middleware) and combine them together for comprehensive integration
    tests.


    There are a large number of testing tools available, but the exact tooling is
    less important as most parts of our Redux application will rely on plain JavaScript
    functions and objects with no complicated libraries or async flows to test.


    As our testing framework we will be using the Jest^22 library from Facebook, the
    latest version of which proves to be an excellent choice for testing Redux. Using
    other frameworks and tools as Karma, Mocha, and so on should look very similar
    to the examples in this chapter.


    Find the best way to add to your project and operating system, please follow Jest''s
    getting started guide^23.


    # ## Test Files and Directories


    To start off we need a way to organize our tests. There are two main approaches:
    putting the tests together in the same directory with the implementation files,
    or putting them in a separate directory. In this guide we will use the latter.
    The choice is a matter of convenience and personal preference, with the only side
    effects being different test runner configurations.


    We will create a test file for each implementation file in our project. In the
    case of app/actions/recipes.js, our test file will be tests/actions/recipes.test.js.


    # ## Test File Structure


    In our test files we will use a describe() function to wrap all our tests. The
    first string parameter in this function will allow us to easily determine which
    group of tests are failing or succeeding:


    > ^22https://facebook.github.io/jest/

    ^23https://facebook.github.io/jest/#getting-started'
