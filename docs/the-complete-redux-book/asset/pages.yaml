    # # Redux and Flux


    While Redux derives from Flux concepts, there are a few distinctions between the
    two architectures.

    in contrast to Flux, Redux only has a single store that holds nothing by itself.
    Actions are dispatched

    handed directly by the store, eliminating the need for a standalone dispatcher.
    In turn, the store

    passes the actions to state-changing functions called *reducers*, a new type of
    actor added by Redux.


    ![](img/fbb45cbd9118f0a7f1feb2a04f50e708_13_0.png)


    Dispatcher out, reducers in


    To better understand Redux, let’s imagine an application that helps us manage
    a recipe book. The

    Redux *store* is where the recipe book itself will be saved, in a structure that
    might be a list of recipes\and their details.


    The app will allow us to perform different actions like adding a recipe, adding
    ingredients to

    recipe, changing the quantity of an ingredient, and more. To make our code generic,
    we can create

    a number of services. Each service will know how to handle a group of actions.
    For example, the *book

    service* will handle all the add/remove actions, the *recipe service* will handle
    changing recipe

    information, and the *recipe-ingredients service* will handle the actions to with
    ingredients. This

    will allow us to divide our code and in the future easily add support for more
    actions.


    To make it work, our store could call each of our services and pass them two parameters:
    the current

    recipe book and the action we want to perform. Each service in turn will modify
    the book if

    action is one it knows how to handle. Why pass the action to all the services?
    Maybe some actions'
