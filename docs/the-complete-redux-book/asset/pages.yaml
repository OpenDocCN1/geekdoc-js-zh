  md: "# Chapter 1. Core Concepts of Flux and Redux\n\nAn example of an impure function\n\
    \n```\nfunction getUser(userId) {\n  return UserModel.fetch(userId).then((result)\
    \ => result);\n}\nMath.random();\narr.map((item) => calculate(item));\n```\n\n\
    # Mutating Objects\n\nAnother concept that often causes headaches for developers\
    \ starting to work with Redux is immutability. JavaScript has limited tooling\
    \ for managing immutable objects, and we are often required to use external libraries.\n\
    \nImmutability means something that cannot be changed, guaranteeing developers\
    \ that if you create an object, it will have the same properties and values forever.\
    \ For example, let's declare a simple object as a constant:\n\nObject defined\
    \ as const in JavaScript\n\n```\nconst colors = {\n  red: '#FF0000',\n  green:\
    \ '#00FF00',\n  blue: '#0000FF'\n};\n```\n\nEven though the colors object is a\
    \ constant, we can still change its content, as const will only check the reference\
    \ to the object is changed:\n\nJavaScript allows changes of const defined objects\n\
    \n```\ncolors = {};\nconsole.log(colors);\ncolors.red = '#FFFFFF';\nconsole.log(colors.red);\n\
    ```\n\nTry writing this in the developer console. You will see that you can't\
    \ reassign an empty object to colors, but you can change its internal value.\n\
    \nTo make the colors object appear immutable, we can use the Object.freeze() method:"
