  md: 'Here is the simplest Flux flow:


    +   1. Stores subscribe to a subset of actions.

    2. An action is sent to the dispatcher.

    3. The dispatcher notifies subscribed stores of the action.

    4. Stores update their state based on the action.

    5. The view updates according to the new state in the stores.

    6. The next action can then be processed.


    ![](img/fbb45cbd9118f0a7f1feb2a04f50e708_12_0.png)


    Flux ensures that it''s easy to reason about how actions flow in the system, what
    will cause the state to change, and how it will change.


    Consider an example from a jQuery or AngularJS application. A click on a button
    can cause multiple callbacks to be executed, each updating different parts of
    the system, which might trigger updates in other places. In this scenario it is
    virtually impossible for the developer of a large application to know how a single
    event might modify the application''s state, and in what order changes will occur.


    In Flux, the event will generate a single action that will mutate the store and
    return the view. Any actions created by the store or other components during this
    process will be queued and executed after the first action is done and the view
    is updated.


    Facebook''s developers did not initially open-source their implementation of Flux,
    but rather released only parts of it, like the dispatcher. This caused a lot of
    open-source implementations to be built by the community, some of them significantly
    different and some only slightly changing the original'
