  md: "Chapter 1. Core Concepts of Flux and Redux\n\nThe connection to different frameworks\
    \ is done with the help of third-party libraries that provide a set of convenience\
    \ functions for each framework in order to seamlessly connect to Redux. The library\
    \ that we will use to connect Redux and React is called react-redux, and we will\
    \ be covering it extensively in the book.\n\n# # Basic Redux Implementation\n\n\
    People love Redux because of its simplicity. In fact, it is so simple that we\
    \ can implement most of it in a handful of lines of code. Unlike with other frameworks,\
    \ where the only way to learn is to study the API, here we can start implementing\
    \ Redux ourselves.\n\nThe basic premise behind Redux is the idea that all the\
    \ application state is saved in one place, the store. To use this idea in applications\
    \ we will need to find a way to:\n\n+   1. Modify the state as a result of events\
    \ (user-generated or from the server).\n2. Monitor state changes so we can update\
    \ the UI.\n\nThe first part can be split into two blocks of functionality:\n\n\
    +   1. Notify the state that an action has happened.\n2. Help the store figure\
