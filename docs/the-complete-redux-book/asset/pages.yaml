  md: "# Chapter 1. Core Concepts of Flux and Redux\n\n# Making a plain object immutable\n\
    \n```\nObject.freeze(colors);\ncolors.red = '#F00000';\nconsole.log(colors.red);\n\
    ```\n\nThe value of the red property will not be '#FFFFFF'. If you thought that\
    \ value should be '#FF0000', you missed that we changed the red property before\
    \ we froze it. This is a good example of how easy it is to miss this kind of thing\
    \ in real applications.\n\nHere, we used Object.freeze(), the colors object became\
    \ immutable. In practice things are often more complicated, though JavaScript\
    \ does not provide native ways to make data structures fully immutable. Object.freeze()\
    \ won't freeze nested objects:\n\nObject.freeze() does not freeze nested objects\n\
    \n```\nconst orders = {\n  bread: {\n    price: 10\n  },\n  milk: {\n    price:\
    \ 20\n  }\n};\nObject.freeze(orders);\norders.milk.price -= 15;\nconsole.log(orders.milk.price);\n\
    ```\n\nWork around the nature of our beloved language, we have to use third-party\
    \ libraries like deep-freeze* or ImmutableJS¹. We will talk about different immutable\
    \ libraries later in the book.\n\n# Redux and React\n\nRedux started out as a\
