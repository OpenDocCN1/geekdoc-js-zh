    Time to open the code editor and give the five files currently making your project:


    +   1. .gitignore – A list of filenames for Git to ignore when managing your repository.

    2. package.json - A list of all properties of our project and packages used.

    3. webpack.config.js – Webpack configuration.

    4. app/index.html – The HTML entry point for the project.

    5. app/app.js – The JavaScript entry point to our code.

    6. app/assets/stylesheets/main.css – Some basic CSS for the sample project.


    # .gitignore


    This is a special configuration for Git¹ version control system, this file instructs
    Git which files and directories should not be managed by it (for example, node_modules).


    # package.json


    While the majority of the fields in this file are irrelevant at this point, it
    is important to note two sections, dependencies and dependencies. The former is
    the list of all the tools needed to build the project. It includes only webpack-tools
    and the Babel transpiler, required to translate ES2016. The dependencies section
    lists all the packages we will bundle with our application. It includes the redux
    library itself.


    # webpack.config.js


    This is the main Webpack configuration file. This settings file instructs Webpack
    how to chain translate tools and how to build packages, and holds most of the
    configuration of our project''s tooling. In our simple project there is only one
    file (larger projects might have more granular files for testing, development,
    production, etc.). Our webpack.config.js file sets have Babel to translate ES2016
    into ES5 and defines the entry point of our application.


    # index.html / app.js


    Single-page applications, unlike their server-generated couples, have a single
    entry point. In our project every part of the application will be rendered starting
