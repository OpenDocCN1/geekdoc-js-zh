    \ if (debounce) {\n    return next(action);\n  }\n\n  if (pending[action.type])\
    \ {\n    clearTimeout(pending[action.type]);\n  }\n\n  // Save latest debounced\
    \ action */\n  pending[action.type] = setTimeout(/* implement debounce */, \n\
    });\",\n```\n\nIf there is already a pending action of this type, we can cancel\
