  md: '# # Chapter 2. Your First Redux Application


    In the previous chapter we learned what Redux is and how it works. In this chapter
    we will learn how to use it for a simple project. The code base created in this
    chapter will be used as the base for all the examples in the rest of this book.
    It is highly recommended that you follow along with fully understand this chapter
    and its code before moving on to more advanced topics.


    # ## Starter Project


    Modern client-side applications often require a set of so-called *boilerplate*
    in order to make development easier. The boilerplate may include things such as
    directory structure, code transformation tools like SCSS and ES2016 compilers,
    testing infrastructure, and production pipeline flows for tasks such as minification,
    compression, and concatenation.


    To the chore of setting up a new project, the open-source community has created
    dozens of different starters. The larger ones, like react-redux-starter-kit¹¹,
    consist of over a hundred files. We will use a much simpler boilerplate, enough
    to cover all the concepts explained in this book.


    As our project will be pure Redux, it will require no React or related libraries.
    We will use Webpack¹² as our main tool to handle all code transformation and production
    flow tasks.


    # ## Skeleton Overview


    To start off, let''s clone the starter project, install the needed packages, and
    verify that our environment is ready:


    Setting up the starter project


    ```

    git clone http://github.com/redux-book/starter

    cd starter

    pm install

    pm start

    ```


    > ¹¹https://github.com/daveruko/react-redux-starter-kit

    ¹²https://webpack.js.org/'
