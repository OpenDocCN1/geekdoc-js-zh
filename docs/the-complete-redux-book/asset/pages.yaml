  md: '# Simple directory structure


    ```

    actions/

    recipes.js // Recipe manipulation actions

    auth.js // User actions (login, logout, etc.)

    ```


    But as projects grow in size and complexity, we will subdivide our action creator
    directory structure even more. The common approach is to nest actions based on
    the data type they modify:


    # Advanced directory structure


    ```

    actions/

    recipes/

    favorites.js // Handle favorite recipe logic

    ...

    auth/

    resetting-password.js // Handle password reset

    permissions.js // Some actions for permissions

    ...

    ```


    > At first glance it might look easier to put action creators with their corresponding
    reducers, sometimes even in the same files. While this approach might work perfectly
    in the beginning, it will start breaking down in large projects. As the complexity
    grows, the application might have multiple reducers acting on the same action
    or multiple actions watched by a single reducer. In these cases the grouping stops
    working, and the developer is forced to start decoupling some of the actions or
    moving them, ending up with the structure suggested here.


    # Flux Standard Actions


    As projects and teams grow in size, it is important to create a convention on
    the structure of action objects. To this end, the open-source community has come
    together to create the Flux Standard Action (FSA) specification. The goal is to
    have consistency across both a project and third-party libraries.


    The FSA spec defines the structure of actions and a number of optional and required
    properties-party. At its base, an action should have up to four fields:'
