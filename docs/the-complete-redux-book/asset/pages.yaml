  md: "# Chapter 8. Actions and Action Creators\n\nFSA object sample\n\n```\nconst\
    \ action = {\n  type,\n  error,\n  payload,\n  meta\n};\n```\n\nEach field has\
    \ a distinct role:\n\n+   - type is a Redux action identifier.\n- The error property\
    \ is a Boolean that indicates whether the action is in an error state. The rationale\
    \ behind this is that instead of having multiple actions, like 'ADD_RECIPE_SUCCESS'\
    \ and 'ADD_RECIPE_ERROR', we can have only one action, 'ADD_RECIPE', and use the\
    \ error flag to determine the status.\n- payload is an object holding all information\
    \ needed needed the reducers. In our example, the title and description would\
    \ be passed as the payload property of the action.\n- The meta property holds\
    \ additional metadata about the action that is not necessarily needed by the reducers,\
    \ but could be consumed by middleware. We will go into detail on how the meta\
    \ property could be used in the Middleware Chapter.\n\nImplemented as an FSA,\
    \ our action looks like this:\n\nFSA action example\n\n```\nstore.dispatch({\n\
    \  type: 'ADD_RECIPE',\n  payload: {\n    title: 'Omelette',\n    description:\
    \ 'Fast and simple'\n  }\n});\n```\n\nIf the action were in the error state (for\
    \ example, in the event of a rejected promise or API failure), the payload would\
    \ hold the error itself, it be an Error() object or any other value defining the\
    \ error:"
