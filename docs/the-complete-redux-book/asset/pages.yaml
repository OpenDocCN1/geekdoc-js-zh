    The, output() function prints our message to the console. The addTimeStamp() function
    is a higher-order function that can take any other function and log the time of
    execution. Calling addTimeStamp() with output() as the parameter creates a new
    "wrapped" function that has enhanced functionality. It still has the signature
    of the original output() function but now also prints the timestamp.


    # The compose()


    The use of higher-order functions is very common in Redux applications, as it
    allows us to easily extend the behavior of other parts of the code. Take a look
    at an imaginary example where we have to wrap our original function in three wrappers:


    Multiple decoration


    ```

    1 const wrapped = third(second(first(originalFn)));

    ```


    ```

    3 wrapped();

    ```


    Using multiple decorators is a valid and practical approach, but the resulting
    code can be hard to read and appear somewhat cumbersome. Instead, Redux provides
    the compose() function to handle multiple wrappers in a cleaner manner:


    Multiple wrappers with compose


    ```

    1 import { compose } from ''redux'';

    ```


    ```

    4 const wrapped = compose(third, second, first)(originalFn);

    ```


    ```

    5 wrapped();

    ```


    The simplest implementation of that function is very neat. Notice the use of the
    reduceRight() method on the array of functions, which ensures that wrapping of
    higher-order functions happens from right to left:'
