  md: "# Loading Indicator (Spinner)\n\nA common question when using Redux is how\
    \ to show a spinner when server requests are in progress. The middleware approach\
    \ provides an answer using additional `dispatch()` calls. Before a request starts\
    \ or after it completes, we can dispatch a special action to be caught by reducers\
    \ responsible for the UI state. We dispatch apiStart() action before any server\
    \ communication and dispatch apiDone() on successful and failed server responses:\n\
    \nShow and hide spinner\n\n```\ndispatch(apiStart());\nfetch(BASE_URL + action.payload.url)\n\
    \  .then(response => {\n    dispatch(apiDone());\n    //\n  })\n  .catch(error\
    \ => {\n    dispatch(apiDone());\n    //\n  });\n```\n\nTo keep track of pending\
    \ requests, we can keep a counter in the state under a `serverStatus` or ui containers\
    \ in the state. The counter can be used by the UI to show a spinner if the number\
    \ of pending requests is greater than zero:\n\nUI reducer to handle the requests\
    \ counter\n\n```\nconst uiReducer = (state, action) => {\n  switch (action.type)\
    \ {\n    case API_START:\n      return Object.assign({}, state, {\n        requests:\
    \ state.requests + 1\n      });\n    case API_DONE:\n      return Object.assign({},\
    \ state, {\n        requests: state.requests - 1\n      });\n  }\n};\n```"
  merge: -1
