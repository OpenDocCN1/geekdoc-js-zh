  md: '# Chapter 9. Reducers


    Another example of a higher-order reducer is redux-ignore*. This library allows
    your reducers to immediately return the current state without handling the passed
    action, or to handle only a defined subset of actions.


    The following example will disable removing recipes from our recipe book. You
    might even use it to filter allowed actions based on user roles:


    Using the ignoreActions() higher-order reducer


    ```

    1 import combineReducers from ''redux'';

    2 import recipesReducer from ''reducers/recipes'';

    3 import ingredientsReducer from ''reducers/ingredients'';

    4 import ignoreActions from ''redux-ignore'';

    5 import { REMOVE_RECIPE } from ''constants/action-types'';

    n7 const rootReducer = combineReducers({

    8 recipes: ignoreActions(recipesReducer, [REMOVE_RECIPE]),

    9 ingredients: ingredientsReducer

    10 });

    ```


    # Testing Reducers


    The fact that reducers are pure functions allows us to write small and concise
    tests for them. To test a reducer we need to define an initial state, an action
    and the state we expect to have. Calling the reducer with the first two should
    always produce the expected state.


    This idea works when we avoid a lot of logic and control flow in reducers.


    +   Two things that are often forgotten while testing reducers are testing unknown
    actions and ensuring the immutability of initial and expected objects.


    # Summary


    In this chapter we learned about the part of Redux responsible for changing the
    application state. Reducers are meant to be pure functions that should never mutate
    the state or make any asynchronous calls. We learned how to avoid and catch mutations
    in JavaScript.


    In the next and final chapter, we are going to talk about middleware, the most
    powerful entity provided by Redux. When used wisely, middleware can reduce a lot
    of code and let us handle very complicated scenarios with ease.


    > *https://github.com/omnidan/redux-ignore'
