  md: "# Understanding next()\n\nIf we were to build our own implementation of a middleware,\
    \ we would probably want the ability to run code both before an action is passed\
    \ to the reducers and after. One approach would be to define two different callbacks\
    \ for before and after.\n\nRedux middleware takes a different approach and gives\
    \ us the next() function. Calling with an action will cause it to propagate down\
    \ the middleware chain, calling the root reducer and updating the state of the\
    \ store. We can add code before and after passing the action to the reducers:\n\
    \n```\nconst logMiddleware = ({getState, dispatch}) => next => action => {\n \
    \ console.log(\"Before reducers have run\");\n  next(action);\n  console.log(\"\
    After the reducers have run\");\n};\n```\n\nThis nifty trick gives us more power\
    \ than might initially be apparent. Since we are responsible for calling next()\
    \ and passing the action, we can choose to suppress next() in certain conditions\
    \ or even modify the current action before passing it. Failing to call-next(action)\
    \ inside a middleware will prevent the action from reaching the other middleware\
    \ and the store.\n\n# Our First Middleware\n\nTo demonstrate the power of middleware,\
    \ let's build a special debug middleware that measures how much time it takes\
    \ for our reducers to process an action.\n\n# Folder Structure\n\nA common approach\
    \ is to keep all our middleware implementations in a middleware directory at our\
    \ application root (similar to reducers and actions). As our application grows,\
    \ we might find ourselves adding subdirectories to organize the middleware, usually\
    \ by functionality (utility or authorization).\n\n> As with software and hardware,\
    \ we use middleware as both the singular and the plural form of the word. In some\
    \ sources, including the code for applyMiddleware() shown in Chapter 8, you may\
    \ see middlewares used as the plural form.\n\n# The Measure Middleware\n\nOur\
    \ time measuring middleware looks like this:"
