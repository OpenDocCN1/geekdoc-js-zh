    \ deciding what needs to be synced to local storage, or when clearing state data.\n\
    \nIn general, the state is the frontend's database and should be treated as such.\
    \ It is important to periodically check the current layout and any refactoring\
    \ to make sure the state's structure is clear, clean, and easy to extend.\n\n\
    # What to Put in the State\n\nA common issue when working with Redux is deciding\
    \ what goes inside our state and what is left outside, either in React's state,\
    \ Angular's services, or other storage methods of different UI libraries.\n\n\
    There are a few questions to consider when deciding whether to add something to\
    \ the state:\n\n+   - Should this data be persisted across page refresh?\n- Should\
    \ this data be persisted across route changes?\n- Is this data used in multiple\
    \ places in the UI?"
