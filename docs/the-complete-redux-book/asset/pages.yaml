    \ Mutations\n\nThe most important thing about reducers in Redux is that they should\
    \ never mutate the existing state. There are a number of functions in JavaScript\
    \ that can help when working with immutable objects.\n\n# Why Do We Need to Avoid\
    \ Mutations?\n\nOne of the reasons behind the immutability requirement for the\
    \ reducers is due to change detection requirements. After the store processes\
    \ the current state and action to the root reducer, and the various UI components\
