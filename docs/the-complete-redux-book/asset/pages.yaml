  md: "# Chaining APIs\n\nSometimes fetching data from a server requires a number\
    \ of different calls—for instance, when the returned data from one is needed to\
    \ issue additional calls. A simple example might be fetching the current user\
    \ and the user's profile. If we were to use promises in an action creator, the\
    \ solution would appear to quite straightforward:\n\nChaining promises\n\n```\n\
    const fetchCurrentUser = () => (dispatch) => fetch(`user`)\n  .then(response =>\
    \ response.json())\n  .then(userData => {\n    dispatch(setUserData(userData));\n\
    \    \n    // Get user's profile\n    fetch(`profile/${userData.profileid}`)\\\
    n      .then(response => response.json())\n      .then(profileData => dispatch(setProfileData(profileData)));\n\
    \  });\n```\n\nScary stuff there. There are a few issues with this code:\n\n+\
    \   - Error handling – Exact branching and catching of errors is not obvious and\
    \ can become complex as the chain grows.\n- Debugging – It is hard to debug and\
    \ understand what stage in the chain we are at.\n- Cancellation and recovery –\
    \ It is nearly impossible to cancel or abort the chain if the user navigates to\
    \ a different part of the UI and the current request is no longer needed.\n\n\
    We can see, chaining promises is not an ideal solution. When working with Redux\
    \ we have two alternatives to use, middleware and sagas.\n\n# Using Middleware\
    \ for Flow\n\nIn the middleware approach, we split the code handling server access\
    \ and logic flow. Our API middleware stays the same, and we only need to find\
    \ another place to put the logic flow. One approach, discussed in the Middleware\
    \ Chapter, is to create additional middleware to handle flow management:"
