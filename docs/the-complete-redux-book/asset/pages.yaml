  md: "# Chapter 10. Middleware\n\n# Complete debounce middleware code\n\n```\n```javascript\n\
    // Object to hold debounced actions (referenced by action.type)\nconst pending\
    \ = {};\nconst debounceMiddleware = () => next => action => {\n  const { debounce\
    \ } = action.meta || {};\n\n  if (debounce) {\n    return next(action);\n  }\n\
    \n  if (pending[action.type]) {\n    clearTimeout(pending[action.type]);\n  }\n\
    \n  pending[action.type] = setTimeout(() => {\n    delete pending[action.type];\n\
    \    next(action);\n  }, debounce);\n};\n\nexport default debounceMiddleware;\n\
    ```\n```\n\nWith this basic middleware we have created a powerful tool for our\
    \ developers. A simple meta setting on an action can now support debouncing of\
    \ any action in the system. We have also used the middleware's support for the\
    \ next() method to selectively suppress actions. The Server Communication Chapter\
    \ we will learn more about advanced uses of the async flow to handle generic API\
    \ requests.\n\n# Using Middleware for Flow Control\n\nOne important usage of middleware\
    \ is for the control of application flow and logic. Let's consider a sample user\
    \ login flow:\n\nSend POST request to server to login Save access token in store\
    \ Fetch current user's profile information Fetch latest notifications\n\nUsually\
    \ our flow will begin with a 'LOGIN' action containing the login credentials:"
