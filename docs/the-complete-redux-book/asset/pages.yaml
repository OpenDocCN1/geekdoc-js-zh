  md: "# Chapter 10. Middleware\n\nmiddleware/measure.js\n\n```\nconst measureMiddleware\
    \ = () => next => action => {\n  console.time(action.type);\n  next(action);\n\
    \  console.timeEnd(action.type);\n};\n\nexport default measureMiddleware;\n```\n\
    \nTo create this middleware we use the time() and timeEnd() console methods that\
    \ record a benchmark with the name provided as a string. We start the timing before\
    \ running any action, using the action.type as a name. Then, we tell the browser\
    \ to print the timing after the action is done. This way we can catch poorly performing\
    \ reducer implementations.\n\nAn interesting to note here is that this middleware\
    \ completely ignores the first parameter (the object get getState() and dispatch()),\
    \ as we don't need it for our example.\n\n# Connecting to Redux\n\nAdding a middleware\
    \ to the Redux store can be done only during the store creation process:\n\nRegular\
    \ Redux store\n\n```\nimport { createStore } from 'redux';\nimport reducer from\
    \ 'reducers/root';\nconst store = createStore(reducer);\n\n```\n\nThe simplest\
    \ way to connect a middleware to the Redux store is to use the applyMiddleware()\
    \ store enhancer available as an API from Redux itself (store enhancers are explained\
    \ in Chapter 8:\n\nCreate store and register the measureMiddleware\n\n```\nimport\
    \ { createStore, applyMiddleware } from 'redux';\nimport reducer from 'reducers/root';\n\
    import measureMiddleware from 'middleware/measure';\nconst store = createStore(reducer,\
    \ applyMiddleware(measureMiddleware));\n```\n\nThe applyMiddleware() function\
    \ can receive an arbitrary number of middleware as arguments and create a chain\
    \ to be connected to the store:"
