  md: '# Chapter 7. The Store


    # The subscribe method


    ```

    const store = createStore((state) => state);

    const onStoreChange = () => console.log(store.getState());

    store.subscribe(onStoreChange);

    ```


    > The subscribed callback does not get any arguments, and we need to access the
    state. We, must call store.getState() ourselves.


    The value of the subscribe() method is a function that can be used to unsubscribe
    from the store. It is important to remember to call unsubscribe() for all subscriptions
    to prevent memory leaks:


    Unsubscribing from store updates


    ```

    const unsubscribe = store.subscribe(onStoreChange);

    // When the subscription is no longer needed

    unsubscribe();

    ```


    # Replacing the Reducer


    When creating the Redux store, a reducer function (often referred to as the root
    reducer) is passed as the first parameter to createStore(). During runtime we
    can use the store''s replaceReducer() to replace this function. Usually this method
    is used in development to allow hot replacement of reducers. In complex applications
    it might be used to dynamically decorate or replace the root reducer allow code
    splitting.


    > If your application is too large to bundle into a single file or if you want
    to gain extra performance, you use a technique called code splitting—separating
    the production bundle into multiple files and loading them on demand when the
    user performs some interaction or takes a specific route. Implementing lazy loading
    is out of the scope of this book, but you might want to know that code splitting
    can be applied to the Redux store, thanks to the replaceReducer() method.


    Let''s look at a simple example with some functionality available only for authenticated
    users. Initial load, our store will only handle the currentUser substate—just
    enough for the authentication:'
