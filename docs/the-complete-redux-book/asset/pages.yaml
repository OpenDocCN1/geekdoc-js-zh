  md: "# Dynamic Action Types\n\nBuilding on the loading indicator example, we might\
    \ want to handle multiple indicators for different parts of our application, by\
    \ having multiple subtrees in the ui state sub-tree. Unfortunately, this does\
    \ not work with generic success/error actions.\n\nOne way to handle multiple pending,\
    \ success, and error actions is to pass them in the dispatched action:\n\nAction\
    \ creator with custom pending action\n\n```\nconst fetchRecipes = () => ({\n \
    \ type: 'API',\n  payload: {\n    url: 'recipes.json',\n    pending: 'FETCH_RECIPES_PENDING',\n\
    \    success: 'FETCH_RECIPES_SUCCESS',\n    error: 'FETCH_RECIPES_FAILURE'\n \
    \ }\n});\n```\n\nThis method allows us to handle different action types in different\
    \ reducers. However, this approach is not flexible, encourages code repetition,\
    \ and forces us to have multiple action types defined for every API action.\n\n\
    Another approach is to store the response status in the dispatched action:\n\n\
    ```\ndispatch({ type: FETCH_RECIPES, status: 'SUCCESS', response: });\n```\n\n\
    This might look simple, as you can reuse one action in the middleware, but it\
    \ causes reducers to contain more control flow and logic and it makes logging\
    \ and debugging more difficult (because we get the same action types in the log\
    \ and need to accurately verify which one of them had a particular status).\n\n\
    A third approach is to create dynamic action types that will follow a single convention:"
