  md: '# Chapter 9. Reducers


    There are a number of ways to detect a change made to a tree, each with its pros
    and cons. Among the many solutions, one is to mark where changes were made in
    the tree. We can use simple methods like setting a dirty flag, use more complicated
    approaches like adding a version to each node, or (the preferred Redux way) use
    reference comparison.


    > If you are unsure of how references work, jump ahead to the next two chapters
    and come back to this one after.


    Redux and its accompanying libraries rely on reference comparison. After the root
    reducer has run, we should be able to compare the state at each level of the state
    tree with the same level on the previous tree to determine if it has changed.
    But instead of comparing each key and value, we can compare only the reference
    or the pointer to the structure.


    In Redux, each changed node or leaf is replaced by a new copy of itself that has
    the changed data. Since the node''s parent still points to the old copy of the
    node, we need to create a copy of it as well, with the new copy pointing to the
    new child. This process continues with each parent being recreated until we reach
    the root of the tree. This means that a change to a leaf must cause its parent,
    the parent''s parent, etc. to be modified—i.e., it causes new objects to be created.
    The following illustration shows the state before and after it is run through
    a reducer tree and highlights the changed nodes.'
