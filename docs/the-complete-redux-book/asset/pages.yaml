    recipes list is empty and check that it was changed to contain the server-returned
    data after the fetchRecipes() action completed.


    # Integration Tests Summary


    As can be seen from this simple test, doing integration tests in Redux is usually
    fairly straightforward. Since everything is driven by actions, in most cases our
    integration tests will follow the four steps outlined above: we verify the initial
    state of the system, mock any external dependencies, dispatch an action, and verify
    that the state has changed and any external APIs were called as expected.


    # Summary


    In this chapter we have discussed in detail various methods of testing Redux using
    the Jest library. Given the clear division of responsibilities in Redux and in
    keeping with its plain JavaScript objects and idempotent functions, most unit
    tests (and integration tests) are short and simple to write.


    This is in turn means that we, as developers, can minimize the time we spend writing
    tests and still have a comprehensive and understandable testing suite.


    This is the last chapter in the “Real World” part of this book. In the next part,
    “Advanced Redux,” we will delve deeper into each of Redux’s actors and learn advanced
    methods for organizing and managing our code.'
