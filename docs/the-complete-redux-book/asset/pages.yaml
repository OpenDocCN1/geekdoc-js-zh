  md: "# Chapter 9. Reducers\n\n145\n\nFollowing this separation of concerns, we can\
    \ put each reducer into a different file and have a single root reducer manage\
    \ all of them. Another side of this approach is that the root reducer will pass\
    \ each of its children only the part of the state that it cares about (e.g., the\
    \ ingredients reducer will only get the ingredients substate of the store). This\
    \ ensures the individual reducers can't “break out” of their encapsulation.\n\n\
    # Recipes reducer\n\n```\nconst initialState = [];\n\nexport default function\
    \ recipesReducer(recipes = initialState, action) {\n  switch (action.type) {\n\
    \    case ADD_RECIPE:\n      return [...recipes, action.payload];\n    ...\n \
    \ }\n}\n```\n\n# Ingredients reducer\n\n```\nconst initialState = [];\n\nexport\
    \ default function ingredientsReducer(ingredients = initialState, action) {\n\
    \  switch (action.type) {\n    case ADD_INGREDIENT:\n      return [...ingredients,\
    \ action.payload];\n    ...\n  }\n}\n```\n\n# Root reducer\n\n```\nimport reducers\
    \ from 'reducers/recipes';\nimport ingredientsReducer from 'reducers/ingredients';\n\
    \nconst rootReducer = (state = {}, action) => Object.assign({}, state, {\n  recipes:\
    \ recipesReducer(state.recipes, action),\n  ingredients: ingredientsReducer(state.ingredients,\
    \ action)\n});\n\nexport default rootReducer;\n```"
