  md: '# Chapter 9. Reducers


    The last approach is to use special helper functions that can receive a regular
    object and an instruction on how to change it and return a new object as result.
    There is an immutability helper** named `update()`. Its syntax might look a bit
    weird, but if you don''t want to work with immutable objects and clog object prototypes
    of new functions, it might be a good option.


    Example of the update function


    ```

    1 import update from ''immutability-helper'';

    2

    3 const newData = update(myData,

    4 x: { y: { z: {$set: 7} }},

    5 a: { b: {$push: [9]} } }

    6 });

    ```


    # Higher-Order Reducers


    The power of Redux is that it allows you to solve complex problems using functional
    programming. One approach is to use higher-order functions. Since reducers are
    nothing more than pure functions, we can wrap them in other functions and create
    very simple solutions for very complicated problems.


    There are a few good examples of using higher-order reducers—for example, for
    implementing undo/redo functionality. There is a library called redux-undo* that
    takes your reducer and enhances it with functionality. It creates three substates:
    past, present, and future. Every time your reducer creates a new state, the previous
    one is pushed to the past states and the new becomes the present state. You can
    use special actions to undo, redo, or reset the present state.


    Using a higher-order reducer is as simple as passing your reducer into an imported
    function:


    ```

    1 import { combineReducers } from ''redux'';

    2 import recipesReducer from ''reducers/recipes'';

    3 import ingredientsReducer from ''reducers/ingredients'';

    4 import undoable from ''redux-undo'';

    5

    6 const rootReducer = combineReducers({

    7 recipes: undoable(recipesReducer),

    8 ingredients: ingredientsReducer

    9 });

    ```


    > *https://github.com/kolodny/immutability-helper


    > **https://github.com/omnidan/redux-undo'
