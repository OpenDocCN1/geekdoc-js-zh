  md: '# Chapter 9. Reducers


    there are a number of methods and tools that strive to protect developers from
    these hard-to-find bugs.


    One approach is to use libraries like deep-freeze that will throw errors every
    someone tries to mutate a "frozen" object. While JavaScript provides an Object.freeze()
    method, it freezes the object it is applied to, not its children. deep-freeze
    and similar libraries perform nested freezes and method overrides to better catch
    errors.


    Another approach is to use libraries that manage immutable objects. While they
    add additional dependencies to the project, they offer a number of benefits as
    well: they ensure true immutability, cleaner syntax to update collections, support
    nested objects and perform performance improvements on large data sets.


    The most common library is Facebook''s Immutable.js, which offers a number of
    key advantages (in addition to many advanced features):


    +   * Fast updates on very large objects and arrays

    * Lazy sequences

    * Additional data types not available in plain JavaScript

    * Convenient methods for deep mutation of trees

    * Batched updates


    It also has a few disadvantages:


    +   * Additional large dependency for the project

    * Requires the use of custom getters and setters to access the data

    * Might degrade performance where large structures are not used


    It is important to carefully consider your state tree before choosing an immutable
    library. The performance gains might only become perceptible for a small percentage
    of the project, and the library will require all of the developers to understand
    a new syntax and collection of methods.


    Another library in this space is seamless-immutable, which is smaller, works on
    plain JavaScript objects, and treats immutable objects the same way as regular
    JavaScript objects (though it has similar convenient methods to Immutable.js).
    Its author has written a great post about some of the issues he has had with Immutable.js
    and his reasoning for creating a smaller library.


    > seamless-immutable does not offer many of the advantages of Immutable.js (sequences,
    batching, smart underlying data structures, etc.), and you can''t use ES2016 data
    structures with it, as Map, Set, WeakMap, and WeakSet.


    * https://www.npmjs.com/package/deep-freeze

    * https://facebook.github.io/immutable-js/

    * https://github.com/rtelfman/seamless-immutable

    * https://tech.noreled.com/post/50761783018/switching-from-immutable-to-seamless-immutable'
