  md: "# Subscribing to store updates\n\n```\nstore.subscribe(updateView);\n```\n\n\
    Since subscribe() does not pass the state to the callback, we will need to access\
    \ it store.getState():\n\nUpdate view by getting the state out of the store\n\n\
    ```\n// Update view (this might be React in a real app)\nfunction updateView()\
    \ {\n  document.querySelector('*counter').innerText = store.getState().counter;\n\
    }\nstore.subscribe(updateView);\n```\n\nThe last change is in the dispatch() method.\
