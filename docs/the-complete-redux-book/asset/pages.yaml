  md: "Chapter 10. Middleware\n\n# Debounce flow\n\n```\n0ms: dispatch({ type: 'AUTO_COMPLETE',\
    \ payload: 'c', meta: { debounce: 50 } });\n// Suppressed\n10ms: dispatch({ type:\
    \ 'AUTO_COMPLETE', payload: 'ca', meta: { debounce: 50 } });\n// Suppressed\n\
    20ms: dispatch({ type: 'AUTO_COMPLETE', payload: 'cat', meta: { debounce: 50 }\
    \ });\n// Suppressed\n50ms:\n// The action with payload 'cat' is dispatched by\
    \ the middleware.\n```\n\nThe skeleton of our middleware needs to inspect only\
    \ actions that have the required debounce time set in their metadata.\n\n# Debounce\
    \ middleware skeleton\n\n```\nconst debounceMiddleware = () => next => action\
    \ => {\n  const { debounce } = action.meta || {};\n\n  if (!debounce) {\n    return\
    \ next(action);\n  }\n\n  // TODO: Handle debouncing\n};\n\nexport default debounceMiddleware;\n\
    ```\n\nSince we want each action type to have a different debounce queue, we will\
    \ create a pending object that will hold information for each action type. In\
    \ our case, we only need a handle to the latest timeout for each action type."
