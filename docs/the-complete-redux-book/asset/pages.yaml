  md: "# Action Creators and Reducers\n\nWhen writing unit tests it is recommended\
    \ to test each part of the system separately and only test connections and interfaces\
    \ in the integration tests. In the case of Redux, though, it is worth considering\
    \ the connection between action creators and reducers.\n\nIn the current we've\
    \ built our tests, the ADD_RECIPE action object is defined in three different\
    \ places: the recipe's action creators, the recipe's tests, and the reducer's\
    \ tests.\n\nIf, in the future, we decide to change the structure of the ADD_RECIPE\
    \ action, our action creator will catch the change and remind us to update the\
    \ test code. But the reducer's tests will continue to pass unless we remember\
    \ to change the hardcoded ADD_RECIPE action objects used in those tests as.\n\n\
    This can lead to painful cases where all the tests pass, but the system doesn't\
    \ work. To avoid this, we stop using hardcoded action objects in reducers and\
    \ rely on action creators directly:\n\n```\nit('should add recipe to empty list',\
    \ () => {\n  expect(reducer(initialState, addRecipe('test'))).toMatchSnapshot();\n\
    });\n\nit('should add recipe to empty list', () => {\n  const baseState = deepFreeze(reducer(initialState,\
    \ addRecipe('first')));\n  expect(reducer(baseState, addRecipe('test'))).toMatchSnapshot();\n\
    });\n```\n\nWhile repeating the unit test, combining the reducers with action\
    \ creators results in cleaner code, fewer bugs, and less duplication.\n\n# Unknown\
    \ Actions\n\nOne last issue to test with reducers is that they gracefully handle\
    \ unknown actions and return the original state passed to them without modifications.\n\
    \n> every action can propagate to the whole reducer tree, it is important for\
    \ the reducer to return the original state and not a modified copy. This will\
    \ allow UI libraries to identify changes in the tree using reference comparison.\n\
    \nWe can do this as follows:"
