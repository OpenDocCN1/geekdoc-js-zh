  md: 'Chapter 9. Reducers


    147


    # # Default Values


    One of the requirements of combineReducers() is for each reducer to define the
    default value for its substrate. But our recipes and ingredients reducers defined
    the initial state for their subtrees as an empty object. Using this approach,
    the structure of the state tree as a whole is not defined in a single place but
    built up by the reducers. This guarantees that changes to the tree require us
    to only change the applicable reducers and do not affect the rest of the tree.


    This is possible because when the store is created, Redux dispatches a special
    action called @redux/INIT. Each reducer receives that action together with the
    undefined initial state, which gets replaced by the parameter defined inside the
    reducer. Since our switch statements do not process this action type and simply
    return the state (previously assigned by the default parameter), the initial state
    of the store is automatically populated by the reducers.


    # # Tree Mirroring


    This brings us to an important conclusion: we want to structure our reducers tree
    to mimic the application state tree. As a rule of thumb, we will need to have
    a reducer for each leaf of the tree. It would also be handy to mimic the folder
    structure in the reducers directory, as it will be self-depicting of how the state
    tree is structured.


    As complicated manipulations might be required to add some parts of the tree,
    some reducer might fall into this pattern. We might find ourselves having two
    or more redu process the same subtree (sequentially), or a single reducer operating
    on multiple branches (if it needs to update structures at two different branches).
    This might cause complications in the structure and composition of our application.
    Such issues can usually be avoided by normalizing the tree, splitting a single
    action into multiple ones, and other Redux tricks.


    # # Alternative to switch Statements


    After a while, it becomes apparent that most reducers are just switch statements
    over action type. Since the switch syntax can be hard to read and prone to errors,
    there are a few libraries that try to make writing reducers easier and cleaner.


    > While it is most common for a reducer to examine the type property of the action
    to determine if it should, in some other cases property of the action''s object
    are used. For example, you might want to show an error notification on every action
    that has an error in the payload.


    A common library is redux-create-reducer³⁶, which builds a reducer from a configuration
    object that defines how to respond to different actions:


    ³https://github.com/kolodny/redux-create-reducer'
