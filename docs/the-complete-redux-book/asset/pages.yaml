    \ Subscribe to changes API\n\n```\nsubscribe(updateView);\n```\n\nWe have now\
    \ created a basic application structure with a simple state, implemented a function\
    \ that will be responsible for updating the HTML based on the state, and defined\
    \ two \"magic\" functions–dispatch() and subscribe()–to dispatch actions and subscribe\
    \ to changes in state. But there is"
