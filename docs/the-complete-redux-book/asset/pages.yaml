  md: "# Chapter 9. Reducers\n\nReducer using redux-create-reducer\n\n```\nimport\
    \ { createReducer } from 'redux-create-reducer';\nconst initialState = [];\nconst\
    \ recipesReducer = createReducer(initialState, {\n  [ADD_RECIPE](recipes, action)\
