  md: "Chapter 4. Server Communication\n\nCombining these two ideas results in the\
    \ following basic API middleware:\n\n# Basic API middleware\n\n```\nconst apiMiddleware\
    \ = ({ dispatch }) => next => action => {\n  if (action.type !== 'API') {\n  \
    \  return next(action);\n  }\n  const { payload } = action;\n\nfetch(BASE_URL\
    \ + action.url)\n    .then(response => response.json())\n    .then(response =>\
    \ dispatch({ type: payload.success, response }));\n};\n```\n\n# Using the API\
    \ Middleware\n\nTo use our middleware we need to craft a special action object\
    \ for it:\n\nSample action creator\n\n```\nimport { API, SET_RECIPES } from 'constants/action-types';\n\
    const fetchRecipes = () => ({\n  type: API,\n  payload: {\n    url: 'recipes.json',\n\
    \    success: SET_RECIPES\n  }\n});\n```\n\nOur middleware should call the server\
    \ and resume the regular application flow. At a later time, once the call from\
    \ the server completes, it should dispatch a new action to the store:"
