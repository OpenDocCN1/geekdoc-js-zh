  md: "# Chapter 2. Your First Redux Application\n\nActions in Redux are nothing more\
    \ than plain objects that have a mandatory type property. We will be using strings\
    \ to name our actions, the most appropriate in this case being 'ADD_RECIPE'. Since\
    \ a recipe has a name, we will add it to the action's data when dispatching:\n\
    \n# Dispatching a Redux object\n\n```\nstore.dispatch({ type: 'ADD_RECIPE', name:\
    \ 'Pancake' });\n```\n\nLet's modify our reducer to support the new action. A\
    \ simple approach might appear to be the following:\n\nReducer supports ADD_RECIPE\
    \ =>\n\n```\nconst reducer = (state, action) => {\n  switch (action.type) {\n\
    \    case 'ADD_RECIPE':\n      state.recipes.push({ name: action.name });\n  \
    \  }\n  return state;\n};\n```\n\nWhile this looks correct (and works when tested\
    \ in our simple example), this violates the basic Redux principle of store immutability.\
    \ Our reducers must never change the state, but only create a new copy of it,\
    \ with any modifications made. Thus, our reducer code needs to be modified:\n\n\
    Correct way to build a reducer\n\n```\nconst reducer = (state, action) => {\n\
    \  switch (action.type) {\n    case 'ADD_RECIPE':\n      return Object.assign({},\
    \ state, {\n        recipes: state.recipes.concat({ name: action.name });\n  \
    \    });\n  }\n  return state;\n};\n```\n\nThe 'ADD_RECIPE' case has become more\
    \ complex but works as expected. We are using the Object.assign() method Object.assign({},\
    \ state, { key: value }) to create a new object that has all the key/value pairs\
    \ from our old state, but overrides the recipes with a new value. To calculate\
    \ the list of new recipes we use concat() instead of push(), as push() modifies\
    \ the original array while concat() creates a new array containing the original\
    \ values and the new one.\n\nMore information about the Object.assign() method\
    \ is available in the Reducers Chapter."
  merge: -1
  pgno: 34
- img_proc: true
  md: "# Adding Ingredients\n\nSimilar to adding recipes, this step will require us\
    \ to modify the reducer again to add support for adding ingredients:\n\nAdding\
    \ ADD_INGREDIENT to the reducer\n\n```\nconst reducer = (state, action) => {\n\
    \  switch (action.type) {\n    case 'ADD_RECIPE':\n      return Object.assign({},\
    \ state, {\n        recipes: state.recipes.concat({ name: action.name })\n   \
    \   });\n    case 'ADD_INGREDIENT':\n      const newIngredient = {\n        name:\
    \ action.name,\n        recipe: action.recipe,\n        quantity: action.quantity\n\
    \      };\n      return Object.assign({}, state, {\n        ingredients: state.ingredients.concat(newIngredient)\n\
    \      });\n  }\n  return state;\n}\n```\n\nOne problem you might encounter while\
