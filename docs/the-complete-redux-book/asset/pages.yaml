    # reselect⁷⁵⁷


    If you count the Redux store as a client-side database of your application, you
    can definitely count selectors as queries to that database. reselect allows you
    to create and manage composable and efficient selectors, which are crucial in
    any large application.


    # redux-actions³⁸


    Written by Redux creator Andrew Clark⁴⁹, this library reduces the amount of boilerplate
    code you need to write when working with action ES2016 fashion, we find it particularly
    useful for writing reducers in more undo without using large switch statements.


    # redux-undo⁶⁰


    If you ever need to implement undo/redo/reset functionality in some parts of your
    application, we recommend using this awesome. It provides a higher-order reducer
    that can easily extend your reducer to support action history.


    # redux-logger⁶¹


    redux-logger is a highly configurable middleware for logging Redux actions, including
    the state before and after the action, in the browser console. It should only
    be used in development. Our advice is to use the collapsed: true option to make
    the console output more readable and manageable.


    # redux-localstorage⁶²


    This insanely simple store enables persisting and dehydrating parts of the store
    in the browser''s localStorage. It does not support other storage implementations,
    such as sessionStor. Beware that localStorage is not supported in private mode
    by some browsers and always check its performance in large applications.


    # Courses Started with Tutorials


    “Getting Started with Redux”⁶³ is a free video course by Redux creator Dan Abramov,
    where he implements Redux from scratch and shows how to use it with ReactJS.


    Learn Redux⁶⁴ is a free screensast by Wes Bos. You can follow along with the series
    to build a simple photo app using Redux and React.


    Finally, the Redux documentation⁶⁵ is a truly great resource: a well-maintained,
    constantly improving source of knowledge for this truly powerful library.


