  md: "# # Chapter 9. Reducers\n\nThe word **reducer** is commonly associated in computer\
    \ science with a function that takes an array or object and converts it to a simpler\
    \ structure—for example, summing all the items in an array. In Redux, the role\
    \ of the reducer is somewhat different: reducers create a new state out of the\
    \ old one, based on an action.\n\nIn essence, a reducer is a simple JavaScript\
    \ function that receives two parameters (two objects) and returns an object (a\
    \ modified copy of the first argument):\n\nA simple reducer example\n\n```\nconst\
    \ sum = (result, next) => result + next;\n[1,2,3].reduce(sum); // -> 6\n```\n\n\
    Reducers in Redux are **pure functions**, meaning they don't have any side effects\
    \ such as changing local storage, contacting the server, or saving any data in\
    \ variables. A typical reducer looks like this:\n\nBasic reducer\n\n```\nfunction\
    \ reducer(state, action) {\n  switch (action.type) {\n    case 'ADD_RECIPE':\n\
    \      // Create new state with a recipe\n    default:\n      return state;\n\
    \  }\n}\n```\n\n# # Reducers in Practice\n\nIn Redux, reducers are the final stage\
    \ in the unidirectional data flow. After an action is dispatched to the store\
    \ and has passed through all the middleware, reducers receive the current state\
    \ of the application. Then they create a new state that has been modified according\
    \ to the action and return it to the store."
  merge: -1
  pgno: 148
