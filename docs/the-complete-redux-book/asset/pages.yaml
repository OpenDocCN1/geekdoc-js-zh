  md: "# Chapter 10. Middleware\n\n1 applyMiddleware(middlewareA, middlewareB, middlewareC);\n\
    \n> Note that the order of registration is important. The first middleware, in\
    \ our case middlewareA, will get the action before middlewareB. And if the code\
    \ decides to modify or suppress the action, it will never reach middlewareB or\
    \ middlewareC.\n\nIn real-world applications, we prefer to apply some middleware\
    \ only in development or production environments. For example, our measureMiddleware\
    \ might output unwanted information in the live product, and an analyticsMiddleware\
    \ might report false analytics in development.\n\nUsing the spread operator from\
    \ ES2016, we can apply middleware to the state conditionally:\n\n```\nconst middleware\
    \ = [apiMiddleware];nif (development) {\n  middleware.push(measureMiddleware);\n\
    } else {\n  middleware.push(analyticsMiddleware);\n}\nconst store = createStore(reducer,\
    \ applyMiddleware(...middleware));\n```\n\n# Async Actions\n\nWhat makes middleware\
    \ so powerful is the access to both getState() and dispatch(), as these functions\
    \ allow a middleware to run asynchronous actions and give it access to the store.\
    \ A very simple example would be an action debounce middleware. Suppose we have\
    \ an autocomplete field, and we want the AUTO_COMPLETE action from running as\
    \ the user types in a search term. We would probably want to wait 500ms for the\
    \ user to type in the search string, and then run the query with the latest value.\n\
    \nWe can create a debounce middleware that will catch any action with the debounce\
    \ key set in its metadata and ensure it is delayed by that number of milliseconds.\
    \ Any additional action of the same type that is passed before the debounce timer\
    \ expires will not be passed to reducers but only saved as the “latest action”\
    \ and executed once the debounce timer has expired:"
