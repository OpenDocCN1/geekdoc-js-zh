  md: "# General tests\n\nThe first test for any middleware is to ensure that it passes\
    \ unknown actions down the chain. We forget to use next(action), no actions will\
    \ reach the reducers:\n\nVerify unknown actions are handled correctly\n\n```\n\
    it('should ignore non-API actions', () => {\n  const sampleAction = { type: 'SAMPLE_ACTION'\
    \ };\n\n  middleware(sampleAction);\n  expect(dispatch.mock.calls.length).toBe(0);\n\
    \  expect(next.mock.calls).toEqual([sampleAction]);\n});\n```\n\nHere we verify\
    \ that dispatch() is never called and next() is called exactly once with our sampleAction.\
    \ Since we will be using dispatch.mock.calls and next.mock.calls very often in\
    \ our tests, we can shorten it a little by adding the following to our setup code:\n\
    \nImprove the setup code\n\n```\nlet next, dispatch, middleware, dispatchCalls,\
    \ nextCalls;\nbeforeEach(() => {\n  next = jest.fn();\n  dispatch = jest.fn();\n\
    \  dispatchCalls = dispatch.mock.calls;\n  nextCalls = next.mock.calls;\n  middleware\
    \ = apiMiddleware({ dispatch })((next);\n});\n```\n\nInstead of expect(next.mock.calls)\
    \ we can use expect(nextCalls).\n\nAnother general test could be to verify that\
    \ the API_STARTED action is dispatched every time the middleware is about to access\
