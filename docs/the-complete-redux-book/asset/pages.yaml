  md: '# Summary


    Middleware are an exceptionally versatile and useful part of Redux, and they are
    commonly used to hold the most complicated and generic parts of an application.
    They have access to the current action, to the store, and to the `dispatch()`
    method, giving them more power than any other part of Redux.


    Our exploration of advanced Redux concepts ends here. In the next section you
    will find links to materials for further reading and learning. Thank you for reading
    our book, and don''t forget to send your feedback at info@redux-book.com. Happy
    coding!'
