    capturing (?:...) are not memorized by the engine.


    > Don''t mess up in the pattern \1, in the replacement: $1

    In the replacement string we use a dollar sign: $1, while in the pattern – a backslash
    \1.


    # Backreference by name: \k<name>


    If a regex has many parentheses, it''s convenient to give them names.

    To reference a named group we can use \k<и>.

    In the example below the group quotes is named ?<quote>, so the backreference
    is \<quote>


    ```

