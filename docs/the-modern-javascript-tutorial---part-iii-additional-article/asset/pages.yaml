  md: "If we put something inside a <slot>, it becomes the fallback, \"default\" content.\
    \ The browser shows it if there's no corresponding filler in light DOM.\n\nFor\
    \ example, in this piece of shadow DOM, Anonymous renders if there's slot=\"username\"\
    \ in light DOM.\n\n```\n<div>Name:\n  <slot name=\"username\">Anonymous</slot>\n\
    </div>\n```\n\n# Default slot: first unnamed\n\nThe first <slot> in shadow DOM\
    \ that doesn't have a name is a \"default\" slot. It gets all nodes from the light\
    \ DOM that aren't slotted elsewhere.\n\nFor example, let's add the default slot\
    \ to our <user-card> that shows all unslotted information about the user:\n\n\
    ```\n<script>\ncustomElements.define('user-card', class extends HTMLElement {\n\
    connectedCallback() {\n  this.attachShadow({mode: 'open'});\n  this.shadowRoot.innerHTML\
    \ = `\n    <div>Name:\n      <slot name=\"username\"></slot>\n    </div>\n   \
    \ <div>Birthday:\n      <slot name=\"birthday\"></slot>\n    </div>\n    <fieldset>\n\
    \      <legend>Other information</legend>\n      <slot></slot>\n    </fieldset>\n\
    \  `;\n}\n});\n</script>\n```\n\n```\n<user-card>\n  <div>I like to swim.</div>\n\
    \  <span slot=\"username\">John Smith</span></span>\n  <span slot=\"birthday\"\
    >01.01.2001</span></span>\n  <div>...And play volleyball too!</div>\n</user-card>\n\
    ```"
