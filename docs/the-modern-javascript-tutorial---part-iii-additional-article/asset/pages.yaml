    \      <li slot=\"item\">Cup Cake</li>\n      </slot>\n    </ul>\n  </div>\n</custom-menu>\n\
    ```\n\nOne might notice that, in a valid DOM, <li> must be a direct child of <ul>.\
    \ But that's flattened DOM, it describes how the component is rendered, such thing\
