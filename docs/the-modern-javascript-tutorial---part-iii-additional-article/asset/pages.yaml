- img_proc: true
  md: '```

    \d+......\d+

    (123456)(789)!

    ```


    The first number has 6 digits, and then 2 numbers:


    ```

    \d+......\d+\d+

    (123456)(78)(9)!

    ```


    ...And so on.


    There are many ways to split a digits 123456789 into numbers. To be precise, there
    are $2^{n-1}$, where n is the length of the set.


    For $n=20$ there are about 1 million combinations, for $n=30$ – a thousand times
    more. Trying each of them is exactly the reason why the search takes so long.


    What to do?


    Should we turn on the lazy mode?


    Unfortunately, they won''t help: if we replace `\d+` with `\d?`, the regex will
    still hang. The order of combinations will change, but not their total count.


    Some regular expression engines have tricky tests and finite automations that
    allow to avoid going through all combinations or make it much faster, but not
    all engines, and not in all cases.


    # Back to words and strings


    The similar thing happens in our first example, when we look words by pattern
    `^(\w+\s?)*$` in the string `An input that hangs!`.


    The reason is that a word can be represented as one `\w` or many:


    ```

    (input)

    (inpu)(t)

    (inp)(u)(t)

    (inp)(p)(ut)

    ...

    ```


    For a human, it''s obvious that there may be no match, because the string ends
    with an exclamation sign `!`, but the regular expression expects a wordly character
    `\w` or a space `\s` at the end. The engine doesn''t know that.'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'It tries combinations of how the regexp (\w\ss*) can "consume" the string,
    including variants with spaces (\w\s*) and without them (\w+*) (because spaces
    \s? are optional). As there are many such combinations, the search takes a lot
    of time.


    # How to fix?


    There are two main approaches to fixing the problem.


    The first is to lower the number of possible combinations.


    Let''s rewrite the regular expression ^(\w\s*)\w* – we will look for any number
    of words followed by a space (\w\s*), and then (optionally) a word \w*.


    This regexp replaces the previous one (matches the same) and works:


    ```

    let regexp = /^(\w\s*)\w*$/

    let str = "An input string that takes a long time or even makes this regex to
    hang!"

    alert(regexp.test(str)); // false

    ```


    Why did the problem disappear?


    Now the star * goes after \w+ instead of \w+?. It became impossible to represent
    one word of the string with multiple successive \w+. The time needed to try such
    combinations is now saved.


    For example, the previous pattern (\w\s?*) could match the word string two \w+:


    ```

    \w+w+

    string

    ```


    The previous pattern, due to the optional \s allowed variants \w+, \w\s*, \w+\w+
    and so on.


    With the rewritten pattern (\w\s)**, that''s impossible: there may be \w\s or
    \w+\s\w*, but not \w+\w+. So the overall combinations count is greatly decreased.


    # Preventing backtracking


    It''s not always convenient to rewrite a regexp. And it''s not always obvious
    how to do it.'
