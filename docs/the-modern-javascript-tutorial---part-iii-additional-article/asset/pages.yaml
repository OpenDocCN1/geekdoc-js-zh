  md: "```\n<style>\n/* make the slider track red */\ninput::-webkit-slider-runnable-track\
    \ {\n  background: red;\n}\n</style>\n\n<input type=\"range\">\n```\n\nOnce again,\
    \ pseudo is a non-standard attribute. Chronologically, browsers first started\
    \ to experiment with internal DOM structures to implement controls, and then after\
    \ time, shadow DOM was standardized to allow us, developers, to do the same thing.\n\
    \nFurther on, we'll use the modern shadow DOM standard, covered by [DOM spec](https://developer.mozilla.org/en-US/docs/Web/API/Shadow_DOM)\
    \ other related specifications.\n\n# Shadow tree\n\nA DOM element can have two\
    \ types of DOM subtrees:\n\n+   1. Light tree – a regular DOM subtree, made of\
    \ HTML children. All subtrees we've seen in previous chapters were “light”.\n\
    n2. Shadow tree – a hidden DOM subtree, not reflected in HTML, hidden from prying\
    \ eyes.\n\nIf an element has both, then the browser renders only the shadow tree.\
    \ But we can set up a kind of composition between shadow and light trees as well.\
    \ We will see the details in the chapter [Shadow DOM slots, composition](https://developer.mozilla.org/en-US/docs/Web/API/Shadow_DOM/Slots).\n\
    \nShadow tree can be used in Custom Elements to hide component internals and apply\
    \ component-local styles.\n\nFor example, `<show-hello>` element hides its internal\
    \ DOM in shadow tree:\n\n```\n<script>\ncustomElements.define('show-hello', class\
    \ extends HTMLElement {\n  connectedCallback() {\n    const shadow = this.attachShadow({mode:\
    \ 'open'});\n    shadow.innerHTML = `<p>\n      Hello, ${this.getAttribute('name')}\n\
    \    </p>`;\n  }\n});\n</script>\n```"
