  md: 'Cookies are small strings of data that are stored directly in the browser.
    They are a part of HTTP protocol, defined by RFC 6265-specification.


    Cookies are usually set by a server-serving using response `Set-Cookie` HTTP-header.
    The browser automatically adds them to (almost) every request to the same domain
    using `Cookie` HTTP-header.


    One of the most widespread use cases is authentication:


    +   1. Upon sign in, the server uses `Set-Cookie` HTTP-header in the response
    to set a cookie with a unique "session identifier".

    2. Next time when the request is set to the same domain, the browser sends the
    cookie over the net using `Cookie` HTTP-header.

    3. So the server knows who made the request.


    We can also access cookies from the browser, using `document.cookie` property.

    There are many tricky things about cookies and their options. In this chapter
    we''ll cover them in detail.


    # Reading from document.cookie


    Assuming you''re at javascript.info, it''s possible to see the cookies from it,
    like this:


    ```

    // At javascript.info, we use Google Analytics for statistics,

    // so there should be some cookies

    alert(document.cookie); // cookie1=value1; cookie2=value2...

    ```


    The value of `document.cookie` consists of `name=value` pairs, delimited by `;`.
    Each one is a separate cookie.


    To find a particular cookie, we can split `document.cookie` by `;`, and then find
    the right name. We can use either a regular expression or array functions to do
    that.


    We leave it as an exercise for the reader. Also, at the end of the chapter you''ll
    find helper functions to manipulate cookies.


    # Writing to document.cookie


    We can write to `document.cookie`. But it''s not a data property, it''s an accessor
    (getter/setter). An assignment to it is treated specially.


    A write operation to `document.cookie` updates only cookies mentioned in it, but
    doesn''t touch other cookies.


    For instance, this call sets a cookie with the name `user` and value `John:`'
  merge: -1
