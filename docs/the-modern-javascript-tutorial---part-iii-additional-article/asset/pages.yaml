  md: 'XMLHttpRequest is a built-in browser object that allows to make HTTP requests
    in JavaScript.


    Despite having the word "XML" in its name, it can operate on any data, not only
    in XML format. We can upload/download files, track progress and much more.


    Right now, there''s another, more modern method fetch , that somewhat deprecates
    XMLHttpRequest.


    In modern web-development XMLHttpRequest is used for three reasons:


    +   1. Historical reasons: we need to support existing scripts with XMLHttpRequest

    2. We need to support old browsers, and don''t want polyfills (e.g. to keep scripts
    tiny).

    3. We need something that fetch can''t do, e.g. to track upload progress.


    Does that sound familiar? If yes, all right, go on with XMLHttpRequest . Otherwise,
    please head on to Fetch.


    # The basics


    XMLHttpRequest has two modes of operation: synchronous and asynchronous.


    Let''s see the asynchronous first, as it''s used in the majority of cases.


    To do the request, we need 3 steps:


    1. Create XMLHttpRequest :


    ```

    let xhr = new XMLHttpRequest();

    ```


    The constructor has no arguments.


    2. Initialize it, usually right after new XMLHttpRequest :


    ```

    xhr open(method, URL, [async, user, password])

    ```


    This method specifies the main parameters of the request:


    +   - method – HTTP-method. Usually "GET" or "POST"

    - URL – the URL to request, a string, can be URL object.

    - async – if explicitly set to false, then the request is synchronous, we''ll
    cover that a bit later.

    - user, password – login and password for basic HTTP auth (if required).'
