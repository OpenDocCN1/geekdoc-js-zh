    # Parentheses contents in the match


    Parentheses are numbered from left to right. The search engine memorizes the content
    matched by them and allows to get it in the result.


    The method `str.match(regexp)`, if `regexp` has no flag g, looks for the first
    match and returns it as an array:


    +   1. At index 0 : the full match.

    2. At index 1 : the contents of the first parentheses.

    3. At index 2 : the contents of the second parentheses.

    4. ...and so on...


    For instance, we''d like to find HTML tags `<.*?>`, and process them. It would
    be convenient to have tag content (inside the angles), in a separate variable.


    Let''s wrap the inner content into parentheses, like this: `<(.*?)>`.


    Now we''ll get the tag as a whole `<h1>` and its contents h1 in the resulting
    array:


    ```

    let str = ''<h1>Hello, world!</h1>'';

    let tag = str.match(/(.*?)>/);


    alert(tag[0]); // <h1>

    alert(tag[1]); // h1

    ```


    # Nested groups


    Parentheses can be nested. Searching for a tag in `<span class="my">` also goes
    from left to right.


    For instance, when searching a tag `<span class="my">` we may be interested in:


    +   1. The tag content as a whole: `span class="my"`.

    2. The tag name: `span`.

    3. The tag attributes: `class="my"`.


    Let''s add parentheses for them: `(([a-z]+)\s*([^>]*)`.


    Here''s how they are numbered (left to right, by the opening paren):'
