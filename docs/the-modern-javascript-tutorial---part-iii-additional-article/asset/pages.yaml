  md: 'To make a regexp more precise, we often need make it more complex


    We can see one common rule in these examples: the more precise is the regular
    expression – the longer and more complex it is.


    For instance, for HTML tags we could use a simpler regexp: `<w+>`. But HTML has
    stricter restrictions for a tag name, `<[a-z][a-z0-9]*>` is more reliable.


