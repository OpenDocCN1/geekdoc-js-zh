  md: 'There may be additional headers Sec-WebSocket-Extensions and Sec-WebSocket-Protocol
    that describe extensions and subprotocols.


    For instance:


    +   - Sec-WebSocket-Extensions: deflate-frame means that the browser supports
    compression. An extension is something relating to transferring the data, functionality
    that extends WebSocket protocol. The header Sec-WebSocket-Extensions is sent automatically
    by the browser, with the list of all extensions it supports.


    +   - Sec-WebSocket-Protocol: soap, wamp means that we''d like to transfer not
    just data, but the data in SOAP or WAMP ("The WebSocket Application Messaging
    protocol"). WebSocket subprotocols are registered in the IANA catalogue . So,
    this header describes data formats that we''re going to use.


    This optional header is using the second parameter of new WebSocket . That''s
    the array of subprotocols, e.g. if we''d like to use SOAP or WAMP:


    ```

    let socket = new WebSocket("wss://javascript.info/chat", ["soap", "wamp"]);

    ```


    The server should respond with a list of protocols and extensions that it agrees
    to use.


    For example, the request:


    ```

    GET /chat

    Host: javascript.info

    Upgrade: websocket

    Connection: Upgrade

    Origin: https://javascript.info

    Sec-WebSocket-Key: IV8io/9s+1FgZWcXP8Q=

    Sec-WebSocket-Version: 13

    Sec-WebSocket-Extensions: deflate-frame

    Sec-WebSocket-Protocol: soap, wamp

    ```


    Response:


    ```

    101 Switching Protocols

    Upgrade: websocket

    Connection: Upgrade

    Sec-WebSocket-Accept: hsB1uDTkk24szZEOTBU1ZAlC2g=

    Sec-WebSocket-Extensions: deflate-frame

    Sec-WebSocket-Protocol: soap

    ```'
