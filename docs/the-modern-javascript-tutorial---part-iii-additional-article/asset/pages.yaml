  md: 'That''s because by default a caret ^ only matches at the beginning of the text,
    and in the multiline mode – at the start of any line.


    > Please note:

    “Start of a line” formally means “immediately after a line break”: the test ^
    in multiline mode matches at all positions preceded by a newline character \n.

    And the text start.


    # Searching at line end $


    The dollar sign $ behaves similarly.


    The regular expression \d$ finds the last digit in every line


    ```

    let str = ''Winnie: 1

    Piglet: 2

    Eyore: 3`;


    alert(str.match(/\d$/gm)); // 1,2,3

    ```


    Without the flag m, the dollar $ would only match the end of the whole text, so
    only the very last digit would be found.


    > Please note:

    “End of a line” formally means “immediately before a line break”: the test $ in
    multiline mode matches at all positions succeeded by a newline character \n.

    And the text end.


    # Searching for \ln instead of ^ $


    To find a newline, we can use only anchors ^ and $, but also the newline character
    \n.


    What''s the difference? Let''s see an example.


    Here we search for \d\n instead of \d$:


    ```

    let str = ''Winnie: 1

    Piglet: 2

    Eyore: 3`;

    ```'
