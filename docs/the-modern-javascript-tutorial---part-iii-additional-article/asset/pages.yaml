  md: "```\n::slotted(div) p {\n  /* can't go inside light DOM */\n}\n```\n\nAlso,\
    \ ::slotted can only be used in CSS. We can't use it in querySelector.\n\n# CSS\
    \ hooks with custom properties\n\nHow do we style internal elements of a component\
    \ from the main document?\n\nSelectors like :host apply rules to <custom-dialog>\
    \ element or <user-card>, but how to style shadow DOM elements inside them?\n\n\
    There's no selector that can directly affect shadow DOM styles from the document.\
    \ But just as we expose methods to interact with our component, we can expose\
    \ CSS variables (custom CSS properties) to style it.\n\nCustom CSS properties\
    \ exist on all levels, both in light and shadow.\n\nFor example, in shadow DOM\
    \ we can use --user-card-field-color CSS variable to style fields, and the outer\
    \ document can set its value:\n\n```\n<style>\n  .field {\n    color: var(--user-card-field-color,\
    \ black);\n    /* if --user-card-field-color is not defined, use black color */\n\
    \  }\n<div class=\"field\">Name: <slot name=\"username\"></slot></div>\n<div class=\"\
    field\">Birthday: <slot name=\"birthday\"></slot></div>\n</style>\n```\n\nThen,\
    \ we can declare this property in the outer document for <user-card>:\n\n```\n\
    user-card {\n  --user-card-field-color: green;\n}\n```\n\nCustom CSS properties\
    \ pierce through shadow DOM, they are visible everywhere, so the inner .field\
    \ rule will make use of it.\n\nHere's the full example:"
