  md: "The :host selector allows to select the shadow host (the element containing\
    \ the shadow tree).\n\nFor instance, we're making <custom-dialog> element that\
    \ should be centered.\nFor that we need to style the <custom-dialog> element itself.\n\
    \nThat's exactly what :host does:\n\n```\n<template id=\"tmpl\">\n  <style>\n\
    \    /* the style will be applied from inside to the custom-dialog element */\n\
    \    :host {\n      position: fixed;\n      left: 50%;\n      top: 50%;\n    \
    \  transform: translate(-50%, -50%);\n      display: inline-block;\n      border:\
    \ 1px solid red;\n      padding: 10px;\n    }\n  </style>\n  <slot></slot>\n</template>\n\
    ```\n\n```\n<script>\ncustomElements.define('custom-dialog', class extends HTMLElement\
    \ {\n  connectedCallback() {\n    this.attachShadow({mode: 'open'}).append(tmpl.content.cloneNode(true));\n\
    \  }\n});\n</script>\n```\n\n```\n<custom-dialog>\nHello!\n</custom-dialog>\n\
    ```\n\n![](img/10702f89b72e44092576c4bcf72121f3_224_0.png)\n\n# Cascading\n\n\
    The shadow host (<custom-dialog> itself resides in the light DOM, so it's affected\
    \ by document CSS rules.\n\nIf there's a property styled both in :host locally,\
    \ and in the document, then the document style takes precedence."
