    ```\n<!-- form target -->\n<iframe name=\"iframe\"></iframe>\n\n<!-- a form could\
    \ be dynamically generated and submitted by JavaScript -->\n<form target=\"iframe\"\
    \ method=\"POST\" action=\"http://another.com/\">\n  ...\n</form>\n```\n\nSo,\
    \ it was possible to make a GET/POST request to another site, even without networking\
    \ methods, as forms can be forbidden to access the content of an <iframe> from\
    \ another site, it wasn't possible to read the response.\n\nTo be precise, there\
    \ were actually tricks for that, they required special scripts at both the iframe\
    \ and the page. So the communication with the iframe was technically possible.\
    \ Right now there's no point to go into details, let these dinosaurs rest in peace.\n\
    \n# Using scripts\n\nAnother trick was to use a script tag. A script could have\
    \ any src, with any domain, like <script src=\"http://another.com/...\"> It's\
    \ possible to execute a script from any website.\n\nIf a website, e.g. another.com\
    \ intended to expose data for this kind of access, then so-called “JSONP (JSON\
    \ with padding)” protocol was used.\n\nHere's how it worked\n\nLet's say, at our\
    \ site, need to get the data from http://another.com, as the weather:\n\n+   1.\
    \ In advance, we declare a global function to accept the data, e.g. gotweather.\n\
    \n```\n// 1. Declare the function to process the weather data\nfunction getWeather({temperature,\
    \ humidity}) {\n  alert(`temperature: ${temperature}, humidity: ${humidity}`);\n\
    }\n```\n\n+   2. Then we make a <script> tag with src=\"http://another.com/weather.json?callback=gotWeather\"\
    , using the name of our function as the callback URL-parameter."
