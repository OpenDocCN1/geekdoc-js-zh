    # Parse an expression


    A regex for a number is: -?\d+(\.\d+)? We created it in previous tasks.


    An operator is [-*/]. The hyphen goes first in the square brackets, because in
    the middle it would mean a character range, while we just want a character -.


    The slash / should be escaped inside a JavaScript regexp /\/, we''ll do that later.


    We need a number, an operator, and then another number. And optional spaces between
    them.


    The full regular expression: -?\d+(\.\d+)?\s*[-*/]*\s*-?\d+(\.\d+)?.


    It has 3 parts, with \s* between them:


    +   1. -?\d+(\.\d+)? – the first number,

    2. [-*/] – the operator,

    3. -?\d+(\.\d+)? – the second number.


    To make each part a separate element of the result array, let''s enclose them
    in parentheses: (-?\d+(\.\d+)?)\s*([-*/])\s*(-?\d+(\.\d+)?).


