- img_proc: true
  md: 'Please note that open call, contrary to its name, does not open the connection.
    It only configures the request, but the network activity only starts with the
    call of send.


    +   3. Send it out.


    ```

    xhr send([body])

    ```


    This method opens the connection and sends the request to the server. The optional
    body parameter contains the request body.


    Some request methods like GET do not have a body. Some of them like POST use body
    to send the data to the server. We''ll see examples of that later.


    +   4. Listen to xhr for response.


    These three events are the most widely used:


    +   * load - when the request is complete (even if HTTP status is 400 or 500),
    and the response is fully downloaded.


    +   * error - when the request couldn''t be made, e.g. network down or invalid
    URL.


    +   * progress - triggers periodically while the response is being downloaded,
    reports how much has been downloaded.


    ```

    xhr onload = function() {

    alert(`Loaded: ${xhr.status} ${xhr.response}`);

    };

    ```


    ```

    xhr onerror = function() { // only triggers the request couldn''t be made at all

    alert(`Network Error`);

    };

    ```


    ```

    xhr onprogress = function(event) { // triggers periodically

    // event.load - how many bytes downloaded

    // event.lengthComputable = true if the server sent Content-Length header

    // event.total - total number of bytes (if lengthComputable)

    alert(`Received ${event.loaded} of ${event.total}`);

    };

    ```


    Here''s a full example. The code below loads the URL at /article/xmlhttrequest/example/load
    from the server and prints the progress:'
