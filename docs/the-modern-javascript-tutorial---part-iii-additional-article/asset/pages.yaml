    # Sticky flag "y", searching at position


    The flag y allows to perform the search at the given position in the source string.

    To grasp the y flag, and see how great it is, let''s explore a practical use case.


    One of common tasks for regexps is "lexical analysis": we get a text, e.g. in
    a programming language, and analyze it for structural elements.


    For instance, HTML has tags and attributes, JavaScript code has functions, variables,
    and so on.


    Writing lexical analyzers is a special area, with its own tools and algorithms,
    we don''t go deep in there, but there''s a common task: read something at the
    given position.


    E.g. we have a code string varName = "value", and we need to read the variable
    name from, that starts at position 4.


    We''ll look for variable name using regexp /\w+. Actually, JavaScript variable
    need a bit more regexp for accurate matching, but here it doesn''t matter.


    A call to str.match(/w+/) will find only the first word in the line. Or all with
    the flag g. We need only one word at position 4.


    To search from the given position, we can use regexp.exec(str).

    If the regexp doesn''t flags g or y, this method looks for the first match in
    the string str.match(regexp). Such simple no-flags case doesn''t interest us.


    If there''s flag g. it performs the search in the string str, starting from position
    stored in regexp.lastIndex. And, if it finds a match, then sets regexp.lastIndex
    to the index immediately after the match.


    When a regexp is created, its lastIndex is 0.

    So, successive calls to regexp.exec(str) return matches one after another.'
