  md: 'When the first argument of `replace` is a string, it only replaces the first
    match.


    You can see in the example above: only the first "-" is replaced by ":". To find
    all hyphens, we need to use not the string "-", but a regexp /-/g with the obligatory
    g flag:


    ```

    // replace all dashes by a colon

    alert(''12-34-56''.replace(/-/g, ":")) // 12:34:56

    ```


    The second argument is a replacement string. We can use special character in it:
    | Symbols | Action in the replacement string |


    | Symbols | Action in the replacement string |

    |---|---|

    | $ | inserts the whole match |

    | $'' | inserts a part of the string before the match |

    | $'' | inserts a part of the string after the match |

    | $n | if n is a 1-2 digit number, inserts the contents of n-th capturing group,
    for details see Capturing groups |

    | $<name> | inserts the contents of the parentheses with the given name, for details
    Capturing groups |

    | $$ | inserts character $ |


    For instance:


    ```

    let str = "John Smith";

    // swap first and last name

    alert(str.replace(/(john)/i, ''$2, $1'')) // Smith, John

    ```


    For situations that require "smart" replacements, the second argument can be a
    function.


    It will be called for each match, and the returned value will be inserted as a
    replacement.


    The function is called with arguments `func(match, p1, p2, ..., pn, offset, input,
    groups):`


    +   1. match – the match,

    2. p1, p2, ... – contents of capturing groups (if there are any),

    3. offset – position of the match'
