    # httpOnly


    This option has nothing to do with JavaScript, but we have to mention it for completeness.


    The web-server uses `Set-Cookie` header to set a cookie. And it may set the `httpOnly`
    option.


    This option forbids any JavaScript access to the cookie. We can''t see cookie
