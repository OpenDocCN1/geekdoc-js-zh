    # Cross-window messaging


    The postMessage interface allows windows to talk to each other no matter which
    they are from.


    So, it''s a way around the "Same Origin" policy. It allows a window from johnsmith.com
    to talk to gmail.com and exchange information, but only if they both agree and
    corresponding JavaScript functions. That makes it safe for users.


    The interface has two parts.


    # postMessage


    The window wants to send a message calls [postMessage](https://example.com/postMessage)
    method of the receiving window. In other words, if we want to send the message
    to win, we should call win.postMessage(data, targetOrigin).


    Arguments:


    # data


    The data to send. Can be any object, the data is cloned using the "structured
    cloning algorithm". IE supports only strings, so we should JSON.stringify complex
    objects to support targetOrigin.


    # targetOrigin


    Specifies the origin for the target window, so that only a window from the given
    origin will get the message.


    The targetOrigin is a safety measure. Remember, if the target window comes from
    another origin, we can''t read its location in the sender window. So we can''t'
