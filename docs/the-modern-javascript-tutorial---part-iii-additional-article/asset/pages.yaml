    # samesite


    That''s another security attribute samesite. It''s designed to protect from so-called
    XSRF (cross-site request forgery) attacks.


    To understand how it works and when it''s useful, let''s take a look at XSRF attacks.


    # XSRF attack


    Imagine, you are logged into the site bank.com . That is: you have an authentication
    cookie from that. Your browser sends it to bank.com with every request, so that
    it recognizes and performs all sensitive financial operations.


    Now, while browsing the web in another window, you accidentally come to another
    site evil.com. That has JavaScript code that submits a form <form action="https://bank.com/pay">
    to bank.com with fields that initiate a transaction to the hacker''s account.


    The browser sends cookies every time you visit the site bank.com, even if the
    form was submitted from evil.com. So the bank recognizes you and actually performs
    the payment.


    | evil.com | bank.com |

    |--- |--- |

    | <form action="https://bank.com/pay">

    </form> | POST /pay cookie:user=John ngot the cookie? okay! |


    That''s called a "Cross-Site Request Forgery" (in short, XSRF) attack.


    Real banks are protected from it. All forms generated by bank.com have a special
    field, so called "XSRF protection token", that an evil page cannot generate or
    extract from a remote page (it can submit a form there, but it can''t get the
    data back). And the site bank.com checks for such token in every form it receives.'
