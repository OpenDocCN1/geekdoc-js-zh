- img_proc: true
  md: '```

    document.cookie = "user:John"; // update only cookie named ''user''

    alert(document.cookie); // show all cookies

    ```


    If you run it, then probably you''ll see multiple cookies. That''s because

    document.cookie= operation does not overwrite all cookies. It only sets the\mentioned
    cookie user.


    Technically, name and value can have any characters, to keep the valid formatting

    they should be escaped using a built-in encodeURIComponent function:


    ```

    // special characters (spaces), need encoding

    let name = "my name"

    let value = "John Smith"


    // encodes the cookie as my%20name=John%20Smith

    document.cookie = encodeURIComponent(name) + ''='' + encodeURIComponent(value);


    alert(document.cookie); // ... my%20name=John%20Smith

    ```


    # Limitations


    There are few limitations:


    +   - The name=value pair, after encodeURIComponent, should not exceed 4kb. We
    can''t store anything huge in a cookie.

    - The total number of cookies per domain is limited to around 20+, the exact limit
    depends on a browser.


    Cookies have several options, many of them are important and should be set.

    The options are listed after key=value, delimited by ;, like this:


    ```

    document.cookie = "user:John; path=/; expires=Tue, 19 Jan 2038 03:14:07 GMT";

    ```


    # path


    +   - path=/mypath


    The url path prefix, the cookie will be accessible for pages under that path.
    Must be absolute. By default, it''s the current path.


    If a cookie is set with path=/admin, it''s visible at pages /admin and /admin/something,
    but not at /home or /adminpage.'
