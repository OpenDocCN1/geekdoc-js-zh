    First, the call to `elem.attachShadow({mode: ...})` creates a shadow tree.


    There are two limitations:


    +   1. We can create only one shadow root per element.

    2. The `elem` must be a custom element, or one of: "article", "aside", "blockquote",
    "div", "footer", "h1...h6", "header", "main", "nav", "p", or "span". Other elements,
    like `<img>`, cannot host shadow tree.


    The `mode` option sets the encapsulation level. It must have any of the two values:


    +   - "open" – the shadow root is available as `elem.shadowRoot`.


    Any code is able to access the shadow tree of `elem`.


    +   - "closed" – `elem.shadowRoot` is always `null`.


    We can only access the shadow DOM by the reference returned by `attachShadow`
    (and probably inside a class). Browser-native shadow trees, such as `<input type="range">`,
    are closed. There''s no way to access them.


    The `shadow root` returned by `attachShadow`, is like an element: we can use `innerHTML`
    or DOM methods, such as `append`, to populate it.


    The element with a shadow root is called a "shadow tree host", and it is available
    as the shadow root `host` property:


    ```

    // assuming mode: "open", otherwise elem.shadowRoot is null

    alert elemShadowRoot host === elem; // true

    ```


    # Encapsulation


