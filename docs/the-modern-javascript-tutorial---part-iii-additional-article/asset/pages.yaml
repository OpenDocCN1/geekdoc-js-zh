  md: "```\ndb.deleteObjectStore('books')\n```\n\n# Transactions\n\nThe term \"transaction\"\
    \ is generic, used in many kinds of databases.\n\nA transaction is a group operations,\
    \ that should either all succeed or all fail.\n\nFor instance, when a person buys\
    \ something, we deneed:\n\n+   1. Subtract the money from their account.\n2. Add\
    \ the item to their inventory.\n\nIt would be pretty bad if we complete the 1st\
