  md: "Without options that is a simple GET request, downloading the contents of the\
    \ url.\n\nThe browser starts the request right away and returns a promise that\
    \ the calling code should use to get the result.\n\nGetting a response is usually\
    \ a two-stage process.\n\nFirst, the promise, returned by fetch, resolves with\
    \ an object of the built-in Response class as soon as the server responds with\
    \ headers.\n\nAt this stage we can check HTTP status, to see whether it is successful\
    \ or not, check headers, but don't have the body yet.\n\nThe promise rejects if\
    \ the fetch was unable to make HTTP-request, e.g. network problems, or there's\
    \ no such site. Abnormal HTTP-statuses, such as 404 or 500 do not cause an error.\n\
    \nWe can see HTTP-status in response properties:\n\n+   - status – HTTP status\
    \ code, e.g. 200.\n- ok – boolean, true if the HTTP status code is 200-299.\n\n\
    For example:\n\n```\nlet response = await fetch(url);\nif (response.ok) { // if\
