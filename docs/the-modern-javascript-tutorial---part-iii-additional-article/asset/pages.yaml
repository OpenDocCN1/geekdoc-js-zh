  md: '# Server should be ok with many pending connections


    The server architecture must be able to work with many pending connections.


    Certain server architectures run a process per connection. For many connections
    there will be as many processes, and each takes a lot of memory. Many connections
    just consume it.


    That''s often the case for backends written in PHP, Ruby languages, but technically
    isn''t a language, but rather implementation issue. Most modern language allow
    to implement a proper backend, but some of them make it easier than the other.


    Backends using Node.js usually don''t have such problems.


    # Demo: a chat


    Here''s demo chat, you can also download it and run locally (if you''re familiar
    with Node.js and can install modules):


    [https://plnkr.com/edit/pggiSWN8x4GuNwUryVj?p=preview](external)


    Browser code is in `browser.js`.


    # Area of usage


    Long polling works great in situations when messages are rare.


    If messages come often, then the chart of requesting-receiving messages, painted
    above, becomes saw-like.


    Every message is a separate request, supplied with headers, authentication overhead,
    and so on.


    So, in this case, another method is preferred, such as [Websocket](external) or
    [Server Sent Events](external).


    # WebSocket


    The WebSocket protocol, described in the specification [RFC 6455](external) provides
    a way to exchange data between browser and server via a persistent connection.
    The data can be passed in both directions as “packets”, without breaking the connection
    and additional HTTP-requests.


    WebSocket is especially great for services that require continuous data exchange,
    e.g. online games, real-time trading systems and so on.'
  merge: -1
