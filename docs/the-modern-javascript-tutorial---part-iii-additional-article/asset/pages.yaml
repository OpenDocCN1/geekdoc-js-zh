- img_proc: true
  md: "# event.elapsedTime\n\nThe time (in seconds) that the animation took, without\
    \ transition-delay.\n\n# Keyframes\n\nWe can join multiple animations together\
    \ using the @keyframes CSS rule.\n\nIt specifies the \"name\" of the animation\
    \ and rules: what, when and where to animate. Then using animation property we\
    \ attach the animation to the element and specify additional parameters for it.\n\
    \nHere's an example with explanations:\n\n```\n<div class=\"progress\"></div>\n\
    \n<style>\n@keyframes go-left-right { /* give it a name: \"go-left-right\" */\n\
    \  from { left: 0px; } /* animate from left: 0px */\n  to { left: calc(100% -\
    \ 50px); } /* animate to left: 100%-50px */\n}\n\n.progress {\n  animation: go-left-right\
    \ 3s infinite;\n  /* apply the animation \"go-left-right\" to the element\n  duration\
    \ 3 seconds\n  number of times: infinite\n  alternate direction every time\n}\n\
    \nposition: relative;\n  border: 2px solid green;\n  width: 50px;\n  height: 20px;\n\
    \  background: lime;\n}\n</style>\n```\n\nThere are many articles about @keyframes\
    \ and a detailed specification.\n\nProbably you won't need @keyframes often, unless\
    \ everything is in the constant move on your sites.\n\n# Summary"
