- img_proc: true
  md: "![](img/10702f89b72e44092576c4bcf72121f3_174_0.png)\n\nThe animation is initiated\
    \ by the function go that re-runs each time when the transition finishes and flips\
    \ the direction:\n\n```\nboat onclick = function() {\n//...\nlet times = 1;\n\n\
    function go() {\n  if (times % 2) {\n    // swim to the right\n    boat class.remove('back');\n\
    \    boat style marginLeft = 100 * times + 200 + 'px';\n  } else {\n    // swim\
    \ to the left\n    boat class.add('back');\n    boat style marginLeft = 100 *\
    \ times + 200 + 'px';\n  }\n}\n\ngo();\nboataddEventListener('transitionend',\
    \ function() {\ntimes++;\ngo();\n});\n```\n\nThe event object for transitionend\
    \ has few specific properties:\n\nevent.propertyName\nThe property that has finished\
    \ animating. Can be good if we animate multiple properties simultaneously."
