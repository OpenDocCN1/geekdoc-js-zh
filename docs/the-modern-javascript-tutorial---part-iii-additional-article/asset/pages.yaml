  md: "```\n.train {\n  left: 0;\n  transition: left 5s cubic-bezier(0, .5, .5, 1);\n\
    \  /* JavaScript sets left to 450px */\n}\n```\n\nThere are several built-in curves:\
    \ linear, ease, ease-in, ease-out and ease-in-out.\n\nThe linear curve is a shorthand\
    \ for cubic-bezier(0, 0, 1, 1) - a straight line, we saw it already.\n\nOther\
    \ names are shorthands for the following cubic-bezier:\n\n| ease | ease-in | ease-out\
    \ | ease-in-out |\n|---|---|---|--|\n| (0.25, 0.1, 0.25, 1.0) | (0.42, 0, 1.0,\
    \ 1.0) | (0, 0, 0.58, 1.0) | (0.42, 0, 0.58, 1.0) |\n\n![](img/10702f89b72e44092576c4bcf72121f3_170_0.png)\n\
    \n+   * - by default, if there's no timing function, ease is used.\n\nSo we could\
    \ use ease-out for our slowing down train:\n\n```\n.train {\n  left: 0;\n  transition:\
    \ left 5s ease-out;\n  /* transition: left 5s cubic-bezier(0, .5, .5, 1); */\n\
    }\n```\n\nBut it looks a bit differently.\n\n# A bezier curve can make the animation\
    \ \"jump out\" of its range.\n\nThe control points on the curve can have any y\
    \ coordinates: even negative or huge. Then the bezier curve would also jump very\
    \ low or high, making the animation go beyond its normal range."
