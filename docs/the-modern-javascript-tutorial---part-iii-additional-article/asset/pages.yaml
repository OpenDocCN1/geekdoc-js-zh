  md: "# Aborting request\n\nWe can terminate the request at any time. The call to\
    \ xhr.abort() does that:\n\n```\nxhr.abort(); // terminate the request\n```\n\n\
    That triggers abort event, and xhr.status becomes 0.\n\n# Synchronous requests\n\
    \nIf the open method the third parameter async is set to false, the request is\
    \ made synchronously.\n\nIn other words, JavaScript execution pauses at send()\
    \ and resumes when the response is received. Somewhat like alert or prompt commands.\n\
    \nHere's the rewritten example, the 3rd parameter of open is false:\n\n```\nlet\
    \ xhr = new XMLHttpRequest();\nxr.open('GET', '/article/xmlhttprequest/hello.txt',\
    \ false);\nntry {\n  xhr.send();\n  if (xhr.status != 200) {\n    alert(`Error\
    \ ${xhr.status}: ${xhr.responseText}`);\n  } else {\n    alert(xhr.response);\n\
    \  }\n} catch (err) { // instead of onerror\n  alert(\"Request failed\");\n}\n\
    ```\n\nIt might look good, but synchronous calls are used rarely, because they\
    \ block page JavaScript until the loading is complete. In some browsers it becomes\
    \ impossible to scroll. If a synchronous call takes too much time, the browser\
    \ may suggest to close the \"hanging\" webpage.\n\nMany advanced capabilities\
    \ of XMLHttpRequest, like requesting from another domain or setting a timeout,\
    \ are unavailable for synchronous requests. Also, you can see, no progress indication.\n\
    \nBecause of all that, synchronous requests are used very sparingly, almost never.\
    \ We won't talk about them any more."
