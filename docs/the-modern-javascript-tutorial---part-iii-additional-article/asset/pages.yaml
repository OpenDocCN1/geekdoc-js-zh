  md: "As we can see, the graph of the first half of the animation is the scaled down\
    \ ease, and the second half is scaled down easeout. As a result, the animation\
    \ starts and finishes with the same effect.\n\n# More interesting “draw”\n\nInstead\
    \ of moving the element we can do something else. All we need is to write the\
    \ write proper draw\n\nHere’s the animated “bouncing” text typing:\n\nhttps://plnk.co/edit/IX995Jbibid4R2Vwer9?p=preview\n\
    \n# Summary\n\nFor animations that CSS can't handle well, or those that need tight\
    \ control, JavaScript can help. JavaScript animations should be implemented via\
    \ requestAnimationFrame. That built-in method allows to setup a callback to run\
    \ when the browser is about to repaint. Usually that's very soon, but the exact\
    \ time depends on the browser.\n\nWhen a page is in the background, there are\
    \ no repeats at all, so the callback won't run; the animation will be suspended\
    \ and not consume resources. That's great.\n\nHere’s the helper animate function\
    \ to setup most animations:\n\n```\nfunction animate({timing, draw, duration})\
    \ {\n  let start = performance.now();\n\n  requestAnimationFrame(function(time)\
    \ {\n    // timeFraction goes from 0 to 1\n    let timeFraction = (time - start)\
    \ / duration;\n    if (timeFraction > 1) timeFraction = 1;\n\n    // calculate\
    \ the current animation state\n    let progress = timing(timeFraction);\n\n  \
    \  draw(progress); // draw it\n\n    if (timeFraction < 1) {\n      requestAnimationFrame(animate);\n\
    \    }\n  });\n}\n```\n\nOptions:"
