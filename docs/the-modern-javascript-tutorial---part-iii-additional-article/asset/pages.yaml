  md: "```\n<ul><slot name=\"item\"></slot></ul>\n</div>\n\n// shadowRoot can't have\
    \ event handlers, so using the first child\nthis.shadowRoot.firstChild.addEventListener('slotchange',\n\
    \  e => alert('slotchange: ' + e.target name)\n);\nn\nsetTimeout(() => {\n  menu\
    \ insertAdjacentHTML('beforeEnd', '<li slot=\"item\">Lollipop</li>');\n}, 1000);\n\
    \nsetTimeout(() => {\n  menu querySelector('[slot=\"title\"]').innerHTML = \"\
    New menu\";\n}, 2000);\n</script>\n```\n\nThe menu rendering updates each time\
    \ without our intervention.\n\nThere are two slotchange events here:\n\n+   1.\
    \ At initialization:\n\nslotchange: title triggers immediately, as the slot=\"\
    title\" from the light DOM gets into the corresponding slot.\n\n+   2. After 1\
    \ second:\n\nslotchange: item triggers, when a new <li slot=\"item\"> is added.\n\
    \nPlease note: there's no slotchange event after 2 seconds, when the content of\
    \ slot=\"title\" is modified. That's because there's no slot change. We modify\
    \ the content inside the slotted element, that's another thing.\n\nIf we'd like\
    \ to track internal modifications of DOM from JavaScript, that's also possible\
    \ using a more generic mechanism: MutationObserver.\n\n# Slot API\n\nFinally,\
    \ let's mention the slot-related JavaScript methods.\nAs we've seen before, JavaScript\
    \ looks at the \"real\" DOM, without flattening. But, if the shadow tree has {mode:\
    \ 'open'}, then we can figure out which elements assigned to a slot and, vice-versa,\
    \ the slot by the element inside it:\n\n+   node.assignedSlot – returns the <slot>\
    \ element that the node is assigned to."
