    \nOf course, we can add more functionality to it: events, methods and so on.\n\
    \n# Updating slots\n\nWhat if the outer code wants to add/remove menu items dynamically?\n\
    \nThe browser monitors slots and updates the rendering if slotted elements are\
    \ added/removed.\n\nAlso, as light DOM nodes are not copied, but just rendered\
    \ in slots, the changes inside them immediately become visible. So we do not have\
    \ to update anything to rendering. But if the component code wants to know about\
    \ slot changes, then slotchange event is available.\n\nFor example, here the menu\
    \ item is inserted dynamically after 1 second, and the title changes after 2 seconds:\n\
    \n```\n<custom-menu id=\"menu\">\n<span title=\"title\">Candy menu</span>\n</custom-menu>\n\
    \n<script>\ncustomElements.define('custom-menu', class extends HTMLElement {\n\
    \  connectedCallback() {\n    this.attachShadow({mode: 'open'});\n    this.shadowRoot.innerHTML\
    \ = `<div class=\"menu\">\n      <slot name=\"title\"></slot>\n```"
