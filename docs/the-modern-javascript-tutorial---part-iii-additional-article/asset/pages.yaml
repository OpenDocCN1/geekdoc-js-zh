    # “Non-simple” requests


    We can use any HTTP-method: not just GET/, PATCH, DELETE and others.


    Some ago no one could even imagine that a webpage could make such requests. There
    may still exist webservers that treat a non-standard method as a signal: "That''s
    not a browser". They can take it into account when checking access rights.


    So, to avoid misunderstandings, any “simple” request – that could be done in the
    old times, the browser does not make such requests right away. Before it sends
    a preliminary, so-called “preflight” request, asking for permission.


    A preflight request uses methods OPTIONS, no body and two headers:


    +   - Access-Control-Request-Method header has the method of the non-simple request.

    - Access-Control-Request-Headers header provides a comma-separated list of its
    non-simple HTTP-headers.'
