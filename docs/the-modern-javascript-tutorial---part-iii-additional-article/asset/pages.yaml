- img_proc: true
  md: "Write requests may fail.\n\nThat's to be expected, not only because of possible\
    \ errors at our side, but also for reasons not related to the transaction itself.\
    \ For instance, the storage quota may be exceeded. So we must be ready to handle\
    \ such case.\n\n# A failed request automatically aborts the transaction, canceling\
    \ all its changes.\n\nIn some situations, we may want to handle the failure (e.g.\
    \ try another request), without canceling existing changes, and continue the transaction.\
    \ The `request.onerror` handler is able to prevent the transaction abort by calling\
    \ `event.preventDefault()`.\n\nIn the example below a new book is added with the\
    \ same key (id) as the existing one. The `store.add` method generates a \"ConstraintError\"\
    \ in that case. We handle without canceling the transaction:\n\n```\nlet transaction\
    \ = db transaction(\"books\", \"readwrite\");\n\nlet book = { id: 'js', price:\
    \ 10 };\n\nlet request = transaction objectStore(\"books\").add(book);\n\nrequest.onerror\
    \ = function() {\n  // ConstraintError occurs when an object with the same id\
    \ already exists\n  if (request.name == \"ConstraintError\") {\n    console.log(\"\
    Book with such id already exists\"); // handle the error\n    event.preventDefault();\
    \ // don't abort the transaction\n    // use another key for the book?\n  } else\
    \ {\n    // unexpected error, can't handle it\n    // the transaction will abort\n\
    \  }\n};\n\ntransaction.onabort = function() {\n  console.log(\"Error\", transaction.error);\n\
    };\n```\n\n# Event delegation\n\nDo we need onerror/onsuccess for every request?\
    \ Not every time. We can use event delegation instead.\n\nIndexedDB events bubble:\
    \ `request` -> `transaction` -> `database`.\n\nAll events are DOM events, with\
    \ capturing and bubbling, but usually only bubbling is used. We can catch.\n\n\
    So we can catch errors using `db.onerror` handler, for reporting or other purposes:"
  merge: -1
  pgno: 146
- img_proc: true
  md: "```\ndb.onerror = function(event) {\n  let request = event.target; // the request\
    \ that caused the error\n\nconsole.log(\"Error\", request.error);\n};\n```\n\n\
    ... But if an error is fully handled? We don't want to report it in that case.\n\
    \nWe can stop the bubbling and handle it db.onerror by using nevent.stopPropagation()\
    \ in request.onerror.\n\n```\nrequest.onerror = function(event) {\nif (event.name\
    \ == \"ConstraintError\") {\n  console.log(\"Book with such id already exists\"\
    ); // handle the error\n  event.preventDefault(); // don't abort the transaction\n\
    \  event.stopPropagation(); // don't bubble up, \"chew\" it\n} else {\n  // nothing\n\
    \  // transaction will be aborted\n  // we can take care of error in transaction.onabort\n\
    };\n```\n\n# Searching by keys\n\nThere are two main types of search in an object\
    \ store:\n\n+   1. By a key or a key range. That is: book.id in our \"books\"\
    \ storage.\n2. By another object field, e.g. book.price.\n\nFirst let's deal with\
    \ the keys and key ranges (1).\nMethods that allow searching either exact keys\
    \ or so-called \"range queries\" – IDBKeyRange – objects that specify a \"key\
    \ range\".\nRanges are created using following calls:\n\n+   * IDBKeyRange.lowerBound(lower,\
    \ [open]) means: >lower (or >=lower if open is true)\n* IDBKeyRange.upperBound(upper,\
    \ [open]) means: <upper (or <=upper if open is true)\n* IDBKeyRange.bound(lower,\
    \ upper, [lowerOpen], [upperOpen]) means: between lower and upper, with optional\
    \ equality if the corresponding open is true."
