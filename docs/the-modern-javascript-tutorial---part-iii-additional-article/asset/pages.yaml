  md: 'TypedArray has regular Array methods, with notable exceptions.


    We can iterate, map, slice, find, reduce etc.


    There are few things we can''t do:


    +   - No splice – we cannot "delete" a value, because typed arrays are views on
    a buffer, and these are fixed, contiguous areas of memory. All we can do is to
    assign a zero.


    +   - No concat method.


    There are two additional methods:


    +   - arr.set(fromArr, [offset]) copies all elements from fromArr to the arr,
    starting at position offset (0 by default).


    +   - arr.subarray([begin, end]) creates a new view of the same type from begin
    to end (exclusive). That''s similar to slice method(that''s supported), but doesn''t
    copy anything – just creates a new view, to operate on piece of data.


    These methods allow us to copy typed arrays, mix them, create new arrays from
    existing ones, and so on.


    # DataView


    DataView is a special super-flexible ("untyped") view over ArrayBuffer. It allows
    to access the data on any offset in any format.


    +   - For typed arrays, the constructor dictates what the format is. The whole
    array is supposed to be uniform. The i-th number is arr[i].


    +   - With DataView we access the data with methods like .getUint8(i) or .getUint16(i).
    We choose the format at method call time instead of construction time.


    The syntax:


    ```

    new DataView(buffer, [byteOffset], [byteLength])

    ```


    +   - buffer – the underlying ArrayBuffer. Unlike typed arrays, DataView doesn''t
    create a buffer on its own. We need to have it.


    +   - byteOffset – the starting byte position of the view (by default 0).


    +   - byteLength – the byte length of the view (by default till the end of buffer).


    For instance, we extract numbers in different formats from the same buffer:'
