  md: "Most browsers show the example above as required.\n\nRules for omitted settings:\n\
    \n+   - If there is no 3rd argument in the `open` call, or if it is empty, then\
    \ the default window parameters are used.\n\n+   - If there is a string of params,\
    \ some `yes/no` features are omitted, then the omitted features assumed to have\
    \ `no` value. So if you specify params, make sure you explicitly set all features\
    \ to yes.\n\n+   - If there is no `left/top` in params, then the browser tries\
    \ to open a new window near the last opened window.\n\n+   - If there is no `width/height`,\
    \ then the new window will be the same size as the last opened.\n\n# Opening popup\
    \ from window\n\nThe `open` call returns a reference to the new window. It can\
    \ be used to manipulate it's properties, change location and even more.\n\nIn\
    \ this example, we generate popup content from JavaScript:\n\n```\nlet newWin\
    \ = window.open(\"about:blank\", \"hello\", \"width=200,height=200\");\n\nnewWin.document.write('Hello,\
    \ world!');\n```\n\nAnd here we modify the contents after loading:\n\n```\nlet\
    \ newWindow = open('/', 'example', 'width=300,height=300');\nnewWindow.focus();\n\
    \nalert(newWindow.location.href); // (possibly) about:blank, loading hasn't started\
    \ yet\n\nnewWindow.onload = function() {\n  let html = `<div style=\"font-size:30px\"\
    >Welcome!</div>`;\n  newWindow.document.insertAdjacentHTML('afterbegin', html);\n\
    };\n```\n\nPlease note: immediately after `window.open`, the new window isn't\
    \ loaded yet. That's demonstrated by `alert` in line (*). So we wait for `onload`\
    \ to modify it. We could also use `DOMContentLoaded` handler for `newWin.document`."
