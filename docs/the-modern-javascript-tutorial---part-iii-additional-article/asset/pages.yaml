  md: 'The caret ^ and dollar $ characters have special meaning in a regex. They are
    called "anchors".


    The caret ^ matches the beginning of the text, and the dollar $ – at the end.


    For instance, let''s test if the text starts with Mary:


    ```

    let str1 = "Mary had a little lamb"

    alert(/\Mary./test(str1)); // true

    ```


    The pattern Mary means: "string start and then Mary".


    Similar to this, we can test if the string ends using snow$:


    ```

    let str1 = "it was fleece as white as snow"

    alert(//snow$/test(str1)); // true

    ```


    In these particular cases we could use methods startWith/endWith instead. Regular
    expressions should be used for more complex tests.


    # Testing for a full match


    Both anchors ^$... are often used to test whether or not a string fully matches
    the pattern. For instance, to check if the user input is in the right format.


    Let''s check whether a string or not is in 12:34 format. That is: two digits,
    a colon, and then two digits.


    In regular expressions that \d\d:\d\d:


    ```

    let goodInput = "12:34"

    let badInput = "12:345"


    let regex = /^\d\d:\d\d$/nalert(regex.test(goodInput)); // true

    alert(regex.test(badInput)); // false

    ```


    Here for the mark \d\d:\d\d must start exactly after the beginning of the text
    ^, and the end $ must immediately follow.


    The whole string must be exactly in this format. If there''s any deviation or
    an extra character, the result is false.


    Anchors behave differently if flag m is present. We''ll see that in the next article.'
