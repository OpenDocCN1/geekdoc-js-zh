  md: '# HTTP-headers


    XMLHttpRequest allows both to send custom headers and read headers from the response.


    There are 3 methods for HTTP-headers:


    ```

    setRequestHeader(name, value)

    ```


    Sets the request header with the given name and value.


    For instance:


    ```

    xhr.setRequestHeader(''Content-Type'', ''application/json'');

    ```


    > Headers limitations

    Several headers are managed exclusively by the browser, e.g. Referer Host. The
    full list is in the specification.

    XMLHttpRequest is not allowed to change them, for the sake of user safety and
    correctness of the request.


    > Can''t remove a header

    Another peculiarity of XMLHttpRequest is that one can''t undo setRequestHeader.\
    Once the header is set, it''s set. Additional calls add information to the header,
    don''t overwrite it.


    For instance:


    ```

    xhr.setRequestHeader(''X-Auth'', ''123'');

    xhr.setRequestHeader(''X-Auth'', ''456'');


    // the header will be:

    // X-Auth: 123, 456

    ```


    # getResponseHeader(name)


    Gets the response header with the given name (except Set-Cookie and Set-Cookie2).


    For instance:'
