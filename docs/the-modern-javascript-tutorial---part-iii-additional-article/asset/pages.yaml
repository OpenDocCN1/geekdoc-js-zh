    \ != window) {\n  top.location = window.location;\n}\n```\n\nThat is: if the window\
    \ finds out that it's not on top, then it automatically makes itself the top.\n\
    \nThis not a reliable defence, because there are many ways to hack around it.\
    \ Let's cover a few.\n\n# Blocking top-navigation\n\nWe can block the transition\
    \ by changing top.location in beforeunload event handler.\n\nThe top page (enclosing\
    \ one, belonging to the hacker) sets a preventing handler for it, like this:\n\
    \n```\nwindow.onbeforeunload = function() {\n  return false;\n};\n```"
