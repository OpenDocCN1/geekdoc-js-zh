  md: '# Methods of RegExp and String


    In this article we''ll cover various methods that work with regexps in-depth.


    # str.match(regexp)


    The method str.match(regexp) finds for regexp in the string str.


    It has 3 modes:


    +   1. If the regexp doesn''t have flag g, then it returns the first match as
    an array with capturing groups and properties index (position of the match), input
    (input string, equals str):


    ```

    let str = "I love JavaScript";

    let result = str.match(/JavaScript/);


    alert(result[0]); // JavaScript (full match)

    alert(result[1]); // Script (first capturing group)

    alert(result.length); // 2


    // Additional information:

    alert(result.index); // 0 (match position)

    alert(result.input); // I love JavaScript (source string)

    ```


    +   2. If the regexp has flag g, then it returns an array of all matches as strings,
    without capturing groups and other details.


    ```

    let str = "I love JavaScript";

    let result = str.match(/JavaScript/g);

    alert(result[0]); // JavaScript

    alert(result.length); // 1

    ```


    3. If there are no matches, no matter if there''s flag g or not, null is returned.


    That''s an important nuance. If there are no matches, we don''t get an empty array,
    but null. It''s easy to make a mistake forgetting about it, e.g:


    ```

    let str = "I love JavaScript";

    let result = str.match(/HTML/);

    ```'
