  md: '# Catastrophic backtracking


    Some regular expressions are looking simple, but can execute veeeeery long time,
    and even "hang" the JavaScript engine.


    Sooner or later developers occasionally face such behavior, because it''s quite
    easy to create such a regex.


    The typical symptom – a regular expression works fine sometimes, but for certain
    strings it “hangs", consuming 100% of CPU.


    In such case we-browser suggests to kill the script and reload the page. Not a
    good thing for sure.


    For server-side JavaScript it may become a vulnerability if regular expressions
    process user data.


    # Example


    Let''s say we have a string, and we''d like to check if it consists of words \w+
    with an optional space \s? after each.


    We''ll use a regexp ^(\w+\s?)*$, it identifies 0 or more such words.


    In action:


    ```

    let regexp = /^(\w\s?)*$/;

    alert(regexp.test("A good string")); // true

    alert(regexp.test("Bad characters: @@#")); // false

    ```


    It seems to work. The result is correct. Although, on certain strings it takes
    a lot of time. So long that JavaScript engine "hangs" with 100% CPU consumption.


    If you run the example below, you probably won''t see anything, as JavaScript
    just "hang". A web browser will stop reacting on events, the UI will stop working.
    After some time it will suggest reloaad the page. So be careful with this:


    ```

    let regexp = /^(\w\s?)*$/;

    let str = "An input string that takes a long time or even makes this regexp to
    hang"


    // will take a very long time

    alert(regexp.test(str));

    ```


    Some regular expression engines can handle such search, but most of them can''t.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Simplified example


    What''s the matter? Why the regular expression “hangs?


    To understand that, let''s simplify the example: remove spaces `\s?`. Then it
    becomes `^(\w+)*$`.


    And, to make things more obvious, let''s replace `\w` with `\d`. The resulting
    regular expression still hangs,


    ```

    let regexp = /^\(\d+)*$/;

    let str = "012345678901234567890123456789";

    // will take a very long time

    alert(regexp test(str));

    ```


    So what''s wrong with the regexp?


    First, one may notice that the regexp `\(\d+)*` is a little strange. The quantifier
    * looks extraneous. If we want a match, we can use `\d+`.


    Indeed, the regexp is artificial. But the reason why it is slow is the same as
    those we saw above. So let''s understand it, and then the previous example will
    become obvious.


    What happens during the search of `^(\d+)*$` in the line `1234567889!` (shortened
    a bit for clarity), why does it take so long?


    +   1. First, the regexp engine tries to find a number `\d+`. The plus + is greedy
    by default, it consumes all digits:


    ```

    \d+......

    (123456789)z

    ```


    It then tries to apply the star quantifier, but there are no more digits, so it
    doesn''t give anything.


    The next in the pattern is the string end $, but in the text we have !, so there''s
    no match:


    ```

    x

    \d+......$

    (123456789)!

    ```'
  merge: -1
  pgno: 298
- img_proc: true
  md: '2. As there''s no match, the greedy quantifier + decreases the count of repetitions,
    backtracks one character back.


    Now \d+ takes all digits except the last one:


    ```

    \d+......

    (12345678)9!

    ```


    3. Then the engine tries to continue the search from the new position (9).


    The star (\d+) can be applied – it gives the number 9 :


    ```

    \d+......\d+

    (12345678)(9)!

    ```


    The engine tries to match $ again, but fails, because meets ! :


    ```

    x

    \d+......\d+

    (12345678)(9)z

    ```


    4. There''s no match, so the engine will continue backtracking, decreasing the
    number of repetitions. Backtracking generally works like this: the last greedy
    quantifier decreases the number of repetitions until it can. The previous greedy
    quantifier decreases, and so on.


    All possible combinations are attempted. Here are their examples.


    The first number \d+ has 7 digits, and then a number of 2 digits:


    ```

    x

    \d+......\d+

    (1234567)(89)!

    ```


    The first number has 7 digits, and then two numbers of 1 digit each:


    ```

    x

    \d+......\d+\d+

    (1234567)(8)(9)!

    ```


    The first number has 6 digits, and then a number of 3 digits:'
