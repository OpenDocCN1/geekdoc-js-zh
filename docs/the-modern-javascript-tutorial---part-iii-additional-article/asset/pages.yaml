  md: "Here the server responds that it supports the extension \"deflate-frame\",\
    \ and only\nSOAP of the requested protocols.\n\n# Data transfer\n\nWebSocket communication\
    \ consists of \"frames\" – data fragments, that can be sent\nfrom either side,\
    \ and can be of several kinds:\n\n+   - \"text frames\" – contain text data that\
    \ parties send to each other.\n- \"binary data frames\" – contain binary data\
    \ that parties send to each other.\n- \"ping/pong frames\" are used to check the\
    \ connection, sent from the server, the\nbrowser responds to these automatically.\n\
    - there's also \"connection close\" and a few other services.\n\nIn the browser,\
    \ we directly work only with text or binary frames.\n\n# WebSocket.send(method)\
    \ method can send either text or binary data.\n\nA call socket.send(body) allows\
    \ body in string or binary format, including\nBlob, ArrayBuffer, etc. No settings\
    \ required: just send it out in any format.\n\nWhen we receive the data, text\
    \ always comes as string. And for binary data, we\ncan choose between Blob and\
    \ ArrayBuffer formats.\n\nThat's set by socket.locatorType property, it's \"blob\"\
    \ by default, so binary\ndata comes as Blob objects.\n\nBlob is a high-level binary\
    \ object, it directly integrates with <a>, <img> and other\ntags, so that's a\
    \ default. For binary processing, to access individual data\nbytes, we can change\
    \ it to \"arraybuffer\":\n\n```\nsocket bufferType = \"arraybuffer\";nsocket.onmessage\
    \ = (event) => {\n  // event.data is a string (if text) or arraybuffer (if binary)\n\
    };\n```\n\n# Rate limiting\n\nImagine, our app is generating a lot of data to\
    \ send. But the user has a slow network\nconnection, maybe on a mobile internet,\
    \ outside of a city.\n\nWe can call socket.send(data) again and again. But the\
    \ data will be buffered\n(stored in memory) and sent out as fast as network speed.\n\
    \nThe socket.bufferedAmount property stores how many bytes are buffered at\nthis\
    \ moment, waiting to be sent over the network."
