  md: '# Regular Polling


    The simplest way to get new information from the server is periodic polling. That
    is, regular requests to the server: “Hello, I''m here, do you have any information
    for me”?. For example, once in 10 seconds.


    In response, the server first takes a notice to itself that the client is online,
    and second – sends a packet of messages it got that moment.


    That works, but there are downsides:


    +   1. Messages are passed with a delay up to 10 seconds (between requests).

    2. Even if there are no messages, the server is bombed with requests every 10
    seconds, even if the user switched somewhere else or is asleep. That''s quite
    a load to handle, speaking performance-wise.


    So, if we''re talking about a very small service, the approach may be viable,
    but generally, it needs an improvement.


    # Long polling


    So-called “long polling” is a much better way to poll the server.


    It''s also very easy to implement, and delivers messages without delays.


    The flow:


    +   1. A request is sent to the server.

    2. The server doesn''t close the connection until it has a message to send.

    3. When a message appears – the server responds to the request with it.

    4. The browser makes a new request immediately.


    The situation when the browser sent a request and has a pending connection with
    the server, is standard for this method. Only when a message is delivered, the
    connection is reestablished.'
  merge: -1
  pgno: 99
- img_proc: true
  md: "![](img/10702f89b72e44092576c4bcf72121f3_100_0.png)\n\nIf the connection is\
    \ lost, of say, a a network error, the browser immediately sends a new request.\n\
    \nA sketch of client-side `subscribe` function that makes long requests:\n\n```\n\
    ```javascript\nasync function subscribe() {\n  let response = await fetch(\"/subscribe\"\
    );\n  if (response.status == 502) {\n    // Status 502 is a connection timeout\
    \ error,\n    // may happen when the connection was pending for too long,\n  \
    \  // and the remote server or a proxy closed it\n    // let's reconnect\n   \
    \ await subscribe();\n  } else if (response status != 200) {\n    // An error\
    \ - let's show it\n    showMessage(response statusText);\n    // Reconnect in\
    \ one second\n    await new Promise((resolve) => setTimeout(resolve, 1000));\n\
    \    await subscribe();\n  } else {\n    // Get and show the message\n    let\
    \ message = await response.text();\n    showMessage(message);\n    // Call subscribe()\
    \ again to get the next message\n    await subscribe();\n  }\n}\n\nsubscribe();\n\
    ```\n```\n\nAs you can see, `subscribe` function makes a fetch, then waits for\
    \ the response, handles it and calls itself again."
