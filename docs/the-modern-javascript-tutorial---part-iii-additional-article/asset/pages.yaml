- img_proc: true
  md: 'IDBKeyRange.only(key) – a range that consists of only one key, rarely used.


    All searching methods accept a query argument that can be either an exact key
    or a key range:


    +   - store.get(query) – search for the first value by a key or a range.

    - store.getAll([query], [count]) – search for all values, limit by count if given.

    - store.getKey(query) – search for the first key that satisfies the query, usually
    a range.

    - store.getAllKeys([query], [count]) – search for all keys that satisfy the query,
    usually a range, up to count if given.

    - store.count([query]) – get the total count of keys that satisfy the query, usually
    a range.


    For instance, we have a lot of books in our store. Remember, the id field is the
    key, so all these methods can search by id.


    Request examples:


    ```

    // get one book

    books.get(''js'')


    // get books with ''css'' < id < ''html''

    books.getAll(IDBKeyRange.bound(''css'', ''html''))


    // get books with ''html'' <= id

    books.getAll(IDBKeyRange.lowerBound(''html'', true))


    // get all books

    books.getAll()


    // get all keys: id >= ''js''

    books.getAllKeys(IDBKeyRange.lowerBound(''js'', true))

    ```


    > Object store is always sorted

    Object store sorts values by key internally.

    So requests that return many values always return them in sorted by key order.


    # Searching by any field with an index'
