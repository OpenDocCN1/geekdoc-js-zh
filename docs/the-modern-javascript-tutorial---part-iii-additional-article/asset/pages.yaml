    # Web components


    Web components is a set of standards to make self-contained components: custom
    HTML-elements with their own properties and methods, encapsulated DOM and styles.


    # From the orbital height


    This section describes a set of modern standards for “web components”.


    As of now, these standards are under development. Some features are well-supported
    and integrated into the modern HTML/DOM standard, while others are yet in draft
    stage. You can try examples in any browser, Google Chrome is probably the most
    up to date with these features. Guess, that''s because Google fellows are behind
    many of the related specifications.


    # What’s common between...


