  md: 'Now the browser can see that PATCH is in Access-Control-Allow-Methods and Content-Type,API-Key
    are in the list Access-Control-Allow-Headers, so it sends out the main request.


    Besides, the preflight response is cached for time, specified by Access-Control-Max-Age
    header (86400 seconds, one day), so subsequent requests will not cause a preflight.
    Assuming they fit the cached allowances, they will be sent directly.


    # Step 3 (actual request)


    When the preflight is successful, the browser now makes the main request. The
    algorithm here is the same as for simple requests.


    The main request has Origin header (because it''s cross-origin):


    ```

    PATCH /service.json

    Host: site.com

    Content-Type: application/json

    API-Key: secret

    Origin: https://javascript.info

    ```


    # Step 4 (actual response)


    The server should not forget to add Access-Control-Allow-Origin to the main response.
    A successful preflight does relieve from that:


    > Access-Control-Allow-Origin: https://javascript.info


    Then JavaScript is able to read the main server response.


    > Please note:

    Preflight request occurs "behind the scenes", it''s invisible to JavaScript.

    JavaScript only gets the response to the main request or an error if there''s
    no server permission.


    # Credentials


    A cross-origin request by default does not bring any credentials (cookies or HTTP
    authentication).


    That''s uncommon for HTTP-requests, a request to http://site.com is accompanied
    by all cookies from that domain. But cross-origin requests made by JavaScript
    methods are an exception.'
