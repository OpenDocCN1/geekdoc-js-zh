  md: 'Here''s an example of browser headers for request made by WebSocket("wss://javascript.info/chat")


    ```

    GET /chat

    Host: javascript.info

    Origin: https://javascript.info

    Connection: Upgrade

    Upgrade: websocket

    Sec-WebSocket-Key: IV8/9s+1YFGzWcXz2P8Q=

    Sec-WebSocket-Version: 13

    ```


    +   - Origin – the origin of the client page, e.g. https://javascript.info. WebSocket
    objects are cross-origin by nature. There are no special headers or other limitations.
    Old servers are unable to handle WebSocket anyway, so there are no compatibility
    issues. Origin header is important, as it allows the server to decide whether
    or not to talk WebSocket with this website.

    - Connection: Upgrade – signals that the client would like to change the protocol.

    - Upgrade: websocket – the requested protocol is "websocket".

    - Sec-WebSocket-Key – a random browser-generated key for security.

    - Sec-WebSocket-Version – WebSocket protocol version, 13 is the current one.


    > WebSocket handshake can be emulated


    We can''t use XMLHttpRequest or fetch to make this kind of HTTP-request, because
    JavaScript is not allowed to set these headers.


    If the server agrees to switch to WebSocket, it should send code 101 response:


    ```

    101 Switching Protocols

    Upgrade: websocket

    Connection: Upgrade

    Sec-WebSocket-Accept: hB1budTTkk24srzeE0TBU1A1c2=

    ```


    Here Sec-WebSocket-Accept is Sec-WebSocket-Key, recoded using a special algorithm.
    The browser uses it to make sure that the response corresponds to the request.


    Afterwards, the data is transfered using WebSocket protocol, we''ll see its structure
    (“frames”) once. That''s not HTTP at all.


    # Extensions and subprotocols'
