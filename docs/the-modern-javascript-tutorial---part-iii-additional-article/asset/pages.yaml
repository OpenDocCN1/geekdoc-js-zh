    > ⚠️ Same global regexp tested repeatedly on different sources may fail


    If we apply the same global regexp to different inputs, it may lead to wrong result,
    because regexp.test advances regexp.lastIndex property, so the search in another
    string may start from non-zero position.


    For instance, here we call regexp twice on the same text, and the second time
    fails:


    ```

    let regexp = /javascript/g; // (regexp just created: regexp.lastIndex=0)

    alert(regexp.test("javascript\)); // true (regexp.lastIndex=10 now)

    alert(regexp.test("javascript\)); // false

    ```


    That''s exactly because regexp.lastIndex is non-zero in the second test.

    To work around that, we can set regexp.lastIndex = 0 before each search. or instead
    of calling methods on regexp, use string methods str.match(search/..), they don''t
    use lastIndex.'
