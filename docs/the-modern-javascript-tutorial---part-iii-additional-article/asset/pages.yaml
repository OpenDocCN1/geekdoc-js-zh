- img_proc: true
  md: "To search by other object fields, we need to create an additional data structure\
    \ named \"index\".\n\nAn index is \"add-on\" to the store that tracks a given\
    \ object field. For each value of field, it stores a list of keys for objects\
    \ that have that value. There will be a more detailed picture below.\n\nThe syntax:\n\
    \n```\nobjectStore.createIndex(name, keyPath, [options]);\n```\n\n+   * name –\
    \ index name,\n* keyPath – path to the object field that the index should track\
    \ (we’re going to search by that field),\n* option – an optional object with properties:\n\
    \  * unique – if true, then there may be only one object in the store with the\
    \ value at the keyPath. The index will enforce by generating an error if you try\
    \ to add a duplicate.\n  * multiEntry – only used if the value on keyPath is an\
    \ array. In that case, by default, the index will treat the whole array as a key.\
    \ But if multiEntry is true, the index will keep a list of store objects for each\
    \ value in that array. Array members become index keys.\n\nIn our example, we\
    \ store books keyed by id.\n\nLet’s say we want to search by price.\n\nFirst,\
    \ we need to create an index. It must be done in upgradeded, just like object\
    \ store:\n\n```\nopenRequest.onupgradeded = function() {\n  // we create the index,\
    \ in versionchange transaction\n  let books = db.createObjectStore('books', {keyPath:\
    \ 'id'});\n  let index = inventory createIndex('price_idx', 'price');\n};\n```\n\
    \n+   * The index will track price field.\n* The price is not unique, there may\
    \ be multiple books with the same price, so we don’t set unique option.\n* The\
    \ price is not an array, multiEntry flag is not applicable.\n\nImagine that our\
    \ inventory has 4 books. Here’s the picture that shows exactly what the index\
    \ is:"
  merge: -1
  pgno: 149
- img_proc: true
  md: "# books index\n\n| id: 'html' | price: 3 |\n| id: 'css' | price: 5 |\n| id:\
    \ 'js' | price: 10 |\n| id: 'nodejs' | price: 10 |\n\nAs said, the index for each\
    \ value of price (second argument) keeps the list of keys that have that price.\n\
    \nThe index keeps itself up to date automatically, we don't have to care about\
    \ it.\n\nNow, when we want to search for a given price, we simply apply the same\
    \ search methods to the index:\n\n```\nlet transaction = db.transaction(\"books\"\
    ); // readonly\nlet books = transaction objectStore(\"books\");\nlet priceIndex\
    \ = books.index(\"price_idx\");\n\nlet request = priceIndex.getAll(10);\n\nrequest.onsuccess\
    \ = function() {\n  if (request.result !== undefined) {\n    console.log(\"Books\"\
    , request.result); // array of books with price=10\n  } else {\n    console.log(\"\
    No such books\");\n  }\n};\n```\n\nWe can also use IDBKeyRange to create ranges\
    \ and looks for cheap/expensive books:\n\n```\n// find books where price < 5\n\
    let request = priceIndex.getAll(IDBKeyRange.upperBound(5));\n```\n\nIndexes are\
    \ internally sorted by the tracked object field, price in our case. So when we\
    \ do the search, the results are also sorted by price.\n\n# Deleting from store"
