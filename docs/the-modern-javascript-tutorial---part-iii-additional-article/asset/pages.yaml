- img_proc: true
  md: 'The alternative approach is to forbid backtracking for the quantifier.


    The regular expressions engine tries many combinations that are obviously wrong
    for a human.


    E.g. in the regexp `\d+*$` it''s obvious for a human, that + shouldn''t backtrack.
    We replace one `\d+` with two separate `\d+\d+`, nothing changes:


    ```

    \d+....

    (123456789)!

    \d+...\d+...

    (1234) (56789)!

    ```


    And in the original example `^(\w+\s?)*$` we may want to forbid backtracking in
    `\w+`. That is: `\w+` should match a whole word, with the maximal possible length.
    There''s no need to lower the repetitions count in `\w+`, try to split it into
    two words `\w+\w+` and so on.


    Modern regular expression engines support possessive quantifiers for that. Like
    greedy ones, but don''t backtrack (so they are actually similar to regular quantifiers).


    There are also so-called "atomic capturing groups" – a way to disable backtracking
    inside parentheses.


    Unfortunately, in JavaScript they are not supported. But there''s another way.


    # Lookahead to the rescue!


    We can prevent backtracking using lookahead.


    The pattern to take as many repetitions of `\w` as possible without backtracking
    is: `(?=(\w+))\1`.


    Let''s decipher it:


    +   - Lookahead `?=` looks forward for the longest word `\w+` starting at the
    current position.

    - The contents of parentheses with `?...` isn''t memorized by the engine, so wrap
    `\w+` into parentheses. Then the engine will memorize its contents

    - ...And allow to reference it in the pattern as `\1`


    That is: we look ahead – and if there''s a word `\w+`, then match it as `\1`.


    Why? That''s because the lookahead finds a word `\w` as as and we capture it into
    the pattern with `\1`. So we essentially implemented a possessive plus `+` quantifier.
    It captures only the whole word `\w+`, not a part of it.'
