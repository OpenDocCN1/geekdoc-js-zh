    Flag makes regexp.exec to look exactly at position lastIndex, not before, after
    it.

    Here''s the same search with flag y:


    ```

    let str = ''varName'' = "value"

    let regexp = /w+/y;

    regexp lastIndex = 3;

    alert(regexp.exec(str)); // null (there''s a space at position 3, not a word)

