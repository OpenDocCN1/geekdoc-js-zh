  md: 'To solution


    # Escaping, special characters


    As we''ve seen, a backslash \ is used to denote character classes, e.g. \d. So
    it''s a special character in regexps (just in regular strings).


    There are other special characters as well, that have special meaning in a regexp.
    They are used to do more powerful searches. Here''s a list of them: [ \ ^ $ |
    ? * + ( ) ].


    Don''t try to remember the list – soon we''ll deal with each of them separately
    and you''ll know them by heart automatically.


    # Escaping


    Let''s say we want to find literally a dot. Not "any character", but just a dot.


    To use a special character as a regular, prepend it with a backslash: \. That''s
    also called "escaping a character".


    For example:


    ```

    alert("Chapter 5.1".match(/\d\\.\d/)); // 5.1 (match!)

    alert("Chapter 511".match(/\d\\.\d/)); // null (looking for a real dot \.)

    ```


    Parentheses are also special characters, so if we want them, we should use \(.
    The example below looks for a string "g())":


    ```

    alert("function g()".match(/g\\(\)/)); // "g()"

    ```


    If we''re looking for a backslash \, it''s a special character in both regular
    strings and regexps, so we should double it.


    ```

    alert("1\\\2".match(/\\\\/)); // ''\''

    ```


    # A slash


    A slash symbol ''/'' is not a special character, but in JavaScript it is used
    to open and close the regexp: /pattern.../, so we should escape it too.'
