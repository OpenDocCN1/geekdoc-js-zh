    In the shadow DOM, <slot name="X"> defines an "insertion point", a place where
    elements with slot="X" are rendered.


    Then the browser performs "composition": it takes elements from the light DOM
    and renders them in corresponding slots of the shadow DOM. At the end, we have
    exactly what we want — a component that can be filled with data.


    Here’s the DOM structure after the script, not taking composition into account:


