    ```

    alert( sessionStorage.getItem(''test'')); // after refresh: 1

    ```


    ...If you open the same page in another tab, and try again there, the code above
    returns `null`, meaning "nothing found".


    That''s exactly because `sessionStorage` is bound not only to the origin, but
    also to the browser tab. For that reason, `sessionStorage` is used sparingly.


