  md: '# expires, max-age


    By default, a cookie doesn''t have one of these options, it disappears when the
    browser is closed. Such cookies are called “session cookies”


    To let cookies survive browser close, we can set either expires or max-age option.


    ```

    expires=Tue, 19 Jan 2038 03:14:07 GMT

    ```


    Cookie expiration date, when the browser will delete automatically.


    The date must be exactly in this format, GMT timezone. We can use date.toUTC to
    get it. For instance, we can set the cookie to expire in 1 day:


    ```

    // +1 day from now

    let date = new Date(Date.now() + 86400e3);

    date = date.toUTCString();

    document.cookie = "user=John; expires=" + date;

    ```


    If we set expires to a date in the past, the cookie is deleted.


    +   - max-age=3600


    An alternative to expires, specifies the cookie expiration in seconds from the
    current moment.


    If zero or negative, then the cookie is deleted:


    ```

    // +1 hour from now

    document.cookie = "user=John; max-age=3600";n

    // delete cookie (let expire right now)

    document.cookie = "user=John; max-age=0";

    ```


    # secure


    +   - secure


    The cookie should be transferred only over HTTPS.


    By default, if we set a cookie at http://site.com, then it also appears at https://site.com
    and vice versa.


    That is, cookies are domain-based, they do not distinguish between the protocols.'
