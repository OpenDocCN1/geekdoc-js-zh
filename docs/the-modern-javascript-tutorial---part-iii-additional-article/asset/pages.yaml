  md: 'These common words do not make obvious why the regexp fails, let''s elaborate
    how the search works for the pattern ".+".


    +   1. The first pattern character is a quote "


    The regular expression engine tries to find it at the zero position of the source
    string a "witch" and her "broom" is one, but there''s a there, so there''s immediately
