- img_proc: true
  md: "In transition-property we write a list of property to animate, for instance:\
    \ left, margin-left, height, color.\n\nNot all properties can be animated, many\
    \ of them. The value all means \"animate all properties\".\n\n# transition-duration\n\
    \nIn transition-duration we can specify how long the animation should take. The\
    \ time should be in CSS time format: in seconds or milliseconds ms.\n\n# transition-delay\n\
    \nIn transition-delay we can specify the delay before the animation. For instance,\
    \ if transition-delay: 1s, then animation starts after 1 second after the change.\n\
    \nNegative values are also possible. Then the animation starts from the middle.\
    \ For instance, if transition-duration is 2s, and the delay is -1s, then the animation\
    \ takes 1 second and shifts numbers from the half.\n\nHere the animation shifts\
    \ numbers from 0 to 9 using CSS translate property: https://plnkr.co/edit/RIHA6fkSPUE9ck35PL?p=preview\n\
    \nThe transform property is animated like this:\n\n```\n@stripe.animate {\n  transform:\
    \ translate(-90%);\n  transition-property: transform;\n  transition-duration:\
    \ 9s;\n}\n```\n\nIn the example above JavaScript adds the class .animate to the\
    \ element – and the animation starts:\n\n```\nstripe classList add('animate');\n\
    ```\n\nWe can also start it from \"the middle\", from the exact number, e.g. corresponding\
    \ to the current second, using the negative transition-delay.\n\nHere if you click\
    \ the digit – it starts the animation from the current second:\n\nhttps://plnkr.co/edit/zpqja4CejOmTApUPxwE?p=preview\n\
    \nJavaScript does it by an extra line:"
  merge: -1
