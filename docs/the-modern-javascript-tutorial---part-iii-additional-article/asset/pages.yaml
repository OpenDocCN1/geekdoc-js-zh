- img_proc: true
  md: "```\nstripe onclick = function() {\n  let sec = new Date().getSeconds() % 10;\n\
    \  // for instance, -3s starts the animation from the 3rd second\n  stripe.style.transitionDelay\
    \ = '-' + sec + 's';\n  stripe.classList.add('animate');\n}\n```\n\n# transition-timing-function\n\
    \nTiming function describes how the animation process is distributed along the\
    \ time. Will it start slowly and then go fast or vice versa.\n\nThat's the most\
    \ complicated property from the first sight. But it becomes very simple if we\
    \ devote a bit of time to.\n\nThat property accepts two kinds of values: Bezier\
    \ curve or steps. Let's start from the curve, as it's used more often.\n\n# Bezier\
    \ curve\n\nThe timing function can be set as a Bezier curve with 4 control points\
    \ that satisfies the conditions:\n\n+   1. First control point: `(0,0)`.\n2. Last\
    \ control point: `(1,1)`.\n3. For intermediate points values of `x` must be in\
    \ the interval `0..1`, y can be anything.\n\nThe syntax for a Bezier curve in\
    \ CSS: `cubic-bezier(x2, y2, x3, y3)`. Here we need to specify only 2nd and 3rd\
    \ control points, because the 1st is fixed to `(0,0)` and the 4th is `(1,1)`.\n\
    \nTiming function describes how the animation process goes in time.\n\n+   - The\
    \ `x` axis is the time: `0` – the starting moment, `1` – the last moment of `transition-duration`.\n\
    - The `y` axis specifies the completion of the process: `0` – the starting value\
    \ of the property, `1` – the final value.\n\nThe simplest variant is when the\
    \ animation goes uniformly, with the same linear speed. That can be specified\
    \ by the curve `cubic-bezier(0, 0, 1, 1)`.\n\nHere's how that curve looks:"
