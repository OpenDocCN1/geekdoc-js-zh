- img_proc: true
  md: "Unlike response.text(), response.json() and other methods,\nresponse.body gives\
    \ full control over the reading process, and we can count\nhow much is consumed\
    \ at any moment.\n\nHere's the sketch of code that reads the repson from response.body\
    \ :\n\n```\n// instead of response.json() and other methods\nconst reader = response\
    \ body getReader();\n\n// infinite loop while the body is downloading\nwhile(true)\
    \ {\n  // done is true for the last chunk\n  // value is Uint8Array of the chunk\
    \ bytes\n  const (done, value) = await reader.read();\n\nif (done) {\n  break;\n\
    }\n\nconsole.log(`Received ${value.length} bytes`);\n```\n\nThe result of await\
    \ reader.read() call is an object with two properties:\n\n+   - done - true when\
    \ the reading is complete, otherwise false\n- value - a typed array of bytes:\
    \ Uint8Array.\n\n> Please note:\nStreams API also does asynchronous iteration\
    \ over ReadableStream\nwith await...of loop, it's not yet widely supported (see\
    \ browser issues), so we use while loop.\n\nWe receive response chunks in the\
    \ loop, until the loading finishes, that is: done becomes true.\n\nTo log the\
    \ progress, we just need for every received fragment value to add its length to\
    \ the counter.\n\nHere's the full working example that gets the response and logs\
    \ the progress in console, more explanations to follow:\n\n```\n// Step 1: start\
    \ the fetch and obtain a reader\nlet response = await fetch('https://api.github.com/repos/javascript-tutorial/en.javascript');\n\
    const reader = response.body getReader();\n```"
