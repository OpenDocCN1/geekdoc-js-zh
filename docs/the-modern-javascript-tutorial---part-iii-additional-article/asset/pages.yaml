- img_proc: true
  md: "Usage:\n\n+   - In computer graphics, modeling, vector graphic editors. Fonts\
    \ are described by Bezier curves.\n\n+   - In web development – graphics on Canvas\
    \ and in the SVG format. By the way, \"examples\" above are written in SVG. They\
    \ are actually a single document that is given different points as parameters.\
    \ You can open it in a separate window and see the source: demo.svg.\n\n+   -\
    \ In CSS animation to describe the path and speed of animation.\n\n# CSS-animations\n\
    \nCSS animations allow to do simple animations without JavaScript at all.\n\n\
    JavaScript can be used to control CSS animation and make it even better with a\
    \ little of code.\n\n# CSS transitions\n\nThe idea of CSS transitions is simple.\
    \ We describe a property and how its changes should be animated. When the property\
    \ changes, the browser paints the animation.\n\nThat is: all we need is to change\
    \ the property. And the fluent transition is made by the browser.\n\nFor instance,\
    \ the CSS below animates changes of background-color for 3 seconds:\n\n```\n.animated\
    \ {\n  transition-property: background-color;\n  transition-duration: 3s;\n}\n\
    ```\n\nNow if an element has .animated class, any change of background-color animated\
    \ during 3 seconds.\n\nClick the button below to animate the background:\n\n```\n\
    <button id=\"color\">Click me</button>\n<style>\n#color {\n  transition-property:\
    \ background-color;\n  transition-duration: 3s;\n}\n</style>\n```"
  merge: -1
  pgno: 165
- img_proc: true
  md: "```\n<script>\ncolor onclick = function() {\n  this.style.backgroundColor =\
    \ 'red';\n}\n</script>\n```\n\n![](img/10702f89b72e44092576c4bcf72121f3_166_0.png)\n\
    \nThere are 4 properties to describe CSS transitions:\n\n+   - transition-property\n\
    - transition-duration\n- transition-timing-function\n- transition-delay\n\nWe'll\
    \ cover them in a moment, for now let's note that the common transition property\
    \ allows to declare them together in the order: property duration timing-function\
    \ delay, and also animate multiple properties at once.\n\nFor instance, this button\
    \ animates color and font-size:\n\n```\n<button id=\"growing\">Click me</button>\n\
    <style>\n#growing {\ntransition: font-size 3s, color 2s;\n}\n</style>\n<script>\n\
    growing onclick = function() {\n  this.style.fontSize = '36px';\n  this.style.color\
    \ = 'red';\n}\n</script>\n```\n\n![](img/10702f89b72e44092576c4bcf72121f3_166_1.png)\n\
    \nNow let's cover animation properties one by one.\n\n# transition-property"
