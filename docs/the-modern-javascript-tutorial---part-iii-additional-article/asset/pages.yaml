    \nTo detect the moment of successful completion, we can listen to transaction.oncomplete\
    \ event:\n\n```\nlet transaction = db.transaction(\"books\", \"readwrite\");\n\
    // ...perform operations ...\ntransaction.oncomplete = function() {\n  console.log(\"\
    Transaction is complete\");\n};\n```\n\nOnly complete guarantees that the transaction\
    \ is saved as a whole. Individual requests may succeed, but the final write operation\
    \ may go wrong (e.g. I/O error or something).\n\nTo manually abort the transaction,\
    \ call:\n\n```\ntransaction.abort();\n```\n\nThat cancels all modification made\
    \ by the requests in it and triggers transaction.abort event.\n\n# Error handling"
