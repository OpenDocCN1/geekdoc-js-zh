  md: '![](img/10702f89b72e44092576c4bcf72121f3_157_0.png)


    If you look closely at at these curves, you can immediately notice:


    +   1. **Points are not always on curve.** That''s perfectly normal, later we''ll
    see how the curve is built.


    +   2. **The curve order equals the number of points minus one.** For two points
    we have a linear curve (that''s a straight line), for three points – quadratic
    curve (parabolic), for four points – cubic curve.


    +   3. A curve is always inside the [convex hull](#) of control points:


    ![](img/10702f89b72e44092576c4bcf72121f3_157_1.png)


    Because of that last property, in computer graphics it''s possible to optimize
    intersection tests. If convex hulls do not intersect, then curves do not either.
    So checking for the convex hulls intersection first can give a very fast “no intersection”
    result. Checking the intersection or convex hulls is much easier, because they
    are rectangles, triangles and so on (see the picture above), much simpler figures
    than the curve.


    **The main value of Bezier curves for drawing – by moving the points the curve
    is changing in intuitively obvious way.**


