  md: 'Sometimes we need parentheses to correctly apply a quantifier, but we don''t
    want their contents in results.


    A group may be excluded by adding `?:` in the beginning.


    For instance, if we want to find `(go)+`, but don''t want the parentheses contents
    `(go)` as a separate array item, we can write `(?:go)+`.


    In the example below we get the name `John` as a separate member of the match:


    ```

    let str = "Gogog John!";


    // ?: excludes ''go'' from capturing

    let regexp = /(?:go)+(\w+)/i;


    let result = str.match(regexp);


    alert(result[0]); // Gogog John (full match)

    alert(result[1]); // John

    alert(result.length); // 2 (no more items in the array)

    ```


    # Summary


    Parentheses group a part of the regular expression, so that the quantifier applies
    to it as a whole.


    Parentheses groups are numbered left-to-right, and can optionally be named with
    `(?<name>...)`.


    The content, matched by a group, can be obtained in the results:


    +   - The method `str.match` returns capturing groups only without flag g.

    - The method `str.matchAll` always returns capturing groups.


    If the parentheses have no name, then their contents is available in the match
    array by its number. Named parentheses are also available in the property `groups`.


