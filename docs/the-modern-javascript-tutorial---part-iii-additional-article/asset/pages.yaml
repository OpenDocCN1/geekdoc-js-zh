- img_proc: true
  md: '```

    let url = `https://google.com/search?q=$(music)`;

    alert(url); // https://google.com/search?q=Rock%26Roll

    ```


    Compare it with `encodeURI`:


    ```

    let music = encodeURI(''Rock&Roll'');


    let url = `https://google.com/search?q=$(music)`;

    alert(url); // https://google.com/search?q=Rock&Roll

    ```


    As we can see, `encodeURI` does not encode &, as this is a legitit character in
    URL as a whole.


    But we should encode & inside a search parameter, otherwise, we get q=Rock&Roll
    – that is actually q=Rock plus some obscure parameter Roll. Not intended.


    So we should use `encodeURIComponent` for each search parameter, to correctly
    insert it in the URL string. The safest is to encode both name and value, unless
    we''re absolutely sure that it has only allowed characters.


    > Encoding difference compared to URL

    Classes URL [external link] and URLSearchParams [external link] are based on the
    latest URI specification: RFC3986 [external link], while encode* functions are
    based on the obsolete version RFC2396 [external link].


    There are a few differences, e.g. IPv6 addresses are encoded differently:


    ```

    // valid url with IPv6 address

    let url = `http://[2607:f8b0:4005:802::1007]/`;

    ```


    ```

    alert(encodeURI(url)); // http://%5B2607:f8b0:4005:802::1007%5D/

    alert(new URL(url)); // http://[2607:f8b0:4005:802::1007]/

    ```


    As we can see, `encodeURI` replaced square brackets [...], that''s not correct,
    the reason is: IPv6 urls did not exist at the time of RFC2396 (1998).


    Such cases are rare, `encode*` functions work well most of the time.


