  md: '* left/top (numeric) – coordinates of the window top-left corner on the screen.
    There is a limitation: a new window cannot be positioned offscreen.


    * width/height (numeric) – width and height of a new window. There is a limit
    on minimal width/height, so it''s impossible to create an invisible window.


    Window features:


    +   * menubar (yes/no) – shows or hides the browser menu on the new window.


    +   * toolbar (yes/no) – shows or hides the browser navigation bar (back, forward,
    reload etc) on the new window.


    +   * location (yes/no) – shows or hides the URL field in the new window. FF and
    IE don''t allow to hide it by default.


    +   * status (yes/no) – shows or hides the status bar. Again, most browsers force
    it to show.


    +   * resizable (yes/no) – allows to disable the resize for the new window. recommended.


    +   * scrollbars (yes/no) – allows to disable the scrollbars for the new window.
    Not recommended.


    There is also a number of less supported browser-specific features, which are
    usually not used. Check window.open in MDN for examples.


    # Example: a minimalistic window


    Let''s open a window with minimal set of features just to see which of them browser
    allows to disable:


    ```

    let params = `scrollbars=no, resizable=no, status=no, location=no, toolbar=no,
    menubar=no width=0,height=0,left=-1000,top=-1000`;

    ```


    open(''/'', ''test'', params);


    Here most “window features” are disabled and window is positioned offseason. Run
    it and see what really happens. Most browsers “fix” things like zero width/height
    and offseason left/top. For instance, Chrome opens a window with width/height,
    so it occupies the full screen.


    Let''s add normal positioning options and reasonable width, height, left, top
    coordinates:


    ```

    let params = `scrollbars=no, resizable=no, status=no, location=no, toolbar=no,
    menubar=no width=600,height=300,left=100,top=100`;

    ```


    open(''/'', ''test'', params);'
