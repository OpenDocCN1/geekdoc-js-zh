    \ Smith\nBirthday: 01.01.2001\n\n# Summary\n\nShadow DOM can include styles\n\n\
    Local styles can affect:\n\n+   - shadow tree,\n- shadow host with :host-family\
    \ pseudoclasses,\n- slotted elements (coming from light DOM), ::slotted(selector)\
