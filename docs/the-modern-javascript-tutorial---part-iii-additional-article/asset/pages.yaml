    IndexedDB is a built-in database, much more powerful than localStorage.


    +   * Key/value storage: value can be (almost) anything, multiple key types.

    * Supports transactions for reliability.

    * Supports key range queries, indexes.

    * Can store more data than localStorage.


    That power is usually excessive for traditional client-server apps. IndexedDB
    is intended for offline apps, combined with ServiceWorkers and other technologies.


    The native interface to IndexedDB, described in the specification https://www.w3.org/TR/IndexedDB
    🔗, is event-based.


    We can also use async/await with the help of a promise-based wrapper, like https://github.com/jakeibald/idb
    🔗. That''s pretty convenient, but the wrapper is not perfect, it can''t replace
    events for all cases. So we''ll start with events, and then, after we gain understanding
