    # Animation


    CSS and JavaScript animations.


    # Bezier curve


    Bezier curves are used in computer graphics to draw shapes, for CSS animation
    and in many other places.


    They are a very simple thing, worth to study once and then feel comfortable in
    the world of vector graphics and advanced animations.


    # Control points


    A bezier curve  is defined by control points.


    There may be 2, 3, 4 or more.


    For instance, two points curve:


    ![](img/10702f89b72e44092576c4bcf72121f3_156_0.png)


    Three points curve:


    ![](img/10702f89b72e44092576c4bcf72121f3_156_1.png)


