- img_proc: true
  md: 'For instance, let''s try to put 256 into UintArray . In binary, 256 is 100000000
    (9 bits), but Uint8Array only provides 8 bits per value, that makes the available
    range from 0 to 255.


    For bigger numbers, the rightmost (less significant) 8 bits are stored, and the
    rest is cut off:


    ```

    8-bit integer

    1 00000000 256

    ```


    So we''ll get zero.

    For 257, the binary form is 100000001 (9 bits), the rightmost 8 get stored, so
    we''ll have 1 in the array:


    ```

    8-bit integer

    1 000000001 257

    ```


    In other words, the number modulo 2^8 is saved.

    Here''s the demo:


    ```

    let uint8array = new Uint8Array(16);


    let num = 256;

    alert(num.toString(2)); // 100000000 (binary representation)


    uint8array[0] = 256;

    uint8array[1] = 257;


    alert(uint8array[0]); // 0

    alert(uint8array[1]); // 1

    ```


    Uint8ClampedArray is special in this aspect, its behavior is different. It saves
    255 for any number that is greater than 255, and 0 for any negative number. That
    behavior is useful for image processing.


