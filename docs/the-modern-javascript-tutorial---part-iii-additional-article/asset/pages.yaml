- img_proc: true
  md: "```\nawait transaction.complete;\n\nconsole.log('jsbook saved');\n} catch(err)\
    \ {\n  console.log('error', err.message);\n}\n```\n\nSo we have all the sweet\
    \ \"async code\" and \"try-catch\" stuff.\n\n# Error handling\n\nIf we don't catch\
    \ an error, it falls through, to the closest outer try..catch.\n\nAn uncaught\
    \ error becomes an \"unhandled promise rejection\" event on window object.\n\n\
    We can handle such errors like this:\n\n```\nwindowaddEventListener('unhandledrejection',\
    \ event => {\n  let request = event.target; // IndexedDB native request object\n\
    \  let error = event.reason; // Unhandled error object, same as request.error\n\
    \  ...report about the error...\n});\n```\n\n# Inactive transaction pitfall\n\n\
    As we already know, a transaction auto-commits as soon as the browser is done\
    \ with the current code and microtasks. If we put a macrotask fetch in the middle\
    \ of a transaction, the transaction won't wait for it to finish. It just auto-commits.\n\
    \nFor a promise wrapper and async/await the situation is the same.\n\nHere's an\
    \ example of fetch in the middle of the transaction:\n\n```\nlet transaction =\
    \ db.transaction(\"inventory\", \"readwrite\");\nlet inventory = transaction.objectStore(\"\
    inventory\");\n\nawait inventory.add({ id: 'js', price: 10, created: new Date()\
    \ });\nawait fetch(...); // (*)\ninventory.add({ id: 'js', price: 10, created:\
    \ new Date() }); // Error\n```\n\nThe next inventory.add after fetch (*) fails\
    \ with an \"inactive transaction\" error, because the transaction is already committed\
    \ and closed at that time."
  merge: -1
  pgno: 154
- img_proc: true
  md: "The workaround is same as when working with native IndexedDB: either make a\
    \ new transaction or split things apart.\n\n+   1. Prepare the data and fetch\
    \ all that's needed first.\n2. Then save in the database.\n\n# Getting native\
    \ objects\n\nInternally, the wrapper performs a native IndexedDB request, adding\
    \ onerror/onsuccess to it, and returns a promise that rejects/resolves with the\
    \ result.\n\nThat works fine of the time. The examples are at the lib page\nhttps://github.com/jakearchibald/id\n\
    \nIn rare cases, when we use the original request object, we can access it as\
    \ promise.request property of the promise:\n\n```\nlet promise = books.add(book);\
    \ // get a promise (don't await for its result)\n\nlet request = promise.request;\
    \ // native request object\nlet transaction = request.transaction; // native transaction\
    \ object\n\n//do some native IndexedDB voodoo...\n\nlet result = await promise;\
    \ // if still needed\n```\n\n# Summary\n\nIndexedDB can be thought of as a \"\
    LocalStorage on steroids\". It's a simple key-value database, powerful enough\
    \ for offline apps, yet to use.\n\nThe best manual is the specification, the current\
    \ one is 2.0, but few methods from 3.0 (it's not much different) are partially\
    \ supported.\n\nThe basic usage can be described with a few phrases:\n\n+   1.\
    \ Get a promise wrapper like id\n2. Open a database: idb.openDB(name, version,\
    \ onupgradeded)\n   - Create object stores and indexes in ongradeded handler or\
    \ version updated needed.\n3. For requests:\n   - Create transaction db.transaction('books')\
    \ (readwrite needed).\n   - Get the object store transaction.objectStore('books').\n\
    4. Then, to search by a key, call methods on the object store directly.\n   -\
    \ To search by an object field, create an index."
