  md: "# Shadow DOM slots, composition\n\nMany types of components, such as tabs,\
    \ menus, image galleries, and so on, need the content to render.\n\nJust like\
    \ built-in browser <element> expects <option> items, our <custom-tabs> may expect\
    \ the actual tab content to be passed. And a <custom-menu> may expect menu items.\n\
    \nThe code that makes use of <custom-menu> can look like this:\n\n```\n<custom-menu>\n\
    \  <title>Candy menu</title>\n  <item>Lollipop</item>\n  <item>Fruit Toast</item>\n\
    \  <item>Cup Cake</item>\n</custom-menu>\n```\n\n...Then our component should\
    \ render properly, as a nice menu with given title and items, handle menu events,\
    \ etc.\n\nHow to implement it?\n\nWe could try to analyze the element content\
    \ and dynamically copy-rearrange DOM nodes. That's possible, but if we're moving\
    \ elements to shadow DOM, CSS styles from the document do not apply in there,\
    \ so the visual styling may be lost. Also that requires some coding.\n\nLuckily,\
    \ we don't have to. Shadow DOM supports <slot> elements, that are automatically\
    \ filled by the content from light DOM.\n\n# Named slots\n\nLet's see how slots\
    \ work on a simple example.\n\nHere, <user-card> shadow DOM provides two slots,\
    \ filled from light DOM:\n\n```\n<script>\ncustomElements.define('user-card',\
    \ class extends HTMLElement {\n  connectedCallback() {\n    this.attachShadow({mode:\
    \ 'open'});\n    this.shadowRoot.innerHTML = =\n    <div>\n      <slot name=\"\
    username\"></slot>\n    </div>\n    <div>\n      <slot name=\"birthday\"></slot>\n\
    \    </div>\n  });\n```"
