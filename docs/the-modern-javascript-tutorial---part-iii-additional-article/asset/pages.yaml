    # Sets


    For instance, [eao] means any of the 3 characters: ''a'', ''e'', or ''o''.

    That''s called a set. Sets can be used in a regex with regular characters:


    ```

    // find [t or m], and then "op"

    alert("Mop top"match([/tm]op/gi)); // "Mop", "top"

    ```


    Please note that although there are multiple characters in the set, they correspond
    to exactly one character in the match.

    So the example below gives no matches:


    ```

    // find "V", then [o or i], then "la"

    alert("Voila"match([V][oi]/)); // null, no matches

    ```


    The pattern searches for:


    +   - V,'
