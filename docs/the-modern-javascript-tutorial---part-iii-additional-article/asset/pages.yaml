    <span slot="birthday">01.01.2001</span>

    </user-card>

    ```


    We create the shadow DOM, so here it is, under #shadow-root. Now the element has
    both light and shadow DOM.


    For rendering purposes, for each <slot name="..."> in shadow DOM, the browser
    looks for slot="..." with the same name in the light DOM. These elements are rendered
    inside the slots:'
