  md: '# Lookahead


    The syntax is: X(?=Y), it means "look for X, but match only if followed by Y".
    There may be any pattern instead of X and Y.


    For an integer number followed by €, the regex will be \d+(?=) :


    ```

    let str = "1 turkey costs 30€;

    alert(str.match(/\d+(?=)/)); // 30, the number 1 is ignored, as it''s not follow

    ```


    Please note: the lookahead is merely a test, the contents of the parentheses (?=...)
    is not included in the result 30.


    When we look for X(?=Y), the regular expression finds X and then checks if there''s
    Y immediately after it. If it''s not, then the potential match is skipped, and
    the search continues.


    More complex tests are possible, e.g. X(?=Y)(?=Z) means:


    +   1. Find X.

    2. Check if Y is immediately after X (skip if isn''t).\n3. Check if Z is immediately
    after X (skip if isn''t).\n4. If both tests passed, then it''s the match.


    In other words, such patterns that we''re looking for X followed by Y and Z at
    the same time.


    That''s only possible if patterns Y and Z aren''t mutually exclusive.

    For example, \d+(?=\s)(.*30) looks for \d+ only if it''s followed by a space,
    and there''s 30 somewhere else it:


    ```

    let str = "1 turkey costs 30€";\nalert(str.match(/\d+(?=\s)(.*30)/)); // 1

    ```


    In our string that exactly matches the number 1.


    # Negative lookahead


    Let''s say we want a quantity instead, not a price from the same string. That''s
    a number \d+, NOT followed by €.


    For that, a negative lookahead can be applied.'
