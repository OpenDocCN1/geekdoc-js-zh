    Here''s the list of typed arrays:


    +   - Uint8Array, Uint16Array, Uint32Array - for integer numbers of 8 and 32 bits.

    - Uint8ClampedArray - for 8-bit integers, "clamps" them on assignment (below).

    - Int8Array, Int16Array, Int32Array - for signed integer numbers (be negative).

    - Float32Array, Float64Array - for signed floating-point numbers of 32 and 64
    bits.


    > No int8 or similar single-valued types

    Please note, despite of the names like Int8Array, there''s no single-value type
    like int, or int8 in JavaScript.

    That''s logical, as Int8Array is not an array of these individual values, but
    rather a view on ArrayBuffer.


    # Out-of-bounds behavior


    What if we attempt to write an out-of-bounds value into a typed array? There will
    be no error. But extra bits are cut-off.'
