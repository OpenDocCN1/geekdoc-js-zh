    For our task we want another thing. That''s where a lazy mode can help.


    # Lazy mode


    The lazy mode of quantifiers is an opposite to the greedy mode. It means: “repeat
    minimal number of times.


    We can enable it by putting a question mark ''?'' after the quantifier, so that
    it becomes ?+ or ?? even ''?''.


    To make things clear: usually question mark ? is a quantifier by itself (zero
    or one), if added after another quantifier (or even itself) it gets another meaning
    – it switches the matching mode from greedy to lazy.


    The regexp /.+?/g works as intended: it finds "witch" and "broom":


