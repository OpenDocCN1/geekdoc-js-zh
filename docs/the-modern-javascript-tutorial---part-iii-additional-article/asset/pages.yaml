    ...And this thing flies, keeps humans alive in space!


    How such complex devices were created?


    Which principles could we borrow to make our development same-level reliable and
    scalable? Or, at least, close to it.


    # Component architecture


    The well known rule for developing complex software is: don''t make complex software.


    If something becomes complex – split it into simpler parts and connect in the
    most obvious way.


    A good architect is the one who can make the complex simple.'
