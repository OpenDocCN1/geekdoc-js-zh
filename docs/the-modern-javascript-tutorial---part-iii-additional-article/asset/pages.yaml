  md: '# Same origin policy


    Windows may freely access content of each other only if they come from the same
    origin (protocol://domain:port).


    Otherwise, e.g. if the main window is site.com, and the popup from gmail.com,
    that''s impossible for user safety reasons. For the details, chapter Cross-window
    communication.


    # Accessing window from popup


    A popup may access the "opener" window as well using window.opener reference.
    It is null for all windows except popup.


    If you run the code, it replaces the opener (current) window content with "Test":


    ```

    let newWin = window.open("about:blank", "hello", "width=200,height=200");

    newWin.document.write("<script>window.opener.document.body.innerHTML = ''Test\</script>");

    );

    ```


    The connection between the windows is bidirectional: the main window and the popup
    have a reference to each other.


    # Closing a popup


    To close a window: win.close().

    To check if a window is closed: win.closed


    Technically, the close() method is available for any window, but window.close()
    is ignored by most browsers if not created with window.open(). So it''ll only
    work on a popup.


    The closed property is true if a window is closed. That''s useful to check if
    the popup (or the main window) is still open or not. A user can close it anytime,
    and your code should take that possibility into account.


    This code loads and then closes the window:


    ```

    let newWindow = open(''/'', ''example'', ''width=300,height=300'');

    newWindow.onload = function() {

    newWindow.close();

    }

    ```'
