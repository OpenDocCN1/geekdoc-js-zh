    Anchors ^ and $ are tests. They have zero width.

    In other words, they do not match a character, but rather force the regexp engine
    to check the condition (text start/end).


    # Tasks


    # Regexp ^$


    Which string matches the pattern ^$? ?


    To solution


    # Multiline mode of anchors ^$, flag "m"


    The multiline mode is enabled by the flag m.

    It only affects the behavior of ^ and $.

    In the multiline mode they match not only at the beginning and the end of the
    string, but also at start/end of line.


    # Searching at line start ^


    In the example below the text has multiple lines. The pattern /\d/gm takes a digit
    from the beginning of each line:


    ```

    let str = `1st place: Winnie

    2nd place: Piglet

    3rd place: Eyore`;


    alert(strmatch(/\d/gm)); // 1, 2, 3

    ```


    Without the flag m only the first digit is matched:


    ```

    let str = `1st place: Winnie

    2nd place: Piglet

    3rd place: Eyore`;


    alert(strmatch(/^\d/g)); // 1

    ```'
