- img_proc: true
  md: "Rendering in connectedCallback, not in constructor\n\nIn the example above,\
    \ element content is rendered (created) in `connectedCallback`.\n\nWhy not in\
    \ the `constructor`?\n\nThe reason is simple: when `constructor` is called, it's\
    \ yet too early. The element is created, but the browser did not process/assign\
    \ attributes at this stage: calls to `getAttribute` would return `null`. So we\
    \ can't render there.\n\nBesides, if you think about it, that's better performance-wise\
    \ – to delay the work until it's really needed.\n\nThe `connectedCallback` triggers\
    \ when the element is added to the document. not just appended to another element\
    \ as a child, but actually becomes a part of the page. So we can build detached\
    \ DOM, create elements and prepare them for later use. They will only be rendered\
    \ when we make it into the page.\n\n# Observing attributes\n\nIn the current implementation\
    \ of `<time-formatted>`, after the element is rendered, further attribute changes\
    \ don't have any effect. That's strange for an HTML element. Usually, when we\
    \ change an attribute, like `a.href`, we expect the change to be immediately visible.\
    \ Let's fix this.\n\nWe can observe attributes by providing their list in `observedAttributes()`\
    \ static getter. For such attributes, `attributeChangedCallback` is called when\
    \ they are modified. It doesn't trigger for an attribute for performance reasons.\n\
    \nHere's a new `<time-formatted>`, that auto-updates when attributes change:\n\
    \n```\n<script>\nclass TimeFormatted extends HTMLElement {\n\nrender() { // (1)\n\
    \  let date = new Date(this.getAttribute('datetime') || Date.now());\n\n  this.innerHTML\
    \ = new Intl.DateTimeFormat(\"default {\n    year: this.getAttribute('year') ||\
    \ undefined,\n    month: this.getAttribute('month') || undefined,\n    day: this.getAttribute('day')\
    \ || undefined,\n    hour: this.getAttribute('hour') || undefined,\n    minute:\
    \ this.getAttribute('minute') || undefined,\n    second: this.getAttribute('second')\
    \ || undefined,\n    timeZone: this.getAttribute('time-zone-name') || undefined\n\
    \  }).format(date);\n}\n```"
  merge: -1
  pgno: 200
