  md: "For instance, if the document we had:\n\n```\n<style>\ncustom-dialog {\n  padding:\
    \ 0;\n}\n</style>\n```\n\n...Then the <custom-dialog> would be without padding.\n\
    It's very convenient, as we can set \"default\" component styles in its :host\
    \ rule, and then easily override them in the document.\n\nThe exception is when\
    \ a local property is labelled !important, for such properties, local styles take\
    \ precedence.\n\n# :host(selector)\n\nSame as :host, but applied only if the shadow\
    \ host matches the selector.\nFor example, we'd like to center the <custom-dialog>\
    \ only if it has centered attribute:\n\n```\n<template id=\"tmpl\">\n<style>\n\
    \  :host([centered]) {\n    position: fixed;\n    left: 50%;\n    top: 50%;\n\
    \    transform: translate(-50%, -50%);\n    border-color: blue;\n  }\n\n  :host\
    \ {\n    display: inline-block;\n    border: 1px solid red;\n    padding: 10px;\n\
    \  }\n</style>\n<slot></slot>\n</template>\n```\n\n```\n<script>\ncustomElements.define('custom-dialog',\
    \ class extends HTMLElement {\n  connectedCallback() {\n    this.attachShadow({mode:\
    \ 'open'}).append(tmpl.content.cloneNode(true));\n  }\n});\n</script>\n```"
