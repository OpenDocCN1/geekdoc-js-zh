- img_proc: true
  md: 'For instance, in the word JavaScript it may not match Java, but leave out Script
    to match the rest of the pattern.


    Here''s the comparison of two patterns:


    ```

    alert("JavaScript" match(/\w+/)); // JavaScript

    alert("JavaScript" match(/(?=(\w+))Script)); // null

    ```


    +   1. In the first variant \w+ captures the whole word JavaScript by character
    to character, to try to match the rest of the pattern, until finally succeeds
    when \w+ matches Java.

    2. In the second variant (?=(\w+)) looks ahead and finds the JavaScript, which
    is included in the pattern as a whole \1, so there remains no way to find Script
    after it.


    We can put a more complex regular expression into (?=(\w+))1 instead of \w, when
    we need to forbid backtracking for + after it.


    > Please note:

    There''s more about the relationship between possessive quantifiers and lookahead
    in articles Regex: Emulate Atomic Grouping (and Possessive Quantifiers) with LookAhead
    ↗ and Mimicking Atomic Groups ↗


    Let''s rewrite the first example using lookahead to prevent backtracking:


    ```

    let regexp = /^((?=(\w+))2\s*)$$/;

    alert( regexp.test("A good string")); // true

    let str = "An input string that takes a long time or even makes this regex to
    hang";nalert( regexp.test(str)); // false, works and fast!

    ```


    Here \2 is instead of \1, because there are additional outer parentheses. To avoid
    messing up with the numbers, we can give the parentheses a name, e.g. (?<word>\w+).


    ```

    // parentheses are named <word>, referenced as <word>\s*$/

    let regexp = /^((?=(\w+))<word>\s*)$$/;

    let str = "An input string that takes a long time or even makes this regex to
    hang";

    ```'
