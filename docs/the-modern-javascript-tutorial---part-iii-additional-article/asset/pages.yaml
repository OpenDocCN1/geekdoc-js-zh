  md: "```\n}}).format(date);\n}\nconnectedCallback() { // (2)\n  if (!this.rendered)\
    \ {\n    this.render();\n    this.rendered = true;\n  }\n}\n```\n\n```\nstatic\
    \ get observedAttributes() { // (3)\n  return ['datetime', 'year', 'month', 'day',\
    \ 'hour', 'minute', 'second', 'time-z\n```\n\n```\nattributeChangedCallback(name,\
    \ oldValue, newValue) { // (4)\n  this.render();\n}\n```\n\ncustomElements.define(\"\
    time-formatted\", TimeFormatted);\n\n```\n<script>\n<time-formatted id=\"elem\"\
    \ hour=\"numeric\" minute=\"numeric\" second=\"numeric\"></time-f\n```\n\n```\n\
    <script>\nsetInterval(() => elem.setAttribute('datetime', new Date()), 1000);\
    \ // (5)\n</script>\n```\n\n11:01:01 AM\n\n+   1. The rendering logic is moved\
    \ to render() helper method.\n2. We call it when the element is inserted into\
    \ page.\n3. For a change of an attribute, listed in observedAttributes(),\n  \
    \ attributeChangedCallback triggers.\n4. ...and re-renders the element.\n5. At\
    \ the end, we can easily make a live timer.\n\n# Rendering order\n\nWhen HTML\
    \ parser builds the DOM, the elements are processed one after another,\nparent\
    \ before children. E.g if we have <outer><inner></inner></outer>,\nthen <outer>\
    \ element is created and connected to DOM first, and <inner>.\n\nThat leads to\
    \ important consequences for custom elements.\nFor example, if a custom element\
    \ tries to access innerHTML in\nconnectedCallback, it gets nothing:"
