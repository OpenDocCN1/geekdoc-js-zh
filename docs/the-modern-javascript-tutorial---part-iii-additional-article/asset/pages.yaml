  md: 'We can write a more universal pattern, that looks for wordy characters in any
    language. That''s easy with unicode properties: [\\p{Alpha}\\p{M}\\p{Nd}\\p{Pc}\\p{Join_C}].


    Let''s decipher it. Using \, we''re making a set of our own that includes characters
    with following unicode properties:


    +   * Alphabetic (Alpha) - for letters,

    * Mark (M) - for accents,

    * Decimal_Number (Nd) - for digits,

    * Connector_Punctuation (Pc) - for the underscore ''_'' characters,

    * Join_Control (Join_C) - two special codes 200c and 200d, used in ligatures,
    e.g. in Arabic.


    An example of use:


    ```

    let regexp = /[\\p{Alpha}\\p{M}\\p{Nd}\\p{Pc}\\p{Join_C}]/gu;

    let str = `你好12`;

    // finds all letters and digits:

    alert(str.match(regexp)); // H,i,你好,1,2

    ```


    Of course, we can edit this pattern: avoid unicode properties or properties are
    covered in more details in the article Unicode: flag "u" and class \{...}.


    > > Unicode properties aren''t supported in Edge and Firefox

    Unicode properties p{...} are not yet implemented in Edge and Firefox. If we really
    need them, we can use library XRegExp.


    Or use ranges of characters in a language that interests us, e.g. [a-я] for Cyrillic
    letters.


    # Excluding ranges


    Besides normal ranges, there are "excluding" ranges that look like [^...].


    They are denoted by a caret ^ at the start and match any character except the
    given ones.


    For instance:


    +   * [aeoyo] – any character except ''a'', ''e'', ''y'' or ''o''.'
