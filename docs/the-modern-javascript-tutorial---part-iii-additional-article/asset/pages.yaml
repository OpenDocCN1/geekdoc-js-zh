    The referrerPolicy option sets general rules for Referer.


    Requests are split into 3 types:


    +   1. Request to the same origin.

    2. Request to another origin.

    3. Request from HTTPS to HTTP (from safe to unsafe protocol).


    Unlike referrer option that allows to set the exact Referer value, referrerPolicy
    tells the browser general rules for each request type.


    Possible values are described in the Referrer Policy specification


    +   **no-referrer-downgrade** – the default value: full Referer is sent always,
    unless we send a request from HTTPS to HTTP (to less secure protocol).

    **no-referrer** – never send Referer.

