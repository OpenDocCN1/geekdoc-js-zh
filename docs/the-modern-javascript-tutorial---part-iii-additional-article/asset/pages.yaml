  md: "The algorithm for 4 points:\n\n+   - Connect control points by segments: 1\
    \ → 2 → 2 → 3 → 4. There will be 3 brown segments.\n- For each t in the interval\
    \ from 0 to 1:\n  - We take points on these segments on the distance proportional\
    \ to t from the beginning. These points are connected, so that we have two green\
    \ segments.\n  - On these segments we take points proportional to t. We get one\
    \ blue segment.\n  - On the blue segment we take a point proportional to t. On\
    \ the example above it's red.\n- These points together form the curve.\n\nThe\
    \ algorithm is recursive and can be generalized for any number of control points.\n\
    N of control points:\n\n+   1. We connect them to initially N-1 segments.\n2.\
    \ Then for each t from 0 to 1, we take a point on each segment of the distance\
    \ proportional to t and connect them. There will be N-2 segments.\n3. Repeat step\
    \ 2 until there is only one point.\n\nThese points make the curve.\n\nA curve\
    \ that looks like y=1/t :\n\n![](img/10702f89b72e44092576c4bcf72121f3_161_0.png)\n\
    \nZig-zag control points also work fine:"
