  md: '# Quantity {n}


    The simplest quantifier is a number in curly braces: {n}.


    A quantifier is appended to a character (or a character class, or a [...] set)
    and specifies how many times we need.


    It has a few advanced forms, let''s see examples:


    # The exact count: {5}


    \d{5} denotes exactly 5 digits, the same as \d\d\d\d\d.


    The example below looks for a 5-digit number:


    ```

    alert(''I''m 12345 years old'') match(/\d{5}/); // "12345"

    ```


    We can add \b to exclude longer numbers: \b\d{5}\b.


    # The range: {3,5}, match 3-5 times


    To find numbers from 3 to 5 digits we can put the limits into curly braces: \d{3,5}


    ```

    alert(''I''m not 12, but 1234 years old'') match(/\d{3,5}/); // "1234"

    ```


    We can omit the upper limit.


    Then a regex \d{3,} looks for sequences of digits of length 3 or more:


    ```

    alert(''I''m not 12, but 345678 years old'') match(/\d{3,}/); // "345678"

    ```


    Let''s return to the string +7(903)-123-45-67.


    A number is a sequence of one or more digits in a row. The regex is \d{1,}


    ```

    let str = "+7(903)-123-45-67";

    let numbers = str match(/\d{1,}/g);

    alert(numbers); // 7,903,123,45,67

    ```


    # Shorthands


    There are shorthands for most used quantifiers:'
