  md: '# Alternation (OR) |


    # Find programming languages


    The first idea can be to list the languages with | in-between.


    But that doesn''t work right:


    ```

    let regexp = /Java|JavaScript|PHP|C|\+\+/g;

    let str = "Java, JavaScript, PHP, C, C++";

    alert(str.match(regexp)); // Java, Java, PHP,C,C

    ```


    The regular expression engine looks for alternations one-by-one. That is first
    it checks if we have Java, otherwise – looks for JavaScript and so on.


    As a result, JavaScript can never be found, because Java is checked.


    The same with C and C++.


    There are two solutions for that problem:


    +   1. Change the order to check the longer match: JavaScript|Java|\+\|C|PHP.

    2. Merge variants with the same start: Java(Script)?|C(\+\+)?|PHP.


    In action:


    ```

    let regexp = /(Java(Script)?|C(\+\+)?|PHP)/g;

    let str = "Java, JavaScript, PHP, C, C++";

    alert(str.match(regexp)); // Java, JavaScript, PHP,C,C

    ```


