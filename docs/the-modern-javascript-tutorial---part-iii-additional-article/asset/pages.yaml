    # Focus/blur on a window


    Theoretically, there are window.focus() and window.blur() methods to focus/unfocus
    on a window. Also are there focus/blur events that allow to focus a window and
    catch the moment when the visitor switches elsewhere.


    In the past pages abused those. For instance, look at this code:


    ```

    window.onblur = () => window.focus();

    ```


    When a user attempts to switch out of the window (blur), it brings back to focus.
    The intention is to "lock" the user within the window.


    So, there are limitations that forbid the code like that. There are many limitations
    to protect the user from ads and evils pages. They depend on the browser.


    For instance, a mobile browser usually ignores that can completely. Also focusing
    doesn''t work when a popup opens in a separate tab rather than a new window.


    Still, there are some things that can be done.


    For instance:


    +   - When we open a popup, it''s be a good idea to run newwindow.focus() on it.
    Just in case, for some OS/browser combinations ensures that the user is in this
    new window.


    +   - If we want to track when a visitor actually uses our web-app, we can track
    window.onfocus/onblur. That allows us to suspend/resume-in-page activities, animations
    etc. But please note that the blur event means the visitor switched out from the
    window, but they still may observe it. The window is in the background, but still
    may be visible.


    # Summary


    Popup windows are rarely used, as there are alternatives: loading and displaying
    information in-page, or in iframe.'
