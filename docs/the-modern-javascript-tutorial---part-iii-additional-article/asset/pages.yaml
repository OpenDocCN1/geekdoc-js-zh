  md: 'We can decode a part of the buffer by creating a subarray view for it:


    ```

    let uint8Array = new Uint8Array([0, 72, 101, 108, 108, 111, 0]);


    // the string is in the middle

    // create a new view over, without copying anything

    let binaryString = uint8Array.subarray(1, -1);

    ```


    ```

    alert(new Decoder().decode(binaryString)); // Hello

    ```


    # TextEncoder


    TextEncoder does the reverse thing – converts a string into bytes.


    The syntax is:


    ```

    let encoder = new TextEncoder();

    ```


    The only encoding it supports is “utf-8”.


    It has two methods:


    +   - encode(str) returns Uint8Array from a string.

    - encodeInto(str, destination) – encodes str into destination must be Uint8Array.


    ```

    let encoder = new TextEncoder();

    let uint8Array = encoder.encode("Hello");

    alert(uint8Array); // 72,101,108,108,111

    ```


    # Blob


    ArrayBuffer and views are a part of ECMA standard, a part of JavaScript.


    In the browser, there are additional higher-level objects, described in File API,
    in particular Blob.


    Blob consists of an optional string type (a MIME-type usually), plus blobParts
    – a sequence of other Blob objects, strings and BufferSource.'
