  md: '# Ranges flag "u"


    If there are surrogate pairs in the set, flag u is required for them to work correctly.

    For instance, let''s look for [X Y] in the string X:


    ```

    alert(''X''.match([\X Y/)); // shows a strange character, like [?

    // (the search was performed incorrectly, half-character returned)

    ```


    The result is incorrect, because by default regular expressions “don’t know” about
    surrogate pairs.


    The regular expression engine thinks that [X Y] – are not two, but four characters:


    +   1. left half of X (1),

    2. right half of X (2),

    3. left half of Y (3),

    4. right half of Y (4).


    We can see their codes like this:


    ```

    for(let i=0; i<''X Y'' length; i++) {

    alert(''X Y''.charCodeAt(i)); // 555349, 55649, 55349, 56500

    };

    ```


    The example above finds and shows the left half of X.

    If we add flag u, then the behavior will be correct:


    ```

    alert(''X''.match([\X Y]/u)); // X

    ```


    The similar situation occurs when looking for a range, such as [X-Y].

    If we forget to add u, there will be an error:


    ```

    ''X'' match([\X-Y]/); // Error: Invalid regular expression

    ```


    The reason is that without flag u surrogate pairs are perceived as two characters,
    so [X-Y] is interpreted as [<55349><55649>-<55349><56500> (every surrogate pair
    is replaced with its codes). Now it is easy to see that the range'
