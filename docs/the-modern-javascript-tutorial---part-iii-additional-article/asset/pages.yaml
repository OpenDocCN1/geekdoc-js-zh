  md: 'The common term for all these views (Uint8Array, Uint32Array, etc) is TypedArray.
    They share the same set of methods and properties.


    They are much more like regular arrays: have indices and iterable.


    A typed array constructor (be it Int8Array or Float64Array, doesn''t matter) behaves
    differently depending on argument types.


    There are 5 variants of arguments:


    ```

    new TypedArray(buffer, [byteOffset], [length]);

    new TypedArray(object);

    new TypedArray(typedArray);

    new TypedArray(length);

    new TypedArray();

    ```


    +   1. If an ArrayBuffer is supplied, the view is created over it. We used that
    syntax relies.


    Optionally we can provide byteOffset to start from (0 by default) and the length
    (till the end of the buffer by default), then the view will cover only a of the
    buffer.


    +   2. If an Array, or any array-like object is given, it creates a typed array
    of the same length and copies the content.


    We can use it to pre-fill the array with data:


    ```

    let arr = new Uint8Array([0, 1, 2, 3]);

    alert(arr.length); // 4, created binary array of the same length

    alert(arr[1]); // 1, filled with 4 bytes (unsigned 8-bit integers) with given

