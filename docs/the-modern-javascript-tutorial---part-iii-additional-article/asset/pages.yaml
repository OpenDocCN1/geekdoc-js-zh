    # De Casteljau''s algorithm of building the 3-point bezier curve:


    +   1. Draw control points. In the demo above they are labeled: 1, 2, 3.


    +   2. Build segments between control points $1 \rightarrow 2 \rightarrow 3$.
    In the demo above they are brown.


    +   3. The parameter $t$ moves from $0$ to $1$. In the example above the step
    $0.05$ is used: the loop goes over $0, 0.05, 0.1, 0.15, \dots, 0.95, 1$.


    For each of these values of $t$:


    +   On each brown segment we take a point located on the distance proportional
    to $t$ from its beginning. As there are two segments, we have two points.


    +   For instance, for $t=0$ - both points will be at the beginning of segments,
    and for $t=0.25$ - on the $25\%$ of segment length from the beginning, for $t=0.5$
    - $50\%$(the middle), for $t=1$ - in the end of segments.


    +   Connect the points. On the picture below the connecting segment is painted
    blue.


    For $t=0.25$ / For $t=0.5$'
