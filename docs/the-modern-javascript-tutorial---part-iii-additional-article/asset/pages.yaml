    http://site.com instead of http://site/path.

    **origin-when-cross-origin** – send full Referer to the same origin, but only
    the path for cross-origin requests (as above).

    **same-origin** – send full Referer to the same origin, but no referer for cross-origin
    requests.

    **strict-origin** – send only origin, don''t send Referer for HTTPS → HTTP requests.

    **strict-origin-when-cross-origin** – for same-origin send full url, for cross-origin
    send only origin, unless it''s HTTPS → HTTP request, then nothing sending.

    **unsafe-url** – always send full url in Referer, even for HTTPS → HTTP requests.


