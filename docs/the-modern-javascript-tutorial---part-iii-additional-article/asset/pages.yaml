  md: 'An object store is a core concept of IndexedDB. Counterparts in other databases
    are called "tables" or "collections". It''s where the data is stored. A database
    may have multiple stores: for one users, another for goods, etc.


    Despite being named an "object store", primitives can be stored too.


    # We can store almost any value, including complex objects.


    IndexedDB uses the standard serialization algorithm to clone-and-store an object.
    It''s like JSON.stringify, but more powerful, capable of storing much more datatypes.


    An example of object that can''t be stored: object with circular references. Such
    objects are not serializable. JSON.stringify fails for such objects.


    # There must be a unique key for every value in the store.


    A key must have a type of one: number, date, string, binary, or array. It''s an
    identifier: we can search/remove/update values by the key.


