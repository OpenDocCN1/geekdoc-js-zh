  md: '# Frames and windows

    Popups and window methods


    A popup window is one of the oldest methods to show additional document to user.

    Basically, you just run:


    ```

    window.open(''https://javascript.info/'')

    ```


    ...And it will open a new window with given URL. Most modern browsers are configured
    to open new tabs instead of separate windows.

    Popups exist from really ancient times. The initial idea was to show another independent
    content without closing the main window. As of now, there are other ways to do
    that: we can load content dynamically with fetch and show it in a dynamically
    generated <div>. So, popups are not something we use everyday.


    Also, popups are tricky on mobile devices, that don''t show multiple windows simultaneously.


    Still, there are tasks where popups are still used, e.g. for OAuth authorization
    (login with Google/Facebook/...), because:


    +   1. A popup is a separate window with its own independent JavaScript environment.

    So opening a popup with a third-party non-trusted site is safe.

    2. It''s very easy to open a popup.

    3. A popup can navigate (change URL) and send messages to the opener window.


    # Popup blocking


    In the past, evil sites abused popups a lot. A bad page could open tons of popup
    windows with ads. Now most browsers try to block popups and protect the user.


    Most browsers block popups if they are called outside of user-triggered event
    handlers like onclick.


    For example:


    ```

    // popup blocked

    window.open(''https://javascript.info/'');


    // popup allowed

    button.onclick = () => {

    window.open(''https://javascript.info/'');

    };

    ```'
