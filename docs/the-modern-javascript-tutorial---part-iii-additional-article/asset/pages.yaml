  md: 'We already saw a similar thing – square brackets. They allow to choose between
    multiple characters, for instance gr[ae]y matches gray or grey.


    Square brackets allow only characters or character sets. Alternation allows any
    expressions. A regexp A|B|C means one of expressions A, B or C.


    For instance:


    +   - gr(a|e)y means exactly the same as gr[ae]y.

    - gra|ey means gra or ey.


    To application to a chosen part of the pattern, we can enclose it in parentheses:


    +   - I love HTML|CSS matches I love HTML or CSS.

    - I love (HTML|CSS) matches I love HTML or I love CSS.


    # Example: regexp for time


    In previous articles there was a task to build a regexp for searching time in
    the hh:mm, for instance 12:00. But a simple \d\:\d\d is too vague. It accepts
    25:99 for the time (as 99 seconds match the pattern, but that time is invalid).


    How can we make a better pattern?


    We can use more careful matching. First, the hours:


    +   - If the first digit is 0 or 1, then the next digit can be any: [01]\d.

    - Otherwise, if the first digit is 2, then the next digit must be [0-3].

    - (no other first digit is allowed)


    We can write both variants in a regexp using: [01]\d|2[0-3].


    Next, minutes must be from 00 to 59. In the regular expression language that can
    be written as [0-5]\d: the first digit 0-5, and then any digit.


    If we glue minutes and seconds, we get the pattern: [01]\d|2[0-3]:[0-5]\d.


    We''re almost done, but there''s a problem. The alternation | now happens to be
    between [01]\d and 2[0-3]:[0-5]\d.


    That is: minutes are added to the second alternation variant, here''s a clear
    picture:


    ```

    [01]\d | 2[0-3]:[0-5]\d

    ```'
