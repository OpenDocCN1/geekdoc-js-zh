  md: 'When the `iframe` tries to change `top.location`, the visitor gets a message
    asking them whether they want to leave.


    In most cases the visitor would answer negatively because they don''t know about
    the iframe — all they see is the top page, there''s no reason to leave. So `top.location`
    won''t change!


    In action:


    https://plnkr.co/edit/WCEMui3PmW1klyyyf6FH?p=preview


    # Sandbox attribute


    One of the restricted by the `sandbox` attribute is navigation. A sandboxed iframe
    may not change `top.location`.


    So we can allow the iframe with `sandbox="allow-scripts allow-forms"`. That would
    relax the restrictions, permitting scripts and forms. But we omit `allow-top-navigation`
    so that changing `top.location` is forbidden.


    Here''s the code:


    ```

    <iframe sandbox="allow-scripts allow-forms" src="facebook.html"></iframe>

    ```


    There are other ways to work around that simple protection too.


    # X-Frame-Options


    The server-side header `X-Frame-Options` can permit or forbid displaying the page
    inside a frame.


    It must be sent as HTTP-header: the browser will ignore it if found in HTML `<meta>`
    tag. So, `<meta http-equiv="X-Frame-Options"...>` won''t do anything.


    The header may have 3 values:


    DENY


    Never ever show the page inside a frame.


    SAMEORIGIN


    Allow inside a frame if the parent document comes from the same origin.


    ALLOW-FROM domain


    Allow inside a frame if the parent document is from the given domain.


    For instance, Twitter uses X-Frame-Options: SAMEORIGIN.'
