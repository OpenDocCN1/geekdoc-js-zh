    at position 4.

    Imagine, we have a long text, and there are no matches in, at all. Then searching
    with flag g will go to the end of the text, and this will take significantly more
    time than the search with flag y.

    In such tasks lexical analysis, there are usually many searches at an exact position.
    Using flag y is the key for a good performance.'
