  md: 'This way users are somewhat protected from unwanted popups, but the functionality
    is not disabled totally.


    What if the popup opens from onclick, but after setTimeout ? That''s a bit tricky.


    Try this code:


    ```

    // open after 3 seconds

    setTimeout(() => window.open(''http://google.com''), 3000);

    ```


    The popup opens in Chrome, but gets blocked in Firefox.


    ...If we decrease the delay, the popup works in Firefox too:


    ```

    // open after 1 seconds

    setTimeout(() => window.open(''http://google.com''), 1000);

    ```


    The difference is that Firefox treats a timeout of 2000ms or less are acceptable,
    but after it - removes the "trust", assuming that it''s "outside of the user action".
    So the first one is blocked, and the second one is not.


    # window.open


    The syntax to open a popup is window.open(url, name, params):


    url


    An URL to load into the new window.


    name


    A name of the new window. Each window has a window.name, and here we specify which
    window to use for the popup. If there''s already a window with such name – the
    given URL opens in it, otherwise a new window is opened.


    params


    The configuration string for the new window. It contains settings, delimited by
    a comma. There must be no spaces in params, for instance: width:200, height=100.


    Settings for params :


    +   * Position:'
