    # new RegExp


    If we are creating a regular expression with new RegExp , then we don''t have
    to escape / , but need to do some other escaping.


    For instance,


    ```

    let regexp = new RegExp("\d.\d");

    alert("Chapter 5.1".match(regexp)); // null

    ```


    The similar search in one of previous examples worked with /\d.\d/, but new RegExp("\d.\d")
    doesn''t work, why?


    The reason is that backslashes are "consumed" by a string. As we may recall, regular
    strings have their own special characters, such as \n , and a backslash is used
    for escaping.


    Here''s how “\d.\d” is preceived:


    ```

    alert("\d.\d"); // d.d

    ```


    String quotes "consume" backslashes and interpret them on their own, for instance:


    +   - \n becomes a newline character,

    - \u1234 becomes the Unicode character with such code,

    - ...And when there''s no special meaning: like \d or \z, then the backslash is
    simply removed.


    So new RegExp gets a string without backslashes. That''s why the search doesn''t
    work!'
