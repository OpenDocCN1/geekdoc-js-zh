    # Ranges


    Square brackets may also contain character ranges.


    For instance, [a-z] is a character in range from a to z, and [0-5] is a digit
    from 0 to 5.


    In the example below we''re searching for "x" followed by two digits or letters
    from A to F:


    ```

    alert("Exception 0xAF".match(/x[0-9A-F][0-9A-F]/g)); // xAF

    ```


    Here has two ranges: it searches for a character that is either a digit from 0
    to 9 or a letter from A to F.


    If we''d like to for lowercase letters as, we can add the range a-f: [0-9A-Fa-f].
    Or add the flag i.


    We can also use character classes inside [...].


    For instance, if we''d like to look for a word character \w or a hyphen -, then
    the set is [\w].


    Combining multiple classes is also possible, e.g. [\s\d] means "a space character
    or a digit".


    > Character classes are shorthands for certain character sets

    For instance:

    - \d — is the same as [0-9]

    - \w — is the same as [a-zA-Z0-9_]

    - \s — is the same as [\t\n\f\r], plus few other rare unicode characters.


    Example: multi-language \w

    As the character class \w is a shorthand for [a-zA-Z0-9_], it can''t find Chinese
    hieroglyphs, Cyrillic letters, etc.'
