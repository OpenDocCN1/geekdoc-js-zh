  md: 'Here''s what a search for a slash ''/'' looks like:


    ```

    alert("/.match(/\/)); // ''/''

    ```


    On the other hand, if we''re not using / . . . /, but create a regexp using new
    RegExp , then we don''t need to escape it:


    ```

    alert("/.match(new RegExp("/\)); // finds /

