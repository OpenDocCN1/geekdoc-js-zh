    \ It's like HTTPS for websockets.\n\n+   Always prefer wss://\n\nThe wss:// protocol\
    \ not only encrypted, but also more reliable.\nThat's because ws:// data is not\
    \ encrypted, visible for any intermediary. Old proxy servers do not know about\
    \ WebSocket, they may see \"strange\" headers and abort the connection.\n\nOn\
    \ the other hand, wss:// is WebSocket over TLS (same as HTTPS is over TLS), the\
    \ transport security layer encrypts the data at sender and decrypts at the receiver.\
    \ So data packets are passed encrypted through proxies. They can't see what's\
    \ inside and let them through.\n\nOnce the socket is created, we should listen\
    \ to events on it. There are totally 4 events:\n\n+   - open — connection established,\n\
    - message — data received,\n- error — websocket error,\n- close — connection closed.\n\
    \nAnd if we'd like to send something, socket.send(data) will do that.\nHere's\
    \ an example:\n\n```\nlet socket = new WebSocket(\"wss://javascript.info/article/websocket/demo/hello\"\
    );\n\nsocket.onopen = function() {\n  alert(`[open] Connection established`);\\\
    n  alert(`Sending to server`);\\n  socket send(\"My name is John\");\n};\n\nsocket.onmessage\
    \ = function(event) {\n  alert(`[message] Data received from server: ${event.data}\\\
    `);\n};\n```"
