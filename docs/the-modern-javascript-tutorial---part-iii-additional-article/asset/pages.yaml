    \ `XMLHttpRequest`.\n\n# Not-so-usual progress event\n\nTo resume upload, we need\
    \ to know how much was uploaded till the connection was lost.\n\nThere's `xhr.upload.onprogress`\
    \ to track upload progress.\n\nUnfortunately, it won't help us to resume the upload\
    \ here, as it triggers when the data is `sent`, but it is received by the server?\
    \ The browser doesn't know.\n\nMaybe it be buffered by a local network proxy,\
    \ or the remote server process just deied and couldn't process them, or if it\
    \ was just in the middle and didn't reach the receiver.\n\nThat's why this event\
    \ is only useful to show a nice progress bar.\n\nTo resume upload, we need to\
    \ know `exactly` the number of bytes received by the server. And only the server\
    \ can tell, so we'll make an additional request.\n\n# Algorithm\n\n+   1. First,\
    \ create a file id, to uniquely identify the file we're going to upload:\n\n```\n\
    let fileId = file.name + '-' + file.size + '-' + file.lastModifiedDate;\n```\n\
    \nThat's needed for resume upload, to tell the server what're resuming.\nIf the\
    \ name or the size or the last modification date changes, there'll be another\
    \ `fileId`.\n\n2. Send a request to the server, asking how many bytes it already\
    \ has, like this:\n\n```\nlet response = await fetch('status', {\n  headers: {\n\
    \    'X-File-Id': fileId\n  }\n});\n\n// The server has that many bytes\nlet startByte\
    \ = await response.text();\n```"
