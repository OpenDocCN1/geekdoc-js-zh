- img_proc: true
  md: 'URL.createObjectURL takes a Blob and creates a unique URL for it, in the form
    blob:<origin>/<uuid>.


    That''s what the value of link.href looks like:


    ```

    blob:https://javascript.info/1e67e0e-e86d-40a5-89ae-6ab0c62273

    ```


    The browser for each URL generated by URL.createObjectURL stores the URL → Blob
    mapping internally. Such URLs are short, but allow to access the Blob.


    A generated URL (and hence the link with it) is only valid within the current
    document, while it''s open. And it allows to reference the Blob in <img>, <a>,
    basically any other object that expects an url.


    There''s a side-effect though. While a Blob, the Blob itself resides in the memory.
    The browser can''t free it.


    The mapping is automatically cleared on document unload, so Blob objects are freed.
    But if an app is long-lived, then that doesn''t happen soon.


    If we create a URL, that Blob will hang in memory, even if not needed anymore.


    URL.revokeObjectURL(url) removes the reference from the internal mapping, allowing
    the Blob to be deleted (if there are no other references), and the memory to be
    freed.


    In the last example, we intend the Blob to be used only once, for instant downloading,
    so we call URL.revokeObjectURL(link.href) immediately.


    In the previous example with the clickable HTML-link, we don''t call URL.revokeObjectURL(link.href),
    because that would make the Blob url invalid. After the revocation, the mapping
    is removed, the URL doesn''t work more.


    # Blob to base64


    An alternative to URL.createObjectURL is to convert a Blob into a base64-encoded
    string.


    That encoding represents binary data as a string of ultra-safe "readable" characters
    with ASCII-codes from 0 to 60. What is more important — we can use this encoding
    in "data-urls".


    A data url has the form data:[<mediatype>];[base64,<data>. We use such urls everywhere,
    on par with “regular" urls.'
