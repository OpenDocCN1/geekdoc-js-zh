    \nBut then there's a problem. Everything the visitor types will be hidden, because\
    \ the iframe is not visible.\n\nPeople will usually stop typing when they can't\
    \ see their new characters printing on the screen.\n\n# Old-school defences (weak)\n\
    \nThe oldest defence is a bit of JavaScript which forbids opening the page in\
