    let arr8 = new Uint8Array(arr16);

    alert(arr8[0]); // 1

    alert(arr8[1]); // 232, tried to copy 1000, but can''t fit 1000 into 8 bits (exp

    ```


    +   4. For a numeric length – creates the typed array to contain that many elements.
