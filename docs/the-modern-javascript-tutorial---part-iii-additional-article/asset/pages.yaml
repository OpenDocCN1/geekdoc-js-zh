  md: "• slotted elements and their contents (as that's also in the outer document)\n\
    \nWhen CSS properties conflict, normally document styles have precedence, unless\
    \ the property is labelled as `!important`. Then local styles have precedence.\n\
    \nCSS custom properties pierce through shadow DOM. They are used as \"hooks\"\
    \ to style the component:\n\n+   1. The component uses a custom CSS property to\
    \ style key elements, such as `var(--component-name-title, <default value>)`.\n\
    \n+   2. Component author publishes these properties for developers, they are\
    \ the same important as other public component methods.\n\n+   3. When a developer\
    \ wants to style a title, they assign `--component-name-title` CSS property for\
    \ the shadow host or above.\n\n+   4. Profit!\n\n# Shadow DOM and events\n\nThe\
    \ idea behind shadow tree is to encapsulate internal implementation details of\
    \ a component.\n\nLet's say, a click event happens inside a shadow DOM of `<user-card>`\
    \ component. But scripts in the main document have no idea about the shadow DOM\
    \ internals, especially if the component comes from a 3rd-party library.\n\nSo,\
    \ to keep the details encapsulated, the browser `retargets` the event.\n\nEvents\
    \ that happen in shadow DOM have the host element as the target, when caught outside\
    \ of the component.\n\nHere's a simple example:\n\n```\n<user-card></user-card>\n\
    \n<script>\ncustomElements define('user-card', class extends HTMLElement {\n \
    \ connectedCallback() {\n    this.attachShadow({mode: 'open'});\n    this.shadowRoot.innerHTML\
    \ = `<p>\n    <button>Click me</button>\n  </p>`;n    this.shadowRoot.firstChild.onclick\
    \ = \n      e => alert(\"Inner target: \" + e.target.tagName);\n  }\n});\n\ndocument.onclick\
    \ = \n  e => alert(\"Outer target: \" + e.target.tagName);\n</script>\n```"
  merge: -1
  pgno: 231
- img_proc: true
  md: "If you click on the button, the messages are:\n\n+   1. Inner target: BUTTON\
    \ – internal event handler gets the correct target, the element inside shadow\
    \ DOM.\n\n+   2. Outer target: USER-CARD – document event handler gets shadow\
    \ host as the target.\n\nEvent retargeting is a great thing to have, because the\
    \ outer document doesn't have to know about component internals. From its point\
    \ of view, the event happened on `<user-card>`.\n\nRetargeting does not occur\
    \ if the event occurs on a slotted element, that physically lives in the light\
    \ DOM.\n\nFor example, if a user clicks on `<span slot=\"username\">` in the example\
    \ below, the event target is exactly this `span` element, for both shadow and\
    \ light handlers:\n\n```\n<user-card id=\"userCard\">\n  <span slot=\"username\"\
    >John Smith</span>\n</user-card>\n```\n\n```\n<script>\ncustomElements.define('user-card',\
    \ class extends HTMLElement {\n  connectedCallback() {\n    this.attachShadow({mode:\
    \ 'open'});\n    this.shadowRoot.innerHTML = `<div>\n    <b>Name:</b<slot name=\"\
    username\"></slot>\n  </div>`;\n\n    this.shadowRoot.firstChild.onclick =\n \
    \     e => alert(\"Inner target: \" + e.target.tagName);\n  }\n});\n\nuserCard.onclick\
    \ = e => alert(`Outer target: ${e.target.tagName}\\`);\n</script>\n```\n\nJohn\
    \ Smith\n\nIf a click happens on \"John Smith\", for both inner and outer handlers\
    \ the target is `<span slot=\"username\">`. That's an element from the light DOM,\
    \ so no"
  merge: -1
  pgno: 232
- img_proc: true
  md: "retargeting.\n\nOn the other hand, if the click occurs on an element originating\
    \ from shadow DOM, e.g. on <b>Name</b>, then, as it bubbles out of the shadow\
    \ DOM, `event.target` is reset to `<user-card>`.\n\n# Bubbling, event.composedPath()\n\
    \nFor purposes of event bubbling, flattened DOM is used.\n\nSo, if we have a slotted\
    \ element, and an event occurs somewhere inside it, then it bubbles up to the\
    \ `<slot>` and upwards.\n\nThe full path to the original event target, with all\
    \ the shadow elements, can be obtained using `event.composedPath()` . As we can\
    \ see from the name of the method, that path is taken after the composition.\n\
    \nIn the example below, the flattened DOM is:\n\n```\n<user-card id=\"userCard\"\
    >\n#shadow-root\n  <div>\n    <b>Name:</b>\n    <slot name=\"username\">\n   \
    \   <span slot=\"username\">John Smith</span>\n    </slot>\n  </div>\n</user-card>\n\
    ```\n\nSo, for a click on <span slot=\"username\">, `event.composedPath()` returns\
    \ an array: [span, slot, div, shadow-root, user-card, body, html, document, window].\
    \ That's exactly the parent chain in the flattened DOM, after the composition.\n\
    \n> Shadow tree details are only provided for {mode: 'open'} trees\n\nIf the shadow\
    \ tree was created with {mode: 'closed'}, then the composed path starts from the\
    \ host: `user-card` and upwards.\n\nThat's the similar principle for other methods\
    \ that work with shadow DOM. Internals of closed trees are completely hidden.\n\
