    # Scrolling and resizing


    There are methods to move/resize a window:


    win.moveBy(x,y)


    Move the window relative to current position x pixels to the right and y pixels
    down. Negative values are allowed (to move left/up).


    win.moveTo(x,y)


    Move the window to coordinates (x,y) on the screen.


    win.resizeBy(width, height)


    Resize the window by given width/height relative to the current size. Negative
    values are allowed.


    win.resizeTo(width, height)


    Resize the window to the given size.


    There''s also window.onresize event.


    > **Only popups**\To prevent abuse, the browser usually blocks these methods.
    They only work reliably on popups that we opened, have no additional tabs.


    > **No minification/maximization**

    JavaScript has no way to minimize or maximize a window. These OS-level functions
    are hidden from Frontend-developers.

    Move/resize methods do not work for maximized/minimized windows.


    # Scrolling a window


    We already talked about scrolling a window in the chapter Window sizes and scrolling.


    win.scrollBy(x,y)


    Scroll the window x pixels right and y down relative to the current scroll. Negative
    values are allowed.'
