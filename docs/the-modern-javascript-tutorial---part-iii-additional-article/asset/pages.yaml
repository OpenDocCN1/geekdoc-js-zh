  md: "```\n// Step 2: get total length\nconst contentLength = response.headers.get('Content-Length');\n\
    \n// Step 3: read the data\nlet receivedLength = 0; // received many bytes at\
    \ the moment\nlet chunks = []; // array of received binary chunks (comprises the\
    \ body)\nwhile (true) {\n  const (done, value) = await reader.read();\n\n  if\
    \ (done) {\n    break;\n  }\n\n  chunks push(value);\n  receivedLength += value\
    \ length;\n}\nconsole.log(`Received ${receivedLength} of ${contentLength}\\`);\n\
    \n// Step 4: concatenate chunks into single Uint8Array\nlet chunksAll = new Uint8Array(receivedLength);\
    \ // (4.1)\nlet position = 0;\nfor(let chunk of chunks) {\n  chunksAll.set(chunk,\
    \ position); // (4.2)\n  position += chunk.length;\n}\n\n// Step 5: decode into\
    \ a string\nlet result = new Decoder(\"utf-8\").decode(chunksAll);\n\n// We're\
    \ done!\nlet commits = JSON.parse(result);\nalert(commits[0].author.login);\n\
    ```\n\nWe explain that step-by-step:\nWe prefer fetch as as usual, but instead\
    \ of calling response.json(), we obtain a stream reader response.body.getReader().\n\
    \nPlease note, we can't use both methods to read the same response: either use\
    \ a reader or a response method to get the result.\n\nPrior to reading, we can\
    \ figure out the full response length from the Content-Length header.\n\nIt may\
    \ be absent for cross-origin requests (see chapter Fetch: Cross-Origin Requests)\
    \ and, well, technically a server doesn't have to set it. But usually it's at\
    \ place.\n\nCall await reader.read() until it's done."
