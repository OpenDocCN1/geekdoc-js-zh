    - click, dblclick,

    - mousedown, mouse, mousemove, mouseout, mouseover,

    - wheel,

    - beforeinput, input, keydown, keyup.


    All touch events and pointer events also have `composed: true`.


    There are some events that have `composed: false` though:


    +   - mouseenter, mouseleave (they do not bubble at all),

    - load, unload, abort, error,

    - select,

    - slotchange.


    These events can be caught only on elements within the same DOM, where the event
    target resides.


    # Custom events


    When we dispatch custom events, we need to set both `bubbles` and `composed` properties
    to `true` to bubble up and out of the component.


