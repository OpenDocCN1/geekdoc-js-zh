- img_proc: true
  md: "Open a sandbox for the task.\n\nTo solution\n\n# JavaScript animations\n\n\
    JavaScript animations can handle things that CSS can’t.\n\nFor instance, moving\
    \ along a complex path, with a timing function different from Bezier curves, or\
    \ an animation on a canvas.\n\n# Using setInterval\n\nAn animation can be implemented\
    \ as a sequence of frames – usually small changes to HTML/CSS properties.\n\n\
    For instance, changing style.left from 0px to 100px moves the element. And if\
    \ we increase it in setInterval, changing by 2px with a tiny delay, like 50 times\
    \ per second, then it looks smooth. That’s the same principle as in the cinema:\
    \ 24 frames per second is enough to make it smooth.\n\nThe pseudo-code can look\
    \ like this:\n\n```\nlet timer = setInterval(function() {\n  if (animation complete)\
    \ clearInterval(timer);\n  else increase style.left by 2px\n}, 20); // change\
    \ by 2px every 20ms, about 50 frames per second\n```\n\nMore complete example\
    \ of the animation:\n\n```\nlet start = Date.now(); // remember start time\n\n\
    let timer = setInterval(function() {\n  // how much time passed from the start?\n\
    \  let timePassed = Date.now() - start;\n\n  if (timePassed >= 2000) {\n    clearInterval(timer);\
    \ // finish the animation after 2 seconds\n    return;\n  }\n\n  // draw the animation\
    \ at the moment timePassed\n  draw(timePassed);\n}, 20);\n```"
  merge: -1
  pgno: 179
- img_proc: true
  md: "```\n// as timePassed goes from 0 to 2000\n// left gets values from 0px to\
    \ 400px\nfunction draw(timePassed) {\n  train.style.left = timePassed / 5 + 'px';\n\
    }\n```\n\nClick for the demo:\n\nhttps://plnkr.co/edit/rah4vue9bwmrtS3ASkKt?p=preview\n\
    \n# Using requestAnimationFrame\n\nLet's imagine we have several animations running\
    \ simultaneously.,\n\nIf we run them separately, even though each one has setInterval(...,20),\
    \ then the browser would have to repaint more often than every 20ms.\n\nThat's\
    \ because they have different starting time, so \"every 20ms\" differs between\
    \ different animations. The intervals are not aligned. So we'll have several independent\
    \ runs within 20ms.\n\nIn other words,\n\n```\nsetInterval(function() {\nanimate1();\n\
    animate2();\nanimate3();\n}, 20)\n```\n\n...lighter than three independent calls:\n\
    \n```\nsetInterval(animate1, 20); // independent animations\nsetInterval(animate2,\
    \ 20); // in different places of the script\nsetInterval(animate3, 20);\n```\n\
    \nThese several redraws should be grouped together, to make the redraw easier\
    \ for the browser and hence load less CPU load and smoother.\n\nThere's one more\
    \ thing to keep in mind. Sometimes when CPU is overloaded, or there are other\
    \ reasons to redraw less often (like when the browser tab is hidden), we really\
    \ shouldn't run it every 20ms.\n\nBut how we know about in JavaScript? There's\
    \ a specification Animation timing that provides the function requestAnimationFrame.\
    \ It addresses all these issues and even more."
  merge: -1
  pgno: 180
- img_proc: true
  md: "The syntax:\n\n```\nlet requestId = requestAnimationFrame(callback)\n```\n\n\
    That schedules the callback function to run in the closest time when the browser\
    \ wants to do animation.\nIf we do changes in elements in callback then they will\
    \ be grouped together with other requestAnimationFrame callbacks and with CSS\
    \ animations. So there will be one geometry recalculation and repaint instead\
    \ of many.\nThe returned value requestId can be used to cancel the call:\n\n```\n\
    // cancel the scheduled execution of callback\ncancelAnimationFrame(requestId);\n\
    ```\n\nThe callback gets one argument – the time passed from the beginning of\
    \ the page load in milliseconds. This time can also be obtained by calling performance.now().\n\
    Usually callback runs very soon, unless the CPU is overloaded or the laptop battery\
    \ is discharged, or there's another reason.\nThe code below shows the time between\
    \ first 10 runs for requestAnimationFrame. Usually it's 10-20ms:\n\n```\n<script>\n\
    let prev = performance.now();\nlet times = 0;\n\nrequestAnimationFrame(function\
    \ measure(time) {\n  document body.insertAdjacentHTML(\"beforeEnd\", Math.floor(time\
    \ - prev) + \"\");\n  prev = time;\n\n  if (times++ < 10) requestAnimationFrame(measure);\n\
    })\n</script>\n```\n\n# Structured animation\n\nNow we can make a more universal\
    \ animation function based on requestAnimationFrame:"
  merge: -1
  pgno: 181
- img_proc: true
  md: "```\nfunction animate({timing, draw, duration}) {\n  let start = performance.now();\n\
    \n  requestAnimationFrame(function animate(time) {\n    // timeFraction goes from\
    \ 0 to 1\n    let timeFraction = (time - start) / duration;\n    if (timeFraction\
    \ > 1) timeFraction = 1;\n\n    // calculate the current animation state\n   \
    \ let progress = timing(timeFraction);\n\n    draw(progress); // draw it\n\n \
    \   if (timeFraction < 1) {\n      requestAnimationFrame(animate);\n    }\n  });\n\
    }\n```\n\nFunction `animate` accepts 3 parameters that essentially describes the\
    \ animation:\n\n`duration`\n\nTotal time of animation. Like, `1000`.\n\nTiming\
    \ function, like CSS-property `transition-timing-function` that gets the fraction\
    \ of time that passed (0 at start, 1 at the end) and returns the animation completion\
    \ (like `y` on the Bezier curve).\n\nFor instance, a linear function means that\
    \ the animation goes on uniformly with the same speed:\n\n```\nfunction linear(timeFraction)\
    \ {\n  return timeFraction;\n}\n```"
