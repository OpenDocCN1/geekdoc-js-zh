  md: 'Usually, if an element has shadow DOM, then its light DOM is not displayed.
    Slots allow to show elements from light DOM in specified places of shadow DOM.


    There are two kinds of slots:


    +   - Named slots: <slot name="X">...</slot> – gets light children with slot="X".

    - Default slot: the first <slot> without a name (subsequent unnamed slots are
    ignored) – gets unloaded light children.

    - If there are many elements for the same slot – they are appended one after another.

    - The content of <slot> element is used as a fallback. It''s shown if there are
    no light children for the slot.


    The process of rendering slotted elements inside their slots is called “composition”.
    The result is called “flattened DOM”.


    Composition does not really moves nodes, from JavaScript point view of the DOM
    is still same.


    JavaScript can access slots using methods:


    +   - slot.assignedNodes/Elements() – returns nodes/elements inside the slot.

    - node.assignedSlot – the reverse method, returns slot by a node.


    If we like to know what we''re showing, we can track slot contents using:


    +   - slotchange event – triggers the first time a slot is filled, and on any
    add/remove operation of the slotted element, but not its children. The slot is
    event.target.

    - MutationObserver to go deeper into slot content, watch changes inside it.


    As, as we know how to show elements from light DOM in shadow DOM, let''s see how
    to style them property. The basic rule is that shadow elements are styled inline,
    and light elements – outside, but there are notable exceptions.


    We''ll see the details in the next chapter.


    # Shadow DOM styling


    Shadow DOM may include <style> and <link rel="stylesheet" href="..."> tags. In
    the latter case, stylesheets are HTTP-cached, so they are not reloaded for multiple
    components that use the same template.


    As a general rule, local styles work only inside the shadow tree, and document
    styles work outside of it. But there are few exceptions.'
