- img_proc: true
  md: "In the example below the animation code:\n\n```\n.train {\n  left: 100px;\n\
    \  transition: 5s cubic-bezier(.5, -1, .5, 2);\n  /* JavaScript sets left to 400px\
    \ */\n}\n```\n\nThe property left should animate from 100px to 400px.\n\nBut if\
    \ you click the train, you'll see that:\n\n+   - First, the train goes back: left\
    \ becomes less than 100px.\n- Then it goes forward, a little bit farther than\
    \ 400px.\n- And then back again – to 400px.\n\nhttps://plinkr.co/edit/TJgcacdDDsFyYHb4Lnl?p=preview\
    \ \",\n\nWhy it happens – pretty obvious if we look at the graph of the given\
    \ Bezier curve:\n\n![](img/10702f89b72e44092576c4bcf72121f3_171_0.png)\n\nWe moved\
    \ the y coordinate of the 2nd point below zero, and for the 3rd point we made\
    \ put it over 1, so the curve goes out of the \"regular\" quadrant. The y is out\
    \ of the \"standard\" range 0..1.\n\nAs we know, y measures the \"completion of\
    \ the animation process\". The value y = 0 corresponds to the starting property\
    \ value and y = 1 – the ending value. Values y<0 move the property later than\
    \ the starting left and y>1 – over the final left. \n\nThat's a \"soft\" variant\
    \ for sure. If we put y values like -99 and 99 then the train would jump out of\
    \ the range much more."
