  md: 'We can use the contents of capturing groups (...) not only in the result or
    in the replacement string, but also in the pattern itself.


    # Backreference by number: \N


    A group can be referenced in the pattern using \N, where N is the group number.
    To make clear why''s helpful, let''s consider a task.


    We need to find quoted strings: single-quoted ''...'' or a double-quoted "..."
    – both variants should match.


    How to find them?


    We can put both kinds of quotes in the square brackets: [''"](.*?)[''''], but
    would find strings with mixed quotes, like ''...'' and "...". That would lead
    to incorrect matches when one quote appears inside other ones, like in the string
    "She''s the one!",


    ```

    let str = `He said: "She''s the one!\`;

    let regexp = /[''"](.+?)[''\'']/g;

    // The result is not what we''d like to have

    alert(str.match(regexp)); // "She"

    ```


    As we can see, the pattern found an opening quote " , then the text is consumed
    the other quote '', which closes the match.


    To make sure the pattern looks for the closing quote exactly the same as the opening
    quote, we can wrap it into a capturing group and backreference it: ([''"])(.*?)\1


    Here''s the code:


    ```

    let str = `He said: "She''s the one!\`;

    let regexp = /([''"])(.+?)\1/g;

    alert(str.match(regexp)); // "She''s the one!"

    ```


    Now it works! The regular expression engine finds the first quote [''"] and memorizes
    its content. That''s the first capturing group.


    Further in the pattern \1 means "find the same text as in the first group", exactly
    the same quote in our case.'
