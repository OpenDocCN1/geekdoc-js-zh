  md: 'Blob objects are immutable

    We can''t change data directly in a Blob, but we can slice parts of a Blob ,

    create new Blob objects from them, mix them into a new Blob and so on.

    This behavior is similar to JavaScript strings: we can''t change a character in
    a

    string, but we can make new corrected string.


    # Blob as URL


    A Blob can be easily used as an URL for <a>, <img> or other tags, to show its

    contents.


    Thanks to type, we can also download/upload Blob objects, and the type

    naturally becomes Content-Type in network requests.


    Let''s start with a simple example. By clicking on a link you download a dynamically-generated
    Blob with hello world contents as a file:


    ```

    <!-- download attribute forces the browser to download instead of navigating -->

    <a download="hello.txt" href="#" id="link">Download</a>


    <script>

    let blob = new Blob(["Hello, world!"], {type: ''text/plain''});


    link.href = URL.createObjectURL(blob);

    </script>

    ```


    We can also create a link dynamically in JavaScript and simulate a click by\link.click(),
    then download starts automatically.


    Here''s the similar code that allows user to download the dynamicallyll created

    Blob, without any HTML:


    ```

    let link = document.createElement(''a'');

    link.download = ''hello.txt'';


    let blob = new Blob([''Hello, world!''], {type: ''text/plain''});


    link.href = URL.createObjectURL(blob);


    link.click();


    URL.revokeObjectURL(link.href);

    ```'
