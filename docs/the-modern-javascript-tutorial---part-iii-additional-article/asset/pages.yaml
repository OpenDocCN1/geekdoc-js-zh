  md: 'In old times, before URL objects appeared, people used strings for URLs.


    As of now, URL objects are often more convenient, but strings can still be used
    as well. In many cases using a string makes the code much shorter.


    If we use a string though, we need to encode/decode special characters manually.

    There are built-in functions for that:


    +   - encodeURI – encodes URL as a whole.

    - decodeURI – decodes it back.

    - encodeURIComponent – encodes a URL component, such as a search parameter, or
    a hash, or a pathname.

    - decodeURIComponent – decodes it back.


    A natural question is: “What''s the difference between encodeURIComponent and
    encodeURI? When should we use either?


    That''s easy to understand if we look at the URL, that''s split into components
    in the picture above:


    ```

    https://site.com:8080/path/page?p1=v1&p2=v2#hash

    ```


    As we can see, characters such as: ?, =, &, # are allowed in URL.


    ...On the other hand, if we look at a single URL component, such as a search parameter,
    these characters must be encoded, not to break the formatting.


    +   - encodeURI encodes only characters that are totally forbidden in URL.

    - encodeURIComponent encodes same characters, and, in addition to them, characters
    #, $, &, +, /, :,, ;, =, ?, ? and @.


    So, for a URL we can use encodeURI:


    ```

    // using cyrillic characters in url path

    let url = encodeURI(''http://site.com/%D0%BF%D1%80%D0%B8%D0%B2%D0%B5%D1%82'');


    alert(url); // http://site.com/%D0%BF%D1%80%D0%B8%D0%B2%D0%B5%D1%82

    ```


    ...For parameters we should use encodeURIComponent instead:


    ```

    let music = encodeURIComponent(''Rock&Roll'');

    ```'
  merge: -1
