- img_proc: true
  md: 'Usually, we should set `path` to the root: `path/` to make the cookie accessible
    from all website pages.


    # domain


    +   - `domain=site.com`


    A domain where the cookie is accessible. In practice though, there are limitations.
    We can''t set any domain.


    By default, a cookie is accessible only at the domain that set it. So, if the
    cookie was set by `site.com`, we won''t get it `other.com`.


    ...But what''s more tricky, we also won''t get the cookie at a subdomain `forum.site.com!`


    ```

    // at site.com

    document.cookie = "user=John"


    // at forum.site.com

    alert(document.cookie); // no user

    ```


    There''s no way to let a cookie be accessible from another 2nd-level domain, `other.com`
    will never receive a cookie set at `site.com`.


    It''s a safety restriction, to allow us to store sensitive data in cookies, that
    should be available only on one site.


    ...But if we''d like to allow subdomains like `forum.site.com` get a cookie, that''s
    possible. When setting a cookie at `site.com`, we should explicitly set `domain`
    to the root domain: `domain=site.com:`


    ```

    // at site.com

    // make the cookie accessible on any subdomain *.site.com:

    document.cookie = "user=John; domain=site.com"

    ```


    // later


    // forum.site.com


    // at forum.site.com

    alert(document.cookie); // has cookie user=John


    For historical reasons, `domain=.site.com` (a dot before `site.com`) also works
    the same way, allowing access to the cookie from subdomains. That''s an old notation,
    should be used we if we need to support very old browsers.


    So, `domain` option allows to make a cookie accessible at subdomains.'
