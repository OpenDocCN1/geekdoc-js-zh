  md: "To solution\n\n# Greedy and lazy quantifiers\n\nQuantifiers are very simple\
    \ from the first sight, but in fact they can be tricky.\n\nWe should understand\
    \ how the search works very well if we plan to look for something more complex\
    \ than `\\d+`.\n\nLet's take the task as an example.\n\nWe have a text and need\
    \ to replace all quotes \"...\" with guillemets «...». They are preferred for\
    \ typography in many countries.\n\nFor instance: \"Hello, world\" should become\
    \ «Hello, world». There exist other quotes, such as „Witam, świat!\" (Polish)\
    \ or 「你好, 世界」 (Chinese), but for our list let's use «...».\n\nThe first thing\
    \ to do is locate quoted strings, and then we can replace them.\n\nA regular expression\
    \ like /.+/g (a quote, then something, the other quote) may seem like a good fit,\
    \ but it isn't!\n\nLet's try it:\n\n```\nlet regexp = /.+/g;\nlet str = 'a witch\"\
    \ and her \"broom\" is one';\nalert(str.match(regexp)); // \"witch\" and her \"\
    broom\"\n```\n\n...We can see that it works not intended!\n\nInstead of finding\
    \ two matches \"witch\" and \"broom\", it finds: \"witch\" and her \"broom\".\n\
    \nThat can be described as \"greediness is the cause of all evil\".\n\n# Greedy\
    \ search\n\nTo find a match, the regular expression engine uses the following\
    \ algorithm:\n\n+   - For every position in the string\n  - Try to match the pattern\
    \ at that position.\n  - If there's no match, go to the next position."
