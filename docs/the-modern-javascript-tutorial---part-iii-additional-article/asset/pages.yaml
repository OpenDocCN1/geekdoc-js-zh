  md: 'The `delete` method looks up values to delete by a query, the call format is
    similar

    to `getAll`:


    +   - `delete(query)` – delete matching values by query.


    For instance:


    ```

    // delete the book with id=''js''

    books.delete(''js'');

    ```


    If we''d like to delete books based on a price or another object field, then we
    should

    find the key in the index, and then call `delete`:


    ```

    // find the key where price = 5

    let request = priceIndex getKey(5);


    request onSuccess = function() {

    let id = request result;

    let deleteRequest = books.delete(id);

    };

    ```


    To delete everything:


    ```

    books.clear(); // clear the storage.

    ```


    # Cursors


    Methods like `getAll/getAllKeys` return an array of keys/values.


    But an object storage can be huge, bigger than the available memory. Then

    `getAll` will fail to get all records as an array.


    What to do?


    Cursors provide the means to work around that.


    **A cursor is a special object that traverses the object storage, given a query,

    and returns one key/value at a time, thus saving memory.**


    As an object store is sorted internally by key, a cursor walks the store in key
    order

    (ascending by default).


    The syntax:'
  merge: -1
  pgno: 151
- img_proc: true
  md: "```\n// like getAll, but with a cursor:\nlet request = store openCursor(query,\
    \ [direction]);\n\n// to get keys, not values (like getAllKeys): store.openKeyCursor\n\
    ```\n\n+   - query is a key or a key range, as for getAll\n- direction is an optional\
    \ argument, which order to use:\n  - \"next\" – the default, the cursor walks\
    \ up the record with the lowest key.\n  - \"prev\" – the reverse order: down from\
    \ the record with the biggest key.\n  - \"nextunique\", \"prevunique\" – same\
    \ as above, but skip records with the same key (only for over indexes, e.g. for\
    \ multiple books with price=5 only the first one will be returned)\n\n# The main\
    \ difference of the cursor is request.onssuccess triggers multiple times: once\
    \ for each result.\n\nHere's an example of how to use a cursor:\n\n```\nlet transaction\
    \ = db.transaction(\"books\");\nlet books = transactionobjectStore(\"books\");\n\
    \nlet request = books.openCursor();\n\n// for each key found by the cursor\nrequest.onssuccess\
    \ = function() {\nlet cursor = request.result;\nif (cursor) {\n  let key = cursor.key;\
    \ // book key (id field)\n  let value = cursor.value; // book object\n  console\
    \ log(key, value);\n  cursor.continue();\n} else {\n  console log(\"No more books\"\
    );\n}\n};\n```\n\nThe main cursor methods are:\n\n+   - advance(count) – advance\
    \ the cursor count times, skipping values.\n- continue([[key]]) – advance the\
    \ cursor to the next value in range matching (or immediately after key given).\n\
    \nWhether there are values matching the cursor or not – onssuccess gets called,\
    \ and then in result we can get the cursor pointing to the next record, or undefined."
  merge: -1
  pgno: 152
- img_proc: true
  md: "In the example above the cursor was made for the object store.\nBut we can\
    \ also make a cursor over an index. As we remember, indexes allow to search by\
    \ an object field. Cursors over indexes to precisely the same as over object stores\
    \ – they save memory by returning one value at a time.\n\nFor cursors over indexes,\
    \ cursor.key is the index (e.g. price), and we should use cursor.primaryKey property\
    \ for the object key:\n\n```\nlet request = priceIdx.openCursor(IDBKeyRange.upperBound(5));\n\
    \n// called for each record\nrequest.onsuccess = function() {\n  let cursor =\
    \ request.result;\n  if (cursor) {\n    let key = cursor.keyCode; // next object\
    \ store key (id field)\n    let value = cursor.value; // next object store object\
    \ (book object)\n    let key = cursor.key; // next index key (price)\n    console.log(key,\
    \ value);\n    cursor.continue();\n  } else {\n    console.log(\"No more books\"\
    );\n  }\n};\n```\n\n# Promise wrapper\n\nAdding onsuccess/onerror to every request\
    \ is quite a cumbersome task. Sometimes we can make our life easier by using event\
    \ delegation, e.g. set handlers on the whole transactions, but async/await is\
    \ much more convenient.\n\nLet's use this promise wrapper https://github.com/jakearchibald/idb\
    \ further in this chapter. It creates a global idb object with promised IndexedDB\
    \ methods.\n\nThen, instead of onsuccess/onerror we can write like this:\n\n```\n\
    let db = await openDB('store', 1, db => {\n  if (db.oldVersion < 0) {\n    //\
    \ perform the initialization\n    db.createObjectStore('books', {keyPath: 'id'});\n\
    \  }\n});\n\nlet transaction = db.transaction('books', 'readwrite');\nlet books\
    \ = transaction.objectStore('books');\n\ntry {\n  await books.add({...});\n  await\
    \ books.add({...});\n```"
  merge: -1
