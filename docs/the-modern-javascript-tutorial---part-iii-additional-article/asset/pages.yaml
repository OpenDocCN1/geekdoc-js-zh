  md: '```

    let regexp = /(-?\d+(\.\d+)?)\s*([-+*\/])\s*(-?\d+(\.\d+)?)/;


    alert("1.2 + 12" match(regexp));

    ```


    The result includes:


    +   - result[0] == "1.2 + 12" (full match)

    - result[1] == "1.2" (first group (-?\d+(\.\d+)??) - the first number, including
    the decimal part)

    - result[2] == ".2" (second group (\.\d+)?) - the first decimal part)

    - result[3] == "+" (third group ([-+*\/])) - the operator)

    - result[4] == "12" (fourth group (-?\d+(\.\d+))?)\) - the second number

    - result[5] == undefined (fifth group (\.\d+)?) - the last decimal part is absent,
    so it''s undefined)


    We want only the "clean" and the operator, without the full match or the decimal
    parts, so let''s "clean" the result bit.


    The full match (arrays first item) can be removed by shifting the array result.shift().


    Groups that contain decimal parts (number 2 and 4) (\.\d+) can be excluded by
    adding ?: to the beginning: (?:\.\d+)?.


    The final solution:


    ```

    function parse(expr) {

    let regexp = /(-?\d+(?:\.\d+)?)\)\s*([-+*\/])\s*(-?\d+(?:\.\d+)?)/;


    let result = expr.match(regexp);


    if (!result) return [];

    result.shift();


    return result;

    }


    alert(parse("-1.23 * 3.45")); // -1.23, *, 3.45

    ```


