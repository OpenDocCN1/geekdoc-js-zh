  md: '```

    alert( str.match(/\d\n/gm) ); // 1\n,2\n

    ```


    As we can see, 2 matches instead of 3.

    That''s because there''s no newline after 3 (there''s text end though, so it matches
    $).


    Another difference: now every match includes a newline character \n. Unlike the
    caret ^ \$, that only test the condition (start/end of line), \n is a character,
    so it becomes a part of the result.


    So, a \n in the pattern is used when we need newline characters in the result,
    anchors are used to find something at the beginning/end of a line.


    # Word boundary: \b


    A word boundary \b is a test, just like ^ and \$.

    When the regexp engine (program module implements searching for regexps) comes
    across \b, it checks the position in the string is a word boundary.

    There are three different positions that qualify as word boundaries:


    +   - At string start, if the first character is a word character \w.

    - Between two characters in the string, where one is a word character \w and the
    other is not.

    - At string end, if the last character is a word character \w.


    For instance, regexp \bJava\b will be found in Hello, Java!, where Java is a standalone,
    but not in Hello, JavaScript.


    ```

    alert("Hello, Java!").match(/\bJava\b/); // Java

    alert("Hello, JavaScript!").match(/\bJava\b/); // null

    ```


    The string Hello, Java! following positions correspond to \b:


    ![](img/10702f89b72e44092576c4bcf72121f3_253_0.png)


    So, it matches the pattern \bHello\b, because:


    +   1. At the beginning of the string matches the first test \w.

    2. Then matches the word Hello.'
