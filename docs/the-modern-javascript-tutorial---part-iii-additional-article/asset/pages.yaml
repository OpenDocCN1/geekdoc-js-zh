  md: '# Flags


    Regular expressions may have flags that affect the search.


    There are only 6 of them in JavaScript:


    +   i

    With this flag the search is case-insensitive: no difference between A and a (see
    the example below).


    +   g

    With this flag the search looks for all matches, without it – only the first match
    is returned.


    +   m

    Multiline mode (covered in the chapter Multiline mode of anchors ^ $, flag ''m'').


    +   s

    Enables "dotall" mode, that allows a . to match newline character \n (covered
    in the chapter Character classes).


    +   u

    enables full unicode support. The flag enables correct processing of surrogate
    pairs. More about that in the chapter Unicode: flag "u" and class \p{...}.


    +   y

    "Sticky" mode: searching at the exact position in the text (covered in the Sticky
    flag ''y'', searching at position).


    > Colors

    From here on the color scheme:

    * regexp – red

    * string (where we search) – blue

    * result – green


    # Searching: str.match


    As mentioned previously, regular expressions are integrated with string methods.


    The method str.match(regexp) finds all matches of regexp in the string str.'
