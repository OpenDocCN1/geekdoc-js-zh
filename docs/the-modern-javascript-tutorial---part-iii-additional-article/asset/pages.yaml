- img_proc: true
  md: 'The syntax is: X(!Y), it means "search X, but only if not followed by Y".


    ```

    let str = "2 turkeys cost 60€";

    alert( str.match(/\d+(?!€)/)); // 2 (the price is skipped)

    ```


    # Lookbehind


    Lookahead allows to add a condition for "what follows".


    Lookbehind is similar, but it looks behind. That is, it allows to match a pattern
    only if there''s something before it.


    The syntax is:


    +   - Positive lookbehind: (?=Y)X, matches X, but only if there''s Y before it.

    - Negative lookbehind: (?<!Y)X, matches X, but only if there''s no Y before it.


    For example, let''s change the price to US dollars. The dollar sign is usually
    before the number, so to look $30 we use (?<=\$)\d+ – an amount preceded by $.


    ```

    let str = "1 turkey costs $30";

    // the dollar sign is escaped \$

    alert( str.match(/(?<\$)\d+)/)); // 30 (skipped the number)

    ```


    And, if we need the quantity – a number, not preceded by $, then we can use a
    negative lookbehind (?<!\$)\d+.


    ```

    let str = "2 turkeys cost $60€";

    alert( str.match(/(?<\$)\d+)/)); // 2 (skipped the price)

    ```


    # Capturing groups


    Generally, the contents inside lookaround parentheses do not become a part of
    the result.


    E.g. in the pattern \d+(?=€), the € sign doesn''t captured as a part of the match.
    That''s natural: we look for a number \d+, while (?=€) is just a test that it
    should be followed by €.


    ![](img/10702f89b72e44092576c4bcf72121f3_294_0.png)'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'But in some situations we might want to capture the lookaround expression as
    well, or a part of it. That''s just wrap that part into additional parentheses.

    In the example the currency sign (€|kr) is captured, along with the amount:


    ```

    let str = "1 turkey costs 30€";nlet regexp = /\d+(?=(€|kr))/; // extra parentheses
    around €|kr

    alert(str.match(regexp)); // 30, €

    ```


    And here''s the same for lookbehind:


    ```

    let str = "1 turkey costs $30";

    let regexp = /(?<=(\$|\))\d+;

    alert(str.match(regexp)); // 30, $

    ```


    # Summary


    Lookahead and lookbehind (commonly referred to as “lookaround”) are useful when
    we''d like to match something depending on the context before/after it.


    For simple regexps we can do the same manually. That is: match everything, in
    any context, and then filter by context in the loop.


    Remember, str.match(without flag g) and str.matchAll(always) return matches as
    arrays with index property, so we know where exactly in the text it is, and can
    check the context.


    But generally lookaround is more convenient.


    Lookaround types:


    | Pattern | type | matches |

    | X(?Y) | Positive lookahead | X if followed by Y |

    | X(!Y) | Negative lookahead | X if not followed by Y |

    | (?<=Y)X | Positive lookbehind | X if after Y |

    | (?<!Y)X | Negative lookbehind | X if not after Y |


