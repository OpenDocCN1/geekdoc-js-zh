  md: "slot.assignedNodes({flatten: true/false}) – DOM nodes, assigned to the slot.\
    \ The flatten option is false by default. Explicitly set to true, then it looks\
    \ more deeply into the flattened DOM, returning slots in case of nested components\
    \ and the fallback content if no node assigned.\n\nslot.assignedElements({flatten:\
    \ true/false}) – DOM elements, assigned to the slot (same as above, but element\
    \ nodes).\n\nThese methods are useful when we need just the slotted content, but\
    \ also track it in JavaScript.\n\nFor example, if <custom-menu> component wants\
    \ to know, what it shows, then it could track slotchange and get the items from\
    \ slot.assignedElements:\n\n```\n<custom-menu id=\"menu\">\n  <span slot=\"title\"\
    >Candy menu/</span>\n  <li slot=\"item\">Lollipop</li>\n  <li slot=\"item\">Fruit\
    \ Toast</li>\n</custom-menu>\n```\n\n```\n<script>\ncustomElements.define('custom-menu',\
    \ class extends HTMLElement {\n  constructor() {\n    super();\n    this.attachShadow({mode:\
    \ 'open'});\n  }\n  connectedCallback() {\n    this.shadowRoot.innerHTML = `<div\
    \ class=\"menu\">\n      <slot name=\"title\"></slot>\n      <ul><slot name=\"\
    item\"></slot></ul>\n    </div>`;\n  }\n\n  // slottable is added/removed/slotchange\n\
    \  this.shadowRoot.firstElementChild.addEventListener('slotchange', e => {\n \
    \   let slot = e.target;\n    if (slot.name === 'item') {\n      this.items =\
    \ slot.assignedElements().map(elem => elem.textContent);\n      alert(\"Items:\
    \ \" + this.items);\n    }\n  });\n\n  // items update after 1 second\n  setTimeout(()\
    \ => {\n    this.shadowRoot.body.insertAdjacentHTML('beforeEnd', '<li slot=\"\
    item\">Cup Cake/li>');\n  }, 1000);\n});\n</script>\n```\n\n# Summary"
