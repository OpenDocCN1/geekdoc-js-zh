    Host: anywhere.com

    Origin: https://javascript.info

    ...

    ```


    As you can see, Origin header contains the origin (domain/protocol/port), without
    a path.


    The server can inspect the Origin and, if it agrees to accept such a request,
    a special header Access-Control-Allow-Origin to the response. That header should
    contain the allowed origin in our case https://javascript.info, or a star *. Then
    the response is successful, otherwise an error.


    The browser plays the role of a trusted mediator here:


    +   1. It ensures that the correct Origin is sent with a cross-origin request.


    +   2. It checks for permitting Access-Control-Allow-Origin in the response, if
    it exists, then JavaScript is allowed to access the response, otherwise it fails
    with a'
