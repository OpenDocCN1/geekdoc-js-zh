    > in the template. So all <li slot=\"item\"> are appended to <slot name=\"item\"\
    > one after another, thus forming the list.\n\nThe flattened DOM becomes:\n\n\
    ```\n<custom-menu>\n#shadow-root\n  <style> /* menu styles */</style>\n  <div\
    \ class=\"menu\">\n    <slot name=\"title\">\n      <span slot=\"title\">Candy\
    \ menu</span>\n    </slot>\n    <ul>\n      <slot name=\"item\">\n        <li\
