    # Fetch: Download progress


    The fetch method allows to track download progress.


    Please note: there''s currently no way for fetch to track progress. For that purpose,
    please use XMLHttpRequest, we''ll cover it later.


    To download progress, we can use response.body. It''s ReadableStream — a special
    object that provides chunk-by-chunk, as it comes. Readable streams are described
    in the Streams API specification.'
