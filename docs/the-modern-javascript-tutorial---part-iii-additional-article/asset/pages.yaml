- img_proc: true
  md: 'The alternative value end would mean that the change should be applied not
    in the beginning, but at the end of each second.


    So the process would go like this:


    +   - 0s - 0

    - 1s - -10% (first change at the end of the 1st second)

    - 2s - -20%

    - ...

    - 9s - -90%


    Here''s step(9, end) in action (note the pause between the first digit change):

    https://plinker.co/edit/l3SoddMNBYDKxH2HeFak?p=preview


    There are also shorthand values:


    +   - step-start – is the same as steps(1, start). That is, the animation starts
    immediately and takes 1 step. So it starts and finishes immediately, as if there
    were no animation.

    - step-end – the same as steps(1, end) : make the animation in a single step at
    the end of transition-duration.


    These values are rarely used, because that''s not really animation, but rather
    a single-step change.


    # Event transitionend


    When the CSS animation finishes the transitionend event triggers.


    It is widely used to do an action after the animation is done. Also we can join
    animations.


    For instance, the ship in the example below starts to swim there and back on click,
    each time farther and farther to the right:'
