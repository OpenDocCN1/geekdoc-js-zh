  md: '![](img/10702f89b72e44092576c4bcf72121f3_160_0.png)


    +   4. Now in the blue segment take a point on the distance proportional to the
    same value of t . That is, for t=0.25 (the left picture) we have a point at the
    end of the left quarter of the segment, and for t=0.5 (the right picture) — in
    the middle of the segment. On pictures above that point is red.


    +   5. As t runs from 0 to 1, every value of t adds a point to the curve. The
    set of such points forms the Bezier curve. It''s red and parabolic on the pictures
    above.


