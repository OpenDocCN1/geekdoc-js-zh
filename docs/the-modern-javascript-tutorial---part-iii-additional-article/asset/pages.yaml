  md: "But how to make the Bezier curve for a specific task? There are many tools.\
    \ For instance, we can do it on the site http://cubic-bezier.com/.\n\n# Steps\n\
    \nTiming function `steps(number of steps, start/end)`` allows to split animation\
    \ into steps.\n\nLet's see that in an example with digits, without any animations,\
    \ just as a source:\n\nHere's a list of digits,\n\nhttps://plnkr.co/edit/iY2Yj0vD8CcbFCUqnsl?p=preview\n\
    \nWe'll make the digits appear in a discrete way by making the part of the list\
    \ outside of the red \"window\" and shifting the list to the left with each step.\n\
    \nThere will be 9 steps, a step-move for each digit:\n\n```\n#stripe.animate {\n\
    \  transform: translate(-90%);\n  transition: transform 9s steps(9, start);\n\
    }\n```\n\nIn action:\n\nhttps://plnkr.co/edit/6vBXpYJljU5vX8UVs?p=preview\n\n\
    The first argument of `steps(9, start)` is the number of steps. The transform\
    \ will be split into 9 parts (10% each). The time interval is automatically divided\
    \ into 9 parts as well, so transition: 9s gives us 9 seconds for the whole animation\
    \ – 1 second digit.\n\nThe second argument is one of words: `start` or `end`.\n\
    \nThe `start` means that in the beginning of animation we need to make the first\
    \ step immediately.\n\nWe can observe during the animation: when we click on the\
    \ digit it changes to 1 (the first step) immediately, and then changes in the\
    \ beginning of the next second.\n\nThe process is progressing like this:\n\n+\
    \   - 0s -10% (first change in the beginning of the 1st second, immediately)\n\
    - 1s -20%\n- ...\n- 8s -80%\n- (the last second shows the final value)."
