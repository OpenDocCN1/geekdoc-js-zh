- img_proc: true
  md: 'We can split user interface into visual components: each of them has own place
    on the page, can “do” a well-described task, and is separate from the others.


    Let''s take a look at a website, for example Twitter.


    It naturally splits into components:


    ![](img/10702f89b72e44092576c4bcf72121f3_195_0.png)


    +   1. Top navigation.

    2. User info.

    3. Follow suggestions.

    4. Submit form.

    5. (and also 6, 7) – messages.


    Components may have subcomponents, e.g. messages may be parts of a higher-level
    “message list” component. A clickable user picture itself may be a component,
    and so on.


    How do we decide, what is a component? That comes from intuition, experience and
    common sense. Usually it''s a separate visual entity that we can describe in terms
    of what it does and how it interacts with the page. In the case above, the page
    has blocks, each of them plays its own role, it''s logical to make these components.


    A component has:


    +   * Its own JavaScript class.

    * DOM structure, managed solely by its class, outside code doesn''t access it
    (“encapsulation” principle).

    * CSS styles, applied to the component.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '+   • API: events, class methods etc to interact with other components.


    Once again, the whole “component” thing is nothing special.


    There exist many frameworks and development methodologies to build them, each
    with its own bells and whistles. Usually, special CSS classes and conventions
    are used to provide “component feel” – CSS scoping and DOM encapsulation.


    “Web components” provide built-browser capabilities for that, so we don’t have
    to emulate them anymore.


    +   • Custom elements – to define custom HTML elements.


    +   • Shadow DOM – to create an internal DOM for the component, hidden from the
    others.


    +   • CSS Scoping – to declare styles that only apply inside the Shadow DOM of
    the component.


    +   • Event retargeting and other minor stuff to make custom components better
    fit the development.


    In the next chapter we''ll go into details of “Custom Elements” – the fundamental
    and well-supported feature of web components, good on its own.


    # Custom elements


    We can create custom HTML elements, described by our class, with its own methods
    and properties, events and so on.


    Once a custom element is defined, we can use it on par with built-in HTML elements.


    That''s great, as HTML dictionary is rich, but not infinite. There are no <easy-tabs>,
    <sliding-carousel>, <beautiful-upload>… Just think of other tag we might need.


    We can define them with a special class, and then use as if they were always a
    part of HTML.


    There are two kinds of custom elements:


    +   1. Autonomous custom elements – “all-new” elements, extending the abstract
    HTMLElement class.


    +   2. Customized built-in elements – extending built-in elements, like a customized
    button, based on HTMLButtonElement etc.


    First we''ll cover autonomous elements, and then move to customized built-in ones.


    To create a custom element, we need to tell the browser several details about
    it: how to show it, what to do when the element is added or removed from page,
    etc.'
  merge: -1
  pgno: 196
- img_proc: true
  md: "That's done by making a class with special methods. That's easy, as there are\
    \ only few methods, and all of them are optional.\n\nHere's a sketch with the\
    \ full list:\n\n```\nclass MyElement extends HTMLElement {\n  constructor() {\n\
    \    super();\n    // element created\n  }\n\nconnectedCallback() {\n    // browser\
    \ calls this method when the element is added to the document\n    // (can be\
    \ called many times if an element is repeatedly added/removed)\n  }\n\ndisconnectedCallback()\
    \ {\n    // browser calls this method when the element is removed from the document\n\
    \    // (can be called many times if an element is repeatedly added/removed)\n\
    \  }\n\n  static get observedAttributes() {\n    return [/ array of attribute\
    \ names to monitor for changes/];\n  }\n\n  attributeChangedCallback(name, oldValue,\
    \ newValue) {\n    // called when one of attributes listed above is modified\n\
    \  }\n\nadoptedCallback() {\n    // called when the element is moved to a new\
    \ document\n    // (happens in document.adoptNode, very rarely)\n  }\n\n  // there\
    \ can be other element methods and properties\n}\n```\n\nAfter that, we need to\
    \ register the element:\n\n```\n// let the browser know that <my-element> is served\
    \ by our new class\ncustomElements.define(\"my-element\", MyElement);\n```\n\n\
    Now for any HTML elements with tag <my-element>, MyElement is created, and the\
    \ aforementioned methods are called. We also can document.createElement('my-element')\
    \ in JavaScript."
  merge: -1
  pgno: 197
- img_proc: true
  md: "Custom element name must contain a hyphen - Custom element name must have a\
    \ hyphen - , e.g. my-element and super-button are valid names, but myelement is\
    \ not.\n\nThat's to ensure there are no name conflicts between built-in and custom\
    \ HTML elements.\n\n# Example: “time-formatted”\n\nFor example, there already\
    \ exists <time> element in HTML, for date/time. But it doesn't do anything by\
    \ formatting itself.\n\nLet's create <time-formatted> element that displays the\
    \ time in a nice, language-aware format:\n\n```\n<script>\nclass TimeFormated\
    \ extends HTMLElement { // (1)\n\n  connectedCallback() {\n    let date = new\
    \ Date(this.getAttribute('datetime')) || Date.now());\n\n    this.innerHTML =\
    \ new Intl.DateTimeFormat('default\", {\n      year: this.getAttribute('year')\
    \ || undefined,\n      month: this.getAttribute('month') || undefined,\n     \
    \ day: this.getAttribute('day') || undefined,\n      hour: this.getAttribute('hour')\
    \ || undefined,\n      minute: this.getAttribute('minute') || undefined,\n   \
    \   second: this.getAttribute('second') || undefined,\n      timeZoneName: this.getAttribute('time-zone-name')\
    \ || undefined\n    }).format(date);\n  }\n}\n\ncustomElements.define(\"time-formatted\"\
    , TimeFormated); // (2)\n</>\n```\n\n```\n<!-- (3) -->\n<time-formatted datetime=\"\
    2019-12-01\">\n  year=\"numeric\" month=\"long\" day=\"numeric\"\n  hour=\"numeric\"\
    \ minute=\"numeric\" second=\"numeric\"\n  time-zone-name=\"short\"\n</time-formatted>\n\
    ```\n\nDecember 1, 2019, 3:00:00 AM GMT+3"
  merge: -1
  pgno: 198
- img_proc: true
  md: "1. The class has only one method `connectedCallback()` – the browser calls\
    \ it when `<time-formatted>` element is added to page (or when HTML parser detects\
    \ it, and it uses the built-in `Intl.DateTimeFormat` data formatter, well-supported\
    \ across the browsers, to show a newly formatted time.\n\n2. We need to register\
    \ our new element by `customElements.define(tag, class)`.\n\n3. And then we can\
    \ use it everywhere.\n\n> Custom elements upgrade\nIf the browser encounters any\
    \ `<time-formatted>` elements before `customElements.define`, that's not an error.\
    \ But the element is yet unknown, just like any non-standard tag.\n\nSuch “undefined”\
    \ elements can be styled with CSS selector `:not(:defined)`.\n\nWhen `customElement.define`\
    \ is called, they are “upgraded”: a new instance of `TimeFormatted` is created\
    \ for each, and `connectedCallback` is called. They become `:defined`.\n\nTo get\
    \ the information about custom elements, there are methods:\n\n* `customElements.get(name)`\
    \ – returns the class for a custom element with the given `name` \n* `customElements.whenDefined(name)`\
    \ – returns a promise that resolves (without value) when a custom element with\
    \ the given `name` becomes defined."
