  md: '# Summary


    `document.cookie` provides access to cookies


    +   - write operations modify only cookies mentioned in it.

    - name/value must be encoded.

    - one cookie up to 4kb, 20+ cookies per site (depends on a browser).


    Cookie options:


    +   - `path=/`, by default current path, makes the cookie visible only under that
    path.

    - `domain-site.com`, by default it is visible on current domain, if set explicitly
    to the domain, makes the cookie visible on subdomains.

    - `expires` or `max-age` sets cookie expiration time, without them the cookie
    dies when the browser is closed.

    - `secure` makes the cookie HTTPS-only.

    - `samesite` forbids the browser to send the cookie with requests coming from
    outside the site, helps to prevent XSRF attacks.


    Additionally:


    +   - Third-party cookies may be forbidden by the browser, e.g. Safari does that
    by default.

    - When setting a tracking cookie for EU citizens, GDPR requires to ask for permission.


    # LocalStorage, sessionStorage


    Web storage objects `localStorage` and `sessionStorage` allow to save key/value
    pairs in the browser.


    What''s interesting about them is that the data survives a page refresh (for `sessionStorage`)
    and even a full browser restart (for `localStorage`). We''ll see that very soon.


