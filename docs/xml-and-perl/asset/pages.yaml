    and character data. XML::Writer builds all the required markup text (for example,
    tags, comments, and processing instructions). In addition, the XML::Writer module
    executes several checks to verify that the generated XML document is well-formed
    (for example, that all tags have corresponding end tags) and simplifies your code.
    As you can see, the XML::Writer module does a lot of behind-the-scenes work for
    you. This enables you to concentrate on other parts of the application.


