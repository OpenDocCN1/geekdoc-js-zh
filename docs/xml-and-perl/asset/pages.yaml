    12–19 If the remote method didn not encounter any errors and no have been returned,
    we can print the result. The result is retrieved from the object by using an access
    method named result(). If an error occurred, it is returned as a SOAP Fault element.
    Each SOAP Fault element contains the following four elements:


    +   * faultcode—This element is intended to be used by your software to provide
    a mechanism to identify the fault. The faultcode is required to appear in a SOAP
    Fault element, and it must be an XML-qualified name. The SOAP standard has defined
    a few SOAP codes for faults.


    +   * faultstring—This element is supposed to provide a human-readable string
    that describes the fault. The faultstring is required to appear in a SOAP Fault
    element.


    +   * faultfactor—This element is intended to provide additional information about
    who caused the fault to occur throughout the message path.


    +   * faultdetail—This element is intended to carry application-specific fault
    information.


