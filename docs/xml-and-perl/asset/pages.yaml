    # What Is XML Processing?


    What is XML processing? That is an often-asked question today given the popularity
    of XML. In the context of this book, I''ll define XML processing as any task that
    involves XML data (for example, reading, writing, generating, and transforming).


    # Examples of XML Processing


    XML processing can mean different things to different people, depending on what
    is important to them. What are some XML-related tasks? A few of the more important
    XML-related topics will be covered throughout the book are XML generation, XML
    validation, XML parsing, and XML transformation. Each of these topics will be
    introduced in the next few sections and discussed in detail a little later in
    the book.


    XML documents must be generated before they can be processed, so generating XML
    documents is an important topic. There are several Perl modules that are specifically
    designed to facilitate generating XML from a variety of input sources. The input
    data source will usually determine the best XML generating module for each situation.
    For example, if you are converting an input CSV file to XML, you could use either
    the XML::Writer or XML::SAXDriver::CSV modules. If your input data is in a Microsoft
    Excel file, you could use the XML::SAXDriver::Excel Perl module. Finally, if you
    need to convert the results of a database query to XML, you could use the XML::Writer
    or the XML::Generator::DBI modules.


    As you can see, you have a number of options when it comes to support generating
    XML. I''ll discuss all of these modules in greater detail and present examples
    a little later in the book.'
