  md: '18 Chapter 2 Now Let''s Start Digging


    # Note


    A short XML primer is included in Appendix A, "What Is XML?" to help refresh your
    memory or give you an abbreviated introduction to XML.


    # XML Parsers


    Parsers come in many different forms. Some XML parsers don''t require any programming,
    you just provide an input XML document, and the parser generates the output data.
    Other XML parsers provide Application Programming Interfaces (APIs) that allow
    the programmer to manipulate its functionality from within the application code.
    APIs are usually highly customizable and come with many different features. In
    Perl, a parser module provides an API to an XML parser engine. This API hides
    the details of the inner workings from the typical user, providing a clean, easy-to-use,
    and well-defined interface.


    Parsing an XML document involves reading the XML data and navigating through it
    while separating the contents of the XML document into meaning-ful components.
    Remember, XML data can come from a file, input stream (for example, a socket),
    a string, or just about any other possible data source. The most popular methods
    of parsing XML either follow the push model or the pull model. Each of these parsing
    methods is discussed in the following sections.


    # Push Model of an XML Parser


    The push model, as shown in Figure 2.1, is the core of the event-driven parsers.
    In the push model, special subroutines called event handlers are defined within
    your application. These event handlers are registered or tied to specific events
    and are automatically called by the XML parser when a particular event occurs.
    The push model was given its name because whenever a particular event is encountered,
    it pushes the event (and some event-specific data) to a predefined handler in
    the application. For example, you can define subroutines that are called when
    a start tag is encountered, when an end tag is encountered, and so forth. Using
    a logic that we''ll demonstrate, it is fairly straightforward to parse an XML
    document and extract its contents.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'As you can see, this is a passive approach to parsing because your application
    waits for data to arrive. Basically, three steps are involved in this approach.


    +   - Write the event handler subroutines.


    +   - Parse the XML data.


    +   - Wait for the event handlers to be called.


    Of course, there is a little more to it, but that is basically what happens. It''s
    important to understand the concept at a high level. This way, when we present
    the examples and discuss the code that actually performs each of these steps,
    Event-driven parsers and their underlying concepts are discussed in detail in
    Chapter 3, "Event-Driven Parser Modules."


    ![](img/e22859c8cc5393df3568af9529713fd6_36_0.png)


    Figure 2.1 Applications built using a push-based XML Parser play a passive role
    and receive data that is pushed from the XML parser.


    # Pulling XML Parser Events to the Application


    The pull model defines another parsing model. In this model, the application controls
    the parser and pulls the information from the parser as the parser iterates through
    the XML data. Figure 2.2 illustrates the pull XML parser model.


    As opposed to the pull model, the pull model requires the application to play
    a more active role in the parsing of the document. The pull model basically parses
    the XML data and holds it in a tree structure. In order to retrieve the data,
    the application then must walk up and down through the tree and extract the desired
    sections of the XML data. The pull model is discussed in detail in Chapter 4,
    "Tree-Based Parser Modules."'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Chapter 2 Now Let''s Start Digging


    ![](img/e22859c8cc5393df3568af9529713fd6_37_0.png)


    **Figure 2.2** Applications built using a pull-based XML parser play an active
    role in the parsing by pulling data from the XML document.


    Together, these two paradigms form the basis of most XML parsers. We''ll discuss
    the advantages and disadvantages of the push and pull methods throughout this
    book.


    # XML Parser Paradigms


    Now that we have discussed the low-level parser models, push and pull, let''s
    look at the more commonly discussed models that are built on top of the push and
    pull concepts. The two major types of parsers are event-driven and tree-based
    parsers.


    # Event-Driven XML Parsers


    Event-driven parser is a model that can be closely associated with the push model.
    Event-driven parsers enable an application to define events for each recognized
    construct, and after that construct (event) is encountered, the parser calls the
    correct function in the application associated with that event. For example, we
    can define an event that is encountered the opening tag (for example, `<name>)
    of an element is encountered. Simple API for XML (SAX) is the most popular event-driven
    parser specification. It defines a standard way to access and manipulate a SAX-compliant
    parser. This is a very powerful model due to its speed and efficiency. We''ll
    discuss event-driven modules in Chapter 3, "Event-Driven Parser Modules."'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Tree-Based XML Parsers


    When we memorize some information (for example, a friend''s telephone number),
    it''s easier to remember it than it is to look it up in the telephone book. Unless
    we have amnesia, our memory serves as the fastest and most reliable source for
    retrieving data. If you look at the tree-based or pull parser model shown in Figure
    2.2, you''ll notice the parser has a brain of its own and, therefore, stores the
    parsed information in a data structure. After the information is stored in the
    memory of these data structures, it can be easily accessed from the application.
    One of the most popular tree-based XML parser models is called Document Object
    Model (DOM), which is a specification that defines the behaviors and data structures
    of DOM-compliant parsers. We''ll tell you more about DOM and tree-based XML parsers
    in Chapter 4, "Tree-Based Parser Modules."


    # XML Parsers Versus XML Processors


    Try not to confuse XML parsers with XML processors. XML parsers are different
    from processors in an XML parser is only one of the components of an XML processor.
    An XML processor may include several different components required to accomplish
    its task.


    A perfect example of an XML processor is the eXtensible Stylesheet Language (XSL)
    Transformations (XSL) processor. The XSL processor is composed of many components,
    one of which is the actual XML parser itself. It uses the parsing component to
    decompose the XML document into meaningful parts so that other XSL components
    can operate on the individual components. An XSL processor converts two inputs:
    an XML document and an XSL stylesheet. The XSL stylesheet is an XML document that
    contains rules (called templates) that describe the format of the output. The
    XSL processor then applies these rules to the input XML document and generates
    the desired output. For example, we can start with an XML document, use an XSL
    processor, and the end product could be an HTML document (for display on a web
    page), or even another XML document that is a subset of the original XML document.
    XSL and other related topics will be discussed in Chapter 8, "XSL Transformation
    and Filtering."'
  merge: -1
