  md: '# ASP (Active Server Pages)


    ASP (Active Server Pages)

    Originally developed by the Microsoft Corporation for its own servers, however,
    it is now available for a number of web servers. Because the ASP engine is integrated
    into the web server, it doesn''t require another process. ASP enables the developer
    to merge source code within HTML pages. A Perl module Apache:ASP supports ASP
    with the mod_perl module.


    ATTLIST The keyword used in DTDs to initiate the declaration of one or more attributes
    for an element.


    Attribute An XML parameter that describes data associated with an element. Attributes
    take name=value format. For, to declare an attribute for an element you use the
    following format: <name="123-45-6789">Mark Riehl</>. In this case, the <name>
    element has one attribute named issn and the value of the attribute is="123-45-6789"


    Cascading Style Sheet See CSS.\CDATA An XML keyword that describes a block of
    data that may legally contain XML reserved characters (for example, < or > within
    an XML document. Usually, the reserved characters are replaced with the corresponding
    entity references. However, CDATA sections are used when encapsulating large blocks
    of data inside an XML document. For example, let''s say you are encapsulating
    an HTML document inside an XML document. By using a CDATA section, you won''t
    need to replace all reserved characters with the corresponding entity references.


    # CGI (Common Gateway Interface)


    An interface that enables external programs to interact with a web server. Static
    web pages are basically text files that do not change. CGI scripts execute in
    real time, allowing you to dynamically generate web content. It is very easy to
    build a CGI script that builds a web form, collects data from a user page, queries
    a database, and builds a web page containing the results. CGI scripts are frequently
    written in Perl.


    Character data The text in an XML document excluding markup. For example, the
    following XML element: <name>Mark Riehl</name> contains the character data "Mark
    Riehl".


    Character reference A of including non-printable Unicode characters in an XML
    document. These characters could be letters from a foreign language. The character
    reference contains the number of a particular Unicode character.


    Comma Separated Value See CSV.


    Comment Added to XML documents using the following notation:


    ```

    <!--Comment text here. -->

    ```


    Note that it is good idea to add comments throughout your XML document. Depending
    on the XML parser used, you may or may not have access to the comments after parsing.


    # Common Gateway Interface


    See CGI.


    # Comprehensive Perl Archive


    Network See CPAN.'
