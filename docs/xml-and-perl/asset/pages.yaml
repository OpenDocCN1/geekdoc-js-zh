  md: "# Design a Document Type Definition or XML Schema\n\nNow that we have the required\
    \ data fields and the rules associated with the data (for example, each field\
    \ is required to appear once for each base element), we can design a DTD and a\
    \ schema to support our requirements. Remember, I discussed DTDs and schemas in\
    \ Chapter 1. Both DTDs and schemas describe the content of XML data.\n\nFirst,\
    \ let's develop a DTD that supports our requirements. The root element of our\
    \ DTD is called software, and it will be made up of multiple distribution elements.\
    \ The root element is declared in the following section of the DTD:\n\n```\n<!ELEMENT\
    \ software>\n<!ELEMENT distribution (os*, price)>\n<!ATTLIST distribution\n  name\
    \ CDATA #REQUIRED\n  version CDATA #REQUIRED>\n```\n\nAs you're seeing, the software\
    \ root element is made up of one or more distribution elements. Each distribution\
    \ element is made up of an os element and a price element. Note that the os element\
    \ is required to support products that run on multiple operating systems. The\
    \ distribution element also has two attributes—name and version. This enables\
    \ each distribution element to be assigned a name and version. Note that the *\
    \ after the distribution element indicates that the distribution element can appear\
    \ one or more times.\n\nThe os element is similar to the distribution element\
    \ in that it has two children (total and out) and an attribute (name).\n\n```\n\
    <!ELEMENT os (total, out)>\n<!ATTLIST os\n  name CDATA #REQUIRED\n<!ELEMENT total\
    \ (#PCDATA)>\n<!ELEMENT out (#PCDATA)>\n```\n\nFinally, the last child of the\
    \ distribution element is the price element, which is defined by the following:\n\
    \n```\n<!ELEMENT price (#PCDATA)>\n```\n\nAll these individual portions of the\
    \ DTD are combined to create the DTD shown in Listing 3.1.\n\nListing 3.1 DTD\
    \ for the software inventory XML document.\n(Filename: ch3_xml_parser_sw_inventory.dtd)\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!ELEMENT software (package*)>\n\
    <!ELEMENT package (operating_system*, price)>\n<!ATTLIST package\n```"
