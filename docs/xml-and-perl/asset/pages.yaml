  md: "# Elements\n\nThe most fundamental structure of an XML document is the element.\
    \ A well-formed XML document must contain at least one element, although an XML\
    \ document usually contains many elements. An element typically surrounds character\
    \ data with start and end tags. A sample of an element is `<address>1106 River\
    \ Avenue</address>`\n\nThis is a single element named <address> and it contains\
    \ the character data \"1106 River Avenue.\\ Note that in an XML document, an element\
    \ always follows the following syntax:\n\n+   - Start tags begin with a less than\
    \ sign \"\"\n- End tags begin with a less than sign followed by a forward-slash\
    \ \"/\"\n\nInstead of containing character data, elements can also contain other\
    \ elements called elements. When we begin to discuss elements containing other\
    \ elements (that is, nested elements), you can start to visualize the XML document\
    \ almost as a tree. As you can see in Figure A.1, we have a tree that has a <record>\
    \ element at the root and two child elements named <name> and <address>.\n\n![](img/e22859c8cc5393df3568af9529713fd6_337_0.png)\n\
    \nFigure A.1 Tree representation of a simple XML document.\n\nThe XML document\
    \ that corresponds to the XML tree shown in Figure A.1 is\n\n```\n<xml version=\"\
    1.0\" encoding=\"UTF-8?>\n<record>\n  <name>Matthew Kolb</name>\n  <address>1700\
    \ Grand Avenue</address>\n</record>\n```\n\nIn this example, the <record> element\
    \ has two child elements, <name> and <address>. The <name> element contains the\
    \ character data \"Matthew Kolb\" and the <address> element contains the character\
    \ data \"1700 Grand Avenue.\\ Note that the child elements follow the same rules\
    \ for start and end tags (that is, each element must have matching start and end\
    \ tags)."
