  md: '# XML—What Is It and Why Should I Use It?


    XML is a set of rules that have been defined to describe and structure data. It
    was originally developed by the World Wide Web Consortium W3C as part of an effort
    that started in 1996 and produced the first XML specification version in 1998.
    Their goal at the time was to expand functionality by providing a flexible architecture
    for exchanging data. The architecture supports more than the typical web-client-server
    relationship between a browser and a web server. XML is not just for web pages
    XML can store any type of structured information. One benefit of storing standard
    data that is not related is that XML can be used to facilitate data communications
    between computer platforms that would otherwise be incompatible as well as for
    configuration or application data for easy access by the applications. A number
    of features are what make XML so successful—let''s take a quick look at them.


    # XML Is Extensible


    XML is extensible because it isn''t based on a rigid set of rules like HyperText
    Markup Language HTML and XML are both subsets of Standard. Generalized Markup
    Language SGML and have their similarities and differences HTML defines a standard
    set of tags, and because each tag has a predefined meaning, the language is not
    extensible. Because HTML tags are already defined as a standard, the HTML interpreter
    (the browser) does not have to interpret any tags that are not part of the HTML
    standard The interpreter is free to choose whether or not it wants to ignore the
    tags, throw an exception, display it as plain text, and so on. XML, on the other
    hand, is a meta-language that can be used to structure your data and define other
    meta-languages. In essence, when you generate an XML document you are actually
    defining a new data format or a new meta-language because you define the tags,
    ends, and so forth Then you create an interpreter for your language using an XML
    Parser, which will understand the user-defined syntax. You can also create a Document
    Type Definition DTD to further validate and restrict your language''s syntax.


    > Note

    XML is a meta-language; thus its

    ocument rules are defined in Annex A "What is XML?"'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# XML Separates Data from the Presentation of the Data


    The data contained in an XML document is separated from the presentation of the
    document. This feature enables you to decide how to display the data contained
    in an XML document based on the client viewing the XML document (that is, different
    clients can view the same data in different ways). Technologies as eXtensible
    Stylesheet Language Transformation (XSLT), XML Path Language (XPath), Cascading
    Style Sheets (CSS), and so forth can be used to transform XML documents for varying
    presentations to the viewer.


    # XML Documents Are Stored As Text


    An XML document is stored as text. You can view and edit an XML document easily
    because its legality makes development and debugging much easier than in binary
    or other illegal formats. Because an XML document is a text file, it is not platform
    specific. By I mean an XML document generated on one platform—for example, a PC
    running Microsoft Windows—can be used (viewed, read, or processed) on another
    platform, such as a Unix workstation. Cross platform portability can be an issue
    when applications store their data in a proprietary binary format (such as a word
    processor document or a spreadsheet). Think of an XML document as a clear glass
    container that holds data—everyone can see inside of it and nothing is hidden,
    which is how information or data should be treated.


    # XML Provides a Solid Foundation for a Family of Technologies


    XML itself is the specification that describes the rules designed to store and
    represent data. It specifies how start and end tags are defined, which characters
    are allowed for element names, how comments are written, and so on. In addition
    to XML, a large number of related specifications are designed from the beginning
    to closely integrate with XML. Here is a short list of the more popular specifications.


    +   XLink—Defines the syntax for adding hyperlinks to XML documents. In XML, any
    element can be designated as a link. XLink is more flexible than a standard hyperlink
    because it can support several types of links. For example, XLink can be used
    to create a standard HTML link, a bi-directional link that will return the user
    to the main document, or a multi-directional link that can provide multiple paths
    to the same document. Currently, most browsers support simple XLink functionality,
    however, custom applications can tap into the full functionality of XLink.'
  merge: -1
