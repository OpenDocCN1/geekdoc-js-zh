    </transaction>

    <transaction type="deposit">

    <account_number>22-11-44-1111</account_number>

    <name>Joseph Burns</name>

    <amount>50.00</amount>

    </transaction>

    </daily_activity>

    ```


    Note

    Please see http://www.w3.org/TR/REC-xml for additional information on DTDs.


    # XML Schemas


    XML schemas are XML documents that are similar to DTDs in that they are used to
    specify the content and structure of an XML document. However, that is where the
    similarities end. XML schemas were developed by the W3C in response to complaints
    about DTDs. For example, DTDs don''t support namespaces. Also, DTD data typing
    is weak and it only applies to attributes. Unfortunately, XML schemas are much
    more complicated than DTDs. Fortunately, XML schemas are much more powerful than
    DTDs, so their additional complexity has a benefit, and their benefits are worth
    the extra work.


    Although a DTD will enable you to verify that a particular element contains data
    or that attribute may be selected from an enumerated list, XML schemas enable
    you to specify that an element must contain a particular data type. For example,
    you can specify that a <title> element in a report must contain a string, the
    <price> element of an XML catalog must be a value that is greater than zero, or
    a <date> element must be an integer between 1 and 31. As you can see, XML schemas
    enable a finer grain of resolution when it comes to defining contents of an XML
    document.


    The subject of XML schemas is complex and cannot be thoroughly discussed in the
    pages available in this appendix. However, I will present an example of an XML
    schema and discuss all its major components.


    # Simple Types


    One of the major concepts behind XML schemas is using simple and complex types
    to describe elements. A simple type is just that—it cannot have any attributes
    or enclose any other elements. A complex type can do those things the simple cannot—that
    is, support attributes and enclose other elements. One of the tasks that you will
    be doing quite often when working with XML schemas is building complex types.
    A number of simple types are available to use as part of XML schema. Table A.2
    shows all the simple types built into XML.'
  merge: -1
  pgno: 350
