    The second change between the programs occurs on line 7. In the previous example,
    we created a new XML::SAXDriver::CSV object; however, in this example, we need
    to create a new XML::SAXDriver::Excel object. So, we use the following line to
    accomplish:


    +   7. my $csv = XML::SAXDriver::Excel->new();'
