  md: "# 332 Appendix A What Is XML?\n\nThe last DTD-related item we need to discuss\
    \ is the DOCTYPE declaration in the DTD. The following DOCTYPE declaration is\
    \ used in your DTD:\n<!DOCTYPE daily_activity SYSTEM \"daily_activity.dtd\">\n\
    \nThe DOCTYPE declaration must appear after the XML declaration, but before the\
    \ root element of the document. The format of the DOCTYPE declaration is as follows:\n\
    <!DOCTYPE root_element SYSTEM \"DTD name\">\n\nThis is fairly straightforward—the\
    \ DOCTYPE declaration needs to include the root element name and the location\
    \ of the external DTD file. The location can include a path on the local machine\
    \ to the DTD or a URL if the DTD is available on another machine.\n\nIn addition\
    \ to the SYSTEM identifier, you can also use the PUBLIC identifier. PUBLIC provides\
    \ a globally unique string that identifies the version of the DTD being used and\
    \ other information, but this doesn't specify the filename of the DTD. The PUBLIC\
    \ keyword is rarely used.\n\nA slight variation on the XML document is shown in\
    \ Listing A.3. As you can see, changed the value of the standalone parameter to\
    \ \"yes\" and included the entire DTD in place of the SYSTEM identifier. Now,\
    \ you have a standalone XML document. It is often beneficial to include the DTD\
    \ at the top of the XML document, so that when you make changes to the DTD or\
    \ the XML document, you can easily make any required changes to synchronize the\
    \ DTD and the XML document. One potential drawback of using a DTD in an XML file\
    \ is that the DTD can't be used during the validation of another XML document.\
    \ Remember, validating an XML document, the XML parser needs the DTD (or an XML\
    \ schema) to perform the validation.\n\nListing A.3 XML document containing bank\
