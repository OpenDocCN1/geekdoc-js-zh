  md: '# XML::Twig Perl Module


    The XML::Twig module by Michel Rodriguez is similar to the XML::Simple Perl module
    that it is built on top of the XML::Parser module. However, that is where the
    similarities end. XML::Twig is a tree-based parser, but it gives you more flexibility
    compared to other tree-based parsers by providing two important characteristics
    found in other parsers.


    First, the XML::Twig Perl module is similar to a SAX-based module because it can
    be configured to have a small memory requirement. This is important when working
    with large XML documents, especially if you''re only interested in a small subset
    of the elements. Second, the XML::Twig module provides an API that is similar
    to XPath in retrieving elements and attributes. It is important because it is
    not a module proprietary scheme of accessing elements and attributes.


    When it comes to parsing XML data, the XML::Twig Perl module supports three modes
    of operation:


    +   - The first XML::Twig mode can be utilized if a document is small (that the
    XML document would easily fit into memory). It parses the XML document into a
    tree that resides entirely in memory.

    - The second XML::Twig mode is used if the XML document is too large to parse
    entirely in memory. When operating in this mode (the XML::Twig perldoc refers
    to this processing as “chunk by chunk”), the XML document is parsed piece by piece
    (similar to the event-based approach to XML parsing), and then the parsed section
    of the document is discarded.

    - Finally, XML::Twig also enables you to parse only a particular section of the
    XML document without loading the entire document into memory.


    Because I just demonstrated how the XML::Simple module parses simple, simple,
    documents, the next example focuses on how to use the XML::Twig module to parse
    a subset of a larger, more complex XML document.


    # XML::Twig Example


    One of the most useful capabilities of the XML::Twig module is the capability
    to parse only a portion of an XML document. When would you use this capability?
    Let''s say for this example that you work for a large online retailer and that
    catalog is stored in XML. Your task is to generate a report for a particular portion
    of the catalog. For a large catalog, it isn''t unrealistic that the XML document
    could be several hundred megabytes (MB) in size. While it is physically possible
    to use a standard tree-based parser on a document this'
