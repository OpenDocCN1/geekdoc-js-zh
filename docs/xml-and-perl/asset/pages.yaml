  md: 'In Chapter 1,"Basics of XML Processing in Perl," we discussed the steps

    required to build an XML-based application. Let''s reuse those steps and apply

    them to the current example.


    # Gather Requirements


    As any well-planned software application, we need to list our available

    data, the requirements, and the desired output data. Our goal for this example

    is to generate a report from XML data that contains our company''s software

    inventory. For this simple example, let''s assume that the XML data is generated

    by hand. Don''t worry, all XML data isn''t generated by hand. In Chapters 6,

    "Generating XML Documents from Databases," and "7,"Transforming

    Miscellaneous Data Formats to XML (and Vice-Versa)," we''ll show you how

    to generate XML data from a number of input sources, including text files

    and relational databases.


    To perform the proper inventory, we''ll need the following information

    about each piece of software:


    +   - Name

    - Operating System

    - Number of Copies Purchased

    - Number of Copies Currently Being Used


    Our output report should have the following format:

    *Software Package Name *

    Total Number of Packages: X

    Total Number Available: Y

    Value ($ per piece): $Z * Total Number of Packages


    # Describe the Format of the Stored Data


    We know that we need to store a few pieces of information for each software

    package in our inventory. In the real world, a lot more data could be required

    for each piece of software (for example, licensing information, version number,

    patches or upgrades, and so forth); however, the pieces of information we have

    listed will suffice for our example.


    We''ll need to keep several points in mind while designing our format

    of stored data. First, some of our data elements can have multiple child

    elements. For example, our base element will be the name of the software

    package. Some of our software packages are available for multiple operating

    systems, and the prices for each operating system could be different. Second,

    all our information (name, operating system name, total number of packages,

    t number of packages available) for each software package is required to

    appear at least once.'
