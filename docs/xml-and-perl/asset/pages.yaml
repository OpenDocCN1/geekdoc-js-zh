  md: "# Parsing an XML Document and Extracting Statistics\n\nNow that you've got\
    \ a good understanding of what it means to parse an XML document, let's take a\
    \ look at a short example that uses one of the tools that were just discussed.\
    \ For this example, we'll use the XML::Parser Perl module to parse a small XML\
    \ document. Listing 2.1 shows a small XML document that contains statistics from\
