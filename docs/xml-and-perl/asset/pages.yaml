  md: '# Tree-Based XML Parser Modules


    The XMLIn() function parses XML data and returns a reference to a data structure
    that contains the information stored in the XML document. This function can accept
    an input filename, an undefined filename, or just a string containing XML data.
    In our example, we have provided the name of an input XML document named ch4_simple_config.xml.
    If undef is provided as the filename, the XML::Simple module will look for an
    XML document in the current directory with the same name as the program. If your
    parsing program was named foo.pl or you didn''t provide an input filename or string
    containing XML data, then the XML::Simple module would look for a file named foo.xml
    and try to parse it. XML::Simple will also accept a scalar containing an XML string
    as an input. This is helpful if XML data is being dynamically generated, saving
    you the trouble of writing the XML data to a file and then opening the file.


    In this example, $root is a reference to a data structure that contains all the
    information stored in the XML configuration file. Now that the XML document has
    been parsed, the information is stored for us in this data structure, and we just
    need to go and retrieve it.


    +   1. use strict;

    2. use XML::Simple;

    3.

    4. # Parse the input XML document

    5. $root = XMLIn(''ch4_simple_config.xml'', forcearray=>1);


