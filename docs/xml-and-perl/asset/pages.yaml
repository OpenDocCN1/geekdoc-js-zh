- img_proc: true
  md: '# Chapter 1 Basics of XML Processing in Perl


    # Learn More About XML


    XML has many mailing lists, newsgroups, and support web sites. I recommend searching
    and joining some of them because there is no better way to learn about a technology
    than listen to the everyday questions and discussions that are raised on these
    lists, groups, and web sites.


    You can find an index of XML mailing lists at http://www.oasis-open.org/cover/lists.html.


    Because XML is a W3C standard, I strongly suggest that you take a look at http://www.w3.org
    for XML and related standards documentation and resources.


    Before I talk about processing XML documents with Perl, let''s take a quick look
    at Perl.


    # What Is Perl?


    Perl is a high-level, powerful programming language originally developed by Larry
    Wall. It is an ideal language for quick prototyping of applications and production
    systems. Perl has file- and text-related functions that make it the ideal language
    for manipulating text files. In addition, Perl also supports graphical programming,
    applications requiring database access, network programming (that is, sockets),
    and web-based programming. As you can see, Perl has support for just about every
    possible component of an application.


    Perl also has several strengths that make it the perfect language for processing
    XML documents, as you''ll see in the following sections.


    # Text Manipulation and Processing


    One of Perl''s major strengths is the suite of built-in tools and functions for
    text manipulation and processing. Because Perl was designed for data processing,
    you can just do about anything you want to do with a small Perl script. For example,
    it is very easy to search, replace, or match any pattern in a string or document
    using the built-in regular expression engine. A regular expression is used by
    Perl to search for patterns in a text or file. Because XML data is plain text,
    it would seem natural to use Perl to process (that is, build, parse, or search)
    XML data. When Perl operates on XML data, it is just doing what its strength is—manipulating
    text.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Extending Perl''s Core Functionality Through Modules


    Perl''s core functionality can be easily extended by the use of modules. A module
    is a self-contained block of Perl code that performs a specific task. It is similar
    to a library in that it provides an application with additional functionality.


    One of the more powerful modules available for Perl is the Database Interface
    (DBI) module. The Perl DBI module provides you with an API to a large number of
    supported databases. This module provides you with a standard API, which is independent
    of any underlying database dependent issues. The end result is a very powerful
    tool that can be the basis for a number of applications.


    Another perfect example of a module is XML::Parser, which I''ll be using for several
    examples throughout the book. XML::Parser provides an API to an XML parser library
    (written in C by James Clark) called Expat. Most of the low level parsing work
    is hidden from the user, and as a result, you interact with the parser through
    a clean, thought out, and well-defined interface, which makes the task of parsing
    an XML document much simpler.


    Literally hundreds of Perl modules (more than 450 at the time of this writing)
    have been developed to support XML processing. This means you will find support
    for just about every XML-related task (such as writing, parsing, searching, and
    publishing). If not, chances are someone working on a module that does exactly
    what you need. And if not, you can always develop your own modules to support
    application or project-specific requirements.


    As you make our way through this book, you''ll see the power of modules, especially
    when they are utilized in an application. For example, the ability to query multiple
    database servers, combined with the ability to generate XML files, enables you
    to generate XML documents from any of the supported database servers. Modules
    also provide the reverse capability; by combining the XML::Parser module and the
    DBI module, you can parse XML documents and store their contents in a database.
    You''ll be able to perform a lot of complicated tasks when you take advantage
    of the power of Perl modules.'
  merge: -1
