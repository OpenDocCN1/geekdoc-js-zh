    # eXtensible Server Pages


    Another related technology supported by AxKit is eXtensible Server Pages (XSP).
    XSP is an XML-based technology that supports embedded code on a web server. So,
    XSP enables you to define and embed custom tags within the XML document. These
    custom tags are executed each time the page is requested. XSP works similarly
    to Macromedia ColdFusion, for those who are familiar with that technology.


    A small example of an XSP page, shown in Listing 9.8, demonstrates how useful
    this utility can be. We’ll use a small comma-delimited list of names, parse them,
    and output them from within our XSP-based application.


