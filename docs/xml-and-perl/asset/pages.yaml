  md: '# 214 Chapter 7 Transforming Miscellaneous Data Formats to XML (and Vice-Versa)


    Note that packages are not the same as files. Multiple packages can reside in
    one Perl file, however, you cannot spread a package across multiple files. Typically,
    there is one package per file. If you have one package in a file, you are required
    to name the file the same as the package, and the extension of the file must be
    .pm, which identifies a Perl module.


    Let''s take a look at Listing 7.7 and see how to create your own customized event
    handler package. Each of the handlers in the package are discussed in the following:


    Listing 7.7 Customized event handler package. (Filename: ch7_custom_handler.pl)


    ```

    1. package CustomHandler;

    2.

    3. sub new {

    4. my $class= ref $[0] || $[0];

    5. return bless {}, $class;

    6. }

    7.

    8. # start_document handler

    9. sub start_document {

    10. my $code_handler= shift;

    11. my $document= shift;

    12. }

    13.

    14. # end_document handler

    15. sub end_document {

    16. my $code_handler= shift;

    17. my $document= shift;

    18. }

    19.

    20. # start_element handler

    21. sub start_element {

    22. my $code_handler= shift;

    23. my $Element= shift;

    24. my $name= Element->(Name);

    25. my $atts= Element->(Attributes);

    26. print "<name";

    27.

    28. # Loop through all the attributes

    29. foreach my $att (sort keys %atts) {

    30. print "$att=''${atts->{$att}}''";

    31.

    32. print ">";

    33. }

    34.

    35. # characters handler

    ```'
