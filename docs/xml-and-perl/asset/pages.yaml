    This example demonstrates how to use XML::Parser in the stream mode to parse an
    XML document and to generate a report from the data contained in the XML document.
    We also defined the event handlers corresponding to the most important events.
    For additional information on the XML::Parser Perl module (including functions
    and attribute options), see the perldoc page that comes with its distribution.


    # SAX1—Simple API for XML Version 1


    What is the Simple API for XML (SAX)? SAX provides an event-based API to retrieve
    (that is, to parse) from an XML document. What is the data in an XML document?
    Depending on the task at hand, you may need to extract an element name, the character
    data inside an element, an attribute associated with a particular element, or
    all the above. The SAX API is implemented by a large number of XML parsers, including
    Apache Xerces, MSXXML from Microsoft, and the Oracle XML Parser.


    # SAX1 Event Handling


    How does the event handling inside a SAX processor work? The XML document is read
    sequentially (line by line), and the event-driven SAX processor calls a predefined
    subroutine (called an event handler in this case) whenever a particular condition
    (or set of conditions) is satisfied. The interface between the process and the
    event handlers is very user-friendly.


    For example, we can set event handlers that will be called by the SAX processor
    whenever it encounters any number of events. Here is a small subset of what the
    SAX processor considers to be an event:


    +   - The start of an XML document

    - The start tag of an element (<)

    - The end tag of an element (</)

