  md: '# What Are Web Services?


    Looking at the WSDL file, you''ll notice some familiar contents that include the
    web service URL, namespace, and its method(s). Now we''ll take a look at a SOAP::Lite-based
    example to invoke this web service with the WSDL file. The Perl application to
