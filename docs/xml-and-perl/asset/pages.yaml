  md: '# 66 Chapter 3 Event-Driven Parser Modules


    Using the SAX approach provides several advantages to parsing XML documents.


    +   - First, because you''re reading the XML document sequentially, the data that
    you''re parsing from the XML document is available as you process the file. This
    means that you don''t need to wait for the entire file to be processed before
    you start seeing your results.

    - Second, SAX works well with large files. Because the file is processed as it
    is being read, the entire file does not reside in memory all at once.

    - Third, the SAX processor doesn''t store any of the parsed data. The application
    does with the event handler inside the application is up to you, the developer.
    All that the SAX processor does is call the event handler and pass in the proper
    data as a parameter. Some people would consider this a disadvantage compared to
    other parsing methods (for example, tree-based parsers); however, I consider this
    to be an advantage. It provides a lot of flexibility and enables (almost forces)
    you to be a little creative while trying to parse a document. So, what you do
    of an event handler (what data you store, how you store it, and so forth) is up
    to you.


    Now we have a good understanding of SAX and what it does, let''s take a look at
    example of how it does it.


    # XML::Parser::PerSAX Perl Module


    One of the most popular Perl SAX processors is XML::Parser::PerSAX. XML::Parser::PerSAX
    is a Perl SAX parser written by Ken McLeod that was built using the XML::Parser
    module. The following example illustrates some of the SAX concepts that I discussed
    in the previous section and how to use XML::Parser::PerSAX to parse an XML document.


