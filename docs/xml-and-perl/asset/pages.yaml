  md: '![](img/e22859c8cc5393df3568af9529713fd6_370_0.png)


    # Glossary


    **Active Server Pages** See ASP.

    **ActivePerl** Popular, well-supported Perl distribution available for a number
    of platforms. Includes the Perl Package Manager (PPM) tool that simplifies Perl
    module installation and removal. This is the recommended Perl distribution if
    you are running on a Microsoft Windows-based platform named ActiveServer originally
    developed ActivePerl distribution. Their web site (and additional Perl development
    tools) can be found at http://www.activestate.com.


    **American Standard Code for Information Interchange** See ASCII.


    **API (Application Programming Interface)** An interface built into a software
    package that enables other applications to use the package. For example, when
    you use a Perl module, you are interacting with the module through an API.


    **Application Programming Interface** See API.


    **ASCII (American Standard Code for Information Interchange)** Standard defined
    by the American National Standards Institute (ANSI) that defines a coded character
    set based on 7-bit coded characters. Each character is assigned a unique number
    ranging from 0 to 127. The characters assigned to 0–31 are non-printing control
    characters, and values 32–127 are assigned to letters, numbers, and other symbols.'
