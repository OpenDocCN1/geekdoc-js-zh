    XML parsers.


    # XML::Simple Perl Module


    Back in Chapter 2, "Now''s Get Our Hands Dirty," you saw a small example using
    the XML::Simple Perl module to parse a document. In this section, we''ll discuss
    another example using the XML::Simple Perl module and explain the XML::Simple
    API and some of the more useful options.


    The XML::Simple Perl module was written by Grant McClean. As an XML parser module,
    it is (as you may have guessed from the name) very simple to use. XML::Simple
    provides an easy-to-use API and is built on the XML::Parser module in Chapter
    3. It is ideal for small XML documents, such as configuration files, and in any
    other situation when you don''t need additional features, just a simple, easy-to-use
    parser. Let''s take a look at an example of how to use the XML::Simple Perl module.


    # XML::Simple Perl Module Example


    Some of our work involves working with databases, usually through the Perl Database
    Interface (DBI). The Perl DBI provides a consistent, database-independent interface
    to an application, regardless of the database is being used. This means that a
    database application using the Perl DBI can use a consistent interface for a number
    of databases. This is a powerful capability that enables you to develop a very
    flexible application. The same application (with literally one line change) can
    access an Oracle database, a Microsoft SQL Server database, or the open-source
    MySQL database. Using the Perl DBI and an XML parser or generator module provides
    a strong foundation for a number of applications.


    > Note We will be discussing the Perl DBI in Chapter 6, "Generating XML Documents
    from Databases." If you can''t wait until Chapter 6 for this discussion of the
    Perl DBI, take a look at the official Perl DBI page http://dbi.perl.org.'
