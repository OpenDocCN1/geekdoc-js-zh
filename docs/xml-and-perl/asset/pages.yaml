  md: '![](img/e22859c8cc5393df3568af9529713fd6_309_0.png)


    Figure 10.1 Web services protocols interaction.


    As you can see in Figure 10.1, we have a web services provider, a web services
    directory, and a web services client. The first step shown in Figure 10.1 is labeled
    with the "1" and shows the exchange using UDDI between a web services provider
    and a web services directory. A web services provider registers a web service
    using UDDI with a web services directory, so that web services clients can locate
    the web service. After the service has been registered with the web services directory,
    a web services client can locate the web service by searching the web services
    directory. This is labeled as "2" in Figure 10.1. The web services client receives
    a WSDL XML document that provides all the required connection information. After
    the web services client has connect to the web services provider. Later in this
    chapter, I will show examples of web services clients connecting to the web services
    providers.


    As you can see, the web services directory has a function similar to a Domain
    Name Server (DNS). Usually, if your PC or workstation tries to ping a host on
    the Internet (let''s say www.newreaders.com), your PC or workstation first queries
    a DNS server and asks for the equivalent IP address. That because PCs, workstations,
    and routers use IP addresses rather than hostnames. In the case of web services,
    we are asking the web services directory which web services provider offers a
    particular service and what information do I need to connect to.'
