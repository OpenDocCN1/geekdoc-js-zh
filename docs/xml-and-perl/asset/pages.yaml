- img_proc: true
  md: '# Web Service Protocols


    Web services use XML messaging as a means of communication. Because they use XML,
    web services and the language used to implement them are transparent to the platform
    on which they reside. This way, any application running on any platform and written
    in almost any programming language can communicate with an XML-based web service.


    The three major protocols involved with web services are Simple Object Access
    Protocol (SOAP); Universal Description, Discovery, and Integration Protocol (UDDI);
    and Web Services Description Language (WSDL). In this section, I''ll briefly discuss
    each of these protocols.


    # Simple Object Access Protocol


    Microsoft, Develop-Mentor, and Dave Winer developed a new protocol named SOAP
    to address the shortcomings of the previous approaches to distributing services.
    Version 1.0 of the SOAP specification was released in 1998. The W3C took development
    of the standard and released version 1.2 in July 2001.


    SOAP is an XML-based messaging protocol that was designed to facilitate exchanging
    structure information using the web or a web-like environment (that is, decentralized).
    SOAP messages are XML documents that are transported and forth between servers
    and clients. SOAP can use a variety of network protocols to connect to web services,
    including HTTP, POP3, FTP, and SMTP. SOAP can also be used in a variety of applications
    that require XML messaging. I''ll only discuss the most popular usage of SOAP,
    which is its facility for remote method invocation over HTTP. SOAP is cross-platform,
    as long as the programming language you use has the SOAP facilities. Even if your
    favorite programming language doesn''t have the SOAP API, you can contribute to
    the open source community by writing your version of the SOAP API. SOAP specifications
    are open source and available at http://www.w3.org for anyone to implement.


    What is great about SOAP? It combines the best of both worlds by using the capabilities
    of XML with the transport capability of HTTP. By taking advantage of both of these
    open standards, SOAP eliminates the data transport problems associated with EDI
    and the interoperability problems associated with CORBA, RMI, and DCOM. Just as
    XML separates data from the presentation of the data, SOAP separates data from
    the underlying transport protocol. In the next section, we''ll take a look at
    the format of a SOAP message.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# What Are Web Services?


    # Format of a SOAP Message


    A SOAP message is an XML document that follows a particular format. The SOAP message
    format has the following sections:


    +   - Envelope (required)—The SOAP message envelope is actually the mandatory
    root element named `<Envelope>` of the SOAP message.

    - Header (optional)—The SOAP message `<Header>` element is an optional component
    of a SOAP message. The `<Header>` element is used to instruct SOAP servers to
    perform some specialized processing before sending the SOAP message out to the
    next destination. An example of a `<Header>` element instruction would be to instruct
    a SOAP server to add some security-related information for authentication.

    - Body (required)—The `<body>` element of a SOAP message contains the transported
    XML document.


    # Universal Description, Discovery, and Integration Protocol


    The Universal Description, Discovery, and Integration (UDDI) protocol is used
    to describe components of web services. After a web service has been described
    using UDDI, it can be registered with an Internet directory that advertises the
    web service. The Internet directories enable businesses to advertise their web
    services and find other web services. The major benefit of UDDI is that it provides
    a global and platform-independent method of describing and discovering web services.


    # Web Services Description Language


    The Web Services Description Language (WSDL) standard is an XML-based standard
    used to describe web services. WSDL defines XML grammar that describes both the
    interface and implementation details of web services. It is important to note
    that WSDL standards describing web services regardless of the message format or
    protocol that is used.


    # Relationship Between Web Services Protocols


    Now that I''ve introduced you to the web services protocols, let''s take a look
    at how they work together to support web services. Figure 10.1 shows the interaction
    between web services protocols.'
