  md: '# What Is an XSLT Processor?


    Because XSLT is an XML-based standard, XSLT processors are available for all the
    major programming languages (for example, C/C++, Java, and of course, Perl?) Several
    Perl modules exist (for example, XML::LibXSLT and XML::Sablotron) that perform
    XSLT processing, and I’ll present examples of the most popular modules a little
    bit later in this chapter.


    Looking back at Figure 8.1, recall that the XSLT processor accepts an XML document
    or a DOM-like tree and an XSLT stylesheet as input and then generates output based
    on the rules in the XSLT stylesheet. All XSLT processors follow several basic
    steps:


    +   1. First, the XSLT processor requires that the input is converted (by parsing)
    into a DOM-like tree. Some XSLT processors perform the parsing themselves, while
    others expect the tree structure as input. Either way, the XSLT processor then
    parses the stylesheet and stores the contents in another tree. For our discussion,
    let’s call this the XSLT tree. If you remember, tree-based parsing was discussed
    back in Chapter 4.

    2. Second, the XSLT processor parses the input XML document and stores the contents
    in a separate tree structure. For this discussion, let’s call this the XML document
    tree.

    3. Finally, the XSLT processor uses the template specified by the <xsl:template>
    element(s) in the XSLT tree and finds the corresponding elements in the XML input
    document tree. In our simple example, we only had one <xsl:template> element and
    it was <xsl:template match="/>, so we basically matched the entire XML input document
    tree. In a more advanced stylesheet, the XSLT processor would walk through the
    XSLT tree and for each new <xsl:template> it encountered, it would recursively
    search the XML input document tree for matching elements.


    We’ve had a chance to walk through the mechanics of a generic XSLT processor,
    but we haven''t mentioned anything about Perl. So, let’s take a look at a few
    examples using the different Perl XSLT modules that are currently available.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# XML::XPath Perl Module


    The XML::XPath module was written by Matt Sergeant and provides access to the
    contents of an XML document using the XPath standard. XML::XPath was developed
    to strictly comply with the XPath standard. The strict compliance to the standard
    is important because you''re familiar with the standard, it is very easy to use
    this module. However, the design of the module is open enough so that users can
    expand the base functionality by adding additional functions. Let''s take a look
    at an example.


    # XML::XPath Perl Module Example


    Let''s say that you''re part of the Information Technology (IT) staff and you''ve
    been given the task of analyzing the traffic on your network. Your company recently
    purchased a sniffer software package that records all the traffic and stores the
    recorded traffic in an XML document. Your specific task is to generate a report
    that shows a breakdown of the traffic on your network. In addition, you need to
    identify the hosts that generate the most network traffic and separate the traffic
    by protocol (for example, HyperText Transfer Protocol (HTTP), Simple Mail Transfer
    Protocol (SMTP), File Transfer Protocol (FTP), and so forth.


    The recently purchased sniffer software package works as expected; however, it
    doesn''t generate the reports you''ve been asked to generate. So, you need to
    process the XML document and produce a report that summarizes the contents. To
    generate this report, you''ve decided to use the XML::XPath module. The XML::XPath
    module enables you to quickly search the XML document and generate the required
    statistics.


    # Input XML Log File Format


    With all our examples, the first step is to look at the format of the input XML
    document. The DTD for the input XML document is shown in Listing 8.7, and the
    corresponding XML schema is shown in Listing 8.8.


    Listing 8.7 DTD for the network sniffer XML log file.

    (Filename: ch8_xpath_network_traffic.dtd)


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <!ELEMENT network_traffic (packet)>

    <!ELEMENT packet (src, dst, protocol)>

    <!ELEMENT PCDATA (#PCDATA)>

    <!ELEMENT src (#PCDATA)>

    <!ELEMENT dst (#PCDATA)>

    <!ELEMENT protocol (#PCDATA)>

    ```'
