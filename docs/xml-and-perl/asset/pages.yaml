  md: '# Perl Portability


    One of the greatest benefits of using Perl is the fact that it is available for
    just about every operating system in today. It is usually included as part of
    the standard distribution with Unix operating systems; but if not, both source
    code and binary downloads are readily available. Binary distributions of Perl
    are available for more than 50 platforms,


    ```

    http://www.perl.com/CPAN/ports/index.html for the list.

    ```


    You can visit a number of web sites to download a binary distribution of Perl
    if it wasn''t included with your operating system. You can download either source
    code or binary distributions at http://www.cpan.org.

    ://www.perl.com, or from any number of mirror sites. Usually, if you''re running
    a Unix-based system, it''s best to download the source code and recompile Perl—this
    assures that you are getting the latest (and greatest) version. If you are using
    a Microsoft Windows-based system, then I recommend using the Perl distribution
    from ActiveState


    ```

    http://www.activestate.com.

    ```


    # Web Programming


    As dynamic content comes into mainstream web programming, Perl has quickly and
    surely taken over the market of Common Gateway Interface (CGI) programming, designed
    to interface between the server side and the client side of the web. Although
    many technologies now exist (such as Java Servlets, Java Server Pages (JSPs),
    Active Server Pages (ASPs), Personal Home Pages (PHPs), Perl continues to dominate
    the web server-side programming market due to its data processing facilities and
    ease of use. Because the web is all about processing and displaying data, Perl
    naturally fills that position. Even though other technologies (such as Java Servlets)
    have some benefits over CGI, there are several strong reasons to use Perl. Mod_perl
    was developed as an answer to the newer technologies, such as JSP, ASP, Java Servlets,
    and PHP. PHP: Mod_perl is an Apache web server plugin module, which provides a
    built-in Perl interpreter. By using the mod_perl interpreter, scripts can benefit
    from directly accessing the server API while running much faster and more efficiently.
    A few technologies also exist to enable the embedding of Perl into HTML to complement
    technologies like ASP, JSP, and PHP.'
