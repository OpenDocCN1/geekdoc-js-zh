    # AxKit


    # Chapter Roadmap


    In this chapter we discuss installation, configuration, and use of the AxKit XML
    application and document server. AxKit is an application and document server that
    uses XML processing to generate content for delivery to several different types
    of clients (for example, web browsers or other applications).


    To run the example discussed in this chapter, you need to install the following
    components:


    +   - Apache web server

    - AxKit

    - mod_perl

    - LibXML2

    - LibXSLT2

    - XML::LibXML Perl module

    - XML::LibXSLT Perl module


    If you have any questions about Perl modules (for example, where to get them,
    how to install them, and so forth), please refer to Appendix B, "Perl Essentials."'
  merge: -1
