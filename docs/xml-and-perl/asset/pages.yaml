  md: "# Developing a Custom Event Handler 213\n\nDoing so, we'll appropriately use\
    \ these properties for the output XML file elements.\n\n```\n<Expense_Report>\n\
    \  <Expense>\n  </Expense>\n</Expense_Report>\n```\n\nNote that the rest of the\
    \ <record> element's children directly correspond to the first row headings in\
    \ the Microsoft Excel spreadsheet.\n\nWe've now see how easily you can convert\
    \ both CSV and Microsoft Excel to XML. Both the XML::SAXDriver::CSV and XML::SAXDriver::\
    \ modules provide a simple, flexible interface.\n\nAs flexible as these modules,\
    \ there are times when we may need to extend the functionality of one of these\
    \ modules to accomplish a more complex task. If so, you'll need to develop your\
    \ own custom event handler. I'll demonstrate how to write your own custom event\
    \ handler in the next section.\n\n# Developing a Custom Event Handler\n\nThere\
    \ may be situations when the standard event handler modules won't support what\
    \ you need to do. For example, let's say that you want to combine standard event\
    \ handling with regular expression matching, substitutions, or state management.\
    \ These are tasks that aren't supported by the standard event handlers.\n\nDepending\
    \ on the requirements, the standard event handler may seem somewhat limited. To\
    \ get around the limitations of the standard event handler, we can create our\
    \ own SAX handler. This handler will use the SAX interface to manipulate and generate\
    \ XML data. It's very simple as long as the standard method names are used for\
    \ different events. Each method can be customized to fit out our needs on a specific\
    \ project. Let's take a look at an example.\n\n# Custom Event Handler Package\
    \ Example\n\nIn this example, we're going to create a customized event handler\
    \ as a package. What is a package? A package is a block of Perl source code that\
    \ is assigned its own namespace. Because the package is assigned to its own namespace,\
    \ there can't be any conflicts with an application (for example, duplicate variable\
    \ names)."
