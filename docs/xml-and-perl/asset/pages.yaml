- img_proc: true
  md: "# XML::SAX::Base\n\nIf you are writing a SAX parser, driver, handler, or filter,\
    \ this is the class you need to become familiar with to make your software compliant\
    \ with Perl SAX2. XML::SAX::Base is a base class that can be inherited in your\
    \ program. It eliminates lot of redundancy and hassle in writing some of the common\
    \ SAX handlers and routines. To inherit from it, you would simply insert the following\
    \ line in your code.\n\n```\nuse base qw(XML::SAX::Base);\n```\n\nThis gives your\
    \ program default SAX2 functions and properties. Now, you develop your own handlers\
    \ or other functions that need customization, you can use the following template\
    \ technique:\n\n```\npackage MyHandler;\nuse base qw(XML::SAX::Base);\nsub start_element\
    \ {\n  my $self = shift;\n  #Do your processing here\n  $self->SUPER::start_element(@);\n\
    }\n```\n\nFor more information on XML::SAX::Base, please see the perldoc XML::SAX::Base\
    \ documentation. If you are interested in developing SAX2 modules, you can find\
    \ developer's documentation at http://www.perl.ml.net/sax.\n\n# XML::SAX::ParserFactory\n\
    \nIf you are familiar with database processing in Perl and have used the DBI module,\
    \ you will that the same problem existed in world due to the diversity of databases\
    \ and drivers necessary for accessing those databases. The DBI module solved that\
    \ problem by providing a common interface to all the database-specific drivers.\
    \ As a result of this effort, a majority of the databases in use today can be\
    \ easily accessed and queried using the same API, so it has become the \"Database\
    \ Independent Interface.\" Using the same methodology, the XML::SAX::ParserFactory\
    \ module was born. This object is used to return a SAX2 parser. Every time you\
    \ install a SAX2-compliant parser, it registers itself in a configuration file\
    \ named SAX.ini (which is installed with XML::SAX). This file is read by XML::SAX,\
    \ from the most recently installed to the earliest installed parser."
