  md: 'The XML::Xerces Perl module was developed by Jason Stewart and provides a Perl
    wrapper around the Xerces C library. One of the benefits of the XML::Xerces parser
    is that it is a validating parser. A validating parser ensures that the input
    XML document contains all the required elements and attributes that are defined
    in either the DTD or XML schema. If the XML document does not comply with the
    accompanying DTD or schema, the XML::Xerces parser will issue a warning. In this
    section, we''ll take a look at an XML::Xerces example that uses SAX2 API.


    # XML::Xerces Perl Module Application


    This example demonstrates how to use the XML::Xerces Perl module to parse an XML
    document and generate a report. For this example, we''ll design an XML document
    that contains information collected during Automated Teller Machine (ATM) transactions.
    The XML document should contain basic information, such as customer name, account
    number, transaction type, and money amount.


    The output report for this application presents all the transactions for a day
    in an easy-to-read format. Also, it counts the total number of transactions for
    the day and the sum amount of money deposited and withdrawn from ATM.


    # Developing the Application


    The first step in the application development is to define the input data format.
