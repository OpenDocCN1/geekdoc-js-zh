  md: 'Even though this was a simple example, you should be able to see that the Perl
    DBI is a very powerful tool, especially when combined with the XML modules that
    I''ll discuss in the following sections. Let''s start by looking at the XML::Generator::DBI
    module. It generates XML data based on the results of a SQL query.


    # XML::Generator::DBI Perl Module


    One of the most frequently performed tasks while integrating XML and RDBMS formats
    is transforming the query results returned by the database engine into XML data
    (either in memory, or written out in the form of an XML document). As I discussed
    earlier, the Perl DBI is a database-independent interface for accessing databases.
    It enables you to run SQL queries to extract data from a DBMS and returns this
    in a Perl data structure. You can convert the results of a SQL query into XML
    by using the Perl::DBI::Generator module that was written by Matt Sergeant.


    This module enables you to generate Simple API for XML (SAX) events that are created
    as the result of a SQL query to a RDBMS. Basically, this facilitates the transformation
    of the results of a SQL RDBMS directly to XML.


    The XML output can be customized by setting attributes when you instantiate an
    XML::DBI::Generator object. With the desired attributes set, you can make the
    SQL query, and using a handler module (for example, XML::Handler::YAWriter), you
    can generate the SQL query results in XML. The module''s wide range of supported
    attributes provides a number of different options. However, if this module still
    does not support something you need to do, you can easily write your own handler
    and customize the behavior. This demonstrates the power and flexibility of SAX-based
    XML parsing.


    Let''s look at a scenario where XML::Generator::DBI can be put to work. We purposely
    avoided using a RDBMS in this first example; this scenario demonstrates the utility
    of the XML::Generator::DBI Perl module. Depending on the RDBMS you select, setup
    can range anywhere from trivial to challenging. I''ll incorporate a RDBMS into
    a later example.


    This first example uses a standard Comma Separated Value (CSV) file as our flat
    file database system. DBI has a driver for CSV that can manipulate the file as
    if it were a RDBMS. This example only requires installation of the Perl DBI and
    DBD::CSV modules.'
