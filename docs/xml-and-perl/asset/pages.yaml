  md: "# XSLT Introduction 233\n\n```\n17. </html>\n18. </template>\n19.\n20. </xsl:stylesheet>\n\
    ```\n\n1–2 The first important property of XSLT stylesheet that you should be\
    \ aware of on line 1. An XSLT stylesheet is an XML document. This is important\
    \ for a few reasons. First, it is important because an XML parser can read the\
    \ XSLT stylesheet—that is, it is in an already understood and well-defined format.\
    \ Second, because the XSLT stylesheet is an XML document, it must follow all the\
    \ rules related to format and content as any other XML document does. Because\
    \ you are not familiar with the format of an XML document (that is, elements,\
