    made up of four child elements: <name>, <team>, <home_runs>, and <batting_average>.
    So, when parsing the XML document, the <career_statistics> and <player> elements
    do not contain any character data, but rather other elements—their child elements.
    After the <name>, <team>, <home_runs>, and <batting_average> elements are encountered,
    the parser can extract the character data contained by each element. Of course,
    more complex scenarios exist in which elements elements contain attributes, character
