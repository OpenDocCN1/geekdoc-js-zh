  md: '# Additional AxKit Tools


    AxKit includes a large number of tools. Unfortunately, I can''t discuss all the
    features in detail (that would require another book); however, in the next section,
    I discuss the most widely used options.


    # XPathScript


    XPathScript is a stylesheet language for transformations that can act as a replacement
    for XSLT that was written by Matt Sergeant. The advantage of XPathScript over
    XSLT is that it enables you to embed Perl and XPath expressions within XML documents.
    This combines the power of XSLT with a programming language for dynamic content
    creation comparable to Active Server Pages (ASP), JavaServer Pages (JSP), and
    PHP.


    XPathScript is the same way you use an XSLT stylesheet. The XPathScript stylesheet
    is specified using <?xml-stylesheet...> construct in the XML document. Let''s
    modify the XML document used in the previous example to use XPathScript and demonstrate
    how it works. To demonstrate the dynamic capability of XPathScript, we''ll add
    today''s local time to the bottom of the output.


    We''ll first modify the ch9-resume.xml file to include the new stylesheet path.
    Let''s replace this line in the XML document containing the resume:


    ```

    <?xml-stylesheet href="ch9-resume.xslt" type="text/xsl"?

    ```


    with the following:


    ```

    <?xml-stylesheet href="ch9-resume.xps" type="application/x-xpathscript"

    title="default" alternate="no"?>

    ```


    We now need to write XPathScript to transform the resume.xml (shown in Listing
    9.6) and return proper output similar to our previous one (shown in Listing 9.7).


    > Listing 9.6 XPathScript used to transform the XML document containing a resume.
    (Filename: ch9-resume.xps)


    ```

    <html>

    <body>

    <center>

    <h2>

    &lt;= join('' '', findvalue(''/resume/name/@first''),

    findvalue(''/resume/name/@middle''),

    findvalue(''/resume/name/@last''));

    </h2>

    ```'
