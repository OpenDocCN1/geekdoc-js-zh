    Perl is available at no cost to users. The original developer of Perl, Larry Wall,
    believed in an open distribution policy. As a result, Perl is developed and supported
    by a worldwide network of volunteers. They are (as they say on the Perl web page)
    "committed to producing better software for free than you could hope to purchase
    for money." Perl is distributed as part of the GNU software project, but Perl
    usually falls under a more open license.


    # Excellent Support from the Perl Community


    Perl is developed and maintained by a community of open-source developers. The
    Comprehensive Perl Archive Network (CPAN) at http://www.cpan.org houses thousands
    of Perl modules and scripts, developed by many authors, that deal with just any
    task at hand. If you need a Perl module to perform a particular task, chances
    it already exists on CPAN.


    A few companies offer Perl distributions along with support. Some have even developed
