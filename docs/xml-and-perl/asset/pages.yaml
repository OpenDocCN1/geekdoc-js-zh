    # Why Convert Another Data Format to XML?


    XML is everywhere. You see it online, read about it in publications, see it in
    the bookstore, and that''s just the beginning. XML has quickly become the de facto
    way for applications to communicate. Although XML enjoys huge popularity, it is
    just now beginning to be widely implemented in applications; new standards are
    evolving almost weekly, and the technology still isn''t even close to reaching
    its full potential.


    Now, you might ask, how does this apply to this chapter? XML is powerful and there
    are numerous tools available to make it work. A majority of new applications are
    incorporating XML as the primary data interchange and data storage format. Given
    that, most applications that want to seamlessly integrate into the applications
    that utilize XML must adapt to the XML standard. Many legacy applications are
    still deployed use either their native binary format or other widely adopted data
    formats to communicate. One of the most popular formats is CSV. CSV-formatted
    documents are just plain text, it is an easy format to adopt. One problem with
    CSV is that the data is not structured and can''t be easily described, as it can
    with XML.


    Another format that is commonly used and distributed among users on Microsoft
    Windows platforms is the binary Excel format. Microsoft Excel is a spreadsheet
    application that supports data input, manipulation, and storage. This being the
    case, many applications enable users to enter their data in Excel and then upload
    it into the system by accepting the binary Microsoft Excel files as input.'
  merge: -1
