  md: '# 228 Chapter 8 XML Transformation and Filtering


    As far as XPath is concerned, there are seven types of nodes that might appear
    in the node tree. All the different types of XML objects (for example, elements,
    attributes, and so forth) are mapped to node types in the tree. The seven types
    are


    +   - Root node—Appears only once in a tree because there is only one element
    in an XML document. Note that the root node does not have a parent.

    - Element node—Every element in the input XML document will have a corresponding
    element node in the node tree (for example, <name> in Listing 8.1). Note that
    an element has a parent and may have child nodes.

    - Attribute node—Every attribute in the document appears as an attribute node
    in the tree (for example, the type attribute in Listing 8.1).

    - Text node—Contains the text from an element (for example, "Joseph" from the
    first <name> element in Listing 8.1). Note that a text node has a parent but cannot
    have any children.

    - Comment node—Contains the text from the comment nodes, minus the opening <!--
    and the closing -> (for example, "Dan had a busy week!"). Note that comment nodes
    have a parent but don''t have children.

    - Processing Instruction (PI) node—Provided so XML can pass additional information
    to a processor that may read the XML document. Remember, a PI node starts with
    "<?" and ends with "?>". The contents of the PI in the node tree does not include
    the "<?" and "?>" that surround the instruction. In Listing 8.1, the PI is version="1.0"
    encoding="UTF-8".

    - Namespace node—Represents the namespace on an element or node. Each namespace
    node has a parent element but isn''t considered to be a child of that parent (that
    is, the parent doesn''t consider the namespace to be a child).


    XPath expression contains the information required to match an XML object, such
    as an element or an attribute. The format of the expressions is similar to the
    paths used in a Unix filesystem, where the "/" represents the root element, and
    other directories can be specified by using their path. For example, on a Unix
    machine, the path /home/mark/xml would point to the xml directory in the mark
    directory, which is part of the home directory.'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# XSLT Introduction 229


    Let''s try and look at a few simple XPath expressions are based on the XML document
    shown in Listing 8.1. A majority of your XPath expressions refer to the root node,
    element nodes, or attribute nodes. Let''s take a look at the XPath expressions
    required to access each of these node types.


    # Retrieving the Root Node


    The simplest XPath expression is “/", which would match on the root node. Because
    this XPath expression would match the entire document, the result returned by
    this XPath expression would be the entire XML document except for the Pl at the
    top of the XML document.


    # Retrieving Element Nodes


    XPath expressions can be used to match groups of element nodes, or an individual
    element node. For example, the XPath expression /timesheet/ would match on all
    the employee nodes of the current context node. At this point, the context node
    is timesheet, so we''ll retrieve all the employee elements and their children.
    In our case, that would be the following:


    ```

    <employee type="salary">

    <name>Joseph</name>

    <project>Book development</project>

    <hours>48</hours>

    </employee>

    <employee type="hourly">

    <name>Kayla</name>

    <project>Editing</project>

    <hours>45</hours>

    </employee> -- NODE --

    <employee type="hourly">

    <name>Marijo</name>

    <project>Artwork</project>

    <hours>45</hours>

    </employee> -- NODE --

    <employee type="salary">

    <!-- Dan had a busy week, as usual! -->

    <name>Dan</name>

    <project>Indexing</project>

    <hours>70</hours>

    </employee>

    ```


    If we want to go one layer deeper into the XML document and retrieve all the name
    nodes in the tree, we could use nearly the same XPath expression as the previous
    example; however, we''d add one additional branch onto the tree.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# 230 Chapter 8 XML Transformation and Filtering


    For example, the XPath expression /timesheet/employee/name would return all the
    name nodes from the node tree. In our case, the following elements would be returned:


    ```

    <name>Joseph</name>

    <name>Kayla</name>

    <name>Marijo</name>

    <name>Dan</name>

    ```


    We can retrieve a particular element node based on the name of the second employee
    in the node tree. If we wanted to find the following XPath expression: /timesheet/employee[2]/name.
    As you can see, we have an index on the employee node that tells which employee
    we''re interested in. Note that the index of the first occurrence starts at 1
    (for those of you who are used to arrays starting at 0). Using this XPath expression,
    the result would be


    ```

    <name>Kayla</name>

    ```


    # Retrieving Attribute Nodes


    Attributes can be retrieved using XPath by specifying the attribute name using
    the symbol "@”. For example, let''s say we want to retrieve the week attribute
    of root timesheet node. We can use the XPath expression /timesheet/@week="5/31"


    Attributes also be retrieved from a particular element node. For example, let''s
    say we want to retrieve the salary type of the second employee in the node tree.
    We can use the XPath expression /timesheet/employee[2]/@type, and the result will
    be


    ```

    type="hourly"

    ```


    Unfortunately, we can''t cover all the possible examples of XPath expressions.
    However, we''ve given you a few examples of the most widely used types of XPath
    expressions. For additional XPath information, take a look at the standard available
    online at http://www.w3.org/TR/xpath.


    # XSLT Stylesheets


    XSLT stylesheets are XML files that define the rules for the transformation between
    XML and other text formats. The XSLT stylesheets contain all the information regarding
    output content (that is, which elements and attributes you want to appear in the
    output document) and format (for example, colors, font, and so forth).'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# XSLT Introduction 231


    Note

    This is a very involved topic that can easily fill a book by itself (and there
    are already several available). Unfortunately, I don''t have the luxury of time
    (and paper) to go into great detail about XSLT stylesheets. However, I will present
    enough material to get you started and introduce the topic of XSLT stylesheets.
    However, combined with the XSL stylesheets used in the examples throughout this
    chapter, should provide you with a good understanding of the topic. A great book
    that you should add to your library is Inside XSLT, by Steven Holzner from New
    Riders.


    Let''s take a look at a sample XSLT stylesheet that converts an XML document to
    an HTML document containing a bullet list. However, I will start at the beginning
    of the process, so that you can see all the steps involved in developing a stylesheet.


    +   First, Listing 8.2 shows a DTD for a very simple XML document that will contain
    a listing of XML-related book titles. Because this DTD defines an XML document
    that is as simple as you can build, this is probably the equivalent of our "Hello
    World" example. As you can see, this XML document has a root element named <xml_library>
    and has one or more elements named <book>. Listing 8.3 shows the XML schema that
    describes the same document.


    Listing 8.2 DTD for the XML library document. (Filename: ch8_xml_library.dtd).


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <!ELEMENT xml_library (book*)>

    <!ELEMENT book (#PCDATA)>

    ```


    Listing 8.3 XML schema for the XML library document.

    (Filename: ch8_xml_library.xsd)


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema"

    elementFormDefault="qualified">

    <xs:element name="book" type="xs:string"/>

    <xs:element name="xml_library">

    <xs:complexType>

    <xs:sequence>

    <xs:element ref="book" maxOccurs="unbounded"/>

    </xs:sequence>

    </xs:complexType>

    </xs:element>

    </xs:schema>

    ```


    Listing 8.4 shows the XML document that was built using the DTD shown in Listing
    8.2. As you can see, it contains a short list of some of the XML-related books
