  md: '# Converting a CSV File to XML


    Let''s assume that you''ve recently developed an application that processes XML
    data and updates the address book for the corporate mail server. It has been widely
    accepted throughout the company. Recently, your company merged with another company
    and you''ve been asked to consolidate the address book data from several of their
    legacy mail servers into one corporate database. The problem is that the legacy
    mail servers have been in place long before anyone heard of XML, so they can only
    export data in CSV format.


    So, for this task, you will be given all the exported CSV address book, but you
    need to convert all the CSV data to XML before your application can process it.
    What''s the best way to approach this problem? There are several ways to solve
    this problem. One solution is to use the XML:SADriver::CSV module, so let''s take
    a closer look at how to do this.


    # XML::SADriver::CSV Perl Module-Based Example


    This example demonstrates the use of the XML:SADriver::CSV module that was written
    by Ilya Sterin (one of the authors) to cover our data from CSV to XML. This module
    supports stream-based conversions using a simple SAX-like interface. Because the
    XML:SADriver::CSV module is SAX2-compliant, the object properties resemble that
    of any SAX2 parser. That is one of the benefits of a SAX interface in the Perl
    modules—after you''re familiar with the interface, you''ll find that there are
    numerous applications for the interface. This module also provides options that
    can be utilized to customize the CSV to XML conversion. These module options are
    listed at the end of this section.


    To solve this problem, we''ll need to perform the following steps:


    +   1. Identify the input data format (that is, fields in the CSV file).

    2. Design the format of the output XML document.

    3. Develop the Perl program to convert between the two defined formats.


    Granted, these steps seem like common sense (and for the most part, they are),
    but you would be surprised how often people jump right into writing code. Things
    go a lot smoother when both the input and output formats are defined. Let''s take
    a look at the format of the incoming CSV file.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# CSV Input Data Format


    The CSV file exported from our legacy mail system contains customer address book
    information. Sometimes in an application as this, you won''t have the opportunity
    to design the content of the CSV file. It may come in only one format that may
    not support the format you''re planning to use. So, you may need to perform some
    manipulation (for example, delete fields, reorder fields, and so forth). Listing
    7.1 shows the input CSV file from the legacy mail server that contains sample
    address book entries.


    +   Listing 7.1 Sample address book records in CSV format.

    (Filename:ch7_address_book.csv)


    +   * First Name,Last Name,Nick,Title,Business Name,Address,City,State,Zip,

    * Phone Number 1, Number 2

    * Ilya,Stern,listerin,ch7,Unravelnet Software,3044 Per Dr.,

    * Farmington Hills,MI, 48334,247-555-1212,247-555-1213

    * Mark,Rieh1,mark,Developer,Software Company,4488 XML Street,

    * New Jersey,NJ, 08736,255-555-8856,255-555-1432


    The first row of the file contains the field names that identify the data each
    column in the CSV file. As mentioned earlier, each row of the CSV column represents
    one record. Now that we know the format of our input data, the next step is to
    design the structure of the XML output file.


    # CSV files and column headings


    Note that our example has column headings, however, this varies from application
    to application (that is, there aren''t any rules that say they''re required).
    So, don''t count on always having column headings to define the fields; sometimes,
    the column heading titles are defined in separate files. I''ve included column
    headings to illustrate a particular feature of the Perl module.


    # XML Output File Format


    Our application that converts CSV and XML uploads based on the field names that
    appear in the column names in the first row of the CSV file. These column names
    will be used as the names of our elements in the generated XML file. So, we need
    to verify that the column heading names are the element names we would like to
    use in the generated XML file. If not, we can either change the names of the column
    headings in the CSV file or perform a mapping in the conversion program.'
