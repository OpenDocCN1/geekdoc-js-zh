  md: '# Chapter 1 Basics of XML Processing in Perl


    +   - XPPointer—Enables you to specify a particular point or range in an XML document.
    XPinter is similar in concept to a URL. However, rather than pointing off to somewhere
    on a web server, the link points to data inside an XML document.


    +   - Cascading Style Sheet (CSS)—Enables you to specify how to display an XML
    document in a browser. CSS is a non-XML syntax that doesn''t change the content
    of the XML data, it only applies display rules to the existing XML data.


    +   - eensible Stylesheet Language (XSLT)—Supports transformation of an XML document
    into another format, whether it''s another XML document, an HTML page, or any
    data format (such as a small summary report generated from a large XML document).
    XSLT stylesheets rules (or templates) regarding format and content of an XML document.
    XSLT applies the templates found in XSLT stylesheet and applies them to an input
    XML document, generating a new document. The contents of the new document are
    XSLT stylesheet dependent, and the stylesheet can describe a new XML document,
    an HTML document, or any number of different output formats.


    +   - XPath—A language specification used to query XML data to locate and identify
    parts of XML documents that are specified using XPath expressions.


    +   - Document Object Model (DOM)—Defines a language independent (such as Perl,
    C++, or Java) method of storing structured documents in memory. Once stored in
    memory, an application can walk up and down the branches of the tree containing
    elements and attributes and easily retrieve or modify elements and attributes.


    +   - Simple API for XML (SAX)—Defines an interface for event-based XML parsing.
    The event-based parsing concept is a stream-based, sequential parsing model that
    enables you to parse XML data without storing the entire document in memory. Because
    it doesn''t store the entire XML document in memory, SAX is usually used to parse
    large documents.'
