- img_proc: true
  md: '# What Are Web Services?


    The term "web services" means different things to different people. From a technical
    point of view, web services describe a suite of protocols built upon XML and HyperText
    Transfer Protocol (HTTP). HTTP is widely available across the Internet and it
    is very well supported. Why use XML and HTTP? Well, we all know the benefits of
    XML when it comes to exchanging data. When combined with HTTP, XML can be used
    to describe both simple and sophisticated transactions between clients and services
    across the Internet. But before we actually discuss web services, let''s take
    a look back and see how and why they were developed.


    Throughout the short history of web programming, developers have created unique
    ways of allowing applications to communicate with one another. Most of the time,
    the developers of both systems would get together, define their interface, and
    then modify their applications to adapt to the new protocol. In many cases that
    worked fine, but the web is enormous and you can only imagine the complexity required
    if an application required a unique protocol to exchange information with a large
    number of other applications—you would need hundreds (if not thousands) of APIs
    to support this. The next section discusses the application of a simple web service.


    # Example of a Web Service


    Imagine that you are responsible for a web portal for a vacation resort. The web
    page includes resort-specific information, such as contact information, travel
    directions, and so forth. Now, as a convenient feature for potential customers,
    you''d like to display the current temperature in your city. There are several
    approaches to providing this information.


    +   - You can get a thermometer and update the temperature frequently (not very
    practical).

    - You can check http://www.weather.com and possibly have a link to the web site.

    - The third, and most practical, approach would be to provide live temperature
    information from another organization such as http://www.weather.com that provides
    weather information as a web service.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# What Are Web Services?


    Well, we''re in luck because http://www.weather.com does provide temperature information
    as a web service. Now you can easily add an interface to your application that
    will access her web service and retrieve the current temperature for your resort.
    This, whenever a customer looks at your web site, they''ll see the current temperature.
    Because http://www.weathercom provides the temperature service without any restrictions
    (that is, anyone can use it), you need to provide the service with some type of
    geographic information (that is, where you live), so it can provide the proper
    temperature reading. Whenever you make a temperature query, all you need to do
    is provide a zip or postal code; this, the service provider can look up the current
    weather in your area.


    # Exchanging Data on the Web


    One of the first approaches to exchanging data on the web was Electronic Data
    Exchange (EDI). EDI defined messages and protocols, but it didn''t define any
    network requirements. Unfortunately, the end result was a series of proprietary
    networks with limited memberships that were difficult to interconnect.

    Another approach to distributing information across the web attempted to build
    a distributed object infrastructure and distribute objects containing data. There
    were actually three implementations that built upon the idea of distributing objects.
    The three approaches were Common Object Request Broker Architecture (CORBA), Remote
    Method Invocation (RMI), and Distributed Component Object Model (DCOM). The problem
    with these approaches is that each implementation selected a different protocol
    to transport objects. For example, the CORBA developers decided to use Internet-ORB
    Protocol (IIOP), the DCOM developers decided to use Object Remote Procedure Call
    (ORPC), and the RMI developers decided to use Java Remote Method Protocol (JRMP).
    The major problem with these approaches was the lack of interoperability. Following
    this schema, CORBA could only communicate to CORBA, RMI could only communicate
    to RMI, and DCOM could only communicate to DCOM. None of the approaches could
    communicate directly to the web—each required an extra protocol layer that provided
    a special socket interface.


    As you can see, the early approaches to exchanging data on the web all had their
    own problems. To address most (if not all) of these problems, new XML-based protocols
    for web services were developed. The most important of these protocols is discussed
    in the next section.'
