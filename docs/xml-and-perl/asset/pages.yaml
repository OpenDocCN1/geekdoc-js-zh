  md: '# Components of an XML Document 32


    Elements can also be empty, and of course, they''re called empty elements. We
    can use the standard notation without any character data, such as `<book>`, or
    we can use a shorthand notation that consolidates the start and end tags into
    one tag, such as `<book/>`. Note that the forward slash appears after the element
    name in an empty element; it usually appears before the element name in an end
    tag.


    XML is case sensitive, so opening and closing tags for elements must use the same
    case. Either lower case or capital letters can be used (and even mixed case),
    however you must be consistent. For example, `<account>data</ACCOUNT>` is invalid.


    # Attributes


    Each element can also have one or more attributes associated with it. Attributes
    are usually used to store data that is relative to a particular instance of an
    element. An attribute has a name and value associated with it, and it appears
    as part of the element''s start tag. For example, the following is a valid attribute:


    ```

    <book isbn="0735712891">XML and Perl</book>

    ```


    As you can see, the <book> element has one attribute isbn, and the value of the
    attribute is "0735712891." As I mentioned earlier, the attribute is applicable
    to this particular element—another book element would have a different isbn value.
    Elements can have several attributes if required. Attributes within the start
    tag must be separated by at least one space:


    ```

    <book isbn="0735712891" price="$39.99">XML and Perl</book>

    ```


    Attribute values have to be quoted (single or double quotes are allowed). The
    quotes must match (i, be the same) for each attribute. For example, isbn="0735712891"
    price="$39.99" is ok, but isbn="0735712891" price="$39.99" isn''t.


    # Use of Attributes Versus Elements


    You could easily created <isbn> and <price> elements in the previous section and
    stored the values as character data rather than attributes. Why would you use
    an attribute instead of an element (or vice versa)? Well, there isn''t an easy
    answer to the question, and it is a popular topic on newsgroups or forums that
    provokes a lot of strong opinions about when to use an element versus when to
    use attribute. I might not be able to provide a definitive answer, but I can certainly
    provide a few suggestions. As you become more familiar with XML, you will get
    more comfortable with designing XML'
