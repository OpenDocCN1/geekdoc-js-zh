  md: '# 326 Appendix What Is XML?


    All XML documents need to be well-formed, but they don''t necessarily to be valid.
    It is good XML practice to develop and use a DTD or XML schema that defines your
    XML document whenever XML documents are being exchanged. Let''s say that your
    company exchanges information with other companies. In a situation as this, it
    is critical to agree on the data that will be exchanged, and then define a set
    of rules that govern the structure of the data in an XML document. After these
    rules are defined by a DTD or XML schema, the two companies can begin to exchange
    information in XML.


    Think of a DTD or XML schema as a contract between the companies that defines
    the structure and content of the XML document. This contract will help you verify
    that the XML documents you send to other companies are in the proper format (so
    that they''ll be able to process your XML documents with their applications).
    Also, this contract verifies that the XML documents you receive from other companies
    are in the proper format (so your applications will be able to process your XML
    documents). It may take some negotiating between the organizations to agree on
    structure and content, but all the benefits provided by XML make it worth the
    trouble.


    You can use XML documents in a number of cases that aren''t defined by a DTD or
    XML schema. For example, if you''re using XML for simple or small XML documents
    (for example, configuration/startup files) that aren''t exchanged between organizations,
    you may not need to develop a DTD or XML schema. As long as the XML documents
    are well-formed, they will suffice for particular applications.


    Note


    An interesting question that occasionally pops up is, "Are XML documents that
    don''t have a DTD or XML schema considered invalid?" The answer is no. An XML
    document is considered invalid if it doesn''t follow the corresponding DTD or
    XML schema. So, if an XML document doesn''t have a DTD or XML schema, it can''t
    be invalid.


    Let''s take a look at DTDs and XML schemas and how the rules that control the
    structure and contents of XML documents are specified. Both DTDs and XML schemas
    have advantages and disadvantages associated with them, and which one you use
    depends on your requirements. After I discuss DTDs and XML schemas, I will present
    a few advantages and disadvantages that will aid you in deciding which approach
    to use.'
  merge: -1
  pgno: 343
