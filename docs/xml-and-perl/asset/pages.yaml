- img_proc: true
  md: '![](img/e22859c8cc5393df3568af9529713fd6_132_0.png)


    **Figure 4.1** Notional tree-based XML parser.


    Tree-based XML parsers have a few differences from event-based parsers, which
    can be considered advantages (depending on your situation). First, a program built
    with a tree-based XML parser module is usually smaller than a program built with
    an event-based parser. This is due to the fact that you don''t have to generate
    event handlers to extract the information from the XML data. Also, you don''t
    need to store information extracted from the XML data for later processing (the
    tree-based parser stores the data for you). Second, tree-based parsers provide
    random access to the XML data. Let''s say you need to access the last element
    in an XML document. Using an event-based parser, you''ll need to handle events
    for every element in the document, searching for the element in which you''re
    interested. If you''re looking for a particular element with a tree-based parser,
    you can directly access the element as soon as the XML document has been parsed.


    # # Tree-Based XML Parser Modules


    Tree-based XML parsing is one of two most popular ways of parsing XML, along with
    stream-based parsing, which was discussed in Chapter 3. The Document Object Model
    (DOM) standard defines a standard way to parse and represent the XML data in a
    tree-based parser. Tree-based parsers are also called in-memory parsers, because
    unlike stream-based parsers, which iterate over'
  merge: -1
