  md: '# What Are Web Services?


    I think that you can now see the potential and usefulness of web services.

    The rest of the chapter concentrates on several examples that demonstrate

    hhow to access web services as well as how to develop your own web service.


    # Web Service SOAP Client Examples


    The SOAP::Lite Perl module provides a Perl API to SOAP and handles most

    of the low-level details for you. A SOAP server and a SOAP client are two

    applications that are usually (but aren''t required to be) running on different

    machine. A SOAP client sends a request to a SOAP server, the server

    processes the request, and returns the result to the SOAP client. In the case

    of Remote Procedure Calls (RPCs), the request sent by the SOAP client is

    actually to execute a function on the SOAP server. When the SOAP

    server receives the requests, it executes the requested function, packages it

    results in a SOAP message, and returns the results to the calling SOAP client.


    Earlier, I discussed a web service provider that would return the current

    tperature for a particular postal code. In the next section, I''m going to

    show how to build a Perl client that accesses a web service that provides

    temperature information.


    # SOAP Client


    In this section, we''ll build several SOAP clients using the SOAP::Lite Perl

    module. Don''t be misled by the name—the SOAP::Lite Perl module is a full

    and advanced implementation of SOAP.the word Lite in the module title

    applies to the Perl''s ease of use rather than its functionality.


    The first step in building a SOAP client is to determine the web service

    t we want to use. Where are publicly available SOAP servers, and what

    services do they offer? Due to the popularity of SOAP, a number of

    web service repositories have been created that contain information about

    available web services. (for example, where they are located) and provide the
    API

    documentation necessary to use them. One such web service repository

    at was particularly useful during the development of the book is

    http://www.methods.net. This web site provides a variety of web services

    it also provides information about web services available on other

    servers. Looking through the site, we found a web service provided by

    XMethods named Weather-Temperature. As you may have already guessed

    from the name, the Weather-Temperature service provides the current

    temperature based on a zip code.'
