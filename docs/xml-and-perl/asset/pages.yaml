    # XML::Xerces Perl Module


    The XML::Xerces Perl module provides a Perl API to the Xerces XML parser developed
    by the Apache Software Foundation. This is the same organization that develops
    and distributes the Apache web server. If you are familiar with their products,
    you know that the Apache Foundation has a well-deserved reputation for developing
    commercial-quality open source software that strictly follows the required standards.
    One of their most popular products is the Apache web server, which is the most
    widely used web server on the Internet.


    The Apache Xerces XML parser is another well-designed product. Xerces is very
    popular for several reasons. First, it follows the XML standards very strictly.
    Xerces follows the XML 1. specification and the related standards (for example,
    DOM 1.0, DOM 2.0, SAX 1.0, SAX 2.0, namespaces, and schemas). Second, it is available
    for a number of languages. Xerces parsers are available in Java, C++, and of course
    Perl. Third, Xerces is available on a number of platforms. Chances are, it is
    available for your platform. If for reason you can''t find a Xerces binary for
    your platform, the source code is available.'
