  md: '# Perl Modules


    Several Perl modules need to be installed to use AxKit. Some modules are required
    and others are optional depending on the functionality required. The installation
    of the Perl modules varies depending on the operating system and distribution
    of Perl that you''re using. I have provided instructions for installing Perl modules
    in Appendix B.


    Some Perl modules are required and others are optional. The required modules are


    +   - XML::LibXML

    - XML::LibXSLT

    - Digest::MD5 2.09 or higher

    - Compress::Zlib

    - Error 0.13 or higher

    - Apache::Request 0.32 or higher

    - HTTP::GTP 1.0 or higher


    A number of Perl modules are optional depending on which AxKit options you use
    in your particular situation. The following Perl modules are optional (that is,
    not required for our example):


    +   - XML::Parser 2.27 (not required in all cases, but nice to have for particular
    cases)

    - XML::XPath 1.00 or higher is required for XPath

    - XML::Sablotron 0.40


    Although I listed the required versions for most modules, time passes, later module
    versions might be required. As with all the modules in the book, I recommend you
    use the latest stable version available.


    # AxKit Perl Module Installation


    Several methods exist for installing the AxKit Perl module. The first method is
    the manual Perl module installation. This method requires you to download the
    Perl module as well as all the dependencies from CPAN (or a mirror site) and install
    all the modules in the proper order. This method is fairly standard and works
    on both Unix and Microsoft Windows operating systems. Remember, a compiler is
    required, and it must be the same compiler that was used to build Perl for your
    system. For additional information, please see the detailed Perl module installation
    instructions in Appendix B.'
  merge: -1
  pgno: 289
- img_proc: true
  md: "The second method of installing the AxKit Perl module is to use the CPAN.pm\
