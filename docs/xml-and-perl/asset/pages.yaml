  md: '# XML and Perl


    If you are a Perl programmer looking to explore Perl''s XML capabilities or an
    XML developer with a basic understanding of Perl, this book will provide you with
    all the tools required for XML processing with Perl. XML and Perl teaches you
    to create portable, powerful, and extensible applications when you use XML and
    Perl together. You''ll also learn to customize your XML facilities to accomplish
    unique.


    Mark Riehl and Ilya Sterin, who have written XML modules and administer the official
    Perl XML web site (www.perlxml.net), have filled this book with practical code
    samples and exercises that will help you test your new knowledge. With this book,
    you''ll quickly see the advantages of using XML and Perl together, and you''ll
    be able to perform even complicated tasks more easily with powerful XML modules.


    # With XML and Perl, you will learn how to:


    +   Parse, validate, and process XML documents in Perl


    +   Develop Perl programs using XML facilities


    +   Use and understand Perl SAX-based modules


    +   Use and understand DOM and other tree-based parsers


    +   Generate XML documents using Perl IO facilities and/or XML::Writer module


    +   Generate XML documents from databases


    +   Use SAX technology to convert data formats to XML


    +   Use XSLT and XPath modules to perform XML transformations with Perl


    +   Install, configure, and use AxKit XML application and document server to generate
    content


    > Mark Riehl has over 10 years of experience in development in a number of operating
    systems using Perl, XML and C/C++. Mark is a lead software engineers with Agile
    Communications, Inc.


    > Ilya Sterin has extensive experience in systems programming as well as software
    development using Perl, C/C++, and Java. He is a significant contributor to Perl
    and CPAN. He currently works as a senior developer for Ford Motor Company and
    runs Unravelnet, Inc.


    www.perlxml.net

