    subroutine. Even though this is a short subroutine, it can be tricky.

    The subroutine can be called multiple times for each encounter with character
    data. It is not recommended to use this subroutine for any action requiring a
    precise count of actions (for example, printing character, incrementing counters,
    and so forth). It is safe to store the actual value of the characters, regardless
    of how many times the handler is called, it will be passed the same value, and
