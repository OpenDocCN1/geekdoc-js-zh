    # Event-Driven Parser Modules


    # # Chapter Roadmap


    Now that we have covered some introductory material in the first two chapters,
    we''re going to discuss event-driven XML parser modules. Remember, the purpose
    of an XML parser is to parse XML data. Why would we want to do that? So that we
    can extract the important information (that is, the information contained between
    start and end tags) contained in the XML data.


    Note that I''m using the term XML data rather than XML file. That''s because XML
    data can exist in a number of formats—an actual tile file stored on a hard disk,
    data sent across a Transmission Control Protocol (TCP) or User Datagram Protocol
    (UDP) socket, or in memory as a dynamically generated result of a database query.
    No matter where the XML data resides, eventually someone will need to parse it.


    This chapter focuses on event-driven XML parser modules and how to easily develop
    Perl programs based on those modules. One of the modules that provides sequential
    event-driven access to XML data is XML::Parser. also incorporates other parsing
    models, I only demonstrate its stream style mode, which is in fact, the event-driven
    model. Other parsing models (for example, the DOM or tree-based parsers) are discussed
    in Chapter 4, "Tree-Based Parser Modules."'
