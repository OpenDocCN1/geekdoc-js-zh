  md: '# Defining the Structure and Content of an XML Document 327


    # Document Type Definition


    A DTD is a set of rules in non-XML format that defines the content and the structure
    of an XML document. The DTD describes the elements that appear in the XML document,
    parent-child relationships (that is, nesting), and also specifies which elements
    are required and which elements are optional.


    # XML Document Type Definition


    The easiest way to describe the structure of a DTD might be to walk through an
    example, starting with the input data, describing a DTD, and then building the
    corresponding XML document. For this example, let''s assume that you work for
    a financial institution and you''re working with the data generated by a series
    of daily bank transactions. Each transaction will contain the following information:


    +   - Account number

    - Name

    - Amount

    - Date

    - Transaction type: withdrawal or deposit


    # Tree Representation of Data


    Figure A.2 contains a tree structure that shows the relationship between several
    data elements. As you can see, each transaction has an attribute type (that is,
    withdrawal or deposit) associated with it and four child elements `<account_number>`,
    `<name>`, `<amount>`, and `<date>`. If you describe the data in terms of an XML
    document, the root element would be `<daily_activity>`, and it has multiple `<transaction>`
    child elements. The `<transaction>` element has a type attribute associated with
    it, and it has three child elements `<account_number>`, `<name>`, and `<amount>`.
    Now that you know the parent-child relationships between the data elements, let''s
    take a look at how to describe this in a DTD.'
  merge: -1
  pgno: 344
