  md: '# Installing the Required Software


    Our first task is to install all the software required to run the AxKit document
    server. Although Appendix B discusses Perl module installations, I think this
    is a unique enough case to cover it within the chapter, especially because you
    need to install other components. Here is a list of the required components,which
    can also be seen at the beginning of this chapter:


    +   - Apache web server

    - AxKit

    - mod_perl

    - LibXML2

    - LibXSLT

    - XML::LibXML Perl module

    - XML::LibXSLT Perl module


    In this section, we''ll discuss the installation instructions for each of the
    required components.


    # Apache Web Server and mod_perl Installation


    To publish web pages (either with or without AxKit), an HTTP server such as Apache
    needs to be installed, properly configured, and running. The Apache web server
    is the most powerful and popular web server in the world, and AxKit was specially
    designed to integrate tightly with Apache.

    For our installation, we''ll be using a version of the Apache web server that
    supports mod_perl which is an Apache plug-in Perl interpreter that integrates
    with the Apache web server. It provides many benefits over CGI scripting, including
    increased performance, efficiency, and a persistent environment.


    # Installing on Unix Systems


    Binaries are available for some Unix systems, but sometimes it is just as easy
    to recompile locally. This usually assures that you''re installing the latest
    version of the software. To compile a mod_perl-enabled Apache web server, you''ll
    first need to download the source code for both packages.\ Apache web server source
    code is available from:


    ```

    http://www.apache.org/dist/httpd

    ```


    The mod_perl source code is available from:

    http://perl.apache.org/dist/'
