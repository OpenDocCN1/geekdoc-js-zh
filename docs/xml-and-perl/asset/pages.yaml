  md: '# XML::Slabotron-Based Perl Filtering Program


    Because we have looked at the input XML document and the XSLT stylesheets, we
    know what the output of the transformation process should be. But, how do we do
    it? Let''s take a look at the XML::Slabotron-based Perl program shown in Listing
    8.19.


    Listing 8.19 XML::Slabotron Perl program that filters an input XML document.

    (Filename: ch8 sab_app.pl)


    ```

    use strict;

    use XML::Slabotron;


    # Open the XSLT stylesheets;

    open (XSLT, "ch8_sab_annual_report.xslt");

    def $;

    my $xslt = <XSLT>;

    close XSLT;


    # Open the input XML document.

    open (XML, "ch8_sab_annual_report.xml");

    def $;

    m $inputXML = <XML>;

    close XML;


    # Call the performTransform() subroutine, store the

    results in transformedDoc;

    my $transformedDoc = performTransform($xslt, $inputXML);


    # Write the results to an output file.

    open (XML_REPORT, "> ch8_sab_filtered_report.xml")

    or die "Can''t open ch8_sab_filtered_report.xml :!\n"

    print XML_REPORT $transformedDoc;

    close (XML_REPORT);


    ################################

    sub performTransform {

    my ($xslt, $xmlDoc) = @;


    # Instantiate the new Slabotron objects.

    my $sabObject = new XML::Slabotron;

    my $sitObject = new XML::Slabotron::Situation;


    # Pass the required arguments to the Slabotron objects.

    $sabObject->addArg($sitObject, ''xslt'', $xslt);

    $sabObject->addArg($sitObject, ''xml'', $xmlDoc);


    # Perform the transformation.

    $sabObject->process($sitObject, ''arg/xslt'', ''arg/xml'', ''arg/output'');

    ```'
