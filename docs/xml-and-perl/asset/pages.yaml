  md: '# XML::SAXDriver::Excel Perl Module


    I''ve demonstrated how to generate XML data from a CSV file. Now, we''re going
    to look at another SAX-based Perl module, XML::SAXDriver::Excel. As you may have
    already guessed from the name, this Perl module facilitates the conversion between
    standard Microsoft Excel spreadsheet files and XML. Why not save the Microsoft
    Excel spreadsheet file as CSV and use the Perl module that we discussed in the
    previous section? Well, you can do that. However, one situation when this module
    comes in handy is when you have a large number of Microsoft Excel spreadsheet
    files to convert to XML; this can save you the trouble of converting a large number
    of files to CSV format. Let''s take a look at an example of how to use this module.


    # Converting Microsoft Spreadsheet Files to XML


    Let''s assume your company has a financial application that tracks company expenses.
    This information is maintained for use by other applications within the company
    and is accessed by a reporting application that provides customized reports to
    users. As with any integration project, this data is best kept in XML format,
    so that any application (internal or external to your company) that needs access
    to the data can easily retrieve it. The problem is that most accountants not know
    XML, nor do they need to. One of their most widely used tools is Microsoft Excel,
    which is used to store, manipulate, and save their data. However, they occasionally
    need to upload their data to a database server to share the data with those within
    the company, however, it may be physically located at different geographical sites.
    One of the tools that you''ve developed provides an upload capability; however,
    your application requires XML as input. So, you will need to convert the Microsoft
    Excel spreadsheet files to XML format.


    What''s the best way to do this? As I mentioned earlier, you can save each Microsoft
    Excel spreadsheet file as a CSV file and use the XML::SAXDriver::CSV module. However,
    for large-scale conversions (that is, a large number of Microsoft Excel spreadsheet
    files), this would be too time consuming. Imagine how long it would take to open
    100 Microsoft spreadsheet files and save them as CSV; this is not an option. A
    better choice in this situation is to use the XML::SAXDriver::Excel Perl module
    to facilitate the conversion directly from a Microsoft Excel spreadsheet file
    to XML. Let''s take a look at how to do this conversion with an example.'
  merge: -1
  pgno: 226
