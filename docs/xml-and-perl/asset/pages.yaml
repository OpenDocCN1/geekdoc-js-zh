    This example was developed using a MySQL database. MySQL is an open source database
    available for a number of platforms from http://www.mysql.com. You can follow
    along with any RDBMS as long as the Perl DBL supports RDBMS (that is, a driver
    available for it). If you are using an RDBMS other than MySQL, you may need to
    modify the following SQL statements, but the majority of SQL standard-compliant
