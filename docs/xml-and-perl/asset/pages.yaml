- img_proc: true
  md: 'Components of an XML Document


    +   - XML is not a replacement for HTML. Both XML and HTML have the same ancestor,
    SGML. They perform different tasks. Remember, HTML combines data with the presentation
    of the data, while XML separates the data from the presentation.


    # Components of an XML Document


    So far, I have provided some background material and discussed some of the characteristics
    of XML, but you still don''t really know what makes up an XML document. In this
    section, I will discuss the components required to build an XML document and then
    present an XML document that illustrates the various components.


    # Types of Markup


    An XML document is a text file that consists of character data and markup. In
    the case of XML, there are several different constructs that are considered to
    be markup. A summary of these different constructs is shown in Table A.1.


    | Markup | Description |

    | --- | --- |

    | Start tag | Used to mark the beginning of a non-empty XML element (for example,
    `<address>`). Note that in an XML document, all start tags must have a corresponding
    end tag. |

    | End tag | Used to mark the end of a non-empty XML element (for example, `</address>`).
    Note the forward slash before the element name, which distinguishes an end tag
    from a start tag. Note that in XML, all end tags must have a corresponding start
    tag. |

    | Empty element tag | Identifies an empty element (for example, `<address/>`).
    Note that the forward slash appears after the element name. |

    | Character reference | Characters of languages that cannot be displayed with
    the standard ASCII character set can be represented using Unicode is a list of
    unique numbers that map to characters in any language. This enables you to insert
    native language characters into an XML document by using Unicode. For additional
    Unicode information, see `http://www.unicode.org`. |


    Table A.1 Summary of XML markup.


    continues'
