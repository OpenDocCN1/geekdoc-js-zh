  md: '# XML::DBMS Perl Module


    The XML::DBMS Perl module is middleware for transferring data between XML and
    relational databases. Originally written by Ronald Bourret as a Java library,
    it was later ported to Perl by Nick Semenov. In this section, I''ll be discussing
    version 1.1 of Although is a very powerful module, it is still lacking some important
    features. Most (if not all) of the missing features will be addressed in Version
    2.0.


    One of the missing features in the current version is type checking. The type-checking
    feature will allow users to transfer data between different database types. Using
    Version 1.1, you will have to manually manage the different data types. As of
    this writing, Version 2.0 is still in alpha stages, so I won''t discuss it here.
    As the development progresses, information becomes available on the official XML-DBMS
    website, http://www.rpbourret.com/xmldms/, as well as on a number of mailing lists.


    # XML::DBMS Perl Module Example


    Let''s revisit the scenario discussed earlier of transferring data from one database
    to another. The XML::DBMS Perl module can be used to develop a middleware component
    using a mapping syntax to bind database column names to XML elements and vice
    versa.


    In this example, we will use XML as an intermediate storage facility during the
    translation. Why might you ask, do I need an XML-based middleware if I can just
    query one database and insert it into another? Well, if you have simultaneous
    access to both databases, you can easily develop a Perl DBI-based application
    to perform that task. However, the problem is a little more difficult if you separate
    applications (to read the source database and another to write to the source database),
    or if they don''t have access to databases at the same time. Let''s say your company
    is teaming with another company to compete for a contract and you both need to
    exchange some of your research and development work, and both databases reside
    behind firewalls. You''ll need to use a two-step process to transfer the data.


    This example will consist of two databases, a source database named from_db and
    a destination database named to_db. The from_db database has a table named membership,
    and the to_db database has a table named user_info. For this example, we will
    use a middleware component to transfer the contents of the membership table in
    the from_db database to the user_info table in the to_db database. The process
    is illustrated in Figure 6.2.


    ![](img/e22859c8cc5393df3568af9529713fd6_202_0.png)'
