  md: '# SAX2


    SAX2 is the successor to the SAX1 standard Yes, it is a standard even though it
    is not published by W3C. It''s an XML community standard and, therefore, is well-defined
    and easily adapted to your needs. SAX2 has become the preferred way to stream
    process XML.


    The SAX1 standard was usable by many applications, but many programs required
    more information from the parser, and SAX1 did not address these issues. SAX2
    was created to address these issues. It exposes more parsing information to the
    application and, therefore, fills in the gap of SAX1.


    Most SAX development today has evolved around SAX2 specifications. Probably the
    only development you will see in the SAX2 arena is the actual upgrading and porting
    to the SAX2 interface. Perl''s SAX2 XML development has actually accelerated thanks
    to its relatively small but very dedicated community of module developers. As
    you will see through the rest of this chapter, SAX2 modules are very easy to use
    considering the power and flexibility they offer.


    # XML::SAX Perl Module


    As the SAX standard evolved, several Perl modules were developed that provided
    a SAX interface to the XML parser. If you were to look on Comprehensive Perl Archive
    Network (CPAN) now, you would find a variety of XML modules as well as a few SAX
    parsers. Even though SAX is a well-defined standard, it becomes difficult to make
    sure the Perl module is compliant with the latest specifications and provides
    a common API. To help solve this dilemma, three very generous individuals (Matt
    Sergeant, Robin Berjon, and Kip Hampton) donated their valuable time to develop
    the next generation SAX facility, XML::SAX package.


    > Note

    If you ever run into one of the module developers, just scream "DAAHUUT!" and
    you will feel right at home. It''s the official saying of Perl XML module developers,
    which evolved from an IRC channel.


    XML::SAX itself acts as a high-level interface to the SAX2-compliant parsers.
    XML::SAX module comes prepackaged with a few modules that provide different functionalities.
    They are the platform for SAX module and application development.'
  merge: -1
