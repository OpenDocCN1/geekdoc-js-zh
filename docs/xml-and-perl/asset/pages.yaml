  md: '# 10 Perl and XML Web Services


    Roadmap ter discusses web services and some of the Perl facilities that support
    r, I will discuss web services in general and how they are transforming Old Wide
    Web and all its applications. Then, I''ll briefly touch on several web service
    protocols available. Finally, I''ll discuss the two most impor widely used web-related
    protocols, the Simple Object Access Protocol and XML-Remote Procedure Protocol
    (XML-RPC). SOAP discussion includes examples built with the SOAP::Lite module,
    the SOAP implementation module that includes some additional quality. Examples
    include a SOAP daemon and client, as well as on using SOAP::Lite with web service
    applications that utilize the services Description Language (WSDL). RPC is another
    protocol for the Frontier::RPC Perl module. I will discuss the samples that utilize
    the Frontier::RPC Perl module. discuss the ges and disadvantages of both SOAP
    and XML-RPC and give you background that will allow you to choose the right approach
    for implementation.'
