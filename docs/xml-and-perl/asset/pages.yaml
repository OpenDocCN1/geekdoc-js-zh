- img_proc: true
  md: '# XML Transformation and Filtering


    # Chapter Roadmap


    This chapter discusses XML transformation and filtering. XML transformation is
    the process of converting an XML document into one or more output documents. These
    output documents can be any of a number of different formats. Some of the possible
    resulting document formats include the following: XML, XHTML, HTML, WML, RTF,
    and CSV.


    Two types of XSL-based transformations exist—a formatting language and a transformation
    language. The formatting language, XML Formatting Objects (XSL-FO) is used to
    create text layouts for documents. As of this writing, no major browsers support
    XSL-FO, so most XSL-FO is converted into another format (for example, PDF or T_X)
    for viewing.


    In this chapter, we''re going to focus on the XML Transformation (XSLT) standard
    that defines the transformation language. This language is a tags-based scripting
    language that enables you to generate output from XML data in a wide variety of
    text formats. An XSLT processor apphes these rules to an input XML document and
    generates the desired output. These rules are stored in an XSLT stylesheet.'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'Filtering describes the process of using XSLT to generate a new XML document
    that is a subset of the larger source document. In essence, you develop a set
    of rules that filter out the portion(s) of the source XML document that you require.


    This chapter discusses the format of transformation rules and demonstrate how
    to apply them. As is usually the case with Perl, there are several Perl modules
    that can be used to perform the transformation. I will provide an example for
    each of the major XSLT modules and discuss the differences between each of the
    modules. This will assist you in making the proper decision which module you should
    use for a particular task.


    To run the examples presented in this chapter, you''ll need to install the following
    Perl modules:


    +   - XML::LibXSLT

    - XML::Sablotron

    - XML::Xpath


    > NotenRemember, if you have any questions about Perl modules (for example, where
    do you get them, install them, and so forth) please refer to Appendix B, "Perl
    Essentials."


    # XSLT Introduction


    XSLT is a very powerful tool in the XML toolkit. It is an XML-based standard that
    facilitates the transformation of an XML document into another format. Depending
    on your requirements, the output document can be one of (but not limited to) the
    following formats:


    +   - XML

    - XHTML

    - HTML

    - WML

    - RTF

    - CSV

    - Others'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'As you can see, the term XSLT processing describes any one of a number of tasks.
    Given an input XML document, a transformation could change an element name; the
    character data inside an element could be modified; an attribute can be changed;
    or elements and attributes can be filtered, so that they don''t appear in the
    output XML document. XSLT is a powerful tool that enables us to easily change
    the contents of an XML document based on our requirements.


    Figure 8.1 shows the components of an XSLT process. As you can see in the figure,
    there are three required components to any XSLT-based transformation:


    +   - Input XML document

    - XSLT processor

    - XSLT stylesheet


    ![](img/e22859c8cc5393df3568af9529713fd6_240_0.png)


    Figure 8.1 XSLT transformation process.


    An important concept to take away from Figure 8.1 is that the data only flows
    in one direction. The input is always XML to XSLT; processors don''t generate
    XML, they only transform XML to other formats.


    The input XML document is the source of the data that will be transformed. Note
    that this is the only data source available for this transformation (that is,
    all information in the transformed files is the entire contents or a subset of
    the input XML document). The fundamental components of the XSLT transformation
    process are XSLT stylesheets and the XSLT processor.


    Why would we want to convert an XML document into another XML document? Several
    situations exist in which we would want to convert between XML and another format.


    Probably the two most used transformations are converting XML documents to other
    documents and converting XML documents to HTML documents. Let''s take a look at
    a few situations in which these two transformations would be used.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Converting XML Documents to Other XML Documents


    The ability to convert from one XML document to other XML document formats can
    be used in a number of situations and provides a great deal of flexibility. Let''s
    take a look at a few everyday scenarios when this conversion could be used. If
    you need to filter an XML document or convert it to support another DTD or XML
    schema format, We''ll take a closer look at each of these cases in the following
    sections.


    # XML Document Filtering


    The subject of XML document filtering has a number of applications. For example,
    let''s say that your company exchanges XML formatted documents with other companies.
    Assume that internal to your company, you use and distribute an XML document that
    is based on a corporate DTD or schema containing information about products and
    customers. However, this DTD or schema contains several elements that contain
    company-sensitive information (for example, client names and phone numbers). This
    is clearly information that you will need to remove from the XML document before
    you send it to another company.


    One way to filter the sensitive elements from the XML document is to manually
    edit it. This isn''t very practical—it is error prone and may be a nearly impossible
    task if the XML document is large. The better approach is to use an XML document
    filter to generate a new XML document. The first step is to generate a new external
    DTD or schema that doesn''t contain the sensitive elements. Then, use XSLT to
    transform the original internal document into a version that conforms with the
    new DTD or XML schema that does not contain sensitive information. This approach
    also provides a better long-term solution because it can be easily reused.


    # Transforming XML to Support a Different DTD or XML Schema


    When companies exchange data using XML, the ideal situation is for all the companies
    involved to standardize on a common DTD or XML schema. However, that may not always
    happen for a number of reasons. For example, one of the companies may not be willing
    (or able) to change their internal applications to support a common DTD or XML
    schema.


    One approach is to transform your XML document to another company''s preferred
    format. This process isn''t as smooth as it could be if both companies had agreed
    on a common DTD or XML schema. However, there are workarounds you can use to facilitate
    the transfer of data. In this case, you'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# XSLT Introduction 225


    could follow an approach similar to the one discussed in the last section. Develop
    a DTD or XML schema that matches the preferred format of the other company. Then,
    develop an XSLT stylesheet to transform your XML document to comply with a different
    DTD or XML schema.


    Another example of transforming to a different format could be companies using
    the Electronic Business using XML (ebXML) format to exchange data. ebXML is a
    group of related specifications designed to facilitate global exchange of business-related
    information. ebXML is a powerful suite of specifications; however, for internal
    corporate information interchange, it is probably more than you need. In cases
    such as this, a company can translate internal XML documents to ebXML documents
    to send data to a global partner. The same approach can be followed for incoming
    ebXML documents you may want to convert into a local, internal corporate format.


    # Converting XML Documents to HTML Documents


    Another widely used transformation is from XML to HTML/XHTML. As you can imagine,
    this is an important application of XSLT, especially on the web. For example,
    users can query a database using the Perl DBI, convert the results of the query
    to XML using any number of modules (for example, XML::Writer) and dynamically
    generate HTML reports. One of the benefits of this conversion is that the format
    and content of the reports can be predefined by using an XSLT stylesheet. After
    the stylesheet has been defined, reports can be generated over and over again
    the same stylesheet.


    For example, let''s say you''re responsible for generating a dynamic accounting
    report that tracks charges based on project number. The accounting for each project
    can change on a daily basis depending on travel, purchases, and so forth By using
    an XSLT stylesheet to convert XML to HTML/ XHTML, you can provide reports that
    will always be based on the latest available data. The next few sections go into
    more detail on how to perform these types of transformations.


    If you remember, earlier in the book I mentioned that one of the major benefits
    of XML is that it separates the data from the presentation of the data. XSLT can
    be used to generate different versions (or views) of the same data depending on
    the client that requests the data. This can easily be accomplished by developing
    multiple XSLT stylesheets for each report. Each of the XSLT stylesheets can be
    used to generate the HTML for a particular device. For example, let''s assume
    that you have a report that contains graphics'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Chapter 8 XML Transformation and Filtering


    (for example, charts or photographs), and some of the clients requesting the report
    aren''t capable of displaying all the graphics (for example, mobile phone). a
    WAP-specific XSLT stylesheet can be used to filter out the graphics and just send
    the text of the report.


    # XPath Introduction


    XPath is a non-XML language that was developed to search and access portions of
    an XML document. In addition to the searching capability, XPath also provides
    a few basic functions for manipulating data. The name XPath comes from the fact
    that the standard uses path notation (similar to a URL) to work with the hierarchical
    structure of a document. We can compare the relationship between XPath and XML
    to the relationship between SQL and a database. Granted, they are not the same,
    but the relationship between XPath and XML can be compared to the relationship
    between SQL and a database.


    XPath provides the capability to select the first occurrence of an element, the
    third occurrence of another element, or retrieve the social security attribute
    of an employee element that has the firstname "Mark." It is a very powerful capability,
    and it is an important component of a number of XML-based standards, such as XPointer,
    XML Schemas, and XSLT. So, before discussing XSLT stylesheets, I thought it would
    be advantageous to provide an introductory discussion of the XPath standard.


    > Note

    One advantage of using XPath in the other standards is commonality among the standards.
    After you''re familiar with XPath, you will be able to apply the knowledge in
    a number of areas. This is an example of reuse of a technology is beneficial to
    you as the user.


    Because we''re concerned with XPath and XSLT in this chapter, what is their relationship?
    When using XSLT to transform an input XML document, we''ll generally have an input
    XML document, an input XSLT stylesheet, and an output document (which could be
    in any number of formats). XSLT searches the input XML document using XPath by
    comparing the rules defined in the XSLT stylesheet (also called templates) to
    the input XML document. After a match has been found in the input XML document,
    the matching construct can be copied by the XSLT processor and then processed
    based on the rule in the XSLT stylesheets. This rule might call for the conversion
    to HTML, filtering of the XML document, or any of a number of possibilities.'
  merge: -1
  pgno: 243
- img_proc: true
  md: "# XSLT Introduction 227\n\nWe have an idea of what XPath does, but how does\
    \ it work, and what is the format of the syntax? One important point to keep in\
    \ mind is that XPath works on an XML document that has already been parsed and\
    \ stored in a tree. Similar to the DOM parsers (which were discussed in Chapter\
    \ 4,\"Tree-Based Parser Modules\"), XPath views an XML document as a tree of nodes.\
    \ The notation used to describe the tree structure is basically the same, so if\
    \ you're familiar with the DOM trees, you shouldn't have a problem understanding\
    \ the XPath notation.\n\nIt is easier to discuss XPath in the context of an XML\
    \ document. Let's assume that your company employs a web-based timekeeping system,\
    \ and that an application generates an XML document containing all the submitted\
    \ timecard information. A sample of an XML document with timecard information\
    \ is shown in Listing 8.1.\n\nListing 8.1 Corporate timesheet information in XML.\n\
    \n```\n```xml\n<??xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE timesheet\
    \ SYSTEM \"timesheet.dtd\">\n<timesheet week=\"5/31\">\n  <employee type=\"salary\"\
    >\n    <name>Joseph</name>\n    <project>Book development</project>\n    <hours>40</hours>\n\
    \  </employee>\n  <employee type=\"hourly\">\n    <name>Kayla</name>\n    <project>Editing</project>\n\
    \    <hours>45</hours>\n  </employee>\n  <employee type=\"hourly\">\n    <name>Marijo</name>\n\
    \    <project>Artwork</project>\n    <hours>45</hours>\n  </employee>\n  <employee\
    \ type=\"salary\">\n    <!-- Dan had a busy week, as usual !--->\n    <name>Dan</name>\n\
    \    <project>Indexing</project>\n    <hours>70</hours>\n  </employee>\n</timesheet>\n\
    ```\n```"
