  md: '# Generating XML Documents


    Where do XML documents come from? It''s kind of like the famous question: Which
    came first, the chicken or the egg? You can''t parse an XML document until you
    build one. The source data for an XML document can come from just about any imaginable
    source. For example, an XML document can be generated from a CSV file, a tab-delimited
    text file, the results of a database query, a Common Gateway Interface (CGI) web-based
    user form that collects data from a user, Web services, and many other sources.
    You can see that there is an almost infinite number of data sources for XML documents.


    Let''s take a look at two methods of generating XML documents. First, an XML document
    can be created in a standard text editor or an XML-specific What You See Is What
    You Get (WYSIWYG) editor. This is called static generation where the XML document
    is created by typing the document into a text editor. The data in the file remains
    the same unless someone or something (that is, an application) modifies it. There
    isn''t too much to it—basically just type the contents of the XML file as you
    would type any other document. This is an option for very small files (for example,
    configuration files); however, it''s not practical for larger files. The larger
    and more complicated an XML document is, the greater the chance of error if it
    is edited by hand.


    XML documents can also be generated dynamically by an application. Dynamically
    generating XML is more interesting and applicable than statically generated documents,
    so let''s take a more detailed look at this topic in the following section.


    # Dynamically Generating XML Documents


    Another method of generating an XML document is to dynamically generate the contents
    using an application (preferably Perl based). Because XML is just plain text,
    an entire XML document can be easily contained within a Perl scalar. It can also
    be printed to any filehandle with a simple print command. Of course, plenty of
    modules are available that generate XML, which takes away some of complexities
    of doing everything yourself. We''ll discuss these modules in Part III of this
    book, "Generating XML Documents Using Perl Modules." Some of the topics discussed
    include generating XML documents from text files, databases, and even other XML
    documents.'
  merge: -1
  pgno: 41
