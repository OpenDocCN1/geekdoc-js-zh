    of operating systems using Perl, XML, and C/C++. Most of his software experience
    is network, having recently led teams developing a web-based network planning
    tool and a client server modeling and simulation effort that combined both live
    and virtual components. Mark is a Lead Software Engineer with Agile Communications,
    (http://www.agilecommunications.com), a company dedicated to finding innovative
    solutions to challenging technical problems. He is also a user and faithful supporter
    of open source software and contributes to the community whenever time permits.
    Mark has both BS and MS degrees in Electrical Engineering. In his spare time,
    Mark enjoys spending time with his wife Alyse, working on house projects, going
    to the beach, and riding a bicycle up and down the New Jersey coastline.


    ![](img/e22859c8cc5393df3568af9529713fd6_9_0.png)


