  md: '![](img/e22859c8cc5393df3568af9529713fd6_330_0.png)


    # # What Is XML?


    # # Introduction to the eXtensible

    Markup Language


    If you''ve been online or to a bookstore recently, you know that XML is everywhere.
    What is XML? Why is XML so important? Is XML something I should learn and use?
    Let''s see if I can answer these questions for you in this Appendix I will provide
    an introduction to the eXtensible Markup Language (XML) and discuss all the basics
    of the language.This Appendix should provide a beginner with enough information
    to get started with this important language and to work through the concepts in
    this book.


    # # History of XML


    Before discussing XML and what it can do for you, let''s go back a few years and
    look into the history of XML. Back in 1986, the International Organization for
    Standardization (ISO) published the Standard Generalized Markup Language (SGML)
    standard. SGML is a meta-language that describes how to embed formatting commands
    inside of a document.  It was purposely designed to be very general to provide
    maximum flexibility. However, this came at the price of a very complicated standard.  As
    a result, it became very'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# 314 Appendix What Is XML?


    powerful and complicated language—in fact, one of my references stated that very
    few (if any) software packages were ever able to completely implement the SGML
    standard. SGML achieved some success in government and the aerospace industry
    and other business sectors that required an efficient method to organize thousands
    of pages of detailed technical documentation.


    A successful byproduct of SGML (actually an application of it) is the HyperText
    Markup Language (HTML). HTML is a markup language that has been widely adopted
    by web browsers, though the language is limited. HTML is limited because it is
    comprised of a finite set of tags. The original version 1.0 of the HTML standard
    only supported about a dozen tags, while version 4.01 supports nearly a hundred
    tags. Although a hundred tags sounds like a lot, it is not enough of a variety
    to support anything other than the creation of web pages. You will never see anyone
    use HTML as a format to exchange data. It will, however, continue to be used to
    display web pages until it is eventually phased out by XML.


    > Note

    Additional information on HTML can be found at http://www.w3.org/Markup/


    Several individuals in 1996 started development of a newly scaled version of SGML
    that would remove the complicated and rarely used portions of the nearly 20-year-old
    SGML standard. The first draft of the XML standard, version 1.0, was released
    in February 1998 and users immediately saw the benefits of XML.


    # What Exactly Is XML?


    To get a good idea of what XML is, you also need to know what XML is not. I’ll
    cover some of those misconceptions in the following section, but for now, let’s
    cover what XML is—a language that was designed to facilitate the exchange of information.


    > Note

    One of the best sources for XML information is at the World Wide Web Consortium
    (W3C) web site (http://www.w3.org). The W3C publishes the XML standards as well
    as most (if not all) of the World Wide Web-related standards.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# XML Applications


    XML and the related technologies can be applied to a number of applications.

    Before I actually start discussing some of the characteristics of XML, let''s
    take a moment and look at some of the important applications of XML. Currently,
    three of the main applications of XML are


    +   - Data Interchange—XML is widely utilized to facilitate the exchange between
    data organizations. Different organizations can develop a DTD or XML schema that
    defines the contents of an XML document. A DTD or XML schema acts as a contract
    between the participating organizations. An XML parser can easily verify that
    the XML document is valid, that is, conforms to the DTD or XML schema.

    - Defining Custom Documents—Unlike HTML, which has a finite set of tags, XML doesn''t
    have defined tags, users are free to define their own (provided they follow the
    XML formatting and structure rules). XML enables users to easily define application-specific
    XML documents for standardized communication.

    - Easily Transformed Data—XML provides a very flexible initial data format, especially
    when combined with XSLT stylesheet, you can easily transform an XML document into
    a plain text format (for example, tab-delimited, CSV), an HTML document, or another
    XML document. As you can see, this provides the end user with a great deal of
    flexibility to use the same data in a number of different formats.


    # Characteristics of XML


    XML can be easily described by a few key characteristics that provide a clear,
    high-level description. This section provides a short list of the more important
    characteristics.


    +   - An XML document is stored as a plain file. This means that you can open
    an XML document with any editor. Text files are portable across platforms, while
    binary files are platform-specific. In addition, because XML document is stored
    as plain text, it is easier to find errors in the XML document—nearly an impossible
    task with a binary file.

    - XML was designed for a database table and works best with structured data. An
    example of structured data is a database table or the contents of a spreadsheet.
    These data sources are called structured because they can be broken down into
    records (or rows), and each row is made up of multiple columns (or cells). Because
    XML is hierarchical, complex data structures can be defined within the XML document.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# 316 Appendix What Is XML?


    +   XML separates data and presentation. Unlike HTML that mixes data and formatting
    of the data, XML was designed to consist of data only. This leaves you, the developer,
    free to present the data in the best way you see fit. This is also important because
    it enables you to format the same data different ways. For example, the same data
    can be formatted for presentation on both a Personal Computer (PC) and a handheld
    Personal Digital Assistant (PDA).


    +   XML is self-describing. A well-designed XML document with clearly defined
    element names is easy to read and understand. This means that when you open an
    XML document in a text editor, you should be able to see all the elements in the
    XML document and the relationship between the elements (that is, the element hierarchy).
    If the elements in an XML document are assigned descriptive names, you may not
    need to insert any comments into the XML document.


    +   XML is publicly available and very popular. You don''t need to worry about
    any licensing issues with XML, and because XML is so popular, it''s easy to find
    a lot of documentation, both in print and online. Books, magazines, web pages,
    mailing lists, and newsgroups are dedicated to XML. Look at the section, “Additional
    Sources of XML Information” at the end of this Appendix for a list of resources.


    +   XML has launched entire series of related standards. A number of important
    related standards are built upon XML. Some of the more popular XML-based standards
    include XLink, XPointer, XML and XSLT. Full definitions of these terms can be
    found in the Glossary.


    # What XML Isn''t


    Now that I have shown you a few characteristics of XML, let''s reverse things
    a bit and clarify a few misconceptions that exist about XML.


    +   XML is not a transport protocol. Sometimes, XML is confused with a transport
    protocol, and developers mistakenly believe that they can communicate between
    two processes using XML. XML cannot be used as a transport protocol. You can,
    however, send between two processes using a transport protocol (for example, TCP
    or UDP). An example of this would be a TCP server that is waiting for incoming
    connections from clients. A client can open a socket and connect to the server,
    and send (or receive) an XML document.


    +   XML is not a programming language. XML was designed as a common language to
    support the sharing of data between applications. Perhaps people sometimes confuse
    XML and XML parsers. An XML parser is used to read an XML document, and XML parsers
    are available in a number of languages including C/C++, Java, and Perl.'
  merge: -1
