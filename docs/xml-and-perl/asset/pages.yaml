  md: '# 358 Markup delimiter


    Markup delimiter A group of characters used to delimit text documents. In XML
    markup, characters are used to delimit the start and end of an element. Some markup
    delimiters are ‘&lt; and ‘&gt;’. Typically, they’re used to delimit elements as
    the one shown: <model>Chevrolet Corvette</model>.


    mod_perl An Apache web server and Perl integration that links the Perl runtime
    into the web server and provides an object-oriented Perl interface to a C API
    of the web server. The major reason for using mod_perl is that it increases the
    performance of a web server. Because the Perl runtime library is already linked
    into the web server, there is no need to launch a new process to run a CGI script.


    NMTOKEN DTD attribute type. The name NMTOKEN stands for name and has many of the
    same characteristics as an XML name. For example, an NMTOKEN must be made up of
    the same characters as an XML name (alphanumeric marks like _, -, and .). Unlike
    an XML name, an NMTOKEN can have a number or punctuation mark as the first character.
    An NMTOKEN can be used to bind input data. For example, let’s say that you have
    an <employee> element with employee number declared as:


    ```

    <!ATTLIST employee employee_number NMTOKEN #REQUIRED>

    ```


    By using the NMTOKEN attribute type, it will only be valid for valid NMTOKENS.


    So, it would be valid for an employee number as “123”, and invalid for an attribute
    value of “123 ” (invalid because of the whitespace). However, NMTOKEN won’t prevent
    an attribute value containing a string, such as “Mark”.


    CDATA A DTD keyword used to describe parsed character data. The term CDATA is
    usually used to describe the contents of an element. Note an element declared
    to contain CDATA may contain entity references; however, it cannot contain any
    tags or elements.


    PDF (Portable Document Format) A document format developed by Adobe as a means
    of transferring documents between different platforms. Additional information
    can be found at http://www.adobe.com.


    Perl (Practical Extraction and Reporting Language) A high-level programming language
    developed by Larry Wall. Perl is ideally suited for such tasks as manipulation,
    system management, database access, networking, and web programming.


    Perl module A self-contained piece of Perl code that performs a particular task.
    A module can be used by a Perl program or by other modules. Perl modules are freely
    available to perform just about any imaginable task. The best place to start looking
    for a module is CPAN, http://search.cpan.org.


    Perl Package Manager See PPM. Home Page See PHP.'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# PHP (Personal Home Page)


    A programming language that is similar to Perl. Unlike Perl, PHP uses an interpreter
    that is embedded in the web server itself. Similar to ASP, PHP supports server-side
    programming code in HTML pages. PHP is supported by Apache web server. Additional
    information on PHP can be found at http://www.php.net/


    PI (Processing Instruction) Markup


    that appears in an XML document as is used to pass instructions to the XML processor.
    All PI start with <? and end with ?>. The only restriction is that you cannot
    use <?xml?> or <?XML?>. Note that PIs are instructions that are processor-dependent
    and are not specified by the XML standard. A commonly used PI is <?stylesheet...?>.


    # POP3 (Post Office Protocol


    version 3) A simple protocol to retrieve electronic mail. Additional information
    on POP3 can be found in RFC 1939.


    # Portable Document Format


    See PDF


    # Post Office Protocol version 3


    See POP3.


    # PPM (Per Package Manager)


    A tool developed by ActiveState that assists in the task of Perl module management.
    For example, allowing a user to install, remove, or update modules from a number
    of Perl module repositories. Additional information is available at http://www.activestate.com.


    # Practical Extraction and Reporting


    Language See Perl.


    # Processing Instruction See PI.


    # Remote Procedure Call See RPC.


    REQUIRED keyword A DTD keyword inside the declaration of an attribute. If the
    REQUIRED keyword is used, then the attribute must be present in a valid XML document.


    # RTF (Rich Text Format) A file


    format originally developed by the Microsoft Corporation. An RTF file is an ASCII
    file that contains special presentation format characteristics, as fonts and margin
    sizes.


    # Rich Text Format See RTE.


    Root element The single element per XML document contains all other elements.
    In an XML document, this is the first element encountered.


    # RPC (Remote Procedure Call) A


    type of network programming where a client actually calls functions in a server.
    This is a different approach to client-server programming. Typically, a client
    connects to a server using a socket, the client sends a request, and the server
    processes the request and sends back a reply.


    # SAX (Simple API for XML)


    An event-based XML parser API. The user defines a series of event handlers that
    called when the parser encounters a particular construct. For example, a start
    event handler will be called each time the parser encounters the start of an element.
    Unlike the DOM-based parsers, SAX is ideal for parsing large XML documents because
    it doesn''t build a tree of the XML document in memory.


    # SAX (Simple API for XML) 359'
  merge: -1
  pgno: 376
- img_proc: true
  md: '# SAX2 (Simple API for XML version 2)


    SAX2 (Simple API for XML version 2) Version 2 of the SAX standard. Includes bug
    fixes and additional functionality (for example, better namespace support than
    the original SAX2 web site is at http://www.saxproject.org/


    Scalable Vector Graphics See SVG. Scheatron An XML-based language that uses XPath
    to query XML documents. Additional information is available at http://www.ascc.net/xml/resource/schematron/


    SGML (Standard Markup Language) A language developed to support electronic publishing
    of documents. SGML is the predecessor to XML.


    Simple API for XML Simple API for XML version 2 SAX2.


    Simple Mail Transfer Protocol SMTP


    Simple Object Access Protocol Simple SOAP


    SMTP (Simple Mail Transfer Protocol) A protocol designed to deliver electronic
    mail. Additional information can be found in RFC 2821.


    SOAP (Simple Object Access Protocol) SOAP is a lightweight protocol designed to
    exchange structured information in a distributed environment. XML is used as the
    message format, and SOAP messages can be distributed by a number of differing
    protocols. Additional information can be found at http://www.w3.org/TR/2001/WD-soap12-part0-20011217/


    # SQL (Structured Query Language)


    An ANSI standard language that was developed to interact with databases. SQL enables
    you to create, destroy, and update tables.


    Standalone An optional attribute in the XML declaration. The standalone attribute
    indicates if an XML document has an internal DTD (standalone = "yes") or if the
    DTD is in an external document (standalone = "no")


    Standard Generalized Markup Language See SGML.


    Start an option tag in the declaration of an XML element. In the following declaration
    of an XML element <nickname>The Chief</nickname>, the first tag <nickname> is
    the start.


    Structured Query Language See SQL.


    SVG (Scalable Vector Graphics) A language used to describe twimensional graphics
    in XML. Currently, three types of objects are supported: vector graphics, images,
    and text. SVG is a W3C-developed standard and additional information can be found
    at http://www.w3.org/TR/SVG/


    UDDI (Universal Description Discovery and Integration) An architecture that provides
    integration with web services. UDDI contains specifications describing services
    and discovery of those services. It supports multiple platforms because it is
    based on W3C standards such as SOAP and XML. Additional information on found at
    http://www.uddi.org/'
