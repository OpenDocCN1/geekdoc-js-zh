  md: '# 140 Chapter 4 Tree-Based Parser Modules


    Unlike several of the tree-based parsers that we have discussed so far in this
    chapter (for example, XML::Simple, XML::Twig), the XML::LibXML Perl isn''t built
    on top of XML::Parser. If you remember our original discussion in Chapter 3 about
    XML::Parser, you''ll recall that it doesn''t implement actual DOM, SAX, or XPath
    interfaces. XPath is discussed later in Chapter 8, "XML Transformation and Filtering."


    Both XML::Parser and the Perl modules built upon it are severely limited regarding
    support for standards. However, libxml2 was developed after the DOM, SAX, and
    XPath standards were mature, so fortunately for us, libxml2 supports the DOM,
    SAX, and XPath APIs. Depending on your task at hand, you''ll have access to all
    three APIs in the same module. The advantage of having a DOM and SAX API in the
    Perl module is that you can take advantage of a DOM tree and SAX events. For example,
    you can walk up and down an in-memory tree and generate SAX events.


    # XML::LibXML Example


    Now that you have an understanding of the capabilities of the XML::LibXML module,
    let''s take a look at an example. Assume that your company has purchased new accounting
    software to manage all the company billing records. Unfortunately, the new software
    isn''t compatible with the old software (not an unrealistic example). Let''s say
    that the old software can dump the customer information into an XML document;
    however, the new accounting package can''t accept XML data as input. Instead,
    it expects to see the data in a particular text-based format. Your task is to
    develop a parser to read the XML document and generate the required report.


    Our first task is to verify the input XML document format. Listing 4.16 shows
    the document that contains our accounts receivable information.


    Listing 4.16 DTD That describes the accounts receivable information.

    (Filename: ch4_libxml_customers.dtd)


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <!ELEMENT customer_data (customer*)>

    <!ELEMENT customer (name, balance, due_date)>

    <!ATTLIST customer account_number ID #REQUIRED>

    <!ELEMENT name (#CDATA)>

    <!ELEMENT balance (#CDATA)>

    <!ELEMENT due_date (#CDATA)>

    ```'
