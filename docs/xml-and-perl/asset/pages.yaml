  md: '# Generating XML Documents from Databases


    # Chapter Roadmap


    This chapter discusses how you can use Perl to produce XML documents using a database
    as your data source. As you will see, one of the largest uses of XML is a data
    storage facility. Because XML is based on a hierarchical data format, it''s suitable
    to store almost any information, and it has the capability to mimic some of the
    capabilities found in relational database management systems (RDBMS). However,
    because XML is stored in a text format, data cannot be retrieved as quickly or
    as efficiently compared to the binary formats used by modern RDBMS. So, XML probably
    won''t be replacing databases anytime in the near future, although a number of
    people are working very hard to develop XML-based databases. Currently, XML-based
    databases are not mature enough to replace our existing RDBMS.


    XML is often used to transfer data between disparate systems. A large number of
    systems are in use today that exchange data, although they were never designed
    to do so. An example of such a system could be an e-commerce business. Many times,
    orders are collected by one company and shipped by another company. In this situation,
    the companies could use XML to exchange order information. XML can also be used
    if a company is migrating to a new relational database system. It may not be a
    big issue'
  merge: -1
