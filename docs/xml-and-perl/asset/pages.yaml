  md: "# Searching XML Documents\n\nSearching XML Documents 27\n\nInformation storage\
    \ is only useful if the information can be easily retrieved.\nUsually, information\
    \ is retrieved from a relational database by sending\ncommands (for example, Structured\
    \ Query Language [SQL]) to the server.\nAn XML document can be considered a facility\
    \ for data storage, and therefore,\ncan also be considered a rudimentary database.\
    \ Just as SQL is the standard\nlanguage for relational databases, the XML community\
    \ has developed their\nown own set of standards for retrieving information from\
    \ an XML document.\nXPath is a standard that defines the syntax for addressing\
    \ and fetching parts\nof an XML document.\n\n> Note\nXPath and many other XML-related\
    \ standards can be found on the web at http://www.w3.org.\n\nOther XML standards\
    \ exist, such as XML Query and XML Query Language\n(XQL), for querying XML documents.\
    \ Each of these standards for querying\nXML documents uses its own syntax (though\
    \ it might be similar) on top of\nt query engine.\nBeing able to extract data\
    \ from an XML document can be very convenient.\nYou can easily retrieve information\
    \ from a certain part of the document by\nwriting a query using XPath, XML Query,\
    \ or XQL. Let's take a look at Figure\n2.4, which shows (at a high level) just\
    \ how XPath's query engine works.\nAs you see in Figure 2.4, the application starts\
    \ the query engine,\ninitializes the query, and submits it to the engine for processing.\
    \ The query\nengine then determines what is requested and goes to work to retrieve\
    \ the\nrequested information. After the data is located, it is returned to the\
    \ applicatio, which can proceed to process it. As you can see, the concept of\
    \ the\rocess is very simple and straightforward.\nOne area of XML processing that\
    \ uses XPath quite extensively is XSLT.\nXPath is used to find portions of the\
    \ XML document that match the criteria\\defined in the extensible Stylesheet Language\
    \ (XSL) files (that is, which\nelements in the XML document will be extracted\
    \ to create the output file).\n\n![](img/e22859c8cc5393df3568af9529713fd6_44_0.png)\n\
    \nFigure 2.4 XML XPath Query Engine."
