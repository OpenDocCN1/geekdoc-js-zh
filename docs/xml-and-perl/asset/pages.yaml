    nested elements), we are going to explicitly extract all the information. If this
    XML configuration were longer or contained multiple elements (for example, multiple
    <db_user>), we would need to loop through each occurrence of the same element.
    Note that the DTD or the XML schema would need to be changed to support multiple
    <db_user> elements.


    In our program, the $root is a reference to a data structure similar to the one
    shown in Figure 4.1. As you can see, we need to walk up and down the tree and
    retrieve our data. It may seem a bit confusing at first, but after you''re comfortable
    with Perl references and nested data structures, it will seem like native.


