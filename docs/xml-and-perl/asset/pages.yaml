  md: '# 330 Appendix A What Is XML?


    +   - ID—Attribute data value must be unique within the XML document (that is,
    the value can appear in the XML document, but not as the value assigned to an
    attribute of type ID).


    +   - IDREF—Attribute data value is the ID type attribute of another element in
    the XML document.


    +   - IDREFS—Attribute data value is a list of multiple ID type attributes of
    other elements in the XML document.


    +   - NMTTOKEN—Attribute data value must follow a specific naming convention that
    is similar, but not identical to, XML names. A name NMTOKEN can consist of alphanumeric
    characters and the punctuation marks _, -, and :.


    +   - NMTOKENS—Attribute data value consists of multiple NMTOKENS separated by
    whitespace.


    +   - NOTATION—Attribute contains the name of a notation that is declared in the
    DTD. Note that this is very rarely used.


    The next declaration is for the transaction element:


    ```

    <!ELEMENT transaction (account_number, name, amount, month, day)>

    ```


    This declaration says that the <transaction> element has five child elements:
    <account_number>, <name>, <amount>, <month>, and <day>. The <transaction> element
    also has an attribute that is declared by the following statement:


    ```

    <ATLIST transaction type (withdrawal|deposit) #REQUIRED>

    ```


    As you can see, the transaction element has one attribute named type. The type
    attribute is an enumerated attribute, and the only valid values are withdrawal
    or deposit. The default declaration for the type attribute is #REQUIRED, this
    means a value for the type attribute must be present, and it must be one of the
    values that appears in the enumerated list.


    The valid values for the attribute default declarations are shown in the following:


    +   - FIXED—The FIXED attribute default declaration means that the attribute is
    a constant value.


    +   - IMPLIED—The IMPLIED attribute default declaration means that the attribute
    is optional.


    +   - Literal—The attribute default value is provided as a quoted string. Similar
    to the enumeration attribute type, there isn''t a reserved word for the literal
    default declaration.


    +   - #REQUIRED—The #REQUIRED attribute default declaration means (as you may
    have already guessed from the name) that the attribute is required.'
