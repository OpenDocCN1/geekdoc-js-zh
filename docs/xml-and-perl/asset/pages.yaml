  md: 'When we originally discussed this project, we were both using XML and Perl
    in our daily work, but we didn''t have a book that discussed the topic of XML
    and Perl. Sure, there were lots of XML and lots of Perl books available, but none
    of the books tied the two topics together. So, we were doing everyone else did—reading
    the perl docs and posting questions to mailing lists. After doing this for a while,
    we realized that we weren''t the only ones with questions and saw a need for a
    book focused on XML and Perl together.


    # XML and Perl


    # Content Highlights:


    +   - Introduction to XML and Perl


    +   - XML Processing


    +   - Event-Driven Parser Modules


    +   - Tree-Based Parser Modules


    +   - Generating XML Documents from Text Files


    +   - Generating XML Documents from Databases


    +   - Converting Various Data Formats to XML


    +   - XML Transformation


    +   - Using AxKit


    +   - Web Services


    XML and Perl is a comprehensive reference that demonstrates how to develop Perl
    applications to perform XML processing. Built upon a number of real-world examples,
    this book shows the reader how to perform just any XML-related task.


    -Mark Ried and Ilya Sterin


    > “This book fills a serious gap. There is a huge community of Perl users and
    a rapidly growing community of XML developers. This is an essential how-to document
    for anyone wanting to wed a premiere open-source programming language with the
    coming de facto standard for information processing and exchange.”


    —Glenn Becker, E Business Manager, United Way of New York City


    ![](img/e22859c8cc5393df3568af9529713fd6_1_0.png)'
