  md: '# 158 Chapter 5 Generating XML Documents from Text Files


    7–31 In this section of the program, we take advantage of a little-known Perl
    construct called a “Here” document. It can save a lot of time and greatly simplify
    the structure of your program. Basically, everything between the two occurrences
    of the terminating string (in our case, “EOF”) is printed, so all you need to
    insert your XML document between the EOF as you would like it. Note that you basically
    have to type the entire XML document inside the “Here” blocks.


    One advantage of the “Here” document is that you don’t need to have a print statement
    on each line. One disadvantage is that you can’t have comments inside a “Here”
    block—the comments will show up inside the output file.


    First, following the “<<" symbol, we specify a string to terminate all the quoted
    characters. In our case, the string that signifies the end of the block is “EOF”.
    Note that we are sending the output to the OUTPUT filehandle.


    Second, all lines following the current line down to (but not including) the terminating
    line are considered part of the output string. So, we basically just insert the
    entire contents of our XML document. There isn''t a limit to the size of the output
    string, so this output string can span several pages (if required).


    Third, we''ll need to identify the end of the output block. So, we insert EOF
    on a line by itself. Note that the ending tag for a “Here” document (in our case,
    EOF) must appear against the left margin, and it can''t have any trailing spaces
    or tabs. When you run this program, it prints everything that is contained between
    the two EOF statements.


    Keep this syntax in mind; it comes handy in a number of situations. If we didn’t
    use the “Here” document syntax, we would have needed a print function on each
    line of the program. In addition to causing your hands to ache after typing all
    those print statements, all those print statements would cause your program to
    be very cluttered and prone to error.


    Note


    You can find additional information on the “Here” documents by looking at perld
    peridata.


