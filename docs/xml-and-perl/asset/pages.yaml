  pgno: 371
- img_proc: true
  md: 'CPAN (Comprehensive Perl Archive Network) A mirrored web site that provides
    a wealth of Perl information. For example, it provides links to Perl modules,
    documentation, mailing lists, and Frequently Asked Questions (FAQs). Whenever
    you''re looking for any Perl information, this is a great place to start. CPAN
    is at http://www.cpan.org.


    DBMS (Database Management System) Typically describes a system that manages large
    amounts of data, optimized for easy and fast retrieval.


    # Document Object Model


    See DOM.


    # Document Type Definition


    See DTI.


    # DOM (Document Object Model)


    A platform and language independent standard that enables programs to access and
    modify the contents of a document. DOM can support HTML and XML documents and
    is considered to be a tree-based parser because it builds a tree of the input
    document in memory. It builds the tree in memory. DOM parsers are not recommended
    for parsing large documents. DOM-based XML parsers are written in a number of
    languages, including Java, C/C++, and.


    CSS (Cascading Style Sheet) A simple non-XML language that was developed to support
    adding styles (for example, fonts, colors, and so) to web documents. It was originally
    developed to work with HTML, however it also works with XML. Support varies widely
    among browsers.


    CSV (Comma Separated Value) A file that contains delimiters between fields. An
    example of a CSV file is a database table or spreadsheet that has been exported
    to a text file. In the exported text file, commas are used to separate the columns,
    and new lines are used to separate the rows.


    # DTD (Document Type Definition)


    A non-XML file that defines the structure and content of an XML document.


    Database Interface See DBI.


    Database Management System See DBMS.


    Element An XML element is the smallest block of an XML document. Typically, an
    XML element is part of a start tag and an end tag. A typical element has the following
    format: <employee>James Kennedy</employee>. In this example, <employee> is the
    start tag. "Kennedy" is the element content, and </employee> is the end tag.


    DBI (Database Interface) The Perl is a widely used Perl module that provides transparent
    access to multiple database servers using a consistent API. The DBI module handles
    all the underlying differences between database servers. Some of the supported
    databases includes Informix, Microsoft SQL Server, mSQL, MySQL, Oracle, PostgreSQL,
    and all ODBC-compliant servers. The Perl DBI home-page can be found at http://dbi.perl.org/


    # ELEMENT Declaration


    The declaration of an XML element appears in a DTD. The format for the declaration
    is: <ELEMENT name (content)>


    Remember, the content of an element could be text or other elements.'
  merge: -1
  pgno: 372
- img_proc: true
  md: 'Empty element An XML element that doesn''t have any content is called an empty
    element. An empty XML element is represented by <employee></employee> or the shorthand
    notation <employee/>.


    End tag An end tag is the closing tag required to define an XML element. For example,
    in <city>Ocala</city>, the tag </city> is the end of the tag.


    ENTITIES An attribute type that can hold a list of ENTITY names (see ENTITY) separated
    by spaces. For example, multiple ENTITIES can be defined in a DTD using the following
    format:


    ```

    <ATTLIST annual_report

    charts ENTITIES #IMPLIED>

    <ENTITY sales_chart1 SYSTEM

    "sales1.jpg">

    <ENTITY sales_chart2 SYSTEM

    "sales2.jpg">

    <ENTITY sales_chart3 SYSTEM

    "sales3.jpg">

    ```


    In an XML document, the ENTITY attribute be used as follows:

    <annual_report charts="sales_chart1 sales_chart2 sales_chart3" \/>


    ENTITY An attribute type that can be set to the name of an entity that is defined
    elsewhere in the DTD. ENTITY (for example, in this case, a JPG version of a chart)
    can be defined in a DTD using the following format:


    ```

    <ATTLIST annual_report

    sales_chart ENTITY #IMPLIED>

    <ENTITY sales_chart SYSTEM

    "sales1.jpg">

    ```


    Throughout the XML document, we can refer to "sales1.jpg" by using the attribute
    sales_chart. For example, we could use "sales_chart" as an attribute type in the
    following XML element declaration:

    <annual_report graphic="sales_chart">


    Entity reference A markup used to replace a reserved character (for example, <,
    or ") appearing inside character data within an element. For example, the string
    "Mark''s car" would appear inside an XML element as &name&apos;car=\;


    Enumerated A list that contains a list of valid values. An XML attribute can be
    declared to specify that the only valid value be selected from a list. For example,
    let''s say a day attribute of the <sales_report> element in the DTD:

    <ATTLIST sales_report day

    (Monday | Tuesday | Wednesday | Thursday | Friday | Saturday | Sunday). This declaration
    tells us that the only valid values for day are the names of the days of the week—Monday
    through Sunday.


    Event-based XML parser One of the major paradigms in XML parsing. An event-based
    XML parser defines predefined subroutines when it encounters a particular construct
    inside the XML document. For example, a start handler called each time the parser
    encounters a new start tag.


    Extensible Hyper Markup Language See XHTML.


    Extensible Markup Language See XML.'
  merge: -1
