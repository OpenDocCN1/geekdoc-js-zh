  md: 'After the installation is complete, place the client script in any user directory,
    so that you can execute the client application.


    # Accessing the Web Service


    After our web service is installed and the local web server is running, we''re
    ready to try and access our web service. Remember, the web service client requires
    a command-line argument that contains an ISBN number. So, we can access the web
    service by launching the client and passing in a command-line argument:


    ```

    perl_soap_client.pl 0201615711

    ```


    As expected, we receive the following reply after executing the web service client:


    ```

    Now searching for a book with ISBN # 0201615711


    name: Network Programming with Perl

    publisher: Addison Wesley

    author: Lincoln D. Stein

    pages: 754

    price: 39.99

    ```


    Note that the web service client can easily be modified to access a different
    web service. In this example, the location of the web service was hard coded in
    the client using the following line:


    ```

    http://localhost:cgi-bin:0006_service.cgi

    ```


    It would be a simple change to extend our client application to access a different
    web service, perhaps passed in a second command-line argument.


    As you can see, web services using the SOAP::Lite Perl are a very powerful technology
    that are easily implemented, and they don''t require a lot of extra programming
    on either the client or server side. SOAP is by far the most popular web service
    technology in use today.'
