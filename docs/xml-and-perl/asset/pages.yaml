  md: "# Chapter 8 XML Transformation and Filtering\n\nIn the final generated annual\
    \ report, we'd like to remove the <revenue> and <telephone_num> elements. While\
    \ we want to promote the fact that we have high profile companies as clients,\
    \ we don't want to show our revenues, or release the private telephone numbers\
    \ of their Chief Executive Officers (CEOs).\n\nThis is a fairly easy task if we\
    \ use an XSLT stylesheet to filter the input XML document. Let's take a look at\
    \ the XSLT stylesheet that performs this filtering for us.\n\n# XSLT Stylesheets\n\
    \nNow that we understand the format of the input XML document and understand which\
    \ elements have to be removed, let's take a look at the XSLT stylesheet that performs\
    \ our transformation. The XSLT stylesheet is shown in Listing 8.18. Let's step\
    \ through the stylesheet and make sure that we understand how it works.\n\n+ \
    \  Listing 8.18 XSLT stylesheet to filter proprietary elements from the input\
    \ XML document. (Filename: ch8_sab_annual_report.xslt)\n1. <xml version=\"1.0\"\
    \ encoding=\"UTF-8?>\n2. <xsl:stylesheet version=\"1.0\">\n3. <xsl:xmlns xmlns=\"\
    http://www.w3.org/1999/XSL/Transform\">\n4. <xsl:output method=\"xml\" document-system=\"\
    ch8_sab_annual_report.dtd\"/>\n5. <xsl:template match=\"\">\n6.   <annual_report>\n\
    7.   <xsl:apply-templates/>\n8.   </annual_report>\n9. </xsl:template>\n10. \n\
    11. <xsl:template match=\"annual_report\">\n12.  <xsl:for-each select=\"customer\"\
    >\n13.     <xsl:text>&#10;</xsl:text>\n14.     <customer>\n15.       <xsl:attribute\
    \ name=\"account_number\">\n16.         <xsl:value-of select=\"@account_number\"\
    />\n17.     </xsl:attribute>\n18. \n19.     <xsl:text>&#10;</xsl:text>\n20.  \
    \   <xsl:element name=\"name\">\n21.       <xsl:value-of select=\"name\"/>\n22.\
    \     </xsl:element>\n23. \n24.     <xsl:text>&#10;</xsl:text>\n25.     <xsl:element\
    \ name=\"poc\">\n26.       <xsl:value-of select=\"poc\"/>\n27.     </xsl:element>"
