  md: '# Defining the Structure and Content of an XML Document


    Whenever you declare an element in a DTD, you use the following format:



    In this case, you are declaring the element name is <daily_activity>, and the
    content of the <daily_activity> element is multiple <transaction> child elements.
    Also, the <daily_activity> element is the root of your XML document because it
    is the first element to appear in the DTD. Note the plus sign "+" in the declaration
    of the <daily_activity> element. That is an indicator of the number of children
    that the <daily_activity> element is permitted to have. The valid suffixes are


    +   * zero or more occurrences of the element

    * zero or one occurrence of the element

    * one or more occurrences of the element


    In the absence of one of the suffix characters, the DTD allows only one occurrence
    of the child element.


    The next declaration in your DTD is


    This is the declaration for an element attribute that uses the following format:


    The <element_name> and <attribute_name> parameters are self-explanatory, but let''s
    take a closer look at their types and the default parameters. In your case, you
    have one attribute associated with the <daily_activity> element branch and the
    attribute type is CDATA. Note that several attributes can be declared as part
    of each ATTLIST declaration. The attribute_type parameter specifies the type of
    the attribute. Currently, 10 attribute types are supported:


    +   * CDATA—Attribute value data is character data.

    * ENTITIES—Attribute value data is made up of multiple entities that are defined
    elsewhere in the DTD.

    * ENTITY—Attribute value data is a single entity that is defined elsewhere in
    the DTD.

    * Enumeration—Attribute data must be selected from an enumerated list. This bounds
    the possible user inputs (for example, an enumerated list containing days of the
    week would only contain Monday, Tuesday, Wednesday, Thursday, Friday, Saturday,
    and Sunday, limiting the possible values to only valid values). Note that the
    enumeration type is the only attribute type that doesn''t have a DTD keyword,
    hence the lowercase name.'
