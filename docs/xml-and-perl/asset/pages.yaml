  md: '# Colophon


    The image on this book''s cover depicts Hadrian''s Wall, which runs across northern
    Britain. The Wall was built by order of the Emperor Hadrian, probably around A.D.
    122, and was likely intended to serve as the northern border of the Roman Empire.
    Many remains of the wall still exist, and it is listed as a World Heritage Site
    by UNESCO. Originally, the wall was approximately 73 miles long and 5 meters high.
    The photograph was captured by PhotoLink/PhotoDisc.


    This book was written and edited in Microsoft Word, and laid out in QuarkXPress.
    The font used for the body text are Bembo and Mono. It was printed on 50# Husky
    Offset Smooth paper at R.R. Donnelley & Sons in Crawfordsville, Indiana. Prepress
    consisted of PostScript computer-to-plate technology (filmeless prepress process).
    The cover was printed at Moore Langen in Terre Haute, Indiana, on Carolina, coated
    on one side.'
