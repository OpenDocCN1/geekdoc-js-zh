- img_proc: true
  md: '# XML Remote Procedure Call 361


    Unicode a universal character-encoding standard that represents text for computer
    processing. Unicode provides a method of encoding languages that use characters
    outside of the standard ASCII character set. Additional information on Unicode
    can be found at http://www.unicode.org.


    WSDL (Web Services Description Language) An XML format describing network services.
    These services are offered on the web accessed using SOAP. For example, a network
    service could offer stock quotes, taking a stock symbol as input and returning
    the current stock price. For additional information on WSDL, please see http://www.w3.org/TR/wsdl/.


    Universal Description Discovery and Integration See UDDI.


    W3C (World Wide Web Consortium) A group comprised of over 500 organizations dedicated
    to promoting interoperability of web-based standards. The W3C is responsible for
    over 40 technical specifications that basically form the infrastructure of the
    World Wide Web. Additional information on the W3C is available at http://www.w3c.org.


    XHTML (eXtensible Markup Language) A major change to HTML that brings the stricter
    formatting rules found in WML to HTML. For example, while some browsers would
    display HTML that was missing tags, all opening tags in XHTML must have a corresponding
    end tag. It will also enable developers to deliver pages to a number of new devices,
    such as cellular phones. Additional information on XHTML can be found


    Web Services Description Language See WSDL.


    http://www.w3.org/TR/xhtml1/


    Wireless Markup Language See WML.


    WML (Wireless Markup Language) An optimized language used for specifying presentation
    and user interaction on particular devices, such as mobile phones and WML PDAs.
    Basically, WML provides a framework for supporting web clients that do not have
    access to the full suite of XHTML features due to physical constraints (for example,
    display size, bandwidth).


    XLink (XML Linking Language) Specifies a language to support linking (similar
    to HTML hyperlinks) in WML. For additional information, see http://www.w3.org/XML/Linking.


    XML (eXtensible Markup) A language defined by the W3C to facilitate distribution
    of information on the World Wide Web. Additional information can be found at http://www.w3.org/XML/


    World Wide Web Consortium See W3C.


    XML Remote Procedure Call See XML-RPC.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# XML-RPC (XML Remote Procedure Call)


    XML-RPC (XML Remote Procedure Call) A specification and implementation that defines
    remote procedure calling. The transport mechanism is HTTP and XML is the encoding
    scheme. Additional information can be found at http://www.xmlrpc.com/.


    XSLT (eXt Stylesheet Language Transformation) A language for transforming XML
    documents into other XML documents. Can be used as part of XSL or independently
    of XSL. Additional information can be found at http://www.w3.org/TR/xslt.


    XML Schema An XML-based standard defines the content and structure of an XML document.
    At a high level, it performs the same task as a DTD (that is, it can be used to
    validate an XML document); however, XML Schema provides more options when it comes
    to specifying data types and number of occurrences. Additional information can
    be found at http://www.w3.org/XML/Schema.


    XSL Stylesheet An XML document that contains templates or rules used by XSL processor
    to transform an XML document. XSLT stylesheets can be used to convert XML documents
    to other formats (for example, HTML or CSV) and into filtered XML documents.


    XPath A language that enables you to address and access specific parts of an XML
    document. It was originally designed for use by XSLT and XPointer. Additional
    information can be found at http://www.w3.org/xpath/


    XPointer (XML Pointer Language) Non-XML syntax based on XPath that supports addressing
    the internal structures of XML documents. Additional information can be found
    at http://www.w3.org/TR/xptr/


    XSL (eXtensible Stylesheet Language) A language used to write XML output templates.
    XSL data can be transformed into XML, HTML, WML, and any other plain text format
    through the process of transforming an XML document via an XSL stylesheet is called
    XSLT (XSL Transformation).'
