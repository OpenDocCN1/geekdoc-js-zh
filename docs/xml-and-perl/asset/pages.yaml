    # Comparing Document Type Definitions and XML Schemas


    Before we finish up this section, let''s discuss some of the advantages and disadvantages
    of DTDs and XML schemas.


    # Advantages and Disadvantages of DTDs


    Several advantages to using DTDs exist. First, DTDs are easy to learn and work
    with, and therefore they have a relatively short learning curve. So, you can be
    working with DTDs in a short amount of time. As you have seen from the examples,
    DTDs can be very compact, even for fairly complicated XML documents. If you''re
    new to XML, DTDs might initially be a little easier to work with compared to XML
    schemas.'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'DTDs do quite have a few shortcomings. First, DTDs are not in XML, so you need
    to become familiar with the format used by DTDs in addition to learning XML. Also,
    DTDs have limited capabilities. For example, using a DTD, you can''t specify that
    elements must contain a particular data type. All you can do is specify that some
    type of data is present in an element. Remember, one of the main uses for XML
    is to facilitate the exchange of data. DTDs not allow you to specify data types.
    As a result, you will need to add additional error checking to your application
    to validate the input data in the XML document whenever you are using DTDs (because
    they can create unnecessary, additional work).


    # Advantages and Disadvantages of XML Schemas


    XML schemas have several advantages. First, contrary to DTDs, XML schemas are
    written in XML. It''s easier to work in XML, especially if you are learning XML
    for the first time. Another advantage of XML schemas is that they are much stricter
    than DTDs. For example, you can specify data types for elements. This allows for
    more control over input data and enables you to reduce the input type checking
    required in your application.


    The major disadvantage of XML schemas is their complexity and size. Initially,
    they can be overwhelming. In our example, the XML schema is approximately four
    times the size of the DTD that describes the same XML document. However, a number
    of commercial and freely available tools and editors are available to help automate
    the process of XML schema development. One of the more popular commercial tools
    used throughout the development of the book is XML Spy (http://www.xmlspy.com).


    As you become more familiar with XML, you will begin to see that the extra work
    required by XML schemas is well worth the effort.'
  merge: -1
