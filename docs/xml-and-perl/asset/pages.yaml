  md: '# Why Store Data in XML?


    Data storage facilities are very critical for today''s business operations. Today''s
    businesses continually accumulate data, whether it''s customer information, production
    information, or any of thousands of other categories of information. This data
    needs to be stored some place, and better yet, it needs to be stored in a relational
    format for easy retrieval and integration with other data. RDBMS systems like
    Oracle, Microsoft SQL Server, MySQL, PostgreSQL, and many others are used to perform
    such tasks when security, speed, and efficiency pose concerns. RDBMS systems offer
    a great solution whenever internal or company-developed applications require access
    to the data.


    The potential problem arises either when one application needs to access data
    of another application but not have direct access to that application''s database
    system, or when data needs to be ported between different database systems (especially
    if the systems are from different vendors). RDBMS store their data in binary formats
    that are not directly accessible by other databases. Any external application
    wishing to interact with this data needs to utilize a database Application Programming
    Interface (API) provided by the RDBMS specifically for that or a generalized interface,
    such as the Perl Database Interface (DBI). The Perl DBI provides a database independent
    API to a large number of databases. DBI''s homepage is located at http://dbi.perl.org,
    where you can find a lot of information including the FAQ, documentation, mailing
    lists, and so forth.


    # Introduction to the Perl Database Interface


    Throughout the book, I''ve mentioned a number of reasons for the success of XML—platform
    independence, easy to read, easy to adapt, widespread acceptance, and a number
    of other reasons. Unfortunately, the same statements do not apply to the RDBMS
    used today. All the major RDBMSs are based on proprietary code. The problem with
    proprietary interfaces (in addition to the learning curve) is that they can tie
    your application to a particular RDBMS. The Perl DBI was developed by Tim Bunce
    to address these problems; it provides a consistent, platform-independent API
    to a large number of the most popular RDBMSs. In the next section, we''ll take
    a look at the Perl DBI architecture.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# Perl Database Interface Architecture


    The Perl DBI provides an API to a RDBMS by abstracting (hiding) the differences
    between RDBMSs from different vendors. So, to you (and your application), the
    API remains the same, regardless of the database with which your Perl script is
    communicating. A high-level view of the Perl DBI is shown in Figure 6.1.


    ![](img/e22859c8cc5393df3568af9529713fd6_193_0.png)


    Figure 6.1 Perl DBI architecture.


    As you can see in the figure, the Perl DBI provides an API between your application
    and the various RDBMSs. It is important to note that the API between your application
    and the Perl DBI remains consistent, regardless of the RDBMS. What does change,
    however, is a Database Dependent (DBD) driver that acts as the interface between
    the Perl DBI and the RDBMSs. The DBD driver, as you can probably guess from the
    name, varies per database. It provides a translation between the RDBMS-independent
    DBI calls and the corresponding database-specific calls. As long as you load the
    appropriate DBD driver (which is just a Perl module) for your database, you only
    need to concern yourself with the API between your application and the Perl DBI—the
    underlying DBD handles the route.


    # Perl Database Interface Example


    Let''s take a look at a short example showing a Perl DBI script. This example
    is using the MySQL open source database. Because we''re demonstrating the Perl
    DBI, you can use any supported database. The only change you will need to make
    to the example is to load and reference the appropriate driver for your database.'
  merge: -1
  pgno: 193
