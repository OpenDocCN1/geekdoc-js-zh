  md: '# XML::SAX::PurePerl Perl Module


    XML::SAX::PurePerl is a SAX2 parser that is entirely written in Perl. Most of
    the other modules have C library dependencies that are usually hidden from the
    user. Why would it matter that the module is written entirely in Perl? Well, you
    could encounter a few situations where this would be very important.


    What would happen if some crisis popped up and you needed to perform some XML
    parsing on a mission-critical web server that was currently live and servicing
    customers? Assume that the machine has Perl installed (of course), but doesn''t
    have a C compiler—it has been removed to discourage users from developing on the
    machine and also to free up disk space. Also, assume that you do not have administrative
    privileges on the machine, and that the system administrator is on vacation. If
    you think about it, this isn''t an unrealistic situation, and something similar
    has probably could reside in the company DMZ—physically in your building, but
    outside the corporate firewall. This would be the ideal situation to utilize the
    XML::SAX::PurePerl module. Because XML::SAX::PurePerl doesn''t have the benefit
    of a C library, it is extremely slow for multi-user production environments. However,
    in a situation such as the one just described, performance probably isn''t the
    most important measure of success. Sometimes, it is more important to get the
    job done than it is to get the job done quickly.


    # XML::SAX::PurePerl Application


    Let''s take a look at an example using XML::SAX::PurePerl. Assume that your company
    uses a time reporting system and that every Friday it generates an XML file that
    contains the timecard information for all employees. In this example, we''ll use
    the XML::SAX::PurePerl module and generate the required summary report.


    First, let''s take a look at the DTD and XML schema for the XML document we''ll
    need to process. The DTD is shown in Listing 3.11. As you can see, it contains
    all the information that might appear on a typical timecard. The root element
    is `<timecard_report>`, and it is made up of multiple `<employee>` elements. Each
    `<employee>` element has two attributes (name and `employee_num`) and a child
    element `<project>`. The project element contains `<project_number>` element and
    the `<hours_charged>` element.'
