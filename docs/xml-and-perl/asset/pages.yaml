  md: '# 270 Chapter 9 AxKit


    # Installing on Microsoft Windows


    If you want to install the Apache web server and mod_perl on Windows, you either
    have to repeat the previous steps with Microsoft Visual C++ and the nmake utility,
    or you can download and install the Apache binary from http://www.apache.org/dist/httpd/binaries/win32/


    If you are running the ActiveState version of Perl under Microsoft Windows, you
    can use the ppm utility to install the mod_perl binary by running this command
    in the command line:


    ```

    ppm install http://theory5.uwinnipeg.ca/ppmpackages/mod_perl.ppd

    ```


    > Note

    If you have any questions about installing Perl modules with PPM, instructions
    can be found in Appendix B.


    # Apache Web Server Configuration


    After the Apache web server, mod_perl, and all required libraries and modules
    have been installed, you will need to configure Apache to utilize AxKit for processing.
    You''ll need to edit your Apache configuration file, httpd.conf.


    > Note

    For our example, we''re assuming that the Apache web server is accessed in the
    local machine using the default port 80.


    Because we don''t want to modify the server''s configuration if it is already
    running, we''ll create a new directory named axkit-stuff and configure Apache
    to serve from that directory using AxKit:


    +   * Make sure you are executing this command as the root user

    $ cd /usr/local/apache

    $ mkdir axkit-stuff


    > Note

    The following commands assume Apache is installed in the standard /usr/local directory
    on Unix/Linux system. Microsoft Windows users have to modify the following commands
    a bit to accommodate the Microsoft Windows file structure as well as equivalent
    commands. Note also that starting and stopping the Apache web server can be accomplished
    by using the proper commands on the Start menu. Microsoft Windows users can check
    their httpd.conf files by using a tool found on the Start menu.'
