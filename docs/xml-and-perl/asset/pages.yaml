  md: '# Validating XML


    Once we''ve generated an XML document (or received one from another source), there
    are Perl modules that will help you validate the XML document. An XML document
    is considered valid if it complies with a Document Type Definition (DTD) or XML
    schema. There are several Perl modules that support XML validation (for example,
    Apache Xerces), and they will be discussed later in the book.


    # Parsing XML


    Parsing is a concept that goes back a long time (in programmer''s time, not historical
    time). Parsing data, in simple terms, is to break the data down into the fundamental
    components that mean something to the application or the end user. An XML parser
    is a program that does exactly that—it parses an XML document based on the XML
    rules and syntax defined in the XML standard, and it provides that information
    to the requesting application. Information usually comes in a data structure for
    each construct. If the construct is queried by the application, it will give you
    information about the construct. For example, for the open element construct (which
    is recognized whenever the parser encounters a combination of characters similar
    to <element_name>), the parser provides the element''s name and other relevant
    information to the appropriate event handler.


    # Transforming XML


    XML can be transformed to a number of different formats. For example, an XML document
    can easily be converted to another XML document, HTML, CSV, or any of a number
    of different formats. This feature of XML is very important and allows a great
    deal of flexibility when presenting XML data. There are a number of Perl modules
    that support XML transformation and they''ll be discussed in detail throughout
    the book.


    # Note


    Remember, there is a difference between data and information. The term data can
    be used to describe an entire XML document (data = markup + information). Information,
    on the other hand, is the actual information contained in the XML data.'
