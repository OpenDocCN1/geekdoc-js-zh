    <?xml version="1.0" encoding="UTF-8"?>

    <!ELEMENT atm_log (transaction*)>

    <!ATTLIST atm_log date CDATA #REQUIRED>

    <!ELEMENT transaction (name,account,amount)>

    <!ATTLIST transaction type (withdrawal | deposit) #REQUIRED>

    <!ELEMENT name (#PCDATA)>

    <!ELEMENT account (#PCDATA)>

    <!ELEMENT amount (#

    ```


    As you can see, this is a straightforward DTD. The <atm_log> root element is named
    date, and has one attribute which contains the date that the ATM log was collected.
    The <atm_log> element contains multiple <transaction> elements. Each of the <transaction>
    elements contains <name>, <account>, and <amount> element and a transaction_type
    attribute. Note that the transaction_type attribute has only two valid values,
    withdrawal or deposit. The corresponding XML schema is shown in Listing 3.23.'
