    Perl module. The XML::SAXDriver::Excel module has the same interface as the XML::SAXDriver::CSV
    module, thanks in part to SAS standard. The complexities of parsing the underlying
    Microsoft spreadsheet file are hidden from the user.


    The Microsoft Excel document that needs to be converted to XML is shown in Table
    7.1. As you can see, it is a typical spreadsheet that contains expense or budgeting
    information. Note that the spreadsheet has column headings in the first row and
    several records of data.


    Table 7.1 Microsoft Excel file containing business expenses. (Filename: Ch7_excel_input.xls)


