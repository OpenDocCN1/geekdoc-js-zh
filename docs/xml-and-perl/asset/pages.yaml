    97. \n```\n\n# Initialization\n\n1-38 Our program starts with the standard use\
    \ strict pragma, and then we utilize the use pragma to load the XML::Parser module.\
    \ Next, we call the new function, which initializes the parser. Note that this\
    \ call to new is very similar to a C++ constructor.\n\n# Note\n\n> Remember it's\
    \ always a good idea to take advantage of the use strict Perl pragma. The use\
    \ strict pragma limits potentially unsafe code.\n\nWe pass two attributes to the\
    \ new function, Style and Handlers. The Style attribute tells the parser parsing\
    \ style we would like to use. The Stream value tells the parser to use the stream\
    \ method of parsing, which is the event-driven model. Because we decided to use\
    \ the event-driven model, we also need to use the Handlers attribute to pass the\
    \ event handler functions. Handlers actually points to another hash, which contains\
    \ the actual references to the subroutines that we will use to handle the predefined\
    \ events. In this case, we assigned a handler subroutine to the Init, Start, Char,\
    \ End, and Final events. All the subroutines that we defined (init, start, char,\
    \ end, and final) are subroutines that we will define in our program, and each\
    \ will be called by the XML::Parser module whenever the corresponding event is\
    \ encountered. Now that the subroutines have been defined for each of the required\
    \ handlers, and the parser has been initialized, we can start parsing the XML\
    \ document. The XML::Parser module has three functions for parsing XML data: parse,\
    \ parsestring, and parsefile. The first two functions are basically the same,\
    \ expecting an input of XML data as a string. Note that the parsestring function\
    \ is available only to provide backward compatibility for older applications.\
    \ In our case, we will use the parsefile subroutine because our XML data is in\
    \ a standalone file."
