  md: "> Note\nIf you have any questions about Perl modules (for example, where to\
    \ get them, how to install them, and so forth), please refer to Appendix B, \"\
    Perl Essentials.\",\n\n# What Is a Tree-Based XML Parser?\n\nDuring the last chapter,\
    \ we discussed event-based XML parsers. An event-based XML parser defines subroutines\
    \ that are triggered whenever the XML parser encounters a particular construct.\
    \ This chapter discusses an alternative to event-based XML parsing called tree-based\
    \ XML parsing.\n\nA tree-based XML parser takes a different approach to the task\
    \ of parsing an XML document. Contrary to the event-based approach where the application\
    \ defines event handlers and waits for the handler to be triggered, the tree-based\
    \ approach to XML parsing is more active. In the tree-based approach, the entire\
    \ XML document is parsed and the entire document is stored in memory in a structure\
    \ similar to a tree. To access a particular portion of the XML document, the application\
    \ must actively retrieve it. As you can see, this is the opposite approach to\
    \ an event-based parser where an event handler would need to be defined and wait\
    \ until the parser encounters the corresponding construct.\n\nAs an example of\
    \ how a tree-based parser works, let's assume that your client contacts are stored\
    \ in an XML document such as this:\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<contacts>\n  <client>\n    <name>Mark</name>\n    <phone>111-222-3333</phone>\n\
    \  </client>\n  <client>\n    <name>Joseph</name>\n    <phone>222-333-4444</phone>\n\
    \  </client>\n</contacts>\n```\n\nThe tree-based parser would take the XML document\
    \ as input and generate a tree structure in memory that contains the data. Figure\
    \ 4.1 shows a high level view of a tree-based parser. As you can see, the parser\
    \ takes an XML document as input and generates a tree structure containing the\
    \ contents of the XML elements."
