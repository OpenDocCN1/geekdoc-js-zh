  md: '# Advantages of Event-Driven Parsers


    Event-driven parsers have several advantages over tree-based parsers.

    Event-driven parser can handle huge amounts of XML data. Let''s say that you need
    to parse XML data in a file that is hundreds of megabytes in size. The parser
    works through the file, reading each line, triggering events when they''re needed.
    A DOM-based parser would need to read the entire file into memory at once, something
    that might be difficult on smaller PCs or workstations. For the same XML data,
    a DOM-based parser requires more memory. Depending on the size of the XML data,
    it could be impractical (or even impossible) to use a DOM-based parser.

    Another advantage of an event-driven parser is the complete XML file doesn''t
    need to be available to start parsing. That''s because the event-driven parsers
    don''t know anything about the XML data; for example, whether it is stored in
    a file or in memory. The only concern an event-driven parser has is to look for
    the relevant patterns and trigger the corresponding callback function. This is
    important if you''re working in a client-server environment. An event-driven parser
    can parse XML data as it is read from a socket rather than waiting for the entire
    XML file to be delivered to the parser.


    # Disadvantages of Event-Driven Parsers


    Event-driven parsers have several disadvantages compared to DOM- or tree-based
    parsers.

    Event-based parser applications are more difficult to develop than the equivalent
    DOM-based parser application. In an event-driven parser application, the data
    is pushed into the application by the parser, so the application must be prepared
    to accept and process the data using a series of event handler subroutines. The
    subroutines aren''t difficult to develop, especially after you have a sample application
    to use as a template, but it does require some time and effort on your part. An
    application built using DOM- or tree-based parser behaves a little differently
    in that the parser builds a tree, and it is the responsibility of the application
    to retrieve the data. So, the DOM-based parser handles the storage of the XML
    data (in the form of a tree), and an event-based parser application is required
    to store data on parser-driven events.

    Another disadvantage of an event-based parser is that it doesn''t have the concept
    of an entire XML document nor of an XML document''s hierarchical structure. Yes,
    this was listed as an advantage, and I consider it to be more of an advantage
    than there are times when you want to operate on an entire XML document. This
    is easy to do with a DOM- or tree-based'
