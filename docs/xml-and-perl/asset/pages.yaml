  md: '# XML::SAX:Expat-Based Application


    In a production environment, computer resources are critical. Ideally, we want
    applications to run as efficiently (in terms of both memory usage and speed) as
    possible. Although SAX parsers do not require a lot of memory, we always want
    to minimize the number of helper or miscellaneous processes running on a server
    so that the available resources are freed for mission-critical applications.


    Let''s say we''re working for a busy online retailer and it is the holiday season.
    All the incoming orders are stored in an XML file. Our task is to parse the XML
    file containing the orders and generate shipping labels for the warehouse orders.


    # XML::SAX:Expat Application Discussion


    The incoming orders are stored in a simple XML document based on the format of
    the DTD in Listing 3.17. As you can see, the DTD has a root element named <shipping_orders>
