    Listing 10.5 Program that uses the SOAP::Lite module and a WSDL file to retrieve
    the temperature based on a zip code. (Filename:ch10_getWeather.wsdl.pl)


    +   1. use SOAP::Lite;

    2.

    3. $result = SOAP::Lite

    4. ->service(''http://www.xmethods.net/sd/2001/TemperatureService.wsdl'')

    5. ->getTemp(88736);

    6.

    7. print $result;


    Running this example, the result was 84 degrees (a warm summer day). As you can
    see, this is a very short example, but I believe it is an important example. It
    demonstrates how to use a WSDL XML document to access a web service. Looking at
    the above example, we can see that the WSDL file is first loaded using the SOAP::Lite
    service method, and then the method is called. Notice that we didn''t have to
    specify the service names or location because SOAP::Lite retrieves this information
    from the WSDL file. Also, note that we didn''t need a copy of the WSDL XML document
    to access the web service; we just needed a path to the WSDL file. So far, the
    examples have only been SOAP clients. In the next example, I''ll show you what
    is required to build your own web service provider application.


    # Web Service Client and Server Example


    Now that I demonstrated how easily SOAP clients can be built and used with the
    existing SOAP servers, we''ll build a full SOAP application (that is, both the
    server and the client). So, if you wanted to register this application as a web
    service with web services directory, it would be accessible through the Internet.


    Because SOAP was originally designed to be platform- and language-independent,
    the SOAP client and SOAP server can each reside on two different platforms and
    can be written in two different languages. For example, Weather-Temperature service,
    which we accessed in our earlier SOAP client examples, was actually using the
    Apache SOAP toolkit for Java. We don''t need to know which web service resides
    on, nor do we need to know which toolkit/language was used to develop the service.
    As long as a web service conforms to the SOAP standards, we know our client will
    be able to communicate with the web service.'
