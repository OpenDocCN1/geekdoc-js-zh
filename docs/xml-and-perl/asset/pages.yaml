    # What Is a Sequential Access Event-Driven XML Parser?\n\nThe topic of sequential\
    \ access parsers is one of the most interesting concepts in the world of XML parsing.\
    \ Because XML data is structured and appears in a particular order, these parsers\
    \ enable us to access this data in the same order or sequence that was defined\
    \ by the original XML data developer.\n\nMost of the sequential parsers today\
    \ are event-driven, and that is why confusion exists between the two concepts.\
    \ A sequential access parser can be event-driven, but it doesn't have to be because\
    \ it can conform to another model. In the event-driven model, the sequential parser\
    \ returns the chunks of XML data to the program, this data is passed to a user-defined\
    \ function, which then processes the data. This function is called a callback\
    \ function. A user can define a callback for each event (for example, each open\
    \ tag, tag close, text, and so forth) and the parser will trigger the correct\
    \ event when construct (event) is encountered. Usually, data associated with the\
    \ construct (the element name) is passed into the callback function as an argument.\n\
    \nA sequential event-driven XML parser starts at the top of the XML data and steps\
    \ through the data line by line. For example, let's say that we have to parse\
    \ the following XML data:\n\n```\n<xml version='1.0'?>\n<employees>\n  <home_addresses>\n\
    \    <name>Joseph Burns</name>\n    <street>123 Main Street</street>\n    <city>New\
    \ York</city>\n    <state>NY</state>\n    <zip>10452</zip>\n  </home_addresses>\n\
    </employees>\n```\n\nIf we define a callback function that is called when an open\
    \ tag for an element is encountered, it would be called in the following order,\
    \ for each element: <employees>, <home_addresses>, <name>, <street>, <city>, <state>,\
    \ and <zip>. Because the callback functions are called for each element in the\
    \ same order as the elements appear in the XML data, this enables you to"
