  md: 'easily develop a Perl program to parse the XML data. It eliminates all the
    logic in your application that would be required if you didn''t know the structure
    of the XML data.


    These parsers are very fast.efficient because they simply read XML and return
    data to the program in chunks. The application then decides what to do with these
    chunks of data—process them or discard them—and enables the parser to proceed.
    These actions are performed until all the XML data is read, or until the parser
    exits (due to an error or a user-defined command).


    Now that we have discussed some of the theory behind XML parsers, let''s take
    a look at some examples.


    # XML::Parser Perl Module


    The XML::Parser module was originally written by Larry Wall and serves as a wrapper
    for James Clark''s Expat parser''s C libraries. Expat was one of the first XML
    parsers available, and it has proven itself over time to be very fast and powerful.
    Because Expat was one of the first XML parsers developed, it doesn''t implement
    SAX, DOM, or XPath interfaces because the standards didn'' exist or were immature
    and weren''t widely accepted.


    XML::Parser is also the underlying parser to several other parser implementations,
    but that is now changing with the development of the SAX2 interface and the XML::SAX
    module. As you will see, the XML::Parser module is full of features that can accomplish
    just any XML parsing task, and because of these numerous features, it is a very
    powerful tool for XML processing. The underlying Expat parser and the XML::Parser
    module are very stable because they have been around for some time.


    # XML::Parser-Based Application


    Let''s create and examine a relatively small application. Assume that your company
    has a outsourced PC system administration to a support contractor. The support
    contractor stores all his information in a database and delivers reports to your
    company in XML. Your task is to develop a utility program that prints out a report
    for the non-technical personnel who are not yet familiar with the format of an
    XML document. This XML document can be very large, depending on the number of
    software packages that the company purchases. Because the reporting program will
    have to run on one of their standard desktop PCs (which in some cases might be
    an older, slower machine), we need to develop a resource-efficient program. This
    is the type of application where the stream-style processing in XML::Parser proves
    to be very beneficial.'
