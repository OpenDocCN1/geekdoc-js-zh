  md: "XML::SAX::ParserFactory returns a parser of choice in three different ways.\n\
    \n+   Setting the XML::SAX::ParserPackage variable. It should be assigned the\
    \ package name and can also contain the minimum version number.\n\n```\n$XML::SAX::ParserFactory\
    \ = \"XML::LibXML::SAX::Parser (1.0)\";\n```\n\n+   Using a require_feature function\
    \ to set the features that the parser must support. This method will query all\
    \ parsers in SAX.ini and return the last installed parser that supports these\
    \ feature(s) as shown in the following:\n\n```\nuse XML::SAX::ParserFactory;\n\
    my $factory = XML::SAX::ParserFactory->new();\n$factory->require_feature('http://xml.org/sax/features/validation');\n\
    my $parser = $factory->parser(...);\n```\n\n# Or you can also specify this within\
    \ the new function\n\n```\nmy $factory = XML::SAX::ParserFactory->new(RequiredFeatures\
    \ => {\n\t'http://xml.org/sax/features/validation' => 1,\n});\n```\n\n+   Creating\
    \ a SAX.ini file and listing the requirement in it. Here is a sample line in SAX.ini:\n\
    ParserPackage = XML::SAX::Expat (0.30)\n\nThe information is written in foo =\
    \ bar format. If you wanted a parser with certain features you can use this line:\n\
    http://xml.org/sax/features/validation = 1\n\nThe XML::SAX::ParserFactory object\
    \ searches for the SAX.ini file in $INC and uses it if found.\n\n+   If none of\
    \ the above are specified, the parser will return the last installed SAX parser\
    \ on the system. XML::SAX comes bundled with XML::SAX::PurePer and therefore,\
    \ you will always have this parser to fall back on in case no other parser is\
    \ installed.\n\nIf the ParserFactory does not meet any of the above set criteria,\
    \ it throws an exception.\n\nYou now see the significance of using the XML::SAX\
    \ module and how it can benefit the SAX applications development. Let's take a\
    \ look at how we can use this facility in a real application."
