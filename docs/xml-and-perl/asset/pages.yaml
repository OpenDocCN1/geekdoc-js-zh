- img_proc: true
  md: 'Because these types of problems exist, there are Perl modules designed to help
    you solve them. Remember, someone has probably already run into the problem you''re
    having. SAXDriver modules are designed to facilitate converting other data formats
    into XML by giving you the flexibility of providing your own conversion rules
    and by being very efficient and light-weight(that is, small memory footprint).
    These are important qualities that would enable you to deploy these applications
    in a critical production environment and deal with large XML documents. Imagine
    the tasks that could accomplish if you create an XML communication middleware
    application, and then effortlessly adapt any other format by converting it to
    XML without having to change the middleware business rules. Currently, two Perl
    modules enable you to easily accomplish this task: XML::SAXDriver::CSV and XML::SAXDriver::Excel.
    Let''s take a closer look at these modules.


    # XML::SAXDriver::CSV Perl Module


    CSV format used to be the format of choice for small information interchange tasks
    between two applications. Insert the data with each field separated by a comma
    and send. Here is a small sample of a CSV file that contains accounts receivable
    information:


    +   Account Num,Name,Address,Balance

    1,Mark Riehl,1600 Main Street,$39.95

    2,Iliya Sterin,1299 Pine Street,$29.95


    Note that each CSV record is on a separate line delimited by a newline. Usually
    (but not always), CSV files have a column title that appears on the first line
    of the file.

    The receiving application just splits this data based on its delimiter, comma,
    and proceeds to process this information. Several potential problems associated
    with CSV files exist. The first application must know the order of the fields
    in the file to make any sense out of this data. With XML, every field is described
    by its tag name (and possibly attributes), the data does not necessarily have
    to be in any order, as long as they are communicating with data formatted using
    XML. Second, CSV files can be confusing if the data contains embedded commas.
    The parsing application (whether it is Perl, C/C++, or Java) assumes that all
    commas separate fields (even if they appear in the field). XML also has a facility
    for specifying data types (for example, text, float, integer, and so forth) by
    using XML schemas. CSV files do not have the notion of a data type, so applications
    that use CSV files treat all columns as plain text. With these disadvantages,
    CSV files are widely used and will continue to be for some time. So, we''ll need
    to support them. Let''s take a look at how easily we can develop a Perl program
    to convert a CSV file to XML.'
  merge: -1
  pgno: 218
