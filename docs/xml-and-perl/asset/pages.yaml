  md: '# Different Methods of Generating XML Data


    As I mentioned earlier, there are two types of XML data—static XML documents and
    dynamically generated XML documents. Two approaches to generating XML data also
    exist. I call them the “crazy” approach and the “lazy” approach.


    Note

    Remember, XML data can consist of a standalone file or XML data in memory (for
    example, dynamically generated XML data that is sent across a network).


    # Using the Perl print Function to Generate XML Data


    The crazy approach refers to using Perl’s print function to print out all parts
    of the XML document. Because an XML document is just plain text, it can be easily
    generated using the standard Perl print function. In the next few sections, we
    will take a closer look at the advantages and disadvantages to this approach.


    # Advantages of Using the Perl print Function


    A few (but not too many) advantages exist for using the Perl print function to
    generate your XML documents.


    +   - It’s simple. Just use the Perl print function to generate XML documents.

    - It can be performed very quickly with basic Perl skills. Perl’s print function
    is quick and easy to use for short, simple XML documents.

    - Your application will not have external module dependencies. One possible situation
    when this could be important is in the case of a production server. Let’s say
    that you’re working on the server; however, because it’s the production server,
    you’re restricted from installing any modules.'
