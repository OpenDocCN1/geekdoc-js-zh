    1-7 In this section of the application, we start off by using the standard use
    strict pragma statement. Because we are using SOAP::Lite, we also need the use
    SOAP::Lite pragma to load the module. The first step after loading the module
    is to instantiate a SOAP::Lite module by using the new() method.


    After we create a SOAP::Lite object, we call the uri() and proxy() methods. The
    uri() method is actually a shortcut to the serializer->uri() method. The uri()
    method enables us to specify the URI for SOAP methods. In our case, the URI is
    the method name specified in the namespace profile. Note that URIs may look similar
    to URIs, but are not required to actually point anywhere. URIs will, however,
    be unique within the space of XML documents.


    The proxy method is actually a shortcut to the transport->proxy() method. The
    proxy method enables us to specify an endpoint (or service address) for the web
    service. Note that the name of the module is prepended with the transport protocol
    that we''ll using.


    The prefix SOAP::Transport is also prepended to the name, so the module will be
    loaded and an object (with an appended \::Client") will be created. The class
    that creates objects will look for the name "SOAP::Transport::HTTP::Client",


    In this example, we are not using any transport-specific parameters, but the proxy()
    method can also accept any transport-specific parameters that may be required.
    For example, we can specify an HTTP timeout or any required cookie-specific parameters.


    +   1. use strict;

    2. use SOAP::Lite;

    3. # Instantiate a new SOAP::Lite object

    4. my $service = new SOAP::Lite

    5. ->uri(''urn:xmethods-Temperature'')

    6. ->proxy(''http://services.xmethods.net/soap/servlet/rpcpouter'');


    Note

    The context of the calls may look a little strange (that is, no commas between
    the new(), uri(), and proxy() methods). That''s because all the methods with parameters
    will return the current object.

    The SOAP::Lite Perl module author says that the module supports method "stacking".'
