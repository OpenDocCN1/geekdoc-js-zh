- img_proc: true
  md: '# 318 Appendix A What Is XML?


    # Table A.1 Continued


    Entity reference

    Certain characters cannot appear between the start and end tags of an element.
    For example, the less than character "<" is used to delimit the start and end
    tags, so it would cause confusion in XML parsers if it appeared within the character
    data. So, inside an XML document, the offending characters are mapped to these.
    When the XML document is parsed, the entity references are replaced with their
    real values. For example, an element containing the following string:


    ```

    <inventory>Mark''s computer</inventory>

    ```


    would need to actually contain the following markup inside

    an XML document:


    ```

    <inventory>Mark&quot;computer</inventory>

    ```


    Currently, the five valid entity references are

    &amp; The ampersand character "&"

    &apos; The apostrophe character "''"

    &gt; Closing tag bracket and greater sign ">"

    &lt; Opening tag bracket and less sign "<"

    &quot; Double quote character "\"


    Comment

    Comments can be inserted into XML documents by the authors as notes to themselves
    or notes to other users. A comment starts with <!-- - and ends with the first
    occurrence of ->. For example, the following would appear as a comment in an XML
    document:

    <!-This is a comment. ->


    CDATA Section

    A CDATA section of an XML document enables a user to include markup data without
    using entity references. This is helpful when the XML document contains data from
    other formats You can enclose an HTML or Scalable Vector Graphics (SVG) document
    within an XML document and not have to worry about entity references. For example,
    you would use the following notation to enclose an HTML document:


    ```

    <![CDATA[

    <html>

    <head>

    <meta http-equiv="content-type">

    <content content="text/html; charset=ISO-8859-1">

    </head>

    <body>

    <div align="Center">

    <div align="Left">This is an HTML document.<br>

    </div>

    </div>

    </body>

    </html>

    ]]>

    ```'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# # Components of an XML Document


    | Markup | Description |


    | Document Type Declaration | A Document Type Definition (DTD) defines the format
    and content of an XML document and can be either internal or external to the XML
    document. I will discuss DTDs in more detail later in this Appendix.|


    | Processing Instruction | Processing instructions (PIs) are used to pass instructions
    to applications that are working with XML documents. All PIs start with the characters
    "<?" and end with the characters "?>".


    | XML Declaration | The XML declaration must appear at the top of a well-formed
    XML document, starting at the first column. Any whitespace before the XML declaration
    in an XML document would render it invalid. There is one required parameter and
