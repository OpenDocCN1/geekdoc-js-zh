  md: "# Introduction\n\nThe purpose of this book is to introduce you to XML programming\
    \ with Perl. It is not intended as an introduction to either XML or Perl; rather,\
    \ this book is intended to be used as a both a tutorial as well as a reference.\
    \ It teaches good program design by following a problem/solution style. We have\
    \ a number of examples that can be easily used as starting points for larger and\
    \ more complicated applications. I guess you can call it a cookbook, where you'll\
    \ start out as a short order cook and end up as a cordon bleu.\n\n# What Does\
    \ This Book Cover?\n\nXML is new, and although it has been in existence for a\
    \ few years, it's now beginning to make its way to the mainstream programming\
    \ community. Everyone is looking to jump on the XML bandwagon. This book shows\
    \ you how to use XML with Perl and attempts to convince you that Perl should be\
    \ the tool of choice for XML application development.\n\nA number of technologies\
    \ and standards are related to XML. Because both XML and Perl are open source\
    \ technologies, some of the best developers from around the world are contributing\
    \ to their development. This is what makes it exciting; anyone can contribute.\
    \ Bugs are fixed immediately (not on next release) and software is customized\
    \ toward a programmer's needs (not the other way around). Everyday users have\
    \ a voice (through mailing lists and newsgroups) in the development of new capabilities\
    \ and are welcome to contribute to the effort. We hope that this book acts as\
    \ a traveler's guide as you set off on your journey, as well as a navigation system\
    \ if you happen to get lost.\n\nHere are some of the topics covered in this book:\n\
    \n+   - XML standards\n- XML parsing with Perl\n  - SAX 1 and 2 modules\n  - DOM\
    \ 1 and 2 modules\n  - Other event-driven and in-memory parsers"
  merge: -1
