  md: '# XML::Sablottron Perl Module


    This example demonstrates how to use the XML::Sablottron Perl module. Sablottron
    is an open source multi-platform XML toolkit that was developed in C++ by the
    Ginger Alliance Open Resource Center (http://www.gingeralall.com).


    The Sablottron toolkit implements an XSLT processor, a DOM parser, and the XPath
    standard. This toolkit provides extensions and APIs for several programming languages,
    and this toolkit is the basis for the XML::Sablottron Perl module that was developed
    by Pavel Hlavnicka.


    # XML::Sablottron Perl Module Example


    Let''s take a look at a Perl program that utilizes the XML::Sablottron module.
    In this example, we will filter an XML document by removing particular elements
    and generate another XML document as the output product of the transformation
    process. This type of transformation could be used between two companies who have
    agreed to exchange data in XML, but maybe have not agreed on a common DTD or XML
    schema. Another possible situation is illustrated by our example when the output
    XML document needs to have several elements (or attributes) changed or filtered
    in the output version of the XML document.


    # Input XML Document


    For this example, let''s assume that you work for a major accounting firm and
    you''re responsible for collecting and storing information for the annual corporate
    report. To provide maximum flexibility (and because you''re a forward-thinking
    individual), the information is stored in an XML document. However, some of the
    information in the XML document is considered to be proprietary because you have
    signed non-disclosure agreements with your customers, promising not to publicly
    disclose certain information. So, several of the elements in your input XML document
    must be removed before sending the XML document to the production staff.'
  merge: -1
  pgno: 270
