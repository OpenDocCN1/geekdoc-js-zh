  md: '# Running the Web Service


    After we have developed all the components that comprise the web service, we need
    to install it onto a machine. However, before we can offer a web service, we need
    to have a web server installed and listening on the default port 80. After installing
    the web server, we place our SOAP server script shown in Listing 10.10 (ch10_book_service.cgi)
    into the cgi-bin directory of the web server.


    Note

    For testing this chapter, we used the Apache web server. The Apache web server
    from the Apache Software foundation is an open source product and available for
    free download from http://httpd.apache.org. Note that if you''re using a different
    web server, our web service setup and installation instructions will have to be
    adjusted.


    Any web server should work for this example as long as it supports CGI scripts.
    However, the instructions for installation may not apply to different web servers.
    I assumed the scripts will be placed into the cgi-bin directory, but any directory
    capable of executing CGI scripts is fine as long as you modify the proxy() call
    argument in all the scripts that we''ve created and pass the correct URL to the
    SOAP server. The rest of the installation instructions assume that you have a
    cgi-bin directory and are running the Apache web server with default installation
    settings.


    +   1. Place the files from listings 10.8 (ch10_book_inventory.xml), 10.9 (Books.pm)
    and 10.10 (book_service.cgi) into the cgi-bin directory. Based on the default
    installation, the cgi-bin directory is located in the root Apache installation
    folder.

    2. Verify that files ending with a .cgi extension are executable. Standard Apache
    installations assume that .cgi extensions are executable files.

    3. Change book_service.cgi permissions to allow it to be executed. If you are
    using a Linux or a *NIX-like system, you should execute this command: chmod 755
    book_service.cgi. If you are using Windows, the default permission settings usually
    allow it to be executed, and you don''t have to change any permissions. You should
    be familiar with your system and the HTTP server and set the permissions accordingly.
    If not, ask your local system administrator; he or she should be able to help
    you with this.'
