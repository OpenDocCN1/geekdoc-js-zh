    Smith |

    | 29833 | Restaurant | $50 | Client entertainment | 2/20/2002 | 11 | Jane Wilson
    |

    | 10997 | Gas | $25 | Two day training expense | 2/17/2002 | 38 | John Smith |

    | 27342 | Office Supplies | $45 | Misc. Office Supplies | 1/10/2002 | 94 | Jonathan
    Dawson |


    To convert this Microsoft Excel file to XML, we exercise the XML::SAXDriver::Excel
    Perl module in the same way we use the XML::SAXDriver::CSV Perl module in the
    last example. The new program based on the XML::SAXDriver::Excel Perl module is
    shown in Listing 7.5. If you compare this listing to the XML::SAXDriver::CSV-based
    program shown back in Listing 7.3, you''ll see that the programs are basically
    the same except for two changes. First, we need the following statement at the
    top of the file to load the XML::SAXDriver::Excel module instead of the XML::SAXDriver::CSV
