  md: '# What Is the DOM Standard Object Model?


    The DOM is a platform and programming language independent standard that was developed
    to provide a programming API that supports both HTML and XML documents. The DOM
    was originally developed as a specification to enhance the portability of JavaScript
    scripts and Java applications between different web browsers. Early members of
    the DOM working group had a lot of hands-on experience with Standard General Markup
    Language (SGML), and they influenced the direction of the standard development.
    Thanks to all their hard work, the DOM developers have built an API that allows
    us to add, delete, retrieve, and modify the contents of XML and HTML documents.
    Of course, this chapter focuses strictly on XML documents.


    > Note

    For additional information on the DOM, please see http://www.w3.org/DOM/.


    An important concept to keep in mind is that the DOM is programming language independent.
    It specifies the structure of a document and methods for accessing the document,
    doesn''t specify any implementation details—they''re left to the individual developers.
    The remainder of this chapter focuses on the DOM-based XML parser modules.


    # DOM-Based XML Parser Modules


    The XML::DOM Perl module is a Perl implementation of the W3C DOM Level 1 specification
    that was written by T. J. Mather. XML::DOM is an extension of the XML::Parser
    Perl module that parses XML data (either files or strings). It generates a hierarchical
    data structure containing the contents of the XML::DOM Perl module to access the
    hierarchical data. The API provided by is directly based on the requirements in
    the W3C specification. In addition, the XML::DOM Perl module also has added several
    additional methods that aren''t required by the standard. Most of these additions
    have been added as helper methods that make the module easier to use.


    This module is one of the more widely used XML parsing modules. As a result of
    its widespread use, this module is very stable, very well documented, and is considered
    by many to be the de facto XML parsing module for Perl.


    > Note

    For additional information on the W3C DOM Level 1 specification, please see http://www.w3.org/TR/REC-DOM-Level-1/.'
