  md: '# Transforming XML Documents


    Now that we''ve covered parsing, generating, and searching an XML document—we
    get into another very important part of XML processing—XML transformation. You
    can transform; or in other words convert, an XML document to another format by
    applying various transformation techniques. You can transform the XML document
    to either XML document, which might be a subset of the original document by filtering
    certain info, or you can transform to a whole different format, like HTML, eXtensible
    HyperText Markup Language (XHTML), Wireless Markup Language (WML), CSV, and so
    forth.


    Why would want to convert our neatly formatted XML document to another format?
    We can read and understand the data as-is. The answer is, although as a technically
    savvy individual you took the time to learn XML and are now able to read it, most
    people would prefer their data represented in a user-friendly format.


    One of the most popular methods of transforming XML to another format is to use
    the eXtensible Stylesheet Language for Transformations (XSLT) standard. An XSLT
    processes the interface needed to transform XML data. One of the processor''s
    components is the XML parser itself, which is needed for the XSLT processor to
    understand and interact with XML. This makes sense if you think about it—the XSLT
    processor needs to parse the document to extract the information contained in
    the XML before it can format the contents. The processor requires an XSLT stylesheet
    to perform the transformation. An XSLT stylesheet is itself an XML document that
    contains embedded rules used to perform the transformation. An XSLT processor
    uses XPath and the rules contained in the XSLT stylesheet to transform the document.
    It searches through the XML data using XPath and tries to find the desired elements.


    > Note

    Will come back to XML transformations and cover them in greater detail in Chapter
    8,

    "XML Transformation and Filtering."


    One of the most common (and easily demonstrated) transformations in use today
    is from XML to HTML. While the data is transferred and processed in a nicely formatted
    XML document, the XML document must be transformed into HTML to display in the
    browser with any type of formatting.'
  merge: -1
