    After we initialize the XML::SAXSriver::CSV object, the next step is to create
    and initialize an XML::Handler::YAWriter object so that we can use it as a handler.
    The XML::Handler::YAWriter module''s new method is where we do our customization
    to output the XML data in a proper format. For example, we can specify the output
    type (such as file or scalar), custom escaping, and formatting.


    The output property is assigned to the handler to a file, out.xml, which is used
    to output the generated XML data and is opened for writing. Pretty is an anonymous
    hash that contains information for pretty printing, and we set PrettyWhiteIndent
    and PrettyWhiteNewline to true (1), to place each element on its own line as well
    as indent based on the depth level.


    Converting CSV to XML


    15-18 Now, all the setup work has been finished and we''re actually ready to call
    the XML::SAXSriver::CSV parse function to perform the conversion.


    +   15. $csv->parse(Source => $SystemId => $input_file),

    16. Handler => $writer,

    17. Declaration => (Version => ''1.0''),

    18. Dynamic_Col_Headings => 1);


    As mentioned before, properties resemble those of SAX parsers that were discussed
    in Chapter 3, "Event-Driven Parser Modules", although a few extra capabilities
    have been added to enable customization of the conversion process. Dynamic_Col_Headings.
    One of the properties used in this example is the values in the first row (that
    is, the column headings) as the XML element names. Remember, some CSV files may
    not have the column names in the first row, so we verify before using this property.
    If any of the column names contain an illegal character (for example, a space),
    it will be replaced with an underscore (_) by default. If, for some reason, you
    don''t want to use an underscore as the replacement character, you can specify
