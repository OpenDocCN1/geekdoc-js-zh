    # The Problem: Generating and Parsing an XML Document


    The two most common XML programming tasks are XML document generation and XML
    document parsing. In this section, we will present two applications that demonstrate
    how to perform these tasks. Both of these tasks are commonly performed during
    XML processing and form the basis for more advanced applications throughout the
    book.


