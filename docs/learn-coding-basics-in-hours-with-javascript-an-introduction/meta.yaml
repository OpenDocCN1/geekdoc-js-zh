  md: '# CHAPTER TWENTY FOUR

    OBJECT-ORIENTED PROGRAMMING


    As we covered earlier, objects are items within computer programs that have both
    state and behavior. The state of an object could be the weight, color, height,
    etc. While the behavior of an object would be what the object does – the actions
    it takes – such as jump, run, sit, etc.


    Object-oriented is an approach to programming that focuses on objects and data
    (as opposed to consecutive actions or some other approach).


    You create objects by creating what are called “classes,” using one of the many
    specialized computer programming languages. Classes are used to describe one or
    more objects. This would be created by creating (or “declaring”) a class called
    a “Customer” class. It is important to know that when you first create this class,
    you are describing the POTENTIAL characteristics and behavior of that TYPE of
    thing. You will still need to create an actual one of those things. That process
    is called “creating an INSTANCE” of the class, where “instance” means “an actual
    one” of the things described when you declared the class. When you do this, the
    data that makes up the object is kept in the computer’s memory.


    For example, in a computer program designed to track pay records for all employees,
    you could have a class called “Employee.” Each program element representing an
    actual employee (John Smith, Sally Jackson, etc.) would be an instance of the
    “Employee” class. You would have one instance for each employee you entered into
    the computer. Each time you created an “employee” object, the computer would first
    find the “employee” class, then use the definition of that class in creating that
    particular “employee” instance using the data for the actual employee.


    ![](img/33a81fac26246d29975692e5ecda6e53_97_0.png)'
  merge: -1
  pgno: 97
- img_proc: true
  md: "# CONSTRUCTORS\n\nA \"constructor\" is a special part of a class (a template\
    \ for defining an object [item with state and behavior]).\n\nThe constructor is\
    \ a special part of the class that describes the default state of any new instance\
    \ of the class that gets created. In other words, it gives default values for\
    \ the properties of the class.\n\nFor example, let's say you had a class called\
    \ \"Customer.\" The computer code to create the \"customer\" class might look\
    \ something like this:\n\n```\nclass Customer\n{\n    string FullName;\n    Boolean\
    \ Active;\n}\n```\n\nNow let's say that whenever you created a new instance of\
    \ the \"customer\" class, you wanted it to be an active customer – in other words,\
    \ you wanted the property \"Active\" to be set to \"true\".\n\nTo do this, you\
    \ would make a constructor for the \"customer\" class. It would be a small subprogram,\
    \ inside the class, that would be used every time an instance of the \"customer\"\
    \ class was created.\n\nThe constructor might look something like this:\n\n```\n\
    Customer(string name) {\n    Fullname = name;\n    Active = true;\n}\n```\n\n\
    The entire class would look like this:\n\n```\nclass Customer\n{\n    string FullName;\n\
    \    Boolean Active;\n    Customer(string name){\n        Fullname = name;\n \
    \       Active = true;\n    }\n}\n```"
  merge: -1
  pgno: 98
