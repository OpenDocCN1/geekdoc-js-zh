    ```\n\nSave and execute your code. Your image is displayed in the browser!\n\n\
    Now let’s try displaying an image that’s saved on your computer.\n\n# COMPUTER\
    \ IMAGE\n\nThe route to a file is called a “file path”. The “file path” is the\
    \ address of a file and specifies the exact location of a file. It provides a\
    \ “path” to the file.\n\nFile paths say things like, “You can find the file named\
    \ ‘Winter’ inside the folder named ‘Poems’, which is inside the C drive.” A drive\
    \ is simply a location where data is stored. The C drive is where most files and\
    \ software are stored on a computer.\n\nThe various components of a path are separated\
    \ by a text character that is unlikely to be used in the name of a directory or\
    \ a file. Usually this character is a slash, backslash or colon (“/”, “\\” or\
    \ “:” respectively)."
