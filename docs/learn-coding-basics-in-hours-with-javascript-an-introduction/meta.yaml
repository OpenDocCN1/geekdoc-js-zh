  md: 'The constructor would be used by asking for an instance of the “customer” class
    to be created and passing along the desired name of the customer.


    The call to create the instance of the class would look like this:


    ```

    Customer cust = new Customer("Brenda Smith");

    ```


    This creates a new instance of the “customer” class using the constructor inside
    the class. The constructor uses the string “Brenda Smith” that it was given to
    set the value of the property “FullName” and uses the instruction in the constructor
    to set the property “Active” to “true.”


    The new instance of the “customer” class, which is the variable “cust” here, will,
    therefore, have the properties:


    ```

    FullName = "Brenda Smith";

    Active = true;

    ```


    Note: The above code is given as an example and is not meant to be executed. We
    will create a constructor soon.


    # KEYWORDS


    As discussed earlier, JavaScript keywords identify actions to be performed. For
    example, var is a keyword we use to assign variables.


    An important aspect to keywords is that they cannot be used to name variables
    or functions. For example: you can’t say var var = “variable”.


    Another type of keyword is the “new” keyword, which is used to create new objects.


    We also have the “this” keyword. The “this” keyword indicates the object that
    is the owner of the code. When used within an object, the value of “this” is the
    object. When used with a function, the value of “this” is the object that possesses
    the function.


    Now we just covered a lot of information about constructors, the “new” keyword,
    the “this” keyword”, and more. Let’s put this all to use.'
