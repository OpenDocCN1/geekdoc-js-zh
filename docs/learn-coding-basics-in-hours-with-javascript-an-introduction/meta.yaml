    # CHAPTER TWENTY

    BOOLEAN LOGIC


    “Logic” refers to actions, behavior and thinking that makes sense. When speaking
    about computers, logic is the rules that form the foundation for a computer in
    performing certain tasks. Computer logic is the guidelines the computer uses when
    making decisions.


    Logical operators like "and," "or," and "not" are used to evaluate whether an
    expression is true or false.


    George Boole was an English mathematician that developed Boolean logic. “Boolean
    logic” is a form of logic in which the only possible results of a decision are
    “true” and “false”. There aren’t any vague or “almost” answers to a calculation
    or decision – black or white, no gray.


    ![](img/33a81fac26246d29975692e5ecda6e53_84_0.png)


    An example of Boolean logic would be answering questions with only “yes” or “no”.


    Boolean logic is especially important for the construction and operation of digital
    computers because it is relatively easy to create a machine where the result of
    an operation is either “true” or “false.”


    This is done by comparing two or more items – items that can only be “true” or
    “false.”


    Some common examples of such Boolean comparisons are “AND” and “OR”.


    With the Boolean comparison called “AND”, the comparison is true *only if all
    of the involved comparisons are true*.


    Let’s look at some examples to show how this works:'
  - '[PAGE 85]


    In the following AND comparison, the result is true:


    5 is more than 3 AND 10 is more than 5


    Let''s break it down.


    There are three comparisons happening here:


    +   1. Comparing 5 and 3 to see if 5 is larger than 3 (is 5 larger than 3?)

    2. Comparing 10 and 5 to see if 10 is larger than 5 (is 10 larger than 5?)

    3. Comparing the results of those two comparisons, using the Boolean comparison
    "AND" (are both comparisons true?)


    This is the overall comparison.


    It is true that 5 is greater than 3, so the first comparison is true.


    It is also true that 10 is greater than 5 – so the second comparison is true as
    well.


    A Boolean AND comparison is true if the other comparisons are all true – so in
    this example, the overall comparison is true, since the first comparison is true
    *and* the second comparison is true.


    In this next example, the result is false (not true):


    5 is more than 7 AND 10 is more than 5


    Even though 10 is more than 5, 5 is not more than 7 – so the overall comparison
    is not true.


    A "condition" is an item that must be true before something else occurs. In the
    AND comparison above, these are the two conditions checked for:


    +   1. 5 is more than 7

    2. 10 is more than 5


    They''re conditions because the outcome is conditional upon (dependant on) these
    two comparisons.'
  - '[PAGE 86]


    A Boolean OR comparison checks for whether one *or* both conditions are true.
    Here is an example:


    ```

    4 is less than 9 OR 8 is less than 7

    ```


    The result would be true because at least one of the comparisons is true (4 is
    a smaller number than 9).


    In the following example, the result would be false since neither is true:


    ```

    8 is less than 4 OR 9 is less than 3

    ```


    And in this example, the result would be true because one or both (in this case
    both) are true:


    ```

    7 is less than 8 OR 2 is less than 5

    ```


    As a reminder, in writing instructions for a computer, we would use the greater
    and lesser symbols (> and < respectively). For example: 7 > 3 means “seven is
    greater than three”, and 4 < 9 means “four is less than nine”.


    So, for example, instead of 10 is greater than 2, we would write:


    ```

    10 > 2

    ```


    And, again, if we wanted to say “greater than or equal to”, we could use the symbol
    >=.


    For example:


    ```

    10 >= 8

    ```


    This would be true.


    Like virtually all other programming languages, the Boolean values in JavaScript
    are true and false.'
- md: "## CONSOLE.LOG METHOD\n\nThe console.log method can be used to display data\
    \ in the console within the browser. The console is a tool you can use within\
    \ your browser to debug code.\n\nYou can access the console in a few ways, including:\n\
    \n- a. Pressing the F12 key and then clicking on “Console,” or\n- b. Clicking\
    \ the three upright dots in the top-right of the browser, selecting “More tools,”\
    \ clicking “Developer tools,” and then selecting “Console.”\n\nReplace the code\
    \ you last wrote with this:\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n    \
    \    <script>\n            console.log(2 + 2);\n        </script>\n    </body>\n\
    </html>\n```\n\nSave and run your code. Don't see anything? That's because it's\
    \ displayed in the console. Open the console, and you should see \"4\"!\n\n##\
    \ TYPE COERCION\n\nIn English, \"coercion\" means to force or persuade someone,\
    \ typically by use of threats or punishment. \"Type coercion\" in JavaScript is\
    \ when the operands of an operator are different data types (such as \"string\"\
    \ and \"number\" – like: \"five\" + 5).\n\nThe type coercion converts the value\
    \ to the type it chooses. Let's try this out. Write this code:\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n    <body>\n        <script>\n            document.write(\"10\"\
    \ + 5);\n        </script>\n    </body>\n</html>\n```\n\nMany other programming\
    \ languages would return an error if we were to include two different data types\
    \ within an operation.\n\n## END OF CHAPTER CHALLENGE\n\nWrite a program that\
    \ includes the following:\n\n- Boolean logic that returns \"true,\"\n- Type coercion,\
    \ and\n- Display \"false\" in the console.log using Boolean logic.\n\n## CHAPTER\
    \ TWENTY ONE\n### COMPARISON OPERATORS\n\nIn JavaScript, we can utilize double\
    \ and triple equal signs.\n\n== (double equal sign) is a symbol used to show that\
    \ a comparison should be made. Specifically, this “==” symbol is an instruction\
    \ to check whether the data on the left side of the symbol is equal to the data\
    \ on the right side. The answer to this comparison is an answer of “true” or “false.”\n\
    \nWhen the “==” symbol is used to check for equality, usually it is used like\
    \ this: [first item to be compared] == [second item to be compared]\n\nFor example:\
    \ (10 + 5) == 15\n\nIn this example, we are asking the computer to check whether\
    \ the result of adding 5 and 10 is equal to 15.\n\nWhen the “==” symbol is used\
    \ in this manner, we are asking the computer to give a response after checking\
    \ for equality. Usually, this result is given in a “true” or “false” manner. Here,\
    \ the response would be “true,” since (10 + 5) is equal to 15.\n\nAnother example:\
    \ (10 + 6) == 15\n\nHere, the computer would respond with “false,” since (10 +\
    \ 6) is not equal to 15.\n\n=== (triple equal sign) is used to show that a comparison\
    \ should be made. Specifically, this “===” symbol is an instruction to check whether\
    \ the data on the left side of the symbol is equal to the data on the right side,\
    \ and that it is the same type of data (data type) as that on the right. The answer\
    \ to this comparison is an answer of “true” or “false.”\n\nFor example, let’s\
    \ say you want to check whether two birth dates are equal. You have two pieces\
    \ of data in the computer that represent these two birth dates:\n1. “DateOfBirth1”\
    \ is data of type “Date,” and the value of the data is “1/1/1970.”\n2. “DateOfBirth2”\
    \ is data of type “Date,” and the value of the data is “1/1/1970.”\n\nYou would\
    \ use the \"===\" symbol like this:\n\n```\nDateOfBirth1 === DateOfBirth2\n```\n\
    \nThis tells the computer to check whether the two pieces of data are equal in\
    \ both VALUE and TYPE. Since they are in this case, the computer responds with\
    \ “true.”\n\nLike all code, it's best understood by writing it! Now, let's use\
    \ a separate HTML document and JavaScript document again. First, open up an HTML\
    \ file (if you don't have one, just make a new one) and write the following code:\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n    <body>\n        <script src=\"Test_1.js\"\
    >\n        </script>\n    </body>\n</html>\n```\n\nEnsure this file is saved as\
    \ HTML.html. Then open up your JavaScript code file (entitled Test_1.js – if you\
    \ don't have this file, create a new file) and type the following code:\n\n```\n\
    document.write(10 == 10);\n```\n\nAgain, ensure this is saved as Test_1.js. Then\
    \ run your HTML.html code. It should return “true” (because 10 is equal to 10).\
    \ To make it return “false,” simply change a number in your JavaScript, such as:\n\
    \n```\ndocument.write(5 == 10);\n```\n\nNow, let's use ===. Write the following\
    \ in your JavaScript code file:\n\n```\nX = 10\nY = 10\ndocument.write(X === Y);\n\
    ```\n\nSave it and run the HTML code. This returns “true” because they are both\
    \ variables and both have the value 10. You can make this false by changing it\
    \ to:\n\n```\nX = 10\nY = 11\ndocument.write(X === Y);\n```\n\nSave it and then\
    \ run the HTML code – it returns “false.” Even though they are both variables,\
    \ the values are different. We can also return false by writing the following\
    \ JavaScript code:\n\n```\nX = \"Ten\"\ndocument.write(X === 10);\n```\n\n## END\
    \ OF CHAPTER CHALLENGE\n\nWrite a program that includes the following:\n\n- Double\
    \ equal signs (==) and type coercion (i.e., use a variable and a value) and get\
    \ a \"true\" result displayed.\n- Triple equal signs (===) to produce \"true\"\
    \ and \"false.\"\n\n## CHAPTER TWENTY TWO\n### LOGICAL OPERATORS\n\nIn JavaScript,\
    \ there are three Boolean logical operators:\n\n1. AND written: &&\n2. OR written:\
    \ ||\n3. NOT written: !\n\nThe && operator determines the logic between values\
    \ or variables, such as verifying that _____ and _____ are true (both must be\
    \ true to return “true.” If one or both is false, the code will return “false”).\n\
    \nWrite this code:\n\n```\n<!DOCTYPE html>\n<html>\n\t<body>\n\t\t<script>\n\t\
    \t\tdocument.write(5 > 2 && 10 > 4);\n\t\t</script>\n\t</body>\n</html>\n```\n\
    \nOur code returns “true” because five is greater than two, and ten is greater\
    \ than four. We can make our code return “false” by changing one or both of the\
    \ comparisons, such as:\n\n```\n<!DOCTYPE html>\n<html>\n\t<body>\n\t\t<script>\n\
    \t\t\tdocument.write(5 > 10 && 10 > 4);\n\t\t</script>\n\t</body>\n</html>\n```\n\
    \nWrite, save and execute this code and it will return false.\n\nThe || (or) operator\
    \ means what it sounds like and is best described through utilization. Write this\
    \ code:\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n        <script>\n      \
    \      document.write(5 > 10 || 10 > 4);\n        </script>\n    </body>\n</html>\n\
    ```\n\nSave and execute your code. It returned “true” because, while 5 is not\
    \ greater than 10, 10 is greater than 4. We can make it return “false” with the\
    \ following code since neither is true:\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n\
    \        <script>\n            document.write(5 > 10 || 10 > 20);\n        </script>\n\
    \    </body>\n</html>\n```\n\nThe ! (not) operator checks whether or not something\
    \ is true. If _____ is not present, “true” will be returned.\n\nWrite this code:\n\
    \n```\n<!DOCTYPE html>\n<html>\n    <body>\n        <p id=\"Not\"></p>\n     \
    \   <script>\n            document.getElementById(\"Not\").innerHTML = !(5 > 10);\n\
    \        </script>\n    </body>\n</html>\n```\n\nSave and run your code. The result\
    \ is “true” because 5 is *not* greater than 10.\n\nAnd of course, if you want\
    \ a \"double negative,\" write this code:\n\n```\n<!DOCTYPE html>\n<html>\n  \
    \  <body>\n        <p id=\"Not\"></p>\n        <script>\n            document.getElementById(\"\
    Not\").innerHTML = !!(20 > 10);\n        </script>\n    </body>\n</html>\n```\n\
    \nSave and execute your code. We are saying that 20 is *not not* greater than\
    \ 10.\n\n## CHAPTER TWENTY THREE\n### TERNARY OPERATORS\n\nTernary means \"made\
    \ up of three parts.\" A ternary operator operates on three values. It can be\
    \ used to assign a value to a variable, based on a condition. This is also referred\
    \ to as a conditional operator in that it assigns a value to a variable based\
    \ on a condition.\n\nThe syntax of this is:\n\n```\nName_of_variable = (condition)\
    \ ? Value_1:Value_2\n```\n\nThe ternary operator is “?”. Write this code:\n\n\
    ```\n<!DOCTYPE html>\n<html>\n    <body>\n        <script>\n            document.write(Bigger\
    \ = (5 > 1) ? \"The number on the left is bigger\" : \"The number on the right\
    \ is bigger\");\n        </script>\n    </body>\n</html>\n```\n\nSave and execute\
    \ your code.\n\nIn this code, we said, “If it is true that 5 is bigger than 1,\
    \ display “The number on the left is bigger.” If you change the numbers or flip\
    \ the symbol to <, you can change the outcome of your code.\n\nInput is a command\
    \ that has the user input data. It allows users to type in information within\
    \ your program."
  mdcn: "\n## CONSOLE.LOG 方法\n\n`console.log` 方法可用于在浏览器控制台中显示数据。控制台是你在浏览器内可用于调试代码的工具。\n\
    \n你可以通过几种方式访问控制台，包括：\n\n- a. 按下 `F12` 键，然后点击“控制台”，或\n- b. 点击浏览器右上角的三个竖点，选择“更多工具”，点击“开发者工具”，然后选择“控制台。”\n\
    \n将你上次编写的代码替换为以下内容：\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n        <script>\n\
    \            console.log(2 + 2);\n        </script>\n    </body>\n</html>\n```\n\
    \n保存并运行你的代码。没看到任何东西？那是因为它显示在控制台中。打开控制台，你应该会看到 \"4\"！\n\n## 类型强制转换\n\n在英语中，“coercion”意为通过威胁或惩罚来强迫或说服某人。JavaScript\
    \ 中的“类型强制转换”是指当运算符的操作数是不同数据类型时（例如 \"string\" 和 \"number\" —— 像这样：\"five\" + 5）。\n\
    \n类型强制转换会将其值转换为它所选择的类型。让我们试一下。编写这段代码：\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n\
    \        <script>\n            document.write(\"10\" + 5);\n        </script>\n\
    \    </body>\n</html>\n```\n\n许多其他编程语言如果我们在一个操作中包含两种不同的数据类型，会返回一个错误。\n\n## 章节挑战\n\
    \n编写一个包含以下内容的程序：\n\n- 返回 \"true\" 的布尔逻辑，\n- 类型强制转换，以及\n- 使用布尔逻辑在 `console.log`\
    \ 中显示 \"false\"。\n\n## 第二十一章\n### 比较运算符\n\n在 JavaScript 中，我们可以使用双等号和三等号。\n\n`==`（双等号）是一个符号，用于表示应该进行比较。具体来说，这个\
    \ “==” 符号是一个指令，用于检查符号左侧的数据是否等于符号右侧的数据。这个比较的答案是 “true” 或 “false”。\n\n当使用 “==” 符号检查相等性时，通常这样使用：[要比较的第一个项]\
    \ == [要比较的第二个项]\n\n例如：`(10 + 5) == 15`\n\n在这个例子中，我们要求计算机检查将 5 和 10 相加的结果是否等于 15。\n\
    \n当 “==” 符号以这种方式使用时，我们要求计算机在检查相等性后给出响应。通常，这个结果以 “true” 或 “false” 的形式给出。在这里，响应将是\
    \ “true”，因为 `(10 + 5)` 等于 15。\n\n另一个例子：`(10 + 6) == 15`\n\n在这里，计算机将响应 “false”，因为\
    \ `(10 + 6)` 不等于 15。\n\n`===`（三等号）用于表示应该进行比较。具体来说，这个 “===” 符号是一个指令，用于检查符号左侧的数据是否等于符号右侧的数据，并且其数据类型与右侧的数据类型相同。这个比较的答案是\
    \ “true” 或 “false”。\n\n例如，假设你想检查两个出生日期是否相等。你有两个代表这两个出生日期的数据：\n1. “DateOfBirth1”\
    \ 是 “Date” 类型的数据，数据的值是 “1/1/1970”。\n2. “DateOfBirth2” 是 “Date” 类型的数据，数据的值是 “1/1/1970。”\n\
    \n你会这样使用 \"===\" 符号：\n\n```\nDateOfBirth1 === DateOfBirth2\n```\n\n这告诉计算机检查这两个数据在值和类型上是否都相等。由于在这种情况下它们相等，计算机响应\
    \ “true”。\n\n像所有代码一样，通过编写代码来理解它是最好的！现在，让我们再次使用一个单独的 HTML 文档和 JavaScript 文档。首先，打开一个\
    \ HTML 文件（如果你没有，就新建一个）并编写以下代码：\n\n```\n<!DOCTYPE HTML>\n<html>\n    <body>\n \
    \       <script src=\"Test_1.js\">\n        </script>\n    </body>\n</html>\n\
    ```\n\n确保此文件保存为 HTML.html。然后打开你的 JavaScript 代码文件（名为 Test_1.js – 如果你没有此文件，创建一个新文件）并输入以下代码：\n\
    \n```\ndocument.write(10 == 10);\n```\n\n同样，确保将其保存为 Test_1.js。然后运行你的 HTML.html\
    \ 代码。它应该返回 “true”（因为 10 等于 10）。要让它返回 “false”，只需更改你 JavaScript 中的一个数字，例如：\n\n```\n\
    document.write(5 == 10);\n```\n\n现在，让我们使用 `===`。在你的 JavaScript 代码文件中编写以下内容：\n\n\
    ```\nX = 10\nY = 10\ndocument.write(X === Y);\n```\n\n保存它并运行 HTML 代码。它返回 “true”，因为它们都是变量并且值都是\
    \ 10。你可以通过将其改为：\n\n```\nX = 10\nY = 11\ndocument.write(X === Y);\n```\n\n使其为 false。保存它然后运行\
    \ HTML 代码 – 它返回 “false”。尽管它们都是变量，但值不同。我们也可以通过编写以下 JavaScript 代码返回 false：\n\n```\n\
    X = \"Ten\"\ndocument.write(X === 10);\n```\n\n## 章节挑战\n\n编写一个包含以下内容的程序：\n\n-\
    \ 双等号 (`==`) 和类型强制转换（即，使用一个变量和一个值）并显示 \"true\" 结果。\n- 三等号 (`===`) 产生 \"true\"\
    \ 和 \"false\"。\n\n## 第二十二章\n### 逻辑运算符\n\n在 JavaScript 中，有三个布尔逻辑运算符：\n\n1. AND\
    \ 写作：`&&`\n2. OR 写作：`||`\n3. NOT 写作：`!`\n\n`&&` 运算符确定值或变量之间的逻辑，例如验证 _____ 和 _____\
    \ 为真（两者都必须为真才能返回 “true”。如果其中一个或两个都为 false，代码将返回 “false”）。\n\n编写此代码：\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n\t<body>\n\t\t<script>\n\t\t\tdocument.write(5 > 2 && 10 > 4);\n\
    \t\t</script>\n\t</body>\n</html>\n```\n\n我们的代码返回 “true”，因为五大于二，且十大于四。我们可以通过更改一个或两个比较来使我们的代码返回\
    \ “false”，例如：\n\n```\n<!DOCTYPE html>\n<html>\n\t<body>\n\t\t<script>\n\t\t\t\
    document.write(5 > 10 && 10 > 4);\n\t\t</script>\n\t</body>\n</html>\n```\n\n\
    编写、保存并执行此代码，它将返回 false。\n\n`||`（或）运算符的含义如其名，通过使用最好地描述。编写此代码：\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n    <body>\n        <script>\n            document.write(5 >\
    \ 10 || 10 > 4);\n        </script>\n    </body>\n</html>\n```\n\n保存并执行你的代码。它返回\
    \ “true”，因为虽然 5 不大于 10，但 10 大于 4。我们可以通过以下代码使其返回 “false”，因为两个都不为真：\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n    <body>\n        <script>\n            document.write(5 >\
    \ 10 || 10 > 20);\n        </script>\n    </body>\n</html>\n```\n\n`!`（非）运算符检查某事是否为真。如果\
    \ _____ 不存在，则返回 “true”。\n\n编写此代码：\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n\
    \        <p id=\"Not\"></p>\n        <script>\n            document.getElementById(\"\
    Not\").innerHTML = !(5 > 10);\n        </script>\n    </body>\n</html>\n```\n\n\
    保存并运行你的代码。结果是 “true”，因为 5 *不* 大于 10。\n\n当然，如果你想要一个“双重否定”，编写此代码：\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n    <body>\n        <p id=\"Not\"></p>\n        <script>\n  \
    \          document.getElementById(\"Not\").innerHTML = !!(20 > 10);\n       \
    \ </script>\n    </body>\n</html>\n```\n\n保存并执行你的代码。我们的意思是说 20 *不不* 大于 10。\n\n\
    ## 第二十三章\n### 三元运算符\n\n三元的意思是“由三部分组成”。三元运算符在三个值上操作。它可用于根据条件将值分配给变量。这也称为条件运算符，因为它根据条件为变量赋值。\n\
    \n其语法是：\n\n```\n变量名 = (条件) ? 值1 : 值2\n```\n\n三元运算符是 “?”。编写此代码：\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n    <body>\n        <script>\n            document.write(Bigger\
    \ = (5 > 1) ? \"The number on the left is bigger\" : \"The number on the right\
    \ is bigger\");\n        </script>\n    </body>\n</html>\n```\n\n保存并执行你的代码。\n\n\
    在此代码中，我们说：“如果五大于一为真，则显示 ‘左边的数字更大’。”如果你更改数字或将符号翻转为 `<`，你可以更改代码的结果。\n\n输入是一个命令，让用户输入数据。它允许用户在你的程序中输入信息。\n"
