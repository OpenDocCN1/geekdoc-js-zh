  md: '# CHAPTER EIGHT

    ALGORITHMS


    “Algorithm” is a mathematical term that means a plan for solving a problem. It
    consists of a sequence of steps to solve a problem or perform an action.


    Computers use algorithms. An algorithm is a set of instructions that is used to
    get something done.


    For example, an algorithm for selecting the right kind of shirt might have the
    following steps:


    +   1. Pick a shirt from your closet.

    2. Put the shirt on.

    3. Look at yourself in the mirror.

    4. If you like it, go to step 6.

    5. If you don’t like it, return to step 2.

    6. End of procedure.


    Computers perform functions by processing algorithms. You can create algorithms
    for computers to follow that other people can then use in the future without having
    to write out the entire list of steps again.


    For example, when your computer prints something, there are many massive algorithms
    it uses to figure out which type of printer you have, how to convey the document
    to the printer in a way it understands, etc. This is all taken care of in the
    background so that all you need to do is click “print.” These algorithms were
    written by others to get the computer and printer to comply with your wishes.


    Another example of an algorithm could be a simple recipe, such as:


    +   1. Crack three eggs and pour their contents into a small bowl – attempt to
    avoid getting eggshell in the bowl.

    2. In the case of eggshells, remove any eggshells from the bowl.

    3. Beat the 3 eggs for 90 seconds in the small bowl.

    4. Put a small frying pan on the stove and turn the burner on to medium temperature.

    5. Pour the eggs in a small frying pan and cook until very little to no wetness
    remains.

    6. Serve the eggs.


    While there are similarities, computers and people do not use algorithms in the
    same way; there are similar features between real life algorithms and computer
    algorithms, but they are not identical.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Computers can''t think – they operate in a completely literal manner – so when
    writing an algorithm for computers, there are certain characteristics that must
    be present for a computer to use the algorithm. People can deduce things and extrapolate
    data; people have imagination. Computers can only do what they''ve been told to
    do.


    To fully understand what an algorithm is for computers, some terms and concepts
    must be cleared up first. Algorithms are composed of five separate characteristics:


    +   1. Result: the outcome of something.

    2. Finite amount of time: an exact amount of time for something.

    3. Well-ordered: listed out in the correct sequence and in an organized fashion.

    4. Effectively computable operations: this refers to a command that can be processed
    successfully by a computer.

    5. Unambiguous: ambiguous means unclear, confusing, not specified. Un = not. Something
    that is unambiguous means that it is clear and defined.


    Let''s go over each of these points in detail.


    # RESULT


    Result: the outcome of something.


    In computers, a response could be considered the result. You type in: "Tell me
    the date," the computer replies: "Jan 3, 2022." "Jan 3, 2022" would be the result.
    Answers to problems are also considered a result.


    Algorithms always have a result. If there is no result, it cannot be considered
    a valid algorithm.


    For example: print the number "2," Result: 2.


    # FINITE AMOUNT OF TIME


    Finite amount of time: an exact amount of time for something.


    Algorithms should have a finite number of operations included in them and should
    execute these operations in a set period of time. Algorithms should never be open-ended
    or infinite. Since each step of an algorithm takes a certain amount of time to
    be completed, this would mean the algorithm would be completed in a finite amount
    of time.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'An incorrect algorithm would be:


    +   1. Start at an amount of 1

    2. Add 1 to that amount

    3. Go to step 2


    The computer would then count 0, 1, 2, 3, 4, etc. forever.


    For example, “Count from 1 to 10, then print a message that says, ‘I counted from
    1-10’,” would be a correct algorithm because it contains a finite amount of steps.


    # WELL-ORDERED


    Well-ordered: listed out in the correct sequence and in an organized fashion.
    Computers can only execute an algorithm if it is well-ordered. If it is put out
    of sequence or no sequence is specified, etc., the computer cannot process the
    algorithm.


    For example, this is an incorrect algorithm because it is not well-ordered:


    +   1. Close the program

    2. Print “I am here” inside the program

    3. Save your work in the program

    4. Open the program


    # EFFECTIVELY COMPUTABLE OPERATIONS


    Effectively computable operations: this refers to a command that can be processed
    successfully by a computer. The phrase literally means an operation that can be
    computed in an effective way.


    In algorithms, all of the parts of the algorithm must be possible to execute.


    For example, a non-effectively computable operation could be: “multiply green
    by red” – the computer can’t process this because it isn’t computable. Operations
    contained in algorithms must be effectively computable operations, such as, “2
    + 2 = ”.


    # UNAMBIGUOUS


    Unambiguous: ambiguous means unclear, confusing, not specified. Un = not. Something
    that is unambiguous means that it is clear and defined.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'In computers, your algorithms must be unambiguous. You have to be extremely
    specific about each step/part of an algorithm or the algorithms cannot be processed
    by the computer.


    For example, if you have an algorithm that is processing a list of ten numbers,
    then a step of your algorithm is "delete the number," the computer cannot process
    this because you did not clearly specify which number you wanted deleted.


    Now that you know the above terms and concepts, we have the full definition of
    "algorithm" as defined in the book *Invitation to Computer Science* by American
    authors Schneider and Gersting:


    > *Algorithm:* A well-ordered collection of unambiguous and effectively computable
    operations that when executed produces a result and halts in a finite amount of
    time.


    Sorting means to put items in an exact sequence or order. Computers sort items
    often. On your computer, you can sort files by when they were created, their name,
    etc. Algorithms can be used by computers to organize data.


    For example, you can sort files on your computer by name or date. This is done
    by a sorting algorithm within the computer. There are several different ways algorithms
    can be written to sort data.


    In learning how to program, you would write algorithms to perform various functions.
    Computers have many algorithms programmed into them already that cause them to
    do a lot of the actions you use computers for. For example, your computer performs
    many complicated steps to save a document on your computer. These steps are taken
    care of because programmers entered in algorithms to handle it for you.


    Whether or not you ever learn to write code, it is helpful to know the elements
    that make up a program, which we will now cover.'
