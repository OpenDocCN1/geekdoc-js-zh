    As an example of each, Microsoft Word (on the left) is a word processor, while
    Notepad (on the right) is a text editor.


    ![](img/33a81fac26246d29975692e5ecda6e53_17_0.png)


    Out of the three programs listed here used to write code within, text editors
    are the least popular and least recommended.


    3) Code editor: As the name states, this is a program that can be used to write/edit
    your code. Code editors are in between IDEs and text editors in terms of features
    (functions built into an application) – they have fewer features than an IDE but
    more than a text editor. One of the most popular code editors is Notepad++ (plus
    plus).


    As an example, the popular IDE Visual Studio has a feature called “LiveShare,”
    which allows developers to share their code with others as it’s being written.
    Other developers can even use LiveShare within Visual Studio to access and edit
    your code from a separate computer! This feature is not included in the code editor
    Notepad++.


    On the other hand, Notepad++ has a cool feature called “auto-completion” that
    suggests various options for completing the code you’re typing for you. For example,
    when you type *pr*, auto-completion may suggest *print*. This feature doesn’t
    exist in the text editor Notepad.'
- md: '## CHAPTER FIVE


    ### MACHINE LANGUAGE


    You may have heard the concept that computers operate on 1s and 0s. How this works
    exactly is beyond the scope of this book, but a simplified explanation is that
    computers are made up of billions of tiny parts that can either be on or off.
    1 represents on, 0 represents off. You can instruct computers to turn these parts
    on and off by entering 1 and 0 into the computer. These 1s and 0s are called machine
    language. Commands written in machine language are called machine instructions.


    As an example, “10010100 01101011 01011011 01010110” could instruct the computer
    to “Delete the file called Vacation.doc.” The “10010100 01101011 01011011 01010110”
    is a machine instruction.


    It is difficult for people to read and write in machine language, since the instructions
    are just unique patterns of ones and zeroes. That is why programming languages
    were created. The computer converts (translates) the code written by developers
    into machine instructions.


    It works like this:


    ![](img/33a81fac26246d29975692e5ecda6e53_19_0.png)


    One of the main uses of computers is the internet. So, what is the internet and
    how does JavaScript relate to it?


    ## CHAPTER SIX


    ### THE INTERNET AND WORLD WIDE WEB


    JavaScript is a programming language that is able to work on most computers. It
    was created in 1995 by an American named Brendan Eich and is particularly useful
    in making websites.


    The World Wide Web (abbreviated "www" or the "web") is a collection of linked
    electronic documents, organized into groups called websites.


    A website is composed of one or more individual webpages, where a "page" is an
    organized, separate document containing text, images, video and other elements.


    ![](img/33a81fac26246d29975692e5ecda6e53_20_0.png)


    ### THE INTERNET


    A network is a system where two or more computers are connected to each other.
    The computers can be connected by a cable (i.e., a wired connection) or connected
    wirelessly (through the air). Network is the word used to describe the link between
    things that are working together and is used in many different ways with computers.
    Information can be shared from computer to computer through the use of a network.


    ![](img/33a81fac26246d29975692e5ecda6e53_20_1.png)


    Internet is a combination of the words “interconnected” and “network.”


    The internet is an interconnected network of many computers around the world.
    It is the largest network in existence and allows computers to pass data to one
    another.


    There are lots of different types of data that can be sent back and forth between
    computers connected to the internet – like electronic messages, electronic documents,
    healthcare records, etc.


    ![](img/33a81fac26246d29975692e5ecda6e53_21_0.png)


    In addition to referring to the connection between computers on this network,
    internet also means the set of agreements, or protocols, for how to transfer different
    types of data between those computers.


    A “protocol” is an official procedure. In technology, it is a formal description
    of how a certain type of information will be formatted and handled. Basically,
    it’s an agreement that the various people who work with that type of information
    all adhere to. Protocols are usually described in written documents, and are very
    precise. They are usually created by experts in the applicable industry.


    An example of a type of data where a protocol would be valuable is healthcare
    information. If various organizations in the healthcare industry were to transfer
    healthcare data back and forth between computers as they perform their work, it
    would be important that they all agree about things like the exact format of the
    information, how to keep private data safe, etc. All of that would be laid down
    in a written protocol. Several such protocols do exist in the healthcare industry.


    One or more protocols have been created for each type of data that can be transferred
    around on the internet. Violation of these protocols results in an error and the
    data will not be sent properly or at all.


    So to recap: the internet is an interconnected network of many computers around
    the world, and a set of agreements, or protocols, for transferring different types
    of data between those computers.


    ### INTERNET VS. WORLD WIDE WEB


    So, what’s the difference between the internet and the World Wide Web? The internet
    is the hardware and protocols that data is sent across, whereas the web is one
    type of information that is accessed over the internet. The web is a collection
    of linked electronic documents called webpages.


    The internet is the infrastructure (physical framework) while the web is the code
    that is transmitted and displayed. In a way, the internet is the hardware and
    the web is the software.


    ![](img/33a81fac26246d29975692e5ecda6e53_22_0.png)


    Dynamic refers to actions that take place the moment they are needed, rather than
    in advance. For example, a restaurant that prepares your food to your specifications
    when you order, would be dynamic. The opposite of dynamic is “static,” which literally
    means, “unchanging.” A static restaurant would have food pre-cooked and waiting
    before you order – the food doesn’t change in regards to time or circumstance.


    In coding, dynamic means the computer processes your request right when you ask
    it to – it does not have a predetermined result ahead of time.


    Dynamic relates to the internet by describing websites that have content that
    changes while the website is being viewed.


    As an example, a dynamic picture on a website could be one that has an effect
    (movement or change) when you hover over it with a mouse (hovering with a mouse
    refers to holding the pointer over a particular object).


    ## CHAPTER SEVEN


    ### JAVASCRIPT


    JavaScript is a great language to use for an introduction to coding and tops some
    lists as the most popular programming language in the world.


    One of the main uses of JavaScript is to make websites more dynamic (describing
    websites that have content that changes based on user action or other factors,
    rather than being static in appearance and content).


    JavaScript can also make programs and websites more interactive, such as making
    it so videos start to play as soon as a user moves their mouse over them.


    There are many other uses for JavaScript; it is used in the creation of many different
    types of computer programs.


    ![](img/33a81fac26246d29975692e5ecda6e53_24_0.png)


    So, what is the definition of JavaScript? Well, according to one of the top online
    technical dictionaries, “JavaScript is a high-level, untyped, and interpreted
    runtime language.”


    Right off the bat, that explanation shows why we made this book. That definition
    makes no sense. So, in order to comprehend what is being said there, let’s dissect
    the definition.


    ### HIGH-LEVEL


    Machine language that we discussed earlier (1s and 0s) is considered a “low-level
    language.” This is due to the fact that it is close to the hardware of the computer
    in that it directly represents the on or off states used in both the computer
    instructions and the data the computer operates on.


    The opposite of a low-level language is a high-level language – code written in
    a way that is easier to read and write because it somewhat resembles English,
    such as:


    ```

    Print “Hello”;

    ```'
