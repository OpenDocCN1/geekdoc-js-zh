  md: '# CHAPTER THIRTEEN

    FIRST CODING ASSIGNMENTS


    Here is your first task:


    Download and install Notepad++ here: https://notepad-plus-plus.org/


    You will be writing your code in the code editor Notepad++.


    Note: If you are using a Macintosh computer, you can utilize a different code
    editor – such as Brackets.


    # HTML


    Before writing code in JavaScript, you must be familiar with some basic HTML.


    The markup instructions in HTML give the computer data *about* the elements of
    the document – text, images, video, etc. When the document is actually displayed
    on a screen, those markup instructions aren''t displayed on the screen; instead,
    they are used to control *how* the actual content of the document is displayed.


    # TAGS


    HTML utilizes tags. Tags are how the markup of the content in the HTML document
    is specified.


    The basic principle is this: If you put special instructions before and after
    the content you want to affect, another program can tell the difference between
    the instruction and the content, and can then present the data in a specified
    manner.


    Because of this, tags usually have two parts: an opening tag and a closing tag.
    The content would go in between these two tags. Opening tags indicate the beginning
    of a markup instruction and closing tags indicate the end.


    Opening tags are written as a “less than” angle bracket (<), followed by the markup
    instruction, and then a “greater than” angle bracket (>).


    An example would be the tag used to make text **bold**. The actual instruction
    is the word “strong”, meaning “make the text controlled by this tag stand out”,
    usually by making it bold. The opening “strong” tag would look like this:


    ```

    <strong>

    ```'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'You need to specify a closing tag, so the computer program knows when to stop
    making text bold. That''s where the closing tag comes in. Closing tags use the
    same instruction as the opening tag, but with a forward slash (/) placed before
    the instruction (</>).


    The closing "strong" tag would look like this:


    ```

    </strong>

    ```


    Putting all the parts together, if you wanted to emphasize a quote, you would
    write the HTML like this:


    ```

    <strong>"Education is the most powerful weapon which you can use to change the
    world."</strong> -Nelson Mandela

    ```


    The output of this code would look like this:


    > "Education is the most powerful weapon which you can use to change the world."

    -Nelson Mandela


