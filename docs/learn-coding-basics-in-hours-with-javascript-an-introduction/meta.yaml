  md: "# DOCUMENT.GETELEMENTBYID\n\nThe document.getElementById method returns an\
    \ element.\n\nThe element has an id attribute with a specific value assigned to\
    \ it. It is used mainly to control or get information from an element within your\
    \ code. If it can't find the element with the specified value, it will return\
    \ “null.” Null means “having a value of zero; no value.”\n\nYou'll understand\
    \ it better once we put it into action!\n\nUsing the `<button>` element, we can\
    \ create a button like this:\n\nButton\n\nNow let's create a function and use\
    \ the document.getElementById method. First, open up your HTML code in Notepad++\
    \ (Test.html) and write this code:\n\n```\n<!DOCTYPE HTML>\n<html>\n<body>\n \
    \   <button onclick=\"My_First_Function()\">\n        Click me!\n    </button>\n\
    \    <p id=\"Irish\"></p>\n<script>\n    function My_First_Function() {\n    \
    \    var String = \"Kiss me, I'm Irish!\";\n        var result = String.fontcolor(\"\
    green\");\n        document.getElementById(\"Irish\").innerHTML =\n          \
    \  result;\n    }\n</script>\n</body>\n</html>\n```\n\nSave and execute your code.\
    \ You created a function and a functional button!\n\nRead through your code and\
    \ try to figure out what we just did.\n\nEverything inside the curly brackets\
    \ { } is our function.\n\nWe used the ID attribute and assigned the button element\
    \ the value “Irish.”\n\nThen we returned the button element by calling the “Irish”\
    \ value that we assigned earlier (when writing the ID attribute)."
