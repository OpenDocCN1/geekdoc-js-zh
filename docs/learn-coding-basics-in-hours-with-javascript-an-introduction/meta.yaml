    \     </script>\n    </body>\n</html>\n```\n\n这应该显示为 \"4.25\"。\n\n## MATH.RANDOM()\n\
    \n要返回一个 0 到 1 之间的随机数，请编写以下代码：\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n  \
    \      <script>\n            window.alert(Math.random());\n        </script>\n\
    \    </body>\n</html>\n```\n\n保存并运行你的代码。做得好！\n\n要让随机数显示在 ____ 和 ____ 之间（例如 0 到\
    \ 100 之间），请编写以下代码：\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n        <script>\n\
    \            window.alert(Math.random() * 100);\n        </script>\n    </body>\n\
    </html>\n```\n\n保存并运行你的代码。太棒了！\n\n## 章节末挑战\n\n编写一个包含以下内容的程序：\n\n-   一个二元运算符，\n\
    -   一个一元运算符，\n-   模运算符，\n-   `Math.random()`，以及\n-   递增或递减运算符。\n\n注意：确保上述每个运算符都显示（打印）出结果。\n\
    \n## 第十八章：JAVASCRIPT 对象\n\n我们之前讨论过对象。对象是在计算机程序中可以表示的事物。它们通常用于代表现实世界中的事物。\n\n你身边充满了对象——你的狗、电视等等。对象具有状态和行为。对象的状态可以是它的大小、颜色等。对象的行为则是对象所做的事情——它采取的行动。\n\
    \n一辆赛车可以是一个对象。描述其状态的特征可能包括：发动机类型、发动机马力、车轮尺寸、油箱容量等。描述其行为的特征可能包括：加速、减速、右转、左转等。在计算机中，对象是计算机程序的组成部分，并与现实生活中的物体有相似之处：它们都有状态和行为。\n\
    \n让我们再看一个例子：一个应用程序可能使用一个“客户”对象。同样，对象的状态是对象的特征和属性。行为则是对象能做什么。在我们的例子中，“客户”对象的状态可以是“活跃”或“已删除”。它的行为可以是“升级奖励等级”或“添加到家庭账户”。\n\
    \n对象是设计程序时首先考虑的主题之一。对象是计算机上你可以点击、交互、移动等的事物。它也可以是幕后由数据和用于操作数据的过程组成的某个东西。对象是计算机中实际运行的东西。\n\
    \n再举一个例子，假设你想在计算机上制作两种不同类型的汽车；每辆车都是一个对象。每个对象（汽车）都有自己的大小、形状、颜色、速度、无需加油可行驶的距离等。\n\
    \n### 字典\n\n在计算机编程中，字典是一种特殊类型的列表。第一个项目是键，第二个项目是值。它们共同构成一个“键值对”。\n\n键值对缩写为 “KVP”。KVP\
    \ 是一组两个相关联的数据项，包括：一个键（某个数据项的唯一标识符）和值（由键标识的数据）。键是唯一的名称，值是内容。\n\nKVP 的集合（即字典）经常在计算机程序中使用。\n\
    \n下面是一个可能用于学校计算机程序的 KVP 集合示例。在这里，键（KEY）用于存储学校课程的名称，值（VALUE）是课程的描述——这就是一个字典：\n\n\
    | 键 | 值 |\n|---|---|\n| SOUND | 巨响！ |\n| SEASON | 夏天 |\n| WEATHER | 暴风雨 |\n| DAY\
    \ | 星期六 |\n| MONTH | 八月 |\n\n注意，在这个列表中，你不能有第二个使用键 \"SEASON\" 或 \"DAY\" 的键值对，因为在给定的\
    \ KVP 集合中，键必须是唯一的。\n\n“字典”就是“键值对的集合”。\n\n在一个字典中，一个键可以被赋予多个值。这很有用，因为你可以通过键查找各种值。在下面的例子中，每个键被赋予了三个值：\n\
    \n| 键 | 值 |\n|---|---|\n| 0 | 艾德·史塔克 | 35 岁 | 男性 |\n| 1 | 瑟曦·兰尼斯特 | 32 岁 | 女性\
    \ |\n| 2 | 琼恩·雪诺 | 18 岁 | 男性 |\n| 3 | 丹妮莉丝·坦格利安 | 20 岁 | 女性 |\n\n要在 JavaScript\
    \ 中创建一个字典，请在你的 HTML 文件（Test.html）中编写以下代码：\n\n```\n<!DOCTYPE html>\n<html>\n  \
    \  <body>\n        <p id=\"Display\"></p>\n        <script>\n            var Animal\
    \ = {\n                Species: \"Dog\",\n                Color: \"Black\",\n\
    \                Breed: \"Labrador\",\n                Age: 5,\n             \
    \   Sound: \"Bark!\"\n            };\n            document.getElementById(\"Display\"\
    ).innerHTML = Animal.Sound;\n        </script>\n    </body>\n</html>\n```\n\n\
    保存并执行你的代码。输出是：Bark!，因为这与键 \"Sound\" 关联。\n\n注意：由于 5 是值类型 “number”，我们不需要将它放在引号内。\n\
    \n## 为键赋予多个值\n\n我们可以为字典中的键赋予多个值。将你之前的代码编辑如下：\n\n```\n<!DOCTYPE HTML>\n<html>\n\
    \    <body>\n        <p id=\"Display\"></p>\n        <script>\n            var\
    \ Food = {\n                Vegetables: [\"broccoli\", \"carrot\", \"lettuce\"\
    ],\n                Meat: [\"hotdog\", \"steak\", \"hamburger\"],\n          \
    \      Fruit: [\"strawberry\", \"orange\", \"apple\"],\n                Quantity:\
    \ [10, 21, 182]\n            };\n            document.getElementById(\"Display\"\
    ).innerHTML = Food.Fruit;\n        </script>\n    </body>\n</html>\n```\n\n##\
    \ 作为单词的运算符\n\n大多数运算符写作符号：`+`, `-`, `/` 等。但有些是单词。delete 运算符就是一个例子。\n\n将你之前的代码编辑如下：\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n<body>\n    <p id=\"Delete\"></p>\n    <script>\n\
    \        var Animal = {\n            Species: \"...\",\n            Color: \"\
    Black\",\n            Breed: \"Labrador\",\n            Age: 5,\n            Sound:\
    \ \"Bark!\"\n        };\n        delete Animal.Sound;\n        document.getElementById(\"\
    Delete\").innerHTML = Animal.Sound;\n    </script>\n</body>\n</html>\n```\n\n\
    保存并执行你的代码。我们删除了与键 Animal 关联的值，所以返回了 \"undefined\"，因为在我们的字典中，这个值不再被定义。\n\n## TYPEOF\
    \ 运算符\n\n这个运算符给出变量的值类型。编写以下代码：\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n    <script>\n\
    \        document.write(typeof \"This is a string\");\n    </script>\n</body>\n\
    </html>\n```\n\n保存并执行你的代码。它返回了 “string”。\n\n现在将你的 typeof 运算符改为这个：\n\n```\ndocument.write(typeof\
    \ 247365);\n```\n\n保存并执行你的代码。它返回了 “number”——另一个 JavaScript 值类型。\n\n## 章节末挑战\n\n\
    编写一个包含以下内容的程序：\n\n-   一个字典。\n-   使用 delete 运算符从你的字典中删除一个键值对。\n-   使用 typeof 运算符。\n\
    -   尝试创建一个具有两个相同键的字典，然后尝试使用 document.getElementById() 方法显示这些键，看看会发生什么。\n"
