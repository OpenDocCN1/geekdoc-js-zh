  md: "# # “HELLO, WORLD” IN HTML\n\nThe first code that developers usually write\
    \ when learning a new language is to make the computer display the text: “Hello\
    \ world.” We are going to first use HTML to do this.\n\nAt the top of each HTML\
    \ document containing HTML code is the <!DOCTYPE HTML> declaration. This isn’t\
    \ a tag. It is an instruction to the browser telling it you’re using HTML – there\
    \ are other doctypes (types of documents) you could use, so clarifying that helps\
    \ the browser out.\n\nThe <html> tag is inserted at the beginning of your code,\
    \ and all your HTML code is contained in between it and the end tag (</html>).\n\
    \nThe <body> tag denotes where you can add the contents of an HTML document –\
    \ such as text, images, videos, lists, links, etc.\n\nInside Notepad++, write\
    \ the following code:\n\n```\n<!DOCTYPE HTML>\n<html>\n    <body>\n        Hello,\
    \ world!\n    </body>\n</html>\n```\n\nAs a reminder, the “/” symbol in the code\
    \ you wrote denotes an “end tag.”\n\nSave this document by clicking on “File,”\
    \ then “Save As.” Name the document Test.html and ensure you click on “Hypertext\
    \ Markup Language” under “Save as type.” It is important to include .html at the\
