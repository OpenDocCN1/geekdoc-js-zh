    \n# CHAPTER TWENTY SEVEN: STRING METHODS\n\nJavaScript has string methods that\
    \ allow you to perform tasks with strings.\n\nAs covered earlier, programming\
    \ languages have certain data types built into them. These built-in data types\
    \ are the most basic data types in the programming language and are referred to\
    \ as primitive data types. One of the key traits of a primitive data type is that\
    \ it cannot be simplified any further. A primitive data type is a predefined type\
    \ of data that is built into the language.\n\nThere are five primitive data types\
    \ in JavaScript – these are:\n\n1. String,\n2. Number,\n3. Boolean,\n4. Null,\
    \ and\n5. Undefined.\n\nEverything else (non-primitive data types) are objects.\
    \ Objects are created by the programmer, not predefined and built into the programming\
    \ language.\n\n## CONCAT() METHOD\n\nThe concat() method concatenates (connects)\
