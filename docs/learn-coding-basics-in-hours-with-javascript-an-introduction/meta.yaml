- md: '## UNTYPED


    Data is information.


    There are different types of data that computer programs will need. These are
    data types like:


    - Numbers,

    - Letters,

    - Dates,

    - True or false, etc.


    When information is used in a computer, that information will have a "data type."
    This is two things:


    1. "What kind of information is this?", and

    2. "What kind of things can we do with this data?"


    Different data types can be used in different ways.


    When data is stored in a computer, its type is also stored - that way the computer
    knows how to work with that particular piece of data.


    The various different things you can do with data are called operations. Not all
    data types have the same operations available to them.


    For example, a "decimal number" (0-9) is a data type. Typical operations you could
    do with decimal number data are addition, subtraction, multiplication, etc.


    "Text" is another data type. Typical operations you could do with text data are
    "convert the text to uppercase" or "concatenate" (which means to link together,
    as in a chain - for example, you could take the individual text elements "Pizza"
    and "s!" and then concatenate them into "Pizzas!" etc.).


    When creating computer programs, every piece of data being kept track of by the
    computer is a certain data type. For example, the datum 342.98 is data of type
    "decimal." The datum "casserole" is data of type "text."


    ![](img/33a81fac26246d29975692e5ecda6e53_25_0.png)


    (examples of data types)


    It would not make sense to apply mathematical operations to text data – for example,
    trying to tell a computer to add the number 34 to the text "banana" wouldn''t
    work because the two types of data are different, and mathematics doesn''t apply
    to text data.


    In math, a variable is a symbol used to represent an unknown quantity or a quantity
    that may change. In computers, a variable is a construct (an idea formed from
    simpler elements) used to store data that may change as the computer performs
    its tasks.


    Computers often have to keep track of various pieces of information. These can
    be things like the name of a computer user, the color of the background shown
    on the computer screen, an order number for something a user ordered from a company,
    etc.


    The computer usually gives each of these pieces of data a NAME and a VALUE. The
    NAME is used to identify the exact piece of data, and the VALUE is used to show
    the actual data we need to keep track of. Usually the "=" symbol is used to set
    the VALUE of a variable.


    In math, a value is a numeric amount, quantity, or number – like this: X = 10


    Here we are saying that the *name* "X" holds the *value* of "10."


    In coding, a value is any sort of characteristic or attribute. We could assign
    the value like this:


    X = Happy


    This means we are saying the *name* X is assigned the *value* Happy. We could
    later tell the computer:


    Print X


    The computer would then display:


    Happy


    The things the computer is keeping track of are usually called "variables." This
    is because the VALUE part of it can change when you tell the computer to change
    it. The fact that the value can vary is why it''s called a "variable" – its value
    is not permanent or constant.


    Many computer programming languages require the programmer to specify the data
    type for a variable. These are called "typed languages." When you first create
    a variable in a typed language, you need to specify what data type the variable
    is.


    In a typed language, there are certain restrictions about how the various data
    types can interact.


    For example, you might need to make the computer instructions that calculate a
    person''s pay for the day. Here, you could have three variables that had a data
    type of "integer," meaning they represented numeric data (i.e., numbers). An integer
    is a whole number – like 6, 99 and 182. 3.11 and 9½ are not integers.


    You would create the variables that calculate a person''s pay for the day like
    this:


    ```

    integer PayRate = 35.00

    integer HoursWorked = 10

    integer Paycheck

    ```


    The third variable, the integer called Paycheck, doesn''t have a value yet. This
    variable is meant to store the result of a math operation that determines how
    much a worker has earned.


    The computer instruction for this might look something like this:


    ```

    Paycheck = HoursWorked x PayRate

    ```


    Because all three variables are the same data type, the computer can process this
    math operation and store the result in the value for variable "Paycheck": 350.00.


    Untyped languages are programming languages that do not make you define what data
    type a variable is. Instead, the computer uses a predefined system to work out
    what data type a variable is based on its value and how it is being used.


    For example, let''s use the earlier math example but examine how it could work
    when performed using an untyped language.


    Here, we might have three variables similar to the ones from our earlier example:


    ```

    PayRate = 35.00

    HoursWorked = "ten"

    Paycheck

    ```


    Notice that there are no data types specified. Notice, as well, that the variable
    "HoursWorked" has a value of "ten" – a word, not a number.


    If we wanted to perform the same math as the above example, we might create the
    same computer instruction:


    ```

    Paycheck = HoursWorked x PayRate

    ```


    This makes math operations a bit different. The computer takes the value of the
    variable PayRate, 35.00, and tries to multiply it by the value of the variable
    HoursWorked, "ten."


    This doesn''t work at first glance, of course – you can''t multiply a number by
    a word! But untyped languages have a predetermined system that is used to infer
    (determine something based on the available information) the type of data that
    the variable represents. Here, the language can work out that the word "ten" can
    mean the number 10 – and since the instruction is a math operation, the language
    interprets the variable in that manner and multiplies 35.00 by 10 to get 350.


    JavaScript is an *untyped* programming language in that you aren''t required to
    define the type of a variable.


    ## INTERPRETED


    A compiler is a special program that converts the code that looks nearly English
    into a form that the computer can understand and operate off of. The product of
    a compiler would be a set of instructions for the computer to execute that would
    end up doing what the "nearly English" code described.


    For example, if you typed this instruction within a computer program:


    ```

    if age > 18, print "You are an adult"

    (the symbol > means greater than)

    ```


    A compiler would take what you wrote, change it into a form the computer can understand
    and then relay that command to the computer so it can be executed (i.e., machine
    language – a long series of 1s and 0s).


    One important aspect of how a compiler works is that it takes all of the instructions
    in the program and turns them into language the computer can understand before
    actually executing the program. There are other methods of converting high-level
    languages to computer-readable form that don''t involve converting the entire
    program before it is executed. Instead, each instruction is converted and executed
    one at a time. This is not how a compiler works, however.


    A compiled programming language uses a compiler.


    An interpreter is a special program that converts high-level language instructions
    into low-level language instructions. An interpreter converts code in this way
    one instruction at a time rather than converting the entire set of instructions
    in the program prior to execution.


    In other words, the interpreter will read an instruction, convert it to the language
    the computer can understand, have the computer execute that instruction, then
    go on to the next instruction in the program and repeat.


    Interpreted programming languages (like JavaScript) use interpreters.


    ## RUNTIME


    Run means to start or execute something.


    To understand runtime, you must first understand what a "compiler" is.


    Runtime means the time when something in the computer is running. Runtime is exactly
    what it means – the time when the program is run. You can say something happens
    at runtime or it happens at compile time.


    The term "runtime" also describes software or instructions that are executed while
    your program is running, especially those instructions that you did not write
    explicitly, but are necessary for the proper execution of your code. This is actually
    a "runtime library," but is often shortened to simply "runtime."


    A library is a collection of pre-made resources used to create computer programs.
    Most often, these take the form of a package of code with built-in functions that
    all relate to a specific area. They are usually used by adding them to a software
    project already being created, and then having code in that project make use of
    the various functions in the library.


    In computer programming, a runtime library is a special program library used by
    a compiler to implement functions built into a programming language during the
    runtime (execution) of a computer program.


    For example, you can design videos to load during runtime or prior to runtime.
    If they were loaded during runtime, then you would have to wait for it to load
    after you clicked on it. If they were loaded prior to runtime, the videos would
    have loaded when you originally opened the program (set of instructions entered
    into a computer that performs exact functions) and so the program would take longer
    to load up when started.'
  mdcn: '

    ## 非类型化


    数据就是信息。


    计算机程序需要不同类型的数据。这些数据类型包括：


    -   数字，

    -   字母，

    -   日期，

    -   真或假，等等。


    当信息在计算机中使用时，该信息将具有一个“数据类型”。这包含两方面：


    1.  “这是什么类型的信息？”，以及

    2.  “我们可以对这种数据做什么操作？”


    不同的数据类型可以以不同的方式使用。


    当数据存储在计算机中时，其类型也会被存储——这样计算机就知道如何处理该特定的数据片段。


    你可以对数据执行的各种不同操作称为运算。并非所有数据类型都具有相同可用的运算。


    例如，“十进制数”（0-9）是一种数据类型。对十进制数数据可以执行的典型运算是加法、减法、乘法等。


    “文本”是另一种数据类型。对文本数据可以执行的典型运算是“将文本转换为大写”或“连接”（这意味着将它们链接在一起，就像链条一样——例如，你可以获取单独的文本元素“Pizza”和“s!”，然后将它们连接成“Pizzas!”等等）。


    在创建计算机程序时，计算机跟踪的每一段数据都是某种数据类型。例如，数据342.98是“十进制”类型的数据。数据“casserole”是“文本”类型的数据。


    ![](img/33a81fac26246d29975692e5ecda6e53_25_0.png)


    （数据类型示例）


    对文本数据进行数学运算没有意义——例如，试图告诉计算机将数字34与文本“banana”相加是行不通的，因为这两种数据类型不同，数学不适用于文本数据。


    在数学中，变量是一个用于表示未知量或可能变化的量的符号。在计算机中，变量是一种构造（由更简单元素形成的概念），用于存储在计算机执行任务时可能变化的数据。


    计算机经常需要跟踪各种信息片段。这些可以是诸如计算机用户名、计算机屏幕上显示的背景颜色、用户向公司订购的订单号等信息。


    计算机通常为这些数据中的每一段分配一个NAME和一个VALUE。NAME用于标识特定的数据片段，VALUE用于显示我们需要跟踪的实际数据。通常使用“=”符号来设置变量的VALUE。


    在数学中，值是数量、量或数字——像这样：X = 10


    这里我们说*名称*“X”持有*值*“10”。


    在编码中，值是任何类型的特征或属性。我们可以这样赋值：


    X = Happy


    这意味着我们说*名称* X 被赋值为 Happy。我们稍后可以告诉计算机：


    Print X


    计算机随后会显示：


    Happy


    计算机跟踪的事物通常称为“变量”。这是因为它的VALUE部分可以在你告诉计算机更改时发生变化。值可以变化这一事实是它被称为“变量”的原因——它的值不是永久或恒定的。


    许多计算机编程语言要求程序员指定变量的数据类型。这些称为“类型化语言”。当你在类型化语言中首次创建一个变量时，你需要指定变量是什么数据类型。


    在类型化语言中，对各种数据类型如何交互存在某些限制。


    例如，你可能需要让计算机指令来计算一个人的当日工资。这里，你可以有三个数据类型为“整数”的变量，这意味着它们表示数值数据（即数字）。整数是一个整数——比如6、99和182。3.11和9½不是整数。


    你会这样创建计算一个人当日工资的变量：


    ```

    integer PayRate = 35.00

    integer HoursWorked = 10

    integer Paycheck

    ```


    第三个变量，名为Paycheck的整数，还没有值。这个变量旨在存储确定工人赚取了多少钱的数学运算结果。


    计算机指令可能看起来像这样：


    ```

    Paycheck = HoursWorked x PayRate

    ```


    因为所有三个变量都是相同的数据类型，计算机可以处理这个数学运算并将结果存储到变量“Paycheck”的值中：350.00。


    非类型化语言是不需要你定义变量数据类型的编程语言。相反，计算机使用预定义系统根据变量的值及其使用方式来推断变量的数据类型。


    例如，让我们使用前面的数学例子，但看看当使用非类型化语言执行时它如何工作。


    这里，我们可能有三个类似于前面例子的变量：


    ```

    PayRate = 35.00

    HoursWorked = "ten"

    Paycheck

    ```


    注意没有指定数据类型。同时注意，变量“HoursWorked”的值是“ten”——一个词，而不是数字。


    如果我们想执行与上面例子相同的数学运算，我们可能会创建相同的计算机指令：


    ```

    Paycheck = HoursWorked x PayRate

    ```


    这使得数学运算有些不同。计算机获取变量PayRate的值35.00，并尝试将其乘以变量HoursWorked的值“ten”。


    乍一看这行不通——你不能用一个词乘以一个数字！但非类型化语言有一个预定的系统，用于推断（根据可用信息确定某事）变量所代表的数据类型。这里，语言可以推断出单词“ten”可以表示数字10——并且由于指令是一个数学运算，语言以这种方式解释变量，并将35.00乘以10得到350。


    JavaScript是一种*非类型化*编程语言，即你不需要定义变量的类型。


    ## 解释型


    编译器是一个特殊的程序，它将看起来几乎像英语的代码转换成计算机可以理解并执行的形式。编译器的产物将是一组计算机可以执行的指令，最终完成“几乎像英语”的代码所描述的功能。


    例如，如果你在计算机程序中输入这个指令：


    ```

    if age > 18, print "You are an adult"

    （符号 > 表示大于）

    ```


    编译器会获取你写的内容，将其转换成计算机可以理解的形式，然后将该命令传递给计算机，以便它可以执行（即机器语言——一长串的1和0）。


    编译器工作方式的一个重要方面是，它获取程序中的所有指令，并在实际执行程序之前将它们转换成计算机可以理解的语言。还有其他将高级语言转换为计算机可读形式的方法，这些方法不涉及在执行前转换整个程序。相反，每条指令都是单独转换和执行的。然而，编译器不是这样工作的。


    编译型编程语言使用编译器。


    解释器是一个特殊的程序，它将高级语言指令转换为低级语言指令。解释器一次一条指令地以这种方式转换代码，而不是在执行前转换程序中的整个指令集。


    换句话说，解释器将读取一条指令，将其转换为计算机可以理解的语言，让计算机执行该指令，然后继续处理程序中的下一条指令并重复。


    解释型编程语言（如JavaScript）使用解释器。


    ## 运行时


    运行是指启动或执行某事。


    要理解运行时，你必须首先理解什么是“编译器”。


    运行时是指计算机中的某些东西正在运行的时间。运行时正是它的意思——程序运行的时间。你可以说某事发生在运行时，或者它发生在编译时。


    “运行时”这个术语还描述了在你的程序运行时执行的软件或指令，特别是那些你没有明确编写但正确执行代码所必需的指令。这实际上是一个“运行时库”，但通常简称为“运行时”。


    库是用于创建计算机程序的预制作资源的集合。最常见的是，它们采用包含内置函数的代码包形式，这些函数都与特定领域相关。它们通常通过将它们添加到已经创建的软件项目中来使用，然后让该项目中的代码利用库中的各种函数。


    在计算机编程中，运行时库是编译器在计算机程序的运行时（执行期间）用于实现内置在编程语言中的函数的特殊程序库。


    例如，你可以在运行时或运行前设计视频加载。如果它们在运行时加载，那么你必须在单击它之后等待它加载。如果它们在运行前加载，视频会在你最初打开程序（输入计算机的执行特定功能的指令集）时加载，因此程序启动时加载时间会更长。

