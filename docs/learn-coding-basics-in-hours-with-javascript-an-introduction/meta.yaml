    \ the desktop and select \"Open with\" and navigate to Google Chrome.\n\nFrom\
    \ now on in this book, when we say \"run\" or \"execute\" your code, we mean to\
    \ \"Open it in Google Chrome\" so you can see your webpage displayed in the browser.\n\
    \nFor Mac users using Brackets, you can also click \"File\" and then \"Live Preview\"\
    \ to run your code.\n\nNow do the following:\n\nRun your code.\n\nCongratulations!\
    \ You made the browser display the text \"Hello, world!\"\n\n### ONLINE IMAGES\n\
    \nA Uniform Resource Locator (URL) is a unique name for a web resource. A \"web\
    \ resource\" is an identifiable thing that can be found on the internet. The most\
    \ common example of a URL is a website – https://www.google.com is a URL.\n\n\
    An attribute is a word or phrase used inside an element's opening tag that controls\
    \ the element's behavior.\n\nFor example, the image <img> tag allows you to place\
    \ images inside your webpage. The src (source) attribute is used with this <img>\
