- img_proc: true
  md: '# CHAPTER NINE

    FIVE ELEMENTS OF A PROGRAM


    There are five key elements to any computer program:


    +   1. Entrance

    2. Control/Branching (decision points within a program)

    3. Variables

    4. Subprograms (programs within programs)

    5. Exit


    Let''s go over each of these in detail.


    # ENTRANCE


    A computer is a simple machine when you get down to it. It can only do one thing
    at a time, and it performs a computer program''s instructions in the exact order
    in which the computer programmer puts them. It can only execute (perform or run)
    an instruction if it is directed to.


    This means that any computer program has to have a clearly marked "first instruction."
    This is the first task that the computer will perform when the computer program
    is started. From that point forward, each instruction in the program will direct
    the computer what instruction to perform next after it performs the current instruction.


    There are different ways to specify the entrance point, depending on which computer
    programming language is being used, but every computer program has a defined entrance
    point.


    # CONTROL/BRANCHING


    Computers are often used to automate actions that would otherwise be performed
    by people. One of the most common things a person will be asked to do in performing
    a job is to assess the condition of a thing and, based on the condition of that
    thing, choose between two or more possible courses of action. In other words,
    they will have to make a decision. An example would be the activity of "a teacher
    grading a stack of papers":


    +   1. Take the next student paper from the top of the stack.

    2. Grade the paper.

    3. Write the grade on the paper.

    4. If the grade is 70% or higher, put the paper in a "Passed" stack.

    5. If the grade is below 70%, put the paper in a "Failed" stack.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'You can see that there are two possible “paths” here. A path is “a possible
    course of action arising from a decision.” Think of it as what happens when you
    come to a fork in the road. You have to decide on a course of action – which road
    do you take? This is also called a branch.


    All but the simplest of computer programs will need to do the same thing. That
    is, they will have to check the condition of a piece of data, and based on the
    condition of that data, they will have to execute different sets of computer instructions.


    In order to do this, the program will make use of special computer instructions
    called “control” instructions. These are just instructions that tell the computer
    what to look at in making a decision, and then tell the computer what to do for
    each possible decision. The most fundamental control statement for a computer
    is “if.” It is used like this:


    IF [condition to check] THEN [branch of computer instructions to execute]


    Here, the “IF” is the control statement; the “THEN” is the branching instruction
    that points to the path of the program to execute if the control statement is
    true.


    # VARIABLES


    We covered variables earlier and they are a key part of programs.


    As a recap, a variable is a piece of data that a computer program uses to keep
    track of values that can change as the program is executed. This might be something
    like “the grade of the student paper that was just graded” or “the color of paint
    to use for the next car on the assembly line.”


    Variables are a vital part of any computer program because they make it so a computer
    program can be used for more than a single, predetermined set of values. You can
    imagine that if “the color of paint to use for the next car on the assembly line”
    was only ever able to be “blue,” the computer program using that data wouldn’t
    be very useful. It would make a lot more sense to make it so the computer program
    could change that value for each car that was going to be painted.


    When you are writing variables in a computer program, they usually are written
    in a manner like this:


    [name of the variable] = [value of the variable]'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'For example, you might have something like this:


    ```

    color = "red"

    ```


    Here, the variable is named “color,” and the value of that variable has been set
    to “red.” In other words, the variable named “color” is now “equal” to the word
    “red.”


    Let''s look at the example of “a teacher grading a stack of papers.” Here, we
    could have a variable called “Paper Grade” that changed each time the teacher
    graded a paper. You could also have variables for the total number of questions
    on the paper (“Total Questions”) for both the number of questions the student
    answered correctly (“Correct Questions”) and for the grade of the paper.


    The written description from above:


    +   1. Take the next student paper from the top of the “To Be Graded” stack.

    2. Grade the paper.

    3. Write the grade on the paper.

    4. If the grade is 70% or higher, put the paper in a “Passed” stack.

    5. If the grade is below 70%, put the paper in a “Failed” stack.


    In computer language, the procedure might look something like this:


    +   1. Retrieve Next Paper

    2. Set Total Questions = [total questions in current Paper]

    3. Grade Paper

    4. Set Correct Questions = [number of questions answered correctly]

    5. Set Paper Grade = [Correct Questions/Total Questions]

    6. If (Paper Grade >= 70%) then Paper Status = “passed”

    7. (Paper Grade < 70%) then Paper Status = “failed”


    This is a simple computer program.


    As a note, the >= (greater-than sign followed by equal sign) is a symbol used
    to show that a comparison should be made. Specifically, this “greater-than or
    equal” symbol is an instruction to check whether the data on the left side of
    the symbol is more than or equal in amount or quantity to the data on the right
    side. The answer to this comparison is an answer of “true” or “false.”


    For example: 5 >= 4


    This means “check whether 5 is greater than or equal to 4.” Since five is in fact
    greater than four, the answer is “true.”'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'Another example: 3 >= 6


    This means “check whether 3 is greater than or equal to 6.” The answer is “false.”


    As a final example: 6 >= 6


    This means “check whether 6 is greater than or equal to 6.” The answer is “true.”


    The reverse (opposite) symbol of >= is <=, which checks for whether the data on
    the left side of the symbol is *lesser/fewer or equal* to the data on the right
    side.


    Each time the computer runs the seven-step procedure listed earlier, it could
    have different values for each of the variables in the program, depending on how
    many questions the paper being graded has and how many of those questions the
    student answered correctly.


    For example, let''s say the paper has 100 questions, and the student answers 82
    of them correctly. After the program is run, the result would be the following:


    | Total Questions: | 100 |

    | Correct Questions: | 82 |

    | Paper Grade: | 82% |

    | Paper Status: | Passed |


    As another example, let''s say the paper has 50 questions, and the student answers
    30 of them correctly. After the program is run, the result would be the following:


    | Total Questions: | 50 |

    | Correct Questions: | 30 |

    | Paper Grade: | 60% |

    | Paper Status: | Failed |


    To clarify the need for variables: Let''s say that at the time this computer program
    was being created, all papers at the school had 100 questions, and the teachers
    told the programmer to make it so that the number of questions was always assumed
    to be 100. In that case, the programmer wouldn''t use a variable called “Total
    Questions.”


    Instead, they could make the program look like this:


    +   1. Retrieve Next Paper

    2. Grade Paper

    3. Set Correct Questions = [number of questions answered correctly]'
