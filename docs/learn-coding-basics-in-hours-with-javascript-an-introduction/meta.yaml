- img_proc: true
  md: 'Many computer programming languages require the programmer to specify the data
    type for a variable. These are called “typed languages.” When you first create
    a variable in a typed language, you need to specify what data type the variable
    is.


    In a typed language, there are certain restrictions about how the various data
    types can interact.


    For example, you might need to make the computer instructions that calculate a
    person''s pay for the day. Here, you could have three variables that had a data
    type of “integer,” meaning they represented numeric data (i.e., numbers). An integer
    is a whole number – like 6, 99 and 182. 3.11 and 9½ are not integers.


    You would create the variables that calculate a person''s pay for the day like
    this:


    ```

    integer PayRate = 35.00

    integer HoursWorked = 10

    integer Paycheck

    ```


    The third variable, the integer called Paycheck, doesn''t have a value yet. This
    variable is meant to store the result of a math operation that determines how
    much a worker has earned.


    The computer instruction for this might look something like this:


    ```

    Paycheck = HoursWorked x PayRate

    ```


    Because all three variables are the same data type, the computer can process this
    math operation and store the result in the value for variable “Paycheck”: 350.00.


    Untyped languages are programming languages that do not make you define what data
    type a variable is. Instead, the computer uses a predefined system to work out
    what data type a variable is based on its value and how it is being used.


    For example, let''s use the earlier math example but examine how it could work
    when performed using an untyped language.


    Here, we might have three variables similar to the ones from our earlier example:


    ```

    PayRate = 35.00

    HoursWorked = "ten"

    Paycheck

    ```'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Notice that there are no data types specified. Notice, as well, that the variable
    “HoursWork” has a value of “ten” – a word, not a number.


    If we wanted to perform the same math as the above example, we might create the
    same computer instruction:


    ```

    Paycheck = HoursWorked x PayRate

    ```


    This makes math operations a bit different. The computer takes the value of the
    variable PayRate, 35.00, and tries to multiply it by the value of the variable
    HoursWorked, “ten.”


    This doesn’t work at first glance, of course – you can’t multiply a number by
    a word! But untyped languages have a predetermined system that is used to infer
    (determine something based on the available information) the type of data that
    the variable represents. Here, the language can work out that the word “ten” can
    mean the number 10 – and since the instruction is a math operation, the language
    interprets the variable in that manner and multiplies 35.00 by 10 to get 350.


    JavaScript is an *untyped* programming language in that you aren’t required to
    define the type of a variable.


    # INTERPRETED


    A compiler is a special program that converts the code that looks nearly English
    into a form that the computer can understand and operate off of. The product of
    a compiler would be a set of instructions for the computer to execute that would
    end up doing what the “nearly English” code described.


    For example, if you typed this instruction within a computer program:


    ```

    if age > 18, print “You are an adult”

    (the symbol > means greater than)

    ```


    A compiler would take what you wrote, change it into a form the computer can understand
    and then relay that command to the computer so it can be executed (i.e., machine
    language –a long series of 1s and 0s).


    One important aspect of how a compiler works is that it takes all of the instructions
    in the program and turns them into language the computer can understand before
    actually executing the program. There are other methods of converting high-level
    languages to computer-readable form that don''t involve converting the entire
    program before it is executed. Instead, each instruction is converted and executed
    one at a time. This is not how a compiler works, however.


    A compiled programming language uses a compiler.'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'An interpreter is a special program that converts high-level language instructions
    into low-level language instructions. An interpreter converts code in this way
    one instruction at a time rather than converting the entire set of instructions
    in the program prior to execution.


    In other words, the interpreter will read an instruction, convert it to the language
    the computer can understand, have the computer execute that instruction, then
    go on to the next instruction in the program and repeat.


    Interpreted programming languages (like JavaScript) use interpreters.


    # RUNTIME


    Run means to start or execute something.


    To understand runtime, you must first understand what a “compiler” is.


    Runtime means the time when something in the computer is running. Runtime is exactly
    what it means – the time when the program is run. You can say something happens
    at runtime or it happens at compile time.


    The term “runtime” also describes software or instructions that are executed while
    your program is running, especially those instructions that you did not write
    explicitly, but are necessary for the proper execution of your code. This is actually
    a “runtime library,” but is often shortened to simply “runtime.”


    A library is a collection of pre-made resources used to create computer programs.
    Most often, these take the form of a package of code with built-in functions that
    all relate to a specific area. They are usually used by adding them to a software
    project already being created, and then having code in that project make use of
    the various functions in the library.


    In computer programming, a runtime library is a special program library used by
    a compiler to implement functions built into a programming language during the
    runtime (execution) of a computer program.


    For example, you can design videos to load during runtime or prior to runtime.
    If they were loaded during runtime, then you would have to wait for it to load
    after you clicked on it. If they were loaded prior to runtime, the videos would
    have loaded when you originally opened the program (set of instructions entered
    into a computer that performs exact functions) and so the program would take longer
    to load up when started.'
