  mdcn: "\n## 第二十八章\n### 数字方法\n\n数字方法帮助你在 JavaScript 中处理数字。数字方法有多种。其中之一是 `toPrecision()`\
    \ 方法，它返回一个指定长度的数字字符串。编写此代码：\n\n```html\n<!DOCTYPE html>\n<html>\n    <body>\n\
    \        <p id=\"Precision\"></p>\n        <script>\n            var X = 12938.3012987376112;\n\
    \            document.getElementById(\"Precision\").innerHTML =\n            \
    \    X.toPrecision(10);\n        </script>\n    </body>\n</html>\n```\n\n保存并运行你的代码。你应该得到\
    \ \"12938.30130。\" 数字方法有很多——以上两个应该能让你对这些方法的工作方式有个概念。\n\n### 章节末挑战\n\n现在我们将分配一些我们尚未教授的任务——请在线搜索解决方案：\n\
    \n- 1. 使用 `toFixed()` 方法。\n- 2. 使用 `valueOf()` 方法。\n\n这里有一个有用的链接：w3schools.com/js/js_number_methods.asp\n\
    \n## 第二十九章\n### 最终挑战\n\n为了结束本书，我们将通过创建一个按秒倒计时的计时器，把所有知识整合起来。开始吧！\n\n首先，用以下代码替换你编辑器中的任何现有代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <p>你想设置多少秒的闹钟？</p>\n \
    \       <input id=\"seconds\" value=\"\" />\n        <button onclick=\"countdown()\"\
    >点击这里</button>\n        <p id=\"timer\"></p>\n    </body>\n</html>\n```\n\n这里的想法是，用户将被问到他/她想设置多少秒的计时器。有一个输入框可以输入值。还创建了一个按钮，这样当点击时，它会将值发送出去进行处理。结果将是一个显示的倒计时计时器。\n\
    \n记住，输入标签处理用户输入的信息。id \"seconds\" 和 value \"\" 与我们将很快看到的 JavaScript 代码相关联。\n\n\
    \"button\" 标签将创建一个按钮，当点击时，它会在 JavaScript 代码中查找 \"countdown()\" 函数。倒计时函数产生的结果将取决于用户点击我们创建的按钮时提交的内容。\n\
    \n带有 id \"timer\" 的标签需要知道倒计时函数的结果，以便它可以为用户显示一个计时器。它将从关联的 JavaScript 中检索此信息。\n\n\
    那么，让我们再次查看 HTML 代码，但这次，添加了 JavaScript 代码：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n    <p>你想设置多少秒的闹钟？</p>\n    <input id=\"seconds\" value=\"\" />\n    <button\
    \ onclick=\"countdown()\">点击这里</button>\n    <p id=\"timer\"></p>\n    <script>\n\
    \        function countdown() {\n            var seconds = document.getElementById(\"\
    seconds\").value;\n\n            function tick() {\n                seconds =\
    \ seconds - 1;\n                timer.innerHTML = seconds;\n                setTimeout(tick,\
    \ 1000);\n                if(seconds == -1){\n                    alert(\"时间到！\"\
    );\n                }\n            }\n            tick();\n        }\n    </script>\n\
    </body>\n</html>\n```\n\n你会立刻注意到我们的 JavaScript 代码中有两个独立的函数。实际上，\"tick\" 函数嵌套在\
    \ \"countdown\" 函数内部！提醒一下，这被称为\"嵌套函数\"。\n\n倒计时函数只被调用一次，并且只做两件事：\n\n- 1. 它将一个名为\
    \ \"seconds\" 的变量设置为用户输入的值。\n- 2. 它创建并运行 tick 函数。\n\n另一方面，tick 函数有几个步骤需要执行，并且最终会重复多次。\n\
    \n倒计时函数从用户那里接收到输入值后，tick 函数立即开始执行其指令。重要的是要认识到 tick 函数实际上还没有被执行。它只是让其指令被知晓，以防该函数真的需要被使用。一旦解释器读取了\
    \ tick 函数，它就会退出并看到 \"tick()\" 指令。看到这个函数后，解释器知道要立即返回 tick 函数。然而，这次，它不是简单地读取函数，而是要实际运行该函数。\n\
    \n看看 tick 函数中的变量 \"seconds\"。它从 countdown 函数中获取 \"seconds\" 的值并减去 1。这个值需要减去 1\
    \ 的原因是，每次这个函数运行时，它将持续一秒（我们将看到），并且我们需要 \"seconds\" 变量在每一秒过去时减去 1。\n\n在第一次通过 tick\
    \ 函数时，从用户输入中减去 1 秒后，那个被减去 1 的相同数字现在将被显示给用户看。这发生是因为 `timer.innerHTML` 被赋予了这个数字。还记得我们在一个\
    \ HTML 标签中放置了 \"id=timer\" 吗？那个标签现在持有我们分配给它的这个数字。\n\n语句 \"`setTimeout(tick, 1000);`\"\
    \ 只是意味着程序暂停 1000 毫秒（即 1 秒）。这很重要，因为这个函数可能会重复多次——并且每次重复时，它都需要恰好持续一秒钟。\n\n我们现在有了条件语句。它告诉我们的是，如果用户的输入计数一直减少到\
    \ -1，则停止一切并运行警告框。你可能会问自己，*为什么是 -1 而不是 0？* 原因是当解释器看到 -1 时，它实际上还没有将其显示给用户。用户仍然看到\
    \ 0。因此，在显示 -1 之前，警告框将出现，阻止任何其他代码运行。请注意，如果用户点击警告框上的确定按钮，他/她将看到计时器继续倒计时到负数。\n\n\
    现在，如果用户的输入不等于 -1，解释器将像以前一样退出函数。但是等等；它将再次遇到那个 \"tick()\" 语句！没错。你看到我们的函数现在将如何继续重复了吗？也就是说，直到满足我们的条件语句——此时警告框将显示。\n\
    \n自己试一试，如果需要多次阅读代码才能真正理解，不要担心！\n\n### 最终挑战\n\n这是你的最终任务：\n\n通过在线研究，找出当用户点击警告框上的确定按钮时，如何结束程序（即停止倒计时）。\n\
    \n## 第三十章\n### 恭喜！\n\n你已经完成了我们的书！为你的努力和坚持干得好！\n\n你现在应该对 JavaScript 和编码有了基本的了解。\n\
