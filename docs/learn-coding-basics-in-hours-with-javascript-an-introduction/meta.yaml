  md: "# CHAPTER SEVENTEEN\nNUMBERS\n\nFor simplicity, we are going to keep our HTML\
    \ and JavaScript files separate in this chapter. So, first, open up your HTML\
    \ file in Notepad++ (Test.html) and ensure the code states the following:\n\n\
    ```\n<!DOCTYPE HTML>\n<html>\n\t<body>\n\t\t<p id=\"Math\"></p>\n\t\t<script src=\"\
    Test_1.js\">\n\t\t</script>\n\t</body>\n</html>\n```\n\nSave your code. For the\
    \ next few steps, we will refer to this file as your “HTML code.”\n\nBinary is\
    \ a form of counting and performing math that uses only two numbers. The word\
    \ “binary” comes from the Latin word *binarius*, meaning “two together” or a “pair.”\
    \ All quantities in binary are represented by numbers that use a 1 and/or a 0.\
    \ In fact, any number can be written in binary.\n\nThe ones and zeros in a computer\
