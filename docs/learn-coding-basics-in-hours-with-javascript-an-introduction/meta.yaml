    \ not defined”。\n\n## 章节结束挑战\n\n执行以下操作：\n\n-   编写你自己的嵌套函数，\n-   赋值一个局部变量，以及\n\
    -   赋值一个全局变量。\n\n# 第二十六章：条件语句\n\n“If 语句”是一种条件语句，它指定 *如果* 条件为真，则执行一段代码。\n\n编写以下代码：\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n    <body>\n        <script>\n            if (1\
    \ < 2) {\n                document.write(\"The left number is smaller than the\
    \ right number.\")\n            }\n        </script>\n    </body>\n</html>\n```\n\
    \n保存并执行你的代码。由于 1 小于 2，因此会显示该字符串。\n\n`Date().getHours()` 方法根据本地时间返回指定日期中的小时数，小时数以\
    \ 0 到 23 之间的整数表示。例如：18 等于下午 6:00，12 是中午，等等。\n\n我们可以创造性地使用 \"if\" 语句。编写以下代码：\n\n\
    ```\n<!DOCTYPE html>\n<html>\n    <body>\n        <p id=\"Greeting\">How are you\
    \ this evening?</p>\n        <script>\n            if (new Date().getHours() <\
    \ 18) {\n                document.getElementById(\"Greeting\").innerHTML = \"\
    How are you today?\";\n            }\n        </script>\n    </body>\n</html>\n\
    ```\n\n保存并执行你的代码。在这个程序中，我们写道：“如果在我运行代码时是下午 6:00 之后（大于），则显示‘How are you this evening?’。如果在我运行代码时是下午\
    \ 6:00 之前，则显示‘How are you today?’。”\n\n那么，如果我们想要更多选择呢？\n\n## ELSE 语句\n\nelse 语句指定一个代码块，当条件为\
    \ false 时（与 if 语句相反）将执行该代码块。\n\n编写以下代码：\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n\
    \        <p>Write your age:</p>\n        <input id=\"Age\" value=\"\" />\n   \
    \     <p id=\"How_old_are_you?\"></p>\n        <button onclick=\"Age_Function()\"\
    >Click here</button>\n        <script>\n        function Age_Function() {\n  \
    \          Age = document.getElementById(\"Age\").value;\n            if (Age\
    \ >= 18) {\n                Vote = \"You are old enough to vote!\";\n        \
    \    }\n            else {\n                Vote = \"You are not old enough to\
    \ vote!\";\n            }\n            document.getElementById(\"How_old_are_you?\"\
    ).innerHTML = Vote;\n        }\n        </script>\n    </body>\n</html>\n```\n\
    \n保存并执行你的代码。你刚刚创建了一个判断一个人是否可以投票的程序！\n\n现在，如果我们想要更多选择呢？\n\n## ELSE IF 语句\n\n“else\
    \ if” 语句跟在 “if” 语句之后，如果 “if” 语句被发现为 false，则执行它。例如：\n\n-   如果饿了，就吃。\n-   否则如果渴了，就喝。\n\
    -   否则，休息。\n\n编写以下代码：\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n        <p\
    \ id=\"Time_of_day\"></p>\n        <script>\n            function Time_function()\
    \ {\n                var Time = new Date().getHours();\n                var Reply;\n\
    \                if (Time < 12 == Time > 0) {\n                    Reply = \"\
    It is morning time!\";\n                }\n                else if (Time > 12\
    \ == Time < 18) {\n                    Reply = \"It is the afternoon.\";\n   \
    \             }\n                else {\n                    Reply = \"It is evening\
    \ time.\";\n                }\n                document.getElementById(\"Time_of_day\"\
    ).innerHTML = Reply;\n            }\n            Time_function();\n        </script>\n\
    \    </body>\n</html>\n```\n\n保存并运行你的代码。你制作了一个从你的计算机获取时间并告诉你现在是一天中什么时间的程序！\n\n\
    ## 章节结束挑战\n\n执行以下操作：\n\n-   编写你自己的函数，其中包含一个 \"if\" 语句、一个 \"else if\" 语句和一个 \"\
    else\" 语句。\n\n# 第二十七章：字符串方法\n\nJavaScript 有字符串方法，允许你对字符串执行任务。\n\n如前所述，编程语言内置了某些数据类型。这些内置数据类型是编程语言中最基本的数据类型，被称为原始数据类型。原始数据类型的一个关键特征是它不能进一步简化。原始数据类型是语言中预定义的数据类型。\n\
    \nJavaScript 中有五种原始数据类型——它们是：\n\n1.  String（字符串）,\n2.  Number（数字）,\n3.  Boolean（布尔）,\n\
    4.  Null（空值）, 和\n5.  Undefined（未定义）。\n\n其他所有内容（非原始数据类型）都是对象。对象是由程序员创建的，而不是预定义并内置在编程语言中的。\n\
    \n## CONCAT() 方法\n\n`concat()` 方法连接（连接）两个或多个字符串。编写以下代码：\n\n```\n<!DOCTYPE html>\n\
    <html>\n<body>\n<p id=\"Concatenate\"></p>\n<script>\nvar part_1 = \"Hello \"\
    ;\nvar part_2 = \"World \";\nvar part_3 = \"from \";\nvar part_4 = \"sentence.\"\
    ;\nvar whole_sentence = part_1.concat(part_2, part_3, part_4);\ndocument.getElementById(\"\
    Concatenate\").innerHTML = whole_sentence;\n</script>\n</body>\n</html>\n```\n\
    \n保存并执行你的代码。它会将句子作为一个整体显示出来！\n\n## SLICE() 方法\n\n`slice()` 方法是一种字符串方法，它提取字符串的一部分，然后以新字符串的形式返回提取的部分。\n"
