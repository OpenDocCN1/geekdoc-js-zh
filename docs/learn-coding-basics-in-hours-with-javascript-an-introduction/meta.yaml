  - '[PAGE 89]


    # CHAPTER TWENTY ONE

    COMPARISON OPERATORS


    In JavaScript, we can utilize double and triple equal signs.


    == (double equal sign) is a symbol used to show that a comparison should be made.
    Specifically, this “==” symbol is an instruction to check whether the data on
    the left side of the symbol is equal to the data on the right side. The answer
    to this comparison is an answer of “true” or “false.”


    When the “==” symbol is used to check for equality, usually it is used like this:
    [first item to be compared] == [second item to be compared]


    For example: (10 + 5) == 15


    In this example, we are asking the computer to check whether the result of adding
    5 and 10 is equal to 15.


    When the “==” symbol is used in this manner, we are asking the computer to give
    a response after checking for equality. Usually, this result is given in a “true”
    or “false” manner. Here, the response would be “true,” since (10 + 5) is equal
    to 15.


    Another example: (10 + 6) == 15


    Here, the computer would respond with “false,” since (10 + 6) is not equal to
    15.


    === (triple equal sign) is used to show that a comparison should be made. Specifically,
    this “===” symbol is an instruction to check whether the data on the left side
    of the symbol is equal to the data on the right side, and that it is the same
    type of data (data type) as that on the right. The answer to this comparison is
    an answer of “true” or “false.”


    For example, let’s say you want to check whether two birth dates are equal. You
    have two pieces of data in the computer that represent these two birth dates:

    1. “DateOfBirth1” is data of type “Date,” and the value of the data is “1/1/1970.”

    2. “DateOfBirth2” is data of type “Date,” and the value of the data is “1/1/1970.”


    You would use the "===" symbol like this:


    ```

    DateOfBirth1 === DateOfBirth2

    ```


    This tells the computer to check whether the two pieces of data are equal in both
    VALUE and TYPE. Since they are in this case, the computer responds with “true.”'
