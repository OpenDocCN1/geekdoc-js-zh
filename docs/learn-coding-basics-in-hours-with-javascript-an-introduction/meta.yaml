    \ = part_1.concat(part_2, part_3, part_4);\ndocument.getElementById(\"Concatenate\"\
    ).innerHTML = whole_sentence;\n</script>\n</body>\n</html>\n```\n\nSave and execute\
    \ your code. It displays the sentence as a whole!\n\n## SLICE() METHOD\n\nThe\
    \ slice() method is a string method that extracts a section of a string and then\
    \ returns the extracted section in a new string."
  mdcn: "\n在 JavaScript 中，函数可以访问其在代码中上方的函数。嵌套函数是指在另一个函数内部，并且与之有某种关联的函数。\n\n要实际查看这一点，请编写以下代码：\n\
    \n```\n<!DOCTYPE html>\n<html>\n    <body>\n        <p id=\"Counting\"></p>\n\
