  md: 'It would not make sense to apply mathematical operations to text data – for
    example, trying to tell a computer to add the number 34 to the text “banana” wouldn’t
    work because the two types of data are different, and mathematics doesn’t apply
    to text data.


    In math, a variable is a symbol used to represent an unknown quantity or a quantity
    that may change. In computers, a variable is a construct (an idea formed from
    simpler elements) used to store data that may change as the computer performs
    its tasks.


    Computers often have to keep track of various pieces of information. These can
    be things like the name of a computer user, the color of the background shown
    on the computer screen, an order number for something a user ordered from a company,
    etc.


    The computer usually gives each of these pieces of data a NAME and a VALUE. The
    NAME is used to identify the exact piece of data, and the VALUE is used to show
    the actual data we need to keep track of. Usually the “=” symbol is used to set
    the VALUE of a variable.


    In math, a value is a numeric amount, quantity, or number – like this: X = 10


    Here we are saying that the *name* “X” holds the *value* of “10.”


    In coding, a value is any sort of characteristic or attribute. We could assign
    the value like this:


    X = Happy


    This means we are saying the *name* X is assigned the *value* Happy. We could
    later tell the computer:


    Print X


    The computer would then display:


    Happy


    The things the computer is keeping track of are usually called “variables.” This
    is because the VALUE part of it can change when you tell the computer to change
    it. The fact that the value can vary is why it’s called a “variable” – its value
    is not permanent or constant.'
