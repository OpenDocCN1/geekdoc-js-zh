    \ path: C:\\Users\\user\\Downloads\\Kitten.jpeg\n\nJpeg is a type of image and\
    \ we must include the extension for the image in our file path. Otherwise, the\
    \ image won't display.\n\nOpen up your Test.html file and replace the code with\
    \ this:\n\n```html\n<!DOCTYPE HTML>\n<html>\n    <body>\n        <img src=\"C:\\\
    Users\\user\\Downloads\\File_Name.Extension\"></img>\n    </body>\n</html>\n```\n\
    \nSave and run your code.\n\nIf it doesn’t display correctly, check the following:\n\
    \n1.  Did you save your image in your Downloads folder? If not, move it there.\n\
    2.  Did you include the image file extension? If not, add it.\n3.  Did you enter\
    \ the correct file path? If not, verify it and add it.\n\n## “HELLO, WORLD” IN\
    \ JAVASCRIPT\n\nNow, there are two ways we can add JavaScript to our HTML code.\
    \ The first way is to just write the code inside the HTML using the `<script>`\
    \ element.\n\nA “method” is something an object can do. It’s a named sequence\
    \ of events. A method should always have a meaningful name, such as CalculateIncomeTax\
    \ – not Method_1 or something. That way you can get an idea of what it’s supposed\
    \ to do from reading the name.\n\n“Alert” is a JavaScript method that displays\
    \ an alert box (small window with an “OK” button).\n\nCharacters are letters,\
    \ numbers and symbols – such as those found on a keyboard. As we mentioned earlier,\
    \ strings (series of characters) are one of the six types of value. In JavaScript,\
    \ we can create strings with double quotes (“) or single quotes (‘), such as:\
    \ “Mary had a little lamb,” or ‘Its fleece was white as snow.’ In our above code,\
    \ “Hello, World!” is a string. It doesn’t matter whether you use double or single\
    \ quotes; they both perform the same functions.\n\nLet’s use JavaScript within\
    \ our HTML file to display Hello, world! – edit your code as follows:\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n    <body>\n        <script>\n            alert(\"Hello,\
    \ World!\");\n        </script>\n    </body>\n</html>\n```\n\nSave and execute\
    \ this code. As a note: When we say “execute” here, we mean “Run the code in Google\
    \ Chrome by clicking ‘Run,’ then clicking ‘Launch in Chrome.’” *You should always\
    \ save your code before running it.*\n\nGood job! We just made a pop-up!\n\nWhen\
    \ we include our JavaScript code inside of our HTML file, it's called *inline\
    \ JavaScript*.\n\nThere’s another way we can use JavaScript with HTML and that’s\
    \ by connecting our code to an external file. Meaning, we have an HTML file with\
    \ your HTML code in it, and a *separate* file containing your JavaScript code.\n\
    \nHere’s how that would work. First, create a new file and write this code:\n\n\
    ```javascript\nalert(\"Hello, World!\");\n```\n\nThat is our JavaScript code.\n\
    \nSave this file on your desktop. Save it as “Test_1,” as a “JavaScript file”\
    \ (i.e., click File, Save As, write “Test_1” as the File name, and then click\
    \ on JavaScript file under “Save as type”).\n\nTo link our HTML file with our\
    \ JavaScript file, we use the script element with the src attribute. Src is short\
    \ for “source” – meaning, we are designating the source (location/name) of the\
    \ file we are linking to.\n\nNow, go back to your original HTML file and write\
    \ this code:\n\n```html\n<!DOCTYPE HTML>\n<html>\n    <body>\n        <script\
    \ src=\"Test_1.js\">\n        </script>\n    </body>\n</html>\n```\n\nSave and\
    \ execute the code. We displayed the same alert box in a different way!\n\nKeeping\
    \ your JavaScript code in a separate file from your HTML code is the recommended\
    \ way and considered best practice. It keeps your code better organized.\n\nAs\
    \ a recap, we can execute our JavaScript in two ways:\n\n1)  Inline JavaScript\
    \ (write all your JavaScript within your HTML file), or\n2)  Write your JavaScript\
    \ code in a separate, external file and referencing it (referring to it) in your\
    \ HTML file.\n\nWhile the latter option is the way to go when doing professional\
    \ software development, we will use both of these methods throughout this book.\n\
    \n## WINDOW.ALERT()\n\nWe can cause an alert window to pop up using the window.alert()\
    \ method. In JavaScript, statements are the lists of instructions to be executed\
    \ by the computer that make up a program. Statements are separated using a semicolon.\
    \ It tells the computer, “Here is the end of this statement.”"
  mdcn: "\n请完成以下操作：\n\n在网上找到一张你希望在HTML代码中显示的图片，并复制该图片的URL。\n\n你可以按以下步骤操作：\n\n1.  在Google上搜索你想要的图片（例如“小猫”）。\n\
    2.  点击搜索栏下方的“图片”。\n3.  点击你想要的图片（它应该会显示在屏幕右侧）。\n4.  右键单击该图片，选择“复制图片地址”。将此URL粘贴到某处，因为我们很快会用到它。\n\
    \n打开你的Test.html文件（如果尚未打开，一种方法是在桌面上右键单击你的文件，然后选择“使用Notepad++编辑”），并将代码替换为：\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n    <body>\n        <img src=\"在此处插入图片的URL\"></img>\n\
    \    </body>\n</html>\n```\n\n保存并执行你的代码。你的图片就会在浏览器中显示出来了！\n\n现在，让我们尝试显示一张保存在你电脑上的图片。\n\
    \n## 电脑图片\n\n文件的路径称为“文件路径”。“文件路径”是文件的地址，它指定了文件的精确位置。它为文件提供了一个“路径”。\n\n文件路径会这样描述：“你可以在名为‘Poems’的文件夹中找到名为‘Winter’的文件，而这个文件夹位于C盘内。”驱动器只是数据存储的一个位置。C盘是电脑上大多数文件和软件的存储位置。\n\
    \n路径的各个部分由一个不太可能用于目录或文件名的文本字符分隔。通常这个字符是斜杠、反斜杠或冒号（分别为“/”、“\\”或“:”）。\n\n“\\”（反斜杠）符号在计算机中用于分隔电子文档集合的不同部分，并且已经被使用了很长时间。它被创造出来是为了帮助组织和查找你可能存储在计算机上的各种文件。\n\
    \n在文件路径中，反斜杠用于表示一个项目位于另一个项目之下（从层次结构的角度来看）。\n\n层次结构是指根据等级或地位来排列事物。它指的是根据项目的相对重要性或特征来排列项目。存储层次结构指的是一个系统，在该系统中，各种数据存储设备根据其使用方式被赋予了层次重要性排名。影响给定设备排名的主要因素是其响应时间——即当计算机请求数据时，设备返回请求的数据片段需要多长时间。响应时间越快，排名越高。\n\
    \n在文件路径中，左边的项目位于右边项目的“上方”。如果我们采用之前的例子，文件路径将写为：\n\n```\nC:\\Poems\\Winter\n```\n\
    \n为下一个任务做准备，下载一张你选择的图片（确保将其保存在“下载”文件夹中）。\n\n书面文件、图片和视频是不同文件格式的示例。这些文件中的数据是以特定方式组织的，通常是基于数据将被计算机执行的各种进程使用的方式来组织的。\n\
    \n例如，书面文档文件中的数据组织方式将与视频文件中的数据非常不同。\n\n一种常见的文件格式是“PDF”。这代表“便携式文档格式”。这是由软件公司Adobe在1990年代开发的文件格式。开发这种文件格式是为了确保无论文件在何种计算机上显示，都能保持一致的显示效果。\n\
    \n文件格式由其扩展名指示。扩展名是一个代码，它说明了文件格式是什么（文本、图像、视频等）。扩展名被附加在文件名的末尾。\n\n假设你有一个名为“Contract”的文件，它以PDF格式存储；该文件将被命名为“Contract.pdf”——.pdf就是扩展名。\n\
    \n另一种常见的文件格式和扩展名是“.txt”（“文本文件”的缩写）。这是一种纯文本文件类型，无格式（没有特殊设计；纯文本）。如果你曾使用过记事本，它保存和运行的就是.txt文件。\n\
    \n正如我们之前所介绍的，你的HTML文件必须始终以.html扩展名结尾。\n\n如果我们想在HTML代码中显示一张保存在电脑上的图片，我们需要包含文件路径，如下所示的代码所示。文件路径应该是：C:\\\
    Users\\user\\Downloads\\File_Name.Extension\n\n但为了确保你拥有正确的文件路径，你可以右键单击图片并选择“属性”——你会在“位置”旁边看到图片的文件路径。\n\
    \n例如，如果我们有一张名为“Kitten”的图片保存在“下载”文件夹中，文件路径可能是：C:\\Users\\user\\Downloads\\Kitten.jpeg\n\
    \nJpeg是一种图片类型，我们必须在文件路径中包含图片的扩展名。否则，图片将无法显示。\n\n打开你的Test.html文件，并将代码替换为：\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n    <body>\n        <img src=\"C:\\Users\\user\\Downloads\\\
    File_Name.Extension\"></img>\n    </body>\n</html>\n```\n\n保存并运行你的代码。\n\n如果没有正确显示，请检查以下几点：\n\
    \n1.  你是否将图片保存在“下载”文件夹中？如果没有，请将其移至该文件夹。\n2.  你是否包含了图片文件扩展名？如果没有，请添加它。\n3.  你是否输入了正确的文件路径？如果没有，请验证并添加它。\n\
    \n## “你好，世界”的JavaScript实现\n\n现在，我们有两种方法可以将JavaScript添加到HTML代码中。第一种方法是直接在HTML内部使用`<script>`元素编写代码。\n\
    \n“方法”是对象可以执行的操作。它是一个命名的事件序列。方法应该始终有一个有意义的名称，例如CalculateIncomeTax，而不是Method_1之类的东西。这样你就可以通过阅读名称来了解它的预期功能。\n\
    \n“alert”是一个JavaScript方法，它会显示一个警告框（一个带有“确定”按钮的小窗口）。\n\n字符是字母、数字和符号——例如键盘上可以找到的那些。正如我们之前提到的，字符串（一系列字符）是六种值类型之一。在JavaScript中，我们可以使用双引号（\"\
    ）或单引号（'）创建字符串，例如：“Mary had a little lamb”或“Its fleece was white as snow”。在我们的上述代码中，“Hello,\
    \ World!”是一个字符串。无论使用双引号还是单引号都无关紧要；它们执行相同的功能。\n\n让我们在HTML文件中使用JavaScript来显示Hello,\
    \ world!——按如下方式编辑你的代码：\n\n```html\n<!DOCTYPE HTML>\n<html>\n    <body>\n     \
    \   <script>\n            alert(\"Hello, World!\");\n        </script>\n    </body>\n\
    </html>\n```\n\n保存并执行此代码。注意：我们这里所说的“执行”是指“通过点击‘运行’，然后点击‘在Chrome中启动’来在Google Chrome中运行代码。”\
    \ *在运行代码之前，你应该始终保存你的代码。*\n\n做得好！我们刚刚创建了一个弹出窗口！\n\n当我们把JavaScript代码包含在HTML文件中时，它被称为*内联JavaScript*。\n\
    \n还有另一种方法可以将JavaScript与HTML一起使用，那就是将我们的代码连接到外部文件。这意味着，我们有一个包含HTML代码的HTML文件，以及一个*独立的*包含JavaScript代码的文件。\n\
    \n以下是它的工作原理。首先，创建一个新文件并编写以下代码：\n\n```javascript\nalert(\"Hello, World!\");\n```\n\
    \n这就是我们的JavaScript代码。\n\n将此文件保存在你的桌面上。将其保存为“Test_1”，格式为“JavaScript文件”（即，点击“文件”，“另存为”，在“文件名”中输入“Test_1”，然后在“保存类型”下点击“JavaScript文件”）。\n\
    \n要将我们的HTML文件与JavaScript文件链接起来，我们使用带有src属性的script元素。Src是“source”的缩写——意思是，我们正在指定我们链接的文件的来源（位置/名称）。\n\
    \n现在，回到你原来的HTML文件并编写以下代码：\n\n```html\n<!DOCTYPE HTML>\n<html>\n    <body>\n  \
    \      <script src=\"Test_1.js\">\n        </script>\n    </body>\n</html>\n```\n\
    \n保存并执行代码。我们以不同的方式显示了相同的警告框！\n\n将你的JavaScript代码保存在与HTML代码分离的文件中是推荐的方式，被认为是最佳实践。它使你的代码组织得更好。\n\
    \n总结一下，我们可以通过两种方式执行JavaScript：\n\n1)  内联JavaScript（将你所有的JavaScript写在HTML文件中），或者\n\
    2)  将你的JavaScript代码写在一个独立的外部文件中，并在HTML文件中引用它（指向它）。\n\n虽然在进行专业软件开发时，后一种方式是首选，但我们将在本书中同时使用这两种方法。\n\
    \n## WINDOW.ALERT()\n\n我们可以使用window.alert()方法使一个警告窗口弹出。在JavaScript中，语句是由计算机执行的指令列表，它们构成了程序。语句使用分号分隔。它告诉计算机：“这条语句到此结束。”\n"
