    \ For example: 7 > 3 means “seven is greater than three”, and 4 < 9 means “four\
    \ is less than nine”.\n\nSo, for example, instead of 10 is greater than 2, we\
    \ would write:\n\n```\n10 > 2\n```\n\nAnd, again, if we wanted to say “greater\
    \ than or equal to”, we could use the symbol >=.\n\nFor example:\n\n```\n10 >=\
    \ 8\n```\n\nThis would be true.\n\nLike virtually all other programming languages,\
    \ the Boolean values in JavaScript are true and false."
  mdcn: "\n# 第十九章\n浮点数\n\n是时候来点数学知识了！\n\n因子是能够相乘得到另一个数字的数。例如，4和5是20的因子，因为4 × 5 = 20。\n\
    \n![](img/33a81fac26246d29975692e5ecda6e53_80_0.png)\n\n上标是通常显示在另一个数字右上方的较小字符——就像这样：4<sup>12</sup>\n\
    \n上标通常表示“幂”。幂指的是一个数字自乘的次数。例如，10<sup>4</sup>表示10的四次方——即10,000（10乘以10再乘以10再乘以10）。\n\
    \n记号是用于表示数字或数量的符号或符号组合——比如放在数字末尾的E。这种记号表示“10的给定指数次方”。“指数”是数字自乘的次数。在上面给出的10<sup>4</sup>的例子中，4就是指数。\n\
    \n![](img/33a81fac26246d29975692e5ecda6e53_80_1.png)\n\n浮点数是表示大数字的一种特定方式。你无需写出整个数字，而是可以写出它的第一部分，然后乘以一个因子。这样，通过执行乘法运算，你得到的基本上与完整写出该数字的结果相同。这样做时，你移动了数字中的小数点；因此得名“浮点数”。\n\
    \n例如，取数字三千四百二十五。正常写法是：3425——用浮点数记法写，则是：3.425 x 10³。由于10³是1000，这表示“3.425乘以1000”，即3425。\n\
    \n“浮点型”是计算机使用的一种数据类型。“浮点型”用于存储精度非常高的数字。它主要用于数学目的。\n\n假设我们想要一个更短的方式来书写100,000。我们可以写成\
    \ 10E 4。\n\n10E 4 表示 10 X 10⁴（10乘以10四次）。\n\n在JavaScript中，所有数字都是浮点数，而浮点数的上限是 1.797693134862315E+308（这意味着JavaScript无法处理更大的浮点数）。任何大于\
    \ 1.797693134862315E+308 的数字都被视为“无穷大”。需要注意的是，这是一个巨大的数字，远远超出了大多数计算器的能力，需要非常多的位数才能显示出来。\n\
    \n# 其他数字\n\n在JavaScript中，有三个独特的值被认为是数字，但实际上它们的行为方式并不相同。它们是：\n\n- NaN（“非数字”的缩写）\n\
    - Infinity（正无穷大）\n- -Infinity（负无穷大）\n\n理解这些数字的最佳方式是将它们付诸实践。下面是一个例子：在一个*新建*的Notepad++文档中，编写以下代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <p id=\"Not_a_Number\"\
    ></p>\n        <script>\n            document.getElementById(\"Not_a_Number\"\
    ).innerHTML = 0/0;\n        </script>\n    </body>\n</html>\n```\n\n将你的文件保存为.html文档，名称自选。然后执行你的代码。结果是NaN，因为0不能除以0。\n\
    \n我们可以使用 isNaN() 函数来检查某个值是否为数字。将你的代码修改如下：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    \    <body>\n        <p id=\"Not_a_Number\"></p>\n        <script>\n        document.getElementById(\"\
    Not_a_Number\").innerHTML = isNaN('Hello World');\n        </script>\n    </body>\n\
    </html>\n```\n\n保存并运行你的代码。如你所见，结果是“true”，因为\"Hello World\"*不是*一个数字。让我们将代码改为：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <p id=\"Not_a_Number\"\
    ></p>\n        <script>\n        document.getElementById(\"Not_a_Number\").innerHTML\
    \ = isNaN('007');\n        </script>\n    </body>\n</html>\n```\n\n注意：唯一的区别是我们将\"\
    Hello World\"改为了\"007\"。保存并运行你的代码。现在结果是false，因为007是一个数字。\n\n现在，删除你的代码并编写以下内容：\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n    <body>\n        <p id=\"Infinity\"></p>\n\
    \        <script>\n        document.getElementById(\"Infinity\").innerHTML = 1.7976931348623157E+309;\n\
    \        </script>\n    </body>\n</html>\n```\n\n保存并执行你的代码。你可以看到结果“infinity”。这是因为我们输入了一个大于\
    \ 1.797693134862315E+308 的数字。\n\n要看到 -Infinity，只需将你的代码改为一个小于 -1.797693134862315E+308\
    \ 的数字，例如下面的数字：\n\n```html\n<!DOCTYPE HTML>\n<html>\n    <body>\n        <p id=\"\
    Infinity\"></p>\n            <script>\n                document.getElementById(\"\
    Infinity\").innerHTML = -1.7976931348623157E+309;\n            </script>\n   \
    \ </body>\n</html>\n```\n\n# 章节末尾挑战\n\n创建你自己的程序，返回以下值：\n\n- Infinity（无穷大），\n-\
    \ -Infinity（负无穷大），和\n- NaN（非数字）。\n\n# 第二十章\n布尔逻辑\n\n“逻辑”指的是有意义、合理的行为、表现和思考方式。在计算机领域，逻辑是构成计算机执行特定任务基础的规则。计算机逻辑是计算机在决策时使用的指导方针。\n\
    \n诸如“与”（and）、“或”（or）和“非”（not）之类的逻辑运算符用于评估表达式是真还是假。\n\n乔治·布尔是一位英国数学家，他发展了布尔逻辑。“布尔逻辑”是一种逻辑形式，其中决策的唯一可能结果是“真”和“假”。对于计算或决策，不存在模糊或“差不多”的答案——非黑即白，没有灰色地带。\n\
    \n![](img/33a81fac26246d29975692e5ecda6e53_84_0.png)\n\n布尔逻辑的一个例子是只用“是”或“否”来回答问题。\n\
    \n布尔逻辑对于数字计算机的构建和运行尤为重要，因为创建一个运算结果要么为“真”要么为“假”的机器相对容易。\n\n这是通过比较两个或更多项目来完成的——这些项目只能是“真”或“假”。\n\
    \n一些常见的此类布尔比较例子是“AND”（与）和“OR”（或）。\n\n名为“AND”的布尔比较，*仅当所有涉及的比较都为真时*，比较结果才为真。\n\n\
    让我们看一些例子来展示这是如何工作的：\n\n在下面的AND比较中，结果为真：\n\n5 大于 3 且 10 大于 5\n\n我们来分解一下。\n\n这里发生了三个比较：\n\
    \n1. 比较5和3，看5是否大于3（5大于3吗？）\n2. 比较10和5，看10是否大于5（10大于5吗？）\n3. 使用布尔比较“AND”比较这两个比较的结果（两个比较都为真吗？）\n\
    \n这是整体比较。\n\n5大于3是成立的，所以第一个比较为真。\n\n10大于5也是成立的——所以第二个比较也为真。\n\n布尔AND比较在另一个比较都为真时才为真——所以在这个例子中，整体比较为真，因为第一个比较为真*且*第二个比较为真。\n\
    \n在下一个例子中，结果为假（不为真）：\n\n5 大于 7 且 10 大于 5\n\n尽管10大于5，但5并不大于7——所以整体比较不为真。\n\n“条件”是必须为真才能发生其他事情的项目。在上面的AND比较中，检查的这两个条件是：\n\
    \n1. 5大于7\n2. 10大于5\n\n它们是条件，因为结果取决于（依赖于）这两个比较。\n\n布尔OR比较检查是否*一个或*两个条件都为真。下面是一个例子：\n\
    \n```\n4 小于 9 或 8 小于 7\n```\n\n结果将为真，因为至少一个比较为真（4是一个比9小的数字）。\n\n在下面的例子中，结果将为假，因为两个都不为真：\n\
    \n```\n8 小于 4 或 9 小于 3\n```\n\n而在这个例子中，结果将为真，因为一个或两个（在这种情况下是两个）都为真：\n\n```\n7\
    \ 小于 8 或 2 小于 5\n```\n\n提醒一下，在为计算机编写指令时，我们会使用大于和小于符号（分别为 > 和 <）。例如：7 > 3 表示“七大于三”，而4\
    \ < 9 表示“四小于九”。\n\n所以，例如，不是写“10大于2”，我们会写：\n\n```\n10 > 2\n```\n\n同样，如果我们想说“大于或等于”，我们可以使用符号\
    \ >=。\n\n例如：\n\n```\n10 >= 8\n```\n\n这将为真。\n\n与几乎所有其他编程语言一样，JavaScript中的布尔值是true（真）和false（假）。\n"
