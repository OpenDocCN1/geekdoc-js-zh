    Now that Notepad++ is installed on your machine, do the following:\n\nLaunch Notepad++\n\
    \nClick on File on the menu bar and open a New File (or just press Ctrl + N).\n\
    \n### “HELLO, WORLD” IN HTML\n\nThe first code that developers usually write when\
    \ learning a new language is to make the computer display the text: “Hello world.”\
