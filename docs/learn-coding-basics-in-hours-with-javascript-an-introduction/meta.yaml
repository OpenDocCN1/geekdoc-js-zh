    \ repetition.\n\nWell done on making it through these beginning chapters! Now\
    \ we are going to start coding!\n\n## CHAPTER THIRTEEN\n### FIRST CODING ASSIGNMENTS\n\
    \nHere is your first task:\n\nDownload and install Notepad++ here: https://notepad-plus-plus.org/\n\
    \nYou will be writing your code in the code editor Notepad++.\n\nNote: If you\
    \ are using a Macintosh computer, you can utilize a different code editor – such\
    \ as Brackets.\n\n### HTML\n\nBefore writing code in JavaScript, you must be familiar\
    \ with some basic HTML.\n\nThe markup instructions in HTML give the computer data\
    \ *about* the elements of the document – text, images, video, etc. When the document\
    \ is actually displayed on a screen, those markup instructions aren't displayed\
    \ on the screen; instead, they are used to control *how* the actual content of\
    \ the document is displayed.\n\n### TAGS\n\nHTML utilizes tags. Tags are how the\
    \ markup of the content in the HTML document is specified.\n\nThe basic principle\
    \ is this: If you put special instructions before and after the content you want\
    \ to affect, another program can tell the difference between the instruction and\
    \ the content, and can then present the data in a specified manner.\n\nBecause\
