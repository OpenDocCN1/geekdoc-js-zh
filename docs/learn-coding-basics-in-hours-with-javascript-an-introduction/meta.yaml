    ## 第十章

    编程语言的类型


    正如我们在本书前面所介绍的，编程语言是让你能够创建程序的、由词语、短语和符号组成的系统。它们也被称为计算机语言。


    编程语言有许多不同的类型，每种语言都是为了满足特定目的而创建的。通常，一种语言的创建是为了使某些类型的计算机程序的创建更加容易。


    一些编程语言专门用于创建网站，而另一些则专门用于制作应用程序。在本章中，我们将介绍一些最知名的编程语言。但首先，有一些与编程语言相关的术语需要介绍。第一个是“标记”。


    “标记”是指向文档添加指令以控制文档内容的格式、样式和外观的行为。这既适用于物理打印文档，也适用于在计算机屏幕上显示的电子文档（如网站）。


    标记语言是一种用于指定文档中数据标记指令的编程语言。换句话说，标记指令不是文档中的数据；它们是*关于*文档中数据的数据。


    有几种类型的标记语言。通常，它们是为具有明确结构规范的常用文档类型而创建的。这些关于文档结构的规范在世界范围内广为人知，任何想要创建此类文档的人都可以获得。


    脚本是计算机在没有你参与的情况下自动执行的一系列命令。脚本语言是用来制作脚本的计算机语言。


    通常，这些脚本执行的任务对于自动化非常有价值——这样，你就无需每次执行这些任务时都重新将任务步骤输入计算机。


    这个术语的起源与其在“电影剧本告诉演员该做什么”中的含义相似；脚本语言控制计算机的操作，一次性给它一系列工作来完成。例如，你可以将一系列编辑命令放在一个文件中，并告诉编辑器运行该“脚本”，就像这些命令是手动输入的一样。


    举个例子，如果你想让系统在每天午夜自动打印出所有报名参加你学校课程的人员名单，你可以使用脚本语言来制作一个完成这项工作的脚本。


    JavaScript 可以用来创建脚本，并且它是一种脚本语言。


    有几种语言与 JavaScript 一起使用——让我们来看看它们是什么。


    ## 第十一章


    ### HTML 和 CSS


    JavaScript 是用于创建万维网内容的三种主要技术之一（另外两种是 HTML 和 CSS）。


    ### HTML


    超文本标记语言是构成万维网网页的标记语言。它由蒂姆·伯纳斯-李（万维网的发明者）于 1990 年创建。超文本是用于链接电子文档的系统。在 HTML 文档中，超文本是链接到其他
    HTML 文档的单词、图像、视频等。当用户选择超文本时，链接的文档就会被检索并显示在计算机屏幕上。HTML 用于创建网页。


    计算机程序员使用 HTML 在网页内容的前后放置标记指令。这些标记指令为计算机提供*关于*文档元素的数据——文本、图像、视频等。当文档实际显示在屏幕上时，这些标记指令不会显示在屏幕上——相反，它们被用来控制文档实际内容的*显示方式*。截至
    2020 年，HTML5 是 HTML 的最新版本。以下是一个来自 1990 年代的 HTML 网站示例：


    ![](img/33a81fac26246d29975692e5ecda6e53_45_0.png)


    ### CSS


    层叠样式表创建于 1996 年，用于控制这些网页上的文本、图像、视频等的外观。样式表是一种用于设计网页格式的工具。样式表是存储关于页面将如何显示以及如何运行的数据的中心位置。它们可以用来存储关于如何显示颜色、图片、文本等信息。样式表是处理网站样式的表格。


    样式并不关心页面的内容；相反，它关心的是这些内容的外观。层叠是一个源自水从一系列高度递减的水滴上滴落的术语。可以把它想象成一系列小瀑布。信息可以层叠，这意味着它可以存储在一个中心的、最重要的位置，然后可以应用于被认为低于或源于该更重要中心位置的其他位置。对于网页来说，这意味着你可以在一个高级网页中设置样式信息，同样的样式信息可以“层叠”到其他更低级的页面，而无需任何额外的工作。CSS
    通常与 HTML 结合使用，以提升 HTML 网站的外观和功能。截至 2020 年，CSS3 是 CSS 的最新版本。


    ![](img/33a81fac26246d29975692e5ecda6e53_46_0.png)


    HTML、CSS 和 JavaScript 通常结合使用来创建动态网站。在本书中，我们将教你一些基础的 JavaScript，为此，我们将偶尔使用 HTML。


    ### JAVASCRIPT 的历史


    浏览器是你用来查看互联网上网页的程序。为了查看网上的信息，你需要使用网络浏览器。人们使用浏览器最常见的活动是查找和查看网站——更具体地说，是网站上的网页。谷歌
    Chrome 是使用最广泛的浏览器。


    浏览器和搜索引擎的区别在于：浏览器用于访问和显示网站，而搜索引擎用于搜索网站。例如，你可以使用 Internet Explorer 浏览器在雅虎的搜索引擎上进行搜索。


    在 1990 年代中期，还没有谷歌，因此，在谷歌 Chrome 之前，最受欢迎的浏览器是 Netscape Navigator。JavaScript 由布兰登·艾奇于
    1995 年创建，他当时在 Netscape 工作。


    Java 是当时流行的一种编程语言，现在仍然是——它也是 JavaScript 的灵感来源之一。但需要明确的是，Java 和 JavaScript 是两种完全不同的编程语言。由于当时
    Java 正在被大力推广，Netscape 将这种新的脚本语言命名为 JavaScript。

