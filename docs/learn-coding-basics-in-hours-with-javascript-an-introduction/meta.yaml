    \ that describe its behavior could be: accelerate, decelerate, turn right, turn\
    \ left, etc. In computers, objects are parts of computer programs and share a\
    \ similarity to real life objects: they have a state and behavior.\n\nLet’s look\
    \ at a further example: an application might work with a “Customer” object. Again,\
    \ the state of an object would be the characteristics and attributes of the object.\
    \ The behavior would be what the object could do. In our example, the “Customer”\
    \ object could have states like “active” or “deleted.” It could have behavior\
    \ like “Upgrade Rewards Level” or “Add to Family Account.”\n\nObjects are one\
    \ of the first subjects you think about when designing a program. An object is\
    \ something on a computer that you can click on, interact with, move around, etc.\
    \ It can also be something behind the scenes that is made up of data and procedures\
