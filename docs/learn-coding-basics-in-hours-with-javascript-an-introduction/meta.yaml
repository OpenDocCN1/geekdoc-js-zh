  md: 'The "\" (backslash) symbol separates the different parts of a collection of
    electronic documents in computers and it has been used for a long time. It was
    created as an aid to organizing and finding the various files you might store
    on a computer.


    In a file path, backslashes are used to show that one item is below another (in
    terms of hierarchy).


    A hierarchy refers to arranging things according to rank or status. It refers
    to arranging items according to their relative importance or characteristics.
    Storage hierarchy refers to a system where various data storage devices are given
    a hierarchical importance ranking as far as how they are used. The primary factor
    influencing a given device''s ranking is its response time – how long the device
    takes to return a requested piece of stored data when the computer requests the
    data. Faster response times are ranked higher.


    In a file path, the item on the left is "above" the one on the right. If we take
    our earlier example, the file path would be written as:


    ```

    C:\Poems\Winter

    ```


    To prepare for the next assignment, download an image of your choosing (ensure
    to save it in your Downloads folder).


    Written documents, pictures and videos are examples of different types of file
    formats. The data in these files is organized in a specific way, usually based
    on how the data will be used by various processes the computer does.


    For example, the data in a file that is a written document will be organized in
    a very different way than the data in a file that is a video.


    A common file format is "PDF". This stands for "Portable Document Format". This
    is a file format developed by the software company Adobe in the 1990s. This file
    format was developed to ensure consistent display of files regardless of what
    computer they''re being displayed on.


    File formats are indicated by their extension. The extension is a code that states
    what the file format is (text, image, video, etc.). Extensions are tacked on at
    the end of the file''s name.


    Let''s say you have a file entitled "Contract" and it''s stored as a PDF; the
    file would be named "Contract.pdf" – .pdf is the extension.


    Another common file format and extension is ".txt" (short for "text file"). This
    is a file type that is pure, unformatted (no special design; plain) text. If you''ve
    ever used Notepad, it saves and runs .txt files.'
