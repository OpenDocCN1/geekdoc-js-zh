    \ Mandela\n```\n\nThe output of this code would look like this:\n\n> \"Education\
    \ is the most powerful weapon which you can use to change the world.\"\n> -Nelson\
    \ Mandela\n\n### ELEMENTS\n\nThe tags and the code written between them are called\
    \ \"elements.\" Here is a diagram that shows this:\n\n![](img/33a81fac26246d29975692e5ecda6e53_50_0.png)\n\
    \nIn this chapter, we will be writing HTML and JavaScript together. That way,\
