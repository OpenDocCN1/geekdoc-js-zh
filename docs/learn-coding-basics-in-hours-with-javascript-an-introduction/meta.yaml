    # ONLINE IMAGES


    A Uniform Resource Locator (URL) is a unique name for a web resource. A "web resource"
    is an identifiable thing that can be found on the internet. The most common example
    of a URL is a website – https://www.google.com is a URL.


    An attribute is a word or phrase used inside an element''s opening tag that controls
    the element''s behavior.


    For example, the image <img> tag allows you to place images inside your webpage.
    The src (source) attribute is used with this <img> tag and it gives the location
    of the image (where the image is being displayed from).


    You can see this in the following:


    ```

    <img src="https://www.petmd.com/sites/default/files/petmd-cat-happy-15.jpg">

    ```


    In this code, the image tag tells the browser where to put the image on the page,
    while the src attribute gives the location to pull the image from. You can pull
    (use) images from online or from your computer. In the code above, we are pulling
    the image from online.'
