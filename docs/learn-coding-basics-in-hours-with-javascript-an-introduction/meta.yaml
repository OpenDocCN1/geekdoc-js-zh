  md: "# # CHAPTER FOURTEEN\nVARIABLES AND STRINGS\n\nA common action in coding is\
    \ to assign variables. Variables are key in every programming language. We defined\
    \ the term earlier, and to put the definition simply: it’s a value that can be\
    \ altered, depending on conditions or data passed to the program.\n\nIn mathematics,\
    \ an operator is a symbol used to carry out a computation (that act of figuring\
    \ out the amount of something using math). There are several different kinds of\
    \ operators. Arithmetic operators, such as:\n\n+   - + (add),\n- - (subtract),\n\
    - / (divide), and\n- * (multiply)\n\nare used to perform math operations.\n\n\
    # ## ASSIGNMENT OPERATOR\n\nIn JavaScript, the assignment operator is “=”; it\
    \ is used to assign value to a variable.\n\nFor example, to say that X = 10 in\
    \ JavaScript, we are assigning the variable “X” the value “10.”\n\nLet’s assign\
    \ a variable in JavaScript. Delete your old code and write the following:\n\n\
    ```\n<!DOCTYPE HTML>\n<html>\n    <body>\n        <script>\n            var X\
    \ = \"Hello, world!\";\n            document.write(X);\n        </script>\n  \
    \  </body>\n</html>\n```\n\nSave and execute this code. We assigned variable X\
    \ to the string value “Hello, world!”\n\n# ## CREATING A STRING\n\nThere are some\
    \ characters and functions that cannot easily be put within quotes when writing\
    \ strings in JavaScript."
  merge: -1
  pgno: 59
- img_proc: true
  md: "For example, what if you wanted to display: Sally said, \"I don't want to go\"\
    ? You not only have additional quotation marks around Sally's statement, but you\
    \ also have the single quote (apostrophe) within “don't.”\n\nThe solution to this\
    \ problem is to add a backslash (\\) – this is referred to as “escaping” the character\
    \ and tells the computer that the character that follows has a special meaning.\
    \ For example: \\‘ or \\\" means that the quote mark(s) following the backslash\
    \ will not end the string but instead will be printed on the screen.\n\nAlso,\
    \ if you want to start a new line, you can use the HTML `<br>` tag, which is like\
    \ pressing Enter. This means “line break.” A line break literally creates a new\
    \ line of text – again, like pressing Return/Enter on your keyboard.\n\nLet's\
    \ try this out. Delete your previous HTML/JavaScript code and write this code:\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n<body>\n    <script>\n    document.write(\"Sally\
    \ said, \\\"I don't want to go\\\"\");\n    </script>\n</body>\n</html>\n```\n\
    \nSave and execute your code. We have successfully displayed quotation marks and\
    \ an apostrophe!\n\nWait a second... What do you do if you need to display a backslash\
    \ in your code? Simple, write two of them!: \\\\\n\n# CONCATENATING A STRING\n\
    \nConcatenate means to connect items together, like links in a chain. It means\
    \ to take one piece of data and stick it on the end of another piece of data.\
    \ For example, concatenating the string “dev” and the string “ices” makes the\
    \ text “devices.”\n\nTo concatenate a string in JavaScript, you use the + operator."
