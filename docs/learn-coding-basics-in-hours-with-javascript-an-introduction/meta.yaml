    \ on a condition.\n\nThe syntax of this is:\n\n```\nName_of_variable = (condition)\
    \ ? Value_1:Value_2\n```\n\nThe ternary operator is “?”. Write this code:\n\n\
    ```\n<!DOCTYPE html>\n<html>\n    <body>\n        <script>\n            document.write(Bigger\
    \ = (5 > 1) ? \"The number on the left is bigger\" : \"The number on the right\
    \ is bigger\");\n        </script>\n    </body>\n</html>\n```\n\nSave and execute\
    \ your code.\n\nIn this code, we said, “If it is true that 5 is bigger than 1,\
    \ display “The number on the left is bigger.” If you change the numbers or flip\
    \ the symbol to <, you can change the outcome of your code.\n\nInput is a command\
    \ that has the user input data. It allows users to type in information within\
    \ your program."
- md: "## CHAPTER TWENTY FOUR\nOBJECT-ORIENTED PROGRAMMING\n\nAs we covered earlier,\
    \ objects are items within computer programs that have both state and behavior.\
    \ The state of an object could be the weight, color, height, etc. While the behavior\
    \ of an object would be what the object does – the actions it takes – such as\
    \ jump, run, sit, etc.\n\nObject-oriented is an approach to programming that focuses\
    \ on objects and data (as opposed to consecutive actions or some other approach).\n\
    \nYou create objects by creating what are called “classes,” using one of the many\
    \ specialized computer programming languages. Classes are used to describe one\
    \ or more objects. This would be created by creating (or “declaring”) a class\
    \ called a “Customer” class. It is important to know that when you first create\
    \ this class, you are describing the POTENTIAL characteristics and behavior of\
    \ that TYPE of thing. You will still need to create an actual one of those things.\
    \ That process is called “creating an INSTANCE” of the class, where “instance”\
    \ means “an actual one” of the things described when you declared the class. When\
    \ you do this, the data that makes up the object is kept in the computer’s memory.\n\
    \nFor example, in a computer program designed to track pay records for all employees,\
    \ you could have a class called “Employee.” Each program element representing\
    \ an actual employee (John Smith, Sally Jackson, etc.) would be an instance of\
    \ the “Employee” class. You would have one instance for each employee you entered\
    \ into the computer. Each time you created an “employee” object, the computer\
    \ would first find the “employee” class, then use the definition of that class\
    \ in creating that particular “employee” instance using the data for the actual\
    \ employee.\n\n![](img/33a81fac26246d29975692e5ecda6e53_97_0.png)\n\nBelow is\
    \ something more elaborate that we can do with ternary operators:. Write this\
    \ code:\n\n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <p>Riders must\
    \ be at least 52 centimeters tall to ride.</p>\n        <input id=\"Height\" value=\"\
    52\" />\n        <button onclick=\"Ride_Function()\">Click here</button>\n   \
    \     <p id=\"Ride\"></p>\n        <script>\n        function Ride_Function()\
    \ {\n            var Height, Can_ride;\n            Height = document.getElementById(\"\
    Height\").value;\n            Can_ride = (Height < 52) ? \"You are too short\"\
    :\"You are tall enough\";\n            document.getElementById(\"Ride\").innerHTML\
    \ = Can_ride + \" to ride.\";\n        }\n        </script>\n    </body>\n</html>\n\
    ```\n\nSave and execute your code.\n\n### END OF CHAPTER CHALLENGE\n\nWrite a\
    \ program that includes the following:\n\n- A ternary operator, and\n- The input\
    \ command.\n\n## CONSTRUCTORS\n\nA \"constructor\" is a special part of a class\
    \ (a template for defining an object [item with state and behavior]).\n\nThe constructor\
    \ is a special part of the class that describes the default state of any new instance\
    \ of the class that gets created. In other words, it gives default values for\
    \ the properties of the class.\n\nFor example, let's say you had a class called\
    \ \"Customer.\" The computer code to create the \"customer\" class might look\
    \ something like this:\n\n```javascript\nclass Customer\n{\n    string FullName;\n\
    \    Boolean Active;\n}\n```\n\nNow let's say that whenever you created a new\
    \ instance of the \"customer\" class, you wanted it to be an active customer –\
    \ in other words, you wanted the property \"Active\" to be set to \"true\".\n\n\
    To do this, you would make a constructor for the \"customer\" class. It would\
    \ be a small subprogram, inside the class, that would be used every time an instance\
    \ of the \"customer\" class was created.\n\nThe constructor might look something\
    \ like this:\n\n```javascript\nCustomer(string name) {\n    Fullname = name;\n\
    \    Active = true;\n}\n```\n\nThe entire class would look like this:\n\n```javascript\n\
    class Customer\n{\n    string FullName;\n    Boolean Active;\n    Customer(string\
    \ name){\n        Fullname = name;\n        Active = true;\n    }\n}\n```\n\n\
    The constructor would be used by asking for an instance of the “customer” class\
    \ to be created and passing along the desired name of the customer.\n\nThe call\
    \ to create the instance of the class would look like this:\n\n```javascript\n\
    Customer cust = new Customer(\"Brenda Smith\");\n```\n\nThis creates a new instance\
    \ of the “customer” class using the constructor inside the class. The constructor\
    \ uses the string “Brenda Smith” that it was given to set the value of the property\
    \ “FullName” and uses the instruction in the constructor to set the property “Active”\
    \ to “true.”\n\nThe new instance of the “customer” class, which is the variable\
    \ “cust” here, will, therefore, have the properties:\n\n```javascript\nFullName\
    \ = \"Brenda Smith\";\nActive = true;\n```\n\nNote: The above code is given as\
    \ an example and is not meant to be executed. We will create a constructor soon.\n\
    \n## KEYWORDS\n\nAs discussed earlier, JavaScript keywords identify actions to\
    \ be performed. For example, var is a keyword we use to assign variables.\n\n\
    An important aspect to keywords is that they cannot be used to name variables\
    \ or functions. For example: you can’t say var var = “variable”.\n\nAnother type\
    \ of keyword is the “new” keyword, which is used to create new objects.\n\nWe\
    \ also have the “this” keyword. The “this” keyword indicates the object that is\
    \ the owner of the code. When used within an object, the value of “this” is the\
    \ object. When used with a function, the value of “this” is the object that possesses\
    \ the function.\n\nNow we just covered a lot of information about constructors,\
    \ the “new” keyword, the “this” keyword”, and more. Let’s put this all to use.\n\
    \nWrite the following code within an HTML file:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n    <body>\n        <p id=\"Keywords_and_Constructors\"></p>\n       \
    \ <script>\n            function Vehicle(Make, Model, Year, Color) {\n       \
    \         this.Vehicle_Make = Make;\n                this.Vehicle_Model = Model;\n\
    \                this.Vehicle_Year = Year;\n                this.Vehicle_Color\
    \ = Color;\n            }\n            var Jack = new Vehicle(\"Dodge\", \"Viper\"\
    , 2021, \"Red\");\n            var Emily = new Vehicle(\"Jeep\", \"Trail Hawk\"\
    , 2020, \"White and B...\");\n            var Erik = new Vehicle(\"Ford\", \"\
    Pinto\", 1971, \"Mustard\");\n            document.getElementById(\"Keywords_and_Constructors\"\
    ).innerHTML =\n                \"Erik drives a \" + Erik.Vehicle_Color + \"-colored\
    \ \" + Erik.Vehicle_Model\n                + \" manufactured in \" + Erik.Vehicle_Year;\n\
    \        </script>\n    </body>\n</html>\n```\n\nSave and execute your code. This\
    \ should print the following string:\n\nErik drives a Mustard-colored Pinto manufactured\
    \ in 1971\n\nLet’s inspect our code. The function “Vehicle()” is an object constructor.\n\
    \n## RESERVED WORDS\n\nIn JavaScript, there are certain words you can’t use as\
    \ variables, labels (names assigned to sections of code), or functions. Examples\
    \ of reserved words are: “true” and “false.”\n\nIf you’re interested, here is\
    \ a link to a list of the reserved words in JavaScript:\n\nw3schools.com/js/js_reserved.asp\n\
    \nThe reason you cannot use these words is that they already mean something else\
    \ – they are reserved for JavaScript.\n\n### END OF CHAPTER CHALLENGE\n\nWrite\
    \ a program that includes the following:\n\n- A class,\n- A constructor,\n- The\
    \ “new” keyword, and\n- The “this” keyword.\n\n## CHAPTER TWENTY FIVE\nIDENTIFIERS\
    \ AND LITERALS\n\nAn “identifier” is a name for something. In JavaScript, identifiers\
    \ are the names of variables, functions, keywords, and labels. In the following\
    \ code, “X” is the identifier:\n\n```javascript\nvar X = 10\n```\n\nIn contrast\
    \ to an identifier, a literal is something that represents a value within source\
    \ code. Source code is the version of a computer program as it is originally written\
    \ (i.e., typed into a computer in some programming language) by the designer of\
    \ the program. Normally, when the programmer is done making the program, she has\
    \ the computer convert the code she wrote the program in (the “source code”) to\
    \ another format that is easier and faster for the computer to use. In that new\
    \ format, the program can’t be easily understood by people – but it is very useful\
    \ to the computer. It also can’t be modified by other programmers at that point.\n\
    \nLook at this code:\n\n```javascript\nvar X = 10\nvar Y = “Charlie”\n```\n\n\
    The 10 is the integer (whole number) literal, Charlie is the string literal, and\
    \ “X” and “Y” are the identifiers.\n\nA literal is the data exactly as it is meant\
    \ to be processed. Whereas an identifier is a name, the literal is the value itself.\n\
    \n## NESTED FUNCTIONS\n\nNested refers to something contained within something\
    \ else. This can be a program within a program or a set of instructions inside\
    \ another set of instructions.\n\nSometimes the subprogram needs some information\
    \ from the main program in order to perform its tasks. When the subprogram is\
    \ created, its description might include this information. That information is\
    \ called the “parameters” of the subprogram.\n\nThe parameters of the nested entity\
    \ are explained within the larger (and enveloping) entity. It’s nested because\
    \ it is placed inside something else.\n\nFor example, a nested procedure would\
    \ be a set of commands that is contained within a larger procedure."
  mdcn: "\n## 第二十四章\n面向对象编程\n\n正如我们之前所介绍的，对象是计算机程序中同时具有状态和行为的项目。对象的状态可以是重量、颜色、高度等。而对象的行为则是对象所做的事情——它所采取的动作——例如跳跃、跑步、坐下等。\n\
    \n面向对象是一种专注于对象和数据的编程方法（与连续动作或其他方法相对）。\n\n你通过创建所谓的“类”来创建对象，这需要使用众多专业计算机编程语言中的一种。类用于描述一个或多个对象。例如，可以通过创建（或“声明”）一个名为“Customer”的类来实现。需要了解的重要一点是，当你首次创建这个类时，你描述的是该类事物的**潜在**特性和行为。你仍然需要创建一个实际的事物实例。这个过程被称为创建类的“实例”，其中“实例”指的是你声明类时所描述事物的一个“实际存在”。当你这样做时，组成对象的数据将被存储在计算机的内存中。\n\
    \n例如，在一个旨在跟踪所有员工薪资记录的计算机程序中，你可以有一个名为“Employee”的类。每个代表实际员工（John Smith、Sally Jackson\
    \ 等）的程序元素都将是“Employee”类的一个实例。你为输入到计算机中的每个员工创建一个实例。每次你创建一个“employee”对象时，计算机首先会找到“employee”类，然后使用该类的定义，利用实际员工的数据来创建这个特定的“employee”实例。\n\
    \n![](img/33a81fac26246d29975692e5ecda6e53_97_0.png)\n\n下面是一个我们可以使用三元运算符完成的更复杂的示例：。编写以下代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <p>Riders must be at least\
    \ 52 centimeters tall to ride.</p>\n        <input id=\"Height\" value=\"52\"\
    \ />\n        <button onclick=\"Ride_Function()\">Click here</button>\n      \
    \  <p id=\"Ride\"></p>\n        <script>\n        function Ride_Function() {\n\
    \            var Height, Can_ride;\n            Height = document.getElementById(\"\
    Height\").value;\n            Can_ride = (Height < 52) ? \"You are too short\"\
    :\"You are tall enough\";\n            document.getElementById(\"Ride\").innerHTML\
    \ = Can_ride + \" to ride.\";\n        }\n        </script>\n    </body>\n</html>\n\
    ```\n\n保存并执行你的代码。\n\n### 章节挑战\n\n编写一个包含以下内容的程序：\n\n-   一个三元运算符，以及\n-   输入命令。\n\
    \n## 构造函数\n\n“构造函数”是类的一个特殊部分（类是定义对象[具有状态和行为的项目]的模板）。\n\n构造函数是类的一个特殊部分，它描述了创建该类任何新实例的默认状态。换句话说，它为类的属性提供了默认值。\n\
    \n例如，假设你有一个名为“Customer”的类。创建“customer”类的计算机代码可能如下所示：\n\n```javascript\nclass Customer\n\
    {\n    String FullName;\n    Boolean Active;\n}\n```\n\n现在，假设每当你创建一个新的“customer”类实例时，你都希望它是一个活跃的客户——换句话说，你希望将属性“Active”设置为“true”。\n\
    \n为此，你需要为“customer”类创建一个构造函数。它将是一个位于类内部的小型子程序，在每次创建“customer”类的实例时都会被使用。\n\n构造函数可能如下所示：\n\
    \n```javascript\nCustomer(string name) {\n    FullName = name;\n    Active = true;\n\
    }\n```\n\n整个类将如下所示：\n\n```javascript\nclass Customer\n{\n    String FullName;\n\
    \    Boolean Active;\n    Customer(string name){\n        FullName = name;\n \
    \       Active = true;\n    }\n}\n```\n\n构造函数通过请求创建一个“customer”类的实例并传入客户所需的名称来使用。\n\
    \n创建类实例的调用将如下所示：\n\n```javascript\nCustomer cust = new Customer(\"Brenda Smith\"\
    );\n```\n\n这使用类内部的构造函数创建了一个新的“customer”类实例。构造函数使用传入的字符串“Brenda Smith”来设置属性“FullName”的值，并使用构造函数中的指令将属性“Active”设置为“true”。\n\
    \n因此，“customer”类的新实例（此处为变量“cust”）将具有以下属性：\n\n```javascript\nFullName = \"Brenda\
    \ Smith\";\nActive = true;\n```\n\n注意：以上代码仅作为示例给出，无需执行。我们很快就会创建一个构造函数。\n\n## 关键字\n\
    \n如前所述，JavaScript 关键字用于标识要执行的操作。例如，var 是我们用来声明变量的关键字。\n\n关键字的一个重要方面是它们不能用于命名变量或函数。例如：你不能写\
    \ `var var = \"variable\"`。\n\n另一种类型的关键字是“new”关键字，用于创建新对象。\n\n我们还有“this”关键字。“this”关键字指示代码所属的对象。当在对象内部使用时，“this”的值就是该对象本身。当与函数一起使用时，“this”的值是拥有该函数的对象。\n\
    \n现在我们刚刚涵盖了大量关于构造函数、“new”关键字、“this”关键字等的信息。让我们把这些知识都运用起来。\n\n在 HTML 文件中编写以下代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <p id=\"Keywords_and_Constructors\"\
    ></p>\n        <script>\n            function Vehicle(Make, Model, Year, Color)\
    \ {\n                this.Vehicle_Make = Make;\n                this.Vehicle_Model\
    \ = Model;\n                this.Vehicle_Year = Year;\n                this.Vehicle_Color\
    \ = Color;\n            }\n            var Jack = new Vehicle(\"Dodge\", \"Viper\"\
    , 2021, \"Red\");\n            var Emily = new Vehicle(\"Jeep\", \"Trail Hawk\"\
    , 2020, \"White and B...\");\n            var Erik = new Vehicle(\"Ford\", \"\
    Pinto\", 1971, \"Mustard\");\n            document.getElementById(\"Keywords_and_Constructors\"\
    ).innerHTML =\n                \"Erik drives a \" + Erik.Vehicle_Color + \"-colored\
    \ \" + Erik.Vehicle_Model\n                + \" manufactured in \" + Erik.Vehicle_Year;\n\
    \        </script>\n    </body>\n</html>\n```\n\n保存并执行你的代码。这应该会打印出以下字符串：\n\nErik\
    \ drives a Mustard-colored Pinto manufactured in 1971\n\n让我们检查一下我们的代码。函数“Vehicle()”是一个对象构造函数。\n\
    \n## 保留字\n\n在 JavaScript 中，某些词语不能用作变量、标签（分配给代码段的名称）或函数。保留字的例子有：“true”和“false”。\n\
    \n如果你感兴趣，这里有一个链接列出了 JavaScript 中的保留字：\n\nw3schools.com/js/js_reserved.asp\n\n\
    你不能使用这些词语的原因是它们已经有其他含义——它们是为 JavaScript 保留的。\n\n### 章节挑战\n\n编写一个包含以下内容的程序：\n\n\
    -   一个类，\n-   一个构造函数，\n-   “new”关键字，以及\n-   “this”关键字。\n\n## 第二十五章\n标识符与字面量\n\n\
    “标识符”是某个事物的名称。在 JavaScript 中，标识符是变量、函数、关键字和标签的名称。在下面的代码中，“X”是标识符：\n\n```javascript\n\
    var X = 10\n```\n\n与标识符相反，字面量是在源代码中表示一个值的实体。源代码是计算机程序由其设计者最初编写（即用某种编程语言输入到计算机中）的版本。通常，当程序员完成程序编写后，她会让计算机将她编写程序所用的代码（“源代码”）转换为另一种格式，这种格式对计算机来说更容易且使用更快。在那种新格式中，程序无法被人类轻易理解——但它对计算机非常有用。在那时，它也无法被其他程序员修改。\n\
    \n看看这段代码：\n\n```javascript\nvar X = 10\nvar Y = \"Charlie\"\n```\n\n10 是整数字面量，Charlie\
    \ 是字符串字面量，而“X”和“Y”是标识符。\n\n字面量是按照其预期处理方式呈现的数据。而标识符是一个名称，字面量则是值本身。\n\n## 嵌套函数\n\
    \n“嵌套”指的是某些东西被包含在其他东西内部。这可以是一个程序中的程序，或者一组指令位于另一组指令内部。\n\n有时子程序需要从主程序获取一些信息才能执行其任务。当子程序被创建时，它的描述可能包含此信息。该信息被称为子程序的“参数”。\n\
    \n嵌套实体的参数在更大（且包含它）的实体内部进行解释。它之所以是嵌套的，是因为它被放置在其他东西内部。\n\n例如，一个嵌套的过程将是一组包含在更大过程中的命令。\n"
