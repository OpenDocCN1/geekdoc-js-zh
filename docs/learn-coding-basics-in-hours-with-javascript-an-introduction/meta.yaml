    \ 函数就是嵌套函数。\n\n## 作用域\n\n在编程中，代码可以有“作用域”。简单来说，作用域就是你可以访问的函数、变量和对象。作用域可以是有限的。变量的作用域取决于它是否可以被程序中的一个、多个或所有函数访问。变量的作用域可以是“局部”或“全局”。\n\
    \n在 JavaScript 中，全局变量可以从程序内的任何函数访问，而局部变量只能被赋值给它的函数访问。\n\n全局变量在函数外部声明，而局部变量在函数内部声明。\n\
    \n全局变量可以按如下方式编写（编写此代码）：\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n        <script>\n\
    \            var X = 10;\n            function Add_numbers_1() {\n           \
    \     document.write(20 + X + \"<br>\");\n            }\n            function\
    \ Add_numbers_2() {\n                document.write(X + 100);\n            }\n\
    \            Add_numbers_1();\n            Add_numbers_2();\n        </script>\n\
    \    </body>\n</html>\n```\n\n保存并执行你的代码。应该会返回 \"30\" 和 \"110\"。变量 `X` 在我们的函数外部被赋值为\
    \ 10，但我们仍然可以访问它。因此，以上是全局变量的一个例子。提醒一下，`<br>` 是换行标签，用于在文本中创建换行（就像在键盘上按回车键一样）。\n\n\
    现在，让我们尝试一个局部变量。编写以下代码：\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n        <script>\n\
    \            function Add_numbers_1() {\n                var X = 10;\n       \
    \         document.write(20 + X + \"<br>\");\n            }\n            function\
    \ Add_numbers_2() {\n                document.write(X + 100);\n            }\n\
    \            Add_numbers_1();\n            Add_numbers_2();\n        </script>\n\
    \    </body>\n</html>\n```\n\n保存并执行你的代码。这次，它只返回 \"30\"，因为该变量是局部的——这意味着它是在函数 `Add_numbers_1`\
    \ 内部编写的，不能在该函数外部访问。\n\n假设你编写了上述代码，但不明白为什么 `Add_numbers_2` 没有显示结果。我们可以使用 `console.log()`\
    \ 来帮助调试代码。\n\n将你的代码更改为以下内容：\n\n```\n<!DOCTYPE html>\n<html>\n    <body>\n    \
    \    <script>\n            function Add_numbers_1() {\n                var X =\
