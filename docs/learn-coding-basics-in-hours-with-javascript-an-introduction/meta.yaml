  md: "Open your HTML file and write this code:\n\n```\n<!DOCTYPE HTML>\n<html>\n\
    \    <body>\n        <p>This is a paragraph!</p>\n    </body>\n</html>\n```\n\n\
    Save and execute your code. Good job! You created a paragraph.\n\n# IDs\n\n\"\
    Id\" is short for \"identification.\" One of the most popular attributes is the\
    \ id attribute.\n\nThe id attribute specifies a unique name for an HTML element.\n\
    \nFor example, you can assign a specific <p> element the id (name) \"paragraph\"\
    \ as follows:\n\n```\n<p id=\"paragraph\">This is some text.</p>\n```\n\nNow that\
    \ you have that id, you can reference (bring up; refer to) it in your code later.\n\
    \nYou will learn exactly how to do this and why it's useful shortly.\n\nIds are\
    \ specific and you can only utilize one id per element. For example, you cannot\
    \ assign the same <h1> element two different ids. As a note, the <h1>-<h6> elements\
    \ create headers (section heads) in HTML. <h1> is the largest font size, and it\
    \ gets smaller with each higher number (<h2>, <h3>, etc.). Also, you cannot use\
    \ the same id name for two different elements.\n\nFor example, this would be incorrect:\n\
    \n```\n<h2 id=\"heading\"></h2>\n<h3 id=\"heading\"></h3>\n```\n\nIds must be\
    \ specific to one element and cannot contain any spaces."
