    # # CHAPTER TWENTY SEVEN

    ## STRING METHODS


    JavaScript has string methods that allow you to perform tasks with strings.


    As covered earlier, programming languages have certain data types built into them.
    These built-in data types are the most basic data types in the programming language
    and are referred to as primitive data types. One of the key traits of a primitive
    data type is that it cannot be simplified any further. A primitive data type is
    a predefined type of data that is built into the language.


    There are five primitive data types in JavaScript – these are:


    +   1. String,

    2. Number,

    3. Boolean,

    4. Null, and

    5. Undefined.


    Everything else (non-primitive data types) are objects. Objects are created by
    the programmer, not predefined and built into the programming language.


    # ### CONCAT() METHOD


    The concat() method concatenates (connects) two or more strings. Write this code:


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Concatenate"></p>

    <script>

    var part_1 = "Hello ";

    var part_2 = "World ";

    var part_3 = "from ";

    var part_4 = "sentence.";

    var whole_sentence = part_1.concat(part_2, part_3, part_4);

    document.getElementById("Concatenate").innerHTML = whole_sentence;

    </script>

    </body>

    </html>

    ```


    Save and execute your code. It displays the sentence as a whole!


    # ### SLICE() METHOD


    The slice() method is a string method that extracts a section of a string and
    then returns the extracted section in a new string.'
- md: "## CHAPTER TWENTY EIGHT\n### NUMBER METHODS\n\nNumber methods assist you in\
    \ working with numbers in JavaScript. There are several number methods. One of\
    \ these is the `toPrecision()` method which returns a string as a number of a\
    \ specified length. Write this code:\n\n```html\n<!DOCTYPE html>\n<html>\n   \
    \ <body>\n        <p id=\"Precision\"></p>\n        <script>\n            var\
    \ X = 12938.3012987376112;\n            document.getElementById(\"Precision\"\
    ).innerHTML =\n                X.toPrecision(10);\n        </script>\n    </body>\n\
    </html>\n```\n\nSave and run your code. You should get \"12938.30130.\" There\
    \ are many number methods - the above two should give you an idea of how these\
    \ work.\n\n### END OF CHAPTER CHALLENGE\n\nYou will now be assigned some tasks\
    \ we haven't taught yet - research online for solutions:\n\n- 1. Utilize the `toFixed()`\
    \ method.\n- 2. Utilize the `valueOf()` method.\n\nHere is a helpful link: w3schools.com/js/js_number_methods.asp\n\
    \n## CHAPTER TWENTY NINE\n### FINAL CHALLENGE\n\nTo conclude this book, we're\
    \ going to put it all together by creating a timer that will countdown by seconds.\
    \ Here we go!\n\nFirst, replace any existing code in your editor with the following:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <p>How many seconds would\
    \ you like to set your alarm for?</p>\n        <input id=\"seconds\" value=\"\"\
    \ />\n        <button onclick=\"countdown()\">Click here</button>\n        <p\
    \ id=\"timer\"></p>\n    </body>\n</html>\n```\n\nThe idea here is that the user\
    \ will be asked how many seconds he/she would like to set the timer for. There\
    \ is an input box available where a value may be entered. A button is also created\
    \ so that when clicked, it will send the value out to be processed. The result\
    \ will be a displayed countdown timer.\n\nRemember that the input tag deals with\
    \ information that the user enters. The id \"seconds\" and the value \"\" are\
    \ associated with the JavaScript code that we'll see shortly.\n\nThe \"button\"\
    \ tag will create a button that, when clicked, will look in the JavaScript code\
    \ for the \"countdown()\" function. The result that the countdown function produces\
    \ will depend upon what the user submitted when he/she clicked the button we made.\n\
    \nThe tag with the id \"timer\" wants to know the result of the countdown function\
    \ so that it can display a timer for the user to see. It will retrieve this information\
    \ from the associated JavaScript.\n\nSo, let's take a look at the HTML code again,\
    \ but this time, with the addition of the JavaScript code:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n    <p>How many seconds would you like to set your alarm\
    \ for?</p>\n    <input id=\"seconds\" value=\"\" />\n    <button onclick=\"countdown()\"\
    >Click here</button>\n    <p id=\"timer\"></p>\n    <script>\n        function\
    \ countdown() {\n            var seconds = document.getElementById(\"seconds\"\
    ).value;\n\n            function tick() {\n                seconds = seconds -\
    \ 1;\n                timer.innerHTML = seconds;\n                setTimeout(tick,\
    \ 1000);\n                if(seconds == -1){\n                    alert(\"Time's\
    \ up!\");\n                }\n            }\n            tick();\n        }\n\
    \    </script>\n</body>\n</html>\n```\n\nYou'll notice right away that there are\
    \ two separate functions in our JavaScript code. In fact, the \"tick\" function\
    \ is sitting inside of the \"countdown\" function! As a reminder, this is called\
    \ \"nesting functions.\"\n\nThe countdown function is called just one time, and\
    \ it does only two things:\n\n- 1. It sets a variable named \"seconds\" to the\
    \ value that the user inputs.\n- 2. It creates and runs the tick function.\n\n\
    The tick function, on the other hand, has several steps to execute and will end\
    \ up repeating multiple times.\n\nImmediately after the countdown function has\
    \ received the input value from the user, the tick function begins laying out\
    \ its instructions. It's important to recognize that the tick function is not\
    \ actually being executed yet. It is simply letting its instructions be made known\
    \ in case the function ever actually needs to be used. Once the interpreter reads\
    \ the tick function, it steps out and sees the \"tick()\" instruction. Upon seeing\
    \ this function, the interpreter knows to immediately go back through the tick\
    \ function. However, this time, instead of simply reading the function, it is\
    \ actually going to run the function.\n\nTake a look at the variable \"seconds\"\
    \ within the tick function. It is taking the value \"seconds\" from the countdown\
    \ function and subtracting 1 from it. The reason that this value needs to be subtracted\
    \ by 1 is that each time this function runs, it will last one second (as we will\
    \ see), and we need the variable \"seconds\" to subtract 1 each time a second\
    \ goes by.\n\nRight after 1 second is subtracted from the user’s input the first\
    \ time through the tick function, that same number that has been subtracted by\
    \ 1 will now be displayed for the user to see. This happens because the `timer.innerHTML`\
    \ is being assigned this number. Remember how we put \"id=timer\" in one of our\
    \ HTML tags? That tag now holds this number that we assigned it.\n\nThe statement\
    \ \"`setTimeout(tick, 1000);`\" simply means that the program is pausing for 1,000\
    \ milliseconds (i.e., 1 second). This is important because this function is going\
    \ to potentially repeat multiple times – and every time it repeats, it needs to\
    \ do so for a duration of exactly one second.\n\nWe now have our conditional statement.\
    \ What it’s telling us is that if the user’s input ever counts all the way down\
    \ to -1, stop everything and run the alert box. You may be asking yourself, *Why\
    \ -1 instead of 0?* The reason is that when the interpreter sees -1, it hasn’t\
    \ actually displayed it to the user yet. The user is still seeing a 0. Therefore,\
    \ before the -1 is displayed, the alert box will show up, preventing any other\
    \ code from running. As a note, if the user clicks the OK button on the alert\
    \ box, he/she will see the timer continue to count down into the negatives.\n\n\
    Now, if the user’s input does not equal -1, the interpreter will simply step out\
    \ of the function like before. But wait; it’s going to run into that \"tick()\"\
    \ statement again! Exactly. Do you see how our function will continue to repeat\
    \ now? That is, until our conditional statement is met – wherein the alert box\
    \ is displayed.\n\nTry it out for yourself and don’t worry if you have to read\
    \ the code through several times before it really begins to sink in!\n\n### FINAL\
    \ CHALLENGE\n\nHere is your final assignment:\n\nThrough online research, find\
    \ out how to end the program (i.e., stop the countdown) when a user clicks the\
    \ OK button on the alert box.\n\n## CHAPTER THIRTY\n### CONGRATULATIONS!\n\nYou\
    \ have completed our book! Well done on your hard work and persistence!\n\nYou\
