    +   1) Ensure you understand all the words and terms being used – clear up any
    you don''t understand.


    2) Ensure your code is written exactly as laid out here. A small error in the
    code, such as a missing comma, can ruin the whole program. Code must be exact
    for programs to run properly, so always meticulously check your code for errors.


    3) Research online for solutions.


    4) You can also contact The Tech Academy and ask for assistance – learncodinganywhere.com


    # CHALLENGES


    At the end of some chapters, we will have an “END OF CHAPTER CHALLENGE.” These
