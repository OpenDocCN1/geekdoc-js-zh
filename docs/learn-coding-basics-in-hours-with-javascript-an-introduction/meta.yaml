  mdcn: "\n## 第二章\n计算机\n\n计算机的诞生是为了完成一项简单的任务：它们接收数据（信息），以某种方式处理数据，然后输出数据。仅此而已。\n\n\
    关于计算机，有几条不变的真理：\n\n1.  它们只是机器，并非人类。\n2.  它们由人类创造，只能在人类的指令下运作。即便如此，它们也只能执行人类事先设计并编入其中的动作。\n\
    \n计算机没有灵魂，也无法思考。计算机所做的一切都由人类预先设定。即使是所谓的“人工智能”（能够执行需要人类智能才能完成的动作的计算机系统，例如识别声音和图像），或能够“学习”的计算机，之所以具备这些能力，也仅仅是因为我们这样设计了它们。\n\
    \n作为机器，计算机具有以下一些特征：\n\n-   它们处理数据。数据就是信息——例如文字、符号（代表数量、概念或词语的书写内容）、图片等。\n-   它们遵循指令（输入其中以执行特定任务的命令）。\n\
    -   它们实现任务自动化（无需人类干预即可执行操作），这些任务若由人工执行可能耗时过长或过于枯燥。请记住，这些自动化操作是由人设计的。\n-   它们处理数据。“处理”意味着通过使用一套既定的（通常是常规的）程序来操作某物。当计算机显示“正在处理”这个词时，它实际上在说：“请稍等，我正在执行一些预设的程序。”处理指的是“对数据采取行动”。在文字中搜索并定位拼写错误就是“处理数据”的一个例子。\n\
    \n当计算机正在处理数据时，你有时会看到像这样的“进度条”（一个显示任务进行到何种程度的符号）：\n\n或者在处理数据时，你可能会看到这个符号：\n\n这个圆形符号被称为“旋转器”，因为它们最初的设计是尺寸会扩大和收缩——即符号会“跳动”。\n\
    \n> 计算机的目的在于接收数据、处理数据并输出数据。\n\n当计算机执行操作时，这被称为“执行”或“运行”。例如，你可以通过点击搜索按钮在互联网上运行搜索，或者通过按下键盘上的回车键来执行一条指令。\n\
    \n理解机器并非生命体这一点很重要。尽管它们能执行看似神奇的操作，但其产出的真正源头是人类。\n\n没有程序，计算机就没什么用处——那么，让我们来具体了解一下程序是什么。\n\
    \n## 第三章\n程序\n\n作为名词，代码是你输入到计算机中以创建程序的书面指令。\n\n程序是一系列输入到计算机中的书面指令，它使计算机执行一个或多个特定任务。例如，Microsoft®\
    \ Paint 就是一个可以在计算机上用于创建基础插图的程序。\n\n硬件指的是计算机的物理部件——可以触摸到的部分。“硬”意味着“坚固的”或“有形的”（能看见和触摸到），而“件”则指“被创造出来的东西”。\n\
    \n计算机屏幕、鼠标、打印机和键盘都是硬件。\n\n硬件的反义词是软件。软件只是“计算机程序”的另一个名称——指示计算机做什么的指令集。计算机游戏，如纸牌游戏，就是软件的例子。\n\
    \n计算机程序或软件的另一个词是“应用程序”。这些术语可以互换使用。不过，“应用”（应用程序的缩写）通常用来指移动设备（如手机）上的程序（应用程序；软件）。\n\
    \n“软件”这个词出现在20世纪60年代，目的是强调它与计算机硬件的区别。软件（程序；应用程序）是指令，而硬件则执行这些指令。\n\n安装程序意味着将其放入计算机中，以便该程序可以执行。\n\
    \n例如，你可以通过将数据从互联网传输到你的计算机来安装一个程序。在20世纪90年代，大多数软件都是通过盒装磁盘安装的，看起来像这样：\n\n创建程序的人被称为计算机程序员。他们也被称为编码员、软件开发人员、软件工程师和开发人员。这些职位名称都指的是同一回事。\n\
    \n程序是使用编程语言创建的，所以让我们来讨论一下编程语言。\n\n## 第四章\n编程语言\n\n语言是允许你通过书面和口头词语传递思想的交流系统。类似于人们使用的口头语言（如西班牙语和英语），也存在不同的语言可用于编写（创建）计算机程序——这些被称为编程语言或计算机语言。编程语言是词汇、短语和符号的组织系统，让你能够创建程序。\n\
    \n编程语言有许多不同的类型，每种语言的创建都是为了满足特定的目的。通常，一种语言的创建是为了使创建某些类型的计算机程序更加容易。\n\n例如，Python\
    \ 是一种流行的编程语言。使用 Python 这种计算机语言，你会这样告诉计算机在屏幕上显示“Hello, world!”：\n\n```python\n\
    print (“Hello, world!”)\n```\n\n这就是代码。所有的软件/应用程序/程序都由代码构成。作为用户（使用某物的人），你看不到代码。开发人员用来编写代码的三种最常见的程序类型是：\n\
    \n1.  **集成开发环境（IDE）**：IDE 是一套用于编写软件程序的编程工具。IDE 对计算机程序的创建有很大帮助。它通常将许多可用的工具整合到一个地方。本质上，IDE\
    \ 是帮助你制作软件的软件。\n\n    例如，科技公司 Microsoft 提供的 Visual Studio，就是众多可供软件开发人员使用的 IDE\
    \ 之一。\n\n    IDE 是开发人员最常用的编写代码的程序。\n\n2.  **文本编辑器**：文本编辑器是用于编写和编辑文本的程序。文本编辑器非常基础——这意味着文本通常是纯文本，没有效果。这在技术上不同于文字处理器，文字处理器是计算机上的一个程序，允许你创建、格式化（设计样式和布局）、修改和打印文档。虽然文本编辑器可以用来编写代码，但文字处理器不能。相反，文字处理器比文本编辑器具有更多的功能（执行更广泛操作的能力）。\n\
    \n    作为各自的示例，Microsoft Word（左图）是一个文字处理器，而 Notepad（右图）是一个文本编辑器。\n\n    在此处列出的三种用于编写代码的程序中，文本编辑器是最不流行且最不推荐使用的。\n\
    \n3.  **代码编辑器**：顾名思义，这是一个可以用来编写/编辑代码的程序。代码编辑器在功能（内置于应用程序中的功能）方面介于 IDE 和文本编辑器之间——它们的功能比\
    \ IDE 少，但比文本编辑器多。最受欢迎的代码编辑器之一是 Notepad++（加加）。\n\n    例如，流行的 IDE Visual Studio\
    \ 有一个名为“LiveShare”的功能，允许开发人员在编写代码时与他人共享。其他开发人员甚至可以在 Visual Studio 中使用 LiveShare，从另一台计算机访问和编辑你的代码！这个功能在代码编辑器\
    \ Notepad++ 中并不包含。\n\n    另一方面，Notepad++ 有一个很酷的功能叫做“自动完成”，它可以为你输入的代码建议各种完成选项。例如，当你输入\
    \ *pr* 时，自动完成可能会建议 *print*。这个功能在文本编辑器 Notepad 中不存在。\n"
