    \ matter and those who matter don\\'t mind.\"\n        + \"-Dr. Seuss\");\n  \
    \  </script>\n</body>\n</html>\n```\n\nSave and execute your code. Something is\
    \ not quite right... We are missing a space between \"feel,\" and \"because.\"\
    \n\nTo fix this, simply add a space before \"because\" as follows:\n\n`\" + \"\
    because those who mind don't matter and those who matter don\\'t mind.\" +\"`\n\
    \nSave and execute your code. Now it displays correctly!\n\n## MULTIPLE VARIABLES\n\
    \nYou can also assign multiple variables in one statement. Write this code:\n\n\
    ```html\n<!DOCTYPE HTML>\n<html>\n<body>\n    <script>\n        var Family = \"\
    The Arezzinis\", Dad = \"Jeremiah\",\n            Mom = \"Hermoine\", Daughter\
    \ = \"Penny\", Son = \"Zorro\";\n        document.write(Dad);\n    </script>\n\
    </body>\n</html>\n```\n\nSave and run your code. You assigned multiple variables\
    \ and then displayed one.\n\n## STR.FONTCOLOR(\"\");\n\nA cool thing we can do\
    \ with our strings is change the font color using the str.fontcolor method.\n\n\
    Open a Notepad++ document and write this code:\n\n```html\n<!DOCTYPE HTML>\n<html>\n\
    <body>\n    <script>\n        var blues = \"I have the blues.\";\n        var\
    \ blues = blues.fontcolor(\"blue\");\n        document.write(blues);\n    </script>\n\
    </body>\n</html>\n```\n\nSave and execute your code. We created a variable that\
    \ was a string called “blues.” We assigned that variable the color blue and then\
    \ displayed it. See how that works?\n\n## END OF CHAPTER CHALLENGE\n\nWrite a\
    \ program that includes the following:\n\n-   Assign multiple variables and display\
    \ one utilizing the document.write() method, and\n-   Create a string, concatenate\
    \ a string and change the string’s font color.\n\n# CHAPTER FIFTEEN\n## EXPRESSIONS\
    \ AND STATEMENTS\n\nExpressions are numbers, symbols, and operators grouped together\
    \ that show the amount of something. Basically, an expression is a written math\
    \ problem.\n\nIn computers, an expression is a combination of values that are\
    \ computed by the computer. There are different ways to write out expressions,\
    \ depending on which language you are programming in.\n\nFor example, Name = \"\
    What person types in the name box\" could be an expression. Also, x + 5 is an\
    \ expression.\n\nAs a reminder, statements are computer instructions. These are\
    \ the instructions that are used by people as they create computer programs. The\
    \ simplest of these might be things like \"print,\" \"delete,\" \"add,\" \"multiply,\"\
    \ etc.\n\nFor example, the \"print\" statement tells your computer to print whatever\
    \ text you typed as part of the command.\n\nIn JavaScript, expressions and statements\
    \ are different things. An expression results in a value, while a statement performs\
    \ a task – a program is basically a series of statements.\n\nThere are basically\
    \ two types of expressions:\n\n1.  Ones that have a value (or result in a value),\
    \ and\n2.  Those that assign a value to a variable.\n\nThe following JavaScript\
    \ code is an expression:\n\n```\n3 + 3\n```\n\nNow, consider the following:\n\n\
    ```\ndocument.write(3 + 3);\n```\n\nThis is a statement. Within this statement,\
    \ the expression 3 + 3 is contained.\n\nLet’s write a statement. Open your HTML\
    \ file and write this code:\n\n```html\n<!DOCTYPE HTML>\n<html>\n<body>\n    <script>\n\
    \        document.write(1 + 1);\n    </script>\n</body>\n</html>\n```\n\nSave\
    \ and execute your code. You just performed math with JavaScript and displayed\
    \ the result!\n\n## END OF CHAPTER CHALLENGE\n\nComplete the following:\n\n- \
    \  Write your own statement and ensure it displays a result.\n\n# CHAPTER SIXTEEN\n\
    ## FUNCTIONS\n\nA JavaScript function is a repeatable block of code that executes\
    \ certain actions and performs tasks. You execute a function by calling it. This\
    \ is also called “invoking” the function.\n\n“Invoke” literally means to request\
    \ or ask for something. In coding, it is to cause something to be carried out\
    \ (performed).\n\nIn JavaScript, a keyword identifies actions to be performed.\
    \ There is a *function* keyword.\n\nEvery spoken language has a general set of\
    \ rules for how words and sentences should be structured. These rules are known\
    \ as the syntax of that particular language. In programming languages, syntax\
    \ serves the same purpose. Syntax is the rules you must follow when talking to\
    \ a computer and telling it what to do. There are many languages you can use to\
    \ program a computer. Each language has its own syntax. Failing to use the syntax\
    \ of a particular language correctly can mean that whatever you are designing\
    \ will not work at all.\n\nSyntax is the arrangement of words and phrases to create\
    \ well-formed sentences in a language. In computer science, it is the language\
    \ that allows the user to write out the program and the rules about how to write\
    \ code properly.\n\nThe syntax for writing a JavaScript function is: the keyword,\
    \ then the name, then parentheses.\n\nFunctions are valuable because of code reusability\
    \ – you can invoke functions over and over. Since functions in JavaScript contain\
    \ properties (state) and methods (behavior), they are basically objects.\n\nFunctions\
    \ are useful so you don’t have to keep retyping code; you can instead simply invoke\
    \ the function whenever needed.\n\nWe will write a function shortly, but first...\n\
    \n## <p> ELEMENT\n\nThe <p> element is used to create paragraphs."
  mdcn: "\n删除你的 HTML 文件中的代码，然后编写、保存并执行以下代码：\n\n```html\n<!DOCTYPE HTML>\n<html>\n\
    \    <body>\n        <script>\n            window.alert(\"Hello, world!\");\n\
    \        </script>\n    </body>\n</html>\n```\n\n干得好！你用内联 JavaScript 创建了一个弹出窗口。\n\
    \n## DOCUMENT.WRITE()\n\n你也可以使用 `document.write()` 方法在 JavaScript 中显示文本。删除你的 HTML\
    \ 文件中的代码，然后编写、保存并执行以下代码：\n\n```html\n<!DOCTYPE HTML>\n<html>\n    <body>\n   \
    \     <script>\n            document.write(\"Hello, world!\");\n        </script>\n\
    \    </body>\n</html>\n```\n\n如你所见，编程中执行操作有不止一种方法——一个问题可以有多个解决方案！\n\n## 本章挑战\n\
    \n编写一个包含以下内容的程序：\n\n-   创建一个包含文本和图片的网页，并在浏览器中成功运行它。\n-   使用一个外部 JavaScript 文件（即使用\
    \ `<script src=\"\">`）和 `document.write()` 来显示你选择的文本。\n\n# 第十四章\n## 变量和字符串\n\n\
    编程中的一个常见操作是赋值变量。变量在每种编程语言中都是关键。我们之前已经定义过这个术语，简单来说：它是一个可以根据条件或传递给程序的数据而改变的值。\n\n\
    在数学中，运算符是用于执行计算（通过数学计算出某个数量）的符号。有几种不同类型的运算符。算术运算符，例如：\n\n-   +（加），\n-   -（减），\n\
    -   /（除），和\n-   *（乘）\n\n用于执行数学运算。\n\n## 赋值运算符\n\n在 JavaScript 中，赋值运算符是“=”；它用于给变量赋值。\n\
    \n例如，在 JavaScript 中说 X = 10，我们就是在给变量 “X” 赋予值 “10”。\n\n让我们在 JavaScript 中给一个变量赋值。删除你的旧代码，编写以下内容：\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n    <body>\n        <script>\n           \
    \ var X = \"Hello, world!\";\n            document.write(X);\n        </script>\n\
    \    </body>\n</html>\n```\n\n保存并执行此代码。我们给变量 X 赋予了字符串值 “Hello, world!”\n\n## 创建字符串\n\
    \n在 JavaScript 中编写字符串时，有些字符和函数不容易放在引号内。\n\n例如，如果你想显示：Sally said, \"I don't want\
    \ to go\" 怎么办？你不仅有围绕 Sally 陈述的额外引号，还有 “don't” 中的单引号（撇号）。\n\n这个问题的解决方案是添加一个反斜杠（\\\
    ）——这被称为“转义”字符，并告诉计算机后面的字符具有特殊含义。例如：\\' 或 \\\" 表示反斜杠后面的引号不会结束字符串，而是会被打印在屏幕上。\n\n\
    另外，如果你想开始新的一行，你可以使用 HTML 的 `<br>` 标签，这就像按下回车键。它的意思是“换行”。换行会字面上创建一个新的文本行——再次强调，就像在键盘上按下\
    \ Return/Enter 一样。\n\n让我们来试试。删除你之前的 HTML/JavaScript 代码，编写以下代码：\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html>\n<body>\n    <script>\n        document.write(\"Sally said, \\\
    \"I don't want to go\\\"\");\n    </script>\n</body>\n</html>\n```\n\n保存并执行你的代码。我们已经成功显示了引号和撇号！\n\
    \n等一下……如果你需要在代码中显示反斜杠怎么办？很简单，写两个就行了：\\\\\n\n## 连接字符串\n\n连接意味着将项目连接在一起，就像链条中的环节。它意味着取一段数据并将其粘贴到另一段数据的末尾。例如，连接字符串\
    \ “dev” 和字符串 “ices” 就会得到文本 “devices”。\n\n在 JavaScript 中，你可以使用 + 运算符来连接字符串。\n\n\
    删除你的 JavaScript 代码，编写以下内容：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<body>\n    <script>\n\
    \        document.write(\"Be who you are and say what you feel.\"\n        + \"\
    because those who mind don't matter and those who matter don\\'t mind.\"\n   \
    \     + \"-Dr. Seuss\");\n    </script>\n</body>\n</html>\n```\n\n保存并执行你的代码。有些地方不太对劲……我们在\
    \ “feel,” 和 “because” 之间缺少一个空格。\n\n要解决这个问题，只需在 “because” 前添加一个空格，如下所示：\n\n`\"\
    \ + \"because those who mind don't matter and those who matter don\\'t mind.\"\
    \ +\"`\n\n保存并执行你的代码。现在它显示正确了！\n\n## 多个变量\n\n你也可以在一条语句中给多个变量赋值。编写以下代码：\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n<body>\n    <script>\n        var Family = \"The Arezzinis\"\
    , Dad = \"Jeremiah\",\n            Mom = \"Hermoine\", Daughter = \"Penny\", Son\
    \ = \"Zorro\";\n        document.write(Dad);\n    </script>\n</body>\n</html>\n\
    ```\n\n保存并运行你的代码。你给多个变量赋了值，然后显示了其中一个。\n\n## STR.FONTCOLOR(\"\");\n\n我们可以用字符串做的一个很酷的事情是使用\
    \ `str.fontcolor` 方法更改字体颜色。\n\n打开一个 Notepad++ 文档，编写以下代码：\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html>\n<body>\n    <script>\n        var blues = \"I have the blues.\"\
    ;\n        var blues = blues.fontcolor(\"blue\");\n        document.write(blues);\n\
    \    </script>\n</body>\n</html>\n```\n\n保存并执行你的代码。我们创建了一个名为 “blues” 的字符串变量。我们给那个变量分配了蓝色，然后显示了它。明白这是如何工作的了吗？\n\
    \n## 本章挑战\n\n编写一个包含以下内容的程序：\n\n-   给多个变量赋值，并使用 `document.write()` 方法显示其中一个，以及\n\
    -   创建一个字符串，连接一个字符串并更改字符串的字体颜色。\n\n# 第十五章\n## 表达式和语句\n\n表达式是组合在一起以显示某个数量的数字、符号和运算符。基本上，表达式就是一个写出来的数学问题。\n\
    \n在计算机中，表达式是由计算机计算的值的组合。根据你使用的编程语言，表达式有不同的书写方式。\n\n例如，Name = \"What person types\
    \ in the name box\" 可以是一个表达式。同样，x + 5 也是一个表达句。\n\n提醒一下，语句是计算机指令。这些是人们在创建计算机程序时使用的指令。其中最简单的可能是像“打印”、“删除”、“加法”、“乘法”等这样的操作。\n\
    \n例如，“打印”语句告诉你的计算机打印你作为命令一部分输入的任何文本。\n\n在 JavaScript 中，表达式和语句是不同的东西。表达式产生一个值，而语句执行一个任务——程序基本上就是一系列的语句。\n\
    \n基本上有两种类型的表达式：\n\n1.  那些具有值（或产生一个值）的表达式，以及\n2.  那些给变量赋值的表达式。\n\n以下 JavaScript\
    \ 代码是一个表达式：\n\n```\n3 + 3\n```\n\n现在，考虑以下内容：\n\n```\ndocument.write(3 + 3);\n\
    ```\n\n这是一个语句。在这个语句中，包含了表达式 3 + 3。\n\n让我们编写一个语句。打开你的 HTML 文件，编写以下代码：\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n<body>\n    <script>\n        document.write(1 + 1);\n\
    \    </script>\n</body>\n</html>\n```\n\n保存并执行你的代码。你刚刚用 JavaScript 进行了数学运算并显示了结果！\n\
    \n## 本章挑战\n\n完成以下内容：\n\n-   编写你自己的语句，并确保它显示一个结果。\n\n# 第十六章\n## 函数\n\nJavaScript\
