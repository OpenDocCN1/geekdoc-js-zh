  md: '# # CHAPTER TWENTY SEVEN

    ## STRING METHODS


    JavaScript has string methods that allow you to perform tasks with strings.


    As covered earlier, programming languages have certain data types built into them.
    These built-in data types are the most basic data types in the programming language
    and are referred to as primitive data types. One of the key traits of a primitive
    data type is that it cannot be simplified any further. A primitive data type is
    a predefined type of data that is built into the language.


    There are five primitive data types in JavaScript – these are:


    +   1. String,

    2. Number,

    3. Boolean,

    4. Null, and

    5. Undefined.


    Everything else (non-primitive data types) are objects. Objects are created by
    the programmer, not predefined and built into the programming language.


    # ### CONCAT() METHOD


    The concat() method concatenates (connects) two or more strings. Write this code:


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Concatenate"></p>

    <script>

    var part_1 = "Hello ";

    var part_2 = "World ";

    var part_3 = "from ";

    var part_4 = "sentence.";

    var whole_sentence = part_1.concat(part_2, part_3, part_4);

    document.getElementById("Concatenate").innerHTML = whole_sentence;

    </script>

    </body>

    </html>

    ```


    Save and execute your code. It displays the sentence as a whole!


    # ### SLICE() METHOD


    The slice() method is a string method that extracts a section of a string and
    then returns the extracted section in a new string.'
