- md: "# CHAPTER NINETEEN\nFLOATING POINT\n\nIt's time to get mathematical!\n\nFactors\
    \ are numbers that can multiply together to get another number. For example, 4\
    \ and 5 are factors of 20 because 4 × 5 = 20\n\n![](img/33a81fac26246d29975692e5ecda6e53_80_0.png)\n\
    \nSuperscripts are smaller characters typically displayed toward the upper right\
    \ of another number - like this: 4<sup>12</sup>\n\nSuperscripts usually indicate\
    \ \"power.\" Power refers to how many times a number is multiplied by itself.\
    \ For example, 10<sup>4</sup> means 10 to the fourth power - which is 10,000 (10\
    \ multiplied by 10 multiplied by 10 multiplied by 10).\n\nA notation is a symbol\
    \ or symbols used to represent numbers or amounts - such as an E placed at the\
    \ end of a number. This notation means \"10 to a given exponent.\" An \"exponent\"\
    \ is the power to which a number is multiplied. In the 10<sup>4</sup> example\
    \ given above, 4 is the exponent.\n\n![](img/33a81fac26246d29975692e5ecda6e53_80_1.png)\n\
    \nA floating point is a specific way of representing large numbers. Instead of\
    \ writing out the entire number, you can write the first part of it and then a\
    \ factor to multiply it by. This makes it so that by performing the multiplication,\
    \ you get essentially the same number you would have by writing it out in full.\
    \ When you do this, you move the decimal point in the number; hence the name \"\
    floating point.\"\n\nFor example, take the number three thousand, four hundred\
    \ twenty-five. Written normally, it would be: 3425 – written in floating point\
    \ notation, it could be: 3.425 x 10³. Since 10³ is 1000, this means \"3.425 times\
    \ 1000\" or 3425.\n\nA \"float\" is a type of data used by computers. The \"float\"\
    \ type is used to store numbers with a very high degree of accuracy. It is primarily\
    \ used for mathematical purposes.\n\nLet's say we want a shorter way to write\
    \ 100,000. We could write 10E 4.\n\n10E 4 means 10 X 10⁴ (10 multiplied by 10\
    \ four times).\n\nIn JavaScript, all numbers are floating point numbers, and the\
    \ limit of floating point numbers is 1.797693134862315E+308 (meaning that JavaScript\
    \ can not handle a larger floating point number). Any number that is larger than\
    \ 1.797693134862315E+308 is considered “infinity.” As a note, this is a massive\
    \ number far beyond the capability of most calculators and would take an excessive\
    \ amount of lines to display.\n\n# OTHER NUMBERS\n\nIn JavaScript, there are three\
    \ unique values that are considered to be numbers but actually do not act in the\
    \ same way. They are:\n\n- NaN (short for “Not a Number”)\n- Infinity (positive\
    \ infinity)\n- -Infinity (negative infinity)\n\nThe best way to understand these\
    \ is to put them into action. Here's an example: in a *new* Notepad++ document,\
    \ write this code:\n\n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <p\
    \ id=\"Not_a_Number\"></p>\n        <script>\n            document.getElementById(\"\
    Not_a_Number\").innerHTML = 0/0;\n        </script>\n    </body>\n</html>\n```\n\
    \nSave your file as an .html document with a name of your choosing. Then execute\
    \ your code. The result is NaN because you can't divide 0 by 0.\n\nWe can check\
    \ whether or not something is a number by using the isNaN() function. Edit your\
    \ code to the following:\n\n```html\n<!DOCTYPE html>\n<html>\n    <body>\n   \
    \     <p id=\"Not_a_Number\"></p>\n        <script>\n        document.getElementById(\"\
    Not_a_Number\").innerHTML = isNaN('Hello World');\n        </script>\n    </body>\n\
    </html>\n```\n\nSave and run your code. As you can see, the result is \"true\"\
    \ because \"Hello World\" is *not* a number. Let's change our code to the following:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <body>\n        <p id=\"Not_a_Number\"\
    ></p>\n        <script>\n        document.getElementById(\"Not_a_Number\").innerHTML\
    \ = isNaN('007');\n        </script>\n    </body>\n</html>\n```\n\nNote: the only\
    \ difference was that we changed \"Hello World\" to \"007.\" Save and run your\
    \ code. Now it is false because 007 is a number.\n\nNow, delete your code and\
    \ write the following:\n\n```html\n<!DOCTYPE HTML>\n<html>\n    <body>\n     \
    \   <p id=\"Infinity\"></p>\n        <script>\n        document.getElementById(\"\
    Infinity\").innerHTML = 1.7976931348623157E+309;\n        </script>\n    </body>\n\
    </html>\n```\n\nSave and execute your code. You can see the result \"infinity.\"\
    \ This is because we entered a number larger than 1.797693134862315E+308.\n\n\
    To see -Infinity, simply change your code to a number lower than -1.797693134862315E+308,\
    \ such as the number below:\n\n```html\n<!DOCTYPE HTML>\n<html>\n    <body>\n\
    \        <p id=\"Infinity\"></p>\n            <script>\n                document.getElementById(\"\
    Infinity\").innerHTML = -1.7976931348623157E+309;\n            </script>\n   \
    \ </body>\n</html>\n```\n\n# END OF CHAPTER CHALLENGE\n\nCreate your own program\
    \ that returns the following:\n\n- Infinity,\n- -Infinity, and\n- NaN.\n\n# CHAPTER\
    \ TWENTY\nBOOLEAN LOGIC\n\n“Logic” refers to actions, behavior and thinking that\
    \ makes sense. When speaking about computers, logic is the rules that form the\
    \ foundation for a computer in performing certain tasks. Computer logic is the\
    \ guidelines the computer uses when making decisions.\n\nLogical operators like\
    \ \"and,\" \"or,\" and \"not\" are used to evaluate whether an expression is true\
    \ or false.\n\nGeorge Boole was an English mathematician that developed Boolean\
    \ logic. “Boolean logic” is a form of logic in which the only possible results\
    \ of a decision are “true” and “false”. There aren’t any vague or “almost” answers\
    \ to a calculation or decision – black or white, no gray.\n\n![](img/33a81fac26246d29975692e5ecda6e53_84_0.png)\n\
    \nAn example of Boolean logic would be answering questions with only “yes” or\
    \ “no”.\n\nBoolean logic is especially important for the construction and operation\
    \ of digital computers because it is relatively easy to create a machine where\
    \ the result of an operation is either “true” or “false.”\n\nThis is done by comparing\
    \ two or more items – items that can only be “true” or “false.”\n\nSome common\
    \ examples of such Boolean comparisons are “AND” and “OR”.\n\nWith the Boolean\
    \ comparison called “AND”, the comparison is true *only if all of the involved\
    \ comparisons are true*.\n\nLet’s look at some examples to show how this works:\n\
    \nIn the following AND comparison, the result is true:\n\n5 is more than 3 AND\
    \ 10 is more than 5\n\nLet's break it down.\n\nThere are three comparisons happening\
    \ here:\n\n1. Comparing 5 and 3 to see if 5 is larger than 3 (is 5 larger than\
    \ 3?)\n2. Comparing 10 and 5 to see if 10 is larger than 5 (is 10 larger than\
    \ 5?)\n3. Comparing the results of those two comparisons, using the Boolean comparison\
    \ \"AND\" (are both comparisons true?)\n\nThis is the overall comparison.\n\n\
    It is true that 5 is greater than 3, so the first comparison is true.\n\nIt is\
    \ also true that 10 is greater than 5 – so the second comparison is true as well.\n\
    \nA Boolean AND comparison is true if the other comparisons are all true – so\
    \ in this example, the overall comparison is true, since the first comparison\
    \ is true *and* the second comparison is true.\n\nIn this next example, the result\
    \ is false (not true):\n\n5 is more than 7 AND 10 is more than 5\n\nEven though\
    \ 10 is more than 5, 5 is not more than 7 – so the overall comparison is not true.\n\
    \nA \"condition\" is an item that must be true before something else occurs. In\
    \ the AND comparison above, these are the two conditions checked for:\n\n1. 5\
    \ is more than 7\n2. 10 is more than 5\n\nThey're conditions because the outcome\
    \ is conditional upon (dependant on) these two comparisons.\n\nA Boolean OR comparison\
    \ checks for whether one *or* both conditions are true. Here is an example:\n\n\
    ```\n4 is less than 9 OR 8 is less than 7\n```\n\nThe result would be true because\
    \ at least one of the comparisons is true (4 is a smaller number than 9).\n\n\
    In the following example, the result would be false since neither is true:\n\n\
    ```\n8 is less than 4 OR 9 is less than 3\n```\n\nAnd in this example, the result\
    \ would be true because one or both (in this case both) are true:\n\n```\n7 is\
