  md: '# CHAPTER TWENTY FIVE

    IDENTIFIERS AND LITERALS


    An “identifier” is a name for something. In JavaScript, identifiers are the names
    of variables, functions, keywords, and labels. In the following code, “X” is the
    identifier:


    ```

    var X = 10

    ```


    In contrast to an identifier, a literal is something that represents a value within
    source code. Source code is the version of a computer program as it is originally
    written (i.e., typed into a computer in some programming language) by the designer
    of the program. Normally, when the programmer is done making the program, she
    has the computer convert the code she wrote the program in (the “source code”)
    to another format that is easier and faster for the computer to use. In that new
    format, the program can’t be easily understood by people – but it is very useful
    to the computer. It also can’t be modified by other programmers at that point.


    Look at this code:


    ```

    var X = 10

    var Y = “Charlie”

    ```


    The 10 is the integer (whole number) literal, Charlie is the string literal, and
    “X” and “Y” are the identifiers.


    A literal is the data exactly as it is meant to be processed. Whereas an identifier
    is a name, the literal is the value itself.


    # NESTED FUNCTIONS


    Nested refers to something contained within something else. This can be a program
    within a program or a set of instructions inside another set of instructions.


    Sometimes the subprogram needs some information from the main program in order
    to perform its tasks. When the subprogram is created, its description might include
    this information. That information is called the “parameters” of the subprogram.


    The parameters of the nested entity are explained within the larger (and enveloping)
    entity. It’s nested because it is placed inside something else.


    For example, a nested procedure would be a set of commands that is contained within
    a larger procedure.'
