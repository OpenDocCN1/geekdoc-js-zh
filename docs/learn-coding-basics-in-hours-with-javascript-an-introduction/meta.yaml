  md: '# CHAPTER NINETEEN

    FLOATING POINT


    It''s time to get mathematical!


    Factors are numbers that can multiply together to get another number. For example,
    4 and 5 are factors of 20 because 4 × 5 = 20


    ![](img/33a81fac26246d29975692e5ecda6e53_80_0.png)


    Superscripts are smaller characters typically displayed toward the upper right
    of another number - like this: 4<sup>12</sup>


    Superscripts usually indicate "power." Power refers to how many times a number
    is multiplied by itself. For example, 10<sup>4</sup> means 10 to the fourth power
    - which is 10,000 (10 multiplied by 10 multiplied by 10 multiplied by 10).


    A notation is a symbol or symbols used to represent numbers or amounts - such
    as an E placed at the end of a number. This notation means "10 to a given exponent."
    An "exponent" is the power to which a number is multiplied. In the 10<sup>4</sup>
    example given above, 4 is the exponent.


    ![](img/33a81fac26246d29975692e5ecda6e53_80_1.png)


    A floating point is a specific way of representing large numbers. Instead of writing
    out the entire number, you can write the first part of it and then a factor to
    multiply it by. This makes it so that by performing the multiplication, you get
    essentially the same number you would have by writing it out in full. When you
    do this, you move the decimal point in the number; hence the name "floating point."'
  merge: -1
  pgno: 80
- img_proc: true
  md: "For example, take the number three thousand, four hundred twenty-five. Written\
    \ normally, it would be: 3425 – written in floating point notation, it could be:\
    \ 3.425 x 10³. Since 10³ is 1000, this means \"3.425 times 1000\" or 3425.\n\n\
    A \"float\" is a type of data used by computers. The \"float\" type is used to\
    \ store numbers with a very high degree of accuracy. It is primarily used for\
    \ mathematical purposes.\n\nLet's say we want a shorter way to write 100,000.\
    \ We could write 10E 4.\n\n10E 4 means 10 X 10⁴ (10 multiplied by 10 four times).\n\
    \nIn JavaScript, all numbers are floating point numbers, and the limit of floating\
