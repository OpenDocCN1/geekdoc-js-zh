    ```\n\n保存你的代码。现在，如果你运行你的 JavaScript 文件，它不会工作！那是因为你需要运行链接到该 JavaScript 代码的 HTML\
    \ 文件。执行你的 HTML 文件。\n\n### 减法\n\n让我们做一些减法 - 按如下方式编辑你的 JavaScript 代码：\n\n```javascript\n\
