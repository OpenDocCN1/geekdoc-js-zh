    \ +、-、/ 和 *。在 JavaScript 中，我们可以使用它们来执行算术运算。\n\n现在，打开你的 JavaScript 文件（Test_1.js\
    \ —— 在接下来的几步中称为你的 “JavaScript 代码”）并编写以下代码：\n\n```javascript\nvar Simple_Math =\
