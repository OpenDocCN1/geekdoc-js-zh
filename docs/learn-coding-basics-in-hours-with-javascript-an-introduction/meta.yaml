  md: '# MODULUS OPERATION


    The modulus operation finds the remainder after dividing two numbers. Remember
    back in math class? In division, the remainder is the amount left over after dividing
    two numbers. For example: $5 \div 2$ would have a remainder of one.


    A couple other math terms are “dividend” (the number being divided) and “divisor”
    (the amount the number is divided by). In our earlier example, $5$ is the dividend
    and $2$ is the divisor.


    “Modulus” comes from the Latin word *modulus*, meaning “measure.”


    The modulus is the remainder after the dividend has been divided by the divisor.


    In JavaScript, the % symbol represents the modulus operator – which could be called
    the remainder operator. Let’s put this to use. Open up your JavaScript code and
    write the following:


    ```

    var Simple_Math = 25 % 6;

    document.getElementById("Math").innerHTML="When you divide 25 by 6 you have a
    remainder of: " + Simple_Math;

    ```


    Save your JavaScript code and execute the HTML file.


    # UNARY AND BINARY OPERATORS


    “Unary” means having, made up of, or acting on one component, item or element.
    An “operand” is the number that is being dealt with in a mathematical operation.
    It is not the action being taken with the number – it is the number itself.


    For example, in $5+6$, the operands are $5$ and $6$. The “+” is the operator.


    A “unary operator” is an operation that only contains a single operand. An example
    of this would be $+5$.


    A “binary operator” is an operation that requires two operands – one operand before
    the operator and one after. An example of this would be $5 + 5$.


    There is a unary operator called a “negation operator.” Negate literally means
    to deny or contradict something. The word “negation” in “negation operator” means
    “negative; not positive.”


    This returns the opposite or negative form of something.'
