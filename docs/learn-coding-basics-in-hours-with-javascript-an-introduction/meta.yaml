    \             Age: 5,\n                Sound: \"Bark!\"\n            };\n    \
    \        document.getElementById(\"Display\").innerHTML = Animal.Sound;\n    \
    \    </script>\n    </body>\n</html>\n```\n\nSave and execute your code. The output\
    \ is: Bark! because this was associated with the key “Sound.”\n\nNOTE: Due to\
    \ the fact that 5 is the value type “number,” we don’t have to place it within\
