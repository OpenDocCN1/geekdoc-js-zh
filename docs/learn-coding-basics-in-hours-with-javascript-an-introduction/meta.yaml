  md: '# CHAPTER ONE

    WELCOME


    Welcome to The Tech Academy’s *Learn Coding Basics in Hours with JavaScript* book!


    Now, we’re sure you want to dive right into coding but there’s some information
    we are going to cover first to ensure you are well prepared. In fact, you won’t
    write any code until the 13th chapter of this book.


    It may seem like a lot of reading before we get down to business but it’s worth
    it. Let’s compare this to another subject: how hard would it be to drive a car
    if you couldn’t define the important terms – such as steering wheel, gas pedal
    or brake pedal? So, please bear with us and take some time learning some fundamental
    data that will set you up well for the adventure that lies ahead.


    We have attempted to define all technical terms used in this book but if you come
    across any that you don’t understand, look these up in The Tech Academy’s *Technology
    Basics Dictionary* (available for purchase on Amazon).


    The Tech Academy is a technology school headquartered in Portland, Oregon, with
    multiple campuses around the world. We specialize in coding boot camps (intensive
    training programs aimed at preparing graduates for entry-level technology positions,
    that can be completed in a few months). We also offer custom training for companies,
    and have published several books.


    While we would love to tell you everything about computers and technology in this
    book, we are only going to cover the absolutely necessary data. If you are interested
    in learning about how computers work exactly, we recommend reading our book *You
    Are Not Stupid – Computers and Tech Simplified*, which can be purchased on Amazon.


    Our educational philosophy is to *assume no prior knowledge on the part of the
    student*. What this means is that our training content, including this book, is
    written for absolute beginners. We operate on the assumption that you’ve never
    written code before and that you don’t know basic technical terms – this ensures
    nothing is over your head and that you aren’t lost while reading.


    You’re about to experience The Tech Academy’s approach to education first hand:
    we are going to start our book by defining the technical words used in the title
    of our book!


    # CODING


    Coding refers to the action of entering instructions into computers to make them
    perform specified actions. A computer is a special type of machine.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Machines are devices (equipment with a purpose; tools) made by humans to get
    work done. They are usually made out of durable materials like wood, plastic and
    metal. Normally they have some parts that move and some parts that don’t; sometimes
    they have no moving parts at all. They receive some kind of energy that they use
    to do their work.


    One of the traits that makes people different from animals is their ability to
    create complex machines.


    Usually people create machines because there is some work they want to do that
    the machine could help them with. The help the machine provides could be to get
    the work done faster, to do the work with less chance of errors, or to do the
    work nearly continuously, without the need to stop for food or sleep. There are
    other reasons people make machines, but it usually comes down to getting more
    work done in a given amount of time with fewer errors.


    As time goes on, machines often get improved or changed to make them more effective
    or to respond to changes in the area of society where they are used.


    Cars, planes, telephones and ovens are all machines.


    Again, a computer is just another machine – it’s a device made by people to get
    work done.


    ![](img/33a81fac26246d29975692e5ecda6e53_11_0.png)


    Let’s take a closer look at computers.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# CHAPTER TWO

    COMPUTERS


    Computers were created to do a simple thing: they take in data (information),
    change the data in some way, and send out data. That’s all.


    ![](img/33a81fac26246d29975692e5ecda6e53_12_0.png)


    There are certain truths regarding computers:


    +   1. They are only machines. They are not people.

    2. They were created by people and can only act if a person tells them to. Even
    then, they can only perform actions that a person thought of ahead of time and
    built into them.


    Computers do not have a soul. They cannot think. Everything ever done by a computer
    was predetermined by humans. Even so-called “artificial intelligence” (computer
    systems that are able to perform actions that require human intelligence, like
    being able to recognize sounds and images), or computers that can “learn,” only
    have these abilities because we designed them that way.


    As machines, some of the characteristics of computers include the following:


    +   - They handle data. Data is information – such as words, symbols (something
    written that represents an amount, idea or word), pictures, etc.

    - They obey instructions (commands entered into them that perform certain tasks).

    - They automate (perform actions without human interaction) tasks that would either
    take too long for a person to do or be too boring. Keep in mind that these automatic
    actions were designed by a person.

    - They process data. “Process” means to handle something through use of an established
    (and usually routine) set of procedures. When a computer displays the word “processing”,
    it is saying, “Hold on while I perform some pre-established procedures.” Processing
    refers to “taking actions with data”. Searching through words to locate typos
    would be an example of “processing data”.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'When data is being processed by a computer, you sometimes see a “progress bar”
    (a symbol that shows how far along something is) like this:


    ![](img/33a81fac26246d29975692e5ecda6e53_13_0.png)


    Or you may see this symbol when data is processed:


    ![](img/33a81fac26246d29975692e5ecda6e53_13_1.png)


    This circular symbol is called a “throbber” due to the fact that they originally
    expanded and contracted in size – i.e., the symbol “throbbed”.


    > The purpose of computers is to take in data, process it and send it out.


    When computers perform actions, it is referred to as “executing” or “running.”
    For example, you can run a search on the internet by clicking the search button
    or you could execute an instruction by pressing enter on your keyboard.


    It is important to understand that machines are not life forms. Even though they
    can perform seemingly miraculous operations, the true source of their products
    is humankind.


    ![](img/33a81fac26246d29975692e5ecda6e53_13_2.png)


    Computers aren’t very useful without programs – so let’s go over what programs
    are exactly.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# CHAPTER THREE

    PROGRAMS


    As a noun (thing), code is the written instructions you type into a computer to
    make programs.


    Programs are series of written instructions, entered into a computer, which cause
    the computer to perform a specific task or tasks. For example, Microsoft® Paint
    is a program that can be used to create basic illustrations on your computer.


    Hardware refers to the physical components of the computer – the parts that can
    be touched. “Hard” means “solid” or “tangible” (able to be seen and felt), and
    “ware” means “something created”.


    The computer screen, mouse, printer and keyboard are all hardware.


    ![](img/33a81fac26246d29975692e5ecda6e53_14_0.png)


    The opposite of hardware is software. Software is just another word for “computer
    program” – sets of instructions that tell a computer what to do. Computer games,
    like Solitaire, are examples of software.


    Another word for computer program or software is “application.” These terms are
    all interchangeable. Though “app” (abbreviation of application) is usually used
    to refer to programs (applications; software) on a mobile device (like a cell
    phone).


    The word software came about in the 1960s to emphasize the difference between
    it and computer hardware. Software (programs; applications) are the instructions,
    while hardware implements the instructions.


    Installing a program means to put it into a computer so that the program can execute.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'For example, you could install a program by transferring the data from the
    internet to your computer. In the 1990s, most software was installed using a disk
    that came in a box and looked something like this:


    ![](img/33a81fac26246d29975692e5ecda6e53_15_0.png)


    The people that create programs are called computer programmers. They’re also
    referred to as coders, software developers, software engineers and just developers.
    These position names all mean the same thing.


    ![](img/33a81fac26246d29975692e5ecda6e53_15_1.png)


