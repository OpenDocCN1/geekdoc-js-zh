    \ X to the string value “Hello, world!”\n\n## CREATING A STRING\n\nThere are some\
    \ characters and functions that cannot easily be put within quotes when writing\
    \ strings in JavaScript.\n\nFor example, what if you wanted to display: Sally\
    \ said, \"I don't want to go\"? You not only have additional quotation marks around\
    \ Sally's statement, but you also have the single quote (apostrophe) within “don't.”\n\
    \nThe solution to this problem is to add a backslash (\\) – this is referred to\
    \ as “escaping” the character and tells the computer that the character that follows\
    \ has a special meaning. For example: \\' or \\\" means that the quote mark(s)\
    \ following the backslash will not end the string but instead will be printed\
    \ on the screen.\n\nAlso, if you want to start a new line, you can use the HTML\
    \ `<br>` tag, which is like pressing Enter. This means “line break.” A line break\
    \ literally creates a new line of text – again, like pressing Return/Enter on\
    \ your keyboard.\n\nLet's try this out. Delete your previous HTML/JavaScript code\
    \ and write this code:\n\n```html\n<!DOCTYPE HTML>\n<html>\n<body>\n    <script>\n\
    \        document.write(\"Sally said, \\\"I don't want to go\\\"\");\n    </script>\n\
    </body>\n</html>\n```\n\nSave and execute your code. We have successfully displayed\
    \ quotation marks and an apostrophe!\n\nWait a second... What do you do if you\
    \ need to display a backslash in your code? Simple, write two of them!: \\\\\n\
    \n## CONCATENATING A STRING\n\nConcatenate means to connect items together, like\
