  mdcn: "\n你可以看到这里有两条可能的“路径”。一条路径是“由一个决策产生的可能的行动过程”。把它想象成你走到一个岔路口时发生的情景。你必须决定采取什么行动——你走哪条路？这也被称为一个分支。\n\
    \n除了最简单的计算机程序，所有程序都需要做同样的事情。也就是说，它们必须检查一段数据的状况，并根据该数据的状况，执行不同的计算机指令集。\n\n为了做到这一点，程序将使用一种称为“控制”指令的特殊计算机指令。这些指令只是告诉计算机在做决定时需要看什么，然后告诉计算机对于每一种可能的决策该做什么。计算机最基本的控制语句是“if”。它的使用方式如下：\n\
    \nIF [要检查的条件] THEN [要执行的计算机指令分支]\n\n这里，“IF”是控制语句；“THEN”是指向如果控制语句为真则要执行的程序路径的分支指令。\n\
    \n## 变量\n\n我们之前介绍过变量，它们是程序的关键部分。\n\n回顾一下，变量是计算机程序用来跟踪在程序执行过程中可能发生变化的数值的一段数据。这可能是诸如“刚刚被评分的学生论文的成绩”或“为装配线上的下一辆车使用的油漆颜色”之类的东西。\n\
    \n变量是任何计算机程序的重要组成部分，因为它们使得计算机程序不仅仅能用于一组单一的、预定的数值。你可以想象，如果“为装配线上的下一辆车使用的油漆颜色”永远只能是“蓝色”，那么使用该数据的计算机程序就不会非常有用。让计算机程序能够为每一辆要喷漆的汽车改变这个值会更有意义。\n\
    \n当你在计算机程序中编写变量时，它们通常以这样的方式编写：\n\n[变量名] = [变量的值]\n\n例如，你可能会有这样的代码：\n\n```\ncolor\
    \ = \"red\"\n```\n\n这里，变量名为“color”，该变量的值已被设置为“red”。换句话说，名为“color”的变量现在“等于”单词“red”。\n\
    \n让我们看看“一位老师给一叠论文评分”的例子。这里，我们可以有一个名为“Paper Grade”（论文成绩）的变量，每次老师给一篇论文评分时它都会改变。你还可以有关于论文总题目数的变量（“Total\
    \ Questions”），用于学生回答正确的题目数（“Correct Questions”），以及论文成绩。\n\n上面的书面描述如下：\n\n1.  从“待评分”堆的顶部取出下一位学生的论文。\n\
    2.  评分。\n3.  将成绩写在论文上。\n4.  如果成绩为70%或更高，则将论文放入“通过”堆。\n5.  如果成绩低于70%，则将论文放入“未通过”堆。\n\
    \n用计算机语言表示，这个过程可能如下所示：\n\n1.  取出下一篇论文\n2.  设置 Total Questions = [当前论文的总题数]\n3.\
    \  评分\n4.  设置 Correct Questions = [回答正确的题目数]\n5.  设置 Paper Grade = [Correct Questions/Total\
    \ Questions]\n6.  If (Paper Grade >= 70%) then Paper Status = “passed”\n7.  If\
    \ (Paper Grade < 70%) then Paper Status = “failed”\n\n这是一个简单的计算机程序。\n\n注意，>=（大于号后跟等号）是一个用于表示应进行比较的符号。具体来说，这个“大于或等于”符号是一个指令，用于检查符号左侧的数据在数量或数量上是否大于或等于右侧的数据。这个比较的答案是“true”或“false”。\n\
    \n例如：5 >= 4\n\n这意味着“检查5是否大于或等于4”。由于五实际上大于四，答案是“true”。\n\n另一个例子：3 >= 6\n\n这意味着“检查3是否大于或等于6”。答案是“false”。\n\
    \n最后一个例子：6 >= 6\n\n这意味着“检查6是否大于或等于6”。答案是“true”。\n\n>=的反向（相反）符号是<=，它检查符号左侧的数据是否*小于或等于*右侧的数据。\n\
    \n每次计算机运行前面列出的七步过程时，程序中每个变量的值都可能不同，这取决于被评分的论文有多少道题以及学生正确回答了多少道题。\n\n例如，假设论文有100道题，学生答对了82道。程序运行后，结果如下：\n\
    \n| Total Questions: | 100 |\n| Correct Questions: | 82 |\n| Paper Grade: | 82%\
    \ |\n| Paper Status: | Passed |\n\n再举一个例子，假设论文有50道题，学生答对了30道。程序运行后，结果如下：\n\n|\
    \ Total Questions: | 50 |\n| Correct Questions: | 30 |\n| Paper Grade: | 60% |\n\
    | Paper Status: | Failed |\n\n为了阐明使用变量的必要性：假设在这个计算机程序创建时，学校的所有论文都有100道题，并且老师们告诉程序员，要始终假定题目数量为100。在这种情况下，程序员就不会使用名为“Total\
    \ Questions”的变量。\n\n相反，他们可以让程序看起来像这样：\n\n1.  取出下一篇论文\n2.  评分\n3.  设置 Correct Questions\
    \ = [回答正确的题目数]\n4.  设置 Paper Grade = [Correct Questions/100]\n5.  If (Paper Grade\
    \ >= 70%) then Paper Status = \"passed\"\n6.  If (Paper Grade < 70%) then Paper\
    \ Status = \"failed\"\n\n注意，在程序的第4行，程序员将题目数量设置为100。\n\n现在，假设学校引入了“测验”的概念，这是一种只有20道题的小型论文。如果计算机程序处理的是测验，那么成绩将不再准确——即使学生20道题全部正确，他们也只能得到20%的成绩（20/100）。\n\
    \n一个优秀的程序员会分析程序旨在解决的需求，然后构建程序，使其能够随着时间的推移处理该需求的变化。\n\n另一个有价值的控制语句是循环。这是程序的一部分反复执行，直到满足某个条件为止。\n\
    \n用现实世界的术语来说，一个例子可能是“一次评一份论文，直到所有论文都评完”或者“复制这份文档五份”。\n\n在计算机程序中，循环看起来像这样：\n\n\
    - [开始循环]\n  - 执行操作\n  - If [结束条件已满足] then [退出循环]\n  - If [结束条件未满足] then [重复循环]\n\
    - [结束循环]\n\n我们看到的评分程序可以设置为一个循环。指令可以这样安排：\n\n- [开始循环]\n  - 从“待评分”堆的顶部取出下一位学生的论文。\n\
    \  - 评分。\n  - 将成绩写在论文上。\n  - 如果成绩为70%或更高，则将论文放入“通过”堆。\n  - 如果成绩低于70%，则将论文放入“未通过”堆。\n\
    \  - If [“待评分”堆中没有更多论文] then [退出循环]。\n  - If [“待评分”堆中还有更多论文] then [重复循环]。\n- [结束循环]\n\
    \n通常循环会使用一个名为“计数器”的特殊变量。计数器跟踪循环已执行的次数。这可以用来确保循环仅在需要时执行。\n\n让我们也给正在讨论的评分程序添加一个计数器和两个新变量：“Total\
    \ Papers”将用于存放“需要评分的论文总数”的值，而“Counter”将用于存放“循环已执行的次数”的值。\n\n1.  设置 Total Papers\
    \ = [要评分的论文总数]\n2.  设置 Counter = 0\n3.  If (Counter < Total Papers):\n    a. \
    \ 取出下一篇论文\n    b.  设置 Total Questions = [当前论文的总题数]\n    c.  评分\n    d.  设置 Correct\
    \ Questions = [回答正确的题目数]\n    e.  设置 Paper Grade = [Correct Questions/Total Questions]\n\
    \    f.  If (Paper Grade >= 70%) then Paper Status = “passed”\n    g.  If (Paper\
    \ Grade < 70%) then Paper Status = “failed”\n    h.  Counter = Counter + 1\n \
    \   i.  回到步骤 3\n4.  [继续程序的其余部分]\n\n这里，循环出现在步骤3。\n\n让我们分解一下每个步骤在这里的作用：\n\n**步骤1：**\
    \ 计算“待评分”堆中有多少篇论文，并将“Total Papers”变量的值设置为该数字。\n\n**步骤2：** 创建一个名为“Counter”的变量，并将其值设置为零。此变量将用于跟踪已评分的论文数量。\n\
    \n**步骤3：** 使用控制语句“if”来查看我们是否应该执行循环。\n\n**步骤3a-3g：** 评分；这在上面已经介绍过了。\n\n**步骤3h：**\
    \ 由于我们现在已经评分了一篇论文，将我们的Counter变量加一。\n\n**步骤3i：** 回到循环顶部，我们检查是否需要再次执行整个循环。\n"
