    \ papers in the \"To Be Graded\" stack, exit the loop.\n  - If there are more\
    \ papers in the \"To Be Graded\" stack, repeat the loop.\n- [end loop]\n\nOften\
    \ loops make use of a special variable called a \"counter.\" The counter keeps\
    \ track of how many times the loop has been executed. This can be used to make\
    \ sure the loop is only executed when needed."
