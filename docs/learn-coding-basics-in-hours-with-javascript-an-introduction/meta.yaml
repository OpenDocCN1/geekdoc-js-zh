    failed\"\n\nNotice that on line 4 of the program, the programmer set the number\
    \ of questions to 100.\n\nNow, let's say that the school introduces the concept\
    \ of \"quizzes,\" which are smaller papers with only 20 questions. If the paper\
    \ being handled by the computer program is a quiz, the grade will no longer be\
    \ accurate - even if a student got all 20 questions correct, they would only get\
    \ a grade of 20% (20/100).\n\nA good programmer will analyze the need that the\
    \ program is meant to resolve, then build the program so that it can handle changing\
    \ aspects of that need over time.\n\nAnother valuable control statement is a loop.\
    \ This is where part of the program is executed over and over until a certain\
    \ condition is met.\n\nIn real-world terms, an example might be \"grade papers\
    \ one at a time until all the papers have been graded\" or \"make five copies\
