    In programming, code can have \"scope.\" Simply put, the scope is the functions,\
    \ variables, and objects you have access to. Scope can be limited. Variables have\
    \ scope in that they can either be accessed by one, more than one, or all functions\
    \ in a program. The scope of variables is either \"local\" or \"global.\"\n\n\
    In JavaScript, a global variable can be accessed from any function within the\
    \ program, whereas a local variable is only accessed by the function it is assigned\
    \ to.\n\nGlobal variables are declared outside of functions, and local variables\
    \ are declared inside of functions."
