    \ example, let’s say you wanted to make two different types of cars on a computer;\
    \ each car would be an object. Each object (car) would have its own size, shape,\
    \ color, speed, distance it could travel without needing more gas, etc.\n\n###\
    \ DICTIONARIES\n\nIn computer programming, dictionaries are a specialized type\
    \ of list. The first item is the key, and the second item is the value. Together,\
    \ they are a “key-value pair.”\n\nKey-value pair is abbreviated “KVP.” A KVP is\
    \ a set of two linked data items that consists of: a key (a unique identifier\
    \ for some item of data), and the value (the data that is identified by the key).\
    \ The key is the unique name, and the value is the content.\n\nCollections of\
    \ KVPs (i.e., dictionaries) are often used in computer programs.\n\nBelow is an\
    \ example of a collection of KVPs that might be used in a computer program for\
    \ a school. Here, the KEY is used to store the name of a course at the school,\
    \ and the VALUE is the description of the course – this is a dictionary:\n\n|\
    \ KEY | VALUE |\n|---|---|\n| SOUND | Boom! |\n| SEASON | Summer |\n| WEATHER\
    \ | Stormy |\n| DAY | Saturday |\n| MONTH | August |\n\nNote that in this list,\
    \ you could not have a second Key-Value Pair that used the Key “SEASON” or “DAY”\
    \ because the keys in a given collection of KVPs must be unique.\n\nA “dictionary”\
    \ is “a key-value pair collection.”\n\nIn a dictionary, multiple values can be\
