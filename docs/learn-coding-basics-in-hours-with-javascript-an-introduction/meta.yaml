    \n另外几个数学术语是 “被除数”（dividend，被除的数）和 “除数”（divisor，用这个数去除被除数）。在我们之前的例子中，$5$ 是被除数，$2$\
    \ 是除数。\n\n“Modulus” 来自拉丁语 *modulus*，意思是 “测量”。\n\n取模是被除数除以除数后的余数。\n\n在 JavaScript\
