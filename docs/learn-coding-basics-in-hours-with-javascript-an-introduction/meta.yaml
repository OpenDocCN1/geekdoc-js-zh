    \ Programming for Absolute Beginners\n\n*Written by:* Jack C. Stanley and Erik\
    \ D. Gross, Co-Founders of The Tech Academy\n\nMs. Ann Townsend Leverette\n2524\
    \ Flair Knoll Dr NE\nAtlanta, GA 30345-1316\n\nLEARN CODING, LAUNCH YOUR NEW CAREER\
    \ WITH JAVASCRIPT\n\nISBN-10: 0997326468\nISBN-13: 978-0-9973264-6-8\nThird Edition,\
    \ July 2020\nCopyright © 2017, Prosper Consulting Inc., The Tech Academy\n\n#\
    \ LEARN CODING BASICS IN HOURS WITH JAVASCRIPT\n\n# An Introduction to Computer\
    \ Programming for People with No Prior Experience\n\nWritten by: Jack C. Stanley\
    \ and Erik D. Gross, Co-Founders of The Tech Academy\n\n# TABLE OF CONTENTS\n\n\
    - Chapter One: Welcome, 9\n    - Coding, 9\n- Chapter Two: Computers, 11\n- Chapter\
    \ Three: Programs, 13\n- Chapter Four: Programming Languages, 15\n- Chapter Five:\
    \ Machine Language, 18\n- Chapter Six: The Internet and World Wide Web, 19\n \
    \   - The Internet, 19\n    - Internet vs. World Wide Web, 21\n    - Programming,\
    \ 22\n- Chapter Seven: JavaScript, 23\n    - High-Level, 23\n    - Untyped, 24\n\
    \    - Interpreted, 27\n    - Runtime, 28\n    - Putting it Together, 29\n- Chapter\
    \ Eight: Algorithms, 30\n    - Result, 31\n    - Finite Amount of Time, 31\n \
    \   - Well-Ordered, 32\n    - Effectively Computable, 32\n    - Unambiguous, 32\n\
    - Chapter Nine: Five Elements of a Program, 34\n    - Entrance, 34\n    - Control/Branching,\
    \ 34\n    - Variables, 35\n    - Subprograms, 40\n    - Exit, 41\n    - Summary,\
    \ 41\n- Chapter Ten: Types of Programming Languages, 42\n- Chapter Eleven: HTML\
    \ and CSS, 44\n    - HTML, 44\n    - CSS, 44\n    - History of JavaScript, 45\n\
    \    - Value Types, 46\n\n# Chapter Twelve: Coding Tips, 47\n\nChallenges, 47\n\
    \n# Chapter Thirteen: First Coding Assignments, 48\n\n- HTML, 48\n- Tags, 48\n\
    - Elements, 49\n- Notepad++, 49\n- \"Hello, World\" in HTML, 50\n- Online Images,\
    \ 51\n- Computer Image, 52\n- \"Hello, World\" in JavaScript, 54\n- Window.Alert(),\
    \ 56\n- Document.Write(), 57\n- End of Chapter Challenge, 57\n\n# Chapter Fourteen:\
    \ Variables and Strings, 58\n\n- Assignment Operator, 58\n- Creating a String,\
    \ 58\n- Concatenating a String, 59\n- Multiple Variables, 60\n- Str.FontColor(\"\
    \"), 60\n- End of Chapter Challenge, 61\n\n# Chapter Fifteen: Expressions and\
    \ Statements, 62\n\n- End of Chapter Challenge, 63\n\n# Chapter Sixteen: Functions,\
    \ 64\n\n- <p> Element, 64\n- Ids, 65\n- Document.GetElementById, 66\n- += Operator,\
    \ 67\n- End of Chapter Challenge, 67\n\n# Chapter Seventeen: Numbers, 68\n\n-\
    \ Subtraction, 69\n- Multiplication, 69\n- Division, 69\n- Multiple Arithmetic\
    \ Operators, 69\n- Modulus Operator, 70\n- Unary and Binary Operators, 70\n- Increment\
    \ Operator, 71\n- Math.Random(), 72\n- End of Chapter Challenge, 73\n\n# Chapter\
    \ Eighteen: JavaScript Objects, 74\n\n- Dictionaries, 74\n- Assigning Multiple\
    \ Values, 76\n- Operators as Words, 77\n- Typeof Operator, 77\n- End of Chapter\
    \ Challenge, 78\n\n# Chapter Nineteen: Floating Point, 79\n\n- Other Numbers,\
    \ 80\n- End of Chapter Challenge, 82\n\n# Chapter Twenty: Boolean Logic, 83\n\n\
    - Console.Log Method, 86\n- Type Coercion, 87\n- End of Chapter Challenge, 87\n\
    \n# Chapter Twenty One: Comparison Operators, 88\n\n- End of Chapter Challenge,\
    \ 90\n\n# Chapter Twenty Two: Logical Operators, 91\n\n# Chapter Twenty Three:\
    \ Ternary Operators, 94\n\n- End of Chapter Challenge, 95\n\n# Chapter Twenty\
    \ Four: Object-Oriented Programming, 96\n\n- Constructors, 97\n- Keywords, 98\n\
    - Reserved Keywords, 99\n- End of Chapter Challenge, 99\n\n# Chapter Twenty Five:\
    \ Identifiers and Literals, 100\n\n- Nested Functions, 100\n- Scope, 101\n- End\
    \ of Chapter Challenge, 103\n\n# Chapter Twenty Six: Conditional Statements, 104\n\
    \n- Else Statements, 104\n- Else If Statements, 105\n- End of Chapter Challenge,\
    \ 106\n\n# Chapter Twenty Seven: String Methods, 107\n\n- Concat() Method, 107\n\
    - Slice() Method, 107\n- End of Chapter Challenge, 108\n\n# Chapter Twenty Eight:\
    \ Number Methods, 109\n\n- End of Chapter Challenge, 109\n\n# Chapter Twenty Nine:\
    \ Final Challenge, 110\n\n- Final Challenge, 112\n\n# Chapter Thirty: Congratulations!,\
    \ 113\n\n- Index, 115\n- Other Reading, 117\n\n# CHAPTER ONE\n## WELCOME\n\nWelcome\
    \ to The Tech Academy’s *Learn Coding Basics in Hours with JavaScript* book!\n\
    \nNow, we’re sure you want to dive right into coding but there’s some information\
    \ we are going to cover first to ensure you are well prepared. In fact, you won’t\
    \ write any code until the 13th chapter of this book.\n\nIt may seem like a lot\
    \ of reading before we get down to business but it’s worth it. Let’s compare this\
    \ to another subject: how hard would it be to drive a car if you couldn’t define\
    \ the important terms – such as steering wheel, gas pedal or brake pedal? So,\
    \ please bear with us and take some time learning some fundamental data that will\
    \ set you up well for the adventure that lies ahead.\n\nWe have attempted to define\
    \ all technical terms used in this book but if you come across any that you don’t\
    \ understand, look these up in The Tech Academy’s *Technology Basics Dictionary*\
    \ (available for purchase on Amazon).\n\nThe Tech Academy is a technology school\
    \ headquartered in Portland, Oregon, with multiple campuses around the world.\
    \ We specialize in coding boot camps (intensive training programs aimed at preparing\
    \ graduates for entry-level technology positions, that can be completed in a few\
    \ months). We also offer custom training for companies, and have published several\
    \ books.\n\nWhile we would love to tell you everything about computers and technology\
    \ in this book, we are only going to cover the absolutely necessary data. If you\
    \ are interested in learning about how computers work exactly, we recommend reading\
    \ our book *You Are Not Stupid – Computers and Tech Simplified*, which can be\
    \ purchased on Amazon.\n\nOur educational philosophy is to *assume no prior knowledge\
    \ on the part of the student*. What this means is that our training content, including\
    \ this book, is written for absolute beginners. We operate on the assumption that\
    \ you’ve never written code before and that you don’t know basic technical terms\
    \ – this ensures nothing is over your head and that you aren’t lost while reading.\n\
    \nYou’re about to experience The Tech Academy’s approach to education first hand:\
    \ we are going to start our book by defining the technical words used in the title\
    \ of our book!\n\n## CODING\n\nCoding refers to the action of entering instructions\
    \ into computers to make them perform specified actions. A computer is a special\
    \ type of machine.\n\nMachines are devices (equipment with a purpose; tools) made\
    \ by humans to get work done. They are usually made out of durable materials like\
    \ wood, plastic and metal. Normally they have some parts that move and some parts\
    \ that don’t; sometimes they have no moving parts at all. They receive some kind\
    \ of energy that they use to do their work.\n\nOne of the traits that makes people\
    \ different from animals is their ability to create complex machines.\n\nUsually\
    \ people create machines because there is some work they want to do that the machine\
    \ could help them with. The help the machine provides could be to get the work\
    \ done faster, to do the work with less chance of errors, or to do the work nearly\
    \ continuously, without the need to stop for food or sleep. There are other reasons\
    \ people make machines, but it usually comes down to getting more work done in\
    \ a given amount of time with fewer errors.\n\nAs time goes on, machines often\
    \ get improved or changed to make them more effective or to respond to changes\
    \ in the area of society where they are used.\n\nCars, planes, telephones and\
    \ ovens are all machines.\n\nAgain, a computer is just another machine – it’s\
    \ a device made by people to get work done.\n\nLet’s take a closer look at computers."
  mdcn: "\n# 几小时内学会JavaScript编程基础\n\n面向完全初学者的计算机编程入门\n\n*作者：* 杰克·C·斯坦利与埃里克·D·格罗斯，The\
    \ Tech Academy联合创始人\n\n安·汤森德·莱弗利特女士\n2524 Flair Knoll Dr NE\nAtlanta, GA 30345-1316\n\
    \n学习编程，用JavaScript开启你的新职业\n\nISBN-10: 0997326468\nISBN-13: 978-0-9973264-6-8\n\
    第三版，2020年7月\n版权所有 © 2017, Prosper Consulting Inc., The Tech Academy\n\n# 几小时内学会JavaScript编程基础\n\
    \n# 面向无经验人群的计算机编程入门\n\n作者：杰克·C·斯坦利与埃里克·D·格罗斯，The Tech Academy联合创始人\n\n# 目录\n\n\
    - 第一章：欢迎，9\n    - 编程，9\n- 第二章：计算机，11\n- 第三章：程序，13\n- 第四章：编程语言，15\n- 第五章：机器语言，18\n\
    - 第六章：互联网与万维网，19\n    - 互联网，19\n    - 互联网与万维网之比较，21\n    - 编程，22\n- 第七章：JavaScript，23\n\
    \    - 高级语言，23\n    - 无类型，24\n    - 解释型，27\n    - 运行时，28\n    - 综合运用，29\n- 第八章：算法，30\n\
    \    - 结果，31\n    - 有限时间，31\n    - 有序，32\n    - 有效可计算，32\n    - 明确无误，32\n- 第九章：程序的五个要素，34\n\
    \    - 入口，34\n    - 控制/分支，34\n    - 变量，35\n    - 子程序，40\n    - 出口，41\n    - 小结，41\n\
    - 第十章：编程语言类型，42\n- 第十一章：HTML与CSS，44\n    - HTML，44\n    - CSS，44\n    - JavaScript的历史，45\n\
    \    - 值类型，46\n\n# 第十二章：编程技巧，47\n\n挑战，47\n\n# 第十三章：首次编程任务，48\n\n- HTML，48\n- 标签，48\n\
    - 元素，49\n- Notepad++，49\n- HTML中的“你好，世界”，50\n- 在线图像，51\n- 计算机图像，52\n- JavaScript中的“你好，世界”，54\n\
    - Window.Alert()，56\n- Document.Write()，57\n- 章节末挑战，57\n\n# 第十四章：变量与字符串，58\n\n\
    - 赋值运算符，58\n- 创建字符串，58\n- 连接字符串，59\n- 多个变量，60\n- Str.FontColor(\"\")，60\n- 章节末挑战，61\n\
    \n# 第十五章：表达式与语句，62\n\n- 章节末挑战，63\n\n# 第十六章：函数，64\n\n- <p> 元素，64\n- Ids，65\n- Document.GetElementById，66\n\
    - += 运算符，67\n- 章节末挑战，67\n\n# 第十七章：数字，68\n\n- 减法，69\n- 乘法，69\n- 除法，69\n- 多个算术运算符，69\n\
    - 求模运算符，70\n- 一元与二元运算符，70\n- 自增运算符，71\n- Math.Random()，72\n- 章节末挑战，73\n\n# 第十八章：JavaScript对象，74\n\
    \n- 字典，74\n- 赋值多个值，76\n- 文字运算符，77\n- Typeof 运算符，77\n- 章节末挑战，78\n\n# 第十九章：浮点数，79\n\
    \n- 其他数字，80\n- 章节末挑战，82\n\n# 第二十章：布尔逻辑，83\n\n- Console.Log 方法，86\n- 类型强制转换，87\n\
    - 章节末挑战，87\n\n# 第二十一章：比较运算符，88\n\n- 章节末挑战，90\n\n# 第二十二章：逻辑运算符，91\n\n# 第二十三章：三元运算符，94\n\
    \n- 章节末挑战，95\n\n# 第二十四章：面向对象编程，96\n\n- 构造函数，97\n- 关键字，98\n- 保留关键字，99\n- 章节末挑战，99\n\
    \n# 第二十五章：标识符与字面量，100\n\n- 嵌套函数，100\n- 作用域，101\n- 章节末挑战，103\n\n# 第二十六章：条件语句，104\n\
    \n- Else 语句，104\n- Else If 语句，105\n- 章节末挑战，106\n\n# 第二十七章：字符串方法，107\n\n- Concat()\
    \ 方法，107\n- Slice() 方法，107\n- 章节末挑战，108\n\n# 第二十八章：数字方法，109\n\n- 章节末挑战，109\n\n\
    # 第二十九章：最终挑战，110\n\n- 最终挑战，112\n\n# 第三十章：恭喜！，113\n\n- 索引，115\n- 其他读物，117\n\n#\
    \ 第一章\n## 欢迎\n\n欢迎来到The Tech Academy的《几小时内学会JavaScript编程基础》一书！\n\n现在，我们确定你很想立刻投入编程，但我们会先介绍一些信息，以确保你做好充分准备。事实上，直到本书的第十三章，你才会开始编写任何代码。\n\
    \n在深入实践之前，似乎要读很多内容，但这是值得的。让我们把这比作另一门学科：如果你无法定义重要术语——比如方向盘、油门踏板或刹车踏板，开车会有多难？所以，请耐心花些时间学习一些基础知识，这将为你接下来的冒险打下良好基础。\n\
    \n我们试图定义本书中使用的所有技术术语，但如果你遇到任何不理解的术语，请在The Tech Academy的《技术基础词典》（可在亚马逊上购买）中查阅。\n\
    \nThe Tech Academy是一所位于俄勒冈州波特兰市的技术学校，在全球多个地方设有校区。我们专注于编程训练营（旨在为毕业生准备入门级技术职位的强化培训项目，可在几个月内完成）。我们还为企业提供定制培训，并出版了几本书。\n\
    \n虽然我们很想在本书中告诉你关于计算机和技术的一切，但我们只会介绍绝对必要的信息。如果你有兴趣了解计算机具体如何工作，我们推荐阅读我们的书《你并不笨——计算机与科技简化版》，可在亚马逊上购买。\n\
    \n我们的教育理念是*假设学生没有任何先验知识*。这意味着我们的培训内容，包括这本书，是为绝对初学者编写的。我们假设你从未编写过代码，也不知道基本的技术术语——这确保了所有内容都不会超出你的理解范围，你在阅读时也不会迷失。\n\
    \n你即将亲身体验The Tech Academy的教育方法：我们将从定义书名中使用的技术术语开始本书！\n\n## 编程\n\n编程是指向计算机输入指令以使其执行指定动作的行为。计算机是一种特殊类型的机器。\n\
    \n机器是人类为了完成工作而制造的设备（有目的的工具；工具）。它们通常由耐用材料如木材、塑料和金属制成。通常它们有一些可移动部件和一些不可移动部件；有时它们根本没有可移动部件。它们接收某种能量来完成工作。\n\
    \n使人区别于动物的一个特征是他们创造复杂机器的能力。\n\n通常人们创造机器是因为有些工作他们想做，而机器可以帮助他们完成。机器提供的帮助可能是更快地完成工作、以更少的错误完成工作，或者几乎不间断地完成工作，无需停下来进食或睡眠。人们制造机器还有其他原因，但通常归结为在给定时间内以更少的错误完成更多工作。\n\
    \n随着时间的推移，机器通常会得到改进或改变，以使其更有效或响应其使用领域的社会变化。\n\n汽车、飞机、电话和烤箱都是机器。\n\n再说一次，计算机只是另一种机器——它是人们为了完成工作而制造的设备。\n\
    \n让我们更仔细地看看计算机。\n"
