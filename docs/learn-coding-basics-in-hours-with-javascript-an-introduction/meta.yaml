    \ 2 = \" + Simple_Math;\n```\n\n保存你的 JavaScript 代码并执行 HTML 文件。\n\n### 乘法\n\n要进行乘法运算，按如下方式编辑你的\
    \ JavaScript 代码：\n\n```javascript\nvar Simple_Math = 6 * 8;\ndocument.getElementById(\"\
    Math\").innerHTML = \"6 X 8 = \" + Simple_Math;\n```\n\n保存你的 JavaScript 代码并执行\
