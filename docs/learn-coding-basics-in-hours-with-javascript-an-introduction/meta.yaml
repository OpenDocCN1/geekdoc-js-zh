  md: '# CHAPTER SEVEN JAVASCRIPT


    JavaScript is a great language to use for an introduction to coding and tops some
    lists as the most popular programming language in the world.


    One of the main uses of JavaScript is to make websites more dynamic (describing
    websites that have content that changes based on user action or other factors,
    rather than being static in appearance and content).


    JavaScript can also make programs and websites more interactive, such as making
    it so videos start to play as soon as a user moves their mouse over them.


    There are many other uses for JavaScript; it is used in the creation of many different
    types of computer programs.


    ![](img/33a81fac26246d29975692e5ecda6e53_24_0.png)


    So, what is the definition of JavaScript? Well, according to one of the top online
    technical dictionaries, “JavaScript is a high-level, untyped, and interpreted
    runtime language.”


    Right off the bat, that explanation shows why we made this book. That definition
    makes no sense. So, in order to comprehend what is being said there, let’s dissect
    the definition.


    # HIGH-LEVEL


    Machine language that we discussed earlier (1s and 0s) is considered a “low-level
    language.” This is due to the fact that it is close to the hardware of the computer
    in that it directly represents the on or off states used in both the computer
    instructions and the data the computer operates on.


    The opposite of a low-level language is a high-level language – code written in
    a way that is easier to read and write because it somewhat resembles English,
    such as:


    ```

    Print “Hello”;

    ```'
