    # SUBPROGRAMS


    As covered earlier, computer programs are generally executed in order, from the
    start point to the end point. This is called the “path of execution.”


    The main series of instructions in a program is called the “main program.”


    It is sometimes valuable to create another program that can be used by the main
    program as needed. This is called a subprogram. It is no different from any other
    program – it is made up of the same elements (entrance point, variables, control
    and branching statements, and exit point).'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'However, a subprogram isn''t used all by itself. Instead, the main program
    can execute the subprogram as needed. Here, the main program stops executing,
    and the subprogram starts executing. When the subprogram is done executing, the
    main program continues on where it left off.


    This is referred to as “calling” the subprogram – that is, the main program calls
    the subprogram, the subprogram starts and stops, and the main program continues
    on where it left off before calling the subprogram.


    This is useful in creating programs because the computer programmer doesn''t have
    to enter the instructions of the subprogram over and over. You only type them
    in once, and then when you need that subprogram to be called by the main program,
    you only have to type in one instruction – the instruction to call the subprogram.
    This lets you reuse the instructions you entered in for the subprogram rather
    than rewriting them.


    # EXIT


    Every program must have an instruction that tells the computer that the program
    is no longer running. Much like the Entrance, the exact instruction for this varies
    based on the computer language used, but all computer languages will have this
    type of instruction.


    # SUMMARY


    The fundamental elements of any computer program are:


    +   1. An entrance point – the first instruction to be performed.

    2. Control and branching statements – to control what is done and in what order.

    3. Variables – changeable items, held in computer memory, for the program to use
    as it operates.

    4. Subprograms – repeatable sets of computer instructions that act like mini-programs.
    The main program can use them as needed.

    5. An exit point – the last instruction to be completed, so the computer knows
    the program isn''t operating anymore.


    Next we will discuss types of programming languages.'
  merge: -1
  pgno: 42
