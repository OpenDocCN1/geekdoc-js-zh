  mdcn: "\n## 值类型\n\n几乎每种计算机编程语言都内置了某些数据类型，并允许计算机程序员创建其他类型的数据。在 JavaScript 中，这些不同类型的数据被称为“值”。\n\
    \nJavaScript 中有六种值类型：\n\n- 1. 字符串（表示文本或一系列文本的数据）\n- 2. 数字\n- 3. 布尔值（真或假的陈述）\n\
    - 4. 对象（具有状态和行为的事物）\n- 5. 函数（一段组织化、可复用的计算机代码，用于执行单个相关操作——也称为子程序或例程）\n- 6. 未定义的值\n\
    \n你将在本书中学习如何使用这些值类型。\n\n我们离编写代码已经很近了！让我们回顾一些技巧，帮助你学习本书。\n\n## 第十二章\n### 编码技巧\n\
    \n如果你在学习本书时遇到任何问题，这里有一些技巧：\n\n- 1) 确保你理解所有使用的单词和术语——弄清楚你不理解的任何内容。\n- 2) 确保你的代码完全按照这里所写的方式编写。代码中的一个小错误，比如缺少一个逗号，都可能破坏整个程序。代码必须精确，程序才能正确运行，因此务必仔细检查你的代码是否有错误。\n\
    - 3) 在网上搜索解决方案。\n- 4) 你也可以联系 The Tech Academy 寻求帮助——learncodinganywhere.com\n\n\
    ### 挑战\n\n在一些章节的末尾，我们会有一个“章节末挑战”。这些是你将本章所学内容整合起来的机会。有时你也会被要求自己找出问题的解决方案。在职的软件开发人员经常被分配他们以前从未做过的项目和任务。这项工作的一个关键要素是在网上研究解决方案。你会发现本书中的一些挑战会要求你做我们尚未教你的一些事情。这是故意为之的。我们希望你获得在网上查找新数据并自己解决问题的经验。用不止一位软件开发人员的话说：“我靠谷歌搜索拿工资！”\n\
    \n其中一些挑战将重复你已经执行过的任务。这样做的原因是：\n\n- a. 为你提供创建自己方法的机会，以及\n- b. 通过重复让你更好地理解和记住代码。\n\
    \n恭喜你完成了这些入门章节！现在我们将开始编码！\n\n## 第十三章\n### 首次编码任务\n\n这是你的第一个任务：\n\n在此处下载并安装 Notepad++：https://notepad-plus-plus.org/\n\
    \n你将在代码编辑器 Notepad++ 中编写代码。\n\n注意：如果你使用的是 Mac 电脑，可以使用不同的代码编辑器——例如 Brackets。\n\n\
    ### HTML\n\n在 JavaScript 中编写代码之前，你必须熟悉一些基本的 HTML。\n\nHTML 中的标记指令为计算机提供关于文档元素的数据*关于*——文本、图像、视频等。当文档实际显示在屏幕上时，这些标记指令不会显示在屏幕上；相反，它们用于控制文档的实际内容*如何*显示。\n\
    \n### 标签\n\nHTML 使用标签。标签是指定 HTML 文档中内容标记的方式。\n\n基本原则是：如果你想影响内容的前后放置特殊指令，另一个程序可以区分指令和内容，然后以指定的方式呈现数据。\n\
    \n因此，标签通常由两部分组成：开始标签和结束标签。内容将放在这两个标签之间。开始标签表示标记指令的开始，结束标签表示结束。\n\n开始标签写为一个“小于”角括号（<），后跟标记指令，然后是一个“大于”角括号（>）。\n\
    \n一个例子是用于使文本**粗体**的标签。实际指令是单词“strong”，意思是“使此标签控制的文本突出显示”，通常通过加粗。开始的“strong”标签看起来像这样：\n\
    \n```\n<strong>\n```\n\n你需要指定一个结束标签，这样计算机程序才知道何时停止使文本加粗。这就是结束标签的作用。结束标签使用与开始标签相同的指令，但在指令前放置一个正斜杠（/）（</>）。\n\
    \n结束的“strong”标签看起来像这样：\n\n```\n</strong>\n```\n\n将所有部分组合在一起，如果你想强调一个引语，你会这样编写\
    \ HTML：\n\n```\n<strong>\"教育是你能用来改变世界的最强大的武器。\"</strong> -纳尔逊·曼德拉\n```\n\n此代码的输出将如下所示：\n\
    \n> \"教育是你能用来改变世界的最强大的武器。\"\n> -纳尔逊·曼德拉\n\n### 元素\n\n标签和编写在它们之间的代码称为“元素”。下面是一个展示这一点的示意图：\n\
    \n![](img/33a81fac26246d29975692e5ecda6e53_50_0.png)\n\n在本章中，我们将一起编写 HTML 和 JavaScript。这样，你就可以看到它们如何协同工作。此外，当你声明自己懂\
    \ JavaScript 时，会默认你也懂 HTML。\n\n### NOTEPAD++\n\n现在 Notepad++ 已经安装在你的机器上，请执行以下操作：\n\
    \n启动 Notepad++\n\n点击菜单栏上的“文件”并打开一个新文件（或直接按 Ctrl + N）。\n\n### HTML 中的 “HELLO, WORLD”\n\
    \n开发人员学习新语言时通常编写的第一个代码是让计算机显示文本：“Hello world.” 我们将首先使用 HTML 来完成此操作。\n\n每个包含 HTML\
    \ 代码的 HTML 文档顶部都有 <!DOCTYPE HTML> 声明。这不是一个标签。它是给浏览器的指令，告诉它你正在使用 HTML——还有其他 doctypes（文档类型）可以使用，因此明确说明这一点有助于浏览器。\n\
    \n<html> 标签插入在代码的开头，你所有的 HTML 代码都包含在它和结束标签（</html>）之间。\n\n<body> 标签表示你可以添加 HTML\
    \ 文档内容的位置——例如文本、图像、视频、列表、链接等。\n\n在 Notepad++ 中，编写以下代码：\n\n```\n<!DOCTYPE HTML>\n\
    <html>\n    <body>\n        你好，世界！\n    </body>\n</html>\n```\n\n提醒一下，你编写的代码中的“/”符号表示“结束标签”。\n\
    \n通过点击“文件”，然后“另存为”来保存此文档。将文档命名为 Test.html，并确保在“保存类型”下点击“超文本标记语言”。在所有 HTML 代码文件的末尾包含\
    \ .html 非常重要，因为如果你不这样做，你的计算机将不会识别它是一个 HTML 文件，你的代码将无法运行。另外，确保将此文件保存到你的桌面。\n\n\
    有多种方法可以运行你的代码。最简单的方法之一是将 HTML 文件拖放到打开的 Google Chrome 窗口中，如下所示：\n\n![](img/33a81fac26246d29975692e5ecda6e53_51_0.png)\n\
    \n请注意，上图中的文件图标（文件名上方的符号）是 Google Chrome 的标志，这是因为照片拍摄所用的计算机上，Google Chrome 被设置为打开\
    \ HTML 文件的默认程序。你的文件图标可能相同也可能不同。\n\n你也可以右键单击桌面上的文件，选择“打开方式”，然后导航到 Google Chrome。\n\
    \n从现在起，在本书中，当我们说“运行”或“执行”你的代码时，我们指的是“在 Google Chrome 中打开它”，这样你就可以在浏览器中看到你的网页。\n\
    \n对于使用 Brackets 的 Mac 用户，你也可以点击“文件”，然后“实时预览”来运行你的代码。\n\n现在执行以下操作：\n\n运行你的代码。\n\
    \n恭喜你！你让浏览器显示了文本“你好，世界！”\n\n### 在线图像\n\n统一资源定位符（URL）是 Web 资源的唯一名称。“Web 资源”是可以在互联网上找到的可识别事物。URL\
    \ 最常见的例子是一个网站——https://www.google.com 就是一个 URL。\n\n属性是用于元素开始标签内的一个单词或短语，用于控制元素的行为。\n\
    \n例如，图像 <img> 标签允许你将图像放置在网页中。src（源）属性与此 <img> 标签一起使用，它给出了图像的位置（图像显示的来源）。\n\n你可以在以下内容中看到这一点：\n\
    \n```\n<img src=\"https://www.petmd.com/sites/default/files/petmd-cat-happy-15.jpg\"\
    >\n```\n\n在此代码中，图像标签告诉浏览器将图像放在页面的什么位置，而 src 属性给出了获取图像的位置。你可以从在线或计算机中获取（使用）图像。在上面的代码中，我们从在线获取图像。\n"
