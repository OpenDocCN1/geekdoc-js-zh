  \n# 设置 Webpack\n\nWebpack 是一个强大的模块打包器。它在配置背后隐藏了许多功能。一旦理解了它的基础知识，使用这种力量就会变得容易。。初，它可能是一个令人困惑的工具，但一旦入门，它就会变得更好。\n\
  \n在这一部分，我们将开发一个基于 Webpack 的项目配置，为 Kanban 项目以及整体 React 开发提供坚实的基础。\n\n## 1. Webpack\
  \ 对比\n\n通过将它放在历史背景中，你可以更好地理解为什么 Webpack 的方法是强大的。在过去，只需将一些脚本拼接在一起就够了。但时代已经了，现在分发你的\
  \ JavaScript 代码是一项复杂的工程。\n\n### 1.1 SPA 的兴起\n\n随着单页应用（SPA）的兴起，这个问题升级了。它们倾向于依赖许多沉重的库。你最不想做的事情就是一次性加载它们。有更好的解决方案，而\
  \ Webpack 与许多解决方案配合工作。\n\nNode.js 和 [npm](https://www.npmjs.com/)（Node.js 包管理器）的流行提供了更多背景。在\
  \ npm 之前，消费依赖非常困难。现在 npm 在前端开发中变得流行，情况发生了变化。依赖管理比以前容易得多。\n\n### 1.2 任务运行器和打包器\n\n\
  从历史上说，有很多构建系统。[Make](https://en.wikipedia.org/wiki/Make_%28software%29) 可能是最为人知的，并且仍然是一个可行选项。为了让事情更简单，出现了专门的任务运行器，如\
  \ [Grunt](http://gruntjs.com/) 和 [Gulp](http://gulpjs.com/)。通过 npm 提供的插件让这两种任务运行器都变得强大。\n\
  \n任务运行器在高层面上是很好的工具。它们允许你以跨平台的方式执行操作。当你需要将各种资产拼接在一起并产生包时，问题开始了。这就是我们拥有打包器的原因，例如 [Browserify](http://browserify.org/)\
  \ 或 [Webpack](https://webpack.github.io/)。\n\n继续这条路，[JSPM](http://jspm.io/) 将包管理直接推向浏览器。它依赖于\
  \ [System.js](https://github.com/systemjs/systemjs)，一个动态模块加载器。与 Browserify 和 Webpack\
  \ 不同的是，它在开发期间完全跳过了打包步骤。然而，你可以用它生成生产环境包。Glen Maddern 在他[关于 JSPM 的视频](https://www.youtube.com/watch?t=33&v=iukBMY4apvI)\
  \ 中进行了详细介绍。\n\n### 1.3 Make\n\n你可以说 Make 的历史非常久远。它最初发布于 1977 年。尽管它是一个旧工具，但它一直保持着相关性。Make\
  \ 允许你为各种目的编写单独的任务。例如，你可能为创建生产构建、压缩你的 JavaScript 或运行测试编写单独的任务。你可以在许多其他工具中发现同样的想法。\n\
  \n尽管 Make 主要用于 C 项目，但它与此没有任何关系。James Coglan 详细讨论了[如何将 Make 用于 JavaScript](https://blog.jcoglan.com/2014/02/05/building-javascript-projects-with-make/)。考虑下面基于\
  \ James 文章的简写代码：\n\n#### Makefile\n\n```makefile\nPATH  := node_modules/.bin:$(PATH)\n\
  SHELL := /bin/bash\n\nsource_files := $(wildcard lib/*.coffee)\nbuild_files  :=\
  \ $(source_files:%.coffee=build/%.js)\napp_bundle   := build/app.js\n\n```\n\n.PHONY:\
  \ all clean\n\nall: $(app_bundle)\n\nbuild/%.coffee\n    coffee -co $@\n\n$(app_bundle):\
  \ $(libraries)\n    uglifyjs -c $@\n\ntest: $(app_bundle)\n    phantomjs\n```\n\n\
  通过 Make，你使用 Make 特定语法建模任务。这使得它能够轻松与 Webpack 集成。\n\n### 1.4 Grunt\n\n![Grunt](img/grunt)\n\
  \nGrunt 在 Gulp 之前进入主流。它的插件架构特别促进了它的流行。与此同时，这种架构是 Grunt 的致命伤。这是一个来自 [Grunt 文档](http://gruntjs.com/sample-gruntfile)\
  \ 的示例：\n\n```javascript\nmodule.exports = function(grunt) {\n  grunt.initConfig({\n\
  \    jshint: {\n      files: ['Gruntfile.js', 'src/**/*.js', 'test/**/*.js'],\n\
  \      options: {\n        globals: {\n          jQuery: true\n        }\n     \
  \ }\n    },\n    watch: {\n      files: ['<%= jshint.files %>'],\n      tasks: ['jshint']\n\
  \    }\n  });\n\n  grunt.loadNpmTasks('grunt-contrib-jshint');\n  grunt.loadNpmTasks('grunt-contrib-watch');\n\
  \n  grunt.registerTask('default', ['jshint']);\n};\n```\n\n在这个示例中，我们定义了与 jshint\
  \ 相关的基本任务，jshint 是一种可以在 JavaScript 源代码中定位可能问题点的 检查工具。我们有一个运行 j own 的独立任务。此外，我们还有一个基于监听器的任务。当我们运行\
  \ Grunt 时，当我们编辑并保存源代码时，会在终端中实时收到警告。\n\n在实践中，你将为各种目的编写许多小任务，例如构建项目。示例显示了这些任务是如何构建的。\n\
  \nGulp 采取了不同的方法。与其依赖每个插件的配置，你处理的是实际代码。Gulp 构建在经过测试且有效的管道（piping）概念之上。如果你熟悉 Unix，这里是相同的想法。你只需要有源。过滤器对源执行操作（例如转换为\
  \ JavaScript）。最后，结果被传递给汇（例如你的构建目录）。\n\n\n\n\n\n```javascript\nvar gulp = require('gulp');\n\
  var coffee = require('gulp-coffee');\nvar concat = require('gulp-concat');\nvar\
  \ uglify = require('gulp-uglify');\nvar sourcemaps = require('gulp-sourcemaps');\n\
  var del = require('del');\n\nvar paths = {\n    scripts: ['client/js/**/*.coffee',\
  \ '!client/external/**/*.coffee']\n};\n\n// 并不是所有任务都需要使用流\n// 一个 gulpfile 只是另一个\
  \ node 程序，你可以使用所有在 npm 上可用的包\ngulp.task('clean', function(cb) {\n  // 你可以像使用 `gulp.src`\
  \ 一样使用多个 glob 模式\n  del(['build'], cb);\n});\n\ngulp.task('scripts', ['clean'],\
  \ function() {\n  // 压缩并复制所有 JavaScript（除供应商脚本外）\n  // 并贯穿始终 sourcemaps\n  return\
  \ gulp.src(paths.scripts)\n    .pipe(sourcemaps.init())\n      .pipe(coffee())\n\
  \      .pipe(uglify())\n      .pipe(concat('all.min.js'))\n    .pipe(sourcemaps.write())\n\
  \    .pipe(gulp.dest('build/js'));\n});\n\n// 当文件更改时重新运行任务\ngulp.task('watch', function()\
  \ {\n  gulp.watch(paths.scripts, ['scripts']);\n});\n\n// 默认任务（当从命令行运行 `gulp` 时被调用）\n\
  gulp.task('default', ['watch', 'scripts']);\n```\n\n由于配置是代码，当你遇到问题时，总是可以对其进行黑客（hack）。你可以将现有的\
  \ Node.js 包封装为 Gulp 插件等。与 Grunt 相比，你对发生的情况有更清晰的认识。不过，对于简单的任务，你仍然需要编写大量的样板代码。这就是一些新方法出现场的地方。\n\
  \n### 1.6 Browserify\n\n![Browserify](img/browserify.png)\n\nBrowserify\n\n处理 JavaScript\
  \ 模块一直是个问题。该语言本身直到 ES6 之前实际上并没有模块的概念。因此，在浏览器环境方面，我们一直停留在 90 年代。目前已经提出了许多解决方案，包括\
  \ [AMD](http://requirejs.org/docs/whyamd.html)。\n\n在实践中，仅仅使用 Node.js 格式 CommonJS\
  \ 并让工具处理其余部分就是很有用的。它的优势在于，你通常可以挂钩 npm 并避免重复轮子。\n\n[Browserify](http://browserify.org/)\
  \ 是解决模块问题的一种方案。它提供了一种将 CommonJS 模块打包在一起的方法。你可以将其与 Gulp 结合。还有一些较小的转换工具允许你超越基础用法。例如，[watchify](https://www.npmjs.com/package/watchify)\
  \ 提供了一个文件监听器，可以在开发期间为你创建构建包。这将节省一些精力，而且无疑在某种程度上是一个很好的解决方案。\n\nBrowserify 的 生态系统由许多小模块组成。通过这种方式，Browserify\
  \ 遵循了 Unix 哲学。相比 Webpack，Browserify 更容易采用，事实上，它是后者的一个良好替代品。\n\n### 1.7 Webpack\n\
  \n![webpack](img/webpack.png)\n\nwebpack\n\n你可以说 Webpack（或简称 `webpack`）比 Browserify\
  \ 采取了更具单体的方法。Browserify 由多个小工具组成，而 Webpack 自带一个提供许多箱箱用功能的核心。该核心可以使用特定的 `loaders`\
  \ 和 `plugins` 进行扩展。\n\nWebpack 将遍历你项目中的 `require` 语句并生成你定义的构建包。你甚至可以使用自定义的 `require.ensure`\
  \ 语句以动态方式加载依赖。loader 机制也适用于 CSS，并支持 `@import`。还有针对特定任务的插件，例如压缩压缩、本地化、热加载等。\n\n给你举个例子，`require('style!css!./main.css')`\
  \ 加载了 `main.css` 的内容，并从右到左通过 CSS 和 style loader 进行处理。鉴于像这样的声明（如上所示）将源代码与 Webpack\
  \ 绑定在了一起，因此最好在 Webpack 配置中设置这些 loader。以下是一个根据 [webpack 官方教程](http://webpack.github.io/docs/tutorials/getting-started/)\
  \ 适配的示例配置：\n\n**webpack.config.js**\n\n```javascript\nvar webpack = require('webpack');\n\
  \nmodule.exports = {\n  entry: './entry.js',\n  output: {\n    path: __dirname,\n\
  \    filename: 'bundle.js'\n  },\n  module: {\n    loaders: [\n      {\n       \
  \ test: /\\.css$/,\n        loaders: ['style', 'css']\n      }\n    ]\n  },\n  plugins:\
  \ [\n    new webpack.optimize.UglifyJsPlugin()\n  ]\n};\n```\n\n由于配置是用 JavaScript\
  \ 编写的，它是非常灵活的。只要是 JavaScript，Webpack 都能接受。\n\n这种配置模型可能会让 Webpack 有时显得有些晦涩。理解它在做什么可能是困难的。这对于更复杂的案例尤为如此。我与\
  \ Christian Alfoni 一起编写了一本 [webpack 菜谱](https://christianalfoni.github.io/react-webpack-cookbook/)，在涉及特定问题时提供了更详细的细节。\n\
  \n### 1.8 JSPM\n\n![JSPM](img/jspm.png)\n\nJSPM\n\n使用 JSPM 与早期的工具非常不同。它自带一个自己的 CLI\
  \ 工具用于。\n\n### 1.9 为什么要使用 Webpack?\n\n为什么相比 Gulp 或 Grunt 要使用 Webpack？这不是一个非此即一的命题。Webpack\
  \ 处理打包的难题，但还有更多。\n\n#### 热模块替换 (Hot Module Replacement)\n\n你可能熟悉某些工具，如 [LiveReload](http://liveeload.com/)\
  \ 或 [Browsersync](http://www.browsync.io/)。这些工具会在你做出更改时刷新浏览器。HMR 则更进一步。在 React 的情况下，它允许应用程序保持状态。这听起来很简单，但在实践中影响巨大。注意\
  \ Browserify 可以通过 [livereload](https://github.com/milankinen/livereload) 使用 HMR，所以这不是\
  \ Webpack 特有的。\n\n#### 包分割 (Bundle Splitting)\n\n除了 HMR 功能，Webpack 的打包能力也是强大的。它允许以各种方式拆分包。你甚至可以随着应用程序的发展动态地加载它们。这种懒加载非常有用，特别是对于较大的应用程序。你可以根据需要加载依赖。\n\
  \n#### 资源哈希 (Asset Hashing)\n\n通过 Webpack，你可以轻松地为每个包名称注入哈希（例如 `app.d587bbd6e837f5accd.js`）。这允许在做出更改时失效包。在理想情况下，包拆分允许客户端只加载一小部分数据。\n\
  \n#### Loader 和插件\n\n所有这些小功能累积起来是巨大的。令人的是，你可以开箱即用完成很多工作。如果你缺少某些功能，有可用的 loader 和插件供你使用。\n\
  \nWebpack 带有显著的学习曲线。尽管如此，它仍然值得学习的工具，因为从长远来看它节省了大量的时间精力。为了更好地了解它与其它工具的对比，请查看[官方对比](https://webpack.github.io/docs/comparison.html)。\n\
  \n### 1.10 Webpack 支持的模块格式\n\nWebpack 允许你使用不同的模块格式，但在底层它们都以相同的方式工作。\n\n#### CommonJS\n\
  \n如果你用过 Node.js，你可能已经熟悉 CommonJS 了。这是一个简短的示例：\n\n```javascript\nvar MyModule = require('./MyModule');\n\
  \n// 在模块根部导出\nmodule.exports = function() { ... };\n\n// 或者，导出单个函数\nexports.hello\
  \ = function() {...};\n```\n\n#### ES6\n\n\n\n\nES6 是我们自 1995 年以来一直期待的格式。如你所见，它有点像\
  \ CommonJS，而且非常清晰！\n\n```\nimport MyModule from './MyModule.js';\n\n// 在模块根部导出\n\
  export default function () { ... };\n\n// 或者作为模块函数导出，\n// 每个模块可以有多个这样的函数\nexport\
  \ function hello() {...};\n```\n\n该格式在 `Language Features` 附录中有更详细的讨论。\n\n#### AMD\n\
  \nAMD，即异步模块定义，是作为一种替代方案而发明的。它引入了一个 `define` 包装器：\n\n```\ndefine(['./MyModule.js'],\
  \ function (MyModule) {\n  // 在模块根部导出\n  return function() {};\n});\n\n// 或者\ndefine(['./MyModule.js'],\
  \ function (MyModule) {\n  // 作为模块函数导出\n  return {\n    hello: function() {...}\n\
  \  };\n});\n```\n\n顺便一下，你可以在包装器内这样使用 `require`：\n\n```\ndefine(['require'], function\
  \ (require) {\n  var MyModule = require('./MyModule.js');\n\n  return function()\
  \ {...};\n});\n```\n\n这种方法确实消消除了一些杂乱。你最终仍然会得到一些可能感觉冗余的代码。鉴于现在有了 ES6，除非你真的需要，否则使用\
  \ AMD 可能已经没有意义了。\n\n#### UMD\n\nUMD，通用模块定义，将这一切推向了新的高度。它是一个怪物级的格式，旨在让上述格式相互兼容。这里我就不折磨你的眼睛了。永远不要自己手写它，把它交给工具即可。如果这没能吓跑你，请查看[官方定义](https://github.com/umdjs/umd)。\n\
  \nWebpack 可以为你生成 UMD 包装器（`output.libraryTarget: 'umd'`）。这对于库的作者特别有用。我们稍后会在 `Authoring\
  \ Packages` 章节详细讨论 npm 和库的编写时回到这一点。\n\n### 1.11 结论\n\n我希望这一章帮助你理解为什么 Webpack 是一个值得学习的价值工具。它解决了大量的常见\
  \ Web 开发问题。如果你熟悉它，它将为你节省大量时间。在接下来的章节中，我们将更详细地研究 Webpack。你将学习开发一个简单的开发配置。我们还将开始我们的看板应用。\n\
  \n你可以，可能也应该配合其他工具使用 Webpack。它不会解决所有问题。然而，它确实解决了复杂的打包问题。这让开发过程中少了一个顾虑。正如我们很快看到的，仅仅使用\
  \ `package.json`、`scripts` 和 Webpack 就能带你走很远。\n\n## 2. 使用 Webpack 进行开发\n\n如果你不是那些喜欢跳过介绍的人，你可能已经猜到\
  \ Webpack 是什么。简单来说，它是一个模块打包器。它接收一组资源并输出你可以交付给的资源。\n\n这听起来很简单，但在实践中，这可能是一个复杂且混乱的过程。你绝对不想自己处理所有的细节。这正是\
  \ Webpack 的用场。接下来，我们将设置 Webpack 并让你的第一个项目在开发模式下运行。\n\n### 2.1 设置项目\n\nWebpack 是依赖于\
  \ [Node.js](http://nodejs.org/) 的工具之一。确保你已经安装了它，并且在终端可以使用 `npm`。为你的项目设置目录，进入该目录，执行\
  \ `npm init` 并填写一些详细信息。你可以直接对每一项按 `return` 键，它就可以工作。以下是命令：\n\n```\nmkdir kanban_app\n\
  cd kanban_app\nnpm init -y # -y 提供默认的 *package.json*，跳过以获得更多控制\n```\n\n结果是，你应该在项目根目录下有一个\
  \ `package.json`。你仍然可以手动调整它以进行进一步更改。我们将通过 `npm` 工具进行一些更改，但按照你的喜好调整文件也是好的。官方文档详细解释了各种\
  \ [package.json ](https://docs.npmjs.com/files/package.json)。我会在本书的后面介绍一些实用的库编写相关技巧。\n\
  \n#### 设置 Git\n\n如果你喜欢版本控制（你本应该喜欢），现在是设置仓库的好时机。你可以随着项目的进展创建提交。\n\n如果你正在使用 git，我建议在项目根目录设置一个\
  \ `.gitignore`：\n\n`.gitignore`\n\n```\nnode_modules\n```\n\n至少你应该在这里包含 `node_modules`，因为你可能不想让它进入版本控制。这样做是因为，由于某些模块需要按平台进行编译，协作会变得相当混乱。理想情况下，你的\
  \ `git status` 应该是干净的。你可以根据需要随时扩展 `.gitignore`。\n\n### 2.2 安装 Webpack\n\n接下来，你应该安装\
  \ Webpack。我们将进行本地安装并将其保存为项目依赖。这将允许我们为每个项目维护 Webpack 的版本。执行\n\n```\nnpm i webpack\
  \ --save-dev\n```\n\nnpm 维护一个目录，在其中安装包可能的可执行文件。你可以使用 `npm bin` 显示确切路径。它可能指向 `.../node_modules/.bin`。尝试在终端通过\
  \ `node_modules/.bin/webpack` 或类似的命令从那里执行 Webpack。\n\n你应该会看到版本号、一个指向命令行界面指南的链接以及长长的选项列表。我们不会使用其中大部分选项，但了解它们是好的。\n\
  \n```\nwebpack $ node_modules/.bin/webpack\n```\n### ..3 目录结构\n\n由于只有 `package.json`\
  \ 的项目很无聊，我们应该设置一些具体的内容。为了开始，我们可以实现一个加载 JavaScript 的小型网站。建立如下结构：\n\n*   /app\n  \
  \  *   index.js\n    *   component.js\n*   /build\n    *   index.html\n*   package.json\n\
  *   webpack.config.js\n\n### 2.4 设置资源\n\n既然你永远厌厌 `Hello world`，那我们就建立它的变体吧。建立这样一个组件：\n\
  \n**app/component.js**\n\n```\nmodule.exports = function () {\n  var element = document.createElement('h1');\n\
  \n  element.innerHTML = 'Hello world';\n\n  return element;\n};\n```\n\n接下来，我们需要为应用程序准备入口。它将简单地\
  \ `require` 我们的组件并通过 DOM 渲染它：\n\n**app/index.js**\n\n```\nvar component = require('./component');\n\
  var app = document.createElement('div');\n\ndocument.body.appendChild(app);\n\n\
  app.appendChild(component());\n```\n\n我们还需要一些 HTML 来加载生成的包：\n\n**build/index.html**\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <title>Kanban app</title>\n  </head>\n  <body>\n    <div id=\"app\"></div>\n\
  \n    <script src=\"./bundle.js\"></script>\n  </body>\n</html>\n```\n\n\n\n\n\n\
  我们需要告诉 Webpack 如何处理我们刚刚设置的资源。为此，我们将开发一个 `webpack.config.js` 文件。Webpack 及其开发服务器将通过约定发现此文件。\n\
  \n为了将我们的应用程序映射到 `build/bundle.js`，我们需要这样的配置：\n\n`webpack.config.js`\n\n```\nconst\
  \ path = require('path');\n\nconst PATHS = {\n  app: path.join(__dirname, 'app'),\n\
  \  build: path.join(__dirname, 'build')\n};\n\nmodule.exports = {\n  // Entry 接受一个路径或一个入口对象。我们将使用\
  \ \n  // 后者形式，因为它在处理更复杂的配置时非常方便。\n  entry: {\n    app: PATHS.app\n  },\n  output:\
  \ {\n    path: PATHS.build,\n    filename: 'bundle.js'\n  }\n};\n```\n\n`entry`\
  \ 路径可以使用相对路径给出。[[上下文](https://webpack.github.io/docs/configuration.html#context)\
  \ 字段可以用于配置该查找。鉴于很多地方都期望绝对路径，我更倾向于处处使用绝对路径以避免混乱。\n\n我喜欢使用 `path.join`，但 `path.resolve`\
  \ 是一个很好的替代方案。`path.resolve` 等同于通过 `cd` 遍历文件系统。`path.join` 仅提供连接功能。具体细节请参阅 [Node.js\
  \ path API](https://nodejs.org/api/path.html)。\n\n如果你执行 `node_modules/.bin/webpack`，你应该能看到如下的输出：\n\
  \n```\nHash: 2dca5a3850ce5d2de54c\nVersion: webpack 1.12.13\nTime: 85ms\n    Asset\
  \     Size  Chunks             Chunk Names\nbundle.js  1.75 kB       0  [emitted]\
  \  app\n   [0] ./app/index.js 144 bytes {0} [built]\n   [1] ./app/component.js 136\
  \ bytes {0} [built]\n```\n\n这意味着你在输出目录中生成了一个构建产。你可以直接通过浏览器打开 `build/index.html`\
  \ 文件来检查结果。在 OS X 上，运行 `open ./build/index.html` 即可。\n\n### 2.6 添加构建快捷键\n\n鉴于执行 `node_modules/.bin/webpack`\
  \ 有些繁琐，我们应该对其做些处理。npm 和 `package.json` 在经过配置后可以兼任任务运行器。进行如下调整：\n\n`package.json`\n\
  \n```\n...\n\"scripts\": {\n  \"build\": \"webpack\"\n},\n...\n```\n\n你可以通过 `npm\
  \ run` 执行这种方式定义的脚本。如果你现在执行 `npm run build`，你应该能像之前一样在输出目录中获得构建产物。\n\n这之所以有效，是因为\
  \ npm 会临时地将 `node_modules/.bin` 添加到路径中。因此，我们不需要编写 `\"build\": \"node_modules/.bin/webpack\"\
  `，只需编写 `\"build\": \"webpack\"` 即可。除非 Webpack 安装在项目中，否则它可能会指向一个可能的全局安装。这可能会导致混淆。由于这个原因，请优先选择本地安装而非全局安装。\n\
  \n任务运行器（如 Grunt 或 Gulp）允许你以跨平台的方式实现相同的结果。如果你像这样处理 `package.json`，你可能需要更加小心。优点是，这是一种非常轻量的方法。为了保持简单，我们将依赖于它。\n\
  \n### 2.7 设置 `webpack-dev-server`\n\n由于通过这种构建脚本开发应用程序最终会变得无聊，Webpack 特别为开发提供了更整洁的手段。`webpack-dev-server`\
  \ 是一个运行在内存中的开发服务器。在你开发应用程序时，它会自动刷新浏览器中的内容。这使其大致等同于如 [LiveReload](http://livereload.com/)\
  \ 或 [Browsersync](http://www.browsersync.io/) 等工具。\n\nWebpack 相比这些工具的最大优势是热模块替换（HMR）。简而言之，它提供了一种在不完全刷新的情况下更新浏览器状态的方法。我们将在介绍\
  \ React 设置时详细讨论它。\n\n要开始使用 `webpack-dev-server`，请在项目根目录下执行\n\n```\nnpm i webpack-dev-server\
  \ --save-dev\n```\n\n以安装服务器。\n\n与上面一样，我们需要在 `package.json` 的 `scripts` 部分定义一个入口点。由于我们的\
  \ `index.html` 位于 `./build` 之下，我们应该让 `webpack-dev-server` 从那里提供内容。我们稍后会将此移动到 Webpack\
  \ 配置中，但目前这样做：\n\n`package.json`\n\n```\n...\n\"scripts\": {\n  \"build\": \"webpack\"\
  \n  \"build\": \"webpack\",\n  \"start\": \"webpack-dev-server --content-base build\"\
  \n},\n...\n```\n\n如果你现在执行 `npm run start` 或 `npm start`，你应该会在终端看到类似如下的内容：\n\n```\n\
  > webpack-dev-server\n\nhttp://localhost:8080/\nwebpack result is served from /\n\
  content is served from .../kanban_app/build\n404s will fallback to /index.html\n\
  \nwebpack: bundle is now VALID.\n```\n\n输出意味着开发服务器正在运行。如果你在浏览器中打开 `http://localhost:8080/`，你应该能看到内容。如果你尝试修改代码，你应该会在终端看到输出。问题是浏览器在不进行强制刷新的情况下无法捕捉这些变化。这是我们接下来需要解决的问题。\n\
  \n![Hello world](img/hello_01.png)\n\nHello world\n\n#### 分拆配置\n\n由于开发设置有其特定的需求，我们需要拆分\
  \ Webpack 配置。由于 Webpack 配置只是 JavaScript，有许多方法可以实现这一点。至少以下方法是可行的：\n\n*   在多个文件中维护配置，并通过\
  \ `--config` 参数将 Webpack 指向每个文件。通过模块导入共享配置。你可以在 [webpack/react-starter](https://github.com/webpack/react-starter)\
  \ 中看到这种方法的实际应用。\n\n*   将配置推送到库中然后由你消费。示例：[HenrikJoreteg/hjs-webpack](https://github.com/HenrikJoreteg/hjs-webpack)。\n\
  \n*   在单个文件中维护配置并在那里进行分支。如果我们通过 `npm` 触发脚本（例如 `npm run test`），npm 会将此信息设置在环境变量中。我们可以对其进行匹配并返回我们需要的配置。\n\
  \n我更倾向于最后一种方法，因为它让我更容易理解发生了什么。这对于像这样的小项目是理想的。\n\n为了保持简单并方便这种方法，我定义了一个自定义的 `merge`\
  \ 函数，它可以合并数组和对象。这在使用 Webpack 时非常方便，我们很快就会看到。执行\n\n```\nnpm i webpack-merge --save-dev\n\
  ```\n\n将其添加到项目中。\n\n接下来，我们需要为配置定义一些拆分点，以便根据 npm 脚本进行自定义。基本思路如下：\n\n`webpack.config.js`\n\
  \n```\n...\nconst merge = require('webpack-merge');\n\nconst TARGET = process.env.npm_lifecycle_event;\n\
  const PATHS = {\n  app: path.join(__dirname, 'app'),\n  build: path.join(__dirname,\
  \ 'build')\n};\n\nmodule.exports = {\nconst common = {\n  // Entry 接受一个路径或一个入口对象。我们将使用\
  \ \n  // 后者形式，因为它在处理更复杂的配置时非常方便。\n  entry: {\n    app: PATHS.app\n  },\n  output:\
  \ {\n    path: PATHS.build,\n    filename: 'bundle.js'\n  }\n};\n\n// 默认配置\nif(TARGET\
  \ === 'start' || !TARGET) {\n  module.exports = merge(common, {});\n}\n\nif(TARGET\
  \ === 'build') {\n  module.exports = merge(common, {});\n}\n```\n\n现在我们有了扩展空间，可以连接热模块替换来刷新浏览器，并让开发模式更有用。\n\
  \n#### 配置热模块替换 (HMR)\n\n热模块替换为我们在做出更改时自动刷新浏览器提供了简单手段。其理念是如果我们更改了 `app/component.js`，浏览器将刷新。对于可能的\
  \ CSS 变化也是如此。\n\n为了使之工作，我们需要将运行在内存中的生成的包连接到开发服务器。Webpack 使用基于 WebSocket 的通信来实现。为了保持简单，我们将通过开发服务器的\
  \ `inline` 选项让 Webpack 为我们生成客户端部分。该选项会将 HMR 需要的客户端脚本包含在 Webpack 生成的包中。\n\n\n\n\n\
  \n除此之外，我们还需要启用 `HotModuleReplacementPlugin` 来使配置生效。此外，我将启用 HTML5 History API 回退（fallback），因为这是一个方便的默认选项，特别是当你正在处理高级路由时。以下是配置方法：\n\
  \n#### webpack.config.js\n\n```\n...\nconst webpack = require('webpack');\n\n...\n\
  \nif(TARGET === 'start' || !TARGET) {\n  module.exports = merge(common, {});\n \
  \ module.exports = merge(common, {\n    devServer: {\n      contentBase: PATHS.build,\n\
  \n      // 启用 history API 回退，以便基于 HTML5 History API\n      // 的路由工作。这是一个很好的默认设置，在复杂的\n\
  \      // 配置中非常有用。\n      historyApiFallback: true,\n      hot: true,\n      inline:\
  \ true,\n      progress: true,\n\n      // 仅显示错误以减少输出量。\n      stats: 'errors-only',\n\
  \n      // 从环境变量解析主机和端口，以便自定义。\n      //\n      // 如果你使用 Vagrant 或 Cloud9，设置\n \
  \     // host: process.env.HOST || '0.0.0.0';\n      //\n      // 0.0.0.0 与默认的 localhost\
  \ 不同\n      // 对所有网络设备可用\n      host: process.env.HOST,\n      port: process.env.PORT\n\
  \    },\n    plugins: [\n      new webpack.HotModuleReplacementPlugin()\n    ]\n\
  \  });\n}\n\n...\n```\n\n既然我们已经将 `contentBase` 配置推送到 JavaScript，我们可以从 `package.json`\
  \ 中将其删除：\n\n#### package.json\n\n```\n...\n\"scripts\": {\n  \"build\": \"webpack\"\
  ,\n  \"start\": \"webpack-dev-server --content-base build\"\n  \"start\": \"webpack-dev-server\"\
  \n},\n...\n```\n*(注：原文示例中存在两个 \"start\" 键，此处为原文格式错误，翻译已保留原样格式)*\n\n执行 `npm start`\
  \ 并访问 `localhost:8080`。尝试修改 `app/component.js`。浏览器应该会刷新。注意，如果你修改了 JavaScript 代码，这是强制刷新。CSS\
  \ 的修改方式则更优雅，并且无需刷新即可应用。在下一章中，我们将讨论如何在 React 中实现类似的功能。这将为我们提供更好的开发体验。\n\n如果你使用的是\
  \ Windows 且没有刷新，请查看以下章节的替代方案。\n\n#### Windows 上的 HMR\n\n该配置在某些版本的 Windows 上可能会出现问题。与其使用\
  \ `devServer` 和 `plugins` 配置，不如按照如下方式实现：\n\n#### webpack.config.js\n\n```\n...\n\
  \nif(TARGET === 'start' || !TARGET) {\n  module.exports = merge(common, {});\n}\n\
  \n...\n```\n\n#### package.json\n\n```\n...\n\"scripts\": {\n  \"build\": \"webpack\"\
  ,\n  \"start\": \"webpack-dev-server\",\n  \"start\": \"webpack-dev-server --watch-poll\
  \ --inline --hot\"\n},\n...\n```\n\n鉴于此配置会轮询文件系统，它将消耗更多资源。不过，如果默认设置不起作用，值得一试。\n\n\
  #### 从网络访问开发服务器\n\n在我们的配置中，可以通过环境变量自定义主机和端口设置（例如，在 Unix 上使用 `export PORT=3000` 或在\
  \ Windows 上使用 `SET PORT=3000`）。如果你想使用同一网络内的其他设备访问服务器，这将非常有用。在大多数平台上，默认设置已经足够了。\n\
  \n要访问你的服务器，你需要确定你机器的 ip 地址。在 Unix 上，可以使用 `ifconfig` 实现。在 Windows 上，可以使用 `ipconfig`。一个\
  \ npm 包，如 [node-ip](https://www.npmjs.com/package/node-ip)，可能也会很有帮助。特别是在 Windows\
  \ 上，你可能需要将 `HOST` 设置为与你的 ip 匹配，以便能够访问。\n\n#### 使用 webpack-dev-server 的其他方法\n\n我们可以通过终端传递\
  \ `webpack-dev-server` 选项。我发现在 Webpack 配置中管理它更清晰，因为这有助于保持 `package.json` 的整洁。\n\n\
  或者，我们可以建立自己的 Express 服务器，并将 `webpack-dev-server` 作为[中间件](https://webpack.github.io/docs/webpack-dev-middleware.html)。这里还有一个\
  \ [Node.js API](https://webpack.github.io/docs/webpack-dev-server.html#api)。\n\n\
  ### 2.8 刷新 CSS\n\n我们可以扩展这种方法来处理 CSS。Webpack 允许我们在不强制全刷新的情况下更改 CSS。要将 CSS 加载到项目中，我们需要使用一些加载器（loaders）。开始之前，执行：\n\
  \n```\nnpm i css-loader style-loader --save-dev\n```\n\n现在我们有了所需的加载器，需要确保 Webpack\
  \ 感知它们。配置如下：\n\n#### webpack.config.js\n\n```\n...\n\nconst common = {\n  ...\n\
  \  },\n  module: {\n    loaders: [\n      {\n        // test 期望一个正则表达式！注意斜杠！\n \
  \       test: /\\.css$/,\n        loaders: ['style', 'css'],\n        // include\
  \ 接受路径或路径数组。\n        include: PATHS.app\n      }\n    ]\n  }\n}\n\n...\n```\n\n\
  我们添加的配置意味着以 `.css` 结尾的文件应该调用给定的加载器。`test`  JavaScript 风格的正则表达式。加载器从右到左进行评估。在这种情况下，`css-loader`\
  \ 接收 `style-loader`。`style-loader` 处理 `@import` 语句。\n\n### 2.9 设置 CSS\n\n我们只缺少真正的\
  \ CSS：\n\n#### main.css\n\n```css\nbody {\n  background: lime;\n}\n```\n\n此外，我们需要让\
  \ Webpack 感知它：\n\n#### index.js\n\n```javascript\nrequire('./main.css');\n\n...\n\
  ```\n\n### 2.10 启用 Source Maps\n\n为了提高应用程序的可调试性，我们可以设置 source maps。它们允许你看到错误发生在哪里。在\
  \ Webpack 中，这通过 `devtool` 设置进行控制。可以使用如下良好的默认设置：\n\n#### webpack.config.js\n\n```\n\
  ...\n\nif(TARGET === 'start' || !TARGET) {\n  module.exports = merge(common, {\n\
  \    devtool: 'eval-source-map',\n    ...\n  });\n}\n\n...\n```\n\n如果你运行开发构建 `npm\
  \ start`，Webpack 将生成 source maps。正如[官方文档](https://webpack.github.io/docs/configuration.html#devtool)\
  \ 所述，Webpack 提供了多种生成方式。在这种情况下，我们使用的是 `eval-source-map`。它构建缓慢，但提供了真实的文件。\n\n快速开发选项（如\
  \ `cheap-module-source-map` 和 `eval`）产生的质量较低的 source maps。所有 `eval` 选项都会将 source\
  \ maps 作为 JavaScript 代码的一部分输出。因此，它们不适用于生产环境。考虑到在开发期间大小不是问题，它们通常适合这种用例。\n\n你可能需要在浏览器中启用\
  \ source maps 才能使其工作。更多详情请参见 [Chrome](https://developer.chrome.com/devtools/docs/javascript-debugging)\
  \ 和 [Firefox](https://developer.mozilla.org/en-US/docs/Tools/Debugger/How_to/Use_a_source_map)\
  \ 指南。\n\n### 2.11 使用 npm-install-webpack-plugin 避免 npm install\n\n为了避免某些输入，我们可以设置名为\
  \ [npm-install-webpack-plugin](https://www.npmjs.com/package/npm-install-webpack-plugin)\
  \ 的插件。在我们开发时，它会检测 Webpack 配置和项目文件的更改并为我们安装依赖。它也会自动修改 `package.json`。\n\n如果你愿意，仍然可以手动安装依赖。任何\
  \ `app` 内的依赖都应该通过 `--save`（或 `-S`）安装。根级依赖（即 Webpack 需要的包）应该通过 `--save-dev`（或 `-D`）安装。这种分离在我们*构建\
  \ Kanban* 生成生产包时将非常有用。\n\n为了安装该插件，执行：\n\n```\nnpm i npm-install-webpack-plugin --save-dev\n\
  ```\n\n\n\n\n我们还需要将其与配置结合起来：\n\n`webpack.config.js`\n\n```\nconst path = require('path');\n\
  const merge = require('webpack-merge');\nconst webpack = require('webpack');\nconst\
  \ NpmInstallPlugin = require('npm-install-webpack-plugin');\n\n...\n\n// Default\
  \ configuration\nif(TARGET === 'start' || !TARGET) {\n  module.exports = merge(common,\
  \ {\n    ...\n    plugins: [\n      new webpack.HotModuleReplacementPlugin(),\n\
  \      new webpack.HotModuleReplacementPlugin(),\n      new NpmInstallPlugin({\n\
  \        save: true // --save\n      })\n    ]\n  });\n}\n\nif(TARGET === 'build')\
  \ {\n  module.exports = merge(common, {});\n}\n```\n\n在进行此更改后，我们可以节省大量的输入工作和上下文切换。\n\
  \n### 2.12 项目的代码检查 (Linting)\n\n我将在 `Webpack 中的 Linting` 章节中详细讨论代码检查。现在就可以将这套设置集成到你的项目中，因为这将节省一些调试时间。它将让你更早地发现某些类别的错误。\n\
  \n### 2.13 总结\n\n在本章中，你学习了使用 Webpack 进行构建和开发。我将在 `构建看板` 章节中回到构建主题。目前的配置对于生产环境并不理想。此时，重要的是开发环境配置。在下一章中，我们将看到如何扩展这种方法以配合\
  \ React 使用。\n\n## 3. Webpack 和 React\n\n结合 Webpack，使用 React 变得是一件乐事。尽管你可以与其他构建工具一起使用\
  \ React，但 Webpack 是非常合适的选择，而且设置非常简单。在本章中，我们将扩展配置。之后，我们就为进一步开发应用有了良好的起点。\n\n### 3.1\
  \ 什么是 React？\n\n![React](img/react_header.png)\n\nReact\n\nFacebook 的 [React](https://facebook.github.io/react/)\
  \ 改变了我们思考前端开发的方式。此外，得益于 [React Native](https://facebook.github.io/react-native/)，这种方法不仅限于\
  \ Web。虽然 React 简单简单，但它提供了强大的功能。\n\nReact 并不是像 `Angular.js` 或 `Ember` 那样的框架。框架倾向于开箱提供大量的解决方案。使用\
  \ React 时，你需要从不同的库中组装你的应用程序。这两种方法各有优劣。框架可能上手更快，但当你触及它们的边界时，处理起来可能会变得更加困难。在基于库的方法中，你拥有更大的灵活性，但也承担更大的责任。\n\
  \nReact 为 Web 开发者引入了虚拟 DOM 的概念。与之前所有的库和框架不同，React 维护着自己的一套 DOM。当虚拟 DOM 发生变化时，React\
  \ 将将其认为最佳的方式将这些更改批量应用于实际 DOM。\n\n#### JSX 和虚拟 DOM\n\nReact 提供了一个[高级 API](https://facebook.github.io/react/docs/top-level-api.html)\
  \ 来生成虚拟 DOM。使用该 API 生成复杂结构会很快变得繁琐。因此，人们通常不手动编写。相反，他们使用某些中间格式并转换为它。Facebook 的 [JSX](https://facebook.github.io/jsx/)\
  \ 就是一种流行的格式。\n\nJSX 是 JavaScript 的超集，允许你将类似 XML 的语法与 JavaScript 混合。考虑下面的示例：\n\n\
  ```\nconst Names = () => {\n  const names = ['John', 'Jill', 'Jack'];\n\n  return\
  \ (\n    <div>\n      <h2>Names</h2>\n\n      {/* 这是一个名字列表 */}\n      <ul className=\"\
  names\">{\n        names.map(name =>\n          <li className=\"name\">{name}</li>\n\
  \        )\n      </ul>\n    </div>\n  );\n};\n```\n\n如果你以前没见过 JSX，它看起来可能很怪异。在开始理解它之前，经历过“JSX\
  \ 冲击”并不罕见。之后，一切都变得合理了。\n\nCory House 详细讨论了[关于这种冲击](https://medium.com/@housecor/react-s-jsx-the-other-side-of-the-coin-2ace7ab62b98)。简而言之，JSX\
  \ 为我们提供了以前以前未遇到过的验证水平。这需要一段时间来掌握，但一旦你理解了，就很难回头了。\n\n#### JSX vs HTML\n\n在 JSX 中，我们将一些看起来有点像\
  \ HTML 的东西与 JavaScript 混合。注意我们是如何处理属性的。我们不像在原生 HTML 中那样使用 `class`，而是使用 `className`，这是\
  \ DOM 的等效写法。尽管初次使用 JSX 可能会觉得有点奇怪，但随着时间的推移，它会变成本能。\n\nReact 的开发者将自己从 DOM 的限制中解耦出来。结果是，React\
  \ 性能极高。不过这也是有代价的。库并没有你想象的那么小。你可以预计小型应用程序的体积大约在 150-200k 左右，包含 React。在网络传输经过 gzip\
  \ 压缩后，数字会少得多，但仍然是一分量。\n\n#### 有了朋友更好\n\nReact 并不是那里最小的库。不过，它确实解决了基本问题。得益于其相对简单性和强大的\
  \ API，开发 React 是一件乐事。你需要一组工具来补充它，但你可以根据实际需求选择这些工具。它远不是一种“一刀切”的解决方案，而框架往往是这种类型。\n\
  \nReact 使用的方法允许 Facebook 在相同的理念之上开发了 React Native。这一次，我们操作的不是 DOM，而是移动平台的渲染。\n\n\
  ### 3.2 Babel\n\n![Babel](img/babel.png)\n\nBabel\n\n[Babel](https://babeljs.io/)\
  \ 对社区产生了巨大影响。它允许我们使用来自 JavaScript 未来的特性。它会将你的代码转换为浏览器能理解的格式。Babel 为标准 ES6 之外的某些\
  \ ES7 特性提供了支持。其中某些可能会进入语言核心，而另一些可能会被丢弃。语言提案被分为几个阶段：\n\n*   **Stage 0** - 草稿 (Strawman)\n\
  *   **Stage 1** - 提议 (Proposal)\n*   **Stage 2** - 草案 (Draft)\n*   **Stage 3** -\
  \ 候选 (Candidate)\n*   **Stage 4** - 完成 (Finished)\n\n我会非常小心阶段 `0` 的特性。问题在于，如果该特性发生变化或被移除，你将将导致损坏的代码并需要重写。尽管在较小的实验项目中，这种风险可能是值得的。\n\
  \n#### 配置 `babel-loader`\n\n你可以通过 [babel-loader](https://www.npmjs.com/package/babel-loader)\
  \ 轻松在 Webpack 中使用 Babel。它将我们基于 ES6 模块定义的代码转换为 ES5 包。通过以下命令安装 *babel-loader*：\n\n\
  ```\nnpm i babel-loader babel-core --save-dev\n```\n\n*babel-core* 包含了 Babel 的核心逻辑，因此我们需要安装它。\n\
  \n为了使其工作，我们需要在配置的 *loaders* 部分为 `babel-loader` 添加一个加载器声明。它使用正则表达式 (`/\\.jsx?$/`)\
  \ 同时匹配 `.js` 和 `.jsx`。\n\n为了保持性能，我们应该限制加载器在 `./app` 目录内操作。这样它就不会遍历 `node_modules`。另一种方案是显式设置一个针对\
  \ `node_modules` 的 `exclude` 规则。我发现使用 `include` 更有用，因为更明确。毕竟你永远不知道结构中会有哪些文件。\n\n\
  \n\n\n```\n...\n\nconst common = {\n  entry: {\n    app: PATHS.app\n  },\n  // 添加\
  \ resolve.extensions。\n  // '' 是必要的，允许没有扩展名的导入。\n  // 注意扩展名前的 '.'，否则它将无法匹配！！！\n\
  \  resolve: {\n    extensions: ['', '.js', '.jsx']\n  },\n  output: {\n    path:\
  \ PATHS.build,\n    filename: 'bundle.js'\n  },\n  module: {\n    loaders: [\n \
  \     {\n        test: /\\.css$/,\n        loaders: ['style', 'css'],\n        include:\
  \ PATHS.app\n      }\n      },\n      // 设置 jsx。得益于正则表达式，它也接受 js\n      {\n    \
  \    test: /\\.jsx?$/,\n        // 在开发期间启用缓存以提高性能\n        // 它默认使用操作系统目录。如果你需要更\n\
  \        // 自定义的路径，请传递路径给它。例如 babel?cacheDirectory=<path>\n        loaders: ['babel?cacheDirectory'],\n\
  \        // 仅解析 app 文件！如果不这样做，它将遍历整个项目。\n        // 除了速度慢，这很可能导致错误。\n        include:\
  \ PATHS.app\n      }\n    ]\n  }\n};\n\n...\n```\n\n注意 `resolve.extensions` 设置将允许你在不使用扩展名的情况下引用\
  \ JSX 文件。为了清晰起见，我将使用扩展名，但如果你愿意，也可以将其省略它。\n\n#### 设置 .babelrc\n\n此外，我们需要一个 [.babelrc](https://babeljs.io/docs/usage/babelrc/)。你可以通过\
  \ Webpack 传递 Babel 设置（例如 `babel?presets[]=react,presets[]=es2015`），但那样它只对 Webpack\
  \ 有效。这就是为什么我们要将 Babel 设置推送到这个特定的点文件中。同样的思想也适用于其他工具，如 `ESLint`。\n\nBabel 6 依赖于 `plugins`（插件）。插件有两种类型：语法（syntax）和转换（transform）。前者允许\
  \ Babel 解析额外的语法，而后者应用转换。这样一来，使用未来语法的代码就可以转换回旧环境可以理解的 JavaScript。\n\n为了更方便地使用插件，Babel\
  \ 支持 `presets`（预设）的概念。每个预设都有一组插件，这样你就不需要单独连接它们。在这种情况下，我们将依赖 ES2015 和 React 预设：\n\
  \n```\nnpm i babel-preset-es2015 babel-preset-react --save-dev\n```\n\n此外，我们还将启用一些自定义功能，使项目开发更加方便：\n\
  \n*   [属性初始化](https://github.com/jeffmo/es-class-static-properties-and-fields) (Property\
  \ initializers) - 示例：`renderNote = (note) => {`。这会自动将 `renderNote` 方法绑定到实例上。随着我们使用它，这个功能会变得更有意义。\n\
  \n*   [装饰器](https://github.com/wycats/javascript-decorators) (Decorators) - 示例：`@DragDropContext(HTML5Backend)`。这些注解允许我们为类及其方法附加功能。\n\
  \n*   [对象剩余参数/扩展运算符解赋值](https://github.com/sebmarkbage/ecmascript-rest-spread) (Object\
  \ rest/spread) - 示例：`const {a, b, …props} = this.props`。这种语法允许我们轻松从对象中提取特定属性。\n\n\
  为了更方便地设置这些功能，我创建了一个[特定的预设](https://github.com/survivejs/babel-preset-survivejs-kanban)\
  \ 包含它们。它还包含了 [babel-plugin-transform-object-assign](https://www.npmjs.com/package/babel-plugin-transform-object-assign)\
  \ 和 [babel-plugin-array-includes](https://www.npmjs.com/package/babel-plugin-array-includes)\
  \ 插件。前者允许我们使用 `Object.assign`，后者提供了 `Array.includes`，而无需担心为旧环境对其进行垫片（shimming）。\n\
  \n预设简单来说导出 Babel 配置的 npm 模块。维护这样的预设可能很有用，特别是当你想在多个项目中共享同一组功能时。安装该预设：\n\n```\nnpm\
  \ i babel-preset-survivejs-kanban --save-dev\n```\n\n接下来，我们需要设置一个 `.babelrc` 文件来让这一切正常工作：\n\
  \n**.babelrc**\n\n```\n{\n  \"presets\": [\n    \"es2015\",\n    \"react\",\n  \
  \  \"survivejs-kanban\"\n  ]\n}\n```\n\nBabel 提供了特定阶段的预设。直接依赖你可能想要使用的任何自定义功能更加清晰。这很好地记录了你的项目并保持了可维护性。你甚至可以放弃\
  \ `babel-preset-es2015` 并逐个启用你需要的功能。除了这里涵盖的，还有其他的 [.babelrc ](https://babeljs.io/docs/usage/options/)。\n\
  \n### 3.3 定义自己的 Babel 预设\n\nBabel 预设简单来说导入其他预设和插件的 Node.js 包。其理念是预设将拉取它需要的依赖，然后通过标准的\
  \ Node.js 暴露它们。例如，我们可以这样定义一个预设：\n\n**index.js**\n\n```\nmodule.exports = {\n  plugins:\
  \ [\n    require('babel-plugin-syntax-class-properties'),\n    require('babel-plugin-syntax-decorators'),\n\
  \    require('babel-plugin-syntax-object-rest-spread'),\n\n    // 你可以使用数组语法传递参数\n\
  \    [\n      require('babel-plugin-transform-regenerator'),\n      {\n        async:\
  \ false,\n        asyncators: false\n      }\n    ]\n  ]\n};\n```\n\n在这种情况下，我们通过\
  \ `plugins` 字段拉取预设。假设我们将包命名为 `babel-preset-survivejs-kanban`，我们可以通过 `.babelrc` 将其传递给项目。\n\
  \n#### 在 Webpack 配置中使用 Babel\n\n可以在你的 Webpack 配置文件中使用 转换后的功能。只需重命名 `webpack.config.js`\
  \ 即可生效。为了让这一切工作，你需要安装 [babel-register](https://www.npmjs.com/package/babel-register)\
  \ 到你的项目中。Webpack 内部依赖 `.babelrc` 来实现这一点。\n\n\n\n\n处理查询参数的另一种方法是依赖 Node.js 的 [querystring](https://nodejs.org/api/querystring.html)\
  \ 模块，并通过它对结构进行序列化，以便它们可以通过 `loaders` 定义进行传递。\n\n### 3.5 开发第一个 React 视图\n\n首先，我们应该定义\
  \ `App`。这将是我们应用程序的核心。它代表了应用的高层视图并作为入口点。稍后它将编排整个执行过程。我们可以通过使用 React 的类组件定义语法开始：\n\
  \n`app/components/App.jsx`\n\n```\nimport React from 'react';\nimport Note from\
  \ './Note.jsx';\n\nexport default class App extends React.Component {\n  render()\
  \ {\n    return <Note />;\n  }\n}\n```\n\n#### 设置 `Note`\n\n我们还需要定义 `Note` 组件。在这种情况下，我们只想显示一些像\
  \ `Learn Webpack` 这样的文本。如果你喜欢陈词滥调，用 `Hello world` 也可以的。鉴于组件如此简单，我们可以使用 React 的函数组件定义：\n\
  \n`app/components/Note.jsx`\n\n```\nimport React from 'react';\n\nexport default\
  \ () => <div>Learn Webpack</div>;\n```\n\n虽然我们在这里没有通过代码直接引用 React，但最好记住，JSX 将被转换为通过它进行的调用。因此，如果你删除了\
  \ `import` 语句，代码将会崩溃。如果你倾向于避免导入，名为 [babel-plugin-react-require](https://www.npmjs.com/package/babel-plugin-react-require)\
  \ 的 Babel 插件能够自动为你生成 `imports`。\n\n#### 通过 `index.jsx` 进行渲染\n\n为了让这一切能够运行，我们需要调整\
  \ `index.js` 以渲染渲染组件。请注意，由于那里有 JSX 内容，我已将其重命名为 `index.jsx`。我们将通过一个名为 `react-dom`\
  \ 的包来渲染内容。考虑到我们在这里处理的是浏览器，这是正确的选择：\n\n`app/index.jsx`\n\n```\nimport './main.css';\n\
  \nimport React from 'react';\nimport ReactDOM from 'react-dom';\nimport App from\
  \ './components/App.jsx';\n\nReactDOM.render(<App />, document.getElementById('app'));\n\
  ```\n\n如果你正在运行开发服务器，你应该在 `localhost:8080` 看到一些熟悉的内容：\n\n![Hello React](img/react_01.png)\n\
  \nHello React\n\n如果你尝试修改你的 React 组件，你会看到 Webpack 强制了全刷新。这是我们接下来通过启用热加载（hot loading）来修复的。\n\
  \n在继续之前，现在是删除 `app` 根目录下的旧 `component.js` 文件的好时候了。我们不再需要它了。\n\n### 3.6 为开发激活热加载\n\
  \n注意，每当你执行修改时，浏览器都会闪一下。这很遗憾，因为这意味着我们的应用程序丢失了状态。目前还没有关系，但随着我们不断扩展应用程序，这将变得痛苦。为了测试某些东西，将用户界面操作回原来的状态是非常令人恼的。\n\
  \n我们已经为此实现了开发服务器端的设置。问题是我们缺少一个允许客户端捕获变化并补丁代码的部分。为了将其添加到项目中，需要一些设置。\n\n[babel-plugin-react-transform](https://github.com/gaearon/babel-plugin-react-transform)\
  \ 允许我们以各种方式对 React 组件进行实例化。热加载就是其中之一。可以通过 [react-transform-hmr](https://github.com/gaearon/react-transform-hmr)\
  \ 启用。\n\n`react-transform-hmr` 会在组件变化时逐个交换 React 组件，而不会强制全刷新。鉴于它只是替换了方法，它不会捕获所有可能的更改。这包括对类构造函数进行的更改。有时你可能需要强制刷新，但在大多数情况下它都能工作。\n\
  \n名为 [babel-preset-react-hmre](https://www.npmjs.com/package/babel-preset-react-hmre)\
  \ 的 Babel 预设将保持我们的设置简单。它带有合理的默认值，并减少了你需要维护的配置数量。通过以下方式安装它：\n\n```\nnpm i babel-preset-react-hmre\
  \ --save-dev\n```\n\n我们还需要让 Babel 感知到 HMR。首先，我们应该通过 Webpack 配置将目标环境传递给 Babel。这允许我们通过\
  \ `.babelrc` 控制特定环境的功能。在这种情况下，我们只想为开发环境启用 HMR。如果你想为生产环境构建启用某些特定插件，可以使用相同的思路。\n\n\
  控制 `.babelrc` 的简单方法是将 `BABEL_ENV` 环境变量设置为 npm 的生命周期事件。这让我们在 `package.json` 和 `.babelrc`\
  \ 之间建立了一个可预测的映射：\n\n`webpack.config.js`\n\n```\n...\n\nprocess.env.BABEL_ENV = TARGET;\n\
  \nconst common = {\n  ...\n};\n\n...\n```\n\n此外，我们需要扩展 Babel 配置以包含我们在开发期间需要的插件。这就是\
  \ `BABEL_ENV` 发挥用场的地方。Babel 如下确定 `env` 的值：\n\n1. 如果设置了 `BABEL_ENV`，则使用其值。\n2. 如果设置了\
  \ `NODE_ENV`，则使用其值。\n3. 默认值为 `development`。\n\n要将 `BABEL_ENV='start'` 与 Babel 连接，配置如下：\n\
  \n`.babelrc`\n\n```\n{\n  \"presets\": [\n    \"es2015\",\n    \"react\",\n    \"\
  survive-kanban\"\n  ],\n  \"env\": {\n    \"start\": {\n      \"presets\": [\n \
  \       \"react-hmre\"\n      ]\n    }\n  }\n}\n```\n\n再次尝试 `npm start` 并修改组件。注意这次没有闪烁！\n\
  \n这可能需要时间来理解，但在实践中，这是一个强大的功能。这些小细节会累积并让你更高效。\n\n### 3.7 React 组件样式\n\n除了 ES6 类之外，React\
  \ 允许你使用 `React.createClass` 和函数来构建组件。`React.createClass()` 是创建组件的原始方法，目前在使用。这些方法默认并不是同等的。\n\
  \n当你使用 `React.createClass` 时，可以使用 mixins 注入功能。Mixins 在 ES6 中默认不可用。然而，你可以使用 [react-mixin](https://github.com/brigand/react-mixin)\
  \ 等工具来提供某些功能。在后面的章节中我们将替代方法。它们允许你获得与 mixins 类似的结果。通常一个装饰器就是你需要的。\n\n此外，ES6 类组件默认不会将其方法绑定到\
  \ `this` 上下文。这就是为什么在组件构造函数中绑定是一个良好的实践。解决此问题的另一种方法是使用属性初始化。我们将使用这种方法，因为它减少了代码量，并且更容易理解发生了什么。\n\
  \n### 3.8 总结\n\n现在你应该理解了如何使用 Webpack 设置 React。热加载是让 Webpack 脱颖而出的特性之一。现在我们已经有了良好的开发环境，可以专注于\
  \ React 开发了。在下一章节中，你将看到如何实现一个简单的笔记应用。它将在后续章节中改进为一个完整的看板应用。\n\n# 第二部分 开发看板应用\n\n\
  React 尽管是一个年轻的库，但它对前端开发社区产生了巨大影响。它引入了虚拟 DOM 等概念，并让社区理解了组件的力量。它的组件化设计方法非常适用于 Web。但\
  \ React 不仅限于 Web。你可以用它开发移动端甚至终端用户界面。\n\n\n\n在本部分中，我们将实现一个小型看板（Kanban）应用程序。在此过程中，你将学习\
  \ React 的基础。由于 React 只是一个视图库，我们还将讨论支持性技术。Alt 作为一个 Flux 框架，它是 React 的良好伴侣，允许你保持组件的整洁。你还将看到如何使用\
  \ React DnD 为看板板添加拖放功能。最后，你将学习如何使用 Webpack 创建一个生产级的构建版本。\n\n## 4. 实现一个基础笔记应用程序\n\
  \n鉴于我们现在有了良好的开发环境，实际上可以开始做工作了。我们这里的目标是得到一个原始的笔记应用程序。它将具有基础的操作功能。我们将从零开始构建应用程序并遇到一些问题。通过这种方式，你将理解为什么需要像\
  \ Flux 这样的架构。\n\n### 4.1 初始数据模型\n\n通常，设计应用程序的一个良好方法是从数据开始。我们可以将笔记列表建模如下所示：\n\n```\n\
  [\n  {\n    id: '4a068c42-75b2-4ae2-bd0d-284b4abbb8f0',\n    task: 'Learn Webpack'\n\
  \  },\n  {\n    id: '4e81fc6e-bfb6-419b-93e5-0242fb6f3f6a',\n    task: 'Learn React'\n\
  \  },\n  {\n    id: '11bbffc8-5891-4b45-b9ea-5c99aadf870f',\n    task: 'Do laundry'\n\
  \  }\n];\n```\n\n每条笔记都是一个对象，包含了我们需要的数据，包括一个 `id` 和我们想要执行的 `task`。以后可以扩展此数据定义，以包含笔记颜色或所有者等内容。\n\
  \n### 4.2 将数据与 `App` 连接\n\n我们可以在定义中跳过 ids。但随着应用程序的增长，这会成为问题。如果你根据数组索引引用数据而数据发生了变化，那么每个引用也必须更改。我们可以通过自己生成\
  \ ids 来轻松避免这一点。\n\n#### 生成 ids\n\n通常这个问题由后端解决。由于我们现在还没有后端，我们将使用一种名为 [RFC4122](https://www.ietf.org/rfc/rfc4122.txt)\
  \ 的标准。它允许我们生成唯一的 ids。我们将使用一个名为 `node-uuid` 的 Node.js 实现及其 `uuid.v4` 变体。它将为我们提供如\
  \ `1c8e7a12-0b4c-4f23-938c-00d7161f94fc` 的 ids，并且极高概率保证是唯一的。\n\n#### 设置 `App`\n\n\
  现在我们知道如何处理 ids 并理解了我们需要什么类型的数据模型，我们需要将数据模型与 `App` 连接。目前实现这一点的简单方法是直接将数据推给 `render()`。这不会很高效，但它可以允许我们开始。下面的实现展示了在\
  \ React 术语中这是工作的：\n\n`app/components/App.jsx`\n\n```\nimport uuid from 'node-uuid';\n\
  import React from 'react';\nimport Note from './Note.jsx';\n\nexport default class\
  \ App extends React.Component {\n  render() {\n    const notes = [\n      {\n  \
  \      id: uuid.v4(),\n        task: 'Learn Webpack'\n      },\n      {\n      \
  \  id: uuid.v4(),\n        task: 'Learn React'\n      },\n      {\n        id: uuid.v4(),\n\
  \        task: 'Do laundry'\n      }\n    ];\n\n    return <Note />;\n    return\
  \ (\n      <div>\n        <ul>{notes.map(note =>\n          <li key={note.id}>{note.task}</li>\n\
  \        )}</ul>\n      </div>\n    );\n  }\n}\n```\n\n在在上面的代码段落中，我们使用了 React 的各种重要特性。理解这些特性是无价的。我在下面注释了重要的部分：\n\
  \n* `<ul>{notes.map(note => ...)}</ul>` - `{}` 允许我们在 JSX 中混合 JavaScript 语法。`map`\
  \ 返回一个 `li` 元素列表以供 React 渲染。\n* `<li key={note.id}>{note.task}</li>` - 为了告诉 React\
  \ 以什么种顺序渲染元素，我们使用 `key` 属性。确保该属性是是重要的，否则 React 将无法确定正确的渲染顺序。如果没有设置，React 将给出警告。更多信息请参阅\
  \ [多个组件](https://facebook.github.io/react/docs/multiple-components.html)。\n\n如果你现在运行该应用程序，你可以看到一个笔记列表。它并不特别漂亮，但只是一个开始：\n\
  \n![笔记列表](img/react_03.png)\n\n### 4.3 向列表添加新项目\n\n向列表添加更多项目是进一步开发的良好起点。每个 React\
  \ 组件都可以维护内部的 `state`。在这种情况下，`state` 指的是我们刚刚定义的数据模型。当我们通过 React 的 `setState` 方法修改\
  \ `state` 时，React 将最终调用 `render()` 方法并更新用户界面。这个想法允许我们实现交互性，例如向列表添加新项目。\n\n\n\n如果我们正在与后端交互，我们会在这里触发查询并从响应中捕获\
  \ `id`。目前，只需生成一个条目和一个自定义 id 就足够了。\n\n如果你现在刷新浏览器并点击加号按钮，你应该会在列表中看到一个新项目：\n\n![带有加号的笔记](img/react_05.png)\n\
  \n带有加号的笔记\n\n我们仍然缺少两个关键功能：编辑和删除。在继续处理这些功能之前，最好的做法是通过扩展我们的组件层级来为它们留出空间。这样做之后处理这些功能将会变得更容易。使用\
  \ React 就像是这样：你开发一个组件一段时间，直到你意识到它可以被进一步拆分。\n\n### 4.4 改进组件层级\n\n我们目前基于单个组件的设置无法带我们走得远。要在其中添加更多独立的笔记集合将变得非常复杂。在目前的设置下，这意味着我们必须重复代码。\n\
  \n幸运的是，我们可以通过为我们的系统建模更多组件来解决这个问题。除了解决问题外，它们还促进了代码复用。在理想情况下，我们可以在多个不同的系统中使用良好的组件。\n\
  \n由于笔记集合看起来像是一个组件，我们可以将其建模为 `Notes`。此外，我们可以将其与 `Note` 概念分离出来。这种分离为我们提供了另一个非常有帮助的抽象层次。这种设置为我们提供了一个三层组件层级，看起来如下：\n\
  \n通过观察我们的应用程序，我们可以设计出这样的组件层级：\n\n*   `App` - `App` 保留应用状态并处理高层逻辑。\n*   `Notes` -\
  \ `Notes`充当中间包装器，渲染单个 `Note` 组件。\n*   `Note` - `Note` 是我们应用程序的核心工作。编辑和删除将在这里触发。该逻辑将通过中间的连接级联到\
  \ `App`。\n\n以后，我们可以通过引入 `Lane`（通道）和 `Lanes`（通道列表）的概念将层级扩展为完整的看板（Kanban）。这两个概念位于\
  \ `App` 和 `Notes` 之间。不过，我们现在不需要担心这个。\n\n#### 提取 `Note`\n\n向我们目标层级迈出的良好第一步是提取 `Note`。`Note`\
  \ 是一个需要接收 `task` 作为 `prop` 并将其渲染的组件。在 JSX 来说，这看起来像是 `<Note task=\"这里是任务\" />`。\n\
  \n除了 `state` 之外，`props` 是你将经常使用的另一个概念。它们描述了组件的外部接口。你可以像在*React 类型*章节中讨论的那样对它们进行注释。为了保持简单，我们在这里跳过了\
  \ `propType` 注释。\n\n函数组件将接收 `props` 作为其第一个参数。我们可以通过 [ES6 解构语法](https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Operators/Destructuring_assignment#Object_destructuring)\
  \ 从中提取特定的 props。函数组件本身就是 `render()`。它们比基于类的组件要局限得多，但它们非常适合简单的展示目的，例如这里。为了将这些想法结合起来，我们可以得到如下组件定义：\n\
  \n**app/components/Note.jsx**\n\n```jsx\nimport React from 'react';\n\nexport default\
  \ ({task}) => <div>{task}</div>;\n```\n\n#### 将 `Note` 连接到 `App`\n\n现在我们有了一个接受 `task`\
  \ prop 的简单组件，我们可以将其与 `App` 连接起来，以接近我们构思的组件层级：\n\n**app/components/App.jsx**\n\n\
  ```jsx\nimport uuid from 'node-uuid';\nimport React from 'react';\nimport Note from\
  \ './Note.jsx';\n\nexport default class App extends React.Component {\n  constructor(props)\
  \ {\n    ...\n  }\n  render() {\n    const notes = this.state.notes;\n\n    return\
  \ (\n      <div>\n        <button onClick={this.addNote}>+</button>\n        <ul>{notes.map(note\
  \ =>\n          <li key={note.id}>{note.task}</li>\n          <li key={note.id}>\n\
  \            <Note task={note.task} />\n          </li>\n        )}</ul>\n     \
  \ </div>>\n    );\n  }\n  ...\n}\n```\n\n应用程序看起来应该是一样的。为了实现我们想要的结构，我们应该再进行一次微调并提取\
  \ `Notes`。\n\n#### 提取 `Notes`\n\n提取 `Notes` 是一个类似的操作。我们需要理解 `App` 的哪些部分属于该组件，然后为它编写定义。这与之前的\
  \ `Note` 是一样的想法：\n\n**app/components/Notes.jsx**\n\n```jsx\nimport React from 'react';\n\
  import Note from './Note.jsx';\n\nexport default ({notes}) => {\n  return (\n  \
  \  <ul>{notes.map(note =>\n      <li key={note.id}>\n        <Note task={note.task}\
  \ />\n      </li>\n    )}</ul>\n  );\n}\n```\n\n此外，我们需要将 `App` 与新定义连接：\n\n**app/components/App.jsx**\n\
  \n```jsx\nimport uuid from 'node-uuid';\nimport React from 'react';\nimport Note\
  \ from './Note.jsx';\nimport Notes from './Notes.jsx';\n\nexport default class App\
  \ extends React.Component {\n  constructor(props) {\n    ...\n  }\n  render() {\n\
  \    const notes = this.state.notes;\n\n    return (\n      <div\n        <button\
  \ onClick={this.addNote}>+</button>\n        <ul>{notes.map(note =>\n          <li\
  \ key={note.id}>\n            <Note task={note.task} />\n          </li>\n     \
  \   )}</ul>\n        <Notes notes={notes} />\n      </div>\n    );\n  }\n  addNote\
  \ = () => {\n    this.setState({\n      notes: this.state.notes.concat([{\n    \
  \    id: uuid.v4(),\n        task: 'New task'\n      }])\n    });\n  };\n}\n```\n\
  \n应用程序的行为应该保持不变。但在结构上，我们比之前更好。现在我们可以开始考虑为系统添加新功能。\n\n### 4.5 编辑 `Notes`\n\n为了编辑单个\
  \ `Note`，我们应该为这些设置一些钩子（hooks）。逻辑上可能会发生以下情况：\n\n1. 用户点击 `Note`。\n2. `Note` 渲染为一个显示当前值的输入框。\n\
  3. 用户确认修改（触发 `blur` 事件或按下回车键）。\n4. `Note` 渲染新值。\n\n这意味着 `Note` 需要某种方式跟踪其 `editing`\
  \ 状态。此外，我们需要通知值（`task`）已更改，以便 `App` ...更新其状态。解决这两个问题将得到一个功能性的结果。\n\n#### 跟踪 `Note`\
  \ 的 `editing` 状态\n\n就像之前的 `App` 一样，我们再次需要处理状态。这意味着函数组件不再足够。相反，我们需要将其转换为更重的格式。为了保持一致性，我将使用与\
  \ `App` 相同的组件定义风格。此外，我们需要根据用户行为更改 `editing` 状态，最后根据它渲染正确的元素。在 React 来说，这意味着：\n\n\
  **app/components/Note.jsx**\n\n\n\n```javascript\nimport React from 'react';\n\n\
  export default class Note extends React.Component {\n  constructor(props) {\n  \
  \  super(props);\n\n    // 跟踪 `editing` 状态。\n    this.state = {\n      editing:\
  \ false\n    };\n  }\n  render() {\n    // 根据状态渲染渲染组件。\n    if(this.state.editing)\
  \ {\n      return this.renderEdit();\n    }\n\n    return this.renderNote();\n \
  \ }\n  renderEdit = () => {\n    // 我们在这里处理失去焦点和输入处理器。这些映射到 DOM 事件。\n    // 我们还通过\
  \ ref 的回调将选择位置设置为输入末尾。\n    // 它在组件挂载后被触发。\n    //\n    // 我们也可以使用字符串引用（例如 `ref=\"\
  input\"`），\n    // 然后在代码的后续部分引用该元素。这\n    // 允许我们通过 this.refs.input 使用底层的 DOM API。\n\
  \    // 这在与 React 生命周期钩子结合时非常有用。\n    return <input type=\"text\"\n      ref={\n\
  \        (e) => e ? e.selectionStart = this.props.task.length : null\n      }\n\
  \      autoFocus={true}\n      defaultValue={this.props.task}\n      onBlur={this.finishEdit}\n\
  \      onKeyPress={this.checkEnter} />;\n  };\n  renderNote = () => {\n    // 如果用户点击普通笔记，触发编辑逻辑。\n\
  \    return <div onClick={this.edit}>{this.props.task}</div>;\n  };\n  edit = ()\
  \ => {\n    // 进入编辑模式。\n    this.setState({\n      editing: true\n    });\n  };\n\
  \  checkEnter = (e) => {\n    // 用户按了 *回车*，让我们完成它吧。\n    if(e.key === 'Enter') {\n\
  \      this.finishEdit(e);\n    }\n  };\n  finishEdit = (e) => {\n    // 当 `Note`\
  \ 有新值时，它将触发一个可选的 `onEdit` 回调。\n    // 我们用此将更改通信给 `App`。\n    //\n    // 处理默认值的更智能的方法是通过\
  \ `defaultProps` 设置它。\n    //\n    // 更多信息请查看 *Typing with React* 章节。\n    const\
  \ value = e.target.value;\n\n    if(this.props.onEdit) {\n      this.props.onEdit(value);\n\
  \n      // 退出编辑模式。\n      this.setState({\n        editing: false\n      });\n \
  \   }\n  };\n}\n```\n\n现在如果你尝试编辑 `Note`，你应该能看到一个输入框并能够编辑数据。由于我们还没有设置 `onEdit` 处理器，它目前还没有执行任何有用的操作。接下来我们需要捕获编辑后的数据并更新\
  \ `App` 状态，以便代码能够工作。\n\n#### 通信 `Note` 状态的变化\n\n鉴于我们目前在 `App` 中处理逻辑，我们也可以在那里处理 `onEdit`。另一种设计可能是将逻辑推到\
  \ `Notes` 级。这在处理 `addNote` 时会产生问题，因为该功能不属于 `Notes` 领域。因此，我们将应用程序状态保持在 `App` 级。\n\
  \n为了让 `onEdit` 起作用，我们需要捕获它的输出并将结果委托给 `App`。此外，我们需要知道是哪个 `Note` 被修改了，以便我们相应地更新数据。这可以通过下图所示的数据绑定来实现：\n\
  \n![`onEdit` 流程](img/bind.png)\n\n`onEdit` 流程\n\n由于 `onEdit` 定义在 `App` 级，我们需要通过\
  \ `Notes` 传递 `onEdit` 处理器。因此，为了让存根工作，需要修改两个文件。`App` 的代码看起来应该是这样的：\n\n**app/components/App.jsx**\n\
  \n```javascript\nimport uuid from 'node-uuid';\nimport React from 'react';\nimport\
  \ Notes from './Notes.jsx';\n\nexport default class App extends React.Component\
  \ {\n  constructor(props) {\n    ...\n  }\n  render() {\n    const notes = this.state.notes;\n\
  \n    return (\n      <div>\n        <button onClick={this.addNote}>+</button>\n\
  \        <Notes notes={notes} />\n        <Notes notes={notes} onEdit={this.editNote}\
  \ />\n      </div>\n    );\n  }\n  addNote = () => {\n    ...\n  };\n  editNote\
  \ = (id, task) => {\n    // 如果尝试设置空值，则不修改\n    if(!task.trim()) {\n      return;\n\
  \    }\n\n    const notes = this.state.notes.map(note => {\n      if(note.id ===\
  \ id && task) {\n        note.task = task;\n      }\n\n      return note;\n    });\n\
  \n    this.setState({notes});\n  };\n}\n```\n\n为了让方案按照设计工作，我们需要修改 `Notes` 以符合该思路。它将\
  \ `绑定` 目标笔记的 `id`。当回调被触发时，剩余参数将接收一个值并调用该回调：\n\n**app/components/Notes.jsx**\n\n\
  ```javascript\nimport React from 'react';\nimport Note from './Note.jsx';\n\nexport\
  \ default ({notes, onEdit}) => {\n  return (\n    <ul>\n      {notes.map(note =>\n\
  \        <li key={note.id}>\n          <Note\n            task={note.task}\n   \
  \         onEdit={onEdit.bind(null, note.id)}\n            onDelete={onDelete.bind(null,\
  \ note.id)}\n          />\n        </li>\n      ))}\n    </ul>\n  );\n};\n```\n\n\
  \n\n\n从美学角度来看，我们目前的应用程序非常简陋。由于漂亮的应用用起来更有趣，我们可以对此做些改进。在这种情况下，我们将采用一种传统的样式化方法。换句话说，我们会在到处散布一些\
  \ CSS 类，然后根据这些类应用 CSS 选择器。*Styling React* 章节将更详细地讨论其他各种其他方法。\n\n#### 为组件挂载类\n\n\
  为了让我们的应用程序可以进行样式化，我们需要为它的各个部分附加一些类：\n\n`app/components/App.jsx`\n\n```jsx\nimport\
  \ uuid from 'node-uuid';\nimport React from 'react';\nimport Notes from './Notes.jsx';\n\
  \nexport default class App extends React.Component {\n  ...\n  render() {\n    const\
  \ notes = this.state.notes;\n\n    return (\n      <div>\n        <button onClick={this.addNote}>+</button>\n\
  \        <button className=\"add-note\" onClick={this.addNote}>+</button>\n    \
  \    <Notes notes={notes}\n          onEdit={this.editNote}\n          onDelete={this.deleteNote}\
  \ />\n      </div>\n    );\n  }\n  ...\n}\n```\n\n`app/components/Notes.jsx`\n\n\
  ```jsx\nimport React from 'react';\nimport Note from './Note.jsx';\n\nexport default\
  \ ({notes, onEdit, onDelete}) => {\n  return (\n    <ul>{notes.map(note =>\n   \
  \ <ul className=\"notes\">{notes.map(note =>\n      <li key={note.id}>\n      <li\
  \ className=\"note\" key={note.id}>\n        <Note\n          task={note.task}\n\
  \          onEdit={onEdit.bind(null, note.id)}\n          onDelete={onDelete.bind(null,\
  \ note.id)} />\n      </li>\n    )}</</ul>\n  );\n}\n```\n\n`app/components/Note.jsx`\n\
  \n```jsx\nimport React from 'react';\n\nexport default class Note extends React.Component\
  \ {\n  ...\n  renderNote = () => {\n    const onDelete = this.props.onDelete;\n\n\
  \    return (\n      <div onClick={this.edit}>\n        <span>{this.props.task}</span>\n\
  \        <span className=\"task\">{this.props.task}</span>\n        {onDelete ?\
  \ this.renderDelete() : null }\n      </div>\n    );\n  };\n  renderDelete = ()\
  \ => {\n    return <button onClick={this.props.onDelete}>x</button>;\n    return\
  \ <button\n      className=\"delete-note\"\n      onClick={this.props.onDelete}>x</button>;\n\
  \  };\n  ...\n}\n```\n\n#### 组件样式化\n\n第一步是去掉那个难看的*衬线*字体。\n\n`app/main.css`\n\n```css\n\
  body {\n  background: cornsilk;\n  font-family: sans-serif;\n}\n```\n\n现在看起来好看一点了：\n\
  \n![Sans serif](img/react_08.png)\n\n无衬线字体\n\n良好的下一步是稍微限制 `Notes` 容器，并去掉那些列表符号。\n\
  \n`app/main.css`\n\n```css\n...\n\n.add-note {\n  background-color: #fdfdfd;\n \
  \ border: 1px solid #ccc;\n}\n\n.notes {\n  margin: 0.5em;\n  padding-left: 0;\n\
  \n  max-width: 10em;\n  list-style: none;\n}\n```\n\n去掉符号很有帮助：\n\n![No bullets](img/react_09.png)\n\
  \n无符号\n\n为了让单个 `Notes` 脱颖而出，我们可以应用几条规则。\n\n`app/main.css`\n\n```css\n...\n\n.note\
  \ {\n  margin-bottom: 0.5em;\n  padding: 0.5em;\n\n  background-color: #fdfdfd;\n\
  \  box-shadow: 0 0 0.3em 0.03em rgba(0, 0, 0, 0.3);\n}\n.note:hover {\n  box-shadow:\
  \ 0 0 0.3em 0.03em rgba(0, 0, 0, 0.7);\n\n  transition: 0.6s;\n}\n\n.note .task\
  \ {\n  /* 强制使用 inline-block 以便它获得最小高度 */\n  display: inline-block;\n}\n```\n\n现在笔记看起来突出了一了：\n\
  \n![Styling notes](img/react_10.png)\n\n样式化笔记\n\n我在过程中为 `Note` 阴影了动画。这样用户可以更好地指示哪个\
  \ `Note` 正被悬停着。这在基于触摸的界面上不起作用，但对于桌面端来说是一个亮点。\n\n最后，我们应该让那些删除按钮不那么显眼。实现这一点的方法之一是默认隐藏它们并在悬停时显示它们。问题是删除在触摸上无法工作，但我们可以接受这一点。\n\
  \n`app/main.css`\n\n```css\n...\n\n.note .delete-note {\n  float: right;\n\n  padding:\
  \ 0;\n\n  background-color: #fdfdfd;\n  border: none;\n\n  cursor: pointer;\n\n\
  \  visibility: hidden;\n}\n.note:hover .delete-note {\n  visibility: visible;\n\
  }\n```\n\n不再有那些讨厌的删除按钮了：\n\n![Delete on hover](img/react_11.png)\n\n悬停删除\n\n###\
  \ 4.8 理解组件\n\n在完成这几个步骤后，我们有了生命周期钩子。了解它们是如何运作的。。React 提供了以下生命周期钩子：\n\n- `componentWillMount()`\
  \ 在任何渲染之前触发。\n- `componentDidMount()` 在初始渲染后触发。\n- `componentWillReceiveProps(object\
  \ nextProps)` 当组件接收新属性时触发。\n- `shouldComponentUpdate(object nextProps, nextState)`\
  \ 允许你优化渲染。如果你检查属性和状态不需要更新，返回 `false`。\n- `componentWillUpdate(object nextProps,\
  \ nextState)` 在 `shouldComponentUpdate` 之后 `render()` 之前触发。\n- `componentDidUpdate()`\
  \ 在渲染后触发。\n- `componentWillUnmount()` 在组件从 DOM 卸载之前触发。\n\n除了生命周期钩子，如果你在使用 `React.createClass`，还应该了解各种属性和方法：\n\
  \n- `displayName` - 最好设置 `displayName`，这将改进调试信息。对于 ES6 类，它是根据类名自动派生的。\n- `getInitialState()`\
  \ - 在类方法中，可以通过 `constructor` 实现。\n- `getDefaultProps()` - 在类中可以通过 `constructor`\
  \ 中设置这些。\n- `mixins` - `mixins` 包含应用到组件的 mixins 数组。\n- `statics` - `statics` 包含组件的静态属性和方法。在\
  \ ES6 中，你可以按照如下将它们赋值给类：\n\n```jsx\nclass Note {\n  render() {\n    ...\n  }\n}\n\
  Note.willTransitionTo = () => {...};\n\nexport default Note;\n```\n\n某些库例如 React\
  \ DnD 依赖静态方法提供过渡钩子。它们允许你控制当组件显示或隐藏时发生什么。根据定义，静态方法可以通过类本身可用。\n\n\n\n\n\n> React 提供了一项名为\
  \ [refs](https://facebook.github.io/react/docs/more-about-refs.html) 的功能，让你可以通过\
  \ DOM 对 React 元素执行操作。这是一个逃生机制，专为那些 React 本身无法胜任的情况设计。进行测量就是一个很好的例子。Refs 需要附加到有状态的组件上才能工作。\n\
  \n## 4.9 React 组件规范\n\n我倾向于将 `constructor` 放在最前面，接着是生命周期钩子、`render()`，最后是 `render()`\
  \ 使用的方法。我喜欢这种自上而下的方法，因为它使得代码遵循起来一目了然。有些人倾向于将 `render()` 使用的方法放在它之前。还有各种命名规范。你也可以使用\
  \ `_` 前缀作为事件处理程序。\n\n最后，你必须找到适合你自己的且对你最有效的规范。我将在 *Webpack 中的 Linting* 章节中详细介绍这一主题，在那个章节中，我将介绍各种与代码质量相关的工具。通过使用这些工具，可以在一定程度上强制编码风格。\n\
  \n这在团队环境中非常有用。它减少了处理他人编写的代码时的摩擦。即使在个人项目中，使用工具来为你验证语法和标准也是很有用的。它减少了错误的数量和严重程度。\n\n\
  ## 4.10 结论\n\n仅使用原生 React 就能走得很远。问题是，我们开始将数据相关的关注点逻辑与视图组件混合。我们将通过引入 Flux 来改进应用程序的架构。\n\
  \n## 5. React 和 Flux\n\n通过将一切保持在组件中，你可以走得很远。尽管如此，最终会变得痛苦。[Flux 应用架构](https://facebook.github.io/flux/docs/overview.html)\
  \ 有助于为我们的 React 应用带来清晰度。它不是唯一的解决方案，但它是一个不错的起点。\n\nFlux 允许我们将数据和应用状态从视图中分离。这有助于我们保持它们的整洁并使应用程序具有维护性。Flux\
  \ 设计时考虑了大型团队。因此，你可能会发现它非常冗长。不过，这带来了巨大的优势，因为处理起来非常直观。\n\n### 5.1 Flux 简介\n\n![单向\
  \ Flux 数据流](img/flux_linear.png)\n\n单向 Flux 数据流\n\n到为止，我们一直只处理视图。Flux 架构在其中引入了几个新概念。这些是动作（actions）、调度器（dispatcher）和存储（stores）。与流行的\
  \ Angular 或 Ember 等框架不同，Flux 实现的是单向流。尽管双向绑定可能很方便，但它们是有代价的。很难推断发生了什么以及为什么。\n\n####\
  \ 动作 (Actions) 和存储 (Stores)\n\nFlux 并不完全容易理解，因为有很多概念需要考虑。在我们的案例中，我们将为 `NoteActions`\
  \ 和 `NoteStore`。`NoteActions` 提供了我们对数据上执行的具体操作。例如，我们可以拥有 `NoteActions.create({task:\
  \ 'Learn React'})`。\n\n#### 调度器 (Dispatcher)\n\n当我们触发一个动作时，调度器会收到通知。调度器能够处理存储之间可能的依赖关系。某个动作可能需要在另一个动作之前发生。调度器允许我们实现这一点。\n\
  \n在最简单的层面，动作只需原样将消息传递给调度器。它们还可以触发异步查询，并最终根据结果触发调度器。这允许我们处理收到的数据和可能的错误。\n\n一旦调度器处理了动作，监听它的存储就会被触发。在我们的案例中，`NoteStore`\
  \ 会收到通知。结果是它能够更新其内部状态。在此之后，它将通知可能的监听者新状态。\n\n#### Flux 数据流\n\n这完成了 Flux 基础的单向但线性的流程。然而，单向过程通常具有循环流，并且并不一定结束。接下来的图说明了一个更常见的流。这仍然是同一个想法，但增加了一个返回的循环。最终，依赖于我们存储数据的组件将通过这个循环过程得到刷新。\n\
  \n对于创建一个新 `Note` 这样简单的事情来说，这听起来有很多步骤。这种方法确实有其益处。鉴于流始终是单方向的，因此很容易追踪和调试。如果有问题，它一定在循环中的某处。\n\
  \n![带有循环的 Flux 数据流](img/flux.png)\n\n带有循环的 Flux 数据流\n\n#### Flux 的优势\n\n尽管这听起来有点复杂，但这种安排为我们的应用程序提供了活性。例如，我们可以在视图之外实现\
  \ API 通信、缓存和 i18n（国际化）。这样，它们可以保持逻辑之外的纯洁，同时让应用程序更容易理解。\n\n在你的应用程序中实现 Flux 架构实际上会增加一些代码量。重要的是，最小化编写的代码量并不是\
  \ Flux 的目标。它的设计是为了让大型团队提高生产力。你可以说显式比隐式更好。\n\n#### 使用哪种 Flux 实现？\n\n库的情况在不断变化。解释这种架构没有单一的正确方法。你会发现适合不同口味的实现。[voronianski/flux-comparison](https://github.com/voronianski/flux-comparison)\
  \ 提供了某些较流行的实现之间很好的比较。\n\n在选择库时，取决于你个人的喜好。你必须考虑各种因素，如 API、功能、文档和支持。从较流行的替代方案之一开始是一个好主意。当你开始理解架构时，你能够做出更好地服务你的选择。\n\
  \n### 5.2 迁移到 Alt\n\n![Alt](img/alt.png)\n\nAlt\n\n在本章中，我们将使用一个名为 [Alt](http://alt.org/)\
  \ 的库。它是一个灵活、功能全面的实现，为通用渲染设计。\n\n在 Alt 中，你将处理动作和存储。调度器是隐藏的，但需要时你仍然可以访问它。与其他实现相比，Alt\
  \ 隐藏了很多模板代码。它具有特殊功能允许你保存和恢复应用程序状态。#### 设置 Alt 实例\n\nAlt 的一切始于 Alt 实例。它跟踪动作和存储并保持通信。为了保持简单，我们将所有的\
  \ Alt 组件视为[单例](https://en.wikipedia.org/wiki/Singleton_pattern)。通过这种模式，我们在整个应用程序中重用同一个实例。为了实现这一点，将其如下：\n\
  \n**app/libs/alt.js**\n\n```\nimport Alt from 'alt';\n//import chromeDebug from\
  \ 'alt-utils/lib/chromeDebug';\n\nconst alt = new Alt();\n//chromeDebug(alt);\n\n\
  export default alt;\n```\n\nWebpack 会缓存模块，所以下次导入 Alt 时它将返回同一个实例。\n\n#### 为 Notes\
  \ 定义 CRUD API\n\n接下来，我们需要定义一个操作 Note 数据的基本 API。为了保持简单，我们可以对其进行 CRUD（增删改查）。由于读取是隐式的，我们不需要它。不过，我们可以将其余部分建模为动作。Alt\
  \ 提供了一个名为 `generateActions` 的快捷方式。我们可以这样使用它：\n\n**app/actions/NoteActions.js**\n\
  \n```\nimport alt from '../libs/alt';\n\nexport default alt.generateActions('create',\
  \ 'update', 'delete');\n```\n\n### 5.3 为 `Notes` 定义存储\n\n存储是应用程序状态某部分的单一事实来源。在我们的案例中，我们需要一个来维护笔记的状态。我们将使用\
  \ `bindActions` 函数连接上面定义的所有动作。\n\n\n\n\n我们已经在 `App` 中拥有了 store 所需的逻辑。我们将这些逻辑移动到\
  \ `NoteStore`。\n\n#### 搭建骨架\n\n第一步，我们可以为 store 搭建一个骨架。之后，我们可以填充需要的方法。Alt 使用标准的 ES6\
  \ 类，因此它的语法与我们之前看到的 React 组件相同。这里是一个起点：\n\n**app/stores/NoteStore.js**\n\n```\nimport\
  \ uuid from 'node-uuid';\nimport alt from '../libs/alt';\nimport NoteActions from\
  \ '../actions/NoteActions';\n\nclass NoteStore {\n  constructor() {\n    this.bindActions(NoteActions);\n\
  \n    this.notes = [];\n  }\n  create(note) {\n\n  }\n  update(updatedNote) {\n\n\
  \  }\n  delete(id) {\n\n  }\n}\n\nexport default alt.createStore(NoteStore, 'NoteStore');\n\
  ```\n\n我们调用 `bindActions` 将每个 action 映射到对应的同名方法。之后，我们在每个方法中触发相应的逻辑。最后，我们使用 `alt.createStore`\
  \ 将 store 与 Alt 连接起来。\n\n注意，不需要为 store 分配标签（在此例中为 `NoteStore`）。不过这是一个良好的习惯，它可以保护代码免受混淆（minification）。当我们持久化数据时，这些标签会变得重要。\n\
  \n#### 实现 `create`\n\n与之前的逻辑相比，`create` 会自动为 `Note` 生成一个 id。这是一个隐藏在 store 内部的细节：\n\
  \n**app/stores/NoteStore.js**\n\n```\nimport uuid from 'node-uuid';\nimport alt\
  \ from '../libs/alt';\nimport NoteActions from '../actions/NoteActions';\n\nclass\
  \ NoteStore {\n  constructor() {\n    ...\n  }\n  create(note) {\n    const notes\
  \ = this.notes;\n\n    note.id = uuid.v4();\n\n    this.setState({\n      notes:\
  \ notes.concat(note)\n    });\n  }\n  ...\n}\n\nexport default alt.createStore(NoteStore,\
  \ 'NoteStore');\n```\n\n为了保持实现的整洁，我们使用了 `this.setState`。这是 Alt 的功能，允许我们表示要修改 store\
  \ 的状态。Alt 会向可能的监听器信号变化。\n\n#### 实现 `update`\n\n`update` 除了重命名外，遵循之前的逻辑。最重要的是，我们通过\
  \ `this.setState` 提交新状态：\n\n**app/stores/NoteStore.js**\n\n```\n...\n\nclass NoteStore\
  \ {\n  ...\n  update(updatedNote) {\n    const notes = this.notes.map(note => {\n\
  \      if(note.id === updatedNote.id) {\n        // 这里使用 Object.assign 来修补 note\
  \ 数据。它\n        // 会变异目标（第一个参数）。为了避免这一点，\n        // 我使用 {} 作为目标并在其上应用数据。\n    \
  \    //\n        // 示例：{}, {a: 5, b: 3}, {a: 17} -> {a: 17, b: 3}\n        //\n\
  \        // 你可以向该方法传递任意数量的对象。\n        return Object.assign({}, note, updatedNote);\n\
  \      }\n\n      return note;\n    });\n\n    // 这等同于 `this.setState({notes: notes})`\n\
  \    this.setState({notes});\n  }\n  delete(id) {\n\n  }\n}\n\nexport default alt.createStore(NoteStore,\
  \ 'NoteStore');\n```\n\n我们只剩下最后一个操作：`delete`。\n\n#### 实现 `delete`\n\n`delete` 是直观的。像之前一样，查找并销毁，并记住提交更改：\n\
  \n**app/stores/NoteStore.js**\n\n```\n...\n\nclass NoteStore {\n  ...\n  delete(id)\
  \ {\n    this.setState({\n      notes: this.notes.filter(note => note.id !== id)\n\
  \    });\n  }\n}\n\nexport default alt.createStore(NoteStore, 'NoteStore');\n```\n\
  \n\n\n尽管整合 Alt 费了大量精力，但并非徒劳无功。考虑以下问题：\n\n1. 假设我们想将笔记持久化在 `localStorage` 中。你会哪里实现它？一种方法是在应用初始化时处理。\n\
  2. 如果有很多组件依赖于这些数据呢？我们只需要消费 `NoteStore` 并以我们想要的方式显示它即可。\n3. 如果我们有针对不同任务类型的多个独立 Note\
  \ 列表呢？我们可以设置另一个 store 来跟踪这些列表。该 store 可以通过 id 引用实际的。。将在下一章进行此类操作，并将该方法进行泛化。\n\n\
  这就是为什么 Flux 与 React 使用时是强强大的架构的原因。找到此类问题的答案并不困难。虽然代码更多，但它更容易推理。由于我们处理的是单向流，因此拥有了易于调试和测试的东西。\n\
  \n## ## 5.5 在 `localStorage` 上实现持久化\n\n我们将修改 `NoteStore` 的实现，以便在更改时持久化数据。这样我们在刷新后就不会丢失数据。实现这一点的一种方法是使用\
  \ [localStorage](https://developer.mozilla.org/en/docs/Web/API/Window/localStorage)。这是一个支持良好的特性，允许你将数据持久化到浏览器。\n\
  \n### ### 理解 `localStorage`\n\n`localStorage` 有一个名为 `sessionStorage` 的兄弟节点。`sessionStorage`\
  \ 在浏览器关闭时会丢失数据，而 `localStorage` 会保留其数据。它们共享下面所讨论的[相同 API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API/Using_the_Web_Storage_API)：\n\
  \n* `storage.getItem(k)` - 返回给定键的存储的字符串值。\n* `storage.removeItem(k)` - 与键匹配的数据。\n\
  * `storage.setItem(k, v)` - 使用给定的键存储给定的值。\n* `storage.clear()` - 清空存储内容。\n\n注意，使用浏览器开发者工具操作该\
  \ API 是方便的。例如，在 Chrome 中，你可以通过 `Resources` 标签页查看存储状态。`Console` 标签页允许你对数据进行直接操作。你甚至可以使用\
  \ `storage.key` 和 `storage.key = 'value'` 简写形式进行快速修改。\n\n`localStorage` 和 `sessionStorage`\
  \ 合共可以使用多达 10 MB 的数据。尽管它们得到了良好支持，但在某些边界情况下会出现有趣的失败。这些包括在 Internet Explorer 中内存耗尽（静默失败）以及在\
  \ Safari 的无痕模式下完全失败。不过，这些可以规避这些故障。\n\n### ### 为 `localStorage` 实现包装器\n\n为了保持简单易于管理，我们可以为\
  \ `storage` 实现一个小型包装器。它将封装所有这些复杂性。API 期望字符串。\n\n由于对象很方便，我们将使用 `JSON.parse` 和 `JSON.stringify`\
  \ 进行序列化。我们只需要实现所示的 `storage.get(k)` 和 `storage.set(k, v)`：\n\n**app/libs/storage.js**\n\
  \n```javascript\nexport default {\n  get(k) {\n    try {\n      return JSON.parse(localStorage.getItem(k));\n\
  \    }\n    catch(e) {\n      return null;\n    }\n  },\n  set(k, v) {\n    localStorage.setItem(k,\
  \ JSON.stringify(v));\n  }\n};\n```\n\n该实现可以进一步泛化。你可以将其转换为工厂（`storage => {...}`）并使其能够交换存储。现在除非更改代码，否则我们被局限于\
  \ `localStorage`。\n\n### ### 使用 `FinalStore` 持久化应用\n\n除了这个小工具，我们还需要适配应用以使用它。Alt\
  \ 提供了一个名为 `FinalStore` 的内置 store，非常适合此目的。我们可以使用 `FinalStore`、引导（bootstrapping）和快照（snapshotting）来持久化应用程序的状态。`FinalStore`\
  \ 是一个监听所有现有 store 的 store。每当某个 store 变化时，`FinalStore` 都会。。这使其持久化的理想选择。\n\n每当 `FinalStore`\
  \ 变化时，我们可以获取整个应用状态的快照并将其推送到 `localStorage`。这解决了问题的部分。引导过程解决了剩余部分，因为 `alt.bootstrap`\
  \ 允许我们设置所有 store 的状态。该方法不会发出事件。为了让我们的 store 填充正确的状态，我们需要在组件渲染之前调用它。在我们的案例中，我们将从\
  \ `localStorage` 获取数据并调用它来填充我们的 store。\n\n为了将此主意整合到我们的应用中，我们需要实现一个很小的模块来管理它。我们在那里考虑了可能的初始数据并触发新逻辑。\n\
  \n`app/libs/persist.js` 完成了困难部分。它将设置 `FinalStore`、处理引导（恢复数据）和快照（保存数据）。我包含了一个 `debug`\
  \ 标记形式的逃生口。如果设置了它，数据将不会保存到 `localStorage`。理由是通过这样做，你可以设置标记（`localStorage.setItem('debug',\
  \ 'true')`）、点击 `localStorage.clear()` 并刷新浏览器以获得干净的起点。下面的实现说明了这些思想：\n\n**app/libs/persist.js**\n\
  \n```javascript\nimport makeFinalStore from 'alt-utils/lib/makeFinalStore';\n\n\
  export default function(alt, storage, storeName) {\n  const finalStore = makeFinalStore(alt);\n\
  \n  try {\n    alt.bootstrap(storage.get(storeName));\n  }\n  catch(e) {\n    console.error('Failed\
  \ to bootstrap', e);\n  }\n\n  finalStore.listen(() => {\n    if(!storage.get('debug'))\
  \ {\n      storage.set(storeName, alt.takeSnapshot());\n    }\n  });\n}\n```\n\n\
  \n\n\n```\nimport AltContainer from 'alt-container';\nimport React from 'react';\n\
  import Notes from './Notes.jsx';\nimport NoteActions from '../actions/NoteActions';\n\
  import NoteStore from '../stores/NoteStore';\n\nexport default class App extends\
  \ React.Component {\n  constructor(props) {\n    super(props);\n\n    this.state\
  \ = NoteStore.getState();\n  }\n  componentDidMount() {\n    NoteStore.listen(this.storeChanged);\n\
  \  }\n  componentWillUnmount() {\n    NoteStore.unlisten(this.storeChanged);\n \
  \ }\n  storeChanged = (state) => {\n    // Without a property initializer `this`\
  \ wouldn't\n    // point at the right context (defaults to `undefined` in strict\
  \ mode).\n    this.setState(state);\n  };\n  render() {\n    const notes = this.state.notes;\n\
  \n    return (\n      <<div>\n        <button className=\"add-note\" onClick={this.addNote}>+</button>\n\
  \        <Notes notes={notes}\n          onEdit={this.editNote}\n          onDelete={this.deleteNote}\
  \ />\n        <AltContainer\n          stores={[NoteStore]}\n          inject={{\n\
  \            notes: () => NoteStore.getState().notes\n          }}\n        >\n\
  \          <Notes onEdit={this.editNote} onDelete={this.deleteNote} />\n       \
  \ </AltContainer>\n      </div>\n    );\n  }\n  ...\n}\n```\n\n`AltContainer` 允许我们将数据绑定到它的直接子元素上。在这种情况下，它向\
  \ `Notes` 注入了 `notes` 属性。这种模式允许我们建立与多个 store 的任意连接并对其进行管理。你可以在关于装饰器的附录找到另一种可能的方法。\n\
  \n集成 `AltContainer` 将此组件与 `Alt` 绑定。如果你希望具有前瞻性，可以将其放入你自己的组件中。该外层会隐藏 `Alt` 并允许你以后将其替换为其他东西。\n\
  \n### 5.7 在 Alt 中分发 (Dispatching)\n\n尽管你不使用 Flux 分发器也能走很远，但了解一些它仍然是有用的。Alt 提供了两种使用它的方法。如果你想记录通过你的\
  \ `alt` 实例的所有内容，可以使用代码片段，例如 `alt.dispatcher.register(console.log.bind(console))`。或者，你可以在\
  \ store 构造函数中触发 `this.dispatcher.register(...)`。这些机制允许你实现有效的日志记录。\n\n### 5.8 替代实现\n\
  \n尽管我们最终在实现中使用了 `Alt`，但它并不是唯一的选择。为了对各种架构进行基准测试，我使用不同的技术实现了同一个应用程序。我在下面简要比较了它们：\n\
  \n* [Redux](http://rackt.org/redux/) 是一种受 Flux 启发的架构，设计以热加载为主要约束进行设计。Redux 基于单一状态树运行。树的状态通过称为\
  \ reducers 的 `pure functions` 进行操纵。尽管有一些样板代码，但 Redux 强制你深入研究函数式编程。- [Redux demo](https://github.com/survivejs/redux-demo)\n\
  \n* 与 Redux 相比，[Cerebral](http://www.cerebraljs.com/) 有不同的起点。它的开发是为了提供关于应用程序如何改变状态的见解。Cerebral\
  \ 提供了更具主见性的开发方式，因此自带了更多功能（batteries included）。- [Cerebral demo](https://github.com/survivejs/cerebral-demo)\n\
  \n* [Mobservable](https://mweststrate.github.io/mobservable/) 允许你让数据结构变得可观测。这些结构可以与\
  \ React 组件连接，这样每当结构更新时，React 组件也会之更新。可以使用结构之间的真实引用，Kanban 的实现简单得惊人。- [Mobservable\
  \ demo](https://github.com/survivejs/mobservable-demo)\n\n### 5.9 Relay?\n\n与 Flux\
  \ 相比，Facebook 的 [Relay](https://facebook.github.io/react/blog/2015/02/20/introducing-relay-and-graphql.html)\
  \ 在数据获取方面有所改进。它允许你将数据需求推送到视图层。根据，它可以独立使用或配合 Flux 使用。\n\n鉴于它在很大程度上仍然未经过充分测试，我们还没有在书中介绍它。Relay\
  \ 有它自己的特殊要求（GraphQL 兼容 API）。只有时间才能证明它如何被社区采用。\n\n### 5.10 结论\n\n在本章中，你了解了如何我们将简单的应用程序迁移到使用\
  \ Flux 架构。在这个过程中，我们学习了 Flux 的基本概念。现在我们准备好为我们的应用程序添加更多功能了。\n\n## 6. 从 Notes 到 Kanban\n\
  \n![Kanban board](img/kanban_05.png)\n\n看板 面板\n\n到目前为止，我们开发了一个在 `localStorage` 中跟踪笔记的应用程序。我们仍然有工作要做将其变成上面所示的真实看板。最重要的是，我们的系统缺少\
  \ `Lane`（通道）的概念。\n\n`Lane` 是一个应该能够在内部包含许多 `Notes` 并跟踪它们顺序的东西。建模这种关系的方法之一是让 `Lane`\
  \ 通过一个 `Note` id 数组指向 `Notes`。这种关系可以反过来。一个 `Note` 可以使用 `id` 指向 `Lane` 并维护关于它在 `Lane`\
  \ 中位置的信息。在这种情况下，我们将坚持前一种设计，因为这有利于以后的重新排序。\n\n### 6.1 提取 Lanes\n\n正如之前，我们在这里使用两个组件的想法。这里有一个高层组件（即\
  \ `Lanes`）和一个低层组件（即 `Lane`）。高层组件将处理通道排序。`Lane` 将渲染自身（即名称和 `Notes`）并具有基本操作。\n\n正如与\
  \ `Notes` 一样，我们需要一组操作。目前，只要我们可以创建新通道就足够了，如下：\n\n**app/actions/LaneActions.js**\n\
  \n```javascript\nimport alt from '../libs/alt';\n\nexport default alt.generateActions('create');\n\
  ```\n\n此外，我们需要 `LaneStore` 和一个匹配 `create` 的方法。与之前的 `NoteStore` 非常相似。`create` 将一个新的通道连接到通道列表中。之后，更改将传播到监听器（即\
  \ `FinalStore` 和组件）。\n\n**app/stores/LaneStore.js**\n\n```javascript\nimport uuid\
  \ from 'node-uuid';\nimport alt from '../libs/alt';\nimport LaneActions from '../actions/LaneActions';\n\
  \nclass LaneStore {\n  constructor() {\n    this.bindActions(LaneActions);\n\n \
  \   this.lanes = [];\n  }\n  create(lane) {\n    const lanes = this.lanes;\n\n \
  \   lane.id = uuid.v4();\n    lane.notes = lane.notes || [];\n\n    this.setState({\n\
  \      lanes: lanes.concat(lane)\n    });\n  }\n}\n\nexport default alt.createStore(LaneStore,\
  \ 'LaneStore');\n```\n\n我们还需要 `Lanes` 的一个存根。我们稍后会扩展它。现在我们只想让它显示出来。\n\n**app/components/Lanes.jsx**\n\
  \n```javascript\nimport React from 'react';\n\nexport default class Lanes extends\
  \ React.Component {\n  render() {\n    return (\n      <div className=\"lanes\"\
  >\n        lanes should go here\n      </div>\n    );\n  }\n}\n```\n\n接下来，我们需要在\
  \ `App` 中为 `Lanes` 留出空间。我们将只需将 `Notes` 引用替换为 `Lanes`，根据需要设置操作和存储。\n\n**app/components/App.jsx**\n\
  \n\n\n\n\n```javascript\nimport AltContainer from 'alt-container';\nimport React\
  \ from 'react';\nimport Notes from './Notes.jsx';\nimport NoteActions from '../actions/NoteActions';\n\
  import NoteStore from '../stores/NoteStore';\nimport Lanes from './Lanes.jsx';\n\
  import LaneActions from '../actions/LaneActions';\nimport LaneStore from '../stores/LaneStore';\n\
  \nexport default class App extends React.Component {\n  render() {\n    return (\n\
  \      <div\n        <button className=\"add-note\" onClick={this.addNote}>+</button>\n\
  \        <button className=\"add-lane\" onClick={this.addLane}>+</button>\n    \
  \    <AltContainer\n          stores={[NoteStore]}\n          inject={{\n      \
  \      notes: () => NoteStore.getState().notes\n          }}\n        >\n      \
  \  <AltContainer\n          stores={[LaneStore]}\n          inject={{\n        \
  \    lanes: () => LaneStore.getState().lanes || []\n          }}\n        >\n  \
  \        <Notes onEdit={this.editNote} onDelete={this.deleteNote} />\n         \
  \ <Lanes />\n        </AltContainer>\n      </div>\n    );\n  }\n  deleteNote =\
  \ (id, e) => {\n    e.stopPropagation();\n\n    NoteActions.delete(id);\n  };\n\
  \  addNote = () => {\n    NoteActions.create({task: 'New task'});\n  };\n  editNote\
  \ = (id, task) => {\n    // 如果尝试设置空值，则不修改\n    if(!task.trim()) {\n      return;\n\
  \    }\n\n    NoteActions.update({id, task});\n  };\n  addLane() {\n    LaneActions.create({name:\
  \ 'New lane'});\n  }\n}\n```\n\n如果你在浏览器中查看实现代码，你会发现目前的实现并没有做什么什么。它只是显示了一个加号按钮和 `lanes\
  \ should go here` 文本。甚至添加按钮还没有作用。我们仍然需要建模 `Lane` 并将 `Notes` 载到上面，才能让这一切功能工作起来。\n\
  \n## 6.2 建模 `Lane`\n\n`Lanes` 容器将分别渲染每个 `Lane`。每个 `Lane` 随后会渲染关联的 `Notes`，就像我们之前的\
  \ `App` 所做的那样。在这种意义上，`Lanes` 与 `Notes` 是相似的。下面的示例说明了如何设置它：\n\n**app/components/Lanes.jsx**\n\
  \n```javascript\nimport React from 'react';\nimport Lane from './Lane.jsx';\n\n\
  export default ({lanes}) => {\n  return (\n    <div className=\"lanes\">{lanes.map(lane\
  \ =>\n      <Lane className=\"lane\" key={lane.id} lane={lane} />\n    )}</</div>\n\
  \  );\n}\n```\n\n我们还需要一个 `Lane` 组件来使此功能工作。它将渲染 `Lane` 名称和关联的 `Notes`。下面的示例在很大程度上参考了我们之前对\
  \ `App` 的实现。它将渲染整个通道，包括它的名称和关联笔记：\n\n**app/components/Lane.jsx**\n\n```javascript\n\
  import AltContainer from 'alt-container';\nimport React from 'react';\nimport Notes\
  \ from './Notes.jsx';\nimport NoteActions from '../actions/NoteActions';\nimport\
  \ NoteStore from '../stores/NoteStore';\n\nexport default class Lane extends React.Component\
  \ {\n  render() {\n    const {lane, ...props} = this.props;\n\n    return (\n  \
  \    <div {...props}>\n        <div className=\"lane-header\">\n          <div className=\"\
  lane-add-note\">\n            <button onClick={this.addNote}>+</button>\n      \
  \    </div>\n          <div className=\"lane-name\">{lane.name}</div>\n        </div>\n\
  \        <AltContainer\n          stores={[NoteStore]}\n          inject={{\n  \
  \          notes: () => NoteStore.getState().notes || []\n          }}\n       \
  \ >\n          <Notes onEdit={this.editNote} onDelete={this.deleteNote} />\n   \
  \     </AltContainer>\n      </div>\n    );\n  }\n  editNote(id, task) {\n    //\
  \ 如果尝试设置空值，则不修改\n    if(!task.trim()) {\n      return;\n    }\n\n    NoteActions.update({id,\
  \ task});\n  }\n  addNote() {\n    NoteActions.create({task: 'New task'});\n  }\n\
  \  deleteNote(id, e) {\n    e.stopPropagation();\n\n    NoteActions.delete(id);\n\
  \  }\n}\n```\n\n我在示例中使用了 [Object 解构/展开语法 (stage 2)](https://github.com/sebmarkbage/ecmascript-rest-spread)\
  \ (`const {a, b, ...props} = this.props`)。这允许我们为 `Lane` 附加一个 `className`，并避免用我们不需要的\
  \ HTML 属性污染它。该语法将对象的键值对展开为 props，这样我们就不需要单独编写每个需要的 prop。\n\n如果你运行应用程序并尝试添加新笔记，你会发现有些不对。你添加的每条笔记都被所有通道共享。如果修改了某条笔记，其他通道也会更新。\n\
  \n![Duplicate notes](img/kanban_01.png)\n\n重复的笔记\n\n发生这种情况的原因很简单。我们的 `NoteStore`\
  \ 是一个单例。这意味着每个监听 `NoteStore` 的组件都将接收到相同的数据。我们需要某种方式来解决这个问题。\n\n### 6.3 让 `Lanes`\
  \ 负责 `Notes`\n\n目前，我们的 `Lane` 仅包含一个对象数组。每个对象都知道自己的 `id` 和 `name`。我们需要更多内容。\n\n为了让此功能工作，每个\
  \ `Lane` 需要知道哪些 `Notes` 属于它。如果一个 `Lane` 包含一个对象数组……\n\n#### 设置 `attachToLane`\n\n\
  当我们使用 `addNote` 向系统添加 `Note` 时，我们需要将其附加到通道中。例如：\n\n```javascript\nconst note = NoteActions.create({task:\
  \ 'New task'});\n\nLaneActions.attachLane({\n  noteId: note.id,\n  laneId\n});\n\
  ```\n\n为了开始，我们应该在 actions 中添加 `attachToLane`：\n\n**app/actions/LaneActions.js**\n\
  \n```javascript\nimport alt from '../libs/alt';\n\nexport default alt.generateActions('create',\
  \ 'attachToLane');\n```\n\n**app/stores/LaneStore.js**\n\n```javascript\nimport\
  \ uuid from 'node-uuid';\nimport alt from '../libs/alt';\n...\n```\n\n#### 设置 `detachFromLane`\n\
  \n`deleteNote` 是 `addNote` 的相反操作。在移除 `Note` 时，同样移除它与 `Lane` 的关联。为了这个目的，我们可以实现 `LaneActions.detachFromLane({laneId:\
  \ <id>})`。我们可以这样使用它：\n\n```javascript\nLaneActions.detachFromLane({laneId, noteId});\n\
  NoteActions.delete(noteId);\n```\n\n\n\n\n\n```javascript\nimport uuid from 'node-uuid';\n\
  import alt from '../libs/alt';\nimport LaneActions from '../actions/LaneActions';\n\
  \nclass LaneStore {\n  ...\n  attachToLane({laneId, noteId}) {\n    ...\n  }\n \
  \ detachFromLane({laneId, noteId}) {\n    const lanes = this.lanes.map(lane => {\n\
  \      if(lane.id === laneId) {\n        lane.notes = lane.notes.filter(note =>\
  \ note !== noteId);\n      }\n\n      return lane;\n    });\n\n    this.setState({lanes});\n\
  \  }\n}\n\nexport default alt.createStore(LaneStore, 'LaneStore');\n```\n\n仅仅在通道（lane）和笔记（note）之间建立关联是不够的。我们需要某种方法将笔记引用解析为可以通过用户界面显示的数据。为此，我们需要实现一个特殊的\
  \ getter（getter），以便为每个通道获取我们想要的数据。\n\n#### 为 `NoteStore` 实现 getter\n\n将通道笔记解析为实际数据的一种巧妙方法是实现一个公共方法\
  \ `NoteStore.getNotesByIds(notes)`。它接受一个 `Note` id 数组，并返回对应的对象。\n\n仅仅实现该方法是不够的。我们还需要将其公开。在\
  \ Alt 中，这可以通过 `this.exportPublicMethods` 实现。它接收一个描述该 store 公共接口的对象。请考虑下面的实现：\n\n\
  **app/stores/NoteStore.jsx**\n\n```javascript\nimport uuid from 'node-uuid';\nimport\
  \ alt from '../libs/alt';\nimport NoteActions from '../actions/NoteActions';\n\n\
  class NoteStore {\n  constructor() {\n    this.bindActions(NoteActions);\n\n   \
  \ this.notes = [];\n\n    this.exportPublicMethods({\n      getNotesByIds: this.getNotesByIds.bind(this)\n\
  \    });\n  }\n  ...\n  getNotesByIds(ids) {\n    // 1\\. 确保我们正在对数组进行操作并\n    //\
  \ 遍历 ids\n    // [id, id, id, ...] -> [[Note], [], [Note], ...]\n    return (ids\
  \ || []).map(\n      // 2\\. 提取匹配的笔记\n      // [Note, Note, Note] -> [Note, ...]\
  \ (匹配) 或 [] (不匹配)\n      id => this.notes.filter(note => note.id === id)\n    //\
  \ 3\\. 过滤掉可能的空数组并获取笔记\n    // [[Note], [], [Note]] -> [[Note], [Note]] -> [Note,\
  \ Note]\n    ).filter(a => a.length).map(a => a[0]);\n  }\n}\n\nexport default alt.createStore(NoteStore,\
  \ 'NoteStore');\n```\n\n注意，该实现过滤了可能的空数组。\n\n#### 将 `Lane` 与逻辑连接\n\n现在我们已经有了逻辑部分，可以将其与\
  \ `Lane` 集成。我们需要考虑 props：\n\n**app/components/Lane.jsx**\n\n```javascript\n...\n\
  import LaneActions from '../actions/LaneActions';\n\nexport default class Lane extends\
  \ React.Component {\n  render() {\n    const {lane} = this.props;\n\n    return\
  \ (\n      <div className=\"lane\">\n        <div className=\"lane-header\">{lane.name}</div>\n\
  \        <AltContainer\n          stores={[NoteStore]}\n          notes={() => NoteStore.getNotesByIds(lane.notes)}\n\
  \        >\n          <Notes onEdit={this.editNote} onDelete={this.deleteNote} />\n\
  \        </AltContainer>\n      </div>\n    );\n  }\n  editNote(task) {\n    if(!task)\
  \ {\n      return;\n    }\n    LaneActions.update({task});\n  }\n\n  deleteNote(id)\
  \ {\n    e.stopPropagation();\n    LaneActions.delete(id);\n  }\n\n  addNote = ()\
  \ => {\n    LaneActions.create({task: 'New task'});\n  }\n\n  deleteNote = (noteId,\
  \ e) => {\n    e.stopPropagation();\n\n    const laneId = this.props.id;\n\n   \
  \ detachActions.,FromId});\n  };\n}\n```\n\n有三个重要的变化：\n\n*   需要引用 `this` 的方法已在 `constructor`\
  \ 中进行了绑定。\n*   `notes={() => NoteStore.getNotesByIds(lane.notes)}` - 我们新的 getter\
  \ 被用于过滤笔记。\n*   `addNote`、`deleteNote` - 这些方法现在根据新逻辑运行。\n\n在完成这些更改后，我们拥有了一个可以维护\
  \ `Lanes` 和 `Notes` 之间关系的系统。当前的结构允许我们保持单例 store 和扁平化的数据结构。处理引用有点笨拙，但这与 Flux 架构是一致的。\n\
  \n如果你尝试向特定通道添加笔记，它们不应该被重复。此外，编辑笔记的行为应该如你预期的：\n\n![kanban_02.png \n\n#### 关于数据依赖和\
  \ `waitFor`\n\n目前的设置之所以有效，是因为我们的 actions 是同步的。如果我们处理后端数据，情况就会变得更加棘手。在这种情况下，我们需要设置基于\
  \ `waitFor` 的代码。[waitFor](http://alt.js.org/guide/wait-for/) 允许我们处理数据依赖关系。它告诉 dispatcher\
  \ 在继续执行之前应该等待。以下是这种方法的工作方式示例（无需更改你的代码！）：\n\n```javascript\nNoteActions.create({task:\
  \ 'New task'});\n\n// 触发 waitFor\nLaneActions.attachToLane({laneId});\n```\n\n**app/stores/LaneStore.js**\n\
  \n```javascript\nclass LaneStore {\n  ...\n  attachToLane({laneId, noteId}) {\n\
  \    if(!noteId) {\n      this.waitFor(NoteStore);\n\n      noteId = NoteStore.getState().notes.slice(-1)[0].id;\n\
  \    }\n\n    ...\n  }\n}\n```\n\n幸运的是，在这种情况下我们可以避免使用 `waitFor`。你应该谨慎地使用它。然而，当你需要处理相互依赖的异步获取的数据时，它是必须的。\n\
  \n### 6.4 为 `Lane` 实现编辑/删除\n\n我们仍然缺少一些基础功能，例如编辑和删除通道。将 *Note.jsx* 复制为 *Editable.jsx*。我们会在项目的后期阶段回到原始的\
  \ *Note.jsx*。现在，我们只想让 `Editable` 处于良好的状态。按照如下方式调整代码以泛化实现：\n\n\n\n\n```javascript\n\
  import React from 'react';\n\nexport default class Note extends React.Component\
  \ {\nexport default class Editable extends React.Component {\n  constructor(props)\
  \ {\n    super(props);\n\n    // Track `editing` state.\n    this.state = {\n  \
  \    editing: false\n    };\n  }\n  render() {\n    // Render the component differently\
  \ based on state.\n    if(this.state.editing) {\n      return this.renderEdit();\n\
  \    }\n\n    return this.renderNote();\n  }\n  render() {\n    const {value, onEdit,\
  \ onValueClick, editing, ...props} = this.props;\n\n    return (\n      <div {...props}>\n\
  \        {editing ? this.renderEdit() : this.renderValue()}\n      </div>\n    );\n\
  \  }\n  renderEdit = () => {\n    return <input type=\"text\"\n      ref={\n   \
  \     (e) => e ? e.selectionStart = this.props.task.length : null\n        (e) =>\
  \ e ? e.selectionStart = this.props.value.length : null\n      }\n      autoFocus={true}\n\
  \      defaultValue={this.props.task}\n      defaultValue={this.props.value}\n \
  \     onBlur={this.finishEdit}\n      onKeyPress={this.checkEnter} />;\n  };\n \
  \ renderNote = () => {\n    const onDelete = this.props.onDelete;\n\n    return\
  \ (\n      <div onClick={this.edit}>\n        <span className=\"task\">{this.props.task}</span>\n\
  \        {onDelete ? this.renderDelete() : null }\n      </div>\n    );\n  };\n\
  \  renderValue = () => {\n    const onDelete = this.props.onDelete;\n\n    return\
  \ (\n      <div onClick={this.props.onValueClick}>\n        <span className=\"value\"\
  >{this.props.value}</span>\n        {onDelete ? this.renderDelete() : null }\n \
  \     </div>\n    );\n  };\n  renderDelete = () => {\n    return <button\n     \
  \ className=\"delete-note\"\n      className=\"delete\"\n      onClick={this.props.onDelete}>x</button>;\n\
  \  };\n  edit = () => {\n    // Enter edit mode.\n    this.setState({\n      editing:\
  \ true\n    });\n  };\n  checkEnter = (e) => {\n    if(e.key === 'Enter') {\n  \
  \    this.finishEdit(e);\n    }\n  };\n  finishEdit = (e) => {\n    const value\
  \ = e.target.value;\n\n    if(this.props.onEdit) {\n      this.props.onEdit(value);\n\
  \n      // Exit edit mode.\n      this.setState({\n        editing: false\n    \
  \  });\n    }\n  };\n}\n```\n\n有几处重要的更改：\n\n*   ```{editing ? this.renderEdit()\
  \ : this.renderValue()}` - 这个三元运算符根据编辑状态选择渲染内容。之前我们用的是 `Note`。现在我们使用 `Value` 术语，因为它更通用。\n\
  \n*   `renderValue` - 以前这被称为 `renderNote()`。同样，这是一层抽象步骤。注意我们引用的是 `this.props.value`\
  \ 而不是 `this.props.task`。\n\n*   `renderDelete` - 现在不再使用 `delete-note` 类，而是使用了更通用的\
  \ `delete`。\n\n由于类名发生了变化，`main.css` 需要一些微调：\n\n**app/main.css**\n\n```\n...\n\n\
  .note .task {\n.note .value {\n  /* 强制使用 inline-block 以获得最小高度 */\n  display: inline-block;\n\
  }\n\n.note .delete-note {\n.note .delete {\n  ...\n}\n.note:hover .delete-note {\n\
  .note:hover .delete {\n  visibility: visible;\n}\n```\n\n#### 将 `Notes` 指向 `Editable`\n\
  \n接下来，我们需要让 `Notes.jsx` 指向新组件。我们需要修改 `render()` 中的导入语句和组件名称：\n\n**app/components/Notes.jsx**\n\
  \n```javascript\nimport React from 'react';\nimport Editable from './Editable.jsx';\n\
  \nexport default ({notes, onValueClick, onEdit, onDelete}) => {\n  return (\n  \
  \  <ul className=\"notes\">{notes.map(note =>\n      <li className=\"note\" key={note.id}>\n\
  \        <Editable\n          editing={note.editing}\n          value={note.task}\n\
  \          onValueClick={onValueClick.bind(null, note.id)}\n          onEdit={onEdit.bind(null,\
  \ note.id)}\n          onDelete={onDelete.bind(null, note.id)} />\n      </li>\n\
  \    )}</ul>\n  );\n}\n```\n\n如果你刷新浏览器，应该看到 `Uncaught TypeError: Cannot read property\
  \ 'bind' of undefined`。这与我们添加的 `onValueClick` 定义有关。我们接下来解决这个问题。\n\n#### 将 `Lane`\
  \ 与 `Editable` 连接\n\n接下来，我们可以使用这个通用组件来修改 `Lane` 的名称。这将为我们的逻辑提供一个钩子。我们需要如下如下修改 `<div\
  \ className='lane-name'>{name}</div>`：\n\n**app/components/Lane.jsx**\n\n```javascript\n\
  ...\nimport Editable from './Editable.jsx';\n\nexport default class Lane extends\
  \ React.Component {\n  render() {\n    const {value, onEdit, onValueClick, editing,\
  \ ...props} = this.props;\n\n    return (\n      <div {...props}>\n        {editing\
  \ ? this.renderEdit() : this.renderValue()}\n      </div>\n    );\n  }\n}\n```\n\
  \n\n\n\n```javascript...\nexport default Lane extends React.Component {\n  ...\n\
  \  editNote(id, task) {\n    // Don't modify if trying set an empty value\n    if(!task.trim())\
  \ {\n      return;\n    }\n\n    NoteActions.update({id, task});\n  }\n  editNote(id,\
  \ task) {\n    // Don't modify if trying set an empty value\n    if(!task.trim())\
  \ {\n      NoteActions.update({id, editing: false});\n\n      return;\n    }\n\n\
  \    NoteActions.update({id, task, editing: false});\n  }\n  ...\n  editName = (name)\
  \ => {\n    const laneId = this.props.lane.id;\n\n    console.log(`edit lane ${laneId}\
  \ name using ${name}`);\n  };\n  deleteLane = () => {\n    const laneId = this.props.lane.id;\n\
  \n    console.log(`delete lane ${laneId}`);\n  };\n  activateLaneEdit = () => {\n\
  \    const laneId = this.props.lane.id;\n\n    console.log(`activate lane ${laneId}\
  \ edit`);\n  };\n  activateNoteEdit(id) {\n    console.log(`activate note ${id}\
  \ edit`);\n  }\n  editName = (name) => {\n    const laneId = this.props.lane.id;\n\
  \n    // Don't modify if trying set an empty value\n    if(!name.trim()) {\n   \
  \   LaneActions.update({id: laneId, editing: false});\n\n      return;\n    }\n\n\
  \    LaneActions.update({id: laneId, name, editing: false});\n  };\n  deleteLane\
  \ = () => {\n    const laneId = this.props.lane.id;\n\n    LaneActions.delete(laneId);\n\
  \  };\n  activateLaneEdit = () => {\n    const laneId = this.props.lane.id;\n\n\
  \    LaneActions.update({id: laneId, editing: true});\n  };\n  activateNoteEdit(id)\
  \ {\n    NoteActions.update({id, editing: true});\n  }\n}\n```\n\n现在尝试修改泳道名称。现在的修改应该像保存卡片的方式被保存。删除泳道也应该是可能的。\n\
  \n![Editing a lane name](img/kanban_04.png)\n\n编辑泳道名称\n\n### 6.5 为看板设置样式\n\n当我们向应用中了\
  \ `Lanes`（泳道）时，样式变得有些混乱。添加以下样式让它看起来更好一些：\n\n**app/main.css**\n\n```css\nbody {\n\
  \  background: cornsilk;\n  font-family: sans-serif;\n}\n\n.lane {\n  display: inline-block;\n\
  \n  margin: 1em;\n\n  background-color: #efefef;\n  border: 1px solid #ccc;\n  border-radius:\
  \ 0.5em;\n\n  min-width: 10em;\n  vertical-align: top;\n}\n\n.lane-header {\n  overflow:\
  \ auto;\n\n  padding: 1em;\n\n  color: #efefef;\n  background-color: #333;\n\n \
  \ border-top-left-radius: 0.5em;\n  border-top-right-radius: 0.5em;\n}\n\n.lane-name\
  \ {\n  float: left;\n}\n\n.lane-add-note {\n  float: left;\n\n  margin-right: 0.5em;\n\
  }\n\n.lane-delete {\n  float: right;\n\n  margin-left: 0.5em;\n\n  visibility: hidden;\n\
  }\n.lane-header:hover .lane-delete {\n  visibility: visible;\n}\n\n.add-lane, .lane-add-note\
  \ button {\n  cursor: pointer;\n\n  background-color: #fdfdfd;\n  border: 1px solid\
  \ #ccc;\n}\n\n.lane-delete button {\n  padding: 0;\n\n  cursor: pointer;\n\n  color:\
  \ white;\n  background-color: rgba(0, 0, 0, 0);\n  border: 0;\n}\n...\n```\n\n你最终会得到这样的结果：\n\
  \n![Styled Kanban](img/kanban_05.png)\n\n设置样式的看板\n\n由于这是一个小项目，我们可以将 CSS 这样保留在单个文件中。如果它开始变大，考虑将其拆分为多个文件。一种方法是为每个组件提取\
  \ CSS，然后在那里引用它（例如在 `Lane.jsx` 中使用 `require('./lane.css')`）。\n\n除了保持整洁之外，Webpack\
  \ 的懒加载机制也可以识别这些。结果是用户需要加载的初始 CSS 将更小。我稍后会在讨论 *React 样式* 时进行更详细的说明。\n\n### 6.6 关于组件命名空间\n\
  \n到目前为止，我们都是每个文件定义一个组件。这并不是唯一的方法。将一个文件视为命名空间并从中暴露多个组件可能很有用。React 专门为此提供了[命名空间组件](https://facebook.github.io/react/docs/jsx-in-depth.html#namespaced-components)（namespaces\
  \ components）。在这种情况下，我们可以将命名空间应用于 `Lane` 或 `Note` 概念。这会为我们的系统增加一些灵活性，同时保持管理的简单性。通过使用命名空间，我们可以得到类似这样的：\n\
  \n**app/components/Lanes.jsx**\n\n```javascript\nimport React from 'react';\nimport\
  \ Lane from './Lane';\nimport Note from './Note';\n\nexport default function Lanes({lanes})\
  \ {\n  return (\n    <div className=\"lanes\">\n      {lanes.map(lane => (\n   \
  \     <Lane key={lane.id}>\n          <div className=\"lane-header\">\n        \
  \    <div className=\"lane-name\">{lane.name}</div>\n            <button className=\"\
  lane-add-note\">添加卡片</button>\n            <button className=\"lane-delete\">删除</button>\n\
  \          </div>\n          <Note id={lane.id} />\n        </Lane>\n      ))}\n\
  \    </div>\n  );\n}\n```\n\n### 6.7 总结\n\n目前，我们的设计存在一些局限性。我们仍然无法在泳道之间或泳道内部移动卡片。我们将在下一章通过实现拖放功能来解决这个问题。处理处理逻辑将会变得困难。\n\
  \n## 7 实现拖放\n\n我们的看板应用现在可以使用了。它看起来还可以，并且有一些功能。在本章中，我将向你展示如何更上一层楼。我们将通过设置拖放功能来实现。\n\
  \n### 7.1 设置 React DnD\n\n第一步，我们需要将 React DnD 连接到我们的项目。。我们将使用基于 HTML5 的拖放后端。对于测试和[触摸](https://github.com/yahoo/react-dnd-touch-backend)，有特定的后端。为了设置它，我们需要使用\
  \ `DragDropContext` 装饰器并为它提供后端：\n\n**app/components/App.jsx**\n\n```javascript\n\
  import {DragDropContext} from 'react-dnd';\nimport HTML5Backend from 'react-dnd-html5-backend';\n\
  \n@DragDropContext(HTML5Backend)\nexport default class App extends React.Component\
  \ {\n  ...\n}\n```\n\n更改后，应用程序应该和之前完全一样。我们现在准备好为其添加一些功能了。\n\n### 7.2 准备需要排序的卡片\n\
  \n接下来，我们需要告诉 React DnD 哪些可以拖动以及在哪里。由于我们需要移动卡片，我们需要对它们进行标注。此外，我们需要一些逻辑来告诉我们发生了什么。\n\
  \n早些时候我们从 `Note` 中提取了编辑功能，结果丢掉了 `Note`。似乎我们需要把这个概念加回来以便实现拖放。\n\n\n\n\n\n在这里我们可以使用一个实用的小技巧，让我们避免代码重复。我们可以将\
  \ `Note` 实现为一个包装组件。它会接受 `Editable` 并渲染它。这将允许我们将与 DnD 相关的逻辑保留在 `Note` 中。这避免了重复任何与\
  \ `Editable` 相关的逻辑。\n\n这里的魔法在于 React 的一个名为 `children` 的属性。React 会在 `{this.props.children}`\
  \ 槽中渲染可能的子组件。如下所示设置 `Note.jsx`：\n\n**app/components/Note.jsx**\n\n```\nimport React\
  \ from 'react';\n\nexport default class Note extends React.Component {\n  render()\
  \ {\n    return <li {...this.props}>{this.props.children}</li>;\n  }\n}\n```\n\n\
  我们还需要调整 `Notes` 以使用我们的包装组件。我们只需使用 `Note` 包装 `Editable` 即可完成工作。我们将 `note` 数据传递给包装组件，因为我们稍后在处理逻辑时需要它：\n\
  \n**app/components/Notes.jsx**\n\n```javascript\nimport React from 'react';\nimport\
  \ Editable from './Editable.jsx';\nimport Note from './Note.jsx';\n\nexport default\
  \ ({notes, onValueClick, onEdit, onDelete}) => {\n  return (\n    <ul className=\"\
  notes\">{notes.map(note =>\n      <li className=\"note\" key={note.id}>\n      \
  \  <Editable\n          editing={note.editing}\n          value={note.task}\n  \
  \        onValueClick={onValueClick.bind(null, note.id)}\n          onEdit={onEdit.bind(null,\
  \ note.id)}\n          onDelete={onDelete.bind(null, note.id)} />\n      </li>\n\
  \      <Note className=\"note\" id={note.id} key={note.id}>\n        <Editable\n\
  \          editing={note.editing}\n          value={note.task}\n          onValueClick={onValueClick.bind(null,\
  \ note.id)}\n          onEdit={onEdit.bind(null, note.id)}\n          onDelete={onDelete.bind(null,\
  \ note.id)} />\n      </Note>\n    )}</ul>\n  );\n}\n```\n\n在此更改之后，应用程序看起来应该和之前完全一样。我们我们还没有实现任何功能。幸运的是，既然我们已经打好了基础，现在可以添加功能了。\n\
  \n### 7.3 允许 Note 被拖拽\n\nReact DnD 使用常量来区分不同的可拖拽项。按照如下设置一个文件来跟踪 `Note`：\n\n**app/constants/itemTypes.js**\n\
  \n```javascript\nexport default {\n  NOTE: 'note'\n};\n```\n\n当我们以后向系统添加新类型时，可以扩展此定义。\n\
  \n接下来，我们需要告诉 `Note` 它是可以被拖放的。这是通过 `@DragSource` 和 `@DropTarget` 注解实现的。\n\n#### 设置\
  \ `Note` 的 `@DragSource`\n\n将组件标记为 `@DragSource` 仅仅意味着它可以被拖拽。按如下所示设置注解：\n\n**app/components/Note.jsx**\n\
  \n```javascript\nimport React from 'react';\nimport {DragSource} from 'react-dnd';\n\
  import ItemTypes from '../constants/itemTypes';\n\nconst noteSource = {\n  beginDrag(props)\
  \ {\n    console.log('begin dragging note', props);\n\n    return {};\n  }\n};\n\
  \nexport default class Note extends React.Component {\n  render() {\n    return\
  \ <li {...this.props}>{this.props.children}</li>;\n  }\n}\n@DragSource(ItemTypes.NOTE,\
  \ noteSource, (connect) => ({\n  connectDragSource: connect.dragSource()\n}))\n\
  export default class Note extends React.Component {\n  render() {\n    const {connectDragSource,\
  \ id, onMove, ...props} = this.props;\n\n    return connectDragSource(\n      <li\
  \ {...props}>{props.children}</li>\n    );\n  }\n}\n```\n\n有几个重要的变化：\n\n*   我们为新逻辑设置了导入。\n\
  *   我们定义了一个 `noteSource`。它包含一个 `beginDrag` 处理器。我们可以在这里设置拖拽的初始状态。目前我们只是在那里写了一个调试日志。\n\
  *   `@DragSource` 将 `NOTE` 类型与 `noteSource` 连接起来。\n*   `id` 和 `onMove` 属性从 `this.props`\
  \ 中提取。我们稍后将使用它们来设置回调函数，以便 `Note` 的父组件可以处理移动相关的逻辑。\n*   最后，`connectDragSource` 属性包裹了\
  \ `render()` 方法中的元素。它可以应用于元素的特定部分。这对于实现手柄（handles）等功能非常方便。\n\n如果你现在拖拽一个 `Note`，你应该会在控制台中看到一条调试消息。\n\
  \n我们仍然需要确保 `Note` 作为 `@DropTarget` 工作正常。稍后在我们添加逻辑后，这将允许它们进行交换。\n\n#### 设置 `Note`\
  \ 的 `@DropTarget`\n\n`@DropTarget` 允许组件接收标记了 `@DragSource` 的组件。当 `@DropTarget` 触发时，我们可以根据组件执行实际逻辑。按如下扩展：\n\
  \n**app/components/Note.jsx**\n\n```javascript\nimport React from 'react';\nimport\
  \ {DragSource} from 'react-dnd';\nimport {DragSource, DropTarget} from 'react-dnd';\n\
  import ItemTypes from '../constants/itemTypes';\n\nconst noteSource = {\n  beginDrag(props)\
  \ {\n    console.log('begin dragging note', props);\n\n    return {};\n  }\n};\n\
  \n@DragSource(ItemTypes.NOTE, noteSource, (connect) => ({\n  connectDragSource:\
  \ connect.dragSource()\n}))\n@DropTarget(ItemTypes.NOTE, noteTarget, (connect) =>\
  \ ({\n  connectDropTarget: connect.dropTarget()\n}))\nexport default class Note\
  \ extends React.Component {\n  render() {\n    const {connectDragSource, connectDropTarget,\
  \ id, onMove, ...props} = this.props;\n\n    return connectDragSource(\n      connectDropTarget(\n\
  \        <li {...props}>{props.children}</li>\n      )\n    );\n  }\n}\n```\n\n\
  ### 7.4 开发 `onMove`\n\n### 7.5 为移动添加 Action 和 Store 方法\n\n\n\n\n拖放的逻辑如下。假设我们有一个包含笔记\
  \ `A`、`B`、`C` 的泳道（lane）。如果我们把 `A` 移动到 `C` 之下，结果应该是 `B`、`C`、`A`。如果我们有另一个列表，比如 `D`、`E`、`F`，并将\
  \ `A` 移动到它的开头，结果应该是 `B`、`C` 和 `A`、`D`、`E`、`F`。\n\n在我们的案例中，跨泳道的拖会导致引入一些额外的复杂性。当我们移动一个\
  \ `Note` 时，我们知道它的原始位置和预期的目标位置。`Lane` 通过 `id` 知道哪些 `Notes` 属于它。我们需要某种方法来告诉 `LaneStore`\
  \ 应该对给定的笔记执行该逻辑。一个良好的起点是定义 `LaneActions.move`：\n\n#### app/actions/LaneActions.js\n\
  \n```javascript\nimport alt from '../libs/alt';\n\nexport default alt.generateActions(\n\
  \  'create', 'update', 'delete',\n  'attachToLane', 'detachFromLane',\n  'move'\n\
  );\n```\n\n我们应该将此 action 与我们刚刚定义的 `onMove` 钩子连接：\n\n#### app/components/Notes.jsx\n\
  \n```jsx\nimport React from 'react';\nimport Editable from './Editable.jsx';\nimport\
  \ Note from './Note.jsx';\nimport LaneActions from '../actions/LaneActions';\n\n\
  export default ({notes, onValueClick, onEdit, onDelete}) => {\n  return (\n    <ul\
  \ className=\"notes\">{notes.map(note => {\n      return (\n        <Note className=\"\
  note\" id={note.id} key={note.id}\n          onMove={({sourceId, targetId}) =>\n\
  \            console.log(`source: ${sourceId}, target: ${targetId}`)\n        }>\n\
  \        <Note className=\"note\" id={note.id} key={note.id}\n          onMove={LaneActions.move}>\n\
  \          <Editable\n            editing={note.editing}\n            value={note.task}\n\
  \            onValueClick={onValueClick.bind(null, note.id)}\n            onEdit={onEdit.bind(null,\
  \ note.id)}\n            onDelete={onDelete.bind(null, note.id)} />\n        </Note>\n\
  \      );\n    })}\n    </ul>\n  );\n}\n```\n\n我们应该在 `LaneStore` 中定义一个存根（stub），以检查是否正确连接了它：\n\
  \n#### app/stores/LaneStore.js\n\n```javascript\n...\n\nclass LaneStore {\n  ...\n\
  \  detachFromLane({laneId, noteId}) {\n    ...\n  }\n  move({sourceId, targetId})\
  \ {\n    console.log(`source: ${sourceId}, target: ${targetId}`);\n  }\n}\n\nexport\
  \ default alt.createStore(LaneStore, 'LaneStore');\n```\n\n你应该能看到之前相同的日志消息。接下来，我们需要添加一些逻辑来实现它。我们可以在这里使用上述概述的逻辑。我们需要担心两种情况：在泳道内部移动以及从一个泳道移动到另一个泳道。\n\
