  \n\n\n\n如果你现在刷新浏览器并将笔记拖到一条通道（lane），你应该会在控制台中看到日志消息。问题是该如何处理这些数据呢？在实际将笔记移动到通道之前，我们应该检查它是否为空。如果它已经包含内容，该操作就没有意义。我们现有的逻辑可以处理这种情况。\n\
  \n这是一个简单的检查。鉴于我们在 `noteTarget` `hover` 处理器中知道了目标通道，我们可以按照如下方式检查它的 `notes` 数组：\n\n\
  `app/components/Lane.jsx`\n\n```\n...\n\nconst noteTarget = {\n  hover(targetProps,\
  \ monitor) {\n    const targetId = targetProps.lane.id;\n    const sourceProps =\
  \ monitor.getItem();\n    const sourceId = sourceProps.id;\n\n    console.log(`source:\
  \ ${sourceId}, target: ${targetId}`);\n  }\n  hover(targetProps, monitor) {\n  \
  \  const sourceProps = monitor.getItem();\n    const sourceId = sourceProps.id;\n\
  \n    if(!targetProps.lane.notes.length) {\n      console.log('source', sourceId,\
  \ 'target', targetProps);\n    }\n  }\n};\n\n...\n```\n\n现在，如果你再次刷新浏览器并进行拖动，只有当你将笔记拖到一个尚未附加任何笔记的通道时，日志消息才会出现。\n\
  \n#### 触发 `move` 逻辑\n\n现在我们知道要把哪个 `Note` 移动到哪个 `Lane` 了。`LaneStore.attachToLane`\
  \ 是此目的的理想选择。按如下调整 `Lane`：\n\n`app/components/Lane.jsx`\n\n```\n...\n\nconst noteTarget\
  \ = {\n  hover(targetProps, monitor) {\n    const sourceProps = monitor.getItem();\n\
  \    const sourceId = sourceProps.id;\n\n    if(!targetProps.lane.notes.length)\
  \ {\n      console.log('source', sourceId, 'target', targetProps);\n    }\n  }\n\
  \  hover(targetProps, monitor) {\n    const sourceProps = monitor.getItem();\n \
  \   const sourceId = sourceProps.id;\n\n    if(!targetProps.lane.notes.length) {\n\
  \      LaneActions.attachToLane({\n        laneId: targetProps.lane.id,\n      \
  \  noteId: sourceId\n      });\n    }\n  }\n};\n\n...\n```\n\n不过，有一个问题。旧的 `Note`\
  \ 实例会发生什么？在当前的解决方案中，旧通道将有一个指向它的 id。结果是，系统中会出现重复数据。\n\n早些时候我们使用 `detachFromLane`\
  \ 解决了这个问题。问题是，我们不知道笔记属于哪条通道。我们可以通过组件层级传递这些数据，但这种感觉并不好。\n\n我们可以通过在 `attachToLane`\
  \ 中添加一个检查来解决这个问题：\n\n`app/stores/LaneStore.js`\n\n```\n...\n\nclass LaneStore {\n\
  \  ...\n  attachToLane({laneId, noteId}) {\n    const lanes = this.lanes.map(lane\
  \ => {\n      if(lane.notes.includes(noteId)) {\n        lane.notes = lane.notes.filter(note\
  \ => note !== noteId);\n      }\n\n      if(lane.id === laneId) {\n        if(lane.notes.includes(noteId))\
  \ {\n          console.warn('Already attached note to lane', lanes);\n        }\n\
  \        else {\n          lane.notes.push(noteId);\n        }\n      }\n\n    \
  \  return lane;\n    });\n\n    this.setState({lanes});\n  }\n  ...\n}\n```\n\n\
  `removeNote(noteId)` 会遍历 `LaneStore` 数据。如果它通过 id 找到笔记，就会将其移除。之后，我们就有了一个干净的起点，可以将笔记添加到通道中。此更改允许我们完全从系统中移除\
  \ `detachFromLane`，但我将交由你决定。\n\n在进行这些更改后，你应该能够将笔记拖动到空通道中。\n\n#### 修复拖拽过程中的编辑行为\n\
  \n目前的实现有一个小故障。如果你正在编辑笔记，你仍然可以在编辑时将其拖动它。这并不理想，因为覆盖了大多数人习惯的默认行为。例如，你将无法通过双击输入框来选择所有文本。\n\
  \n幸运的是，这很容易修复。我们需要使用每个 `Note` 的 `editing` 状态来调整它的行为。首先，我们需要将 `editing` 状态传递给单个 `Note`：\n\
  \n`app/components/Notes.jsx`\n\n```\n...\n\nexport default ({notes, onValueClick,\
  \ onEdit, onDelete}) => {\n  return (\n    <ul className=\"notes\">{notes.map(note\
  \ =>\n      <Note className=\"note\" id={note.id} key={note.id}\n        onMove={LaneActions.move}>\n\
  \      <Note className=\"note\" id={note.id} key={note.id}\n        editing={note.editing}\
  \ onMove={LaneActions.move}>\n        <Editable\n          editing={note.editing}\n\
  \          value={note.task}\n          onValueClick={onValueClick.bind(null, note.id)}\n\
  \          onEdit={onEdit.bind(null, note.id)}\n          onDelete={onDelete.bind(null,\
  \ note.id)} />\n      </Note>\n    )}</ul>\n  );\n}\n```\n\n接下来，我们需要在渲染时考虑到这一点：\n\
  \n`app/components/Note.jsx`\n\n```\n...\n\n@DragSource(ItemTypes.NOTE, noteTarget,\
  \ (connect) => ({\n  dragSource: connect.dragSource()\n}))\n@DropTarget(ItemTypes.NOTE,\
  \ noteTarget, (connect) => ({\n  dropTarget: connect.dropTarget()\n}))\nexport default\
  \ class Note extends React.Component {\n  render() {\n    const {editing, onMove,\
  \ children} = this.props;\n    const {dragSource, dropTarget} = this.state;\n  \
  \  const isDragging = this.props.monitor.isDragging();\n\n    return dragSource(dropTarget(\n\
  \      <li style={{\n        opacity: isDragging ? 0 : 1\n      }}>{children}</li>\n\
  \    ));\n  }\n}\n```\n\n这个小小的更改给了我们想要的行为。如果你现在尝试编辑笔记，输入框应该像你预期的那样工作。从设计角度上说，将 `editing`\
  \ 状态保持在 `Editable` 之外是一个好主意。\n\n\n\n\n\n1.12 MB 是一个非常大的数字！我们可以做一些基础操作来精简我们的构建（build）。我们可以对它进行一些混淆（minification）。我们还可以告诉\
  \ React 让它进行优化。两者兼顾将带来显著的体积节省。如果我们在提供内容时对其应用 gzip 压缩，可能会获得进一步的收益。\n\n### 混淆 (Minification)\n\
  \n混淆会将我们的代码转换为更小的格式而不丢失任何含义。通常这意味着通过预定义的转换对代码进行某种程度的重写。有时这可能会破坏代码，因为它可能会重写你无意中依赖的代码片段。这就是为什么我们为存储（stores）提供了显式的\
  \ ID 的原因。\n\n启用混淆最简单的方法是调用 `webpack -p`（`-p` 代表 `production`）。或者，我们可以直接使用插件，因为这能为我们提供更多控制。默认情况下，Uglify\
  \ 会输出大量警告，而在这种情况下它们没有价值，我们将禁用它们。在你的 Webpack 配置中添加以下部分：\n\n**webpack.config.js**\n\
  \n```\nif(TARGET === 'build') {\n  module.exports = merge(common, {});\n  module.exports\
  \ = merge(common, {\n    plugins: [\n      new webpack.optimize.UglifyJsPlugin({\n\
  \        compress: {\n          warnings: false\n        }\n      })\n    ]\n  });\n\
  }\n```\n\n如果你现在执行 `npm run build`，你应该能看到更好的结果：\n\n```\n> webpack\n\nHash: ff80bbb1bdd7df271313\n\
  Version: webpack 1.12.13\nTime: 9159ms\n    Asset    Size  Chunks             Chunk\
  \ Names\nbundle.js  368 kB       0  [emitted]  app\n    + 337 hidden modules\n```\n\
  \n由于它需要执行更多工作，所以时间更长。但好的一面是，现在的构建体积小了很多。\n\n#### 设置 `process.env.NODE_ENV`\n\n我们可以再采取一步来进一步减小构建体积。React\
  \ 依赖于基于 `process.env.NODE_ENV` 的优化。如果我们强制将其设置为 `production`，React 将以优化的方式进行构建。这将禁用一些检查（例如，属性类型检查）。最重要的是，它将给你提供更小的构建体积并提高性能。\n\
  \n在 Webpack 术语中，你可以将以下代码段添加到配置的 `plugins` 部分：\n\n**webpack.config.js**\n\n```\n\
  ...\n\nif(TARGET === 'build') {\n  module.exports = merge(common, {\n    plugins:\
  \ [\n      // 设置 DefinePlugin 会影响 React 库的体积！\n      // DefinePlugin 原样替换内容，因此我们需要额外的引号\n\
  \      // 以让生成的代码具有意义\n      new webpack.DefinePlugin({\n        'process.env.NODE_ENV':\
  \ '\"production\"'\n\n        // 对于你的开发目标，可以将其设置为 JSON.stringify('development')\n\
  \        // 以强制 NODE_ENV 为开发模式\n        // 无论如何\n      }),\n      ...\n    ]\n \
  \ });\n}\n```\n\n这对于你自己的代码是一个非常有用的技术。如果你有一部分代码在处理后评估为 `false`，混淆器将将其完全从构建中移除。\n\n\
  再次执行 `npm run build`，你应该能看到改进的结果：\n\n```\n> webpack\n\nHash: cde2c1861fbd65f03c3b\n\
  Version: webpack 1.12.13\nTime: 9032ms\n    Asset    Size  Chunks             Chunk\
  \ Names\nbundle.js  307 kB       0  [emitted]  app\n    + 333 hidden modules\n```\n\
  \n所以我们从 1.12 MB 减到了 368 kB，最后减到了 307 kB。最终构建比之前的快一点点。由于这 307 kB 可以以 gzipped 格式提供，它是非常合理的。gzip\
  \ 将再次减少约 40%。浏览器对此支持良好。\n\n不过，我们可以做得更好。我们可以拆分 `app` 和 `vendor` 包，并向它们的文件名添加哈希值。\n\
  \n## 8.2 分拆 `app` 和 `vendor` 包\n\n将应用程序拆分为两个独立的包的主要优势是它允许我们从客户端缓存中受益。例如，我们可能只对较小的\
  \ `app` 包进行大部分更改。在这种情况下，假设 `vendor` 包已经加载，客户端将只需要获取 `app` 包。\n\n由于存在额外的请求，这种方案在初次加载时速度可能不会比单包快。得益于客户端缓存，我们可能不需要为每次请求都重新加载所有数据。如果某个包保持不变，情况尤为如此。如果只有\
  \ `app` 更新，则可能只需要下载那一个。\n\n#### 定义 `vendor` 入口点\n\n在开发应用程序时，我们确保将 `dependencies`\
  \ 和 `devDependencies` 分离开。这种拆分现在将大显用场。它允许我们将 `dependencies` 推送到它自己的包中。非常重要的是，不要在该定义中包含任何与开发相关的部分（例如\
  \ Webpack），否则构建将不会按照你预期的方式工作。\n\n如果你检查 `package.json`，列出的 `dependencies` 应该如下：alt,\
  \ alt-container, alt-utils, node-uuid, react, react-addons-update, react-dnd, react-dnd-html5-backend\
  \ 和 react-dom。如果你那里有其他依赖项，请在继续之前将它们移动到 `devDependencies` 下。\n\n为了开始，我们需要定义一个 `vendor`\
  \ 入口点。以下是设置：\n\n```javascript\nconst path = require('path');\nconst merge = require('webpack-merge');\n\
  const webpack = require('webpack');\nconst NpmInstall = require('npm-install');\n\
  \nconst TARGET = process.env.NODE_ENV;\n\nconst PATHS = {\n  src: path.join(__dirname,\
  \ 'src'),\n  build: path.join(__dirname, 'dist')\n};\n\nconst common = {\n  entry:\
  \ {\n    app: PATHS.src + '/index.js'\n  },\n  output: {\n    path: PATHS.build,\n\
  \    filename: '[name].js'\n  },\n  resolve: {\n    extensions: ['.js', '.jsx']\n\
  \  }\n};\n\nconst dev = {\n  entry: {\n    vendor: Object.keys(require('./package.json').dependencies).filter(function(v)\
  \ {\n      return v !== 'alt-utils';\n    })\n  }\n};\n\nconst build = {\n  output:\
  \ {\n    filename: '[name].[chunkhash].js'\n  }\n};\n\nif (TARGET === 'build') {\n\
  \  module.exports = merge(common, dev, build);\n} else {\n  module.exports = merge(common,\
  \ dev);\n}\n```\n\n除此之外，还可以定义动态加载的块（chunks）。可以通过 [require.ensure](https://webpack.github.io/docs/code-splitting/)\
  \ 实现。\n\n如果你现在运行构建 `npm run build`，你应该能看到类似的内容：\n\n```\n> webpack\n\nHash: 192a0643b92456a6e0\n\
  Version: webpack 1.12.13\nTime: 14745ms\n    Asset    Size  Chunks             Chunk\
  \ Names\napp.js  307 kB       0  [emitted]  app\nvendor.js  286 kB       1  [emitted]\
  \  vendor\n   [0] multi vendor 112 bytes {1} [built]\n```\n\n现在我们有了独立的 *app* 和 *vendor*\
  \ 包。但有些问题。如果你检查文件，你会发现 *app.js* 包含了 *vendor* 依赖。我们需要做一些事情来告诉 Webpack 避免这种情况。这就是\
  \ `CommonsChunkPlugin` 发挥作用的地方。\n\n#### 设置 `CommonsChunkPlugin`\n\n`CommonsChunkPlugin`\
  \ 允许我们提取 `vendor` 包所需的代码。此外，我们将使用它来提取一个 *manifest*。这是一个告诉 Webpack 如何映射每个模块到每个文件的文件。在下一步设置长期缓存时，我们需要它。以下是设置：\n\
  \n```javascript\n...\n\nif(TARGET === 'build') {\n  module.exports = merge(common,\
  \ {\n    // 定义拆分所需的 vendor 入口\n    entry: {\n      ...\n    },\n    plugins: [\n\
  \      // 提取 vendor 和 manifest 文件\n      new webpack.optimize.CommonsChunkPlugin({\n\
  \        names: ['vendor', 'manifest']\n      }),\n      ...\n    ]\n  });\n}\n\
  ```\n\n[/content] 修正：结束应为\n\n\n\n```\n> webpack\n\nHash: 3a08642b633ebeafa62f\n\
  Version: webpack 1.12.13\nTime: 11044ms\n      Asset       Size  Chunks        \
  \     Chunk Names\n     app.js    21.3 kB    0, 2  [emitted]  app\n  vendor.js \
  \    286 kB    1, 2  [emitted]  vendor\nmanifest.js  743 bytes       2  [emitted]\
  \  manifest\n   [0] multi vendor 112 bytes {1} [built]\n    + 333 hidden modules\n\
  ```\n\n现在的情况好多了。注意看 `app` 包相对于 `vendor` 包有多小。为了真正从这种拆分中获益，我们应该设置缓存。这可以通过在文件名中添加缓存失效哈希（cache\
  \ busting hashes）来实现。\n\n#### 在文件名中添加哈希\n\nWebpack 提供了占位符，正如我们之前看到的，它们可以被用来访问不同类型的哈希和入口名称。最用的包括：\n\
  \n* `[name]` - 返回入口名称。\n* `[hash]` - 返回构建哈希。\n* `[chunkhash]` - 返回特定块（chunk）的哈希。\n\
  \n使用这些占位符，你可以得到如下所示文件名：\n\n```\napp.d587bbd6e38337f5accd.js\nvendor.dc746a5db4ed650296e1.js\n\
  ```\n\n如果文件内容发生变化，哈希也会随之改变，导致缓存失效；更准确地说，浏览器将为新文件发送新请求。这意味着如果只有 `app` 包更新了，则只需要重新请求该文件。\n\
  \n我们可以像这样在配置中使用占位符的想法：\n\n**webpack.config.js**\n\n```javascript\nif(TARGET ===\
  \ 'build') {\n  module.exports = merge(common, {\n    // 定义拆分所需的 vendor 入口点\n  \
  \  entry: {\n      ...\n    },\n    output: {\n      path: PATHS.build,\n      filename:\
  \ '[name].[chunkhash].js',\n      chunkFilename: '[chunkhash].js'\n    },\n    plugins:\
  \ [\n      ...\n    ]\n  });\n}\n```\n\n如果你现在执行 `npm run build`，你应该会看到如下输出。\n\n\
  ```\n> webpack\n\nHash: 7ddb226a34540aa401bc\nVersion: webpack 1.12.13\nTime: 8741ms\n\
  \                           Asset       Size  Chunks             Chunk Names\n \
  \    app.5b758fea66f30faf0f0e.js    21.3 kB    0, 2  [emitted]  app\n  vendor.db9a3343cf47e4b3d83c.js\
  \     286 kB    1, 2  [emitted]  vendor\nmanifest.19a8a5985bb61f546ce3.js  763 bytes\
  \       2  [emitted]  manifest\n   [0] multi vendor 112 bytes {1} [built]\n    +\
  \ 333 hidden modules\n```\n\n我们的文件现在有了整洁的哈希。为了证明它是有效的，你可以尝试修改 `app/index.jsx` 并在其中包含一个\
  \ `console.log`。构建完成后，只有与 `app` 和 `manifest` 相关的包应该发生变化。\n\n进一步改进构建的另一种方法是通过 CDN\
  \ 加载流行的依赖项（例如 React）。这将进一步减小 `vendor` 包的大小，同时为项目引入了外部依赖。其思路是，如果用户之前访问过 CDN，缓存就可以像这里一样发挥作用。\n\
  \n### 8.3 通过 `html-webpack-plugin` 生成 `index.html`\n\n尽管我们现在拥有了精细的包，但仍然存在一个问题。我们目前的\
  \ `index.html` 没有正确指向它们。我们可以手动编写需要的 script 标签，但幸运的是有更好的方法。一种方案是通过其 [Node.js API](https://webpack.github.io/docs/node.js-api.html)\
  \ 触发 Webpack。其 API 提供的构建输出包含了我们需要资源名称。之后，我们可以将它们应用到某些模板中。\n\n另一个很好的替代方案是使用专门为此目的设计的\
  \ Webpack 插件和模板。[html-webpack-plugin](https://www.npmjs.com/package/html-webpack-plugin)\
  \ 和 [html-webpack-template](https://www.npmjs.com/package/html-webpack-template)\
  \ 配合良好，可以为我们完成很多繁重工作。首先安装它们：\n\n```bash\nnpm i html-webpack-plugin html-webpack-template\
  \ --save-dev\n```\n\n为了将它与我们的项目连接起来，我们需要对配置进行微调。顺便删除 `build/index.html`，因为我们不再需要它了。系统会在此步骤之后为我们生成它：\n\
  \n**webpack.config.js**\n\n```javascript\n...\nconst HtmlWebpackPlugin = require('html-webpack-plugin');\n\
  \n...\n\nconst common = {\n  ...\n  module: {\n    ...\n  }\n  },\n  plugins: [\n\
  \    new HtmlWebpackPlugin({\n      template: 'node_modules/html-webpack-template/index.ejs',\n\
  \      title: 'Kanban app',\n      appMountId: 'app',\n      inject: false\n   \
  \ })\n  ]\n};\n\nif(TARGET === 'start') {\n  ...\n}\n```\n\n如果你现在执行 `npm run build`，你应该看到如下输出。\n\
  \n```\n> webpack\n\nHash: 7ddb226a34540aa401bc\nVersion: webpack 1.12.13\nTime:\
  \ 8741ms\n                           Asset       Size  Chunks             Chunk\
  \ Names\n     app.5b758fea66f30faf0f0e.js    21.3 kB    0, 2  [emitted]  app\n \
  \ vendor.db9a3343cf47e4b3d83c.js     286 kB    1, 2  [emitted]  vendor\nmanifest.19a8a5985bb61f546ce3.js\
  \  763 bytes       2  [emitted]  manifest\n   [0] multi vendor 112 bytes {1} [built]\n\
  \    + 333 hidden modules\n```\n\n尽管这为我们的项目增加了一些配置，但我们不需要担心把东西粘在一起。如果需要更多灵活性，可以实现自定义模板。\n\
  \n### 8.4 清理构建目录\n\n我们目前的设置在构建之间不会清理 `build` 目录。由于这可能会令人困扰，我们可以使用插件来为我们清理目录。安装插件并按如下所示更改构建配置：\n\
  \n```bash\nnpm i clean-webpack-plugin --save-dev\n```\n\n**webpack.config.js**\n\
  \n```javascript\n...\nconst CleanPlugin = require('clean-webpack-plugin');\n\n...\n\
  \nif(TARGET === 'build') {\n  module.exports = merge(common, {\n    ...\n    plugins:\
  \ [\n      new CleanPlugin([PATHS.build]),\n      ...\n    ]\n  });\n}\n```\n\n\
  更改后，我们的构建目录在构建时应该保持整洁。更多选项请参见 [clean-webpack-plugin](https://www.npmjs.com/package/clean-webpack-plugin)。\n\
  \n### 8.5 分离 CSS\n\n尽管现在有了良好的构建设置，但所有的 CSS 都去哪儿了？根据我们的配置，它们被内联到了 JavaScript 中！尽管这在开发期间可能很方便，但听起来并不理想。目前的解决方案不允许我们缓存\
  \ CSS。在某些情况下，我们可能会遇到无样式闪烁（FOUC）。\n\n幸运的是，Webpack 提供了一种生成独立 CSS 包的方法。我们可以使用 [ExtractTextPlugin](https://www.npmjs.com/package/extract-text-plugin)\
  \ 实现这一目标。它在编译阶段会带来开销，并且在设计上不支持热模块替换（HMR）。由于我们仅在生产环境中使用它，这并不会成为问题。\n\n这需要一些配置才能生效。接下来，我们需要删除\
  \ `common` 配置中当前的 CSS 相关的声明。之后，我们需要将其拆分到 `build` 和 `dev` 配置部分，如下所示：\n\n\n\n\n\n\
  ```\n...\nconst ExtractTextPlugin = require('extract-text-webpack-plugin');\n\n\
  ...\n\nconst common = {\n  entry: {\n    app: PATHS.app\n  },\n  resolve: {\n  \
  \  extensions: ['', '.js', '.jsx']\n  },\n  module: {\n    loaders: [\n      {\n\
  \        // Test 期望一个正则表达式！注意斜杠！\n        test: /\\.css$/,\n        loaders: ['style',\
  \ 'css'],\n        // Include 接受一个路径或一个路径数组。\n        include: PATHS.app\n     \
  \ },\n      {\n        test: /\\.jsx?$/,\n        loaders: ['babel?cacheDirectory'],\n\
  \        include: PATHS.app\n      }\n    ]\n  },\n  plugins: [\n    new HtmlWebpackPlugin({\n\
  \      template: 'node_modules/html-webpack-template/index.html',\n      title:\
  \ 'Kanban app',\n      appMountId: 'app',\n      inject: false\n    })\n  ]\n};\n\
  \nif(TARGET === 'start' || !TARGET) {\n  module.exports = merge(common, {\n    devtool:\
  \ 'eval-source-map',\n    devServer: {\n      ...\n    },\n    module: {\n     \
  \ loaders: [\n        // 定义开发环境特定的 CSS 配置\n        {\n          test: /\\.css$/,\n\
  \          loaders: ['style', 'css'],\n          include: PATHS.app\n        }\n\
  \      ]\n    },\n    plugins: [\n      ...\n    ]\n  });\n}\n\nif(TARGET === 'build')\
  \ {\n  module.exports = merge(common, {\n    ...\n    output: {\n      ...\n   \
  \ },\n    module: {\n      loaders: [\n        // 在构建期间提取 CSS\n        {\n     \
  \     test: /\\.css$/,\n          loader: ExtractTextPlugin.extract('style', 'css'),\n\
  \          include: PATHS.app\n        }\n      ]\n    },\n    plugins: [\n    \
  \  new CleanPlugin([PATHS.build], {\n        verbose: false // 不要向控制台写入日志\n    \
  \  }),\n      // 将提取的 CSS 输出到文件\n      new ExtractTextPlugin('[name].[chunkhash].css'),\n\
  \      ...\n    ]\n  });\n}\n```\n\n使用这种配置，我们仍然可以在开发过程中受益于 HMR（热模块替换）。对于生产环境构建，我们会生成一个独立的\
  \ CSS 文件。`html-webpack-plugin` 会自动获取并将其注入到 `index.html` 中。\n\n运行 `npm run build`\
  \ 后，你应该看到类似下面的输出：\n\n```\n> webpack\n\nclean-webpack-plugin: .../kanban_app/build\
  \ has been removed.\nHash: 32b800b64e76fbd5d447\nVersion: webpack 1.12.13\nTime:\
  \ 9125ms\n                           Asset       Size  Chunks             Chunk\
  \ Names\n     app.341186f43191211bee0c.js    16.5 kB    0, 2  [emitted]  app\n \
  \ vendor.db9a3343cf47e4b3d83c.js     286 kB    1, 2  [emitted]  vendor\nmanifest.c3a4ec998b7ccca9268f.js\
  \  763 bytes       2  [emitted]  manifest\n    app.341186f43191211bee0c.css    1.16\
  \ kB    0, 2  [emitted]  app\n                      index.html  713 bytes      \
  \    [emitted]\n   [0] multi vendor 112 bytes {1} [built]\n    + 333 hidden modules\n\
  Child html-webpack-plugin for \"index.html\":\n        + 3 hidden modules\nChild\
  \ extract-text-webpack-plugin:\n        + 2 hidden modules\n```\n\n现在我们的样式已被推送到一个独立的\
  \ CSS 文件中。结果是，我们的 JavaScript 包变小了。我们还避免了 FOUC（无样式闪烁）问题。浏览器不需要等待 JavaScript 加载即可获取样式信息。相反，它可以单独处理\
  \ CSS，避免无样式内容闪（FOUC）。\n\n### 改进缓存行为\n\n当前方法有一个轻微的问题。生成的 `app.js` 和 `app.css` 属于同一个块（chunk）。这意味着如果与\
  \ JavaScript 或 CSS 相关的内容发生变化，哈希值也会随之改变。这并不理想，因为即使我们不想这样做，它也会导致我们的缓存失效。\n\n解决此问题的方法是将样式推送到它自己的块中。这打破了依赖关系并修复了缓存。为了实现这一点，我们需要将样式从当前的块中解耦，并通过配置为它定义一个自定义的块：\n\
  \n**app/index.jsx**\n\n```\nimport './main.css';\n\n...\n```\n\n**webpack.config.js**\n\
  \n```\n...\n\nconst PATHS = {\n  app: path.join(__dirname, 'app'),\n  build: path.join(__dirname,\
  \ 'build'),\n  style: path.join(__dirname, 'app/main.css')\n};\n\n...\n\nconst common\
  \ = {\n  entry: {\n    app: PATHS.app,\n    style: PATHS.style\n  },\n  ...\n}\n\
  \n...\n```\n\n如果你现在通过 `npm run build` 构建项目，你应该能看到类似这样的的内容：\n\n\n\n\n\n如果你想进一步开发该项目，重新考虑项目结构可能是一个好主意。我在*React\
  \ 项目结构*附录中讨论过这个话题。阅读*编写包*章节可以为你提供更多关于如何改进项目 npm 设置的思路，非常有帮助。\n\n# III. 进阶技术\n\n\
  有很多高级的 Webpack 和 React 技巧值得关注。代码检查（Linting）可以提高你的代码质量，因为它允许你更早地发现潜在问题。我们还将讨论各种使用\
  \ Webpack 打包应用程序的方法。\n\n除了消费库之外，创建库也件很有趣的事。因此，我将讨论一些与编写相关的常见问题，并展示如何以最少的精力发布库。有很多你应该注意的微小技巧，它们会让你作为库作者的生活变得更轻松。\n\
  \nReact 的样式样式化本身就是一个复杂的话题。实现它有多种方法，在 React 的语境下，对于正确的方法还没有明确的共识。我将为你提供关于当前状况的良好思路。\n\
  \n## 9. 测试 React\n\n测试让我们能够确保一切运行都符合我们的预期。在我们修改代码时，它提供了安全保障。即使是一个微小的改变也可能破坏关键部分，如果没有测试，我们可能在部署到生产环境之前才发现错误。虽然仍然可能出问题，但测试允许我们在开发周期的早期捕捉错误。你可以将它们视为安全网。\n\
  \n### 9.1 测试分级\n\n![测试金字塔](img/testing_pyramid.png)\n\n测试金字塔\n\n测试分级可以使用 Mike Cohn\
  \ 流行的“测试金字塔”概念来描述。他将测试分为三个级别：单元、服务和用户界面。他认为你应该尽可能进行单元测试，其次是服务级（集成测试），而在最上方应该是用户界面层级的测试。\n\
  \n这些层级中的每一个都为我们提供了关于系统行为方式的信息。它们让我们确信代码的运行正如我们想象的那样。在高级别，我们可以断言应用程序遵循其规范。在低级别，我们可以断言某个特定函数按照我们预期的方式运行。\n\
  \n在研究新系统时，测试可以以探索的方式进行。同样的思路对于调试也有用。我们将进行一系列断言来帮助我们隔离并修复问题。\n\n我们有各种技术可以覆盖整个测试金字塔。这并不是一份详尽的列表，更多的是让你了解目前有哪些技术。我们将在在本章的后半部分对项目使用其中的几种技术。\n\
  \n#### 单元测试\n\n*单元测试*完全关于孤立地测试一段代码——一个单元。例如，我们可以对单个函数进行单元测试，以断言它的行为方式。不过，单元的定义可以比这更大。在某个时刻，我们将进入*集成测试*的领域。通过这种方式，我们想要断言系统的部分能够按照应该的方式协同工作。\n\
  \n#### TDD 和 BDD\n\n有时，先开发测试或与代码同步开发是很有方便的。这种*测试驱动开发*（TDD）是行业中一种非常流行的技术。在更高级别上，你可以使用*行为驱动开发*（BDD）。\n\
  \n有时，我会使用*README 驱动开发*（README Driven Development），并先编写项目的 README 来指导组件开发。这迫使我从用户的角度考虑组件，并可以帮助我通过更少的迭代获得更好的\
  \ API。\n\nBDD 侧于在业务层面描述规范，而不需要大量的技术知识。它们为非技术人员提供了一种用流畅语法描述应用程序行为的方法。然后，程序员可以根据这些功能规范执行更低层次的测试。\n\
  \nTDD 是一种可以描述为三个简单步骤的技术：\n\n1. 编写一个失败的测试。\n2. 创建最小的实现。\n3. 重复。\n\n一旦你进展得足够远，就可以*重构*你的代码。\n\
  \n一旦你走得足够远就可以就可以构构代码。。测试测试测试测试，，测试测试测试测试测试测试测试测试测试测试非常有用。\n\n#### 覆盖测试\n\n我们可以使用各种技术来覆盖测试金字塔。这绝不是一份详尽的列表。更多的是让你大致了解有哪些技术。我们将在在本章的后半部分对项目使用其中的几种技术。\n\
  \n#### 单元测试\n\n*测试测试**测试测试。。。。。。。。。。，，，，，，，，，，言言言断言。\n\n#### 测试测试\n\n测试测试测试测试测试测试。。。。。。。。。。。。。。。测试测试测试测试测试测试测试测试测试测试测试。。这可以帮助我们发现可能的问题。\n\
  \n#### 属性测试\n\n除了这些，还有一些更专业的技术。例如，*属性测试*允许我们检查不变性是否成立。例如，我们可能会得到如下测试：\n\n```\nsort([-123242342,\
  \ 231, -0.43429, 1.797693134862157e30])\nsort([1.72e+32])\nsort([0, 0, 0])\nsort([])\n\
  sort([1])\n```\n\n我们可以编写任意多的测试。我们可以以伪随机的方式生成它们。这意味着我们可以重现相同的测试。这允许我们发现可能的错误。\n\n\
  这种方法最大的优势是它允许我们测试可能无法获得的值和范围。计算机擅长生成测试。问题在于确定良好的测试不变性。\n\n#### 变异测试\n\n*变异测试*允许你测试你的测试。变异测试框架以各种方式修改你的源代码并观察你的测试如何表现。它可能会揭示你可以根据测试和覆盖率删除或简化的代码部分。这不是一种特别流行的技术，但了解它是好的。\n\
  \n### 9.2 配置 Webpack\n\n使用 Webpack 测试有多种方法。我将讨论一种基于 [Karma](https://karma-runner.github.io)\
  \ 和 [Mocha](https://mochajs.org/) 的方法。这种方法是根据 Cesar Andreu 的 `web-app` 适配的，因为它运行良好。\n\
  \n#### 测试运行器\n\nKarma 是一个测试运行器。它允许你在浏览器中执行测试。在这种情况下，我们将使用 [PhantomJS](http://phantomjs.org/)，这是一个流行的基于\
  \ Webkit 的无头浏览器。Karma 为我们完成了大部分工作。可以根据你的偏好配置它以与各种测试工具配合。\n\n[Testem](https://github.com/airportyh/testem)\
  \ 是 Karma 的有效替代方案。\n\n#### 单元测试\n\nMocha 用于结构化测试。它遵循简单的 `describe`, `it` 格式。它没有任何方式指定断言。我们将使用\
  \ Node.js [assert](https://nodejs.org/api/assert.html)，因为这对于我们的目的已经足够。替代方案（如 [Chai](http://chaijs.com/)）提供了更强大、更有表现力的语法。\n\
  \n\n\n\nFacebook 的 [Jest](https://facebook.github.io/jest/) 是 Mocha 的流行替代方案。它基于另一个流行工具\
  \ [Jasmine](https://jasmine.github.io/)，且配置比 Mocha 更简单。遗憾的是，它存在一些与 Node.js 版本相关的问题，并且有某些功能（主要是默认的自动\
  \ mock）可能有些违背直觉。尽管如此，它是一个有效的替代方案。\n\n## 代码覆盖率\n\n为了更好地了解测试的 `code coverage`（代码覆盖率），我们将使用\
  \ [Istanbul](https://gotwarlost.github.io/istanbul/)。它将为我们提供一份供研究的 HTML 报告。这将帮助我们理解代码的哪些部分可以使用测试。然而，它并没有告诉我们关于测试质量的任何信息。它只是告诉我们测试覆盖了代码的某些分支。\n\
  \n## 安装依赖\n\n我们的测试设置将需要许多新依赖。执行以下命令来安装它们：\n\n```\nnpm i react-addons-test-utils\
  \ isparta-instrumenter-loader karma karma-coverage karma\\\narma-mocha karma-phantomjs-launcher\
  \ karma-sourcemap-loader karma-spec-reporter k\\\narma-webpack mocha phantomjs-prebuilt\
  \ phantomjs-polyfill --save-dev\n```\n\n除了这些依赖，我们还需要做一些配置工作。\n\n## 设置 `package.json`\
  \ 中的 `scripts`\n\n和通常一样，我们将通过 `package.json` 的 `scripts` 来封装工具。我们将编写一个用于运行一次测试，另一个用于持续运行测试。设置如下：\n\
  \n**package.json**\n\n```\n{\n  ...\n  \"scripts\": {\n    \"stats\": \"webpack\
  \ --profile --json > stats.json\",\n    \"build\": \"webpack\",\n    \"start\":\
  \ \"webpack-dev-server\",\n    \"test\": \"karma start\",\n    \"tdd\": \"karma\
  \ start --auto-watch --no-single-run\"\n  },\n  ...\n}\n```\n\n`npm run test` 或直接运行\
  \ `npm test` 将简单执行我们的测试。`npm run tdd` 将在我们开发项目时持续运行测试。这是你在开发过程中会经常依赖的。\n\n## 测试文件布局\n\
  \n为了保持简单，我们将使用单独的目录存放测试。以下是我们将最终形成的结构示例：\n\n- `/tests`\n    - `demo_test.js`\n \
  \   - `editable_test.jsx`\n    - `note_store_test.js`\n    - `note_test.jsx`\n\n\
  对此有多种可用的约定。另一种替代方案是将测试推送到组件级。例如，你可以为每个组件准备一个目录。该目录将包含组件、相关样式和测试。测试目录和测试文件可以命名为 `specs`。在这种情况下，你将拥有\
  \ `/specs` 和 `demo_spec.js` 等。\n\n## 配置 Karma\n\n我们仍然缺少几个关键部分来让这个设置工作。我们需要同时配置 Karma\
  \ 和 Webpack。我们可以先设置 Karma：\n\n**karma.conf.js**\n\n```\n// Reference: http://karma-runner.github.io/0.13/config/configuration-file.html\n\
  module.exports = function karmaConfig (config) {\n  config.set({\n    frameworks:\
  \ [\n      // Reference: https://github.com/karma-runner/karma-mocha\n      // 将框架设置为\
  \ mocha\n      'mocha'\n    ],\n\n    reporters: [\n      // Reference: https://github.com/mlex/karma-spec-reporter\n\
  \      // 将报告器设置为将详细结果打印到控制台\n      'spec',\n\n      // Reference: https://github.com/karma-runner/karma-coverage\n\
  \      // 输出代码覆盖率文件\n      'coverage'\n    ],\n\n    files: [\n      // Reference:\
  \ https://www.npmjs.com/package/phantomjs-polyfill\n      // 是因为 React.js 需要 bind\
  \ 而 phantomjs 不支持它\n      'node_modules/phantomjs-polyfill/bind-polyfill.js',\n\n\
  \      // 获取 tests 目录下包含 _test 的所有文件\n      'tests/**/*_test.*'\n    ],\n\n    preprocessors:\
  \ {\n      // Reference: http://webpack.github.io/docs/testing.html\n      // Reference:\
  \ https://github.com/webpack/karma-webpack\n      // 使用 webpack 文件并加载 sourcemaps\n\
  \      'tests/**/*_test.*': ['webpack', 'sourcemap']\n    },\n\n    browsers: [\n\
  \      // 使用 PhantomJS 运行测试\n      'PhantomJS'\n    ],\n\n    singleRun: true,\n\
  \n    // 配置代码覆盖率报告器\n    coverageReporter: {\n      dir: 'build/coverage/',\n  \
  \    type: 'html'\n    },\n\n    // 测试 webpack 配置\n    webpack: require('./webpack.config'),\n\
  \n    // 从输出中隐藏 webpack 构建信息\n    webpackMiddleware: {\n      noInfo: true\n   \
  \ }\n  });\n};\n```\n\n如从注释所示，你可以通过多种方式配置 Karma。例如，你可以将其指向 Chrome 甚至同时指向多个浏览器。\n\
  \n我们仍然需要编写一些 Webpack 特有的配置来让这一切正常工作。\n\n## 配置 Webpack\n\nWebpack 需要自身的一些特殊配置。为了让\
  \ Karma 找到我们想要的代码，我们需要将 Webpack 指向它。此外，我们需要配置 `isparta-instrumenter-loader`，以便我们的代码覆盖率报告生成通过\
  \ Istanbul 工作。\n\n**webpack.config**\n\n```\n...\n```\n\n\n\n\n更好，我们现在可以尝试运行 `npm\
  \ run tdd`。执行它并尝试修改测试。例如，让它失败。如你所见，这为我们提供了一个良好的测试工作流。既然我们已经测试了测试本身是有效的，现在可以专注于实际工作了。\n\
  \n## 9.3 测试 Kanban 组件\n\n通过观察我们的 Kanban 应用程序组件，可以看到 `Editable` 具有很多复杂性。对其进行测试以锁定这些逻辑是一个好主意。\n\
  \n`Note` 是另一个有趣的组件。尽管它是一个微不足道的组件，但考虑到它依赖于 React DnD，测试它并不完全简单。这需要进行一些额外的思考。\n\n\
  我将涵盖这两个案例，因为理解它们将帮助你在如果需要的话，为剩余组件实现测试。核心思想始终是一致的：\n\n1. 确定你想测试什么。\n2. 通过 React 的\
  \ `renderIntoDocument` 渲染待测试的组件。\n3. （可选的）以某种方式操作该组件。例如，你可以通过 React 的 API 模拟用户操作。\n\
  4. 断言某些真值。\n\n理想情况下，你的单元测试应该一次只测试一件事。保持它们简单是一个好主意，因为这会在调试代码时提供帮助。正如之前讨论的，单元测试不能证明\
  \ Bug 的不存在。相反，它们证明了代码对于该特定测试是正确的。这就是单元测试对调试有用之处。你可以使用它们来证明你的假设。\n\n在开始之前，我们应该为 `Editable`\
  \ 制定测试计划并完成一些测试。注意，你可以使用 `npm run tdd` 实现这些测试并在编写过程中输入它们。尽管去尝试弄坏一些东西以获得更好的感觉。\n\n\
  ### `Editable` 的测试计划\n\n`Editable` 中有几点需要测试的：\n\n* 它是否正确渲染了给定的 `value`？\n* 如果不在编辑模式下，它会触发\
  \ `onValueClick` 吗？\n* 在编辑时是否会触发 `onEdit` 回调？\n* 在删除时是否会触发 `onDelete` 回调？\n\n我确定还有几个额外的案例是值得测试，但这些将帮助我们开始，并帮助我们理解如何为\
  \ React 组件编写单元测试。\n\n### `Editable` 渲染值\n\n为了检查 `Editable` 是否渲染了值，我们需要：\n\n1. 在渲染组件时向它传递一些\
  \ `value`。\n2. 从 DOM 中找到该值。\n3. 检查该值是否是我们预期的。\n\n在代码方面它看起来如下：\n\n**tests/editable_test.jsx**\n\
  \n```\nimport React from 'react';\nimport {\n  renderIntoDocument,\n  findRenderedDOMComponentWithClass\n\
  } from 'react-addons-test-utils';\nimport assert from 'assert';\nimport Editable\
  \ from '../app/components/Editable.jsx';\n\ndescribe('Editable', () => {\n  it('renders\
  \ value', () => {\n    const value = 'value';\n    const component = renderIntoDocument(\n\
  \      <Editable value={value} />\n    );\n\n    const valueComponent = findRenderedDOMComponentWithClass(component,\
  \ 'value');\n\n    assert.equal(valueComponent.textContent, value);\n  });\n});\n\
  ```\n\n这里有几个重要的部分值得理解，因为它们之后会重复：\n\n* `renderIntoDocument` 是 React 提供的一个测试工具。它将给定的标记渲染到文档中，我们可以对其进行检查。它需要\
  \ DOM 才能工作。\n* `findRenderedDOMComponentWithClass` 允许我们遍历 DOM 并寻找匹配给定类名的组件。它期望找到好一个匹配项，否则将抛出异常。`scry`\
  \ 变体更通用，返回匹配项列表。\n* `valueComponent.textContent` 为我们访问 DOM 节点的文本内容。\n\n这些函数是 React\
  \ [Test Utilities](https://facebook.github.io/react/docs/test-utils.html) API 的一部分。\n\
  \n既然我们可以确定 `Editable` 可以渲染传递给它的值，我们可以尝试一些更复杂的操作，即进入编辑模式。\n\n### `Editable` 进入编辑模式\n\
  \n我们在这里可以遵循之前类似的思路。不过，这个案例更复杂。首先，我们需要以某种方式进入编辑模式。之后，我们需要检查输入框显示了正确的值。考虑下面的实现：\n\n\
  **tests/editable_test.jsx**\n\n```\nimport React from 'react';\nimport {\n  renderIntoDocument,\n\
  \  findRenderedDOMComponentWithClass,\n  findRenderedDOMComponentWithClass,\n  findRenderedDOMComponentWithTag,\n\
  \  Simulate\n} from 'react-addons-test-utils';\nimport assert from 'assert';\nimport\
  \ Editable from '../app/components/Editable.jsx';\n\ndescribe('Editable', () =>\
  \ {\n  ...\n\n  it('triggers onValueClick', () => {\n    let triggered = false;\n\
  \    const value = 'value';\n    const onValueClick = () => triggered = true;\n\
  \    const component = renderIntoDocument(\n      <Editable value={value} onValueClick={onValueClick}\
  \ />\n    );\n\n    const valueComponent = findRenderedDOMComponentWithClass(component,\
  \ 'value');\n    Simulate.click(valueComponent);\n\n    assert.equal(triggered,\
  \ true);\n  });\n});\n```\n\n`Simulate.click` 触发了我们在 `Editable` 中定义的 `onClick` 行为。还有其他的方法可以模拟其他用户输入。\n\
  \n还有一些工作需要完成。\n\n### `Editable` 触发 `onEdit`\n\n既然我们可以确定 `Editable` 可以渲染传递给它的值，我们可以尝试一些更复杂的操作，即进入编辑模式。我们在这里可以遵循之前类似的思路。不过，这个案例更复杂。首先，我们需要以某种方式进入编辑模式。之后，我们需要检查输入框显示了正确的值。考虑下面的实现：\n\
  \n**tests/editable_test.jsx**\n\n```\n...\n\ndescribe('Editable', () => {\n  ...\n\
  \n  it('triggers onEdit', () => {\n    let triggered = false;\n    const newValue\
  \ = 'value';\n    const onEdit = (val) => {\n      triggered = true;\n      assert.equal(val,\
  \ newValue);\n    };\n    const component = renderIntoDocument(\n      <Editable\
  \ editing={true} value={'value'} onEdit={onEdit} />\n    );\n\n    const input =\
  \ findRenderedDOMComponentWithTag(component, 'input');\n    input.value = newValue;\n\
  \n    Simulate.blur(input);\n\n    assert.equal(triggered, true);\n  });\n});\n\
  ```\n\n`findRenderedDOMComponentWithTag` 用于匹配 `input` 标签。这与类的方法相同。还有一个 `scry` 变体以相同的方式针对标签名工作。\n\
  \n与之前的测试相比，这里没有多少新内容。我们在 `onEdit` 处进行断言并通过 `Simulate.blur` 触发行为。\n\n### `Editable`\
  \ 允许删除\n\n最后一个测试。\n\n检查 `Editable` 是否允许删除与 `onEdit` 案例类似。我们只需要检查回调是否触发：\n\n**tests/editable_test.jsx**\n\
  \n```\ndescribe('Editable', () => {\n  ...\n\n  it('allows deletion', () => {\n\
  \    let deleted = false;\n    const onDelete = () => {\n      deleted = true;\n\
  \    };\n    const component = renderIntoDocument(\n      <Editable value={'value'}\
  \ onDelete={onDelete} />\n    );\n\n    let deleteComponent = findRenderedDOMComponentWithClass(component,\
  \ 'delete');\n    Simulate.click(deleteComponent);\n\n    assert.equal(deleted,\
  \ true);\n  });\n});\n```\n\n我们现在有了一些基础测试，但覆盖率如何？\n\n#### 检查测试覆盖率\n\n现在是检查我们的覆盖率报告了。运行\
  \ `build/coverage/PhantomJS .../` 浏览器中检查它。你应该看到类似这样的内容：\n\n![Istanbul coverage](img/coverage.png)\n\
  \nIstanbul coverage\n\n根据统计数据，我们做得不错。我们仍然缺少一些分支，但我们覆盖了大部分 `Editable`，所以这很好。你可以尝试移除测试以查看统计的变化。你也可以尝试找出哪些分支没有被覆盖。\n\
  \n你可以通过在浏览器中查看 `components/Editable.jsx.html` 来查看特定组件的报告。那将向你显示 `checkEnter` 尚未被任何测试覆盖。在某个时候实现缺失的测试将是一个好主意。\n\
  \n\n\n\n\n### 测试 `Note`\n\n尽管 `Note` 是一个非常简单的包装组件，但测试它是很有用的，因为这可以帮助我们理解如何处理 React\
  \ DnD。它在设计上就是可测试的。它的[测试文档](https://gaearon.github.io/react-dnd/docs-testing.html)\
  \ 有详细的介绍。\n\n在这种情况下，我们可以不依赖 `HTML5Backend`，而是依赖 `TestBackend`。困难的部分在于构建测试所需的上下文，以确保\
  \ `Note` 确实渲染了它的内容。执行：\n\n```\nnpm i react-dnd-test-backend --save-dev\n```\n\n\
  来安装后端。下面的测试说明了基本思想：\n\n`tests/note_test.jsx`\n\n```javascript\nimport React from\
  \ 'react';\nimport {\n  renderIntoDocument\n} from 'react-addons-test-utils';\n\
  import TestBackend from 'react-dnd-test-backend';\nimport {DragDropContext} from\
  \ 'react-dnd';\nimport assert from 'assert';\nimport Note from 'app/components/Note.jsx';\n\
  \ndescribe('Note', () => {\n  it('renders children', () => {\n    const test = 'test';\n\
  \    const NoteContent = wrapInTestContext(Note);\n    const component = renderIntoDocument(\n\
  \      <NoteContent id=\"demo\">{test}</NoteContent>\n    );\n\n    assert.equal(component.props.children,\
  \ test);\n  });\n});\n\n// https://gaearon.github.io/react-dnd/docs-testing.html\n\
  function wrapInTestContext(DecoratedComponent) {\n  @DragDropContext(TestBackend)\n\
  \  class TestContextContainer extends React.Component {\n    render() {\n      return\
  \ <DecoratedComponent {...this.props} />;\n    }\n  }\n\n  return TestContextContainer;\n\
  }\n```\n\n测试本身很简单。我们只需要检查 `children` 属性是否按照我们预期的方式设置了。通过 DOM 检查渲染输出可以改进该测试。\n\n\
  ### 9.4 测试 Kanban Store\n\nAlt 提供了一种很好的方法来同时测试[actions](http://alt.js.org/docs/testing/actions/)\
  \ 和[stores](http://alt.js.org/docs/testing/stores/)。鉴于我们的 actions 如此简单，关注 stores\
  \ 是有意义的。为了你们展示基本思想，我将展示如何测试 `NoteStore`。同样的思路也可以应用于 `LaneStore`。\n\n#### `NoteStore`\
  \ 的测试计划\n\n为了覆盖 `NoteStore`，我们应该断言以下事实：\n\n* 它是否正确创建了笔记？\n* 它是否允许正确编辑笔记？\n* 它是否允许通过\
  \ id 删除笔记？\n* 它是否允许通过指定的 id 数组过滤笔记？\n\n此外，我们还可以针对特殊情况进行测试，并观察 `NoteStore` 处理各种类型输入的行为。这是非常有用的最小需求，并将让我们很好地覆盖常见路径。\n\
  \n#### `NoteStore` 支持 `create`\n\n创建新笔记很简单。我们只需要调用 `NoteActions.create` 并查看 `NoteStore.getState`\
  \ 的结果包含新创建的 `Note`：\n\n`tests/note_store_test.js`\n\n```javascript\nimport assert\
  \ from 'assert';\nimport NoteActions from 'app/actions/NoteActions';\nimport NoteStore\
  \ from 'app/stores/NoteStore';\nimport alt from 'app/libs/alt';\n\ndescribe('NoteStore',\
  \ () => {\n  it('creates notes', () => {\n    const task = 'test';\n\n    NoteActions.create({task});\n\
  \n    const state = NoteStore.getState();\n\n    assert.equal(state.notes.length,\
  \ 1);\n    assert.equal(state.notes[0].task, task);\n  });\n});\n```\n\n除了需要的导入之外，这比我们的\
  \ React 测试要简单。测试逻辑易于理解。\n\n#### `NoteStore` 支持 `update`\n\n为了进行 `update`，我们首先需要\
  \ `create` 一个 `Note`。之后，我们可以某种方式更改它的内容。最后，我们可以断言状态发生了变化：\n\n`tests/note_store_test.js`\n\
  \n```javascript\n...\n\ndescribe('NoteStore', () => {\n  ...\n\n  it('updates notes',\
  \ () => {\n    const task = 'test';\n    const updatedTask = 'test 2';\n\n    NoteActions.create({task});\n\
  \n    const note = NoteStore.getState().notes[0];\n\n    NoteActions.update({...note,\
  \ task: updatedTask});\n\n    const state = NoteStore.getState();\n\n    assert.equal(state.notes.length,\
  \ 1);\n    assert.equal(state.notes[0].task, updatedTask);\n  });\n});\n```\n\n\
  问题是 `assert.equal(state.notes.length, 1);` 将失败。这是因为我们的 `NoteStore` 是一个单例。我们的第一个测试已经向它创建了一个\
  \ `Note`。有两种解决方法：\n\n1. 将 `alt.CreateStore` 推向更高。现在我们在模块级别创建关联，而这现在导致了问题。\n2. 在每个测试之前\
  \ `flush` Alt store 的内容。\n\n在这种情况下，我选择第 2：\n\n`tests/note_store_test.js`\n\n```javascript\n\
  ...\n\ndescribe('NoteStore', () => {\n  beforeEach(() => {\n    alt.flush();\n \
  \ });\n\n  ...\n});\n```\n\n在经过这个小调整后，我们的测试运行方式符合我们的预期。这仅仅说明有时我们需要调整测试。\n\n####\
  \ `NoteStore` 支持 `delete`\n\n测试 `delete` 同样简单。我们需要创建一个 `Note` 然后断言它已经不存在了：\n\n`tests/note_store_test.js`\n\
  \n```javascript\ndescribe('NoteStore', () => {\n  it('deletes notes', () => {\n\
  \    // logic to create and delete\n    NoteActions.create({task: 'test'});\n  \
  \  NoteActions.delete(id);\n    const state = NoteStore.getState();\n    assert.equal(state.notes.length,\
  \ 0);\n  });\n});\n```\n\n#### `NoteStore` 支持 `get`\n\n只剩下 `get` 需要测试了。由于它是 `NoteStore`\
  \ 的公共方法，我们可以直接测试：\n\n`tests/note_store_test.js`\n\n```javascript\ndescribe('NoteStore',\
  \ () => {\n  it('gets notes', () => {\n    const task = 'test';\n    NoteActions.create({task});\n\
  \n    const note = NoteStore.getState().notes[0];\n    const notes = NoteStore.getByIds([note.id]);\n\
  \n    assert.equal(notes.length, 1);\n    assert.equal(notes[0].task, task);\n \
  \ });\n});\n```\n\n### 9.5 总结\n\n现在我们的 Kanban 应用有一些基础单元测试。虽然远未完全测试，但我们成功覆盖了一些关键部分。结果是我们对它的正常运行更有信心。不过，测试剩余部分是一个好主意，也许还可以重构那些测试。还有一些我们没有考虑考虑特殊情况。\n\
  \n我们还完全缺少验收测试。幸运的是，这是一个可以在 React、Alt 等工具之外解决的话题。[Nightwatch](http://nightwatchjs.org/)\
  \ 是一个运行在 Selenium 服务器之上的工具，允许你编写这类测试。学习这种工具需要一些精力，但它允许你测试应用程序的更多定性方面。\n\n## 10 在\
  \ React 中使用类型\n\n就像代码检查（linting）一样，类型系统也是另一个可以让我们生活更轻松的功能，特别是在处理大型代码库时。某些语言在这方面非常严格，但正如你们所知，JavaScript\
  \ 非常灵活。\n\n灵活性在原型设计阶段非常有用。遗憾的是，这意味着很容易犯错并在为时太晚才发现。这就是为什么测试和类型如此重要。类型系统是增强代码并使其难以被破坏的好方法。它也可以作为其他开发人员的文档形式。\n\
  \n在 React 中，你使用 `propTypes` 来记录组件的预期。通过 Flow（一种渐进式类型语法）可以超越这一点。React 也有对应的 [TypeScript\
  \ 类型定义](https://github.com/borisyankov/DefinitelyTyped/tree/master/react)，但我们不会深入探讨。\n\
  \n### 10.1 `propTypes` 和 `defaultProps`\n\n\n\n\n\n`propTypes` 允许你记录组件预期接收的数据类型。`defaultProps`\
  \ 允许你为 `propTypes` 设置默认值。这可以减少你需要编写的代码量，因为你不需要过多担心特殊情况。\n\n这些注解数据在开发期间使用。如果你违反了类型契约，React\
  \ 会通知你。因此，你能够在潜在问题造成危害之前修复它们。为了提高性能，这些检查在生产模式（`NODE_ENV=production`）下会被禁用。\n\n##\
  \ 注释样式\n\n注解组件的方式取决于你声明它们的方式。我在下方使用各种语法提供了一些简化的示例：\n\n### ES5\n```\nmodule.exports\
  \ = React.createClass({\n  displayName: 'Editable',\n  propTypes: {\n    value:\
  \ React.PropTypes.string\n  },\n  defaultProps: {\n    value: ''\n  },\n  ...\n\
  });\n```\n\n#### ES6\n```javascript\nclass Editable extends React.Component {...}\n\
  \nEditable.propTypes = {\n  value: React.PropTypes.string\n};\nEditable.defaultProps\
  \ = {\n  value: ''\n};\n\nexport default Editable;\n```\n\n### ES7 (建议的属性初始化器)\n\
  ```javascript\nexport default class Editable extends React.Component {\n  static\
  \ propTypes = {\n    value: React.PropTypes.string\n  }\n  static defaultProps =\
  \ {\n    value: ''\n  }\n}\n```\n\nProps 默认是可选的。可以使用注解（如 `React.PropTypes.string.isRequired`）来强制传递\
  \ prop。如果没有传递，你将收到一个警告。\n\n## 注解类型\n\n`propTypes` 支持以下基础类型：`React.PropTypes.[array,\
  \ bool, func, number, object, string]`。此外，还有一个特殊的 `node` 类型，指代任何可以被 React 渲染的内容。`any`\
  \ 包含字面上的任何内容。`element` 映射到 React 元素。此外还有以下函数：\n\n* `React.PropTypes.instanceOf(class)`\
  \ - 使用 JavaScript 的 `instanceof` 进行检查。\n* `React.PropTypes.oneOf(['cat', 'dog',\
  \ 'lion'])` - 检查是否提供了值中的之一。\n* `React.PropTypes.oneOfType([<propType>, ...])` -\
  \ 与 `propTypes` 相同。你可以在这里使用基础类型定义（例如 `React.PropTypes.array`）。\n* `React.PropTypes.arrayOf(<propType>)`\
  \ - 检查给定数组是否包含给定类型的项。\n* `React.PropTypes.objectOf(<propType>)` - 与数组的思路相同。\n* `React.PropTypes.shape({<name>:\
  \ <propType>})` - 检查给定对象是否符合具有特定 `propTypes` 的特定对象形状。\n\n还可以通过向 prop 类型传递使用以下签的函数来实现自定义验证器：`function(props,\
  \ propName, componentName)`。如果自定义验证失败，你应该返回一个错误（例如 `return new Error('Not a number!')`）。\n\
  \n[文档](https://facebook.github.io/react/docs/reusable-components.html) 提供了更详细的说明。\n\
  \n## 10.2 类型看板 (Typing Kanban)\n\n为了让你更好地了解 `propTypes` 是如何工作的，我们可以对我们的看板应用进行类型化。只有少数组件需要注解。我们可以跳过对\
  \ `App` 的注解，因为它是应用程序的根组件。其余部分可以使用一些类型。\n\n### 注释通道 (Lanes)\n\n`Lanes` 提供了一个很好的起点。它期望一个\
  \ `lanes` 数组。我们可以将其设为可选，并默为空列表。这意味着我们可以稍微简化 `App`：\n\n**app/components/App.jsx**\n\
  ```javascript\n// 而不是\nlanes: () => LaneStore.getState().lanes || []\n\n// 我们可以这样做\n\
  lanes: () => LaneStore.getState().lanes\n```\n\n在 `propTypes` 方面，我们的注解看起来如下：\n\n\
  **app/components/Lanes.jsx**\n```javascript\nexport default ({lanes}) => {\nconst\
  \ Lanes = ({lanes}) => {\n  ...\n}\nLanes.propTypes = {\n  lanes: React.PropTypes.array\n\
  };\nLanes.defaultProps = {\n  lanes: []\n};\n\nexport default Lanes;\n```\n\n现在我们记录了\
  \ `Lanes` 期望的内容。`App` 也变得整洁了一些。不过，如果通道项的格式无效，这并帮助不大。我们应该注解 `Lane` 及其子组件以防止这种情况。\n\
  \n### 注释单个通道 (Lane)\n\n根据我们的隐式定义，`Lane` 期望一个 `id`、`name` 和 `connectDropSource`。`id`\
  \ 应该是必须的，因为没有 id 的通道没有任何意义。其余部分可以保持可选。翻译成 `propTypes` 后我们将得到：\n\n**app/components/Lane.jsx**\n\
  ```javascript\nexport default class Lane extends React.Component {\nclass Lane extends\
  \ React.Component {\n  ...\n}\nLane.propTypes = {\n  lane: React.PropTypes.shape({\n\
  \    id: React.PropTypes.string.isRequired,\n    editing: React.PropTypes.bool,\n\
  \    name: React.PropTypes.string,\n    notes: React.PropTypes.array\n  }).isRequired,\n\
  \  connectDropTarget: React.PropTypes.func\n};\nLane.defaultProps = {\n  name: '',\n\
  \  notes: []\n};\n\nexport default Lane;\n```\n\n如果现在我们的基础数据模型出现了错误，我们将知道。为了加固我们的系统，我们应该注解\
  \ `Notes`。\n\n### 注释注释 (Notes)\n\n在我们的系统中，`Notes` 接受 `notes`、`onEdit` 和 `onDelete`。它能够渲染可选的\
  \ `value`。使用注解语法得到：\n\n**app/components/Notes.jsx**\n```javascript\nexport default\
  \ ({lanes}) => {\nconst Notes = ({lanes, onEdit, onDelete}) => {\n  ...\n}\nNotes.propTypes\
  \ = {\n  notes: React.PropTypes.array,\n  onEdit: React.PropTypes.func,\n  onDelete:\
  \ React.PropTypes.func\n};\nNotes.defaultProps = {\n  notes: [],\n  onEdit: () =>\
  \ {}\n};\n\nexport default Notes;\n```\n\n### 注释 (Note)\n\n在我们的实现中，`Note` 作为一个渲染内容的包装。它接收\
  \ `connectDragSource` 和 `connectDropTarget`。在注解格式得到：\n\n**app/components/Note.jsx**\n\
  ```javascript\n...\nexport default class Note extends React.Component {\nclass Note\
  \ extends React.Component {\n  ...\n}\nNote.propTypes = {\n  id: React.PropTypes.string.isRequired,\n\
  \  editing: React.PropTypes.bool,\n  connectDragSource: React.PropTypes.func,\n\
  \  connectDropTarget: React.PropTypes.func,\n  isDragging: React.PropTypes.bool,\n\
  \  onMove: React.PropTypes.func\n};\nNote.defaultProps = {\n  onMove: () => {}\n\
  };\n\nexport default Note;\n```\n\n### 注释可编辑 (Editable)\n\n在我们的系统中，`Editable` 处理了一些繁性工作。它能够渲染可选的\
  \ `value`。它应该接收 `onEdit` 钩子。`onDelete` 是可选的。\n\n**app/components/Editable.jsx**\n\
  ```javascript\nimport React from 'react';\n\nexport default class Editable extends\
  \ React.Component {\nclass Editable extends React.Component {\n  ...\n  finishEdit\
  \ = (e) => {\n    const value = e.target.value;\n\n    if(this.props.onEdit) {\n\
  \      this.props.onEdit(value);\n    }\n    this.props.onEdit(e.target.value);\n\
  \  };\n}\nEditable.propTypes = {\n  value: React.PropTypes.string,\n  editing: React.PropTypes.bool,\n\
  \  onEdit: React.PropTypes.func.isRequired,\n  onDelete: React.PropTypes.func,\n\
  \  onValueClick: React.PropTypes.func\n};\nEditable.defaultProps = {\n  value: '',\n\
  \  editing: false,\n  onEdit: () => {}\n};\n\nexport default Editable;\n```\n\n\n\
  \n虽然 `propTypes` 很好用，但它们也有些冗长。Flow 类型系统可以在这方面为提供帮助。\n\n## 10.3 使用 Flow 进行类型检查\n\n\
  ![Flow](img/flow.png)\n\nFlow\n\nFacebook 的 [Flow](http://flowtype.org/) 为 JavaScript\
  \ 提供了渐进式类型系统。这意味着你可以根据需要为代码添加类型。我们可以实现与 `propTypes` 类似的结果，并根据需要为代码添加额外的不变约束（invariants）。为了让你直观地感受，请考虑以下简单示例：\n\
  \n```\nfunction add(x: number, y: number): number {\n  return x + y;\n}\n```\n\n\
  定义表明 `add` 应该接收两个数字并返回一个数字作为结果。这是静态类型语言中的典型做法。现在我们可以在 JavaScript 中从这种思想中受益。\n\n\
  Flow 依赖于必须单独安装的静态类型检查器。当你运行该工具时，它会评估你的代码并提供建议。为了方便开发，有一种方法可以在运行时评估 Flow 类型，这可以通过\
  \ Babel 插件实现。\n\n### 设置 Flow\n\n针对常见平台有[预编译的二进制文件](http://flowtype.org/docs/getting-started.html)。你也可以通过\
  \ Mac OS X 上的 Homebrew 安装（`brew install flow`）。\n\n由于 Flow 依赖配置且没有配置将无法运行，我们需要生成一些配置。执行\
  \ `flow init`。这将生成一个 `.flowconfig` 文件，用于[高级配置](http://flowtype.org/docs/advanced-configuration.html)。\n\
  \n我们需要进一步微调以适应我们的环境。我们希望确保它在解析 `./app` 目录时跳过 `./node_modules`。此外，我们需要为 Flow 接口设置入口，并让\
  \ Flow 忽略某些语言特性。\n\n由于我们想避免解析 `node_modules`，我们应该如下调整配置：\n\n**.flowconfig**\n\n\
  ```\n[ignore]\n.*/node_modules\n\n[include]\n./app\n\n[libs]\n./interfaces\n\n[options]\n\
  esproposal.decorators=ignore\nesproposal.class_instance_fields=ignore\n```\n\n###\
  \ 运行 Flow\n\n运行 Flow 非常简单，只需执行 `flow check`。你可能会看到类似这样的输出：\n\n```\n$ flow check\n\
  find: ..././interfaces: No such file or directory\n\nFound 0 errors\n```\n\n我们稍后会修复那个警告。在此之前，我们应该让通过\
  \ npm 触发变得容易。在你的 `package.json` 中添加以下内容：\n\n**package.json**\n\n```\n{\n  ...\n\
  \  \"scripts\": {\n    ...\n    \"flow\": \"flow check\"\n  },\n  ...\n}\n```\n\n\
  之后，我们就可以执行 `npm run flow`，而无需关心调用它的确切细节。请注意，如果进程失败，它会给出一个看起来很难看的 npm 错误（多行 `npm\
  \ ERR!`）。如果你想禁用它，可以改运行 `npm run flow --silent` 来过滤掉它。\n\n### 设置演示\n\nFlow 期望你在使用它的文件中通过在文件开头使用\
  \ `/* @flow */` 声明对文件进行标注。或者，你也可以尝试运行 `flow check --all`。请记住，这可能会缓慢，因为它会处理你包含的每一个文件，无论该文件是否已标记了\
  \ `@flow`！在本项目，我们将坚持使用前者。\n\n为了更好地了解 Flow 输出的样式，我们可以尝试一个小演示。按照如下方式设置：\n\n**demo.js**\n\
  \n```\n/* @flow */\nfunction add(x: number, y: number): number {\n  return x + y;\n\
  }\n\nadd(2, 4);\n\n/* 根据定义，这应该是无效！ */\nadd('foo', 'bar');\n```\n\n现在运行 `npm run\
  \ flow --silent`。如果运行正常，你应该看到类似的内容：\n\n```\nfind: .../kanban_app/./interfaces: No\
  \ such file or directory\ndemo.js:9\n  9: add('foo', 'bar');\n     ^^^^^^^^^^^^^^^^^\
  \ function call\n  9: add('foo', 'bar');\n         ^^^^^ string. 此类型与 number 不兼容\n\
  \  2: function add(x: number, y: number): number {\n                     ^^^^^^\
  \ number\n\ndemo.js:9\n  9: add('foo', 'bar');\n     ^^^^^^^^^^^^^^^^^ function\
  \ call\n  9: add('foo', 'bar');\n                ^^^^^ string. 此类型与 number 不兼容\n\
  \  2: function add(x: number, y: number): number {\n                           \
  \     ^^^^^^ number\n\nFound 2 errors\n```\n\n这意味着一切运行正常，且 Flow 为我们捕捉了一个糟糕的编程错误。有人试图向\
  \ `add` 传递不兼容类型的值。在上线之前知道这一点是很好的。\n\n既然我们知道 Flow 可以帮我们发现问题，在继续之前删除演示文件。\n\n## 10.4\
  \ 将 `propTypes` 转换为 Flow 检查\n\n为了让你更好地了解迁移应用到 Flowmap，接下来我将为你展示如何将我们的组件转换为该格式。\n\
  \n### 将 `Editable` 迁移到 Flow\n\n`Editable` 是一个很好的起点。在这种情况下，所有的 `props` 都是可选的。不过，如果我们想要，也可以很容易让它们变为强制。我已经将\
  \ propType 定义转换为 ES7 样式，因为那是 Flow 期望的：\n\n**app/components/Editable.jsx**\n\n```\n\
  /* @flow */\nimport React from 'react';\n\nclass Editable extends React.Component\
  \ {\n  static props: {\n    value: string;\n    editing: boolean;\n    onEdit: Function;\n\
  \    onDelete: Function;\n    onValueClick: Function\n  };\n  static defaultProps\
  \ = {\n    value: '',\n    editing: false,\n    onEdit: () => {},\n    onDelete:\
  \ () => {},\n    onValueClick: () => {},\n  };\n\n  render() {\n    const {value,\
  \ editing, onEdit, onDelete, onValueClick} = this.props;\n    return (\n      <div\
  \ className=\"editable\">\n        <input\n          value={value}\n          onChange={(e)\
  \ => onEdit(e.target.value)}\n        />\n        {editing && (\n          <>\n\
  \            <button onClick={onDelete}>Delete</button>\n            <button onClick={onValueClick}>Value</button>\n\
  \          </>\n        )}\n      </div>\n    );\n  }\n}\n\nEditable.propTypes =\
  \ {\n  value: PropTypes.string.isRequired,\n  editing: PropTypes.bool.isRequired,\n\
  \  onEdit: PropTypes.func.isRequired,\n  onDelete: PropTypes.func.isRequired,\n\
  \  onValueClick: PropTypes.func.isRequired,\n};\n\nEditable.defaultProps = {\n \
  \ value: '',\n  editing: false,\n  onEdit: () => {},\n  onDelete: () => {},\n  onValueClick:\
  \ () => {},\n};\n\nexport default Editable;\n```\n\n如果你执行 `npm run flow --silent`，你不应该看到任何错误：\n\
  \n```\nfind: .../kanban_app/./interfaces: No such file or directory\n\nFound 0 errors\n\
  ```\n\n一个简单的组件，如 `Note`，另一个很好的选择。\n\n### 将 `Note` 迁移到 Flow\n\n将 `Note` 迁移到 Flow\
  \ 并没有我希望那么容易。由于 Flow 不支持类的装饰器语法，我们需要将定义改为基于函数。经过这个微调，我们就有了可以类型的内容：\n\n**app/components/Note.jsx**\n\
  \n```javascript\nimport React from 'react';\nimport {DragSource, DropTarget} from\
  \ 'react-dnd';\nimport ItemTypes from '../constants/itemTypes';\n\nconst Note =\
  \ ({id, onMove}) => {\n  return (\n    <div className=\"note\">\n      {id}\n  \
  \  </div>\n  );\n};\n\nexport default DragSource(ItemTypes.NOTE, (connect, monitor)\
  \ => ({\n  dragSource: connect.dragSource(),\n  isDragging: monitor.isDragging()\n\
  }))(DropTarget(ItemTypes.NOTE, (connect) => ({\n  dropTarget: connect.dropTarget()\n\
  }))(Note);\n```\n\n\n\n```\n$ npm run flow --silent\nfind: .../kanban_app/interfaces:\
  \ No such file or directory\napp/components/Note.jsx:3\n  3: import {DragSource,\
  \ DropTarget} from 'react-dnd';\n                                          ^^^^^^^^^^^\
  \ react-dnd. Required module\\\n not found\n\nFound 1 error\n```\n\n错误意味着 `Flow`\
  \ 正在寻找一个模块，但未能找到它。这就是 `interfaces` 目录的作用所在。由于我们的模块期望类型定义，我们应该给它提供如下类型定义：\n\n`interfaces/react-dnd.js`\n\
  \n```javascript\ndeclare module 'react-dnd' {\n  declare function DragSource():\
  \ any;\n  declare function DropTarget(): any;\n}\n```\n\n这表示 `react-dnd` 是一个导出了两个可以返回任何类型的函数的模块。如果我们的应用程序中有第三方代码，我们需要实现像这样的声明来与之交互。再举一个例子，`alt-container`\
  \ 的接口可能像这样：\n\n`interfaces/alt-container.js`\n\n```\ndeclare module 'alt-container'\
  \ {\n  declare function exports(): Object;\n}\n```\n\n`alt-container` 是一个导出一个对象的模块。我们当然可以比这更具体。[Flow\
  \ 文档](http://flowtype.org/docs/declarations.html) 对该主题有更详细的介绍。\n\n如果你现在执行 `npm run\
  \ flow --silent`，你不应该收到任何错误或警告：\n\n```\n$ npm run flow --silent\n\nFound 0 errors\n\
  ```\n\n在编写时，`Flow` 还没有为函数组件提供良好的类型化方法 ([#1081](https://github.com/facebook/flow/issues/1081))。一旦情况发生变化，我会向你展示如何实现。目前，这个小演示足以让你对如何使用\
  \ `Flow` 有一个大致的概念。\n\n虽然还有一些不完善的地方，但当它工作时，它可以帮助更早地发现潜在问题。相同的注解在开发期间的运行时检查很有用。名为\
  \ [babel-plugin-typecheck](https://www.npmjs.com/package/babel-plugin-typecheck)\
  \ 的 Babel 插件可以实现这一点。\n\n### 10.5 Babel Typecheck\n\n`babel-plugin-typecheck` 能够将你的\
  \ `Flow` 注释转换为运行时检查。要开始，请执行\n\n```\nnpm i babel-plugin-typecheck --save-dev\n```\n\
  \n为了让 `Babel` 感知到它，我们需要修改 `.babelrc`：\n\n`.babelrc`\n\n```json\n{\n  ...\n  \"env\"\
  : {\n    \"start\": {\n      \"presets\": [\n        \"react-hmre\"\n      ]\n \
  \     ],\n      \"plugins\": [\n        [\n          \"typecheck\"\n        ]\n\
  \      ]\n    }\n  }\n}\n```\n\n此此更改后，我们的 `Flow` 检查将在开发期间执行。`Flow` 静态检查器能够发现更多的错误。不过，运行时检查也有其优势，比什么都没有好得多。你可以通过故意破坏\
  \ `Editable` 的 `render()` 方法来测试它。尝试从那里返回一个字符串，看看它是如何崩溃的。`Flow` 会捕获它，但在开发过程中获得这样的反馈是很棒的。\n\
  \n\n\n[ESLint](http://eslint.org/) 是最近用于 JavaScript 的代码检查解决方案。它构建在 JSLint 和 JSHint\
  \ 理念之上。更重要的是，它允许你开发自定义规则。因此，针对 React 开发了一套非常棒的规则，形式为 [eslint-plugin-react](https://www.npmjs.com/package/eslint-plugin-react)。\n\
  \n## 将 ESLint 与 `package.json` 接\n\n为了将 ESLint 集成到我们的项目中，我们需要进行一些细微的调整。首先，我们需要执行：\n\
  \n```\nnpm i eslint eslint-plugin-react --save-dev\n```\n\n这会将 ESLint 和我们想要使用的插件作为项目的开发依赖添加。接下来，我们需要进行一些配置：\n\
  \n**package.json**\n\n```\n\"scripts\": {\n  ...\n  \"lint\": \"eslint . --ext .js\
  \ --ext .jsx\"\n}\n...\n```\n\n这将触发对项目中所有 JS 和 JSX 文件的 ESLint 检查。这可能会检查的内容有点多。像下面这样在项目根目录下设置\
  \ `.eslintignore` 以跳过 `build/*`：\n\n**.eslintignore**\n\n```\nbuild/\n```\n\n##\
  \ 将 ESLint 与 Babel 连接\n\n接下来，我们需要激活 ES6 解析、几个 React 特有的规则，并设置一些我们自己的规则。你可以根据喜好进行调整。详情请参阅官方的\
  \ [ESLint 规则文档](http://eslint.org/docs/rules/)。请注意，我们正在通过 `extends` 字段扩展推荐的规则集：\n\
  \n**.eslintrc**\n\n```\n{\n  \"extends\": \"eslint:recommended\",\n  \"parserOptions\"\
  : {\n    \"ecmaVersion\": 6,\n    \"ecmaFeatures\": {\n      \"jsx\": true\n   \
  \ },\n    \"sourceType\": \"module\"\n  },\n  \"env\": {\n    \"browser\": true,\n\
  \    \"node\": true\n  },\n  \"plugins\": [\n    \"react\"\n  ],\n  \"rules\": {\n\
  \    \"no-console\": 0,\n    \"new-cap\": 0,\n    \"strict\": 0,\n    \"no-underscore-dangle\"\
  : 0,\n    \"no-use-before-define\": 0,\n    \"eol-last\": 0,\n    \"quotes\": [2,\
  \ \"single\"],\n    \"jsx-quotes\": 1,\n    \"react/jsx-no-undef\": 1,\n    \"react/jsx-uses-react\"\
  : 1,\n    \"react/jsx-uses-vars\": 1\n  }\n}\n```\n\n单个规则的严重程度通过数字定义，如下如下：\n\n-\
  \ 0 - 规则已禁用。\n- 1 - 规则将发出警告。\n- 2 - 规则将发出错误。\n\n某些规则（如 `quotes`）接受数组。这允许你向它们传递额外参数。具体细节请参考该规则的文档。\n\
  \n上面列出的 `react/` 规则只是所有可用规则的一个小子集。根据需要从 [eslint-plugin-react](https://www.npmjs.com/package/eslint-plugin-react)\
  \ 中选择规则。\n\n## 处理 `ELIFECYCLE` 错误\n\n在检查过程失败时，`npm` 会给你返回一个很难看的 `ELIFECYCLE` 错误。实现更整洁输出的好方法是调用\
  \ `npm run lint --silent`。这将隐藏 `ELIFECYCLE` 部分。你可以为此目的定义一个别名。在 Unix 中，你可以执行 `alias\
  \ run='npm run --silent'` 然后执行 `run <script>`。\n\n或者，你可以像这样将输出通过管道给 `true`：\n\n\
  **package.json**\n\n```\n\"scripts\": {\n  ...\n  \"lint\": \"eslint . --ext .js\
  \ --ext .jsx || true\"\n}\n...\n```\n\n这种方法的问题是，如果你通过其他命令调用 `lint`，即使发生失败它也会通过。如果你有另一个类似\
  \ `npm run lint && npm run build` 的脚本，那么无论第一个命令的输出如何，它都会进行构建！\n\n## 将 ESLint 与 Webpack\
  \ 连接\n\n我们可以使用 [eslint-loader](https://www.npmjs.com/package/eslint-loader) 让 Webpack\
  \ 为我们输出 ESLint 消息。第一步执行：\n\n```\nnpm i eslint-loader --save-dev\n```\n\n接下来，我们需要调整开发配置以包含它。向配置中添加以下部分：\n\
  \n**webpack.config.js**\n\n```\nvar common = {\n  ...\n  module: {\n    preLoaders:\
  \ [\n      {\n        test: /\\.jsx?$/,\n        loaders: ['eslint'],\n        include:\
  \ PATHS.app\n      }\n    ]\n  },\n};\n```\n\n我们将配置包含在 `common` 中，这样就能始终执行检查。这样你就可以确保生产环境构建通过你的规则，同时确保在开发期间从检查中获益。\n\
  \n如果你现在执行 `npm start` 并破坏了某些检查规则，你应该能在终端中看到。当你构建项目时也会发生这种情况。\n\n## 11.4 定制 ESLint\n\
  \n尽管你可以使用原生的 ESLint 达到很远的目标，但有一些你需要了解的技巧。例如，你可能想按文件跳过某些规则。你甚至可能想实现自己的规则。接下来我们将简要介绍这些情况。\n\
  \n### 跳过 ESLint 规则\n\n有时，你可能想按文件或按行跳过规则。\n\n### 编写你的规则\n\nESLint 规则依赖于抽象语法树 (AST)。它是词法分析后\
  \ JavaScript 代码的数据结构。有一些工具（如 [recast](https://github.com/benjamn/recast））允许你使用 AST\
  \ 对 JavaScript 进行转换。为了更好地了解 AST 的工作原理及其外观，你可以查看 [Esprima 在线视化](http://esprima.org/demo/parse.html)\
  \ 或 [AST Explorer](http://astexplorer.net/)。或者，你可以安装 `recast` 并检查输出。这就是我们在编写规则时将使用的结构。在\
  \ ESLint 的情况下，我们只是想检查结构并在出错时报告。实现一个简单的规则非常简单：\n\n1. 创建名为 `eslint-plugin-custom`\
  \ 的新项目。你可以将 `custom` 替换为任何内容。ESLint 遵循这种命名规范。\n2. 执行 `npm init -y` 创建一个空的 `package.json`。\n\
  3. 在项目根目录下设置 `index.js`，内容如下：\n\n**eslint-plugin-custom/index.js**\n\n```javascript\n\
  module.exports = {\n  rules: {\n    demo: function(context) {\n      return {\n\
  \        Identifier: function(node) {\n          context.report(node, '这是意外的！');\n\
  \        }\n      };\n    }\n  }\n};\n```\n\n在这种情况下，我们只是对每个标识符进行报告。在实践中，你可能想做比这更复杂的事情，但这是一个良好的起点。\n\
  \n接下来，你需要在 `eslint-plugin-custom` 内部执行 `npm link`。这将使你的插件在系统中可见。`npm link` 允许你轻松地消费你正在开发的开发版本。当你觉得需要时，可以执行\
  \ `npm unlink` 反反。\n\n我们需要修改项目配置，使其能够找到插件和其中的规则。\n\n**.eslintrc**\n\n\n\n\n```json\n\
  {\n  ...\n  \"plugins\": [\n    \"react\",\n    \"react\",\n    \"custom\"\n  ],\n\
  \  \"rules\": {\n    \"custom/demo\": 1,\n    ...\n  }\n}\n```\n\n如果你现在运行 ESLint，你将会看到一堆警告。任务完成！\n\
  \n当然，这个规则目前还没有做任何实用的事情。为了继续进行，我建议查看关于[插件](http://eslint.org/docs/developer-guide/working-with-plugins.html)和[规则](http://eslint.org/docs/developer-guide/working-with-rules.html)的官方文档。\n\
  \n你也可以查看一些现有的规则和插件来获取灵感，看看它们是如何实现某些功能的。ESLint 允许你通过 `extends` 属性来[扩展这些规则集](http://eslint.org/docs/user-guide/configuring.html#extending-configuration-files)。它接受一个路径（`\"\
  extends\": \"./node_modules/coding-standard/.eslintrc\"`）或一个路径数组。条目按照给顺序应用，后面的项会覆盖前面的项。\n\
  \n### ESLint \n\n除了 [eslint.org](http://eslint.org/) 上的官方文档外，你应该查看以下博客文章：\n\n* \
  \  [Lint Like It’s 2015](https://medium.com/@dan_abramov/lint-like-it-s-2015-6987d44c5b48)\
  \ - Dan Abramov 的这篇文章展示了如何让 ESLint 与 Sublime Text 良好地工作。\n\n*   [使用 ESLint 自动检测\
  \ JavaScript 问题](http://davidwalsh.name/eslint) - 关于该主题的一个非常好的教程。\n\n*   [理解使用 ESLint\
  \ 的真实优势](http://rangle.io/blog/understanding-the-real-advantages-of-using-eslint/)\
  \ - Evan Schultz 的文章深入探讨了细节。\n\n*   [eslint-plugin-smells](https://github.com/elijahmanor/eslint-plugin-smells)\
  \ - 由 Elijah Manor 开发的这个插件允许你针对各种 JavaScript 代码异味（smells）进行 lint。推荐使用。\n\n如果你只是想要一个起点，可以从\
  \ [eslint-config packages](https://www.npmjs.com/search?q=eslint-config) 中选择一个，或者使用\
  \ [standard](https://www.npmjs.com/package/standard) 风格。看起来，`standard` 在 [JSX 方面有一些问题](https://github.com/feross/standard/issues/138)，所以使用要小心。\n\
  \n### 11.5 Linting CSS\n\n[stylelint](http://stylelint.io/) 允许我们对 CSS 进行 lint。它可以通过\
  \ [postcss-loader](https://www.npmjs.com/package/postcss-loader) 与 Webpack 使用。\n\
  \n```\nnpm i stylelint postcss-loader --save-dev\n```\n\n接下来，我们需要将其与我们的配置集成：\n\n\
  **webpack.config.js**\n\n```javascript\n...\nvar stylelint = require('stylelint');\n\
  \n...\n\nvar common = {\n  ...\n  module: {\n    preLoaders: [\n      {\n      \
  \  test: /\\.css$/,\n        loaders: ['postcss'],\n        include: PATHS.app\n\
  \      },\n      ...\n    ],\n    ...\n  },\n  postcss: function () {\n    return\
  \ [stylelint({\n      rules: {\n        'color-hex-case': 'lower'\n      }\n   \
  \ })];\n  },\n  ...\n}\n```\n\n如果你定义了一个 CSS 规则，例如 `background-color: #EFEFEF;`，你应该会在终端看到一个警告。查看\
  \ stylelint 文档获取完整的规则列表。npm 列出了[可能的 stylelint 规则集](https://www.npmjs.com/search?q=stylelint-config)。你可以像这样将它们作为项目依赖消耗：\n\
  \n```javascript\nvar configSuitcss = require('stylelint-config-suitcss');\n\n...\n\
  \nstylelint(configSuitcss)\n```\n\n由于 stylelint 仍在开发中，尚未提供 CLI 工具。计划支持 `.stylelintrc`\
  \ 类型的功能。\n\n### 11.6 使用 JSCS 检查 JavaScript \n\n![JSCS](img/jscs.png)\n\n#### JSCS\n\
  \n特别是在团队环境中，如果一个人使用 Tab 而另一个人使用空格，会让人非常困扰。空格的使用也可能存在差异。有些人喜欢使用两个空格缩进，而另一些喜欢四个。简而言之，如果没有任何规范，代码会变得非常混乱。为了解决这个问题，JSCS\
  \ 允许你为项目定义一个风格指南。\n\n可以通过以下方式安装 JSCS：\n\n```\nnpm i jscs jscs-loader --save-dev\n\
  ```\n\n[jscs-loader](https://github.com/unindented/jscs-loader) 为该工具提供了 Webpack\
  \ 钩。集成方式与 ESLint 类似。你将定义一个包含风格指南规则的 `.jscsrc`，并使用如下配置：\n\n```javascript\nmodule:\
  \ {\n  preLoaders: [\n    {\n      test: /\\.jsx?$/,\n      loaders: ['eslint',\
  \ 'jscs'],\n      include: PATHS.app\n    }\n  ]\n}\n```\n\n这是一个示例配置：\n\n**.jscsrc**\n\
  \n```json\n{\n  \"esnext\": true,\n  \"preset\": \"google\",\n\n  \"fileExtensions\"\
  : [\".js\", \".jsx\"],\n\n  \"requireCurlyBraces\": true,\n  \"requireParenthesesAroundIIFE\"\
  : true,\n\n  \"maximumLineLength\": 120,\n  \"validateLineBreaks\": \"LF\",\n  \"\
  validateIndentation\": 2,\n\n  \"disallowKeywords\": [\"with\"],\n  \"disallowSpacesInsideObjectBrackets\"\
  : null,\n  \"disallowImplicitTypeConversion\": [\"string\"],\n\n  \"safeContextKeyword\"\
  : \"that\",\n\n  \"excludeFiles\": [\n    \"dist/**\",\n    \"node_modules/**\"\n\
  \  ]\n}\n```\n\nJSCS 支持通过 `jscsConfig` 字段基于 `package.json` 进行配置。\n\n### 11.7 EditorConfig\n\
  \n[EditorConfig](http://editorconfig.org/) 允许你在不同的 IDE 和编辑器之间保持一致的代码风格。有些编辑器内置了支持。对于其他编辑器，你必须安装单独插件。此外，你还需要这样设置一个\
  \ `.editorconfig` 文件：\n\n**.editorconfig**\n\n```ini\nroot = true\n\n# 整个项目的通用设置\n\
  [*]\nindent_style = space\nindent_size = 4\n\nend_of_line = lf\ncharset = utf-8\n\
  trim_trailing_whitespace = true\ninsert_final_newline = true\n\n# 特定格式覆盖\n[*.md]\n\
  trim_trailing_whitespace = false\n\n[/**/*.js]\nindent_style = space\nindent_size\
  \ = 2\n```\n\n### 11.8 总结\n\n在本章中，你学习了如何通过各种方式使用 Webpack 对代码进行 lint。这些技术从长期来看是有益的。你可以在问题变成事实之前修复它们。\n\
  \n## 12 发布包\n\n[npm](https://www.npmjs.com/) 是 Node.js 流行的原因之一。最终，你可能想要编写自己的包。发布一个包相对容易，尽管有很多细节需要注意。本章将介绍这些细节，以便你避免一些常见问题。\n\
  \n### 12.1 包的结构\n\n大多数的 npm 包都很小，只包含几个文件，例如：\n\n*   `index.js` - 对于小型项目，根目录下有代码就足够。对于较大的项目你可能希望进一步拆分。\n\
  \n*   `package.json` - JSON 格式的 npm 元数据\n\n*   `README.md` - README 是项目最重要的文档。它使用\
  \ Markdown 格式概述。简单项目的整个文档都可以放在这里。它会在 npm.com 的包页面显示。\n\n*   `LICENSE` - 你应该在项目中包含许可信息。你可以在\
  \ `package.json` 中引用它。\n\n在较大的项目中，你可能会发现以下内容：\n\n*   `CONTRIBUTING.md` - 给潜在贡献者的指南。代码应该如何开发等等。\n\
  \n*   `CHANGELOG.md` - 此文档描述了每个版本的重大更改。如果你进行了重大 API 更改，在这里涵盖它们是一个好主意。可以基于 Git 提交历史生成该文件。\n\
  \n*   `.travis.yml` - [Travis](https://travis-ci.org/) 是流行的持续集成平台，对开源项目免费。你可以使用它在多个系统上运行包的测试。当然还有其他方案，但\
  \ Travis 非常流行。\n\n*   `.gitignore` - Git 的忽略模式，即哪些文件不应该受版本控制。在这里忽略 npm 分发文件是有用的，可以避免它们弄乱你的仓库。\n\
  \n\n\n\n\n*   `.npmignore` - npm 的忽略模式。它描述了哪些文件不应该出现在你的发布版本中。一个很好的替代方案是使用 `package.json`\
  \ 中的 [files](https://docs.npmjs.com/files/package.json#files)字段。它允许你维护一个白列表，将其包含在发布版本中。\n\
  *   `.eslintignore` - ESLint 的忽略模式。同样，这是特定工具的。\n*   `.eslintrc` - 校验规则。你可以根据喜好使用\
  \ `.jshintrc` 等文件。\n*   `webpack.config.js` - 如果你使用的是简单的设置，你也可以将配置放在项目根目录下。\n\n\
  此外，你可能会有各种用于源码、测试、演示、文档等的目录。\n\n## 12.2 理解 package.json\n\n所有的包都带有一个 `package.json`\
  \ 文件，它描述了与它们相关的元数据。这包括关于作者、各种链接、依赖项等的信息。[官方文档](https://docs.npmjs.com/files/package.json)\
  \ 详细地涵盖了这些内容。\n\n我在下方注释了我的 [React 组件模版](https://github.com/survivejs/react-component-boilerplate)\
  \ 中 `package.json` 的部分：\n\n```\n{\n  /* 项目名称 */\n  \"name\": \"react-component-boilerplate\"\
  ,\n  /* 简要描述 */\n  \"description\": \"Boilerplate for React.js components\",\n \
  \ /* 作者 + 可选的邮箱 + 可选的网站 */\n  \"author\": \"Juho Vepsäläinen <email goes here> (site\
  \ goes here)\",\n  /* 包的版本 */\n  \"version\": \"0.0.0\",\n  /* `npm run <name>`\
  \ */\n  \"scripts\": {\n    \"start\": \"webpack-dev-server\",\n\n    \"test\":\
  \ \"karma start\",\n    \"test:tdd\": \"karma start --auto-watch --no-single-run\"\
  ,\n    \"test:lint\": \"eslint . --ext .js --ext .jsx\",\n\n    \"gh-pages\": \"\
  webpack\",\n    \"gh-pages:deploy\": \"gh-pages -d gh-pages\",\n    \"gh-pages:stats\"\
  : \"webpack --profile --json > stats.json\",\n\n    \"dist\": \"webpack\",\n   \
  \ \"dist:min\": \"webpack\",\n    \"dist:modules\": \"babel ./src --out-dir ./dist-modules\"\
  ,\n\n    \"pretest\": \"npm run test:lint\",\n    \"preversion\": \"npm run test\
  \ && npm run dist && npm run dist:min && git commit --allow-empty -am \"Update dist\\\
  \"\",\n    \"prepublish\": \"npm run dist:modules\",\n    \"postpublish\": \"npm\
  \ run gh-pages && npm run gh-pages:deploy\",\n    /* 如果你的库通过 Git 安装，你可能想对其进行转译 */\n\
  \    \"postinstall\": \"node lib/post_install.js\"\n  },\n  /* 终端入口点（即 <package\
  \ name>） */\n  /* 除非打算允许 CLI 使用，否则不要设置此项 */\n  \"bin\": \"./index.js\",\n  /* 入口（默认\
  \ index.js） */\n  \"main\": \"dist-modules\",\n  /* 包依赖 */\n  \"dependencies\":\
  \ {\n    \"react\": \"⁰.14.0\",\n    \"react-dom\": \"⁰.14.0\"\n  },\n  /* 包开发依赖\
  \ */\n  \"devDependencies\": {\n    \"babel\": \"⁶.3.17\",\n    ...\n    \"webpack\"\
  : \"¹.12.2\",\n    \"webpack-dev-server\": \"¹.12.0\",\n    \"webpack-merge\": \"\
  ⁰.7.0\"\n  },\n  /* 包同级依赖。消费者将修复精确版本。 */\n  /* 在 npm3 中，这些不会自动安装，由用户 */\n  /* 定义使用哪些版本。\
  \ */\n  \"peerDependencies\": {\n    \"lodash\": \">= 3.5.0 < 4.0.0\"\n  }\n  /*\
  \ 仓库、首页和问题跟踪器的链接 */\n  \"repository\": {\n    \"type\": \"git\",\n    \"url\": \"\
  https://github.com/bebraw/react-component-boilerplate.git\"\n  },\n  \"homepage\"\
  : \"https://bebraw.github.io/react-component-boilerplate/\",\n  \"bugs\": {\n  \
  \  \"url\": \"https://github.com/bebraw/react-component-boilerplate/issues\"\n \
  \ },\n  /* 与包相关的关键词。 */\n  /* 填好此项使包更容易被找到。 */\n  \"keywords\": [\n    \"react\"\
  ,\n    \"reactjs\",\n    \"boilerplate\"\n  ],\n  /* 使用什么许可证 */\n  \"license\":\
  \ \"MIT\"\n}\n```\n\n如你所见，`package.json` 可以包含很多信息。你可以在那里附加 npm 特有的元数据，这些数据可以被工具使用。由于可能会导致\
  \ `package.json` 膨肿，将元数据保留在独立的文件中可能更好。\n\n## 12.3 npm 工作流\n\n使用 npm 运行出奇地简单。要开始使用，你需要使用\
  \ [npm adduser](https://docs.npmjs.com/cli/adduser)（别名为 `npm login`）。它允许你设置账户。在此过程完成后，它将创建\
  \ `~/.npmrc` 并使用该数据进行身份验证。还有 [npm login]。\n\n### 发布包\n\n有时，你可能想发布一些初步的内容供他人测试。这里有一些特定的约定。例如，一个包可能有如下版本：\n\
  \n-   `1.0.0-alpha`\n-   `1.0.0-beta.1`\n-   `1.0.0-beta.2`\n-   `1.0.0-rc.1`\n\
  -   `1.0.0-rc.2`\n-   `1.0.0`\n\n在这种情况下，工作流是直接的：\n\n1. `npm version 1.0.0-alpha`\
  \ - 如前所述更新 `package.json`。\n2. `npm publish --tag alpha` - 在 `alpha` 标签下发布包。\n\n\
  为了消费该版本，用户必须使用 `npm i <package name>@alpha`。\n\n### 发布预发布版本\n\n有时，你可能想发布一些初步的内容供他人测试。有一些特定的约定。*alpha*、*beta*\
  \ 和 *rc*（发布候选）是常见的。例如，一个包可能有如下版本：\n\n-   `alpha`\n-   `beta`\n-   `rc`\n\n初始的 alpha\
  \ 版本将允许用户尝试后续内容并提供反馈。beta 版本被认为更稳定。发布候选（rc）接近正式发布，且不会引入任何功能。它们都是为了完善发布直到适用于通用消费。\n\
  \n### 提升版本\n\n为了提升版本，你需要以下命令之一：\n\n-   `npm version x.y.z` - 自定义。\n-   `npm version\
  \ major|minor|patch` - 让 npm 根据 SemVer 更新版本。\n-   `npm version premajor|preminor|prepatch|prerelease`\
  \ - 注意 `prerelease` 后缀示例：`2.1.2`。\n\n### 关于包命名\n\n在开始开发之前，花一点时间为你的包想一个好名字是个好主意。写了一个棒的包才发现名字被占用并不有趣。一个好的名字容易通过搜索引擎找到，最重要的是在\
  \ npm 上是可。\n\n从 npm 2.7.0 开始可以创建[作用域包](https://docs.npmjs.com/getting-started/scoped-packages)。它们遵循格式\
  \ `@username/project-name`。在命名项目时只需遵循该格式。\n\n### 处理 npm 分文件\n\n将 npm 特有的发布文件包含在版本控制中是不良好的做法。通常你会\
  \ `.gitignore` 它们。不过这些文件会被包含在上传到 npm 的版本中。这样做的好处是保持你的版本历史整洁。\n\n当你想要通过 Git 而不是 npm\
  \ 来消费你的包时（使用 `\"depName\": \"<github user>/<project>#<reference>\"`），这种方法就会出现问题。特别是当你尝试某些东西，或者需要修复某些问题以便目前工作时。\n\
  \n\n\n\n\n解决此问题的方法是设置一个 `postinstall` 脚本，在库不存在时为你的库生成一个本地的 npm 版本。可以通过如下的 `postinstall`\
  \ 脚本来实现：\n\n`package.json`\n\n```json\n{\n  ...\n  \"scripts\": {\n    ...\n   \
  \ \"postinstall\": \"node lib/post_install.js\"\n  },\n  \"devDependencies\": {\n\
  \    ...\n    /* 你应该通过 `npm i` 安装 sync-exec 获取最新版本 */\n    \"sync-exec\": \"⁰.6.2\"\
  \n  }\n}\n```\n\n此外，我们需要定义一个简单的脚本来为我们工作。它将检查包是否包含我们预期的目录，并根据结果采取操作。如果不存在，我们将生成它：\n\
  \n`lib/post_install.js`\n\n```javascript\n// adapted based on rackt/history (MIT)\n\
  // Node 0.10+\nvar execSync = require('child_process').execSync;\nvar stat = require('fs').stat;\n\
  \n// Node 0.10 check\nif (!execSync) {\n  execSync = require('sync-exec');\n}\n\n\
  function exec(command) {\n  execSync(command, {\n    stdio: [0, 1, 2]\n  });\n}\n\
  \nstat('dist-modules', function(error, stat) {\n  // Skip building on Travis\n \
  \ if (process.env.TRAVIS) {\n    return;\n  }\n\n  if (error || !stat.isDirectory())\
  \ {\n    exec('npm i babel-cli babel-preset-es2015 babel-preset-react');\n    exec('npm\
  \ run dist-modules');\n  }\n});\n```\n\n你可能需要调整脚本以适应你的具体用途，但它给了你基本的思路。\n\n### 遵守语义化版本\
  \ (SemVer)\n\n尽管发布新版本很容易，但遵守 SemVer 非常重要。简单来说，它规定在满足某些规则的情况下，你不应该破坏后兼容性。例如，如果你当前版本是\
  \ `0.1.4` 并且执行了破坏性更改，你应该升级到 `0.2.0` 并记录这些更改。你可以通过学习[在线工具](http://semver.npmjs.com/)\
  \ 及其行为来更好地理解 SemVer。\n\n### 版本范围\n\nnpm 支持多个版本范围。我在下方列出了常见的范围：\n\n*   `~` - 波号仅匹配补丁版本（patch\
  \ versions）。例如，`~1.2` 等于 `1.2.x`。\n*   `^` - 符号是你使用 `--save` 或 `--save-dev` 默认默认。它匹配次版本（minor\
  \ versions）。这意味着 `⁰.2.0` 等于 `0.2.x`。\n*   `*` - 星号匹配主版本（major releases）。这是范围中最危险的一个。轻率使用此符号很容易在未来破坏你的项目，我建议不要使用它。\n\
  *   `>= 1.3.0 < 2.0.0` - 版本之间的范围。如果你在使用 `peerDependencies`，这特别有用。\n\n你可以使用 `npm\
  \ config set save-prefix='^'` 设置默认范围，如果你倾向于使用符号之外的其他选项。或者，你也可以直接修改 `~/.npmrc`。特别是将默认设置为波号可能是一个好主意，可以帮助你避免一些依赖项问题。\n\
  \n### 12.4 库格式\n\n在我的模板代码中，我以各种格式输出我的 React 组件。我通过 Babel 处理我的组件代码，生成一个方便在 Node.js\
  \ 中消费的版本。这会将 ES6 和其他优秀特性转换为原生 Node.js 可以消费的格式。这允许用户在需要时引用整个库中的某些特定模块。\n\n此外，我还会生成所谓的*分发包*（distribution\
  \ bundles）：`.js` 和 `.min.js`。两者都有一个用于调试的源映射文件（`.map`）。这些包是可以独立被消费的，因为它们带有一个 [UMD](https://github.com/umdjs/umd)\
  \ 封装器。\n\nUMD 使得从各种环境（包括全局、AMD 和 CommonJS (Node.js 格式)）消费它们成为可能。你可以通过查看 *Webpack\
  \ Compared* 章节中的具体示例来重温记忆。\n\n使用 Webpack 生成上述包出奇地简单。下面的示例应该能给你基本的思路：\n\n`webpack.config.js`\n\
  \n```javascript\n...\n\nvar config = {\n  paths: {\n    dist: '...',\n    src: '...',\n\
  \  },\n  filename: 'demo',\n  library: 'Demo'\n};\n\nvar commonDist = {\n  devtool:\
  \ 'source-map',\n  output: {\n    path: config.paths.dist,\n    libraryTarget: 'umd',\n\
  \    library: config.library\n  },\n  entry: config.paths.src,\n  externals: {\n\
  \    react: 'react'\n    // 为 lodash 使用更复杂的映射。\n    // 我们需要根据环境\n    // 以不同的方式访问。\n\
  \    lodash: {\n      commonjs: 'lodash',\n      commonjs2: 'lodash',\n      amd:\
  \ '_',\n      root: '_'\n    }\n  },\n  module: {\n    loaders: [\n      {\n   \
  \     test: /\\.jsx?$/,\n        loaders: ['babel?cacheDirectory'],\n        include:\
  \ config.paths.src\n      }\n    ]\n  }\n};\n\nif(TARGET === 'dist') {\n  // ...\
  \ logic for dist\n}\n```\n\n### 12.5 npm 生命周期钩子 (Lifecycle Hooks)\n\nnpm 提供了许多非常有用的钩子。假设你正在编写某些兼容\
  \ ES5 的版本。由于我们希望避免每次发布新版本时直接运行命令，我们可以这样将其连接到 `prepublish`：\n\n```json\n\"scripts\"\
  : {\n  ...\n  \"prepublish\": \"npm test\"\n}\n```\n\n确保执行了 `npm i babel --save-dev`\
  \ 将工具包含在你的项目中。\n\n你可能不希望目录内容出现在你的 Git 仓库中。为了避免这种情况并保持 `git status` 清洁，请考虑如下 `.gitignore`：\n\
  \n```\ndist-modules/\n```\n\n除了 `prepublish`，npm 还提供了系列其他钩子。命名方式始终相同，并遵循 `pre<hook>`,\
  \ `<hook>`, `post<hook>` 模式，其中 `<hook>` 可以是 `publish`、`install`、`test`、`stop`、`start`、`restart`\
  \ 或 `version`。尽管 npm 会自动触发绑定到这些钩子的脚本，但你也可以通过 `npm run` 显式触发它们（例如 `npm run prepublish`）。\n\
  \n### 保持依赖更新\n\n维护 npm 包的一个重要部分是保持它们的依赖项更新。如何这样做很大程度上取决于你的包的成熟程度。理想情况下，你有一套覆盖所有功能的良好测试。如果没有，情况可能会变得棘手。更新依赖有几种方法：\n\
  \n*   你可以一次性更新所有依赖并尽听运气。诸如 [npm-check-updates](https://www.npmjs.com/package/npm-check-updates)\
  \ 等工具可以为你完成。\n*   安装某些特定依赖的最新版本，例如 `npm i lodash@* --save`。这是一种更受控的问题解决方法。\n*  \
  \ 通过直接修改 `package.json` 手动更新补丁版本信息。\n\n\n\n\n\n请记住，你的依赖可能会引入向后兼容的更改。记住 `SemVer`\
  \ 的工作原理并研究依赖的发布说明很有帮助。这些说明并不总是存在，因此你可能需要回溯项目的提交历史。有几个服务可以帮助你跟踪项目的依赖项：\n\n*   [David](https://david-dm.org/)\n\
  *   [versioneye](https://www.versioneye.com/)\n*   [Gemnasium](https://gemnasium.com)\n\
  \n这些服务提供了可以集成到你的项目 `README.md` 中的徽章。这些服务可能会就重要的更改向你发送电子邮件。它们还可以指出已修复可能的安全性问题。\n\n\
  为了测试你的项目，你可以考虑一些解决方案，例如 [Travis CI](https://travis-ci.org/) 或 [SauceLabs](https://saucelabs.com/)。[Coveralls](https://coveralls.io/)\
  \ 可以为你提供代码覆盖率信息以及可以包含在 `README` 中的徽章。\n\n这些服务非常有价值，因为它们允许你快速地针对各种平台测试你的更新。在你的系统上可以运行的东西在某些特定配置下可能无法运行。你希望尽快了解这些情况，以避免引入问题。\n\
  \n## 12.7 分享作者身份\n\n随着包的演进，你可能想要开始与其他人一起开发。你可以成为某些项目的新维护者，或者将接力棒交给别人。这些情况随着包的演进而发生。\n\
  \n`npm` 为这些目的提供了一些命令。它们都位于 `npm owner` 命名空间下。更具体地说，你将会在那里找到 `ls <package name>`、`add\
  \ <user> <package name>` 和 `rm <user> <package name>`（即 `npm owner ls`）。仅此而已。\n\n\
  请查看 [npm 文档](https://docs.npmjs.com/cli/owner) 获取关于该主题的最新信息。\n\n## 12.8 结论\n\n现在你应该对如何借助\
  \ Webpack 帮助编写 npm 包有了基本的了解。它减少了过程中的大量工作量。在开发时只需记住基本规则，并记得尊重 `SemVer`。\n\n## 13.\
  \ React 的样式处理\n\n传统上，网页被分为标记（HTML）、样式（CSS）和逻辑（JavaScript）。得益于 React 和类似的方法，我们开始质疑这种划分。我们可能仍然想以某种方式分离关注点。但这种划分可以在不同的轴上进行。\n\
  \n这种心态的转变导致了思考样式的新方法。在 React 中，我们仍在寻找最佳实践。然而，一些早期模式已经显现。因此，目前很难提供任何确定的建议。相反，我将介绍各种方法，以便你根据自己的具体需求做出决定。\n\
  \n### 13.1 老派样式处理\n\n老式的样式处理方法是到处散布一些 `ids` 和 `classes`，设置 CSS 规则，并尽听天。在 CSS 中，默认情况下一切都是全局的。嵌套定义（例如\
  \ `.main .sidebar .button`）为你的样式创建了隐式逻辑。这两个特性随着项目的项目的增长会导致大量的复杂性。在开始阶段，这种方法是可以接受的，但随着你的开发，你很可能想要迁移它。\n\
  \n#### 原生 CSS 的 Webpack 配置\n\n在 Webpack 中配置原生 CSS 很容易。考虑下面的示例：\n\n**webpack.config.js**\n\
  \n```\nvar common = {\n  ...\n  module: {\n    loaders: [\n      {\n        test:\
  \ /\\.css$/,\n        loaders: ['style', 'css'],\n        include: PATHS.style\n\
  \      }\n    ]\n  },\n  ...\n};\n```\n\n首先，[css-loader](https://www.npmjs.com/package/css-loader)\
  \ 会处理匹配文件中可能的 `@import` 和 `url()` 语句，并将它们视为普通的 `require`。这允许我们依赖许多其他 loader，例如 [file-loader](https://www.npmjs.com/package/file-loader)\
  \ 或 [url-loader](https://www.npmjs.com/package/url-loader)。\n\n`file-loader` 生成文件，而\
  \ `url-loader` 可以为小型资源创建内联数据 URL。这对于优化应用程序加载很有用。在提供略大负载的同时，避免了不必要的请求。如果你在样式定义中依赖于许多小资源，微小的改进也能产生巨大的收益。\n\
  \n最后，`style-loader` 接收 `css-loader` 的输出并将 CSS 注入到包中。正如我们早些在构建章节中看到的，可以使用 `ExtractTextPlugin`\
  \ 生成单独的 CSS 文件。\n\n### 13.2 CSS 方法论\n\n当你的应用程序开始扩展并添加新概念时会发生什么？宽泛的 CSS 选择器就像全局变量。如果你必须处理加载顺序，问题会变得糟糕。如果选择器最后平局，则最后一个声明获胜，除非某处有\
  \ `!important`。它会迅速变得非常复杂。\n\n我们可以通过使选择器更具体、使用一些命名规则等来对抗这个问题。但这只是在推迟不可避免的结果。由于人们与这个问题斗争了很久，各种方法应运而生。\n\
  \n特别是 [OOCSS](http://oocss.org/)（面向对象的 CSS）、[SMACSS](https://smacss.com/)（CSS 可扩展模块化方法）和\
  \ [BEM](https://en.bem.info/method/)（块元素修饰符）广为人知。它们都以自己的方式解决了原生 CSS 的问题。\n\n####\
  \ BEM\n\nBEM 源于 Yandex。BEM 的目标是允许可重用的组件和代码共享。网站（如 [Get BEM](http://getbem.com/)）可以帮助更详细地理解这种方法论。\n\
  \n为了重用组件，维护 BEM 所需的长类名可能是很辛苦的。因此出现了一些库来让这变得更容易。对于 React，这些示例包括 [react-bem-helper](https://www.npmjs.com/package/react-bem-helper)[react-bem-render](https://www.npmjs.com/package/react-bem-render)\
  \ 和 [bem-react](https://www.npmjs.com/package/bem-react)。\n\n注意 [postcss-bem-linter](https://www.npmjs.com/package/postcss-bem-linter)\
  \ 允许你检查 CSS 是否符合 BEM。\n\n#### OOCSS 和 SMACSS\n\n就像 BEM 一样，OOCSS 和 SMACSS 都有自己的规范和方法论。目前还没有针对\
  \ React 的 OOCSS 和 SMACSS 辅助库。\n\n#### 优缺点\n\n采用方法论的主要优点是它为你的项目带来了结构。与其编写临时规则并希望一切顺利，你将有一个更强大的支撑。这些方法论解决了一些基本问题，并有助于长期开发良好的软件。\n\
  \n缺点是，一旦你采用了其中一种，你基本上就被困于了，迁移将非常。但如果你愿意投入，就有收益可言。\n\n方法论还会带来它们自己的特性（例如复杂的命名方案）。这可能会让某些事情变得比实际需要的更复杂。它们并没有解决任何更深层次的底层问题。它们只是针对这些问题提供了补丁。\n\
  \n有各种更深入的方法可以解决其中的一些根本问题。尽管如此，这并不是此消彼的关系。即使使用某些 CSS 处理器，你也可以采用方法论。\n\n### 13.3 Less,\
  \ Sass, Stylus, PostCSS, cssnext\n\n![CSS 处理器](img/css.png)\n\nCSS 处理器\n\n原生 CSS\
  \ 缺少一些可以让维护工作更容易的功能。考虑一些基础功能，如变量、嵌套、混合、数学运算或颜色函数。如果能够忘记浏览器特定的前缀就更好了。这些小事累积起来很快，并让编写原生\
  \ CSS 变得令人厌烦。\n\n\n\n\n\n有时，你会看到 `preprocessor`（预处理器）或 `postprocessor`（后处理器）这些术语。[Stefan\
  \ Baumgartner](https://medium.com/@ddprrt/deconfusing-pre-and-post-processing-d68e3bd078a3)\
  \ 将这些工具简单地称为 `CSS processors`。上面根据 Stefan 的工作改编的直击主题。这些工具在编写和优化层面都可以运行。我们所说的编写是指让编写\
  \ CSS 更容易的功能。优化功能则基于原生 CSS 运行，并转换为更适合浏览器消费的格式。\n\n有趣的是，你实际上可能想要使用多个 CSS 处理器。Stefan\
  \ 的图片说明了你可以如何使用 `Sass` 编写代码，同时从通过 `PostCSS` 处理中获益。例如，它可以对你的 CSS 代码进行 `autoprefix`（自动前缀），这样你就不再需要担心为浏览器添加前缀了。\n\
  \n## Less\n\n![Less](img/less.png)\n\n[Less](http://lesscss.org/) 是一个功能强大的 CSS 处理器。在\
  \ Webpack 中使用 `Less` 并不费力。[`less-loader`](https://www.npmjs.com/package/less-loader)\
  \ 处理了大部分性工作：\n\n```\n{\n  test: /\\.less$/,\n  loaders: ['style', 'css', 'less'],\n\
  \  include: PATHS.style\n}\n```\n\n同时也支持 `Less` 插件、sourcemaps 等。要了解这些是如何运作的，你应该查看项目本身。\n\
  \n## Sass\n\n![Sass](img/sass.png)\n\n[Sass](http://sass-lang.com/) 是 `Less` 的流行替代方案。你应该配合\
  \ [`sass-loader`](https://www.npmjs.com/package/sass-loader) 使用它。记得在项目中安装 `node-sass`，因为加载器对该包有同级依赖。Webpack\
  \ 不需要复杂的配置：\n\n```javascript\n{\n  test: /\\.scss$/,\n  loaders: ['style', 'css',\
  \ 'sass'],\n  include: PATHS.style\n}\n```\n\n查看 loader 以获取更高级的用法。\n\n## Stylus\n\
  \n![Stylus](img/stylus.png)\n\n[Stylus](https://learnboost.github.io/stylus/) 是一种受\
  \ Python 启发的编写 CSS 的方式。除了提供基于缩进语法外，它还是一个全功能的处理器。在使用 Webpack 时，你可以使用 [`stylus-loader`](https://www.npmjs.com/package/stylus-loader)\
  \ 在项目中使用 Stylus`。配置如下：\n\n```javascript\n{\n  test: /\\.styl$/,\n  loaders: ['style',\
  \ 'css', 'stylus'],\n  include: PATHS.style\n}\n```\n\n你还可以通过设置 `stylus.use: [plugin()]`\
  \ 与其配合 `Stylus` 插件。查看 loader 以获取更多信息。\n\n## PostCSS\n\n[PostCSS](https://github.com/postcss/postcss)\
  \ 允许你通过 JavaScript 插件对 CSS 进行转换。你甚至可以找到提供类似 `Sass` 特性的插件。`PostCSS` 可以被视为样式领域的 Babel。可以通过如下\
  \ Webpack 配合 [`postcss-loader`](https://www.npmjs.com/package/postcss-loader) 使用它：\n\
  \n```javascript\nvar autoprefixer = require('autoprefixer');\nvar precss = require('precss');\n\
  \nmodule.exports = {\n  module: {\n    loaders: [\n      {\n        test: /\\.css$/,\n\
  \        loaders: ['style', 'css', 'postcss'],\n        include: PATHS.style\n \
  \     }\n    ]\n  },\n  // PostCSS 插件在这里\n  postcss: function () {\n      return\
  \ [autoprefixer, precss];\n  }\n};\n```\n\n## cssnext\n\n![cssnext](img/cssnext.jpg)\n\
  \n[cssnext](https://cssnext.github.io/) 是一个 `PostCSS` 插件，允许我们现在体验未来。虽然有一些限制，但可能值得一试。在\
  \ Webpack 中，只需安装 [`cssnext-loader`](https://www.npmjs.com/package/cssnext-loader)\
  \ 并将其附加到你的 CSS 配置中。在我们的情况下，你将得到如下：\n\n```javascript\n{\n  test: /\\.css$/,\n  loaders:\
  \ ['style', 'css', 'cssnext'],\n  include: PATHS.style\n}\n```\n\n或者，如果你需要更多控制，可以通过插件的形式通过\
  \ `postcss-loader` 消费它。\n\n`PostCSS` 和 `cssnext` 的优势在于你实际上是在为未来编写代码。随着浏览器的改进和标准的采用，你不需要担心迁移问题。\n\
  \n## 优缺点\n\n与原生 CSS 相比，处理器带来了很多便利。它们处理某些烦人的问题（例如 `autoprefixing`），同时提高了你的生产力。`PostCSS`\
  \ 从定义上来说更细粒，允许你只使用你想要的功能。诸如 `Less` 或 `Sass` 等处理器则更全面。这些方法可以结合使用，例如，你可以用 `Sass` 编写样式，然后根据需要对其应用一些\
  \ `PostCSS` 插件。\n\n在我们的项目中，即使我们没有对 CSS 做任何更改，也可以从 `cssnext` 中获益。得于 `autoprefixing`，我们车道的圆角即使在旧浏览器中也能良好显示。此外，得于变量，我们可以对样式进行参数化。\n\
  \n### 13.4 基于 React 的方法\n\n通过 React，我们有一些额外的替代方案。如果我们一直以来思考样式的方式是错误的呢？CSS 是强大的，但如果没有规范，它就会变成难以维护的混乱。CSS\
  \ 是强大的，但如果没有规范，它就会变成难以维护的混乱。CSS 是强大的，但如果没有规范，它就会变成难以维护的混乱。CSS 是强大的，但如果没有规范，它就会变成难以维护的混乱。CSS\
  \ 是强大的，但如果没有规范，它就会变成难以维护的混乱。CSS 是强大的，但如果没有规范，它就会变成难以维护的混乱。CSS 是强大的，但如果没有规范，它就会变成难以维护的混乱。CSS\
  \ 是强大的，但如果没有规范，它就会变成难以维护的混乱。CSS 是强大的，但如果没有规范，它就会变成难以维护的混乱。\n\n#### 内联样式的救星\n\nReact\
  \ 通过内联样式解决了这一问题。放弃内联样式是使用独立文件的主要原因之一。现在我们回到了：\n\n```javascript\nrender(props, context)\
  \ {\n  const notes = this.props.notes;\n\n  return <ul className='notes'>{notes.map(this.renderNote)}</ul>\n\
  }\n```\n\n配合 CSS，我们可以像这样：\n\n```javascript\nrender(props, context) {\n  const notes\
  \ = this.props.notes;\n  const style = {\n    margin: '0.5em',\n    paddingLeft:\
  \ 0,\n    listStyle: 'none'\n  };\n\n  return <ul style={style}>{notes.map(this.renderNote)}</ul>\n\
  }\n```\n\n\n\n\n\n```\nconst styles = {\n  button: {\n    padding: '1em',\n\n  \
  \  ':hover': {\n      border: '1px solid black'\n    },\n\n    '@media (max-width:\
  \ 200px)': {\n      width: '100%',\n\n      ':hover': {\n        background: 'white',\n\
  \      }\n    }\n  },\n  primary: {\n    background: 'green'\n  },\n  warning: {\n\
  \    background: 'yellow'\n  },\n};\n\n...\n\n<button style={[styles.button, styles.primary]}>Confirm</button>\n\
  ```\n\n为了让 `style` 属性生效，你需要使用 `@Radium` 装饰器来标记你的类。\n\n### React Style\n\n[React\
  \ Style](https://github.com/js-next/react-style) 使用了与 React Native [StyleSheet](https://facebook.github.io/react-native/docs/stylesheet.html#content)\
  \ 相同的语法。它通过引入用于片段（fragments）的额外键扩展了基础定义。\n\n```\nimport StyleSheet from 'react-style';\n\
  \nconst styles = StyleSheet.create({\n  primary: {\n    background: 'green'\n  },\n\
  \  warning: {\n    background: 'yellow'\n  },\n  button: {\n    padding: '1em'\n\
  \  },\n  // media queries\n  '@media (max-width: 200px)': {\n    button: {\n   \
  \   width: '100%'\n    }\n  }\n});\n\n...\n\n<button styles={[styles.button, styles.primary]}>Confirm</button>\n\
  ```\n\n如你所见，我们可以使用单个片段来获得与 Radium 修饰器相同的效果。此外，它支持媒体查询。React Style 期望你通过 JavaScript\
  \ 操作浏览器状态（例如 `:hover`）。此外，CSS 动画将无法工作。相反，最好使用其他解决方案。\n\n有趣的是，有一个[针对 Webpack 的 React\
  \ Style 插件](https://github.com/js-next/react-style-webpack-plugin)。它可以将 CSS 声明提取到单独的包中。现在我们更接近熟悉的领域了，但没有了层级联（cascades）。我们还在组件级别上拥有自己的样式声明。\n\
  \n### JSS\n\n[JSS](https://github.com/jsstyles/jss) 是一个 JSON 到 StyleSheet 的编译器。使用\
  \ JSON 结构来表示样式非常方便，因为它为我们提供了易于管理的命名空间。此外，可以对 JSON 进行转换以获得某些功能，例如自动前缀处理。JSS 专门为此提供了一个插件接口。\n\
  \n可以通过 [react-jss](https://www.npmjs.com/package/react-jss) 在 React 中使用 JSS。还有一个针对\
  \ Webpack 的实验性 [jss-loader](https://www.npmjs.com/package/jss-loader)。你可以像这样通过 `react-jss`\
  \ 使用 JSS：\n\n```\n...\nimport classNames from 'classnames';\nimport useSheet from\
  \ 'react-jss';\n\nconst styles = {\n  button: {\n    padding: '1em'\n  },\n  'media\
  \ (max-width: 200px)': {\n    button: {\n      width: '100%'\n    }\n  },\n  primary:\
  \ {\n    background: 'green'\n  },\n  warning: {\n    background: 'yellow'\n  }\n\
  };\n\n@useSheet(styles)\nexport default class ConfirmButton extends React.Component\
  \ {\n  render() {\n    const {classes} = this.props.sheet;\n\n    return <button\n\
  \      className={classNames(classes.button, classes.primary)}>\n        Confirm\n\
  \      </button>;\n  }\n}\n```\n\n该方法支持伪选择器，也就是说你可以在定义内部定义选择器，例如 `&:hover`，它会直接生效。\n\
  \n### React Inline\n\n[React Inline](https://github.com/martinandert/react-inline)\
  \ 是 StyleSheet 的一种有趣变体。它根据使用它的元素的 `className` 属性生成 CSS。上面的示例可以这样适配到 React Inline：\n\
  \n```\nimport cx from 'classnames';\n...\n\nclass ConfirmButton extends React.Component\
  \ {\n  render() {\n    const {className} = this.props;\n    const classes = cx(styles.button,\
  \ styles.primary, className);\n\n    return <button className={classes}>Confirm</button>;\n\
  \  }\n}\n```\n\n与 React Style 不同，该方法支持浏览器状态（例如 `:hover`）。遗憾的是，它依赖于自己的自定义工具来生成所需的\
  \ React 代码和 CSS。在本文写作时，还没有可用的 Webpack 加载器。\n\n### jsxstyle\n\nPete Hunt 的 [jsxstyle](https://github.com/petehunt/jsxstyle)\
  \ 旨在缓解 React Style 方法的某些问题。正如你在之前的示例中看到的，我们仍然有与组件标记分离的样式定义。jsxstyle 合并了这两个概念。考虑以下示例：\n\
  \n```\n// PrimaryButton 组件\n<button\n  padding='1em'\n  background='green'\n>Confirm</button>\n\
  ```\n\n该方法仍仍处于早期阶段。例如，它缺少对媒体查询的支持。你无法像上面那样定义修饰器，而是将定义更多的组件来支持你的用例。\n\n就像 React Style\
  \ 一样，jsxstyle 自带了一个 Webpack 加载器，可以将 CSS 提取到单独的文件中。\n\n### 13.5 CSS Modules\n\n似乎\
  \ React 的样式选项还不够多，但还有一个值得提的。[CSS Modules](https://github.com/css-modules/) 从 CSS\
  \ 默认应该是局部的假设出发。\n\n### 13.6 结论\n\n尽管 React 的样式选项已经足够多，但仍然值得关注。你可以通过 Webpack 尝试各种方案，从原生\
  \ CSS 到更复杂的配置。React 特定的工具甚至自带了加载器，这使得尝试替代方案变得简单。\n\n基于 React 的样式方法允许我们将样式推组件级别。这与将\
  \ CSS 分离的传统方法形成了鲜明对比。处理组件特定的逻辑变得更容易。你会失去一些 CSS 提供的功能。作为回报，你获得了一个更容易理解、更难破坏的东西。\n\
  \nCSS Modules 在传统方法和 React 特定方法之间取得了平衡。尽管它是一个新事物，但它显示出了巨大的潜力。它是对常用方法的一种很好的改进。\n\n\
  # 附录\n\n由于并不是所有讨论的内容都能放入书中，我将相关材料汇成了简短的附录。这些附录支持正文并更详细地解释了某些主题，例如语言特性。最后还有一些故障提示。\n\
  \n## React 项目结构\n\nReact 不强制执行任何特定的项目结构。这样做的好处是它允许你根据自己的需求构建结构。\n\n\n\n\n\n# 按概念划分目录\n\
  \n我们的 Kanban 应用采用了扁平的结构：\n\n```\n├── actions\n│   ├── LaneActions.js\n│   └── NoteActions.js\n\
  ├── components\n│   ├── App.jsx\n│   ├── Editable.jsx\n│   ├── Lane.jsx\n│   ├──\
  \ Lanes.jsx\n│   ├── Note.jsx\n│   └── Notes.jsx\n├── constants\n│   └── itemTypes.js\n\
  ├── index.jsx\n├── libs\n│   ├── alt.js\n│   ├── persist.js\n│   └── storage.js\n\
  ├── main.css\n└── stores\n    ├── LaneStore.js\n    └── NoteStore.js\n```\n\n这对于目前的目的已经足够了，但还有一些有趣的替代方案：\n\
  \n- 每个概念一个文件 - 非常适合小型原型。随着你的应用程序变得复杂，你可以对其进行拆分。\n- 按组件划分目录 - 可以将组件放入它们自己的目录中。虽然这种方法更重，但正如我们很快将会看到的，它有一些有趣的优点。\n\
  - 按视图划分目录 - 当你想在应用程序中引入路由时，这种方法就变得相关了。\n\n还有其他替代方案，但这些涵盖了一些常见的情况。可以根据应用程序的需求随时进行调整。\n\
  \n# 按组件划分目录\n\n如果我们将组件拆分到它们自己的目录中，结果可能是这样的：\n\n```\n├── actions\n│   ├── LaneActions.js\n\
  │   └── NoteActions.js\n├── components\n│   ├── App\n│   │   ├── App.jsx\n│   │\
  \   ├── app.css\n│   │   ├── app_test.jsx\n│   │   └── index.js\n│   ├── Editable\n\
  │   │   ├── Editable.jsx\n│   │   ├── editable.css\n│   │   ├── editable_test.jsx\n\
  │   │   └── index.js\n...\n│   └── index.js\n├── constants\n│   └── itemTypes.js\n\
  ├── index.jsx\n├── libs\n│   ├── alt.js\n│   ├── persist.js\n│   └── storage.js\n\
  ├── main.css\n└── stores\n    ├── LaneStore.js\n    └── NoteStore.js\n```\n\n与我们目前的解决方案相比，这种方法会更重。`index.js`\
  \ 文件的作用是为组件提供方便的入口。尽管它们增加了代码量，但它们简化了导入。\n\n不过，这种方法也有一些有趣的优点：\n\n- 我们可以利用技术（如 `CSS\
  \ Modules`）为每个组件单独设置样式。\n- 鉴于每个组件现在都是一个独立的“包”，从项目中提取它们将变得更简单。你可以将通用组件推到其他地方，并在多个应用程序中消费。\n\
  - 我们可以在组件层级定义单元测试。这种方法鼓励你进行测试。我们仍然可以在应用程序的根级别编写更高层的测试，就像之前一样。\n\n尝试将 actions 和 stores\
  \ 也推到 `components` 中可能很有趣。或者它们也可以遵循类似的目录方案。这样做的好处是它允许你以类似的方式定义单元测试。\n\n当你想要向应用程序中添加多个视图时，这种设置是不够的。需要其他方式来支持。\n\
  \n# 按视图划分目录\n\n多个视图带来了自身的挑战。首先，你需要定义一个路由方案。[react-router](https://github.com/rackt/react-router)\
  \ 是此目的的一个流行替代方案。除了路由方案外，你还需要定义在每个视图上显示什么。你可以为应用程序的首页、注册、Kanban 面板等创建单独的视图，匹配每个路由。\n\
  \n这些需求意味着需要向结构中引入新概念。处理路由的一种方法将其推送到一个 `Routes` 组件中，该组件根据当前路由协调在任何时刻显示哪个视图。我们不再使用\
  \ `App`，而是直接使用多个视图。一个可能的结构如下：\n\n```\n├── components\n│   ├── Note\n│   │   ├──\
  \ Note.jsx\n│   │   ├── index.js\n│   │   ├── note.css\n│   │   └── note_test.jsx\n\
  │   ├── Routes\n│   │   ├── Routes.jsx\n│   │   ├── index.js\n│   │   └── routes_test.jsx\n\
  │   └── index.js\n...\n├── index.jsx\n├── main.css\n└── views\n    ├── Home\n  \
  \  │   ├── Home.jsx\n    │   ├── home.css\n    │   ├── home_test.jsx\n    │   └──\
  \ index.js\n    ├── Register\n    │   ├── Register.jsx\n    │   ├── index.js\n \
  \   │   ├── register.css\n    │   └── register_test.jsx\n    └── index.js\n```\n\
  \n这个想法与之前相同。只是这一次我们有更多部分需要协调。应用程序从 `index.jsx` 开始，它将触发 `Routes`，而 `Routes` 反而选择某些视图进行显示。之后就是我们熟悉的流程了。\n\
  \n这种结构可以进一步扩展，但它也有局限性。一旦你的项目开始增长，你可能想向其引入新概念。在视图和组件之间引入诸如“功能 (feature)”这样的概念可能是自然的。\n\
  \n例如，你可能有一个高级的 `LoginModal`，当用户会话超时时它会显示在某些视图上。它由低级组件组成。再次，当你发现有重用潜力时，可以将常用功能从项目本身提取出来放入它们自己的包中。\n\
  \n# 结论\n\n使用 React 构建项目结构没有单一的正确方法。\n\n## 语言特性\n\nES6 引入了正式的模块声明。早些，这是即时的，我们使用如\
  \ AMD 或 CommonJS 等格式。请参阅 *Webpack* 章节。两种格式仍在在使用，但采用标准总是更好的。\n\n### `import` 和 `export`\
  \ 导出单个\n\n为了给出一个通过模块直接导出的示例，考虑以下内容：\n\n**persist.js**\n```\nimport makeFinalStore\
  \ from 'alt-utils/lib/makeFinalStore';\n\nexport default function(alt, storage,\
  \ storeName) {\n  ...\n}\n```\n\n**index.js**\n```\nimport persist from './persist';\n\
  \n...\n```\n\n### `import` 和 `export` 导出多个\n\n有时将模块作为函数的命名空间很有用：\n\n**math.js**\n\
  ```javascript\nexport function add(a, b) {\n  return a + b;\n}\n\nexport function\
  \ multiply(a, b) {\n  return a * b;\n}\n```\n\n或者我们可以以这种形式编写模块：\n\n**math.js**\n\
  ```javascript\nconst add = (a, b) => a + b;\nconst multiple = (a, b) => a * b;\n\
  \nexport {add, multiple};\n\n// 等同于\n//export {add: add, multiple: multiple};\n\
  ```\n\n这种定义可以通过如下导入进行消费：\n\n**index.js**\n```javascript\nimport {add} from './math';\n\
  \n// 或者我们可以将数学方法绑定到键上\n// import * as math from './math';\n// math.add, math.multiply,\
  \ ...\n```\n\n### 导入别名\n\n有时为导入设置别名会很有用。例如：\n\n```javascript\nimport {actions as\
  \ TodoActions} from '../actions/todo'\n```\n\n`as` 允许你避免命名冲突。\n\n### Webpack `resolve.alias`\n\
  \n\n\n\n打包工具（如 `Webpack`）可以提供此之外的一些功能。例如，你可以为某些模块目录定义 `resolve.alias`。这允许你无论在何处导入都使用导入语句，例如\
  \ `import persist from 'libs/persist';`。一个简单的 `resolve.alias` 看起来如下：\n\n```\n...\n\
  resolve: {\n  alias: {\n    libs: path.join(__dirname, 'libs')\n  }\n}\n```\n\n\
  官方文档更详细地描述了[可能的变体](https://webpack.github.io/docs/configuration.html#resolve-alias)。\n\
  \n### 类 (Classes)\n\n与其他许多语言不同，JavaScript 使用的是基于原型的继承，而不是基于类的继承。这两种方法都各有优劣。事实上，你可以通过基于原型的模型来模拟基于类的模型。ES6\
  \ 类本质上是在 JavaScript 基础机制之上提供的语法糖。在内部，它仍然使用旧的系统，只是对程序员来说看起来略有不同。\n\n如今，`React` 支持基于类的组件定义。并不是所有人都认为这是一件好事。尽管如此，只要你不滥用它，这种定义可以非常整洁。为了给你一个简单的例子，考虑下面的代码：\n\
  \n```javascript\nimport React from 'react';\n\nexport default class App extends\
  \ React.Component {\n  constructor(props) {\n    super(props);\n\n    // 这是 React\
  \ 机制之外的普通属性。\n    // 如果你不需要在它改变时触发 render()，\n    // 这样做是可以行的。\n    this.privateProperty\
  \ = 'private';\n\n    // React 特有的状态。通过 `this.setState` 修改它。\n    // 这最终会调用 `render()`。\n\
  \    this.state = {\n      name: 'Class demo'\n    };\n  }\n  render() {\n    //\
  \ 以某种方式使用这些属性。\n    const privateProperty = this.privateProperty;\n    const name\
  \ = this.state.name\n    const notes = this.props.notes;\n\n    ...\n  }\n}\n```\n\
  \n基于类的方法最大的优势可能是它减少了一些复杂性，特别是涉及到 `React` 生命周期钩子时。需要注意的是，类方法默认不会被绑定！这就是为什么书中依赖于一种被称为“属性初始化”（property\
  \ initializers）的实验性特性。\n\n### 类与模块 (Classes and Modules)\n\n如上所述，ES6 模块允许 `export`\
  \ 和 `import` 单个或多个对象、函数，甚至类。在后者中，你可以使用 `export default class` 导出一个匿名类，或者使用 `export\
  \ class className` 从同一个模块中导出多个类。\n\n要导出和导入单个类，你可以使用 `export default class` 导出匿名类，并在导入时按你喜欢的名称进行重命名：\n\
  \n**Note.jsx**\n\n```javascript\nexport default class extends React.Component {\
  \ ... };\n```\n\n**Notes.jsx**\n\n```javascript\nimport Note from './Note.jsx';\n\
  ...\n```\n\n或者使用 `export class className` 从单个模块中导出多个命名类：\n\n**Components.jsx**\n\
  \n```javascript\nexport class Note extends React.Component { ... };\n\nexport class\
  \ Notes extends React.Component { ... };\n```\n\n**App.jsx**\n\n```javascript\n\
  import Notes from './Components.jsx';\nimport Note from './Components.jsx';\n\n\
  ...\n```\n\n建议将你的类拆分在不同的模块中。\n\n### 类属性与属性初始化 (Class Properties and Property Initializers)\n\
  \nES6 类默认不会绑定它们的方法。这有时会产生问题，因为你可能仍然想要访问实例属性。被称为[类属性和属性初始化](https://github.com/jeffmo/es-class-static-properties-and-fields)的实验性特性解决了这个问题。如果没有它们，我们可能会写出这样的代码：\n\
  \n```javascript\nimport React from 'react';\n\nclass App extends React.Component\
  \ {\n  constructor(props) {\n    super(props);\n\n    this.renderNote = this.renderNote.bind(this);\n\
  \  }\n  render() {\n    // 在此处以某种方式使用 `renderNote`。\n    ...\n\n    return this.renderNote();\n\
  \  }\n  renderNote() {\n    // ...\n  }\n}\n```\n（注：由于提供的原始文本包含大量重复和乱码片段，以上翻译已基于核心逻辑进行了清理和整理。）\n\
  \n\n\n在历史上，处理函数参数的方法相当局限。虽然有各种黑科技方法，例如 `values = values || [];`，但它们并不特别优雅，而且容易出错。例如，使用\
  \ `||` 可能会导致与 0 产生的问题。ES6 通过引入默认参数解决了这个问题。现在我们可以简单地写成 `function map(cb, values=[])`。\n\
  \n这不止于此，默认值甚至可以相互依赖。你还可以通过 `function map(cb, values...)` 传递任意数量的参数。在这种情况下，你通过 `map(a\
  \ => a * 2, 1, 2, 3, 4)` 来调用函数。对于 `map` 来说，这个 API 可能并不完美，但在某些其他场景下它可能更有意义。\n\n还有很方便的方法可以从传递的对象中提取值。这在使用函数语法定义的\
  \ React 组件中非常有用：\n\n```javascript\nexport default ({name}) => {\n  // ES6 字符串插值。注意反引号！\n\
  \  return <div>{`Hello ${name}!`}</div>;\n};\n```\n\n## 字符串插值\n\n早早，，在 JavaScript\
  \ 中处理字符串相当痛苦。通常你最终只能使用类似 `'Hello' + name + '!'` 这样的语法。为了这个目的重载 `+` 可能并不是最聪明的举措，因为它可能由于类型转换导致奇怪的行为。例如，`0\
  \ + ' world` 会产生字符串 `0 world`。\n\n除了更清晰之外，ES6 风格的字符串插值还为我们提供了多行字符串。这是旧语法不支持。考虑下面的示例：\n\
  \n```javascript\nconst hello = `Hello ${name}!`;\nconst multiline = `\nmultiple\n\
  lines of\nawesomeness\n`;\n```\n\n反引号语法可能需要一段时间才能习惯适应，但它非常强大且更不容易出错。\n\n## 解构\n\n\
  那个 `...` 与解构的想法有关。例如，`const {lane, ...props} = this.props;` 会从 `this.props` 中提取出\
  \ `lane`，而对象的其余部分将进入 `props`。这种基于对象的语法仍然是实验性阶段。ES6 规定了官方方法来对数组执行相同的操作：\n\n```javascript\n\
  const [lane, ...rest] = ['foo', 'bar', 'baz'];\n\nconsole.log(lane, rest); // 'foo',\
  \ ['bar', 'baz']\n```\n\n展开运算符（`...`）对于合并非常有用。你在 Redux 示例中经常看到这种语法。它们依赖于实验[对象剩余/展开语法](https://github.com/sebmarkbage/ecmascript-rest-spread)：\n\
  \n```javascript\n[...state, action.lane];\n\n// 这等于\nstate.concat([action.lane])\n\
  ```\n\n同样的思想适用于 React 组件：\n\n```javascript\n...\n\nrender() {\n  const {value, onEdit,\
  \ ...props} = this.props;\n\n  return <div {...props}>Spread demo</div>;\n}\n\n\
  ...\n```\n\n## 对象简写\n\n为了让处理对象变得更方便，ES6 专门为此提供了各种功能。援引 [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Object_initializer)，考虑下面的示例：\n\
  \n```javascript\nconst a = 'demo';\nconst shorthand = {a}; // 等同于 {a: a}\n\n// 简写方法\n\
  const o = {\n  get property() {},\n  set property(value) {},\n  demo() {}\n};\n\n\
  // 计算属性名\nconst computed = {\n  [a]: 'testing' // demo -> testing\n};\n```\n\n##\
  \ `const`, `let`, `var`\n\n在 JavaScript 中，变量默认是全局的。`var` 将它们绑定在`函数级`上。这与许多实现`块级`绑定的其他语言形成对比。ES6\
  \ 通过 `let` 引入了块级绑定。\n\n还有对 `const` 的支持，它保证了变量本身的引用不能改变。然而，这并不意味着你不能修改变量的内容。所以如果你指向一个对象，你仍然允许对其进行调整！\n\
  \n我倾向于尽可能默认使用 `const`。如果我需要某些可变内容，`let` 就足够。现在很难再找到 `var` 的任何良好用处了，因为 `const` 和\
  \ `let` 以更易理解的方式涵盖了需求。事实上，除了本附录外，书中的所有代码都依赖于 `const`。这足以说明你使用它可以走多远。\n\n## 装饰器 (Decorators)\n\
  \n由于装饰器仍然是一个实验性特性，并且关于它们有很多需要介绍，因此有一个整个附录专门介绍该主题。阅读 *Understanding Decorators* 以获取更多信息。\n\
  \n## 结论\n\nES6 以及即将推出的规范远多于此。如果你想更深入地理解规范，[ES6 Katas](http://es6katas.org/) 是学习更多内容的良好起点。只要对基础有一个良好的了解，就能带你走很远。\n\
  \n## 理解装饰器\n\n如果你以前用过 Java 或 Python 等语言，你可能熟悉这个想法。装饰器是语法糖，允许我们包装和注解类和函数。在他们的[当前提案](https://github.com/wycats/javascript-decorators)\
  \ (阶段 1) 中，仅支持类和方法级别的包装。函数以后可能会被支持。\n\n在 Babel 6 中，你可以通过 [babel-plugin-syntax-decorators](https://www.npmjs.com/package/babel-plugin-syntax-decorators)\
  \ 和 [babel-plugin-transform-decorators-legacy](https://www.npmjs.com/package/babel-plugin-transform-decorators-legacy)\
  \ 启用这种行为。前者提供了语法级支持，而后者提供了我们要讨论的行为。\n\n装饰器的最大好处是它们允许我们将行为封装成简单的、可复用的块，同时减少噪音。完全可以不用它们编写代码。它们只是让某些任务变得整洁。\n\
  \n### 实现一个日志装饰器\n\n有时，知道方法是如何调用的很有用。你当然可以在那里附加 `console.log`，但实现 `@log` 更有趣。考虑下面的示例：\n\
  \n```javascript\nclass Math {\n  @log\n  add(a, b) {\n    return a + b;\n  }\n}\n\
  \nfunction log(target, name, descriptor) {\n  var oldValue = descriptor.value;\n\
  \n  descriptor.value = function() {\n    console.log(`Calling \"${name}\" with`,\
  \ arguments);\n\n    return oldValue.apply(null, arguments);\n  };\n\n  return descriptor;\n\
  }\n\nconst math = new Math();\n\n// 现在传递的参数会被记录\nmath.add(2, 4);\n```\n\n想法是我们的\
  \ `log` 装饰器包装了原始函数，触发 `console.log`，最后将原始 [arguments](https://developer.mozilla.org/en-docs/Web/JavaScript/Reference/Functions/arguments)\
  \ 传递它。如果你以前没见过 `arguments` 或 `apply`，可能看起来有点奇怪。\n\n`apply` 可以被视为调用函数的另一种方式，同时将它的上下文（`this`）和参数作为数组传递。`arguments`\
  \ 隐式接收函数参数，所以它是这种情况的理想选择。\n\n这个日志记录器可以推送到单独的模块。之后，当我们记录某些方法时，可以在整个应用程序中使用。一旦实现，装饰器将变成强大的构建块。\n\
  \n装饰器接收三个参数：\n\n*   `target` 映射到类的实例。\n*   `name` 包含被装饰方法的名称。\n*   `descriptor`\
  \ 是最有趣的部分，因为它允许我们注解方法并操纵它的行为。它可能像这样：\n\n```javascript\nconst descriptor = {\n  value:\
  \ () => {...},\n  enumerable: false,\n  configurable: true,\n  writable: true\n\
  };\n```\n\n正如你上面看到的，`value` 使得塑造行为成为可能。其余部分允许你在方法级别修改行为。例如，一个 `@readonly` 装饰器可以限制访问。`@memoize`\
  \ 是另一个有趣的例子，因为它允许你为方法实现简单的缓存。\n\n### 实现 `@connect`\n\n\n\n\n`connect` 将把我们的组件封装在另一个组件中。相反，它将处理连接逻辑（`listen/unlisten/setState`）。它将在内部维护\
  \ store 状态，然后传递给我们正在封装的子组件。在此过程中，它通过 props 传递状态。下面的实现说明了这一思想：\n\n`app/decorators/connect.js`\n\
  \n```\nimport React from 'react';\n\nconst connect = (Component, store) => {\n \
  \ return class Connect extends React.Component {\n    constructor(props) {\n   \
  \   super(props);\n\n      this.storeChanged = this.storeChanged.bind(this);\n \
  \     this.state = store.getState();\n\n      store.listen(this.storeChanged);\n\
  \    }\n    componentWillUnmount() {\n      store.unlisten(this.storeChanged);\n\
  \    }\n    storeChanged() {\n      this.setState(store.getState());\n    }\n  \
  \  render() {\n      return <Component {...this.props} {...this.state} />;\n   \
  \ }\n  };\n};\n\nexport default (store) => {\n  return (target) => connect(target,\
  \ store);\n};\n```\n\n你能看出这种封装的想法吗？我们的装饰器跟踪 store 状态。之后，它通过 props 将状态传递给包含的组件。\n\
  \n你可以这样将装饰器连接到 `App`：\n\n`app/components/App.jsx`\n\n```\n...\nimport connect from\
  \ '../decorators/connect';\n\n...\n\n@connect(NoteStore)\nexport default class App\
  \ extends React.Component {\n  render() {\n    const notes = this.props.notes;\n\
  \n    ...\n  }\n  ...\n}\n```\n\n将逻辑推送到装饰器允许我们保持组件的简单。如果我们想向系统添加更多 store 并将它们连接到组件，现在将变得轻而易举。更好的是，我们可以轻松地将多个\
  \ store 连接到单个组件。\n\n### 装饰器构思\n\n我们可以以这种方式为各种功能构建新的装饰器，例如撤销（undo）。它们允许我们保持组件的整洁，并将通用逻辑推到视线之外。良好的装饰器可以在多个项目之间使用。\n\
  \n#### Alt 的 `@connectToStores`\n\nAlt 了一个了一个名为 `@connectToStores` 的类似装饰器。它依赖于静态方法。与绑定到特定实例的普通方法不同，这些方法是在类级别上绑定的。这意味着你可以通过类本身调用它们（例如\
  \ `App.getStores()`）。下面的示例展示了我们如何将 `@connectToStores` 集成到应用程序中。\n\n```\n...\nimport\
  \ connectToStores from 'alt-utils/lib/connectToStores';\n\n@connectToStores\nexport\
  \ default class App extends React.Component {\n  static getStores(props) {\n   \
  \ return [NoteStore];\n  };\n  static getPropsFromStores(props) {\n    return NoteStore.getState();\n\
  \  };\n  ...\n}\n```\n\n这种更冗长的方法与我们的实现大致相当。它实际上功能更多，因为它允许你同时连接到多个 store。它还对你将 store\
  \ 状态塑形为 props 的方式提供了更多控制。\n\n### 结论\n\n尽管仍然有一点实验性，但装饰器为将逻辑推送到它所在的地方提供了很好的手段。更好的是，它们在保持组件整洁的同时，为我们提供了某种程度的重用性。\n\
  \n### 故障排除\n\n我尝试在这里涵盖了一些常见问题。随着常见问题的发现，本章将进行扩展。\n\n### `EPEERINVALID`\n\n你可能会看到类似下面的消息：\n\
  \n```\nnpm WARN package.json kanban_app@0.0.0 No repository field.\nnpm WARN package.json\
  \ kanban_app@0.0.0 No README data\nnpm WARN peerDependencies The peer dependency\
  \ eslint@0.21 - 0.23 included from e\\\nslint-loader will no\nnpm WARN peerDependencies\
  \ longer be automatically installed to fulfill the peerD\\\nependency\nnpm WARN\
  \ peerDependencies in npm 3+. Your application will need to depend on it \\\nexplicitly.\n\
  \n...\n\nnpm ERR! Darwin 14.3.0\nnpm ERR! argv \"node\" \"/usr/local/bin/npm\" \"\
  i\"\nnpm ERR! node v0.10.38\nnpm ERR! npm  v2.11.0\nnpm ERR! code EPEERINVALID\n\
  \nnpm ERR! peerinvalid The package eslint does not satisfy its siblings' peerDepen\\\
  \ndencies requirements!\nnpm ERR! peerinvalid Peer eslint-plugin-react@2.5.2 wants\
  \ eslint@>=0.8.0\nnpm ERR! peerinvalid Peer eslint-loader@0.14.0 wants eslint@0.21\
  \ - 0.23\n\nnpm ERR! Please include the following file with any support request:\n\
  ...\n```\n\n用通俗的话说，这意味着某些包（在这种情况下是 `eslint-loader`）具有过于严格的 `peerDependency` 限制。我们的项目已经安装了较新版本。由于所需的\
  \ peer dependency 比我们的版本要旧，我们得到了这个特定的错误。\n\n有几种方法可以规避这个问题：\n\n1. 向包作者报告错误，并希望版本范围能扩大。\n\
  2. 通过妥协到满足 peer dependency 的版本来解决冲突。在这种情况下，我们可以将 `eslint` 锁定到版本 `0.23`（`\"eslint\"\
  : \"0.23\"`），这样大家都会满意。\n3. 分叉（Fork）该包，修复版本范围，并指向你的自定义版本。在这种情况下，你将有一个类似于 `\"<package>\"\
  : \"<github user>/<project>#<reference>\"` 的声明。\n"
