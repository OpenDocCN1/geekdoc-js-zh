- "# SurviveJS - Webpack 和 React：从入门到精通\n\n\n\n![](img/title_page.png)\n\n![SurviveJS\
  \ - Webpack 和 React](img/title_page.png)\n\n\n\n本书可以在 [`leanpub.com/survivejs_webpack_react`](http://leanpub.com/survivejs_webpack_react)\
  \ 购买\n\n\n![出版者标志](img/leanpub-logo.png)\n\n\n\n\n\n\n## 前言\n\n前端开发进展非常快。衡量这一点的一个良好指标是新技术出现在舞台的速度。[Webpack](https://webpack.github.io/)\
  \ 和 [React](https://facebook.github.io/react/) 是近期的两个新秀。这些工具结合使用，可以让你快速构建各种 Web\
  \ 应用程序。最重要的是，学习这些工具可以为你提供视角。这正是本书的主题。\n\n### 什么是 Webpack？\n\n浏览器的设计初衷是消耗 HTML、JavaScript\
  \ 和 CSS。简单的开发方法是直接编写浏览器能够理解的文件。但问题是，这最终会变得难以管理。当你开发 Web 应用程序时，尤其如此。\n\n解决这个问题有多种方法。你可以开始将\
  \ JavaScript 和 CSS 拆分到单独的文件中。你可以通过 `script` 标签加载依赖项。虽然这样更好，但仍然存在一些问题。\n\n如果你想使用编译为这些目标格式的技术，就需要引入预处理步骤。任务运行器（如\
  \ Grunt 和 Gulp）可以让你实现这一点，但即使如此，你仍然需要编写大量的配置。\n\n#### Webpack 如何改变现状？\n\nWebpack\
  \ 采取了另一条路线。它允许你将项目视为依赖图。你可以在项目中有一个 `index.js`，通过标准的 `import` 语句引入项目所需的依赖。你可以以同样的方式引用样式文件和其他资源。\n\
  \nWebpack 会为你完成所有的预处理工作，并根据你指定的配置提供包。这种声明式的方法非常强大，但学习起来有些困难。然而，一旦你开始理解 Webpack 的工作原理，它就会变成必不可少的工具。本书旨在帮助你度过最初的学习曲线。\n\
  \n### 什么是 React？\n\nFacebook 的 React 是一个 JavaScript 库，是一种基于组件的视图抽象。组件可以是表单输入、按钮或用户界面中的任何其他元素。这与早期的方法形成了有趣的对比，因为\
  \ React 在设计上并没有绑定 DOM。例如，你可以用它来实现移动应用程序。\n\n#### React 仅仅是整体的一部分\n\n鉴于 React 只关注视图，你可能需要用其他库来补充缺失的部分。这与基于框架的方法形成了有趣的对比，因为框架提供了更多开箱即用的功能。两种方法各有优劣。在本书中，我们将关注以库为导向的方法。\n\
  \nReact 引入的理念影响了框架的发展。最重要的是，它帮助我们理解了基于组件的思维有多适合 Web 应用程序。\n\n### 你将学到什么？\n\n![看板应用](img/kanban_05.png)\n\
  \n看板应用\n\n本书将教你如何构建一个[看板](https://en.wikipedia.org/wiki/Kanban) 应用程序。除了这些之外，书中还讨论了\
  \ Web 开发的更多理论方面。完成项目将让你对如何独立实现功能有很好的理解。在此过程中，你将学到为什么某些库是有用的，并能够更好地为你的技术选择提供合理的理由。\n\
  \n### 本书是如何安排的？\n\n我们将从构建一个基于 Webpack 的配置开始。之后，我们将开发一个著名的 [Todo 应用程序](http://todomvc.com/)\
  \ 的小克隆版本。这引导我们思考扩展性问题。有时，你需要用笨办法的方法处理事情，以理解为什么最终需要更好的解决方案。\n\n我们将从那里进行泛化，并引入 [Flux\
  \ 架构](https://facebook.github.io/flux/docs/overview.html)。我们将应用一些 [拖放（DnD）魔术](https://gaearon.github.io/react-dnd/)\
  \ 并开始拖动物品。最后，我们将完成一个生产级别的构建。\n\n书的最后一个理论部分涵盖了更高级的主题。如果你阅读的是本书的商业版，里面还有额外的内容。我将向你展示如何处理\
  \ React 中的类型定义以产生更高质量的代码。你还将学习测试你的组件和逻辑。\n\n我还会向你展示如何使用 [ESLint](http://eslint.org/)\
  \ 以及各种其他工具有效地对代码进行检查。书中有一章节学习如何在 [npm](https://www.npmjs.com/) 上发布库。在在那里学到的经验对应用程序也有用。最后，你将学习如何以各种新兴的方式为你的\
  \ React 应用程序设置样式。\n\n结尾处有两个附录。它们旨在提供思考，并更详细地解释如语言特性等方面。如果书中某些语法对你来说很奇怪，你可能会在那里找到更多信息。\n\
  \n### 什么是看板？\n\n![Dennis Hamilton 绘制看板 (CC BY)](img/kanban_intro.jpg)\n\nDennis\
  \ Hamilton 绘制看板 (CC BY)\n\n看板最初开发于丰田，允许你跟踪任务状态。它可以用“道（Lanes）”和“便签（Notes）”来建模。随着任务的完成，“便签”从左到右通过不同的“道”，代表不同的阶段。“便签”本身可以根据需要包含任务本身的信息、其优先级等。\n\
  \n该系统可以通过多种方式进行扩展。一种简单的方法是对每道应用“进行中（WIP）限制”。这样做的效果是迫使你专注于完成任务。这是使用看板的一个优点。移动这些便签是非常有成就感的。作为额外，你获得了可见性，并知道还有什么未完成。\n\
  \n#### 在哪里使用看板？\n\n该系统可以用于各种用途，包括软件开发和生活管理。例如，你可以用它来跟踪个人项目或生活目标。\n\n#### 如何构建看板？\n\
  \n构建看板的最简单方法是获取大量的便利贴并找一面墙。之后，你将其分成若干列。这些“道”可以由以下阶段组成：Todo、Doing、Done。所有的“便签”最初进入\
  \ Todo。当你开始处理它们时，你会将它们移动到 Doing，最后在完成后移动到 Done。这是入门的最简单方法。\n\n这只是道配置的一个示例。“道”可以根据匹配你的流程进行配置。例如，可以有审批步骤。如果你正在建模一个软件开发流程，可以为测试和部署设置独立的道，例如。\n\
  \n#### 可用的看板实现\n\n\n\n\n\n[Trello](https://trello.com/) 可能是最为人知的看板（Kanban）在线实现。Sprintly\
  \ 开源了他们的 [React Kanban 实现](https://github.com/sprintly/sprintly-kanban)。基于 Meteor\
  \ 的 [wekan](https://github.com/wekan/wekan) 是另一个很好的例子。我们的项目不会像这些那样复杂，但足够入门了。\n\n\
  ## 这本书是给谁看的？\n\n我预计你已经具备 `JavaScript` 和 `Node.js` 的基础知识。你应该能够在基础水平上使用 `npm`。如果你对\
  \ `Webpack`、`React` 或 `ES6` 有所了解，那太棒了。通过阅读这本书，你将加深对这些工具的理解。\n\n写书最困难的事情之一就是写在合适的水平上。由于本书涵盖范围很广，因此有一些附录涵盖了语言细节等基础主题，其详细程度比正文更深。\n\
  \n如果你发现自己很吃力，可以考虑学习附录，或向书籍相关的社区寻求帮助。如果你遇到卡壳或理解某些内容，我们将在这里提供帮助。你的任何建议都将有助于改进书籍内容。\n\
  \n## 如何阅读这本书？\n\n虽然阅读书籍的自然方式是从第一章开始按顺序阅读章节，但并不是阅读这本书的唯一方法。章节顺序只是一个阅读建议。根据你的背景，你可以考虑以下顺序，甚至完全跳过某些部分：\n\
  \n*   从头到尾 - 这是传统的读书方式。它需要最长的时间。但优点是你可以稳步进展。\n*   先 React，后 Webpack - 另一种替代方法是跳过关于\
  \ `Webpack` 的早期章节，从仓库下载一个[起点](https://github.com/survivejs/webpack_react/tree/master/project_source/03_webpack_and_react/kanban_app)，首先完成看板演示。。之后遵循\
  \ `Webpack` 章节来理解配置在做什么以及为什么。“高级技术”部分和附录很好地补充了这些内容。\n*   仅看 Webpack - 如果你非常熟悉 `React`，也许只看\
  \ `Webpack` 部分是有意义的。毕竟，你可以在 `React` 之外应用同样的技能。\n*   仅看高级技术 - 鉴于 `React` 生态系统如此庞大，“高级技术”部分涵盖了你可能错过的有趣领域。学习像代码检查（linting）之类的技术，或学习改进你的\
  \ `npm` 设置。深入研究各种样式方法以找到适合你目标的方案可能是值得的。\n\n本书并没有涵盖你开发前端应用所需的所有知识。那对于单本书来说内容实在太丰富了。然而，我相信它可能引导你走向正确的方向。`Webpack`\
  \ 和 `React` 周边的生态系统相当庞大，我已经尽力涵盖了其中的很大一部分。\n\n由于本书依赖于许多新的语言特性，我将最重要的特性汇集到一个单独的“语言特性”（`Language\
  \ Features`）附录中，以便快速查阅。如果你想孤立地理解这些特性，或者对某些内容不确定，那里是一个很好的地方。\n\n## 书籍的版本控制\n\n由于创新速度快，本书接受了大量的维护和改进，因此有一套粗略的版本控制方案。我在[书籍博客](http://survivejs.com/blog/)\
  \ 上为每个新版本维护发布日志。这应该让你对版本之间的变化有一个良好的了解。此外，检查 GitHub 仓库也可能有所益。我推荐为此使用 GitHub 的 `compare`\
  \ 工具。例如：\n\n```\nhttps://github.com/survivejs/webpack_react/compare/v1.9.10...v1.9.17\n\
  ```\n\n该页面将向你展示给定版本范围内提交到项目的单独提交。你也可以看到书籍中发生变化的行。这不包括私有章节，但足以让你对书籍的重大更改有一个良好的了解。\n\
  \n书籍的当前版本是 `2.0.5`。\n\n## 额外材料\n\n书籍内容和源码可以在 [GitHub 上的书籍仓库](https://github.com/survivejs/webpack_react)\
  \ 获取。请注意，仓库默认是项目的 `dev` 分支。这便于贡献。要找到与你正在阅读书籍版本匹配的源码，请使用 GitHub 用户界面上的标签选择器，如下图所示：\n\
  \n![GitHub tag selector](img/github.png)\n\nGitHub 标签选择器\n\n书籍仓库包含每章的代码。这意味着你可以从任何地方开始，而无需自己手动输入一遍。如果你对某些内容不确定，可以随时参考。\n\
  \n你可以在 [survivejs 组织](https://github.com/survivejs/) 找到很多补充材料。例如，使用 [mobservable](https://github.com/survivejs/mobservable-demo)、[Redux](https://github.com/survivejs/redux-demo)\
  \ 和 [Cerebral/Baobab](https://github.com/survivejs/cerebral-demo) 编写的应用程序替代实现。学习这些可以让你很好地了解不同架构是如何使用相同示例工作的。\n\
  \n## 获取支持\n\n由于没有哪本书是完完美的，你可能会遇到问题，并对内容有一些疑问。有几种处理方法：\n\n*   通过 [GitHub Issue Tracker](https://github.com/survivejs/webpack_react)\
  \ 与我联系\n*   在 [Gitter Chat](https://gitter.im/survivejs/webpack_react) 加入我\n*  \
  \ 在 Twitter 上关注 [@survivejs](https://twitter.com/survivejs) 或直接私信 [@bebraw](https://twitter.com/bebraw)\n\
  *   发送邮件至 info@survivejs.com\n*   在 [SurviveJS AMA](https://github.com/survivejs/ama)\
  \ 向我提任何关于 Webpack 或 React 的问题\n\n如果你在 Stack Overflow 上发布问题，请标记 `survivejs` 以便我收到通知。你可以在\
  \ Twitter 上使用标签 `survivejs` 达到同样的效果。\n\n我尝试在“故障排除”（`Troubleshooting`）附录中涵盖常见问题。随着常见问题的发现，那里将会扩展。\n\
  \n## 公告\n\n我通过几个渠道发布 SurviveJS 相关新闻：\n\n*   [邮件列表](http://eepurl.com/bth1v5)\n*\
