    expect(message).toBe(\"Hello, Scott!\");\n```\n\nBacktick characters (`` ` ``)\
    \ enclose the entire template literal, while `$` and `{}` denote the substitution\
    \ placeholders. Inside a placeholder, you can use identifiers and expressions.\n\
    \n```javascript\nlet showTheMath = function(x,y ){\n    return `${x} + ${y} is\
    \ ${x + y}`;\n};\n\nlet result = showTheMath(3,4);\nexpect(result).toBe(\"3 +\
    \ 4 is 7\");\n```\n\nTemplate literals can also span multiple lines.\n\n```javascript\n\
