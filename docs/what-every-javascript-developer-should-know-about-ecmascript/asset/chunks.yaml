  trans: "\n\n![](img/cover.jpeg)\n\n# 每个 JavaScript 开发者应该了解 ECMAScript 2015\n\n作者：K.\
    \ Scott Allen\n\n[`OdeToCode.com`](http://OdeToCode.com)\n\n![otc300](img/00001.jpeg)\n\
    \n第一版\n©2015 OdeToCode LLC\n\n## 目录\n- 欢迎\n- 变量与参数\n- let\n- const\n- 默认参数\n-\
    \ 剩余参数\n- 展开运算符\n- 解构\n- 模板字符串\n- 标签模板字符串\n- 类 (Classes)\n- class 关键字\n- 类构造函数与属性\n\
    - 类背后的原理\n- 静态方法\n- 继承\n- 使用 super\n- super 构造函数\n- 注意事项\n- 函数式特征\n- 箭头函数\n- 迭代器\n\
    - 使用 for 循环\n- 符号 (Symbols)\n- 创建可迭代对象\n- 生成器 (Generators)\n- 惰性求\n- 重温迭代器\n-\
    \ 委托 yield\n- 异步 JavaScript\n- Promise 对象\n- Promise 链式\n- Promise API\n- Promise\
    \ 错误\n- 模块 (Modules)\n- 为什么需要模块\n- 模块语法\n- APIs\n- 新集合\n- 数组\n- 字符串\n- 对象\n- 结束\n\
    \n# 欢迎\n\n我坐下来写了这本书，我想读关于 2015 年 JavaScript 的新特性。这本书并不是 ECMAScript 2015 规范中包含的所有内容的详尽列表。相反，我特意挑选了我们在日常编程中使用的重要特性。预计读者在\
    \ 2015 年之前已经很熟悉 JavaScript 语言。书中的代码示例使用 Jasmine 测试框架编写的，以验证我对代码如何工作的假设。特别感谢 Ruben\
    \ Bartelink 和 Porter T 的反馈。希望你喜欢后续的内容。\n\n# 变量与参数\n\nJavaScript 的变量作用域多年一直是惊喜和\
    \ Bug 的来源。ECMAScript 2015 引入了许多新关键字和处理局部变量与函数参数的语法糖。这些特性让 JavaScript 代码更具表现力、更容易使用，并且更安全。\n\
    \n# let\n\nJavaScript 的变量作用域只提供函数作用域和全局作用域来控制变量的生命周期，这一直是一个意外。\n\n```javascript\n\
    var doWork = function(flag){\n    if(flag) {\n      var x = 3;\n    }\n    return\
    \ x; // x 仍然可用\n};\n\nvar result = doWork(true);\nexpect(result).toBe(3); // 通过通过\n\
    ```\n\n2015 年新的 `let` 关键字将取代变量声明中的 `var` 并提供块级作用域。\n\n```javascript\nlet doWork\
    \ = function(flag) {\n    if(flag){\n      let x = 3;\n    }\n    return x; //\
    \ ReferenceError: x 未定义\n};\n\nlet result = doWork(true);\nexpect(result).toBe(3);\n\
    ```\n\n迭代语句也受益于 `let`。\n\n```javascript\nvar doWork = function(){\n    for(let\
    \ x = 0; x < 3; x++) {\n        // ...\n    }\n    return x; // ReferenceError:\
    \ x 未定义\n};\n```\n\n### 使用 let\n\nES2015 仍然支持 `var` 关键字，但在编写新代码时，我们应该将 `var` 视为过时的关键字。`let`\
    \ 是新的 `var`！\n\n`let` 会让 JavaScript 代码变得更好吗？我不确定 `let` 能防止大量的 Bug，但我认为 JavaScript\
    \ 代码会改进。我们可以在使用变量的地方声明它们，这使得代码更容易追踪。\n\n# const\n\n`const` 关键字将为你提供只读变量。像 `let`\
    \ 一样，用 `const` 声明的变量具有块作用域，且你不能重新声明它。\n\n```javascript\nconst MAX_BIES = 3;\n\
    ```\n\n常量并不要求大写，这只是我喜欢的习惯。\n\n### 使用 const\n\n在完美的世界里，所有的 JavaScript 环境都应该对 `const`\
    \ 有完美的实现。遗憾的是，`const` 是那些在官方 ECMAScript 规范出现之前就已经存在某些运行时中的关键字之一。\n\n虽然大多数运行时都同意\
    \ `const` 应该是常量，但它们对于代码尝试给常量赋值新值时的行为存在分歧。应该导致运行时错误吗？还是静默失败？\n\n官方规范说，如果程序尝试给常量赋值新值，`const`\
    \ 应该产生运行时错误，而没有初始化器的常量声明应该是语法错误。\n\n```javascript\nconst MAX_SIZE = 10;\n// MAX_SIZE\
    \ = 12; // 如果执行，会导致 SyntaxError\n```\n\n我希望所有的运行时和浏览器很快就能正常并正确运行。目前的情况不应该阻止你尽可能使用\
    \ `const`，因为该关键字确实有几个优点：\n\n1. `const` 告诉其他程序员变量的意图行为，这使得脚本更容易维护。\n2. `const`\
    \ 告诉运行时变量的意图行为，允许在时间和空间进行优化。\n\n# 默认参数\n\n如果一个 JavaScript 函数接受两个参数，我们一直都有调用函数并传递两个参数、一个参数、零参数或在我们需要时传递三个参数的能力。在传递参数不足的情况下，函数的作者可能希望指定一个默认值，而不是处理\
    \ `undefined`。\n\n在 2015 年之前，开发者在函数内部使用 `||` 表达式给传入的参数应用默认值。在以下函数中，如果调用没有没有 `name`\
    \ 参数传递值，代码将分配默认值 Scott。\n\n```javascript\nlet doWork = function(name) {\n    name\
    \ = name || \"Scott\";\n    return name;\n};\n```\n\n在 2015 年，默认值是显式的，并出现在函数的参数列表中。\n\
    \n```javascript\nlet doWork = function(name = \"Scott\") {\n    return name;\n\
    };\n\nexpect(doWork()).toBe(\"Scott\");\n```\n\n"
- fmt: "\nA function can even calculate a default using something more than just a\
    \ literal expression.\n\n```\nlet doWork = function(x = Math.random()) { return\
    \ x; }\n```\n\nThe default parameter syntax is a good example of how ES2015 provides\
    \ a clean syntax for a common requirement. No longer will we have to scan through\
    \ a function’s source code or documentation to discover the defaults.\n\nOf course,\
    \ not all parameters are simple values. A common programming technique for operations\
    \ involving complex configurations, like an HTTP call, is to accept a single object\
    \ argument with properties to set the URI, HTTP method, timeout settings, and\
    \ more. Default parameters are useful in this scenario, too, but we’ll have to\
    \ wait for later and learn about object destructuring first.\n\n## Rest Parameters\n\
    \nA rest parameter allows a function to work with a variable number of arguments.\
    \ A function’s rest parameter always appears at the end of the argument list and\
    \ uses a triple dot prefix (`…`), as shown below.\n\n```javascript\nlet doWork\
    \ = function(name, ...numbers){\n    let result = 0;\n    numbers.forEach(function(n){\n\
    \        result += n;\n    });\n    return result;\n};\n```\n\nA caller invoking\
    \ `doWork` can pass zero or more parameters at the rest parameter position. You\
    \ can say the `numbers` argument will take “the rest” of the parameters a caller\
    \ passes to `doWork`, and `numbers` will hold the parameters in an array. In the\
    \ following example, `numbers` will reference an array with the values 1, 2, 3.\n\
    \n```javascript\nlet result = doWork(\"Scott\", 1, 2, 3);\nexpect(result).toBe(6);\n\
    ```\n\nIn the case where a caller passes no parameters in the rest parameter position,\
    \ the rest parameter will be an empty array.\n\n```javascript\nlet doWork = function(...numbers){\n\
    \    return numbers;\n};\n\nlet result = doWork();\nexpect(result.length).toBe(0);\n\
    ```\n\nBefore 2015, we could allow callers to pass a variable number of arguments\
    \ to a function by using the implicit `arguments` variable inside of the function.\
    \ The `arguments` variable contains all the parameters to a function in an array-like\
    \ object, but `arguments` is not an array, which creates confusion. It is also\
    \ difficult to spot if a function is using `arguments` without reading through\
    \ the code or documentation for the function.\n\nRest parameters will avoid confusion\
    \ by always giving us a true array, and by using a dedicated syntax that makes\
    \ rest parameters easy to spot when reading the function signature.\n\n## Spread\
    \ Operator\n\nThe spread operator shares the same syntax we saw with rest parameters,\
    \ a series of three dots (`...`). However, a rest parameter will collect individual\
    \ parameters into an array while the spread operator expands an array into individual\
    \ parameters. We can use rest parameters when defining a function and use the\
    \ spread operator when invoking a function. For example:\n\n```javascript\nlet\
    \ doWork = function(x, y, z) {\n    return x + y + z;\n}\n\nlet result = doWork(...[1,\
    \ 2, 3]);\nexpect(result).toBe(6);\n```\n\nIn the above code, the spread operator\
    \ will “spread” the array of three values across the parameters `x`, `y`, and\
    \ `z`.\n\nThe spread operator can also expand an array to create individual elements\
    \ in an array literal.\n\n```javascript\nlet a = [4, 5, 6];\nlet b = [1, 2, 3,\
    \ ...a, 7, 8, 9];\nexpect(b).toEqual([1,2,3,4,5,6,7,8,9]);\n```\n\nAlthough the\
    \ examples I've shown all use the spread operator with an array, the spread operator\
    \ also works with any iterable object. We’ll look at iterable objects a bit later\
    \ in the book.\n\nThe spread operator also makes it easy to pass parameters along\
    \ to another function when you don’t care about the actual parameter values (a\
    \ scenario where we typically use `Function.apply`). This is the case in the `doSomething`\
    \ method below.\n\n```javascript\nlet doWork = function(x, y, z){\n    return\
    \ x + y + z;\n}\n\nlet doSomething = function(...args){\n    return doWork(...args);\n\
    }\n\nlet result = doSomething(...[1,2,3,4,5]);\nexpect(result).toBe(6);\n```\n\
    \nNotice that when using the spread, you can have more values in the array than\
    \ the destination function requires. The spread will start from the beginning\
    \ of the array to populate parameters, so in the above example, `doWork` will\
    \ only see the first three values in the array.\n\n## Destructuring\n\nTo destructure\
    \ an object is to dismantle or tear apart an object – the opposite of constructing.\n\
    \nIn 2015, a destructuring assignment allows us to tear apart an array or object\
    \ into individual pieces and assign the pieces into variables. The square brackets\
    \ `[` and `]` are used to destructure an array, while curly braces `{` and `}`\
    \ will destructure an object.\n\nThe following code will destructure an array\
    \ so that `x` contains 22 and `y` contains 44.\n\n```javascript\nlet values =\
    \ [22, 44];\nlet [x, y] = values;\nexpect(x).toBe(22);\nexpect(y).toBe(44);\n\
    ```\n\nYou can think of `[` and `]` on the right-hand side of an assignment as\
    \ symbols to construct an array. The `[` and `]` on the left-hand side of an assignment\
    \ destructure the array and declare two variables to hold the pieces.\n\nDestructuring\
    \ objects follows the same pattern, but will use `{` and `}`.\n\n```javascript\n\
    let person = { firstName: \"Scott\", lastName: \"Allen\" };\nlet {firstName, lastName}\
    \ = person;\nexpect(firstName).toBe(\"Scott\");\nexpect(lastName).toBe(\"Allen\"\
    );\n```\n\nYou do not need to use `var` with destructuring to create new variables,\
    \ you can also destructure into existing variables.\n\n```javascript\nlet x =\
    \ 10, y = 20;\n[x, y] = [y, x]; // swap values using destructuring\n```\n\nYou\
    \ can also destructure arrays and objects returned from a function.\n\n```javascript\n\
    let doWork = function() {\n    return [1, 2];\n};\nlet [x, y] = doWork();\nexpect(x).toBe(1);\n\
    expect(y).toBe(2);\n```\n\nNote a couple of special properties in the destructuring:\
    \ First, the opening comma will skip the first element. Secondly, if there are\
    \ not enough elements to satisfy all the variables, the extra variables will receive\
    \ `undefined`.\n\nYou can also use destructuring in a parameter list.\n\n```javascript\n\
    let doWork = function({firstName, lastName, role=\"developer\"}) {\n    return\
    \ role + \" \" + firstName + \" \" + lastName;\n};\nlet person = {firstName: \"\
    Scott\", lastName: \"Allen\"};\nlet result = doWork(person);\nexpect(result).toBe(\"\
    developer Scott Allen\");\n```\n\nDefault parameters are not restricted to function\
    \ declarations. The following code has a default for `country`.\n\n```javascript\n\
    let address = { state:\"Maryland\" };\nlet { state=\"New York\", country=\"USA\"\
    } = address;\nexpect(state).toBe(\"Maryland\");\nexpect(country).toBe(\"USA\"\
    );\n```\n\nCombine destructuring with rest parameters to capture the remaining\
    \ elements of an array.\n\n```javascript\nlet odds = [1,3,5,7,9];\nlet [first,\
    \ second, ...rest] = odds;\nexpect(first).toBe(1);\nexpect(second).toBe(3);\n\
    expect(rest).toEqual([5,7,9]);\n```\n\nDestructuring can also drill into complex\
    \ objects, even objects with collections inside.\n\n```javascript\nlet employee\
    \ = {\n    firstName: \"Scott\",\n    address: {\n        state: \"Maryland\"\
    ,\n        country: \"USA\"\n    },\n    favoriteNumbers: [45,55,32,13]\n};\n\
    let { firstName, address: {state}, favoriteNumbers: [,second]} = employee;\nexpect(firstName).toBe(\"\
    Scott\");\nexpect(state).toBe(\"Maryland\");\nexpect(second).toBe(55);\n```\n\n\
    ### Destructuring in Practice\n\nOne area where destructuring will lead to more\
    \ maintainable code is in the use of configuration objects, like the configuration\
    \ object in `Query.ajax` method. Finding the available options and the default\
    \ values for those options is often difficult. Maintaining the options and defaults\
    \ can also be tricky as an author. With destructuring, configuration options and\
    \ defaults become more explicit.\n\n```javascript\nlet httpPost = function(url,\
    \ {\n    cache = true,\n    contentType = \"application/json\",\n    timeout =\
    \ 2500,\n    headers = {},\n    // ...\n}) {\n    // ...\n};\n```\n"
  raw: 'A function can even calculate a default using something more than just a literal
    expression.


    let doWork = function(x = Math.random()) { return x; }


    The default parameter syntax is a good example of how ES2015 provides a clean
    syntax for a common requirement. No longer will we have to scan through a function’s
    source code or documentation to discover the defaults.


    Of course, not all parameters are simple values. A common programming technique
    for operations involving complex configurations, like an HTTP call, is to accept
    a single object argument with properties to set the URI, HTTP method, timeout
    settings, and more. Default parameters are useful in this scenario, too, but we’ll
    have to wait for later and learn about object destructuring first.


    ## Rest Parameters


    A rest parameter allows a function to work with a variable number of arguments.
    A function’s rest parameter always appears at the end of the argument list and
    uses a triple dot prefix (…), as shown below.


    let doWork = function(name, ...numbers){


        let result = 0;


        numbers.forEach(function(n){


            result += n;


        });


        return result;


    };


    A caller invokingdoWork can pass zero or more parameters at the rest parameter
    position. You can say thenumbers argument will take “the rest” of the parameters
    a caller passestodoWork, and numbers will hold the parameters in an array. In
    the following example,numbers will reference an array with the values 1, 2, 3.


    let result = doWork("Scott", 1, 2, 3);


    expect(result).toBe(6);


    In the case where a caller passes no parameters in the rest parameter position,
    the rest parameter will be an empty array.


    let doWork = function(...numbers){


         return numbers;


    };


    let result = doWork();


    expect(result.length).toBe(0);


    Before 2015, we could allow callers to pass a variable number of arguments to
    a function by using the implicit arguments variable inside of the function. The
    arguments variable contains all the parameters to a function in an array-like
    object, but arguments isnot an array, which creates confusion. It is also difficult
    to spot if a function is usingarguments without reading through the code or documentation
    for the function.


    Rest parameters will avoid confusion by always giving us a true array, and by
    using a dedicated syntax that makes rest parameters easy to spot when reading
    the function signature.


    ## Spread Operator


    The spread operator shares the same syntax we saw with rest parameters, a series
    of three dots (...). However, a rest parameter will collect individual parameters
    into an array while the spread operator expands an array into individual parameters.
    We can use rest parameters when defining a function and use the spread operator
    when invoking a function. For example:


    let doWork = function(x, y, z) {


        return x + y + z;


    }


    let result = doWork(...[1, 2, 3]);


    expect(result).toBe(6);


    In the above code, the spread operator will “spread” the array of three values
    across the parameters x, y, and z.


    The spread operator can also expand an array to create individual elements in
    an array literal.


    let a = [4, 5, 6];


    let b = [1, 2, 3, ...a, 7, 8, 9];


    expect(b).toEqual([1,2,3,4,5,6,7,8,9]);


    Although the examples I''ve shown all use the spread operator with an array, the
    spread operator also works with any iterable object. We’ll look at iterable objects
    a bit later in the book.


    The spread operator also makes it easy to pass parameters along to another function
    when you don’t care about the actual parameter values (a scenario where we typically
    use Function.apply). This is the case in thedoSomething method below.


    let doWork = function(x, y, z){


        return x + y + z;


    }


    let doSomething = function(...args){


        return doWork(...args);


    }


    let result = doSomething(...[1,2,3,4,5]);


    expect(result).toBe(6);


    Notice that when using the spread, you can have more values in the array than
    the destination function requires. The spread will start from the beginning of
    the array to populate parameters, so in the above example,doWork will only see
    the first three values in the array.


    ## Destructuring


    To destructure an object is to dismantle or tear apart an object – the opposite
    of constructing.


    In 2015, a destructuring assignment allows us to tear apart an array or object
    into individual pieces and assign the pieces into variables. The square brackets[
    and ] are used to destructure an array, while curly braces{and} will destructure
    an object.


    The following code will destructure an array so that x contains 22 and y contains
    44\.


    let values = [22, 44];


    let [x, y] = values;


    expect(x).toBe(22);


    expect(y).toBe(44);


    You can think of[ and ] on the right-hand side of an assignment as symbols to
    construct an array. The[ and ] on the left-hand side of an assignment destructure
    the array and declare two variables to hold the pieces.


    Destructuring objects follows the same pattern, but will use{ and }.


    let person = { firstName: "Scott", lastName: "Allen" };


    let {firstName, lastName} = person;


    expect(firstName).toBe("Scott");


    expect(lastName).toBe("Allen");


    You do not need to useletorvar with destructuring to create new variables, you
    can also destructure into existing variables.


    let x = 10, y = 20;


    // swap!!


    [x,y] = [y,x];


    expect(x).toBe(20);


    expect(y).toBe(10);


    You can also destructure arrays and objects returned from a function call.


    let doWork = function() {


        return [1, 3, 2];


    };


    let [, x, y, z] = doWork();


    expect(x).toBe(3);


    expect(y).toBe(2);


    expect(z).toBeUndefined();


    Note a couple of special properties in the destructuring ofdoWork’sresult. First,
    the opening comma will skip the first array element, and you can use additional
    commas anywhere to skip additional elements. Secondly, if there are not enough
    array elements to satisfy all the variables required by the destructuring, the
    extra variables will receive the valueundefined. 


    You can also use destructuring in a function parameter list.


    let doWork = function({firstName, lastName, role="developer"}) {


        return role + " " + firstName + " " + lastName;


    };


    let person = {firstName: "Scott", lastName: "Allen"};


    let result = doWork(person);


    expect(result).toBe("developer Scott Allen");


    The above example uses a default parameter value to assign “developer” to theroleparameter
    in case the incoming object does not have aroleproperty (otherwise,rolewould receive
    the valueundefined).


    Default parameters are not restricted to function declarations when using destructuring.The
    following code has a default for thecountry variable.


    let address = { state:"Maryland" };


    let { state="New York", country="USA"} = address;


    expect(state).toBe("Maryland");


    expect(country).toBe("USA");


    Combine destructing with rest parameters to capture the remaining elements of
    an array.


    let odds = [1,3,5,7,9];


    let [first, second, ...rest] = odds;


    expect(first).toBe(1);


    expect(second).toBe(3);


    expect(rest).toEqual([5,7,9]);


    Destructuring can also drill into complex objects, even objects with collections
    inside.


    let employee = {


        firstName: "Scott",


        address: {


            state: "Maryland",


            country: "USA"


        },


        favoriteNumbers: [45,55,32,13]


    };


    let { firstName, address: {state}, favoriteNumbers: [,second]} = employee;


    expect(firstName).toBe("Scott");


    expect(state).toBe("Maryland");


    expect(second).toBe(55);


    ### Destructuring in Practice


    One area where destructuring will lead to more maintainable code is in the use
    of configuration objects, like the configuration object injQuery’sajax method.
    Finding the available options and the default values for those options is often
    difficult. Maintaining the options and defaults can also be tricky as an author.
    With destructuring, configuration options and defaults become more explicit.


    let httpPost =


        function(url, {


            cache = true,


            contentType = "application/json",


            timeout = 2500,


            headers = {},


            // ...


        }) {


         // ...


    };'
