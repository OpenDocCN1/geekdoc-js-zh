  trans: "\n\nNodeJS 在 2009 年出现后，Node 开发者们发现自己正在创建更大的代码库，并消耗大量的库。为了管理这个新环境中的作用域和依赖问题，Node\
    \ 社区创建了一个我们现在称为 CommonJS 模块标准的非官方标准。不久后，另一个社区标准——异步模块定义标准（AMD）为浏览器编程出现。\n\nES2015\
    \ 为 JavaScript 语言引入了官方模块标准。该模块标准使用的语法与 CommonJS 和 AMD 都不同，但 WebPack 等工具和运行时补丁（polyfills）使得所有模块标准大部分情况下具有互操作性。在本文写作时，需要一些预处理或补丁才能使新的模块语法生效。尽管语言语法已经完整且标准化，但处理模块的浏览器\
    \ API 和行为仍在开发中。\n\n# 为什么需要模块？\n\n模块系统允许 JavaScript 代码在规模上扩展。模块通过提供几个重要的特性，为我们提供了管理大型代码库性的工具。\n\
    \n首先，JavaScript 中的模块是基于文件的。使用 ES2015 时，你不应该仅仅 true 一个脚本文件，而应该将其视为脚本模块。一个文件就是一个模块。默认情况下，你在文件中编写的任何代码都是该模块局部的。变量不再默认处于全局作用域，且无需编写函数或\
    \ IIFE（立即调用函数表达式）来控制变量的作用域。模块为我们提供了一个隐式作用域来隐藏实现细节。\n\n当然，你在模块中编写的一些代码可能是你可能想要暴露为\
    \ API 并在另一个模块中使用的代码。ES2015 提供了 `export` 关键字来实现此目的。任何你想提供给外部世界的对象、函数、类或变量，都必须使用\
    \ `export` 关键字显式导出。\n\n在第二个模块中，你将使用 `import` 关键字来使用第一个模块的部分或全部导出内容。\n\n模块允许我们将代码分散在多个文件和目录中，同时可以在不通过全局中介的情况下引用和使用跨文件的组件。也许书中列出的其他特性中，没有哪个特性对应用、框架和库架构的影响能像模块这么大。让我们来看看语法。\n\
    \n# 模块语法\n\n假设你想使用一个表示人的对象，并在名为 `humans.js` 的文件中放置了以下代码。\n\n```javascript\nfunction\
    \ work(name) {\n    return `${name} is working`;\n}\n\nexport let person = {\n\
    \    name: \"Scott\",\n    doWork() {\n        return work(this.name);\n    }\n\
    }\n```\n\n由于我们正在处理模块，`work` 函数保持隐藏在模块作用域中，模块外的任何代码无法访问 `work` 函数。`person` 变量是模块的导出内容。更具体地说，我们称\
    \ `person` 为命名导出。其他模块的代码可以导入 `person` 并对引用的对象进行操作。\n\n```javascript\nimport {person}\
    \ from \"./lib/humans\"\n\ndescribe(\"The humans module\", function() {\n    it(\"\
    should have a person\", function() {\n        expect(person.doWork()).toBe(\"\
    Scott is working\");\n    });\n});\n```\n\n关于上面的代码段有几点需要说明。\n\n首先，注意模块名 `./lib/humans`\
    \ 不需要 `.js` 扩展名。文件名是 `humans.js`，但文件的模块名是 `humans`。\n\n其次，在这个示例中，`humans` 模块位于测试代码的子文件夹。因此，模块指定符包含了指向模块的相对路径（`./lib/humans`）。\n\
    \n最后，大括号包围了来自 `humans` 模块的导入列表。导入之所以是一个列表，是因为你可以从另一个模块导入多个命名导出内容。例如，如果 `humans`\
    \ 模块也导出了 `work` 函数，那么测试代码可以通过以下代码访问这两个导出内容。\n\n```javascript\nimport {person,\
    \ work} from \"./lib/humans\"\n```\n\n你还有能力将导入重命名为不同的名称。\n\n```javascript\nimport\
    \ {person as scott, work} from \"./lib/humans\"\n\ndescribe(\"The humans module\"\
    , function() {\n    it(\"should have a person\", function() {\n        // 现在使用\
    \ scott 代替 person\n        expect(scott.doWork()).toBe(\"Scott is working\");\n\
    \    });\n    it(\"should have a work function\", function() {\n        expect(work).toBeDefined();\n\
    \    });\n});\n```\n\n除了导出变量、对象和函数外，你还可以导出一个类。假设 `humans` 模块具有以下代码。\n\n```javascript\n\
    function work(name) {\n    return `${name} is working`;\n}\n\nexport class Person\
    \ {\n    constructor(name) {\n        this.name = name;\n    }\n    doWork() {\n\
    \        return work(this.name);\n    }\n}\n```\n\n现在，测试代码看起来像这样。\n\n```javascript\n\
    import {Person} from \"./lib/humans\"\ndescribe(\"The humans module\", function()\
    \ {\n    it(\"should have a person class\", function() {\n        var person =\
    \ new Person(\"Scott\");\n        expect(person.doWork()).toBe(\"Scott is working\"\
    );\n    });\n});\n```\n\n模块还可以使用大括号导出符号列表。例如，我们可以重写 `humans` 模块，并将所有导出内容放在文件底部的一个位置。\n\
    \n```javascript\nfunction work(name) {\n    return `${name} is working`;\n}\n\n\
    class Person {\n    constructor(name) {\n        this.name = name;\n    }\n  \
    \  doWork() {\n        return work(this.name);\n    }\n}\n\nexport {Person, work\
    \ }\n```\n\n注意导出列表可以重命名导出名称，所以 `work` 函数导出为 `worker`。\n\n### 默认导出\n\n2015 模块标准允许每个模块有一个默认导出。模块可以拥有默认导出并导出其他名称，但拥有默认导出会影响另一个模块如何导入它。首先，这是\
    \ `humans` 模块带有 `Person` 类默认导出时的样子。\n\n```javascript\nfunction work(name) {\n\
    \    return `${name} is working`;\n}\n\nexport default class Person {\n    constructor(name)\
    \ {\n        this.name = name;\n    }\n    doWork() {\n        return work(this.name);\n\
