- fmt: "\nJavaScript has always been a functional programming language. You can pass\
    \ functions as arguments to other functions, and invoke a function that returns\
    \ a function back to you. The `ES2015` standard improves JavaScript’s functional\
    \ programming capabilities by offering a new, succinct syntax for creating functions.\
    \ In addition, `2015` also introduces new features closely associated with functional\
    \ programming, features like iterators and lazy evaluation. Let’s start looking\
    \ at the new capabilities by looking at the arrow function, which will look familiar\
    \ to anyone who has worked with CoffeeScript or C# code.\n\n# Arrow Functions\n\
    \nAn arrow function is a function expression with a concise syntax. An arrow function\
    \ doesn’t require the `function` keyword, or curly braces, or a return statement.\
    \ However, arrow functions do require a new operator, `=>`, which looks like an\
    \ arrow pointing to the right, and which gives these expressions their name. To\
    \ build an arrow function for adding two numbers, one simply has to write the\
    \ following.\n\n```\nlet add = (x,y) => x + y;\n```\n\nOn the left-hand side of\
    \ the arrow is the parameter list for the function. In this example there are\
    \ two parameters, `x`and`y`. To the right of the arrow is the executable code\
    \ for the function. In this case, the code returns the sum of `x`and`y`. You could\
    \ think of the arrow as pointing the parameters to the code that uses them.\n\n\
    Invoking an arrow function looks no different than invoking a traditional function.\n\
    \n```\nlet result = add(3, 5);\n\nexpect(result).toBe(8);\n```\n\nArrow functions\
    \ that use exactly one function parameter do not need to surround the parameter\
    \ with parenthesis.\n\n```\nlet square = x => x * x;\n```\n\nIf an arrow function\
    \ requires zero parameters, or more than one parameter, then the parenthesis are\
    \ required.\n\n```\nlet add = (x,y) => x + y;             // required parens\n\
    let square = x => x * x;             // optional parens\nlet compute = () => square(add(5,3));\
    \ // required parens\n\nlet result = compute();\n\nexpect(result).toBe(64);\n\
    ```\n\nSo far, the examples use a single expression to the right of the arrow\
    \ operator. When using a single expression, curly braces and return statements\
    \ are not required. The return value of the function will be the value of the\
    \ expression.\n\nHowever, an arrow function may contain a more complex block of\
    \ statements, but this approach does require braces and an explicit return (if\
    \ the function wants to return a value).\n\n```\nlet add = (x,y) => {\n    var\
    \ result = x + y;\n    return result;\n};\n```\n\n## Arrow Functions and this\n\
    \nEvery JavaScript programmer knows that the `this` pointer is a bit slippery.\
    \ Consider the code in the following class, particularly the code inside of `doWork`.\n\
    \n```javascriptclass Person {\n    constructor(name) {\n        this.name = name;\n\
    \    }\n    doWork(callback) {\n        setTimeout(function() {\n            callback(this.name);\n\
    \        }, 15);\n    }\n}\n```\n\nThe anonymous function the `doWork`method passes\
    \ into`setTimeout`will execute in a different context than`doWork` itself, which\
    \ means the`this`reference will change. When the anonymous function passes`this.name`to\
    \ a `callback`,`this` won’t point to a person object and the following test will\
    \ fail.\n\n```javascript\nvar person = new Person(\"Scott\");\nperson.doWork(function(result)\
    \ {\n    expect(result).toBe(\"Scott\"); // fail!\n    done();\n});\n```\n\nSince\
    \ developers can never rely on JavaScript’s `this` reference when asynchronous\
    \ code and callbacks are in the mix, a common practice is to capture the value\
    \ of`this`in a local variable and use the local variable in place of`this`. Common\
    \ variable names top capture`this`areself, or`me`, or`that`.\n\n```javascript\n\
    doWork(callback) {\n    var self = this;\n    setTimeout(function() {\n      \
    \  callback(self.name);\n    }, 15);\n}\n```\n\nThe above code will pass, thanks\
    \ to the`self` variable capturing the`this` reference.\n\nIf we use an arrow function\
    \ indo`doWork`, we no longer need to capture the`this` reference.\n\n```javascript\n\
    doWork(callback) {\n    setTimeout(() => callback(this.name), 15);\n}\n```\n\n\
    The previous test will pass because an arrow function will automatically capture\
    \ the value of`this` from the outer, parent function. In other words, the value\
    \ of`this` inside an arrow function will always be the same as the value of`this`\
    \ in the arrow’s enclosing function. There is no more need to use`self`orth`that`,\
    \ and you can nest arrow functions arbitrarily deep to preserve`this` through\
    \ a series of asynchronous operations.\n\n## Using Arrow Functions Everyday\n\n\
    If you embrace the arrow function syntax, you might find yourself using arrow\
    \ functions in every third line of code. JavaScript’s affinity for asynchronous\
    \ operations has created an enormous number of APIs requiring callback functions.\
    \ However, as JavaScript is a solid functional programming language, more and\
    \ more synchronous APIs have appeared with function arguments, too.\n\nFor example,\
    \ the previous release of ECMAScriptintroduced`forEach`and`map` methods on array.\n\
    \n```javascript\nlet result = [1,2,3,4].map(n => n * 2);\nexpect(result).toEqual([2,4,6,8]);\n\
    \nlet sum = 0;\n[1,2,3,4].forEach(n => sum += n);\nexpect(sum).toBe(10);\n```\n\
    \nThere are also many libraries (Underscore and Lodash being two examples) that\
    \ use higher order functions to implement filtering, sorting, and grouping.\n\n\
    ```javascript\nlet characters = [\n    { name: \"barney\", age: 36, blocked: false\
    \ },\n    { name: \"fred\", age: 40, blocked: true },\n    { name: \"pebbles\"\
    , age: 1, blocked: false }\n];\n\nlet result = _.find(characters, function(character)\
    \ {\n    return character.age < 40;\n});\n\nWith arrow functions, the result calculation\
    \ becomes more expressive.\nlet result = _.find(characters, character => character.age\
    \ < 40);\nexpect(result.name).toBe(\"barney\");\n\nit(\"can work with Jasmine\"\
    , () => {\n    var numbers = [1,3,4];\n    expect(numbers.length).toBe(3);\n});\n\
    ```\n\nThe last few examples have all worked against arrays, which are one type\
    \ of collection. `2015` also brings the concepts of iterators and iterables to\
    \ JavaScript, and these new features will make working with collections noticeably\
    \ flexible and reliable.\n\n# Iterators\n\nThe addition of iterators in `2015`\
    \ opens up a new world of algorithms and abilities for JavaScript. An iterator\
    \ is an object that allows code to traverse a sequence of objects. The sequence\
    \ of objects could be the values inside an array, or values in a more sophisticated\
    \ data structure like a tree or map. One of the many beautiful characteristics\
    \ of iterators is how the iterator doesn’t need to know any details about the\
    \ underlying collection. All an iterator will do is provide the ability to move\
    \ through a sequence of values one a time.\n\nYou might be wondering why we are\
    \ talking about iterators in a chapter devoted to functional programming. We’ll\
    \ get to that in just a bit, but the short story is that iterators work well with\
    \ a number of functional programming paradigms, including lazy evaluation and\
    \ function composition. Before we get to these topics, let’s take a look at the\
    \ basic characteristics of an iterator.\n\nIn `ES015`, array objects will have\
    \ a few new methods available, and one of these methods is the `values` method.\
    \ The `values` method returns an iterator object that can visit each value in\
    \ an array.\n\n```javascript\nlet sum = 0;\nlet numbers = [1,2,3,4];\nlet iterator\
    \ = numbers.values();\nlet next = iterator.next();\n\nwhile(!next.done){\n   \
    \ sum += next.value;\n    next = iterator.next();\n}\n\nexpect(sum).toBe(10);\n\
    ```\n\nAniterator is an object with an `next`method. Each time the program invokes\
    \ the`next` method, the method returns an object with two properties: `value`and`done`.\
    \ The `value` property represents the current item the iterator is visiting in\
    \ the collection. The `done`property is a flag holding the value`false` if there\
    \ are more items to visit, or the valuetrue` if iteration has passed the final\
    \ item and is complete.\n\n## Looping with for of\n"
