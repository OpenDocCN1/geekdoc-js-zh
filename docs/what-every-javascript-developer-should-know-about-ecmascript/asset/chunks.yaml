  trans: "\n\n首先，让我们通过构建自己的迭代器对象来让教室变得可迭代。这是解决该问题的硬核方法，在涵盖另外几个主题后，我们将看到更容易的方法。\n\n\
    ```javascript\nclass Classroom {\n    constructor() {\n        this.students =\
    \ [\"Tim\", \"Joy\", \"Sue\"];\n    }\n    [Symbol.iterator]() {\n        var\
    \ index = 0;\n        return {\n            next: () => {\n                if(index\
    \ < this.students.length){\n                    index += 1;\n                \
    \    return {done: false, value: this.students[index-1]};\n                }\n\
    \                return { value: undefined, done: true };\n            }\n   \
    \     }\n    }\n}\n```\n\n注意 `Symbol.iterator` 需要用方括号括起来方法名。方法内部是返回带有 `next` 方法对象的代码，而\
    \ `next` 方法返回带有 `done` 和 `value` 属性的对象。现在，教室的行为应该就像数组一样，并且可以在 `for...of` 循环中使用。\n\
    \n```javascript\nlet scienceClass = new Classroom();\nlet result = [];\nfor(let\
    \ name of scienceClass){\n    result.push(name);\n}\nexpect(result).toEqual([\"\
    Tim\", \"Joy\", \"Sue\"]);\n```\n\n教室迭代器方法内部的代码是适用于任何数组的代码。让我们将这些代码提取到一个新的类中。\n\
