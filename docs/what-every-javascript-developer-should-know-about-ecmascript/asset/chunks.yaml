  trans: "\n\n假设你需要调用该方法四次，并且每次调用 `calculate` 时，你都需要将上一次调的结果传递给下一次调用（这会模拟 HTTP API，其中你需要发送多个相互依赖的请求，以获取页面所需的所有数据）。使用\
    \ promise，这系列方法的调用可能如下所示。\n\n```javascript\nlet verify = function(result) {\n\
    \    expect(result).toBe(5);\n    done();\n};\n\ncalculate(1)\n    .then(calculate)\n\
    \    .then(calculate)\n    .then(calculate)\n    .then(verify);\n```\n\n上面的代码还（通过\
    \ Jasmine）验证了最终值为 5，因为 `calculate` 在每次被调用时都会在结果上加 1。代码之所以能够工作，是因为对 promise 的 `then`\
    \ 方法的每次调用都会返回一个新的 promise。你可能认为这种现象是因为 `calculate` 方法返回了一个新的 promise，但即使传递给 `then`\
    \ 方法的函数没有显式地产生 promise，新的 promise 也会出现。例如，让我们用一个简单返回 `result + 1` 的箭头函数替换其中一次对\
    \ `calculate` 的调用。\n\n```javascript\ncalculate(1)\n    .then(calculate)\n    .then(result\
    \ => result + 1)\n    .then(calculate)\n    .then(verify);\n```\n\n上述代码的结果仍然是值\
    \ 5，且带有箭头函数的 `then` 调用返回的对象仍然是一个 promise。`then` 方法会在必要时通过创建一个新的 promise 包装器来确保返回值是一个\
    \ promise。如果成功处理程序没有返回任何值，新的 promise 将将值 `undefined` 传递给下一个处理程序。\n\n# Promise\
    \ API\n\nJavaScript 中的 `Promise` 提供了几个你可以作为便利方法使用的静态方法。例如，如果你需要向一个调用者返回一个 promise，但你已经有一个值可以解析该\
    \ promise 而无需执行任何异步工作，那么 `resolve` 方法非常有用。\n\n```javascript\nlet doAsyncWork =\
    \ function () {\n    // 注意：没有实际执行的异步工作\n    return Promise.resolve(10);\n};\n\n\
    doAsyncWork().then(result => {\n    expect(result).toBe(10);\n    done();\n});\n\
    ```\n\n同样，`reject` 方法会将结果传递给错误处理程序。\n\n```javascript\nlet doAsyncWork = function\
    \ () {\n    return Promise.reject(\"error!\");\n};\n\ndoAsyncWork().then(() =>\
    \ { }, message => {\n    expect(message).toBe(\"error!\");\n    done();\n});\n\
    ```\n\n`race` 方法将多个 promise 合并为一个单一 promise。当第一个通过的 promise 解析时，该单一 promise 就会解析。这是一场看谁先完成的竞赛！\n\
    \n```javascript\nlet slowExecutor = function (resolve, reject) {\n    setTimeout(()\
    \ => {\n        resolve(9);\n    }, 250);\n};\n\nlet fastExecutor = function (resolve,\
    \ reject) {\n    setTimeout(() => {\n        resolve(6);\n    }, 100);\n};\n\n\
    let p1 = new Promise(slowExecutor);\nlet p2 = new Promise(fastExecutor);\nlet\
    \ p3 = Promise.race([p1, p2]);\np3.then(result => {\n    expect(result).toBe(6);\n\
    \    done();\n});\n```\n\n与 `race` 不同，`all` 方法将多个 promise 合并为一个单一 promise。当所有的\
    \ promise 都解析时，该单一 promise 就会解析。\n\n```javascript\nlet slowExecutor = function\
    \ (resolve, reject) {\n    setTimeout(() => {\n        resolve(9);\n    }, 250);\n\
    };\n\nlet fastExecutor = function (resolve, reject) {\n    setTimeout(() => {\n\
    \        resolve(6);\n    }, 100);\n};\n\nlet p1 = new Promise(slowExecutor);\n\
    let p2 = new Promise(fastExecutor);\nlet p3 = Promise.all([p1, p2]);\np3.then(result\
    \ => {\n    expect(result[0]).toBe(9);\n    expect(result[1]).toBe(6);\n    done();\n\
    });\n```\n\n合并的结果以数组的形式呈现。数组中的结果顺序与传递给 `all` 方法的 promise 顺序相同。当然，并不是所有的 promise\
    \ 都能成功解析，所以让我们谈谈错误处理。\n\n## Promise 错误\n\n异步代码中的错误通常需要数量大量的 `if else` 检查和对值的仔细检查。Promise\
    \ 允许异步代码应用结构化的错误处理。使用 promise 时，你可以向 `then` 方法传递一个错误处理程序，或者使用 `catch` 方法来处理错误。就像普通代码中的异常一样，异步代码中的错误或异常将跳转到最近的错误处理程序。\n\
    \n例如，让我们使用以下函数，它们将执行情况记录在一个字符串变量中。\n\n```javascript\nvar log = \"\";\nfunction\
    \ doWork() {\n    log += \"W\";\n    return Promise.resolve();\n}\n\nfunction\
    \ doError() {\n    log += \"E\";\n    throw new Error(\"oops!\");\n}\n\nfunction\
    \ catchHandler() {\n    log += \"T\";\n}\n\nfunction errorHandler(error) {\n \
    \   log += \"H\";\n}\n```\n\n我们将使用这些函数配合以下代码：\n\n```javascript\ndoWork()\n   \
    \ .then(doWork)\n    .then(doError)\n    .then(doWork) // 这行将被跳过\n    .then(doWork,\
    \ errorHandler)\n    .then(verify);\n\nfunction verify() {\n    expect(log).toBe(\"\
    WWEH\");\n    done();\n}\n```\n\n我们的预期是 `log` 变量将是 \"WWEH\"。当代码执行结束，`log` 变量包含\
    \ \"WWEH\"，这意味着我们看到了 `doWork`、`doError`、`errorHandler`。关于这个结果有两个观察点，一个是明显的，一个是微妙的。\n\
    \n第一个观察点是，当 `doError` 抛出异常时，执行会进入拒绝处理程序（`errorHandler`）并跳过任何成功处理程序。一旦你 promise\
    \ 视为将异步代码转换为过程流的工具，这种行为就是显而易见的。\n\n可能不显而易见的是，在处理了错误后，`verify` 函数会执行。正如同步代码在 `catch`\
    \ 语句后可以恢复正常执行一样，在 promise 中处理了错误后也可以恢复正常执行。请记住，`then` 方法总是返回一个新的 promise，除非错误处理程序显式地拒绝一个新的\
    \ promise，否则新的 promise 将成功解析。\n\npromise 对象还提供了一个 `catch` 方法来处理错误。我们可以用 `catch`\
    \ 语句如下重写最后的代码示例：\n\n```javascript\ndoWork()\n    .then(doWork)\n    .then(doError)\n\
    \    .then(doWork)\n    .catch(errorHandler)\n    .then(verify);\n```\n\n`catch`\
    \ 方法只接受拒绝处理程序方法。以下两个代码片段之间存在细微差异：\n\n`.then(doWork, errorHandler)`\n……以及……\n`.then(doWork)`\n\
    `.catch(errorHandler)`\n\n在第一个代码片段中，如果成功处理程序抛出异常或拒绝 promise，执行将进入错误处理程序，因为该 promise\
    \ 在此层已经解析了。通过 `catch`，你始终可以看到来自上一个成功处理程序的未处理错误。\n\n最后说明一点，如果你没有为 promise 操作设置任何错误处理程序而发生了错误，将没人知道！你可以通过以下行代码来模拟这种场景。\n\
    \n```javascript\nPromise.reject(\"error!\");\n```\n\n某些环境和 Promise 补丁会在开发者工具的控制台中显示消息来警告你未处理的拒绝。未处理的\
    \ promise 拒绝意味着你的应用程序可能丢失关键错误！\n\n# 模块\n\n避免全局作用一直是过去十年编写的每个库和框架的主要架构目标。在浏览器中避免全局作用意味着我们严重依赖闭包和诸如立即调用函数表达式（IIFE）之类的语法特性来提供封装。\n\
    \n```javascript\n(function() {\n    // 代码写在这里，在 IIFE 内部\n}());\n```"
- fmt: "\nAfter NodeJS arrived on the scene in 2009, Node developers found themselves\
    \ creating larger code bases and consuming a larger number of libraries. To manage\
    \ scope and dependency issues in this new environment, the Node community created\
    \ an unofficial standard we now call the CommonJS module standard. Shortly afterward,\
    \ another community standard, the Asynchronous Module Definition standard (AMD),\
    \ appeared for browser programming.\n\nES2015 brings an official module standard\
    \ to the JavaScript language. This module standard uses a different syntax than\
    \ both CommonJS and AMD, but tools like WebPack and runtime polyfills make all\
    \ of the module standards mostly interoperable. At the time of this writing, some\
    \ preprocessing or polyfills are required to make the new module syntax work.\
    \ Even though the syntax of the language is complete and standardized, the browser\
    \ APIs and behaviors for processing modules are still a work in progress.\n\n\
    # Why Modules?\n\nA module system allows JavaScript code to scale up in size.\
    \ Modules give us a tool to manage the complexity of a large code base by providing\
    \ just a few important features.\n\nFirst, modules in JavaScript are file based.\
    \ When using ES2015, instead of thinking about a script file, you should think\
    \ of a script module. A file is a module. By default, any code you write inside\
    \ the file is local to the module. Variables are no longer in the global scope\
    \ by default, and there is no need to write a function or an IIFE to control the\
    \ scope of a variable. Modules give us an implicit scope to hide implementation\
    \ details.\n\nOf course, some of the code you write in a module is code you might\
    \ want to expose as an API and consume from a different module. ES2015 provides\
    \ the `export` keyword for this purpose. Any object, function, class, or variable\
    \ that you want to make available to the outside world is something you must explicitly\
    \ export with the `export` keyword.\n\nIn a second module, you would use the `import`\
    \ keyword to consume some or all of the exports from the first module.\n\nModules\
    \ allow us to spread code across multiple files and directories while still being\
    \ able to reference and use components across files without going through a global\
    \ mediator. Perhaps no other feature listed in this book will have as much of\
    \ the impact on the architecture of applications, frameworks, and libraries as\
    \ modules. Let’s look at the syntax.\n\n# Module Syntax\n\nImagine you want to\
    \ use an object that represents a person, and in a file named `humans.js` you\
    \ place the following code.\n\n```javascript\nfunction work(name) {\n    return\
    \ `${name} is working`;\n}\n\nexport let person = {\n    name: \"Scott\",\n  \
    \  doWork() {\n        return work(this.name);\n    }\n}\n```\n\nSince we are\
    \ working with modules, the `work` function remains hidden in the module scope,\
    \ and no code outside of the module will have access to the `work` function. The\
    \ `person` variable is an export of the module. More specifically, we call `person`\
    \ a named export. Code inside of other modules can import `person` and work with\
    \ the referenced object.\n\n```javascript\nimport {person} from \"./lib/humans\"\
    \n\ndescribe(\"The humans module\", function() {\n    it(\"should have a person\"\
    , function() {\n        expect(person.doWork()).toBe(\"Scott is working\");\n\
    \    });\n});\n```\n\nThere are a few points to make about the previous code snippet.\n\
    \nFirst, notice the module name `./lib/humans` does not require a `.js` extension.\
    \ The filename is `humans.js`, but the module name for the file is `humans`.\n\
    \nSecondly, the `humans` module is in a subfolder of the test code in this example.\
    \ Thus, the module specifier includes a relative path to the module (`./lib/humans`).\n\
    \nFinally, curly braces enclose the import list from the `humans` module. The\
    \ imports are a list because you can import more than one named export from another\
    \ module. For example, if the `humans` module also exported the `work` function,\
    \ the test code could have access to both exports with the following code.\n\n\
    ```javascript\nimport {person, work} from \"./lib/humans\"\n```\n\nYou also have\
    \ the ability to alias an import to a different name.\n\n```javascript\nimport\
    \ {person as scott, work} from \"./lib/humans\"\n\ndescribe(\"The humans module\"\
    , function() {\n    it(\"should have a person\", function() {\n        // now\
    \ using scott instead of person\n        expect(scott.doWork()).toBe(\"Scott is\
    \ working\");\n    });\n    it(\"should have a work function\", function() {\n\
    \        expect(work).toBeDefined();\n    });\n});\n```\n\nIn addition to exporting\
    \ variables, objects, and functions, you can also export a class. Imagine the\
    \ `humans` module with the following code.\n\n```javascript\nfunction work(name)\
    \ {\n    return `${name} is working`;\n}\n\nexport class Person {\n    constructor(name)\
    \ {\n        this.name = name;\n    }\n    doWork() {\n        return work(this.name);\n\
    \    }\n}\n```\n\nNow the test code would look like this.\n\n```javascript\nimport\
    \ {Person} from \"./lib/humans\"\ndescribe(\"The humans module\", function() {\n\
    \    it(\"should have a person class\", function() {\n        var person = new\
    \ Person(\"Scott\");\n        expect(person.doWork()).toBe(\"Scott is working\"\
    );\n    });\n});\n```\n\nModules can also export a list of symbols using curly\
    \ braces. As an example, we could rewrite the `humans` module and place all the\
    \ exports in one location at the bottom of the file.\n\n```javascript\nfunction\
    \ work(name) {\n    return `${name} is working`;\n}\n\nclass Person {\n    constructor(name)\
    \ {\n        this.name = name;\n    }\n    doWork() {\n        return work(this.name);\n\
    \    }\n}\n\nexport {Person, work as worker }\n```\n\nNotice how an export list\
    \ can alias the name of an export, so the `work` function exports as `worker`.\n\
    \n### Default Exports\n\nThe 2015 module standard allows each module to have a\
    \ single default export. A module can have a default export and still export other\
    \ names, but having a default export does impact how another module will import\
    \ the default. First, here is how the `humans` module would look with a default\
    \ export of the `Person` class.\n\n```javascript\nfunction work(name) {\n    return\
    \ `${name} is working`;\n}\n\nexport default class Person {\n    constructor(name)\
    \ {\n        this.name = name;\n    }\n    doWork() {\n        return work(this.name);\n\
    \    }\n}\n```\n\nAs the code demonstrates, the default export for a module uses\
    \ the `default` keyword.\n\nA module who needs to import the default export of\
    \ another module doesn’t specify a binding list with curly braces for the default\
    \ export. Instead, the module simply defines a name for the incoming default,\
    \ and the name doesn’t need to match the name used inside the exporting module.\n\
    \n```javascript\nimport Human from \"./lib/humans\"\ndescribe(\"The humans module\"\
    , function() {\n    it(\"should have a default export as a class\", function()\
    \ {\n        var person = new Human(\"Scott\");\n        expect(person.doWork()).toBe(\"\
    Scott is working\");\n    });\n});\n```\n\n### Mass Exportation and Importation\n\
    \nAn import statement can use an asterisk to capture all the named exports of\
    \ a module. Let’s change the `humans` module once again to export the `Person`\
    \ class both as a named export and as a default export.\n\n```javascript\nexport\
    \ function work(name) {\n    return `${name} is working`;\n}\n\nexport class Person\
    \ {\n    constructor(name) {\n        this.name = name;\n    }\n    doWork() {\n\
    \        return work(this.name);\n    }\n}\n\nexport default Person;\n```\n\n\
    The test code can now have access to all the named exports of the `humans` module\
    \ using `*`. Access to the exports will happen through the `humans`, which behaves\
    \ much like a namespace in other languages.\n\n```javascript\nimport * as humans\
    \ from \"./lib/humans\"\ndescribe(\"The humans module\", function() {\n    it(\"\
    should have a person class\", function() {\n        var person = new humans.Person(\"\
    Scott\");\n        expect(person.doWork()).toBe(\"Scott is working\");\n    });\n\
    });\n```\n"
  raw: 'After NodeJS arrived on the scene in 2009, Node developers found themselves
    creating larger code bases and consuming a larger number of libraries. To manage
    scope and dependency issues in this new environment, the Node community created
    an unofficial standard we now call the CommonJS module standard. Shortly afterward,
    another community standard, the Asynchronous Module Definition standard (AMD),
    appeared for browser programming.


    ES2015 brings an official module standard to the JavaScript language. This module
    standard uses a different syntax than both CommonJS and AMD, but tools like WebPack
    and runtime polyfills make all of the module standards mostly interoperable. At
    the time of this writing, some preprocessing or polyfills are required to make
    the new module syntax work. Even though the syntax of the language is complete
    and standardized, the browser APIs and behaviors for processing modules are still
    a work in progress.


    ## Why Modules?


    A module system allows JavaScript code to scale up in size. Modules give us a
    tool to manage the complexity of a large code base by providing just a few important
    features.


    First, modules in JavaScript are file based. When using ES2015, instead of thinking
    about a script file, you should think of a script module. A file is a module.
    By default, any code you write inside the file is local to the module. Variables
    are no longer in the global scope by default, and there is no need to write a
    function or an IIFE to control the scope of a variable. Modules give us an implicit
    scope to hide implementation details.


    Of course, some of the code you write in a module is code you might want to expose
    as an API and consume from a different module. ES2015 provides theexport keyword
    for this purpose. Any object, function, class, or variable that you want to make
    available to the outside world is something you must explicitly exportwith theexport
    keyword.


    In a second module, you would use theimport keyword to consume some or all of
    the exports from the first module.


    Modules allow us to spread code across multiple files and directories while still
    being able to reference and use components across files without going through
    a global mediator. Perhaps no other feature listed in this book will have as much
    of an impact on the architecture of applications, frameworks, and libraries as
    modules. Let’s look at the syntax.


    ## Module Syntax


    Imagine you want to use an object that represents a person, and in a file named
    humans.js you place the following code.


    function work(name) {


                  return `${name} is working`;


    }


    export let person = {


                  name: "Scott",


                  doWork() {


                                return work(this.name);


                  }


    }


    Since we are working with modules, theworkfunction remains hidden in the module
    scope, and no code outside of the module will have access to theworkfunction.
    Theperson variable is an export of the module. More specifically, we call person
    a named export. Code inside of other modules can import person and work with the
    referenced object.


    import {person} from "./lib/humans"


    describe("The humans module", function() {             


        it("should have a person", function() {


            expect(person.doWork()).toBe("Scott is working");


        });


    });


    There are a few points to make about the previous code snippet.


    First, notice the module name./lib/humans does not require a .js extension. The
    filename is humans.js, but the module name for the file ishumans.


    Secondly, the humans module is in a subfolder of the test code in this example.
    Thus, the module specifier includes a relative path to the module (./lib/humans).


    Finally, curly braces enclose the import list from the humans module. The imports
    are a list because you can import more than one named export from another module.
    For example, if the humans module also exported the work function, the test code
    could have access to both exports with the following code.


    import {person, work} from "./lib/humans"


    You also have the ability to alias an import to a different name.


    import {person as scott, work} from "./lib/humans"


    describe("The humans module", function() {


                  it("should have a person", function() {


                                // now using scott instead of person


                                expect(scott.doWork()).toBe("Scott is working");


                  });


                  it("should have a work function", function() {


                                expect(work).toBeDefined();


                  });


    });


    In addition to exporting variables, objects, values, and functions, you can also
    export a class. Imagine the humans module with the following code.


    function work(name) {


        return `${name} is working`;


    }


    export class Person {


        constructor(name) {


            this.name = name;


        }


        doWork() {


            return work(this.name);


        }


    }


    Now the test code would look like the following.


    import {Person} from "./lib/humans"


    describe("The humans module", function() {             


        it("should have a person class", function() {


            var person = new Person("Scott");


                  expect(person.doWork()).toBe("Scott is working");


        });


    });


    Modules can also export a list of symbols using curly braces. As an example, we
    could rewrite the humans module and place all the exports in one location at the
    bottom of the file.


    function work(name) {


        return `${name} is working`;


    }


    class Person {


        constructor(name) {


            this.name = name;


        }


        doWork() {


            return work(this.name);


        }


    }


    export {Person, work as worker }


    Notice how an export list can alias the name of an export, so theworkfunction
    exports with the nameworker.


    ### Default Exports


    The 2015 module standard allows each module to have a single default export. A
    module can have a default export and still export other names, but having a default
    export does impact how another module will import the default. First, here is
    how the humans module would look with a default export ofthePerson class.


    function work(name) {


                  return `${name} is working`;


    }


    export default class Person {


                  constructor(name) {


                                this.name = name;


                  }


                  doWork() {


                                return work(this.name);


                  }


    }


    As the code demonstrates, the default export for a module uses thedefault keyword.


    A module who needs to import the default export of another module doesn’t specify
    a binding list with curly braces for the default export. Instead, the module simply
    defines a name for the incoming default, and the name doesn’t need to match the
    name used inside the exporting module.


    import Human from "./lib/humans"


    describe("The humans module", function() {


                  it("should have a default export as a class", function() {


                                var person = new Human("Scott");


                                expect(person.doWork()).toBe("Scott is working");


                  });


    });


    ### Mass Exportation and Importation


    An import statement can use an asterisk to capture all the named exports of a
    module. Let’schange the humans module once again to export thePerson class both
    as a named export and as a default export.


    export function work(name) {


        return `${name} is working`;


    }


    export class Person {


        constructor(name) {


            this.name = name;


        }


        doWork() {


            return work(this.name);


        }


    }


    export default Person;


    The test code can now have access to all the named exports of the humansmodule
    usingimport *. Access to the exports will happen through thehumans, which behaves
    much like a namespace in other languages.


    import * as humans from "./lib/humans"


    describe("The humans module", function() {


        it("should have a person class", function() {


            var person = new humans.Person("Scott");


                  expect(person.doWork()).toBe("Scott is working");


        });'
