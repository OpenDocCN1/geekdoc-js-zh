    # Asynchronous JavaScript


    Asynchronous programming has been a hallmark of JavaScript programming since the
    beginning. Examples include waiting for button clicks, waiting for timers to expire,
    and waiting for network communications to complete. For most of JavaScript’s life,
    we’ve implemented these waiting activities using callback functions.


    let calculate = function(callback) {


        setTimeout(() => {


           callback("This is the result");


        }, 0);


    };


