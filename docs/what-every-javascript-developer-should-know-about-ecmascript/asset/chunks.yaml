    ## Inheritance


    Over the years, there have been various approaches to building class hierarchies
    in JavaScript. All these approaches worked by stitching together constructor functions
    and prototype objects and each approach was slightly different from the others.


    ES2015allows for a declarative, consistent approach to inheritance using theclassandextends
    keywords. As an example, let’s start with a simple class to represent a person
    with a name.


    class Person {           


         get name() {


             return this._name;


         }


         set name(newName){


             if(newName){


                  this._name = newName;


             }


         }


    }


    var p1 = new Person();


    p1.name = "Scott";


    expect(p1.name).toBe("Scott");


    Now we also need a class to represent an employee who has both a name and a title.
    Using theextendskeyword, we can have anEmployeeclass inherit from thePersonclass,
    meaning every object instantiated as anEmployee will also have all the methods
    and properties available foraPerson.


    class Employee extends Person {


        get title() {


            return this._title;


        }


        set title(newTitle) {


            this._title = newTitle;


        }


    }


    var e1 = new Employee();


    e1.name = "Scott"; // inherited from Person


    e1.title = "Developer";


    expect(e1.name).toBe("Scott");


    expect(e1.title).toBe("Developer");


    expect(e1 instanceof Employee).toBe(true);


    expect(e1 instanceof Person).toBe(true);


    When describing the relationship betweenEmployeeandPersonwe often sayPerson is
    a super  classofEmployee, whileEmployee is a sub classofPerson. We can also say
    that every employee is aperson, and as you can see in the above code, theinstanceofcheck
    in JavaScript confirms that an object created using theEmployee class is also
    an instance ofPerson.


    While everyEmployeeobject will inherit all the state and behavior of aPerson,
    theEmployee class also has the ability to override the methods and properties
    defined byPerson. For this example, let’sadd adoWorkmethod to everyPerson.


    class Person {


        get name() {


            return this._name;


        }


        set name(newName){


            if(newName){


                this._name = newName;


            }


        }


        doWork() {


            return this.name + " works for free";


        }


    }


    var p1 = new Person();


    p1.name = "Scott";


    expect(p1.doWork()).toBe("Scott works for free");


    By default, anEmployee will behave the sameas aPerson.


    var e1 = new Employee();


    e1.name = "Scott";


    e1.title = "Developer";


    expect(e1.doWork()).toBe("Scott works for free");


    However, in theEmployee class we can override the behavior ofdoWork by providing
    a new implementation.


    class Employee extends Person {


        get title() {


            return this._title;


        }


        set title(newTitle) {


            this._title = newTitle;


        }


        doWork() {


            return this.name + " works for a salary";


        }


    }


    var p1 = new Person();


    p1.name = "Scott";


    expect(p1.doWork()).toBe("Scott works for free");


    var e1 = new Employee();


    e1.name = "Scott";


    e1.title = "Developer";


    expect(e1.doWork()).toBe("Scott works for a salary");


    As the test proves, objects instantiated from theEmployee class will behave slightly
    differently in the doWork method than objects instantiated from thePerson class.
    In object-oriented programming, we call this behavior polymorphism.


    ## Using Super


    There are times when a class will want to invoke behavior in its super class directly,
    which can be done with thesuperkeyword. For example, the Employee class could
    implement thedoWork method as follows.


    doWork() {


        return super() + "!";


    }


    Invokingsuper will execute the super class method of the same name, so with the
    above code a passing test would look like the following.


    var e1 = new Employee();


    e1.name = "Alex";


    e1.title = "Developer";


    expect(e1.doWork()).toBe("Alex works for free!");


    A class can also refer explicitly to any method in the super class.


    doWork() {


         return super.doWork() + "!";


    }


    ## Super Constructors


    One common scenario for usingsuperis when inheriting from a class that requires
    constructor parameters. The followingPerson class now accepts a name parameter
    during initialization.


    class Person {


        constructor(name) {


            this._name = name;


        }


        get name() {


            return this._name;


        }


    }


    Now an employee will need both a title and a name during initialization.


    class Employee extends Person {


        constructor(name, title) {


            super(name);


             this._title = title;


        }


        get title() {


            return this._title;


        }


    }


    Notice how theEmployee  constructormethod usessuper to pass along the name parameter
    to thePerson  constructor and reuse the logic inside the super class.


    ## The Caveat


    Now that we know what inheritance looks like in ES2015, it’s time for a word of
    caution. Inheritance is a fragile technique to achieve re-use that only works
    well in a limited number of scenarios. Do a search for “composition over inheritance”
    to see more details and be wary of misusing inheritance.


