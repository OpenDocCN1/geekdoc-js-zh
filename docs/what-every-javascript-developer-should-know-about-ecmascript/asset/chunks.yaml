    Over the years, as JavaScript applications grew in complexity, unofficial specifications
    started to emerge for a different approach to asynchronous programming using promises.
    A promise is an object that promises to deliver a result in the future. Promises
    are now an official part of the JavaScript language and offer advantages over
    the callback approach to asynchronous programming. Error handling is often easier
    using promises, and promises make it easier to compose multiple operations together.
    These advantages make code easier to read and write, and we’ll see these advantages
    in the next section.


    ## Promise Objects


    We need to look at promises from two different perspectives. One perspective is
    the perspective of the code consuming a promise. A promise consumer uses a promise
    to wait for an asynchronous activity to complete. Another perspective is the perspective
    of a promise producer. A producer uses a promise to deliver the results of an
    asynchronous operation. Let’s start by looking at a producer.


