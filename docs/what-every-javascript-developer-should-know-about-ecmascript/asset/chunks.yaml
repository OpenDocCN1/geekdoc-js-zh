    \ JavaScript 的函数式编程能力。此外，`2015` 还引入了与函数式编程密切相关的新特性，如迭代器（iterators）和惰性求值。让我们通过箭头函数来观察这些新功能，对于任何接触过\
    \ CoffeeScript 或 C# 代码的人来说，它看起来都很熟悉。\n\n# 箭头函数\n\n箭头函数是一种具有简洁语法的函数表达式。箭头函数不需要\
    \ `function` 关键字、大括号或 `return` 语句。然而，箭头函数需要一种新的运算符 `=>`，它看起来像一个指向右侧的箭头，并为这些表达式命名。要构建一个用于两个数字相和的箭头函数，只需编写以下代码：\n\
    \n```\nlet add = (x,y) => x + y;\n```\n\n箭头的左侧是函数的参数列表。在这个例中，有两个参数`x`和`y`。箭头的右侧是函数的待执行代码。在这种情况下，代码返回`x`和`y`之和。你可以将箭头理解为将参数指向使用它们的代码。\n\
    \n调用箭头函数看起来与调用传统函数没有区别。\n\n```\nlet result = add(3, 5);\n\nexpect(result).toBe(8);\n\
    ```\n\n仅使用一个函数参数的箭头函数不需要在参数周围加上括号。\n\n```\nlet square = x => x * x;\n```\n\n如果箭头函数需要零个参数或多个参数，则必须使用括号。\n\
    \n```\nlet add = (x,y) => x + y;             // 必须有括号\nlet square = x => x * x;\
    \             // 括号可选\nlet compute = () => square(add(5,3)); // 必须有括号\n\nlet result\
    \ = compute();\n\nexpect(result).toBe(64);\n```\n\n到为止，示例在箭头运算符右侧都使用单个表达式。当使用单个表达式时，不需要大括号和\
    \ `return` 语句。函数的返回值将是该表达式的值。\n\n然而，箭头函数可以包含更复杂的语句块，但这种方法需要大括号和显式的 `return`（如果函数想要返回一个值）。\n\
    \n```\nlet add = (x,y) => {\n    var result = x + y;\n    return result;\n};\n\
    ```\n\n## 箭头函数与 this\n\n每个 JavaScript 程序员都知道 `this` 指针有点难以捉摸。考虑以下类中的代码，特别是 `doWork`\
    \ 内部的代码。\n\n```javascript\nclass Person {\n    constructor(name) {\n        this.name\
    \ = name;\n    }\n    doWork(callback) {\n        setTimeout(function() {\n  \
    \          callback(this.name);\n        }, 15);\n    }\n}\n```\n\n`doWork` 方法传递给\
    \ `setTimeout` 的匿名函数的执行上下文与 `doWork` 本身不同，这意味着`this` 引用会发生。当匿名函数将 `this.name`\
    \ 传递给 `callback` 时，`this` 将不再指向 person 对象，下面的测试将会失败。\n\n```javascript\nvar person\
    \ = new Person(\"Scott\");\nperson.doWork(function(result) {\n    expect(result).toBe(\"\
    Scott\"); // 失败！\n    done();\n});\n```\n\n由于在涉及异步代码和回调时，开发者永远无法依赖 JavaScript\
    \ 的 `this` 引用，一种常见的做法是将`this`的值捕获在一个局部变量中，并用该变量代替`this`。捕获`this`的常用变量名有`self`、`me`或`that`。\n\
    \n```javascript\ndoWork(callback) {\n    var self = this;\n    setTimeout(function()\
    \ {\n        callback(self.name);\n    }, 15);\n}\n```\n\n得益于变量`self` 捕获了`this`引用，上面的代码将通过。\n\
    \n如果我们在 `doWork` 中使用箭头函数，就不再需要捕获`this`引用。\n\n```javascript\ndoWork(callback) {\n\
    \    setTimeout(() => callback(this.name), 15);\n}\n```\n\n之前的测试将通过，因为箭头函数会自动从外部父函数中捕获`this`的值。换句话说，箭头函数内部的`this`值始终与箭头所在闭包函数中的`this`值相同。不再需要使用`self`或`that`，你可以任意深度地嵌套箭头函数，以便在一系列异步操作中保留`this`。\n\
    \n## 每天使用箭头函数\n\n如果你接受了箭头函数的语法，你可能会发现自己每三行代码就会用一次箭头函数。JavaScript 对异步操作的偏睐创建了大量需要回调函数的\
    \ API。然而，由于 JavaScript 是一门强大的函数式编程语言，也出现了越来越多带有函数的同步 API。\n\n例如，上一个版本的 ECMAScript\
    \ 在数组上引入了`forEach`和`map`方法。\n\n```javascript\nlet result = [1,2,3,4].map(n =>\
    \ n * 2);\nexpect(result).toEqual([2,4,6,8]);\n\nlet sum = 0;\n[1,2,3,4].forEach(n\
    \ => sum += n);\nexpect(sum).toBe(10);\n```\n\n还有许多库（Underscore 和 Lodash 是两个）使用高阶函数来实现过滤、排序和分组。\n\
    \n```javascript\nlet characters = [\n    { name: \"barney\", age: 36, blocked:\
    \ false },\n    { name: \"fred\", age: 40, blocked: true },\n    { name: \"pebbles\"\
    , age: 1, blocked: false }\n];\n\nlet result = _.find(characters, function(character)\
    \ {\n    return character.age < 40;\n});\n```\n\n使用箭头函数后，结果计算变得具表现力。\nlet result\
    \ = _.find(characters, character => character.age < 40);\nexpect(result.name).toBe(\"\
    barney\");\n\nit(\"can work with Jasmine\", () => {\n    var numbers = [1,3,4];\n\
    \    expect(numbers.length).toBe(3);\n});\n```\n\n最后几个示例都是针对数组操作的，数组是一种集合类型。`2015`还为\
    \ JavaScript 引入了迭代器（iterators）和迭代器（iterables）的概念，这些新特性将使集合操作变得明显灵活且可靠。\n\n# 迭代器\n\
    \n`2015` 中迭代器的引入为 JavaScript 开启了新的算法和能力世界。迭代器是一个允许代码遍历对象序列的对象。对象序列可以是数组内部的值，也可以是复杂数据结构（如树或\
    \ map）中的值。迭代器的许多优秀特性之一是迭代器不需要了解底层集合的任何细节。迭代器做的只是提供一次遍历序列的能力。\n\n你可能在奇怪为什么我们在关于函数式编程的章节中讨论迭代器。稍后我们会解释，但简单来说，迭代器与许多函数式编程范式配合良好，包括惰性求值和函数组合。在讨论这些主题之前，让我们看看迭代器的基本特性。\n\
    \n在 `ES6` 中，数组对象可以使用一些新方法，其中一个方法就是`values` 方法。`values` 方法返回一个可以访问数组中每个值的迭代器对象。\n\
    \n```javascript\nlet sum = 0;\nlet numbers = [1,2,3,4];\nlet iterator = numbers.values();\n\
    let next = iterator.next();\n\nwhile(!next.done){\n    sum += next.value;\n  \
    \  next = iterator.next();\n}\n\nexpect(sum).toBe(10);\n```\n\n迭代器是一个具有`next`方法的对象。程序每次调用`next`方法，该方法都会返回一个包含两个属性的对象：`value`和`done`。`value`属性代表迭代器当前在集合中访问的项目。`done`属性是一个标志位，如果还有项目可以访问，其值为`false`；如果已经过了最后一个项目并完成，则值为`true`。\n\
    \n## 使用 for of 循环\n\n"
- fmt: "\nWorking with iterators at a low level will sometimes be useful, as we’ll\
    \ see in this chapter, but 2015 also provides a new looping syntax to work with\
    \ iterators at a higher level – the `for of` loop.\n\n```javascript\nlet sum =\
    \ 0;\nlet numbers = [1,2,3,4];\nfor(let n of numbers) {\n    sum += n;\n}\nexpect(sum).toBe(10);\n\
    ```\n\nThere are a couple of observations to make about the above code.\n\nFirst,\
    \ the new `for of` loop looks like the `for in` loop which has always been in\
    \ JavaScript, but the two loops behave differently. The `for in` loop works with\
    \ the enumerable properties of any object. When working with an array, `for in`\
    \ will iterate over the available indexes of the array, not the available values.\
    \ To compute the same sum as the above code with `for in`, we’d need to index\
    \ into the array with each iteration:\n\n```javascript\nlet sum = 0;\nlet numbers\
    \ = [1,2,3,4];\nfor(let i in numbers) {\n    sum += numbers[i]; // notice the\
    \ indexer\n}\nexpect(sum).toBe(10);\n```\n\nThe `for of` loop uses an iterator\
    \ to visit the values in an array, not the available keys.\n\n```javascript\n\
    for(let n of numbers) {\n    sum += n;\n}\n```\n\nThis brings up the second subtle\
    \ difference with `for of`. The `for of` loop only works with iterable objects.\
    \ Iterable objects are objects with a special method returning an iterator. We’ll\
    \ look at the special method soon, but notice how the last code snippet doesn’t\
    \ need to use the `values` method of the array like the low level iterator code\
    \ we wrote previously. Instead, the `for of` loop uses the `numbers` array directly.\n\
    \nThere are many objects in the world of ES6 that will be iterable objects, and\
    \ we will see more in this book. We’ve already seen how arrays are iterable. Strings\
    \ are also iterable, meaning you can iterate over the sequence of characters inside.\n\
    \n```javascript\nlet result = \"\";\nlet message = \"Hello\";\nfor(let c of message)\
    \ {\n    result += c;\n}\nexpect(result).toBe(\"Hello\");\n```\n\nHow does `for\
    \ of` retrieve an iterator? What makes an object iterable? To answer these two\
    \ questions we have to take a brief detour into another new feature of ES2015\
    \ – the `symbol`.\n\n## Symbols\n\nA symbol is a new, primitive data type in ES2015.\
    \ There are two key points to understand about symbols.\n\n1. Every symbol is\
    \ unique and immutable.\n2. You can use symbols as identifiers when adding properties\
    \ to an object.\n\nTo understand the implications of these two statements, and\
    \ how they relate to iterable objects, let’s start by creating a new symbol. Creating\
    \ a new symbol is as easy as invoking the `Symbol` function.\n\n```javascript\n\
    let s = Symbol();\nexpect(typeof s).toBe(\"symbol\");\n```\n\nNote that you do\
    \ not use the `new` operator when creating a symbol. To create a symbol you invoke\
    \ the `Symbol` function. Otherwise, the runtime will raise an exception.\n\n```javascript\n\
    let makeSymbol = () => new Symbol();\nexpect(makeSymbol).toThrow();\n```\n\nEach\
    \ symbol you create is unique and unchangeable.\n\n```javascript\nlet s1 = Symbol();\n\
    let s2 = Symbol();\nexpect(s1).toEqual(s1);\nexpect(s1).not.toEqual(s2);\n```\n\
    \nWhen you create a symbol, you can add a description by passing a string to the\
    \ `Symbol` function, but symbols created with the same description will still\
    \ be unique, even if the stringified versions look the same.\n\n```javascript\n\
    let s1 = Symbol(\"some desciption\");\nlet s2 = Symbol(\"some description\");\n\
    expect(s1).toEqual(s1);\nexpect(s1).not.toEqual(s2);\nexpect(s1.toString()).toBe(\"\
    Symbol(some description)\");\nexpect(s2.toString()).toBe(\"Symbol(some description)\"\
    );\n```\n\nYou can use symbols as keys into an object. In the following code,\
    \ we create one property using `lastName`, and we create another property with\
    \ a symbol (the `firstName` symbol).\n\n```javascript\nlet firstName = Symbol();\n\
    let person = {\n    lastName: \"Allen\",\n    [firstName]: \"Scott\",\n};\nexpect(person.lastName).toBe(\"\
    Allen\");\nexpect(person[firstName]).toBe(\"Scott\");\n```\n\nBecause symbols\
    \ are unique, a symbol can create a unique property inside an object. You never\
    \ have to worry about conflicting with existing methods, or being accidently overwritten.\
    \ ES5 libraries would use property names with timestamps or random numbers to\
    \ achieve this same effect, but symbols provide a safer guarantee.\n\nMembers\
    \ of an object created using a symbol will not appear as part of the object when\
    \ using a `for in` loop.\n\n```javascript\nlet firstName = Symbol();\nlet person\
    \ = {\n    lastName: \"Allen\",\n    [firstName]: \"Scott\",\n};\nlet names =\
    \ [];\nfor(var p in person) {\n    names.push(p);\n}\nexpect(names.length).toBe(1);\n\
    expect(names[0]).toBe(\"lastName\");\n```\n\nSymbols also won’t appear when using\
    \ `Object.getOwnPropertyNames`.\n\n```javascript\nexpect(Object.getOwnPropertyNames(person)).toEqual([\"\
    lastName\"]);\n```\n\nNor will they appear when serializing an object to JSON.\n\
    \n```javascript\nexpect(JSON.stringify(person)).toBe('{\"lastName\":\"Allen\"\
    }');\n```\n\nFor these reasons, you might think symbols are useful for hiding\
    \ information in an object. Although using symbols to hide information is useful,\
    \ there is a new object method named `getOwnPropertySymbols` that will allow programmers\
    \ to reflect into hidden symbol properties.\n\n```javascript\nexpect(Object.getOwnPropertySymbols(person)).toEqual([firstName]);\n\
    let symbol0 = Object.getOwnPropertySymbols(person)[0];\nexpect(person[symbol0]).toBe(\"\
    Scott\");\n```\n\nNow that we know more about symbols, let’s see how symbols relate\
    \ to iterable objects.\n\n### Iterables and Symbols\n\nThe ES2015 specification\
    \ defines several well-known symbols. The JavaScript runtime environment uses\
    \ well-known symbols in the algorithms described by the specification, and each\
    \ well-known symbol is a property on the `Symbol` function itself.\n\nOne such\
    \ well-known symbol is `Symbol.iterator`. If we can access the `Symbol.iterator`\
    \ member of an object, the member should be a method we can use to obtain an iterator.\
    \ The following code will check to see if strings, arrays, and numbers are iterable\
    \ by looking for this well-known iterator symbol.\n\n```javascript\nlet site =\
    \ \"OdeToCode.com\";\nlet values = [1,2,3,4];\nlet number = 45;\nexpect(site[Symbol.iterator]).toBeDefined();\n\
    expect(values[Symbol.iterator]).toBeDefined();\nexpect(number[Symbol.iterator]).toBeUndefined();\n\
    ```\n\nThe tests prove that strings and arrays are iterable, but a number is not.\n\
    \nWhen we use `for of` loop, like in the following code, the JavaScript runtime\
    \ uses `Symbol.iterator` behind the scenes to obtain the iterator.\n\n```javascript\n\
    let sum = 0;\nlet numbers = [1,2,3,4];\nfor(let n of numbers) {\n    sum += n;\n\
    }\nexpect(sum).toBe(10);\n```\n\nWe can rewrite the code to represent what is\
    \ happening behind the scenes.\n\n```javascript\nlet sum = 0;\nlet numbers = [1,2,3,4];\n\
    let iterator = numbers[Symbol.iterator]();\nlet next = iterator.next();\nwhile(!next.done)\
    \ {\n    sum += next.value;\n    next = iterator.next();\n}\nexpect(sum).toBe(10);\n\
    ```\n\nUsing your knowledge of symbols to write low-level iterator code isn’t\
    \ exciting, but using symbols to make new iterable objects is exciting.\n\n##\
    \ Creating Iterables\n\nImagine you are building an abstraction for a classroom,\
    \ and one responsibility of a classroom object is to encapsulate the names of\
    \ the students in the classroom. You might build a class like the following.\n\
    \n```javascript\nclass Classroom {\n    constructor() {\n        this.students\
    \ = [\"Tim\", \"Joy\", \"Sue\"];\n    }\n}\n```\n\nOn occasion, the outside world\
    \ needs to know the names of the students inside the classroom. Perhaps the program\
    \ will show the names in a UI, or save the names in a database. In either case,\
    \ how should a classroom object give the student names to a caller?\n\nOne option\
    \ is to return a reference to the students array, in which case the caller might\
    \ change the array by adding or removing items. This option isn’t the best option\
    \ if the classroom wants to protect the array and validate the addition or removal\
    \ of a student.\n\nAnother option is to make a copy of the array. Even if a caller\
    \ changes the copy, the original student array remains safe. However, copy operations\
    \ can be expensive.\n\nWith ES2015, the classroom can now provide access to the\
    \ student names without handing out access to the underlying array. All we need\
    \ is to make the classroom iterable by adding a `Symbol.iterator` method.\n"
  raw: 'Working with iterators at a low level will sometimes be useful, as we’ll see
    in this chapter, but 2015 also provides a new looping syntax to work with iterators
    at a higher level – thefor of loop.


        let sum = 0;


        let numbers = [1,2,3,4];


        for(let n of numbers) {


            sum += n;


        }


        expect(sum).toBe(10);


    There are a couple observations to make about the above code.


    First, the newfor of loop looks like theforin loop which has always been in JavaScript,
    but the two loops behave differently. Theforin loop works with the enumerable
    properties of any object. When working with an array, for in  will iterate over
    the available indexes of the array, not the available values. To compute the same
    sum as the above code with  for in, we’d need to index into the array with each
    iteration:


    let sum = 0;


    let numbers = [1,2,3,4];


    for(let i in numbers) {


        sum += numbers[i]; // notice the indexer


    }


    expect(sum).toBe(10);


    Theforof loop uses an iterator to visit the values in an array, not the available
    keys.


    for(let n of numbers) {


        sum += n;


    }


    This brings up the second subtle difference with  for of. The forof loop only
    works with iterable objects. Iterable objects are objects with a special method
    returning an iterator. We’ll look at the special method soon, but notice how the
    last code snippetdoesn’t need to use thevalues method of the array like the low
    level iterator code we wrote previously. Instead, theforof loop uses the numbers
    array directly.


    There are many objects in the world of ES6 that will be iterable objects, and
    we will see more in this book. We’ve already seen how arrays are iterable. Strings
    are also iterable, meaning you can iterate over the sequence of characters inside.


    let result = "";


    let message = "Hello";


    for(let c of message) {


        result += c;


    }


    expect(result).toBe("Hello");


    How doesfor of retrieve an iterator? What makes an object iterable? To answer
    these two questions we have to take a brief detour into another new feature of
    ES2015 – the symbol.


    ## Symbols


    A symbol is a new, primitive data type in ES2015\. There are two key points to
    understand about symbols.


    1.  Every symbol is unique and immutable.


    2.  You can use symbols as identifiers when adding properties to an object.


    To understand the implications of these two statements, and how they relate to
    iterable objects, let’s start by creating a new symbol. Creating a new symbol
    is as easy as invoking the Symbol function.


    let s = Symbol();


    expect(typeof s).toBe("symbol");


    Note that you do not use thenew operator when creating a symbol. To create a symbol
    you invoke theSymbol function. Otherwise, the runtime will raise an exception.


    let makeSymbol = () => new Symbol();


    expect(makeSymbol).toThrow();


    Each symbol you create is unique and unchangeable.


    let s1 = Symbol();


    let s2 = Symbol();


    expect(s1).toEqual(s1);


    expect(s1).not.toEqual(s2);


    When you create a symbol, you can add a description by passing a string to theSymbol
    function, but symbols created with the same description will still be unique,
    even if the stringified versions look the same.


    let s1 = Symbol("some desciption");


    let s2 = Symbol("some description");


    expect(s1).toEqual(s1);


    expect(s1).not.toEqual(s2);


    expect(s1.toString()).toBe("Symbol(some description)");


    expect(s2.toString()).toBe("Symbol(some description)");


    You can use symbols as keys into an object. In the following code,we create one
    property usinglastName, and we create another property with a symbol (thefirstName
    symbol).


    let firstName = Symbol();


    let person = {


        lastName: "Allen",


        [firstName]: "Scott",


    };


    expect(person.lastName).toBe("Allen");


    expect(person[firstName]).toBe("Scott");


    Because symbols are unique, a symbol can create a unique property inside an object.
    You never have to worry about conflicting with existing methods, or being accidently
    overwritten. ES5 libraries would use property names with timestamps or random
    numbers to achieve this same effect, but symbols provide a safer guarantee.


    Members of an object created using a symbol will not appear as part of the object
    when using aforin loop.


    let firstName = Symbol();


    let person = {


        lastName: "Allen",


        [firstName]: "Scott",


    };


    let names = [];


    for(var p in person) {


        names.push(p);


    }


    expect(names.length).toBe(1);


    expect(names[0]).toBe("lastName");


    Symbols also won’tappear when usingObject.getOwnPropertyNames.


    expect(Object.getOwnPropertyNames(person)).toEqual(["lastName"]);


    Nor will they appear when serializing an object to JSON.


    expect(JSON.stringify(person)).toBe(''{"lastName":"Allen"}'');


    For these reasons, you might think symbols are useful for hiding information in
    an object. Although using symbols to hide information is useful, there is a new
    object method namedgetOwnPropertySymbols that will allow programmers to reflect
    into hidden symbol properties.


    expect(Object.getOwnPropertySymbols(person)).toEqual([firstName]);


    let symbol0 = Object.getOwnPropertySymbols(person)[0];


    expect(person[symbol0]).toBe("Scott");


    Now that we know more about symbols, let’s see how symbols relate to iterable
    objects.


    ### Iterables and Symbols


    The ES2015 specification defines several well-known symbols. The JavaScript runtime
    environment uses well-known symbols in the algorithms described by the specification,
    and each well-known symbol is a property on theSymbol function itself.


    One such well-known symbol isSymbol.iterator. If we can access theSymbol.iterator
    member of an object, the member should be a method we can use to obtain an iterator.
    The following code will check to see if strings, arrays, and numbers are iterable
    by looking for this well-known iterator symbol.


    let site = "OdeToCode.com";


    let values = [1,2,3,4];


    let number = 45;


    expect(site[Symbol.iterator]).toBeDefined();


    expect(values[Symbol.iterator]).toBeDefined();


    expect(number[Symbol.iterator]).toBeUndefined();


    The tests prove that strings and arrays are iterable, but a number is not iterable.


    When we use aforofloop, like in the following code, the JavaScript runtime usesSymbol.iterator
    behind the scenes to obtain the iterator.


    let sum = 0;


    let numbers = [1,2,3,4];


    for(let n of numbers) {


        sum += n;


    }


    expect(sum).toBe(10);


    We can rewrite the code to represent what is really happening behind the scenes.


    let sum = 0;


    let numbers = [1,2,3,4];


    let iterator = numbers[Symbol.iterator]();


    let next = iterator.next();


    while(!next.done) {


        sum += next.value;


        next = iterator.next();


    }


    expect(sum).toBe(10);


    Using your knowledge of symbols to write low-level iterator code isn’t exciting,
    but using symbols to make new iterable objects is exciting.


    ## Creating Iterables


    Imagine you are building an abstraction for a classroom, and one responsibility
    of a classroom object is to encapsulate the names of the students in the classroom.
    You might build a class like the following.


    class Classroom {


        constructor() {


            this.students = ["Tim", "Joy", "Sue"];


        }


    }


    On occasion, the outside world needs to know the names of the students inside
    the classroom. Perhaps the program will show the names in a UI, or save the names
    in a database. In either case, how should a classroom object give the student
    names to a caller?


    One option is to return a reference to the students array, in which case the caller
    might change the array by adding or removing items. This option isn’t the best
    option if the classroom wants to protect the array and validate the addition or
    removal of a student.


    Another option is to make a copy of the array. Even if a caller changes the copy,
    the original student array remains safe. However, copy operations can be expensive.


    With ES2015, the classroom can now provide access to the student names without
    handing out access to the underlying array. All we need is to make the classroom
    iterable by adding aSymbol.iterator method.'
