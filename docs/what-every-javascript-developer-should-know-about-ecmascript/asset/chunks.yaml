    # APIs


    In this final chapter I want to highlight new types and APIs I think are important.


    ## New Collections


    JavaScript has never offered a variety of data structures out of the box. If you
    needed any structure fancier than an array, you''d have to roll your own or borrow
    some code.


    The 2015 specification brings a number of keyed collections to the language, including
    theMap,Set,WeakMap, andWeakSet.


    ### Maps


    Although you can treat any JavaScript object as a dictionary or key-value store,
    there are some drawbacks. Most notably, the only type of key you can use to index
    into an object are keys with a string or symbol type. The newMap collection removes
    the restriction on key types and offers some additional conveniences. The core
    of the API revolves around the get and set methods.


    let map = new Map();


    // add a new key-value pair


    map.set("key", 301);


    // overwrite an existing value


    map.set("key", 302);


    expect(map.get("key")).toBe(302);


    Thedeleteandhas methods are also handy.


    let map = new Map();


    map.set("key", 611);


    expect(map.has("key")).toBe(true);


    map.delete("key");


    expect(map.has("key")).toBe(false);


    A key can now be any type of object.


    var someKey = { firstName: "Scott"};


    var someValue = { lastName: "Allen"};


    var map = new Map();


    map.set(someKey, someValue);


    expect(map.size).toBe(1);


    expect(map.get(someKey).lastName).toBe("Allen");


    expect(map.get({firstName:"Scott"})).toBeUndefined();


    When using objects as keys, JavaScript will compare pointers behind the scenes,
    as the above code demonstrates.


    You can also construct aMap using a two dimensional array of key-value pairs.


    let map = new Map([


        [1, "one"],


        [2, "two"],


        [3, "three"]


    ]);


    Finally, maps are iterable in a number of ways. You can retrieve an iterator for
    the keys in a map (using thekeysmethod), the values in a map (using thevaluesmethod),
    and the key-value entries in a map (using theentriesmethod, as you might have
    guessed). A map also has the magic [Symbol.iterator] method, so you can use aMap
    in aforof loop.


    let map = new Map([


        [1, "one"],


        [2, "two"],


        [3, "three"]


    ]);


    let sum = 0;


    let combined = "";


    for(let pair of map) {


        sum += pair[0];


        combined += pair[1];


    }


    expect(map.size).toBe(3);


    expect(sum).toBe(6);


    expect(combined).toBe("onetwothree");


    map.clear();


    expect(map.size).toBe(0);


    In thefor of loop, each entry comes out as an array with the key in index 0, and
    the value in index 1\. This is a scenario where array destructuring is handy.


    for(let [key, value] of map) {


        sum += key;


        combined += value;


    }


    ### Set


    Just like in mathematics, aSet maintains a collection of distinct objects. The
    API is slightly different fromMap. For example, you can construct a Set by passing
    in an iterator.


    let animals = ["bear", "snake", "elephant", "snake"];


    let animalsSet = new Set(animals.values());


    expect(animals.length).toBe(4);


    expect(animalsSet.size).toBe(3);


    expect(animalsSet.has("bear")).toBe(true);


    animalsSet.delete("bear");


    expect(animalsSet.size).toBe(2);


    Just like a map, a set compares object types by comparing references. Unlike other
    languages, there is no ability to provide an alternative comparer strategy.


    let scott = { name: "Scott "};


    let people = new Set();


    people.add(scott);


    people.add(scott);


    people.add( {name:"Scott"});


    expect(people.size).toBe(2);


    expect(people.has(scott)).toBe(true);


    expect(people.has({name:"Scott"})).toBe(false);


    ### Weak Collections


    TheWeakMapandWeakSetcollections serve a similar purpose to their non-weak counterparts,
    but the objects held in these collections are eligible for garbage collection
    at any given point in time, making these weak collections ideal for many extensibility
    scenarios. The special nature of weak collections means you cannot iterate over
    the collections, because an entry could disappear before the iteration completes.
    There are also some other small API differences. For example, the keys for aWeakMapand
    the values for aWeakSet can only be object types (no primitives like strings).
    In addition, there is no size method to uncover the number of entries in these
    collections.


    ## Arrays


    ES2015 adds a few new APIs to the built-in array, includingvalues,keys, andentries.
    These three methods all return iterators we can use to loop over the values inside
    an array, or the available keys, or each entry. Each entry will be an array itself,
    where the key is in index 0, and the value is in index 1.


    let names = ["Scott", "Alex"];


    let values = names.values();


    let keys = names.keys();


    let entries = names.entries();


    expect(values.next().value).toBe("Scott");


    expect(keys.next().value).toBe(0);


    expect(entries.next().value[1]).toBe("Scott");


    There are also new methods we can use to create arrays. Theofmethod constructs
    an array from a variable number of arguments, while thefrom method constructs
    an array from any iterable object.


    let numbers = Array.of(15, 11, 3);   


    expect(numbers.length).toBe(3);


    let squared = Array.from(numbers, n => n * n);


    expect(squared[2]).toBe(9);


    Finally,findandfindIndex are convenient methods for locating items in an array.
    The callback function for both of these methods can also take a second parameter
    to hold the index of the current item.


    let numbers = [15,11,3];


    let people = [{ name: "Scott"}, { name: "Allen"}];


    let eleven = numbers.find(n => n === 11);


    let index = people.findIndex(p => p.name === "Allen");


    expect(eleven).toBe(11);


    expect(index).toBe(1);


    ## Strings


    Strings also offer new convenience methods for locating substrings. These methods
    arestartsWith,endsWith, andincludes.


    let name = "porter";


    expect(name.startsWith("port")).toBe(true);


    expect(name.endsWith("er")).toBe(true);


    expect(name.includes("ort")).toBe(true);


    Strings are also iterable in ES2015.


    let name = "porter";


    for(let character of name) {


        expect(name.includes(character)).toBe(true);                                         


    }


    ## Objects


    TheObject.assignmethod will copy the property values of one or more source objects
    into a target object. Many frameworks over the years have included features to
    merge objects together, for example, jQuery’sextend function, but now this functionality
    in built into the runtime.


    let a = { a: 1};


    let b = { b: 2};                           


    let result = Object.assign({}, a, b);'
