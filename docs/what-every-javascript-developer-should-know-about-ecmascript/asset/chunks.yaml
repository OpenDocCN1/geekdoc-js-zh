    you need to pass the result from the previous call into the next call (this would
    simulate HTTP APIs where you need to make multiple requests, all dependent on
    one another, to fetch all of data required for a page). With promises, the series
    of method calls could look like the following.


    let verify = function(result) {


        expect(result).toBe(5);


        done();


    };


    calculate(1)


        .then(calculate)


        .then(calculate)


        .then(calculate)


        .then(verify);


    The above code also verifies (with Jasmine) that the final value is 5, becausecomputewill
    add 1 to the result on each invocation. The code works because each call to thethen
    method of a promise will result in a new promise. You might think this happens
    because thecalculatemethod returns a new promise, but a new promise will appear
    even if the function passed to thethen method doesn’t explicitly produce a promise.
    As an example, let’sreplace one call tocalculate with an arrow function that simply
    returns result + 1\.


    calculate(1)


        .then(calculate)


        .then(result => result + 1)


        .then(calculate)


        .then(verify);


    The result of the above code is still the value 5, and the object returned from
    thethen call with an arrow function is still a promise. Thethen method will ensure
    the return value is a promise by creating a new promise wrapper, if necessary.
    If the success handler does not return anyvalue, the new promise will deliver
    the valueundefined to the next handler.


    ## The Promise API


    APromise in JavaScript offers a few static methods you can use as convenience
    methods. For example, if you need to return a promise to a caller,but you already
    have a value to resolve the promise without performing any asynchronous work,
    theresolve method is handy.


    let doAsyncWork = function () {


        // note: no real async work to perform


        return Promise.resolve(10);


    };


    doAsyncWork().then(result => {


        expect(result).toBe(10);


        done();


    });


    Likewise, thereject method will deliver a result to an error handler.


    let doAsyncWork = function () {


        return Promise.reject("error!");


    };


    doAsyncWork().then(() => { }, message => {


        expect(message).toBe("error!");


        done();


    });


    Therace method will combine multiple promises into a single promise. The single
    promise will resolve when the first passed promise resolves. It’s a race to see
    who finishes first!


    let slowExecutor = function (resolve, reject) {


        setTimeout(() => {


            resolve(9);


        }, 250);


    };


    let fastExecutor = function (resolve, reject) {


        setTimeout(() => {


            resolve(6);


        }, 100);


    };


    let p1 = new Promise(slowExecutor);


    let p2 = new Promise(fastExecutor);


    let p3 = Promise.race([p1, p2]);


    p3.then(result => {


        expect(result).toBe(6);


        done();


    });


    In contrast torace, theall method will combine multiple promises into a single
    promise. The single promise will resolve when all of the multiple promises resolve.


    let slowExecutor = function (resolve, reject) {


        setTimeout(() => {


            resolve(9);


        }, 250);


    };


    let fastExecutor = function (resolve, reject) {


        setTimeout(() => {


            resolve(6);


        }, 100);


    };


    let p1 = new Promise(slowExecutor);


    let p2 = new Promise(fastExecutor);


    let p3 = Promise.all([p1, p2]);


    p3.then(result => {


        expect(result[0]).toBe(9);


        expect(result[1]).toBe(6);


        done();


    });


    The combined resultsarrive in an array. The results in the array will be in the
    same order as the promises passed to theall method.


    Of course, not all promises resolve successfully, so let’s talk about error handling.


    ## Promise Errors


    Errors in asynchronous code typically require a messy number ofif elsechecks and
    a careful inspection of parameter values. Promises allow asynchronous code to
    apply structured error handling. When using promises, you can pass an error handler
    to thethenmethod or use acatch method to process errors. Just like exceptions
    in regular code, an error or exception in asynchronous code will jump to the nearest
    error handler.


    As an example, let’s use the following functions which log the execution path
    into a string variable.


    var log = "";


    function doWork() {


       log += "W";


        return Promise.resolve();


    }


    function doError() {


        log += "E";


        throw new Error("oops!");


    }


    function catchHandler() {


        log += "T";


    }


    function errorHandler(error) {


        log += "H";


    }


    We’ll use these functions with the following code.


    doWork()


        .then(doWork)


        .then(doError)


        .then(doWork) // this will be skipped


        .then(doWork, errorHandler)


        .then(verify);


    function verify() {


        expect(log).toBe("WWEH");


        done();


    }


    The expectation is that thelog variable will contain “WWEH” when the code finishes
    executing, meaning the flow of calls willreachdoWork, thendoWork, thendoError,
    thenerrorHandler. There are two observations to make about this result, one obvious,
    one subtle.


    The first observation is that when the call todoError throws an exception, execution
    jumps to the next rejection handler (errorHandler) and skips over any potential
    success handlers. This behavior is obvious once you think of promises as a tool
    to transform asynchronous code into a procedural flow of method calls. In synchronous
    code, an exception will jump over statements and up the stack to find a catch
    handler, and the asynchronous code in this example is no different.


    What might not be immediately obvious is that theverify function will execute
    as a success handler after the error. Just as normal execution can resume in synchronous
    code after a catch statement, normal execution can resume with promises after
    a handled error. Technically, theverify function executes because the error handler
    returns a successfully resolved promise. Remember thethen method always returns
    a new promise, and unless the error handler explicitly rejects a new promise,
    the new promise resolves successfully.


    A promise object also provides acatch method to handle errors. We could write
    the last code sample with a catch statement as follows.


    doWork()


        .then(doWork)


        .then(doError)


        .then(doWork)


        .then(doWork)


        .catch(errorHandler)


        .then(verify);


    Thecatch method takes only a rejection handler method. There is a subtle difference
    in the following two code snippets:


    .then(doWork, errorHandler)


    … and …


    .then(doWork)


    .catch(errorHandler)


    In the first code snippet, if the success handler throws an exception or rejects
    a promise, execution will not go into the error handler since the promise was
    already resolved at this level. Withcatch, you can always see an unhandled error
    from the previous success handler.


    As a final note, if you do not have any error handlers in place for a promise
    operation and an error occurs, no one will know! You can simulate this scenario
    with the following line of code.


    Promise.reject("error!");


    Some environments and Promise polyfills will warn you about unhandled rejections
    by displaying a message in the console of the developer tools. An unhandled promise
    rejection means your application could be missing a critical error!


    # Modules


    Avoiding global scope has been a primary architectural goal of nearly every library
    and framework authored over the last ten years. Avoiding global scope in the browser
    has meant we’ve relied heavily on closures and syntactical oddities like the immediately
    invoked function expression (IIFE) to provide encapsulation.


    (function() {


        // code goes here, inside an IIFE


    }());


    Avoiding global scope also meant nearly every library and framework for the browser
    would expose functionality through a single global variable. Examples include$orjQuery
    for the jQuery library, or_ for underscore and lodash.'
