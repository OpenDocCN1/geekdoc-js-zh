    \  }\n}\n\nvar result = A.prototype.doWork.call();\nexpect(result).toBe(\"complete!\"\
    );\n```\n\nThe `instanceof` operator also works as expected.\n\n```javascript\n\
    class A {\n    // …\n}\n\nvar a = new A();\n\nexpect(a instanceof A).toBe(true);\n\
    expect(a instanceof Object).toBe(true);\n```\n\nFinally, you can still augment\
    \ a type by directly modifying prototype objects.\n\n```javascript\nclass A {\n\
    }\n\nA.prototype.newMethod = function() {\n    return \"new!\";\n};\n\nvar a =\
    \ new A();\n\nexpect(a.newMethod()).toBe(\"new!\");\n```\n\nYou can think of the\
    \ `class` keyword as being syntactic sugar for creating constructor functions\
    \ and prototype objects. However, there is more to the `class` keyword than what\
    \ we’ve seen so far.\n\n## Statics\n\nA class may contain one or more methods\
    \ defined with the keyword `static`.\n\n```javascript\nclass Employee {\n    constructor(name)\
    \ {\n        this._name = name;\n    }\n    static convert(thing) {\n        if(thing.name)\
    \ {\n            return new Employee(thing.name);\n        }\n    }\n}\n```\n\n\
    Like other languages with static class members, the `static` keyword will create\
    \ a method associated with the class, and not with an instance of the class. In\
    \ other words, you can only reach a static method using the name of the class.\n\
    \n`expect(Employee.convert).toBeDefined();`\n\n`expect(new Employee().convert).toBeUndefined();`\n\
    \nStatic methods have no access to the fields, properties, and methods defined\
    \ on an instance of the class using `this`. For example, the `convert` method\
    \ would not be able to use `this.name` to get to the `name` field of an `Employee`\
    \ object, because the `this` pointer inside of `convert` will never reference\
    \ an `Employee` object. However, static methods are often useful and can play\
    \ the role of factory methods, conversion methods, or general class helper methods.\n\
    \n`let person = { name: \"Scott\" };`\n`let newHire = Employee.convert(person);`\n\
    `expect(newHire.name).toBe(\"Scott\");`\n\nBehind the scenes, a static method\
    \ is associated with the constructor function and not the prototype object like\
    \ the instance members we saw in the last section.\n\n```javascript\nvar Employee\
    \ = function(name) {\n    // ...\n};\n\nEmployee.convert = function(thing) {\n\
    \    // ...\n};\n```\n\n## Inheritance\n\nOver the years, there have been various\
    \ approaches to building class hierarchies in JavaScript. All these approaches\
    \ worked by stitching together constructor functions and prototype objects and\
    \ each approach was slightly different from the others.\n\nES2015 allows for a\
    \ declarative, consistent approach to inheritance using the `class` and `extends`\
    \ keywords. As an example, let’s start with a simple class to represent a person\
    \ with a name.\n\n```javascript\nclass Person {            \n    get name() {\n\
    \        return this._name;\n    }\n    set name(newName){\n        if(newName){\n\
    \            this._name = newName;\n        }\n    }\n}\n\nvar p1 = new Person();\n\
    p1.name = \"Scott\";\nexpect(p1.name).toBe(\"Scott\");\n```\n\nNow we also need\
    \ a class to represent an employee who has both a name and a title. Using the\
    \ `extends` keyword, we can have an `Employee` class inherit from the `Person`\
    \ class, meaning every object instantiated as an `Employee` will also have all\
    \ the methods and properties available for a `Person`.\n\n```javascript\nclass\
    \ Employee extends Person {\n    get title() {\n        return this._title;\n\
    \    }\n    set title(newTitle) {\n        this._title = newTitle;\n    }\n}\n\
    \nvar e1 = new Employee();\ne1.name = \"Scott\"; // inherited from Person\ne1.title\
    \ = \"Developer\";\nexpect(e1.name).toBe(\"Scott\");\nexpect(e1.title).toBe(\"\
    Developer\");\nexpect(e1 instanceof Employee).toBe(true);\nexpect(e1 instanceof\
    \ Person).toBe(true);\n```\n\nWhen describing the relationship between `Employee`\
    \ and `Person` we often say `Person` is a super class of `Employee`, while `Employee`\
    \ is a subclass of `Person`. We can also say that every object instantiated as\
