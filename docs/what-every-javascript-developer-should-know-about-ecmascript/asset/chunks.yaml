  trans: "\n在底层操作迭代器有时是有帮助的，正如我们在这一章中看到的，但 2015 还提供了一种新的循环语法，用于在更高层级处理迭代器——`for of`\
    \ 循环。\n\n```javascript\nlet sum = 0;\nlet numbers = [1,2,3,4];\nfor(let n of numbers)\
    \ {\n    sum += n;\n}\nexpect(sum).toBe(10);\n```\n\n关于上述代码有几点观察。\n\n首先，新的 `for\
    \ of` 循环看起来像 JavaScript 一直以来存在的 `for in` 循环，但这两种循环的行为不同。`for in` 循环作用于任何对象的可枚举属性。在处理数组时，`for\
    \ in` 会遍历数组的可用用索引，而不是可用的值。要使用 `for in` 计算出与上述代码相同的和，我们需要在每次迭代时通过索引来访问数组：\n\n```javascript\n\
    let sum = 0;\nlet numbers = [1,2,3,4];\nfor(let i in numbers) {\n    sum += numbers[i];\
    \ // 注意这里的索引器\n}\nexpect(sum).toBe(10);\n```\n\n`for of` 循环使用迭代器来访问数组中的值，而不是可用的键。\n\
    \n```javascript\nfor(let n of numbers) {\n    sum += n;\n}\n```\n\n这引出了与 `for\
    \ of` 的第二个微妙区别。`for of` 循环只适用于可迭代对象。可迭代对象是具有返回迭代器的特殊方法的对象。我们很快会看到这个特殊方法，但注意最后一段代码不需要像我们之前编写的底层迭代器代码那样使用数组的\
    \ `values` 方法。相反，`for of` 循环直接使用了 `numbers` 数组。\n\n在 ES6 的世界中有很多对象是可迭代对象，我们将在书中看到更多。我们已经看到数组是如何可迭代的。字符串也是可迭代的，这意味着你可以遍历内部的字符序列。\n\
    \n```javascript\nlet result = \"\";\nlet message = \"Hello\";\nfor(let c of message)\
    \ {\n    result += c;\n}\nexpect(result).toBe(\"Hello\");\n```\n\n`for of` 如何获取迭代器？是什么让一个对象变得可迭代的？为了回答这两个问题，我们必须简要跳转到\
    \ ES2015 的另一个新特性——`symbol`。\n\n## Symbols（符号）\n\nSymbol 是 ES2015 中的一种新原始数据类型。关于\
    \ symbol 有两个点需要理解。\n\n1. 每个 symbol 唯一的且不可变的。\n2. 在向对象添加属性时，可以使用 symbol 作为标识符。\n\
    \n为了理解这两个陈述的含义以及它们与可迭代对象的关系，让我们从创建一个新的 symbol 开始。创建一个新的 symbol 与调用 `Symbol` 函数一样简单。\n\
    \n```javascript\nlet s = Symbol();\nexpect(typeof s).toBe(\"symbol\");\n```\n\n\
    注意，在创建 symbol 时不需要使用 `new` 运算符。要创建 symbol，你需要调用 `Symbol` 函数。否则，运行时将抛出异常。\n\n```javascript\n\
    let makeSymbol = () => new Symbol();\nexpect(makeSymbol).toThrow();\n```\n\n你创建的每个\
    \ symbol 都是唯一且不可变的。\n\n```javascript\nlet s1 = Symbol();\nlet s2 = Symbol();\n\
    expect(s1).toEqual(s1);\nexpect(s1).not.toEqual(s2);\n```\n\n创建一个 symbol 时，可以通过向\
    \ `Symbol` 函数传递一个字符串来添加描述，但用相同描述创建的 symbol 仍然是唯一的，即使它们的字符串版本看起来一样。\n\n```javascript\n\
    let s1 = Symbol(\"some desciption\");\nlet s2 = Symbol(\"some description\");\n\
    expect(s1).toEqual(s1);\nexpect(s1).not.toEqual(s2);\nexpect(s1.toString()).toBe(\"\
    Symbol(some description)\");\nexpect(s2.toString()).toBe(\"Symbol(some description)\"\
    );\n```\n\n你可以使用 symbol 作为对象的键。在下面的代码中，我们使用 `lastName` 创建了一个属性，并用 symbol 创建了另一个属性（`firstName`\
    \ symbol）。\n\n```javascript\nlet firstName = Symbol();\nlet person = {\n    lastName:\
    \ \"Allen\",\n    [firstName]: \"Scott\",\n};\nexpect(person.lastName).toBe(\"\
    Allen\");\nexpect(person[firstName]).toBe(\"Scott\");\n```\n\n由于 symbol 是唯一的，一个\
    \ symbol 可以在对象内部创建一个唯一的属性。你永远不需要担心与现有方法冲突，或被意外覆盖。ES5 库会使用带有时间戳或随机数数的属性名来实现相同的效果，但\
    \ symbol 提供了更安全的保障。\n\n使用 symbol 创建的对象成员在使用 `for in` 循环时不会作为对象的一部分出现。\n\n```javascript\n\
    let firstName = Symbol();\nlet person = {\n    lastName: \"Allen\",\n    [firstName]:\
    \ \"Scott\",\n};\nlet names = [];\nfor(var p in person) {\n    names.push(p);\n\
    }\nexpect(names.length).toBe(1);\nexpect(names[0]).toBe(\"lastName\");\n```\n\n\
    在使用 `Object.getOwnPropertyNames` 时，symbol 也不会出现。\n\n```javascript\nexpect(Object.getOwnPropertyNames(person)).toEqual([\"\
    lastName\"]);\n```\n\n将对象序列化为 JSON 时，它们也不会出现。\n\n```javascript\nexpect(JSON.stringify(person)).toBe('{\"\
    lastName\":\"Allen\"}');\n```\n\n由于这些原因，你可能会认为 symbol 对于隐藏对象中的信息很有用。尽管使用 symbol\
    \ 隐藏信息是有用的，但我们有一个名为 `getOwnPropertySymbols` 的新方法可以做到。\n\n```javascript\nexpect(Object.getOwnPropertySymbols(person)).toEqual([firstName]);\n\
    let symbol0 = firstName;\nexpect(person[symbol0])[0]).toBe(\"Scott\");\n```\n\n\
    现在我们更多地了解 symbol，让我们看看 symbol 与可迭代对象的关系。\n\n### 可迭代对象与符号\n\nES2015 定义了几个已知的 symbol。运行时环境使用这些已知的\
    \ symbol。其中一种已知的 symbol 是 `Symbol.iterator`。接下来的代码将检查字符串、数组和数字是否是迭代的。\n\n```javascript\n\
    let site = \"OdeTo.com\";\nlet values = [1,2,3,4];\nlet number = 45;\nexpect(site[Symbol.iterator]).toBeDefined();\n\
    expect(values[Symbol.iterator]).toBeDefined();\nexpect(number[Symbol.iterator]).toBeUndefined();\n\
    ```\n\n证明字符串和数组是可迭代的，但数字不是。\n\n当我们使用 `for of` 循环时，如下例所示，运行时在后台使用 `Symbol.iterator`\
    \ 获取迭代器。\n\n```javascript\nlet sum = 0;\nlet numbers = [1,2,3,4];\nfor(let n of\
    \ numbers) {\n    sum += n;\n}\nexpect(sum).toBe(10);\n```\n\n我们可以重写代码来表示正在发生的情况。\n\
    \n```javascript\nlet sum = 0;\nlet numbers = [1,2,3,4];\nlet iterator = numbers[Symbol.iterator]();\n\
    let next = iterator.next();\nwhile(!next.done) {\n    sum += next.value;\n   \
    \ next = iterator.next();\n}\nexpect(sum).toBe(10);\n```\n\n利用你对 symbol 的知识编写底层迭代器代码并不有趣，但利用\
    \ symbol 创建新的可迭代对象是非常有趣的。\n\n## 创建可迭代对象\n\n想象你正在为教室构建一个抽象，教室对象的一个职责是封装教室内学生的名字。你可能会构建这样一个类：\n\
    \n```javascript\nclass Classroom {\n    constructor() {\n        this.students\
    \ = [\"Tim\", \"Joy\", \"Sue\"];\n    }\n}\n```\n\n偶尔，外部世界需要知道教室内部学生的名字。也许程序会在\
    \ UI 中显示这些名称，或者将它们保存到数据库中。无论哪种，教室对象如何向调用者提供学生名称？\n\n一种方案是返回数组的引用，这样调用者可能会通过添加或删除项更改数组。如果教室想要保护数组并验证学生的的添加或删除，这种方案不是最佳选择。\n\
    \n另一个方案是复制数组。即使调用者更改了副本，原始学生数组也是安全的。然而，复制操作可能是昂贵的。\n\n有了 ES2015，教室现在可以提供学生名称的访问，而无需交付底层数组的访问权限。我们只需要通过添加\
    \ `Symbol.iterator` 方法让教室变得可迭代即可。\n\n"
- fmt: "\nFirst, let’s make the classroom iterable by building our own iterator objects.\
    \ This is the hard way to solve the problem, and we’ll see easier approaches after\
    \ covering a few more topics.\n\n```javascript\nclass Classroom {\n    constructor()\
    \ {\n        this.students = [\"Tim\", \"Joy\", \"Sue\"];\n    }\n    [Symbol.iterator]()\
    \ {\n        var index = 0;\n        return {\n            next: () => {\n   \
    \             if(index < this.students.length){\n                    index +=\
    \ 1;\n                    return {done: false, value: this.students[index-1]};\n\
    \                }\n                return { value: undefined, done: true };\n\
    \            }\n        }\n    }\n}\n```\n\nNotice how `Symbol.iterator` needs\
    \ square brackets to surround the method name. Inside the method is the code to\
    \ return objects with an `next` method, and the `next` method returns objects\
    \ with `done` and `value` properties. A classroom should now behave just like\
    \ an array and work in a `for...of` loop.\n\n```javascript\nlet scienceClass =\
    \ new Classroom();\nlet result = [];\nfor(let name of scienceClass){\n    result.push(name);\n\
    }\nexpect(result).toEqual([\"Tim\", \"Joy\", \"Sue\"]);\n```\n\nThe code inside\
    \ the classroom’s iterator method is the type of code that works with any array.\
    \ Let’s extract the code into a new class.\n\n```javascript\nclass ArrayIterator\
    \ {\n    constructor(array) {\n        this.array = array;\n        this.index\
    \ = 0;\n    }\n    next() {\n        let result = { value: undefined, done: true};\n\
    \        if(this.index < this.array.length) {\n            result.value = this.array[this.index];\n\
    \            result.done = false;\n            this.index += 1;\n        }\n \
    \       return result;\n    }\n}\n```\n\nNow we can reuse `ArrayIterator` from\
    \ several places in an application.\n\n```javascript\nclass Classroom {\n    constructor()\
    \ {\n        this.students = [\"Tim\", \"Joy\", \"Sue\"];\n    }\n    [Symbol.iterator]()\
    \ {\n        return new ArrayIterator(this.students);\n    }\n}\n```\n\nEven though\
    \ the `ArrayIterator` class is helpful, an easier approach to creating an iterable\
    \ is to use a generator.\n\n## Generators\n\nYou’ll know when you are looking\
    \ at a generator function, because a generator function contains an asterisk in\
    \ the declaration.\n\n```javascript\nfunction*() {\n\n}\n```\n\nOnce you have\
    \ a generator function, you can use the `yield` keyword inside the function to\
    \ return multiple values to the caller.\n\n```javascript\nlet numbers = function*()\
    \ {\n    yield 1;\n    yield 2;\n    yield 3;\n};\n```\n\nHowever, the return\
    \ values do not return to the caller all at once. Internally, the runtime builds\
    \ an iterator so a caller can iterate through the generator results one by one.\
    \ The following code uses a `for...of` loop to iterate over the `numbers` function.\n\
    \n```javascript\nlet sum = 0;\nfor(let n of numbers()) {\n    sum += n;\n}\nexpect(sum).toBe(6);\n\
    ```\n\nGoing back to the `Classroom` class we used in the last section, we can\
    \ now make a `Classroom` iterable using a generator function and `yield`.\n\n\
    ```javascript\nclass Classroom {\n    constructor(...students) {\n        this.students\
    \ = students;\n    }\n    *[Symbol.iterator]() {\n        for(let s of this.students)\
    \ yield s;\n    }\n}\nvar scienceClass = new Classroom(\"Tim\", \"Sue\", \"Joy\"\
    );\nvar students = [];\nfor(let student of scienceClass){\n    students.push(student);\n\
    }\nexpect(students).toEqual([\"Tim\", \"Sue\", \"Joy\"])\n```\n\nNotice how the\
    \ `iterator` method needs an asterisk before the square bracket. The syntax is\
    \ quirky, but an asterisk is always required when defining a generator function,\
    \ because generator functions behave differently than normal functions.\n\n##\
    \ Lazy Evaluation\n\nGenerators in most languages do the least amount of work,\
    \ and generators in JavaScript are no. When a program invokes a normal function,\
    \ you can imagine the program jumping into the function and executing until the\
    \ function completes. However, the behavior of a generator function is different.\n\
    \nAs an example, let’s use the following generator function.\n\n```javascript\n\
    let random = function*() {\n    while(true) {\n        console.log(\"make random\"\
    )\n        yield Math.random();\n    }\n}\n```\n\nThe `random` function looks\
    \ like it will burn CPU cycles in an infinite loop. However, if we invoke the\
    \ function and look for output – there will be no output! When you invoke a generator\
    \ function, you can think of the runtime setting up a state machine behind the\
    \ scenes. The state machine knows how to take the code inside the generator function\
    \ and allow pieces to execute on demand.\n\nWhat creates the demand? Since generators\
    \ produce iterators, then each call to the `next` method of the iterator will\
    \ force the state machine to execute just enough code to produce the next value,\
    \ but no more. For example, if we execute the following:\n\n```javascript\nlet\
    \ iterator = random();\niterator.next();\n```\n\nThen we will see “make random”\
    \ exactly once in the console. Asking the iterator for the next value forced the\
    \ state machine to execute code inside the function until a `yield` statement\
    \ returned another value. Each time there is a call to `next`, the flow of the\
    \ program jumps back into the generator function at the point the program left,\
    \ and execution continues until the program reaches another `yield`.\n\nIn computer\
    \ science terminology, a generator function offers what we call lazy evaluation.\
    \ In order to make the function perform work, we need to pull values out of the\
    \ function by asking for those values through the iterator. The `random` function\
    \ will only create an infinite loop if we ask for an infinite number of values.\n\
    \nLet’s imagine we wanted a finite number of random numbers, and we only want\
    \ numbers less than 0.5. First, we could write a `filter` function that will take\
    \ an iterable object and a `predicate` function as arguments. The `filter` function\
    \ will only produce the items for which the `predicate` function returns true.\n\
    \n```javascript\nlet filter = function*(items, predicate) {\n    for(let item\
    \ of items){\n        console.log(\"filter\", item);\n        if(predicate(item)){\n\
    \            yield item;\n        }\n    }\n};\n```\n\nTo make sure we ask for\
    \ a finite number of items, we can also write a `take` function, to take a specific\
    \ number of items.\n\n```javascript\nlet take = function*(items, number) {\n \
    \   let count = 0;\n    if(number < 1) return;\n    for(let item of items){\n\
    \        console.log(\"take\", item);\n        yield item;\n        count += 1;\n\
    \        if(count >= number) {\n            return;\n        }\n    }\n};\n```\n\
    \nNotice how we can stop iteration using a `return` statement in the `take` function.\n\
    \nUsing the previous functions, all of which are generators, we can create two\
    \ random numbers less than 0.5 with the following code.\n\n```javascript\nlet\
    \ result = take(filter(random(), n => n < 0.5), 2);\n```\n\nExcept, we have not\
    \ created any numbers with the above code! All we’ve created is an iterator. No\
    \ output will appear in the console, because there is no code trying to use the\
    \ iterator to pull numbers through the generators.\n\nWe could force the functions\
    \ to execute code using a `for...of` loop, or use `Array.from`, which is a new\
    \ API we can use to convert any iterable object to a concrete array.\n\n```javascript\n\
    expect(Array.from(result).length).toBe(2);\n```\n\nConsole output of the above\
    \ code will look like the following.\n\n```\nmake random\nfilter 0.24152887403033674\n\
    take  0.24152887403033674\nmake random\nfilter 0.6618692250922322\nmake random\n\
    filter 0.49661534116603434\ntake  0.49661534116603434\n```\n"
  raw: 'First, let’s make the classroom iterable by building our own iterator objects.
    This is the hard way to solve the problem, and we’ll see easier approaches after
    covering a few more topics.


    class Classroom {


        constructor() {


            this.students = ["Tim", "Joy", "Sue"];


        }


        [Symbol.iterator]() {


            var index = 0;


            return {


                next: () => {


                    if(index < this.students.length){


                        index += 1;


                        return {done: false, value: this.students[index-1]};


                    }


                    return { value: undefined, done: true };


                }


            }


        }


    }


    Notice howSymbol.iterator needs square brackets to surround the method name. Inside
    the method is the code to return objects with anext method, and thenext method
    returns objects withdoneandvalue properties. A classroom should now behave just
    like an array and work in aforof loop.


    let scienceClass = new Classroom();


    let result = [];


    for(let name of scienceClass){


        result.push(name);


    }


    expect(result).toEqual(["Tim", "Joy", "Sue"]);


    The code inside the classroom’s iterator method is the type of code that works
    with any array. Let’s extract the code into a new class.


    class ArrayIterator {


        constructor(array) {


            this.array = array;


            this.index = 0;


        }


        next() {


            let result = { value: undefined, done: true};


            if(this.index < this.array.length) {


                result.value = this.array[this.index];


                result.done = false;


                this.index += 1;


            }


            return result;


        }


    }


    Now we can reuseArrayIterator from several places in an application.


    class Classroom {


        constructor() {


            this.students = ["Tim", "Joy", "Sue"];


        }


        [Symbol.iterator]() {


            return new ArrayIterator(this.students);


        }


    }


    Even though theArrayIterator class is helpful, an easier approach to creating
    an iterable is to use a generator.


    ## Generators


    You’ll know when you are looking at a generator function, because a generator
    function contains an asterisk in the declaration.


    function*() {


    }


    Once you have a generator function, you can use theyield keyword inside the function
    to return multiple values to the caller.


    let numbers = function*() {


            yield 1;


            yield 2;


            yield 3;


    };


    However, the return values do not return to the caller all at once. Internally,
    the runtime builds an iterator so a caller can iterate through the generator results
    one by one. The following code uses aforofloop to iterate over thenumbers function.


    let sum = 0;


    for(let n of numbers()) {


        sum += n;


    }


    expect(sum).toBe(6);


    Going back to theClassroom class we used in the last section, we can now make
    aClassroom iterable using a generator function andyield.


    class Classroom {


        constructor(...students) {


            this.students = students;


        }


        *[Symbol.iterator]() {


            for(let s of this.students) yield s;


        }


    }


    var scienceClass = new Classroom("Tim", "Sue", "Joy");


    var students = [];


    for(let student of scienceClass){


        students.push(student);


    }


    expect(students).toEqual(["Tim", "Sue", "Joy"])


    Notice how the iterator method needs an asterisk before the opening square bracket.
    The syntax is quirky, but an asterisk is always required when defining a generator
    function, because generator functions behave differently than normal functions.


    ## Lazy Evaluation


    Generators in most languages do the least amount of work possible, and generators
    in JavaScript are no different. When a program invokes a normal function, you
    can imagine the program jumping into the function and executing code until the
    function completes. However, the behavior of a generator function is different.


    As an example, let’s use the following generator function.


    let random = function*() {


        while(true) {


            console.log("make random")


            yield Math.random();


        }


    }


    Therandom function looks like it will burn CPU cycles in an infinite loop. However,
    if we invoke the function and look for output in the console – there will be no
    output!


    When you invoke a generator function, you can think of the runtime setting up
    a state machine behind the scenes. The state machine knows how to take the code
    inside the generator function and allow pieces to execute on demand.


    What creates the demand?


    Since generators produce iterators, then each call to thenext method of the iterator
    will force the state machine to execute just enough code to produce the next value,
    but no more. For example, if we execute the following code:


    let iterator = random();


    iterator.next();


    Then we will see “make random” appear exactly once in the console. Asking the
    iterator for the next value forced the state machine to execute code inside the
    function until ayield statement returnedanother value. Each time there is a call
    tonext on the iterator, the flow of the program jumps back into the generator
    function at the point the program last left the function, and execution continues
    until the program reaches anotheryield.


    In computer science terminology, a generator function offers what we call lazy
    evaluation. In order to make the function perform work, we need to pull values
    out of the function by asking for those values through the iterator API. Therandom
    function will only create an infinite loop if we ask for an infinite number of
    values.


    Let’s imagine we wanted a finite number of random numbers, and we only want random
    numbers less than 0.5\. First, we could write a filtering function that will take
    an iterable object and a predicate function as arguments. The filtering function
    will only produce the items for which the predicate function returns true.


    let filter = function*(items, predicate) {


        for(let item of items){


            console.log("filter", item);


            if(predicate(item)){


                yield item;


            }


        }


    };


    To make sure we ask for a finite number of items, we can also write atake function,
    to take a specific number of items.


    let take = function*(items, number) {


        let count = 0;


        if(number < 1) return;


        for(let item of items){


           console.log("take", item);


            yield item;


            count += 1;


            if(count >= number) {


                return;


            }


        }


    };


    Noticehow we can stop iteration using areturnstatement in thetake function.


    Using the previous functions, all of which are generators, we can create two random
    numbers less than 0.5 with the following code.


    let result = take(filter(random(), n => n < 0.5), 2);


    Except, we have not created any numbers with the above code! All we’ve created
    is an iterator. No output will appear in the console, because there is no code
    trying to use the iterator to pull numbers through the generators.


    We could force the functions to execute code using aforofloop, or useArray.from,
    which is a new API we can use to convert any iterable object to a concrete array.


    expect(Array.from(result).length).toBe(2);


    Console output of the above code will look like the following.


    make random


    filter 0.24152887403033674


    take   0.24152887403033674


    make random


    filter 0.6618692250922322


    make random


    filter 0.49661534116603434


    take   0.49661534116603434


    Notice how the function execution interleaves. You can imagine the iterators pulling
    values from each function on an as-needed basis.


    Lazy evaluation allows for many interesting scenarios with control flow and data
    structures. We’ll look at some of these scenarios later.


    ## Iterators Revisited


    Earlier in the chapter, we saw how to work with iterators at a low level and use
    an iterator’snext method to move from one item to the next item. What’s interesting
    about iterators in JavaScript is how the consumer of an iterator can passa parameter
    to thenext method.


    As an example, let’slook at the followingrange method. You can use therange methodto
    generate a sequence of numbers fromstarttoend.'
