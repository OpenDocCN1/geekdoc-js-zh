    \n```javascript\nlet name = \"Scott\";\nlet message = `Hello, ${name}!`;\nexpect(message).toBe(\"\
    Hello, Scott!\");\n```\n\n反引号（`` ` ``）包围整个模板字符串，而 `$` 和 `{}` 则表示替换占位符。在占位符内部，你可以使用标识符和表达式。\n\
    \n```javascript\nlet showTheMath = function(x,y ){\n    return `${x} + ${y} is\
    \ ${x + y}`;\n};\n\nlet result = showTheMath(3,4);\nexpect(result).toBe(\"3 +\
    \ 4 is 7\");\n```\n\n模板字符串也可以跨行。\n\n```javascript\nlet message = `This is\n  \
    \             a short, but multi-line message`;\n```\n\n注意 `message` 将包含一个换行符，因为换行符（以及末尾空格）在模板字符串内部是有意义的。\n\
    \n模板字符串是该语言的一个非常有用的补充。然而，当模板字符串与标签（tag）一起使用时，它们变得异常有趣。\n\n## 标签模板字符串\n\n标签是一个具有解释和处理模板能力的函数。标签出现在模板之前，因此在下面的代码中，标签是\
    \ `test`。\n\n```javascript\nlet name = \"Scott\";\nlet result = test `Hello, ${name}!`;\n\
    ```\n\n在这个示例中，`test` 是我们将编写的一个自定义函数。运行时会调用标签函数并传递两个参数。第一个参数将是一个包含模板中字面量文本部分的数组。\n\
    \n```javascript\nlet test = function(literals, ...values) {\n    expect(literals.length).toBe(2);\
    \   \n    expect(literals[0]).toBe(\"Hello, \");\n    expect(literals[1]).toBe(\"\
    !\");\n    return \"test\";\n};\n\nlet name = \"Scott\";\nlet result = test `Hello,\
    \ ${name}!`;\nexpect(result).toBe(\"test\");\n```\n\n上述代码中的模板 `Hello, ${name}!`\
    \ 生成了一个包含两个字面量文本“Hello”和“!”）的数组。运行时正在为我们拆分模板，并向我们提供不含占位符的字面量文本。\n\n标签函数的其余参数将包含解释后的替换值。如果你不知道模板中会出现多少个占位符，可以使用剩余参数（rest\
    \ parameter）将所有值捕到一个数组中。这是另一个代码片段，展示了运行时如何传递所有的字面量文本和替换值。\n\n```javascript\nlet\
    \ test = function(literals, ...values) {\n    expect(literals.length).toBe(3);\n\
    \    expect(literals[0]).toBe(\"Hello, \");\n    expect(literals[1]).toBe(\",\
    \ \");\n    expect(literals[2]).toBe(\"!\");\n    expect(values.length).toBe(2);\n\
    \    expect(values[0]).toBe(\"Allen\");\n    expect(values[1]).toBe(\"Scott\"\
    );\n    return \"test\";\n};\n\nlet firstName = \"Scott\";\nlet lastName = \"\
    Allen\";\nlet result = test `Hello, ${lastName}, ${firstName}!`;\nexpect(result).toBe(\"\
    test\");\n```\n\n标签函数可以通过拼接字符串来构建模板的输出。对于每个字面量值，你可以将字面量追加到结果中，然后追加一个值。然而，标签可以使用任何它想要的逻辑来解释模板，因此如果标签想无论模板内容如何顾一切地返回字符串“test”，它是可以的（如上面的代码所做的）。标签也可以返回数字\
    \ 42 或任何对象。\n\n一个更合理的标签实现可能如下：\n\n```javascript\nlet upper = function(strings,\
    \ ...values) {\n    let result = \"\";\n    for(let i = 0; i < strings.length;\
    \ i++) {\n        result += strings[i];\n        if(i < values.length){\n    \
    \        result += values[i];\n        }\n    }\n    return result.toUpperCase();\n\
    };\n\nvar x = 1;\nvar y = 3;\nvar result = upper `${x} + ${y} is ${x+y}`;\nexpect(result).toBe(\"\
    1 + 3 IS 4\");\n```\n\n标签 `upper` 构建的结果看起来就像模板字符串的正常评估一样，但在返回结果之前使用了 `toUpperCase()`，以确保结果使用所有大写字母。\n\
