  trans: "\n函数甚至可以使用字面量表达式以外的内容来计算默认值。\n\n```javascript\nlet doWork = function(x =\
    \ Math.random()) { return x; }\n```\n\n默认参数语法是 ES2015 如何为常见需求提供整洁语法的良好示例。我们再也不需要扫描函数的源代码或文档来发现默认值了。\n\
    \n当然，并不是所有参数都是简单的值。对于涉及复杂配置（如 HTTP 调用）的操作，一种常见的编程技术是接受单个对象参数，通过其属性来设置 URI、HTTP\
    \ 方法、超时设置等。默认参数在这种情况下也很有用，但我们必须等稍后，先学习对象解构。\n\n## 剩余参数 (Rest Parameters)\n\n剩余参数允许函数处理数量数量的参数。函数的剩余参数始终出现在参数列表的末尾，并使用三个点前缀（`…`），如下所示。\n\
    \n```javascript\nlet doWork = function(name, ...numbers){\n    let result = 0;\n\
    \    numbers.forEach(function(n){\n        result += n;\n    });\n    return result;\n\
    };\n```\n\n调用 `doWork` 的调用者可以在剩余参数位置传递零个或多个参数。你可以说 `numbers` 参数将获取调用者传递给 `doWork`\
    \ 的“剩余”参数，并且 `numbers` 将这些参数存储在一个数组中。在下面的示例中，`numbers` 将引用包含值 1, 2, 3 的数组。\n\n\
    ```javascript\nlet result = doWork(\"Scott\", 1, 2, 3);\nexpect(result).toBe(6);\n\
    ```\n\n当调用者在剩余参数位置未传递参数时，剩余参数将是一个空数组。\n\n```javascript\nlet doWork = function(...numbers){\n\
    \    return numbers;\n};\n\nlet result = doWork();\nexpect(result.length).toBe(0);\n\
    ```\n\n在 2015 年之前，我们可以通过使用函数内部隐式的 `arguments` 变量允许调用者向函数传递数量数量的参数。`arguments`\
    \ 变量以类数组的形式包含了函数的所有参数，但 `arguments` 并不是一个数组，这造成了混惑。如果不阅读函数的代码或文档，很难发现一个函数是否使用了\
    \ `arguments`。\n\n剩余参数将通过始终为我们提供真正的数组来避免混惑，并通过通过专门的语法，使得在阅读函数签名时剩余参数易于被发现。\n\n\
    ## 展开运算符 (Spread Operator)\n\n展开运算符与我们在剩余参数中看到的语法相同，即一系列三个点（`...`）。然而，剩余参数是将单个参数收集到一个数组中，而展开运算符则是将数组展开为多个单个参数。我们可以在定义函数时使用剩余参数，并在调用函数时使用展开运算符。例如：\n\
    \n```javascript\nlet doWork = function(x, y, z) {\n    return x + y + z;\n}\n\n\
    let result = doWork(...[1, 2, 3]);\nexpect(result).toBe(6);\n```\n\n在上面的代码中，展开运算符将包含三个值的数组“展开”到参数\
    \ `x`、`y` 和 `z` 上。\n\n展开运算符还可以展开数组以在数组字面量中创建单个元素。\n\n```javascript\nlet a = [4,\
    \ 5, 6];\nlet b = [1, 2, 3, ...a, 7, 8, 9];\nexpect(b).toEqual([1,2,3,4,5,6,7,8,9]);\n\
    ```\n\n尽管我展示的示例都使用数组配合展开运算符，但展开运算符也适用于任何迭代对象（iterable object）。我们将在书的稍后部分查看迭代对象。\n\
    \n展开运算符还使得在不在乎实际参数值时，将参数传递给另一个函数变得简单（在那种情况下，我们通常会使用 `Function.apply`）。下面的 `doSomething`\
    \ 方法展示了这种情况。\n\n```javascript\nlet doWork = function(x, y, z){\n    return x +\
    \ y + z;\n}\n\nlet doSomething = function(...args){\n    return doWork(...args);\n\
    }\n\nlet result = doSomething(...[1,2,3,4,5]);\nexpect(result).toBe(6);\n```\n\
    \n注意，当使用展开时，数组中的值可以比目标函数需要的更多。展开将从数组的开始填充参数，因此在上面的示例中，`doWork` 只会看到数组中的前三个值。\n\
    \n## 解构 (Destructuring)\n\n解构一个对象就是拆解或撕开一个对象——这与构造（constructing）相反。\n\n在 2015\
    \ 年，解构赋值允许我们将一个数组或对象拆分成各个部分，并将这些部分赋值给变量。方括号 `[` 和 `]` 用于解构数组，而花括号 `{` 和 `}` 将用于解构对象。\n\
    \n下面的代码将解构一个数组，使得 `x` 包含 22，`y` 包含 44。\n\n```javascript\nlet values = [22, 44];\n\
    let [x, y] = values;\nexpect(x).toBe(22);\nexpect(y).toBe(44);\n```\n\n你可以将赋值右侧的\
    \ `[` 和 `]` 视为构造数组的符号。赋值左侧的 `[` 和 `]` 解构数组并声明两个变量来持有这些部分。\n\n对象的解构遵循相同的模式，但将使用\
    \ `{` 和 `}`。\n\n```javascript\nlet person = { firstName: \"Scott\", lastName:\
    \ \"Allen\" };\nlet {firstName, lastName} = person;\nexpect(firstName).toBe(\"\
    Scott\");\nexpect(lastName).toBe(\"Allen\");\n```\n"
- fmt: "\n## Template Literals\n\nTemplate literals provide JavaScript with string\
    \ formatting capabilities. Like many template technologies, templates in JavaScript\
    \ consist of literal text, and placeholders where the runtime can evaluate an\
    \ expression and substitute data into the literal text.\n\n```javascript\nlet\
    \ name = \"Scott\";\nlet message = `Hello, ${name}!`;\nexpect(message).toBe(\"\
    Hello, Scott!\");\n```\n\nBacktick characters (`` ` ``) enclose the entire template\
    \ literal, while `$` and `{}` denote the substitution placeholders. Inside a placeholder,\
    \ you can use identifiers and expressions.\n\n```javascript\nlet showTheMath =\
    \ function(x,y ){\n    return `${x} + ${y} is ${x + y}`;\n};\n\nlet result = showTheMath(3,4);\n\
    expect(result).toBe(\"3 + 4 is 7\");\n```\n\nTemplate literals can also span multiple\
    \ lines.\n\n```javascript\nlet message = `This is\n               a short, but\
    \ multi-line message`;\n```\n\nNote that `message` will contain a newline character\
    \ because newlines (and trailing spaces) are significant inside of a template\
    \ literal.\n\nTemplate literals are a useful addition to the language. However,\
    \ template literals become exceptionally interesting when using them with a tag.\n\
    \n## Tagged Template Literals\n\nThe tag is a function with the ability to interpret\
    \ and process a template. The tag appears in front of the template, so in the\
    \ following code the tag is `test`.\n\n```javascript\nlet name = \"Scott\";\n\
    let result = test `Hello, ${name}!`;\n```\n\nIn this example, `test` is a custom\
    \ function we’ll write. The runtime invokes a tag function and passes two parameters.\
    \ The first parameter will be an array containing the literal pieces of text in\
    \ the template.\n\n```javascript\nlet test = function(literals, ...values) {\n\
    \    expect(literals.length).toBe(2);   \n    expect(literals[0]).toBe(\"Hello,\
    \ \");\n    expect(literals[1]).toBe(\"!\");\n    return \"test\";\n};\n\nlet\
    \ name = \"Scott\";\nlet result = test `Hello, ${name}!`;\nexpect(result).toBe(\"\
    test\");\n```\n\nThe template in the above code, `Hello, ${name}!`, generates\
    \ an array with two pieces of literal text, “Hello”, and “!”. The runtime is breaking\
    \ apart the template for us and giving us the literal text without the placeholders.\n\
    \nThe rest of the parameters to the tag function will contain the interpreted\
    \ substitution values. If you don’t know how many placeholders will appear in\
    \ a template, you can use a rest parameter to capture all the values in an array.\
    \ Here is another code snippet showing how the runtime passes all the literal\
    \ text and substitution values.\n\n```javascript\nlet test = function(literals,\
    \ ...values) {\n    expect(literals.length).toBe(3);\n    expect(literals[0]).toBe(\"\
    Hello, \");\n    expect(literals[1]).toBe(\", \");\n    expect(literals[2]).toBe(\"\
    !\");\n    expect(values.length).toBe(2);\n    expect(values[0]).toBe(\"Allen\"\
    );\n    expect(values[1]).toBe(\"Scott\");\n    return \"test\";\n};\n\nlet firstName\
    \ = \"Scott\";\nlet lastName = \"Allen\";\nlet result = test `Hello, ${lastName},\
    \ ${firstName}!`;\nexpect(result).toBe(\"test\");\n```\n\nA tag function can build\
    \ the output of a template by concatenating strings. For each literal value, you\
    \ can append the literal to the result and then append a value. However, a tag\
    \ can interpret a template using any logic it desires, so if the tag wants to\
    \ heedlessly return the string “test” regardless of the contents of the template,\
    \ it can (as the code above is doing). The tag could also return the number 42,\
    \ or any object.\n\nA more reasonable implementation of a tag might look like\
    \ the following.\n\n```javascript\nlet upper = function(strings, ...values) {\n\
