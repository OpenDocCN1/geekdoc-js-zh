    - [Strings](#part0000_split_043.html__Toc435998189)\n- [Objects](#part0000_split_044.html__Toc435998190)\n\
    - [The End](#part0000_split_045.html__Toc435998191)\n\n# Welcome\n\nI sat down\
    \ and wrote the book I would like to read about the new JavaScript features in\
    \ 2015. This book is not an exhaustive list of everything new in the ECMAScript\
    \ 2015 specification that governs the JavaScript language. Instead, I purposefully\
    \ selected what I think are the important features we will use in everyday programming.\
    \ I expect the reader will already have a good understanding of the JavaScript\
    \ language as the language before 2015.\n\nThe majority of code samples in this\
    \ book are unit tests I authored with the Jasmine testing framework. I find one\
    \ of the best ways to explore a new language or framework is to write tests and\
    \ verify my assumptions about how the code should work.\n\nSpecial thanks to Ruben\
    \ Bartelink and Porter T. Bear for feedback. I hope you enjoy what follows.\n\n\
    # Variables and Parameters\n\nECMAScript 2015 introduces a number of new keywords\
    \ and syntactic sugar for working with local variables and function parameters.\
    \ All of these new features make JavaScript more expressive and easier to use,\
    \ and a few features make JavaScript code safer.\n\n## let\n\nVariable scope in\
    \ JavaScript has been a source of surprises and bugs over the years. The surprise\
    \ is because JavaScript only offers function scope and global scope to control\
    \ the lifetime of a variable. There is no block scope.\n\n```javascript\nvar doWork\
    \ = function(flag){\n    if(flag) {\n      var x = 3;\n    }\n    return x; //\
    \ x is still available\n};\n\nvar result = doWork(true);\nexpect(result).toBe(3);\
    \ // PASS!!!!!\n```\n\nThe new `let` keyword of 2015 will replace `var` for variable\
    \ declarations and provide true block scoping.\n\n```javascript\nlet doWork =\
    \ function(flag) {\n    if(flag){\n      let x = 3;\n    }\n    return x; // Will\
    \ give a ReferenceError: x is not defined\n};\n\nlet result = doWork(true);\n\
    expect(result).toBe(3); \n```\n\nIteration statements also benefit from `let`.\n\
    \n```javascript\nvar doWork = function(){\n    for(let x = 0; x < 3; x++) {\n\
    \        // ...\n    }\n    return x; // ReferenceError: x is not defined\n};\n\
    ```\n\n### Using let\n\nES2015 still supports the `var` keyword, but we should\
    \ think of `var` as an obsolete keyword when writing new code. `let` is the new\
    \ `var`!\n\nWill `let` make JavaScript code better?\n\nI doubt if `let` will prevent\
    \ a significant number of bugs, but I do think JavaScript code will improve. We\
    \ can declare variables close to where we use them, which makes the code easier\
    \ to follow.\n\n## const\n\nThe `const` keyword will give you a read-only variable.\
    \ Like `let`, a variable declared with `const` will have block scope, and you\
    \ cannot re-declare it.\n\n```javascript\nconst MAX_BUNIES = 3;\n```\n\nThere\
    \ is no requirement for a constant to use capital letters, that’s just a convention\
    \ I like to follow.\n\n### Using const\n\nIn a perfect world, all the JavaScript\
    \ environments would have a perfect implementation of `const`. Unfortunately,\
    \ `const` is one of those keywords that has been around in some runtimes even\
    \ before it appeared in an official ECMAScript specification.\n\nWhile most runtimes\
    \ can agree that `const` should be constant, implementations disagree on how to\
    \ behave when code attempts to assign a new value to a constant. Should the assignment\
    \ cause a runtime error? Should the assignment fail silently?\n\nThe official\
    \ specification says `const` should fail with a runtime error if a program tries\
    \ to assign a new value to a constant, and constant declarations without an initializer\
    \ should be a syntax error.\n\n```javascript\nconst MAX_SIZE = 10;\n// MAX_SIZE\
    \ = 12; // If executed, will result in a SyntaxError\n```\n\nI hope it will not\
    \ take long for all the latest runtimes and browsers to straighten up and behave\
    \ correctly. The current situation should not stop you from using `const` whenever\
    \ possible because the keyword does have a few benefits.\n\n1. `const` tells other\
    \ programmers about the intended behavior of a variable, and this makes a script\
    \ easier to maintain.\n2. `const` tells the runtime about the intended behavior\
    \ of a variable, which can allow for optimizations across time and space.\n\n\
    ## Default Parameters\n\nIf a JavaScript function takes two parameters, we have\
    \ always had the ability to invoke the function and pass two parameters, or one\
    \ parameter, or no parameters, or three parameters if we wanted. In cases where\
    \ we do not pass enough parameters, the author of a function might want to specify\
    \ a default value instead of working with `undefined`.\n\nBefore 2015, developers\
    \ applied default values to incoming parameters using `||` expressions inside\
    \ the function. In the following function, if the caller does not pass a value\
    \ for the `name` parameter, the code will assign a default of Scott.\n\n```javascript\n\
    let doWork = function(name) {\n    name = name || \"Scott\";\n    return name;\n\
    };\n```\n\nIn 2015, default values are explicit and appear in the parameter list\
    \ for a function.\n\n```javascript\nlet doWork = function(name = \"Scott\") {\n\
    \    return name;\n};\n\nexpect(doWork()).toBe(\"Scott\");\n```\n"
