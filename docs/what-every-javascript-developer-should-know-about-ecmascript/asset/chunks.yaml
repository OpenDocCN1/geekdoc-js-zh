    If you embrace the arrow function syntax, you might find yourself using arrow
    functions in every third line of code. JavaScript’s affinity for asynchronous
    operations has created an enormous number of APIs requiring callback functions.
    However, as JavaScript is a solid functional programming language, more and more
    synchronous APIs have appeared with function arguments, too.


