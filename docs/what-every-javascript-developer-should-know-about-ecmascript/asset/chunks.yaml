    \ 的项。\n\n```javascript\nlet filter = function*(items, predicate) {\n    for(let\
    \ item of items){\n        console.log(\"filter\", item);\n        if(predicate(item)){\n\
    \            yield item;\n        }\n    }\n};\n```\n\n为了确保我们请求有限数量的项，我们还可以写一个\
    \ `take` 函数，获取特定数量的项。\n\n```javascript\nlet take = function*(items, number) {\n\
