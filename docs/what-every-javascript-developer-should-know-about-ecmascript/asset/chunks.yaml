    a new promise object. ThePromise constructor takes a parameter known as the executor
    function. The previous code implements the executor as an arrow function. The
    executor itself takes two arguments. The first argument is the resolvefunction.
    Invokingresolve fulfills the promise and delivers a successful value to anyone
    who is waiting for a result from the promise. The second function is the rejectfunction.
    Invokingreject will reject the promise, which signals an error. The above code
    always resolves the promise successfully and passes along a result of 96\.


    ### A Promise Consumer


    Instead of passing a callback function to thecalculatemethod, the consumer now
    invokes thecalculate method and receives a promise object. A promise object provides
    an API that allows the consumer to execute code when the producer resolves or
    rejects the promise. The most important part of the promise API fora consumer
    is thethenmethod. Thethen method allows the consumer to pass function arguments
    to execute when the promise resolves or rejects. The consumer code for calculate
    can now look like the following.


            let success = function(result) {


                expect(result).toBe(96);


                done(); 


            };


            let error = function(reason) {


                // ... error handling code for a rejected promise 


            };


            let promise = calculate();


            promise.then(success, error);


    The first argument to thethen method is the success handler, while the second
    argument is the error handler.


    On the surface, using promises might seem more involved than using simple callback
    functions. However, promises really start to shine when chaining operations, composing
    operations, and when handling errors.


    ## Promise Chaining


    Chaining promises canmake asynchronous code flow synchronously. For example, consider
    the followingcalculate method, which delivers a result using a promise.


    let calculate = function (value) {


        return new Promise((resolve, reject) => {


            setTimeout(() => {


                resolve(value + 1);


            }, 0);


        });


