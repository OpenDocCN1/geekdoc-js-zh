    ## Iterators


    The addition of iterators in 2015 opens up a new world of algorithms and abilities
    for JavaScript. An iterator is an object that allows code to traverse a sequence
    of objects. The sequence of objects could be the values inside an array, or values
    in a more sophisticated data structure like a tree or map. One of the many beautiful
    characteristics of iterators is how the iterator doesn’t need to know any details
    about the underlying collection. All an iterator will do is provide the ability
    to move through a sequence of values one items at a time.


    You might be wondering why we are talking about iterators in a chapter devoted
    to functional programming. We’ll get to that in just a bit, but the short story
    is that iterators work well with a number of functional programming paradigms,
    including lazy evaluation and function composition. Before we get to these topics,
    let’s take a look at the basic characteristics of an iterator.


