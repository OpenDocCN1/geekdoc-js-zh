    Template literals provide JavaScript with string formatting capabilities. Like
    many template technologies, templates in JavaScript consist of literal text, and
    placeholders where the runtime can evaluate an expression and substitute data
    into the literal text.


            let name = "Scott";


            let message = `Hello, ${name}!`;


            expect(message).toBe("Hello, Scott!");


    Backtickcharacters (`) enclose the entire template literal, while$and{} denote
    the substitution placeholders. Inside a placeholder, you can use identifiers and
    expressions.


    let showTheMath = function(x,y ){


                  return `${x} + ${y} is ${x + y}`;


    };


    let result = showTheMath(3,4);


    expect(result).toBe("3 + 4 is 7");


    Template literals can also span multiple lines.


    let message = `This is


                   a short, but multi-line message`;


    Note thatmessage will contain a newline character because newlines (and trailing
    spaces) are significant inside of a template literal.


    Template literals are a useful addition to the language. However, template literals
    become exceptionally interesting when using them with a tag.


    ## Tagged Template Literals


    The tag is a function with the ability to interpret and process a template. The
    tag appears in front of the template, so in the following code the tag istest.


    let name = "Scott";


    let result = test `Hello, ${name}!`;


    In this example,test is a custom function we’ll write. The runtime invokes a tag
    function and passes two parameters. The first parameter will be an array containing
    the literal pieces of text in the template.


    let test = function(literals, ...values) {


        expect(literals.length).toBe(2);   


        expect(literals[0]).toBe("Hello, ");


        expect(literals[1]).toBe("!");


        return "test";


    };


    let name = "Scott";


    let result = test `Hello, ${name}!`;


    expect(result).toBe("test");


    The template in the above code,`Hello, ${name}!`, generates an array with two
    pieces of literal text,“Hello”, and“!”. The runtime is breaking apart the template
    for us and giving us the literal text without the placeholders.


    The rest of the parameters to the tag function will contain the interpreted substitution
    values. If you don’t know how many placeholders will appear in a template, you
    can use a rest parameter to capture all the values in an array. Here is another
    code snippet showing how the runtime passes all the literal text and substitution
    values.


    let test = function(literals, ...values) {


        expect(literals.length).toBe(3);


        expect(literals[0]).toBe("Hello, ");


        expect(literals[1]).toBe(", ");


        expect(literals[2]).toBe("!");


        expect(values.length).toBe(2);


        expect(values[0]).toBe("Allen");


        expect(values[1]).toBe("Scott");


        return "test";


    };


    let firstName = "Scott";


    let lastName = "Allen";


    let result = test `Hello, ${lastName}, ${firstName}!`;


    expect(result).toBe("test");


    A tag function can build the output of a template by concatenating strings. For
    each literal value, you can append the literal to the result and then append avalue.
    However, a tag can interpret a template using any logic it desires, so if the
    tag wants to heedlessly return the string“test” regardless of the contents of
    the template, it can (as the code above is doing). The tag could also return the
    number 42, or any object.


    A more reasonable implementation of a tag might look like the following.


    let upper = function(strings, ...values) {


        let result = "";


        for(let i = 0; i < strings.length; i++) {


            result += strings[i];


                  if(i < values.length){


                      result += values[i];


                  }


        }


        return result.toUpperCase();


    };


    var x = 1;


    var y = 3;


    var result = upper `${x} + ${y} is ${x+y}`;


    expect(result).toBe("1 + 3 IS 4");


    The tag  upperbuilds a result that would look just like the normal evaluation
    of the template literal, but usestoUpperCase before returning the result to ensure
    the result uses all uppercase letters.


    ### The Power of Tagged Template Literals


    A tag’s ability to modify the output of a template is powerful. Imagine a tag
    that can build safe URLs by URL encoding a string, or asafehtml tag to build encoded
    HTML. Since we often use JavaScript to generate content like HTML, JSON, URLs,
    and form encoded inputs, future tag libraries to make these operations safe and
    easy will be invaluable.


    Even more interesting is the idea that the content inside of a template could
    be a language unto itself. The tag function could be the gateway to the interpreter
    for a domain specific language, which opens up many possibilities for the use
    (and abuse) of tagged template literals.


    # Classes


    Historically, many developers have learned JavaScript after learning languages
    like C++, Java, C#, Ruby, or Python. All of these languages have a class keyword,
    and in many of these languages, the class keyword is a primary building block
    for constructing software.


    Theclasskeyword in JavaScript will play a role similar to theclass keyword in
    other languages. Classes allow developers to define a blueprint for the construction
    of objects. The class defines the methods and properties an object will have when
    a program creates an instance of the class. A program can create as many objects
    as it needs from a single class definition.


    ## The Class Keyword


    Every class has a name followed by a body containing the method definitions for
    the class.


    class Employee {


        hire() {


            this.hired = true;


        }


        getStatus() {


            if(this.hired) {


                return "hired";


            }


        }


    }


    The above class has two methods:hireandgetStatus. Notice we do not need to use
    thefunction keyword to define the methods for the class. These methods will be
    available on every object we create using the Employee class, and the methods
    can save and retrieve state inside the object using thethis keyword.


    We can create an instance ofEmployeeusing thenew keyword with the class name.


    let developer = new Employee();


    developer.hire();


    expect(developer.hired).toBe(true);


    expect(developer.getStatus()).toBe("hired");


    We often say thenew keyword instantiates an object, and the variablenameddeveloper
    holds a reference to an instanceof theEmployee class.


    You will often want an object to begin life holding specific pieces of data, or
    state. We can add initialization logic for every object using a special constructor
    method.


    ## Class Constructor and Properties


    Every class may specify a single method with the nameconstructor. The runtime
    will automatically invoke the constructor method when instantiating a class. We
    can use the constructor to initialize state in an object, often by accepting parameters
    in the constructor method. In the following code, we want every employee to have
    a name.


    class Employee {


        constructor(name) {


            this.name = name;


        }


        getName() {


            return this.name.toUpperCase();


        }


    }


    let developer = new Employee("Scott");


    expect(developer.name).toBe("Scott");


    expect(developer.getName()).toBe("SCOTT");


    Notice how the code can pass arguments to the constructor when using thenew keyword.


    A class can also define propertieswithget and set to encapsulate a field.


    class Employee {


        constructor(name) {


             this._name = name;


        }


        doWork() {


            return `${this._name} is working`;


        }


        get name() {


            return this._name.toUpperCase();


        }


        set name(newName){


            if(newName){


                this._name = newName;


            }


        }


    }


    let developer = new Employee("Scott");


    expect(developer.name).toBe("SCOTT");


    developer.name = "Alex";


    expect(developer.doWork()).toBe("Alex is working");


    ## Classes behind the Scenes


    Even before the class keyword came along, we had the ability to define a blueprint
    for object construction in JavaScript. The approach was one we called the “constructor
    function and prototype object” approach.


