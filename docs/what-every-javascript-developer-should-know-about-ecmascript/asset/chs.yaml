- "# 每个 JavaScript 开发者应该了解的 ECMAScript 2015 (OdeToCode 编程系列)\n\n\n\n![](img/cover.jpeg)\n\
  \n\n\n\n![otc300](img/00001.jpeg)\n\n\n\n# 欢迎\n\n我坐下来写了这本书，我想读关于 2015 年 JavaScript\
  \ 的新特性。这本书并不是 ECMAScript 2015 规范中包含的所有内容的详尽列表。相反，我特意挑选了我们在日常编程中使用的重要特性。预计读者在 2015\
  \ 年之前已经很熟悉 JavaScript 语言。书中的代码示例使用 Jasmine 测试框架编写的，以验证我对代码如何工作的假设。特别感谢 Ruben Bartelink\
  \ 和 Porter T 的反馈。希望你喜欢后续的内容。\n\n# 变量与参数\n\nJavaScript 的变量作用域多年一直是惊喜和 Bug 的来源。ECMAScript\
  \ 2015 引入了许多新关键字和处理局部变量与函数参数的语法糖。这些特性让 JavaScript 代码更具表现力、更容易使用，并且更安全。\n\n## let\n\
  \nJavaScript 的变量作用域只提供函数作用域和全局作用域来控制变量的生命周期，这一直是一个意外。\n\n```javascript\nvar doWork\
  \ = function(flag){\n    if(flag) {\n      var x = 3;\n    }\n    return x; // x\
  \ 仍然可用\n};\n\nvar result = doWork(true);\nexpect(result).toBe(3); // 通过通过\n```\n\
  \n2015 年新的 `let` 关键字将取代变量声明中的 `var` 并提供块级作用域。\n\n```javascript\nlet doWork = function(flag)\
  \ {\n    if(flag){\n      let x = 3;\n    }\n    return x; // ReferenceError: x\
  \ 未定义\n};\n\nlet result = doWork(true);\nexpect(result).toBe(3);\n```\n\n迭代语句也受益于\
  \ `let`。\n\n```javascript\nvar doWork = function(){\n    for(let x = 0; x < 3; x++)\
  \ {\n        // ...\n    }\n    return x; // ReferenceError: x 未定义\n};\n```\n\n\
  ### 使用 let\n\nES2015 仍然支持 `var` 关键字，但在编写新代码时，我们应该将 `var` 视为过时的关键字。`let` 是新的 `var`！\n\
  \n`let` 会让 JavaScript 代码变得更好吗？我不确定 `let` 能防止大量的 Bug，但我认为 JavaScript 代码会改进。我们可以在使用变量的地方声明它们，这使得代码更容易追踪。\n\
  \n## const\n\n`const` 关键字将为你提供只读变量。像 `let` 一样，用 `const` 声明的变量具有块作用域，且你不能重新声明它。\n\
  \n```javascript\nconst MAX_BIES = 3;\n```\n\n常量并不要求大写，这只是我喜欢的习惯。\n\n### 使用 const\n\
  \n在完美的世界里，所有的 JavaScript 环境都应该对 `const` 有完美的实现。遗憾的是，`const` 是那些在官方 ECMAScript 规范出现之前就已经存在某些运行时中的关键字之一。\n\
  \n虽然大多数运行时都同意 `const` 应该是常量，但它们对于代码尝试给常量赋值新值时的行为存在分歧。应该导致运行时错误吗？还是静默失败？\n\n官方规范说，如果程序尝试给常量赋值新值，`const`\
  \ 应该产生运行时错误，而没有初始化器的常量声明应该是语法错误。\n\n```javascript\nconst MAX_SIZE = 10;\n// MAX_SIZE\
  \ = 12; // 如果执行，会导致 SyntaxError\n```\n\n我希望所有的运行时和浏览器很快就能正常并正确运行。目前的情况不应该阻止你尽可能使用\
  \ `const`，因为该关键字确实有几个优点：\n\n1. `const` 告诉其他程序员变量的意图行为，这使得脚本更容易维护。\n2. `const` 告诉运行时变量的意图行为，允许在时间和空间进行优化。\n\
  \n## 默认参数\n\n如果一个 JavaScript 函数接受两个参数，我们一直都有调用函数并传递两个参数、一个参数、零参数或在我们需要时传递三个参数的能力。在传递参数不足的情况下，函数的作者可能希望指定一个默认值，而不是处理\
  \ `undefined`。\n\n在 2015 年之前，开发者在函数内部使用 `||` 表达式给传入的参数应用默认值。在以下函数中，如果调用没有没有 `name`\
  \ 参数传递值，代码将分配默认值 Scott。\n\n```javascript\nlet doWork = function(name) {\n    name\
  \ = name || \"Scott\";\n    return name;\n};\n```\n\n在 2015 年，默认值是显式的，并出现在函数的参数列表中。\n\
  \n```javascript\nlet doWork = function(name = \"Scott\") {\n    return name;\n};\n\
  \nexpect(doWork()).toBe(\"Scott\");\n```\n\n\n\n\n函数甚至可以使用字面量表达式以外的内容来计算默认值。\n\n\
  ```javascript\nlet doWork = function(x = Math.random()) { return x; }\n```\n\n默认参数语法是\
  \ ES2015 如何为常见需求提供整洁语法的良好示例。我们再也不需要扫描函数的源代码或文档来发现默认值了。\n\n当然，并不是所有参数都是简单的值。对于涉及复杂配置（如\
  \ HTTP 调用）的操作，一种常见的编程技术是接受单个对象参数，通过其属性来设置 URI、HTTP 方法、超时设置等。默认参数在这种情况下也很有用，但我们必须等稍后，先学习对象解构。\n\
  \n## 剩余参数 (Rest Parameters)\n\n剩余参数允许函数处理数量数量的参数。函数的剩余参数始终出现在参数列表的末尾，并使用三个点前缀（`…`），如下所示。\n\
  \n```javascript\nlet doWork = function(name, ...numbers){\n    let result = 0;\n\
  \    numbers.forEach(function(n){\n        result += n;\n    });\n    return result;\n\
  };\n```\n\n调用 `doWork` 的调用者可以在剩余参数位置传递零个或多个参数。你可以说 `numbers` 参数将获取调用者传递给 `doWork`\
  \ 的“剩余”参数，并且 `numbers` 将这些参数存储在一个数组中。在下面的示例中，`numbers` 将引用包含值 1, 2, 3 的数组。\n\n```javascript\n\
  let result = doWork(\"Scott\", 1, 2, 3);\nexpect(result).toBe(6);\n```\n\n当调用者在剩余参数位置未传递参数时，剩余参数将是一个空数组。\n\
  \n```javascript\nlet doWork = function(...numbers){\n    return numbers;\n};\n\n\
  let result = doWork();\nexpect(result.length).toBe(0);\n```\n\n在 2015 年之前，我们可以通过使用函数内部隐式的\
  \ `arguments` 变量允许调用者向函数传递数量数量的参数。`arguments` 变量以类数组的形式包含了函数的所有参数，但 `arguments`\
  \ 并不是一个数组，这造成了混惑。如果不阅读函数的代码或文档，很难发现一个函数是否使用了 `arguments`。\n\n剩余参数将通过始终为我们提供真正的数组来避免混惑，并通过通过专门的语法，使得在阅读函数签名时剩余参数易于被发现。\n\
  \n## 展开运算符 (Spread Operator)\n\n展开运算符与我们在剩余参数中看到的语法相同，即一系列三个点（`...`）。然而，剩余参数是将单个参数收集到一个数组中，而展开运算符则是将数组展开为多个单个参数。我们可以在定义函数时使用剩余参数，并在调用函数时使用展开运算符。例如：\n\
  \n```javascript\nlet doWork = function(x, y, z) {\n    return x + y + z;\n}\n\n\
  let result = doWork(...[1, 2, 3]);\nexpect(result).toBe(6);\n```\n\n在上面的代码中，展开运算符将包含三个值的数组“展开”到参数\
  \ `x`、`y` 和 `z` 上。\n\n展开运算符还可以展开数组以在数组字面量中创建单个元素。\n\n```javascript\nlet a = [4,\
  \ 5, 6];\nlet b = [1, 2, 3, ...a, 7, 8, 9];\nexpect(b).toEqual([1,2,3,4,5,6,7,8,9]);\n\
  ```\n\n尽管我展示的示例都使用数组配合展开运算符，但展开运算符也适用于任何迭代对象（iterable object）。我们将在书的稍后部分查看迭代对象。\n\
  \n展开运算符还使得在不在乎实际参数值时，将参数传递给另一个函数变得简单（在那种情况下，我们通常会使用 `Function.apply`）。下面的 `doSomething`\
  \ 方法展示了这种情况。\n\n```javascript\nlet doWork = function(x, y, z){\n    return x + y\
  \ + z;\n}\n\nlet doSomething = function(...args){\n    return doWork(...args);\n\
  }\n\nlet result = doSomething(...[1,2,3,4,5]);\nexpect(result).toBe(6);\n```\n\n\
  注意，当使用展开时，数组中的值可以比目标函数需要的更多。展开将从数组的开始填充参数，因此在上面的示例中，`doWork` 只会看到数组中的前三个值。\n\n##\
  \ 解构 (Destructuring)\n\n解构一个对象就是拆解或撕开一个对象——这与构造（constructing）相反。\n\n在 2015 年，解构赋值允许我们将一个数组或对象拆分成各个部分，并将这些部分赋值给变量。方括号\
  \ `[` 和 `]` 用于解构数组，而花括号 `{` 和 `}` 将用于解构对象。\n\n下面的代码将解构一个数组，使得 `x` 包含 22，`y` 包含 44。\n\
  \n```javascript\nlet values = [22, 44];\nlet [x, y] = values;\nexpect(x).toBe(22);\n\
  expect(y).toBe(44);\n```\n\n你可以将赋值右侧的 `[` 和 `]` 视为构造数组的符号。赋值左侧的 `[` 和 `]` 解构数组并声明两个变量来持有这些部分。\n\
  \n对象的解构遵循相同的模式，但将使用 `{` 和 `}`。\n\n```javascript\nlet person = { firstName: \"Scott\"\
  , lastName: \"Allen\" };\nlet {firstName, lastName} = person;\nexpect(firstName).toBe(\"\
  Scott\");\nexpect(lastName).toBe(\"Allen\");\n```\n\n\n\n## 模板字符串\n\n模板字符串为 JavaScript\
  \ 提供了字符串格式化能力。与许多模板技术一样，JavaScript 中的模板由字面量和占位符组成，运行时可以在占位符处评估表达式并将数据替换到字面量中。\n\n\
  ```javascript\nlet name = \"Scott\";\nlet message = `Hello, ${name}!`;\nexpect(message).toBe(\"\
  Hello, Scott!\");\n```\n\n反引号（`` ` ``）包围整个模板字符串，而 `$` 和 `{}` 则表示替换占位符。在占位符内部，你可以使用标识符和表达式。\n\
  \n```javascript\nlet showTheMath = function(x,y ){\n    return `${x} + ${y} is ${x\
  \ + y}`;\n};\n\nlet result = showTheMath(3,4);\nexpect(result).toBe(\"3 + 4 is 7\"\
  );\n```\n\n模板字符串也可以跨行。\n\n```javascript\nlet message = `This is\n              \
  \ a short, but multi-line message`;\n```\n\n注意 `message` 将包含一个换行符，因为换行符（以及末尾空格）在模板字符串内部是有意义的。\n\
  \n模板字符串是该语言的一个非常有用的补充。然而，当模板字符串与标签（tag）一起使用时，它们变得异常有趣。\n\n## 标签模板字符串\n\n标签是一个具有解释和处理模板能力的函数。标签出现在模板之前，因此在下面的代码中，标签是\
  \ `test`。\n\n```javascript\nlet name = \"Scott\";\nlet result = test `Hello, ${name}!`;\n\
  ```\n\n在这个示例中，`test` 是我们将编写的一个自定义函数。运行时会调用标签函数并传递两个参数。第一个参数将是一个包含模板中字面量文本部分的数组。\n\
  \n```javascript\nlet test = function(literals, ...values) {\n    expect(literals.length).toBe(2);\
  \   \n    expect(literals[0]).toBe(\"Hello, \");\n    expect(literals[1]).toBe(\"\
  !\");\n    return \"test\";\n};\n\nlet name = \"Scott\";\nlet result = test `Hello,\
  \ ${name}!`;\nexpect(result).toBe(\"test\");\n```\n\n上述代码中的模板 `Hello, ${name}!`\
  \ 生成了一个包含两个字面量文本“Hello”和“!”）的数组。运行时正在为我们拆分模板，并向我们提供不含占位符的字面量文本。\n\n标签函数的其余参数将包含解释后的替换值。如果你不知道模板中会出现多少个占位符，可以使用剩余参数（rest\
  \ parameter）将所有值捕到一个数组中。这是另一个代码片段，展示了运行时如何传递所有的字面量文本和替换值。\n\n```javascript\nlet\
  \ test = function(literals, ...values) {\n    expect(literals.length).toBe(3);\n\
  \    expect(literals[0]).toBe(\"Hello, \");\n    expect(literals[1]).toBe(\", \"\
  );\n    expect(literals[2]).toBe(\"!\");\n    expect(values.length).toBe(2);\n \
  \   expect(values[0]).toBe(\"Allen\");\n    expect(values[1]).toBe(\"Scott\");\n\
  \    return \"test\";\n};\n\nlet firstName = \"Scott\";\nlet lastName = \"Allen\"\
  ;\nlet result = test `Hello, ${lastName}, ${firstName}!`;\nexpect(result).toBe(\"\
  test\");\n```\n\n标签函数可以通过拼接字符串来构建模板的输出。对于每个字面量值，你可以将字面量追加到结果中，然后追加一个值。然而，标签可以使用任何它想要的逻辑来解释模板，因此如果标签想无论模板内容如何顾一切地返回字符串“test”，它是可以的（如上面的代码所做的）。标签也可以返回数字\
  \ 42 或任何对象。\n\n一个更合理的标签实现可能如下：\n\n```javascript\nlet upper = function(strings, ...values)\
  \ {\n    let result = \"\";\n    for(let i = 0; i < strings.length; i++) {\n   \
  \     result += strings[i];\n        if(i < values.length){\n            result\
  \ += values[i];\n        }\n    }\n    return result.toUpperCase();\n};\n\nvar x\
  \ = 1;\nvar y = 3;\nvar result = upper `${x} + ${y} is ${x+y}`;\nexpect(result).toBe(\"\
  1 + 3 IS 4\");\n```\n\n标签 `upper` 构建的结果看起来就像模板字符串的正常评估一样，但在返回结果之前使用了 `toUpperCase()`，以确保结果使用所有大写字母。\n\
  \n### 标签模板字符串的力量\n\n标签 `upper` 构建的结果看起来就像模板字符串的正常评估一样，但在返回结果之前使用了 `toUpperCase()`，以确保结果使用所有大写字母。\n\
