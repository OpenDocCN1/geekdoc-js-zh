    \ = yield fetch('https://api.example.com/data');\n3      console.log(`Data loaded:\
    \ ${data}`);\n4  }\n5  \n6  function handleGenerator(gen) {\n7      const generator\
    \ = gen();\n8      function handle(yielded) {\n9          if (!yielded.done) {\n\
