  md: '# Chapter 2: The Basics of Generators


    1.Execution Control:


    +   - **Regular Functions**: Once invoked, they run to completion without any
    interruption.

    - **Generators**: They can pause and resume their execution, allowing for more
    control over their execution flow.


    2. State Preservation:


    +   - **Regular Functions**: They do not maintain state between calls. Each call
    is independent.

    - **Generators**: They maintain their state (local variables, current execution
    context) between yield statements, allowing them to be stateful.


    3. Return Values and Iteration:


    +   - **Regular Functions**: They return a single value or object.

    - **Generators**: They can return (yield) multiple values over time, making them
    iterable.


    # Code Sample: Regular Function vs. Generator Function'
