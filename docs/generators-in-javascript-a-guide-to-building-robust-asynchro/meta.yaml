  md: '# # Chapter 3: Advanced Generator Concepts


    # ## Generator Protocols and Interfaces


    # ### Introduction to Protocols and Interfaces in JavaScript


    In JavaScript, protocols and interfaces are sets of rules and conventions that
    objects can follow to integrate with language features. Generators are designed
    to adhere to specific protocols, making them versatile and interoperable in various
    programming scenarios.


    # #### The Iterable Protocol


    +   1. **Definition:** The iterable protocol allows JavaScript objects to define
    or customize their iteration behavior. This is the protocol that enables objects
    to be used in a `for...of` loop.

    2. **Generators and Iterables:** Every generator function automatically conforms
    to the iterable protocol. This means when a generator function is called, it returns
    an iterable object.


