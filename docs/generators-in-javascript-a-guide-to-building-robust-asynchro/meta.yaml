    \ start or continue the execution of the generator function. Each call to `next()`\
    \ resumes the function until the next `yield` is encountered.\n2. **Yielded Value\
    \ and Done:** The `next()` method returns an object with two properties: `value`\
    \ (the yielded value) and `done` (a boolean indicating whether the generator function\
    \ has completed its execution).\n\n## Code Sample: Using next() Method\n\n```\n\
    console.log(generator.next());\n// Output: { value: 1, done: false }\n\nconsole.log(generator.next());\n\
    // Output: { value: 2, done: false }\n\nconsole.log(generator.next());\n// Output:\
    \ { value: 3, done: false }\n\nconsole.log(generator.next());\n// Output: { value:\
    \ undefined, done: true }\n```\n\nHere, each `next()` call resumes `numberGenerator`\
    \ until there are no more `yield` statements, at which point `done` becomes true.\n\
    \n## Mechanics Behind Generators\n\nGenerators are more than syntactic sugar for\
    \ asynchronous operations; they fundamentally alter how functions execute. Unlike\
    \ normal functions that run to completion in a single call, generators are stateful\
    \ and remember their context between executions.\n\n1. **Stateful Execution:**\
    \ When a generator yields, it saves its context (variable values, the position\
    \ of execution) and pauses. Upon the next `next()` call, it restores this context\
    \ and continues from where it left off.\n2. **Infinite Execution**: Generators\
    \ can run indefinitely, making them suitable for scenarios like infinite sequences\
    \ or event handling where the end condition is not predefined.\n3. **Error Handling**:\
    \ Generators can also handle errors using try-catch blocks within the generator\
    \ function, allowing for sophisticated error management strategies.\n\n## Under\
    \ the Hood: How Generators Work\n\n### Invocation and Execution Flow\n\n![](img/84ceb2ad7ed2a39f7640b04d4c904c4b_19_0.png)\n\
    \nUnderstanding how generators work internally starts with their invocation. When\
    \ a generator function is called, it does not execute its code immediately. Instead,\
    \ it returns a generator object, which is used to control the execution of the\
    \ generator function.\n\n1. **Lazy Execution**: Unlike regular functions, *the\
    \ execution of generators is lazy*. This means that the code inside a generator\
    \ function executes only when the `.next()` method of the generator object is\
    \ called.\n2. **Execution Context**: Each generator maintains its execution context,\
    \ including variable states, the current line of execution, and the scope chain.\
    \ This context is saved every time the generator yields and is restored when the\
    \ execution resumes.\n\n### Yielding and Resuming\n\nThe core functionality of\
    \ a generator revolves around the `yield` keyword and the `.next()` method.\n\n\
    1. **Yield Keyword**: When a generator encounters a `yield` statement, it produces\
    \ the value specified, saves its current state, and pauses its execution. The\
    \ state includes local variables, the position of the yield statement, and the\
    \ scope.\n2. **Next Method**: Calling the `.next()` method on a generator object\
    \ resumes its execution from the last yield point. The method can also pass a\
    \ value back to the generator, which can be used as the result of the yield expression,\
    \ allowing two-way communication.\n\n### Code Sample: Yielding and Resuming Execution\n\
    \n```\nfunction* dataProcessor() {\n    const data = yield 'Please provide data';\n\
    \    return `Processed ${data}`;\n}\n\nconst processor = dataProcessor();\n\n\
    console.log(processor.next());\n// Output: { value: 'Please provide data', done:\
    \ false }\n\nconsole.log(processor.next('Input'));\n// Output: { value: 'Processed\
    \ Input', done: true }\n```\n\nThis example demonstrates how a generator can yield\
    \ a value and then resume processing with an input.\n\n## JavaScript Runtime and\
    \ Event Loop\n\nGenerators fit into the JavaScript runtime and event loop in a\
    \ unique way:\n\n- **Non-Blocking**: Generator functions, especially when used\
    \ for asynchronous operations, do not block the JavaScript event loop. The ability\
    \ to pause and resume ensures that long-running operations do not hinder the responsiveness\
    \ of an application.\n- **Integration with Promises and Async/Await**: Generators\
    \ can be seamlessly integrated with Promises and async/await syntax, enabling\
    \ complex asynchronous flows to be handled more elegantly.\n- **Event Loop Interaction**:\
    \ When a generator yields, it effectively steps out of the call stack, allowing\
    \ other operations in the event loop to run. When the generator resumes, it re-enters\
    \ the call stack at its previous position.\n\n## Chapter 2: The Basics of Generators\n\
    \n### Creating Your First Generator\n\n#### Introduction to Generator Functions\n\
    \nGenerator functions are a unique feature in JavaScript, allowing functions to\
    \ pause their execution and resume at a later point. This functionality opens\
    \ up a new realm of possibilities for handling data and asynchronous operations.\
    \ In this section, we will walk through the steps of creating your first generator\
    \ function, laying the foundation for more advanced concepts.\n\n#### Step 1:\
    \ Writing a Generator Function\n\nA generator function is defined using the `function*`\
    \ syntax. Here's how you can create a simple generator function:\n\n```\n1  function*\
    \ simpleGenerator() {\n2      yield 'Hello';\n3      yield 'World';\n4  }\n```\n\
    \nIn this example, `simpleGenerator` is a generator function that yields two values,\
    \ 'Hello' and 'World'.\n\n#### Step 2: Iterating Over a Generator\n\nTo use the\
    \ generator, you first need to instantiate it, which creates a generator object.\
    \ This object adheres to both the iterable and iterator protocols.\n\n```\nconst\
    \ myGenerator = simpleGenerator();\n```\n\nNow, let's iterate over the generator:\n\
    \n```\nconsole.log(myGenerator.next().value);\n// Output: Hello\n\nconsole.log(myGenerator.next().value);\n\
    // Output: World\n\nconsole.log(myGenerator.next().value);\n// Output: undefined\n\
    ```\n\nEach call to `myGenerator.next()` resumes the generator function's execution\
    \ up to the next `yield`. When the generator has no more values to yield, it returns\
    \ an object with `value` as `undefined` and `done` as `true`.\n\n### Understanding\
    \ the Generator's State\n\nWhen a generator yields, it pauses its state (context).\
    \ This state includes variables, the position of each `yield`, and the scope.\
    \ The generator resumes from this state on the next `next()` call.\n\n### Practical\
    \ Usage\n\nGenerators are particularly useful when dealing with sequences of data.\
    \ They allow you to define potentially infinite data sequences without worrying\
    \ about memory constraints of storing them all at once.\n\n### Code Sample: Generating\
    \ an Infinite Sequence\n\n```\nfunction* infiniteSequence() {\n    let i = 0;\n\
    \    while (true) {\n        yield i++;\n    }\n}\n\nconst sequence = infiniteSequence();\n\
    console.log(sequence.next().value);\n// Output: 0\n\nconsole.log(sequence.next().value);\n\
    // Output: 1\n// ...and so on\n```\n\nThis generator function generates an infinite\
    \ sequence of numbers. Despite the infinite loop, it doesn't cause a memory overflow\
    \ because the values are yielded one at a time."
