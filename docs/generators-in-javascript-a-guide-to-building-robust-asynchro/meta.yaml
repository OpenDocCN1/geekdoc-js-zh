    12             ));\n13         }\n14     }\n15     handle(generator.next());\n\
    16 }\n17 \n18 handleGenerator(asyncDataLoader);\n```"
- md: " This code shows how a generator can yield promises from asynchronous operations,\
    \ and a handler function can orchestrate the execution of these operations.\n\n\
    ## Error Handling in Asynchronous Sequences\n\nGenerators provide a structured\
    \ way to handle errors in asynchronous sequences. Errors in yielded promises can\
    \ be caught in a try-catch block inside the generator, allowing for centralized\
    \ error handling.\n\n## Error Handling in Generators\n\n### Importance of Robust\
    \ Error Handling\n\nError handling is a critical aspect of writing reliable and\
    \ maintainable code. In the context of generators, which may run across multiple\
    \ ticks of the event loop and handle complex logic, effective error management\
    \ is even more crucial.\n\n### Using Try-Catch Blocks in Generators\n\nGenerators\
    \ can encapsulate error handling logic within themselves using try-catch blocks.\
    \ This encapsulation allows for localized handling of errors that occur during\
    \ the generator's execution.\n\n### Code Sample: Local Error Handling\n\n```\n\
    function* errorProneGenerator() {\n    try {\n        yield 'First step';\n  \
    \      throw new Error('Something went wrong');\n    } catch (error) {\n     \
    \   yield `Error caught: ${error.message}`;\n    }\n    yield 'Continuing after\
    \ error';\n}\n\nconst generator = errorProneGenerator();\nconsole.log(generator.next().value);\n\
    // Output: First step\n\nconsole.log(generator.next().value);\n// Output: Error\
    \ caught: Something went wrong\n\nconsole.log(generator.next().value);\n// Output:\
    \ Continuing after error\n```\n\nIn this example, the generator catches and handles\
    \ its own error, then continues execution.\n\n### Handling Errors from Yielded\
    \ Promises\n\nWhen dealing with asynchronous operations via yielded promises,\
    \ errors can be handled similarly. If a promise is rejected, the error can be\
    \ caught in the generator.\n\n```\n1  function* asyncErrorHandlingGenerator()\
    \ {\n2      try {\n3          yield fetch('https://api.example.com/data');\n4\
    \      } catch (error) {\n5          yield `Fetch error: ${error.message}`;\n\
    6      }\n7  }\n8\n9  // The function handling the generator would need to ensure\
    \ that\n10 // rejected promises are appropriately thrown back into the generator\n\
    ```\n\n### Best Practices for Error Handling in Generators\n\n- 1. **Centralize\
    \ Error Handling:** Use try-catch blocks to handle errors where they occur, keeping\
    \ the error handling logic close to the source of the error.\n- 2. **Graceful\
    \ Degradation:** Ensure that your generator can handle errors gracefully, providing\
    \ fallbacks or alternative flows where appropriate.\n- 3. **Clear Error Propagation:**\
    \ In scenarios where the generator cannot handle the error, ensure it is propagated\
    \ clearly to the caller.\n- 4. **Comprehensive Coverage:** Anticipate and handle\
    \ all possible error scenarios, especially in asynchronous flows, to prevent uncaught\
    \ exceptions.\n\n## Generator Composition and Nesting\n\n### The Concept of Composing\
    \ Generators\n\nGenerator composition involves using multiple generator functions\
    \ together, where one generator delegates to another. This approach can modularize\
    \ code, making it more readable and maintainable by separating concerns into different\
    \ generator functions.\n\n### Advantages of Generator Composition\n\n- 1. **Modularity**:\
    \ Breaking down complex logic into smaller, reusable generators.\n- 2. **Readability**:\
    \ Making the code more understandable by structuring it into well-defined, logical\
    \ sequences.\n- 3. **Maintainability**: Easier to update and manage smaller, self-contained\
    \ generators.\n\n```\nfunction* firstGenerator() {\n    yield 'First';\n    yield\
    \ 'Generator';\n}\n\nfunction* secondGenerator() {\n    yield* firstGenerator();\n\
    \    yield 'Second';\n    yield 'Generator';\n}\n\nconst composedGenerator = secondGenerator();\n\
    for (const value of composedGenerator) {\n    console.log(value);\n    // Outputs:\
    \ First, Generator, Second, Generator\n}\n```\n\nIn this example, `secondGenerator`\
    \ composes `firstGenerator` within it, demonstrating basic generator composition.\n\
    \n### Nesting Generators for Complex Flows\n\nNesting involves using generators\
    \ within generators, either through `yield*` or by yielding results of one generator\
    \ from another. This approach is useful for complex logical flows where different\
    \ stages or steps are best handled by separate generators.\n\n```\n1  function*\
    \ nestedGenerator() {\n2      yield 'Start';\n3      yield* secondGenerator();\
    \ // Nested generator call\n4      yield 'End';\n5  }\n6\n7  const nested = nestedGenerator();\n\
    8  for (const value of nested) {\n9      console.log(value);\n10     // Outputs:\
    \ Start, First, Generator, Second, Generator, End\n11 }\n```\n\nHere, `nestedGenerator`\
    \ nests `secondGenerator`, illustrating how multiple layers of generators can\
    \ be combined.\n\n### Best Practices for Generator Composition and Nesting\n\n\
    - 1. **Clear Responsibilities**: Ensure each generator has a clear and distinct\
    \ role.\n- 2. **Avoid Over-Complexity**: While nesting can be powerful, overly\
    \ complex nested structures can become hard to follow.\n- 3. **Error Propagation:**\
    \ Consider how errors are handled and propagated in nested generators to maintain\
    \ predictable behavior."
  mdcn: "\n这段代码展示了生成器如何从异步操作中 yield promise，以及处理函数如何编排这些操作的执行。\n\n## 异步序列中的错误处理\n\n\
    生成器提供了一种结构化的方式来处理异步序列中的错误。yield 的 promise 中的错误可以在生成器内部的 try-catch 块中捕获，从而实现集中式的错误处理。\n\
    \n## 生成器中的错误处理\n\n### 健壮错误处理的重要性\n\n错误处理是编写可靠且可维护代码的关键方面。就生成器而言，它们可能在事件循环的多个 tick\
    \ 中运行并处理复杂的逻辑，因此有效的错误管理尤为重要。\n\n### 在生成器中使用 Try-Catch 块\n\n生成器可以在其内部使用 try-catch\
    \ 块封装错误处理逻辑。这种封装允许对生成器执行期间发生的错误进行本地化地处理。\n\n### 代码示例：本地化错误处理\n\n```\nfunction*\
