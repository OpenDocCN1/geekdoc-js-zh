    ```

    const head = x => x[0];

    const reverse = reduce(acc, x) => [x,acc], []];

    const last = compose(head, reverse);

    ```


    ```

    last([''''jumpkick'', ''roundhouse'', ''uppercase'']); // ''uppercut''

    ```


    reverse turns the list around head grabs the initial item. This results in an
    effective, albeit indent function. The sequence of functions in the composition
    would be apparent here. We could define a left to a right version, however, we
    mirror the mathematical version much more closely as it stands. That''s right,
    composition is straight from the math books. In fact, perhaps it''s time to look
    at a property that holds for any composition.


    ```

    // associativity

    compose(f, compose(g, h)) === compose(f, g, h);

    ```


    Composition is associative, meaning it doesn''t matter how you group two of them.
    So, we should uppercase the string, and can write:


    ```

    compose(toUpperCase, compose(head, reverse));

    //

    compose(toUpperCase, head, reverse);

    ```


    Since it doesn''t matter how we group our calls to compose, the result will be
    the same. This allows us to use a variadic compose and use it as follows:


    ```

    // previously we would have to compose two, but since it''s associative,

    // we can give compose as many as we like and let it decide how to group them.

    const arg = [''jumpkick'', ''roundhouse'', ''uppercase''];

    const lastUpper = compose(toUpperCase, head, reverse);

    const loudLastUpper = compose(toUpperCase, head, reverse);

    ```


    ```

    lastUpper(arg); // ''UPPER''

    loudLastUpper(arg); // ''UPPER!''

    ```


    Applying the associative property gives us this flexibility and peace of mind
    that the result will be equivalent. The slightly more complicated variadic definition
    is included with the support libraries for this book and is the normal definition
    you''ll find in libraries like lodash, underscore, and ramda.


    One pleasant benefit of associativity is that any group of functions can be extracted
    and bundled together in their very own composition. Let''s play with refactoring
    our previous example:'
