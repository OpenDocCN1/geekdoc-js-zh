    \ // [1,2,3]\nxs.splice(0,3); // [4,5]\nxs.splice(0,3); // []\n```\n\nIn functional\
    \ programming, we dislike unwieldy functions like splice that mutate data. This\
    \ will never do as we're striving for reliable functions that return the same\
