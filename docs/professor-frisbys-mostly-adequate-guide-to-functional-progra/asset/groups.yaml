    \n## Chapter 01: What Ever Are We Doing?\n\n## Introductions\n\n### A Brief Encounter\n\
    \nLet's start with a touch of insanity. Here is a seagull application. When flocks\
    \ join a larger flock, and when they breed, they increase by the number of seagulls\
    \ with whom they're breeding. This is not intended to be good Object-Oriented\
    \ code, mind you, it is here to highlight the perils of our modern, assignment\
    \ based approach. Behold:\n\n```javascript\nclass Flock {\n  constructor(seagulls)\
    \ {\n    this.seagulls = seagulls;\n  }\n\n  join(otherFlock) {\n    this.seagulls\
    \ = this.seagulls.concat(otherFlock.seagulls);\n  }\n\n  breed(otherFlock) {\n\
    \    const newSeagulls = [];\n    for (let s1 of this.seagulls) {\n      for (let\
    \ s2 of otherFlock.seagulls) {\n        newSeagulls.push(new Seagull(s1, s2));\n\
    \      }\n    }\n    this.seagulls = this.seagulls.concat(newSeagulls);\n  }\n\
    }\n\nclass Seagull {\n  constructor(parent1, parent2) {\n    this.parent1 = parent1;\n\
    \    this.parent2 = parent2;\n  }\n}\n\nconst flockA = new Flock([new Seagull(),\
    \ new Seagull()]);\nconst flockB = new Flock([new Seagull(), new Seagull()]);\n\
    \nflockA.join(flockB);\nflockA.breed(flockB);\n\nconsole.log(flockA.seagulls.length);\
    \ // 6\n```\n*(Wait, the OCR text provided didn't have the code for the seagull\
