    \ f, Functor g) => f -> g`。它的特殊之处在于，由于某种原因，我们无法查看泛子的内容。将其视为一种高度机密的交换——这是一种结构化操作，一种功能性的装改变。正式地说，自然转换是满足以下等式的任何函数：\n\
