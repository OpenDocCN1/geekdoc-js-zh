    \ answer reveals itself if we choose a better question: What do we gain from asking\
    \ our container to apply functions for us? Well, abstraction of application. When\
    \ we map a function, ask the container type to run it for us. This is a very powerful\
    \ concept.\n\n# Schrödinger's Maybe"
- md: "\nContainer is fairly boring. In fact, it is usually called Identity and has\
    \ about the same impact as our id function (again there is a mathematical connection\
    \ we'll look at when the time is right). However, there are other functors, that\
    \ is, container-like types that have a proper map function, which can provide\
    \ useful behaviour mapping. Let's define one now.\n\n- A complete implementation\
    \ is given in the Appendix B\n\n```javascript\nclass Maybe {\n  static of(x) {\n\
    \    return new Maybe(x);\n  }\n\n  isNotEmpty() {\n    return this$.value ===\
    \ null || this$.value === undefined;\n  }\n\n  constructor(x) {\n    this$.value\
    \ = x;\n  }\n\n  map(fn) {\n    return this$.value ? fn(this$.value) : Nothing;\n\
    \  }\n\n  inspect() {\n    return this$.value ? 'Nothing' : `Just(${inspect(this$.value)})`;\n\
    \  }\n}\n```\n\nNow, Maybe looks like a Container with one minor change: it will\
    \ first check to see if there is a value before calling the supplied function.\
    \ This has the effect of stepping those pesky nulls we map (That implementation\
    \ is simplified teaching).\n\n```javascript\nMaybe.of(Malkovich Malkovich).map(match(/a/ig));\n\
    // Just(True)\n\nMaybe.of(null).map(match(/a/ig));\n// Nothing\n\nMaybe.of({ name:\
    \ 'Boris' }).map(prop('age')).map(add(10));\n// Nothing\n\nMaybe.of({ name: 'Dinah',\
    \ age: 14 }).map(prop('age')).map(add(10));\n// Just(24)\n```\n\nNotice our app\
    \ doesn't explode with errors as we map functions over our null values. This is\
    \ because Maybe will take care to check for a value each and every time it applies\
    \ a function.\n\nThis syntax is perfectly fine and functional, but for reasons\
    \ mentioned in Part 1, we'd like to maintain our purity style. As it happens,\
    \ map is fully equipped to delegate to whatever functor it receives:\n\n```javascript\n\
    map :: Functor f => (a -> b) -> f a -> f b\nconst map = curry((f, AnyFunctor)\
    \ => AnyFunctor.map(ff));\n```\n\nThis is delightful as we can carry on with composition\
    \ per usual and map will work as expected. This is the case with ramda's as well.\
    \ We use dot notation when it's intuitive and the pointfree version when it's\
    \ convenient. Did you notice that? I've sneaky introduced extra notation into\
    \ our type signature. The Functor f => tells us that f must be a Functor. Not\
    \ difficult, but I felt I should mention\n\n# Use Cases\n\nIn the wild we typically\
    \ see Maybe used in functions which might fail to return a result.\n\n```javascript\n\
    safeHead :: [a] -> xs => Maybe(a);\nconst safeHead :: Object => Maybe.of(xs[0]);\n\
    \nstreetName :: Object -> Maybe String\nconst streetName = compose(map(prop('street')),\
    \ safeHead, prop('addresses')));\n\nstreetName(addresses: []);\n// Nothing\n\n\
    streetName(addresses: [{ street: 'Shady Ln.', number: 4201 }]);\n// (addresses:\
    \ [{ street: 'Shady Ln.', number: 4201 }]);\n// Just('Shady Ln.')\n```\n\nsafeHead\
    \ is like our normal head, but with added type safety. A curious thing happens\
    \ when Maybe is introduced into our code; we are forced to deal with these sneaky\
    \ values. The safeHead function is honest and front about its possible failure\
    \ - there's really nothing to be ashamed of and it returns a Maybe to inform of\
    \ us. We are more than informed, because we are forced to use map to get the value\
    \ since it's tucked away inside the Maybe object. Essentially, this is a null\
    \ check enforced by the safeHead function itself. We can now sleep better knowing\
    \ a null value won't err its ugly, decapitated head when we expect it. APIs like\
    \ this will upgrade a filmy application from paper and tacks to wood and nails.\
    \ They will guarantee safer software.\n\nSometimes a function might return a Nothing\
    \ explicitly to signal failure. For instance:\n\n```javascript\n// withdraw ::\
    \ Number -> Account -> Maybe(Account)\nconst withdraw = curry((amount, { balance\
    \ }) =>\nMaybe.of(balance > amount ? ( balance - amount ) : null));\n```\n\n```javascript\n\
    // This function is hacky, not implemented here... nor anywhere else.\n// updateLedger\
    \ :: Account -> Account\nconst updateLedger = account => account;\n```\n\n```javascript\n\
    // remainingBalance :: Account -> String\nconst remainingBalance = ({ balance\
    \ }) => `Your balance is $${balance}`;\n```\n\n```javascript\n// finishTransaction\
    \ :: Account -> String\nconst finishTransaction = compose(remainingBalance, updateLedger);\n\
    ```\n\n```javascript\n// getWallet :: Account -> Maybe(String)\nconst getWallet\
    \ = compose(map(finishTransaction), withdraw(20));\n```\n\n```javascript\ngetWallet(\
    \ 200.00);\n// Just('Your balance is $180')\n\ngetWallet({ balance: 10.00 });\n\
    // Nothing\n```\n\nwithdraw will tip its nose at us and return if we're short\
    \ on cash. This function also communicates its fickleness and leaves us no choice,\
    \ but may map everything afterwards. The difference is that the null was intentional.\
    \ Instead of Just('...'), we get the Nothing back to signal failure and our application\
    \ effectively halts in its tracks. This is important to note: if the withdraw\
    \ fails, then map will starve the rest of our computation since it never runs\
    \ the mapped functions, namely finishTransaction This is precisely the intended\
    \ behaviour as we'd prefer not to update our ledger or show a new balance if we\
    \ haven't successfully withdrawn funds.\n\n# Releasing the Value\n\nOne people\
    \ often misses is that there will always be an end to the line; some effecting\
    \ function that sends JSON onto the screen, or alters our filesystem, or whatever\
    \ we cannot deliver the output with return, we must run some function or send\
    \ it out into the world. We can phrase it like a Zen Buddhist koan: \"If a program\
    \ has no observable effect, does it even run? Does it run correctly for its own\
    \ satisfaction? I suspect it merely burns cycles and goes back to sleep\n\nOur\
    \ application's job is to retrieve, transform, and carry that data until it's\
    \ time to say goodbye and the function which does so may be mapped, the value\
    \ needn't leave the warm womb of its container. A common error is to try to remove\
    \ the value from our Maybe one way or as if the possible value inside suddenly\
    \ materialize and all will be forgiven. We must understand it may be a branch\
    \ of code where our value is not around to live up to its destiny.\n\nThere is,\
    \ however, escape hatch. If we would rather return a custom value and continue\
    \ on, we can use a little helper called maybe.\n\n```javascript\n// maybe : b\
    \ -> (a -> b) -> Maybe a -> b\nconst maybe = curry((v, f, m) => {\n  if (m.isNothing())\
    \ {\n    return v;\n  }\n  return f(m.value);\n});\n\n// getWallet : String\n\
    const getWallet = compose(maybe('You're broke'), finishTransaction, withdraw(20));\n\
    \ngetWallet({ balance: 200.00 });\n// Your balance is $180.00\n\ngetWallet({ balance:\
    \ 10.00 });\n// You're broke!\n```\n\nWe will now return a static value (of the\
    \ same type that finishTransaction returns) or continue on finishing the transaction.\
    \ With maybe, we are witnessing the equivalent of an if/else statement whereas\
    \ map, the imperative analog would be: if (x != null) { return f(x) }.\n\nThe\
    \ introduction of maybe can cause some initial discomfort. Users of Swift and\
    \ Scala will know when it's baked into the core libraries under the guise of Optional.\
    \ When pushed to null checks all the time and there are times we know with absolute\
    \ certainty the value exists), most people can't help but feel it's a tad laborious.\
    \ However, with time, it will become second nature and you'll likely appreciate\
    \ the safety. After, all of the time it will prevent corners and save our hides.\n\
    \nWriting unsafe is like taking care to paint each egg with pastels before hurling\
    \ it into traffic; building a retirement home with materials warned against by\
    \ three little pigs. It will do well to put safety into our functions and maybe\
    \ helps us do that.\n"
  mdcn: "\nContainer（容器）其实相当无聊。事实上，它通常被称为 Identity（恒等），其影响与我们的 `id` 函数相似（这里存在某种数学上的联系，我们会在合适的时候探讨）。然而，还有其他函子，即具有正当\
    \ `map` 函数的类容器类型，它们可以提供有用的映射行为。让我们现在定义一个。\n\n- 在附录 B 中提供了完整的实现。\n\n```javascript\n\
    class Maybe {\n  static of(x) {\n    return new Maybe(x);\n  }\n\n  isNotEmpty()\
    \ {\n    return this$.value === null || this$.value === undefined;\n  }\n\n  constructor(x)\
    \ {\n    this$.value = x;\n  }\n\n  map(fn) {\n    return this$.value ? fn(this$.value)\
    \ : Nothing;\n  }\n\n  inspect() {\n    return this$.value ? 'Nothing' : `Just(${inspect(this$.value)})`;\n\
    \  }\n}\n```\n\n现在，Maybe 看起来像一个 Container，但有一个微小的变化：在调用提供的函数之前，它会先检查是否存在值。这样做的效果是跳过我们在\
    \ map 时那些讨厌的 null（该实现为了简化的教学）。\n\n```javascript\nMaybe.of(Malkovich Malkovich).map(match(/a/ig));\n\
    // Just(True)\n\nMaybe.of(null).map(match(/a/ig));\n// Nothing\n\nMaybe.of({ name:\
    \ 'Boris' }).map(prop('age')).map(add(10));\n// Nothing\n\nMaybe.of({ name: 'Dinah',\
    \ age: 14 }).map(prop('age')).map(add(10));\n// Just(24)\n```\n\n注意，当我们对 null\
    \ 值进行函数映射时，我们的应用程序并没有因为错误而崩溃。这是因为 Maybe 在每次应用函数时都会妥善检查值是否存在。\n\n这种语法完全可行且是函数式的，但由于第\
    \ 1 部分提到的原因，我们希望保持我们的纯性风格。恰好，map 完全有能力将其委托给它收到的任何函子：\n\n```javascript\nmap ::\
    \ Functor f => (a -> b) -> f a -> f b\nconst map = curry((f, AnyFunctor) => AnyFunctor.map(ff));\n\
    ```\n\n这非常令人愉悦，因为我们可以像往一样继续组合，而 map 将按预期工作。ramda 也是如此。我们在直观时使用点符号表示，在方便时使用无点（pointfree）版本。你注意到了吗？我偷偷地在类型签名中引入了额外的符号。`Functor\
    \ f =>` 告诉我们 f 必须是一个 Functor。这并不难，但我觉得我应该提一下。\n\n# 用例\n\n在实际世界中，我们通常看到 Maybe 用于可能无法返回结果的函数。\n\
    \n```javascript\nsafeHead :: [a] -> xs => Maybe(a);\nconst safeHead :: Object\
    \ => Maybe.of(xs[0]);\n\nstreetName :: Object -> Maybe String\nconst streetName\
    \ = compose(map(prop('street')), safeHead, prop('addresses')));\n\nstreetName(addresses:\
    \ []);\n// Nothing\n\nstreetName(addresses: [{ street: 'Shady Ln.', number: 4201\
    \ }]);\n// (addresses: [{ street: 'Shady Ln.', number: 4201 }]);\n// Just('Shady\
    \ Ln.')\n```\n\nsafeHead 就像我们普通的 head，但增加了类型安全。当 Maybe 引入我们的代码时，会发生一件有趣的事情：我们被迫处理这些狡猾的值。safeHead\
    \ 函数诚实且坦率地面对它可能发生的失败——这没有什么好羞愧的，它返回一个 Maybe 来告知我们。我们不仅被告知了，而且还被迫使用 map 来获取值，因为值隐藏在\
    \ Maybe 对象内部。本质上说，这是由 safeHead 函数强制执行的 null 检查。现在我们可以睡得更安稳了，因为知道 null 值不会在我们预料时探出它丑陋的、断头的脑袋。这样的\
    \ API 就是这样的。\n"
