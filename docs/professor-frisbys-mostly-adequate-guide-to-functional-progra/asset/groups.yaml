  - "[PAGE 73]\n\nIf we have two layers of the same type, we can smash them together\
    \ with join. This ability to join together, this functor matrimony, is what makes\
    \ a monad monad. Let's inch towards the full definition with something a little\
    \ more accurate:\n\n+   - Monads are pointed functors that can flatten\n\nAny\
    \ function that has a join method, has an of method, and obeys a few laws is a\
    \ monad. Defining join is not too difficult so let's do so for Maybe:\n\n```\n\
    Maybe.prototype.join = function() {\n  return this.isNothing(null) : Maybe(this.$value);\n\
    };\n```\n\nThere, simply consuming one's twin in the womb. If we have a Maybe(Maybe(x))\
    \ then will just remove the unnecessary extra layer and we can safely map from\
    \ there. Otherwise, we'll have the one Maybe as nothing would have been mapped\
    \ in the first place.\n\nNow that we have a join method, let's sprinkle some magic\
    \ dust over the firstAddress example and see it in action:\n\n```\n// join : Monad\
    \ m => m (a) -> m a\nconst join = ma => ma.join();\n\n// firstAddress :: User\
    \ -> Maybe Street\nconst firstAddress = compose(\njoin,\nmap(safeProp('street')),\n\
    join,\nmap(safehead, safeProp('addresses'))\n);\n\nfirstAddress({\naddresses:\
    \ [{ street: 'Mulbury', number: 8402 }, postcode: 'W22N' }],\n}); // Maybe(name:\
    \ 'Mulbury', number: 8402));\n```\n\nWe added join wherever we encountered the\
    \ nested Maybe's to keep them from getting out of hand. Let's do the same with\
    \ io to give us a feel for that.\n\n```\nIO.prototype.join = () => this.unsafePerformIO();\n\
    ```\n\nAgain, simply remove one layer. Mind you, we have not thrown out purity,\
    \ but merely removed one layer of excess shrink wrap."
