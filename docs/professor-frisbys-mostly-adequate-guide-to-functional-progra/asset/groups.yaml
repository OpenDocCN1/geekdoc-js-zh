    # Professor Frisby’s

    Mostly Adequate

    Guide to Functional Programming


    ![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_5_0.png)


    # About this book


    This is a book on the functional paradigm in general. We''ll use the world''s
    most popular functional programming language: JavaScript. Some may feel this is
    a poor choice as it''s against the grain of the current culture which, at the
    moment, feels predominantly imperative. However, I believe it is the best way
    to learn FP for several reasons:


    +   - You like it every day at work.

    - This makes it possible to practice and apply your acquired knowledge each day
    on real world programs than pet projects on nights and weekends in an esoteric
    FP language.

    - We don''t have to learn everything up front to start writing programs.

    in a pure functional language, you cannot log a variable or read a DOM node without
    monads. Here we can catch a little as we learn to purify our codebase. It''s also
    easier to get started in this language since it''s mixed paradigm and you can
    fall back on your current practices while there are gaps in your knowledge.

    - The language is fully capable of writing top notch functional code.'
  - '[PAGE 6]


    We have all the features we need to mimic a language like Scala or Haskell with
    the help of a tiny library or two. Object-oriented programming currently dominates
    the industry, but it''s clearly awkward in JavaScript. It''s akin to camping off
    a highway or tap dancing in galos. We have to bind all over the place this change
    out under us, we have various work around the quirky behavior when the new keyword
    is forgotten, private members are only available via closures. To a lot of us,
    FP feels more natural anyways.


    That said, functional languages will, without a doubt, the best place to code
    in the style presented by this book. JavaScript will be our means of learning
    a paradigm, where you apply it is up to you. Luckily, the interfaces are mathematical
    and, as, ubiquitous. You''ll find yourself at home with Swift, Scalaz, Haskell,
    PureScript, and other mathematically inclined environments.


    # Read it Online


    For a best reading experience, read it online via Gitbook.


    +   - Quick-access side-bar

    - In-browser exercises

    - In-depth examples


    # Play Around with Code


    To make the training efficient and not get bored while I am telling you another
    story, make sure to play around with the concepts introduced in this book. Some
    can be tricky to catch at first and better understood by getting your hands dirty.
    All functions and algebraic data-structures presented in the book are gathered
    in the appendices. The corresponding code is also available as an npm module:


    ```

    $ npm i @most-adequate/support

    ```


    Alternatively, exercises of each chapter are runnable and can be completed in
    your editor! For example, complete the exercise_*.js in exercises/ch0 and then
    run:


    ```

    $ npm run ch04

    ```


    # Download it


    Find pre-generated PDF and EPUB as build artifacts of the latest release.


