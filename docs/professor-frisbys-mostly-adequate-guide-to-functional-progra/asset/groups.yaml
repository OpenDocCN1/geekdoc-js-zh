  - '[PAGE 94]


    As programmers we are familiar with type conversions. We transform types Strings
    into Booleans and Integers into Floats (though JavaScript only has Numbers ).
    The difference is simply that we''re working with algebraic containers and we
    have some theory at our disposal.


    Let''s look at some of these examples:


    ```

    // idToMaybe :: Identity a -> Maybe a

    const idToMaybe = x => Maybe.of(x.value);


    // idToIO :: Identity a -> IO a

    const idToIO = x => IO.of(x.value);


    // eitherToTask :: Either a -> Task b

    const eitherToTask = either(Task.rejected, Task.of);


    // maybeToTask :: Maybe a -> Task ()

    const maybeToTask = x => new Task(reject, resolve) => resolve(x.unsafePerformCheck());


    // arrayToArray :: [a] -> Maybe a

    const arrayToArray = x => array.of(x);

    ```


    We see the idea? We''re just one functor to another. We are permitted to lose
    information along the way so long as the value we''ll map doesn''t get lost in
    the shape shuffle. That is the whole point: map must carry on, according to our
    definition, after the transformation.


    One way to talk about it is that we are transforming our effects. In that light,
    we can view IOTask as converting synchronous to asynchronous or arrayMaybe from
    nondeterminism to possible failure. Note that we cannot convert asynchronous to
    synchronous in JavaScript we cannot write taskIO - that would be a supernatural
    transformation.


    # Feature Envy


    Suppose we''d like to use some features from another type like sortBy on a List
    . Natural transformations provide a nice way to convert the target type knowing
    our map will be.


    ```

    // arrayToList :: [a] -> List a

    const arrayToList = List.of;


    // dollyListThings = compose(sortBy(h), filter(g), arrayToList, map(f));

    const dollyListThings = compose(sortBy(h), filter(g), map(f), arrayToList); //
    law app

    ```


    A wiggle of nose, three taps of our wand, drop in arrayToList and voilà! [a] is
    a list and we can sortBy if we please.


    Also, it becomes easier to optimize / fuse operations by moving map(f) to the
    left of natural transformation as shown in dollyThings_.'
- md: "\n# Isomorphic JavaScript\n\nWhen we can completely go back and forth losing\
    \ any information, that is considered an *isomorphism*. That's a fancy word for\
    \ \"holds the same data\". We say that two types are isomorphic if we can provide\
    \ the \"to\" and \"from\" *natural transformations* as proof:\n\n```\n// promiseToTask\
    \ :: Promise a b -> Task a b\nconst promiseToTask = x => new Task((reject, resolve)\
    \ => x.then(resolve)).catch(reject);\n\n// taskToPromise :: Task a b -> Promise\
    \ a b\nconst taskToPromise = x => new Promise((resolve, reject) => x.fork(reject,\
    \ resolve));\n\nconst x = Promise.resolve('x');\ntaskToPromise(promiseToTask(x))\
    \ === x;\n\nconst y = Task.of('rabbit');\npromiseToTask(taskToPromise(y)) ===\
    \ y;\n```\n\n**Q.E.D.** *Promise* and *Task* are *isomorphic*. We can also write\
    \ `listToArray` to complement our `arrayList` and show that they are too. As a\
    \ counter example, `arrayList` is not isomorphic since it loses information:\n\
    \n```\n// maybeToArray :: Maybe a -> [a]\nconst maybeToArray = x => (x.isNothing\
    \ ? [] : [x.$value]);\n\n// maybeToArray :: [a] -> Maybe [a]\nconst arrayToArray\
    \ = x => Maybe.of(x);\n\nconst x = ['elvis costello', 'the attractions'];\n\n\
    // not isomorphic\nmaybeToArray(arrayToArray(x)); // ['elvis costello']\n\n//\
    \ but is a natural transformation\ncompose(arrayToArray, map(replace('elvis',\
    \ 'lou')))(x); // Just ('lou costello')\n// =\ncompose(map(replace('elvis', 'lou')),\
    \ arrayToArray)(x); // Just ('lou costello')\n```\n\nThey are natural transformations,\
    \ however, since *map* on either side yields the same result. I mention *isomorphisms*\
    \ here, mid-chapter where we're on the subject, but don't let that fool you, for\
    \ it is an enormously powerful and pervasive concept. Anyways, let's move on.\n\
    \n# A Broader Definition\n\nThese structural functions are not limited to type\
    \ conversions by any means.\n\nHere are a few ones:\n\n```\nreverse :: [a] ->\
    \ [a]\njoin :: (Monad m) => m (m a) -> m a\nhead :: [a] -> a\nof :: a -> f s\n\
    ```\n\nThe natural transformations laws hold for these functions to too. One that\
    \ might trip you up is that head :: [a] -> a can be viewed as head :: [a] -> Identity\
    \ a. We are free to insert Identity wherever we whilst proving laws since we can,\
    \ in turn, prove that a is isomorphic to identity a (see, I told you isomorphisms\
    \ pervasive).\n\n# One Nesting Solution\n\nBack to our comedic type sign. We can\
    \ sprinkle in some transformations throughout the calling code to coerce each\
    \ varying type they are uniform and, therefore, join able.\n\n```\n// Selector\
    \ -> Task Error (Maybe String)\n// postComment :: String -> Task Error Comment\n\
    // validate :: String -> Either ValidationError String\n\n// saveComment :: {\
    \ } -> Task Error Comment\nconst saveComment = compose(\n  chain(postComment),\n\
    \  chain(eitherTask),\n  map(validate),\n  chain(eitherTask),\n  getValue('#comment');\n\
    );\n```\n\nSo do we have here? We've simply added chain(maybeTask) and chain(eitherTask).\
    \ Both have the same effect; they naturally transform the functor task is holding\
    \ into another Task. Join the two. Like pigeon spikes on a wedge, we avoid nesting\
    \ right at the source. As they say in the city of light, \"Mieux prévenir que\
    \ guérir\" - an ounce of prevention is worth a pound of cure.\n\n# In Summary\n\
    \nNatural transformations are functions on our functors themselves. They are an\
    \ extremely important concept in category theory and will start to appear everywhere\
    \ where abstractions are adopted, but for now, we've scoped them to a few concrete\
    \ applications. As we saw, we can achieve different effects by converting types\
    \ with the guarantee that our composition will hold. They also help us with nested\
    \ types, although they have the general effect of homogenizing our functors to\
    \ the lowest common denominator, which in practice, is the functor with the most\
    \ volatile effects (Task in most cases).\n\nThis continual tedious sorting of\
    \ types is the price we pay for having materialized them - summoned them from\
    \ the ether. Of course, implicit effects are much more insidious and so we are\
    \ fighting the good fight. We'll need a few more tools in our tackle before we\
    \ reel in the larger type amalgamations. Next up, we'll reorder our types with\
    \ Traversable.\n\n# Chapter 12: Traversable\n\n## Exercises\n\n| Exercise | Solution\
    \ |\n| :--- | :--- |\n| Write a natural transformation that converts 'Either b'\
    \ to 'Maybe a' | ```haskell\\neitherMaybe :: Either b -> Maybe a\\nconst eitherMaybe\
    \ = undefined;``` |\n| Using 'eitherToTask', simplify 'findNameBy' to remove the\
    \ nested 'Either'. | ```haskell\\findNameBy :: Number -> Task (Either User)\\\
    nconst findNameBy = compose(map(prop('name')), eitherToTask);``` |\n| Write the\
    \ isomorphisms between String and [Char]. | ```haskell\\strToList :: String ->\
    \ [Char]\\nconst strToList = undefined;\\nlistToString :: [Char] -> String\\nconst\
    \ listToString = undefined;``` |\n\n# Chapter 12: Traversable\n\nSo far, in our\
    \ journey, we've seen the functor, bending it until we perform any operation that\
    \ strikes our fancy. We've dazzled by the juggling of many effects at once using\
    \ function application to collect the results. Standing in amazement as containers\
    \ vanished into thin air by joining them together. At the side, we've seen them\
    \ composed into one. And for our next turn, we'll watch traversals. We'll see\
    \ effects over another. This is going to be longer. It would be just lovely to\
    \ join them, let them dance cheek to cheek, but alas a Maybe stands between them\
    \ like a chaperone at prom. Our best move here would be to shift their positions\
    \ next to one another, that each way we can be turned out at last and our signature\
    \ can be simplified to IO (Maybe Node).\n\n## Types\n\n```\n// readFile :: FileName\
    \ -> Task Error String\n\n// firstWords :: String -> String\nconst firstWords\
    \ = compose(intercalate(' '), split(''));\n```\n\nWait, let's get weird:\n\n```\n\
    // readFile :: FileName -> Task Error String\n\n// firstWords :: String -> String\n\
    const firstWords = compose(intercalate(' '), split(''));\n\n// tldr :: FileName\
    \ -> Task Error String\nconst tldr = compose(map(firstWords), readFile);\n// tldr(['file1',\
    \ 'file2']);\n// [Task (Error String), Task (Error String)]\n```\n\n# Type Feng\
    \ Shui\n\nThe Traversable interface connects two glorious functions: sequence\
    \ and traverse.\n\nLet's rearrange our types using sequence:\n\n```\nsequence(List.of,\
    \ Maybe.of({the facts})); // [Just('the facts')]\nsequence(Task.of, new Map({a:\
    \ Task.of(c), b: Task.of(c)})); // Map({a: a, b: b})\nsequence(Either.of, Either.of({buckle\
    \ my shoe})); // Right('buckle my shoe')\nsequence(Either.of, Either.of('wing')));\
    \ // Right('wing')\nsequence(Task.of, Left('wing'))); // [Task(Left('wing'))]\n\
    ```\n\n![](9b77a6df4e7c2aa4f9efc23d9dcb488_99_0)\n\nWe have seen that our nested\
    \ types turned out like a pair of leather on a humid summer night. The inner function\
    \ is shifted to the outside and vice versa. It is known that sequence is bit particular\
    \ about its arguments. It looks like this:\n\n```\n// sequence :: (Traversable\
    \ t, Applicative f) => (a -> f a) -> t (f a) -> t (t a)\nconst sequence = curry(of,\
    \ x) => x.sequence(of);\n```\n\nLet's start with our second argument. But it is\
    \ a Traversable holding an Applicative, which sounds quite restrictive, but just\
    \ so happens to be more often than not. It is the t (f a) which gets turned into\
    \ f (t a). Isn't it expressive? It's clear as the two types do around each other.\
    \ That first argument is merely a crunch and only necessary in an untyped language.\
    \ It is a type constructor (our of) provided so that we can invert map-reluctant\
    \ types like Left - more on in a minute.\n\nUsing sequence, we can shift types\
    \ around with the precision of a sidewalk inquirer. How does it work? Let's look\
    \ at a type, say Either, implement it:\n\n```\nclass extends Either {\n  //\n\
    \  sequence(of) {\n    return this.$value.map(Either.of);\n  }\n}\n```\n\nAh,\
    \ if our $value is a functor (it but not an applicative, in fact), we simply map\
    \ our constructor to free the type.\n\nYou may have noticed that we ignored the\
    \ of entirely. It is passed for the occasion where mapping is futile, as is the\
    \ case with Left.\n"
  mdcn: "\n\n# 同构 JavaScript\n\n当我们可以完全来回地转换且不丢失任何信息时，这被视为一种*同构*（isomorphism）。这只是“持有相同数据”的一种华丽说法。如果我们能提供“到”和“从”的*自然变换*（natural\
    \ transformations）作为证明，我们就可以说这两个类型是同构的：\n\n```\n// promiseToTask :: Promise a\
    \ b -> Task a b\nconst promiseToTask = x => new Task((reject, resolve) => x.then(resolve)).catch(reject);\n\
    \n// taskToPromise :: Task a b -> Promise a b\nconst taskToPromise = x => new\
    \ Promise((resolve, reject) => x.fork(reject, resolve));\n\nconst x = Promise.resolve('x');\n\
    taskToPromise(promiseToTask(x)) === x;\n\nconst y = Task.of('rabbit');\npromiseToTask(taskToPromise(y))\
    \ === y;\n```\n\n**Q.E.D.** *Promise* 和 *Task* 是*同构的*。我们还还可以编写 `listToArray` 来补充我们的\
    \ `arrayList` 并证明它们也是如此。作为一个反例，`arrayList` 不是同构的，因为它丢失了信息：\n\n```\n// maybeToArray\
    \ :: Maybe a -> [a]\nconst maybeToArray = x => (x.isNothing ? [] : [x.$value]);\n\
    \n// maybeToArray :: [a] -> Maybe [a]\nconst arrayToArray = x => Maybe.of(x);\n\
    \nconst x = ['elvis costello', 'the attractions'];\n\n// 非同构\nmaybeToArray(arrayToArray(x));\
    \ // ['elvis costello']\n\n// 但是一个自然变换\ncompose(arrayToArray, map(replace('elvis',\
    \ 'lou')))(x); // Just ('lou costello')\n// =\ncompose(map(replace('elvis', 'lou')),\
    \ arrayToArray)(x); // Just ('lou costello')\n```\n\n然而，它们是自然变换，因为在任何一侧进行 *map*\
    \ 都会得到相同的结果。我在本章中间讨论这个话题时提到了*同构*，但不要被它误导，因为它极其强大且无处不在的概念。无论如何，我们继续下吧。\n\n# 更广泛的定义\n\
    \n这些结构性函数绝不限于类型转换。\n\n这里是几个：\n\n```\nreverse :: [a] -> [a]\njoin :: (Monad m)\
    \ => m (m a) -> m a\nhead :: [a] -> a\nof :: a -> f s\n```\n\n自然变换律也适用于这些函数。一个可能会让你困惑的是\
    \ `head :: [a] -> a` 可以被视为 `head :: [a] -> Identity a`。在证明法则时，我们可以随处插入 Identity，因为反过来我们可以证明\
    \ `a` 与 `identity a` 是同构的（看，我告诉过你同构是无处不在的）。\n\n# 一个嵌套解决方案\n\n回到我们的幽默类型签名。我们可以在调用代码中穿插一些变换，以强制使它们不断变化的类型变得统一，因此是可以合并（joinable）的。\n\
    \n```\n// Selector -> Task Error (Maybe String)\n// postComment :: String -> Task\
    \ Error Comment\n// validate :: String -> Either ValidationError String\n\n//\
    \ saveComment :: { } -> Task Error Comment\nconst saveComment = compose(\n  chain(postComment),\n\
    \  chain(eitherTask),\n  map(validate),\n  chain(eitherTask),\n  getValue('#comment');\n\
    );\n```\n\n所以我们在这里得到了什么？我们只是添加了 `chain(maybeTask)` 和 `chain(eitherTask)`。两者的效果相同；它们自然地将\
    \ task 所持有的 functor 转换为另一个 Task。合并这两个。就像楔子上的防鸟刺一样，我们从源头上就避免了嵌套。正如光之城的人所说，“Mieux\
    \ prévenir que guérir”——预防胜于治疗。\n\n# 总结\n\n自然变换是作用于 functor 自身的函数。它们是范畴论中一个极其重要的概念，并将开始出现在任何采用抽象的地方，但目前，我们将其范围限制在几个具体的应用中。正如我们所见，我们可以通过转换类型来实现不同的效果，并保证我们的组合是有效的。它们还帮助我们处理嵌套类型，尽管它们的总体效果是将我们的\
    \ functor 同质化为最低公约数，在实践中，这就是具有最剧烈副作用的 functor（大多数情况下是 Task）。\n\n这种持续且无聊的类型排序是我们为将其实体化——从以太中召唤它们——所付出的代价。当然，隐式副作用要危险得多，因此我们正在进行这场战斗。在收割更大的类型混合之前，我们需要在工具箱中更多的工具。接下来，我们将用\
