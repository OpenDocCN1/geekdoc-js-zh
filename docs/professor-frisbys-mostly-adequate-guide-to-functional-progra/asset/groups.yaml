    # Chapter 01: What Ever Are We Doing?


    # Introductions


    Hi there! I''m Professor Frisby, Pleased to make your acquaintance. We''ll be
    spending some time together, I''m supposed to teach you a bit functional programming.
    But enough about me, what about you? I''m hoping that you''re at least a bit familiar
    with the JavaScript language, have a teensy bit of Object-Oriented experience,
    and fancy yourself a working class programmer. You don''t need to have a PhD in
    Entomology, you just need to know how to find and kill some bugs.


    I won''t assume you have any previous functional programming knowledge, because
    we know what happens when you assume. I will, however, expect you to have run
    into some of the unfavorable situations that arise when working with mutable state,
    unrestricted side effects, and unprincipled design. Now that we''ve properly introduced,
    let''s get on with it.


    The purpose of this chapter is to give you a feel for what we''re after we write
    functional programs. In order to be able to understand the chapters, we must have
    some idea about what makes a program functional. Otherwise we''ll find ourselves
    climbing aimlessly, avoiding objects at all costs - clumsy endeavor indeed. We
    need a clear bullseye to hurl our code at, some celestial compass for the waters
    get rough.


    Now, there are some general programming principles - various acronymic credos
    that guide us through the dark tunnels of any application: DRY (don''t repeat
    yourself), YAGNI (ya ain''t gonna need it), loose coupling high cohesion, the
    principle of least surprise, single responsibility, and so on.


    I won''t labor by listing each and every guideline I''ve heard throughout the
    years... The point of the matter is that they hold up in a functional setting,
    although they''re merely tangential to our ultimate goal. I''d like to get a feel
    for now, before we get any further, is our intention when we poke and prod at
    the keyboard; our functional Xanadu.


    # A Brief Encounter


    Let''s start with a touch of insanity. Here is a seagull application. When flocks
    join a larger flock, and when they breed, they increase by the number of seagulls
    with whom they''re breeding. This is not intended to be good Object-Oriented code,
    mind you, it is here to highlight the perils of our modern, assignment based approach.
    Behold:'
- md: "\n```javascript\nclass Flock {\n  constructor(n) {\n    this.seagulls = n;\n\
    \  }\n\n  join(other) {\n    this.seagulls += other.seagulls;\n    return this;\n\
    \  }\n\n  breed(other) {\n    this.seagulls = this.seagulls * other.seagulls;\n\
    \    return this;\n  }\n}\n\nconst flockA = new Flock();\nconst flockB = new Flock();\n\
    const flockC = new Flock(0);\nconst result = flockA\n  .join(flockC)\n  .breed(flockB)\n\
    \  .join(flockA.breed(flockB))\n  .seagulls; // 12\n```\n\nWho earth would craft\
    \ such a ghastly abomination? It is unreasonably difficult to keep track of the\
    \ internal state. And, heavens, the answer is incorrect! It should have been 16,\
    \ but flockA permanently altered the process. Poor flockA. This is anarchy in\
    \ the I.T.! This is wild animal arithmetic!\n\nIf you don't understand this program,\
    \ it's, neither do I. The point to remember here is state and multiple values\
    \ are hard to follow, even in such a small example.\n\nLet's try again, using\
    \ a more functional approach:\n\n```javascript\nconst join = (flockX, flockY)\
    \ => flockX + flockY;\nconst breed = (flockX, flockY) => flockX * flockY;\n\n\
    const flockA = 4;\nconst flockB = 2;\nconst flockC = 0;\nconst result = join(breed(flockB,\
    \ join(flockA, flockC)), breed(flockA, flockB)); // 12\n```\n\nWell, this we got\
    \ the right answer. With less code. The function nesting is a tad confusing (we'll\
    \ remedy this situation in ch5). It's better, but let's go a little deeper. There\
    \ are benefits to calling a spade function. Had we scrutinized our custom functions\
    \ more closely, we would have discovered that we're just working with simple addition\
    \ { join } and multiplication ( breed ).\n\nThere's really nothing special at\
    \ about these two functions other than their names. Let's rename our custom functions\
    \ to multiply and add in order to reveal their true identities.\n\n```javascript\n\
    const add = (x, y) => x + y;\nconst multiply = (x, y) => x * y;\n\nconst flockA\
    \ = 4;\nconst flockB = 2;\nconst flockC = 0;\nconst result =\n  add(multiply(flockB,\
    \ add(flockA, flockC)), multiply(flockA, flockB));\n// 16\n```\n\nAnd with that,\
    \ we gain the knowledge of the ancients:\n\n```javascript\n// associative\nadd(add(x,\
    \ y), z) === add(x, add(y, z));\n\n// commutative\nadd(x, y) === add(y, x);\n\n\
    // identity\nadd(x, 0) === x;\n\n// distributive\nmultiply(x, add(y, z)) === add(multiply(x,\
    \ y), multiply(x, z));\n```\n\nAh, yes old faithful mathematical properties should\
    \ come in handy. Or if you didn't worry know them right off the top of your head.\
    \ For a lot of us, it's been a while since we learned about these rules of arithmetic.\
    \ Let's see if we can use these properties to simplify our little seagull flock.\n\
    \n```javascript\n// Original line\nadd(multiply(flockB, add(flockA, flockC)),\
    \ multiply(flockA, flockB));\n\n// Apply the identity to remove the extra add\n\
    // (flockB, flockC) == flockA;\nadd(multiply(flockB, flockA), multiply(flockA,\
    \ flockB));\n\n// Apply distributive property to achieve our result\nmultiply(flockB,\
    \ add(flockA, flockA));\n```\n\nBrilliant! We didn't have to write a lick of custom\
    \ code other than calling function. We use add and multiply definitions here for\
    \ completeness, but there is really no need to write them - we surely have an\
