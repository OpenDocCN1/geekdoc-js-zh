    1. reduce(..., ...)


    Remember the signature of reduce :: [a] -> (f -> a -> f) -> f f. The first argument
    is actually provided by the dot-notation on $value, so it''s a list that we need
    from a function a (the accumulator) and a (the iteree) to return a new accumulator.


    2. of(new([]))


    The seed value of new(list([])), which in our case is Right([]) :: Either e [a].
    Notice that Either [a] will also be our final result type!


    3. fn :: Applicative f -> a -> a


    If we apply it to our example, fn is actually fromPredicate(f) :: a -> a


    ```

    fn(a) :: Either e a

    ```


    4.map(b -> bs) bs.concat(b)


    When Either.map passes the right value to the function and returns a Right with
    the result. In this case the function has one parameter (b) and returns another
    function (bs -> bs.concat(b), where b is in scope due to the closure). When left,
    the left value is returned.


    ```

    fn(a).map(b -> bs = bs.concat(b)) :: Either e ([a] -> [a])

    ```


    5. .ap


    Remember that f is an Applicative, so we can apply the function bs -> bs.concat(b)
    to whatever value bs :: [a] is in f. Fortunately for us, things comes from our
    initial type and has the following type: f :: Either [a] which is by the way,
    preserved when we apply bs -> bs.concat(b). When f is Right, this calls bs ->
    bs.concat(b), which returns a Right with the item added to the list. When left,
    the left value (from the previous iteration) is returned.


    ```

    fn(a).map(b -> bs = bs.concat(b)).ap(f) :: Either e [a]

    ```


    This apparently miraculous transformation is achieved with just 6 lines of code
    in List.traverse and is accomplished with of map and ap so will work for any Applicative
    Functor. This is a great example of how that abstraction can help to write highly
    generic code with a few assumptions (that can, incidentally, be declared and checked
    at the type level!)


