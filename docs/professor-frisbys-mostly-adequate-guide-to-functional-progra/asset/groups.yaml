    \ splice, will chew up its array and spit it out forever changed which is an observable\
    \ effect.\n\n```javascript\nconst xs = [1,2,3];\n// pure\nxs.slice(0); // [1,2,3]\n\
    xs.slice(0); // [1,2,3]\nxs.slice(0); // [1,2,3]\n\n// impure\nxs.splice(0,3);\
    \ // [1,2,3]\nxs.splice(0,3); // [4,5]\nxs.splice(0,3); // []\n```\n\nIn functional\
    \ programming, we dislike unwieldy functions like splice that mutate data. This\
    \ will never do as we're striving for reliable functions that return the same\
    \ result every time, not functions that leave a mess in their wake like splice.\n\
    \nLet's look at another example.\n\n```javascript\n// impure\nlet minimum = 21;\n\
    const checkAge = age => minimum;\n\n// pure\nconst checkAge = (age) => {\n  const\
    \ minimum = 21;\n  return age > minimum;\n};\n```\n\nIn the impure portion, checkAge\
    \ depends on the mutable variable minimum to determine the result. In other words,\
    \ it depends on system state which is disappointing because it increases the cognitive\
    \ load by introducing an external environment.\n\nIt might not seem like a in\
    \ this example, but this reliance upon state is one of the largest contributors\
    \ to system complexity (http://curtclifton.net/papers/MoseleyMarks06a.pdf). checkAge\
    \ may return different results depending on factors external to input, which not\
    \ only disqualifies it from being pure, but puts our minds through the wringer\
    \ each time we're reasoning about software.\n\nIts pure form, on the other hand,\
