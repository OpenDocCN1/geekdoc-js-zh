  mdcn: "\n\n```javascript\nconst loudLastUpper = compose(exclaim, toUpperCase, head,\
    \ reverse);\n\n// 或 ---\n\nconst last = compose(head, reverse);\nconst loudLastUpper\
    \ = compose(exclaim, toUpperCase, last);\n\n// 或 ---\n\nconst last = compose(head,\
    \ reverse);\nconst angry = compose(exclaim, toUpperCase);\nconst loudLastUpper\
    \ = compose(angry, last);\n\n// 更多变体...\n```\n\n没有对错之分——我们可以按照自己喜欢的方式将其组合在一起。通常，像\
    \ `last` 和 `angry` 这样进行分组是最好的。如果按照 Fowler 的《重构》来说，人们会将此过程识别为 `extract function()`……只不过不需要担心所有的状态。\n\
    \n# 无点风格 (Pointfree)\n\n无点风格意味着永远不需要说出你的数据。抱歉，它的意思是函数从不提到它们所操作的数据。一等函数和组合很好地结合在一起，创建了这种风格。\n\
    \n> `replace` 和 `toLowerCase` 的无点版本定义在\n> 附录 C - 无点工具。不要犹豫来看一眼！\n\n```javascript\n\
    // 不是无点的，因为我们提到了数据: word\nconst snakeCase = word => word.toLowerCase().replace(/\\\
    s+/ig, '_');\n\n// 无点\nconst snakeCase = compose(replace(/\\s+/ig, '_'), toLowerCase);\n\
    ```\n\n看我们替换得多么容易？我们正在将数据通过每个具有 1 个参数的函数管道。柯里化（Currying）允许我们准备每个函数来拆分数据、对其进行操作并将其传递下去。另一个需要注意的是，在无点版本中，我们不需要构造我们的函数，而在有点的版本中，我们在执行任何事情之前就已经获取了\
    \ `word`。\n\n让我们来看另一个例子。\n\n```javascript\n// 不是无点的，因为我们命名了 name => the name\n\
    const initials = name => name.split('.').map(compose(toUpperCase, head)).join('.');\n\
    \n// 无点\n// 注意：我们使用附录中的 intercalate 而不是在某章节中引入的 'join'\nconst initials = compose(intercalate('.'),\
    \ map(compose(toUpperCase, head)), split('.'));\n\ninitials('hunter stockton thompson');\
    \ // H. S. T.\n```\n\n无点代码再次帮助我们移除多余的名称，并保持简洁和通用。无点风格是函数式代码的良好试金石，因为它让我们知道拥有从输入到输出的小函数。例如，你无法组合一个\
    \ `while` 循环。但请注意，无点是一把双刃剑，有时会模糊意图。并不是所有的函数式代码都是无点的，这是没关系的。我们可以在可以使用的地方使用它，否则坚持普通的函数。\n\
    \n# 调试\n\n一个常见的错误是组合像 `map` 这样具有两个参数的函数，而不先对其进行部分应用。\n\n```javascript\n // 我们最终给了一个数组，但我们对\
    \ map 应用了未知的部分应用\nconst latin = compose(map, angry, reverse);\n\nlatin(['frog',\
    \ 'eyes']); // error\n\n// 每个函数都期望 1 个参数。\nconst latin = compose(map(angry), reverse);\n\
    ```\n\n如果你在调试组合时遇到困难，可以使用不纯的 trace 函数来查看发生了什么。\n\n```javascript\nconst trace =\
    \ curry((tag, x) => {\n  console.log(tag, x);\n  return x;\n};\n\nconst dashizer\
    \ = compose(\n  intercalate(' '),\n  tower,\n  split(' '),\n  replace(/\\s(2,)/ig,\
    \ ' '),\n);\n\ndashizer('The world is a vampire');\n// TypeError: Cannot read\
    \ property 'apply' of undefined\n```\n\n出问题了，让我们 `trace`\n\n```javascript\nconst\
    \ dashizer = compose(\n  intercalate(' '),\n  tower,\n  trace(after split),\n\
    \  split(' '),\n  replace(/\\s(2,)/ig, ' '),\n);\n\ndashizer('The world is a vampire');\n\
    // after split ['The', 'world', 'is', 'a']\n```\n\n啊！我们需要 `map` 这里的 `tolower`，因为它正在处理一个数组。\n\
    \n```javascript\nconst dasherizer = compose(\n  intercalate(''),\n  map(toLower),\n\
    \  split(/\\s+/),\n  replace(/(\\s)/ig, '-')\n);\n\ndasherizer('The world is a\
    \ vampire'); // -world-is-a\n```\n\n`trace` 函数允许我们在特定的调试目的查看数据。像 Haskell 和 PureScript\
    \ 这样的语言有类似的函数，方便开发。组合将是我们构建程序的工具，尽管如此，它由强大的理论支持确保运行正常。\n\n# 范畴论 (Category Theory)\n\
    \n范畴论是数学的一个抽象分支，形式化了来自集合论、类型论、群论等多个分支的概念。它主要处理对象、态射和变换，这些关系非常紧密。以下是从每个独立分支观察的概念图表。\n\
    \n| 类型 (Types) | 逻辑 (Logic) | 同伦论 (Homotopy) |\n| :--- | :--- | :--- |\n| A |\
    \ 命题 (proposition) | 集合 (set) |\n| $a : A$ | 证明 (proof) | 元素 (element) |\n| $B(x)$\
    \ | 谓词 (predicate) | 族 (family of sets) |\n| $b(x) : B(x)$ | 条件证明 (conditional\
    \ proof) | 元素族 (family of elements) |\n| $0,1$ | $\\perp, \\top$ | $\\varnothing$\
    \ |\n| $A + B$ | $A \\vee B$ | 析并 (disjoint union) |\n| $A \\times B$ | $A \\\
    wedge B$ | 积 (pairs) |\n| $A^B$ | $A \\Rightarrow B$ | 函数 (functions) |\n| $\\\
    sum_{(x:A)} B(x)$ | $\\sum_{(x:A)} B(x)$ | 和 (sum) |\n| $\\prod_{(x:A)} B(x)$\
    \ | $\\prod_{(x:A)} B(x)$ | 积 (product) |\n\n"
