    When we spoke pure functions, we said we take 1 input to 1 output.

    Currying does exactly this: each single argument returns a new function expecting
    the remaining arguments. That, old sport, is 1 input to 1 output.


    No matter if the output is another function - it qualifies as pure. We do allow
    more one argument at a time, but this is seen as merely removing the extra ()s
    for convenience.


    # # In Summary


    Currying is handy and I much enjoy working with curried functions on a daily basis.
    It is a tool for the belt that makes functional programming less verbose and tedious.


    We can make new, useful functions on the fly simply by passing in a few arguments
    and as a bonus, we have retained the mathematical function definition despite
    arguments.


    Let''s acquire another essential tool called compose.


