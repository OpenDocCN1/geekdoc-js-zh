  - "[PAGE 15]\n\n# Chapter 03: Pure Happiness with Pure Functions\n\n# Oh to Be Pure\
    \ Again\n\nOne thing we need to get straight is the idea of a pure function.\n\
    \nA pure function is a function that, given the same input, will always return\
    \ the same output and does not have any observable side effect.\n\nTake slice\
    \ and splice. They are two functions that do the exact same thing - in a vastly\
    \ different way, mind you the same nonetheless. We say slice is pure because it\
    \ returns the same output per input time, guaranteed. splice, will chew up its\
    \ array and spit it out forever changed which is an observable effect.\n\n```\n\
    const xs = [1,2,3];\n// pure\nxs.slice(0); // [1,2,3]\nxs.slice(0); // [1,2,3]\n\
    xs.slice(0); // [1,2,3]\n\n// impure\nxs.splice(0,3); // [1,2,3]\nxs.splice(0,3);\
    \ // [4,5]\nxs.splice(0,3); // []\n```\n\nIn functional programming, we dislike\
    \ unwieldy functions like splice that mutate data. This will never do as we're\
    \ striving for reliable functions that return the same result every time, not\
    \ functions that leave a mess in their wake like splice.\n\nLet's look at another\
    \ example.\n\n```\n// impure\nlet minimum = 21;\nconst checkAge = age => minimum;\n\
    \n// pure\nconst checkAge = (age) => {\n  const minimum = 21;\n  return age >\
    \ minimum;\n};\n```\n\nIn the impure portion, checkAge depends on the mutable\
    \ variable minimum to determine the result. In other words, it depends on system\
    \ state which is disappointing because it increases the cognitive load by introducing\
    \ an external environment."
