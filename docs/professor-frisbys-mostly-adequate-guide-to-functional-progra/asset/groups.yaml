    # # Chapter 04: Currying


    #  Can''t Live If Livin'' Is without You


    My Dad once explained how there are certain one can live without until one acquires
    them. A microwave is one thing. Smart phones, another. The older folks among us
    will remember a fulfilling life sans internet. For me, currying is on this list.


    The concept is simple: You can call it with fewer arguments than it expects. It
    returns a function that takes the remaining arguments.


    You can choose to call it all at once or simply fix in each argument piecemeal.


    ```

    const add = x => y => x + y;

    const increment = add();

    const addTen = add(10);


    increment(); // 3

    addTen(); // 12

    ```


    Here we''ve made a function `add` that takes one argument and returns a function.
    By calling it, the returned function returns the first argument from then on via
    the closure. Calling it with both arguments at all is a bit of a pain, so we can
    use a special function called `curry` to make defining and calling functions like
    this easier.


    Let''s set up a few curved for our journey. From now on, we''ll summon [Appendix
    A - Essential Function Support].


    ```

    const match = curry((what, s) => s.match(what));

    const replace = curry((what, replacement, s) => s.replace(what, replacement));

    const filter = curry((f, xs) => xs.filter(f));

    const map = curry((f, xs) => xs.map(f));

    ```


    The pattern I''ve followed is a simple, but important one. I''ve strategically
    positioned the data we''re operating on (String, Array) as the last argument.
    It will become clear as to why upon use.


    (The syntax `/r/g` is a regular expression that means match every letter `r`.
    Read [more about regular expressions] if you like.)'
