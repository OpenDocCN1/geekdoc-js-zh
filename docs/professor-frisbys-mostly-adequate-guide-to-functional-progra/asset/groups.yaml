  mdcn: "\n这可能让你感到震惊，`throw/catch` 并不纯粹。当一个错误被抛出时，我们并没有返回输出值，而是拉响警报！函数发起了攻击，在与我们直觉输入的电子战中，产生数以千计的0\
    \ 和 1 像盾牌和矛一样。有了新朋友 `Either`，我们可以做得比对输入宣战更好，用礼貌的消息来回应。让我们来看看：\n\n- 附录 B 中提供了完整的实现。\n\
    \n```javascript\nclass Either {\n    static(x) {\n        return new Right(x);\n\
    \    }\n\n    constructor(x) {\n        this.$value = x;\n    }\n}\n\nclass Left\
    \ extends Either {\n    map(f) {\n        return this;\n    }\n\n    inspect()\
    \ {\n        return Left(inspect(this.$value));\n    }\n}\n\nclass Right extends\
    \ Either {\n    map(f) {\n        return Either.of(f(this.$value));\n    }\n\n\
    \    inspect() {\n        return Right(inspect(this.$value));\n    }\n}\n\nconst\
    \ left = x => new Left(x);\n```\n\nLeft 和 Right 是我们称为 `Either` 的抽象类型的两个子类。我跳过了创建\
    \ `Either` 超类的繁琐步骤，因为我们永远不会使用它，但意识到这一点是有好的。现在，除了这两个类型之外，没有新东西了。让我们看看它们是如何工作的：\n\
    \n```javascript\nEither.of('rain').map(str => b(str));\n// Right('brain')\n\n\
    left('rain').map(str => `It's gonna ${str}, better bring your umbrella!`);\n//\
    \ Left('rain')\n\nEither.of({ host: 'localhost', port: 80 }).map(prop('host'));\n\
    // Right('localhost')\n\nleft(rolls eyes...).map(prop('host'));\n// Left(rolls\
    \ eyes...)\n```\n\nLeft 是三元排序，它忽略了我们对其进行 `map` 的请求。Right 的工作就像 `Container`（也叫\
    \ `Identity`）一样。力量来自于在 `Left` 中嵌入错误消息的能力。\n\n假设我们有一个可能不会成功的函数。例如从出生日期计算年龄。我们可以使用\
    \ `Nothing` 来信号失败并分支我们的程序，然而它并没有告诉我们原因。也许，我们想知道失败的原因。`Left` 在 `Either` 中获胜了。\n\
    \n```javascript\nconst moment = require('moment');\n\n// getAge :: Date -> User\
    \ -> Either(String, Number)\nconst getAge = curry((now, user) => {\n  const birthDate\
    \ = moment(user.birthdate, 'YYYY-MM-DD');\n\n  return birthDate.isValid()\n  \
    \  ? Either.of(now.diff(birthDate, 'years'))\n    : Left('Birth date could not\
    \ be parsed');\n});\n\n// getAge(moment(), { birthdate: '2005-12-12' });\n// Right(18)\n\
    getAge(moment(), { birthdate: 'July 4, 2001' });\n// Left('Birth date could not\
    \ be parsed')\n```\n\n现在，像 `Nothing` 一样，当我们返回 `Left` 时，短路了我们的应用程序。区别在于我们有一个子句来显示程序失败了。有一个返回\
    \ `Either(String, Number)` 的东西，它包含一个 `String` 作为左值，一个 `Number` 作为其右值。这个类型签名有点非正式，因为我们还没有花时间定义一个实际的\
    \ `Either` 超类，但我们从这个类型中学习到了很多。它告诉我们返回的是错误消息或年龄。\n\n```javascript\n// fortune :\
    \ Number -> String\nconst fortune = compose(concat('If you survive, you will be\
    \ '), toString, add(()));\n\n// zollar :: User -> Either(String, _)\nconst zollar\
    \ = compose(console.log), map(fortune), getAge(moment()));\n\nzollar(birthDate:\
    \ '2005-12-12');\n// 'If you survive, you will be 10'\n// Right(undefined)\n\n\
    zollar(birthDate: 'balloons');\n// Left('Birth date could not be parsed')\n```\n\
    \n当出生日期有效时，程序将它的命运输出到屏幕上供人们欣赏。否则，我们会得到一个带有错误消息计划的 `left`，它们仍然被藏在它的容器中。这就像我们抛出了一个错误，但是以一种冷静的方式，，而不是在出现问题时发发脾气并像孩子一样大哭大叫。\n\
    \n在这个例子中，我们根据日期的有效性逻辑地分支了控制流，但它读起来是从右向左的线性运动，在攀爬条件语句的弯曲括号时。通常，我们将 `console.log`\
    \ 移出逻辑函数并在调用时对其进行 `map`，但看到右分支有何不同是有帮助的。我们在右分支的签名来指示某个值应该被忽略（某些浏览器中你必须先使用 `console.log.bind`\
    \ 才能使用它）。\n\n我想借此机会指出你可能错过的一点：`fortune` 尽管在这个例子中带有 `Either`，但它完全忽略任何缺失的函子逻辑。上一个例子中的\
    \ `finishTransaction` 也是如此。在调用时，函数可以被 `map` 包围，在非正式术语中，这将其从非函数转换为函数。我们把这个过程称为“提升”（lifting）。函数对于普通数据类型通常比容器类型更好，根据需要被提升到右容器中。这导致了更简单、更可复用的函数，这些函数可以根据需要更改以进行工作。\n\
    \n`Either` 用于验证等轻微错误，或者用于更严重的错误，如文件缺失或令牌损坏。替换一些 `Maybe` 来显示错误。\n\n"
