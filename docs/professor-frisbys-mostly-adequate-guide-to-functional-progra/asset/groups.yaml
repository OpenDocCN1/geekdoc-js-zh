    # Narrowing the Possibility


    Once a variable is introduced, there emerges a curious property called parametricity.
    This property states that a function will act on all types in a uniform manner.
    Let''s investigate.


    ```

    // head :: [a] -> a

    ```


    Looking at a head, we see that it takes [a] to a. Beside the concrete type array,
    it has no other information about a, therefore, its functionality is limited to
    working on the array alone. What could possibly do with the variable a if it knows
    nothing about it? In other words, the signature says it cannot be a specific type,
    which means it can be any type, which leaves us with a function that must work
    uniformly for every conceivable type. This is what parametricity is all about.
    Guessing at the implementation, the only reasonable assumptions are that it takes
    the first, last, or a random element from each. The name head tips us off.


    Here''s another:


    ```

    // reverse :: [a] -> [a]

    ```


    From the signature line, what could reverse possibly be up to? Again, it cannot
    do anything specific to a. It cannot change a to a different type or we introduce
    b. Can it sort? Well, it wouldn''t have enough information to sort every possible
    type. Can it re-arrange? Yes, suppose it can do, but it has to do so in the exactly
    same predictable way. Another possibility is that it might decide to remove or
    duplicate an element. In any case, the point is, the possible behaviour is massively
    narrowed by its polymorphic type.


    This narrowing possibility allows us to use type search engines like Hoogle to
    find a function we''re after. The information packed tightly into a signature
    is quite powerful.


    # Free as in Theorem


    Besides deciding possibilities, this sort of reasoning gains us free theorems.
    What are a few random example theorems lifted directly from Wadler''s paper on
    the subject.


    ```

    // head :: [a] -> a

    compose(f, head) === compose(head, map(f));

    ```


    ```

    // filter :: ([a] -> Bool) -> [a] -> [a]

    compose(map(f), filter(compose(p, f))) === compose(filter(p), map(f));

    ```


    You don''t need any code to get these theorems, they follow directly from the
    types. The first one says that if we get the head of our array, then run some
    function on it, that is equivalent to, and much faster than, if we first map(f)
    over every element then the head of the result.


    You might think, well that''s just common sense. But last I checked, computers
    don''t common sense. Indeed, they must have a formal way to automate these kind
    of optimizations. Maths has a way of formalizing the intuitive, which is helpful
    amid the rigid tangle of computer logic.


    The filter filter is similar. If that say if we use f and p to check which should
    be filtered, then actually apply the f via map (remember filter will not transform
    the elements-its signature ensures that a will not be touched), which will always
    be equivalent to mapping our f then filtering the result with p predicate.


    These are two examples, but you can also apply this reasoning to polymorphic signature
    and it will always hold. In JavaScript, there are some tools available to rewrite
    rules. One might also do this via the compose function itself. Its is low hanging
    and the possibilities are endless.


    # Constraints


    ```

    // sort : Ord a => [a] -> [a]

    ```


    We see on the left side of our out arrow here is the statement of a fact: a must
    be an Ord. In other words, a must implement the Ord interface. What is Ord and
    where did it come from? In a typed language it would be a defined interface that
    we can order the values. This not tells us more about the a and what our sort
    function is up to, but also restricts the domain type constraints.


    ```

    // assertEqual :: (Eq a, Show a) -> a -> Assertion

    ```


    Here, we have two constraints: Eq and Show. Those will ensure that we can check
    equality of a s and print the difference if they are not equal.


    We''ll see more examples of constraints and the idea they should take shape in
    later chapters.


    # In Summary


    Hindley-nerner signatures are ubiquitous in the functional world. Though they
    are simple to read and write, it takes time to master the technique of understanding
    programs through signatures alone. We will add type signatures to each line of
    code from here out.


    # Chapter 08: Container


    We''ve seen how to wrap a value in a container, but what about getting it out?
    We need a way to interact with the value inside without necessarily exposing it.
    This is the purpose of the container: to provide a safe environment for data and
    a controlled way to access it.


    The container is a box that holds a value. We can use the box to transform the
    value, filter it, or even wrap other containers. The key is that the value remains
    inside the box, and we only interact with the container itself. In this chapter,
    we''ll build a simple container and explore how to use it.

