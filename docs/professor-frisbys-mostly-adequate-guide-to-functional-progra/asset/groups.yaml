    \nap is a function that can apply the function contents of one functor to the\
    \ value contents of another. Say five times fast.\n\n```\nContainer.of(add()).ap(Container.of());\n\
    // Container(5)\n\n// all together now\n\nContainer.of($).map(add).ap(Container.of($));\n\
    // Container(5)\n```\n\nWe are nice and neat. Good news for Container(3) as it's\
    \ been free from the jail of the nested monadic function. It's worth mentioning\
    \ that add, in this case, gets partially applied during the first map so this\
    \ only works when add is curried.\n\nWe define ap like so:\n\n```\nContainer.prototype.ap\
    \ = function(otherContainer) {\n  return otherContainer.map(this.$value);\n};\n\
    ```\n\nRemember, this.$value will be a function and we'll be accepting another\
    \ functor so we need only map. And with that we have our interface definition:\n\
    \n> An applicative functor is a pointed function with an ap method\n\nNote the\
    \ dependence on pointed. The pointed interface is crucial as we'll see throughout\
    \ these examples.\n\nNow, I sense your skepticism (or perhaps confusion and horror),\
    \ but keep an open mind; this ap character will prove useful. Before we get into\
    \ it, let's explore a nice property.\n\n```\nF.of(x).map(f) === F.of(f).ap(F.of(x));\n\
    ```\n\nIn English, mapping f is equivalent to aping a functor of f. Or in proper\
    \ English, we can map x into our container and map(f) OR we can lift f and x into\
    \ our container and ap. This allows us to write in a left-to-right fashion:\n\n\
    ```\nMaybe.of(add).ap(Maybe.of(()).ap(Maybe.of(3));\n// Maybe(5)\n\nTask.of(add).ap(Task.of(2)).ap(Task.of(3));\n\
    // Task(5)\n```\n\nOne might recognise the vague shape of a normal function call\
    \ in the chapter, but for now, this is the preferred way to write code. Using\
    \ of, each value gets transported to the magical land of containers, this parallel\
    \ universe where each occasion can be async or null or what you have and ap will\
    \ apply functions within this fantastic place. It's like building a ship in a\
    \ bottle.\n\nDid you see there? We used Task in our example. This is a prime situation\
    \ where applicative functions pull their weight. Let's look at a more in-depth\
    \ example.\n\n# Coordination Motivation\n\nSay we're building a travel site and\
    \ we'd like to retrieve both list of tourist destinations and local events, stand-alone\
    \ api calls.\n\n```\n// Http.get :: String -> Task Error events => { /* render\
    \ page */ };\nconst renderPage = curry((destinations, events) => { /* render page\
    \ */ });\nTask.of(renderPage).ap(http.get('/destinations')).ap(http.get('events'));\n\
    Task(<div><div>some page with events and<div></div></div>)\n```\n\nBoth call will\
    \ happen instantly and renderPage will be called when both are resolved. Contrast\
    \ this monadic version where one Task must finish before the next fires off. Since\
    \ we need the destinations to retrieve events, we are free from sequential evaluation.\n\
    \nAgain, because we're using partial application to achieve this result, we must\
    \ ensure renderPage is curried or it will not wait for both Tasks to finish. Incidentally,\
    \ if you've ever had to do such a thing manually, you'll appreciate the astonishing\
    \ simplicity of this interface. This is the kind of beautiful code that takes\
    \ us one step closer to the singularity.\n\nLet's look at another example.\n\n\
    ```\n// $ : String -> ID DOM\nconst $ = selector => new ID(document.querySelector(selector));\n\
    \n// getVal : String -> ID String\nconst getVal = compose(map(prop('value')));\n\
