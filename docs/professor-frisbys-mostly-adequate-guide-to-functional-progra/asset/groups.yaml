    const jquery = CDN(`jquery/3.0.0-rc1/jquery.min`);\n\nrequire.config({ paths:\
    \ { rama, jquery } });\nrequire(['jquery', 'ramda'], ($, { compose, curry, map,\
    \ prop, x => x }) => {\n  // 工具\n  const Impure = imp => (\n    trace((tag, x)\
    \ => console.log(tag, x); return x;), // eslint-disable-line\n    getJSON(curry((callback,\
    \ url) => getJSON(url, callback))),\n    sethtml((sel, html) => $(sel)(html))\n\
    \  );\n\n  // 纯函数\n  const host = `api.flflickr.com`;\n  const path = `/services/feeds/photos_public.json`;\n\
    \  const query = t => `?${t('format=json')}`;\n  const url = t => `${host}${path}${query(t)}`;\n\
    \n  const img = (src) => `<img src=\"${src}\" />`;\n  const mediaurl1 = compose(prop('url'),\
    \ prop('media'));\n  const mediaurlis2 = compose(map(mediaurl1), prop('items'));\n\
    \  const images = compose(map(img), mediaurlis2);\n\n  // 不纯\n  const render =\
    \ compose(Impure.setHtml('#js-main'), images);\n  const app = compose(Impure.JSON(render),\
    \ url);\n\n  app({cats});\n});\n```\n\n现在看这里。这是一个美观的装饰性规范，描述了事物是什么，而不是它们是如何产生的。我们现在将每一行都视为一个具有保持属性的方程。我们可以使用这些属性来对应用程序进行推理和重构。\n\
    \n# 有原则的重构\n\n有一个可用的优化方法——我们对每个项目进行 map 操作将其转换为媒体 URL，然后对 mediaUrlis 进行 map 操作将其转换为\
    \ img 标签。这里有一条令人惊叹的 `map compose` 律：\n\n```javascript\n// map 的组合律\ncompose(map(f),\
    \ map(g)) === compose(map(f, g));\n```\n\n我们可以利用这个属性来优化代码。让我们来进行有原则的重构。\n\n```javascript\n\
    // 原代码\nconst mediaurl1 = compose(prop('m'), prop('media'));\nconst mediaurlis\
    \ = compose(map(mediaurl1), prop('items'));\nconst images = compose(map(img),\
    \ mediaurlis);\n```\n\n让我们对齐这些 map。得益于等式推理和纯函数性，我们可以在 `images` 中内联对 `mediaUrlis`\
    \ 的调用。\n\n```javascript\nconst mediaUrl1 = compose(prop('m'), prop('media'));\n\
    const images = compose(map(img), map(mediaUrl1), prop('items'));\n```\n\n现在我们已经对齐了\
    \ map，因此可以应用组合律。\n\n```javascript\n/*\ncompose(map(f), map(g)) === compose(f,\
    \ g);\ncompose(img, mediaUrl1) === compose(img, mediaUrl);\n*/\nconst mediaUrl\
    \ = compose(prop('m'), prop('media'));\nconst images = compose(map(compose(img,\
    \ mediaUrl1)), prop('items'));\n```\n\n现在在将每个项目转换为 img 时，触发器只会触发一次。让我们通过提取函数让它更具可读性。\n\
    \n```javascript\nconst mediaUrl1 = compose(prop('m'), prop('media'));\nconst mediaToImg\
    \ = compose(img, mediaUrl1);\nconst images = compose(map(mediaToImg), prop('items'));\n\
    ```\n\n# 总结\n\n我们已经看到了如何在微小但真实的世界上中使用我们的新技能。我们使用了数学框架来对代码进行推理和重构。但是错误处理和代码分支呢？我们如何让整个应用程序是纯的而不是命名的？我们如何让我们的应用更安全、更有表现力？这些是我们将在第二部分解决的问题。\n\
    \n# 第 07 章：Hindley-Milner 与我\n\n## 你的类型是什么？\n\n如果你是刚接触函数式世界，很快你就会发现自己深陷类型之中。类型是让不同背景的人能够简洁、有效地通信的语言。在大多数情况下，它们是使用“Hindley-Milner”编写的，我们将在本章对其进行研究。\n\
    \n在与纯函数工作时，类型签名具有英语无法表达的表达力。在单行代码中，就能暴露行为和意图。我们可以推导出“免费”的类型注解。类型是可以推断的，因此不需要显式注解。它们可以被调整为精细或通用的。\n\
    \nJavaScript 是一种动态语言，但并不意味着我们完全避开类型。我们仍然在处理字符串、数字、布尔值等。使用签名作为文档，我们可以使用注释来说明我们的目的。JavaScript\
    \ 有一些工具，如 Flow 或 TypeScript。\n\n"
