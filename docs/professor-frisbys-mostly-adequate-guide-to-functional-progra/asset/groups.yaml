  - '[PAGE 88]


    It should be pointed out part of ap ''s appeal is the ability to run things concurrently
    so defining it via chain is missing out that optimization. Despite that, it''s
    good to have an immediate working interface while one works out the best possible
    implementation.


    Why not use and be done with it, you ask? It''s good practice to work with the
    level of power you use, no more, less. This keeps cognitive load to a minimum
    by ruling out possible functionality. For this reason, it''s good to favor applicatives
    over monads.


    Monads have the unique ability to sequence computation, assign variables, and
    halt further execution thanks to the downward nesting structure. When one sees
    applicatives in use, they need''t concern themselves with any of that business.


    Now, to the legalities ...


    # Laws


    Like the other mathematical constructs we''ve explored, applicative functors hold
    some useful properties for us to rely on our daily code. First, you should know
    that applicatives are "closed under composition", meaning ap will never change
    types over us (yet another favor to over monads). That''s not to say we cannot
    have multiple effects - we can stack our types knowing that they will remain the
    same during the entirety of our applicative.


    To demonstrate:


    ```

    const tOf = compose(Task.of, Maybe.of);

    liftA2(liftA2(concat), tOf(`Rainy Days and Mondays`), tOf(`always get me down));
    // Task(Maybe(Rainy Days and Mondays always get me down))

    ```


    We need not to worry about different types getting in the mix.


    Time to look at our favorite categorical law: identity.


    # Identity


    ```

    // identity

    A.of(id).ap(v) === v;

    ```


    Right, so applying id all from within a functor shouldn''t alter the value in
    v. For example:


    ```

    const v = Identity.of(`Pillow Pets`);

    Identity.of(id).ap(v) === v;

    ```'
