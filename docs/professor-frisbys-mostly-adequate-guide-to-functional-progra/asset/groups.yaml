- md: "\n```javascript\nquerySelector('input.username').chain(({ value: uname }) =>\n\
    \  querySelector('input.email').map(({ value: email }) =>\n    `Welcome ${uname}\
    \ prepare for spam at ${email}`\n);\n\n// 'Welcome Olivia prepare for spam at\
    \ olivia@tremorcontrol.net';\",\n```\n\nFinally, we have two examples using Mype.\
    \ Since chain is mapping under the hood, if any value is null, we stop the computation\
    \ in its tracks.\n\nDon't worry if these examples are hard to grasp. First play\
    \ with them. Poke with a stick. Remember to map when returning a \"normal\" and\
    \ chain when we're returning another functor. In the next chapter, we'll approach\
    \ Applicatives and see nice tricks to make this kind of expressions neither nor\
    \ nor highly readable.\n\nAs a reminder, this does not work with two different\
    \ types. Functor composition and later, monad transformers, can help us in that\
    \ situation.\n\n# Power Trip\n\nContainer style programming can be confusing at\
    \ times. We sometimes find struggles to understand how many containers deep a\
    \ value is or if we need map Of chain (soon we will see more container methods).\
    \ We can greatly improving debugging with tricks like implementing inspect and\
    \ we will learn how create a \"stack\" that handles whatever we throw at it, but\
    \ there are times when we question if it's worth the haste.\n\nI'd like to swing\
    \ the fiery monadic sword for a moment to exhibit the programming this way.\n\n\
    Let's read a few, upload it directly afterward:\n\n```javascript\n// readFile\
    \ :: filename -> Either String (Task Error String)\n// httpPost :: String -> Task\
    \ -> Error JSON\n// upload :: filename -> Either String (Task Error JSON)\nconst\
    \ upload = compose(mapChain(httpPost('/uploads/')), readFile);\n```\n\nHere, we\
    \ are chaining several times. Looking at the types I we can see that are 3 errors\
    \ - readFile uses Either to validate the input (perhaps ensuring the file is present),\
    \ readFile may error when accessing the file as expressed in the first type of\
    \ Task , and the upload may fail for whatever reason which is expressed by the\
    \ Error in httpPost. We usually pull off nested, sequential asynchronous actions\
    \ with chain.\n\nAll of this is written in one line left to right. This is all\
    \ pure and declarative. It holds equals reasoning and relation properties. We\
    \ are forced to add needless and confusing variable names. Our upload function\
    \ is written against generic interfaces and not specific one-off apis. This is\
    \ one bloody line for good sake.\n\nFor contrast, let's look at the standard imperative\
    \ way to pull this off:\n\n```javascript\n// upload :: Filename -> (String ->\
    \ a) -> Void\nconst upload = (filename, callback) => {\n  if (filename) {\n  \
    \  throw error('You need a filename!');\n  } else {\n    readFile(filename, (err,\
    \ contents) => {\n      if (err) throw err;\n      httpPost('/uploads/', contents,\
    \ (errH, json) => {\n        if (errH) throw errH;\n        callback(json);\n\
    \      });\n    });\n  }\n};\n```\n\nWell isn't that the devil's arithmetic. We're\
    \ be pinballed through a volatile maze of madness. Imagine if it were a typical\
    \ app that also mutated variables along the way? We'd be in the tar pit indeed.\n\
    \n# Theory\n\nThe first law we'll look at is associativity, but perhaps not in\
    \ the way you're used to it.\n\n```javascript\n// associativity\ncompose(join,\
    \ map(join)) === compose(join, join);\n```\n\nThese laws get at the nested nature\
    \ of monads so associativity focuses on joining the inner or outer types to achieve\
    \ the same result. A picture might be more instructive:\n\n![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_78_0.png)\n\
    \nStarting with the top moving downward, we can join the two M's of M(M(a)) first\
    \ cruise over our desired with another join . Alternatively, we can pop the hood\
    \ and flatten the two M's with map(join). We end up with the M.a regardless of\
    \ if we join the inner or outer M's first and that's what associativity is all\
    \ about. It's worth noting that map(join) != join. The intermediate steps can\
    \ vary in value, but the end result of the last join will be the same.\n\nThe\
    \ second law is similar:\n\n```javascript\n// identity for all (M a)\ncompose(join,\
    \ of) === compose(join, map(of)) === id;\n```\n\nIt states that, for any monad\
    \ M, of and join amounts to id. We can also map(of) and attack it from the inside\
    \ out. We call this \"triangle identity\" because it makes such a shape when visualized:\n\
    \n![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_79_0.png)\n\nIf we start at the top\
    \ left heading right, we can see that of does indeed drop our M in another M container.\
    \ If we move downward and join it, we get the same as if we just called id in\
    \ the first place. Moving right to left, we see that if we sneak under the covers\
    \ with map and call of the plain a, we'll end up with M(M a) and join will bring\
    \ us back to square one.\n\nI should mention that we have written of, however,\
    \ it must be the specific M of whatever monad we're using.\n\nNow, we've seen\
    \ these lines, identity and associativity, somewhere... Hold on, I'm thinking...\
    \ Of course! These are the laws for a category. But that would need a composition\
    \ function to complete the definition:\n\n```javascript\nconst mcompose = (f,\
    \ g) => compose(f, g);\n\n// left identity\nmcompose(id, f) === f;\n\n// right\
    \ identity\nmcompose(f, id) === f;\n\n// associativity\nmcompose(mcompose(f, g),\
    \ h) === mcompose(f, mcompose(g, h));\n```\n\nMonads form a category called the\
    \ \"Kleisli category\" where all objects are monads and morphisms are functions.\
    \ The intention is to show the relevance and spark some interest while focusing\
    \ on the practical properties we can use each day. \n\n# In Summary\n\nMonads\
    \ let us drill into nested computations. We can assign variables, run sequential\
    \ effects, perform asynchronous tasks, all without laying one brick in a pyramid\
    \ of doom. They come to the rescue when a value finds itself multiple layers of\
    \ the same type. With the help of the trusty sidekick \"pointed\", monads are\
    \ able to lend us unboxed value and know we'll be able to place it back when we're\
    \ done. Yes, monads are very powerful, yet we find ourselves needing some extra\
    \ functions. For instance, what we wanted to run a list of api calls at once?\
    \ We can accomplish this task with monads, but we'd have to wait for each before\
    \ finishing the next. What about combining several validations? We'd like to continue\
    \ gathering the list of errors, but monads would stop the show after the first\
    \ entered. In the next chapter, we'll see how applicative functors fit into the\
    \ container world and why we prefer them to monads in many cases.\n\nChapter 10:\
    \ Applicative Functors\n\n# Exercises\n\nConsidering a User object as:\n\n```javascript\n\
    const user = {\n  id: 1,\n  name: 'Albert',\n  address: {\n    number: 2,\n  \
    \  name: 'Walnut St'\n  }\n};\n```\n\n> Exercise\nUse 'safeProp' and 'map/join'\
    \ or 'chain' to safely get the street name given a user\n\n// getStreetName ::\
    \ User -> Maybe String\nconst getStreetName = undefined;\n\nWe now consider the\
    \ following items:\n\n```javascript\n// getFile :: IO String\nconst getFile =\
    \ IO.of('/home/adequate/ch89.md');\n\n// pureLog :: String -> IO (ID)\npureLog\
    \ = str => new ID((id) => console.log(str));\n```\n\n> Exercise\nUse getFile to\
    \ get the filepath, remove the directory and keep only the basename, then purely\
    \ log it. Hint: you may want to use 'split' and 'last' to obtain it from a filepath.\n\
    \n// logFilename :: IO ()\nconst logFilename = undefined;\n\nFor this exercise,\
    \ we consider helpers with the following signatures:\n\n```javascript\n// validateEmail\
    \ :: Email -> Either String\n// addToMailingList :: Email -> IO([Email])\n// emailBlast\
    \ :: [Email] -> IO ()\n```\n\n# Exercise\n\nUse 'validateEmail', 'addToMailingList'\
    \ and 'emailBlast' to create a function which adds a new email to the mailing\
    \ list if valid, and then notify the whole list.\n\n```javascript\n// joinMailingList\
    \ :: Email -> Either String IO ()\nconst joinMailingList = undefined;\n```\n\n\
    # Applying Applicatives\n\nThe name applicative functor is pleasantly descriptive\
    \ given its functional origins. Functional programmers are notorious for coming\
    \ up with names like mapped or liftA, which seems perfectly natural when viewed\
    \ in the math lab, but hold the clarity of an indecisive Darth Vader at the thru\
    \ in any other context.\n\nAnyhow, the name should spill the beans on what interface\
    \ gives us: the ability to apply functors to each other.\n\nNow, why would a normal,\
    \ rational person as yourself want such a thing? What does it even mean to apply\
    \ one functor to another?\n\nTo answer these questions, we'll start with a situation\
    \ you may have already encountered in your functional travels. Let's say, hypothetically,\
    \ that we have two functors (of the same type) and we'd like to call a function\
    \ with both of their values as arguments. Simple like adding the values of two\
    \ Containers.\n\n```javascript\n// We can't do this because the numbers are bottled\
    \ up.\nadd(Container.of($), Container.of($));\n// Nah\n```\n\n```javascript\n\
    // Let's use our trusty map\nconst ContainerOfadd2 = map(add, Container.of(3));\n\
    Container(add(2))\n```\n\nWe have ourselves Container with a partially applied\
    \ function inside. More specifically, we have a Container(add(2)) and we'd like\
    \ to apply add(2) to the 3 in Container(3) to complete the call. In other words,\
    \ we'd like to apply one functor to another.\n\nNow, it just so happens that we\
    \ already have the tools to accomplish this task. We can chain and then map the\
    \ partially applied add(2) like so:\n\n```javascript\nContainer.of(2).chain(two\
    \ => Container.of(3).map(add(two)));\n```\n\nThe issue here is that we are in\
    \ the sequential world of wherein nothing may be evaluated before the previous\
    \ month has finished its business. We have ourselves two strong, independent values\
    \ and I should think it unnecessary to delay the creation of Container(3) merely\
    \ to satisfy the monad's sequential demands.\n\nIn fact, it would be lovely if\
    \ we could succinctly apply one functor's contents to another's value without\
    \ these needless functions and variables we should find ourselves in this pickle\
    \ jar.\n"
