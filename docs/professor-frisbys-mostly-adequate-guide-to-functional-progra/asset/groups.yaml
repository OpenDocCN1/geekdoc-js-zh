    \ help remove some parentheses.\n\n# Free Openers\n\n![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_87_0.png)\n\
    \nWe haven't spoken much about derived functions. Seeing as all of these interfaces\
