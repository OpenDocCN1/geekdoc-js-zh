    # # Chapter 02: First Class Functions


    # ## A Quick Review


    When we say functions are "first class", we mean they are just like everyone else...
    so in other words a normal class. We can treat functions like any other data and
    there is nothing particularly special about them - they may be stored in arrays,
    passed around as function parameters, assigned to variables, and what have you.


    That is JavaScript 101, but without mentioning a quick code search on github will
    reveal the costly evasion, or perhaps widespread ignorance of this concept. Shall
    we go for a feigned example? We shall.


    ```

    const hi = name => ${name};

    const greeting = name => ${hi(name)};

    ```


    Here, the function wrapper around hi greeting is completely redundant. Why? Because
    functions are callable in JavaScript. When hi has the () at the end it will return
    a value. When it does not, it simply returns the function stored in the variable.
    Just to be sure, have a look yourself:


    ```

    hi // name => ${name}

    hi("jonas"); // Hi jonas

    ```


    Since greeting is merely in calling hi with the very same argument, we could simply
    write:


    ```

    const greeting = hi;

    greeting("times"); // Hi Times

    ```


    In other words, hi is already a function that expects one argument, why place
    another function that it calls hi with the same bloody argument? It doesn''t make
    any damn sense. It''s like donning your heaviest parka in the dead of July to
    blast the air and demand an ice jolly.


    It is obviously verbose and, if it happens, bad practice to surround a function
    with another function merely to delay evaluation (we''ll see why when in a moment,
    but it has to do with maintenance)


    A solid understanding of this is critical before moving on, so''s examine a few
    more examples excavated from the library of npm packages.


    ```

    // ignorant

    const getServerStuff = callback => ajaxCall(json) => callback(json);


    // enlightened

    const getServerStuff = ajaxCall;

    ```'
