    \ 等同于 `id`。我们也可以使用 `map(of)` 并从内向外攻击它。我们称之为“三角形恒等式”，因为在可视化时会形成这样的形状：\n\n![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_79_0.png)\n\
