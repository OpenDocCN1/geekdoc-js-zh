- md: "\n```javascript\nconst img = src => `<img src='${src}'>`, src);\n```\n\njQuery's\
    \ html method will accept an array of tags. We only have to transform the mediaUrls\
    \ and send them along to setHtml.\n\n```javascript\nconst images = compose(map(img),\
    \ mediaUrls);\nconst render = compose(Impure.setHtml(`#js-main`), images);\nconst\
    \ app = compose(Impure.getJSON(render), url);\n```\n\nAnd we're done!\n\n![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_39_0.png)\n\
    \nHere is the finished script:\n\n```javascript\nconst CDN = s => `https://cdnjs.cloudflare.com/ajax/${s}`;\n\
    const rama = CDN(`ramda/21.0-ramda.min`);\nconst jquery = CDN(`jquery/3.0.0-rc1/jquery.min`);\n\
    \nrequire.config({ paths: { rama, jquery } });\nrequire(['jquery', 'ramda'], ($,\
    \ { compose, curry, map, prop, x => x }) => {\n  // utils\n  const Impure = imp\
    \ => (\n    trace((tag, x) => console.log(tag, x); return x;), // eslint-disable-line\n\
    \    getJSON(curry((callback, url) => getJSON(url, callback))),\n    sethtml((sel,\
    \ html) => $(sel)(html))\n  );\n\n  // Pure\n  const host = `api.flflickr.com`;\n\
    \  const path = `/services/feeds/photos_public.json`;\n  const query = t => `?${t('format=json')}`;\n\
    \  const url = t => `${host}${path}${query(t)}`;\n\n  const img = (src) => `<img\
    \ src=\"${src}\" />`;\n  const mediaurl1 = compose(prop('url'), prop('media'));\n\
    \  const mediaurlis2 = compose(map(mediaurl1), prop('items'));\n  const images\
    \ = compose(map(img), mediaurlis2);\n\n  // Impure\n  const render = compose(Impure.setHtml('#js-main'),\
    \ images);\n  const app = compose(Impure.JSON(render), url);\n\n  app({cats});\n\
    });\n```\n\nNow look at that. A beautifully decorative specification of what things\
    \ are, not how they come to be. We now view each line as an equation with properties\
    \ that hold. We can use these properties to reason about our application and refactor.\n\
    \n# A Principled Refactor\n\nThere is an optimization available - we map over\
    \ each item to turn it into a media url, then we map over mediaUrlis to turn them\
    \ into img tags. There is a raving map compose:\n\n```javascript\n// map's composition\
    \ law\ncompose(map(f), map(g)) === compose(map(f, g));\n```\n\nWe can use this\
    \ property to optimize our code. Let's have a principled refactor.\n\n```javascript\n\
    // original code\nconst mediaurl1 = compose(prop('m'), prop('media'));\nconst\
    \ mediaurlis = compose(map(mediaurl1), prop('items'));\nconst images = compose(map(img),\
    \ mediaurlis);\n```\n\nLet's line up our maps. We can inline the call to mediaUrlis\
    \ in images thanks to equational reasoning and purity.\n\n```javascript\nconst\
    \ mediaUrl1 = compose(prop('m'), prop('media'));\nconst images = compose(map(img),\
    \ map(mediaUrl1), prop('items'));\n```\n\nNow we have lined out our maps so we\
    \ can apply the composition law.\n\n```javascript\n/*\ncompose(map(f), map(g))\
    \ === compose(f, g);\ncompose(img, mediaUrl1) === compose(img, mediaUrl);\n*/\n\
    const mediaUrl = compose(prop('m'), prop('media'));\nconst images = compose(map(compose(img,\
    \ mediaUrl1)), prop('items'));\n```\n\nNow the buzzer will only occur once when\
    \ turning each item into an img. Let's make it a little more readable by extracting\
    \ the function out.\n\n```javascript\nconst mediaUrl1 = compose(prop('m'), prop('media'));\n\
    const mediaToImg = compose(img, mediaUrl1);\nconst images = compose(map(mediaToImg),\
    \ prop('items'));\n```\n\n# In Summary\n\nWe have seen how to put our new skills\
    \ into use with a small, but real world. We've used our mathematical framework\
    \ to reason about and refactor our code. But what about error handling and code\
    \ branching? How can we make the whole application pure instead of names? How\
    \ can we make our app safer and expressive? These are the questions we will tackle\
    \ in part 2.\n\n# Chapter 07: Hindley-Milner and Me\n\n## What's Your Type?\n\n\
    If you're new to the functional world, it won't be long before you find yourself\
    \ deep in type. Types are the language that enables people from all backgrounds\
    \ to communicate succinctly and effectively. For the most part, they're written\
    \ with \"Hindley-Milner\", we'll be examining in this chapter.\n\nWhen working\
    \ with pure functions, type signatures have an expressive power which English\
    \ language cannot hold. In a single line, expose behaviour and intent. We can\
    \ derive \"free\" type annotations. Types can be inferred so there's no need for\
    \ explicit annotations. They can be tuned to fine or general.\n\nJavaScript is\
    \ a dynamic language, but does not mean we avoid types together. We're still working\
    \ with strings, numbers, booleans, and so on. Using signatures for documentation,\
    \ we can use comments to state our purpose. There are tools available for JavaScript\
    \ such as Flow or TypeScript. The aim of this book is to equip you with the tools\
    \ to write functional code across FP languages.\n\n## Tales from the Cryptic\n\
    \nFrom the dusty pages of books, across the sea of white, amongst casual morning\
    \ posts, into the source itself, we find Hindley-Milner type signatures. The system\
    \ is quite simple, but warrants some practice to fully absorb the language.\n\n\
    ```javascript\n// :: String => String\nconst capitalize = s => toUpperCase(s)\
    \ + toLowerCase(s);\n\ncapitalize('summer');\n```\n\nHere, capitalize takes a\
    \ String and returns a String. Never mind the implementation, it's the signature\
    \ we're interested in. In HM, functions are written as `a -> b` where a and b\
    \ are variables for any type. So the signatures for capitalize can be read as\
    \ \"function from string to String\". In other words, it takes a string as its\
    \ input and returns a string as its output.\n\nLet's look at some function signatures:\n\
    \n```javascript\n// :: String -> Number\nconst length = s => s.length;\n\n// ::\
    \ String -> [String] -> String\nconst join = curry((sep, xs) => xs.join(sep));\n\
    \n// :: Regex -> [String] -> [String]\nconst match = curry((reg, s) => s.match(reg));\n\
    \n// :: Regex -> String -> String\nconst replace = curry((reg, sub, s) => s.replace(reg,\
    \ sub));\n```\n\nstring is the same as before: we take a String and return you.\
    \ The others might perplex you at first. Without fully understanding the details,\
    \ you could just use the last type as the return value. So for match you can interpret\
    \ it: it takes Regex and a String and returns you [String]. But an interesting\
    \ thing is going on there that I'd like to explain. For match we are free to group\
    \ the signature like so:\n\n```javascript\n// :: Regex -> (String -> [String])\n\
    const match = curry((reg, s) => s.match(reg));\n```\n\nAh yes, the last part in\
    \ parenthesis reveals more information. Now it is seen as a function that takes\
    \ a Regex and returns a function from String to [String]. Because of currying\
    \ this is indeed the case: give it a Regex and we get a function back waiting\
    \ for its String argument. Otherwise, we don't have to think that of, but is to\
    \ understand why the last type is the one returned.\n\n```javascript\n// :: String\
    \ -> [String]\nconst onHoliday = match(/holiday/ig);\n```\n\nEach argument pushes\
    \ one off of the string. onHoliday already has a Regex.\n\n```javascript\n// ::\
    \ Regex -> (String -> String)\nconst replace = curry((reg, sub, s) => s.replace(reg,\
    \ sub));\n```\n\nAs you can see with the full parenthesis of replace, the extra\
    \ notation can get a little noisy and redundant so we omit them. We can get all\
    \ the arguments at once if it's easier to just think of it as: replace takes a\
    \ Regex, a String, another String and returns a String.\n\nA few last things here:\n\
    \n```javascript\n// id :: a -> a\nconst id = x => x;\n\n// map :: (a -> b) ->\
    \ [a] -> [b]\nconst map = curry((f, xs) => xs.map(f));\n```\n\nThe id function\
    \ uses any type of a and returns something of the same type as a. Variable names\
    \ like a and b are convention, but they are arbitrary and can be replaced with\
    \ whatever name you'd like. That's important so let's reiterate: `a -> a` can\
    \ be any type a to any type b, but `a -> a` means it has to be the same type.\
    \ For example, id may be String -> String or Number -> Number, String -> Bool.\n\
    \nmap similarly uses variables, but this introduce b which may or not be the same\
    \ type as a. We can read it as: map takes an array of a to the same or different\
    \ b, then takes an array of a and results in an array of b.\n\nHopefully, you\
    \ will be overwhelmed by the beauty of this signature. It literally tells you\
    \ does word for word. Given a function from a to b, an array of a, and it delivers\
    \ an array of b.\n\nBeing aware about types and their implications is a skill\
    \ that will take you far in the functional world. Not only will parsers, blogs,\
    \ etc, become more digestible, but the signature itself will practically you on\
    \ its functionality. It takes practice to become a fluent reader, but if you stick\
    \ with it, heaps of information will become available to you without Runtime.\n"
  mdcn: "\n\n```javascript\nconst img = src => `<img src='${src}'>`, src);\n```\n\n\
    jQuery 的 `html` 方法可以接受标签数组。我们只需要转换 `mediaUrls` 并将其发送给 `setHtml`。\n\n```javascript\n\
    const images = compose(map(img), mediaUrls);\nconst render = compose(Impure.setHtml(`#js-main`),\
    \ images);\nconst app = compose(Impure.getJSON(render), url);\n```\n\n我们大完成了！\n\
    \n![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_39_0.png)\n\n以下是完成后的脚本：\n\n```javascript\n\
