  - "[PAGE 31]\n\n```\nconst dasherizer = compose(\n  intercalate(''),\n  map(toLower),\n\
    \  split(/\\s+/),\n  replace(/(\\s)/ig, '-')\n);\n\ndasherizer('The world is a\
    \ vampire');'); // 'the-world-is-a-vampire'\n```\n\nThe `trace` function allows\
    \ us to view the data at a certain point for debugging purposes. Languages like\
    \ Haskell and PureScript have similar functions for ease of development.\n\nComposition\
    \ will be our tool for constructing programs and, as luck would have it, is backed\
    \ by a powerful theory that ensures things work out for. Let's examine this theory.\n\
    \n# Category Theory\n\nCategory theory is an abstract branch of mathematics that\
    \ formalize concepts from several branches such as set theory, type theory, group\
    \ theory, logic, and more. It primarily deals with objects, morphisms, and transformations,\
    \ which mirroring proximity closely. Here is a chart of the concepts viewed from\
    \ each separate theory.\n\n| Types | Logic | Homotopy |\n| :--- | :--- | :---\
    \ |\n| A | proposition | set | space |\n| $a : A$ | proof | element | point |\n\
    | $B(x)$ | predicate | family of sets | fibration |\n| $b(x) : B(x)$ | conditional\
    \ proof | family of elements | section |\n| $0,1$ | $\\perp, \\top$ | $\\varnothing,\
    \ \\{\\}$ | $\\varnothing, *$ |\n| $A + B$ | $A \\vee B$ | disjoint union | coproduct\
    \ |\n| $A \times B$ | $A \\wedge B$ | set of pairs | product space |\n| $A \t\
    o B$ | $A \\Rightarrow B$ | set of functions | function space |\n| $\\sum_{(x:A)}\
    \ B(x)$ | $\\sum_{(x:A)} B(x)$ | disjoint sum | total space |\n| $\\prod_{(x:A)}\
    \ B(x)$ | $\\prod_{(x:A)} B(x)$ | product | space of sections |\n| $id_A$ | equality\
    \ = | $\\{x, x\\} \\mid x \\in A\\}$ | path space $A^I$ |\n\nSorry, I didn't mean\
    \ to frighten you. I don't expect you to be intimately with all these concepts.\
    \ My point is to show how much duplication we have so we can see how category\
    \ theory aims to unify these things.\n\nIn category theory, we have something\
    \ called... a category. It is defined as a collection with the following components:\n\
    \n+   * A collection of objects\n* A collection of morphisms\n* A notion of composition\
    \ on the morphisms\n* A distinguished morphism called identity"
  - '[PAGE 32]


    Category theory is abstract enough to model many things, let''s apply this to
    types and functions, which is what we care about the moment.


    A collection of objects The objects will be data types. For instance, String,
    Boolean, Number, Object, etc. We often view data types as sets of all the possible
    values. One could look at Boolean as the set of [true, false] and Number as the
    set of all numeric values. Treating types as sets is useful because we use set
    theory to work with them.


    A collection of morphisms The morphisms will be our standard every day pure functions.


    A notion of composition on the morphisms This, as you may have guessed, our new
    toy - compose. We discussed that our compose function is associative which is
    no coincidence as it is a property that must hold for any composition in category
    theory.


    Here is an image demonstrating composition:


    ![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_32_0.png)


    Here is a concrete example in code:


    ```

    const g = x => x.length;

    const f = x => x === c;

    const isFourletterword = compose(f, g);

    ```


    A distinguished morphism called identity Let''s introduce a useful function called
    id . This function simply takes some input and spits it back at you. Take a look:


    ```

    const id = x => x;

    ```


    You might ask yourself "What in the bloody hell is that useful for?”. We''ll make
    extensive use of this function in the following chapters, but for now think of
    it as a function that can stand in our value - a function masquerading as every
    day data.


    id must nicely with compose. Here is a property that always holds for every unary
    (unary: a one-argument function) function f:'
  - "[PAGE 33]\n\n```\n// identity ===\ncompose(id, f) === compose(f, id) === f;\n\
    // true\n```\n\nHey, you like the identity property on numbers! If that's not\
    \ immediately clear, take some time with it. Understand the futility. We'll be\
    \ seeing id used all over the place soon, but for now we see it a function that\
    \ acts as a stand for a given value. This is quite useful when writing pointfree\
    \ code.\n\nSo there you have it, a category of types and functions. If this is\
    \ your first introduction, imagine you're still a little fuzzy on what a category\
    \ is and why it's useful. We will build upon this knowledge throughout the book.\
    \ As of right now, in this chapter, you can see it as providing us with some wisdom\
    \ regarding composition - the associativity and identity properties.\n\nWhat are\
    \ other categories, you ask? Well, we can define one for directed graphs with\
    \ nodes objects, edges morphisms, and composition being path concatenation. We\
    \ can define Numbers as objects and morphisms (actually any partial or total order\
    \ can be a category). There are heaps of categories, but for the purposes of this\
    \ book, we'll only concern ourselves with the one defined above. We have skimmed\
    \ the surface and must move on.\n\n# In Summary\n\nComposition connects our functions\
    \ like a series of pipes. Data will flow through our application as it - pure\
    \ functions are input to output after all, breaking this chain would disregard\
    \ output, rendering our software useless.\n\nWe hold composition as a design principle\
    \ above all others. This is because it keeps our app simple and reasonable. Category\
    \ theory will play a big part in app architecture, modeling side effects, and\
    \ ensuring correctness.\n\nWe are now at a point where it will serve us to see\
    \ some of this in practice. Let's make an example application.\n\nChapter 06:\
    \ Example Application\n\n# Exercises\n\nIn each exercise, we'll consider Car objects\
    \ with the following shape:\n\n```\n{\n  name: 'Aston Martin One-77',\n  horsepower:\
    \ 758,\n  dollar_value: 1850000,\n  in_stock: true\n}\n```\n\nExercise"
- md: "\nUse `compose()` to rewrite the function below.\n\n```javascript\n// isLastInStock\
    \ :: [Car] -> Boolean\nconst isLastInStock = (cars) => {\n  const lastCar = last(cars);\n\
    \  return prop('in_stock', lastCar);\n}\n```\n\nConsidering the following function:\n\
    \n```javascript\nconst average = xs => reduce(add, 0, xs) / xs.length;\n```\n\n\
    # Exercise\n\nUse the helper function `average` to refactor `averageDollarValue`\
    \ as a composition.\n\n```javascript\n// averageDollarValue :: [Car] -> Int\n\
    const averageDollarValue = (cars) => {\n  const dollarValues = map(c => c.dollar_value,\
    \ cars);\n  return average(dollarValues);\n}\n```\n\n# Exercise\n\nRefactor `fastCar`\
    \ using `compose()` and other functions in pointfree-style. Hint, the `append`\
    \ function may come in handy.\n\n```javascript\nconst fastCar = (cars) => {\n\
    \  const sorted = sortBy(car => car.horsepower, cars);\n  const fastest = last(sorted);\n\
    \  return concat(fastest.name, ' is the fastest');\n}\n```\n\n# Chapter 06: Example\
    \ Application\n\n## Declarative Coding\n\nWe are going to switch our mindset.\
    \ From here on, we'll stop telling the computer how to do its job and instead\
    \ write a specification of what we'd like as a result. I'm sure you'll find it\
    \ much less stressful than trying to micromanage everything all the time.\n\n\
    Declarative, as opposed to imperative, means that we will write expressions, as\
    \ opposed to step instructions.\n\nThink of SQL. There is no \"first do this,\
    \ then do that\". There is one expression that specifies what we'd like from the\
    \ database. We don't decide how to do the work, when the database is upgraded\
    \ and the SQL engine optimized, we don't have to change our query. This is because\
    \ there are many ways to interpret our specification and achieve the same result.\n\
    \nFor some people included, it's hard to grasp the concept of declarative coding\
    \ at first. Let's point out a few examples to get a feel for it.\n\n```javascript\n\
    // imperative\nconst makes = [];\nfor (let i = 0; i < cars.length; i += 1) {\n\
    \  makes.push(cars[i].make);\n}\n\n// declarative\nconst makes = cars.map(car\
    \ => car.make);\n```\n\nThe loop must first initialize the array. The interpreter\
    \ must evaluate this statement before moving on. It directly iterates through\
    \ the list of cars, manually increasing a counter and showing its bits and pieces\
    \ to us in a vulgar display of explicit iteration.\n\nThe map version is one expression.\
    \ It does not require any order of evaluation. There is much freedom for how the\
    \ map function iterates and how the returned array may be assembled. It specifies\
    \ what, not how. Thus, it wears the shiny declarative coat.\n\nIn addition to\
    \ be clearer and more concise, the map function may be optimized at all and our\
    \ precious application code needn't change.\n\nFor those of you who are thinking\
    \ \"Yes, but it's much faster to do the imperative loop\", I suggest you [read\
    \ up] yourself on how the JIT optimizes your code. Here's a terrific video that\
    \ may shed some light.\n\nHere is another example.\n\n```javascript\n// imperative\n\
    const authenticate = (form) => {\n  const user = toUser(form);\n  return login(user);\n\
    };\n\n// declarative\nconst authenticate = compose(login, toUser);\n```\n\nThough\
    \ there's nothing necessarily wrong, there is still an encoded step-by-step evaluation\
    \ baked in. Authentication is the composition of user and login. Again, this leaves\
    \ wiggle room for support code changes and results in our application code being\
    \ a high-level specification.\n\nIn the example, the order of evaluation is specified\
    \ (user), but there are many scenarios where the order is not important, and this\
    \ is easily specified with declarative coding (more on this later).\n\nBecause\
    \ we don't have to encode the order of evaluation, declarative coding lends itself\
    \ to parallel computing. Coupled with pure functions is why FP is a good option\
    \ for the future - we don't need to do anything special to achieve parallel/concurrent\
    \ systems.\n\n# A Flickr of Functional Programming\n\nWe'll now build an example\
    \ application in a declarative, composable way. We'll still cheat and use side\
    \ effects for now, but we'll keep them minimal and separate from our pure codebase.\
    \ We are going to build a browser widget that sucks in flick images and displays\
    \ them. Let's start by scaffolding the app. Here's the html:\n\n```html\n<!doctype\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Flickr\
    \ App</title>\n</head>\n<body>\n  <main id=\"js-main\" class=\"main\"></main>\n\
    \  <script src=\"https://cdn.cloudflare.com/ajax/libs/require.js/2.2.0/require.min.js\"\
    ></script>\n  <script src=\"main.js\"></script>\n</body>\n</html>\n```\n\nAnd\
    \ here the main.js skeleton:\n\n```javascript\nconst CDN = s => `https://cdn.cloudflare.com/ajax/libs/${s}`;\n\
    const ramda = CDN('ramda/0.21.0/ramda.min');\nconst jquery = CDN('jquery/3.0.0-rc1/jquery.min');\n\
    \nrequire.config({ paths: ramda, jquery });\nrequire(['jQuery', 'ramda'], ($,\
    \ { compose, curry, map, prop }) => {\n  // your app goes here\n}));\n```\n\n\
    We'll use ramda instead of lodash. We need to define 4 things:\n\n1. Construct\
    \ a url\n2. Make the api call\n3. Transform the result into html\n4. Place them\
    \ on the screen\n\n```javascript\nconst host = 'api.flickr.com';\nconst path =\
    \ '/services/photos/search';\nconst query = t => `tags=${t}&format=json&page=1`;\n\
    const url = t => `${host}${path}${query(t)}`;\n```\n\nNow we'll define the impure\
    \ functions. We've namespaced them so we can use them:\n\n```javascript\nconst\
    \ Impure = {\n  getJSON: curry((callback, url) => {\n    $.getJSON(url).then(callback);\n\
    \  }),\n  setHtml: curry((sel, html) => $(sel).html(html)),\n  trace: curry((tag,\
    \ x) => {\n    console.log(tag, x);\n    return x;\n  }),\n};\n```\n\nAnyway,\
    \ how to get these nested properties we can use a nice getter from ramda called\
    \ prop. Here's a homegrown version so you can see what's happening:\n\n```javascript\n\
    const prop = curry((property, object) => object[property]);\n```\n\nIt's quite\
    \ dull. We just use [] syntax to access a property on whatever object. Let's get\
    \ to this using media-urls:\n\n```javascript\nconst mediaurl1 = compose(prop('m'),\
    \ prop('media'));\nconst mediaurls = compose(map(mediaurl1), prop('items'));\n\
    ```\n\nOnce we get the items we must map over each to extract media. In this nice\
    \ array of mediaurls let's hook this up to our app and show them on the screen.\n\
    \n```javascript\nconst render = compose(Impure.setHtml('#js-main'), mediaurls);\n\
    const app = compose(Impure.getJSON(render), url);\n\napp('cats');\n```\n\nThis\
    \ calls url function, passes the string to our getJSON which has been partially\
    \ applied with trace. Loading the app will show the response in the console.\n\
    \n![](img/9b77a6dfa4e7c2aa4f9efc3d9dcb488_38_0.png)\n\nWe like to construct images\
    \ out of this json. It looks the media-urls are buried in items then the media\
    \ property. Our final step is to turn these mediaurls into bonafide images. In\
    \ a bigger application we'd use a template/dom library like Handlebars or React.\
    \ For this application though we only need an img tag so let's stick with jQuery.\n"
  mdcn: "\n\n使用 `compose()` 重写下方的函数。\n\n```javascript\n// isLastInStock :: [Car] ->\
    \ Boolean\nconst isLastInStock = (cars) => {\n  const lastCar = last(cars);\n\
    \  return prop('in_stock', lastCar);\n}\n```\n\n考虑以下函数：\n\n```javascript\nconst\
    \ average = xs => reduce(add, 0, xs) / xs.length;\n```\n\n# 练习\n\n使用辅助函数 `average`\
    \ 将 `averageDollarValue` 重构为组合形式。\n\n```javascript\n// averageDollarValue :: [Car]\
    \ -> Int\nconst averageDollarValue = (cars) => {\n  const dollarValues = map(c\
    \ => c.dollar_value, cars);\n  return average(dollarValues);\n}\n```\n\n# 练习\n\
    \n使用 `compose()` 和其他函数以无点风格（pointfree-style）重构 `fastCar`。提示：`append` 函数可能会大有用场。\n\
    \n```javascript\nconst fastCar = (cars) => {\n  const sorted = sortBy(car => car.horsepower,\
    \ cars);\n  const fastest = last(sorted);\n  return concat(fastest.name, ' is\
    \ the fastest');\n}\n```\n\n# 第 06 章：示例应用\n\n## 声明式编程\n\n我们将转变思维方式。从现在起，我们将停止告诉计算机如何工作，而是编写一份我们想要结果的规范。我确定你会发现这比一直试图微管理一切要压力小得多。\n\
    \n声明式（Declarative）与命令式（Imperative）相反，意味着我们将编写表达式，而不是步骤指令。\n\n以 SQL 为例。它没有“先做这个，再做那个”。它有一个表达式指定了我们想要从数据库获取的内容。我们不需要决定如何执行工作，当数据库升级或\
    \ SQL 引擎进行优化时，我们不需要更改查询。这是因为有许多方法可以解释我们的规范并实现相同的结果。\n\n对于某些某些的人来说，起初很难理解声明式编程的概念。让我们列举几个例子来感受一下。\n\
    \n```javascript\n// 命令式\nconst makes = [];\nfor (let i = 0; i < cars.length; i\
    \ += 1) {\n  makes.push(cars[i].make);\n}\n\n// 声明式\nconst makes = cars.map(car\
    \ => car.make);\n```\n\n循环必须先初始化数组。解释器在继续之前必须评估此语句。它直接遍历汽车列表，手动增加计数器，并以一种粗俗的显式迭代方式向我们展示它的每一个细节。\n\
    \n`map` 版本是一个表达式。它不需要任何求值顺序。对于 `map` 函数如何迭代以及返回的数组如何组装，有很大的自由。它指定的是“什么”，而不是“怎么做”。因此，它穿上了闪亮的声明式外衣。\n\
    \n除了更清晰简洁之外，`map` 函数完全可以被优化，而我们珍贵的应用程序代码无需更改。\n\n对于那些认为“是的，但用命令式循环快得多”的人，我建议你自己[阅读一下]\
    \ JIT 是如何优化代码的。这里有一个很棒的视频可能会提供启发。\n\n这是另一个例子。\n\n```javascript\n// 命令式\nconst\
    \ authenticate = (form) => {\n  const user = toUser(form);\n  return login(user);\n\
    };\n\n// 声明式\nconst authenticate = compose(login, toUser);\n```\n\n虽然这没有没有错，但内部仍然编码了逐步评估的步骤。身份验证是用户和登录的组合。再次，这为支持代码的更改留下了空间，并使我们的应用程序代码成为高层规范。\n\
    \n在示例中，求值顺序是被指定的（user），但在许多情况下顺序并不重要，而这通过声明式编程可以轻松指定（稍后会详细介绍）。\n\n由于我们不需要编码求值顺序，声明式编程适用于并行计算。结合纯函数，这正是为什么函数式编程（FP）是未来的良好选择——我们不需要为了实现并行/并发系统做任何特殊操作。\n\
    \n# 函数式编程的 Flickr 之源\n\n我们现在将以声明式、可组合的方式构建一个示例应用。我们暂时仍然“作弊”使用副作用，但我们会把它们保持到最低，并将其与我们的纯代码库分离。我们将构建一个浏览器小组件，获取\
    \ Flickr 图片并显示它们。让我们从搭建应用的骨架开始。这是 HTML：\n\n```html\n<!doctype html>\n<html lang=\"\
    en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Flickr App</title>\n</head>\n\
    <body>\n  <main id=\"js-main\" class=\"main\"></main>\n  <script src=\"https://cdn.cloudflare.com/ajax/libs/require.js/2.2.0/require.min.js\"\
    ></script>\n  <script src=\"main.js\"></script>\n</body>\n</html>\n```\n\n这是 `main.js`\
    \ 的骨架：\n\n```javascript\nconst CDN = s => `https://cdn.cloudflare.com/ajax/libs/${s}`;\n\
    const ramda = CDN('ramda/0.21.0/ramda.min');\nconst jquery = CDN('jquery/3.0.0-rc1/jquery.min');\n\
    \nrequire.config({ paths: ramda, jquery });\nrequire(['jQuery', 'ramda'], ($,\
    \ { compose, curry, map, prop }) => {\n  // 你的应用写在这里\n}));\n```\n\n我们将使用 ramda\
    \ 而不是 lodash。我们需要定义4 件事：\n\n1. 构建 URL\n2. 调用 API\n3. 将结果转换为 HTML\n4. 将它们放置在屏幕上\n\
    \n```javascript\nconst host = 'api.flickr.com';\nconst path = '/services/search';\n\
    const query = t => `tags=${t}&format=json&page=1`;\nconst url = t => `${host}${path}${query(t)}`;\n\
    ```\n\n我们将使用 ramda 而不是 lodash。现在我们将定义副作用函数。我们对它们进行了命名空间以便使用：\n\n```javascript\n\
    const Impure = {\n  getJSON: curry((callback, url) => {\n    $.getJSON(url).then(callback);\n\
    \  }),\n  setHtml: curry((sel, html) => $(sel).html(html)),\n  trace: curry((tag,\
    \ x) => {\n    console.log(tag, x);\n    return x;\n  }),\n};\n```\n\n无论，获取这些嵌套属性可以使用\
    \ ramda 中一个很好的 getter `prop`。这里有一个自制版本让你看到发生了什么：\n\n```javascript\nconst prop\
    \ = curry((property, object) => object[property]);\n```\n\n这相当枯燥。我们只需使用 `[]` 语法访问任何对象的属性。让我们使用\
    \ media-urls 获取它：\n\n```javascript\nconst mediaurl1 = compose(prop('m'), prop('media'));\n\
    const mediaurls = compose(map(mediaurl1), prop('items'));\n```\n\n一旦获取了 items，我们必须对每一个进行\
    \ map 以提取 media。在这个可爱的 mediaurls 数组中，让我们将其连接到我们的应用并显示在屏幕上。\n\n```javascript\n\
    const render = compose(Impure.setHtml('#js-main'), mediaurls);\nconst app = compose(Impure.getJSON(render),\
    \ url);\n\napp('cats');\n```\n\n这调用了 `url` 函数，并将字符串传递给我们部分应用了 `trace` 的 `getJSON`。加载应用将在控制台中显示响应。\n\
    \n![](img/9b77a6dfa4e7c2aa4f9efc3d9dcb488_38_0.png)\n\n我们喜欢从这个 json 构建图像。看起来 media-urls\
    \ 埋在 items 的 media 属性中。我们的最后一步是将这些 mediaurls 转换为真正的图像。在更大的应用程序中，我们会使用 Handlebars\
    \ 或 React 这样的模板/DOM 库。但对于这个应用程序，我们只需要一个 `img` 标签，所以让我们坚持使用 jQuery吧。\n\n"
