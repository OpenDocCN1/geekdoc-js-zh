  mdcn: "\n```javascript\n// 回到应用程序中的 httpGet 并显式传递 err。\nhttpGet('/post/2', (json,\
    \ err) => renderPost(json, err));\n```\n\n如果我们将其作为一类函数处理，需要修改的内容更少：\n\n```javascript\n\
    // renderPost 在 httpGet 内部被调用，接收它所需的参数\nhttpGet('/post/2', renderPost);\n```\n\
    \n除了删除不需要的函数，我们必须对参数进行命名和引用。你可以看到，名称是个问题。我们存在潜在的误名——特别是当代码库的需求发生变化时。\n\n对同一个概念使用多个名称是项目中常见的困惑来源。还存在泛型代码的问题。例如，这两个函数的作用相同，但其中一个感觉上是无限通用且可重用的：\n\
    \n```javascript\n// 针对我们目前的博客\nconst validArticles = articles =>\n.filter(article\
    \ => article != null && article !== undefined);\n// 对未来项目非常有意义\nconst compact\
    \ = xs => xs.filter(x => x != null && x !== undefined);\n```\n\n通过使用特定的命名，我们似乎将自己绑定到了特定的数据上（在这种情况下是文章）。这种情况经常发生，并且是重复造轮的来源。\n\
    \n我必须提到，即使在面向对象的代码中，你也必须意识到这种问题会致命地出现。如果底层函数使用了这一点，而我们将其作为一类函数调用，那么我们将受到这种“泄漏抽象”的惩罚。\n\
    \n```javascript\nconst fs = require('fs');\n// 危险的\nfs.readFile('freaky_friday.txt',\
    \ Db.save);\n// 没那么危险\nfs.readFile('freaky_friday.txt', Db.save.bind(Db));\n```\n\
    \n由于绑定了自身，Db 可以自由访问它的原型垃圾代码。我像个懒虫一样避免使用它。在编写函数式代码时，真的不需要这样做。然而，在与其他库交互时，你可能不得不顺应周围的数学世界。\n\
    \n有些人会认为为了优化速度这是必须的。如果你属于微优化类型，请关上这本书。如果你无法接受，也许你可以把它换成更复杂的东西。\n\n好了，我们准备好继续了。\n\
    \n# 第 03 章：纯函数的纯粹快乐\n\n## 回归纯粹\n\n我们首先需要明确的是纯函数的概念。\n\n纯函数是指在给定相同输入的情况下，始终返回相同输出且没有任何可观测副作用的函数。\n\
    \n以 slice 和 splice 为例。它们是执行完全相同操作的函数——请注意，方式完全不同，尽管本质是一样的。我们说 slice 是纯的，因为它每次输入都保证返回相同的输出。而\
    \ splice 会“嚼碎”它的数组并吐出一个永远被改变的数组，这是一个可观测的副作用。\n\n```javascript\nconst xs = [1,2,3];\n\
    // 纯\nxs.slice(0); // [1,2,3]\nxs.slice(0); // [1,2,3]\nxs.slice(0); // [1,2,3]\n\
    \n// 不纯\nxs.splice(0,3); // [1,2,3]\nxs.splice(0,3); // [4,5]\nxs.splice(0,3);\
    \ // []\n```\n\n在函数式编程中，我们不喜欢像 splice 这样会修改数据的臃肿函数。这永远是不可行的，因为我们追求的是每次返回相同结果的可靠函数，而不是像\
    \ splice 那样在身后留下一团糟的函数。\n\n让我们来看另一个例子。\n\n```javascript\n// 不纯\nlet minimum =\
    \ 21;\nconst checkAge = age => minimum;\n\n// 纯\nconst checkAge = (age) => {\n\
    \  const minimum = 21;\n  return age > minimum;\n};\n```\n\n在不纯的部分，checkAge 依赖于可变变量\
    \ minimum 来确定结果。换句话说，它依赖于系统状态，这令人失望，因为通过引入外部环境增加了认知负荷。\n\n在这个例子中可能看起来并不像，但这种对状态的依赖是系统复杂性的最大来源之一（http://curtclifton.net/papers/MoseleyMarks06a.pdf）。checkAge\
    \ 可能会根据输入外部因素返回不同的结果，这不仅让它不具备纯函数的资格，还让我们在每次推理软件时都精疲力竭。\n\n另一方面，它的纯形式是完全自自足的。我们还可以让\
