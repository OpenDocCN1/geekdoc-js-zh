    # # Chapter 07: Hindley-Milner and Me


    # ## What''s Your Type?


    If you''re new to the functional world, it won''t be long before you find yourself
    knee deep in type signatures. Types are the meta language that enables people
    from all different backgrounds to communicate succinctly and effectively. For
    the most part, they''re written with a system called "Hindley-Milner", which we''ll
    be examining in this chapter.


    When working with pure functions, type signatures have an expressive power to
    which the English language cannot hold. These signatures whisper in your ear intimate
    secrets of a function. In a single, compact line, expose behaviour and intent.
    We can derive "free" type annotations. Types can be inferred so there''s no need
    for explicit type annotations. They can be tuned to fine point or left general
    abstract. They are not only useful for compile time checks, but also turn out
    to be the best possible documentation available. Type signatures thus play an
    important part in functional programming - much more than you might expect.


    JavaScript is a dynamic language, but does not mean we avoid all types together.
    We''re still working with strings, numbers, booleans, and so on. It''s just that
    there''s not language level integration so we hold this information in our heads.
    Not to worry, since we''re using signatures for documentation, we can use comments
    to state our purpose.


    There are type tools available for JavaScript such as Flow or the typed dialect,
    TypeScript. The aim of this book is to equip you with the tools to write functional
    code we''ll stick with the type system used across FP languages.


    # ## Tales from the Cryptic


    From the dusty pages of books, across the vast sea of white papers, amongst casual
    Saturday morning blog posts, down into the source code itself, we find Hindley-Milner
    type signatures. The system is quite simple, but warrants a quick explanation
    and some practice to fully absorb the little language.


    ```

    // :: String => String

    const capitalize = s => toUpperCase(head(s)) + toLowerCase(tail(s));


    capitalize(''smurf''); // ''Smurf''

    ```


    Here, capitalize takes a String and returns a String . Never mind the implementation,
    it''s the type signature we''re interested in.'
  - '[PAGE 43]


    In HM, functions are written as a -> b where a and b are variables for any type.
    So the signatures for capitalize can be read as "function from string to String".
    In other words, it takes a string as its input and returns a string as its output.


    Let''s look at some function signatures:


    ```

    // String :: String -> Number

    const strength = s => s.length;


    // Join :: String -> [String] -> String

    const join = curry((curry, xs) => xs.join(curry));


    // match :: Regex -> [String]

    const match = curry((reg, s) => s.match(reg));


    // replace :: Regex -> String -> String

    const replace = curry((reg, sub, s) => s.replace(reg, sub));

    ```


    string is the same as before: we take a String and return you a


    The others might perplex you at first. Without fully understanding the details,
    you could just use the last type as the return value. So for match you can interpret
    it: it takes Regex and a String and returns you [String]. But an interesting thing
    is going on there that I''d like a moment to explain if I.


    For match we are free to group the signature like so:


    ```

