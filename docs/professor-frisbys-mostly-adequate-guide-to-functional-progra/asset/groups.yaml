    \ = undefined;```\n\n# 第 12 章：Traversable\n\n到为止，在旅途中，我们已经了 functor，扭曲它直到我们执行任何喜欢的运算。我们对通过函数应用收集结果来同时处理多个副作用感到惊叹。看着容器通过合并它们而消失在空中，我们感到惊讶。由于合并而消失在空中（Standing\
