- md: "\nIt may come as a shock, throw/catch is not very pure. When an error is thrown,\
    \ instead of returning an output value, we sound the alarms! The function attacks,\
    \ spawning thousands of 0s and 1s like shields and spears in an electric battle\
    \ against our intuitive input. With our new friend Either, we can do better than\
    \ to declare war on input, we can respond with a polite message. Let's take a\
    \ look:\n\n- A complete implementation is given in the Appendix B\n\n```javascript\n\
    class Either {\n    static(x) {\n        return new Right(x);\n    }\n\n    constructor(x)\
    \ {\n        this.$value = x;\n    }\n}\n\nclass Left extends Either {\n    map(f)\
    \ {\n        return this;\n    }\n\n    inspect() {\n        return Left(inspect(this.$value));\n\
    \    }\n}\n\nclass Right extends Either {\n    map(f) {\n        return Either.of(f(this.$value));\n\
    \    }\n\n    inspect() {\n        return Right(inspect(this.$value));\n    }\n\
    }\n\nconst left = x => new Left(x);\n```\n\nLeft and Right are two subclasses\
    \ of an abstract type we call Either. I've skipped the ceremony of creating the\
    \ Either superclass as we'll never use it, but it's good to be aware. Now then,\
    \ there's nothing new here besides the two types. Let's see how they act:\n\n\
    ```javascript\nEither.of('rain').map(str => b(str));\n// Right('brain')\n\nleft('rain').map(str\
    \ => `It's gonna ${str}, better bring your umbrella!`);\n// Left('rain')\n\nEither.of({\
    \ host: 'localhost', port: 80 }).map(prop('host'));\n// Right('localhost')\n\n\
    left(rolls eyes...).map(prop('host'));\n// Left(rolls eyes...)\n```\n\nLeft is\
    \ the teenary sort and ignores our request to map over it. Right will work just\
    \ like Container (a.k.a. Identity). The power comes from the ability to embed\
    \ an error message within the Left.\n\nSuppose we have a function that might not\
    \ succeed. How we calculate an age from a birth date. We could use Nothing to\
    \ signal failure and branch our program, however, it doesn't tell us. Perhaps,\
    \ we'd like to know why it failed. Left's wins with Either.\n\n```javascript\n\
    const moment = require('moment');\n\n// getAge :: Date -> User -> Either(String,\
    \ Number)\nconst getAge = curry((now, user) => {\n  const birthDate = moment(user.birthdate,\
    \ 'YYYY-MM-DD');\n\n  return birthDate.isValid()\n    ? Either.of(now.diff(birthDate,\
    \ 'years'))\n    : Left('Birth date could not be parsed');\n});\n\n// getAge(moment(),\
    \ { birthdate: '2005-12-12' });\n// Right(18)\ngetAge(moment(), { birthdate: 'July\
    \ 4, 2001' });\n// Left('Birth date could not be parsed')\n```\n\nNow, like Nothing,\
    \ we are short-circuiting our app when we return a Left. The difference is we\
    \ have a clause to show our program has failed. Something to return Either(String,\
    \ Number), which holds a String as its left value and a Number as its Right. This\
    \ type signature is a bit informal as we haven't taken the time to define an actual\
    \ Either superclass, however, we learn a lot from the type. It informs us that\
    \ we're getting an error message or the age back.\n\n```javascript\n// fortune\
    \ : Number -> String\nconst fortune = compose(concat('If you survive, you will\
    \ be '), toString, add(()));\n\n// zollar :: User -> Either(String, _)\nconst\
    \ zollar = compose(console.log), map(fortune), getAge(moment()));\n\nzollar(birthDate:\
    \ '2005-12-12');\n// 'If you survive, you will be 10'\n// Right(undefined)\n\n\
    zollar(birthDate: 'balloons');\n// Left('Birth date could not be parsed')\n```\n\
    \nWhen the birthdate is valid, the program outputs its fortune to the screen to\
    \ be behold. Otherwise, we are handed a left with the error message plan as they\
    \ still tucked away in its container. That acts as if we'd thrown an error, but\
    \ in a calm, manner fashion as to losing its temper and freaking like a child\
    \ when something goes wrong.\n\nIn this example, we are logically branching our\
    \ control flow depending on the validity of the date, yet it reads as linear motion\
    \ from right to left while climbing the curvy braces of a conditional statement.\
    \ Usually, we move the console.log out of our solar function and map it at the\
    \ time of calling, but it's helpful to see how the right branch differs. We use\
    \ in the right branch's signature to indicate that a value should be ignored (some\
    \ browsers you have to use console.log.bind to use it first).\n\nI'd like to take\
    \ this opportunity to point out something you might have missed: fortune, despite\
    \ with its either in this example, is completely ignorant of any functors missing\
    \ logic. This was also the case with finishTransaction in the previous example.\
