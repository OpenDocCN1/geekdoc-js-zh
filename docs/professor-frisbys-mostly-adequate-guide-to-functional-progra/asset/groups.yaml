    \n# 有原则的类型转换 (Principled Type Conversions)\n\n作为程序员，我们熟悉类型转换。我们将类型转换为布尔值，将整数转换为浮点数。区别仅仅在于，我们处理的是代数容器，并且有一些理论可以使用。\n\
    \n让我们看看其中的一些例子：\n\n```javascript\n// idToMaybe :: Identity a -> Maybe a\nconst\
