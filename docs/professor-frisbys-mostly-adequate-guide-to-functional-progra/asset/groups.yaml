    # Chapter 10: Applicative Functors


    # Applying Applicatives


    The name applicative functor is pleasantly descriptive given its functional origins.
    Functional programmers are notorious for coming up with names like mapped or liftA4,
    which seems perfectly natural when viewed in the math lab, but hold the clarity
    of an indecisive Darth Vader at the thru in any other context.


    Anyhow, the name should spill the beans on what interface gives us: the ability
    to apply functors to each other.


    Now, why would a normal, rational person as yourself want such a thing? What does
    it even mean to apply one functor to another?


    To answer these questions, we''ll start with a situation you may have already
    encountered in your functional travels. Let''s say, hypothetically, that we have
    two functors (of the same type) and we''d like to call a function with both of
    their values as arguments. Simple like adding the values of two Container S.


    ```

    // We can''t do this because the numbers are bottled up.

    add(Container.of($), Container.of($));

    // Nah

    ```


    ```

    // Let''s use our trusty map

    const ContainerOfadd2 = map(add, Container.of(3));

    Container(add(2))

    ```


    We have ourselves Container with a partially applied function inside. More specifically,
    we have a Container(add(2)) and we''d like to apply add(2) to the 3 in Container(3)
    to complete the call. In other words, we''d like to apply one functor to another.


    Now, it just so happens that we already have the tools to accomplish this task.
    We can chain and then map the partially applied add(2) like so:


    ```

    Container.of(2).chain(two => Container.of(3).map(add(two)));

    ```


    The issue here is that we are in the sequential world of wherein nothing may be
    evaluated before the previous month has finished its business. We have ourselves
    two strong, independent values and I should think it unnecessary to delay the
    creation of Container(3) merely to satisfy the mond''s sequential demands.


    In fact, it would be lovely if we could succinctly apply one functor''s contents
    to another''s value without these needless functions and variables we should find
    ourselves in this pickle jar.'
