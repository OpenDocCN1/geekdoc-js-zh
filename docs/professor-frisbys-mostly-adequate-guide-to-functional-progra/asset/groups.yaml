    \n# 关于这本书\n\n这是一本关于通用函数式范式的书。我们将使用世界上最流行的编程语言：JavaScript。有些人可能觉得这是一个很糟糕的选择，因为它违背了目前以命令式为主的文化。然而，我认为这是学习函数式编程（FP）的最佳方式，原因如下：\n\
    \n- 你每天工作中都会用到它。\n- 这让你能够每天在真实项目中实践和应用所学知识，而不是在晚上和周末做个人项目。\n- 我们不需要在开始写程序之前学习一切。在纯函数式语言中，没有单子（monads），你无法记录变量或读取\
    \ DOM。在这里，我们可以在净化代码库的过程中逐步学习。这种语言也更容易上手，因为它是混合的，你可以依靠现有的习惯。\n- 该语言完全能够编写顶级的函数式代码。\n\
    \n通过一两个小库的帮助，我们拥有模拟 Scala 或 Haskell 等语言所需的所有功能。面向对象的编程目前主导行业，但在 JavaScript 中显然很笨拙。这就像在高速公路旁露营或穿着高跟鞋跳舞。我们不得不到处处理这种奇怪的行为：没有\
    \ `new` 关键字，私有成员只能通过闭包来实现。无论对我们许多人来说，函数式编程感觉更自然。\n\n尽管如此，函数式语言无疑是按照书中风格编写代码的最佳场所。JavaScript\
    \ 将是我们学习范式的手段，而如何应用它取决于你。幸运的是，接口是数学化的且无处不在的。你发现自己在 Swift、Scalaz、Haskell、PureScript\
    \ 以及其他倾向数学环境中感到自在。\n\n# 在线阅读\n\n为了获得最佳阅读体验，请通过 Gitbook 在线阅读。\n\n- 快速访问侧边\n- 浏览器练习\n\
