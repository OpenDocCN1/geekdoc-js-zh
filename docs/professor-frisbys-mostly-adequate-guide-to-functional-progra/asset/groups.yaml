    It might not seem like a in this example, but this reliance upon state is one
    of the largest contributors to system complexity


    (http://curtclifton.net/papers/MoseleyMarks06a.pdf). checkAge may return different
    results depending on factors external to input, which not only disqualifies it
    from being pure, but puts our minds through the wringer each time we''re reasoning
    about software.


    Its pure form, on the other hand, is completely self sufficient. We can also make
    minimum immutable, which preserves the purity of the state as it will never change.
