    # # Chapter 09: Monadic Onions


    # # Pointy Functor Factory


    Before we go any further, I have a confession to make: I haven''t been fully honest
    about that method we''ve placed on each of our turns. Turns out, it is not to
    avoid the new keyword, but rather to place values in what''s called a default
    minimal context. We see, of does not actually take the place of a constructor
    - it is part of an interface we call Pointed.


    +   A pointed functor is a function with an method


    What''s important here is the ability to drop any value in our type and mapping
    away.


    ```

    IO.of(''tetris'').map(concat('' master''));

    // (''tetris master'')


    Maybe.of(136).map(add(1));

    // Maybe(1337)


    Task.of({id: 2}, {id: 3}).map(prop(''Id''));

    Task(2,3))

    ```


    ```

    Either(The past, present and future walk into a bar...).map(concat(''it was tense''));

    // (The past, present and future walk into a bar... was tense.)

    ```


    If you recall, IO and Task constructors expect a function as their argument, but
    Maybe and Either do not. The motivation for this interface is a common, consistent
    way to place a value into our functor without the complexities and specific demands
    of constructors. The term ''default minimal context'' lacks precision, yet captures
    the idea: we''d like to lift any value in our type and map away with the expected
    behaviour of whichever functor.


    One important correction I must make at this point, is, that Left doesn''t make
    any sense. Each functor must have one way to place a value inside and with Either,
    which has the Right() instead of using Right because we can map, it should map.
    Looking at the examples above, we will have an intuition about how Left will work
    and Left will mold.


    You may have found functions such as pure, point, unit, and return. These are
    various monkers for our method, international function of mystery. They will become
    important when we start using monads because, and as we will, it''s our responsibility
    to place values back into the type manually.


    To avoid the new keyword, there are several standard JavaScript tricks or libraries
    to let them use and like a responsible adult from here on out. I recommend using
    functor instances from folktale, ramda or fantasy-land as they provide the correct
    method as well as nice constructors that don''t rely on new.'
- md: "\n# Mixing Metaphors\n\n![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_71_0.png)\n\
    \nYou see, in addition to space burritos (if you've heard the rumors), monads\
    \ are like onions. Allow me to demonstrate with a common situation:\n\n```javascript\n\
    const fs = require('fs');\n\n// readFile :: String -> IO String\nconst readFile\
    \ = filename => new IO(() => fs.readFileSyncSync(filename, 'utf-8'));\n\n// print\
    \ :: String -> IO String\nconst print = x => new IO(() => {\n  console.log(x);\n\
    \  return x;\n});\n\n// cat :: String -> IO (String)\nconst cat = compose(map(print,\
    \ readFile));\n\ncat('.git/config')\nIO('[core]repositoryformatversion = 0\\n')\n\
    ```\n\nWhat we've got here is an IO trapped inside another because print introduced\
    \ a second IO during our map. To continue working with our string, we must map(map(f))\
    \ and to observe the effect, we must unsafePerformIO().unsafePerformIO().\n\n\
    ```javascript\n// cat :: String -> IO (IO String)\nconst cat = compose(map(print),\
    \ readFile);\n\n// firstChar :: String -> IO (IO String)\nconst firstChar = compose(map(head),\
    \ cat);\n\nfirstChar('.git/config');\n// IO(IO(''))\n```\n\nWhile it is nice that\
    \ we have two effects packaged and ready to go in our application, it feels a\
    \ bit like working in two hazmat suits and we end up with an uncomfortable awkward\
    \ API. Let's look at another situation:\n\n```javascript\n// safeProp :: Key ->\
    \ (Key: a) -> Maybe b\nconst safeProp = curry((x, obj) => Maybe.of(obj[x]));\n\
    \n// safeHead :: [a] -> Maybe a\nconst safeHead = safeProp();\n\n// firstAddress\
    \ :: :: -> Maybe (Maybe (Maybe Street))\nconst firstAddress = compose(\n  map(map('street')),\n\
    \  map(safeHead),\n  safeProp('addresses')\n);\n\nfirstAddress({\n  addresses:\
    \ [{ name: 'Mulberry', number: 8402, postcode: 'WC2CN' }],\n});\n// Maybe(Maybe(Maybe(name:\
    \ 'Mulberry', number: 8402)))}\n```\n\nAgain, we see this nested functor situation\
    \ where it's neat to see there are three possible failures in our function, but\
    \ it's a little presumptuous to expect a caller to map three times to get at the\
    \ value - we only just met. This pattern will arise time and again and it is the\
    \ primary situation where we'll need to shine the mighty symbol into the night\
    \ sky.\n\nI said nomads on onions because tears well up as we peel back each layer\
    \ of the nested functor with map to get the inner value. We can dry our eyes,\
    \ take a deep breath, and use a method called join.\n\n```javascript\nconst mimo\
    \ = Maybe.of(Maybe.of('nunchucks'));\n// Maybe('nunchucks')\nnmimo.join();\n//\
    \ Maybe('nunchucks')\n\nconst iolo = IO.of(IO.of('pizza'));\n// IO(IO('pizza'))\n\
    \nioio.join();\n// IO('pizza')\n\nconst ttt = Task.of(Task.of(Task.of('sewers')));\n\
    // Task(Task(Task('sewers')))\n\nttt.join();\n// Task(Task(Task('sewers')))\n\
    ```\n\nIf we have two layers of the same type, we can smash them together with\
    \ join. This ability to join together, this functor matrimony, is what makes a\
    \ monad monad. Let's inch towards the full definition with something a little\
    \ more accurate:\n\n- Monads are pointed functors that can flatten\n\nAny function\
    \ that has a join method, has an of method, and obeys a few laws is a monad. Defining\
    \ join is not too difficult so let's do so for Maybe:\n\n```javascript\nMaybe.prototype.join\
    \ = function() {\n  return this.isNothing(null) : Maybe(this.$value);\n};\n```\n\
    \nThere, simply consuming one's twin in the womb. If we have a Maybe(Maybe(x))\
    \ then will just remove the unnecessary extra layer and we can safely map from\
    \ there. Otherwise, we'll have the one Maybe as nothing would have been mapped\
    \ in the first place.\n\nNow that we have a join method, let's sprinkle some magic\
    \ dust over the firstAddress example and see it in action:\n\n```javascript\n\
    // join : Monad m => m (a) -> m a\nconst join = ma => ma.join();\n\n// firstAddress\
    \ :: User -> Street\nconst firstAddress = compose(\n  join,\n  map(safeProp('street')),\n\
    \  join,\n  map(safeHead, safeProp('addresses'))\n);\n\nfirstAddress({\n  addresses:\
    \ [{ name: 'Mulberry', number: 8402, postcode: 'WC2N' }],\n}); // Maybe(name:\
    \ 'Mulberry', number: 8402)\n```\n\nWe added join wherever we encountered the\
    \ nested Maybe's to keep them from getting out of hand. Let's do the same with\
    \ map to give us a feel for that.\n\n```javascript\nIO.prototype.join = () =>\
    \ this.unsafePerformIO();\n```\n\nAgain, simply remove one layer. Mind you, we\
    \ have thrown out purity, but merely removed layer of excess.\n\n```javascript\n\
    // log :: a -> IO\nconst log = x => new IO(() => {\n  console.log(x);\n  return\
    \ x;\n});\n```\n\n```javascript\n// setStyle :: Selector -> props -> DOM\nconst\
    \ setStyle = (sel, props) => new IO(() => {\n  return sel.css(props);\n});\n```\n\
    \n```javascript\n// getitem :: String -> IO String\nconst getitem = key => new\
    \ IO(() => localStorage.getItem(key));\n```\n\n```javascript\n// applyPreferences\
    \ :: String -> IO DOM\nconst applyPreferences = compose(\n  join,\n  map(setStyle('#main')),\n\
    \  join,\n  map(log),\n  getitem\n);\n\n# My Chain\n\n![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_74_0.png)\n\
    \nYou might have noticed a pattern calling join right after map. Let's abstract\
    \ this into a function called chain.\n\n```javascript\n// chain :: Monad m =>\
    \ (a -> b) -> m a -> b\nconst chain = curry((f, m) => m.map(f).join());\n// or\n\
    // chain :: Monad m => (a -> b) -> m a -> b\nconst chain = f => compose(join,\
    \ map(f));\n```\n\nWe'll just baffle this map/join combo into a single function.\
    \ If you've read about monads previously, you might have seen chain (bind) or\
    \ flatMap which are all aliases for the same concept. I personally think flatMap\
    \ is the most accurate, but we'll stick with chain as it's the widely accepted\
    \ name in JS. Let's refactor the examples above with chain:\n\n```javascript\n\
    // map/join\nconst firstAddressStreet = compose(\n  join,\n  map(safeProp('street')),\n\
    \  join,\n  safeHead,\n  safeProp('addresses'),\n);\n\n// chain\nconst firstAddressStreet\
    \ = compose(\n  chain(safeProp('street')),\n  chain(safeHead),\n  safeProp('addresses'),\n\
    );\n\n// map/join\nconst applyPreferences = compose(\n  join,\n  map(setStyle('#main')),\n\
    \  join,\n  map(log),\n  chain(JSON.parse),\n  getitem,\n);\n\n// chain\nconst\
    \ applyPreferences = compose(\n  chain(setStyle('#main')),\n  chain(log),\n  map(JSON.parse),\n\
    \  getitem,\n);\n```\n\nI swapped out any map/join with our new chain function\
    \ to tidy up a bit. Cleanliness is nice and all, but there's more to chain than\
    \ meets the eye - it's more of a tornado than a vacuum. Because chain effortlessly\
    \ nests effects, we can capture both sequence and variable assignment in a purely\
    \ functional way.\n\n```javascript\n// getJSON: Url -> Params -> Task JSON\ngetJSON('/authenticate',\
    \ { username: 'stale', password: 'crackers' })\n  .chain(user => getJSON('/friends',\
    \ { user_id: user.id }))\n  .task((id => match({id: 14, name: 'Ric', id: 39})));\n\
    \n// querySelector: Selector -> DOM\nquerySelector('input.name')\n  .chain((value:\
    \ name) => \n    querySelector('input.email')\n      .chain((value: email) =>\
    \ `Welcome ${name} for spam at ${email}`)\n\n// ID('Welcome Olivia prere own for\
    \ spam at oliviatremontrol.net');\n\nMaybe.of()\n  .chain(three => Maybe.of(three).map(three))\n\
    \  .map(5);\n\nMaybe.of(null)\n  .chain(safeProp('address'))\n  .chain(safeProp('street'))\n\
    \  .map(null);\n```\n\nWe have written these examples with compose, but we'd need\
    \ a few helper functions and this style lends itself to explicit assignment via\
    \ closure. Anyway we use the infix version of chain, which can be derived from\
    \ map and join for any type automatic update: t.prototype.chain = function(f)\
    \ { return this.map(f).join(); }; We can also define chain manually if we'd like\
    \ a false sense of performance, then we must take care to maintain the correct\
    \ functionality - that is, it must map for we've created chain simply by bottling\
    \ the value back up when we're finished with of. With chain, we can also define\
    \ join as chain(id). It may feel like playing Texas Hold em with a rhinestone\
    \ magician that I'm just putting things out of my behind, but as with most mathematics,\
    \ all of these principles are interrelated. Lots of these derivatives are mentioned\
    \ in the fansyland repo, which is the official specification for algebraic data\
    \ types in JavaScript.\n\nAnyways, let's get to the examples above. In the first\
    \ example, we see two Task in a sequence of asynchronous actions - it retrieves\
    \ the user, then finds the friends with user's id. We use chain to avoid a Task({{friend}})\
    \ situation.\n\nNext, we use querySelector to find a few inputs and a welcoming\
    \ message. Notice how we have access to both username and email at the innermost\
    \ function - this is functional assignment at its finest. Since IO is graciously\
    \ letting us value, we are in charge of putting it back how we found it - we wouldn't\
    \ want to break its trust (and our program). IO.of is the perfect tool for the\
    \ job and it's why Pointed is an important prerequisite to the Monad interface.\
    \ However, we could choose to map as that would also return the correct:\n"
  mdcn: "\n\n# 隐喻的混合\n\n![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_71_0.png)\n\n你会发现，除了空间卷饼（如果你听过那些传言的话），单ad（monads）就像洋葱。允许我通过一个常见的情况来演示：\n\
    \n```javascript\nconst fs = require('fs');\n\n// readFile :: String -> IO String\n\
    const readFile = filename => new IO(() => fs.readFileSyncSync(filename, 'utf-8'));\n\
    \n// print :: String -> IO String\nconst print = x => new IO(() => {\n  console.log(x);\n\
    \  return x;\n});\n\n// cat :: String -> IO (String)\nconst cat = compose(map(print,\
    \ readFile));\n\ncat('.git/config')\nIO('[core]repositoryformatversion = 0\\n')\n\
    ```\n\n我们在这里得到的是嵌套在另一个内部的 IO，因为 print 在我们的 map 引入了第二个 IO。为了继续处理我们的字符串，我们必须使用 `map(map(f))`，为了观察效果，我们必须使用\
    \ `unsafePerformIO()`。\n\n```javascript\n// cat :: String -> IO (IO String)\n\
    const cat = compose(map(print), readFile);\n\n// firstChar :: String -> IO (IO\
    \ String)\nconst firstChar = compose(map(head), cat);\n\nfirstChar('.git/config');\n\
    // IO(IO(''))\n```\n\n虽然有两个效果被封装并准备好在我们的应用程序中使用很不错，但感觉有点像穿着两套防化服工作，最终我们得到了一个不舒服且笨拙的\
    \ API。让我们看看另一个情况：\n\n```javascript\n// safeProp :: Key -> (Key: a) -> Maybe b\n\
    const safeProp = curry((x, obj) => Maybe.of(obj[x]));\n\n// safeHead :: [a] ->\
    \ Maybe a\nconst safeHead = safeProp();\n\n// firstAddress :: :: -> Maybe (Maybe\
    \ (Maybe Street))\nconst firstAddress = compose(\n  map(map('street')),\n  map(safeHead),\n\
    \  safeProp('addresses')\n);\n\nfirstAddress({\n  addresses: [{ name: 'Mulberry',\
    \ number: 8402, postcode: 'WC2CN' }],\n});\n// Maybe(Maybe(Maybe(name: 'Mulberry',\
    \ number: 8402)))}\n```\n\n我们再次看到了这种嵌套的函子（functor）情况，虽然看到函数中有三种可能的失败情况很整洁，但期望调用者\
    \ map 三次来获取值有点太自以为是了——我们才刚见面。这种模式会一次又一次出现，它是我们需要将那强大的符号投向午黑夜空的主要场景。\n\n我提到洋葱上的游牧者是因为当我们用\
    \ map 剥开嵌套函子的每一层以获取内部值时，泪水会流而出。我们可以擦干眼睛，深呼吸，并使用名为 `join` 的方法。\n\n```javascript\n\
    const mimo = Maybe.of(Maybe.of('nunchucks'));\n// Maybe('nunchucks')\nnmimo.join();\n\
    // Maybe('nunchucks')\n\nconst iolo = IO.of(IO.of('pizza'));\n// IO(IO('pizza'))\n\
    \nioio.join();\n// IO('pizza')\n\nconst ttt = Task.of(Task.of(Task.of('sewers')));\n\
    // Task(Task(Task('sewers')))\n\nttt.join();\n// Task(Task(Task('sewers')))\n\
    ```\n\n如果我们有两个相同类型的层，我们可以用 `join` 将它们粉碎在一起。这种合并的能力，这种函子的联姻（functor matrimony），正是\
    \ monad 成为 monad 的原因。让我们用更准确一点的东西逐步接近完整定义：\n\n- Monads 是可以展平的带点函子（pointed functors）\n\
    \n任何拥有 `join` 方法、`of` 方法并遵循几条法则函数都是 monad。定义 `join` 并不困难，所以让我们为 `Maybe` 这样做：\n\
    \n```javascript\nMaybe.prototype.join = function() {\n  return this.isNothing()\
    \ : this.$value;\n};\n```\n\n在这里，仅仅消耗了双胞胎层。如果我们有 `Maybe(Maybe(x))`，它将只是移除多余的一层，我们可以安全地进行\
    \ map。否则，它在第一个地方就会被 map 了。现在我们有了 `join` 方法，让我们在 `firstAddress` 示例上撒一点魔法粉看看：\n\n\
    ```javascript\n// join : Monad m => m (a) -> a\nconst join = ma => ma.join();\n\
    \n// firstAddress :: User -> Street\nconst firstAddress = compose(\n  join,\n\
    \  map(safeProp('street')),\n  join,\n  map(safeHead, safeProp('addresses'))\n\
    );\n\nfirstAddress({\n  addresses: [{ name: 'Mulberry', number: 8402, postcode:\
    \ 'WC2CN' }],\n}); // Maybe(name: 'Mulberry', number: 8402)\n```\n\n我用新的 `chain`\
    \ 函数替换了任何 `map/join` 以整理一下。整洁固然很好，但 `chain` 的意义比看到的要多——它更像是一个龙旋风而不是真空。因为 `chain`\
    \ 可以轻松地嵌套效果，我们可以用纯函数的方式捕捉序列和变量赋值。\n\n```javascript\n// getJSON: Url -> Params\
    \ -> Task JSON\ngetJSON('/authenticate', { username: 'stale', password: 'crackers'\
    \ })\n  .chain(user => getJSON('/friends', { user_id: user.id }))\n  .task((id\
    \ => match({id: 14, name: 'Ric', id: 39})));\n\n// querySelector: Selector ->\
    \ DOM\nquerySelector('input.name')\n  .chain((value: name) => \n    querySelector('input.email')\n\
    \      .chain((value: email) => `Welcome ${name} for spam at ${email}`))\n\n//\
    \ ID('Welcome Olivia prere own for spam at oliviatremontrol.net');\n\nMaybe.of()\n\
    \  .chain(three => Maybe.of(three).map(three))\n  .map(5);\n\nMaybe.of(null)\n\
    \  .chain(safeProp('address'))\n  .chain(safeProp('street'))\n  .map(null);\n\
    ```\n\n我们用 `compose` 写了这些示例，但我们需要一些辅助函数，而且这种风格有利于通过闭包进行显式赋值。无论，我们使用 `chain` 的中缀版本，它可以从\
    \ `map` 和 `join` 推导出以自动更新任何类型：`t.prototype.chain = function(f) { return this.map(f).join();\
    \ };`。如果我们想要一种虚假的性能感，也可以手动定义 `chain`，但我们必须小心维护正确的功能——即它必须 map，因为我们通过在完成 `of` 时将值重新装起来来创建\
    \ `chain`。\n\n### 我的 Chain\n\n![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_74_0.png)\n\
    \n你可能注意到在 `map` 之后调用 `join` 的模式。让我们把这抽象为一个名为 `chain` 的函数。\n\n```javascript\n//\
    \ chain :: Monad m => (a -> b) -> m -> b\nconst chain = curry((f, m) => m.map(f).join());\n\
    // or\n// chain :: Monad m => (a -> b) -> m -> b\nconst chain = f => compose(join,\
    \ map(f));\n```\n\n我们将把这种 `map/join` 组合合并成一个函数。如果你以前读过 monads，你可能见过 `chain (bind)`\
