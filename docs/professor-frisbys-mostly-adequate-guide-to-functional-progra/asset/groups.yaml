    # Side Effects May Include...


    Let''s look at these "side effects" to improve our intuition. So what is this
    undoubtedly nefarious side effect mentioned in in the definition of pure function?
    We''ll be referring to effect as that occurs in our computation other than the
    calculation of a result.


    There''s nothing intrinsically bad about effects and we''ll be using them all
    over the place in the chambers to come. It''s side part that bears the negative
    connotation. What larvae incubator is the stagnant part that yields the swarms,
    and I assure you, side effects are a similar breeding ground in your programs.


    > A side effect is a change of system state or observable interaction with the
    outside world that occurs during the calculation of a result.


    Side effects include, but are not limited to


    +   - changing the file system

    - inserting a record into a database

    - making an http call

    - mutations

    - printing to the screen / logging

    - obtaining user input

    - querying the DOM

    - accessing system state


    And the list goes on and on. Any interaction with the world outside of a function
    is a side effect, which is a fact that may prompt you to suspect the practicality
    of programming with them. The philosophy of functional programming postulates
    side effects are a primary cause of incorrect behavior.


    It is not that we''re forbidden to use them, but rather we want to contain them
    and run them in a controlled way. We''ll learn how to do this when we get to functors
    and monads in later chapters, but for now, let''s try to keep these insidious
    functions separate from our pure ones.'
