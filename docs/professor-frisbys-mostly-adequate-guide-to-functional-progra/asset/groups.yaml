    - unsafePerformIO 1.16.28, 29\n\n# Professor Frisby’s Mostly Adequate Guide to\
    \ Functional Programming\n\n(img/5_0.png)\n\n# About this book\n\nThis is a book\
    \ on the functional paradigm in general. We'll use the world's most popular programming\
    \ language: JavaScript. Some may feel this is a poor choice as it's against the\
    \ grain of the culture which, at the moment, feels predominantly imperative. However,\
    \ I believe it is the best way to learn FP for several reasons:\n\n- You like\
    \ it every day at work.\n- This makes it possible to practice and apply your acquired\
    \ knowledge each day on real world programs than pet projects on nights and weekends.\n\
    - We don't have to learn everything up front to start writing programs. In a pure\
    \ functional language, you cannot log a variable or read a DOM without monads.\
    \ Here we can catch a little as we learn to purify our codebase. It's also easier\
    \ to get started in this language since it's mixed and you can fall back on your\
    \ current practices.\n- The language is fully capable of writing top notch functional\
    \ code.\n\nWe have all the features we need to mimic a language like Scala or\
    \ Haskell with the help of a tiny library or two. Object-oriented programming\
    \ currently dominates the industry, but it's clearly awkward in JavaScript. It's\
    \ akin to camping off a highway or dancing in galos. We have to bind all over\
    \ the place this quirky behavior when the new keyword, private members are only\
    \ available via closures. To a lot of us, FP feels more natural anyways.\n\nThat\
    \ said, functional languages will, without doubt, the best place to code in the\
    \ style presented by this book. JavaScript will be our means of learning a paradigm,\
    \ where you apply it is up to you. Luckily, the interfaces are mathematical and\
    \ ubiquitous. You'll find yourself at home with Swift, Scalaz, Haskell, PureScript,\
    \ and other mathematically inclined environments.\n\n# Read it Online\n\nFor a\
    \ best reading experience, read it online via Gitbook.\n\n- Quick-access side-bar\n\
    - In-browser exercises\n- In-depth examples\n\n# Play Around with Code\n\nTo make\
    \ the training efficient and not get bored while I am telling you another story,\
    \ make sure to play around with the concepts introduced in this book. Some can\
    \ be tricky to catch at first and better understood by getting your hands dirty.\
    \ All functions and algebraic data structures presented in the book are gathered\
    \ in the appendices. The corresponding code is also available as an npm module:\n\
    \n```\n$ npm i @most-adequate/support\n```\n\nAlternatively, exercises of each\
    \ chapter are runnable and can be completed in your editor! For example, complete\
    \ the exercise_*.js in exercises/ch0 and then run:\n\n```\n$ npm run ch04\n```\n\
    \n# Download it\n\nFind pre-generated PDF and EPUB as build artifacts of the latest\
    \ release.\n\n# Do it yourself\n\n⚠️ This setup project is now a bit old and thin,\
    \ you may run into various issues when building this locally. We recommend using\
    \ node v10.22.1 and the latest version of Calibre if possible.\n\n```\ngit clone\
    \ https://github.com/MostlyAdequate/mostly-adequate-guide.git\ncd mostly-adequate-guide/\n\
    npm install\nnpm run setup\nnpm run generate-pdf\nnpm run generate-epub\n```\n\
    \nNote! To generate the ebook version you will need to install `ebook-convert`.\n\
    \nInstallation instructions.\n\n# Table of Contents\n\nSee SUMMARY.md\n\n# Contributing\n\
    \nSee CONTRIBUTING.md\n\n# Translations\n\nSee TRANSLATIONS.md\n\n# FAQ\n\nSee\
    \ FAQ.md\n\n# Plans for the future\n\n- **Part 1** (chapters 1-7) is a guide to\
    \ the basics. Feel free to help!\n- **Part 2** (chapters 8-13) address type classes.\
    \ I hope this is the initial draft.\n- **Part 3** (chapters 14+) will start to\
    \ dance the line.\n\n(img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_7.png)\n\nThis work\
