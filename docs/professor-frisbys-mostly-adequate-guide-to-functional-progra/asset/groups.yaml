    You might have noticed a pattern. We often end calling join right after a map.

    Let''s abstract this into a function called chain.


    ```

    // chain :: Monad m => (a -> m b) -> m a -> m b

    const chain = curry((f, m) => m.map(f).join);

    // or

    // chain :: Monad m => (a -> m b) -> m a -> m b

    const chain = f => compose(join, map(f));

    ```


    We''ll just baffle this map/join combo into a single function. If you''ve read
    about monads previously, you might have seen chain === (pronounced bind) or flatMap
    which are all aliases for the same concept. I personally think flatMap is the
    most accurate, but we''ll stick with chain as it''s the widely accepted name in
    JS. Let''s refactor the two examples above with chain:


    ```

    // map/join

    const firstAddressStreet = compose(

    join,

    map(safeProp(''street'')),

    join,

    safe(Head),

    safeProp(''addresses''),

    );


    // chain

    const firstAddressStreet = compose(

    chain(safeProp(''street'')),

    chain(safeHead),

    safeProp(''addresses''),

    );


    // map/join

    const applyPreferences = compose(

    join,

    map(setStyle(''#main'')),

    join,

    map(log),

    chain(JSON.parse),

    getItem,

    );


    // chain

    const applyPreferences = compose(

    chain(setStyle(''#main'')),

    chain(log),

    map(JSON.parse),

    getItem,

    );

    ```


    I swapped out any map/join with our new chain function to tidy up a bit.

    Cleanliness is nice and all, but there''s more to chain than meets the eye - it''s\more
    of a tornado than a vacuum. Because chain effortlessly nests effects, we can capture
    both sequence and variable assignment in a purely functional way.'
