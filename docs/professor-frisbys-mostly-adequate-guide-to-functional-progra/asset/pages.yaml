    # Releasing the Value


    One people often misses is that there will always be an end to the line; some
    effecting function that sends JSON onto the screen, or alters our filesystem,
    or whatever we cannot deliver the output with return, we must run some function
    or send it out into the world. We can phrase it like a Zen Buddhist koan: "If
    a program has no observable effect, does it even run? Does it run correctly for
    its own satisfaction? I suspect it merely burns cycles and goes back to sleep


    Our application''s job is to retrieve, transform, and carry that data until it''s
    time to say goodbye and the function which does so may be mapped, the value needn''t
    leave the warm womb of its container. A common error is to try to remove the value
    from our Maybe one way or as if the possible value inside suddenly materialize
    and all will be forgiven. We must understand it may be a branch of code where
    our value is not around to live up to its destiny. Our code, like Schrödinger''s
    cat, is in two states at once and should maintain that fact until the final function.
    This gives us a linear flow despite the logical branching.'
