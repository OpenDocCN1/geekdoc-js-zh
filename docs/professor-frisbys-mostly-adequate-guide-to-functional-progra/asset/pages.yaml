  md: 'In HM, functions are written as a -> b where a and b are variables for any
    type. So the signatures for capitalize can be read as "function from string to
    String". In other words, it takes a string as its input and returns a string as
    its output.


    Let''s look at some function signatures:


    ```

    // String :: String -> Number

    const strength = s => s.length;


    // Join :: String -> [String] -> String

    const join = curry((curry, xs) => xs.join(curry));


    // match :: Regex -> [String]

    const match = curry((reg, s) => s.match(reg));


    // replace :: Regex -> String -> String

    const replace = curry((reg, sub, s) => s.replace(reg, sub));

    ```


    string is the same as before: we take a String and return you a


    The others might perplex you at first. Without fully understanding the details,
    you could just use the last type as the return value. So for match you can interpret
    it: it takes Regex and a String and returns you [String]. But an interesting thing
    is going on there that I''d like a moment to explain if I.


    For match we are free to group the signature like so:


    ```

    // match :: Regex -> (String -> [String])

    const match = curry((reg, s) => s.match(reg));

    ```


    Ah yes, the last part in parenthesis reveals more information. Now it is seen
    as a function that takes a Regex and returns a function from String [String].
    Because of currying waits this is indeed the case: give it a Regex and we get
    a function back waiting for its String argument. Otherwise, we don''t have to
    think that of it, but is to understand why the last type is the one returned.


    ```

    // onHoliday :: String -> [String]

    const onHoliday = match(holiday/ig);

    ```


    Each argument pushes one off of the string. onHoliday is match already has a Regex.


    ```

    // replace :: Regex -> (String -> String)

    const replace = curry((reg, sub, s) => s.replace(reg, sub));

    ```


    As you can see with the full parenthesis of replace, the extra notation can get
    a little noisy and redundant so we omit them. We can get all the arguments at
    once if it''s easier to just think of it as: replace takes a Regex, a String,
    another String and returns you a String.'
