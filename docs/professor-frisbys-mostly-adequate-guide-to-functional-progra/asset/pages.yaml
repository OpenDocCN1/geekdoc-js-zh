  md: 'It may come as a surprise to hear that we can write full, everyday applications
    along the lines of the functional analog above. Programs that have sound properties.
    Programs that are terse, yet easy to reason about. Programs that don''t reinvent
    the wheel at every turn. Lawlessness is good if you''re a criminal, but in this
    book, we''ll want to acknowledge and obey the laws of math.


    We''ll want to use a theory where every piece lends to fit together so politely.
    We''ll want to represent our specific problem in terms of generic, composable
    bits and then exploit their properties for our own selfish benefit. It will take
    a bit more discipline than the precise definition of "imperative" approach of
    imperative programming (we''ll go over the precise definition of "imperative"
    later in the book, but for now consider it anything other than functional programming).
    The payoff of working within a principled, mathematical framework will truly astound
    you.


    We''ve seen a flicker of our functional star, but there are a few concrete concepts
    to grasp before we can reaily begin our journey.


