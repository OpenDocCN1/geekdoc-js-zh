  md: "![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_87_0.png)\n\nWe haven't spoken much\
    \ about derived functions. Seeing as all of these interfaces are built off of\
    \ each other and obey a set of laws, we can define some weaker interfaces in the\
    \ stronger ones.\n\nFor instance, we know that an applicative is first a functor,\
    \ so if we have an applicative instance, surely we can define a functor for our\
    \ type.\n\nThis kind of perfect harmony is possible because we are working within\
    \ a mathematical framework. Mozart couldn't have done better even if he had torrented\
    \ Ableton as a child.\n\nI mentioned earlier that `of/ap` is equivalent to `map`.\
    \ We can use this knowledge to define `map` for free.\n\n```\n// map derived from\
    \ of/ap\nX.prototype.map = function map(f) {\n  return this.constructor.of(ap(this));\n\
    }\n```\n\nMonads are at the top of the food chain, so to speak, if we have `chain`,\
    \ we get functor and applicative for free.\n\n```\n// map derived from chain\n\
    X.prototype.map = function map(f) {\n  return this.chain(a => this.constructor.of(f(a)));\n\
    }\n```\n\n```\n// ap derived from chain/map\nX.prototype.ap = function ap(other)\
