  md: "If we have two layers of the same type, we can smash them together with join.\
    \ This ability to join together, this functor matrimony, is what makes a monad\
    \ monad. Let's inch towards the full definition with something a little more accurate:\n\
    \n+   - Monads are pointed functors that can flatten\n\nAny function that has\
    \ a join method, has an of method, and obeys a few laws is a monad. Defining join\
    \ is not too difficult so let's do so for Maybe:\n\n```\nMaybe.prototype.join\
    \ = function() {\n  return this.isNothing(null) : Maybe(this.$value);\n};\n```\n\
    \nThere, simply consuming one's twin in the womb. If we have a Maybe(Maybe(x))\
    \ then will just remove the unnecessary extra layer and we can safely map from\
