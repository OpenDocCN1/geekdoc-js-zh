  md: '```

    match(/r/g, ''hello world''); // [ ''r'']


    const hasietterR = match(/r/g); // x => x.match(/r/g)

    hasietterR(''hello world''); // [ ''r'']

    hasietterR(''just j and s and t etc''); // null


    filter(hasietterR, [''rock and roll'']); //


    const removeStringsWithoutRs = filter(hasietterR); // xs => xs.filter(x => x.match(/r/g))

    removeStringsWithoutRs([''rock and roll'', ''smooth jazz'', ''drum circle'']);


    const noVowels = replace([aeiou]/g, r => x.replace([aeiou]/ig, ''''));

    const censored = noVowels(); // x => x.replace([aeiou]/ig, '''')

    censored(''Chocolate Rain''); // ''Chocolat Rain''

    ```


    What''s demonstrated here is the ability to "pre-load" with an argument or two
    in order to receive a new function that remembers those arguments.


    I encourage you to clone the Mostly Adequate repository (git clone https://github.com/MostlyAdequate/mostly-adequate-guide.git),
    copy the code above and have a go at it in the REPL. The curry function, as well
    as anything in the appendices, are available in the support/index.js module.


    Alternatively, have a look at a published version on npm:


    ```

    npm install @mostly-adequate/support

    ```


    # More Than a Pun / Special Sauce


    Currying is useful for many things. We can make new functions just by giving over
    our base functions like hasietterR, removeStringsWithoutRs, and censored.


    We also have the ability to transform any function that works on single elements
    into a function that works on arrays by wrapping it with map:


    ```

    const getChildren = x => x.childNodes;

    const allChildren = map(getChildren);

    ```


    Giving a function fewer arguments than it is typically called partial application.
    Applying a function can remove a lot of boilerplate code. Consider what the above
    allChildren function would be with the uncurried map from lodash (note the arguments
    are in a different order):


    ```

    const allChildren = elements => map(elements, getChildren);

    ```


    We typically define functions that work on arrays, because we can just call map(getChildren)
    inline. With with sort, filter, and other higher order functions (a higher order
    function is a function that takes or returns a function).'
