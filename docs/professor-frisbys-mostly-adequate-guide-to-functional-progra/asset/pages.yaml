  md: '# Testable


    Next, we come to realize pure functions testing much easier. We don''t have to
    mock a "real" gateway or setup and assert the state of the world after each test.


    In fact, we find the functional community pioneering new tools that can blast
    our functions with generated input and assert that properties hold the output.
    It''s beyond the scope of this book, but I strongly encourage you to search for
    and try Quickcheck - a testing tool that is tailored for a purely functional environment.


    # Reasonable


    Many believe the geist win when using pure functions is referential transparency.
    A spot of code is referentially transparent when it can be substituted for its
    evaluated value without changing the behavior of the program.


    Since pure functions have no side effects, they can only influence the behavior
    of a program through their output values. Furthermore, since their output values
    can be reliably calculated using only their input values, pure functions will
    always preserve referential transparency. Let''s see an example.


    ```

    const { Map } = require(''immutable'');

    Aliases: const p = player, a = attacker, t = target

    const job = Map({ name: ''Job'', hp: 20, team: ''red'' });

    const michael = Map({ name: ''Michael'', hp: 19, team: ''green'' });

    const decrementHP = (p) => p.set(''team'', p.get(''team'') - 3);

    const isTeam = (p1, p2) => p1.get(''team'') === p2.get(''team'');

    const punch = (a, t) => isTeam(a, t) ? t : decrementHP(t);


    punch(job, michael); // Map(name: ''Michael'', hp: 19, team: ''green'')

    ```


    decrementHP, isTeam and punch are all pure and therefore referentially transparent.
    We can use a technique called equational reasoning which substitutes "equals"
    for equals to abound code. It''s a bit like manually evaluating the code without
    taking into account the quirks of functional evaluation. Using referential transparency,
    let''s play with this code bit.


    We first inline the isTeam.


    ```

    const punch = (a, t) => (a.get(''team'') === ''green'') ? t : decrementHP(t));

    ```


    Since our data is immutable, we can replace the teams with their actual value


    ```

    const punch = (a, t) => (''red'' === ''green'') ? t : decrementHP(t));

    ```


    We see that it is false in this case we can remove the branch


    ```

    const punch = (a, t) => decrementHP(t);

    ```'
