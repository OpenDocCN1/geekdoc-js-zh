  md: 'Identity.of(id) makes chuckle at its futility. Anyway, what''s interesting
    is that,

    aswe''ve already established, of/ap is the same as the map so this law follows

    directly from functor identity: map(id) == id.


    The beauty in using these laws is that, like a militant kindergarten gym coach,

    force all of our interfaces to play well together.


    # Homomorphism


    ```

    // homomorphism

    A.of(ap)(A.of(x)) === A.of(f(x));

    ```


    A homomorphism is just a structure preserving mapping. In fact, a functor is just
    a

    homomorphism between categories as it preserves the original category''s

    structure under the mapping.


    We''re really justing our normal functions and values into a container and

    running the computation in there so it should come as no surprise we will end

    up the same result if we apply the whole thing inside the container (left side

    of the equation) or outside it, place it in there (right side).


    A quick example:


    ```

    Either.of(toUpperCase).ap(Either.of(''oros'')) === Either.of(toUpperCase(''oros''));

    ```


    # Interchange


    The interchange laws states that it doesn''t matter if we choose to lift our function

    into the left or right side of ap .


    ```

    // interchange

    v.ap(A.of(x)) === A.of(f => f(x)).ap(v);

    ```


    Here is an example:


    ```

    const v = Task.of(reverse);

    const x = ''Sparklehorse'';

    v.ap(Task.of(x)) === Task.of(f => f(x)).ap(v);

    ```


    # Composition


    And finally composition which is just a way to check that our standard function

    composition holds when applying inside of containers.


    ```

    // composition

    A.of(compose).ap(u).ap(v).ap(w) === u.ap(v.ap(w));

    ```'
