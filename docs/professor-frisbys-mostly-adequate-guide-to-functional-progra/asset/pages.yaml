  md: "# Ships in Bottles\n\n![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_83_0.png)\n\n\
    ap is a function that can apply the function contents of one functor to the value\
    \ contents of another. Say five times fast.\n\n```\nContainer.of(add()).ap(Container.of());\n\
    // Container(5)\n\n// all together now\n\nContainer.of($).map(add).ap(Container.of($));\n\
    // Container(5)\n```\n\nWe are nice and neat. Good news for Container(3) as it's\
    \ been free from the jail of the nested monadic function. It's worth mentioning\
    \ that add , in this case, gets partially applied during the first map so this\
    \ only works when add is curved.\n\nWe define ap like so:\n\n```\nContainer.prototype.ap\
    \ = function(otherContainer) {\n  return otherContainer.map(this.$value);\n};\n\
    ```\n\nRemember, this.$value will be a function and we'll be accepting another\
    \ functor so we need only map. And with that we have our interface definition:\n\
    \n> An applic functor is a pointed function with an ap method\n\nNote the dependence\
    \ on pointed. The pointed interface is crucial as we'll see throughout these examples.\n\
    \nNow, I sense your skepticism (or perhaps confusion and horror), but keep an\
    \ open mind; this ap character will prove useful. Before we get into it, let's\
    \ explore a nice property."
