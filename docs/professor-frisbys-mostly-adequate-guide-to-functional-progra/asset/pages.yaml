  md: "# # Chapter 06: Example Application\n\n# ## Declarative Coding\n\nWe are going\
    \ to switch our mindset. From here on, we'll stop telling the computer how to\
    \ do its job and instead write a specification of what we'd like as a result.\
    \ I'm sure you'll find it much less stressful than trying to micromanage everything\
    \ the time.\n\nDeclarative, as opposed to imperative, means that we will write\
    \ expressions, as opposed to step instructions.\n\nThink of SQL. There is no \"\
    first do this, then do that\". There is one expression that specifies what we'd\
    \ like from the database. We don't decide how to do the work, does when the database\
    \ is upgraded and the SQL engine optimized, we don't have to change our query.\
    \ This is because there are many ways to interpret our specification and achieve\
    \ the same result.\n\nFor some people, included, it's hard to grasp the concept\
    \ of declarative coding at first let's point out a few examples to get a feel\
    \ for it.\n\n```\n// imperative\nconst makes = [];\nfor (let i = 0; i < cars.length;\
    \ i += 1) {\n  makes.push(cars[i].make);\n}\n\n// declarative\nconst makes = cars.map(car\
    \ => car.make);\n```\n\nThe loop must first initialize the array. The interpreter\
    \ must evaluate this statement before moving on. It directly iterates through\
    \ the list of cars, manually increasing a counter and showing its bits and pieces\
    \ to us in a vulgar display of explicit iteration.\n\nThe map version is one expression.\
    \ It does not require any order of evaluation. There is much freedom for how the\
    \ map function iterates and how the returned array may be assembled. It specifies\
    \ what, not how. Thus, it wears the shiny declarative coat.\n\nIn addition to\
    \ be clearer and more concise, the map function may be optimized at all and our\
    \ precious application code needn't change.\n\nFor those of you who are thinking\
    \ \"Yes, but it's much faster do the imperative loop\", I suggest you yourself\
    \ on how the JIT optimizes your code. Here's a terrific video that may shed some\
    \ light\n\nHere is another example."
