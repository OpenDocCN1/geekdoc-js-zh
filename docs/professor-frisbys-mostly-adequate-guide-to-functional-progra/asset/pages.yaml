  md: '# Chapter 05: Coding by Composing


    # Functional Husbandry


    Here''s compose :


    ```

    const compose = (..fns) => (..args) => fns.reduceRight((res, fn) => [fn.call(null,

    ```


    Don''t be scared! This is the level-9000-super-Saiyan-form of compose. For the
    sake of reasoning, let''s drop the variadic implementation and consider a simpler
    form that can compose two functions. Once you get your head around you can push
    the abstraction further and consider it simply works for any number of functions
    (we could even prove that!) Here''s a more friendly compose for your readers:


    ```

    const compose = (f, g) => x => f(g(x));

    ```


    f and g are functions and x is the value being "piped" through them.


    Composition feels like function husbandry. You, breeder of functions, select two
    with traits you''d like to combine and match them to spawn a brand new one. One
    usage is:


    ```

    const toUpperCase = x => x.toUpperCase();

    const exclaim = x => x;

    const shout = compose(exclaim, toUpperCase);

    ```


    ```

    shout(send in the clowns); // "SEND IN THE CLOWNS!"

    ```


    The composition of two functions returns a new function. This makes perfect sense:
    composing two units of some type (in this case function) should yield a new unit
    of that type. You don''t plug logs together and get a lincoln log. There is a
    theory there, some underlying law that we will discover in time.


    In definition of compose, the g will run before f, creating a right to left flow
    of data. This is much more readable than nesting a bunch of function calls. Without
    compose, the answer would be:


    ```

    const shout = x => exclaim(toUpperCase(x));

    ```


    Instead of inside to outside, we run right to left, which I suppose is a step
    in the left direction (bool!). Let''s look at an example where sequence matters:'
