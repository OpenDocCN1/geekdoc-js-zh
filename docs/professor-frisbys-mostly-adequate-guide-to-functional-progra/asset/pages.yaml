    \ self contained. Everything the function needs is handed to it on a silver platter.\
    \ Ponder this for a moment... How might this be beneficial? For starters, a function's\
    \ dependencies are explicit and therefore easier to understand and - no funny\
    \ business going under the hood.\n\n```\n// impure\nconst signup = (attrs) =>\
    \ {\n  const user = saveUser(attrs);\n  welcomeUser(user);\n};\n\n// pure\nconst\
    \ signup = (DB, Email, attrs) => () => {\n  const user = saveUser(DB, attrs);\n\
    \  welcomeUser(Email, user);\n};\n```\n\nThe example demonstrates that the pure\
    \ function is most honest about its dependencies and, as such, tell us exactly\
    \ what it's up to. From its signature, we know that it will use Db, Email, and\
    \ attrs which should be telling to say the least.\n\nWe'll learn how to make functions\
    \ like this without merely deferring evaluation, but the point should be clear\
    \ that the pure function is much more informative than its sneaky counterpart\
    \ which is up to what we knows.\n\nSomething else is that we're forced to notice\
    \ app much more flexible because we've pass them in arguments, which makes our\
    \ app parameterized by our database or what we have (don't worry, we'll see a\
    \ way to make this less tedious than it sounds). We choose to use a different\
    \ DB we only need to call our function with it. We find ourselves writing a new\
    \ application in which we'd like to reuse this reliable function, we simply give\
    \ this function whatever DB and Email we have at the time.\n\nIn a JavaScript\
    \ setting, portability could mean serializing and sending functions over a socket.\
    \ It could mean running all our app in code web workers. Portability is a powerful\
    \ trait.\n\nContary to \"typical\" methods and procedures in imperative programming\
    \ rooted deep in their environment, dependencies, and available effects, pure\
