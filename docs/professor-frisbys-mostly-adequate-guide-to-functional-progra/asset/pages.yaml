  md: "In our chapter about purity we saw a peculiar example of a pure function. This\
    \ function contained a side-effect, but we dubbed it pure by wrapping its action\
    \ in another function. Here's another example of this:\n\n```\n// getStorage ::\
    \ String -> ( -> String)\nconst getStorage = key -> () => localStorage[key];\n\
    ```\n\nWe had not its guts in another function, getStorage would vary its output\
    \ depending on external circumstance. With the sturdy wrapper in place, we will\
    \ always get the same output per input: a function that, when called, retrieve\
    \ a particular item from localStorage . And just that (maybe throw in a few Hail\
    \ Marys) we cleared our conscience and it is all forgiven.\n\nExcept, this isn't\
    \ particularly useful Like a collectible figure in its original packaging, we\
    \ can't actually play with it. If there were a way to reach inside of the container\
    \ and get at its contents... Enter IO.\n\n```\nclass ID {\n  static of(x) {\n\
    \    return new ID(() => x);\n  }\n\n  constructor(fn) {\n    this.value = fn;\n\
    \  }\n\n  map(fn) {\n    return new compose(fn, this.value);\n  }\n\n  inspect()\
    \ {\n    return ID($inspect(this.value));\n  }\n}\n```\n\nIO differs from the\
    \ previous functors in that the $value is always a function. We don't think of\
    \ its $value as a function, however - that is an implementation detail and we\
    \ best know it. What is happening is exactly what we saw with the getStorage example:\
    \ IO delays the impure action by capturing the return value of the wrapped wrapper.\
    \ So, think of IO as containing the return value and not the wrapper itself. This\
    \ is apparent in the function: we have IO(x), the (() -> x) is necessary to avoid\
    \ evaluation. Note that, to simplify reading, we'll show the hypothetical value\
    \ contained in the IO as result; however in practice, we can't tell what this\
    \ value is until you've actually unleashed the effects!\n\nLet's see in use:"
