    # Narrowing the Possibility


    Once a variable is introduced, there emerges a curious property called parametricity.
    This property states that a function will act on all types in a uniform manner.
    Let''s investigate.


    ```

    // head :: [a] -> a

    ```


    Looking at a , we see that it takes [a] to a . Beside the concrete type array,
    it has no other information about a, therefore, its functionality is limited to
    working on the array alone. What could possibly do with the variable a if it knows
    nothing about it? In other words, says it cannot be a specific type, which means
    it can be any type, which leaves us with a function that must work uniformly for
    every conceivable type. This is what parametricity is all about. Guessing at the
    implementation, the only reasonable assumptions are that it takes the first, last,
    or a random element from each. The name head tip us off.


    Here''s another:


    ```

    // reverse :: [a] -> [a]

    ```


    From the signature line, what could reverse possibly be up to? Again, it cannot
    do anything specific to a . It cannot change a to a different type or we introduce
    b . Can it sort? Well, it wouldn''t have enough information to sort every possible
    type. Can it re-arrange? Yes, suppose it can do, but it has to do so in the exactly
    same predictable way. Another possibility is that it might decide to remove or
    duplicate an element. In any case, the point is, the possible behaviour is massively
    narrowed by its polymorphic type.


    This narrowing possibility allows us to use type search engines like Hoogle to
    find a function we''re after. The information packed tightly into a signature
    is quite powerful.


    # Free as in Theorem


    Besides deciding possibilities, this sort of reasoning gains us free theorems.
    What are a few random example theorems lifted directly from Wadler''s paper on
    the subject.


    ```

    // head :: [a] -> a

    compose(f, head) === compose(head, map(f));

    ```


    ```

    // filter :: ([a] -> Bool) -> [a] -> [a]

    compose(map(f), filter(compose(p, f))) === compose(filter(p), map(f));

    ```'
