  md: 'It states that, for any monad M, of and join amounts to id. We can also map(of)
    and attack it from the inside out. We call this "triangle identity" because it
    makes such a shape when visualized:


    ![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_79_0.png)


    If we start at the top left heading right, we can see that of does indeed drop
    our M in another M container. If we move downward and join it, we get the same
    as if we just called id in the first place. Moving right to left, we see that
    if we sneak under the covers with map and call of the plain a, we''ll end up with
    M(M a) and join will bring us back to square one.


    I should mention that we have written of, however, it must be the specific M of
    whatever monad we''re using.


    Now, we''ve seen these lines, identity and associativity, somewhere... Hold on,
    I''m thinking... Of course! These are the laws for a category. But that would
    we need a composition function to complete the definition. Behold:


    ```

    const mcompose = (f, g) => compose(f, g);


    // left identity

    cmcompose(M, f) === f;


    // right identity

    cmcompose(f, M) === f;


    // associativity

    cmcompose(mcompose(f, g), h) === mcompose(f, mcompose(g, h));

    ```


    They are the laws after all. Monads form a category called the "Kleisli category"
    where all objects are monads and morphisms are chained functions. It don''t mean
    to haunt you with bits and bobs of category theory without much explanation of
    how the jigsaw fits together. The intention is to scratch enough to show the relevance
    and spark some interest while focusing on the practical properties we can use
    each day.


    # In Summary


    Monads let us drill into nested computations. We can assign variables, run sequential
    effects, perform asynchronous tasks, all without laying one brick in a pyramid
    of doom. They come to the rescue when a value finds itself jailed'
