  md: '# Professor Frisby’s

    Mostly Adequate

    Guide to Functional Programming


    ![](img/9b77a6dfa4e7c2aa4f9efc23d9dcb488_5_0.png)


    # About this book


    This is a book on the functional paradigm in general. We''ll use the world''s
    most popular functional programming language: JavaScript. Some may feel this is
    a poor choice as it''s against the grain of the current culture which, at the
    moment, feels predominantly imperative. However, I believe it is the best way
    to learn FP for several reasons:


    +   - You like it every day at work.

    - This makes it possible to practice and apply your acquired knowledge each day
    on real world programs than pet projects on nights and weekends in an esoteric
    FP language.

    - We don''t have to learn everything up front to start writing programs.

    in a pure functional language, you cannot log a variable or read a DOM node without
    monads. Here we can catch a little as we learn to purify our codebase. It''s also
    easier to get started in this language since it''s mixed paradigm and you can
    fall back on your current practices while there are gaps in your knowledge.

    - The language is fully capable of writing top notch functional code.'
  merge: -1
