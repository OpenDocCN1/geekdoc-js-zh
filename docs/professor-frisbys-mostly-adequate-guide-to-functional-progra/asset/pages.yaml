  md: "To run our Task, we must call the method fork. This works like unsafePerformIO,\
    \ as the name suggests, it will fork our process and evaluation continues without\
    \ blocking our thread. This can be implemented in numerous ways with threads,\
    \ and here it acts as a normal async call and by the big wheel of the event loop\
    \ keeps on turning. Let's look at fork:\n\n```\n// Pure application // Posts ->\
    \ HTML\nconst blogPage = Handlebars.compile(template);\n\n// renderPage : Posts\
    \ -> HTML\nconst renderPage = compose(blogPage, sortBy(prop('date')));\n\n// blog\
    \ : Params -> Task Error HTML\nconst blog = compose(map(renderPage), getJSON('/posts'));\n\
    \n// Impure calling code\nblog().fork(\n  error => ${'Error'}.html(error.message),\n\
    \  page => ${'main'}.html(page),\n);\n\n$('spinner').show();\n```\n\nUpon calling\
    \ fork, the Task hurries off to find some posts and render the page. Meanwhile,\
    \ we will show a spinner since fork does not wait for a response. Finally, we\
    \ will either display an error or render the page onto the screen depending if\
