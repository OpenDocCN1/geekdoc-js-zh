    # Parallel Code


    Finally, and here''s the coup de grâce, we can run any pure function in parallel

    s it does not need access to shared memory and it cannot, by definition, have

    a race condition due to some side effect.


    This is much possible in a server side js environment with threads as well as

    in the browser with web workers though current culture seems to avoid it due to

    complexity when dealing with impure functions.


    # In Summary


    We''ve seen pure functions are and why, as functional programmers,

    believe they are the cat''s evening wear. From this point on, we''ll strive to
    write all

