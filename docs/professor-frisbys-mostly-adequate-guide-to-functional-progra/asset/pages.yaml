  md: '```

    F.of(x).map(f) === F.of(f).ap(F.of(x));

    ```


    In English, mapping f is equivalent to aping a functor of f. Or in proper English,
    we can map x into our container and map(f) OR we can lift f and x into our container
    and ap. This allows us to write in a left-to-right fashion:


    ```

    Maybe.of(add).ap(Maybe.of(())).ap(Maybe.of(3));

    // Maybe(5)


    Task.of(add).ap(Task.of(2)).ap(Task.of(3));

    // Task(5)

    ```


    One might recognise the vague shape of a normal function call in the chapter,
    but for now, this is the preferred way to write code. Using of, each value gets
    transported to the magical land of tantos, this parallel universe where each occasion
    can be async or null or what you have and ap will apply functions within this
    fantastic place. It''s like building a ship in a bottle.


    Did you see there? We used Task in our example. This is a prime situation where
    applicative functions pull their weight. Let''s look at a more in-depth example.


    # Coordination Motivation


    Say we''re building a travel site and we''d like to retrieve both list of tourist
    destinations and local events, stand-alone api calls.


    ```

    // Http.get :: String -> Task Error events => { /* render page */ };

    const renderPage = curry((destinations, events) => { /* render page */ });

    Task.of(renderPage).ap(http.get(''/destinations'')).ap(http.get(''events''));

    Task(<div><div>some page with events and<div></div></div>)

    ```


    Both call will happen instantly and renderPage will be called when both are resolved.
    Contrast this monadic version where one Task must finish before the next fires
    off. Since we need the destinations to retrieve events, we are free from sequential
    evaluation.


    Again, because we''re using partial application to achieve this result, we must
    ensure renderPage is curved or it will not wait for both Tasks to finish. Incidentally,
    if you''ve ever had to do such a thing manually, you''ll appreciate the astonishing
    simplicity of this interface. This is the kind of beautiful code that takes us
    one step closer to the singularity.


    Let''s look at another example.'
