  md: "# Chapter 03: Pure Happiness with Pure Functions\n\n# Oh to Be Pure Again\n\
    \nOne thing we need to get straight is the idea of a pure function.\n\nA pure\
    \ function is a function that, given the same input, will always return the same\
    \ output and does not have any observable side effect.\n\nTake slice and splice.\
    \ They are two functions that do the exact same thing - in a vastly different\
    \ way, mind you the same nonetheless. We say slice is pure because it returns\
    \ the same output per input time, guaranteed. splice, will chew up its array and\
    \ spit it out forever changed which is an observable effect.\n\n```\nconst xs\
    \ = [1,2,3];\n// pure\nxs.slice(0); // [1,2,3]\nxs.slice(0); // [1,2,3]\nxs.slice(0);\
    \ // [1,2,3]\n\n// impure\nxs.splice(0,3); // [1,2,3]\nxs.splice(0,3); // [4,5]\n\
    xs.splice(0,3); // []\n```\n\nIn functional programming, we dislike unwieldy functions\
    \ like splice that mutate data. This will never do as we're striving for reliable\
    \ functions that return the same result every time, not functions that leave a\
    \ mess in their wake like splice.\n\nLet's look at another example.\n\n```\n//\
    \ impure\nlet minimum = 21;\nconst checkAge = age => minimum;\n\n// pure\nconst\
    \ checkAge = (age) => {\n  const minimum = 21;\n  return age > minimum;\n};\n\
    ```\n\nIn the impure portion, checkAge depends on the mutable variable minimum\
    \ to determine the result. In other words, it depends on system state which is\
    \ disappointing because it increases the cognitive load by introducing an external\
    \ environment."
  merge: -1
  pgno: 15
- img_proc: true
  md: 'It might not seem like a in this example, but this reliance upon state is one
    of the largest contributors to system complexity


    (http://curtclifton.net/papers/MoseleyMarks06a.pdf). checkAge may return different
    results depending on factors external to input, which not only disqualifies it
    from being pure, but puts our minds through the wringer each time we''re reasoning
    about software.


    Its pure form, on the other hand, is completely self sufficient. We can also make
    minimum immutable, which preserves the purity of the state as it will never change.
    To this, we must create an object to freeze.


    ```

    const immutableState = Object.freeze(minimum: 21));

    ```


    # Side Effects May Include...


    Let''s look at these "side effects" to improve our intuition. So what is this
    undoubtedly nefarious side effect mentioned in in the definition of pure function?
    We''ll be referring to effect as that occurs in our computation other than the
