- img_proc: true
  md: '```

    const add = (x, y) => x + y;

    const multiply = (x, y) => x * y;


    const flockA = 4;

    const flockB = 2;

    const flockC = 0;

    const result =

    add(multiply(flockB, add(flockA, flockC)), multiply(flockA, flockB));

    // 16

    ```


    And with that, we gain the knowledge of the ancients:


    ```

    // associative

    add(x, y), z) === add(x, y), z);


    // commutative

    add(x, y) === add(x, y);


    // identity

    add(x, 0) === x;


    // distributive

    multiply(x, add(y, z)) === multiply(x, y), multiply(x, z));

    ```


    Ah, yes old faithful mathematical properties should come in handy. Or if you didn''t
    worry know them right off the top of your head. For a lot of us, it''s been a
    while since we learned about these rules of arithmetic. Let''s see if we can use
    these properties to simplify our little seagull flock.


    ```

    // Original line

    add(multiply(flockB, add(flockA, flockC)), multiply(flockA, flockB));


    // Apply the identity to remove the extra add

    // (flockB, flockC) == flockA;

    add(multiply(flockB, flockA), multiply(flockA, flockB));


    // Apply distributive property to achieve our result

    multiply(flockB, add(flockA, flockA));

    ```


    Brilliant! We didn''t have to write a lick of custom code other than calling function.
    We use add and multiply definitions here for completeness, but there is really
    no need to write them - we surely have an add and multiply provided by some existing
    library.


    You may be thinking "how very strawman of you to put such a simple example front."
    "Real programs are not this simple and cannot be reasoned about such a way." I''ve
    chosen this example because most of us already know about addition and multiplication,
    so it''s easy to see how math is very useful for us here.


    Don''t despair - throughout this book, we''ll sprinkle in some category theory,
    set theory, and lambda calculus and real world examples that achieve the elegant
    simplicity and results as our flock of seagulls. You needn''t be a mathematician
    either. It will feel natural and easy, just like you were using a "normal" framework
    or API.'
