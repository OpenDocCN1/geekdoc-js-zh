    \ last, split('?'));\n\n// findParam :: String -> IO Maybe(Maybe)\nconst findParam\
    \ = key => map(Maybe.of, compose(eq(key), head)), params);\n\n// Immuture calling\
    \ code\n\n// run it by calling $value();\nfindParam('searchTerm').$value();\n\
    just(['searchTerm'], 'watflehouse')\n```\n\nOur library cleans its hands by wrapping\
    \ url in an IO and passing the buck to the caller. You might have also noticed\
    \ that we have stacked the containers; it's perfectly reasonable to have a IO(Maybe(Int)),\
    \ which is three functors deep (Array, is most definitely a mappable container\
    \ type) and exceptionally expressive.\n\nThere's something that has been bothering\
    \ me and we should rectify it: IO's $value isn't really its contained value, nor\
    \ is it a private property. It is the pin in the grenade and it is meant to be\
    \ performed by a caller in the most public of ways. Let's rename this property\
    \ to unsafePerformIO to remind our users of its volatility.\n\n```\nclass ID {\n\
    \  constructor(io) {\n    this.unsafePerformIO = io;\n  }\n}\n\nmap(fn) {\n  return\
    \ new IO(compose(fn, unsafePerformIO));\n}\n```\n\nThere, much better. Now our\
    \ calling code becomes findParam('searchTerm').unsafePerformIO(), which is clear\
    \ as to users (and readers) of the application.\n\nIO will be a loyal companion,\
