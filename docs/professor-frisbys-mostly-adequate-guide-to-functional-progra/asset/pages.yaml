    \ we learn about currying, we'll see how we can directly model the mathematical\
    \ definition of a function.)\n\nHere comes the dramatic reveal: Pure functions\
    \ are mathematical functions and they're what functional programming is all about.\
    \ Programming with these little angels can provide huge benefits. Let's look at\
    \ some reasons why we're willing to go to great lengths to preserve purity.\n\n\
    # # The Case for Purity\n\n# ## Cacheable\n\nFor starters, pure functions can\
    \ always be cached by input. This is typically done using a technique called memoization.\n\
    \n```\nconst squareNumber = memoize(x => x * x);\n\nsquareNumber(); // 16\n\n\
    squareNumber(); // 16, returns cache for 4\n\nsquareNumber(); // 25\n\nsquareNumber();\
    \ // 25, returns cache for 5\n```\n\nHere is a simple implementation, though there\
    \ are plenty of robust versions available.\n\n```\nconst memoize = (f) => {\n\
    \  const cache = {};\n\n  return (...args) => {\n    const argstr = JSON.stringify(args);\n\
    \    cache[argstr] = cache[argstr] || f(...args);\n    return cache[argstr];\n\
    \  };\n};\n```\n\nSomething to note is that you can transform impure into pure\
    \ ones by delaying evaluation:\n\n```\nconst pureHttpCall = memoize((url, params)\
    \ => () => $.JSON(url, params));\n```\n\nThe interesting thing here is that we\
    \ don't actually the http call - we return a function that will do so when called.\
    \ This is pure because it will always return the same output given the same input:\
    \ the function that will make the particular http call given the uri and params.\n\
    \nOur memoize function works just, though it doesn't cache the results of the\
    \ http call, rather it caches the generated function."
