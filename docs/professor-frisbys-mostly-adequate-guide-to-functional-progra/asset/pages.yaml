  md: 'A few last things here:


    ```

    // id :: a -> a

    const id = x => x;


    // map :: (a -> b) -> [a] -> [b]

    const map = curry((f, xs) => xs.map(f));

    ```


    The id function uses any type of a and returns something of the same type as a.
    Variable names like a and b are convention, but they are arbitrary and can be
    replaced with whatever name you''d like. That''s important so let''s reiterate:
    a -> a can be any type a to any type b, but a -> a means it has to be the same
    type. For example, id may be String -> String or Number -> Number, String -> Bool.


    map similarly uses variables, but this introduce b which may or not be the same
    type as a. We can read it as: map takes an array of a to the same or different
    b, then takes an array of a''s and results in an array of b''s.


    Hopefully, you will be overwhelmed by the beauty of this type signature. It literally
    tells you the function does almost word for word. Given a function from a to b,
