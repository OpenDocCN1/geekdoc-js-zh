    // go back to httpGet in the application and explicitly pass err along.

    httpGet(''/post/2'', (json, err) => renderPost(json, err));

    ```


    We had it as a first class function, less would need to change:


    ```

    // renderPost is called within httpGet with however many arguments it wants

    httpGet(''/post/2'', renderPost);

    ```


    Besides the removal of unnecessary functions, we must name and reference arguments.
    Names are a bit of an issue, you see. We have potential misnomers - especially
    as the codebase gets requirements change.


    Having multiple names for the same concept is a common source of confusion in
    projects. There is also the issue of generic code. For instance, these two functions
    do the same thing, but one feels infinitely general and reusable:


    ```

    // specific to our current blog

    const validArticles = articles =>

    .filter(article => article != null && article !== undefined);

    // vastly relevant for future projects

    const compact = xs => xs.filter(x => x != null && x !== undefined);

    ```


    By using specific, we''ve seeningly tied ourselves to specific data (in this case
    articles). This happens a bit and is a source of reinvention.


    I must mention that, just with Object-Oriented code, you must be aware of this
    coming to you in the jugular. If an underlying function uses this and we call
    it first class, then we are subject to this leaky abstraction''s wrath.


    ```

    const fs = require(''fs'');

    // scary

    fs.readFile(''freaky_friday.txt'', Db.save);

    // less so

    fs.readFile(''freaky_friday.txt'', Db.save.bind(Db));

    ```


    Having bound to itself, the Db is free to access its prototypical garbage code.
    I avoid using this like a dirty napper. There''s really no need when writing functional
    code. However, interfacing with other libraries, you might have to acquiesce to
    the math world around.


    Some will argue that this is necessary for optimizing speed. If you are the micro-optimization
    sort, please close this book. If you cannot get your back, perhaps you can exchange
    it for something more fiddly.


    And with that, we''re ready to move on.


