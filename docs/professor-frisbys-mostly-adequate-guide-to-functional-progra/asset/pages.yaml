  md: '# Isomorphic JavaScript


    When we can completely go back and forth losing any information, that is considered
    an *isomorphism*. That''s a fancy word for "holds the same data". We say that
    two types are isomorphic if we can provide the "to" and "from" *natural transformations*
    as proof:


    ```

    // promiseToTask :: Promise a b -> Task a b

    const promiseToTask = x => new Task((reject, resolve) => x.then(resolve)).catch(reject);


    // taskToPromise :: Task a b -> Promise a b

    const taskToPromise = x => new Promise((resolve, reject) => x.fork(reject, resolve));


    const x = Promise.resolve(''x'');

    taskToPromise(promiseToTask(x)) === x;


    const y = Task.of(''rabbit'');

    promiseToTask(taskToPromise(y)) === y;

    ```


    **Q.E.D.** *Promise* and *Task* are *isomorphic*. We can also write `listToArray`
    to complement our `arrayList` and show that they are too. As a counter example,
    `arrayList` is not isomorphic since it loses information:


    ```

    // maybeToArray :: Maybe a -> [a]

    const maybeToArray = x => (x.isNothing ? [] : [x.$value]);


    // maybeToArray :: [a] -> Maybe [a]

    const arrayToArray = x => Maybe.of(x);


    const x = [''elvis costello'', ''the attractions''];


    // not isomorphic

    maybeToArray(arrayToArray(x)); // [''elvis costello'']


    // but is a natural transformation

    compose(arrayToArray, map(replace(''elvis'', ''lou'')))(x); // Just (''lou costello'')

    // =

    compose(map(replace(''elvis'', ''lou'')), arrayToArray)(x); // Just (''lou costello'')

    ```


    They are natural transformations, however, since *map* on either side yields the
    same result. I mention *isomorphisms* here, mid-chapter where we''re on the subject,
    but don''t let that fool you, for it is an enormously powerful and pervasive concept.
    Anyways, let''s move on.


