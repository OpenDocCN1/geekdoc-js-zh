    **console.log( ‘Elements: ‘ + seasons )**


    ![image](images/7p.jpg)Save the HTML document, then open it in your browser and
    launch the console to see the elements manipulated


    ![image](images/pg75_1.jpg)


    ![image](images/hot.jpg)


    Use the **slice( )** method without a replacement value to delete a specified
    number of elements at a specified position and it will automatically renumber
    all remaining elements that follow in that array.


    ![image](images/forget.jpg)


    The **shift( )** and the **unshift( )** methods work like **pop( )** and **push(
    )** but on the first element rather than the last. The **reverse( )** and **sort(
    )** methods are used in the next example listed [here](#chapter04.xhtml_sec36).


    **Sort Elements**


    It is often desirable to arrange an array’s element values in a particular order
    using the array sort( ) method. This can optionally specify a comparison function
    argument to define the sort order.


    When no comparison function is specified, the sort( ) method will, by default,
    convert all element values to strings then sort them lexicographically in dictionary
    order – comparing each first character, then each second character, and so on.
    Where the elements contain matching strings that differ only by character case,
    the string with most uppercase characters gets a lower index position – appearing
    before that with fewer uppercase characters.


    The sort( ) method’s default behavior of sorting into dictionary order is usually
    satisfactory for string values but is often not what you want when sorting numerical
    values. For example, in sorting three values 30, 100, 20, the result is 100, 20,
    30 – because the first characters are different they are sorted by that comparison
    only. Typically, it is preferable to require all numerical element values to be
    sorted in ascending, or descending, numerical order so the sort( ) method needs
    to specify the name of a custom comparison function to define the sort order.


    A comparison function nominated by the sort( ) method will be passed successive
    pairs of element values for comparison, and it must return an integer value to
    indicate each comparison’s result. When the first value is greater than the second
    it should return a value greater than zero to indicate that the first value should
    be sorted to a higher index position – to appear after the second value. Conversely,
    the comparison function should return a value less than zero to indicate that
    the first value should be sorted to a lower index position – to appear before
    the second value. When both values are identical, zero should be returned to indicate
    that the element positions should remain unchanged. When all comparisons have
    been made, the elements will be arranged in ascending value order. If descending
    order is required, the array’s reverse( ) method can then be used to reverse the
    element order.


    If a comparison function is comparing numerical element values it simply needs
    to return the result of subtracting the second passed value from the first passed
    value to have the desired effect.


    ![image](images/forget.jpg)


    Remember that **sort( )** does actually rearrange the values stored in the array
    elements.


    ![image](images/hot.jpg)


    The default behavior of the **sort( )** method is the equivalent of a comparison
    function comparing arguments **x** and **y** with these statements:


    **if( x > y ) return 1 else if( x < y ) return -1 else return 0**.


