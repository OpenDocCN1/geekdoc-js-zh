    ![image](images/htmlp.jpg)


    sort.html


    ![image](images/2p.jpg)Next, output the values in each array, and output their
    element values sorted in dictionary sort order


    **console.log( ‘Colors: ‘ + hues )**


    **console.log( ‘Dictionary Sort: ‘ + hues.sort( ) )**


    **console.log( ‘\nNumbers: ‘ + nums )**


    **console.log( ‘Dictionary Sort: ‘ + nums.sort( ) )**


    ![image](images/3p.jpg)Now, add a statement to output the numerical values sorted
    after calling a comparison function


    **console.log( ‘Numerical Sort: ‘ + nums.sort( sortNums ) )**


    ![image](images/4p.jpg)Finally, in the function block, add a statement to output
    the numerical values in descending order


    **console.log( ‘Reversed Sort: ‘ + nums.reverse( ) )**


    ![image](images/5p.jpg)Next, in the script, add the comparison function


    **function sortNums( numOne, numTwo ) {**


    **return numOne - numTwo**


    **}**


    ![image](images/6p.jpg)Save the HTML document, then open it in your browser and
    launch the console to see the elements sorted


    ![image](images/pg77_1.jpg)


    ![image](images/snake.jpg)


    When the **sort( )** method specifies a comparison function it must nominate it
    by function name only – do not include trailing brackets after the comparison
    function name in the argument to the **sort( )** method.


    **Get Dates**


    The built-in JavaScript Date object provides components representing a particular
    date, time, and timezone. An instance of a Date object is created using the new
    keyword, a Date( ) object constructor, and a variable name assignment. Without
    specifying any arguments to the constructor, a new Date object represents the
    date and time of its creation based upon the system time of the computer on which
    the browser is running. There is no consideration given as to whether system time
    is accurate to the Universal Time Clock (UTC) or Greenwich Mean Time (GMT).


