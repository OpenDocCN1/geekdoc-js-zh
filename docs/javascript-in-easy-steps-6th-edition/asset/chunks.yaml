    \n```javascript\nfunction ( ) {\n  const form = document.getElementById( ‘pizza’\
    \ )\n  form.addEventListener( ‘submit’,\n  function ( event ){ reactTo( event\
    \ ) } )\n  form.Top[ 0 ].checked = true\n} ) ( )\n```\n\n![image](img/3v.jpg)当复选框组中的多个按钮被选中时，它们的值将以逗号分隔列表的形式提交。\n\
    \n![image](img/hot.jpg)现在，通过声明三个变量和一个循环开始事件处理函数，以确定哪些框被选中\n\n```javascript\nfunction\
    \ reactTo( form, event ) {\n  let i, ok, summary = ‘’\n  for( i = 0 ; i < form.Top.length\
    \ ; i++ )\n  {\n    if( form.Top[ i ].checked )\n    {\n      summary += form.Top[\
    \ i ].value + ‘ ‘\n    }\n  }\n  // 在此处插入语句。\n}\n```\n\n然后，添加语句确认选择并将其提交到 Web\
    \ 服务器，或者取消提交\n\n```javascript\nok = confirm( ‘Submit These Choices?\\n’ + summary\
    \ )\nif( !ok ) { event.preventDefault( ) }\n```\n\n![image](img/4v.jpg)将 HTML\
    \ 文档保存到 Web 服务器，然后在浏览器中打开它，做出选择，然后确认提交\n\n![image](img/5v.jpg)\n\n![image](img/6v.jpg)\n\
    \n![image](img/7v.jpg)\n\n![image](img/pg145_1.jpg)\n\n![image](img/8v.jpg)\n\n\
    ![image](img/snake.jpg)\n\n当表单按钮被点击时，会触发表单的默认**事件**动作，即将表单数据提交到 Web 服务器。调用表单事件的\
    \ `preventDefault( )` 方法可以阻止表单数据的提交。\n\n![image](img/forget.jpg)此示例在支持 Perl 服务器端脚本的本地\
    \ Web 服务器上运行，该脚本处理表单提交并为浏览器提供响应。\n\n## 选择选项\n\nHTML `<select>` 下拉列表对象中的选项在 DOM\
    \ 中由 `options[ ]` 数组唯一表示，其中每个数组元素包含 HTML `<option>` 标签指定的选项。提交到 Web 服务器时，赋值给 `<select>`\
    \ 标签 `name` 属性的值以及赋值给当前选中 `<option>` 标签 `value` 属性的值将以 name=value 对的形式发送。\n\n"
- fmt: '

    Importantly, the selection list object has a `selectedIndex` property, which contains
    the index number of the currently selected `options[]` array element, and this
    can be used to retrieve the value of the current selected option.


    When the user changes the selected option in a selection list, a “change” event
    fires. The list object’s `onclick` property can nominate an event-handler function
    to execute when the selected option changes. Alternatively, the event name and
    the event-handler function name can be specified as arguments to the list object’s
    `addEventListener()` method.


    ![image](images/1v.jpg)Create an HTML document that contains a form selection
    list and a submit button, plus an empty paragraph


    ```html

    <form action=”echo.pl” method=”POST">

    <select id=”list” name=”City">

    <option value=”Rome” selected>Rome</option>

    <option value=”London”>London</option>

    <option value=”New York” >New York</option>

    </select>

    <input type=”submit">

    </form>

    <p id=”info”></p>

    ```


    ![image](images/htmlv.jpg)


    options.html


    ![image](images/2v.jpg)Next, in a script element, create a self-invoking function
    that nominates an event-handler function for the form’s “submit” event and for
    the window’s “load” event


    ```javascript

    function ( ) {

    const list = document.getElementById( ‘list’ )

    list.addEventListener( ‘change’ ,

    function ( ) { reactTo( list, event ) } )

    addEventListener( ‘load’ ,

    function ( ) { reactTo( list, event ) } )

    } ) ( )

    ```


    ![image](images/forget.jpg)


    Notice that the HTML selected attribute selects the first option element, which
    is represented in the DOM by `options[0]`


    ![image](images/3v.jpg)Now, add the event-handler function, which will display
    the event and current list selection in the paragraph


    ```javascript evenfunction reactTo( list, event ) {

    const info = document.getElementById( ‘info’ )

    let index = list.options.selectedIndex

    let city = list.options[ index ].value

    info.innerHTML = event.type + ‘<br>Selected: ‘

    info.innerHTML += city + ‘<br>Index: ‘ + index

    }

    ```


    ![image](images/4v.jpg)Save the HTML document on a web server then open it in
    a browser, select an option, and submit the form


    ![image](images/pg149_1.jpg)


    ![image](images/pg149_2.jpg)


    ![image](images/pg149_3.jpg)


    ![image](images/common1.jpg)


    echo.pl


    ![image](images/hot.jpg)


    Hierarchically, this selected option can be referenced using `document.forms[0].elements[0].options[1].value`
    – the deepest level of the DOM.


    ## Reset Changes


    An event-handler can be nominated to the `onfocus` and `onfocusout` properties
    of form text input objects and textarea objects to recognize the active element.
    A “focus” event fires when the user selects a text field, and a “focusout” event
    fires when the user leaves that text field.


    ![image](images/pg150_1.jpg)


    Usefully, an event-handler can be nominated to the `onreset` property of a form
    object to remove content related to form input when the form is returned to its
    original state by a reset button.


    As with other objects, the event name and the event-handler function name can
    be specified as arguments to the text field and form object’s `addEventListener()`
    method.


    ![image](images/1v.jpg)Create an HTML document that contains a form with a text
    field and reset button, plus an empty paragraph


    ```html

    <form id=”code” >

    <input id=”lang” name=”Language” type=”text” >

    <input type=”reset">

    <input type=”submit">

    </form>

    <p id=”info”></p>

    ```


    ![image](images/htmlv.jpg)


    reset.html


    ![image](images/2v.jpg)Next, in a script element, create a self-invoking function
    that nominates an event-handler function for the text field’s “focus” and “focusout”
    events, the form’s “reset” event, and for the window’s “load” event


    ```javascript

    function ( ) {

    const form = document.getElementById( ‘code ’ )

    const lang = document.getElementById( ‘lang ’ )

    const info = document.getElementById( ‘info’ )

    lang.addEventListener( ‘focus’ ,

    function ( event ) { reactTo( event, info ) } )

    lang.addEventListener( ‘focusout’ ,

    function ( event ) { reactTo( event, info ) } )

    form.addEventListener( ‘reset’,

    function ( ) { defaultMessage( info ) } )

    addEventListener( ‘load’,

    function ( ) { defaultMessage( info ) } )

    } ) ( )

    ```


    ![image](images/hot.jpg)


    Text fields also have an `onselect` property to which an event-handler can be
    nominated to respond to a “select” event that fires when the user selects some
    of its text.


    ![image](images/3v.jpg)Now, add the event-handler function for the text field’s
    “focus” and “focusout” events, to display the event type


    ```javascript

    function reactTo( event, info ) {

    info.innerHTML = event.type

    }

    ```


    ![image](images/4v.jpg)Then, add the event-handler function for the window’s “load”
    and the form’s “reset” events, to display a message


    ```javascript

    function defaultMessage( info ) {

    info.innerHTML =

    ‘Please enter your favorite coding language’

    }

    ```


    ![image](images/5v.jpg)Save the HTML document, then open it in your browser, to
    see the default message appear in the paragraph


    ![image](images/pg151_1.jpg)


    ![image](images/6v.jpg)Select the text field and see the “focus” event fire, then
    type in the name of your favorite coding language


    ![image](images/pg151_2.jpg)


    ![image](images/7v.jpg)Hit the Tab key to move focus onto the Reset button and
    see the “focusout” event fire


    ![image](images/pg151_3.jpg)


    ![image](images/8v.jpg)Hit the Enter key (to push the Reset button) to clear the
    text field and see the default message once more


    ![image](images/pg151_4.jpg)


    ## Validate Forms


    A form object’s `onsubmit` property can nominate an event-handler function to
    validate user input entered into a form before it is submitted to the web server
    for processing. Alternatively, the “submit” event name and an event-handler function
    name can be specified as arguments to the form object’s `addEventListener()` method.


    ![image](images/pg152_1.jpg)


    The simplest level of form validation examines a text input where an entry is
    required to ensure the user has made an entry. When its value remains an empty
    string, no entry has been made, so the validating function can call the `event.preventDefault()`
    method to prevent form submission.


    A higher level of form validation can examine the string entered by the user to
    ensure it meets an expected format. For example, where an email address is expected,
    the format requires the string to contain an “@” character and at least one “.”
    character. When either of these are absent, the string is not a valid email address,
    so the validating function can prevent form submission.


