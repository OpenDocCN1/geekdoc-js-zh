    result should be assigned to a variable that may be subsequently tested – if the
    variable is not null it must then represent the pop-up window object. That window
    may then be closed by calling its close( ) method, or its contents printed by
    calling its print( ) method.


    Windows can also be positioned by specifying X and Y screen axes coordinates as
    arguments to a window.moveTo( ) method. There is also a similar window.moveBy(
    ) method that accepts two arguments to specify how many pixels along the X and
    Y axes the window should be shifted from its current screen position.


    ![image](images/forget.jpg)


    Browser makers have added Pop-up Blockers due to the annoying proliferation of
    pop-up windows – so the use of pop-ups is no longer recommended, but they are
    demonstrated here for completeness.


    ![image](images/1bl.jpg)Create an HTML document containing a heading


    **<h1>Pop-up Window</h1>**


    ![image](images/htmlbl.jpg)


    popup.html


    ![image](images/htmlbl.jpg)


    opener.html


    ![image](images/2bl.jpg)Create a second HTML document containing a heading


    **<h1>Main Window</h1>**


    ![image](images/3bl.jpg)Next, within a script element in the second document,
    add a self-invoking function that creates a window object


    **const popWin = window.open( ‘popup.html’, ‘Popup’,**


    **‘top=150,left=100,width=350,height=100’ )**


    ![image](images/4bl.jpg)Save both HTML documents, then open the second document
    to see its pop-up window is blocked


    ![image](images/pg117_1.jpg)


    ![image](images/5bl.jpg)Open the browser’s Pop-up Blocker dialog and choose to
    allow pop-ups from this page


    ![image](images/pg117_2.jpg)


    ![image](images/6bl.jpg)Now, refresh the browser window to see the pop-up window
    appear with the specified features


    ![image](images/pg117_3.jpg)


    ![image](images/snake.jpg)


    Do not put any spaces in the features list string as it may cause the **window.open(
    )** method to fail.


    ![image](images/hot.jpg)


    Notice that the pop-up window does not display the specified “favicon” on its
    title bar.


    Make Timers


    The JavaScript window object has an interesting setTimeout( ) method that can
    repeatedly evaluate a specified expression after a specified period of time. Where
    the specified expression calls the function in which the window.setTimout( ) statement
    appears, a recursive loop is created – in which the function is repeatedly executed
    after the specified period of time.


    ![image](images/pg118_1.jpg)


    The expression to be evaluated by the setTimeout( ) method must be specified as
    its first argument, and the period of time must be a number specified as its second
    argument. The time is expressed in milliseconds, where 1000 represents one second.


    The setTimeout( ) method returns a numeric value that can be assigned to a variable
    to uniquely identify the waiting process. This value can be specified as the argument
    to the window object’s clearTimeout( ) method to terminate the timer loop at some
    point.


    The window object also has setInterval( ) and clearInterval( ) methods that take
    the same arguments and work in a similar way. The difference is that the time
    specified to setInterval( ) specifies the interval at which point the expression
    is to be evaluated, irrespective of how long it takes to execute. Conversely,
    the time specified to the setTimeout( ) method specifies the period of time between
    the end of one execution until the start of the next execution. This means that
    it is possible for setInterval( ) to attempt overlapping executions where the
    interval is short and the time taken to execute the expression is lengthy. For
    this reason it is generally preferable to use the setTimeout( ) method.


    ![image](images/1bl.jpg)Create an HTML document with an empty paragraph


    **<p id=”info”></p>**


    ![image](images/htmlbl.jpg)


    timer.html'
