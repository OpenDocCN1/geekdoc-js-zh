    ![image](images/3b.jpg)

    Save the HTML document then open it in your browser and launch the console to
    see the data types in output


    ![image](images/pg17_1.jpg)


    ![image](images/snake.jpg)


    You should be surprised to see that the variable assigned a `null` value is described
    as being an `object` type, rather than a `null` type. This is a known error in
    the JavaScript language.


