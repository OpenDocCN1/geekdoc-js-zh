    ![image](images/pg159_2.jpg)


    ![image](images/hot.jpg)


    Notice how the Console provides the line number of the promise and of the function
    that handled the result.


    **Fetch Data**


    Web browsers support a Fetch API that can be used in JavaScript to grab resources
    over a network. The fetch( ) method accepts a single argument, which is the URL
    of the resource to be grabbed.


    ![image](images/pg160_1.jpg)


    The fetch( ) method is asynchronous, so that means other operations can be executed
    while waiting for the resource to arrive. On completion, the fetch( ) method returns
    a Promise object, which contains a response (an HTTPResponse object).


    Typically, the fetch( ) method can grab a JSON resource and parse it using a json(
    ) method of the HTTPResponse object. The returned JSON data can then be passed
    as an argument to the next chained promise method, which can in turn pass the
    JSON data to a handler function. The syntax of the process looks like this:


    **fetch( *url* )**


    **.then( function( response ) { return response.json( ) } )**


    **.then( function( data ) { return *handler*( data ) } )**


    **.catch( function( err ) { return console.log( err ) } )**


    **Arrow Function Expressions**


    The function definitions above can, optionally, be written more concisely as JavaScript
    **=>** arrow function expressions. This allows you to omit the function keyword,
    like this:


    **.then( ( response ) => { return response.json( ) } )**


    If the function body contains only one statement, and that statement returns a
    value, you can also omit the curly brackets and the return keyword from the =>
    arrow function, like this:


    **.then( ( response ) => response.json( ) )**


    Any parameters can appear as a comma-separated list within the round ( ) brackets,
    as usual, but if there is only one parameter you can even omit the brackets from
    the **=>** arrow function – so the entire syntax of the process can, optionally,
    look like this:


    **fetch( *url* )**


    **.then( response => response.json( ) )**


    **.then( data => *handler*( data ) )**


    **.catch( err => console.log( err ) )**


    This is more readable, but you should be aware that => arrow functions treat the
    this keyword differently to regular functions.


    ![image](images/snake.jpg)


    With arrow functions, the **this** keyword represents the object in the originating
    context, whereas with regular functions, the **this** keyword represents the object
    that calls the function.


    ![image](images/1b.jpg)Open a plain text editor, such as Windows’ Notepad app,
    then create a JSON document with an object containing five key:value pairs


    ![image](images/pg161_3.jpg)


