    The concatenation `+` operator is used here to output a combined text string.


    ## Create Functions


    A function expression is simply one, or more, statements that are grouped together
    in `{}` curly brackets for execution, and it returns a final single value. Functions
    may be called as required by a script to execute their statements. Those functions
    that belong to an object, such as `console.log()`, are known as “methods” – to
    differentiate them from built-in and user-defined functions. Both have trailing
    parentheses that may accept “argument” values to be passed to the function for
    manipulation – for example, an argument passed in the parentheses of the `console.log()`
    method.


    ![image](images/pg18_1.jpg)


    The number of arguments passed to a function must normally match the number of
    “parameters” specified within the parentheses of the function block declaration.
    For example, a user-defined function requiring exactly one argument looks like
    this:


    ```javascript

    function *function-name* ( *parameter* ) {

    // Statements to be executed go here.

    }

    ```


    Multiple parameters can be specified as a comma-separated list and you can, optionally,
    specify a default value to be used when the function call does not pass an argument,
    like this:


    ```javascript

    function *function-name* ( *parameter , parameter* = *value* ) {

    // Statements to be executed go here.

    }

    ```


    You choose your own parameter names following the same naming conventions as for
    variable names. The parameter names can then be used within the function to reference
    the argument values passed from the parentheses of the function call.


    A function block can include a `return` statement so that script flow continues
    at the caller – no further statements in the function get executed. It is typical
    to finally return the result of manipulating passed argument values back to the
    caller:


    ```javascript

    function *function-name* ( *parameter , parameter* ) {

    // Statements to be executed go here.

    return *result*

    }

    ```


    It is common for statements within a function block to include calls to other
    functions – to modularize scripts into blocks.


    ![image](images/hot.jpg)


    Notice that the preferred format of a function declaration places the `{` opening
    curly bracket on the same line as the `function` keyword.


    ![image](images/hot.jpg)


    You can omit the return statement, or use the `return` keyword without specifying
    a value, and the function will simply return an `undefined` value to the caller.


    ![image](images/1b.jpg)

    Create an HTML document with a script that declares a function to return the squared
    value of a passed argument


    ```javascript

    function square ( arg ) {

    return arg * arg

    }

    ```


    ![image](images/htmlb.jpg)


    functions.html


    ![image](images/2b.jpg)

    Next, add a function that returns the result of an addition


    ```javascript

    function add ( argOne, argTwo = 10 ) {

    return argOne + argTwo

    }

    ```


    ![image](images/3b.jpg)

    Now, add a function that returns the result of squaring and an addition by calling
    each of the functions above


    ```javascript

    function squareAdd ( arg ) {

    let result = square( arg )

    return result + add( arg )

    }

    ```


    ![image](images/4b.jpg)

    Finally, add statements that call the functions and print the returned values
    in output strings


    ```javascript

    console.log( ‘8 x 8: ‘ + square( 8 ) )

    console.log( ‘8 + 20: ‘ + add( 8, 20 ) )

    console.log( ‘8 + 10: ‘ + add( 8 ) )

    console.log( ‘(8 x 8) + (8 + 10): ‘ + squareAdd( 8 ) )

    ```


    ![image](images/forget.jpg)


    Notice that the default second parameter value (10) is used here when only one
    argument value is passed by the caller.


    ![image](images/5b.jpg)

    Save the HTML document, then open it in your browser and launch the console to
    see values returned from functions


    ![image](images/pg19_1.jpg)


    ![image](images/hot.jpg)


    The `*` asterisk character is the arithmetical multiplication operator in JavaScript.


    ## Assign Functions


    Functions are really useful in JavaScript as they can be called (“invoked”) to
    execute their statements whenever required, and the caller can pass different
    arguments to return different results.


    It is important to recognize that the JavaScript `()` parentheses operator is
    the component of the call statement that actually calls the function. This means
    a statement can assign a function to a variable by specifying just the function
    name. The variable can then be used to call the function in a statement that specifies
    the variable name followed by the `()` operator. But beware, if you attempt to
    assign a function to a variable by specifying the function name followed by `()`
    the function will be invoked and the value returned by that function will be assigned.


    ![image](images/forget.jpg)


    When assigning a named function to a variable, only specify the function name
    in the statement.


    ## Function Hoisting


    Although scripts are read by the JavaScript interpreter in top-bottom order it
    actually makes two sweeps. The first sweep looks for function declarations and
    remembers any it finds in a process known as “hoisting”. The second sweep is when
    the script is actually executed by the interpreter. Hoisting allows function calls
    to appear in the script before the function declaration, as the interpreter has
    already recognized the function on the first sweep. The first sweep does not,
    however, recognize functions that have been assigned to variables using the `let`
    or `const` keywords!


    ![image](images/hot.jpg)


    Variables that were declared using the older `var` keyword were also hoisted,
    but those declared with `let` or `const` are not.


    ## Anonymous Functions


    When assigning a function to a variable, a function name can be omitted as the
    function can be called in a statement specifying the variable name and the `()`
    operator. These are called anonymous function expressions, and their syntax looks
    like this:


    ```javascript

    let *variable* = function ( *parameters* ) { *statements* ; return *value* }

    ```


    Anonymous function expressions can also be made “self-invoking” by enclosing the
    entire function within `()` parentheses and adding the `()` parentheses operator
    at the end of the expression. This means that their statements are automatically
    executed one time when the script is first loaded by the browser. The syntax of
    a self-invoking function expression looks like this:


    ```javascript

    **( function ( ) { *statements* ; return *value* } ) ( )

    ```

