    # Find Characters


    The JavaScript `String` object provides a number of methods that allow a string
    to be searched for a particular character or substring. The `search()` method
    takes a substring as its argument and returns the position at which it occurs
    in the searched string, or a -1 value if not found. Alternatively, the substring
    can be specified as the argument to a `match()` method that will return the substring
    if it is present, or the JavaScript `null` value if it is absent.


    ![image](images/pg102_1.jpg)


    The `indexOf()` method takes a substring as its argument and returns the index
    of the first occurrence. `lastIndexOf()` works in the same way but searches backwards,
    from the end of the string, reporting the last occurrence.


    To discover the character at a particular index position in a string, its index
    value can be specified as an argument to `charAt()` method, or its numerical Unicode
    value can be revealed by specifying its index to `charCodeAt()` method. Conversely,
    one or more Unicode values can be specified as arguments to `String.fromCharCode()`
    method to return their character values.


    Additionally, all occurrences of a character or substring can be replaced by specifying
    their value as the first argument to the `replace()` method, and a replacement
    value as its second argument.


