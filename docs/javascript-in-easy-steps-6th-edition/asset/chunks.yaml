    code when the script gets loaded.


    ![image](images/hot.jpg)


    Self-invoking function expressions are also known as Immediately Invoked Function
    Expressions (IIFE – often pronounced “iffy”).


    ![image](images/1b.jpg)Create an HTML document with a script that calls a function
    that has not yet been declared


    **console.log( ‘Hoisted: ‘ + add( 100, 200 ) )**


    ![image](images/htmlb.jpg)


    anonymous.html


    ![image](images/2b.jpg)Next, add below the function that is called above


    **function add( numOne, numTwo ) {**


    **return numOne + numTwo**


    **}**


    ![image](images/3b.jpg)Now, add a function that assigns the function above to
    a variable, then calls the assigned function


    **let addition = add**


    **console.log( ‘Assigned: ‘ + addition( 32, 64 ) )**


    ![image](images/4b.jpg)Then, assign a similar, but anonymous, function to a variable
    and call that assigned function


    **let anon = function ( numOne, numTwo ) {**


    **let result = numOne + numTwo ; return result**


    **}**


    **console.log( ‘Anonymous: ‘ + anon( 9, 1 ) )**


    ![image](images/5b.jpg)Finally, assign the value returned from a self-invoking
    function to a variable and display that value


    **let iffy = ( function ( ) {**


    **let str = ‘Self Invoked Output’ ; return str**


    **} ) ( )**


    **console.log( iffy )**


    ![image](images/6b.jpg)Save the HTML document, then open it in your browser and
    launch the console to see values returned from functions


    ![image](images/pg21_1.jpg)


    ![image](images/hot.jpg)


    The significance of self-invoking functions may not be immediately obvious, but
    their importance should become clearer by the end of this chapter.


    **Recognize Scope**


    The extent to which variables are accessible in your scripts is determined by
    their “lexical scope” – the environment in which the variable was created. This
    can be either “global” or “local”.


    ![image](images/pg22_1.jpg)


    **Global Scope**


    Variables created outside function blocks are accessible globally throughout the
    entire script. This means they exist continuously and are available to functions
    within the same script environment. At first glance this might seem very convenient,
    but it has a very serious drawback in that variables of the same name can conflict.
    For example, imagine that you have created a global **myName** variable that has
    been assigned your name, but then also include an external script in which another
    developer has created a global **myName** variable that has been assigned his
    or her name. Both like-named variables exist in the same script environment, so
    conflict. This is best avoided so you should not create global variables to store
    primitive values (all data types except Object and Function) within your scripts.


    **Local Scope**


    Variables created inside function blocks are accessible locally throughout the
    life of the function. They exist only while the function is executing, then they
    are destroyed. Their script environment is limited – from the point at which they
    are created, to the final **}** curly bracket, or the moment when the function
    returns. It is good practice to declare variables at the very beginning of the
    function block so their lexical scope is the duration of the function. This means
    that like-named variables can exist within separate functions without conflict.
    For example, a local **myName** variable can exist happily inside separate functions
    within your script and inside functions in included external scripts. It is recommended
    that you try to create only local variables to store values within your scripts.


    **Best Practice**


    Declaring global variables with the older **var** keyword allows like-named conflicting
    variables to overwrite their assigned values without warning. The more recent
    **let** and **const** keywords prohibit this and instead recognize the behavior
    as an “Uncaught SyntaxError”. It is therefore recommended that you create variables
    declared using the **let** or **const** keywords to store values within your scripts.


    ![image](images/hot.jpg)


    You will discover how to catch errors [here](#chapter03.xhtml_sec28).


    ![image](images/1b.jpg)Create an external script that calls a function to output
    the value of a global variable


    **let myName = ‘External Script’**


    **function readName( ) { console.log( myName ) }**


    **readName( )**


    ![image](images/pg23_1.jpg)


    external.js


    ![image](images/2b.jpg)Create an HTML document that includes the external script
    and adds a similar script


    **<script src=”external.js”></script>**


    **<script>**


    **let myName = ‘Internal Script’**


    **function getName( ) { console.log( myName ) }**


    **getName( )**


    **</script>**


    ![image](images/htmlb.jpg)


    scope.html


    ![image](images/3b.jpg)Save both files in the same folder, then open the HTML
    document to see a conflict error reported in the console


    ![image](images/pg23_2.jpg)


    ![image](images/4b.jpg)Edit both scripts to make the global variables into local
    variables then refresh the browser to see no conflict


    **function readName( ) {**


    **let myName = ‘External Script’ ; console.log( myName )**


    **}**


    **function getName( ) {**


    **let myName = ‘Internal Script’ ; console.log( myName )**


    **}**


    ![image](images/pg23_3.jpg)


    ![image](images/forget.jpg)


    The function calls **readName( )** and **getName( )** remain in the scripts without
    editing.


    **Use Closures**


    The previous example demonstrated the danger of creating global variables to store
    values in JavaScript, but sometimes you will want to store values that remain
    continuously accessible – for example, to remember an increasing score count as
    the script proceeds. How can you do this without using global variables to store
    primitive values? The answer lies with the use of “closures”.


    ![image](images/pg24_1.jpg)


    A closure is a function nested inside an outer function that retains access to
    variables declared in the outer function – because that is the lexical scope in
    which the nested function was created.


    ![image](images/1b.jpg)Create an HTML document with a script that assigns a self-invoking
    anonymous function to a global variable


    **const add = ( function ( ) {**


    **// Statements to be inserted here.**


    **} ) ( )**


    ![image](images/htmlb.jpg)


    closure.html


    ![image](images/2b.jpg)Next, insert statements to initialize a local variable
    and assign a function to a local variable in the same scope


    **let count = 0**


    **const nested = function ( ) { return count = count + 1 }**


    ![image](images/3b.jpg)Now, insert a statement to return the inner function –
    assigning the inner function to the global variable


    **return nested**


    ![image](images/4b.jpg)Finally, add three identical function calls to the inner
    function that is now assigned to the global variable


    **console.log( ‘Count is ‘ + add( ) )**


    **console.log( ‘Count is ‘ + add( ) )**


    **console.log( ‘Count is ‘ + add( ) )**


    ![image](images/5b.jpg)Save the HTML document, then open it in your browser and
    launch the console to see values returned from a closure


    ![image](images/pg24_2.jpg)


    ![image](images/forget.jpg)


    Self-invoking function expressions are described [here](#chapter01.xhtml_sec8).
    They execute their statements one time only. Here, you can use **console.log(
    add )** to confirm that the function expression has been assigned to the outer
    variable.


    It can be difficult to grasp the concept of closures, as it would seem that the
    **count** variable in this example should be destroyed when the self-invoking
    function has completed execution. In order to better understand how closures work,
    you can explore the **prototype** property of the assigned function.


    ![image](images/6b.jpg)Add a statement at the end of the script to reveal how
    the assigned function has been constructed internally


    **console.log( add.prototype )**


    ![image](images/7b.jpg)Save the HTML document, then refresh the browser and expand
    the “constructor” drop-down to see the scopes


