    ## Make Promises


    JavaScript is a single-threaded “synchronous” language. This means that only one
    operation can be executed at any given time. As the script proceeds, each operation
    is added to a “call stack”, then executed (in-down order) – then removed from
    the stack.


    There are, however, some functions that are handled by a browser API (“Application
    Programming Interface”), rather than by the JavaScript engine. For example, the
    `setTimeout()` method is handled by the browser – so that other operations can
    be executed while waiting for the timer to end. When the timer does end it passes
    the operation to a “callback queue”, then (when it reaches the front of the queue)
    it gets executed. This entire process is controlled by an “event loop” that constantly
    monitors the state of the call stack and callback queue.


    ![image](images/pg158_1.jpg)


    In JavaScript, a Promise object represents the eventual completion, or failure,
    of an asynchronous operation and its resulting value. Its status may be either
    pending, resolved (completed), or rejected (failed).


    You create a promise using the JavaScript `new` keyword and the `Promise()` constructor.
    This accepts a function as its argument, which in turn accepts the names of two
    functions that specify what to do when the promise is resolved or rejected.


    Each JavaScript promise has `then()` and `catch()` methods that can be “chained”
    after the promise object using dot notation. The then()` method can handle the
    resulting value of the asynchronous operation, and the `catch()` method can handle
    errors if rejected.


    ![image](images/hot.jpg)


    Web browsers have several APIs, including the Fetch API, which is used to grab
    resources over a network.


    ![image](images/hot.jpg)


    You can chain several `then()` method calls onto a promise, but only one will
    receive the resolved result.

