    **Mouse Events**


    Event-handler functions that execute when the user clicks on a particular object
    in the HTML document can be nominated by assigning the function name to the object’s
    onclick and ondblclick properties. These respond to the “click” event that fires
    when the user clicks the mouse button once, and the “dblclick” event that fires
    when the mouse button is pressed twice in quick succession.


    ![image](images/pg142_1.jpg)


    Additionally, an object’s onmousedown and onmouseup properties can nominate event-handler
    functions to execute when the mouse button gets pressed down, firing the “mousedown”
    event, and when it gets released, firing the “mouseup” event.


    Similarly, an object’s onmouseover and onmouseout properties can nominate event-handler
    functions to execute when the mouse is placed over an element, firing the “mouseover”
    event, and when it moves off the element, firing the “mouseout” event. These are
    often used to create a rollover effect, such as changing the value of that element’s
    style.background property to a different color value.


    Alternatively, the event name and the event-handler function name can be specified
    as arguments to that object’s addEventListener( ) method. This can be used just
    like the window object’s addEventListener( ) method in the previous example to
    nominate a function by name, or you can write a function definition inline as
    the second argument.


    When an event occurs, an event object can be passed to an inline event-handler
    function. This has a type property that identifies the name of that event.


