    **Load Events**


    ![image](images/pg140_1.jpg)


    The DOM allows JavaScript to react to “events” that occur on a web page by the
    script author providing functions that will be executed when a particular event
    happens. These functions are known as “event-handlers”, and can react to events
    such as:


    •**load** – fires when the page has loaded into the browser


    •**click** – fires when the user clicks a mouse button


    •**keydown** – fires when the user presses a keyboard key


    •**change** – fires when the user modifies an input field


    •**submit** – fires when the user submits an HTML form


    To react to a load event, an event-handler function name can be nominated by assignment
    to the window object’s onload property, using this syntax:


    onload=*function-name*


    Alternatively, the event name and the event-handler function name can be specified
    as arguments to the window object’s addEventListener( ) method, but the event
    name must be enclosed within quotes, like this:


    addEventListener( ‘load’ , *function-name* )


    An event-handler for the load event might be used to examine the browser’s features,
    and can usefully check for cookie data.


    ![image](images/1v.jpg)Create an HTML document that contains a paragraph with
    a link to the cookies example [here](#chapter07.xhtml_sec67), an empty paragraph,
    and imports the external JavaScript file from the previous example


