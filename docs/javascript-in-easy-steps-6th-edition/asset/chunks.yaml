  trans: "\n\n![image](img/2bl.jpg)\n\n接下来，在 script 元素中，使用一个返回递减整数的闭包函数初始化一个变量\n\n\
    ```javascript\nconst count = ( function ( ) {\n  let num = 10\n  return ( function(\
    \ ) { return num-- } )\n} ) ( )\n```\n\n![image](img/forget.jpg)\n\n一个设置为间隔为 10\
    \ 分钟的两分钟任务每 10 分钟启动一次，但一个设置为超时为 10 分钟的相同任务则每 12 分钟启动一次（10+2）。\n\n![image](img/hot.jpg)\n\
    \n关于闭包函数的复习，请参此处。\n\n![image](img/3bl.jpg)现在，添加一个计时器函数，该函数开始初始化三个变量\n\n```javascript\n\
    function countDown( ) \n{\n  const info = document.getElementById( ‘info’ )\n\
    \  let timerId = null\n  let num = count( )\n  // 在此处插入语句。\n}\n```\n\n![image](img/4bl.jpg)插入语句以每秒一次的间隔将递减整数写入段落中，直到达到零\n\
    \n```javascript\nif ( num > 0 )\n{\n  info.innerHTML += ‘<span>’+ num + ‘</span>’\n\
    \  timerId = window.setTimeout( countDown , 1000 )\n}\nelse\n{\n  info.innerHTML\
    \ += ‘<span>Lift Off!</span>’\n  window.clearTimeout( timerId )\n}\n```\n\n![image](img/5bl.jpg)在函数块之后，添加一条语句在页面加载时调用计时器函数\n\
    \n```javascript\ncountDown( )\n```\n\n![image](img/6bl.jpg)保存 HTML 文档，然后在浏览器中打开它，以查看计时器倒计时\
    \ 10 秒\n\n![image](img/pg119_1.jpg)\n\n![image](img/pg119_2.jpg)\n\n![image](img/pg119_3.jpg)\n\
    \n![image](img/hot.jpg)\n\n你可以性地在计时器函数中添加 `console.log( timerId )` 语句，以查看计时器的\
    \ ID 值。\n\n## 检查浏览器\n\n在 DOM 层次结构中，顶层窗口对象有很多子对象，每个对象都有自己的属性和方法。其中之一是 `window.navigator`\
    \ 对象，它包含了有关网络浏览器的信息。由于顶层窗口对象存在“全局命名空间”中，它的所有子对象都可以省略地址的该部分，因此可以使用 `alert(` 直接调用\
    \ `window.alert( )` 方法，可以使用 `onload` 引用 `window.onload` 属性，可以使用 `navigator` 引用\
    \ `window. navigator` 对象。\n\n![image](img/pg120_1.jpg)\n\n`navigator` 对象有一个 `appName`\
    \ 属性包含浏览器名称，`appCodeName` 属性包含其代码，`appVersion` 属性包含其版本号。但你可能会对这些值感到惊讶，因为 Google\
    \ Chrome、Firefox、Safari 和 Opera 都将它们的代码标记为“Mozilla”。\n\n每个浏览器在向 Web 服务器发送请求时，会在名为“User-Agent”的\
    \ HTTP 请求头中发送浏览器代码和版本，此字符串也可以从 `navigator.userAgent` 属性中获取。还有一个 `navigator.platform`\
    \ 属性用于描述浏览器的宿操作系统。\n\n在过去几年中，人们非常关注浏览器检测脚本，这些脚本尝试通过 `navigator` 属性来识别浏览器，以便提供适用于该浏览器支持的功能的适当代码。这现在被认为是不良实践，现在建议使用特性检测。\n\
    \n例如，查询浏览器是否支持有用的 `addEventListener( )` 方法可以判断该浏览器是否支持现代的文档对象模型。\n\n![image](img/1bl.jpg)创建一个空列表的\
    \ HTML 文档\n\n```html\n<ul id=”list”></ul>\n```\n\n![image](img/htmlbl.jpg)\n\n\
    browser.html\n\n![image](img/2bl.jpg)接下来，在 script 元素中，创建一个自执行函数，该函数开始初始化变量引用\n\
    \n```javascript\nconst list = document.getElementById( ‘list’ )\n```\n\n![image](img/3bl.jpg)现在，添加语句列出你浏览器的名称\n\
    \n```javascript\nlist.innerHTML = ‘<li>Browser: ‘ + navigator.appName\nlist.innerHTML\
    \ += ‘<li>Code Name: ‘ +\nnavigator.appCodeName\n```\n\n![image](img/hot.jpg)\n\
    \n之前的示例显式地使用了 `window` 前缀，以使 `window` 对象方法和属性的父关系明显，但在技术上最好省略 `window.` 前缀——这样它们就不会通过\
    \ `window` 对象自身的 `window` 属性被引用。例如，直接使用 `onload` 而不是 `window.onload`。\n\n![image](img/4bl.jpg)然后，添加语句列出你的浏览器和你操作系统的版本详情\n\
    \n```javascript\nlist.innerHTML += ‘<li>Version: ‘ + navigator.appVersion\nlist.innerHTML\
    \ += ‘<li>Platform: ‘ + navigator.platform\n```\n\n![image](img/5bl.jpg)最后，添加一条语句确认你使用的是现代浏览器\n\
    \n```javascript\nif( window.addEventListener )\n{\n  list.innerHTML += ‘<li>This\
    \ is a modern DOM browser’\n}\n```\n\n![image](img/6bl.jpg)保存 HTML 文档，然后在任何浏览器中打开它以查看名称和版本详情\n\
    \n![image](img/pg119_1.jpg)\n\n![image](img/pg119_2.jpg)\n\n![image](img/pg119_3.jpg)\n\
    \n![image](img/hot.jpg)\n\n在所有现代浏览器中，`window` 对象都有一个 `addEventListener( )` 方法——Google\
    \ Chrome 和其他浏览器之所以自称为 Netscape，原因源于“浏览器大战”时代——当时浏览器必须采用这些名称以便提供网页。\n\n## 检查状态\n\
    \nDOM 窗口对象有一个 `javaEnabled()` 方法，只有在启用了 Java 支持时它才会返回 true。\n\n![image](img/pg122.jpg)\n\
    \n还有一个 `cookieEnabled` 属性，只有在启用了 cookie 支持时它为真。\n\n此外，`navigator` 拥有 `plugins`\
    \ 子对象和 `mimeTypes` 子对象。与其他数组一样，`plugins` 和 `mimeTypes` 数组都有一个 `length` 属性，包含其元素的数字总数。\n\
    \n每个 `plugin` 数组元素都有 `name` 和 `description` 属性，包含一个插件的详情。可以使用元素索引引用它们。例如，`navigator.plugins[0].name`\
    \ 引用第一个元素的名称。\n\n同样，每个 `mimeTypes` 数组元素都有 `type` 和 `description` 属性，包含一个支持的 MIME\
    \ 特性的详情。可以使用元素索引引用它们。例如，`navigator.mimeTypes[0].type` 引用第一个元素的类型。\n\n![image](img/1bl.jpg)创建一个空段落的\
    \ HTML 文档\n\n```html\n<p id=”info”></p>\n```\n\n![image](img/htmlbl.jpg)\n\nenabled.html\n\
    \n![image](img/2bl.jpg)接下来，在 script 元素中，创建一个自执行函数，该函数开始初始化两个变量\n\n```javascript\n\
    const info = document.getElementById( ‘info’ )\nlet status = ‘‘\n```\n\n![image](img/3bl.jpg)现在，添加语句在启用了\
    \ Java 支持时在段落中写入确认\n\n```javascript\nstatus = ( navigator.javaEnabled( ) ) ? ‘Enabled’\
    \ : ‘Disabled’\ninfo.innerHTML += ‘Java Support is ‘ + status + ‘<hr>’\n```\n\n\
    ![image](img/4bl.jpg)然后，添加语句在启用了 cookie 支持时在段落中写入确认\n\n```javascript\nstatus =\
    \ ( navigator.cookieEnabled ) ? ‘Enabled’ : ‘Disabled’\ninfo.innerHTML += ‘Cookie\
    \ Support is ‘ + status + ‘<hr>’\n```\n\n![image](img/forget.jpg)\n\n这些数组元素的内容根据每个浏览器支持的功能而异。\n\
    \n![image](img/5bl.jpg)现在，添加语句写入 `plugins` 数组的长度和一个示例元素\n\n```javascript\nif (\
    \ navigator.plugins.length !== 0 )\n{\n  info.innerHTML += ‘No. of Plugins: ‘\
    \ +\n  navigator.plugins.length\n  info.innerHTML += ‘<br>Example: ‘ +\n  navigator.plugins[\
    \ 0 ].name\n  info.innerHTML += ‘<br>For: ‘ +\n  navigator.plugins[ 0 ].description\
    \ + ‘<hr>’\n}\n```\n\n"
- fmt: "\n![image](images/6bl.jpg)Finally, add statements to write the length of the\
    \ MIME types array and an example element\n\n```javascript\nif ( navigator.mimeTypes.length\
    \ !== 0 )\n{\n  info.innerHTML += ‘No. of MIME Types: ‘ + navigator.mimeTypes.length\n\
    \  info.innerHTML += `<br>Example: ‘ + navigator.mimeTypes[ 1 ].type\n  info.innerHTML\
    \ += `<br>For: ‘ + navigator.mimeTypes[ 1 ].description\n}\n```\n\n![image](images/7bl.jpg)Save\
    \ the HTML document, then open it in any browser to see the status of its enabled\
    \ features\n\n![image](images/pg123_1.jpg)\n\n![image](images/hot.jpg)\n\nYou\
    \ could use loops to write all plugins and mimeTypes element contents.\n\n## Control\
    \ Location\n\nThe window’s `location` object has five properties containing the\
    \ components of the full URL address of the document currently loaded in the browser\
    \ window. The complete address, describing the protocol, domain name, file name,\
    \ and fragment anchor if applicable, is contained in the `location.href` property.\
    \ Separate components of the complete address are contained in the `location.protocol`\
    \ (`http:` or `https:`), `location.host` (domain name), `location.pathname` (file\
    \ path), and `location.hash` (fragment anchor). Assigning a new URL to the `location`\
    \ property will cause the browser to load that page or other resource at that\
    \ address.\n\n![image](images/pg124_1.jpg)\n\n![image](images/1bl.jpg)Create an\
    \ HTML document with a paragraph that contains a hyperlink anchor\n\n```html\n\
    <p id=”info”>\n<a id=”frag”>Fragment Anchor</a>\n</p>\n```\n\n![image](images/htmlbl.jpg)\n\
    \nlocation.html\n\n![image](images/2bl.jpg)Next, in a script element, create a\
    \ self-invoking function that begins by initializing two variables\n\n```javascript\n\
    const info = document.getElementById( ‘info’ )\nlet jump = confirm( ‘Jump to Fragment?’\
    \ )\n```\n\n![image](images/3bl.jpg)Now, add a statement to change the window’s\
    \ location if the user has agreed to a request\n\n```javascript\nif ( jump )\n\
    {\n  location = location.href + ‘#frag’\n}\n```\n\n![image](images/4bl.jpg)Then,\
    \ add statements to write each component of the current location address in the\
    \ panel\n\n```javascript\ninfo.innerHTML += `<hr>Href: ‘ + location.href\ninfo.innerHTML\
    \ += `<br>Protocol: ‘ + location.protocol\ninfo.innerHTML += `<br>Host:‘ + location.host\n\
    info.innerHTML += `<br>Path:‘ + location.pathname\ninfo.innerHTML += `<br>Hash:\
    \ ‘ + location.hash\n```\n\n![image](images/5bl.jpg)Save the HTML document, then\
    \ open it in any browser to see a confirm dialog request a change of location\n\
    \n![image](images/6bl.jpg)Click the Cancel button to deny the request and see\
    \ the page load at its “root” location, as usual\n\n![image](images/forget.jpg)\n\
    \nA web browser can load a file of any supported MIME type – for example, the\
    \ MIME type of `image/png` for all PNG image files.\n\n![image](images/pg125_1.jpg)\n\
    \n![image](images/pg125_2.jpg)\n\n![image](images/7bl.jpg)Refresh the browser,\
    \ then click the OK button to accept the request and see the page load at its\
    \ fragment location\n\n![image](images/pg125_3.jpg)\n\n![image](images/pg125_4.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe location shown here is that of the page located\
    \ on a web server on the local system. If the page was located on your desktop,\
    \ the protocol would be `file:` and there would be no `host` value.\n\n## Travel\
    \ History\n\nThe web browser stores a history of the URLs visited in the current\
    \ session as an array within the `window` object’s `history` child object. Like\
    \ other arrays, this has a `length` property, but also `back()` and `forward()`\
    \ methods to move between elements. Alternatively, the `history` object’s `go()`\
    \ method accepts a positive or negative integer argument specifying how many elements\
    \ to move along the array. For example, `history.go( 1 )` moves forward one element,\
    \ and `history.go( -2 )` moves back two elements.\n\n![image](images/pg126_1.jpg)\n\
    \n![image](images/1bl.jpg)Create three identical HTML documents that contain an\
    \ empty paragraph and embed the same external script file\n\n```html\n<p id=”info”\
    \ > </p>\n<script src=”history.js” > </script>\n```\n\n![image](images/htmlbl.jpg)\n\
    \npage-1.html\n\npage-2.html\n\npage-3.html\n\n![image](images/2bl.jpg)Next, create\
    \ the script file with a self-invoking function that begins by initializing a\
    \ variable reference\n\n```javascript\nconst info = document.getElementById( ‘info’\
    \ )\n```\n\n![image](images/pg126_2.jpg)\n\nhistory.js\n\n![image](images/3bl.jpg)Now,\
    \ in the function block, add statements to write content into the empty paragraphs\n\
    \n```javascript\ninfo.innerHTML += `<a href=”page-1.xhtml”>Page 1</a> | ‘\ninfo.innerHTML\
    \ += `<a href=”page-2.xhtml”>Page 2</a> | ‘\ninfo.innerHTML += `<a href=”page-3.xhtml”>Page\
    \ 3</a’\ninfo.innerHTML += `<br>History Length: ‘ + history.length\ninfo.innerHTML\
    \ += `<br>Current Location: ‘ + location.pathname + ‘<br>’\n```\n\n![image](images/4bl.jpg)Then,\
    \ add statements to create buttons in the paragraphs\n\n```javascript\ninfo.innerHTML\
    \ += `<button onclick=”history.back( )”>Back</button>’\ninfo.innerHTML += `<button\
    \ onclick=”history.forward( )”>Forward</button>’\n```\n\n![image](images/5bl.jpg)Save\
    \ the HTML document and JavaScript script file in the same folder, then clear\
    \ your browser’s history\n\n![image](images/hot.jpg)\n\nTo clear the browser history\
    \ in the Google Chrome browser, click the ![image](images/pg126_i.jpg) button,\
    \ then select **More tools**, **Clear browsing data**, and click the **Clear data**\
    \ button.\n\n![image](images/6bl.jpg)Open the first page to see the initial history\
    \ length is 1\n\n![image](images/pg127_1.jpg)\n\n![image](images/7bl.jpg)Click\
    \ a link to load the third page and see the history length increase to 2\n\n![image](images/pg127_2.jpg)\n\
    \n![image](images/8bl.jpg)Click the Back button to return to the first page but\
    \ see the history length remain the same as 2\n\n![image](images/pg127_3.jpg)\n\
    \nThe URLs are stored in the `history` object array elements in a protected manner\
    \ so they cannot be retrieved as strings.\n\n![image](images/forget.jpg)\n\nIn\
    \ this example, each URL only gets added to the `history` array when moving to\
    \ a different page by clicking on a link. The `back()`, `forward()`, and `go()`\
    \ methods simply select an element in the `history` array so do not change its\
    \ `length` property.\n\n## Summary\n\n- The Document Object Model (DOM) is a hierarchical\
    \ tree representation of all components of a web page.\n- The `window` object\
    \ is the top level in the DOM hierarchy and has properties describing the browser\
    \ window.\n- The `screen` object is a child of the `window` object and has properties\
    \ describing the screen dimensions and color depth.\n- The `window` object has\
    \ `scrollBy()` and `scrollTo()` methods and `scrollX` and `scrollY` properties\
    \ that specify the scroll position.\n- Dialog messages can be displayed using\
    \ the `window` object’s `alert()`, `confirm()`, and `prompt()` methods.\n- A pop-up\
    \ window can be created using the `window` object’s `open()` method, but may be\
    \ obstructed by a pop-up blocker.\n- The `window` object’s `setTimeout()` method\
    \ creates a timer, which can be canceled later using the `clearTimeout()` method.\n\
    - The `navigator` object is a child of the `window` object and has properties\
    \ describing the browser and host platform versions.\n- The `window` object exists\
    \ in the global namespace so all its child objects need not include the window\
    \ part of the address.\n- Feature detection is used to identify the modern DOM.\n\
    - The `navigator.plugins` and `navigator.mimeTypes` properties are arrays that\
    \ contain details of supported features.\n- The `location` object is a child of\
    \ the `window` object and has properties describing the address of the loaded\
    \ document.\n- The `history` object is a child of the `window` object that contains\
    \ an array of visited locations in the current session.\n- The `history` object\
    \ has `back()`, `forward()`, and `go()` methods that are used to move through\
    \ pages in the current session.\n"
