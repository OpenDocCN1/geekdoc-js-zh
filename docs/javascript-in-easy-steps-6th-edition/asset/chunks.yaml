  raw: 'The evaluation of a condition and the execution of actions according to its
    result simply reflects the real-life thought process – for example, the actions
    you might execute on a summer day:


    **let temperature = readThermometer( )**


    **const tolerable = 25**


    **if ( temperature > tolerable )**


    **{**


    **turn_on_air-conditioning( )**


    **get_a_cool_drink( )**


    **stay_in_shade( )**


    **}**


    The conditional test is equivalent to if( condition === true ), but as it automatically
    performs the equality test for a true value there is no need to include === true
    in the parentheses.


    ![image](images/hot.jpg)


    It is recommended that you enclose even single statements to be executed within
    braces – to maintain a consistent coding style.


    ![image](images/1g.jpg)Create an HTML document with a self-invoking function that
    begins by initializing a Boolean variable


    **let flag = true**


    ![image](images/htmlg.jpg)


    if.html


    ![image](images/2g.jpg)Next, insert statements to perform conditional tests of
    the variable’s Boolean value


    **if( !flag )**


    **{**


    **console.log( ‘Power is OFF’ )**


    **}**


    **if( flag )**


    **{**


    **console.log( ‘Power is ON’ )**


    **}**


    ![image](images/3g.jpg)Now, insert statements to perform conditional tests of
    an expression that compares two integers


    **if( 7 < 2 )**


    **{**


    **console.log( ‘Failure’ )**


    **}**


    **if( 7 > 2 )**


    **{**


    **console.log( ‘Success’ )**


    **}**


    ![image](images/4g.jpg)Save the HTML document, then open it in your browser and
    launch the console to see which output statements get executed and which ones
    are ignored


    ![image](images/pg47_1.jpg)


    ![image](images/hot.jpg)


    The logical ! NOT operator is used here to invert the conditional test so it becomes
    equivalent to


    **if( flag === false )**


    ![image](images/hot.jpg)


    The script code that creates the function block is omitted from this example,
    and most further examples, to conserve page space. You can refer back to [here](#chapter01.xhtml_sec8)
    for instruction on how to create anonymous self-invoking functions.


    Branch Alternatives


    An if statement, which tests a condition for a Boolean value and only executes
    its statements when the result is true, provides a single branch that the script
    may follow. An alternative branch that the script can follow when the result is
    false can be provided by extending an if statement with the else keyword.


    ![image](images/pg48_1.jpg)


    An else statement follows after the if statement, like this:


    **if *( condition ) execute-this-statement-when-true***


    ***else execute-this-statement-when-false***


    An if else statement may also specify multiple statements to be executed by enclosing
    those statements within braces, like this:


    **if ( *condition* )**


    **{**


    ***execute-this-statement-when-true***


    ***execute-this-statement-when-true***


    **}**


    **else**


    **{**


    ***execute-this-statement-when-false***


    ***execute-this-statement-when-false***


    **}**


    Multiple branches can be provided by making subsequent conditional if tests at
    the start of each else statement block, like this:


    **if *( condition )***


    **{**


    ***execute-these-statements-when-true***


    **}**


    **else if *( condition )***


    **{**


    ***execute-these-statements-when-true***


    **}**


    **else if *( condition )***


    **{**


    ***execute-these-statements-when-true***


    **}**


    **else**


    **{**


    ***execute-these-statements-when-false***


    **}**


    An if else if statement might repeatedly test a variable for a range of values
    or might test a variety of conditions. The final else statement acts as a default
    when no conditions are found to be true.


    ![image](images/hot.jpg)


    Once a condition is found to be true in an if else statement, its associated statements
    are executed, then flow continues after the if else statement – without evaluating
    subsequent else statements.


    ![image](images/1g.jpg)Create an HTML document with a self-invoking function that
    begins by initializing two variables


    **let flag = false**


    **const num = 10**


    ![image](images/htmlg.jpg)


    else.html


    ![image](images/2g.jpg)Next, insert statements to perform conditional tests of
    the first variable’s Boolean value


    **if( !flag )**


    **{**


    **console.log( ‘Power is OFF’ )**


    **}**


    **else**


    **{**


    **console.log( ‘Power is ON’ )**


    **}**


    ![image](images/3g.jpg)Now, insert statements to perform conditional tests of
    the second variable’s numeric value


    **if( num === 5 )**


    **{**


    **console.log( ‘Number is Five’ )**


    **}**


    **else if( num === 10 )**


    **{**


    **console.log( ‘Number is Ten’ )**


    **}**


    **else**


    **{**


    **console.log( ‘Number is Neither Five nor Ten’ )**


    **}**


    ![image](images/4g.jpg)Save the HTML document, then open it in your browser and
    launch the console to see which output statements get executed and which ones
    are ignored


    ![image](images/pg49_1.jpg)


    ![image](images/forget.jpg)


    The else statement specifies an alternative when a conditional test is false,
    but an else if statement specifies a new conditional test.


    Switch Alternatives


    Conditionally branching script flow using if else statements is fine for testing
    just a few conditions but can become unwieldy when there are a large number of
    conditions to test. In that situation it is often both more efficient and more
    elegant to use a switch statement rather than if else statements.


    ![image](images/pg50_1.jpg)


    A switch statement works in an unusual way – it first evaluates a specified expression,
    then seeks a match for the resulting value. Where a match is found, the switch
    statement will execute one or more statements associated with that value, otherwise
    it will execute one or more statements specified as “default statements”.


    The switch statement begins by enclosing the expression to be evaluated within
    parentheses after the switch keyword. This is followed by a pair of { } braces
    that contain the possible matches. Each match value follows a case keyword and
    employs a colon : character to associate one or more statements to be executed.
    Importantly, each case must end with a break statement to exit the switch statement
    after its associated statements have executed.


    Optionally, a switch statement may include a final default alternative to associate
    one or more statements to be executed when none of the specified case values match
    the result of the expression evaluation.


    So the syntax of a switch statement looks like this:


    **switch ( *expression* )**


    **{**


    **case *value-1 : statements-to-be-executed-when-matched ; break***


    **case *value-2 : statements-to-be-executed-when-matched ; break***


    **case *value-3 : statements-to-be-executed-when-matched ; break***


    **default : *statements-to-be-executed-when-no-match-found***


    **}**


    There is no limit to the number of case values that can be included within a switch
    statement block, so this is an ideal way to match any one of tens, hundreds, or
    even thousands of different values.


    ![image](images/snake.jpg)


    Omission of the break statement allows the script to also execute statements associated
    with subsequent unmatching case values.


    ![image](images/1g.jpg)Create an HTML document with a self-invoking function that
    begins by declaring a variable


    **let day**


    ![image](images/htmlg.jpg)


    switch.html


    ![image](images/2g.jpg)Next, insert a switch statement to assign a value to the
    variable following the evaluation of an expression


    **switch( 5 - 2 )**


    **{**


    **case 1 : day = ‘Monday’ ; break**


    **case 2 : day = ‘Tuesday’ ; break**


    **case 3 : day = ‘Wednesday’ ; break**


    **case 4 : day = ‘Thursday’ ; break**


    **case 5 : day = ‘Friday’ ; break**


    **default : day = ‘Weekend’**


    **}**


    ![image](images/3g.jpg)Now, insert a statement to output the value assigned by
    the case statement that found a match


    **console.log( ‘It is ‘ + day )**


    ![image](images/4g.jpg)Save the HTML document, then open it in your browser and
    launch the console to see the assigned value in output


    ![image](images/pg51_1.jpg)


    ![image](images/forget.jpg)'
