    \ a number of bits to the right Example: **1000 >> 2 = 0010** |\n\n![image](images/forget.jpg)\n\
    \nMany JavaScript authors never use bitwise operators but it is useful to understand\
    \ what they are and how they may be used.\n\n![image](images/hot.jpg)\n\nA “byte”\
    \ has 8 bits, and each half of a byte is known as a “nibble” (4 bits). The binary\
    \ numbers in the examples in this table describe values stored in a nibble.\n\n\
    ![image](images/1r.jpg)Create an HTML document with a self-invoking anonymous\
    \ function that declares two variables\n\n```javascript\nfunction ( ) {\n  let\
    \ numOne = 10, numTwo = 5;\n  // Statements to be inserted here.\n} ( )\n```\n\
    \n![image](images/htmlr.jpg)\n\nbitwise.html\n\n![image](images/2r.jpg)Next, insert\
    \ statements to simply output strings that confirm the initial values stored in\
    \ each variable\n\n```javascript\nconsole.log( ‘numOne:‘ + numOne )\nconsole.log(\
    \ ‘numTwo: ‘ + numTwo )\n```\n\n![image](images/3r.jpg)Now, insert statements\
    \ to swap the values stored in each variable using bitwise operations\n\n```javascript\n\
