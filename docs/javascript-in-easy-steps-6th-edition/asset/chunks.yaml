    components for the year, month name, day of the month, and the day name:


    ![image](images/pg80_1.jpg)


    | **Method** | **Returns** |


    | **getFullYear( )** | Year as four digits (yyyy) |


    | **getMonth( )** | Month as index number (0-11) |


    | **getDate( )** | Day as number (1-31) |


    | **getDay( )** | Weekday as index number (0-6) |


    The Date object’s getFullYear( ) method returns the year as a four-digit number,
    such as 2025, and the Date object’s getDate( ) method returns the day number of
    the month – so that on the first day of the month it returns 1.


    For reasons of internationalization, getMonth( ) and getDay( ) return index number
    values that must be converted to the local language month and day names by the
    script. The conversion is easily made for month names by creating an array of
    all month names, starting with January, then using the index number returned by
    getMonth( ) to reference the appropriate month name from the array element.


    Similarly, the conversion is made for day names by creating an array of all day
    names, starting with Sunday, then using the index number returned by the getDay(
    ) method to reference the appropriate day name from the array element.


    The various components can then be assembled into a date string arranged according
    to the preferred date format of any locale.


    ![image](images/1p.jpg)Create an HTML document with a self-invoking function that
    begins by initializing three variables


    **const days = [ ‘Sun’, ‘Mon’, ‘Tue’, ‘Wed’, ‘Thu’, ‘Fri’, ‘Sat’ ]**


    **const months = [ ‘Jan’, ‘Feb’, ‘Mar’, ‘Apr’, ‘May’, ‘Jun’, ‘Jul’, ‘Aug’, ‘Sep’,
    ‘Oct’, ‘Nov’, ‘Dec’ ]**


    **const now = new Date( )**


    ![image](images/htmlp.jpg)


    calendar.html


    ![image](images/2p.jpg)Next, add statements to extract individual date components
    using methods of the Date object


    **let year = now.getFullYear( )**


    **let month = now.getMonth( )**


    **let dayNumber = now.getDate( )**


    **let dayName = now.getDay( )**


    ![image](images/3p.jpg)Now, add statements to convert the extracted index numbers
    to month name and day name values


    **month = months[ month ]**


    **dayName = days[ dayName ]**


    ![image](images/4p.jpg)Then, concatenate the date components into date strings
    – in both American and British date formats


    **let usDate = dayName + ‘, ‘ + month + ‘ ‘ + dayNumber + ‘, ‘ + year**


    **let ukDate = dayName + ‘, ‘ + dayNumber + ‘ ‘ + month + ‘, ‘ + year**


    ![image](images/5p.jpg)Finally, add statements to output each date string


    **console.log( ‘U.S. Date: ‘ + usDate )**


    **console.log( ‘U.K. Date: ‘ + ukDate )**


    ![image](images/6p.jpg)Save the HTML document, then open it in your browser and
    launch the console to see the formatted date strings


    ![image](images/pg81_1.jpg)


    ![image](images/forget.jpg)


    Month indexing starts at zero (0), not one (1) – so for example March is at index
    [2] not at [3].


    **Extract Time**


    A JavaScript Date object provides separate methods to extract each of its time
    components for the hour, the minute, the second, and the millisecond:


    ![image](images/pg82_1.jpg)


    | **Method** | **Returns** |


    | **getHours( )** | Hour as number (0-23) |


    | **getMinutes( )** | Minute as number (0-59) |


    | **getSeconds( )** | Second as number (0-59) |


    | **getMilliseconds( )** | Millisecond as number (0-999) |


    The Date object’s getHours( ) method returns the hour in 24-hour format – as a
    value in the range 0-23\. The getMinutes( ) and getSeconds( ) methods both return
    a value in the range 0-59\. There is also a getMilliseconds( ) method for even
    greater precision that returns a value in the range 0-999.


    The values of each component can be concatenated into a time string but it is
    often preferable to add a leading zero to single minute and second values for
    better readability. For example, 10:05:02 is preferable to 10:5:2.


    An appropriate greeting string can be created by examining the hour value to establish
    whether the user’s system time is currently morning, afternoon, or evening.


    For situations where a 12-hour time format is desirable, an “AM” or “PM” suffix
    can be created by examining the hour value and all PM hour values reduced by 12\.
    For example, 13:00 can be transformed to 1:00 PM.


