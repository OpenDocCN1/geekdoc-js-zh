    \ )` 方法的参数来替换它。\n\n![image](img/hot.jpg)\n\n你可以通过将属性名作为元素 `removeAttribute( )`\
    \ 方法的参数来移除属性。\n\n## 管理 Cookie\n\n出于安全考虑，JavaScript 无法在用户的硬盘上写入普通文件，但它可以写入“cookie”文件来存储少量数据。这些文件的大小限制为最大\
