- fmt: "\nComputer date and time is measured numerically as the period of elapsed\
    \ time since January 1, 1970 00:00:00 – a point in time often referred to as the\
    \ “epoch”. In JavaScript, the elapsed time is recorded as the number of milliseconds\
    \ since the `epoch`. This figure can be extracted from a `Date` object using its\
    \ `getTime()` method, and may be subtracted from that of another `Date` object\
    \ to calculate an elapsed period between two points in a script – for example,\
    \ to calculate the period taken to execute a loop.\n\nA string of the components\
    \ within a `Date` object can be extracted using its `toString()` method, or an\
    \ equivalent converted to UTC time using its `toUTCString()` method.\n\nJavaScript\
    \ can determine which time zone the user is located, assuming the system is correctly\
    \ set to the local time, by examining the value returned by a current `Date` object’s\
    \ `getTimezoneOffset()` method. This returns an integer value that is the number\
    \ of minutes by which the current local time differs from UTC time. The calculation\
    \ is performed in minutes rather than hours because some time zones are offset\
    \ by other than one-hour intervals – for example, Newfoundland, Canada is UTC\
    \ -3:30 (during daylight saving time).\n\nThe time zone offset value can be used\
    \ to provide localization for U.S. time zones but they must be adjusted by subtracting\
    \ 60 (minutes) for periods of daylight saving time. The example calls `getMonth()`\
    \ and `getDate()` methods of a `Date` object to adjust the time zone offset value\
    \ if daylight saving time is operation at the current date.\n\n![image](images/hot.jpg)\n\
    \nMore examples follow #chapter04.xhtml that demonstrate how to use components\
    \ of a `Date` object by calling its methods.\n\n![image](images/1p.jpg)\n\nCreate\
    \ an HTML document with a self-invoking function that begins by initializing three\
    \ variables\n\n```javascript\nconst now = new Date()\nlet offset = now.getTimezoneOffset()\n\
    let dst = 60\n```\n\n![image](images/htmlp.jpg)\ndate.html\n\n![image](images/2p.jpg)\n\
    \nNext, add statements to turn off daylight saving time from November 3 to March\
    \ 10\n\n```javascript\nif (now.getMonth() < 3 && now.getDate() < 10) {\n    dst\
    \ = 0\n}\nif (now.getMonth() > 9 && now.getDate() > 2) {\n    dst = 0\n}\n```\n\
    \n![image](images/3p.jpg)\n\nNow, add a statement to establish a time zone\n\n\
    ```javascript\nswitch (offset) {\n    case 300:\n        offset = 'East Coast';\n\
    \        break;\n    case 360:\n        offset = 'Central';\n        break;\n\
    \    case 420:\n        offset = 'Mountain';\n        break;\n    case 480:\n\
    \        offset = 'Pacific';\n        break;\n    default:\n        offset = 'All';\n\
    }\n```\n\n![image](images/4p.jpg)\n\nFinally, add statements to output date and\
    \ time information, and an appropriate greeting message\n\n```javascript\nconsole.log('System\
    \ Time: ' + now.toString())\nconsole.log('UTC (GMT) Time: ' + now.toUTCString())\n\
    console.log('Welcome to ' + offset + ' Visitors')\n```\n\n![image](images/5p.jpg)\n\
    \nSave the HTML document, then open it in your browser and launch the console\
    \ to see the elements\n\n![image](images/pg79.jpg)\n\n![image](images/snake.jpg)\n\
    \nThe `getMonth()` method returns a zero-based index number in which March is\
    \ at position 2 – more on this in the next example #chapter04.xhtml.\n\n![image](images/hot.jpg)\n\
    \nDiscovery of the user’s local time zone could be used to direct the browser\
    \ to a page relevant to that time zone – for example, a page containing only Californian\
    \ distributors for users in the Pacific time zone. But be aware that system time\
    \ information can be easily changed by the user to any time, date, or time zone,\
    \ so may not necessarily report their actual location.\n\n### Extract Calendar\n\
    \nA JavaScript `Date` object provides separate methods to extract each of its\
    \ date components for the year, month name, day of the month, and the day name:\n\
    \n![image](images/pg80_1.jpg)\n\n| Method | Returns |\n| :--- | :--- |\n| `getFullYear()`\
    \ | Year as four digits (yyyy) |\n| `getMonth()` | Month as index number (0-11)\
    \ |\n| `getDate()` | Day as number (1-31) |\n| `getDay()` | Weekday as index number\
    \ (0-6) |\n\nThe `Date` object’s `getFullYear()` method returns the year as a\
    \ four-digit number, such as 2025, and the `Date` object’s `getDate()` method\
    \ returns the day number of the month – so that on the first day of the month\
    \ it returns 1.\n\nFor reasons of internationalization, `getMonth()` and `getDay()`\
    \ return index number values that must be converted to the local language month\
    \ and day names by the script. The conversion is easily made for month names by\
    \ creating an array of all month names, starting with January, then using the\
    \ index number returned by `getMonth()` to reference the appropriate month name\
    \ from the array element.\n\nSimilarly, the conversion is made for day names by\
    \ creating an array of all day names, starting with Sunday, then using the index\
    \ number returned by the `getDay()` method to reference the appropriate day name\
    \ from the array element.\n\nThe various components can then be assembled into\
    \ a date string arranged according to the preferred date format of any locale.\n\
    \n![image](images/1p.jpg)\n\nCreate an HTML document with a self-invoking function\
    \ that begins by initializing three variables\n\n```javascript\nconst days = ['Sun',\
    \ 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']\nconst months = ['Jan', 'Feb', 'Mar',\
    \ 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']\nconst now =\
    \ new Date()\n```\n\n![image](images/htmlp.jpg)\ndate.html\n\n![image](images/2p.jpg)\n\
    \nNext, add statements to extract individual components using `Date` object\n\n\
    ```javascript\nlet year = now.getFullYear()\nlet month = now.getMonth()\nlet dayNumber\
    \ = now.getDate()\nlet dayName = now.getDay()\n```\n\n![image](images/3p.jpg)\n\
    \nNow, add statements to convert the index numbers to month name and day name\n\
    \n```javascript\nlet monthName = months[month]\nlet dayName = days[dayName]\n\
    ```\n\n![image](images/4p.jpg)\n\nThen, concatenate the date components into date\
    \ strings – in both American and British formats\n\n```javascript\nlet usDate\
    \ = monthName + ' ' + dayNumber + ', ' + year\nlet ukDate = dayName + ', ' + monthName\
    \ + ' ' + year\n```\n\n![image](images/5p.jpg)\n\nFinally, add statements to output\
    \ date string\n\n```javascript\nconsole.log('U.S. Date: ' + usDate)\nconsole.log('U.K.\
    \ Date: ' + ukDate)\n```\n"
