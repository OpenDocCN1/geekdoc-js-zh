    The break keyword is also used as a terminator in switch statements.


    ![image](images/snake.jpg)


    Don’t be tempted to use break statements to exit loops in place of the regular
    conditional tests that form part of the loop structure.


    Catch Errors


    Sections of script in which it is possible to anticipate errors, such as those
    handling user input, may be enclosed in a try catch structure to handle “exception”
    errors. The statements to be executed are contained within the braces of a try
    block, and exceptions are passed as an argument to the ensuing catch block for
    handling. Optionally, this may be followed by a finally block, containing statements
    to execute after exceptions have been handled.


    ![image](images/pg60_1.jpg)


    JavaScript recognizes error objects of Error, EvalError, InternalError, RangeError,
    ReferenceError, SyntaxError, TypeError, and URIError. These may be automatically
    created and passed to the catch block by the parser or manually created with the
    new keyword and a constructor method, then passed using the throw keyword.


    Each error object can have a name property and a message property to allow the
    catch block to describe its nature. The message is specified as an argument to
    the constructor for error objects created manually, but is predefined otherwise.


    Alternatively, a string may be passed to the catch block by the throw keyword
    to identify the error. An appropriate action can then be determined by examining
    the string value.


