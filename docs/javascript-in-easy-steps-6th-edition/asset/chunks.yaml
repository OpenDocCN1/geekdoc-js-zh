- fmt: "\n```javascript\nd.setTime( d.getTime( ) + ( days * 86400000 ) )\n```\n\n\
    ```javascript\ndocument.cookie = key + ‘=’ + encodeURI( value ) + ‘;expires=’\
    \ + d.toUTCString( ) + ‘;’\n}\n```\n\n![image](images/pg138_2.jpg)\n\ncookie.js\n\
    \n![image](images/snake.jpg)\n\nThe cookie expiry date cannot normally be read\
    \ by JavaScript. If it is required to be readable, also add it to the list of\
    \ cookie values.\n\n![image](images/hot.jpg)\n\nThe long number used to set the\
    \ expiry here is the number of milliseconds in one day.\n\n![image](images/2v.jpg)Then,\
    \ add a getter function to accept a key argument\n\n```javascript\nfunction getCookie(\
    \ key ) {\n  if( document.cookie )\n  {\n    const pairs = decodeURI( document.cookie\
    \ ).split( ‘;’ )\n    let i, name, value\n    for( i = 0 ; i < pairs.length ;\
    \ i++ )\n    {\n      name = ( pairs[ i ].split( ‘=’ )[ 0 ] ).trim( )\n      if(\
    \ name === key ) { value = pairs[ i ].split( ‘=’ )[ 1 ] }\n    }\n    return value\n\
    \  }\n}\n```\n\n![image](images/snake.jpg)\n\nNotice that the `trim( )` method\
    \ is used here to remove any whitespace from the ends of the name.\n\n![image](images/3v.jpg)Next,\
    \ create an HTML document that contains an empty list and imports the external\
    \ JavaScript file\n\n```html\n<ul id=”list”></ul> <script src=”cookie.js”></script>\n\
    ```\n\n![image](images/htmlv.jpg)\n\ncookie.html\n\n![image](images/4v.jpg)Now,\
    \ in another script element, create a self-invoking function that sets a cookie,\
    \ then gets its values\n\n```javascript\nsetCookie( ‘User’,’Mike McGrath,12345’,\
    \ 7 )\nconst list = document.getElementById( ‘list’ )\nlet i, value = getCookie(\
    \ ‘User’ )\nif( value.indexOf( ‘,’ ) )\n{\n  value = value.split( ‘,’ )\n}\nfor(\
    \ i = 0 ; i < value.length ; i++ )\n{\n  list.innerHTML += ‘<li>’ + value[ i ]\n\
    }\n```\n\n![image](images/5v.jpg)Save the HTML document and JavaScript file in\
    \ the same folder on a web server, then open the web page in your browser to see\
    \ the retrieved cookie values\n\n![image](images/pg139_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nA cookie may be deleted by setting its expiry date to a date prior to the current\
    \ actual date.\n\n## Load Events\n\n![image](images/pg140_1.jpg)\n\nThe DOM allows\
    \ JavaScript to react to “events” that occur on a web page by the script author\
    \ providing functions that will be executed when a particular event happens. These\
    \ functions are known as “event-handlers”, and can react to events such as:\n\n\
    - **load** – fires when the page has loaded into the browser\n- **click** – fires\
    \ when the user clicks a mouse button\n- **keydown** – fires when the user presses\
    \ a keyboard key\n- **change** – fires when the user modifies an input field\n\
    - **submit** – fires when the user submits an HTML form\n\nTo react to a load\
    \ event, an event-handler function name can be nominated by assignment to the\
    \ window object’s `onload` property, using this syntax:\n\n`onload=*function-name*`\n\
    \nAlternatively, the event name and the event-handler function name can be specified\
    \ as arguments to the window object’s `addEventListener( )` method, but the event\
    \ name must be enclosed within quotes, like this:\n\n`addEventListener( ‘load’\
    \ , *function-name* )`\n\nAn event-handler for the load event might be used to\
    \ examine the browser’s features, and can usefully check for cookie data.\n\n\
    ![image](images/1v.jpg)Create an HTML document that contains a paragraph with\
    \ a link to the cookies example [here](#chapter07.xhtml_sec67), an empty paragraph,\
    \ and imports the external JavaScript file from the previous example\n\n```html\n\
    <p><a href=”cookie.html”>Link</a></p>\n<p id=”info”></p>\n<script src=”cookie.js”></script>\n\
    ```\n\n![image](images/htmlv.jpg)\n\nload.html\n\n![image](images/2v.jpg)Next,\
    \ in a script element, nominate an event-handler function to be executed when\
    \ the page has loaded\n\n```javascript\naddEventListener( ‘load’, welcome )\n\
    ```\n\n![image](images/hot.jpg)\n\nThere is also an unload event that fires when\
    \ the user leaves the page. Its event-handler can be nominated by assignment to\
    \ the `window.onunload` property, or can be specified to the `addEventListener(\
    \ )` method.\n\n![image](images/3v.jpg)Now, add the event-handler function to\
    \ greet the user\n\n```javascript\nfunction welcome( ) {\n  const info = document.getElementById(\
    \ ‘info’ )\n  if( getCookie( ‘Name’ ) )\n  {\n    info.innerHTML = ‘Welcome Back,\
    \ ‘ + getCookie( ‘Name’ )\n  }\n  else\n  {\n    let name = prompt( ‘Please Enter\
    \ Your Name’, ‘User’ )\n    setCookie( ‘Name’, name, 7 )\n    info.innerHTML =\
    \ ‘Welcome, ‘ + name\n  }\n}\n```\n\n![image](images/forget.jpg)\n\nThe second\
    \ argument to the `prompt( )` method is the default input value.\n\n![image](images/4v.jpg)Save\
    \ the HTML document and open it in your browser, – enter your name, follow the\
    \ link, then click the back button\n\n![image](images/pg141_1.jpg)\n\n![image](images/pg141_2.jpg)\n\
    \n![image](images/pg141_3.jpg)\n\n![image](images/pg141_4.jpg)\n\n## Mouse Events\n\
    \nEvent-handler functions that execute when the user clicks on a particular object\
    \ in the HTML document can be nominated by assigning the function name to the\
    \ object’s `onclick` and `ondblclick` properties. These respond to the “click”\
    \ event that fires when the user clicks the mouse button once, and the “dblclick”\
    \ event that fires when the mouse button is pressed twice in quick succession.\n\
    \n![image](images/pg142_1.jpg)\n\nAdditionally, an object’s `onmousedown` and\
    \ `onmouseup` properties can nominate event-handler functions to execute when\
    \ the mouse button gets pressed down, firing the “mousedown” event, and when it\
    \ gets released, firing the “mouseup” event.\n\nSimilarly, an object’s `onmouseover`\
    \ and `onmouseout` properties can nominate event-handler functions to execute\
    \ when the mouse is placed over an element, firing the “mouseover” event, and\
    \ when it moves off the element, firing the “mouseout” event. These are often\
    \ used to create a rollover effect, such as changing the value of that element’s\
    \ `style.background` property to a different color value.\n\nAlternatively, the\
    \ event name and the event-handler function name can be specified as arguments\
    \ to that object’s `addEventListener( )` method. This can be used just like the\
    \ window object’s `addEventListener( )` method in the previous example to nominate\
    \ a function by name, or you can write a function definition inline as the second\
    \ argument.\n\nWhen an event occurs, an event object can be passed to an inline\
    \ event-handler function. This has a `type` property that identifies the name\
    \ of that event.\n\n![image](images/1v.jpg)Create an HTML document that contains\
    \ two paragraphs and a button\n\n```html\n<p id=”box”>Target</p>\n<p id=”info”>Place\
    \ Mouse Over</p>\n<button id=”btn”>Click Me</button>\n```\n\n![image](images/htmlv.jpg)\n\
    \nmouse.html\n\n![image](images/2v.jpg)Next, in a script element, create a self-invoking\
    \ function that begins by initializing two variables\n\n```javascript\n( function\
    \ ( ) {\n  const box = document.getElementById( ‘box’ )\n  const btn = document.getElementById(\
    \ ‘btn’ )\n  // Statements to be inserted here.\n} ) ( )\n```\n\n![image](images/hot.jpg)\n\
    \nAny visible object in an HTML document can have an event-handler assigned for\
    \ its **click** event, so that object can act like a button. Most developers prefer\
    \ to nominate event-handler functions with the `addEventListener( )` method, rather\
    \ than by assignment to the `onclick` property.\n\n![image](images/3v.jpg)Now,\
    \ insert statements to nominate inline event-handlers that will pass arguments\
    \ to a second function\n\n```javascript\nbox.addEventListener( ‘mouseover’,\n\
    \  function ( event ) { reactTo( event, ‘Red’ } ) )\nbox.addEventListener( ‘mouseout’,\n\
    \  function ( event ) { reactTo( event,‘Purple’ ) } )\nbox.addEventListener( ‘mousedown’,\n\
    \  function ( event ) { reactTo( event,‘Green’ ) } )\nbox.addEventListener( ‘mouseup’,\n\
    \  function ( event ) { reactTo( event,‘Blue’ ) } )\nbtn.addEventListener( ‘click’,\n\
    \  function ( event ) { reactTo( event,‘Orange’ ) } )\n```\n\n![image](images/4v.jpg)Finally,\
    \ add a second function to display the event type and change the first paragraph’s\
    \ background color\n\n```javascript\nfunction reactTo( event, color ) {\n```\n"
