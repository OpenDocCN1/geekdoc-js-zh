    **Match Patterns**


    The RegExp object is a JavaScript built-in object that can contain a “regular
    expression” pattern – describing a string of characters. Regular expressions are
    useful for text validation and for search- and-replace operations within text
    by matching their specified pattern to a section of the text.


    ![image](images/pg86_1.jpg)


    A regular expression pattern may consist entirely of literal characters between
    / / describing a character string to match. For example, the regular expression
    /wind/ finds a match in “windows” – the pattern quite literally matches the string
    in the text. More typically, a regular expression pattern consists of a combination
    of literal characters and these “metacharacters”:


    | **Metacharacter** | **Matches** | **Example** |


    | **.** | **Any Characters** | **ja..pt** |


    | **^** | **First Characters** | **^ja** |


    | **$** | **Final Characters** | **....pt$** |


    | ***** | **Zero Or More Repetitions** | **ja*** |


    | **+** | **One Or More Repetitions** | **ja+** |


    | **?** | **Zero Or One Repetition** | **ja?** |


    | **{ }** | **Multiple Repetitions** | **ja{ 3 }** |


    | **[ ]** | **Character Class** | **[ a-z ]** |


    | **\** | **Any Digits** | **\d** |


    | **&#124;** | **Either Optional Character** | **a &#124; b** |


    | **( )** | **Expression Group** | **( ... )** |


    The pattern may also include an i modifier after the final **/** character, to
    perform a case-insensitive search, or a g modifier to perform a global search
    for all matches of the pattern.


    A RegExp object has a test( ) method that returns true when a match is found,
    or false otherwise. A RegExp object also has an exec( ) method that returns a
    null value if no match was found, or the text found if the search was successful,
    and its index property, which contains the character position where the match
    begins.


    ![image](images/snake.jpg)


    The topic of regular expressions is extensive and beyond the remit of this book
    – but a brief introduction is provided here for completeness.


    ![image](images/forget.jpg)


    The character class **[a-z]** matches only lowercase characters but **[a-z0-9]**
    also matches digits.


