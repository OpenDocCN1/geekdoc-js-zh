    Loop For


    A loop is a structure containing a test condition and one or more statements that
    are repeatedly executed while the test condition is met. Each single examination
    of the condition and execution of the statements is called an “iteration”. When
    the test condition is not met, no further iterations are made and flow continues
    at the next statement following the loop structure.


    ![image](images/pg52_1.jpg)


    Perhaps the most commonly used loop structure in JavaScript is the for loop, which
    has this syntax:


    **for ( *initializer ; condition ; modifier* ) { *statements-to-be-executed* }**


    The parentheses after the for keyword contain three expressions that control the
    number of iterations the loop will perform:


    •Initializer – a statement that specifies the initial value of a variable that
    will be used to count the number of loop iterations. Traditionally, this trivial
    counter variable is simply named “i”.


    •Condition – an expression that is tested for a Boolean true value on each iteration.
    When the evaluation returns true, the loop statements are then executed to complete
    that iteration. If the evaluation returns false, the statements are not executed
    and the loop ends. Typically, the condition examines the value of the loop counter
    variable.


    •Modifier – a statement that modifies a value in the test condition so that at
    some point its evaluation will return false. Typically, this will increment, or
    decrement, the loop counter variable.


    For example, a for loop structure to execute a set of statements one hundred times
    might look like this:


    **let i**


    **for ( i = 0 ; i < 100 ; i++ ) { *statements-to-be-executed* }**


    In this case, the counter variable is incremented on each iteration until its
    value reaches 100, upon which the evaluation returns false and the loop ends.


    ![image](images/snake.jpg)


    Unless the modifier enables the evaluation to return false at some point, an infinite
    loop is created that will run forever.


