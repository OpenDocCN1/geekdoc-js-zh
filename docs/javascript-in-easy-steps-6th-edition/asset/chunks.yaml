    **</script>**


    ![image](images/3r.jpg)Now, begin a script at the end of the document’s body section
    with a function that attempts to seek the user location when the HTML document
    has loaded


    **function init( ) {**


    **if ( navigator.geolocation ) {**


    **document.getElementById( ‘msg’ ).innerText =**


    **‘Geolocation service is trying to find you...’**


    **navigator.geolocation.getCurrentPosition( success , fail )**


    **} else {**


    **document.getElementById( ‘msg’ ).innerText =**


    **‘Your browser does not support Geolocation service’**


    **}**


    **}**


    **document.addEventListener( ‘DOMContentLoaded’, init )**


    ![image](images/4r.jpg)Then, add a function to display a message if the attempt
    fails


    **function fail( position ) {**


    **document.getElementById( ‘msg’ ).innerText =**


    **‘Geolocation service cannot find you at this time’**


    **}**


    ![image](images/forget.jpg)


    In this example, the **navigator.geolocation** object provides the **getCurrentPosition(
    )** method that must specify functions to handle success and failure. These functions
    must each accept a returned **position** object argument, as that contains the
    coordinates, or error details.


    ![image](images/5r.jpg)Finally, add a success function to display the retrieved
    coordinates and a map when the attempt succeeds


    **function success( position ) {**


    **const lat = position.coords.latitude**


    **const lng = position.coords.longitude**


    **document.getElementById( ‘msg’ ).innerHTML =**


    **‘Found you at...<br>Latitude: ‘ + lat + ‘ , Longitude: ‘ + lng**


    **const latlng = new google.maps.LatLng( lat , lng )**


    **const options = { zoom: 18 , center : latlng ,**


    **mapTypeId: google.maps.MapTypeId.ROADMAP }**


    **const map = new google.maps.Map**


    **( document.getElementById( ‘map’ ) , options )**


    **const marker = new google.maps.Marker**


    **( { position: latlng , map: map , title: ‘You are here’ } )**


    **}**


    ![image](images/6r.jpg)Save the HTML document in the “htdocs” folder of a local
    web server, then open the web page and allow your location to be known – to get
    magically pinpointed


    ![image](images/pg185_1.jpg)


    ![image](images/pg185_2.jpg)


    ![image](images/hot.jpg)


    To replicate this example you will first need to sign into the Google Cloud Platform
    online at **[cloud.google.com](http://cloud.google.com)** and create a new project.
    Then, enable the Maps JavaScript API for your project and get an API key. Replace
    **API_KEY** in Step 2 with your own key to run the example.


    ![image](images/common3.jpg)


    Discover more about the Geolocation API online at **[dev.w3.org/geo/api](http://dev.w3.org/geo/api)**


    **Summary**


    •AJAX allows web pages to be updated by requesting data from a web server without
    interrupting other operations.


    •A successful XMLHttpRequest stores text in its responseText property and XML
    data in its responseXML property.


    •SVG graphics embedded in an HTML document maintain an SVG DOM node tree of all
    their elements and attributes.


    •The getSVGDocument( ) method creates a reference object of elements, attributes,
    and text in an SVG document.


    •The Canavas2D API provides methods and properties that can paint shapes and text
    onto a canvas area.


    •The getContext( ) method creates a reference object of a canvas area.


    •The Web Storage API provides a long term localStorage object and a sessionStorage
    object for temporary storage.


    •Items can be stored in localStorage or sessionStorage using the setItem( ) method
    to specify a key and the data.


    •The Drag-and-Drop API allows the user to drag page objects and drop them onto
    a target.


    •Event-handlers need to be scripted for dragstart, dragover, and drop events to
    create a drag and drop interface.


    •The Messaging API allows plain text messages to be securely sent between documents
    – even those on different domains.


    •To receive a message, the receiving document must correctly identify the domain
    hosting the sending document.


    •The Geolocation API provides the ability to pinpoint the user’s location if they
    consent to share location details.


    •Google Location Services returns the user’s estimated latitude and longitude
    coordinates.


    •Location coordinates can be displayed on the page and supplied to Google Maps
    to acquire a map at that location.


