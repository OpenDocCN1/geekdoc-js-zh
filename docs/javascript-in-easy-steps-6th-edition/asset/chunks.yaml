    \ ‘SVG Text’ ) } )\n```\n\n![image](images/6r.jpg)Save the HTML and SVG documents\
    \ in the “htdocs” folder of a web server, then open the web page in your browser\
    \ and enter some text – click the button and circle to see your text move magically\
    \ between HTML and SVG\n\n![image](images/pg175_1.jpg)\n![image](images/pg175_2.jpg)\n\
    ![image](images/pg175_3.jpg)\n![image](images/hot.jpg)\n\nNotice that in the SVG\
    \ DOM the actual text is contained in the `wholeText` property of the `lastChild`\
    \ node of the SVG `<text>` element.\n\n![image](images/common3.jpg)\n\nDiscover\
    \ more about the SVG DOM online at **[w3.org/TR/SVG11/svgdom.html](http://www.w3.org/TR/SVG11/svgdom.html)**\n\
    \n# Paint Canvas\n\n![image](images/pg176_1.jpg)\n\nIn HTML, the `<canvas>` element\
    \ creates a bitmap canvas area on the page in which JavaScript can paint shapes\
    \ and text using methods and properties of the Canavas2D API. Animations can easily\
    \ be created on a canvas simply by repeatedly clearing the current canvas then\
    \ repainting it with shapes at a modified position faster than the human eye can\
    \ detect. The fundamental components of a canvas animation script are:\n\n•Initialize\
    \ a Context object and shape starting positions.\n• Clear the canvas, then paint\
    \ shapes onto the canvas.\n• Calculate new shape positions for the next repaint.\n\
    \n![image](images/1r.jpg)Create an HTML document that includes a colored canvas\
    \ area in the body section\n\n```html\n<canvas id=“canvas” width=“500” height=“150”\
    \ style=“background: Bisque; border: 2px solid Tomato”>\n[Canvas Area]\n</canvas>\n\
    ```\n\n![image](images/htmlr.jpg)\n\ncanvas.html\n\n![image](images/2r.jpg)Next,\
    \ begin a script with a function that initializes a context object property after\
    \ the HTML DOM content has loaded, then initializes variables with the canvas\
    \ size, X and Y coordinates for the starting position of a “ball”, and its direction\
    \ step size\n\n```javascript\nfunction init( ) {\n  const canvas = document.getElementById(\
    \ ‘canvas’ )\n  if ( canvas.getContext ) {\n    const context = canvas.getContext(\
    \ ‘2d’ )\n    const cw = canvas.width\n    const ch = canvas.height\n    let x\
    \ = 5 , y = 44 , dx = 5 , dy = 5\n    context.fillStyle = ‘Red’\n    // Statements\
    \ to be inserted here.\n  }\n}\n\ndocument.addEventListener( ‘DOMContentLoaded’,\
    \ init )\n```\n\n![image](images/hot.jpg)\n\nTo paint on a canvas, the script\
    \ must first create a `CanvasRenderingContext2D` object that has the painting\
    \ methods and properties. Here, the object is assigned to the variable named `context`.\
    \ Notice that the initializing function gets called when the `DOMContentLoaded`\
    \ event fires.\n\n![image](images/3r.jpg)Now, insert statements to calculate new\
    \ X and Y coordinates and call a function to paint the ball onto the canvas every\
    \ 25 milliseconds\n\n```javascript\nsetInterval( function( ) {\n  if ( ( x + dx\
    \ > cw-30 ) || ( x + dx < 10 ) ) dx = -dx\n  if ( ( y + dy > ch-30 ) || ( y +\
    \ dy < 10 ) ) dy = -dy\n  x += dx\n  y += dy\n  paint( context, cw, ch, x, y )\
    \ } , 25 )\n```\n\n![image](images/4r.jpg)Finally, add the function to actually\
    \ paint the ball onto the canvas\n\n```javascript\nfunction paint( context, cw,\
    \ ch, x, y ) {\n  context.clearRect( 0, 0, cw, ch )\n  context.beginPath( )\n\
    \  context.arc( x, y, 30, 0, ( Math.Pi * 2 ), true )\n  context.fill( )\n}\n```\n\
    \n![image](images/5r.jpg)Save the HTML document and script, then open the web\
    \ page in your browser to see the animated ball magically bounce around the canvas\n\
    \n![image](images/pg177_1.jpg)\n![image](images/pg177_2.jpg)\n![image](images/hot.jpg)\n\
    \nNotice how the polarity of the direction step gets reversed when the ball collides\
    \ with a perimeter – so it doesn’t bounce right off the canvas.\n\n![image](images/hot.jpg)\n\
    \nCreate static background and borders as styles – so they need not be repeatedly\
    \ painted.\n\n![image](images/common3.jpg)\n\nDiscover more about the Canvas2D\
    \ API online at **[w3.org/TR/2dcontext](http://www.w3.org/TR/2dcontext)**\n\n\
    # Store Data\n\nThe ability to store user data is supported by the excellent Web\
    \ Storage API that makes storing user data a breeze. This provides a `localStorage`\
    \ object, which retains stored data even after the browser has been closed, and\
    \ the `sessionStorage` object, which retains stored data only until the browser\
    \ gets closed. Each of these objects has identical methods to store and retrieve\
    \ data. The `setItem()` method requires two arguments to specify a key and the\
    \ data to be stored – for example, using the key “Name” in `localStorage.setItem(\
    \ “Name”, “Mike” )`. Stored data can then be retrieved by specifying the key as\
    \ the sole argument to the `getItem()` method, or removed by specifying the key\
    \ as the sole argument to a `removeItem()` method. Additionally, all stored items\
    \ can be deleted using the `clear()` method – without any arguments.\n\n![image](images/1r.jpg)Create\
    \ an HTML document that contains a fieldset with a text input and three buttons\n\
    \n```html\n<fieldset> <legend id=”legend” >Enter Data</legend>\n<input id=”data”\
    \ type=”text” >\n<button onclick=”store( )”>Store Data</button>\n<button onclick=”recall(\
    \ )”>Recall Data</button>\n<button onclick=”remove( )”>Reset</button> </fieldset>\n\
    ```\n\n![image](images/htmlr.jpg)\n\nwebstorage.html\n\n![image](images/2r.jpg)Next,\
    \ create an event-handler function for the first button – to save the data in\
    \ local storage if valid\n\n```javascript\nfunction store( ) {\n  let data = document.getElementById(\
    \ ‘data’ ).value\n  if( data === ‘‘ ) { return false } else {\n    localStorage.setItem(\
    \ ‘ls_data’ , data )\n    document.getElementById( ‘data’ ).value = ‘‘\n    document.getElementById(\
    \ ‘legend’ ).innerText =\n    localStorage.getItem( ‘ls_data’ ) + ‘ - Is Stored’\
    \ )\n  }\n}\n```\n\n![image](images/3r.jpg)Next, add an event-handler function\
    \ for the second button – to retrieve and display the data in local storage\n\n\
    ```javascript\nfunction recall( ) {\n  if ( localStorage.getItem( ‘ls_data’ )\
    \ === null ) {\n    document.getElementById( ‘legend’ ).innerText =\n    ‘Enter\
    \ Data’ ; return false } else {\n    document.getElementById( ‘data’ ).value =\
    \ ‘‘\n    document.getElementById( ‘legend’ ).innerText =\n    ‘Stored Data: ‘\
    \ + localStorage.getItem( ‘ls_data’ )\n  }\n}\n```\n\n![image](images/snake.jpg)\n\
    \nAll data in `localStorage` and `sessionStorage` is stored as string values –\
    \ so adding retrieved values of 5 and 7 will get concatenated as 57.\n\n![image](images/forget.jpg)\n\
    \nPages must be servedvia HTTP (from a web server) to use Web Storage. It provides\
    \ an alternative to cookie storage and offers a much larger capacity of at least\
    \ 5MB.\n\n![image](images/4r.jpg)Finally, add an event-handler function for the\
    \ third button – to remove the data in local storage\n\n```javascript\nfunction\
    \ remove( ) {\n  if ( localStorage.getItem( ‘ls_data’ ) === null ) {\n    document.getElementById(\
    \ ‘legend’ ).innerText =\n    ‘Enter Data’ ; return false } else {\n    document.getElementById(\
    \ ‘legend’ ).innerText =\n    localStorage.getItem( ‘ls_data’ ) + ‘ Is Removed’\n\
    \    localStorage.remove( ‘ls_data’ )\n    document.getElementById( ‘data’ ).value\
    \ = ‘‘\n  }\n}\n```\n"
