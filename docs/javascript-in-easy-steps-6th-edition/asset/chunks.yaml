    # Date 对象操作


    `Date` 对象的时间组件 are based upon user’s system time – which may not be accurate.


    ![image](images/1p.jpg)


    Create an HTML document with a self-invoking function that begins by initializing
    variables:


    ```javascript

    const now = new Date()

    let hour = now.getHours()

    let minute = now.getMinutes()

    let second = now.getSeconds()

    let millisecond = now.getMilliseconds()

    ```


    ![image](images/htmlp.jpg)

    time.html


    ## 设置日期


    Next, add statements to prefix a zero to minute and second values below 10:


    ```javascript

    if (minute < 10) { minute = ''0'' + minute }

    if (second < 10) { second = ''0'' + second }

    ```


    ![image](images/2p.jpg)


    Now, concatenate the time components into a string, then output that string:


    ```javascript

    let time = ''It is now: '' + hour + '':'' + minute + '':'' + second + ''.'' +
    millisecond

    console.log(time)

    ```


    ![image](images/3p.jpg)


    Then, output a greeting appropriate to the current time:


    ```javascript

    let greeting = ''Morning!''

    if (hour > 12) { greeting = ''Afternoon!'' }

    if (hour > 17) { greeting = ''Evening!'' }

    console.log(greeting)

    ```


    ![image](images/4p.jpg)


    Finally, output the time in 12-hour format:


    ```javascript

    let suffix = (hour > 11) ? ''P.M.'' : ''A.M.''

    if (hour > 12) { hour -= 12 }

    console.log(''Time is: '' + hour + '':'' + minute + suffix)

    ```


    ![image](images/5p.jpg)

    Save the HTML document, then open it in your browser and launch the console to
    see formatted time strings.


    ![image](images/pg85_1.jpg)

    ![image](images/hot.jpg)


    `Date` object also provides methods to retrieve the UTC equivalent of each date
    and time component – for example, methods `getUTCHours()` and `getUTCMinutes()`.


    ## Set Dates


    The JavaScript `Date()` constructor can optionally specify seven arguments to
    set values for each of its components:


    ```javascript

    new Date(year, month, date, hours, minutes, seconds, milliseconds)

    ```


    ![image](images/84.jpg)


    When only year and month are specified, the date component is set to one, and
    all time components are set to zero. The `Date` object provides separate methods
    to specify the value of each of its date and time components:


    | Method | Sets |

    | :--- | :--- |

    | `setDate()` | Day as number (1-31) |

    | `setFullYear()` | Year as four digits (yyyy) |

    | `setMonth()` | Month as number (0-11) |

    | `setHours()` | Hour as number (0-23) |

    | `setMinutes()` | Minute as number (0-59) |

    | `setSeconds()` | Second as number (0-59) |

    | `setMilliseconds()` | Millisecond as number (0-999) |


    The `setMonth()` method sets the month numerically in the range where 0=January-11=December
    and optionally, the `setFullYear()` method can also set the month and day using
    this syntax:


    ```javascript

    date.setFullYear(year, monthNumber, dayNumber)

    ```


    The values of each component can be revealed by displaying the entire Date object.
    Additionally, all Date objects have methods to output a variety of strings displaying
    date and time:


    - `toString()` converts the date to a string value

    - `toUTCString()` converts the date to its UTC equivalent

    - `toLocaleString()` displays the date using the computer’s locale conventions

    - `toDateString()` and `toTimeString()` can display date and time components


    ![image](images/hot.jpg)


    ### 示例：修改特定日期


    Create an HTML document with a self-invoking function that begins by creating
    a 4th-of-July `Date` object:


    ```javascript

    const holiday = new Date(2025, 6, 4)

    console.log(''Object: '' + holiday)

    ```


    ![image](images/htmlp.jpg)

    setdate.html


    Next, add statements to modify individual date components to become a Christmas
    Day at noon:


    ```javascript

    holiday.setFullYear(2028)

    holiday.setMonth(11)

    holiday.setDate(25)

    holiday.setHours(12)

    holiday.setMinutes(0)

    holiday.setSeconds(0)

    holiday.setMilliseconds(0)

    ```


    ![image](images/3p.jpg)


    Now, add statements to output the modified date and time and its equivalent UTC
    (GMT) time:


    ```javascript

    console.log(''String: '' + holiday.toString())

    console.log(''UTC: '' + holiday.toUTCString())

    ```


    ![image](images/4p.jpg)


    Then, add statements to output the modified date and time in locale string, date
    string, and time string formats:


    ```javascript

    console.log(''Locale: '' + holiday.toLocaleString())

    console.log(''Date: '' + holiday.toDateString())

    console.log(''Time: '' + holiday.toTimeString())

    ```


    ![image](images/5p.jpg)


    The `Date` object also has a `setTime()` method that accepts an argument of the
    number of milliseconds since the epoch – each day has 86,400,000 milliseconds,
    so `setTime(86400000)` sets the date Jan 1, 1970.


    # Match Patterns


    The `RegExp` object is a JavaScript built-in object that can contain a “regular
    expression”.


    ![image](images/hot.jpg)


    A regular expression pattern may consist entirely of literal characters. For example,
    `/wind/` matches "windows".


    | Metacharacter | Matches | Example |

    | :--- | :--- | :--- |

    | `.` | Any characters | `..` |

    | `^` | First characters | `^ja` |

    | `$` | Final characters | `ja$` |

    | `*` | Zero or more repetitions | `ja*` |

    | `+` | One or more repetitions | `ja+` |

    | `?` | Zero or one repetition | `ja?` |

    | `{ }` | Multiple repetitions | `ja{3 }` |

    | `[ ]` | Character class | `[a-z]` |

    | `\` | Any digits | `\d` |

    | `\|` | Either optional character | `a\|b` |

    | `( )` | Expression group | `( )` |


    The pattern may also include an `i` modifier after the final `/` to perform a
    case-insensitive search, or a `g` modifier to perform a global search for all
    matches.


    ![image](images/snake.jpg)


    A `RegExp` object has a `test()` method that returns true when a match is found,
    or false otherwise. A `RegExp` object also has an `exec()` method that returns
    a `null` value if no match was found, or the text found if the search was successful,
    and its `index` property, which contains the character position where the match
    begins.


    ### 示例：正则表达式测试


    Create an HTML document with a self-invoking function that begins by initializing
    variables:


    ```javascript

    const system = ''Windows'', suite = ''Office'', pattern = /ice/i

    ```


    ```javascript

    console.log(''In '' + system + ''? '' + pattern.test(system))

    console.log(''In '' + suite + ''? '' + pattern.test(suite))

    ```

