  trans: "\n\n![image](img/6bl.jpg)最后，添加语句来写入 MIME 类型数组的长度和一个示例元素\n\n```javascript\n\
    if ( navigator.mimeTypes.length !== 0 )\n{\n  info.innerHTML += ‘No. of MIME Types:\
    \ ‘ + navigator.mimeTypes.length\n  info.innerHTML += `<br>Example: ‘ + navigator.mimeTypes[\
    \ 1 ].type\n  info.innerHTML += `<br>For: ‘ + navigator.mimeTypes[ 1 ].description\n\
    }\n```\n\n![image](img/7bl.jpg)保存 HTML 文档，然后在任何浏览器中打开它以查看已启用功能的状态\n\n![image](img/pg123_1.jpg)\n\
    \n![image](img/hot.jpg)\n\n你可以使用循环来编写所有插件和 mimeTypes 元素的内容。\n\n## 控制位置\n\n窗口的\
    \ `location` 对象具有五个属性，包含了当前在浏览器窗口中加载的文档的完整 URL 地址的组件。描述协议、域名、文件名以及（如果适用）片段锚点的完整地址包含在\
    \ `location.href` 属性中。完整地址的各个组件包含在 `location.protocol`（`http:` 或 `https:`）、`location.host`（域名）、`location.pathname`（文件路径）和\
    \ `location.hash`（片段锚点）中。为 `location` 属性分配一个新 URL 将导致浏览器加载该地址的页面或其他资源。\n\n![image](img/pg124_1.jpg)\n\
    \n![image](img/1bl.jpg)创建一个包含超链接锚点段落的 HTML 文档\n\n```html\n<p id=”info”>\n<a id=”frag”>片段锚点</a>\n\
    </p>\n```\n\n![image](img/htmlbl.jpg)\n\nlocation.html\n\n![image](img/2bl.jpg)接下来，在\
    \ script 元素中，创建一个自执行函数，该函数从初始化两个变量开始\n\n```javascript\nconst info = document.getElementById(\
    \ ‘info’ )\nlet jump = confirm( ‘Jump to Fragment?’ )\n```\n\n![image](img/3bl.jpg)现在，添加语句，如果用户同意了请求，则更改窗口的\
    \ location\n\n```javascript\nif ( jump )\n{\n  location = location.href + ‘#frag’\n\
    }\n```\n\n![image](img/4bl.jpg)然后，添加语句在面板中写入当前位置地址的每个组件\n\n```javascript\ninfo.innerHTML\
    \ += `<hr>Href: ‘ + location.href\ninfo.innerHTML += `<br>Protocol: ‘ + location.protocol\n\
    info.innerHTML += `<br>Host:‘ + location.host\ninfo.innerHTML += `<br>Path:‘ +\
    \ location.pathname\ninfo.innerHTML += `<br>Hash: ‘ + location.hash\n```\n\n![image](img/5bl.jpg)保存\
    \ HTML 文档，然后在任何浏览器中打开它，以查看请求更改位置的确认对话框\n\n![image](img/6bl.jpg)点击取消按钮拒绝请求，并查看页面照常加载在其“根部”位置\n\
    \n![image](img/forget.jpg)\n\n网页浏览器可以加载任何支持的 MIME 类型的文件——例如，所有 PNG 文件的 MIME 类型为\
    \ `image/png`。\n\n![image](img/pg125_1.jpg)\n\n![image](img/pg125_2.jpg)\n\n![image](img/7bl.jpg)刷新浏览器，然后点击\
    \ OK 按钮接受请求，并查看页面加载在其片段位置\n\n![image](img/pg125_3.jpg)\n\n![image](img/pg125_4.jpg)\n\
    \n![image](img/hot.jpg)\n\n这里显示的 location 是位于本地系统 Web 服务器上的页面。如果页面位于你的桌面上，协议将是\
    \ `file:` 且没有 `host` 值。\n\n## 历史记录\n\n网页浏览器将当前会话中访问的 URL 历史存储在 `window` 对象的 `history`\
    \ 子对象中的数组中。像其他数组一样，它有一个 `length` 属性，以及用于在元素之间移动的 `back()` 和 `forward()` 方法。或者，`history`\
    \ 对象的 `go()` 方法接受一个正或负整数参数，指定沿数组移动多少个元素。例如，`history.go( 1 )` 向前移动一个元素，`history.go(\
    \ -2 )` 向后移动两个元素。\n\n![image](img/pg126_1.jpg)\n\n![image](img/1bl.jpg)创建三个相同的\
    \ HTML 文档，它们包含一个空段落并嵌入相同的外部脚本文件\n\n```html\n<p id=”info” > </p>\n<script src=”history.js”\
    \ > </script>\n```\n\n![image](img/htmlbl.jpg)\n\npage-1.html\n\npage-2.html\n\
    \npage-3.html\n\n![image](img/2bl.jpg)接下来，创建一个脚本文件，其中包含一个从初始化变量引开始自执行函数\n\n```javascript\n\
    const info = document.getElementById( ‘info’ )\n```\n\n![image](img/pg126_2.jpg)\n\
    \nhistory.js\n\n![image](img/3bl.jpg)现在，在函数块中，添加语句将内容写入空段落中\n\n```javascript\n\
    info.innerHTML += `<a href=”page-1.xhtml”>Page 1</a> | ‘\ninfo.innerHTML += `<a\
    \ href=”page-2.xhtml”>Page 2</a> | ‘\ninfo.innerHTML += `<a href=”page-3.xhtml”>Page\
    \ 3</a’\ninfo.innerHTML += `<br>History Length: ‘ + history.length\ninfo.innerHTML\
    \ += `<br>Current Location: ‘ + location.pathname + ‘<br>’\n```\n\n![image](img/4bl.jpg)然后，添加语句在段落中创建按钮\n\
    \n```javascript\ninfo.innerHTML += `<button onclick=”history.back( )”>Back</button>’\n\
    info.innerHTML += `<button onclick=”history.forward( )”>Forward</button>’\n```\n\
    \n![image](img/5bl.jpg)将 HTML 文档和 JavaScript 脚本文件放在同一个文件夹中，然后清除浏览器历史\n\n![image](img/hot.jpg)\n\
    \n要在 Google Chrome 浏览器中清除历史记录，点击 ![image](img/pg126_i.jpg)按钮，然后选择**更多工具**、**清除浏览数据**，并点击**清除数据**按钮。\n\
    \n![image](img/6bl.jpg)打开第一个页面查看初始历史长度为 1\n\n![image](img/pg127_1.jpg)\n\n![image](img/7bl.jpg)点击链接加载第三页，查看历史长度增加到\
    \ 2\n\n![image](img/pg127_2.jpg)\n\n![image](img/8bl.jpg)点击后退按钮返回第一个页，查看历史长度保持为\
    \ 2\n\n![image](img/pg127_3.jpg)\n\nURL 存储在 `history` 对象数组中并受保护，无法以字符串形式检索\n\n\
    ![image](img/forget.jpg)\n\n在本示例中，只有当点击链接进入不同页面时，URL 才会添加到 history 数组。`back()`、`forward()`\
    \ 和 `go()` 方法只是选择数组中的元素，不会更改 `length` 属性。\n\n## 总结\n\n- 文档对象模型 (DOM) 是网页组件的层级表示。\n\
    - `window` 对象是 DOM 的顶层，具有描述浏览器窗口的属性。\n- `screen` 对象是 `window` 对象的子，具有描述屏幕尺寸和色彩深度属性。\n\
    - `window` 对象具有 `scrollBy()` 和 `scrollTo()` 方法，以及指定滚动位置的 `scrollX` 和 `scrollY`\
    \ 属性。\n- 使用 `window` 对象的 `alert()`、`confirm()` 和 `prompt()` 方法显示对话消息。\n- 使用 `window`\
    \ 对象的 `open()` 方法可以创建窗口，但可能会被弹出拦截。\n- `window` 对象的 `setTimeout()` 方法创建一个定时器，稍可以使用\
    \ `clearTimeout()` 方法取消。\n- `navigator` 对象是 `window` 对象的子，具有描述浏览器和主机平台版本的属性。\n\
    - `window` 对象存在于全局命名空间中，因此所有子对象不需要包含地址中的 window 部分。\n- 功能检测用于识别现代 DOM。\n- `navigator.plugins`\
    \ 和 `navigator.mimeTypes` 属性是包含支持功能详情数组。\n- `location` 对象是 `window` 对象的子，具有描述加载文档地址的属性。\n\
    - `history` 对象是 `window` 对象的子，包含当前会话中访问过的位置的数组。\n- `history` 对象具有 `back()`、`forward()`\
    \ 和 `go()` 方法，用于在当前会话中切换页面。\n\n"
- fmt: "\n## Address Arrays (#chapter07.xhtml_sec64)\n\n## Address Elements (#chapter07.xhtml_sec65)\n\
    \n## Write Content (#chapter07.xhtml_sec66)\n\n## Manage Cookies (#chapter07.xhtml_sec67)\n\
    \n## Load Events (#chapter07.xhtml_sec68)\n\n## Mouse Events (#chapter07.xhtml_sec69)\n\
    \n## Event Values (#chapter07.xhtml_sec70)\n\n## Check Boxes (#chapter07.xhtml_sec71)\n\
    \n## Select Options (#chapter07.xhtml_sec72)\n\n## Reset Changes (#chapter07.xhtml_sec73)\n\
    \n## Validate Forms (#chapter07.xhtml_sec74)\n\n## Summary (#chapter07.xhtml_sec75)\n\
    \n## Extract Info\n\nMost interesting of all the DOM window object’s children\
    \ is the document object, which provides access to the HTML document.\n\n![image](images/pg130_1.jpg)\n\
    \nThe document object has a number of properties describing the document and its\
    \ location:\n\n•The `document.title` property contains the value specified within\
    \ the HTML document’s title element.\n\n•The location of the HTML document is\
    \ contained within the `document.URL` property, and is similar to the value contained\
    \ in the `location.href` property.\n\n•The domain hosting the document is contained\
    \ in the `document.domain` property, similar to the `location.host` value.\n\n\
    •HTML documents supply the date of their creation or last modification as an HTTP\
    \ header to the browser so it may decide whether to use a cached copy of the document\
    \ or seek a new copy. This date can also be retrieved in JavaScript from the DOM’s\
    \ `document.lastModified` property.\n\n•There is a `document.referrer` property\
    \ that stores the URL of the web page containing the hyperlink that the user followed\
    \ to load the current HTML document. This is only set if the user followed a hyperlink\
    \ to load the page, not if they typed in the URL or used some other method to\
    \ load the page.\n\n![image](images/1v.jpg)Create an HTML document that provides\
    \ a hyperlink to a second (target) HTML document within its body section\n\n```html\n\
    <p>\n<a href=\"info-2.html\">Link to the Next Page</a>\n</p>\n```\n\n![image](images/htmlv.jpg)\n\
    \ninfo-1.html\n\n![image](images/2v.jpg)Next, create the target HTML document,\
    \ which contains an empty unordered list\n\n```html\n<ul id=\"list\"></ul>\n```\n\
    \n![image](images/htmlv.jpg)\n\ninfo-2.html\n\n![image](images/3v.jpg)Now, in\
    \ a script element, create a self-invoking function that begins by initializing\
    \ a variable reference\n\n```javascript\nconst list = document.getElementById('list');\n\
    ```\n\n![image](images/4v.jpg)Then, add statements to list features of the document\n\
    \n```javascript\nlist.innerHTML = '<li>Linked From: ' + document.referrer;\nlist.innerHTML\
    \ += '<li>Title: ' + document.title;\nlist.innerHTML += '<li>URL: ' + document.URL;\n\
    list.innerHTML += '<li>Domain: ' + document.domain;\nlist.innerHTML += '<li>Last\
    \ Modified: ' + document.lastModified;\n```\n\n![image](images/5v.jpg)Save the\
    \ HTML documents in the same folder, then open the document containing the link\
    \ in your browser\n\n![image](images/pg131_1.jpg)\n\n![image](images/6v.jpg)Now,\
    \ click on the hyperlink to load the second HTML document in the browser and see\
    \ document information\n\n![image](images/pg131_2.jpg)\n\n![image](images/forget.jpg)\n\
    \nThe date contained in `document.lastModified` only relates to the HTML document\
    \ itself, not to any external style sheets or external script files that the HTML\
    \ document may import.\n\n![image](images/snake.jpg)\n\nThe domain shown here\
    \ is that of the page located on a web server on the local system. If the page\
    \ was located on your desktop, the `document.referrer` and `document.domain` properties\
    \ would not be set with any values.\n\n## Address Arrays\n\nThe DOM document object\
    \ has child objects of forms, images, links, styleSheets, and scripts. Each of\
    \ these children is an array in which every array element represents a document\
    \ component in the same order they appear within the HTML document. For example,\
    \ the first image in the document body, specified by an HTML `<img>` tag, is represented\
    \ by `document.images[0]`. This means its URL can be referenced using `document.images[0].src`,\
    \ which reveals the path assigned to the `src` attribute of the HTML `<img>` tag.\
    \ Assigning this component a new URL in a script will dynamically replace the\
    \ old image with a different image.\n\n![image](images/pg132_1.jpg)\n\nThe `links`\
    \ array represents HTML `<a>` tags within the HTML document; the `styleSheets`\
    \ array represents HTML `<style>` tags; and the `scripts` array represents HTML\
    \ `<script>` tags.\n\nThe `forms` array represents HTML `<form>` tags but also\
    \ has its own child elements object that is an array of all the form components.\
    \ For example, the value of the first component of the first form in an HTML document\
    \ can be referenced using `document.forms[0].elements[0].value`. Assigning this\
    \ component a new value in a script will dynamically replace the old value.\n\n\
    ![image](images/1v.jpg)Create an HTML document containing a form and an empty\
    \ list\n\n```html\n<form>\n<img src=\"user.png\" alt=\"User\" height=\"64\" width=\"\
    64\">\n<input type=\"text\" name=\"topic\" size=\"30\">\n<input type=\"button\"\
    \ value=\"Ask Question\">\n<br>\n<a href=\"help.html\" style=\"\">Help?</a>\n\
    </form>\n<ul id=\"list\"></ul>\n```\n\n![image](images/htmlv.jpg)\n\ncomponents.html\n\
    \n![image](images/2v.jpg)Now, add a style sheet to style the form\n\n```html\n\
    <style>\nform {\n    font:1em sans-serif;\n    width: 500px;\n    height: 100px;\n\
    \    background: url(bg.png);\n}\n</style>\n```\n\n![image](images/pg132_2.jpg)\n\
    \nbg.png 64x64 transparent\n\n![image](images/3v.jpg)\n\nNext, in a script element,\
    \ create a self-invoking function that begins by initializing a variable reference\n\
    \n```javascript\nconst list = document.getElementById('list');\n```\n\n![image](images/snake.jpg)\n\
    \nNotice the camelCase capitalization of the `styleSheets` array.\n\n![image](images/4v.jpg)Now,\
    \ add statements to list components of the document\n\n```javascript\nlist.innerHTML\
    \ = '<li>No. Forms: ' + document.forms.length;\nlist.innerHTML += '<li>No. Links:\
    \ ' + document.links.length;\nlist.innerHTML += '<li>No. Images: ' + document.images.length;\n\
    list.innerHTML += '<li>No. Style Sheets: ' + document.styleSheets.length;\nlist.innerHTML\
    \ += '<li>No. Scripts: ' + document.scripts.length;\n```\n\n![image](images/5v.jpg)Finally,\
    \ add statements to list attribute values\n\n```javascript\nlist.innerHTML +=\
    \ '<li>First Image URL: ' + document.images[0].src;\nlist.innerHTML += '<li>First\
    \ Form Element Value: ' + document.forms[0].elements[0].value;\n```\n\n![image](images/6v.jpg)Save\
    \ the HTML document, then open it in your browser to see components of the document\
    \ listed\n\n![image](images/pg133_1.jpg)\n\nNotice that images incorporated within\
    \ a document by style rules are not included in the images array, only those that\
    \ are incorporated by `<img>` tags – so here the form background image (`bg.png`)\
    \ does not appear in the images array. Similarly, the style rule assigned inline\
    \ to the style attribute is not included in the `styleSheets` array.\n\n![image](images/forget.jpg)\n\
    \nThe array elements only represent the relevant HTML tags.\n\n## Address Elements\n\
    \n![image](images/pg134_1.jpg) (Wait, the original text says pg134_1.jpg)\n\n\
    Using the component arrays with dot notation to reference a specific element requires\
    \ the script author to count the number of components to calculate each index\
    \ position. This is especially tedious with lengthy documents, is error-prone,\
    \ and modification of the HTML document can change the element’s index position.\
    \ This was required in earlier years but was eventually resolved by the addition\
    \ of three new methods to the document object:\n\n•The `document.getElementById(\
    \ )` method, used by previous examples in this book to add content from JavaScript\
    \ code, allows any component to be referenced by its HTML id attribute value.\
    \ This method simply specifies the target id value as its argument and is used\
    \ to reference a single specific HTML element.\n"
