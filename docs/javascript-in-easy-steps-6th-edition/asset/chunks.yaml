    \n![image](images/pg173_2.jpg)\n\n![image](images/common3.jpg)\n\nLike HTML documents,\
    \ XML documents can also be validated by the W3C’s online validator tool at [validator.w3.org](http://validator.w3.org)\n\
    \n## Embed Vectors\n\nSVG graphics embedded in an HTML document maintain an SVG\
