  trans: "\n\n自调用函数（Self-invoking functions）在本书中广泛用于在脚本加载时执行示例代码。\n\n![image](img/hot.jpg)\n\
    \n自调用函数表达式也称为立即执行函数表达式（Immediately Invoked Function Expressions，简称 IIFE – 通常读作“iffy”）。\n\
    \n![image](img/1b.jpg)创建一个 HTML 文档，其中脚本调用了一个尚未定义的函数\n\n```javascript\nconsole.log(\
    \ ‘Hoisted: ‘ + add( 100, 200 ) )\n```\n\n![image](img/htmlb.jpg)\n\nanonymous.html\n\
    \n![image](img/2b.jpg)接下来，在上方调用的函数下方添加\n\n```javascript\nfunction add( numOne,\
    \ numTwo ) {\n  return numOne + numTwo\n}\n```\n\n![image](img/3b.jpg)现在，添加一个将上述函数赋值给变量并调用该被赋值函数\n\
    \n```javascript\nlet addition = add\nconsole.log( ‘Assigned: ‘ + addition( 32,\
    \ 64 ) )\n```\n\n![image](img/4b.jpg)然后，将一个类似的但匿名函数赋值给变量并调用该被赋值的函数\n\n```javascript\n\
    let anon = function ( numOne, numTwo ) {\n  let result = numOne + numTwo ; return\
    \ result\n}\nconsole.log( ‘Anonymous: ‘ + anon( 9, 1 ) )\n```\n\n![image](img/5b.jpg)最后，将自调用函数的返回值赋值给变量并显示该值\n\
    \n```javascript\nlet iffy = ( function ( ) {\n  let str = ‘Self Invoked Output’\
    \ ; return str\n} ) ( )\nconsole.log( iffy )\n```\n\n![image](img/6b.jpg)保存 HTML\
    \ 文档，然后在浏览器中打开它并启动控制台以查看函数返回的值\n\n![image](img/pg21_1.jpg)\n\n![image](img/hot.jpg)\n\
    \n自调用函数的意义可能不会立而易见，但到本章结束时，它们的重要性应该变得清晰。\n\n## 识别作用域\n\n变量在脚本中的可访问范围取决于它们的“词法作用域”（lexical\
    \ scope）——即变量创建的环境。这可以是“全局的”，也可以是“局部的”。\n\n![image](img/pg22_1.jpg)\n\n### 全局作用域\n\
    \n在函数块外部创建的变量在整个脚本范围内全局可用。这意味着它们持续存在，并对同一脚本环境中的函数可用。初看之下这可能非常方便，但它有一个非常严重的缺点：同名的变量可能会发生冲突。例如，假设你创建了一个全局变量\
    \ `myName` 并赋值了你的名字，但随后又包含了一个外部脚本，另一个开发者在脚本中也创建了一个全局变量 `myName` 并赋值了他们的名字。两个同名变量存在于同一个脚本环境中，因此产生冲突。最好避免这种情况，因此你不应该在脚本中创建全局变量来存储原始值（除\
    \ `Object` 和 `Function` 外的所有数据类型）。\n\n### 局部作用域\n\n在函数块内部创建的变量在函数的整个生命周期内仅局部可用。它们只在函数执行时存在，随后会被销毁。它们的脚本环境是有限的——从创建点开始到最后的\
    \ `}` 大括号，或者函数返回的那一刻。在函数块的最开始声明变量是一个良好的习惯，这样它们的词法作用域就是整个函数的时长。这意味着同名变量可以在不同的函数中存在而不会产生冲突。例如，局部变量\
    \ `myName` 可以愉快地存在于脚本中不同函数中，以及包含的外部脚本的函数中。建议你在脚本中只尝试创建局部变量来存储值。\n\n## 最佳实践\n\n\
    使用旧的 `var` 关键字声明全局变量会导致同名的冲突变量在没有警告的情况下覆盖其被赋值的值。较新的 `let` 和 `const` 关键字禁止了这种行为，并将该行为识别为“未捕获的语法错误”（Uncaught\
    \ SyntaxError）。因此，建议使用 `let` 或 `const` 关键字声明变量来在脚本中存储值。\n\n![image](img/hot.jpg)\n\
    \n你可以在这里发现如何捕捉错误。\n\n![image](img/1b.jpg)创建一个外部脚本，通过调用函数来输出全局变量的值\n\n```javascript\n\
    let myName = ‘External Script’\nfunction readName( ) { console.log( myName ) }\n\
    readName( )\n```\n\n![image](img/pg23_1.jpg)\n\nexternal.js\n\n![image](img/2b.jpg)创建一个\
    \ HTML 文档，包含外部脚本并添加一个类似的脚本\n\n```html\n<script src=”external.js”></script>\n<script>\n\
    let myName = ‘Internal Script’\nfunction getName( ) { console.log( myName ) }\n\
    getName( )\n</script>\n```\n\n![image](img/htmlb.jpg)\n\nscope.html\n\n![image](img/3b.jpg)将两个文件保存在同一个文件夹中，然后打开\
    \ HTML 文档查看控制台中报告的冲突错误\n\n![image](img/pg23_2.jpg)\n\n![image](img/4b.jpg)编辑两个脚本，将全局变量变为局部变量，然后刷新浏览器查看无冲突\n\
    \n```javascript\nfunction readName( ) {\n  let myName = ‘External Script’ ; console.log(\
    \ myName )\n}\nfunction getName( ) {\n  let myName = ‘Internal Script’ ; console.log(\
    \ myName )\n}\n```\n\n![image](img/pg23_3)\n\n![image](img/forget.jpg)\n\n## 使用闭包\n\
    \n上一个示例演示了创建全局变量存储值的危险，但有时你可能想要存储持续存在的值——例如，随着脚本的进行记住不断增加的分数。如何在不使用全局变量的情况下做到这一点？答案在于使用“闭包”。\n\
    \n![image](img/pg24_1.jpg)\n\n闭包嵌套在外部函数内部的函数，它保留了对外部函数中声明的变量的访问——因为那是函数创建时的词法作用域。\n\
    \n![image](img/1b.jpg)创建一个 HTML 文档，其脚本将自调用函数赋值给全局变量\n\n```javascript\nconst add\
    \ = ( function ( ) {\n  // 在此处插入语句。\n} ) ( )\n```\n\n![image](img/htmlb.jpg)\n\
    \nclosure.html\n\n![image](img/2b.jpg)接下来，插入语句初始化局部变量并在同一作用域内赋值一个函数\n\n```javascript\n\
    let count = 0\nconst nested = function ( ) { return count = count + 1 }\n```\n\
    \n![image](img/3b.jpg)现在，插入一条语句返回内部函数——将内部函数赋值给全局变量\n\n```javascript\nreturn nested\n\
    ```\n\n![image](img/4b.jpg)最后，向已赋值给全局变量的内部函数添加三个相同的函数调用\n\n```javascript\nconsole.log(\
    \ ‘Count is ‘ + add( ) )\nconsole.log( ‘Count is ‘ + add( ) )\nconsole.log( ‘Count\
    \ is ‘ + add( ) )\n```\n\n![image](img/5b.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台以查看闭包返回的值\n\
    \n![image](img/pg24_2.jpg)\n\n![image](img/forget.jpg)\n\n自调用函数表达式在这里 有描述。它们只执行一次语句。在这里，你可以使用\
    \ `console.log( add )` 来确认函数表达式已赋值给外部变量。\n\n理解闭包的概念可能困难，因为在这个示例中 `count` 变量似乎在自调用函数执行完成后应该被销毁。为了更好地理解闭包的工作原理，你可以探索被赋值函数的\
    \ `prototype` 属性。\n\n![image](img/6b.jpg)在脚本末尾添加语句以揭示被赋值函数是如何构造的\n\n```javascript\n\
    console.log( add.prototype )\n```\n\n![image](img/7b.jpg)保存 HTML 文档，然后刷新浏览器并展开“constructor”下拉菜单以查看作用域\n\
    \n![image](img/pg25_1.jpg)\n\n"
- fmt: "\nCloser inspection reveals that the assigned function has a special (Closure)\
    \ scope in addition to the regular local (Script) scope and outer (Global) scope.\
    \ This is how the `count` variable remains accessible via the assigned function\
    \ yet, importantly, cannot be referenced in any other way.\n\nThe use of closures\
    \ to hide persistent variables from other parts of your script is an important\
    \ concept. It is similar to how “private” variables can be hidden in other programming\
    \ languages and are only accessible via “getter” methods.\n\n![image](images/hot.jpg)\n\
    \nAll JavaScript objects inherit properties and methods from a `prototype`. Standard\
    \ JavaScript objects, such as functions, call an internal constructor function\
    \ to create the object by defining its components.\n\n![image](images/hot.jpg)\n\
    \nDon’t worry if you can’t immediately understand how closures work. They can\
    \ seem mystical at first, but will become clearer with experience. You can continue\
    \ on and come back to this technique later.\n\n## Summary\n\n- JavaScript code\
    \ can be included in an HTML document directly or from an external file using\
    \ `<script> </script>` tags.\n- JavaScript can display output in an HTML element\
    \ in an alert dialog box or in the browser’s console window.\n- JavaScript statements\
    \ may contain keywords, operators, values, and expressions.\n- The JavaScript\
    \ interpreter ignores tabs and spaces.\n- JavaScript statements can be grouped\
    \ in `{ }` curly bracket function blocks that can be called to execute when required.\n\
    - Variable and function names may comprise letters, numbers, and underscore characters,\
    \ but must avoid keywords.\n- JavaScript variables may contain data types of String,\
    \ Number, Boolean, Object, Function, Symbol, `null`, and `undefined`.\n- Variables\
    \ declared with the `let` keyword can be reassigned new values, but the `const`\
    \ keyword does not allow this.\n- A function expression has statements grouped\
    \ in `{ }` curly brackets for execution, and it returns a final single value.\n\
    - The `( )` parentheses of a function expression may contain parameters for argument\
    \ values to be passed from the caller.\n- A function block can include a `return`\
    \ statement to specify data to be passed back to the caller.\n- The JavaScript\
    \ `( )` operator calls the function.\n- Hoisting allows function calls to appear\
    \ in the script before the function declaration.\n- Anonymous function expressions\
    \ have no function name.\n- Lexical scope is the environment in which the variable\
    \ was created and can be global, local, or closure.\n- Local variables should\
    \ be used to store values, but global variables can be assigned functions to create\
    \ closures.\n- A closure is a function nested within an outer function that retains\
    \ access to variables declared in the outer function.\n\n## 2 Perform Useful Operations\n\
    \n*This chapter describes the JavaScript operators and demonstrates how they can\
    \ be used in your scripts.*\n\n- [Convert Values](#chapter02.xhtml_sec12)\n- [Do\
    \ Arithmetic](#chapter02.xhtml_sec13)\n- [Assign Values](#chapter02.xhtml_sec14)\n\
    - [Make Comparisons](#chapter02.xhtml_sec15)\n- [Assess Logic](#chapter02.xhtml_sec16)\n\
    - [Examine Conditions](#chapter02.xhtml_sec17)\n- [Juggle Bits](#chapter02.xhtml_sec18)\n\
    - [Force Order](#chapter02.xhtml_sec19)\n- [Summary](#chapter02.xhtml_sec20)\n\
    \n## Convert Values\n\nBefore performing operations in JavaScript it is important\
    \ to recognize the data types of the values you are working with in order to avoid\
    \ unexpected results. For example, the value 42 is a number, but the value ‘42’\
    \ is a string, so attempting to perform an addition with `‘42’ + 8` will return\
    \ a string result of `‘428’, not the number 50. Happily, JavaScript provides a\
    \ number of ways to return versions of values in other data types – without changing\
    \ the value’s original data type.\n\n![image](images/pg28_1.jpg)\n\n### Strings\
    \ to Numbers\n\nThe JavaScript `parseInt()` built-in function can return an integer\
    \ whole number version, in the number data type, of a string specified within\
    \ its parentheses. For example, `parseInt( ‘42’ )` will return the number 42,\
    \ so `42 + 8` will return a number result of 50.\n\nSimilarly, the JavaScript\
    \ `parseFloat()` built-in function can return a floating-point number version,\
    \ in the number data type, of a string specified within its parentheses.\n\nBoth\
    \ these methods allow alphabetic characters to follow the numeric part of the\
    \ specified string and strip them from the result – for example, `parseInt( ‘42nd\
    \ Street’ )` returns number 42.\n\nIf either of these functions cannot find a\
    \ numeric value at the beginning of the specified string, the result will be `NaN`\
    \ – a JavaScript property meaning “Not a Number”. You can also check if a value\
    \ is not a number by specifying the value within the parentheses of a JavaScript\
    \ `isNaN()` built-in function. This, too, will first attempt to find a number\
    \ at the beginning of the specified value and return false if it finds a number\
    \ (even from a specified string), otherwise it will return true if it cannot find\
    \ a number.\n\n![image](images/hot.jpg)\n\nConversion of data types is known as\
    \ “coercion”, and it can be explicit or implicit. Where `‘42’ + 8` returns the\
    \ string `‘428’` is implicit coercion. Where `String( 42 )` returns the string\
    \ `‘42’` this is explicit coercion.\n\n### Numbers to Strings\n\nThe JavaScript\
    \ `String()` method can return a string representation, in the string data type,\
    \ of a number specified within its parentheses – for example, `String( 42 )` will\
    \ return the number `’42’` as a string data type.\n\nAlternatively, you can append\
    \ a `toString()` method call onto a variable name to return a string representation\
    \ of a stored number data type. For example, where a variable named “num” has\
    \ been assigned a number, `num.toString()` will return a string version of that\
    \ stored number.\n\n![image](images/1r.jpg)\nCreate an HTML document with a self-invoking\
    \ anonymous function block that declares three variables\n\n```javascript\n( function\
    \ ( ) {\n  let sum, net = ‘25’, tax = 5.00\n  // Statements to be inserted here.\n\
    } ) ( )\n```\n\n![image](images/htmlr.jpg)\nconversion.html\n\n![image](images/2r.jpg)\n\
    Next, insert statements that create versions of different data types and print\
    \ the result in an output string\n\n```javascript\nsum = net + tax\nconsole.log(\
    \ ‘sum: ‘ + sum + ‘ ‘ + typeof sum )\nsum = parseFloat( net ) + tax\nconsole.log(\
    \ ‘sum: ‘ + sum + ‘ ‘ + typeof sum )\nconsole.log( ‘tax: ‘ + tax + ‘ ‘ + typeof\
    \ sum )\ntax = tax.toString( )\nconsole.log( ‘tax: ‘ + tax + ‘ ‘ + typeof tax\
    \ )\nnet = ‘$’ + net\nconsole.log( ‘net: ‘ + net + ‘ ‘ + parseInt( net ) )\nconsole.log(\
    \ ‘net Not a Number? ‘ + isNaN( net ) )\n```\n\n![image](images/3r.jpg)\nSave\
    \ the HTML document, then open it in your browser and launch the console to see\
    \ the different versions\n\n![image](images/pg29_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nIf you try `isNaN( net )` before the `‘$’` prefix is added to the string the\
    \ result is **false** – because the method finds the number at the beginning of\
    \ the `‘25’` string.\n\n## Do Arithmetic\n\nThe arithmetical operators commonly\
    \ used in JavaScript are listed in the table below, together with the operation\
    \ they perform:\n\n![image](images/pg30_1.jpg)\n\n| **Operator** | **Operation**\
    \ |\n| :--- | :--- |\n| + | Addition of numbers Concatenation of strings |\n|\
    \ **–** | Subtraction |\n| ***** | Multiplication |\n| **/** | Division |\n| **%**\
    \ | Modulus |\n| **++** | Increment |\n| **– –** | Decrement |\n| ****** | Exponentiation\
    \ |\n\nValues specified in operation statements are called “operands”. For example,\
    \ in the statement `5 + 2` the `+` operator is supplied operand values of five\
    \ and two. Notice that the `+` operator performs two kinds of operation depending\
    \ on the type of operands. Numeric operands are added to return a sum total, but\
    \ string operands are concatenated to return a single joined string.\n"
  raw: 'Closer inspection reveals that the assigned function has a special (Closure)
    scope in addition to the regular local (Script) scope and outer (Global) scope.
    This is how the **count** variable remains accessible via the assigned function
    yet, importantly, cannot be referenced in any other way.


    The use of closures to hide persistent variables from other parts of your script
    is an important concept. It is similar to how “private” variables can be hidden
    in other programming languages and are only accessible via “getter” methods.


    ![image](images/hot.jpg)


    All JavaScript objects inherit properties and methods from a **prototype**. Standard
    JavaScript objects, such as functions, call an internal constructor function to
    create the object by defining its components.


    ![image](images/hot.jpg)


    Don’t worry if you can’t immediately understand how closures work. They can seem
    mystical at first, but will become clearer with experience. You can continue on
    and come back to this technique later.


    **Summary**


    •JavaScript code can be included in an HTML document directly or from an external
    file using **<script> </script>** tags.


    •JavaScript can display output in an HTML element in an alert dialog box or in
    the browser’s console window.


    •JavaScript statements may contain keywords, operators, values, and expressions.


    •The JavaScript interpreter ignores tabs and spaces.


    •JavaScript statements can be grouped in **{ }** curly bracket function blocks
    that can be called to execute when required.


    •Variable and function names may comprise letters, numbers, and underscore characters,
    but must avoid keywords.


    •JavaScript variables may contain data types of String, Number, Boolean, Object,
    Function, Symbol, **null**, and **undefined**.


    •Variables declared with the **let** keyword can be reassigned new values, but
    the **const** keyword does not allow this.


    •A function expression has statements grouped in **{ }** curly brackets for execution,
    and it returns a final single value.


    •The **( )** parentheses of a function expression may contain parameters for argument
    values to be passed from the caller.


    •A function block can include a **return** statement to specify data to be passed
    back to the caller.


    •The JavaScript **( )** parentheses operator calls the function.


    •Hoisting allows function calls to appear in the script before the function declaration.


    •Anonymous function expressions have no function name.


    •Lexical scope is the environment in which the variable was created and can be
    global, local, or closure.


    •Local variables should be used to store values, but global variables can be assigned
    functions to create closures.


    •A closure is a function nested within an outer function that retains access to
    variables declared in the outer function.


    **2**


    **Perform Useful Operations**


    *This chapter describes the JavaScript operators and demonstrates how they can
    be used in your scripts.*


    [**Convert Values**](#chapter02.xhtml_sec12)


    [**Do Arithmetic**](#chapter02.xhtml_sec13)


    [**Assign Values**](#chapter02.xhtml_sec14)


    [**Make Comparisons**](#chapter02.xhtml_sec15)


    [**Assess Logic**](#chapter02.xhtml_sec16)


    [**Examine Conditions**](#chapter02.xhtml_sec17)


    [**Juggle Bits**](#chapter02.xhtml_sec18)


    [**Force Order**](#chapter02.xhtml_sec19)


    [**Summary**](#chapter02.xhtml_sec20)


    **Convert Values**


    Before performing operations in JavaScript it is important to recognize the data
    types of the values you are working with in order to avoid unexpected results.
    For example, the value 42 is a number, but the value ‘42’ is a string, so attempting
    to perform an addition with ‘42’ + 8 will return a string result of ‘428’, not
    the number 50. Happily, JavaScript provides a number of ways to return versions
    of values in other data types – without changing the value’s original data type.


    ![image](images/pg28_1.jpg)


    **Strings to Numbers**


    The JavaScript parseInt( ) built-in function can return an integer whole number
    version, in the number data type, of a string specified within its parentheses.
    For example, parseInt( ‘42’ ) will return the number 42, so 42 + 8 will return
    a number result of 50.


    Similarly, the JavaScript parseFloat( ) built-in function can return a floating-point
    number version, in the number data type, of a string specified within its parentheses.


    Both these methods allow alphabetic characters to follow the numeric part of the
    specified string and strip them from the result – for example, parseInt( ‘42nd
    Street’ ) returns number 42.


    If either of these functions cannot find a numeric value at the beginning of the
    specified string, the result will be NaN – a JavaScript property meaning “Not
    a Number”. You can also check if a value is not a number by specifying the value
    within the parentheses of a JavaScript isNaN( ) built-in function. This, too,
    will first attempt to find a number at the beginning of the specified value and
    return false if it finds a number (even from a specified string), otherwise it
    will return true if it cannot find a number.


    ![image](images/hot.jpg)


    Conversion of data types is known as “coercion”, and it can be explicit or implicit.
    Where ‘42’ + 8 returns the string ‘428’ this is implicit coercion. Where String(
    42 ) returns the string ‘42’ this is explicit coercion.


    **Numbers to Strings**


    The JavaScript String( ) method can return a string representation, in the string
    data type, of a number specified within its parentheses – for example, String(
    42 ) will return the number ’42’ as a string data type.


    Alternatively, you can append a toString( ) method call onto a variable name to
    return a string representation of a stored number data type. For example, where
    a variable named “num” has been assigned a number, num.toString( ) will return
    a string version of that stored number.


    ![image](images/1r.jpg)Create an HTML document with a self-invoking anonymous
    function block that declares three variables


    **( function ( ) {**


    **let sum, net = ‘25’, tax = 5.00**


    **// Statements to be inserted here.**


    **} ) ( )**


    ![image](images/htmlr.jpg)


    conversion.html


    ![image](images/2r.jpg)Next, insert statements that create versions of different
    data types and print the result in an ouput string


    **sum = net + tax**


    **console.log( ‘sum: ‘ + sum + ‘ ‘ + typeof sum )**


    **sum = parseFloat( net ) + tax**


    **console.log( ‘sum: ‘ + sum + ‘ ‘ + typeof sum )**


    **console.log( ‘tax: ‘ + tax + ‘ ‘ + typeof tax )**


    **tax = tax.toString( )**


    **console.log( ‘tax: ‘ + tax + ‘ ‘ + typeof tax )**


    **net = ‘$’ + net**


    **console.log( ‘net: ‘ + net + ‘ ‘ + parseInt( net ) )**


    **console.log( ‘net Not a Number? ‘ + isNaN( net ) )**


    ![image](images/3r.jpg)Save the HTML document, then open it in your browser and
    launch the console to see the different versions


    ![image](images/pg29_1.jpg)


    ![image](images/forget.jpg)


    If you try **isNan( net )** before the **‘$’** prefix is added to the string the
    result is **false** – because the method finds the number at the beginning of
    the **‘25’** string.


    **Do Arithmetic**


    The arithmetical operators commonly used in JavaScript are listed in the table
    below, together with the operation they perform:


    ![image](images/pg30_1.jpg)


    | **Operator** | **Operation** |


    | + | Addition of numbers Concatenation of strings |


    | **–** | Subtraction |


    | ***** | Multiplication |


    | **/** | Division |


    | **%** | Modulus |


    | **++** | Increment |


    |  **– –** | Decrement |


    | ****** | Exponentiation |


    Values specified in operation statements are called “operands”. For example, in
    the statement 5 + 2 the + operator is supplied operand values of five and two.
    Notice that the + operator performs two kinds of operation depending on the type
    of operands. Numeric operands are added to return a sum total, but string operands
    are concatenated to return a single joined string.'
