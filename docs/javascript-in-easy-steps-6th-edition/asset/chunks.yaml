    ## Built-in Objects


    ![image](images/pg68_1.jpg)


    | Object |

    | :--- |

    | `String` (an object only if created using the `new` keyword) |

    | `Number` (an object only if created using the `new` keyword) |

    | `Boolean` (an object only if created using the `new` keyword) |

    | `Object` – an object defined by you |

    | `Date` – an object containing date and time components |

    | `Array` – an object storing indexed items of data |

    | `RegExp` – an object describing a regular expression pattern |

    | `Math` – an object providing math properties and methods |

    | `Error` – an object supplying details of an error |


    JavaScript provides the predefined built-in objects listed in the table above.
    Each of these objects, except for `Math`, has a like-named constructor method
    that can be used with the `new` keyword to create an object of that type – for
    example, to create a new `Date` object with `let now = new Date()`.


    It is, however, not recommended you use the `new` keyword and a constructor method
    for any object type other than `Error` and `Date`. JavaScript can intelligently
    recognize what type of object should be created by the value being assigned unless
    that value is a string, a number, or a boolean. These are each regarded as “primitive”
    literal values that have no properties or methods, so a `typeof` statement returns
    `string`, `number`, `boolean`, for these – not `object`.


    All JavaScript built-in objects inherit properties and methods from a top-level
    `Object.prototype` object. For example, this provides a `toLocaleString()` method
    to lower-level objects such as `Date.prototype`, so you can append that method
    call to a `Date` object to get a locally formatted date string.


    You can also call inherited methods on the primitive string, number, and boolean
    literal values because JavaScript will automatically call the method from the
    equivalent object. This means you can append the `toLocaleString()` method call
    to a number literal value to get a locally formatted number string.


    ![image](images/hot.jpg)


    If you’re working through this book from the beginning you should already be familiar
    with `String`, `Number`, `Boolean`, `Error`, and `Object` objects. The `Array`
    object is introduced here [chapter04.xhtml_33], the `Date` object is introduced
    here [chapter04.xhtml_37], the `RegExp` object is introduced here [chapter04.xhtml_41],
    and the `Math` object is introduced here [chapter05.xhtml_43].


