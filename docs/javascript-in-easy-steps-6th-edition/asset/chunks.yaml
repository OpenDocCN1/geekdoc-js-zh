    **Branch If**


    The progress of any script or computer program depends upon the evaluation of
    conditions to determine the direction of flow. Each evaluation may present one
    or more branches along which to continue according to the result of the evaluation.


    ![image](images/pg46_1.jpg)


    In JavaScript, the basic conditional test is performed with the if keyword to
    test a condition for a Boolean true or false value. When the result is true, a
    statement following the evaluation will be executed, otherwise this is skipped
    and flow continues at the next subsequent statement.


    The syntax of an if statement demands that the condition to be tested is placed
    within parentheses after the if keyword, and looks like this:


    ***if ( condition ) execute-this-statement-when-true***


