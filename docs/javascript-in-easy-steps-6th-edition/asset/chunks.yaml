  trans: "\n\n![image](img/1b.jpg)用一个自执行函数开始脚本，该函数创建一个 JavaScript Promise 对象，该对象将在一秒后执行两个函数之一。\n\
    \n```javascript\nconst promise = new Promise( function( resolve, reject ) {\n\
    \  let random = Math.round( Math.random( ) * 10 )\n  if ( random % 2 === 0 ) {\n\
    \    { setTimeout( function( ) { resolve( random ) }, 1000 ) }\n  } else {\n \
    \   { setTimeout( function( ) { reject( random ) }, 1000 ) }\n  }\n} )\n```\n\n\
    ![image](img/htmlb.jpg)\n\npromise.html\n\n![image](img/2b.jpg)接下来，添加带有链式方法的语句来显示\
    \ promise 的状态并处理返回的值。\n\n```javascript\npromise\n  .then( console.log( promise\
    \ ) )\n  .then( function( res ) { console.log( res + ‘ Is Even’ ) ) )\n  .catch(\
    \ function( err ) { console.log( err + ‘ Is Odd’ ) ) )\n```\n\n![image](img/3b.jpg)保存\
    \ HTML 文档然后在网页浏览器中打开它，启动开发者工具中的控制台以查看异步操作。\n\n![image](img/pg159_1.jpg)\n\n![image](img/pg159_2.jpg)\n\
    \n![image](img/hot.jpg)\n\n注意控制台是如何提供 promise 的行号以及处理结果函数的行号的。\n\n## 获取数据\n\n\
    浏览器支持 Fetch API，可以在 JavaScript 中使用它通过网络获取资源。`fetch()` 方法接受单个参数，即要获取的资源的 URL。\n\
    \n![image](img/pg160_1.jpg)\n\n`fetch()` 方法是异步的，这意味着在等待资源到达时，可以执行其他操作。完成后，`fetch()`\
    \ 方法会返回一个 `Promise` 对象，该对象包含一个响应（一个 `HTTPResponse` 对象）。\n\n通常情况下，`fetch()` 方法可以获取\
    \ JSON 资源并使用 `HTTPResponse` 对象的 `json()` 方法对其进行解析。返回的 JSON 数据随后可以作为参数传递给下一个链式\
    \ promise 方法，该方法反过来又可以将 JSON 数据传递给处理函数。该过程的语法如下：\n\n```javascript\nfetch( url\
    \ )\n  .then( function( response ) { return response.json( ) } )\n  .then( function(\
    \ data ) { return handler( data ) } )\n  .catch( function( err ) { return console.log(\
    \ err ) } )\n```\n\n## 箭头函数表达式\n\n上面的函数定义可以选择地写成更简洁的 JavaScript `=>` 箭头函数表达式。这允许你省略\
    \ `function` 关键字，如下：\n\n```javascript\n.then( ( response ) => { return response.json(\
    \ ) } )\n```\n\n如果函数体只包含一条语句，并且该语句返回一个值，你也可以省略 `=>` 箭头函数中的大括号和 `return` 关键字，如下：\n\
    \n```javascript\n.then( ( response ) => response.json( ) )\n```\n\n任何参数都可以像往常一样圆圆\
    \ `()` 中以逗号分隔列表出现，但如果只有一个参数，你甚至可以省略 `=>` 箭头函数的括号——因此整个过程的语法可以选择地看起来像这样：\n\n```javascript\n\
    fetch( url )\n  .then( response => response.json( ) )\n  .then( data => handler(\
    \ data ) )\n  .catch( err => console.log( err ) )\n```\n\n这种方式更易读，但你应该意识到 `=>`\
    \ 箭头函数处理 `this` 关键字的方式与普通函数不同。\n\n![image](img/snake.jpg)\n\n使用箭头函数时，`this` 关键字代表原始上下文的对象，而在普通函数中，`this`\
    \ 关键字代表调用函数的对象。\n\n![image](img/1b.jpg)打开一个纯文本编辑器（例如 Windows 的记事本应用），然后创建一个包含五个键值对对象的\
    \ JSON 文档。\n\n![image](img/pg161_3.jpg)\n\nweekdays.json\n\n![image](img/pg161_1.jpg)\n\
    \n![image](img/2b.jpg)将 JSON 文档保存在 Web 服务器的“htdocs”文件夹中——这样就可以通过网络访问了。\n\n![image](img/3b.jpg)创建一个创建一个通过获取数据来解析的\
    \ promise，通过异步 HTTP 请求开始脚本。\n\n```javascript\nfetch( http://localhost/weekdays.json’\
    \ )\n  .then( response => response.json( ) )\n  .then( data => list( data ) )\n\
    \  .catch( err => console.log( err ) )\n```\n\n![image](img/htmlb.jpg)\n\nfetch.html\n\
    \n![image](img/4b.jpg)现在，创建一个用于打印数据的函数。\n\n```javascript\nfunction list( data\
    \ ) {\n  const values = Object.values( data )\n  let i = 0\n  while( i < values.length\
    \ ) { console.log( values[ i ] ) ; i++ }\n}\n```\n\n![image](img/5b.jpg)将 HTML\
    \ 文档与 JSON 文档保在一起，然后通过 HTTP 打开网页并启动开发者工具中的控制台以查看数据。\n\n![image](img/pg161_2.jpg)\n\
    \n## 创建界面\n\n本章其余部分将演示一个 Web 应用程序的创建，该程序允许在不重新加载的情况下动态更新网页上的数据。\n\n网页上的数据可以在不重新加载的情况下动态更新。界面提供了一个表单和一个表格。部分单元格被填充了数据，其他单元格是空的。\n\
    \n在文档主体部分创建一个包含表格的 `div` 元素的 HTML 文档。\n\n```html\n<div id=\"databox\">\n  <table>\n\
    \    <tr>\n      <td></td>\n      <td class=\"col\">1</td>\n      <td class=\"\
    col\">2</td>\n      <td class=\"col\">3</td>\n      <td class=\"col\">4</td>\n\
    \      <td class=\"col\">5</td>\n      <td class=\"tot\">Total</td>\n    </tr>\n\
    \    <tr>\n      <td class=\"row\">1</td>\n      <td id=\"n0\"></td>\n      <td\
    \ id=\"n1\"></td>\n      <td id=\"n2\"></td>\n      <td id=\"n3\"></td>\n    \
    \  <td id=\"n4\"></td>\n      <td id=\"rt1\"></td>\n    </tr>\n    <tr>\n    \
    \  <td class=\"row\">2</td>\n      <td id=\"n5\"></td>\n      <td id=\"n6\"></td>\n\
    \      <td id=\"n7\"></td>\n      <td id=\"n8\"></td>\n      <td id=\"n9\"></td>\n\
    \      <td id=\"rt2\"></td>\n    </tr>\n    <tr>\n      <td class=\"row\">3</td>\n\
    \      <td id=\"n10\"></td>\n      <td id=\"n11\"></td>\n      <td id=\"n12\"\
    ></td>\n      <td id=\"n13\"></td>\n      <td id=\"n14\"></td>\n      <td id=\"\
    rt3\"></td>\n    </tr>\n    <tr>\n      <td class=\"col\">1</td>\n      <td class=\"\
    col\">2</td>\n      <td class=\"col\">3</td>\n      <td class=\"col\">4</td>\n\
    \      <td class=\"col\">5</td>\n      <td id=\"gt\" class=\"tot\"></td>\n   \
    \ </tr>\n  </table>\n</div>\n```\n\n![image](img/htmlb.jpg)\n\nwebapp.html\n\n\
    ![image](img/hot.jpg)表格中的空单元格具有 `id` `n0-n14`，行合计单元格具有 `rt1-rt3`，列合计单元格具有 `ct1-ct3`，右下角的总计单元格具有\
    \ `id` `gt`。在表格之后添加一个包含两个选择框、一个文本输入和一个按钮的表单。\n\n```html\n<form action=\"#\">\n\
    \  <fieldset id=\"editbox\">\n    <legend>单元格编辑器</legend>\n    <div>\n      <select\
    \ id=\"rownum\">\n        <option selected=\"selected\">1</option>\n        <option>2</option>\n\
    \        <option>3</option>\n      </select>\n      <select id=\"colnum\">\n \
    \       <option selected=\"selected\">1</option>\n        <option>2</option>\n\
    \        <option>3</option>\n        <option>4</option>\n        <option>5</option>\n\
    \      </select>\n      新值: <input id=\"newval\" type=\"text\" size=\"5\" value=\"\
    \">\n      <input type=\"button\" value=\"更新\" onclick=\"update()\">\n    </div>\n\
    \  </fieldset>\n</form>\n```\n\n在 HTML 文档的头部部分添加样式表，然后通过 HTTP 打开网页以查看应用于表格和表单的样式。\n\
    \n```css\n<style>\n  legend { background: Tomato; color: White; }\n  table { text-align:\
    \ center; }\n  td { width: 50px; height: 20px; }\n  td.col { background: LightBlue;\
    \ }\n  td.row { background: LightGreen; }\n  td.tot { background: DarkOrange;\
    \ color : White; }\n  td.gto { background: Khaki; }\n  #databox { width: 360px;\
    \ padding: 5px; margin: auto; }\n  #editbox { width : 360px; padding : 5px; margin:\
    \ auto; border: 1px solid Tomato; color: Tomato; }\n</style>\n```\n\n"
- fmt: "\nThe JSON and HTML files in this example are located in the ”htdocs” folder\
    \ of a web server running on this PC, so the domain URL address in HTTP is “localhost”.\n\
    \n## Fill Cells\n\nHaving created the web application table and form [here](#chapter08.xhtml_division)\
    \ a JSON data file and JavaScript routines can be created with which to populate\
    \ the table.\n\n![image](images/1b.jpg)Open a plain text editor, such as Windows’\
    \ Notepad app, then create a JSON document with an object containing fifteen key:value\
    \ pairs\n\n![image](images/pg161_3.jpg)\n\n`data.json`\n\n![image](images/pg164_1.jpg)\n\
    \n![image](images/2b.jpg)Save the JSON document, alongside the HTML document,\
    \ in the “htdocs” folder of the web server\n\n![image](images/3b.jpg)Add a `<script>\
    \ </script>` element just before the closing `</body>` tag of the HTML document\n\
    \n![image](images/htmlb.jpg)\n\n`webapp.html` (continued)\n\n![image](images/4b.jpg)Next,\
    \ insert a function in the `<script>` element to perform an asynchronous HTTP\
    \ request by creating a promise that must be resolved by grabbing the JSON data\n\
    \n```javascript\nfetch( ‘http://localhost/data.json’ )\n```\n\n```javascript\n\
    .then( response => response.json( ) )\n```\n\n![image](images/5b.jpg)Now, chain\
    \ two more statements onto the promise that will pass the JSON data to the next\
    \ chained method, or log an error message if the request cannot be resolved\n\n\
    ```javascript\n.then( cells => fill( cells ) )\n```\n\n```javascript\n.catch(\
    \ err => console.log( err ) )\n```\n\n![image](images/6b.jpg)Save the HTML document\
    \ then reload the web page via HTTP and open the Console in Developer Tools to\
    \ see an error message – as the function to receive the JSON data has not yet\
    \ been created\n\n![image](images/pg165_1.jpg)\n\n![image](images/7b.jpg)Return\
    \ to the `<script>` element in the HTML document and create the function to receive\
    \ the JSON data and have it insert all its values into the table cells\n\n```javascript\n\
    function fill( cells ) {\n  const values = Object.values( cells )\n  let i = 0\n\
    \  while( i < values.length ) {\n    document.getElementById( ‘n’ + i ).innerText\
    \ =\n    values[ i ].toFixed( 2 )\n    i++\n  }\n}\n```\n\n![image](images/8b.jpg)Save\
    \ the HTML document again, then reload the web page via HTTP to see the values\
    \ appear in the table\n\n![image](images/pg165_2.jpg)\n\n## Total Values\n\nOnce\
    \ the empty white table cells have been filled with data, following the steps\
    \ [here](#chapter08.xhtml_sec80), row totals, column totals, and a grand total\
    \ can be calculated and written into the table.\n\n![image](images/1b.jpg)At the\
    \ end of the `fill( cells )` function block, just before the final `}`, insert\
    \ a call to a function that will calculate the totals\n\n```javascript\ntotal(\
    \ )\n```\n\n![image](images/htmlb.jpg)\n\n`webapp.html` (continued)\n\n![image](images/2b.jpg)Begin\
    \ the function to calculate totals by initializing four variables\n\n```javascript\n\
    function total( ) {\n  let i = 0\n  let sum = 0\n  let rownum = 1\n  let colnum\
    \ = 0\n  // Statements to be inserted here.\n}\n```\n\n![image](images/3b.jpg)After\
    \ the variables in the function block, insert a loop to write the total of each\
    \ row in the cell at the end of each row\n\n```javascript\nfor ( i = 0 ; i < 15\
    \ ; i++ ) {\n  sum +=\n  parseFloat( document.getElementById( ‘n’ + i ).innerText\
    \ )\n  if ( ( i + 1 ) % 5 === 0 ) {\n    document.getElementById( ‘rt’ + rownum\
    \ ).innerText =\n    sum.toFixed( 2 )\n    rownum++\n    sum = 0\n  }\n}\n```\n\
    \n![image](images/hot.jpg)\n\nThis loop selects the row cells by appending the\
    \ incrementing index number to the letter “n” to select the element `id` values\
    \ `n0`, `n1`, `n2`, `n3`, `n4` then the next row cells.\n\n![image](images/4b.jpg)Next,\
    \ in the function block, insert a loop to write the total of each column in the\
    \ cell at the bottom of each column\n\n```javascript\nwhile ( colnum !== 5 ) {\n\
    \  for ( i = 0 ; i < 15 ; i++ ) {\n    if ( i % 5 === 0 ) sum += parseFloat(\n\
    \      document.getElementById( ‘n’ + ( i + colnum ) ).innerText )\n    )\n  }\n\
    \  colnum++\n  document.getElementById( ‘ct’ + colnum ).innerText =\n  sum.toFixed(\
    \ 2 )\n  sum = 0\n}\n```\n\n![image](images/5b.jpg)Now, in the function block,\
    \ insert a loop to write the grand total of all white cells in the cell at the\
    \ bottom-right corner of the table\n\n```javascript\nfor ( i = 0 ; i < 15 ; i++\
    \ ) {\n  sum +=\n  parseFloat( document.getElementById( ‘n’ + i ).innerText )\n\
    }\ndocument.getElementById( ‘gt’ ).innerText = sum.toFixed( 2 )\n```\n\n![image](images/hot.jpg)\n\
    \nNotice that the `toFixed( 2 )` method ensures the cell values will appear with\
    \ two decimal places.\n\n![image](images/6b.jpg)Save the changes and reload the\
    \ web page via HTTP to see the totals get written in the table\n\n![image](images/pg167_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe loop selects the column cells by appending the\
    \ incrementing index number plus the incrementing column number to the letter\
    \ “n” to select the element `id` values `n0`, `n5`, `n10`, then the next column\
    \ cells.\n\n## Update App\n\nOnce the total cells have been filled, following\
    \ the steps [here](#chapter08.xhtml_sec81), the form button’s event-handler function,\
    \ which allows the user to update the table, can be added to the script.\n\n![image](images/1b.jpg)Begin\
    \ a function that initializes six variables\n\n```javascript\nfunction update(\
    \ ) {\n  let row =\n  document.getElementById( ‘rownum’ ).options.selectedIndex\n\
    \  let col =\n  document.getElementById( ‘colnum’ ).options.selectedIndex\n  let\
    \ newval =\n  parseFloat( document.getElementById( ‘newval’ ).value )\n  let legend\
    \ = document.getElementById( ‘legend’ )\n  let target = null\n  // Statements\
    \ to be inserted here.\n}\n```\n\n![image](images/htmlb.jpg)\n\n`webapp.html`\
    \ (continued)\n\n![image](images/forget.jpg)\n\nThe `parseFloat( )` function must\
    \ be used here to convert the String text input into a Number data type for arithmetic\
    \ to be performed by the script.\n\n![image](images/2b.jpg)Next, in the function\
    \ block, insert statements that validate the form data and write an advisory message\
    \ if it’s invalid\n\n```javascript\nif( row === 0 ) { legend.innerText = ‘Select\
    \ a row’ ; return }\nif( col === 0 ) { legend.innerText = ’Select a column’ ;\
    \ return }\nif( !newval ) { legend.innerText = ‘Enter a value’ ; return }\nif(\
    \ isNaN( newval ) ) { legend.innerText = ‘Enter a number’ ; return }\n```\n\n\
    ![image](images/3b.jpg)Now, in the function block, enter the user’s valid input\
    \ value into the chosen cell then calculate and apply the new totals\n\n```javascript\n\
    target = ( ( ( row - 1 ) * 5 ) + col ) -1\ndocument.getElementById( ‘n’ + target\
    \ ).innerText =\nnewval.toFixed( 2 )\ntotal( )\n```\n\n![image](images/4b.jpg)Finally,\
    \ in the function block, reset the form for further input\n\n```javascript\ndocument.getElementById(\
    \ ‘rownum’ ).options[ 0 ].selected = true\ndocument.getElementById( ‘colnum‘ ).options[\
    \ 0 ].selected = true\ndocument.getElementById( ‘newval‘ ).value = ‘ ‘\nlegend.innerText\
    \ = ‘Cell Editor’\n```\n\n![image](images/5b.jpg)Save the HTML document then open\
    \ the web page in your browser via HTTP and edit a cell value to see the totals\
    \ get updated\n\n![image](images/pg169_1.jpg)\n\nFor example: Select the second\
    \ row and the first column\n\n![image](images/pg169_2.jpg)\n\nEnter a new value\
    \ and click the button\n\n![image](images/hot.jpg)\n\nWhile the entry is incomplete\
    \ you can click the button to see the validation messages appear.\n\n![image](images/pg169_3.jpg)\n\
    \nSee the cell value, column total, row total, and grand total all get updated\
    \ and see the form reset for further editing\n\n![image](images/forget.jpg)\n\n\
    The `toFixed( 2 )` function ensures that whole number inputs appear with two decimal\
    \ places.\n\nSummary\n\n•JSON is a text format that is used to store and exchange\
    \ data and is a subset of the JavaScript language.\n\n•JSON objects contain a\
    \ comma-separated list of key:value pairs within curly brackets.\n\n•All keys\
    \ in a JSON object must be of the String data type.\n\n•All values in a JSON object\
    \ can only be of the String, Number, Object, Array, Boolean, or null data type.\n\
    \n•JavaScript objects can be converted to JSON objects by the `JSON.stringify(\
    \ )` method.\n"
