    as the argument to the window.alert( ) method. This gets displayed on a dialog
    box with just an “OK” button, which merely closes the dialog box.


    ![image](images/pg112_1.jpg)


    More usefully, a message can be specified as the argument to the window.confirm(
    ) method to request a decision from the user. This gets displayed on a dialog
    box with an “OK” button and a “Cancel” button. Either button will close the dialog
    box when pushed, but the “OK” button returns a true value, whereas the “Cancel”
    button returns a false value.


    A message can also be specified as the argument to the window.prompt( ) method
    to request input from the user. This gets displayed on a dialog box with an “OK”
    button, a “Cancel” button, and a text input field. Either button will close the
    dialog box when pushed, but the “OK” button returns the value in the text field,
    whereas the “Cancel” button returns a null value. A second argument can also be
    supplied to the window.prompt( ) method to specify default content for the text
    field.


    ![image](images/1bl.jpg)Create an HTML document with an empty paragraph


    **<p id=”response” style=”font:1.5em sans-serif”></p>**


    ![image](images/htmlbl.jpg)


    dialogs.html


    ![image](images/2bl.jpg)Next, in a script element, create a self-invoking function
    that begins by initializing one variable reference


    **const info = document.getElementById( ‘response’ )**


    ![image](images/3bl.jpg)Now, add a statement to display a message on a simple
    dialog box


    **window.alert( ‘Hello from JavaScript’ )**


    ![image](images/4bl.jpg)Then, add a statement to request a decision from the user
    and write the response in the paragraph


    **info.innerHTML = ‘Confirm: ‘ + window.confirm( ‘Go or Stop?’ )**


    ![image](images/5bl.jpg)Next, add a statement to request text input from the user
    and write the text response into the paragraph


    **info.innerHTML += ‘<br>Prompt: ‘ + window.prompt( ‘Yes or No?’, ‘Yes’ )**


    ![image](images/6bl.jpg)Save the HTML document, then open it in your browser to
    see the message appear on a simple dialog box


    ![image](images/pg113_1.jpg)


    ![image](images/7bl.jpg)Click the OK button on each dialog box to close them in
    turn, then see the response appear in the paragraph


    ![image](images/pg113_2.jpg)


    ![image](images/pg113_3.jpg)


    ![image](images/pg113_4.jpg)


    ![image](images/hot.jpg)


    The **confirm** dialog can be used with an **if** statement to branch a script
    – for example,


    **if( confirm( ‘OK?’ ) ) { ... } else { ... }**


    ![image](images/forget.jpg)


    If the script is to use text input from a **prompt** dialog it is good practice
    to trim whitespace from the ends of the string – see [here](#chapter05.xhtml_sec50).


    Scroll Around


    The DOM window object has a scrollBy( ) method that allows the window to be scrolled
    horizontally and vertically when content overflows the window in either orientation.
    This method requires two arguments to specify the number of pixels to shift along
    the X and Y axes.


    ![image](images/pg114_1.jpg)


    When content overflows the window vertically, a scroll bar appears along the right
    edge of the browser window. The scrollBy( ) method will scroll by the number of
    pixels specified as its first argument – or until it reaches the extreme of the
    content.


    Similarly, when content overflows the window horizontally, a scroll bar appears
    along the bottom of the browser window. The scrollBy( ) method will scroll by
    the number of pixels specified as its second argument – or until it reaches the
    extreme of the content.'
