  trans: "\n\n此示例中的 JSON 和 HTML 文件位于位于此 PC 上运行的 Web 服务器的“htdocs”文件夹中，因此 HTTP 中的域名\
    \ URL 地址为“localhost”。\n\n## 填充单元格\n\n在此处创建了 Web 应用程序表格和表单后，可以创建一个 JSON 数据文件和 JavaScript\
    \ 例程，用于填充表格。\n\n![image](img/1b.jpg)打开一个纯文本编辑器（如 Windows 的记事本应用），然后创建一个包含十五个键值对的对象的\
    \ JSON 文档。\n\n![image](img/pg161_3.jpg)\n\n`data.json`\n\n![image](img/pg164_1.jpg)\n\
    \n![image](img/2b.jpg)将 JSON 文档与 HTML 文档一起保存到 Web 服务器的“htdocs”文件夹中。\n\n![image](img/3b.jpg)在\
    \ HTML 文档的 `</body>` 标签之前添加一个 `<script> </script>` 元素。\n\n![image](img/htmlb.jpg)\n\
    \n`webapp.html`（续）\n\n![image](img/4b.jpg)接下来，在 `<script>` 元素中插入一个函数，通过创建一个必须通过获取\
    \ JSON 数据来解析的 promise，来执行异步 HTTP 请求。\n\n```javascript\nfetch( ‘http://localhost/data.json’\
    \ )\n```\n\n```javascript\n.then( response => response.json( ) )\n```\n\n![image](img/5b.jpg)现在，在\
    \ promise 上再链接另外两个语句，将 JSON 数据传递给下一个链式方法，或者如果请求无法解析，则记录错误消息。\n\n```javascript\n\
    .then( cells => fill( cells ) )\n```\n\n```javascript\n.catch( err => console.log(\
    \ err ) )\n```\n\n![image](img/6b.jpg)保存 HTML 文档，然后通过 HTTP 重新加载网页并打开开发者工具中的控制台查看错误消息——因为接收\
    \ JSON 数据的函数尚未创建。\n\n![image](img/pg165_1.jpg)\n\n![image](img/7b.jpg)返回 HTML\
    \ 文档中的 `<script>` 元素，创建一个接收 JSON 数据的函数，并将其所有值插入表格单元格中。\n\n```javascript\nfunction\
    \ fill( cells ) {\n  const values = Object.values( cells )\n  let i = 0\n  while(\
    \ i < values.length ) {\n    document.getElementById( ‘n’ + i ).innerText =\n\
    \    values[ i ].toFixed( 2 )\n    i++\n  }\n}\n```\n\n![image](img/8b.jpg)再次保存\
    \ HTML 文档，然后通过 HTTP 重新加载网页即可在表格中看到数值。\n\n![image](img/pg165_2.jpg)\n\n## 总数值\n\
    \n一旦空白白色表格单元格填充了数据，就可以按照此处的步骤计算并写入行合计、列合计以及总计。\n\n![image](img/1b.jpg)在 `fill(\
    \ cells )` 函数块的末尾，最后一个 `}` 之前，插入一个计算总计的函数调用。\n\n```javascript\ntotal( )\n```\n\
    \n![image](img/htmlb.jpg)\n\n`webapp.html`（续）\n\n![image](img/2b.jpg)通过初始化四个变量开始计算总计的函数。\n\
    \n```javascript\nfunction total( ) {\n  let i = 0\n  let sum = 0\n  let rownum\
    \ = 1\n  let colnum = 0\n  // 在此处插入语句。\n}\n```\n\n![image](img/3b.jpg)在函数块变量之后，插入一个循环在每行末尾的单元格中写入每行的合计。\n\
    \n```javascript\nfor ( i = 0 ; i < 15 ; i++ ) {\n  sum +=\n  parseFloat( document.getElementById(\
    \ ‘n’ + i ).innerText )\n  if ( ( i + 1 ) % 5 === 0 ) {\n    document.getElementById(\
    \ ‘rt’ + rownum ).innerText =\n    sum.toFixed( 2 )\n    rownum++\n    sum = 0\n\
    \  }\n}\n```\n\n![image](img/hot.jpg)\n\n该循环通过在字母“n”后面附加递增的索引数字来选择行单元格，选择元素 `id`\
    \ 值为 `n0`、`n1`、`n2`、`n3`、`n4`，然后是下一行的单元格。\n\n![image](img/4b.jpg)接下来，在函数块中插入一个循环，在每列底部的单元格中写入每列的合计。\n\
    \n```javascript\nwhile ( colnum !== 5 ) {\n  for ( i = 0 ; i < 15 ; i++ ) {\n\
    \    if ( i % 5 === 0 ) sum += parseFloat(\n      document.getElementById( ‘n’\
    \ + ( i + colnum ) ).innerText )\n    )\n  }\n  colnum++\n  document.getElementById(\
    \ ‘ct’ + colnum ).innerText =\n  sum.toFixed( 2 )\n  sum = 0\n}\n```\n\n![image](img/5b.jpg)现在，在函数块中插入一个循环，在表格右下角的单元格中写入所有白色单元格的总计。\n\
    \n```javascript\nfor ( i = 0 ; i < 15 ; i++ ) {\n  sum +=\n  parseFloat( document.getElementById(\
    \ ‘n’ + i ).innerText )\n}\ndocument.getElementById( ‘gt’ ).innerText = sum.toFixed(\
    \ 2 )\n```\n\n![image](img/hot.jpg)\n\n注意 `toFixed( 2 )` 方法确保单元格值将以两位小数显示。\n\n\
    ![image](img/6b.jpg)保存更改并通过 HTTP 重新加载网页即可查看总计被写入表格。\n\n![image](img/pg167_1.jpg)\n\
    \n![image](img/hot.jpg)\n\n该循环通过在字母“n”后面附加递增的索引数字加递增的列号来选择列单元格，选择元素 `id` 值为 `n0`、`n5`、`n10`，然后是下一列的单元格。\n\
    \n## 更新应用\n\n一旦填充了合计单元，就可以按照此处的步骤向脚本添加允许用户更新表格的表单按钮事件处理函数。\n\n![image](img/1b.jpg)开始一个初始化六个变量的函数。\n\
    \n```javascript\nfunction update( ) {\n  let row =\n  document.getElementById(\
    \ ‘rownum’ ).options.selectedIndex\n  let col =\n  document.getElementById( ‘colnum’\
    \ ).options.selectedIndex\n  let newval =\n  parseFloat( document.getElementById(\
    \ ‘newval’ ).value )\n  let legend = document.getElementById( ‘legend’ )\n  let\
    \ target = null\n  // 在此处插入语句。\n}\n```\n\n![image](img/htmlb.jpg)\n\n`webapp.html`（续）\n\
    \n![image](img/forget.jpg)\n\n此处使用 `parseFloat( )` 函数将字符串输入转换为数字类型以便进行算术运算。\n\n\
    ![image](img/2b.jpg)接下来，在函数块中插入验证表单语句，如果无效则写入提示。\n\n```javascript\nif( row ===\
    \ 0 ) { legend.innerText = ‘选择行’ ; return }\nif( col === 0 ) { legend.innerText\
    \ = ‘选择列’ ; return }\nif( !newval ) { legend.innerText = ‘输入值’ ; return }\nif(\
    \ isNaN( newval ) ) { legend.innerText = ‘输入数字’ ; return }\n```\n\n![image](img/3b.jpg)现在，在函数块中将用户的有效输入进入选定的单元格，然后计算并应用新的总计。\n\
    \n```javascript\ntarget = ( ( row - 1 ) * 5 ) + col ) -1\ndocument.getElementById(\
    \ ‘n’ + target ).innerText =\nnewval.toFixed( 2 )\ntotal( )\n```\n\n![image](img/4b.jpg)最后，在函数块中重置表单以便进一步输入。\n\
    \n```javascript\ndocument.getElementById( ‘rownum’ ).options[ 0 ].selected = true\n\
    document.getElementById( ‘colnum’ ).options[ 0 ].selected = true\ndocument.getElementById(\
    \ ‘newval’ ).value = ‘ ‘\nlegend.innerText = ‘单元格编辑器’\n```\n\n![image](img/5b.jpg)保存\
    \ HTML 文档，然后通过 HTTP 在浏览器中打开网页并编辑单元格值以查看总计更新。\n\n![image](img/pg169_1.jpg)\n\n\
    例如：选择第二行第一列。\n\n![image](img/pg169_2.jpg)输入新值并点击按钮。\n\n![image](img/hot.jpg)当输入不完整时，可以点击按钮查看验证消息。\n\
    \n![image](img/pg169_3.jpg)看到单元格值、列合计、行合计以及总计全部更新，并看到表单重置以便再次编辑。\n\n![image](img/forget.jpg)\n\
    \n`toFixed( 2 )` 函数确保整数输入以两位小数显示。\n\n总结\n\n•JSON 是一种用于存储和交换数据的文本格式，是 JavaScript\
    \ 语言的子集。\n\n•JSON 对象在花括号内包含逗号分隔的键值对列表。\n\n•JSON 对象中的所有键必须是 String 类型。\n\n•JSON\
    \ 对象中的所有值只能是 String、Number、Object、Array、Boolean 或 null 类型。\n\n•可以使用 `JSON.stringify(\
    \ )` 方法将 JavaScript 对象转换为 JSON 对象。\n\n"
- fmt: "\n- JSON objects can be converted to JavaScript objects by the `JSON.parse()\
    \ ` method.\n- JavaScript is a single-threaded synchronous language, but browser\
    \ APIs support some asynchronous operations.\n- The event loop constantly monitors\
    \ the state of the call stack and callback queue.\n- A `Promise` object represents\
    \ the eventual completion or failure of an asynchronous operation and its resulting\
    \ value.\n- Methods `then()` and `catch()` can be chained to a `Promise` object\
    \ to handle the results of an asynchronous operation.\n- The `Fetch API` can be\
    \ used in JavaScript to asynchronously grab resources over a network.\n- On completion,\
    \ the `fetch()` method returns a `Promise` object that contains an `HTTPResponse`\
    \ object.\n- An `HTTPResponse` object has a `json()` method that can be used to\
    \ parse a JSON object.\n- Some function definitions can be written more concisely\
    \ as JavaScript `=>` arrow function expressions.\n- Arrow function expressions\
    \ treat the JavaScript `this` keyword differently to regular functions.\n- JSON\
    \ data can be used to fill table cells of a web application.\n\n# 9 Produce Script\
    \ Magic\n\nThis chapter demonstrates some magical abilities of employing various\
    \ APIs.\n\n- [Request Data](#chapter09.xhtml_sec84)\n- [Embed Vectors](#chapter09.xhtml_sec85)\n\
    - [Paint Canvas](#chapter09.xhtml_sec86)\n- [Store Data](#chapter09.xhtml_sec87)\n\
    - [Drag Items](#chapter09.xhtml_sec88)\n- [Pass Messages](#chapter09.xhtml_sec89)\n\
    - [Locate Users](#chapter09.xhtml_sec90)\n- [Summary](#chapter09.xhtml_sec91)\n\
    \n## Request Data\n\nAsynchronous JavaScript And XML (“AJAX”) allows web pages\
    \ to be updated by requesting data from a web server without interrupting other\
    \ operations.\n\nTo use AJAX, JavaScript must first create an `XMLHttpRequest`\
    \ object using the `new` keyword and `XMLHttpRequest()` constructor. The actual\
    \ request is specified as three arguments to this object’s `open()` method – stating\
    \ the retrieval method, a `URL`, and a Boolean `true` value to make the request\
    \ asynchronously.\n\nThe request can then be sent by calling the object’s `send()`\
    \ method. Finally, an event-handler must be nominated to the `XMLHttpRequest`\
    \ object’s `onreadystatechange` property to handle the response from the web server.\
    \ This can first test that the object’s `readyState` property is `4` and the object’s\
    \ `status` property is `200` to ensure that the response is indeed complete and\
    \ successful.\n\nText retrieved by an `XMLHttpRequest` object is automatically\
    \ stored in its `responseText` property, but XML data is automatically stored\
    \ in its `responseXML` property. The DOM represents the XML document elements\
    \ as “nodes” so needs additional steps to access their content. For example, all\
    \ element nodes of a particular tag name can be assigned to an array variable\
    \ using the `getElementsByTagName()` method of the `responseXML` property.\n\n\
    Each element node has a `firstChild` property, which is the text node of its content.\
    \ This, in turn, has a `data` property containing the actual text content. So\
    \ the `firstChild.data` property of an element node reveals the text within that\
    \ XML element.\n\n![image](images/pg172_2.jpg)\n\n`books.xml`\n\n![image](images/1r.jpg)Create\
    \ an XML document with 10 `<book>` elements containing inner (child) `<title>`\
    \ elements\n\n![image](images/pg172_1.jpg)\n\n![image](images/hot.jpg)\n\nAt each\
    \ stage of the request, the `readyState` property gets assigned a number:\n\n\
    - **0**: Not initialized\n- **1**: Server connected\n- **2**: Request received\n\
    - **3**: Processing request\n- **4**: Response is ready\n\nUpon completion, the\
    \ `status` property gets assigned a code:\n\n- **200**: “OK”\n- **403**: “Forbidden”\n\
    - **404**: “Page Not Found”\n\n![image](images/forget.jpg)\n\nThe screenshot here\
    \ only shows two of the 10 `<book>` elements that are provided in the free source\
    \ code file that you can download from [www.ineasysteps.com/resource-centre/downloads](http://www.ineasysteps.com/resource-centre/downloads)\n\
    \n![image](images/2r.jpg)Create an HTML document that includes a button element\
    \ and an empty ordered list element\n\n```html\n<button onclick=\"loadXML()\"\
    >Get Books</button>\n<ol id=\"list\"></ol>\n```\n\n![image](images/htmlr.jpg)\n\
    \n`xmldom.html`\n\n![image](images/3r.jpg)Begin a script with a function to request\
    \ XML data\n\n```javascript\nfunction loadXML() {\n  const xmlhttp = new XMLHttpRequest();\n\
    \  xmlhttp.open('GET', 'books.xml', true);\n  xmlhttp.send();\n  xmlhttp.onreadystatechange\
    \ = function() {\n    if(this.readyState == 4 && this.status == 200)\n      getData(this)\n\
    \  }\n}\n```\n\n![image](images/4r.jpg)Next, add a function to handle the response\
    \ and write the XML data into the page’s empty list element\n\n```javascript\n\
    function getData(xml) {\n  const xmlDoc = xml.responseXML;\n  const tags = xmlDoc.getElementsByTagName('book');\n\
