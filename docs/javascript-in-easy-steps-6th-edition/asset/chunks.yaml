    \n![image](img/snake.jpg)\n\n如果移除一个绑定了事件处理程序的对象，你也应该移除其事件处理程序，以避免创建内存泄漏。\n\n##\
    \ 事件值\n\n除了此处 描述的鼠标事件外，还有一个 `“mousemove”` 事件。它可以将一个事件对象传递给事件处理函数，该对象包含 `x` 和 `y`\
