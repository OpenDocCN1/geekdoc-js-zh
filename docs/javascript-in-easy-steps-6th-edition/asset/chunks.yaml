    **Check Boxes**


    Radio button groups allow the user to select any one button from the group, and
    the HTML name attributes of all radio button input elements in that group share
    the same name. In scripting terms, that group name is the name of an array in
    which each radio button object can be referenced using its array index value.


    ![image](images/pg146_1.jpg)


    Unlike radio button groups, checkbox button groups allow the user to select one
    or more buttons in that group. But as with radio button groups, each name attribute
    shares the same group name. That group name is also the name of an array in which
    each checkbox button object can be referenced by its array index value.


    Both radio button objects and checkbox button objects have a checked Boolean property,
    which is true when the button is selected and false otherwise. Looping through
    a button group array to inspect the checked property of each object determines
    which buttons are selected. A script statement can also assign a true value to
    the checked property of a button to select it.


