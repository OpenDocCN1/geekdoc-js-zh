  trans: "\n\n## 元素数组 (#chapter07.xhtml_sec64)\n\n## 元素 (#chapter07.xhtml_sec65)\n\
    \n## 写入内容 (#chapter07.xhtml_sec66)\n\n## 管理 Cookies (#chapter07.xhtml_sec67)\n\
    \n## 加载事件 (#chapter07.xhtml_sec68)\n\n## 鼠标事件 (#chapter07.xhtml_sec69)\n\n## 事件值\
    \ (#chapter07.xhtml_sec70)\n\n## 复选框 (#chapter07.xhtml_sec71)\n\n## 选择选项 (#chapter07.xhtml_sec72)\n\
    \n## 重置更改 (#chapter07.xhtml_sec73)\n\n## 验证表单 (#chapter07.xhtml_sec74)\n\n## 总结\
    \ (#chapter07.xhtml_sec75)\n\n## 提取信息\n\nDOM window 对象子元素中最有趣的是 document 对象，它提供了对\
    \ HTML 文档的访问。\n\n![image](img/pg130_1.jpg)\n\ndocument 对象有许多个描述文档及其位置的属性：\n\n\
    • `document.title` 属性包含 HTML 文档 title 元素中指定的值。\n\n• HTML 文档的位置包含在 `document.URL`\
    \ 属性中，与 `location.href` 属性中的值相似。\n\n•托管文档的域名包含在 `document.domain` 属性中，类似于 `location.host`\
    \ 值。\n\n• HTML 文档会将其创建日期或最后修改日期作为 HTTP 请求头提供给浏览器，以便浏览器决定是使用文档的缓存还是获取新副本。此日期也可以在\
    \ JavaScript 中通过 DOM 的 `document.lastModified` 属性获取。\n\n![image](img/1v.jpg)创建一个\
    \ HTML 文档，在其主体部分提供一个指向第二个（目标）HTML 文档的超链接。\n\n```html\n<p>\n<a href=\"info-2.html\"\
    >跳转到下一页</a>\n</p>\n```\n\n![image](img/htmlv.jpg)\n\ninfo-1.html\n\n![image](img/2v.jpg)接下来，创建目标\
    \ HTML 文档，它包含一个空的无序列表。\n\n```html\n<ul id=\"list\"></ul\n```\n\n![image](img/htmlv.jpg)\n\
    \ninfo-2.html\n\n![image](img/3v.jpg)现在，在 script 元素中创建一个自执行函数，该函数初始化一个变量引用。\n\n\
    ```javascript\nconst list = document.getElementById('list');\n```\n\n![image](img/4v.jpg)然后，添加语句来列出文档的特征。\n\
    \n```javascript\nlist.innerHTML = '<li>来源页: ' + document.referrer;\nlist.innerHTML\
    \ += '<li>标题: ' + document.title;\nlist.innerHTML += '<li>URL: ' + document.URL;\n\
    list.innerHTML += '<li>域名: ' + document.domain;\nlist.innerHTML += '<li>最后修改:\
    \ ' + document.lastModified;\n```\n\n![image](img/5v.jpg)将 HTML 文档保存在同一个文件夹中，然后在浏览器中打开包含链接的文档。\n\
    \n![image](img/pg131_1.jpg)\n\n![image](img/6v.jpg)现在，点击超链接在浏览器中加载第二个 HTML 文档，并查看文档信息。\n\
    \n![image](img/pg131_2.jpg)\n\n![image](img/forget.jpg)\n\n`document.lastModified`\
    \ 中的日期仅与 HTML 文档本身有关，而与 HTML 文档可能导入的任何样式表或外部脚本文件无关。\n\n![image](img/snake.jpg)\n\
    \n这里显示的域名位于本地系统 Web 服务器上的页面。如果页面位于你的桌面上，`document.referrer` 和 `document.domain`\
    \ 属性将不会赋予任何值。\n\n## 元素数组\n\nDOM document 对象拥有表单、图像、链接、样式表和脚本的子对象。这些子对象都是数组，其中每个数组元素按照它们在\
    \ HTML 文档中出现的顺序代表文档组件。例如，文档主体中的第一张图像（由 HTML `<img>` 标签指定）由 `document.images[0]`\
    \ 表示。这意味着可以使用 `document.images[0].src` 引用其 URL，这会显示分配给 HTML `<img>` 标签 `src` 属性的路径。在脚本中为此组件分配新\
    \ URL 将动态替换旧图像。\n\n![image](img/pg132_1.jpg)\n\n`links` 数组代表 HTML 文档中的 HTML `<a>`\
    \ 标签；`styleSheets` 数组代表 HTML `<style>` 标签；`scripts` 数组代表 HTML `<script>` 标签。\n\
    \n`forms` 数组代表 HTML `<form>` 标签，但它也有自己的子元素对象，它是所有表单组件的数组。例如，HTML 文档中第一个表单的第一个组件的值可以使用\
    \ `document.forms[0].elements[0].value` 引用。在脚本中为此组件分配新值将动态替换旧值。\n\n![image](img/1v.jpg)创建一个包含表单和空列表的\
    \ HTML 文档。\n\n```html\n<form>\n<img src=\"user.png\" alt=\"用户\" height=\"64\"\
    \ width=\"64\">\n<input type=\"text\" name=\"topic\" size=\"30\">\n<input type=\"\
    button\" value=\"提问\">\n<br>\n<a href=\"help.html\" style=\"\">帮助？</a>\n</form>\n\
    <ul id=\"list\"></ul\n```\n\n![image](img/htmlv.jpg)\n\ncomponents.html\n\n![image](img/2v.jpg)现在，添加一个样式表来美化表单。\n\
    \n```html\n<style>\nform {\n    font:1em sans-serif;\n    width: 500px;\n    height:\
    \ 100px;\n    background: url(bg.png);\n}\n</style>\n```\n\n![image](img/pg132_2.jpg)\n\
    \nbg.png 64x64 透明\n\n![image](img/3v.jpg)\n\n接下来，在 script 元素中创建一个自执行函数，该函数初始化一个变量引用。\n\
    \n```javascript\nconst list = document.getElementById('list');\n```\n\n![image](img/snake.jpg)\n\
    \n注意 `styleSheets` 数组的驼峰命名法。\n\n![image](img/4v.jpg)现在，添加语句列出文档的组件。\n\n```javascript\n\
    list.innerHTML = '<li>表单数量: ' + document.forms.length;\nlist.innerHTML += '<li>链接数量:\
    \ ' + document.links.length;\nlist.innerHTML += '<li>图像数量: ' + document.images.length;\n\
    list.innerHTML += '<li>样式表数量: ' + document.styleSheets.length;\nlist.innerHTML\
    \ += '<li>脚本数量: ' + document.scripts.length;\n```\n\n![image](img/5v.jpg)最后，添加语句列出属性值。\n\
    \n```javascript\nlist.innerHTML += '<li>第一张图像 URL: ' + document.images[0].src;\n\
    list.innerHTML += '<li>第一个表单元素值: ' + document.forms[0].elements[0].value;\n```\n\
    \n![image](img/6v.jpg)保存 HTML 文档，然后在浏览器中打开它查看列出的文档组件。\n\n![image](img/pg133_1.jpg)\n\
    \n注意，通过样式规则包含在文档中的图像不包含在图像数组中，只有通过 `<img>` 标签包含的——因此，这里的表单背景图像（`bg.png`）没有出现在图像数组。同样，分配给\
    \ style 属性的样式规则也没有包含在 `styleSheets` 数组中。\n\n![image](img/forget.jpg)\n\n数组元素仅代表相关的\
    \ HTML 标签。\n\n## 元素\n\n![image](img/pg134_1.jpg)（等待，原文说是 pg134_1.jpg）\n\n使用组件数组配合点表示法来引用特定元素需要脚本作者计算组件数量以确定每个索引位置。这对于很长的文档来说特别繁琐，容易出错，而且修改\
    \ HTML 文档可能会更改元素的索引位置。这在早几年是必须的，但最终通过向 document 对象添加三个新方法解决了这个问题：\n\n• `document.getElementById(\
    \ )` 方法在书中之前的示例中用于从 JavaScript 代码添加内容，它允许通过 HTML id 属性值来引用任何组件。该方法仅将目标 id 值作为参数，用于引用单个特定的\
    \ HTML 元素。\n\n"
- fmt: "\n- The `document.getElementsByTagName( ` method returns an array-like `HTMLCollection`\
    \ object that references all HTML elements of the tag name specified as its argument.\
    \ A specific HTML element can then be referenced using its element index number,\
    \ as you would do in an array.\n- The `document.getElementsByClassName( ` method\
    \ returns an array-like `HTMLCollection` object that references all HTML elements\
    \ containing a class attribute that has been assigned the name specified as its\
    \ argument. A specific HTML element can then be referenced using its element index\
    \ number, as you would do in an array.\n\n![image](images/1v.jpg)Create an HTML\
    \ document containing two lists and an empty paragraph\n\n```html\n<ol>\n  <li\
    \ class=\"fruit\">Apple</li>\n  <li class=\"nut\">Almond</li>\n  <li class=\"\
    fruit\">Apricot</li>\n</ol>\n<ol>\n  <li class=\"fruit\">Blackberry</li>\n  <li\
    \ id=\"country\" class=\"nut\">Brazil</li>\n  <li class=\"fruit\">Banana</li>\n\
    </ol>\n<p id=\"info\"></p>\n```\n\n![image](images/htmlv.jpg)\n\ncollection.html\n\
    \n![image](images/snake.jpg)\n\nIn the name of the two methods that return an\
    \ `HTMLCollection` it’s “Elements” (plural) but in the name of the other method\
    \ it’s “Element” (singular).\n\n![image](images/2v.jpg)Next, in a script element,\
    \ create a self-invoking function that begins by initializing five variables\n\
    \n```javascript\nconst info = document.getElementById( ‘info’ )\nconst item =\
    \ document.getElementById( ‘country’ )\nconst lists = document.getElementsByTagName(\
    \ ‘ol’ )\nconst fruits = document.getElementsByClassName( ‘fruit’ )\nlet i = 0\n\
    ```\n\n![image](images/3v.jpg)Now, add a statement to describe an element object\
    \ and the text that element contains\n\n```javascript\ninfo.innerHTML = item +\
    \ ‘ Id: ‘ + item.innerText + ‘<br>’\n```\n\n![image](images/4v.jpg)Then, add statements\
    \ to describe an HTMLCollection object and the text its elements contain\n\n```javascript\n\
    info.innerHTML += ‘<br>’ + lists + ‘ Tags:<br>’\nfor( i = 0; i < lists.length\
    \ ; i++ ) {\n  info.innerHTML += ( i + 1 ) + ‘ of ‘ + lists.length\n  info.innerHTML\
    \ += ‘ : ‘ + lists[ i ].innerText + ‘<br>’\n}\n```\n\n![image](images/hot.jpg)\n\
    \nThe `innerText` property of an element returns only the content between its\
    \ opening and closing tags, whereas the `innerHTML` property also returns the\
    \ HTML tags. Change this to `innerHTML` to see the difference.\n\n![image](images/5v.jpg)Finally,\
    \ add statements to describe a second HTMLCollection object and the text its elements\
    \ contain\n\n```javascript\ninfo.innerHTML += ‘<br>’ + fruits + ‘ Class:<br>’\n\
    for( i = 0 ; i < fruits.length ; i++ ) {\n  info.innerHTML += ( i + 1 ) + ‘ of\
    \ ‘ + fruits.length\n  info.innerHTML += ‘ : ‘ + fruits[ i ].innerText+ ‘<br>’\n\
    }\n```\n\n![image](images/6v.jpg)Save the HTML document, then open it in your\
    \ browser to see the element values retrieved by different methods\n\n![image](images/pg135_1.jpg)\n\
    \n## Write Content\n\nAs witnessed in previous examples, the `innerHTML` and `innerText`\
    \ properties of the `document` object can be used to write content into existing\
    \ elements. The `document` object also has a `write( )` method that provides another\
    \ way to write content, but this automatically calls a `document.open( )` method\
    \ to start a new document – so the current document is no longer displayed.\n\n\
    ![image](images/pg136_1.jpg)\n\nMore usefully, a `document.createElement( )` method\
    \ accepts a tag name as its argument and creates an element of that type. Content\
    \ can then be added to the new element by assignment to its `innerHTML` or `innerText`\
    \ properties. It can then be inserted into the web page within an existing element\
    \ by specifying the new element as the argument to a `document.appendChild( )`\
    \ method.\n\nYou can also dynamically write attributes into elements by specifying\
    \ an attribute name and value as two arguments to an element’s `setAttribute(\
    \ )` method.\n\n![image](images/1v.jpg)Create an HTML document that contains a\
    \ heading and an ordered list of three items\n\n```html\n<h1 id=”heading”>Top\
    \ 3 Cities</h1>\n<ol id=”list”>\n  <li>Tokyo, Japan</li>\n  <li>New York, USA</li>\n\
    \  <li>Rio de Janeiro, Brazil</li>\n</ol>\n```\n\n![image](images/htmlv.jpg)\n\
    \nwrite.html\n\n![image](images/2v.jpg)Save the HTML document, then open it in\
    \ your browser to see the web page\n\n![image](images/pg136_2.jpg)\n\n![image](images/3v.jpg)Next,\
    \ in a script element, create a self-invoking function that begins by initializing\
    \ two variables as new list item elements and one variable reference\n\n```javascript\n\
    const itemFour = document.createElement( ‘li’ )\nconst itemFive = document.createElement(\
    \ ‘li’ )\nconst heading = document.getElementById( ‘heading’ )\n```\n\n![image](images/4v.jpg)Now,\
    \ assign text content to the two new elements\n\n```javascript\nitemFour.innerText\
    \ = ‘London, England’\nitemFive.innerText = ‘Cape Town, South Africa’\n```\n\n\
    ![image](images/5v.jpg)Then, insert the new element content into the web page\
    \ as children of the ordered list element\n\n```javascript\ndocument.getElementById(\
    \ ‘list’ ).appendChild( itemFour )\ndocument.getElementById( ‘list’ ).appendChild(\
    \ itemFive )\n```\n\n![image](images/6v.jpg)Add an attribute to the existing heading\
    \ element to change its font color\n\n```javascript\nheading.setAttribute( ‘style’,\
    \ ‘color:Red’ )\n```\n\n![image](images/7v.jpg)Finally, change the heading to\
    \ better describe the extended list\n\n```javascript\nheading.innerText = ‘Best\
    \ Five Cities’\n```\n\n![image](images/8v.jpg)Save the HTML document once more,\
    \ then refresh your browser to see the newly written content\n\n![image](images/pg137_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nAn existing element may be removed from the web\
    \ page by specifying it as the argument to a `document.removeChild( )` method,\
    \ or replaced by specifying new and old elements as arguments to a `document.replaceChild(\
    \ )` method.\n\n![image](images/hot.jpg)\n\nYou can remove an attribute by specifying\
    \ the attribute’s name as the argument to an element’s `removeAttribute( )` method.\n\
    \n## Manage Cookies\n\nFor security reasons JavaScript cannot write regular files\
    \ on the user’s hard drive, but it can write “cookie” files to store a small amount\
    \ of data. These are limited in size to a maximum of 4KB and in number to 20 per\
    \ web server. Typically, the data stored in a cookie will identify the user for\
    \ subsequent visits to a website.\n\n![image](images/pg138_1.jpg)\n\nCookie data\
    \ is stored in the DOM `document` object’s `cookie` property as one or more “key=value”\
    \ pairs, terminated with a “;” semicolon character. The value may not contain\
    \ whitespace, commas, or semi-colons, unless passed as the argument to the built-in\
    \ `encodeURI( )` function, which encodes the string in Unicode format – for example,\
    \ this represents a space as %20.\n\nBy default, the lifespan of a cookie is limited\
    \ to the current browser session unless an expiry date is specified when the cookie\
    \ is created as an “expires=date” pair, in which the date value is a UTC string.\
    \ Typically, this is achieved using a JavaScript `Date` object converted with\
    \ its `toUTCString( )` method. Setting an existing cookie’s expiry date to a past\
    \ time will delete that cookie.\n\nRetrieving data from a cookie requires some\
    \ string manipulation to return Unicode to regular text, using the built-in `decodeURI(\
    \ )` function so %20 becomes a space character once more, and to separate the\
    \ name and value items of data. Within the cookie string multiple pairs can be\
    \ separated by specifying the “;” semicolon as the argument to the `split( )`\
    \ method. Similarly, keys and values can be separated by specifying the “=” character\
    \ as the argument to the `split( )` method. Likewise, where the value is a comma-separated\
    \ list of items, the “,” comma can be specified as the argument to the `split(\
    \ )` method to separate them as array elements.\n\nIt is useful to create an external\
    \ JavaScript file containing “setter” and “getter” utility functions that can\
    \ easily be called to store and retrieve cookie data.\n\n![image](images/1v.jpg)Begin\
    \ a JavaScript file with a setter function that has parameters for key, value,\
    \ and expiry arguments\n\n```javascript\nfunction setCookie( key, value, days\
    \ ) {\n  const d = new Date( )\n}\n```\n"
