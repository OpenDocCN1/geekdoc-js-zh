  trans: "\n\n![image](img/5r.jpg)然后，插入语句为 SVG 圆形指定点击事件处理函数\n\n```javascript\nsvgBtn.addEventListener(\
    \ ‘click’, function ( ) {\n  htmTxt.value = svgTxt.lastChild.wholeText\n  svgTxt.lastChild.replaceWith(\
    \ ‘SVG Text’ ) )\n```\n\n![image](img/6r.jpg)将 HTML 和 SVG 文档保存到 Web 服务器的“htdocs”文件夹中，然后在浏览器中打开网页并输入一些文本——点击按钮和圆形，查看你的文本如何在\
    \ HTML 和 SVG 之间发生魔法般地移动\n\n![image](img/pg175_1.jpg)\n![image](img/pg175_2.jpg)\n\
    ![image](img/pg175_3.jpg)\n![image](img/hot.jpg)\n\n注意，在 SVG DOM 中，实际文本包含在 SVG\
    \ `<text>` 元素的 `lastChild` 节点的 `wholeText` 属性中。\n\n![image](img/common3.jpg)\n\
    \n在线在 **[w3.org/TR/SVG11/svgdom.html](http://www.w3.org/TR/SVG11/svgdom.html)**\
    \ 更多关于 SVG DOM 的知识。\n\n# 绘制画布 (Paint Canvas)\n\n![image](img/pg176_1.jpg)\n\n\
    在 HTML 中，`<canvas>` 元素在页面上创建一个位图画布区域，JavaScript 可以 Canvas2D API 的方法和属性在该区域绘制形状和文本。可以轻松创建动画，只需反复清除当前画布，然后以比人眼能察觉的速度在修改后的位置重绘形状。画布动画脚本的基本组件是：\n\
    \n• 初始化 Context 对象和形状的起始位置。\n• 清空画布，然后在画布上绘制形状。\n•为下一次重绘计算新的形状位置。\n\n![image](img/1r.jpg)创建一个在\
    \ body 部分包含一个有颜色画布区域的 HTML 文档\n\n```html\n<canvas id=“canvas” width=“500” height=“150”\
    \ style=“background: Bisque; border: 2px solid Tomato”>\n[Canvas Area]\n</canvas>\n\
    ```\n\n![image](img/htmlr.jpg)\n\ncanvas.html\n\n![image](img/2r.jpg)接下来，编写一个脚本，用函数在\
    \ HTML DOM 内容加载后初始化 context 对象属性，然后用画布大小、“小球”起始位置的 X 和 Y 坐标以及它的方向步长初始化变量\n\n```javascript\n\
    function init( ) {\n  const canvas = document.getElementById( ‘canvas’ )\n  if\
    \ ( canvas.getContext ) {\n    const context = canvas.getContext( ‘2d’ )\n   \
    \ const cw = canvas.width\n    const ch = canvas.height\n    let x = 5 , y = 44\
    \ , dx = 5 , dy = 5\n    context.fillStyle = ‘Red’\n    // 在此处插入语句。\n  }\n}\n\n\
    document.addEventListener( ‘DOMContentLoaded’, init )\n```\n\n![image](img/hot.jpg)\n\
    \n要在画布上绘制，脚本必须首先创建一个具有绘制方法和属性的 `CanvasRenderingContext2D` 对象。在这里，该对象赋值给名为 `context`\
    \ 的变量。注意初始化函数会在 `DOMContentLoaded` 事件触发时被调用。\n\n![image](img/3r.jpg)现在，插入语句每隔\
    \ 25 毫秒计算新的 X 和 Y 坐标并调用函数在画布上绘制小球\n\n```javascript\nsetInterval( function( ) {\n\
    \  if ( ( x + dx > cw-30 ) || ( x + dx < 10 ) ) dx = -dx\n  if ( ( y + dy > ch-30\
    \ ) || ( y + dy < 10 ) ) dy = -dy\n  x += dx\n  y += dy\n  paint( context, cw,\
    \ ch, x, y ) } , 25 )\n```\n\n![image](img/4r.jpg)最后，添加函数以真正向画布上绘制小球\n\n```javascript\n\
    function paint( context, cw, ch, x, y ) {\n  context.clearRect( 0, 0, cw, ch )\n\
    \  context.beginPath( )\n  context.arc( x, y, 30, 0, ( Math.Pi * 2 ), true )\n\
    \  context.fill( )\n}\n```\n\n![image](img/5r.jpg)保存 HTML 文档和脚本，然后在浏览器中打开网页，查看动画小球魔法般地在画布上跳动\n\
    \n![image](img/pg177_1.jpg)\n![image](img/pg177_2.jpg)\n![image](img/hot.jpg)\n\
    \n注意当小球碰撞边界时方向步长的极性是如何反转的——这样它就不会跳出画布。\n\n![image](img/hot.jpg)\n\n创建静态背景和边框作为样式——这样它们就不需要反复绘制。\n\
    \n![image](img/common3.jpg)\n\n在线在 **[w3.org/TR/2dcontext](http://www.w3.org/TR/2dcontext)**\
    \ 更多关于 Canvas2D API 的知识。\n\n# 存储数据\n\n卓越的 Web Storage API 支持存储用户数据，它让存储用户数据变得轻而易举。它提供了\
    \ `localStorage` 对象，即使在浏览器关闭后仍保留存储的数据，以及 `sessionStorage` 对象，它只保留数据直到浏览器关闭。这些对象都具有相同存储和检索数据的方法。`setItem()`\
    \ 方法需要两个参数来指定键和要存储的数据——例如，使用 `localStorage.setItem( “Name”, “Mike” )` 中的键“Name”。然后可以通过指定键作为\
    \ `getItem()` 方法的唯一参数来检索存储的数据，或者通过指定键作为 `removeItem()` 方法的唯一参数来删除数据。此外，可以使用不带参数的\
    \ `clear()` 方法删除所有存储项。\n\n![image](img/1r.jpg)创建一个包含带有文本输入和三个按钮的 fieldset 的 HTML\
    \ 文档\n\n```html\n<fieldset> <legend id=”legend” >输入数据</legend>\n<input id=”data”\
    \ type=”text” >\n<button onclick=”store( )”>存储数据</button>\n<button onclick=”recall(\
    \ )”>召回数据</button>\n<button onclick=”remove( )”>重置</button> </fieldset>\n```\n\
    \n![image](img/htmlr.jpg)\n\nwebstorage.html\n\n![image](img/2r.jpg)接下来，为第一个按钮创建一个事件处理函数——如果有效，则将数据保存到本地存储中\n\
    \n```javascript\nfunction store( ) {\n  let data = document.getElementById( ‘data’\
    \ ).value\n  if( data === ‘‘ ) { return false } else {\n    localStorage.setItem(\
    \ ‘ls_data’ , data )\n    document.getElementById( ‘data’ ).value = ‘‘\n    document.getElementById(\
    \ ‘legend’ ).innerText =\n    localStorage.getItem( ‘ls_data’ ) + ‘ - 已存储’ )\n\
    \  }\n}\n```\n\n![image](img/3r.jpg)接下来，为第二个按钮添加事件处理函数——从本地存储中检索并显示数据\n\n```javascript\n\
    function recall( ) {\n  if ( localStorage.getItem( ‘ls_data’ ) === null ) {\n\
    \    document.getElementById( ‘legend’ ).innerText =\n    ‘输入数据’ ; return false\
    \ } else {\n    document.getElementById( ‘data’ ).value = ‘‘\n    document.getElementById(\
    \ ‘legend’ ).innerText =\n    ‘存储的数据：’ + localStorage.getItem( ‘ls_data’ )\n \
    \ }\n}\n```\n\n![image](img/snake.jpg)\n\n`localStorage` 和 `sessionStorage` 中的所有数据都以字符串值存储——因此添加检索到的值\
    \ 5 和 7 将拼接为 57。\n\n![image](img/forget.jpg)\n\n页面必须通过 HTTP（来自 Web 服务器）提供才能使用\
    \ Web Storage。它提供了 cookie 存储的替代方案，并提供了至少 5MB 的更大容量。\n\n![image](img/4r.jpg)最后，为第三个按钮添加事件处理函数——移除本地存储中的数据\n\
    \n```javascript\nfunction remove( ) {\n  if ( localStorage.getItem( ‘ls_data’\
    \ ) === null ) {\n    document.getElementById( ‘legend’ ).innerText =\n    ‘输入数据’\
    \ ; return false } else {\n    document.getElementById( ‘legend’ ).innerText =\n\
    \    localStorage.getItem( ‘ls_data’ ) + ‘ 已删除’\n    localStorage.remove( ‘ls_data’\
    \ )\n    document.getElementById( ‘data’ ).value = ‘‘\n  }\n}\n```\n"
- fmt: "\nDiscover more about the Web Storage API online at [www.w3.org/TR/webstorage](http://www.w3.org/TR/webstorage)\n\
    \n## Drag Items\n\n![image](images/pg180_1.jpg)\n\nThe ability to allow the user\
    \ to drag page objects and drop them onto a target is supported by the Drag-and-Drop\
    \ API. This specifies many events that fire when the user drags an object, but\
    \ most important are the `dragstart`, `dragover`, and `drop` events. Event-handlers\
    \ need to be scripted for each one of these events:\n\n• `ondragstart` event-handler\
    \ – to specify the `Text` data to be attached to the object being dragged when\
    \ dragging starts.\n• `ondragover` event-handler – to cancel the default behavior\
    \ of the drop target, thereby allowing objects to be dropped on it.\n• `ondrop`\
    \ event-handler – to define what should happen when an object gets dropped on\
    \ the drop target.\n\nAdditionally, the `ondrop` event-handler should typically\
    \ ensure that the target cannot be dropped on itself:\n\n![image](images/1r.jpg)Create\
    \ an HTML document with a paragraph that contains images plus an empty list in\
    \ a fieldset\n\n```html\n<p>\n<img id=\"bin\" src=\"bin.png\" alt=\"Bin\">\n<img\
    \ class=\"folder\" id=\"Red\" src=\"red.png\" alt=\"Folder\">\n<img class=\"folder\"\
    \ id=\"Yellow\" src=\"yel.png\" alt=\"Folder\">\n<img class=\"folder\" id=\"Green\"\
    \ src=\"grn.png\" alt=\"Folder\">\n</p>\n<fieldset>\n<legend>Folders Dropped:</legend>\n\
    <ol id=\"list\"></ol>\n</fieldset>\n```\n\n![image](images/pg180_2.jpg)\n\n![image](images/htmlr.jpg)\n\
    \ndragndrop.html\n\n![image](images/2r.jpg)Begin a script with a statement to\
    \ add an event listener after the DOM has completely loaded\n\n```javascript\n\
    document.addEventListener('DOMContentLoaded', dragNdrop)\n```\n\n![image](images/3r.jpg)Next,\
    \ create the event-handler function that begins by getting references to the images\
    \ and list elements\n\n```javascript\nfunction dragNdrop() {\n    const bin =\
    \ document.getElementById('bin');\n    const folders = document.getElementsByClassName('folder');\n\
    \    const list = document.getElementById('list');\n    // Statements to be inserted\
    \ here.\n}\n```\n\n![image](images/4r.jpg)Now, insert statements to attach event-handlers\
    \ to each folder image and cancel the default behavior of the bin\n\n```javascript\n\
    let i = 0;\nfor(i = 0; i < folders.length; i++) {\n    folders[i].ondragstart\
    \ = function(event) {\n        event.dataTransfer.setData('Text', this.id)\n \
    \   }\n}\nbin.ondragover = function(event) { return false }\n```\n\n![image](images/5r.jpg)Finally,\
    \ insert statements to get the id and element reference of the folder being dropped,\
    \ then (unless it’s the bin) write its id into the list and delete that folder\
    \ image\n\n```javascript\nbin.ondrop = function(event) {\n    const did = event.dataTransfer.getData('Text');\n\
    \    const tag = document.getElementById(did);\n    if (did === 'bin') { return\
    \ false }\n    else { list.innerHTML += '<li>' + did }\n    tag.parentNode.removeChild(tag)\n\
    }\n```\n\n![image](images/6r.jpg)Save the HTML document then open it in your browser\
    \ and magically drag and drop folders into the bin\n\n![image](images/pg181_1.jpg)\n\
    \n![image](images/pg181_2.jpg)\n\n![image](images/hot.jpg)\n\nNotice that the\
    \ arguments to the `dragstart` event’s `dataTransfer.setData()` method specify\
    \ the data format and the actual data – in this case the “Text” format and the\
    \ `id` of the dragged element.\n\n![image](images/common3.jpg)\n\nDiscover more\
    \ about the Drag-and-Drop API online at [dev.w3.org/html5/spec/dnd.html](http://dev.w3.org/html5/spec/dnd.html)\n\
    \n## Pass Messages\n\nThe ability to allow plain text messages to be sent between\
    \ documents is supported by the Messaging API. To send a message to another document,\
    \ the sender calls `postMessage()` on a reference to the target window (such as\
    \ an `iframe` element). The receiver listens for the `message` event and processes\
    \ the data from the `event` object. For security, the receiver should always verify\
    \ the sender's origin using `event.origin`.\n\n```javascript\n// Sender side\n\
    const cage = document.getElementById('cage').contentWindow;\ncage.postMessage('Hello\
    \ from sender', 'http://localhost');\n```\n\n```javascript\n// Receiver side\n\
    window.addEventListener('message', function(event) {\n    if (event.origin ===\
    \ 'http://localhost') {\n        document.getElementById('msg').innerText = event.data;\n\
    \    }\n});\n```\n\n## Locate Users\n\nThe ability to pinpoint the user’s geographic\
    \ location is supported by the wonderful Geolocation API. This first requests\
    \ the user’s consent to share location details – to send information about nearby\
    \ wireless access points and the computer’s IP address to, for example, Google\
    \ Location Services. This service returns the user’s estimated latitude and longitude\
    \ coordinates. Coordinates successfully retrieved can be displayed on the page\
    \ and supplied to the Google Maps service to acquire a map at that location.\n\
    \nCreate an HTML document that contains two fixed-size paragraphs in the body\
    \ section:\n\n```html\n<p id=\"msg\" style=\"width:450px;height:50px;\"></p>\n\
    ```\n"
