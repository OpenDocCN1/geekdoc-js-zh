    or the US New York Lotto game.


    ![image](images/pg97_3.jpg)


    **Unite Strings**


    JavaScript has a String object that provides useful methods to manipulate string
    values. There is, however, no need to create instances of the String object with
    the new keyword and the String( ) constructor, as its methods can simply be applied
    to string variables using dot notation. For example, str.toUpperCase( ) returns
    all characters of a string variable named “str” in uppercase, whereas str.toLowerCase(
    ) returns all its characters in lowercase.


    ![image](images/pg98_1.jpg)


    There is also a string length property that stores the total number of characters
    in a string.


    Many of the examples listed earlier use the **+** concatenation operator to unite
    multiple strings but, alternatively, the string concat( ) method can be used to
    append one or more strings supplied as a comma-separated list of arguments.


    The eval( ) built-in function is also used to unite strings and variables by some
    script authors – but this absolutely should be avoided. The eval( ) function directly
    calls the JavaScript compiler to compile its string argument into a JavaScript
    statement:


    •If the string represents an expression, eval( ) will evaluate that expression
    – for example, eval( ‘1 + 1’ ) returns 2.


    •If the string represents a statement, or sequence of statements,eval( will evaluate
    the last statement – for example, the code eval( ‘let num = 100 ; alert( num )’
    ) produces an alert dialog.


    ![image](images/pg98_2.jpg)


    This use of eval( ) incurs a large cost in script performance and is unnecessary
    in almost every case as there is usually a more efficient and elegant solution.
    Furthermore, the eval( ) function can have security implications if the script
    allows user input to be evaluated as a JavaScript instruction. This provides the
    opportunity to execute malicious code. For example, the code eval( ‘while( true)
    ; alert( )’ ) will produce an infinite loop that locks the browser.


