    \ function expressions are also known as Immediately Invoked Function Expressions\
    \ (IIFE – often pronounced “iffy”).\n\n![image](images/1b.jpg)Create an HTML document\
    \ with a script that calls a function that has not yet been declared\n\n```javascript\n\
    console.log( ‘Hoisted: ‘ + add( 100, 200 ) )\n```\n\n![image](images/htmlb.jpg)\n\
    \nanonymous.html\n\n![image](images/2b.jpg)Next, add below the function that is\
    \ called above\n\n```javascript\nfunction add( numOne, numTwo ) {\n  return numOne\
    \ + numTwo\n}\n```\n\n![image](images/3b.jpg)Now, add a function that assigns\
    \ the function above to a variable, then calls the assigned function\n\n```javascript\n\
    let addition = add\nconsole.log( ‘Assigned: ‘ + addition( 32, 64 ) )\n```\n\n\
    ![image](images/4b.jpg)Then, assign a similar, but anonymous, function to a variable\
    \ and call that assigned function\n\n```javascript\nlet anon = function ( numOne,\
    \ numTwo ) {\n  let result = numOne + numTwo ; return result\n}\nconsole.log(\
    \ ‘Anonymous: ‘ + anon( 9, 1 ) )\n```\n\n![image](images/5b.jpg)Finally, assign\
    \ the value returned from a self-invoking function to a variable and display that\
    \ value\n\n```javascript\nlet iffy = ( function ( ) {\n  let str = ‘Self Invoked\
    \ Output’ ; return str\n} ) ( )\nconsole.log( iffy )\n```\n\n![image](images/6b.jpg)Save\
    \ the HTML document, then open it in your browser and launch the console to see\
    \ values returned from functions\n\n![image](images/pg21_1.jpg)\n\n![image](images/hot.jpg)\n\
    \nThe significance of self-invoking functions may not be immediately obvious,\
    \ but their importance should become clearer by the end of this chapter.\n\n##\
    \ Recognize Scope\n\nThe extent to which variables are accessible in your scripts\
    \ is determined by their “lexical scope” – the environment in which the variable\
    \ was created. This can be either “global” or “local”.\n\n![image](images/pg22_1.jpg)\n\
    \n### Global Scope\n\nVariables created outside function blocks are accessible\
    \ globally throughout the entire script. This means they exist continuously and\
    \ are available to functions within the same script environment. At first glance\
    \ this might seem very convenient, but it has a very serious drawback in that\
    \ variables of the same name can conflict. For example, imagine that you have\
    \ created a global `myName` variable that has been assigned your name, but then\
    \ also include an external script in which another developer has created a global\
    \ `myName` variable that has been assigned his or her name. Both like-named variables\
    \ exist in the same script environment, so conflict. This is best avoided so you\
    \ should not create global variables to store primitive values (all data types\
    \ except `Object` and `Function`) within your scripts.\n\n### Local Scope\n\n\
    Variables created inside function blocks are accessible locally throughout the\
    \ life of the function. They exist only while the function is executing, then\
    \ they are destroyed. Their script environment is limited – from the point at\
    \ which they are created, to the final `}` curly bracket, or the moment when the\
    \ function returns. It is good practice to declare variables at the very beginning\
    \ of the function block so their lexical scope is the duration of the function.\
    \ This means that like-named variables can exist within separate functions without\
    \ conflict. For example, a local `myName` variable can exist happily inside separate\
    \ functions within your script and inside functions in included external scripts.\
    \ It is recommended that you try to create only local variables to store values\
    \ within your scripts.\n\n## Best Practice\n\nDeclaring global variables with\
    \ the older `var` keyword allows like-named conflicting variables to overwrite\
    \ their assigned values without warning. The more recent `let` and `const` keywords\
    \ prohibit this and instead recognize the behavior as an “Uncaught SyntaxError”.\
    \ It is therefore recommended that you create variables declared using the `let`\
    \ or `const` keywords to store values within your scripts.\n\n![image](images/hot.jpg)\n\
    \nYou will discover how to catch errors [here](#chapter03.xhtml_sec28).\n\n![image](images/1b.jpg)Create\
    \ an external script that calls a function to output the value of a global variable\n\
    \n```javascript\nlet myName = ‘External Script’\nfunction readName( ) { console.log(\
    \ myName ) }\nreadName( )\n```\n\n![image](images/pg23_1.jpg)\n\nexternal.js\n\
    \n![image](images/2b.jpg)Create an HTML document that includes the external script\
    \ and adds a similar script\n\n```html\n<script src=”external.js”></script>\n\
    <script>\nlet myName = ‘Internal Script’\nfunction getName( ) { console.log( myName\
    \ ) }\ngetName( )\n</script>\n```\n\n![image](images/htmlb.jpg)\n\nscope.html\n\
    \n![image](images/3b.jpg)Save both files in the same folder, then open the HTML\
    \ document to see a conflict error reported in the console\n\n![image](images/pg23_2.jpg)\n\
    \n![image](images/4b.jpg)Edit both scripts to make the global variables into local\
    \ variables then refresh the browser to see no conflict\n\n```javascript\nfunction\
    \ readName( ) {\n  let myName = ‘External Script’ ; console.log( myName )\n}\n\
    function getName( ) {\n  let myName = ‘Internal Script’ ; console.log( myName\
    \ )\n}\n```\n\n![image](images/pg23_3)\n\n![image](images/forget.jpg)\n\n## Use\
    \ Closures\n\nThe previous example demonstrated the danger of creating global\
    \ variables to store values, but sometimes you will want to store values that\
    \ remain continuously – for example, to remember an increasing score as the script\
    \ proceeds. How can you do this without global variables? The answer lies with\
    \ the use of “closures”.\n\n![image](images/pg24_1.jpg)\n\nA closure is a function\
    \ nested inside an outer function that retains access to variables declared in\
    \ the outer function – because that is the lexical scope in which the function\
    \ was created.\n\n![image](images/1b.jpg)Create an HTML document with a script\
    \ that assigns a self-invoking function to a global variable\n\n```javascript\n\
    const add = ( function ( ) {\n  // Statements to be inserted here.\n} ) ( )\n\
    ```\n\n![image](images/htmlb.jpg)\n\nclosure.html\n\n![image](images/2b.jpg)Next,\
    \ insert statements to initialize a local variable and assign a function to a\
    \ local variable in the same scope\n\n```javascript\nlet count = 0\nconst nested\
    \ = function ( ) { return count = count + 1 }\n```\n\n![image](images/3b.jpg)Now,\
    \ insert a statement to return the inner function – assigning the inner function\
    \ to the global variable\n\n```javascript\nreturn nested\n```\n\n![image](images/4b.jpg)Finally,\
    \ add three identical function calls to the inner function that is now assigned\
    \ to the global variable\n\n```javascript\nconsole.log( ‘Count is ‘ + add( ) )\n\
    console.log( ‘Count is ‘ + add( ) )\nconsole.log( ‘Count is ‘ + add( ) )\n```\n\
    \n![image](images/5b.jpg)Save the HTML document, then open it in your browser\
    \ and launch the console to see values returned from a closure\n\n![image](images/pg24_2.jpg)\n\
    \n![image](images/forget.jpg)\n\nSelf-invoking function expressions are described\
    \ [here](#chapter01.xhtml_sec8). They execute their statements one time only.\
    \ Here, you can use `console.log( add )` to confirm that the function expression\
    \ has been assigned to the outer variable.\n\nIt can be difficult to grasp the\
    \ concept of closures, as it would seem that the `count` variable in this example\
    \ should be destroyed when the self-invoking function has completed execution.\
    \ In order to better understand how closures work, you can explore the `prototype`\
    \ property of the assigned function.\n\n![image](images/6b.jpg)Add a statement\
    \ at the end of the script to reveal how the assigned function has been constructed\
    \ internally\n\n```javascript\nconsole.log( add.prototype )\n```\n\n![image](images/7b.jpg)Save\
    \ the HTML document, then refresh the browser and expand the “constructor” drop-down\
    \ to see the scopes\n\n![image](images/pg25_1.jpg)\n"
