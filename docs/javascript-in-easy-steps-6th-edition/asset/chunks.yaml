    **Meet JSON**


    ![image](images/pg156_1.jpg)


    JavaScript Object Notation (“JSON”) is a popular text format that is used to store
    and exchange data. It is a subset of the JavaScript language in which data is
    stored as a comma-separated list of key:value pairs within a JSON object. All
    keys must be of the String data type, enclosed in double quote marks, and their
    associated values may only be one of these data types:


    •**String** – enclosed within double quotes, not single quotes.


    •**Number** – either integer or floating point.


    •**Object** – a JSON object.


    •**Array** – but not a Function or a Date.


    •**Boolean** – either true or false.


    •**null** – but not undefined.


    JSON key:value pairs are enclosed in curly brackets, like this:


    **{“name”:”Alice”,”age”:21,”city”:”New York”}**


    You can easily convert a JavaScript object to a JSON object by specifying it as
    the argument to a JSON.stringify( ) method.


    Conversely, you can convert a JSON object to a JavaScript object by specifying
    it as the argument to a JSON.parse( ) method.


    Typically, JSON objects store data in a text file with a .json file extension
    as an online resource. A web page script may, therefore, receive data in JSON
    format from a web server.


    After converting a JSON object to a JavaScript object, with the JSON.parse( )
    method, the data can be addressed as usual with dot notation, or with bracket
    notation.


    Both JSON and XML (eXtensible Markup Language) can be used to receive data from
    a web server, but JSON is considered better because you need to loop through the
    elements to extract data from the XML format, whereas the JSON.parse( ) method
    simply returns a string of all the data.


    Usefully, JavaScript can fetch data from online JSON resources for use in web
    applications.


