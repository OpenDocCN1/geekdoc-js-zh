    ![image](images/3r.jpg)Next, create the event-handler function that begins by
    getting references to the images and list elements


    **function dragNdrop( ) {**


    **const bin = document.getElementById( ‘bin’ )**


    **const folders =**


    **document.getElementsByClassName( ‘folder’ )**


    **const list = document.getElementById( ‘list’ )**


    **// Statements to be inserted here.**


    **}**


    ![image](images/4r.jpg)Now, insert statements to attach event-handlers to each
    folder image and cancel the default behavior of the bin


    **let i = 0**


    **for( i = 0 ; i < folders.length ; i++ ) {**


    **folders[ i ].ondragstart = function( event ) {**


    **event.dataTransfer.setData( ‘Text’, this.id ) }**


    **}**


    **bin.ondragover = function( event ) { return false }**


    ![image](images/5r.jpg)Finally, insert statements to get the id and element reference
    of the folder being dropped, then (unless it’s the bin) write its id into the
