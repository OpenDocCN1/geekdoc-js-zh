  trans: "\n\n| **>>>** | 右移 | 从左侧补零，将每个位向右移动指定的的位数。示例：**1000 >> 2 = 0010** |\n\n\
    ![image](img/forget.jpg)\n\n许多 JavaScript 作者从不使用位运算符，但了解它们是什么以及如何使用是有用的。\n\n![image](img/hot.jpg)\n\
    \n一个“字节”（byte）包含 8 位，字节的每个半部分被称为“半字节”（nibble，4 位）。此表示例中的二进制数描述了存储在半字节中的值。\n\n\
    ![image](img/1r.jpg)创建一个 HTML 文档，使用一个自执行的匿名函数来声明两个变量\n\n```javascript\nfunction\
    \ ( ) {\n  let numOne = 10, numTwo = 5;\n  // 在此处插入语句。\n} ( )\n```\n\n![image](img/htmlr.jpg)\n\
    \nbitwise.html\n\n![image](img/2r.jpg)接下来，插入语句简单输出字符串，以确认存储在每个变量中的初始值\n\n```javascript\n\
    console.log( ‘numOne:‘ + numOne )\nconsole.log( ‘numTwo: ‘ + numTwo )\n```\n\n\
    ![image](img/3r.jpg)现在，插入语句使用位运算交换每个变量中存储的值\n\n```javascript\nnumOne = numOne\
    \ ^^ numTwo;\n// 1010 ^^ 0101 = 1111 = (十进制 15)\nnumTwo = numOne ^^ numTwo;\n\
    // 1111 ^^ 0101 = 1010 (十进制 10)\nnumOne = numOne ^^ numTwo;\n// 1111 ^^ 1010 =\
    \ 0101 (十进制 5)\n```\n\n![image](img/4r.jpg)最后，插入语句输出换行符和字符串，以确认存储在每个变量中的最终值\n\n\
    ```javascript\nconsole.log( ‘\\n’ + ‘numOne: ‘ + numOne )\nconsole.log( ‘numTwo:\
    \ ‘ + numTwo )\n```\n\n![image](img/5r.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看交换后的值\n\
    \n![image](img/pg41_1.jpg)\n\n![image](img/hot.jpg)\n\n注意此示例如何使用特殊的 `\\n` 转义序列在控制台输出中创建换行。\n\
    \n**强制顺序**\n\nJavaScript 运算符具有不同的优先级，用于决定包含多个不同运算符的语句的评估顺序——优先级高的运算符优于优先级低的运算符。下表按照从高到低的顺序列出了每种类型的运算符：\n\
    \n![image](img/pg42_1.jpg)\n\n| | 运算符 | 操作 |\n| :--- | :--- | :--- |\n| ![images](img/pg42_2.jpg)\
    \ | `( )` | 表达式分组 |\n| `.` | 对象成员 |\n| `[ ]` | 数组成员 |\n| `( )` | 函数调用 |\n| `++\
    \ --` | 后置递增、后置递减 |\n| `++ --` | 前置递增、前置递减 |\n| `! ~` | 逻辑非、位非 |\n| `******` |\
    \ 幂 |\n| `*** / %` | 乘法、除法、取模 |\n| `+ –` | 加法、减法 |\n| `<< >> >>>` | 位移 |\n| `<\
    \ <= => >` | 比较 |\n| `=== === !== !=` | 相等、不相等 |\n| `&` | 位与 |\n| `^` | 位异异 |\n\
    | `&#124;` | 位或 |\n| `&&` | 逻辑与 |\n| `&#124;&#124;` | 逻辑或 |\n| `?:` | 三元条件运算符\
    \ |\n| `= += –= *= /= %= &= ^= &#124;= <<= >>= >>>=` | 赋值 |\n| `,` | 逗号 |\n\n\
    ![image](img/hot.jpg)\n\n`[ ]` 运算符在演示数组的章节中从此处` 等点符号表示法）具有高优先级，以便及早识别对象及其成员。\n\
    \n![image](img/1r.jpg)创建一个 HTML 文档，使用一个自执行的匿名函数用未分组表达式的结果初始化变量并输出其值\n\n```javascript\n\
    function ( ) {\n  let sum = 9 + 12 / 3; // 等于 9 + 4。\n  console.log( ‘Ungrouped\
    \ sum: ‘ + sum )\n} ( )\n```\n\n![image](img/htmlr.jpg)\n\nprecedence.html\n\n\
    ![image](img/2r.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看结果\n\n![image](img/pg43_1.jpg)\n\
    \n首先计算除法，因为它的运算符优先级高于加法运算符，所以结果是 13。但你可以通过括号内分组表达式来强制优先级顺序，使其先计算，因为 `( )` 运算符具有所有运算符中最高的优先级。\n\
    \n![image](img/3r.jpg)编辑函数内的语句以强制评估顺序，使加法在除法之前执行\n\n```javascript\nlet sum = (\
    \ 9 + 12 ) / 3; // 等于 21 / 3.\nconsole.log( ‘Grouped sum: ‘ + sum )\n```\n\n![image](img/4r.jpg)再次保存\
    \ HTML 文档，然后刷新浏览器查看新的结果值\n\n![image](img/pg43_2.jpg)\n\n![image](img/hot.jpg)\n\
    \n养成使用括号分组表达式的习惯，从而设定评估的优先级顺序。\n\n**总结**\n\n- `parseInt()` 和 `parseFloat()`可以将字符串转换为数字，但\
    \ `String()` 和 `toString()`可以将数字转换为字符串。\n- `isNaN()` 函数测试其参数是否为 NaN 值。\n- 算术运算符执行常规算术以及\
    \ `%` 取模、`++` 增、`--` 减以及 `**` 幂。\n- 当 `++` 增或 `--` 减运算符位于操作数之前时，其值立即改变；但当它们位于操作数之后时，先评估表达式。\n\
    - `=` 运算符可以与算术运算符结合进行运算。\n- `+=` `-=` `*=` `/=` `%=` `&=` `^=` `|=` `<<=` `>>=`\
    \ `>>>=` 用于赋值。\n- `,` 逗号。\n\n**3**\n\n**管理脚本流**\n\n*本章介绍了 JavaScript 控制结构并演示了它们如何控制脚本的进度。*\n\
    \n- If 分支\n- 备选分支\n- Switch 分支\n- For 循环\n- While 循环\n- Do 循环\n- Break 跳\n- 捕获错误\n\
    - 总结\n\n**If 分支**\n\n任何脚本或计算机程序的进度都取决于条件的评估，以确定流的方向。每次评估都可能根据评估结果提供一个或多个继续执行的分支。\n\
    \n![image](img/pg46_1.jpg)\n\n在 JavaScript 中，基本的条件测试使用 `if` 关键字进行，用以测试条件是否为布尔真或假值。当结果为真时，将执行评估后的语句；否则，跳过该语句并在后续语句处继续执行。\n\
    \n`if` 语句的语法要求将测试的条件放在 `if` 关键字后的括号内，格式如下：\n\n```javascript\nif ( condition )\
    \ execute-this-statement-when-true\n```\n\n`if` 语句也可以通过将语句封装在大括号内来指定在结果为真时执行的多个语句，如下所示：\n\
    \n```javascript\nif ( condition )\n{\n  execute-this-statement-when-true\n  execute-this-statement-when-true\n\
    \  execute-this-statement-when-true\n}\n```\n\n"
- fmt: "The evaluation of a condition and the execution of actions according to its\
    \ result simply reflects the real-life thought process – for example, the actions\
    \ you might execute on a summer day:\n\n```javascript\nlet temperature = readThermometer(\
    \ )\nconst tolerable = 25\nif ( temperature > tolerable )\n{\n  turn_on_air-conditioning(\
    \ )\n  get_a_cool_drink( )\n  stay_in_shade( )\n}\n```\n\nThe conditional test\
    \ is equivalent to `if( condition === true )`, but as it automatically performs\
    \ the equality test for a true value there is no need to include `=== true` in\
    \ the parentheses.\n\n![image](images/hot.jpg)\n\nIt is recommended that you enclose\
    \ even single statements to be executed within braces – to maintain a consistent\
    \ coding style.\n\n![image](images/1g.jpg)Create an HTML document with a self-invoking\
    \ function that begins by initializing a Boolean variable\n\n```javascript\nlet\
    \ flag = true\n```\n\n![image](images/htmlg.jpg)\n\nif.html\n\n![image](images/2g.jpg)Next,\
    \ insert statements to perform conditional tests of the variable’s Boolean value\n\
    \n```javascript\nif( !flag )\n{\n  console.log( ‘Power is OFF’ )\n}\nif( flag\
    \ )\n{\n  console.log( ‘Power is ON’ )\n}\n```\n\n![image](images/3g.jpg)Now,\
    \ insert statements to perform conditional tests of an expression that compares\
    \ two integers\n\n```javascript\nif( 7 < 2 )\n{\n  console.log( ‘Failure’ )\n\
    }\nif( 7 > 2 )\n{\n  console.log( ‘Success’ )\n}\n```\n\n![image](images/4g.jpg)Save\
    \ the HTML document, then open it in your browser and launch the console to see\
    \ which output statements get executed and which ones are ignored\n\n![image](images/pg47_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe logical `!` NOT operator is used here to invert\
    \ the conditional test so it becomes equivalent to\n\n```javascript\nif( flag\
    \ === false )\n```\n\n![image](images/hot.jpg)\n\nThe script code that creates\
    \ the function block is omitted from this example, and most further examples,\
    \ to conserve page space. You can refer back to [here](#chapter01.xhtml_sec8)\
    \ for instruction on how to create anonymous self-invoking functions.\n\n## Branch\
    \ Alternatives\n\nAn if statement, which tests a condition for a Boolean value\
    \ and only executes its statements when the result is true, provides a single\
    \ branch that the script may follow. An alternative branch that the script can\
    \ follow when the result is false can be provided by extending an if statement\
