  trans: "\n\n您可以在 [www.w3.org/TR/webstorage](http://www.w3.org/TR/webstorage) 在线了解更多关于\
    \ Web Storage API 的信息。\n\n## 拖拽项目\n\n![image](img/pg180_1.jpg)\n\nDrag-and-Drop\
    \ API 支持用户拖动页面对象并将其释放到目标上。它指定了许多在用户拖动对象时触发的事件，但最重要的的是 `dragstart`、`dragover` 和\
    \ `drop` 事件。需要为这些事件中的每一个编写事件处理器：\n\n• `ondragstart` 事件处理器 – 用于指定在拖拽开始时附加到被拖拽对象上的\
    \ `Text` 数据。\n• `ondragover` 事件处理器 – 用于取消释放目标的默认行为，从而允许将对象释放到其上。\n• `ondrop` 事件处理器\
    \ – 用于定义当对象被释放到释放目标时应该发生什么。\n\n此外，`ondrop` 事件处理器通常应该确保目标本身不会被拖拽到自身：\n\n![image](img/1r.jpg)创建一个\
    \ HTML 文档，其中包含一个带有图片的段落以及 fieldset 中的一个空列表\n\n```html\n<p>\n<img id=\"bin\" src=\"\
    bin.png\" alt=\"Bin\">\n<img class=\"folder\" id=\"Red\" src=\"red.png\" alt=\"\
    Folder\">\n<img class=\"folder\" id=\"Yellow\" src=\"yel.png\" alt=\"Folder\"\
    >\n<img class=\"folder\" id=\"Green\" src=\"grn.png\" alt=\"Folder\">\n</p>\n\
    <fieldset>\n<legend>Folders Dropped:</legend>\n<ol id=\"list\"></ol>\n</fieldset>\n\
    ```\n\n![image](img/pg180_2.jpg)\n\n![image](img/htmlr.jpg)\n\ndragndrop.html\n\
    \n![image](img/2r.jpg)编写一个脚本，在 DOM 完全加载后通过一个语句添加事件监听器\n\n```javascript\ndocument.addEventListener('DOMContentLoaded',\
    \ dragNdrop)\n```\n\n![image](img/3r.jpg)接下来，创建事件处理器函数，该函数首先获取对图片和列表元素的引用\n\n\
    ```javascript\nfunction dragNdrop() {\n    const bin = document.getElementById('bin');\n\
    \    const folders = document.getElementsByClassName('folder');\n    const list\
    \ = document.getElementById('list');\n    // Statements to be inserted here.\n\
    }\n```\n\n![image](img/4r.jpg)现在，插入语句为每个文件夹图片附加事件处理器，并取消 bin 的默认行为\n\n```javascript\n\
    let i = 0;\nfor(i = 0; i < folders.length; i++) {\n    folders[i].ondragstart\
    \ = function(event) {\n        event.dataTransfer.setData('Text', this.id)\n \
    \   }\n}\nbin.ondragover = function(event) { return false }\n```\n\n![image](img/5r.jpg)最后，插入语句来获取被拖拽文件夹的\
    \ id 和元素引用，然后（除非是 bin）将其 id 写入列表并删除该文件夹图片\n\n```javascript\nbin.ondrop = function(event)\
    \ {\n    const did = event.dataTransfer.getData('Text');\n    const tag = document.getElementById(did);\n\
    \    if (did === 'bin') { return false }\n    else { list.innerHTML += '<li>'\
    \ + did }\n    tag.parentNode.removeChild(tag)\n}\n```\n\n![image](img/6r.jpg)保存\
    \ HTML 文档，然后在浏览器中打开它，神奇地将文件夹拖入垃圾桶中\n\n![image](img/pg181_1.jpg)\n\n![image](img/pg181_2.jpg)\n\
    \n![image](img/hot.jpg)\n\n注意 `dragstart` 事件的 `dataTransfer.setData()` 方法的参数指定了数据格式和实际数据——在这种情况下是“Text”格式和被拖拽元素的\
    \ `id`。\n\n![image](img/common3.jpg)\n\n您可以在 [dev.w3.org/html5/spec/dnd.html](http://dev.w3.org/html5/spec/dnd.html)\
    \ 在线了解更多关于 Drag-and-Drop API 的信息。\n\n## 传递消息\n\nMessaging API 支持在文档之间发送纯文本消息。要向另一个文档发送消息，发送者可以在目标窗口引用（例如\
    \ `iframe` 元素）调用 `postMessage()`。接收者监听 `message` 事件并处理来自 `event` 对象的数据。出于安全考虑，接收者应该始终使用\
    \ `event.origin` 验证发送者的来源。\n\n```javascript\n// 发送端\nconst cage = document.getElementById('cage').contentWindow;\n\
    cage.postMessage('Hello from sender', 'http://localhost');\n```\n\n```javascript\n\
    // 接收端\nwindow.addEventListener('message', function(event) {\n    if (event.origin\
    \ === 'http://localhost') {\n        document.getElementById('msg').innerText\
    \ = event.data;\n    }\n});\n```\n\n## 定位用户\n\n强大的 Geolocation API 支持精确定用户的地理位置。它首先请求用户同意共享位置详情——例如，将附近的无线访问点和计算机的\
    \ IP 地址信息发送给 Google 位置服务。该服务返回用户估计的纬经度坐标。成功获取的坐标可以显示在页面上，并提供给 Google Maps 服务以获取该位置的地图。\n\
    \n在 body 部分创建一个包含两个固定大小段落的 HTML 文档：\n\n```html\n<p id=\"msg\" style=\"width:450px;height:50px;\"\
    ></p>\n```\n"
- fmt: "\n<p id=\"map\" style=\"width:450px;height:200px\"></p>\n\n![image](images/htmlr.jpg)\n\
    \ngeolocation.html\n\nNext, add an element in the document’s head section to grab\
    \ the Google Maps API\n\n```html\n<script src=\"https://maps.googleapis.com/maps/api/js?key=API_KEY\"\
    ></script>\n```\n\n![image](images/3r.jpg)\n\nNow, begin a script at the end of\
    \ the document’s body section with a function that attempts to seek the user location\
    \ when the HTML document has loaded\n\n```javascript\nfunction init( ) {\n  if\
    \ ( navigator.geolocation ) {\n    document.getElementById( ‘msg’ ).innerText\
    \ = ‘Geolocation service is trying to find you...’\n    navigator.geolocation.getCurrentPosition(\
    \ success , fail )\n  } else {\n    document.getElementById( ‘msg’ ).innerText\
    \ = ‘Your browser does not support Geolocation service’\n  }\n}\ndocument.addEventListener(\
    \ ‘DOMContentLoaded’, init )\n```\n\n![image](images/4r.jpg)\n\nThen, add a function\
    \ to display a message if the attempt fails\n\n```javascript\nfunction fail( position\
    \ ) {\n  document.getElementById( ‘msg’ ).innerText = ‘Geolocation service cannot\
    \ find you at this time’\n}\n```\n\n![image](images/forget.jpg)\n\nIn this example,\
    \ the `navigator.geolocation` object provides the `getCurrentPosition()` method\
    \ that must specify functions to handle success and failure. These functions must\
    \ each accept a returned `position` object argument, as that contains the coordinates,\
    \ or error details.\n\n![image](images/5r.jpg)\n\nFinally, add a success function\
    \ to display the retrieved coordinates and a map when the attempt succeeds\n\n\
    ```javascript\nfunction success( position ) {\n  const lat = position.coords.latitude\n\
    \  const lng = position.coords.longitude\n  document.getElementById( ‘msg’ ).innerHTML\
    \ = ‘Found you at...<br>Latitude: ‘ + lat + ‘ , Longitude: ‘ + lng\n  const latlng\
    \ = new google.maps.LatLng( lat , lng )\n  const options = { zoom: 18 , center\
    \ : latlng , mapTypeId: google.maps.MapTypeId.ROADMAP }\n  const map = new google.maps.Map(\
    \ document.getElementById( ‘map’ ) , options )\n  const marker = new google.maps.Marker(\
    \ { position: latlng , map: map , title: ‘You are here’ } )\n}\n```\n\n![image](images/6r.jpg)\n\
    \nSave the HTML document in the “htdocs” folder of a local web server, then open\
    \ the web page and allow your location to be known – to get magically pinpointed\n\
    \n![image](images/pg185_1.jpg)\n\n![image](images/pg185_2.jpg)\n\n![image](images/hot.jpg)\n\
    \nTo replicate this example you will first need to sign into the Google Cloud\
    \ Platform online at [cloud.google.com](http://cloud.google.com) and create a\
    \ new project. Then, enable the Maps JavaScript API for your project and get an\
    \ API key. Replace `API_KEY` in Step 2 with your own key to run the example.\n\
    \n![image](images/common3.jpg)\n\nDiscover more about the Geolocation API online\
    \ at [dev.w3.org/geo/api](http://dev.w3.org/geo/api).\n\n## Summary\n\n- AJAX\
    \ allows web pages to be updated by requesting data from a web server without\
    \ interrupting other operations.\n- A successful `XMLHttpRequest` stores text\
    \ in its `responseText` property and XML data in its `responseXML` property.\n\
    - SVG graphics embedded in an HTML document maintain an SVG DOM node tree of all\
    \ their elements and attributes.\n- The `getSVGDocument()` method creates a reference\
    \ object of elements, attributes, and text in an SVG document.\n- The Canavas2D\
    \ API provides methods and properties that can paint shapes and text onto a canvas\
    \ area.\n- The `getContext()` method creates a reference object of a canvas area.\n\
    - The Web Storage API provides a long term `localStorage` object and a `sessionStorage`\
    \ object for temporary storage.\n- Items can be stored in `localStorage` or `sessionStorage`\
    \ using the `setItem()` method to specify a key and the data.\n- The Drag-and-Drop\
    \ API allows the user to drag page objects and drop them onto a target.\n- Event-handlers\
    \ need to be scripted for `dragstart`, `dragover`, and `drop` events to create\
    \ a drag and drop interface.\n- The Messaging API allows plain text messages to\
    \ be securely sent between documents – even those on different domains.\n- To\
    \ receive a message, the receiving document must correctly identify the domain\
    \ hosting the sending document.\n- The Geolocation API provides the ability to\
    \ pinpoint the user’s location if they consent to share location details.\n- Google\
    \ Location Services returns the user’s estimated latitude and longitude coordinates.\n\
    - Location coordinates can be displayed on the page and supplied to Google Maps\
    \ to acquire a map at that location.\n\n![image](images/bm1.jpg)\n\n[![image](images/ibc1.jpg)](https://iescourses.com/)\n\
    \n![image](images/bm2.jpg)\n\n![image](images/bcover.jpg)\n"
