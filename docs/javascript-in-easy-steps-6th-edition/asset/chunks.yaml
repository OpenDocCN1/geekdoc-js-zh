    # 分割字符串


    有几种字符串方法允许从完整字符串中复制指定的某个部分。这些方法将每个字符串视为数组，其中每个元素包含一个字符或一个空格，可以通过它们的索引位置引用。与数组一样，字符串索引是从零开始的，因此第一个字符位于位置零。


    ![image](img/pg100_1.jpg)


    通过将其索引位置作为字符串的 `substring()` 方法的参数，可以指定开始复制“子字符串”的起点。这将复制该位置之后直到字符串末尾的所有字符。可选，可以为字符串的
    `substring()` 方法提供第二个参数，以指定随后的索引位置作为子字符串的结束。这将复制起始和结束位置之间的所有字符。


    字符串 `substr()` 方法提供了另一种复制子字符串的方法。与 `substring()` 方法类似，它可以接受一个参数来指定开始复制的索引位置，并将复制该位置之后直到字符串末尾的所有字符。与
    `substring()` 方法不同，`substr()` 方法可以可选地提供第二个参数，以指定起始位置后要复制的字符数。


    同样，可以使用字符串 `slice()` 方法来返回起始位置（由单个参数指定）之后的所有字符，或返回两个位置（由两个参数指定）之间的所有字符。


    有时复制由特定字符分隔的字符串部分是非常有用的。可以将分隔符指定为字符串 `split()` 方法的参数，该方法将返回该字符出现处之间所有子字符串的数组。可选，`split()`
    方法可以提供第二个参数来指定它应该返回的数组大小。在这种情况下，将返回指定分隔符之间的每个子字符串，直到达到限制为止，字符串的其余部分将被忽略。


    这些字符串方法都不会修改原始字符串，只是创建了原始字符串某个部分的副本。


    ![image](img/hot.jpg)


    `substr()` 方法一向比 `substring()` 方法更容易使用——因为你只需要计算起始位置和子字符串的长度，而不需要结束位置。


    ![image](img/hot.jpg)


    `split()` 方法用于在示例此处 中分离 cookie 数据。


    ![image](img/1o.jpg)


    创建一个 HTML 文档，包含一个自执行函数，并开始初始化一个变量


    ```javascript

    let definition = ‘JavaScript is the original dialect of \ the ECMAScript standard
    language.’

