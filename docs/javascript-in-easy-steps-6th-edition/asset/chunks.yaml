    launch the console to see the arithmetic results


    ![image](images/pg31_1.jpg)


    **Assign Values**


    The operators that are commonly used in JavaScript to assign values are all listed
    in the table below. All except the simple = assignment operator are shorthand
    forms of longer expressions, so each equivalent is also given for clarity.


    ![image](images/pg32_1.jpg)


    | **Operator** | **Example** | **Equivalent** |


    | **=** | **a = b** | **a = b** |


    | **+=** | **a += b** | **a = ( a + b )** |


    | **–=** | **a –= b** | **a = ( a – b )** |


    | ***=** | **a *= b** | **a = ( a * b )** |


    | **/=** | **a /= b** | **a = ( a / b )** |


    | **%=** | **a %= b** | **a = ( a % b )** |


    | ****=** | **a **= b** | **a = ( a ** b )** |


    It is important to think of the = operator as meaning “assign” rather than “equals”
    to avoid confusion with the JavaScript === equality operator.


    In the = example in the table, the variable a gets assigned the value contained
    in variable b to become its new stored value.


    The combined += operator is most useful and can be employed to append a string
    onto an existing string. For example, with a variable string let str = ‘JavaScript’
    and str += ‘ Fun’ the variable now stores the combined string ‘JavaScript Fun’.


    Numerically speaking, the += example in the table will add the value contained
    in variable a to that contained in variable b then assign the sum total to become
    the new value stored in variable a.


    All other combined assignment operators work in a similar way to the += operator.
    They each perform the arithmetical operation on their two operands first, then
    assign the result of that operation to the first variable – so that becomes its
    new stored value.


    ![image](images/hot.jpg)


    The **===** equality operator compares values and is fully explained [here](#chapter02.xhtml_sec15).


