    \  function ( event ) { reactTo( event,‘Blue’ } ) )\nbtn.addEventListener( ‘click’,\n\
    \  function ( event ) { reactTo( event,‘Orange’ } ) )\n```\n\n![image](img/4v.jpg)最后，添加第二个函数来显示事件类型并更改第一个段落的背景颜色\n\
    \n```javascript\nfunction reactTo( event, color ) {\n```\n\n"
- fmt: "\n```javascript\ndocument.getElementById( ‘box’ ).style.background = color\n\
    document.getElementById( ‘info’ ).innerText = event.type\n}\n```\n\n![image](images/5v.jpg)Save\
    \ the HTML document and open it in your browser, then use your mouse to see the\
    \ events and reactions\n\n![image](images/pg143_1.jpg)\n\n![image](images/pg143_2.jpg)\n\
    \n![image](images/pg143_3.jpg)\n\n![image](images/pg143_4.jpg)\n\n![image](images/pg143_5.jpg)\n\
    \n![image](images/snake.jpg)\n\nIf removing an object that has event-handlers\
    \ attached, you should also remove its event-handlers to avoid creating memory\
    \ leaks.\n\n## Event Values\n\nIn addition to the mouse events described [here](#chapter07.xhtml_sec69),\
    \ there is a `“mousemove”` event. This can pass an event object to an event-handler\
    \ function with `x` and `y` properties that contain the current window coordinates\
    \ of the mouse pointer.\n\n![image](images/pg144_1.jpg)\n\nThere is also a `“keydown”`\
    \ event that fires when the user first presses a key, a `“keypress”` event that\
    \ fires when the key is pressed down, and a `“keyup”` event that fires when the\
    \ key is released. These can each pass an event object to an event-handler function\
    \ with a `type` property that identifies the name of that event, and a `keyCode`\
    \ property that stores the numerical value of the last key pressed.\n\nThe numerical\
    \ value of a key is its Unicode value, which can be specified as the argument\
    \ to a `String.fromCharCode( )` method to translate it to a character value.\n\
    \nEvent-handler functions can be nominated to `onmousemove`, `onkeydown`, `onkeypress`,\
    \ and `onkeyup` properties, or be specified as arguments to an object’s `addEventListener(\
    \ )` method.\n\n![image](images/1v.jpg)Create an HTML document that contains an\
    \ empty paragraph\n\n```html\n<p id=”info”></p>\n```\n\n![image](images/htmlv.jpg)values.html\n\
    \n![image](images/2v.jpg)Next, in a script element, create a self-invoking function\
    \ that nominates an event-handler function for three events and passes an event\
    \ argument to that function\n\n```javascript\nfunction ( ) {\n  document.addEventListener(\
    \ ‘keydown’,\n  function ( event ){ reactTo( event ) } )\n  document.addEventListener(\
    \ ‘keyup’,\n  function ( event ){ reactTo( event ) } )\n  document.addEventListener(\
    \ ‘mousemove’,\n  function ( event ){ reactTo( event ) } )\n} ) ( )\n```\n\n![image](images/3v.jpg)Now,\
    \ begin the event-handler function with a statement to initialize a variable\n\
    \n```javascript\nfunction reactTo( event ) {\n  const info = document.getElementById(\
    \ ‘info’ )\n  // Statements to be inserted here.\n}\n```\n\n![image](images/hot.jpg)Unicode\
    \ values for common characters are the same as ASCII code values, where lowercase\
    \ a-z is 65-90 and A-Z is 97-122.\n\n![image](images/4v.jpg)Then, insert statements\
    \ to display the current window coordinate values of the mouse pointer\n\n```javascript\n\
    if( event.type === ‘mousemove’ )\n{\n  info.innerHTML =\n  ‘Mouse pointer is at\
    \ X:’ + event.x + ‘ Y:’ + event.y\n}\n```\n\n![image](images/5v.jpg)Next, add\
    \ statements to display the Unicode value of a keyboard key when pressed\n\n```javascript\n\
    if( event.type === ‘keydown’ )\n{\n  info.innerHTML += ‘<hr>’ + event.type\n \
    \ info.innerHTML += ‘: ‘ + event.keyCode\n}\n```\n\n![image](images/6v.jpg)Finally,\
    \ add statements to display the character of that keyboard key when released\n\
    \n```javascript\nif( event.type === ‘keyup’ )\n{\n  info.innerHTML += ‘<br>’ +\
    \ event.type + ‘: ‘ +\n  String.fromCharCode(** event****.keyCode ) + ‘<hr>’\n\
    }\n```\n\n![image](images/7v.jpg)Save the HTML document then open it in your browser\
    \ and move the mouse pointer over the window to see its displayed coordinate values\
    \ change as the mouse moves\n\n![image](images/pg145_1.jpg)\n\n![image](images/8v.jpg)Press\
    \ any alphanumeric keyboard key to see that key’s Unicode number and character\
    \ value\n\n![image](images/snake.jpg)\n\nThe `keydown` and `keyup` events work\
    \ on all keyboard keys, but `keypress` only works on the alphanumeric keys.\n\n\
    ![image](images/forget.jpg)\n\nThe coordinate values always relate to the window\
    \ position even if the event-handler is attached to an object other than the `document`\
    \ object.\n\n## Check Boxes\n\nRadio button groups allow the user to select any\
    \ one button from the group, and the HTML name attributes of all radio button\
    \ input elements in that group share the same name. In scripting terms, that group\
    \ name is the name of an array in which each radio button object can be referenced\
    \ using its array index value.\n\n![image](images/pg146_1.jpg)\n\nUnlike radio\
    \ button groups, checkbox button groups allow the user to select one or more buttons\
    \ in that group. But as with radio button groups, each name attribute shares the\
    \ same group name. That group name is also the name of an array in which each\
    \ checkbox button object can be referenced by its array index value.\n\nBoth radio\
    \ button objects and checkbox button objects have a `checked` property, which\
    \ is true when the button is selected and false otherwise. Looping through an\
    \ array to inspect which boxes are selected. A script statement can also assign\
    \ true to the `checked` property.\n\n![image](images/1v.jpg)Create an HTML document\
    \ that contains a form with three checkboxes and a submit button\n\n```html\n\
    <form id=”pizza” action=”echo.pl” method=”POST”>\n  <fieldset>\n    <legend>Select\
    \ Toppings</legend>\n    <input type=”checkbox” name=”Top” value=”Cheese”\n  \
    \  <input type=”checkbox” name=”Top” value=”Ham”\n    <input type=”checkbox” name=”Top”\
    \ value=”Peppers”\n  </fieldset>\n  <input type=”submit”>\n</form>\n```\n\n![image](images/htmlv.jpg)checkbox.html\n\
    \n![image](images/2v.jpg)Next, in a script element, create a self-invoking function\
    \ that nominates an event-handler function for the form’s “submit” event and checks\
    \ one checkbox\n\n```javascript\nfunction ( ) {\n  const form = document.getElementById(\
    \ ‘pizza’ )\n  form.addEventListener( ‘submit’,\n  function ( event ){ reactTo(\
    \ event ) } )\n  form.Top[ 0 ].checked = true\n} ) ( )\n```\n\n![image](images/3v.jpg)When\
    \ multiple buttons in a checkbox group have been selected, their values are submitted\
    \ as a comma-separated list.\n\n![image](images/hot.jpg)Now, begin the event-handler\
    \ function by declaring three variables and a loop to determine which boxes are\
    \ checked\n\n```javascript\nfunction reactTo( form, event ) {\n  let i, ok, summary\
    \ = ‘’\n  for( i = 0 ; i < form.Top.length ; i++ )\n  {\n    if( form.Top[ i ].checked\
    \ )\n    {\n      summary += form.Top[ i ].value + ‘ ‘\n    }\n  }\n  // Statements\
    \ to be inserted here.\n}\n```\n\nThen, add statements to confirm the choices\
    \ and submit them to the web server, or cancel the submission\n\n```javascript\n\
    ok = confirm( ‘Submit These Choices?\\n’ + summary )\nif( !ok ) { event.preventDefault(\
    \ ) }\n```\n\n![image](images/4v.jpg)Save the HTML document on a webserver then\
    \ open it in a browser, make your choices, then confirm submission\n\n![image](images/5v.jpg)\n\
    \n![image](images/6v.jpg)\n\n![image](images/7v.jpg)\n\n![image](images/pg145_1.jpg)\n\
    \n![image](images/8v.jpg)\n\n![image](images/snake.jpg)\n\nWhen a form button\
    \ gets clicked it triggers the form’s default **event** action, which is to submit\
    \ the form data to the web server. Calling the form event’s `preventDefault( )`\
