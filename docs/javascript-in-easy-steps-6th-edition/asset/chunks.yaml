    ### Store Values


    ![image](images/box.jpg)


    A “variable” is a container, common to every scripting language, in which data
    can be stored and retrieved. Unlike “strongly typed” variables in most languages,
    which must declare a particular type they contain, JavaScript variables are much
    easier to use because they are “loosely typed” – so they may contain any type
    of data:


    | Data Type | Example | Description |

    | :--- | :--- | :--- |

    | String | `‘Hello World!’` | A string of characters |

    | Number | `3.142` | An integer or floating-point number |

    | Boolean | `true` | A true (1) or false (0) value |

    | Object | `console` | A user-defined or built-in object |

    | Function | `log()` | A user-defined function, built-in function, or object method
    |

    | Symbol | `Symbol()` | A unique property identifier |

    | null | `null` | Absolutely nothing |

    | undefined | `undefined` | A non-configured property |


    JavaScript variable can be declared using the `let`, `const`, or `var` keywords
    followed by a space and a name of your choosing. A `let` declaration of a variable
    may simply create a variable to which a value can be assigned, or may include
    an assignation to “initialize” the variable with a value:


    ```javascript

    let myNumber // Declare a variable.

    myNumber = 10 // Initialize a variable.

    let myString = ‘Hello World!’ // Declare and initialize a variable.

    ```


    Multiple variables may be declared on a single line too:


    ```javascript

    let i, j, k // Declare 3 variables.

    let num = 10, char = ‘C’ // Declare and initialize 2 variables.

    ```


    Variables declared with `let` can be reassigned new values as the script proceeds,
    whereas `const` (constant) does not. The `var` keyword was used in JavaScript
    before the `let` keyword was introduced but is best now as it does not prevent
    you declaring the same variable twice.


    Constant variables must, however, be initialized when declared:


    ```javascript

    const myName = ‘Mike’

    ```


    ![image](images/forget.jpg)


    A variable name is an alias for the value it contains – using the name in script
    references its stored value.

