- fmt: "\nThe JavaScript `break` keyword can be used to exit from a loop when a specified\
    \ condition is encountered. The conditional test should appear before all other\
    \ statements to be executed so the loop will end immediately.\n\n![image](images/pg58_1.jpg)\n\
    \nWhere a `break` statement is used in a loop that is nested within an outer loop,\
    \ flow resumes in the outer loop iteration.\n\nThe JavaScript `continue` keyword\
    \ can be used to skip a single iteration of a loop when a specified condition\
    \ is encountered.\n\nWhere a `continue` statement is used in a loop that is nested\
    \ within an outer loop, flow resumes at the next iteration of the inner loop.\n\
    \n![image](images/1g.jpg)Create an HTML document with a self-invoking function\
    \ that begins by initializing two loop counter variables\n\n`let i = 0`\n\n`let\
    \ j = 0`\n\n![image](images/htmlg.jpg)\n\nbreak.html\n\n![image](images/2g.jpg)Next,\
    \ insert a for loop containing an inner nested for loop\n\n```javascript\nfor\
    \ ( i = 1 ; i < 3 ; i++ )\n{\n    console.log( ‘Outer Loop: ‘ + i )\n    for (\
    \ j = 1 ; j < 4 ; j++ )\n    {\n        // Statements to be inserted here.\n \
    \       console.log( ‘\\tInner Loop: ‘ + j )\n    }\n}\n```\n\n![image](images/hot.jpg)\n\
    \nThe `\\t` escape sequence is used here to include a tab space in the output.\n\
    \n![image](images/3g.jpg)Save the HTML document, then open it in your browser\
    \ and launch the console to see two iterations of the outer loop and three iterations\
    \ of the inner loop\n\n![image](images/pg59_1.jpg)\n\n![image](images/4g.jpg)Next,\
    \ insert statements in the inner loop to skip an iteration of the inner loop and\
    \ break out of the outer loop\n\n```javascript\nif( ( i === 1 ) && ( j === 2 )\
    \ ) {\n    console.log( ‘\\tSkipped: ‘ + j )\n    continue\n}\n\nif( ( i === 2\
    \ ) && ( j === 2 ) ) {\n    console.log( ‘\\tBroken: ‘ + j )\n    break\n}\n```\n\
    \n![image](images/5g.jpg)Save the HTML document again, then open it in your browser\
    \ and launch the console to see an iteration skipped and the loop broken completely\n\
    \n![image](images/pg59_2.jpg)\n\n![image](images/forget.jpg)\n\nThe `break` keyword\
    \ is also used as a terminator in switch statements.\n\n![image](images/snake.jpg)\n\
    \nDon’t be tempted to use `break` statements to exit loops in place of the regular\
    \ conditional tests that form part of the loop structure.\n\n## Catch Errors\n\
    \nSections of script in which it is possible to anticipate errors, such as those\
    \ handling user input, may be enclosed in a `try catch` structure to handle “exception”\
    \ errors. The statements to be executed are contained within the braces of a `try`\
    \ block, and exceptions are passed as an argument to the ensuing `catch` block\
    \ for handling. Optionally, this may be followed by a `finally` block, containing\
    \ statements to execute after exceptions have been handled.\n\n![image](images/pg60_1.jpg)\n\
    \nJavaScript recognizes error objects of `Error`, `EvalError`, `InternalError`,\
    \ `RangeError`, `ReferenceError`, `SyntaxError`, `TypeError`, and `URIError`.\
    \ These may be automatically created and passed to the `catch` block by the parser\
    \ or manually created with the `new` keyword and a constructor method, then passed\
