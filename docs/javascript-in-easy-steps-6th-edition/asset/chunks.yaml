    <button id=”btn”>Click Me</button>\n```\n\n![image](img/htmlv.jpg)\n\nmouse.html\n\
    \n![image](img/2v.jpg)接下来，在 script 元素中创建一个自执行函数，首先初始化两个变量\n\n```javascript\n(\
    \ function ( ) {\n  const box = document.getElementById( ‘box’ )\n  const btn\
    \ = document.getElementById( ‘btn’ )\n  // 在此处插入语句\n} ) ( )\n```\n\n![image](img/hot.jpg)\n\
    \nHTML 文档中的任何可见对象都可以为其 **click** 事件分配事件处理器，以便该对象可以像按钮一样工作。大多数开发者倾向于使用 `addEventListener(\
    \ )` 方法指定事件处理器函数，而不是赋值给 `onclick` 属性。\n\n![image](img/3v.jpg)现在，插入语句来指定内联事件处理器，这些处理器将向第二个函数传递参数\n\
