    assignment.html


    ![image](images/2r.jpg)Next, insert statements that use combined operators to
    perform arithmetic and assign results for output


    **let sum = 5.00 ; sum += 2.50**


    **console.log( ‘Add & assign decimal: ‘ + sum )**


    **sum = 8 ; sum -= 4**


    **console.log( ‘Subtract & assign integer: ‘ + sum )**


    **sum = 8 ; sum *= 4**


    **console.log( ‘Multiply & assign integer: ‘ + sum )**


    **sum = 8 ; sum /= 4**


    **console.log( ‘Divide & assign integer: ‘ + sum )**


    **sum = 8 ; sum %= 4**


    **console.log( ‘Modulus & assign integer: ‘ + sum )**


    ![image](images/3r.jpg)Save the HTML document, then open it in your browser and
    launch the console to see the assigned values


    ![image](images/pg33_1.jpg)


    **Make Comparisons**


    The operators that are commonly used in JavaScript to compare two values are all
    listed in the table below:


    ![image](images/pg34_1.jpg)


    | **Operator** | **Comparison** |


    | **===** | Equality |


    | **!==** | Inequality |


    | **>** | Greater than |


    | **<** | Less than |


    | **>=** | Greater than or equal to |


    | **<=** | Less than or equal to |


    The === equality operator compares two operands and will return a Boolean true
    value if they are exactly equal, otherwise it will return a Boolean false value.
    If the operands are identical numbers they are equal; if the operands are strings
    containing the same characters in the same positions they are equal; if the operands
    are Boolean values that are both true, or both false, they are equal. Conversely,
    the !== inequality operator returns true if the two operands are not equal, using
    the same rules as the === equality operator.


    Equality and inequality operators are useful in comparing two values to perform
    “conditional branching”, where the script will follow a particular direction according
    to the result.


    The > greater than operator compares two operands and returns true if the first
    is greater in value than the second. The < less than operator makes the same comparison
    but returns true when the first is less in value than the second. Adding the =
    character after the > greater than operator or the < less than operator makes
    them also return true when the two operands are equal.


    The > greater than and < less than operators are frequently used to test the value
    of a counter variable in a loop structure.


    ![image](images/hot.jpg)


    An example using the < less than operator in a loop structure can be found [here](#chapter03.xhtml_step2).


    ![image](images/snake.jpg)


    There is also a **==** equality operator and a **!=** inequality operator, but
    these may produce unexpected results as, unlike **===** and **!==**, they do not
    ensure the values being compared are of the same data type. This means that **25
    == ‘25’** returns **true**, whereas **25 === ‘25’** returns **false**. Always
    use the three-character versions so your scripts will make accurate comparisons.


