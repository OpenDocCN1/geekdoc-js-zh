    You can reference the object property values in two ways – using dot notation
    syntax of `objectName.propertyName` or using the syntax of `objectName[''propertyName'']`.


    The object methods can be called using dot notation syntax of `objectName.methodName()`.


    The `this` keyword can be used in object method definitions to refer to the object
    that “owns” the method. In the example above, this refers to the car object, so
    `this.model` references the `car.model` property and `this.make` references the
    `car.make` property.


    ![image](images/hot.jpg)


    Whitespace is ignored in the object’s list of name:value pairs, but don’t forget
    to put a comma between the pairs.


    ![image](images/1p.jpg)


    Create an HTML document with a self-invoking function that begins by declaring
    a variable to contain an object definition


    ```javascript

    let car = {

    // Statements to be inserted here.

    }

    ```


