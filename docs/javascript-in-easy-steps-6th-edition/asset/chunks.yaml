    The location shown here is that of the page located on a web server on the local
    system. If the page was located on your desktop, the protocol would be **file:**
    and there would be no **host** value.


    **Travel History**


    The web browser stores a history of the URLs visited in the current session as
    an array within the window object’s history child object. Like other arrays, this
    has a length property, but also back( ) and forward( ) methods to move between
    elements. Alternatively, the history object’s go( ) method accepts a positive
    or negative integer argument specifying how many elements to move along the array.
    For example, history.go( 1 ) moves forward one element, and history.go( -2 ) moves
    back two elements.


    ![image](images/pg126_1.jpg)


    ![image](images/1bl.jpg)Create three identical HTML documents that contain an
    empty paragraph and embed the same external script file


    **<p id=”info” > </p>**


    **<script src=”history.js” > </script>**


    ![image](images/htmlbl.jpg)


    page-1.html


    page-2.html


    page-3.html


    ![image](images/2bl.jpg)Next, create the script file with a self-invoking function
    that begins by initializing a variable reference


    **const info = document.getElementById( ‘info’ )**


    ![image](images/pg126_2.jpg)


    history.js


    ![image](images/3bl.jpg)Now, in the function block, add statements to write content
    into the empty paragraphs


    **info.innerHTML +=**


    **‘<a href=”page-1.xhtml”>Page 1</a> | ‘**


    **info.innerHTML +=**


    **‘<a href=”page-2.xhtml”>Page 2</a> | ‘**


    **info.innerHTML +=**


    **‘<a href=”page-3.xhtml”>Page 3</a>’**


    **info.innerHTML +=**


    **‘<br>History Length: ‘ + history.length**


    **info.innerHTML +=**


    **‘<br>Current Location: ‘ + location.pathname + ‘<br>’**


    ![image](images/4bl.jpg)Then, add statements to create buttons in the paragraphs


    **info.innerHTML +=**


    **‘<button onclick=”history.back( )”>Back</button>’**


    **info.innerHTML +=**


    **‘<button onclick=”history.forward( )”>Forward</button>’**


    ![image](images/5bl.jpg)Save the HTML document and JavaScript script file in the
    same folder, then clear your browser’s history


    ![image](images/hot.jpg)


    To clear the browser history in the Google Chrome browser, click the ![image](images/pg126_i.jpg)
    button, then select **More tools**, **Clear browsing data**, and click the **Clear
    data** button.


    ![image](images/6bl.jpg)Open the first page to see the initial history length
    is 1


    ![image](images/pg127_1.jpg)


    ![image](images/7bl.jpg)Click a link to load the third page and see the history
    length increase to 2


    ![image](images/pg127_2.jpg)


    ![image](images/8bl.jpg)Click the Back button to return to the first page but
    see the history length remain the same as 2


    ![image](images/pg127_3.jpg)


    ![image](images/hot.jpg)


    The URLs are stored in the **history** object array elements in a protected manner
    so they cannot be retrieved as strings.


    ![image](images/forget.jpg)


    In this example, each URL only gets added to the **history** array when moving
    to a different page by clicking on a link. The **back( )**, **forward( )**, and
    **go( )** methods simply select an element in the **history** array so do not
    change its **length** property.


    **Summary**


    •The Document Object Model (DOM) is a hierarchical tree representation of all
    components of a web page.


    •The window object is the top level in the DOM hierarchy and has properties describing
    the browser window.


    •The screen object is a child of the window object and has properties describing
    the screen dimensions and color depth.


    •The window object has scrollBy( ) and scrollTo( ) methods and scrollX and scrollY
    properties that specify the scroll position.


    •Dialog messages can be displayed using the window object’s alert( ), confirm(
    ), and prompt( ) methods.


    •A pop-up window can be created using the window object’s open( ) method, but
    may be obstructed by a pop-up blocker.


    •The window object’s setTimeout( ) method creates a timer, which can be canceled
    later using the clearTimeout( ) method.


    •The navigator object is a child of the window object and has properties describing
    the browser and host platform versions.


    •The window object exists in the global namespace so all its child objects need
    not include the window part of the address.


    •Feature detection is used to identify the modern DOM.


    •The navigator.plugins and navigator.mimeTypes properties are arrays that contain
    details of supported features.


    •The location object is a child of the window object and has properties describing
    the address of the loaded document.


    •The history object is a child of the window object that contains an array of
    visited locations in the current session.


    •The history object has back( ), forward( ), and go( ) methods that are used to
    move through pages in the current session.


    **7**


    **Interact with the Document**


    *This chapter demonstrates how to use properties and methods of the document object
    in the Document Object Model (DOM).*


