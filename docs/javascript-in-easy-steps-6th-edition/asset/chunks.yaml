  trans: "\n\n还有一个 `scrollTo()` 方法，它接受两个参数，用于指定 X 和 Y 坐标，当内容在水平或垂直方向溢出窗口时，窗口左上角应滚动到的这些坐标。这可以用于偏离默认的\
    \ `X=0`, `Y=0` 坐标，到指定的替代位置。例如，当浏览器以表格电子表格格式显示数据，且第一行的第一个单元格位于浏览器窗口的左上角时，`scrollTo()`\
    \ 方法可以将特定的单元格放在浏览器窗口的左上角。\n\nDOM 窗口对象有一个 `scrollX` 属性，存储窗口水平滚动的像素数。这表示“滑块”（滚动框）在窗口底部滚动条上的位置，相对于其左角的距离。`window.scrollX`\
    \ 属性是旧属性 `window.pageXOffset` 的别名，该属性在 DOM 中仍然存在，并且为了向后兼容可以代替 `window.scrollX`\
    \ 使用。\n\n同样，还有一个 `scrollY` 属性，它存储窗口垂直滚动的像素数。这表示滑块在窗口右侧滚动条上的位置，相对于其顶角的距离。`window.scrollY`\
    \ 属性是旧属性 `window.pageYOffset` 的别名，该属性在 DOM 中仍然存在，并且为了向后兼容可以代替 `window.scrollY`\
    \ 使用。\n\n![image](img/hot.jpg)\n\n为 `scrollBy()` 方法提供负值可以向上和向左移动。\n\n![image](img/snake.jpg)\n\
    \n`scrollby()` 方法的效果在内容溢出窗口（导致滚动条出现）时才会明显。\n\n![image](img/1bl.jpg)创建一个 HTML 文档，其中包含一个从左侧缩进的空段落\n\
    \n```html\n<p id=”info\" style=\"width:2000px; margin-left:300px; font:1.2em sans-serif\"\
    ></p>\n```\n\n![image](img/htmlbl.jpg)\n\nscroll.html\n\n![image](img/2bl.jpg)接下来，在\
    \ script 元素中创建一个自执行函数，该函数开始初始化两个变量\n\n```javascript\nconst info = document.getElementById(\
    \ ‘info’ )\nlet i = 0\n```\n\n![image](img/3bl.jpg)现在，添加一个循环向段落中写入一列 40 个数字\n\n\
    ```javascript\nfor( i = 1 ; i < 41 ; i++ )\n{\n    info.innerHTML += ( i + ‘<br>’\
    \ )\n}\n```\n\n![image](img/4bl.jpg)然后，添加一条语句窗口水平向右滚动 200 像素，并垂直向下滚动段落元素的高度\n\n\
    ```javascript\nwindow.scrollBy( 200, info.clientHeight )\n```\n\n![image](img/hot.jpg)\n\
    \n注意这里使用了元素的 `clientHeight` 属性。元素还有一个非常有用的 `clientWidth` 属性。\n\n![image](img/5bl.jpg)最后，添加一条语句来追加当前窗口滑块位置的确认\n\
    \n```javascript\ninfo.innerHTML += ‘scrollX: ‘ + window.scrollX + ‘& scrollY:\
    \ ‘ + window.scrollY\n```\n\n![image](img/6bl.jpg)保存该 HTML 文档，然后在浏览器中打开它以查看窗口滚动和滑块位置\n\
    \n![image](img/pg115_1.jpg)\n\n## 弹出窗口\n\n![image](img/pg116_1.jpg)\n\n可以使用窗口对象的\
    \ `open()` 方法打开新的浏览器窗口。这需要三个参数：指定在新窗口中加载的 HTML 文档的 URL 地址、新窗口的名称，以及该窗口应包含的逗号分隔特性列表——来自下表描述的可能特性：\n\
    \n| 特性 | 说明 |\n| :--- | :--- |\n| directories | 添加链接栏 |\n| height | 设置文档区域的高度（像素）\
    \ |\n| left | 窗口的屏幕 X 坐标 |\n| location | 添加地址栏 |\n| menubar | 添加标准菜单栏 |\n| resizable\
    \ | 允许调整窗口大小 |\n| scrollbars | 需要时启用滚动条 |\n| status | 添加状态栏 |\n| toolbar | 添加前进和后退按钮栏\
    \ |\n| top | 窗口的屏幕 Y 坐标 |\n| width | 设置文档区域的宽度（像素） |\n\n当成功时，`window.open()` 方法返回一个新窗口对象并打开新的“弹出”窗口；如果失败，该方法简单返回\
    \ null。返回的结果应赋值给一个变量，随后对其进行测试——如果变量不为 null，则它必须代表弹出窗口对象。然后可以通过调用 `close()` 方法关闭该窗口，或通过调用\
    \ `print()` 方法打印其内容。\n\n还可以通过指定 X 和 Y 屏幕轴坐标作为窗口 `moveTo()` 方法的参数来定位窗口。还有一个类似的\
    \ `window.moveBy()` 方法，它接受两个参数，指定窗口从当前屏幕位置沿 X 和 Y 轴移动多少像素。\n\n![image](img/forget.jpg)\n\
    \n由于弹出窗口烦人的泛滥，浏览器制造商添加了弹出拦截器——因此不再建议使用弹出窗口，但为了完整性，这里对其进行了演示。\n\n![image](img/1bl.jpg)创建一个包含标题的\
    \ HTML 文档\n\n```html\n<h1>Pop-up Window</h1>\n```\n\n![image](img/htmlbl.jpg)popup.html\n\
    \n![image](img/2bl.jpg)创建一个包含标题的第二个文档\n\n```html\n<h1>Main Window</h1>\n```\n\n\
    ![image](img/3bl.jpg)opener.html\n\n![image](img/4bl.jpg)接下来，在第二个文档的 script 元素中添加\n\
    \n```javascript\nconst popWin = window.open( ‘popup.html’, ‘Popup’, ‘top=150,left=100,width=350,height=100’\
    \ )\n```\n\n![image](img/5bl.jpg)保存两个 HTML 文档，然后在浏览器中打开它们以查看弹出已被拦截\n\n![image](img/pg117_1.jpg)\n\
    \n![image](img/6.jpg)打开浏览器的弹出拦截器对话框并选择允许来自此页面的弹出\n\n![image](img/pg117_2.jpg)\n\
    \n![image](img/6bl.jpg)现在，刷新浏览器窗口查看弹出窗口出现\n\n![image](img/pg117_3.jpg)\n\n![image](img/snake.jpg)\n\
    \n在特性列表中不要包含任何空格，否则可能导致 `window.open()` 方法失败。\n\n![image](img/hot.jpg)\n\n注意弹出窗口没有在其标题栏上显示指定的“网站图标”。\n\
    \n## 创建计时器\n\nJavaScript 窗口对象有一个有趣的 `setTimeout()` 方法，它可以在指定时间后重复评估一个表达式。在指定的表达式调用\
    \ `setTimeout()` 语句的地方，会创建一个递归循环——其中函数会在指定时间后被重复执行。\n\n![image](img/pg118_1.jpg)\n\
    \n`setTimeout()` 方法要评估的表达式必须作为其第一个参数指定，而时间必须作为第二个参数指定的数字。时间以毫秒表示，其中 1000 代表一秒。\n\
    \n`setTimeout()` 方法返回一个数值，该数值可以赋值给变量以唯一标识等待过程。此值可以作为窗口对象 `clearTimeout()` 方法的参数，以便在某处终止计时循环。\n\
    \n窗口对象还有 `setInterval()` 和 `clearInterval()` 方法，它们采用相同的参数且工作方式相似。区别在于，`setInterval()`\
    \ 指定的时间是评估表达式的间隔时间，无论执行需要多长时间。相反，`setTimeout()` 方法指定的时间是从上一次执行结束到下一次执行开始的时间段。这意味着当间隔较短且执行表达式所需时间较长，`setInterval()`\
    \ 可能会尝试重叠执行。因此，通常优选使用 `setTimeout()` 方法。\n\n![image](img/1bl.jpg)创建一个带有空段落的 HTML\
    \ 文档\n\n```html\n<p id=”info\"></p>\n```\n\n![image](img/htmlbl.jpg)\n\ntimer.html\n\
    \n"
- fmt: "\n![image](images/2bl.jpg)\n\nNext, in a script element, initialize a variable\
    \ with a closure function that returns a decreasing integer\n\n```javascript\n\
    const count = ( function ( ) {\n  let num = 10\n  return ( function( ) { return\
    \ num-- } )\n} ) ( )\n```\n\n![image](images/forget.jpg)\n\nA two-minute task\
    \ set to an interval of 10 minutes gets started every 10 minutes, but the same\
    \ task set to a timeout of 10 minutes gets started every 12 minutes (10+2).\n\n\
    ![image](images/hot.jpg)\n\nFor a refresher on closure functions see [here](#chapter01.xhtml_sec10).\n\
    \n![image](images/3bl.jpg)Now, add a timer function that begins by initializing\
    \ three variables\n\n```javascript\nfunction countDown( ) \n{\n  const info =\
    \ document.getElementById( ‘info’ )\n  let timerId = null\n  let num = count(\
    \ )\n  // Statements to be inserted here.\n}\n```\n\n![image](images/4bl.jpg)Insert\
    \ statements to write the decreasing integer into the paragraph at one-second\
    \ intervals until it reaches zero\n\n```javascript\nif ( num > 0 )\n{\n  info.innerHTML\
    \ += ‘<span>’+ num + ‘</span>’\n  timerId = window.setTimeout( countDown , 1000\
    \ )\n}\nelse\n{\n  info.innerHTML += ‘<span>Lift Off!</span>’\n  window.clearTimeout(\
    \ timerId )\n}\n```\n\n![image](images/5bl.jpg)After the function block, add a\
    \ statement to call the timer function when the page has loaded\n\n```javascript\n\
    countDown( )\n```\n\n![image](images/6bl.jpg)Save the HTML document, then open\
    \ it in your browser to see the timer count down for 10 seconds\n\n![image](images/pg119_1.jpg)\n\
    \n![image](images/pg119_2.jpg)\n\n![image](images/pg119_3.jpg)\n\n![image](images/hot.jpg)\n\
    \nYou could usefully add a `console.log( timerId )` statement to the timer function\
    \ to see the timer’s ID value.\n\n## Examine Browsers\n\nIn the DOM hierarchy,\
    \ the top-level window object has a number of child objects, which each have their\
    \ own properties and methods. One of these is the `window.navigator` object that\
    \ contains information about the web browser. As the top-level window object exists\
    \ in the “global namespace”, all its child objects can omit that part of the address,\
    \ so the `window.alert( )` method can be simply called using `alert(`, the `window.onload`\
    \ property can be referenced using `onload`, and the `window. navigator` object\
    \ can be referenced using `navigator`.\n\n![image](images/pg120_1.jpg)\n\nThe\
    \ `navigator` object has an `appName` property that contains the browser name,\
    \ an `appCodeName` property that contains its code name, and an `appVersion` property\
    \ that contains its version number. But you may be surprised with the values as\
    \ Google Chrome, Firefox, Safari, and Opera all give their code name as “Mozilla”.\n\
    \nEach browser sends the browser code name and version in a HTTP header named\
    \ “User-Agent” when making a request to a web server, and this string can also\
    \ be retrieved from the `navigator.userAgent` property. There is also a `navigator.platform`\
    \ property that describes the browser’s host operating system.\n\nIn previous\
    \ years, much was made of browser detection scripts that attempted to identify\
    \ the browser using its `navigator` properties so that appropriate code could\
    \ be supplied to suit that browser’s supported features. This is now considered\
    \ bad practice and it is now recommended that feature detection be used instead.\n\
    \nFor example, querying if the browser supports the useful `addEventListener(\
    \ )` method determines whether that browser supports the modern Document Object\
    \ Model.\n\n![image](images/1bl.jpg)Create an HTML document with an empty list\n\
    \n```html\n<ul id=”list”></ul>\n```\n\n![image](images/htmlbl.jpg)\n\nbrowser.html\n\
    \n![image](images/2bl.jpg)Next, in a script element, create a self-invoking function\
    \ that begins by initializing a variable reference\n\n```javascript\nconst list\
    \ = document.getElementById( ‘list’ )\n```\n\n![image](images/3bl.jpg)Now, add\
    \ statements to list your browser’s names\n\n```javascript\nlist.innerHTML = ‘<li>Browser:\
    \ ‘ + navigator.appName\nlist.innerHTML += ‘<li>Code Name: ‘ +\nnavigator.appCodeName\n\
    ```\n\n![image](images/hot.jpg)\n\nPrevious examples have explicitly used the\
    \ `window` prefix to make the parentage of `window` object methods and properties\
    \ apparent, but it is technically preferable to omit the `window.` prefix – so\
    \ they are not being referenced via the `window` object’s very own `window` property.\
    \ For example, simply use `onload` rather than `window.onload`.\n\n![image](images/4bl.jpg)Then,\
    \ add statements to list the version details of your browser and of your operating\
    \ system\n\n```javascript\nlist.innerHTML += ‘<li>Version: ‘ + navigator.appVersion\n\
    list.innerHTML += ‘<li>Platform: ‘ + navigator.platform\n```\n\n![image](images/5bl.jpg)Finally,\
    \ add a statement to confirm that you have a modern browser\n\n```javascript\n\
    if( window.addEventListener )\n{\n  list.innerHTML += ‘<li>This is a modern DOM\
    \ browser’\n}\n```\n\n![image](images/6bl.jpg)Save the HTML document, then open\
    \ it in any browser to see the name and version details\n\n![image](images/pg119_1.jpg)\n\
    \n![image](images/pg119_2.jpg)\n\n![image](images/pg119_3.jpg)\n\n![image](images/hot.jpg)\n\
    \nIn all modern browsers, the `window` object has an `addEventListener( )` method\
    \ – the reason that Google Chrome and other browsers describe themselves as Netscape\
    \ emanates from the era of “Browser Wars” – when browsers had to assume those\
    \ names so they could serve the web pages.\n\n## Check Status\n\nThe DOM window\
    \ object has a `javaEnabled()` method that will return true only if Java support\
    \ is enabled.\n\n![image](images/pg122.jpg)\n\nThere is also a `cookieEnabled`\
    \ property that will be true only if cookie support is enabled.\n\nAdditionally,\
    \ `navigator` has `plugins` child object and a `mimeTypes` child object. As with\
    \ other arrays, the `plugins` and `mimeTypes` arrays both have a `length` property\
    \ containing the numeric total of their elements.\n\nEach `plugin` array element\
    \ has a `name` and `description` property containing details of one plugin. These\
    \ can be referenced using the element index as usual. For example, `navigator.plugins[0].name`\
    \ references the name of the first element.\n\nSimilarly, each `mimeTypes` array\
    \ element has a `type` and `description` property containing details of one supported\
    \ MIME feature. These can be referenced using the element index as usual. For\
    \ example, `navigator.mimeTypes[0].type` references the type of the first element.\n\
    \n![image](images/1bl.jpg)Create an HTML document with an empty paragraph\n\n\
    ```html\n<p id=”info”></p>\n```\n\n![image](images/htmlbl.jpg)\n\nenabled.html\n\
    \n![image](images/2bl.jpg)Next, in a script element, create a self-invoking function\
    \ that begins by initializing two variables\n\n```javascript\nconst info = document.getElementById(\
    \ ‘info’ )\nlet status = ‘‘\n```\n\n![image](images/3bl.jpg)Now, add statements\
    \ to write a confirmation in the paragraph only if Java support is enabled\n\n\
    ```javascript\nstatus = ( navigator.javaEnabled( ) ) ? ‘Enabled’ : ‘Disabled’\n\
    info.innerHTML += ‘Java Support is ‘ + status + ‘<hr>’\n```\n\n![image](images/4bl.jpg)Then,\
    \ add statements to write a confirmation in the paragraph only if cookie support\
    \ is enabled\n\n```javascript\nstatus = ( navigator.cookieEnabled ) ? ‘Enabled’\
    \ : ‘Disabled’\ninfo.innerHTML += ‘Cookie Support is ‘ + status + ‘<hr>’\n```\n\
    \n![image](images/forget.jpg)\n\nThe contents of these array elements vary according\
    \ to which features are supported by each browser.\n\n![image](images/5bl.jpg)Now,\
    \ add statements to write the length of the `plugins` array and an example element\n\
    \n```javascript\nif ( navigator.plugins.length !== 0 )\n{\n  info.innerHTML +=\
    \ ‘No. of Plugins: ‘ +\n  navigator.plugins.length\n  info.innerHTML += ‘<br>Example:\
    \ ‘ +\n  navigator.plugins[ 0 ].name\n  info.innerHTML += ‘<br>For: ‘ +\n  navigator.plugins[\
    \ 0 ].description + ‘<hr>’\n}\n```\n"
