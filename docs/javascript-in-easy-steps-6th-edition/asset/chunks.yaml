    **Summary**


    •Values are assigned to a custom object as a comma-separated list of name:value
    pairs within **{ }** curly brackets.


    •Object property values can be referenced using dot notation syntax or by quoting
    their name between **[ ]** square brackets.


    •Object methods are called by appending **( )** parentheses after the object’s
    method name.


    •The this keyword can be used in object method definitions to refer to the object
    that owns the method.


    •Custom objects can be extended by assigning a new value using dot notation to
    reference the property.


    •A for in loop can be used to list all property names and method names of an object.


    •All JavaScript built-in objects inherit properties and methods from a top-level
    Object.prototype object.


    •The JavaScript built-in Array object store items in individual elements that
    are numbered starting at zero.


    •Values can be assigned to an array as a comma-separated list within **[ ]** square
    brackets.


    •The value in an array element is referenced by enclosing its index number in
    **[ ]** square brackets after the object name.


    •Each Array object has a length property and methods that can be used to manipulate
    the elements in the array.


    •The JavaScript built-in Date object provides separate methods to extract each
    of its date and time components.


    •The JavaScript Date( ) constructor can optionally specify two to seven arguments
    to set values for each of its components.


    •The Date object also provides separate methods to set the value of each of its
    date and time components individually.


    •The JavaScript built-in RegExp object can contain a regular expression pattern
    that describes a string of characters.


    •The RegExp object has test( ) and exec( ) methods that search a specified string
    argument for a match to its pattern.


