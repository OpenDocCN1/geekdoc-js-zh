    **Event Values**


    In addition to the mouse events described [here](#chapter07.xhtml_sec69), there
    is a “mousemove” event. This can pass an event object to an event-handler function
    with x and y properties that contain the current window coordinates of the mouse
    pointer.


    ![image](images/pg144_1.jpg)


    There is also a “keydown” event that fires when the user first presses a key,
    a “keypress” event that fires when the key is pressed down, and a “keyup” event
    that fires when the key is released. These can each pass an event object to an
    event-handler function with a type property that identifies the name of that event,
    and a keyCode property that stores the numerical value of the last key pressed.


    The numerical value of a key is its Unicode value, which can be specified as the
    argument to a String.fromCharCode( ) method to translate it to a character value.


    Event-handler functions can be nominated to onmousemove, onkeydown, onkeypress,
    and onkeyup properties, or be specified as arguments to an object’s addEventListener(
    ) method.


    ![image](images/1v.jpg)Create an HTML document that contains an empty paragraph


