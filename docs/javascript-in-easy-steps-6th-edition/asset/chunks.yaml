  trans: "\n\n- JSON 对象可以通过 `JSON.parse()` 方法转换为 JavaScript 对象。\n- JavaScript 是一种单线程同步语言，但浏览器\
    \ API 支持一些异步操作。\n- 事件循环（event loop）不断监控调用栈和回调队列的状态。\n- `Promise` 对象代表异步操作的最终完成或失败及其产生的值。\n\
    - `then()` 和 `catch()` 方法可以链式调用到 `Promise` 对象，以处理异步操作的结果。\n- `Fetch API` 可以在 JavaScript\
    \ 中用于通过网络异步获取资源。\n- 完成后，`fetch()` 方法返回一个包含 `HTTPResponse` 对象的 `Promise` 对象。\n\
    - `HTTPResponse` 对象有一个 `json()` 方法，可以解析 JSON 对象。\n- 一些函数定义可以写成更简洁的 JavaScript\
    \ `=>` 箭头函数表达式。\n- 箭头函数表达式处理 JavaScript `this` 关键字的方式与普通函数不同。\n- JSON 数据可以填充 Web\
    \ 应用程序的单元格。\n\n# 9 编写脚本魔法\n\n本章演示了使用各种 API 的魔法能力。\n\n- 请求数据\n- 嵌入矢量\n- 绘制画布\n\
    - 存储数据\n- 拖拽项目\n- 传递消息\n- 定位用户\n- 总结\n\n## 请求数据\n\n异步 JavaScript 和 XML (“AJAX”)允许通过向\
    \ Web 服务器请求数据来更新 页面，而不中断其他操作。\n\n要使用 AJAX，JavaScript 必须首先使用 `new` 关键字和 `XMLHttpRequest()`\
    \ 构造函数创建一个 `XMLHttpRequest` 对象。实际请求作为该对象的 `open()` 方法的三个参数指定——说明检索方法、一个 `URL`\
    \ 以及一个使请求异步执行的布尔值 `true`。\n\n然后可以通过调用对象的 `send()` 方法来发送请求。最后，必须将事件处理程序指定给 `XMLHttpRequest`\
    \ 对象的 `onreadystatechange` 属性以处理来自 Web 服务器的响应。这可以首先测试对象的 `readyState` 属性是否为 `4`\
    \ 且对象的 `status` 属性为 `200`，以确保响应确实完成且成功。\n\n通过 `XMLHttpRequest` 对象检索的文本自动存储在它的\
    \ `responseText` 属性中，但 XML 数据自动存储在 `responseXML` 属性中。DOM 将 XML 文档元素表示为“节点”，因此需要额外的步骤来访问其内容。例如，特定标签名的元素节点可以通过\
    \ `responseXML` 属性的 `getElementsByTagName()` 方法分配给数组变量。\n\n每个元素节点都有一个 `firstChild`\
    \ 属性，它是内容的文本节点。这反过来有一个 `data` 属性，包含实际的文本内容。因此，元素节点的 `firstChild.data` 属性可以揭示该\
    \ XML 元素中的文本。\n\n![image](img/pg172_2.jpg)\n\n`books.xml`\n\n![image](img/1r.jpg)创建一个包含\
    \ 10 个 `<book>` 元素和内部（子）`<title>` 元素的 XML 文档\n\n![image](img/pg172_1.jpg)\n\n\
    ![image](img/hot.jpg)\n\n在请求的每个阶段，`readyState` 属性会被分配一个数字：\n\n- **0**: 未初始化\n\
    - **1**: 服务器已连接\n- **2**: 请求已接收\n- **3**: 正在处理请求\n- **4**: 响应就绪\n\n完成后，`status`\
    \ 属性会被分配一个代码：\n\n- **200**: “OK”\n- **403**: “Forbidden”\n- **404**: “Page Not\
    \ Found”\n\n![image](img/forget.jpg)\n\n这里的截图只显示了 10 个 `<book>` 元素中的两个，这些元素提供从\
    \ [www.ineasysteps.com/resource-centre/downloads](http://www.ineasysteps.com/resource-centre/downloads)\
    \ 下载的免费源码。\n\n![image](img/2r.jpg)创建一个包含按钮元素和空有序列表元素的 HTML 文档\n\n```html\n<button\
    \ onclick=\"loadXML()\">获取书籍</button>\n<ol id=\"list\"></ol>\n```\n\n![image](img/htmlr.jpg)\n\
    \n`xmldom.html`\n\n![image](img/3r.jpg)以一个请求 XML 数据的函数开始脚本\n\n```javascript\n\
    function loadXML() {\n  const xmlhttp = new XMLHttpRequest();\n  xmlhttp.open('GET',\
    \ 'books.xml', true);\n  xmlhttp.send();\n  xmlhttp.onreadystatechange = function()\
    \ {\n    if(this.readyState == 4 && this.status == 200)\n      getData(this)\n\
    \  }\n}\n```\n\n![image](img/4r.jpg)接下来，添加一个函数处理响应并将 XML 数据写入页面的空列表元素\n\n```javascript\n\
    function getData(xml) {\n  const xmlDoc = xml.responseXML;\n  const tags = xmlDoc.getElementsByTagName('book');\n\
    \  let list = '', i = 0;\n  for (i = 0; i < tags.length; i++) {\n    list += '<li>'\
    \ + tags[i].getElementsByTagName('title')[0].firstChild.data;\n  }\n  document.getElementById('list').innerHTML\
    \ = list;\n}\n```\n\n![image](img/hot.jpg)\n\n此处的循环的每次迭代都在获取“book.title.data”。使用\
    \ CSS，通过 `li.nth-child(even)` 选择器为列表项目赋予了交替的背景颜色。\n\n![image](img/5r.jpg)将 XML\
    \ 和 HTML 文档保存到 Web 服务器的“htdocs”文件夹中，然后打开网页并点击按钮，魔法般请求 XML 数据\n\n![image](img/pg173_1.jpg)\n\
    \n![image](img/pg173_2.jpg)\n\n![image](img/common3.jpg)\n\n像 HTML 文档一样，XML 文档也可以通过\
    \ W3C 的线验证工具 [validator.w3.org](http://validator.w3.org) 进行验证\n\n## 嵌入矢量\n\n嵌入在\
    \ HTML 文档中的 SVG 图形维护了所有元素和属性的 SVG DOM 节点树。这与 HTML DOM 分离，但可以通过脚本轻松访问，允许 HTML 文档与嵌入的\
    \ SVG 图形进行交互。\n\n![image](img/pg174_1.jpg)\n\n访问 SVG DOM 的关键是首先使用 `getSVGDocument()`\
    \ 方法创建 SVG 文档的引用对象。然后可以通过以下方式访问 SVG 文档中的元素、属性和文本：\n\n![image](img/1r.jpg)创建一个带有矩形、圆形和文本的\
    \ SVG 图形\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<svg xmlns=\"\
    http://www.w3.org/2000/svg\" version=\"1.1\" width=\"100%\" height=\"100%\" viewBox=\"\
    0 0 500 70\" preserveAspectRatio=\"none\">\n  <rect width=\"100%\" height=\"100%\"\
    \ style=\"fill:bisque;stroke-width:2;stroke:tomato\" />\n  <text id=\"svgTxt\"\
    \ x=\"10\" y=\"50\" font-family=\"sans-serif\" font-size=\"30\" fill=\"tomato\"\
    >SVG Text</text>\n  <circle id=\"svgBtn\" cx=\"460\" cy=\"35\" r=\"30\" fill=\"\
    tomato\" cursor=\"pointer\" />\n</svg>\n```\n\n![image](img/pg174_2.jpg)\n\n`banner.svg`\n\
    \n![image](img/2r.jpg)接下来，创建一个嵌入 SVG 图形并包含文本输入字段和推送按钮的 HTML 文档\n\n```html\n<embed\
    \ id=\"svgDoc\" src=\"banner.svg\" type=\"image/svg+xml\" width=\"500\" height=\"\
    70\">\n<br>\n<input id=\"htmTxt\" size=\"50\">\n<button id=\"htmBtn\">发送到 SVG\
    \ 文档</button>\n```\n\n![image](img/htmlr.jpg)\n\n`svgdom.html`\n\n![image](img/3r.jpg)现在，在脚本元素中为\
    \ SVG 文档和两个文档内的元素创建引用\n\n```javascript\nfunction loadSVG() {\n  const svgDoc =\
    \ document.getElementById('svgDoc').getSVGDocument();\n  const svgTxt = svgDoc.getElementById('svgTxt');\n\
    \  const svgBtn = svgDoc.getElementById('svgBtn');\n  const htmTxt = document.getElementById('htmTxt');\n\
    \  const htmBtn = document.getElementById('htmBtn');\n  // 插入语句\n}\n\nonload =\
    \ loadSVG;\n```\n\n![image](img/forget.jpg)\n\n注意此示例通过 `window.onload` 事件初始化\n\
    \n![image](img/4r.jpg)插入语句为 HTML 推送按钮指定点击事件处理函数\n\n```javascript\nhtmBtn.addEventListener('click',\
    \ function () {\n  svgTxt.lastChild.replaceWith(htmTxt.value)\n})\n```\n\n"
