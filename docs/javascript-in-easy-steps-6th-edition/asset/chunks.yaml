    - **Web applications** – illustrating responsive web-based apps and JavaScript
    Object Notation (JSON) techniques.


    ### Include Scripts


    To include JavaScript code directly in an HTML document it must be inserted between
    `<script>` and `</script>` tags, like this:


    ```html

    <script>

    document.getElementById( ‘message’ ).innerText = ‘Hello World!’

    </script>

    ```


    An HTML document can include multiple scripts, and these may be placed in the
    head or body section of the document. It is, however, recommended that you place
    scripts at the end of the body section (immediately before the `</body>` closing
    tag) so the browser can render the web page before interpreting the script.


    JavaScript code can also be written in external plain text files that are given
    a `.js` file extension. This allows several different web pages to call upon the
    same script. In order to include an external script in the HTML document, the
    file name of the script must be assigned to a `src` attribute of the `<script>`
    tag, like this:


    ```html

    <script src=”external_script.js”> </script>

    ```


    Again, this can be placed in the head or body section of the document, and the
    browser will treat the script as though it was written directly at that position
    in the HTML document.


    Assigning only the file name of an external script to the `src` attribute of a
    `<script>` tag requires the script file to be located in the same folder (directory)
    as the HTML document. If the script is located in an adjacent folder you can assign
    the relative path address of the file instead, like this:


    ```html

    <script src=”js/external_script.js”> </script>

    ```


    If the script is located elsewhere, you can assign the absolute path address of
    the file, like this:


    ```html

    <script src=”https://www.example.com/js/external_script.js”>

    </script>

    ```


    You can also specify content that will only appear in the web page if the user
    has disabled JavaScript in their web browser by including a `<noscript>` element
    in the body of the HTML document, like this:


    ```html

    <noscript>JavaScript is Not Enabled!</noscript>

    ```


    ![image](images/hot.jpg)


    You may see a `type=”text/javascript”` attribute in a `<script>` tag but this
    is no longer required as JavaScript is now the default scripting language for
    HTML.


    ![image](images/snake.jpg)


    Do not include `<script>` and `</script>` tags in an external JavaScript file,
    only the script code.


    ![image](images/forget.jpg)


    External script files can make code maintenance easier but almost all examples
    in this book are standalone for clarity, so include the script code between tags
    directly in the HTML document.


    ### Console Output


    JavaScript can display output by dynamically writing content into an HTML element.
    For example, with this code:


    ```javascript

    document.getElementById( ‘message’ ).innerText = ‘Hello World!’

    ```


    The element is identified by the value assigned to its `id` attribute and the
    `innerText` property specifies text to be written there.


    ![image](images/pg10_1.jpg)


    Additionally, JavaScript can display output by writing content into a pop-up dialog
    box, like this:


    ```javascript

    window.alert( ‘Hello World!’ )

    ```


    This calls the `alert()` method of the `window` object to display the content
    specified within the ( ) parentheses in a dialog box.


    ![image](images/pg10_2.jpg)


    When developing in JavaScript, and learning the language, it is initially better
    to display output in the browser’s JavaScript console, like this:


    ```javascript

    console.log( ‘Hello World!’ )

    ```


    This calls the `log()` method of the `console` object to display the content specified
    within the ( ) parentheses in a console window. All leading browsers have a JavaScript
    console within their Developers Tools feature – typically accessed by pressing
    the F12 keyboard key. As the Google Chrome web browser is statistically the most
    popular browser at the time of writing it is used throughout this book to demonstrate
    JavaScript, and initially its console window is used to display output.


    ![image](images/hot.jpg)


    Notice the use of the `.` period (full stop) operator to describe properties or
    methods of an object using “dot notation”.


    ![image](images/snake.jpg)


    There is also a `document.write()` method that replaces the entire header and
    body of the web page, but its use is generally considered bad practice.


    ![image](images/hot.jpg)


    The console provides helpful messages if an error occurs in your code – so is
    great for debugging the code.


    ![image](images/1b.jpg)Create an HTML document that includes an empty paragraph
    and a script to display output in three ways


    ```html

    <p id=”message”></p>

    <script>

    document.getElementById( ‘message’ ).innerText = ‘Hello World!’

    window.alert( ‘Hello World!’ )

    console.log( ‘Hello World!’ )

    </script>

    ```


    ![image](images/htmlb.jpg)


    output.html


    ![image](images/2b.jpg)Save the HTML document then open it in your browser to
    see the output written in the paragraph and displayed in a dialog box – as illustrated
    opposite


    ![image](images/3b.jpg)Next, hit the F12 key, or use your browser’s menu to open
    its Developers Tools feature


    ![image](images/4b.jpg)Now, select the Console tab to see the output written into
    the console window


    ![image](images/pg11_1.jpg)


    ![image](images/hot.jpg)


    See that the console displays the output plus the name of the HTML document and
    the line number upon which the JavaScript code appears that created the output.


    ![image](images/5b.jpg)Click ![image](images/pg11_3.jpg) the Show/Hide button
    to hide or show the sidebar, click the Customize button to choose how the console
    window docks in the browser window, then click the ![image](images/pg11_4.jpg)
    Clear button to clear all content from the console


    ![image](images/pg11_2.jpg)


    ### Make Statements


    JavaScript code is composed of a series of instructions called “statements”, which
    are generally executed in top-to-bottom order as the browser’s JavaScript engine
    proceeds through the script.


    Each statement may contain any of the following components:


    - **Keywords** – words that have special significance in the JavaScript language.

    - **Operators** – special characters that perform an operation on one or more
    operands.

    - **Values** – text strings, numbers, Boolean `true` or `false`, `undefined`,
    and `null`.

    - **Expressions** – units of code that produce a single value.


    In earlier JavaScript code each statement had to be terminated by a `;` semicolon
    character – just as each sentence must end with a . period (full stop) character
    in the English language. This is now optional so may be omitted unless you wish
    to write multiple statements on a single line. In that case, the statements do
    need to be separated by a semicolon, like this:


    ```javascript

    statement ; statement ; statement

    ```


    Some JavaScript programmers still prefer to end each statement with a semicolon.
    The examples in this book choose to omit them for the sake of concision but the
    choice is yours.


    The JavaScript interpreter ignores tabs and spaces (“whitespace”) so you should
    use spacing to make your code more readable. For example, when adding two numbers:


    ```javascript

    total = 100 + 200

    ```


    rather than `total=100+200`


    JavaScript statements are often grouped together within `{ }` curly brackets (“braces”)
    in function blocks that can be repeatedly called when required. It is good practice
    to indent those statements by two spaces to improve readability, like this:


    ```javascript

    {

    statement

    statement

    statement

    }

    ```


    ![image](images/hot.jpg)


    The JavaScript keywords are described [here](#chapter01.xhtml_sec5) and you will
    learn about operators, values, and expressions later.


    ![image](images/forget.jpg)


    An “expression” produces a value, whereas a “statement” performs an action.


    ![image](images/snake.jpg)


    Use the space bar to indent statements, as tab spacing may be treated differently
    when viewing the code in text editors.

