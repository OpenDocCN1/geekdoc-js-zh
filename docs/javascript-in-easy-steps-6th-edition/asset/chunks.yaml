    Discover more about the Drag-and-Drop API online at **[dev.w3.org/html5/spec/dnd.html](http://dev.w3.org/html5/spec/dnd.html)**


    **Pass Messages**


    The ability to allow plain text messages to be securely sent between documents
    is supported by the Messaging API. This is even possible when the documents are
    hosted on two different domains. For example, a document hosted on the local domain
    might include an inline frame containing a document from a different domain, which
    can securely send messages to each other.


    To send a message to another document, a reference to the receiving document’s
    containing window is first required by the sending document. For an inline frame
    this is available from its contentWindow property. The Messaging API then provides
    it a postMessage( ) method that requires two arguments – to specify the message
    to be sent, and the target document domain – for example, otherWindow.postMessage(
    ‘Hello’, ‘http://example.com’ )


    In order to receive a message sent from another document, a message “listener”
    must first be added to the receiving document. This requires three arguments be
    supplied to that window’s addEventListener( ) method – to specify it should listen
    for a “message” type, the event-handler function to process the message, and a
    Boolean false value to indicate no further processing is required.


    The message is passed to the event-handler as an “event” that has an origin property,
    containing the domain of the sending document, and a data property, containing
    the text message.


    ![image](images/1r.jpg)Create an HTML document that incorporates a heading, a
    paragraph to display the document domain, an inline frame for a remote domain,
    and a “Send Message” button


    **<h1>Sender</h1>**


    **<p id=”host” >Main Page Domain: </p>**


    **<iframe id=”cage” width = ”450” height = ”120”**


    **src=”http://example.com/receiver.html” > </iframe>**


    **<button onclick=”sendMsg( )” >Send Message</button>**


    ![image](images/htmlr.jpg)


    sender.html


    ![image](images/2r.jpg)Next, begin a script to display the domain that is hosting
    this HTML document


    **document.getElementById( ‘host’ ).innerText +=**


    **document.domain**


    ![image](images/forget.jpg)


    Pages must be served via HTTP (from a web server) to use the Messaging API. As
    a security precaution, cross-document messaging only succeeds when the sender
    correctly specifies the receiver’s domain in the **postMessage( )** method, and
    the receiver correctly verifies the sender’s domain in the message’s **event.origin**
    property.


    ![image](images/3r.jpg)Now, add a function to send a message


    **function sendMsg( ) {**


    **const cage =**


    **document.getElementById( ‘cage’ ).contentWindow**


    **cage.postMessage( ‘Message Received from: ‘ +**


    **document.domain , ‘http://example.com’ )**


    **}**


    ![image](images/4r.jpg)Create another HTML document that incorporates a heading,
    a paragraph to display the document domain, and an empty paragraph – in which
    to receive a message


    **<h1>Receiver</h1>**


    **<p id=”host” >Iframe Page Domain: </p>**


    **<p id=”msg”></p>**


    ![image](images/htmlr.jpg)


    receiver.html


    ![image](images/5r.jpg)Begin a script to display the domain that is hosting this
    second HTML document, and add a message event listener


    **document.getElementById( ‘host’ ).innerText +=**


    **document.domain**


    **window.addEventListener( ‘message’, readMsg )**


    ![image](images/6r.jpg)Now, add a function to write a received message


    **function readMsg( event ) {**


    **if ( event.origin === ‘http://localhost’ )**


    **document.getElementById( ‘msg’ ).innerText = event.data**


    **}**


    ![image](images/7r.jpg)Save the documents on different domains, then click the
    button to magically send a cross-document message


    ![image](images/pg183_1.jpg)


    ![image](images/pg183_2.jpg)


    ![image](images/common3.jpg)


    Discover more about the Messaging API online at **[dev.w3.org/html5/webstorage](http://dev.w3.org/html5/webstorage)**


