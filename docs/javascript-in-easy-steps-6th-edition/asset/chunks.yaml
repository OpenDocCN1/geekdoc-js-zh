    \ to zero.\n\n## Round Decimals\n\nThe built-in JavaScript `Math` object provides\
    \ three methods for rounding floating-point numbers to integer values. Each method\
    \ takes the floating-point value as its argument and returns an integer. The `Math.ceil()`\
    \ method rounds up, the `Math.floor()` method rounds down, and the `Math.round()`\
    \ method rounds up or down to the nearest integer.\n\n![image](images/pg94_1.jpg)\n\
    \nWhen handling floating-point values it is important to recognize a discrepancy\
    \ that exists between the prevailing computer floating-point math standard, as\
    \ defined by the IEEE (Institute of Electrical and Electronics Engineers), and\
    \ generally accepted mathematical accuracy. This exists because some decimal numbers\
    \ cannot be exactly translated into binary form. For example, the decimal number\
    \ `81.66` cannot be exactly translated to binary – so the expression `81.66 *\
    \ 15` returns `1224.8999999999999` rather than the mathematically accurate figure\
    \ of `1224.9`.\n\nSome programming languages provide automatic rounding to overcome\
    \ floating-point discrepancies, but JavaScript does not so care must be taken,\
    \ especially with monetary values, to avoid mathematically erroneous results.\
    \ The recommended procedure is to first multiply the floating-point value by `100`,\
    \ then perform the arithmetical operation, and finally divide the result by `100`\
    \ to return to the same decimal level.\n\nA similar procedure can be used to commute\
    \ long floating-point values to just two decimal places. After multiplying a value\
    \ by `100`, the `Math.round()` method can be employed to round the value, then\
    \ division by zero returns to two decimal places.\n\nProcedures that multiply,\
    \ operate, then divide, can be written as individual steps or parentheses can\
    \ be used to determine the order in a single succinct expression. For example,\
    \ commuting a long floating-point value in a variable named `num` can be written\
    \ as:\n\n```javascript\nnum = num * 100\nnum = Math.round( num )\nnum /= 100\n\
    ```\n\nor alternatively as:\n\n```javascript\nnum = ( Math.round( num * 100 )\
    \ ) / 100\n```\n\n![image](images/hot.jpg)\n\nThe `Math.round()` method rounds\
    \ up by default – so `Math.round( 7.5 )` returns 8, not 7 and `Math.round( -7.5\
    \ )` returns -7, not -8.\n\n![image](images/1o.jpg)Create an HTML document with\
    \ a self-invoking function that begins by initializing a variable\n\n```javascript\n\
    let bodyTemp = 98.6\n```\n\n![image](images/htmlo.jpg)\n\nround.html\n\n![image](images/2o.jpg)Next,\
    \ add statements to display closest integers to the floating-point value\n\n```javascript\n\
    console.log( ‘Ceiling: ‘ + Math.ceil( bodyTemp ) )\nconsole.log( ‘Floor: ‘ + Math.floor(\
    \ bodyTemp ) )\nconsole.log( ‘Round: ‘ + Math.round( bodyTemp ) )\n```\n\n![image](images/3o.jpg)Now,\
    \ add statements to display an incorrectly calculated result of an expression\
    \ and a corrected equivalent\n\n```javascript\nconsole.log( ‘\\nImprecision: ‘\
    \ + ( 81.66 * 15 ) )\nconsole.log( ‘Corrected: ‘ + ( ( 81.66 * 100 ) / 100 ) )\n\
    ```\n\n![image](images/4o.jpg)Then, add statements to display a long floating-point\
    \ value and a commuted equivalent\n\n```javascript\nconsole.log( ‘\\nFloat: ‘\
    \ + Math.PI )\nconsole.log( ‘Commuted: ‘ + ( Math.round ( Math.PI * 100 ) / 100\
    \ ) )\n```\n\n![image](images/5o.jpg)Save the HTML document, then open it in your\
    \ browser and launch the console to see the rounded numbers\n\n![image](images/pg95_1.jpg)\n\
    \n![image](images/forget.jpg)Expressions in innermost parentheses are evaluated\
    \ first.\n\n## Generate Randoms\n\nThe JavaScript `Math.random()` method returns\
    \ a random-point number between `0.0` and `1.0`. This can be used for a variety\
    \ of web page effects that require a random number. Multiplying the floating-point\
    \ value will increase its range. For example, multiplying it by `10` increases\
    \ the range to become `0.0-10.0`.\n\n![image](images/pg96_1.jpg)\n\nGenerally,\
    \ it is useful to round the random value up with the `Math.ceil()` method so that\
    \ the range becomes `1-10`. The process of specifying the range for a random number\
    \ value can be written as individual steps, or parentheses can be used to determine\
    \ the order in a single expression. For example, specifying a range of `1-10`\
    \ for a variable named `rand` can be written as:\n\n```javascript\nlet rand =\
    \ Math.random()\nrand *= 10\nrand = Math.ceil( rand )\n```\n\nor alternatively\
    \ as:\n\n```javascript\nlet rand = Math.ceil( Math.random() * 10 )\n```\n\nA series\
    \ of unique random numbers can be generated within a specified range. For example,\
    \ to produce random lottery numbers within the range `1-59`:\n\n![image](images/1o.jpg)Create\
    \ an HTML document with a self-invoking function that begins by declaring variables\n\
    \n```javascript\nlet i, rand, temp, nums = []\nlet str = ‘\\nYour Lucky Numbers:\
    \ ‘\n```\n\n![image](images/htmlo.jpg)\n\nrandom.html\n\n![image](images/2o.jpg)Next,\
    \ add a loop to fill array elements `1-59` with their respective index number\n\
    \n```javascript\nfor( i = 1 ; i < 60 ; i ) { nums[ i ] = i }\n```\n\n![image](images/3o.jpg)Now,\
    \ add a loop to randomize the numbers in the array elements\n\n```javascript\n\
    for( i = 1 ; i < 60 ; i ) {\n  rand = Math.ceil( Math.random() * 59 )\n  temp\
    \ = nums[ i ]\n  nums[ i ] = nums[ rand ]\n  nums[ rand ] = temp\n}\n```\n\n![image](images/hot.jpg)Step\
    \ 3 contains an algorithm that shuffles the numbers and ensures no two elements\
    \ contain the same number.\n\n![image](images/4o.jpg)Then, add a loop to append\
    \ a hyphenated list of six element values to the string variable\n\n```javascript\n\
    for( i = 1 ; i < 7 ; i ) {\n  str += nums[ i ]\n  if( i !== 6 ) { str += ‘ - ‘\
    \ }\n}\n```\n\n![image](images/5o.jpg)Finally, add a statement to output the string\
    \ variable\n\n```javascript\nconsole.log( str )\n```\n\n![image](images/6o.jpg)Save\
    \ the HTML document, then open it in your browser and launch the console to see\
    \ a unique selection of random numbers within the specified range each time the\
    \ script is executed.\n\n![image](images/pg97_1.jpg)\n\n![image](images/pg97_2.jpg)Here,\
    \ the random numbers are in the range `1` to `59` – to play the UK Lotto game\
    \ or the US New York Lotto game.\n\n![image](images/pg97_3.jpg)\n\n## Unite Strings\n\
    \nJavaScript has a `String` object that provides useful methods to manipulate\
    \ string values. There is, however, no need to create instances of the `String`\
    \ object with the `new` keyword and the `String()` constructor, as its methods\
    \ can simply be applied to string variables using dot notation. For example, `str.toUpperCase()`\
    \ returns all characters of a string variable named `str` in uppercase, whereas\
    \ `str.toLowerCase()` returns all its characters in lowercase.\n\n![image](images/pg98_1.jpg)\n\
    \nThere is also a `length` property that stores the total number of characters\
    \ in a string.\n\nMany of the examples listed earlier use the `+` concatenation\
    \ operator to unite multiple strings but, alternatively, the string `concat()`\
    \ method can be used to append one or more strings supplied as a comma-separated\
    \ list of arguments.\n\nThe `eval()` built-in function is also used to unite strings\
    \ and variables by some script authors – but this absolutely should be avoided.\
    \ The `eval()` function directly calls the JavaScript compiler to compile its\
    \ string argument into a JavaScript statement:\n\n- If the string represents an\
    \ expression, `eval()` will evaluate that expression – for example `eval('1 +\
    \ 1')` returns `2`.\n- If the string represents a statement, or sequence of statements,\
    \ `eval()` will evaluate the last statement – for example, the code `eval('let\
    \ num = 100 ; alert( num )')` produces an alert dialog.\n\n![image](images/pg98_2.jpg)\n\
    \nThis use of `eval()` incurs a large cost in script performance and is unnecessary\
    \ in almost every case as there is usually a more efficient and elegant solution.\
    \ Furthermore, the `eval()` function can have security implications if the script\
    \ allows user input to be evaluated as a JavaScript instruction. This provides\
    \ the opportunity to execute malicious code. For example, the code `eval('while(\
    \ true) ; alert( )')` will produce an infinite loop that locks the browser.\n\n\
    ![image](images/snake.jpg)\n"
