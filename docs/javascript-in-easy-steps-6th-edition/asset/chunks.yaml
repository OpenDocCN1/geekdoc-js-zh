    ```javascript

    make: ‘Jeep’ ,

    model: ‘Wrangler’ ,

    ```


    ![image](images/3p.jpg)Now, insert statements to define the object’s methods


    ```javascript

    accelerate: function ( ) {

    return this.model + ‘ drives away’ } ,

    brake: function ( ) {

    return this.make + ‘ pulls up’ }

    ```


    ![image](images/4p.jpg)Then, after the closing `}` of the variable declaration,
    add a statement to output a string containing the object property values – using
    each reference technique


    ```javascript

    console.log( ‘Car is a ‘ + car.make + ‘ ‘ + car[ ‘model’ ] )

    ```


    ![image](images/5p.jpg)Finally, add statements to call each object method


    ```javascript

    console.log( car.accelerate( ) )

