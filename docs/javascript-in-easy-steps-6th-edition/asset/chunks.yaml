    \n```javascript\nconsole.log( ‘charCodeAt 0: ‘ + str.charCodeAt( 0 ) )\n```\n\n\
    ```javascript\nconsole.log( ‘fromCharCode: ‘ +\nString.fromCharCode( 74, 97, 118,\
    \ 97 ) )\n```\n\n![image](img/6o.jpg)最后，添加语句来输出原始字符串及其修改后的版本。\n\n```javascript\n\
    console.log( ‘\\nOriginal: ‘ + str )\n```\n\n```javascript\nconsole.log( ‘Replaced:\
    \ ‘ + str.replace( ‘easy’, ‘simple’ ) )\n```\n\n![image](img/7o.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台以查看输出结果。\n\
    \n![image](img/pg103_1.jpg)\n\n![image](img/hot.jpg)\n\nUnicode 大写字母 A-Z 的值为 65-90，小写字母\
    \ a-z 的值为 97-122。\n\n![image](img/forget.jpg)\n\n`replace( )` 方法返回原始字符串的修改版本，但实际上不会改变原始字符串。\n\
    \n### 修剪字符串\n\nJavaScript 的 `String` 对象提供了一个 `trim( )` 方法，可以移除字符串两端的空白字符。这对于确保用户输入不会意外包含空格、制表符或换行符特别有用。\n\
    \n![image](img/pg104_1.jpg)\n\n从字符串中修剪空白后，你可以使用 `startsWith( )` 方法验证其开头字符，并使用\
    \ `endsWith( )` 方法验证其末尾字符。这些方法都接受字符或子字符串作为参数，并在字符串中进行区分大小的匹配。如果找到匹配，它们将返回 `true`；否则如果没有找到匹配，将返回\
    \ `false`。\n\n可以通过在字符串变量名后的 `[ ]` 方括号中指定其索引位置来引用单个字符——例如使用 `str[ 0 ]` 来引用名为“str”的变量中的第一个字母。\n\
    \n你还可以通过指定字符或子字符串作为 `includes( )` 方法的参数，在字符串中进行区分大小的匹配。如果找到匹配，将返回 `true`；否则如果没有找到匹配，将返回\
    \ `false`。\n\n如果你希望构建一个包含现有字符串多个副本的新字符串，只需为 `repeat( )` 方法指定一个整数参数，以确定现有字符串在新创建的字符串中重复的次数。\n\
    \n![image](img/1o.jpg)创建一个 HTML 文档，其中包含自执行函数，该函数首先初始化一个变量——其值为一个两端带有空白字符的字符串。\n\
    \n```javascript\nlet str = ‘ Love For All, Hatred For None.  ;’\n```\n\n![image](img/htmlo.jpg)\n\
    \ntrim.html\n\n![image](img/2o.jpg)接下来，添加语句输出字符串并测试它的开头和结尾。\n\n```javascript\n\
    console.log( ‘String: ‘ + str )\n```\n\n```javascript\nconsole.log( ‘Starts With\
    \ “L” ? ‘ + str.startsWith( ‘L’ ) )\n```\n\n```javascript\nconsole.log( ‘Ends\
    \ With “.” ? ‘+str.endsWith( ‘.’ ) )\n```\n\n```javascript\nconsole.log( ‘First\
    \ Letter: ‘ + str[ 0 ] )\n```\n\n![image](img/3o.jpg)现在，添加一条语句将修剪后的字符串赋值给变量。\n\
    \n```javascript\nstr = str.trim( )\n```\n\n![image](img/hot.jpg)\n\n`split( )`\
    \ 方法用于移除示例此处中 cookie 数据中的空白字符。\n\n![image](img/4o.jpg)然后，添加语句输出修剪后的字符串并像之前一样测试它的开头和结尾。\n\
    \n```javascript\nconsole.log( ‘Trimmed: ‘ + str )\n```\n\n```javascript\nconsole.log(\
    \ ‘Starts With “L” ? ‘ + str.startsWith( ‘L’ ) )\n```\n\n```javascript\nconsole.log(\
    \ ‘Ends With “.” ? ‘+str.endsWith( ‘.’ ) )\n```\n\n```javascript\nconsole.log(\
    \ ‘First Letter: ‘ + str[ 0 ] )\n```\n\n![image](img/5o.jpg)添加语句以查看字符串中的子字符串。\n\
    \n```javascript\nconsole.log( ‘\\nIncludes “Hat” ?+ str.includes( ‘Hat’ ) )\n\
    ```\n\n```javascript\nconsole.log( ‘Includes “hat” ?+ str.includes( ‘hat’ ) )\n\
    ```\n\n![image](img/6o.jpg)最后，添加一条语句输出 10 份修剪后的字符串。\n\n```javascript\nconsole.log(\
    \ ‘\\nRepeat:\\n’ + str.repeat( 10 ) )\n```\n\n![image](img/7o.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台以查看输出结果。\n\
    \n![image](img/pg105_1.jpg)\n\n![image](img/hot.jpg)\n\n字符匹配也可以使用等等运算符进行，例如 `str[\
    \ 0 ] === ‘L’`。\n\n![image](img/forget.jpg)\n\n使用这些方法匹配是区分大小的。\n\n### 总结\n\n-\
    \ `Math` 对象提供了数学常量（如 `Math.PI`）和数学方法（如 `Math.max( )`）。\n- 浮点数可以使用 `Math.floor(\
    \ )`、`Math.ceil( )` 和 `Math.round( )` 方法舍入到最接近的整数。\n- JavaScript 不提供自动舍入来解决浮点数差异。\n\
    - 将浮点值乘以 100，执行运算，然后将结果除以 100 以避免差异误差。\n- `Math.random( )` 方法返回一个 0.0 到 1.0 之间的随机浮点数。\n\
    - 将随机浮点数乘以 10 并使用 `Math.ceil( )` 对结果舍入，范围变为 1-10。\n- `String` 对象提供了处理字符串值的有用方法，如\
    \ `toUpperCase( )` 和 `toLowerCase( )`。\n- 每个字符串都有一个 `length` 属性，包含一个表示该字符串字符总数的整数。\n\
    - 可以使用 `+` 拼接运算符或字符串 `concat( )` 方法将字符串连接在一起。\n- `eval( )` 内置函数可能会产生安全影响，因此最好避免。\n\
    - `slice( )` 和 `substring( )` 方法的参数指定起始和结束位置，但 `substr( )` 方法的参数指定起始位置和要复制的字符数。\n\
    - `split( )` 方法返回位于指定字符出现位置之间的所有子字符串的数组。\n- `search( )`、`match( )`、`indexOf( )`、`lastIndexOf(\
    \ )` 和 `charAt( )` 方法可用于在字符串内查找字符。\n- `trim( )` 方法移除字符串两端的空白字符。\n- `startsWith(\
    \ )`、`endsWith( )` 和 `includes( )` 方法在字符串内进行区分大小的匹配。\n- `replace( )` 和 `repeat(\
    \ )` 方法创建后的字符串。\n\n# 6 处理 Window 对象\n\n*本章描述并演示了顶层 Window 对象环境的方法。*\n\n- 认识 DOM\n\
    - 检查属性\n- 显示对话框\n- 滚动查看\n- 弹出窗口\n- 制作计时器\n- 检查浏览器\n- 检查状态\n- 控制位置\n- 浏览历史\n- 总结\n\
    \n### 认识 DOM\n\n![image](img/pg108_1.jpg)\n\n浏览器在一个称为“文档模型”（DOM）的层次树中表示网页的所有组件。每个组件都在顶层窗口对象下方，树包含如下分支：\n\
    \n![image](img/pg108_2.jpg)\n\n可以使用 `for in` 循环列出浏览器提供的窗口对象属性。列表将包含所有现代浏览器的基础属性，以及特定浏览器的少量属性。\n\
    \n![image](img/hot.jpg)\n\n跟随方括号的项目是数组对象，而圆括号内的是各种表单元素。\n\n![image](img/1bl.jpg)创建一个带有空列表元素的\
    \ HTML 文档。\n\n```html\n<ol id=\"props\" style=\"column-count:3\"></ol>\n```\n\n\
    ![image](img/htmlbl.jpg)\n\ndom.html\n\n![image](img/2bl.jpg)接下来，在 `script` 元素中创建一个自执行函数，该函数首先初始化两个变量。\n\
    \n```javascript\nconst list = document.getElementById( ‘props’ )\nlet property\
    \ = null\n```\n\n![image](img/3bl.jpg)现在，添加一个循环，为列表元素填充浏览器窗口对象的直接属性。\n\n```javascript\n\
    for( property in window )\n{\n  if( property ) { list.innerHTML += ‘<li>’ + property\
    \ }\n}\n```\n\n![image](img/4bl.jpg)保存 HTML 文档，然后在浏览器中打开它以查看窗口属性和方法名。\n\n![image](img/pg109_1.jpg)\n\
    \n"
- fmt: "\n![image](images/forget.jpg)\n\nClosing `</li>` tags are optional so are\
    \ omitted in this loop.\n\n![image](images/hot.jpg)\n\nScroll down the list to\
    \ examine all `window` properties and methods – on this occasion there was a total\
    \ of 204 items. The important properties in the tree illustration opposite are\
    \ highlighted in this screenshot.\n\n### Inspect Properties\n\nThe top-level DOM\
    \ `window` object has a `screen` child object that provides properties describing\
    \ the user’s monitor resolution in pixel measurement. Overall screen dimensions\
    \ can be found in the `window.screen.width` and `window.screen.height` properties.\n\
    \n![image](images/pg110_1.jpg)\n\nSimilarly, the usable screen dimensions, excluding\
    \ the space occupied by the desktop task bar, can be found in the `window.screen.availWidth`\
    \ and `window.screen.availHeight` properties.\n\nThe screen’s color capability\
    \ can be discovered from the `window.screen.colorDepth` property that contains\
    \ a bit value describing the range of possible colors that screen can display:\n\
    \n- **8-bit** – Low Color can display only 256 colors.\n- **16-bit** – High Color\
    \ can display 65,536 colors.\n- **24-bit** – True Color can display millions of\
    \ colors.\n- **32-bit** – Deep Color can display a gamut comprising a billion\
    \ or more colors.\n\nModern computers use 24-bit or 32-bit hardware for color\
    \ display, but older computers use 16-bit hardware. Only very old computers and\
    \ old cellphones use 8-bit hardware for color display.\n\nThere is also a `window.screen.pixelDepth`\
    \ property that contains the screen’s pixel depth, but on modern computers this\
    \ is the same value as in the `window.screen.colorDepth` property – always use\
    \ `window.screen.colorDepth` to discover the color capability.\n\nSome browsers\
    \ now support a `window.screen.orientation` object that has a `type` property\
    \ describing the current orientation of the screen as either landscape or portrait,\
    \ and whether this is the screen’s primary or secondary usual orientation.\n\n\
    As the `window` object is the top-level global object in the browser’s scripting\
    \ environment, its name can optionally be omitted when referencing its child objects\
    \ and their properties. For example, you can simply write `screen.colorDepth`\
    \ to reference the `window.screen.colorDepth` property.\n\n![image](images/snake.jpg)\n\
    \nNotice the “camelCase” capitalization of these property names.\n\n![image](images/1bl.jpg)Create\
    \ an HTML document with an empty paragraph\n\n```html\n<p id=\"props\" style=\"\
    font:1.5em sans-serif\"></p>\n```\n\n![image](images/htmlbl.jpg)\n\nscreen.html\n\
    \n![image](images/2bl.jpg)Next, in a script element, create a self-invoking function\
    \ that begins by initializing six variables\n\n```javascript\nconst info = document.getElementById(\
    \ ‘props’ )\nlet width = window.screen.width + ‘px’\nlet height = window.screen.height\
    \ + ‘px’\nlet availW = window.screen.availWidth + ‘px’\nlet availH = window.screen.availHeight\
    \ + ‘px’\nlet colors = ‘Unknown’\n```\n\n![image](images/3bl.jpg)Now, add a statement\
    \ to describe the color capability\n\n```javascript\nswitch( window.screen.colorDepth\
    \ )\n{\n  case 8 : colors = ‘Low Color’ ; break\n  case 16 : colors = ‘High Color’\
    \ ; break\n  case 24 : colors = ‘True Color’ ; break\n  case 32 : colors = ‘Deep\
    \ Color’ ; break\n}\n```\n\n![image](images/4bl.jpg)Then, add statements to display\
    \ screen information\n\n```javascript\ninfo.innerHTML = ‘Screen Resolution: ‘\
    \ +\nwidth + ‘ x ‘ + height + ‘<br>’\ninfo.innerHTML += ‘Available Screen Size:\
    \ ‘ +\navailW + ‘ x ‘ + availH + ‘<br>’\ninfo.innerHTML += ‘Color Capability:\
    \ ‘ + colors + ‘<br>’\nif( window.screen.orientation )\n{\n  info.innerHTML +=\
    \ ‘Orientation: ‘ +\n  window.screen.orientation.type\n}\n```\n\n![image](images/5bl.jpg)Save\
    \ the HTML document, then open it in your browser to see the screen information\n\
    \n![image](images/pg111_1.jpg)\n\n![image](images/forget.jpg)\n\nThe available\
    \ height here is 40 pixels less than the screen height because the desktop taskbar\
    \ is 40 pixels high.\n\n![image](images/hot.jpg)\n\nThe `colorDepth` property\
    \ can be used to deliver low resolution images within a document for browsers\
    \ with limited color capabilities.\n\n### Show Dialogs\n\nThe top-level DOM `window`\
    \ object provides three methods with which JavaScript can display dialog messages\
    \ to the user. A simple warning message string can be specified as the argument\
    \ to the `window.alert()` method. This gets displayed on a dialog box with just\
    \ an “OK” button, which merely closes the dialog box.\n\n![image](images/pg112_1.jpg)\n\
    \nMore usefully, a message can be specified as the argument to the `window.confirm()`\
    \ method to request a decision from the user. This gets displayed on a dialog\
    \ box with an “OK” button and a “Cancel” button. Either button will close the\
    \ dialog box when pushed, but the “OK” button returns a true value, whereas the\
    \ “Cancel” button returns a false value.\n\nA message can also be specified as\
    \ the argument to the `window.prompt()` method to request input from the user.\
    \ This gets displayed on a dialog box with an “OK” button, a “Cancel” button,\
    \ and a text input field. Either button will close the dialog box when pushed,\
    \ but the “OK” button returns the value in the text field, whereas the “Cancel”\
    \ button returns a null value. A second argument can also be supplied to the `window.prompt()`\
    \ method to specify default content for the text field.\n\n![image](images/1bl.jpg)Create\
    \ an HTML document with an empty paragraph\n\n```html\n<p id=\"response\" style=\"\
    font:1.5em sans-serif\"></p>\n```\n\n![image](images/htmlbl.jpg)\n\ndialogs.html\n\
    \n![image](images/2bl.jpg)Next, in a script element, create a self-invoking function\
    \ that begins by initializing one variable reference\n\n```javascript\nconst info\
    \ = document.getElementById( ‘response’ )\n```\n\n![image](images/3bl.jpg)Now,\
    \ add a statement to display a message on a simple dialog box\n\n```javascript\n\
    window.alert( ‘Hello from JavaScript’ )\n```\n\n![image](images/4bl.jpg)Then,\
    \ add a statement to request a decision from the user and write the response in\
    \ the paragraph\n\n```javascript\ninfo.innerHTML = ‘Confirm: ‘ + window.confirm(\
    \ ‘Go or Stop?’ )\n```\n\n![image](images/5bl.jpg)Next, add a statement to request\
    \ text input from the user and write the text response into the paragraph\n\n\
    ```javascript\ninfo.innerHTML += ‘<br>Prompt: ‘ + window.prompt( ‘Yes or No?’,\
    \ ‘Yes’ )\n```\n\n![image](images/6bl.jpg)Save the HTML document, then open it\
    \ in your browser to see the message appear on a simple dialog box\n\n![image](images/pg113_1.jpg)\n\
    \n![image](images/7bl.jpg)Click the OK button on each dialog box to close them\
    \ in turn, then see the response appear in the paragraph\n\n![image](images/pg113_2.jpg)\n\
    \n![image](images/pg113_3.jpg)\n\n![image](images/pg113_4.jpg)\n\n![image](images/hot.jpg)\n\
    \nThe `confirm` dialog can be used with an `if` statement to branch a script –\
    \ for example,\n\n```javascript\nif( confirm( ‘OK?’ ) ) { ... } else { ... }\n\
    ```\n\n![image](images/forget.jpg)\n\nIf the script is to use text input from\
    \ a `prompt` dialog it is good practice to trim whitespace from the ends of the\
    \ string – see [here](#chapter05.xhtml_sec50).\n\n### Scroll Around\n\nThe DOM\
    \ `window` object has a `scrollBy()` method that allows the window to be scrolled\
    \ horizontally and vertically when content overflows the window in either orientation.\
    \ This method requires two arguments to specify the number of pixels to shift\
    \ along the X and Y axes.\n\n![image](images/pg114_1.jpg)\n\nWhen content overflows\
    \ the window vertically, a scroll bar appears along the right edge of the browser\
    \ window. The `scrollBy()` method will scroll by the number of pixels specified\
    \ as its first argument – or until it reaches the extreme of the content.\n\n\
    Similarly, when content overflows the window horizontally, a scroll bar appears\
    \ along the bottom of the browser window. The `scrollBy()` method will scroll\
    \ by the number of pixels specified as its second argument – or until it reaches\
    \ the extreme of the content.\n"
