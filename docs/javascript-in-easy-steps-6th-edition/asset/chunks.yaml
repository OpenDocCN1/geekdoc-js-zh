    **list.innerHTML = ‘<li>Linked From: ‘ + document.referrer**


    **list.innerHTML += ‘<li>Title: ‘ + document.title**


    **list.innerHTML += ‘<li>URL: ‘ + document.URL**


    **list.innerHTML += ‘<li>Domain: ‘ + document.domain**


    **list.innerHTML += ‘<li>Last Modified: ‘ +**


    **document.lastModified**


    ![image](images/5v.jpg)Save the HTML documents in the same folder, then open the
    document containing the link in your browser


    ![image](images/pg131_1.jpg)


    ![image](images/6v.jpg)Now, click on the hyperlink to load the second HTML document
    in the browser and see document information


    ![image](images/pg131_2.jpg)


    ![image](images/forget.jpg)


    The date contained in **document.lastModified** only relates to the HTML document
    itself, not to any external style sheets or external script files that the HTML
    document may import.


    ![image](images/snake.jpg)


    The domain shown here is that of the page located on a web server on the local
    system. If the page was located on your desktop, the **document.referrer** and
    **document.domain** properties would not be set with any values.


    **Address Arrays**


    The DOM document object has child objects of forms, images, links, styleSheets,
    and scripts. Each of these children is an array in which every array element represents
    a document component in the same order they appear within the HTML document. For
    example, the first image in the document body, specified by an HTML <img> tag,
    is represented by document.images[ 0 ]. This means its URL can be referenced using
    document.images[ 0 ].src, which reveals the path assigned to the src attribute
    of the HTML <img> tag. Assigning this component a new URL in a script will dynamically
    replace the old image with a different image.


    ![image](images/pg132_1.jpg)


    The links array represents HTML <a> tags within the HTML document; the styleSheets
    array represents HTML <style> tags; and the scripts array represents HTML <script>
    tags.


    The forms array represents HTML <form> tags but also has its own child elements
    object that is an array of all the form components. For example, the value of
    the first component of the first form in an HTML document can be referenced using
    document.forms[ 0 ].elements[ 0 ].value. Assigning this component a new value
    in a script will dynamically replace the old value.


    ![image](images/1v.jpg)Create an HTML document containing a form and an empty
    list


    **<form>**


    **<img src=”user.png” alt=”User” height=”64” width=”64” >**


    **<input type=”text” name=”topic” size=”30”**


    **value=”Type Your Question Here” >**


    **<input type=”button” value=”Ask a Question” > <br>**


    **<a href=”formhelp.html” style=”margin:5px”>Help?</a>**


    **</form>**


    **<ul id=”list”></ul>**


    ![image](images/htmlv.jpg)


    components.html


    ![image](images/2v.jpg)Now, add a style sheet to style the font and form


    **< style>**


    *** { font : 1em sans-serif ; }**


    **form { width : 500px ; height : 100px ;**


    **background : url(bg.png) ; }**


    **</style>**


    ![image](images/pg132_2.jpg)


    user.png 64px x 64px (gray areas are transparent)


    ![image](images/pg132_3.jpg)


    bg.png 24px x 100px


    ![image](images/3v.jpg)Next, in a script element, create a self-invoking function
    that begins by initializing a variable reference


    **const list = document.getElementById( ‘list’ )**


    ![image](images/snake.jpg)


    Notice the “camelCase” capitalization of the **styleSheets** array.


    ![image](images/4v.jpg)Now, add statements to list components of the document


    **list.innerHTML = ‘<li>No. Forms: ‘ +**


    **document.forms.length**


    **list.innerHTML += ‘<li>No. Links: ‘ +**


    **document.links.length**


    **list.innerHTML += ‘<li>No. Images: ‘ +**


    **document.images.length**


    **list.innerHTML += ‘<li>No. Style Sheets: ‘ +**


    **document.styleSheets.length**


    **list.innerHTML += ‘<li>No. Scripts: ‘ +**


    **document.scripts.length**


    ![image](images/5v.jpg)Finally, add statements to list two attribute values


    **list.innerHTML += ‘<li>First Image URL: ‘ +**


    **document.images[ 0 ].src**


    **list.innerHTML += ‘<li>First Form Element Value: ‘ +**


    **document.forms[ 0 ].elements[ 0 ].value**


    ![image](images/6v.jpg)Save the HTML document, then open it in your browser to
    see components of the document listed


    ![image](images/pg133_1.jpg)


    Notice that images incorporated within a document by style rules are not included
    in the images array, only those that are incorporated by HTML <img> tags – so
    here the form background image (bg.png) does not appear in the images array. Similarly,
    the style rule assigned inline to the style attribute is not included in the styleSheets
    array.


    ![image](images/forget.jpg)


    The array elements only represent the relevant HTML tags.


    **Address Elements**


    ![image](images/pg134_1.jpg)


    Using the component arrays with dot notation to reference a specific element requires
    the script author to count the number of components to calculate each index position.
    This is especially tedious with lengthy documents, is error-prone, and modification
    of the HTML document can change the element’s index position. This was required
    in earlier years but was eventually resolved by the addition of three new methods
    to the document object:


    •The document.getElementById( ) method, used by previous examples in this book
    to add content from JavaScript code, allows any component to be referenced by
    its HTML id attribute value. This method simply specifies the target id value
    as its argument and is used to reference a single specific HTML element.'
