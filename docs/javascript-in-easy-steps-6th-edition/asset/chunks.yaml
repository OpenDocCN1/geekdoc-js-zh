  trans: "\n\n![image](img/forget.jpg)\n\n闭合 `</li>` 标签是可选的，因此在此循环中省略了。\n\n![image](img/hot.jpg)\n\
    \n滚动列表以检查所有的 `window` 属性和方法——这次总共有 204 个项目。对面树状插图中重要的属性在截图中已高亮显示。\n\n### 检查属性\n\
    \n顶层 DOM `window` 对象有一个 `screen` 子对象，该对象提供了描述用户显示器分辨率（以像素为单位）的属性。屏幕尺寸可以在 `window.screen.width`\
    \ 和 `window.screen.height` 属性中找到。\n\n![image](img/pg110_1.jpg)\n\n同样，可用的屏幕尺寸（排除桌面任务栏占据的空间）可以在\
    \ `window.screen.availWidth` 和 `window.screen.availHeight` 属性中找到。\n\n屏幕的色彩能力可以通过\
    \ `window.screen.colorDepth` 属性发现，该属性包含一个位值，描述屏幕可以显示的可能颜色范围：\n\n- **8-bit** –\
    \ 低色（Low Color），只能显示 256 种颜色。\n- **16-bit** – 高色（High Color），可以显示 65,536 种颜色。\n\
    - **24-bit** – 真色（True Color），可以显示数百万种颜色。\n- **32-bit** – 深色（Deep Color），可以显示包含十亿或更多颜色的色域。\n\
    \n现代计算机使用 24 位或 32 位硬件进行色彩显示，而旧的计算机使用 16 位硬件。只有非常旧的计算机和旧手机使用 8 位硬件进行色彩显示。\n\n\
    还有一个 `window.screen.pixelDepth` 属性包含屏幕的像素深度，但在现代计算机上，这个值与 `window.screen.colorDepth`\
    \ 属性的值相同——始终使用 `window.screen.colorDepth` 来发现色彩能力。\n\n某些浏览器现在支持 `window.screen.orientation`\
    \ 对象，它有一个 `type` 属性，描述屏幕当前的方向为横屏或竖屏，以及这是否为屏幕的主次常用方向。\n\n由于 `window` 对象是浏览器脚本环境中的顶层全局对象，在引用其子对象及其属性时可以可选省略它的名称。例如，你可以直接写\
    \ `screen.colorDepth` 来引用 `window.screen.colorDepth` 属性。\n\n![image](img/snake.jpg)\n\
    \n注意这些属性名的“驼峰命名法”（camelCase）大小写。\n\n![image](img/1bl.jpg)创建一个空段落的 HTML 文档\n\n\
    ```html\n<p id=\"props\" style=\"font:1.5em sans-serif\"></p>\n```\n\n![image](img/htmlbl.jpg)\n\
    \nscreen.html\n\n![image](img/2bl.jpg)接下来，在 script 元素中创建一个自执行函数，该函数开始初始化六个变量\n\
    \n```javascript\nconst info = document.getElementById( ‘props’ )\nlet width =\
    \ window.screen.width + ‘px’\nlet height = window.screen.height + ‘px’\nlet availW\
    \ = window.screen.availWidth + ‘px’\nlet availH = window.screen.availHeight +\
    \ ‘px’\nlet colors = ‘Unknown’\n```\n\n![image](img/3bl.jpg)现在，添加一条语句描述色彩能力\n\n\
    ```javascript\nswitch( window.screen.colorDepth )\n{\n  case 8 : colors = ‘Low\
    \ Color’ ; break\n  case 16 : colors = ‘High Color’ ; break\n  case 24 : colors\
    \ = ‘True Color’ ; break\n  case 32 : colors = ‘Deep Color’ ; break\n}\n```\n\n\
    ![image](img/4bl.jpg)然后，添加语句显示屏幕信息\n\n```javascript\ninfo.innerHTML = ‘Screen\
    \ Resolution: ‘ +\nwidth + ‘ x ‘ + height + ‘<br>’\ninfo.innerHTML += ‘Available\
    \ Screen Size: ‘ +\navailW + ‘ x ‘ + availH + ‘<br>’\ninfo.innerHTML += ‘Color\
    \ Capability: ‘ + colors + ‘<br>’\nif( window.screen.orientation )\n{\n  info.innerHTML\
    \ += ‘Orientation: ‘ +\n  window.screen.orientation.type\n}\n```\n\n![image](img/5bl.jpg)保存\
    \ HTML 文档，然后在浏览器中打开它以查看屏幕信息\n\n![image](img/pg111_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n这里的可用高度比屏幕高度少 40 像素，因为桌面任务栏高度为 40 像素。\n\n![image](img/hot.jpg)\n\n`colorDepth`\
    \ 属性可以用于为色彩能力有限的浏览器在文档提供低分辨率图像。\n\n### 显示对话框\n\n顶层 DOM `window` 对象提供了三种方法，JavaScript\
    \ 可以这些方法向用户显示对话消息。可以将简单的警告消息字符串作为 `window.alert()` 方法的参数。它将显示在一个只有一个“确定”按钮的对话框中，点击该按钮仅会关闭对话框。\n\
    \n![image](img/pg112_1.jpg)\n\n更有用的是，可以指定消息作为 `window.confirm()` 方法的参数，请求用户做出决定。它将显示在一个带有“确定”按钮和“取消”按钮的对话框中。按下任何一个按钮都会关闭对话框，但“确定”按钮返回\
    \ `true` 值，而“取消”按钮返回 `false` 值。\n\n还可以指定消息作为 `window.prompt()` 方法的参数，请求用户输入。它将显示在一个带有“确定”按钮、“取消”按钮和一个文本输入字段的对话框中。按下任何一个按钮都会关闭对话框，但“确定”按钮返回文本字段中的值，而“取消”按钮返回\
    \ `null` 值。还可以为 `window.prompt()` 方法提供第二个参数来指定文本字段的默认内容。\n\n![image](img/1bl.jpg)创建一个空段落的\
    \ HTML 文档\n\n```html\n<p id=\"response\" style=\"font:1.5em sans-serif\"></p>\n\
    ```\n\n![image](img/htmlbl.jpg)\n\ndialogs.html\n\n![image](img/2bl.jpg)接下来，在\
    \ script 元素中创建一个自执行函数，该函数开始初始化一个变量引用\n\n```javascript\nconst info = document.getElementById(\
    \ ‘response’ )\n```\n\n![image](img/3bl.jpg)现在，添加一条语句在简单的对话框上显示消息\n\n```javascript\n\
    window.alert( ‘Hello from JavaScript’ )\n```\n\n![image](img/4bl.jpg)然后，添加一条语句用户用户决定并将响应写入段落中\n\
    \n```javascript\ninfo.innerHTML = ‘Confirm: ‘ + window.confirm( ‘Go or Stop?’\
    \ )\n```\n\n![image](img/5bl.jpg)接下来，添加一条语句请求用户输入文本并将文本响应写入段落中\n\n```javascript\n\
    info.innerHTML += ‘<br>Prompt: ‘ + window.prompt( ‘Yes or No?’, ‘Yes’ )\n```\n\
    \n![image](img/6bl.jpg)保存 HTML 文档，然后在浏览器中打开它以查看消息出现在简单的对话框上\n\n![image](img/pg113_1.jpg)\n\
    \n![image](img/7bl.jpg)点击每个对话框上的“确定”按钮以依次关闭它们，然后查看响应出现在段落中\n\n![image](img/pg113_2.jpg)\n\
    \n![image](img/pg113_3.jpg)\n\n![image](img/pg113_4.jpg)\n\n![image](img/hot.jpg)\n\
    \n`confirm` 对话框结合 `if` 语句用于脚本分支——例如，\n\n```javascript\nif( confirm( ‘OK?’ ) )\
    \ { ... } else { ... }\n```\n\n![image](img/forget.jpg)\n\n如果脚本要使用来自 `prompt`\
    \ 对话框的文本输入，良好的做法是去除字符串两端的空格——参见此处。\n\n### 滚动查看\n\nDOM `window` 对象有一个 `scrollBy()`\
    \ 方法，允许窗口在内容向任一方向溢出时进行水平或垂直滚动。该方法需要两个参数来指定沿 X 轴和 Y 轴移动的像素数。\n\n![image](img/pg114_1.jpg)\n\
    \n当内容垂直溢出窗口时，浏览器窗口的右侧会出现一个滚动条。`scrollBy()` 方法将按照其第一个参数指定的像素数进行滚动——直到到达内容的末端。\n\
    \n同样，当内容水平溢出窗口时，浏览器窗口的底部会出现一个滚动条。`scrollBy()` 方法将按照其第二个参数指定的像素数进行滚动——直到到达内容的末端。\n\
    \n"
- fmt: "\nThere is also a `scrollTo()` method that accepts two arguments specifying\
    \ X and Y coordinates that the top-left corner of the window should scroll to\
    \ when content overflows the window horizontally and vertically. This can be used\
    \ to shift away from the default `X=0`, `Y=0` coordinates to a specified alternative\
    \ position. For example, where the browser is displaying data in a tabular spreadsheet\
    \ format, with the first cell of the first row in the top left corner of the browser\
    \ window, the `scrollTo()` method can place a particular cell at the top-left\
    \ corner of the browser window instead.\n\nThe DOM window object has a `scrollX`\
    \ property that stores the number of pixels by which the window is scrolled horizontally.\
    \ This denotes the position of the “thumb” (scroller box) along the scrollbar\
    \ at the bottom of the window, relative to its left corner. The `window.scrollX`\
    \ property is an alias for an older property named `window.pageXOffset` that still\
    \ exists in the DOM, and can be used instead of `window.scrollX` for backward\
    \ compatibility.\n\nSimilarly, there is a `scrollY` property that stores the number\
    \ of pixels by which the window is scrolled vertically. This denotes the position\
    \ of the thumb along the scrollbar at the right of the window, relative to its\
    \ top corner. The `window.scrollY` property is an alias for an older property\
    \ named `window.pageYOffset` that still exists in the DOM, and can be used instead\
    \ of `window.scrollY` for backward compatibility.\n\n![image](images/hot.jpg)\n\
    \nSupply negative values to the `scrollBy()` method to move up and left.\n\n![image](images/snake.jpg)\n\
    \nThe effect of the `scrollby()` method is only apparent when the content overflows\
    \ the window – causing scroll bars to appear.\n\n![image](images/1bl.jpg)Create\
    \ an HTML document with a wide empty paragraph that is inset from the left of\
    \ the window\n\n```html\n<p id=”info\" style=\"width:2000px; margin-left:300px;\
    \ font:1.2em sans-serif\"></p>\n```\n\n![image](images/htmlbl.jpg)\n\nscroll.html\n\
    \n![image](images/2bl.jpg)Next, in a script element, create a self-invoking function\
    \ that begins by initializing two variables\n\n```javascript\nconst info = document.getElementById(\
    \ ‘info’ )\nlet i = 0\n```\n\n![image](images/3bl.jpg)Now, add a loop to write\
    \ a column of 40 numbers into the paragraph\n\n```javascript\nfor( i = 1 ; i <\
    \ 41 ; i++ )\n{\n    info.innerHTML += ( i + ‘<br>’ )\n}\n```\n\n![image](images/4bl.jpg)Then,\
    \ add a statement to scroll the widow 200 pixels horizontally to the right, and\
    \ by the height of the paragraph element vertically downward\n\n```javascript\n\
    window.scrollBy( 200, info.clientHeight )\n```\n\n![image](images/hot.jpg)\n\n\
    Notice the use of the element’s `clientHeight` property here. Elements also have\
    \ a useful `clientWidth` property.\n\n![image](images/5bl.jpg)Finally, add a statement\
    \ to append a confirmation of the current window’s thumb positions\n\n```javascript\n\
    info.innerHTML += ‘scrollX: ‘ + window.scrollX + ‘& scrollY: ‘ + window.scrollY\n\
    ```\n\n![image](images/6bl.jpg)Save the HTML document, then open it in your browser\
    \ to see the window scroll and thumb positions\n\n![image](images/pg115_1.jpg)\n\
    \n## Pop-up Windows\n\n![image](images/pg116_1.jpg)\n\nA new browser window can\
    \ be opened using the window object’s `open()` method. This requires three arguments\
    \ to specify the URL address of the HTML document to be loaded in the new window,\
    \ a name for the new window, and a comma-separated list of features that the window\
    \ should include – from the possible features described in the table below:\n\n\
    | Feature | Description |\n| :--- | :--- |\n| directories | Adds the links bar\
    \ |\n| height | Sets height in pixels of the document area |\n| left | The screen\
    \ X coordinate of the window |\n| location | Adds the address bar |\n| menubar\
    \ | Adds the standard menu bar |\n| resizable | Permits the window to be resized\
    \ |\n| scrollbars | Enables scrollbars when needed |\n| status | Adds the status\
    \ bar |\n| toolbar | Adds the Forward and Back buttons bar |\n| top | The screen\
    \ Y coordinate of the window |\n| width | Sets width in pixels of the document\
    \ area |\n\nWhen successful, the `window.open()` method returns a new window object\
    \ and opens the new “pop-up” window or if it fails, the method simply returns\
    \ null. The returned result should be assigned to a variable that may be subsequently\
    \ tested – if the variable is not null it must then represent the pop-up window\
    \ object. That window may then be closed by calling its `close()` method, or its\
    \ contents printed by calling its `print()` method.\n\nWindows can also be positioned\
    \ by specifying X and Y screen axes coordinates as arguments to a window.moveTo()`\
    \ method. There is also a similar `window.moveBy()` method that accepts two arguments\
    \ to specify how many pixels along the X and Y axes the window should be shifted\
    \ from its current screen position.\n\n![image](images/forget.jpg)\n\nBrowser\
    \ makers have added Pop-up Blockers due to the annoying proliferation of pop-up\
    \ windows – so the use of pop-ups is no longer recommended, but they are demonstrated\
    \ here for completeness.\n\n![image](images/1bl.jpg)Create an HTML document containing\
    \ a heading\n\n```html\n<h1>Pop-up Window</h1>\n```\n\n![image](images/htmlbl.jpg)popup.html\n\
    \n![image](images/2bl.jpg)Create a second document containing a heading\n\n```html\n\
    <h1>Main Window</h1>\n```\n\n![image](images/3bl.jpg)opener.html\n\n![image](images/4bl.jpg)Next,\
    \ in a script element in the second document add\n\n```javascript\nconst popWin\
    \ = window.open( ‘popup.html’, ‘Popup’, ‘top=150,left=100,width=350,height=100’\
    \ )\n```\n\n![image](images/5bl.jpg)Save both HTML documents, then open it in\
    \ your browser to see the pop-up is blocked\n\n![image](images/pg117_1.jpg)\n\n\
    ![image](6.jpg)Open the browser’s Pop-up Blocker dialog and choose to allow pop-ups\
    \ from this page\n\n![image](images/pg117_2.jpg)\n\n![image](images/6bl.jpg)Now,\
    \ refresh the browser window to see the pop-up appear\n\n![image](images/pg117_3.jpg)\n\
    \n![image](images/snake.jpg)\n\nDo not put any spaces in the features list as\
    \ it may cause the `window.open()` method to fail.\n\n![image](images/hot.jpg)\n\
    \nNotice that the pop-up window does not display the specified “favicon” on its\
    \ title bar.\n\n## Make Timers\n\nThe JavaScript window object has an interesting\
    \ `setTimeout()` method that can repeatedly evaluate an expression after a specified\
    \ period of time. Where the specified expression calls the `setTimeout()` statement\
    \ appears, a recursive loop is created – in which the function is repeatedly executed\
    \ after the specified period of time.\n\n![image](images/pg118_1.jpg)\n\nThe expression\
    \ to be evaluated by the `setTimeout()` method must be specified as its first\
    \ argument, and the period of time must be a number specified as its second argument.\
    \ The time is expressed in milliseconds, where 1000 represents one second.\n\n\
    The `setTimeout()` method returns a numeric value that can be assigned to a variable\
    \ to uniquely identify the waiting process. This value can be specified as the\
    \ argument to the window object’s `clearTimeout()` method to terminate the timer\
    \ loop at some point.\n\nThe window object also has `setInterval()` and `clearInterval()`\
    \ methods that take the same arguments and work in a similar way. The difference\
    \ is that the time specified to `setInterval()` specifies the interval at which\
    \ point the expression is to be evaluated, irrespective of how long it takes to\
    \ execute. Conversely, the time specified to the `setTimeout()` method specifies\
    \ the period of time between the end of one execution until the start of the next\
    \ execution. This means that it is possible for `setInterval()` to attempt overlapping\
    \ executions where the interval is short and the time taken to execute the expression\
    \ is lengthy. For this reason it is generally preferable to use the `setTimeout()`\
    \ method.\n\n![image](images/1bl.jpg)Create an HTML document with an empty paragraph\n\
    \n```html\n<p id=”info\"></p>\n```\n\n![image](images/htmlbl.jpg)\n\ntimer.html\n"
