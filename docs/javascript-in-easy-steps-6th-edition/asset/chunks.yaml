  trans: "\n\n![image](img/3p.jpg)现在，插入语句输出 `Date` 节点的内容和本地格式化的日期字符串\n\n```javascript\n\
    console.log( ‘Date Object: ‘ + jsDate )\nconsole.log( ‘Locale Date String: ‘ +\
    \ jsDate.toLocaleString( ) )\n```\n\n![image](img/4p.jpg)然后，插入语句输出原始类型字面量数值值和本地格式化的数字字符串\n\
    \n```javascript\nconsole.log( ‘\\nPrimitive Number: ‘ + jsNumber )\nconsole.log(\
    \ ‘Locale Number String: ‘ + jsNumber.toLocaleString( ) )\n```\n\n![image](img/5p.jpg)保存\
    \ HTML 文档，然后在浏览器中打开它并启动控制台查看输出字符串\n\n![image](img/pg69_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n`Math` 对象是唯一一个不提供构造方法的 JavaScript 对象。\n\n## 创建数组\n\n`Array` 对象是 JavaScript 的内置对象，可以在单独的“元素”中存储多个项目（各种数据类型）。数组通过给变量赋值\
    \ `[]` 方括号来创建，方括号内可以包含由逗号分隔的值列表，用于初始化数组元素。其语法如下：\n\n![image](img/pg70_1.jpg)\n\
    \n```javascript\nlet arrayName = [ value1 , value2 , value3 ]\n```\n\n与自定义对象不同（对象的每个属性都有名称），数组元素是自动编号的——从零开始。因此，第一个元素是\
    \ 0，第二个是 1，第三个是 2，以此此类推。这种编号系统通常被称为“基于零的索引”。\n\n存储在数组元素中的值可以通过在对象名后加上方括号并包含其元素索引数字来引用。例如，`colors[\
    \ 0 ]` 将引用名为“colors”的数组中第一个元素的值。\n\n当数组元素不需要立即初始化时，可以创建一个空数组稍后将值赋值给其元素，如下：\n\n\
    ```javascript\nlet colors = [ ]\ncolors[ 0 ] = ‘Red’\ncolors[ 1 ] = ‘Green’\n\
    colors[ 2 ] = ‘Blue’\n```\n\n虽然 `Array` 对象提供了 `Array()` 构造函数，但不应使用它，因为它可能会产生意想不到的结果——例如，创建一个初始化了第一个元素的数组，如下：\n\
    \n```javascript\nlet jsArray = new Array( 10 )\n```\n\n你可能会合理地预期 `jsArray[ 0 ]`\
    \ 引用第一个元素中的整数值 10，但它实际上返回一个 `undefined` 值。这是怎么了？这是一个只在你向构造方法指定单个整数参数时才会发生的异常——这会导致\
    \ JavaScript 创建一个包含 10 个空元素的数组！使用 `jsArray = [ 10 ]` 创建数组则没有该效果，并会如预期创建一个第一个元素包含整数值\
    \ 10 的数组。\n\n![image](img/forget.jpg)\n\n所有内置对象的名称以大写字母开头——因此构造函数的名称是“Array”，而不是“array”。\n\
    \n![image](img/1p.jpg)创建一个带有自执行函数的 HTML 文档，该函数首先创建一个数组——用错误的方法\n\n```javascript\n\
    let jsArray = new Array( 10 )\n```\n\n![image](img/htmlp.jpg)\n\narray.html\n\n\
    ![image](img/2p.jpg)接下来，添加语句输出第一个数组元素的值并列出整个数组\n\n```javascript\nconsole.log(\
    \ jsArray[ 0 ] )\nconsole.log( jsArray )\n```\n\n![image](img/3p.jpg)现在，添加语句声明一个变量，并声明一个初始化数组的变量\n\
    \n```javascript\nlet month, summer = [ ‘June‘, ‘July‘, ‘August‘ ]\n```\n\n![image](img/4p.jpg)然后，添加一个循环输出每个数组元素的索引号和值\n\
    \n```javascript\nfor ( month in summer )\n{\n  if ( month !== ‘ ‘ )\n  {\n   \
    \ console.log( month + ‘: ‘ + summer[ month ] )\n  }\n}\n```\n\n![image](img/5p.jpg)最后添加语句输出第一个数组元素的值并列出整个数组\n\
    \n```javascript\nconsole.log( ‘Start of Summer: ‘ + summer[ 0 ] )\nconsole.log(\
    \ summer )\n```\n\n![image](img/6p.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看数组元素的内容\n\n\
    ![image](img/pg71_1.jpg)\n\n![image](img/hot.jpg)\n\n将 `for in` 循环的主体封装在 `if`\
    \ 语句中是一个良好的习惯——在这里，它确保了元素不是空的。\n\n## 循环元素\n\n数组和循环是绝佳拍档！任何类型的循环都可以用于向元素填充值。即使是非常巨大的数组，也可以通过这种方式“填充”——而且代码少得惊人。\n\
    \n![image](img/pg72_1.jpg)\n\n同样，循环可以快速读取每个数组元素的值，并在循环的每次迭代中对该值执行适当的操作。\n\n有用的是，每个数组都有一个\
    \ `length` 属性，其中包含该数组元素总数的整数记录。由于基于零的索引，此值始终比最后一个元素的索引号大一，因此可以随时用于条件测试以终止循环。\n\
    \n![image](img/1p.jpg)创建一个带有自执行函数的 HTML 文档，该函数首先声明三个变量\n\n```javascript\nlet i,\
    \ result, boolArray = [ ]\n```\n\n![image](img/htmlp.jpg)\n\nelements.html\n\n\
    ![image](img/2p.jpg)接下来，输出一个简单的标题\n\n```javascript\nconsole.log( ‘Fill Elements...’\
    \ )\n```\n\n![image](img/3p.jpg)现在，添加一个循环用布尔值填充 10 个元素，并输出它们的索引号和每个存储的值\n\n```javascript\n\
    for( i = 1 ; i < 11 ; i++ )\n{\n  boolArray[ i ] = ( i % 2 === 0 ) ? true : false\n\
    \  console.log( ‘Element ‘ + i + ‘: ‘ + boolArray[ i ] )\n}\n```\n\n![image](img/4p.jpg)然后，输出第二个简单的标题并用空字符串值初始化变量\n\
    \n```javascript\nconsole.log( ‘Read Elements...’ )\nresult = ‘’\n```\n\n![image](img/5p.jpg)接下来，添加一个循环将任何包含\
    \ true 值的元素的索引号赋值给字符串\n\n```javascript\nfor( i = 1 ; i < boolArray.length ; i++\
    \ )\n{\n  if( boolArray[ i ] ) { result += i + ‘ | ‘ }\n}\n```\n\n![image](img/hot.jpg)\n\
    \n这里的数组 `length` 属性值为 11，因为数组有十一个元素——尽管元素 0 还没有填充。\n\n![image](img/6p.jpg)现在，输出字符串以显示包含\
    \ true 值的元素的索引号\n\n```javascript\nconsole.log( ‘True in Elements: ‘ + result )\n\
    ```\n\n![image](img/7p.jpg)重置字符串变量包含一个空字符串\n\n```\nresult = ‘‘\n```\n\n![image](img/8p.jpg)然后，添加一个循环将任何包含\
    \ false 值的元素的索引号赋值给字符串\n\n```javascript\nfor( i = 1 ; i < boolArray.length ; i++\
    \ )\n{\n  if( !boolArray[ i ] ) { result += i + ‘ | ‘ }\n}\n```\n\n![image](img/9p.jpg)最后，输出字符串以显示包含\
    \ false 值的元素的索引号\n\n```javascript\nconsole.log( ‘False in Elements: ‘ + result\
    \ )\n```\n\n![image](img/10p.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台写入和读取元素\n\n![image](img/pg73_1.jpg)\n\
    \n![image](img/forget.jpg)\n\n布尔值的条件测试不需要包含 `=== true`，因为那是自动的。\n\n## 切割数组\n\n\
    JavaScript 对象具有属性和方法。除了 `length` 属性外，每个数组对象都有用于操作数组元素的方法。它们列在下表中，并附带有它们执行任务的简短描述：\n\
    \n![image](img/pg74_1.jpg)\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `join( *separator*\
    \ )` | 将所有元素值合并由指定分隔符分隔的字符串，如果没有指定分隔符则用逗号分隔 |\n| `pop()` | 删除数组的最后一个元素并返回其值 |\n\
    | `push( *value , value* )` | 在数组末尾添加元素并返回新长度 |\n| `reverse()` 反转数组中所有元素的顺序并返回每个元素的重排序后的值\
    \ |\n| `shift()` | 删除数组的第一个元素并返回其值 |\n\n"
- fmt: "\n| `slice( *begin , end* )` | Returns elements between specified index positions,\
    \ or the end of the array if no end position is specified |\n| `sort( )` | Sorts\
    \ all elements in the array into alphabetical or numerical order and returns the\
    \ reordered value of each element |\n| `splice( *position , number, value, value*\
    \ )` | Replaces a specified number of element values starting at a specified index\
    \ position, and returns the replaced values |\n| `unshift( *value , value* )`\
    \ | Adds elements to the start of the array and returns the new length |\n\nWhere\
    \ no values are specified by the `push( ) or `unshift()` methods, a single empty\
    \ element gets added to the array. A comma separated list of values can be specified\
    \ to the `push()`, `unshift()`, and `splice()` methods to change multiple elements.\n\
    \n![image](images/hot.jpg)\n\nThe `join( )` method is faster for uniting a large\
    \ number of element values into a single string, but the `+` concatenate operator\
    \ is faster at uniting just a few element values.\n\n![image](images/snake.jpg)\n\
    \nThe `slice( )` method returns the element values up to, but not including, the\
    \ optional end index position.\n\n![image](images/1p.jpg)Create an HTML document\
    \ with a self-invoking function that begins by creating an array\n\n```\nlet seasons\
    \ = [ ‘Spring’, ‘Summer’, ‘Fall’, ‘Winter’ ]\nconsole.log( ‘Elements: ‘ + seasons\
    \ )\n```\n\n![image](images/htmlp.jpg)\n\nslice.html\n\n![image](images/2p.jpg)Next,\
    \ output a modified list of the elements\n\n```\nconsole.log( ‘Joined: ‘ + seasons.join(\
    \ ‘ & ‘ ) )\n```\n\n![image](images/3p.jpg)Now, extract the final element from\
    \ the array\n\n```\nconsole.log( ‘Popped: ‘ + seasons.pop( ) )\nconsole.log( ‘Elements:\
    \ ‘ + seasons )\n```\n\n![image](images/4p.jpg)Then, put the final element back\
    \ on the array\n\n```javascript\nconsole.log( ‘Pushed: ‘ + seasons.push( ‘Winter’\
    \ ) )\nconsole.log( ‘Elements: ‘ + seasons )\n```\n\n![image](images/5p.jpg)Next,\
    \ output just two element values\n\n```javascript\nconsole.log( ‘Sliced: ‘ + seasons.slice(\
    \ 1, 3 ) )\n```\n\n![image](images/6p.jpg)Finally, replace the value in the third\
    \ element\n\n```javascript\nconsole.log( ‘Spliced: ‘ + seasons.splice( 2, 1, ‘Autumn’\
    \ ) )\nconsole.log( ‘Elements: ‘ + seasons )\n```\n\n![image](images/7p.jpg)Save\
    \ the HTML document, then open it in your browser and launch the console to see\
    \ the elements manipulated\n\n![image](images/pg75_1.jpg)\n\n![image](images/hot.jpg)\n\
    \nUse the `slice( )` method without a replacement value to delete a specified\
    \ number of elements at a specified position and it will automatically renumber\
    \ all remaining elements that follow in that array.\n\n![image](images/forget.jpg)\n\
    \nThe `shift( )` and the `unshift()` methods work like `pop( )` and `push( )`\
    \ but on the first element rather than the last. The `reverse( )` and `sort( )`\
    \ methods are used in the next example listed [here](#chapter04.xhtml_sec36).\n\
    \n## Sort Elements\n\nIt is often desirable to arrange an array’s element values\
    \ in a particular order using the array `sort( )` method. This can optionally\
    \ specify a comparison function argument to define the sort order.\n\nWhen no\
    \ comparison function is specified, the `sort( )` method will, by default, convert\
    \ all element values to strings then sort them lexicographically in dictionary\
    \ order – comparing each first character, then each second character, and so on.\
    \ Where the elements contain matching strings that differ only by character case,\
    \ the string with most uppercase characters gets a lower index position – appearing\
    \ before that with fewer uppercase characters.\n\nThe `sort( )` method’s default\
    \ behavior of sorting into dictionary order is usually satisfactory for string\
    \ values but is often not what you want when sorting numerical values. For example,\
    \ in sorting three values 30, 100, 20, the result is 100, 20, 30 – because the\
    \ first characters are different they are sorted by that comparison only. Typically,\
    \ it is preferable to require all numerical element values to be sorted in ascending,\
    \ or descending, numerical order so the `sort( )` method needs to specify the\
    \ name of a custom comparison function to define the sort order.\n\nA comparison\
    \ function nominated by the `sort( )` method will be passed successive pairs of\
    \ element values for comparison, and it must return an integer value to indicate\
    \ each comparison’s result. When the first value is greater than the second it\
    \ should return a value greater than zero to indicate that the first value should\
    \ be sorted to a higher index position – to appear after the second value. Conversely,\
    \ the comparison function should return a value less than zero to indicate that\
    \ the first value should be sorted to a lower index position – to appear before\
    \ the second value. When both values are identical, zero should be returned to\
    \ indicate that the element positions should remain unchanged. When all comparisons\
    \ have been made, the elements will be arranged in ascending value order. If descending\
    \ order is required, the array’s `reverse( )` method can then be used to reverse\
    \ the element order.\n\nIf a comparison function is comparing numerical element\
    \ values it simply needs to return the result of subtracting the second passed\
    \ value from the first passed value to have the desired effect.\n\n![image](images/forget.jpg)\n\
    \nRemember that `sort( )` does actually rearrange the values stored in the array\
    \ elements.\n\n![image](images/hot.jpg)\n\nThe default behavior of the `sort(\
    \ )` method is the equivalent of a comparison function comparing arguments `x`\
    \ and `y` with these statements:\n\n```javascript\nif( x > y ) return 1 else if(\
    \ x < y ) return -1 else return 0\n```\n\n![image](images/1p.jpg)Create an HTML\
    \ document with a self-invoking function that begins by creating two arrays\n\n\
    ```javascript\nlet hues = [ ‘Red’, ‘RED’, ‘red’, ‘Green’, ‘Blue’ ]\nlet nums =\
    \ [ 1, 20, 3, 17, 14, 0.5 ]\n```\n\n![image](images/htmlp.jpg)\n\nsort.html\n\n\
    ![image](images/2p.jpg)Next, output the values in each array, and output their\
    \ element values sorted in dictionary sort order\n\n```javascript\nconsole.log(\
    \ ‘Colors: ‘ + hues )\nconsole.log( ‘Dictionary Sort: ‘ + hues.sort( ) )\nconsole.log(\
    \ ‘\\nNumbers: ‘ + nums )\nconsole.log( ‘Dictionary Sort: ‘ + nums.sort( ) )\n\
    ```\n\n![image](images/3p.jpg)Now, add a statement to output the numerical values\
    \ sorted after calling a function\n\n```javascript\nconsole.log( ‘Numerical Sort:\
    \ ‘ + nums.sort( sortNums ) )\n```\n\n![image](images/4p.jpg)Finally, in the function\
    \ block, add a statement to output the numerical values in descending order\n\n\
    ```javascript\nconsole.log( ‘Reversed Sort: ‘ + nums.reverse( ) )\n```\n\n![image](images/5p.jpg)Next,\
    \ in the script, add the comparison function\n\n```javascript\nfunction sortNums(\
    \ numOne, numTwo ) {\n  return numOne - numTwo\n}\n```\n\n![image](images/6p.jpg)Save\
    \ the HTML document, then open it in your browser and launch the console to see\
    \ the elements sorted\n\n![image](images/pg77_1.jpg)\n\n![image](images/snake.jpg)\n\
    \nWhen the `sort( )` method specifies a comparison function it must nominate it\
    \ by function name only – do not include trailing brackets after the comparison\
    \ function name in the argument to the `sort( )` method.\n\n## Get Dates\n\nThe\
    \ built-in JavaScript Date object provides components representing a particular\
    \ date, time, and timezone. An instance of a Date object is created using the\
    \ new keyword, `Date( )` object constructor, and a variable name assignment. Without\
    \ specifying any arguments to the constructor, a new Date object represents the\
    \ date and time of its creation based upon the system time of the computer on\
    \ which the browser is running. There is no consideration given to whether system\
    \ time is accurate to the Universal Time Clock (UTC) or Greenwich Mean Time (GMT).\n\
    \n![image](images/pg78_1.jpg)\n"
  raw: '| **slice( *begin , end* )** | Returns elements between specified index positions,
    or the end of the array if no end position is specified |


    | **sort( )** | Sorts all elements in the array into alphabetical or numerical
    order and returns the reordered value of each element |


    | **splice( *position , number, value, value* )** | Replaces a specified number
    of element values starting at a specified index position, and returns the replaced
    values |


    | **unshift( *value , value* )** | Adds elements to the start of the array and
    returns the new length |


    Where no values are specified by the push( ) or unshift( ) methods, a single empty
    element gets added to the array. A comma separated list of values can be specified
    to the push( ), unshift( ), and splice( ) methods to change multiple elements.


    ![image](images/hot.jpg)


    The **join( )** method is faster for uniting a large number of element values
    into a single string, but the **+** concatenate operator is faster at uniting
    just a few element values.


