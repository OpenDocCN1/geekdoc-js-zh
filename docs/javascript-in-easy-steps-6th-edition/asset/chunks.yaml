    \n## 鼠标事件\n\n当用户点击 HTML 文档中的特定对象时执行的事件处理器函数，可以通过将函数名赋值给该对象的 `onclick` 和 `ondblclick`\
    \ 属性来指定。这些处理器响应于：当用户点击一次鼠标按钮时触发的“click”事件，以及当快速连续按下两次鼠标按钮时触发的“dblclick”事件。\n\n\
    ![image](img/pg142_1.jpg)\n\n此外，对象的 `onmousedown` 和 `onmouseup` 属性可以指定事件处理器函数，在鼠标按钮被按下时执行（触发“mousedown”事件），以及在释放时执行（触发“mouseup”事件）。\n\
    \n同样，对象的 `onmouseover` 和 `onmouseout` 属性可以指定事件处理器函数，在鼠标悬停在元素上时执行（触发“mouseover”事件），以及在移离开元素时执行（触发“mouseout”事件）。这些通常用于创建悬停效果，例如将该元素的\
    \ `style.background` 属性值更改为不同的颜色。\n\n或者，可以将事件名称和事件处理器函数名作为该对象的 `addEventListener(\
    \ )` 方法的参数。这可以像上一个示例中 window 对象的 `addEventListener( )` 方法一样使用，通过名称指定函数，或者你可以在第二个参数中内联编写函数定义。\n\
    \n当事件发生时，可以将事件对象传递给内联事件处理器函数。它有一个 `type` 属性，用于识别该事件的名称。\n\n![image](img/1v.jpg)创建一个包含两个段落和一个按钮的\
