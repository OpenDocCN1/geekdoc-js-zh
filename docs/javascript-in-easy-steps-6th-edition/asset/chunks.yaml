    # Loop For


    A loop is a structure containing a test condition and one or more statements that
    are repeatedly executed while the test condition is met. Each single examination
    of the condition and execution of the statements is called an “iteration”. When
    the test condition is not met, no further iterations are made and flow continues
    at the next statement following the loop structure.


    ![image](images/pg52_1.jpg)


    Perhaps the most commonly used loop structure in JavaScript is the `for` loop,
    which has this syntax:


    `for ( *initializer ; condition ; modifier ) { *statements-to-be-executed }`


    The parentheses after the `for` keyword contain three expressions that control
    the number of iterations the loop will perform:


    - `Initializer` – a statement that specifies the initial value of a variable that
    will be used to count the number of loop iterations. Traditionally, this trivial
    counter variable is simply named “i”.

    - `Condition` – an expression that is tested for a Boolean true value on each
    iteration. When the evaluation returns true, the loop statements are then executed
    to complete that iteration. If the evaluation returns false, the statements are
    not executed and the loop ends. Typically, the condition examines the value of
    the loop counter variable.

    - `Modifier` – a statement that modifies a value in the test condition so that
    at some point its evaluation will return false. Typically, this will increment,
    or decrement, the loop counter variable.


    For example, a `for` loop structure to execute a set of statements one hundred
    times might look like this:


    ```javascript

    let i

    for ( i = 0 ; i < 100 ; i++ ) { statements-to-be-executed }

    ```


    In this case, the counter variable is incremented on each iteration until its
    value reaches 100, upon which the evaluation returns false and the loop ends.


    ![image](images/snake.jpg)


    Unless the modifier enables the evaluation to return false at some point, an infinite
    loop is created that will run forever.


    ![image](images/1g.jpg)Create an HTML document with a self-invoking function that
    begins by initializing a loop counter variable


    ```javascript

    let i = 0

    ```


    ![image](images/htmlg.jpg)


    for.html


    ![image](images/2g.jpg)Next, insert a for loop structure that will make 10 iterations
    and output the value of the loop counter on each iteration


    ```javascript

    for( i = 1 ; i < 11 ; i++ )

    {

    console.log( ‘Iteration Number: ‘ + i )

    }

    ```


    ![image](images/3g.jpg)Save the HTML document, then open it in your browser and
    launch the console to see the loop iterations


    ![image](images/pg53_1.jpg)


    ![image](images/hot.jpg)


    This is the regular `for` loop. There is also a special `for in` loop that is
    used to iterate through properties of an object and is demonstrated later, [here](#chapter04.xhtml_sec31).


    # Loop While


    The `for` loop structure, described [here](#chapter03.xhtml_sec24), is ideal when
    the number of required iterations is a known quantity, but when this is unknown
    a `while` loop structure is often preferable. The syntax of a `while` loop looks
    like this:


    ```javascript

    while( *condition )

    {

    *statements-to-be-executed*

    *modifier*

    }

    ```


    ![image](images/pg54_1.jpg)


    The parentheses after the `while` keyword contain a condition that is evaluated
    for a Boolean value upon each iteration. Statements to be executed on each iteration
    are enclosed within braces along with a statement that modifies a value in the
    test condition, so that at some point its evaluation will return false and the
    loop will exit. While the evaluation remains true, the statements will be executed
    on each iteration of the loop.


    Where the condition evaluation is false on the first iteration, the loop exits
    immediately so the statements within its braces are never executed. Both `while`
    loops and `for` loops are sometimes referred to as “pre-test” loops because their
    test condition is evaluated before any statements are executed.


    A `while` loop can be made to perform a specific number of iterations, like a
    `for` loop, by using a counter variable as the test condition and incrementing
    its value on each iteration. For example, a `while` loop structure to execute
    a set of statements 100 times might look like this:


    ```javascript

    let i = 0

    while ( i < 100 )

    {

    statements-to-be-executed

    i++ ;

    }

    ```


    The counter variable is incremented on each iteration until its value reaches
    100, upon which the evaluation returns `false` and the loop ends.


    ![image](images/snake.jpg)


    Omitting a modifier from the `while` loop structure will create an infinite loop
    that will run forever.


    ![image](images/1g.jpg)Create an HTML document with a self-invoking function that
    begins by initializing a loop counter variable


    ```javascript

    let i = 10

    ```


    ![image](images/htmlg.jpg)


    while.html


    ![image](images/2g.jpg)Next, insert a while loop structure that will make iterations
    and output the value of the loop counter on each iteration until it reaches zero


    ```javascript

    while( i > -1 )

    {

    console.log( ‘Countdown Number: ‘ + i )

    i--

    }

    ```


    ![image](images/3g.jpg)Save the HTML document, then open it in your browser and
    launch the console to see the loop iterations


    ![image](images/pg55_1.jpg)


    ![image](images/hot.jpg)


    Each `while` loop must have braces as they contain at least two statements – one
    statement to execute and a modifier.


    # Do Loops


    Another kind of loop available in JavaScript is the `do while` loop structure.
    This is like an inverted version of the `while` loop, described [here](#chapter03.xhtml_sec25),
    and is ideal when the statements it will execute on each iteration absolutely
    must be executed at least one time. Its syntax looks like this:


    ```javascript

    do

    {

    statements-to-be-executed

    modifier

    }

    while *( condition )

    ```


    ![image](images/pg54_1.jpg)


    The parentheses after the `while` keyword contain a condition that is evaluated
    for a Boolean value after each iteration. Statements to be executed on each iteration
    are enclosed within braces along with a statement that modifies a value in the
    test condition, so that at some point its evaluation will return false and the
    loop will exit. While the evaluation remains true, the statements will be executed
    on each iteration of the loop.


    Where the condition evaluation is false on the first iteration, the loop exits
    immediately so the statements within its braces have been executed once. The `do
    while` loop is sometimes referred to as a “post-test” loop because the test condition
    is evaluated after its statements have been executed.


    A `do while` loop can be made to perform a specific number of iterations, like
    a `for` loop, by using a counter variable as the test condition and incrementing
    its value on each iteration. For example, a `do while` loop structure to execute
    a set of statements 100 times might look like this:


    ```javascript

    let i = 0

    do

    {

    statements-to-be-executed

    i++

    }

    while ( i < 100 )

    ```


    The counter variable is incremented on each iteration until its value reaches
    100, upon which the evaluation returns false and the loop ends.


    ![image](images/hot.jpg)


    Only use a `do while` loop if the statements absolutely must be executed at least
    once.


    ![image](images/1g.jpg)Create an HTML document with a self-invoking function that
    begins by initializing a loop counter variable


    ```javascript

    let i = 2

    ```


    ![image](images/htmlg.jpg)


    do.html


    ![image](images/2g.jpg)Next, insert a do while loop structure that will make iterations
    and output the value of the loop counter on each iteration until it exceeds 1000


    ```javascript

    do

    {

    i *= 2

    console.log( ‘Multiplied Number: ‘ + i )

    }

    while( i < 1000 )

    ```


    ![image](images/3g.jpg)Save the HTML document, then open it in your browser and
    launch the console to see the loop iterations


    ![image](images/pg57_1.jpg)


    ![image](images/forget.jpg)


    Notice that the final value exceeds the condition limit because it gets written
    in output before the test is made.


