  trans: "\n仔细观察可以发现，赋值的函数除了普通的局部（脚本）作用域和外部（全局）作用域外还有一个特殊的（闭包）作用域。这就是为什么 `count` 变量可以通过赋值函数访问，但重要的是，它无法通过任何其他方式被引用。\n\
    \n使用闭包来从脚本的其他部分隐藏持久变量是一个重要概念。这类似于在其他编程语言中隐藏“私有”变量，并仅通过“getter”方法访问。\n\n![image](img/hot.jpg)\n\
    \n所有的 JavaScript 对象都从 `prototype` 继承属性和方法。标准的 JavaScript 对象（如函数）会调用内部构造函数，通过定义其组件来创建对象。\n\
    \n![image](img/hot.jpg)\n\n如果你不能立即理解闭包的工作原理，不要担心。它们起初看起来可能神秘，但随着经验的增加会变得清晰。你可以继续后续稍后再回来这项技术。\n\
    \n## 总结\n\n- JavaScript 代码可以直接包含在 HTML 文档中，也可以使用 `<script> </script>` 标签从外部文件引入。\n\
    - JavaScript 可以在 HTML 元素的警报对话框或浏览器的控制台窗口显示输出。\n- JavaScript 语句可以包含关键字、运算符、值和表达式。\n\
    - JavaScript 解释器忽略制表符和空格。\n- JavaScript 语句可以分组在 `{ }` 大括号函数块中，可以在需要时调用执行。\n- 变量和函数名可以由字母、数字和下划线字符组成，但必须避免关键字。\n\
    - JavaScript 变量可以包含 String、Number、Boolean、Object、Function、Symbol、`null` 和 `undefined`\
    \ 数据类型。\n- 使用 `let` 关键字声明的变量可以重新赋值新值，但 `const` 关键字不允许此操作。\n- 函数表达式具有分组在 `{ }`\
    \ 大括号中的语句用于执行，并返回最终的单一值。\n- 函数表达式的 `( )` 括号可以包含参数，用于从调用者传递参数值。\n- 函数块可以包含一个 `return`\
    \ 语句，用于指定传递给调用者的数据。\n- JavaScript 的 `( )` 运算符调用函数。\n- 提升允许函数调用出现在函数声明之前的脚本中。\n\
    - 匿名函数表达式没有函数名。\n- 词法作用域是变量创建的环境，可以是全局、局部的或闭包。\n- 局部变量应用于存储值，但全局变量可以分配函数以创建闭包。\n\
    - 闭包嵌套在外部函数内部的函数，它保留了对外部函数中声明变量的访问。\n\n## 2 执行常用操作\n\n*本章描述了 JavaScript 运算符并演示了如何在你的脚本中使用它们。*\n\
    \n- 转换值\n- 进行算术运算\n- 赋值值\n- 进行比较\n- 评估逻辑\n- 检查条件\n- 处理位运算\n- 强制排序\n- 总结\n\n##\
    \ 转换值\n\n在 JavaScript 中执行操作之前，识别你正在处理的值的数据类型是重要的，以避免出现意外的结果。例如，值 42 是数字，但值 ‘42’\
    \ 是字符串，因此尝试执行 `‘42’ + 8` 加法将返回字符串结果 `‘428’，而不是数字 50。幸运的是，JavaScript 提供了多种方法返回其他数据类型的值的版本，而不改变值的原始数据类型。\n\
    \n![image](img/pg28_1.jpg)\n\n### 字符串转数字\n\nJavaScript 内置函数 `parseInt()` 可以返回括号内指定字符串的整数版本（在数字数据类型中）。例如，`parseInt(\
    \ ‘42’ )` 将返回数字 42，因此 `42 + 8` 将返回数字结果 50。\n\n同样，JavaScript 内置函数 `parseFloat()`\
    \ 可以返回括号内指定字符串的浮点数版本（在数字数据类型中）。\n\n这两个方法都允许字母跟在指定字符串的数字部分之后，并将其从结果中剔除——例如，`parseInt(\
    \ ‘42nd Street’ )` 返回数字 42。\n\n如果这两个函数任一无法在指定字符串的开头找到数值，结果将是 `NaN` —— 这是一个 JavaScript\
    \ 属性，意味着“不是数字”（Not a Number）。你也可以通过在 JavaScript 内置函数 `isNaN()` 的括号内指定值来检查一个值是否不是数字。这同样会首先尝试在指定值的开头寻找数字，如果找到了数字（即使来自指定的字符串），则返回\
    \ false，否则如果找不到数字，将返回 true。\n\n![image](img/hot.jpg)\n\n数据类型的转换被称为“强制类型转换”（coercion），它可以是显式的也可以是隐式的。`‘42’\
    \ + 8` 返回字符串 `‘428’` 是隐式转换。而 `String( 42 )` 返回字符串 `‘42’` 是显式转换。\n\n### 数字转字符串\n\
    \nJavaScript 的 `String()` 方法可以返回括号内指定数字的字符串表示（在字符串数据类型中）——例如，`String( 42 )` 将返回字符串数据类型的数字\
    \ `’42’`。\n\n或者，你可以在变量名后附加 `toString()` 方法调用，以返回存储的数字数据类型的字符串表示。例如，当一个名为“num”的变量被赋值数字时，`num.toString()`\
    \ 将返回该存储数字的字符串版本。\n\n![image](img/1r.jpg)\n创建一个带有自执行匿名函数块的 HTML 文档，其中声明了三个变量\n\
    \n```javascript\n( function ( ) {\n  let sum, net = ‘25’, tax = 5.00\n  // 在此处插入语句。\n\
    } ) ( )\n```\n\n![image](img/htmlr.jpg)\nconversion.html\n\n![image](img/2r.jpg)\n\
    接下来，插入创建不同数据类型版本的语句并在输出字符串中打印结果\n\n```javascript\nsum = net + tax\nconsole.log(\
    \ ‘sum: ‘ + sum + ‘ ‘ + typeof sum )\nsum = parseFloat( net ) + tax\nconsole.log(\
    \ ‘sum: ‘ + sum + ‘ ‘ + typeof sum )\nconsole.log( ‘tax: ‘ + tax + ‘ ‘ + typeof\
    \ sum )\ntax = tax.toString( )\nconsole.log( ‘tax: ‘ + tax + ‘ ‘ + typeof tax\
    \ )\nnet = ‘$’ + net\nconsole.log( ‘net: ‘ + net + ‘ ‘ + parseInt( net ) )\nconsole.log(\
    \ ‘net Not a Number? ‘ + isNaN( net ) )\n```\n\n![image](img/3r.jpg)\n保存 HTML\
    \ 文档，然后在浏览器中打开它并启动控制台以查看不同的版本\n\n![image](img/pg29_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n如果你在向字符串添加 ‘$’ 前缀之前尝试 `isNaN( net )`，结果为 **false** —— 因为该方法在 `‘25’` 字符串的开头找到了数字。\n\
    \n## 进行算术运算\n\nJavaScript 中常用的算术运算符列在下表中，以及它们执行的操作：\n\n![image](img/pg30_1.jpg)\n\
    \n| **运算符** | **操作** |\n| :--- | :--- |\n| + | 数字相加 字符串拼接 |\n| **–** | 减法 |\n\
    | ***** | 法 |\n| **/** | 除法 |\n| **%** | 取模 |\n| **++** | 增 |\n| **– –** | 减 |\n\
    | ****** | 幂 |\n\n操作语句中指定的值被称为“操作数”。例如，在语句 `5 + 2` 中，`+` 运算符被提供了五和二的操作数值。注意 `+`\
    \ 运算符根据操作数的类型执行两种不同的操作。数字操作数相加返回总和，但字符串操作数拼接返回单个连接的字符串。\n\n"
- fmt: "\nThe `%` modulus operator divides the first operand by the second operand\
    \ and returns the remainder. Dividing by two will return either one or zero to\
    \ usefully determine whether the first operand is an odd number or an even number.\n\
    \nThe `++` increment operator and `--` decrement operator alter the value of a\
    \ single operand by one, and return the new value. These operators are most commonly\
    \ used to count iterations of a loop and can be used in two different ways to\
    \ subtly different effect. When placed before the operand (prefixed) its value\
    \ is immediately changed before the expression is evaluated, but when placed after\
    \ the operand (postfixed) the expression is evaluated first then the value gets\
    \ changed.\n\n![image](images/hot.jpg)\n\nThe `**` exponentiation operator returns\
    \ the result of a first operand raised to the power of a second operand.\n\n![image](images/hot.jpg)\n\
    \nAn example using the modulus operator to determine odd or even numbers can be\
    \ found [here](#chapter02.xhtml_step1).\n\n![image](images/1r.jpg)Create an HTML\
    \ document with a self-invoking anonymous function block\n\n```javascript\nfunction\
    \ ( ) {\n  // Statements to be inserted here.\n} ( ) ;\n```\n\n![image](images/htmlr.jpg)\n\
    \narithmetic.html\n\n![image](images/2r.jpg)Next, insert statements that assign\
    \ values to variables using each arithmetical operator and print each result in\
    \ an output string\n\n```javascript\nlet sum = 80 + 20 ; console.log( ‘Addition:\
    \ ‘ + sum )\nlet sub = sum - 50 ; console.log( ‘Subtraction: ‘ + sub )\nlet mul\
    \ = sum * 5 ; console.log( ‘Multiplication: ‘ + mul )\nlet div = sum / 4 ; console.log(\
    \ ‘Division: ‘ + div )\nlet mod = sum % 2 ; console.log( ‘Modulus: ‘ + mod )\n\
    let inc = ++sum ; console.log( ‘Increment: ‘ + inc )\nlet dec = --sum ; console.log(\
    \ ‘Decrement: ‘ + dec )\n```\n\n![image](images/3r.jpg)Save the HTML document,\
    \ then open it in your browser and launch the console to see the arithmetic results\n\
    \n![image](images/pg31_1.jpg)\n\n### Assign Values\n\nThe operators that are commonly\
    \ used in JavaScript to assign values are all listed in the table below. All except\
    \ the simple `=` assignment operator are shorthand forms of longer expressions,\
    \ so each equivalent is also given for clarity.\n\n![image](images/pg32_1.jpg)\n\
    \n| Operator | Example | Equivalent |\n| :--- | :--- | :--- |\n| `=` | `a = b`\
    \ | `a = b` |\n| `+=` | `a += b` | `a = ( a + b )` |\n| `–=` | `a –= b` | `a =\
    \ ( a – b )` |\n| `*=` | `a *= b` | `a = ( a * b )` |\n| `/=` | `a /= b` | `a\
    \ = ( a / b )` |\n| `%=` | `a %= b` | `a = ( a % b )` |\n| `**=` | `a ** b` |\
    \ `a = ( a ** b )` |\n\nIt is important to think of the `=` operator as meaning\
    \ “assign” rather than “equals” to avoid confusion with the JavaScript `===` equality\
    \ operator.\n\nIn the `=` example in the table, the variable `a` gets assigned\
    \ the value contained in variable `b` to become its new stored value.\n\nThe combined\
    \ `+=` operator is most useful and can be employed to append a string onto an\
    \ existing string. For example, with a variable `let str = ‘JavaScript’` and `str\
    \ += ‘ Fun’` the variable now stores the combined string ‘JavaScript Fun’.\n\n\
    Numerically speaking, the `+=` example in the table will add the value contained\
    \ in variable `a` to that contained in variable `b` then assign the sum total\
    \ to become the new value stored in variable a.\n\nAll other combined assignment\
    \ operators work in a similar way to the `+=` operator. They each perform the\
    \ arithmetical operation on their two operands first, then assign the result of\
    \ that operation to the first variable – so that becomes its new stored value.\n\
    \n![image](images/hot.jpg)\n\nThe `===` equality operator compares values and\
    \ is fully explained [here](#chapter02.xhtml_sec15).\n\n![image](images/1r.jpg)Create\
    \ an HTML document with a self-invoking anonymous function that concatenates two\
    \ strings\n\n```javascript\nfunction ( ) {\n  let msg = ‘JavaScript’ ; msg +=\
    \ ‘ Fun’\n  console.log( ‘Add & concatenate: ‘ + msg )\n  // Statements to be\
    \ inserted here.\n} ( ) ;\n```\n\n![image](images/htmlr.jpg)\n\nassignment.html\n\
    \n![image](images/2r.jpg)Next, insert statements that use combined operators to\
    \ perform arithmetic and assign results for output\n\n```javascript\nlet sum =\
    \ 5.00 ; sum += 2.50\nconsole.log( ‘Add & assign decimal: ‘ + sum )\nsum = 8 ;\
    \ sum -= 4\nconsole.log( ‘Subtract & assign integer: ‘ + sum )\nsum = 8 ; sum\
    \ *= 4\nconsole.log( ‘Multiply & assign integer: ‘ + sum )\nsum = 8 ; sum /= 4\n\
    console.log( ‘Divide & assign integer: ‘ + sum )\nsum = 8 ; sum %= 4\nconsole.log(\
    \ ‘Modulus & assign integer: ‘ + sum )\n```\n\n![image](images/3r.jpg)Save the\
    \ HTML document, then open it in your browser and launch the console to see the\
    \ arithmetic results\n\n![image](images/pg33_1.jpg)\n\n### Make Comparisons\n\n\
    The operators that are commonly used in JavaScript to compare values are all listed\
    \ in the table below.\n\n![image](images/pg34.jpg)\n\n| Operator | Comparison\
    \ |\n| :--- | :--- |\n| `===` | Equality |\n| `!==` | Inequality |\n| `>` | Greater\
    \ than |\n| `<` | Less than |\n| `>=` | Greater than or equal to |\n| `<=` | Less\
    \ than or equal to |\n\nThe `===` equality operator compares two values and will\
    \ return true if they are exactly equal, otherwise it will return false. The `>`\
    \ greater than operator returns true if the first is greater in value. The `<`\
    \ less than operator returns true when the first is less than the second. Adding\
    \ the `=` character after the `>` greater than operator or the `<` less than operator\
    \ makes them also return true when the two operands are equal. The `>` greater\
    \ than and `<` less than operators are frequently used to test the value of a\
    \ counter variable in a loop structure.\n\n![image](images/hot.jpg)\n\nAn example\
    \ using the `<` less than operator in a loop structure can be found [here](#chapter03.xhtml_step2).\n\
    \n![image](images/snake.jpg)\n\nThere is also a `==` equality operator and a `!=`\
    \ inequality operator, but these may produce unexpected results as, unlike `===`\
    \ and `!==`, they do not ensure the values being compared are of the same type.\
    \ This means that `25 == ‘25’` returns `true`, whereas `25 === ‘25’` returns `false`.\
    \ Always use the three-character versions so your scripts will make accurate comparisons.\n\
    \n![image](images/1r.jpg)Create an HTML document with a self-invoking anonymous\
    \ function that declares three variables\n\n```javascript\nfunction ( ) {\n  let\
    \ comparison, sum = 8, str = ‘JavaScript’\n  // Statements to be inserted here.\n\
    } ( ) ;\n```\n\n![image](images/htmlr.jpg)\n\ncomparison.html\n\n![image](images/2r.jpg)Next,\
    \ insert statements that use comparison operators to assign Boolean results for\
    \ output\n\n```javascript\ncomparison = str === ‘JAVASCRIPT’\nconsole.log( ‘String\
    \ Equality? ‘ + comparison )\ncomparison = str === ‘JavaScript’\nconsole.log(\
    \ ‘String Equality? ‘ + comparison )\ncomparison = sum === 8\nconsole.log( ‘Number\
    \ Equality? ‘ + comparison )\ncomparison = sum > 5\nconsole.log( ‘Greater Than?\
    \ ‘ + comparison )\ncomparison = sum < 5\nconsole.log( ‘Less Than? ‘ + comparison\
    \ )\ncomparison = sum <= 8\nconsole.log( ‘Less Than or Equal To? ‘ + comparison\
    \ )\n```\n"
  raw: 'The % modulus operator divides the first operand by the second operand and
    returns the remainder. Dividing by two will return either one or zero to usefully
    determine whether the first operand is an odd number or an even number.


    The ++ increment operator and -- decrement operator alter the value of a single
    operand by one, and return the new value. These operators are most commonly used
    to count iterations of a loop and can be used in two different ways to subtly
    different effect. When placed before the operand (prefixed) its value is immediately
    changed before the expression is evaluated, but when placed after the operand
    (postfixed) the expression is evaluated first then the value gets changed.


    ![image](images/hot.jpg)


    The ** exponentiation operator returns the result of a first operand raised to
    the power of a second operand.


    ![image](images/hot.jpg)


    An example using the modulus operator to determine odd or even numbers can be
    found [here](#chapter02.xhtml_step1).


