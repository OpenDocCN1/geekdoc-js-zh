    **info.innerHTML += ‘ : ‘ + lists[ i ].innerText + ‘<br>’**


    **}**


    ![image](images/hot.jpg)


    The **innerText** property of an element returns only the content between its
    opening and closing tags, whereas the **innerHTML** property also returns the
    HTML tags. Change this to **innerHTML** to see the difference.


    ![image](images/5v.jpg)Finally, add statements to describe a second HTMLCollection
    object and the text its elements contain


    **info.innerHTML += ‘<br>’ + fruits + ‘ Class:<br>’**


    **for( i = 0 ; i < fruits.length ; i++ ) {**


    **info.innerHTML += ( i + 1 ) + ‘ of ‘ + fruits.length**


    **info.innerHTML += ‘ : ‘ + fruits[ i ].innerText+ ‘<br>’**


    **}**


    ![image](images/6v.jpg)Save the HTML document, then open it in your browser to
    see the element values retrieved by different methods


    ![image](images/pg135_1.jpg)


    **Write Content**


    As witnessed in previous examples, the innerHTML and innerText properties of the
    document object can be used to write content into existing elements. The document
    object also has a write( ) method that provides another way to write content,
    but this automatically calls a document.open( ) method to start a new document
    – so the current document is no longer displayed.


    ![image](images/pg136_1.jpg)


    More usefully, a document.createElement( ) method accepts a tag name as its argument
    and creates an element of that type. Content can then be added to the new element
    by assignment to its innerHTML or innerText properties. It can then be inserted
    into the web page within an existing element by specifying the new element as
    the argument to a document.appendChild( ) method.


    You can also dynamically write attributes into elements by specifying an attribute
    name and value as two arguments to an element’s setAttribute( ) method.


    ![image](images/1v.jpg)Create an HTML document that contains a heading and an
    ordered list of three items


    **<h1 id=”heading”>Top 3 Cities</h1>**


    **<ol id=”list”>**


    **<li>Tokyo, Japan**


    **<li>New York, USA**


    **<li>Rio de Janeiro, Brazil**


    **</ol>**


    ![image](images/htmlv.jpg)


    write.html


    ![image](images/2v.jpg)Save the HTML document, then open it in your browser to
    see the web page


    ![image](images/pg136_2.jpg)


    ![image](images/3v.jpg)Next, in a script element, create a self-invoking function
    that begins by initializing two variables as new list item elements and one variable
    reference


    **const itemFour = document.createElement( ‘li’ )**


    **const itemFive = document.createElement( ‘li’ )**


    **const heading = document.getElementById( ‘heading’ )**


    ![image](images/4v.jpg)Now, assign text content to the two new elements


    **itemFour.innerText = ‘London, England’**


    **itemFive.innerText = ‘Cape Town, South Africa’**


    ![image](images/5v.jpg)Then, insert the new element content into the web page
    as children of the ordered list element


    **document.getElementById( ‘list’ ).appendChild( itemFour )**


    **document.getElementById( ‘list’ ).appendChild( itemFive )**


    ![image](images/6v.jpg)Add an attribute to the existing heading element to change
    its font color


    **heading.setAttribute( ‘style’, ‘color:Red’ )**


    ![image](images/7v.jpg)Finally, change the heading to better describe the extended
    list


    **heading.innerText = ‘Best Five Cities’**


    ![image](images/8v.jpg)Save the HTML document once more, then refresh your browser
    to see the newly written content


    ![image](images/pg137_1.jpg)


    ![image](images/hot.jpg)


    An existing element may be removed from the web page by specifying it as the argument
    to a **document.removeChild**( ) method, or replaced by specifying new and old
    elements as arguments to a **document.replaceChild( )** method.


    ![image](images/hot.jpg)


    You can remove an attribute by specifying the attribute’s name as the argument
    to an element’s **removeAttribute( )** method.


    **Manage Cookies**


    For security reasons JavaScript cannot write regular files on the user’s hard
    drive, but it can write “cookie” files to store a small amount of data. These
    are limited in size to a maximum of 4KB and in number to 20 per web server. Typically,
    the data stored in a cookie will identify the user for subsequent visits to a
    website.


    ![image](images/pg138_1.jpg)


    Cookie data is stored in the DOM document object’s cookie property as one or more
    “key=value” pairs, terminated with a “;” semicolon character. The value may not
    contain whitespace, commas, or semi-colons, unless passed as the argument to the
    built-in encodeURI( ) function, which encodes the string in Unicode format – for
    example, this represents a space as %20.


    By default, the lifespan of a cookie is limited to the current browser session
    unless an expiry date is specified when the cookie is created as an “expires=date”
    pair, in which the date value is a UTC string. Typically, this is achieved using
    a JavaScript Date object converted with its toUTCString( ) method. Setting an
    existing cookie’s expiry date to a past time will delete that cookie.


    Retrieving data from a cookie requires some string manipulation to return Unicode
    to regular text, using the built-in decodeURI( ) function so %20 becomes a space
    character once more, and to separate the name and value items of data. Within
    the cookie string multiple pairs can be separated by specifying the “;” semicolon
    as the argument to the split( ) method. Similarly, keys and values can be separated
    by specifying the “=” character as the argument to the split( ) method. Likewise,
    where the value is a comma-separated list of items, the “,” comma can be specified
    as the argument to the split( ) method to separate them as array elements.


    It is useful to create an external JavaScript file containing “setter” and “getter”
    utility functions that can easily be called to store and retrieve cookie data.


    ![image](images/1v.jpg)Begin a JavaScript file with a setter function that has
    parameters for key, value, and expiry arguments


    **function setCookie( key, value, days ) {**


