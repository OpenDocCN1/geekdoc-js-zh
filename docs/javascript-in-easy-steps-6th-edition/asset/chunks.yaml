    ![image](images/2p.jpg)Next, add statements to output the value in the first array
    element and list the entire array


    **console.log( jsArray[ 0 ] )**


    **console.log( jsArray )**


    ![image](images/3p.jpg)Now, add a statement to declare a variable, and to declare
    a variable initialized with an array


    **let month, summer = [ ‘June‘, ‘July‘, ‘August‘ ]**


    ![image](images/4p.jpg)Then, add a loop to output the index number and value of
    each array element


    **for ( month in summer )**


    **{**


    **if ( month !== ‘ ‘ )**


    **{**


    **console.log( month + ‘: ‘ + summer[ month ] )**


    **}**


    **}**


    ![image](images/5p.jpg)Finally add statements to output the value in the first
    array element and list the entire array


    **console.log( ‘Start of Summer: ‘ + summer[ 0 ] )**


    **console.log( summer )**


    ![image](images/6p.jpg)Save the HTML document, then open it in your browser and
    launch the console to see the array element contents


    ![image](images/pg71_1.jpg)


    ![image](images/hot.jpg)


    It’s good practice to wrap the body of **for in** loops in an **if** statement
    – here, it ensures the element is not empty.


    **Loop Elements**


    Arrays and loops make great partners! Any kind of loop can be used to fill the
    elements of an array with values. The elements of even very large arrays can be
    “populated” in this way – and with surprisingly little code.


    ![image](images/pg72_1.jpg)


    Similarly, loops can be used to quickly read the values in each array element
    and perform some action appropriate to that value on each iteration of the loop.


    Usefully, each array has a length property that contains an integer record of
    the total number of elements in that array. As a result of zero-based indexing
    this will always be one greater than the final element’s index number, so can
    be readily used in a conditional test to terminate the loop.


    ![image](images/1p.jpg)Create an HTML document with a self-invoking function that
    begins by declaring three variables


    **let i, result, boolArray = [ ]**


    ![image](images/htmlp.jpg)


    elements.html


    ![image](images/2p.jpg)Next, output a simple heading


    **console.log( ‘Fill Elements...’ )**


    ![image](images/3p.jpg)Now, add a loop to fill 10 elements with Boolean values
    and output their index number and each stored value


    **for( i = 1 ; i < 11 ; i++ )**


    **{**


    **boolArray[ i ] = ( i % 2 === 0 ) ? true : false**


    **console.log( ‘Element ‘ + i + ‘: ‘ + boolArray[ i ] )**


    **}**


    ![image](images/4p.jpg)Then, output a second simple heading and initialize a variable
    with an empty string value


    **console.log( ‘Read Elements...’ )**


    **result = ‘’**


    ![image](images/5p.jpg)Next, add a loop to assign the index numbers of any elements
    containing a true value to a string


    **for( i = 1 ; i < boolArray.length ; i++ )**


    **{**


    **if( boolArray[ i ] ) { result += i + ‘ | ‘ }**


    **}**


    ![image](images/hot.jpg)


    This array **length** property here has a value of 11 because the array has eleven
    elements – even though element zero has not been filled.


    ![image](images/6p.jpg)Now, output the string to reveal the index numbers of elements
    that contain a true value


    **console.log( ‘True in Elements: ‘ + result )**


    ![image](images/7p.jpg)Reset the string variable to contain an empty string


    **result = ‘‘**


    ![image](images/8p.jpg)Then, add a loop to assign the index numbers of any elements
    containing a false value to a string


    **for( i = 1 ; i < boolArray.length ; i++ )**


    **{**


    **if( !boolArray[ i ] ) { result += i + ‘ | ‘ }**


    **}**


    ![image](images/9p.jpg)Finally, output the string to reveal the index numbers
    of elements that contain a false value


    **console.log( ‘False in Elements: ‘ + result )**


    ![image](images/10p.jpg)Save the HTML document, then open it in your browser and
    launch the console to write and read array elements


    ![image](images/pg73_1.jpg)


    ![image](images/forget.jpg)


    Conditional tests for a Boolean value do not need to include the expression **===
    true** as that is automatic.


    **Slice Arrays**


    JavaScript objects have properties and methods. In addition to the length property,
    each array object has methods that can be used to manipulate the elements in an
    array. These are listed in the table below, together with a brief description
    of the task they perform:


    ![image](images/pg74_1.jpg)


    | **Method** | **Description** |


    | **join( *separator* )** | Unites all element values into a single string separated
    by a specified separator, or by a comma if no separator is specified |


    | **pop( )** | Deletes the last element of the array, and returns its value |


    | **push( *value , value* )** | Adds elements to the end of the array and returns
    the new length |


    | **reverse( )** | Reverses the order of all elements in the array and returns
    the reordered value of each element |


    | **shift( )** | Deletes the first element of the array, and returns its value
