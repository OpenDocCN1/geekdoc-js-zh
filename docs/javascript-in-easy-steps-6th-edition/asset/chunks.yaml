    to omit the **window.** prefix – so they are not being referenced via the **window**
    object’s very own **window** property. For example, simply use **onload** rather
    than **window.onload**.


    ![image](images/4bl.jpg)Then, add statements to list the version details of your
    browser and of your operating system


    **list.innerHTML += ‘<li>Version: ‘ + navigator.appVersion**


    **list.innerHTML += ‘<li>Platform: ‘ + navigator.platform**


    ![image](images/5bl.jpg)Finally, add a statement to confirm that you have a modern
    browser


    **if( window.addEventListener )**


    **{**


    **list.innerHTML += ‘<li>This is a modern DOM browser’**


    **}**


    ![image](images/6bl.jpg)Save the HTML document, then open it in any browser to
    see the name and version details


    ![image](images/pg121_1.jpg)


    ![image](images/pg121_2.jpg)


    ![image](images/pg121_3.jpg)


    ![image](images/hot.jpg)


    In all modern web browsers, the **window** object has an **addEventListener( )**
    method – you will discover more about this in [Chapter 7](#chapter07.xhtml), which
    demonstrates window events.


    ![image](images/hot.jpg)


    The reason that Google Chrome and other browsers describe themselves as Netscape,
    Mozilla emanates from the era of the “Browser Wars” – when browsers had to assume
    those names so they could be served all the web pages that Netscape Mozilla browsers
    could load.


    Check Status


    The DOM window object’s navigator child object has a javaEnabled( ) method that
    will return true only if Java support is enabled in the web browser.


    ![image](images/pg122_1.jpg)


    There is also a cookieEnabled property that will be true only if cookie support
    is enabled in the browser.


    Additionally, navigator has a plugins child object and a mimeTypes child object.
    As with other arrays, the plugins and mimeTypes arrays both have a length property
    containing the numeric total of their elements.


    Each plugin array element has a name and description property containing details
    of one installed plugin feature. These can be referenced using the element index
    number as usual. For example, navigator.plugins[0].name references the name property
    of the first element in the plugins array.


    Similarly, each mimeTypes array element has a type and description property containing
    details of one supported MIME feature. These can be referenced using the element
    index number as usual. For example, navigator.mimeTypes[ 0 ].type references the
    type property of the first element in the mimeTypes array.


    ![image](images/1bl.jpg)Create an HTML document with an empty paragraph


    **<p id=”info”></p>**


    ![image](images/htmlbl.jpg)


    enabled.html


    ![image](images/2bl.jpg)Next, in a script element, create a self-invoking function
    that begins by initializing two variables


    **const info = document.getElementById( ‘info’ )**


    **let status = ‘‘**


    ![image](images/3bl.jpg)Now, add statements to write a confirmation in the paragraph
    only if Java support is enabled


    **status = ( navigator.javaEnabled( ) ) ? ‘Enabled’ : ‘Disabled’**


    **info.innerHTML += ‘Java Support is ‘ + status + ‘<hr>’**


    ![image](images/4bl.jpg)Then, add statements to write a confirmation in the paragraph
    only if cookie support is enabled


    **status = ( navigator.cookieEnabled ) ? ‘Enabled’ : ‘Disabled’**


    **info.innerHTML += ‘Cookie Support is ‘ + status + ‘<hr>’**


    ![image](images/forget.jpg)


    The contents of these array elements vary according to which features are supported
    by each browser.


    ![image](images/5bl.jpg)Now, add statements to write the length of the plugins
    array and an example element


    **if ( navigator.plugins.length !== 0 )**


    **{**


    **info.innerHTML += ‘No. of Plugins: ‘ +**


    **navigator.plugins.length**


    **info.innerHTML += ‘<br>Example: ‘ +**


    **navigator.plugins[ 0 ].name**


    **info.innerHTML += ‘<br>For: ‘ +**


    **navigator.plugins[ 0 ].description + ‘<hr>’**


    **}**'
