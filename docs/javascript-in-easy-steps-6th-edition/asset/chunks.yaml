    **Calculate Areas**


    ![image](images/pg90_1.jpg)


    JavaScript has a built-in Math object that provides a number of useful methods
    and constant mathematical values. The constants are listed in the table below,
    together with their approximate value:


    | **Constant** | **Description** |


    | **Math.E** | Constant E, base of the natural logarithm, with an approximate
    value of 2.71828 |


    | **Math.LN2** | The natural logarithm of 2, with an approximate value of 0.69315
    |


    | **Math.LN10** | The natural logarithm of 10, with an approximate value of 2.30259
    |


    | **Math.LOG2E** | The base-2 logarithm of constant E, with an approximate value
    of 1.44269 |


    | **Math.LOG10E** | The base-10 logarithm of constant E, with an approximate value
    of 0.43429 |


    | **Math.PI** | The constant PI, with an approximate value of 3.14159 |


    | **Math.SQRT1_2** | The square root of 0.5, with an approximate value of 0.70711
    |


    | **Math.SQRT2** | The square root of 2, with an approximate value of 1.41421
    |


    There is no need to create an instance of the Math object as it is globally available
    by default, so Math constants and methods are accessible from anywhere in your
    script via the Math object and dot notation syntax.


    The Math constants are mostly used in scripts that have a particular mathematical
    purpose, but all the Math constants are listed above for completeness.


    ![image](images/hot.jpg)


    All the **Math** methods are listed [here](#chapter05.xhtml_sec44).


