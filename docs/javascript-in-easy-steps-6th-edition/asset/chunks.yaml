    **Summary**


    •The Math object provides mathematical constants, such as Math.PI, and mathematical
    methods, such as Math.max( )


    •Floating-point numbers can be rounded to the nearest integer using Math.floor(
    ), Math.ceil( ), and Math.round( ) methods.


    •JavaScript does not provide automatic rounding to overcome floating-point discrepancies.


    •Multiply floating-point values by 100, perform the arithmetic, then divide the
    result by 100 to avoid discrepancy errors.


    •The Math.random( ) method returns a random floating-point number between 0.0
    and 1.0.


    •Multiplying a random floating-point number by 10 and rounding the result with
    Math.ceil( ) makes the range 1-10.


    •The String object provides useful methods to manipulate string values, such as
    toUpperCase( ) and toLowerCase( )


    •Each string has a length property containing an integer that is the total number
    of characters in that string.


    •Strings can be joined together using the **+** concatenation operator or the
    string concat( ) method.


    •The eval( ) built-in function can have security implications so is best avoided.


    •The slice( ) and substring( ) method arguments specify start and end positions,
    but those of the substr( ) method specify the start position and the number of
    characters to copy.


    •The split( ) method returns an array of all substrings that exist between occurrences
    of the character specified as its argument.


    •The search( ), match( ), indexOf( ), lastIndexOf( ), and charAt( ) methods can
    be used to seek characters within a string.


    •The trim( ) method removes whitespace from both ends of a string.


    •The startsWith( ), endsWith( ), and includes( ) methods seek a case-sensitive
    match within a string.


    •The replace( ) and repeat( ) methods create modified strings.


    **6**


    **Address the Window Object**


    *This chapter describes and demonstrates methods of the top-level Window object
    of a web browser environment.*


    [**Meet DOM**](#chapter06.xhtml_sec52)


    [**Inspect Properties**](#chapter06.xhtml_sec53)


    [**Show Dialogs**](#chapter06.xhtml_sec54)


    [**Scroll Around**](#chapter06.xhtml_sec55)


    [**Pop-up Windows**](#chapter06.xhtml_sec56)


    [**Make Timers**](#chapter06.xhtml_sec57)


    [**Examine Browsers**](#chapter06.xhtml_sec58)


    [**Check Status**](#chapter06.xhtml_sec59)


    [**Control Location**](#chapter06.xhtml_sec60)


    [**Travel History**](#chapter06.xhtml_sec61)


    [**Summary**](#chapter06.xhtml_sec62)


    **Meet DOM**


    ![image](images/pg108_1.jpg)


    The browser represents all components of a web page within a hierarchical tree
    called the “Document Object Model” (DOM). Each component appears below the top-level
    window object, and the tree contains branches like those illustrated below:


    ![image](images/pg108_2.jpg)


    A for in loop can be used to list all properties of the window object provided
    by the browser. The list will contain fundamental properties that are common to
    all modern browsers, plus minor properties that are browser-specific.


    ![image](images/hot.jpg)


    Items followed by square brackets are array objects, and those within regular
    parentheses are various types of form elements.


    ![image](images/1bl.jpg)Create an HTML document with an empty list element


    **<ol id=”props” style=”column-count:3”> </ol>**


    ![image](images/htmlbl.jpg)


    dom.html


    ![image](images/2bl.jpg)Next, in a script element, create a self-invoking function
    that begins by initializing two variables


    **const list = document.getElementById( ‘props’ )**


    **let property = null**


    ![image](images/3bl.jpg)Now, add a loop to populate the list element with items
    that are direct properties of the browser’s window object


    **for( property in window )**


    **{**


    **if( property ) { list.innerHTML += ‘<li>’ + property }**


    **}**


    ![image](images/4bl.jpg)Save the HTML document, then open it in your browser to
    see the window object’s properties and method names


