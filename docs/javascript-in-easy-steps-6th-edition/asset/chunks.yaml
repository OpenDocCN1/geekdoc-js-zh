    ![image](images/pg69_1.jpg)


    ![image](images/forget.jpg)


    The **Math** object is the only JavaScript object that does not provide a constructor
    method.


    **Create Arrays**


    An Array object is a JavaScript built-in object that can store multiple items
    (of various data-types) in individual “elements”. An array is created by assigning
    [ ] square brackets to a variable, which can optionally contain a comma-separated
    list of values to initialize the array elements. Its syntax looks like this:


    ![image](images/pg70_1.jpg)


    **let *arrayName* = [ *value1 , value2 , value3* ]**


    Unlike custom objects, where each property is named, array elements are automatically
    numbered – starting at zero. So the first element is 0, the second is 1, the third
    is 2, and so on. This numbering system is often referred to as a “zero-based index”.


    The value stored within an array element can be referenced by enclosing its element
    index number within square brackets following the object name. For example, colors[
    0 ] would reference the value in the first element in an array named “colors”.


    Where array elements are not required to be initialized immediately, an empty
    array can be created and values assigned to its elements later, like this:


    **let colors = [ ]**


    **colors[ 0 ] = ‘Red’**


    **colors[ 1 ] = ‘Green’**


    **colors[ 2 ] = ‘Blue’**


    Although the Array object provides an Array( ) constructor it should not be used
    as it can produce unexpected results – for example, creating an array initializing
    the first element, like this:


    **let jsArray = new Array( 10 )**


    You might reasonably expect jsArray[ 0 ] to reference an integer value of 10 within
    the first element, but it in fact returns an undefined value. What’s going on?
    This is an anomaly that only occurs when you specify a single integer argument
    to the constructor method – which causes JavaScript to create an array of 10 empty
    elements! Creating the array with jsArray = [ 10 ] does not have that effect,
    and creates the array with its first element containing the integer value of 10
    as expected.


    ![image](images/forget.jpg)


    All built-in object names begin with an uppercase character – so the constructor
    is named “Array”, not “array”.


    ![image](images/1p.jpg)Create an HTML document with a self-invoking function that
    begins by creating an array – the wrong way


    **let jsArray = new Array( 10 )**


    ![image](images/htmlp.jpg)


