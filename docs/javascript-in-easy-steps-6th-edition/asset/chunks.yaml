    \n## 复选框\n\n单选按钮组允许用户从组中选择任意一个按钮，该组中所有单选按钮输入元素的 HTML `name` 属性共享相同的名称。在脚本术语中，该组名是一个数组的名称，可以通过其索引值引用每个单选按钮对象。\n\
    \n![image](img/pg146_1.jpg)\n\n与单选按钮组不同，复选框按钮组允许用户选择组中的一个或多个按钮。但与单选按钮组一样，每个 `name`\
