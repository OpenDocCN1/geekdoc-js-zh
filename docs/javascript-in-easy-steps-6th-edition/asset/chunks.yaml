  raw: 'The JavaScript break keyword can be used to exit from a loop when a specified
    condition is encountered. The conditional test should appear before all other
    statements to be executed so the loop will end immediately.


    ![image](images/pg58_1.jpg)


    Where a break statement is used in a loop that is nested within an outer loop,
    flow resumes in the outer loop iteration.


    The JavaScript continue keyword can be used to skip a single iteration of a loop
    when a specified condition is encountered.


    Where a continue statement is used in a loop that is nested within an outer loop,
    flow resumes at the next iteration of the inner loop.


