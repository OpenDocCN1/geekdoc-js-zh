  trans: "\n\n<p id=\"map\" style=\"width:450px;height:200px\"></p>\n\n![image](img/htmlr.jpg)\n\
    \ngeolocation.html\n\n接下来，在文档的头部（head）部分添加一个元素来获取 Google Maps API\n\n```html\n\
    <script src=\"https://maps.googleapis.com/maps/api/js?key=API_KEY\"></script>\n\
    ```\n\n![image](img/3r.jpg)\n\n现在，在文档的主体（body）部分结尾开始一个脚本，包含一个在 HTML 文档加载后尝试获取用户位置函数\n\
    \n```javascript\nfunction init( ) {\n  if ( navigator.geolocation ) {\n    document.getElementById(\
    \ ‘msg’ ).innerText = ‘Geolocation service is trying to find you...’\n    navigator.geolocation.getCurrentPosition(\
    \ success , fail )\n  } else {\n    document.getElementById( ‘msg’ ).innerText\
    \ = ‘Your browser does not support Geolocation service’\n  }\n}\ndocument.addEventListener(\
    \ ‘DOMContentLoaded’, init )\n```\n\n![image](img/4r.jpg)\n\n然后，添加一个函数在尝试失败时显示消息\n\
    \n```javascript\nfunction fail( position ) {\n  document.getElementById( ‘msg’\
    \ ).innerText = ‘Geolocation service cannot find you at this time’\n}\n```\n\n\
    ![image](img/forget.jpg)\n\n在此示例中，`navigator.geolocation` 对象提供了 `getCurrentPosition()`\
    \ 方法，该方法必须指定函数来处理成功和失败。这些函数必须都接受一个返回的 `position` 对象参数，因为其中包含了坐标或错误详情。\n\n![image](img/5r.jpg)\n\
    \n最后，添加一个成功函数，在尝试成功时显示获取到的坐标和地图\n\n```javascript\nfunction success( position )\
    \ {\n  const lat = position.coords.latitude\n  const lng = position.coords.longitude\n\
    \  document.getElementById( ‘msg’ ).innerHTML = ‘Found you at...<br>Latitude:\
    \ ‘ + lat + ‘ , Longitude: ‘ + lng\n  const latlng = new google.maps.LatLng( lat\
    \ , lng )\n  const options = { zoom: 18 , center : latlng , mapTypeId: google.maps.MapTypeId.ROADMAP\
    \ }\n  const map = new google.maps.Map( document.getElementById( ‘map’ ) , options\
    \ )\n  const marker = new google.maps.Marker( { position: latlng , map: map ,\
    \ title: ‘You are here’ } )\n}\n```\n\n![image](img/6r.jpg)\n\n将 HTML 文档保存在本地\
    \ Web 服务器的“htdocs”文件夹中，然后打开网页并允许获取您的位置——即可神奇地精准定位\n\n![image](img/pg185_1.jpg)\n\
    \n![image](img/pg185_2.jpg)\n\n![image](img/hot.jpg)\n\n要重现此示例，你首先需要在 [cloud.google.com](http://cloud.google.com)\
    \ 登录在线 Google Cloud 并创建一个项目。然后，为你的项目启用 Maps JavaScript API 并获取 API 密钥。将步骤 2 中的\
    \ `API_KEY` 替换为你自己的密钥以运行该示例。\n\n![image](img/common3.jpg)\n\n可以在 [dev.w3.org/geo/api](http://dev.w3.org/geo/api)\
    \ 在线发现更多关于 Geolocation API 的信息。\n\n## 总结\n\n- AJAX 允许网页通过从 Web 服务器请求数据来更新，而不会中断其他操作。\n\
    - 成功的 `XMLHttpRequest` 将文本存储在 `responseText` 属性中，并将 XML 数据存储在 `responseXML` 属性中。\n\
    - 嵌入 HTML 文档的 SVG 图形维护其所有元素和属性的 SVG DOM 节点树。\n- `getSVGDocument()` 方法创建 SVG 文档元素、属性和文本的引用对象。\n\
    - Canvas2D API 提供了可以在画布区域绘制形状和文本的方法和属性。\n- `getContext()` 方法创建画布区域的引用对象。\n- Web\
    \ Storage API 提供了长期的 `localStorage` 对象和用于临时存储的 `sessionStorage` 对象。\n- 使用 `setItem()`\
    \ 方法可以将项目存储在 `localStorage` 或 `sessionStorage` 中，并指定键和数据。\n- 拖放 API 允许用户拖动页面对象并将其到到目标。\n\
    - 需要为 `dragstart`、`dragover` 和 `drop` 事件编写脚本，以创建拖放界面。\n- Messaging API 允许在文档之间安全地发送纯文本消息——即使是不同域的文档。\n\
    - 要接收消息，接收方文档必须正确识别托管发送文档的域。\n- Geolocation API 提供了在用户同意共享位置详情时精准定位用户位置的能力。\n\
    - Google Location Services 返回用户估计的纬度和经度坐标。\n- 坐标可以显示在页面上并提供给 Google Maps 以获取该位置地图。\n\
    \n![image](img/bm1.jpg)\n\n![image](https://iescourses.com/)\n\n![image](img/bm2.jpg)\n\
    \n![image](img/bcover.jpg)\n\n"
