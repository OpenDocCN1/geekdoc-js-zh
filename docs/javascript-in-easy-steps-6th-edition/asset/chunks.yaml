  raw: '•JSON objects can be converted to JavaScript objects by the JSON.parse( )
    method.


    •JavaScript is a single-threaded synchronous language, but browser APIs support
    some asynchronous operations.


    •The event loop constantly monitors the state of the call stack and callback queue.


    •A Promise object represents the eventual completion or failure of an asynchronous
    operation and its resulting value.


    •Methods then( ) and catch( ) can be chained to a Promise object to handle the
    results of an asynchronous operation.


    •The Fetch API can be used in JavaScript to asynchronously grab resources over
    a network.


    •On completion, the fetch( ) method returns a Promise object that contains an
    HTTPResponse object.


    •An HTTPResponse object has a json( ) method that can be used to parse a JSON
    object.


    •Some function definitions can be written more concisely as JavaScript **=>**
    arrow function expressions.


    •Arrow function expressions treat the JavaScript this keyword differently to regular
    functions.


    •JSON data can be used to fill table cells of a web application.


    **9**


    **Produce Script Magic**


    *This chapter demonstrates some magical abilities of employing various APIs.*


    [**Request Data**](#chapter09.xhtml_sec84)


    [**Embed Vectors**](#chapter09.xhtml_sec85)


    [**Paint Canvas**](#chapter09.xhtml_sec86)


    [**Store Data**](#chapter09.xhtml_sec87)


    [**Drag Items**](#chapter09.xhtml_sec88)


    [**Pass Messages**](#chapter09.xhtml_sec89)


    [**Locate Users**](#chapter09.xhtml_sec90)


    [**Summary**](#chapter09.xhtml_sec91)


    **Request Data**


    **A**synchronous **J**avaScript **A**nd **X**ML (“AJAX”) allows web pages to be
    updated by requesting data from a web server without interrupting other operations.


    To use AJAX, JavaScript must first create an XMLHttpRequest object using the new
    keyword and XMLHttpRequest( ) constructor. The actual request is specified as
    three arguments to this object’s open( ) method – stating the retrieval method,
    a URL, and a Boolean true value to make the request asynchronously.


    The request can then be sent by calling the object’s send( ) method. Finally,
    an event-handler must be nominated to the XMLHttpRequest object’s onreadystatechange
    property to handle the response from the web server. This can first test that
    the object’s readyState property is 4 and the object’s status property is 200
    to ensure that the response is indeed complete and successful.


    Text retrieved by an XMLHttpRequest object is automatically stored in its responseText
    property, but XML data is automatically stored in its responseXML property. The
    DOM represents the XML document elements as “nodes” so needs additional steps
    to access their content. For example, all element nodes of a particular tag name
    can be assigned to an array variable using the getElementsByTagName( ) method
    of the responseXML property.


    Each element node has a firstChild property, which is the text node of its content.
    This, in turn, has a data property containing the actual text content. So the
    firstChild.data property of an element node reveals the text within that XML element.


    ![image](images/pg172_2.jpg)


    books.xml


    ![image](images/1r.jpg)Create an XML document with 10 <book> elements containing
    inner (child) <title> elements


    ![image](images/pg172_1.jpg)


    ![image](images/hot.jpg)


    At each stage of the request, the **readyState** property gets assigned a number:


    **0**: Not initialized


    **1**: Server connected


    **2**: Request received


    **3**: Processing request


    **4**: Response is ready


    Upon completion, the status property gets assigned a code:


    **200**: “OK”


    **403**: “Forbidden”


    **404**: “Page Not Found”


    ![image](images/forget.jpg)


    The screenshot here only shows two of the 10 <book> elements that are provided
    in the free source code file that you can download from [www.ineasysteps.com/resource-centre/downloads](http://www.ineasysteps.com/resource-centre/downloads)


    ![image](images/2r.jpg)Create an HTML document that includes a button element
    and an empty ordered list element


    **<button onclick=”loadXML( )”>Get Books</button>**


    **<ol id=”list”></ol**>


    ![image](images/htmlr.jpg)


    xmldom.html


    ![image](images/3r.jpg)Begin a script with a function to request XML data


    **function loadXML( ) {**


    **const xmlhttp = new XMLHttpRequest( )**


    **xmlhttp.open( ‘GET’, ‘books.xml’, true )**


    **xmlhttp.send( )**


    **xmlhttp.onreadystatechange = function( ) {**


    **if( this.readyState == 4 && this.status == 200 )**


    **getData( this ) }**


    **}**


    ![image](images/4r.jpg)Next, add a function to handle the response and write the
    XML data into the page’s empty list element


    **function getData( xml ) {**


    **const xmlDoc = xml.responseXML**


    **const tags = xmlDoc.getElementsByTagName( ‘book’ )**


    **let list = ‘’, i = 0**


    **for ( i = 0 ; i < tags.length ; i++ ) {**


    **list += ‘<li>’ +**


    **tags[i].getElementsByTagName( ‘title’ )[0].firstChild.data }**


    **document.getElementById( ‘list’ ).innerHTML = list**


    **}**


    ![image](images/hot.jpg)


    Each iteration of the loop here is getting the “book.title.data”. Using CSS, the
    list items are given alternating background colors with a **li.nth-child(even)**
    selector.


    ![image](images/5r.jpg)Save the XML and HTML documents in the “htdocs” folder
    of a web server, then open the web page and click the button to magically request
    the XML data


    ![image](images/pg173_1.jpg)


    ![image](images/pg173_2.jpg)


    ![image](images/common3.jpg)


    Like HTML documents, XML documents can also be validated by the W3C’s online validator
    tool at **[validator.w3.org](http://validator.w3.org)**


    **Embed Vectors**


    SVG graphics embedded in an HTML document maintain an SVG DOM node tree of all
    their elements and attributes. This is separate from the HTML DOM, but can be
    easily accessed through scripting to allow the HTML document to interact with
    the embedded SVG graphic.


    ![image](images/pg174_1.jpg)


    The key to accessing the embedded SVG DOM is to first create a reference object
    to the SVG document with a getSVGDocument( ) method. Then elements, attributes,
    and text in the SVG document can be addressed via the SVGDocument object:


    ![image](images/1r.jpg)Create an SVG graphic with a rectangle, circle, and text


