  trans: "\n\n`%` 模运算符将第一个操作数除以第二个操作数，并返回余数。除以二会返回一或零，从而很有用地判断第一个操作数是奇数还是偶数。\n\n`++`\
    \ 增量运算符和 `--` 减量运算符会将单个操作数的值改变一，并返回新值。这些运算符通常用于计数循环的次数，并有两种不同的不同的方式，产生细微不同的效果。当放在操作数之前（前置）时，在表达式求值之前立即改变值；但当放在操作数之后（后置）时，先求值表达式，然后改变值。\n\
    \n![image](img/hot.jpg)\n\n`**` 幂运算符返回第一个操作数相对于第二个操作数的幂次方的结果。\n\n![image](img/hot.jpg)\n\
    \n使用模运算符判断奇数或偶数的示例可以参考这里。\n\n![image](img/1r.jpg)创建一个带有自执行匿名函数块的 HTML 文档\n\n```javascript\n\
    function ( ) {\n  // 在此处插入语句。\n} ( ) ;\n```\n\n![image](img/htmlr.jpg)\n\narithmetic.html\n\
    \n![image](img/2r.jpg)接下来，插入使用每个算术运算符为变量赋值的语句并在输出字符串中打印每个结果\n\n```javascript\n\
    let sum = 80 + 20 ; console.log( ‘Addition: ‘ + sum )\nlet sub = sum - 50 ; console.log(\
    \ ‘Subtraction: ‘ + sub )\nlet mul = sum * 5 ; console.log( ‘Multiplication: ‘\
    \ + mul )\nlet div = sum / 4 ; console.log( ‘Division: ‘ + div )\nlet mod = sum\
    \ % 2 ; console.log( ‘Modulus: ‘ + mod )\nlet inc = ++sum ; console.log( ‘Increment:\
    \ ‘ + inc )\nlet dec = --sum ; console.log( ‘Decrement: ‘ + dec )\n```\n\n![image](img/3r.jpg)保存\
    \ HTML 文档，然后在浏览器中打开它并启动控制台以查看算术结果\n\n![image](img/pg31_1.jpg)\n\n### 赋值值\n\nJavaScript\
    \ 中常用的用于赋值的运算符都列在下表中。除了简单的 `=` 赋值运算符外，所有运算符都是较长表达式的简写，因此为了清晰起见，也提供了相应的写法。\n\n\
    ![image](img/pg32_1.jpg)\n\n| 运算符 | 示例 | 等效于 |\n| :--- | :--- | :--- |\n| `=`\
    \ | `a = b` | `a = b` |\n| `+=` | `a += b` | `a = ( a + b )` |\n| `–=` | `a –=\
    \ b` | `a = ( a – b )` |\n| `*=` | `a *= b` | `a = ( a * b )` |\n| `/=` | `a /=\
    \ b` | `a = ( a / b )` |\n| `%=` | `a %= b` | `a = ( a % b )` |\n| `**=` | `a\
    \ ** b` | 错误 |\n\n将 `=` 运算符理解为“赋值”而不是“等于”是非常重要的，以避免与 JavaScript 的 `===` 相等运算符混淆。\n\
    \n在表格的 `=` 示例中，变量 `a` 被赋值变量 `b` 中包含的值，成为其新的存储值。\n\n组合运算符 `+=` 很有用，可以用于将字符串附加到现有字符串上。例如，对于变量\
    \ `let str = ‘JavaScript’` 和 `str += ‘ Fun’`，变量现在存储组合后的字符串 ‘JavaScript Fun’。\n\
    \n从数字上来说，表格中的 `+=` 示例将变量 `a` 中的值加到变量 `b` 中的值，然后将总和赋值为变量 `a` 中存储的新值。\n\n所有其他组合赋值运算符的工作方式与\
    \ `+=` 运算符类似。它们都先对两个操作数执行算术操作，然后将该操作的结果赋值给第一个变量——使其成为其新的存储值。\n\n![image](img/hot.jpg)\n\
    \n`===` 相等运算符比较值，并在此处 有详细解释。\n\n![image](img/1r.jpg)创建一个带有连接两个字符串的自执行匿名函数的 HTML\
    \ 文档\n\n```javascript\nfunction ( ) {\n  let msg = ‘JavaScript’ ; msg += ‘ Fun’\n\
    \  console.log( ‘Add & concatenate: ‘ + msg )\n  // 在此处插入语句。\n} ( ) ;\n```\n\n\
    ![image](img/htmlr.jpg)\n\nassignment.html\n\n![image](img/2r.jpg)接下来，插入使用组合运算符执行算术运算并赋值结果输出的语句\n\
    \n```javascript\nlet sum = 5.00 ; sum += 2.50\nconsole.log( ‘Add & assign decimal:\
    \ ‘ + sum )\nsum = 8 ; sum -= 4\nconsole.log( ‘Subtract & assign integer: ‘ +\
    \ sum )\nsum = 8 ; sum *= 4\nconsole.log( ‘Multiply & assign integer: ‘ + sum\
    \ )\nsum = 8 ; sum /= 4\nconsole.log( ‘Divide & assign integer: ‘ + sum )\nsum\
    \ = 8 ; sum %= 4\nconsole.log( ‘Modulus & assign integer: ‘ + sum )\n```\n\n![image](img/3r.jpg)保存\
    \ HTML 文档，然后在浏览器中打开它并启动控制台以查看算术结果\n\n![image](img/pg33_1.jpg)\n\n### 比较\n\nJavaScript\
    \ 中常用的用于比较值的运算符都列在下表中。\n\n![image](img/pg34.jpg)\n\n| 运算符 | 比较 |\n| :--- | :---\
    \ |\n| `===` | 相等 |\n| `!==` | 不相等 |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于\
    \ |\n| `<=` | 小于等于 |\n\n`===` 相等运算符比较两个值，如果它们完全相等则返回 true，否则返回 false。`>` 大于运算符在第一个值大于值时返回\
    \ true。`<` 小于运算符在第一个值小于第二个值时返回 true。在 `>` 大于运算符或 `<` 小于运算符后添加 `=` 字符可以使它们在两个操作数相等时也返回\
    \ true。`>` 大于运算符和 `<` 小于运算符经常用于测试循环结构中计数器变量的值。\n\n![image](img/hot.jpg)\n\n在循环结构中使用\
    \ `<` 小于运算符的示例可以参考这里。\n\n![image](img/snake.jpg)\n\n还有 `==` 相等运算符和 `!=` 不相等运算符，但这些可能会产生意外的结果，因为与\
    \ `===` 和 `!==` 不同，它们不确保所比较的值是相同类型。这意味着 `25 == ‘25’` 返回 `true`，而 `25 === ‘25’`\
    \ 返回 `false`。始终使用三字符的版本，以便你的脚本进行准确的比较。\n\n![image](img/1r.jpg)创建一个声明三个变量的自执行匿名函数的\
    \ HTML 文档\n\n```javascript\nfunction ( ) {\n  let comparison, sum = 8, str = ‘JavaScript’\n\
    \  // 在此处插入语句。\n} ( ) ;\n```\n\n![image](img/htmlr.jpg)\n\ncomparison.html\n\n\
    ![image](img/2r.jpg)接下来，插入使用比较运算符赋值布尔结果输出的语句\n\n```javascript\ncomparison = str\
    \ === ‘JAVASCRIPT’\nconsole.log( ‘String Equality? ‘ + comparison )\ncomparison\
    \ = str === ‘JavaScript’\nconsole.log( ‘String Equality? ‘ + comparison )\ncomparison\
    \ = sum === 8\nconsole.log( ‘Number Equality? ‘ + comparison )\ncomparison = sum\
    \ > 5\nconsole.log( ‘Greater Than? ‘ + comparison )\ncomparison = sum < 5\nconsole.log(\
    \ ‘Less Than? ‘ + comparison )\ncomparison = sum <= 8\nconsole.log( ‘Less Than\
    \ or Equal To? ‘ + comparison )\n```\n\n"
- fmt: "\nJavaScript is case-sensitive, so character capitalization must match for\
    \ compared strings to be equal.\n\n## Assess Logic\n\nThe three logical operators\
    \ that can be used in JavaScript are listed in the table below:\n\n![image](images/pg36_1.jpg)\n\
    \n| Operator | Operation |\n| :--- | :--- |\n| `&&` | Logical AND |\n| `||` |\
    \ Logical OR |\n| `!` | Logical NOT |\n\nThe logical operators are typically used\
    \ with operands that have a Boolean value of true or false – or values that can\
    \ convert to true or false.\n\nThe `&&` logical AND operator will evaluate two\
    \ operands and return true only if both operands are themselves true. Otherwise,\
    \ the `&&` AND operator will return false. This is often used in conditional branching\
    \ where the direction of the script is determined by testing two conditions. If\
    \ both conditions are satisfied, the script will follow a particular direction,\
    \ otherwise it will follow a different direction.\n\nUnlike the `&&` logical AND\
    \ operator, which needs both operands to be true, the `||` logical OR operator\
    \ will evaluate two operands and return true if either one of the operands is\
    \ itself true. If neither operand is true then the `||` OR operator will return\
    \ false. This is useful to have a script perform a certain action if either one\
    \ of two test conditions is satisfied.\n\nThe third logical operator is the `!`\
    \ logical NOT operator that is used before a single operand, and it returns the\
    \ inverse value of the operand. For example, if variable named `tog` had a true\
    \ value then `!tog` would return false. This is useful to “toggle” the value of\
    \ a variable in successive loop iterations with a statement such as `tog = !a`\
    \ so that the value is reversed on each iteration – like flicking a light switch\
    \ on and off.\n\n![image](images/pg36_2.jpg)\n\nThe term “Boolean” refers to a\
    \ system of logical thought developed by the English mathematician George Boole\
    \ (1815-1864).\n\n![image](images/1r.jpg)Create an HTML document with a self-invoking\
    \ anonymous function that declares three variables\n\n```javascript\nfunction\
    \ () {\n  let result, yes = true, no = false;\n  // Statements to be inserted\
    \ here.\n}()\n```\n\n![image](images/htmlr.jpg)\n\n`logic.html`\n\n![image](images/2r.jpg)Next,\
    \ insert statements that use logical operators to assign Boolean results for output\n\
    \n```javascript\nresult = yes && yes\nconsole.log( ‘Are both true? ‘ + result\
    \ )\nresult = yes && no\nconsole.log( ‘Are both still true? ‘ + result )\nresult\
    \ = yes || no\nconsole.log( ‘Are either true? ‘ + result )\nresult = no || no\n\
    console.log( ‘Are either still true? ‘ + result )\nconsole.log( ‘Original value:\
    \ ‘ + yes )\nyes = !yes\nconsole.log( ‘Toggled value: ‘ + yes )\n```\n\n![image](images/3r.jpg)Save\
    \ the HTML document, then open it in your browser and launch the console to see\
    \ the returned results\n\n![image](images/pg37_1.jpg)\n\n![image](images/hot.jpg)\n\
    \nSee that `false && false` returns `false`, not `true` – perhaps demonstrating\
    \ the maxim “two wrongs don’t make a right”.\n\n## Examine Conditions\n\nPossibly,\
    \ the JavaScript author’s favorite operator is the `?:` conditional operator.\
    \ This operator is also known as the “ternary” operator – meaning composed of\
    \ three parts.\n\nThe ternary operator evaluates a specified condition for a true\
    \ or false value then executes one of two specified statements according to the\
    \ result. Its syntax looks like this:\n\n![image](images/pg38_1.jpg)\n\n```\n\
    condition ? if-true-do-this : if-false-do-this\n```\n\nWhere multiple actions\
    \ are required to be performed, according to the result of the condition evaluation,\
    \ each specified statement may be a function call to execute multiple statements\
    \ in each function – for example, calling functions to execute multiple statements\
    \ according to the Boolean value of a variable named `flag`, like this:\n\n```javascript\n\
    flag === true ? doThis() : doThat()\n```\n\nIn this example, the `===` equality\
    \ operator and `true` keyword are actually superfluous, as operators that evaluate\
    \ an expression for a Boolean value automatically perform this assessment, so\
    \ the example could be more simply stated as:\n\n```javascript\nflag ? doThis()\
    \ : doThat()\n```\n\nAlternatively, the two statements specified to the ternary\
    \ operator might assign a value to a variable according to the result of the condition\
    \ evaluation, like this:\n\n```javascript\nflag ? str = ‘Go left’ : str = ’Go\
    \ right’\n```\n\nWhile this is syntactically correct, it can be more elegantly\
    \ expressed by having the ternary operator assign an appropriate value to the\
    \ variable in a single assignment statement, like this:\n\n```javascript\nstr\
    \ = flag ? ‘Go left’ : ’Go right’\n```\n\nWhere the condition evaluates the parity\
    \ of a numeric value, the two statements can supply alternatives according to\
    \ whether the evaluation determines the number to be even or odd.\n\n![image](images/forget.jpg)\n\
    \nThe ternary operator has three operands – the one before the `?` and those either\
    \ side of the `:` colon.\n\n![image](images/1r.jpg)Create an HTML document with\
    \ a self-invoking anonymous function that declares two variables\n\n```javascript\n\
    function () {\n  const numOne = 8, numTwo = 3;\n  // Statements to be inserted\
    \ here.\n}()\n```\n\n![image](images/htmlr.jpg)\n\n`ternary.html`\n\n![image](images/2r.jpg)Next,\
    \ insert statements to output a string with appropriate grammar for quantity\n\
    \n```javascript\nlet verb = ( numOne !== 1 ) ? ‘ are ‘ : ‘ is ‘\nconsole.log(\
    \ ‘There’ + verb + numOne )\n```\n\n![image](images/3r.jpg)Now, insert statements\
    \ to ouput strings correctly describing the parity of two variable values\n\n\
    ```javascript\nlet parity = ( numOne % 2 !== 0 ) ? ‘Odd’ : ‘Even’\nconsole.log(\
    \ numOne + ‘ is ‘ + parity )\nparity = ( numTwo % 2 !== 0 ) ? ‘Odd’ : ‘Even’\n\
    console.log( numTwo + ‘ is ‘ + parity )\n```\n\n![image](images/4r.jpg)Finally,\
    \ insert statements to output a string reporting the greater of two variable values\n\
    \n```javascript\nlet max = ( numOne > numTwo ) ? numOne : numTwo\nconsole.log(\
    \ max + ‘ is the Greater Number ‘ )\n```\n\n![image](images/5r.jpg)Save the HTML\
    \ document, then open it in your browser and launch the console to see the string\
    \ descriptions\n\n![image](images/pg39_1.jpg)\n\n![image](images/hot.jpg)\n\n\
    The ternary operator can return values of any data type – string, number, Boolean,\
    \ etc.\n\n## Juggle Bits\n\nJavaScript “bitwise” operators regard their operands\
    \ as a sequence of 32 bits in which each bit may contain a value of zero (0) or\
    \ one (1). Each bit contributes a decimal component only when that bit contains\
    \ a one. Components are designated right-to-left from the “Least Significant Bit”\
    \ (LSB) to the “Most Significant Bit” (MSB). The binary number in the eight-bit\
    \ pattern below represents decimal 50 as denoted by the bits set with a 1 value\
    \ (2 + 16 + 32 = 50).\n\n![image](images/pg40_1.jpg)\n\n| Bit No. | 8 | 7 | 6\
    \ | 5 | 4 | 3 | 2 | 1 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| Decimal | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |\n| Binary | 0 | 0\
    \ | 1 | 1 | 0 | 0 | 1 | 0 |\n\nIt is possible to manipulate individual bits of\
    \ the sequence using the JavaScript bitwise operators listed in the table.\n\n\
    | Operator | Name | Binary number operation |\n| :--- | :--- | :--- |\n| `\\|`\
    \ | OR | Return a 1 in each bit where either of two compared bits is a 1 Example:\
    \ `1010 \\| 0101 = 1111` |\n| `&` | AND | Return a 1 in each bit where both of\
    \ two compared bits is a 1 Example: `1010 & 1100 = 1000` |\n| `~` | NOT | Return\
    \ a 1 in each bit where the bit is not 1, and return 0 where the bit is 1 Example:\
    \ `~ 1010 = 0101` |\n| `^` | XOR | Return a 1 in each bit where only one of two\
    \ compared bits is a 1 Example: `1010 ^ 0100 = 1110` |\n| `<<` | Shift left |\
    \ Push zeros in from the right, to move each bit a number of bits to the left\
    \ Example: `0010<< 2 = 1000` |\n| `>>` | Signed shift right | Push copies of the\
    \ leftmost bit in from the left, to move each bit a number of bits to the right.\
    \ Example: `1000 >> 2 = 0010` |\n"
  raw: 'JavaScript is case-sensitive, so character capitalization must match for compared
    strings to be equal.


    **Assess Logic**


    The three logical operators that can be used in JavaScript are listed in the table
    below:


    ![image](images/pg36_1.jpg)


    | **Operator** | **Operation** |


    | **&&** | Logical AND |


    | **&#124;&#124;** | Logical OR |


    | **!** | Logical NOT |


    The logical operators are typically used with operands that have a Boolean value
    of true or false – or values that can convert to true or false.


    The && logical AND operator will evaluate two operands and return true only if
    both operands are themselves true. Otherwise, the && AND operator will return
    false. This is often used in conditional branching where the direction of the
    script is determined by testing two conditions. If both conditions are satisfied,
    the script will follow a particular direction, otherwise it will follow a different
    direction.


    Unlike the && logical AND operator, which needs both operands to be true, the
    || logical OR operator will evaluate two operands and return true if either one
    of the operands is itself true. If neither operand is true then the || OR operator
    will return false. This is useful to have a script perform a certain action if
    either one of two test conditions is satisfied.


    The third logical operator is the ! logical NOT operator that is used before a
    single operand, and it returns the inverse value of the operand. For example,
    if variable named “tog” had a true value then !tog would return false. This is
    useful to “toggle” the value of a variable in successive loop iterations with
    a statement such as tog = !a so that the value is reversed on each iteration –
    like flicking a light switch on and off.


    ![image](images/pg36_2.jpg)


    The term “Boolean” refers to a system of logical thought developed by the English
    mathematician George Boole (1815-1864).


    ![image](images/1r.jpg)Create an HTML document with a self-invoking anonymous
    function that declares three variables


    **( function ( ) {**


    **let result, yes = true, no = false**


    **// Statements to be inserted here.**


    **} ) ( )**


    ![image](images/htmlr.jpg)


    logic.html


    ![image](images/2r.jpg)Next, insert statements that use logical operators to assign
    Boolean results for output


    **result = yes && yes**


    **console.log( ‘Are both true? ‘ + result )**


    **result = yes && no**


    **console.log( ‘Are both still true? ‘ + result )**


    **result = yes || no**


    **console.log( ‘Are either true? ‘ + result )**


    **result = no || no**


    **console.log( ‘Are either still true? ‘ + result )**


    **console.log( ‘Original value: ‘ + yes )**


    **yes = !yes**


    **console.log( ‘Toggled value: ‘ + yes )**


    ![image](images/3r.jpg)Save the HTML document, then open it in your browser and
    launch the console to see the returned results


    ![image](images/pg37_1.jpg)


    ![image](images/hot.jpg)


    See that **false && false** returns **false**, not **true** – perhaps demonstrating
    the maxim “two wrongs don’t make a right”.


    **Examine Conditions**


    Possibly, the JavaScript author’s favorite operator is the ?: conditional operator.
    This operator is also known as the “ternary” operator – meaning composed of three
    parts.


    The ternary operator evaluates a specified condition for a true or false value
    then executes one of two specified statements according to the result. Its syntax
    looks like this:


    ![image](images/pg38_1.jpg)


    ***condition ? if-true-do-this : if-false-do-this***


    Where multiple actions are required to be performed, according to the result of
    the condition evaluation, each specified statement may be a function call to execute
    multiple statements in each function – for example, calling functions to execute
    multiple statements according to the Boolean value of a variable named “flag”,
    like this:


    **flag === true ? doThis( ) : doThat( )**


    In this example, the === equality operator and true keyword are actually superfluous,
    as operators that evaluate an expression for a Boolean value automatically perform
    this assessment, so the example could be more simply stated as:


    **flag ? doThis( ) : doThat( )**


    Alternatively, the two statements specified to the ternary operator might assign
    a value to a variable according to the result of the condition evaluation, like
    this:


    **flag ? str = ‘Go left’ : str = ’Go right’**


    While this is syntactically correct, it can be more elegantly expressed by having
    the ternary operator assign an appropriate value to the variable in a single assignment
    statement, like this:


    **str = flag ? ‘Go left’ : ’Go right’**


    Where the condition evaluates the parity of a numeric value, the two statements
    can supply alternatives according to whether the evaluation determines the number
    to be even or odd.


    ![image](images/forget.jpg)


    The ternary operator has three operands – the one before the **?** and those either
    side of the **:** colon.


    ![image](images/1r.jpg)Create an HTML document with a self-invoking anonymous
    function that declares two variables


    **( function ( ) {**


    **const numOne = 8, numTwo = 3**


    **// Statements to be inserted here.**


    **} ) ( )**


    ![image](images/htmlr.jpg)


    ternary.html


    ![image](images/2r.jpg)Next, insert statements to output a string with appropriate
    grammar for quantity


    **let verb = ( numOne !== 1 ) ? ‘ are ‘ : ‘ is ‘**


    **console.log( ‘There’ + verb + numOne )**


    ![image](images/3r.jpg)Now, insert statements to ouput strings correctly describing
    the parity of two variable values


    **let parity = ( numOne % 2 !== 0 ) ? ‘Odd’ : ‘Even’**


    **console.log( numOne + ‘ is ‘ + parity )**


    **parity = ( numTwo % 2 !== 0 ) ? ‘Odd’ : ‘Even’**


    **console.log( numTwo + ‘ is ‘ + parity )**


    ![image](images/4r.jpg)Finally, insert statements to output a string reporting
    the greater of two variable values


    **let max = ( numOne > numTwo ) ? numOne : numTwo**


    **console.log( max + ‘ is the Greater Number’ )**


    ![image](images/5r.jpg)Save the HTML document, then open it in your browser and
    launch the console to see the string descriptions


    ![image](images/pg39_1.jpg)


    ![image](images/hot.jpg)


    The ternary operator can return values of any data type – string, number, Boolean,
    etc.


    **Juggle Bits**


    JavaScript “bitwise” operators regard their operands as a sequence of 32 bits
    in which each bit may contain a value of zero (0) or one (1). Each bit contributes
    a decimal component only when that bit contains a one. Components are designated
    right-to-left from the “Least Significant Bit” (LSB) to the “Most Significant
    Bit” (MSB). The binary number in the eight-bit pattern below represents decimal
    50 as denoted by the bits set with a 1 value (2 + 16 + 32 = 50).


    ![image](images/pg40_1.jpg)


    | **Bit No.** | **8** | **7** | **6** | **5** | **4** | **3** | **2** | **1**
    |


    | **Decimal** | **128** | **64** | **32** | **16** | **8** | **4** | **2** | **1**
    |


    | **Binary** | **0** | **0** | **1** | **1** | **0** | **0** | **1** | **0** |


    It is possible to manipulate individual bits of the sequence using the JavaScript
    bitwise operators listed in the table below.


    | **Operator** | **Name** | **Binary number operation:** |


    | **&#124;** | OR | Return a **1** in each bit where either of two compared bits
    is a **1** Example: **1010 &#124; 0101 = 1111** |


    | **&** | AND | Return a **1** in each bit where both of two compared bits is
    a **1** Example: **1010 & 1100 = 1000** |


    | **~** | NOT | Return a **1** in each bit where the bit is not **1**, and return
    **0** where the bit is **1** Example: **~ 1010 = 0101** |


    | **^** | XOR | Return a **1** in each bit where only one of two compared bits
    is a **1** Example: **1010 ^^ 0100 = 1110** |


    | **<<** | Shift left | Push zeros in from the right, to move each bit a number
    of bits to the left Example: **0010<< 2 = 1000** |


    | **>>** | Signed shift right | Push copies of the leftmost bit in from the left,
    to move each bit a number of bits to the right. Example: **1000 >> 2 = 0010**
    |'
