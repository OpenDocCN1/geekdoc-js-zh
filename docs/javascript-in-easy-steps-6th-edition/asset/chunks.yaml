    \ OR |\n| `?:` | Ternary conditional |\n| `= += –= *= /= %= &= ^= &#124;= <<=\
    \ >>= >>>=` | Assignment |\n| `,` | Comma |\n\n![image](images/hot.jpg)\n\nThe\
    \ `[ ]` operator is introduced in the section that demonstrates arrays beginning\
