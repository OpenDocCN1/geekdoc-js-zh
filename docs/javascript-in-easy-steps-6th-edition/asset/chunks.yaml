    # Split Strings


    There are several string methods that allow a specified part of a string to be
    copied from the full string. These treat each string like an array, in which each
    element contains a character or a space, and can be referenced by their index
    position. As with arrays, the string index is zero-based, so the first character
    is at position zero.


    ![image](images/pg100_1.jpg)


    The start at which to begin copying a “substring” can be specified by stating
    its index position as an argument to the string’s `substring()` method. This will
    copy all characters after that position right up to the end of the string. Optionally,
    a second argument may be supplied to the string’s `substring()` method to specify
    a subsequent index position as the end of the substring. This will then copy all
    characters between the start and end positions.


    An alternative way to copy substrings is provided by the string `substr()` method.
    Like the `substring()` method, this can take a single argument to specify the
    index position at which to begin copying, and will copy all characters after that
    position right up to the end of the string. Unlike the `substring()` method, the
    `substr()` method may optionally be supplied with a second argument to specify
    the number of characters to copy after the start position.


    Similarly, the string `slice()` method can be used to return all characters after
    a start position, specified by a single argument, or all characters between two
    positions, specified as two arguments.


    It is sometimes useful to copy parts of a string that are separated by a particular
    character. The separator character can be specified as an argument to the string
    `split()` method, which will return an array of all substrings that exist between
    occurrences of that character. Optionally, the `split()` method may be supplied
    with a second argument specifying the size of the array it should return. In this
    case, each substring that exists between the specified separator character is
    returned until the limit is reached, and the rest of the string is ignored.


    None of these string methods modify the original string but merely make a copy
    of a particular part of the original string.


    ![image](images/hot.jpg)


    The `substr()` method is invariably easier to use than the `substring()` method
    – because you need only calculate the start position and the substring length,
    not an end position.


    ![image](images/hot.jpg)


    The `split()` method is used to separate cookie data in the example [here](#chapter07.xhtml_sec67).


