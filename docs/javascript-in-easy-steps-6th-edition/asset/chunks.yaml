    管理 JavaScript 语言的规则被称为“语法”（syntax），它识别两种值——固定值和变量。固定的数值和文本字符串值被称为“字面量”（literals）：“


    *   **数字字面量** – 整数，如 `100`，或浮点数如 `3.142`。

    *   **字符串字面量** – 位于双引号内的文本，如 `“JavaScript Fun”`，或单引号内的文本，如 `‘JavaScript Fun’`。


    变量值简单来说被称为“变量”，用于在脚本中存储数据。可以使用 JavaScript 的 `let` 关键字创建变量——例如，`let total` 会创建一个名为“total”的变量。可以使用
    JavaScript 的 `=` 赋值运算符为变量赋值以存储，如下所示：


    ```javascript

    let total = 300

    ```


    可以使用其他 JavaScript 运算符形成表达式，这些表达式将求出一个单一值。通常，一个表达式可以包含在 `( )` 括号内，如下所示由数字和 JavaScript
    的 `+` 加法运算符组成的表达式，其求值为单一 100：


    ```javascript

    ( 80 + 20 )

    ```


    表达式也可能包含变量值，如下所示由之前的变量值、JavaScript 的 `-` 减法运算符和一个数字组成的表达式，其求值为单一 100：


    ```javascript

    ( total - 200 )

    ```


    JavaScript 是一种区分大小写的语言，因此名为 `total` 和 `Total` 的变量被视为两个完全不同的变量。


    在 JavaScript 代码中添加解释性注释是一个良好的习惯，这可以让其他人更容易理解代码，也能让你以后回顾代码时更容易理解。出现在 `//` 双斜杠之后的单行，或出现在一行或多行
