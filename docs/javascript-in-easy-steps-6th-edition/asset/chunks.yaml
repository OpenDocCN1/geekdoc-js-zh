  trans: "\n\n![image](img/forget.jpg)\n\n最大的负值是最接近零的那个。\n\n## 小数舍入\n\nJavaScript\
    \ 内置的 `Math` 对象提供了三种方法将浮点数舍入为整数值。每个方法都接受浮点值作为参数并返回一个整数。`Math.ceil()` 方法向上舍入，`Math.floor()`\
    \ 方法向下舍入，而 `Math.round()` 方法则四舍五入到最近的整数。\n\n![image](img/pg94_1.jpg)\n\n在处理浮点数时，识别出\
    \ IEEE（电气与电子工程师学会）定义的流行计算机浮点数数学标准与通常接受的数学准确性之间存在差异是非常重要的。这是因为某些十进制数字无法精确转换为二进制形式。例如，小数\
    \ `81.66` 无法精确转换为二进制——因此表达式 `81.66 * 15` 返回的是 `1224.8999999999999`，而不是数学上准确的数字\
    \ `1224.9`。\n\n某些编程语言提供自动舍入功能来克服浮点数差异，但 JavaScript 没有，因此必须小心，特别是在处理货币值时，以避免数学错误结果。推荐的做法是先将浮点值乘以\
    \ `100`，然后进行算术运算，最后将结果除以 `100` 以返回相同的小数位。\n\n可以使用类似的步骤将长浮点数转换为两位小数。在将值乘以 `100`\
    \ 后，可以使用 `Math.round()` 方法对该值进行舍入，然后除以零返回两位小数。\n\n乘、运算、除的步骤可以写为单独步骤，也可以使用括号在单个简洁的表达式中确定顺序。例如，将名为\
    \ `num` 的变量中的长浮点数可以写写：\n\n```javascript\nnum = num * 100\nnum = Math.round( num\
    \ )\nnum /= 100\n```\n\n或者写为：\n\n```javascript\nnum = ( Math.round( num * 100\
    \ ) ) / 100\n```\n\n![image](img/hot.jpg)\n\n`Math.round()` 方法默认向上舍入——因此 `Math.round(\
    \ 7.5 )` 返回 8 而不是 7，而 `Math.round( -7.5 )` 返回 -7 而不是 -8。\n\n![image](img/1o.jpg)创建一个带有自执行函数的\
    \ HTML 文档，从初始化变量开始\n\n```javascript\nlet bodyTemp = 98.6\n```\n\n![image](img/htmlo.jpg)\n\
    \nround.html\n\n![image](img/2o.jpg)接下来，添加语句显示与浮点值最接近的整数\n\n```javascript\nconsole.log(\
    \ ‘Ceiling: ‘ + Math.ceil( bodyTemp ) )\nconsole.log( ‘Floor: ‘ + Math.floor(\
    \ bodyTemp ) )\nconsole.log( ‘Round: ‘ + Math.round( bodyTemp ) )\n```\n\n![image](img/3o.jpg)现在，添加语句显示表达式的错误计算结果及其后的等值结果\n\
    \n```javascript\nconsole.log( ‘\\nImprecision: ‘ + ( 81.66 * 15 ) )\nconsole.log(\
    \ ‘Corrected: ‘ + ( ( 81.66 * 100 ) / 100 ) )\n```\n\n![image](img/4o.jpg)然后，添加语句显示长浮点值及其转换后的等值结果\n\
    \n```javascript\nconsole.log( ‘\\nFloat: ‘ + Math.PI )\nconsole.log( ‘Commuted:\
    \ ‘ + ( Math.round ( Math.PI * 100 ) / 100 ) )\n```\n\n![image](img/5o.jpg)保存\
    \ HTML 文档，然后在浏览器中打开它并启动控制台查看舍入后的数字\n\n![image](img/pg95_1.jpg)\n\n![image](img/forget.jpg)最内层括号中的表达式优先计算。\n\
    \n## 生成随机数\n\nJavaScript 的 `Math.random()` 方法返回一个 `0.0` 到 `1.0` 之间的随机点数。它可以用于各种需要随机数的网页效果。乘以浮点值会增加其范围。例如，将其乘以\
    \ `10` 会将范围扩大到 `0.0-10.0`。\n\n![image](img/pg96_1.jpg)\n\n通常，使用 `Math.ceil()`\
    \ 方法将随机值向上舍入是有用的，这样范围就变成了 `1-10`。指定随机数范围的过程可以写为单独步骤，也可以使用括号在单个表达式中确定顺序。例如，为名为\
    \ `rand` 的变量指定 `1-10` 的范围可以写为：\n\n```javascript\nlet rand = Math.random()\nrand\
    \ *= 10\nrand = Math.ceil( rand )\n```\n\n或者写为：\n\n```javascript\nlet rand = Math.ceil(\
    \ Math.random() * 10 )\n```\n\n在指定的范围内可以生成一系列唯一的随机数。例如，在 `1-59` 范围内产生随机彩票号码：\n\
    \n![image](img/1o.jpg)创建一个带有自执行函数的 HTML 文档，从声明变量开始\n\n```javascript\nlet i, rand,\
    \ temp, nums = []\nlet str = ‘\\nYour Lucky Numbers: ‘\n```\n\n![image](img/htmlo.jpg)\n\
    \nrandom.html\n\n![image](img/2o.jpg)接下来，添加一个循环将数组元素 `1-59` 填充为相应的索引号\n\n```javascript\n\
    for( i = 1 ; i < 60 ; i ) { nums[ i ] = i }\n```\n\n![image](img/3o.jpg)现在，添加循环使数组元素中的数字随机化\n\
    \n```javascript\nfor( i = 1 ; i < 60 ; i ) {\n  rand = Math.ceil( Math.random()\
    \ * 59 )\n  temp = nums[ i ]\n  nums[ i ] = nums[ rand ]\n  nums[ rand ] = temp\n\
    }\n```\n\n![image](img/hot.jpg)步骤 3 包含一个洗牌算法，并确保没有两个元素包含相同的数字。\n\n![image](img/4o.jpg)然后，添加循环将包含六个元素值的连字符列表追加到字符串变量\n\
    \n```javascript\nfor( i = 1 ; i < 7 ; i ) {\n  str += nums[ i ]\n  if( i !== 6\
    \ ) { str += ‘ - ‘ }\n}\n```\n\n![image](img/5o.jpg)最后，添加语句输出字符串变量\n\n```javascript\n\
    console.log( str )\n```\n\n![image](img/6o.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台，每次执行脚本都会看到指定范围内唯一的随机数选择。\n\
    \n![image](img/pg97_1.jpg)\n\n![image](img/pg97_2.jpg)这里，随机数在 `1` 到 `59` 范围内——用于玩英国乐透或美国纽约乐透。\n\
    \n![image](img/pg97_3.jpg)\n\n## 并字符串\n\nJavaScript 有一个 `String` 对象，提供了操作字符串值的有用方法。然而，没有需要使用\
    \ `new` 关键字和 `String()` 构造函数创建 `String` 对象的实例，因为其方法可以直接使用点表示法应用于字符串变量。例如，`str.toUpperCase()`\
    \ 返回名为 `str` 的字符串变量中所有字符的大写形式，而 `str.toLowerCase()` 则返回其所有字符的小写形式。\n\n![image](img/pg98_1.jpg)\n\
    \n还有一个 `length` 属性，用于存储字符串中的字符总数。\n\n之前列出的许多示例使用 `+` 拼接运算符来合并多个字符串，但也可以使用字符串 `concat()`\
    \ 方法以逗号分隔的参数列表的形式追加一个或多个字符串。\n\n某些脚本作者使用内置函数 `eval()` 来合并字符串和变量——但绝对应该避免这样做。`eval()`\
    \ 函数直接调用 JavaScript 编译器将其字符串参数编译为 JavaScript 语句：\n\n- 如果字符串表示一个表达式，`eval()` 将计算该表达式——例如\
    \ `eval('1 + 1')` 返回 `2`。\n- 如果字符串表示一个语句或一系列语句，`eval()` 将计算最后一个语句——例如代码 `eval('let\
    \ num = 100 ; alert( num )')` 会产生一个警告对话框。\n\n![image](img/pg98_2.jpg)\n\n这种 `eval()`\
    \ 的用法会在脚本性能上产生巨大代价，并且在几乎所有情况下都是必要的，因为通常有更高效、更优雅的解决方案。此外，如果脚本允许用户输入作为 JavaScript\
    \ 指令进行评估，`eval()` 函数可能会产生影响。这提供了执行恶意代码的机会。例如，代码 `eval('while( true) ; alert( )')`\
    \ 将产生导致浏览器锁死的无限循环。\n\n![image](img/snake.jpg)\n\n"
