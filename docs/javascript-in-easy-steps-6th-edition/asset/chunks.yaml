    # 查找字符


    JavaScript `String` 对象提供了许多方法，允许在字符串中搜索特定字符或子字符串。`search()` 方法接受子字符串作为参数，并返回它在搜索字符串中出现的位置，如果未找到则返回
    -1。或者，可以将子字符串指定为 `match()` 方法的参数，如果它存在则返回该子字符串，如果不存在则返回 JavaScript 的 `null` 值。


    ![image](img/pg102_1.jpg)


    `indexOf()` 方法接受子字符串作为参数，并返回首次出现的索引。`lastIndexOf()` 工作原理相同，但它从字符串末尾向后搜索，报告最后一次出现。


    要发现字符串中特定索引位置的字符，可以将其索引值作为 `charAt()` 方法的参数，或者通过将其索引指定给 `charCodeAt()` 方法来揭示其数值
    Unicode 值。相反，可以将一个或多个 Unicode 值作为 `String.fromCharCode()` 方法的参数，以返回它们的字符值。


    此外，可以通过将字符或子字符串的值指定为 `replace()` 方法的第一个参数，并将替换值指定为第二个参数来替换所有出现的位置。


    ![image](img/1o.jpg)


    创建一个 HTML 文档，包含一个自执行函数，并开始用字符串值初始化一个变量


    ```javascript

    let str = ‘JavaScript in easy steps’

    ```


    ![image](img/htmlo.jpg)


    find.html


