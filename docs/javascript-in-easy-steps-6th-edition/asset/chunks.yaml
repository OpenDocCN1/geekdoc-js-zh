    \ 的过期日期设置为早于当前实际日期的来删除 cookie。\n\n## 加载事件\n\n![image](img/pg140_1.jpg)\n\nDOM\
    \ 允许 JavaScript 通过脚本作者提供在特定事件发生时执行的函数，来响应网页上发生的“事件”。这些函数被称为“事件处理器”，可以对以下事件做出反应：\n\
    \n-   **load** – 页面加载到浏览器时触发\n-   **click** – 用户点击鼠标按钮时触发\n-   **keydown** – 用户按下键盘键时触发\n\
    -   **change** – 用户修改输入字段时触发\n- **submit** – 用户提交 HTML 表单时触发\n\n要响应加载事件，可以通过将事件处理器函数赋值给\
