- fmt: '

    The rules that govern the JavaScript language is called “syntax”, and it recognizes
    two types of values – fixed and variable. Fixed numeric and text string values
    are called “literals”:


    *   **Number literals** – whole number integers, such as `100`, or floating-point
    numbers such as `3.142`.

    *   **String literals** – text within either double quotes, such as `“JavaScript
    Fun”`, or single quotes such as `‘JavaScript Fun’`.


    Variable values are called, quite simply, “variables” and are used to store data
    within a script. They can be created using the JavaScript `let` keyword – for
    example, `let total` creates a variable named “total”. The variable can be assigned
    a value to store using the JavaScript `=` assignment operator, like this:


    ```javascript

    let total = 300

    ```


    Other JavaScript operators can be used to form expressions that will evaluate
    to a single value. Typically, an expression may be enclosed within `( )` parentheses
    like this expression that comprises numbers and the JavaScript `+` addition operator
    and evaluates to a single value of 100:


    ```javascript

    ( 80 + 20 )

    ```


    Expressions may also contain variable values too, like this expression that comprises
    the previous variable value, the JavaScript `-` subtraction operator, and a number,
    to also evaluate to a single value of 100:


    ```javascript

    ( total - 200 )

    ```


    JavaScript is a case-sensitive language so variables named `total` and `Total`
    are regarded as two entirely different variables.


    It is good practice to add explanatory comments to your JavaScript code to make
    it more easily understood by others, and by yourself when revisiting the code
    later. Anything that appears on a single line following `//` double slashes or
    between `/*` and `*/` character sequences on one or more lines will be ignored.


    ```javascript

    let total = 100 // This code WILL be executed.


    /* let total = 100

    This code will NOT be executed. */

    ```


    ![image](images/hot.jpg)


    Decide on one form of quotes to use in your code for string literals and stick
    with it for consistency. The examples in this book use single quotes.


    ![image](images/hot.jpg)


    It is often useful to “comment-out” lines of code to prevent their execution when
    debugging code.


    ### Avoid Keywords


    ![image](images/pg14_1.jpg)


    In JavaScript code you can choose your own names for variables and functions.
    The names should be meaningful and reflect the purpose of the variable or function.
    Your names may comprise letters, numbers, and underscore characters, but they
    may not contain spaces or begin with a number. You must also avoid these words
    of special significance in the JavaScript language:


