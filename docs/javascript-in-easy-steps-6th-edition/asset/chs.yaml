  \ `<script>` 元素，创建一个接收 JSON 数据的函数，并将其所有值插入表格单元格中。\n\n```javascript\nfunction fill(\
  \ cells ) {\n  const values = Object.values( cells )\n  let i = 0\n  while( i <\
  \ values.length ) {\n    document.getElementById( ‘n’ + i ).innerText =\n    values[\
  \ i ].toFixed( 2 )\n    i++\n  }\n}\n```\n\n![image](img/8b.jpg)再次保存 HTML 文档，然后通过\
  \ HTTP 重新加载网页即可在表格中看到数值。\n\n![image](img/pg165_2.jpg)\n\n## 总数值\n\n一旦空白白色表格单元格填充了数据，就可以按照此处的步骤计算并写入行合计、列合计以及总计。\n\
  \n![image](img/1b.jpg)在 `fill( cells )` 函数块的末尾，最后一个 `}` 之前，插入一个计算总计的函数调用。\n\n```javascript\n\
  total( )\n```\n\n![image](img/htmlb.jpg)\n\n`webapp.html`（续）\n\n![image](img/2b.jpg)通过初始化四个变量开始计算总计的函数。\n\
  \n```javascript\nfunction total( ) {\n  let i = 0\n  let sum = 0\n  let rownum =\
  \ 1\n  let colnum = 0\n  // 在此处插入语句。\n}\n```\n\n![image](img/3b.jpg)在函数块变量之后，插入一个循环在每行末尾的单元格中写入每行的合计。\n\
  \n```javascript\nfor ( i = 0 ; i < 15 ; i++ ) {\n  sum +=\n  parseFloat( document.getElementById(\
  \ ‘n’ + i ).innerText )\n  if ( ( i + 1 ) % 5 === 0 ) {\n    document.getElementById(\
  \ ‘rt’ + rownum ).innerText =\n    sum.toFixed( 2 )\n    rownum++\n    sum = 0\n\
  \  }\n}\n```\n\n![image](img/hot.jpg)\n\n该循环通过在字母“n”后面附加递增的索引数字来选择行单元格，选择元素 `id`\
  \ 值为 `n0`、`n1`、`n2`、`n3`、`n4`，然后是下一行的单元格。\n\n![image](img/4b.jpg)接下来，在函数块中插入一个循环，在每列底部的单元格中写入每列的合计。\n\
  \n```javascript\nwhile ( colnum !== 5 ) {\n  for ( i = 0 ; i < 15 ; i++ ) {\n  \
  \  if ( i % 5 === 0 ) sum += parseFloat(\n      document.getElementById( ‘n’ + (\
  \ i + colnum ) ).innerText )\n    )\n  }\n  colnum++\n  document.getElementById(\
  \ ‘ct’ + colnum ).innerText =\n  sum.toFixed( 2 )\n  sum = 0\n}\n```\n\n![image](img/5b.jpg)现在，在函数块中插入一个循环，在表格右下角的单元格中写入所有白色单元格的总计。\n\
  \n```javascript\nfor ( i = 0 ; i < 15 ; i++ ) {\n  sum +=\n  parseFloat( document.getElementById(\
  \ ‘n’ + i ).innerText )\n}\ndocument.getElementById( ‘gt’ ).innerText = sum.toFixed(\
  \ 2 )\n```\n\n![image](img/hot.jpg)\n\n注意 `toFixed( 2 )` 方法确保单元格值将以两位小数显示。\n\n![image](img/6b.jpg)保存更改并通过\
  \ HTTP 重新加载网页即可查看总计被写入表格。\n\n![image](img/pg167_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n该循环通过在字母“n”后面附加递增的索引数字加递增的列号来选择列单元格，选择元素 `id` 值为 `n0`、`n5`、`n10`，然后是下一列的单元格。\n\
  \n## 更新应用\n\n一旦填充了合计单元，就可以按照此处的步骤向脚本添加允许用户更新表格的表单按钮事件处理函数。\n\n![image](img/1b.jpg)开始一个初始化六个变量的函数。\n\
  \n```javascript\nfunction update( ) {\n  let row =\n  document.getElementById( ‘rownum’\
  \ ).options.selectedIndex\n  let col =\n  document.getElementById( ‘colnum’ ).options.selectedIndex\n\
  \  let newval =\n  parseFloat( document.getElementById( ‘newval’ ).value )\n  let\
  \ legend = document.getElementById( ‘legend’ )\n  let target = null\n  // 在此处插入语句。\n\
  }\n```\n\n![image](img/htmlb.jpg)\n\n`webapp.html`（续）\n\n![image](img/forget.jpg)\n\
  \n此处使用 `parseFloat( )` 函数将字符串输入转换为数字类型以便进行算术运算。\n\n![image](img/2b.jpg)接下来，在函数块中插入验证表单语句，如果无效则写入提示。\n\
  \n```javascript\nif( row === 0 ) { legend.innerText = ‘选择行’ ; return }\nif( col\
  \ === 0 ) { legend.innerText = ‘选择列’ ; return }\nif( !newval ) { legend.innerText\
  \ = ‘输入值’ ; return }\nif( isNaN( newval ) ) { legend.innerText = ‘输入数字’ ; return\
  \ }\n```\n\n![image](img/3b.jpg)现在，在函数块中将用户的有效输入进入选定的单元格，然后计算并应用新的总计。\n\n```javascript\n\
  target = ( ( row - 1 ) * 5 ) + col ) -1\ndocument.getElementById( ‘n’ + target ).innerText\
  \ =\nnewval.toFixed( 2 )\ntotal( )\n```\n\n![image](img/4b.jpg)最后，在函数块中重置表单以便进一步输入。\n\
  \n```javascript\ndocument.getElementById( ‘rownum’ ).options[ 0 ].selected = true\n\
  document.getElementById( ‘colnum’ ).options[ 0 ].selected = true\ndocument.getElementById(\
  \ ‘newval’ ).value = ‘ ‘\nlegend.innerText = ‘单元格编辑器’\n```\n\n![image](img/5b.jpg)保存\
  \ HTML 文档，然后通过 HTTP 在浏览器中打开网页并编辑单元格值以查看总计更新。\n\n![image](img/pg169_1.jpg)\n\n例如：选择第二行第一列。\n\
  \n![image](img/pg169_2.jpg)输入新值并点击按钮。\n\n![image](img/hot.jpg)当输入不完整时，可以点击按钮查看验证消息。\n\
  \n![image](img/pg169_3.jpg)看到单元格值、列合计、行合计以及总计全部更新，并看到表单重置以便再次编辑。\n\n![image](img/forget.jpg)\n\
  \n`toFixed( 2 )` 函数确保整数输入以两位小数显示。\n\n总结\n\n•JSON 是一种用于存储和交换数据的文本格式，是 JavaScript\
  \ 语言的子集。\n\n•JSON 对象在花括号内包含逗号分隔的键值对列表。\n\n•JSON 对象中的所有键必须是 String 类型。\n\n•JSON 对象中的所有值只能是\
  \ String、Number、Object、Array、Boolean 或 null 类型。\n\n•可以使用 `JSON.stringify( )` 方法将\
  \ JavaScript 对象转换为 JSON 对象。\n\n\n\n\n\n- JSON 对象可以通过 `JSON.parse()` 方法转换为 JavaScript\
  \ 对象。\n- JavaScript 是一种单线程同步语言，但浏览器 API 支持一些异步操作。\n- 事件循环（event loop）不断监控调用栈和回调队列的状态。\n\
  - `Promise` 对象代表异步操作的最终完成或失败及其产生的值。\n- `then()` 和 `catch()` 方法可以链式调用到 `Promise`\
  \ 对象，以处理异步操作的结果。\n- `Fetch API` 可以在 JavaScript 中用于通过网络异步获取资源。\n- 完成后，`fetch()` 方法返回一个包含\
  \ `HTTPResponse` 对象的 `Promise` 对象。\n- `HTTPResponse` 对象有一个 `json()` 方法，可以解析 JSON\
  \ 对象。\n- 一些函数定义可以写成更简洁的 JavaScript `=>` 箭头函数表达式。\n- 箭头函数表达式处理 JavaScript `this`\
  \ 关键字的方式与普通函数不同。\n- JSON 数据可以填充 Web 应用程序的单元格。\n\n## 9 编写脚本魔法\n\n本章演示了使用各种 API 的魔法能力。\n\
  \n- 请求数据\n- 嵌入矢量\n- 绘制画布\n- 存储数据\n- 拖拽项目\n- 传递消息\n- 定位用户\n- 总结\n\n## 请求数据\n\n异步\
  \ JavaScript 和 XML (“AJAX”)允许通过向 Web 服务器请求数据来更新 页面，而不中断其他操作。\n\n要使用 AJAX，JavaScript\
  \ 必须首先使用 `new` 关键字和 `XMLHttpRequest()` 构造函数创建一个 `XMLHttpRequest` 对象。实际请求作为该对象的 `open()`\
  \ 方法的三个参数指定——说明检索方法、一个 `URL` 以及一个使请求异步执行的布尔值 `true`。\n\n然后可以通过调用对象的 `send()` 方法来发送请求。最后，必须将事件处理程序指定给\
  \ `XMLHttpRequest` 对象的 `onreadystatechange` 属性以处理来自 Web 服务器的响应。这可以首先测试对象的 `readyState`\
  \ 属性是否为 `4` 且对象的 `status` 属性为 `200`，以确保响应确实完成且成功。\n\n通过 `XMLHttpRequest` 对象检索的文本自动存储在它的\
  \ `responseText` 属性中，但 XML 数据自动存储在 `responseXML` 属性中。DOM 将 XML 文档元素表示为“节点”，因此需要额外的步骤来访问其内容。例如，特定标签名的元素节点可以通过\
  \ `responseXML` 属性的 `getElementsByTagName()` 方法分配给数组变量。\n\n每个元素节点都有一个 `firstChild`\
  \ 属性，它是内容的文本节点。这反过来有一个 `data` 属性，包含实际的文本内容。因此，元素节点的 `firstChild.data` 属性可以揭示该 XML\
  \ 元素中的文本。\n\n![image](img/pg172_2.jpg)\n\n`books.xml`\n\n![image](img/1r.jpg)创建一个包含\
  \ 10 个 `<book>` 元素和内部（子）`<title>` 元素的 XML 文档\n\n![image](img/pg172_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n在请求的每个阶段，`readyState` 属性会被分配一个数字：\n\n- **0**: 未初始化\n- **1**: 服务器已连接\n- **2**:\
  \ 请求已接收\n- **3**: 正在处理请求\n- **4**: 响应就绪\n\n完成后，`status` 属性会被分配一个代码：\n\n- **200**:\
  \ “OK”\n- **403**: “Forbidden”\n- **404**: “Page Not Found”\n\n![image](img/forget.jpg)\n\
  \n这里的截图只显示了 10 个 `<book>` 元素中的两个，这些元素提供从 [www.ineasysteps.com/resource-centre/downloads](http://www.ineasysteps.com/resource-centre/downloads)\
  \ 下载的免费源码。\n\n![image](img/2r.jpg)创建一个包含按钮元素和空有序列表元素的 HTML 文档\n\n```html\n<button\
  \ onclick=\"loadXML()\">获取书籍</button>\n<ol id=\"list\"></ol>\n```\n\n![image](img/htmlr.jpg)\n\
  \n`xmldom.html`\n\n![image](img/3r.jpg)以一个请求 XML 数据的函数开始脚本\n\n```javascript\nfunction\
  \ loadXML() {\n  const xmlhttp = new XMLHttpRequest();\n  xmlhttp.open('GET', 'books.xml',\
  \ true);\n  xmlhttp.send();\n  xmlhttp.onreadystatechange = function() {\n    if(this.readyState\
  \ == 4 && this.status == 200)\n      getData(this)\n  }\n}\n```\n\n![image](img/4r.jpg)接下来，添加一个函数处理响应并将\
  \ XML 数据写入页面的空列表元素\n\n```javascript\nfunction getData(xml) {\n  const xmlDoc = xml.responseXML;\n\
  \  const tags = xmlDoc.getElementsByTagName('book');\n  let list = '', i = 0;\n\
  \  for (i = 0; i < tags.length; i++) {\n    list += '<li>' + tags[i].getElementsByTagName('title')[0].firstChild.data;\n\
  \  }\n  document.getElementById('list').innerHTML = list;\n}\n```\n\n![image](img/hot.jpg)\n\
  \n此处的循环的每次迭代都在获取“book.title.data”。使用 CSS，通过 `li.nth-child(even)` 选择器为列表项目赋予了交替的背景颜色。\n\
  \n![image](img/5r.jpg)将 XML 和 HTML 文档保存到 Web 服务器的“htdocs”文件夹中，然后打开网页并点击按钮，魔法般请求\
  \ XML 数据\n\n![image](img/pg173_1.jpg)\n\n![image](img/pg173_2.jpg)\n\n![image](img/common3.jpg)\n\
  \n像 HTML 文档一样，XML 文档也可以通过 W3C 的线验证工具 [validator.w3.org](http://validator.w3.org)\
  \ 进行验证\n\n## 嵌入矢量\n\n嵌入在 HTML 文档中的 SVG 图形维护了所有元素和属性的 SVG DOM 节点树。这与 HTML DOM 分离，但可以通过脚本轻松访问，允许\
  \ HTML 文档与嵌入的 SVG 图形进行交互。\n\n![image](img/pg174_1.jpg)\n\n访问 SVG DOM 的关键是首先使用 `getSVGDocument()`\
  \ 方法创建 SVG 文档的引用对象。然后可以通过以下方式访问 SVG 文档中的元素、属性和文本：\n\n![image](img/1r.jpg)创建一个带有矩形、圆形和文本的\
  \ SVG 图形\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<svg xmlns=\"http://www.w3.org/2000/svg\"\
  \ version=\"1.1\" width=\"100%\" height=\"100%\" viewBox=\"0 0 500 70\" preserveAspectRatio=\"\
  none\">\n  <rect width=\"100%\" height=\"100%\" style=\"fill:bisque;stroke-width:2;stroke:tomato\"\
  \ />\n  <text id=\"svgTxt\" x=\"10\" y=\"50\" font-family=\"sans-serif\" font-size=\"\
  30\" fill=\"tomato\">SVG Text</text>\n  <circle id=\"svgBtn\" cx=\"460\" cy=\"35\"\
  \ r=\"30\" fill=\"tomato\" cursor=\"pointer\" />\n</svg>\n```\n\n![image](img/pg174_2.jpg)\n\
  \n`banner.svg`\n\n![image](img/2r.jpg)接下来，创建一个嵌入 SVG 图形并包含文本输入字段和推送按钮的 HTML 文档\n\
  \n```html\n<embed id=\"svgDoc\" src=\"banner.svg\" type=\"image/svg+xml\" width=\"\
  500\" height=\"70\">\n<br>\n<input id=\"htmTxt\" size=\"50\">\n<button id=\"htmBtn\"\
  >发送到 SVG 文档</button>\n```\n\n![image](img/htmlr.jpg)\n\n`svgdom.html`\n\n![image](img/3r.jpg)现在，在脚本元素中为\
  \ SVG 文档和两个文档内的元素创建引用\n\n```javascript\nfunction loadSVG() {\n  const svgDoc = document.getElementById('svgDoc').getSVGDocument();\n\
  \  const svgTxt = svgDoc.getElementById('svgTxt');\n  const svgBtn = svgDoc.getElementById('svgBtn');\n\
  \  const htmTxt = document.getElementById('htmTxt');\n  const htmBtn = document.getElementById('htmBtn');\n\
  \  // 插入语句\n}\n\nonload = loadSVG;\n```\n\n![image](img/forget.jpg)\n\n注意此示例通过 `window.onload`\
  \ 事件初始化\n\n![image](img/4r.jpg)插入语句为 HTML 推送按钮指定点击事件处理函数\n\n```javascript\nhtmBtn.addEventListener('click',\
  \ function () {\n  svgTxt.lastChild.replaceWith(htmTxt.value)\n})\n```\n\n\n\n\n\
  \n![image](img/5r.jpg)然后，插入语句为 SVG 圆形指定点击事件处理函数\n\n```javascript\nsvgBtn.addEventListener(\
  \ ‘click’, function ( ) {\n  htmTxt.value = svgTxt.lastChild.wholeText\n  svgTxt.lastChild.replaceWith(\
  \ ‘SVG Text’ ) )\n```\n\n![image](img/6r.jpg)将 HTML 和 SVG 文档保存到 Web 服务器的“htdocs”文件夹中，然后在浏览器中打开网页并输入一些文本——点击按钮和圆形，查看你的文本如何在\
  \ HTML 和 SVG 之间发生魔法般地移动\n\n![image](img/pg175_1.jpg)\n![image](img/pg175_2.jpg)\n\
  ![image](img/pg175_3.jpg)\n![image](img/hot.jpg)\n\n注意，在 SVG DOM 中，实际文本包含在 SVG `<text>`\
  \ 元素的 `lastChild` 节点的 `wholeText` 属性中。\n\n![image](img/common3.jpg)\n\n在线在 **[w3.org/TR/SVG11/svgdom.html](http://www.w3.org/TR/SVG11/svgdom.html)**\
  \ 更多关于 SVG DOM 的知识。\n\n## 绘制画布 (Paint Canvas)\n\n![image](img/pg176_1.jpg)\n\n在\
  \ HTML 中，`<canvas>` 元素在页面上创建一个位图画布区域，JavaScript 可以 Canvas2D API 的方法和属性在该区域绘制形状和文本。可以轻松创建动画，只需反复清除当前画布，然后以比人眼能察觉的速度在修改后的位置重绘形状。画布动画脚本的基本组件是：\n\
  \n• 初始化 Context 对象和形状的起始位置。\n• 清空画布，然后在画布上绘制形状。\n•为下一次重绘计算新的形状位置。\n\n![image](img/1r.jpg)创建一个在\
  \ body 部分包含一个有颜色画布区域的 HTML 文档\n\n```html\n<canvas id=“canvas” width=“500” height=“150”\
  \ style=“background: Bisque; border: 2px solid Tomato”>\n[Canvas Area]\n</canvas>\n\
  ```\n\n![image](img/htmlr.jpg)\n\ncanvas.html\n\n![image](img/2r.jpg)接下来，编写一个脚本，用函数在\
  \ HTML DOM 内容加载后初始化 context 对象属性，然后用画布大小、“小球”起始位置的 X 和 Y 坐标以及它的方向步长初始化变量\n\n```javascript\n\
  function init( ) {\n  const canvas = document.getElementById( ‘canvas’ )\n  if (\
  \ canvas.getContext ) {\n    const context = canvas.getContext( ‘2d’ )\n    const\
  \ cw = canvas.width\n    const ch = canvas.height\n    let x = 5 , y = 44 , dx =\
  \ 5 , dy = 5\n    context.fillStyle = ‘Red’\n    // 在此处插入语句。\n  }\n}\n\ndocument.addEventListener(\
  \ ‘DOMContentLoaded’, init )\n```\n\n![image](img/hot.jpg)\n\n要在画布上绘制，脚本必须首先创建一个具有绘制方法和属性的\
  \ `CanvasRenderingContext2D` 对象。在这里，该对象赋值给名为 `context` 的变量。注意初始化函数会在 `DOMContentLoaded`\
  \ 事件触发时被调用。\n\n![image](img/3r.jpg)现在，插入语句每隔 25 毫秒计算新的 X 和 Y 坐标并调用函数在画布上绘制小球\n\n\
  ```javascript\nsetInterval( function( ) {\n  if ( ( x + dx > cw-30 ) || ( x + dx\
  \ < 10 ) ) dx = -dx\n  if ( ( y + dy > ch-30 ) || ( y + dy < 10 ) ) dy = -dy\n \
  \ x += dx\n  y += dy\n  paint( context, cw, ch, x, y ) } , 25 )\n```\n\n![image](img/4r.jpg)最后，添加函数以真正向画布上绘制小球\n\
  \n```javascript\nfunction paint( context, cw, ch, x, y ) {\n  context.clearRect(\
  \ 0, 0, cw, ch )\n  context.beginPath( )\n  context.arc( x, y, 30, 0, ( Math.Pi\
  \ * 2 ), true )\n  context.fill( )\n}\n```\n\n![image](img/5r.jpg)保存 HTML 文档和脚本，然后在浏览器中打开网页，查看动画小球魔法般地在画布上跳动\n\
  \n![image](img/pg177_1.jpg)\n![image](img/pg177_2.jpg)\n![image](img/hot.jpg)\n\n\
  注意当小球碰撞边界时方向步长的极性是如何反转的——这样它就不会跳出画布。\n\n![image](img/hot.jpg)\n\n创建静态背景和边框作为样式——这样它们就不需要反复绘制。\n\
  \n![image](img/common3.jpg)\n\n在线在 **[w3.org/TR/2dcontext](http://www.w3.org/TR/2dcontext)**\
  \ 更多关于 Canvas2D API 的知识。\n\n## 存储数据\n\n卓越的 Web Storage API 支持存储用户数据，它让存储用户数据变得轻而易举。它提供了\
  \ `localStorage` 对象，即使在浏览器关闭后仍保留存储的数据，以及 `sessionStorage` 对象，它只保留数据直到浏览器关闭。这些对象都具有相同存储和检索数据的方法。`setItem()`\
  \ 方法需要两个参数来指定键和要存储的数据——例如，使用 `localStorage.setItem( “Name”, “Mike” )` 中的键“Name”。然后可以通过指定键作为\
  \ `getItem()` 方法的唯一参数来检索存储的数据，或者通过指定键作为 `removeItem()` 方法的唯一参数来删除数据。此外，可以使用不带参数的\
  \ `clear()` 方法删除所有存储项。\n\n![image](img/1r.jpg)创建一个包含带有文本输入和三个按钮的 fieldset 的 HTML\
  \ 文档\n\n```html\n<fieldset> <legend id=”legend” >输入数据</legend>\n<input id=”data”\
  \ type=”text” >\n<button onclick=”store( )”>存储数据</button>\n<button onclick=”recall(\
  \ )”>召回数据</button>\n<button onclick=”remove( )”>重置</button> </fieldset>\n```\n\n\
  ![image](img/htmlr.jpg)\n\nwebstorage.html\n\n![image](img/2r.jpg)接下来，为第一个按钮创建一个事件处理函数——如果有效，则将数据保存到本地存储中\n\
  \n```javascript\nfunction store( ) {\n  let data = document.getElementById( ‘data’\
  \ ).value\n  if( data === ‘‘ ) { return false } else {\n    localStorage.setItem(\
  \ ‘ls_data’ , data )\n    document.getElementById( ‘data’ ).value = ‘‘\n    document.getElementById(\
  \ ‘legend’ ).innerText =\n    localStorage.getItem( ‘ls_data’ ) + ‘ - 已存储’ )\n \
  \ }\n}\n```\n\n![image](img/3r.jpg)接下来，为第二个按钮添加事件处理函数——从本地存储中检索并显示数据\n\n```javascript\n\
  function recall( ) {\n  if ( localStorage.getItem( ‘ls_data’ ) === null ) {\n  \
  \  document.getElementById( ‘legend’ ).innerText =\n    ‘输入数据’ ; return false }\
  \ else {\n    document.getElementById( ‘data’ ).value = ‘‘\n    document.getElementById(\
  \ ‘legend’ ).innerText =\n    ‘存储的数据：’ + localStorage.getItem( ‘ls_data’ )\n  }\n\
  }\n```\n\n![image](img/snake.jpg)\n\n`localStorage` 和 `sessionStorage` 中的所有数据都以字符串值存储——因此添加检索到的值\
  \ 5 和 7 将拼接为 57。\n\n![image](img/forget.jpg)\n\n页面必须通过 HTTP（来自 Web 服务器）提供才能使用 Web\
  \ Storage。它提供了 cookie 存储的替代方案，并提供了至少 5MB 的更大容量。\n\n![image](img/4r.jpg)最后，为第三个按钮添加事件处理函数——移除本地存储中的数据\n\
  \n```javascript\nfunction remove( ) {\n  if ( localStorage.getItem( ‘ls_data’ )\
  \ === null ) {\n    document.getElementById( ‘legend’ ).innerText =\n    ‘输入数据’\
  \ ; return false } else {\n    document.getElementById( ‘legend’ ).innerText =\n\
  \    localStorage.getItem( ‘ls_data’ ) + ‘ 已删除’\n    localStorage.remove( ‘ls_data’\
  \ )\n    document.getElementById( ‘data’ ).value = ‘‘\n  }\n}\n```\n\n\n\n\n您可以在\
  \ [www.w3.org/TR/webstorage](http://www.w3.org/TR/webstorage) 在线了解更多关于 Web Storage\
  \ API 的信息。\n\n## 拖拽项目\n\n![image](img/pg180_1.jpg)\n\nDrag-and-Drop API 支持用户拖动页面对象并将其释放到目标上。它指定了许多在用户拖动对象时触发的事件，但最重要的的是\
  \ `dragstart`、`dragover` 和 `drop` 事件。需要为这些事件中的每一个编写事件处理器：\n\n• `ondragstart` 事件处理器\
  \ – 用于指定在拖拽开始时附加到被拖拽对象上的 `Text` 数据。\n• `ondragover` 事件处理器 – 用于取消释放目标的默认行为，从而允许将对象释放到其上。\n\
  • `ondrop` 事件处理器 – 用于定义当对象被释放到释放目标时应该发生什么。\n\n此外，`ondrop` 事件处理器通常应该确保目标本身不会被拖拽到自身：\n\
  \n![image](img/1r.jpg)创建一个 HTML 文档，其中包含一个带有图片的段落以及 fieldset 中的一个空列表\n\n```html\n\
  <p>\n<img id=\"bin\" src=\"bin.png\" alt=\"Bin\">\n<img class=\"folder\" id=\"Red\"\
  \ src=\"red.png\" alt=\"Folder\">\n<img class=\"folder\" id=\"Yellow\" src=\"yel.png\"\
  \ alt=\"Folder\">\n<img class=\"folder\" id=\"Green\" src=\"grn.png\" alt=\"Folder\"\
  >\n</p>\n<fieldset>\n<legend>Folders Dropped:</legend>\n<ol id=\"list\"></ol>\n\
  </fieldset>\n```\n\n![image](img/pg180_2.jpg)\n\n![image](img/htmlr.jpg)\n\ndragndrop.html\n\
  \n![image](img/2r.jpg)编写一个脚本，在 DOM 完全加载后通过一个语句添加事件监听器\n\n```javascript\ndocument.addEventListener('DOMContentLoaded',\
  \ dragNdrop)\n```\n\n![image](img/3r.jpg)接下来，创建事件处理器函数，该函数首先获取对图片和列表元素的引用\n\n```javascript\n\
  function dragNdrop() {\n    const bin = document.getElementById('bin');\n    const\
  \ folders = document.getElementsByClassName('folder');\n    const list = document.getElementById('list');\n\
  \    // Statements to be inserted here.\n}\n```\n\n![image](img/4r.jpg)现在，插入语句为每个文件夹图片附加事件处理器，并取消\
  \ bin 的默认行为\n\n```javascript\nlet i = 0;\nfor(i = 0; i < folders.length; i++) {\n\
  \    folders[i].ondragstart = function(event) {\n        event.dataTransfer.setData('Text',\
  \ this.id)\n    }\n}\nbin.ondragover = function(event) { return false }\n```\n\n\
  ![image](img/5r.jpg)最后，插入语句来获取被拖拽文件夹的 id 和元素引用，然后（除非是 bin）将其 id 写入列表并删除该文件夹图片\n\n\
  ```javascript\nbin.ondrop = function(event) {\n    const did = event.dataTransfer.getData('Text');\n\
  \    const tag = document.getElementById(did);\n    if (did === 'bin') { return\
  \ false }\n    else { list.innerHTML += '<li>' + did }\n    tag.parentNode.removeChild(tag)\n\
  }\n```\n\n![image](img/6r.jpg)保存 HTML 文档，然后在浏览器中打开它，神奇地将文件夹拖入垃圾桶中\n\n![image](img/pg181_1.jpg)\n\
  \n![image](img/pg181_2.jpg)\n\n![image](img/hot.jpg)\n\n注意 `dragstart` 事件的 `dataTransfer.setData()`\
  \ 方法的参数指定了数据格式和实际数据——在这种情况下是“Text”格式和被拖拽元素的 `id`。\n\n![image](img/common3.jpg)\n\
  \n您可以在 [dev.w3.org/html5/spec/dnd.html](http://dev.w3.org/html5/spec/dnd.html) 在线了解更多关于\
  \ Drag-and-Drop API 的信息。\n\n## 传递消息\n\nMessaging API 支持在文档之间发送纯文本消息。要向另一个文档发送消息，发送者可以在目标窗口引用（例如\
  \ `iframe` 元素）调用 `postMessage()`。接收者监听 `message` 事件并处理来自 `event` 对象的数据。出于安全考虑，接收者应该始终使用\
  \ `event.origin` 验证发送者的来源。\n\n```javascript\n// 发送端\nconst cage = document.getElementById('cage').contentWindow;\n\
  cage.postMessage('Hello from sender', 'http://localhost');\n```\n\n```javascript\n\
  // 接收端\nwindow.addEventListener('message', function(event) {\n    if (event.origin\
  \ === 'http://localhost') {\n        document.getElementById('msg').innerText =\
  \ event.data;\n    }\n});\n```\n\n## 定位用户\n\n强大的 Geolocation API 支持精确定用户的地理位置。它首先请求用户同意共享位置详情——例如，将附近的无线访问点和计算机的\
  \ IP 地址信息发送给 Google 位置服务。该服务返回用户估计的纬经度坐标。成功获取的坐标可以显示在页面上，并提供给 Google Maps 服务以获取该位置的地图。\n\
  \n在 body 部分创建一个包含两个固定大小段落的 HTML 文档：\n\n```html\n<p id=\"msg\" style=\"width:450px;height:50px;\"\
  ></p>\n```\n\n\n\n\n<p id=\"map\" style=\"width:450px;height:200px\"></p>\n\n![image](img/htmlr.jpg)\n\
  \ngeolocation.html\n\n接下来，在文档的头部（head）部分添加一个元素来获取 Google Maps API\n\n```html\n<script\
  \ src=\"https://maps.googleapis.com/maps/api/js?key=API_KEY\"></script>\n```\n\n\
  ![image](img/3r.jpg)\n\n现在，在文档的主体（body）部分结尾开始一个脚本，包含一个在 HTML 文档加载后尝试获取用户位置函数\n\n\
  ```javascript\nfunction init( ) {\n  if ( navigator.geolocation ) {\n    document.getElementById(\
  \ ‘msg’ ).innerText = ‘Geolocation service is trying to find you...’\n    navigator.geolocation.getCurrentPosition(\
  \ success , fail )\n  } else {\n    document.getElementById( ‘msg’ ).innerText =\
  \ ‘Your browser does not support Geolocation service’\n  }\n}\ndocument.addEventListener(\
  \ ‘DOMContentLoaded’, init )\n```\n\n![image](img/4r.jpg)\n\n然后，添加一个函数在尝试失败时显示消息\n\
  \n```javascript\nfunction fail( position ) {\n  document.getElementById( ‘msg’ ).innerText\
  \ = ‘Geolocation service cannot find you at this time’\n}\n```\n\n![image](img/forget.jpg)\n\
  \n在此示例中，`navigator.geolocation` 对象提供了 `getCurrentPosition()` 方法，该方法必须指定函数来处理成功和失败。这些函数必须都接受一个返回的\
  \ `position` 对象参数，因为其中包含了坐标或错误详情。\n\n![image](img/5r.jpg)\n\n最后，添加一个成功函数，在尝试成功时显示获取到的坐标和地图\n\
  \n```javascript\nfunction success( position ) {\n  const lat = position.coords.latitude\n\
  \  const lng = position.coords.longitude\n  document.getElementById( ‘msg’ ).innerHTML\
  \ = ‘Found you at...<br>Latitude: ‘ + lat + ‘ , Longitude: ‘ + lng\n  const latlng\
  \ = new google.maps.LatLng( lat , lng )\n  const options = { zoom: 18 , center :\
  \ latlng , mapTypeId: google.maps.MapTypeId.ROADMAP }\n  const map = new google.maps.Map(\
  \ document.getElementById( ‘map’ ) , options )\n  const marker = new google.maps.Marker(\
  \ { position: latlng , map: map , title: ‘You are here’ } )\n}\n```\n\n![image](img/6r.jpg)\n\
  \n将 HTML 文档保存在本地 Web 服务器的“htdocs”文件夹中，然后打开网页并允许获取您的位置——即可神奇地精准定位\n\n![image](img/pg185_1.jpg)\n\
  \n![image](img/pg185_2.jpg)\n\n![image](img/hot.jpg)\n\n要重现此示例，你首先需要在 [cloud.google.com](http://cloud.google.com)\
  \ 登录在线 Google Cloud 并创建一个项目。然后，为你的项目启用 Maps JavaScript API 并获取 API 密钥。将步骤 2 中的 `API_KEY`\
  \ 替换为你自己的密钥以运行该示例。\n\n![image](img/common3.jpg)\n\n可以在 [dev.w3.org/geo/api](http://dev.w3.org/geo/api)\
  \ 在线发现更多关于 Geolocation API 的信息。\n\n## 总结\n\n- AJAX 允许网页通过从 Web 服务器请求数据来更新，而不会中断其他操作。\n\
  - 成功的 `XMLHttpRequest` 将文本存储在 `responseText` 属性中，并将 XML 数据存储在 `responseXML` 属性中。\n\
  - 嵌入 HTML 文档的 SVG 图形维护其所有元素和属性的 SVG DOM 节点树。\n- `getSVGDocument()` 方法创建 SVG 文档元素、属性和文本的引用对象。\n\
  - Canvas2D API 提供了可以在画布区域绘制形状和文本的方法和属性。\n- `getContext()` 方法创建画布区域的引用对象。\n- Web\
  \ Storage API 提供了长期的 `localStorage` 对象和用于临时存储的 `sessionStorage` 对象。\n- 使用 `setItem()`\
  \ 方法可以将项目存储在 `localStorage` 或 `sessionStorage` 中，并指定键和数据。\n- 拖放 API 允许用户拖动页面对象并将其到到目标。\n\
  - 需要为 `dragstart`、`dragover` 和 `drop` 事件编写脚本，以创建拖放界面。\n- Messaging API 允许在文档之间安全地发送纯文本消息——即使是不同域的文档。\n\
  - 要接收消息，接收方文档必须正确识别托管发送文档的域。\n- Geolocation API 提供了在用户同意共享位置详情时精准定位用户位置的能力。\n- Google\
  \ Location Services 返回用户估计的纬度和经度坐标。\n- 坐标可以显示在页面上并提供给 Google Maps 以获取该位置地图。\n\n\
  ![image](img/bm1.jpg)\n\n![image](https://iescourses.com/)\n\n![image](img/bm2.jpg)\n\
  \n![image](img/bcover.jpg)\n\n"
