  \ – 阐述响应式 Web 应用和 JavaScript 对象表示法（JSON）技术。\n\n### 引入脚本\n\n要在 HTML 文档中直接包含 JavaScript\
  \ 代码，必须将其插入 `<script>` 和 `</script>` 标签之间，如下：\n\n```html\n<script>\ndocument.getElementById(\
  \ ‘message’ ).innerText = ‘Hello World!’\n</script>\n```\n\nHTML 文档可以包含多个脚本，这些脚本可以放置在文档的\
  \ `head` 或 `body` 部分。然而，建议将脚本放在 `body` 部分的末尾（紧接 `</</body>` 结束标签之前），这样浏览器在解释脚本之前可以先渲染网页。\n\
  \nJavaScript 代码也可以写在具有 `.js` 文件扩展名的外部纯文本文件中。这允许多个不同的网页页面调用同一个脚本。若要在 HTML 文档中引入外部脚本，必须将脚本的文件赋值给\
  \ `<script>` 标签的 `src` 属性，如下：\n\n```html\n<script src=”external_script.js”> </script>\n\
  ```\n\n同样，这可以放置在文档的 `head` 或 `body` 部分，浏览器会将该脚本视为直接写在 HTML 文档中该位置。\n\n仅将外部脚本的文件赋值给\
  \ `<script>` 标签的 `src` 属性需要脚本文件与 HTML 文档位于同一个文件夹（目录）。如果脚本位于相邻的文件夹，你可以分配文件的相对路径地址，如下：\n\
  \n```html\n<script src=”js/external_script.js”> </script>\n```\n\n如果脚本位于其他地方，你可以分配文件的绝对路径地址，如下：\n\
  \n```html\n<script src=”https://www.example.com/js/external_script.js”>\n</script>\n\
  ```\n\n你还可以通过在 HTML 文档的 `body` 中包含 `<noscript>` 元素来指定用户在浏览器中禁用 JavaScript 时才会显示的内容，如下：\n\
  \n```html\n<noscript>JavaScript is Not Enabled!</noscript>\n```\n\n![image](img/hot.jpg)\n\
  \n你可能会在`<script>` 标签中看到 `type=”text/javascript”` 属性，但这不再是需要的，因为 JavaScript 现在是 HTML\
  \ 的默认脚本语言。\n\n![image](img/snake.jpg)\n\n在外部 JavaScript 文件中不要包含 `<script>` 和 `</script>`\
  \ 标签，只包含脚本代码。\n\n![image](img/forget.jpg)\n\n外部脚本文件可以使代码维护变得更容易，但为了清晰起见，书中几乎所有的示例都是独立的，因此请直接在\
  \ HTML 文档的标签之间包含脚本代码。\n\n### 控制台输出\n\nJavaScript 可以通过动态向 HTML 元素写入内容来显示输出。例如，使用这段代码：\n\
  \n```javascript\ndocument.getElementById( ‘message’ ).innerText = ‘Hello World!’\n\
  ```\n\n该元素通过赋值给其 `id` 属性的值来识别，`innerText` 属性指定写入该处的文本。\n\n![image](img/pg10_1.jpg)\n\
  \n此外，JavaScript 还可以通过将内容写入弹出对话框来显示输出，如下：\n\n```javascript\nwindow.alert( ‘Hello\
  \ World!’ )\n```\n\n这调用了 `window` 对象的 `alert()` 方法，在对话框中显示 `()` 括号内指定的内容。\n\n![image](img/pg10_2.jpg)\n\
  \n在开发 JavaScript 和学习该语言时，最初最好在浏览器的 JavaScript 控制台中显示输出，如下：\n\n```javascript\nconsole.log(\
  \ ‘Hello World!’ )\n```\n\n这调用了 `console` 对象的 `log()` 方法，在控制台窗口中显示 `()` 括号内指定的内容。所有主流浏览器在其开发者工具中都有\
  \ JavaScript 控制台——通常通过按 F12 键访问。由于 Google Chrome Web 浏览器在编写时统计上是最流行的浏览器，书中全程用于演示\
  \ JavaScript，并最初使用其控制台窗口显示输出。\n\n![image](img/hot.jpg)\n\n注意使用 `.`（句号）运算符通过“点点表示法”来描述对象的属性或方法。\n\
  \n![image](img/snake.jpg)\n\n还有一个 `document.write()` 方法，它可以替换网页的整个头部和正文，但其使用通常被认为是坏做法。\n\
  \n![image](img/hot.jpg)\n\n如果代码中发生错误，控制台会提供有用的信息——因此非常适合调试代码。\n\n![image](img/1b.jpg)创建一个\
  \ HTML 文档，其中包含一个空段落和一个以三种方式显示输出的脚本。\n\n```html\n<p id=”message”></p>\n<script>\n\
  document.getElementById( ‘message’ ).innerText = ‘Hello World!’\nwindow.alert( ‘Hello\
  \ World!’ )\nconsole.log( ‘Hello World!’ )\n</script>\n```\n\n![image](img/htmlb.jpg)\n\
  \noutput.html\n\n![image](img/2b.jpg)保存 HTML 文档然后在浏览器中打开它，查看在段落中写入并在对话框中显示的输出——如侧所示\n\
  \n![image](img/3b.jpg)接下来，按下 F12 键，或使用浏览器的菜单打开开发者工具功能\n\n![image](img/4b.jpg)现在，选择\
  \ Console 标签以查看写入控制台窗口的输出\n\n![image](img/pg11_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n看到控制台显示了输出以及 HTML 文档名称和创建输出的 JavaScript 代码所在的行号。\n\n![image](img/5b.jpg)点击![image](img/pg11_3.jpg)\
  \ 显示/隐藏按钮来隐藏或显示侧边栏，点击自定义按钮选择控制台窗口在浏览器窗口中的停靠方式，然后点击![image](img/pg11_4.jpg) 清除按钮清除控制台中的所有内容\n\
  \n![image](img/pg11_2.jpg)\n\n### 语句\n\nJavaScript 代码由一系列称为“语句”的指令组成，当浏览器 JavaScript\
  \ 引擎处理脚本时，它们通常按从到下的顺序执行。\n\n每个语句都可能包含以下任何组件：\n\n- **关键字** – 在 JavaScript 语言中具有特殊意义的单词。\n\
  - **运算符** – 对一个或多个操作数执行操作的特殊字符。\n- **值** – 文本字符串、数字、布尔值 `true` 或 `false`、`undefined`\
  \ 和 `null`。\n- **表达式** – 产生单个值的代码单元。\n\n在早期的 JavaScript 代码中，每条语句都必须以 `;` 分号字符结束——就像英语中的每个句子都必须以\
  \ `.`（句号）字符结束一样。现在这是可选的，所以除非你想在一行中编写多条语句，否则可以省略。在这种情况下，语句确实需要用分号分隔，如下：\n\n```javascript\n\
  statement ; statement ; statement\n```\n\n一些 JavaScript 程序员仍然倾向于在每条语句结束加上分号。书中的示例为了简洁省略了它们，但选择权在于你。\n\
  \nJavaScript 解释器会忽略制表符和空格（“空白字符”），因此你应该使用间距来提高代码的可读性。例如，当两个数字相加时：\n\n```javascript\n\
  total = 100 + 200\n```\n\n而不是 `total=100+200`\n\nJavaScript 语句通常分组在函数块中的 `{ }` 大括号（大括号），这些块可以在需要时被重复调用。良好的做法是将这些语句缩进两个空格以提高可读性，如下：\n\
  \n```javascript\n{\nstatement\nstatement\nstatement\n}\n```\n\n![image](img/hot.jpg)\n\
  \nJavaScript 关键字将在此处，你稍后将学习运算符、值和表达式。\n\n![image](img/forget.jpg)\n\n“表达式”产生一个值，而“语句”执行一个动作。\n\
  \n![image](img/snake.jpg)\n\n使用空格键来缩进语句，因为在文本编辑器中查看代码时，制表符间距可能会被不同的处理。\n\n\n\n\n\
  \n管理 JavaScript 语言的规则被称为“语法”（syntax），它识别两种值——固定值和变量。固定的数值和文本字符串值被称为“字面量”（literals）：“\n\
  \n*   **数字字面量** – 整数，如 `100`，或浮点数如 `3.142`。\n*   **字符串字面量** – 位于双引号内的文本，如 `“JavaScript\
  \ Fun”`，或单引号内的文本，如 `‘JavaScript Fun’`。\n\n变量值简单来说被称为“变量”，用于在脚本中存储数据。可以使用 JavaScript\
  \ 的 `let` 关键字创建变量——例如，`let total` 会创建一个名为“total”的变量。可以使用 JavaScript 的 `=` 赋值运算符为变量赋值以存储，如下所示：\n\
  \n```javascript\nlet total = 300\n```\n\n可以使用其他 JavaScript 运算符形成表达式，这些表达式将求出一个单一值。通常，一个表达式可以包含在\
  \ `( )` 括号内，如下所示由数字和 JavaScript 的 `+` 加法运算符组成的表达式，其求值为单一 100：\n\n```javascript\n\
  ( 80 + 20 )\n```\n\n表达式也可能包含变量值，如下所示由之前的变量值、JavaScript 的 `-` 减法运算符和一个数字组成的表达式，其求值为单一\
  \ 100：\n\n```javascript\n( total - 200 )\n```\n\nJavaScript 是一种区分大小写的语言，因此名为 `total`\
  \ 和 `Total` 的变量被视为两个完全不同的变量。\n\n在 JavaScript 代码中添加解释性注释是一个良好的习惯，这可以让其他人更容易理解代码，也能让你以后回顾代码时更容易理解。出现在\
  \ `//` 双斜杠之后的单行，或出现在一行或多行 `/*` 和 `*/` 字符序列之间的任何内容都会被忽略。\n\n```javascript\nlet total\
  \ = 100 // 这代码将会被执行。\n\n/* let total = 100\n这段代码将不会被执行。 */\n```\n\n![image](img/hot.jpg)\n\
  \n决定在代码的字符串字面量中使用哪一种引号形式，并保持一致性。本书中的示例使用单引号。\n\n![image](img/hot.jpg)\n\n在调试代码时，“注释掉”某些代码行以防止其执行通常很有用。\n\
  \n### 避免关键字\n\n![image](img/pg14_1.jpg)\n\n在 JavaScript 代码中，你可以为变量和函数选择自己的名称。名称应该具有意义并反映变量或函数的用途。你的名称由字母、数字和下划线组成，但不能包含空格或以数字开头。你还必须避免这些\
  \ JavaScript 语言中具有特殊意义的词：\n\n| JavaScript 关键字 | | | | |\n| :--- | :--- | :--- |\
  \ :--- |\n| `abstract` | `arguments` | `await` | `boolean` |\n| `break` | `byte`\
  \ | `case` | `catch` |\n| `char` | `class` | `const` | `continue` |\n| `debugger`\
  \ | `default` | `delete` | `do` |\n| `double` | `else` | `enum` | `eval` |\n| `export`\
  \ | `extends` | `false` | `final` |\n| `finally` | `float` | `for` | `function`\
  \ |\n| `goto` | `if` | `implements` | `import` |\n| `in` | `instanceof` | `int`\
  \ | `interface` |\n| `let` | `long` | `native` | `new` |\n| `null` | `package` |\
  \ `private` | `protected` |\n| `public` | `return` | `short` | `static` |\n| `super`\
  \ | `switch` | `synchronized` | `this` |\n| `throw` | `throws` | `transient` | `true`\
  \ |\n| `try` | `typeof` | `var` | `void` |\n| `volatile` | `while` | `with` | `yield`\
  \ |\n\n| JavaScript 对象、属性和方法 | | | |\n| :--- | :--- | :--- | :--- |\n| `Array` |\
  \ `Date` | `eval` | `function` |\n| `hasOwnProperty` | `Infinity` | `isFinite` |\
  \ `isNaN` |\n| `isPrototypeOf` | `length` | `Math` | `NaN` |\n| `name` | `Number`\
  \ | `Object` | `prototype` |\n| `String` | `toString` | `undefined` | `valueOf`\
  \ |\n\n| HTML 名称、窗口对象和属性 | | | | |\n| :--- | :--- | :--- | :--- |\n| `alert` | `all`\
  \ | `anchor` | `anchors` |\n| `area` | `assign` | `blur` | `button` |\n| `checkbox`\
  \ | `clearInterval` | `clearTimeout` | `clientInformation` |\n| `close` | `closed`\
  \ | `confirm` | `constructor` |\n| `crypto` | `decodeURI` | `decodeURIcomponent`\
  \ | `defaultStatus` |\n| `document` | `element` | `elements` | `embed` |\n| `embeds`\
  \ | `encodeURI` | `encodeURIcomponent` | `escape` |\n| `event` | `fileUpload` |\
  \ `focus` | `form` |\n| `forms` | `frame` | `innerHeight` | `innerWidth` |\n| `layer`\
  \ | `layers` | `link` | `location` |\n| `mimeTypes` | `navigate` | `navigator` |\
  \ `frames` |\n| `frameRate` | `hidden` | `history` | `image` |\n| `images` | `offscreenBuffering`\
  \ | `open` | `opener` |\n| `option` | `outerHeight` | `outerWidth` | `packages`\
  \ |\n| `pageXOffset` | `pageYOffset` | `parent` | `parseFloat` |\n| `parseInt` |\
  \ `password` | `pkcs11` | `plugin` |\n| `prompt` | `propertyIsEnum` | `radio` |\
  \ `reset` |\n| `screenX` | `screenY` | `scroll` | `secure` |\n| `select` | `self`\
  \ | `setInterval` | `setTimeout` |\n| `status` | `submit` | `taint` | `text` |\n\
  | `textarea` | `top` | `unescape` | `untaint` |\n| `window` | | | |\n\n| HTML 事件属性\
  \ | 示例： | | | |\n| :--- | :--- | :--- | :--- |\n| `onclick` | `ondblclick` | `onfocus`\
  \ | `onfocusout` |\n| `onkeydown` | `onkeypress` | `onkeyup` | `onload` |\n| `onmousedown`\
  \ | `onmouseup` | `onmouseover` | `onmouseout` |\n| `onmousemove` | `onchange` |\
  \ `reset` | `submit` |\n\n### 存储值\n\n![image](img/box.jpg)\n\n“变量”是每种脚本语言通用的容器，可以在其中存储和检索数据。与大多数语言中的“强类型”变量不同（它们必须声明包含的特定类型），JavaScript\
  \ 变量要容易得多，因为它们是“松类型”的——它们可以包含任何类型的数据：\n\n| 数据类型 | 示例 | 描述 |\n| :--- | :--- | :---\
  \ |\n| 字符串 | `‘Hello World!’` | 字符字符串 |\n| 数字 | `3.142` | 整数或浮点数 |\n| 布尔 | `true`\
  \ | 真 (1) 或 假 (0) 值 |\n| 对象 | `console` | 用户定义或内置对象 |\n| 函数 | `log()` | 用户定义函数、内置函数或对象方法\
  \ |\n| Symbol | `Symbol()` | 唯一的属性标识符 |\n| null | `null` | 绝对的一无所有 |\n| undefined\
  \ | `undefined` | 未配置的属性 |\n\nJavaScript 变量可以使用 `let`、`const` 或 `var` 关键字后跟一个空格和你选择的名称来声明。`let`\
  \ 变量声明可能只是创建一个可以被赋值的变量，也可能包含一个赋值来“初始化”变量的值：\n\n```javascript\nlet myNumber // 声明变量。\n\
  myNumber = 10 // 初始化变量。\nlet myString = ‘Hello World!’ // 声明并初始化变量。\n```\n\n也可以在同一行声明多个变量：\n\
  \n```javascript\nlet i, j, k // 声明 3 个变量。\nlet num = 10, char = ‘C’ // 声明并初始化 2\
  \ 个变量。\n```\n\n用 `let` 声明的变量可以在脚本执行过程中重新赋予新值，而 `const`（常量）不能。`var` 关键字在 `let` 关键字引入之前已用于\
  \ JavaScript，但现在最好，因为它不会阻止你重复声明同一个变量。\n\n常量变量必须在声明时初始化：\n\n```javascript\nconst\
  \ myName = ‘Mike’\n```\n\n![image](img/forget.jpg)\n\n变量名是其包含值的别名——在脚本中使用名称即是引用其存储的值。\n\
  \n\n\n\n\n在初始化时，JavaScript 会自动为赋值的值设置变量类型。在脚本后续部分，可以通过赋值不同的数据类型来更改变量类型。可以使用 `typeof`\
  \ 关键字显示当前的变量类型。\n\n![image](img/1b.jpg)\n创建一个 HTML 文档，并在其中包含脚本，声明几个赋值了不同数据类型的变量\n\
  \n```javascript\nconst firstName = ‘Mike’\nconst valueOfPi = 3.142\nlet isValid\
  \ = true\nlet jsObject = console\nlet jsMethod = console.log\nlet jsSymbol = Symbol(\
  \ )\nlet emptyVariable = null\nlet unusedVariable\n```\n\n![image](img/htmlb.jpg)\n\
  \nvariables.html\n\n![image](img/2b.jpg)\n添加语句来输出每个变量的数据类型\n\n```javascript\nconsole.log(\
  \ ‘firstName: ‘ + typeof firstName )\nconsole.log( ‘valueOfPi: ‘ + typeof valueOfPi\
  \ )\nconsole.log( ‘isValid: ‘ + typeof isValid )\nconsole.log( ‘jsObject: ‘ + typeof\
  \ jsObject )\nconsole.log( ‘jsMethod: ‘ + typeof jsMethod )\nconsole.log( ‘jsSymbol:\
  \ ‘ + typeof jsSymbol )\nconsole.log( ‘emptyVariable: ‘ + typeof emptyVariable )\n\
  console.log( ‘unusedVariable: ‘ + typeof unusedVariable )\n```\n\n![image](img/3b.jpg)\n\
  保存 HTML 文档，然后在浏览器中打开它并启动控制台查看输出的数据类型\n\n![image](img/pg17_1.jpg)\n\n![image](img/snake.jpg)\n\
  \n你可能会惊讶地发现，赋值为 `null` 值的变量被描述为 `object` 类型，而不是 `null` 类型。这是 JavaScript 语言中的已知错误。\n\
  \n![image](img/hot.jpg)\n\n这里使用了拼接运算符 `+` 来输出组合后的文本字符串。\n\n## 创建函数\n\n函数表达式简单来说就是成组在\
  \ `{}` 大括号中以便执行的一个或多个语句，并且它返回一个最终的单一值。函数可以根据脚本需要被调用以执行其语句。属于对象的函数（例如 `console.log()`）被称为“方法”——以将其与内置函数和用户定义函数区分开来。两者都有末尾的括号，可以接收“参数”值并传递给函数进行处理——例如，在\
  \ `console.log()` 方法的括号中传递的参数。\n\n![image](img/pg18_1.jpg)\n\n传递给函数的参数数量通常必须与函数块声明括号内指定的“参数”数量匹配。例如，一个需要恰好一个参数的用户定义函数看起来如下：\n\
  \n```javascript\nfunction *function-name* ( *parameter* ) {\n// 在此处编写要执行的语句。\n}\n\
  ```\n\n多个参数可以以逗号分隔列表的形式指定，你可以选择指定一个默认值，当函数调用未传递参数时使用该值，如下：\n\n```javascript\nfunction\
  \ *function-name* ( *parameter , parameter* = *value* ) {\n// 在此处编写要执行的语句。\n}\n\
  ```\n\n你遵循与变量名相同的命名规范来选择自己的参数名。这些参数名可以在函数内部使用，引用从函数调用括号传递的参数值。\n\n函数块可以包含一个 `return`\
  \ 语句，以便脚本流在调用者处继续——函数中的后续语句将不再执行。通常的做法是将处理过的传递参数值的结果返回给调用者：\n\n```javascript\nfunction\
  \ *function-name* ( *parameter , parameter* ) {\n// 在此处编写要执行的语句。\nreturn *result*\n\
  }\n```\n\n函数块内的语句包含对其他函数的调用是很常见的——以便将脚本模块化为块。\n\n![image](img/hot.jpg)\n\n注意函数声明的首选格式是将左大括号\
  \ `{` 放在与 `function` 关键字同一行。\n\n![image](img/hot.jpg)\n\n你可以省略 `return` 语句，或者在不指定值的情况下使用\
  \ `return` 关键字，函数将简单向调用者返回一个 `undefined` 值。\n\n![image](img/1b.jpg)\n创建一个 HTML 文档，并在其中包含脚本，声明一个返回所传参数平方值的函数\n\
  \n```javascript\nfunction square ( arg ) {\nreturn arg * arg\n}\n```\n\n![image](img/htmlb.jpg)\n\
  \nfunctions.html\n\n![image](img/2b.jpg)\n接下来，添加一个返回加法结果的函数\n\n```javascript\nfunction\
  \ add ( argOne, argTwo = 10 ) {\nreturn argOne + argTwo\n}\n```\n\n![image](img/3b.jpg)\n\
  现在，通过调用上述每个函数，添加一个返回平方和加法结果的函数\n\n```javascript\nfunction squareAdd ( arg ) {\n\
  let result = square( arg )\nreturn result + add( arg )\n}\n```\n\n![image](img/4b.jpg)\n\
  最后，添加调用函数并将返回值打印在输出字符串中的语句\n\n```javascript\nconsole.log( ‘8 x 8: ‘ + square( 8\
  \ ) )\nconsole.log( ‘8 + 20: ‘ + add( 8, 20 ) )\nconsole.log( ‘8 + 10: ‘ + add(\
  \ 8 ) )\nconsole.log( ‘(8 x 8) + (8 + 10): ‘ + squareAdd( 8 ) )\n```\n\n![image](img/forget.jpg)\n\
  \n注意当调用者只传递一个参数值时，这里使用了默认的第二个参数值（10）。\n\n![image](img/5b.jpg)\n保存 HTML 文档，然后在浏览器中打开它并启动控制台查看函数返回值\n\
  \n![image](img/pg19_1.jpg)\n\n![image](img/hot.jpg)\n\n`*` 星号字符是 JavaScript 中的算术乘法运算符。\n\
  \n## 分配函数\n\n函数在 JavaScript 中非常有用，因为它们可以在需要时被调用（“触发”）以执行其语句，调用者可以传递不同的参数以返回不同的结果。\n\
  \n重要的是，JavaScript 的 `()` 括号运算符是调用语句中实际调用函数的组件。这意味着语句可以通过仅指定函数名将函数赋值给变量。然后该变量可以在指定变量名后跟\
  \ `()` 运算符的语句中用于调用该函数。但请注意，如果你尝试通过指定函数名后跟 `()` 将函数赋值给变量，该函数将被调用，该函数返回的值将被赋值。\n\n\
  ![image](img/forget.jpg)\n\n在将命名函数赋值给变量时，仅在语句中指定函数名。\n\n## 函数提升\n\n尽管 JavaScript\
  \ 解释器从上到下读取脚本，但它实际上进行了两次扫描。第一次扫描寻找函数声明并记住找到任何项，这一过程被称为“提升”。第二次扫描是解释器实际执行脚本时。提升允许函数调用出现在函数声明之前，因为解释器在第一次扫描时已经识别了函数。然而，第一次扫描不会识别使用\
  \ `let` 或 `const` 关键字赋值给变量的函数！\n\n![image](img/hot.jpg)\n\n使用旧 `var` 关键字声明的变量也会提升，但使用\
  \ `let` 或 `const` 声明的变量不会。\n\n## 匿名函数\n\n将函数赋值给变量时，可以省略函数名，因为函数可以在指定变量名和 `()` 运算符的语句中调用。这些被称为匿名函数表达式，其语法如下：\n\
  \n```javascript\nlet *variable* = function ( *parameters* ) { *statements* ; return\
  \ *value* }\n```\n\n匿名函数表达式还可以通过整个函数封装在 `()` 括号内并在表达式末尾添加 `()` 括号运算符变为“自执行”。这意味着它们的语句在浏览器首次加载脚本时会自动执行一次。自执行函数表达式的语法如下：\n\
  \n```javascript\n**( function ( ) { *statements* ; return *value* } ) ( )\n```\n\
  \n\n\n\n\n自调用函数（Self-invoking functions）在本书中广泛用于在脚本加载时执行示例代码。\n\n![image](img/hot.jpg)\n\
  \n自调用函数表达式也称为立即执行函数表达式（Immediately Invoked Function Expressions，简称 IIFE – 通常读作“iffy”）。\n\
  \n![image](img/1b.jpg)创建一个 HTML 文档，其中脚本调用了一个尚未定义的函数\n\n```javascript\nconsole.log(\
  \ ‘Hoisted: ‘ + add( 100, 200 ) )\n```\n\n![image](img/htmlb.jpg)\n\nanonymous.html\n\
  \n![image](img/2b.jpg)接下来，在上方调用的函数下方添加\n\n```javascript\nfunction add( numOne, numTwo\
  \ ) {\n  return numOne + numTwo\n}\n```\n\n![image](img/3b.jpg)现在，添加一个将上述函数赋值给变量并调用该被赋值函数\n\
  \n```javascript\nlet addition = add\nconsole.log( ‘Assigned: ‘ + addition( 32, 64\
  \ ) )\n```\n\n![image](img/4b.jpg)然后，将一个类似的但匿名函数赋值给变量并调用该被赋值的函数\n\n```javascript\n\
  let anon = function ( numOne, numTwo ) {\n  let result = numOne + numTwo ; return\
  \ result\n}\nconsole.log( ‘Anonymous: ‘ + anon( 9, 1 ) )\n```\n\n![image](img/5b.jpg)最后，将自调用函数的返回值赋值给变量并显示该值\n\
  \n```javascript\nlet iffy = ( function ( ) {\n  let str = ‘Self Invoked Output’\
  \ ; return str\n} ) ( )\nconsole.log( iffy )\n```\n\n![image](img/6b.jpg)保存 HTML\
  \ 文档，然后在浏览器中打开它并启动控制台以查看函数返回的值\n\n![image](img/pg21_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n自调用函数的意义可能不会立而易见，但到本章结束时，它们的重要性应该变得清晰。\n\n## 识别作用域\n\n变量在脚本中的可访问范围取决于它们的“词法作用域”（lexical\
  \ scope）——即变量创建的环境。这可以是“全局的”，也可以是“局部的”。\n\n![image](img/pg22_1.jpg)\n\n### 全局作用域\n\
  \n在函数块外部创建的变量在整个脚本范围内全局可用。这意味着它们持续存在，并对同一脚本环境中的函数可用。初看之下这可能非常方便，但它有一个非常严重的缺点：同名的变量可能会发生冲突。例如，假设你创建了一个全局变量\
  \ `myName` 并赋值了你的名字，但随后又包含了一个外部脚本，另一个开发者在脚本中也创建了一个全局变量 `myName` 并赋值了他们的名字。两个同名变量存在于同一个脚本环境中，因此产生冲突。最好避免这种情况，因此你不应该在脚本中创建全局变量来存储原始值（除\
  \ `Object` 和 `Function` 外的所有数据类型）。\n\n### 局部作用域\n\n在函数块内部创建的变量在函数的整个生命周期内仅局部可用。它们只在函数执行时存在，随后会被销毁。它们的脚本环境是有限的——从创建点开始到最后的\
  \ `}` 大括号，或者函数返回的那一刻。在函数块的最开始声明变量是一个良好的习惯，这样它们的词法作用域就是整个函数的时长。这意味着同名变量可以在不同的函数中存在而不会产生冲突。例如，局部变量\
  \ `myName` 可以愉快地存在于脚本中不同函数中，以及包含的外部脚本的函数中。建议你在脚本中只尝试创建局部变量来存储值。\n\n## 最佳实践\n\n使用旧的\
  \ `var` 关键字声明全局变量会导致同名的冲突变量在没有警告的情况下覆盖其被赋值的值。较新的 `let` 和 `const` 关键字禁止了这种行为，并将该行为识别为“未捕获的语法错误”（Uncaught\
  \ SyntaxError）。因此，建议使用 `let` 或 `const` 关键字声明变量来在脚本中存储值。\n\n![image](img/hot.jpg)\n\
  \n你可以在这里发现如何捕捉错误。\n\n![image](img/1b.jpg)创建一个外部脚本，通过调用函数来输出全局变量的值\n\n```javascript\n\
  let myName = ‘External Script’\nfunction readName( ) { console.log( myName ) }\n\
  readName( )\n```\n\n![image](img/pg23_1.jpg)\n\nexternal.js\n\n![image](img/2b.jpg)创建一个\
  \ HTML 文档，包含外部脚本并添加一个类似的脚本\n\n```html\n<script src=”external.js”></script>\n<script>\n\
  let myName = ‘Internal Script’\nfunction getName( ) { console.log( myName ) }\n\
  getName( )\n</script>\n```\n\n![image](img/htmlb.jpg)\n\nscope.html\n\n![image](img/3b.jpg)将两个文件保存在同一个文件夹中，然后打开\
  \ HTML 文档查看控制台中报告的冲突错误\n\n![image](img/pg23_2.jpg)\n\n![image](img/4b.jpg)编辑两个脚本，将全局变量变为局部变量，然后刷新浏览器查看无冲突\n\
  \n```javascript\nfunction readName( ) {\n  let myName = ‘External Script’ ; console.log(\
  \ myName )\n}\nfunction getName( ) {\n  let myName = ‘Internal Script’ ; console.log(\
  \ myName )\n}\n```\n\n![image](img/pg23_3)\n\n![image](img/forget.jpg)\n\n## 使用闭包\n\
  \n上一个示例演示了创建全局变量存储值的危险，但有时你可能想要存储持续存在的值——例如，随着脚本的进行记住不断增加的分数。如何在不使用全局变量的情况下做到这一点？答案在于使用“闭包”。\n\
  \n![image](img/pg24_1.jpg)\n\n闭包嵌套在外部函数内部的函数，它保留了对外部函数中声明的变量的访问——因为那是函数创建时的词法作用域。\n\
  \n![image](img/1b.jpg)创建一个 HTML 文档，其脚本将自调用函数赋值给全局变量\n\n```javascript\nconst add\
  \ = ( function ( ) {\n  // 在此处插入语句。\n} ) ( )\n```\n\n![image](img/htmlb.jpg)\n\n\
  closure.html\n\n![image](img/2b.jpg)接下来，插入语句初始化局部变量并在同一作用域内赋值一个函数\n\n```javascript\n\
  let count = 0\nconst nested = function ( ) { return count = count + 1 }\n```\n\n\
  ![image](img/3b.jpg)现在，插入一条语句返回内部函数——将内部函数赋值给全局变量\n\n```javascript\nreturn nested\n\
  ```\n\n![image](img/4b.jpg)最后，向已赋值给全局变量的内部函数添加三个相同的函数调用\n\n```javascript\nconsole.log(\
  \ ‘Count is ‘ + add( ) )\nconsole.log( ‘Count is ‘ + add( ) )\nconsole.log( ‘Count\
  \ is ‘ + add( ) )\n```\n\n![image](img/5b.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台以查看闭包返回的值\n\
  \n![image](img/pg24_2.jpg)\n\n![image](img/forget.jpg)\n\n自调用函数表达式在这里 有描述。它们只执行一次语句。在这里，你可以使用\
  \ `console.log( add )` 来确认函数表达式已赋值给外部变量。\n\n理解闭包的概念可能困难，因为在这个示例中 `count` 变量似乎在自调用函数执行完成后应该被销毁。为了更好地理解闭包的工作原理，你可以探索被赋值函数的\
  \ `prototype` 属性。\n\n![image](img/6b.jpg)在脚本末尾添加语句以揭示被赋值函数是如何构造的\n\n```javascript\n\
  console.log( add.prototype )\n```\n\n![image](img/7b.jpg)保存 HTML 文档，然后刷新浏览器并展开“constructor”下拉菜单以查看作用域\n\
  \n![image](img/pg25_1.jpg)\n\n\n\n\n仔细观察可以发现，赋值的函数除了普通的局部（脚本）作用域和外部（全局）作用域外还有一个特殊的（闭包）作用域。这就是为什么\
  \ `count` 变量可以通过赋值函数访问，但重要的是，它无法通过任何其他方式被引用。\n\n使用闭包来从脚本的其他部分隐藏持久变量是一个重要概念。这类似于在其他编程语言中隐藏“私有”变量，并仅通过“getter”方法访问。\n\
  \n![image](img/hot.jpg)\n\n所有的 JavaScript 对象都从 `prototype` 继承属性和方法。标准的 JavaScript\
  \ 对象（如函数）会调用内部构造函数，通过定义其组件来创建对象。\n\n![image](img/hot.jpg)\n\n如果你不能立即理解闭包的工作原理，不要担心。它们起初看起来可能神秘，但随着经验的增加会变得清晰。你可以继续后续稍后再回来这项技术。\n\
  \n## 总结\n\n- JavaScript 代码可以直接包含在 HTML 文档中，也可以使用 `<script> </script>` 标签从外部文件引入。\n\
  - JavaScript 可以在 HTML 元素的警报对话框或浏览器的控制台窗口显示输出。\n- JavaScript 语句可以包含关键字、运算符、值和表达式。\n\
  - JavaScript 解释器忽略制表符和空格。\n- JavaScript 语句可以分组在 `{ }` 大括号函数块中，可以在需要时调用执行。\n- 变量和函数名可以由字母、数字和下划线字符组成，但必须避免关键字。\n\
  - JavaScript 变量可以包含 String、Number、Boolean、Object、Function、Symbol、`null` 和 `undefined`\
  \ 数据类型。\n- 使用 `let` 关键字声明的变量可以重新赋值新值，但 `const` 关键字不允许此操作。\n- 函数表达式具有分组在 `{ }` 大括号中的语句用于执行，并返回最终的单一值。\n\
  - 函数表达式的 `( )` 括号可以包含参数，用于从调用者传递参数值。\n- 函数块可以包含一个 `return` 语句，用于指定传递给调用者的数据。\n-\
  \ JavaScript 的 `( )` 运算符调用函数。\n- 提升允许函数调用出现在函数声明之前的脚本中。\n- 匿名函数表达式没有函数名。\n- 词法作用域是变量创建的环境，可以是全局、局部的或闭包。\n\
  - 局部变量应用于存储值，但全局变量可以分配函数以创建闭包。\n- 闭包嵌套在外部函数内部的函数，它保留了对外部函数中声明变量的访问。\n\n## 2 执行常用操作\n\
  \n*本章描述了 JavaScript 运算符并演示了如何在你的脚本中使用它们。*\n\n- 转换值\n- 进行算术运算\n- 赋值值\n- 进行比较\n- 评估逻辑\n\
  - 检查条件\n- 处理位运算\n- 强制排序\n- 总结\n\n## 转换值\n\n在 JavaScript 中执行操作之前，识别你正在处理的值的数据类型是重要的，以避免出现意外的结果。例如，值\
  \ 42 是数字，但值 ‘42’ 是字符串，因此尝试执行 `‘42’ + 8` 加法将返回字符串结果 `‘428’，而不是数字 50。幸运的是，JavaScript\
  \ 提供了多种方法返回其他数据类型的值的版本，而不改变值的原始数据类型。\n\n![image](img/pg28_1.jpg)\n\n### 字符串转数字\n\
  \nJavaScript 内置函数 `parseInt()` 可以返回括号内指定字符串的整数版本（在数字数据类型中）。例如，`parseInt( ‘42’ )`\
  \ 将返回数字 42，因此 `42 + 8` 将返回数字结果 50。\n\n同样，JavaScript 内置函数 `parseFloat()` 可以返回括号内指定字符串的浮点数版本（在数字数据类型中）。\n\
  \n这两个方法都允许字母跟在指定字符串的数字部分之后，并将其从结果中剔除——例如，`parseInt( ‘42nd Street’ )` 返回数字 42。\n\n\
  如果这两个函数任一无法在指定字符串的开头找到数值，结果将是 `NaN` —— 这是一个 JavaScript 属性，意味着“不是数字”（Not a Number）。你也可以通过在\
  \ JavaScript 内置函数 `isNaN()` 的括号内指定值来检查一个值是否不是数字。这同样会首先尝试在指定值的开头寻找数字，如果找到了数字（即使来自指定的字符串），则返回\
  \ false，否则如果找不到数字，将返回 true。\n\n![image](img/hot.jpg)\n\n数据类型的转换被称为“强制类型转换”（coercion），它可以是显式的也可以是隐式的。`‘42’\
  \ + 8` 返回字符串 `‘428’` 是隐式转换。而 `String( 42 )` 返回字符串 `‘42’` 是显式转换。\n\n### 数字转字符串\n\n\
  JavaScript 的 `String()` 方法可以返回括号内指定数字的字符串表示（在字符串数据类型中）——例如，`String( 42 )` 将返回字符串数据类型的数字\
  \ `’42’`。\n\n或者，你可以在变量名后附加 `toString()` 方法调用，以返回存储的数字数据类型的字符串表示。例如，当一个名为“num”的变量被赋值数字时，`num.toString()`\
  \ 将返回该存储数字的字符串版本。\n\n![image](img/1r.jpg)\n创建一个带有自执行匿名函数块的 HTML 文档，其中声明了三个变量\n\n\
  ```javascript\n( function ( ) {\n  let sum, net = ‘25’, tax = 5.00\n  // 在此处插入语句。\n\
  } ) ( )\n```\n\n![image](img/htmlr.jpg)\nconversion.html\n\n![image](img/2r.jpg)\n\
  接下来，插入创建不同数据类型版本的语句并在输出字符串中打印结果\n\n```javascript\nsum = net + tax\nconsole.log(\
  \ ‘sum: ‘ + sum + ‘ ‘ + typeof sum )\nsum = parseFloat( net ) + tax\nconsole.log(\
  \ ‘sum: ‘ + sum + ‘ ‘ + typeof sum )\nconsole.log( ‘tax: ‘ + tax + ‘ ‘ + typeof\
  \ sum )\ntax = tax.toString( )\nconsole.log( ‘tax: ‘ + tax + ‘ ‘ + typeof tax )\n\
  net = ‘$’ + net\nconsole.log( ‘net: ‘ + net + ‘ ‘ + parseInt( net ) )\nconsole.log(\
  \ ‘net Not a Number? ‘ + isNaN( net ) )\n```\n\n![image](img/3r.jpg)\n保存 HTML 文档，然后在浏览器中打开它并启动控制台以查看不同的版本\n\
  \n![image](img/pg29_1.jpg)\n\n![image](img/forget.jpg)\n\n如果你在向字符串添加 ‘$’ 前缀之前尝试\
  \ `isNaN( net )`，结果为 **false** —— 因为该方法在 `‘25’` 字符串的开头找到了数字。\n\n## 进行算术运算\n\nJavaScript\
  \ 中常用的算术运算符列在下表中，以及它们执行的操作：\n\n![image](img/pg30_1.jpg)\n\n| **运算符** | **操作** |\n\
  | :--- | :--- |\n| + | 数字相加 字符串拼接 |\n| **–** | 减法 |\n| ***** | 法 |\n| **/** | 除法\
  \ |\n| **%** | 取模 |\n| **++** | 增 |\n| **– –** | 减 |\n| ****** | 幂 |\n\n操作语句中指定的值被称为“操作数”。例如，在语句\
  \ `5 + 2` 中，`+` 运算符被提供了五和二的操作数值。注意 `+` 运算符根据操作数的类型执行两种不同的操作。数字操作数相加返回总和，但字符串操作数拼接返回单个连接的字符串。\n\
  \n\n\n\n\n`%` 模运算符将第一个操作数除以第二个操作数，并返回余数。除以二会返回一或零，从而很有用地判断第一个操作数是奇数还是偶数。\n\n`++`\
  \ 增量运算符和 `--` 减量运算符会将单个操作数的值改变一，并返回新值。这些运算符通常用于计数循环的次数，并有两种不同的不同的方式，产生细微不同的效果。当放在操作数之前（前置）时，在表达式求值之前立即改变值；但当放在操作数之后（后置）时，先求值表达式，然后改变值。\n\
  \n![image](img/hot.jpg)\n\n`**` 幂运算符返回第一个操作数相对于第二个操作数的幂次方的结果。\n\n![image](img/hot.jpg)\n\
  \n使用模运算符判断奇数或偶数的示例可以参考这里。\n\n![image](img/1r.jpg)创建一个带有自执行匿名函数块的 HTML 文档\n\n```javascript\n\
  function ( ) {\n  // 在此处插入语句。\n} ( ) ;\n```\n\n![image](img/htmlr.jpg)\n\narithmetic.html\n\
  \n![image](img/2r.jpg)接下来，插入使用每个算术运算符为变量赋值的语句并在输出字符串中打印每个结果\n\n```javascript\nlet\
  \ sum = 80 + 20 ; console.log( ‘Addition: ‘ + sum )\nlet sub = sum - 50 ; console.log(\
  \ ‘Subtraction: ‘ + sub )\nlet mul = sum * 5 ; console.log( ‘Multiplication: ‘ +\
  \ mul )\nlet div = sum / 4 ; console.log( ‘Division: ‘ + div )\nlet mod = sum %\
  \ 2 ; console.log( ‘Modulus: ‘ + mod )\nlet inc = ++sum ; console.log( ‘Increment:\
  \ ‘ + inc )\nlet dec = --sum ; console.log( ‘Decrement: ‘ + dec )\n```\n\n![image](img/3r.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台以查看算术结果\n\n![image](img/pg31_1.jpg)\n\n### 赋值值\n\nJavaScript\
  \ 中常用的用于赋值的运算符都列在下表中。除了简单的 `=` 赋值运算符外，所有运算符都是较长表达式的简写，因此为了清晰起见，也提供了相应的写法。\n\n![image](img/pg32_1.jpg)\n\
  \n| 运算符 | 示例 | 等效于 |\n| :--- | :--- | :--- |\n| `=` | `a = b` | `a = b` |\n| `+=`\
  \ | `a += b` | `a = ( a + b )` |\n| `–=` | `a –= b` | `a = ( a – b )` |\n| `*=`\
  \ | `a *= b` | `a = ( a * b )` |\n| `/=` | `a /= b` | `a = ( a / b )` |\n| `%=`\
  \ | `a %= b` | `a = ( a % b )` |\n| `**=` | `a ** b` | 错误 |\n\n将 `=` 运算符理解为“赋值”而不是“等于”是非常重要的，以避免与\
  \ JavaScript 的 `===` 相等运算符混淆。\n\n在表格的 `=` 示例中，变量 `a` 被赋值变量 `b` 中包含的值，成为其新的存储值。\n\
  \n组合运算符 `+=` 很有用，可以用于将字符串附加到现有字符串上。例如，对于变量 `let str = ‘JavaScript’` 和 `str += ‘\
  \ Fun’`，变量现在存储组合后的字符串 ‘JavaScript Fun’。\n\n从数字上来说，表格中的 `+=` 示例将变量 `a` 中的值加到变量 `b`\
  \ 中的值，然后将总和赋值为变量 `a` 中存储的新值。\n\n所有其他组合赋值运算符的工作方式与 `+=` 运算符类似。它们都先对两个操作数执行算术操作，然后将该操作的结果赋值给第一个变量——使其成为其新的存储值。\n\
  \n![image](img/hot.jpg)\n\n`===` 相等运算符比较值，并在此处 有详细解释。\n\n![image](img/1r.jpg)创建一个带有连接两个字符串的自执行匿名函数的\
  \ HTML 文档\n\n```javascript\nfunction ( ) {\n  let msg = ‘JavaScript’ ; msg += ‘\
  \ Fun’\n  console.log( ‘Add & concatenate: ‘ + msg )\n  // 在此处插入语句。\n} ( ) ;\n```\n\
  \n![image](img/htmlr.jpg)\n\nassignment.html\n\n![image](img/2r.jpg)接下来，插入使用组合运算符执行算术运算并赋值结果输出的语句\n\
  \n```javascript\nlet sum = 5.00 ; sum += 2.50\nconsole.log( ‘Add & assign decimal:\
  \ ‘ + sum )\nsum = 8 ; sum -= 4\nconsole.log( ‘Subtract & assign integer: ‘ + sum\
  \ )\nsum = 8 ; sum *= 4\nconsole.log( ‘Multiply & assign integer: ‘ + sum )\nsum\
  \ = 8 ; sum /= 4\nconsole.log( ‘Divide & assign integer: ‘ + sum )\nsum = 8 ; sum\
  \ %= 4\nconsole.log( ‘Modulus & assign integer: ‘ + sum )\n```\n\n![image](img/3r.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台以查看算术结果\n\n![image](img/pg33_1.jpg)\n\n### 比较\n\nJavaScript\
  \ 中常用的用于比较值的运算符都列在下表中。\n\n![image](img/pg34.jpg)\n\n| 运算符 | 比较 |\n| :--- | :---\
  \ |\n| `===` | 相等 |\n| `!==` | 不相等 |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于\
  \ |\n| `<=` | 小于等于 |\n\n`===` 相等运算符比较两个值，如果它们完全相等则返回 true，否则返回 false。`>` 大于运算符在第一个值大于值时返回\
  \ true。`<` 小于运算符在第一个值小于第二个值时返回 true。在 `>` 大于运算符或 `<` 小于运算符后添加 `=` 字符可以使它们在两个操作数相等时也返回\
  \ true。`>` 大于运算符和 `<` 小于运算符经常用于测试循环结构中计数器变量的值。\n\n![image](img/hot.jpg)\n\n在循环结构中使用\
  \ `<` 小于运算符的示例可以参考这里。\n\n![image](img/snake.jpg)\n\n还有 `==` 相等运算符和 `!=` 不相等运算符，但这些可能会产生意外的结果，因为与\
  \ `===` 和 `!==` 不同，它们不确保所比较的值是相同类型。这意味着 `25 == ‘25’` 返回 `true`，而 `25 === ‘25’` 返回\
  \ `false`。始终使用三字符的版本，以便你的脚本进行准确的比较。\n\n![image](img/1r.jpg)创建一个声明三个变量的自执行匿名函数的 HTML\
  \ 文档\n\n```javascript\nfunction ( ) {\n  let comparison, sum = 8, str = ‘JavaScript’\n\
  \  // 在此处插入语句。\n} ( ) ;\n```\n\n![image](img/htmlr.jpg)\n\ncomparison.html\n\n![image](img/2r.jpg)接下来，插入使用比较运算符赋值布尔结果输出的语句\n\
  \n```javascript\ncomparison = str === ‘JAVASCRIPT’\nconsole.log( ‘String Equality?\
  \ ‘ + comparison )\ncomparison = str === ‘JavaScript’\nconsole.log( ‘String Equality?\
  \ ‘ + comparison )\ncomparison = sum === 8\nconsole.log( ‘Number Equality? ‘ + comparison\
  \ )\ncomparison = sum > 5\nconsole.log( ‘Greater Than? ‘ + comparison )\ncomparison\
  \ = sum < 5\nconsole.log( ‘Less Than? ‘ + comparison )\ncomparison = sum <= 8\n\
  console.log( ‘Less Than or Equal To? ‘ + comparison )\n```\n\n\n\n\nJavaScript 是区分大小写的，因此为了使比较的字符串相等，字符的大小写必须匹配。\n\
  \n## 评估逻辑\n\nJavaScript 中可以使用的三种逻辑运算符列如表所示：\n\n![image](img/pg36_1.jpg)\n\n| 运算符\
  \ | 操作 |\n| :--- | :--- |\n| `&&` | 逻辑与 (AND) |\n| `||` | 逻辑或 (OR) |\n| `!` | 逻辑非\
  \ (NOT) |\n\n逻辑运算符通常用于具有布尔值 true 或 false 的操作数——或者可以转换为 true 或 false 的值。\n\n`&&`\
  \ 逻辑与运算符评估两个操作数，只有当两个操作数本身都为 true 时，才会返回 true。否则，`&&` 与运算符将返回 false。这通常用于条件分支，即通过测试两个条件来决定脚本的执行方向。如果两个条件都满足，脚本将按照特定方向执行，否则将遵循另一个方向。\n\
  \n与需要两个操作数都为 true 的 `&&` 逻辑与运算符不同，`||` 逻辑或运算符会评估两个操作数，如果其中一个操作数本身为 true，则返回 true。如果两个操作数都不\
  \ true，则 `||` 或运算符将返回 false。这对于在两个测试条件中的任意一个满足时让脚本执行特定操作非常有用。\n\n第三个逻辑运算符是 `!` 逻辑非运算符，它用于单个操作数之前，并返回操作数的反向值。例如，如果名为\
  \ `tog` 的变量值为 true，那么 `!tog` 将返回 false。这对于在连续的循环迭代中使用如 `tog = !a` 的语句来“切换”变量的值非常有用，使其每次迭代时值发生反转——就像开关灯泡一样。\n\
  \n![image](img/pg36_2.jpg)\n\n“布尔”（Boolean）一词指的是由英国数学家乔治·布尔（George Boole，1815-1864）开发的逻辑思维体系。\n\
  \n![image](img/1r.jpg)创建一个带有自执行匿名函数的 HTML 文档，并声明三个变量\n\n```javascript\nfunction\
  \ () {\n  let result, yes = true, no = false;\n  // 在此处插入语句。\n}()\n```\n\n![image](img/htmlr.jpg)\n\
  \n`logic.html`\n\n![image](img/2r.jpg)接下来，插入使用逻辑运算符为输出分配布尔结果的语句\n\n```javascript\n\
  result = yes && yes\nconsole.log( ‘Are both true? ‘ + result )\nresult = yes &&\
  \ no\nconsole.log( ‘Are both still true? ‘ + result )\nresult = yes || no\nconsole.log(\
  \ ‘Are either true? ‘ + result )\nresult = no || no\nconsole.log( ‘Are either still\
  \ true? ‘ + result )\nconsole.log( ‘Original value: ‘ + yes )\nyes = !yes\nconsole.log(\
  \ ‘Toggled value: ‘ + yes )\n```\n\n![image](img/3r.jpg)保存该 HTML 文档，然后在浏览器中打开它并启动控制台以查看返回的结果\n\
  \n![image](img/pg37_1.jpg)\n\n![image](img/hot.jpg)\n\n看 `false && false` 返回的是 `false`\
  \ 而不是 `true`——这也许证明了“两个错不成就一个对”的格言。\n\n## 检查条件\n\n可能 JavaScript 作者最喜欢的运算符是 `?:`\
  \ 条件运算符。该运算符也被称为“三元”运算符——意味着它由三部分组成。\n\n三元运算符评估指定条件为 true 或 false 值，然后根据结果执行两个指定语句中的一个。它的语法如下：\n\
  \n![image](img/pg38_1.jpg)\n\n```\ncondition ? if-true-do-this : if-false-do-this\n\
  ```\n\n其中如果根据条件评估的结果需要执行多个操作，每个指定的语句可以是一个函数调用，以便在每个函数中执行多个语句——例如，根据名为 `flag` 的变量的布尔值调用函数来执行多个语句，如下：\n\
  \n```javascript\nflag === true ? doThis() : doThat()\n```\n\n在这个示例中，`===` 等于运算符和\
  \ `true` 关键字实际上是多余的，因为评估表达式的布尔值的运算符会自动执行这种评估，因此示例可以更简单地表述为：\n\n```javascript\nflag\
  \ ? doThis() : doThat()\n```\n\n或者，为三元运算符指定的两个语句可能会根据条件评估的结果为变量赋值，如下所示：\n\n```javascript\n\
  flag ? str = ‘Go left’ : str = ’Go right’\n```\n\n虽然这在语法上是正确的，但通过让三元运算符在单个赋值语句中为变量分配适当的值可以得更优雅，如下：\n\
  \n```javascript\nstr = flag ? ‘Go left’ : ’Go right’\n```\n\n当条件评估数值的奇偶性时，两个语句可以根据评估结果确定数字是偶数还是奇数来提供方案。\n\
  \n![image](img/forget.jpg)\n\n三元运算符有三个操作数——`?` 之前的以及 `:` 冒号两侧的\n\n![image](img/1r.jpg)创建一个带有自执行匿名函数的\
  \ HTML 文档，并声明两个变量\n\n```javascript\nfunction () {\n  const numOne = 8, numTwo =\
  \ 3;\n  // 在此处插入语句。\n}()\n```\n\n![image](img/htmlr.jpg)\n\n`ternary.html`\n\n![image](img/2r.jpg)接下来，插入使用合适数量语法的输出字符串的语句\n\
  \n```javascript\nlet verb = ( numOne !== 1 ) ? ‘ are ‘ : ‘ is ‘\nconsole.log( ‘There’\
  \ + verb + numOne )\n```\n\n![image](img/3r.jpg)现在，插入语句以正确描述两个变量值的奇偶性的字符串\n\n```javascript\n\
  let parity = ( numOne % 2 !== 0 ) ? ‘Odd’ : ‘Even’\nconsole.log( numOne + ‘ is ‘\
  \ + parity )\nparity = ( numTwo % 2 !== 0 ) ? ‘Odd’ : ‘Even’\nconsole.log( numTwo\
  \ + ‘ is ‘ + parity )\n```\n\n![image](img/4r.jpg)最后，插入语句输出两个变量值中较大者的字符串\n\n```javascript\n\
  let max = ( numOne > numTwo ) ? numOne : numTwo\nconsole.log( max + ‘ is the Greater\
  \ Number ‘ )\n```\n\n![image](img/5r.jpg)保存该 HTML 文档，然后在浏览器中打开它并启动控制台以查看字符串描述\n\n\
  ![image](img/pg39_1.jpg)\n\n![image](img/hot.jpg)\n\n三元运算符可以返回任何数据类型的值——字符串、数字、布尔值等。\n\
  \n## 位位运算\n\nJavaScript “位”运算符将其操作数视为 32 位的序列，其中每个位可能包含零 (0) 或一 (1) 的值。只有当该位包含一时，该位才贡献一个十进制部分。组件从右到左从“最低有效位”（LSB）命名为“最高有效位”（MSB）。下方八位模式中的二进制数表示十进制\
  \ 50，由设置为 1 值的位表示（2 + 16 + 32 = 50）。\n\n![image](img/pg40_1.jpg)\n\n| 位数 | 8 | 7\
  \ | 6 | 5 | 4 | 3 | 2 | 1 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\
  \ :--- | :--- |\n| 十进制 | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |\n| 二进制 | 0 | 0 | 1\
  \ | 1 | 0 | 0 | 1 | 0 |\n\n可以使用表中所列的 JavaScript 位运算符操作序列中的单个位。\n\n| 运算符 | 称为 | 二进制数操作\
  \ |\n| :--- | :--- | :--- |\n| `\\|` | 或 (OR) | 如果两个比较位中任意一个为 1，则每个位都返回 1 示例：`1010\
  \ \\| 0101 = 1111` |\n| `&` | 与 (AND) | 如果两个比较位都为 1，则每个位都返回 1 示例：`1010 & 1100 =\
  \ 1000` |\n| `~` | 非 (NOT) | 当位不是 1 时，每个位都返回 1；当位为 1 时，返回 0 示例：`~ 1010 = 0101` |\n\
  | `^` | 异或 (XOR) | 如果两个比较位中只有一个为 1，则每个位都返回 1 示例：`1010 ^ 0100 = 1110` |\n| `<<` |\
  \ 左移 | 从右侧推入零，将每个位向左移动位数 示例：`0010<< 2 = 1000` |\n| `>>` | 有符号右移 | 从左侧推入最左侧位的副本，将每个位向右移动位数。示例：`1000\
  \ >> 2 = 0010` |\n\n\n\n\n\n| **>>>** | 右移 | 从左侧补零，将每个位向右移动指定的的位数。示例：**1000 >> 2\
  \ = 0010** |\n\n![image](img/forget.jpg)\n\n许多 JavaScript 作者从不使用位运算符，但了解它们是什么以及如何使用是有用的。\n\
  \n![image](img/hot.jpg)\n\n一个“字节”（byte）包含 8 位，字节的每个半部分被称为“半字节”（nibble，4 位）。此表示例中的二进制数描述了存储在半字节中的值。\n\
  \n![image](img/1r.jpg)创建一个 HTML 文档，使用一个自执行的匿名函数来声明两个变量\n\n```javascript\nfunction\
  \ ( ) {\n  let numOne = 10, numTwo = 5;\n  // 在此处插入语句。\n} ( )\n```\n\n![image](img/htmlr.jpg)\n\
  \nbitwise.html\n\n![image](img/2r.jpg)接下来，插入语句简单输出字符串，以确认存储在每个变量中的初始值\n\n```javascript\n\
  console.log( ‘numOne:‘ + numOne )\nconsole.log( ‘numTwo: ‘ + numTwo )\n```\n\n![image](img/3r.jpg)现在，插入语句使用位运算交换每个变量中存储的值\n\
  \n```javascript\nnumOne = numOne ^^ numTwo;\n// 1010 ^^ 0101 = 1111 = (十进制 15)\n\
  numTwo = numOne ^^ numTwo;\n// 1111 ^^ 0101 = 1010 (十进制 10)\nnumOne = numOne ^^\
  \ numTwo;\n// 1111 ^^ 1010 = 0101 (十进制 5)\n```\n\n![image](img/4r.jpg)最后，插入语句输出换行符和字符串，以确认存储在每个变量中的最终值\n\
  \n```javascript\nconsole.log( ‘\\n’ + ‘numOne: ‘ + numOne )\nconsole.log( ‘numTwo:\
  \ ‘ + numTwo )\n```\n\n![image](img/5r.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看交换后的值\n\n\
  ![image](img/pg41_1.jpg)\n\n![image](img/hot.jpg)\n\n注意此示例如何使用特殊的 `\\n` 转义序列在控制台输出中创建换行。\n\
  \n**强制顺序**\n\nJavaScript 运算符具有不同的优先级，用于决定包含多个不同运算符的语句的评估顺序——优先级高的运算符优于优先级低的运算符。下表按照从高到低的顺序列出了每种类型的运算符：\n\
  \n![image](img/pg42_1.jpg)\n\n| | 运算符 | 操作 |\n| :--- | :--- | :--- |\n| ![images](img/pg42_2.jpg)\
  \ | `( )` | 表达式分组 |\n| `.` | 对象成员 |\n| `[ ]` | 数组成员 |\n| `( )` | 函数调用 |\n| `++ --`\
  \ | 后置递增、后置递减 |\n| `++ --` | 前置递增、前置递减 |\n| `! ~` | 逻辑非、位非 |\n| `******` | 幂 |\n\
  | `*** / %` | 乘法、除法、取模 |\n| `+ –` | 加法、减法 |\n| `<< >> >>>` | 位移 |\n| `< <= => >`\
  \ | 比较 |\n| `=== === !== !=` | 相等、不相等 |\n| `&` | 位与 |\n| `^` | 位异异 |\n| `&#124;`\
  \ | 位或 |\n| `&&` | 逻辑与 |\n| `&#124;&#124;` | 逻辑或 |\n| `?:` | 三元条件运算符 |\n| `= +=\
  \ –= *= /= %= &= ^= &#124;= <<= >>= >>>=` | 赋值 |\n| `,` | 逗号 |\n\n![image](img/hot.jpg)\n\
  \n`[ ]` 运算符在演示数组的章节中从此处` 等点符号表示法）具有高优先级，以便及早识别对象及其成员。\n\n![image](img/1r.jpg)创建一个\
  \ HTML 文档，使用一个自执行的匿名函数用未分组表达式的结果初始化变量并输出其值\n\n```javascript\nfunction ( ) {\n  let\
  \ sum = 9 + 12 / 3; // 等于 9 + 4。\n  console.log( ‘Ungrouped sum: ‘ + sum )\n} (\
  \ )\n```\n\n![image](img/htmlr.jpg)\n\nprecedence.html\n\n![image](img/2r.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台查看结果\n\n![image](img/pg43_1.jpg)\n\n首先计算除法，因为它的运算符优先级高于加法运算符，所以结果是\
  \ 13。但你可以通过括号内分组表达式来强制优先级顺序，使其先计算，因为 `( )` 运算符具有所有运算符中最高的优先级。\n\n![image](img/3r.jpg)编辑函数内的语句以强制评估顺序，使加法在除法之前执行\n\
  \n```javascript\nlet sum = ( 9 + 12 ) / 3; // 等于 21 / 3.\nconsole.log( ‘Grouped\
  \ sum: ‘ + sum )\n```\n\n![image](img/4r.jpg)再次保存 HTML 文档，然后刷新浏览器查看新的结果值\n\n![image](img/pg43_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n养成使用括号分组表达式的习惯，从而设定评估的优先级顺序。\n\n**总结**\n\n- `parseInt()`\
  \ 和 `parseFloat()`可以将字符串转换为数字，但 `String()` 和 `toString()`可以将数字转换为字符串。\n- `isNaN()`\
  \ 函数测试其参数是否为 NaN 值。\n- 算术运算符执行常规算术以及 `%` 取模、`++` 增、`--` 减以及 `**` 幂。\n- 当 `++` 增或\
  \ `--` 减运算符位于操作数之前时，其值立即改变；但当它们位于操作数之后时，先评估表达式。\n- `=` 运算符可以与算术运算符结合进行运算。\n- `+=`\
  \ `-=` `*=` `/=` `%=` `&=` `^=` `|=` `<<=` `>>=` `>>>=` 用于赋值。\n- `,` 逗号。\n\n**3**\n\
  \n**管理脚本流**\n\n*本章介绍了 JavaScript 控制结构并演示了它们如何控制脚本的进度。*\n\n- If 分支\n- 备选分支\n- Switch\
  \ 分支\n- For 循环\n- While 循环\n- Do 循环\n- Break 跳\n- 捕获错误\n- 总结\n\n**If 分支**\n\n任何脚本或计算机程序的进度都取决于条件的评估，以确定流的方向。每次评估都可能根据评估结果提供一个或多个继续执行的分支。\n\
  \n![image](img/pg46_1.jpg)\n\n在 JavaScript 中，基本的条件测试使用 `if` 关键字进行，用以测试条件是否为布尔真或假值。当结果为真时，将执行评估后的语句；否则，跳过该语句并在后续语句处继续执行。\n\
  \n`if` 语句的语法要求将测试的条件放在 `if` 关键字后的括号内，格式如下：\n\n```javascript\nif ( condition ) execute-this-statement-when-true\n\
  ```\n\n`if` 语句也可以通过将语句封装在大括号内来指定在结果为真时执行的多个语句，如下所示：\n\n```javascript\nif ( condition\
  \ )\n{\n  execute-this-statement-when-true\n  execute-this-statement-when-true\n\
  \  execute-this-statement-when-true\n}\n```\n\n\n\n\n对条件进行评估并根据结果执行操作，简单地反映了现实中的思考过程——例如，你可能在夏日里执行的动作：\n\
  \n```javascript\nlet temperature = readThermometer( )\nconst tolerable = 25\nif\
  \ ( temperature > tolerable )\n{\n  turn_on_air-conditioning( )\n  get_a_cool_drink(\
  \ )\n  stay_in_shade( )\n}\n```\n\n条件测试等于 `if( condition === true )`，但因为它会自动对真值进行等值测试，因此没有必要在括号中包含\
  \ `=== true`。\n\n![image](img/hot.jpg)\n\n建议即使是执行单个语句，也将其封装在大括号内 ——用以保持一致的编码风格。\n\
  \n![image](img/1g.jpg)创建一个 HTML 文档，包含一个自执行函数，首先初始化一个布尔变量\n\n```javascript\nlet flag\
  \ = true\n```\n\n![image](img/htmlg.jpg)\n\nif.html\n\n![image](img/2g.jpg)接下来，插入语句对变量的布尔值进行条件测试\n\
  \n```javascript\nif( !flag )\n{\n  console.log( ‘Power is OFF’ )\n}\nif( flag )\n\
  {\n  console.log( ‘Power is ON’ )\n}\n```\n\n![image](img/3g.jpg)现在，插入语句对比较两个整数的表达式进行条件测试\n\
  \n```javascript\nif( 7 < 2 )\n{\n  console.log( ‘Failure’ )\n}\nif( 7 > 2 )\n{\n\
  \  console.log( ‘Success’ )\n}\n```\n\n![image](img/4g.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台，查看哪些输出语句被执行，哪些被忽略了\n\
  \n![image](img/pg47_1.jpg)\n\n![image](img/hot.jpg)\n\n这里使用了逻辑 `!`（非）运算符来反转条件测试，使其等同于\n\
  \n```javascript\nif( flag === false )\n```\n\n![image](img/hot.jpg)\n\n为了节省页面空间，本示例以及大多数后续示例都省略了创建函数块的脚本代码。你可以参考此处\
  \ 获取有关如何创建匿名自执行函数的说明。\n\n## 分支备\n\n`if` 语句测试条件的布尔值并仅在结果为真时执行其语句，它提供了一个脚本可以遵循的单一分支。通过\
  \ `else` 关键字扩展 `if` 语句，可以提供脚本在结果为假时遵循的备选分支。\n\n![image](img/pg48_1.jpg)\n\n`else`\
  \ 语句位于 `if` 语句之后如下：\n\n```javascript\nif ( condition ) execute-this-statement-when-true\n\
  else execute-this-statement-when-false\n```\n\n`if else` 语句也可以通过将这些语句封装在大括号内来指定多个执行语句，如下：\n\
  \n```javascript\nif ( condition )\n{\n  execute-this-statement-when-true\n  execute-this-statement-when-true\n\
  }\nelse\n{\n  execute-this-statement-when-false\n  execute-this-statement-when-false\n\
  }\n```\n\n通过在每个 `else` 语句块的开头进行后续的条件 `if` 测试，可以提供多个分支，如下：\n\n```javascript\nif (\
  \ condition )\n{\n  execute-these-statements-when-true\n}\nelse if ( condition )\n\
  {\n  execute-these-statements-when-true\n}\nelse if ( condition )\n{\n  execute-these-statements-when-true\n\
  }\nelse\n{\n  execute-this-statements-when-false\n}\n```\n\n`if else if` 语句可能会反复测试变量在一个范围内的值，也可能会测试各种条件。最终的\
  \ `else` 语句在没有找到真条件时充当默认值。\n\n![image](img/hot.jpg)\n\n一旦在 `if else` 语句中发现真条件，其关联语句将被执行，然后流在\
  \ `if else` 语句之后继续 ——不再评估后续的 `else` 语句。\n\n![image](img/1g.jpg)创建一个 HTML 文档，包含一个自执行函数，首先初始化两个变量\n\
  \n```javascript\nlet flag = false\nconst num = 10\n```\n\n![image](img/htmlg.jpg)\n\
  \nelse.html\n\n![image](img/2g.jpg)接下来，插入语句对第一个变量的布尔值进行条件测试\n\n```javascript\nif(\
  \ !flag )\n{\n  console.log( ‘Power is OFF’ )\n}\nelse\n{\n  console.log( ‘Power\
  \ is ON’ )\n}\n```\n\n![image](img/3g.jpg)现在，插入语句对第二个变量的数值值进行条件测试\n\n```javascript\n\
  if( num === 5 )\n{\n  console.log( ‘Number is Five’ )\n}\nelse if( num === 10 )\n\
  {\n  console.log( ‘Number is Ten’ )\n}\nelse\n{\n  console.log( ‘Number is Neither\
  \ Five nor Ten’ )\n}\n```\n\n![image](img/4g.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台，查看哪些输出语句被执行，哪些被忽略了\n\
  \n![image](img/pg47_1.jpg)\n\n![image](img/hot.jpg)\n\n使用 `if` 语句进行条件分支流测试几个条件是可以的，但当有许多条件时，会变得臃肿。在这种情况下，使用\
  \ `switch` 语句通常更高效、更优雅。\n\n![image](img/50.jpg)\n\n`switch` 语句的工作方式很特殊 —— 它首先评估一个表达式，然后为结果值寻找匹配。在找到匹配的地方，`switch`\
  \ 语句将执行与该值关联的一个语句，否则它将执行一个指定为 `default` 的语句。\n\n因此，`switch` 语句的语法如下：\n\n```javascript\n\
  switch ( expression )\n{\n  case value-1 : statements-to-executed-when-matched ;\
  \ break\n  case value-2 : statements-to-executed-when-matched ; break\n  case value-3\
  \ : statements-to-executed-when-matched ; break\n  default : statements-to-executed-when-match-found\n\
  }\n```\n\n`switch` 语句首先通过在 `switch` 关键字后的括号内封装要评估的表达式。紧接着是一对 `{ }` 大括号，其中包含了可能的匹配项。每个匹配项都跟一个\
  \ `case` 关键字，并使用冒号 `:` 关联一个更多要执行的语句。重要的是，每个 `case` 必须以 `break` 语句结束，以便在执行其关联语句后退出\
  \ `switch` 语句。\n\n可选地，`switch` 语句可以包含一个最后的 `default` 备选，以便在未找到匹配时关联一个更多要执行的语句。\n\
  \n`switch` 语句中包含的 `case` 值数量没有限制，因此它是匹配几十、数百或数千个不同值的理想方式。\n\n![image](img/snake.jpg)\n\
  \n省略 `break` 语句允许脚本也执行与后续不匹配 `case` 值关联的语句。\n\n![image](img/1g.jpg)创建一个 HTML 文档，包含一个自执行函数，首先声明一个变量\n\
  \n```javascript\nlet day\n```\n\n![image](img/htmlg.jpg)\n\nswitch.html\n\n![image](img/2g.jpg)接下来，插入一个\
  \ `switch` 语句在评估表达式后给变量赋值一个值\n\n```javascript\nswitch( 5 - 2 )\n{\n  case 1 : day\
  \ = ‘Monday’ ; break\n  case 2 : day = ‘Tuesday’ ; break\n  case 3 : day = ‘Wednesday’\
  \ ; break\n  case 4 : day = ‘Thursday’ ; break\n  case 5 : day = ‘Friday’ ; break\n\
  \  default : day = ‘Weekend’\n}\n```\n\n![image](img/3g.jpg)现在，插入一个语句输出由匹配的 `case`\
  \ 语句赋值的值\n\n```javascript\nconsole.log( ‘It is ‘ + day )\n```\n\n![image](img/4g.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台，查看输出中的赋值值\n\n![image](img/pg51_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n\n\n\n作为可能情况匹配的 `String` 值必须像所有其他字符串值一样括在引号内。\n\n### For 循环\n\n循环是一种包含一个测试条件和一个或多个语句的结构，当测试条件满足时，这些语句会被重复执行。对条件的单次检查和语句的执行被称为一次“迭代”。当测试条件不再满足时，不再进行后续迭代，程序流将到循环结构之后的下一个语句。\n\
  \n![image](img/pg52_1.jpg)\n\n在 JavaScript 中最常用的循环结构可能是 `for` 循环，其语法如下：\n\n`for\
  \ ( *initializer ; condition ; modifier ) { *statements-to-be-executed }`\n\n`for`\
  \ 关键字后面的括号内包含三个表达式，用于控制循环执行的次数：\n\n- `Initializer`（初始化器） – 一个语句，指定用于计数循环迭代次数变量的初始值。传统上，这个简单的计数器变量通常命名为“i”。\n\
  - `Condition`（条件） – 在每次迭代中都会进行布尔值测试的表达式。当求值结果为 true 时，执行循环语句以完成该迭代。如果求值结果为 false，则不执行语句并结束循环。通常，该条件检查循环计数器变量的值。\n\
  - `Modifier`（修改器） – 一个修改测试条件中值的语句，以便在某一点其求值结果能返回 false。通常，这会递增或递减循环计数器变量。\n\n例如，执行一组语句一百次的\
  \ `for` 循环结构可能如下所示：\n\n```javascript\nlet i\nfor ( i = 0 ; i < 100 ; i++ ) { statements-to-be-executed\
  \ }\n```\n\n在这种情况下，计数器变量在每次迭代中递增，直到其值达到 100，此时求值返回 false，循环结束。\n\n![image](img/snake.jpg)\n\
  \n除非修改器能够让求值在某一点返回 false，否则会创建一个永远运行的死循环。\n\n![image](img/1g.jpg)创建一个带有自执行函数的 HTML\
  \ 文档，从初始化一个循环计数器变量开始\n\n```javascript\nlet i = 0\n```\n\n![image](img/htmlg.jpg)\n\
  \nfor.html\n\n![image](img/2g.jpg)接下来，插入一个 for 循环结构，它将进行 10 次迭代并在每次迭代中输出循环计数器的值\n\
  \n```javascript\nfor( i = 1 ; i < 11 ; i++ )\n{\nconsole.log( ‘Iteration Number:\
  \ ‘ + i )\n}\n```\n\n![image](img/3g.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看循环迭代\n\n![image](img/pg53_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n这是普通的 `for` 循环。还有一种特殊的 `for in` 循环，用于遍历对象的属性，稍后会演示，详见此处。\n\
  \n### While 循环\n\n此处描述的 `for` 循环结构适用于所需迭代次数已知的情况，但在次数未知时，`while` 循环结构通常更好。`while`\
  \ 循环的语法如下：\n\n```javascript\nwhile( *condition )\n{\n*statements-to-be-executed*\n\
  *modifier*\n}\n```\n\n![image](img/pg54_1.jpg)\n\n`while` 关键字后面的括号内包含一个条件，在每次迭代时进行布尔值求值。每次迭代要执行的语句括在大括号内，并包含一个修改测试条件中值的语句，以便在某一点其求值结果返回\
  \ false 并退出循环。只要求值结果保持为 true，语句就会循环的每次迭代中执行。\n\n如果条件在第一次迭代时求值为 false，循环将立即退出，因此大括号内的语句永远不会被执行。`while`\
  \ 循环和 `for` 循环有时被称为“预测试”循环，因为它们的测试条件是在执行任何语句之前进行求值的。\n\n通过使用计数器变量作为测试条件并在每次迭代中增加其值，可以让\
  \ `while` 循环像 `for` 循环一样执行特定次数的迭代。例如，执行一组语句一百次的 `while` 循环结构可能如下所示：\n\n```javascript\n\
  let i = 0\nwhile ( i < 100 )\n{\nstatements-to-be-executed\ni++ ;\n}\n```\n\n计数器变量在每次迭代中递增，直到其值达到\
  \ 100，此时求值返回 `false` 循环结束。\n\n![image](img/snake.jpg)\n\n在 `while` 循环结构中省略修改器将创建一个永远运行的死循环。\n\
  \n![image](img/1g.jpg)创建一个带有自执行函数的 HTML 文档，从初始化一个循环计数器变量开始\n\n```javascript\nlet\
  \ i = 10\n```\n\n![image](img/htmlg.jpg)\n\nwhile.html\n\n![image](img/2g.jpg)接下来，插入一个\
  \ while 循环结构，它将进行迭代并在每次迭代中输出循环计数器的值，直到其达到零\n\n```javascript\nwhile( i > -1 )\n{\n\
  console.log( ‘Countdown Number: ‘ + i )\ni--\n}\n```\n\n![image](img/3g.jpg)保存 HTML\
  \ 文档，然后在浏览器中打开它并启动控制台查看循环迭代\n\n![image](img/pg55_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n每个 `while` 循环必须带有大括号，因为它们至少包含两个语句——一个执行语句和一个修改器。\n\n### Do 循环\n\nJavaScript 中提供的另一种循环是\
  \ `do while` 循环结构。这是此处描述的 `while` 循环的反转版本，适用于每次迭代要执行的语句绝对至少执行一次的情况。其语法如下：\n\n```javascript\n\
  do\n{\nstatements-to-be-executed\nmodifier\n}\nwhile *( condition )\n```\n\n![image](img/pg54_1.jpg)\n\
  \n`while` 关键字后面的括号内包含一个条件，在每次迭代后进行布尔值求值。每次迭代要执行的语句括在大括号内，并包含一个修改测试条件中值的语句，以便在某一点其求值结果返回\
  \ false 并退出循环。只要求值结果保持为 true，语句就会循环的每次迭代中执行。\n\n如果条件在第一次迭代时求值为 false，循环将立即退出，因此大括号内的语句已经执行了一次。`do\
  \ while` 循环有时被称为“后测试”循环，因为测试条件是在语句执行后求值的。\n\n通过使用计数器变量作为测试条件并在每次迭代中增加其值，可以让 `do\
  \ while` 循环像 `for` 循环一样执行特定次数的迭代。例如，执行一组语句一百次的 `do while` 循环结构可能如下所示：\n\n```javascript\n\
  let i = 0\ndo\n{\nstatements-to-be-executed\ni++\n}\nwhile ( i < 100 )\n```\n\n\
  计数器变量在每次迭代中递增，直到其值达到 100，此时求值返回 false 循环结束。\n\n![image](img/hot.jpg)\n\n只有在语句绝对至少执行一次时，才使用\
  \ `do while` 循环。\n\n![image](img/1g.jpg)创建一个带有自执行函数的 HTML 文档，从初始化一个循环计数器变量开始\n\n\
  ```javascript\nlet i = 2\n```\n\n![image](img/htmlg.jpg)\n\ndo.html\n\n![image](img/2g.jpg)接下来，插入一个\
  \ do while 循环结构，它将进行迭代并在每次迭代中输出循环计数器的值，直到其超过 1000\n\n```javascript\ndo\n{\ni *=\
  \ 2\nconsole.log( ‘Multiplied Number: ‘ + i )\n}\nwhile( i < 1000 )\n```\n\n![image](img/3g.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台查看循环迭代\n\n![image](img/pg57_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n注意，最终值超过了条件限制，是因为它在测试之前就已经写入了输出中。\n\n### 跳出循环\n\n\n\n\n\nJavaScript `break` 关键字可以用于遇到指定条件时退出循环。条件测试应该出现在所有要执行的其他语句之前，这样循环将立即结束。\n\
  \n![image](img/pg58_1.jpg)\n\n当 `break` 语句在嵌套在外层循环的循环中使用时，流将回到外层循环迭代继续执行。\n\nJavaScript\
  \ `continue` 关键字可以用于遇到指定条件时跳过循环的单次迭代。\n\n当 `continue` 语句在嵌套在外层循环的循环中使用时，流将从内层循环的下一次迭代开始。\n\
  \n![image](img/1g.jpg)创建一个 HTML 文档，包含一个自执行函数，该函数开始初始化两个循环计数器\n\n`let i = 0`\n\n\
  `let j = 0`\n\n![image](img/htmlg.jpg)\n\nbreak.html\n\n![image](img/2g.jpg)接下来，插入一个包含内部嵌套\
  \ for 循环的 for 循环\n\n```javascript\nfor ( i = 1 ; i < 3 ; i++ )\n{\n    console.log(\
  \ ‘Outer Loop: ‘ + i )\n    for ( j = 1 ; j < 4 ; j++ )\n    {\n        // 在此处插入语句。\n\
  \        console.log( ‘\\tInner Loop: ‘ + j )\n    }\n}\n```\n\n![image](img/hot.jpg)\n\
  \n此处处使用 `\\t` 转义序列是为了在输出中包含一个制表符空格。\n\n![image](img/3g.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台，查看外层循环的两次迭代和内层循环的三次迭代\n\
  \n![image](img/pg59_1.jpg)\n\n![image](img/4g.jpg)接下来，在内层循环中插入语句以跳过内层循环的迭代并跳出外层循环\n\
  \n```javascript\nif( ( i === 1 ) && ( j === 2 ) ) {\n    console.log( ‘\\tSkipped:\
  \ ‘ + j )\n    continue\n}\n\nif( ( i === 2 ) && ( j === 2 ) ) {\n    console.log(\
  \ ‘\\tBroken: ‘ + j )\n    break\n}\n```\n\n![image](img/5g.jpg)再次保存 HTML 文档，然后在浏览器中打开它并启动控制台，看到一次迭代被跳过且循环被完全中断\n\
  \n![image](img/pg59_2.jpg)\n\n![image](img/forget.jpg)\n\n`break` 关键字也用作 switch\
  \ 语句中的终止符。\n\n![image](img/snake.jpg)\n\n不要倾向于使用 `break` 语句来退出循环，以代替构成循环结构部分的常规条件测试。\n\
  \n## 捕获错误\n\n可能预判错误的脚本部分（例如处理用户输入的部分）可以封装在 `try catch` 结构中以处理“异常”错误。要执行的语句包含在 `try`\
  \ 块的大括号内，异常作为参数传递给随后的 `catch` 块进行处理。可选情况下，后面可以跟一个 `finally` 块，其中包含在处理异常后执行的语句。\n\
  \n![image](img/pg60_1.jpg)\n\nJavaScript 识别 `Error`、`EvalError`、`InternalError`、`RangeError`、`ReferenceError`、`SyntaxError`、`TypeError`\
  \ 和 `URIError` 错误对象。这些对象可能由解析器自动创建并传递给 `catch` 块，或通过 `new` 关键字和构造方法手动创建，然后使用 `throw`\
  \ 关键字传递。\n\n每个错误对象都可以有一个 `name` 属性和一个 `message` 属性，以允许 `catch` 块描述其性质。`message`\
  \ 被指定为手动创建的错误对象的构造函数的参数，否则它是预定义的。\n\n或者，也可以通过 `throw` 关键字将字符串传递给 `catch` 块以识别错误。然后可以通过检查字符串值来确定适当的操作。\n\
  \n![image](img/1g.jpg)创建一个 HTML 文档，包含一个自执行函数，该函数开始初始化一个变量\n\n`let day = 32`\n\n\
  ![image](img/htmlg.jpg)\n\ncatch.html\n\n![image](img/2g.jpg)接下来，插入一个 `try` 块来识别无效的整数值\n\
  \n```javascript\ntry\n{\n    if( day > 31 )\n    {\n        throw new RangeError(\
  \ ‘Day Cannot Exceed 31’ )\n    }\n    if( day < 1 )\n    {\n        throw ‘invalid’\n\
  \    }\n}\n```\n\n![image](img/3g.jpg)现在，在 `try` 块后附加一个 `catch` 块来处理无效的整数值\n\n```javascript\n\
  catch( err )\n{\n    if( err === ‘invalid’ )\n    {\n        console.log( ‘Variable\
  \ has invalid value of ‘ + day )\n    }\n    else\n    {\n        console.log( err.name\
  \ + ‘ Exception: ‘ + err.message )\n    }\n}\n```\n\n![image](img/4g.jpg)然后，在 `catch`\
  \ 块后附加一个 `finally` 块以输出最终消息\n\n```javascript\nfinally\n{\n    console.log( ‘The\
  \ script has ignored the error...’ )\n}\n```\n\n![image](img/5g.jpg)再次保存 HTML 文档，然后在浏览器中打开它并启动控制台查看捕获到的错误\n\
  \n![image](img/pg61_1.jpg)\n\n![image](img/6g.jpg)将变量值改为零，然后保存 HTML 文档并刷新浏览器以查看捕获到的错误\n\
  \n![image](img/pg61_2.jpg)\n\n![image](img/hot.jpg)\n\n删除或注释掉 `day` 变量声明，然后保存并刷新此示例以查看自动捕获的\
  \ `ReferenceError`。\n\n## 总结\n\n- 基本条件测试使用 `if` 关键字进行，以测试条件是否为布尔真或假值。\n- 可以通过 `else`\
  \ 关键字扩展 `if` 语句来提供基本条件测试的备分支。\n- 使用 `switch` 语句对大量条件进行布尔真或假值的测试。\n- 在 `switch` 块中，每个\
  \ `case` 语句必须以 `break` 关键字结束，以便在找到匹配时退出。\n- `switch` 块可以包含一个最终的 `default` 语句，在未找到匹配时执行。\n\
  - `for` 循环必须指定一个初始化器、一个测试布尔真或假值的条件以及一个修饰符。\n- 循环修饰符必须使测试的条件在某一点变为假。\n- `while` 循环在执行语句前测试条件是否为布尔真或假值。\n\
  - `do while` 循环在执行语句后测试条件。\n\n- `break` 关键字可以用于遇到指定条件时退出循环。\n- `continue` 关键字可以用于遇到指定条件时跳过循环的单次迭代。\n\
  - `try catch` 结构可以用于处理脚本中发生的异常。\n- 每个错误对象都可以有一个 `name` 属性和一个 `message` 属性，以允许 `catch`\
  \ 块描述其性质。\n- 可以通过 `throw` 关键字将字符串传递给 `catch` 块以识别错误。\n- `try catch` 结构后面可以跟一个 `finally`\
  \ 块，包含处理异常后执行的语句。\n\n## 4 使用对象\n\n*本章介绍了如何创建脚本对象并演示了如何使用内置对象。*\n\n- 自定义对象\n- 扩展对象\n\
  - 内置对象\n- 创建数组\n- 循环元素\n- 切片数组\n- 排序元素\n- 获取日期\n- 提取日历\n- 提取时间\n- 设置日期\n- 匹配模式\n\
  - 总结\n\n## 自定义对象\n\n![image](img/pg64_1.jpg)\n\n现实世界的对象无处不在，它们都有我们可以描述的属性和行为：\n\n\
  - 属性描述对象拥有的特征。\n- 行为描述对象可以执行的操作。\n\n例如，可以描述汽车具有“品牌”和“型号”属性，以及“加速”和“刹车”行为。\n\n![image](img/pg64_2.jpg)\n\
  \n这些特征可以用 JavaScript 中的一个自定义汽车对象来表示，该对象包含品牌和型号的变量属性，以及 `accelerate()` 和 `brake()`\
  \ 方法。\n\n值通过 `{ }` 内逗号分隔的键值对列表分配给对象，如下：\n\n```javascript\nlet car = { make: ‘Jeep’,\
  \ model: ‘Wrangler’,\n```\n\n\n\n\n\n```javascript\naccelerate: function ( ) { return\
  \ this.model + ‘ drives away’ } ,\nbrake: function ( ) { return this.make + ‘ pulls\
  \ up’ }\n}\n```\n\n你可以通过两种方式引用对象的属性值——使用 `objectName.propertyName` 的点符号语法，或者使用 `objectName['propertyName']`\
  \ 语法。\n\n可以使用点符号语法 `objectName.methodName()` 来调用对象方法。\n\n`this` 关键字可以在对象方法定义中使用，用以指向“拥有”该方法的对象。在上面的示例中，它指的是\
  \ `car` 对象，因此 `this.model` 引用 `car.model` 属性，而 `this.make` 引用 `car.make` 属性。\n\n\
  ![image](img/hot.jpg)\n\n在对象的 `name:value` 键值对列表中，空白会被忽略，但不要忘记在键值对之间加上逗号。\n\n![image](img/1p.jpg)\n\
  \n创建一个带有自执行执行函数的 HTML 文档，该函数首先声明一个变量来包含一个对象定义\n\n```javascript\nlet car = {\n//\
  \ 在此处插入语句。\n}\n```\n\n![image](img/htmlp.jpg)\n\nobject.html\n\n![image](img/2p.jpg)接下来，插入语句来定义对象的属性\n\
  \n```javascript\nmake: ‘Jeep’ ,\nmodel: ‘Wrangler’ ,\n```\n\n![image](img/3p.jpg)现在，插入语句来定义对象的方法\n\
  \n```javascript\naccelerate: function ( ) {\nreturn this.model + ‘ drives away’\
  \ } ,\nbrake: function ( ) {\nreturn this.make + ‘ pulls up’ }\n```\n\n![image](img/4p.jpg)然后，在变量声明的结束括号\
  \ `}` 之后，添加一条语句输出包含对象属性值的字符串——使用每种引用技术\n\n```javascript\nconsole.log( ‘Car is a\
  \ ‘ + car.make + ‘ ‘ + car[ ‘model’ ] )\n```\n\n![image](img/5p.jpg)最后，添加语句来调用每个对象方法\n\
  \n```javascript\nconsole.log( car.accelerate( ) )\nconsole.log( car.brake( ) )\n\
  ```\n\n![image](img/6p.jpg)保存该 HTML 文档，然后在浏览器中打开并启动控制台，查看对象的属性值以及从方法返回的字符串\n\n![image](img/pg65_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n你必须包含结尾的 `()` 括号来调用方法，否则它将仅仅返回函数定义。\n\n## 扩展对象\n\n\
  自定义对象非常灵活，只需通过赋值新值即可随时轻松扩展和更新，使用点符号引用属性，如 `objectName.propertyName`。\n\n![image](img/pg66_1.jpg)\n\
  \n可以使用特殊的 `for...in` 循环并使用以下语法来列出对象的所有属性名和方法名（“键”）：\n\n```javascript\nfor ( property\
  \ in objectName ) { console.log( property ) }\n```\n\n为了在每次迭代中引用每个属性的值，可以将属性变量名包含在对象名称后的方括号中，格式为\
  \ `object-Name[property]`。\n\n![image](img/1p.jpg)创建一个带有自执行函数的 HTML 文档，该函数首先初始化一个变量，精确重建上一个示例中的对象\n\
  \n```javascript\nlet property, car = {\nmake: ‘Jeep’ ,\nmodel: ‘Wrangler’ ,\naccelerate:\
  \ function ( ) {\nreturn this.model + ‘ drives away’ } ,\nbrake: function ( ) {\n\
  return this.make + ‘ pulls up’ }\n}\n```\n\n![image](img/htmlp.jpg)\n\nextend.html\n\
  \n![image](img/2p.jpg)添加循环语句来列出每个属性和方法的名称和值\n\n```javascript\nfor( property in car\
  \ ) {\nconsole.log( property + ‘: ‘ + car[ property ] )\n}\n```\n\n![image](img/3p.jpg)保存该\
  \ HTML 文档，然后在浏览器中打开并启动控制台，查看对象的键和值\n\n![image](img/pg66_2.jpg)\n\n![image](img/forget.jpg)\n\
  \n示例中的 `property` 变量实际上可以被赋予任何有效的变量名。\n\n![image](img/4p.jpg)接下来，添加语句为两个现有的对象属性分配新值\n\
  \n```javascript\ncar.make = ‘Ford’\ncar.model = ‘Bronco’\n```\n\n![image](img/5p.jpg)现在，添加语句通过一个额外的属性和额外的方法来扩展对象\n\
  \n```javascript\ncar.engine = ‘V6’\ncar.start = function ( ) {\nreturn this.make\
  \ + ‘ motor is running’ }\n```\n\n![image](img/6p.jpg)然后，添加语句输出包含对象属性值的字符串——使用每种引用技术\n\
  \n```javascript\nconsole.log( ‘\\nCar is a ‘ + car.make + ‘ ‘ + car[ ‘model’ ] )\n\
  console.log( ‘Engine Type: ‘ + car.engine )\n```\n\n![image](img/hot.jpg)\n\n该语句中的\
  \ `\\n` 转义序列用于在输出中包含换行（换行符）。\n\n![image](img/7p.jpg)最后，添加语句来调用每个对象方法\n\n```javascript\n\
  console.log( car.start( ) )\nconsole.log( car.accelerate( ) )\nconsole.log( car.brake(\
  \ ) )\n```\n\n![image](img/8p.jpg)再次保存该 HTML 文档，然后刷新浏览器以查看扩展对象的属性值以及从其方法返回的字符串\n\
  \n![image](img/pg67_1.jpg)\n\n## 内置对象\n\n![image](img/pg68_1.jpg)\n\n| 对象 |\n| :---\
  \ |\n| `String`（仅在使用 `new` 关键字创建时为对象） |\n| `Number`（仅在使用 `new` 关键字创建时为对象） |\n| `Boolean`（仅在使用\
  \ `new` 关键字创建时为对象） |\n| `Object` – 你定义的对象 |\n| `Date` – 包含日期和时间部分的对象 |\n| `Array`\
  \ – 存储索引数据项的对象 |\n| `RegExp` – 描述正则表达式模式的对象 |\n| `Math` – 提供数学属性和方法的对象 |\n| `Error`\
  \ – 提供错误详细信息的对象 |\n\nJavaScript 提供了上表列出的预定义内置对象。这些对象中，除了 `Math` 之外，每个对象都有同名的构造方法可以使用。\n\
  \n\n\n\n\n![image](img/3p.jpg)现在，插入语句输出 `Date` 节点的内容和本地格式化的日期字符串\n\n```javascript\n\
  console.log( ‘Date Object: ‘ + jsDate )\nconsole.log( ‘Locale Date String: ‘ + jsDate.toLocaleString(\
  \ ) )\n```\n\n![image](img/4p.jpg)然后，插入语句输出原始类型字面量数值值和本地格式化的数字字符串\n\n```javascript\n\
  console.log( ‘\\nPrimitive Number: ‘ + jsNumber )\nconsole.log( ‘Locale Number String:\
  \ ‘ + jsNumber.toLocaleString( ) )\n```\n\n![image](img/5p.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看输出字符串\n\
  \n![image](img/pg69_1.jpg)\n\n![image](img/forget.jpg)\n\n`Math` 对象是唯一一个不提供构造方法的\
  \ JavaScript 对象。\n\n## 创建数组\n\n`Array` 对象是 JavaScript 的内置对象，可以在单独的“元素”中存储多个项目（各种数据类型）。数组通过给变量赋值\
  \ `[]` 方括号来创建，方括号内可以包含由逗号分隔的值列表，用于初始化数组元素。其语法如下：\n\n![image](img/pg70_1.jpg)\n\n\
  ```javascript\nlet arrayName = [ value1 , value2 , value3 ]\n```\n\n与自定义对象不同（对象的每个属性都有名称），数组元素是自动编号的——从零开始。因此，第一个元素是\
  \ 0，第二个是 1，第三个是 2，以此此类推。这种编号系统通常被称为“基于零的索引”。\n\n存储在数组元素中的值可以通过在对象名后加上方括号并包含其元素索引数字来引用。例如，`colors[\
  \ 0 ]` 将引用名为“colors”的数组中第一个元素的值。\n\n当数组元素不需要立即初始化时，可以创建一个空数组稍后将值赋值给其元素，如下：\n\n```javascript\n\
  let colors = [ ]\ncolors[ 0 ] = ‘Red’\ncolors[ 1 ] = ‘Green’\ncolors[ 2 ] = ‘Blue’\n\
  ```\n\n虽然 `Array` 对象提供了 `Array()` 构造函数，但不应使用它，因为它可能会产生意想不到的结果——例如，创建一个初始化了第一个元素的数组，如下：\n\
  \n```javascript\nlet jsArray = new Array( 10 )\n```\n\n你可能会合理地预期 `jsArray[ 0 ]`\
  \ 引用第一个元素中的整数值 10，但它实际上返回一个 `undefined` 值。这是怎么了？这是一个只在你向构造方法指定单个整数参数时才会发生的异常——这会导致\
  \ JavaScript 创建一个包含 10 个空元素的数组！使用 `jsArray = [ 10 ]` 创建数组则没有该效果，并会如预期创建一个第一个元素包含整数值\
  \ 10 的数组。\n\n![image](img/forget.jpg)\n\n所有内置对象的名称以大写字母开头——因此构造函数的名称是“Array”，而不是“array”。\n\
  \n![image](img/1p.jpg)创建一个带有自执行函数的 HTML 文档，该函数首先创建一个数组——用错误的方法\n\n```javascript\n\
  let jsArray = new Array( 10 )\n```\n\n![image](img/htmlp.jpg)\n\narray.html\n\n\
  ![image](img/2p.jpg)接下来，添加语句输出第一个数组元素的值并列出整个数组\n\n```javascript\nconsole.log( jsArray[\
  \ 0 ] )\nconsole.log( jsArray )\n```\n\n![image](img/3p.jpg)现在，添加语句声明一个变量，并声明一个初始化数组的变量\n\
  \n```javascript\nlet month, summer = [ ‘June‘, ‘July‘, ‘August‘ ]\n```\n\n![image](img/4p.jpg)然后，添加一个循环输出每个数组元素的索引号和值\n\
  \n```javascript\nfor ( month in summer )\n{\n  if ( month !== ‘ ‘ )\n  {\n    console.log(\
  \ month + ‘: ‘ + summer[ month ] )\n  }\n}\n```\n\n![image](img/5p.jpg)最后添加语句输出第一个数组元素的值并列出整个数组\n\
  \n```javascript\nconsole.log( ‘Start of Summer: ‘ + summer[ 0 ] )\nconsole.log(\
  \ summer )\n```\n\n![image](img/6p.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看数组元素的内容\n\n\
  ![image](img/pg71_1.jpg)\n\n![image](img/hot.jpg)\n\n将 `for in` 循环的主体封装在 `if` 语句中是一个良好的习惯——在这里，它确保了元素不是空的。\n\
  \n## 循环元素\n\n数组和循环是绝佳拍档！任何类型的循环都可以用于向元素填充值。即使是非常巨大的数组，也可以通过这种方式“填充”——而且代码少得惊人。\n\
  \n![image](img/pg72_1.jpg)\n\n同样，循环可以快速读取每个数组元素的值，并在循环的每次迭代中对该值执行适当的操作。\n\n有用的是，每个数组都有一个\
  \ `length` 属性，其中包含该数组元素总数的整数记录。由于基于零的索引，此值始终比最后一个元素的索引号大一，因此可以随时用于条件测试以终止循环。\n\n\
  ![image](img/1p.jpg)创建一个带有自执行函数的 HTML 文档，该函数首先声明三个变量\n\n```javascript\nlet i, result,\
  \ boolArray = [ ]\n```\n\n![image](img/htmlp.jpg)\n\nelements.html\n\n![image](img/2p.jpg)接下来，输出一个简单的标题\n\
  \n```javascript\nconsole.log( ‘Fill Elements...’ )\n```\n\n![image](img/3p.jpg)现在，添加一个循环用布尔值填充\
  \ 10 个元素，并输出它们的索引号和每个存储的值\n\n```javascript\nfor( i = 1 ; i < 11 ; i++ )\n{\n  boolArray[\
  \ i ] = ( i % 2 === 0 ) ? true : false\n  console.log( ‘Element ‘ + i + ‘: ‘ + boolArray[\
  \ i ] )\n}\n```\n\n![image](img/4p.jpg)然后，输出第二个简单的标题并用空字符串值初始化变量\n\n```javascript\n\
  console.log( ‘Read Elements...’ )\nresult = ‘’\n```\n\n![image](img/5p.jpg)接下来，添加一个循环将任何包含\
  \ true 值的元素的索引号赋值给字符串\n\n```javascript\nfor( i = 1 ; i < boolArray.length ; i++\
  \ )\n{\n  if( boolArray[ i ] ) { result += i + ‘ | ‘ }\n}\n```\n\n![image](img/hot.jpg)\n\
  \n这里的数组 `length` 属性值为 11，因为数组有十一个元素——尽管元素 0 还没有填充。\n\n![image](img/6p.jpg)现在，输出字符串以显示包含\
  \ true 值的元素的索引号\n\n```javascript\nconsole.log( ‘True in Elements: ‘ + result )\n\
  ```\n\n![image](img/7p.jpg)重置字符串变量包含一个空字符串\n\n```\nresult = ‘‘\n```\n\n![image](img/8p.jpg)然后，添加一个循环将任何包含\
  \ false 值的元素的索引号赋值给字符串\n\n```javascript\nfor( i = 1 ; i < boolArray.length ; i++\
  \ )\n{\n  if( !boolArray[ i ] ) { result += i + ‘ | ‘ }\n}\n```\n\n![image](img/9p.jpg)最后，输出字符串以显示包含\
  \ false 值的元素的索引号\n\n```javascript\nconsole.log( ‘False in Elements: ‘ + result )\n\
  ```\n\n![image](img/10p.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台写入和读取元素\n\n![image](img/pg73_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n布尔值的条件测试不需要包含 `=== true`，因为那是自动的。\n\n## 切割数组\n\nJavaScript\
  \ 对象具有属性和方法。除了 `length` 属性外，每个数组对象都有用于操作数组元素的方法。它们列在下表中，并附带有它们执行任务的简短描述：\n\n![image](img/pg74_1.jpg)\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `join( *separator* )` | 将所有元素值合并由指定分隔符分隔的字符串，如果没有指定分隔符则用逗号分隔\
  \ |\n| `pop()` | 删除数组的最后一个元素并返回其值 |\n| `push( *value , value* )` | 在数组末尾添加元素并返回新长度\
  \ |\n| `reverse()` 反转数组中所有元素的顺序并返回每个元素的重排序后的值 |\n| `shift()` | 删除数组的第一个元素并返回其值 |\n\
  \n\n\n\n\n| `slice( *begin , end* )` | 返回指定索引位置之间的元素，如果未指定结束位置，则返回数组的末尾 |\n| `sort(\
  \ )` | 将数组中的所有元素按字母顺序或数字顺序进行排序，并返回每个元素重排序后的值 |\n| `splice( *position , number, value,\
  \ value* )` | 从指定的索引位置开始替换指定数量的元素值，并返回被替换的值 |\n| `unshift( *value , value* )` |\
  \ 在数组开头添加元素并返回新长度 |\n\n当 `push( )` 或 `unshift()` 方法未指定任何值时，会向数组中添加一个单一空元素。可以为 `push()`、`unshift()`\
  \ 和 `splice()` 方法指定一个用逗号分隔的值列表来更改多个元素。\n\n![image](img/hot.jpg)\n\n`join( )` 方法在将大量元素值合并为单个字符串时速度更快，但\
  \ `+` 拼接运算符在合并少数几个元素值时速度更快。\n\n![image](img/snake.jpg)\n\n`slice( )` 方法返回直到可选的结束索引位置但不包括该位置在内的元素值。\n\
  \n![image](img/1p.jpg)创建一个带有自执行函数的 HTML 文档，该函数首先创建一个数组\n\n```\nlet seasons = [ ‘Spring’,\
  \ ‘Summer’, ‘Fall’, ‘Winter’ ]\nconsole.log( ‘Elements: ‘ + seasons )\n```\n\n![image](img/htmlp.jpg)\n\
  \nslice.html\n\n![image](img/2p.jpg)接下来，输出修改后的元素列表\n\n```\nconsole.log( ‘Joined:\
  \ ‘ + seasons.join( ‘ & ‘ ) )\n```\n\n![image](img/3p.jpg)现在，从数组中提取最后一个元素\n\n```\n\
  console.log( ‘Popped: ‘ + seasons.pop( ) )\nconsole.log( ‘Elements: ‘ + seasons\
  \ )\n```\n\n![image](img/4p.jpg)然后，将最后一个元素放回数组\n\n```javascript\nconsole.log( ‘Pushed:\
  \ ‘ + seasons.push( ‘Winter’ ) )\nconsole.log( ‘Elements: ‘ + seasons )\n```\n\n\
  ![image](img/5p.jpg)接下来，仅输出两个元素值\n\n```javascript\nconsole.log( ‘Sliced: ‘ + seasons.slice(\
  \ 1, 3 ) )\n```\n\n![image](img/6p.jpg)最后，替换第三个元素的值\n\n```javascript\nconsole.log(\
  \ ‘Spliced: ‘ + seasons.splice( 2, 1, ‘Autumn’ ) )\nconsole.log( ‘Elements: ‘ +\
  \ seasons )\n```\n\n![image](img/7p.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看操作后的元素\n\n\
  ![image](img/pg75_1.jpg)\n\n![image](img/hot.jpg)\n\n不使用 `slice( )` 方法（此处原文似乎不完整，根据上下文推测为“使用\
  \ slice( ) 方法不...”）[注：由于提供的原文文本后半部分存在大量乱码或重复逻辑，此处已根据逻辑对对有效部分进行了翻译。]\n\n\n\n\n计算机日期和时间以数值形式测量，即自\
  \ 1970 年 1 月 1 日 00:00:00 以来的已时间——该点通常被称为“纪元”（epoch）。在 JavaScript 中，已时间被记录为自 `epoch`\
  \ 以来的毫秒数。可以使用 `Date` 对象的 `getTime()` 方法提取此数字，并可能将其减去另一个 `Date` 对象的数值，以计算脚本中两个时间点之间的间隔时间——例如，计算执行循环所需的时间。\n\
  \n可以使用 `toString()` 方法提取 `Date` 对象中各个组件的字符串，或者使用 `toUTCString()` 方法将其转换为 UTC 时间的等效字符串。\n\
  \n在系统已正确设置为本地时间的情况下，JavaScript 可以通过检查当前 `Date` 对象的 `getTimezoneOffset()` 方法返回的值，确定用户所在的时区。该方法返回一个整数值，表示当前本地时间与\
  \ UTC 时间的分钟差。之所以以分钟而不是小时进行计算，是因为某些时区的偏移量不是一小时的间隔——例如，加拿大的纽芬兰岛在夏令时期间为 UTC -3:30。\n\
  \n时区偏移值可用于为美国时区提供本地化，但在夏令时期间必须减去 60（分钟）。示例调用了 `Date` 对象的 `getMonth()` 和 `getDate()`\
  \ 方法，如果当前日期处于夏令时期间，则调整时区偏移值。\n\n![image](img/hot.jpg)\n\n更多示例请参见 #chapter04.xhtml，其中演示了如何通过调用\
  \ `Date` 对象的方法来使用其组件。\n\n![image](img/1p.jpg)\n\n创建一个 HTML 文档，包含一个自执行函数，开始初始化三个变量\n\
  \n```javascript\nconst now = new Date()\nlet offset = now.getTimezoneOffset()\n\
  let dst = 60\n```\n\n![image](img/htmlp.jpg)\ndate.html\n\n![image](img/2p.jpg)\n\
  \n接下来，添加语句在 11 月 3 日至 3 月 10 日之间关闭夏令时\n\n```javascript\nif (now.getMonth() < 3 &&\
  \ now.getDate() < 10) {\n    dst = 0\n}\nif (now.getMonth() > 9 && now.getDate()\
  \ > 2) {\n    dst = 0\n}\n```\n\n![image](img/3p.jpg)\n\n现在，添加一条语句来建立时区\n\n```javascript\n\
  switch (offset) {\n    case 300:\n        offset = 'East Coast';\n        break;\n\
  \    case 360:\n        offset = 'Central';\n        break;\n    case 420:\n   \
  \     offset = 'Mountain';\n        break;\n    case 480:\n        offset = 'Pacific';\n\
  \        break;\n    default:\n        offset = 'All';\n}\n```\n\n![image](img/4p.jpg)\n\
  \n最后，添加语句输出日期时间信息以及适当的问候消息\n\n```javascript\nconsole.log('System Time: ' + now.toString())\n\
  console.log('UTC (GMT) Time: ' + now.toUTCString())\nconsole.log('Welcome to ' +\
  \ offset + ' Visitors')\n```\n\n![image](img/5p.jpg)\n\n保存 HTML 文档，然后在浏览器中打开它并启动控制台查看元素\n\
  \n![image](img/pg79.jpg)\n\n![image](img/snake.jpg)\n\n`getMonth()` 方法返回一个从零开始的索引数字，其中三月的位置是\
  \ 2——更多信息请参见下一个示例 #chapter04.xhtml。\n\n![image](img/hot.jpg)\n\n发现用户的本地时区可用于引导浏览器进入与该时区相关的页面——例如，为太平洋时区的用户显示一个仅包含加州经销商的页面。但请注意，系统时间信息可以被用户轻松更改为任何时间、日期或时区，因此不一定反映其实际位置。\n\
  \n### 提取日历\n\nJavaScript `Date` 对象提供了独立的方法来提取其每个日期组件，包括年份、月份名称、日期和星期名：\n\n![image](img/pg80_1.jpg)\n\
  \n| 方法 | 返回值 |\n| :--- | :--- |\n| `getFullYear()` | 四位数的年份 (yyyy) |\n| `getMonth()`\
  \ | 月份索引数字 (0-11) |\n| `getDate()` | 日期数字 (1-31) |\n| `getDay()` | 星期几索引数字 (0-6)\
  \ |\n\n`Date` 对象的 `getFullYear()` 方法返回四位数的年份（例如 2025），而 `Date` 对象的 `getDate()` 方法返回月份中的日期数字——因此在每月的第一天，它返回\
  \ 1。\n\n出于国际化的考虑，`getMonth()` 和 `getDay()` 返回的是索引值，必须由脚本转换为本地语言的月份和星期名称。对于月份名称，这种转换很容易实现：创建一个包含所有月份名称的数组（从一月开始），然后使用\
  \ `getMonth()` 返回的索引数字从数组元素中引用相应的月份名称。\n\n同样，星期名的转换也是通过创建一个所有星期名称的数组（从星期日开始），然后使用\
  \ `getDay()` 方法返回的索引数字从数组元素中引用相应的星期名。\n\n可以将各种组件组合成按照任何区域偏好日期格式排列的日期字符串。\n\n![image](img/1p.jpg)\n\
  \n创建一个 HTML 文档，包含一个自执行函数，开始初始化三个变量\n\n```javascript\nconst days = ['Sun', 'Mon',\
  \ 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']\nconst months = ['Jan', 'Feb', 'Mar', 'Apr',\
  \ 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']\nconst now = new Date()\n\
  ```\n\n![image](img/htmlp.jpg)\ndate.html\n\n![image](img/2p.jpg)\n\n接下来，添加语句使用\
  \ `Date` 对象提取各个组件\n\n```javascript\nlet year = now.getFullYear()\nlet month = now.getMonth()\n\
  let dayNumber = now.getDate()\nlet dayName = now.getDay()\n```\n\n![image](img/3p.jpg)\n\
  \n现在，添加语句将索引数字转换为月份名称和星期名称\n\n```javascript\nlet monthName = months[month]\nlet\
  \ dayName = days[dayName]\n```\n\n![image](img/4p.jpg)\n\n然后将日期组件拼接成日期字符串——包括美式和英式格式\n\
  \n```javascript\nlet usDate = monthName + ' ' + dayNumber + ', ' + year\nlet ukDate\
  \ = dayName + ', ' + monthName + ' ' + year\n```\n\n![image](img/5p.jpg)\n\n最后，添加语句输出日期字符串\n\
  \n```javascript\nconsole.log('U.S. Date: ' + usDate)\nconsole.log('U.K. Date: '\
  \ + ukDate)\n```\n\n\n\n\n## Date 对象操作\n\n`Date` 对象的时间组件基于用户的系统时间，而该时间可能并不准确。\n\n\
  ![image](img/1p.jpg)\n\n创建一个 HTML 文档，包含一个自执行函数，该函数从初始化变量开始\n\n```javascript\nconst\
  \ now = new Date()\nlet hour = now.getHours()\nlet minute = now.getMinutes()\nlet\
  \ second = now.getSeconds()\nlet millisecond = now.getMilliseconds()\n```\n\n![image](img/htmlp.jpg)\n\
  time.html\n\n## 设置日期\n\n接下来，添加语句为小于 10 的分钟和秒值前加上一个零：\n\n```javascript\nif (minute\
  \ < 10) { minute = '0' + minute }\nif (second < 10) { second = '0' + second }\n\
  ```\n\n![image](img/2p.jpg)\n\n现在，将时间组件拼接成字符串，然后输出该字符串：\n\n```javascript\nlet time\
  \ = 'It is now: ' + hour + ':' + minute + ':' + second + '.' + millisecond\nconsole.log(time)\n\
  ```\n\n![image](img/3p.jpg)\n\n然后，输出与当前时间合适的问候语：\n\n```javascript\nlet greeting\
  \ = 'Morning!'\nif (hour > 12) { greeting = 'Afternoon!' }\nif (hour > 17) { greeting\
  \ = 'Evening!' }\nconsole.log(greeting)\n```\n\n![image](img/4p.jpg)\n\n最后，以 12\
  \ 小时格式输出时间：\n\n```javascript\nlet suffix = (hour > 11) ? 'P.M.' : 'A.M.'\nif (hour\
  \ > 12) { hour -= 12 }\nconsole.log('Time is: ' + hour + ':' + minute + suffix)\n\
  ```\n\n![image](img/5p.jpg)\n保存该 HTML 文档，然后在浏览器中打开并启动控制台查看格式化的时间字符串。\n\n![image](img/pg85_1.jpg)\n\
  ![image](img/hot.jpg)\n\n`Date` 对象还提供了方法来获取每个日期和时间组件的 UTC 等值——例如方法 `getUTCHours()`\
  \ 和 `getUTCMinutes()`。\n\n## 设置日期 (Set Dates)\n\nJavaScript 的 `Date()` 构造函数可以可选指定七个参数来设置每个组件的值：\n\
  \n```javascript\nnew Date(year, month, date, hours, minutes, seconds, milliseconds)\n\
  ```\n\n![image](img/84.jpg)\n\n当只指定年份和月份时，日期组件被设置为 1，所有时间组件被设置为 0。`Date` 对象提供了独立的方法来指定每个日期和时间组件的值：\n\
  \n| 方法 | 设置内容 |\n| :--- | :--- |\n| `setDate()` | 日期数字 (1-31) |\n| `setFullYear()`\
  \ | 四位年份 (yyyy) |\n| `setMonth()` | 月份数字 (0-11) |\n| `setHours()` | 小时数字 (0-23)\
  \ |\n| `setMinutes()` | 分钟数字 (0-59) |\n| `setSeconds()` | 秒数字 (0-59) |\n| `setMilliseconds()`\
  \ | 毫秒数字 (0-999) |\n\n`setMonth()` 方法在数值范围内设置月份，其中 0=一月-11=十二月，此外，`setFullYear()`\
  \ 方法也可以使用此语法设置月份和日期：\n\n```javascript\ndate.setFullYear(year, monthNumber, dayNumber)\n\
  ```\n\n通过显示整个 Date 对象可以显示每个组件的值。此外，所有 Date 对象都具有方法来输出显示日期和时间的各种字符串：\n\n- `toString()`\
  \ 将日期转换为字符串值\n- `toUTCString()` 将日期转换为其 UTC 等值\n- `toLocaleString()` 使用计算机的本地化习惯显示日期\n\
  - `toDateString()` 和 `toTimeString()` 可以显示日期和时间组件\n\n![image](img/hot.jpg)\n\n###\
  \ 示例：修改特定日期\n\n创建一个 HTML 文档，包含一个自执行函数，该函数从创建一个 7 月 4 日的 `Date` 对象开始：\n\n```javascript\n\
  const holiday = new Date(2025, 6, 4)\nconsole.log('Object: ' + holiday)\n```\n\n\
  ![image](img/htmlp.jpg)\nsetdate.html\n\n接下来，添加语句修改单个日期组件，使其成为中午的圣诞节：\n\n```javascript\n\
  holiday.setFullYear(2028)\nholiday.setMonth(11)\nholiday.setDate(25)\nholiday.setHours(12)\n\
  holiday.setMinutes(0)\nholiday.setSeconds(0)\nholiday.setMilliseconds(0)\n```\n\n\
  ![image](img/3p.jpg)\n\n现在，添加语句输出修改后的日期和时间及其对应的 UTC (GMT) 时间：\n\n```javascript\n\
  console.log('String: ' + holiday.toString())\nconsole.log('UTC: ' + holiday.toUTCString())\n\
  ```\n\n![image](img/4p.jpg)\n\n然后，添加语句以本地化字符串、日期字符串和时间字符串格式输出修改后的日期和时间：\n\n```javascript\n\
  console.log('Locale: ' + holiday.toLocaleString())\nconsole.log('Date: ' + holiday.toDateString())\n\
  console.log('Time: ' + holiday.toTimeString())\n```\n\n![image](img/5p.jpg)\n\n\
  `Date` 对象还有一个 `setTime()` 方法，它接受自纪元以来的毫秒数作为参数——每天有 86,400,000 毫秒，因此 `setTime(86400000)`\
  \ 将日期设置为 1970 年 1 月 1 日。\n\n## 匹配模式 (Match Patterns)\n\n`RegExp` 对象是 JavaScript\
  \ 的内置对象，可以包含“正则表达式”。\n\n![image](img/hot.jpg)\n\n正则表达式模式可能完全由字面字符组成。例如，`/wind/`\
  \ 匹配 \"windows\"。\n\n| 元字符 | 匹配内容 | 示例 |\n| :--- | :--- | :--- |\n| `.` | 任意字符 |\
  \ `..` |\n| `^` | 起始字符 | `^ja` |\n| `$` | 结尾字符 | `ja$` |\n| `*` | 零或多次重复 | `ja*`\
  \ |\n| `+` | 一或多次重复 | `ja+` |\n| `?` | 零或一次重复 | `ja?` |\n| `{ }` | 多次重复 | `ja{3\
  \ }` |\n| `[ ]` | 字符类 | `[a-z]` |\n| `\\` | 任意数字 | `\\d` |\n| `\\|` | 或或可选字符 | `a\\\
  |b` |\n| `( )` | 表达式分组 | `( )` |\n\n模式还可以在最后一个 `/` 之后包含 `i` 修饰符以执行不区分大小写的搜索，或者包含\
  \ `g` 修饰符以对所有匹配执行全局搜索。\n\n![image](img/snake.jpg)\n\n`RegExp` 对象有一个 `test()` 方法，找到匹配时返回\
  \ true，返回 false。`RegExp` 对象还有一个 `exec()` 方法，在未找到匹配时返回 `null` 值，在搜索成功时返回找到的文本，其 `index`\
  \ 属性包含匹配开始的字符位置。\n\n### 示例：正则表达式测试\n\n创建一个 HTML 文档，包含一个自执行函数，该函数从初始化变量开始：\n\n```javascript\n\
  const system = 'Windows', suite = 'Office', pattern = /ice/i\n```\n\n```javascript\n\
  console.log('In ' + system + '? ' + pattern.test(system))\nconsole.log('In ' + suite\
  \ + '? ' + pattern.test(suite))\n```\n\n\n\n\n\n![image](img/4p.jpg)然后，添加语句来输出验证格式错误的电子邮件地址的尝试结果。\n\
  \n```javascript\nlet email = ‘mike@example’\n```\n\n```javascript\nconst format\
  \ = /.+\\@.+\\..+/**\n```\n\n```javascript\nconsole.log( email + ‘ Valid? ‘ + format.test(\
  \ email ) )\n```\n\n![image](img/snake.jpg)\n\n这里使用的正则表达式仅测试了最基本的电子邮件格式要求。\n\n![image](img/5p.jpg)最后，添加语句来纠正地址格式并输出验证结果。\n\
  \n```javascript\nemail += ‘.com’\n```\n\n```javascript\nconsole.log( email + ‘ Valid?\
  \ ‘ + format.test( email ) )\n```\n\n![image](img/6.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看正则表达式的匹配情况。\n\
  \n![image](img/pg87_1.jpg)\n\n![image](img/hot.jpg)\n\n字符索引从零开始，所以第四个字符位于索引位置 3。\n\
  \n## 总结\n\n- 值以逗号分隔的`名称:值`列表形式赋值给自定义对象，位于 `{ }` 大括号内。\n- 对象属性可以使用点符号语法或通过在`[ ]`\
  \ 方括号中加引号的名称来引用。\n- 通过在对象方法名后附加 `( )` 括号来调用对象方法。\n- `this` 关键字可以在对象方法定义中使用，指向拥有该方法的对象。\n\
  - 可以通过使用点符号语法引用属性并赋值新值来扩展自定义对象。\n- 可以使用 `for in` 循环列出对象的所有属性名和方法名。\n- 所有 JavaScript\
  \ 内置对象都从顶层的 `Object.prototype` 对象继承属性和方法。\n- JavaScript 内置的 `Array` 对象将项目存储在单独的元素中，元素从零开始编号。\n\
  - 值可以以`[ ]` 方括号内的逗号分隔列表形式赋值给数组。\n- 通过在对象名后将索引数字封装在 `[ ]` 方括号中来引用数组元素中的值。\n- 每个 `Array`\
  \ 对象都有一个 `length` 属性和可以操作数组中元素的方法。\n- JavaScript 内置的 `Date` 对象提供了单独的方法来提取每个日期和时间分量。\n\
  - JavaScript `Date()` 构造函数可以可选指定二到七个参数，为每个分量设置值。\n- `Date` 对象还提供了单独的方法分别设置每个日期和时间分量的值。\n\
  - JavaScript 内置的 `RegExp` 对象可以包含一个描述字符字符串的正则表达式模式。\n- `RegExp` 对象拥有 `test()` 和 `exec()`\
  \ 方法，用于在指定的字符串参数中搜索与其模式匹配的内容。\n\n## 5 控制数字与字符串\n\n**本章描述并演示了 JavaScript 内置 `Math`\
  \ 和 `String` 对象的方法。**\n\n- 计算面积\n- 比较数字\n- 小数舍舍入\n- 生成随机数\n- 合并字符串\n- 分割字符串\n- 查找字符\n\
  - 修剪字符串\n- 总结\n\n## 计算面积\n\n![image](img/pg90_1.jpg)\n\nJavaScript 有一个内置的 `Math`\
  \ 对象，提供了许多实用的方法和数学常量。常量列在下表中，以及它们的近似值：\n\n| 常量 | 描述 |\n| :--- | :--- |\n| `Math.E`\
  \ | 常数 E，自然对数的底，近似值为 2.71828 |\n| `Math.LN2` | 2 的自然对数，近似值为 0.69315 |\n| `Math.LN10`\
  \ | 10 的自然对数，近似值为 2.30259 |\n| `Math.LOG2E` | 常数 E 的以 2 为底的数，近似值为 1.44269 |\n| `Math.LOG10E`\
  \ | 常数 E 的以十数为底的数，近似值为 0.43429 |\n| `Math.PI` | 常数 PI，近似值为 3.14159 |\n| `Math.SQRT1_2`\
  \ | 0.5 的平方根，近似值为 0.70711 |\n| `Math.SQRT2` | 2 的平方根，近似值为 1.41421 |\n\n不需要创建 `Math`\
  \ 对象的实例，因为它默认全局可用，因此在脚本的任何地方都可以通过 `Math` 对象和点符号语法访问 `Math` 常量和方法。\n\n`Math` 常量主要用于具有特定数学目的的脚本，但为了完整，上面列出了所有\
  \ `Math` 常量。\n\n![image](img/hot.jpg)\n\n所有的 `Math` 方法可以在这里查看。\n\n![image](img/1o.jpg)创建一个自执行函数的\
  \ HTML 文档，该函数从初始化变量开始。\n\n```javascript\nlet radius = 4\n```\n\n```javascript\n\
  console.log( ‘\\nRadius of Circle: ‘ + radius )\n```\n\n![image](img/htmlo.jpg)\n\
  \nconstants.html\n\n![image](img/2o.jpg)接下来，添加语句执行数学计算并在输出中显示结果。\n\n```javascript\n\
  let area = Math.PI * ( radius * radius )\n```\n\n```javascript\nconsole.log( ‘\\\
  nArea of Circle: ‘ + area )\n```\n\n![image](img/3o.jpg)现在，添加语句执行另一个数学计算并在输出中显示结果。\n\
  \n```javascript\nlet circumference = 2 * ( Math.PI * radius )\n```\n\n```javascript\n\
  console.log( ‘\\nPerimeter of Circle: ‘ + circumference )\n```\n\n![image](img/4o.jpg)然后，添加语句执行最后的数学计算并在输出中显示结果。\n\
  \n```javascript\nlet cube = ( radius * radius * radius )\n```\n\n```javascript\n\
  let volume = ( ( 4 / 3 ) * Math.PI ) * cube\n```\n\n```javascript\nconsole.log(\
  \ ‘\\nVolume of Sphere: ‘ + volume )\n```\n\n![image](img/5o.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看数学结果。\n\
  \n![image](img/pg91_1.jpg)\n\n![image](img/snake.jpg)\n\n所有的 `Math` 常量名必须大写——例如，确保使用\
  \ `Math.PI` 而不是 `Math.pi`。\n\n## 比较数字\n\n![image](img/pg92_1.jpg)\n\n内置的 `Math`\
  \ 对象提供了这些有用的方法：\n\n| 方法 | 返回 |\n| :--- | :--- |\n| `Math.abs()` | 绝对值 |\n| `Math.acos()`\
  \ | 弧余弦值 |\n| `Math.asin()` | 弧正弦值 |\n| `Math.atan()` | 弧正切值 |\n| `Math.atan2()`\
  \ | 来自 X 轴点的角度 |\n| `Math.ceil()` | 向上取整的值 |\n| `Math.cos()` | 余弦值 |\n| `Math.exp()`\
  \ | 常数 E 的指数 |\n| `Math.floor()` | 向下取整的值 |\n| `Math.log()` | 自然对数值 |\n| `Math.max()`\
  \ | 两个数字中较大的 |\n| `Math.min()` | 两个数字中较小的 |\n| `Math.pow()` | 幂值 |\n| `Math.random()`\
  \ | 伪随机数 |\n| `Math.round()` | 最近的整数值 |\n| `Math.sin()` | 正弦值 |\n| `Math.sqrt()`\
  \ | 平方根值 |\n| `Math.tan()` | 正切值 |\n\n![image](img/1o.jpg)创建一个自执行函数的 HTML 文档，该函数从初始化两个变量开始。\n\
  \n```javascript\nlet square = Math.pow( 5, 2 ) // 5 的 2 次方幂 ( 5 x 5 )\n```\n\n```javascript\n\
  let cube = Math.pow( 4, 3 ) // 4 的 3 次方幂 ( 4 x 4 x 4 )\n```\n\n![image](img/htmlo.jpg)\n\
  \nmath.html\n\n![image](img/2o.jpg)接下来，添加语句在输出中显示这两个正变量值中的最大值最小值。\n\n```javascript\n\
  console.log( ‘\\nLargest Positive: ‘ + Math.max( square, cube ) )\n```\n\n```javascript\n\
  console.log( ‘\\nSmallest Positive: ‘ + Math.min( square, cube ) )\n```\n\n![image](img/3o.jpg)现在，添加语句反转每个变量的数值极性——将正值变为负值。\n\
  \n```javascript\nsquare *= -1\n```\n\n```javascript\ncube *= -1\n```\n\n![image](img/4o.jpg)然后，添加语句在输出中显示这两个负变量值中的最大值最小值。\n\
  \n```javascript\nconsole.log( ‘\\nLargest Negative: ‘ + Math.max( square, cube )\
  \ )\n```\n\n```javascript\nconsole.log( ‘\\nSmallest Negative: ‘ + Math.min( square,\
  \ cube ) )\n```\n\n\n\n\n\n![image](img/forget.jpg)\n\n最大的负值是最接近零的那个。\n\n## 小数舍入\n\
  \nJavaScript 内置的 `Math` 对象提供了三种方法将浮点数舍入为整数值。每个方法都接受浮点值作为参数并返回一个整数。`Math.ceil()`\
  \ 方法向上舍入，`Math.floor()` 方法向下舍入，而 `Math.round()` 方法则四舍五入到最近的整数。\n\n![image](img/pg94_1.jpg)\n\
  \n在处理浮点数时，识别出 IEEE（电气与电子工程师学会）定义的流行计算机浮点数数学标准与通常接受的数学准确性之间存在差异是非常重要的。这是因为某些十进制数字无法精确转换为二进制形式。例如，小数\
  \ `81.66` 无法精确转换为二进制——因此表达式 `81.66 * 15` 返回的是 `1224.8999999999999`，而不是数学上准确的数字 `1224.9`。\n\
  \n某些编程语言提供自动舍入功能来克服浮点数差异，但 JavaScript 没有，因此必须小心，特别是在处理货币值时，以避免数学错误结果。推荐的做法是先将浮点值乘以\
  \ `100`，然后进行算术运算，最后将结果除以 `100` 以返回相同的小数位。\n\n可以使用类似的步骤将长浮点数转换为两位小数。在将值乘以 `100` 后，可以使用\
  \ `Math.round()` 方法对该值进行舍入，然后除以零返回两位小数。\n\n乘、运算、除的步骤可以写为单独步骤，也可以使用括号在单个简洁的表达式中确定顺序。例如，将名为\
  \ `num` 的变量中的长浮点数可以写写：\n\n```javascript\nnum = num * 100\nnum = Math.round( num\
  \ )\nnum /= 100\n```\n\n或者写为：\n\n```javascript\nnum = ( Math.round( num * 100 )\
  \ ) / 100\n```\n\n![image](img/hot.jpg)\n\n`Math.round()` 方法默认向上舍入——因此 `Math.round(\
  \ 7.5 )` 返回 8 而不是 7，而 `Math.round( -7.5 )` 返回 -7 而不是 -8。\n\n![image](img/1o.jpg)创建一个带有自执行函数的\
  \ HTML 文档，从初始化变量开始\n\n```javascript\nlet bodyTemp = 98.6\n```\n\n![image](img/htmlo.jpg)\n\
  \nround.html\n\n![image](img/2o.jpg)接下来，添加语句显示与浮点值最接近的整数\n\n```javascript\nconsole.log(\
  \ ‘Ceiling: ‘ + Math.ceil( bodyTemp ) )\nconsole.log( ‘Floor: ‘ + Math.floor( bodyTemp\
  \ ) )\nconsole.log( ‘Round: ‘ + Math.round( bodyTemp ) )\n```\n\n![image](img/3o.jpg)现在，添加语句显示表达式的错误计算结果及其后的等值结果\n\
  \n```javascript\nconsole.log( ‘\\nImprecision: ‘ + ( 81.66 * 15 ) )\nconsole.log(\
  \ ‘Corrected: ‘ + ( ( 81.66 * 100 ) / 100 ) )\n```\n\n![image](img/4o.jpg)然后，添加语句显示长浮点值及其转换后的等值结果\n\
  \n```javascript\nconsole.log( ‘\\nFloat: ‘ + Math.PI )\nconsole.log( ‘Commuted:\
  \ ‘ + ( Math.round ( Math.PI * 100 ) / 100 ) )\n```\n\n![image](img/5o.jpg)保存 HTML\
  \ 文档，然后在浏览器中打开它并启动控制台查看舍入后的数字\n\n![image](img/pg95_1.jpg)\n\n![image](img/forget.jpg)最内层括号中的表达式优先计算。\n\
  \n## 生成随机数\n\nJavaScript 的 `Math.random()` 方法返回一个 `0.0` 到 `1.0` 之间的随机点数。它可以用于各种需要随机数的网页效果。乘以浮点值会增加其范围。例如，将其乘以\
  \ `10` 会将范围扩大到 `0.0-10.0`。\n\n![image](img/pg96_1.jpg)\n\n通常，使用 `Math.ceil()` 方法将随机值向上舍入是有用的，这样范围就变成了\
  \ `1-10`。指定随机数范围的过程可以写为单独步骤，也可以使用括号在单个表达式中确定顺序。例如，为名为 `rand` 的变量指定 `1-10` 的范围可以写为：\n\
  \n```javascript\nlet rand = Math.random()\nrand *= 10\nrand = Math.ceil( rand )\n\
  ```\n\n或者写为：\n\n```javascript\nlet rand = Math.ceil( Math.random() * 10 )\n```\n\
  \n在指定的范围内可以生成一系列唯一的随机数。例如，在 `1-59` 范围内产生随机彩票号码：\n\n![image](img/1o.jpg)创建一个带有自执行函数的\
  \ HTML 文档，从声明变量开始\n\n```javascript\nlet i, rand, temp, nums = []\nlet str = ‘\\\
  nYour Lucky Numbers: ‘\n```\n\n![image](img/htmlo.jpg)\n\nrandom.html\n\n![image](img/2o.jpg)接下来，添加一个循环将数组元素\
  \ `1-59` 填充为相应的索引号\n\n```javascript\nfor( i = 1 ; i < 60 ; i ) { nums[ i ] = i }\n\
  ```\n\n![image](img/3o.jpg)现在，添加循环使数组元素中的数字随机化\n\n```javascript\nfor( i = 1 ; i\
  \ < 60 ; i ) {\n  rand = Math.ceil( Math.random() * 59 )\n  temp = nums[ i ]\n \
  \ nums[ i ] = nums[ rand ]\n  nums[ rand ] = temp\n}\n```\n\n![image](img/hot.jpg)步骤\
  \ 3 包含一个洗牌算法，并确保没有两个元素包含相同的数字。\n\n![image](img/4o.jpg)然后，添加循环将包含六个元素值的连字符列表追加到字符串变量\n\
  \n```javascript\nfor( i = 1 ; i < 7 ; i ) {\n  str += nums[ i ]\n  if( i !== 6 )\
  \ { str += ‘ - ‘ }\n}\n```\n\n![image](img/5o.jpg)最后，添加语句输出字符串变量\n\n```javascript\n\
  console.log( str )\n```\n\n![image](img/6o.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台，每次执行脚本都会看到指定范围内唯一的随机数选择。\n\
  \n![image](img/pg97_1.jpg)\n\n![image](img/pg97_2.jpg)这里，随机数在 `1` 到 `59` 范围内——用于玩英国乐透或美国纽约乐透。\n\
  \n![image](img/pg97_3.jpg)\n\n## 并字符串\n\nJavaScript 有一个 `String` 对象，提供了操作字符串值的有用方法。然而，没有需要使用\
  \ `new` 关键字和 `String()` 构造函数创建 `String` 对象的实例，因为其方法可以直接使用点表示法应用于字符串变量。例如，`str.toUpperCase()`\
  \ 返回名为 `str` 的字符串变量中所有字符的大写形式，而 `str.toLowerCase()` 则返回其所有字符的小写形式。\n\n![image](img/pg98_1.jpg)\n\
  \n还有一个 `length` 属性，用于存储字符串中的字符总数。\n\n之前列出的许多示例使用 `+` 拼接运算符来合并多个字符串，但也可以使用字符串 `concat()`\
  \ 方法以逗号分隔的参数列表的形式追加一个或多个字符串。\n\n某些脚本作者使用内置函数 `eval()` 来合并字符串和变量——但绝对应该避免这样做。`eval()`\
  \ 函数直接调用 JavaScript 编译器将其字符串参数编译为 JavaScript 语句：\n\n- 如果字符串表示一个表达式，`eval()` 将计算该表达式——例如\
  \ `eval('1 + 1')` 返回 `2`。\n- 如果字符串表示一个语句或一系列语句，`eval()` 将计算最后一个语句——例如代码 `eval('let\
  \ num = 100 ; alert( num )')` 会产生一个警告对话框。\n\n![image](img/pg98_2.jpg)\n\n这种 `eval()`\
  \ 的用法会在脚本性能上产生巨大代价，并且在几乎所有情况下都是必要的，因为通常有更高效、更优雅的解决方案。此外，如果脚本允许用户输入作为 JavaScript\
  \ 指令进行评估，`eval()` 函数可能会产生影响。这提供了执行恶意代码的机会。例如，代码 `eval('while( true) ; alert( )')`\
  \ 将产生导致浏览器锁死的无限循环。\n\n![image](img/snake.jpg)\n\n\n\n\n\n避免使用 `eval()` 函数，因为“eval\
  \ 是邪恶的”。\n\n![image](img/1o.jpg)\n\n创建一个 HTML 文档，包含一个自执行函数，并开始声明三个变量\n\n```javascriptlet\
  \ topic = ‘JavaScript’\nlet series = ‘in easy steps’\nlet title = ‘‘\n```\n\n![image](img/htmlo.jpg)\n\
  \nstring.html\n\n![image](img/2o.jpg)\n\n接下来，添加语句显示前两个字符串变量值转换大小写后的版本\n\n```javascript\n\
