  ![image](img/htmlb.jpg)\n\nwebapp.html\n\n![image](img/hot.jpg)表格中的空单元格具有 `id` `n0-n14`，行合计单元格具有\
  \ `rt1-rt3`，列合计单元格具有 `ct1-ct3`，右下角的总计单元格具有 `id` `gt`。在表格之后添加一个包含两个选择框、一个文本输入和一个按钮的表单。\n\
