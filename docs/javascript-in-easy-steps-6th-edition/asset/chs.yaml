  \n## 分割字符串\n\n有几种字符串方法允许从完整字符串中复制指定的某个部分。这些方法将每个字符串视为数组，其中每个元素包含一个字符或一个空格，可以通过它们的索引位置引用。与数组一样，字符串索引是从零开始的，因此第一个字符位于位置零。\n\
  \n![image](img/pg100_1.jpg)\n\n通过将其索引位置作为字符串的 `substring()` 方法的参数，可以指定开始复制“子字符串”的起点。这将复制该位置之后直到字符串末尾的所有字符。可选，可以为字符串的\
  \ `substring()` 方法提供第二个参数，以指定随后的索引位置作为子字符串的结束。这将复制起始和结束位置之间的所有字符。\n\n字符串 `substr()`\
  \ 方法提供了另一种复制子字符串的方法。与 `substring()` 方法类似，它可以接受一个参数来指定开始复制的索引位置，并将复制该位置之后直到字符串末尾的所有字符。与\
  \ `substring()` 方法不同，`substr()` 方法可以可选地提供第二个参数，以指定起始位置后要复制的字符数。\n\n同样，可以使用字符串 `slice()`\
  \ 方法来返回起始位置（由单个参数指定）之后的所有字符，或返回两个位置（由两个参数指定）之间的所有字符。\n\n有时复制由特定字符分隔的字符串部分是非常有用的。可以将分隔符指定为字符串\
  \ `split()` 方法的参数，该方法将返回该字符出现处之间所有子字符串的数组。可选，`split()` 方法可以提供第二个参数来指定它应该返回的数组大小。在这种情况下，将返回指定分隔符之间的每个子字符串，直到达到限制为止，字符串的其余部分将被忽略。\n\
  \n这些字符串方法都不会修改原始字符串，只是创建了原始字符串某个部分的副本。\n\n![image](img/hot.jpg)\n\n`substr()` 方法一向比\
  \ `substring()` 方法更容易使用——因为你只需要计算起始位置和子字符串的长度，而不需要结束位置。\n\n![image](img/hot.jpg)\n\
  \n`split()` 方法用于在示例此处 中分离 cookie 数据。\n\n![image](img/1o.jpg)\n\n创建一个 HTML 文档，包含一个自执行函数，并开始初始化一个变量\n\
  \n```javascript\nlet definition = ‘JavaScript is the original dialect of \\ the\
  \ ECMAScript standard language.’\n```\n\n![image](img/hot.jpg)\n\n反斜杠字符允许你在下一行继续字符串\n\
  \n![image](img/htmlo.jpg)\n\nsplit.html\n\n![image](img/2o.jpg)\n\n接下来，添加语句将选定的字符串切片赋值给第二个变量，然后输出其值\n\
  \n```javascript\nlet str = definition.slice( 0, 27 )\nstr += definition.slice( 62,\
  \ 70 )\nconsole.log( str )\n```\n\n![image](img/3o.jpg)\n\n现在，添加语句输出切片的四个独立单词\n\n\
  ```javascript\nconsole.log( str.split( ‘ ‘, 4 )\n```\n\n![image](img/4o.jpg)\n\n\
  然后，添加语句将原始字符串的选定子字符串赋值给第二个变量，然后输出其值\n\n```javascript\nstr = definition.substring(\
  \ 42, 52 )\nstr += definition.substring( 10, 17 )\nstr += definition.substr( 52,\
  \ 70 )\nconsole.log( str )\n```\n\n![image](img/5o.jpg)\n\n保存 HTML 文档，然后在浏览器中打开它并启动控制台查看分割后的字符串输出\n\
  \n![image](img/pg101_1.jpg)\n\n![image](img/forget.jpg)\n\n将 `''`（不带空格的空字符串）指定 `split()`\
  \ 函数的分隔符以返回字符数组。\n\n## 查找字符\n\nJavaScript `String` 对象提供了许多方法，允许在字符串中搜索特定字符或子字符串。`search()`\
  \ 方法接受子字符串作为参数，并返回它在搜索字符串中出现的位置，如果未找到则返回 -1。或者，可以将子字符串指定为 `match()` 方法的参数，如果它存在则返回该子字符串，如果不存在则返回\
  \ JavaScript 的 `null` 值。\n\n![image](img/pg102_1.jpg)\n\n`indexOf()` 方法接受子字符串作为参数，并返回首次出现的索引。`lastIndexOf()`\
  \ 工作原理相同，但它从字符串末尾向后搜索，报告最后一次出现。\n\n要发现字符串中特定索引位置的字符，可以将其索引值作为 `charAt()` 方法的参数，或者通过将其索引指定给\
  \ `charCodeAt()` 方法来揭示其数值 Unicode 值。相反，可以将一个或多个 Unicode 值作为 `String.fromCharCode()`\
  \ 方法的参数，以返回它们的字符值。\n\n此外，可以通过将字符或子字符串的值指定为 `replace()` 方法的第一个参数，并将替换值指定为第二个参数来替换所有出现的位置。\n\
  \n![image](img/1o.jpg)\n\n创建一个 HTML 文档，包含一个自执行函数，并开始用字符串值初始化一个变量\n\n```javascript\n\
  let str = ‘JavaScript in easy steps’\n```\n\n![image](img/htmlo.jpg)\n\nfind.html\n\
  \n![image](img/2o.jpg)\n\n接下来，添加语句输出两个区分敏感字符串搜索的结果\n\n```javascript\nconsole.log(\
  \ ‘”Script” Search: ‘ + str.search( ‘Script’ ) )\nconsole.log( ‘”script” Search:\
  \ ‘ + str.search( ‘script’ ) )\n```\n\n![image](img/3o.jpg)\n\n现在，添加语句输出两个区分敏感字符串匹配的结果\n\
  \n```javascript\nconsole.log( ‘\\n”Script” Match: ‘ + str.match( ‘Script’ ) )\n\
  console.log( ‘”script” Match: ‘ + str.match( ‘script’ ) )\n```\n\n![image](img/snake.jpg)\n\
  \n`null` 关键字不等同于零值，因为 `null` 没有任何值。\n\n![image](img/hot.jpg)\n\n使用双引号在单引号围绕的字符串中包含引号。\n\
  \n![image](img/4o.jpg)\n\n添加语句，如果在字符串内找到字符，则输出该字符的和最后一个索引位置\n\n```javascript\nconsole.log(\
  \ ‘\\nindexOf “s”: ‘ + str.indexOf( ‘s’ ) )\nconsole.log( ‘indexOf “m”: ‘ + str.indexOf(\
  \ ‘m’ ) )\nconsole.log( ‘\\nlastIndexOf “s”: ‘ + str.lastIndexOf( ‘s’ ) )\nconsole.log(\
  \ ‘lastIndexOf “m”: ‘ + str.lastIndexOf( ‘m’ ) )\n```\n\n![image](img/5o.jpg)\n\n\
  然后，添加语句输出字符串中的第一个字符及其 Unicode 值，加上通过其 Unicode 值指定的四个字符。\n\n\n\n\n\n```javascript\n\
  console.log( ‘\\ncharAt 0: ‘ + str.charAt( 0 ) )\n```\n\n```javascript\nconsole.log(\
  \ ‘charCodeAt 0: ‘ + str.charCodeAt( 0 ) )\n```\n\n```javascript\nconsole.log( ‘fromCharCode:\
  \ ‘ +\nString.fromCharCode( 74, 97, 118, 97 ) )\n```\n\n![image](img/6o.jpg)最后，添加语句来输出原始字符串及其修改后的版本。\n\
  \n```javascript\nconsole.log( ‘\\nOriginal: ‘ + str )\n```\n\n```javascript\nconsole.log(\
  \ ‘Replaced: ‘ + str.replace( ‘easy’, ‘simple’ ) )\n```\n\n![image](img/7o.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台以查看输出结果。\n\n![image](img/pg103_1.jpg)\n\n![image](img/hot.jpg)\n\
  \nUnicode 大写字母 A-Z 的值为 65-90，小写字母 a-z 的值为 97-122。\n\n![image](img/forget.jpg)\n\n\
  `replace( )` 方法返回原始字符串的修改版本，但实际上不会改变原始字符串。\n\n### 修剪字符串\n\nJavaScript 的 `String`\
  \ 对象提供了一个 `trim( )` 方法，可以移除字符串两端的空白字符。这对于确保用户输入不会意外包含空格、制表符或换行符特别有用。\n\n![image](img/pg104_1.jpg)\n\
  \n从字符串中修剪空白后，你可以使用 `startsWith( )` 方法验证其开头字符，并使用 `endsWith( )` 方法验证其末尾字符。这些方法都接受字符或子字符串作为参数，并在字符串中进行区分大小的匹配。如果找到匹配，它们将返回\
  \ `true`；否则如果没有找到匹配，将返回 `false`。\n\n可以通过在字符串变量名后的 `[ ]` 方括号中指定其索引位置来引用单个字符——例如使用\
  \ `str[ 0 ]` 来引用名为“str”的变量中的第一个字母。\n\n你还可以通过指定字符或子字符串作为 `includes( )` 方法的参数，在字符串中进行区分大小的匹配。如果找到匹配，将返回\
  \ `true`；否则如果没有找到匹配，将返回 `false`。\n\n如果你希望构建一个包含现有字符串多个副本的新字符串，只需为 `repeat( )` 方法指定一个整数参数，以确定现有字符串在新创建的字符串中重复的次数。\n\
  \n![image](img/1o.jpg)创建一个 HTML 文档，其中包含自执行函数，该函数首先初始化一个变量——其值为一个两端带有空白字符的字符串。\n\n\
  ```javascript\nlet str = ‘ Love For All, Hatred For None.  ;’\n```\n\n![image](img/htmlo.jpg)\n\
  \ntrim.html\n\n![image](img/2o.jpg)接下来，添加语句输出字符串并测试它的开头和结尾。\n\n```javascript\nconsole.log(\
  \ ‘String: ‘ + str )\n```\n\n```javascript\nconsole.log( ‘Starts With “L” ? ‘ +\
  \ str.startsWith( ‘L’ ) )\n```\n\n```javascript\nconsole.log( ‘Ends With “.” ? ‘+str.endsWith(\
  \ ‘.’ ) )\n```\n\n```javascript\nconsole.log( ‘First Letter: ‘ + str[ 0 ] )\n```\n\
  \n![image](img/3o.jpg)现在，添加一条语句将修剪后的字符串赋值给变量。\n\n```javascript\nstr = str.trim(\
  \ )\n```\n\n![image](img/hot.jpg)\n\n`split( )` 方法用于移除示例此处中 cookie 数据中的空白字符。\n\n\
  ![image](img/4o.jpg)然后，添加语句输出修剪后的字符串并像之前一样测试它的开头和结尾。\n\n```javascript\nconsole.log(\
  \ ‘Trimmed: ‘ + str )\n```\n\n```javascript\nconsole.log( ‘Starts With “L” ? ‘ +\
  \ str.startsWith( ‘L’ ) )\n```\n\n```javascript\nconsole.log( ‘Ends With “.” ? ‘+str.endsWith(\
  \ ‘.’ ) )\n```\n\n```javascript\nconsole.log( ‘First Letter: ‘ + str[ 0 ] )\n```\n\
  \n![image](img/5o.jpg)添加语句以查看字符串中的子字符串。\n\n```javascript\nconsole.log( ‘\\nIncludes\
  \ “Hat” ?+ str.includes( ‘Hat’ ) )\n```\n\n```javascript\nconsole.log( ‘Includes\
  \ “hat” ?+ str.includes( ‘hat’ ) )\n```\n\n![image](img/6o.jpg)最后，添加一条语句输出 10 份修剪后的字符串。\n\
  \n```javascript\nconsole.log( ‘\\nRepeat:\\n’ + str.repeat( 10 ) )\n```\n\n![image](img/7o.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台以查看输出结果。\n\n![image](img/pg105_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n字符匹配也可以使用等等运算符进行，例如 `str[ 0 ] === ‘L’`。\n\n![image](img/forget.jpg)\n\n使用这些方法匹配是区分大小的。\n\
  \n## 总结\n\n- `Math` 对象提供了数学常量（如 `Math.PI`）和数学方法（如 `Math.max( )`）。\n- 浮点数可以使用 `Math.floor(\
  \ )`、`Math.ceil( )` 和 `Math.round( )` 方法舍入到最接近的整数。\n- JavaScript 不提供自动舍入来解决浮点数差异。\n\
  - 将浮点值乘以 100，执行运算，然后将结果除以 100 以避免差异误差。\n- `Math.random( )` 方法返回一个 0.0 到 1.0 之间的随机浮点数。\n\
  - 将随机浮点数乘以 10 并使用 `Math.ceil( )` 对结果舍入，范围变为 1-10。\n- `String` 对象提供了处理字符串值的有用方法，如\
  \ `toUpperCase( )` 和 `toLowerCase( )`。\n- 每个字符串都有一个 `length` 属性，包含一个表示该字符串字符总数的整数。\n\
  - 可以使用 `+` 拼接运算符或字符串 `concat( )` 方法将字符串连接在一起。\n- `eval( )` 内置函数可能会产生安全影响，因此最好避免。\n\
  - `slice( )` 和 `substring( )` 方法的参数指定起始和结束位置，但 `substr( )` 方法的参数指定起始位置和要复制的字符数。\n\
  - `split( )` 方法返回位于指定字符出现位置之间的所有子字符串的数组。\n- `search( )`、`match( )`、`indexOf( )`、`lastIndexOf(\
  \ )` 和 `charAt( )` 方法可用于在字符串内查找字符。\n- `trim( )` 方法移除字符串两端的空白字符。\n- `startsWith(\
  \ )`、`endsWith( )` 和 `includes( )` 方法在字符串内进行区分大小的匹配。\n- `replace( )` 和 `repeat(\
  \ )` 方法创建后的字符串。\n\n## 6 处理 Window 对象\n\n*本章描述并演示了顶层 Window 对象环境的方法。*\n\n- 认识 DOM\n\
  - 检查属性\n- 显示对话框\n- 滚动查看\n- 弹出窗口\n- 制作计时器\n- 检查浏览器\n- 检查状态\n- 控制位置\n- 浏览历史\n- 总结\n\
  \n### 认识 DOM\n\n![image](img/pg108_1.jpg)\n\n浏览器在一个称为“文档模型”（DOM）的层次树中表示网页的所有组件。每个组件都在顶层窗口对象下方，树包含如下分支：\n\
  \n![image](img/pg108_2.jpg)\n\n可以使用 `for in` 循环列出浏览器提供的窗口对象属性。列表将包含所有现代浏览器的基础属性，以及特定浏览器的少量属性。\n\
  \n![image](img/hot.jpg)\n\n跟随方括号的项目是数组对象，而圆括号内的是各种表单元素。\n\n![image](img/1bl.jpg)创建一个带有空列表元素的\
  \ HTML 文档。\n\n```html\n<ol id=\"props\" style=\"column-count:3\"></ol>\n```\n\n\
  ![image](img/htmlbl.jpg)\n\ndom.html\n\n![image](img/2bl.jpg)接下来，在 `script` 元素中创建一个自执行函数，该函数首先初始化两个变量。\n\
  \n```javascript\nconst list = document.getElementById( ‘props’ )\nlet property =\
  \ null\n```\n\n![image](img/3bl.jpg)现在，添加一个循环，为列表元素填充浏览器窗口对象的直接属性。\n\n```javascript\n\
  for( property in window )\n{\n  if( property ) { list.innerHTML += ‘<li>’ + property\
  \ }\n}\n```\n\n![image](img/4bl.jpg)保存 HTML 文档，然后在浏览器中打开它以查看窗口属性和方法名。\n\n![image](img/pg109_1.jpg)\n\
  \n\n\n\n\n![image](img/forget.jpg)\n\n闭合 `</li>` 标签是可选的，因此在此循环中省略了。\n\n![image](img/hot.jpg)\n\
  \n滚动列表以检查所有的 `window` 属性和方法——这次总共有 204 个项目。对面树状插图中重要的属性在截图中已高亮显示。\n\n### 检查属性\n\n\
  顶层 DOM `window` 对象有一个 `screen` 子对象，该对象提供了描述用户显示器分辨率（以像素为单位）的属性。屏幕尺寸可以在 `window.screen.width`\
  \ 和 `window.screen.height` 属性中找到。\n\n![image](img/pg110_1.jpg)\n\n同样，可用的屏幕尺寸（排除桌面任务栏占据的空间）可以在\
  \ `window.screen.availWidth` 和 `window.screen.availHeight` 属性中找到。\n\n屏幕的色彩能力可以通过\
  \ `window.screen.colorDepth` 属性发现，该属性包含一个位值，描述屏幕可以显示的可能颜色范围：\n\n- **8-bit** – 低色（Low\
  \ Color），只能显示 256 种颜色。\n- **16-bit** – 高色（High Color），可以显示 65,536 种颜色。\n- **24-bit**\
  \ – 真色（True Color），可以显示数百万种颜色。\n- **32-bit** – 深色（Deep Color），可以显示包含十亿或更多颜色的色域。\n\
  \n现代计算机使用 24 位或 32 位硬件进行色彩显示，而旧的计算机使用 16 位硬件。只有非常旧的计算机和旧手机使用 8 位硬件进行色彩显示。\n\n还有一个\
  \ `window.screen.pixelDepth` 属性包含屏幕的像素深度，但在现代计算机上，这个值与 `window.screen.colorDepth`\
  \ 属性的值相同——始终使用 `window.screen.colorDepth` 来发现色彩能力。\n\n某些浏览器现在支持 `window.screen.orientation`\
  \ 对象，它有一个 `type` 属性，描述屏幕当前的方向为横屏或竖屏，以及这是否为屏幕的主次常用方向。\n\n由于 `window` 对象是浏览器脚本环境中的顶层全局对象，在引用其子对象及其属性时可以可选省略它的名称。例如，你可以直接写\
  \ `screen.colorDepth` 来引用 `window.screen.colorDepth` 属性。\n\n![image](img/snake.jpg)\n\
  \n注意这些属性名的“驼峰命名法”（camelCase）大小写。\n\n![image](img/1bl.jpg)创建一个空段落的 HTML 文档\n\n```html\n\
  <p id=\"props\" style=\"font:1.5em sans-serif\"></p>\n```\n\n![image](img/htmlbl.jpg)\n\
  \nscreen.html\n\n![image](img/2bl.jpg)接下来，在 script 元素中创建一个自执行函数，该函数开始初始化六个变量\n\n\
  ```javascript\nconst info = document.getElementById( ‘props’ )\nlet width = window.screen.width\
  \ + ‘px’\nlet height = window.screen.height + ‘px’\nlet availW = window.screen.availWidth\
  \ + ‘px’\nlet availH = window.screen.availHeight + ‘px’\nlet colors = ‘Unknown’\n\
  ```\n\n![image](img/3bl.jpg)现在，添加一条语句描述色彩能力\n\n```javascript\nswitch( window.screen.colorDepth\
  \ )\n{\n  case 8 : colors = ‘Low Color’ ; break\n  case 16 : colors = ‘High Color’\
  \ ; break\n  case 24 : colors = ‘True Color’ ; break\n  case 32 : colors = ‘Deep\
  \ Color’ ; break\n}\n```\n\n![image](img/4bl.jpg)然后，添加语句显示屏幕信息\n\n```javascript\n\
  info.innerHTML = ‘Screen Resolution: ‘ +\nwidth + ‘ x ‘ + height + ‘<br>’\ninfo.innerHTML\
  \ += ‘Available Screen Size: ‘ +\navailW + ‘ x ‘ + availH + ‘<br>’\ninfo.innerHTML\
  \ += ‘Color Capability: ‘ + colors + ‘<br>’\nif( window.screen.orientation )\n{\n\
  \  info.innerHTML += ‘Orientation: ‘ +\n  window.screen.orientation.type\n}\n```\n\
  \n![image](img/5bl.jpg)保存 HTML 文档，然后在浏览器中打开它以查看屏幕信息\n\n![image](img/pg111_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n这里的可用高度比屏幕高度少 40 像素，因为桌面任务栏高度为 40 像素。\n\n![image](img/hot.jpg)\n\
  \n`colorDepth` 属性可以用于为色彩能力有限的浏览器在文档提供低分辨率图像。\n\n### 显示对话框\n\n顶层 DOM `window` 对象提供了三种方法，JavaScript\
  \ 可以这些方法向用户显示对话消息。可以将简单的警告消息字符串作为 `window.alert()` 方法的参数。它将显示在一个只有一个“确定”按钮的对话框中，点击该按钮仅会关闭对话框。\n\
  \n![image](img/pg112_1.jpg)\n\n更有用的是，可以指定消息作为 `window.confirm()` 方法的参数，请求用户做出决定。它将显示在一个带有“确定”按钮和“取消”按钮的对话框中。按下任何一个按钮都会关闭对话框，但“确定”按钮返回\
  \ `true` 值，而“取消”按钮返回 `false` 值。\n\n还可以指定消息作为 `window.prompt()` 方法的参数，请求用户输入。它将显示在一个带有“确定”按钮、“取消”按钮和一个文本输入字段的对话框中。按下任何一个按钮都会关闭对话框，但“确定”按钮返回文本字段中的值，而“取消”按钮返回\
  \ `null` 值。还可以为 `window.prompt()` 方法提供第二个参数来指定文本字段的默认内容。\n\n![image](img/1bl.jpg)创建一个空段落的\
  \ HTML 文档\n\n```html\n<p id=\"response\" style=\"font:1.5em sans-serif\"></p>\n\
  ```\n\n![image](img/htmlbl.jpg)\n\ndialogs.html\n\n![image](img/2bl.jpg)接下来，在 script\
  \ 元素中创建一个自执行函数，该函数开始初始化一个变量引用\n\n```javascript\nconst info = document.getElementById(\
  \ ‘response’ )\n```\n\n![image](img/3bl.jpg)现在，添加一条语句在简单的对话框上显示消息\n\n```javascript\n\
  window.alert( ‘Hello from JavaScript’ )\n```\n\n![image](img/4bl.jpg)然后，添加一条语句用户用户决定并将响应写入段落中\n\
  \n```javascript\ninfo.innerHTML = ‘Confirm: ‘ + window.confirm( ‘Go or Stop?’ )\n\
  ```\n\n![image](img/5bl.jpg)接下来，添加一条语句请求用户输入文本并将文本响应写入段落中\n\n```javascript\ninfo.innerHTML\
  \ += ‘<br>Prompt: ‘ + window.prompt( ‘Yes or No?’, ‘Yes’ )\n```\n\n![image](img/6bl.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它以查看消息出现在简单的对话框上\n\n![image](img/pg113_1.jpg)\n\n![image](img/7bl.jpg)点击每个对话框上的“确定”按钮以依次关闭它们，然后查看响应出现在段落中\n\
  \n![image](img/pg113_2.jpg)\n\n![image](img/pg113_3.jpg)\n\n![image](img/pg113_4.jpg)\n\
  \n![image](img/hot.jpg)\n\n`confirm` 对话框结合 `if` 语句用于脚本分支——例如，\n\n```javascript\n\
  if( confirm( ‘OK?’ ) ) { ... } else { ... }\n```\n\n![image](img/forget.jpg)\n\n\
  如果脚本要使用来自 `prompt` 对话框的文本输入，良好的做法是去除字符串两端的空格——参见此处。\n\n### 滚动查看\n\nDOM `window`\
  \ 对象有一个 `scrollBy()` 方法，允许窗口在内容向任一方向溢出时进行水平或垂直滚动。该方法需要两个参数来指定沿 X 轴和 Y 轴移动的像素数。\n\
  \n![image](img/pg114_1.jpg)\n\n当内容垂直溢出窗口时，浏览器窗口的右侧会出现一个滚动条。`scrollBy()` 方法将按照其第一个参数指定的像素数进行滚动——直到到达内容的末端。\n\
  \n同样，当内容水平溢出窗口时，浏览器窗口的底部会出现一个滚动条。`scrollBy()` 方法将按照其第二个参数指定的像素数进行滚动——直到到达内容的末端。\n\
  \n\n\n\n\n还有一个 `scrollTo()` 方法，它接受两个参数，用于指定 X 和 Y 坐标，当内容在水平或垂直方向溢出窗口时，窗口左上角应滚动到的这些坐标。这可以用于偏离默认的\
  \ `X=0`, `Y=0` 坐标，到指定的替代位置。例如，当浏览器以表格电子表格格式显示数据，且第一行的第一个单元格位于浏览器窗口的左上角时，`scrollTo()`\
  \ 方法可以将特定的单元格放在浏览器窗口的左上角。\n\nDOM 窗口对象有一个 `scrollX` 属性，存储窗口水平滚动的像素数。这表示“滑块”（滚动框）在窗口底部滚动条上的位置，相对于其左角的距离。`window.scrollX`\
  \ 属性是旧属性 `window.pageXOffset` 的别名，该属性在 DOM 中仍然存在，并且为了向后兼容可以代替 `window.scrollX` 使用。\n\
  \n同样，还有一个 `scrollY` 属性，它存储窗口垂直滚动的像素数。这表示滑块在窗口右侧滚动条上的位置，相对于其顶角的距离。`window.scrollY`\
  \ 属性是旧属性 `window.pageYOffset` 的别名，该属性在 DOM 中仍然存在，并且为了向后兼容可以代替 `window.scrollY` 使用。\n\
  \n![image](img/hot.jpg)\n\n为 `scrollBy()` 方法提供负值可以向上和向左移动。\n\n![image](img/snake.jpg)\n\
  \n`scrollby()` 方法的效果在内容溢出窗口（导致滚动条出现）时才会明显。\n\n![image](img/1bl.jpg)创建一个 HTML 文档，其中包含一个从左侧缩进的空段落\n\
  \n```html\n<p id=”info\" style=\"width:2000px; margin-left:300px; font:1.2em sans-serif\"\
  ></p>\n```\n\n![image](img/htmlbl.jpg)\n\nscroll.html\n\n![image](img/2bl.jpg)接下来，在\
  \ script 元素中创建一个自执行函数，该函数开始初始化两个变量\n\n```javascript\nconst info = document.getElementById(\
  \ ‘info’ )\nlet i = 0\n```\n\n![image](img/3bl.jpg)现在，添加一个循环向段落中写入一列 40 个数字\n\n\
  ```javascript\nfor( i = 1 ; i < 41 ; i++ )\n{\n    info.innerHTML += ( i + ‘<br>’\
  \ )\n}\n```\n\n![image](img/4bl.jpg)然后，添加一条语句窗口水平向右滚动 200 像素，并垂直向下滚动段落元素的高度\n\n\
  ```javascript\nwindow.scrollBy( 200, info.clientHeight )\n```\n\n![image](img/hot.jpg)\n\
  \n注意这里使用了元素的 `clientHeight` 属性。元素还有一个非常有用的 `clientWidth` 属性。\n\n![image](img/5bl.jpg)最后，添加一条语句来追加当前窗口滑块位置的确认\n\
  \n```javascript\ninfo.innerHTML += ‘scrollX: ‘ + window.scrollX + ‘& scrollY: ‘\
  \ + window.scrollY\n```\n\n![image](img/6bl.jpg)保存该 HTML 文档，然后在浏览器中打开它以查看窗口滚动和滑块位置\n\
  \n![image](img/pg115_1.jpg)\n\n## 弹出窗口\n\n![image](img/pg116_1.jpg)\n\n可以使用窗口对象的\
  \ `open()` 方法打开新的浏览器窗口。这需要三个参数：指定在新窗口中加载的 HTML 文档的 URL 地址、新窗口的名称，以及该窗口应包含的逗号分隔特性列表——来自下表描述的可能特性：\n\
  \n| 特性 | 说明 |\n| :--- | :--- |\n| directories | 添加链接栏 |\n| height | 设置文档区域的高度（像素）\
  \ |\n| left | 窗口的屏幕 X 坐标 |\n| location | 添加地址栏 |\n| menubar | 添加标准菜单栏 |\n| resizable\
  \ | 允许调整窗口大小 |\n| scrollbars | 需要时启用滚动条 |\n| status | 添加状态栏 |\n| toolbar | 添加前进和后退按钮栏\
  \ |\n| top | 窗口的屏幕 Y 坐标 |\n| width | 设置文档区域的宽度（像素） |\n\n当成功时，`window.open()` 方法返回一个新窗口对象并打开新的“弹出”窗口；如果失败，该方法简单返回\
  \ null。返回的结果应赋值给一个变量，随后对其进行测试——如果变量不为 null，则它必须代表弹出窗口对象。然后可以通过调用 `close()` 方法关闭该窗口，或通过调用\
  \ `print()` 方法打印其内容。\n\n还可以通过指定 X 和 Y 屏幕轴坐标作为窗口 `moveTo()` 方法的参数来定位窗口。还有一个类似的 `window.moveBy()`\
  \ 方法，它接受两个参数，指定窗口从当前屏幕位置沿 X 和 Y 轴移动多少像素。\n\n![image](img/forget.jpg)\n\n由于弹出窗口烦人的泛滥，浏览器制造商添加了弹出拦截器——因此不再建议使用弹出窗口，但为了完整性，这里对其进行了演示。\n\
  \n![image](img/1bl.jpg)创建一个包含标题的 HTML 文档\n\n```html\n<h1>Pop-up Window</h1>\n```\n\
  \n![image](img/htmlbl.jpg)popup.html\n\n![image](img/2bl.jpg)创建一个包含标题的第二个文档\n\n\
  ```html\n<h1>Main Window</h1>\n```\n\n![image](img/3bl.jpg)opener.html\n\n![image](img/4bl.jpg)接下来，在第二个文档的\
  \ script 元素中添加\n\n```javascript\nconst popWin = window.open( ‘popup.html’, ‘Popup’,\
  \ ‘top=150,left=100,width=350,height=100’ )\n```\n\n![image](img/5bl.jpg)保存两个 HTML\
  \ 文档，然后在浏览器中打开它们以查看弹出已被拦截\n\n![image](img/pg117_1.jpg)\n\n![image](img/6.jpg)打开浏览器的弹出拦截器对话框并选择允许来自此页面的弹出\n\
  \n![image](img/pg117_2.jpg)\n\n![image](img/6bl.jpg)现在，刷新浏览器窗口查看弹出窗口出现\n\n![image](img/pg117_3.jpg)\n\
  \n![image](img/snake.jpg)\n\n在特性列表中不要包含任何空格，否则可能导致 `window.open()` 方法失败。\n\n![image](img/hot.jpg)\n\
  \n注意弹出窗口没有在其标题栏上显示指定的“网站图标”。\n\n## 创建计时器\n\nJavaScript 窗口对象有一个有趣的 `setTimeout()`\
  \ 方法，它可以在指定时间后重复评估一个表达式。在指定的表达式调用 `setTimeout()` 语句的地方，会创建一个递归循环——其中函数会在指定时间后被重复执行。\n\
  \n![image](img/pg118_1.jpg)\n\n`setTimeout()` 方法要评估的表达式必须作为其第一个参数指定，而时间必须作为第二个参数指定的数字。时间以毫秒表示，其中\
  \ 1000 代表一秒。\n\n`setTimeout()` 方法返回一个数值，该数值可以赋值给变量以唯一标识等待过程。此值可以作为窗口对象 `clearTimeout()`\
  \ 方法的参数，以便在某处终止计时循环。\n\n窗口对象还有 `setInterval()` 和 `clearInterval()` 方法，它们采用相同的参数且工作方式相似。区别在于，`setInterval()`\
  \ 指定的时间是评估表达式的间隔时间，无论执行需要多长时间。相反，`setTimeout()` 方法指定的时间是从上一次执行结束到下一次执行开始的时间段。这意味着当间隔较短且执行表达式所需时间较长，`setInterval()`\
  \ 可能会尝试重叠执行。因此，通常优选使用 `setTimeout()` 方法。\n\n![image](img/1bl.jpg)创建一个带有空段落的 HTML\
  \ 文档\n\n```html\n<p id=”info\"></p>\n```\n\n![image](img/htmlbl.jpg)\n\ntimer.html\n\
  \n\n\n\n\n![image](img/2bl.jpg)\n\n接下来，在 script 元素中，使用一个返回递减整数的闭包函数初始化一个变量\n\n```javascript\n\
  const count = ( function ( ) {\n  let num = 10\n  return ( function( ) { return\
  \ num-- } )\n} ) ( )\n```\n\n![image](img/forget.jpg)\n\n一个设置为间隔为 10 分钟的两分钟任务每 10\
  \ 分钟启动一次，但一个设置为超时为 10 分钟的相同任务则每 12 分钟启动一次（10+2）。\n\n![image](img/hot.jpg)\n\n关于闭包函数的复习，请参此处。\n\
  \n![image](img/3bl.jpg)现在，添加一个计时器函数，该函数开始初始化三个变量\n\n```javascript\nfunction countDown(\
  \ ) \n{\n  const info = document.getElementById( ‘info’ )\n  let timerId = null\n\
  \  let num = count( )\n  // 在此处插入语句。\n}\n```\n\n![image](img/4bl.jpg)插入语句以每秒一次的间隔将递减整数写入段落中，直到达到零\n\
  \n```javascript\nif ( num > 0 )\n{\n  info.innerHTML += ‘<span>’+ num + ‘</span>’\n\
  \  timerId = window.setTimeout( countDown , 1000 )\n}\nelse\n{\n  info.innerHTML\
  \ += ‘<span>Lift Off!</span>’\n  window.clearTimeout( timerId )\n}\n```\n\n![image](img/5bl.jpg)在函数块之后，添加一条语句在页面加载时调用计时器函数\n\
  \n```javascript\ncountDown( )\n```\n\n![image](img/6bl.jpg)保存 HTML 文档，然后在浏览器中打开它，以查看计时器倒计时\
  \ 10 秒\n\n![image](img/pg119_1.jpg)\n\n![image](img/pg119_2.jpg)\n\n![image](img/pg119_3.jpg)\n\
  \n![image](img/hot.jpg)\n\n你可以性地在计时器函数中添加 `console.log( timerId )` 语句，以查看计时器的 ID\
  \ 值。\n\n## 检查浏览器\n\n在 DOM 层次结构中，顶层窗口对象有很多子对象，每个对象都有自己的属性和方法。其中之一是 `window.navigator`\
  \ 对象，它包含了有关网络浏览器的信息。由于顶层窗口对象存在“全局命名空间”中，它的所有子对象都可以省略地址的该部分，因此可以使用 `alert(` 直接调用\
  \ `window.alert( )` 方法，可以使用 `onload` 引用 `window.onload` 属性，可以使用 `navigator` 引用 `window.\
  \ navigator` 对象。\n\n![image](img/pg120_1.jpg)\n\n`navigator` 对象有一个 `appName` 属性包含浏览器名称，`appCodeName`\
  \ 属性包含其代码，`appVersion` 属性包含其版本号。但你可能会对这些值感到惊讶，因为 Google Chrome、Firefox、Safari 和\
  \ Opera 都将它们的代码标记为“Mozilla”。\n\n每个浏览器在向 Web 服务器发送请求时，会在名为“User-Agent”的 HTTP 请求头中发送浏览器代码和版本，此字符串也可以从\
  \ `navigator.userAgent` 属性中获取。还有一个 `navigator.platform` 属性用于描述浏览器的宿操作系统。\n\n在过去几年中，人们非常关注浏览器检测脚本，这些脚本尝试通过\
  \ `navigator` 属性来识别浏览器，以便提供适用于该浏览器支持的功能的适当代码。这现在被认为是不良实践，现在建议使用特性检测。\n\n例如，查询浏览器是否支持有用的\
  \ `addEventListener( )` 方法可以判断该浏览器是否支持现代的文档对象模型。\n\n![image](img/1bl.jpg)创建一个空列表的\
  \ HTML 文档\n\n```html\n<ul id=”list”></ul>\n```\n\n![image](img/htmlbl.jpg)\n\nbrowser.html\n\
  \n![image](img/2bl.jpg)接下来，在 script 元素中，创建一个自执行函数，该函数开始初始化变量引用\n\n```javascript\n\
  const list = document.getElementById( ‘list’ )\n```\n\n![image](img/3bl.jpg)现在，添加语句列出你浏览器的名称\n\
  \n```javascript\nlist.innerHTML = ‘<li>Browser: ‘ + navigator.appName\nlist.innerHTML\
  \ += ‘<li>Code Name: ‘ +\nnavigator.appCodeName\n```\n\n![image](img/hot.jpg)\n\n\
  之前的示例显式地使用了 `window` 前缀，以使 `window` 对象方法和属性的父关系明显，但在技术上最好省略 `window.` 前缀——这样它们就不会通过\
  \ `window` 对象自身的 `window` 属性被引用。例如，直接使用 `onload` 而不是 `window.onload`。\n\n![image](img/4bl.jpg)然后，添加语句列出你的浏览器和你操作系统的版本详情\n\
  \n```javascript\nlist.innerHTML += ‘<li>Version: ‘ + navigator.appVersion\nlist.innerHTML\
  \ += ‘<li>Platform: ‘ + navigator.platform\n```\n\n![image](img/5bl.jpg)最后，添加一条语句确认你使用的是现代浏览器\n\
  \n```javascript\nif( window.addEventListener )\n{\n  list.innerHTML += ‘<li>This\
  \ is a modern DOM browser’\n}\n```\n\n![image](img/6bl.jpg)保存 HTML 文档，然后在任何浏览器中打开它以查看名称和版本详情\n\
  \n![image](img/pg119_1.jpg)\n\n![image](img/pg119_2.jpg)\n\n![image](img/pg119_3.jpg)\n\
  \n![image](img/hot.jpg)\n\n在所有现代浏览器中，`window` 对象都有一个 `addEventListener( )` 方法——Google\
  \ Chrome 和其他浏览器之所以自称为 Netscape，原因源于“浏览器大战”时代——当时浏览器必须采用这些名称以便提供网页。\n\n## 检查状态\n\n\
  DOM 窗口对象有一个 `javaEnabled()` 方法，只有在启用了 Java 支持时它才会返回 true。\n\n![image](img/pg122.jpg)\n\
  \n还有一个 `cookieEnabled` 属性，只有在启用了 cookie 支持时它为真。\n\n此外，`navigator` 拥有 `plugins` 子对象和\
  \ `mimeTypes` 子对象。与其他数组一样，`plugins` 和 `mimeTypes` 数组都有一个 `length` 属性，包含其元素的数字总数。\n\
  \n每个 `plugin` 数组元素都有 `name` 和 `description` 属性，包含一个插件的详情。可以使用元素索引引用它们。例如，`navigator.plugins[0].name`\
  \ 引用第一个元素的名称。\n\n同样，每个 `mimeTypes` 数组元素都有 `type` 和 `description` 属性，包含一个支持的 MIME\
  \ 特性的详情。可以使用元素索引引用它们。例如，`navigator.mimeTypes[0].type` 引用第一个元素的类型。\n\n![image](img/1bl.jpg)创建一个空段落的\
  \ HTML 文档\n\n```html\n<p id=”info”></p>\n```\n\n![image](img/htmlbl.jpg)\n\nenabled.html\n\
  \n![image](img/2bl.jpg)接下来，在 script 元素中，创建一个自执行函数，该函数开始初始化两个变量\n\n```javascript\n\
  const info = document.getElementById( ‘info’ )\nlet status = ‘‘\n```\n\n![image](img/3bl.jpg)现在，添加语句在启用了\
  \ Java 支持时在段落中写入确认\n\n```javascript\nstatus = ( navigator.javaEnabled( ) ) ? ‘Enabled’\
  \ : ‘Disabled’\ninfo.innerHTML += ‘Java Support is ‘ + status + ‘<hr>’\n```\n\n\
  ![image](img/4bl.jpg)然后，添加语句在启用了 cookie 支持时在段落中写入确认\n\n```javascript\nstatus = (\
  \ navigator.cookieEnabled ) ? ‘Enabled’ : ‘Disabled’\ninfo.innerHTML += ‘Cookie\
  \ Support is ‘ + status + ‘<hr>’\n```\n\n![image](img/forget.jpg)\n\n这些数组元素的内容根据每个浏览器支持的功能而异。\n\
  \n![image](img/5bl.jpg)现在，添加语句写入 `plugins` 数组的长度和一个示例元素\n\n```javascript\nif ( navigator.plugins.length\
  \ !== 0 )\n{\n  info.innerHTML += ‘No. of Plugins: ‘ +\n  navigator.plugins.length\n\
  \  info.innerHTML += ‘<br>Example: ‘ +\n  navigator.plugins[ 0 ].name\n  info.innerHTML\
  \ += ‘<br>For: ‘ +\n  navigator.plugins[ 0 ].description + ‘<hr>’\n}\n```\n\n\n\n\
  \n\n![image](img/6bl.jpg)最后，添加语句来写入 MIME 类型数组的长度和一个示例元素\n\n```javascript\nif ( navigator.mimeTypes.length\
  \ !== 0 )\n{\n  info.innerHTML += ‘No. of MIME Types: ‘ + navigator.mimeTypes.length\n\
  \  info.innerHTML += `<br>Example: ‘ + navigator.mimeTypes[ 1 ].type\n  info.innerHTML\
  \ += `<br>For: ‘ + navigator.mimeTypes[ 1 ].description\n}\n```\n\n![image](img/7bl.jpg)保存\
  \ HTML 文档，然后在任何浏览器中打开它以查看已启用功能的状态\n\n![image](img/pg123_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n你可以使用循环来编写所有插件和 mimeTypes 元素的内容。\n\n## 控制位置\n\n窗口的 `location` 对象具有五个属性，包含了当前在浏览器窗口中加载的文档的完整\
  \ URL 地址的组件。描述协议、域名、文件名以及（如果适用）片段锚点的完整地址包含在 `location.href` 属性中。完整地址的各个组件包含在 `location.protocol`（`http:`\
  \ 或 `https:`）、`location.host`（域名）、`location.pathname`（文件路径）和 `location.hash`（片段锚点）中。为\
  \ `location` 属性分配一个新 URL 将导致浏览器加载该地址的页面或其他资源。\n\n![image](img/pg124_1.jpg)\n\n![image](img/1bl.jpg)创建一个包含超链接锚点段落的\
  \ HTML 文档\n\n```html\n<p id=”info”>\n<a id=”frag”>片段锚点</a>\n</p>\n```\n\n![image](img/htmlbl.jpg)\n\
  \nlocation.html\n\n![image](img/2bl.jpg)接下来，在 script 元素中，创建一个自执行函数，该函数从初始化两个变量开始\n\
  \n```javascript\nconst info = document.getElementById( ‘info’ )\nlet jump = confirm(\
  \ ‘Jump to Fragment?’ )\n```\n\n![image](img/3bl.jpg)现在，添加语句，如果用户同意了请求，则更改窗口的 location\n\
  \n```javascript\nif ( jump )\n{\n  location = location.href + ‘#frag’\n}\n```\n\n\
  ![image](img/4bl.jpg)然后，添加语句在面板中写入当前位置地址的每个组件\n\n```javascript\ninfo.innerHTML +=\
  \ `<hr>Href: ‘ + location.href\ninfo.innerHTML += `<br>Protocol: ‘ + location.protocol\n\
  info.innerHTML += `<br>Host:‘ + location.host\ninfo.innerHTML += `<br>Path:‘ + location.pathname\n\
  info.innerHTML += `<br>Hash: ‘ + location.hash\n```\n\n![image](img/5bl.jpg)保存 HTML\
  \ 文档，然后在任何浏览器中打开它，以查看请求更改位置的确认对话框\n\n![image](img/6bl.jpg)点击取消按钮拒绝请求，并查看页面照常加载在其“根部”位置\n\
  \n![image](img/forget.jpg)\n\n网页浏览器可以加载任何支持的 MIME 类型的文件——例如，所有 PNG 文件的 MIME 类型为\
  \ `image/png`。\n\n![image](img/pg125_1.jpg)\n\n![image](img/pg125_2.jpg)\n\n![image](img/7bl.jpg)刷新浏览器，然后点击\
  \ OK 按钮接受请求，并查看页面加载在其片段位置\n\n![image](img/pg125_3.jpg)\n\n![image](img/pg125_4.jpg)\n\
  \n![image](img/hot.jpg)\n\n这里显示的 location 是位于本地系统 Web 服务器上的页面。如果页面位于你的桌面上，协议将是 `file:`\
  \ 且没有 `host` 值。\n\n## 历史记录\n\n网页浏览器将当前会话中访问的 URL 历史存储在 `window` 对象的 `history` 子对象中的数组中。像其他数组一样，它有一个\
  \ `length` 属性，以及用于在元素之间移动的 `back()` 和 `forward()` 方法。或者，`history` 对象的 `go()` 方法接受一个正或负整数参数，指定沿数组移动多少个元素。例如，`history.go(\
  \ 1 )` 向前移动一个元素，`history.go( -2 )` 向后移动两个元素。\n\n![image](img/pg126_1.jpg)\n\n![image](img/1bl.jpg)创建三个相同的\
  \ HTML 文档，它们包含一个空段落并嵌入相同的外部脚本文件\n\n```html\n<p id=”info” > </p>\n<script src=”history.js”\
  \ > </script>\n```\n\n![image](img/htmlbl.jpg)\n\npage-1.html\n\npage-2.html\n\n\
  page-3.html\n\n![image](img/2bl.jpg)接下来，创建一个脚本文件，其中包含一个从初始化变量引开始自执行函数\n\n```javascript\n\
  const info = document.getElementById( ‘info’ )\n```\n\n![image](img/pg126_2.jpg)\n\
  \nhistory.js\n\n![image](img/3bl.jpg)现在，在函数块中，添加语句将内容写入空段落中\n\n```javascript\ninfo.innerHTML\
  \ += `<a href=”page-1.xhtml”>Page 1</a> | ‘\ninfo.innerHTML += `<a href=”page-2.xhtml”>Page\
  \ 2</a> | ‘\ninfo.innerHTML += `<a href=”page-3.xhtml”>Page 3</a’\ninfo.innerHTML\
  \ += `<br>History Length: ‘ + history.length\ninfo.innerHTML += `<br>Current Location:\
  \ ‘ + location.pathname + ‘<br>’\n```\n\n![image](img/4bl.jpg)然后，添加语句在段落中创建按钮\n\n\
  ```javascript\ninfo.innerHTML += `<button onclick=”history.back( )”>Back</button>’\n\
  info.innerHTML += `<button onclick=”history.forward( )”>Forward</button>’\n```\n\
  \n![image](img/5bl.jpg)将 HTML 文档和 JavaScript 脚本文件放在同一个文件夹中，然后清除浏览器历史\n\n![image](img/hot.jpg)\n\
  \n要在 Google Chrome 浏览器中清除历史记录，点击 ![image](img/pg126_i.jpg)按钮，然后选择**更多工具**、**清除浏览数据**，并点击**清除数据**按钮。\n\
  \n![image](img/6bl.jpg)打开第一个页面查看初始历史长度为 1\n\n![image](img/pg127_1.jpg)\n\n![image](img/7bl.jpg)点击链接加载第三页，查看历史长度增加到\
  \ 2\n\n![image](img/pg127_2.jpg)\n\n![image](img/8bl.jpg)点击后退按钮返回第一个页，查看历史长度保持为\
  \ 2\n\n![image](img/pg127_3.jpg)\n\nURL 存储在 `history` 对象数组中并受保护，无法以字符串形式检索\n\n![image](img/forget.jpg)\n\
  \n在本示例中，只有当点击链接进入不同页面时，URL 才会添加到 history 数组。`back()`、`forward()` 和 `go()` 方法只是选择数组中的元素，不会更改\
  \ `length` 属性。\n\n## 总结\n\n- 文档对象模型 (DOM) 是网页组件的层级表示。\n- `window` 对象是 DOM 的顶层，具有描述浏览器窗口的属性。\n\
  - `screen` 对象是 `window` 对象的子，具有描述屏幕尺寸和色彩深度属性。\n- `window` 对象具有 `scrollBy()` 和 `scrollTo()`\
  \ 方法，以及指定滚动位置的 `scrollX` 和 `scrollY` 属性。\n- 使用 `window` 对象的 `alert()`、`confirm()`\
  \ 和 `prompt()` 方法显示对话消息。\n- 使用 `window` 对象的 `open()` 方法可以创建窗口，但可能会被弹出拦截。\n- `window`\
  \ 对象的 `setTimeout()` 方法创建一个定时器，稍可以使用 `clearTimeout()` 方法取消。\n- `navigator` 对象是 `window`\
  \ 对象的子，具有描述浏览器和主机平台版本的属性。\n- `window` 对象存在于全局命名空间中，因此所有子对象不需要包含地址中的 window 部分。\n\
  - 功能检测用于识别现代 DOM。\n- `navigator.plugins` 和 `navigator.mimeTypes` 属性是包含支持功能详情数组。\n\
  - `location` 对象是 `window` 对象的子，具有描述加载文档地址的属性。\n- `history` 对象是 `window` 对象的子，包含当前会话中访问过的位置的数组。\n\
  - `history` 对象具有 `back()`、`forward()` 和 `go()` 方法，用于在当前会话中切换页面。\n\n\n\n\n\n## 元素数组\
  \ (#chapter07.xhtml_sec64)\n\n## 元素 (#chapter07.xhtml_sec65)\n\n## 写入内容 (#chapter07.xhtml_sec66)\n\
  \n## 管理 Cookies (#chapter07.xhtml_sec67)\n\n## 加载事件 (#chapter07.xhtml_sec68)\n\n\
  ## 鼠标事件 (#chapter07.xhtml_sec69)\n\n## 事件值 (#chapter07.xhtml_sec70)\n\n## 复选框 (#chapter07.xhtml_sec71)\n\
  \n## 选择选项 (#chapter07.xhtml_sec72)\n\n## 重置更改 (#chapter07.xhtml_sec73)\n\n## 验证表单\
  \ (#chapter07.xhtml_sec74)\n\n## 总结 (#chapter07.xhtml_sec75)\n\n## 提取信息\n\nDOM window\
  \ 对象子元素中最有趣的是 document 对象，它提供了对 HTML 文档的访问。\n\n![image](img/pg130_1.jpg)\n\ndocument\
  \ 对象有许多个描述文档及其位置的属性：\n\n• `document.title` 属性包含 HTML 文档 title 元素中指定的值。\n\n• HTML\
  \ 文档的位置包含在 `document.URL` 属性中，与 `location.href` 属性中的值相似。\n\n•托管文档的域名包含在 `document.domain`\
  \ 属性中，类似于 `location.host` 值。\n\n• HTML 文档会将其创建日期或最后修改日期作为 HTTP 请求头提供给浏览器，以便浏览器决定是使用文档的缓存还是获取新副本。此日期也可以在\
  \ JavaScript 中通过 DOM 的 `document.lastModified` 属性获取。\n\n![image](img/1v.jpg)创建一个\
  \ HTML 文档，在其主体部分提供一个指向第二个（目标）HTML 文档的超链接。\n\n```html\n<p>\n<a href=\"info-2.html\"\
  >跳转到下一页</a>\n</p>\n```\n\n![image](img/htmlv.jpg)\n\ninfo-1.html\n\n![image](img/2v.jpg)接下来，创建目标\
  \ HTML 文档，它包含一个空的无序列表。\n\n```html\n<ul id=\"list\"></ul\n```\n\n![image](img/htmlv.jpg)\n\
  \ninfo-2.html\n\n![image](img/3v.jpg)现在，在 script 元素中创建一个自执行函数，该函数初始化一个变量引用。\n\n\
  ```javascript\nconst list = document.getElementById('list');\n```\n\n![image](img/4v.jpg)然后，添加语句来列出文档的特征。\n\
  \n```javascript\nlist.innerHTML = '<li>来源页: ' + document.referrer;\nlist.innerHTML\
  \ += '<li>标题: ' + document.title;\nlist.innerHTML += '<li>URL: ' + document.URL;\n\
  list.innerHTML += '<li>域名: ' + document.domain;\nlist.innerHTML += '<li>最后修改: '\
  \ + document.lastModified;\n```\n\n![image](img/5v.jpg)将 HTML 文档保存在同一个文件夹中，然后在浏览器中打开包含链接的文档。\n\
  \n![image](img/pg131_1.jpg)\n\n![image](img/6v.jpg)现在，点击超链接在浏览器中加载第二个 HTML 文档，并查看文档信息。\n\
  \n![image](img/pg131_2.jpg)\n\n![image](img/forget.jpg)\n\n`document.lastModified`\
  \ 中的日期仅与 HTML 文档本身有关，而与 HTML 文档可能导入的任何样式表或外部脚本文件无关。\n\n![image](img/snake.jpg)\n\
  \n这里显示的域名位于本地系统 Web 服务器上的页面。如果页面位于你的桌面上，`document.referrer` 和 `document.domain`\
  \ 属性将不会赋予任何值。\n\n## 元素数组\n\nDOM document 对象拥有表单、图像、链接、样式表和脚本的子对象。这些子对象都是数组，其中每个数组元素按照它们在\
  \ HTML 文档中出现的顺序代表文档组件。例如，文档主体中的第一张图像（由 HTML `<img>` 标签指定）由 `document.images[0]`\
  \ 表示。这意味着可以使用 `document.images[0].src` 引用其 URL，这会显示分配给 HTML `<img>` 标签 `src` 属性的路径。在脚本中为此组件分配新\
  \ URL 将动态替换旧图像。\n\n![image](img/pg132_1.jpg)\n\n`links` 数组代表 HTML 文档中的 HTML `<a>`\
  \ 标签；`styleSheets` 数组代表 HTML `<style>` 标签；`scripts` 数组代表 HTML `<script>` 标签。\n\n\
  `forms` 数组代表 HTML `<form>` 标签，但它也有自己的子元素对象，它是所有表单组件的数组。例如，HTML 文档中第一个表单的第一个组件的值可以使用\
  \ `document.forms[0].elements[0].value` 引用。在脚本中为此组件分配新值将动态替换旧值。\n\n![image](img/1v.jpg)创建一个包含表单和空列表的\
  \ HTML 文档。\n\n```html\n<form>\n<img src=\"user.png\" alt=\"用户\" height=\"64\" width=\"\
  64\">\n<input type=\"text\" name=\"topic\" size=\"30\">\n<input type=\"button\"\
  \ value=\"提问\">\n<br>\n<a href=\"help.html\" style=\"\">帮助？</a>\n</form>\n<ul id=\"\
  list\"></ul\n```\n\n![image](img/htmlv.jpg)\n\ncomponents.html\n\n![image](img/2v.jpg)现在，添加一个样式表来美化表单。\n\
  \n```html\n<style>\nform {\n    font:1em sans-serif;\n    width: 500px;\n    height:\
  \ 100px;\n    background: url(bg.png);\n}\n</style>\n```\n\n![image](img/pg132_2.jpg)\n\
  \nbg.png 64x64 透明\n\n![image](img/3v.jpg)\n\n接下来，在 script 元素中创建一个自执行函数，该函数初始化一个变量引用。\n\
  \n```javascript\nconst list = document.getElementById('list');\n```\n\n![image](img/snake.jpg)\n\
  \n注意 `styleSheets` 数组的驼峰命名法。\n\n![image](img/4v.jpg)现在，添加语句列出文档的组件。\n\n```javascript\n\
  list.innerHTML = '<li>表单数量: ' + document.forms.length;\nlist.innerHTML += '<li>链接数量:\
  \ ' + document.links.length;\nlist.innerHTML += '<li>图像数量: ' + document.images.length;\n\
  list.innerHTML += '<li>样式表数量: ' + document.styleSheets.length;\nlist.innerHTML +=\
  \ '<li>脚本数量: ' + document.scripts.length;\n```\n\n![image](img/5v.jpg)最后，添加语句列出属性值。\n\
  \n```javascript\nlist.innerHTML += '<li>第一张图像 URL: ' + document.images[0].src;\n\
  list.innerHTML += '<li>第一个表单元素值: ' + document.forms[0].elements[0].value;\n```\n\
  \n![image](img/6v.jpg)保存 HTML 文档，然后在浏览器中打开它查看列出的文档组件。\n\n![image](img/pg133_1.jpg)\n\
  \n注意，通过样式规则包含在文档中的图像不包含在图像数组中，只有通过 `<img>` 标签包含的——因此，这里的表单背景图像（`bg.png`）没有出现在图像数组。同样，分配给\
  \ style 属性的样式规则也没有包含在 `styleSheets` 数组中。\n\n![image](img/forget.jpg)\n\n数组元素仅代表相关的\
  \ HTML 标签。\n\n## 元素\n\n![image](img/pg134_1.jpg)（等待，原文说是 pg134_1.jpg）\n\n使用组件数组配合点表示法来引用特定元素需要脚本作者计算组件数量以确定每个索引位置。这对于很长的文档来说特别繁琐，容易出错，而且修改\
  \ HTML 文档可能会更改元素的索引位置。这在早几年是必须的，但最终通过向 document 对象添加三个新方法解决了这个问题：\n\n• `document.getElementById(\
  \ )` 方法在书中之前的示例中用于从 JavaScript 代码添加内容，它允许通过 HTML id 属性值来引用任何组件。该方法仅将目标 id 值作为参数，用于引用单个特定的\
  \ HTML 元素。\n\n\n\n\n\n- `document.getElementsByTagName( ` 方法返回一个类数组的 `HTMLCollection`\
  \ 对象，该对象引用了所有作为参数指定的标签名称的 HTML 元素。可以使用元素的索引数字来引用特定的 HTML 元素，就像在数组中操作一样。\n- `document.getElementsByClassName(\
  \ ` 方法返回一个类数组的 `HTMLCollection` 对象，该对象引用了所有包含作为参数指定的类名属性的 HTML 元素。可以使用元素的索引数字来引用特定的\
  \ HTML 元素，就像在数组中操作一样。\n\n![image](img/1v.jpg)创建一个包含两个列表和一个空段落的 HTML 文档\n\n```html\n\
  <ol>\n  <li class=\"fruit\">Apple</li>\n  <li class=\"nut\">Almond</li>\n  <li class=\"\
  fruit\">Apricot</li>\n</ol>\n<ol>\n  <li class=\"fruit\">Blackberry</li>\n  <li\
  \ id=\"country\" class=\"nut\">Brazil</li>\n  <li class=\"fruit\">Banana</li>\n\
  </ol>\n<p id=\"info\"></p>\n```\n\n![image](img/htmlv.jpg)\n\ncollection.html\n\n\
  ![image](img/snake.jpg)\n\n在返回 `HTMLCollection` 的两个方法名称中，使用的是“Elements”（复数），而在另一个方法的名称中，用的是“Element”（单数）。\n\
  \n![image](img/2v.jpg)接下来，在 script 元素中，创建一个自执行函数，该函数首先初始化五个变量\n\n```javascript\n\
  const info = document.getElementById( ‘info’ )\nconst item = document.getElementById(\
  \ ‘country’ )\nconst lists = document.getElementsByTagName( ‘ol’ )\nconst fruits\
  \ = document.getElementsByClassName( ‘fruit’ )\nlet i = 0\n```\n\n![image](img/3v.jpg)现在，添加一条语句来描述元素对象以及该元素包含的文本\n\
  \n```javascript\ninfo.innerHTML = item + ‘ Id: ‘ + item.innerText + ‘<br>’\n```\n\
  \n![image](img/4v.jpg)然后，添加语句来描述 HTMLCollection 对象及其元素包含的文本\n\n```javascript\ninfo.innerHTML\
  \ += ‘<br>’ + lists + ‘ Tags:<br>’\nfor( i = 0; i < lists.length ; i++ ) {\n  info.innerHTML\
  \ += ( i + 1 ) + ‘ of ‘ + lists.length\n  info.innerHTML += ‘ : ‘ + lists[ i ].innerText\
  \ + ‘<br>’\n}\n```\n\n![image](img/hot.jpg)\n\n元素的 `innerText` 属性仅返回其起始标签和结束标签之间的内容，而\
  \ `innerHTML` 属性也会返回 HTML 标签。将其更改为 `innerHTML` 以查看差异。\n\n![image](img/5v.jpg)最后，添加语句来描述第二个\
  \ HTMLCollection 对象及其元素包含的文本\n\n```javascript\ninfo.innerHTML += ‘<br>’ + fruits\
  \ + ‘ Class:<br>’\nfor( i = 0 ; i < fruits.length ; i++ ) {\n  info.innerHTML +=\
  \ ( i + 1 ) + ‘ of ‘ + fruits.length\n  info.innerHTML += ‘ : ‘ + fruits[ i ].innerText+\
  \ ‘<br>’\n}\n```\n\n![image](img/6v.jpg)保存 HTML 文档，然后在浏览器中打开它，查看通过不同方法获取的元素值\n\n\
  ![image](img/pg135_1.jpg)\n\n## 写入内容\n\n如前面的示例所示，`document` 对象的 `innerHTML` 和 `innerText`\
  \ 属性可以用于内容写入现有元素中。`document` 对象还有一个 `write( )` 方法，提供了另一种写入内容的方法，但它会自动调用 `document.open(\
  \ )` 方法来启动新文档——因此当前文档不再显示。\n\n![image](img/pg136_1.jpg)\n\n更有用的是 `document.createElement(\
  \ )` 方法接受标签名作为参数并创建该类型的元素。然后可以通过赋值给其 `innerHTML` 或 `innerText` 属性向新元素添加内容。随后，通过指定新元素作为\
  \ `document.appendChild( )` 方法的参数，将其插入到网页中现有元素内。\n\n你还可以通过指定属性名和值作为元素 `setAttribute(\
  \ )` 方法的两个参数，动态地向元素写入属性。\n\n![image](img/1v.jpg)创建一个包含标题和一个包含三个项目的有序列表的 HTML 文档\n\
  \n```html\n<h1 id=”heading”>Top 3 Cities</h1>\n<ol id=”list”>\n  <li>Tokyo, Japan</li>\n\
  \  <li>New York, USA</li>\n  <li>Rio de Janeiro, Brazil</li>\n</ol>\n```\n\n![image](img/htmlv.jpg)\n\
  \nwrite.html\n\n![image](img/2v.jpg)保存 HTML 文档，然后在浏览器中打开它查看网页\n\n![image](img/pg136_2.jpg)\n\
  \n![image](img/3v.jpg)接下来，在 script 元素中，创建一个自执行函数，该函数首先初始化两个新的新的列表项元素和一个变量引用\n\n\
  ```javascript\nconst itemFour = document.createElement( ‘li’ )\nconst itemFive =\
  \ document.createElement( ‘li’ )\nconst heading = document.getElementById( ‘heading’\
  \ )\n```\n\n![image](img/4v.jpg)现在，为两个新元素分配文本内容\n\n```javascript\nitemFour.innerText\
  \ = ‘London, England’\nitemFive.innerText = ‘Cape Town, South Africa’\n```\n\n![image](img/5v.jpg)然后，将新元素内容作为有序列表元素的子元素插入网页\n\
  \n```javascript\ndocument.getElementById( ‘list’ ).appendChild( itemFour )\ndocument.getElementById(\
  \ ‘list’ ).appendChild( itemFive )\n```\n\n![image](img/6v.jpg)给现有标题元素添加属性以更改其字体颜色\n\
  \n```javascript\nheading.setAttribute( ‘style’, ‘color:Red’ )\n```\n\n![image](img/7v.jpg)最后，更改标题以更好地描述扩展后的列表\n\
  \n```javascript\nheading.innerText = ‘Best Five Cities’\n```\n\n![image](img/8v.jpg)再次保存\
  \ HTML 文档，然后刷新浏览器查看新写入的内容\n\n![image](img/pg137_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n通过将现有元素作为 `document.removeChild( )` 方法的参数，可以从网页中移除它，或者通过指定新旧元素作为 `document.replaceChild(\
  \ )` 方法的参数来替换它。\n\n![image](img/hot.jpg)\n\n你可以通过将属性名作为元素 `removeAttribute( )` 方法的参数来移除属性。\n\
  \n## 管理 Cookie\n\n出于安全考虑，JavaScript 无法在用户的硬盘上写入普通文件，但它可以写入“cookie”文件来存储少量数据。这些文件的大小限制为最大\
  \ 4KB，每个 Web 服务器最多 20 个。通常，存储在 cookie 中的数据将用于识别后续访问网站的用户。\n\n![image](img/pg138_1.jpg)\n\
  \nCookie 数据存储在 DOM `document` 对象的 `cookie` 属性中，格式为一个或多个“key=value”对，并以“;”分号结尾。值可能包含空格、逗号或分号，除非作为内置\
  \ `encodeURI( )` 函数的参数传递，该函数会将字符串以 Unicode 格式编码——例如，这会将空格表示为 %20。\n\n默认情况下，cookie\
  \ 的寿命限制为当前浏览器会话，除非在创建 cookie 时通过“expires=date”对指定过期日期（该日期值为 UTC 字符串）。通常，这通过使用 JavaScript\
  \ `Date` 对象并使用 `toUTCString( )` 方法来实现。将现有 cookie 的过期日期设置为过去的时间将删除该 cookie。\n\n从\
  \ cookie 中检索数据需要一些字符串处理将 Unicode 转换为普通文本（使用内置的 `decodeURI( )` 函数让 %20 再次变为空格），并分离数据的名称和值项。在\
  \ cookie 字符串内部，多个对可以通过指定“;”分号作为 `split( )` 方法的参数来分离。同样，键和值可以通过指定“=”字符作为 `split(\
  \ )` 方法的参数来分离。同样，当值是逗号分隔的项目列表时，可以指定“，”逗号作为 `split( )` 方法的参数将其分离为数组元素。\n\n创建一个包含“setter”和“getter”实用函数的外部\
  \ JavaScript 文件是有用的，这些函数可以被方便地调用以存储和检索 cookie 数据。\n\n![image](img/1v.jpg)从 JavaScript\
  \ 文件开始编写一个 setter 函数，该函数具有键、值和过期期的参数\n\n```javascript\nfunction setCookie( key,\
  \ value, days ) {\n  const d = new Date( )\n}\n```\n\n\n\n\n\n```javascript\nd.setTime(\
  \ d.getTime( ) + ( days * 86400000 ) )\n```\n\n```javascript\ndocument.cookie =\
  \ key + ‘=’ + encodeURI( value ) + ‘;expires=’ + d.toUTCString( ) + ‘;’\n}\n```\n\
  \n![image](img/pg138_2.jpg)\n\ncookie.js\n\n![image](img/snake.jpg)\n\ncookie 的过期时间通常无法通过\
  \ JavaScript 读取。如果需要它可读，请将其也添加到 cookie 值的列表中。\n\n![image](img/hot.jpg)\n\n此处设置过期的长数字是一天的毫秒数。\n\
  \n![image](img/2v.jpg)然后，添加一个 getter 函数来接收一个键参数\n\n```javascript\nfunction getCookie(\
  \ key ) {\n  if( document.cookie )\n  {\n    const pairs = decodeURI( document.cookie\
  \ ).split( ‘;’ )\n    let i, name, value\n    for( i = 0 ; i < pairs.length ; i++\
  \ )\n    {\n      name = ( pairs[ i ].split( ‘=’ )[ 0 ] ).trim( )\n      if( name\
  \ === key ) { value = pairs[ i ].split( ‘=’ )[ 1 ] }\n    }\n    return value\n\
  \  }\n}\n```\n\n![image](img/snake.jpg)\n\n注意这里使用了 `trim( )` 方法来移除名称末尾的任何空格。\n\n\
  ![image](img/3v.jpg)接下来，创建一个 HTML 文档，其中包含一个空列表并导入了外部 JavaScript 文件\n\n```html\n\
  <ul id=”list”></ul> <script src=”cookie.js”></script>\n```\n\n![image](img/htmlv.jpg)\n\
  \ncookie.html\n\n![image](img/4v.jpg)现在，在另一个 script 元素中，创建一个自执行函数来设置 cookie，然后获取它的值\n\
  \n```javascript\nsetCookie( ‘User’,’Mike McGrath,12345’, 7 )\nconst list = document.getElementById(\
  \ ‘list’ )\nlet i, value = getCookie( ‘User’ )\nif( value.indexOf( ‘,’ ) )\n{\n\
  \  value = value.split( ‘,’ )\n}\nfor( i = 0 ; i < value.length ; i++ )\n{\n  list.innerHTML\
  \ += ‘<li>’ + value[ i ]\n}\n```\n\n![image](img/5v.jpg)将 HTML 文档和 JavaScript 文件保存在\
  \ Web 服务器的同一个文件夹中，然后在浏览器中打开网页以查看检索到的 cookie 值\n\n![image](img/pg139_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n可以通过将 cookie 的过期日期设置为早于当前实际日期的来删除 cookie。\n\n## 加载事件\n\n![image](img/pg140_1.jpg)\n\
  \nDOM 允许 JavaScript 通过脚本作者提供在特定事件发生时执行的函数，来响应网页上发生的“事件”。这些函数被称为“事件处理器”，可以对以下事件做出反应：\n\
  \n-   **load** – 页面加载到浏览器时触发\n-   **click** – 用户点击鼠标按钮时触发\n-   **keydown** – 用户按下键盘键时触发\n\
  -   **change** – 用户修改输入字段时触发\n- **submit** – 用户提交 HTML 表单时触发\n\n要响应加载事件，可以通过将事件处理器函数赋值给\
  \ window 对象的 `onload` 属性来指定，使用此语法：\n\n`onload=*function-name*`\n\n或者，可以将事件名称和事件处理器函数名作为\
  \ window 对象的 `addEventListener( )` 方法的参数，但事件名称必须包含引号内：\n\n`addEventListener( ‘load’\
  \ , *function-name* )`\n\n加载事件的事件处理器可能用于检查浏览器的功能，并有效地检查 cookie 数据。\n\n![image](img/1v.jpg)创建一个\
  \ HTML 文档，其中包含一个指向 cookie 示例此处的链接、一个空段落，并导入了上一个示例中的外部 JavaScript 文件\n\n```html\n\
  <p><a href=”cookie.html”>Link</a></p>\n<p id=”info”></p>\n<script src=”cookie.js”></script>\n\
  ```\n\n![image](img/htmlv.jpg)\n\nload.html\n\n![image](img/2v.jpg)接下来，在 script\
  \ 元素中指定一个在页面加载后执行的事件处理器函数\n\n```javascript\naddEventListener( ‘load’, welcome )\n\
  ```\n\n![image](img/hot.jpg)\n\n还有一个卸载事件，在用户离开页面时触发。其事件处理器可以通过赋值给 `window.onunload`\
  \ 属性来指定，也可以指定给 `addEventListener( )` 方法。\n\n![image](img/3v.jpg)现在，添加事件处理器函数来欢迎用户\n\
  \n```javascript\nfunction welcome( ) {\n  const info = document.getElementById(\
  \ ‘info’ )\n  if( getCookie( ‘Name’ ) )\n  {\n    info.innerHTML = ‘Welcome Back,\
  \ ‘ + getCookie( ‘Name’ )\n  }\n  else\n  {\n    let name = prompt( ‘Please Enter\
  \ Your Name’, ‘User’ )\n    setCookie( ‘Name’, name, 7 )\n    info.innerHTML = ‘Welcome,\
  \ ‘ + name\n  }\n}\n```\n\n![image](img/forget.jpg)\n\n`prompt( )` 方法的第二个参数是默认输入值。\n\
  \n![image](img/4v.jpg)保存 HTML 文档并在浏览器中打开它 —— 输入名字，点击链接，然后点击后退按钮\n\n![image](img/pg141_1.jpg)\n\
  \n![image](img/pg141_2.jpg)\n\n![image](img/pg141_3.jpg)\n\n![image](img/pg141_4.jpg)\n\
  \n## 鼠标事件\n\n当用户点击 HTML 文档中的特定对象时执行的事件处理器函数，可以通过将函数名赋值给该对象的 `onclick` 和 `ondblclick`\
  \ 属性来指定。这些处理器响应于：当用户点击一次鼠标按钮时触发的“click”事件，以及当快速连续按下两次鼠标按钮时触发的“dblclick”事件。\n\n![image](img/pg142_1.jpg)\n\
  \n此外，对象的 `onmousedown` 和 `onmouseup` 属性可以指定事件处理器函数，在鼠标按钮被按下时执行（触发“mousedown”事件），以及在释放时执行（触发“mouseup”事件）。\n\
  \n同样，对象的 `onmouseover` 和 `onmouseout` 属性可以指定事件处理器函数，在鼠标悬停在元素上时执行（触发“mouseover”事件），以及在移离开元素时执行（触发“mouseout”事件）。这些通常用于创建悬停效果，例如将该元素的\
  \ `style.background` 属性值更改为不同的颜色。\n\n或者，可以将事件名称和事件处理器函数名作为该对象的 `addEventListener(\
  \ )` 方法的参数。这可以像上一个示例中 window 对象的 `addEventListener( )` 方法一样使用，通过名称指定函数，或者你可以在第二个参数中内联编写函数定义。\n\
  \n当事件发生时，可以将事件对象传递给内联事件处理器函数。它有一个 `type` 属性，用于识别该事件的名称。\n\n![image](img/1v.jpg)创建一个包含两个段落和一个按钮的\
  \ HTML 文档\n\n```html\n<p id=”box”>Target</p>\n<p id=”info”>Place Mouse Over</p>\n\
  <button id=”btn”>Click Me</button>\n```\n\n![image](img/htmlv.jpg)\n\nmouse.html\n\
  \n![image](img/2v.jpg)接下来，在 script 元素中创建一个自执行函数，首先初始化两个变量\n\n```javascript\n( function\
  \ ( ) {\n  const box = document.getElementById( ‘box’ )\n  const btn = document.getElementById(\
  \ ‘btn’ )\n  // 在此处插入语句\n} ) ( )\n```\n\n![image](img/hot.jpg)\n\nHTML 文档中的任何可见对象都可以为其\
  \ **click** 事件分配事件处理器，以便该对象可以像按钮一样工作。大多数开发者倾向于使用 `addEventListener( )` 方法指定事件处理器函数，而不是赋值给\
  \ `onclick` 属性。\n\n![image](img/3v.jpg)现在，插入语句来指定内联事件处理器，这些处理器将向第二个函数传递参数\n\n```javascript\n\
  box.addEventListener( ‘mouseover’,\n  function ( event ) { reactTo( event, ‘Red’\
  \ } ) )\nbox.addEventListener( ‘mouseout’,\n  function ( event ) { reactTo( event,‘Purple’\
  \ } ) )\nbox.addEventListener( ‘mousedown’,\n  function ( event ) { reactTo( event,‘Green’\
  \ } ) )\nbox.addEventListener( ‘mouseup’,\n  function ( event ) { reactTo( event,‘Blue’\
  \ } ) )\nbtn.addEventListener( ‘click’,\n  function ( event ) { reactTo( event,‘Orange’\
  \ } ) )\n```\n\n![image](img/4v.jpg)最后，添加第二个函数来显示事件类型并更改第一个段落的背景颜色\n\n```javascript\n\
  function reactTo( event, color ) {\n```\n\n\n\n\n\n```javascript\ndocument.getElementById(\
  \ ‘box’ ).style.background = color\ndocument.getElementById( ‘info’ ).innerText\
  \ = event.type\n}\n```\n\n![image](img/5v.jpg)保存该 HTML 文档并在浏览器中打开它，然后使用鼠标查看事件和反应\n\
  \n![image](img/pg143_1.jpg)\n\n![image](img/pg143_2.jpg)\n\n![image](img/pg143_3.jpg)\n\
  \n![image](img/pg143_4.jpg)\n\n![image](img/pg143_5.jpg)\n\n![image](img/snake.jpg)\n\
  \n如果移除一个绑定了事件处理程序的对象，你也应该移除其事件处理程序，以避免创建内存泄漏。\n\n## 事件值\n\n除了此处 描述的鼠标事件外，还有一个 `“mousemove”`\
  \ 事件。它可以将一个事件对象传递给事件处理函数，该对象包含 `x` 和 `y` 属性，这些属性包含了鼠标指针的当前窗口坐标。\n\n![image](img/pg144_1.jpg)\n\
  \n还有一个 `“keydown”` 事件，在用户首次按下键时触发；一个 `“keypress”` 事件在键被按下时触发；以及一个 `“keyup”` 事件在键释放时触发。这些事件都可以将一个事件对象传递给事件处理函数，该对象包含一个\
  \ `type` 属性用于识别事件名称，以及一个 `keyCode` 属性用于存储最后一次按下键的数值值。\n\n按键的数值值是其 Unicode 值，可以作为\
  \ `String.fromCharCode( )` 方法的参数，将其转换为字符值。\n\n事件处理函数可以被指定为 `onmousemove`、`onkeydown`、`onkeypress`\
  \ 和 `onkeyup` 属性，或者指定为对象的 `addEventListener( )` 方法的参数。\n\n![image](img/1v.jpg)创建一个包含空段落的\
  \ HTML 文档\n\n```html\n<p id=”info”></p>\n```\n\n![image](img/htmlv.jpg)values.html\n\
  \n![image](img/2v.jpg)接下来，在脚本元素中，创建一个自执行函数，该函数为三个事件指定一个事件处理函数，并将事件参数传递给该函数\n\n```javascript\n\
  function ( ) {\n  document.addEventListener( ‘keydown’,\n  function ( event ){ reactTo(\
  \ event ) } )\n  document.addEventListener( ‘keyup’,\n  function ( event ){ reactTo(\
  \ event ) } )\n  document.addEventListener( ‘mousemove’,\n  function ( event ){\
  \ reactTo( event ) } )\n} ) ( )\n```\n\n![image](img/3v.jpg)现在，用一个语句开始事件处理函数以初始化变量\n\
  \n```javascript\nfunction reactTo( event ) {\n  const info = document.getElementById(\
  \ ‘info’ )\n  // 在此处插入语句。\n}\n```\n\n![image](img/hot.jpg)常用字符的 Unicode 值与 ASCII\
  \ 码值相同，其中小写 a-z 为 65-90，A-Z 为 97-122。\n\n![image](img/4v.jpg)然后，插入语句显示鼠标指针的当前窗口坐标值\n\
  \n```javascript\nif( event.type === ‘mousemove’ )\n{\n  info.innerHTML =\n  ‘Mouse\
  \ pointer is at X:’ + event.x + ‘ Y:’ + event.y\n}\n```\n\n![image](img/5v.jpg)接下来，添加语句在按下键盘键时显示该键的\
  \ Unicode 值\n\n```javascript\nif( event.type === ‘keydown’ )\n{\n  info.innerHTML\
  \ += ‘<hr>’ + event.type\n  info.innerHTML += ‘: ‘ + event.keyCode\n}\n```\n\n![image](img/6v.jpg)最后，添加语句在释放键盘键时显示该键的字符\n\
  \n```javascript\nif( event.type === ‘keyup’ )\n{\n  info.innerHTML += ‘<br>’ + event.type\
  \ + ‘: ‘ +\n  String.fromCharCode(** event.keyCode ) + ‘<hr>’\n}\n```\n\n![image](img/7v.jpg)保存该\
  \ HTML 文档然后在浏览器中打开它，并将鼠标移动到窗口上方，观察随着鼠标移动时显示的坐标值的变化\n\n![image](img/pg145_1.jpg)\n\
  \n![image](img/8v.jpg)按下任何字母数字键以查看该键的 Unicode 数字和字符值\n\n![image](img/snake.jpg)\n\
  \n`keydown` 和 `keyup` 事件适用于所有键盘键，但 `keypress` 仅作用于字母数字键。\n\n![image](img/forget.jpg)\n\
  \n坐标值始终相对于窗口位置，即使事件处理程序绑定在 `document` 对象以外的其他对象上。\n\n## 复选框\n\n单选按钮组允许用户从组中选择任意一个按钮，该组中所有单选按钮输入元素的\
  \ HTML `name` 属性共享相同的名称。在脚本术语中，该组名是一个数组的名称，可以通过其索引值引用每个单选按钮对象。\n\n![image](img/pg146_1.jpg)\n\
  \n与单选按钮组不同，复选框按钮组允许用户选择组中的一个或多个按钮。但与单选按钮组一样，每个 `name` 属性都共享相同的组名。该组名也是数组的名称，可以通过其索引值引用每个复选框按钮对象。\n\
  \n单选按钮对象和复选框按钮对象都有一个 `checked` 属性，当按钮被选中时其为 `true`，否则为 `false`。通过循环数组来检查哪些框被选中。脚本语句也可以为\
  \ `checked` 属性赋值为 `true`。\n\n![image](img/1v.jpg)创建一个包含三个复选框和一个提交按钮的表单的 HTML 文档\n\
  \n```html\n<form id=”pizza” action=”echo.pl” method=”POST”>\n  <fieldset>\n    <legend>Select\
  \ Toppings</legend>\n    <input type=”checkbox” name=”Top” value=”Cheese”\n    <input\
  \ type=”checkbox” name=”Top” value=”Ham”\n    <input type=”checkbox” name=”Top”\
  \ value=”Peppers”\n  </fieldset>\n  <input type=”submit”>\n</form>\n```\n\n![image](img/htmlv.jpg)checkbox.html\n\
  \n![image](img/2v.jpg)接下来，在脚本元素中，创建一个自执行函数，为表单的“submit”事件指定一个事件处理函数并检查一个复选框\n\n\
  ```javascript\nfunction ( ) {\n  const form = document.getElementById( ‘pizza’ )\n\
  \  form.addEventListener( ‘submit’,\n  function ( event ){ reactTo( event ) } )\n\
  \  form.Top[ 0 ].checked = true\n} ) ( )\n```\n\n![image](img/3v.jpg)当复选框组中的多个按钮被选中时，它们的值将以逗号分隔列表的形式提交。\n\
  \n![image](img/hot.jpg)现在，通过声明三个变量和一个循环开始事件处理函数，以确定哪些框被选中\n\n```javascript\nfunction\
  \ reactTo( form, event ) {\n  let i, ok, summary = ‘’\n  for( i = 0 ; i < form.Top.length\
  \ ; i++ )\n  {\n    if( form.Top[ i ].checked )\n    {\n      summary += form.Top[\
  \ i ].value + ‘ ‘\n    }\n  }\n  // 在此处插入语句。\n}\n```\n\n然后，添加语句确认选择并将其提交到 Web 服务器，或者取消提交\n\
  \n```javascript\nok = confirm( ‘Submit These Choices?\\n’ + summary )\nif( !ok )\
  \ { event.preventDefault( ) }\n```\n\n![image](img/4v.jpg)将 HTML 文档保存到 Web 服务器，然后在浏览器中打开它，做出选择，然后确认提交\n\
  \n![image](img/5v.jpg)\n\n![image](img/6v.jpg)\n\n![image](img/7v.jpg)\n\n![image](img/pg145_1.jpg)\n\
  \n![image](img/8v.jpg)\n\n![image](img/snake.jpg)\n\n当表单按钮被点击时，会触发表单的默认**事件**动作，即将表单数据提交到\
  \ Web 服务器。调用表单事件的 `preventDefault( )` 方法可以阻止表单数据的提交。\n\n![image](img/forget.jpg)此示例在支持\
  \ Perl 服务器端脚本的本地 Web 服务器上运行，该脚本处理表单提交并为浏览器提供响应。\n\n## 选择选项\n\nHTML `<select>` 下拉列表对象中的选项在\
  \ DOM 中由 `options[ ]` 数组唯一表示，其中每个数组元素包含 HTML `<option>` 标签指定的选项。提交到 Web 服务器时，赋值给\
  \ `<select>` 标签 `name` 属性的值以及赋值给当前选中 `<option>` 标签 `value` 属性的值将以 name=value 对的形式发送。\n\
  \n\n\n\n\n重要的是，选择列表对象有一个 `selectedIndex` 属性，它包含当前选中的 `options[]` 数组元素的索引号，可以用它来获取当前所选选项的值。\n\
  \n当用户更改选择列表中的选定选项时，会触发“change”事件。列表对象的 `onclick` 属性可以指定一个事件处理函数，在选定选项更改时执行该函数。或者，也可以将事件名称和事件处理函数名称作为列表对象的\
  \ `addEventListener()` 方法的参数。\n\n![image](img/1v.jpg)创建一个包含表单选择列表、提交按钮以及一个空段落的 HTML\
  \ 文档。\n\n```html\n<form action=”echo.pl” method=”POST\">\n<select id=”list” name=”City\"\
  >\n<option value=”Rome” selected>Rome</option>\n<option value=”London”>London</option>\n\
  <option value=”New York” >New York</option>\n</select>\n<input type=”submit\">\n\
  </form>\n<p id=”info”></p>\n```\n\n![image](img/htmlv.jpg)\n\noptions.html\n\n![image](img/2v.jpg)接下来，在一个\
  \ script 元素中创建一个自执行函数，为表单的“submit”事件和窗口的“load”事件指定一个事件处理函数。\n\n```javascript\nfunction\
  \ ( ) {\nconst list = document.getElementById( ‘list’ )\nlist.addEventListener(\
  \ ‘change’ ,\nfunction ( ) { reactTo( list, event ) } )\naddEventListener( ‘load’\
  \ ,\nfunction ( ) { reactTo( list, event ) } )\n} ) ( )\n```\n\n![image](img/forget.jpg)\n\
  \n注意，HTML 的 selected 属性选择了第一个 元素，该元素在 DOM 中由 `options[0]` 表示。\n\n![image](img/3v.jpg)现在，添加事件处理函数，它将在段落中显示事件类型和当前的列表选择项。\n\
  \n```javascript evenfunction reactTo( list, event ) {\nconst info = document.getElementById(\
  \ ‘info’ )\nlet index = list.options.selectedIndex\nlet city = list.options[ index\
  \ ].value\ninfo.innerHTML = event.type + ‘<br>Selected: ‘\ninfo.innerHTML += city\
  \ + ‘<br>Index: ‘ + index\n}\n```\n\n![image](img/4v.jpg)将 HTML 文档保存到 Web 服务器上，然后在浏览器中打开它，选择一个选项并提交表单。\n\
  \n![image](img/pg149_1.jpg)\n\n![image](img/pg149_2.jpg)\n\n![image](img/pg149_3.jpg)\n\
  \n![image](img/common1.jpg)\n\necho.pl\n\n![image](img/hot.jpg)\n\n从层级上来说，这个选中选项可以通过\
  \ `document.forms[0].elements[0].options[1].value` 来引用——这是 DOM 的最深层。\n\n## 重置更改\n\
  \n为表单文本输入对象和文本对象的 `onfocus` 和 `onfocusout` 属性指定事件处理函数，以识别活动元素。当用户选择文本字段时，会触发“focus”事件；当用户离开该文本字段时，会触发“focusout”事件。\n\
  \n![image](img/pg150_1.jpg)\n\n很有用的是，为表单对象的 `onreset` 属性指定事件处理函数，当表单通过重置按钮恢复到原始状态时，移除与表单输入相关的内容。\n\
  \n与其他对象一样，也可以将事件名称和事件处理函数名称作为文本字段和表单对象的 `addEventListener()` 方法的参数。\n\n![image](img/1v.jpg)创建一个包含带有文本字段和重置按钮的表单以及一个空段落的\
  \ HTML 文档。\n\n```html\n<form id=”code” >\n<input id=”lang” name=”Language” type=”text”\
  \ >\n<input type=”reset\">\n<input type=”submit\">\n</form>\n<p id=”info”></p>\n\
  ```\n\n![image](img/htmlv.jpg)\n\nreset.html\n\n![image](img/2v.jpg)接下来，在一个 script\
  \ 元素中创建一个自执行函数，为文本字段的“focus”和“focusout”事件、表单的“reset”事件以及窗口的“load”事件指定事件处理函数。\n\n\
  ```javascript\nfunction ( ) {\nconst form = document.getElementById( ‘code ’ )\n\
  const lang = document.getElementById( ‘lang ’ )\nconst info = document.getElementById(\
  \ ‘info’ )\nlang.addEventListener( ‘focus’ ,\nfunction ( event ) { reactTo( event,\
  \ info ) } )\nlang.addEventListener( ‘focusout’ ,\nfunction ( event ) { reactTo(\
  \ event, info ) } )\nform.addEventListener( ‘reset’,\nfunction ( ) { defaultMessage(\
  \ info ) } )\naddEventListener( ‘load’,\nfunction ( ) { defaultMessage( info ) }\
  \ )\n} ) ( )\n```\n\n![image](img/hot.jpg)\n\n文本字段还有一个 `onselect` 属性，可以对其指定事件处理函数，以响应用户选择其部分文本时触发的“select”事件。\n\
  \n![image](img/3v.jpg)现在，为文本字段的“focus”和“focusout”事件添加事件处理函数以显示事件类型。\n\n```javascript\n\
  function reactTo( event, info ) {\ninfo.innerHTML = event.type\n}\n```\n\n![image](img/4v.jpg)然后，为窗口的“load”和表单的“reset”事件添加事件处理函数以显示一条消息。\n\
  \n```javascript\nfunction defaultMessage( info ) {\ninfo.innerHTML =\n‘Please enter\
  \ your favorite coding language’\n}\n```\n\n![image](img/5v.jpg)保存 HTML 文档，然后在浏览器中打开它，查看段落中出现的默认消息。\n\
  \n![image](img/pg151_1.jpg)\n\n![image](img/6v.jpg)选择文本字段并查看“focus”事件触发，然后输入你喜欢的编程语言名称。\n\
  \n![image](img/pg151_2.jpg)\n\n![image](img/7v.jpg)按下 Tab 键将焦点移动到重置按钮并查看“focusout”事件触发。\n\
  \n![image](img/pg151_3.jpg)\n\n![image](img/8v.jpg)按下 Enter 键（触发重置按钮）清除文本字段，并再次看到默认消息。\n\
  \n![image](img/pg151_4.jpg)\n\n## 验证表单\n\n表单对象的 `onsubmit` 属性可以指定事件处理函数，在用户输入的表单提交到\
  \ Web 服务器之前进行验证。或者，也可以将“submit”事件名称和事件处理函数名称作为表单对象的 `addEventListener()` 方法的参数。\n\
  \n![image](img/pg152_1.jpg)\n\n简单的表单验证检查文本输入以确保用户已输入内容。当其值为空字符串时，说明没有输入，因此验证函数可以调用\
  \ `event.preventDefault()` 方法阻止表单提交。\n\n高级表单验证可以检查用户输入的字符串以确保符合预期格式。例如，对于电子邮件地址，格式要求字符串包含“@”字符和至少一个“.”字符。当缺失其中任何一个时，字符串不是有效的邮箱地址，因此验证函数可以阻止表单提交。\n\
  \n可以通过在表单的 `elements[]` 中引用属性值来引用表单元素。\n\n![image](img/1v.jpg)创建一个包含两个文本字段和一个提交按钮表单的\
  \ HTML 文档。\n\n```html\n<form id=”contact” action=”echo.pl” method=”POST\">\n<fieldset>\n\
  <legend>Please Enter Your Details</legend>\nName: <input type=”text” name=”Name”\
  \ value=””>\n<br><br>\nEmail: <input type=”text” name=”Email” value=””>\n</fieldset>\n\
  <input type=”submit\">\n</form>\n```\n\n![image](img/htmlv.jpg)\n\nvalidate.html\n\
  \n![image](img/2v.jpg)接下来，在一个 script 元素中创建一个自执行函数，为表单的“submit”事件指定一个事件处理函数。\n\n\
  ```javascript\nfunction ( ) {\nconst form = document.getElementById( ‘contact’ )\n\
  form.addEventListener( ‘submit’ ,\nfunction ( event ) { validate( form, event )\
  \ } )\n} ) ( )\n```\n\n![image](img/3v.jpg)现在，添加事件处理函数来验证输入。\n\n```javascript\n\
  function validate( form, event ) {\nlet value = form.elements[ ‘Name’ ].value\n\
  if( value === ‘’ ) {\nalert( ‘Please Enter Your Name’ )\nevent.preventDefault( )\
  \ ; return }\nvalue = form.elements[ ‘Email’ ].value\nif( ( value === ‘’ ) || (\
  \ value.indexOf(‘@’) === -1 ) ||\n(value.indexOf(‘.’) === -1 ) ) {\n```\n\n\n\n\n\
  \n```javascript\nalert( ‘Please Enter A Valid Email Address’ )\nevent.preventDefault(\
  \ ) }\n}\n```\n\n![image](img/forget.jpg)\n\n`indexOf()` 方法返回一个整数，表示字符在字符串中的位置；如果未找到字符则返回\
  \ -1。详情请参见此处。\n\n![image](img/4v.jpg)将 HTML 文档保存到 Web 服务器上，然后在浏览器中打开，输入详细信息并提交表单\n\
  \n![image](img/pg153_1.jpg)\n![image](img/pg153_2.jpg)\n![image](img/pg153_3.jpg)\n\
  ![image](img/pg153_4.jpg)\n![image](img/pg153_5.jpg)\n![image](img/pg153_6.jpg)\n\
  ![image](img/common1.jpg)\n\n```pl\necho.pl\n```\n\n## 总结\n\n- document 对象具有 title、URL、domain、lastModified\
  \ 和 referrer 属性，用于描述该文档。\n- document 对象具有 forms、images、links、styleSheets 和 scripts\
  \ 子对象，它们是文档组件的数组。\n- forms 数组代表 `<form>` 标签，并具有一个 elements 子对象，它是表单组件的数组。\n- document\
  \ 对象具有 `getElementById()`、`getElementsByTagName()` 和 `getElementsByClassName()`\
  \ 方法，可用于引用 HTML 元素。\n- document 对象的 `innerHTML` 和 `innerText` 属性可向现有元素写入内容。\n- document\
  \ 对象具有 `createElement()`、`appendChild()` 和 `setAttribute()` 方法，可以向文档添加内容。\n- document\
  \ 对象的 `cookie` 属性具有“key=value”键对，可以在用户系统上存储少量数据。\n- `encodeURI()`、`decodeURI()`、`toUTCString()`\
  \ 和 `split()` 函数用于处理 cookie 数据的字符串。\n- DOM 允许 JavaScript 响应如 load、click、keydown、change\
  \ 和 submit 等事件，以响应用户操作。\n- 事件处理器函数可以赋值给对象属性，或通过 `addEventListener()` 方法指定。\n- 事件对象可以传递给事件处理器函数，并通过其\
  \ `event.type` 属性识别事件。\n- mousemove 事件对象具有 `x` 和 `y` 属性，包含指针的当前窗口坐标。\n- 单选按钮和复选框按钮对象具有\
  \ `checked` 布尔属性，仅在按钮被选中时为 true。\n- 选择列表列表对象具有 `selectedIndex` 属性，包含当前选中选项 `[]`\
  \ 数组元素的索引号。\n- 表单提交事件具有 `preventDefault()` 方法，可以调用它来停止表单提交到 Web 服务器。\n\n## 8 创建\
  \ Web 应用程序\n\n本章演示了如何创建一个从在线资源获取数据的 Web 应用程序。\n\n- 认识 JSON\n- 制作 Promise\n- 获取数据\n\
  - 创建界面\n- 填充单元\n- 计算总值\n- 更新应用\n- 总结\n\n## 认识 JSON\n\n![image](img/pg156_1.jpg)\n\
  \nJavaScript 对象表示法（“JSON”）是一种常用于存储和交换数据的流行文本格式。它是 JavaScript 语言的子集，数据在 JSON 对象内部以用逗号分隔的键值对列表形式存储。所有键必须是\
  \ String 类型，并用双引号括起来，关联的值只能是以下数据类型之一：\n\n- **String** – 位于双引号内，而不是单引号。\n- **Number**\
  \ – 整数或浮点数。\n- **Object** – 一个 JSON 对象。\n- **Array** – 但不是 Function 或 Date。\n- **Boolean**\
  \ – true 或 false。\n- **null** – 但不是 undefined。\n\nJSON 键值对被括在花括号中，如下所示：\n\n`{\"\
  name”:”Alice”,”age”:21，“city”:”New York”}`\n\n你可以通过将 JavaScript 对象指定为 `JSON.stringify()`\
  \ 方法的参数，轻松地将其转换为 JSON 对象。\n\n相反，你可以通过将 JSON 对象指定为 `JSON.parse()` 方法的参数，将其转换为 JavaScript\
  \ 对象。\n\n通常，JSON 对象将数据存储在具有 `.json` 扩展名的文本文件中，并作为在线资源。因此，网页脚本可能会从 Web 服务器接收 JSON\
  \ 格式的数据。\n\n使用 `JSON.parse()` 方法将 JSON 对象转换为 JavaScript 对象后，可以像往常一样使用点表示法或括号表示法来访问数据。\n\
  \nJSON 和 XML（可扩展标记语言）都可以用于从 Web 服务器接收数据，但 JSON 被认为更好，因为你需要遍历元素来从 XML 格式中提取数据，而 `JSON.parse()`\
  \ 方法只需返回所有数据的字符串。\n\n非常有用的是，JavaScript 可以从在线 JSON 资源获取数据用于 Web 应用程序。\n\n![image](img/hot.jpg)\n\
  \n你可以在 [jsonlint.com](http://www.jsonlint.com) 在线找到免费的 JSON 对象验证器。\n\n![image](img/1b.jpg)用自执行函数开始脚本，创建一个包含\
  \ String 和 Array 的 JavaScript 对象\n\n```javascript\nlet obj = { category : ’Fashion’\
  \ ,\nmodels : [ { name : ’Alice’, age : 21, city : ’New York’ } ,\n{ name : ’Kelly’,\
  \ age : 23, city : ’Las Vegas’ } ] }\n```\n\n![image](img/htmlb.jpg)\n\n```html.html\n\
  ```\n\n![image](img/2b.jpg)接下来，创建 JavaScript 对象的 JSON 版本并打印出来\n\n```javascript\n\
  let json_obj = JSON.stringify( obj )\nconsole.log( json_obj )\n```\n\n![image](img/3b.jpg)现在，创建一个\
  \ JSON 对象的 JavaScript 版本并打印出来进行对比\n\n```javascript\nlet new_obj = JSON.parse( json_obj\
  \ )\nconsole.log( new_obj )\n```\n\n![image](img/4b.jpg)最后，分别使用点表示法和括号表示法打印选定的值\n\
  \n```javascript\nconsole.log( new_obj[ ‘category’ ] )\nconsole.log( new_obj.models[\
  \ 0 ].name )\nconsole.log( new_obj[ ‘models’ ][ 1 ][ ‘name’ ] )\n```\n\n![image](img/5b.jpg)保存\
  \ HTML 文档，然后在浏览器中打开并启动开发者工具中的控制台以比较对象\n\n![image](img/pg157_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n可以看到 JSON 对象所有的 String 值都在双引号内。\n\n## 制作 Promise\n\nJavaScript 是一种单线程的“同步”语言。这意味着在任何给定时刻只能执行一个操作。随着脚本的进行，每个操作被添加到“调用栈”中，然后执行（按顺序）——然后从栈中移除。\n\
  \n然而，某些函数是由浏览器 API（应用程序接口）处理的，而不是由 JavaScript 引擎。例如，`setTimeout()` 方法是由浏览器处理的——这样在等待计时器结束就可以执行其他操作。当计时器结束时，会将操作传递给“回调队列”，然后（当它到达队列头部时）执行执行。整个过程由“事件循环”控制，它不断监控调用栈和回调队列的状态。\n\
  \n![image](img/pg158_1.jpg)\n\n在 JavaScript 中，Promise 对象代表异步操作的最终完成或失败及其结果值。它的状态可以是等待中（pending）、已解决（resolved）或已拒绝（rejected）。\n\
  \n使用 JavaScript 的 `new` 关键字和 `Promise()` 构造函数创建 promise。它接受一个函数作为参数，该函数反过来接受两个函数名称，指定在\
  \ promise 解决或拒绝时执行的操作。\n\n每个 JavaScript promise 都有 `then()` 和 `catch()` 方法，可以使用点表示法在\
  \ promise 对象之后进行“链式”。`then()` 方法可以处理异步操作的结果，而 `catch()` 方法可以处理拒绝时的错误。\n\n![image](img/hot.jpg)\n\
  \nWeb 浏览器有多个 API，包括 Fetch API，它用于从网络获取资源。\n\n![image](img/hot.jpg)\n\n你可以在 promise\
  \ 上链式调用多个 `then()` 方法，但只有一个会接收解析后的结果。\n\n\n\n\n\n![image](img/1b.jpg)用一个自执行函数开始脚本，该函数创建一个\
  \ JavaScript Promise 对象，该对象将在一秒后执行两个函数之一。\n\n```javascript\nconst promise = new\
  \ Promise( function( resolve, reject ) {\n  let random = Math.round( Math.random(\
  \ ) * 10 )\n  if ( random % 2 === 0 ) {\n    { setTimeout( function( ) { resolve(\
  \ random ) }, 1000 ) }\n  } else {\n    { setTimeout( function( ) { reject( random\
  \ ) }, 1000 ) }\n  }\n} )\n```\n\n![image](img/htmlb.jpg)\n\npromise.html\n\n![image](img/2b.jpg)接下来，添加带有链式方法的语句来显示\
  \ promise 的状态并处理返回的值。\n\n```javascript\npromise\n  .then( console.log( promise )\
  \ )\n  .then( function( res ) { console.log( res + ‘ Is Even’ ) ) )\n  .catch( function(\
  \ err ) { console.log( err + ‘ Is Odd’ ) ) )\n```\n\n![image](img/3b.jpg)保存 HTML\
  \ 文档然后在网页浏览器中打开它，启动开发者工具中的控制台以查看异步操作。\n\n![image](img/pg159_1.jpg)\n\n![image](img/pg159_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n注意控制台是如何提供 promise 的行号以及处理结果函数的行号的。\n\n## 获取数据\n\n浏览器支持\
  \ Fetch API，可以在 JavaScript 中使用它通过网络获取资源。`fetch()` 方法接受单个参数，即要获取的资源的 URL。\n\n![image](img/pg160_1.jpg)\n\
  \n`fetch()` 方法是异步的，这意味着在等待资源到达时，可以执行其他操作。完成后，`fetch()` 方法会返回一个 `Promise` 对象，该对象包含一个响应（一个\
  \ `HTTPResponse` 对象）。\n\n通常情况下，`fetch()` 方法可以获取 JSON 资源并使用 `HTTPResponse` 对象的 `json()`\
  \ 方法对其进行解析。返回的 JSON 数据随后可以作为参数传递给下一个链式 promise 方法，该方法反过来又可以将 JSON 数据传递给处理函数。该过程的语法如下：\n\
  \n```javascript\nfetch( url )\n  .then( function( response ) { return response.json(\
  \ ) } )\n  .then( function( data ) { return handler( data ) } )\n  .catch( function(\
  \ err ) { return console.log( err ) } )\n```\n\n## 箭头函数表达式\n\n上面的函数定义可以选择地写成更简洁的\
  \ JavaScript `=>` 箭头函数表达式。这允许你省略 `function` 关键字，如下：\n\n```javascript\n.then( ( response\
  \ ) => { return response.json( ) } )\n```\n\n如果函数体只包含一条语句，并且该语句返回一个值，你也可以省略 `=>`\
  \ 箭头函数中的大括号和 `return` 关键字，如下：\n\n```javascript\n.then( ( response ) => response.json(\
  \ ) )\n```\n\n任何参数都可以像往常一样圆圆 `()` 中以逗号分隔列表出现，但如果只有一个参数，你甚至可以省略 `=>` 箭头函数的括号——因此整个过程的语法可以选择地看起来像这样：\n\
  \n```javascript\nfetch( url )\n  .then( response => response.json( ) )\n  .then(\
  \ data => handler( data ) )\n  .catch( err => console.log( err ) )\n```\n\n这种方式更易读，但你应该意识到\
  \ `=>` 箭头函数处理 `this` 关键字的方式与普通函数不同。\n\n![image](img/snake.jpg)\n\n使用箭头函数时，`this`\
  \ 关键字代表原始上下文的对象，而在普通函数中，`this` 关键字代表调用函数的对象。\n\n![image](img/1b.jpg)打开一个纯文本编辑器（例如\
  \ Windows 的记事本应用），然后创建一个包含五个键值对对象的 JSON 文档。\n\n![image](img/pg161_3.jpg)\n\nweekdays.json\n\
  \n![image](img/pg161_1.jpg)\n\n![image](img/2b.jpg)将 JSON 文档保存在 Web 服务器的“htdocs”文件夹中——这样就可以通过网络访问了。\n\
  \n![image](img/3b.jpg)创建一个创建一个通过获取数据来解析的 promise，通过异步 HTTP 请求开始脚本。\n\n```javascript\n\
  fetch( http://localhost/weekdays.json’ )\n  .then( response => response.json( )\
  \ )\n  .then( data => list( data ) )\n  .catch( err => console.log( err ) )\n```\n\
  \n![image](img/htmlb.jpg)\n\nfetch.html\n\n![image](img/4b.jpg)现在，创建一个用于打印数据的函数。\n\
  \n```javascript\nfunction list( data ) {\n  const values = Object.values( data )\n\
  \  let i = 0\n  while( i < values.length ) { console.log( values[ i ] ) ; i++ }\n\
  }\n```\n\n![image](img/5b.jpg)将 HTML 文档与 JSON 文档保在一起，然后通过 HTTP 打开网页并启动开发者工具中的控制台以查看数据。\n\
  \n![image](img/pg161_2.jpg)\n\n## 创建界面\n\n本章其余部分将演示一个 Web 应用程序的创建，该程序允许在不重新加载的情况下动态更新网页上的数据。\n\
  \n网页上的数据可以在不重新加载的情况下动态更新。界面提供了一个表单和一个表格。部分单元格被填充了数据，其他单元格是空的。\n\n在文档主体部分创建一个包含表格的\
