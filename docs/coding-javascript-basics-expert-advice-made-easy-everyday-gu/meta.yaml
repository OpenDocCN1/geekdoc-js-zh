  md: "# FUNCTIONS IN JAVASCRIPT\n\n> A function is a collection of statements that\
    \ can be executed by referring to an identifier assigned to the function. They\
    \ are key to creating reusable blocks of code that can be called on when needed.\n\
    \n# BUILT-IN FUNCTIONS\n\nJavaScript has a number of functions built into the\
    \ language – in fact, we've already been using one: the alert() function. When\
    \ we use a function's name in a script, we are **calling** or **invoking** the\
    \ function – this is signified by the parentheses that follow the function name.\
    \ Using these parentheses, we can also pass data – referred to as **arguments**\
    \ – to the function.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_41_0.png)\n\n\
    # Function Arguments\n\nArguments are values that are passed to a function, and\
    \ which the functions can use. For example, with the alert() function call, we\
    \ place the message string that we want the dialogue box to display within the\
    \ parentheses. Some functions need to be passed to more than one argument – in\
    \ this case, we separate each argument with a comma.\n\n# NAMED FUNCTIONS\n\n\
    There are a couple of techniques for creating functions, but the first is easy\
    \ – we use the function keyword. It looks like this:\n\n```\nfunction functionName\
    \ (parameter_1, parameter_2, ... , parameter_n) {\n  statement(s);\n}\n```\n\n\
    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_41_1.png)\n\n```\nfunction showMessageToUser(userName,\
    \ message) {\n  alert(\"Hi \" + userName + \", \" + message);\n}\n\nshowMessageToUser(\"\
    Oliver\", \"Your function is working\");\n```\n\nAbove: A simple function definition\
    \ and a call to that function."
