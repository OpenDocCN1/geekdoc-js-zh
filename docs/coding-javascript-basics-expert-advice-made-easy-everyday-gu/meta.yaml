  mdcn: "\n上图：步骤 7：将此处所示的代码添加到你的 HTML 文档中。\n\n- 7. 在 `<body>` 元素下添加一个新的 `<script>`\
    \ 元素作为其子元素——添加上图所示的代码。\n- 9. 保存你的工作，并在 Firefox 中启动该 HTML 页面。\n\n## 工作原理\n\n第一个\
