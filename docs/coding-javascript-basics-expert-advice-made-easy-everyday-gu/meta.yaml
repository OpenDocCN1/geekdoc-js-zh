- img_proc: true
  md: "![](img/9f289ad67d43b98b3bcc0d91197bccf6_34_0.png)\n\n# How It Works\n\nThe\
    \ condition expression of the `if` statement compares the `userAge` value against\
    \ a literal value, 16. Because `userAge` evaluates to 36, and 36 is greater than\
    \ 16, the `if` condition evaluates to `true` and the subsequent expression is\
    \ evaluated.\n\n# The Else Clause\n\nThe basic `if` statement can be expanded\
    \ on via the addition of an `else` clause (we refer to it as a clause because\
    \ it's a subsection of a larger `if` statement, and means nothing outside of an\
    \ `if` statement). The general form is this:\n\n> The opening brace of a statement\
    \ block can be directly following the closing parenthesis of the condition expression,\
    \ or on its own line, or even just before the first statement. It's up to you.\n\
    \n```\nif(condition) {\n    statement(s);\n} else {\n    statement(s);\n}\n```\n\
    \nAbove: The `if` conditional expression evaluates to true, so we see the alert\
    \ message.\n\n# Executing Multiple Statements\n\nThe above form of `if` can only\
    \ execute a single statement when its condition is true, but we often need to\
    \ execute multiple statements. To do this, we add a statement block following\
    \ the condition expression (see Statement Blocks, page 63). The general form looks\
    \ like this:\n\n```\nif(condition) {\n    statement_1;\n    statement_2;\n   \
    \ ...\n    statement_n;\n}\n```\n\nNow, in the event that the condition evaluates\
    \ to `true`, all of the statements within the statement block (the body of the\
    \ `if` statement) are executed.\n\nThe statement block following `else` executes\
    \ when the `if` statement's condition evaluates to `false`. Why not try adding\
    \ an `else` clause to the last coding exercise (page 65)?\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_34_1.png)\n\
    \nAbove: Adding a statement block to an `if` statement.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_34_2.png)\n\
    \nRight: The `else` clause is triggered when the condition expression evaluates\
    \ to false."
  merge: -1
