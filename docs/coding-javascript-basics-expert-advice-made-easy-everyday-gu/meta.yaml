    \ are made up of expressions. Typically, expressions use operators to manipulate\
    \ data in some way.\n\n# WHAT IS AN EXPRESSION?\n\nAn expression is any segment\
    \ of code that the interpreter can evaluate, typically yielding a value. This\
    \ grandiose description belies how simple the concept is — consider the following:\
    \ 42. Strictly speaking, as well as being a literal, this is also an expression\
    \ — the interpreter can evaluate it, yielding the decimal value 42. Admittedly,\
    \ it isn’t much of an expression — it’s the scripting equivalent of walking into\
    \ a colleague and saying “42”; she will understand that you’ve stated a value,\
    \ but she won’t have a clue what you expect her to do with it.\n\n```\n1 42\n\
    2 2\n3 \"Hello World\"\n4 true\n5 null\n6 null\n```\n\n# Block Comments\n\nA block\
    \ comment starts with `/*` and continues until a closing `*/` occurs. Everything\
    \ between these markers is considered part of the comment.\n\n# KEYWORDS AND RESERVED\
    \ WORDS\n\nJavaScript defines a set of predefined identifiers, called keywords,\
    \ as well as other identifiers that may not be incorporated into the language\
    \ in the future. Collectively, these are known as reserved words, and you must\
    \ not use these names as names for your own identifiers (nor as property names\
    \ within objects).\n\n```\n/* These are line comments, which start with //\n//\
    \ Until the end-of-line character (\\n) is found.\n// This is a line comment.\
    \ This is a \"line comment\".\n\n/* This is a block comment; astronomers call\
    \ this a\n\"multi-line comment\" because it can span a line break (\\n)\n* We\
    \ can include block comments anywhere we like\n* They may appear in the middle\
    \ of a statement, either\n* when commenting out the code, or where labeling\n\
    * the code. */\n\n// You can also define different styles in the same document.\n\
    \n/* Let's use this style for expressions that return a value: */\nthis.result\
    \ = document.createElement(\"div\");\nthis.result = render(data);\n\n/* And this\
    \ style for statements that return nothing: */\nthis.container = window.body;\n\
    this.container.appendChild(this.result);\n\n/* And this style for logic: */\n\
    this.value = 42;\n\n/* And this style for helper functions: */\nthis.update =\
    \ () => {\n\tsetinnerWidth(this.container);\n\tsetinnerWidth(this.result);\n};\n\
    \n/* And this style for documentation: */\ncode.title = \"Example\";\n```\n\n\
    | KEYWORDS | RESERVED WORDS |\n| :--- | :--- |\n| break, case, catch, continue,\
    \ default, delete, do, else, false, finally, for, function, if, in, instanceof,\
    \ new, null, return, switch, this, throw, true, try, typeof, var, void, while,\
    \ with | abstract, boolean, byte, char, class, const, debugger, double, enum,\
    \ export, extends, final, float, goto, implements, import, int, interface, long,\
    \ native, package, private, protected, public, short, static, super, synchronized,\
    \ throws, transient, volatile |"
  - "[PAGE 27]\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_27_0.png)\n\n# Becoming\
    \ More Expressive\n\nNow consider the expression 38 + 4. This time, when evaluating\
    \ the expression, the interpreter adds 38 and 4 – the result is the same as our\
    \ previous example (the value 42), but we have achieved something by summing the\
    \ two values.\n\nSticking with our analogy, you have said to your colleague '38\
    \ plus 4', to which she has replied '42'. The thing that made the difference was\
    \ the inclusion of the addition operator, +.\n\n# WHAT IS AN OPERATOR?\n\nAs we've\
    \ just seen, for an expression to have meaning, it typically includes an operator;\
    \ the operator defines how the data within the expression should be evaluated\
    \ in order to obtain a value for the expression.\n\n# Operands\n\nIn the context\
    \ of operators, the value(s) being processed are referred to as operands. Many\
    \ operators expect two operands, one on either side of the operator (referred\
    \ to as the left and right operands). Others – called unary operators – work with\
    \ only a single operand, while still fewer work with three or more operands.\n\
    \n# A PLETHORA OF OPERATORS\n\nThere are many different JavaScript operators –\
    \ too many to cover here – so let's stick with the most common ones.\n\n# The\
    \ Dot Operator\n\nWe've already met the dot operator \".\" – it enables us to\
    \ access the properties (and methods – see page 102) of objects. The left operand\
    \ is a reference to an object, while the right one is the name of a property or\
    \ method of that object.\n\n```\n1  38 + 4\n2  \n3  \"Hello \" + \"World\"\n4\
    \  \n5  myVariable = true\n6  \n7  quizQuestion.questionText\n8  \n9  getMyValue()\n\
    10 \n11 myObject.doSomething()\n```\n\nAbove: Operators give meaning and purpose\
    \ to expressions.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_27_1.png)\n\nAbove:\
    \ Operands are the values that an operator will, in turn, operate on."
  - "[PAGE 28]\n\n# Arithmetic Operators\n\nAn arithmetic operator performs arithmetic\
    \ using the supplied operand(s) and returns the result of that calculation. The\
    \ operands must be numbers, or expressions that evaluate to numbers.\",\n\t\t\t\
    \n\n> **Hot Tip**\n\nGo to https://en.wikibooks.org/wiki/JavaScript Operators\
    \ to find a complete list of JavaScript's operators.\n\n| Operator | Number of\
    \ operands | Name | Action | Example (result in brackets) |\n|---|---|---|---|---|\n\
    | `+` | 2 | addition | Sums the left and right operands | 4 + 5 (9) |\n| `-` |\
    \ 2 | subtraction | Subtracts the right operand from the left operand | 31 - 14\
    \ (17) |\n| `*` | 2 | multiplication | Multiplies the left and right operands\
    \ | 12 * 3 (36) |\n| `/` | 2 | division | Divides the left operand by the right\
    \ operand | 12 / 3 (4) |\n| `++` | 1 | increment | Adds 1 to the value of the\
    \ identifier that is the single operand | multipliers++ (multipliers increases\
    \ by 1) |\n| `--` | 1 | decrement | Subtracts 1 from the value of the identifier\
    \ that is the single operand | multipliers-- (multipliers decreases by 1) |\n\n\
    # String Operators\n\nThere are a few different operators that can work in strings,\
    \ but only one dedicated to strings:\n\n| Operator | Name | Action | Example (result\
    \ in brackets) |\n|---|---|---|---|\n| `+` | concatenation | Joins two strings\
    \ together, returning the resulting string | \"Hello \" + \"World\" (\"Hello World\"\
    ) |\n\nNote that the concatenation operator looks the same as the addition operator\
    \ – the interpreter deduces which operator is intended based on the data types\
    \ of the operands. If both operands evaluate to numbers, it is addition; if either\
    \ operand evaluates to a string, then it is concatenation. Furthermore, if an\
    \ operand of the concatenation operator evaluates to a number, it is cast to a\
    \ string (see Data Type Casting, page 43).\n\n> **Hot Tip**\n\nWhere our tables\
    \ do not list Number of operands assume that these are binary operators – that\
    \ is, they expect two operands.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_28_0.png)"
  - '[PAGE 29]


    # Assignment Operator


    We''ve already met this operator, whose left operand is always a variable or property
    reference, and whose right operand can be any literal, identifier or expression.


    | Operator | Name | Action | Example (result in brackets) |

    | :--- | :--- | :--- | :--- |

    | `=` | assignment | Assigns the value of the right operand to the variable or
    property indicated by the left operand | `myRef = 42` (myRef now has a value of
    42) |


    # Equality Operators


    These operators compare two operands and return either true or false (see Booleans,
    page 331). The operands can be of any data type.


    > **Hot Tip**


    Be sure that you fully understand the difference between the assignment, `=`,
    and equality, `==`, operators.


    | Operator | Name | Action | Example (result in brackets) |

    | :--- | :--- | :--- | :--- |

    | `==` | equality | Returns true if the two operands are equal, otherwise false
    | `4 == 2` (false) |

    | `!=` | inequality | Returns true if the two operands are not equal, otherwise
    false | `4 != 2` (true) |


    # Comparison Operators


    As the name suggests, comparison operators compare two operands and return either
    true or false. The operands can be of any data type.


    | Operator | Name | Action | Example (result in brackets) |

    | :--- | :--- | :--- | :--- |

    | `<=` | less than or equal | Returns true if the left operand''s value is less
    than or equal to the right operand''s value, otherwise false | `52 < 20` (false)
    <br> `15 < 19` (true) |

    | `>=` | greater than or equal | Returns true if the left operand''s value is
    greater than or equal to the right operand''s value, otherwise false | `52 > 20`
    (true) <br> `12 > 350` (false) |


    # Logical Operators


    Logical operators compare values and then return either true or false. The operands
    are cast to Booleans if required.


    | Operator | Number of operands | Name | Action | Example (result in brackets)
    |

    | :--- | :--- | :--- | :--- | :--- |

    | `&&` | 2 | logical AND | Returns true if both operands evaluate to true, otherwise
    false | `true && false` (false) |

    | `||` | 2 | logical OR | Returns true if either operand evaluates to true, otherwise
    false | `true || false` (true) |

    | `!` | 1 | logical NOT | Placed before a single operand, inverts the Boolean
    value of the operand | `!true` (false) |'
- md: "```javascript\n7  <body>\n8    <script type=\"text/javascript\">\n9      var\
    \ jsResult = 20 - 4 * 3;\n10     document.write(\"<p>20 - 4 * 3 equals \" + jsResult\
    \ + \"</p>\");\n11     var possResult1 = (20 - 4) * 3;\n12     document.write(\"\
    <p>(20 - 4) * 3 equals \" + possResult1 + \"</p>\");\n13     var possResult2 =\
    \ 20 - (4 * 3);\n14     document.write(\"<p>20 - (4 * 3) equals \" + possResult2\
    \ + \"</p>\");\n15   </script>\n16 </body>\n```\n\nAbove: Exploring JavaScript's\
    \ operator precedence rules.\n\n## OPERATOR PRECEDENCE\n\nConsider the following\
    \ code: `20 - 4 * 3`. Does this mean `(20 - 4) * 3`, which would evaluate to 48,\
    \ or could it mean `20 - (4 * 3)`, which would evaluate to 8? JavaScript deals\
    \ with this by assigning a precedence to each operator - the operator with the\
    \ highest precedence is evaluated first; the operator with the lowest precedence\
    \ last. Why not write a script to see which of the above is the correct solution?\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_30_0.png)\n\n## Overriding Operator\
    \ Precedence\n\nRemembering the precedence of every operator can be quite challenging,\
    \ so it's often easier and less ambiguous to override the default operator precedence\
    \ using parentheses (brackets).\n\nAny expression contained within parentheses\
    \ is evaluated before all other expressions in the same statement. Consider the\
    \ following: `(24 - 2) / 7`. The section in parentheses, `(24 - 2)`, is evaluated\
    \ first, and the result, 22, is then divided by 7.\n\n```javascript\n1  <!DOCTYPE\
    \ HTML>\n2  <html>\n3    <head>\n4      <title>Nesting Parentheses</title>\n5\
    \    </head>\n6    <body>\n7      <script type=\"text/javascript\">\n8       \
    \ var myValue1 = ((22 / 7) + 10) - 3;\n9        var myValue2 = 13 + (9 - 2 / (4\
    \ + 6));\n10     </script>\n11   </body>\n12 </html>\n```\n\nIDE detected syntax\
    \ error caused by missing parenthesis: This opening parenthesis is not matched\
    \ by a closing parenthesis.\n\nAbove: This example's second expression results\
    \ in a syntax error.\n\n> **Hot Tip**\n> When nesting parentheses, always make\
    \ sure that each opening parenthesis `(` is matched by a closing parenthesis `)`.\
    \ A syntax error occurs if there is a mismatch.\n\n## Nesting Parentheses\n\n\
    You will often find yourself needing to nest parentheses within parentheses, for\
    \ example `((24 - 2) + 10) / 7`. In this scenario, it is the deepest nested expression\
    \ that is evaluated first, followed by the next deepest nested, and so on.\n\n\
    ## STATEMENTS\n\n> At the top level of JavaScript's anatomy, we find the statement.\
    \ All JavaScript instructions are contained within statements.\n\n### WHAT IS\
    \ A STATEMENT?\n\nA JavaScript statement encapsulates one or more expressions,\
    \ and can be thought of as a discrete step or instruction within a script. Each\
    \ statement in a script is executed in its entirety before the next statement\
    \ is processed.\n\n### Making a Statement\n\nConsider the following simple expression:\
    \ `playerScore = 0;`. While this is an expression, it is also a statement, as\
    \ indicated by the terminating semicolon `;`. A statement need not be any more\
    \ complex than this, but they often are.\n\n```javascript\nplayerScore = 0;\n\
    ```\n\nAbove: Statements comprise one or more expressions.\n\n```javascript\n\
    document.write(\"Your score is \" + playerScore);\n```\n\n### Compound Expressions\n\
    \nWe often build up quite complicated stacks of expressions within a statement,\
    \ for example: `document.getElementsByTagName(\"body\")[0].appendChild(document.createElement(\"\
    p\")).innerHTML = 'Hello World!';`\n\nThis statement illustrates how expressions\
    \ can be combined. It uses DOM programming techniques, introduced on page 109,\
    \ to achieve the same outcome as the first script we wrote.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_31_0.png)\n\
    \n```javascript\ndocument.getElementsByTagName(\"body\")[0].appendChild(document.createElement(\"\
    p\")).innerHTML = \"Hello World!\";\n```\n\n> **Hot Tip**\n> Complex statements\
    \ like the one on this page are usually much easier to write than to read. In\
    \ fact, once you've got the hang of JavaScript, you'll probably find writing them\
    \ to be curiously satisfying – even artistic.\n\n### Balancing Complexity Against\
    \ Legibility\n\nIt's important to understand that lengthy and convoluted statements,\
    \ such as the one above, can quite easily be broken down into a series of shorter,\
    \ simpler statements.\n\nAll we do is distribute the expressions among more statements.\
    \ However, in order to share the results of the expressions in one statement with\
    \ the operators in another, we would need to store the result of each statement\
    \ in a variable, so that the other statements have access to those values.\n\n\
    ### Balancing Speed Against Legibility\n\nCreating and managing variables adds\
    \ to the interpreter's workload, so complex statements comprising multiple expressions\
    \ are generally executed more quickly than the same expressions broken down into\
    \ multiple statements. So while choosing how simple – or complex – to make your\
    \ statements is largely down to personal preference, you do need to think about\
    \ how performance-critical the application is.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_32_0.png)\n\
    \n```javascript\n8 <script type=\"text/javascript\">\n9 //This compound statement...\n\
    10 document.getElementsByTagName(\"body\")[0].appendChild(document.createElement(\"\
    p\")).innerHTML = \"Hello World!\";\n11 //...does the same as the following set\
    \ of statements\n12 var bodyElementsArray = document.getElementsByTagName(\"body\"\
    );\n13 var bodyElement = bodyElementsArray[0]; //Remember, there is only one body\
    \ element\n14 var newPara = document.createElement(\"p\");\n15 newPara.innerHTML\
    \ = \"Hello World!\";\n16 bodyElement.appendChild(newPara);\n17\n18 </script>\n\
    ```\n\nAbove: Complex statements can be broken down into separate statements –\
    \ or not.\n\n## STATEMENT BLOCKS\n\nRelated statements can be grouped together\
    \ into a block. This is done by wrapping the statements in braces – i.e curly\
    \ brackets: `{` and `}`. For example:\n\n```javascript\n{\n  var playerScore =\
    \ 0;\n  var playerName = 'Sarah';\n  var playerAge = 29;\n}\n```\n\nThis technique\
    \ has its uses, but doesn't achieve an awful lot. However, as we are about to\
    \ discover, statement blocks become increasingly important the deeper we delve\
    \ into JavaScript.\n\n**Hot Tip**\n\nThinking about how to break down common tasks\
    \ – such as making a cup of tea – into a series of concise, unambiguous instructions\
    \ is a great way to practise the art of structuring JavaScript expressions and\
    \ statements.\n\n## CONDITIONAL STATEMENTS\n\nWe often need to execute different\
    \ statements based upon conditions that do not exist until a page has been loaded\
    \ into a browser, and a user is interacting with it. This is when we reach for\
    \ conditional statements.\n\n### IF STATEMENTS\n\nWith `if`, we test for the existence\
    \ of a condition and then execute expressions should that condition exist. Its\
    \ basic form looks like this:\n\n```javascript\nif (condition) expressions;\n\
    ```\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_33_0.png)\n\nAbove: Flowchart\
    \ of a simple if statement\n\n### USING IF STATEMENTS\n\nWhen the interpreter\
    \ encounters an `if` statement, it evaluates the expression contained inside the\
    \ parentheses. In the event that the expression evaluates to `true`, the statement\
    \ following the `if` is executed.\n\n### How an If Statement Works\n\nLet's see\
    \ how an `if` statement works using a simple example:\n\n- 1. Create a new HTML\
    \ document and enter the standard structural elements. Save the page as `ifExample.html`.\n\
    - 2. Create a new `<script>` element as a child of (i.e. inside) the `<head>`\
    \ element. We're declaring it in the `<head>` to ensure it's available before\
    \ the `<body>` element is rendered.\n- 3. Add a simple variable declaration into\
    \ this `<script>` element: `var userAge = 36;`. Although we've manually assigned\
    \ a value to this variable, imagine that the user had actually provided this information.\
    \ See the illustration, right.\n- 4. Add another `<script>` element, this time\
    \ as the child of the `<body>` element. Copy into this new `<script>` element\
    \ the code shown in the illustration below.\n- 5. Save your work and then open\
    \ `ifExample.html` in Firefox.\n\n```html\n1 <!DOCTYPE HTML>\n2 <html>\n3   <head>\n\
    4     <title>If Example</title>\n5   \n6     <script type=\"text/javascript\"\
    >\n7       var userAge = 36;\n8     </script>\n9   \n10  </head>\n```\n\nAbove:\
    \ Step 3: Here you add a simple variable declaration.\n\n```html\n12  <body>\n\
    13    <script type=\"text/javascript\">\n14      if(userAge > 16) alert(\"This\
    \ is a kids zone - not for grown ups.\");\n15    </script>\n16  \n17  </body>\n\
    ```\n\nAbove: Step 4: Use the code as described in the text above."
