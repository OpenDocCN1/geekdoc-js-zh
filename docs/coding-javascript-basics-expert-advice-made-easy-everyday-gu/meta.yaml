  md: "# PRIMITIVE AND REFERENCE DATA TYPES\n\nPrimitive data types can be thought\
    \ of as those whose data represents a single value, such as a number, while **reference**\
    \ data types represent complex data, such as a list.\n\nWhen a variable of a primitive\
    \ type is used in a script, the interpreter copies the variable's value and uses\
    \ this copy in its calculations. In contrast, when a variable of reference type\
    \ is used, the interpreter works directly with the data stored in memory.\n\n\
    Primitive data type\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_16_0.png)\n\n\
    Reference data type\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_16_1.png)\n\n\
    Above: Primitive data types retain a copy of their in-memory value; reference\
    \ types retain a direct reference to their in-memory value.\n\n# Understanding\
    \ the Difference Between Primitive and Reference Data Types\n\n> **Hot Tip**\n\
    From now on, we won't tell you which common elements to add to a basic HTML document\
    \ — you know by now.\n\n1. Create a new HTML document containing the common structural\
    \ elements (<html>, <head> and <body>). Save the file as datatypes.html.\n\n2.\
    \ Create a `<script>` element as a child of (i.e. within) the `<body>` element,\
    \ being sure to set the type attribute to \"text/javascript\", as shown below.\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Exploring Primitive and Reference\
    \ Datatypes</title>\n</head>\n<body>\n<script type=\"text/javascript\"></script>\n\
    </body>\n</html>\n```\n\n```\n<script type=\"text/javascript\">\n  document.write(\"\
    <h2>PRIMITIVE DATATYPES</h2>\");\n  var primitiveVar1 = 72;\n  var primitiveVar2\
