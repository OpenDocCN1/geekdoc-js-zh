    读者，你好 JavaScript —— JavaScript，你好读者。


    在本章中，我们将详细解释什么是数据以及如何在 JavaScript 中处理数据。


    在这里，我们将探索 JavaScript 的结构以及如何在自己的脚本中使用这些结构。


    在本章中，我们将学习如何使用函数创建可重用代码，并介绍 JavaScript 中的面向对象编程和类。


    在最后一章中，我们将讨论 JavaScript 拼图的最后几块：文档对象模型，即 DOM。


    ## 系列前言


    想象一下你刚刚发明了一种语言。它并不太像 Java，而且你并不打算将其用于脚本编写。所以你将其命名为 JavaScript。但这个名字奇怪的语言在万维网中如此普及，以至于你很难找到一个不使用它的网页。它与
    HTML、样式表、SQL 以及像 C# 或 VB 这样的服务端语言一起，是你需要掌握的众多技术之一，以便向用户提供具有吸引力的网络内容。成为一名 Web 开发人员是一项巨大的挑战。


    本书为 JavaScript 提供了一个极易上手的入门介绍，非常适合没有编程经验的读者。通过稳步增加复杂性，且绝不会用过多的细节让读者感到不知所措，本书涵盖了所有主要的语言特性——变量、循环、分支、函数、对象等，并介绍了文档对象模型（DOM）——这是一个指定网页如何表示，以及你的
    JavaScript 代码在呈现给用户之前如何对其进行操作的正式模型。


    这不是一本大书，你只需几个小时就能读完。但读完后，你将掌握足够的语言知识来构建自己的交互式网页。


    但不要只听我说……请翻页。


    Chris Brown

    Linux 大使及培训顾问


    ## 简介


    JavaScript 语言自万维网诞生之初就一直陪伴着我们。在早期，它仅仅是众多语言和技术中的一个，在竞争 Web 开发社区的关注和推崇。


    ### 通用语言


    多年来，许多类似的技术在风靡一时后，因各种原因而失宠，但 JavaScript 并非如此。很大程度上由于灵活性和普及性的结合，JavaScript 现已成为互联网的主流脚本语言。


    ### 从 HTML/CSS 进阶


    尽管 JavaScript 有时具有深奥的特性，但它是学习通用编程的完美语言。本书面向编程初学者。你可能已经花了一些时间学习 HTML 和 CSS，并希望通过
    JavaScript 提升水平；或者你可能尝试过一些脚本编写，希望将这些知识正式化并扩展。你甚至可能是一位从未用过 JavaScript 的经验丰富程序员，想要一个快速概览以便上手。


    ### 首选入门指南


    不可否认的是，JavaScript 是一个深奥的主题，以至于没有任何一本书能告诉你关于该语言的所有知识。因此，本书旨在提供该语言的广泛概述，并给你足够的理解，使你能够在页面中添加简单的脚本和交互。它也非常适合作为进一步学习
    JavaScript 编程的入门读物。


    ### 在线示例


    你可以下载本书所有代码示例的完整版本以及附加笔记。请访问 www.flametreepublishing.com/book-samples.html。


    ### 核心提示


    请留意“核心提示”（Hot Tips），它们将告诉你 JavaScript 中可用的许多快捷方式和快速技巧。


    ## 初识 JavaScript


    ### JAVASCRIPT, HTML 和 CSS


    开发网页主要使用三种核心语言：HTML 提供底层结构和内容；CSS 提供视觉场景；而 JavaScript，嗯，JavaScript 提供了赋予整体生命的魔力。


    ### 开始之前


    本书仅关注 JavaScript，但该语言与 Web 浏览器和网页紧密相连，如果不依赖于 HTML 和 CSS 的先验知识，就无法讨论它。如果你还没有这些知识，*Coding
    HTML & CSS Basics* 将帮助你快速掌握必要的技能。


    > **核心提示**

    > 如果在 HTML 和 CSS 的上下文中，你理解元素（element）、属性（attribute）、开始和结束标签（opening and closing
    tags）、选择器（selectors）和样式规则（style rules）等术语的含义，那么你可以开始学习 JavaScript 了。


    左图：*Coding HTML & CSS Basics* 将帮助你快速掌握必要的知识，从而轻松深入学习本书的内容。


    #### 浏览器兼容性


    虽然 JavaScript 核心语言在所有主流浏览器中都得到了充分支持，但在使用高级或冷门函数时可能会出现问题，因为并非所有浏览器都支持 JavaScript
    的所有扩展功能。虽然有方法可以绕过这些问题，但遗憾的是，这里没有空间详细讲解。


    #### Firefox


    本书中的所有示例均使用标准的 JavaScript 编程技术和结构。然而，为了避开任何令人厌烦的浏览器兼容性问题，我们将使用 Firefox 浏览器运行所有示例，并鼓励你也这样做。


    > **核心提示**

    > 请参阅第 7 页，了解如何下载本书所有代码示例的完整版本。这些文件包含有助于进一步解释示例的附加笔记。


    上图：目前可用的最符合标准的 Web 浏览器之一，如此精美，我们强烈建议你安装一个，你可以从 www.mozilla.org 下载。

