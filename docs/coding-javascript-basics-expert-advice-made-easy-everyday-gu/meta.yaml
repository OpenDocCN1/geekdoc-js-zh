  md: "# Arithmetic Operators\n\nAn arithmetic operator performs arithmetic using\
    \ the supplied operand(s) and returns the result of that calculation. The operands\
    \ must be numbers, or expressions that evaluate to numbers.\",\n\t\t\t\n\n> **Hot\
    \ Tip**\n\nGo to https://en.wikibooks.org/wiki/JavaScript Operators to find a\
    \ complete list of JavaScript's operators.\n\n| Operator | Number of operands\
    \ | Name | Action | Example (result in brackets) |\n|---|---|---|---|---|\n| `+`\
    \ | 2 | addition | Sums the left and right operands | 4 + 5 (9) |\n| `-` | 2 |\
    \ subtraction | Subtracts the right operand from the left operand | 31 - 14 (17)\
    \ |\n| `*` | 2 | multiplication | Multiplies the left and right operands | 12\
    \ * 3 (36) |\n| `/` | 2 | division | Divides the left operand by the right operand\
    \ | 12 / 3 (4) |\n| `++` | 1 | increment | Adds 1 to the value of the identifier\
    \ that is the single operand | multipliers++ (multipliers increases by 1) |\n\
    | `--` | 1 | decrement | Subtracts 1 from the value of the identifier that is\
    \ the single operand | multipliers-- (multipliers decreases by 1) |\n\n# String\
    \ Operators\n\nThere are a few different operators that can work in strings, but\
    \ only one dedicated to strings:\n\n| Operator | Name | Action | Example (result\
    \ in brackets) |\n|---|---|---|---|\n| `+` | concatenation | Joins two strings\
    \ together, returning the resulting string | \"Hello \" + \"World\" (\"Hello World\"\
    ) |\n\nNote that the concatenation operator looks the same as the addition operator\
    \ – the interpreter deduces which operator is intended based on the data types\
    \ of the operands. If both operands evaluate to numbers, it is addition; if either\
    \ operand evaluates to a string, then it is concatenation. Furthermore, if an\
    \ operand of the concatenation operator evaluates to a number, it is cast to a\
    \ string (see Data Type Casting, page 43).\n\n> **Hot Tip**\n\nWhere our tables\
    \ do not list Number of operands assume that these are binary operators – that\
    \ is, they expect two operands.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_28_0.png)"
