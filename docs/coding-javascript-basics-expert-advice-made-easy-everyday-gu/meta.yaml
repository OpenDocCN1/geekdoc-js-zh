  md: "# WHAT IS DATA?\n\nA key concept in all programming languages is data. Data\
    \ can be thought of as any piece of information that is used within a program.\n\
    \n# ALL DATA HAS A VALUE\n\nAny piece of data can be said to have a value. This\
    \ value can be simple - for example, a number or a paragraph of text - or it can\
    \ be complex, such as a list of numbers or many paragraphs. Whatever the type\
    \ of data, though, the information being represented by that data is referred\
    \ to as the data's value.\n\n# Literals\n\nA literal is a piece of data with a\
    \ specific value that's typed directly into a script. The following are all examples\
    \ of literals: `\"Hello World\"`, `true`, `42` and `null`.\n\n# Identifiers\n\n\
    An identifier is a case sensitive name that's assigned to a piece of data (or\
    \ to a function - see Named Functions on page 81). Once assigned, an identifier\
    \ can be used to refer to that data (or function) within a script. JavaScript\
    \ leaves you free to choose the names you wish to use as identifiers, as long\
    \ as you follow a few basic rules.\n\n```\n3  \n4  myNumberLiteral = 42;\n5  myStringLiteral\
    \ = \"Hello World\";\n6  myBooleanLiteral = true;\n7  myNullLiteral = null;\n\
