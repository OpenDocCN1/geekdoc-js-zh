    # WORKING WITH THE DOM


    Every script we''ve written so far has worked by outputting data to the page while
    the page loads. This is OK – but limiting. What if we want to manipulate the page
    after it has loaded? How do we achieve this?


    # DYNAMIC HTML


    All major browsers support something called Dynamic HTML or DHTML for short. DHTML
    allows JavaScript to make changes to a page after it has been loaded and rendered
    in the browser, with such changes immediately shown on screen. This presents us
    with a whole host of possibilities – your imagination really is the limit.


    ```

    /*

    We''ve changed checkUserAnswer() considerably - see comments within the body of
    the

    method...

    */

    com.flowerpresspublishing.QuizQuestion.prototype.checkUserAnswer = function(answerIndex)
    {

    //Initialise theResult to false - we can change this if the question was correctly
    answered

    var theResult = false;

    if(this.questionAnswered) {

    //If this question has already been answered then report this in an alert and
    do nothing more

    alert(''You\''ve already answered this question'');

    } else if(answerIndex == this.correctAnswer-Index) {

    //If the correct answer is given then mark the question as being correctly answered

    this.answeredCorrectly = true;

    //Now set the style class of the question''s <div> so that it changes to green

    document.getElementById(''q'' + this.questionNum).className = ''correctlyAnswered'';

    //And set theResult to true

    theResult = true;

    } else {

    //If the question has been incorrectly answered then change the <div> style class
    name

    //so that it has a red background

    document.getElementById(''q'' + this.questionNum).className = ''incorrectlyAnswered'';

    }

    //Record that this question has now been answered

    this.questionAnswered = true;

    //Now return theResult. This isn''t actually being used any more, but it''s nonetheless

    //useful to have methods return a result, even if only to indicate that the code
    was

    //executed in full without errors.

    return theResult;

    };

    ```


    Above: Additional explanations are contained in the downloadable code examples


    # Hot Tip


    Be sure to download the code examples – see page 7. As well as enabling you to
    check your code against ours, you''ll also find comments included that help to
    further explain the examples.


    # HTML IS HIERARCHICAL


    All HTML documents contain an `<html>` element; this element always contains a
    `<head>` and a `<body>` element; these elements themselves contain other elements.
    A page is, therefore, a hierarchical structure of HTML elements. We express this
    structure in terms of ancestry: `<html>` is the **root** and has two children,
    `<head>` and `<body>`; `<html>` is the **parent** of `<head>` and `<body>`; `<head>`
    and `<body>` are **siblings**.


    # What is the DOM?


    We know that JavaScript enables us to create similar hierarchical structures by
    storing objects within other objects; as it turns out, this is exactly how a web
    page is represented under the hood of the browser. This representation – or model
    – is known as the **Document Object Model**, or **DOM** for short.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_56_0.png)


    Above: HTML elements are nested within other HTML elements; all elements have
    a parent, and many have siblings and children.'
