    # ## How It Works


    The first `<script>` element is easy enough – it links to a script in which we
    declare objects that represent the questions in our quiz, and stores these in
    an array called `questions`. This array is accessible to all scripts in the page,
    and is defined in the `<head>` so that we can be sure it''s available when processing
    the page''s `<body>`.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_39_1.png)


    Above: Our quiz is starting to take shape.


    Now let''s look at the `for` loop in the second `<script>` element. The index
    is initialized to `0`. Then the condition `i < questions.length` is evaluated.
    When `i` is `0` the condition evaluates to `true`, so the loop body is executed,
    and text is written to the page using the familiar `document.write()` technique.
    The important thing to note is that we use the loop index, `i`, to access each
    element of the `questions` array in turn.


    Once the statement block has completed, the iteration expression, `i++`, is evaluated,
    adding `1` to the index, and the condition is tested once more. The process repeats
    until the condition evaluates to `false`.


    # ## EXITING FROM A LOOP OR ITERATION


    We can exit a loop at any time by writing the `break` keyword, causing script
    execution to resume at the first statement following the loop. We can also exit
    from the current iteration of a loop using `continue`, which instructs the interpreter
    to evaluate the iteration and condition expressions immediately, and then continue
    looping if required.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_39_2.png)


    Above: The `continue` and `break` statements enable us respectively to skip an
    iteration or exit a loop entirely.'
