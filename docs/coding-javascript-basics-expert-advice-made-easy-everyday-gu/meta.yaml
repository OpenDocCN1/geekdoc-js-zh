  md: "![](img/9f289ad67d43b98b3bcc0d91197bccf6_27_0.png)\n\n# Becoming More Expressive\n\
    \nNow consider the expression 38 + 4. This time, when evaluating the expression,\
    \ the interpreter adds 38 and 4 – the result is the same as our previous example\
    \ (the value 42), but we have achieved something by summing the two values.\n\n\
    Sticking with our analogy, you have said to your colleague '38 plus 4', to which\
    \ she has replied '42'. The thing that made the difference was the inclusion of\
    \ the addition operator, +.\n\n# WHAT IS AN OPERATOR?\n\nAs we've just seen, for\
    \ an expression to have meaning, it typically includes an operator; the operator\
    \ defines how the data within the expression should be evaluated in order to obtain\
    \ a value for the expression.\n\n# Operands\n\nIn the context of operators, the\
    \ value(s) being processed are referred to as operands. Many operators expect\
    \ two operands, one on either side of the operator (referred to as the left and\
    \ right operands). Others – called unary operators – work with only a single operand,\
    \ while still fewer work with three or more operands.\n\n# A PLETHORA OF OPERATORS\n\
    \nThere are many different JavaScript operators – too many to cover here – so\
    \ let's stick with the most common ones.\n\n# The Dot Operator\n\nWe've already\
    \ met the dot operator \".\" – it enables us to access the properties (and methods\
    \ – see page 102) of objects. The left operand is a reference to an object, while\
    \ the right one is the name of a property or method of that object.\n\n```\n1\
    \  38 + 4\n2  \n3  \"Hello \" + \"World\"\n4  \n5  myVariable = true\n6  \n7 \
    \ quizQuestion.questionText\n8  \n9  getMyValue()\n10 \n11 myObject.doSomething()\n\
    ```\n\nAbove: Operators give meaning and purpose to expressions.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_27_1.png)\n\
    \nAbove: Operands are the values that an operator will, in turn, operate on."
