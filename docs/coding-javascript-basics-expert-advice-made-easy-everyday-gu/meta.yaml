- md: "## DATA IN JAVASCRIPT\n\n## WHAT IS DATA?\n\nA key concept in all programming\
    \ languages is data. Data can be thought of as any piece of information that is\
    \ used within a program.\n\n## ALL DATA HAS A VALUE\n\nAny piece of data can be\
    \ said to have a value. This value can be simple - for example, a number or a\
    \ paragraph of text - or it can be complex, such as a list of numbers or many\
    \ paragraphs. Whatever the type of data, though, the information being represented\
    \ by that data is referred to as the data's value.\n\n## Literals\n\nA literal\
    \ is a piece of data with a specific value that's typed directly into a script.\
    \ The following are all examples of literals: `\"Hello World\"`, `true`, `42`\
    \ and `null`.\n\n## Identifiers\n\nAn identifier is a case sensitive name that's\
    \ assigned to a piece of data (or to a function - see Named Functions on page\
    \ 81). Once assigned, an identifier can be used to refer to that data (or function)\
    \ within a script. JavaScript leaves you free to choose the names you wish to\
    \ use as identifiers, as long as you follow a few basic rules.\n\n```\n3  \n4\
    \  myNumberLiteral = 42;\n5  myStringLiteral = \"Hello World\";\n6  myBooleanLiteral\
    \ = true;\n7  myNullLiteral = null;\n8  \n9  \n```\n\n*Above: Literal values are\
    \ typed directly into a script.*\n\n## Identifier Naming Rules\n\n- **Reserved\
    \ words:** JavaScript defines a number of words that have special meaning for\
    \ the language (See page 50). These can't be used as names for your own identifiers.\n\
    \n- **First character:** The first character of an identifier must be a letter,\
    \ an underscore `_` or a dollar `$`.\n\n- **Subsequent characters:** The remaining\
    \ characters in an identifier can only be letters, numbers, underscores or dollars.\n\
    \n```\n1  //Examples of legal identifiers\n2  myValue\n3  _myValue\n4  MY_VALUE\n\
    5  $myValue\n6  my3Value23\n7  my_$_value_23\n8  \n9  //Examples of illegal identifiers\n\
    10 23myvalue\n11 myValue*\n12 my-value\n13 #myvalue\n14 my%Value\n15 my4Value\n\
    16 \n```\n\n*Right: The first set of identifiers are all legal (in other words,\
    \ allowed) identifiers while the second set are illegal.*\n\n## VARIABLES\n\n\
    In essence, a variable is a portion of computer memory that's used for storing\
    \ data, and which is referred to using an identifier.\n\n### DECLARING A VARIABLE\n\
    \nIt's very easy to declare a new variable in JavaScript – all we do is write\
    \ the keyword var followed by the identifier we want to use to refer to the variable.\
    \ For example:\n\n```\nvar theAnswer;\n```\n\n### Assigning a Value to a Variable\n\
    \nIt is common to assign a value to a variable at the time it is declared, like\
    \ this:\n\n```\nvar theAnswer = 42;\n```\n\n### Changing the Value of a Variable\n\
    \nOnce a variable has been declared with var, we can change the value assigned\
    \ to it like this: theAnswer = 54. Notice that we didn't include the var keyword\
    \ this time.\n\n```\n4 //Declaring variables (without and with assignment)\n5\
    \ var theQuestion;\n6 var theAnswer = 42;\n7\n8 //Assigning a value to a declared\
    \ variable\n9 theQuestion = \"Life, the Universe and Everything\";\n10\n```\n\n\
    *Above: Variables are easy to declare and use.*\n\n> **Hot Tip**\n>\n> In JavaScript,\
    \ = does not mean equals – it means assignment (see page 56).\n\n### Getting the\
    \ Value of a Variable\n\nTo use the value stored in a variable, we write that\
    \ variable's identifier name in the place where we need to use the value.\n\n\
    1. Create a new HTML document and add the common structural elements (`<html>`,\
    \ `<head>` and `<body>`). Save the document as gettingVariables.html.\n\n2. Add\
    \ a `<script type=\"text/javascript\">` element as a child of (ie. within) the\
    \ `<body>` element, as shown below.\n\n3. Add the JavaScript code shown below.\n\
    \n4. Save your work and then open the file in Firefox.\n\n```\n1 <!DOCTYPE HTML>\n\
    2 <html>\n3   <head>\n4     <title>Getting Variables</title>\n5   </head>\n6\n\
    7   <body>\n8\n9     <script type=\"text/javascript\">\n10\n11    </script>\n\
    12\n13   </body>\n14 </html>\n```\n\n*Above: Step 2: Add a `<script type=\"text/javascript\"\
    >` element.*\n\n```\n10 <script type=\"text/javascript\">\n11   var theMessage\
    \ = \"The alert function displays a message in a dialog box. \";\n12   alert(theMessage);\n\
    13   theMessage = \"Here we're just changing a variable's value...\";\n14   alert(theMessage);\n\
    15   theMessage = \"...and passing that variable's identifier to the alert function.\
    \ \";\n16   alert(theMessage);\n17   theMessage = \"The interpreter then looks\
    \ up the variable's value...\";\n18   alert(theMessage);\n19   theMessage = \"\
    ...and that's what we see in the dialog box. Simple, eh?\";\n20   alert(theMessage);\n\
    21 </script>\n```\n\n*Above: Step 3: Add the JavaScript code.*\n\n## DATA TYPES\n\
    \n> All data handled by JavaScript has a data type. This specifies the nature\
    \ of the data being handled - whether it's a number, text, a list and so on.\n\
    \n## WHAT IS A DATA TYPE?\n\nIn order to translate a piece of data into anything\
    \ useful, a computer or program has to know what the data is intended to represent\
    \ - it has to know the type of the data. Because data is stored in variables,\
    \ we normally refer to variables as having a data type, or as being of type so\
    \ and so. Data types fall into two groups: primitive and reference. Let's take\
    \ a look at what that means.\n\n## DATA MECHANICS\n\nUnlike lower-level programming\
    \ languages such as C and Java, JavaScript does not require the programmer to\
    \ get involved in the details of how data is stored on the computer - the interpreter\
    \ manages such intricacies for us.\n\nHowever, you should still appreciate that\
    \ everything your computer does - every email you write, every song you listen\
    \ to, every video you watch - is represented by numbers.\n\nTherefore, at the\
    \ most fundamental level, all computer data is just numbers.\n\n> The binary and\
    \ hexadecimal number systems are intrinsically tied to the way computers represent\
    \ numbers and data - look them up on Wikipedia if you don't know how they work.\n\
    \n## PRIMITIVE AND REFERENCE DATA TYPES\n\nPrimitive data types can be thought\
    \ of as those whose data represents a single value, such as a number, while **reference**\
    \ data types represent complex data, such as a list.\n\nWhen a variable of a primitive\
    \ type is used in a script, the interpreter copies the variable's value and uses\
    \ this copy in its calculations. In contrast, when a variable of reference type\
    \ is used, the interpreter works directly with the data stored in memory.\n\n\
    Primitive data type\n\nReference data type\n\n*Above: Primitive data types retain\
    \ a copy of their in-memory value; reference types retain a direct reference to\
    \ their in-memory value.*\n\n### Understanding the Difference Between Primitive\
    \ and Reference Data Types\n\n> **Hot Tip**\n>\n> From now on, we won't tell you\
    \ which common elements to add to a basic HTML document — you know by now.\n\n\
    1. Create a new HTML document containing the common structural elements (`<html>`,\
    \ `<head>` and `<body>`). Save the file as datatypes.html.\n\n2. Create a `<script>`\
    \ element as a child of (i.e. within) the `<body>` element, being sure to set\
    \ the type attribute to \"text/javascript\", as shown below.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Exploring Primitive and Reference Datatypes</title>\n\
    </head>\n<body>\n<script type=\"text/javascript\"></script>\n</body>\n</html>\n\
    ```\n\n```\n<script type=\"text/javascript\">\n  document.write(\"<h2>PRIMITIVE\
    \ DATATYPES</h2>\");\n  var primitiveVar1 = 72;\n  var primitiveVar2 = primitiveVar1;\n\
    \  document.write(\"<p>primitiveVar1 has value \" + primitiveVar1 + \"</p>\");\n\
    \  document.write(\"<p>primitiveVar2 has value \" + primitiveVar2 + \"</p>\");\n\
    \  var primitiveVar1 = 12;\n  document.write(\"<p>primitiveVar1 now has value\
    \ \" + primitiveVar1 + \"</p>\");\n  document.write(\"<p>primitiveVar2 now has\
    \ value \" + primitiveVar2 + \"</p>\");\n</script>\n```\n\n*Above: Step 3: Enter\
    \ this code into your new `<script>` element.*\n\n3. Enter the code shown above\
    \ within this new script element.\n\n4. Save your work and then open datatypes.html\
    \ in Firefox.\n\n5. As you can see, even though we assigned primitiveVar2 to primitiveVar1,\
    \ the value of primitiveVar1 did not change when we changed the value of primitiveVar2.\
    \ In other words, each variable references an independent value."
  mdcn: "\n## JAVASCRIPT 中的数据\n\n## 什么是数据？\n\n数据是所有编程语言中的一个核心概念。数据可以被看作是在程序中使用的任何信息片段。\n\
    \n## 所有数据都有一个值\n\n任何数据片段都可以说具有一个值。这个值可以是简单的——例如一个数字或一段文本——也可以是复杂的，比如一个数字列表或多个段落。无论数据类型如何，该数据所代表的信息都被称为该数据的“值”。\n\
    \n## 字面量 (Literals)\n\n字面量是直接在脚本中输入且具有特定值的片段。以下都是字面量的示例：`\"Hello World\"`、`true`、`42\
    \ 和 `null`。\n\n## 标识符 (Identifiers)\n\n标识符是一个分配给数据片段（或函数——见第 81 页的“具名函数”）的区分大小写的名称。一旦分配，标识符就可以在脚本中用来引用该数据（或函数）。只要遵守几条基本规则，JavaScript\
    \ 允许你自由选择用作标识符的名称。\n\n```\n3  \n4  myNumberLiteral = 42;\n5  myStringLiteral =\
    \ \"Hello World\";\n6  myBooleanLiteral = true;\n7  myNullLiteral = null;\n8 \
    \ \n9  \n```\n\n*上图：字面量值直接输入到脚本中。*\n\n## 标识符命名规则\n\n- **保留字：** JavaScript 定义了一些对语言具有特殊含义的单词（见第\
    \ 50 页）。这些单词不能用作自定义标识符的名称。\n\n- **首个字符：** 标识符的第一个字符必须是字母、下划线 `_` 或美元符号 `$`。\n\n\
    - **后续字符：** 标识符中的其余字符只能是字母、数字、下划线或美元符号。\n\n```\n1  //合法标识符示例\n2  myValue\n3  _myValue\n\
    4  MY_VALUE\n5  $myValue\n6  my3Value23\n7  my_$_value_23\n8  \n9  //非法标识符示例\n\
    10 23myvalue\n11 myValue*\n12 my-value\n13 #myvalue\n14 my%Value\n15 my4Value\n\
    16 \n```\n\n*右图：第一组标识符全部是合法的（也就是说，是被允许的）标识符，而第二组是非法的。*\n\n## 变量 (VARIABLES)\n\n\
    本质上，变量是计算机内存的一块区域，用于存储数据，并通过标识符来引用。\n\n### 声明变量\n\n在 JavaScript 中声明一个新变量非常简单——我们只需要编写关键字\
    \ `var`，后面跟着我们想要用来引用该变量的标识符。例如：\n\n```\nvar theAnswer;\n```\n\n### 为变量赋值\n\n通常在声明变量的同时为其赋值，如下所示：\n\
    \n```\nvar theAnswer = 42;\n```\n\n### 更改变量的值\n\n一旦使用 `var` 声明了变量，我们可以像这样更改分配给它的值：`theAnswer\
    \ = 54`。请注意，这次我们没有包含 `var` 关键字。\n\n```\n4 //声明变量（不带赋值和带赋值）\n5 var theQuestion;\n\
    6 var theAnswer = 42;\n7\n8 //为已声明的变量赋值\n9 theQuestion = \"Life, the Universe\
    \ and Everything\";\n10\n```\n\n*上图：变量的声明和使用非常简单。*\n\n> **实用技巧**\n>\n> 在 JavaScript\
    \ 中，`=` 不代表等于——它代表赋值（见第 56 页）。\n\n### 获取变量的值\n\n要使用存储在变量中的值，我们在需要使用该值的地方编写该变量的标识符名称。\n\
    \n1. 创建一个新的 HTML 文档并添加常见的结构元素（`<html>`、`<head>` 和 `<body>`）。将文档保存为 `gettingVariables.html`。\n\
