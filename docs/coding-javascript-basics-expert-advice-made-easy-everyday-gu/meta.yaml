  md: '# ADDING A SCRIPT TO A PAGE


    We add scripts to a page by using the <script> HTML element. The type attribute
    of the element must always be "text/javascript". The element should always be
    closed with a closing tag.</script>


    Embedded JavaScript


    To embed a script, we simply write its commands between the opening and closing
    <script> tags. The script is then intrinsically tied to that page, and that page
    alone.


    ```

    1 <!DOCTYPE html>

    2 <html>

    3   <head>

    4     <meta charset="UTF-8">

    5     <title>Untitled Document</title>

    6     <script type="text/javascript">

    7       // Embedded JavaScript code here

    8     </script>

    9     <script type="text/javascript" src="js/myScript.js"></script>

    10    </head>

    11    <body>

    12    </body>

    13  </html>

    ```


    Above: The HTML <script> element can contain an embedded script or link to an
    external script file.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_10_0.png)


    Linked JavaScript


    It is common to link a script to a page. To do this, the script is written in
    a separate text file and saved with a .js filename extension. The script is then
    linked to a page using the src attribute of the <script> element.


    For example:


    ```

    <script

    type="text/javascript"

    src="myScript.js"></script>

    ```


    # WHAT HAPPENS WHEN A BROWSER ENCOUNTERS A SCRIPT?


    > Whenever a web browser loads a page, it deals with each HTML element sequentially
    as it works through the page.


    THE INTERPRETER


    When the browser encounters a <script type="text/javascript"> element, the contents
    of the script are immediately passed to the browser''s JavaScript interpreter
    (known as executing the script). It is the interpreter''s job to make sense of
    the script and instruct the browser to act accordingly. When the interpreter has
    finished executing a script, control is returned to the browser, which then continues
    to process the page.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_10_1.png)'
