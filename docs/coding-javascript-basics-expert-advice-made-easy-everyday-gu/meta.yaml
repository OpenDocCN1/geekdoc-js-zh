- md: "Above: Step 7: Add the code shown here into your HTML document.\n\n- 7. Add\
    \ a new `<script>` element as a child of the `<body>` element – add the code shown\
    \ in the illustration above.\n- 9. Save your work and launch the HTML page in\
    \ Firefox.\n\n## How It Works\n\nThe first `<script>` element is easy enough –\
    \ it links to a script in which we declare objects that represent the questions\
    \ in our quiz, and stores these in an array called `questions`. This array is\
    \ accessible to all scripts in the page, and is defined in the `<head>` so that\
    \ we can be sure it's available when processing the page's `<body>`.\n\nAbove:\
    \ Our quiz is starting to take shape.\n\nNow let's look at the `for` loop in the\
    \ second `<script>` element. The index is initialized to `0`. Then the condition\
    \ `i < questions.length` is evaluated. When `i` is `0` the condition evaluates\
    \ to `true`, so the loop body is executed, and text is written to the page using\
    \ the familiar `document.write()` technique. The important thing to note is that\
    \ we use the loop index, `i`, to access each element of the `questions` array\
    \ in turn.\n\nOnce the statement block has completed, the iteration expression,\
    \ `i++`, is evaluated, adding `1` to the index, and the condition is tested once\
    \ more. The process repeats until the condition evaluates to `false`.\n\n## EXITING\
    \ FROM A LOOP OR ITERATION\n\nWe can exit a loop at any time by writing the `break`\
    \ keyword, causing script execution to resume at the first statement following\
    \ the loop. We can also exit from the current iteration of a loop using `continue`,\
    \ which instructs the interpreter to evaluate the iteration and condition expressions\
    \ immediately, and then continue looping if required.\n\nAbove: The `continue`\
    \ and `break` statements enable us respectively to skip an iteration or exit a\
    \ loop entirely.\n\n## FUNCTIONS & CLASSES\n\n## FUNCTIONS IN JAVASCRIPT\n\n>\
    \ A function is a collection of statements that can be executed by referring to\
    \ an identifier assigned to the function. They are key to creating reusable blocks\
    \ of code that can be called on when needed.\n\n### BUILT-IN FUNCTIONS\n\nJavaScript\
    \ has a number of functions built into the language – in fact, we've already been\
    \ using one: the alert() function. When we use a function's name in a script,\
    \ we are **calling** or **invoking** the function – this is signified by the parentheses\
    \ that follow the function name. Using these parentheses, we can also pass data\
    \ – referred to as **arguments** – to the function.\n\n### Function Arguments\n\
    \nArguments are values that are passed to a function, and which the functions\
    \ can use. For example, with the alert() function call, we place the message string\
    \ that we want the dialogue box to display within the parentheses. Some functions\
    \ need to be passed to more than one argument – in this case, we separate each\
    \ argument with a comma.\n\n### NAMED FUNCTIONS\n\nThere are a couple of techniques\
    \ for creating functions, but the first is easy – we use the function keyword.\
    \ It looks like this:\n\n```javascript\nfunction functionName (parameter_1, parameter_2,\
    \ ... , parameter_n) {\n  statement(s);\n}\n```\n\n```javascript\nfunction showMessageToUser(userName,\
    \ message) {\n  alert(\"Hi \" + userName + \", \" + message);\n}\n\nshowMessageToUser(\"\
    Oliver\", \"Your function is working\");\n```\n\nAbove: A simple function definition\
    \ and a call to that function.\n\n### Hot Tip\n\nWhen passing arguments in a function\
    \ call, they must be listed in the same order as the parameters are listed in\
    \ the function definition.\n\n`functionName` is the name given to the function\
    \ – it must follow the rules for identifier naming (see page 25). The function\
    \ definition can include a comma-separated list of parameters – these are identifiers\
    \ that receive the values passed as arguments in the call to the function, and\
    \ can be used by the statements within the function. A statement block follows\
    \ the parentheses – this is known as the body of the function, and is executed\
    \ whenever the function is invoked.\n\nAbove: function calls assign values to\
    \ the parameters named in the function definition\n\n```javascript\nshowMessageToUser(\"\
    Oliver\", \"Your function is working\");\n```\n\n```javascript\nfunction showMessageToUser(userName,\
    \ message) {\n    alert(\"Hi \" + userName + \", \" + message);\n}\n```\n\n- function\
    \ call\n- arguments / argument values passed to function\n- function name\n- parameter\
    \ names\n- function definition\n\n### Creating a Named Function\n\nIn the previous\
    \ exercise (page 74), we wrote some code that rendered the content of a custom\
    \ question object on the page – let's wrap that in a reusable function.\n\n- 1.\
    \ In your editor, create a new JavaScript file and save it as `quizFunctions.js`\
    \ within the js subfolder of our SimpleQuiz folder.\n- 2. Add the function declaration,\
    \ as shown in the illustration, right. Notice that we've named a single parameter,\
    \ `questionIndex` – the idea is that we will pass an index value as an argument\
    \ when we invoke the function.\n- 3. Open `simpleQuiz.html` in your editor. Add\
    \ a new `<script>` element as a child of the `<head>` element, and set its src\
    \ attribute to \"js/quizFunctions.js\".\n- 4. Locate the for loop in the HTML\
    \ document, then delete all of the statements from the body of the loop and replace\
    \ them with a call to our new function.\n\n```javascript\nfunction renderQuestionAtIndex(questionIndex)\
    \ {\n    //function statements will go here...\n}\n```\n\n```html\n<script type=\"\
    text/javascript\" src=\"js/quizQuestions.js\"></script>\n<script type=\"text/javascript\"\
    \ src=\"js/quizFunctions.js\"></script>\n\n</head>\n\n<body>\n<script type=\"\
    text/javascript\">\n    for(var i = 0; i < questions.length ; i++) {\n       \
    \ renderQuestionAtIndex(i);\n    }\n</script>\n\n</body>\n```\n\nAbove: Step 4,\
    \ Delete the statements and replace them as described in the text above.\n\n##\
    \ RETURNING A VALUE FROM A FUNCTION\n\nWe often want to process the values we\
    \ pass to a function in some way and return the result of that calculation to\
    \ the calling expression—the returned value becomes the value of the function\
    \ call. We do this with the return keyword.\n\n### Using the Return Keyword\n\n\
    When the interpreter encounters return, it ceases processing of the function and\
    \ returns to the calling expression. If the function needs to send a value back\
    \ to the calling expression, we place the value in parentheses following the return\
    \ keyword—for example:\n\n```javascript\nreturn(functionResult);\n```\n\n> **Hot\
