    Strings are text data – don''t worry about why they''re called strings (it gets
    technical in ways we don''t need to worry about); just know that a string is text,
    and text is a string.


    When writing strings into scripts, they have to be surrounded by quotation marks.
    These can be single '' or double " quotes (we''ll be using the latter), but it''s
    vital that a string is closed by the same style of quotation mark that it was
    opened with.


    > **Hot Tip**


    If a string is enclosed by single quotes '', it can contain double quotes ", and
    vice versa.


    An empty string – a string with no characters in it – is normally written as a
    pair of quotation marks.


