  - "[PAGE 34]\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_34_0.png)\n\n# How It Works\n\
    \nThe condition expression of the `if` statement compares the `userAge` value\
    \ against a literal value, 16. Because `userAge` evaluates to 36, and 36 is greater\
    \ than 16, the `if` condition evaluates to `true` and the subsequent expression\
    \ is evaluated.\n\n# The Else Clause\n\nThe basic `if` statement can be expanded\
    \ on via the addition of an `else` clause (we refer to it as a clause because\
    \ it's a subsection of a larger `if` statement, and means nothing outside of an\
    \ `if` statement). The general form is this:\n\n> The opening brace of a statement\
    \ block can be directly following the closing parenthesis of the condition expression,\
    \ or on its own line, or even just before the first statement. It's up to you.\n\
    \n```\nif(condition) {\n    statement(s);\n} else {\n    statement(s);\n}\n```\n\
    \nAbove: The `if` conditional expression evaluates to true, so we see the alert\
    \ message.\n\n# Executing Multiple Statements\n\nThe above form of `if` can only\
    \ execute a single statement when its condition is true, but we often need to\
    \ execute multiple statements. To do this, we add a statement block following\
    \ the condition expression (see Statement Blocks, page 63). The general form looks\
    \ like this:\n\n```\nif(condition) {\n    statement_1;\n    statement_2;\n   \
    \ ...\n    statement_n;\n}\n```\n\nNow, in the event that the condition evaluates\
    \ to `true`, all of the statements within the statement block (the body of the\
    \ `if` statement) are executed.\n\nThe statement block following `else` executes\
    \ when the `if` statement's condition evaluates to `false`. Why not try adding\
    \ an `else` clause to the last coding exercise (page 65)?\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_34_1.png)\n\
    \nAbove: Adding a statement block to an `if` statement.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_34_2.png)\n\
    \nRight: The `else` clause is triggered when the condition expression evaluates\
    \ to false."
  - "[PAGE 35]\n\n# The Else If Clause\n\nWe can introduce a new conditional test\
    \ in the event that the previous test evaluates to false.\n\nThe general form\
    \ looks like this:\n\n```\nif (condition) {\n  statement(s);\n} else if (condition)\
    \ {\n  statement(s);\n}\n```\n\nWe can add as many `else if` clauses as we like,\
    \ and also conclude with a final `else` clause that executes only when all preceding\
    \ conditions evaluate to `false`.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_35_0.png)\n\
    \nAbove: The `else if` clause allows multiple conditional tests in an `if` statement.\n\
    \n# THE SWITCH STATEMENT\n\nUsing `switch` is similar to `if`, but rather than\
    \ testing a condition for true or false, a switch statement selects a block of\
    \ code to execute based on the result of the condition expression. The values\
    \ to test for are specified in `case` sections. The general form is:\n\n```\n\
    switch(condition) {\n  case label_1:\n    statement(s);\n    break;\n  case label_2:\n\
    \    statement(s);\n    break;\n  default:\n    statement(s);\n    break;\n}\n\
    ```\n\n# How a Switch Statement Works\n\nWhen the interpreter encounters a `switch`\
    \ statement, it evaluates the condition expression and then looks in the switch\
    \ block for a `case` label that matches the condition's result. If a match is\
    \ found, all following statements are executed, including those contained in subsequent\
    \ `case` sections.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_35_1.png)\n\nAbove:\
    \ The flow of a `switch` statement.\n\n# NESTING IF STATEMENTS\n\nThe `else if`\
    \ clause creates a branching logical structure that is very common in programming.\
    \ But beware: such structures become increasingly complex with each additional\
    \ branch — we can often avoid them altogether by employing a different conditional\
    \ statement."
  - "[PAGE 36]\n\n# BREAKING FROM A CASE SECTION\n\nIn order to prevent subsequent\
    \ case sections from being executed, we include a break keyword at the end of\
    \ each case. This tells the interpreter to cease processing the statement block\
    \ and resume execution at the first statement following the block.\n\n**Hot Tip**\n\
    \nIf you find that a structure of if-else-if statements is becoming too cumbersome\
    \ to manage, a switch statement may be a more suitable approach.\n\n# DEFAULT\
    \ CASE\n\nA switch statement can contain a special default section that is always\
    \ triggered if encountered. This is typically placed at the end of the switch\
    \ so that it is selected only if no case labels match the condition expression.\n\
    \n# LOOP STATEMENTS\n\nWe often need to run the same set of statements against\
    \ a collection of different values, or repeat statements a certain number of times\
    \ – this is where loops come in.\n\n# WHILE LOOPS\n\nThe simplest form of loop\
    \ statement is known as the while loop. Its general form is:\n\nwhile(condition)\
    \ {\n    statement(s);\n}\n\n**Hot Tip**\n\nCaution: if you code loops incorrectly,\
    \ you may trigger an infinite loop, where the interpreter gets stuck processing\
    \ the same loop statement indefinitely.\n\n```\n<script type=\"text/javascript\"\
    >\n    //Imagine that an object named mediaObject exists on the page.\n    //mediaObject\
    \ could refer to a video file or to an audio file,\n    //but when writing the\
    \ code we don't know which it will be.\n    switch(mediaObject.mediaType) {\n\
    \        case \"video\":\n            alert(\"You are about to access a video\"\
    );\n            //statements that cause the video to load and play\n         \
    \   break;\n        case \"audio\":\n            alert(\"You are about to access\
    \ an audio recording\");\n            //statements that cause the audio to load\
    \ and play\n            break;\n        default:\n            alert(\"Cannot determine\
    \ the media type\");\n    }\n</script>\n```\n\nIf the condition evaluates to true,\
    \ the statement(s) contained in the code block following the condition are executed,\
    \ then the condition is tested again. If still true, the process is repeated.\
    \ This continues until the condition evaluates to false.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_36_0.png)\n\
    \n*Above: This imaginary script shows how a switch statement can be used.*\n\n\
    *Above: The flow of a while loop.*"
  - "[PAGE 37]\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_37_0.png)\n\n# DO WHILE\
    \ LOOPS\n\nThese loops are very similar to `while` loops, except the condition\
    \ is evaluated only after the statement block has been executed. If the condition\
    \ resolves to `true`, the statement block is repeated and the condition evaluated\
    \ once more. Here's how it looks:\n\n```\ndo {\n  statement(s);\n} while(condition);\n\
    ```\n\n# Elements of a For Loop\n\nThe three elements of a `for` loop are expressions\
    \ that control the reiteration of the loop:\n\n+   - **initialize**: This expression\
    \ is evaluated once and creates an initial index for the loop; the index is just\
    \ a number, typically used to count the number of loop iterations that have occurred.\n\
    - **condition**: This is the expression that is tested to see whether the loop\
    \ repeats or not. In most circumstances, the condition expression tests the value\
    \ of the index against some other value, such as an array's length.\n- **iteration**:\
    \ This expression is evaluated after the loop's statement block has been executed,\
    \ and its intended use is to modify the value of the index before the next iteration.\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_37_1.png)\n\n# FOR LOOPS\n\nThe `for`\
    \ loop is often used for processing the elements of an array, because it simplifies\
    \ executing the same statement block against each element in the array.\n\nThe\
    \ `for` loop's declaration can appear a little daunting – let's take a look at\
    \ it before analysing what it means:\n\n```\nfor (initialize ; condition ; iteration\
    \ ) {\n  statement(s);\n}\n```"
