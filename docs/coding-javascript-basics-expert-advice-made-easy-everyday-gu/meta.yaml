  md: "# Choosing a Name for a Namespace\n\nGiven that a namespace's name has to exist\
    \ in the global namespace, it is entirely possible to get a name clash with another\
    \ namespace's name. The trick to avoiding this is to choose a name that nobody\
    \ else is likely to be using. How do you do this? Easy – base the namespace name\
    \ on your website's domain name. Typically, we reverse the name, so if your domain\
    \ name is mydomain.com, your namespace would be com.mydomain. You could then extend\
    \ this further with a per-application and/or per-module name – for example, com.mydomain.myApplication.\n\
    \n> **Hot Tip**\n\nIt is important to understand that a namespace name does not\
    \ refer to a page or web resource – it's just a name.\n\n# Global scope namespace\n\
    \nGlobal identifiers and named functions\n\n**com**\n\n**com.mydomain**\n\nidentifiers\
    \ that refer to the functions and values used by your scripts\n\n**com.otherdomain**\n\
    \nIdentifiers that refer to the functions and values defined by 3rd party scripts\
    \ that are attached to your page. They have their own namespace so won't clash\
    \ with your names.\n\nAbove: JavaScript simulates 'namespaces' using objects.\
    \ Reversing your domain name is the best way to ensure your names don't clash\
    \ with others.\n\n# Creating a Namespace\n\nLet's create a namespace for the objects\
    \ in our Simple Quiz project.\n\n+   1. Open quizQuestions.js in your editor and\
    \ create a couple of empty lines at the top of the document.\n\n+   2. We're going\
    \ to use com.flameTreepublishing as our namespace – this means we need to create\
    \ an object called com inside the global namespace and another called flameTreepublishing\
    \ inside the com object.\n\n+   3. Copy the code shown in the illustration (right).\
    \ After declaring – but not initializing – com, we test that each namespace object\
    \ does not exist before initializing it (see Logical NOT Operator, page 57). This\
    \ is to avoid initializing an existing namespace.\n\n+   4. Now we'll adapt the\
    \ rest of the script so that it uses the new namespace – see the un-dimmed sections\
    \ of the illustration, right.\n\n```\n1 var com;\n2 if(!com) {\n3   com = {};\n\
    4 }\n5 if(!com.flameTreepublishing) {\n6   com.flameTreepublishing = {};\n7 }\n\
    ```\n\nAbove: Step 3: Copy the code shown here into your editor.\n\n```\n9  con.flameTreepublishing.questions\
