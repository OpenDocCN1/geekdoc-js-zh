  md: 'However, this class definition is not an object of that class – – to create
    one of those, we must call the class''s **constructor** function, because it is
    this that generates an object from the class definition. This generated object
    is known as an **instance** of the class, so the act of calling the class constructor
    is often referred to as **instantiating** the class.


    # A Massive Topic


    OOP is a very deep subject that we aren''t going to delve into – if it''s something
    you want to explore, Google ''OOP'' and take your pick from the thousands of results.


    What we are going to do, though, is find out how to create and use basic custom
    classes in JavaScript.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_50_0.png)


    # JAVASCRIPT CLASSES


    We''ve already been working with JavaScript classes – **number**, **string** and
    **array** are all built-in classes. They all inherit some of their characteristics
    from the **object** class – in OOP parlance, this makes **object** the **superclass**
    of those other classes.


    We''ve also been working with class methods: for example, `write` is a method
    of the HTMLDocument class – we''ve used it as `document.write()`. (`document`
    is an instance of the HTMLDocument class.) These classes are built into the language,
    but we can also build our own.


    # Defining a Custom Class


    The questions in our Simple Quiz application are currently defined in generic
    objects – let''s develop a **QuizQuestion** class instead.


    +   1. Create a new JavaScript document and save it in your Simple Quiz''s **js**
    folder as **QuizQuestion.js**. Also create a `<script>` element in the `<head>`
