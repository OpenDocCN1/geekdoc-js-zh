  md: "# CONDITIONAL STATEMENTS\n\nWe often need to execute different statements based\
    \ upon conditions that do not exist until a page has been loaded into a browser,\
    \ and a user is interacting with it. This is when we reach for conditional statements.\n\
    \n# IF STATEMENTS\n\nWith if, we test for the existence of a condition and then\
    \ execute expressions should that condition exist. Its basic form looks like this:\n\
    \n```\nif (condition) expressions;\n```\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_33_0.png)\n\
    \nAbove: Flowchart of a simple if statement\n\n# USING IF STATEMENTS\n\nWhen the\
    \ interpreter encounters an if statement, it evaluates the expression contained\
    \ inside the parentheses. In the event that the expression evaluates to true,\
    \ the statement following the if is executed.\n\n# How an If Statement Works\n\
    \nLet's see how an if statement works using a simple example:\n\n+   1. Create\
    \ a new HTML document and enter the standard structural elements. Save the page\
    \ as ifExample.html.\n\n+   2. Create a new `<script>` element as a child of (i.e.\
    \ inside) the `<head>` element. We're declaring it in the `<head>` to ensure it's\
    \ available before the `<body>` element is rendered.\n\n+   3. Add a simple variable\
    \ declaration into this `<script>` element: var userAge = 36;. Although we've\
    \ manually assigned a value to this variable, imagine that the user had actually\
    \ provided this information. See the illustration, right.\n\n+   4. Add another\
    \ `<script>` element, this time as the child of the `<body>` element. Copy into\
    \ this new `<script>` element the code shown in the illustration below.\n\n+ \
    \  5. Save your work and then open ifExample.html in Firefox.\n\n```\n1 <!DOCTYPE\
    \ HTML>\n2 <html>\n3   <head>\n4     <title>If Example</title>\n5   \n6     <script\
    \ type=\"text/javascript\">\n7       var userAge = 36;\n8     </script>\n9   \n\
    10  </head>\n```\n\nAbove: Step 3: Here you add a simple variable declaration.\n\
    \n```\n12  <body>\n13    <script type=\"text/javascript\">\n14      if(userAge\
    \ > 16) alert(\"This is a kids zone - not for grown ups.\");\n15    </script>\n\
    16  \n17  </body>\n```\n\nAbove: Step 4: Use the code as described in the text\
    \ above."
  merge: -1
