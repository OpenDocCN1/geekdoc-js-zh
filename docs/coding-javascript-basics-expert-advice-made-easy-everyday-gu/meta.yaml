    \n## 匿名函数\n\n在 JavaScript 中，函数只是另一种形式的数据。这意味着你可以创建一个函数并将其赋值给变量或对象属性。此类函数被称为**匿名函数**，因为它们没有函数名称。\n\
    \n### 声明匿名函数\n\n我们通过将函数字面量赋值给变量或对象属性来声明匿名函数。其通用形式如下：\n\n```javascript\nvar myAnonymousFunction\
    \ = function(parameter(s)) {\n    statement(s);\n}\n```\n\n### 调用匿名函数\n\n调用匿名函数与调用具名函数没有区别：我们只需使用变量名或属性引用来代替函数名。在实际操作中，这与调用具名函数完全相同。\n\
    \n```javascript\n//这是一个具名函数...\nfunction calculateRectArea(rectWidth, rectHeight)\
