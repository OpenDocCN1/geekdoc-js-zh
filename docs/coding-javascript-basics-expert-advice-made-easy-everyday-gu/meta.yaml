  md: "# YOUR FIRST SCRIPT\n\n+   1. Create a new HTML file and add the basic structural\
    \ elements `<html>`, `<head>` and `<body>`. Save the file in a convenient location,\
    \ and call it myFirstScript.html.\n\n2. Add a `<script>` element to the `<body>`\
    \ element. For this example, we want to place the opening and closing tags on\
    \ separate lines, with an empty line in between.\n\n3. Type the following command\
    \ within the script element: `document.write(\"<p>Hello World!</p>\");`. This\
    \ command outputs text to a page, just as though we'd typed it directly into the\
    \ page (which is why we've also included the `<p>` element tags).\n\n4. Save the\
    \ page and then open it in Firefox, either by double-clicking the file or by right-clicking\
    \ it and selecting 'Open with', then Firefox.\n\n> Hot Tip\n\nWe often use the\
    \ terms 'code' and 'coding' – the former refers to the text that you type into\
    \ a script, while the latter refers to the process of writing scripts.\n\n```\n\
    <!DOCTYPE HTML>\n<html>\n  <head>\n    <title>My First Script</title>\n  </head>\n\
    \n  <body>\n\n    <script type=\"text/javascript\">\n      document.write(\"<p>Hello\
    \ World!</p>\");\n    </script>\n\n  </body>\n</html>\n```\n\n# How it Works\n\
    \nCongratulations – you've just written and executed your first水珠ript. The script\
    \ was passed to the interpreter when the browser encountered the `<script>` element.\
    \ The interpreter recognized the document.write command, and wrote the text contained\
    \ in the brackets (or, in programming parlance, parentheses) to the page. The\
    \ text had to be contained in quotation marks for the interpreter to recognize\
    \ it as text – if all you see is a blank page, chances are you've missed the quotation\
    \ marks.\n\n> Hot Tip\n\nIt is traditional for books about programming languages\
    \ to use 'Hello World!' as the output from the first exercise in the book – you\
    \ are now officially initiated into the ranks of the developer!\n\nRight: You\
    \ have passed the initiation test – welcome aboard!\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_11_0.png)"
