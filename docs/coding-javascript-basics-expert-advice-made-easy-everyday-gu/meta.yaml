  md: '# Event Handlers


    Typically, when an event listener is triggered, the expression it executes is
    a function or method call. The function or method being called is referred to
    as an event handler. It is the event handler''s job to deal with the event in
    some way – making visual changes, sending data to a server, and so on.


    # Adding an Event Handler


    Our Simple Quiz application needs to be able to respond to the user clicking on
    an answer – let''s define an event handler as a first step.


    1. Open SimpleQuiz.js. We''re going to create a new method called clickHandler
    – move to the bottom of the document and add the method as shown in the illustration
    below.


    ```

    59

    60 com.flamtreepublishing.SimpleQuiz.prototype.clickHandler = function(e) {

    61   //click handler statements go here

    62 }

    63

    64

    ```


    Above: Step 1. Add the method as shown here.


    2. When using the W3C event model, the event handler is always passed an object
    containing details about the event – our method captures this as the parameter
    `e`. By doing this, we can access the element on which the event occurred by referencing
    `e.target` as in the illustration below.


    ```

    59

    60 com.flamtreepublishing.SimpleQuiz.prototype.clickHandler = function(e) {

    61   var clickedAnswerId = e.target.id;

    62 }

    63

    ```


    Above: Step 2. e.target references the HTML element that triggered the event.


    3. We need to identify the answer that was clicked – this is why our code defines
    an id value for each answer''s `<p>` element. Each answer''s id is the answer
    index prefixed by the letter


    ```

    59

    60 com.flamtreepublishing.SimpleQuiz.prototype.clickHandler = function(e) {

    61   var clickedAnswerId = e.target.id;

    62

    63

    64

    65 }

    ```


    Above: Step 3. This code confirms which answer has been clicked.


    ''a'', so we need to access just the second character of the id; we cast this
    second character to a number because we are going to use it as an index of the
    questions array. See the illustration above.


    4. Note the use of the substr() method of the String class, which enables us to
    access a section of the string it is called on. The first parameter is the character
    position that the section starts on (zero-based, like an array index); the second
    is the length of the section to return.


    ```

    var clickedAnswerIndex = Number(clickedAnswerId.substr(1, 1));

    ```


    Above: Step 4. substr() is a method of the String class.


    5. Our event handler also needs to know the question number – we can extract this
    from the `<div>` element''s id attribute. We can access the `<div>` by referencing
    `e.target.parentNode` (the `<div>` is the parent of the `<p>`) as in the illustration
    below.


    ```

    62   var clickedAnswerIndex = Number(clickedAnswerId.substr(1, 1));

    63   var clickedQuestionId = e.target.parentNode.id;

    64   var clickedQuestionNum = Number(clickedQuestionId.substr(1, 1));

    65 }

    ```


    Above: Step 5. Extract the question number that has been answered from the event
    object.'
