    ;\n15     \n16     </script>\n17 </body>\n```\n\n*上图：步骤 2：将此处显示的代码输入到你的 HTML 文档中*\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_21_0.png)\n\n*上图：所有 JavaScript 对象都构建在对象数据类型之上。*\n\
    \n2. 输入上方插图所示的代码。这使用了 `new` 关键字来创建一个空对象，然后在该对象上声明了一系列属性。\n\n3. 输入下方插图所示的新代码，其中我们使用对象字面量表示法创建了一个对象：每个属性名后面跟着一个冒号和一个值；属性-值对由逗号分隔；整个字面量包裹在大括号（`{}`）中。\n\
    \n## 创建对象\n\n我们可以通过声明对象字面量或使用 `new` 关键字来创建对象——让我们两种方法都试一下。\n\n```\n13        \
    \ quizQuestion1.wrongAnswer2 = \"49,000,000 miles\";\n14         quizQuestion1.wrongAnswer3\
    \ = \"150,000 miles\";\n15     \n16     var quizQuestion2 = {\n17         question:\
    \ \"How many planets orbit the Sun?\",\n18         answer: \"8\",\n19        \
    \ wrongAnswer1: \"6\",\n20         wrongAnswer2: \"7\",\n21         wrongAnswer3:\
    \ \"9\"\n22     };\n23     \n24     </script>\n```\n\n1. 创建一个包含通用结构元素的新 HTML 文档。在\
    \ body 元素的子级添加一个 `<script type=\"text/javascript\">` 元素，然后将文档保存为 `javascriptObjects.html`。\n\
    \n*上图：步骤 3：输入此处高亮显示的代码*\n\n4. 最后，我们再次声明一个对象字面量——但这一次是一个空对象，可用于存储我们创建的对象中问题的答案。请参阅下图。\n\
    \n```\n15 var quizQuestion2 = {\n16     question: \"How many planets orbit the\
    \ Sun?\",\n17     answer: \"8\",\n18     wrongAnswer1: \"6\",\n19     wrongAnswer2:\
    \ \"7\",\n20     wrongAnswer3: \"9\"\n21 };\n22\n23 var userAnswers = {};\n24\n\
    25 </script>\n26 </body>\n27 </html>\n```\n\n*上图：步骤 4 此处，你将创建一个空对象。*\n\n5. 保存你的工作。如果你在\
    \ Firefox 中启动此页面，你不会看到任何视觉输出，但这没关系——目前，这更多是一次编码和思考练习，但随着进度的推进，我们将在此基础上进行构建。\n\n\
    6. 请注意，我们在两个 `quizQuestion` 对象中创建了相同的属性名结构——以这种方式创建和重用对象结构是面向对象编程的核心原则，我们将在第 95\
    \ 页讨论该内容。\n\n> **实用技巧**\n> 管理属性名的规则与所有标识符的规则相同——见第 25 页。\n\n```\n23 var userAnswers\
    \ = {};\n24\n25\n26\n27 alert(quizQuestion1.question);\n28 alert(quizQuestion2.question);\n\
    29\n30 </script>\n31 </body>\n32 </html>\n33\n```\n\n*上图：访问存储在对象属性中的值非常简单。*\n\n\
    ## 访问对象属性\n\n如果我们有一个对象 `myObject`，并在其上定义了一个属性 `myProperty`，我们可以通过输入 `myObject.myProperty`\
    \ 来访问该属性。`.` 被称为点运算符（见第 53 页）。\n\n## 数据类型转换\n\n在很多情况下，你需要在一个类型的上下文中还原另一个类型的值。例如，你可能希望使用数字的字符串表示（用\
    \ `\"42\"` 代替 `42`），或者你可能需要在布尔值的上下文中运行一个数字。这种在数据类型之间进行翻译的操作被称为数据类型转换（data type\
    \ casting）。\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_22_0.png)\n\n## 隐式转换\n\
    \nJavaScript 在管理数据类型方面非常主动，它会根据数据被使用的上下文自动在类型之间进行转换（示例见第 55 页）。\n\n## 显式转换\n\n\
    我们也可以显式地转换某些数据类型，最常用于字符串和数字之间的转换。例如，要将数字转换为字符串，我们会写 `String(42)`，结果为 `\"42\"`。反之，要将字符串转换为数字，我们会写\
    \ `Number(\"42\")`，结果为 `42`。\n\n```\n1 var myNumber = 42;\n2 var myString = \"\
    549\";\n3 var myName = \"Sajid\";\n4\n5 var test1 = myNumber + myString;\n6 alert(test1);\
    \ //Shows '42549' in the alert box\n7\n8 var test2 = myNumber + Number(myString);\n\
    9 alert(test2); //Shows '591' in the alert box\n10\n11 var test3 = myString +\
    \ myName;\n12 alert(test3); //Shows '549Sajid' in the alert box\n13\n14 var test4\
    \ = myNumber + Number(myName);\n15 alert(test4); //Shows 'NaN' in the alert box\n\
    16\n17 var test5 = String(myNumber) + myName;\n18 alert(test5); //Shows '42Sajid'\
    \ in the alert box\n19\n20\n```\n\n*上图：这段代码重点展示了我们如何以及为什么要显式地在数据类型之间进行转换。*\n\n\
    ## 特殊的 NaN 数字\n\n并非所有值都能转换为数字——例如，字符串 `\"foo\"` 没有数字含义。\n\n如果我们把这个字符串转换为数字，我们将得到结果\
    \ `NaN`（Not a Number，非数字）。尽管名字如此，它确实是一个数字，并且可以在任何允许或期望出现数字的地方使用。然而，任何包含 `NaN`\
    \ 的计算结果本身永远是 `NaN`。\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_23_0.png)\n\n\
    ## 不同数据类型转换的结果\n\n此表显示了不同数据类型之间转换的结果。阅读此表的方式为“从行标题转换为列标题”。\n\n| | Boolean (布尔值)\
    \ | number (数字) | string (字符串) |\n|---|---|---|---|\n| Boolean | - | false 是 0,\
    \ true 是 1 | false 是 \"false\", true 是 \"true\" |\n| number | 0 是 false, 其余为 true\
    \ | - | 数字的字符串表示 |\n| string | \"\" 是 false, 其余为 true | 字符串的数字表示或 NaN | - |\n\
    | null | false | 0 | \"null\" |\n| undefined | false | NaN | \"undefined\" |\n\
    | array (数组) | true | 空数组是 0, 包含元素的数组是 NaN | 元素值的逗号分隔列表 |\n| object (对象) | true\
    \ | NaN | \"[object Object]\" |\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_24_0.png)\n\
    \n## JAVASCRIPT 语法\n\n一个脚本可以由单条指令组成，也可以是一本包含数千行代码的巨著。但无论规模如何，JavaScript 中的所有脚本都共享一个共同的结构和语法。\n\
    \n## 区分大小写\n\n首先要注意的是，JavaScript 是区分大小写的，即小写字符被认为与其对应的大写字符不同。例如，标识符 `\"myVariable\"\
    ` 与 `\"MyVariable\"` 不同（请注意不同的首字母大写）。\n\n```\n00 com.flamerepublishing.simpleQuiz.prototype.addQuestion\
    \ = function() {\n01   // QUESTION 1\n02   this.questions.push(\n03     new com.flamerepublishing.QuizQuestion(\n\
    04       1,\n05       \"Approximately how far away from the Earth is the Sun?\"\
    ,\n06       [\"200 miles\", \"93,000,000 miles\", \"49,000,000 miles\", \"150,000\
    \ miles\"],\n07       1\n08     )\n09   );\n10   // QUESTION 2\n11   this.questions.push(\n\
    12     new com.flamerepublishing.QuizQuestion(\n13       2,\n14       \"How many\
    \ planets are there in our Solar System?\",\n15       [\"6\", \"7\", \"8\", \"\
    9\"],\n16       2\n17     )\n18   );\n19   // QUESTION 3\n20   this.questions.push(\n\
    21     new com.flamerepublishing.QuizQuestion(\n22       3,\n23       \"Which\
    \ of these is a Moon of Jupiter?\",\n24       [\"Ganymede\", \"Miranda\", \"Enceladus\"\
    , \"Mars\"],\n25       0\n26     )\n27   );\n28 }\n```\n\n*上图：缩进的代码更容易阅读，因为它有助于在视觉上将相关代码段分组。*\n\
    \n## 空格\n\nJavaScript 忽略前导空格和制表符（tabs）。这使我们能够在代码中使用缩进，这是一种有助于使代码更有组织且更具可读性的技巧。\n\
    \n## 分号\n\nJavaScript 语句通常以分号 (;) 结尾，但并非必须。在省略分号的地方，解释器会假设换行符标志着语句的结束。然而，省略分号可能会导致代码出现歧义，因此最佳实践是为每个语句加上分号结尾。\n\
    \n```\n1  //Inline comments start with '//' and end at the next line break\n2\n\
    3  var userScore = 0; //They can be written on the same line as other code\n4\n\
    5  //alert(userScore); //They can also be used to disable lines of code\n6\n7\n\
    8\n```\n\n*上图：行内注释在注释后的换行符处结束。*\n\n## 注释\n\n注释是脚本中被解释器忽略的部分。注释用于给脚本添加笔记和解释，帮助他人理解，并在编写数月后重新审视脚本时作为自己的笔记。\n\
    \n### 行内注释\n\n行内注释以 `//` 开始，一直持续到下一个换行符。它们可以单独占据一行，也可以紧跟在其他 JavaScript 代码之后。\n\
    \n> **实用技巧：** 注释通常用于禁用脚本的部分内容——这在尝试新想法或试图寻找漏洞（bugs）时非常有用。\n"
