  - '[PAGE 25]


    # JAVASCRIPT SYNTAX


    A script can consist of a single instruction or it can be an epic tome containing
    thousands of lines of code. No matter the size though, all scripts in JavaScript
    share a common structure and syntax.


    # CASE SENSITIVITY


    The first thing to note is that JavaScript is case sensitive, i.e. lower-case
    characters are considered to be distinct from their upper-case counterparts. For
    example, the identifier `"myVariable"` is not the same as `"MyVariable"` (notice
    the different capitalizations).


    ```

    00 com.flamerepublishing.simpleQuiz.prototype.addQuestion = function() {

    01   // QUESTION 1

    02   this.questions.push(

    03     new com.flamerepublishing.QuizQuestion(

    04       1,

    05       "Approximately how far away from the Earth is the Sun?",

    06       ["200 miles", "93,000,000 miles", "49,000,000 miles", "150,000 miles"],

    07       1

    08     )

    09   );

    10   // QUESTION 2

    11   this.questions.push(

    12     new com.flamerepublishing.QuizQuestion(

    13       2,

    14       "How many planets are there in our Solar System?",

    15       ["6", "7", "8", "9"],

    16       2

    17     )

    18   );

    19   // QUESTION 3

    20   this.questions.push(

    21     new com.flamerepublishing.QuizQuestion(

    22       3,

    23       "Which of these is a Moon of Jupiter?",

    24       ["Ganymede", "Miranda", "Enceladus", "Mars"],

    25       0

    26     )

    27   );

    28 }

    ```


    Above: Indented code is easier to read because it helps to group sections of related
    code visually.


    # WHITE SPACE


    Leading spaces and tabs are ignored in JavaScript. This enables us to use code
    indenting in our code, which is a technique that helps make the code more organized
    and human-readable.


    # SEMICOLONS


    JavaScript statements are normally terminated by a semicolon (;) but do not have
    to be. Where semicolons are omitted, the interpreter assumes line breaks mark
    the end of a statement. However, omitting semicolons can lead to ambiguity in
    your code, so best practice is to terminate every statement with a semicolon.


    ```

    1  //Inline comments start with ''//'' and end at the next line break

    2

    3  var userScore = 0; //They can be written on the same line as other code

    4

    5  //alert(userScore); //They can also be used to disable lines of code

    6

    7

    8

    ```


    Above: Inline comments end at the line break that follows the comment.


    # COMMENTS


    A comment is a section of script that is ignored by the interpreter. Comments
    are used for adding notes and explanations to scripts, helping others understand
    them, and acting as notes-to-self when revisiting a script months after writing
    it.


    # Inline Comments


    An inline comment starts with // and continues until the next line break. They
    can be placed on their own line or on a line following other JavaScript code.


    Hot Tip: Comments are commonly used to disable sections of a script - very useful
    when experimenting with new ideas or attempting to hunt down bugs.'
- md: "## EXPRESSIONS AND OPERATORS\n\nThe instructions you write in scripts are made\
    \ up of expressions. Typically, expressions use operators to manipulate data in\
    \ some way.\n\n### WHAT IS AN EXPRESSION?\n\nAn expression is any segment of code\
    \ that the interpreter can evaluate, typically yielding a value. This grandiose\
    \ description belies how simple the concept is — consider the following: 42. Strictly\
    \ speaking, as well as being a literal, this is also an expression — the interpreter\
    \ can evaluate it, yielding the decimal value 42. Admittedly, it isn’t much of\
    \ an expression — it’s the scripting equivalent of walking into a colleague and\
    \ saying “42”; she will understand that you’ve stated a value, but she won’t have\
    \ a clue what you expect her to do with it.\n\n```\n1 42\n2 2\n3 \"Hello World\"\
    \n4 true\n5 null\n6 null\n```\n\n### Block Comments\n\nA block comment starts\
    \ with `/*` and continues until a closing `*/` occurs. Everything between these\
    \ markers is considered part of the comment.\n\n### KEYWORDS AND RESERVED WORDS\n\
    \nJavaScript defines a set of predefined identifiers, called keywords, as well\
    \ as other identifiers that may not be incorporated into the language in the future.\
    \ Collectively, these are known as reserved words, and you must not use these\
    \ names as names for your own identifiers (nor as property names within objects).\n\
    \n```javascript\n/* These are line comments, which start with //\n// Until the\
    \ end-of-line character (\\n) is found.\n// This is a line comment. This is a\
    \ \"line comment\".\n\n/* This is a block comment; astronomers call this a\n\"\
    multi-line comment\" because it can span a line break (\\n)\n* We can include\
    \ block comments anywhere we like\n* They may appear in the middle of a statement,\
    \ either\n* when commenting out the code, or where labeling\n* the code. */\n\n\
    // You can also define different styles in the same document.\n\n/* Let's use\
    \ this style for expressions that return a value: */\nthis.result = document.createElement(\"\
    div\");\nthis.result = render(data);\n\n/* And this style for statements that\
    \ return nothing: */\nthis.container = window.body;\nthis.container.appendChild(this.result);\n\
    \n/* And this style for logic: */\nthis.value = 42;\n\n/* And this style for helper\
    \ functions: */\nthis.update = () => {\n\tsetinnerWidth(this.container);\n\tsetinnerWidth(this.result);\n\
    };\n\n/* And this style for documentation: */\ncode.title = \"Example\";\n```\n\
    \n| KEYWORDS | RESERVED WORDS |\n| :--- | :--- |\n| break, case, catch, continue,\
    \ default, delete, do, else, false, finally, for, function, if, in, instanceof,\
    \ new, null, return, switch, this, throw, true, try, typeof, var, void, while,\
    \ with | abstract, boolean, byte, char, class, const, debugger, double, enum,\
    \ export, extends, final, float, goto, implements, import, int, interface, long,\
    \ native, package, private, protected, public, short, static, super, synchronized,\
    \ throws, transient, volatile |\n\n## Becoming More Expressive\n\nNow consider\
    \ the expression 38 + 4. This time, when evaluating the expression, the interpreter\
    \ adds 38 and 4 – the result is the same as our previous example (the value 42),\
    \ but we have achieved something by summing the two values.\n\nSticking with our\
    \ analogy, you have said to your colleague '38 plus 4', to which she has replied\
    \ '42'. The thing that made the difference was the inclusion of the addition operator,\
    \ +.\n\n### WHAT IS AN OPERATOR?\n\nAs we've just seen, for an expression to have\
    \ meaning, it typically includes an operator; the operator defines how the data\
    \ within the expression should be evaluated in order to obtain a value for the\
    \ expression.\n\n### Operands\n\nIn the context of operators, the value(s) being\
    \ processed are referred to as operands. Many operators expect two operands, one\
    \ on either side of the operator (referred to as the left and right operands).\
    \ Others – called unary operators – work with only a single operand, while still\
    \ fewer work with three or more operands.\n\n## A PLETHORA OF OPERATORS\n\nThere\
    \ are many different JavaScript operators – too many to cover here – so let's\
    \ stick with the most common ones.\n\n### The Dot Operator\n\nWe've already met\
    \ the dot operator \".\" – it enables us to access the properties (and methods\
    \ – see page 102) of objects. The left operand is a reference to an object, while\
    \ the right one is the name of a property or method of that object.\n\n```javascript\n\
    1  38 + 4\n2  \n3  \"Hello \" + \"World\"\n4  \n5  myVariable = true\n6  \n7 \
    \ quizQuestion.questionText\n8  \n9  getMyValue()\n10 \n11 myObject.doSomething()\n\
    ```\n\nAbove: Operators give meaning and purpose to expressions.\n\nAbove: Operands\
    \ are the values that an operator will, in turn, operate on.\n\n### Arithmetic\
    \ Operators\n\nAn arithmetic operator performs arithmetic using the supplied operand(s)\
    \ and returns the result of that calculation. The operands must be numbers, or\
    \ expressions that evaluate to numbers.\n\n> **Hot Tip**\n> Go to https://en.wikibooks.org/wiki/JavaScript\
    \ Operators to find a complete list of JavaScript's operators.\n\n| Operator |\
    \ Number of operands | Name | Action | Example (result in brackets) |\n|---|---|---|---|---|\n\
    | `+` | 2 | addition | Sums the left and right operands | 4 + 5 (9) |\n| `-` |\
    \ 2 | subtraction | Subtracts the right operand from the left operand | 31 - 14\
    \ (17) |\n| `*` | 2 | multiplication | Multiplies the left and right operands\
    \ | 12 * 3 (36) |\n| `/` | 2 | division | Divides the left operand by the right\
    \ operand | 12 / 3 (4) |\n| `++` | 1 | increment | Adds 1 to the value of the\
    \ identifier that is the single operand | multipliers++ (multipliers increases\
    \ by 1) |\n| `--` | 1 | decrement | Subtracts 1 from the value of the identifier\
    \ that is the single operand | multipliers-- (multipliers decreases by 1) |\n\n\
    ### String Operators\n\nThere are a few different operators that can work in strings,\
    \ but only one dedicated to strings:\n\n| Operator | Name | Action | Example (result\
    \ in brackets) |\n|---|---|---|---|\n| `+` | concatenation | Joins two strings\
    \ together, returning the resulting string | \"Hello \" + \"World\" (\"Hello World\"\
    ) |\n\nNote that the concatenation operator looks the same as the addition operator\
    \ – the interpreter deduces which operator is intended based on the data types\
    \ of the operands. If both operands evaluate to numbers, it is addition; if either\
    \ operand evaluates to a string, then it is concatenation. Furthermore, if an\
    \ operand of the concatenation operator evaluates to a number, it is cast to a\
    \ string (see Data Type Casting, page 43).\n\n> **Hot Tip**\n> Where our tables\
    \ do not list Number of operands assume that these are binary operators – that\
    \ is, they expect two operands.\n\n### Assignment Operator\n\nWe've already met\
    \ this operator, whose left operand is always a variable or property reference,\
    \ and whose right operand can be any literal, identifier or expression.\n\n| Operator\
    \ | Name | Action | Example (result in brackets) |\n| :--- | :--- | :--- | :---\
    \ |\n| `=` | assignment | Assigns the value of the right operand to the variable\
    \ or property indicated by the left operand | `myRef = 42` (myRef now has a value\
    \ of 42) |\n\n### Equality Operators\n\nThese operators compare two operands and\
    \ return either true or false (see Booleans, page 331). The operands can be of\
    \ any data type.\n\n> **Hot Tip**\n> Be sure that you fully understand the difference\
    \ between the assignment, `=`, and equality, `==`, operators.\n\n| Operator |\
    \ Name | Action | Example (result in brackets) |\n| :--- | :--- | :--- | :---\
    \ |\n| `==` | equality | Returns true if the two operands are equal, otherwise\
    \ false | `4 == 2` (false) |\n| `!=` | inequality | Returns true if the two operands\
    \ are not equal, otherwise false | `4 != 2` (true) |\n\n### Comparison Operators\n\
    \nAs the name suggests, comparison operators compare two operands and return either\
    \ true or false. The operands can be of any data type.\n\n| Operator | Name |\
    \ Action | Example (result in brackets) |\n| :--- | :--- | :--- | :--- |\n| `<=`\
    \ | less than or equal | Returns true if the left operand's value is less than\
    \ or equal to the right operand's value, otherwise false | `52 < 20` (false) <br>\
    \ `15 < 19` (true) |\n| `>=` | greater than or equal | Returns true if the left\
    \ operand's value is greater than or equal to the right operand's value, otherwise\
    \ false | `52 > 20` (true) <br> `12 > 350` (false) |\n\n### Logical Operators\n\
    \nLogical operators compare values and then return either true or false. The operands\
    \ are cast to Booleans if required.\n\n| Operator | Number of operands | Name\
    \ | Action | Example (result in brackets) |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n| `&&` | 2 | logical AND | Returns true if both operands evaluate to true,\
    \ otherwise false | `true && false` (false) |\n| `||` | 2 | logical OR | Returns\
    \ true if either operand evaluates to true, otherwise false | `true || false`\
    \ (true) |\n| `!` | 1 | logical NOT | Placed before a single operand, inverts\
    \ the Boolean value of the operand | `!true` (false) |"
  mdcn: "\n## 表达式与运算符\n\n你在脚本中编写的指令由表达式构成。通常，表达式使用运算符以某种方式处理数据。\n\n### 什么是表达式？\n\n\
    表达式是解释器可以求值的任何代码片段，通常会产生一个值。这个宏大的描述掩盖了概念的简单性——考虑以下内容：42。严格来说，除了是一个字面量之外，它也是一个表达式——解释器可以对其进行求值，得到十进制值\
    \ 42。诚然，这算不上多么了不起的表达式——它相当于脚本世界中你走向一位同事说\"42\"；她会理解你陈述了一个值，但她完全不知道你希望她对此做什么。\n\
    \n```\n1 42\n2 2\n3 \"Hello World\"\n4 true\n5 null\n6 null\n```\n\n### 块注释\n\n\
    块注释以 `/*` 开头，持续到出现闭合的 `*/` 为止。这两个标记之间的所有内容都被视为注释的一部分。\n\n### 关键字和保留字\n\nJavaScript\
    \ 定义了一组预定义的标识符，称为关键字，以及其他将来可能不会被纳入语言的标识符。这些统称为保留字，你*绝不能*将这些名称用作自己的标识符（也不能用作对象中的属性名）。\n\
    \n```javascript\n/* 这些是行注释，以 // 开头\n// 直到找到行尾字符 (\\n)。\n// 这是行注释。这是\"行注释\"。\n\n\
    /* 这是块注释；天文学家称之为\n\"多行注释\"，因为它可以跨行 (\\n)\n* 我们可以在任何地方包含块注释\n* 它们可能出现在语句中间，无论是\n\
    * 注释掉代码时，还是在标注\n* 代码时。*/\n\n// 你也可以在同一文档中定义不同的样式。\n\n/* 我们对返回值的表达式使用这种样式：*/\n\
    this.result = document.createElement(\"div\");\nthis.result = render(data);\n\n\
    /* 对不返回值的语句使用这种样式：*/\nthis.container = window.body;\nthis.container.appendChild(this.result);\n\
    \n/* 对逻辑使用这种样式：*/\nthis.value = 42;\n\n/* 对辅助函数使用这种样式：*/\nthis.update = () =>\
    \ {\n\tsetinnerWidth(this.container);\n\tsetinnerWidth(this.result);\n};\n\n/*\
    \ 对文档使用这种样式：*/\ncode.title = \"Example\";\n```\n\n| 关键字 | 保留字 |\n| :--- | :---\
    \ |\n| break, case, catch, continue, default, delete, do, else, false, finally,\
    \ for, function, if, in, instanceof, new, null, return, switch, this, throw, true,\
    \ try, typeof, var, void, while, with | abstract, boolean, byte, char, class,\
    \ const, debugger, double, enum, export, extends, final, float, goto, implements,\
    \ import, int, interface, long, native, package, private, protected, public, short,\
    \ static, super, synchronized, throws, transient, volatile |\n\n## 更具表达力\n\n现在考虑表达式\
    \ 38 + 4。这次，在对表达式求值时，解释器将 38 和 4 相加——结果与我们之前的例子相同（值为 42），但我们将两个值相加后实现了某种效果。\n\n\
    沿用我们的类比，你对你的同事说\"38 加 4\"，她回答\"42\"。产生区别的是加法运算符 + 的引入。\n\n### 什么是运算符？\n\n正如我们刚才所见，表达式要具有意义，通常需要包含运算符；运算符定义了表达式中的数据应如何求值，以获得表达式的值。\n\
    \n### 操作数\n\n在运算符的语境中，正在处理的值被称为操作数。许多运算符需要两个操作数，分别在运算符的两侧（称为左操作数和右操作数）。其他的——称为一元运算符——只使用单个操作数，而更少的一部分运算符使用三个或更多操作数。\n\
    \n## 丰富的运算符\n\nJavaScript 有许多不同的运算符——多得无法在此一一介绍——所以我们只关注最常见的那些。\n\n### 点运算符\n\n\
    我们已经见过点运算符 \".\"——它使我们能够访问对象的属性（和方法——参见第 102 页）。左操作数是对对象的引用，右操作数则是该对象的属性或方法的名称。\n\
    \n```javascript\n1  38 + 4\n2  \n3  \"Hello \" + \"World\"\n4  \n5  myVariable\
    \ = true\n6  \n7  quizQuestion.questionText\n8  \n9  getMyValue()\n10 \n11 myObject.doSomething()\n\
    ```\n\n上图：运算符赋予表达式意义和目的。\n\n上图：操作数是运算符依次处理的操作值。\n\n### 算术运算符\n\n算术运算符使用提供的操作数执行算术运算，并返回该计算的结果。操作数必须是数字，或者求值为数字的表达式。\n\
    \n> **热门提示**\n> 访问 https://en.wikibooks.org/wiki/JavaScript_Operators 查看 JavaScript\
    \ 运算符的完整列表。\n\n| 运算符 | 操作数个数 | 名称 | 作用 | 示例（括号内为结果） |\n|---|---|---|---|---|\n\
    | `+` | 2 | 加法 | 将左右操作数相加 | 4 + 5 (9) |\n| `-` | 2 | 减法 | 左操作数减去右操作数 | 31 - 14\
    \ (17) |\n| `*` | 2 | 乘法 | 左右操作数相乘 | 12 * 3 (36) |\n| `/` | 2 | 除法 | 左操作数除以右操作数\
    \ | 12 / 3 (4) |\n| `++` | 1 | 自增 | 将单个标识符操作数的值加 1 | multipliers++ (multipliers\
    \ 增加 1) |\n| `--` | 1 | 自减 | 将单个标识符操作数的值减 1 | multipliers-- (multipliers 减少 1)\
    \ |\n\n### 字符串运算符\n\n有几种不同的运算符可以处理字符串，但只有一种是专门用于字符串的：\n\n| 运算符 | 名称 | 作用 | 示例（括号内为结果）\
    \ |\n|---|---|---|---|\n| `+` | 拼接 | 将两个字符串连接在一起，返回结果字符串 | \"Hello \" + \"World\"\
    \ (\"Hello World\") |\n\n请注意，拼接运算符看起来与加法运算符相同——解释器根据操作数的数据类型来推断应该使用哪个运算符。如果两个操作数求值都是数字，则是加法；如果任一操作数求值为字符串，则是拼接。此外，如果拼接运算符的操作数求值为数字，它会转换为字符串（参见数据类型转换，第\
    \ 43 页）。\n\n> **热门提示**\n> 我们的表格中没有列出操作数个数的，默认都是二元运算符——即它们需要两个操作数。\n\n### 赋值运算符\n\
    \n我们已经见过这个运算符，其左操作数始终是变量或属性引用，右操作数可以是任何字面量、标识符或表达式。\n\n| 运算符 | 名称 | 作用 | 示例（括号内为结果）\
    \ |\n| :--- | :--- | :--- | :--- |\n| `=` | 赋值 | 将右操作数的值赋给左操作数指示的变量或属性 | `myRef\
    \ = 42` (myRef 现在的值为 42) |\n\n### 相等运算符\n\n这些运算符比较两个操作数，返回 true 或 false（参见布尔值，第\
    \ 331 页）。操作数可以是任何数据类型。\n\n> **热门提示**\n> 务必充分理解赋值运算符 `=` 和相等运算符 `==` 之间的区别。\n\n\
    | 运算符 | 名称 | 作用 | 示例（括号内为结果） |\n| :--- | :--- | :--- | :--- |\n| `==` | 相等 | 如果两个操作数相等则返回\
    \ true，否则返回 false | `4 == 2` (false) |\n| `!=` | 不相等 | 如果两个操作数不相等则返回 true，否则返回\
    \ false | `4 != 2` (true) |\n\n### 比较运算符\n\n顾名思义，比较运算符比较两个操作数，返回 true 或 false。操作数可以是任何数据类型。\n\
    \n| 运算符 | 名称 | 作用 | 示例（括号内为结果） |\n| :--- | :--- | :--- | :--- |\n| `<=` | 小于或等于\
    \ | 如果左操作数的值小于或等于右操作数的值，则返回 true，否则返回 false | `52 < 20` (false) <br> `15 < 19`\
    \ (true) |\n| `>=` | 大于或等于 | 如果左操作数的值大于或等于右操作数的值，则返回 true，否则返回 false | `52 > 20`\
    \ (true) <br> `12 > 350` (false) |\n\n### 逻辑运算符\n\n逻辑运算符比较值，然后返回 true 或 false。如有需要，操作数会被转换为布尔值。\n\
    \n| 运算符 | 操作数个数 | 名称 | 作用 | 示例（括号内为结果） |\n| :--- | :--- | :--- | :--- | :--- |\n\
    | `&&` | 2 | 逻辑与 | 如果两个操作数都求值为 true，则返回 true，否则返回 false | `true && false` (false)\
    \ |\n| `||` | 2 | 逻辑或 | 如果任一操作数求值为 true，则返回 true，否则返回 false | `true || false`\
    \ (true) |\n| `!` | 1 | 逻辑非 | 置于单个操作数之前，反转操作数的布尔值 | `!true` (false) |\n"
