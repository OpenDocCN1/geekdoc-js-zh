  md: '6. Now the handler invokes the question number, it can retrieve the corresponding
    QuizQuestion object from the questions array. However, in an event handler, this
    refers to the element that triggered the event, so we need the object handling
    the event, so we need to use a global reference to access the questions array.
    The code for this is in the illustration below.


    > **Hot Tip**


    The `parentNode` property of an HTML element refers to the parent of that element,
    i.e. the element in which an element is nested.


    8. Save your work. Don''t open the file in your browser yet – we''re not quite
    finished.


    # EVENT LISTENERS


    Event listeners are assigned to the object that generates the event we want to
    capture – often this is a DOM object from the web page. Once we know the object
    we want to listen to, we call `addEventListener()` on that object – the general
    form is:


    ```

    myObject.addEventListener(eventType, handlerExpression, useCapture);

    ```


    ```

    60 com.flamel.neospublishing.simpleQuiz.prototype.onAnswer = function() {

