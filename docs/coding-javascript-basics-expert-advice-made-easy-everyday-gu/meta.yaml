    ## HTML 是层次结构


    所有 HTML 文档都包含一个 `<html>` 元素；该元素总是包含一个 `<head>` 和一个 `<body>` 元素；这些元素本身又包含其他元素。因此，页面是
    HTML 元素的层次结构。我们用血缘关系来表达这种结构：`<html>`是**根**元素，有两个子元素，`<head>`和`<body>`；`<html>`是`<head>`和`<body>`的**父元素**；`<head>`和`<body>`是**兄弟元素**。


    ## 什么是 DOM？


    我们知道 JavaScript 使我们能够通过在一个对象中存储其他对象来创建类似的层次结构；事实证明，这正是网页在浏览器底层被表示的方式。这种表示——或模型——被称为**文档对象模型**，简称
    **DOM**。


