  md: "# EXPRESSIONS AND OPERATORS\n\nThe instructions you write in scripts are made\
    \ up of expressions. Typically, expressions use operators to manipulate data in\
    \ some way.\n\n# WHAT IS AN EXPRESSION?\n\nAn expression is any segment of code\
    \ that the interpreter can evaluate, typically yielding a value. This grandiose\
    \ description belies how simple the concept is — consider the following: 42. Strictly\
    \ speaking, as well as being a literal, this is also an expression — the interpreter\
    \ can evaluate it, yielding the decimal value 42. Admittedly, it isn’t much of\
    \ an expression — it’s the scripting equivalent of walking into a colleague and\
    \ saying “42”; she will understand that you’ve stated a value, but she won’t have\
    \ a clue what you expect her to do with it.\n\n```\n1 42\n2 2\n3 \"Hello World\"\
    \n4 true\n5 null\n6 null\n```\n\n# Block Comments\n\nA block comment starts with\
    \ `/*` and continues until a closing `*/` occurs. Everything between these markers\
    \ is considered part of the comment.\n\n# KEYWORDS AND RESERVED WORDS\n\nJavaScript\
    \ defines a set of predefined identifiers, called keywords, as well as other identifiers\
    \ that may not be incorporated into the language in the future. Collectively,\
    \ these are known as reserved words, and you must not use these names as names\
    \ for your own identifiers (nor as property names within objects).\n\n```\n/*\
    \ These are line comments, which start with //\n// Until the end-of-line character\
    \ (\\n) is found.\n// This is a line comment. This is a \"line comment\".\n\n\
    /* This is a block comment; astronomers call this a\n\"multi-line comment\" because\
    \ it can span a line break (\\n)\n* We can include block comments anywhere we\
    \ like\n* They may appear in the middle of a statement, either\n* when commenting\
    \ out the code, or where labeling\n* the code. */\n\n// You can also define different\
    \ styles in the same document.\n\n/* Let's use this style for expressions that\
    \ return a value: */\nthis.result = document.createElement(\"div\");\nthis.result\
    \ = render(data);\n\n/* And this style for statements that return nothing: */\n\
    this.container = window.body;\nthis.container.appendChild(this.result);\n\n/*\
    \ And this style for logic: */\nthis.value = 42;\n\n/* And this style for helper\
    \ functions: */\nthis.update = () => {\n\tsetinnerWidth(this.container);\n\tsetinnerWidth(this.result);\n\
    };\n\n/* And this style for documentation: */\ncode.title = \"Example\";\n```\n\
    \n| KEYWORDS | RESERVED WORDS |\n| :--- | :--- |\n| break, case, catch, continue,\
    \ default, delete, do, else, false, finally, for, function, if, in, instanceof,\
    \ new, null, return, switch, this, throw, true, try, typeof, var, void, while,\
    \ with | abstract, boolean, byte, char, class, const, debugger, double, enum,\
    \ export, extends, final, float, goto, implements, import, int, interface, long,\
    \ native, package, private, protected, public, short, static, super, synchronized,\
    \ throws, transient, volatile |"
