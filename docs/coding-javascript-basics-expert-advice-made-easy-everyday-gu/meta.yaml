    \n命名空间是定义一组唯一名称的虚拟空间或上下文。换句话说，只要两个名称存在于不同的命名空间中，它们就可以完全相同。命名空间非常重要，因为如果没有它们，我们就面临遇到名称冲突的风险。\n\
    \n| 名词 | 动词 |\n|------|------|\n| **Dog（狗）：** 一种常被当作宠物的四足驯养动物 | **Dog（追踪）：** 执着地追求或纠缠\
