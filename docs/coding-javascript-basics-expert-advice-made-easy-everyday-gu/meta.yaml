    # Event Handlers


    Typically, when an event listener is triggered, the expression it executes is
    a function or method call. The function or method being called is referred to
    as an event handler. It is the event handler''s job to deal with the event in
    some way – making visual changes, sending data to a server, and so on.


    # Adding an Event Handler


    Our Simple Quiz application needs to be able to respond to the user clicking on
    an answer – let''s define an event handler as a first step.


    1. Open SimpleQuiz.js. We''re going to create a new method called clickHandler
    – move to the bottom of the document and add the method as shown in the illustration
    below.


