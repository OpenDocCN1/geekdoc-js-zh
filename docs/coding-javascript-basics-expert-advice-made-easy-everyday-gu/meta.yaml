- md: "# Using Return When Checking a Quiz Answer\n\nOur quiz needs to be able to\
    \ determine whether the user has selected a correct answer – let's write a function\
    \ for that now.\n\n1. Open quizFunctions.js in your editor, and add a new function\
    \ called checkUserAnswer() – see the illustration below. The function will receive\
    \ two arguments – a question index and an answer index – that allow the function\
    \ to determine the question that's to be checked and the answer that was given.\n\
    \n```javascript\nfunction checkUserAnswer(questionIndex, answerIndex) {\n    //function\
    \ statements will go here...\n}\n```\n\nAbove: Step 1: Add a new function as shown\
    \ here.\n\n2. Enter the code shown in the illustration below and then save your\
    \ work.\n\n```javascript\nfunction checkUserAnswer(questionIndex, answerIndex)\
    \ {\n    var questionObject = questions[questionIndex];\n    var theResult;\n\
    \    if(questionObject.correctAnswerIndex == answerIndex) {\n        theResult\
    \ = true;\n    } else {\n        theResult = false;\n    }\n    return(theResult);\n\
    }\n```\n\nAbove: Step 2: Enter the code shown here.\n\n3. Nothing new happens\
    \ if you launch the page, because we aren't triggering the new function in any\
    \ way – we'll get to that when we look at Events on page 116.\n\n## Anonymous\
    \ Functions\n\nIn JavaScript, a function is just another form of data. This means\
    \ that you can create a function and assign it to a variable or object property.\
    \ Such functions are called anonymous functions, because they don't have a function\
    \ name.\n\n### Declaring an Anonymous Function\n\nWe declare an anonymous function\
    \ by assigning a function literal to a variable or object property. The general\
    \ form looks like this:\n\n```javascript\nvar myAnonymousFunction = function(parameter(s))\
    \ {\n    statement(s);\n}\n```\n\n### Invoking an Anonymous Function\n\nInvoking\
    \ an anonymous function is no different to invoking a named one: we just use a\
    \ variable name or property reference instead of a function name. To all intents\
    \ and purposes, this is identical to invoking a named function.\n\n```javascript\n\
    //This is a named function...\nfunction calculateRectArea(rectWidth, rectHeight)\
    \ {\n    return(rectWidth * rectHeight);\n}\n\n//This is an anonymous function...\n\
    var calculateRectHypotenuse = function(rectWidth, rectHeight) {\n    var widthSquared\
    \ = rectWidth * rectWidth;\n    var heightSquared = rectHeight * rectHeight;\n\
    \    return(Math.sqrt(widthSquared + heightSquared)); //Math.sqrt() calculates\
    \ a square root.\n}\n\n//Calls to either function have the same general form:\n\
    var myRectArea = calculateRectArea(49, 28);\nvar myRectHypotenuse = calculateRectHypotenuse(49,\
    \ 28);\n```\n\nAbove: Named and anonymous functions are called in the same way.\n\
    \n## Variable Scope\n\nWhen a variable is declared outside of any functions or\
    \ statement blocks, it is available from anywhere in the web page, so is known\
    \ as a **global variable**. Another way of putting this is that the variable exists\
    \ within the **global scope**. Conversely, variables declared within a function\
    \ are only accessible from within that function — they are said to be within the\
    \ function's **scope**.\n\n### The Scope Chain\n\nScope is hierarchical – one\
    \ scope is nested within another. For example, named functions always exist in\
    \ the global scope. An expression can only access variables that are in the same\
    \ scope as – or are further up the scope chain than – the expression.\n\nGlobal\
    \ scope - accessible from all scripts and functions in a page\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_45_0.png)\n\
    \nAbove: Variable scope is hierarchical. A variable in one scope can't access\
    \ deeper-nested scopes.\n\n## Namespaces\n\nWe create a lot of named objects –\
    \ variables and functions – in JavaScript, and the name of each should be unique\
    \ within its own scope. If it isn't unique, a name clash occurs, and things go\
    \ badly wrong.\n\n### What Is a Namespace?\n\nNamespaces are notional spaces or\
    \ contexts in which a set of unique names can be defined. Put another way, two\
    \ names can be identical so long as they exist in different namespaces. Namespaces\
    \ are important because without them, we run the risk of encountering name clashes.\n\
    \n| NOUN | VERB |\n|------|------|\n| **Dog:** A four-legged domesticated animal\
    \ often kept as a pet | **Dog:** To persistently pursue or pester |\n| **Shoot:**\
    \ A young branch stemming from the main branch of a tree or plant | **Shoot:**\
    \ The act of firing a gun or cannon |\n| **Dope:** A stupid or indolent person\
    \ | **Dope:** To administer drugs |\n\nAbove: We can think of verbs and nouns\
    \ as being examples of real-world namespaces – a name can appear in both, yet\
    \ remain distinct.\n\n> **Hot Tip**\n>\n> The concept of namespaces can seem confusing\
    \ initially, but is actually quite simple in practice — we all use them all the\
    \ time.\n\n### Simulating Namespaces in JavaScript\n\nUnlike some languages, JavaScript\
    \ does not have formal notation for creating namespaces. However, remember that\
    \ everything in JavaScript is an object – an upshot of this is that we can create\
    \ an object in the global namespace and then define all of our variables and functions\
    \ within this object. Our names don't pollute the global namespace, and if we\
    \ choose the namespace object's name wisely, we won't end up using the same one\
    \ as is used in other scripts.\n\n### What Is a Name Clash?\n\nA name clash occurs\
    \ when a name given to an object in a page is used by another object within the\
    \ same page. Any expression that uses this name may not get back the data it expects\
    \ or requires, leading to hard-to-trace bugs and errors.\n\n### Pollution of the\
    \ Global Namespace\n\nThe name of every named function and every global variable\
    \ exists within the global namespace. With large projects, this namespace can\
    \ become littered with many different names. Having third-party scripts in a page\
    \ can make matters considerably worse. The more polluted the global namespace\
    \ becomes, the more likely that you will encounter name clashes.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_46_0.png)\n\
    \nAbove: The global namespace can become somewhat messy.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_46_1.png)\n\
    \n> **Hot Tip**\n>\n> The name of a named function exists in the global namespace.\
    \ In contrast, anonymous functions can be assigned to an object property, thereby\
    \ removing their identifiers from the global namespace.\n\n```javascript\nvar\
    \ myNamespace = {};\n\nmyNamespace.calculateRectArea = function(rectWidth, rectHeight)\
    \ {\n    return(rectWidth * rectHeight);\n}\n```\n\nAbove: Anonymous functions\
    \ can be assigned to object properties so that they don't pollute the global namespace.\n\
    \n### Choosing a Name for a Namespace\n\nGiven that a namespace's name has to\
    \ exist in the global namespace, it is entirely possible to get a name clash with\
    \ another namespace's name. The trick to avoiding this is to choose a name that\
    \ nobody else is likely to be using. How do you do this? Easy – base the namespace\
    \ name on your website's domain name. Typically, we reverse the name, so if your\
    \ domain name is mydomain.com, your namespace would be com.mydomain. You could\
    \ then extend this further with a per-application and/or per-module name – for\
    \ example, com.mydomain.myApplication.\n\n> **Hot Tip**\n>\n> It is important\
    \ to understand that a namespace name does not refer to a page or web resource\
    \ – it's just a name.\n\n### Global Scope Namespace\n\nGlobal identifiers and\
    \ named functions\n\n| Namespace | Description |\n|-----------|-------------|\n\
    | **com** | Global identifiers and named functions |\n| **com.mydomain** | Identifiers\
    \ that refer to the functions and values used by your scripts |\n| **com.otherdomain**\
    \ | Identifiers that refer to the functions and values defined by 3rd party scripts\
    \ that are attached to your page. They have their own namespace so won't clash\
    \ with your names. |\n\nAbove: JavaScript simulates 'namespaces' using objects.\
    \ Reversing your domain name is the best way to ensure your names don't clash\
