    ```


    # STATEMENT BLOCKS


    Related statements can be grouped together into a block. This is done by wrapping
    the statements in braces – i.e curly brackets: { and }. For example:


    > {

    var playerScore = 0;

    var playerName = ''Sarah'';

    var playerAge = 29;

    }


    This technique has its uses, but doesn''t achieve an awful lot. However, as we
    are about to discover, statement blocks become increasingly important the deeper
    we delve into JavaScript.


    **Hot Tip**


    Thinking about how to break down common tasks – such as making a cup of tea –
    into a series of concise, unambiguous instructions is a great way to practise
    the art of structuring JavaScript expressions and statements.'
  - "[PAGE 33]\n\n# CONDITIONAL STATEMENTS\n\nWe often need to execute different statements\
    \ based upon conditions that do not exist until a page has been loaded into a\
    \ browser, and a user is interacting with it. This is when we reach for conditional\
    \ statements.\n\n# IF STATEMENTS\n\nWith if, we test for the existence of a condition\
    \ and then execute expressions should that condition exist. Its basic form looks\
    \ like this:\n\n```\nif (condition) expressions;\n```\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_33_0.png)\n\
    \nAbove: Flowchart of a simple if statement\n\n# USING IF STATEMENTS\n\nWhen the\
    \ interpreter encounters an if statement, it evaluates the expression contained\
    \ inside the parentheses. In the event that the expression evaluates to true,\
    \ the statement following the if is executed.\n\n# How an If Statement Works\n\
    \nLet's see how an if statement works using a simple example:\n\n+   1. Create\
    \ a new HTML document and enter the standard structural elements. Save the page\
    \ as ifExample.html.\n\n+   2. Create a new `<script>` element as a child of (i.e.\
    \ inside) the `<head>` element. We're declaring it in the `<head>` to ensure it's\
    \ available before the `<body>` element is rendered.\n\n+   3. Add a simple variable\
    \ declaration into this `<script>` element: var userAge = 36;. Although we've\
    \ manually assigned a value to this variable, imagine that the user had actually\
    \ provided this information. See the illustration, right.\n\n+   4. Add another\
    \ `<script>` element, this time as the child of the `<body>` element. Copy into\
    \ this new `<script>` element the code shown in the illustration below.\n\n+ \
    \  5. Save your work and then open ifExample.html in Firefox.\n\n```\n1 <!DOCTYPE\
    \ HTML>\n2 <html>\n3   <head>\n4     <title>If Example</title>\n5   \n6     <script\
    \ type=\"text/javascript\">\n7       var userAge = 36;\n8     </script>\n9   \n\
    10  </head>\n```\n\nAbove: Step 3: Here you add a simple variable declaration.\n\
    \n```\n12  <body>\n13    <script type=\"text/javascript\">\n14      if(userAge\
    \ > 16) alert(\"This is a kids zone - not for grown ups.\");\n15    </script>\n\
    16  \n17  </body>\n```\n\nAbove: Step 4: Use the code as described in the text\
    \ above."
- md: "## How It Works\n\nThe condition expression of the `if` statement compares\
    \ the `userAge` value against a literal value, 16. Because `userAge` evaluates\
    \ to 36, and 36 is greater than 16, the `if` condition evaluates to `true` and\
    \ the subsequent expression is evaluated.\n\n## The Else Clause\n\nThe basic `if`\
    \ statement can be expanded on via the addition of an `else` clause (we refer\
    \ to it as a clause because it's a subsection of a larger `if` statement, and\
    \ means nothing outside of an `if` statement). The general form is this:\n\n>\
    \ The opening brace of a statement block can be directly following the closing\
    \ parenthesis of the condition expression, or on its own line, or even just before\
    \ the first statement. It's up to you.\n\n```javascript\nif(condition) {\n   \
    \ statement(s);\n} else {\n    statement(s);\n}\n```\n\nAbove: The `if` conditional\
    \ expression evaluates to true, so we see the alert message.\n\n## Executing Multiple\
    \ Statements\n\nThe above form of `if` can only execute a single statement when\
    \ its condition is true, but we often need to execute multiple statements. To\
    \ do this, we add a statement block following the condition expression (see Statement\
    \ Blocks, page 63). The general form looks like this:\n\n```javascript\nif(condition)\
    \ {\n    statement_1;\n    statement_2;\n    ...\n    statement_n;\n}\n```\n\n\
    Now, in the event that the condition evaluates to `true`, all of the statements\
    \ within the statement block (the body of the `if` statement) are executed.\n\n\
    The statement block following `else` executes when the `if` statement's condition\
    \ evaluates to `false`. Why not try adding an `else` clause to the last coding\
    \ exercise (page 65)?\n\nAbove: Adding a statement block to an `if` statement.\n\
    \nRight: The `else` clause is triggered when the condition expression evaluates\
    \ to false.\n\n## The Else If Clause\n\nWe can introduce a new conditional test\
    \ in the event that the previous test evaluates to false.\n\nThe general form\
    \ looks like this:\n\n```javascript\nif (condition) {\n  statement(s);\n} else\
    \ if (condition) {\n  statement(s);\n}\n```\n\nWe can add as many `else if` clauses\
    \ as we like, and also conclude with a final `else` clause that executes only\
    \ when all preceding conditions evaluate to `false`.\n\nAbove: The `else if` clause\
    \ allows multiple conditional tests in an `if` statement.\n\n## THE SWITCH STATEMENT\n\
    \nUsing `switch` is similar to `if`, but rather than testing a condition for true\
    \ or false, a switch statement selects a block of code to execute based on the\
    \ result of the condition expression. The values to test for are specified in\
    \ `case` sections. The general form is:\n\n```javascript\nswitch(condition) {\n\
    \  case label_1:\n    statement(s);\n    break;\n  case label_2:\n    statement(s);\n\
    \    break;\n  default:\n    statement(s);\n    break;\n}\n```\n\n### How a Switch\
    \ Statement Works\n\nWhen the interpreter encounters a `switch` statement, it\
    \ evaluates the condition expression and then looks in the switch block for a\
    \ `case` label that matches the condition's result. If a match is found, all following\
    \ statements are executed, including those contained in subsequent `case` sections.\n\
    \nAbove: The flow of a `switch` statement.\n\n## NESTING IF STATEMENTS\n\nThe\
    \ `else if` clause creates a branching logical structure that is very common in\
    \ programming. But beware: such structures become increasingly complex with each\
    \ additional branch — we can often avoid them altogether by employing a different\
    \ conditional statement.\n\n### BREAKING FROM A CASE SECTION\n\nIn order to prevent\
    \ subsequent case sections from being executed, we include a break keyword at\
    \ the end of each case. This tells the interpreter to cease processing the statement\
    \ block and resume execution at the first statement following the block.\n\n**Hot\
    \ Tip**\nIf you find that a structure of if-else-if statements is becoming too\
    \ cumbersome to manage, a switch statement may be a more suitable approach.\n\n\
    ### DEFAULT CASE\n\nA switch statement can contain a special default section that\
    \ is always triggered if encountered. This is typically placed at the end of the\
    \ switch so that it is selected only if no case labels match the condition expression.\n\
    \n## LOOP STATEMENTS\n\nWe often need to run the same set of statements against\
    \ a collection of different values, or repeat statements a certain number of times\
    \ – this is where loops come in.\n\n### WHILE LOOPS\n\nThe simplest form of loop\
    \ statement is known as the while loop. Its general form is:\n\n```javascript\n\
    while(condition) {\n    statement(s);\n}\n```\n\n**Hot Tip**\nCaution: if you\
    \ code loops incorrectly, you may trigger an infinite loop, where the interpreter\
    \ gets stuck processing the same loop statement indefinitely.\n\n```javascript\n\
    <script type=\"text/javascript\">\n    //Imagine that an object named mediaObject\
    \ exists on the page.\n    //mediaObject could refer to a video file or to an\
    \ audio file,\n    //but when writing the code we don't know which it will be.\n\
    \    switch(mediaObject.mediaType) {\n        case \"video\":\n            alert(\"\
    You are about to access a video\");\n            //statements that cause the video\
    \ to load and play\n            break;\n        case \"audio\":\n            alert(\"\
    You are about to access an audio recording\");\n            //statements that\
    \ cause the audio to load and play\n            break;\n        default:\n   \
    \         alert(\"Cannot determine the media type\");\n    }\n</script>\n```\n\
    \nIf the condition evaluates to true, the statement(s) contained in the code block\
    \ following the condition are executed, then the condition is tested again. If\
    \ still true, the process is repeated. This continues until the condition evaluates\
    \ to false.\n\n*Above: This imaginary script shows how a switch statement can\
    \ be used.*\n\n*Above: The flow of a while loop.*\n\n### DO WHILE LOOPS\n\nThese\
    \ loops are very similar to `while` loops, except the condition is evaluated only\
    \ after the statement block has been executed. If the condition resolves to `true`,\
    \ the statement block is repeated and the condition evaluated once more. Here's\
    \ how it looks:\n\n```javascript\ndo {\n  statement(s);\n} while(condition);\n\
    ```\n\n### Elements of a For Loop\n\nThe three elements of a `for` loop are expressions\
    \ that control the reiteration of the loop:\n\n- **initialize**: This expression\
    \ is evaluated once and creates an initial index for the loop; the index is just\
    \ a number, typically used to count the number of loop iterations that have occurred.\n\
    - **condition**: This is the expression that is tested to see whether the loop\
    \ repeats or not. In most circumstances, the condition expression tests the value\
    \ of the index against some other value, such as an array's length.\n- **iteration**:\
    \ This expression is evaluated after the loop's statement block has been executed,\
    \ and its intended use is to modify the value of the index before the next iteration.\n\
    \n## FOR LOOPS\n\nThe `for` loop is often used for processing the elements of\
    \ an array, because it simplifies executing the same statement block against each\
    \ element in the array.\n\nThe `for` loop's declaration can appear a little daunting\
    \ – let's take a look at it before analysing what it means:\n\n```javascript\n\
    for (initialize ; condition ; iteration ) {\n  statement(s);\n}\n```\n\n### Using\
    \ a For Loop\n\nIn the exercise on page 41, we created two objects that represented\
    \ questions in a quiz – we're going to build on that idea.\n\n1. Create a new\
    \ folder and call it SimpleQuiz. Create a subfolder and call it js – this is where\
    \ we'll be storing external script files in later examples.\n\n2. Create a new\
    \ HTML document containing the common structural elements, and save it in the\
    \ new folder as simpleQuiz.html. Also create a new JavaScript document and save\
    \ it in the js subfolder as quizQuestions.js.\n\n3. Return to the HTML document.\
    \ Add a `<script>` element as a child of the `<head>` element, setting its type\
    \ attribute to \"text/javascript\" and its src attribute to \"js/quizQuestions.js\"\
    . See the illustration below.\n\n4. Go to quizQuestions.js, where we're going\
    \ to define the questions themselves. At the top of the file, declare an array\
    \ variable named questions.\n\n5. Now we'll add a question by declaring object\
    \ and array literals within the `push()` method's parentheses, as shown in the\
    \ illustration below. You can copy our questions and answers, or come up with\
    \ your own.\n\n**Hot Tip**\nWe're no longer going to remind you to add the type\
    \ attribute to a `<script>` element – take it as read that you should.\n\n```javascript\n\
    1 var questions = [];\n2\n3 // QUESTION 1\n4 questions.push({\n5   questionText:\
    \ \"Approximately how far away from the Earth is the Sun?\",\n6   answers: [\"\
    200 miles\", \"93,000,000 miles\", \"40,000,000 miles\", \"150,000 miles\"],\n\
    7   correctAnswerIndex: 1\n8 });\n9\n10 // QUESTION 2\n11 questions.push({\n12\
    \   questionText: \"How many planets are there in our solar system?\",\n13   answers:\
    \ [\"6\", \"7\", \"8\", \"9\"],\n14   correctAnswerIndex: 2\n15 });\n16\n17 //\
    \ QUESTION 3\n18 questions.push({\n19   questionText: \"Which of these is a moon\
    \ of Jupiter?\",\n20   answers: [\"Ganymede\", \"Miranda\", \"Enceladus\", \"\
    Mars\"],\n21   correctAnswerIndex: 0\n22 });\n23\n```\n\n```html\n1 <!DOCTYPE\
    \ HTML>\n2 <html>\n3   <head>\n4     <title>A Simple Quiz</title>\n5\n6     <script\
    \ type=\"text/javascript\" src=\"js/quizQuestions.js\"></script>\n7   </head>\n\
    8   <body>\n9\n10   </body>\n11 </html>\n12\n```\n\n6. Save the JavaScript document,\
    \ then in your editor, return to the HTML document."
  mdcn: "\n## 工作原理\n\n`if` 语句的条件表达式会将 `userAge` 的值与字面量值 16 进行比较。由于 `userAge` 的求值结果为\
    \ 36，而 36 大于 16，因此 `if` 条件的求值结果为 `true`，随后的表达式会被执行。\n\n## Else 子句\n\n基本的 `if`\
    \ 语句可以通过添加 `else` 子句来扩展（我们称之为子句，因为它是更大 `if` 语句的一个子部分，在 `if` 语句之外没有意义）。其通用形式如下：\n\
    \n> 语句块的左大括号可以直接跟在条件表达式的右括号之后，也可以单独占一行，甚至可以放在第一条语句之前。这取决于你。\n\n```javascript\n\
    if(condition) {\n    statement(s);\n} else {\n    statement(s);\n}\n```\n\n上方：`if`\
    \ 条件表达式求值为 true，因此我们看到警报消息。\n\n## 执行多条语句\n\n上述形式的 `if` 在其条件为 true 时只能执行单条语句，但我们经常需要执行多条语句。为此，我们在条件表达式后添加一个语句块（参见第\
    \ 63 页的语句块）。通用形式如下：\n\n```javascript\nif(condition) {\n    statement_1;\n    statement_2;\n\
    \    ...\n    statement_n;\n}\n```\n\n现在，如果条件求值为 `true`，语句块（`if` 语句的主体）中的所有语句都会被执行。\n\
    \n当 `if` 语句的条件求值为 `false` 时，`else` 后的语句块会执行。何不在最后一个编码练习（第 65 页）中尝试添加一个 `else`\
    \ 子句？\n\n上方：为 `if` 语句添加语句块。\n\n右侧：当条件表达式求值为 false 时，`else` 子句被触发。\n\n## Else If\
    \ 子句\n\n如果前一个测试求值为 false，我们可以引入一个新的条件测试。\n\n通用形式如下：\n\n```javascript\nif (condition)\
    \ {\n  statement(s);\n} else if (condition) {\n  statement(s);\n}\n```\n\n我们可以根据需要添加任意多个\
    \ `else if` 子句，并且可以用一个最终的 `else` 子句来结束，该子句仅在所有前面的条件都求值为 `false` 时才执行。\n\n上方：`else\
    \ if` 子句允许在 `if` 语句中进行多个条件测试。\n\n## SWITCH 语句\n\n使用 `switch` 与 `if` 类似，但它不是测试条件是否为\
    \ true 或 false，而是 switch 语句根据条件表达式的结果选择要执行的代码块。要测试的值在 `case` 部分中指定。通用形式如下：\n\n\
    ```javascript\nswitch(condition) {\n  case label_1:\n    statement(s);\n    break;\n\
    \  case label_2:\n    statement(s);\n    break;\n  default:\n    statement(s);\n\
    \    break;\n}\n```\n\n### Switch 语句的工作原理\n\n当解释器遇到 `switch` 语句时，它会计算条件表达式，然后在\
    \ switch 块中查找与条件结果匹配的 `case` 标签。如果找到匹配项，则执行其后的所有语句，包括后续 `case` 部分中包含的语句。\n\n上方：`switch`\
    \ 语句的流程。\n\n## 嵌套 IF 语句\n\n`else if` 子句创建了一种分支逻辑结构，这在编程中非常常见。但要小心：随着每个额外分支的增加，这种结构会变得越来越复杂——我们通常可以通过使用不同的条件语句来完全避免它们。\n\
    \n### 从 CASE 部分跳出\n\n为了防止后续的 case 部分被执行，我们在每个 case 的末尾包含一个 break 关键字。这告诉解释器停止处理该语句块，并在块后的第一条语句处恢复执行。\n\
    \n**实用技巧**\n如果你发现 if-else-if 语句的结构变得过于笨重难以管理，switch 语句可能是一种更合适的方法。\n\n### DEFAULT\
    \ CASE\n\nswitch 语句可以包含一个特殊的 default 部分，如果遇到该部分则始终触发。这通常放在 switch 的末尾，以便仅在没有任何\
    \ case 标签与条件表达式匹配时才被选中。\n\n## 循环语句\n\n我们经常需要对一组不同的值运行同一组语句，或者将语句重复执行一定次数——这就是循环的用武之地。\n\
    \n### WHILE 循环\n\n最简单的循环语句形式称为 while 循环。其通用形式如下：\n\n```javascript\nwhile(condition)\
    \ {\n    statement(s);\n}\n```\n\n**实用技巧**\n注意：如果你错误地编写了循环，你可能会触发一个无限循环，其中解释器会无限期地卡在处理同一个循环语句中。\n\
    \n```javascript\n<script type=\"text/javascript\">\n    //假设页面上存在一个名为 mediaObject\
    \ 的对象。\n    //mediaObject 可能指向一个视频文件或一个音频文件，\n    //但在编写代码时，我们不知道它具体是哪个。\n   \
    \ switch(mediaObject.mediaType) {\n        case \"video\":\n            alert(\"\
    You are about to access a video\");\n            //导致视频加载和播放的语句\n            break;\n\
    \        case \"audio\":\n            alert(\"You are about to access an audio\
    \ recording\");\n            //导致音频加载和播放的语句\n            break;\n        default:\n\
    \            alert(\"Cannot determine the media type\");\n    }\n</script>\n```\n\
    \n如果条件求值为 true，则执行条件后代码块中包含的语句，然后再次测试条件。如果仍然为 true，则重复此过程。这持续进行直到条件求值为 false。\n\
    \n*上方：这个虚构的脚本展示了如何使用 switch 语句。*\n\n*上方：while 循环的流程。*\n\n### DO WHILE 循环\n\n这些循环与\
    \ `while` 循环非常相似，区别在于条件仅在语句块执行后才进行评估。如果条件求值为 `true`，则语句块会重复执行，并再次评估条件。其形式如下：\n\
    \n```javascript\ndo {\n  statement(s);\n} while(condition);\n```\n\n### FOR 循环的组成部分\n\
    \n`for` 循环的三个组成部分是控制循环重复执行的表达式：\n\n- **初始化**：此表达式求值一次，并为循环创建一个初始索引；索引只是一个数字，通常用于计算已发生的循环迭代次数。\n\
    - **条件**：这是测试以判断循环是否继续重复的表达式。在大多数情况下，条件表达式会测试索引的值是否与另一个值（例如数组的长度）相匹配。\n- **迭代表达式**：此表达式在循环的语句块执行后求值，其预期用途是在下一次迭代之前修改索引的值。\n\
    \n## FOR 循环\n\n`for` 循环通常用于处理数组的元素，因为它简化了针对数组中每个元素执行相同语句块的过程。\n\n`for` 循环的声明可能看起来有点令人生畏——让我们先看看它，然后分析它的含义：\n\
    \n```javascript\nfor (initialize ; condition ; iteration ) {\n  statement(s);\n\
    }\n```\n\n### 使用 FOR 循环\n\n在第 41 页的练习中，我们创建了两个表示测验中问题的对象——我们将在此基础上继续。\n\n1.  创建一个新文件夹并将其命名为\
    \ SimpleQuiz。创建一个子文件夹并将其命名为 js——我们将在后续示例中将外部脚本文件存储在此处。\n\n2.  创建一个包含常见结构元素的新 HTML\
    \ 文档，并将其作为 simpleQuiz.html 保存在新文件夹中。同时创建一个新的 JavaScript 文档，并将其作为 quizQuestions.js\
    \ 保存在 js 子文件夹中。\n\n3.  返回 HTML 文档。在 `<head>` 元素中添加一个 `<script>` 子元素，将其 type 属性设置为\
    \ \"text/javascript\"，src 属性设置为 \"js/quizQuestions.js\"。请参见下图。\n\n4.  转到 quizQuestions.js，我们将在其中定义问题本身。在文件顶部，声明一个名为\
    \ questions 的数组变量。\n\n5.  现在我们将通过在 `push()` 方法的括号内声明对象和数组字面量来添加问题，如下图所示。你可以复制我们的问题和答案，或者自己编写。\n\
    \n**实用技巧**\n我们不再提醒你为 `<script>` 元素添加 type 属性了——请认为这是你应该做的。\n\n```javascript\n\
    1 var questions = [];\n2\n3 // QUESTION 1\n4 questions.push({\n5   questionText:\
    \ \"Approximately how far away from the Earth is the Sun?\",\n6   answers: [\"\
    200 miles\", \"93,000,000 miles\", \"40,000,000 miles\", \"150,000 miles\"],\n\
    7   correctAnswerIndex: 1\n8 });\n9\n10 // QUESTION 2\n11 questions.push({\n12\
    \   questionText: \"How many planets are there in our solar system?\",\n13   answers:\
    \ [\"6\", \"7\", \"8\", \"9\"],\n14   correctAnswerIndex: 2\n15 });\n16\n17 //\
    \ QUESTION 3\n18 questions.push({\n19   questionText: \"Which of these is a moon\
    \ of Jupiter?\",\n20   answers: [\"Ganymede\", \"Miranda\", \"Enceladus\", \"\
    Mars\"],\n21   correctAnswerIndex: 0\n22 });\n23\n```\n\n```html\n1 <!DOCTYPE\
    \ HTML>\n2 <html>\n3   <head>\n4     <title>A Simple Quiz</title>\n5\n6     <script\
    \ type=\"text/javascript\" src=\"js/quizQuestions.js\"></script>\n7   </head>\n\
    8   <body>\n9\n10   </body>\n11 </html>\n12\n```\n\n6.  保存 JavaScript 文档，然后在编辑器中返回\
    \ HTML 文档。\n"
