    \ + \"</p>\");\n  document.write(\"<p>primitiveVar2 has value \" + primitiveVar2\
    \ + \"</p>\");\n  var primitiveVar1 = 12;\n  document.write(\"<p>primitiveVar1\
    \ now has value \" + primitiveVar1 + \"</p>\");\n  document.write(\"<p>primitiveVar2\
    \ now has value \" + primitiveVar2 + \"</p>\");\n</script>\n```\n\nAbove: Step\
