  md: "# Parameters of the AddEventListener() Method\n\n+   - **Event type**: The\
    \ first parameter indicates the type of event to listen for. This is a string\
    \ such as `'click'`, `'keydown'` or `'mouseover'`.\n\n+   - **Handler expression**:\
    \ Typically a reference to a handler function or method. Note that when referencing\
    \ a function or method, we do not include parentheses.\n\n+   - **Use capture**:\
    \ This is complex and beyond the scope of the book. Until you learn what this\
    \ does, always pass `false` to this parameter.\n\n```\nfunction clickHandler()\
    \ {\n    //do things in response to the click\n}\n\nvar myPara = document.createElement(\"\
    p\");\ndocument.body.appendChild(myPara);\nmyPara.addEventListener(\"click\",\
    \ clickHandler, false);\n```\n\nAbove: Adding an event listener to a `<p>` element.\n\
    \n# Adding Event Listeners\n\nWe've created our event handler, but it doesn't\
    \ do anything until triggered by an event listener.\n\n+   1. Open QuizQuestion.js\
    \ and locate the `for` loop within the `renderQuestion` method.\n\n```\nfor(var\
    \ i = 0; i < this.answers.length; i++) {\n    var answerPara = document.createElement('p');\n\
    \    answerPara.innerHTML = this.answers[i];\n    answerPara.id = 'a' + i;\n \
    \   answerPara.addEventListener('click', com.flametreepublishing.simplequiz.clickHandler,\
    \ false);\n    questionDiv.appendChild(answerPara);\n}\n```\n\nAbove: Step 2:\
    \ Enter the code shown here as described above.\n\n+   2. Create an empty line\
    \ after the one that sets the `answerPara.id` property and insert the code shown\
    \ in the illustration on the previous page.\n\n+   3. We don't include the parentheses\
    \ in the reference to the handler method. If we did, the expression would be evaluated\
    \ as a method call when the event listener is assigned – we want the expression\
    \ to be the name of the handler, not a call to it\n\n+   4. Save your work, open\
    \ simpleQuiz.html in Firefox and click an answer. At last – we have a working\
    \ quiz.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_62_0.png)\n\nAbove: After\
    \ all our hard work, we have a functioning quiz.\n\n# FINISHING TOUCHES\n\nLet's\
    \ add one more event listener and handler – they will start the application when\
    \ the page load completes.\n\n+   1. Create a new JavaScript document and save\
    \ it in your project's js folder as **quizStartup.js**. Enter our namespace declaration\
    \ at the top of the document.\n\n+   2. Add the event handler code shown in the\
    \ illustration on the next page. You should understand it by now – if not, download\
    \ our code examples and study the comments."
