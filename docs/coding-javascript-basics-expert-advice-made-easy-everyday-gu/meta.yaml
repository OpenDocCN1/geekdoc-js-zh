  md: '# # WRITING JAVASCRIPT


    As with HTML and CSS, JavaScript is plain text. This means that the simplest tool
    for writing JavaScript is the basic text editor built into your computer''s operating
    system (Notepad on Windows, TextEdit on a Mac or Vi on Linux).


    # ### IDEs


    Plain text editors work fine, but they pale into insignificance compared to a
    fully fledged IDE (Integrated development environment). IDEs help both with writing
    scripts - speeding up your work and helping to spot errors - and with managing
    the multitude of files associated with a website or larger project.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_9_0.png)


    Adobe Dreamweaver has code written in plain text (see figure - don''t use Rich
    Text!)


    # ### Popular Cross-Platform IDEs


    +   - **Adobe Dreamweaver**. When it comes to developing for the web, Dreamweaver
    is the daddy. It''s also the daddy price-wise, especially given Adobe''s controversial
    subscription-only licensing model. Weigh up your options wisely. www.adobe.com


    > **Hot Tip**


    If using TextEdit on a Mac as your JavaScript editor, be sure to switch all new
    documents to plain text mode before typing anything.


    +   - **Komodo IDE**. This fully featured commercial IDE costs $99.6775 for a
    single licence (at the time of writing) and is very popular, thanks to its clean,
    uncluttered interface and dock operation. http://komodoide.com

    - **Komodo Edit**. The cut-down version of Komodo IDE is free to download and
    use, and is an excellent choice for enjoying the benefits of an IDE. http://komodoide.com/komodo-edit

    - **Eclipse**. The powerful IDE can work with many different languages, including
    HTML, CSS and JavaScript. It is free to download and use, but can be overwhelming
    for the uninitiated. www.eclipse.org


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_9_1.png)


    Code folding allows you to collapse blocks of code you aren''t currently working
    on to simplify the surrounding code.


    Code hinting provides a list of available functions, variables and properties
    as you type.


    Built in reference information (some IDEs include language reference libraries)


    File management Built in file management features are available with larger projects'
