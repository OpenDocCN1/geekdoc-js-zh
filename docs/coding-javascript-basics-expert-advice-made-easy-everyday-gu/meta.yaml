    ### 不存在的数据


    JavaScript有两种数据类型用于表示不存在的数据。null类型，其值也是null，表示没有值——如果一个标识符求值为null，它不包含任何有效数据，或者最可能的是，它尚未被声明。第二种类型是undefined，其值也是undefined，与null略有不同——它是任何已声明但尚未赋值的变量的初始类型和值。


