  md: "![](img/9f289ad67d43b98b3bcc0d91197bccf6_37_0.png)\n\n# DO WHILE LOOPS\n\n\
    These loops are very similar to `while` loops, except the condition is evaluated\
    \ only after the statement block has been executed. If the condition resolves\
    \ to `true`, the statement block is repeated and the condition evaluated once\
    \ more. Here's how it looks:\n\n```\ndo {\n  statement(s);\n} while(condition);\n\
    ```\n\n# Elements of a For Loop\n\nThe three elements of a `for` loop are expressions\
    \ that control the reiteration of the loop:\n\n+   - **initialize**: This expression\
    \ is evaluated once and creates an initial index for the loop; the index is just\
    \ a number, typically used to count the number of loop iterations that have occurred.\n\
    - **condition**: This is the expression that is tested to see whether the loop\
    \ repeats or not. In most circumstances, the condition expression tests the value\
    \ of the index against some other value, such as an array's length.\n- **iteration**:\
    \ This expression is evaluated after the loop's statement block has been executed,\
    \ and its intended use is to modify the value of the index before the next iteration.\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_37_1.png)\n\n# FOR LOOPS\n\nThe `for`\
    \ loop is often used for processing the elements of an array, because it simplifies\
    \ executing the same statement block against each element in the array.\n\nThe\
    \ `for` loop's declaration can appear a little daunting – let's take a look at\
    \ it before analysing what it means:\n\n```\nfor (initialize ; condition ; iteration\
    \ ) {\n  statement(s);\n}\n```"
