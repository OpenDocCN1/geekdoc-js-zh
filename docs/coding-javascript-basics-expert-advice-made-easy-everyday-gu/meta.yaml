    This opening parenthesis is not matched by a closing parenthesis


    Above: This example''s second expression results in a syntax error.


    > Hot Tip

    When nesting parentheses, always make sure that each opening parenthesis ( is
    matched by a closing parenthesis ). A syntax error occurs if there is a mismatch.


    # Nesting Parentheses


    You will often find yourself needing to nest parentheses within parentheses, for
    example ((24 - 2) + 10) / 7. In this scenario, it is the deepest nested expression
    that is evaluated first, followed by the next deepest nested, and so on.'
