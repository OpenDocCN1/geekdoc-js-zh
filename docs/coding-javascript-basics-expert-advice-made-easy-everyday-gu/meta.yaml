  md: '# INTRODUCTION


    The JavaScript language has been with us since the very earliest days of the World
    Wide Web. In its early days it was merely one face in a crowd, one of many languages
    and technologies vying for the attention and evangelism of the web development
    community.


    # UNIVERSAL LANGUAGE


    Over the years, many such technologies have come into fashion before falling from
    grace for one reason or another, but not so JavaScript. Thanks largely to a combination
    of flexibility and ubiquitousness, JavaScript is now the principal scripting language
    of the internet.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_4_0.png)


    # STEP UP FROM HTML/CSS


    Despite JavaScript''s at-times esoteric nature, it is the perfect language to
    use for learning about coding in general. This book is aimed at people who are
    quite new to programming. You may have spent some time with HTML and CSS and want
    to step things up with JavaScript, or you may have tinkered with a bit of scripting
    and want to formalize and expand on that knowledge. You may even be an experienced
    programmer who has never used JavaScript and wants a quick overview to get started.


    # GO-TO PRIMER


    There''s no getting away from the fact that JavaScript is a deep subject, so much
    so that no single book can tell you all there is to know about the language. What
    this book aims to do, then, is to deliver a wide-ranging overview of the language,
    and give you sufficient understanding to be able to add your own simple scripts
    and interactions to your pages. It is also perfect as a primer for further studies
    in coding with JavaScript.


    # Online Samples


    You can download completed versions of all the book''s code examples and additional
    notes. To do so, visit www.flame treepublishing.com/book-samples.html.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_4_1.png)


    # Hot Tips


    Look out for the Hot Tips, which tell you about the many shortcuts and quick techniques
    available in JavaScript.'
