  md: '# # VARIABLES


    In essence, a variable is a portion of computer memory that''s used for storing
    data, and which is referred to using an identifier.


    # ## DECLARING A VARIABLE


    It''s very easy to declare a new variable in JavaScript – all we do is write the
    keyword var followed by the identifier we want to use to refer to the variable.
    For example:


    ```

    var theAnswer;

    ```


    # ### Assigning a Value to a Variable


    It is common to assign a value to a variable at the time it is declared, like
    this:


    ```

    var theAnswer = 42;

    ```


    # ### Changing the Value of a Variable


    Once a variable has been declared with var, we can change the value assigned to
    it like this: theAnswer = 54. Notice that we didn''t include the var keyword this
    time.


