    Above: Arrays can be created with the new keyword and always have a length.


    Above: We can access array elements, for both getting and setting a value using
    bracket access notation.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_20_0.png)


    ### Appending Elements to an Array


    The `push()` method of an array enables us to append elements to the end of that
    array (we discuss methods on page 102). For example, if we wished to append the
    string "Harry" to the array `firstNames`, we could write this as: `firstNames.push("Harry")`.


    ```html

    7   <body>

    8     <script type="text/javascript">

    9       var userNames = new Array("Helen", "Amrit", "Geoff", "Jacques");

    10      alert(userNames.length); //Displays ''4'' in the alert dialog

    11      userNames.push("Oliver");

    12      alert(userNames.length); //Displays ''5'' in the alert dialog

    13      alert(userNames[4]); //Displays ''Oliver'' in the alert dialog

    14    </script>

    15  </body>

    ```

    Above: The push method of an array adds an element to the end of the array.


    ### Removing Elements from an Array


    We can remove the first element in an array using the `shift()` method, or remove
    the last element using the `pop()` method. Whichever method you use, it will return
    the value that was removed.


    ```html

    7   <body>

    8     <script type="text/javascript">

    9       var userNames = new Array("Helen", "Amrit", "Geoff", "Jacques");

    10      userNames.push("Oliver");

    11      alert(userNames.length); //Displays ''5'' in the alert dialog

    12      var firstNameInArray = userNames.shift();

    13      alert(firstNameInArray); //Displays ''Helen'' in the alert dialog

    14      alert(userNames.length); //Displays ''4'' in the alert dialog

    15      var lastNameInArray = userNames.pop();

    16      alert(lastNameInArray); //Displays ''Oliver'' in the alert dialog

    17      alert(userNames.length); //Displays ''3'' in the alert dialog

    18    </script>

    19  </body>

    ```

    Above: The `shift()` and `pop()` methods of an array remove the first and last
    elements, respectively.


    ### Other Array Methods


    Arrays have many other methods that we use to manipulate their content – far too
    many to cover here. For a comprehensive list, visit www.w3schools.com/js/js_array_methods.asp.


    ## OBJECTS


    A variable of type object (a reference data type) is a variable in which we can
    store multiple values. Unlike the index-based access of an array, however, an
    object stores values against named properties (often called a property-value pair).'
