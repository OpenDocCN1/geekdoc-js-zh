    Reader, meet JavaScript - JavaScript, meet reader.


    In this chapter, we explain exactly what data is and how to work with it in JavaScript.


    Here, we explore how JavaScript is structured and how to use those structures
    in your own scripts.


    In this chapter, we look at creating reusable code using functions, and introduce
    Object Oriented Programming and classes in JavaScript.


    In the final chapter, we look at the final pieces in the JavaScript jigsaw: the
    Document Object Model, or DOM.


    ## SERIES FOREWORD


    Imagine you''ve just invented a language. It isn''t much like Java, and you don''t
    plan to use it for scripting. So you call it JavaScript. But this strangely-named
    language is so ubiquitous in the World Wide Web that you''d be hard pressed to
    find a web page that doesn''t use it. Along with HTML, Style sheets, SQL, and
    a server-side language like C# or VB, it''s one of many technologies you need
    to master to deliver engaging web content to the user. Being a web developer is
    a big ask.


    This book provides a highly accessible introduction to JavaScript, suitable for
    readers who have no previous programming experience. Building steadily in complexity,
    and never overwhelming the reader with excessive detail, it covers all the major
    language features – variables, loops, branches, functions, objects and so on,
    and introduces the Document Object Model – the formal model that specifies how
    a web page is represented, and how your JavaScript code can manipulate it before
    it is presented to the user.


    This is not a big book and you''ll read it in a few hours. But you''ll come out
    the end knowing enough of the language to build your own interactive web pages.


    But don''t take my word for it... turn the page.


    Chris Brown

    Linux Ambassador and Training Consultant


    ## INTRODUCTION


    The JavaScript language has been with us since the very earliest days of the World
    Wide Web. In its early days it was merely one face in a crowd, one of many languages
    and technologies vying for the attention and evangelism of the web development
    community.


    ### UNIVERSAL LANGUAGE


    Over the years, many such technologies have come into fashion before falling from
    grace for one reason or another, but not so JavaScript. Thanks largely to a combination
    of flexibility and ubiquitousness, JavaScript is now the principal scripting language
    of the internet.


    ### STEP UP FROM HTML/CSS


    Despite JavaScript''s at-times esoteric nature, it is the perfect language to
    use for learning about coding in general. This book is aimed at people who are
    quite new to programming. You may have spent some time with HTML and CSS and want
    to step things up with JavaScript, or you may have tinkered with a bit of scripting
    and want to formalize and expand on that knowledge. You may even be an experienced
    programmer who has never used JavaScript and wants a quick overview to get started.


    ### GO-TO PRIMER


    There''s no getting away from the fact that JavaScript is a deep subject, so much
    so that no single book can tell you all there is to know about the language. What
    this book aims to do, then, is to deliver a wide-ranging overview of the language,
    and give you sufficient understanding to be able to add your own simple scripts
    and interactions to your pages. It is also perfect as a primer for further studies
    in coding with JavaScript.


    ### Online Samples


    You can download completed versions of all the book''s code examples and additional
    notes. To do so, visit www.flametreepublishing.com/book-samples.html.


    ### Hot Tips


    Look out for the Hot Tips, which tell you about the many shortcuts and quick techniques
    available in JavaScript.


    ## MEET JAVASCRIPT


    ### JAVASCRIPT, HTML AND CSS


    There are three core languages used to develop web pages: HTML provides the underlying
    structure and content; CSS provides the visual scenery while JavaScript, well,
    JavaScript provides the magic that brings the whole thing to life.


    ### BEFORE WE START


    This book is concerned solely with JavaScript, yet the language is so deeply tied
    to web browsers and web pages that it is impossible to discuss it without relying
    heavily on prior knowledge of HTML and CSS. If you don''t already have such knowledge,
    the *Coding HTML & CSS Basics*, will get you up to speed with the requisite know-how.


    > **Hot Tip**

    > If in the context of HTML and CSS, you understand the meaning of terms such
    as element, attribute, opening and closing tags, selectors and style rules, then
    you''re good to go with JavaScript.


    Left: *Coding HTML & CSS Basics* will get you up to speed with the knowledge you
    need to comfortably dive into our book''s coverage.


    #### BROWSER COMPATIBILITY


    While the core JavaScript language is fully supported across all major browsers,
    problems can arise when using advanced or esoteric functions, because not all
    browsers support all of JavaScript''s extended functionality. There are ways and
    means to work around such issues but, unfortunately, there isn''t room here to
    cover them here.


    #### Firefox


    All of the examples in this book use standard JavaScript programming techniques
    and constructs. However, in order to sidestep any tiresome browser compatibility
    issues, we''ll be using the Firefox browser for running all examples, and encourage
    you to do the same.


    > **Hot Tip**

    > See page 7 to find out how to download completed versions of all the book''s
    code examples. These files include additional notes that help to further explain
    the examples.


    Above: such a beautiful piece of the most standards-compliant web browser currently
    available, and we insist you install one, you can download it from www.mozilla.org'
