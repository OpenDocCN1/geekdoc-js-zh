    \n## 运算符优先级\n\n考虑以下代码：`20 - 4 * 3`。这表示 `(20 - 4) * 3`（结果为 48），还是 `20 - (4 * 3)`（结果为\
    \ 8）？JavaScript 通过为每个运算符分配优先级来处理这种情况——优先级最高的运算符先计算，优先级最低的运算符最后计算。何不写一个脚本来验证哪种解释是正确的呢？\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_30_0.png)\n\n## 覆盖运算符优先级\n\n记住每个运算符的优先级可能相当困难，因此使用括号（小括号）来覆盖默认的运算符优先级通常更简单、也更明确。\n\
    \n括号内的任何表达式都会在同一语句中的其他所有表达式之前进行计算。考虑以下内容：`(24 - 2) / 7`。括号内的部分 `(24 - 2)` 先计算，结果\
    \ 22 再除以 7。\n\n```javascript\n1  <!DOCTYPE HTML>\n2  <html>\n3    <head>\n4  \
    \    <title>Nesting Parentheses</title>\n5    </head>\n6    <body>\n7      <script\
    \ type=\"text/javascript\">\n8        var myValue1 = ((22 / 7) + 10) - 3;\n9 \
    \       var myValue2 = 13 + (9 - 2 / (4 + 6));\n10     </script>\n11   </body>\n\
    12 </html>\n```\n\nIDE 检测到由缺少括号引起的语法错误：此开括号没有对应的闭括号。\n\n上例：本例中的第二个表达式导致语法错误。\n\
    \n> **温馨提示**\n> 嵌套括号时，务必确保每个开括号 `(` 都有对应的闭括号 `)`。如果不匹配，就会发生语法错误。\n\n## 嵌套括号\n\n\
    你经常会发现需要在括号内嵌套括号，例如 `((24 - 2) + 10) / 7`。在这种情况下，嵌套最深的表达式先计算，然后是次深的，依此类推。\n\n\
    ## 语句\n\n> 在 JavaScript 结构的最顶层，我们会发现语句。所有 JavaScript 指令都包含在语句中。\n\n### 什么是语句？\n\
    \nJavaScript 语句封装了一个或多个表达式，可以被视为脚本中的一个独立步骤或指令。脚本中的每条语句都会在下一个语句处理之前完整执行。\n\n###\
    \ 构成语句\n\n考虑以下简单表达式：`playerScore = 0;`。虽然这是一个表达式，但正如结尾的分号 `;` 所示，它也是一个语句。语句不必比这更复杂，但它们通常会更复杂。\n\
    \n```javascript\nplayerScore = 0;\n```\n\n上例：语句由一个或多个表达式组成。\n\n```javascript\n\
    document.write(\"Your score is \" + playerScore);\n```\n\n### 复合表达式\n\n我们通常会在一条语句中构建相当复杂的表达式堆栈，例如：`document.getElementsByTagName(\"\
    body\")[0].appendChild(document.createElement(\"p\")).innerHTML = 'Hello World!';`\n\
    \n这条语句说明了表达式auch表达式可以如何组合。它使用了 DOM 编程技术（在第 109 页介绍），以达到与我们编写的第一个脚本相同的结果。\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_31_0.png)\n\
    \n```javascript\ndocument.getElementsByTagName(\"body\")[0].appendChild(document.createElement(\"\
    p\")).innerHTML = \"Hello World!\";\n```\n\n> **温馨提示**\n> 像本页这样的复杂语句通常写起来容易得多，读起来难。事实上，一旦你掌握了\
    \ JavaScript 的要领，你可能会发现写这些语句有种奇怪的满足感——甚至可以说是种艺术。\n\n### 在复杂性与可读性之间取得平衡\n\n重要的是要理解，冗长而复杂的语句（如上面的例子）可以很容易地分解成一系列更短、更简单的语句。\n\
    \n我们所做的只是把表达式分配到更多的语句中。然而，为了在一个语句中与其他语句的运算符共享表达式的结果，我们需要将每条语句的结果存储在变量中，以便其他语句可以访问这些值。\n\
    \n### 在速度与可读性之间取得平衡\n\n创建和管理变量会增加解释器的工作量，因此包含多个表达式的复杂语句通常比将相同表达式分解成多个语句执行得更快。因此，虽然选择让语句简单还是复杂在很大程度上取决于个人偏好，但你确实需要考虑应用程序对性能的关键程度。\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_32_0.png)\n\n```javascript\n8 <script\
    \ type=\"text/javascript\">\n9 //This compound statement...\n10 document.getElementsByTagName(\"\
    body\")[0].appendChild(document.createElement(\"p\")).innerHTML = \"Hello World!\"\
    ;\n11 //...does the same as the following set of statements\n12 var bodyElementsArray\
