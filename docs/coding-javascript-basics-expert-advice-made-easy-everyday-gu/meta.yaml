    Above: Exploring JavaScript''s operator precedence rules.


    # OPERATOR PRECEDENCE


    Consider the following code: 20 - 4 * 3. Does this mean (20 - 4) * 3, which would
    evaluate to 48, or could it mean 20 - (4 * 3), which would evaluate to 8? JavaScript
    deals with this by assigning a precedence to each operator - the operator with
    the highest precedence is evaluated first; the operator with the lowest precedence
    last. Why not write a script to see which of the above is the correct solution?


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_30_0.png)


    # Overriding Operator Precedence


    Remembering the precedence of every operator can be quite challenging, so it''s
    often easier and less ambiguous to override the default operator precedence using
    parentheses (brackets).


    Any expression contained within parentheses is evaluated before all other expressions
    in the same statement. Consider the following: (24 - 2) / 7. The section in parentheses,
    (24 - 2), is evaluated first, and the result, 22, is then divided by 7.


    ```

    1  <!DOCTYPE HTML>

    2  <html>

    3    <head>

    4      <title>Nesting Parentheses</title>

    5    </head>

    6    <body>

    7      <script type="text/javascript">

    8        var myValue1 = ((22 / 7) + 10) -3;

    9        var myValue2 = 13 + (9 - 2 / (4 + 6));

    10     </script>

    11   </body>

    12 </html>

    ```


    IDE detected syntax error caused by missing parenthesis


    This opening parenthesis is not matched by a closing parenthesis


    Above: This example''s second expression results in a syntax error.


    > Hot Tip

    When nesting parentheses, always make sure that each opening parenthesis ( is
    matched by a closing parenthesis ). A syntax error occurs if there is a mismatch.


    # Nesting Parentheses


    You will often find yourself needing to nest parentheses within parentheses, for
    example ((24 - 2) + 10) / 7. In this scenario, it is the deepest nested expression
    that is evaluated first, followed by the next deepest nested, and so on.'
  - '[PAGE 31]


    # STATEMENTS


    > At the top level of JavaScript''s anatomy, we find the statement. All JavaScript
    instructions are contained within statements.


    # WHAT IS A STATEMENT?


    A JavaScript statement encapsulates one or more expressions, and can be thought
    of as a discrete step or instruction within a script. Each statement in a script
    is executed in its entirety before the next statement is processed.


    # Making a Statement


    Consider the following simple expression: playerScore = 0;. While this is an expression,
    it is also a statement, as indicated by the terminating semicolon ;. A statement
    need not be any more complex than this, but they often are.


    ```

    playerScore = 0;

    ```


    Above: Statements comprise one or more expressions.


    ```

    document.write("Your score is " + playerScore);

    ```


    # Compound Expressions


    We often build up quite complicated stacks of expressions within a statement,
    for example: document.getElementsByTagName("body")[0].appendChild(document.createElement("p")).innerHTML
    = ''Hello World!'';


    This statement illustrates how expressions can be combined. It uses DOM programming
    techniques, introduced on page 109, to achieve the same outcome as the first script
    we wrote.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_31_0.png)


    ```

    document.getElementsByTagName("body")[0].appendChild(document.createElement("p")).innerHTML
    = "Hello World!";

    ```


    > Hot Tip

    Complex statements like the one on this page are usually much easier to write
    than to read. In fact, once you''ve got the hang of JavaScript, you''ll probably
    find writing them to be curiously satisfying – even artistic.


    # Balancing Complexity Against Legibility


    It''s important to understand that lengthy and convoluted statements, such as
    the one above, can quite easily be broken down into a series of shorter, simpler
    statements.'
  - '[PAGE 32]


    All we do is distribute the expressions among more statements. However, in order
    to share the results of the expressions in one statement with the operators in
    another, we would need to store the result of each statement in a variable, so
    that the other statements have access to those values.


    # Balancing Speed Against Legibility


    Creating and managing variables adds to the interpreter''s workload, so complex
    statements comprising multiple expressions are generally executed more quickly
    than the same expressions broken down into multiple statements. So while choosing
    how simple – or complex – to make your statements is largely down to personal
    preference, you do need to think about how performance-critical the application
    is.


