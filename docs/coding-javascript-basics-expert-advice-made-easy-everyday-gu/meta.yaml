    ## THE PRIMITIVE DATA TYPES


    Let''s take a look at the primitive data types. Remember, variables of these types
    represent a single value.


    ### Booleans


    Booleans represent a single bit of computer data and as such are simplest data
    type there is. A Boolean can have a value of either false or true, represented
    within the computer as 0 or 1, respectively.


    ### Numbers


    Generally, in computing there are two types of number: integers and floats. The
    former are whole numbers, and the latter are numbers that involve a fractional
    or exponential component, such as 3.14 or $0.945 \times 10^7$. JavaScript doesn''t
    worry itself with such distinctions – a number is a number.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_17_0.png)


    ### Strings


    Strings are text data – don''t worry about why they''re called strings (it gets
    technical in ways we don''t need to worry about); just know that a string is text,
    and text is a string.


    When writing strings into scripts, they have to be surrounded by quotation marks.
    These can be single '' or double " quotes (we''ll be using the latter), but it''s
    vital that a string is closed by the same style of quotation mark that it was
    opened with.


    > **Hot Tip**

    > If a string is enclosed by single quotes '', it can contain double quotes ",
    and vice versa.


    An empty string – a string with no characters in it – is normally written as a
    pair of quotation marks.


    ```javascript

    '' '' or " ".

    ```


    ```html

    1 <!DOCTYPE HTML>

    2 <html>

    3  <head>

    4    <title>Using Quotes in Strings</title>

    5  </head>

    6

    7  <body>

    8    <script type="text/javascript">

    9      var anyString = ""; //"" creates an empty string

    10     anyString = ''A string can be demarked by single quotes...'';

    11     anyString = "...or it can be demarked by double quotes.";

    12     anyString = ''A string demarked by single quotes "can" contain double quotes'';

    13     anyString = "A string demarked by double quotes ''can'' contain single
    quotes";

    14   </script>

    15

    16  </body>

    17 </html>

    18

    ```

    Above: Different ways of using quotation marks with strings.


    ### Non-existent Data


    JavaScript has two data types for representing non-existent data. The null type,
    whose value is also null, indicates that there is no value – if an identifier
    evaluates to null, it doesn''t contain any valid data or, most likely, it hasn''t
    been declared. The second type is undefined, whose value is also undefined, and
    is slightly different to null – it is the initial type and value of any variable
    that has been declared but, not yet, had a value assigned to it.


    ## ARRAYS


    Arrays are a reference data type; array is JavaScript parlance for a list of values.
    There are two ways in which to create one.


    ### Writing an Array Literal


    We can create an array by writing an array literal, like this:


    ```javascript

    var myArray = [value_1, value_2, ..., value_n]

    ```


    ```html

    1 <!DOCTYPE HTML>

    2 <html>

    3  <head>

    4    <title>Array Examples</title>

    5  </head>

    6

    7  <body>

    8    <script type="text/javascript">

    9      var emptyArray = [];

    10     var numbersArray = [42, 12, 57, 3.14, 981582, 5];

    11     var stringsArray = ["Harry", "Sue", "Julia", "Chris", "Oliver"];

    12     var mixedArray = ["Oliver", true, false, 5];

    13     var arraysArray = [emptyArray, numbersArray, stringsArray, mixedArray];

    14   </script>

    15  </body>

    16 </html>

    ```

    Above: Arrays store lists of other data (including other arrays).


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_19_0.png)


    The square brackets [ ] mark the start and end of the array, while the values
    to store within the array – its elements – are separated by commas and can be
    of any data type. To create an empty array, we just type the brackets with no
    elements within them.


    ### Creating an Array with the New Keyword


    We can also create an array using the new keyword: `var myArray = new Array();`.
    Initial elements, separated by commas, can be included between the parentheses.
    (We discuss keywords on page 50.)


    ### Array Length


    The number of elements within an array is referred to as its length. If we have
    an array called `myArray`, we can get its length by typing `myArray.length`.


    ### Accessing Array Elements


    Each element in an array has an index, this being a number that refers to the
    position of the element within the array. The first element has an index of 0,
    the second an index of 1 and so on. To access a specific element of an array,
    we write the array variable''s name followed by the index number wrapped in square
    brackets. For example, if we want to use the third element (index 2) of the array
    `myArray`, we write `myArray[2]`.


    > **Hot Tip**

    > Array elements can contain any data type you like – including other arrays.


    ### Adding Elements to an Array


    We can also assign values to elements of an array using square brackets. For example,
    to set the eighth element (index 7) of the array `myArray`, we could type `myArray[7]
    = 19;`. If the eighth element already contains data, it is overwritten with the
    new value. Or, if the array''s length is less than 8, the new element is created,
    as are any empty elements required to pad between the last element of the unmodified
    array and the newly added element.


    ```html

    1 <!DOCTYPE HTML>

    2 <html>

    3 <head>

    4 <title>Array Examples</title>

    5 </head>

    6

    7 <body>

    8 <script type="text/javascript">

    9 var userNames = new Array("Helen", "Amrit", "Geoff", "Jacques");

    10 var userLogins = new Array();

    11 alert(userNames.length); //Displays ''4'' in the alert dialog

    12 alert(userLogins.length); //Displays ''0'' in the alert dialog

    13 </script>

    14 </body>

    15 </html>

    16

    ```


    ```html

    7 <body>

