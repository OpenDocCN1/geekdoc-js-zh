  md: "# DOM PROGRAMMING\n\nJavaScript’s DOM classes, such as HTMLDocument and HTMLElement,\
    \ provide numerous methods for manipulating a loaded page, and expose properties\
    \ that directly map to HTML attributes. For example, a `<p>` element is represented\
    \ in the DOM by an HTMLElement object. Any attributes defined on the `<p>` element\
    \ are available to JavaScript as properties of the corresponding object; any properties\
    \ defined by JavaScript on the object become attribute values of the `<p>` element.\n\
    \n```\nvar paraElement = document.createElement('p');\nparaElement.id = 'para1';\n\
    paraElement.className = 'articlePara';\nparaElement.style = 'color:#FFCC00';\n\
    paraElement.innerHTML = 'Hello World!';\n// <p id=\"para1\" class=\"articlePara\"\
    \ style=\"color:#FFCC00;\">Hello World!</p>\n```\n\nAbove: Attributes of an HTML\
    \ element become properties of the corresponding DOM object, and vice versa.\n\
    \n# Retrieving Elements from the DOM\n\nAs we’ve seen, all HTML elements (with\
    \ the exception of `<html>`) have to be nested within another element. Therefore,\
    \ to add a new element to a page with JavaScript, we often have to retrieve the\
    \ element from the DOM that will serve as the parent of the new element. At other\
    \ times, we may want to apply, say, a style change to all elements of a certain\
    \ type.\n\nThe methods for getting elements are defined on the single HTMLDocument\
    \ instance, the top level of the DOM. We have already been using this object in\
    \ our scripts – every time we type document, we are accessing this HTMLDocument\
    \ object.\n\n# Adding Elements to the DOM\n\nLet’s explore DOM programming by\
    \ updating the QuizQuestion class’s renderQuestion method.\n1. Open QuizQuestion.js\
    \ in your editor and locate the renderQuestion method.\n2. Currently, this method\
    \ uses document.write to output a literal HTML string to the page. This technique\
    \ only works if the method is executed while the page is loading – let’s fix that.\n\
    \n```\n36  \n37  com.flom treepublishing.QuizQuestion.prototype.renderQuestion\
    \ = function() {\n38      document.write(\"<h3>QUESTION \" + this.questionNum\
    \ + \"</h3>\");\n39      document.write(\"<p>\" + this.questionText + \"</p>\"\
    );\n40      document.write(\"<p>A: \" + this.answers[0] + \"</p>\");\n41     \
    \ document.write(\"<p>B: \" + this.answers[1] + \"</p>\");\n42      document.write(\"\
    <p>C: \" + this.answers[2] + \"</p>\");\n43      document.write(\"<p>D: \" + this.answers[3]\
    \ + \"</p>\");\n44  }\n45  \n```\n\nAbove: This method won’t work once the page\
    \ has loaded.\n\n+   3. Delete the body of the renderQuestion method.\n4. On-screen,\
    \ we’re going to lay out each question inside a `<div>` element – the code in\
    \ the illustration below shows you how to create one. Note that this new `<div>`\
    \ is not yet part of the page – it’s created off-screen, where it stays until\
