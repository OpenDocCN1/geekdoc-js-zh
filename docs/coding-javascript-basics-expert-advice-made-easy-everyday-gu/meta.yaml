  md: '# STATEMENTS


    > At the top level of JavaScript''s anatomy, we find the statement. All JavaScript
    instructions are contained within statements.


    # WHAT IS A STATEMENT?


    A JavaScript statement encapsulates one or more expressions, and can be thought
    of as a discrete step or instruction within a script. Each statement in a script
    is executed in its entirety before the next statement is processed.


    # Making a Statement


    Consider the following simple expression: playerScore = 0;. While this is an expression,
    it is also a statement, as indicated by the terminating semicolon ;. A statement
    need not be any more complex than this, but they often are.


    ```

    playerScore = 0;

    ```


    Above: Statements comprise one or more expressions.


    ```

    document.write("Your score is " + playerScore);

    ```


    # Compound Expressions


    We often build up quite complicated stacks of expressions within a statement,
    for example: document.getElementsByTagName("body")[0].appendChild(document.createElement("p")).innerHTML
    = ''Hello World!'';


    This statement illustrates how expressions can be combined. It uses DOM programming
    techniques, introduced on page 109, to achieve the same outcome as the first script
    we wrote.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_31_0.png)


    ```

    document.getElementsByTagName("body")[0].appendChild(document.createElement("p")).innerHTML
    = "Hello World!";

    ```


    > Hot Tip

    Complex statements like the one on this page are usually much easier to write
    than to read. In fact, once you''ve got the hang of JavaScript, you''ll probably
    find writing them to be curiously satisfying – even artistic.


    # Balancing Complexity Against Legibility


    It''s important to understand that lengthy and convoluted statements, such as
    the one above, can quite easily be broken down into a series of shorter, simpler
    statements.'
