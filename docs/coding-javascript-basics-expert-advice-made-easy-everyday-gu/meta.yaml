    # DATA TYPES


    > All data handled by JavaScript has a data type. This specifies the nature of
    the data being handled - whether it''s a number, text, a list and so on.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_15_0.png)


    # WHAT IS A DATA TYPE?


    In order to translate a piece of data into anything useful, a computer or program
    has to know what the data is intended to represent - it has to know the type of
    the data. Because data is stored in variables, we normally refer to variables
    as having a data type, or as being of type so and so. Data types fall into two
    groups: primitive and reference. Let''s take a look at what that means.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_15_1.png)


    # DATA MECHANICS


    Unlike lower-level programming languages such as C and Java, JavaScript does not
    require the programmer to get involved in the details of how data is stored on
    the computer - the interpreter manages such intricacies for us.


    However, you should still appreciate that everything your computer does - every
    email you write, every song you listen to, every video you watch - is represented
    by numbers.


    Therefore, at the most fundamental level, all computer data is just numbers.


    > The binary and hexadecimal number systems are intrinsically tied to the way
    computers represent numbers and data - look them up on Wikipedia if you don''t
    know how they work.'
