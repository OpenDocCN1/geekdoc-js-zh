  md: '# # JAVASCRIPT, HTML AND CSS


    There are three core languages used to develop web pages: HTML provides the underlying
    structure and content; CSS provides the visual scenery while JavaScript, well,
    JavaScript provides the magic that brings the whole thing to life.


    # ## BEFORE WE START


    This book is concerned solely with JavaScript, yet the language is so deeply tied
    to web browsers and web pages that it is impossible to discuss it without relying
    heavily on prior knowledge of HTML and CSS. If you don''t already have such knowledge,
    the *Coding HTML & CSS Basics*, will get you up to speed with the requisite know-how.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_6_0.png)


    > > **Hot Tip**

    > If in the context of HTML and CSS, you understand the meaning of terms such
    as element, attribute, opening and closing tags, selectors and style rules, then
    you''re good to go with JavaScript.


    Left: *Coding HTML & CSS Basics* will get you up to speed with the knowledge you
    need to comfortably dive into our book''s coverage.


    # ### BROWSER COMPATIBILITY


    While the core JavaScript language is fully supported across all major browsers,
    problems can arise when using advanced or esoteric functions, because not all
    browsers support all of JavaScript''s extended functionality. There are ways and
    means to work around such issues but, unfortunately, there isn''t room here to
    cover them here.


    # #### Firefox


    All of the examples in this book use standard JavaScript programming techniques
    and constructs. However, in order to sidestep any tiresome browser compatibility
    issues, we''ll be using the Firefox browser for running all examples, and encourage
    you to do the same.


    > > **Hot Tip**

    > See page 7 to find out how to download completed versions of all the book''s
    code examples. These files include additional notes that help to further explain
    the examples.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_6_1.png)


    Above: such a beautiful piece of the most standards-compliant web browser currently
    available, and we insist you install one, you can download it from www.mozilla.org'
