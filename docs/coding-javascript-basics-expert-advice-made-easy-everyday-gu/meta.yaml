    \ JavaScript 的关键角色之一。\n\n## JavaScript 事件模型\n\nJavaScript 中有几种不同的事件模型，它们经过多年发展而来。我们无法一一介绍，因此将重点介绍当前的最佳实践模型，即\
    \ W3C 模型。这不是最简单的模型，但却是你应该力求使用的模型。\n\n> **实用技巧**\n>\n> 如果你想深入了解所有 JavaScript 事件模型，可以在\
    \ www.quirksmode.org/js/introevents.html 找到精彩的讨论。\n\n## 什么是事件？\n\n事件是浏览器发出的消息。事件总是有一个类型——类型表明了事件的性质——是点击、页面加载、按键等。例如，点击页面中的任何元素都会导致该元素发送（或分发）一个类型为\
