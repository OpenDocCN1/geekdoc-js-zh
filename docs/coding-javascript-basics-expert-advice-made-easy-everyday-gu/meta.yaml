    Above: Exploring JavaScript''s operator precedence rules.


    # OPERATOR PRECEDENCE


    Consider the following code: 20 - 4 * 3. Does this mean (20 - 4) * 3, which would
    evaluate to 48, or could it mean 20 - (4 * 3), which would evaluate to 8? JavaScript
    deals with this by assigning a precedence to each operator - the operator with
    the highest precedence is evaluated first; the operator with the lowest precedence
    last. Why not write a script to see which of the above is the correct solution?


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_30_0.png)


    # Overriding Operator Precedence


    Remembering the precedence of every operator can be quite challenging, so it''s
    often easier and less ambiguous to override the default operator precedence using
    parentheses (brackets).


    Any expression contained within parentheses is evaluated before all other expressions
    in the same statement. Consider the following: (24 - 2) / 7. The section in parentheses,
    (24 - 2), is evaluated first, and the result, 22, is then divided by 7.


    ```

    1  <!DOCTYPE HTML>

    2  <html>

    3    <head>

    4      <title>Nesting Parentheses</title>

    5    </head>

    6    <body>

    7      <script type="text/javascript">

    8        var myValue1 = ((22 / 7) + 10) -3;

    9        var myValue2 = 13 + (9 - 2 / (4 + 6));

    10     </script>

    11   </body>

    12 </html>

    ```


