    \ 由此产生的结果是，我们可以在全局命名空间中创建一个对象，然后在这个对象内部定义我们所有的变量和函数。这样我们的名称就不会污染全局命名空间，而且如果我们明智地选择命名空间对象的名称，就不会与其他脚本中使用相同的名称。\n\
