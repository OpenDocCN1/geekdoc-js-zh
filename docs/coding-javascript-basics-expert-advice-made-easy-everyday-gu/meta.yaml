- img_proc: true
  md: "# The Else If Clause\n\nWe can introduce a new conditional test in the event\
    \ that the previous test evaluates to false.\n\nThe general form looks like this:\n\
    \n```\nif (condition) {\n  statement(s);\n} else if (condition) {\n  statement(s);\n\
    }\n```\n\nWe can add as many `else if` clauses as we like, and also conclude with\
    \ a final `else` clause that executes only when all preceding conditions evaluate\
    \ to `false`.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_35_0.png)\n\nAbove:\
    \ The `else if` clause allows multiple conditional tests in an `if` statement.\n\
    \n# THE SWITCH STATEMENT\n\nUsing `switch` is similar to `if`, but rather than\
    \ testing a condition for true or false, a switch statement selects a block of\
    \ code to execute based on the result of the condition expression. The values\
    \ to test for are specified in `case` sections. The general form is:\n\n```\n\
    switch(condition) {\n  case label_1:\n    statement(s);\n    break;\n  case label_2:\n\
    \    statement(s);\n    break;\n  default:\n    statement(s);\n    break;\n}\n\
    ```\n\n# How a Switch Statement Works\n\nWhen the interpreter encounters a `switch`\
    \ statement, it evaluates the condition expression and then looks in the switch\
    \ block for a `case` label that matches the condition's result. If a match is\
    \ found, all following statements are executed, including those contained in subsequent\
    \ `case` sections.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_35_1.png)\n\nAbove:\
    \ The flow of a `switch` statement.\n\n# NESTING IF STATEMENTS\n\nThe `else if`\
