  md: "# BREAKING FROM A CASE SECTION\n\nIn order to prevent subsequent case sections\
    \ from being executed, we include a break keyword at the end of each case. This\
    \ tells the interpreter to cease processing the statement block and resume execution\
    \ at the first statement following the block.\n\n**Hot Tip**\n\nIf you find that\
    \ a structure of if-else-if statements is becoming too cumbersome to manage, a\
    \ switch statement may be a more suitable approach.\n\n# DEFAULT CASE\n\nA switch\
    \ statement can contain a special default section that is always triggered if\
    \ encountered. This is typically placed at the end of the switch so that it is\
    \ selected only if no case labels match the condition expression.\n\n# LOOP STATEMENTS\n\
    \nWe often need to run the same set of statements against a collection of different\
    \ values, or repeat statements a certain number of times – this is where loops\
    \ come in.\n\n# WHILE LOOPS\n\nThe simplest form of loop statement is known as\
    \ the while loop. Its general form is:\n\nwhile(condition) {\n    statement(s);\n\
    }\n\n**Hot Tip**\n\nCaution: if you code loops incorrectly, you may trigger an\
    \ infinite loop, where the interpreter gets stuck processing the same loop statement\
    \ indefinitely.\n\n```\n<script type=\"text/javascript\">\n    //Imagine that\
    \ an object named mediaObject exists on the page.\n    //mediaObject could refer\
    \ to a video file or to an audio file,\n    //but when writing the code we don't\
    \ know which it will be.\n    switch(mediaObject.mediaType) {\n        case \"\
    video\":\n            alert(\"You are about to access a video\");\n          \
    \  //statements that cause the video to load and play\n            break;\n  \
    \      case \"audio\":\n            alert(\"You are about to access an audio recording\"\
    );\n            //statements that cause the audio to load and play\n         \
    \   break;\n        default:\n            alert(\"Cannot determine the media type\"\
    );\n    }\n</script>\n```\n\nIf the condition evaluates to true, the statement(s)\
    \ contained in the code block following the condition are executed, then the condition\
    \ is tested again. If still true, the process is repeated. This continues until\
    \ the condition evaluates to false.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_36_0.png)\n\
    \n*Above: This imaginary script shows how a switch statement can be used.*\n\n\
    *Above: The flow of a while loop.*"
