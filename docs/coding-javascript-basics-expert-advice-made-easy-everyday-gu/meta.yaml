  md: '# Implicit Casting


    JavaScript is very proactive when it comes to managing data types, and automatically
    casts between types depending on the context in which they are being used (see
    page 55 for an example of this).


    # Explicit Casting


    We can also explicitly cast some data types, most often used when casting between
    strings and numbers. To cast a number to a string, for example, we would write
    `String(42)`, giving the result "42". Conversely, to cast a string to a number,
    we would write `Number("42")`, resulting in 42.


    ```

    1 var myNumber = 42;

    2 var myString = "549";

    3 var myName = "Sajid";

    4

    5 var test1 = myNumber + myString;

    6 alert(test1); //Shows ''42549'' in the alert box

    7

    8 var test2 = myNumber + Number(myString);

    9 alert(test2); //Shows ''591'' in the alert box

    10

    11 var test3 = myString + myName;

    12 alert(test3); //Shows ''549Sajid'' in the alert box

    13

    14 var test4 = myNumber + Number(myName);

    15 alert(test4); //Shows ''NaN'' in the alert box

    16

    17 var test5 = String(myNumber) + myName;

    18 alert(test5); //Shows ''42Sajid'' in the alert box

    19

    20

    ```


    Above: This code highlights how and why we might explicitly cast between data
    types.


    # The Special NaN Number


    Not all values can be converted to a number – for example, the string "foo" has
    no numeric meaning.


    If we cast this string to a number, we''d get the result `NaN` (Not a Number).
    Despite the name, this is indeed a number, and can be used anywhere that a number
    is allowed or expected. However, any calculations that include `NaN` always evaluate
    to `NaN` themselves.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_23_0.png)


    # Results of Casting Different Data Types


    This table shows the results of casting between different data types. Read the
    table as ''casting from row title to column title''.


    | | Boolean | number | string |

    |---|---|---|---|

    | Boolean | - | false is 0, true is 1 | ''false'' "false". true is "true" |

