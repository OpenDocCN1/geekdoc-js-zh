    ## CLASS METHODS


    A method is similar to a function. In simple terms, where a function is a stand
    alone entity that can have objects passed to it, a method is part and parcel of
    an object, and operates from the context of that object.


    We’ve already met a few methods of the built-in classes – for example, the `push()`
    method of the array class. When we call `push()`, we do so via an instance of
    the array class: `myArray.push(newValue);` hence it is a method.


    ## The Prototype Object


    As has been mentioned previously, the JavaScript object class holds an exalted
    place within the language – it is the class upon which all other classes are based.
    The upshot is that all other classes, including our own custom classes, inherit
    the methods and properties of the object class. One such property is called `prototype`
    – this is where the methods of a class should be defined. Let’s see how.


