    ## ADAM CRUTE

    SERIES FOREWORD BY CHRIS BROWN


    ## CONTENTS


    - SERIES FOREWORD .................... 5

    - INTRODUCTION ....................... 6

    - MEET JAVASCRIPT .................... 8

    - DATA IN JAVASCRIPT ................ 22

    - ANATOMY OF JAVASCRIPT ............. 46

