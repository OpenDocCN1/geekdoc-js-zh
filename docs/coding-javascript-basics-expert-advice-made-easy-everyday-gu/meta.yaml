    \ 28);\n```\n\n上图：具名函数和匿名函数的调用方式相同。\n\n## 变量作用域\n\n当变量在任何函数或语句块之外声明时，它可以从网页的任何地方访问，因此被称为**全局变量**。另一种表达方式是，该变量存在于**全局作用域**（global\
