  md: '# JAVASCRIPT SYNTAX


    A script can consist of a single instruction or it can be an epic tome containing
    thousands of lines of code. No matter the size though, all scripts in JavaScript
    share a common structure and syntax.


    # CASE SENSITIVITY


    The first thing to note is that JavaScript is case sensitive, i.e. lower-case
    characters are considered to be distinct from their upper-case counterparts. For
    example, the identifier `"myVariable"` is not the same as `"MyVariable"` (notice
    the different capitalizations).


    ```

    00 com.flamerepublishing.simpleQuiz.prototype.addQuestion = function() {

    01   // QUESTION 1

    02   this.questions.push(

    03     new com.flamerepublishing.QuizQuestion(

    04       1,

    05       "Approximately how far away from the Earth is the Sun?",

    06       ["200 miles", "93,000,000 miles", "49,000,000 miles", "150,000 miles"],

    07       1

    08     )

    09   );

    10   // QUESTION 2

    11   this.questions.push(

    12     new com.flamerepublishing.QuizQuestion(

    13       2,

    14       "How many planets are there in our Solar System?",

    15       ["6", "7", "8", "9"],

    16       2

    17     )

    18   );

    19   // QUESTION 3

    20   this.questions.push(

    21     new com.flamerepublishing.QuizQuestion(

    22       3,

    23       "Which of these is a Moon of Jupiter?",

    24       ["Ganymede", "Miranda", "Enceladus", "Mars"],

    25       0

    26     )

    27   );

    28 }

    ```


    Above: Indented code is easier to read because it helps to group sections of related
    code visually.


    # WHITE SPACE


    Leading spaces and tabs are ignored in JavaScript. This enables us to use code
    indenting in our code, which is a technique that helps make the code more organized
    and human-readable.


    # SEMICOLONS


    JavaScript statements are normally terminated by a semicolon (;) but do not have
    to be. Where semicolons are omitted, the interpreter assumes line breaks mark
    the end of a statement. However, omitting semicolons can lead to ambiguity in
    your code, so best practice is to terminate every statement with a semicolon.


    ```

    1  //Inline comments start with ''//'' and end at the next line break

    2

    3  var userScore = 0; //They can be written on the same line as other code

    4

    5  //alert(userScore); //They can also be used to disable lines of code

    6

    7

    8

    ```


    Above: Inline comments end at the line break that follows the comment.


    # COMMENTS


    A comment is a section of script that is ignored by the interpreter. Comments
    are used for adding notes and explanations to scripts, helping others understand
    them, and acting as notes-to-self when revisiting a script months after writing
    it.


    # Inline Comments


    An inline comment starts with // and continues until the next line break. They
    can be placed on their own line or on a line following other JavaScript code.


    Hot Tip: Comments are commonly used to disable sections of a script - very useful
    when experimenting with new ideas or attempting to hunt down bugs.'
