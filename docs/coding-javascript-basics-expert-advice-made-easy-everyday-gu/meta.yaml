    ## Object Oriented Programming


    > Object oriented programming – OOP – is an approach to programming that places
    objects at the heart of everything. While JavaScript is not a true OOP language,
    because it lacks specific constructs that are requirements for true OOP, it can
    be – and normally is – used in an OOP style.


    ## Why Use OOP Techniques?


    Far too many words have been written by others about the relative merits and drawbacks
    of OOP compared to other approaches to programming – and we''re not going to add
    to them. Suffice it to say that one of the most compelling features of OOP is
    that it organizes things in much the same way as our human brains do. For this
    reason if no other, it is the most widely used approach to programming.


    ## How We Classify Things


    When we think about a thing in the physical world, that thing is normally part
    of a family of similar things; this family is in turn part of a larger grouping,
    and so on. These groupings classify the thing we were thinking about in the first
    place.


    For example, we could classify a spaniel as a dog, as domesticated, as a mammal,
    as an animal, and as a living thing. This gives a chain of classification that
    defines something dog-like. Each point in that chain specifies characteristics
    that hone the definition — the number of legs an animal has, for instance, or
    the smoothness of a dog''s fur.


    With sufficient classification and definition of characteristics, we can determine
    that something is a spaniel as opposed to anything else in the entire universe;
    we do this without even thinking about it...


    ## Classes in OOP


    OOP harnesses exactly this system of hierarchical classification. We write scripts
    called classes that define properties. The properties describe the characteristics
    of — and are intrinsic to — the class. Classes also define methods, these being
    functions that operate on objects of the class.


    A class inherits the properties and methods of its ancestor classes, taking on
    aspects of their characteristics and behaviour. This is much like a spaniel''s
    inherent spaniel-ness being a function of the compounded characteristics and classifications
    it belongs to.


    ### Constructors and Instances


    The code you write in a class script is like a template — it describes the properties
    and methods that define objects of that class.


    Above: how we classify things we also structure. Above: this general world classification
    is mirrored in software structure within OOP.


    However, this class definition is not an object of that class – to create one
    of those, we must call the class''s **constructor** function, because it is this
    that generates an object from the class definition. This generated object is known
    as an **instance** of the class, so the act of calling the class constructor is
    often referred to as **instantiating** the class.


    ### A Massive Topic


    OOP is a very deep subject that we aren''t going to delve into – if it''s something
    you want to explore, Google ''OOP'' and take your pick from the thousands of results.


    What we are going to do, though, is find out how to create and use basic custom
    classes in JavaScript.


    ## JavaScript Classes


    We''ve already been working with JavaScript classes – **number**, **string** and
    **array** are all built-in classes. They all inherit some of their characteristics
    from the **object** class – in OOP parlance, this makes **object** the **superclass**
    of those other classes.


    We''ve also been working with class methods: for example, `write` is a method
    of the HTMLDocument class – we''ve used it as `document.write()`. (`document`
    is an instance of the HTMLDocument class.) These classes are built into the language,
    but we can also build our own.


    ### Defining a Custom Class


    The questions in our Simple Quiz application are currently defined in generic
    objects – let''s develop a **QuizQuestion** class instead.


