    Above: Step 3: Define the constructor function as shown here.


    ## Creating an Instance


    Now that the constructor is defined, we can create a QuizQuestion instance by
    using the new keyword, like this:


    ```

    new com.flametreepublishing.QuizQuestion(arguments);

    ```


    Recall that the QuizQuestion constructor function expects four arguments to be
    passed to it: the question number, the question text, the array of possible answers,
    and the index of the correct answer. These all need to be included within the
    parentheses following the constructor name when instantiating the class – we''ll
    come back to this shortly.


    > Hot Tip

    > By convention, we name classes with a leading upper-case character, and instances
    with a leading lower-case character.


    - 4. As you see, the constructor expects four parameters. These correspond to
