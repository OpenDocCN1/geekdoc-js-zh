    # SIMULATING NAMESPACES IN JAVASCRIPT


    Unlike some languages, JavaScript does not have formal notation for creating namespaces.
    However, remember that everything in JavaScript is an object – an upshot of this
    is that we can create an object in the global namespace and then define all of
    our variables and functions within this object. Our names don’t pollute the global
    namespace, and if we choose the namespace object’s name wisely, we won’t end up
    using the same one as is used in other scripts.


    # What is a Name Clash?


    A name clash occurs when a name given to an object in a page is used by another
    object within the same page. Any expression that uses this name may not get back
    the data it expects or requires, leading to hard-to-trace bugs and errors.


    # Pollution of the Global Namespace


    The name of every named function and every global variable exists within the global
    namespace. With large projects, this namespace can become littered with many different
    names. Having third-party scripts in a page can make matters considerably worse.
    The more polluted the global namespace becomes, the more likely that you will
    encounter name clashes.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_46_0.png)


    Above: The global namespace can become somewhat messy.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_46_1.png)


    > Hot Tip

    The name of a named function exists in the global namespace. In contrast, anonymous
    functions can be assigned to an object property, thereby removing their identifiers
    from the global namespace.


    ```

    1

    2 var myNamespace = {};

    3

    4 myNamespace.calculateRectArea = function(rectWidth, rectHeight) {

    5     return(rectWidth * rectHeight);

    6 }

    7

    ```


