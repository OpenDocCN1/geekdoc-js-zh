    ## 基本数据类型


    让我们来看看基本数据类型。请记住，这些类型的变量代表单个值。


    ### 布尔值


    布尔值代表计算机数据的单个位，因此是最简单的数据类型。布尔值可以是false或true，在计算机中分别表示为0或1。


    ### 数值


    一般来说，在计算中有两种类型的数字：整数和浮点数。前者是整数，后者是涉及分数或指数部分的数字，例如3.14或$0.945 \times 10^7$。JavaScript不纠结于这种区分——数字就是数字。


