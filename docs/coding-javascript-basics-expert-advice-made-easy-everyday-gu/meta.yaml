    \ = {};\n24\n25\n26\n27 alert(quizQuestion1.question);\n28 alert(quizQuestion2.question);\n\
    29\n30 </script>\n31 </body>\n32 </html>\n33\n```\n\n*Above: Accessing the value\
    \ stored in an object property is very easy.*\n\n## Accessing Object Properties\n\
    \nIf we have an object, myObject, on which we've defined a property, myProperty,\
    \ we can access that property by typing myObject.myProperty. The '.' is called\
    \ the dot operator (see page 53).\n\n## DATA TYPE CASTING\n\nThere are many occasions\
    \ when you need to use a value of one type in the context of another type. For\
    \ example, you may wish to use the string representation of a number (\"42\" instead\
    \ of 42), or you may need to use a number in the context of a Boolean value. Translating\
    \ between data types in this way is referred to as data type casting.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_22_0.png)\n\
    \n## Implicit Casting\n\nJavaScript is very proactive when it comes to managing\
    \ data types, and automatically casts between types depending on the context in\
    \ which they are being used (see page 55 for an example of this).\n\n## Explicit\
    \ Casting\n\nWe can also explicitly cast some data types, most often used when\
    \ casting between strings and numbers. To cast a number to a string, for example,\
    \ we would write `String(42)`, giving the result \"42\". Conversely, to cast a\
    \ string to a number, we would write `Number(\"42\")`, resulting in 42.\n\n```\n\
    1 var myNumber = 42;\n2 var myString = \"549\";\n3 var myName = \"Sajid\";\n4\n\
    5 var test1 = myNumber + myString;\n6 alert(test1); //Shows '42549' in the alert\
    \ box\n7\n8 var test2 = myNumber + Number(myString);\n9 alert(test2); //Shows\
    \ '591' in the alert box\n10\n11 var test3 = myString + myName;\n12 alert(test3);\
    \ //Shows '549Sajid' in the alert box\n13\n14 var test4 = myNumber + Number(myName);\n\
    15 alert(test4); //Shows 'NaN' in the alert box\n16\n17 var test5 = String(myNumber)\
    \ + myName;\n18 alert(test5); //Shows '42Sajid' in the alert box\n19\n20\n```\n\
    \n*Above: This code highlights how and why we might explicitly cast between data\
    \ types.*\n\n## The Special NaN Number\n\nNot all values can be converted to a\
    \ number – for example, the string \"foo\" has no numeric meaning.\n\nIf we cast\
    \ this string to a number, we'd get the result `NaN` (Not a Number). Despite the\
    \ name, this is indeed a number, and can be used anywhere that a number is allowed\
    \ or expected. However, any calculations that include `NaN` always evaluate to\
    \ `NaN` themselves.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_23_0.png)\n\n\
    ## Results of Casting Different Data Types\n\nThis table shows the results of\
    \ casting between different data types. Read the table as 'casting from row title\
    \ to column title'.\n\n| | Boolean | number | string |\n|---|---|---|---|\n| Boolean\
    \ | - | false is 0, true is 1 | 'false' \"false\", true is \"true\" |\n| number\
    \ | 0 is false, else true | - | String representation of number |\n| string |\
    \ \"\" is false, else true | numeric representation of string or NaN | - |\n|\
    \ null | false | 0 | \"null\" |\n| undefined | false | NaN | \"undefined\" |\n\
    | array | true | Empty array is 0, array with elements is NaN | comma-separated\
    \ list of element values |\n| object | true | NaN | \"[object Object]\" |\n\n\
    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_24_0.png)\n\n## JAVASCRIPT SYNTAX\n\n\
    A script can consist of a single instruction or it can be an epic tome containing\
    \ thousands of lines of code. No matter the size though, all scripts in JavaScript\
    \ share a common structure and syntax.\n\n## CASE SENSITIVITY\n\nThe first thing\
    \ to note is that JavaScript is case sensitive, i.e. lower-case characters are\
    \ considered to be distinct from their upper-case counterparts. For example, the\
    \ identifier `\"myVariable\"` is not the same as `\"MyVariable\"` (notice the\
    \ different capitalizations).\n\n```\n00 com.flamerepublishing.simpleQuiz.prototype.addQuestion\
    \ = function() {\n01   // QUESTION 1\n02   this.questions.push(\n03     new com.flamerepublishing.QuizQuestion(\n\
    04       1,\n05       \"Approximately how far away from the Earth is the Sun?\"\
    ,\n06       [\"200 miles\", \"93,000,000 miles\", \"49,000,000 miles\", \"150,000\
    \ miles\"],\n07       1\n08     )\n09   );\n10   // QUESTION 2\n11   this.questions.push(\n\
    12     new com.flamerepublishing.QuizQuestion(\n13       2,\n14       \"How many\
    \ planets are there in our Solar System?\",\n15       [\"6\", \"7\", \"8\", \"\
    9\"],\n16       2\n17     )\n18   );\n19   // QUESTION 3\n20   this.questions.push(\n\
    21     new com.flamerepublishing.QuizQuestion(\n22       3,\n23       \"Which\
    \ of these is a Moon of Jupiter?\",\n24       [\"Ganymede\", \"Miranda\", \"Enceladus\"\
    , \"Mars\"],\n25       0\n26     )\n27   );\n28 }\n```\n\n*Above: Indented code\
    \ is easier to read because it helps to group sections of related code visually.*\n\
    \n## WHITE SPACE\n\nLeading spaces and tabs are ignored in JavaScript. This enables\
    \ us to use code indenting in our code, which is a technique that helps make the\
    \ code more organized and human-readable.\n\n## SEMICOLONS\n\nJavaScript statements\
    \ are normally terminated by a semicolon (;) but do not have to be. Where semicolons\
    \ are omitted, the interpreter assumes line breaks mark the end of a statement.\
    \ However, omitting semicolons can lead to ambiguity in your code, so best practice\
    \ is to terminate every statement with a semicolon.\n\n```\n1  //Inline comments\
    \ start with '//' and end at the next line break\n2\n3  var userScore = 0; //They\
    \ can be written on the same line as other code\n4\n5  //alert(userScore); //They\
    \ can also be used to disable lines of code\n6\n7\n8\n```\n\n*Above: Inline comments\
    \ end at the line break that follows the comment.*\n\n## COMMENTS\n\nA comment\
    \ is a section of script that is ignored by the interpreter. Comments are used\
    \ for adding notes and explanations to scripts, helping others understand them,\
    \ and acting as notes-to-self when revisiting a script months after writing it.\n\
    \n### Inline Comments\n\nAn inline comment starts with // and continues until\
    \ the next line break. They can be placed on their own line or on a line following\
    \ other JavaScript code.\n\n> **Hot Tip:** Comments are commonly used to disable\
    \ sections of a script - very useful when experimenting with new ideas or attempting\
    \ to hunt down bugs."
  mdcn: "\n对象在 JavaScript 中扮演着特殊角色——它们是所有其他 JavaScript 数据构建的基础基石。所有其他数据类型都继承了对象数据类型的基本特性。因此，我们经常将任何且所有的\
    \ JavaScript 数据都称为对象——例如，字符串对象或数组对象。这种继承的概念是面向对象编程的基础，这是一种与 JavaScript 紧密相关的编程方法，我们将在第\
    \ 95 页对其进行介绍。\n\n> **实用技巧**\n> 存储在对象属性中的值可以是任何数据类型，包括其他对象或数组。\n\n```\n7  <body>\n\
