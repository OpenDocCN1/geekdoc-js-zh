  md: '# Strings


    Strings are text data – don''t worry about why they''re called strings (it gets
    technical in ways we don''t need to worry about); just know that a string is text,
    and text is a string.


    When writing strings into scripts, they have to be surrounded by quotation marks.
    These can be single '' or double " quotes (we''ll be using the latter), but it''s
    vital that a string is closed by the same style of quotation mark that it was
    opened with.


    > **Hot Tip**


    If a string is enclosed by single quotes '', it can contain double quotes ", and
    vice versa.


    An empty string – a string with no characters in it – is normally written as a
    pair of quotation marks.


    ```

    '' '' or " ".

    ```


    ```

    1 <!DOCTYPE HTML>

    2 <html>

    3  <head>

    4    <title>Using Quotes in Strings</title>

    5  </head>

    6

    7  <body>

    8    <script type="text/javascript">

    9      var anyString = ""; //"" creates an empty string

    10     anyString = ''A string can be demarked by single quotes...'';

    11     anyString = "...or it can be demarked by double quotes.";

    12     anyString = ''A string demarked by single quotes "can" contain double quotes'';

    13     anyString = "A string demarked by double quotes ''can'' contain single
    quotes";

    14   </script>

    15

    16  </body>

    17 </html>

    18

    ```


    Above: Different ways of using quotation marks with strings.


    # Non-existent Data


    JavaScript has two data types for representing non-existent data. The null type,
    whose value is also null, indicates that there is no value – if an identifier
    evaluates to null, it doesn''t contain any valid data or, most likely, it hasn''t
    been declared. The second type is undefined, whose value is also undefined, and
    is slightly different to null – it is the initial type and value of any variable
    that has been declared but, not yet, had a value assigned to it.


    # ARRAYS


    Arrays are a reference data type; array is JavaScript parlance for a list of values.
    There are two ways in which to create one.


    # Writing an Array Literal


    We can create an array by writing an array literal, like this:


    ```

    var myArray = [value_1, value_2, ..., value_n]

    ```


    ```

    1 <!DOCTYPE HTML>

    2 <html>

    3  <head>

    4    <title>Array Examples</title>

    5  </head>

    6

    7  <body>

    8    <script type="text/javascript">

    9      var emptyArray = [];

    10     var numbersArray = [42, 12, 57, 3.14, 981582, 5];

    11     var stringsArray = ["Harry", "Sue", "Julia", "Chris", "Oliver"];

    12     var mixedArray = ["Oliver", true, false, 5];

    13     var arraysArray = [emptyArray, numbersArray, stringsArray, mixedArray];

    14   </script>

    15  </body>

    16 </html>

    ```


    Above: Arrays store lists of other data (including other arrays).'
