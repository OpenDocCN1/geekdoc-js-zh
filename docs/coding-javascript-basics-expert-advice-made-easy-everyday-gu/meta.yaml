    \ Bug 和错误。\n\n### 全局命名空间的污染\n\n每个具名函数和每个全局变量的名称都存在于全局命名空间中。在大型项目中，这个命名空间可能会充斥着许多不同的名称。在页面中引入第三方脚本会让情况变得更加糟糕。全局命名空间污染越严重，你遇到名称冲突的可能性就越大。\n\
