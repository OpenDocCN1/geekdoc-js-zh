    This is not a big book and you''ll read it in a few hours. But you''ll come out
    the end knowing enough of the language to build your own interactive web pages.


    But don''t take my word for it... turn the page.


    Chris Brown

    Linux Ambassador and Training Consultant'
  - '[PAGE 4]


    # INTRODUCTION


    The JavaScript language has been with us since the very earliest days of the World
    Wide Web. In its early days it was merely one face in a crowd, one of many languages
    and technologies vying for the attention and evangelism of the web development
    community.


    # UNIVERSAL LANGUAGE


    Over the years, many such technologies have come into fashion before falling from
    grace for one reason or another, but not so JavaScript. Thanks largely to a combination
    of flexibility and ubiquitousness, JavaScript is now the principal scripting language
    of the internet.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_4_0.png)


    # STEP UP FROM HTML/CSS


    Despite JavaScript''s at-times esoteric nature, it is the perfect language to
    use for learning about coding in general. This book is aimed at people who are
    quite new to programming. You may have spent some time with HTML and CSS and want
    to step things up with JavaScript, or you may have tinkered with a bit of scripting
    and want to formalize and expand on that knowledge. You may even be an experienced
    programmer who has never used JavaScript and wants a quick overview to get started.


    # GO-TO PRIMER


    There''s no getting away from the fact that JavaScript is a deep subject, so much
    so that no single book can tell you all there is to know about the language. What
    this book aims to do, then, is to deliver a wide-ranging overview of the language,
    and give you sufficient understanding to be able to add your own simple scripts
    and interactions to your pages. It is also perfect as a primer for further studies
    in coding with JavaScript.


    # Online Samples


    You can download completed versions of all the book''s code examples and additional
    notes. To do so, visit www.flame treepublishing.com/book-samples.html.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_4_1.png)


    # Hot Tips


    Look out for the Hot Tips, which tell you about the many shortcuts and quick techniques
    available in JavaScript.'
  - '[PAGE 5]


    # MEET JAVASCRIPT


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_5_0.png)'
  - '[PAGE 6]


    # # JAVASCRIPT, HTML AND CSS


    There are three core languages used to develop web pages: HTML provides the underlying
    structure and content; CSS provides the visual scenery while JavaScript, well,
    JavaScript provides the magic that brings the whole thing to life.


    # ## BEFORE WE START


    This book is concerned solely with JavaScript, yet the language is so deeply tied
    to web browsers and web pages that it is impossible to discuss it without relying
    heavily on prior knowledge of HTML and CSS. If you don''t already have such knowledge,
    the *Coding HTML & CSS Basics*, will get you up to speed with the requisite know-how.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_6_0.png)


    > > **Hot Tip**

    > If in the context of HTML and CSS, you understand the meaning of terms such
    as element, attribute, opening and closing tags, selectors and style rules, then
    you''re good to go with JavaScript.


    Left: *Coding HTML & CSS Basics* will get you up to speed with the knowledge you
    need to comfortably dive into our book''s coverage.


    # ### BROWSER COMPATIBILITY


    While the core JavaScript language is fully supported across all major browsers,
    problems can arise when using advanced or esoteric functions, because not all
    browsers support all of JavaScript''s extended functionality. There are ways and
    means to work around such issues but, unfortunately, there isn''t room here to
    cover them here.


    # #### Firefox


    All of the examples in this book use standard JavaScript programming techniques
    and constructs. However, in order to sidestep any tiresome browser compatibility
    issues, we''ll be using the Firefox browser for running all examples, and encourage
    you to do the same.


    > > **Hot Tip**

    > See page 7 to find out how to download completed versions of all the book''s
    code examples. These files include additional notes that help to further explain
    the examples.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_6_1.png)


    Above: such a beautiful piece of the most standards-compliant web browser currently
    available, and we insist you install one, you can download it from www.mozilla.org'
- md: "## WHAT IS JAVASCRIPT?\n\nJavaScript is a scripting language used to interact\
    \ with and control pages loaded into a web browser. It provides a rich palette\
    \ of functionality for interacting with the user, the page and the internet.\n\
    \n## WHAT IS A SCRIPT?\n\nIn the theatre world, a script can be thought of as\
    \ a series of instructions that tell the actors where to be, what to do and say,\
    \ and when to do and say it. In computing, the meaning is very similar: a script\
    \ is a series of instructions for the computer to perform. Yes, the actors are\
    \ onscreen graphics and chunks of data rather than a troupe of thespians, but\
    \ the principle remains the same.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_7_0.png)\n\
    \n*Left:* A script tells the actors where to be, what to do and when to do it\
    \ - the actors being computer data and graphics, of course.\n\n## JAVASCRIPT RUNS\
    \ ON THE CLIENT SIDE\n\nIt's important to understand from the get-go that when\
    \ using JavaScript in a web page, it runs on the user's - or client's - computer\
    \ and interacts with a copy of the web page that is loaded into a web browser\
    \ on that computer. This is often referred to as 'client-side' scripting.\n\n\
    ## Java and JavaScript\n\nYou may have heard of a language called Java, and think\
    \ that it somehow relates to JavaScript - it doesn't. Java was a hot topic at\
    \ the time JavaScript was developed, and by calling the language JavaScript, its\
    \ developers ensured that it got noticed. Other than a passing similarity in their\
    \ syntax though, the two languages are fundamentally different and unrelated.\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_7_1.png)\n\n*Above:* JavaScript interacts\
    \ directly with the page impression that's loaded into the user's browser.\n\n\
    ## WHY INCLUDE SCRIPTS IN A PAGE?\n\nThere are almost as many reasons for using\
    \ scripting in a page as there are pages that use scripting. In general though,\
    \ there are two key reasons for using scripts: to modify the appearance of a page;\
    \ and/or to allow communication between a page and a web server.\n\n### VISUAL\
    \ CHANGES\n\nSome of the most common – certainly the most obvious – scripts modify\
    \ the appearance of a page based upon conditions that weren't known when the page\
    \ was authored. A condition could be as simple as the time of day or the position\
    \ of the user's mouse pointer, or it could be very complex. The point is that\
    \ by using JavaScript, we can determine whether a certain condition has been met\
    \ and then take action in response to that condition.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_8_0.png)\n\
    \nRight: Search engines use scripting to display possible search results as you\
    \ type.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_8_1.png)\n\nAbove: JavaScript\
    \ can pull data from a server and display it in the browser without having to\
    \ reload the page.\n\n### COMMUNICATIONS\n\nThere are many scenarios in which\
    \ a loaded page can require additional data from a server. For instance, many\
    \ search engines pop up a list of suggestions while you type into the search field\
    \ – getting the list is done via scripted communications between the browser and\
    \ server.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_8_2.png)\n\nAbove: Google\
    \ Analytics uses scripting entirely to pass data between a page in a browser and\
    \ Google's servers.\n\n### Working Behind the Scenes\n\nNot all scripts result\
    \ in visual output – a perfect example being Google Analytics. This script monitors\
    \ various metrics about visits (and visitors) to a page: total visits, unique\
    \ visits, geographic location of visitors, and so on. JavaScript ships this data\
    \ back to Google's servers, from where the page's owner can view and analyse the\
    \ data.\n\n## WRITING JAVASCRIPT\n\nAs with HTML and CSS, JavaScript is plain\
    \ text. This means that the simplest tool for writing JavaScript is the basic\
    \ text editor built into your computer's operating system (Notepad on Windows,\
    \ TextEdit on a Mac or Vi on Linux).\n\n### IDEs\n\nPlain text editors work fine,\
    \ but they pale into insignificance compared to a fully fledged IDE (Integrated\
    \ development environment). IDEs help both with writing scripts - speeding up\
    \ your work and helping to spot errors - and with managing the multitude of files\
    \ associated with a website or larger project.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_9_0.png)\n\
    \nAdobe Dreamweaver has code written in plain text (see figure - don't use Rich\
    \ Text!)\n\n### Popular Cross-Platform IDEs\n\n- **Adobe Dreamweaver**. When it\
    \ comes to developing for the web, Dreamweaver is the daddy. It's also the daddy\
    \ price-wise, especially given Adobe's controversial subscription-only licensing\
    \ model. Weigh up your options wisely. www.adobe.com\n\n> **Hot Tip**\n> If using\
    \ TextEdit on a Mac as your JavaScript editor, be sure to switch all new documents\
    \ to plain text mode before typing anything.\n\n- **Komodo IDE**. This fully featured\
    \ commercial IDE costs $99.6775 for a single licence (at the time of writing)\
    \ and is very popular, thanks to its clean, uncluttered interface and dock operation.\
    \ http://komodoide.com\n- **Komodo Edit**. The cut-down version of Komodo IDE\
    \ is free to download and use, and is an excellent choice for enjoying the benefits\
    \ of an IDE. http://komodoide.com/komodo-edit\n- **Eclipse**. The powerful IDE\
    \ can work with many different languages, including HTML, CSS and JavaScript.\
    \ It is free to download and use, but can be overwhelming for the uninitiated.\
    \ www.eclipse.org\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_9_1.png)\n\n- Code\
    \ folding allows you to collapse blocks of code you aren't currently working on\
    \ to simplify the surrounding code.\n- Code hinting provides a list of available\
    \ functions, variables and properties as you type.\n- Built in reference information\
    \ (some IDEs include language reference libraries)\n- File management: Built in\
    \ file management features are available with larger projects\n\n## ADDING A SCRIPT\
    \ TO A PAGE\n\nWe add scripts to a page by using the `<script>` HTML element.\
    \ The `type` attribute of the element must always be \"text/javascript\". The\
    \ element should always be closed with a closing tag `</script>`.\n\n### Embedded\
    \ JavaScript\n\nTo embed a script, we simply write its commands between the opening\
    \ and closing `<script>` tags. The script is then intrinsically tied to that page,\
    \ and that page alone.\n\n```html\n1 <!DOCTYPE html>\n2 <html>\n3   <head>\n4\
    \     <meta charset=\"UTF-8\">\n5     <title>Untitled Document</title>\n6    \
    \ <script type=\"text/javascript\">\n7       // Embedded JavaScript code here\n\
    8     </script>\n9     <script type=\"text/javascript\" src=\"js/myScript.js\"\
    ></script>\n10    </head>\n11    <body>\n12    </body>\n13  </html>\n```\n\nAbove:\
    \ The HTML `<script>` element can contain an embedded script or link to an external\
    \ script file.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_10_0.png)\n\n### Linked\
    \ JavaScript\n\nIt is common to link a script to a page. To do this, the script\
    \ is written in a separate text file and saved with a `.js` filename extension.\
    \ The script is then linked to a page using the `src` attribute of the `<script>`\
    \ element.\n\nFor example:\n\n```html\n<script\ntype=\"text/javascript\"\nsrc=\"\
    myScript.js\"></script>\n```\n\n## WHAT HAPPENS WHEN A BROWSER ENCOUNTERS A SCRIPT?\n\
    \n> Whenever a web browser loads a page, it deals with each HTML element sequentially\
    \ as it works through the page.\n\n### THE INTERPRETER\n\nWhen the browser encounters\
    \ a `<script type=\"text/javascript\">` element, the contents of the script are\
    \ immediately passed to the browser's JavaScript interpreter (known as executing\
    \ the script). It is the interpreter's job to make sense of the script and instruct\
    \ the browser to act accordingly. When the interpreter has finished executing\
    \ a script, control is returned to the browser, which then continues to process\
    \ the page.\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_10_1.png)\n\n## YOUR FIRST\
    \ SCRIPT\n\n1. Create a new HTML file and add the basic structural elements `<html>`,\
    \ `<head>` and `<body>`. Save the file in a convenient location, and call it `myFirstScript.html`.\n\
    2. Add a `<script>` element to the `<body>` element. For this example, we want\
    \ to place the opening and closing tags on separate lines, with an empty line\
    \ in between.\n3. Type the following command within the script element: `document.write(\"\
    <p>Hello World!</p>\");`. This command outputs text to a page, just as though\
    \ we'd typed it directly into the page (which is why we've also included the `<p>`\
    \ element tags).\n4. Save the page and then open it in Firefox, either by double-clicking\
    \ the file or by right-clicking it and selecting 'Open with', then Firefox.\n\n\
    > **Hot Tip**\n> We often use the terms 'code' and 'coding' – the former refers\
    \ to the text that you type into a script, while the latter refers to the process\
    \ of writing scripts.\n\n```html\n<!DOCTYPE HTML>\n<html>\n  <head>\n    <title>My\
    \ First Script</title>\n  </head>\n\n  <body>\n\n    <script type=\"text/javascript\"\
    >\n      document.write(\"<p>Hello World!</p>\");\n    </script>\n\n  </body>\n\
    </html>\n```\n\n### How it Works\n\nCongratulations – you've just written and\
    \ executed your first script. The script was passed to the interpreter when the\
    \ browser encountered the `<script>` element. The interpreter recognized the `document.write`\
    \ command, and wrote the text contained in the brackets (or, in programming parlance,\
    \ parentheses) to the page. The text had to be contained in quotation marks for\
    \ the interpreter to recognize it as text – if all you see is a blank page, chances\
    \ are you've missed the quotation marks.\n\n> **Hot Tip**\n> It is traditional\
    \ for books about programming languages to use 'Hello World!' as the output from\
    \ the first exercise in the book – you are now officially initiated into the ranks\
    \ of the developer!\n\nRight: You have passed the initiation test – welcome aboard!\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_11_0.png)"
  mdcn: "\n## 什么是 JavaScript？\n\nJavaScript 是一种脚本语言，用于与加载到 Web 浏览器中的页面进行交互并对其进行控制。它提供了丰富的功能集，用于与用户、页面以及互联网进行交互。\n\
    \n## 什么是脚本？\n\n在戏剧世界中，脚本可以被视为一系列指令，告诉演员应该在何时、何地、做什么以及说什么。在计算领域，其含义非常相似：脚本就是一系列由计算机执行的指令。当然，这里的“演员”是屏幕上的图形和数据块，而不是一群戏剧演员，但原理是一样的。\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_7_0.png)\n\n*左图：* 脚本告诉演员应该在何时、何地做什么——当然，这里的演员是指计算机数据和图形。\n\
    \n## JavaScript 在客户端运行\n\n从一开始就必须理解一点：在网页中使用 JavaScript 时，它运行在用户的（即客户端的）计算机上，并与加载到该计算机\
    \ Web 浏览器中的网页副本进行交互。这通常被称为“客户端”脚本。\n\n## Java 与 JavaScript\n\n你可能听说过一种名为 Java\
    \ 的语言，并认为它与 JavaScript 有某种联系——实际上并没有。Java 在 JavaScript 开发时期是一个热门话题，通过将该语言命名为 JavaScript，开发者确保了它能获得关注。除了在语法上有一点点相似之外，这两种语言在根本上是完全不同且无关的。\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_7_1.png)\n\n*上图：* JavaScript 直接与加载到用户浏览器中的页面呈现进行交互。\n\
    \n## 为什么在页面中包含脚本？\n\n在页面中使用脚本的原因几乎和使用脚本的页面数量一样多。但总的来说，使用脚本有两个关键原因：修改页面的外观；以及/或者允许页面与\
    \ Web 服务器之间进行通信。\n\n### 视觉变化\n\n一些最常见（当然也是最明显）的脚本会根据页面在编写时未知的条件来修改页面的外观。条件可以简单到像当前时间或用户鼠标指针的位置，也可以非常复杂。重点在于，通过使用\
    \ JavaScript，我们可以确定某个条件是否满足，然后采取相应的行动。\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_8_0.png)\n\
    \n右图：搜索引擎使用脚本在用户输入时显示可能的搜索结果。\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_8_1.png)\n\
    \n上图：JavaScript 可以从服务器提取数据并在浏览器中显示，而无需重新加载页面。\n\n### 通信\n\n在许多场景中，已加载的页面可能需要从服务器请求额外的数据。例如，许多搜索引擎在你向搜索框输入内容时会弹出建议列表——获取该列表是通过浏览器和服务器之间的脚本通信完成的。\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_8_2.png)\n\n上图：Google Analytics 完全使用脚本在浏览器页面和\
    \ Google 服务器之间传输数据。\n\n### 后台工作\n\n并非所有脚本都会产生视觉输出——一个完美的例子就是 Google Analytics。该脚本监控有关页面访问（和访问者）的各种指标：总访问量、独立访问量、访问者的地理位置等等。JavaScript\
    \ 将这些数据传回 Google 的服务器，页面所有者可以在那里查看并分析数据。\n\n## 编写 JavaScript\n\n与 HTML 和 CSS 一样，JavaScript\
    \ 是纯文本。这意味着编写 JavaScript 最简单的工具就是计算机操作系统内置的基本文本编辑器（Windows 上的记事本，Mac 上的 TextEdit\
    \ 或 Linux 上的 Vi）。\n\n### IDE\n\n纯文本编辑器可以使用，但与功能齐全的 IDE（集成开发环境）相比就显得微不足道了。IDE 既能帮助编写脚本（加快工作速度并帮助发现错误），又能帮助管理与网站或大型项目相关的大量文件。\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_9_0.png)\n\nAdobe Dreamweaver 使用纯文本编写代码（见图\
    \ - 不要使用富文本！）\n\n### 流行的跨平台 IDE\n\n- **Adobe Dreamweaver**。在 Web 开发方面，Dreamweaver\
    \ 是业界的标杆（daddy）。但在价格方面它也是“老大哥”，尤其是考虑到 Adobe 备受争议的仅限订阅的许可模式。请审慎权衡你的选择。www.adobe.com\n\
    \n> **实用技巧**\n> 如果在 Mac 上使用 TextEdit 作为 JavaScript 编辑器，请务必在输入任何内容之前将所有新文档切换到纯文本模式。\n\
    \n- **Komodo IDE**。这是一个功能齐全的商业 IDE，单用户许可费用为 $99.6775（截至撰写本文时），由于其简洁、不凌乱的界面和停靠操作而非常受欢迎。http://komodoide.com\n\
    - **Komodo Edit**。这是 Komodo IDE 的精简版本，可免费下载使用，是体验 IDE 优势的绝佳选择。http://komodoide.com/komodo-edit\n\
    - **Eclipse**。这个强大的 IDE 可以支持多种不同的语言，包括 HTML、CSS 和 JavaScript。它可以免费下载使用，但对于初学者来说可能过于复杂。www.eclipse.org\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_9_1.png)\n\n- 代码折叠允许你折叠当前未处理的代码块，以简化周围的代码。\n\
    - 代码提示在你输入时提供可用函数、变量和属性的列表。\n- 内置参考信息（某些 IDE 包含语言参考库）。\n- 文件管理：大型项目可以使用内置的文件管理功能。\n\
    \n## 将脚本添加到页面\n\n我们使用 HTML 元素 `<script>` 将脚本添加到页面。该元素的 `type` 属性必须始终为 \"text/javascript\"\
    。该元素应始终使用闭合标签 `</script>` 结束。\n\n### 嵌入式 JavaScript\n\n要嵌入脚本，我们只需在 `<script>`\
    \ 的开始和结束标签之间编写指令。这样脚本就与该页面（且仅该页面）内在绑定。\n\n```html\n1 <!DOCTYPE html>\n2 <html>\n\
    3   <head>\n4     <meta charset=\"UTF-8\">\n5     <title>Untitled Document</title>\n\
    6     <script type=\"text/javascript\">\n7       // Embedded JavaScript code here\n\
    8     </script>\n9     <script type=\"text/javascript\" src=\"js/myScript.js\"\
    ></script>\n10    </head>\n11    <body>\n12    </body>\n13  </html>\n```\n\n上图：HTML\
    \ `<script>` 元素可以包含一个嵌入式脚本或链接到一个外部脚本文件。\n\n![](img/9f289ad67d43b98b3bcc0d91197bccf6_10_0.png)\n\
    \n### 链接式 JavaScript\n\n将脚本链接到页面是很常见的做法。为此，将脚本编写在单独的文本文件中，并保存为 `.js` 文件名扩展名。然后使用\
    \ `<script>` 元素的 `src` 属性将脚本链接到页面。\n\n例如：\n\n```html\n<script\ntype=\"text/javascript\"\
    \nsrc=\"myScript.js\"></script>\n```\n\n## 当浏览器遇到脚本时会发生什么？\n\n> 每当 Web 浏览器加载页面时，它在处理页面的过程中会按顺序处理每个\
    \ HTML 元素。\n\n### 解释器\n\n当浏览器遇到 `<script type=\"text/javascript\">` 元素时，脚本的内容会立即传递给浏览器的\
    \ JavaScript 解释器（称为执行脚本）。解释器的任务是理解脚本并指示浏览器采取相应行动。当解释器完成脚本执行后，控制权将返回给浏览器，然后浏览器继续处理页面。\n\
    \n![](img/9f289ad67d43b98b3bcc0d91197bccf6_10_1.png)\n\n## 你的第一个脚本\n\n1. 创建一个新\
    \ HTML 文件并添加基本的结构元素 `<htmlrangle>`、`<head>` 和 `<body>`。将文件保存在方便的位置，并将其命名为 `myFirstScript.html`。\n\
    2. 在 `<body>` 元素中添加一个 `<script>` 元素。在本例中，我们将开始和结束标签放在单独的行上，中间留一个空行。\n3. 在脚本元素中输入以下命令：`document.write(\"\
    <p>Hello World!</p>\");`。该命令将文本输出到页面，就像我们直接将其输入到页面中一样（这就是为什么我们也包含了 `<p>` 元素标签的原因）。\n\
    4. 保存页面，然后通过双击文件或右键单击并选择“打开方式”，然后选择 Firefox 来在 Firefox 中打开它。\n\n> **实用技巧**\n>\
    \ 我们经常使用“代码”（code）和“编码”（coding）这两个术语——前者是指你输入到脚本中的文本，而后者是指编写脚本的过程。\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n  <head>\n    <title>My First Script</title>\n  </head>\n\
    \n  <body>\n\n    <script type=\"text/javascript\">\n      document.write(\"<p>Hello\
    \ World!</p>\");\n    </script>\n\n  </body>\n</html>\n```\n\n### 工作原理\n\n恭喜——你刚刚编写并执行了你的第一个脚本。当浏览器遇到\
    \ `<script>` 元素时，脚本被传递给了解释器。解释器识别出 `document.write` 命令，并将括号（或在编程术语中称为圆括号）中包含的文本写入页面。文本必须包含在引号中，解释器才能将其识别为文本——如果你看到的只是一个空白页面，很可能是你漏掉了引号。\n\
