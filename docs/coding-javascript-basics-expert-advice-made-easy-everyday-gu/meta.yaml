    14       for(var i = 0; i < com.flametreepublishing.questions.length ; i++)

    15         com.flametreepublishing.renderQuestionAtIndex(i);

    ```


    - 2. Add our namespace declaration at the top of QuizQuestion.js (see page 93).


    - 3. We''re going to call this class QuizQuestion, so the first thing to do is
    define the constructor function – see the illustration below. The constructor
    function has the same name as the class.


    ```

    1 var com;

    2 if(!com) {

    3   com = {};

    4 }

    5 if(!com.flametreepublishing) {

    6   com.flametreepublishing = {};

    7 }

