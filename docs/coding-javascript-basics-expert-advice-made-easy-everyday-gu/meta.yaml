  md: "```\ncom.flame treepublishing.startQuiz = function() {\n  com.flame treepublishing.simpleQuiz\
    \ = new com.flame treepublishing.SimpleQuiz();\n  com.flame treepublishing.simpleQuiz.renderAllQuestions();\n\
    }\n```\n\nAbove: Step 2: The event handler code.\n\n+   3. Add the event listener\
    \ code shown in the illustration below. The `window` object represents the browser\
    \ window – we're listening for its `load` event, dispatched when the page has\
    \ finished loading.\n\n```\ncom.flame treepublishing.simpleQuiz.renderAllQuestions();\n\
    }\n\nwindow.addEventListener(\"load\", com.flame treepublishing.startQuiz, false);\n\
    ```\n\nAbove: Step 3: The event listener code.\n\n+   4. Save your work and open\
    \ simpleQuiz.html in your editor.\n\n+   5. Add a new `<script>` element in the\
    \ `<head>` and link it to quizStartup.js. Then delete the `<script>` element that's\
    \ within the `<body>` element entirely, and save the file. See the illustration,\
    \ below.\n\n```\n<head>\n  <title>A Simple Quiz</title>\n\n  <script type=\"text/javascript\"\
    \ src=\"js/QuizQuestion.js\"></script>\n  <script type=\"text/javascript\" src=\"\
    js/SimpleQuiz.js\"></script>\n  <script type=\"text/javascript\" src=\"js/quizStartup.js\"\
    ></script>\n\n</head>\n```\n\nAbove: Step 5: Ensure you add and delete the right\
    \ code here.\n\n# Next Steps\n\nAnd that's it – our quiz now works! More to the\
    \ point, consider what our HTML document contains: just three script elements.\
    \ JavaScript is handling everything else – nice!\n\nIf you want to improve on\
