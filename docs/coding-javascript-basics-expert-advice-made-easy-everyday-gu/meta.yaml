    \n## 事件处理程序\n\n通常，当事件监听器被触发时，它执行的表达式是一个函数或方法调用。被调用的函数或方法被称为事件处理程序。事件处理程序的职责是以某种方式处理该事件——进行视觉更改、向服务器发送数据等。\n\
