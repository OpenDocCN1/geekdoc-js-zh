    \ and vice versa.\n\n# Retrieving Elements from the DOM\n\nAs we’ve seen, all\
    \ HTML elements (with the exception of `<html>`) have to be nested within another\
    \ element. Therefore, to add a new element to a page with JavaScript, we often\
    \ have to retrieve the element from the DOM that will serve as the parent of the\
    \ new element. At other times, we may want to apply, say, a style change to all\
    \ elements of a certain type.\n\nThe methods for getting elements are defined\
    \ on the single HTMLDocument instance, the top level of the DOM. We have already\
    \ been using this object in our scripts – every time we type document, we are\
