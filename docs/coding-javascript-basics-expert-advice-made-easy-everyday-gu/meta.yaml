  - '[PAGE 7]


    # WHAT IS JAVASCRIPT?


    JavaScript is a scripting language used to interact with and control pages loaded
    into a web browser. It provides a rich palette of functionality for interacting
    with the user, the page and the internet.


    # WHAT IS A SCRIPT?


    In the theatre world, a script can be thought of as a series of instructions that
    tell the actors the actors where to be, what to do and say, and when to do and
    say it. In computing, the meaning is very similar: a script is a series of instructions
    for the computer to perform. Yes, the actors are onscreen graphics and chunks
    of data rather than a troupe of thespians, but the principle remains the same.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_7_0.png)


    *Left:* A script tells the actors where to be, what to do and when to do it -
    the actors being computer data and graphics, of course.


    # JAVASCRIPT RUNS ON THE CLIENT SIDE


    It''s important to understand from the get-go that when using JavaScript in a
    web page, it runs on the user''s - or client''s - computer and interacts with
    a copy of the web page that is loaded into a web browser on that computer. This
    is often referred to as ''client-side'' scripting.


    # Java and JavaScript


    You may have heard of a language called Java, and think that it somehow relates
    to JavaScript - it doesn''t. Java was a hot topic at the time JavaScript was developed,
    and by calling the language JavaScript, its developers ensured that it got noticed.
    Other than a passing similarity in their syntax though, the two languages are
    fundamentally different and unrelated.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_7_1.png)


    *Above:* JavaScript interacts directly with the page impression that''s loaded
    into the user''s browser.'
  - '[PAGE 8]


    # # WHY INCLUDE SCRIPTS IN A PAGE?


    There are almost as many reasons for using scripting in a page as there are pages
    that use scripting. In general though, there are two key reasons for using scripts:
    to modify the appearance of a page; and/or to allow communication between a page
    and a web server.


    # ## VISUAL CHANGES


    Some of the most common – certainly the most obvious – scripts modify the appearance
    of a page based upon conditions that weren''t known when the page was authored.
    A condition could be as simple as the time of day or the position of the user''s
    mouse pointer, or it could be very complex. The point is that by using JavaScript,
    we can determine whether a certain condition has been met and then take action
    in response to that condition.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_8_0.png)


    Right: Search engines use scripting to display possible search results as you
    type.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_8_1.png)


    Above: JavaScript can pull data from a server and display it in the browser without
    having to reload the page.


    # ## COMMUNICATIONS


    There are many scenarios in which a loaded page can require additional data from
    a server. For instance, many search engines pop up a list of suggestions while
    you type into the search field – getting the list is done via scripted communications
    between the browser and server.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_8_2.png)


    Above: Google Analytics uses scripting entirely to pass data between a page in
    a browser and Google''s servers.


    # ### Working Behind the Scenes


    Not all scripts result in visual output – a perfect example being Google Analytics.
    This script monitors various metrics about visits (and visitors) to a page: total
    visits, unique visits, geographic location of visitors, and so on. JavaScript
    ships this data back to Google''s servers, from where the page''s owner can view
    and analyse the data.'
  - '[PAGE 9]


    # # WRITING JAVASCRIPT


    As with HTML and CSS, JavaScript is plain text. This means that the simplest tool
    for writing JavaScript is the basic text editor built into your computer''s operating
    system (Notepad on Windows, TextEdit on a Mac or Vi on Linux).


    # ### IDEs


    Plain text editors work fine, but they pale into insignificance compared to a
    fully fledged IDE (Integrated development environment). IDEs help both with writing
    scripts - speeding up your work and helping to spot errors - and with managing
    the multitude of files associated with a website or larger project.


    ![](img/9f289ad67d43b98b3bcc0d91197bccf6_9_0.png)


    Adobe Dreamweaver has code written in plain text (see figure - don''t use Rich
    Text!)


    # ### Popular Cross-Platform IDEs


    +   - **Adobe Dreamweaver**. When it comes to developing for the web, Dreamweaver
    is the daddy. It''s also the daddy price-wise, especially given Adobe''s controversial
    subscription-only licensing model. Weigh up your options wisely. www.adobe.com


