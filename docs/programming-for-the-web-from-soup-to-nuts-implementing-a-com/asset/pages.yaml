  md: '# PROGRAMMING FOR THE WEB


    +   1. Printed maps, such as would be found in an Atlas. These will be referred
    to as static geographic maps.


    +   2. Graphic Information Systems (GIS), such as Google Maps. These maps allow
    a user to examine a geographical space from multiple zoom levels, and search for
    place markers. They will be referred to as GIS and are more interactive than their
    static cousins.


    +   3. Maps not intended to be scale and are not true linear geographic maps.
    These maps will be referred to as non-linear maps. Examples are subway and metro
    maps, routes from a friend, and many historic maps. These maps are arguably more
    common and less defined than linear maps.


    Constraining maps of geography is too limiting. Maps can be pictures, where each
    person in the image is a point on the map. Maps can be networks, representations
    of data, ways to solve a problem, or possible outcomes of events as what must
    happen for a team to make the playoffs. When implementing maps in this textbook
    the OpenLayers opensource program will be. OpenLayers works with any GIS server
    for geographic data, but by its design of layers offers more possibilities than
    GIS mapping software


