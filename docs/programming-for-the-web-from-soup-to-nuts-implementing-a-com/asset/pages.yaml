  md: "# PROGRAMMING FOR THE WEB\n\nA suggested 14 week class at an advanced undergraduate\
    \ level would be as follows:\n\n| Week | Chapter | Topics |\n|---|---|---|\n|\
    \ 1-3 | 2, 3 | Basic HTML, and form definition using HTML\\ Processing a form\
    \ in HTML:\n 1. Procedural programming, decisions and loops\n 2. Functions\n 3.\
    \ Events\n 4. Onload event to event listeners\n 5. Unobtrusive JavaScript\n 6.\
    \ Immediately Invoked Function Expressions (IIFE)\n 7. Query\n 8. Form processing\n\
    \ 9. Lambda functions and functional programming |\n| 4-6 | 4, 5 | CSS JavaScript\
    \ objects:\n 1. JSON\n 2. Constructor Functions\n 3. Prototypes\n 4. Functions\
    \ and Closures\n 5. Object Oriented Models in JavaScript |\n| 7-9 | 6 | CRUD interfaces\n\
    \ 1. Designing an interface\n 2. Designing the data objects\n 3. Implementing\
    \ a simple CRUD interface\n 4. Persistent storage to local storage\n Persistent\
    \ storage using a server\n 1. Node.js\n 2. Sails\n 3. REST\n 4. HTTP requests\
    \ |\n| 10-14 | 7 | Map applications using Open Layers\n Group or individual projects\
    \ |\n\nThis book is currently almost done. The last section of the last chapter\
    \ is mostly just code for the map application using persistent storage, really\
    \ isn't a lot of discussion of the application. However, I need to have the text\
    \ this out for a class, and I will probably not get a ton of time to work on it\
    \ for the semester. I believe the rest is enough that I wanted to release it.\n\
    \nI have plans for a number of additions to the book. These include more use of\
    \ ECMA6+ concepts I think will be useful (modules, arrow functions, etc), an extension\
    \ to the map application using unstructured data, and the inclusion of more server-side\
    \ functionality, including linking and using NoSQL capabilities of MongoDB and\
    \ possibly JSON in MySQL."
