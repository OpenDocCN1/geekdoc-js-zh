    # Array 3.2.2 Arrays


    Arrays in JavaScript are not like arrays in languages that most students are familiar
    with. Arrays in JavaScript are reality map structures (normally hashes or associative
    arrays) that use an index as a key. Even when used with an index, JavaScript arrays
    behave more like a ArrayList than a Java array. However, having the reader about
    the complexity of the JavaScript array, that complexity will be deferred later
    in the text. For now, arrays will be created in most of the languages the readers
    will be familiar.


    An array can be created in two ways. The first way to create an array is to set
    a value to an array literal, in the following example


    ```

    var weekDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];

    ```


    Program 29 - Creating an array by assigning the variable to an array literal


    As this shows, to initialize an array in JavaScript, the variable is set to an
    array literal, or a value that is array, and uses square brackets [] to contain
    the array members. This is a small difference from C derivative languages that
    use braces {} for array initialization. JavaScript will look similar to other
    languages, but programmers should be careful as there are syntax differences¹⁵.


    The second way to create an array is to call the Array() constructor function¹⁶,
    and passing the size of the array.


    ```

    var weekDays = new Array(5);

    ```


    Program 30 - Creating an array by calling a Constructor function


    ¹⁵ This syntax difference in array initialization represents more than just a
    small syntax difference. It is the first hint that an array and array variable
    are semantically different in JavaScript than in other languages.

    ¹⁶ Note that the Array() function is a JavaScript constructor function. The use
    of constructor functions will require the new operator and create a JavaScript
    object. JavaScript objects, and the prototypes used to create them, will be covered
    in more detail. For readers interested in more information, there are many web
    sites that cover Java objects, as https://developer.mozilla.org/en-US/docs/JavaScript/Objects/Object_prototypes.'
