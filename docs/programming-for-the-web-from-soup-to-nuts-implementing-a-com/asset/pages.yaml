  md: "# 113 PROGRAMMING FOR THE WEB:\n\nto understand, it always seems to be one\
    \ of the most difficult concepts to get across to programmers.\n\nThere are parts\
    \ of ECMA6+ that are very useful, and one of them is the inclusion of the let\
    \ keyword. The let keyword has allowed block scoping in JavaScript but has muddied\
    \ the waters and caused additional difficulties in programs that combine the use\
    \ of the let and the older var keyword. This text will avoid those problems by\
    \ always using the let keyword. While a JavaScript programmer would probably understand\
    \ the var keyword, the only reason is to understand how it impacts other programs\
    \ that it use. When it is used, it can cause variables to be blocked scoped using\
    \ the let keyword to function scoped. If a reader gets into a situation where\
    \ they are using code that uses the var keyword, there are any number of good\
    \ sites that explain what it means. This will not be a problem for readers who\
    \ have understood the 3 types of scoping described.\n\n# Chapter 5.4.1 Undeclared\
    \ variables\n\nFirst, JavaScript does not require that variables be declared and\
    \ created in the global scope. This allows for all sorts of problems, such as\
    \ misspelling of variables, or variables mean to be in other scopes put in global\
    \ scope.\n\nTo avoid accidentally spelling variables wrong or prevent programmers\
    \ from using undeclared variables, the JavaScript program can use the \"use strict\"\
    \ directive in their programs. This will cause the program to fail with error\
    \ if an undeclared variable is encountered. For this book, the use strict directive\
    \ will be used, and all variables must be declared. Undeclared variables simply\
    \ should not exist. The issue of undeclared variables is therefore dispensed with,\
    \ and not covered.\n\n# Chapter 5.4.2 The let keyword\n\nThe let keyword declares\
    \ a variable, and scopes that variable to the next larger program block, where\
    \ the next larger program block is a unit of a program that is contained between\
    \ two curly braces ({}). A variable declared inside a block will be scoped to\
    \ the block declared by those curly braces. If the variable is outside of any\
    \ curly braces, it will have global scope.\n\nThe first type of scoping that will\
    \ be covered is block scoping. Block scoping allows a variable to exist only in\
    \ the block in which it is declared. This is often useful for variables that only\
    \ exist in a block, for example for loop. The following loop shows a good use\
    \ of the let for block scoping:\n\n```\nfunction myFunc() {\n  for (let count\
    \ = 0; count < 10; count++) {\n    Do something\n  }\n}\n```\n\nHere the next\
    \ larger program block is for the loop, so the variable will only exist in the\
    \ loop and cannot be used outside of that. The variable will come into existence\
    \ when the loop block is entered and will be destroyed when the loop is exited.\
    \ This use of scoping is what most programmers are used to seeing."
