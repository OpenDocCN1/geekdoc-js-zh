    # Program 28 - Works in JavaScript as variable type is changed


    The let keyword does not define a type, why use it? The purpose of the let keyword
    is to

    define the scope of a variable. It can be dropped altogether, in case the variable
    defaults

    to global scope. The scope of a variable has three possibilities in JavaScript
    (ES6): global,

    function, and local scope. The rules of scope are as follows. A variable declared
    with a let in

    block, other than it is local. A variable declared with a let that is\contained
    in a block defaults to the function where it is. A variable not declared

    declared the let keyword, has global scope.


    These rulings are not as easy as they might seem. And since we are not yet using

    functions, in this section will have global or local scope. If the variable is
    declared in a

    block (between {}) it is a local variable, otherwise it is global scope. However,
    whether it is

    global or local should not have an impact on the examples in this section.


    This text will recommend the reader use the let keyword to declare all variables.
    Scope

    deplays a part, and I would argue a larger role in JavaScript than many other
    languages. Later

    in this text will always be required, not using it leads to endless confusion.
    Therefore, I

    strongly recommend the reader get into the head of the let keyword now But any
    further

    elucidation of the let word will have to wait until later in the text.


    There are 6 primitive types in JavaScript and one complex variable type called
    an Object.

    Information on the Object and Symbol types will be deferred later in the text,
    but the other

    5 primitive types are¹³.


    +   - Boolean: A Boolean is a binary value containing true or false.

    - Number: There is only one type in JavaScript, and it is a 64-bit IEEE 754

    precision (or floating point) number¹⁴. The number can also be used as an integer
    value,


    ¹³ For more information on JavaScript primitive, https://developer.mozilla.org/

    US/docs/Web/JavaScript/Data_structures.

    ⁴ For more information on IEEE 754 double format, https://en.wikipedia.org/wiki/Double-precision_floating-

    point_format.'
