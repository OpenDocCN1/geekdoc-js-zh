  md: '# Chapter 7.2.4 Updating and Deleting records


    The last operations for a CRUD interface are Update and Delete. To Update a record
    in the server, the PUT or PATCH method is used with the URL for a specific record
    in the server. The PATCH request with the URL and fields for ID 2 is shown below.
    The Update requires all fields in the object to be sent, though in this case only
    the title is updated.


    There are technical differences between PUT and PATCH requests, that either normally
    will work. If one causes difficulties, try the other.


