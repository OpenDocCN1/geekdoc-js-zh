  md: '# PROGRAMMING FOR THE WEB: 88


    # What you will learn


    In this chapter, you will learn:


    +   1. What version of JavaScript is used in this text, and why

    2. Global (simple) object creation in Java

    3. The nature of objects as property maps

    4. JSON and how to serialize an object with JSON

    5. How to implement and use Constructor Functions

    6. What are protocols, and how do protocol chains work

    7. How to use the DOM to find program elements as Constructor Functions

    8. How to use Constructor Functions to reconstruct objects

    9. JavaScript scoping and closure

    10. Models for JavaScript objects


    # Chapter 5 Objects in JavaScript


    The procedural concepts of JavaScript were covered at least appeared to be consistent
    with other, more Procedural (or Imperative) and Object-Oriented Programming (OOP)
    languages.


    In some ways, JavaScript may already seem strange to the reader. For example,
    as was previously pointed out, JavaScript has characteristics that are not Procedural;
    JavaScript has lambda functions (as proposed to languages like C# and lambda functions
    have syntactic sugar to handle other constructs), and can be used as a Functional
    language. Functional programming is often a source of confusion to novices just
    getting to JavaScript. In addition, arrays are not primitive data structures,
    where elements are accessed using a base address and index. In JavaScript, arrays
    are hash maps, and the index numbers are actually keys. This making access of
    elements in an array seem strange or almost wrong to some programmers. Finally,
    JavaScript dynamic typing goes against everything most programmers learned in
    their first programming class, where all types are statically typed.


    But perhaps the strangest concept in JavaScript is its Object paradigm, and what
    will be covered in this chapter. It is not like the Object paradigm built into
    more common OOP languages such as Java/C#/C++.


    To start, the reader should be aware of the basic definition of an object, which
    is that objects are defined as collections of data elements and behaviors. This
    definition is true of more common OOP languages such as Java/C#/C++, and JavaScript.


    Languages such as Java/C#/C++ then refine the definition that a type used for
    object definition is statically at compile time. The new operation in these languages
    means to instantiate (or create a completed final instance) of that object in
    memory. The definition of that object in memory then never changes.


    Language constructs such as the Java interface go a long way towards alleviating
    some of the worst effects of this static model and make a true abstraction in
    the language without'
