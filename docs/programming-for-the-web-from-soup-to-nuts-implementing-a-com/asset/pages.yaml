  md: '# Chapter 5.1 Why Use ECMA 5 as a basis?


    There are many reasons to choose ECMA5 ECMA6+ as a basis for this book. The first
    is that any future implementation of JavaScript will have to have the ability
    to transpiled into ECMA 5. All of the nifty features built into ECMA6+ are built
    on a feature in ECMA5. My personal belief is to understand a concept, the base
    on which the concept is built. If you want to program in C, you should know Assembly.
    If you want to program in Assembly, you should understand Computer Architecture
    and Computer Organization. While understanding the foundations on which ideas
    might not be necessary, there is almost always cases where not understanding them
    leads to problems that would be easily fixed if a programmer understood the next
    layer of architecture.


    The second reason for not choosing ECMA6+ is that the language is making JavaScript
    more concise, e.g add new features to the language that make it easier to write,
    probably harder to understand, and which definitely hides details that experienced
    programmers do not need, but hinder the understanding of novice programmers trying
