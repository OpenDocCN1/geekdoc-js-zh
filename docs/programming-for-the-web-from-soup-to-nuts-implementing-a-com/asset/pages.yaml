  md: '# Programming for the Web: From Soup to Nuts: Implementing a complete GIS web
    page using HTML5, CSS, JavaScript, Node.js, MongoDB, and Open Layers.


    Description

    This book is designed to be used a class text but should be easily accessible
    to programmers interested in Web Programming. It should be accessible to an advanced
    hobbyist.


    The original goal behind this text was to help students doing research with me
    in Web based mapping applications, generally using Open Layers. The idea was to
    use persistent storage using REST and simple http request from JavaScript to store
    the data on a server.


    When teaching this class, I became painfully aware of just how little students
    know about Web Programming. They did not know how to format a REQUEST as URL,
    or the methods that could be used when sending the requests to be processed. Even
    worse, they did not know REST URLs, or that there were different types of requests
    in URL.


    Most could not tell me what the server was, or how it worked. Even few could tell
    the different types of servers (e.g. Rails type, Sinatra type, EJB, etc), or what
    types of services they offered. They did not know how to access the server through
    a simple HTML api as Postman.


    Many did not know HTML, and a lot of those who knew something little beyond how
    to format text on a web page. There was very little JavaScript knowledge in the
    class, and most had not even heard of libraries such as JQuery, Vue, or Bootstrap.


    These were all junior and senior computer students, and the positions of many
    of them were interviewing for this kind of knowledge. Yes they could learn on
    the job. And I know this is not the fundamental skills that many CS faculty believe
    students should learn. There is a lot of good foundational material to be found
    in Web Programming, and I had a lot of good feedback from students who had graduated
    or during an internship where they felt did not use all of the material, it is
    nice to be able to understand what others in the company are talking about.


    Because of the experience with the REST interface, I petitioned the CS department
    of one of the schools I was an adjunct at. The result is of having that class
    3 times at 3 different schools. This purpose is to provide an overview of how
    to program for the Web. It is still clearly silent, but that is something I hope
    to address in a future version of the text


    This material in text is ubiquitous in industry, and I really believe there is
    utility in being able to communicate with others without having 5-10 years'' experience
    seeing all the various pieces of a full stack application for the Web. The book
    is written to be as technology agnostic as possible, trying to emphasize concepts
    over implementations.


    This book is also designed to help students understand how to use Web Programming
    with interfaces and libraries such as Open Layers, which is a mapping interface
    that can be run on a Web browser client.


    This book can be used as the main text for a class in Web Programming. It is not
    intended to be used as the only source of material in such a class, but as to
    guide the class. Most of the material can be easily


    This book is available at The Cupola: Scholarship at Gettysburg College: https://cupola.gettysburg.edu/oer/s'
