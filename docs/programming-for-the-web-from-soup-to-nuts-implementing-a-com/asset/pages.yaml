    # Chapter 2.3 Document Structure Tags and A Simple Web Page


    An HTML document is divided into two main sections, the *head* and the *body*.
    The reason for this division is that the head is to contain metadata, and the
    body is to contain the information to be displayed on the web page.


    To understand this, it is important to understand the meaning of the term metadata.
    According to Dictionary, the meta prefix means: "a prefix added to something that
    consciously references or comments upon some object of features". Hence metaphysics
    is a physics about physics, a meta-analysis is a study of metas, etc.


    Metadata is what it names, data about the data on a web page. It defines how the
    page is to interpret the data it will process. For example, functions are used
    in a web page are defined in the head. How to handle and interpret the CSS tags
    are also defined in the head. Anything that is used to define the behavior of
    the page is in the head of the document.


    As important as what is in the head is what is not in the head of the HTML document.
    The head should not output any information (or data) to be placed on the web page.
    Functions and other structures defined in the head return strings to be printed
    in the body, and not printed to page in the head. If the head is defining something
    to be rendered on the page itself, it does not belong in the head.


    This implies (correctly) that the body of an HTML document should contain anything
    that is rendered and placed on the web page. Any text to be displayed, images
    to be rendered, or forms to be processed belong in the body of the document. And
    again, the body should not contain any metadata such as functions, CSS, or code
    to handle events.


    Nothing in HTML enforces this policy, but there are few good reasons to violate
    it. And when the data in the head and body are mixed, it generally shows that
    the programmer did not have a clear concept of what the page is to.


    In the Document Structure, the `<title>` tag is shown as metadata. This is because
    the title is what appears on the tab in the browser, and not on the page.


    Program 3 is a simple HTML page to illustrate the concepts so far. Note that the
    program uses large `<h1>`, and paragraph `<p>` block tags, and the `<img>` tag,
    which have not been covered. As stated before, this is not to be a text on learning
    HTML, CSS, JavaScript, or any other language or program. It provides enough detail
    to allow a motivated intermediate programmer, specifically students reading with
    myself, enough background to start that. A complete list of HTML tags can be found
    at: https://www.w3schools.com/tags/, and many tutorials exist on how to use them
    in web pages. Readers interested in more functionality of the tags can easily
    learn them up the WWW.


    > ⁶ https://www.dictionary.com/browse/meta?


    > ⁷ In my experience, the best search engine by far for looking up information
    when programming is Google. Other search engines tend to assume a context for
    the terms and bring...'
