    # Chapter 2.4.4 <input type = "checkbox">


    A checkbox is a box which allows a user to choose a single, discrete option. A
    checkbox is normally shown on a web page as a square box. To implement a checkbox,
    use an input tag and set the type attribute to checkbox. Normally the input tag
    will also have an id attribute, and a Boolean attribute checked can be added to
    indicate if the box is checked by default or not. Two formats for a checkbox,
    one checked and the other, are shown below.


    Note the use of the <br/> (break) tag in this program. The break tag is used to
    move the output to the next line.


    ```

    <label id="label1" for="resize">Allow map to be resized: </label>

    <input type="checkbox" id="resize" />

    <br/>

    <label id="label2" for="recenter">Allow map to be recentered: </label>

    <input type="checkbox" id="recenter" checked />

    ```


    Program 9 - Checkbox Example


    # Chapter 2.4.5 <input type = "radiobutton">


    A radio button is similar to a checkbox that it is a Boolean selection. It is
    different from a checkbox that radio buttons form a group, and only one item in
    a group of radio buttons can be selected. Consider two sets of options in Program
    10. The first set of options determines the type of map to display: XYZ Map or
    a Stamen Map. The second set of options determines the size of the map (600x480,
    1024x768, or 1280x800). As shown in the following example, these form two groups
    by having the name common between the buttons. In the first case, the name for
    both buttons is mapType, and the choice is between the XYZ Map or the Stamen Map.
    In the second case the name is common between the buttons, and the sizes are 600x480,
    1024x768 or 1280x800.


    Radio buttons are implemented in HTML by setting the input type to radio. Radio
    buttons are normally round and then grouped to show the mutually exclusive options.
    In HTML, the grouping of options is accomplished using name attribute. All radio
    buttons with the same name are in one group. The following code implements two
    groups of radio buttons. Note that even though it has no purpose right, the value
    attributes are being set for these radio buttons. The values will be used in processing
    these radio buttons later in JavaScript.'
