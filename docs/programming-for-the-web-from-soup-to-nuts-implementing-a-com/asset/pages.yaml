    # 7.3.2 What it means to be asynchronous


    Early it was said that transaction was asynchronous. This has large implications
    for the program that are not apparent, particularly to programmers not familiar
    with concurrency. The following example will point out what is meant by concurrency,
    and why it is an important concept to understand in JavaScript.


    The previous program to send a transaction to the server returned the records
    in the server, however there is no place in the program that displays them. This
    problem now now rectified. To fix this, the records will be written to the console
    by using the responseText method of the xmlhttp object. This will contain the
    records current stored on the server.


    The most obvious way to do this would be to use the code to print out the data
    from the server after the request has been made, as in the following program.
    This program will not produce the expected


    ```

    var xmlhttp = new XMLHttpRequest();

    xmlhttp.open("GET", "mapdata", true);

    xmlhttp.setRequestHeader("Content-Type", "application/json");

    xmlhttp.onreadystatechange = function () {

    xmlhttp.send();

    ```


    > ⁴⁶ This program represents a race condition, and it is actually possible for
