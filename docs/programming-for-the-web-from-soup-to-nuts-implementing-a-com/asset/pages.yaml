  md: "```\n</head>\n<body>\n  <input type=\"button\" id=\"myButton\" value=\"Press\
    \ me\" />\n</body>\n</html>\n```\n\n# Program 54 - Setting a callback function\
    \ in onload event\n\nThis small piece of code is complex, so it will be covered\
    \ in detail here. First a function, onLoad is defined, and it is in this function\
    \ that the Button's click event is associated with the function to alert the user.\
    \ The function onLoad is not called, so it is defined but not yet executed.\n\n\
    The next line, window.onload = onLoad, associates the onLoad method with the onload\
    \ event. This tells the HTML DOM to run the onload function when the onload event\
    \ is raised, after the page is loaded. This means that the button has been defined\
    \ and can be associated with the listener to alert a message when the button is\
    \ pressed. This part is partly simple, at least in a big picture to understand.\n\
    \nWhat is much more complex is the function onLoad not called in the statement\
    \ window.onload = onLoad, but the function is assigned to the variable window.onload\
    \ and later when the onload event is raised. To see this, compare the previous\
    \ program with the next program, which includes the parenthesis in the assignment\
    \ of the window.onload variable. This is a common mistake by novice programmers,\
    \ as novices have been taught that functions are executed statements that are\
    \ not, and data that cannot be passed around using variables.\n\n```\n<html>\n\
    <head>\n  <title>Window onload event</title>\n  <script>\n    function myFunction()\
    \ {\n      /* This code causes the JavaScript to fail if\n      uncommented. It\
    \ would not work anyway as the\n      button code has not been loaded.\n     \
    \ document.getElementById(\"myButton\").onclick = function() {\n        alert(\"\
    You pressed me\");\n      }\n      */\n      alert(\"window is not loaded\");\n\
    \      return \"you dummy\";\n    }\n    alert(window.onload = myFunction());\n\
    \  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\nProgram 55 - Program showing\
    \ function being rather than being set to a variable."
  merge: -1
  pgno: 54
- img_proc: true
  md: "# PROGRAMMING FOR THE WEB:\n\nThe result of this second program is that the\
    \ alert is run once when the head of the HTML file is processed, and the window.onload\
    \ variable is set to the string \"dummy\", which is what is returned from the\
    \ myLoad function. Once again, you cannot associate the button with a function\
    \ as the event would not exist. The code to associate a function with an event\
    \ must be run in the onload event, not when the head of the HTML file is processed.\n\
    \nBefore continuing, the reader should note that if a function is referenced without\
    \ parenthesis (e.g. myLoad) the function is treated as data. If a function is\
    \ referenced with parenthesis (e.g. myLoad()), the function is executed. From\
    \ a syntactic point of view, this is possibly the issue that causes most novices\
    \ to practise JavaScript.\n\nThis example shows an important feature of JavaScript.\
    \ Functions in JavaScript are treated as first class object and can be used as\
    \ any other data type. Functions that can be used as data are called Lambda functions.\
    \ Lambda functions are the bases for the programming paradigm called Functional\
    \ Programming, which is a very different paradigm from Procedural or Object-Oriented\
    \ Programming. Even in languages that include lambda functions, like Java, are\
    \ actually providing syntactic sugar for other languages, and languages like Java\
    \ do not provide a real basis for Functional Programming.\n\nNote that since functions\
    \ can be data, then the onload() function is likely used in the program except\
    \ in response to an onload event. There is really no to clutter the JavaScript\
    \ namespace with the name of the function, and the function is defined anonymously.\
    \ This is the normal way the event callback is defined using any anonymous lambda\
    \ function.\n\n```\n<html>\n<head>\n<title>Using onload event </title>\n<script>\n\
    window.onload = function() {\n  document.getElementById(\"Button\").onclick =\
    \ function() {\n  alert(\"You pressed me\");\n }\n}\n</script>\n</head>\n<body>\n\
    <input type=\"button\" id=\"Button\" value=\"Press me\" />\n</body>\n</html>\n\
    ```\n\nProgram 56 - Setting an event callback function using an anonymous function.\n\
    \nThe variable is here in the same statement as the function defined.\n\nNote\
    \ that the parentheses here do not mean the function is being executed but are\
    \ part of the function definition. Once again this is confusing to novices learning\
    \ JavaScript. To execute this function, the statement windows.onload=function(){}\
    \ would have to be used. This will form the basis for another JavaScript paradigm\
    \ to be introduced later, the Immediate-Invoked-Function-Expression (IIFE)."
  merge: -1
