  md: "# Chapter 3.3.4 jQuery ready function\n\njQuery is a library that provides\
    \ many functions which are useful when doing JavaScript programming. This text\
    \ will use jQuery extensively. This is because jQuery provides so many useful\
    \ features. Also, many of the Examples of JavaScript programming on the internet\
    \ use it, and it is hard to read JavaScript examples on the web without knowing\
    \ the basic concepts of jQuery.\n\nTo use jQuery, the following line should be\
    \ included in the head of your HTML document before any jQuery function is used.\
    \ This line includes the jQuery library and gives the HTML document access to\
    \ all jQuery. It must be included before any other libraries that use jQuery.\n\
    \n```\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js\"\
    ></script>\n```\n\nOnce initialized, jQuery statements are formatted as ${identifier}.\
    \ In this statement, the $ is short for the jquery function, and is just shorthand\
    \ saying $jquery(identifier).\n\nThe identifier can be one of many different types\
    \ of HTML elements, such as a CSS selector, JavaScript elements, element arrays,\
    \ objects, or other types of elements. jQuery will look at the element that is\
    \ requested and a function that will perform the correct operation for that type20.\n\
    \nIn this section, only the jQuery options needed to add the button onClick event\
    \ will be covered. This will be done in two steps. The first will be to handle\
    \ the form loading in jQuery. The second will be to set the onclick for a button.\n\
    \nThe jQuery function that runs after the HTML file has completed processing and\
    \ all form elements are defined by the $(document).ready() function. The $(document).ready()\
    \ function is similar to setting a function in the window.onload event, and for\
    \ the purpose here will be used interchangeably.\n\nThe following code can be\
    \ used to print a message to an alert box for the form elements have been processed.\
    \ Note that an element is not set to a function to execute, but the $(document).ready()\
    \ is executed when the HTML file has loaded. This is a different way to handle\
    \ the semantics of events. JavaScript will set a function to an event variable,\
    \ and jQuery will call a method when the event is raised. Do not let this confuse\
    \ you, as the effect is the same as setting the event variable. The function is\
    \ run when the event is raised.\n\n```\n<html>\n<head>\n  <title>Window onload\
    \ event</title>\n  <script>\n    src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js\"\
    \n  </script>\n  <script>\n```\n\n> 20 For more information on how jQuery works\
    \ and the types that are accepted to the jQuery function, http://api.jquery.com/jquery/"
  merge: -1
  pgno: 56
