  md: '# PROGRAMMING FOR THE WEB:


    This metaphor fails quickly. Consider, what is the Big-O of placing a new tray
    at the top of the dispenser? Since all of the trays must be moved, it is O(n).
    But anyone programming a stack data structure knows, placing a new element in
    a stack is O(1). Something is wrong, and what is wrong with the metaphor²


    It is only when the student comes to understand a stack as it is implemented in
    an array that is a more correct, and more useful metaphor, is understood.


    The problem with Objects in JavaScript can often be traced to a metaphor problem.
    Object Oriented Programming (OOP) is a way of abstracting a problem around data
    which makes up the object, and behaviors that can be applied to the object. There
    is nothing in the definition that talks about implementation, and there are many
    ways to implement the basic concept of an object.


    In traditional OOP, a class creates a type that is instantiated to create object.
    Object is defined by the data (instance variables) and behaviors (methods) that
    are defined in the class. The class represents a type, or model, of what instance
    of the class will look like the program is running, and a variable of the class
    type is. The type (class) cannot be changed after compilation, and new behaviors
    and data cannot be added. In Java, and other traditional OOP languages, the definition
    of the type is statically defined when the program is compiled. The type of variable
    can be changed at run time, but only by creating a new variable in memory, and
    that must also correspond to a statically defined class.


    JavaScript was specifically implemented using a different way to create variables.
    In JavaScript, the type of the variable is the last value it was assigned to.
    This has been seen previously in the text and called dynamic typing. But even
    greater significance to the discussion is that the type itself is dynamically
    typed and can be modified at runtime. This means that variables of a specific
    type can be changed to add new properties (what are fields in a static OOP), and
    even the functions associated with the object can change.


    In JavaScript the data and the type are dynamic and can be changed while the program
    is running. A metaphor based on the idea of creating classes to instantiate instances
    of a type makes no sense to JavaScript.


    This view of object is in keeping with the definition of OOP. Remember that OOP
    is a way of abstracting a problem around data which makes up the object, and behaviors
    that can be applied to the object. It is the abstraction in JavaScript for the
    object occurs at runtime, not compile time. The unstated assumption of most JavaScript
    programmers the metaphor of a static definition and instantiation is simply not
    relevant.


    To implement this definition of object types, JavaScript implements an Object
    as a set of properties and functions in a property set, or hash map. When an object
    property or function is needed, the hash map is queried to find the property or
    function, and then that property accessed, or function executed. By adding new
    properties or functions to the object, they are added to the hash map.


    > One of my improper use of metaphors is to ask, “What color is faith?” The obvious
    answer is yellow, as the Christian Bible describes faith as being “a mustard seed”,
    and mustard seeds are yellow. This is obvious nonsense, but I personally encounter
    this type of reasoning many times every day.'
