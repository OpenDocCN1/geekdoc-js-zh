  md: "# Chapter 3.3.1 Associating a call back with an event\n\nAssociating a call\
    \ back with an event is illustrated in the following program.\n\n```\n<html>\n\
    <head>\n  <title>Error using event </title>\n  <script>\n    function myFunction()\
    \ {\n      alert(\"You pressed me\");\n      //document.write(\"You pressed me\"\
    );\n    }\n  </script>\n</head>\n<body>\n  <input type=\"button\" id=\"myButton\"\
    \ value=\"Press me\" onclick=\"pressFunction();\"/>\n</body>\n</html>\n```\n\n\
    In this example, the event (called on onClick) is associated with the pressFunction,\
    \ which is metadata and defined in the head of the html page. When a user clicks\
    \ on the button that says, \"Press me\", it calls the function with the click\
    \ event, the pressFunction, and an alert box is showing \"You pressed me\".\n\n\
    This is the complete life cycle of events and calls back. An event (click) is\
    \ mapped to a callback function (pressFunction). When the event is raised (the\
    \ user clicks the button), the event back function is called.\n\nThe rest of this\
    \ section will explain how you should implement it in JavaScript.\n\n# Chapter\
    \ 3.3.2 Handling an Event – Unobtrusive JavaScript\n\nBecause event (or callback)\
    \ functions run in response to events from the program, they are metadata. When\
    \ writing HTML page, it is normal for a programmer to define functions to handle\
    \ events coming from form elements in the html document. A standard known as Unobtrusive\
    \ JavaScript says that all JavaScript should be maintained in the head of the\
    \ document, so setting the onClick as part of the button definition is considered\
    \ bad practice.\n\nThe correct way to assign a callback function is as follows.\
    \ First it is important to know that all components on a web page are contained\
    \ in a Document Object Model, or DOM. The DOM is very important when writing JavaScript\
    \ for a browser, as nearly everything is in the DOM. However, for now you should\
    \ know that buttons, text fields, checkboxes, etcetera, are all stored as objects\
    \ in the DOM.\n\nUnobtrusive JavaScript says that the call back should be assigned\
    \ by retrieving the button, in this case the button named \"myButton\" from the\
    \ DOM using the getElementById method. The click"
  merge: -1
  pgno: 51
