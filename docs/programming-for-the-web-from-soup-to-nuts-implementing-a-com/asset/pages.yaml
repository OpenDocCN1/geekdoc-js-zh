  md: "# Chapter 7.2.2 Creating data\n\nIf Postman does emulate a very poorly setup\
    \ browser, it is not useful. But it does much more. As we said at the end of Chapter\
    \ 7.1.4, the server has implemented a full set of CRUD operations. However, to\
    \ access them we need a way to format the requests. Formatting these is nearly\
    \ practical (or possible) from a web browser without using JavaScript. And for\
    \ testing the application, implementing the test cases in JavaScript would be\
    \ a poor choice. The only reason the web browser was able to access the application\
    \ earlier is because the default request, get with no parameters, is the default\
    \ request.\n\nPostman allows us to easily develop and test the REST server application.\
    \ This is probably best seen in the context of using Postman, so the following\
    \ is a life cycle of an application presented using Postman.\n\nThe first step,\
    \ making Postman can reach the server, is already done in the last section. Next\
    \ data should be added to the server. This is accomplished using the POST method\
    \ with the same URL. When sending a POST request, note that a body of the post\
    \ request can be included by clicking the Body button. Click the button and include\
    \ the following JSON object in the body of the request, as shown in the figure\
    \ below.\n\n```\n{\n  \"title\": \"map1\",\n  \"resize\": \"true\",\n  \"recent\"\
    : \"true\",\n  \"mapType\": \"Stamen\",\n  \"mapSize\": \"1024x768\",\n  \"latitude\"\
    : \"-75\",\n  \"longitude\": \"45\"\n}\n```\n\nProgram 113 – Input object for\
    \ Postman POST request\n\nWhen this is request, the server sends back a status\
    \ code of 200 indicating the request was successful. It also sends back a copy\
    \ of the object as was stored in the database. Note that there fields are included\
    \ that were not part of the original request but are added by Sails. These fields\
    \ are createdAt, updatedAt, and id. The important filed is the id field, which\
    \ will be the primary key for this record in the persistent storage. This key\
    \ will be used for subsequent queries to read/update/delete this record.\n\nAdd\
    \ 2 more records, changing at least the title in the Postman body so that you\
    \ know 3 different records have been saved."
