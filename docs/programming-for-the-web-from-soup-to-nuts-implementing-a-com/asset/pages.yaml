    # Chapter 3.3 Events, Onload Event and JQuery


    One paradigm that is implemented in JavaScript is Event Based Programming (EBP).
    Events are asynchronous actions that occur (or are raised) while the program is
    running. These actions (or events) are often generated by the user, such as clicking
    a button or changing a value in a text field. But events can also occur from asynchronous
    action of the program, such as loading the web page or completion of reading of
    file. The events which are raised associated with a callback function that handles
    the event.'
