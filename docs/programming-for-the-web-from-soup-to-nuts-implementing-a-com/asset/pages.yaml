    # Chapter 3.5 Functional Programming in JavaScript


    JavaScript is really a multi-paradigm language. Having the ability to handle more
    than one paradigm can be a blessing and a curse, as having access to multiple
    ways to give a programmer lot of power in JavaScript, but it also makes the language
    hard to use and easy to misuse. We have seen this in this chapter, JavaScript
    supports Object Oriented Programming (OOP) or Procedural Programming through the
    use of prototypes, which is a very different type of OOP that most readers are
    familiar with in Java/C#/C++ etc. JavaScript supports Event Driven Programming³


    JavaScript also supports some elements of Functional Programming, in particular
    lambda functions. The forEach iterator is introduced to introduce lambda functions,
    anonymous functions, the basic concepts of Functional Programming. Note that entire
    books are written on Functional Programming, and so this mean to give a flavor
    of what Functional Programming is, and how it is used in JavaScript. The Functional
    Programming introduction here is enough to be read and understand JavaScript examples,
    but is not enough to explain how to use Functional Programming.


    To understand Functional Programming, the following program forEach function to
    iterate over the Days array is presented.


    > ²³ For more information, see https://softwareengineering.stackexchange.com/questions/127672/is-javascript-a-functional-programming-language.'
