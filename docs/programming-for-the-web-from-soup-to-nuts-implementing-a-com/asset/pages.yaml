  md: '# PROGRAMMING FOR THE WEB:


    Install Node.js, go to the version https://nodejs.js/en/; and select the option
    for the latest Long-Term-Release (LTR) version. Then follow the instructions for
    your operating system. When writing this text, Node.js was installed on a Windows
    computer, and the LTR downloaded a “.msi” file, and the whole installation completed
    without any problems.


    To verify the installation of node, open a DOS command window and type “node -v”.
    You should get back a string describing the version of node you installed.


    # Chapter 7.1.2 npm


    Most modern languages can access tools, frameworks, and other useful libraries
    of functionality that are built on top of the language. For example, frameworks
    have been built for most modern languages that standardize and abstract how interface
    with databases. For each language, there are multiple number of these frameworks,
    and no single project would use all of them. Because there are so many, and some
    conflict with each other, these tools are not built into the base language.


    Not having the tools built into the languages leads to the issue of how to make
    them available to developers. The old method (and the one still used today in
    Java) is to require the programmer to manage their own ownership. But this is
    difficult, and except for large environments that can afford to have personnel
    dedicated to this task, unthinkable.


    The modern answer to the tools build problem is create packages that contain all
    the files and information needed to install the tool or framework. These packages
    are then managed by a package manager. Most modern languages have a package manager.
    For example, in C# there is NuGet, in Ruby these Ruby-Version-Manager (rvm) and
    bundler, and in Python there is pip and PyPM.


    Node Package Manager (npm) is the Node.js tool to manage packages. It is installed
    by default when you install Node.js. It will be used in the next section to install
    the Sails package.


    To verify the installation of npm, open a DOS command and type “npm -v”. You should
    get back a string describing the version of npm you have installed.


    # Chapter 7.1.3 Installing Sails


    When implementing a web server application, most programmers choose a framework
    to start from. These frameworks provide a standard view of the system, as many
    as the tools that making a basic implementation of the application. Later will
    we see just how simple the basic application development can be.


    Web frameworks generally fall into three large categories: Model-View-Controller
    (MVC), REpresentational State Transfer (REST), and full-stack. Within MVC, there
    are two types of frameworks, both of which come from Ruby. Each of these frameworks
    has implementations of the basic scheme, and to see the implementations of these
    frameworks just in Node.js, http://nodejsframework.com/.


    To attempt to explain in detail even one of these frameworks, let alone all of
    them, is a task for an entire book, so the details of the frameworks, advantages
    and disadvantages, etccetera will not'
