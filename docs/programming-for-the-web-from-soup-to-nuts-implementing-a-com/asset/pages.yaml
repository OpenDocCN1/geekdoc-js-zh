    <input type=\"button\" value=\"Process Form\"\n=\"alert('Button is clicked')\"\
    \ />\n```\n\nIn this code, the JavaScript code to execute (e.g. creating an alert\
    \ box) is assigned to a string to the onClick event. In the web page we are developing,\
    \ putting all of the JavaScript code directly in the html would be difficult and不得不\
    \ unpredictable. The onClick can execute any JavaScript expression, so it is easy\
    \ to call a function and put the extended behavior in the function and call when\
    \ the button is pressed.\n\n```\n<input type=\"button\" value=\"Process Form\"\
    \nonclick=\"processForm()\" />\n```\n\nThis method of providing a callback for\
    \ a value is valid and works but represents idiom that is out of favor. A style\
    \ known as Unobtrusive JavaScript is considered best practice for developing web\
    \ pages. One of the principles of Unobtrusive JavaScript is HTML markup and JavaScript\
    \ should not be mixed. This was done in the previous example, where a JavaScript\
    \ statement was placed in the HTML tag for the onClick event.\n\nTo separate HTML\
    \ markup from JavaScript, the jQuery $(document).ready function is used to associate\
    \ the form (element) with a JavaScript function. To do this, the first button\
