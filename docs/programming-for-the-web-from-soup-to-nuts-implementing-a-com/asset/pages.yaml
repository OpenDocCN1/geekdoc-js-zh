    # Section 5.2.4 JSON Serialization and Object Composition


    The example above illustrates a fundamental problem with serialization of objects,
    and that is most objects are not collections of primitives but can contain other
    objects. In fact, it is more common for objects to contain other objects or arrays
    than to contain only primitive values. Object containing other objects is called
    object composition³⁴ implies that each object contained in the object graph must
    be serialized recursively until only primitives exist. The need to serialize all
    objects until only primitive values are referenced are not unique to JSON and
    exist in all object serialization mechanisms.


    The simplest case ofserializing object composition is a tree graph structure³⁵
    To do serialization of an object graph represented by a tree, each node is walked
    recursively. If the node has primitives, output them to the JSON file. If the
    node references another object or array, create a new object or array, and continue
    to recursively process the nodes.


    To illustrate serialization of complex composed objects, consider the following
    example object tree.


    ![](img/ce60a0a8b4160fc893a11ed149173e93_100_0.png)


    Figure 15 - Composite object to be written to JSON


    ³⁴ UML aficionados argue as to whether this call aggregation or composition. The
    distinction is moot here, but in fact this object is a UML composite object, and
    the term composition will be used in this text.

    ³⁵ Object composition means that serialization of objects can result in complex
    graphs with cycles, multiple references to common objects, and other complex graph
    structures. Are serialization mechanisms to deal with these problems in JSON,
    but they are complex and not needed for the material covered in this book.'
