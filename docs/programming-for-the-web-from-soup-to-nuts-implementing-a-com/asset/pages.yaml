    ![](img/ce60a0a8b4160fc893a11ed149173e93_163_0.png)\n\nFigure 32 - XMLHttpRequest\
    \ server request with a race condition\n\nThe issue is that the output to the\
    \ console is occurring while the program is still processing the request, and\
    \ the xmlhttp responseText is not set yet when the console.log method is run.\
    \ To fix this, place the output outside the callback so that it is only after\
    \ the request has completed that the console is written to. This change is represented\
    \ in the following:\n\n```\n<script>\nvar xmlhttp = new XMLHttpRequest();\nxmlhttp.open(\"\
    GET\", \"mapdata\", true);\nxmlhttp.setRequestHeader(\"Content-Type\", \"application/json\"\
    );\nxmlhttp.onreadystatechange = function () {\n  if (xmlhttp.readyState == 4)\
    \ {\n    console.log(\" text = \" + xmlhttp.responseText);\n  }\n}\nxmlhttp.send();\n\
    </script>\n```\n\nProgram 116 – XMLHttpRequest server request with race condition\
    \ fixed"
