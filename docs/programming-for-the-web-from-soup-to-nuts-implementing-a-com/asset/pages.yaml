  md: "# Chapter 7.3 Communicating with the server using JavaScript\n\nThis section\
    \ will describe how to send a transaction using JavaScript from a web browser\
    \ to the server.\n\n# Chapter 7.3.1 Sending a transaction to the server\n\nThere\
    \ are 4 steps involved in writing a program to send a transaction to the server\
    \ from JavaScript:\n\n+   1. An HTTP object is created, and the proper values\
    \ set in that object.\n2. A callback function (or listener) is set to receive\
    \ the data back from the server\n3. The request is sent asynchronously to the\
    \ server.\n4. The server will process the request, sending back (multiple) responses\
    \ as it proceeds. Once the request has completed, the server will send back a\
    \ ready state of 4 and a status code categorizing the result of the transaction.\n\
    \nThese 4 steps are shown in the JavaScript program that sends a request for an\
    \ array of JSON map objects. This code should be placed in a file named \"ReadMaps.html\"\
    \ in the assets directory of your Sails application, and can be accessed using\
    \ the URL http://localhost:1337/ReadMaps.html.\n\n```\n<script>\nlet xmlhttp =\
    \ new XMLHttpRequest();\nxmlhttp.open(\"GET\",\"mapdata\",true);\nxmlhttp.setRequestHeader(\"\
    Content-Type\", \"application/json\");\nxmlhttp.onreadystatechange = function\
    \ () {\n  console.log(\"State = \" + xmlhttp.readyState + \\\n and status = \"\
    \ + xmlhttp.status);\n  if (xmlhttp.readyState === 4) {\n    console.log(\"State\
    \ = \" + xmlhttp.readyState + \\\n and status = \" + xmlhttp.status);\n  }\n}\n\
    \nxmlhttp.send();\n</script>\n```\n\nProgram 114 – XMLHttpRequest example\n\n\
    The following will explain each part of the transaction.\n\n+   1. An object variable,\
    \ in this case named xmlhttp, is created by the constructor function XMLHttpRequest.\
    \ This object will be used to build the request to be sent to the server.\n\n\
    > There is a synchronous version that can be used to send the transactions to\
    \ the server and the synchronous version does not require the callbacks and raises\
    \ the issues involved in processing the asynchronous version. However, using the\
    \ asynchronous version will tie up the browser so that the user cannot interact\
    \ with the browser until the request has finished. It is highly recommended that\
    \ the synchronous version never be used, and it has been deprecated in most of\
    \ the major libraries."
  merge: -1
  pgno: 160
- img_proc: true
  md: '# PROGRAMMING FOR THE WEB:


    2. The xmlhttp is opened (or initialized) to represent a GET request on the server,
    using /mapData as the URL. This is the same request made in Postman to retrieve
    all of the records in the server. The third parameter is whether this request
    is asynchronous. This parameter should always be true. Note that the request has
    only been built, it has not yet sent to the server.


    3. A method is defined and attached to the onreadystatechange event to respond
    to the server after the request is sent. Note that the request is to be sent asynchronously,
    which means that the request will be running concurrently to the rest of the program.
    There will be a larger discussion of the implications of this shortly, but for
    now know that the program will send the request and continue running. The program
    will not wait for a response from the server. The purpose of this method is to
    respond to messages coming back from the server.


    3.1. The server will send back a number of messages to report the state of the
    transaction. Generally, there will be at least 3 responses to any request, a state
    of 2 saying the request was accepted, a state of 3 saying the request is being
    processed, and a state of 4 saying the request is complete, though you can receive
    other state information. Your program should always wait until a state 4 is received,
    meaning the transaction is complete, before continuing⁴⁵.


    3.2. A status will be returned along with the state. A request that completes
    normally will have a state of 4 and a status of 200. However, the status can be
    different depending on the server, and it is a good idea to check these values.


    4. Once the transaction has been initialized and the callback set, the transaction
    can be sent to the server using the send method. In this example, the program
    completes, but the callback function will linger until the request is complete
    and the xmlhttp object is freed.


    The results from running this command are shown in the following figure.


    > ⁴⁵ For more information about request state and status, https://www.w3schools.com/xml/ajax_xmlhttprequest_response.asp'
