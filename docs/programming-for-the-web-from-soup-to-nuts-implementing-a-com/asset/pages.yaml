    # Chapter 3 JavaScript and processing a simple form processing


    This chapter will cover JavaScript with the goal of processing the simple form
    created in Chapter 2. Programmers from other languages will recognize most of
    the material in this chapter, as procedural programming in JavaScript is the similar
    to other languages C derived languages. Even the events, lambda functions, IIFE,
    and functional programming will have analogues to concepts that students have
    already studied.


    The chapter will also include an introduction to jQuery, to replace functions
    like `document.getElementById` or to introduce `$(document).ready()` function.
    The goal in this chapter is to introduce jQuery as a short cut examples. The most
    important reason to introduce jQuery is it is often treated as if it is part of
    the base JavaScript language. When looking for JavaScript examples the online
    will use jQuery in examples and to understand these examples some simple jQuery
    knowledge is useful.


    The goal of this chapter is to become familiar with basic JavaScript syntax and
    to begin how to structure programs in JavaScript. Future chapters will continue
    to cover JavaScript objects and how start applications that will be used in the
    mapping applications this book will present.


    # Chapter 3.1 Starting a JavaScript program


    The next 3 subsections will describe how to insert a JavaScript program into an
    HTML file, to insert comments into JavaScript, and how to write output to the
    HTML page. At the end, one example of all 3 sections will be given.


    # Chapter 3.1.1 Inserting JavaScript into an HTML file


    JavaScript is used to create interactivity in a HTML web page. JavaScript is not
    part of HTML but is a scripting language that is contained in an HTML document
    and is interpreted by'
