    \ calling the ready function is to put the function to be run when the page is\
    \ loaded as a parameter to the jQuery function. Remember that $ is the jQuery\
    \ function, so\n\n```\n$function(){...})\n```\n\nis the same as saying\n\n```\n\
    jQuery(function(){...})\n```\n\nThe jQuery function will recognize the parameter\
    \ is the parameter and set it to respond to the ready event. This is only a syntax\
    \ change to make the code shorter and easier to understand. Just remember if a\
    \ function is passed to the jQuery function, it is set to the jQuery ready event.\n\
    \n```\n<html>\n<head>\n<script>\nsrc=\"https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js\"\
    \n</script>\n<title>Window onload event()</title>\n<script>\n$(function() {\n\
    \  alert(\"window is loaded\");\n})\n</script>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\nProgram 58 - jQuery 3.0 ready function\n\n# Chapter 3.3.5 Using jQuery\
    \ to access an DOM variable\n\nOne of the best advantages to jQuery is that it\
