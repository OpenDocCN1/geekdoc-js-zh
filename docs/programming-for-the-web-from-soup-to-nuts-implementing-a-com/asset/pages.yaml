  md: '# PROGRAMMING FOR THE WEB:


    JavaScript engine in the browser. It is inserted into an HTML file by enclosing
    the JavaScript between <script> and </script> tags<sup>10</sup>


    The following points should be remembered when implementing JavaScript:


    +   1. JavaScript is not HTML. If you place JavaScript source in a non-scripting
    portion of HTML web page, it will likely just print out on the page. If you place
    HTML source in a JavaScript portion of the page, JavaScript program will likely
    fail with unexpected consequences. Use only JavaScript programs of script tags.

    2. HTML is not case sensitive. The <a> and <img> tag are interchangeable. For
    consistency and readability, a case should be selected, but there is no rule that
    says a tag cannot be entered as <body>. JavaScript is case sensitive. The variables
    Name and name are different. Keywords are always lower case (for, while, etc),
    and their uppercase equivalent will not work.

    3. JavaScript statements should end with "; semicolon. However, in most cases
    the language does not use this semicolon or not. This text will attempt to use
    the semicolon to end all statements<sup>11</sup>, as it is considered good practice.


    # Chapter 3.1.2 JavaScript Comments


    Comments in JavaScript are the same as C derivative languages. There are two types
    of comments. The first type of comment is a line comment. A line comment is signified
    by //, and all of the subsequent text on that line is a comment. An example of
    declaring a variable and commenting is illustrated on the following line.


    ```

    let loopCount; // Counter for string processing loop

    ```


    Program 16 — Line comment in JavaScript


    The second type of comment is a block comment. Block comments begin with /* and
    continue until the program has a /. The following is a block comments.


    ![](img/ce60a0a8b4160fc893a11ed149173e93_36_0.png)


    ¹10HTML was designed to handle scripting languages other than JavaScript. The
    <script> tag contains an attribute named language, and it is still possible to
    find HTML code that uses the <script language="javascript"> tag. However, no scripting
    language JavaScript was ever used in HTML. The <script> tag does not need the
    language attribute, and it is seldom used some scripting language other than JavaScript
    is used.


    ¹¹ When teaching introductory class in JavaScript for non-majors, I drop semicolons
    as they are confusing to students with no programming background. For example,
    as if statement that uses a semicolon, as "if (n==1);", is the source of confusion
    to novice programmers, and it does really serve a good purpose to go through the
    pain of explaining why the if has a null statement, and what that means.'
  merge: -1
