  md: "# 51 PROGRAMMING FOR THE WEB:\n\n![](img/ce60a0a8b4160fc893a11ed149173e93_53_0.png)\n\
    \nFigure 4 - Error message processing a form element before it is defined\n\n\
    How to handle this problem will be the subject of the next section.\n\n# Chapter\
    \ 3.3.3 Handling an Event – onload event\n\nTo handle the problem of needing to\
    \ access the button in the head, an event is defined that raised after the form\
    \ is loaded, and all elements are defined. This event is called an onload event.\
    \ The onload event occurs after the form is loaded, and then after all the elements\
    \ have been processed and are available to be referenced. A callback function\
    \ attached to the onload event can safely reference form elements in the body,\
    \ knowing that the form is completely loaded, and the body of the HTML file is\
    \ processed. This is shown in the following\n\n```\n<html>\n<head>\n  <title>Using\
    \ onload event</title>\n  <script>\n  function myOnload() {\n    document.getElementById(\"\
    myButton\").onclick = function () {\n      alert(\"You pressed me\");\n    }\n\
    \  }\n  window.onload = myOnload;\n  </script>\n```"
