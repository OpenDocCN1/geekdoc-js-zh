  md: "# PROGRAMMING FOR THE WEB:\n\ndevelop and implement consistent page layout.\
    \ Here that involves creating a header and footer section for the page.\n\nTo\
    \ start the format for the header should be defined. A typical header presents\
    \ information such as a title associated with the program or entity, heading elements\
    \ (such as the organization), a logo, and author information. Also, in the header\
    \ is a menu of options for the system, which for now will contain the entries\
    \ Home, File, and About. The header we will create for this page is as follows.\n\
    \n![](img/ce60a0a8b4160fc893a11ed149173e93_72_0.png)\n\nFigure 5 - Example HTML\
    \ header\n\nHTML provides two elements to select to easily format the header and\
    \ the footer of a web page, `<header>` and `<footer>` tags. This section will\
    \ format the header element.\n\n# Chapter 4.1.1 CSS Syntax\n\nCSS code is defined\
    \ in a section of the HTML web page between `<style>` and `</style>` tags²25.\
    \ Between these tags, CSS code is embedded in the HTML, just as JavaScript is\
    \ embedded in the HTML. This CSS contains display elements, or properties, that\
    \ inform CSS how to render the page. The format for CSS is the following:\n\n\
    ```\n<style>\n  selector {\n    attribute1 : value;\n    attribute2 : value;\n\
    \  }\n</style>\n```\n\nProgram 70 - CSS syntax\n\nIn CSS, a selector is entered,\
    \ and then associated with a block of properties to apply to that selector. There\
    \ are 4 types of selectors that will be covered in this text²26. They are:\n\n\
    +   1. Element selectors, which are such as the `<header>` and `<p>` tags.\n2.\
    \ Class selectors, which apply to a group of items. Class selectors start with\
    \ a `.`, such as .header-icon or .header-desc, and are them referenced using the\
    \ `class=.header-desc` syntax in the element ag.\n\n> ²25 CSS can also be done\
    \ in an HTML tag using the style attribute, but this violates the idea of separating\
    \ concerns in a web page, and like Obtrusive JavaScript, best practices say to\
    \ not mix CSS and HTML.\n²26 For a complete list of all selectors and how to use\
    \ them, see https://www.w3schools.com/cssref/css_selectors.asp."
  merge: -1
  pgno: 72
- img_proc: true
  md: "Id selectors, which apply to a single element referred to by its unique id.\
    \ Id selectors start with a \"#\", such as \"#inputForm\". Id attribute in the\
    \ tag is used to refer the selector\n\nAttribute selectors, which apply to attributes\
    \ of a tag. For example, to make all textboxes which are readonly a gray background,\
    \ the following display attribute tag would use:\n\n```\n<style>\ninput:read-only\
    \ {\n  background-color: lightgray;\n}\n</style>\n```\n\nProgram 71 – Attribute\
    \ Selectors\n\nThis attribute informs CSS to apply any input tag that has a read-only\
    \ attribute and make the background color gray.\n\nEach of these selectors will\
    \ be explained in context in the following sections how to display the input form.\n\
    \nDisplay attributes, or properties, allow the programmer to describe how to display\
    \ the information that will later be associated with the tag. Properties like\
    \ font, background-color, border box, indentation, and literally scores of other\
    \ attributes. A complete list of attributes that can be set at https://developer.mozilla.org/en-US/docs/Web/CSS/Reference.\n\
    \n# Chapter 4.1.2 Semantic Tags\n\nThe <header> is an element selector. It is\
    \ also called a semantic tag.\n\nSemantic tags are tags that are intended to simply\
    \ provide formatting information, but have meaning about the information, or structure\
    \ of the information, on the web page. To better understand semantic tags, consider\
    \ some of the tags in HTML that have been deprecated. For example, the <b> (bold)\
    \ tag says what to bold the text (what to do with it). The <strong> tag describes\
    \ the text as important, and to revert the text as normal, by normalizing it.\
    \ Similarly, the <i> (italic) tag has been deprecated in favor of the <em> (emphasis)\
    \ tag. In both of these, the new tags say something about the text, not to do\
    \ with the text.\n\nThe <header> describes semantic information, what is contained\
    \ between the <header> and </header> is a specific part of the page (the header),\
    \ and not some random division on the page. The header is the block at the top\
    \ of a page, and the information associated with it is specifically how to format\
    \ the header of the document.\n\n# Chapter 4.1.3 Setting up the header block\n\
    \nThe header of a document is the part of the document that is displayed at the\
    \ top of the web page. The properties to define how the header appear are set\
    \ as attributes when the header tag is defined. The header tag is defaulted as\
    \ in CSS."
