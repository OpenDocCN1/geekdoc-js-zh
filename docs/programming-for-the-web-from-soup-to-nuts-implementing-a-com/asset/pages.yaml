    # Chapter 4 CSS and styling a web page


    When creating a style for a web page, having a consistent look and feel to the
    buttons and the application is important. The pages should look similar in format,
    and the behavior of buttons and menu options should work the same way across an
    application and suite of applications. Cascading Style Sheets (CSS) is the language
    used to style web pages, to make the pages consistent and professional.


    The form as it is presented so far contains the elements, with no styling to make
    it more presentable. This is in keeping with an age-old programmer prejudice that
    if something works, who cares what it looks like. But application development
    is about more than making the page nice. It is about how to design a User Interface/User
    Experience (UI/UX) that makes it easier and more pleasant for the user. A good
    thing for programmers to remember is a system that works but does not have users
    is as useless as a system that does not work.


    Because of their implicit bias to simply make a system work, it often fails to
    the programmer to do UI. But they must interface with UI/UX designers and need
    to respect what they do. This is why a basic understanding of CSS is important.


    Like JavaScript, CSS is a language that is implemented inside a web page. CSS
    uses the HTML <style><style> tags to contain the CSS attributes. The CSS attributes
    are mapped to HTML tags, ids class names, or attributes to define how to style
    those elements.


    This section will cover how to style the form developed in Chapter 2, and thus
    will present information about CSS as it is needed. At the end of the chapter
    we will show some extra examples be given how to apply CSS for specific formatting.


