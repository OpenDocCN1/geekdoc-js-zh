    # Chapter 3.2.3 Procedural constructs


    There is a famous computer science theory, the "Bohm-Jacopini Structured Programming
    Theorem", holds that all programs can be generated using only three programming
    constructs:


    +   1. A sequence which is just one statement after another.

    2. A branch, such as an if statement.

    3. A loop, such as a while or for loop.


    A sequence is easy to understand, as one statement follows. The other two structures
    will be covered in more detail in the subsequent sections of this chapter.


    Once again, the purpose of this book as a primer for preparing students to work
    with map applications is emphasized. There are a number of different JavaScript
    control structures, such as do-while switch, etcetera, are not covered. This does
    not mean that they are useful; however, they do not provide value to the purpose
    of this text. As stated at the beginning of this text, this is not a text on JavaScript
    or any other technology, but a basic overview of technologies and how they fit
    together.'
