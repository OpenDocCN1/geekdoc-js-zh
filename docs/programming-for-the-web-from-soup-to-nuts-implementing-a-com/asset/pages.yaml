    \ a way to reference them. If there are a number of divisions to be styled, normally\
    \ a class variable is defined in CSS, and referenced using the class attribute\
    \ in the tags. If the division is to be uniquely styled, it will be given an id\
    \ attribute, and CSS will use it using an id variable. Since the divisions in\
    \ the header will be unique for the header, they will use id variables to reference\
    \ and style them. Note in the program above, the individual divisions have been\
    \ assigned the names header-icon, header-menu. This follows CSS conventions which\
    \ favor hyphenated names.\n\nWhen referencing id in CSS, the name is prefixed\
    \ with a hash tag (#). For example, to set the header-desc to a display of inline-block\
    \ the following would be used.\n\n```\n#header-desc {\n  display : inline-block;\n\
    \  margin : 25px;\n}\n```\n\nCareful readers will remember that this is id variables\
    \ were referenced in jQuery. jQuery uses CSS naming conventions to access DOM\
    \ elements. This was alluded to earlier, but now is made explicit. Thus, to use\
    \ jQuery at least a passing knowledge of CSS is necessary to know how to access\
    \ DOM elements\n\nThe main purpose of the CSS for these header divisions is to\
    \ set the display parameters for them. The choice of inline-block tells the DOM\
    \ to lay these divisions out as blocks, one after another on the same line. The\
    \ margin tells the DOM how to space the elements apart."
