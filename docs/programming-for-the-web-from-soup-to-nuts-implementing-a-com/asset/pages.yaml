  md: '# PROGRAMMING FOR THE WEB


    The astute reader will nowadays have an AHA moment when they will understand the
    importance of Lambda functions. Lambda functions are functions that are treated
    like data. As such, functions do not exist statistically in compiled languages
    like Java. Functions in JavaScript are simple data and can be stored and changed
    in an object just like any other.


    Thus, the JavaScript OOP model is built around Lambda functions, and they are
    what they allow this object model to work. Properties in the property map for
    an object are not simple items, but also the functions. It is at this point that
    a JavaScript programmer will have to throw out their hands and admit that a metaphor
    of class-based OOP fails completely when understanding JavaScript.


    The lack of types and structured objects in JavaScript flies in the face of everything
    many programmers have learned about objects, and even seems to defy logic. There
    are two ways to program do. The first is what many programmers do, accept their
    metaphor of how things work and believe the JavaScript model of objects must be
    wrong.


    This view is unbiased bias, or prejudice, that cannot be logically defended. The
    JavaScript model works, and in itself is sufficient to accept that what JavaScript
    is making sense. The only valid response is for the person learning JavaScript
    to change how they understand OOP³.


    This does not stop programmers from trying to apply Java metaphors to the concepts
    in JavaScript. But creating these metaphors is much harder, and in the long run
    much less fruitful, then simply how JavaScript works. And learning JavaScript
    has an advantage that using unstructured of the data is often a nice way to easily
    solve problems that would be very difficult in a structured, type-based approach.


    # Chapter 5.3 Basic Objects in JavaScript


    When thinking about OOP, remember that at its core OOP is an abstraction mechanism
    that defines objects by a set of data and behaviors that act on that data. Everything
    else, like interfaces and classes, are implementation details and not part of
    the definition.


    JavaScript''s view of an object that stores properties (data) and functions (behaviors)
    in a hash data structure (which we will call a property map).


    Property maps of complex objects are stored as pairs of property name and property
    values. Since new properties can be added or deleted from the map, the map does
    not have a static definition (e.g. it has no class definition). A JavaScript object
    is just a set of properties and values.


    This section will cover how to create, manipulate, and access objects. It will
    first cover how objects are property maps. It will then show how JavaScript Object
    Notation (JSON) is a natural way to serialize and store objects externally to
    the current program.


    > ³ Not to make too a fine point here, but this is true in all things in life.
    We all have prejudices and biases, all of them based on some facts and lots of
    unexamined metaphors of life we have created. Part of education, and creating
    an educated populace, is to teach people to examine their assumptions about their
    metaphors.'
