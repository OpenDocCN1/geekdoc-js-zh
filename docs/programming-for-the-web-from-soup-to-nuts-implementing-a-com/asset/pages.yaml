  md: "# 107 PROGRAMMING FOR THE WEB:\n\nEvery function, not just Constructor functions,\
    \ has associated with it a prototype object (property map).³ To see how this prototype\
    \ object is used, the construction of the JavaScript object with the new operator\
    \ needs to be understood.\n\nWhen the JavaScript `new` operator is invoked, it\
    \ does two things:\n\n+   1. First sets the variable on the left-hand-side (lhs)\
    \ of the sign to the `this` variable that was used in the Constructor Function.\n\
    2. Second a prototype variable (a link) in the object's property map is set to\
    \ point to the prototype object map corresponding to the Constructor Function.\
    \ The value of this link cannot be directly changed by the object or accessed\
    \ when a property is requested for the object that cannot be found in the properties\
    \ map.\n\nThe behavior of recursively searching maps, described earlier, can now\
    \ be implemented. When a function is requested, the property map for the individual\
    \ object is searched. If the function is not found, the search continues in the\
    \ prototype map of the Constructor Function. If it is still not found, the search\
    \ continues until the function is found, or of the root of the tree, the Prototype\
    \ object, is reached.\n\nIn the following example, the print method is invoked\
    \ from the individual objects, and stored in the Map protocol object. Now the\
    \ two objects, `MapA` and `MapB`, both share the same print function.\n\n```\n\
    <script>\nfunction Map(options) {\n  // Set default values\n  this.title = \"\
    MyMap\";n  this.resize = false;\n  this.recenter = true;\n  this.center = [-77,\
    \ 39];\n\n  // Load values from options\n  for (let prop in options) {\n    if\
    \ (!this.hasOwnProperty(prop)) {\n      console.log(\"Property \" + prop + \"\
    \ is not recognized in Map\");\n    }\n\n    this[prop] = options[prop];\n  }\n\
    }\n\nMap.prototype.print = function() {\n  console.log(\"title = \" + this.title);\n\
    \  console.log(\"resize = \" + this.resize);\n  console.log(\"recenter = \" +\
    \ this.recenter);\n  console.log(\"center = \" + this.center);\n}\n```\n\n> ³\
    \ Unless a function is a Constructor Function, this prototype object is not used,\
    \ but the function will still have prototype objects associated with them."
