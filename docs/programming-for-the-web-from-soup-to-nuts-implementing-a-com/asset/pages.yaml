  md: '# PROGRAMMING FOR THE WEB:


    </center>The <i>quick</i> brown fox jumped over the <strong>lazy/</strong>dog</strong></center>


    would be rendered as:


    The quick fox jumped over the lazy dog


    Markup languages are the precursors of word processing programs that became popular
    in the 1980''s with the PC revolution. The word processing programs, which used
    a What-You-See-Is-What-YouGet (WYSIWYG) interface, which is much easier for a
    computer user to interface with a markup language. WYSIWYG editors virtually took
    over the market for word processing, with a few exceptions such LaTeX, as mentioned
    earlier.


    SGML was originally a traditional markup language, and hyperlinks between documents
    were added to create HTML. The beside purpose was to link physics papers together
    in a web of documents. HTML started with a browser introduced at CERN in 1990,
    HTML has expanded far beyond the wildest vision of its creators, but still maintains
    its markup character.


    HTML still consists of text and tags. Over time, HTML has evolved from its roots,
    and is no longer simply as a way to format document. The HTML language is now
    used to define the content (or contextual meaning) of items on a web page, and
    the tags have evolved to represent this new role. The original tags specifying
    how to format text, such as <b></b>, centering <center> and italicizing <i>, are
    now considered obsolete and their use is discouraged. Bold is now done by the
    tag strong <strong>, and italicizing is done by the tag emphasis <em>. Formatting
    is based on the tags using CSS, and interactivity is defined using embedded JavaScript
    programming using the <script> tag. HTML has become much more than a simple markup
    language, but to understand HTML it is important to understand its roots as a
    markup language.


    The tags in HTML are key words defined between a sign (< and a greater sign (>),
    when using HTML, it is more common to call angle brackets. Between the angle brackets
    are HTML tags and attributes. For example, the HTML tag to bold text is the word
    strong, so to bold the text <strong> represents the actions taken by the program
    that processes the marked-up text.


    HTML tags are not case sensitive, so the tags <i> and <I> are equivalent.


    Most tags are applied to a block of text, and apply to the block of the text they
    enclose. All tags are closed using a slash (/tag), as in the example above where
    <strong>lazy/</strong> caused the word lazy to be bold.


    The tags shown above are called block⁴ tags in the first tag (e.g. <i>) specifies
    where to begin italicizing the text, and the closing tag (e.g. </i>) specifies
    where to stop indenting the text. The text or other information between the two
    is called a block.


    ⁴ terms block and container tags are often used interchangeably in HTML. This
    text will make a distinction between block and container. Semantically it is easier
    to refer to a block tag as referring to an attribute to apply to all the elements
    in the block, such as italicizing or bolding the text in the example above. Other
    tags, as the div or table tag contain other HTML elements and will be called container
    tags.'
