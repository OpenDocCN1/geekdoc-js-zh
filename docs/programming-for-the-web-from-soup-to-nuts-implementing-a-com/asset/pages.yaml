    The second thing I always recommend writing HTML code is to end all container
    tags when the beginning is entered. When `<head>` is entered, the `head>` is immediately
    entered. This is the automatic behavior of many IDEs. The reason to enter a close
    tag when opening a container tag is to enforce boundaries on the ideas and concepts
