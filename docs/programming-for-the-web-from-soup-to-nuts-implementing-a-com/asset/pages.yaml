    # ## Chapter 3.4.3 Processing a textbox\n\nIn the previous example, an alert box\
    \ was used to test if the program was wired correctly, e.g. that the processButton\
    \ function was called when the button was pressed. It is important in language\
    \ to make sure parts of the program work before trying to build the entire program.\
    \ Novice programmers will often attempt to write entire programs and end up with\
    \ a 20-line program with 100 compiler errors, severe logical errors, and no chance\
    \ to making a working program. The first thing to do when writing is to break\
    \ the program down into simple pieces and make each piece work while building\
    \ those pieces into the larger program.\n\nThis is true in languages like Java,\
    \ C#, C/C++, etc., but is even true in a language like JavaScript. In JavaScript,\
    \ a single bad line of code can cause a program of 100's of lines of working JavaScript\
    \ to simply produce no output. These programs will often produce confusing errors,\
    \ or no errors at all. In JavaScript, it is always best to build a program in\
    \ stages, making sure each change has the desired effect.\n\nNow that the button\
