    \ This program structure gives rise to an interesting problem with variables known\
    \ as closure. The program starts with the fact that variables scoped in the outer\
    \ function are also scoped in the inner functions, as shown in Program 96 below.\n\
    \n```\n<script>\nfunction f1() {\n  let varl = \"function scope\"\n\n  function\
