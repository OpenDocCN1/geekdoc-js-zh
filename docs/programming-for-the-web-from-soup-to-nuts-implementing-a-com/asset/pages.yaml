    # Chapter 3.2 Primer on JavaScript


    This section covers the basic procedural constructs of the JavaScript language.
    It covers the material that most programmers will be familiar with: variables,
    procedural constructs (branching and loops), and functions. While some concepts
    will be different from how readers are used to think about them, all of the concepts
    here will be similar to the readers already know. It is thus a primer, or elementary
    introduction, to JavaScript.


    # Chapter 3.2.1 Variable Types


    Variables in JavaScript are declared using a let statement (see important footnote
    below). For example, the variable loopCount can be declared as follows:


    ```

    let loopCount;

    ```


    > Program 25 - Declaring a variable using let in JavaScript


    To some coming from a strongly typed language such as Java, this is strange in
    that it does not declare the type of the variable, only the variable exists. This
    is because JavaScript is a dynamic (or loosely typed) language. The type of the
    variable is the type of the last value that was assigned. A variable can, and
    very often, change type during the execution of a program. This is illustrated
    in the following code fragment, where aVar is changed from a number to a string.


    ```

    let aVar = 7; // aVar is a number

    aVar = "string"; // aVar is now a string

    ```


    > Program 26 - Dynamic Typing in JavaScript


    Dynamic typing is something a programmer coming from a strongly typed language
    must become accustomed to and requires the programmer to carefully consider their
    code or strange bugs can be introduced. For example, the following Java code fragment:


    ```

    int aVar = 7;

    ```


    > 12 ECMAScript6 has deprecated the var keyword in favor of the let keyword. Except
    for cases such as loop variables, they are generally equivalent. If you see a
    var statement when reading code on the web, you can mostly set it to a let statement
    when reading it. The differences are not important at this point.'
