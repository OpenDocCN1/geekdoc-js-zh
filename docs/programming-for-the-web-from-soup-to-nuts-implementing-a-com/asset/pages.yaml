  md: "```\n<style>\nheader {\n  display: block;\n}\n</style>\n```\n\n# Program 72\
    \ – Header definition\n\nThe default <header> tag includes just one attribute,\
    \ display:block, which specifies that the header sites in a block by itself at\
    \ the top of the document. In CSS, a block attribute create a space that spans\
    \ from left to right margin of the element, allowing no other elements to be displayed\
    \ to the left or the right. This is the normal behavior of a header, which generally\
    \ spans the entire length of the top of the page. Like any display attribute can\
    \ be overridden if needed.\n\nThe header for the example page developed in this\
    \ chapter will be built in stages in the subsections below.\n\n# Chapter 4.1.4\
    \ Changing the background and text colors\n\nThe first attributes be to change\
    \ the box a dark color (we use slategray) and make the text white. This is done\
    \ by setting the attributes background-color to slategray, and color to white.\n\
    \nTo make the header stand out more, a box will be placed around the header, using\
    \ a 2-pixel large blue line. The header is also indented 50- pixels from the sides\
    \ and top and bottom. This results in a first pass for the header in the following\
    \ code.\n\n```\n<html>\n<head>\n<title>Please change this to the title of your\
    \ page</title>\n<style>\nheader {\n  margin: 50px;\n  border: 2px solid blue;\n\
    \  background-color: slategray;\n  color: white;\n}\n</style>\n</head>\n<body>\n\
    <header>\n<h1>This shows the header style.</h1>\n</header>\n</body>\n</html>\n\
    ```\n\n# Program 73 – Header attribute settings\n\nThe page resulting from this\
    \ program follows as:\n\n> 27 For a complete listing of all display types, see\
    \ https://www.w3schools.com/cssref/pr_class_display.asp."
