    ![](img/ce60a0a8b4160fc893a11ed149173e93_158_0.png)


    Figure 28 – Postman PATCH (or Put) request to update an object


    Finally, the edit CRUD operation is accomplished by using the URL for a specific
    record and the DELETE method. The following shows an example of deleting the record
    with an ID of 2. In this case, the server sent back a Status code of 200, signing
    the transaction, and the JSON of the record that was deleted.


    Different servers will choose Status codes for these transactions, and the Delete
    transaction will often return 404 saying the record was not found because it was
    deleted. This can be confusing, as it could be that the record was not found,
    OR the record was deleted. What status codes are returned for different operations,
    especially when there is a complex transaction, can be confusing, and even the
    documentation as to what a server will return can hard to understand. The best
    advice might be use trial-and-error to find out what status codes will be returned.'
