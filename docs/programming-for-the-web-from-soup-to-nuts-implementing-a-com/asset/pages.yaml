    \ the inner function is used as a lambda value. The lambda function can now be\
    \ called after the outer function has completed, causing the variable scoped in\
    \ the outer function to be referenced after the outer function has completed running.\
    \ This is shown in the following\n\n```\n<script>\n  let obj1 = new function f1()\
