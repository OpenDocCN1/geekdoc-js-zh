  md: "# PROGRAMMING FOR THE WEB:\n\n```\n/* This function calculates the velocity\
    \ given the speed and time */\n```\n\n# Program 17 - Block comment in JavaScript\n\
    \nOften novice and even intermediate programmers will use these two types of comments\
    \ interchangeably. This can lead to problems, particularly when commenting out\
    \ lines of code while debugging. For example, consider the following code block\
    \ where the comment for the variable is done using a block comment.\n\n```\nfunction\
    \ f() {\n  let loopCount; /* Counter for string processing loop */\n}\n```\n\n\
    # Program 18 - Block comment in a function\n\nIf something is wrong with the function,\
    \ a common debugging tactic is to put a line of code in the program to show the\
    \ function is entered, and then comment out the rest of the program:\n\n```\n\
    function f() {\n  console.log(\"in function f\");\n  /*\n  let loopCount; /* Counter\
    \ for string processing loop */\n  */\n}\n```\n\n# Program 19 - Why you should\
    \ not use block comments in\n\nThis comment will not work, if /* and */ tokens\
    \ are not matched. The /* signals the start of the comment, and the comment ends\
    \ when a */ is encountered. The highlighted /* and */ tokens are matched above.\
    \ This will leave the '*/' at the end of the function outside of a comment, and\
    \ this will produce an error.\n\nA good rule for using line and block comments\
    \ is to use block comments for the documentation of a function that appears before\
    \ the function. Comments that occur inside of the function should use line comments.\
    \ This is the commenting strategy used in this.\n\n# Chapter 3.1.3 Output from\
