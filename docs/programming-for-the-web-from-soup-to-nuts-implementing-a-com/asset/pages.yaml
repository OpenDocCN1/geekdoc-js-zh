  md: "# PROGRAMMING FOR THE WEB:\n\n```\n<script>\nfunction printDay(day, index)\
    \ {\n  alert(\"Weekday \" + (index+1) + \" is \" + day);\n}\nlet weekDays = [\"\
    Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"];\nweekDays.forEach(printDay)\n\
    </script>\n```\n\nProgram 68 - Final program to process a form\n\nThis program\
    \ illustrates one aspect of functional programming: that a function is built by\
    \ allowing functions to call other functions that are parameters to the first\
    \ function. The foreach function takes another function, the printDay() function.\
    \ The printDay() function is evaluated in the foreach function for each member\
    \ of the array², and the object and index are passed as parameters to the function.\n\
    \nThe use of functions as data in a language is called a lambda function. A lambda\
    \ function is a function that is treated as data and can be passed as a parameter\
    \ to other functions, assigned to variables, or used as any other data type. Another\
    \ example of using functional programming is given in the Exercises at the end\
    \ of this chapter.\n\nIn the example of Functional Programming in Program 68,\
    \ the function printDay is only defined to pass to the foreach method. Thus, there\
    \ is no reason to give it a name, and the function would be better written as\
    \ an anonymous function, as in the following example.\n\n```\n<script>\nlet weekDays\
    \ = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"];\nweekDays.forEach((day,\
    \ index) => {\n  alert(\"Weekday \" + (index+1) + \" is \" + day);\n});\n</script>\n\
    ```\n\nProgram 69 - Final program to process a form\n\nOne Functional Programming\
    \ pattern, the reduce pattern, has gained a large following for implementing Parallel\
    \ Processing and Big Data processing, and so it is useful to be least unfamiliar\
    \ with Functional Programming.\n\n# Chapter 3.6 Exercises\n\n+   1. The following\
    \ is Lincoln's Gettysburg Address. Format this using HTML in JavaScript write\
    \ statements that each paragraph is separate, and the text is centered. The lines\
    \ in your program should not be longer than 80 characters.\n\n²Note here the printDay\
    \ function is named, but it is a lambda value since it is passed as data to another\
    \ function. Do not fall into the trap of believing all anonymous functions are\
    \ lambda functions, or all lambdas functions are anonymous. For more information\
    \ about lambda versus anonymous functions, see https://gist.github.com/ercelliott/41be9be82184436fdf."
