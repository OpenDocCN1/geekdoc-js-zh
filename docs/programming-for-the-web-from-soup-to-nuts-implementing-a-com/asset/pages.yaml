  md: "The next type of scoping is function scope, which is also called local scope\
    \ in JavaScript. Function scope occurs when a variable is declared inside a block\
    \ program that has a function. The following program shows the loop above, but\
    \ now the variable count has function scope.\n\n```\nfunction func() {\n  let\
    \ count = 0;\n  for (count = 0; count < 10; count++) {\n    Do something\n  }\n\
    }\n```\n\nThe difference between the block scope and function scope code would\
    \ be basically meaningless in most programming languages such as C#/C++ only exist\
    \ while the function exists (e.g. the function is on the stack track). In Java/C#/C++,\
    \ the function is pushed on the stack when the function is entered and popped\
    \ when it is.\n\nFunction scope in JavaScript is very different, and function\
    \ variables are not released when a function exits. This will be covered in more\
    \ detail in the section on Closure.\n\nThe final type of scoping in JavaScript\
    \ is global scope. A variable declared outside of any block of code defined by\
    \ braces {} is globally scoped. There is one copy of the global variable in the\
    \ entire program, and for the purposes of this discussion, that comes into existence\
    \ when the program starts running and exists the entire program runs. This is\
    \ similar to a Java/C# static variable. The following shows how the loop above\
    \ would look if a global variable was used. Note that in this case, the variable\
    \ must be reset each time the function is entered, as the previous value from\
    \ the loop is still stored in the variable.\n\n```\nlet count = 0;\nfunction func()\
    \ {\n  count = 0;\n  for (count = 0; count < 10; count++) {\n    Do something\n\
    \  }\n}\n```\n\nThe take away from this section is scoping controls how a variable\
    \ is accessible and the time variable definition is maintained. Block variables\
    \ and function variables are only visible in the block/function they are declared\
    \ in. Block variables only exist so long as the program is executing in the they\
