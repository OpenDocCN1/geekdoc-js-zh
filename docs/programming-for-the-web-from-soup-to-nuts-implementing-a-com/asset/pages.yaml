    the function, just for this type of situation where inner functions can exist
    (lambda values) after the function has executed. This is a JavaScript closure.
    Closure is not hard because it is a difficult concept, instead it is hard because
    programmers generally have not seen it before, and it is often explained in terms
    of its impacts, and they are different from Procedural and class-based OOP languages.


    The concept of a closure is simple, but the implications are huge, and the concepts
    are not easily understood in terms of class-based OOP or procedural languages.³38.
    The need to make function variables outside the function execution is the reason
