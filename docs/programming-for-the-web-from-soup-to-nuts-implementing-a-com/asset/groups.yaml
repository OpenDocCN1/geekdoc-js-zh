    \ directly access the title property without using the setTitle and getTitle methods.\n\
    \nThe following object model adds encapsulation using function variables and closures.\
    \ It is included to show how closures could be used in JavaScript, but is not\
    \ a standard object model, and should not be used for production programs.\n\n\
    # Chapter 5. 7 A JavaScript object model that includes encapsulation and data\
    \ hiding\n\nThe problem with the object model in the previous section is that\
    \ the constructed object was returned to the main program where all of its properties\
    \ were visible. This is why the principal of encapsulation is broken. The easiest\
    \ way to prevent the leaking of the object is to make the object defined not by\
    \ this, but by a function variable. Variables are only scoped as visible in the\
    \ function itself, and in effect makes the object itself private.\n\nTo implement\
    \ this new object, the strategy from the last section needs to be tweaked a little.\
    \ First, the Constructor Function will not construct this object, but will create\
    \ a function local variable and construct the object inside of this local variable.\
    \ Now that the object is a local variable that cannot be accessed outside of the\
    \ Constructor Function (which is the outer function), inner functions need to\
    \ be defined that can access the properties of the object.\n\nNote that the object\
    \ will still want to use prototype functions so that only one instance of the\
    \ function needs to be defined, but these prototype functions must be moved so\
    \ they are inner"
