    \ CSS 定义对应，将在 CSS 章节中详细介绍。\n\n此外请注意，处理 `onClick` 事件的 jQuery 函数名称是 `click` 函数，设置事件变量已更改为函数调用。重命名事件并将事件更改为函数调用是\
