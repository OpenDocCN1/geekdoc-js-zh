    \    - 2.2. 复选框（checkbox）\n    - 2.3. 单选按钮组（radio button group）\n\n此处将展示该表单，并打印其每一个元素。在随后的章节中，随着开发，将完整显示文档的整个头部部分。要查看每个选项如何工作，请从子章节中获取\
    \ `<head>` 并将其插入此程序中。最终结果将是一个处理表单数据并将其打印到控制台的 JavaScript 程序。\n\n```html\n<html\n\
    <head>\n  <title>Map Example Input Screen</title>\n  <script>\n    // New code\
