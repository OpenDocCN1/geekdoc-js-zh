    \ `myLoad()`），则该函数会被执行。从语法的角度来看，这可能是导致大多数初学者练习 JavaScript 的问题。\n\n此示例展示了 JavaScript\
    \ 的一个重要特性。JavaScript 中的函数被视为一等对象，可以像任何其他数据类型一样使用。可以被作数据使用的函数被称为 Lambda 函数（Lambda\
    \ functions）。Lambda 函数是函数式编程范式的基础，这种范式与过程化编程或面向对象编程完全不同。即使在像 Java 这样包含 Lambda\
    \ 函数的语言中，实际上也是为其他语言提供语法糖，而像 Java 这样的语言并没有为函数式编程提供真正的基础。\n\n注意，由于函数可以是数据，那么 `onload()`\
    \ 函数在程序中可能会被使用，除了响应 `onload` 事件之外。没有必要用函数名来污染 JavaScript 命名空间，并且该函数是匿名定义的。这是使用任何匿名\
    \ Lambda 函数定义事件回调的标准方式。\n\n```html\n<html\n<head>\n<title>Using onload event </title>\n\
    <script>\nwindow.onload = function() {\n  document.getElementById(\"Button\").onclick\
