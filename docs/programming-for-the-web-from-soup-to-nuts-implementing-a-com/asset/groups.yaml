    \ exist on how to use them in web pages. Readers interested in more functionality\
    \ of the tags can easily learn them up the WWW.\n"
  mdcn: "\n\n某些标签，例如换行标签 `<br>` 或图像标签 `<image>`，是空的，从某种意义上说它们运行命令而不对文本应用属性。在 `<br>`\
    \ 标签的情况下，其含义仅仅是跳过一行，因此它不会影响任何文本或其他元素。它可以被写为 `<br/>`。然而，HTML 为这类标签提供了一种快捷方式。标签可以在打开它的角括号之间关闭。`<br>`\
    \ 标签可以写成 `<br/>`。\n\n因为 br 标签在 HTML 中除了标记文本外，还可以用于很多事情。例如，可以使用标签告诉 HTML 处理器包含一张图片。如果图片与网页位于同一目录，可以通过在页面的\
    \ HTML 中添加以下标签将图片包含在页面：\n\n```\n<image src=\"dog.jpg\" />\n```\n\n程序 1 = 图像标签\n\
    \n这行代码将文件 `dog.jpg` 中的图片引入网页中。该标签是图像标签，但图像需要一个属性来指示图片的位置。对于图像标签，用于查找图片的属性是 `src`\
    \ 标签。\n\n属性是实现标签所需行为的详细数据。所有标签都可以具有某些属性，我们将在稍后详细介绍这些属性。\n\n## 第 2.2 章 标准 HTML\
    \ 标签\n\n有 4 个 HTML 标签被认为是所有网页的标准。这些是 `<html>`、`<head>`、`<title>` 和 `<body>`。严格的\
    \ HTML5 网页要求包含这 4 个标签，任何 IDE 在你开始创建一个 HTML 页面时都会自动为你页面插入这 4 个标签。由于每个网页都建议使用这 4\
    \ 个标签，我个人保留了一个模板（如下所示），当我开始编写所有网页时都会复制它。\n\n```html\n<html>\n  <head>\n    <title>请将此处更改为页面的标题</title>\n\
    \  </head>\n  <body>\n    </</body>\n</html>\n```\n\n程序 2 – HTML 模板\n\n此模板代码可以表示为从上到下的树形结构，如下所示。在这些树中，标签被用于包含\
    \ 2 个元素：head 和 body。同样，head 部分包含 title，正如我们所看到的，head 和 body 部分将包含许多其他 HTML 元素。因此，我们将这\
    \ 3 个标签称为“容器标签”。title 只包含一个文本块，因此是一个块级标签。\n\n# 网页编程\n\n![](img/ce60a0a8b4160fc893a11ed149173e93_24_0.png)\n\
    \n这4 个标签（html, head, title 和 body）的特殊之处在于它们定义了 HTML 文档的结构，被称为“文档结构标签”。将在下一节中更详细地介绍。但在之前，关于关于构建\
    \ HTML 文件有几点需要说明。\n\n在程序 2 的文件中，请注意每个容器标签（html, head 和 body）都进行了缩进，以显示文档的层级结构，即图\
    \ 2.1 所示的树。这并不是 HTML 处理器的要求，因为处理器只是在查看指令字符串并忽略任何程序格式。然而，缩进让网页的开发者和维护者更容易理解程序中正在发生什么。\n\
    \n我总是建议编写 HTML 代码的第二点是，在输入所有容器标签的开头时结束它们。当输入 `<head>` 时，立即输入 `</head>`。这是许多 IDE\
    \ 的自动行为。在打开容器标签时输入闭合标签的原因是为容器内扩展的想法和概念强制边界。这对于许多初学者来说没有意义，他们似乎将想法视为无结构的信息，从文档顶部开始一直流到结束。初学者的想法（在我看来）往往是思绪的杂烩。他们没有看出来创建边界或结构来表达想法的意义。这在所有学术领域都是如此，包括那些不可读的论文和文档。这就是为什么缩进和容器边界对于确保以结构化的方式呈现想法是如此重要。以及这也是为什么一门教授这些知识的计算机科学基础课程对任何专业的学生都可能非常重要。\n\
    \n但由于这种结构化想法的概念对学生来说如此是一个谜团，我提供了一个在输入开启标签时输入闭合标签的实际理由。如果不立即输入闭合标签，它可能会被完全忘记并导致其他问题。尽管对学生来说，最好的理由是这样就不会在考试中漏掉它们。\n\
    \n> 我坚持绝不帮助代码格式糟糕的学生提供帮助，因为尝试理解它是令人沮丧的，而且简直是对我感官的辱。学生必须正确格式化它，我会帮助他们编写程序。这项政策最有用的结果是，大多数情况下它给学生留下一句注释：“没事，我解决了”。糟糕的格式很少代表对特定内容边界的困惑，而修复格式就能消除这种困惑。\n\
    \n## 第 2.3 章 文档结构标签与简单的网页\n\nHTML 文档分为两个主要部分：*head*（头部）和 *body*（身体）。这种划分的原因是 head\
    \ 用于包含元数据，而 body 用于包含要显示的信息。为了理解这一点，理解“元数据”术语的含义至关重要。根据字典，meta 的意思是：“添加到有意识引用的事物上的前缀”。因此，形而上学是关于物理学的物理学，元分析是对元的研究等。\n\
    \n元数据就是顾其实名，即关于网页上数据的数据。它定义了页面如何解释这些数据。例如，在网页中使用的函数定义在 head 中。如何处理和解释 CSS 标签也定义在\
    \ head 中。用于定义行为的任何内容都在文档的 head 中。\n\n正如 head 中的内容很重要，head 之外的内容同样重要。head 不应该输出任何放置在网页上的信息（或数据）。在\
    \ head 中定义的函数和其他结构向 body 返回字符串。这正确地意味着 HTML 文档的 body 应该包含任何渲染并放置在网页上的内容。任何要显示的文本、要渲染的图像或要处理的表单都属于文档的\
    \ body。再次，body 不应该包含任何元数据，如函数、CSS 或处理事件的代码。\n\nHTML 中没有任何强制这一策略的规定，但违反它的理由很少。而且当\
    \ head 和 body 中的数据混合时，通常表明程序员对页面是什么没有清晰的概念。在文档结构中，`<title>` 标签被显示为元数据。这是因为标题出现在浏览器的标签页上，而不是页面上。\n\
    \n程序 3 是一个简单的 HTML 页面，用于说明目前为止的概念。注意，该程序使用了大型 `<h1>` 和段落 `<p>` 块级标签，以及 `<img>`\
    \ 标签，这些尚未被涵盖。正如之前所，这并不是一本关于学习 HTML、CSS、JavaScript 或任何其他语言或程序的书籍。它为有积极性的中级编程人员（特别是和我一起学习的学生）提供了足够的背景知识。完整的\
    \ HTML 标签列表可以在此处找到：https://www.w3schools.com/tags/，并且有很多关于如何在网页中使用它们的教程。对标签更多功能感兴趣的读者可以轻松地在网络上学习它们。\n\
    \n"
