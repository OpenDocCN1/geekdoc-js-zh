    # PROGRAMMING FOR THE WEB


    often use to interact with and gather information from users. Form elements are
    a major method of creating user interaction with a web page.


    All form elements contain a name or id which can be accessed by JavaScript. All
    form elements have a set of attributes (or properties) that can later be used
    in JavaScript and CSS to manipulate them.


    This section will only implement the form elements. To implement interactivity
    in a form normally requires JavaScript and will be covered in a subsequent chapter.


    # Chapter 2.4.1 The <label> tag


    The <label> is used to put a label on the page and associate it with another HTML
    element. Since the <label> tag puts text on the screen, why use a label rather
    than putting the text into the HTML? For example, the following two HTML examples
    appear the same to the user:^9


    ```

    <label id="label1" for="title">Title: </label>

    <input type="text" id="title" size="20" />

    ```


    | Program 4 - Using a label tag |

    | Title:

    |<input type="text" id="title" size="20" /> |

    | Program 5 - Using no label tag |


    These examples will appear the same on the page, with the string "Title" followed
    by a textbox. There are two advantages to using the label tag. The first is when
    using a <label> tag, the label itself can be given an id, and that id can be used
    later in JavaScript to manipulate and modify the label.


    The second advantage of a <label> tag is it can be used to reference an <input>
    value by setting the for attribute to the id of the field it corresponds to. When
    the for attribute is set in a label, clicking on the label places the cursor in
    the corresponding field.


    Complete documentation for the <label> tag can be found at:

    https://www.w3schools.com/tags/tag_label.asp.


