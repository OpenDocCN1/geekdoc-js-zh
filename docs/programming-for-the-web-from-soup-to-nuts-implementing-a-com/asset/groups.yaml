- md: "\nSome tags, such as a break tag <br> or image tag <image>, are empty, in the\
    \ sense that they run a command, and do not apply an attribute to the text. In\
    \ the case of the <br> tag, the meaning is simply to skip a line, so it does not\
    \ affect any text or other element. It can be written as <br/>. However, HTML\
    \ provides a shortcut for this type of tag. The tag can be closed between the\
    \ angle brackets that opened it. The <br> tag can be written as <br/>.\n\nAs br\
    \ tags can be used to do many things in HTML other than just markup text. For\
    \ example, tags can be used to tell the HTML processor to include a picture. If\
    \ a picture exists in the same directory as the web page, the image can be included\
    \ on the page by adding the following tag to the HTML for the page:\n\n```\n<image\
    \ src=\"dog.jpg\" />\n```\n\nProgram 1 = Image Tag\n\nThis line of code includes\
    \ the picture from file dog.jpg in the web page. The tag is the image tag, but\
    \ the image needs an attribute to indicate where to find the picture. For the\
    \ image tag the attribute used to find the picture is the src tag.\n\nAttributes\
    \ are data that detail needed to implement the desired behavior for the tag. All\
    \ tags can have some attributes, and these will be looked at in more detail later.\n\
    \n## Chapter 2.2 Standard HTML Tags\n\nThere are 4 HTML tags that are considered\
    \ standard for all web pages. These are the <html>, <head>, <title>, and <body>.\
    \ A strict HTML5 web page is required to have these 4 tags, and any IDEs will\
    \ automatically insert these 4 tags in a page for you when you start an HTML page.\
    \ Since these 4 tags are always recommended for every web page, I personally keep\
    \ a template, shown below, that I copy when I begin all web pages.\n\n```html\n\
    <html>\n  <head>\n    <title>Please change this to the title of your page</title>\n\
    \  </head>\n  <body>\n    </body>\n</html>\n```\n\nProgram 2 – HTML template\n\
    \nThis template code can be represented as a top-down tree, as shown below. In\
    \ this tree the tag is used to contain 2 elements, the head and the body. Likewise,\
    \ the head section contains the title, and as we will see, the head and the body\
    \ sections will contain many other HTML elements. Thus, we will call these 3 container\
    \ tags. The title only contains a block of text, so it is a block tag.\n\n# PROGRAMMING\
    \ FOR THE WEB\n\n![](img/ce60a0a8b4160fc893a11ed149173e93_24_0.png)\n\nThese four\
    \ tags (html, head, title, and body) are special in that they define the structure\
    \ of an HTML document and are called Document Structure tags. This will be covered\
    \ more fully in the next section. But first there are some points to be made about\
    \ how to structure HTML files.\n\nIn the file in Program 2, note that each container\
    \ tag (html, head, and body) is indented to show the hierarchical structure of\
    \ the document representing the tree in Figure 2.1. This is not required by the\
    \ HTML processor, as the processor is just looking at strings of instructions\
    \ and ignoring any program format. However, indenting makes it easier for the\
    \ developer and maintainer of web pages to understand what is going on in the\
    \ program.\n\nThe second thing I always recommend writing HTML code is to end\
    \ all container tags when the beginning is entered. When <head> is entered, the\
    \ </head> is immediately entered. This is the automatic behavior of many IDEs.\
    \ The reason to enter a close tag when opening a container tag is to enforce boundaries\
    \ on the ideas and concepts that are expanded in the container. This does not\
    \ make sense to many novices, who seem to see ideas as unstructured information\
    \ that starts at the top of the document and just streams to the end. Novice ideas\
    \ often appear (to me) to be a jumble of thoughts. They do not see a purpose in\
    \ creating boundaries or structure to express the ideas. This is true in all of\
    \ academia, including unreadable papers and documentation. This is why indent,\
    \ and container boundaries are so important to ensure a structured way of presenting\
    \ the ideas. And why a basic course in CS, which teaches this, can be important\
    \ for students of any major.\n\nBut since this concept of structuring ideas is\
    \ such an enigma to students, I give a practical reason for entering the closing\
    \ tag when the opening tag is entered. If the closing tag is not immediately entered,\
    \ it is likely to be completely forgotten and lead to other problems. Though the\
    \ best reason for students to be so they don't lose them on a test.\n\n> I make\
    \ a point to never help a student with poorly formatted code, as it is frustrating\
    \ to try and understand, and simply insults my sensibilities. The student must\
    \ format it correctly, I will help them work on their programs. The most useful\
    \ outcome of this policy is the vast majority of time it results in a comment\
    \ for the student, \"never mind, I figured it out\". Poor formatting rarely represents\
    \ confusion about the bounds of specific content and fixing the fixes the confusion.\n\
    \n## Chapter 2.3 Document Structure Tags and a Simple Web Page\n\nAn HTML document\
    \ is divided into two main sections, the *head* and the *body*. The reason for\
    \ this division is that the head is to contain metadata, and the body is to contain\
    \ the information to be displayed. To understand this, it is important to understand\
    \ the meaning of the term metadata. According to Dictionary, meta means: \"a prefix\
    \ added to something that consciously references\". Hence metaphysics is a physics\
    \ about physics, meta-analysis is a study of metas, etc.\n\nMetadata is what it\
    \ names, data about the data on a web page. It defines how the page is to interpret\
    \ the data. For example, functions are used in a web page are defined in the head.\
    \ How to handle and interpret the CSS tags are also defined in the head. Anything\
    \ that is used to define the behavior of the page is in the head of the document.\n\
    \nAs important as what is in the head is what is not in the head. The head should\
    \ not output any information (or data) to be placed on the web page. Functions\
    \ and other structures defined in the head return strings to the body. This implies\
    \ (correctly) that the body of an HTML document should contain anything that is\
    \ rendered and placed on the web page. Any text to be displayed, images to be\
    \ rendered, or forms to be processed belong in the body of the document. And again,\
    \ the body should not contain any metadata such as functions, CSS, or code to\
    \ handle events.\n\nNothing in HTML enforces this policy, but there are few good\
    \ reasons to violate it. And when the data in the head and body are mixed, it\
    \ generally shows that the programmer did not have a clear concept of what the\
    \ page is. In the Document Structure, the <title> tag is shown as metadata. This\
    \ is because the title is what appears on the tab in the browser, and not on the\
    \ page.\n\nProgram 3 is a simple HTML page to illustrate the concepts so far.\
    \ Note that the program uses large <h1>, and paragraph <p> block tags, and the\
