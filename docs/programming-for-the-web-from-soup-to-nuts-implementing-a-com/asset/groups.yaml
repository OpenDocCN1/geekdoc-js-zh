- md: "\n## PROGRAMMING FOR THE WEB: 48\n\n### Chapter 3.2.10 Quick Check\n\n- 1.\
    \ What is the purpose of the let keyword in JavaScript?\n- 2. How is the type\
    \ of a variable determined?\n- 3. What datatypes exist in JavaScript? How does\
    \ it differ from a null variable?\n- 4. What is an undefined variable?\n- 5. What\
    \ types of scoping are allowed in JavaScript? What is the default scope of a variable?\n\
    - 6. What 3 types of control structures are used to create programs? Give an example\
