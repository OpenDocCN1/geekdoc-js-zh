    \ the following code: specifically, it does, and if it does, what is the length\
    \ of the array? What is the value of people [0]? What is the value of people [5]?\n\
    \n```javascript\nlet people = Array(2);\npeople[1] = \"Nick\";\npeople[2] = \"\
    Ann\";\npeople[7] = \"Carol\";\n```\n\n## Chapter 3.3 Events, Onload Event and\
    \ JQuery\n\nOne paradigm that is implemented in JavaScript is Event Based Programming\
    \ (EBP). Events are asynchronous actions that occur (or are raised) while the\
    \ program is running. These actions (or events) are often generated by the user,\
    \ such as clicking a button or changing a value in a text field. But events can\
    \ also occur from asynchronous action of the program, such as loading the web\
    \ page or completion of reading of file. The events which are raised associated\
    \ with a callback function that handles the event.\n\n### Chapter 3.3.1 Associating\
    \ a call back with an event\n\nAssociating a call back with an event is illustrated\
    \ in the following program.\n\n```html\n<html>\n<head>\n  <title>Error using event\
    \ </title>\n  <script>\n    function myFunction() {\n      alert(\"You pressed\
    \ me\");\n      //document.write(\"You pressed me\");\n    }\n  </script>\n</head>\n\
    <body>\n  <input type=\"button\" id=\"myButton\" value=\"Press me\" onclick=\"\
    myFunction();\"/>\n</body>\n</html>\n```\n\nIn this example, the event (called\
    \ on onClick) is associated with the pressFunction, which is metadata and defined\
    \ in the head of the html page. When a user clicks on the button that says, \"\
    Press me\", it calls the function with the click event, the pressFunction, and\
    \ an alert box is showing \"You pressed me\".\n\nThis is the complete life cycle\
    \ of events and calls back. An event (click) is mapped to a callback function\
    \ (pressFunction). When the event is raised (the user clicks the button), the\
    \ event back function is called.\n\nThe rest of this section will explain how\
    \ you should implement it in JavaScript.\n\n### Chapter 3.3.2 Handling an Event\
    \ – Unobtrusive JavaScript\n\nBecause event (or callback) functions run in response\
    \ to events from the program, they are metadata. When writing HTML page, it is\
    \ normal for a programmer to define functions to handle events coming from form\
    \ elements in the html document. A standard known as Unobtrusive JavaScript says\
    \ that all JavaScript should be maintained in the head of the document, so setting\
    \ the onClick as part of the button definition is considered bad practice.\n\n\
    The correct way to assign a callback function is as follows. First it is important\
    \ to know that all components on a web page are contained in a Document Object\
    \ Model, or DOM. The DOM is very important when writing JavaScript for a browser,\
    \ as nearly everything is in the DOM. However, for now you should know that buttons,\
    \ text fields, checkboxes, etcetera, are all stored as objects in the DOM.\n\n\
    Unobtrusive JavaScript says that the call back should be assigned by retrieving\
    \ the button, in this case the button named \"myButton\" from the DOM using the\
    \ getElementById method. The click event for this button is then assigned to an\
    \ anonymous function which is then called when the button is pressed. This is\
    \ shown in Program 53 below.\n\n```html\n<html>\n<head>\n  <title>Error using\
    \ event </title>\n  <script>\n    document.getElementById(\"myButton\").onclick\
    \ = function() {\n      alert(\"You pressed me\");\n    };\n  </script>\n</head>\n\
    <body>\n  <input type=\"button\" id=\"myButton\" value=\"Press me\" />\n</body>\n\
    </html>\n```\n\nProgram 53 - Using a form element in the head before it is defined.\n\
    \nHowever, there is a problem with this program. The form elements, such as a\
    \ button, are defined in the body of the page, and that is after the attempt to\
    \ use it to set its callback occurs in the head. As the following JavaScript shows,\
    \ this results in an error when trying to reference the button before it is defined.\
    \ Note this error occurs in the browser console, which is not directly viewable\
    \ to the user. If you do not know how to use the browser console, you should Google\
    \ how to access it for the browser that you are using (accessing the console is\
    \ different for every browser, but is available in every browser).\n\n51 PROGRAMMING\
    \ FOR THE WEB:\n\nFigure 4 - Error message processing a form element before it\
    \ is defined\n\nHow to handle this problem will be the subject of the next section.\n\
    \n### Chapter 3.3.3 Handling an Event – onload event\n\nTo handle the problem\
    \ of needing to access the button in the head, an event is defined that raised\
    \ after the form is loaded, and all elements are defined. This event is called\
    \ onload event. The onload event occurs after the form is loaded, and all elements\
    \ are processed. This is shown in the following\n\n```html\n<html>\n<head>\n \
    \ <title>Using event</title>\n  <script>\n  function myOnload() {\n    document.getElementById(\"\
    myButton\").onclick = function () {\n      alert(\"You pressed me\");\n    }\n\
    \  }\n  window.onload = myOnload;\n  </script>\n</head>\n<body>\n  <input type=\"\
    button\" id=\"myButton\" value=\"Press me\" />\n</body>\n</html>\n```\n\nProgram\
    \ 54 - Setting a callback function in onload event\n\nThis small piece of code\
    \ is complex, so it will be covered in detail. First a function, onLoad is defined,\
    \ and it is in this function that the Button's click event is associated with\
    \ the function to alert the user. The function onLoad is not called, so it is\
    \ defined but not executed.\n\nThe next line, window.onload = onLoad, associates\
    \ the onload method with the onload event. This tells the HTML DOM to run the\
    \ onload function when the onload event is raised, after the page is loaded. This\
    \ means that the button has been defined and can be associated with the listener\
    \ to alert a message when the button is pressed. This part is partly simple, at\
    \ least in a big picture to understand.\n\nWhat is much more complex is the function\
    \ not called in the statement window.onload = onLoad, but the function is assigned\
    \ to the variable window.onload and later when the onload event is raised. To\
    \ see this, compare the previous program with the next program, which includes\
    \ the parenthesis in the assignment of the window.onload variable. This is a common\
    \ mistake by novice programmers, as novices have been taught that functions are\
    \ executed statements that are not, and data that cannot be passed around using\
    \ variables.\n\n```html\n<html>\n<head>\n  <title>Window onload event</title>\n\
    \  <script>\n    function myFunction() {\n      /* This code causes the JavaScript\
    \ to fail if\n      uncommented. It would not work anyway as the\n      button\
    \ code has not been loaded.\n      document.getElementById(\"myButton\").onclick\
    \ = function() {\n        alert(\"You pressed me\");\n      }\n      */\n    \
    \  alert(\"window is not loaded\");\n      return \"you dummy\";\n    }\n    alert(window.onload\
    \ = myFunction());\n  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\nProgram\
    \ 55 - Program showing function being rather than being set to a variable.\n"
  mdcn: "\n\n## 网页编程：48\n\n### 第 3.2.10 节检\n\n- 1. JavaScript 中 `let` 关键字的目的是什么？\n\
    - 2. 变量的类型是如何确定的？\n- 3. JavaScript 中存在哪些数据类型？它与 `null` 变量有什么区别？\n- 4. 什么是 `undefined`\
