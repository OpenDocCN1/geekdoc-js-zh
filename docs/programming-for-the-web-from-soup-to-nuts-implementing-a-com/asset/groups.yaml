  - "[PAGE 55]\n\n# PROGRAMMING FOR THE WEB:\n\nThe result of this second program\
    \ is that the alert is run once when the head of the HTML file is processed, and\
    \ the window.onload variable is set to the string \"dummy\", which is what is\
    \ returned from the myLoad function. Once again, you cannot associate the button\
    \ with a function as the event would not exist. The code to associate a function\
    \ with an event must be run in the onload event, not when the head of the HTML\
    \ file is processed.\n\nBefore continuing, the reader should note that if a function\
    \ is referenced without parenthesis (e.g. myLoad) the function is treated as data.\
    \ If a function is referenced with parenthesis (e.g. myLoad()), the function is\
    \ executed. From a syntactic point of view, this is possibly the issue that causes\
    \ most novices to practise JavaScript.\n\nThis example shows an important feature\
    \ of JavaScript. Functions in JavaScript are treated as first class object and\
    \ can be used as any other data type. Functions that can be used as data are called\
    \ Lambda functions. Lambda functions are the bases for the programming paradigm\
    \ called Functional Programming, which is a very different paradigm from Procedural\
    \ or Object-Oriented Programming. Even in languages that include lambda functions,\
    \ like Java, are actually providing syntactic sugar for other languages, and languages\
    \ like Java do not provide a real basis for Functional Programming.\n\nNote that\
    \ since functions can be data, then the onload() function is likely used in the\
    \ program except in response to an onload event. There is really no to clutter\
    \ the JavaScript namespace with the name of the function, and the function is\
    \ defined anonymously. This is the normal way the event callback is defined using\
    \ any anonymous lambda function.\n\n```\n<html>\n<head>\n<title>Using onload event\
    \ </title>\n<script>\nwindow.onload = function() {\n  document.getElementById(\"\
    Button\").onclick = function() {\n  alert(\"You pressed me\");\n }\n}\n</script>\n\
    </head>\n<body>\n<input type=\"button\" id=\"Button\" value=\"Press me\" />\n\
    </body>\n</html>\n```\n\nProgram 56 - Setting an event callback function using\
    \ an anonymous function.\n\nThe variable is here in the same statement as the\
    \ function defined.\n\nNote that the parentheses here do not mean the function\
    \ is being executed but are part of the function definition. Once again this is\
    \ confusing to novices learning JavaScript. To execute this function, the statement\
    \ windows.onload=function(){} would have to be used. This will form the basis\
    \ for another JavaScript paradigm to be introduced later, the Immediate-Invoked-Function-Expression\
    \ (IIFE)."
  - "[PAGE 56]\n\n# Chapter 3.3.4 jQuery ready function\n\njQuery is a library that\
