    \ can be used to break up a web page into divisions, and to assign different styling\
    \ or information types to those areas. For now, it will be used to break the header\
    \ into 3 pieces.\n\nTo break the header up into 3 pieces, 3 divisions are created.\
    \ These are all placed inside the header section and can be thought of as *parts*\
