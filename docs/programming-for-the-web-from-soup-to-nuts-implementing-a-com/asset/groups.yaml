    \n图 10 - 完成的网页头部\n\n## 第 4.1.7 节 管理 CSS\n\n为了使项目管理和阅读源码变得更容易，网页的 CSS 源代码通常是分开的。这种分离的好处是：1)\
    \ 当为了样式目的划分页面时，HTML 文档应该被划分为划分（使用 `<div>` 标签）；当被划分为等同于大纲中区域的部分时，使用语义化的 `<section>`\
    \ 标签划分为部分。除了 section 作为较大文档结构的一部分的语义含义外，其他者没有区别。由于本文涉及的是程序化网页的格式化，它将只使用划分以将混淆降到最低。\n\
    \n对于上述页头部，CSS 保存在 WebExample.css 文件中，而 HTML 保存在 MapExample.html 中。通过 `<link>`\
    \ 引入。如下：\n\n```css\nheader {\n  margin: 50px;\n  border: 2px solid blue;\n  background-color\
    \ : slategray;\n  color : white;\n}\n\nheader p {\n  font-size: 150%;\n}\n\n#header-icon\
    \ {\n  display: inline-block;\n  margin: 50px 10px 50px;\n}\n\n#header-desc {\n\
    \  display: inline-block;\n  margin: 25px;\n}\n\n#header-menu {\n  display: inline-block;\n\
    \  float: right;\n  margin: 75px 50px 50px;\n}\n```\n\n程序 79 - WebExample.css\n\
    \nMapExample.html 现在变得更加简单、易于理解。\n\n```html\n<html>\n<head>\n  <title>Map Example\
    \ Input Screen</title>\n  <link rel=\"stylesheet\" type=\"text/css\" href=\"WebExample.css\"\
    >\n</head>\n<body>\n  <header>\n    <div id=\"header-icon\">\n      <img src=\"\
    GRI_logo.png\" />\n    </div>\n    <div id=\"header-desc\">\n      <h1>Map Example</h1>\n\
    \      <p>\n        Example map input screen <br>\n        &copy; Gettysburg Research\
    \ Institute\n      </p>\n    </div>\n    <div id=\"header-menu\">\n      <p>\n\
    \        Home File About\n      </p>\n    </div>\n  </header>\n</body>\n</html>\n\
    ```\n\n程序 80 - MapExample.html\n\n在现实世界中，大多数程序员处理 HTML 和 JavaScript，而 UI/UX 设计师将处理网页的\
    \ CSS。然而，双方（程序员和 UI/UX 设计师）都应该了解其他技术的知识，以便有效协作。\n\n## 第 4.1.8 节 快速复习\n\n1. CSS\
    \ 有四种类型的标签？每种给出一个示例并描述你可能会如何使用它们。\n2. 用自己的话描述*语义*？什么是 HTML 语义标签？它与格式化标签有何不同？\n\
