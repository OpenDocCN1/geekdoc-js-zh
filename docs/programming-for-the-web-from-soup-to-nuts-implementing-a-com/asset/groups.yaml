    # 7.2.5 Summary of CRUD REST server transactions


    The REST transactions for a CRUD interface are summarized in the following table.


    | Method | URL | Meaning |

    | --- | --- | --- |

    | GET | ::/model | Return an array of JSON objects that are stored for this model
    |

    | GET | ::/id | Return an JSON object for this model with this ID |

    | PUT | ::/model | Create a record for this model in the server |

    | POST or PATCH | ::/id | Update the record for this model with this ID |

    | DELETE | ::/id | Delete the record for this model with this ID |

    | Figure 30 – REST transaction summary |'
- md: "\n## Chapter 7.3 Communicating with the server using JavaScript\n\nThis section\
    \ will describe how to send a transaction using JavaScript from a web browser\
    \ to the server.\n\n### Chapter 7.3.1 Sending a transaction to the server\n\n\
    There are 4 steps involved in writing a program to send a transaction to the server\
    \ from JavaScript:\n\n- 1. An HTTP object is created, and the proper values set\
    \ in that object.\n- 2. A callback function (or listener) is set to receive the\
    \ data back from the server.\n- 3. The request is sent asynchronously to the server.\n\
    - 4. The server will process the request, sending back (multiple) responses as\
    \ it proceeds. Once the request has completed, the server will send back a ready\
    \ state of 4 and a status code categorizing the result of the transaction.\n\n\
    These 4 steps are shown in the JavaScript program that sends a request for an\
    \ array of JSON map objects. This code should be placed in a file named \"ReadMaps.html\"\
    \ in the assets directory of your Sails application, and can be accessed using\
    \ the URL http://localhost:1337/ReadMaps.html.\n\n```javascript\n<script>\nlet\
    \ xmlhttp = new XMLHttpRequest();\nxmlhttp.open(\"GET\",\"mapdata\",true);\nxmlhttp.setRequestHeader(\"\
    Content-Type\", \"application/json\");\nxmlhttp.onreadystatechange = function\
    \ () {\n  console.log(\"State = \" + xmlhttp.readyState + \" and status = \" +\
    \ xmlhttp.status);\n  if (xmlhttp.readyState === 4) {\n    console.log(\"State\
    \ = \" + xmlhttp.readyState + \" and status = \" + xmlhttp.status);\n  }\n}\n\n\
    xmlhttp.send();\n</script>\n```\n\nProgram 114 – XMLHttpRequest example\n\nThe\
    \ following will explain each part of the transaction.\n\n- 1. An object variable,\
    \ in this case named xmlhttp, is created by the constructor function XMLHttpRequest.\
    \ This object will be used to build the request to be sent to the server.\n\n\
    > There is a synchronous version that can be used to send the transactions to\
    \ the server and the synchronous version does not require the callbacks and raises\
    \ the issues involved in processing the asynchronous version. However, using the\
    \ asynchronous version will tie up the browser so that the user cannot interact\
    \ with the browser until the request has finished. It is highly recommended that\
    \ the synchronous version never be used, and it has been deprecated in most of\
    \ the major libraries.\n\nPROGRAMMING FOR THE WEB:\n\n- 2. The xmlhttp is opened\
    \ (or initialized) to represent a GET request on the server, using /mapData as\
    \ the URL. This is the same request made in Postman to retrieve all of the records\
    \ in the server. The third parameter is whether this request is asynchronous.\
    \ This parameter should always be true. Note that the request has only been built,\
    \ it has not yet sent to the server.\n\n- 3. A method is defined and attached\
    \ to the onreadystatechange event to respond to the server after the request is\
    \ sent. Note that the request is to be sent asynchronously, which means that the\
    \ request will be running concurrently to the rest of the program. There will\
    \ be a larger discussion of the implications of this shortly, but for now know\
    \ that the program will send the request and continue running. The program will\
    \ not wait for a response from the server. The purpose of this method is to respond\
    \ to messages coming back from the server.\n\n#### 3.1. The server will send back\
    \ a number of messages to report the state of the transaction. Generally, there\
    \ will be at least 3 responses to any request, a state of 2 saying the request\
    \ was accepted, a state of 3 saying the request is being processed, and a state\
    \ of 4 saying the request is complete, though you can receive other state information.\
    \ Your program should always wait until a state 4 is received, meaning the transaction\
    \ is complete, before continuing⁴⁵.\n\n#### 3.2. A status will be returned along\
    \ with the state. A request that completes normally will have a state of 4 and\
    \ a status of 200. However, the status can be different depending on the server,\
    \ and it is a good idea to check these values.\n\n- 4 Once the transaction has\
    \ been initialized and the callback set, the transaction can be sent to the server\
    \ using the send method. In this example, the program completes, but the callback\
    \ function will linger until the request is complete and the xmlhttp object is\
    \ freed.\n\nThe results from running this command are shown in the following figure.\n\
    \n> ⁴⁵ For more information about request state and status, https://www.w3schools.com/xml/ajax_xmlhttprequest_response.asp\n\
    \nPROGRAMMING FOR THE WEB:\n\nFile Edit View Bookmarks Tools Help\n\n```\n(2 unread)\
    \ - charles_kann@ya Xfinity Connect Inbox localhost:1337/SimpleRequest X\n```\n\
    \n```\nInspector Console Debugger Style Editor Performance Memory Persist Logs\n\
    ```\n\n```\nState = 2, and status = 200 SimpleRequest.html:14:7\nState = 3, and\
    \ status = 200 SimpleRequest.html:14:7\nState = 4, and status = 200 SimpleRequest.html:14:7\n\
    State = 4, and status = 200 SimpleRequest.html:17:5\n```\n\nFigure 31 – JavaScript\
    \ output illustrating asynchronous request and responses\n\n### 7.3.2 What it\
    \ means to be asynchronous\n\nEarly it was said that transaction was asynchronous.\
    \ This has large implications for the program that are not apparent, particularly\
    \ to programmers not familiar with concurrency. The following example will point\
    \ out what is meant by concurrency, and why it is an important concept to understand\
    \ in JavaScript.\n\nThe previous program to send a transaction to the server returned\
    \ the records in the server, however there is no place in the program to display\
    \ them. This problem is now rectified. The most obvious way to do this would be\
    \ to use the following code to print out the data from the server after the request\
    \ has completed. This change is represented in the following:\n\n```javascript\n\
    <script>\nvar xmlhttp = new XMLHttpRequest();\nxmlhttp.open(\"GET\", \"mapdata\"\
    , true);\nxmlhttp.setRequestHeader(\"Content-Type\", \"application/json\");\n\
    xmlhttp.onreadystatechange = function () {\n  if (xmlhttp.readyState == 4) {\n\
    \    console.log(\" text = \" + xmlhttp.responseText);\n  }\n}\nxmlhttp.send();\n\
    </script>\n```\n\nProgram 116 – XMLHttpRequest server request with race condition\
    \ fixed\n\nThis need to put code inside of a callback can result in callback being\
    \ inside of a callback inside a callback. This situation is sometimes called callback\
    \ hell. It is addressed in ECMA6 by the addition of promise and await operations.\
    \ This will be covered in a later section.\n\nThe last change to this program\
    \ is to add a check to see if the request worked correctly. If it did, an expected\
    \ status of 200 will (hopefully) be returned. Otherwise the readyState 4 will\
    \ have a different status code and message.\n\n### Chapter 7.3.3 Create a record\n\
    \nNow create the file CreateMap.html in the assets directory. This file will contain\
    \ the following program.\n\n```javascript\n<script>\nlet xmlhttp = new XMLHttpRequest();\n\
    let url = \"/mapData\"\nxmlhttp.open(\"POST\", url, true);\n```\n"
  mdcn: "\n\n## 第 7.3 节 使用 JavaScript 与服务器通信\n\n本节将描述如何从网页浏览器使用 JavaScript 向服务器发送事务。\n\
    \n### 第 7.3.1 节向服务器发送事务\n\n编写一个从 JavaScript 向服务器发送事务的程序涉及 4 个步骤：\n\n- 1. 创建一个\
    \ HTTP 对象，并在该对象中设置适当的值。\n- 2. 设置一个回调函数（或监听器）来接收从服务器返回的数据。\n- 3. 将请求异步发送到服务器。\n\
    - 4. 服务器将处理请求，并在处理过程中返回（多个）响应。一旦请求完成，服务器将返回状态 4（就绪，ready state）以及一个对事务结果进行分类的状态码。\n\
    \n这 4 个步骤在发送 JSON 映射对象数组请求的 JavaScript 程序中显示。此代码应该放置在 Sails 应用的 assets 目录下名为 \"\
    ReadMaps.html\" 的文件中，并可以使用 URL http://localhost:1337/ReadMaps.html 进行访问。\n\n```javascript\n\
    <script>\nlet xmlhttp = new XMLHttpRequest();\nxmlhttp.open(\"GET\",\"mapdata\"\
    ,true);\nxmlhttp.setRequestHeader(\"Content-Type\", \"application/json\");\nxmlhttp.onreadystatechange\
    \ = function () {\n  console.log(\"State = \" + xmlhttp.readyState + \" and status\
    \ = \" + xmlhttp.status);\n  if (xmlhttp.readyState === 4) {\n    console.log(\"\
    State = \" + xmlhttp.readyState + \" and status = \" + xmlhttp.status);\n  }\n\
    }\n\nxmlhttp.send();\n</script>\n```\n\n程序 114 – XMLHttpRequest 示例\n\n下文将解释事务的每个部分。\n\
    \n- 1. 通过构造函数 `XMLHttpRequest` 创建了一个对象变量，在此例中名为 `xmlhttp`。该对象将用于构建发送到服务器的请求。\n\
    \n> 有一个同步版本可以用于将事务发送到服务器，同步版本不需要回调，并且不会引起处理异步版本时涉及的问题。然而，使用同步版本会阻塞浏览器，导致用户在请求完成之前无法与浏览器进行交互。强烈建议永远使用同步版本，它在大多数主流库中已被废弃。\n\
    \nWeb 编程：\n\n- 2. 打开（或初始化）`xmlhttp` 以表示对服务器上的 GET 请求，使用 `/mapData` 作为 URL。这与在\
    \ Postman 中获取服务器上所有记录的请求相同。第三个参数是该请求是否为异步。此参数应始终为 `true`。注意，请求仅已构建，尚未发送到服务器。\n\
    \n- 3. 定义了一个方法并将其附加到 `onreadystatechange` 事件上，以便在发送请求后响应服务器。注意请求是异步发送的，这意味着请求将与程序的其余部分并发。稍后将对此影响进行更深入的讨论，但目前只需知道程序将发送请求并继续运行。程序不会等待服务器的响应。该方法的目的是响应来自服务器返回的消息。\n\
    \n#### 3.1. 服务器将返回多条消息来报告事务状态。通常情况下，任何请求至少会有 3 个响应：状态 2 表示请求已接受，状态 3 表示请求正在处理中，状态\
    \ 4 表示请求已完成，尽管你也可能接收到其他状态信息。你的程序应该一直等待直到接收到状态 4（这意味着事务完成）后再继续⁴⁵。\n\n#### 3.2.\
    \ 状态会随状态返回一个状态码。正常完成的请求将具有状态 4 和状态码 200。然而，状态码可能因服务器而异，检查这些值是一个好主意。\n\n- 4 一旦事务初始化并设置了回调，可以使用\
    \ `send` 方法将事务发送到服务器。在本例中，程序会完成，但回调函数将一直持续直到请求完成且 `xmlhttp` 对象被释放。\n\n运行此命令的结果如图所示。\n\
    \n> ⁴⁵ 有关请求状态和状态码的更多信息，请访问 https://www.w3schools.com/xml/ajax_xmlhttprequest_response.asp\n\
    \nWeb 编程：\n\n文件 编辑 查看 书签 工具 帮助\n\n```\n(2 条未读) - charles_kann@ya Xfinity Connect\
    \ Inbox localhost:1337/SimpleRequest X\n```\n\n```\nInspector Console Debugger\
    \ Style Editor Performance Memory Persist Logs\n```\n\n```\nState = 2, and status\
    \ = 200 SimpleRequest.html:14:7\nState = 3, and status = 200 SimpleRequest.html:14:7\n\
    State = 4, and status = 200 SimpleRequest.html:14:7\nState = 4, and status = 200\
    \ SimpleRequest.html:17:5\n```\n\n图 31 – 演示异步请求和响应的 JavaScript 输出\n\n### 7.3.2\
    \ 异步的含义\n\n早些提到过事务是异步的。这对程序具有不显而易见的巨大影响，特别是对于不熟悉并发的程序员来说。接下来的示例将指出并发的含义，以及为什么它是\
