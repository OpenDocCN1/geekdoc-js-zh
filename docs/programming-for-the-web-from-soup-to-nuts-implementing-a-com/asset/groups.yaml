    # Chapter 2.3 Document Structure Tags and A Simple Web Page


    An HTML document is divided into two main sections, the *head* and the *body*.
    The reason for this division is that the head is to contain metadata, and the
    body is to contain the information to be displayed on the web page.


    To understand this, it is important to understand the meaning of the term metadata.
