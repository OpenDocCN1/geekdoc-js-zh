    \n要使用 jQuery 库，必须包含它。这是对程序 `<head>` 部分的首次修改。`<head>` 部分如下：\n\n```html\n<head>\n\
    <title>Map Example Input Screen</title>\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js\"\
    ></script>\n<script>\n  // New code will go here...\n</script>\n</head>\n```\n\
    \n程序 61 – 在表单中插入 Query。\n\n## 3.4.2 节为按钮添加事件回调\n\n为了启动表单，将通过在表单底部的 Process Form\
    \ 按钮上设置 `onClick` 事件的回来赋予功能。\n\n在按钮中，当按钮被按下时会触发 `onClick` 事件。在创建按钮时可以指定此事件行为，如下例所示，按下按钮时会调用\
    \ `alert`。\n\n```html\n<input type=\"button\" value=\"Process Form\" onclick=\"\
    alert('Button is clicked')\" />\n```\n\n在此段代码中，要执行的 JavaScript 代码（例如创建一个告警框）被赋值给\
    \ `onClick` 事件的字符串。在我们正在开发的网页中，将所有 JavaScript 代码直接放在 HTML 中将是困难且不可预测的。`onClick`\
    \ 可以执行任何 JavaScript 表达式，因此调用一个函数并将扩展行为放在函数中，在按钮按下时调用它是很容易的。\n\n```html\n<input\
    \ type=\"button\" value=\"Process Form\" onclick=\"processForm()\" />\n```\n\n\
    这种为值提供回调的方法是有效且行的，但它代表了一种过时的做法。被称为非侵入式 JavaScript（Unobtrusive JavaScript）的样式被认为是开发网页的最佳实践。非侵入式\
