    \  console.log(\"The type is \" + maptype[i].value);\n    }\n  }\n});\n</script>\n\
    </head>\n```\n\n# 程序 66 - 使用 For 循环处理单选按钮\n\njQuery 将此循环抽象为单行，用于处理单选按钮。该语句表示名称为\
    \ `maptype` 的元素是单选组，jQuery 此遍历选中的单选按钮。获取选中的单选按钮。与之前的代码对应的 jQuery 等效代码如下。\n\n```html\n\
