- md: "\n# PROGRAMMING FOR THE WEB:\n\nTo understand unstructured data, an example\
    \ will be given that occurs when working with maps. On a map there can be various\
    \ features, which can be thought of as markers on a google map. These features\
    \ have standard properties, such as position, title, marker style, and description,\
    \ and these properties can be stored in a structured format as a tuple (record)\
    \ in a relational database.\n\nNow consider a real application, a example of the\
    \ monuments on the Gettysburg Battlefield (http://chuckann.com/Monuments/Monuments.html).\
    \ In this map variety features are placed on the map. These features represent\
    \ many types of monuments. Some features are genuine monumental and may not be\
    \ associated with states. Some features are monuments to people who fought at\
    \ Gettysburg, and could be associated with a person, but could also be associated\
    \ with a state or regiment. Some monuments are buildings, and could be associated\
    \ with person, or a regiment, or a part of the battlefield.\n\nTo make the situation\
    \ even harder, the application should not define what are valid associations when\
    \ the application is written. If a new association type, such as casualty percentage,\
    \ is to be added to some of the features in the future, this data would be stored\
    \ and easily searched.\n\nWhile this type of design might not be a common problem,\
    \ it is not uncommon. Probably the reason it is not more common because programmers\
    \ are always inventing work around handle the problems, and most work around using\
    \ relational databases poor hacks.\n\nHowever, using unstructured data (e.g. a\
    \ JSON type format), this problem of unstructured information and relationships\
    \ does not exist. Because all objects are just property maps, it is possible to\
    \ add attributes of any type to any object.\n\nOne important aspect of learning\
    \ JavaScript and its object definition is that it often requires the program to\
    \ look at object-oriented design in a completely new and different manner, increasing\
    \ the tools they have to solve problems.\n\n# Chapter 5.9 Conclusion\n\nI hope\
    \ that after reading this chapter, the reader is convinced that JavaScript is\
    \ not Java/C# or any other class-based OOP language they have used. I hope that\
    \ they have either decided it is too weird to ever make sense the metaphors and\
    \ models they have used in the past with these languages, and started to understand\
    \ JavaScript for what it is, what it is not.\n\n# Chapter 5.10 Exercises\n\n-\
    \ 1. Explain why it is a very bad idea to serialize functions in JSON and store\
    \ them to an external file or send them to another computer.\n- 2. What is the\
    \ eval() function in JavaScript? What do you think is the original of the JavaScript\
    \ saying \"eval is evil\".\n- 3. Explain why an object built with encapsulation\
    \ but the ability to change the methods accessing the closure variable is safe.\n\
    - 4. What is the difference between using the new operator and operator.create?\n\
    \n# What you will learn\n\nIn this chapter, you will learn:\n\n- 1. What a CRUD\
    \ interface is\n- 2. How to create a user interface for an application\n- 3. How\
    \ to create the object(s) needed for an application from a UI\n- 4. Mapping the\
    \ UI into program behavior\n\n# Chapter 6 CRUD, Objects, and Events\n\nThis chapter\
    \ will bring together all the components needed to design and develop a web based\
    \ Create-Read-Update-Delete (CRUD) application for the web. This application will\
    \ use local storage to store the data from the application, but the application\
    \ will be developed in a way that will allow it to later take advantage of storing\
    \ the data on a server web services.\n\n# Chapter 6.1 CRUD Interface\n\nCRUD is\
    \ an acronym for the most basic type of user interface. Most interfaces use this\
    \ pattern, though it might be hard to see sometimes. Consider an online store\
    \ that has an interface for purchasing an item. The interface allows users to:\n\
    \n- 1. create a record, for example to purchase an item from an online store,\n\
    - 2. read the record, or get the details of the purchase\n- 3. update, or change\
    \ the details of the purchase\n- 4. delete the purchase completely.\n\nThe store\
    \ then continues the pattern, allowing a user to record for a purchase order,\
    \ consisting of many items to be purchased. This purchase order interface again\
    \ has a CRUD interface, which manipulates purchases of individual items.\n\nThe\
    \ example in this chapter is much simpler than the example application for the\
    \ store. It will simply create a map of records that are stored in an array. The\
    \ CRUD application will add/update/delete the records from the array. The application\
    \ will use a version of the map application that the books has been developing.\n\
    \nThis map application will use OOP to collect and store as an object. The object\
    \ will be implemented as shown in Chapter 5.6.1.\n\nEach of the CRUD operations\
    \ will be implemented using events, which in this book will be called Event Based\
    \ Programming (EBP). EBP will seem very different and strange to readers familiar\
    \ with only Procedural Programming, where all program actions emanate from a main\
    \ method. In EBP, all functions are dependent and run as the result of an event\
    \ occurring.\n\nTo help in understanding the system design and implementation,\
    \ this chapter will be structured as follows:\n\n- 1. An initial design of the\
    \ system (a mockup of how the system should generally look and act) will be created.\n\
    - 2. The HTML and CSS programs for this mockup will be implemented, separately\
    \ from the functionality that will be included in the system. The design look-and-feel\
    \ of the system will be kept separate from the functionality throughout the implementation,\
    \ and in the real world represent completely different skill sets.\n- 3. The forms\
    \ in the application will be mined for the data needed for the application.\n\
    - 4. The events needed to run the application will be defined, and a brief description\
    \ of how to implement each event will be given.\n- 5. The code to handle each\
    \ event will be written.\n\n## Chapter 6.1.1 Overall Design\n\nThe HTML and CSS\
    \ programs for this mockup will be implemented, separately from the functionality\
    \ that will be included in the system. The design look-and-feel of the system\
    \ will be kept separate from the functionality throughout the implementation,\
    \ and in the real world represent completely different skill sets.\n\nAt the end\
    \ of these steps, the application will be fully functional.\n\nThe first step\
    \ is to create a mockup of how the system should generally look and act. This\
    \ allows us to visualize the layout before writing any complex code.\n\n# PROGRAMMING\
    \ FOR THE WEB:\n\n![Figure 1: Wire Frame for CRUD interface](http://chuckann.com/Monuments/Monuments.html)\n\
    \nThe application will consist of two panels. Panel 1 will always be displayed\
    \ while the application is running. Panel 1 contains the buttons: Create, Read,\
    \ Update, and Delete.\n\nThere are a second set of buttons: Save to File and Read\
    \ from File. The save to file will use a JSON format. The read from file will\
