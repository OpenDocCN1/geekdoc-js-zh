    # Chapter 3.2.5 Sentinel control loops - while statement


    There are generally three types of looping constructs: A sentinel control loop
    loops until condition is met; a counter control loop, that loops a number of times;
    and an iterator, that loops over some data structure as an array and performs
    an operation on each member of that data structure. These three looping constructs
    are often associated with while statements, for statements, and iterator loop¹⁷.


    These types of loops will be covered in the next sections. This section will cover
    the sentinel control loop, implemented with a while statement.


    The schema¹⁸ for a sentinel control loop is the following:


    ```

    Process the initial input, and set the initial loop condition

    Check the loop condition

    Process the data for each iteration of the loop

    Process the new input, and update the loop condition

    End of loop

    ```


    Program 42 - Schema for a Sentinel Control loop


    > ¹⁷ An iterator is implemented in Java as an extended for, but the syntax for
    it differs widely in languages.

    ¹⁸ A schema is a "representation of a plan or theory in the form of an outline
    or model." https://www.google.com/search?q=schema&ies-utf=8&oes-utf=8. The term
    schema is generally used in this text to discuss about what model is to be done,
    and a plan is the implementation of a program structure. Experienced programmers
    have learned and internalized a large number of schemas and tend to see programs
    less in terms of how the code progresses, but the schemas needed to solve a problem.'
