    a tray is placed on the top of the stack of trays, and so the last tray placed
    is the first accessed, and a stack is just a Last-In-First-Out (LIFO) queue.


    > Gödel''s theorem proves that no metaphor can ever be sufficient, as complete
    systems have undecidability, and decidable systems are incomplete. A large part
    of education should be helping people understand this and teaching them how to
    give up invalid metaphors when they no longer work.'
