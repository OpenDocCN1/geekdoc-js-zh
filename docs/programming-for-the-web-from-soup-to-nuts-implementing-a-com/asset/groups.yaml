    # PROGRAMMING FOR THE WEB


    A suggested 14 week class at an advanced undergraduate level would be as follows:


    | Week | Chapter | Topics |

    |---|---|---|

    | 1-3 | 2, 3 | Basic HTML, and form definition using HTML Processing. Processing
    a form in HTML:<br>1. Procedural programming, decisions and loops<br>2. Functions<br>3.
    Events<br>4. Onload event to event listeners<br>5. Unobtrusive JavaScript<br>6.
    Immediately Invoked Function Expressions (IIFE)<br>7. Query<br>8. Form processing<br>9.
    Lambda functions and functional programming |

    | 4-6 | 4, 5 | CSS JavaScript objects:<br>1. JSON<br>2. Constructor Functions<br>3.
    Prototypes<br>4. Functions and Closures<br>5. Object Oriented Models in JavaScript
    |

    | 7-9 | 6 | CRUD interfaces<br>1. Designing an interface<br>2. Designing the data
    objects<br>3. Implementing a simple CRUD interface<br>4. Persistent storage to
    local storage<br>Persistent storage using a server<br>1. Node.js<br>2. Sails<br>3.
    REST<br>4. HTTP requests |

    | 10-14 | 7 | Map applications using Open Layers<br>Group or individual projects
    |


    This book is currently almost done. The last section of the last chapter is mostly
    just code for the map application using persistent storage, really isn''t a lot
    of discussion of the application. However, I need to have the text this out for
    a class, and I will probably not get a ton of time to work on it for the semester.
    I believe the rest is enough that I wanted to release it.


    I have plans for a number of additions to the book. These include more use of
    ECMA6+ concepts I think will be useful (modules, arrow functions, etc), an extension
    to the map application using unstructured data, and the inclusion of more server-side
    functionality, including linking and using NoSQL capabilities of MongoDB and possibly
    JSON in MySQL.


