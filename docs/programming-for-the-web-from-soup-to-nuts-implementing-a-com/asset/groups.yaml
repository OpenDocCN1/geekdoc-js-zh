    </script\n```\n\n程序 65 - 使用 JQuery 处理复选框\n\n## 第 3.4.5 节处理单选按钮\n\n单选按钮的处理比复选框更复杂。对于复选框，每个框都是单独处理的，且这些复选框只需要对象的的一个属性（`value`\
    \ 或 `checked`）。单选按钮包含在一个组中，因此要获取选中的值需要对单选按钮组进行处理，以查看哪个单选按钮被选中了。\n\n处理单选按钮的第一步是通过\
    \ `name` 属性而不是 `id` 属性来获取组中的所有按钮。与唯一的 `id` 不同，`name` 不是唯一的。且 `name` 用于在用户界面（UI）中对单选按钮分组。为了处理单选按钮，使用\
    \ `getElementsByName` 获取具有相同 `name` 的所有按钮，作为单个单选按钮的数组。\n\n处理单选按钮最直接的方法是遍历数组，查看哪个数组元素被选中，并获取与该元素相关的属性（`id`、`value`\
    \ 等）。下方的函数所示，其中使用 `document.getElementsByName` 函数来获取单选按钮数组，然后处理该数组中的选中的项。如果被选中（`checked`\
    \ 属性为 `true`），则打印该值。\n\n注意，对于单选按钮，本示例使用了 `value` 属性。在 HTML 中定义特定单选按钮时设置值，以便获取与实际选中的单选按钮相关的字符串。\n\
    \n```html\n<head>\n<title>地图示例输入界面</title>\n```\n\n> 22 注意方法的名称。要获取单个对象（如复选框或文本框），调用方法\
    \ `getById`。注意名称中的字符串 `Element` 是单数。要获取单选按钮组，调用 `getElementsByName`。字符串 `Elements`\
    \ 是复数。\n\n```html\n<script>\nsrc=\"https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js\"\
