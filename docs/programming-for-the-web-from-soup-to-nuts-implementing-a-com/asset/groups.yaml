    # Part I: The Basic Components of Web Pages


    Part I of this text is an introduction to the basic concepts needed for this textbook.
    Part I of the book provides a first introduction to HTML, CSS, and JavaScript.
    It covers HTML, CSS, and JavaScript syntax, the basic functionality of JQuery,
    and how to handle events in JavaScript. It also introduces JavaScript lambda functions,
    and how to implement events in unobtrusive JavaScript by using Immediately Invoke
    Function Expressions (IIFE) in an onload event function. It will end with a brief
    introduction to Functional Programming.


    # PROGRAMMING THE WEB:


    ## Chapter 1 Introduction


    ### Chapter 1.1 About this Book


    This book is introduced for readers who have an understanding of computer programming
    language such as Java, C#, C++, or Python, and want to learn how to create map
    applications for the World Wide Web (or Web). It was written for Junior Computer
    Science (CS) college students''. These students will have at least 1-2 courses
    in one programming language, as the ones mentioned above, as well as a class in
    Data Structures. Most of these students will not be familiar with any technologies
    for the programming for the Web.


    Some nonprogrammers will argue that all is needed for web pages is a Content Management
    Systems (CMS) such as WordPress, Joomla, Scala, or any number of tools targeted
    at nonprogrammers. While it is possible to create perfectly reasonable web sites
    with a CMS, these tools are designed to manage content. The core technologies
    for Web browsers are Hyper Text Markup Language (HTML), Cascading Style Sheets
    (CSS), and JavaScript², and to access any power for a web application that a programmer
    to be familiar with these technologies. Even end users using a CMS often need
    to use HTML, CSS, or JavaScript for some specific functionality.


    The need to know the core technologies of the web, HTML, CSS, and JavaScript,
    is also necessary for programmers who are using other languages for Web development
    as C#, Python, or Java. Even though these languages provide templating engines,
    the output from these is HTML, CSS, and JavaScript. To understand the input and
    output of templating engines, programmers should know about the Web technologies
    that these templating tools target.


    The style of the book will not be like a traditional textbook. It will have problems
    at the end of each chapter, but so the reader can test their knowledge of the
    subjects presented and learn the concepts at a deeper level than I can present
    in the written portion. The tone of the book is more conversational, and the format
    more like a tutorial than a textbook. This is in keeping with my style of interacting
    with students.


    This text will follow material to develop one application, simple Map Viewer in
    Open Layers, from soup to nuts. The phrase “soup to nuts” is an English idiom
    meaning the “whole thing”. It comes from the idea that a traditional American
    meal starts with a soup course and ends with nuts. This book was written with
    this paradigm. It intends to present enough material that a student can learn
    the technologies, and concepts. The mapping presented is the starting point for
    students.


    > ¹ The purpose of writing this book was to prepare students doing research.


    > ² The general consensus of the development community is to move away from JavaScript.
    At the time this was written (July 2018), the specification for WebAssembly is
    still being developed (https://webassembly.org/). JavaScript will remain a core
    technology.


    ### Chapter 1.2 What you will learn


    The purpose of this text is to present more than just how to create a site. It
    specifically introduces students to the following:


    - 1. Implementation of a complete Create-Read-Update-Delete (CRUD) application,
    from soup to nuts. It will start defining the basic functionality of an.

    - 2. A basic overview of all the technologies needed to implement a web page.
    After completing this book, you will be able to implement simple CSS, HTML, JavaScript,
    JQuery, a CRUD interface, a simple Representational State Transfer (REST) interface,
    and use OpenLayers to create a map that goes beyond what programmers can do in
    Google Maps.

    - 3. How to use events in JavaScript. You will know that the HTML DOM exists,
    and that it contains a lot of information. You will be able to use standard JavaScript
    libraries like JQuery. You will be able to use OpenLayers to implement GIS and
    other image-based programs. You will be able to build Node.js server with a framework.
    You will know what a NoSQL database is, and some of the reasons to choose between
    NoSQL and relational database.

    - 4. How to design, write and use mapping applications, which is an area of interest
    to me, and why this book was written. Juxtaposing symbolic information in a data
    space to highlight the interplay that the information is fascinating to me.

