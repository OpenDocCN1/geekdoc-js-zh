    # What you will learn


    In this chapter, you will learn:


    +   1. What a CRUD interface is

    2. How to create a user interface for an application

    3. How to create the object(s) needed for an application from a UI

    4. Mapping the UI into program behavior


    # Chapter 6 CRUD, Objects, and Events


    This chapter will bring together all the components needed to design and develop
    a web based Create-Read-Update-Delete (CRUD) application for the web. This application
    will use local storage to store the data from the application, but the application
    will be developed in a way that will allow it to later take advantage of storing
    the data on a server web services.


    # Chapter 6.1 CRUD Interface


    CRUD is an acronym for the most basic type of user interface. Most interfaces
    use this pattern, though it might be hard to see sometimes. Consider an online
    store that has an interface for purchasing an item. The interface allows users
    to:


    +   1. create a record, for example to purchase an item from an online store,

    2. read the record, or get the details of the purchase

    3. update, or change the details of the purchase

    4. delete the purchase completely.


    The store then continues the pattern, allowing a user to record for a purchase
    order, consisting of many items to be purchased. This purchase order interface
    again has a CRUD interface, which manipulates purchases of individual items.


    The example in this chapter is much simpler than the example application for the
    store. It will simply create a map of records that are stored in an array. The
    CRUD application will add/update/delete the records from the array. The application
    will use a version of the map application that the books has been developing.


    This map application will use OOP to collect and store as an object. The object
    will be implemented as shown in Chapter 5.6.1.


    Each of the CRUD operations will be implemented using events, which in this book
    will be called Event Based Programming (EBP). EBP will seem very different and
    strange to readers familiar with only Procedural Programming, where all program
    actions emanate from a main method. In EBP, all functions are dependent and run
    as the result of an event occurring.


    To help in understanding the system design and implementation, this chapter will
    be structured as follows:'
  - '[PAGE 125]


    +   1. An initial design of the system (a mockup of how the system should generally
    look and act) will be created.


    +   2. The HTML and CSS programs for this mockup will be implemented, separately
    from the functionality that will be included in the system. The design look-and-feel
    of the system will be kept separate from the functionality throughout the implementation,
    and in the real world represent completely different skill sets.


    +   3. The forms in the application will be mined for the data needed for the
    application.


    +   4. The events needed to run the application will be defined, and a brief description
    of how to implement each event will be given.


    +   5. The code to handle each event will be written.


    At the end of these steps, a fully functioning CRUD interface will have been developed.


    # Chapter 6.1.1 Overall Application Design


    The first step in designing a system is to create some sort of mockup of the system
    to see how it will work. This type of mock is called a wire frame. The purpose
    of a wire frame is to set what the system will look like to define the options
    that will be available in the system, as well as the data and any data dependencies.
    The following is a wire frame design of the application which was generated in
    Pencil.'
