    - 9. 什么是逻辑运算符的短路机制？展示如何使用它来保护程序免于除零。\n- 10. 对于 `if`、`while` 或 `for` 循环，条件变量运算符返回值的结果是什么？\n\
    - 11. 文中提到 `if` 可以有一个空语句。什么是空语句？为什么它对初学者来说是祸源？为什么 JavaScript 允许空语句？\n- 12. `for`\
    \ 循环可以有空语句吗？\n- 13. 在 Java/C# 中使用比较运算符 (`==`) 处理字符串有效吗？\n- 14. JavaScript 中的函数被认为具有“位置参数”。位置参数和关键字参数之间有什么区别？\n\
    - 15. 函数会返回结果吗？你认为在没有指定返回内容时会返回什么？\n- 16. 用你自己的话解释 JavaScript 中“函数是数据”的含义。这被用于定义\
    \ Lambda 函数。如果你熟悉 Java 中的 Lambda 函数，Java 中的 Lambda 函数真的是数据吗？如果不是，它们又是什么？\n- 17.\
    \ 如果编写以下代码会发生什么？具体来说，它会执行吗？如果执行，数组的长度是多少？`people[0]` 的值是什么？`people[5]` 的值是什么？\n\
    \n```javascript\nlet people = Array(2);\npeople[1] = \"Nick\";\npeople[2] = \"\
    Ann\";\npeople[7] = \"Carol\";\n```\n\n## 第 3.3 节 事件、onload 事件和 JQuery\n\nJavaScript\
    \ 中实现的一种范式是基于事件的编程（EBP）。事件是在程序运行时发生（或触发）的异步操作。这些操作（或事件）通常由用户产生，例如点击按钮或更改文本框中的值。但事件也可以由程序的异步操作产生，例如加载网页或完成文件读取。触发的事件与一个处理该事件的回调函数相关联。\n\
    \n### 第 3.3.1 将回调函数与事件关联\n\n接下来的程序演示了如何将回调函数与事件关联。\n\n```html\n<html>\n<head>\n\
    \  <title>使用事件时 错误 </title>\n  <script>\n    function myFunction() {\n      alert(\"\
    You pressed me\");\n      //document.write(\"You pressed me\");\n    }\n  </script>\n\
    </head>\n<body>\n  <input type=\"button\" id=\"myButton\" value=\"Press me\" onclick=\"\
    myFunction();\"/>\n</body>\n</html>\n```\n\n在这个示例中，事件（调用为 `onClick`）与 `myFunction`\
    \ 相关联，该函数是元数据并定义在 html 页面的 `head` 中。当用户点击写有“Press me”的按钮时，它会调用带有点击事件的函数 `myFunction`，然后弹出一个警告框显示“You\
    \ pressed me”。\n\n这是事件和回调的完整生命周期。事件（click）被映射到一个回调函数（`myFunction`）。当事件触发时（用户点击按钮），该回调函数就会被调用。\n\
    \n本节的接大部分部分将解释你应该如何在 JavaScript 中实现它。\n\n### 第 3.3.2 处理事件 – 非侵入式 JavaScript (Unobtrusive\
    \ JavaScript)\n\n由于事件（或回调）函数是为了响应程序的事件而运行的，它们是元数据。在编写 HTML 页面时，程序员定义函数来处理来自 html\
    \ 文档表单元素的事件是正常的。一种被称为“非侵入式 JavaScript”的标准规定，所有的 JavaScript 都应该维护在文档的 `head` 中，因此将\
    \ `onClick` 设置为按钮定义的一部分被认为是不良实践。\n\n分配回调函数的正确方法如下。首先，重要的是知道网页上的所有组件都包含在文档对象模型（或\
    \ DOM）中。在为浏览器编写 JavaScript 时，DOM 非常重要，因为几乎所有内容都在 DOM 中。然而，目前你只需要知道按钮、文本框、复选框等都以对象的形式存储在\
    \ DOM 中。\n\n非侵入式 JavaScript 说，回调应该通过 `getElementById` 方法从 DOM 中获取按钮（在本例中为名为“myButton”的按钮）来分配。然后将此按钮的点击事件分配给一个匿名函数，该函数会在按钮按下时被调用。如下程序\
    \ 53 所示。\n\n```html\n<html>\n<head>\n  <title>使用事件时 错误 </title>\n  <script>\n\
    \    document.getElementById(\"myButton\").onclick = function() {\n      alert(\"\
    You pressed me\");\n    };\n  </script>\n</head>\n<body>\n  <input type=\"button\"\
    \ id=\"myButton\" value=\"Press me\" />\n</body>\n</html>\n```\n\n程序 53 - 在 `head`\
    \ 中使用表单元素。\n\n在 `head` 中使用表单元素之前。然而，这种程序存在问题。按钮等元素是在 `body` 中定义的，将 `onClick` 设置在按钮定义中会导致在按钮定义之前尝试引用它。如下程序所示，这在按钮定义之前发生错误。这种错误在控制台中是可见的，如果你在控制台中看到它，你应该知道如何使用它（这在控制台中是可见的）。\n\
    \n51 网页编程：\n\n图 4 - 在元素定义之前处理表单元素\n\n如何处理这个问题将是下一节的主题。\n\n### 第 3.3.3 处理事件 – onload\
    \ 事件\n\n为了处理在 `head` 中访问按钮的问题，`onload` 事件是在页面加载后触发的，所有元素都已定义。这就是 `onload` 事件。`onload`\
    \ 事件在表单加载后发生。如下所示：\n\n```html\n<html>\n<head>\n  <title>使用事件</title>\n  <script>\n\
    \  function myOnload() {\n    document.getElementById(\"myButton\").onclick =\
    \ function () {\n      alert(\"You pressed me\");\n    }\n  }\n  window.onload\
    \ = myOnload;\n  </script>\n</head>\n<body>\n  <input type=\"button\" id=\"myButton\"\
    \ value=\"Press me\" />\n</body>\n</html>\n```\n\n程序 54 - 在 `onload` 事件中设置回调函数\n\
    \n这段小代码比较复杂，将详细介绍。首先定义一个函数 `onload`，在这个函数中，按钮的点击事件与函数关联。`onload` 函数没有被调用，所以它被定义了但没有执行。\n\
    \n下一行 `window.onload = onload` 将 `onload` 方法与 `onload` 事件关联。这告诉 HTML DOM 在 `onload`\
    \ 事件触发后运行 `onload` 函数。这意味着按钮已经被定义，并且可以与在按下按钮时弹出消息的监听器相关联。这部分相对简单，至少在大观上是可以理解的。\n\
    \n复杂得多的是 `window.onload = onload` 语句中没有调用函数，而是将函数赋值给 `window.onload` 变量。为了看到这一点，请对比上一个程序和程序，后者在赋值\
    \ `window.onload` 变量时包含了括号。这是初学者程序员常见的错误，因为初学者被教导函数是可以执行的语句，而不是不能通过变量传递的数据。\n\n\
    ```html\n<html>\n<head>\n  <title>Window onload 事件</title>\n  <script>\n    function\
    \ myFunction() {\n      /* 如果取消注释，这段代码会导致 JavaScript 失败。\n      无论如何都不会工作，因为按钮代码尚未加载。\n\
    \      document.getElementById(\"myButton\").onclick = function() {\n        alert(\"\
    You pressed me\");\n      }\n      */\n      alert(\"window is not loaded\");\n\
    \      return \"you dummy\";\n    }\n    alert(window.onload = myFunction());\n\
    \  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n程序 55 - 显示函数被调用而非赋值给变量的程序。\n\
