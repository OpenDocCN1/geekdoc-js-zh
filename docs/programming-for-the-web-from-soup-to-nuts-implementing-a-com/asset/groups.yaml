    # What you will learn


    In this chapter, you will learn:


    +   - The basic function of the Node.js server environment, the npm package manager,
    and the Sails framework.

    - Installing and accessing Node.js and Sails

    - Creating an application with a REST Interface for the CRUD program developed
    in the last chapter.

    - What a REST interface is, and how to access it.

    - Accessing the REST interface from Postman

    - Accessing the REST interface from the CRUD program using AJAX to persist the
    data on server


    # Chapter 7 Creating a server for the persistent storage of our CRUD application


    In Chapter 6 a fully working, simple CRUD application was built on the information
    presented in the first 5 chapters. The biggest problem with the application from
    Chapter 6 is that the data was persisted on the local computer using the LocalStorage.
    This means that the data can be used by only one user on computer.


    In this chapter CRUD application from Chapter 6 is changed so that it can be accessed
    from remote client browser environments. This will allow multiple users to share
    access to the data.


    # Chapter 7.1 Creating and Accessing a Server Using Node.js, Sails


    In this section, an HTTP web server will be created using Node.js with Sails Blueprints.
    The HTTP server will be built using the Postman application to explain REST interfaces,
    and the server will be accessed and tested using the Postman application.


    # Chapter 7.1.1 Node.js


    For the purposes of this text, Node.js can be thought of as a server runtime that
    is used to run JavaScript. In this, the node command can be thought of the java
    command. Just as the java command runs an interpreter to run Java Byte Code (JBC),
    the node command runs an interpreter to run JavaScript. Any JavaScript program
    can be run with Node.js, not just servers, including interfacing to single board
    computers like the Raspberry Pi or Arduino.


    This book will be using Node.js from within Sails, so there will not be a need
    to ever run the node command for the server that will be created.


    > 41 See https://www.w3schools.com/nodejs/nodejs_intro.asp for more information
    about running programs using Node.js including creating servers, accessing databases,
    and programming a Raspberry Pi. For information about using Node.js and Arduino,
    a google search of "node Arduino" will bring multiple examples.'
