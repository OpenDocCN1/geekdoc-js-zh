    # 第一部分：网页的基础组件


    本书的第一部分介绍了本教程所需的基础概念。书的第一部分对 HTML、CSS 和 JavaScript 进行了初步介绍。它涵盖了 HTML、CSS 和 JavaScript
    语法、JQuery 的基本功能，以及如何在 JavaScript 中处理事件。它还介绍了 JavaScript  Lambda 函数，以及如何通过在 `onload`
    事件函数中使用立即调用函数表达式（IIFE）在非侵入式 JavaScript 中实现事件。最后将对函数式编程进行简要介绍。


    # 网页编程：


    ## 第1章 引言


    ### 第 1.1 节 关于本书


    本书面向已经理解 Java、C#、C++ 或 Python 等计算机编程语言，并想要学习如何为万维网（或 Web）创建地图应用的读者。它是为计算机科学（CS）专业的大级学生编写的。这些学生至少上过
    1-2 门编程语言课程（如上述语言），并上过数据结构课程。大多数这些学生并不熟悉任何网页编程技术。


    一些非编程人士会认为，网页只需要一个内容管理系统（CMS），如 WordPress、Joomla、Scala 或任何针对非程序员的工具。虽然可以使用 CMS
    创建非常合理的网站，但这些工具是为了管理内容而设计的。浏览器的核心技术是超文本标记语言（HTML）、层叠样式表（CSS）和 JavaScript²，为了访问应用程序的任何功能，程序员必须熟悉这些技术。即使是使用
    CMS 的终端用户通常也需要使用 HTML、CSS 或 JavaScript 实现某些功能。


    对于使用 C#、Python 或 Java 等语言进行 Web 开发的程序员来说，了解网页的核心技术 HTML、CSS 和 JavaScript 也是必要的。尽管这些语言提供了模板引擎，但它们的输出仍然是
    HTML、CSS 和 JavaScript。为了理解模板引擎的输入和输出，程序员应该了解这些模板工具所针对的 Web 技术。


    本书的风格不像传统的教科书。每个章节末尾都有练习，以便读者测试对所介绍知识的掌握情况，并在比文字部分所呈现的更深层次上学习概念。书的语气更加口语化，格式也更像教程而不是教科书。这符合我与学生交流的风格。


    本书将遵循开发一个应用——即 OpenLayers 中简单的地图查看器的材料，从头到尾（soup to nuts）。“Soup to nuts” 是一个英语习语，意思是“全部”。它源于传统的美国餐从汤开始以坚果结束。本书就是按照这种范式编写的。它旨在提供足够的材料让学生学习这些技术和概念。书中展示的映射是学生的起点。


    > ¹ 写这本书的目的是为了要做研究的学生做准备。


    > ² 开发社区的普遍共是远离 JavaScript。在写作（2018年7月），WebAssembly 的规范仍在开发中（https://webassembly.org/）。JavaScript
    将仍然是一项核心技术。


    ### 第 1.2 节 你将学到


    本书的目的是不仅仅是介绍如何创建一个网站。它特别地向学生介绍了以下内容：


    - 1. 实现一个完整的创建-读取-更新-删除（CRUD）应用，从头到尾。它将开始定义其基本功能。

    - 2. 实现网页所需的所有技术的基本概述。在完成本书后，你将能够实现简单的 CSS、HTML、JavaScript、JQuery、CRUD 接口、简单的表述性状态转换（REST）接口，并使用
    OpenLayers 创建超越程序员在 Google Maps 中能实现的各种地图。

    - 3. 如何在 JavaScript 中使用事件。你将知道 HTML DOM 的存在，以及它包含大量信息。你能够使用标准的 JavaScript 库如 JQuery。你能够使用
    OpenLayers 实现 GIS 和其他基于图像程序。你能够使用框架构建 Node.js 服务器。你将知道什么是 NoSQL 数据库，以及在 NoSQL
    和关系型数据库之间进行选择的一些原因。

    - 4. 如何设计、编写和使用地图应用（这是我感兴趣的领域），以及为什么要写这本书。在数据空间中并置符号信息以突出信息之间的交互令我着迷。


