    # Chapter 5.6 A JavaScript OOP Model


    This section will combine all the material contained in this chapter to this point
    to create an OOP model to be used throughout the rest of this. Two object models
    will be given. The first is the one normally used in JavaScript, so it will be
    the one used through the rest of the book. It does enforce encapsulation or information
    hiding, but languages like TypeScript have been introduced since ECMA6 to provide
    encapsulation and information hiding, and generally compile to JavaScript that
    follows the basic pattern of an object presented in this first object model.


    A second model of OOP will be presented to show how JavaScript closure can be
    used to enforce encapsulation and information hiding in JavaScript. This would
    be a good implementation of OOP in JavaScript if encapsulation and information
    hiding are needed, but it has been overtaken by events, and most programmers using
    these features will be using languages such as TypeScript. It is presented because
    it highlights and explains a lot of features of JavaScript programming.


