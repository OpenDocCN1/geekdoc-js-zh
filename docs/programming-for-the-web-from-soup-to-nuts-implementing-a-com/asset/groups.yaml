    # Part II: JavaScript Objects and CRUD Interfaces


    Part II of this book gives an overview of how to create object in JavaScript.
    This object will be used as the basis for to create a Create-Read-Update-Delete
    (CRUD) interface. The interface will initially persist objects LocalStorage for
    the web site. A server will then be created to persist the objects to a Mongo
    database, and Asynchronous JavaScript XML (ajax) protocols will be used to connect
    the user interface to the server. This will create a complete web application,
    from soup to nuts.


    This application is unreasonably simplistic. However, it opens up and shows how
    to use all parts of working web application. Once this application is complete,
    the reader will have a basic idea of all parts of what is called the full application
    stack.'
