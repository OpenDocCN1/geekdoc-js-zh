    # Chapter 7.2 Accessing a Server Using Node.js, Sails


    Now that the application server is running, it can be accessed by any browser.
    To see this type following the Uniform Resource Locator into any web browser:


    ```

    http://localhost:1337/MapData

    ```


    The statement tells the browser to look on the local host for a program attached
    to port 1337. At that port a resource, MapData, will be found, and data from that
    application will be shown on the web page.


    Depending on the browser, you will get different outputs. Chrome will display
    an open and close square bracket, indicating that there is no MapData in the application.'
