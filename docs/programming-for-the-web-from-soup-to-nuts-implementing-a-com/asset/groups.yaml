- md: "\n# PROGRAMMING FOR THE WEB:\n\nProgram 76 - Paragraph text only affecting\
    \ the header of the document\n\nThe result is the <p> tag only affecting the header\
    \ of the document.\n\n![](img/ce60a0a8b4160fc893a11ed149173e93_77_0.png)\n\nTest\
    \ to show effect of different <p> tag coalitions\n\nFigure 8 - Third pass at the\
    \ web page header\n\n## Chapter 4.1.6 Dividing up the header block\n\nIn Figure\
    \ 6, the header has 3 separate areas, one for the title and page information,\
    \ and one area for the options to be implemented. To divide a web page into parts,\
    \ a `<div>` tag is used. The `<div>` is the most useful of all CSS tags, as it\
    \ can be used to break up a web page into divisions, and to assign different styling\
    \ or information types to those areas. For now, it will be used to break the header\
    \ into 3 pieces.\n\nTo break the header up into 3 pieces, 3 divisions are created.\
    \ These are all placed inside the header section and can be thought of as *parts*\
    \ or *children of the header*. This section allows these 3 divisions to appear\
    \ inside of the web page header. These 3 division are shown below.\n\n```html\n\
    <header>\n  <div id=\"header-icon\">\n    <img src=\"GRI_logo.png\" />\n  </div>\n\
    \  <div id=\"header-desc\">\n    <h1>Map Example</h1>\n    <p>\n      Example\
    \ map input screen <br>\n      &copy; Gettysburg Research Institute\n    </p>\n\
    \  </div>\n  <div id=\"header-menu\">\n    <p>\n      Home File About\n    </p>\n\
    \  </div>\n</header>\n```\n\n- The current thinking about CSS is that an HTML\
    \ document should be divided into divisions (using the `<div>` tag) when the page\
    \ is being divided for styling purposes, and into sections (using the semantic\
    \ `<section>` tag) when it is being divided into parts that would be equivalent\
    \ to areas in an outline. There is no difference other than the semantic meaning\
    \ of the section as part of a larger document organization. As this document is\
    \ concerned with formatting program web pages, it will use only divisions to keep\
    \ the confusion to a minimum.\n\n# PROGRAMMING FOR THE WEB:\n\nProgram 77 - Dividing\
    \ the header into 3 divisions.\n\nThis code only divides the header so that the\
    \ DOM knows they are 3 separate areas inside of the header. The DOM does not know\
    \ how to display them, so it places them in separate blocks, as shown below.\n\
    \n![](img/ce60a0a8b4160fc893a11ed149173e93_78_0.png)\n\nFigure 9 – Un-styled div\
    \ sections\n\nTo make the divisions work as intended, they must be styled.\n\n\
    To style each division, the divisions must be given a way to reference them. If\
    \ there are a number of divisions to be styled, normally a class variable is defined\
    \ in CSS, and referenced using the class attribute in the tags. If the division\
    \ is to be uniquely styled, it will be given an id attribute, and CSS will use\
    \ it using an id variable. Since the divisions in the header will be unique for\
    \ the header, they will use id variables to reference and style them. Note in\
    \ the program above, the individual divisions have been assigned the names header-icon,\
    \ header-menu. This follows CSS conventions which favor hyphenated names.\n\n\
    When referencing id in CSS, the name is prefixed with a hash tag (#). For example,\
    \ to set the header-desc to a display of inline-block the following would be used.\n\
    \n```css\n#header-desc {\n  display : inline-block;\n  margin : 25px;\n}\n```\n\
    \nCareful readers will remember that this is id variables were referenced in jQuery.\
    \ jQuery uses CSS naming conventions to access DOM elements. This was alluded\
    \ to earlier, but now is made explicit. Thus, to use jQuery at least a passing\
    \ knowledge of CSS is necessary to know how to access DOM elements\n\nThe main\
    \ purpose of the CSS for these header divisions is to set the display parameters\
    \ for them. The choice of inline-block tells the DOM to lay these divisions out\
    \ as blocks, one after another on the same line. The margin tells the DOM how\
    \ to space the elements apart.\n\n# PROGRAMMING FOR THE WEB:\n\nThe last attribute\
    \ set in the header divisions is the float attribute. The float attribute defines\
    \ which side of the line to place the element on. Normally inline and inline-block\
    \ elements start at the far left and are placed after each other from left to\
    \ right. By saying float: right, the program is saying this element starting at\
    \ the right, and then place subsequent elements moving from right to left. Menu\
    \ items generally are at the right of the header to balance the header.\n\nThe\
    \ final CSS code for this example is shown below.\n\n```html\n<html>\n  <title>Map\
    \ Example Input Screen </title>\n  <style>\n    header {\n      margin: 50px;\n\
    \      border: 2px solid blue;\n      background-color : slategray;\n      color\
    \ : white;\n    }\n\n  header p {\n    font-size: 150%;\n  }\n\n  #header-icon\
    \ {\n    display: inline-block;\n    margin: 50px 10px 50px;\n  }\n\n  #header-desc\
    \ {\n    display: inline-block;\n    margin: 25px;\n  }\n\n  #header-menu {\n\
    \    display: inline-block;\n    float: right;\n    margin: 75px 50px 50px;\n\
    \  }\n  </style>\n\n<head>\n\n<body>\n  <header>\n    <div id=\"header-icon\"\
    >\n      <img src=\"GRI_logo.png\" />\n    </div>\n    <div id=\"header-desc\"\
    >\n      <h1>Map Example</h1>\n      <p>\n        Example map input screen <br>\n\
    \        &copy; Gettysburg Research Institute\n      </p>\n    </div>\n    <div\
    \ id=\"header-menu\">\n      <p>\n        Home File About\n      </p>\n    </div>\n\
    \  </header>\n</body>\n</html>\n```\n\nProgram 78 - Completed header\n\nThis program\
    \ gives the final, completed header for the page.\n\n![](img/ce60a0a8b4160fc893a11ed149173e93_80_0.png)\n\
    \nFigure 10 – Completed web header\n\n## Chapter 4.1.7 Managing CSS\n\nTo make\
    \ managing a project and reading source code easier, the CSS source code for a\
    \ web page is generally kept in a separate file from the html. This separation\
    \ achieves a number of benefits: 1) it keeps the styling information separate\
    \ from the application information, which makes it easier to read and understand\
    \ the HTML; 2) By separating the styling and format, UI designers can work on\
    \ styling the application without interfering with the programmers.\n\nFor the\
    \ header developed above, the file containing the CSS could be kept in WebExample.css,\
    \ and the HTML could be kept in MapExample.html. The CSS is included in the web\
    \ page using a <link>.\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\"\
    \ href=\"WebExample.css\">\n```\n\nThe contents of the WebExample.css file is:\n\
    \n```css\nheader {\n  margin : 50px;\n  border : 2px solid blue;\n  background-color\
    \ : slategray;\n  color : white;\n}\n\nheader p {\n  font-size : 150%;\n}\n#header-icon\
    \ {\n  display: inline-block;\n  margin: 50px 10px 50px;\n}\n#header-desc {\n\
    \  display: inline-block;\n  margin: 25px;\n}\n#header-menu {\n  display: inline-block;\n\
    \  float: right;\n  margin: 75px 50px 50px;\n}\n```\n\n## Program 79 - WebExample.css\n\
    \nThe application file, MapExample.html, is now much simpler, and easier to understand.\n\
    \n```html\n<html>\n<head>\n  <title>Map Example Input Screen</title>\n  <link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"WebExample.css\">\n</head>\n<body>\n\
    \  <header>\n    <div id=\"header-icon\">\n      <img src=\"GRI_logo.png\" />\n\
    \    </div>\n    <div id=\"header-desc\">\n    <h1>Map Example</h1>\n      <p>\n\
    \        Example map input screen<br>\n        &copy; Gettysburg Research Institute\n\
    \      </p>\n    </div>\n    <div id=\"header-menu\">\n      <p>\n        Home\
    \ File About\n      </p>\n    </div>\n  </header>\n</body>\n</html>\n```\n\n##\
    \ Program 80 - MapExample.html\n\nIn the real world, most programmers will deal\
    \ with the HTML and JavaScript, and UI/UX designers will handle the CSS for a\
    \ web page. However, both sides, programmers and UI/UX designers, should know\
    \ enough about the other technologies to be able to interface effectively with\
    \ their counterparts.\n\n## Chapter 4.1.8 Quick Review\n\n1. What are the four\
    \ types of CSS tags? Give an example of each and describe how you might use them.\n\
    2. In your words, describe *semantics*? What is an HTML semantic tag, and how\
    \ does it differ from a formatting tag?\n3. What is the difference between a display:block\
    \ and display:inline-block attribute? How were they used to set up the header\
    \ division of the web page?\n4. How would you hide a division of an HTML document?\n\
    5. Looking at the following web page, https://www.w3schools.com/cssref/pr_class_display.asp,\
    \ discuss how you might use the display attribute to format a web page?\n6. How\
    \ might you specify a paragraph <p> tag so that it only impacts the text in the\
    \ #header-desc?\n7. How would you format the <p> tag so that all of the output\
    \ in the document associated with an error message would be in red?\n8. Create\
    \ a CSS file and include it in another HTML file. Does the name have to be “.css”?\n\
    \n## Chapter 4.2 Adding the form to the page\n\nAfter the header has been developed,\
    \ the form is added to the page. For now, only the display of the form will be\
    \ presented to make the concepts clearer. Later, this chapter will show how CSS\
    \ can be used with JavaScript to control display of the form.\n\nIf the form is\
    \ simply added to the page, as shown below, it looks very unprofessional. While\
    \ it is functional, it is ugly and would not inspire confidence from the users\
    \ that the web page actually works.\n"
  mdcn: "\n\n# 网页编程：\n\n程序 76 - 仅影响文档页头的段落文本\n\n结果是只有 <p> 标签影响了文档的头部。\n\n![](img/ce60a0a8b4160fc893a11ed149173e93_77_0.png)\n\
    \n显示不同 <p> 标签组合效果的测试\n\n图 8 - 网页页头的第三次处理\n\n## 第 4.1.6 节 分割头部块\n\n在图 6 中，页头部有\
    \ 3 个独立的区域，一个用于标题和页面信息，另一个区域用于要实现的选项。为了将网页划分为若干部分，使用了 `<div>` 标签。`<div>` 是所有 CSS\
    \ 标签中最实用的，因为它可以用于将网页拆分为多个区域，并为这些区域分配不同的样式或信息类型。目前，它将用于将页头部分为 3 份。\n\n为了将页头部分为\
    \ 3 份，创建了 3 个划分。它们都被放置在头部区域内，并可以被视为*部分*或*头部的子元素*。此部分允许这 3 个划分出现在网页页头部内部。下方显示了这\
    \ 3 个划分。\n\n```html\n<header>\n  <div id=\"header-icon\">\n    <img src=\"GRI_logo.png\"\
    \ />\n  </</div>>\n  <div id=\"header-desc\">\n    <h1>Map Example</h1>\n    <p>\n\
    \      Example map input screen <br>\n      &copy; Gettysburg Research Institute\n\
    \    </p>\n  </div>\n  <div id=\"header-menu\">\n    <p>\n      Home File About\n\
    \    </p>\n  </div>\n</header>\n```\n\n- 目前对 CSS 的理解是：当为了样式目的而划分页面时，HTML 文档应该被划分为划分（使用\
    \ `<div>` 标签）；当被划分为等同大纲中区域的部分时，使用语义化的 `<section>` 标签划分为部分。除了 section 作为较大文档组织结构的一部分的语义含义外，其他者没有区别。由于本文涉及的是程序化网页的格式化，它将只使用划分以将混淆降到最低。\n\
    \n# 网页编程：\n\n程序 77 - 将页头部分为 3 个划分。\n\n此代码仅划分了页头部，以便 DOM 知道它们是头部内部 3 个独立的区域。DOM\
    \ 并不知道如何显示它们，因此将它们放置在单独的块中，如下所示。\n\n![](img/ce60a0a8b4160fc893a11ed149173e93_78_0.png)\n\
    \n图 9 - 未样化的 div 部分\n\n为了让这些划分按预期工作，必须对它们设置样式。\n\n要为每个划分设置样式，必须提供引用它们的方法。如果有多个划分需要样式，通常会在\
    \ CSS 中定义一个类变量，并在标签中使用 class 属性进行引用。如果对某个划分进行唯一的样式设置，则将给它分配一个 id 属性，CSS 将使用 id\
    \ 变量引用它。由于头部中的划分对于该头部来说是唯一的，因此将使用 id 变量来引用并设置样式。注意上面的程序，各个划分已被分配了如 header-icon、header-menu\
    \ 等名称。这符合倾向于连字符命名的 CSS 规范。\n\n在 CSS 中引用 id 时，名称前要加上哈希标记 (#)。例如，要将 header-desc\
    \ 设置为 inline-block 显示，将使用以下代码。\n\n```css\n#header-desc {\n  display : inline-block;\n\
    \  margin : 25px;\n}\n```\n\n细心的读者会记得，在 jQuery 中引用了 id 变量。jQuery 使用 CSS 命名规范来访问\
    \ DOM 元素。这一点之前提到过，但现在被明确了。因此，要使用 jQuery，至少需要具备 CSS 基础知识以知道如何访问 DOM 元素。\n\n这些头部划分的\
    \ CSS 的主要目的是为它们设置显示参数。选择 inline-block 是为了告诉 DOM 将这些划分作为块布局，在同一行上一个接一个地排列。margin\
    \ 告诉 DOM 如何在元素之间留空。\n\n# 网页编程：\n\n页头部划分中设置的最后一个属性是 float 属性。float 属性定义了将元素放置在行的哪一侧。通常\
    \ inline 和 inline-block 元素从最左侧开始，并从左到右一个一个排列。通过说 float: right，程序表示该元素从右侧开始，然后让随后的元素从右向左移动。菜单项通常位于页头的右侧，以平衡页头部。\n\
