    This section will describe how to send a transaction using JavaScript from a web\
    \ browser to the server.\n\n# Chapter 7.3.1 Sending a transaction to the server\n\
    \nThere are 4 steps involved in writing a program to send a transaction to the\
    \ server from JavaScript:\n\n+   1. An HTTP object is created, and the proper\
    \ values set in that object.\n2. A callback function (or listener) is set to receive\
    \ the data back from the server\n3. The request is sent asynchronously to the\
    \ server.\n4. The server will process the request, sending back (multiple) responses\
    \ as it proceeds. Once the request has completed, the server will send back a\
    \ ready state of 4 and a status code categorizing the result of the transaction.\n\
    \nThese 4 steps are shown in the JavaScript program that sends a request for an\
    \ array of JSON map objects. This code should be placed in a file named \"ReadMaps.html\"\
    \ in the assets directory of your Sails application, and can be accessed using\
    \ the URL http://localhost:1337/ReadMaps.html.\n\n```\n<script>\nlet xmlhttp =\
    \ new XMLHttpRequest();\nxmlhttp.open(\"GET\",\"mapdata\",true);\nxmlhttp.setRequestHeader(\"\
    Content-Type\", \"application/json\");\nxmlhttp.onreadystatechange = function\
    \ () {\n  console.log(\"State = \" + xmlhttp.readyState + \\\n and status = \"\
    \ + xmlhttp.status);\n  if (xmlhttp.readyState === 4) {\n    console.log(\"State\
