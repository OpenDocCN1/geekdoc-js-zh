    Metadata is what it names, data about the data on a web page. It defines how the
    page is to interpret the data it will process. For example, functions are used
    in a web page are defined in the head. How to handle and interpret the CSS tags
    are also defined in the head. Anything that is used to define the behavior of
    the page is in the head of the document.


    As important as what is in the head is what is not in the head of the HTML document.
    The head should not output any information (or data) to be placed on the web page.
