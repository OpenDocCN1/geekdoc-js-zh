    \ JSON 对象。该 JSON 对象被赋值为 `objA`，它拥有 `mapA` 的所有字段，但它不是 Map 对象，且没有定义 `print` 方法。然后将\
    \ `objA` 对象传递给 Map 构造函数，将其属性复制到新的 `mapB` 对象中。随后就可以在 `mapB` 对象上调用 `print` 方法了。\n\
    \n```javascript\n<script>\nfunction Map(options) {\n  // 设置默认值\n  this.title =\
    \ \"MyMap\";\n  this.resize = false;\n  this.recenter = true;\n  this.center =\
    \ [-77, 39];\n\n  // 从 options 加载值\n  for (let prop in options) {\n    // 该属性没有默认值\n\
