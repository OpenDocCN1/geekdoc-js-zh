    # 网页编程


    针对高年级本科的建议 14 周课程安排如下：


    | 周次 | 章节 | 主题 |

    |---|---|---|

    | 1-3 周 | 2, 3 | 基础 HTML 以及使用 HTML 处理定义表单。HTML 中的表单处理：<br>1. 过程化编程、判断与循环<br>2.
    函数<br>3. 事件<br>4. Onload 事件到事件监听器<br>5. 非侵入式 JavaScript<br>6. 立即调用函数表达式 (IIFE)<br>7.
    查询<br>8. 表单处理<br>9 Lambda 函数与函数式编程 |

    | 4-6 周 | 4, 5 | CSS JavaScript 对象：<br>1. JSON<br>2. 构造函数<br>3. 原型<br>4. 函数与闭包<br>5.
    JavaScript 中的面向对象模型 |

    | 7-9 周 | 6 | CRUD 接口<br>1. 设计接口<br>2. 设计数据对象<br>3. 实现一个简单的 CRUD 接口<br>4. 本地存储持久化<br>使用服务器的持久化存储<br>1.
    Node.js<br>2. Sails<br>3. REST<br>4. HTTP 请求 |

    | 10-14 周 | 7 | 使用 Open Layers 的地图应用<br>小组项目或个人项目 |


    这本书目前已基本完成。最后一章的最后一部分大部分是使用持久化存储的地图应用程序代码，并没有对应用进行大量的讨论。然而，我需要为课程整理出这些文字，而且在学期内可能不会有大量时间来完善它。我认为其余的内容已经足够发布了。


    我计划对该书进行多项补充。这些包括更多对 ECMA6+ 概念的使用（我认为这些很有用：模块、箭头函数等），使用非结构化数据的地图应用扩展，以及包含更多服务器端功能，包括连接
    MongoDB 的 NoSQL 能力以及可能在 MySQL 中的 JSON。


