    # PROGRAMMING FOR THE WEB:


    To understand unstructured data, an example will be given that occurs when working
    with maps. On a map there can be various features, which can be thought of as
    markers on a google map. These features have standard properties, such as position,
    title, marker style, and description, and these properties can be stored in a
    structured format as a tuple (record) in a relational database.


    Now consider a real application, a example of the monuments on the Gettysburg
    Battlefield (http://chuckann.com/Monuments/Monuments.html). In this map variety
    features are placed on the map. These features represent many types of monuments.
    Some features are genuine monumental and/may not be associated with states. Some
    features are monuments to people who fought at Gettysburg, and could be associated
    with a person, but could also be associated with a state or regiment. Some monuments
    are buildings, and could be associated with person, or a regiment, or a part of
    the battlefield.


    To make the situation even harder, the application should not define what are
    valid associations when the application is written. If a new association type,
    such as casualty percentage, is to be added to some of the features in the future,
    this data would be stored and easily searched.


    While this type of design might not be a common problem, it is not uncommon. Probably
    the reason it is not more common because programmers are always inventing work
    around handle the problems, and most work around using relational databases poor
    hacks.


    However, using unstructured data (e.g. a JSON type format), this problem of unstructured
    information and relationships does not exist. Because all objects are just property
    maps, it is possible to add attributes of any type to any object.


    One important aspect of learning JavaScript and its object definition is that
    it often requires the program to look at object-oriented design in a completely
    new and different manner, increasing the tools they have to solve problems.


    # Chapter 5.9 Conclusion


    I hope that after reading this chapter, the reader is convinced that JavaScript
    is not Java/C# or any other class-based OOP language they have used. I hope that
    they have either decided it is too weird to ever make sense the metaphors and
    models they have used in the past with these languages, and started to understand
    JavaScript for what it is, what it is not.


