    \n## 第 7.1.3 章 安装 Sails\n\n在实现 Web 服务器应用程序时，大多数程序员选择从一个框架开始。这些框架提供了系统的标准视图，就如许多实现应用程序基础实现的工具一样多。稍后我们将看到基础应用程序开发可以有多简单。\n\
    \nWeb 框架通常分为三大类：模型-视图-控制器（MVC）、表现层状态转换（REST）和全栈。在 MVC 内部，有两种类型的框架，它们都源自 Ruby。这些框架中的每一个都有该基础方案的实现，要查看这些框架的实现，只需访问\
    \ Node.js 站点 http://nodejsframework.com/。\n\n尝试详细解释这些框架中的任何一个，更不用说全部，那都是一整本书的任务，因此框架的细节、优缺点等将不会被涵盖。本文将选择一个框架——Sails，并简单地使用它来为我们的\
    \ CRUD 应用创建持久化存储。\n\nSails 是一个类似 Rails 的 MVC 框架，旨在允许服务器应用程序的标准实现。选择 Sails 仅仅是因为作者过去使用过\
    \ Rails，而且在本书编写时，Sails 是下载次数最多的类 Rails 框架之一。\n\n要安装 Sails，将使用 npm。在 DOS 命令行提示符处，输入\n\
    \n```\nnpm install -g sails\n```\n\n此命令告诉 npm 安装 sails 包，并使其对所有用户全局可用。当完成后，你可以通过输入\
    \ \"sails -v\" 来测试 sails 是否已安装。你应该得到一个描述你已安装的 Sails 版本的字符串。\n\n## 第 7.1.4 章实现你的\
    \ Sails\n\n现在 Sails 已经安装，就可以编写一个应用程序来将 CRUD 应用的数据存储在服务器上。开始之前，我建议在计算机的合适位置创建一个\
    \ Sails 目录，并在该目录下创建你所有的应用程序。\n\n切换目录 (cd) 到你的 Sails 应用目录并输入以下命令：\n\n```\nsails\
    \ new MapData\n```\n\n选择选项 2，一个空 sails 应用程序。选项 1 提供了一个完整的基础框架，带有身份验证、用户管理，甚至有信用卡处理功能，而你将来会选择选项\
