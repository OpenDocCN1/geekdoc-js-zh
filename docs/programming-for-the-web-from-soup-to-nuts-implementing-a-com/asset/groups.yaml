    \ JavaScript 范式的基础：立即调用函数表达式 (IIFE)。\n\n## 第 3.3.4 章 jQuery ready 函数\n\njQuery\
    \ 是一个提供了许多 JavaScript 编程中用函数的库。本文将大量使用 jQuery。这是因为 jQuery 提供了许多实用的功能。此外，互联网上的许多\
    \ JavaScript 编程示例都使用了它，由于 jQuery 的基本概念，很难阅读网页上的 JavaScript 示例。\n\n要使用 jQuery，在使用任何\
    \ jQuery 函数之前，应在 HTML 文档的头部包含以下行。此行包含了 jQuery 库，并允许 HTML 文档访问所有 jQuery 功能。它必须在任何使用\
    \ jQuery 的库之前包含。\n\n```html\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js\"\
    ></script>\n```\n\n一旦初始化，jQuery 语句格式化为 `${identifier}`。在该语句中，`$` 是 `jquery` 函数的缩写，只是\
    \ `$jquery(identifier)` 的简写。\n\n标识符可以是许多不同 HTML 元素之一，例如 CSS 选择器、JavaScript 元素、元素数组、对象或其他类型的元素。jQuery\
    \ 将查看请求的元素以及将为该类型执行正确操作的函数。\n\n在本节中，将仅涵盖添加按钮 `onClick` 事件所需的 jQuery 选项。这将分步完成。第一步是在\
