    The problem is based in human nature. When approaching a new concept that appears
    similar to another concept they already know, people seem to be hardwired to try
    and understand the new concept by creating a metaphor of the old concept works
    and trying to apply it to the new concept. If the metaphor fails, many people
    will simply give up on understanding a new and perfectly valid concept, saying
    it doesn''t make sense. The new concept isn''t wrong, the metaphor used to understand
    it is wrong³¹.


    I personally am convinced that this is why most people find STEM disciplines so
    hard. The concepts and ideas in the Liberal Arts and Social Sciences are pretty
    malleable, and even an incorrect metaphor can be twisted and combined with a twisted
    version of the concept to create a metaphor that sort-of stacks works as explanation
    of the concept. But in truth the metaphor and the understand are actually invalid.


    In STEM, concepts and ideas are much less forgiving, and mean exactly what they
    mean. Concepts cannot be twisted to fit an incorrect metaphor. STEM forces people
    to give up incorrect metaphors and adopt new metaphors; a very difficult task.


    To better understand what a metaphor is, and why they have to be understood carefully,
    consider a very common metaphor in CS, that of a data structure and a cafeteria
    tray dispenser, such as the one shown in the figure below.


    ![](img/ce60a0a8b4160fc893a11ed149173e93_93_0.png)


