    \n此请求目前没有继承任何辅助函数。将其保存到集合（collection）中以使用父级辅助函数。\n\n```json\n{\n  \"created\"\
    : \"1534775809692\",\n  \"updated\": \"1534775809692\",\n  \"id\": 1,\n  \"title\"\
    : \"map1\",\n  \"resize\": true,\n  \"recenter\": true,\n  \"maptype\": \"Stamen\"\
    ,\n  \"screenSize\": \"1024x768\"\n}\n```\n（注：由于原文中 JSON 块未闭合，我将保持原样不翻译。）\n\n\
