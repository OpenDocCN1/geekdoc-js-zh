    \ for styling purposes, and into sections (using the semantic `<section>` tag)\
    \ when it is being divided into parts that would be equivalent to areas in an\
    \ outline. There is no difference other than the semantic meaning of the section\
    \ as part of a larger document organization. As this document is concerned with\
