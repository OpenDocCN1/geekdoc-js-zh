    # PROGRAMMING FOR THE WEB:


    Program 109 – Library functions for the CRUD application


    # Chapter 6.1.5 Application behavior – events


    Many readers will come to this book having had a minimum of programming experience,
    and often that experience is with a program that begins with a main method from
    which all actions in the program emanate. The program works in a top-down manner,
    where all actions are of tree rooted in the main method.


    The programming model presented here uses a very different model of programming
    that we will call Event Based Programming (EBP). EBO is very different from procedural.
    First, there is no main in the program that is the parent of all actions in the
    program. Functions are triggered (or execution called) as asynchronous events,
    in our case as actions from the user. The system then runs code to respond to
    that event, returning the program to some known, safe state from which it can
    respond to other events.


    In the application this, events are generated by the user when a button is pressed.
    The pressing of the button creates an event that calls a function associated with
    that button.


    Unlike the design of a procedural program, which proceeds in a top down manner,
    EBP sets up the framework for the program, and then defines functions for each
    of the behaviors (or buttons presses) in this application.


    To design the program a table is created to explain the behavior to respond to
    each button press. The following figure shows the buttons that need to be created
    for this application. This is translated into a table where each button is assigned
    an id, and a column is created to outline the behavior for each button.


    Note that one of the buttons in the diagram, the save button in Panel 2, is special
    in that it will be implemented as two separate buttons. The reason is that the
    save button is context sensitive; it will call one function when the user is creating
    a date, and another function when the user is doing an update. This will be implemented
    as two separate buttons having different ids but the same values. It will appear
    to the user that the button is a Save button but depending on the context the
    button will be different.


    There is one other issue. A message box is provided to give feedback to the user.
    Each button will have zero, one, more messages that they can provide.'
