    \ = getFrom(ml.stringify());\nconsole.log(m2.toString());\n\n</script>\n```\n\n\
    Program 105 - Object example with encapsulation and data hiding\n\n## Chapter\
    \ 5.8 Unstructured Data\n\nBefore leaving the topic of objects, there is a concept\
    \ that doesn't seem to make sense to most programmers, and is unstructured data.\
    \ This is probably most of the CS industry is built around structure data³⁹ Data\
    \ in a relational database is structured into tuples and relations. Data in OOP\
    \ is built into classes and instances. When unstructured data is encountered,\
    \ programmers go to great lengths to build work around, none of which seem to\
    \ work⁴⁰ The author has seen many of these problems and has yet to see a good\
    \ solution in a relational database.\n\n³⁹ For more information about unstructured\
    \ data, see about NoSQL database, such as https://www.youtube.com/watch?v=qI1g07C_Q5I\n\
    \n⁴⁰ http://blogs.tedward.com/post/the-vietnam-of-computer-science/\n"
  mdcn: "\n\n## Web 时代编程：\n\n- 1. 定义了构造函数（Constructor Function），它将接收一个参数，该参数是一个包含并设置在此对象中的属性的\
    \ options 对象。\n- 2. 将 _cfName 赋值为该对象中构造函数的名称。这样做是为了当对象丢失其构造函数时（例如被写入后又从 JSON 数据源读取），对象可以被重新构建。\n\
    - 3. 在构造函数中为该 `this` 对象定义了默认值。\n- 4. 传递到构造函数的所有属性都将移动到 options 对象中的属性中，包括那些没有默认值的属性。其原因将在本章的“非结构化数据”部分进行解释。\n\
    - 5. 所有作用于此对象的方法将定义在该构造函数的原型对象（prototype object）中。这些原型函数将在构造函数执行完成后定义。调用原型函数时会传入一个对象，因此可以使用\
    \ `this` 变量来访问相应的对象。\n\n下面展示了使用此定义实现 Map 对象的示例。\n\n```javascript\n<script>\nfunction\
    \ Map(options) {\n  // Set Defaults\n  cfName = \"Map\"\n  this.title = \"Please\
    \ change the title\"\n  this.recenter = true;\n  this.center = [-77, 32];\n\n\
    \  // Get properties from parameter\n  outerloop:\n  for (i in options) {\n  \
    \  for (j in this) {\n      if (i == j) {\n        this[i] = options[j];\n   \
    \     continue outerloop;\n      }\n    }\n    console.log(\"Property \" + i +\
    \ \" is not a default Map property\");\n    this[i] = options[i];\n  }\n}\n\n\
    \  // Set accessor function\nMap.prototype.setTitle = function (title) {\n  this.title\
    \ = title;\n}\nMap.prototype.getTitle = function () {\n  return this.title;\n\
    }\n\nMap.prototype.setRecenter = function (recenter) {\n  this.recenter = recenter;\n\
    }\nMap.prototype.getRecenter = function () {\n  return this.recenter;\n}\n</script>\n\
    ```\n\n```javascript\nMap.prototype.center = function (center) {\nthis.center\
    \ = center;\n}\nMap.prototype.getCenter = function () {\nreturn this.center;\n\
    }\n\n// Set to toString function\nMap.prototype.toString = function () {\n  return\
    \ (\"title: \" + this.title\n  + \" recenter: \" + center:\" + this.center);\n\
    }\n\nvar ml = new Map(\"newMap\")\nconsole.log(ml.getTitle());\n\nml.title = \"\
    This breaks encapsulation\"\nconsole.log(ml.getTitle());\n```\n\n```javascript\n\
    </script>\n```\n\n程序 104 - Map 对象定义\n\n这种对象定义的唯一问题是破坏了封装和信息隐藏。如上面的示例所示，程序员通过说\
    \ `ml.title = \"This breaks encapsulation\"` 来设置 `ml` 的值；程序员可以直接访问 `title` 属性，而无需使用\
    \ `setTitle` 和 `getTitle` 方法。\n\n接下来的对象模型使用函数变量和闭包（closures）增加了封装性。包含此模型是为了展示展示如何在\
    \ JavaScript 中使用闭包，但它不是一个标准的对象模型，不应用于生产环境程序。\n\n## 5.7 章 包含封装和数据隐藏的 JavaScript\
    \ 对象模型\n\n上一节中对象模型的问题在于，构建的对象被返回到了主程序，其中它的所有属性都是可见的。这就是为什么封装原则被破坏了。防止对象泄漏的最简单方法是不要通过\
    \ `this` 定义对象，而是通过一个函数变量来定义。变量的作用域仅限于函数内部，这在实际上使得对象本身变成了私有的。\n\n为了实现这个新对象，需要对上一节的策略进行微调。首先，构造函数将不再构建此对象，而是创建一个函数局部变量，并在该局部变量内部构建对象。由于对象是一个局部变量，无法在构造函数（即外部函数）之外访问，因此需要定义可以访问对象属性的内部函数。\n\
    \n注意，对象仍然希望使用原型函数，这样只需要定义一个函数的实例，但这些原型函数必须移动位置，使其它们成为构造函数的内部函数。这使得原型函数可以访问外部函数中定义的变量。\n\
    \n创建此类对象的策略如下：\n\n- 1. 定义了构造函数，它将接收一个参数，该参数是一个包含并设置在此对象中的属性的 options 对象。\n- 2.\
    \ 定义了一个类型为 object、名为 `_properties` 的函数局部变量。\n- 3. 将 `_cfName` 变量赋值为 `_properties`\
    \ 对象中构造函数的名称。这样做是为了当对象丢失其构造函数时（例如被写入后又从 JSON 数据源读取），对象可以被重新构建。\n- 4. 默认将在 `_properties`\
    \ 对象中定义。\n- 5. 定义到构造函数的所有属性都将移动到新构建的 `_properties` 对象中。这些属性将包括 options 对象中的所有属性，包括那些没有默认值的属性。其原因在本章稍后的“非结构化数据”部分进行解释。\n\
    - 6. 所有作用于此对象的方法将包含在该构造函数的原型对象中。这些原型函数定义在构造函数内部，因此它们可以访问函数局部变量。\n- 7. 需要定义一个 `stringify`\
    \ 方法，允许对象 (`__properties`) 转换为字符串。\n\n下面展示了使用此定义 Map 对象的示例。\n\n```javascript\n\
    <script>\nfunction Map(options) {\n  // Set Defaults\n  let __properties = new\
    \ Object();\n  __properties.title = \"Please change the title\";\n  __properties.recenter\
    \ = true;\n  __properties.center = [-77, 32];\n  __properties._cfName = \"Map\"\
    ;\n\n  // Get properties from parameter\n  outerloop:\n  for (i in options) {\n\
    \    for (j in __properties) {\n      if (i == j) {\n        __properties[i] =\
    \ options[j];\n        continue outerloop;\n      }\n    }\n    console.log(\"\
    Property \" + i + \" is not a default Map property\");\n    __properties[i] =\
    \ options[i];\n  }\n}\n\n  // Set accessor function\nMap.prototype.setTitle =\
    \ function (title) {\n    __properties.title = title;\n  }\nMap.prototype.getTitle\
    \ = function () {\n    return __properties.title;\n  }\n\nMap.prototype.setRecenter\
    \ = function (recenter) {\n  __properties.recenter = recenter;\n  }\nMap.prototype.getRecenter\
    \ = function () {\n  return __properties.recenter;\n  }\n\nMap.prototype.center\
    \ = function (center) {\n  __properties.center = center;\n}\nMap.prototype.getCenter\
    \ = function () {\n  return __properties.center;\n}\n\n// Set to toString function\n\
    Map.prototype.stringify = function () {\n  return JSON.stringify(__properties);\n\
    }\n\nMap.prototype.toString = function () {\n  return (\"title: \" + __properties.title\n\
    \    + \" recenter: \" + __properties.recenter\n    + \" center:\" + __properties.center);\n\
    } //End of Constructor Function\n\nfunction getFrom(string) {\n  let parsedObject\
    \ = JSON.parse(string);\n  let cf = parsedObject[\"__cfName\"];\n  return new\
    \ window(cf)(parsedObject);\n}\n\nlet ml = new Map({title:\"newMap\"});\nlet m2\
    \ = getFrom(ml.stringify());\nconsole.log(m2.toString());\n\n</script>\n```\n\n\
    程序 105 - 带有封装和数据隐藏的对象示例\n\n## 5.8 章 非结构化数据\n\n离开对象主题之前，有一个大多数程序员无法理解的概念，即非结构化数据。这可能是整个计算机行业围绕结构化数据构建的³⁹\
    \ 关系数据库中的数据被结构化元组和关系。OOP 中的数据被构建为类和实例。当遇到非结构化数据时，程序员会费力构建绕过方案，但这些方案似乎都没有作用⁴⁰ 作者见过许多此类问题，且尚未在关系数据库中看到良好的解决方案。\n\
    \n³⁹ 有关非结构化数据的更多信息，请参见 NoSQL 数据库，例如 https://www.youtube.com/watch?v=qI1g07C_Q5I\n\
    \n⁴⁰ http://blogs.tedward.com/post/the-vietnam-of-computer-science/\n"
