    \nxmlhttp.send();\n</script>\n```\n\nProgram 114 – XMLHttpRequest example\n\n\
    The following will explain each part of the transaction.\n\n+   1. An object variable,\
    \ in this case named xmlhttp, is created by the constructor function XMLHttpRequest.\
    \ This object will be used to build the request to be sent to the server.\n\n\
    > There is a synchronous version that can be used to send the transactions to\
    \ the server and the synchronous version does not require the callbacks and raises\
    \ the issues involved in processing the asynchronous version. However, using the\
    \ asynchronous version will tie up the browser so that the user cannot interact\
    \ with the browser until the request has finished. It is highly recommended that\
    \ the synchronous version never be used, and it has been deprecated in most of\
    \ the major libraries."
