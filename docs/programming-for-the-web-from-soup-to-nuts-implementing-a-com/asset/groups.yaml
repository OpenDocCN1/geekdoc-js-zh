    \ Function to reconstruct a JSON object\n\n## Section 5.4.4 Abstracting behavior\
    \ and prototypes\n\nThis chapter so far has emphasized that the functions that\
    \ are part of an object are copied into the property map of every object. While\
    \ storing these functions as data with each object allows for exceptions in which\
    \ specific objects can have behavior that is different for special instances of\
    \ the object, it is obviously inefficient. What is needed is a way to store the\
    \ functions once and when they are accessed by all the objects constructed by\
    \ a single Constructor Function.\n\nThis functionality should be implemented in\
    \ a consistent way with the JavaScript language works, this means using property\
    \ maps (not class-based templates). A simple solution is to have Constructor Functions\
    \ have a special property map associated with the function, and then have a link\
    \ to the Constructor Function's property map stored with each object to share\
    \ properties across multiple objects. Then when a property, such as a function,\
    \ is requested for an object, the object's property map is searched for this property.\
    \ If the property or function is not found in the object's property map, the shared\
    \ property map for the Constructor Function can then be searched. Multiple shared\
    \ property Maps can exist, and they can each be recursively searched in turn until\
    \ the property is found, or the end of the shared property maps is reached. This\
    \ is shown in the Figure 16.\n\n![](img/ce60a0a8b4160fc893a11ed149173e93_108_0.png)\n\
    \nFigure 16 - Recursive search for property in linked property maps\n\nThis recursive\
    \ shared property map concept is implemented in JavaScript and is called prototypes.\n\
    \n## 107 PROGRAMMING FOR THE WEB:\n\nEvery function, not just Constructor functions,\
    \ has associated with it a prototype. To see how this is used, the `new` operator\
    \ is invoked, it does two things:\n\n1. First sets the left-hand (lhs) of `this`\
