    \ in the HTML source file?\n- 10. What do you think the &lt; and &gt; symbols\
    \ do? What other symbols do you think are specified this way in HTML.\n\n## Chapter\
    \ 2.4 Creating Forms in HTML\n\nThe next part of this chapter will show how to\
    \ implement form elements in HTML. Form elements are things like labels, checkboxes,\
    \ radio buttons, textboxes, buttons and other elements often use to interact with\
    \ and gather information from users. Form elements are a major method of creating\
    \ user interaction with a web page.\n\nAll form elements contain a name or id\
