    # PROGRAMMING FOR THE WEB:


    # Forward


    This book is designed to be used as a class text but should be easily accessible
    to programmers interested in Web Programming. It should even be accessible to
    an advanced hobbyist.


    The original goal behind this text was to help students do research with in Web
    based mapping applications, generally using Open Layers. The idea was to provide
    persistent storage using REST and simple http request from store the data on a
    server.


    When teaching this class, I became painfully aware of how just little students
    know about Web Programming. They did not know how to format a REST request as
    a URL, or the methods that could be used when sending the requests to be processed.
    Once again, they did not know that REST used URLs, or that there were different
    request types in URL.


    Most could not tell me what the server was, or how it worked. Even fewer could
    tell me the different types of services (e.g. Rails JavaScript, Sinatra Type,
    EJB, etc.), or what types of services they offered. They did not know how to access
    the server through a simple HTML api as Postman.


    Many did not know HTML, and a lot of those knew something about HTML knew little
    beyond how to format on a web page. There was very little JavaScript knowledge
    in the web, and most had not even heard of libraries as JQuery, Vue, or Bootstrap.


    These were all junior and senior computer students, and the types of positions
    many of them were interviewing for require this type of knowledge. Yes, they could
    learn it on the job. And this is not the fundamental skills that CS believe students
    should learn. But there is a lot of good fundamental material to be found in Web
    Programming, and I have a lot of good feedback from students who have graduated
    or done an internship where they state even if they do not use all of this material,
    it is nice to be able to understand what others in the class are talking about.


    Because of the experience with the REST interface, I petitioned the CS department
    of one of the schools I was an adjunct at to offer a class in Web Programming.
    This book is the result of having taught that class 3 times at different schools.
    Its purpose is to provide an overview of how to program for the web. It is still
    largely client side, but that is something I hope to address in a future version
    of the textbook


    This material is ubiquitous in industry, and I believe that there is utility in
    being able to communicate with others about 5-10 years'' experience seeing all
    of the various pieces of a full stack application for the Web. The book is written
    to try to be technology agnostic as possible, trying to emphasize concepts over
    implementations.


    This book is also designed to help students understand how to use Web Programming
    with interfaces and libraries such as Open Layers, which is a mapping interface
    that can be run on a Web Browser.


    This book can be used as the main text for a class in Web Programming. It is not
    intended to be used as the only source of material in such a class, but as a guide
    to the class. Most of the material can be easily supplemented by information on
    the Web.'
