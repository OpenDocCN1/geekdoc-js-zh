    \ and can be used as a Functional language. Functional programming is often a\
    \ source of confusion to novices just getting to JavaScript. In addition, arrays\
    \ are not primitive data structures, where elements are accessed using a base\
    \ address and index. In JavaScript, arrays are hash maps, and the index numbers\
    \ are actually keys. This making access of elements in an array seem strange or\
    \ almost wrong to some programmers. Finally, JavaScript dynamic typing goes against\
    \ everything most programmers learned in their first programming class, where\
    \ all types are statically typed.\n\nBut perhaps the strangest concept in JavaScript\
