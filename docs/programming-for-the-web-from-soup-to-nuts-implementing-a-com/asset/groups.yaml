    Associated with the list box of map records are the buttons Create, Read, Update,
    and Delete. These buttons will read the current record highlighted in the list
    box and run the appropriate operation on map object.


    There are a second set of buttons which are program options, they are Save to
    File, and Read from File. The save to file button will write the array to persistent
    store using a JSON format. The read from file will read a persistent store previously
    written and parse the JSON to restore a semantically identical copy of the data
