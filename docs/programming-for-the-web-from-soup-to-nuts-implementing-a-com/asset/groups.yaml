    \ get）是默认请求。\n\nPostman 允许我们轻松地开发和测试 REST 服务器应用程序。这在 Post Postman 的背景下可能体现得最好，因此以下是使用\
    \ Postman 展示的应用程序生命周期。\n\n第一步，让 Postman 能够连接服务器，已经在上一节中完成。接下来应该向服务器添加数据。这是通过使用相同\
    \ URL 的 POST 方法完成的。在发送 POST 请求时，注意可以通过点击 Body（主体）按钮来包含 POST 请求的主体。点击该按钮并在请求主体中包含以下\
    \ JSON 对象，如图所示。\n\n```json\n{\n  \"title\": \"map1\",\n  \"resize\": \"true\"\
    ,\n  \"recent\": \"true\",\n  \"mapType\": \"Stamen\",\n  \"mapSize\": \"1024x768\"\
    ,\n  \"latitude\": \"-75\",\n  \"longitude\": \"45\"\n}\n```\n\n程序 113 – 用于 Postman\
    \ POST 请求的输入对象\n\n当请求此内容时，服务器会返回状态码 200，表示请求成功。它还会返回一个存储在数据库中的对象副本。请注意，包含的但不属于原始请求的字段是由\
    \ Sails 添加的。这些字段是 createdAt、updatedAt 和 id。重要的字段是 id，它将是该记录在持久化存储中的主键。此主键将用于后续读取/更新/删除此记录的查询。\n\
    \n再添加 2 条记录，在 Postman 主体中至少更改 title，这样你就知道已经保存了 3 条不同的记录。\n\n![](img/ce60a0a8b4160fc893a11ed149173e93_154_0.png)\n\
    \n图 24 – Postman POST 请求请求服务器上的新对象\n\n## 7.2.3 节 获取数据\n\n现在检索所有放在 Node.js 服务器中的记录，并在\
