    \ 4 种类型的选择器²26。它们是：\n\n- 1. 元素选择器，例如 `<header>` 和 `<p>` 标签。\n- 2. 类选择器，适用于一组项目项目。类选择器以\
    \ `.` 开头，例如 `.header-icon` 或 `.header-desc`，并在元素标签中使用 `class=.header-desc` 语法进行引用。\n\
    \n> ²25 CSS 也可以通过 HTML 标签中的 `style` 属性来实现，但这违背了网页中关注点分离的思想，类似于侵入式 JavaScript，最佳实践建议不要将\
    \ CSS 和 HTML 混合。\n²26 有关所有选择器的完整列表及其使用方法，请参见 https://www.w3schools.com/cssref/css_selectors.asp。\n\
    \nID 选择器，通过其唯一的 id 应用于单个元素。ID 选择器以 `#` 开头，例如 `\"#inputForm\"`。标签中的 `id` 属性用于引用该选择器。\n\
    \n属性选择器，适用于标签的属性。例如，为了让所有只读（readonly）的文本框变为灰色背景，可以使用以下显示属性标签：\n\n```\n<style>\n\
    input:read-only {\n  background-color: lightgray;\n}\n</style>\n```\n\n程序 71 –\
    \ 属性选择器\n\n此属性告知 CSS 应用任何具有 `read-only` 属性的 `input` 标签，并将背景颜色设置为灰色。\n\n这些选择器将在后续“如何显示输入表单”章节中结合文中详细解释。\n\
    \n显示属性（或属性）允许程序员描述稍后与标签关联的信息显示方式。属性包括字体（font）、背景颜色（background-color）、边框（border\
    \ box）、缩进（indentation）以及大量其他属性。可设置的属性完整列表请见：https://developer.mozilla.org/en-US/docs/Web/CSS/Reference。\n\
    \n## 4.1.2 语义化标签\n\n`<header>` 是一个元素选择器。它也被称为语义化标签。\n\n语义化标签旨在提供格式信息，但对网页上的信息或结构具有含义。为了更好地理解语义化标签，请考虑\
    \ HTML 中一些已废用的标签。例如，`<b>`（加粗）标签告诉我们哪些文本需要加粗（对文本进行什么操作）。而 `<strong>` 标签描述文本是重要的，并通过归一化将文本恢复为正常。同样，`<i>`（斜体）标签已废弃，改为由\
    \ `<em>`（强调）标签取代。在这两个例子中，新标签表达的是关于文本的含义，而不是对文本进行的操作。\n\n`<header>` 描述的是语义信息，`<header>`\
    \ 和 `</header>` 之间的内容是页面的特定部分（页头），而不是页面上的某个随机划分。页头是页面顶部的区块，与其关联的信息专门关于如何格式化文档的页头。\n\
    \n## 4.1.3 设置页头区块\n\n文档的页头是显示在网页顶部的部分。定义页头显示方式的属性在定义 `<header>` 标签时作为属性设置。`<header>`\
    \ 标签的默认设置在 CSS 中。\n\n```\n<style>\nheader {\n  display: block;\n}\n</style>\n\
    ```\n\n程序 72 – 页头定义\n\n默认的 `<header>` 标签仅包含一个属性 `display:block`，它指定页头作为一个区块位于文档顶部。在\
    \ CSS 中，`block` 属性创建一个从元素左边距到右边距的空间，不允许其他元素显示在其左侧或右侧。这是页头的正常行为，它通常跨越页面顶部的长度。像任何显示属性一样，如有需要可以被覆盖。\n\
    \n本章开发的示例页面页头将在下面的子章节中分阶段构建。\n\n## 4.1.4 修改背景色和文本颜色\n\n第一个属性是更改框以改变背景色和文本颜色……（此处由于原文出现大量重复错误码，已进行处理）。\n\
    \n"
