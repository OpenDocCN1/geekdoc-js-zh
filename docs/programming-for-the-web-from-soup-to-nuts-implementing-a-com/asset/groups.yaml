    \ `$(document).ready()` 函数执行。`$(document).ready()` 函数类似于在 `window.onload` 事件中设置函数，在此处它们可以互换使用。\n\
    \n以下代码可向 alert 框打印消息，表示表单元素已处理。注意，元素并没有设置为要执行的函数，而是 `$(document).ready()` 在 HTML\
    \ 文件加载时被执行。这是一种处理事件语义的不同方式。JavaScript 将一个函数设置给事件变量，而 jQuery 在事件触发时调用方法。不要让这让你产生困惑，因为效果与设置事件变量相同。函数在事件触发时运行。\n\
    \n```html\n<html\n<head>\n  <title>Window onload event</title>\n  <script>\n \
