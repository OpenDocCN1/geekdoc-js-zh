    # 27 PROGRAMMING FOR THE WEB:


    There is one word of caution about many of the types that can be used as inputs.
    All of the types listed at the W3 Schools site are not implemented in all browsers,
    and many of the types are implemented differently in different browsers. Using
    some of these types (and would likely) lead to a very different user experience
    for a Chrome user or a Firefox or Safari user. The page designer should be aware
    of these differences, and plan for test carefully when implementing a web page.


    This section will only document a few input types. The ones that are selected
    are largely the ones which show how to implement interactions that are used in
    this textbook. The form implemented is one for adding maps to an application and
    will be used as an example of much of the text.


    The input types to be looked at in the following sections are text, checkbox,
    radio button, number, date, and button.


    # Chapter 2.4.3 <input type="text">


    The first type of input we will look at is type="text", or the textbox. This is
    the default type of an input tag. If you expect some other type of input, and
    a textbox, check and see if something is misspelled in the type of input tag.


    A textbox is an input box into which a user can type text, as was seen previously
    in Programs 4 and 5.


    ```

    <input type="text" id="title" size="20" />

    ```


    Program 6 – Input text box


    a created textbox that contains 20 characters, and with an attribute id of name.
    Note that the id is a unique identifier for a field; it must be unique on the
    page. In a later example the name attribute will be introduced. A field can have
    a name, id or both, and the field can be referenced by its name or id. A name
    is different from an id in that a name does not be unique on a page; many different
    elements can have the same name. In fact, in the radio button, we will rely on
    the fact that the elements have the same name. An id must be unique on a Web page.


    While HTML is not case sensitive, the strings used for the id and name are case
    sensitive. Consider the following example.


    ```

    <input type="text" id="title" size="20" />

    <input type="text" id="Title" size="20" />

    ```


    Program 7 – Text boxes different by case of name


    In this case, two textboxes with different ids, one title and the other Title,
    are created.


    The identifiers for id and name fields in this text will use camel casing for
    ids and names, with the first letter lowercase, and lower-case letters in the
    rest of the identifier except for the first letter of new words (e.g. myTitle)'
