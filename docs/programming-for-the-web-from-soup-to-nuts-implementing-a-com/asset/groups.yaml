    \ + \" is not recognized in Map\");\n    }\n  }\n  this[prop] = options[prop];\n\
    }\n\nthis.print = function () {\n  console.log(\"title = \" + this.title);\n \
    \ console.log(\"resize = \" + this.resize);\n  console.log(\"recenter = \" + this.recenter);\n\
    \  console.log(\"center = \" + this.center);\n}\n\nmapA = new Map({title:\"Map1\"\
    , center: [55,20]});\nmapA.print(); // 正常\n\nobjA = JSON.parse(JSON.stringify(mapA));\n\
    objA.print(); // 此行失败，Obj 没有 print 方法\n\nobjB = new Map(objA);\nobjB.print();\
    \ // 正常，因为 objB 是一个 Map\n</script>\n```\n\n程序 95 - 使用构造函数重构 JSON 对象\n\n## 第 5.4.4\
    \ 节 行为抽象与原型\n\n到目前为止，本章强调作为对象部分的函数会被复制到每个对象的属性映射（property map）中。虽然将这些函数作为数据存储在每个对象中允许某些特定对象针对特殊实例具有不同的行为，但这显然是低效的。我们需要一种方法，只存储一次函数，并在当由单个构造函数构建的所有对象访问它们时使用它们。\n\
    \n这种功能应该以与 JavaScript 语言工作一致的方式实现，这意味着使用属性映射（而不是基于类的模板）。一个简单的解决方案是让构造函数拥有一个与函数关联的特殊属性映射，然后在每个对象中存储一个指向构造函数属性映射的链接，以便在多个对象之间共享属性。然后，当请求对象的某个属性（如函数）时，会在对象的属性映射中搜索该属性。如果在对象的属性映射中未找到该属性或函数，则搜索构造函数的共享属性映射。可以存在多个共享属性映射，它们可以被递归地搜索，直到找到属性或到达共享属性映射的末尾。如图\
