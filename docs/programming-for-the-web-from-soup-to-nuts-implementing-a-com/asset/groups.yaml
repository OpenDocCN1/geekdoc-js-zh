    \ are familiar with.\n- 8. True or false: All operators (including the assignment\
    \ (=)) return values.\n- 9. What is short-circuiting of a logical operator? Show\
    \ how this can be used to protect a program from zero divide.\n- 10. What result\
    \ of operators returning values for condition variables if, while, or for loops.\n\
    - 11. The text said an if can have a null statement. What is a null statement?\
    \ Why is it bane to novice programmers? Why does JavaScript allow null statements?\n\
    - 12. Can a for loop have a null statement?\n- 13. Does using the comparison operator\
    \ (==) work for strings in Java/C#/\n- 14. Functions are said to have \"positional\
