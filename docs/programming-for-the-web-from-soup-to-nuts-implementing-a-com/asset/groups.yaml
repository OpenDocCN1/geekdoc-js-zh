    \nFigure 29 – Postman DELETE request to delete an object\n\n## Chapter 7.2.5 Summary\
    \ of CRUD REST server transactions\n\nThe REST transactions for a CRUD interface\
    \ are summarized in the following table.\n\n| Method | URL | Meaning |\n| ---\
