    # Web 编程：从入门到精通：使用 HTML5、CSS、JavaScript、Node.js、MongoDB 和 Open Layers 实现完整的 GIS
    网页界面。


    ## 描述

    本书设计用于课程教材，但应让对 Web 编程感兴趣的程序员能够易于获取。对于高级爱好者来说也能轻松上手。


    本书的最初目标是帮助与我一起进行基于 Web 的地图应用研究的学生，通常使用 Open Layers。其理念是使用 REST 进行持久化存储，并通过 JavaScript
    的简单 http 请求将数据存储在服务器上。


    在教授这门课时，我痛苦地意识到学生对 Web 编程的了解是何其匮乏。他们不知道如何将 REQUEST 格式化为 URL，也不知道在发送请求进行处理时可以使用哪些方法。更糟糕的是，他们不知道什么是
    REST URL，甚至不知道 URL 中有不同类型的请求。


    大多数人无法告诉我服务器是什么，或者它是如何工作的。很少有人能说出不同类型的服务器（例如 Rails 类型、Sinatra 类型、EJB 等），或者它们提供什么类型的服务。他们不知道如何通过像
    Postman 那样简单的 HTML API 访问服务器。


    许多人并不知道 HTML，而在那些懂一点的人中，除了知道如何在网页上格式化文本外也几乎无所知。课堂上的 JavaScript 知识非常匮乏，大多数人甚至没有听过
    jQuery、Vue 或 Bootstrap 等库。


    这些都是大二和大三的计算机专业学生，而且他们许多人的面试职位恰恰需要这种知识。是的，他们可以在工作中学学习。我知道这并不是许多计算机科学系教师认为学生应该学习的基础技能。Web
    编程中有很多优秀的基础材料，我也从已毕业或在实习期间的学生那里获得了许多良好的反馈，他们觉得自己没有用到所有的材料；能够理解公司里其他同事在讨论什么是非常棒的。


    由于对 REST 接口的经验，我向我兼职的一所学校的计算机系提交了申请。结果是这门课在三所不同的学校各授了三次。其目的是提供关于如何进行 Web 编程的概述。虽然目前显然仍然很空缺，但我希望在本书的未来版本中解决这个问题。


    书中的这些材料在行业内无处不在，我真的相信，在没有 5-10 年查看 Web 全栈应用各个组成部分的经验的情况下，能够与他人交流是有有用的。本书的编写尽可能做到技术无关，试图强调概念而非实现。


    本书还旨在帮助学生理解如何结合 Open Layers 等接口和库使用 Web 编程，这是一种可以在 浏览器客户端运行的地图接口。


    本书可以作为 Web 编程课程的主教材。它并不打算作为此类课程的唯一材料来源，而是作为课程指南。大部分材料可以通过 Web 上的信息进行轻松补充。


    本书可在 The Cupola：格廷斯堡学院学术成果获取：https://cupola.gettysburg.edu/oer/s


