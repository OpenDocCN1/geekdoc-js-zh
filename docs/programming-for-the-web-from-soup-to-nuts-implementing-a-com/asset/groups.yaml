  mdcn: "\n\n# 113 113 网页编程：\n\n要理解这一点，它似乎一直是最难向程序员传达的概念之一。\n\nECMA6+ 有一些非常实用的部分，其中之一就是引入\
    \ `let` 关键字。`let` 关键字允许 JavaScript 使用块级作用域（block scoping），但它使得在使用 `let` 和旧的 `var`\
    \ 关键字的程序中变得复杂，并造成了额外的困难。本文将通过始终使用 `let` 关键字来避免这些问题。虽然 JavaScript 程序员可能理解 `var`\
    \ 关键字，但其唯一理由是为了理解它如何影响使用它的其他程序。当使用 `var` 时，它会导致变量从通过 `let` 关键字实现的块级作用域变为函数级作用域（function\
    \ scoped）。如果读者遇到使用了 `var` 关键字的代码情况，有很多非常好的网站可以解释其含义。对于已经理解了文中描述的 3 种作用域类型的读者来说，这不是问题。\n\
    \n## 第 5.4.1 未声明的变量\n\n首先，JavaScript 并不要求在全局作用域中声明并创建变量。这导致了各种问题，例如变量拼写错误，或者本应在其他作用域的变量被放在了全局作用域。\n\
    \n为了避免意外拼错变量或防止程序员使用未声明的变量，JavaScript 程序可以在程序中使用 `\"use strict\"` 指令。这会导致程序在遇到未声明的变量时出错并失败。对于本书，将使用\
    \ `strict` 指令，且所有变量必须声明。未声明的变量简单来说不应该存在。因此，未声明变量的问题被一忽略不计，不再讨论。\n\n## 第 5.4.2\
    \ let 关键字\n\n`let` 关键字声明一个变量，并将该变量的作用域限制在下一个较大的程序块中，其中较大的程序块是包含在两个大括号（{}）之间的程序单元。在块内部声明的变量其作用域将仅限于该大括号所声明的块。如果变量位于任何大括号之外，它将具有全局作用域。\n\
    \n将要涵盖的第一种作用域是块级作用域。块级作用域允许变量仅存在于其定义的块中。这对于仅存在于某个块中的变量通常有用，例如 `for` 循环。下面的循环展示了\
    \ `let` 用于块级作用域的良好用法：\n\n```javascript\nfunction myFunc() {\n  for (let count\
    \ = 0; count < 10; count++) {\n    Do something\n  }\n}\n```\n\n在这里，下一个较大的程序块是\
    \ `for` 循环，因此变量只存在于循环内部，不能在外部使用。变量在进入循环块时产生，在退出循环时被销毁。这种作用域用法是大多数程序员习惯看到的。\n\n\
    下一种作用域是函数作用域，它在 JavaScript 中也称为局部作用域（local scope）。当变量在包含函数的程序块内部声明时，就会发生函数级作用域。下面的程序展示了上面的循环，但现在变量\
    \ `count` 具有函数级作用域。\n\n```javascript\nfunction func() {\n  let count = 0;\n  for\
    \ (count = 0; count < 10; count++) {\n    Do something\n  }\n}\n```\n\n在 C#/C++\
    \ 等大多数编程语言中，块作用域和函数作用域代码的区别基本上没有意义，因为它们只在函数存在时存在（例如函数在栈跟踪上）。在 Java/C#/C++ 中，函数在进入时被推入栈中，在退出时弹出。\n\
    \nJavaScript 中的函数作用域非常不同，函数变量在函数退出时不会释放。这将在“闭包”（Closure）章节中进行详细介绍。\n\nJavaScript\
    \ 的最后一种作用域是全局作用域。在任何由大括号 {} 定义的代码块之外声明的变量都是全局作用域。整个程序中只有一个全局变量的副本，就本文讨论而言，它在程序开始运行时产生，并在整个程序运行期间存在。这类似于\
    \ Java/C# 中的静态变量。下面展示了如果使用全局变量，上面的循环会是什么样子。注意，在这种情况下，每次进入函数时变量都必须重置，因为循环的上一个值仍然存储在变量中。\n\
    \n```javascript\nlet count = 0;\nfunction func() {\n  count = 0;\n  for (count\
    \ = 0; count < 10; count++) {\n    Do something\n  }\n```\n\n本节的启示是：作用域控制了变量的可可访问性以及变量定义的持续时间。块变量和函数变量仅在它们声明的块/函数中可见。块变量只在程序执行其声明所在的块时存在。函数变量持续的时间要长得多，这将在闭包章节中进行介绍。全局变量始终是可以访问的，并且始终存在。\n\
    \n本节提出的唯一奇怪想法是函数变量的生存时间，与其他语言不同，它们在函数退出时不会消失。这是下一节闭包的主题。\n\n## 第 5.3.1 闭包\n\n\
    JavaScript 的一个有趣方面是读者熟悉的多数语言（如 Java、C++、C# 等）中并不存在的：一个函数（外部函数）可以包含其他函数（内部函数）。这种程序结构产生了一个被称为闭包的有趣变量问题。程序始于这样一个事实：在外部函数作用域内的变量在内部函数中也具有作用域，如下方的程序\
    \ 96 所示。\n\n```html\n<script>\nfunction f1() {\n  let var1 = \"function scope\"\
    \n\n  function f2() {\n    console.log(var1)\n  }\n\n  f2();\n}\n</script>\n```\n\
