    <title>地图示例输入界面</title>\n<script>\nsrc=\"https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js\"\
    \n</script>\n<script>\n$(function() {\n  $(\"#processButton\").click(function()\
    \ {\n    alert(\"Be sure to check the console\");\n    // Text Boxes\n    console.log(\"\
    The center of the map is \" + $(\"#title\").prop('value'));\n    console.log(\"\
