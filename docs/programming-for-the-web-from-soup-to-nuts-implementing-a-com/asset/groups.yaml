  mdcn: "\n\n## 网页编程：\n\n本章将引入非侵入式 JavaScript（unobtrusive JavaScript）和立即调用函数表达式（IIFE），这些目前被认为是最佳实践。\n\
    \n本节将解释如何处理下方所示 HTML 表单上的数据。本子章节中的每个主题都将修改 HTML 文件的 `<head>` 部分，以展示如何处理在该节介绍的元素。读者可以复制\
