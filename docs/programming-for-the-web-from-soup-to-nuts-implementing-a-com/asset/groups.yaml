    # 89 PROGRAMMING FOR THE WEB:


    C++ multiple inheritance confusion. This is why interfaces are so successful in
    making a better object model in Java than C++. The fact remains that abstract
    types (interfaces) and classes are always statically defined in Java/C#/C++, and
    the new operator instantiates a static, final copy of the object.


    JavaScript takes the definition of an object as collection of data elements and
    behaviors, and then uses a completely different view of how data elements and
    behaviors are defined. This view is not wrong (as Java/C#/C++ programmers would
    believe), but it is at odds with the more traditional view of OOP languages. And
    until this view is understood and accepted for its own merits, it will appear
    to programmers using an invalid cognitive view of JavaScript.


    The purpose of this chapter is to explain the view of objects. It will present
    this view with no reference to the view of objects from other languages, as to
    try to bring in an understanding of how objects are treated in a language like
    Java is much more of a hindrance than a help. A reader with Object-Oriented-Programming
    background is likely at an advantage to someone who feels really grok.


    The chapter will be divided as follows:


    - Chapter 5.1 will cover the specifications for JavaScript, as defined by the
    European Manufacturers Association (ECMA) and discuss why this book is based on
    JavaScript 5 (or ECMA 5) instead of JavaScript 6 (ECMA 6+)² or higher.


    - Chapter 5.2 will describe in detail why JavaScript is hard for programmers coming
    from other languages to understand.


    - Chapter 5.3 will look at basic objects in JavaScript. The section will cover
    associative arrays and give a more correct model of what an array is in JavaScript.
    It will show how objects in JavaScript are property maps, and not instances of
    classes as in a class-based OOP. Finally, it will cover JavaScript Object Notation
    (JSON) format, which is a way to represent JavaScript objects externally.


    - Section 5.4 covers the prototype-based object model used by JavaScript. Functions
    and prototypes will be explained, and how properties are resolved in JavaScript
    will be explained. JSON will be revisited to show how a fully functioning object
    can be serialized to a string and brought back into a program as the object type
    was.


    - Section 5.5 covers JavaScript scope, and introduces JavaScript closures.


    - Section 5.6 will explain instance-based OOP languages, and how objects are implemented
    and used in these languages, so that the reader can then compare the properties
    and behaviors.


    At the end of this chapter, the reader should understand the object model that
    will be used in this text, and what will be used in the next chapter.


    ² I will use the term ECMA+ to mean versions of JavaScript that are ECMA6 or higher.


    # Chapter 5.1 Why Use ECMA 5 as a basis?


    There are many reasons to choose ECMA5 ECMA6+ as a basis for this book. The first
    is that any future implementation of JavaScript will have to have the ability
    to be transpiled into ECMA 5. All of the nifty features built into ECMA6+ are
    built on a feature in ECMA5. My personal belief is to understand a concept, the
    base on which the concept is built. If you want to program in C, you should know
    Assembly. If you want to program in Assembly, you should understand Computer Architecture
    and Computer Organization. While understanding the foundations on which ideas
    might not be necessary, there are almost always cases where not understanding
    them leads to problems that would be easily fixed if a programmer understood the
    next layer of architecture.


    The second reason for not choosing ECMA6+ is that the language is making JavaScript
    more concise, e.g. add new features to the language that make it easier to write,
    probably harder to understand, and which definitely hides details that experienced
    programmers do not need, but hinder the understanding of novice programmers trying
    to piece together how things are connected. Once a programmer has an understanding
    of the parts, conciseness and ease are nice-to-haves. But trying to learn how
    to implement a function when there are different syntactic ways to define it (using
    the function statement, arrow functions with parameters, arrow functions with
    block-scoped functions, and I am sure some others) is not mine of idea.


    The third reason for not choosing ECMA6+ is that it seems to be built with the
    ideas that programs will be written with any of those frameworks (React, Angular,
    Vue, Ember, yada, yada, yada). This is not a book about any of those frameworks
    or frameworks in general. The intent is to teach CS students principles and philosophies.
    Students can learn a framework, one of which will be relegated to legacy status
    in 5 years, after they graduate.


    However, the biggest reason for choosing ECMA5 is that this is a book about understanding
    CS principles, paradigms, and philosophies, and how to put them together to build
    a program. This means limiting the complexity of the surrounding environment and
    concentrating on the infrastructure that illustrates CS principles. The concept
    of unstructured data, as is laid out in JavaScript object representation. Object
    serialization and its realization in JSON data. Starting and retrieving this serialized
    data. Variable scoping, and specifics like function scoping that results in closures.
    Property maps and prototypes. These are areas of interest in a CS education. Syntactic
    sugar makes it easier to write programs, or to make a system more accessible to
    novice programmers, is the job of industry. I feel no place in a CS education.


    # Chapter 5.2 Is JavaScript just plain weird?


    At some point, nearly every programmer coming to JavaScript from another language
    will ask themselves the question, "Is JavaScript just plain weird?" Nothing in
    the language makes sense based on how they have learned to program, and JavaScript
    seems inconsistent and plain wrong. But let me assure you that there is nothing
    wrong with JavaScript. It is perfectly consistent and makes very good sense. JavaScript
    is just different, and at odds with unstated (probably unrecognized or unknown)
    cognitive models and metaphors that the programmer accepts as their reality. When
    I hear someone say how JavaScript is, the problem almost comes from the programmer
    trying to apply an understanding to it.


    The problem is based in human nature. When approaching a new concept that appears
    similar to another concept they already know, people seem to be hardwired to try
    and understand the new concept by creating a metaphor of the old concept and trying
    to apply it to the new concept. If the metaphor fails, many people will simply
    give up on understanding a new and valid concept, saying it doesn''t make sense.
    The new concept isn''t wrong, the metaphor used to understand it is wrong³.


    I personally am convinced that this is why most people find STEM disciplines so
    hard. The concepts and ideas in the Liberal Arts and Social Sciences are pretty
    malleable, and even an incorrect metaphor can be twisted and combined with a twisted
    version of the concept to create a metaphor that sort of works as explanation
    of the concept. But in truth the metaphor and the understanding are actually invalid.


    In STEM, concepts and ideas are much less forgiving and mean exactly what they
    mean. Concepts cannot be twisted to fit an incorrect metaphor. STEM forces people
    to give up incorrect metaphors and adopt new metaphors; a very difficult task.


    To better understand what a metaphor is, and why they have to be understood carefully,
    consider a very common metaphor in CS, that of a data structure and a cafeteria
    tray dispenser, such as the one shown in the figure below.


    ![](img/ce60a0a8b4160fc893a11ed149173e93_93_0.png)


    Figure 14 - Tray Dispenser


    When learning the data structure, the metaphor that is traditionally used is that
    a tray is placed on the top of the stack of trays, and so the last tray placed
    is the first accessed, and a stack is just a Last-In-First-Out (LIFO) queue.


    Gödel''s theorem proves that no metaphor can ever be sufficient, as complete systems
    have undecidability, and decidable systems are incomplete. A large part of education
    should be helping people understand this and teaching them how to give up invalid
    metaphors when they no longer work.

