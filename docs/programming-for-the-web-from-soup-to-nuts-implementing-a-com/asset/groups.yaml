    # 89 网页编程：


    C++ 的多重继承困惑。这就是为什么接口在 Java 中比在 C++ 更成功地构建了更好的对象模型。事实是，抽象类型（接口）和类在 Java/C#/C++
    中始终是静态定义的，而 `new` 操作符实例化的是一个静态的、最终（final）的对象副本。


    JavaScript 将对象的定义视为数据元素和行为的集合，然后使用一种完全不同的视角来定义这些数据元素和行为。这种视角并不是错误的（正如 Java/C#/C++
    程序员所认为的那样），但它与传统的 OOP 语言观点相相悖。在这一观点被理解并认可其自身价值之前，对于使用 JavaScript 的程序员来说，它看起来像是在使用一种无效的认知视角。


    本章的目的是解释对象的观点。它将介绍这种观点，而不参考其他语言的对象的观点，因为试图引入对 Java 这类语言如何处理对象的理解，往往是害大于利。具有面向对象编程背景的读者可能比那些感觉自己已经完全“通了”（grok）的人更有优势。


    本章将分为分为：


    - 第 5.1 节将涵盖由欧洲计算机协会（ECMA）定义的 JavaScript 规范，并讨论为什么此本书基于 JavaScript 5（或 ECMA 5）而不是
    JavaScript 6（ECMA 6+)² 或更高版本。


    - 第 5.2 节将详细描述为什么来自其他语言的程序员很难理解 JavaScript。


    - 第 5.3 节将介绍 JavaScript 中的基础对象。该小节将涵盖关联数组，并对 JavaScript 中数组是什么提供一个更准确的模型。它将展示
    JavaScript 中的对象是属性映射（property maps），而不是基于类的 OOP 那样的类实例。最后，它将介绍 JavaScript 对象表示（JSON）格式，这是一种外部表示
    JavaScript 对象的方法。


    - 第 5.4 节涵盖 JavaScript 使用的基于原型的对象模型。将解释函数和原型（prototypes），以及 JavaScript 中如何解析属性。将重新回顾
    JSON，以展示一个功能完整的对象如何被序列化为字符串，并作为对象类型带回程序中。


    - 第 5.5 节涵盖 JavaScript 作用域，并引入 JavaScript 闭包（closures）。


    - 第 5.6 节将解释基于实例的 OOP 语言，以及对象在这些语言中是如何实现和使用的，以便读者随后可以比较它们的属性和行为。


    在本章结束时，读者应该理解本文将使用的对象模型，以及下一章将使用的内容。


    ² 我将使用术语 ECMA+ 来表示 ECMA6 或更高版本的 JavaScript。


    # 第 5.1 节 为什么使用 ECMA 5 作为基础？


    有许多理由选择 ECMA5 而非 ECMA6+ 作为本书的基础。第一是，任何未来的 JavaScript 实现都必须具备转换为 ECMA 5 的能力。ECMA6+
    中内置的所有奇妙功能都是基于 ECMA5 的某个特性的。我的个人观点是，理解一个概念，就要理解构建该概念的基础。如果你想用 C 语言编程，你应该知道汇编。如果你想用汇编语言编程，你应该理解体系体系和计算机组织。虽然理解想法的基础可能不是必须的，但几乎总是存在这种情况：不理解它们会导致问题，而如果程序员理解了下一层架构，这些问题是可以很容易解决的。


    不选择 ECMA6+ 的第二个原因是这种语言让 JavaScript 变得简洁，例如，向语言中添加新功能使其更容易编写，但可能更难理解，并且绝对隐藏了经验丰富的程序员不需要的、但会阻碍初学者试图拼凑事物是如何相互连接的细节。一旦程序员理解了各个部分，简洁和易用就是锦上添花的。但当有不同的语法方式来定义一个函数时（使用函数声明、带参数的箭头函数、带块作用域函数的箭头函数，我确定还有其他一些），尝试学习如何实现一个函数这并不是我的主意。


    不选择 ECMA6+ 的第三个原因是它似乎是基于以下理念构建的：程序将使用任何这些框架（React, Angular, Vue, Ember 等等等）来编写。这不是一本关于其中任何一个框架或泛指框架的书。意图是教计算机科学学生原理和哲学。学生可以学习一个框架，其中一个会在他们毕业后
    5 年内被归为遗留。


    然而，选择 ECMA5 的最大原因是，这是一本关于理解计算机科学原理、范式和哲学的书，以及如何将它们结合起来构建程序。这意味着限制周围环境的复杂性，并集中在说明计算机科学原理的基础设施上。JavaScript
    对象表示中提出的非结构化数据概念。对象序列化及其在 JSON 数据中的实现。启动和检索这些序列化数据。变量作用域，以及导致闭包的函数作用域等细节。属性映射和原型。这些都是计算机科学教育中的关注领域。语法糖让编写程序变得更容易，或者让系统对初学者更友好，那是行业的工作。我觉得这在计算机科学教育中没有位置。


    # 第 5.2 节 JavaScript 仅仅是很奇怪吗？


    在某个时刻，几乎每个从其他语言转向 JavaScript 的程序员都会问自己一个问题：“JavaScript 仅仅是很奇怪吗？”根据他们学习编程的方式，这种语言中没有任何东西是有逻辑的，而且
    JavaScript 看起来不一致且完全错误。但请允许我保证，JavaScript 没有任何问题。它是完全自洽的而且非常有道理。JavaScript 只是不同，与程序员所接受的未说明的（可能未被识别或未知）的认知模型和比喻相悖。当我听到有人说
    JavaScript 是什么样的时，问题几乎来自于程序员试图将其某种理解应用到上面。


    问题源于人性。当面对一个与已知概念相似的新概念时，人们似乎天生倾向于通过创建一个旧概念的比喻并尝试应用它来理解新概念。如果比喻失败了，许多人会简单地放弃理解一个新的有效的概念，说它不合逻辑。新概念没有错，理解它的比喻错了³。


    我个人深信，这就是为什么大多数人发现 STEM 学科如此困难。文科和社科学中的概念和想法非常具有塑性，即使是错误的比喻也可以被扭曲并与概念的扭曲版本结合，创建一个某种程度上解释概念的比喻。但实际上，比喻和理解实际上是无效的。


    在 STEM 中，概念和想法要宽容得多，且意思就是它的意思。概念不能被扭曲以适应错误的比喻。STEM 强制人们放弃错误的比喻并采用新的比喻；这是一个非常困难的任务。


    为了更好地理解什么是比喻，以及为什么必须仔细理解它们，请考虑计算机科学中非常常见的比喻：数据结构和食堂餐盘分发器，如图所示。


    ![](img/ce60a0a8b4160fc893a11ed149173e93_93_0.png)


    图 14 - 餐盘分发器


    在学习该数据结构时，传统使用的比喻是将盘子放在盘栈的顶部，因此最后放置的盘子是第一个访问的，栈只是一个后进先出（LIFO）队列。


    哥德尔定理证明了任何比喻都不可能是充分的，因为备系统具有不可判定性，而可判定系统是不完备的。教育的很大一部分应该是帮助人们理解这一点，并教他们在比喻不再起作用时放弃无效的比喻。


    （注：原文有脚注³，但未提供具体内容）


