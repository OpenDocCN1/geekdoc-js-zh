    \ 函数将表单（元素）与 JavaScript 函数关联。为此，给第一个按钮分配了一个 `id`，以便从 DOM 中检索它。这在上面的 HTML 表单中已经存在。\n\
    \n```html\n<input type=\"button\" value=\"Process Form\" id=\"processButton\"\
    \ />\n```\n\n> ²¹ 非侵入式 JavaScript 是一系列最佳实践，包括混合 HTML 和 JavaScript。关于非侵入式 JavaScript\
    \ 的更多信息，请参阅：https://en.wikipedia.org/wiki/Unobtrusive_JavaScript\n\n```html\n\
    <head>\n<title>Map Example Input Screen</title>\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js\"\
    ></script>\n<script>\n  $(document).ready(function() {\n    document.getElementById(\"\
    processButton\").onclick = function() {\n      alert(\"button is pressed\");\n\
    \    };\n  });\n</script>\n</head>\n```\n\n程序 62 - 将按钮与函数关联的 HTML 文件头部。\n\n##\
    \ 3.4.3 节处理文本框\n\n在上一个例子中，使用告警框来测试程序是否接线正确，例如在按钮被按下时是否调用了 `processButton` 函数。在编程语言中，在尝试构建整个程序之前确保程序的局部运行正常是非常重要的。新手程序员通常会尝试编写整个程序，结果得到一个只有\
    \ 20 行但有 100 个编译错误、严重逻辑错误且完全没有运行运行的程序。这在 Java、C#、C/C++ 等语言中确实如此，但在 JavaScript\
    \ 这样的语言中更是如此。在 JavaScript 中，单行错误的代码就会导致数百行可行的 JavaScript 程序变得无输出。这些程序通常会产生困惑的错误，或者完全没有错误。在\
    \ JavaScript 中，最好的方法总是分阶段构建程序，确保每次更改都有想要的效果。\n\n现在按钮已经可以工作了，就可以实现表单的处理了。对于此程序，处理元素会将消息写入\
    \ `console.log`。首先将处理所有的文本框。注意，此处使用的文本框包含了文本以外的输入类型。数字和日历等输入类型也被视为文本框。\n\n要处理文本框，需要检索其\
    \ `value` 属性。`value` 属性包含字符串格式的消息。注意 jQuery 在检索元素时有点奇怪，它返回一个数组，需要引用数组中的第一个元素才能获取值。下方的代码展示了如何从标题文本框获取值。\n\
    \n```html\n<script>\n$(function() {\n  $('#processButton').click(function() {\n\
    \    console.log(\"The title is \" + $(\"#title\")[0].value);\n  });\n});\n</script>\n\
    ```\n\n程序 63 - 使用 jQuery 数组格式从文本框获取文本。\n\n"
