    \n语言中没有内置这些工具导致了如何让开发者可以使用这些工具的问题。旧方法（以及今天 Java 中仍在使用的方法）是要求程序员自己管理所有权。但这是困难的，除了付得起专门人员负责此任务的大型环境外，这是不可想象的。\n\
    \n解决工具构建问题的现代答案是创建包，包含安装工具或框架所需的所有文件和信息。这些包随后由包管理器管理。大多数现代语言都有包管理器。例如，在 C# 中有\
    \ NuGet，在 Ruby 中有 Ruby-Version-Manager (rvm) 和 bundler，在 Python 中有 pip 和 PyPM。\n\
