    ![With CommitMessage](img/file23.png)\n\n注意我们传递的是提交本身而不是文件对象。`CommitMessage` 不需要知道关于文件的任何信息，了解数据的组件越少越好。\n\
    \n### Time\n\n我们现在添加 `Time` 组件。我们需要 Moment.js，所以请安装它：\n\n`npm install --save moment`\n\
    \n然后创建文件 `time.js`，并将之前的 `Time` 组件粘贴到它自己的文件中。\n\n```javascript\nimport React from\
    \ 'react';\nimport PropTypes from 'prop-types';\nimport moment from 'moment';\n\
    \nconst Time = ({ time }) => {\n  const timeString = moment(time).fromNow();\n\
    \  return (\n    <span className=\"time\">\n      {timeString}\n    </span>\n\
    \  );\n};\nTime.propTypes = {\n  time: PropTypes.string.isRequired\n};\n\nexport\
    \ default Time;\n```\n\n好了，让我们在 `FileListItem` 中使用 `Time`。首先我们需要导入它，所以向 `index.js`\
    \ 顶部添加此行：\n\n```javascript\nimport Time from './time';\n```\n"
- fmt: "\nSince we’re importing our own file instead of something from `node_modules`,\
    \ the path needs to be relative (`./time`) rather than just the module name (`time`).\n\
    \nThen, we can update `FileListItem`. Note that `Time` doesn’t render a `<td>`\
