  trans: "\n\n字符串 ‘react’ 和 ‘react-dom’ 是重要的：它们对应于 `npm` 安装的模块名称。如果你熟悉 Node.js，`import\
    \ React from 'react'` 等同于 `var React = require('react')`。\n\n### 第 3 \n\n在 `react-hello`\
    \ 目录内部，运行以下命令启动应用：\n\n```bash\n$ npm start\n```\n\n浏览器会自动打开并显示“Hello World!”\n\
    \n### 代码是如何运行的\n\n让我们从底部开始，从 `ReactDOM.render` 的调用开始。这才是让程序运行起来的关键。尽管代码中有一个看起来像\
    \ HTML 的 `<HelloWorld/>`，但这段代码是普通的 JavaScript。尝试注释掉那行，观察 Hello World 是消失的。\n\n\
    React 使用了 `virtual DOM` 的概念。它创建了你的组件层级的表示，然后通过创建真实的 DOM 元素并插入到你指定的地方来`渲染`（renders）这些组件。在这种情况下，是在\
    \ id 为 `root` 的元素内部。\n\n`ReactDOM.render` 接收 2 个参数：你想渲染的内容（你的组件或任何其他 React 元素）以及你想将其渲染到哪里（一个真实的\
    \ DOM 元素）。\n\n```\nReactDOM.render([React Element], [DOM element]);\n```\n\n在上面，我们有一个名为\
    \ `HelloWorld` 的`component`。编写 React 组件的主要方法是像这样编写纯函数。它们通常被称为“无状态函数组件”。\n\n还有\
    \ 2 种创建组件的方法：ES6 类以及现在已废弃的 `React.createClass`。你可能仍然在旧的 Stack Overflow 回答或旧的 GitHub\
    \ 项目中看到 `createClass`风格，因此我们将回顾它是如何工作的。但主要情况下，我们将尽可能编写函数，并在需要时使用 ES6 类。\n\n`render`\
    \ 函数内部的类 HTML 语法被称为 `JSX`，我们将接下来介绍它。\n\n# JSX：是什么以及为什么\n\n你可能注意到的关于 React 代码的第一点之一是，它看起来就像组件函数返回了\
    \ HTML。这种类 HTML 的语法实际上被称为 JSX。\n\n## 什么是 JSX？\n\nJSX 是为 React 发明的一种语法，看起来与 (X)HTML\
    \ 非常相似。它允许你通过编写看起来熟悉的语法来创建元素，而不是手动编写函数调用。这种类 HTML 的语法实际上会编译为真实的 JavaScript，我们将在下文中讨论。\n\
    \n## JavaScript 里的 HTML？！\n\n在我甚至认真研究 React 之前，我就知道它混合了 HTML 和 JS，我认为那简直是*丑陋的*。我的意思是，这在否定*多年来*的最佳实践思维，对吧？自从\
    \ jQuery 的暗黑暗时代以来，我们就知道在 JS 内部直接对元素设置 `innerHTML` 是黑客行为而且性能糟糕——更不用说到处是安全漏洞了——那么为什么\
    \ React 却在重犯同样的错误呢？\n\n你有没有注意到“HTML”周围没有引号？那是因为`它不是一个字符串。`。不加引号也不仅仅是一种技巧。React\
    \ *并没有*在解析那个东西并将其转换为 HTML。\n\n我知道，我知道，它看起来像 HTML。但实际上，JSX 只是在创建 DOM 元素的函数调用之上的一种美妙的语法糖。\n\
    \n所以 React 在此处到底在做什么？它是如何运作的？以及为什么它并不糟糕？\n\n### JSX 被编译为 JavaScript\n\n你编写的 JSX\
    \ 元素实际上由一个名为 Babel 的工具编译为 JavaScript。Babel 是一个“转译器”（transpiler），这是一个造词，意味着它将代码转换为所有浏览器都能理解的有效\
    \ ES5 JavaScript。每个 JSX 元素都变成一个函数调用，其参数是它的属性（“props”）和它的内容（“children”）。\n\n这里有一些简单\
    \ JSX 的示例：\n\n```\nreturn <span>Hello!</span>;\n```\n\n\n\n这里是编译器生成的 JavaScript：\n\
    \n```javascriptreturn React.createElement(\n  'span',\n  {},\n  'Hello!');\n```\n\
    \n`React.createElement` 函数的签名如下：\n\n```\nReact.createElement(\n  string|element,\n\
    \  [propsObject],\n  [children...])\n```\n\n`string|element` 可以是一个描述 HTML 或 SVG\
    \ 标签的字符串（如 `'div'` 或 `'span'`），也可以是一个组件（如 `HelloWorld`，不带引号）。\n\n`propsObject`\
    \ 和 `children` 是可选的，你也可以通过传递额外的参数提供多个子元素：\n\n```javascript\nReact.createElement(\n\
    \  'div',\n  {},\n  'Hello',\n  'World'\n);\n```\n\n你也可以嵌套调用：\n\n```javascript\n\
    React.createElement('div', {},\n  React.createElement('div', {}, 'Child1'),\n\
    \  React.createElement('div', {}, 'Child2',\n    React.createElement('div', {},\
    \ 'Child2_child')\n  )\n);\n```\n\n自己尝试一下！重写 `HelloWorld` 组件以调用 `React.createElement`\
    \ 而不是返回 JSX。\n\n```javascript\nfunction HelloWorld() {\n  return (\n    React.createElement(/*\
    \ ... */)\n  );\n}\n```\n\n这是一段稍微复杂的 JSX：\n\n```jsx\n<span className='song-name'>\n\
    \  {props.song.name}\n</span>\n```\n\n这是它被编译后的结果：\n\n```javascript\nReact.createElement('span',\
    \ \n  { className: 'song-name' },\n  props.song.name\n);\n```\n\n看到 JSX 本质上是编写函数调用的简便简写了吗？如果你不想，甚至不需要使用\
    \ JSX——你可以手动写出这些函数调用。\n\n你的第一直觉可能是避免编写 JSX，因为你不喜欢“JS 中的 HTML”这种外观。也许你更愿意编写真正的\
    \ JavaScript 函数调用，因为这在某种程度上感觉更“纯粹”。我建议在放弃它之前诚实地尝试一下 JSX。\n\n写出 `React.createElement`\
    \ 调用并不是 React 社区的常用方法。几乎所有的 React 开发者都使用 JSX，这意味着你在野外看到的代码（在 GitHub、Stack Overflow\
    \ 等上）很可能是用它编写的。\n\n### 但是……关注点分离！\n\n这是大多数新手最关心的问题：那种觉得将 JS 与 HTML 混合在一起就是*错误*的胃里不安的感觉。它甚至可能让你感到*愤怒*。\n\
    \n在我开始使用 React 之前，我有同样的顾虑。花了一些时间（并写了几个小应用），我才开始理解这种不不洁混合的力量。不过不用担心，因为书中的练习将提供你所需的所有练习来掌握它。\n\
    \n我相信，对混合 HTML 与 JS 的蔑视背后有一点点信术崇拜式的“传统”。这是每个新 Web 开发者的成年礼，是代代相传的关于构建 Web 界面“正确方式”的传说。“它一直都是这样做的。”\n\
    \n将视图与逻辑分离是有正当理由的。当它们结合时，代码可能会变成一团混乱的条件逻辑，并且到处都是重复的 HTML，就像写得糟糕的 PHP。\n\n如果你对\
    \ PHP 或 JSP 有回忆，在那些地方，数据库调用与视图代码混合在一起，而你再也不想回到那个世界，我不怪你。React 使用组件进行构建的模式有助于防止这种情况。\n\
    \n### 未分离的关注点\n\n当你退一步思考这个问题时，将逻辑和视图结合也有一些正当的理由。\n\n如果你用过类似 Angular 的东西，你可能在一个文件中编写逻辑，在另一个单独模板文件中编写\
    \ HTML。\n\n告诉我，你有多少次打开模板来微调某些东西，而不需要查看（或修改！）相关的 JS 代码？你有多少次修改了 JS 而不需要触碰模板？\n\n\
    在我处理过的大多数代码中，我我可以在不同时更改模板及其控制器的情况下添加新功能。在一个文件中添加一个函数，在另一个文件中调用它。传递一个额外的参数？得在两个文件中都修改它。\n\
    \n如果它们是真正分离的关注点，这就不需要了。\n\n我们喜欢认为将 JS 和 HTML 分割到单独的文件会神奇地将它们变成“分离的关注点”。复用性，我们来了！\n\
    \n但情况很少是那样。JS 代码及其相关的模板通常是紧密耦合的，自然如此——它们是同一枚硬币的两面。\n\n"
- fmt: "\nSplitting code into separate files does not automatically lead to separation\
    \ of concerns.\n\nThe story is similar with good old jQuery. The HTML is blissfully\
    \ unaware that JavaScript even exists, and yet the JS and HTML are tightly coupled\
    \ by the fact that the `jQuery` selectors must know something about the page structure.\
    \ If the structure changes, the code must change.\n\nIf you haven’t noticed, I’m\
    \ trying to make the case that the template and the view logic could actually\
    \ coexist in the same file and it *might actually make more sense to do it that\
    \ way*.\n\nYou don’t have to believe me right now. Just keep the idea in the back\
    \ of your mind as you work through the examples and exercises. You may find (as\
    \ I did) that merging the logic and view makes your code easier to navigate, easier\
    \ to write, and easier to debug. You’ll spend less time hopping between files\
    \ when all the related functionality is in one place.\n\n# Working With JSX\n\n\
    ## Composing Components\n\nJSX, like HTML, allows you to nest elements inside\
    \ of one another. This is probably not a big surprise.\n\nLet’s refactor the `HelloWorld`\
    \ component from earlier to demonstrate how composition works. Here’s the original\
    \ `HelloWorld`:\n\n```\nfunction HelloWorld() {\n  return (\n    <div>Hello World!</div>\n\
    \  );\n}\n```\n\nLeaving the `HelloWorld` component intact for now, create two\
    \ *new* components: one named `Hello` and one named `World`. `Hello` should render\
    \ `<span>Hello</span>` and `World` should render `<span>World</span>`. You can\
    \ basically copy-and-paste the `HelloWorld` component and just change the text\
    \ and the function name.\n\nGo ahead and try making that change yourself. I’ll\
    \ wait.\n\n…\n\n…\n\nGot it? It’s important to actually *type this stuff out*\
    \ and try it yourself! Don’t just read while nodding along, because you won’t\
    \ actually learn it that way. It’s very easy to look at code and think, “That\
    \ all makes sense, yep.” You’ll never know if you internalized it until you *try\
    \ it*.\n\nYour two new components should look like this:\n\n```\nfunction Hello()\
    \ {\n  return <span>Hello</span>;\n}\n\nfunction World() {\n  return <span>World</span>;\n\
    }\n```\n\nNow, update the `HelloWorld` component to use the two new components\
    \ you just created. It should look something like this:\n\n```\nfunction HelloWorld()\
    \ {\n  return (\n    <div>\n      <Hello/> <World/>!\n    </div>\n  );\n}\n```\n\
    \nAssuming the app is still running, the page should automatically refresh. If\
    \ not, refresh it manually, and also make sure the app is running (run `npm start`\
    \ if it’s not).\n\nYou should see the same “Hello World!” as before. I know this\
    \ seems simple, but there are some lessons here, I promise.\n\n## Wrap JSX with\
    \ Parentheses\n\nThe following examples depend on the `Hello` and `World` components\
    \ that you should have created, so make sure those exist before continuing.\n\n\
    First, a note on formatting. You might notice I wrapped the returned JSX inside\
    \ parentheses, `()`. This isn’t strictly necessary, but if you leave off the parens,\
    \ the opening tag must be on the same line as the return, which looks a bit awkward:\n\
    \n```\nfunction HelloWorld() {\n  return <div>\n    <Hello/> <World/>!\n  </div>;\n\
    }\n```\n\nJust for kicks, try removing the parens and watch what happens:\n\n\
    ```\nfunction HelloWorld() {\n  return \n    <div>\n      <Hello/> <World/>!\n\
    \    </div>;\n}\n```\n\nThis will fail with an error in the browser console:\n\
    \n> `HelloWorld(…): A valid React element (or null) must be returned. You may\
    \ have returned undefined, an array or some other invalid object.`\n\nYou’ll also\
    \ likely see a warning about “Unreachable code.”\n\nThis is because JavaScript\
    \ assumes you wanted a semicolon after that return (because of the newline), effectively\
    \ turning it into this, which returns undefined:\n\n```\nfunction HelloWorld()\
    \ {\n  return;\n    <div>\n      <Hello/> <World/>!\n    </div>;\n}\n```\n\nSo:\
    \ feel free to format your JSX however you like, but if it’s on multiple lines,\
    \ I recommend wrapping it in parentheses.\n\n### Return a Single Element\n\nNotice\
    \ how the two components are wrapped in a `<div>` in the `HelloWorld` example:\n\
    \n```\nfunction HelloWorld() {\n  return (\n    <div>\n      <Hello/> <World/>!\n\
    \    </div>\n  );\n}\n```\n\nHere’s a little exercise: try removing the `<div>`\
    \ wrapper and see what happens. You should get this error:\n\n> `Adjacent JSX\
    \ elements must be wrapped in an enclosing tag`\n\nIf this seems surprising, remember\
    \ that JSX is compiled to JS before it runs:\n\n```javascript\n// This JSX:\n\
    \  return (<Hello/> <World/>);\n\n// Becomes this JS:\n  return (\n    React.createElement(Hello,\
    \ null) React.createElement(World, null)\n  );\n```\n\nReturning two things at\
    \ once makes no sense. So that leads to this very important rule:\n\n> **A component\
    \ function must return a single element.**\n\nBut wait! Could you return an array?\
    \ It’s just JavaScript after all…\n\n```javascript\n// This JSX:\nreturn [<Hello/>,\
    \ <World/>];\n\n// Would turn into this JS\n// (notice the brackets).\n// It looks\
    \ valid...\nreturn [\n  React.createElement(Hello, null),\n  React.createElement(World,\
    \ null)\n];\n```\n\nTry it out! It should fail. In the dev console, you’ll see:\n\
    \n> `HelloWorld(…): A valid React element (or null) must be returned. You may\
    \ have returned undefined, an array or some other invalid object.`\n\nSo for now,\
    \ the rule stands: you must return a single element. This is expected to change\
    \ when React 16 is released.\n\n### JavaScript in JSX\n\nYou can insert real JavaScript\
    \ expressions within JSX code, and in fact, you’ll do this pretty often. Surround\
    \ JavaScript with single braces like this:\n\n```javascript\nfunction SubmitButton()\
    \ {\n  var buttonLabel = \"Submit\";\n  return (\n    <button>{buttonLabel}</button>\n\
    \  );\n}\n```\n\nRemember that this will be compiled to JavaScript, which means\
    \ that the JS inside the braces must be an *expression*. An expression produces\
    \ a value. These are expressions:\n\n```javascript\n1 + 2\nbuttonLabel\naFunctionCall()\n\
    aFunctionName\n```\n\nEach of these produces (aka returns) a single value. In\
    \ contrast, *statements* do not produce values and can’t be used inside JSX. Here\
    \ are some examples of statements:\n\n```javascript\nvar a = 5\nif(true) { 17;\
    \ }\nwhile(i < 7) { i++ }\n```\n\nNone of these things produces a value. `var\
    \ a = 5` declares a variable with the value 5, but does not *return* that value.\n\
    \nAnother way to think of statement vs expression is that *expressions* can be\
    \ on the right hand of an assignment, but statements cannot.\n\n```javascript\n\
    // These aren't valid JS:\na = var b = 5;\na = if(true) { 17; }\n```\n\nI’m hammering\
    \ home this point because it’s important, and it’s a common tripping point for\
    \ React beginners.\n\n## “If” in JSX\n\nThe next question you might wonder is,\
    \ “How do I write a conditional if I can’t use ‘if’?” There are a couple of options.\n\
    \nThe first is the ternary operator (`?`). Use it like this:\n\n```javascript\n\
    function ValidIndicator() {\n  var isValid = true;\n  return (\n    <span>{isValid\
    \ ? 'valid' : 'not valid'}</span>\n  );\n}\n```\n\nYou can also use boolean operators\
    \ such as `&&` like this:\n\n```javascript\nfunction ValidIndicator() {\n  var\
    \ isValid = true;\n  return (\n    <span>\n      {isValid && 'valid'}\n      {!isValid\
    \ && 'not valid'}\n    </span>\n  );\n}\n```\n\n### Comments in JSX\n"
