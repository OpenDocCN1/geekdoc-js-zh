    如果你不知道如何打开浏览器的开发者工具，请搜索“open browser console [你的浏览器]”。\n\n同样，如果你不知道某个错误的意思，将其复制并粘贴到\
    \ Google。\n\n还是完全卡住了？Stack Overflow 有大量的 React 相关问题和答案，[`www.reactiflux.com/`](https://www.reactiflux.com/)\
    \ 上的 `Reactiflux` 社区充满了乐于提供帮助的人。Freenode 上还有一个 `#react` IRC 频道，你可以通过 IRC 客户端连接或访问\
