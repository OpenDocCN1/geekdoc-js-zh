  trans: "\n例如，如果我们正在构建 Twitter，我们可能会从上到下地构建 `Tweet` 组件，然后将其整合到推文列表中，接着将该列表嵌入页面中，最后将该页面嵌入到更大的应用程序中。`Tweet`\
    \ 可以从上到下构建，而较大的应用程序则可以自下而上构建。\n\n还有一种情况从下而上构建是好主意，那就是你有一个用其他框架（如 `Angular` 或 `Backbone`）编写的现有应用，你想用\
    \ `React` 重写它。在这种情况下，从顶部开始意义不大，因为它会对你的整个代码库产生连锁反应。\n\n从下而上开始是可控且易管理的。你可以构建应用程序的“叶节点”——即那些小的、封装好的部分。让它们运行起来，然后构建下一层，以此此类推，直到到达顶端。那时，如果你选择的话，可以可以将当前的框架替换为\
    \ `React`。\n\n重写时，自下而上开发的另一个优势是它非常符合 `React` 的单向数据流范式。由于 `React` 组件占据树的底部，而且你可以保证\
    \ `React` 组件只包含其他 `React` 组件，因此对于如何将数据传递到需要它的组件推理起来变得更容易。\n\n### 构建 Tweet 组件\n\
    \n这里是我们的蓝图：\n\n![Tweet](img/file2.png)\n\n在这一节中，我们将构建一个简单的静态推文，从顶层组件 `Tweet` 开始。\n\
    \n运行以下命令使用 `Create React App` 创建新项目：\n\n```\n$ create-react-app static-tweet &&\
    \ cd static-tweet\n```\n\n它为我们生成了一些在这里用不到到的文件，所以我们可以安全地删除它们：\n\n```bash\n$ rm\
    \ src/App.* src/logo.svg\n```\n\n新生成的项目在 `public` 目录下包含一个 `index.html` 文件。通过在\
    \ `<head>` 标签内添加此行来引入 Font Awesome（全部写在一行）：\n\n```html\n<link rel=\"stylesheet\"\
    \ href=\"https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css\"\
    >\n```\n\n我们还在 `src` 目录中有一个生成的 `index.css` 文件。打开它并将其内容替换为以下内容：\n\n```css\n.tweet\
    \ {\n  border: 1px solid #ccc;\n  width: 564px;\n  min-height: 68px;\n  padding:\
    \ 10px;\n  display: flex;\n  font-family: \"Helvetica\", arial, sans-serif;\n\
    \  font-size: 14px;\n  line-height: 18px;\n}\n```\n\n`index.js` 文件将与 Hello World\
    \ 的版本非常相似。它基本上是一样的，只是把“Hello World”换成了“Tweet”。我承诺很快会让它变得更好。将 `src/index.js` 的内容替换为这些：\n\
    \n```javascript\nimport React from 'react';\nimport ReactDOM from 'react-dom';\n\
    import './index.css';\n\nfunction Tweet() {\n  return (\n    <div className=\"\
    tweet\">\n      Tweet\n    </div>\n  );\n}\n\nReactDOM.render(<Tweet/>,\n  document.querySelector('#root'));\n\
    ```\n\n这应该搞定了。像之前一样运行以下命令启动服务器：\n\n```bash\n$ npm start\n```\n\n页面应该渲染出类似这样的：\n\
    \n![Tweet](img/file4.png)\n\n这并不是什么你没见过的东西。它是一个简单的组件，增加了一个特殊的 `className` 属性（或“prop”）。\n\
    \n你可能注意到的另一个新现象是 `import './index.css'`，它将……一个 CSS 文件导入到了 JavaScript 文件？初看似乎很奇怪。\n\
    \n发生的情况是，在后台，当 `Webpack` 构建我们的应用时，它看到了这个 CSS 导入并知道 `index.js` 依赖于 `index.css`。`Webpack`\
    \ 读取 CSS 文件并将其包含在打包的 JavaScript 中（作为字符串），以发送给浏览器。\n\n你实际上可以在浏览器中看到这一点——打开开发者控制台，查看\
    \ Elements（元素）标签页，并注意到 `<head>` 下有一个我们没有放进去的 `<style>` 标签。它包含了 `index.css` 的内容。\n\
    \n我们将在下一节中学习更多关于 props 的知识，但现在，只需将它们想象成 HTML 属性即可。大多数属性的命名与你熟悉的属性相同，但 `className`\
    \ 的特殊之处在于，它的值会变成 DOM 节点上的 `class` 属性。\n\n回到我们的大纲。让我们构建 `Avatar` 组件。在 `index.js`\
    \ 中添加组件函数：\n\n```javascript\nfunction Avatar() {\n  return (\n    <img\n     \
    \ src=\"https://www.gravatar.com/avatar/nothing\"\n      className=\"avatar\"\n\
    \      alt=\"avatar\" />\n  );\n}\n```\n\n稍后我们将查看将组件提取到文件中并通过 `import` 导入它们，但为了现在保持简单，我们把所有组件都放在\
    \ `index.js` 中。\n\n如果你想使用自己的 Gravatar，请访问 [daveceddia.com/gravatar](https://daveceddia.com/gravatar)\
    \ 来查找它的 URL。\n\n接下来我们需要更改 `Tweet` 以渲染 `Avatar`：\n\n```javascript\nfunction Tweet()\
    \ {\n  return (\n    <div className=\"tweet\">\n      <Avatar/>\n      Tweet\n\
    \    </div>\n  );\n}\n```\n\n现在在 `index.css` 中给 `Avatar` 一些样式：\n\n```css\n.avatar\
    \ {\n  width: 48px;\n  height: 48px;\n  border-radius: 5px;\n  margin-right: 10px;\n\
    }\n```\n\n它变得越来越好了：\n\n![Tweet](img/file5.png)\n\n接下来我们将再创建两个组件，`Message` 和 `NameWithHandle`：\n\
    \n```javascript\nfunction Message() {\n  return (\n    <div className=\"message\"\
    >\n      less than 140 characters.\n    </div>\n  );\n}\n\nfunction NameWithHandle()\
    \ {\n  return (\n    <span className=\"name-handle\">\n      <span className=\"\
    name\">Name</span>\n      <span className=\"handle\">@handle</span>\n    </span>\n\
    \  );\n}\n```\n\n如果现在刷新，什么都不会改变，因为我们仍然需要更新 `Tweet` 来使用这些组件：\n\n```javascript\n\
    function Tweet() {\n  return (\n    <div className=\"tweet\">\n      <Avatar/>\n\
    \      <div className=\"content\">\n        <NameWithHandle/>\n        <Message/>\n\
    \      </div>\n    </div>\n  );\n}\n```\n\n现在可以渲染了，但很难看。为名称和处理一些 CSS 来修饰它：\n\n\
    ```css\n.name {\n  font-weight: bold;\n  margin-bottom: 0.5em;\n  margin-right:\
    \ 0.3em;\n}\n\n.handle {\n  color: #8899a6;\n  font-size: 13px;\n}\n```\n\n![Tweet](img/file6.png)\n\
    \n它看起来更像真实的推文了！接下来，添加 `Time` 和按钮（我们稍后会讨论这种新语法）：\n\n```javascript\nconst Time =\
    \ () => (\n  <span className=\"time\">3h ago</span>\n);\n\nconst ReplyButton =\
    \ () => (\n  <i className=\"fa fa-reply reply-button\"/>\n);\n\nconst RetweetButton\
    \ = () => (\n  <i className=\"fa fa-retweet retweet-button\"/>\n);\n\nconst LikeButton\
    \ = () => (\n  <i className=\"fa fa-heart like-button\"/>\n);\n\nconst MoreOptionsButton\
    \ = () => (\n  <i className=\"fa fa-ellipsis-h more-options-button\"/>\n);\n```\n\
    \n这些组件看起来不像你到目前编写的 `function`，但它们实际上仍然是函数。它们是*箭头函数*。这里有一个从普通 `function` 到箭头函数的演变过程，让你看到发生了什么：\n\
    \n"
- fmt: "\n```javascript\nfunction LikeButton() {\n  return (\n    <i className=\"\
    fa fa-heart like-button\"/>\n  );\n}\n\n// This can be rewritten as an\n// anonymous\
    \ function:\n\nconst LikeButton = function() {\n  return (\n    <i className=\"\
    fa fa-heart like-button\"/>\n  );\n}\n\n// ...which can be turned into an\n//\
    \ arrow function:\n\nconst LikeButton = () => {\n  return (\n    <i className=\"\
    fa fa-heart like-button\"/>\n  );\n}\n\n// It can be further simplified to:\n\n\
    const LikeButton = () => (\n  <i className=\"fa fa-heart like-button\"/>\n);\n\
    \n// And if it's really simple,\n// you can even write it on one line:\n\nconst\
    \ Hi = () => <<span>>Hi</span>;\n```\n\nArrow functions are a nice concise way\
    \ of writing components. The function itself is the `() => { ... }` part.\n\n\
    Notice how there’s no `return` in the last versions: when an arrow function only\
    \ contains one expression, it can be written without braces. And when it’s written\
    \ without braces, the single expression is implicitly returned.\n\nYou’ll continue\
    \ to use arrow functions as you continue through the book, so don’t worry if they\
    \ look foreign now. You’ll get used to them.\n\n### The let and const Keywords\n\
    \nIf you’re familiar with languages like C or Java, you’re familiar with block\
    \ scoping. As you may know, JavaScript’s `var` is actually function-scoped, not\
    \ block-scoped. This has long been an annoyance.\n\nES6 adds `let` and `const`\
    \ as two new ways of declaring block-scoped variables.\n\nThe `let` keyword defines\
    \ a mutable (changeable) variable. You can use it instead of `var` almost everywhere.\n\
    \nThe `const` defines a constant. It will throw an error if you try to reassign\
    \ the variable, but it’s worth noting that it does not prevent you from modifying\
    \ the data within that variable. Here’s an example:\n\n```javascript\nconst answer\
    \ = 42;\nanswer = 43;   // error!\n\nconst numbers = [1, 2, 3];\nnumbers[0] =\
    \ 'this is fine'; // no error\n```\n\nUsing `const` is more of a signal of intent\
    \ than a bulletproof protection scheme, but it is still worthwhile.\n\nNow that\
    \ we’ve got all those new components, update `Tweet` again to incorporate them:\n\
    \n```javascript\nfunction Tweet() {\n  return (\n    <div className=\"tweet\"\
    >\n      <Avatar/>\n      <div className=\"content\">\n        <NameWithHandle/><Time/>\n\
    \        <Message/>\n        <div className=\"buttons\">\n          <ReplyButton/>\n\
    \          <RetweetButton/>\n          <LikeButton/>\n          <MoreOptionsButton/>\n\
    \        </div>\n      </div>\n    </div>\n  );\n}\n```\n\nFinally, add a few\
    \ more styles to cover the time and buttons:\n\n```css\n.time {\n  padding-left:\
    \ 0.3em;\n  color: #8899a6;\n}\n\n.time::before {\n  content: \"\\00b7\";\n  padding-right:\
    \ 0.3em;\n}\n\n.buttons {\n  margin-top: 10px;\n  margin-left: 2px;\n  font-size:\
    \ 1.4em;\n  color: #aab8c2;\n}\n\n.buttons i {\n  width: 80px;\n}\n```\n\nAnd\
    \ here we have a fairly respectable-looking tweet!\n\n![Final Tweet](media/file7.png)\n\
    \nYou can customize it to your heart’s content: change the name, the handle, the\
    \ message, even the Gravatar icon. Pretty sweet, right?\n\n“But… wait,” I hear\
    \ you saying. “I thought we were going to.”\n"
