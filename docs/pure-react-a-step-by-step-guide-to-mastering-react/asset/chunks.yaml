    ### Pass Items to CartPage


    The cart needs items to display. The trouble is, our `cart` state just contains
    item indices, not actual items. Additionally, there can be duplicate indices when
    an item is added multiple times. We’ll need to massage the `cart` state into an
    array of items suitable to pass into `CartPage`.


