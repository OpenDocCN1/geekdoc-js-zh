    \ className=\"like-count\">\n        {count}\n      </span>}\n  </span>\n);\n\n\
    LikeButton.propTypes = {\n  count: PropTypes.number\n};\n```\n\nTo verify that\
    \ it works, go to the `Tweet` component, and try passing a string instead of a\
    \ number to the `LikeButton`:\n\n```javascript\n// Replace this:\n<LikeButton\
    \ count={tweet.likes}/>\n\n// With this:\n<LikeButton count='foo'/>\n```\n\nIf\
    \ you refresh now (or wait for the browser to refresh automatically), you should\
