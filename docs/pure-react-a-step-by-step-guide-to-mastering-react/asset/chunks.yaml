- fmt: "\nIn the static tweet example, `Time` was written as an arrow function, so\
    \ I’ve left it that way. However, because it now has 2 statements, it needs the\
    \ surrounding braces, which then causes it to need a `return`. You could of course\
    \ simplify this by moving the `moment(time).fromNow()` directly inside the `<span\
    \ >`, and then you could remove the `return` and the braces. I’ll leave it up\
    \ to you.\n\n## What Exactly Should Be Passed as a Prop?\n\nProps can accept all\
    \ sorts of things: Numbers, Booleans, Strings, Objects, even Functions. Early\
    \ on you might start to wonder, should you pass an object and let the component\
    \ extract what it needs? Or should you pass the specific pieces of data that the\
    \ component requires?\n\nIn the examples here, we’re passing in the specific pieces\
    \ of data.\n\nWe could instead just pass the `tweet` object itself. For instance,\
    \ instead of passing a timestamp directly to the `Time` component, we could pass\
    \ in `tweet` and let it extract the timestamp from the tweet. Why not do it that\
    \ way? Here are a few reasons:\n\n* If `Time` expects a tweet object and pulls\
    \ out the timestamp property, it won’t be usable with anything other than a tweet\
    \ object. What if you have a user with an timestamp property called “updated_at”\
    \ and want to render it with a `Time` component? Well, you can’t, without hacking\
    \ together a temporary object that “looks like” a tweet with a timestamp.\n\n\
    * The `Time` component would have knowledge of the inner structure of a `tweet`\
    \ object. This might not seem like a big deal, until you have 10 components like\
    \ this, and the backend developer decides that “timeStamp” with a capital “S”\
    \ looks better than “timestamp” and now you have to update all those components.\
    \ It’s a good idea to keep the knowledge of data structures contained to as few\
    \ places as possible to reduce the cost of change.\n\n## Guidelines for Naming\
    \ Props\n\nAs the saying goes, “There are two hard things in computer science:\
    \ cache invalidation, naming things, and off-by-one errors.”\n\nThe names you\
    \ choose for props influence how the component will be used, as well as how components\
    \ are coupled. Imagine if we had written `Time` to take a prop named `tweetTime`.\
    \ Even if we passed in the timestamp directly (instead of the entire tweet object),\
    \ this is still not a great choice for a prop name. Why?\n\nConsider what happens\
    \ when the next developer comes along (maybe that’s you, 3 weeks from now) and\
    \ wants to reuse the `Time` component in a new part of the app that has nothing\
    \ to do with tweets. The rendered result will come out fine, but the code will\
    \ be awkward. Writing `<Time tweetTime={timestamp}/>` expresses the wrong intent\
    \ if the timestamp doesn’t actually belong to a tweet.\n\nMore likely, the developer\
    \ will look at `Time`, see that it expects a `tweetTime`, and then decide not\
    \ to reuse that component – either because they assume it’s not suitable for their\
    \ purpose, or they worry that its underlying implementation could change and break\
    \ their code.\n\n### The Remaining Components\n\nLet’s get back to converting\
    \ `Tweet` and its children to use props. There are only two components left: `RetweetButton`\
    \ and `LikeButton`, which need to display counts of retweets and likes. Currently,\
    \ they don’t display any numbers at all, just an icon.\n\nChange these two lines:\n\
    \n```jsx\n<RetweetButton/>\n<LikeButton/>\n```\n\nTo these lines (passing in the\
    \ counts):\n\n```jsx\n<RetweetButton count={tweet.retweets}/>\n<LikeButton count={tweet.likes}/>\n\
    ```\n\nThen, update the `RetweetButton` and `LikeButton` to accept the new `count`\
    \ prop and render their respective numbers:\n\n```jsx\nfunction getRetweetCount(count)\
    \ {\n  if(count > 0) {\n    return (\n      <span className=\"retweet-count\"\
    >\n        {count}\n      </span>\n    );\n  } else {\n    return null;\n  }\n\
    }\n\nconst RetweetButton = ({ count }) => (\n  <span className=\"retweet-button\"\
    >\n    <i className=\"fa fa-retweet\"/>\n    {getRetweetCount(count)}\n  </span>\n\
    );\n```\n\n```jsx\nconst LikeButton = ({ count }) => (\n  <span className=\"like-button\"\
    >\n    <i className=\"fa fa-heart\"/>\n    {count > 0 &&\n      <span className=\"\
    like-count\">\n        {count}\n      </span>}\n  </span>\n);\n```\n\nFinally,\
    \ the styling needs an update too. Take these lines out:\n\n```css\n.buttons i\
    \ {\n  width: 80px;\n}\n```\n\nThen replace them with this:\n\n```css\n.reply-button,\
    \ .retweet-button,\n.like-button, .more-options-button {\n  width: 80px;\n  display:\
    \ inline-block;\n}\n\n.like-count, .retweet-count {\n  position: relative;\n \
    \ bottom: 2px;\n  font-size: 13px;\n  margin-left: 6px;\n  font-weight: bold;\n\
    }\n```\n\nThere we go!\n\n![Finished Tweet](media/file8.png)\n\nLet’s go over\
    \ the code. Despite looking different, these components have the same logic for\
    \ determining how to show the count.\n\n### RetweetButton\n\nIn `RetweetButton`,\
    \ the computation is extracted into a separate function called `getRetweetCount`.\
    \ It either returns a `<span>` element or `null`.\n\nNotice that we had to introduce\
    \ a wrapper span element around the icon and the count. Remember that React components\
    \ can only return a single element (try removing the span and see what happens).\n\
    \nAlso note that when an expression evaluates to `null` or `false` inside single\
    \ braces within JSX, nothing is rendered at all. To prove it, open up the Dev\
    \ Tools Element Inspector in Chrome and inspect the Retweet button when it has\
    \ 0 likes: there should be no “like-count” span in sight.\n\nIt’s worth noting\
    \ that the `getRetweetCount` function could be written as a component instead\
    \ – it almost is one already. Here’s what that might look like:\n\n```jsx\nfunction\
    \ Count({ count }) {\n  if(count > 0) {\n    return (\n      <span className=\"\
    retweet-count\">\n        {count}\n      </span>\n    );\n  } else {\n    return\
    \ null;\n  }\n}\n\nconst RetweetButton = ({ count }) => (\n  <span className=\"\
    retweet-button\">\n    <i className=\"fa fa-retweet\"/>\n    <Count count={count}\
    \ />\n  </span>\n);\n```\n\nThe function had to be renamed to start with a capital\
    \ letter (remember that component names must start with a capital letter), and\
    \ since its argument needed to be replaced with a destructuring to extract `count`.\
    \ Otherwise it looks the same. Then, using it in `RetweetButton` is just a matter\
    \ of inserting some JSX.\n\n### LikeButton\n\nFor `LikeButton`, the logic is done\
    \ slightly differently. Instead of extracting the logic to a function, it’s done\
    \ inline with a boolean operator (the `&&`). But again, it renders a span, or\
    \ null.\n\n### Another Option\n\nHere’s a third alternative, just for fun, which\
    \ differs slightly in that it will always output a `<span>` with class “like-count”,\
    \ but the contents could be empty:\n\n```jsx\nconst LikeButton = ({ count }) =>\
    \ (\n  <span className=\"like-button\">\n    <i className=\"fa fa-heart\"/>\n\
    \    <span className=\"like-count\">\n      {count ? count : null}\n    </span>\n\
    \  </span>\n);\n```\n\nAs you can see, there’s more than one way to accomplish\
    \ the same thing with JSX.\n\n# PropTypes\n\n## Documentation and Debugging In\
    \ One\n\nWe’ve seen what “props” are, and how they’re passed into React components\
    \ – but what happens if you forget to pass one of the props?\n"
  raw: 'In the static tweet example, `Time` was written as an arrow function, so I’ve
    left it that way. However, because it now has 2 statements, it needs the surrounding
    braces, which then causes it to need a `return`. You could of course simplify
    this by moving the `moment(time).fromNow()` directly inside the `<span>`, and
    then you could remove the `return` and the braces. I’ll leave it up to you.


    ## What Exactly Should Be Passed as a Prop?


    Props can accept all sorts of things: Numbers, Booleans, Strings, Objects, even
    Functions. Early on you might start to wonder, should you pass an object and let
    the component extract what it needs? Or should you pass the specific pieces of
    data that the component requires?


    In the examples here, we’re passing in the specific pieces of data.


    We could instead just pass the `tweet` object itself. For instance, instead of
    passing a timestamp directly to the `Time` component, we could pass in `tweet`
    and let it extract the timestamp from the tweet. Why not do it that way? Here
    are a few reasons:


    *   If `Time` expects a tweet object and pulls out the timestamp property, it
    won’t be usable with anything other than a tweet object. What if you have a user
    with an timestamp property called “updated_at” and want to render it with a `Time`
    component? Well, you can’t, without hacking together a temporary object that “looks
    like” a tweet with a timestamp.


    *   The `Time` component would have knowledge of the inner structure of a `tweet`
    object. This might not seem like a big deal, until you have 10 components like
    this, and the backend developer decides that “timeStamp” with a capital “S” looks
    better than “timestamp” and now you have to update all those components. It’s
    a good idea to keep the knowledge of data structures contained to as few places
    as possible to reduce the cost of change.


    ## Guidelines for Naming Props


    As the saying goes, “There are two hard things in computer science: cache invalidation,
    naming things, and off-by-one errors.”


    The names you choose for props influence how the component will be used, as well
    as how components are coupled. Imagine if we had written `Time` to take a prop
    named `tweetTime`. Even if we passed in the timestamp directly (instead of the
    entire tweet object), this is still not a great choice for a prop name. Why?


    Consider what happens when the next developer comes along (maybe that’s you, 3
    weeks from now) and wants to reuse the `Time` component in a new part of the app
    that has nothing to do with tweets. The rendered result will come out fine, but
    the code will be awkward. Writing `<Time tweetTime={timestamp}/>` expresses the
    wrong intent if the timestamp doesn’t actually belong to a tweet.


    More likely, the developer will look at `Time`, see that it expects a `tweetTime`,
    and then decide not to reuse that component – either because they assume it’s
    not suitable for their purpose, or they worry that its underlying implementation
    could change and break their code.


    #### The Remaining Components


    Let’s get back to converting `Tweet` and its children to use props. There are
    only two components left: `RetweetButton` and `LikeButton`, which need to display
    counts of retweets and likes. Currently, they don’t display any numbers at all,
    just an icon.


    Change these two lines:


    ```

    <RetweetButton/>

    <LikeButton/>

    ```


    To these lines (passing in the counts):


    ```

    <RetweetButton count={tweet.retweets}/>

    <LikeButton count={tweet.likes}/>

    ```


    Then, update the `RetweetButton` and `LikeButton` to accept the new `count` prop
    and render their respective numbers:


    ```

    [](#cb86-1)function getRetweetCount(count) {

    [](#cb86-2)  if(count > 0) {

    [](#cb86-3)    return (

    [](#cb86-4)      <span className="retweet-count">

    [](#cb86-5)        {count}

    [](#cb86-6)      </span>

    [](#cb86-7)    );

    [](#cb86-8)  } else {

    [](#cb86-9)    return null;

    [](#cb86-10)  }

    [](#cb86-11)}

    [](#cb86-12)

    [](#cb86-13)const RetweetButton = ({ count }) => (

    [](#cb86-14)  <span className="retweet-button">

    [](#cb86-15)    <i className="fa fa-retweet"/>

    [](#cb86-16)    {getRetweetCount(count)}

    [](#cb86-17)  </span>

    [](#cb86-18));

    ```


    ```

    [](#cb87-1)const LikeButton = ({ count }) => (

    [](#cb87-2)  <span className="like-button">

    [](#cb87-3)    <i className="fa fa-heart"/>

    [](#cb87-4)    {count > 0 &&

    [](#cb87-5)      <span className="like-count">

    [](#cb87-6)        {count}

    [](#cb87-7)      </span>}

    [](#cb87-8)  </span>

    [](#cb87-9));

    ```


    Finally, the styling needs an update too. Take these lines out:


    ```

    [](#cb88-1).buttons i {

    [](#cb88-2)  width: 80px;

    [](#cb88-3)}

    ```


    Then replace them with this:


    ```

    [](#cb89-1).reply-button, .retweet-button,

    [](#cb89-2).like-button, .more-options-button {

    [](#cb89-3)  width: 80px;

    [](#cb89-4)  display: inline-block;

    [](#cb89-5)}

    [](#cb89-6)

    [](#cb89-7).like-count, .retweet-count {

    [](#cb89-8)  position: relative;

    [](#cb89-9)  bottom: 2px;

    [](#cb89-10)  font-size: 13px;

    [](#cb89-11)  margin-left: 6px;

    [](#cb89-12)  font-weight: bold;

    [](#cb89-13)}

    ```


    There we go!


    ![Finished Tweet](media/file8.png) 


    Let’s go over the code. Despite looking different, these components have the same
    logic for determining how to show the count.


    #### RetweetButton


    In `RetweetButton`, the computation is extracted into a separate function called
    `getRetweetCount`. It either returns a `<span>` element or `null`.


    Notice that we had to introduce a wrapper span element around the icon and the
    count. Remember that React components can only return a single element (try removing
    the span and see what happens).


    Also note that when an expression evaluates to `null` or `false` inside single
    braces within JSX, nothing is rendered at all. To prove it, open up the Dev Tools
    Element Inspector in Chrome and inspect the Retweet button when it has 0 likes:
    there should be no “like-count” span in sight.


    It’s worth noting that the `getRetweetCount` function could be written as a component
    instead – it almost is one already. Here’s what that might look like:


    ```

    [](#cb90-1)function Count({ count }) {

    [](#cb90-2)  if(count > 0) {

    [](#cb90-3)    return (

    [](#cb90-4)      <span className="retweet-count">

    [](#cb90-5)        {count}

    [](#cb90-6)      </span>

    [](#cb90-7)    );

    [](#cb90-8)  } else {

    [](#cb90-9)    return null;

    [](#cb90-10)  }

    [](#cb90-11)}

    [](#cb90-12)

    [](#cb90-13)const RetweetButton = ({ count }) => (

    [](#cb90-14)  <span className="retweet-button">

    [](#cb90-15)    <i className="fa fa-retweet"/>

    [](#cb90-16)    <Count count={count} />

    [](#cb90-17)  </span>

    [](#cb90-18));

    ```


    The function had to be renamed to start with a capital letter (remember that component
    names must start with a capital letter), and since its argument needed to be replaced
    with a destructuring to extract `count`. Otherwise it looks the same. Then, using
    it in `RetweeetButton` is just a matter of inserting some JSX.


    #### LikeButton


    For `LikeButton`, the logic is done slightly differently. Instead of extracting
    the logic to a function, it’s done inline with a boolean operator (the `&&`).
    But again, it renders a span, or null.


    #### Another Option


    Here’s a third alternative, just for fun, which differs slightly in that it will
    always output a `<span>` with class “like-count”, but the contents could be empty:


    ```

    [](#cb91-1)const LikeButton = ({ count }) => (

    [](#cb91-2)  <span className="like-button">

    [](#cb91-3)    <i className="fa fa-heart"/>

    [](#cb91-4)    <span className="like-count">

    [](#cb91-5)      {count ? count : null}

    [](#cb91-6)    </span>

    [](#cb91-7)  </span>

    [](#cb91-8));

    ```


    As you can see, there’s more than one way to accomplish the same thing with JSX.


    # PropTypes


    ## Documentation and Debugging In One


    We’ve seen what “props” are, and how they’re passed into React components – but
    what happens if you forget to pass one of the props?'
