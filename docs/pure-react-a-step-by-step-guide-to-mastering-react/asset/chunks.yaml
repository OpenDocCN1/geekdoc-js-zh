  trans: "\n\n```javascript\nclass Layout extends React.Component {\n  state = {\n\
    \    showSidebar: false\n  }\n\n  toggleSidebar = () => {\n    this.setState({\n\
    \      showSidebar: !this.state.showSidebar\n    });\n  }\n\n  render() {\n  \
    \  const { showSidebar } = this.state;\n    return (\n      <div className=\"\
    layout\">\n        {showSidebar &&\n          <Sidebar\n            onHide={this.toggleSidebar}>\n\
    \            some sidebar content\n          </Sidebar>}\n        <Content\n \
    \         isSidebarVisible={showSidebar}\n          onShowSidebar={this.toggleSidebar}>\n\
    \          some content here\n        </Content>\n      </div>\n    );\n  }\n\
    }\n\nconst Content = ({\n  children,\n  isSidebarVisible,\n  onShowSidebar\n})\
    \ => (\n  <div className=\"content\">\n    {children}\n    {!isSidebarVisible\
    \ && (\n      <button onClick={onShowSidebar}>\n        Show\n      </button>\n\
    \    )}\n  </div>\n));\n\nconst Sidebar = ({\n  onHide,\n  children\n}) => (\n\
    \  <div className=\"sidebar\">\n    {children}\n    <button onClick={onHide}>\n\
    \      Hide\n    </button>\n  </div>\n));\n```\n\n通过这种方式，`Sidebar` 内部并不“知道”自己是否可见。它要么被渲染，要么不被渲染。\n\
    \n将状态保留在父组件中可能会感觉并不自然。乍看之下，这似乎会让 `Sidebar` 难以复用，因为你需要传递一个回调函数，让 `Sidebar` 在需要隐藏时调用它。\n\
    \n相反，包含状态的组件越少，意味着出现 Bug 时需要查找的地方就越少。如果你需要对该状态进行任何操作（例如将其保存到 `localStorage` 以实现跨页面刷新持久化），该逻辑只需要存在一个组件实例中。\n\
    \n浏览器自带了 `localStorage`，你可以使用它在会话之间保存数据。关闭并重新打开浏览器或刷新页面不会清除数据。你可以使用 `localStorage.setItem('showSidebar',\
    \ true)` 保存边栏状态，稍后通过 `localStorage.getItem('showSidebar')` 获取它。\n\n你可以看到，如果 `Sidebar`\
    \ 组件知道如何将自己的状态保存到 `localStorage`，并且应用中有多个 `Sidebar`，那么它们需要一种方法来区分彼此。在 `localStorage`\
    \ 中同一个 `showSidebar` 键会导致冲突，而且 `Sidebars` 并不知道自己位于应用中的哪个位置。\n\n也许父组件可以负责为每个 `Sidebar`\
    \ 传递一个唯一的“id”或“location”。然而，这将把“保存到哪里”的关注点分散在父组件和 `Sidebar` 之间。这导致有两个组件需要处理保存逻辑，而不是一个。更好的设计是将所有与保存相关的逻辑都保留在一个地方，如果状态是与逻辑一起存储的，这样做会更容易实现。\n\
    \n## 组件的“类型”\n\n从架构角度来说，你可以将组件分为两类：`Presentational`（展示型，又称“愚蠢”型）和 `Container`（容器型，又称“智能”型）。\n\
    \n`Presentational components` 是无状态的。它们仅仅接受 props 并根据这些 props 渲染某些元素。无状态意味着组件包含的逻辑更少，并且更容易调试和测试。它们本质上是纯函数。对于给定的\
    \ props 集合，它们总是返回相同的结果，并且不会改变任何内容。理想情况下，你的大多数组件都应该是展示型的。\n\n如上所示，`Sidebar` 是一个展示型组件。`Child`\
    \ 也是，我们前段时间制作的 `Tweet` 组件也是如此。它们接受数据并进行渲染，如果需要处理事件，它们会回调给父组件。其他常见的展示型组件包括按钮、导航栏、链接、图片等。\n\
    \n`Container components` 是有状态的。它们为自己以及任何子组件维护状态，并通过 props 将其传递给它们。它们通常会向子组件传递处理函数，并通过更新其内部状态来响应回调。`Container\
    \ components` 还负责异步通信，例如向服务器发送 AJAX 请求。\n\n上面的 `Parent` 组件是一个展示型组件。可能让你感到惊讶的是，`Page`\
    \ 实际上也是展示型的。展示型组件可以包含 `Container` 组件，而 `Containers` 也可以包含其他组件。\n\n## 输入\n\n现在你已经掌握了状态是如何运作的，我们可以聊聊输入了。React\
    \ 中的输入有两种类型：受控和非受控。\n\n### # 受控输入\n\n它们之所以被称为“受控”的，是因为你负责它们的状态。你需要传递一个值和一个回调作为\
    \ props 传入。\n\n```javascript\nclass ControlledInput extends React.Component {\n\
    \  state = {\n    text: ''\n  }\n\n  handleChange = (event) => {\n    this.setState({\n\
    \      text: event.target.value\n    });\n  }\n\n  render() {\n    return (\n\
    \      <input type=\"text\"\n        value={this.state.text}\n        onChange={this.handleChange}\
    \ />\n    );\n  }\n}\n```\n\n它的工作原理是：在上面的示例中，尝试删除或注释掉 `this.setState` 的调用，然后尝试在框中输入字。什么都不会发生，因为值卡在了初始值上。然后，尝试修改\
    \ `this.setState` 忽略事件数据，而是始终将 text 设置相同的值，如下：\n\n```javascript\nclass TrickInput\
    \ extends React.Component {\n  state = {\n    text: 'try typing something'\n \
    \ }\n\n  handleChange = (event) => {\n    this.setState({\n      text: 'haha nope'\n\
    \    });\n  }\n\n  render() {\n    return (\n      <input type=\"text\"\n    \
    \    value={this.state.text}\n        onChange={this.handleChange} />\n    );\n\
    \  }\n}\n```\n\n你会发现输入框阻碍了你更改它的尝试，还在嘲笑你。\n\n不过，这种方法非常强大。如果你想进行某种自定义验证或格式化，可以在\
    \ `handleChange` 函数中实现。现在，也许你的第一反应是对于一个简单的输入来说这需要很多代码。你没没错，但这种方法确实提供了很大的威力。不想让用户输入数字？在更新状态之前过滤掉数字即可。\n\
    \n"
- fmt: "\n```javascript\nclass NoNumbersInput extends React.Component {\n  // ...\n\
    \n  handleChange = (event) => {\n    let text = event.target.value;\n    text\
    \ = text.replace(/[0-9]/g, '');\n    this.setState({ text });\n  };\n\n  // ...\n\
    }\n```\n\nA little side note – that syntax `this.setState({ text })` is just ES6\
    \ shorthand for `this.setState({ text: text })`. With ES6, if the key is the same\
    \ as the variable name, you don’t have to write it twice.\n\nTry typing some numbers\
    \ in the box. Try pasting in a string that contains numbers. Flawless! No flickering\
    \ or any weird behavior.\n\nYou could format the input as a phone number, or a\
    \ credit card number, or make changes in response to the cursor position. Like\
    \ I said, it’s pretty powerful.\n\nBut maybe you don’t care about all that. You\
    \ just want the input to manage its own state. Uncontrolled inputs will do that,\
    \ but there are a few caveats.\n\n## Uncontrolled Inputs\n\nWhen an input is `uncontrolled`,\
    \ it manages its own internal state. So you can put an `input` on the page like\
    \ this (without a `value` prop):\n\n```javascript\nconst EasyInput = () => (\n\
    \  <input type=\"text\" />\n);\n```\n\nType in it, do whatever you like. It works\
    \ normally. If you want to get a value out of it, you can pass an `onChange` prop\
    \ and respond to the events. The problem with this is that you can’t easily extract\
    \ a value at will. You still need to listen to the changes, and keep track of\
    \ the “most recent value” somewhere.\n\nUncontrolled inputs can be given a `defaultValue`\
    \ prop, and the component will be initialized with that value. After that initial\
    \ render though, if you want to change the value you’ll need to use a controlled\
    \ input.\n\n## The Component Lifecycle\n\nEvery React component goes through a\
    \ `lifecycle` as it’s rendered on screen. There are a sequence of methods called\
    \ in a specific order. Some of them only run once, and some run multiple times.\n\
    \nFor most of the components you build, tapping into the lifecycle methods won’t\
    \ be necessary. But when you need them, you need them. Whether you need to make\
    \ AJAX calls to fetch data, insert your own nodes into the DOM, or set up timers,\
    \ the lifecycle methods are the place to do it.\n\nHere’s the entire lifecycle\
    \ of a component:\n\n![Lifecycle Methods](media/file30.png)\n\n### Usage\n\nTapping\
    \ in to a lifecycle hook is as simple as adding the appropriate function to your\
    \ component class. Lifecycle methods are only available to `class` components,\
    \ not functional ones.\n\nHere’s an example that uses every lifecycle method.\
    \ Run it, click the button, and watch the console to see the order in which they’re\
    \ called.\n\n```javascript\nimport React from 'react';\nimport ReactDOM from 'react-dom';\n\
    \nclass LifecycleDemo extends React.Component {\n  state = {counter: 0};\n\n \
    \ constructor(props) {\n    super(props);\n    console.log('Constructing...');\n\
    \    console.log('State already set to:', this.state);\n  }\n\n  componentWillMount()\
    \ {\n    console.log('About to mount...');\n  }\n\n  componentDidMount() {\n \
    \   console.log('Mounted.');\n  }\n\n  componentWillReceiveProps(nextProps) {\n\
    \    console.log('Current props:', this.props);\n    console.log('Next props:',\
    \ nextProps);\n  }\n\n  shouldComponentUpdate(nextProps, nextState) {\n    console.log('Deciding\
    \ to update');\n    return true;\n  }\n\n  componentWillUpdate(nextProps, nextState)\
    \ {\n    console.log('About to update...');\n  }\n\n  componentDidUpdate() {\n\
    \    console.log('Updated.');\n  }\n\n  componentWillUnmount() {\n    console.log('Goodbye\
    \ cruel world.');\n  }\n\n  handleClick = () => {\n    this.setState({\n     \
    \ counter: this.state.counter + 1\n    });\n  };\n\n  render() {\n    console.log('Rendering...');\n\
    \    return (\n      <div>\n        <span>Counter: {this.state.counter}</span>\n\
    \        <button onClick={this.handleClick}>Increment</button>\n      </div>\n\
    \    );\n  }\n}\nReactDOM.render(<LifecycleDemo/>, document.querySelector('#root'));\n\
    ```\n"
