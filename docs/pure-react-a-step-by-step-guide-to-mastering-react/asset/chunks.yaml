  trans: "\n\n```javascript\nfunction LikeButton() {\n  return (\n    <i className=\"\
    fa fa-heart like-button\"/>\n  );\n}\n\n// 这可以被重写为一个\n// 匿名函数：\n\nconst LikeButton\
    \ = function() {\n  return (\n    <i className=\"fa fa-heart like-button\"/>\n\
    \  );\n}\n\n// ...这可以转换为一个\n// 箭头函数：\n\nconst LikeButton = () => {\n  return (\n\
    \    <i className=\"fa fa-heart like-button\"/>\n  );\n}\n\n// 它可以进一步简化为：\n\n\
    const LikeButton = () => (\n  <i className=\"fa fa-heart like-button\"/>\n);\n\
    \n// 如果它真的很简单，\n// 你甚至可以把它写成一行：\n\nconst Hi = () => <<span>>Hi</span>;\n```\n\n\
    箭头函数是编写组件的一种非常简洁的方式。函数本身就是 `() => { ... }` 部分。\n\n注意看在最后几个版本中没有 `return`：当一个箭头函数只包含一个表达式时，可以不带大括号编写。当不带大括号编写时，该唯一的表达式会被隐式返回。\n\
    \n随着本书的进行，你将继续使用箭头函数，所以不要担心它们现在看起来很陌生。你会习惯的。\n\n### The let 和 const 关键字\n\n如果你熟悉\
    \ C 或 Java 等语言，那么你熟悉块级作用域（block scoping）。正如你可能知道的，JavaScript 的 `var` 实际上是函数作用域的，而不是块作用域。这长期以来一直是一个麻烦。\n\
    \nES6 增加了 `let` 和 `const` 作为声明块作用域变量的新方式。\n\n`let` 关键字定义了一个可变的（changeable）变量。你几乎可以在任何地方用它来代替\
    \ `var`。\n\n`const` 定义了一个常量。如果你尝试重新给变量赋值，它会报错，但值得注意的是，它并不能防止你修改变量内部的数据。这里有一个例子：\n\
    \n```javascript\nconst answer = 42;\nanswer = 43;   // error!\n\nconst numbers\
    \ = [1, 2, 3];\nnumbers[0] = 'this is fine'; // no error\n```\n\n使用 `const` 更多的是一种意图信号，而不是一种无懈可击的保护方案，但它仍然值得这样做。\n\
    \n现在我们已经有了所有新组件，再次更新 `Tweet` 组件以包含它们：\n\n```javascript\nfunction Tweet() {\n \
    \ return (\n    <div className=\"tweet\">\n      <Avatar/>\n      <div className=\"\
    content\">\n        <NameWithHandle/><Time/>\n        <Message/>\n        <div\
    \ className=\"buttons\">\n          <ReplyButton/>\n          <RetweetButton/>\n\
    \          <LikeButton/>\n          <MoreOptionsButton/>\n        </div>\n   \
    \   </div>\n    </div>\n  );\n}\n```\n\n最后，添加更多样式来覆盖时间和按钮部分：\n\n```css\n.time\
    \ {\n  padding-left: 0.3em;\n  color: #8899a6;\n}\n\n.time::before {\n  content:\
    \ \"\\00b7\";\n  padding-right: 0.3em;\n}\n\n.buttons {\n  margin-top: 10px;\n\
    \  margin-left: 2px;\n  font-size: 1.4em;\n  color: #aab8c2;\n}\n\n.buttons i\
    \ {\n  width: 80px;\n}\n```\n\n这里我们有一条看起来相当不错的推文了！\n\n![最终推文](img/file7.png)\n\
    \n你可以随心意愿对其进行定制：更改名称、句柄、消息，甚至是 Gravatar 图标。很酷，对吧？\n\n“但是……等一下，”我听到你在说。“我以为我们我们要。”\n\
    \n"
- fmt: '

    You can read `{ name }` as “extract the ‘name’ key from the object passed as the
    first argument”. It can extract multiple keys, too:


    ```javascript

    [](#cb67-1)const Hello = ({ firstName, lastName }) => (

    [](#cb67-2)  <span>Hello, {firstName} {lastName}</span>

    [](#cb67-3));

    ```


    In practice, props are very often written using this destructuring syntax. Just
    so you know, it works outside of function arguments as well. You can destructure
    props this way, for instance:


    ```javascript

    [](#cb68-1)const Hello = (props) => {

    [](#cb68-2)  const { name } = props;

    [](#cb68-3)  return (

    [](#cb68-4)    <span>Hello, {name}</span>

    [](#cb68-5)  );

    [](#cb68-6)}

    ```


    Remember, arrow functions need a `return` if the body is surrounded by braces,
    and it needs braces if the body contains multiple lines.


    ### Modifying Props


    One important thing to know is that props are `read-only`. Components that receive
    props must not change them.


    If you come from an Angular background this is a change. Angular’s 2-way binding
    mechanism allowed modifying scope variables (Angular’s version of props) and would
    automatically propagate those changes to the parent component.


    In React, data flows `one way`. Props are read-only, and can only be passed `down`
    to children.


    ### Communicating With Parent Components


    If you can’t change props, but you need to communicate something up to a parent
