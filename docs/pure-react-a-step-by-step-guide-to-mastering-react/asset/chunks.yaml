  trans: "\n\n由于导入的是自己的文件而不是 `node_modules` 中的内容，因此路径需要是相对路径（`./time`），而不是简单的模块名（`time`）。\n\
    \n然后，我们可以更新 `FileListItem`。注意 `Time` 不会渲染 `<td>`，所以我们必须将其包裹在其中：\n\n```javascript\n\
    const FileListItem = ({ file }) => (\n  <tr className=\"file-list-item\">\n  \
    \  {getFileName(file)}\n    <CommitMessage commit={file.latestCommit} />\n   \
    \ <td className=\"age\">\n      <Time time={file.updated_at}/>\n    </td>\n  </tr>\n\
    );\nFileListItem.propTypes = {\n  file: PropTypes.object.isRequired\n};\n```\n\
    \n添加一点样式……：\n\n```css\n.age {\n  width: 125px;\n  text-align: right;\n  padding-right:\
    \ 4px;\n}\n```\n\n它运行起来了！\n\n![带有 Time 的界面](img/file24.png)\n\n但我必须说，这段代码看起来并不好看。我们以\
    \ 3 种不同的方式渲染了 3 个组件，甚至为了规避 React 的限制而使用了奇怪的 `getFileName`。如果组件看起来像这样会好得多：\n\n\
    ```javascript\nconst FileListItem = ({ file }) => (\n  <tr className=\"file-list-item\"\
    >\n    <td><FileIcon file={file} /></td>\n    <td><FileName file={file} /></td>\n\
    \    <td><CommitMessage commit={file.latestCommit} /></td>\n    <td><Time time={file.updated_at}\
    \ /></td>\n  </tr>\n);\nFileListItem.propTypes = {\n  file: PropTypes.object.isRequired\n\
    };\n```\n\n### 重构\n\n在这一阶段，我本可以回去修改示例，让代码看起来更好。但我把它留在了原样，并以此作为一个示例：有时（也许是经常），代码写出来的结果可能并不像你想象的那么整洁。在与某个决定相处一段时间之前，你可能还没有完全意识到它的影响。\n\
    \n现实情况往往会产生干扰。你忘记了表格单元格必须是行的直接子元素，或者过于遵循设计稿，导致你走上了一条产生糟糕代码的道路。\n\n但没有什么是永久的！现在是重构这段代码的完美时机（事实上，你将在练习中完成这一点）。\n\
    \n当你埋头写代码时……当你的脑海中突然跳出一个念头：“等等！这些组件完全无法复用，因为每一个组件都包含一个表格单元格！”……好吧，听从那个声音。尽早重构，经常重构。\n\
    \n## 练习\n\n1. 重构 GitHub 文件列表示例，让没有任何组件返回表格单元格（`<td>`）。每个组件都应该返回 `<span>` 或 `<div>`。这使得它们更具复用性，并且应该极大改进\
    \ `FileList` 内部的代码。如有必要修改 CSS。\n\n2. 在实际应用中，大多数时候你希望每个文件只有一个组件。有时，一个文件会包含几个相关的组件，且这些组件总是被一起使用（如之前的\
    \ `Nav`/`NavItem` 示例），否则它们应该是分开的。重构练习 1 中的代码，使用 `import` 和 `export` 将组件提取到单独的文件中\n\
    \n3. 现在你知道如何使用 `Array` 的 `.map` 函数来创建列表了。复用之前的 `Tweet` 组件并创建一个推文列表。\n\n列表无处不在。有人说，大多数\
    \ Web 应用基本上只是一堆列表。请实现网络上这些网站的界面。遵循我们已经过的几次的流程——突出屏幕上哪些部分将作为组件，给它们命名，然后构建它们。\n\n\
    ### 4. Trello\n\n尝试渲染单个卡片列表。为了更多练习，请并排渲染多个卡片列表。\n\n（截图来自 [`trello.com`](https://trello.com））\n\
    \n![Trello](img/file25.png)\n\n### 5. Hacker News\n\n实现故事列表。为了更多练习，也请实现头部部分。\n\
    \n（截图来自 [`news.ycombinator.com/news`](https://news.ycombinator.com/news））\n\n\
    ![HN](img/file26.png)\n\n### 6. Pinterest\n\n实现图片卡片列表。为了更多练习，也请实现头部（考虑复用之前的 `Nav`\
    \ 和 `NavItem` 组件）。\n\n（截图来自 [`www.pinterest.com/aviationhd/`](https://www.pinterest.com/aviationhd/））\n\
    \n![Pinterest](img/file27.png)\n\n### 7. InternetRadio 流派云\n\n你能想出一个好的方法来调整按钮大小，让它们逐渐变大吗？\n\
    \n（截图来自 [`www.internet-radio.com/`](https://www.internet-radio.com/））\n\n![音乐流派](img/file28.png)\n\
    \n# State\n\n到目前为止，我们一直使用 `props` 向组件传递数据。但 `props` 是只读的。如果你需要跟踪可以更改的数据怎么办？这就是\
    \ `state`（状态）用用场。\n\n为了看到 `state` 有用，让我们回顾 Props 章节中的一个示例。这里有一个包含 `Child` 组件的\
    \ `Parent` 组件。`Parent` 传递了一个函数，`Child` 每次点击按钮时都会调用该函数：\n\n## 示例：计数器\n\n```javascript\n\
    function handleAction(event) {\n  console.log('Child did:', event);\n}\n\nfunction\
    \ Parent() {\n  return (\n    <Child onAction={handleAction}/>\n  );\n}\n\nfunction\
    \ Child({ onAction }) {\n  return (\n    <button onClick={onAction}>\n      点击我\n\
    \    </button>\n  );\n}\n```\n\n如果我们想让 `Parent` 跟踪按钮被点击的次数呢？换句话说，`Parent` 应该跟踪它的\
    \ `handleAction` 函数被调用了多少次。\n\n为了这一点，`Parent` 需要 3 个新东西：一个计数器设置为 0 的 `initial\
    \ state`、一次调用 `this.setState` 来增加计数器，以及一种显示当前计数的方法。\n\n但记住，函数组件是没有状态的。要让 `Parent`\
    \ 具有状态，它需要被转换为 ES6 `class` 组件。\n\n这是 `Parent` 的新版本，重命名为 `CountingParent`——确保你更新了对\
    \ `ReactDOM.render` 的调用！\n\n```javascript\nclass CountingParent extends React.Component\
    \ {\n  state = {\n    actionCount: 0\n  }\n\n  handleAction = (action) => {\n\
    \    console.log('Child says', action);\n    // actionCount 增加了，并且\n    // 新计数替换了旧的计数\n\
    \    this.setState({\n      actionCount: this.state.actionCount + 1\n    });\n\
    \  }\n\n  render() {\n    return (\n      <div>\n        <Child onAction={this.handleAction}/>\n\
    \        <p>已点击 {this.state.actionCount} 次</p>\n      </div>\n    );\n  }\n}\n\
    ```\n\n`Child` 组件完全不需要更改。尝试一下吧！点击按钮。看着它递增。噢。啊。真棒的计数器。\n\n好了，也许增加一个数字并不是什么开创性的成就，但让我们看看这里发生了什么。\n\
    \n当组件首次被实例化时，它的初始状态是通过 `state = {...}` 属性初始化器设置的。虽然这种语法不是 ES6 的正式部分，但它被 Babel\
    \ 和 Create React App 支持，并在 React 社区中广泛使用。（另一种方法是在*构造函数*中设置初始状态，我们稍后会看到）。\n\n接下来，你点击按钮，就像它要求你的那样。按钮的\
    \ `onClick` 处理程序被调用。在这种情况下，它是 `onAction` prop，它最终调用了 `CountingParent` 中的 `handleAction`\
    \ 函数。`handleAction` 函数记录了一条消息，然后调用 `this.setState` 并传入一个描述新状态的对象。\n\n"
- fmt: "\nThe `setState` function will update the state and then re-render the component\
    \ and all of its children. So that`at’s what happens next: `CountingParent`’s\
    \ `render` function is called, which looks at `this.state.actionCount`, which\
    \ has now been incremented to 1. Or 2, or some other number if you’ve been click-happy\
    \ with that button.\n\nNote that every instance of a component has its own state.\
    \ If you have two `CountingParent` components on the page, they’ll each have counters\
    \ that will start at 0 and increment independently. You can prove this to yourself\
    \ by creating a component that contains a few `CountingParent`s:\n\n```\nconst\
    \ Page = () => (\n  <div>\n    <CountingParent/>\n    <CountingParent/>\n    <CountingParent/>\n\
    \  </div>\n);\n```\n\nMake sure to update the `ReactDOM.render` call to render\
    \ a `Page` instead of a `CountingParent`. Now click those buttons and watch the\
    \ counters change independently.\n\n### Exercise: Reset Button\n\nHere’s a quick\
    \ exercise: add a ‘Reset’ button to `CountingParent` that resets the counter to\
    \ 0 when clicked. Just put the `button` directly inside `CountingParent`.\n\n\
    Once that’s working, refactor your code to move the ‘Reset’ button down into `Child`.\n\
    \n## setState Is Asynchronous\n\nI lied to you up there. I’m sorry. I implied\
    \ that the `setState` function would immediately update the state and call `render`.\
    \ That’s not really what happens. The `setState` function is actually *asynchronous*.\n\
    \nIf you call `setState` and immediately `console.log(this.state)`, it will very\
    \ likely print the old state instead of the one you just set.\n\nIf you need to\
    \ set the state and immediately act on that change, you can pass in a callback\
    \ function like this:\n\n```javascript\nthis.setState({name: 'Joe'}, function()\
    \ {\n  // called after state has been updated\n  // and the component has been\
    \ re-rendered\n});\n```\n\n### Functional setState\n\nAnother way to make it so\
    \ that sequential state updates run in sequence is to use the *functional* form\
    \ of `setState`, like this:\n\n```javascript\nthis.setState((state, props) =>\
    \ {\n  return {\n    value: state.value + 1\n  }\n});\n```\n\nIn this form, you\
    \ pass a function to `setState`. The function receives the current state and props\
    \ as arguments, and it is expected to return the desired new state. If you were\
    \ to run a few of these sequentially…\n\n```javascript\nthis.setState((state,\
    \ props) => {\n  return {\n    value: state.value + 1\n  }\n});\nthis.setState((state,\
    \ props) => {\n  return {\n    value: state.value + 1\n  }\n});\nthis.setState((state,\
    \ props) => {\n  return {\n    value: state.value + 1\n  }\n});\n```\n\nThis would\
    \ work as expected, eventually incrementing `value` by 3. It works because calling\
    \ `setState` “queues” the updates in the order they’re called, and when they’re\
    \ executed, they receive the latest state as an argument instead of using a potentially-stale\
    \ `this.state`.\n\nA side benefit to the functional style of `setState` is that\
    \ the state update functions can be extracted from the class and reused because\
    \ they are “pure” – that is, they only operate on their arguments, they don’t\
    \ modify the arguments, and they return a new value. A “pure” function has no\
    \ side effects, which means that calling it multiple times with the same arguments\
    \ will always return the same result.\n\n## Shallow vs Deep Merge\n\nWhen you\
    \ call `setState`, whether you call it with an object or in the functional form,\
    \ the result is that it will *shallow merge* the properties in your object with\
    \ the curren state. Here’s how that works.\n\nThe “shallow merging” behavior means\
    \ that if you have a state like this:\n\n```javascript\n{\n  score: 7,\n  user:\
    \ {\n    name: \"somebody\",\n    age: 26\n  },\n  products: [ /*...*/ ]\n}\n\
    ```\n\nAnd then you do `this.setState({ score: 42 })`, the new state will be:\n\
    \n```javascript\n{\n  score: 42,          // new!\n  user: {             // unchanged\n\
    \    name: \"somebody\", // unchanged\n    age: 26           // unchanged\n  },\n\
    \  products: [ /* unchanged */ ]\n}\n```\n\nThat is, it *merges* the object you\
    \ pass to `setState` (or return from the functional version) with the existing\
    \ state. It doesn’t erase the existing state.\n\nIf instead you run `this.setState({\
    \ user: { age: 4 } })` then it would replace the entire `user` object with the\
    \ new one:\n\n```javascript\n{\n  score: 7,\n  user: {\n    age: 4\n  },\n  products:\
    \ [ /*...*/ ]\n}\n```\n"
  raw: 'The `setState` function will update the state and then re-render the component
    and all of its children. So that’s what happens next: `CountingParent`’s `render`
    function is called, which looks at `this.state.actionCount`, which has now been
    incremented to 1\. Or 2, or some other number if you’ve been click-happy with
    that button.


    Note that every instance of a component has its own state. If you have two `CountingParent`
    components on the page, they’ll each have counters that will start at 0 and increment
    independently. You can prove this to yourself by creating a component that contains
    a few `CountingParent`s:


    ```

    [](#cb139-1)const Page = () => (

    [](#cb139-2)  <div>

    [](#cb139-3)    <CountingParent/>

    [](#cb139-4)    <CountingParent/>

    [](#cb139-5)    <CountingParent/>

    [](#cb139-6)  </div>

    [](#cb139-7));

    ```


    Make sure to update the `ReactDOM.render` call to render a `Page` instead of a
    `CountingParent`. Now click those buttons and watch the counters change independently.


    ### Exercise: Reset Button


    Here’s a quick exercise: add a ‘Reset’ button to `CountingParent` that resets
    the counter to 0 when clicked. Just put the `button` directly inside `CountingParent`.


    Once that’s working, refactor your code to move the ‘Reset’ button down into `Child`.


    ## setState Is Asynchronous


    I lied to you up there. I’m sorry. I implied that the `setState` function would
    immediately update the state and call `render`. That’s not really what happens.
    The `setState` function is actually *asynchronous*.


    If you call `setState` and immediately `console.log(this.state)`, it will very
    likely print the old state instead of the one you just set.


    If you need to set the state and immediately act on that change, you can pass
    in a callback function like this:


    ```

    [](#cb140-1)this.setState({name: ''Joe''}, function() {

    [](#cb140-2)  // called after state has been updated

    [](#cb140-3)  // and the component has been re-rendered

    [](#cb140-4)});

    ```


    ### Functional setState


    Another way to make it so that sequential state updates run in sequence is to
    use the *functional* form of `setState`, like this:


    ```

    [](#cb141-1)this.setState((state, props) => {

    [](#cb141-2)  return {

    [](#cb141-3)    value: state.value + 1

    [](#cb141-4)  }

    [](#cb141-5)});

    ```


    In this form, you pass a function to `setState`. The function receives the current
    state and props as arguments, and it is expected to return the desired new state.
    If you were to run a few of these sequentially…


    ```

    [](#cb142-1)this.setState((state, props) => {

    [](#cb142-2)  return {

    [](#cb142-3)    value: state.value + 1

    [](#cb142-4)  }

    [](#cb142-5)});

    [](#cb142-6)this.setState((state, props) => {

    [](#cb142-7)  return {

    [](#cb142-8)    value: state.value + 1

    [](#cb142-9)  }

    [](#cb142-10)});

    [](#cb142-11)this.setState((state, props) => {

    [](#cb142-12)  return {

    [](#cb142-13)    value: state.value + 1

    [](#cb142-14)  }

    [](#cb142-15)});

    ```


    This would work as expected, eventually incrementing `value` by 3\. It works because
    calling `setState` “queues” the updates in the order they’re called, and when
    they’re executed, they receive the latest state as an argument instead of using
    a potentially-stale `this.state`.


    A side benefit to the functional style of `setState` is that the state update
    functions can be extracted from the class and reused because they are “pure” –
    that is, they only operate on their arguments, they don’t modify the arguments,
    and they return a new value. A “pure” function has no side effects, which means
    that calling it multiple times with the same arguments will always return the
    same result.


    ## Shallow vs Deep Merge


    When you call `setState`, whether you call it with an object or in the functional
    form, the result is that it will *shallow merge* the properties in your object
    with the curren state. Here’s how that works.


    The “shallow merging” behavior means that if you have a state like this:


    ```

    [](#cb143-1){

    [](#cb143-2)  score: 7,

    [](#cb143-3)  user: {

    [](#cb143-4)    name: "somebody",

    [](#cb143-5)    age: 26

    [](#cb143-6)  },

    [](#cb143-7)  products: [ /*...*/ ]

    [](#cb143-8)}

    ```


    And then you do `this.setState({ score: 42 })`, the new state will be:


    ```

    [](#cb144-1){

    [](#cb144-2)  score: 42,          // new!

    [](#cb144-3)  user: {             // unchanged

    [](#cb144-4)    name: "somebody", // unchanged

    [](#cb144-5)    age: 26           // unchanged

    [](#cb144-6)  },

    [](#cb144-7)  products: [ /* unchanged */ ]

    [](#cb144-8)}

    ```


    That is, it *merges* the object you pass to setState (or return from the functional
    version) with the existing state. It doesn’t erase the existing state.


    If instead you run `this.setState({ user: { age: 4 } })` then it would replace
    the entire `user` object with the new one:


    ```

    [](#cb145-1){

    [](#cb145-2)  score: 7,   // unchanged

    [](#cb145-3)  user: {     // new!

    [](#cb145-4)    age: 4    // no more ''name''

    [](#cb145-5)  },

    [](#cb145-6)  products: [ ... ],  // unchanged

    [](#cb145-7)}

    ```


    A “deep” merge would peek into the `user` object and only update its `age` property
    while leaving the rest alone. A “shallow” merge overwrites the whole `user` object
    with the new one.


    ## Handling Events


    We’ve seen a few components that take an `onClick` prop. This is just one of many
    events that React components can handle. In fact, React components can respond
    to every event that plain old HTML elements can, for the most part.


    The convention is that React’s events are named with camelCase like `onClick`,
    `onSubmit`, `onKeyDown`… whereas the HTML events are all lowercase (`onclick`,
    `onsubmit`, `onkeydown`). React will actually warn you if you use the wrong capitalization:


    > Warning: Unknown event handler property onclick. Did you mean `onClick`?


    At least one event differs by more than just capitalization: `ondblclick` is renamed
    to `onDoubleClick`. A complete list of events can be found in the [official Facebook
    docs](https://facebook.github.io/react/docs/events.html).


    Your event handler function will receive the `event` object, which looks a lot
    like a native browser event. It has the standard `stopPropagation` and `preventDefault`
    functions if you need to prevent bubbling or cancel a form submission, for example.
    It’s not actually a native event object though – it is a `SyntheticEvent`.


    The `event` object passed to a handler function is only valid right at that moment.
    The SyntheticEvent object is *pooled* for performance. Instead of creating a new
    one for every event, React replaces the contents of the one single instance.


    If you print it out with `console.log(event)`, the instance logged to the console
    will be cleared out by the time you go to look at it. You also can’t access it
    asynchronously (say, after a timeout). If you *need* to access it asynchronously,
    you can call `event.persist()` and React will keep it around for you.


    ## What to Put in State


    How do you decide what should go into state? Is there anywhere else to store persistent
    data?


    As a general rule, data that is stored in state should be referenced inside `render`
    somewhere. Component state is for storing *UI state* – things that affect the
    visual rendering of the page. This makes sense because any time state is updated,
    the component will re-render.


    If modifying a piece of data does not visually change the component, that data
    shouldn’t go into *state*. Here are some things that make sense to put in state:


    *   User-entered input (values of text boxes and other form fields)


    *   Current or selected item (the current tab, the selected row)


    *   Data from the server (a list of products, the number of “likes” on a page)


    *   Open/closed state (modal open/closed, sidebar expanded/hidden)


    Other stateful data, like handles to timers, should be stored on the component
    instance itself. You’ve got a `this` object available in class components classes,
    feel free to use it!


    ## Thinking Declaratively'
