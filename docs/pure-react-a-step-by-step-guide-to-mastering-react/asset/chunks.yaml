    [](#cb183-1)class App extends Component {

    [](#cb183-2)  // ...

    [](#cb183-3)

    [](#cb183-4)  renderContent() {

    [](#cb183-5)    switch(this.state.activeTab) {

    [](#cb183-6)      default:

    [](#cb183-7)      case 0:

    [](#cb183-8)        return (

    [](#cb183-9)          <ItemPage

