  trans: "\n\n在这里，`handleClick` 函数将只在组件首次渲染时被创建`once`。这解决了问题（`render` 不再创建函数），但代价是代码变得更加复杂（需要一个全新的组件！）。这是一种权衡，当你自己在自己的项目中遇到这个问题时，它是值得考虑的。\n\
    \n## 创建 ItemPage\n\n让我们关注待售列表。我们将创建一个新组件来显示这些数据。创建一个名为 `ItemPage.js` 的文件并输入以下内容：\n\
    \n```javascript\nimport React from 'react';\nimport PropTypes from 'prop-types';\n\
    import './ItemPage.css';\n\nfunction ItemPage({ items }) {\n  return (\n    <ul\
    \ className=\"ItemPage-items\">\n      {items.map(item =>\n        <li key={item.id}\
    \ className=\"ItemPage-item\">\n          {item.name}\n        </li>\n      )}\n\
    \    </ul>\n  );\n}\nItemPage.propTypes = {\n  items: PropTypes.array.isRequired\n\
    };\n\nexport default ItemPage;\n```\n\n这里没什么新内容：我们只是在遍历一个项目列表并渲染它们。由于单个项目的内容将比仅仅一个“名称”要复杂得多，我们稍后会将其提取到自己的组件中。\n\
    \n此组件依赖于 `ItemPage.css`，该文件尚不存在。创建该文件并添加此 CSS 来设置样式：\n\n```css\n.ItemPage-items\
    \ {\n  margin: 0;\n  padding: 0;\n}\n.ItemPage-items li {\n  list-style: none;\n\
    \  margin-bottom: 20px;\n}\n```\n\n我们需要一些要出售的项目。我们将像以前一样在这里使用静态数据。\n\n即使我有可以返回真实数据的服务器，我也喜欢从静态数据开始。当没有动态部分时，你可以很快地从无到有。而且老实，当屏幕上有我可以调整的东西时，这更有趣。\n\
    \n创建一个名为 `static-data.js` 的文件（在 `src` 目录下）并粘贴这段代码。\n\n```javascript\nlet items\
    \ = [\n  {\n    id: 0,\n    name: \"Apple iPad Mini 2 16GB\",\n    description:\
    \ \"与众不同的 iPad. 16GB, WiFi, 4G.\",\n    price: 229.00\n  },\n  {\n    id: 1,\n\
    \    name: \"Apple iPad Mini 2 32GB\",\n    description: \"比 16GB 的更大。\",\n  \
    \  price: 279.00\n  },\n  {\n    id: 2,\n    name: \"Canon T7i\",\n    description:\
    \ \"高像素的单反相机。\",\n    price: 749.99\n  },\n  {\n    id: 3,\n    name: \"Apple\
    \ Watch Sport\",\n    description: \"一块手表\",\n    price: 249.99\n  },\n  {\n \
    \   id: 4,\n    name: \"Apple Watch Silver\",\n    description: \"一块更贵的手表\",\n\
    \    price: 599.99\n  }\n];\n\nexport {items};\n```\n\n然后，我们将这些项目传递给新的 `ItemPage`\
    \ 组件。回到 `App.js` 中，导入 `ItemPage` 和静态的 `items` 数据。\n\n```javascript\nimport ItemPage\
    \ from './ItemPage';\nimport {items} from './static-data';\n```\n\n然后更新 `renderContent`\
    \ 函数以使用新的 ItemPage：\n\n```javascript\nclass App extends Component {\n  // ...\n\
    \  renderContent() {\n    switch(this.state.activeTab) {\n      default:\n   \
    \   case 0: return <ItemPage items={items}/>\n      case 1: return <span>Cart</span>;\n\
    \    }\n  }\n  // ...\n}\n```\n\n现在，你应该能看到一些项目正在渲染了！\n\n![项目正在渲染](img/file38.png)\
    \ \n\n## 创建 Item\n\n现在让我们创建真正的 `Item` 组件供 `ItemList` 使用。它将接收一个 `item` prop，我们还希望将其加入购物车，所以它也应该接收一个\
    \ `onAddToCart` prop。\n\n此组件将是无状态的。它的职责是显示项目，并在点击“加入购物车”按钮时让父组件知道。\n\n借鉴 GitHub\
    \ 的示例，我们不会从此组件返回一个 `<li>`。我们不希望强制使用 `Item` 的用户将其放在 `<ul>` 内部。父组件可以根据自己的选择将此项目放入\
    \ `<li>` 中。\n\n基于这一点，创建 `src/Item.js` 和 `src/Item.css`。在 `src/Item.js` 中编写组件：\n\
    \n```javascript\nimport React from 'react';\nimport PropTypes from 'prop-types';\n\
    import './Item.css';\n\nconst Item = ({ item, onAddToCart }) => (\n  <div className=\"\
    Item\">\n    <div className=\"Item-left\">\n      <div className=\"Item-image\"\
    \ />\n      <div className=\"Item-title\">\n        {item.name}\n      </div>\n\
    \      <div className=\"Item-description\">\n        {item.description}\n    \
    \  </div>\n    </div>\n    <div className=\"Item-right\">\n      <div className=\"\
    Item-price\">\n        {item.price}\n      </div>\n      <button className=\"\
    ItemaddToCart\" onClick={onAddToCart}>\n        Add to Cart\n      </button>\n\
    \    </div>\n  </div>\n);\nItem.propTypes = {\n  item: PropTypes.object.isRequired,\n\
    \  onAddToCart: PropTypes.func.isRequired\n};\n\nexport default Item;\n```\n\n\
    现在让我们将其连接到 `ItemPage` 组件。在 `ItemPage.js` 中，将代码更新如下：\n\n```javascript\nimport React\
    \ from 'react';\nimport PropTypes from 'prop-types';\nimport Item from './Item';\n\
    import './ItemPage.css';\n\nfunction ItemPage({ items, onAddToCart }) {\n  return\
    \ (\n    <ul className=\"ItemPage-items\">\n      {items.map(item =>\n       \
    \ <li key={item.id} className=\"ItemPage-item\">\n          <Item\n          \
    \  item={item}\n            onAddToCart={() => onAddToCart(item)} />\n       \
    \ </li>\n      )}\n    </ul>\n  );\n}\nItemPage.propTypes = {\n  items: PropTypes.array.isRequired,\n\
    \  onAddToCart: PropTypes.func.isRequired\n};\n\nexport default ItemPage;\n```\n\
    \n我们正在导入 `Item`，现在我们在 `<li>` 内部渲染 `Item` 组件而不仅仅是项目名称。新增加的是 `onAddToCart` prop\
