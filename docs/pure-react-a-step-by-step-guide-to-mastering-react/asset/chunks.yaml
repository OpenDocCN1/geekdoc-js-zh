    [](#cb154-62)ReactDOM.render(\n[](#cb154-63)  <LifecycleDemo/>,\n[](#cb154-64)\
    \  document.querySelector('#root')\n[](#cb154-65));\n```\n\n### Mounting\n\nThese\
    \ methods are called only once, when the component first mounts.\n\n**constructor**:\
    \ This is the first method called when your component is created. If `state` is\
    \ initialized with a property initializer, as shown above, then it will already\
    \ be set by the time the constructor executes.\n\n**componentWillMount**: Called\
    \ immediately *before* your component mounts for the first time. Children are\
    \ mounted before the parent, so each child’s `componentWillMount` will be called\
    \ called before the parent.\n\n**componentDidMount**: Called immediately *after*\
    \ the first render. The component’s children are already rendered at this point,\
    \ too. This is a good place to make AJAX requests to fetch any data you need.\n\
    \n### Updating\n\nThese are called, in order, before and after each render. None\
    \ of them are called during the initial render.\n\n**componentWillReceiveProps(nextProps)**:\
    \ This is passed the `nextProps` that will be received. Old props are still available\
    \ as `this.props`, and you can call `this.setState` if necessary.\n\n**shouldComponentUpdate(nextProps,\
    \ nextState)**: This is an opportunity to prevent rendering if you know that props\
    \ and state have not changed. The default implementation always returns `true`.\
    \ If you return `false`, the render will not occur (and children will not render\
    \ either), and the remaining lifecycle methods will be skipped.\n\n**componentWillUpdate(nextProps,\
    \ nextState)**: Rendering is a foregone conclusion at this point. Use this to\
    \ do any prep work before `render` is called. You *cannot* call `this.setState`\
    \ from within this method.\n\n**render**: You know this one well. It fits in the\
    \ lifecycle right between `componentWillUpdate` and `componentDidUpdate`.\n\n\
    **componentDidUpdate**: Render is done. You can use this opportunity to operate\
    \ on the DOM if you need to. Prior to this, DOM nodes could still be in flux.\n\
    \n### Unmounting\n\n**componentWillUnmount**: The component is about to be unmounted.\
    \ Maybe its item was removed from a list, maybe the user navigated to another\
    \ tab… whatever the case, this component’s time is numbered. You should invalidate\
    \ any timers you created (using `clearInterval()` or `clearTimeout()`), disable\
    \ event handlers (with `removeEventListener()`), and perform any other necessary\
    \ cleanup.\n\n# Example: Shopping Site\n\nIn this example we’ll build a simple\
    \ shopping site that will demonstrate some of the things we’ve covered.\n\nHere’s\
    \ what it will look like when we’re done. It’ll have a page full of items to buy:\n\
    \n![Items page](media/file31.png) \n\nAnd it will have a shopping cart showing\
    \ the selected items, with +/- buttons and a count for each one:\n\n![Cart page](media/file32.png) \n\
    \n### Break Into Components\n\nFollowing the same steps as before, let’s start\
    \ by breaking down the app into its components and giving them names. Here is\
    \ the Items page:\n\n![Annotated Items Page](media/file33.png) \n\nAnd here is\
    \ the Cart page:\n\n![Annotated Items Page](media/file34.png) \n\nThere’s also\
    \ a top-level “App” component which contains everything else."
