    This way `Sidebar` doesn’t internally “know” whether it’s visible. It is either
    rendered, or not rendered.


    Keeping the state in a parent component might feel unnatural. It might even seem
    at first glance like this would make `Sidebar` hard to reuse, since you need to
    pass a callback function that `Sidebar` can call when it needs to hide.


    On the contrary, having fewer components containing state means fewer places to
    look when a bug appears. And if you need to do anything with that state, for instance,
    save it to localStorage to persist across page reloads, that logic only needs
    to exist in one component instance.


    Browsers come with `localStorage`, a place you can use to save data between sessions.
    Closing and reopening the browser or refreshing the page won’t clear the data.
    You could save the Sidebar state with `localStorage.setItem(''showSidebar'', true)`
    and later retrieve it with `localStorage.getItem(''showSidebar'')`.


    You can see that if the `Sidebar` component knew how to save its own state to
    localStorage, and there were multiple Sidebars in the app, they would need a way
    to differentiate themselves. A single `showSidebar` key in localStorage would
    lead to conflicts, and the Sidebars don’t know where in the app they reside.


    Perhaps the parents could be responsible for passing down a unique “id” or “location”
    to each `Sidebar`. However, that would split the concern of “where to save” between
    both the parent and the Sidebar. That makes *two* components that need to know
    about saving, rather than one. A better design would keep all of the saving-related
    logic in one place, and that is easier to do if the state is stored alongside
    it.


    ## “Kinds” of Components


    Architecturally, you can segment components into two kinds: *Presentational* (a.k.a
    “Dumb”) and *Container* (a.k.a. “Smart”).


    *Presentational components* are stateless. They simply accepts props and render
    some elements based on those props. Being stateless means that the component will
    contain less logic, and will be easier to debug and test. They are, in essence,
    pure functions. They always return the same result for a given set of props, and
    they don’t *change* anything. Ideally, most of your components will be presentational.


    `Sidebar`, as written above, is a presentational component. So is `Child`, and
    so is the `Tweet` component we made a while back. They accept data and render
    it, and if events need to be handled, they call back up to the parent. Other kinds
    of common presentational components include buttons, navigation bars, links, images,
    etc.


    *Container components* are stateful. They maintain state for themselves and any
    child components, and pass it down to them via props. They usually pass down handler
    functions to children, and respond to callbacks by updating their internal state.
    Container components are also responsible for asynchronous communication, such
    as AJAX calls to the server.


    The `Parent` component, above, is a presentational component. Perhaps surprisingly,
    `Page` is actually presentational. Presentational components can contain Container
    components, and Containers can contain Presentational components – there aren’t
    any strict rules for nesting.


    In an ideal world, you’d try to organize your app so that the components at the
    very top level (and maybe one level below that) are containers, and everything
    under them is presentational. In the real world this is difficult to achieve because
    you might have nested inputs that contain their own state. That’s okay though
    – perfection is not the goal.


    # Input Controls


    Now that you’ve got a handle on how state works, we can talk about handling user
    input.


    Input controls in React come in two flavors: *controlled* and *uncontrolled*.


    ## Controlled Inputs


    The reason they’re called “controlled” is because you are responsible for controlling
    their state. You need to pass in a value, and keep that value updated as the user
    types. It’s a little more work, but after you write a few of them it will become
    second nature.


    Remember how state works: a value and a callback function are passed as props,
    and the parent component is responsible for reacting to changes and passing an
    updated value to the child.


    ```

    [](#cb150-1)class ControlledInput extends React.Component {

    [](#cb150-2)  state = { text: '''' };

    [](#cb150-3)

    [](#cb150-4)  handleChange = (event) => {

    [](#cb150-5)    this.setState({

    [](#cb150-6)      text: event.target.value

    [](#cb150-7)    });

    [](#cb150-8)  };

    [](#cb150-9)

    [](#cb150-10)  render() {

    [](#cb150-11)    return (

    [](#cb150-12)      <input type="text"

    [](#cb150-13)        value={this.state.text}

    [](#cb150-14)        onChange={this.handleChange} />

    [](#cb150-15)    );

    [](#cb150-16)  }

    [](#cb150-17)}

    ```


    It works like this:


    Now, maybe your first reaction is that this seems like a lot of code for a simple
    input. You’re not wrong, but this method does provide a lot of power.


    In the example above, try removing or commenting out the call to `this.setState`,
    then try to type in the box. Nothing happens, because the value is stuck at the
    initial value.


    Then, try changing `this.setState` to ignore the event data, instead always setting
    the text to the same value, like this:


    ```

    [](#cb151-1)class TrickInput extends React.Component {

    [](#cb151-2)  state = {

    [](#cb151-3)    text: ''try typing something''

    [](#cb151-4)  };

    [](#cb151-5)

    [](#cb151-6)  handleChange = (event) => {

    [](#cb151-7)    this.setState({

    [](#cb151-8)      text: ''haha nope''

    [](#cb151-9)    });

    [](#cb151-10)  };

    [](#cb151-11)

    [](#cb151-12)  render() {

    [](#cb151-13)    return (

    [](#cb151-14)      <input type="text"

    [](#cb151-15)        value={this.state.text}

    [](#cb151-16)        onChange={this.handleChange} />

    [](#cb151-17)    );

    [](#cb151-18)  }

    [](#cb151-19)}

    ```


    You’ll see that the input thwarts your attempts to change it, and mocks you too.


    This is very powerful though. If you want to do some kind of custom validation,
    or formatting, you can do that in the `handleChange` function. Don’t want the
    user to type numbers? Strip out the numbers before updating the state:'
