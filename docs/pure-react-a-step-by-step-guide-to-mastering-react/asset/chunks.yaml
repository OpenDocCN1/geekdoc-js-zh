    }\n.Item-addToCart:hover {\n  background-color: #FFDDB2;\n}\n.Item-addToCart:active\
    \ {\n  background-color: #ED8400;\n  color: #fff;\n  outline: none;\n}\n.Item-addToCart:focus\
    \ {\n  outline: none;\n}\n.Item-left {\n  flex: 1;\n}\n.Item-right {\n  display:\
    \ flex;\n  flex-direction: column;\n  justify-content: space-between;\n}\n```\n\
    \n这样看起来好多了：\n\n![带有样式效果](img/file40.png) \n\n# 创建 CartPage\n\n现在我们已经可以将商品添加到购物车中了，接下来我们将构建渲染购物车本身的组件。\n\
    \n创建 `src/CartPage.css` 和 `src/CartPage.js`，并打开 `CartPage.js`。初始代码将与 `ItemPage`\
    \ 中的代码非常相似。\n\n```javascript\nimport React from 'react';\nimport PropTypes from\
    \ 'prop-types';\nimport Item from './Item';\nimport './CartPage.css';\n\nfunction\
    \ CartPage({ items }) {\n  return (\n    <ul className=\"CartPage-items\">\n \
    \     {items.map(item =>\n        <li key={item.id} className=\"CartPage-item\"\
    >\n          <Item item={item} />\n        </li>\n      )}\n    </ul>\n  );\n\
    }\nCartPage.propTypes = {\n  items: PropTypes.array.isRequired\n};\n\nexport default\
    \ CartPage;\n```\n\n这只是简单地渲染它接收到的商品。你会注意到我们没有向 `Item` 传递 `onAddToCart` 处理程序，这会导致\
    \ prop 警告。我们稍后会修复这个问题。\n\n### 将商品传递给 CartPage\n\n购物车需要商品来显示。问题在于，我们的 `cart` 状态只包含商品索引，而不是实际商品。此外，当商品被多次添加时，会出现重复的索引。我们需要将\
    \ `cart` 状态转换为适合传递给 `CartPage` 的商品数组。\n\n在 `App.js` 顶部导入 `CartPage`：\n\n```javascript\n\
    import CartPage from './CartPage';\n```\n\n然后添加一个 `renderCart` 函数，并更新 `renderContent`\
    \ 来调用它。\n\n```javascript\nclass App extends Component {\n  // ...\n\n  renderContent()\
    \ {\n    switch(this.state.activeTab) {\n      default:\n      case 0:\n     \
    \   return (\n          <ItemPage\n            items={items}\n            onAddToCart={this.handleAddToCart}\
    \ />\n        );\n      case 1:\n        return this.renderCart();\n    }\n  }\n\
    \n  renderCart() {\n    // 统计购物车中每种商品的数量\n    let itemCounts = this.state.cart.reduce((itemCounts,\
    \ itemId) => {\n      itemCounts[itemId] = itemCounts[itemId] || 0;\n      itemCounts[itemId]++;\n\
    \      return itemCounts;\n    }, {});\n\n    // 创建商品数组\n    let cartItems = Object.keys(itemCounts).map(itemId\
    \ => {\n      // 根据 id 查找商品\n      var item = items.find(item =>\n        item.id\
    \ === parseInt(itemId, 10)\n      );\n\n      // 创建一个也包含 'count' 属性的新“商品”\n  \
    \    return {\n        ...item,\n        count: itemCounts[itemId]\n      };\n\
    \    });\n\n    return (\n      <CartPage items={cartItems} />\n    );\n  }\n\
    }\n```\n\n## reduce\n\n`reduce` 函数是如下代码的函数式简写：\n\n```javascript\nconst a = [1,\
    \ 2, 3, 4];\nlet total = 0;\nfor(let i = 0; i < a.length; i++) {\n  total += a[i];\n\
    }\n```\n\n每当你想要遍历数组的值以创建一个聚合结果时，可以考虑使用 `reduce`。\n\n```javascript\nconst a = [1,\
    \ 2, 3, 4];\nlet total = a.reduce((sum, value) => {\n  return sum + value;\n},\
    \ 0);\n```\n\n`reduce` 函数接收一个回调函数和一个可选的初始值。回调函数会在数组的每个元素上被调用一次，并传递累加值和当前元素。\n\n\
    ## Object.keys\n\n`Object.keys` 返回对象中所有键的数组。例如 `Object.keys({a: 1, b: 2})` 将返回\
    \ `['a', 'b']`。对象没有像数组那样的内置 `forEach` 函数，所以 `Object.keys` 让遍历键变得更加容易。\n\n### 修改购物车\n\
    \n此时此，“购物车”标签页应该可以工作了。点击“加入购物车”几个商品，然后切换到“购物车”标签页，商品应该在那那里了。我们仍然有“加入购物车”按钮，并且收到了关于\
    \ `onAddToCart` 的 propType 警告。接下来我们将修复这两个问题。\n\n![购物车已工作](img/file41.png)\n\n\
    尽管购物车可以工作了，但它还缺少重要的功能。没有添加或删除商品的方法，没有总价，而且我们不知道购物车中每种商品有多少个。\n\n记得我们在 `CartPage`\
    \ 内部重用 `Item` 组件吗？如果我们可以渲染一个自定义的 `Item`，用“添加”和“移除”按钮来代替“加入购物车”按钮，那就太好了。\n\n这个问题有几种解决方法。\n\
    \n一种想法：我们可以复制 `Item` 组件，将其重命名为 `CartItem`，并根据需要进行自定义。这种方法快速简单，但会导致代码重复。\n\n另一种想法：我们可以让\
    \ `Item` 接收一个 prop，告诉它它是“普通商品”还是“购物车商品”。使用该 prop，`Item` 将决定渲染“加入购物车”按钮还是“添加/移除”按钮。这种方法行得通，但很凌乱——`Item`\
    \ 承担了多个职责。如果以后在第三种情况下需要重用 `Item`，我们可能会添加更多的条件逻辑，导致 `Item` 变得越来越难以理解和维护。\n\n"
- fmt: "\nA third idea is to pass children to `Item` and let it decide where to put\
    \ them. This is the idea we’ll implement. It makes `Item` fairly reusable. If\
    \ you want an “Add to Cart” button, pass that in. If you want Add/Remove buttons\
    \ instead, pass those in. Let’s see how this works.\n\n### Refactoring Item\n\n\
    The new `Item` and its `propTypes` looks like this:\n\n```javascript\nconst Item\
    \ = ({ item, children }) => (\n  <div className=\"Item\">\n    <div className=\"\
    Item-left\">\n      <div className=\"Item-image\" />\n      <div className=\"\
    Item-title\">{item.name}</div>\n      <div className=\"Item-description\">{item.description}</div>\n\
    \    </div>\n    <div className=\"Item-right\">\n      <div className=\"Item-price\"\
    >${item.price}</div>\n      {children}\n    </div>\n  </div>\n);\nItem.propTypes\
    \ = {\n  item: PropTypes.object.isRequired,\n  children: PropTypes.node\n};\n\
    ```\n\nWhere once there was a `<button>`, we now have `{children}` instead. Also,\
    \ `Item` no longer needs to know about the `onAddToCart` function, so we’ve removed\
    \ its propType.\n\nIf you refresh at this point, you’ll see that the “Add to Cart”\
    \ buttons are gone from the Cart page *and* the Items page. To fix that, open\
    \ up `ItemPage.js` and pass a `<button>` as a child of the `Item`:\n\n```javascript\n\
    function ItemPage({ items, onAddToCart }) {\n  return (\n    <ul className=\"\
    ItemPage-items\">\n      {items.map(item =>\n        <li key={item.id} className=\"\
    ItemPage-item\">\n          <Item item={item}>\n            <button\n        \
    \      className=\"Item-addToCart\"\n              onClick={() => onAddToCart(item)}>\n\
    \              Add to Cart\n            </button>\n          </Item>\n       \
    \ </li>\n      )}\n    </ul>\n  );\n}\n```\n\nThere we go, back to normal. Now\
    \ for the new part: open `CartPage.js`, and inside `Item`, pass in the plus/minus\
    \ buttons and the item count. We’re also going to need handler functions for when\
    \ an item is added or removed.\n\n```javascript\nfunction CartPage({ items, onAddOne,\
    \ onRemoveOne }) {\n  return (\n    <ul className=\"CartPage-items\">\n      {items.map(item\
    \ =>\n        <li key={item.id} className=\"CartPage-item\">\n          <Item\
    \ item={item}>\n            <div className=\"CartItem-controls\">\n          \
    \    <button\n                className=\"CartItem-removeOne\"\n             \
    \   onClick={() => onRemoveOne(item)}&ndash;</button>\n              <span className=\"\
    CartItem-count\">{item.count}</span>\n              <button\n                className=\"\
