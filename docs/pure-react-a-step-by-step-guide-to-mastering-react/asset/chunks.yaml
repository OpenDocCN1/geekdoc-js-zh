    ### 修改 Props


    需要知道的一个重要点是 props 是`只读的`。接收 props 的组件不能修改它们。


    如果你来自 Angular 背景，这是一个变化。Angular 的双向绑定机制允许修改作用域变量（Angular 版本的 props），并并将这些更改传播到父组件。


    在 React 中，数据流是`单向的`。Props 是只读的，且只能`向下`传递给子组件。


    ### 与父组件通信


    如果你不能更改 props，但需要向父组件传递某些信息，该如何操作？


    如果子组件需要向父组件发送数据，父组件可以注入一个 `function` 作为 prop，如下：


    ```javascript

    [](#cb69-1)function handleAction(event) {

    [](#cb69-2)  console.log(''Child did:'', event);

    [](#cb69-3)}

    [](#cb69-4)

    [](#cb69-5)function Parent() {

    [](#cb69-6)  return (

    [](#cb69-7)    <Child onAction={handleAction}/>

    [](#cb69-8)  );

    [](#cb69-9)}

    ```


    `Child` 组件接收一个名为 `onAction` 的 prop，它可以在需要发送数据或通知父组件事件时随时调用它。你会注意到内置的 `button`
    元素接受一个 `onClick` prop，它会在按钮被点击时调用。我们稍后会深入探讨事件处理。


    ```javascript

    [](#cb70-1)function Child({ onAction }) {

    [](#cb70-2)  return (

    [](#cb70-3)    <button onClick={onAction}/>

    [](#cb70-4)  );

    [](#cb70-5)}

    ```


