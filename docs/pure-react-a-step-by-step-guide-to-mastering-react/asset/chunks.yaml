    [](#cb121-49)// 将 testFiles 作为 FileList 的 file prop 传递\n```\n\n它看起来应该是这样的，非常简陋（虽然不美观但很有用）：\n\
    \n在数组上进行映射（mapping）是 React 中渲染项目列表的方法。\n\n## “key” Prop\n\n`<tr>` 上的 `key` prop\
    \ 是一个特殊的 prop，每当你渲染元素数组时都是必须的。React 使用它在重新渲染期间调和差异时区分组件。如果你想了解更多关于为什么 `key` 重要的细节，请阅读关于[调和算法](https://facebook.github.io/react/docs/reconciliation.html)\
    \ 的官方文档。\n\n每当你使用 `map` 渲染数组时，你需要在最顶层元素上使用 `key`。React 在渲染之前会消耗 `key` prop，因此你传递\
    \ `key` 的组件实际上并不会接收到该 prop。\n\n在实践中，重要的是对于数组中的每个元素，`key` 应该是**稳定的（stable）**、**永久的（permanent）**且**唯一的（unique）**。\n\
    \n*   **稳定 (Stable)**：无论元素在数组中的位置如何，它应该始终具有相同的 key。这意味着 `key={index}` 是一个坏主意。\n\
    *   **永久 (Permanent)**：元素的 key 在不同渲染之间不能更改。这意味着 `key={Math.random()}` 是一个坏主意。\n\
    *   **唯一 (Unique)**：没有两个元素应该有相同的 key。\n\n如果一个项目有一个唯一的 ID，那么它是 `key` 的绝佳选择。如果项目没有\
    \ ID，尝试使用哈希函数，或者使用 [shortid](https://www.npmjs.com/package/shortid) 等库生成唯一 ID。\n\
    \n项目的数组索引不是一个好的选择，因为如果索引发生了变化（例如在数组开头添加元素），React 对索引的映射就会过时。之前是索引“0”的元素现在变成了“1”，但\
    \ React 并不知道这一点，这可能会导致难以诊断的渲染错误。\n\n### FileListItem\n\n通常情况下创建一个独立的组件来渲染列表中的单个项目是一个好主意，所以我们现在这样做。尽管这个示例很小，可以不管，但我们将将其提取出来以演示这个过程。\n\
    \n注意我们仍然需要传递 `key` prop。`key` 需要直接分配给数组中的顶层组件，而不是它们的子元素。\n\n"
- fmt: "\n```javascript\nconst FileList = ({ files }) => (\n  <table className=\"\
    file-list\">\n    <tbody>\n      {files.map(file =>\n        /* now we use FileListItem\
    \ here */\n        <FileListItem key={file.id} file={file}/>\n      )}\n    </tbody>\n\
    \  </table>\n);\nFileList.propTypes = {\n  files: PropTypes.array\n};\n\nconst\
    \ FileListItem = ({ file }) => (\n  /* this code has been extracted from FileList\
    \ */\n  <tr className=\"file-list-item\">\n    <td className=\"file-name\">{file.name}</td>\n\
    \  </tr>\n);\nFileListItem.propTypes = {\n  file: PropTypes.object.isRequired\n\
    };\n```\n\nWe’ll also add some CSS to make it more presentable. Open `src/index.css`\
    \ and replace its contents with this code:\n\n```css\n.file-list {\n  font-family:\
    \ Helvetica, sans-serif;\n  width: 980px;\n  color: #333;\n  margin: 0 auto;\n\
    \  border: 1px solid #ccc;\n  border-collapse: collapse;\n}\n\n.file-list td {\n\
    \  border-top: 1px solid #ccc;\n}\n\n.file-name {\n  padding: 4px;\n  max-width:\
    \ 180px;\n}\n```\n\nDon’t forget to add the line to import the CSS file if you\
    \ haven’t already (`import './index.css'`).\n\n![FileList](media/file21.png) \n\
    \nNow that we’ve got some basic structure in place, we can add the remaining components\
    \ to the row component. `FileIcon`, `FileName`, `CommitMessage`, and `Time`.\n\
    \nLet’s take care of `FileIcon` and `FileName` first, since they’re nested together.\
    \ Try to write the code yourself before looking ahead. This is a weird one.\n\n\
    Here’s `FileIcon`. This one is straightforward – a stateless component written\
    \ as a plain function.\n\n```javascript\nfunction FileIcon({ file }) {\n  let\
    \ icon = 'fa-file-text-o';\n  if(file.type === 'folder') {\n    icon = 'fa-folder';\n\
    \  }\n\n  return (\n    <td className=\"file-icon\">\n      <i className={`fa\
    \ ${icon}`}/>\n    </td>\n  );\n}\nFileIcon.propTypes = {\n  file: PropTypes.object.isRequired\n\
    };\n```\n\nHere is `getFileName`, which, if you look closely, is not a component.\n\
    \n```javascript\nfunction getFileName(file) {\n  return [\n    <FileIcon file={file}\
    \ key={0}/>\n    <td className=\"file-name\" key={1}>{file.name}</td>\n  ];\n\
    }\n```\n\nThis is just a function that takes a `file` and returns an array of\
    \ elements. Components cannot return arrays without wrapping them with an element.\
    \ Why write it this way?\n\nThe problem is that we’re inside a table row (`<tr>`)\
    \ and we need two `<td>`s next to each other, but a true component cannot return\
    \ a bare array without a wrapper.\n\nYou could avoid this problem entirely by\
    \ writing `FileIcon` and `FileName` as separate components that each return a\
    \ `<td>` cell (rather than nesting `FileIcon` inside `FileName` like we’re doing\
    \ here). That is arguably a better solution than this! I left it this way to show\
    \ this edge case in case you run into a situation where it’s unavoidable. Avoid\
    \ this kind of thing if you can.\n\nAt the time of writing, React 16 (a.k.a. React\
    \ Fiber) is just around the corner, and promises to solve this problem of returning\
    \ multiple elements from a component. You can track the progress of Fiber at [http://isfiberreadyyet.com/](http://isfiberreadyyet.com/).\n\
    \nNotice that we’re passing hardcoded values for `key`, here. Didn’t I just say\
    \ not to do that?\n\nYeah, this is normally a bad idea, but because this array\
    \ will always have 2 elements in that specific order, it won’t cause a problem\
    \ here. The `key` is required because we’re returning an array, and elements in\
    \ an array must have a `key`.\n\nHere’s the updated `FileListItem` that uses the\
    \ `getFileName` function:\n\n```javascript\nconst FileListItem = ({ file }) =>\
    \ (\n  <tr className=\"file-list-item\">\n    {getFileName(file)}\n  </tr>\n);\n\
    FileListItem.propTypes = {\n  file: PropTypes.object.isRequired\n};\n```\n\nAlright,\
    \ with that weirdness out of the way, let’s add some CSS and see how it looks.\n\
    \n```css\n.file-icon {\n  width: 17px;\n  padding-left: 4px;\n}\n\n.file-icon\
    \ .fa-folder {\n  color: #508F;\n}\n```\n\n![With FileName](media/file22.png)\n\
    \n### CommitMessage\n\nLet’s add the `CommitMessage` component. This one is straightforward\
    \ – so is the CSS. We’ll use `CommitMessage` inside `FileListItem`.\n\n```javascript\n\
    const FileListItem = ({ file }) => (\n  <tr className=\"file-list-item\">\n  \
    \  {getFileName(file)}\n  </tr>\n);\nFileListItem.propTypes = {\n  file: PropTypes.object.isRequired\n\
    };\n```\n\n```css\n.commit-message {\n  max-width: 44px;\n  padding-left: 10px;\n\
    \  overflow: hidden;\n}\n```\n\n![With CommitMessage](media/file23.png)\n\nNotice\
    \ that we’re passing the commit itself instead of the file object. `CommitMessage`\
    \ doesn’t need to know anything about files, the fewer components that have knowledge\
    \ of data, the better.\n\n### Time\n\nWe’ll add the `Time` component now. We’re\
    \ going to need Moment.js, so install that:\n\n`npm install --save moment`\n\n\
    Then create the file `time.js` and paste in the `Time` component. earlier into\
    \ its own file.\n\n```javascript\nimport React from 'react';\nimport PropTypes\
    \ from 'prop-types';\nimport moment from 'moment';\n\nconst Time = ({ time })\
    \ => {\n  const timeString = moment(time).fromNow();\n  return (\n    <span className=\"\
    time\">\n      {timeString}\n    </span>\n  );\n};\nTime.propTypes = {\n  time:\
    \ PropTypes.string.isRequired\n};\n\nexport default Time;\n```\n\nAlright, let’s\
    \ use `Time` inside `FileListItem`. First we need to import it, so add this line\
    \ to the top of `index.js`:\n\n```javascript\nimport Time from './time';\n```\n"
