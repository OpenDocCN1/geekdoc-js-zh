    \ a {\n[](#cb163-2)  cursor: pointer;\n[](#cb163-3)}\n[](#cb163-4).App-nav-item\
    \ a:hover {\n[](#cb163-5)  color: #999;\n[](#cb163-6)}\n[](#cb163-7).App-nav-item.selected\
    \ {\n[](#cb163-8)  border-bottom-color: #FFAA3F;\n[](#cb163-9)}\n```\n\nHere’s\
    \ what it should look like now:\n\n![Cart tab selected](media/file37.png) \n\n\
    ### Arrow Function onClick\n\nYou’ll notice that we’re passing an arrow function\
    \ to the `onClick` handlers here. At first glance this may look strange. You might\
    \ think `onClick={onTabChange(0)}` looks better.\n\nBut remember, props are evaluated\
    \ *before* they’re passed down. When written without the arrow function, `onTabChange`\
    \ would be called *when Nav renders*, instead of when the link is clicked. That’s\
    \ not what we want. Wrapping it in an arrow function delays execution until the\
    \ user clicks the link.\n\n### Creating Functions in Render: Bad?\n\nAnother note\
    \ about this: it’s generally a bad idea to create new functions to pass into props\
    \ like the code above, but it’s worth understanding why, so you can apply the\
    \ rule when it makes sense.\n\nThe reason it’s bad to create new functions is\
    \ for performance: not because functions are expensive to create, but because\
    \ passing a new function down to a *pure* component every time it renders means\
    \ that it will always see “new” props, and therefore always re-render (needlessly).\n\
    \nAvoid creating a new function in render when (a) the child component receiving\
    \ the function prop is *pure* and (b) you expect the parent component to re-render\
    \ often.\n\nFunction components and classes that extend `Component` are not pure.\
    \ They will *always* re-render, even if their props haven’t changed. If a class\
    \ extends `PureComponent` instead, though, it *is* pure and it will skip re-rendering\
    \ when its props are unchanged. Avoiding needless re-renders is the easiest way\
    \ to improve performance in a React app.\n\nThe `Nav` component above will probably\
    \ not re-render very often, but for the sake of example, how would you get rid\
    \ of the arrow functions? Here’s one way to do it:\n\n```\n[](#cb164-1)const Nav\
    \ = ({ activeTab, onTabChange }) => (\n[](#cb164-2)  <nav className=\"App-nav\"\
    >\n[](#cb164-3)    <ul>\n[](#cb164-4)      <li className={`App-nav-item ${activeTab\
    \ === 0 && 'selected'}`}>\n[](#cb164-5)        <NavLink index={0} onClick={onTabChange}>Items</NavLink>\n\
    [](#cb164-6)      </li>\n[](#cb164-7)      <li className={`App-nav-item ${activeTab\
    \ === 1 && 'selected'}`}>\n[](#cb164-8)        <NavLink index={1} onClick={onTabChange}>Cart</NavLink>\n\
    [](#cb164-9)      </li>\n[](#cb164-10)    </ul>\n[](#cb164-11)  </nav>\n[](#cb164-12));\n\
    [](#cb164-13)\n[](#cb164-14)class NavLink extends React.Component {\n[](#cb164-15)\
    \  handleClick = () => {\n[](#cb164-16)    this.props.onClick(this.props.index);\n\
    [](#cb164-17)  }\n[](#cb164-18)\n[](#cb164-19)  render() {\n[](#cb164-20)    return\
    \ (\n[](#cb164-21)      <a onClick={this.handleClick}>\n[](#cb164-22)        {this.props.children}\n\
    [](#cb164-23)      </a>\n[](#cb164-24)    );\n[](#cb164-25)  }\n[](#cb164-26)}\n\
    ```"
