  trans: "\n我们已经看到 JSX 如何像 HTML 一样表达嵌套组件。我们也看到自定义组件可以接受 `props` 作为参数，并使用这些 `props`\
    \ 来渲染内容或将它们传递给子组件。\n\n还有一个我们还没有讨论过的特殊 `prop`：它被称为 `children`。\n\n假设你想创建一个可复用的\
    \ `IconButton` 组件，它看起来像这样：\n\n![IconButton](img/file14.png) \n\n你可能想象是这样使用它：\n\
    \n```jsx\n<IconButton>Do The Thing</IconButton>\n```\n\n那个内部文本“Do The Thing”会发生什么呢？这正是\
    \ `children` prop 派上用场的地方。\n\n你必须在组件的某个地方显式地渲染 `children`。如果不这样做，它们就会被忽略。例如，如果\
    \ `IconButton` 组件如下所示：\n\n```jsx\nfunction IconButton() {\n  return (\n    <button>\n\
    \      <i class=\"target-icon\"/>\n    </button>\n  );\n}\n```\n\n渲染出来的组件将是一个带有图标的按钮，*没有任何文本*。它看起来像这样：\n\
    \n![IconButton](img/file15.png) \n\n通过微小的调整，我们可以将文本放在图标之后：\n\n```jsx\nfunction\
    \ IconButton({ children }) {\n  return (\n    <button>\n      <i class=\"target-icon\"\
    />\n      {children}\n    </button>\n  );\n}\n```\n\n## Children 的不同类型\n\n无论只有一个子元素还是多个子元素，`children`\
    \ prop 始终是复数形式 `children`。此外，`children` 的类型会根据它包含的内容改变。\n\n当有多个子元素时，`children`\
    \ 是一个 `ReactElements` 数组。\n\n然而，当只有一个子元素时，它是一个 `single ReactElement`。这看起来可能有点奇怪：如果\
    \ `children` 始终是一个数组，处理起来不是更容易吗？\n\n嗯，是的，如此。但由于 `children` 使用得非常频繁，且单子元素的使用场景足够常见，因此\
    \ React 团队决定在只有一个子元素时不分配数组，以优化性能。\n\n## 处理 Children\n\nReact 提供了了一些实用函数来处理这种不透明的数据结构。\n\
    \n- `React.Children.map(children, function)`\n- `React.Children.forEach(children,\
    \ function)`\n- `React.Children.count(children)`\n- `React.Children.only(children)`\n\
    - `React.Children.toArray(children)`\n\n前两个 `map` 和 `forEach` 的工作方式与 JavaScript\
    \ 内置 `Array` 上的方法相同。它们接受 `children`（无论是单个元素还是数组）以及一个会为每个元素调用的函数。`forEach` 遍历子元素但不返回任何内容，而\
    \ `map` 返回一个由你提供的函数返回的值组成的数组。\n\n`count` 的作用非常言而易见：它返回 `children` 中项的数量。\n\n`toArray`\
    \ 同样直观：它将 `children` 转换为一个扁平数组，无论它原本是否为数组。\n\n`only` 返回那个唯一的子元素，如果存在多一个子元素，则抛出异常。\n\
    \n你可以单独访问每个子元素，因此可以重新排序它们、删除某些元素、插入新元素、将子元素传递给更深层的子元素等等。\n\n## 用于 Children 的 PropTypes\n\
    \n如果你想让你的组件接受零、一个或多个子元素，使用 `.node` 验证器：\n\n```jsx\npropTypes: {\n  children: PropTypes.node\n\
    }\n```\n\n如果你想让它只接受单个子元素，使用 `element` 验证器：\n\n```jsx\npropTypes: {\n  children:\
    \ PropTypes.element\n}\n```\n\n请注意，这期望一个单个 `React Element` 作为子元素。这意味着它必须是一个自定义组件，或者像\
    \ `<div>` 这样的标签。如果你传递字符串或数字，`PropTypes.element` 将发出警告。如果你需要允许元素*或*字符串，可以这样使用 `oneOfType`\
    \ 验证器：\n\n```jsx\npropTypes: {\n  children: PropTypes.oneOfType([\n    PropTypes.element,\n\
    \    PropTypes.string\n  ])\n}\n```\n\n与任何其他 `propType` 一样，除非附加了 `.isRequired`，否则它们都是可选的。\n\
    \n## 与 Angular 中的 Transclusion（插值）对比\n\n如果你用过 Angular，你可能熟悉“transclusion”（插值）的概念，这是\
    \ Angular 使用的一个自造词，意思是“获取指令的子元素并将它们插入到 `ng-transclude` 所在的地方”。\n\nReact 的 `children`\
    \ prop 是类似的概念，但更强大，而且稍微更容易理解。\n\n## 一个更有有趣的示例\n\n在上面的示例中，我们简单地插入了一些文本。如果我们想做一些更有表现力的事情，比如创建我们自定义的组件层次结构呢？\n\
    \n想象我们为表达导航栏构建了某种自己的“API”：\n\n```jsx\n<Nav>\n  <NavItem url='/'>Home</NavItem>\n\
    \  <NavItem url='/about'>About</NavItem>\n  <NavItem url='/contact'>Contact</NavItem>\n\
    </Nav>\n```\n\n使用 `children` prop，`Nav` 组件可以执行诸如在每个项目之间插入分隔符的操作：\n\n```jsx\nfunction\
    \ Nav({ children }) {\n  let items = React.Children.toArray(children);\n  for(let\
    \ i = items.length - 1; i >= 1; i--) {\n    items.splice(i, 0, \n      <span key={i}\
    \ className='separator'>|</span>\n    );\n  }\n  return (\n    <div>{items}</div>\n\
    \  );\n}\n```\n\n该代码将子元素转换为数组，然后从后向前遍历，在每个现有元素之间插入新元素。\n\n你将在接下来的练习中实现 `NavItem`。它可以渲染一个简单的链接，或者链接旁边的图标，或者你喜欢的任何内容。\n\
    \n## 练习\n\n现在你已经看到了 `children` prop 是如何工作的，这里有一些练习可以加深你的理解。\n\n1. 创建一个组件来显示一个像这样的“错误框”：\n\
    \n![An error box](img/file16.png) \n\n调用该组件应该如下：\n\n```jsx\n<ErrorBox>\n  Something\
    \ has gone wrong\n</ErrorBox>\n```\n\n使用 `children` prop 将文本正确放置。上面的图片使用了 [Bootstrap](http://getbootstrap.com/getting-started/#download-cdn)\
    \ 进行样式处理，使用了 [Font Awesome](https://www.bootstrapcdn.com/fontawesome/) 用于图标。如果你喜欢，可以将这些库添加到你的\
    \ `public/index.html` 文件中。\n\n2. 每个 React 组件都有一个 `type` 属性，这意味着你可以通过 `React.Children.forEach`\
    \ 遍历来检查子元素的类型。\n\n创建我们看过的 `Nav` 和 `NavItem` 组件。`NavItem` 应该接受 `url` prop 和链接文本作为子元素，然后渲染一个指向该\
    \ `url` 的锚点标签`<a>`）。\n\n接下来，修改 `Nav` 组件以检查它的每个子元素是否都是 `NavItem`，如果发现其他类型的组件，则抛出异常。\n\
    \n作为测试，早期的示例代码应该正常工作：\n\n```jsx\n<Nav>\n  <NavItem url='/'>Home</NavItem>\n  <NavItem\
    \ url='/about'>About</NavItem>\n  <NavItem url='/contact'>Contact</NavItem>\n\
    </Nav>\n```\n\n而这段代码应该报错：\n\n```jsx\n<Nav>\n  <NavItem url='/'>Home</NavItem>\n\
    \  <NavItem url='/about'>About</NavItem>\n  <a href='/contact'>Contact</a>\n</Nav>\n\
    ```\n\n3. 创建一个 `Dialog` 组件，它接受 `Title`、`Body` 和 `Footer` 组件作为子元素，所有都是可选的。`Dialog`\
    \ 应该验证它的子元素是否为这些类型之一，并输出类似这样的内容：\n\n![A dialog](img/file17.png) \n\n可以自由 Bootstrap\
    \ 的模态样式，或者创建自己的样式。\n\n# 示例：GitHub 文件列表\n\n你现在已经掌握了一些组件。你已经学习了 props 和 propTypes，并编写了一些\
    \ JSX。\n\n在我们进入状态和交互之前，我想通过一个包含我们目前为止所学的所有内容的示例来演示一遍。这里也将涵盖一些新的技巧。\n"
- fmt: "\nSo with that in mind, let’s create a new component that replicates GitHub’s\
    \ file list. It’s what you see at the top of every GitHub repository:\n\n![GitHub\
    \ file list](media/file18.png)\n\n### Break Into Components\n\nThe first step\
    \ is to outline or highlight all the components in this screenshot. Basically\
    \ what we’re doing here is drawing boxes around the `div` elements in the design.\n\
    \n![GitHub components highlighted](media/file19.png)\n\n### Name the Components\n\
    \nOnce you’ve decided which parts will be components, give them names. For the\
    \ highlights above, I came up with these ones (indented to show the parent/child\
    \ relationships):\n\n*   `FileList`\n*   `FileListItem`\n    *   `FileName`\n\
    \    *   `FileIcon`\n    *   `CommitMessage`\n    *   `Time`\n\n### Can You Reuse\
    \ Anything?\n\nLook through the list of components and see if you can save yourself\
    \ work anywhere.\n\nHey, look! That `Time` component looks very similar to the\
    \ one we wrote for `Tweet`. Luckily we wrote that `Time` component generically,\
    \ to just accept a time instead of a tweet. We can reuse it here.\n\n### What\
    \ Data Does Each Component Need?\n\nNext, let’s figure out what data each component\
    \ needs to render. This will give us the `props` and `propTypes` for each one.\n\
    \nSee if you can figure out the `propTypes` definition for each of these without\
    \ looking ahead at the code.\n\nThe `FileList` should take one prop, `files`,\
    \ which is an array of file objects.\n\nThe `FileListItem` will just take a single\
    \ file object as the `file` prop. That object should have a name, type, a commit\
    \ with a message, and a last-modified time.\n\n`FileName` will take a `file` object\
    \ and expect that it has a `name` property.\n\n`FileIcon` will take a `file` object\
    \ and use its `type` property to decide which kind of icon to show.\n\n`CommitMessage`\
    \ will take a `commit` object that should have a `message` property.\n\nFinally,\
    \ `Time` will take an absolute `time` string. We’re going to reuse the `Time`\
    \ component we made for `Tweet`, propTypes and all.\n\n### Top-Down or Bottom-Up?\n\
    \nWe’ll start from the top and work down for this one.\n\n### Keep it Running\n\
    \nHere’s something to strive for when you’re building components: Make sure it\
    \ always works!\n\nHave you ever had the experience of coding, head down, for\
    \ a long chunk of time without ever running the code? Inevitably, there’s something\
    \ wrong when you run it the first time.\n\nIt’s disappointing, and it takes the\
    \ wind out of your sails. You end up tracking down a bunch of syntax errors, logic\
    \ errors, and whatever else before you can see your hard work come to life.\n\n\
    So as you write, try to make small changes, and refresh often. Make sure the code\
    \ always works.\n\n### FileList\n\nWe’ve got enough direction to start working.\
    \ Create a new project the same way we’ve done a few times now:\n\n```\n$ create-react-app\
    \ github-file-list && cd github-file-list\n$ rm src/App.* src/logo.svg\n```\n\n\
    Copy the `index.html` file from the `tweet` project, from the “public” directory.\
    \ Change the `<title>` if you’d like, but aside from that, `index.html` is fine\
    \ as it is.\n\nOpen up `src/index.js`.\n\nDo you remember how to start off the\
    \ file with the imports, and how to set up the initial render call with `ReactDOM`?\
    \ Try to do it from memory. Look back at the `Tweet` example if your memory is\
    \ fuzzy.\n\nCreate the `FileList` component. In the interest of doing the simplest\
    \ thing that can possibly work, we’ll render a plain unordered list of file names.\
    \ Once it works we’ll extract the list items into a `FileListItem` component.\n\
    \n```\n[](#cb121-1)// put the imports here\n[](#cb121-2)\n[](#cb121-3)const FileList\
    \ = ({ files }) => (\n[](#cb121-4)  <table className=\"file-list\">\n[](#cb121-5)\
    \    <tbody\n[](#cb121-6)      {files.map(file => (\n[](#cb121-7)        <tr className=\"\
    file-list-item\" key={file.id}>\n[](#cb121-8)          <td className=\"file-name\"\
    >{file.name}</td>\n[](#cb121-9)        </tr>\n[](#cb121-10)      ))}\n[](#cb121-11)\
    \    </tbody>\n[](#cb121-12)  </table>\n[](#cb121-13));\n[](#cb121-14)FileList.propTypes\
    \ = {\n[](#cb121-15)  files: PropTypes.array\n[](#cb121-16)};\n[](#cb121-17)\n\
    [](#cb121-18)const testFiles = [\n[](#cb121-19)  {\n[](#cb121-20)    id: 1,\n\
    [](#cb121-21)    name: 'src',\n[](#cb121-22)    type: 'folder',\n[](#cb121-23)\
    \    updated_at: \"2016-07-11 21:24:00\",\n[](#cb121-24)    latestCommit: {\n\
    [](#cb121-25)      message: 'Initial commit'\n[](#cb121-26)    }\n[](#cb121-27)\
    \  },\n[](#cb121-28)  {\n[](#cb121-29)    id: 2,\n[](#cb121-30)    name: 'tests',\n\
    [](#cb121-31)    type: 'folder',\n[](#cb121-32)    updated_at: \"2016-07-11 21:24:00\"\
    ,\n[](#cb121-33)    latestCommit: {\n[](#cb121-34)      message: 'Initial commit'\n\
    [](#cb121-35)    }\n[](#cb121-36)  },\n[](#cb121-37)  {\n[](#cb121-38)    id:\
    \ 3,\n[](#cb121-39)    name: 'README',\n[](#cb121-40)    type: 'file',\n[](#cb121-41)\
    \    updated_at: \"2016-07-18 21:24:00\",\n[](#cb121-42)    latestCommit: {\n\
    [](#cb121-43)      message: 'Added a readme'\n[](#cb121-44)    }\n[](#cb121-45)\
    \  },\n[](#cb121-46)];\n[](#cb121-47)\n[](#cb121-48)// put the ReactDOM.render\
    \ call here\n[](#cb121-49)// pass testFiles as FileList's file prop\n```\n\nIt\
    \ should look like this, nice and ugly:\n\n![FileList, unstyled](media/file20.png)\n\
    \nMapping over an array is how you render lists of things in React.\n\n## The\
    \ “key” Prop\n\nThe `key` prop on the `<tr>` is a special one, and it’s required\
    \ any time you render an array of elements. React uses it to tell components apart\
    \ when reconciling differences during a re-render. If you’d like more details\
    \ about the reason keys are important, read the official docs on the [reconciliation\
    \ algorithm](https://facebook.github.io/react/docs/reconciliation.html).\n\nAny\
    \ time you use `map` to render an array, you’ll also need `key` on the topmost\
    \ element. React consumes the `key` prop before rendering, so the component you\
    \ pass `key` to will not actually receive the prop.\n\nIn practice, the important\
    \ thing to keep in mind is that keys should be `stable`, `permanent`, and `unique`\
    \ for each element in the array.\n\n*   **Stable**: An element should always have\
    \ the same key, regardless of its position in the array. This means `key={index}`\
    \ is a bad idea.\n*   **Permanent**: An element’s key must not change between\
    \ renders. This means `key={Math.random()}` is a bad idea.\n*   **Unique**: No\
    \ two elements should have the same key.\n\nIf an item has a unique ID attached\
    \ to it, that’s a great choice for the key. If the items don’t have IDs, try using\
    \ a hashing function, or generate unique IDs with a library like [shortid](https://www.npmjs.com/package/shortid).\n\
    \nThe item’s array index is not a good choice because if the index changes, for\
    \ instance when an element is added to the front of the array, React’s mapping\
    \ of indexes will become outdated. The item that was previously index “0” will\
    \ now be “1”, but React doesn’t know that, and it might cause tough-to-diagnose\
    \ rendering bugs.\n\n### FileListItem\n\nIt’s generally a good idea to create\
    \ a standalone component to render the individual items in a list, so we’ll do\
    \ that now. Even though this example is small, and it could be left alone, we’ll\
    \ pull it out to demonstrate the process.\n\nNotice that we still need to pass\
    \ the `key` prop. The `key` needs to be assigned directly to the top-level components\
    \ in the array, not their children.\n"
