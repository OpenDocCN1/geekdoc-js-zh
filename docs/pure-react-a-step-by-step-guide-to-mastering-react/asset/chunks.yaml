- fmt: "\n```javascript\nclass App extends Component {\n  // ...\n\n  renderContent()\
    \ {\n    switch(this.state.activeTab) {\n      default:\n      case 0:\n     \
    \   return (\n          <ItemPage\n            items={items}\n            onAddToCart={this.handleAddToCart}\
    \ />\n        );\n      case 1:\n        return <span>Cart</span>;\n    }\n  }\n\
    \n  // ...\n}\n```\n\nThe function `this.handleAddToCart` doesn’t exist yet, so\
    \ create that next. It will accept an item, and add the item to the cart:\n\n\
    ```javascript\nclass App extends Component {\n  // ...\n\n  handleAddToCart =\
    \ (item) => {\n    this.setState({\n      cart: [...this.state.cart, item.id]\n\
    \    });\n  }\n\n  // ...\n}\n```\n\nWhat this is doing is setting the `cart`\
    \ state to a copy of the current cart, plus one new item.\n\nThere’s’s some new\
    \ ES6 syntax here: `...this.state.cart` is the `spread` operator, and it expands\
    \ the given array into its individual items. Here’s an example of the spread operator:\n\
    \n```javascript\n// With arrays:\nvar a = [1, 2, 3];\nvar b = [a, 4];    // =>\
    \ [[1, 2, 3], 4]\nvar c = [...a, 4]; // => [1, 2, 3, 4]\n\n// With objects (technically\
    \ not ES6)\nvar o1 = {a: 1, b: 2};\nvar o2 = {...o1, c: 3}; // => {a: 1, b: 2,\
    \ c: 3}\n```\n\nNote that the spread operator for arrays is officially part of\
    \ ES6, but the one for objects is not. However, object spread is supported by\
    \ Babel, which Create React App is using under the hood to turn our code into\
    \ browser-compatible ES5.\n\n### Updating State Immutably\n\nYou might be wondering…\
    \ why not just modify state directly and then call `setState`, like this?\n\n\
    ```javascript\nthis.state.cart.push(item.id);\nthis.setState({cart: this.state.cart});\n\
    ```\n\nThis is a bad idea for two reasons (even though it would work in this example).\n\
    \nYou should `never` modify (“mutate”) state or its child properties directly.\
    \ Don’t do `this.state.something = x`, and don’t do `this.state = x`. React relies\
    \ on you to call `this.setState` when you want to make a change, so that it will\
    \ know something changed and trigger a re-render. If you circumvent `setState`\
    \ the UI will get out of sync with the data.\n\nMutating state directly can lead\
    \ to odd bugs, and components that are hard to optimize.\n\nHere’s an example.\
    \ Recall that one of the common ways to optimize a React component is to make\
    \ it “pure,” meaning that it only re-renders when its props change. This can be\
    \ done automatically by extending `React.PureComponent` instead of `React.Component`,\
    \ or manually by implementing the `shouldComponentUpdate` lifecycle method to\
    \ compare `nextProps` with current props. If the props look the same, it skips\
    \ the render, and saves some time.\n\nHere is a simple component that renders\
    \ a list of items. Notice that it extends `React.PureComponent`.\n\n(If you have\
    \ the example code, this code is under the “impure-state” folder.)\n\n```javascript\n\
    class ItemList extends React.PureComponent {\n  static propTypes = {\n    items:\
    \ PropTypes.array.isRequired\n  }\n\n  render() {\n    return (\n      <ul>\n\
    \        {this.props.items.map(item =>\n          <li key={item.id}>{item.value}li>\n\
    \        )}\n      </ul>\n    );\n  }\n}\n```\n\nNow, here is a tiny app that\
    \ renders the `ItemList` and allows you to mutably or immutably add items to the\
    \ list:\n\n```javascript\nclass App extends Component {\n  // Initialize items\
    \ to an empty array\n  state = {\n    items: []\n  }\n\n  // Initialize a counter\
    \ that will increment\n  // for each item ID\n  nextItemId = 0;\n\n  makeItem()\
    \ {\n    // Create a new ID and use\n    // a random number as the value\n   \
    \ return {\n      id: this.nextItemId++,\n      value: Math.random()\n    };\n\
    \  }\n\n  // The Right Way:\n  // copy the existing items and add a new one\n\
    \  addItemImmutably = () => {\n    this.setState({\n      items: [\n        ...this.state.items,\n\
    \        this.makeItem()\n      ]\n    });\n  }\n\n  // The Wrong Way:\n  // mutate\
    \ items and set it back\n  addItemMutably = () => {\n    this.state.items.push(this.makeItem());\n\
    \    this.setState({ items: this.state.items });\n  }\n\n  render() {\n    return\
    \ (\n      <div>\n        <button onClick={this.addItemImmutably}>\n         \
    \ Add item immutably (good)\n        </button>\n        <button onClick={this.addItemMutably}>\n\
    \          Add item mutably (bad)\n        </button>\n        <ItemList items={this.state.items}/>\n\
    \      </div>\n    );\n  }\n}\n```\n"
