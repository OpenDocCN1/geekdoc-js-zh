  trans: "\n你会发现这两个页面非常相似。与之前的示例相比，这一个示例的组件粒度较粗。组件将拥有更大的 `render` 函数，并且其中包含更多的“内容”。你以后可以对它们进行拆分，有时避免在早期就将其抽象成微小的部分反而更好。\n\
    \n以下是我们将构建的组件：\n\n*   `App`\n    *   `ItemPage`\n    *   `CartPage`\n    *   `Item`\n\
    \    *   `Nav`\n\n# 开始构建\n\n我们将从创建一个新项目开始：\n\n```\n$ create-react-app shopper\
    \ && cd shopper\n```\n\n打开 `src/App.js` 并将其内容替换为以下代码以开始：\n\n```javascript\nimport\
    \ React from 'react';\nimport Nav from './Nav';\nimport './App.css';\n\nclass\
    \ App extends React.Component {\n  renderContent() {\n    return (\n      <span>Empty</span>\n\
    \    );\n  }\n\n  render() {\n    return (\n      <div className=\"App\">\n  \
    \      <Nav/>\n        <main className=\"App-content\">\n          {this.renderContent()}\n\
    \        </main>\n      </div>\n    );\n  }\n}\n\nexport default App;\n```\n\n\
    然后创建 `src/Nav.js` 并用以下代码开头：\n\n```javascript\nimport React from 'react';\n\nconst\
    \ Nav = () => (\n  <nav className=\"App-nav\">\n    <ul>\n      <li className=\"\
    App-nav-item\"><a>Items</a></li>\n      <li className=\"App-nav-item\"><a>Cart</a></li>\n\
    \    </ul>\n  </nav>\n);\n\nexport default Nav;\n```\n\n启动应用并查看目前的效果：\n\n```\n\
    $ npm start\n```\n\n![没有样式，看起来很糟糕](img/file35.png)\n\n它可以运行了，但需要进行样式化。打开 `src/App.css`，并将内容替换为以下代码：\n\
    \n```css\n.App {\n  max-width: 800px;\n  margin: 0 auto;\n}\n.App-nav {\n  margin:\
    \ 20px;\n  padding: 10px;\n  border-bottom: 2px solid #508FCA;\n}\n.App-nav ul\
    \ {\n  padding: 0;\n  margin: 0;\n}\n.App-nav-item {\n  list-style: none;\n  display:\
    \ inline-block;\n  margin-right: 32px;\n  font-size: 24px;\n  border-bottom: 4px\
    \ solid transparent;\n}\n.App-content {\n  margin: 0 20px;\n}\n```\n\n这样好多了：\n\
    \n![好了一点](img/file36.png)\n\n接下来，我们需要跟踪激活的标签，并决定渲染 `ItemPage` 还是 `CartPage`。为了做到这一点，我们将激活标签存储在\
    \ `state` 中，并让 `Nav` 触发状态更改。`App` 组件是存储此状态的最佳位置，因为 `App` 需要它来知道渲染哪个页面。\n\n在顶部初始化状态，并添加一个选择标签的函数：\n\
    \n```javascript\nclass App extends Component {\n  state = {\n    activeTab: 0\n\
    \  };\n\n  handleTabChange = (index) => {\n    this.setState({\n      activeTab:\
    \ index\n    });\n  }\n\n  // ...\n}\n```\n\n现在，我们需要将 `handleTabChange` 函数传递给\
    \ `Nav`，连同 `activeTab` 以便它可以正确渲染。我们还将更新 `renderContent` 来显示激活的页面。\n\n```javascript\n\
    class App extends Component {\n  // ...\n\n  renderContent() {\n    switch(this.state.activeTab)\
    \ {\n      default:\n      case 0: return <span>Items</span>;\n      case 1: return\
    \ <span>Cart</span>;\n    }\n  }\n\n  render() {\n    let {activeTab} = this.state;\n\
    \    return (\n      <div className=\"App\">\n        <Nav activeTab={activeTab}\
    \ handleTabChange={this.handleTabChange} />\n        <main className=\"App-content\"\
    >\n          {this.renderContent()}\n        </main>\n      </div>\n    );\n \
    \ }\n}\n```\n\n将 `handleTabChange` 函数传递给 `Nav`，连同 `activeTab` 以便它可以正确渲染。我们还将更新\
    \ `renderContent` 来显示激活的页面。\n\n更新 `src/Nav.js` 中的 `Nav` 组件以使用代码：\n\n```javascript\n\
    const Nav = ({ activeTab, handleTabChange }) => (\n  <nav className=\"App-nav\"\
    >\n    <ul>\n      <li className={`App-nav-item ${activeTab === 0 ? 'selected'\
    \ : ''}`} onClick={() => handleTabChange(0)}><a>Items</a></li>\n      <li className={`App-nav-item\
    \ ${activeTab === 1 ? 'selected' : ''}`} onClick={() => handleTabChange(1)}><a>Cart</a></li>\n\
    \    </ul>\n  </nav>\n);\n```\n"
- fmt: "\nHere, the `handleClick` function will only be created `once`, when the component\
    \ is rendered the first time. This fixes the problem (`render` no longer creates\
    \ a function), but at the expense of more complex code (a whole new component!).\
    \ It’s a tradeoff, and one worth considering when you run into this with your\
    \ own projects.\n\n## Create ItemPage\n\nLet’s turn our attention to the list\
    \ of items for sale. We’ll create a new component to display this data. Create\
    \ a file called `ItemPage.js` and type this in:\n\n```javascript\nimport React\
    \ from 'react';\nimport PropTypes from 'prop-types';\nimport './ItemPage.css';\n\
    \nfunction ItemPage({ items }) {\n  return (\n    <ul className=\"ItemPage-items\"\
    >\n      {items.map(item =>\n        <li key={item.id} className=\"ItemPage-item\"\
    >\n          {item.name}\n        </li>\n      )}\n    </ul>\n  );\n}\nItemPage.propTypes\
    \ = {\n  items: PropTypes.array.isRequired\n};\n\nexport default ItemPage;\n```\n\
    \nNothing new here: we’re just iterating over a list of items and rendering them\
    \ out. Since the individual items are going to be more involved than just a “name”,\
    \ we’ll extract that out into its own component shortly.\n\nThis component relies\
    \ on `ItemPage.css`, which doesn’t exist yet. Create that file, and add this CSS\
    \ to style the list:\n\n```css\n.ItemPage-items {\n  margin: 0;\n  padding: 0;\n\
    }\n.ItemPage-items li {\n  list-style: none;\n  margin-bottom: 20px;\n}\n```\n\
    \nWe’re going to need some items to sell. We’ll use static data here, same as\
    \ before.\n\nI like to start with static data even when I have a server that can\
    \ return real data. You can go from nothing to something pretty quickly when there\
    \ are no moving parts. And honestly, it’s just more fun when there’s something\
    \ on the screen that I can tweak.\n\nCreate a file called `static-data.js` (under\
    \ `src`) and paste in this code.\n\n```javascript\nlet items = [\n  {\n    id:\
    \ 0,\n    name: \"Apple iPad Mini 2 16GB\",\n    description: \"An iPad like no\
    \ other. 16GB, WiFi, 4G.\",\n    price: 229.00\n  },\n  {\n    id: 1,\n    name:\
    \ \"Apple iPad Mini 2 32GB\",\n    description: \"Even larger than the 16GB.\"\
    ,\n    price: 279.00\n  },\n  {\n    id: 2,\n    name: \"Canon T7i\",\n    description:\
    \ \"DSLR camera with lots of megapixels.\",\n    price: 749.99\n  },\n  {\n  \
    \  id: 3,\n    name: \"Apple Watch Sport\",\n    description: \"A watch\",\n \
    \   price: 249.99\n  },\n  {\n    id: 4,\n    name: \"Apple Watch Silver\",\n\
    \    description: \"A more expensive watch\",\n    price: 599.99\n  }\n];\n\n\
    export {items};\n```\n\nThen we will pass those items into the new `ItemPage`\
    \ component. Back in `App.js`, import the `ItemPage` and the static `items` data.\n\
    \n```javascript\nimport ItemPage from './ItemPage';\nimport {items} from './static-data';\n\
    ```\n\nAnd then update the `renderContent` function to use the new ItemPage:\n\
    \n```javascript\nclass App extends Component {\n  // ...\n  renderContent() {\n\
    \    switch(this.state.activeTab) {\n      default:\n      case 0: return <ItemPage\
    \ items={items}/>\n      case 1: return <span>Cart</span>;\n    }\n  }\n  // ...\n\
    }\n```\n\nNow you should see some items rendering!\n\n![Items are rendering](media/file38.png) \n\
    \n## Create Item\n\nLet’s now create the real `Item` component to use in `ItemList`.\
    \ It’ll take an `item` prop, and we’ll also want to be able to add it to the cart,\
    \ so it should take an `onAddToCart` prop too.\n\nThis component will be stateless.\
    \ Its responsibilities are to display an item, and to let its parent know when\
    \ the “Add to Cart” button is clicked.\n\nLearning from the GitHub example, we\
    \ won’t return an `li` from this component. We don’t want to force users of `Item`\
    \ to put it inside a `<ul>`. The parent can put this item into an `li` if it chooses.\n\
    \nWith that mind, create `src/Item.js` and `src/Item.css`. In `src/Item.js`, write\
    \ the component:\n\n```javascript\nimport React from 'react';\nimport PropTypes\
    \ from 'prop-types';\nimport './Item.css';\n\nconst Item = ({ item, onAddToCart\
    \ }) => (\n  <div className=\"Item\">\n    <div className=\"Item-left\">\n   \
    \   <div className=\"Item-image\" />\n      <div className=\"Item-title\">\n \
    \       {item.name}\n      </div>\n      <div className=\"Item-description\">\n\
    \        {item.description}\n      </div>\n    </div>\n    <div className=\"Item-right\"\
    >\n      <div className=\"Item-price\">\n        {item.price}\n      </div>\n\
    \      <button className=\"ItemaddToCart\" onClick={onAddToCart}>\n        Add\
    \ to Cart\n      </button>\n    </div>\n  </div>\n);\nItem.propTypes = {\n  item:\
    \ PropTypes.object.isRequired,\n  onAddToCart: PropTypes.func.isRequired\n};\n\
    \nexport default Item;\n```\n\nNow let’s wire it to the `ItemPage` component.\
    \ In `ItemPage.js`, update the code to look like:\n\n```javascript\nimport React\
    \ from 'react';\nimport PropTypes from 'prop-types';\nimport Item from './Item';\n\
    import './ItemPage.css';\n\nfunction ItemPage({ items, onAddToCart }) {\n  return\
    \ (\n    <ul className=\"ItemPage-items\">\n      {items.map(item =>\n       \
    \ <li key={item.id} className=\"ItemPage-item\">\n          <Item\n          \
    \  item={item}\n            onAddToCart={() => onAddToCart(item)} />\n       \
    \ </li>\n      )}\n    </ul>\n  );\n}\nItemPage.propTypes = {\n  items: PropTypes.array.isRequired,\n\
    \  onAddToCart: PropTypes.func.isRequired\n};\n\nexport default ItemPage;\n```\n\
    \nWe’re importing `Item`, and then inside the `<li>` we’re now rendering the `Item`\
    \ component instead of just the item’s name. Also new is the `onAddToCart` prop\
    \ and its associated propType.\n\nAt this point, the code won’t work, and there\
    \ will be a warning about the missing `onAddToCart` prop.\n\nTo complete the chain\
    \ of passed-down props, we need to pass something to `ItemPage`’s `onAddToCart`\
    \ prop from inside the `App` component. While we’re at it, we may as well actually\
    \ add the items to a cart! That will require a new `cart` property inside state.\n\
    \nLet’s walk through it. First, in `App.js`, add a `cart` property to the initial\
    \ state, and initialize it to an empty array:\n\n```javascript\nclass App extends\
    \ Component {\n  state = {\n    activeTab: 0,\n    cart: []\n  }\n  // ...\n}\n\
    ```\n\nThen update `renderContent` to pass a function as the `onAddToCart` prop:\n"
