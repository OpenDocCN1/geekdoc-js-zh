    \   <td><FileName file={file} /></td>\n    <td><CommitMessage commit={file.latestCommit}\
    \ /></td>\n    <td><Time time={file.updated_at} /></td>\n  </tr>\n);\nFileListItem.propTypes\
    \ = {\n  file: PropTypes.object.isRequired\n};\n```\n\n### Refactoring\n\nAt this\
    \ point I could’ve gone back and edited the examples so that the code came out\
    \ better. But I left it this way as an example: sometimes, maybe even often, the\
    \ code won’t come out quite as clean as you imagined it. You might not fully realize\
    \ the impact of a decision until you’ve lived with it for a while.\n\nReality\
    \ often gets in the way. You forget that table cells must be direct children of\
    \ their rows, adhere too closely to the mockup, and take yourself down a path\
    \ that results in bad code.\n\nBut nothing is permanent! Now would be a perfect\
    \ time to refactor this code (and in fact, you’ll do that in the exercises).\n\
    \nAs you’re plugging away, writing your code… when that thought pops into your\
    \ head that says, “Wait! These components won’t be reusable at all because every\
    \ one of them contains a table cell!”… well, listen to that voice. Refactor early\
    \ and often.\n\n## Exercises\n\n1. Refactor the GitHub file listing example so\
    \ that none of the components return a table cell (`<td>`). Every component should\
    \ return a `<span>` or `<div>` instead. This makes them more reusable, and also\
    \ should greatly improve the code inside `FileList`. Change the CSS if necessary.\n\
    \n2. In real applications, you’ll want to have only one component per file most\
    \ of the time. Sometimes a file will contain a few related components, when those\
    \ components are always used together (as in the `Nav`/`NavItem` example from\
    \ earlier), but otherwise they should be separated out. Refactor the code from\
    \ Exercise 1 to pull out components into separate files, using `import` and `export`.\n\
    \n3. Now you know how to create lists, using `Array`’s `.map` function. Reuse\
    \ the `Tweet` component from earlier and create a list of Tweets.\n\nLists are\
    \ all over the place. It’s been said that most web applications are basically\
    \ just a bunch of lists. Implement these interfaces from sites around the web.\
    \ Follow the same process we’ve done a few times now – highlight which pieces\
    \ of the screen will be components, give them names, then build them.\n\n### 4.\
    \ Trello\n\nWork on rendering a single list of cards. For more practice, render\
    \ multiple lists of cards side-by-side.\n\n(screenshot from [https://trello.com](https://trello.com))\n\
    \n![Trello](media/file25.png)\n\n### 5. Hacker News\n\nImplement the list of stories.\
    \ For more practice, implement the header too.\n\n(screenshot from [https://news.ycombinator.com/news](https://news.ycombinator.com/news))\n\
    \n![HN](media/file26.png)\n\n### 6. Pinterest\n\nImplement the list of image cards.\
    \ For more practice, implement the header too (consider reusing the `Nav` and\
    \ `NavItem` components from earlier).\n\n(sceenshot from [https://www.pinterest.com/aviationhd/](https://www.pinterest.com/aviationhd/))\n\
    \n![Pinterest](media/file27.png)\n\n### 7. InternetRadio genre cloud\n\nCan you\
    \ come up with a nice way of sizing the buttons so they get progressively larger?\n\
    \n(screenshot from [https://www.internet-radio.com/](https://www.internet-radio.com/))\n\
    \n![Music Genres](media/file28.png)\n\n# State\n\nUp until this point we’ve used\
    \ `props` to pass data to components. But `props` are `read-only`. What if you\
    \ need to keep track of data that can change? This is where `state` comes in.\n\
    \nTo see how state is useful, let’s look back at an example from the Props chapter.\
    \ Here is a `Parent` component that contains a `Child` component. `Parent` passes\
    \ down a function which `Child` calls whenever a button is clicked:\n\n## Example:\
    \ A Counter\n\n```javascript\nfunction handleAction(event) {\n  console.log('Child\
    \ did:', event);\n}\n\nfunction Parent() {\n  return (\n    <Child onAction={handleAction}/>\n\
    \  );\n}\n\nfunction Child({ onAction }) {\n  return (\n    <button onClick={onAction}>\n\
    \      Click Me!\n    </button>\n  );\n}\n```\n\nWhat if we wanted `Parent` to\
    \ keep track of how many times the button was clicked? In other words, `Parent`\
    \ should track how many times its `handleAction` function is called.\n\nTo do\
    \ this, `Parent` needs 3 new things: an `initial state` where the counter is set\
    \ to 0, a call to `this.setState` to increment the counter, and a way to display\
    \ the current count.\n\nRemember, though, that function components are `stateless`.\
    \ To make `Parent` stateful, it needs to be transformed into an ES6 `class` component.\n\
    \nHere’s the new version of `Parent`, renamed to `CountingParent` – make sure\
    \ you update the call to `ReactDOM.render`!\n\n```javascript\nclass CountingParent\
    \ extends React.Component {\n  state = {\n    actionCount: 0\n  }\n\n  handleAction\
    \ = (action) => {\n    console.log('Child says', action);\n    // actionCount\
    \ is incremented, and\n    // the new count replaces the existing one\n    this.setState({\n\
    \      actionCount: this.state.actionCount + 1\n    });\n  }\n\n  render() {\n\
    \    return (\n      <div>\n        <Child onAction={this.handleAction}/>\n  \
    \      <p>Clicked {this.state.actionCount} times</p>\n      </div>\n    );\n \
    \ }\n}\n```\n\nThe `Child` component doesn’t have to change at all. Try it out!\
    \ Click the button. Watch it increment. Ooooh. Aaaah. Such counter.\n\nOk so maybe\
    \ incrementing a number is not a groundbreaking achievement, but let’s see what’s\
    \ going on here.\n\nWhen the component is first instantiated, its initial state\
    \ is set up via the `state = {...}` property initializer. Although this syntax\
    \ is not officially part of ES6, it is supported by Babel and Create React App,\
    \ and widely used in the React community. (An alternative is to set up initial\
    \ state in a *constructor*, which we’ll see later).\n\nNext, you click the button,\
    \ like it tells you to. The button’s `onClick` handler is called. In this case\
    \ that’s the `onAction` prop, which ultimately calls the `handleAction` function\
    \ in `CountingParent`. The `handleAction` function logs a message and then calls\
    \ `this.setState` with an object that describes the new state.\n"
