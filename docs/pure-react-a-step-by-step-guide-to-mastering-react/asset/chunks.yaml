    ![](media/pure_react_cover.png)


    ![cover image](media/pure_react_cover.png)


    # Pure React


    ## Dave Ceddia


    Copyright (c) 2017 Dave Ceddia


    # Introduction


    Welcome to Pure React.


    There’s a problem with frontend development today: it’s overwhelming.


    There are thousands of libraries out there, each doing one little thing. Groups
    of them evolve to become de facto standards, but with no actual standards in sight.


    The React ecosystem is especially guilty of this: there’s `React`, `Redux`, `Webpack`,
    `Babel`, `React Router`, and on and on. Hundreds of boilerplate projects exist
    to make this “easier” by bundling a bunch of choices together. “It’ll be easier
    to learn,” the thinking goes, “if you don’t have to make all the choices yourself.”


    But the opposite happens: instead of being overwhelmed by the choices, you’re
    now overwhelmed by the sheer amount of code that came “for free” with the boilerplate,
    and you have NO IDEA what any of it actually does. That’s a scary place to be.


    Learning everything at once is massively overwhelming. So in this book, we will
    take a different approach. A more sane approach. We will learn Pure React.


    > Pure React: The core concepts of `React`, in isolation, without `Redux`, `Webpack`,
    and the rest.


    When you achieve what’s contained here – when you learn `React` cold, you’ll be
    able to go on and learn all of its friends with ease: `Redux`, `Router`, and the
    rest.


    Not only will you be able to learn those other libraries, but you will be well-equipped.
    You’ll have a solid foundation.


    This book has been designed to get you from zero to `React` quickly, and with
    maximum understanding.


    What you won’t be doing here is what plays out in many tutorials across on the
    web, where you copy and paste each block of code until you have a working app
    at the end. “Voila!” they say. “Now you know `React` and `Redux` and `Webpack`!”


    It’s too much at once. You might learn one or two core concepts with this approach,
    but it’s a shaky foundation. Inevitably, when you sit down to write your own app,
    you get lost in the forest of libraries and concepts.


    You can only get so far by copying and pasting pieces of code.


    And you know this already, otherwise you wouldn’t be here.


    So here we’ll follow a different approach: I’ll show you a concept, with some
    example code. *Then* (and this is the important part) you will use that concept
    in the exercises that follow, until it’s second nature. Rinse and repeat until
    we’ve covered all the core pieces of pure React – and there aren’t too many.


    ### What We’ll Cover


    We will start where most programming books start, with Hello World. From there,
    we’ll look at how to compose components together and how to work with `JSX`, `React`’s
    HTML-like syntax for rendering elements to the page.


    Once you have a grasp on how to create static components, you’ll learn about “props”
    as a way to pass in the data they need, and “propTypes” for documenting and debugging
    the props that a component requires.


    We’ll cover `React`’s special “children” prop, which is a powerful tool for building
    reusable, composable components.


    Finally, you’ll learn about “state,” how it differs from props, and how to organize
    it in an application. We’ll look at using form controls and the Component Lifecycle.


    ## Why Just React?


    Without a solid understanding of `React`, simultaneously learning libraries like
    `Redux` and tools like `Webpack` will only slow down your learning process. It’s
    very tempting to dive in and learn it all at once, especially if you have a fun
    project in mind (or a deadline to meet).


    However, learning everything at once will be slower in the long run.


    Think of these libraries and tools as layers in a foundation.


    If you were building a house, would you skip some steps to get it done faster?
    Say, start pouring the concrete before laying some rocks down? Start building
    the walls on bare earth?


    Or how about making a wedding cake: the top part looks the most fun to decorate,
    so why not start there? Just figure out the bottom part later!


    No?


    Of course not. You know those things would lead to failure. They would, perhaps
    counterintuitively, slow things down rather than speed them up.


    So does it make sense to approach `React` by trying to learn `Webpack` + `Babel`
    + `React` + `Redux` + `Routing` + `AJAX` all at once? Doesn’t that sound like
    a ton of overwhelming confusion?


    Instead, the most efficient approach is to learn these one at a time. This book
    will teach you how to use `React`, and then you’ll be ready to tackle the next
    piece of the puzzle.


    ## How This Book Works


    ### How Much Time Will This Take?


    The basic concepts of `React` can be learned in a matter of days. This book covers
    those basics and also contains exercises after each major concept to reinforce
    your understanding.


    Most of the exercises are short. There are a few that are more involved. The principle
    behind them is the same as the idea behind homework in school: to drill the ideas
    into your head by combining repetition and problem solving.


    The theme behind the whole process is this: avoid getting overwhelmed. Quitting
    won’t get you anywhere. Slow and steady, uh, learns the `React`.


    ### Build Small Things and Throw Them Away


    This is the awkward middle step that a lot of people skip. Moving on to `Redux`
    and other libraries without having a firm grasp of `React`’s concepts will lead
    straight back to overwhelmsville.


    But this step isn’t very well-defined: what should you build? A prototype for
    work? Maybe a fancy Facebook clone, something substantial that uses the whole
    stack?


    Well, no, not those things. They’re either loaded with baggage or too large for
    a learning project. You want to build small things.


    ### Don’t Build a Prototype


    “Prototypes” (for work) are usually terrible learning projects, because you know
    in your heart that a “prototype” will never die. It will live long beyond the
    prototype phase, morph into shipping software, and never be thrown away or rewritten.
    As soon as some manager sees that it works, features will be piled on. “We’ll
    refactor it some day” will turn out to be a lie. The code will grow bloated and
    disorganized.


    All of these, and more, are the reasons why a prototype is a bad choice as a learning
    project.


    When you know it won’t be throwaway code, the future looms large. You start to
    worry… Shouldn’t it have tests? I should make sure the architecture will scale…
    Am I going to have to refactor this mess later? And shouldn’t it have tests?


    Worrying about architecture and scalability and “the future” is a bad strategy
    for learning the basics of a new technology.


    On the flip side, if you build a prototype believing that it is throwaway code,
    it probably won’t be very good code. Then when your boss’ boss sees how awesome
    the prototype looks, he will absolutely not allow you to rewrite it with all the
    best practices you’ve learned. That’s a recipe for an unmaintainable code base.


    ### So What Should You Build?


    This book exists to answer this question, and help you through it. The short answer:


    > Build small, throwaway apps.


    The sweet spot is somewhere between “Hello World” and “entire clone of Twitter.”


    We’ll start off with Hello World, of course. No self-respecting programming book
    would be complete without that.


    As your skill set grows, low-fidelity copies of simple apps and sites like Reddit,
    Hacker News, and Slack make good projects. Designers call this “copywork,” and
    it’s great because it frees you from having to make product decisions like “where
    should the user go after login.” You can simply focus on learning `React`.


    By the end of this book you’ll be building replicas of those popular apps and
    more. They’ll come together quickly once you can clearly “think in components,”
    a skill you’ll develop as you progress through the book.

    '
