    \ 'prop-types';\nimport Item from './Item';\nimport './CartPage.css';\n\nfunction\
    \ CartPage({ items }) {\n  return (\n    <ul className=\"CartPage-items\">\n \
    \     {items.map(item =>\n        <li key={item.id} className=\"CartPage-item\"\
    >\n          <Item item={item} />\n        </li>\n      )}\n    </ul>\n  );\n\
    }\nCartPage.propTypes = {\n  items: PropTypes.array.isRequired\n};\n\nexport default\
    \ CartPage;\n```\n\nThis simply renders the items that it’s given. You’ll notice\
    \ that we aren’t passing an `onAddToCart` handler to `Item`, which will cause\
    \ a prop warning. We’ll fix that shortly.\n\n### Pass Items to CartPage\n\nThe\
    \ cart needs items to display. The trouble is, our `cart` state just contains\
    \ item indices, not actual items. Additionally, there can be duplicate indices\
    \ when an item is added multiple times. We’ll need to massage the `cart` state\
    \ into an array of items suitable to pass into `CartPage`.\n\nIn `App.js`, import\
    \ `CartPage` at the top:\n\n```javascript\nimport CartPage from './CartPage';\n\
    ```\n\nThen add a `renderCart` function, and update `renderContent` to call it.\n\
    \n```javascript\nclass App extends Component {\n  // ...\n\n  renderContent()\
    \ {\n    switch(this.state.activeTab) {\n      default:\n      case 0:\n     \
    \   return (\n          <ItemPage\n            items={items}\n            onAddToCart={this.handleAddToCart}\
    \ />\n        );\n      case 1:\n        return this.renderCart();\n    }\n  }\n\
    \n  renderCart() {\n    // Count how many of each item is in the cart\n    let\
    \ itemCounts = this.state.cart.reduce((itemCounts, itemId) => {\n      itemCounts[itemId]\
    \ = itemCounts[itemId] || 0;\n      itemCounts[itemId]++;\n      return itemCounts;\n\
    \    }, {});\n\n    // Create an array of items\n    let cartItems = Object.keys(itemCounts).map(itemId\
    \ => {\n      // Find the item by its id\n      var item = items.find(item =>\n\
    \        item.id === parseInt(itemId, 10)\n      );\n\n      // Create a new \"\
    item\" that also has a 'count' property\n      return {\n        ...item,\n  \
    \      count: itemCounts[itemId]\n      };\n    });\n\n    return (\n      <CartPage\
    \ items={cartItems} />\n    );\n  }\n}\n```\n\n## reduce\n\nThe `reduce` function\
    \ is a functional-style shorthand for code like:\n\n```javascript\nconst a = [1,\
    \ 2, 3, 4];\nlet total = 0;\nfor(let i = 0; i < a.length; i++) {\n  total += a[i];\n\
    }\n```\n\nAny time you want to iterate over the values of an array to create an\
    \ aggregate result, consider using `reduce`.\n\n```javascript\nconst a = [1, 2,\
    \ 3, 4];\nlet total = a.reduce((sum, value) => {\n  return sum + value;\n}, 0);\n\
    ```\n\nThe `reduce` function takes a callback and an optional initial value. The\
    \ callback is called for each element of the array, passing the accumulated value\
    \ and the current element.\n\n## Object.keys\n\n`Object.keys` returns an array\
    \ of the keys in an object. For instance `Object.keys({a: 1, b: 2})` would return\
    \ `['a', 'b']`. Objects don’t have a built-in `forEach` function like arrays do,\
    \ so `Object.keys` makes it easier to iterate over the keys.\n\n### Modifying\
    \ the Cart\n\nAt this point, the “Cart” tab should be working. Click “Add to Cart”\
    \ a few items, then click over to the “Cart” tab, and the items should be there.\
    \ We still have the “Add to Cart” buttons, and we’re getting propType warnings\
    \ about `onAddToCart`. We’ll fix both of those next.\n\n![Cart is working](media/file41.png)\n\
    \nEven though the cart is working, it’s missing important features. There is no\
    \ way to add or remove items, no total price, and we don’t know how many of each\
    \ item is in the cart.\n\nRemember how we reused the `Item` component inside `CartPage`?\
    \ It would be nice if we could render a customized `Item` that had Add and Remove\
    \ buttons in place of the “Add to Cart” button.\n\nThere are a few ways to go\
    \ about this.\n\nOne idea: we could make a copy of the `Item` component, rename\
    \ it `CartItem`, and customize it as necessary. This is quick and easy, but duplicates\
    \ code.\n\nAnother idea: we could make `Item` take a prop that tells it to be\
    \ a “regular item” or a “cart item.” Using that prop, `Item` would decide whether\
    \ to render an “Add to Cart” button or “Add/Remove” buttons. This would work,\
    \ but it’s messy – `Item` would have multiple responsibilities. If it became necessary\
    \ to reuse `Item` in a third situation, we might end up adding more conditional\
    \ logic, making `Item` harder and harder to understand and maintain.\n"
