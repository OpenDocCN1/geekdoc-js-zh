    \ a JS expression?\n\n    6.  What about a function call like `alert('hi')`? Does\
    \ it halt rendering?\n\n    7.  Try putting a quoted string inside JSX. Does it\
    \ strip out the quotes?\n\n# Example: Tweet Component\n\n**1\\. Sketch**\n\nThis\
    \ is your introduction to “thinking in components.” Let’s start with something\
    \ concrete: a humble sketch. This could come from a designer (wireframes or mockups)\
    \ or it could be your own creation.\n\nEven when you can already visualize the\
    \ end result, spend the 30 seconds and sketch it out on real dead-tree paper.\
    \ It will help tremendously, especially for the complicated components.\n\nThere’s\
    \ something satisfying about building a component from a sketch: you can tell\
    \ when you’re “done.” Without a sketch, you’ll compare the on-screen component\
    \ to the grand vision in your head, and it will never be good enough. It’s easy\
    \ to waste a lot of time when you don’t know what “done” looks like. A sketch\
    \ gives you a target to aim for.\n\nHere is the sketch we’ll be building from:\n\
