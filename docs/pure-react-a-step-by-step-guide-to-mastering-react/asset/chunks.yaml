    *   `Exercism`（练习）：http://exercism.io/languages/javascript\n*   `You Don’t Know\
    \ JS`（书丛）：https://github.com/getify/You-Dont-Know-JS\n\n对命令行有通俗的了解也会很有帮助。\n\n\
    ### 项目目录\n\n在本书中，你将编写很多代码。为了保持整洁，请为练习创建一个目录。将其命名为 `pure-react`，或者你喜欢的任何名字。\n\n\
    ### 安装 Create React App\n\n运行此命令全局安装该工具（`-g` 表示全局）：\n\n```\n$ npm install -g create-react-app\n\
    ```\n\n如果你得到“Permission denied”的错误（如果你正在使用 Linux 或 Mac），你可能需要使用“sudo”重新运行命令，如下：\n\
    \n```\n$ sudo npm install -g create-react-app\n```\n\n搞定！让我们开始写代码吧。\n\n## 调试快速上手课程\n\
    \n当出现出现问题时，请遵循以下步骤：\n\n1.  不要恐慌。\n2.  手动刷新页面。有时自动刷新机制会失效。\n3.  检查浏览器开发者控制台，手动刷新页面并修复你看到的任何错误。\n\
