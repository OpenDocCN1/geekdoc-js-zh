    \ but it’s only good for showing *one* message from *one* person…\n\nWell don’t\
    \ worry, because that’s coming up next: parameterizing components with props.\n\
    \n# Props\n\n## Arguments to Components\n\nWhere HTML elements have “attributes,”\
    \ React components have “props” (short for “properties”).\n\nWe’ve already seen\
    \ that React components can be written as functions, so it’s natural to assume\
    \ that we could pass arguments to those functions. Props are the *arguments* to\
    \ your components.\n\n### Passing Props\n\nThis bit of JSX is passing a prop called\
    \ `name` with a string value of `\"Dave\"`:\n\n```\n[](#cb58-1)<Person name='Dave'/>\n\
    ```\n\nHere’s another example, passing a `className` prop with the value `\"person\"\
    `:\n\n```\n[](#cb59-1)<div className='person'/>\n```\n\nJSX uses `className` instead\
    \ of `class` to specify CSS classes.\n\nNotice how the `div` is self-closing?\
    \ This ability isn’t just for `<input/>` anymore: in JSX, *every* component can\
    \ be self-closing. In fact, if the component has no children (no contents), the\
    \ convention is to write it like this, instead of using a closing tag.\n\nHere,\
    \ we’re passing a string for `className`, a number for the `age` prop, and an\
    \ actual JavaScript expression for the `name`:\n\n```\n[](#cb60-1)function Dave()\
    \ {\n[](#cb60-2)  const firstName = \"Dave\";\n[](#cb60-3)  const lastName = \"\
    Ceddia\";\n[](#cb60-4) \n[](#cb60-5)  return (\n[](#cb60-6)    <Person \n[](#cb60-7)\
    \      className='person'\n[](#cb60-8)      age={33}\n[](#cb60-9)      name={firstName\
    \ + ' ' + lastName} />\n[](#cb60-10)  ); \n[](#cb60-11)}\n```\n\nRemember that\
    \ in JSX, singles braces must surround JavaScript expressions. The code in the\
    \ braces is real JavaScript, and it follows all the same scoping rules as normal\
    \ JavaScript.\n\nIt’s important to understand that the JS inside the braces must\
    \ be an *expression*, not a statement. Here are a few things you can do inside\
    \ JSX expressions:\n\n*   Math, concatenation: `{7 + 5}` or `{'Your' + 'Name'}`\n\
    \n*   Function calls: `{this.getFullName(person)}`\n\n*   Ternary (?) operator:\
    \ `{name === 'Dave' ? 'me' : 'not me'}`\n\n*   Boolean expressions: `{isEnabled\
    \ && 'enabled'}`\n\nHere are some things you cannot do:\n\n*   Define new variables\
    \ with `var`\n\n*   Use `if`, `for`, `while`, etc.\n\n*   Define functions with\
    \ `function`\n\nRemember that JSX evaluates to JavaScript, and the props become\
    \ keys and values in an object. Here’s that example from above, transformed into\
    \ JavaScript:\n\n```\n[](#cb61-1)function Dave() {\n[](#cb61-2)  const firstName\
    \ = \"Dave\";\n[](#cb61-3)  const lastName = \"Ceddia\";\n[](#cb61-4) \n[](#cb61-5)\
    \  return React.createElement(Person, {\n[](#cb61-6)    age: 33,\n[](#cb61-7)\
    \    name: firstName + ' ' + lastName,\n[](#cb61-8)    className: 'person'\n[](#cb61-9)\
    \  }, null); \n[](#cb61-10)}\n```\n\nAll of the rules that apply to function arguments\
    \ apply to JSX expressions. Could you call a function like this?\n\n```\nmyFunc(var\
    \ x = true; x && 'is true');\n```\n\nOf course not! That looks completely wrong.\
    \ If you tried to pass that argument to a JSX expression, this is what you’d get:\n\
    \n```\n<Broken value={var x = true; x && 'is true'}/>\n// gets compiled to:\n\
    React.createElement(Broken, {\n  value: var x = true; x && 'is true'\n}, null);\n\
    ```\n\nSo when you’re trying to decide what to put in a JSX expression, ask yourself,\
    \ “Could I pass this as a function argument?”\n\n### Receiving Props\n\nProps\
    \ are passed as the first argument to a component function, like this:\n\n```\n\
    [](#cb64-1)function Hello(props) {\n[](#cb64-2)  return (\n[](#cb64-3)    <span>Hello,\
    \ {props.name}</span>\n[](#cb64-4)  );\n[](#cb64-5)}\n[](#cb64-6)\n[](#cb64-7)//\
    \ Used like:\n[](#cb64-8)<Hello name=\"Dave\"/>\n```\n\nIt works the same way\
    \ for arrow functions:\n\n```\n[](#cb65-1)const Hello = (props) => (\n[](#cb65-2)\
    \  <span>Hello, {props.name}</span>\n[](#cb65-3));\n```\n\nES6 has a new syntax\
    \ called *destructuring* which makes props easier to work with. It looks like\
    \ this:\n\n```\n[](#cb66-1)const Hello = ({ name }) => (\n[](#cb66-2)  <span>Hello,\
    \ {name}</span>\n[](#cb66-3));\n```"
