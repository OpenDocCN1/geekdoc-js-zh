    \n```javascript\n// 将此内容：\n<LikeButton count={tweet.likes}/>\n\n// 替换为：\n<LikeButton\
    \ count='foo'/>\n```\n\n如果你现在刷新（或等待浏览器自动刷新），你应该会在开发者控制台中看到类似这样的警告：\n\n> Warning:\
    \ Failed propType: Invalid prop `count` of type `string` supplied to `LikeButton`,\
    \ expected `number`. Check the render method of `Tweet`.\n\n很好！一切运行正常。\n\n将该行代码改回原来的样子，并为\
    \ `RetweetButton` 添加一个 `count` PropType。按钮是一个很好的开始点。`MoreOptionsButton` 完全不接收\
    \ props，所以我们不需要更改它。\n\n`LikeButton` 可以可选地接收一个 `count` prop，因此我们为它添加一个 PropType：\n\
    \n要验证它是否有效，进入 `Tweet` 组件，并尝试向 `LikeButton` 传递字符串而不是数字：\n\n如果你现在刷新（或等待浏览器自动刷新），你应该会在开发者控制台中看到类似这样的警告：\n\
    \n> Warning: Failed propType: Invalid prop `count` of type `string` supplied to\
    \ `LikeButton`, expected `number`. Check the render method of `Tweet`.\n\n很好！一切运行正常。\n\
    \n将该行代码改回原来的样子，并为 `RetweetButton` 添加一个 `count` PropType。按钮是一个很好的开始点。`MoreOptionsButton`\
    \ 完全不接收 props，所以我们不需要更改它。（注：提供的源文本包含一些重复片段；我已经精简了核心逻辑流）。\n\n### 你应该写得多显式？\n\n\
    当对象很简单时，写出 `shape` 是很容易证明的。当对象更复杂时，你可能会开始怀疑这是否值得。答案取决于你的情况。\n\n### 作为文档的 PropTypes\
    \ 关于关于 PropTypes 最后一点：除了有助于调试之外，它们还充当了良好的文档。当你几天、一周或一个月后回到一个组件时，PropTypes 将充当类似于“README”的角色。你不需要扫描代码来解码哪些\
    \ props 是必须的。\n\n## 练习\n\n谁说你必须按照 Web 接口来建模组件？现实世界的对象也是很好的练习。你将在下面构建其中一些：\n\n\
    1. 创建一个 `AddressLabel` 组件，它接收一个 `person` 对象作为 prop，并如下所示他们的姓名和地址：\n\n```\nFull\
    \ Name\n123 Fake St.\nBoston, MA 02118\n```\n\n2. 创建一个 `Envelope` 组件，它接收 `toPerson`\
    \ 和 `fromPerson` 作为 props，并使用练习 1 中的 `AddressLabel` 来显示发件地址和收件地址。确保也包含一个 `Stamp`！\n\
    \n3. 根据此设计创建一个 `CreditCard` 组件。使用 CSS 或内联样式对其进行美化。接受一个 `cardInfo` prop，其中包含人的姓名、过期日期、信用卡号和银行名称。\n\
    \n4. 创建一个 `Poster` 组件，它接收 `image`、`title` 和 `text` 作为 props。渲染类似下面图片的内容。搜索“demotivational\
    \ posters”（反励志海报）来获取灵感。\n\n"
- fmt: "\nWe’ve seen how JSX can express nested components, just like HTML. And we’ve\
    \ seen that custom components can accept `props` as arguments, and use those props\
    \ to render content or pass along to child components.\n\nThere’s a special prop\
    \ we haven’t talked about yet: it’s called `children`.\n\nLet’s say you wanted\
    \ to make a reusable `IconButton` component that looked something like this:\n\
    \n![IconButton](media/file14.png) \n\nYou might imagine using it like this:\n\n\
    ```jsx\n<IconButton>Do The Thing</IconButton>\n```\n\nWhat happens to that inner\
    \ text, “Do The Thing”? Well, that’s where the `children` prop comes in.\n\nYou\
    \ have to explicitly render the children somewhere in your component. If you don’t,\
    \ they are ignored. For instance, if the `IconButton` component looked like this:\n\
    \n```jsx\nfunction IconButton() {\n  return (\n    <button>\n      <i class=\"\
    target-icon\"/>\n    </button>\n  );\n}\n```\n\nThe rendered component would be\
    \ a button with an icon, and *no text*. It would look like this:\n\n![IconButton](media/file15.png)\
    \ \n\nWith a small tweak, we can place the text after the icon:\n\n```jsx\nfunction\
    \ IconButton({ children }) {\n  return (\n    <button>\n      <i class=\"target-icon\"\
    />\n      {children}\n    </button>\n  );\n}\n```\n\n## Different Types of Children\n\
    \nThe `children` prop is always pluralized as `children` no matter whether there’s\
    \ a single child or multiple children. Moreover, the type of `children` will change\
    \ depending on what it contains.\n\nWhen there are multiple children, `children`\
    \ is an array of `ReactElements`.\n\nHowever, when there is only one child, it\
    \ is a `single ReactElement`. This might seem a little weird: wouldn’t it be easier\
    \ to deal with if `children` was always an array?\n\nWell, yes, it would. But\
    \ `children` is used so often, and the single-child use case is common enough\
    \ that the React team decided to optimize by not allocating an array when there’s\
    \ only one child.\n\n## Dealing with the Children\n\nReact provides utility functions\
    \ for dealing with this opaque data structure.\n\n- `React.Children.map(children,\
    \ function)`\n- `React.Children.forEach(children, function)`\n- `React.Children.count(children)`\n\
    - `React.Children.only(children)`\n- `React.Children.toArray(children)`\n\nThe\
    \ first two, `map` and `forEach`, work the same as the methods on JavaScript’s\
    \ built-in `Array`. They accept `children`, whether it’s a single element or an\
    \ array, and a function that’ll be called for each element. `forEach` iterates\
    \ over the children and returns nothing, whereas `map` returns an array made up\
    \ of the values you return from the function you provide.\n\n`count` is pretty\
    \ self-explanatory: it returns the number of items in `children`.\n\n`toArray`\
    \ is similarly intuitive: it converts `children` into a flat array, whether it\
    \ was an array or not.\n\n`only` returns the single child, or throws an exception\
    \ if there is more than one child.\n\nYou have access to every child element individually,\
    \ so you can reorder them, remove some, insert new ones, pass the children down\
    \ to further children, and so on.\n\n## PropTypes for Children\n\nIf you want\
    \ your component to accept zero, one, or more children, use the `.node` validator:\n\
    \n```jsx\npropTypes: {\n  children: PropTypes.node\n}\n```\n\nIf you want it to\
    \ accept only a single child, use the `element` validator:\n\n```jsx\npropTypes:\
    \ {\n  children: PropTypes.element\n}\n```\n\nBeware that this expects a single\
    \ `React Element` as a child. This means it has to be a custom component, or a\
    \ tag like `<div>`. `PropTypes.element` will warn if you pass a string or number.\
    \ If you need to allow an element *or* a string, you can use the `oneOfType` validator\
    \ like this:\n\n```jsx\npropTypes: {\n  children: PropTypes.oneOfType([\n    PropTypes.element,\n\
    \    PropTypes.string\n  ])\n}\n```\n\nAs with any other `propType`, they are\
    \ optional unless you append `.isRequired`.\n\n## Versus Transclusion in Angular\n\
    \nIf you’ve used Angular, you may be familiar with the concept of “transclusion,”\
    \ a made-up word that Angular uses to mean “take the child elements of a directive\
    \ and insert them where `ng-transclude` is.”\n\nReact’s `children` prop is a similar\
    \ concept, but more powerful and a bit easier to wrap your head around.\n\n##\
    \ A More Interesting Example\n\nIn the example above, we simply inserted some\
    \ text. What if we wanted to do something more expressive, like creating our own\
    \ custom component hierarchy?\n\nImagine that we constructed our own “API” of\
    \ sorts for expressing a navigation header:\n\n```jsx\n<Nav>\n  <NavItem url='/'>Home</NavItem>\n\
    \  <NavItem url='/about'>About</NavItem>\n  <NavItem url='/contact'>Contact</NavItem>\n\
    </Nav>\n```\n\nUsing the `children` prop, the `Nav` component can do things like\
    \ insert a separator between each item:\n\n```jsx\nfunction Nav({ children })\
    \ {\n  let items = React.Children.toArray(children);\n  for(let i = items.length\
    \ - 1; i >= 1; i--) {\n    items.splice(i, 0, \n      <span key={i} className='separator'>|</span>\n\
    \    );\n  }\n  return (\n    <div>{items}</div>\n  );\n}\n```\n\nThe code converts\
    \ children into an array, then walks backward from the end as it inserts a new\
    \ element between every existing element.\n\nYou will implement `NavItem` in the\
    \ exercises coming up. It could render a simple link, or an icon next to a link,\
    \ or anything you’d like.\n\n## Exercises\n\nNow that you’ve seen how the `children`\
    \ prop works, here are some exercises to improve your understanding.\n\n1. Make\
    \ a component to display an “error box” that looks like this:\n\n![An error box](media/file16.png)\
    \ \n\nInvoking the component should look like this:\n\n```jsx\n<ErrorBox>\n  Something\
    \ has gone wrong\n</ErrorBox>\n```\n\nUse the `children` prop to place the text\
    \ properly. The image above uses [Bootstrap](http://getbootstrap.com/getting-started/#download-cdn)\
    \ for styling and [Font Awesome](https://www.bootstrapcdn.com/fontawesome/) for\
    \ the icon. You can add these libraries to your `public/index.html` file if you\
    \ like.\n\n2. Every React component has a `type` property, which means you can\
    \ inspect the type of a child by iterating over it with `React.Children.forEach`.\n\
    \nCreate the `Nav` and `NavItem` components we looked at. `NavItem` should take\
    \ a `url` prop and the link text as a child, then render an anchor tag (`<a>`)\
    \ element with that text, and pointing to that `url`.\n\nNext, modify the `Nav`\
    \ component to check that every one of its children is a `NavItem`, and throw\
    \ an error if any other type of component is found.\n\nAs a test, the example\
    \ code from earlier should work correctly:\n\n```jsx\n<Nav>\n  <NavItem url='/'>Home</NavItem>\n\
    \  <NavItem url='/about'>About</NavItem>\n  <NavItem url='/contact'>Contact</NavItem>\n\
    </Nav>\n```\n\nAnd this code should throw an error:\n\n```jsx\n<Nav>\n  <NavItem\
    \ url='/'>Home</NavItem>\n  <NavItem url='/about'>About</NavItem>\n  <a href='/contact'>Contact</a>\n\
    </Nav>\n```\n\n3. Create a `Dialog` component which accepts as children `Title`,\
    \ `Body`, and `Footer` components, all optional. `Dialog` should verify that all\
    \ of its children are one of these types, and should output something that looks\
    \ like this:\n\n![A dialog](media/file17.png) \n\nFeel free to use Bootstrap’s\
    \ modal styles, or create your own.\n\n# Example: GitHub File List\n\nYou have\
    \ a few components under your belt now. You’ve seen props and propTypes, and written\
    \ some JSX.\n\nBefore we move into state and interactivity, I want to go through\
    \ an example that incorporates everything we’ve seen so far. There’ll be a few\
    \ new techniques covered here too.\n"
