    \n开发者控制台是调试时一个非常有用的工具，在完成示例和练习时保持它开启是一个很棒的主意。它能帮助你发现拼写错误，并节省大量寻找问题的时间。\n\n###\
    \ React Dev Tools\n\n如果你安装了 React 开发工具，你会在浏览器开发者工具中看到一个“React”标签，如下：\n\n![React\
    \ Dev Tools tab](img/file0.png)\n\n选择此标签，并在树中寻找你的组件。你可以使用搜索框找到它，而无需逐层深入。当你点击一个组件时，它的\
    \ `Props` 和 `State` 将出现在侧边面板中。确保这些值与你的预期一致。你甚至可以直接在侧边面板中修改 `Props` 和 `State`，看到组件随着你的更改而重新渲染。试一下！\n\
    \n# Hello World\n\n到此时，你已经安装了 `node`、`npm` 和 `create-react-app`。所有工具已就绪。让我们写些代码吧！\n\
    \n### Step 1\n\n使用 `create-react-app` 命令生成一个新项目。它将创建一个目录并安装所有必要的包，然后我们进入该新目录。\n\
    \n```\n$ create-react-app react-hello\n$ cd react-hello\n```\n\n生成的项目包含一些我们现在不需要的文件，所以我们将删除它们。你也可以直接忽略它们。\n\
    \n```\n$ rm src/App.* src/index.css src/logo.svg\n```\n\n### Step 2\n\n打开 `src/index.js`\
    \ 文件。删除所有内容，并输入以下代码：\n\n> **手打一遍？像个野蛮人一样？** 手动输入比简单的复制粘贴更能让它刻在你的脑子里。你正在形成新的神经元通路。这些通路有一天会理解\
    \ React 的。帮帮它们。\n\n```\nimport React from 'react';\nimport ReactDOM from 'react-dom';\n\
    \nfunction HelloWorld() {\n  return (\n    <div>Hello World!</div>\n  );\n}\n\n\
    ReactDOM.render(\n  <HelloWorld/>,\n  document.querySelector('#root'));\n```\n\
    \n顶部的 `import` 语句是 ES6 特性。这些行将出现在书中看到的每一个 `index.js` 文件的顶部。\n\n与 ES5 不同，我们不能简单地包含\
    \ `<script>` 标签并获取全局对象 `React`。因此，`import React from 'react'` 语句创建了一个名为 `React`\
    \ 的新变量，其内容为 `react` 模块。\n\n"
- fmt: "\nThe strings ‘react’ and ‘react-dom’ are important: they correspond to the\
    \ names of modules installed by `npm`. If you’re familiar with Node.js, `import\
    \ React from 'react'` is equivalent to `var React = require('react')`.\n\n###\
    \ Step 3\n\nFrom inside the `react-hello` directory, start the app by running:\n\
    \n```bash\n$ npm start\n```\n\nA browser will open up automatically and display\
    \ “Hello World!”\n\n### How the Code Works\n\nLet’s start at the bottom, with\
    \ the call to `ReactDOM.render`. That’s what actually makes this work. This bit\
    \ of code is regular JavaScript, despite the HTML-looking `<HelloWorld/>` thing\
    \ there. Try commenting out that line and watch how Hello World disappears.\n\n\
    React uses the concept of a `virtual DOM`. It creates a representation of your\
    \ component hierarchy and then `renders` those components by creating real DOM\
    \ elements and inserting them where you tell it. In this case, that’s inside the\
    \ element with an id of `root`.\n\n`ReactDOM.render` takes 2 arguments: what you\
    \ want to render (your component, or any other React Element) and where you want\
    \ to render it into (a real DOM element).\n\n```\nReactDOM.render([React Element],\
    \ [DOM element]);\n```\n\nAbove that, we have a `component` named `HelloWorld`.\
    \ The primary way of writing React components is as plain functions like this.\
    \ They’re often called “stateless function components.”\n\nThere are 2 other ways\
    \ to create components: ES6 classes, and the now-deprecated `React.createClass`.\
    \ You may still see the `createClass` style in old Stack Overflow answers or old\
    \ GitHub projects, so we’ll go over how it works. But primarily we’ll be writing\
    \ functions where possible, and ES6 classes when we need to.\n\nThe HTML-like\
    \ syntax inside the `render` function is called `JSX`, and we’ll cover that next.\n\
    \n# JSX: What and Why\n\nOne of the first things you probably noticed about React\
    \ code is that it looks like the component function is returning HTML. This HTML-like\
    \ syntax is actually called JSX.\n\n## What Is JSX?\n\nJSX is a syntax invented\
    \ for React that looks very similar to (X)HTML. It allows you to create elements\
    \ by writing in a familiar-looking syntax, instead of writing out function calls\
    \ by hand. The HTML-like syntax actually compiles down to real JavaScript, which\
    \ we’ll talk about below.\n\n## HTML Inside JavaScript?!\n\nBefore I even seriously\
    \ looked into React, I knew it mixed HTML and JS, and I thought that was just\
    \ *ugly*. I mean, that’s undoing *years* of best-practices thinking, right? Since\
    \ the Dark Days of jQuery we’ve known that directly setting `innerHTML` on elements\
    \ from within JS was hackish and performed badly – not to mention full of security\
    \ holes – so why is React making those same mistakes all over again?\n\nDid you\
    \ notice how there are no quotes around the “HTML”? That’s because `it’s not a\
    \ string.`. The lack of quotes is not just a trick, either. React is *not* parsing\
    \ that thing and converting it into HTML.\n\nI know, I know, it looks like HTML.\
    \ In reality though, JSX is just a nice syntactic sugar over function calls that\
    \ create DOM elements.\n\nSo what is React actually doing here? How does this\
    \ work? And why isn’t it terrible?\n\n### JSX Is Compiled to JavaScript\n\nThe\
    \ JSX elements you write are actually compiled down to JavaScript by a tool called\
    \ Babel. Babel is a “transpiler,” a made-up word that means it transforms code\
    \ into valid ES5 JavaScript that all browsers can understand. Each JSX element\
    \ becomes a function call, where its arguments are its attributes (“props”) and\
    \ its contents (“children”).\n\nHere’s an example of some simple JSX:\n\n```\n\
    return <span>Hello!</span>;\n```\n\nAnd here is the JavaScript generated by the\
    \ compiler:\n\n```javascriptreturn React.createElement(\n  'span',\n  {},\n  'Hello!');\n\
    ```\n\nThe `React.createElement` function signature looks like this:\n\n```\n\
    React.createElement(\n  string|element,\n  [propsObject],\n  [children...])\n\
    ```\n\nThe `string|element` can be a string describing an HTML or SVG tag (like\
    \ `'div'` or `'span'`), or it can be a component (like `HelloWorld`, with no quotes).\n\
    \nThe `propsObject` and `children` are optional, and you can also supply more\
    \ than one child by passing additional arguments:\n\n```javascript\nReact.createElement(\n\
    \  'div',\n  {},\n  'Hello',\n  'World'\n);\n```\n\nYou can also nest the calls:\n\
    \n```javascript\nReact.createElement('div', {},\n  React.createElement('div',\
    \ {}, 'Child1'),\n  React.createElement('div', {}, 'Child2',\n    React.createElement('div',\
    \ {}, 'Child2_child')\n  )\n);\n```\n\nTry it yourself! Rewrite the `HelloWorld`\
    \ component to call `React.createElement` instead of returning JSX.\n\n```javascript\n\
    function HelloWorld() {\n  return (\n    React.createElement(/* ... */)\n  );\n\
    }\n```\n\nHere is a slightly more complicated bit of JSX:\n\n```jsx\n<span className='song-name'>\n\
    \  {props.song.name}\n</span>\n```\n\nAnd here is what it compiles to:\n\n```javascript\n\
    React.createElement('span', \n  { className: 'song-name' },\n  props.song.name\n\
    );\n```\n\nSee how JSX is essentially a nice shorthand for writing function calls?\
    \ You don’t even have to use JSX if you don’t want – you can write out these function\
    \ calls manually.\n\nYour first instinct might be to avoid writing JSX because\
    \ you don’t like the look of “HTML in JS.” Maybe you’d rather write real JavaScript\
    \ function calls, because it feels more “pure” somehow. I suggest giving JSX an\
    \ honest try before you give up on it.\n\nWriting out the `React.createElement`\
    \ calls is not a common approach in the React community. Nearly all React developers\
    \ use JSX, which means code that you see in the wild (on GitHub, Stack Overflow,\
    \ etc) is likely to be written with it.\n\n### But… Separation of Concerns!\n\n\
    This is the number one concern most newcomers have: that pit-of-your-stomach feeling\
    \ that mixing JS with HTML is just *wrong*. It might even make you *angry*.\n\n\
    Before I got into using React, I had the same apprehensions. It took some time\
    \ (and writing a few small apps) before I began to understand the power of this\
    \ unholy mixing. Don’t worry though, because the exercises in this book will give\
    \ you all the practice you need to come to grips with it.\n\nI believe the disdain\
    \ for mixing HTML with JS has a bit of cargo-cult “tradition” behind it. It’s\
    \ a rite of passage for every new web developer, a piece of lore passed down through\
    \ the generations about the Right Way to build web interfaces. “It’s always been\
    \ done this way.”\n\nThere are some good reasons to separate the view from the\
    \ logic. When combined, the code can turn into a tangled mess of conditional logic\
    \ with duplicated HTML everywhere, like badly-written PHP.\n\nIf you have flashbacks\
    \ to PHP or JSPs where database calls were mixed in with view code, and you never\
    \ want to go back to that world, I don’t blame you. React’s pattern of building\
    \ with components helps prevent this.\n\n### Unseparated Concerns\n\nWhen you\
    \ step back and think about it, there are some good reasons to combine the logic\
    \ and the view together.\n\nIf you’ve ever used something like Angular, you’ve\
    \ probably written the logic in one file and the HTML in a separate template file.\n\
    \nTell me, how often have you opened up the template to tweak something without\
    \ having to look at (or change!) the associated JS code? How often have you changed\
    \ the JS without having to touch the template?\n\nIn most code I’ve worked with,\
    \ it’s rare that I can add new functionality without changing both the template\
    \ and its controller. Add a function in one file, call it from the other. Passing\
    \ an extra argument? Gotta change it in two files.\n\nIf they were truly separated\
    \ concerns, this would not be necessary.\n\nWe like to think that splitting the\
    \ JS and the HTML into separate files magically transforms them into “separated\
    \ concerns.” Reusability here we come!\n\nExcept it rarely works that way. The\
    \ JS code and its related template are usually pretty tightly coupled, and naturally\
    \ so – they’re two sides of the same coin.\n"
