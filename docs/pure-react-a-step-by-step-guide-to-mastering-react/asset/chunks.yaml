    *   用户列表

    *   为当前选中的通道或用户维护状态

    *   点击通道或用户进行选择

    *   一次只能选择一个通道或用户

    *   每个通道和用户都有自己的消息历史

    *   为每个通道生成一些虚假消息

    *   仅在选中通道或用户时，在底部显示输入框

    *   在输入框中输入并按回车键会将该消息添加到选中的通道/用户中，并清空输入。


    # 接下来该去哪里


    首先，恭喜你读完了这本书。我希望你在阅读过程中的乐趣，像我撰写这本书时一样多。


    尽管如此，这并不是结束。这只是你 React 之旅的开始。


    到目前，你已经牢固掌握了 React 的基础知识，并且学习了一些 ES6。从这里开始，你可以继续学习 AJAX、Webpack、React Router、Redux
    或 MobX，以及你需要的任何其他内容。


    以下是建议的学习顺序。我认为最后学习 Redux 是重要的，但其他可以根据你的需要重新排序。


    ## AJAX


    学习如何将你的应用连接到服务器很有趣，因为你可以看到应用通过真实数据变得活跃起来。


    React 没有任何内置的与服务器通信的方法，所以你需要使用 HTTP 库。目前有很多可用的库。我喜欢 [fetch](https://github.com/github/fetch)，因为它最终将成为
    JavaScript 标准库的一部分，但 [axios](https://github.com/mzabriskie/axios) 和 [superagent](https://github.com/visionmedia/superagent)
    也是很好的选择。


    你应该如何以及在何发送 HTTP 请求？常见的做法是在 `componentDidMount` 周期方法中获取数据。当响应返回时，调用 `this.setState`
    保存这些数据，并使用 props 将其传递给需要的组件。


    和所有的状态一样，最好尽可能将其保持在组件层次结构的尽可能高位置。例如，如果一个 `Page` 包含了多个 `List` 组件，不要让每个 `List` 都去获取自己的数据——而是在
    `Page` 组件中获取这些数据，并将其作为 props 传递给 `List`。


    ## 测试


    测试是构建软件的重要部分。无论你决定是否使用测试驱动开发 (TDD)，在代码周围编写测试都能让你有信心确保一切都运行如预期。


    测试 React 有一些新工具需要学习。你需要一种进行断言的方法 (Chai)，可能想要一个用于设置间谍的库 (Sinon)，并且绝对想要使用 Enzyme，这是一个由
    Airbnb 创建的用于测试 React 组件的库。


    我整理了一篇文章帮助你开始测试 React，可以点击[这里](https://daveceddia.com/getting-started-with-tdd-in-react/)。


    ## Webpack


    构建工具在刚开始是一个主要的障碍，这就是为什么设置 Webpack 没有包含在本书中。如果你还没有自定义构建的需求，请推后以后学习 Webpack。


    我推荐阅读文章 [Webpack – 令人困惑的部分](https://medium.com/@rajaraodv/webpack-the-confusing-parts-58712f8fcad9)
    作为对 Webpack 及其思维方式的介绍。Egghead.io 也有一个关于 Webpack 的很好的快速介绍，地址是 [`egghead.io/lessons/javascript-intro-to-webpack`](https://egghead.io/lessons/javascript-intro-to-webpack)。


    你应该知道，我们一直在使用的 `create-react-app` 工具有一个生产环境构建模式（运行 `npm run build`），它会创建一个包含压缩文件和生产版本
    React 的生产优化构建。如果你不需要自定义任何内容，Create React App 开箱即用，而且非常适合编写真实的生产级 React 应用。


    它还有一个“eject”命令（运行 `npm run eject`），可以提取生成的 Webpack 构建并将其暴露供你进行自定义。


    ## ES6


    你已经在书中看到了其中的部分内容：箭头函数、let/const、类、解构以及 `import`/`export`。这些是你经常会用的大部分 ES6 内容，但还有许多其他很棒的新特性如
    promises、`for..of` 循环、动态对象键、迭代器等。


    你可以在学习过程中学习这些特性，但至少对所有内容进行快速调研是个好主意，这样你就知道哪些可用。这个 [ES6 特性概述](https://github.com/lukehoban/es6features)是一个非常棒的资源。


    ## 路由


    现在你已经相当地掌握了 React 的工作原理，React Router 的概念将在此基础上构建。它利用组件来布局应用程序的路由，有效地将你的组件映射到 URL。查看
    [Github 上的 React Router](https://github.com/ReactTraining/react-router) 开始吧。


    有些人会在脑中将 React Router 和 Redux 混为一谈——它们实际上并没有关联或相互依赖，尽管有一个库可以将路由状态与 Redux 链接起来。你可以（并且应该！）在深入研究
    Redux 之前学习使用 React Router。


    ## Redux


    Redux 的创建者 Dan Abramov [会告诉你](https://github.com/gaearon/react-makes-you-sad)
    不要过早将 Redux 加入到你的项目中，这很有道理——在遇到它要解决的问题之前，你实际上不需要 Redux。


    Redux 的概念相当简单，但在理解它们如何工作与知道如何使用 Redux 之间存在差距。真正理解 Redux 需要实践。它受到函数式编程概念的影响，如果你不熟悉这些概念，可能需要一些适应。


    所以，在将 Redux 加入到较大的项目之前，重复你在书中做的事情：构建小项目。将使用普通 React 状态的代码转换为使用 Redux。构建许多小型 Redux
    实验来真正掌握工作原理。


    ## 关于脚板项目


    我建议一步一瓦地构建你的项目，根据需要添加各个部分。这样你就能理解所有活动部分是如何工作的，这意味着当它们崩溃时你可以修复它们，或者当你超出默认设置时可以扩展它们。


    很容易掉入一种陷阱，认为学习“纯 React”仅仅是初学者的事，并且对于任何实质性项目基本上必须使用脚板项目（boilerplate projects）。我不认为事实完全如此。


    React 的力量之一是可以按照你喜欢的方式构建自己的技术栈。即使你放弃控制权使用脚板项目，你仍然需要学习那个特定项目的约定。


    脚板项目的魅力之一是它为你规定了项目结构。如果磁盘上的文件结构阻碍了你的进展，请阅读：[`daveceddia.com/react-project-structure/`](https://daveceddia.com/react-project-structure/)


    ## 感谢


    非常感谢你不仅购买而且完成了这本书。我很想知道你的想法——哪些做得好，哪些需要改进，或者对未来主题的任何建议。可以通过邮件 dave@daveceddia.com
    联系我，或在 Twitter 上通过 @dceddia 联系我。


    '
