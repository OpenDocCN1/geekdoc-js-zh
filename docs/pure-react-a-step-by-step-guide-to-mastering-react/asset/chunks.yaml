  trans: "\n第三种思路是将 `children` 传递给 `Item`，让它来决定将其放在哪里。这是我们将实现的思路。这使得 `Item` 具有很好的复用性。如果你想要“加入购物车”按钮，就将其传进去；如果你想要的是添加/删除按钮，也把它们传进去。让我们来看看它是如何运作的。\n\
    \n### 重构 Item\n\n新的 `Item` 及其 `propTypes` 如下所示：\n\n```javascript\nconst Item =\
    \ ({ item, children }) => (\n  <div className=\"Item\">\n    <div className=\"\
    Item-left\">\n      <div className=\"Item-image\" />\n      <div className=\"\
    Item-title\">{item.name}</</div>\n      <div className=\"Item-description\">{item.description}</div>\n\
    \    </div>\n    <div className=\"Item-right\">\n      <div className=\"Item-price\"\
    >${item.price}</div>\n      {children}\n    </div>\n  </div>\n);\nItem.propTypes\
    \ = {\n  item: PropTypes.object.isRequired,\n  children: PropTypes.node\n};\n\
    ```\n\n在曾经有 `<button>` 的地方，我们现在用 `{children}` 代替。此外，`Item` 不再需要感知 `onAddToCart`\
    \ 函数，因此我们删除了它的 propType。\n\n如果你在此时刷新页面，你会发现“加入购物车”按钮已经从购物车页面*以及*商品页面中消失了。为了修复这个问题，打开\
    \ `ItemPage.js` 并将 `<button>` 作为 `Item` 的子元素传递：\n\n```javascript\nfunction ItemPage({\
    \ items, onAddToCart }) {\n  return (\n    <ul className=\"ItemPage-items\">\n\
    \      {items.map(item =>\n        <li key={item.id} className=\"ItemPage-item\"\
    >\n          <Item item={item}>\n            <button\n              className=\"\
    Item-addToCart\"\n              onClick={() => onAddToCart(item)}>\n         \
    \     Add to Cart\n            </button>\n          </Item>\n        </li>\n \
    \     )}\n    </ul>\n  );\n}\n```\n\n搞定了，恢复正常。现在处理新部分：打开 `CartPage.js`，在 `Item`\
    \ 内部传递加/减按钮和商品数量。我们还需要用于在添加或删除商品时调用的处理函数。\n\n```javascript\nfunction CartPage({\
    \ items, onAddOne, onRemoveOne }) {\n  return (\n    <ul className=\"CartPage-items\"\
    >\n      {items.map(item =>\n        <li key={item.id} className=\"CartPage-item\"\
    >\n          <Item item={item}>\n            <div className=\"CartItem-controls\"\
    >\n              <button\n                className=\"CartItem-removeOne\"\n \
    \               onClick={() => onRemoveOne(item)}&ndash;</button>\n          \
    \    <span className=\"CartItem-count\">{item.count}</span>\n              <button\n\
    \                className=\"CartItem-addOne\"\n                onClick={() =>\
    \ onAddOne(item)}>+</button>\n            </div>\n          </Item>\n        </li>\n\
    \      )}\n    </ul>\n  );\n}\nCartPage.propTypes = {\n  items: PropTypes.array.isRequired,\n\
    \  onAddOne: PropTypes.func.isRequired,\n  onRemoveOne: PropTypes.func.isRequired\n\
    };\n```\n\n这些都是你以前见过的内容。在我们传递这些函数之前代码将无法工作，所以回到 `App.js` 并创建它们。在 `renderCart`\
    \ 的底部，我们需要将 props 传递给 `CartPage`：\n\n```javascript\nclass App extends Component\
    \ {\n  // ...\n  renderCart() {\n    // ...\n    return (\n      <CartPage\n \
    \       items={items}\n        onAddOne={this.handleAddToCart}\n        onRemoveOne={this.handleRemoveOne}\
    \ />\n    );\n  }\n  // ...\n}\n```\n\n我们已经有了 `handleAddToCart` 函数，它接收一个商品并将 id\
    \ 添加到购物车，所以我们可以直接复用它。我们需要创建 `handleRemoveOne` 函数。它将接收一个商品，在购物车中找到该商品，然后更新 `cart`\
    \ 状态将其移除。\n\n```javascript\nclass App extends Component {\n  // ...\n  handleRemoveOne\
    \ = (item) => {\n    let index = this.state.cart.indexOf(item.id);\n    this.setState({\n\
    \      cart: [\n        ...this.state.cart.slice(0, index),\n        ...this.state.cart.slice(index\
    \ + 1)\n      ]\n    });\n  }\n  // ...\n}\n```\n\n我们使用了两次数组*展开*（spread）运算符，以避免变变状态。我们获取数组的左半部分（直到我们要删除的商品），并与数组的右半部分（被删除商品之后的所有内容）拼接。\n\
    \n这比允许变异要多一点工作，但这是一个值得养成的习惯。如果你将来开始使用 Redux，这将特别重要。Redux 极度依赖不可变性。\n\n为了完善添加/删除按钮，让我们给它们添加一些样式。在\
    \ `CartPage.css` 中添加此 CSS：\n\n```css\n.CartPage-items {\n  margin: 0;\n  padding:\
    \ 0;\n}\n.CartPage-items li {\n  list-style: none;\n}\n.CartItem-count {\n  padding:\
    \ 5px 10px;\n  border: 1px solid #ccc;\n}\n.CartItem-addOne,\n.CartItem-removeOne\
    \ {\n  padding: 5px 10px;\n  border: 1px solid #ccc;\n  background: #fff;\n}\n\
    .CartItem-addOne {\n  border-left: none;\n}\n.CartItem-removeOne {\n  border-right:\
    \ none;\n}\n```\n\n这里它大功告成了：\n\n![Cart is working](img/file42.png)\n\n### 练习\n\
    \n1. 如果购物车能告诉我们准备在苹果产品上花费多少美元，而不是让我们猜会更好。在购物车页面底部添加一个“总计”，如下所示：\n\n![Cart Total](img/file43.png)\n\
    \n2. 购物车为空时是完全空白的。修改它，在没有商品时显示“您的购物车为空”，如下：\n\n![Cart Total](img/file44.png)\n\
    \n3. 在导航栏右上角显示购物车摘要，如下所示。包含商品总数和总价。考虑到购物车数组中的每个商品数量可能大于 1。作为额外奖励，让购物车摘要可点击并切换到购物车页面。添加一个你喜欢的购物车图标（这个来自\
    \ Font Awesome）。\n\n![Cart Summary](img/file45.png)\n\n4. 构建一个简化版的 Reddit，模型如下所示：\n\
    \n![Reddit](img/file46.png)\n\n它应该具备以下功能：\n\n* 显示投票数\n* 可运行的点赞/踩控制\n* 显示评论数\n\
    * 按点赞数对故事进行排序\n* 标题应该是一个真实的链接\n* 其他链接不需要具有功能（分享、保存、隐藏等）\n\n遵循我们整本书以来的方法：列出截图中的组件，决定需要保留哪些状态以及哪些组件应该拥有这些状态，然后开始构建组件。\n\
    \nReddit 的 API 是公开的，不需要密钥。你可以使用静态数据，例如 http://www.reddit.com/r/reactjs.json 将将其保存到文件中并像我们在几个示例中所那样进行导入。\n\
    \n5. 构建一个简化版的 Slack，模型基于此 UI：\n\n![Slack Clone](img/file47.png)\n\n它应该具备的功能有：\n\
    \n* 频道列表\n"
