  trans: "\n\n在静态推文的示例中，`Time` 被写为一个箭头函数，所以我保留了它的写法。然而，因为现在它包含 2 条语句，它需要外层的大括号，这导致它需要一个\
    \ `return`。当然，你可以通过将 `moment(time).fromNow()` 直接移动到 `<span >` 内部来简化，这样你就可以移除 `return`\
    \ 和大括号。这交由你决定。\n\n## 应该传递什么作为 Prop？\n\nProps 可以接受各种类型：数字、布尔值、字符串、对象，甚至是函数。在早期阶段，你可能会想，是应该传递一个对象并让组件提取它需要的内容？还是应该传递组件所需的特定数据片段？\n\
    \n在这里的示例中，我们传递的是特定的数据片段。\n\n我们也可以直接传递 `tweet` 对象本身。例如，与其直接向 `Time` 组件传递时间戳，我们不如传递\
    \ `tweet` 并让它从推文中提取时间戳。为什么不那样做呢？这里有几点原因：\n\n*   如果 `Time` 期望一个推文对象并提取出 `timestamp`\
    \ 属性，那么它除了推文对象以外的任何地方都无法使用。如果你有一个具有名为“updated_at”时间戳属性的用户，并想用 `Time` 组件渲染它怎么办？嗯，你做不到，除非你临时凑出一个“看起来像”带有时间戳的推文临时对象。\n\
    \n*   `Time` 组件将了解 `tweet` 对象的内部结构。这看起来可能不是什么大问题，直到你有 10 个这样的组件，而后端人员决定大写字母“S”的“timeStamp”比小写的“timestamp”看起来更好，现在你必须得更新所有这些组件。将数据结构的知识保持在尽可能少的地方，是一个好主意，这样可以降低更改成本。\n\
    \n## Props 命名指南\n\n俗话说：“计算机科学中有两件极其困难的事：缓存失效、命名以及差一错误（off-by-one errors）。”\n\n\
    你为 props 选择的名字将影响组件的使用方式，以及组件之间的耦合方式。想象一下，如果我们编写 `Time` 来接收一个名为 `tweetTime` 的\
    \ prop。即使我们直接传递了时间戳（而不是整个推文对象），这作为 prop 名称仍然不是一个好的选择。为什么呢？\n\n考虑一下当下一个开发者（可能是\
    \ 3 周后的你）出现，并想在应用程序中与推文无关的新部分复用 `Time` 组件会发生什么。渲染结果会正常，但代码会很别扭。如果时间戳实际上并不属于某个推文，编写\
    \ `<Time tweetTime={timestamp}/>` 就表达了错误的意图。\n\n更有可能的是，开发者会查看 `Time`，看到它期望 `tweetTime`，然后决定不复用该组件——要么是因为他们假设它不适用于他们的目的，要么是因为他们担心底层实现可能会改变并破坏他们的代码。\n\
    \n### 剩余的组件\n\n让我们回到将 `Tweet` 及其子组件转换为使用 props。只剩下两个组件了：`RetweetButton` 和 `LikeButton`，它们需要显示转发和点赞的数量。目前，它们完全没有显示任何数字，只有一个图标。\n\
    \n修改这两行：\n\n```jsx\n<RetweetButton/>\n<LikeButton/>\n```\n\n修改为这些行（传递计数值）：\n\n\
    ```jsx\n<RetweetButton count={tweet.retweets}/>\n<LikeButton count={tweet.likes}/>\n\
    ```\n\n然后，更新 `RetweetButton` 和 `LikeButton` 以接受新的 `count` prop 并渲染它们各自的数字：\n\n\
    ```jsx\nfunction getRetweetCount(count) {\n  if(count > 0) {\n    return (\n \
    \     <span className=\"retweet-count\">\n        {count}\n      </span>\n   \
    \ );\n  } else {\n    return null;\n  }\n}\n\nconst RetweetButton = ({ count })\
    \ => (\n  <span className=\"retweet-button\">\n    <i className=\"fa fa-retweet\"\
    />\n    {getRetweetCount(count)}\n  </span>\n);\n```\n\n```jsx\nconst LikeButton\
    \ = ({ count }) => (\n  <span className=\"like-button\">\n    <i className=\"\
    fa fa-heart\"/>\n    {count > 0 &&\n      <span className=\"like-count\">\n  \
    \      {count}\n      </span>}\n  </span>\n);\n```\n\n最后，样式也需要更新。移除这些行：\n\n```css\n\
    .buttons i {\n  width: 80px;\n}\n```\n\n然后用这些替换掉它们：\n\n```css\n.reply-button,\
    \ .retweet-button,\n.like-button, .more-options-button {\n  width: 80px;\n  display:\
    \ inline-block;\n}\n\n.like-count, .retweet-count {\n  position: relative;\n \
    \ bottom: 2px;\n  font-size: 13px;\n  margin-left: 6px;\n  font-weight: bold;\n\
    }\n```\n\n搞定！\n\n![完成的 Tweet](img/file8.png)\n\n让我们过一遍代码。尽管看起来不同，这些组件确定如何显示计数的逻辑是相同的。\n\
    \n### RetweetButton\n\n在 `RetweetButton` 中，计算被提取到一个名为 `getRetweetCount` 的独立函数中。它要么返回一个\
    \ `<span>` 元素要么返回 `null`。\n\n注意，我们需要在图标和计数周围引入一个包裹的 span 元素。记住，React 组件只能返回单个元素（尝试移除\
    \ span 看看会发生什么）。\n\n还要注意，当 JSX 中单大括号内的表达式求值结果 `null` 或 `false` 时，什么都不会被渲染。为了证明这一点，打开\
    \ Chrome 的开发者工具元素检查器，并检查点赞数为 0 的转发按钮：不应该看到任何“like-count” span。\n\n值得注意的是，`getRetweetCount`\
    \ 函数可以写成一个组件——它几乎已经是一个组件了。它可能像这样：\n\n```jsx\nfunction Count({ count }) {\n  if(count\
    \ > 0) {\n    return (\n      <span className=\"retweet-count\">\n        {count}\n\
    \      </span>\n    );\n  } else {\n    return null;\n  }\n}\n\nconst RetweetButton\
    \ = ({ count }) => (\n  <span className=\"retweet-button\">\n    <i className=\"\
    fa fa-retweet\"/>\n    <Count count={count} />\n  </span>\n);\n```\n\n函数必须重命名为以大写字母开头（记住组件名称必须大写字母开头），并且它的参数需要替换为解构赋值以提取\
    \ `count`。否则它看起来是一样的。那么在 `RetweetButton` 中使用它只是插入一些 JSX 的问题。\n\n### LikeButton\n\
    \n对于 `LikeButton`，逻辑处理稍有不同。不是将逻辑提取到函数中，而是通过布尔运算符（`&&`）内联完成。但同样，它渲染一个 span 或 null。\n\
    \n### 另一种选择\n\n这里有第三种选择，纯属好玩，它的微小不同在于它总是输出一个类名为“like-count”的 `<span>`，但内容可以是空的：\n\
    \n```jsx\nconst LikeButton = ({ count }) => (\n  <span className=\"like-button\"\
    >\n    <i className=\"fa fa-heart\"/>\n    <span className=\"like-count\">\n \
    \     {count ? count : null}\n    </span>\n  </span>\n);\n```\n\n如你所见，使用 JSX 有多种方法可以实现相同的功能。\n\
    \n# PropTypes\n\n## 文档与调试合为一\n\n我们已经看到了“props”是什么，以及它们是如何传递给 React 组件的——但如果你忘记传递其中一个\
    \ prop 会发生什么？\n\n"
- fmt: "\nWell, it ends up being undefined, just as if you’d forgotten to pass an\
    \ argument to a plain old function. This can be totally fine, or a code-breaking\
    \ disaster (just as if you’d forgotten to pass an argument to a plain old function).\n\
    \nReact has a secret weapon though: `PropTypes`.\n\nWhen you create a component,\
    \ you can declare that certain props are optional or required, *and* you can declare\
    \ what type of value that prop expects. Here’s an example:\n\n```javascript\n\
    import PropTypes from 'prop-types';\n\nfunction Comment({ author, message, likes\
    \ }) {\n  return (\n    <div>\n      <div className='author'>{author}</div>\n\
    \      <div className='message'>{message}</div>\n      <div className='likes'>\n\
    \        {likes > 0 ? likes : 'No'} likes\n      </div>\n    </div>\n  );\n}\n\
    Comment.propTypes = {\n  message: PropTypes.string.isRequired,\n  author: PropTypes.string.isRequired,\n\
    \  likes: PropTypes.number\n}\n```\n\nFirst, notice that `PropTypes` must be explicitly\
    \ imported from the `prop-types` package. This is a change that came with React\
    \ 15.5. You should already have this package installed if you’re using Create\
    \ React App, but if not, a quick `npm install --save prop-types` will fix that.\n\
    \nNext, notice that `propTypes` are set as a property on the function itself.\
    \ This style works whether the component is a function, or an arrow function,\
    \ or even an ES6 class (which we’ll see later).\n\nFinally, notice that the `propTypes`\
    \ attribute starts with a lowercase “p” while the imported `PropTypes` starts\
    \ with a capital “P”.\n\nWith this set of propTypes, `message` and `author` are\
    \ required, and must be strings. The `likes` prop is optional, but must be a number\
    \ if it’s provided. Try rendering it a few different ways, and check the console\
    \ each time:\n\n```javascript\n<Comment author='somebody' message='a likable message'\
    \ likes={1}/>\n<Comment author='mr_unpopular' message='unlikable message'/>\n\
    <Comment author='mr_unpopular' message='another message' likes={0}/>\n<Comment\
    \ author='error_missing_message'/>\n<Comment message='mystery author'/>\n```\n\
    \nReact will warn you in the console if you forget a required prop:\n\n```javascript\n\
    <Comment author='an_error'/>\n```\n\n> Warning: Failed propType: Required prop\
    \ `message` was not specified in `Comment`.\n\nLikewise, you’ll get a warning\
    \ if you pass the wrong type:\n\n```javascript\n<Comment author={42}/>\n```\n\n\
    > Warning: Failed propType: Invalid prop `author` of type `number` supplied to\
    \ `Comment`, expected `string`.\n\nThese warning messages are invaluable for debugging.\
    \ It tells you the mistake you made, *and* gives you a hint where to look! This\
    \ is a fair bit better than some frameworks that silently fail when you forget\
    \ a required attribute.\n\n### The Catch\n\nSo: what’s the catch? All this nice\
    \ error handling must have a catch, right?\n\nWell, sort of. The only catch with\
    \ propTypes is that *you must remember to declare them*. Providing propTypes is\
    \ optional, and React won’t give you any warnings if you don’t specify propTypes\
    \ for one of your components.\n\nYou can either vow to be super-diligent about\
    \ writing those propTypes, or you can have a *linter* tool check for you. I recommend\
    \ the second one.\n\nESLint is a popular choice, and there is a React plugin for\
    \ ESLint that will check for things like missing PropTypes and that props are\
    \ passed correctly.\n\n## How Do I Validate Thee, Let Me Count the Ways\n\nReact’s\
    \ propTypes allow you to express many different validations. By default, a propType\
    \ validation is *optional*. If you want to make it required, add `.required` to\
    \ the end.\n\nFirst, there are validators for the standard JavaScript types:\n\
    \n* `PropTypes.array`\n* `PropTypes.bool`\n* `PropTypes.func`\n* `PropTypes.number`\n\
    * `PropTypes.object`\n* `PropTypes.string`\n\nYou saw the `string` and `number`\
    \ validators in the `Comment` component earlier. The others work the same way\
    \ – validating that an array is passed in, or a boolean, or a function, or whatever.\n\
    \nThere are validators for `node` and `element`. A `node` is anything that can\
    \ be rendered, meaning numbers, strings, elements, or an array of those. An `element`\
    \ is a React element created with JSX or by calling `React.createElement`:\n\n\
    * `PropTypes.node`\n* `PropTypes.element`\n\nThere’s an `instanceOf` validator\
    \ for checking that the prop is an instance of a specific class. It takes an argument:\n\
    \n* `PropTypes.instanceOf(SpecificClass)`\n\nYou can limit to specific values\
    \ with `oneOf`:\n\n* `PropTypes.oneOf(['person', 'place', 1234])`\n\nYou can validate\
    \ that the prop is one of a few types:\n\n```javascript\nPropTypes.oneOfType([\n\
    \  PropTypes.string,\n  PropTypes.boolean\n])\n```\n\nYou can validate that it’s\
    \ an array of a certain type, or an object whose properties are values of a certain\
    \ type:\n\n* `PropTypes.arrayOf(PropTypes.string)`\n    * Would match: `['a',\
    \ 'b', 'c']`\n    * Would not match: `['a', 'b', 42]`\n* `PropTypes.objectOf(PropTypes.number)`\n\
    \    * Would match: `{age: 27, birthMonth: 9}`\n    * Would not match: `{age:\
    \ 27, name: 'Joe'}`\n\nYou can validate that an object has a certain *shape*,\
    \ meaning that it has particular properties. The object passed to this prop is\
    \ allowed to have *extra* properties too, but it must at least have the ones in\
    \ the shape description.\n\n```javascript\nPropTypes.shape({\n  name: PropTypes.string,\n\
    \  age: PropTypes.number\n})\n```\n\nThis will match an object of the exact shape,\
    \ like this:\n\n```javascript\nperson = {\n  name: 'Joe',\n  age: 27\n}\n```\n\
    \nIt will also match an object with additional properties, like this:\n\n```javascript\n\
    person = {\n  name: 'Joe',\n  age: 27,\n  address: '123 Fake St',\n  validPerson:\
    \ false\n}\n```\nThis PropTypes `shape` is requiring `name` and `age` keys, so\
    \ if we leave one of them off, it won’t pass. This would generate a warning:\n\
    \n```javascriptperson = {\n  age: 27\n}\n```\n\nSimilarly, if we pass the wrong\
    \ type for one of those keys, we’ll get a warning:\n\n```javascript\nperson =\
    \ {\n  name: false,  // boolean instead of string\n  age: 27\n}\n```\n\n#### Required\
    \ Props\n\nAny PropType validation can be made required by adding `.required`\
    \ to the end of it. These are all required:\n\n```javascript\nPropTypes.bool.isRequired\n\
    PropTypes.oneOf(['person', 'place', 1234]).isRequired\nPropTypes.shape({\n  name:\
    \ PropTypes.string,\n  age: PropTypes.number\n}).isRequired\n```\n\nRemember,\
    \ all PropTypes are *optional* by default, which means you won’t get console warnings\
    \ if you forget to pass a value, or make a typo in a prop name. In most cases,\
    \ you’ll want to append `.required` to your PropType validations.\n\n#### Custom\
    \ Validators\n\nIf the built-in PropType validators aren’t expressive enough,\
    \ you can write your own! The function should take the `props`, `propName`, and\
    \ `componentName`, and return an `Error` if validation fails. Note that’s *return*\
    \ an Error, not *throw* an Error.\n\nA custom validator to check that the passed\
    \ prop is exactly length 3 (either a string or an array) would look like this:\n"
