- fmt: "\nI believe that you can get more learning value out of small projects than\
    \ large or full-stack ones, at least in the beginning. Here’s an idea of what\
    \ I mean. The colored bars are periods of maximum learning, and the gaps are where\
    \ you’re doing things you already know how to do:\n\nAt some point, the larger\
    \ projects have diminishing returns. The first few times you use a text input\
    \ and have to wire it up to maintain its state, you’re learning. By the tenth\
    \ time, it’s boring.\n\nThat isn’t to say that large projects aren’t valuable,\
    \ but I don’t believe they’re good `first` projects. Start small, build a few\
    \ small things, then build a bigger thing or two.\n\nThis is the idea behind `deliberate\
    \ practice` – the practice should be just beyond your current skill level. Not\
    \ so hard that you get frustrated and quit, but not so easy that you can breeze\
    \ right through, either.\n\n## Environment Setup\n\nBefore we dive in, we’ll need\
    \ to set up an environment.\n\nDon’t worry, there’s no boilerplate to clone from\
    \ GitHub. No Webpack config, either.\n\nInstead, we’re using `Create React App`,\
    \ a tool Facebook made. It provides a starter project and built-in build tools\
    \ so you can skip to the fun part – creating your application!\n\n### Prerequisites\n\
    \n#### Tools\n\n*   `Node.js` (at least v4.0, >= 6 recommended)\n*   `NPM` (version\
    \ >= 3 recommended) or `yarn`\n*   `Google Chrome` (or some other modern browser)\n\
    *   `React Developer Tools`\n*   Your text editor or IDE of choice\n\nYou’ll need\
    \ `Node` and `NPM` (or `Yarn`). Head to [https://nodejs.org](https://nodejs.org)\
    \ and download the latest “Current” release. At the time of writing, this is v7.10.0.\n\
    \nAny modern browser should suffice. This book was developed against `Chrome`,\
    \ so that’s what I recommend. If you prefer another browser, I expect the JavaScript\
    \ will work correctly but the CSS could require some tweaks.\n\n#### Yarn\n\n\
    `Yarn` is a relatively new package manager for JavaScript, released in June of\
    \ 2016. Compared to `NPM`, it is faster, and has the benefit of a `lock file`,\
    \ which means it can reliably install the exact same packages every time you run\
    \ `yarn` (`Yarn`’s equivalent to `npm install`).\n\nThe commands are similar to\
    \ `NPM`s:\n\n*   Install all packages: `npm install` or `yarn`\n*   Install a\
    \ certain package: `npm install --save <package>` or `yarn add <package>`\n* \
    \  Start the development server: `npm start` or `yarn start`\n*   Run the tests:\
    \ `npm test` or `yarn test`\n\nRather than padding the pages with things like\
    \ “Run `npm start` (or `yarn start`)” throughout the book, I will only show the\
    \ `NPM` commands from here on. However, feel free to use `Yarn` if you’d like.\
    \ You can install it from [https://yarnpkg.com](https://yarnpkg.com).\n\n####\
    \ React Developer Tools\n\nThe `React Developer Tools` can be installed from here:\
    \ [https://github.com/facebook/react-devtools](https://github.com/facebook/react-devtools)\n\
    \nFollow the instructions to install the tools for your browser. The `React dev\
    \ tools` allow you to inspect the React component tree (as opposed to the DOM\
    \ tree) and view the `props` and `state` assigned to each component. It is extremely\
    \ useful for debugging.\n\n#### Knowledge\n\nYou should already know `JavaScript`\
    \ (at least ES5), `HTML`, and `CSS`. I’ll explain the `ES6` features as they come\
    \ up (you don’t need to already know `ES6`).\n\nI don’t recommend learning `JavaScript`\
    \ and `React` at the same time. When everything looks new, it can be hard to tell\
    \ where “JavaScript” ends and “React” begins. If you need to brush up on `JS`,\
    \ here are some good (and free!) resources:\n\n*   `Speaking JavaScript` (book):\
    \ http://speakingjs.com/\n*   `Exercism` (exercises): http://exercism.io/languages/javascript\n\
    *   `You Don’t Know JS` (book series): https://github.com/getify/You-Dont-Know-JS\n\
    \nA passing familiarity with the command line will be helpful as well.\n\n###\
    \ Project Directory\n\nYou’ll be writing a lot of code throughout this book. To\
    \ keep it organized, create a directory for the exercises. Name it `pure-react`,\
    \ or whatever you like.\n\n### Install Create React App\n\nRun this command to\
    \ install the tool globally (the `-g` means global):\n\n```\n$ npm install -g\
    \ create-react-app\n```\n\nIf you get an error saying “Permission denied” (and\
    \ you’re on Linux or a Mac) you may need to re-run the command with “sudo”, like\
    \ this:\n\n```\n$ sudo npm install -g create-react-app\n```\n\nThat’s it! Let’s\
    \ get to coding.\n\n## Debugging Crash Course\n\nWhen things go wrong, here are\
    \ the steps to follow:\n\n1.  Don’t panic.\n2.  Manually refresh the page. Sometimes\
    \ the auto-refreshing mechanism breaks.\n3.  Check the browser dev console, manually\
    \ refresh the page, and fix any errors you see.\n4.  Check the command line console\
    \ where you ran `npm start`. Look for any errors, and fix those.\n\nTo open the\
    \ dev console in `Chrome` on Mac, press `Option+Command+I`. In `Chrome` on Windows\
    \ or Linux, press `Ctrl+Shift+I`. Then make sure you are on the “Console” tab.\n\
    \nIf you don’t know how to open your browser’s Developer Tools, Google for “open\
    \ browser console [your_browser]”.\n\nLikewise, if you have no idea what an error\
    \ means, copy and paste it into Google.\n\nStill completely stuck? Stack Overflow\
    \ has an abundance of React-related questions and answers, and the `Reactiflux`\
    \ community at [https://www.reactiflux.com/](https://www.reactiflux.com/) is full\
    \ of friendly people who can help. There is also a `#react` IRC channel on Freenode,\
    \ which you connect to with an IRC client or visit [http://irc.lc/freenode/reactjs](http://irc.lc/freenode/reactjs).\n\
    \n### Keep the Console Open!\n\nThe dev console is an amazingly helpful tool for\
    \ debugging, and it’s a great idea to leave it open while you work through the\
    \ examples and exercises. It’ll help you catch typos and save you a lot of time\
    \ hunting down problems.\n\n### React Dev Tools\n\nIf you installed the React\
    \ dev tools, you’ll see a “React” tab in the browser devtools, like this:\n\n\
    ![React Dev Tools tab](media/file0.png)\n\nChoose this tab, and look for your\
    \ component in the tree. You can use the search box to find it without having\
    \ to drill down. When you click on a component, its `Props` and `State` will appear\
    \ in the side pane. Make sure the values agree with what you expect to see. You\
    \ can even modify the `Props` and `State` right in the side pane, and see the\
    \ component re-render with your changes. Try it out!\n\n# Hello World\n\nAt this\
    \ point you have `node`, `npm`, and `create-react-app` installed. All of the tools\
    \ are ready. Let’s write some code!\n\n### Step 1\n\nUse the `create-react-app`\
    \ command to generate a new project. It will create a directory and install all\
    \ the necessary packages, and then we’ll move into that new directory.\n\n```\n\
    $ create-react-app react-hello\n$ cd react-hello\n```\n\nThe generated project\
    \ contains some files we won’t need right now, so we’ll delete them. You could\
    \ also just ignore them.\n\n```\n$ rm src/App.* src/index.css src/logo.svg\n```\n\
    \n### Step 2\n\nOpen up the file `src/index.js`. Delete all of the contents, and\
    \ type this code in:\n\n> **Type it out by hand? Like a savage?** Typing it drills\
    \ it into your brain much better than simply copying and pasting it. You’re forming\
    \ new neuron pathways. Those pathways are going to understand React one day. Help\
    \ ’em out.\n\n```\nimport React from 'react';\nimport ReactDOM from 'react-dom';\n\
    \nfunction HelloWorld() {\n  return (\n    <div>Hello World!</div>\n  );\n}\n\n\
    ReactDOM.render(\n  <HelloWorld/>,\n  document.querySelector('#root'));\n```\n\
    \nThe `import` statements at the top are an ES6 feature. These lines will be at\
    \ the top of every `index.js` file that we see in this book.\n\nUnlike with ES5,\
    \ we can’t simply include a `<script>` tag and get `React` as a global object.\
    \ So, the statement `import React from 'react'` creates a new variable called\
    \ `React` with the contents of the `react` module.\n"
  raw: 'I believe that you can get more learning value out of small projects than
    large or full-stack ones, at least in the beginning. Here’s an idea of what I
    mean. The colored bars are periods of maximum learning, and the gaps are where
    you’re doing things you already know how to do:


    At some point, the larger projects have diminishing returns. The first few times
    you use a text input and have to wire it up to maintain its state, you’re learning.
    By the tenth time, it’s boring.


    That isn’t to say that large projects aren’t valuable, but I don’t believe they’re
    good *first* projects. Start small, build a few small things, then build a bigger
    thing or two.


    This is the idea behind *deliberate practice* – the practice should be just beyond
    your current skill level. Not so hard that you get frustrated and quit, but not
    so easy that you can breeze right through, either.


    ## Environment Setup


    Before we dive in, we’ll need to set up an environment.


    Don’t worry, there’s no boilerplate to clone from GitHub. No Webpack config, either.


    Instead, we’re using Create React App, a tool Facebook made. It provides a starter
    project and built-in build tools so you can skip to the fun part – creating your
    application!


    ### Prerequisites


    #### Tools


    *   Node.js (at least v4.0, >= 6 recommended)


    *   NPM (version >= 3 recommended) or yarn


    *   Google Chrome (or some other modern browser)


    *   React Developer Tools


    *   Your text editor or IDE of choice


    You’ll need Node and NPM (or Yarn). Head to [https://nodejs.org](https://nodejs.org)
    and download the latest “Current” release. At the time of writing, this is v7.10.0.


    Any modern browser should suffice. This book was developed against Chrome, so
    that’s what I recommend. If you prefer another browser, I expect the JavaScript
    will work correctly but the CSS could require some tweaks.


    #### Yarn


    Yarn is a relatively new package manager for JavaScript, released in June of 2016\.
    Compared to NPM, it is faster, and has the benefit of a *lock file*, which means
    it can reliably install the exact same packages every time you run `yarn` (Yarn’s
    equivalent to `npm install`).


    The commands are similar to NPM’s:


    *   Install all packages: `npm install` or `yarn`


    *   Install a certain package: `npm install --save <package>` or `yarn add <package>`


    *   Start the development server: `npm start` or `yarn start`


    *   Run the tests: `npm test` or `yarn test`


    Rather than padding the pages with things like “Run `npm start` (or `yarn start`)”
    throughout the book, I will only show the NPM commands from here on. However,
    feel free to use Yarn if you’d like. You can install it from [https://yarnpkg.com](https://yarnpkg.com).


    #### React Developer Tools


    The React Developer Tools can be installed from here:


    [https://github.com/facebook/react-devtools](https://github.com/facebook/react-devtools)


    Follow the instructions to install the tools for your browser. The React dev tools
    allow you to inspect the React component tree (as opposed to the DOM tree) and
    view the props and state assigned to each component. It is extremely useful for
    debugging.


    #### Knowledge


    You should already know JavaScript (at least ES5), HTML, and CSS. I’ll explain
    the ES6 features as they come up (you don’t need to already know ES6).


    I don’t recommend learning JavaScript and React at the same time. When everything
    looks new, it can be hard to tell where “JavaScript” ends and “React” begins.
    If you need to brush up on JS, here are some good (and free!) resources:


    *   Speaking JavaScript (book): http://speakingjs.com/


    *   Exercism (exercises): http://exercism.io/languages/javascript


    *   You Don’t Know JS (book series): https://github.com/getify/You-Dont-Know-JS


    A passing familiarity with the command line will be helpful as well.


    ### Project Directory


    You’ll be writing a lot of code throughout this book. To keep it organized, create
    a directory for the exercises. Name it `pure-react`, or whatever you like.


    ### Install Create React App


    Run this command to install the tool globally (the `-g` means global):


    ```

    $ npm install -g create-react-app

    ```


    If you get an error saying “Permission denied” (and you’re on Linux or a Mac)
    you may need to re-run the command with “sudo”, like this:


    ```

    $ sudo npm install -g create-react-app

    ```


    That’s it! Let’s get to coding.


    ## Debugging Crash Course


    When things go wrong, here are the steps to follow:


    1.  Don’t panic.


    2.  Manually refresh the page. Sometimes the auto-refreshing mechanism breaks.


    3.  Check the browser dev console, manually refresh the page, and fix any errors
    you see.


    4.  Check the command line console where you ran `npm start`. Look for any errors,
    and fix those.


    To open the dev console in Chrome on Mac, press Option+Command+I. In Chrome on
    Windows or Linux, press Ctrl+Shift+I. Then make sure you are on the “Console”
    tab.


    If you don’t know how to open your browser’s Developer Tools, Google for “open
    browser console [your_browser]”.


    Likewise, if you have no idea what an error means, copy and paste it into Google.


    Still completely stuck? Stack Overflow has an abundance of React-related questions
    and answers, and the Reactiflux community at [https://www.reactiflux.com/](https://www.reactiflux.com/)
    is full of friendly people who can help. There is also a #react IRC channel on
    Freenode, which you connect to with an IRC client or visit [http://irc.lc/freenode/reactjs](http://irc.lc/freenode/reactjs).


    ### Keep the Console Open!


    The dev console is an amazingly helpful tool for debugging, and it’s a great idea
    to leave it open while you work through the examples and exercises. It’ll help
    you catch typos and save you a lot of time hunting down problems.


    ### React Dev Tools


    If you installed the React dev tools, you’ll see a “React” tab in the browser
    devtools, like this:


    ![React Dev Tools tab](media/file0.png) 


    Choose this tab, and look for your component in the tree. You can use the search
    box to find it without having to drill down. When you click on a component, its
    Props and State will appear in the side pane. Make sure the values agree with
    what you expect to see. You can even modify the Props and State right in the side
    pane, and see the component re-render with your changes. Try it out!


    # Hello World


    At this point you have `node`, `npm`, and `create-react-app` installed. All of
    the tools are ready. Let’s write some code!


    #### Step 1


    Use the `create-react-app` command to generate a new project. It will create a
    directory and install all the necessary packages, and then we’ll move into that
    new directory.


    ```

    $ create-react-app react-hello

    $ cd react-hello

    ```


    The generated project contains some files we won’t need right now, so we’ll delete
    them. You could also just ignore them.


    ```

    $ rm src/App.* src/index.css src/logo.svg

    ```


    #### Step 2


    Open up the file `src/index.js`. Delete all of the contents, and type this code
    in:


    > **Type it out by hand? Like a savage?** Typing it drills it into your brain
    *much* better than simply copying and pasting it. You’re forming new neuron pathways.
    Those pathways are going to understand React one day. Help ’em out.


    ```

    [](#cb5-1)import React from ''react'';

    [](#cb5-2)import ReactDOM from ''react-dom'';

    [](#cb5-3)

    [](#cb5-4)function HelloWorld() {

    [](#cb5-5)  return (

    [](#cb5-6)    <div>Hello World!</div>

    [](#cb5-7)  );

    [](#cb5-8)}

    [](#cb5-9)

    [](#cb5-10)ReactDOM.render(

    [](#cb5-11)    <HelloWorld/>,

    [](#cb5-12)    document.querySelector(''#root''));

    ```


    The `import` statements at the top are an ES6 feature. These lines will be at
    the top of every `index.js` file that we see in this book.


    Unlike with ES5, we can’t simply include a `<script>` tag and get `React` as a
    global object. So, the statement `import React from ''react''` creates a new variable
    called `React` with the contents of the `react` module.'
