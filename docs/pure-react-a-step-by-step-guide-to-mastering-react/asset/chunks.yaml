  trans: "\n适应 React 意味着要改变解决某些问题的方式。这让我想起在道路的另一侧驾驶的经历。\n\n我第一次经历这种事是在访问特尔克斯和凯科斯群岛（Turks\
    \ and Caicos）。那里的车辆是左侧行驶。我来自美国，那里是右侧行驶，所以这需要进行一些“重新编程”。我在离开机场的路上差点丢了命。\n\n有趣的是，即使我已经学会了在普通的平直坦路路上左侧行驶，每当出现不同的情况时，我的大脑就会回到旧习惯。\n\
    \n转入停车场？习惯占了主导地位，我开进了错误的车道。在停止标志处左转？同样的问题。在停止标志处向右`right`？你可能会认为我到现在应该学会了——但并没有，在我的大脑里，那终究有些不同。\n\
    \n我讲这个故事是因为我在学习 React 时也有过类似的经历，我想很多其他人也是如此。\n\n向组件传递 props（就像该组件是一个函数一样）是有意义的我们的大脑习惯了这一点。它看起来和运行起来像\
    \ HTML。\n\n对于简单的情况，将数据向下`down`传递并将事件向上传递`up`的想法也很快就能被理解。这是在其他地方常用的“回调”模式，所以并不算陌生。向按钮传递一个\
    \ `onClick` 处理器是正常的。\n\n但当需要打开模态对话框时会发生什么？或者在角落显示 Growl 风格的通知？或者响应事件对图标进行动画处理？你可能会像我一样发现，这些命令式的、“基于事件的”事物在\
    \ React 的声明式世界中并不是自然而然的。\n\n### 如何培养“声明式”思维\n\n如果你来自 jQuery、Angular 或任何其他通过调用函数来触发事件的框架（“命令式编程”），你需要调整你的心理模型，以便有效地与\
    \ React 协作工作。通过练习，你会很快调整过来——你只需要为大脑提供几个新的示例或“模式”供其参考。\n\n这里有几个示例。\n\n#### 展开/折叠风琴琴（Accordion）控件\n\
    \n**旧方法**：点击切换按钮通过调用其 `toggle` 函数来打开或关闭风琴琴。风琴琴知道自己是开启还是关闭状态。\n\n**声明式方法**：风琴琴要么处于“打开”状态，要么处于“关闭”状态，我们将该信息存储在父组件状态中的标志中（*不是*在风琴琴内部）。我们通过传递\
    \ `isOpen` 作为 prop 来告诉风琴琴应该如何渲染。当 `isOpen` 为 `true` 时，它渲染为打开。当 `isOpen` 为 `false`\
    \ 时，它渲染为关闭。\n\n```\n<Accordion isOpen={true}/>\n// 或\n<Accordion isOpen={false}/>\n\
    ```\n\n这个例子非常简单。希望不要太绕脑。最大的变化在于，在 React 的声明式方法，展开/折叠状态存储在风琴琴*外部*，并作为 prop 传递进来。\n\
    \n#### 打开和关闭对话框\n\n**旧方法**：点击按钮打开模态。点击它的关闭按钮关闭它。\n\n**声明式方法**：模态是否打开*是一个状态*。它要么处于“打开”状态，要么处于“关闭”状态。所以，如果它是“打开”，我们便渲染模态。如果它是“关闭”，我们就不渲染模态。此外，我们可以向模态传递一个\
    \ `onClose` 回调——这样*父组件*就可以决定当用户点击关闭时会发生什么。\n\n```\n<div>\n  {this.state.isModalOpen\
    \ &&\n    <Modal onClose={this.handleClose}/>}\n</div>\n```\n\n#### 通知\n\n**旧方法**：当发生事件（如错误）时，调用通知库来显示弹出窗口，如\
    \ `toastr.error(\"Oh no!\")`。\n\n**声明式方法**：将通知视为状态。可以有 0 个、1 个或 2 个通知……将它们存储在数组中。将一个\
    \ NotificationTray 组件放在应用的根部附近，并向它传递要显示的消息。你可以在根组件的状态中管理消息数组，并将 `addNotification`\
    \ prop 传递给需要它的组件。\n\n#### 为变化制作动画\n\n假设你有一个显示登录用户数量的计数器角标。它从 prop 获取这个数字。如果你想让角标在数字变化时执行动画怎么办？\n\
    \n**旧方法**：你可能会使用 jQuery 来切换一个播放动画的类，或者使用 jQuery 直接对元素执行动画。\n\n**声明式方法**：你可以通过实现\
    \ `componentWillReceiveProps` *生命周期方法* 并比较旧值和新值来响应 props 的变化（你将在第 14 章中学习更多关于生命周期方法的知识）。如果发生了变化，你可以将“正在动画”的状态设置为\
    \ `true`。然后在 `render` 中，当“animating”为 `true` 时，添加一个执行动画的 CSS 类。当“animating”为 `false`\
    \ 时，不添加该类。它可能是这样的：\n\n```javascript\nclass Badge extends Component {\n  componentWillReceiveProps(nextProps)\
    \ {\n    if(this.props.counter !== nextProps.counter) {\n      // 现在将 animating\
    \ 设置为 true。\n      // 当状态更改完成后，设置一个定时器\n      // 在 200ms 后关闭 animating。\n    \
    \  this.setState({ animating: true }, () => {\n        setTimeout(() => {\n  \
    \        this.setState({ animating: false });\n        }, 200);\n      });\n \
    \   }\n  }\n\n  render() {\n    const animatingClass =\n      this.state.animating\
    \ ? 'animating' : '';\n    return (\n      <div className={`badge ${animatingClass}`}>\n\
    \        {this.props.counter}\n      </div>\n    );\n  }\n}\n```\n\n我只想提醒你，这种编写代码初初可能会感觉很奇怪，这是正常的。你会发现自己在思考如何用声明式的方式实现那些旧的命令式模式，学习新模式需要一点时间。但不要担心——一旦你做了几次，它就会变得非常清晰。\n\
    \n#### 状态存储在哪里\n\n只要可能，最好保持组件是无状态的。有时这并不可能的，但很多时候，你最初认为应该放入内部状态的数据片段实际上可以提取到父组件，甚至更高。\n\
    \n考虑页面上可以显示或隐藏的部分，比如像这样的侧边栏：\n\n![带有侧边栏的 UI](img/file29.png) \n\n当你点击“隐藏”按钮时，侧边栏应该消失，这意味着将\
    \ `showSidebar` 标志设置为 `false`。这个标志应该存储在某个地方的状态中。但在哪里呢？\n\n选项 1，`showSidebar` 标志可以存在\
    \ `Sidebar` 组件中。这样 `Sidebar` 就“知道”自己是否打开。这与*不受控输入*（uncontrolled inputs）的工作原理类似，我们将在下一章看到。\n\
    \n选项 2，`showSidebar` 标志可以放在父组件 `Layout` 中，由父组件来决定是否渲染 Sidebar：\n\n"
- fmt: "\n```javascript\nclass Layout extends React.Component {\n  state = {\n   \
    \ showSidebar: false\n  }\n\n  toggleSidebar = () => {\n    this.setState({\n\
    \      showSidebar: !this.state.showSidebar\n    });\n  }\n\n  render() {\n  \
    \  const { showSidebar } = this.state;\n    return (\n      <div className=\"\
    layout\">\n        {showSidebar &&\n          <Sidebar\n            onHide={this.toggleSidebar}>\n\
    \            some sidebar content\n          </Sidebar>}\n        <Content\n \
    \         isSidebarVisible={showSidebar}\n          onShowSidebar={this.toggleSidebar}>\n\
    \          some content here\n        </Content>\n      </div>\n    );\n  }\n\
    }\n\nconst Content = ({\n  children,\n  isSidebarVisible,\n  onShowSidebar\n})\
    \ => (\n  <div className=\"content\">\n    {children}\n    {!isSidebarVisible\
    \ && (\n      <button onClick={onShowSidebar}>\n        Show\n      </button>\n\
    \    )}\n  </div>\n));\n\nconst Sidebar = ({\n  onHide,\n  children\n}) => (\n\
    \  <div className=\"sidebar\">\n    {children}\n    <button onClick={onHide}>\n\
    \      Hide\n    </button>\n  </div>\n));\n```\n\nThis way `Sidebar` doesn’t internally\
    \ “know” whether it’s visible. It is either rendered, or not rendered.\n\nKeeping\
    \ the state in a parent component might feel unnatural. It might even seem at\
    \ first glance like this would make `Sidebar` hard to reuse, since you need to\
    \ pass a callback function that `Sidebar` can call when it needs to hide.\n\n\
    On the contrary, having fewer components containing state means fewer places to\
    \ look when a bug appears. And if you need to do anything with that state, for\
    \ instance, save it to `localStorage` to persist across page reloads, that logic\
    \ only needs to exist in one component instance.\n\nBrowsers come with `localStorage`,\
    \ a place you can use to save data between sessions. Closing and reopening the\
    \ browser or refreshing the page won’t clear the data. You could save the Sidebar\
    \ state with `localStorage.setItem('showSidebar', true)` and later retrieve it\
    \ with `localStorage.getItem('showSidebar')`.\n\nYou can see that if the `Sidebar`\
    \ component knew how to save its own state to `localStorage`, and there were multiple\
    \ Sidebars in the app, they would need a way to differentiate themselves. A single\
    \ `showSidebar` key in `localStorage` would lead to conflicts, and the Sidebars\
    \ don’t know where in the app they reside.\n\nPerhaps the parents could be responsible\
    \ for passing down a unique “id” or “location” to each `Sidebar`. However, that\
    \ would split the concern of “where to save” between both the parent and the `Sidebar`.\
    \ That makes two components that need to know about saving, rather than one. A\
    \ better design would keep all of the saving-related logic in one place, and that\
    \ is easier to do if the state is stored alongside it.\n\n## “Kinds” of Components\n\
    \nArchitecturally, you can segment components into two kinds: `Presentational`\
    \ (a.k.a “Dumb”) and `Container` (a.k.a. “Smart”).\n\n`Presentational components`\
    \ are stateless. They simply accepts props and render some elements based on those\
    \ props. Being stateless means that the component will contain less logic, and\
    \ will be easier to debug and test. They are, in essence, pure functions. They\
    \ always return the same result for a given set of props, and they don’t change\
    \ anything. Ideally, most of your components will be presentational.\n\n`Sidebar`,\
    \ as written above, is a presentational component. So is `Child`, and so is the\
    \ `Tweet` component we made a while back. They accept data and render it, and\
    \ if events need to be handled, they call back up to the parent. Other kinds of\
    \ common presentational components include buttons, navigation bars, links, images,\
    \ etc.\n\n`Container components` are stateful. They maintain state for themselves\
    \ and any child components, and pass it down to them via props. They usually pass\
    \ down handler functions to children, and respond to callbacks by updating their\
    \ internal state. `Container components` are also responsible for asynchronous\
    \ communication, such as AJAX calls to the server.\n\nThe `Parent` component,\
    \ above, is a presentational component. Perhaps surprisingly, `Page` is actually\
    \ presentational. Presentational components can contain `Container` components,\
    \ and `Containers` can.\n\n## Inputs\n\nNow that you’ve got a handle on state\
    \ works, we can talk about input. Inputs in React come in two flavors: controlled\
    \ and uncontrolled.\n\n### # Controlled Inputs\n\nThe reason they’re called “controlled”\
    \ is because you are responsible for their state. You need to pass a value and\
    \ a callback as props.\n\n```javascript\nclass ControlledInput extends React.Component\
    \ {\n  state = {\n    text: ''\n  }\n\n  handleChange = (event) => {\n    this.setState({\n\
    \      text: event.target.value\n    });\n  }\n\n  render() {\n    return (\n\
    \      <input type=\"text\"\n        value={this.state.text}\n        onChange={this.handleChange}\
    \ />\n    );\n  }\n}\n```\n\nIt works like this: In the example above, try removing\
    \ or commenting out the call to `this.setState`, then try to type in the box.\
    \ Nothing happens, because the value is stuck at the initial value. Then, try\
    \ changing `this.setState` to ignore the event data, instead always setting the\
    \ text to the same value, like this:\n\n```javascript\nclass TrickInput extends\
    \ React.Component {\n  state = {\n    text: 'try typing something'\n  }\n\n  handleChange\
    \ = (event) => {\n    this.setState({\n      text: 'haha nope'\n    });\n  }\n\
    \n  render() {\n    return (\n      <input type=\"text\"\n        value={this.state.text}\n\
    \        onChange={this.handleChange} />\n    );\n  }\n}\n```\n\nYou’ll see that\
    \ the input thwarts your attempts to change it, and mocks you too.\n\nThis is\
    \ very powerful though. If you want to do some kind of custom validation, or formatting,\
    \ you can do that in the `handleChange` function. Now, maybe your first reaction\
    \ is that this seems like a lot of code for a simple input. You’re not wrong,\
    \ but this method does provide a lot of power. Don’t want the user to type numbers?\
    \ Strip out the numbers before updating the state.\n"
