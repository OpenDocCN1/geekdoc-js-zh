  trans: "\n\n`setState` 函数将更新状态并重新渲染组件及其所有的子组件。因此，接下来发生的是：`CountingParent` 的 `render`\
    \ 函数被调用，它会查看 `this.state.actionCount`，而此时该值已经增加到了 1。或者是 2，如果你疯狂点击那个按钮，它也可能是其他数字。\n\
    \n请注意，每个组件实例都有自己的状态。如果你在页面上有两个 `CountingParent` 组件，它们将各自拥有从 0 开始并独立增加的计数器。你可以通过创建一个包含几个\
    \ `CountingParent` 的组件来向自己证明这一点：\n\n```\nconst Page = () => (\n  <div>\n    <CountingParent/>\n\
    \    <CountingParent/>\n    <CountingParent/>\n  </div>\n);\n```\n\n确保更新 `ReactDOM.render`\
    \ 调用，以渲染一个 `Page` 而不是 `CountingParent`。现在点击这些按钮，观察计数器如何独立变化。\n\n### 练习：重置按钮\n\n\
    这里有一个快速练习：在 `CountingParent` 中添加一个“Reset（重置）” 按钮，在点击它时将计数器重置为 0。只需将 `button` 直接放在\
    \ `CountingParent` 内部即可。\n\n一旦运行成功，重构你的代码，将“Reset” 按钮移动到 `Child` 中。\n\n## setState\
    \ 是异步的\n\n我刚才骗了你。很抱歉。我暗示了 `setState` 函数会立即更新状态并调用 `render`。事实并非完全是那样的。`setState`\
    \ 函数实际上是*异步的*。\n\n如果你调用了 `setState` 并立即执行 `console.log(this.state)`，它很可能会打印出旧的状态，而不是你刚刚设置的那个。\n\
    \n如果你需要设置状态并立即对该更改采取行动，可以这样传递一个回调函数：\n\n```javascript\nthis.setState({name: 'Joe'},\
    \ function() {\n  // 在状态已更新\n  // 且组件已重新渲染后调用\n});\n```\n\n### 函数式 setState\n\n\
    另一种让连续的状态更新按顺序执行的方法是使用 `setState` 的*函数式*形式，如下所示：\n\n```javascript\nthis.setState((state,\
    \ props) => {\n  return {\n    value: state.value + 1\n  }\n});\n```\n\n在这种形式下，你向\
    \ `setState` 传递了一个函数。该函数接收当前状态和 props 作为参数，并预期返回想要的新状态。如果你连续运行几个这样的操作……\n\n```javascript\n\
    this.setState((state, props) => {\n  return {\n    value: state.value + 1\n  }\n\
    });\nthis.setState((state, props) => {\n  return {\n    value: state.value + 1\n\
    \  }\n});\nthis.setState((state, props) => {\n  return {\n    value: state.value\
    \ + 1\n  }\n});\n```\n\n这将会按照预期的方式工作，最终将 `value` 增加 3。它之所以有效，是因为调用 `setState`\
    \ 会按调用的顺序将更新“放入队列”，而当它们被执行时，它们接收的是最新的状态作为参数，而不是使用可能已经过时的 `this.state`。\n\n`setState`\
    \ 函数式风格的一个额外好处是，状态更新函数可以从类中提取出来并重用，因为它们是“纯”的——也就是说，它们只对参数进行操作，不会修改参数，并返回一个新值。“纯”函数没有副作用，这意味着使用相同的参数多次调用它将始终返回相同的结果。\n\
    \n## 浅合并与深合并\n\n当你调用 `setState` 时，无论是用对象调用还是用函数形式调用，结果都是它会将你对象中的属性与当前状态进行*浅合并*。这是它的工作原理。\n\
    \n“浅合并”行为意味着如果你有如下状态：\n\n```javascript\n{\n  score: 7,\n  user: {\n    name: \"\
    somebody\",\n    age: 26\n  },\n  products: [ /*...*/ ]\n}\n```\n\n然后你执行 `this.setState({\
    \ score: 42 })`，新状态将是：\n\n```javascript\n{\n  score: 42,          // 新的！\n  user:\
    \ {             // 不变\n    name: \"somebody\", // 不变\n    age: 26           //\
    \ 不变\n  },\n  products: [ /* unchanged */ ]\n}\n```\n\n也就是说，它会将你传递给 `setState`（或从函数版本返回）的对象与现有状态进行*合并*。它不会抹除现有状态。\n\
    \n相反，如果你运行 `this.setState({ user: { age: 4 } })`，那么它将用新对象替换整个 `user` 对象：\n\n```javascript\n\
    {\n  score: 7,\n  user: {\n    age: 4\n  },\n  products: [ /*...*/ ]\n}\n```\n\
    \n"
- fmt: "\nGetting used to React involves changing how you solve certain kinds of problems.\
    \ It reminds me a little bit of learning to drive on the other side of the road.\n\
    \nThe first time I experienced this, I was visiting Turks and Caicos. They drive\
    \ on the left there. Being from the US where we drive on the right, this took\
    \ a bit of reprogramming. I nearly died on the way out of the airport.\n\nThe\
    \ funny thing was, even after I had learned to drive on the left in normal straight-and-level\
    \ driving, my brain would revert to old habits whenever a different situation\
    \ came up.\n\nTurning into a parking lot? Habit took over and I drove into the\
    \ wrong lane. Taking a left at a stop sign? Same problem. Taking a `right` at\
    \ a stop sign? You’d think I would’ve learned by now – but no, to my brain, that\
    \ was different somehow.\n\nI tell this story because I had a similar experience\
    \ when learning React, and I think many others do too.\n\nPassing props to a component\
    \ (as if that component were a function) makes sense – our brains are used to\
    \ that. It looks and works like HTML.\n\nThe idea of passing data `down` and passing\
    \ events `up` also makes sense pretty quickly, for simple cases. It’s the “callback”\
    \ pattern, commonly used elsewhere, so not all that foreign. Passing an `onClick`\
    \ handler to a button is fairly normal.\n\nBut what happens when it’s time to\
    \ open a modal dialog? Or display a Growl-style notification in the corner? Or\
    \ animate an icon in response to an event? You might find, as I did, that these\
    \ imperative, “event-based” things don’t come naturally in the declarative world\
    \ of React.\n\n### How to Develop “Declarative” Thinking\n\nIf you came from jQuery\
    \ or Angular or any other framework where you call functions to make things happen\
    \ (“imperative programming”), you need to adjust your mental model in order to\
    \ work effectively with React. You’ll adjust pretty quickly with practice – you\
    \ just need a few new examples or “patterns” for your brain to draw from.\n\n\
    Here are a few.\n\n#### Expanding/Collapsing an Accordion control\n\n**The old\
    \ way**: Clicking a toggle button opens or closes the accordion by calling its\
    \ `toggle` function. The Accordion knows whether it is open or closed.\n\n**The\
    \ declarative way**: The Accordion is either in the “open” state, or the “closed”\
    \ state, and we store that information as a flag inside the parent component’s\
    \ state (*not* inside the Accordion). We tell the Accordion which way to render\
    \ by passing `isOpen` as a prop. When `isOpen` is `true`, it renders as open.\
    \ When `isOpen` is false, it renders as closed.\n\n```\n<Accordion isOpen={true}/>\n\
    // or\n<Accordion isOpen={false}/>\n```\n\nThis example is pretty simple. Hopefully\
    \ nothing too mind-bending. The biggest change is that in the declarative React\
    \ way, the expand/collapse state is stored *outside* the Accordion and passed\
    \ in as a prop.\n\n#### Opening and Closing a Dialog\n\n**The old way**: Clicking\
    \ a button opens the modal. Clicking its Close button closes it.\n\n**The declarative\
    \ way**: Whether or not the Modal is open *is a state*. It’s either in the “open”\
    \ state or the “closed” state. So, if it’s “open”, we render the Modal. If it’s\
    \ “closed” we don’t render the modal. Moreover, we can pass an `onClose` callback\
    \ to the Modal – this way the *parent component* gets to decide what happens when\
    \ the user clicks Close.\n\n```\n<div>\n  {this.state.isModalOpen &&\n    <Modal\
    \ onClose={this.handleClose}/>}\n</div>\n```\n\n#### Notifications\n\n**The old\
    \ way**: When an event occurs (like an error), call a notification library to\
    \ display a popup, like `toastr.error(\"Oh no!\")`.\n\n**The declarative way**:\
    \ Think of notifications as state. There can be 0 notifications, or 1, or 2… Store\
    \ those in an array. Put a NotificationTray component own near the root of the\
    \ app, and pass it the messages to display. You can manage the array of messages\
    \ in the root component’s state, and pass an `addNotification` prop down to components\
    \ that need it.\n\n#### Animating a Change\n\nLet’s say you have a badge with\
    \ a counter showing the number of logged-in users. It gets this number from a\
    \ prop. What if you want the badge to animate when the number changes?\n\n**The\
    \ old way**: You might use jQuery to toggle a class that plays the animation,\
    \ or use jQuery to animate the element directly.\n\n**The declarative way**: You\
    \ can respond when props change by implementing the `componentWillReceiveProps`\
    \ *lifecycle method* and comparing the old value to the new one (you’ll learn\
    \ more about lifecycle methods in Chapter 14). If it changed, you can set the\
    \ “animating” state to `true`. Then in `render`, when “animating” is true, add\
    \ a CSS class that does the animation. When “animating” is `false`, don’t add\
    \ that class. Here’s what this might look like:\n\n```javascript\nclass Badge\
    \ extends Component {\n  componentWillReceiveProps(nextProps) {\n    if(this.props.counter\
    \ !== nextProps.counter) {\n      // Set animating to true right now.\n      //\
    \ When the state change finishes, set a timer\n      // to turn animating off\
    \ in 200ms.\n      this.setState({ animating: true }, () => {\n        setTimeout(()\
    \ => {\n          this.setState({ animating: false });\n        }, 200);\n   \
    \   });\n    }\n  }\n\n  render() {\n    const animatingClass =\n      this.state.animating\
    \ ? 'animating' : '';\n    return (\n      <div className={`badge ${animatingClass}`}>\n\
    \        {this.props.counter}\n      </div>\n    );\n  }\n}\n```\n\nI just want\
    \ to warn you that this way of writing code may feel strange at first, and that’s\
    \ normal. You’ll find yourself wondering how to implement those old imperative\
    \ patterns in a declarative way, and it’ll take a little time to learn new patterns.\
    \ But don’t worry – it will become crystal clear once you do it a few times.\n\
    \n### Where to Keep State\n\nWhenever you can, it’s best to keep components stateless.\
    \ Sometimes this isn’t possible, but often, pieces of data you initially think\
    \ should go into internal state can actually be pulled up to the parent component,\
    \ or even higher.\n\nThink about a section of the page that can be shown or hidden,\
    \ maybe a sidebar like this:\n\n![UI with a sidebar](media/file29.png) \n\nWhen\
    \ you click the “Hide” button, the sidebar should disappear, which means setting\
    \ a `showSidebar` flag to `false`. This flag should be stored in state somewhere.\
    \ But where?\n\nOption 1, the `showSidebar` flag could reside in the `Sidebar`\
    \ component. This way the `Sidebar` “knows” whether it is open or not. This is\
    \ similar to how *uncontrolled inputs* work, which we’ll see in the next chapter.\n\
    \nOption 2, the `showSidebar` flag can go in the parent `Layout` component, and\
    \ the parent can decide whether to render the Sidebar or not:\n"
  raw: 'Getting used to React involves changing how you solve certain kinds of problems.
    It reminds me a little bit of learning to drive on the other side of the road.


    The first time I experienced this, I was visiting Turks and Caicos. They drive
    on the left there. Being from the US where we drive on the right, this took a
    bit of reprogramming. I nearly died on the way out of the airport.


    The funny thing was, even after I had learned to drive on the left in normal straight-and-level
    driving, my brain would revert to old habits whenever a different situation came
    up.


    Turning into a parking lot? Habit took over and I drove into the wrong lane. Taking
    a left at a stop sign? Same problem. Taking a *right* at a stop sign? You’d think
    I would’ve learned by now – but no, to my brain, that was different somehow.


    I tell this story because I had a similar experience when learning React, and
    I think many others do too.


    Passing props to a component (as if that component were a function) makes sense
    – our brains are used to that. It looks and works like HTML.


    The idea of passing data *down* and passing events *up* also makes sense pretty
    quickly, for simple cases. It’s the “callback” pattern, commonly used elsewhere,
    so not all that foreign. Passing an `onClick` handler to a button is fairly normal.


    But what happens when it’s time to open a modal dialog? Or display a Growl-style
    notification in the corner? Or animate an icon in response to an event? You might
    find, as I did, that these imperative, “event-based” things don’t come naturally
    in the declarative world of React.


    ### How to Develop “Declarative” Thinking


    If you came from jQuery or Angular or any other framework where you call functions
    to make things happen (“imperative programming”), you need to adjust your mental
    model in order to work effectively with React. You’ll adjust pretty quickly with
    practice – you just need a few new examples or “patterns” for your brain to draw
    from.


    Here are a few.


    #### Expanding/Collapsing an Accordion control


    **The old way**: Clicking a toggle button opens or closes the accordion by calling
    its `toggle` function. The Accordion knows whether it is open or closed.


    **The declarative way**: The Accordion is either in the “open” state, or the “closed”
    state, and we store that information as a flag inside the parent component’s state
    (*not* inside the Accordion). We tell the Accordion which way to render by passing
    `isOpen` as a prop. When `isOpen` is `true`, it renders as open. When `isOpen`
    is false, it renders as closed.


    ```

    [](#cb146-1)<Accordion isOpen={true}/>

    [](#cb146-2)// or

    [](#cb146-3)<Accordion isOpen={false}/>

    ```


    This example is pretty simple. Hopefully nothing too mind-bending. The biggest
    change is that in the declarative React way, the expand/collapse state is stored
    *outside* the Accordion and passed in as a prop.


    #### Opening and Closing a Dialog


    **The old way**: Clicking a button opens the modal. Clicking its Close button
    closes it.


    **The declarative way**: Whether or not the Modal is open *is a state*. It’s either
    in the “open” state or the “closed” state. So, if it’s “open”, we render the Modal.
    If it’s “closed” we don’t render the modal. Moreover, we can pass an `onClose`
    callback to the Modal – this way the *parent component* gets to decide what happens
    when the user clicks Close.


    ```

    [](#cb147-1)<div>

    [](#cb147-2)  {this.state.isModalOpen &&

    [](#cb147-3)    <Modal onClose={this.handleClose}/>}

    [](#cb147-4)</div>

    ```


    #### Notifications


    **The old way**: When an event occurs (like an error), call a notification library
    to display a popup, like `toastr.error("Oh no!")`.


    **The declarative way**: Think of notifications as state. There can be 0 notifications,
    or 1, or 2… Store those in an array. Put a NotificationTray component somewhere
    near the root of the app, and pass it the messages to display. You can manage
    the array of messages in the root component’s state, and pass an `addNotification`
    prop down to components that need it.


    #### Animating a Change


    Let’s say you have a badge with a counter showing the number of logged-in users.
    It gets this number from a prop. What if you want the badge to animate when the
    number changes?


    **The old way**: You might use jQuery to toggle a class that plays the animation,
    or use jQuery to animate the element directly.


    **The declarative way**: You can respond when props change by implementing the
    `componentWillReceiveProps` *lifecycle method* and comparing the old value to
    the new one (you’ll learn more about lifecycle methods in Chapter 14). If it changed,
    you can set the “animating” state to `true`. Then in `render`, when “animating”
    is true, add a CSS class that does the animation. When “animating” is `false`,
    don’t add that class. Here’s what this might look like:


    ```

    [](#cb148-1)class Badge extends Component {

    [](#cb148-2)  componentWillReceiveProps(nextProps) {

    [](#cb148-3)    if(this.props.counter !== nextProps.counter) {

    [](#cb148-4)      // Set animating to true right now.

    [](#cb148-5)      // When the state change finishes, set a timer

    [](#cb148-6)      // to turn animating off in 200ms.

    [](#cb148-7)      this.setState({ animating: true }, () => {

    [](#cb148-8)        setTimeout(() => {

    [](#cb148-9)          this.setState({ animating: false });

    [](#cb148-10)        }, 200);

    [](#cb148-11)      });

    [](#cb148-12)    }

    [](#cb148-13)  }

    [](#cb148-14)

    [](#cb148-15)  render() {

    [](#cb148-16)    const animatingClass =

    [](#cb148-17)      this.state.animating ? ''animating'' : '''';

    [](#cb148-18)    return (

    [](#cb148-19)      <div className={`badge ${animatingClass}`}>

    [](#cb148-20)        {this.props.counter}

    [](#cb148-21)      </div>

    [](#cb148-22)    );

    [](#cb148-23)  }

    [](#cb148-24)}

    ```


    I just want to warn you that this way of writing code may feel strange at first,
    and that’s normal. You’ll find yourself wondering how to implement those old imperative
    patterns in a declarative way, and it’ll take a little time to learn new patterns.
    But don’t worry – it will become crystal clear once you do it a few times.


    ## Where to Keep State


    Whenever you can, it’s best to keep components stateless. Sometimes this isn’t
    possible, but often, pieces of data you initially think should go into internal
    state can actually be pulled up to the parent component, or even higher.


    Think about a section of the page that can be shown or hidden, maybe a sidebar
    like this:


    ![UI with a sidebar](media/file29.png) 


    When you click the “Hide” button, the sidebar should disappear, which means setting
    a `showSidebar` flag to `false`. This flag should be stored in state somewhere.
    But where?


    Option 1, the `showSidebar` flag could reside in the `Sidebar` component. This
    way the `Sidebar` “knows” whether it is open or not. This is similar to how *uncontrolled
    inputs* work, which we’ll see in the next chapter.


    Option 2, the `showSidebar` flag can go in the parent `Layout` component, and
    the parent can decide whether to render the Sidebar or not:'
