  trans: "\n\n结果，它将是 `undefined`（未定义），这就像你忘记给一个普通的函数传递参数一样。这可能完全没问题，也可能导致代码崩溃的灾难（就像你忘记给一个普通的函数传递参数一样）。\n\
    \n不过，React 拥有一个秘密武器：`PropTypes`。\n\n当你创建一个组件时，你可以声明某些 props 是可选的或必须的，*并且*你还可以声明该\
    \ prop 期望的类型。这里有一个示例：\n\n```javascript\nimport PropTypes from 'prop-types';\n\n\
    function Comment({ author, message, likes }) {\n  return (\n    <div>\n      <div\
    \ className='author'>{author}</div>\n      <div className='message'>{message}</div>\n\
    \      <div className='likes'>\n        {likes > 0 ? likes : 'No'} likes\n   \
    \   </div>\n    </div>\n  );\n}\nComment.propTypes = {\n  message: PropTypes.string.isRequired,\n\
    \  author: PropTypes.string.isRequired,\n  likes: PropTypes.number\n}\n```\n\n\
    首先，注意到 `PropTypes` 必须从 `prop-types` 包中显式导入。这是 React 15.5 引入的更改。如果你在使用 Create React\
    \ App，你应该已经安装了这个包，但如果没有，快速运行 `npm install --save prop-types` 即可修复。\n\n接下来，注意到\
    \ `propTypes` 被设置为函数本身的一个属性。这种写法无论组件是函数、箭头函数，甚至是 ES6 类（我们稍后会看到）都有效。\n\n最后，注意到\
    \ `propTypes` 属性以小写“p”开头，而导入的 `PropTypes` 以大写字母“P”开头。\n\n通过这组 propTypes，`message`\
    \ 和 `author` 是必须的，且必须是字符串。`likes` prop 是可选的，但如果提供了，它必须必须是一个数字。尝试用几种不同的方式渲染它，并每次都检查控制台：\n\
    \n```javascript\n<Comment author='somebody' message='a likable message' likes={1}/>\n\
    <Comment author='mr_unpopular' message='unlikable message'/>\n<Comment author='mr_unpopular'\
    \ message='another message' likes={0}/>\n<Comment author='error_missing_message'/>\n\
    <Comment message='mystery author'/>\n```\n\n如果你忘记了必的 prop，React 会在控制台中向你发出警告：\n\
    \n```javascript\n<Comment author='an_error'/>\n```\n\n> Warning: Failed propType:\
    \ Required prop `message` was not specified in `Comment`.\n\n同样，如果你传递了错误的类型，也会得到警告：\n\
    \n```javascript\n<Comment author={42}/>\n```\n\n> Warning: Failed propType: Invalid\
    \ prop `author` of type `number` supplied to `Comment`, expected `string`.\n\n\
    这些警告信息对于调试来说是无价之宝。它告诉你犯了什么错误，*并且*给出了查找的提示！这比某些在你忘记必填属性时静默失败的框架要好得多。\n\n### 陷阱\n\
    \n那么：陷阱在哪里？所有这些良好的错误处理应该有一个陷阱对吧？\n\n嗯，某种程度上。PropTypes 的唯一陷阱在于*你必须记得声明它们*。提供 propTypes\
    \ 是可选的，如果你没有为其中一个组件指定 propTypes，React 不会给你任何警告。\n\n你可以发誓对编写这些 propTypes 变得超级勤奋，或者让一个\
    \ *linter*（代码检查器）工具来帮你检查。我推荐后者。\n\nESLint 是一个流行的选择，并且有一个用于 ESLint 的 React 插件，它可以检查缺失的\
    \ PropTypes 以及 props 是否传递正确等问题。\n\n## 我如何验证你，让我来数数方法\n\nReact 的 propTypes 允许你表达许多不同的验证。默认情况下，propType\
    \ 验证是*可选的*。如果你想让它变为必选，在末尾添加 `.required`。\n\n首先，有标准 JavaScript 类型的验证器：\n\n* `PropTypes.array`\n\
    * `PropTypes.bool`\n* `PropTypes.func`\n* `PropTypes.number`\n* `PropTypes.object`\n\
    * `PropTypes.string`\n\n你之前在 `Comment` 组件中看到了 `string` 和 `number` 验证器。其他的工作原理相同——验证传入的是数组、布尔值、函数或或其他任何内容。\n\
    \n还有用于 `node` 和 `element` 的验证器。`node` 是任何可以被渲染的内容，意味着数字、字符串、元素或这些内容的数组。`element`\
    \ 是通过 JSX 或调用 `React.createElement` 创建的 React 元素：\n\n* `PropTypes.node`\n* `PropTypes.element`\n\
    \n有一个 `instanceOf` 验证器，用于检查 prop 是否是特定类的实例。它接受一个参数：\n\n* `PropTypes.instanceOf(SpecificClass)`\n\
    \n你可以使用 `oneOf` 限制为特定值：\n\n* `PropTypes.oneOf(['person', 'place', 1234])`\n\n\
    你可以验证 prop 是否是几种类型之一：\n\n```javascript\nPropTypes.oneOfType([\n  PropTypes.string,\n\
    \  PropTypes.boolean\n])\n```\n\n你可以验证它是否是特定类型的数组，或者是一个其属性为特定类型值的对象：\n\n* `PropTypes.arrayOf(PropTypes.string)`\n\
    \    * 会匹配：`['a', 'b', 'c']`\n    * 不匹配：`['a', 'b', 42]`\n* `PropTypes.objectOf(PropTypes.number)`\n\
    \    * 会匹配：`{age: 27, birthMonth: 9}`\n    * 不匹配：`{age: 27, name: 'Joe'}`\n\n\
    你可以验证一个对象是否具有特定的*形状*（shape），意味着它具有特定的属性。传递给此 prop 的对象允许拥有*额外*属性，但它至少必须包含形状描述中的那些属性。\n\
    \n```javascript\nPropTypes.shape({\n  name: PropTypes.string,\n  age: PropTypes.number\n\
    })\n```\n\n这将匹配一个形状完全相同的对象，如下：\n\n```javascript\nperson = {\n  name: 'Joe',\n\
    \  age: 27\n}\n```\n\n它也会匹配具有额外属性的对象，如下：\n\n```javascript\nperson = {\n  name:\
    \ 'Joe',\n  age: 27,\n  address: '123 Fake St',\n  validPerson: false\n}\n```\n\
    \n这个 PropTypes `shape` 要求 `name` 和 `age` 键，所以如果我们遗漏了其中一个，它将无法通过。这会生成一个警告：\n\n\
    ```javascriptperson = {\n  age: 27\n}\n```\n\n同样，如果我们为这些键之一传递了错误的类型，我们将得到警告：\n\
    \n```javascript\nperson = {\n  name: false,  // 布尔值而非字符串\n  age: 27\n}\n```\n\n\
    #### 必选 Props\n\n任何 PropType 验证都可以通过在末尾添加 `.required` 变为必选。这些都是必选的：\n\n```javascript\n\
    PropTypes.bool.isRequired\nPropTypes.oneOf(['person', 'place', 1234]).isRequired\n\
    PropTypes.shape({\n  name: PropTypes.string,\n  age: PropTypes.number\n}).isRequired\n\
    ```\n\n记住，所有的 PropTypes 默认都是*可选的*，这意味着如果你忘记传递值或在 prop 名称中出现拼写错误，将不会获得控制台警告。在大多数情况下，你可能希望在你的\
    \ PropType 验证后附加 `.required`。\n\n#### 自定义验证器\n\n如果内置的 PropType 验证器表达力不够，你可以编写自己的！该函数应该接收\
    \ `props`、`propName` 和 `componentName`，并在验证失败时返回一个 `Error`。注意是*返回*一个 Error，而不是*抛出*一个\
    \ Error。\n\n一个用于检查传递的 prop 长度恰好为 3（字符串或数组）的自定义验证器看起来如下：\n\n"
- fmt: "\n```javascript\nfunction customValidator(props, propName, componentName)\
    \ {\n  // here, propName === \"myCustomProp\"\n  if (props[propName].length !==\
    \ 3) {\n    return new Error(\n      'Invalid prop `' + propName + '` supplied\
    \ to' +\n      ' `' + componentName + '`. Length is not 3.'\n    );\n  }\n}\n\n\
    const CustomTest = ({ myCustomProp }) => (\n  <span>{myCustomProp}</span>\n);\n\
    CustomTest.propTypes = {\n  myCustomProp: customValidator\n}\n\n// This will produce\
    \ a warning:\nReactDOM.render(\n  <CustomTest myCustomProp='not_three_letters'/>,\n\
    \  document.getElementById('root')\n);\n\n// This will work:\nReactDOM.render(\n\
    \  <CustomTest myCustomProp={[1, 2, 3]}/>,\n  document.getElementById('root')\n\
    );\n\n// This will also work:\nReactDOM.render(\n  <CustomTest myCustomProp=\"\
    abc\"/>,\n  document.getElementById('root')\n);\n```\n\n## Example: Tweet with\
    \ PropTypes\n\nOne last time, let’s go back to the Tweet example to see how PropTypes\
