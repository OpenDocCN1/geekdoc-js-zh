    \ state 中添加一个新的 `cart` 属性。\n\n让我们过一遍。首先，在 `App.js` 中，向初始状态添加一个 `cart` 属性，并将其初始化为空数组：\n\
    \n```javascript\nclass App extends Component {\n  state = {\n    activeTab: 0,\n\
