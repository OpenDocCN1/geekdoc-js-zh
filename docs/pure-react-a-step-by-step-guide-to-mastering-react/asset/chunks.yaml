  trans: "\n\n我相信，至少在开始阶段，从小型项目中获得的学习价值比大型或全栈项目更多。以下是我表达的意思：彩色条代表学习产得最密集的时期，而间隙则是你正在做你已经掌握的事情：\n\
    \n在某个时刻，大型项目的收益会递减。当你第一次几次使用文本输入框并必须将其连接起来以维护其状态时，你正在学习。到第十次时，它就变得无聊了。\n\n这并不是说大型项目没有价值，但我认为它们不是很好的`first`个项目。从小处开始，构建几个小东西，然后再构建一两个大一点的东西。\n\
    \n这就是`刻意练习`（deliberate practice）的背后的理念——练习应该略高于你目前的技能水平。既不会难到让你感到挫败并放弃，也不会太简单到你可以一眼看到底。\n\
    \n## 环境搭建\n\n在我们开始之前，我们需要设置一个环境。\n\n别担心，没有需要从 GitHub 克隆的样板代码。也没有 Webpack 配置。\n\
    \n相反，我们正在使用 `Create React App`，这是 Facebook 开发的一个工具。它提供了一个启动项目和内置的构建工具，让你可以直接跳到最有趣的部分——创建你的应用程序！\n\
    \n### 前提条件\n\n#### 工具\n\n*   `Node.js`（至少 v4.0，建议 >= 6）\n*   `NPM`（建议版本 >= 3）或\
    \ `yarn`\n*   `Google Chrome`（或其他某些现代浏览器）\n*   `React Developer Tools`\n*   你任选的文本编辑器或\
    \ IDE\n\n你需要 `Node` 和 `NPM`（或 `Yarn`）。访问 [`nodejs.org`](https://nodejs.org) 并下载最新的“Current”版本。在写作时，这是\
    \ v7.10.0。\n\n任何现代浏览器都足够了。这本书是基于 `Chrome` 开发的，所以我我推荐使用它。如果你偏好其他浏览器，我预计 JavaScript\
    \ 可以正常工作，但 CSS 可能需要一些调整。\n\n#### Yarn\n\n`Yarn` 是一个相对新的 JavaScript 包管理器，于 2016\
    \ 年 6 月发布。与 `NPM` 相比，它更快，并且具有 `lock file` 的优势，这意味着每次运行 `yarn`（`Yarn` 等同于 `npm\
    \ install`）时，它都能可靠地安装完全相同的包。\n\n命令与 `NPM` 类似：\n\n*   安装所有包：`npm install` 或 `yarn`\n\
    *   安装特定包：`npm install --save <package>` 或 `yarn add <package>`\n*   启动开发服务器：`npm\
    \ start` 或 `yarn start`\n*   运行测试：`npm test` 或 `yarn test`\n\n与其在书中到处充斥“运行 `npm\
    \ start`（或 `yarn start`）”之类的内容，我从现在起将只显示 `NPM` 命令。不过，如果你愿意，尽管使用 `Yarn`。你可以从 [`yarnpkg.com`](https://yarnpkg.com)\
    \ 安装它。\n\n#### React Developer Tools\n\n你可以从这里安装 `React Developer Tools`：[`github.com/facebook/react-devtools`](https://github.com/facebook/react-devtools)\n\
    \n按照说明为你的浏览器安装工具。`React dev tools` 允许你检查 React 组件树（而不是 DOM 树），并查看分配每个组件的 `props`\
    \ 和 `state`。它对于调试非常有帮助。\n\n#### 知识储备\n\n你应该已经熟悉 `JavaScript`（至少是 ES5）、`HTML` 和\
    \ `CSS`。我会在它们出现时解释 `ES6` 特性（你不需要预先知道 `ES6`）。\n\n我不建议同时学习 `JavaScript` 和 `React`。当一切看起来都是新新的时候，很难区分“JavaScript”在哪里结束，“React”从哪里开始。如果你需要温习\
