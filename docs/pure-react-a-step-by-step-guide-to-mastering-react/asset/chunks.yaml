  trans: "\n\n```javascript\nclass NoNumbersInput extends React.Component {\n  //\
    \ ...\n\n  handleChange = (event) => {\n    let text = event.target.value;\n \
    \   text = text.replace(/[0-9]/g, '');\n    this.setState({ text });\n  };\n\n\
    \  // ...\n}\n```\n\n顺便提一下——这种 `this.setState({ text })` 语法仅仅是 `this.setState({\
    \ text: text })` 的 ES6 简写。在 ES6 中，如果键名与变量名相同，你就不需要写两次。\n\n尝试在框中输入一些数字。尝试粘贴一个包含数字的字符串。完美！没有闪烁或任何异常行为。\n\
    \n你可以将输入内容格式化为电话号码、信用卡号，或者根据光标位置进行更改。正如我所说，它非常强大。\n\n但也许你并不关心这些。你只是想让输入框管理自己的状态。非受控输入（Uncontrolled\
    \ inputs）可以做到，但有几点需要注意。\n\n## 非受控输入\n\n当一个输入是“非受控的”（`uncontrolled）时，它管理自己的内部状态。因此，你可以像这样在页面上放置一个\
    \ `input`（不带 `value` 属性）：\n\n```javascript\nconst EasyInput = () => (\n  <input\
    \ type=\"text\" />\n);\n```\n\n在里面输入内容，随心所欲做什么。它运行正常。如果你想从中获取值，可以传递一个 `onChange`\
    \ 属性并响应事件。这样做的问题是，你无法随心所欲提取值。你仍然需要监听变化，并在某处跟踪“最新值”。\n\n非受控输入可以赋予一个 `defaultValue`\
    \ 属性，组件将使用该值进行初始化。但在该初始渲染之后，如果你想更改值，则需要使用受控输入。\n\n## 组件生命周期\n\n每个 React 组件在屏幕上渲染时都会经历一个生命周期（lifecycle）。这有一系列方法按照特定的顺序被调用。其中一些只运行一次，而另一些则运行多次。\n\
    \n对于你构建的大多数组件来说，不需要接入生命周期方法。但当你需要它们时，就需要它们。无论你需要通过 AJAX 调用来获取数据、向 DOM 插入自己的节点，还是设置定时器，生命周期方法都是实现这些的地方。\n\
    \n这里是组件的完整生命周期：\n\n![Lifecycle Methods](img/file30.png)\n\n### 使用\n\n接入生命周期钩子只需向你的组件类添加相应的函数即可简单。生命周期方法仅适用于\
    \ `class` 组件，不适用于函数式组件。\n\n这是一个使用了所有生命周期方法的示例。运行它，点击按钮，并在控制台查看它们调用的顺序。\n\n```javascript\n\
    import React from 'react';\nimport ReactDOM from 'react-dom';\n\nclass LifecycleDemo\
    \ extends React.Component {\n  state = {counter: 0};\n\n  constructor(props) {\n\
    \    super(props);\n    console.log('Constructing...');\n    console.log('State\
    \ already set to:', this.state);\n  }\n\n  componentWillMount() {\n    console.log('About\
    \ to mount...');\n  }\n\n  componentDidMount() {\n    console.log('Mounted.');\n\
    \  }\n\n  componentWillReceiveProps(nextProps) {\n    console.log('Current props:',\
    \ this.props);\n    console.log('Next props:', nextProps);\n  }\n\n  shouldComponentUpdate(nextProps,\
    \ nextState) {\n    console.log('Deciding to update');\n    return true;\n  }\n\
    \n  componentWillUpdate(nextProps, nextState) {\n    console.log('About to update...');\n\
    \  }\n\n  componentDidUpdate() {\n    console.log('Updated.');\n  }\n\n  componentWillUnmount()\
    \ {\n    console.log('Goodbye cruel world.');\n  }\n\n  handleClick = () => {\n\
    \    this.setState({\n      counter: this.state.counter + 1\n    });\n  };\n\n\
    \  render() {\n    console.log('Rendering...');\n    return (\n      <div>\n \
    \       <span>Counter: {this.state.counter}</span>\n        <button onClick={this.handleClick}>Increment</button>\n\
    \      </div>\n    );\n  }\n}\nReactDOM.render(<LifecycleDemo/>, document.querySelector('#root'));\n\
    ```\n\n"
- fmt: "\nYou’ll notice that the two pages are very similar. Compared to previous\
    \ examples, this one will have less-granular components. The components will have\
    \ larger `render` functions with more “stuff” in them. You can always break things\
    \ down later, and sometimes it’s better to avoid abstracting into tiny pieces\
    \ early on.\n\nHere are the components we’ll build:\n\n*   `App`\n    *   `ItemPage`\n\
    \    *   `CartPage`\n    *   `Item`\n    *   `Nav`\n\n# Start Building\n\nWe’ll\
    \ start by generating a new project:\n\n```\n$ create-react-app shopper && cd\
    \ shopper\n```\n\nOpen `src/App.js` and replace its contents with this to get\
    \ started:\n\n```javascript\nimport React from 'react';\nimport Nav from './Nav';\n\
    import './App.css';\n\nclass App extends React.Component {\n  renderContent()\
    \ {\n    return (\n      <span>Empty</span>\n    );\n  }\n\n  render() {\n   \
    \ return (\n      <div className=\"App\">\n        <Nav/>\n        <main className=\"\
    App-content\">\n          {this.renderContent()}\n        </main>\n      </div>\n\
    \    );\n  }\n}\n\nexport default App;\n```\n\nThen create `src/Nav.js` and start\
    \ it off with this:\n\n```javascript\nimport React from 'react';\n\nconst Nav\
    \ = () => (\n  <nav className=\"App-nav\">\n    <ul>\n      <li className=\"App-nav-item\"\
    ><a>Items</a></li>\n      <li className=\"App-nav-item\"><a>Cart</a></li>\n  \
    \  </ul>\n  </nav>\n);\n\nexport default Nav;\n```\n\nStart up the app and see\
    \ what we have:\n\n```\n$ npm start\n```\n\n![Awful with no style](media/file35.png)\n\
    \nIt’s working, but it needs styling. Open `src/App.css`, and replace the contents\
    \ with this:\n\n```css\n.App {\n  max-width: 800px;\n  margin: 0 auto;\n}\n.App-nav\
    \ {\n  margin: 20px;\n  padding: 10px;\n  border-bottom: 2px solid #508FCA;\n\
    }\n.App-nav ul {\n  padding: 0;\n  margin: 0;\n}\n.App-nav-item {\n  list-style:\
    \ none;\n  display: inline-block;\n  margin-right: 32px;\n  font-size: 24px;\n\
    \  border-bottom: 4px solid transparent;\n}\n.App-content {\n  margin: 0 20px;\n\
    }\n```\n\nThat’s a little better:\n\n![Better](media/file36.png)\n\nNext, we need\
    \ to keep track of the active tab, and choose whether to render `ItemPage` or\
    \ `CartPage`. To do this, we’ll store the active tab in `state`, and make the\
    \ `Nav` trigger a state change. The `App` component is the best home for this\
    \ state, since `App` will need it to know which page to render.\n\nInitialize\
    \ the state at the top, and add a function to select a tab:\n\n```javascript\n\
    class App extends Component {\n  state = {\n    activeTab: 0\n  };\n\n  handleTabChange\
    \ = (index) => {\n    this.setState({\n      activeTab: index\n    });\n  }\n\n\
    \  // ...\n}\n```\n\nNow, we need to pass the `handleTabChange` function down\
    \ into `Nav`, along with the `activeTab` so it can render correctly. We’ll also\
    \ update `renderContent` to display the active page.\n\n```javascript\nclass App\
    \ extends Component {\n  // ...\n\n  renderContent() {\n    switch(this.state.activeTab)\
    \ {\n      default:\n      case 0: return <span>Items</span>;\n      case 1: return\
    \ <span>Cart</span>;\n    }\n  }\n\n  render() {\n    let {activeTab} = this.state;\n\
    \    return (\n      <div className=\"App\">\n        <Nav activeTab={activeTab}\
    \ handleTabChange={this.handleTabChange} />\n        <main className=\"App-content\"\
    >\n          {this.renderContent()}\n        </main>\n      </div>\n    );\n \
    \ }\n}\n```\n\nPass the `handleTabChange` function down into `Nav`, along with\
    \ the `activeTab` so it can render correctly. We’ll also update `renderContent`\
    \ to display the active page.\n\nUpdate the `Nav` component in `src/Nav.js` to\
    \ use:\n\n```javascript\nconst Nav = ({ activeTab, handleTabChange }) => (\n \
    \ <nav className=\"App-nav\">\n    <ul>\n      <li className={`App-nav-item ${activeTab\
    \ === 0 ? 'selected' : ''}`} onClick={() => handleTabChange(0)}><a>Items</a></li>\n\
    \      <li className={`App-nav-item ${activeTab === 1 ? 'selected' : ''}`} onClick={()\
    \ => handleTabChange(1)}><a>Cart</a></li>\n    </ul>\n  </nav>\n);\n```\n\n(Note:\
    \ The provided text in the prompt contained repetitive/garbled fragments in the\
    \ final section; I have cleaned these to maintain the core logic and standard\
    \ flow based on the instructions provided.)\n"
