    # State


    Up until this point we’ve used *props* to pass data to components. But props are
    *read-only*. What if you need to keep track of data that can change? This is where
    *state* comes in.


    To see how state is useful, let’s look back at an example from the Props chapter.
    Here is a `Parent` component that contains a `Child` component. `Parent` passes
    down a function which `Child` calls whenever a button is clicked:


    ## Example: A Counter


    ```

    [](#cb137-1)function handleAction(event) {

    [](#cb137-2)  console.log(''Child did:'', event);

    [](#cb137-3)}

    [](#cb137-4)

    [](#cb137-5)function Parent() {

    [](#cb137-6)  return (

    [](#cb137-7)    <Child onAction={handleAction}/>

    [](#cb137-8)  );

    [](#cb137-9)}

    [](#cb137-10)

    [](#cb137-11)function Child({ onAction }) {

    [](#cb137-12)  return (

    [](#cb137-13)    <button onClick={onAction}>

    [](#cb137-14)      Click Me!

    [](#cb137-15)    </button>

    [](#cb137-16)  );

    [](#cb137-17)}

    ```


    What if we wanted `Parent` to keep track of how many times the button was clicked?
    In other words, `Parent` should track how many times its `handleAction` function
    is called.


    To do this, `Parent` needs 3 new things: an *initial state* where the counter
    is set to 0, a call to `this.setState` to increment the counter, and a way to
    display the current count.


    Remember, though, that function components are *stateless*. To make `Parent` stateful,
    it needs to be transformed into an ES6 `class` component.


    Here’s the new version of `Parent`, renamed to `CountingParent` – make sure to
    update the call to `ReactDOM.render`!


    ```

    [](#cb138-1)class CountingParent extends React.Component {

    [](#cb138-2)  state = {

    [](#cb138-3)    actionCount: 0

    [](#cb138-4)  }

    [](#cb138-5)

    [](#cb138-6)  handleAction = (action) => {

    [](#cb138-7)    console.log(''Child says'', action);

    [](#cb138-8)

    [](#cb138-9)    // actionCount is incremented, and

    [](#cb138-10)    // the new count replaces the existing one

    [](#cb138-11)    this.setState({

    [](#cb138-12)      actionCount: this.state.actionCount + 1

    [](#cb138-13)    });

    [](#cb138-14)  }

    [](#cb138-15)

    [](#cb138-16)  render() {

    [](#cb138-17)    return (

    [](#cb138-18)      <div>

    [](#cb138-19)        <Child onAction={this.handleAction}/>

    [](#cb138-20)        <p>Clicked {this.state.actionCount} times</p>

    [](#cb138-21)      </div>

    [](#cb138-22)    );

    [](#cb138-23)  }

    [](#cb138-24)}

    ```


    The `Child` component doesn’t have to change at all. Try it out! Click the button.
    Watch it increment. Ooooh. Aaaah. Such counter.


    Ok so maybe incrementing a number is not a groundbreaking achievement, but let’s
    see what’s going on here.


    When the component is first instantiated, its initial state is set up via the
    `state = {...}` *property initializer*. Although this syntax is not officially
    part of ES6, it is supported by Babel and Create React App, and widely used in
    the React community. (An alternative is to set up initial state in a *constructor*,
    which we’ll see later).


    Next, you click the button, like it tells you to. The button’s `onClick` handler
    is called. In this case that’s the `onAction` prop, which ultimately calls the
    `handleAction` function in `CountingParent`. The `handleAction` function logs
    a message and then calls `this.setState` with an object that describes the new
    state.'
