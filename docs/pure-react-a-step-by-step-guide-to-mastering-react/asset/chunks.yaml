    ```


    We already have the `handleAddToCart` function that takes an item and adds its
    id to the cart, so we can just reuse that here.


    We need to create the `handleRemoveOne` function. It will take an item, find an
    occurrence of that item in the cart, and then update the `cart` state to remove
    that occurrence.


    ```

    [](#cb190-1)class App extends Component {

    [](#cb190-2)  // ...

    [](#cb190-3)  handleRemoveOne = (item) => {

    [](#cb190-4)    let index = this.state.cart.indexOf(item.id);

    [](#cb190-5)    this.setState({

    [](#cb190-6)      cart: [

    [](#cb190-7)        ...this.state.cart.slice(0, index),

    [](#cb190-8)        ...this.state.cart.slice(index + 1)

    [](#cb190-9)      ]

    [](#cb190-10)    });

    [](#cb190-11)  }

    [](#cb190-12)  // ...

    [](#cb190-13)}

    ```


    We’re using the array *spread* operator twice here, in order to avoid mutating
    the state. We’re taking the left half of the array (up to the item we want to
    remove) and concatenating it with the right half of the array (everything after
    the item being removed).


    This is a little more work than if we were to allow mutations but it is a good
    habit to get into. It’ll be especially important if you start using Redux in the
    future. Redux relies heavily on immutability.


