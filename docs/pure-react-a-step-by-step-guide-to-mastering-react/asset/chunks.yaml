    There are a couple things in that code you may not have seen before.


    ## Array.prototype.reduce


    The `reduce` function works like a summation operation. It takes an optional initial
    value (`{}` here), and then calls the given function with the accumulated total
    and the current array item. The value returned from the function becomes the new
    `total`, and it moves on to the next item in the array. When `reduce` is done,
    it returns the final `total`. We’re using `reduce` to build up an object where
    the keys are `itemId`s and the values are the number of each item in the cart.


    Here’s a smaller, simpler example of `reduce` in action:


    ```

    [](#cb184-1)let a = [1, 2, 3, 4];

    [](#cb184-2)let total = a.reduce((sum, value) => {

    [](#cb184-3)  return sum + value;

    [](#cb184-4)}, 0);

    [](#cb184-5)

    [](#cb184-6)// The arrow function is called 4 times:

    [](#cb184-7)//   (0, 1) => returns 1

    [](#cb184-8)//   (1, 2) => returns 3

    [](#cb184-9)//   (3, 3) => returns 6

    [](#cb184-10)//   (6, 4) => returns 10

    [](#cb184-11)// Then reduce returns the last return value (10)

    ```


    The `reduce` function is a functional-style shorthand for code like this:


    ```

    [](#cb185-1)const a = [1, 2, 3, 4];

    [](#cb185-2)let total = 0;

    [](#cb185-3)for(let i = 0; i < a.length; i++) {

    [](#cb185-4)  total += a[i];

    [](#cb185-5)}

    ```


    Any time you want to iterate over the values of an array to create an aggregate
    result, consider using `reduce`.


    ## Object.keys


    `Object.keys` returns an array of the keys in an object. For instance `Object.keys({a:
    1, b: 2})` would return `[''a'', ''b'']`. Objects don’t have a built-in iterator
    `forEach` function like arrays do, so `Object.keys` makes it easier to iterate
    over the keys of an object.


    ### Modifying the Cart


    At this point, the “Cart” tab should be working. Click “Add to Cart” a few items,
    then click over to the “Cart” tab, and the items should be there. We still have
    the “Add to Cart” buttons, and we’re getting propType warnings about `onAddToCart`.
    We’ll fix both of those next.


    ![Cart is working](media/file41.png) 


    Even though the cart is working, it’s missing important features. There is no
    way to add or remove items, no total price, and we don’t even know how many of
    each item is in the cart.


    Remember how we reused the `Item` component inside `CartPage`? It would be nice
    if we could render a customized `Item` that had Add and Remove buttons in place
    of the “Add to Cart” button.


    There are a few ways to go about this.


    One idea: we could make a copy of the `Item` component, rename it `CartItem`,
    and customize it as necessary. This is quick and easy, but duplicates code.


    Another idea: we could make `Item` take a prop that tells it to be a “regular
    item” or a “cart item.” Using that prop, `Item` would decide whether to render
    an “Add to Cart” button or “Add/Remove” buttons. This would work, but it’s messy
    – `Item` would have multiple responsibilities. If it became necessary to reuse
    `Item` in a third situation, we might end up adding more conditional logic, making
    `Item` harder and harder to understand and maintain.'
