  trans: "\n将代码拆分为单独的文件并不会自动导致关注点分离。\n\n老旧的 jQuery 这种情况也是如此。HTML 完全不知道 JavaScript\
    \ 的存在，但由于 `jQuery` 选择器必须了解页面结构的某些信息，因此 JS 和 HTML 之间在事实上是紧密耦合的。如果结构发生了变化，代码也必须随之更改。\n\
    \n如果你还没有注意到，我想证明的是：模板和视图逻辑实际上可以共存在同一个文件中，而且*这样做实际上可能更有意义*。\n\n你现在不需要相信我。只需在学习示例和练习时，将这个想法留存在脑子里。你可能会发现（就像我一样），将逻辑和视图合并会让代码更容易导航、更容易编写且更容易调试。当所有相关功能都在一个地方时，你在不同文件之间跳回的时间就会更少。\n\
    \n# 使用 JSX\n\n## 组合组件\n\nJSX 像 HTML 一样，允许将元素嵌套在内部。这可能并不意外。\n\n让我们重构之前的 `HelloWorld`\
    \ 组件来演示组合是如何工作的。这里是原始的 `HelloWorld`：\n\n```\nfunction HelloWorld() {\n  return\
    \ (\n    <div>Hello World!</div>\n  );\n}\n```\n\n暂时保持 `HelloWorld` 组件不变，创建两个*新*组件：一个命名为\
    \ `Hello`，另一个命名为 `World`。`Hello` 应该渲染 `<span>Hello</span>`，而 `World` 应该渲染 `<span>World</span>`。你基本上可以复制\
    \ `HelloWorld` 组件并只需更改文本和函数名即可。\n\n动手尝试自己做这个更改吧。我会等。\n\n……\n\n……\n\n懂了吗？实际*手打出这些内容*并亲自尝试是非常重要的！不要只是一边点头一边阅读，因为那样你是无法真正学会的。看着代码并想“这都合理，是的”是非常容易的。在你*尝试它*之前，你永远不知道自己是否内化了它。\n\
    \n你的两个新组件看起来应该是这样：\n\n```\nfunction Hello() {\n  return <span>Hello</span>;\n\
    }\n\nfunction World() {\n  return <span>World</span>;\n}\n```\n\n现在，更新 `HelloWorld`\
    \ 组件以使用你刚刚创建的两个新组件。它看起来应该是这样：\n\n```\nfunction HelloWorld() {\n  return (\n  \
    \  <div>\n      <Hello/> <World/>!\n    </div>\n  );\n}\n```\n\n假设应用仍在运行，页面应该会自动刷新。如果没有，请手动刷新，并确保应用正在运行（如果未运行请运行\
    \ `npm start`）。\n\n你应该能看到和之前一样的“Hello World!”。我知道这看起来很简单，但我保证，这里有一些教训。\n\n## 用括号包裹\
    \ JSX\n\n接下来的示例依赖于你应该已经过的 `Hello` 和 `World` 组件，所以在此继续之前请确保它们存在。\n\n首先是一个关于格式的说明。你可能会注意到我将返回的\
    \ JSX 包裹在了括号 `()` 中。这并不是严格必须的，但如果你省略括号，起始标签必须与 return 语句在同一行，这看起来有点很奇怪：\n\n```\n\
    function HelloWorld() {\n  return <div>\n    <Hello/> <World/>!\n  </div>;\n}\n\
    ```\n\n为了好玩，尝试移除括号并观察发生了什么：\n\n```\nfunction HelloWorld() {\n  return \n    <div>\n\
    \      <Hello/> <World/>!\n    </div>;\n}\n```\n\n这将在浏览器控制台中报错并失败：\n\n> `HelloWorld(…):\
    \ A valid React element (or null) must be returned. You may have returned undefined,\
    \ an array or some other invalid object.`\n\n你可能还会看到一个关于“不可达代码（Unreachable code）”的警告。\n\
    \n这是因为 JavaScript 假设你在 return 之后想要一个分号（因为了换行），这实际上将其变成了这样，它返回了 undefined：\n\n\
    ```javascript\nfunction HelloWorld() {\n  return;\n    <div>\n      <Hello/> <World/>!\n\
    \    </div>;\n}\n```\n\n所以：你可以按照你喜欢的方式格式化 JSX，但如果它是多行的，我建议将其包裹在括号中。\n\n### 返回单个元素\n\
    \n注意在 `HelloWorld` 示例中，两个组件是如何包裹在一个 `<div>` 中的：\n\n```javascript\nfunction HelloWorld()\
    \ {\n  return (\n    <div>\n      <Hello/> <World/>!\n    </div>\n  );\n}\n```\n\
    \n这是一个小练习：尝试移除 `<div>` 包装并看看发生了什么。你应该得到这个错误：\n\n> `Adjacent JSX elements must\
    \ be wrapped in an enclosing tag`\n\n如果这看起来很奇怪，请记住 JSX 在运行之前会被编译为 JS：\n\n```javascript\n\
    // 这个 JSX:\n  return (<Hello/> <World/>);\n\n// 变成这个 JS:\n  return (\n    React.createElement(Hello,\
    \ null) React.createElement(World, null)\n  );\n```\n\n一次返回两个东西是没有意义的。所以这引出了这条非常重要的规则：\n\
    \n> **组件函数必须返回单个元素。**\n\n但等一下！你可以返回一个数组吗？毕竟这终是 JavaScript……\n\n```javascript\n\
    // 这个 JSX:\nreturn [<Hello/>, <World/>];\n\n// 会变成这个 JS\n// (注意括号)。\n// 它看起来是合法的...\n\
    return [\n  React.createElement(Hello, null),\n  React.createElement(World, null)\n\
    ];\n```\n\n尝试一下！它应该会失败。在开发控制台中，你会看到：\n\n> `HelloWorld(…): A valid React element\
    \ (or null) must be returned. You may have returned undefined, an array or some\
    \ other invalid object.`\n\n所以目前规则仍然有效：你必须返回单个元素。这个规则预计在 React 16 发布时会改变。\n\n\
    ### JSX 中的 JavaScript\n\n你可以在 JSX 代码中插入真实的 JavaScript 表达式，事实上，你经常会这样做。使用像这样的单大括号\
    \ `{}` 包裹 JavaScript：\n\n```javascript\nfunction SubmitButton() {\n  var buttonLabel\
    \ = \"Submit\";\n  return (\n    <button>{buttonLabel}</button>\n  );\n}\n```\n\
    \n记住，这将被编译为 JavaScript，这意味着大括号内的 JS 必须是一个*表达式（expression）*。表达式产生值。这些是表达式：\n\n\
    ```javascript\n1 + 2\nbuttonLabel\naFunctionCall()\naFunctionName\n```\n\n每一个都会产生（即返回）一个单一的值。相比之下，*语句（statements）*不产生值且不能用在\
    \ JSX 中。这里是一些语句的示例：\n\n```javascript\nvar a = 5\nif(true) { 17; }\nwhile(i < 7)\
    \ { i++ }\n```\n\n这些内容没有一个产生值。`var a = 5` 声明了一个值为 5 的变量，但并没有*返回*该值。\n\n思考语句与表达式的另一种方法是：*表达式*可以位于赋值的右侧，但语句不能。\n\
    \n```javascript\n// 这些不是合法的 JS:\na = var b = 5;\na = if(true) { 17; }\n```\n\n\
    我反复强调这一点是因为它很重要，而且是 React 初学者常见的陷阱。\n\n## JSX 中的“if”\n\n你可能可能会下一个问题是，“如果我不能使用‘if’，我该如何写条件判断？”有两个选项。\n\
    \n第一个是三元运算符（`?`）。像这样使用它：\n\n```javascript\nfunction ValidIndicator() {\n  var\
    \ isValid = true;\n  return (\n    <span>{isValid ? 'valid' : 'not valid'}</span>\n\
    \  );\n}\n```\n\n你也可以像这样使用布尔运算符，例如 `&&`：\n\n```javascript\nfunction ValidIndicator()\
    \ {\n  var isValid = true;\n  return (\n    <span>\n      {isValid && 'valid'}\n\
    \      {!isValid && 'not valid'}\n    </span>\n  );\n}\n```\n\n### JSX 中的注释\n"
- fmt: "\nIf you need to put a comment into a block of JSX, the syntax may look a\
    \ little strange. Remember that JavaScript needs to be inside single braces. Comments\
    \ in JSX must go inside a JavaScript block like this:\n\n```javascript\nfunction\
    \ ValidIndicator() {\n  var isValid = true;\n  return (\n    <span>\n      {/*\
    \ here is a comment */}\n      {isValid && 'valid'}\n      {!isValid && 'not valid'}\n\
    \      {\n        // Double-slash comments are\n        // OK in multi-line blocks.\n\
    \      }\n    </span>\n  );\n}\n```\n\n### Capitalize Component Names\n\nThe components\
    \ you write must begin with an uppercase letter. This means using names like `UserList`\
    \ and `Menu` and `SubmitButton`, and not names like `userList`, `menu`, and `submitButton`.\n\
    \nIn JSX, a component that starts with a lowercase letter is assumed to be a built-in\
    \ HTML or SVG element (`div`, `ul`, `rect`, etc.).\n\nEarly versions of React\
    \ kept a “whitelist” of all the built-in element names so it could tell them apart\
    \ from custom ones. Maintaining that whitelist was time-consuming and error-prone\
    \ – if a new SVG element made its way into the spec, you couldn’t use it until\
    \ React updated that list. So they killed the list, and added this rule.\n\n###\
    \ Close Every Element\n\nJSX requires that every element be closed, similar to\
    \ XML or XHTML. This includes the ones you might be used to leaving open in HTML5,\
    \ like `<br>` or `<input>` or maybe even `<li>`.\n\n```javascript\n// DO THIS:\n\
    return <br/>;\nreturn <input type='password' .../>;\nreturn <li>text</li>;\n\n\
    // NOT THIS:\nreturn <br>;\nreturn <input type='password' ...>;\nreturn <li>text;\n\
    ```\n\n## Exercises\n\nCreate a new app for these exercises by running:\n\n```bash\n\
    $ create-react-app jsx-exercises\n```\n\nOpen the `src/index.js` file and replace\
    \ the contents, similar to Hello World. Fill in the rest.\n\n```javascript\nimport\
    \ React from 'react';\nimport ReactDOM from 'react-dom';\n\nfunction MyThing()\
    \ {\n  // ...\n}\n\nReactDOM.render(\n  <MyThing/>,\n  document.getElementById('root')\n\
    );\n```\n\nYou can delete or ignore the `src/App*` files and the logo. If you\
    \ do not explicitly `import` them, they do not get bundled into your app.\n\n\
    1. Create a component that renders this JSX:\n\n```jsx\n<div className='book'>\n\
    \  <div className='title'>\n    The Title\n  </div>\n  <div className='author'>\n\
    \    The Author\n  </div>\n  <ul className='stats'>\n    <li className='rating'>\n\
    \      5 stars\n    </li>\n    <li className='isbn'>\n      12-345678-910\n  \
    \  </li>\n  </ul>\n</div>\n```\n\n2. See how JSX interprets whitespace. Try rendering\
    \ these arrangements (replace `.` with a space character) and take note of the\
    \ output (hint: leading and trailing spaces are removed, and so are newlines):\n\
    \n1. Single lines\n\n```jsx\n<div>\nNewline\nTest\n</div>\n```\n\n3. Empty newlines\n\
    \n```jsx\n<div>\nEmpty\n\nNewlines\n\nHere\n</div>\n```\n\n4. Spaces with newlines\n\
    \n```jsx\n<div>\n&nbsp;Non-breaking\n&nbsp;Spaces&nbsp;\n</div>\n```\n\n6. Inserting\
    \ spaces when content spans multiple lines\n\n```jsx\n<div>\nLine1\n{' '}\nLine2\n\
    </div>\n```\n\n3. Make a copy of the component from Exercise 1, and replace the\
    \ JSX with calls to `React.createElement`. The output should be identical.\n\n\
    4. Return the appropriate JSX from this component so that when `username` is undefined\
    \ or null, it renders “Not logged in”. When `username` is a string, render “Hello,\
    \ username”.\n\n```javascript\nfunction Greeting() {\n  // Try all of these variations:\n\
    \  //var username = \"root\";\n  //var username = undefined;\n  //var username\
    \ = null;\n  //var username = false;\n}\n```\n*(Note: The provided text ended\
    \ abruptly at the end of the exercises; the formatting above reflects the structure\
    \ of the provided input.)*\n[/content]\n\n***\n\n**Wait, I noticed the input text\
    \ contained two different sections (the \"Exercises\" section and a tutorial section\
    \ below). I have processed the de-cleaning the exercises first. Below is the formatted\
    \ version of the tutorial section provided at the end of your prompt:**\n\n[content]\n\
    # Example: Tweet\n\n## 1. Sketch\n\nThis is what we want to build. Let’s start\
    \ with a sketch. Here is the sketch we’ll be building:\n\n![A sketch of tweet](media/file1.png)\n\
    \n## 2. Carve into Components\n\nThe next step is to break this sketch into components.\
    \ Draw boxes around the parts, and think about reusability. Imagine you had three\
    \ tweets, each with different content. What would change?\n\n![Components have\
    \ been outlined](media/file2.png)\n\n## 3. Name the Components\n\nNow that we’ve\
    \ broken the sketch into pieces, we can name them.\n\n![Tweet with component names](media/file3.png)\n\
    \nEach of these will become a component, with `Tweet` being the parent of the\
    \ others:\n\n*   Avatar\n*   NameWithHandle\n*   Time\n*   Message\n*   ReplyButton\n\
    *   LikeButton\n*   RetweetButton\n*   MoreOptionsButton\n\n## 4. Build\n\nWe\
    \ know the component hierarchy now – let’s build it.\n\n### Top-Down, or Bottom-Up?\n\
    \nThere are two ways to approach this.\n\n1.  Start at the top. Build the `Tweet`\
    \ component first, then build its children. Build `Avatar`, then `NameWithHandle`,\
    \ and so on.\n2.  Start at the bottom (the \"leaves\" of the tree). Build `Avatar`,\
    \ then `NameWithHandle`, then the rest of the child components. Verify that they\
    \ work in isolation. Once they’re all done, assemble them into the `Tweet` component.\n\
    \nSo what’s the best way? Well, it depends (doesn’t it *always?).\n\nFor a simple\
    \ hierarchy like this one, it doesn’t matter much. It’s easiest to start at the\
    \ top, so that’s what we’ll do here.\n\nFor a more complex hierarchy, start at\
    \ the bottom. Build small pieces, test that they work, and combine them as you\
    \ go. This way you can be confident that the small pieces work, and, by induction,\
    \ the combination of them should also work (in theory, anyway).\n"
