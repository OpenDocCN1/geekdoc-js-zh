    ## Exercises


    1.  It would be nice if the shopping cart told us how many thousands of dollars
    we were about to spend on Apple products, rather than letting us guess. Add a
    “Total” to the bottom of the Cart page similar to this:


    ![Cart Total](media/file43.png) 


    2.  The Cart page is completely blank when the cart is empty. Modify it to display
    “Your cart is empty” when there are no items in the cart, something like this:


    ![Cart Total](media/file44.png) 


    3.  Display a summary of the shopping cart in the top-right of the nav bar, as
    shown below. Include the total number of items in the cart and the total price.
    Make sure to account for the fact that each item in the cart array could have
    a count greater than 1\. As a bonus, make the cart summary clickable, and switch
    to the Cart page on click. Add a shopping cart icon too if you like (this one
    is from Font Awesome).


