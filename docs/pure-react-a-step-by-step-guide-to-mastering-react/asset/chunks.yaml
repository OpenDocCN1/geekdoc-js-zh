    # Where To Go From Here


    First of all, congratulations for making it to the end of the book. I hope that
    you had as much fun reading it as I did writing it.


    Now, with that said, this is not the end. This is only the beginning of your React
    journey.


    At this point you have a solid grasp of React’s fundamentals, and you’ve learned
    some ES6 too. From here, you can go on to learn about AJAX, Webpack, React Router,
    Redux or MobX, and whatever else you need.


    Here’s a suggested order in which to tackle them. I think it’s important that
    Redux be learned last, but the others can be reordered as you see fit.


    ## AJAX


    Learning how to connect your app to a server is fun, because you get to see your
    app come alive with real data.


    React doesn’t have any built-in ways to talk to servers, so you’ll need to use
    an HTTP library. There are a number of them available. I like [fetch](https://github.com/github/fetch)
    because it will eventually be part of the JavaScript standard library, but [axios](https://github.com/mzabriskie/axios)
    and [superagent](https://github.com/visionmedia/superagent) are also good choices.


    How and where should you make HTTP requests? A common practice is to fetch data
    within the `componentDidMount` lifecycle method. When the response comes back,
    call `this.setState` to save that data, and use props to pass it down to the components
    that need it.


    As with all state, it’s best to keep it as high up in the component hierarchy
    as possible. For instance, if a `Page` contains multiple `List` components, don’t
    have each `List` fetch its own data – fetch that data in the `Page` component,
    and pass it down to the `List`s as props.


    ## Testing


    Testing is an important part of building software. Whether you decide to use test-driven
    development (TDD) or not, having tests around your code gives you confidence that
    everything works as it should.


    There are a handful of new tools to learn for testing React. You’ll need a way
    to make assertions (Chai), probably want a library for setting up spies (Sinon),
    and will definitely want to use Enzyme, a library for testing React components
    created by Airbnb.


    I put together an article to get you started with testing React [here](https://daveceddia.com/getting-started-with-tdd-in-react/).


    ## Webpack


    Build tools are a major stumbling block in the beginning, which is why setting
    up Webpack wasn’t part of this book. If you don’t need to customize your build
    yet, postpone learning Webpack until later.


    I recommend reading the article [Webpack – The Confusing Parts](https://medium.com/@rajaraodv/webpack-the-confusing-parts-58712f8fcad9)
    as an introduction to Webpack and its way of thinking. Egghead.io has a nice quick
    introduction to Webpack as well, at [https://egghead.io/lessons/javascript-intro-to-webpack](https://egghead.io/lessons/javascript-intro-to-webpack).


    You should know that the `create-react-app` tool we’ve been using has a production
    build mode (run `npm run build`) which will create a production-optimized build
    with minified files and a production build of React. If you don’t need to customize
    anything, Create React App is great out of the box, and perfectly suited to write
    real production React apps.


    It also has an “eject” command (run `npm run eject`) which extracts the generated
    Webpack build and exposes it for you to customize.


    ## ES6


    You’ve already seen some of this throughout the book: arrow functions, let/const,
    classes, destructuring, and `import`/`export`. This is most of the ES6 you’ll
    use on a regular basis, but there are a number of other nice additions, like promises,
    `for..of` loops, dynamic object keys, iterators, and more.


    You can learn these features as you go, but it’s a good idea to at least do a
    quick survey of everything so you know what’s available. This [Overview of ES6
    Features](https://github.com/lukehoban/es6features) is a great resource.


    ## Routing


    Now that you have a fairly good handle on how React works, React Router’s concepts
    will build upon them. It makes use of components to lay out the routing for your
    application, effectively mapping your components to URLs. Check out [React Router
    on Github](https://github.com/ReactTraining/react-router) to get started.


    Some people conflate React Router and Redux in their head – they’re not actually
    related or dependent on each other, although there is a library that links the
    router’s state with Redux. You can (and should!) learn to use React Router before
    diving into Redux.


    ## Redux


    Dan Abramov, the creator of Redux, [will tell you](https://github.com/gaearon/react-makes-you-sad)
    not to add Redux to your project too early, and for good reason – you don’t actually
    need Redux until you encounter the problems it solves, and it’s a dose of complexity
    that can be disastrous early on.


    The concepts behind Redux are fairly simple, but there is a gap between understanding
    how the pieces work and knowing how to use Redux in a real app. It will take some
    practice to truly understand Redux. It’s also influenced by functional programming
    concepts, which can take some getting used to if you’re not familiar with them.


    So, before you commit to adding Redux to a larger project, repeat what you did
    throughout this book: build small projects. Take code that uses plain React state
    and convert it to use Redux. Build a bunch of little Redux experiments to really
    internalize how it works.


    ## On Boilerplate Projects


    I recommend building your project brick-by-brick, adding pieces as you need them.
    That way you will understand how all of the moving parts work, which means you
    can fix them when they break or extend them when you outgrow the default settings.


    It’s easy to fall into the trap of thinking that learning “Pure React” is only
    for beginners, and that you’ll basically be required to use a boilerplate project
    for any substantial project. I don’t think anything could be further from the
    truth.


    Part of the power of React is being able to build your own stack the way you like
    it. Even if you abdicate control and use a boilerplate project, you still have
    to learn the conventions of that particular project. I suggest steering clear
    of boilerplate projects most of the time.


    One of the allures of a boilerplate is that it prescribes a project structure
    for you. If the structure of files on disk is keeping you from making progress,
    read this article: [https://daveceddia.com/react-project-structure/](https://daveceddia.com/react-project-structure/)


    ## Thank You


    Thanks so much for not only purchasing, but finishing this book. I would love
    to know your thoughts – what was good, what needs improvement, or any suggestions
    for future topics. Feel free to reach me at dave@daveceddia.com or contact me
    on Twitter @dceddia.

