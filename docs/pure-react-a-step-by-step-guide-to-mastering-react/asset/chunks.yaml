    \ 组件的常用方法之一是使其变得“纯”，这意味着它只在 props 改变时才重新渲染。这可以通过扩展 `React.PureComponent` 而不是 `React.Component`\
    \ 来自动完成，也可以通过手动实现 `shouldComponentUpdate` 周期方法来比较 `nextProps` 和当前的 props。如果 props\
    \ 看起来一样，它就会跳过渲染并节省时间。\n\n这是一个渲染项目列表的简单组件。注意它扩展了 `React.PureComponent`。\n\n（如果你有示例代码，这段代码位于“impure-state”文件夹下。）\n\
    \n```javascript\nclass ItemList extends React.PureComponent {\n  static propTypes\
