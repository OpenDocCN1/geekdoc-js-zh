    \ = {a: 1, b: 2};\nvar o2 = {...o1, c: 3}; // => {a: 1, b: 2, c: 3}\n```\n\n注意，数组的展开运算符正式是\
    \ ES6 的一部分，但对象的展开不是。然而，Babel 支持对象展开，而 Create React App 底层正使用 Babel 将我们的代码转换为浏览器兼容的\
    \ ES5。\n\n### 以不可变的方式更新状态\n\n你可能在想……为什么不直接修改状态然后调用 `setState` 呢，像这样：\n\n```javascript\n\
    this.state.cart.push(item.id);\nthis.setState({cart: this.state.cart});\n```\n\
    \n这是一个坏主意，原因有两个（尽管在这个示例中它可以运行）。\n\n你应该`永远不要`直接修改（mutate）状态或其子属性。不要执行 `this.state.something\
