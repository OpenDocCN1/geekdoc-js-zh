    \  border-bottom: 1px solid #ccc;\n  padding: 10px;\n}\n.Item-image {\n  width:\
    \ 64px;\n  height: 64px;\n  border: 1px solid #ccc;\n  margin-right: 10px;\n \
    \ float: left;\n}\n.Item-title {\n  font-weight: bold;\n  margin-bottom: 0.4em;\n\
