  trans: "\n\n如果你需要向 JSX 块中添加注释，语法看起来可能会有点奇怪。记住，JavaScript 需要放在单大括号内。JSX 中的注释必须像这样放在\
    \ JavaScript 块中：\n\n```javascript\nfunction ValidIndicator() {\n  var isValid\
    \ = true;\n  return (\n    <span>\n      {/* 这里是一条注释 */}\n      {isValid && 'valid'}\n\
    \      {!isValid && 'not valid'}\n      {\n        // 双斜线注释在\n        // 多行块中是允许的。\n\
    \      }\n    </span>\n  );\n}\n```\n\n### 组件名称大写\n\n你编写组件必须以大写字母开头。这意味着要使用像 `UserList`、`Menu`\
    \ 和 `SubmitButton` 这样的名称，而不是 `userList`、`menu` 和 `submitButton`。\n\n在 JSX 中，以小写字母开头的组件被认为是内置的\
    \ HTML 或 SVG 元素（如 `div`、`ul`、`rect` 等）。\n\n早期版本的 React 维护了一个所有内置元素名称的“名单”，以便将它们与自定义区分开来。维护这个名单既耗时又容易出错——如果一个新的\
    \ SVG 元素进入了规范，在 React 更新该列表之前，你无法使用它。因此，他们删除了列表，并添加了这条规则。\n\n### 关闭每个元素\n\nJSX\
    \ 要求每个元素都必须关闭，类似于 XML 或 XHTML。这包括你可能习惯在 HTML5 中保持不关闭的元素，如 `<br>` 或 `<input>` 甚至是\
    \ `<li>`。\n\n```javascript\n// 应该这样做：\nreturn <br/>;\nreturn <input type='password'\
    \ .../>;\nreturn <li>text</li>;\n\n// 不要这样做：\nreturn <br>;\nreturn <input type='password'\
    \ ...>;\nreturn <li>text;\n```\n\n## 练习\n\n运行以下命令为这些练习创建一个新应用：\n\n```bash\n$ create-react-app\
    \ jsx-exercises\n```\n\n打开 `src/index.js` 文件并替换内容，类似于 Hello World 示例。完成剩余部分工作。\n\
    \n```javascript\nimport React from 'react';\nimport ReactDOM from 'react-dom';\n\
    \nfunction MyThing() {\n  // ...\n}\n\nReactDOM.render(\n  <MyThing/>,\n  document.getElementById('root')\n\
    );\n```\n\n你可以删除或忽略 `src/App*` 文件和图标。如果你没有显式 `import` 它们，它们就不会构建到你的应用中。\n\n1.\
    \ 创建一个渲染此 JSX 的组件：\n\n```jsx\n<div className='book'>\n  <div className='title'>\n\
    \    The Title\n  </div>\n  <div className='author'>\n    The Author\n  </div>\n\
    \  <ul className='stats'>\n    <li className='rating'>\n      5 stars\n    </li>\n\
    \    <li className='isbn'>\n      12-345678-910\n    </li>\n  </ul>\n</div>\n\
    ```\n\n2. 观察 JSX 如何解释空白。尝试渲染这些布局（将 `.` 替换为空格字符）并注意输出（提示：开头和结尾的空格会被移除，换行符也是如此）：\n\
    \n1. 单行\n\n```jsx\n<div>\nNewline\nTest\n</div>\n```\n\n3. 空换行\n\n```jsx\n<div>\n\
    Empty\n\nNewlines\n\nHere\n</div>\n```\n\n4. 带有换行符的空格\n\n```jsx\n<div>\n&nbsp;Non-breaking\n\
    &nbsp;Spaces&nbsp;\n</div>\n```\n\n6. 当内容跨越多行时插入空格\n\n```jsx\n<div>\nLine1\n{'\
    \ '}\nLine2\n</div>\n```\n\n3. 复制练习 1 中的组件，并将 JSX 替换为对 `React.createElement` 的调用。输出应该是相同的。\n\
    \n4. 从此组件返回相应的 JSX，以便当 `username` 为 `undefined` 或 `null` 时，渲染“Not logged in”。当\
    \ `username` 是字符串时，渲染“Hello, username”。\n\n```javascript\nfunction Greeting()\
    \ {\n  // 尝试所有这些变体：\n  //var username = \"root\";\n  //var username = undefined;\n\
    \  //var username = null;\n  //var username = false;\n}\n```\n（注：提供的文本在练习结束处突然中断；上面的格式反映了所提供输入的结构。）\n\
    \n[/content]***\n\n[content]\n# 示例：推文\n\n## 1. 草图\n\n这是我们要构建的内容。让我们从草图开始。这是我们要构建的草图：\n\
    \n![推文的草图](img/file1.png)\n\n## 2. 拆分为组件\n\n下一步是将此草图拆分为组件。在部分周围画框，并考虑可重用性。想象你有三条推文，每条的内容都不同。会有什么变化？\n\
    \n![已勾勒出组件](img/file2.png)\n\n## 3. 为组件命名\n\n现在我们已经将草图拆分成部分，可以为它们命名。\n\n![带有组件名称的推文](img/file3.png)\n\
    \n这些每一个都将成为一个组件，其中 `Tweet` 是其他组件的父组件：\n\n*   Avatar\n*   NameWithHandle\n*   Time\n\
    *   Message\n*   ReplyButton\n*   LikeButton\n*   RetweetButton\n*   MoreOptionsButton\n\
    \n## 4. 构建\n\n现在知道了组件层级结构——让我们构建它。\n\n### 自顶向下，还是自底向上？\n\n有两种方法来处理这种情况。\n\n1.\
    \ 从顶部开始。首先构建 `Tweet` 组件，然后构建它的子组件。构建 `Avatar`，然后 `NameWithHandle`，以此此类推。\n2. 从底部开始（树的“叶子”）。构建\
    \ `Avatar`，然后 `NameWithHandle`，以及其他子组件。验证它们在孤立状态下的运行情况。一旦全部完成，就将它们组装到 `Tweet`\
    \ 组件中。\n\n那么什么是最好的方法呢？嗯，这*总是*如此吗？\n\n对于像这样简单的层级结构，差别并不不大。从顶部开始最容易，所以我们在这里将这样做。\n\
    \n对于更复杂的层级结构，从底部开始。构建较小的部分，测试它们运行正常，并随着过程进行组合。这样你就可以确信小部分是正常的，并且根据归纳法，它们的组合也应该是正常的（至少在理论上如此）。\n\
    \n"
- fmt: "\nFor example, if we were building Twitter, we might build the `Tweet` component\
    \ top-down, then incorporate it into a list of tweets, then embed that list in\
    \ a page, then embed that page into the larger application. The `Tweet` could\
    \ be built top-down while the larger application is build bottom-up.\n\nThere’s\
    \ another case where building from the bottom is a good idea, and that’s if you\
    \ have an existing app written in another framework like `Angular` or `Backbone`\
    \ and you want to rewrite in it `React`. Starting at the top makes little sense\
    \ here, because it’ll have a ripple effect across your entire code base.\n\nStarting\
    \ at the bottom is manageable and controlled. You can build the “leaf nodes” of\
    \ your app – the small, contained pieces. Get those working, then build the next\
    \ level up, and so on, until you reach the top. At that point you have the option\
    \ to replace your current framework with `React` if you choose to.\n\nThe other\
    \ advantage of bottom-up development in a rewrite is that it fits nicely with\
    \ `React`’s one-way data flow paradigm. Since the `React` components occupy the\
    \ bottom of the tree, and you’re guaranteed that `React` components only contain\
    \ other `React` components, it’s easier to reason about how to pass your data\
    \ to the components that need it.\n\n### Build the Tweet Component\n\nHere’s our\
    \ blueprint again:\n\n![The Tweet](media/file2.png)\n\nWe’ll be building a plain\
    \ static tweet in this section, starting with the top-level component, `Tweet`.\n\
    \nCreate a new project with `Create React App` by running this command:\n\n```\n\
    $ create-react-app static-tweet && cd static-tweet\n```\n\nIt gave us a few files\
    \ we won’t use here, so we can safely delete them:\n\n```bash\n$ rm src/App.*\
    \ src/logo.svg\n```\n\nThe newly-generated project comes with an `index.html`\
    \ file in the `public` directory. Add Font Awesome by putting this line inside\
    \ the `<head>` tag (put it all on one line):\n\n```html\n<link rel=\"stylesheet\"\
    \ href=\"https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css\"\
    >\n```\n\nWe also have a generated `index.css` file in the `src` directory. Open\
    \ it up and replace its contents with this:\n\n```css\n.tweet {\n  border: 1px\
    \ solid #ccc;\n  width: 564px;\n  min-height: 68px;\n  padding: 10px;\n  display:\
    \ flex;\n  font-family: \"Helvetica\", arial, sans-serif;\n  font-size: 14px;\n\
    \  line-height: 18px;\n}\n```\n\nThe `index.js` file will be very similar to the\
    \ one from Hello World. It’s basically the same thing, with “Tweet” instead of\
    \ “Hello World”. We’ll make it better soon, I promise. Replace the contents of\
    \ `src/index.js` with this:\n\n```javascript\nimport React from 'react';\nimport\
    \ ReactDOM from 'react-dom';\nimport './index.css';\n\nfunction Tweet() {\n  return\
    \ (\n    <div className=\"tweet\">\n      Tweet\n    </div>\n  );\n}\n\nReactDOM.render(<Tweet/>,\n\
    \  document.querySelector('#root'));\n```\n\nThat should do it. Start up the server,\
    \ same as before, by running:\n\n```bash\n$ npm start\n```\n\nAnd the page should\
    \ render something like this:\n\n![Tweet](media/file4.png)\n\nThis is nothing\
    \ you haven’t seen before. It’s a simple component, with the addition of a special\
    \ `className` attribute (or “prop”).\n\nOne other new thing you might’ve noticed\
    \ is the `import './index.css'` which is importing… a CSS file into a JavaScript\
    \ file? Seems weird at first glance.\n\nWhat’s happening is that behind the scenes,\
    \ when `Webpack` builds our app, it sees this CSS import and learns that `index.js`\
    \ depends on `index.css`. `Webpack` reads the CSS file and includes it in the\
    \ bundled JavaScript (as a string) to be sent to the browser.\n\nYou can actually\
    \ see this in the browser – open the dev console, look at the Elements tab, and\
    \ notice under `<head>` there’s a `<style>` tag that we didn’t put there. It contains\
    \ the contents of `index.css`.\n\nWe’ll learn more about props in the next section,\
    \ but for now, just think of them like HTML attributes. Most of them are named\
    \ identically to the attributes you already know, but `className` is special in\
    \ that its value becomes the `class` attribute on the DOM node.\n\nBack to our\
    \ outline. Let’s build the `Avatar` component. Add the component function to `index.js`:\n\
    \n```javascript\nfunction Avatar() {\n  return (\n    <img\n      src=\"https://www.gravatar.com/avatar/nothing\"\
    \n      className=\"avatar\"\n      alt=\"avatar\" />\n  );\n}\n```\n\nLater on\
    \ we’ll look at extracting components into files and importing them via `import`,\
    \ but to keep things simple for now, we’ll just put all the components in `index.js`.\n\
    \nIf you want to use your own Gravatar, go to [daveceddia.com/gravatar](https://daveceddia.com/gravatar)\
    \ to figure out its URL.\n\nNext we need to change `Tweet` to render `Avatar`:\n\
    \n```javascript\nfunction Tweet() {\n  return (\n    <div className=\"tweet\"\
    >\n      <Avatar/>\n      Tweet\n    </div>\n  );\n}\n```\n\nNow just give `Avatar`\
    \ some style, in `index.css`:\n\n```css\n.avatar {\n  width: 48px;\n  height:\
    \ 48px;\n  border-radius: 5px;\n  margin-right: 10px;\n}\n```\n\nIt’s getting\
    \ better:\n\n![Tweet](media/file5.png)\n\nNext we’ll create two more components,\
    \ the `Message` and `NameWithHandle`:\n\n```javascript\nfunction Message() {\n\
    \  return (\n    <div className=\"message\">\n      less than 140 characters.\n\
    \    </div>\n  );\n}\n\nfunction NameWithHandle() {\n  return (\n    <span className=\"\
    name-handle\">\n      <span className=\"name\">Name</span>\n      <span className=\"\
    handle\">@handle</span>\n    </span>\n  );\n}\n```\n\nIf you refresh now, nothing\
    \ will have changed because we still need to update `Tweet` to use these components:\n\
    \n```javascript\nfunction Tweet() {\n  return (\n    <div className=\"tweet\"\
    >\n      <Avatar/>\n      <div className=\"content\">\n        <NameWithHandle/>\n\
    \        <Message/>\n      </div>\n    </div>\n  );\n}\n```\n\nIt’s rendering\
    \ now, but it’s ugly. Spruce it up with some CSS for the name and handle:\n\n\
    ```css\n.name {\n  font-weight: bold;\n  margin-bottom: 0.5em;\n  margin-right:\
    \ 0.3em;\n}\n\n.handle {\n  color: #8899a6;\n  font-size: 13px;\n}\n```\n\n![Tweet](media/file6.png)\n\
    \nIt’s looking more like a real tweet! Next up, add the `Time` and the buttons\
    \ (we’ll talk about the new syntax in a second):\n\n```javascript\nconst Time\
    \ = () => (\n  <span className=\"time\">3h ago</span>\n);\n\nconst ReplyButton\
    \ = () => (\n  <i className=\"fa fa-reply reply-button\"/>\n);\n\nconst RetweetButton\
    \ = () => (\n  <i className=\"fa fa-retweet retweet-button\"/>\n);\n\nconst LikeButton\
    \ = () => (\n  <i className=\"fa fa-heart like-button\"/>\n);\n\nconst MoreOptionsButton\
    \ = () => (\n  <i className=\"fa fa-ellipsis-h more-options-button\"/>\n);\n```\n\
    \nThese components don’t look like the `function`s you’ve been writing up to this\
    \ point, but they are in fact still functions. They’re *arrow functions*. Here’s\
    \ a progression from a regular `function` to an arrow function so you can see\
    \ what’s happening:\n"
  raw: 'For example, if we were building Twitter, we might build the Tweet component
    top-down, then incorporate it into a list of tweets, then embed that list in a
    page, then embed that page into the larger application. The Tweet could be built
    top-down while the larger application is build bottom-up.


    There’s another case where building from the bottom is a good idea, and that’s
    if you have an existing app written in another framework like Angular or Backbone
    and you want to rewrite in it React. Starting at the top makes little sense here,
    because it’ll have a ripple effect across your entire code base.


    Starting at the bottom is manageable and controlled. You can build the “leaf nodes”
    of your app – the small, contained pieces. Get those working, then build the next
    level up, and so on, until you reach the top. At that point you have the option
    to replace your current framework with React if you choose to.


    The other advantage of bottom-up development in a rewrite is that it fits nicely
    with React’s one-way data flow paradigm. Since the React components occupy the
    bottom of the tree, and you’re guaranteed that React components only contain other
    React components, it’s easier to reason about how to pass your data to the components
    that need it.


    ### Build the Tweet Component


    Here’s our blueprint again:


    ![The Tweet](media/file2.png) 


    We’ll be building a plain static tweet in this section, starting with the top-level
    component, `Tweet`.


    Create a new project with Create React App by running this command:


    ```

    $ create-react-app static-tweet && cd static-tweet

    ```


    It gave us a few files we won’t use here, so we can safely delete them:


    ```

    $ rm src/App.* src/logo.svg

    ```


    The newly-generated project comes with an `index.html` file in the `public` directory.
    Add Font Awesome by putting this line inside the `<head>` tag (put it all on one
    line):


    ```

    [](#cb43-1)<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/

    [](#cb43-2) font-awesome/4.7.0/css/font-awesome.min.css">

    ```


    We also have a generated `index.css` file in the `src` directory. Open it up and
    replace its contents with this:


    ```

    [](#cb44-1).tweet {

    [](#cb44-2)  border: 1px solid #ccc;

    [](#cb44-3)  width: 564px;

    [](#cb44-4)  min-height: 68px;

    [](#cb44-5)  padding: 10px;

    [](#cb44-6)  display: flex;

    [](#cb44-7)  font-family: "Helvetica", arial, sans-serif;

    [](#cb44-8)  font-size: 14px;

    [](#cb44-9)  line-height: 18px;

    [](#cb44-10)}

    ```


    The `index.js` file will be very similar to the one from Hello World. It’s basically
    the same thing, with “Tweet” instead of “Hello World”. We’ll make it better soon,
    I promise. Replace the contents of `src/index.js` with this:


    ```

    [](#cb45-1)import React from ''react'';

    [](#cb45-2)import ReactDOM from ''react-dom'';

    [](#cb45-3)import ''./index.css'';

    [](#cb45-4)

    [](#cb45-5)function Tweet() {

    [](#cb45-6)  return (

    [](#cb45-7)    <div className="tweet">

    [](#cb45-8)      Tweet

    [](#cb45-9)    </div>

    [](#cb45-10)  );

    [](#cb45-11)}

    [](#cb45-12)

    [](#cb45-13)ReactDOM.render(<Tweet/>,

    [](#cb45-14)  document.querySelector(''#root''));

    ```


    That should do it. Start up the server, same as before, by running:


    ```

    $ npm start

    ```


    And the page should render something like this:


    ![Tweet](media/file4.png) 


    This is nothing you haven’t seen before. It’s a simple component, with the addition
    of a special `className` attribute (or “prop”).


    One other new thing you might’ve noticed is the `import ''./index.css''` which
    is importing… a CSS file into a JavaScript file? Seems weird at first glance.


    What’s happening is that behind the scenes, when Webpack builds our app, it sees
    this CSS import and learns that `index.js` depends on `index.css`. Webpack reads
    the CSS file and includes it in the bundled JavaScript (as a string) to be sent
    to the browser.


    You can actually see this in the browser – open the dev console, look at the Elements
    tab, and notice under `<head>` there’s a `<style>` tag that we didn’t put there.
    It contains the contents of `index.css`.


    We’ll learn more about props in the next section, but for now, just think of them
    like HTML attributes. Most of them are named identically to the attributes you
    already know, but `className` is special in that its value becomes the `class`
    attribute on the DOM node.


    Back to our outline. Let’s build the `Avatar` component. Add the component function
    to `index.js`:


    ```

    [](#cb47-1)function Avatar() {

    [](#cb47-2)  return (

    [](#cb47-3)    <img

    [](#cb47-4)      src="https://www.gravatar.com/avatar/nothing"

    [](#cb47-5)      className="avatar"

    [](#cb47-6)      alt="avatar" />

    [](#cb47-7)  );

    [](#cb47-8)}

    ```


    Later on we’ll look at extracting components into files and importing them via
    `import`, but to keep things simple for now, we’ll just put all the components
    in `index.js`.


    If you want to use your own Gravatar, go to [daveceddia.com/gravatar](https://daveceddia.com/gravatar)
    to figure out its URL.


    Next we need to change `Tweet` to render `Avatar`:


    ```

    [](#cb48-1)function Tweet() {

    [](#cb48-2)  return (

    [](#cb48-3)    <div className="tweet">

    [](#cb48-4)      <Avatar/>

    [](#cb48-5)      Tweet

    [](#cb48-6)    </div>

    [](#cb48-7)  );

    [](#cb48-8)}

    ```


    Now just give `Avatar` some style, in `index.css`:


    ```

    [](#cb49-1).avatar {

    [](#cb49-2)  width: 48px;

    [](#cb49-3)  height: 48px;

    [](#cb49-4)  border-radius: 5px;

    [](#cb49-5)  margin-right: 10px;

    [](#cb49-6)}

    ```


    It’s getting better:


    ![Tweet](media/file5.png) 


    Next we’ll create two more components, the `Message` and `NameWithHandle`:


    ```

    [](#cb50-1)function Message() {

    [](#cb50-2)  return (

    [](#cb50-3)    <div className="message">

    [](#cb50-4)      This is less than 140 characters.

    [](#cb50-5)    </div>

    [](#cb50-6)  );

    [](#cb50-7)}

    [](#cb50-8)

    [](#cb50-9)function NameWithHandle() {

    [](#cb50-10)  return (

    [](#cb50-11)    <span className="name-with-handle">

    [](#cb50-12)      <span className="name">Your Name</span>

    [](#cb50-13)      <span className="handle">@yourhandle</span>

    [](#cb50-14)    </span>

    [](#cb50-15)  );

    [](#cb50-16)}

    ```


    If you refresh now, nothing will have changed because we still need to update
    `Tweet` to use these new components:


    ```

    [](#cb51-1)function Tweet() {

    [](#cb51-2)  return (

    [](#cb51-3)    <div className="tweet">

    [](#cb51-4)      <Avatar/>

    [](#cb51-5)      <div className="content">

    [](#cb51-6)        <NameWithHandle/>

    [](#cb51-7)        <Message/>

    [](#cb51-8)      </div>

    [](#cb51-9)    </div>

    [](#cb51-10)  );

