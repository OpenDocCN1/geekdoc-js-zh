    # the `setTimeout()` method


    The syntax is as follows:


    ```javascript

    var t=setTimeout("javascript statement",milliseconds);

    ```


    The `setTimeout()` method returns a value. In the preceding statement, the value
    is stored in a variable called `t`. If you want to cancel this `setTimeout()`,
    you can refer to it using the variable name `t`.


    The first parameter of `setTimeout()` is a string that contains a JavaScript statement.
    This statement could be a statement like `"alert(''5 seconds!'')"` or a call to
    a function, like `alertMsg()`.


    The second parameter indicates how many milliseconds from now you want to execute
    the first parameter.


