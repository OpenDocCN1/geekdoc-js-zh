    JavaScript’s official name is `ECMAScript`, which is developed and maintained
    by the `ECMA International` organization.


    The language was invented by Brendan Eich at `Netscape` (with `Navigator 2.0`)
    and has appeared in all Netscape and Microsoft browsers since 1996.


    # 2 Introduction


    `ECMA-262` is the official JavaScript standard. The development of `ECMA-262`
    started in 1996, and the first edition of was adopted by the `ECMA General Assembly`
    in June 1997.


    The standard was approved as an international ISO (`ISO/IEC 16262`) standard in
    1998.


    The development of the standard is still in progress.


    ## AJAX


    AJAX equals Asynchronous JavaScript and XML.


    AJAX is based on JavaScript and `HTTP` requests. AJAX is not a new programming
    language, but a new way to use existing standards.


    AJAX is the art of trading data with a Web server, and changing parts of a Web
    page, without reloading the whole page.


    ## What You should Already Know


    Before you continue you should have a basic understanding of the following:

    * 8 HTML

    * 8 JavaScript


    If you want to study these subjects first, find the tutorials on the `w3schools`
    home page.


    ## AJAX = Asynchronous Javascript and XMl


    AJAX is not a new programming language, but a new technique for creating better,
    faster, and more interactive Web applications.


    With AJAX, a JavaScript can communicate directly with the server, with the `XMLHttpRequest`
    object. With this object, a JavaScript can trade data with a Web server, without
    reloading the page.


    AJAX uses asynchronous data transfer (`HTTP` requests) between the browser and
    the Web server, allowing Web pages to request small bits of information from the
    server instead of whole pages.


    The AJAX technique makes Internet applications smaller, faster, and more user
    friendly.


    ## AJAX Is based on Internet standards


    AJAX is based on the following Web standards:

    * 8 JavaScript

    * 8 XML


    # 3 learn Javascript and AJAX with w3schools


    * 8 HTML

    * 8 CSS


    AJAX applications are browser- and platform-independent.


    ## AJAX Is About better Internet-Applications


    Internet applications have many benefits over desktop applications: They can reach
    a larger audience; they are easier to install and support; and they are easier
    to develop.


    However, Internet applications are not always as “rich” and user friendly as traditional
    desktop applications.


    With AJAX, Internet applications can be made richer and more user friendly.


    ## start using AJAX Today


    There is nothing new to learn. AJAX is based on existing standards. These standards
    have been used by developers for several years.


