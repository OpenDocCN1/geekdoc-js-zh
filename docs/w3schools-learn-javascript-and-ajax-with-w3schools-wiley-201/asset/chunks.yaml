  trans: "\n该函数将返回这两个参数的乘积。\n\n## 图 10.6\n### JavaScript 变量的生命周期\n\n如果你在函数内部声明一个变量，则该变量只能在该函数内部访问。当你退出函数时，该变量就会被销毁。这些变量被称为\
    \ `local variables`（局部变量）。你可以在不同函数中使用同名的局部变量，因为每个变量只会被其所在的函数识别。\n\n如果你在函数外部声明一个变量，页面上的所有函数都可以访问它。这些变量被称为\
    \ `global variables`（全局变量）。\n\n这些变量的生命周期始于声明时，结束于页面关闭时。\n\n## 第 11 章\n### JavaScript\
    \ 事件\n\n### 本章内容\n- `onLoad` 和 `onUnload`\n- `onFocus`, `onBlur`, 和 `onChange`\n\
    - `onSubmit`\n- `onMouseOver` 和 `onMouseOut`\n- `onClick`\n\n事件是 JavaScript 可以检测到的动作。\n\
    \n通过使用 JavaScript，我们能够创建动态 Web 页面。\n\nWeb 页面上的每个元素都有某些可以触发 JavaScript 的事件。例如，我们可以使用按钮元素的\
    \ `onClick` 事件来表示当用户点击按钮时将运行一个函数。我们在 HTML 标签中定义这些事件。\n\n事件示例：\n- 鼠标点击\n- Web 页面或图像加载\n\
    - 鼠标悬停在 Web 页面的热点上\n- 在 HTML 表单中选择输入字段\n- 提交 HTML 表单\n\n**注意**：事件通常与函数结合使用，函数在事件发生之前不会执行！\n\
    \n### onLoad 和 onUnload\n`onLoad` 和 `onUnload` 事件在用户进入或离开页面时触发。\n\n`onLoad` 事件通常用于检查访问者的浏览器类型和版本，并根据这些信息加载相应版本的\
    \ Web 页面。\n\n### 第 11 章：JavaScript 事件\n`onLoad` 和 `onUnload` 事件经常被用于处理用户进入或离开页面时应该设置的\
    \ cookie。例如，你可以在用户首次访问你的页面时弹出一个窗口询问其姓名。然后将姓名存储在 cookie 中。下次访问者再次到达你的页面时，你可以显示另一个弹出窗口，内容类似于：“欢迎，John\
    \ Doe！”\n\n### onFocus, onBlur, 和 onChange\n`onFocus`, `onBlur`, 和 `onChange`\
    \ 事件通常与表单字段的验证结合使用。\n\n`onFocus` 和 `onBlur` 事件是互补的，它们是由用户点击当前窗口、框架或表单元素之外，或者使用\
    \ `Tab` 键在字段或元素之间移动而引起的。当用户离开一个元素时，该元素会触发 `blur` 事件。当用户移动到一个新元素时，该元素会触发 `focus`\
    \ 事件。\n\n以下是使用 `onChange` 事件的示例。每当用户更改字段内容时，就会调用 `checkEmail()` 函数：\n\n```html\n\
    <input type=\"text\" size=\"30\" id=\"email\" onchange=\"checkEmail()\">\n```\n\
    \n### onSubmit\n`onSubmit` 事件可用于在提交表单之前验证表单字段。\n\n**提示**：由于程序员控制了在 `onSubmit`\
    \ 时执行的函数，因此可以根据需要验证任何、所有或不验证任何输入。\n\n以下是使用 `onSubmit` 事件的示例。当用户点击表单中的提交按钮时，将调用\
    \ `checkForm()` 函数。如果字段值不被接受，应该取消提交。`checkForm()` 函数返回 `true` 或 `false`。如果它返回\
    \ `true`，则表单将提交，否则提交将被取消：\n\n```html\n<form method=\"post\" action=\"xxx.htm\"\
    \ onsubmit=\"return checkForm()\">\n```\n\n### onMouseOver 和 onMouseOut\n`onMouseOver`\
    \ 和 `onMouseOut`经常用于创建悬停按钮（Rollover buttons）。\n\n以下是 `onMouseOver` 事件的示例。当检测到\
    \ `onMouseOver` 事件时，会弹警告框：\n\n```html\n<a href=\"http://www.w3schools.com\" onmouseover=\"\
    alert('An onMouseOver event');return false\">\n<img src=\"w3s.gif\" alt=\"w3schools\"\
    \ />\n</a>\n```\n\n### onClick\n当用户鼠标点击屏幕上的可见元素时，会发生 `onClick` 事件。以下示例可用于用户请求时翻译页面上的文本：\n\
    \n```html\n<input type=\"button\" name=\"language\" value=\"Click for Spanish\"\
    \ onclick=\"translate()\">\n```\n\n## 第 12 章\n### JavaScript\n### try…Catch 和\
    \ throw 语句\n\n### 本章内容\n- JavaScript——捕获错误\n- `try...catch` 语句\n- `throw` 语句\n\
    \n### JavaScript——捕获错误\n在浏览互联网上的 Web 页面时，我们都见过 JavaScript 警告框，告诉我们存在运行时错误并询问“你是否要调试？”这样的错误消息对开发者可能有用，但对用户则不然。当用户看到错误时，通常会离开\
    \ Web 页面。\n\n本章将教你如何捕获并处理 JavaScript 错误消息，以免流失你的观众。\n\n### try...catch 语句\n`try…catch`\
    \ 语句允许你捕获代码块执行期间发生的错误。`try` 块包含要运行的代码，`catch` 块包含发生错误时要执行的代码。\n\n语法如下：\n\n```javascript\n\
    try\n{\n    // 在此处运行某些代码\n}\ncatch(err)\n{\n}\n```\n\n**注意**：`try...catch` 是小写的。使用大写字母会产生\
    \ JavaScript 错误！\n\n以下示例在点击按钮时应该弹出“欢迎！”。然而，`message()` 函数中有一个拼写错误。`alert()` 被误写为\
    \ `adddlert()`。发生了 JavaScript 错误。`catch` 块捕获了错误并执行自定义代码来处理它。代码告知用户发生了什么。结果见图 12.1\
    \ 和 12.2。\n\n**尝试一下**：\n\n```html\n<html\n<head>\n<script type=\"text/javascript\"\
    >\nvar txt=\"\";\n\nfunction message()\n{\n    try\n    {\n        adddlert(\"\
    Welcome guest!\");\n    }\n    catch(err)\n    {\n        txt=\"此页面发生了错误。\\n\\\
    n\"; \n        txt+=\"错误消息：\" + err.message + \"\\n\\n\"; \n        txt+=\"点击确定继续。\\\
    n\\n\";\n        alert(txt);\n    }\n}\n</script>\n</head>\n```下一个示例使用 `confirm`\
    \ 框显示自定义消息，告诉用户可以点击继续或点击取消返回首页。如果 `confirm` 方法返回 `false`，用户点击了取消，代码将重定向用户。如果 `confirm`\
    \ 方法返回 `true`，代码则什么都不做。结果见图 12.3 和 12.4。\n\n**尝试一下**：\n\n```html\n<html\n<head>\n\
    <script type=\"text/javascript\">\nvar txt=\"\";\n\nfunction message()\n{\n  \
