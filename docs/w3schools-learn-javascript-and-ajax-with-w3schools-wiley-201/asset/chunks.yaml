    \ 服务器检索信息的占位符。\n\n当用户选择数据时，会执行一个名为 `showCustomer()` 的函数。函数的执行是由“onchange”事件触发的。换句话说，每当用户更改下拉框中的值时，函数\
    \ `showCustomer()`就会被调用。\n\n### AJAX JavaScript\n\n这是存储在 `selectcustomer.js` 文件中的\
    \ JavaScript 代码：\n\n```javascript\nvar xmlhttp\n\nfunction showCustomer(str)\n\
    {\n  xmlhttp=GetXmlHttpObject();\n  if (xmlhttp==null)\n  {\n    alert (\"Your\
    \ browser does not support AJAX!\"); return;\n  }\n  var url=\"getcustomer.asp\"\
    ;\n  url=url+\"?q=\"+str;\n  url=url+\"&sid=\"+Math.random();\n  xmlhttp.onreadystatechange=stateChanged;\n\
    \  xmlhttp.open(\"GET\",url,true);\n  xmlhttp.send(null);\n}\n\nfunction stateChanged()\n\
    {\n  if (xmlhttp.readyState==4)\n  {\n    document.getElementById(\"txtHint\"\
