    ## Chapter 1: JavaScript How To and Where To


    To insert a JavaScript into an HTML page, we use the `<script>` tag. Inside the
    `<script>` tag we use the `type` attribute to define the scripting language.


    So, `<script type="text/javascript">` and `</script>` tell where the JavaScript
    starts and ends:


    ```html

    <html>

    <body>

    <script type="text/javascript">

    ...

    </script>

    </body>

    </html>

    ```


    The `document.write` command is a standard JavaScript command for writing output
    to a page.


    When you type the `document.write` command between the `<script>` and `</script>`
    tags, the browser will recognize it as a JavaScript command and execute the code
    line. In this case, the browser writes Hello World! to the page:


    ```html

    <html>

    <body>

    <script type="text/javascript">

    document.write("Hello World!");

    </script>

    </body>

    </html>

    ```


    **NOTE** If we had not typed the `<script>` tag, the browser would have treated
    the `document.write(“Hello World!”)` command as pure text and would just write
    the entire line on the page, as shown in Figure 1.5.


    **Figure 1.5**


