    # Appendix B: HTML DOM Objects


    ## HTML Properties


    | property | description | W3c |

    | :--- | :--- | :--- |

    | `innerHTML` | Sets or returns the HTML contents (+text) of an element | Yes
    |

    | `lang` | Sets or returns the language code for an element | Yes |

    | `lastChild` | Returns the last child of an element | Yes |

    | `length` | Does not apply to all objects. See specific object type. | Yes |

    | `nextSibling` | Returns the element immediately following an element | Yes |

    | `nodeName` | Returns the tagname of an element (in uppercase) | Yes |

    | `nodeType` | Returns the type of the element | Yes |

    | `nodeValue` | Returns the value of the element | Yes |

    | `offsetHeight` | Returns the height of an element, including borders and padding
    if any, but not margins | No |

    | `offsetLeft` | Returns the horizontal offset position of the current element
    relative to its offset container | Yes |

    | `offsetParent` | Returns the offset container of an element | Yes |

    | `offsetTop` | Returns the vertical offset position of the current element relative
    to its offset container | Yes |

    | `offsetWidth` | Returns the width of an element, including borders and padding
    if any, but not margins | No |

    | `ownerDocument` | Returns the root element (document object) for an element
    | Yes |

    | `parentNode` | Returns the parent node of an element | Yes |

    | `previousSibling` | Returns the element immediately before an element | Yes
    |

    | `scrollHeight` | Returns the entire height of an element (including areas hidden
    with scrollbars) | Yes |

    | `scrollLeft` | Returns the distance between the actual left edge of an element
    and its left edge currently in view | Yes |

    | `scrollTop` | Returns the distance between the actual top edge of an element
    and its top edge currently in view | Yes |

    | `scrollWidth` | Returns the entire width of an element (including areas hidden
    with scrollbars) | Yes |

    | `style` | Sets or returns the style attribute of an element | Yes |

    | `tabIndex` | Sets or returns the tab order of an element | Yes |

    | `tagName` | Returns the tagname of an element as a string (in uppercase) | Yes
    |

    | `title` | Sets or returns the title attribute of an element | Yes |

    | `width` | Sets or returns the width attribute of an element | Yes |


    ## element Object Methods


    | Method | description | W3c |

    | :--- | :--- | :--- |

    | `appendChild()` | Adds a new child element to the end of the list of children
    of the element | Yes |

    | `blur()` | Removes focus from an element | Yes |

    | `click()` | Executes a click on an element | Yes |

    | `cloneNode()` | Clones an element | Yes |

    | `focus()` | Gives focus to an element | Yes |

    | `getAttribute()` | Returns the value of an attribute | Yes |

    | `getElementsByTagName()` | Accesses all elements with a specified tagname |
    Yes |

    | `hasChildNodes()` | Returns whether an element has any child elements | Yes
    |

    | `insertBefore()` | Inserts a new child element before an existing child | Yes
    |

    | `item()` | Returns an element based on its index within the document tree |
    Yes |

    | `normalize()` | Puts all text nodes underneath this element (including attributes)
    into a “normal” form where only structure (for example, elements, comments, processing
    instructions, CDATA sections, and entity references) separates Text nodes, that
    is, there are neither adjacent Text nodes nor empty Text nodes | Yes |

    | `removeAttribute()` | Removes a specified attribute from an element | Yes |

    | `removeChild()` | Removes a child element | Yes |

    | `replaceChild()` | Replaces a child element | Yes |

    | `setAttribute()` | Adds a new attribute to an element | Yes |

    | `toString()` | Converts an element to a string | Yes |


    ## element Object events


    | event | description | W3c |

    | :--- | :--- | :--- |

    | `onblur` | When an element loses focus | Yes |

    | `onclick` | When a mouse clicks on an element | Yes |

    | `ondblclick` | When a mouse double-clicks on an element | Yes |

    | `onfocus` | When an element gets focus | Yes |

    | `onkeydown` | When a keyboard key is pressed | Yes |

    | `onkeypress` | When a keyboard key is pressed or held down | Yes |

    | `onkeyup` | When a keyboard key is released | Yes |

    | `onmousedown` | When a mouse button is pressed | Yes |

    | `onmousemove` | When the mouse is moved | Yes |

    | `onmouseout` | When the mouse cursor leaves an element | Yes |

    | `onmouseover` | When the mouse cursor enters an element | Yes |

    | `onmouseup` | When a mouse button is released | Yes |

    | `onresize` | When an element is resized | Yes |


    ## Anchor Object


    The Anchor object represents an HTML hyperlink. For each `<a>` tag in an HTML
    document, an `Anchor` object is created. An anchor allows you to create a link
    to another document (with the `href` attribute) or to a different point in the
    same document (with the `name` attribute). You can access an anchor by using `getElementById()`
    or by searching through the `anchors[]` array of the `Document` object.


    ### Anchor Object properties


    | property | description | W3c |

    | :--- | :--- | :--- |

    | `charset` | Sets or returns the value of the charset attribute of a link | Yes
    |

    | `href` | Sets or returns the value of the href attribute of a link | Yes |

    | `hreflang` | Sets or returns the value of the hreflang attribute of a link |
    Yes |

    | `name` | Sets or returns the value of the name attribute of a link | Yes |

    | `rel` | Sets or returns the value of the rel attribute of a link | Yes |

    | `rev` | Sets or returns the value of the rev attribute of a link | Yes |

    | `target` | Sets or returns the value of the target attribute of a link | Yes
    |

    | `type` | Sets or returns the value of the type attribute of a link | Yes |


    The Anchor object also supports the standard properties, methods, and events.


    ## Area Object


    The Area object represents an area inside an image map (an image map is an image
    with clickable areas). For each `<area>` tag in an HTML document, an `Area` object
    is created.


    ### Area Object properties


    | property | description | W3c |

    | :--- | :--- | :--- |

    | `alt` | Sets or returns the value of the alt attribute of an area | Yes |

    | `coords` | Sets or returns the value of the coords attribute of an area | Yes
    |

    | `hash` | Sets or returns the anchor part of the href attribute | Yes |

    | `host` | Sets or returns the hostname:port part of the href attribute | Yes
    |

    | `hostname` | Sets or returns the hostname part of the href attribute | Yes |

    | `href` | Sets or returns the value of the href attribute of an area | Yes |

    | `noHref` | Sets or returns the value of the nohref attribute of an area | Yes
    |

    | `pathname` | Sets or returns the pathname part of the href attribute | Yes |

    | `port` | Sets or returns the port part of the href attribute | Yes |

    | `protocol` | Sets or returns the protocol part of the href attribute | Yes |

    | `search` | Sets or returns the querystring part of the href attribute | Yes
    |

    | `shape` | Sets or returns the value of the shape attribute of an area | Yes
    |

    | `target` | Sets or returns the value of the target attribute of an area | Yes
    |


    The Area object also supports the standard properties, methods, and events.


    ## Base Object


    The Base object represents an HTML base element. The base element is used to specify
    a default address or a default target for all links on a page.


    ### Base Object properties


    | property | description | W3c |

    | :--- | :--- | :--- |

    | `href` | Sets or returns the value of the href attribute in a base element |
    Yes |

    | `target` | Sets or returns the value of the target attribute in a base element
    | Yes |


    The Base object also supports the standard properties, methods, and events.


    ## Body Object


    The Body object represents the HTML body element. The Body element defines a document’s
    body. The Body element contains all the contents of an HTML document, such as
    text, hyperlinks, images, tables, lists, and so on.


    ### Body Object properties


    | property | description | W3c |

    | :--- | :--- | :--- |

    | `alink` | Sets or returns the value of the alink attribute of the body element
    | Yes |

    | `background` | Sets or returns the value of the background attribute of the
    body | Yes |

    | `bgColor` | Sets or returns the value of the bgColor attribute of the body |
    Yes |

