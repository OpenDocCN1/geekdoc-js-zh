    JavaScript is a sequence of statements to be executed by the browser. Unlike HTML,
    JavaScript is case-sensitive; therefore, watch your capitalization closely when
    you write JavaScript statements and create or call variables, objects, and functions.


    ### JavaScript Statements


    A JavaScript statement is a command to a browser. The purpose of the command is
    to tell the browser what to do.


    The following JavaScript statement tells the browser to write “Hello Dolly” to
    the Web page:


    ```javascript

    document.write("Hello Dolly");

    ```


    It is normal to add a semicolon at the end of each executable statement. Most
    people think this is a good programming practice, and most often you will see
    this in JavaScript examples on the Web.


    The semicolon is optional (according to the JavaScript standard), and the browser
    is supposed to interpret the end of the line as the end of the statement. You
    often will see examples without the semicolon at the end.


    ## 16


    ![Image 9](index-28_1.png)


    ## Chapter 2: JavaScript Statements and Comments **n o t e** Using semicolons
    makes it possible to write multiple statements on one line, although good programming
    practice encourages placing only one statement per line.


    ### JavaScript Code


    JavaScript code (or just JavaScript) is a sequence of JavaScript statements. Each
    statement is executed by the browser in the sequence it is written.


    This example will write a heading and two paragraphs to a Web page as shown in
    Figure 2.1.


    **Try it yourself >>**


    ```html

    <html>

    <body>

    <script type="text/javascript"> document.write("<h1>This is a heading</h1>");
    document.write("<p>This is a paragraph.</p>"); document.write("<p>This is another
    paragraph.</p>");

    </script>

    </body>

    </html>

    ```


    **Figure 2.1**


    ### JavaScript Blocks


    JavaScript statements can be grouped together in blocks. Blocks start with a left
    curly bracket `{` and end with a right curly bracket `}`.


    The purpose of a block is to make the sequence of statements execute together.


    The following example writes a heading and two paragraphs to a Web page as shown
    in Figure 2.1.


    ## 17


    ![Image 10](index-29_1.png)


    ## Learn JavaScript and ajax with w3schools


    ```html

    <html>

    <body>

    <script type="text/javascript"> {

    document.write("<h1>This is a heading</h1>"); document.write("<p>This is a paragraph.</p>");
    document.write("<p>This is another paragraph.</p>");

    }

    </script>

    </body>

    </html>

    ```


    **Figure 2.2**


    The preceding example is not useful. It just demonstrates the use of a block.
    Normally, a block is used to group statements together.


    ### JavaScript Comments


    JavaScript comments can be added to explain the JavaScript or to make the code
    more readable.


    Single line comments start with `//`.


    The following example uses single-line comments to explain the code.


