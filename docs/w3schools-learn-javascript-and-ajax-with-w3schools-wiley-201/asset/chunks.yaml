    The Math object allows you to perform mathematical tasks.


    **Math Object**


    The Math object allows you to perform mathematical tasks.


    The Math object includes several mathematical constants and methods.


    The syntax for using properties/methods of Math is as follows: var pi_value=Math.PI;


    var sqrt_value=Math.sqrt(16);


    **N O t e** The Math object is provided by JavaScript and does not need to be
    created by the programmer. In fact, trying to create a Math object using new()
    will result in a JavaScript error.


    **Mathematical Constants**


    JavaScript provides eight mathematical constants that can be accessed from the
    Math object. These are E, PI, square root of 2, square root of 1/2, natural log
    of 2, natural log of 10, base-2 log of E, and base-10 log of E.


    You may reference these constants from your JavaScript like this: **110**


    **Chapter 19: JavaScript Math Object** Math.E


    Math.PI


    Math.SQRT2


    Math.SQRT1_2


    Math.LN2


    Math.LN10


    Math.LOG2E


    Math.LOG10E


    **Mathematical Methods**


    In addition to the mathematical constants that can be accessed from the Math object,
    several methods also are available.


    The following example uses the round() method of the Math object to round a number
    to the nearest integer:


    document.write(Math.round(4.7));


    The preceding code results in the following output: 5


    The following example uses the random() method of the Math object to return a
    random number between 0 and 1:


    document.write(Math.random());


    The preceding code can result in the following output: 0.07730209357983464


    The following example uses the floor() and random() methods of the Math object
    to return a random number between 0 and 10: document.write(Math.floor(Math.random()*11));


    The preceding code can result in the following output: 1


    For a complete reference of all the properties and methods that can be used with
    the Math object, go to the complete Math object reference in Appendix A.


