    # the `clearTimeout()` method


    The syntax is as follows:


    ```javascript

    clearTimeout(setTimeout_variable)

    ```


    The following example is the same as the previous infinite loop example. The only
    difference is that we have now added a "Stop!" button that calls `clearTimeout()`.
    Your results are shown in Figure 26.5.


    **Try it yourself >>**


    ```html

    <html>

    <head>

    <script type="text/javascript"> var c=0;

    var t;

    var timer_is_on=0;

    function timedCount()

    {

    document.getElementById(''txt'').value=c;

    c=c+1;

    t=setTimeout("timedCount()",1000);

    }

    function doTimer()

    {

    if (!timer_is_on)

    {

    timer_is_on=1;

    timedCount();

    }

    }

    function stopTimer()

    {

    clearTimeout(t);

    timer_is_on=0;

    }

    </script>

    </head>

    <body>

    <form>

    <input type="button" value="Start count!"

    onClick="doTimer()">

    <input type="button" value="Stop count!"

    onClick="stopTimer()">

    <input type="text" id="txt">

    </form>

    <p>Click on the button above. The input field will count forever, starting at
    0, until you click Stop count.</p>

    </body>

    </html>

    ```


