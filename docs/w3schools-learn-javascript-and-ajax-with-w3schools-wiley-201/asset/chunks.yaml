  trans: "\n\n# 创建对象的模板\n\n模板定义了对象的结构，以便你更轻松地创建该对象的多个实例：\n\n```javascript\nfunction\
    \ person(firstname,lastname,age,eyecolor)\n{\n  this.firstname=firstname;\n  this.lastname=lastname;\n\
    \  this.age=age;\n  this.eyecolor=eyecolor;\n}\n```\n\n注意，模板仅仅是一个函数。\n\n它也被称为构造函数（构造函数）。在构造函数内部，你添加了属于每个后续实例的属性和方法。当你使用\
    \ `person` 作为多个对象的构造函数时，必须包含 `this` 关键字。JavaScript 使用 `this` 将属性赋值给使用 `new` 关键字创建的特定对象。\n\
    \n在下面的示例中，你为一个对象创建了一个模板。结果如图 27.2 所示。\n\n**自己尝试一下 >>**\n\n```html\n<html>\n<body>\n\
    <script type=\"text/javascript\"> \nfunction person(firstname,lastname,age,eyecolor)\n\
    {\n  this.firstname=firstname;\n  this.lastname=lastname;\n  this.age=age;\n \
    \ this.eyecolor=eyecolor;\n}\nmyFather=new person(\"John\",\"Doe\",50,\"blue\"\
    ); \ndocument.write(myFather.firstname + \" is \" + myFather.age + \" years old.\"\
    );\n</script>\n</body>\n</html>\n```\n\n## 第 27 章：使用 javascript 创建你自己的对象\n\n获取模板后，你可以像这样创建对象的新新实例：`myFather=new\
    \ person(\"John\",\"Doe\",50,\"blue\");` `myMother=new person(\"Sally\",\"Rally\"\
    ,48,\"green\");`。你也可以给 person 对象添加一些方法。这在模板内部同样完成：\n\n```javascript\nfunction\
    \ person(firstname,lastname,age,eyecolor)\n{\n  this.firstname=firstname;\n  this.lastname=lastname;\n\
    \  this.age=age;\n  this.eyecolor=eyecolor;\n  this.newlastname=newlastname;\n\
    }\n```\n\n注意，方法只是附加到对象上的函数。然后你必须编写 `newlastname()` 函数：\n\n```javascript\nfunction\
    \ newlastname(new_lastname)\n{\n  this.lastname=new_lastname;\n}\n```\n\n`newlastname()`\
    \ 函数定义了人的姓并将其赋值给该人。JavaScript 通过 `this` 知道你指的是哪个人。所以，现在你可以写：`myMother.newlastname(\"\
    Doe\")`。\n\n## 第四部分：AJAX 基础\n\n要使用传统的 JavaScript 从数据库或服务器文件获取或发送信息，你必须创建一个 HTML\
    \ 表单。用户必须点击按钮来发送/获取信息并等待服务器响应。然后将加载一个显示结果的新页面。传统的应用程序运行缓慢，且往往不够用户友好。\n\n通过 AJAX，你的\
    \ JavaScript 通过 `XMLHttpRequest` 对象直接与服务器通信。通过 `XMLHttpRequest` 对象，Web 页面向 Web\
    \ 服务器发送请求并获取响应——而无需重新加载页面。用户将留在同一个页面，他们不会注意到脚本在后台请求页面或向服务器发送数据。通过使用 `XMLHttpRequest`\
    \ 对象，Web 可以在页面加载后使用来自服务器的数据更新页面！\n\n## 第 29 章：AJAX 浏览器支持\n\n### 本章内容\n- `XMLHttpRequest`\n\
    - 汇总总结\n\nAJAX 的核心是 `XMLHttpRequest` 对象。所有现代浏览器都支持新的内置 JavaScript `XMLHttpRequest`\
    \ 对象（IE5 和 IE6 使用 `ActiveObject`）。`XMLHttpRequest` 对象可用于从服务器请求信息（数据）。让我们在 HTML\
    \ 文件的 `head` 部分用 JavaScript 更新我们的文件：\n\n```javascript\nfunction loadXMLDoc(url)\n\
    {\n  if (window.XMLHttpRequest) {\n    // 适用于 IE7+, Firefox, Opera, Safari 代码\n\
    \    xmlhttp=new XMLHttpRequest();\n  }\n  else {\n    // 适用于 IE6, IE5 代码\n  \
    \  xmlhttp=new ActiveXObject(\"Microsoft.XMLHTTP\");\n  }\n  xmlhttp.open(\"GET\"\
    ,url,false);\n  xmlhttp.send(null);\n  document.getElementById('test').innerHTML=xmlhttp.responseText;\n\
    }\n```\n\n尝试创建一个 `XMLHttpRequest` 对象：`xmlhttp=new XMLHttpRequest()`\n\n如果没有（如果是\
    \ IE5 或 IE6），创建一个 `ActiveObject`：`xmlhttp=new ActiveXObject(\"Microsoft.XMLHTTP\"\
    )`\n\n打开请求对象：`xmlhttp.open(\"GET\",url,false)`\n\n将请求发送到服务器：`xmlhttp.send(null)`\n\
    \n使用服务器的响应更新页面：`document.getElementById('test').innerHTML=xmlhttp.responseText`\n\
    \n**注意** 上述代码可以在每次需要创建 `XMLHttpRequest` 对象时使用，因此每当需要时直接复制粘贴即可。\n\n"
- fmt: "\nIn Chapter 30, “AJAX—the XMLHttpRequest Object”, you learn more about the\
    \ `XMLHttpRequest`.\n\n### All together Now\nThe following example puts what you’ve\
    \ learned all together. Your results are shown in Figure 29.1.\n\n#### Try it\
    \ yourself >>\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\">\n\
    function loadXMLDoc(url)\n{\n  if (window.XMLHttpRequest) {\n    // code for IE7+,\
    \ Firefox, Chrome, Opera, Safari\n    xmlhttp=new XMLHttpRequest();\n  }\n  else\
    \ {\n    // code for IE6, IE5\n    xmlhttp=new ActiveXObject(\"Microsoft.XMLHTTP\"\
    );\n  }\n  xmlhttp.open(\"GET\",url,false);\n  xmlhttp.send(null);\n  document.getElementById('test').innerHTML=xmlhttp.responseText;\n\
    }\n</script>\n</head>\n<body>\n<div id=\"test\">\n  <h2>Click to let AJAX change\
    \ this text</h2>\n</div>\n<button type=\"button\" onclick=\"loadXMLDoc('test1.txt')\"\
    >Click Me</button>\n<button type=\"button\" onclick=\"loadXMLDoc('test2.txt')\"\
    >Click Me</button>\n</body>\n</html>\n```\n\n**Figure 29.1**\n\n### Chapter 30:\
    \ AJAX—the XMLHttpRequest Object’s Methods and Properties in this Chapter\n- Important\
    \ Methods\n- Sending an AJAX Request to a Server\n- Important Properties\n- The\
    \ `responseText` Property\n- `XMLHttpRequest` Open—Using False\n- `XMLHttpRequest`\
    \ Open—Using True\n- The `readyState` Property\n- The `onreadystatechange` Property\n\
    \nIn this chapter, you learn about important methods and properties of the `HttpRequest`\
    \ object.\n\n#### Important Methods\nThe `XMLHttpRequest` object has two important\
    \ methods: \n1. The `open()` method \n2. The `send()` method\n\n#### Sending an\
    \ AJAX request to a server\nTo send a request to a Web server, use the `open()`\
    \ and `send()` methods. The `open()` method takes three arguments. The first argument\
    \ defines which method to use (`GET` or `POST`). The second argument specifies\
    \ the name of the server resource (`URL`). The third argument specifies if the\
    \ request should be handled asynchronously.\n\nThe `send()` method sends the request\
    \ off to the server. If we assume the file requested is called `time.asp`, the\
    \ code would be: `url=\"time.asp\"`\n\n```\nxmlhttp.open(\"GET\",url,true);\n\
    xmlhttp.send(null);\n```\nIn the example, we assume that the current Web page\
    \ and the requested resource are both in the same file directory.\n\n#### Important\
    \ properties\nThe `XMLHttpRequest` object has three important properties:\n1.\
    \ The `responseText` property\n2. The `readyState` property\n3. The `onreadystatechange`\
    \ property\n\n#### The responseText property\nThe `XMLHttpRequest` object stores\
    \ any data retrieved from a server as a result of a server request in its `responseText`\
    \ property. In the previous chapter, you copied the content of the `responseText`\
    \ property into your HTML with the following statement:\n\n```javascript\ndocument.getElementById('test').innerHTML=xmlhttp.responseText\n\
    ```\n\n#### XMLHttpRequest Open—using False\nIn the previous examples, we used\
    \ this simplified syntax:\n```javascript\nxmlhttp.open(\"GET\",url,false);\nxmlhttp.send(null);\n\
    document.getElementById('test').innerHTML=xmlhttp.responseText;\n```\nThe third\
    \ parameter in the `open` call is “false”. This tells the `XMLHttpRequest` object\
    \ to wait until the server request is completed before next statement is executed.\
    \ For small applications and simple server requests, this might be OK. But if\
    \ the request takes a long time or cannot be served, this might cause your Web\
    \ application to hang or stop.\n\n#### XMLHttpRequest Open—using true\nBy changing\
    \ the third parameter in the `open` call to “true”, you tell the `XMLHttpRequest`\
    \ object to continue the execution after the request to the server has been sent.\
    \ Because you cannot simply start using the response from the server request before\
    \ you are sure the request has been completed, you need to set the `onreadystatechange`\
    \ property of the `XMLHttpRequest`, to a function (or name of a function) to be\
    \ executed after completion. In this `onreadystatechange` function, you must test\
    \ the `readyState` property before you can use the result of the server call.\
    \ Simply change the code to:\n\n```javascript\nxmlhttp.onreadystatechange=function()\n\
    {\n  if(xmlhttp.readyState==4) { // request is complete\n    document.getElementById('test').innerHTML=xmlhttp.responseText;\n\
    \  }\n}\nxmlhttp.open(\"GET\",url,true);\nxmlhttp.send(null);\n```\n\n#### The\
    \ readyState property\nThe `readyState` property holds the status of the server’s\
    \ response. Possible values for the `readyState` property are shown in the following\
    \ table:\n\n| state | description |\n| :--- | :--- |\n| 0 | The request is not\
    \ initialized |\n| 1 | The request has been set up |\n| 2 | The request has been\
    \ sent |\n| 3 | The request is in process |\n| 4 | The request is complete |\n\
    \n#### The onreadystatechange property\nThe `onreadystatechange` property stores\
    \ a function (or the name of a function) to be called automatically each time\
    \ the `readyState` property changes. You can define the entire function in the\
    \ property like this:\n\n```javascript\nxmlhttp.onreadystatechange=function()\n\
    {\n  if(xmlhttp.readyState==4) {\n    document.getElementById('test').innerHTML=xmlhttp.responseText;\n\
    \  }\n}\nxmlhttp.open(\"GET\",url,true);\nxmlhttp.send(null);\n```\nOr you can\
    \ simply store the name of a function that is defined elsewhere, like this:\n\n\
    ```javascript\nxmlhttp.onreadystatechange=stateChanged;\n```\n\n```javascript\n\
    function stateChanged() {\n  if(xmlhttp.readyState==4) {\n    document.getElementById('test').innerHTML=xmlhttp.responseText;\n\
    \  }\n}\n```\n"
