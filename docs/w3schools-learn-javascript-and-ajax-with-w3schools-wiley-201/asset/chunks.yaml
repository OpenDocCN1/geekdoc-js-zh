    ## Chapter 27: Create your own objects


    # JavaScript Objects


    Objects are useful to organize information. An object is just a special kind of
    data, a collection of properties and methods. Earlier in this book, you learned
    that JavaScript has several built-in objects like `String`, `Date`, `Array`, and
    more. In addition to these built-in objects, you also can create your own. Let’s
    illustrate with an example and create an object that models a person. Properties
    are the values associated with the object. The person’s properties include name,
    weight, age, skin color, and so on. Objects have methods. Methods are the actions
    that can be performed on objects. The person’s methods could be `eat()`, `sleep()`,
    `play()`, and so on.


    ## properties


    The syntax for accessing a property of an object is as follows: `objName.propName`


    Adding properties


    You can add a property to an object by simply giving it a value. Assume that the
    `personObj` exists; you can give it properties named `firstname`, `lastname`,
    `age`, and `eyolor` as follows:


    ```javascript

    personObj.firstname="John";

    personObj.lastname="Doe";

    personObj.age=30;

    personObj.eyolor="blue";

    ```


    ## Methods


    An object also can contain methods. You can call a method with the following syntax:
    `objName.methodName()`


    Parameters required for the method can be passed between the parentheses. To call
    a method called `sleep()` for the `personObj`: `personObj.sleep()`


    If the `sleep()` method accepts a parameter for the number of hours, it could
    be called like this: `personObj.sleep(8)`


    ## Creating your own objects


    There are two ways to create a new object: You can create a direct instance of
    an object, or you can create a template of an object.


    ### Create a Direct instance of an object


    The following code creates an instance of an object and adds four properties to
    it:


    ```javascript

    personObj=new Object();

    personObj.firstname="John";

    personObj.lastname="Doe";

    personObj.age=50;

    personObj.eyolor="blue";

    ```


    ## 152


    ![Image 99](index-164_1.png)


    ## Chapter 27: Create your own objects with javascript


