    create Boolean objects with an initial value of true:


    var myBoolean=new Boolean(true);


    var myBoolean=new Boolean("true");


    var myBoolean=new Boolean("false");


    var myBoolean=new Boolean("Richard"); For a complete reference of all the properties
    and methods that can be used with the Boolean object, go to the complete Boolean
    object reference in Appendix A.


