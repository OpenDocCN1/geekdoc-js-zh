    \nThe following function checks whether the content follows the general syntax\
    \ of an e-mail address.\n\n**note** This function only checks that the content\
    \ appears to be an e-mail with the proper format. It does not verify that the\
    \ e-mail address actually exists.\n\nThis means that the input data must contain\
    \ at least an `@` and a dot (`.`). Also, the `@` must not be the first character\
    \ of the e-mail address, and the last dot must at least be one character after\
    \ the `@` sign:\n\n```javascript\nfunction validate_email(field,alerttxt)\n{\n\
    \  with (field)\n  {\n    apos=value.indexOf(\"@\");\n    dotpos=value.lastIndexOf(\"\
    .\");\n    if (apos<1||dotpos-apos<2)\n    {\n      alert(alerttxt);\n      return\
    \ false;\n    }\n    else {\n      return true;\n    }\n  }\n}\n```\n\nThe entire\
    \ script with the HTML form could look something like this:\n\n```html\n<html>\n\
    <head>\n<script type=\"text/javascript\">\nfunction validate_email(field,alerttxt)\n\
    {\n// **136**\n// Chapter 23: JavaScript Form validation\n  with (field)\n  {\n\
    \    apos=value.indexOf(\"@\");\n    dotpos=value.lastIndexOf(\".\");\n    if\
    \ (apos<1||dotpos-apos<2)\n    {\n      alert(alerttxt);\n      return false;\n\
    \    }\n    else {\n      return true;\n    }\n  }\n}\n\nfunction validate_form(thisform)\n\
    {\n  with (thisform)\n  {\n    if (validate_email(email,\"Not a valid e-mail address!\"\
    )==false)\n    {\n      email.focus();\n      return false;\n    }\n  }\n}\n</script>\n\
    </head>\n<body>\n<form action=\"submit.htm\" onsubmit=\"return validate_form(this);\"\
    \ method=\"get\">\nEmail: <input type=\"text\" name=\"email\" size=\"30\">\n<input\
    \ type=\"submit\" value=\"Submit\">\n</form>\n</body>\n</html>\n```\n\n**137**\n\
    \n**Chapter 24**\n\n**JavaSCript**\n\n**animation**\n\n**in this Chapter**\n\n\
    - The HTML Code\n- The JavaScript Code\n- The Entire Code\n\nWith JavaScript,\
    \ we can create animated images.\n\nThe trick is to let a JavaScript change between\
    \ different images on different events.\n\nIn the following example, we add an\
    \ image that should act as a link button on a Web page. We then add an `onMouseOver`\
    \ event and an `onMouseOut` event that will run two JavaScript functions that\
    \ change between the images.\n\n### the htmL Code\n\nThe HTML code looks like\
    \ this:\n\n```html\n<a href=\"http://www.w3schools.com\" target=\"_blank\">\n\
    \  <img border=\"0\" alt=\"Visit w3schools!\" src=\"b_pink.gif\" id=\"b1\" onmouseOver=\"\
    mouseOver()\" onmouseOut=\"mouseOut()\" />\n</a>\n```\nNote that we have given\
    \ the image an `id`, to make it possible for JavaScript to address it later.\n\
    \nThe `onMouseOver` event tells the browser that once a mouse is rolled over the\
    \ image, the browser should execute a function that replaces the image with another\
    \ image.\n\nThe `onMouseOut` event tells the browser that once a mouse is rolled\
    \ away from the image, another JavaScript function should be executed. This function\
    \ inserts the original image again.\n\n### Chapter24: JavaScript animation ###\
    \ the JavaScript Code\n\nThe changing between the images is done with the following\
    \ JavaScript:\n\n```javascript\n<script type=\"text/javascript\"> \nfunction mouseOver()\n\
    {\n  document.getElementById(\"b1\").src =\"b_blue.gif\";\n}\n\nfunction mouseOut()\n\
    {\n  document.getElementById(\"b1\").src =\"b_pink.gif\";\n}\n</script>\n```\n\
    \nThe function `mouseOver()` causes the image to shift to `b_blue.gif`.\n\nThe\
    \ function `fadeOut()` causes the image to shift to `b_pink.gif`.\n\n### the entire\
    \ Code\n\nIn the following example, we combine the HTML and JavaScript code to\
    \ produce animation.\n\nThe resulting animation is shown in Figure 24.1.\n\nYou\
    \ can try this example on the `www.w3schools.com` Web site or include you own\
    \ graphic files in the directory with your html source, substituting for `b_blue`\
    \ and `b_pink` in the html source code.\n\n**Try it yourself >>**\n\n```html\n\
    <html>\n<head>\n<script type=\"text/javascript\"> \nfunction mouseOver()\n{\n\
