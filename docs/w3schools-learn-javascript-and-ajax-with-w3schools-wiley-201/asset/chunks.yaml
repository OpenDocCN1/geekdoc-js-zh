    \n# 第 15 章：JavaScript String 对象\n\n#### 图 15.6\n有关所有可用于 `String` 对象使用的属性和方法的完整参考，请参阅附录\
    \ A 中的 `String` 对象参考。\n\n该参考包含每个属性和方法的简要描述和用法示例！\n\n87\n\n# 第 16 章\n## JavaScript\
    \ Date 对象\n\n### 本章内容\n- 创建 Date 对象\n- 设置日期\n- 比较两个日期\n- 示例\n\n`Date` 对象用于处理日期和时间。\n\
    \n### 创建 Date 对象\n`Date` 对象用于处理日期和时间。\n\n`Date` 对象是通过 `Date()` 构造函数创建的。\n\n实例化日期有四方法：\n\
    - `new Date()` // 当前日期和时间\n- `new Date(milliseconds)` // 自 1970/01/01 以来的毫秒数\n\
    - `new Date(dateString)`\n- `new Date(year, month, day, hours, minutes, seconds,\
    \ milliseconds)`\n\n上述大部分参数都是可选的。\n\n当未指定参数时，默认向该方法传递 0。\n\n创建 `Date` 对象后，有许多方法允许你对其进行操作。\n\
    \n大多数方法允许你获取和设置对象的年、月、日、小时、分、秒和毫秒，可以使用本地时间或 UTC（通用时间或 GMT）时间。\n\n88 # 第 16 章：JavaScript\
    \ Date 对象\n所有日期都是从 1970 年 1 月 1 日 00:00:00 通用时间 (UTC) 开始以毫秒计算的，一天包含 86,400,000\
    \ 毫秒。\n\n实例化日期的一些示例：\n```javascript\ntoday = new Date()\nd1 = new Date(\"October\
    \ 13, 1975 11:13:00\")\nd2 = new Date(79,5,24)\nd3 = new Date(79,5,24,11,33,0)\n\
    ```\n\n有关所有可用于 `Date` 对象使用的属性和方法的完整参考，请参阅附录 A 中完整的 `Date` 对象参考。\n\n该参考包含每个属性和方法的简要描述和使用示例！\n\
    \n### 设置日期\n我们可以使用 `Date` 对象提供的方法来轻松地操作日期。\n\n在下面的示例中，我们将 `Date` 对象设置为特定日期（2010\
    \ 年 1 月 14 日）：\n```javascript\nvar myDate=new Date();\nmyDate.setFullYear(2010,0,14);\n\
    ```\n\n在下面的示例中，我们将 `Date` 对象设置为未来的五天：\n```javascript\nvar myDate=new Date();\n\
    myDate.setDate(5);\n```\n对日期增加月份或年份是由 `Date` 对象自动处理的。\n\n### 比较日期\n`Date` 对象也用于比较日期。下面的示例比较两个日期：\n\
    ```javascript\nvar d1=new Date();\nd1.setFullYear(2010,0,14);\nvar d2=new Date();\n\
    d2.setFullYear(2010,0,15);\n\nif (d1<d2) {\n    alert(\"today is before tomorrow\"\
    );\n} else {\n    alert(\"today is after tomorrow\");\n}\n```\n\n### 示例\n下面的示例演示了如何使用\
    \ `getTime()` 方法获取日期的毫秒数。你的结果显示在图 16.1。\n\n**自己尝试一下 >>**\n\n```javascript\ntoday\
    \ = new Date();\ndocument.write(today.getTime());\n```\n\n#### 图 16.1\n下面的示例演示了如何使用\
    \ `UTCString()` 将今天的日期（根据 UTC）转换为字符串。你的结果显示在图 16.2。\n\n**自己尝试一下 >>**\n\n```html\n\
    <html>\n\n<body>\n\n<script type=\"text/javascript\"> var d=new Date();\n\ndocument.write(\"\
    原始格式: \");\n\ndocument.write(d + \"<br />\");\n\ndocument.write(\"通用时间格式: \");\n\
    \ndocument.write(d.UTCString());\n\n</script>\n\n</body>\n</html>\n```\n\n####\
    \ 图 16.2\n### 星期几\n`getDay()` 方法返回星期几的数字，其中星期日为 0。下面的示例演示了如何使用 `getDay()` 和数组以文本字符串而不是数字显示星期几，其结果显示在图\
    \ 16.3。\n\n**自己尝试一下 >>**\n\n```html\n<html>\n\n<body>\n\n<script type=\"text/javascript\"\
    > var d=new Date();\n\nvar weekday=new Array(7);\n\nweekday[0]=\"Sunday\";\nweekday[1]=\"\
    Monday\";\nweekday[2]=\"Tuesday\";\nweekday[3]=\"Wednesday\";\nweekday[4]=\"Thursday\"\
    ;\nweekday[5]=\"Friday\";\nweekday[6]=\"Saturday\";\n\ndocument.write(\"今天是 \"\
    \ + weekday[d.getDay()]);\n\n</script>\n\n</body>\n</html>\n```\n\n#### 图 16.3\n\
    下面的示例演示了如何如何在你的网页上显示一个时钟。你的结果显示在图 16.4。\n\n**自己尝试一下 >>**\n\n```html\n<html>\n\n\
    <head>\n\n<script type=\"text/javascript\">\nfunction startTime()\n{\nvar today=new\
    \ Date();\nvar h=today.getHours();\nvar m=today.getMinutes();\nvar s=today.getSeconds();\n\
    // 在小于 10 的数字前加一个零\nm=checkTime(m);\ns=checkTime(s);\ndocument.getElementById('txt').innerHTML=h+\"\
    :\":m+\":\":s; t=setTimeout('startTime()',500);\n}\n\nfunction checkTime(i)\n\
    {\nif (i<10)\n{\ni=\"0\" + i;\n}\nreturn i;\n}\n</script>\n\n</head>\n\n<body\
    \ onload=\"startTime()\">\n\n<div id=\"txt\"></div>\n\n</body>\n</html>\n```\n\
    \n#### 图 16.4\n90 ![Image 54](img/index-102_1)\n![Image 55](img/index-102_2)\n\
    \n# JavaScript Date 对象\n91 ![Image 56](img/index-103_1)\n\n### 通过 w3schools 学习\
    \ JavaScript 和 ajax\n\n"
- fmt: "\n# Chapter 17\n# JavaScript array Object\n\n## In this Chapter\n- What Is\
    \ an Array?\n- Create an Array\n- Access an Array\n- Modify Values in an Array\n\
    - Examples\n\nThe `Array` object is used to store multiple values in a single\
    \ variable.\n\n### What is an array?\nAn array is a special variable that can\
    \ hold more than one value at a time.\n\nIf you have a list of items (a list of\
    \ car names, for example), storing the cars in single variables could look like\
    \ this:\n\n```javascript\ncars1=\"Saab\";\ncars2=\"Volvo\";\ncars3=\"BMW\";\n\
    ```\n\nHowever, what if you want to loop through the cars and find a specific\
    \ one? And what if you had not three cars, but 300?\n\nThe best solution here\
    \ is to use an array. An array can hold all your variable values under a single\
    \ name. And you can access the values by referring to the array name.\n\nEach\
    \ element in the array has its own ID so that it can be easily accessed.\n\n##\
    \ Create an array\nAn array can be defined in three ways.\n\nThe following code\
    \ creates an `Array` object called `myCars`: 1.\n\n```javascript\nvar myCars=new\
    \ Array();\n// create a new array with no elements\n// new Array(n); will create\
    \ a new array of length n\nmyCars[0]=\"Saab\";\nmyCars[1]=\"Volvo\";\nmyCars[2]=\"\
    BMW\";\n```\n\n2.\n```javascript\nvar myCars=new Array(\"Saab\",\"Volvo\",\"BMW\"\
    );\n// create a new array with the specified elements\n```\n\n3.\n```javascript\n\
    var myCars=[\"Saab\",\"Volvo\",\"BMW\"];\n//examples 2 & 3 are functionally equivalent\n\
    ```\n**Note**: If you specify numbers or true/false values inside the array then\
    \ the variable type will be `Number` or `Boolean`, instead of `String`.\n\n##\
    \ Access an array\nYou can refer to a particular element in an array by referring\
    \ to the name of the array and the index number. The index number starts at 0.\n\
    \nThe following code line:\n```javascript\ndocument.write(myCars[0]);\n```\n\n\
    results in the following output:\n`Saab`\n\n## Modify values in an array\nTo modify\
    \ a value in an existing array, just specify a new value for the element at the\
    \ given index.\n\n```javascript\nmyCars[0]=\"Opel\"; // overwrite the current\
    \ value of myCars[0]\n```\n\nNow, the following code line:\n```javascript\ndocument.write(myCars[0]);\n\
    ```\n\nresults in the following output:\n`Opel`\n\n## Examples\nThe following\
    \ example demonstrates how to create an array, assign values to it, and write\
    \ the values to the output.\n\nYour results are shown in Figure 17.1.\n\n**Try\
    \ it yourself >>**\n```html\n<html>\n<body>\n<script type=\"text/javascript\"\
    >\nvar mycars = new Array();\nmycars[0] = \"Saab\";\nmycars[1] = \"Volvo\";\n\
    mycars[2] = \"BMW\";\n\nfor (i=0;i<mycars.length;i++)\n{\ndocument.write(mycars[i]\
    \ + \"<br />\");\n}\n</script>\n</body>\n</html>\n```\n**Figure 17.1**\n\nThe\
    \ following example demonstrates how to use a `for...in` statement to loop through\
    \ the elements of an array.\n\nYour results are shown in Figure 17.2.\n\n**Try\
    \ it yourself >>**\n```html\n<html>\n<body>\n<script type=\"text/javascript\"\
    >\nvar x;\nvar mycars = new Array();\nmycars[0] = \"Saab\";\nmycars[1] = \"Volvo\"\
    ;\nmycars[2] = \"BMW\";\n\nfor (x in mycars)\n{\ndocument.write(mycars[x] + \"\
    <br />\");\n}\n</script>\n</body>\n</html>\n```\n**Figure 17.2**\n\nThe following\
    \ example demonstrates how to join two arrays. Your results are shown in Figure\
    \ 17.3.\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar parents\
    \ = [\"Jani\", \"Tove\"];\nvar children = [\"Cecilie\", \"Lone\"];\nvar family\
    \ = parents.concat(children);\ndocument.write(family);\n</script>\n</body>\n</html>\n\
    ```\n**Figure 17.3**\n\nThe following example demonstrates how to join three arrays.\
    \ Your results are shown in Figure 17.4.\n\n```html\n<html>\n<body>\n<script type=\"\
    text/javascript\">\nvar parents = [\"Jani\", \"Tove\"];\nvar brothers = [\"Stale\"\
    , \"Kai Jim\", \"Borge\"];\nvar children = [\"Cecilie\", \"Lone\"];\nvar family\
    \ = parents.concat(brothers, children);\ndocument.write(family);\n</script>\n\
    </body>\n</html>\n```\n**Figure 17.4**\n\nThe following example shows you how\
    \ to join all elements of an array into a string. Your results are shown in Figure\
    \ 17.5.\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar fruits\
    \ = [\"Banana\", \"Orange\", \"Apple\", \"Mango\"];\ndocument.write(fruits.join());\n\
    </script>\n</body>\n</html>\n```\n**Figure 17.5**\n\nThe following example demonstrates\
    \ how to remove the last element of an array.\n\n```html\n<html>\n<body>\n<script\
    \ type=\"text/javascript\">\nvar fruits = [\"Banana\", \"Orange\", \"Apple\",\
    \ \"Mango\"];\ndocument.write(fruits.pop());\n</script>\n</body>\n</html>\n```\n\
    \nThe following example demonstrates how to add new elements to the end of an\
    \ array.\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar fruits\
    \ = [\"Banana\", \"Orange\", \"Apple\", \"Mango\"];\ndocument.write(fruits.push(\"\
    Kiwi\"));\n</script>\n</body>\n</html>\n```\n\nThe following example shows you\
    \ how to reverse the order of elements in an array.\n\n```html\n<html>\n<body>\n\
    <script type=\"text/javascript\">\nvar fruits = [\"Banana\", \"Orange\", \"Apple\"\
    , \"Mango\"];\ndocument.write(fruits.reverse());\n</script>\n</body>\n</html>\n\
    ```\n\nThe following example demonstrates how to remove the first element of an\
    \ array.\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar fruits\
    \ = [\"Banana\", \"Orange\", \"Apple\", \"Mango\"];\ndocument.write(fruits.shift());\n\
    </script>\n</body>\n</html>\n```\n\nThe following example demonstrates how to\
    \ use `slice()` to select elements from an array.\n\n```html\n<html>\n<body>\n\
    <script type=\"text/javascript\">\nvar fruits = [\"Banana\", \"Orange\", \"Apple\"\
    , \"Mango\"];\ndocument.write(fruits.slice(0,1));\ndocument.write(fruits.slice(1));\n\
    document.write(fruits.slice(-2));\n</script>\n</body>\n</html>\n```\n\nThe following\
    \ three examples demonstrate how to use `sort()`. The first `sort()` example shows\
    \ how to sort alphabetically and ascending.\n\n```html\n<html>\n<body>\n<script\
    \ type=\"text/javascript\">\nvar fruits = [\"Banana\", \"Orange\", \"Apple\",\
    \ \"Mango\"];\ndocument.write(fruits.sort());\n</script>\n</body>\n</html>\n```\n\
    \nThe next `sort()` example demonstrates how to sort numerically and ascending.\n\
    \n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nfunction sortNumber(a,\
    \ b) {\n  return a - b;\n}\nvar n = [\"10\", \"5\", \"40\", \"25\", \"100\", \"\
    1\"];\ndocument.write(n.sort(sortNumber));\n</script>\n</body>\n</html>\n```\n\
    \nThe third `sort()` example demonstrates how to sort numerically and descending.\n\
    \n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nfunction sortNumber(a,\
    \ b) {\n  return b - a;\n}\nvar n = [\"10\", \"5\", \"40\", \"25\", \"100\", \"\
    1\"];\ndocument.write(n.sort(sortNumber));\n</script>\n</body>\n</html>\n```\n"
