    ## 第 1 章 如何以及在哪里


    要将 JavaScript 插入 HTML 页面，我们使用 `<script>` 标签。在 `<script>` 标签内部，我们使用 `type` 属性来定义脚本语言。


    因此，`<script type="text/javascript">` 和 `</script>` 告诉 JavaScript 的开始和结束：


    ```html

    <html>

    <body>

    <script type="text/javascript">

    ...

    </script>

    </body>

    </html>

    ```


    `document.write` 命令是向页面输出的标准 JavaScript 命令。


    当你在 `<script>` 和 `</script>` 标签之间输入 `document.write` 命令时，浏览器将其识别为 JavaScript 命令并执行。在这种情况下，浏览器会在页面上写入
    Hello World!：


    ```html

    <html>

    <body>

    <script type="text/javascript">

    document.write("Hello World!");

    </script>

    </body>

    </html>

    ```


    **注意** 如果我们没有输入 `<script>` 标签，浏览器会将 `document.write(“Hello World!”)` 命令视为纯文本，并直接在页面上输出整行，如图
    1.5 所示。


