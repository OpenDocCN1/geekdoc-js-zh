    \n128\n\n## 第 22 章：JavaScript\n\n### Cookies\n\n**本章内容**\n\n- 什么是 Cookie？\n- 创建并存储\
    \ Cookie\n\nCookie 通常用于识别用户。\n\n#### 什么是 Cookie？\n\nCookie 是存储在访问者计算机上的一个变量。每当同一台计算机使用浏览器请求页面时，它也会发送该\
    \ Cookie。通过 JavaScript，你既可以创建也可以获取 Cookie 值。\n\nCookie 的示例：\n\n8. **名称 Cookie。**\
    \ 当访问者第一次访问你的 Web 页面时，她必须填写她的姓名。该姓名随后存储在 Cookie 中。下次当访问者再次访问你的页面时，她可能会收到类似“欢迎，Jane\
    \ Doe！”的消息。该姓名是从存储的 Cookie 中检索的。\n\n8. **密码 Cookie。** 当访问者第一次访问你的 Web 页面时，她必须填写密码。该密码随后存储在\
    \ Cookie 中。下次当访问者再次访问你的页面时，会从 Cookie 中检索密码。\n\n8. **日期 Cookie。** 当访问者第一次访问你的 Web\
    \ 页面时，当前日期被存储在 Cookie 中。下次当访问者再次访问你的页面时，她可能会收到类似“你上次访问是 2005 年 8 月 11 日星期二！”的消息。该日期是从存储的\
    \ Cookie 中检索的。\n\n129\n\n使用 w3schools  JavaScript 和 ajax\n\n### 创建并存储 Cookie\n\
    \n在本示例中，我们创建了一个存储访问者姓名的 Cookie。当访问者第一次访问 Web 页面时，要求她填写姓名。该姓名随后存储在 Cookie 中。当访问者下次访问同一页面时，她会看到一条欢迎消息。\n\
    \n首先，我们创建一个函数，将访问者的姓名存储在 Cookie 变量中：\n```javascript\nfunction setCookie(c_name,value,expiredays)\n\
    {\n  var exdate=new Date();\n  exdate.setDate(exdate.getDate()+expiredays);\n\
    \  document.cookie=c_name+ \"=\" +escape(value)+\n  ((expiredays==null) ? \"\"\
    \ : \";expires=\"+exdate.toGMTString());\n}\n```\n\n上述函数的参数包含了 Cookie 的名称、Cookie\
    \ 的值以及 Cookie 到期前的天数。\n\n在上述函数中，我们首先将天数转换为有效日期，然后加上 Cookie 应该过期的天数。之后，我们将 Cookie\
    \ 名称、Cookie 值和过期日期存储在 `document.cookie` 对象中。\n\n然后，我们创建另一个函数来检查 Cookie 是否已设置：\n\
    ```javascript\nfunction getCookie(c_name)\n{\n  if (document.cookie.length>0)\n\
    \  {\n    c_start=document.cookie.indexOf(c_name + \"=\"); \n    if (c_start!=-1)\n\
    \    {\n      // ...\n    }\n  }\n}\n```\n\n130\n\n第 22 章：JavaScript Cookies\n\
