    **60**\n![Image 38](img/index-72_1.png)\n![Image 39](img/index-72_2.png)\n**第\
    \ 10 章：JavaScript 函数**\n\n**图 10.3**\n**图 10.4**\n\n以下示例显示了如何让函数返回一个值。\n\n**自己试试\
    \ >>**\n\n```html\n<html\n<head>\n<script type=\"text/javascript\"> \nfunction\
    \ myFunction()\n{\nreturn (\"Hello world!\");\n}\n</script>\n</head>\n<body>\n\
    <script type=\"text/javascript\"> document.write(myFunction());\n</script>\n</body>\n\
    </html>\n```\n\n**图 10.5**\n\n## return 语句\n\n`return` 语句用于指定函数的返回值。因此，将返回值的函数必须使用\
    \ `return` 语句。\n\n`return` 语句也可以用于不返回值的函数，在函数的任何一点结束执行；例如，当遇到错误条件时：\n\n```\nvar\
