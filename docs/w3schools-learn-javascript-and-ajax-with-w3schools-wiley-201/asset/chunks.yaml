    - 比较运算符

    - 如何使用比较

    - 逻辑运算符

    - 条件运算符


    比较和逻辑运算符用于测试真或假。


    **比较运算符**

    比较运算符用于逻辑语句，确定变量或值之间的相等性或差异。假设 `x = 5`，下表解释了比较运算符：


    | 运算符 | 描述 | 示例 | 结果 |

