    document.write(\"I'm really looking forward to this weekend!<br>\");\n}\n</script>\n\
    </body>\n</</html>\n```\n\n这段 JavaScript 将根据当前日期生成不同的问候。注意周日=0，周一=1，周二=2，以此此类推。\n\
    \n"
- fmt: "\n# Prompt Box\n\n## popup Boxes\n\nJavaScript has three types of popup boxes:\
    \ alert box, confirm box, and prompt box.\n\n## alert Box\n\nAn alert box is often\
    \ used when you want to display information to the user.\n\nWhen an alert box\
    \ pops up, the user will have to click OK to proceed.\n\nThe syntax is as follows:\n\
    \n```\nalert(\"sometext\");\n```\n\nYour results are shown in Figure 9.1. When\
    \ you click the button, the alert box in Figure 9.2 pops up.\n\n**Try it yourself\
    \ >>**\n\n```html\n<html>\n<head>\n*(continued)*\n**53**\n![Image 29](index-65_1.png)\n\
