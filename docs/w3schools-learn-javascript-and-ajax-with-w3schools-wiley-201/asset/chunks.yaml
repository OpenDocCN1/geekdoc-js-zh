    \n**第 7 章：Javascript 循环**\n\n**图 7.4**\n\n## 第 8 章：额外的 JavaScript 流程控制语句\n\n###\
    \ 本章内容\n* `break` 语句\n* `continue` 语句\n* JavaScript `for...in` 语句\n* JavaScript\
    \ `switch` 语句\n\n`break` 和 `continue` 语句用于控制循环的执行。`break` 语句可用于在遇到错误条件时停止循环的执行。`continue`\
    \ 语句用于开始循环的下一次迭代，而不执行代码块中的所有语句。\n\n### break 语句\n\n`break` 语句将终止循环的执行，并继续执行循环之后的代码（如果有）。你的结果如图\
