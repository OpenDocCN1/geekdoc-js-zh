    \ `<head>` 部分。\n\n## 如何定义函数\n\n语法如下：\n\n```\nfunction functionname(var1,var2,...,varX)\n\
    {\nsome code\n}\n```\n\n**58**\n**第 10 章：JavaScript 函数**\n\n参数 `var1`、`var2` 等\
