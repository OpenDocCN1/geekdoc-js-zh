    The `Try It Yourself` icon indicates an opportunity for you to practice what you’ve
    just learned. The code and examples under this icon come from examples on the
    `w3schools` site, which allow you to make changes to the code and see the results
    immediately. You do not have to type in the code examples in this book; you will
    find them all on the `w3schools` site.


    The `w3schools` icon indicates that more information is available on the `w3schools`
    site.


    This icon indicates where you will find further information about a topic that
    is covered more thoroughly elsewhere within the book.


