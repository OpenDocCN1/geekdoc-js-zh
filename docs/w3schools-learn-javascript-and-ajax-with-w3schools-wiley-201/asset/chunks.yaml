    \ constructor.\n\nThere are four ways of instantiating a date:\n- `new Date()`\
    \ // current date and time\n- `new Date(milliseconds)` //milliseconds since 1970/01/01\n\
    - `new Date(dateString)`\n- `new Date(year, month, day, hours, minutes, seconds,\
    \ milliseconds)`\n\nMost of the preceding parameters are optional.\n\nWhen a parameter\
    \ is not specified, 0 is passed to the method by default.\n\nAfter a `Date` object\
    \ is created, a number of methods enable you to operate on it.\n\nMost methods\
    \ allow you to get and set the year, month, day, hour, minute, second, and millisecond\
    \ of the object, using either local time or UTC (universal, or GMT) time.\n\n\
    88 # Chapter 16: JavaScript Date Object\nAll dates are calculated in milliseconds\
