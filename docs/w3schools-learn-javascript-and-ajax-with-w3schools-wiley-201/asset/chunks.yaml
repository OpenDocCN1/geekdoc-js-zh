  trans: "\n\n当用户输入数据时，会执行函数 `showHint()`。该函数的执行是由 `onkeyup` 事件触发的。换句话说，每当用户在输入框内按下并释放一个键时，就会调用\
    \ `showHint` 函数。\n\n### the showhint() Function\n\n`showHint()` 函数是一个非常简单的 JavaScript\
    \ 函数，放置在 HTML 页面的 `<head>` 部分：\n\n```javascript\nvar xmlhttp;\n\nfunction showHint(str)\n\
    {\n  if (str.length==0)\n  {\n    document.getElementById(\"txtHint\").innerHTML=\"\
    \";\n    return;\n  }\n  xmlhttp=GetXmlHttpObject();\n  if (xmlhttp==null)\n \
    \ {\n    alert (\"Your browser does not support XMLHTTP!\");\n    return;\n  }\n\
    \  var url = \"gethint.asp\";\n  url = url + \"?q =\" +str;\n  url = url + \"\
    &sid=\" +Math.random(); \n  xmlhttp.onreadystatechange=stateChanged;\n  xmlhttp.open(\"\
    GET\",url,true);\n  xmlhttp.send(null);\n}\n```\n\n上述函数每当在输入框中输入一个字符时执行一次。\n\n\
    #### Chapter 32: AJAX Suggest\n\n如果输入框中有输入（`str.length > 0`），`showHint()` 函数将执行以下操作：\n\
    \n- 定义发送到服务器的 URL（*filename*）\n- 向 URL 添加一个参数（*q*），其内容为输入框中的的内容\n- 添加一个随机数以防止服务器使用缓存文件\n\
    - 创建一个 `XMLHttp` 对象并告诉该对象在触发更改时执行名为 `stateChanged` 的函数\n- 使用给定的 URL 打开 `XMLHttp`\
    \ 对象\n- 向服务器发送 HTTP 请求\n\n如果输入框为空，该函数简单地清空 `txtHint` 占位符的内容。\n\n### the getXmlhttpObject()\
    \ Function\n\n`showHint()` 函数调用了一个名为 `GetXmlHttpObject()` 的函数。`GetXmlHttpObject()`\
    \ 函数目的是解决为不同的浏览器创建不同的 `XMLHttp` 对象的问题：\n\n```javascript\nfunction GetXmlHttpObject()\n\
    {\n  if (window.XMLHttpRequest)\n  {\n    // code for IE7+, Firefox, Chrome, Opera,\
    \ Safari return new XMLHttpRequest();\n    return new XMLHttpRequest();\n  }\n\
    \  if (window.ActiveXObject)\n  {\n    // code for IE6, IE5\n    return new ActiveXObject(\"\
    Microsoft.XMLHTTP\");\n  }\n  return null;\n}\n```\n\n### the stateChanged() Function\n\
    \n`stateChanged()` 函数包含以下代码：\n\n```javascript\nfunction stateChanged()\n{\n  if\
    \ (xmlhttp.readyState==4)\n  {\n    document.getElementById(\"txtHint\").innerHTML=xmlhttp.responseText;\n\
    \  }\n}\n```\n\n每当 `XMLHttp` 对象的状态发生时，`stateChanged()` 函数就会执行。当状态变为 4（完成”）时，`txtHint`\
    \ 占位符的内容将被填充响应文本。\n\n### AJAX Suggest Source Code\n\n以下源代码属于上一个 AJAX 示例。你可以复制并粘贴它，然后尝试自己运行。**注意**\
    \ 请确保在启用了 ASP 或 PHP 的服务器上进行尝试。\n\n#### the AJAX htML page\n\n这是一个 HTML 页面。它包含一个简单的\
    \ HTML 表单和一个指向 JavaScript 的链接。\n\n```html\n<html\n<head>\n  <script src=\"clienthint.js\"\
    ></script>\n</head>\n<body>\n  <form>\n    First Name: <input type=\"text\" id=\"\
    txt1\" onkeyup=\"showHint(this.value)\" />\n  </form>\n  <p>Suggestions: <span\
    \ id=\"txtHint\"></</span></p>\n</body>\n</html>\n```\n\n#### the AJAX JavaScript\n\
    \n这是 JavaScript 代码，存储在 `clienthint.js` 文件中：\n\n```javascript\nvar xmlhttp\nfunction\
    \ showHint(str)\n{\n  if (str.length==0)\n  {\n    document.getElementById(\"\
    txtHint\").innerHTML=\"\";\n    return;\n  }\n  xmlhttp=GetXmlHttpObject();\n\
    \  if (xmlhttp==null)\n  {\n    alert (\"Your browser does not support XMLHTTP!\"\
    );\n    return;\n  }\n  var url=\"gethint.asp\";\n  url=url+\"?q=\"+str;\n  url=url+\"\
    &sid=\"+Math.random();\n  xmlhttp.onreadystatechange=stateChanged;\n  xmlhttp.open(\"\
    GET\",url,true);\n  xmlhttp.send(null);\n}\nfunction stateChanged()\n{\n  if (xmlhttp.readyState==4)\n\
    \  {\n    document.getElementById(\"txtHint\").innerHTML=xmlhttp.responseText;\n\
    \  }\n}\nfunction GetXmlHttpObject()\n{\n  if (window.XMLHttpRequest)\n  {\n \
    \   // code for IE7+, Firefox, Chrome, Opera, Safari\n    return new XMLHttpRequest();\n\
    \  }\n  if (window.ActiveXObject)\n  {\n    // code for IE6, IE5\n    return new\
    \ ActiveXObject(\"Microsoft.XMLHTTP\");\n  }\n  return null;\n}\n```\n\n#### the\
    \ AJAX Server page—ASp and php\n\n不存在所谓的 AJAX 服务器。AJAX 页面由任何 Internet 服务器提供。上一个示例中\
    \ JavaScript 调用的服务器页面是一个名为 `gethint.asp` 的简单 ASP 文件。以下两个服务器页面代码示例，一个用 ASP 编写，另一个用\
    \ PHP 编写。\n\n#### AJAX ASp Example\n\n`gethint.asp` 中的代码使用 VBScript 编写，用于 Internet\
    \ Server (IIS)。它检查名称数组并将相应的名称返回给客户端：\n\n```asp\n<%\nresponse.expires=-1\ndim a(30)\n\
    'Fill up array with names\na(0)=\"Anna\"\na(1)=\"Brittany\"\na(2)=\"Cinderella\"\
    \na(3)=\"Diana\"\na(4)=\"Eva\"\na(5)=\"Fiona\"\na(6)=\"Gunda\"\na(7)=\"Hege\"\n\
    a(8)=\"Inga\"\na(9)=\"Johanna\"\na(10)=\"Kitty\"\na(11)=\"Linda\"\na(12)=\"Nina\"\
    \na(13)=\"Ophelia\"\na(14)=\"Petunia\"\na(15)=\"Amanda\"\na(16)=\"Raquel\"\na(17)=\"\
    Cindy\"\na(18)=\"Doris\"\na(19)=\"Eve\"\na(20)=\"Evita\"\na(21)=\"Sunniva\"\n\
    a(22)=\"Tove\"\na(23)=\"Unni\"\na(24)=\"Violet\"\na(25)=\"Liza\"\na(26)=\"Elizabeth\"\
    \na(27)=\"Ellen\"\na(28)=\"Wenche\"\na(29)=\"Vicky\"\n\n'get q parameter from\
    \ URL\nq=Request.QueryString(\"q\")\n\n'lookup all hints from array if length\
    \ of q>0\nif len(q)>0 then\n  hint=\"\"\n  for i=0 to 30\n    if LCase(q)=LCase(Left(a(i),len(q)))\
    \ then\n      if hint=\"\" then\n        hint=a(i)\n      else\n        hint=hint&\"\
    , \"&a(i)\n      end if\n    end if\n  next i\nend if\n\n'Set output to \"no suggestion\"\
    \ if no hint were found\n' or to the correct values\nif hint=\"\" then\n  response=\"\
    no suggestion\"\nelse\n  response=hint\nend if\n\n'output the response\nresponse.write\
    \ response\n%>\n\n#### AJAX php\n\n上述代码可以重写为 PHP。要在 PHP 中运行整个示例，请记住将 `clienthint.js`\
    \ 中 `url` 的值从 `gethint.asp` 改为 `gethint.php`。\n\n```php\n<?php\n// Fill array\
    \ with names\n$a=[\"Anna\", \"Brittany\", \"Cinderella\", \"Diana\", \"Eva\",\
    \ \"Fiona\", \"Gunda\", \"Hege\", \"Inga\", \"Johanna\", \"Kitty\", \"Linda\"\
    , \"Nina\", \"Ophelia\", \"Petunia\", \"Amanda\", \"Raquel\", \"Cindy\", \"Doris\"\
    , \"Eve\", \"Evita\", \"Sunniva\", \"Tove\", \"Unni\", \"Violet\", \"Liza\", \"\
    Elizabeth\", \"Ellen\", \"Wenche\", \"Vicky\"];\n\n//get q parameter from URL\n\
    $q=$_GET[\"q\"];\n\n//lookup all hints from array if length of q>0\nif (strlen($q)\
    \ > 0)\n{\n  $hint=\"\";\n  for($i=0; $i<count($a); $i++)\n  {\n    if (strtolower($q)==strtolower(substr($a[$i],0,strlen($q))))\n\
    \    {\n      if ($hint=\"\") {\n        $hint=$a[$i];\n      }\n      else {\n\
    \        $hint=$hint.\" , \".$a[$i];\n      }\n    }\n  }\n}\n\n// Set output\
    \ to \"no suggestion\" if no hint were found\n// or to the correct values\nif\
    \ ($hint == \"\")\n{\n  $response=\"no suggestion\";\n}\nelse\n{\n  $response=$hint;\n\
    }\n\n//output the response\necho $response;\n?>\n```\n\n### Chapter 33: AJAX Database\
    \ Example\n\nAJAX 可用于与数据库进行交互。图 33.1 中的示例演示了如何使用 AJAX 技术从数据库获取信息。\n\n**在本章中：**\n\
    - AJAX JavaScript\n- AJAX 服务器页面\n\n#### Figure 33.1\n\n上一个示例包含一个简单的 HTML 表单和一个指向\
    \ JavaScript 的链接：\n\n```html\n<html>\n<head>\n  <script type=\"text/javascript\"\
    \ src=\"selectcustomer.js\"></script>\n</head>\n<body>\n  <form>\n    Select a\
    \ Customer:\n    <select name=\"customers\" onchange=\"showCustomer(this.value)\"\
    >\n      <option value=\"ALFKI\">Alfreds Futterkiste</option>\n      <option value=\"\
    NORTS \">North/South</option>\n      <option value=\"WOLZA\">Wolski Zajazd</option>\n\
    \    </select>\n  </form>\n  <div id=\"txtHint\"><b>Customer info will be listed\
    \ here.</b></div>\n</body>\n</html>\n```\n\n"
- fmt: "\nAs you can see, it is just a simple HTML form with a drop-down box called\
    \ customers.\n\nThe `div` below the form will be used as a placeholder for info\
    \ retrieved from the Web server.\n\nWhen the user selects data, a function called\
    \ `showCustomer()` is executed. The execution of the function is triggered by\
    \ the “onchange” event. In other words, each time the user changes the value in\
    \ the drop-down box, the function `showCustomer()` is called.\n\n### The AJAX\
    \ JavaScript\n\nThis is the JavaScript code stored in the file `selectcustomer.js`:\n\
    \n```javascript\nvar xmlhttp\n\nfunction showCustomer(str)\n{\n  xmlhttp=GetXmlHttpObject();\n\
    \  if (xmlhttp==null)\n  {\n    alert (\"Your browser does not support AJAX!\"\
    ); return;\n  }\n  var url=\"getcustomer.asp\";\n  url=url+\"?q=\"+str;\n  url=url+\"\
    &sid=\"+Math.random();\n  xmlhttp.onreadystatechange=stateChanged;\n  xmlhttp.open(\"\
    GET\",url,true);\n  xmlhttp.send(null);\n}\n\nfunction stateChanged()\n{\n  if\
    \ (xmlhttp.readyState==4)\n  {\n    document.getElementById(\"txtHint\").innerHTML=xmlhttp.responseText;\n\
    \  }\n}\n\nfunction GetXmlHttpObject()\n{\n  if (window.XMLHttpRequest)\n  {\n\
    \    // code for IE7+, Firefox, Chrome, Opera, Safari return new XMLHttpRequest();\n\
    \  }\n  if (window.ActiveXObject)\n  {\n    // code for IE6, IE5\n    return new\
    \ ActiveXObject(\"Microsoft.XMLHTTP\");\n  }\n  return null;\n}\n```\n\n### The\
    \ AJAX server page\n\nThe server page called by the previous JavaScript script\
    \ is an ASP file called `getcustomer.asp`. The ASP page is written in VBScript\
    \ for an Internet Information Server (IIS). It could easily be rewritten in PHP\
    \ or some other server language.\n\nThe code runs a query against a database and\
    \ returns the result in an HTML table:\n\n```asp\n<%\nresponse.expires=-1\nsql=\"\
    SELECT * FROM CUSTOMERS WHERE CUSTOMERID=\"\nsql=sql & \"'\" & request.querystring(\"\
    q\") & \"'\"\nset conn=Server.CreateObject(\"ADODB.Connection\") \nconn.Provider=\"\
    Microsoft.Jet.OLEDB.4.0\"\nconn.Open(Server.Mappath(\"/db/northwind.mdb\")) \n\
    set rs=Server.CreateObject(\"ADODB.recordset\") \nrs.Open sql,conn\nresponse.write(\"\
    <table>\")\ndo until rs.EOF\n  for each x in rs.Fields\n    response.write(\"\
    <tr><td><b>\" & x.name & \"</b></td>\") \n    response.write(\"<td>\" & x.value\
    \ & \"</td></tr>\") \n  next\n  rs.MoveNext\nloop\nresponse.write(\"</table>\"\
    )\n%>\n```\n\n### AJAX XML Example\n\n#### In this Chapter\n- The AJAX JavaScript\n\
    - The AJAX Server Page\n- The XML File\n\nAJAX can be used for interactive communication\
    \ with an XML file. The example in Figure 34.1 demonstrates how a Web page can\
    \ fetch information from an XML file with AJAX technology.\n\nThe preceding example\
    \ contains a simple HTML form and a link to a JavaScript:\n\n```html\n<html>\n\
    <head>\n  <script src=\"selectcd.js\"></script>\n</head>\n<body>\n<<form>\n  Select\
    \ a CD:\n  <select name=\"cds\" onchange=\"showCD(this.value)\">\n    <option\
    \ value=\"Bob Dylan\">Bob Dylan</option>\n    <option value=\"Bonnie Tyler\">Bonnie\
    \ Tyler</option>\n    <option value=\"Dolly Parton\">Dolly Parton</option>\n \
    \ </select>\n</form>\n<div id=\"txtHint\"><b>CD info will be listed here.</b></div>\n\
    </body>\n</html>\n```\n\nAs you can see, it is just a simple HTML form with a\
    \ simple drop-down box called cds. The `div` below the form will be used as a\
    \ placeholder for info retrieved from the Web server. When the user selects data,\
    \ a function called `showCD` is executed. The execution of the function is triggered\
    \ by the onchange event. In other words each time the user changes the value in\
    \ the drop-down box, the function `showCD` is called.\n\n#### The AJAX JavaScript\n\
    \nThis is the JavaScript code stored in the file `selectcd.js`:\n\n```javascript\n\
    var xmlhttp\n\nfunction showCD(str)\n{\n  xmlhttp=GetXmlHttpObject();\n  if (xmlhttp==null)\n\
    \  {\n    alert (\"Your browser does not support AJAX!\"); return;\n  }\n  var\
    \ url=\"getcd.asp\";\n  url=url+\"?q=\"+str;\n  url=url+\"&sid=\"+Math.random();\n\
    \  xmlhttp.onreadystatechange=stateChanged;\n  xmlhttp.open(\"GET\",url,true);\n\
    \  xmlhttp.send(null);\n}\n\nfunction stateChanged()\n{\n  if (xmlhttp.readyState==4)\n\
    \  {\n    document.getElementById(\"txtHint\").innerHTML=xmlhttp.responseText;\n\
    \  }\n}\n\nfunction GetXmlHttpObject()\n{\n  if (window.XMLHttpRequest)\n  {\n\
    \    // code for IE7+, Firefox, Chrome, Opera, Safari return new XMLHttpRequest();\n\
    \  }\n  if (window.ActiveXObject)\n  {\n    // code for IE6, IE5\n    return new\
    \ ActiveXObject(\"Microsoft.XMLHTTP\");\n  }\n  return null;\n}\n```\n\n#### The\
    \ AJAX server page\n\nThe server page called by the preceding JavaScript is an\
    \ ASP file called `getcd.asp`. The page is written in VBScript for an Internet\
    \ Information Server (IIS). It could easily be rewritten in PHP or some other\
    \ server language. The code runs a query against an XML file and returns the result\
    \ as HTML:\n\n```asp\n<%\nresponse.expires=-1\nq=request.querystring(\"q\")\n\
    set xmlDoc=Server.CreateObject(\"Microsoft.XMLDOM\") \nxmlDoc.async=\"false\"\n\
    xmlDoc.load(Server.MapPath(\"cd_catalog.xml\")) \nset nodes=xmlDoc.selectNodes(\"\
    CATALOG/CD[ARTIST='\" & q & \"']\")\nfor each x in nodes\n  for each y in x.childnodes\n\
    \    response.write(\"<b>\" & y.nodeName & \":</b> \") \n    response.write(y.text)\n\
    \    response.write(\"<br />\")\nnext\n%>\n```\n\n#### The XML File\n\nThe XML\
    \ file used in the example is `cd_catalog.xml`. This document contains a collection\
    \ and appears as follows:\n\n```xml\n<CATALOG>\n  <CD>\n    <TITLE>Empirelesque</TITLE>\n\
    \    <ARTIST>Bob Dylan</ARTIST>\n    <COUNTRY>USA</COUNTRY>\n    <COMPANY>Columbia</COMPANY>\n\
    \    <PRICE>10.90</PRICE>\n    <YEAR>1985</YEAR>\n  </CD>\n  <CD>\n    <TITLE>Hide\
    \ your heart</TITLE>\n    <ARTIST>Bonnie Tyler</ARTIST>\n    <COUNTRY>UK</COUNTRY>\n\
    \    <COMPANY>CBS</COMPANY>\n    <PRICE>9.90</PRICE>\n    <YEAR>1988</YEAR>\n\
    \  </CD>\n  <CD>\n    <TITLE>Greatest Hits</TITLE>\n    <ARTIST>Dolly Parton</ARTIST>\n\
    \    <COUNTRY>USA</COUNTRY>\n    <COMPANY>RCA</COMPANY>\n    <PRICE>9.90</PRICE>\n\
    \    <YEAR>1982</YEAR>\n  </CD>\n  <CD>\n    <TITLE>Still got the blues</TITLE>\n\
    \    <ARTIST>Gary Moore</ARTIST>\n    <COUNTRY>UK</COUNTRY>\n    <COMPANY>Virgin\
    \ records</COMPANY>\n    <PRICE>10.20</PRICE>\n    <YEAR>1990</YEAR>\n  </CD>\n\
    \  <CD>\n    <TITLE>Eros</TITLE>\n    <ARTIST>Eros Ramazzotti</ARTIST>\n    <COUNTRY>EU</COUNTRY>\n\
    \    <COMPANY>BMG</COMPANY>\n    <PRICE>9.90</PRICE>\n    <YEAR>1997</YEAR>\n\
    \  </CD>\n  <CD>\n    <TITLE>One night only</TITLE>\n    <ARTIST>Bee Gees</ARTIST>\n\
    \    <COUNTRY>UK</COUNTRY>\n    <COMPANY>Polydor</COMPANY>\n    <PRICE>10.90</PRICE>\n\
    \    <YEAR>1998</YEAR>\n  </CD>\n  <CD>\n    <TITLE>Sylvias Mother</TITLE>\n \
