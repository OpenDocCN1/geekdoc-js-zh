    The Boolean object is used to convert a non-Boolean value to a Boolean value (either
    true or false).


    **Create a Boolean object**


    The Boolean object represents two values: true or false.


    The following code creates a Boolean object called myBoolean: var myBoolean=new
    Boolean();


    **n o t e** If the Boolean object has no initial value or if it is 0, -0, null,
    “”, false, undefined, or NaN, the object is set to false. Otherwise, it is true
    (even with the string “false”)!


    All the following lines of code create Boolean objects with an initial value of
    false: var myBoolean=new Boolean();


    var myBoolean=new Boolean(0);


    var myBoolean=new Boolean(null);


    var myBoolean=new Boolean("");


    var myBoolean=new Boolean(false);


    var myBoolean=new Boolean(NaN);


    **107**


