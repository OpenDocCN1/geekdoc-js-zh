    **Figure 26.1**


    To get a timer to work in an infinite loop, you must write a function that calls
    itself.


    In the following example, when a button is clicked, the input field starts to
    count (forever) starting at 0.


    Notice that you also have a function that checks whether the timer is already
    running, to avoid creating additional timers if the button is clicked more than
    once.


    Your results are shown in Figure 26.2.


    ## 145


    **Learn JavaScript and ajax with w3schools** **Try it yourself >>**


    ```html

    <html>

    <head>

    <script type="text/javascript"> var c=0;

    var t;

    var timer_is_on=0;

    function timedCount()

    {

    document.getElementById(''txt'').value=c;

    c=c+1;

    t=setTimeout("timedCount()",1000);

    }

    function doTimer()

    {

    if (!timer_is_on)

    {

    timer_is_on=1;

    timedCount();

    }

    }

    </script>

    </head>

    <body>

    <form>

    <input type="button" value="Start count!"

    onClick="doTimer()">

    <input type="text" id="txt">

    </form>

    <p>Click on the button above. The input field will count forever, starting at
    0.</p>

    </body>

    </html>

    ```


