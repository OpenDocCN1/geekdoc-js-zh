    \nThe syntax is as follows:\n\n```javascript\nwhile (var<=endvalue)\n{\n  // (continued)\n\
    \  code to be executed\n}\n```\n\n**Note**: The `<=` could be any comparing statement.\n\
    \n**Tip**: The distinction between the `for` and the `while` loop is that in the\
    \ `for` loop, the conditions are known and can be specified beforehand. The `while`\
    \ loop is used when the initial conditions are known, but the terminal condition\
    \ is discovered as the block is executed.\n\nThe following example defines a loop\
    \ that starts with `i = 0`. The loop will continue to run as long as `i` is less\
    \ than or equal to 5. `i` will increase by 1 each time the loop runs, as shown\
    \ in Figure 7.3.\n\n**Try it yourself >>**\n\n```html\n<html>\n<body>\n<script\
    \ type=\"text/javascript\"> i=0;\nwhile (i<=5)\n{\ndocument.write(\"The number\
    \ is \" + i); document.write(\"<br />\");\ni++;\n}\n</script>\n<p>Explanation:</p>\n\
    <p>`i` is equal to 0.</p>\n<p>While `i` is less than, or equal to, 5, the loop\
    \ will continue to run.</p>\n<p>`i` will increase by 1 each time the loop runs.</p>\n\
    </body>\n</html>\n```\n\n![Image 23](index-54_1.png)\n\n**Chapter 7: Javascript\
    \ Loops**\n\n**Figure 7.3: the do...while Loop**\n\nThe `do...while` loop is a\
    \ variant of the `while` loop. This loop will execute the block of code *once*,\
    \ and then it will repeat the loop as long as the specified condition is true.\n\
    \nThe syntax is as follows:\n\n```javascript\ndo\n{\n  code to be executed\n}\n\
    while (var<=endvalue);\n```\n\nThe following example uses a `do...while` loop.\
    \ The `do...while` loop will always be executed at least once, even if the condition\
    \ is false, because the statements are executed before the condition is tested.\
    \ The result is shown in Figure 7.4.\n\n**Tip**: The difference between the `while`\
    \ and `do…while` loops should be characterized by whether the condition is checked\
    \ before or after the block is executed. In the case of the `while` loop, the\
    \ condition is checked first, so if false, the block will not be executed. In\
    \ the `do…while` loop, the condition is checked *after* the block is executed;\
    \ therefore the block is always executed at least once.\n\n**Try it yourself >>**\n\
