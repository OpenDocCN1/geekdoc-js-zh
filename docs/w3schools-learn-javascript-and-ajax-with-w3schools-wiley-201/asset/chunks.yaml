    # Learn JavaScript and Ajax with w3schools


    ## Array Object Methods


    ### Method Description


    | Method | Description |

    | :--- | :--- |

    | `concat()` | Joins two or more arrays, and returns a copy of the joined arrays
    |

    | `join()` | Joins all elements of an array into a string |

    | `pop()` | Removes the last element of an array, and returns that element |

    | `push()` | Adds new elements to the end of an array, and returns the new length
    |

    | `reverse()` | Reverses the order of the elements in an array |

    | `shift()` | Removes the first element of an array, and returns that element
    |

    | `slice()` | Selects a part of an array, and returns the new array |

    | `sort()` | Sorts the elements of an array |

    | `splice()` | Adds/Removes elements from an array |

    | `toString()` | Converts an array to a string, and returns the result |

    | `unshift()` | Adds new elements to the beginning of an array, and returns the
    new length |

    | `valueOf()` | Returns the primitive value of an array as values separated by
    commas |


    ## boolean Object


    The `Boolean` object is used to convert a non-Boolean value to a Boolean value
    (true or false).


    For a tutorial about the `Boolean` object, see Chapter 18, “JavaScript Boolean
    Object.”


    ### boolean Object properties


    | property | Description |

    | :--- | :--- |

    | `constructor` | Returns the function that created the `Boolean` object’s prototype
    |

    | `prototype` | Allows you to add properties and methods to an object |


    ## boolean Object Methods


    | Method | Description |

    | :--- | :--- |

    | `toString()` | Converts a Boolean value to a string, and returns the result
    |

    | `valueOf()` | Returns the primitive value of a `Boolean` object |


    ## date Object


    The `Date` object is used to work with dates and times.


    `Date` objects are created with `new Date()`.


    There are four ways of instantiating a date:


    ```javascript

    var d = new Date();

    ```


    204


    Appendix A: JavaScript Objects


    ```javascript

    var d = new Date(milliseconds);

    var d = new Date(dateString);

    var d = new Date(year, month, day, hours, minutes, seconds, milliseconds);

    ```


    For a tutorial about date and times, see Chapter 16, “JavaScript Date Object.”


    ## date Object properties


    | property | Description |

    | :--- | :--- |

    | `constructor` | Returns the function that created the `Date` object’s prototype
    |

    | `prototype` | Allows you to add properties and methods to an object |


    ## date Object Methods


    | Method | Description |

    | :--- | :--- |

    | `getDate()` | Returns the day of the month (from 1–31) |

    | `getDay()` | Returns the day of the week (from 0–6) |

    | `getFullYear()` | Returns the year (four digits) |

    | `getHours()` | Returns the hour (from 0–23) |

    | `getMilliseconds()` | Returns the milliseconds (from 0–999) |

    | `getMinutes()` | Returns the minutes (from 0–59) |

    | `getMonth()` | Returns the month (from 0–11) |

    | `getSeconds()` | Returns the seconds (from 0–59) |

    | `getTime()` | Returns the number of milliseconds since midnight January 1, 1970
    |

    | `getTimezoneOffset()` | Returns the time difference between GMT and local time
    in minutes |

    | `getUTCDate()` | Returns the day of the month, according to universal time (from
    1–31) |

    | `getUTCDay()` | Returns the day of the week, according to universal time (from
    0–6) |

    | `getUTCFullYear()` | Returns the year, according to universal time (four digits)
    |

    | `getUTCHours()` | Returns the hour, according to universal time (from 0–23)
    |

    | `getUTCMilliseconds()` | Returns the milliseconds, according to universal time
    (from 0–999) |

    | `getUTCMinutes()` | Returns the minutes, according to universal time (from 0–59)
    |

    | `getUTCMonth()` | Returns the month, according to universal time (from 0–11)
    |

    | `getUTCSeconds()` | Returns the seconds, according to universal time (from 0–59)
    |

    | `getYear()` | Deprecated. Use the `getFullYear()` method instead |

    | `parse()` | Parses a date string and returns the number of milliseconds since
    midnight of January 1, 1970 |

    | `setDate()` | Sets the day of the month (from 1–31) |


