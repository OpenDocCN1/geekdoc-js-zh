    ## w3schools Authors/Editors


    w3schools’ mission is to publish well-organized and easy-to-understand online
    tutorials based on the W3C Web standards.


    ### Hege Refsnes

    Hege is a writer and editor for w3schools. She works to improve the usability
    and acces-sibility of the Web. Hege has been writing tutorials for w3schools since
    1998.


    ### Ståle Refsnes

    Ståle has ten years of Internet development experience, developing all the Web-based
    solutions for The Norwegian Handball Federation. Ståle has been writing tutorials
    for w3schools since 1999.


    ### Kai Jim Refsnes

    Kai Jim has been around computers since childhood, working with them since the
    age of 14. He has been writing tutorials for w3schools since completing a bachelor’s
    degree in information technology in 2005.


    ### Jan Egil Refsnes

    Jan Egil is the president and founder of w3schools. He is a senior system developer
    with a master’s degree in information technology and more than 30 years of computing
    experience. “Jani” has supervised a large number of company-critical development
    projects for oil companies like Amoco, British Petroleum, ELF, Halliburton, and
    Brown & Root. He has also developed computer-based solutions for more than 20
    governmental institutions like The National Library, Norwegian High Schools, The
    State Hospital, and many others. Jani started w3schools in 1998.


