  trans: "\n\n# 第 17 章\n# JavaScript 数组对象\n\n## 本章内容\n- 什么是数组？\n- 创建数组\n- 访问数组\n-\
    \ 修改数组中的值\n- 示例\n\n`Array` 对象用于在单个变量中存储多个值。\n\n### 什么是数组\n数组是一种特殊的变量，可以同时包含多个值。\n\
    \n如果你有一个项目列表（例如汽车名称列表），将汽车存储在单个变量中可能如下：\n\n```javascript\ncars1=\"Saab\";\ncars2=\"\
    Volvo\";\ncars3=\"BMW\";\n```\n\n但是，如果你想遍历这些汽车并找到特定的一辆呢？如果你有的不是 3 辆汽车，而是 300 辆呢？\n\
    \n这里的最佳解决方案是使用数组。数组可以将所有的变量值存储在一个名称下。你可以通过引用数组名称来访问这些值。\n\n数组中的每个元素都有自己的 ID（索引），以便方便地访问。\n\
    \n## 创建数组\n数组可以通过三种方式定义。\n\n以下代码创建了一个名为 `myCars` 的 `Array` 对象：1.\n\n```javascript\n\
    var myCars=new Array();\n// 创建一个没有元素的数组\n// new Array(n); 将创建一个长度为 n 的数组\nmyCars[0]=\"\
    Saab\";\nmyCars[1]=\"Volvo\";\nmyCars[2]=\"BMW\";\n```\n\n2.\n```javascript\n\
    var myCars=new Array(\"Saab\",\"Volvo\",\"BMW\");\n// 创建一个带有指定元素的数组\n```\n\n3.\n\
    ```javascript\nvar myCars=[\"Saab\",\"Volvo\",\"BMW\"];\n//示例 2 和 3 在功能上等效\n```\n\
    **注意**：如果你在数组内部指定数字或 true/false 值，那么变量类型将是 `Number` 或 `Boolean`，而不是 `String`。\n\
    \n## 访问数组\n你可以通过引用数组名称和索引号来引用数组中的特定元素。索引从 0 开始。\n\n以下代码行：\n```javascript\ndocument.write(myCars[0]);\n\
    ```\n\n结果为：\n`Saab`\n\n## 修改数组中的值\n要修改现有数组中的值，只需为给定索引处的元素指定新值即可。\n\n```javascript\n\
    myCars[0]=\"Opel\"; // 覆盖 myCars[0] 的当前值\n```\n\n现在，以下代码行：\n```javascript\ndocument.write(myCars[0]);\n\
    ```\n\n结果为：\n`Opel`\n\n## 示例\n以下示例演示了如何创建数组、为其赋值并将值写入到输出。\n\n你的结果显示在图 17.1 中。\n\
    \n**自己试一试 >>**\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar\
    \ mycars = new Array();\nmycars[0] = \"Saab\";\nmycars[1] = \"Volvo\";\nmycars[2]\
    \ = \"BMW\";\n\nfor (i=0;i<mycars.length;i++)\n{\ndocument.write(mycars[i] + \"\
    <br />\");\n}\n</script>\n</body>\n</html>\n```\n**图 17.1**\n\n以下示例演示了如何使用 `for...in`\
    \ 语句遍历数组的元素。\n\n你的结果显示在图 17.2 中。\n\n**自己试一试 >>**\n```html\n<html>\n<body>\n<script\
    \ type=\"text/javascript\">\nvar x;\nvar mycars = new Array();\nmycars[0] = \"\
    Saab\";\nmycars[1] = \"Volvo\";\nmycars[2] = \"BMW\";\n\nfor (x in mycars)\n{\n\
    document.write(mycars[x] + \"<br />\");\n}\n</script>\n</body>\n</html>\n```\n\
    **图 17.2**\n\n以下示例演示了如何合并两个数组。你的结果显示在图 17.3 中。\n\n```html\n<html>\n<body>\n<script\
    \ type=\"text/javascript\">\nvar parents = [\"Jani\", \"Tove\"];\nvar children\
    \ = [\"Cecilie\", \"Lone\"];\nvar family = parents.concat(children);\ndocument.write(family);\n\
    </script>\n</body>\n</html>\n```\n**图 17.3**\n\n以下示例演示了如何合并三个数组。你的结果显示在图 17.4\
    \ 中。\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar parents\
    \ = [\"Jani\", \"Tove\"];\nvar brothers = [\"Stale\", \"Kai Jim\", \"Borge\"];\n\
    var children = [\"Cecilie\", \"Lone\"];\nvar family = parents.concat(brothers,\
    \ children);\ndocument.write(family);\n</script>\n</body>\n</html>\n```\n**图 17.4**\n\
    \n以下示例向你展示如何将数组的所有元素连接一个字符串。你的结果显示在图 17.5 中。\n\n```html\n<html>\n<body>\n<script\
    \ type=\"text/javascript\">\nvar fruits = [\"Banana\", \"Orange\", \"Apple\",\
    \ \"Mango\"];\ndocument.write(fruits.join());\n</script>\n</body>\n</html>\n```\n\
    **图 17.5**\n\n以下示例演示了如何移除数组的最后一个元素。\n\n```html\n<html>\n<body>\n<script type=\"\
    text/javascript\">\nvar fruits = [\"Banana\", \"Orange\", \"Apple\", \"Mango\"\
    ];\ndocument.write(fruits.pop());\n</script>\n</body>\n</html>\n```\n\n以下示例演示了如何向数组末尾添加元素。\n\
    \n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar fruits = [\"\
    Banana\", \"Orange\", \"Apple\", \"Mango\"];\ndocument.write(fruits.push(\"Kiwi\"\
    ));\n</script>\n</body>\n</html>\n```\n\n以下示例向你展示如何反转数组元素的顺序。\n\n```html\n<html>\n\
    <body>\n<script type=\"text/javascript\">\nvar fruits = [\"Banana\", \"Orange\"\
    , \"Apple\", \"Mango\"];\ndocument.write(fruits.reverse());\n</script>\n</body>\n\
    </html>\n```\n\n以下示例演示了如何移除数组的第一个元素。\n\n```html\n<html>\n<body>\n<script type=\"\
    text/javascript\">\nvar fruits = [\"Banana\", \"Orange\", \"Apple\", \"Mango\"\
    ];\ndocument.write(fruits.shift());\n</script>\n</body>\n</html>\n```\n\n以下示例演示了如何使用\
    \ `slice()` 从数组选择元素。\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\"\
    >\nvar fruits = [\"Banana\", \"Orange\", \"Apple\", \"Mango\"];\ndocument.write(fruits.slice(0,1));\n\
    document.write(fruits.slice(1));\ndocument.write(fruits.slice(-2));\n</script>\n\
    </body>\n</html>\n```\n\n以下三个示例演示了如何使用 `sort()`。第一个 `sort()` 示例演示了如何按字母升序排序。\n\
    \n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar fruits = [\"\
    Banana\", \"Orange\", \"Apple\", \"Mango\"];\ndocument.write(fruits.sort());\n\
    </script>\n</body>\n</html>\n```\n\n下一个 `sort()` 示例演示了如何按数字升序排序。\n\n```html\n\
    <html>\n<body>\n<script type=\"text/javascript\">\nfunction sortNumber(a, b) {\n\
    \  return a - b;\n}\nvar n = [\"10\", \"5\", \"40\", \"25\", \"100\", \"1\"];\n\
    document.write(n.sort(sortNumber));\n</script>\n</body>\n</html>\n```\n\n第三个 `sort()`\
    \ 示例演示了如何按数字降序排序。\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\"\
    >\nfunction sortNumber(a, b) {\n  return b - a;\n}\nvar n = [\"10\", \"5\", \"\
    40\", \"25\", \"100\", \"1\"];\ndocument.write(n.sort(sortNumber));\n</script>\n\
    </body>\n</html>\n```\n"
