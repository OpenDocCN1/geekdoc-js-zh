    ### Detection


    The Navigator object contains information about the visitor’s browser. Almost
    everything in this tutorial works on JavaScript-enabled browsers. However, some
    things just’t work on older browsers. So, sometimes it can be very useful to detect
    the visitor’s browser.


    The Navigator object contains information about the visitor’s browser. We are
    going to look at two properties of the Navigator object:

    - `appName`—holds the name of the browser.

    - `appVersion`—holds, among other things, the version of the browser.


    The Navigator object can be used for this purpose. The Navigator object contains
    information about the visitor’s browser name, version, and more.


    23


    ![Image 86](index-135_1.png)


    **Learn JavaScript and w3schools**


    **The navigator Object**


    The Navigator object contains information about the visitor’s browser.


    The results are shown in Figure 21.1.


    **Try it yourself >>**


    ```html

    <html>

    <body>

    <script type="text//javascript"> var browser=navigator.appName;

    var b_version=navigator.appVersion;

    var version=parseFloat(b_version);

    document.write("Browser name: "+ browser); document.write("<br />");

    document.write("Browser version: "+ version);

    </script>

    </body>

    </html>

    ```


    **Figure 21.1**


    The variable `browser` in the preceding example holds the name of the browser,
    that is, “Netscape” or “Microsoft Internet Explorer.” The `appVersion` property
    in the preceding example returns a string that contains much more than just the
    version number, but for now we are only interested in the version number. To pull
    the version number out of the string, we are using a function called `parseFloat()`,
    which pulls the first thing that looks like a decimal number out of a string and
    returns it. **Tip** To find the version number in IE 5.0 and later, you will have
    to dig a little deeper into either the `appVersion` or `userAgent` property. The
    IE version will be in the form “MSIE x.x” so use a regular expression such as
    `/MSIE \d\.\d/.exec(navigator.userAgent)` to return a string containing the specific
    IE version.


