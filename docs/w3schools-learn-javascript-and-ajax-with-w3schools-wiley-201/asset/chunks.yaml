    \ 8.3 所示。\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\"> var x;\n\
    var mycars = [\"Saab\", \"Volvo\", \"BMW\"];\nfor (x in mycars)\n{\ndocument.write(mycars[x]\
    \ + \"<br />\");\n}\n</script>\n</body>\n</</html>\n```\n\n![Image 26](img/index-59_1.png)\n\
    **图 8.3**\n\n### `switch` 语句用于从多个代码块中选择一个执行。语法如下：\n\n```javascript\nswitch(expression)\n\
    {\n  case value1:\n    // 代码块 1\n    break;\n  case value2:\n    // 代码块 2\n  \
    \  break;\n  default:\n    // 默认代码块\n}\n```\n\n它的工作原理是：首先计算一个表达式 `n`（通常是一个变量）。然后将表达式的值与结构中的每个\
    \ `case` 值进行比较。如果匹配，则执行与用用相关的代码块。执行一直持续到 `switch` 块结束或遇到 `break` 语句。例如：\n\n```html\n\
    <html>\n<body>\n<script type=\"text/javascript\"> var i = 1;\nswitch (i)\n{\n\
    case 0:\ndocument.write(\"i == 0<br>\"); case 1:\ndocument.write(\"i == 1<br>\"\
    ); case 2:\ndocument.write(\"i == 2<br>\"); break;\ncase 3:\ndocument.write(\"\
    i == 3<br>\"); break;\ndefault:\ndocument.write(\"i > 3<br>\");\n}\n</script>\n\
    </body>\n</</html>\n```\n\n注意，当 `i == 1` 时，执行从 `case 1:` 开始，一直直到遇到 `break` 语句。\n\
