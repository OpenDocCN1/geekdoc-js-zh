    ## Scripts in <head>


    Scripts to be executed when they are called, or when an event is triggered, are
    placed in functions.


    Put your functions in the head section. This way they are all in one place, and
    they do not interfere with page content. The resulting alert box is shown in Figure
    1.6.


    **Try it yourself >>**


    ```html

    <html>

    <head>

    <script type="text/javascript"> function message()

    {

    alert("This alert box was called with the onload event");

    }

    </script>

    </head>

    <body onload="message()">


    </body>

    </html>

    ```


    **Figure 1.6**


    ## Scripts in <body>


    If you don’t want your script to be placed inside a function, or if your script
    should write page content, it should be placed in the body section. Figure 1.7
    shows the result.


