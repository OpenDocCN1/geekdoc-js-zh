    <script type=\"text/javascript\"> \nfunction show_alert()\n{\nalert(\"Hello! I\
    \ am an alert box!\");\n}\n</script>\n</head>\n<body>\n<input type=\"button\"\
    \ onclick=\"show_alert()\" value=\"Show alert box\" />\n</body>\n</</html>\n```\n\
    \n**图 9.1**\n\n**图 9.2**\n\n以下示例创建了一个带有换行的警告框。\n\n你的结果如图 9.3 和 9.4 所示。\n\n**自己试试\
    \ >>**\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"> \nfunction\
    \ disp_alert()\n{\nalert(\"Hello again! This is how we\" + '\\n' + \"add line\
    \ breaks to an alert box!\");\n}\n**54**\n![Image 31](img/index-66_1.png)\n![Image\
    \ 32](img/index-66_2.png)\n**第 9 章：JavaScript 弹出框**\n</script>\n</head>\n<body>\n\
    <input type=\"button\" onclick=\"disp_alert()\" value=\"Display alert box\" />\n\
    </body>\n</</html>\n```\n\n**图 9.3**\n\n**图 9.4**\n\n## confirm 确认框\n\n如果你想让用户验证或接受某些内容，通常使用确认框。\n\
    \n当确认框弹出时，用户必须点击“确定”或“取消”才能继续。\n\n如果用户点击“确定”，框将返回 `true`。如果用户点击“取消”，框将返回 `false`。\n\
    \n语法如下：\n\n```\nconfirm(\"sometext\");\n```\n\n你的结果如图 9.5 和 9.6 所示。\n\n**自己试试\
    \ >>**\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"> \nfunction\
    \ show_confirm()\n{\n*(继续)*\n**55**\n![Image 33](img/index-67_1.png)\n![Image\
