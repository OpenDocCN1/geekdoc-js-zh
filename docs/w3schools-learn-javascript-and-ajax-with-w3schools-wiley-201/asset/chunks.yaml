    ### Button Object (push Button)


    The `Button` object represents a `Button Object` (`Push Button`).


    For each `<button>` tag in an HTML document, a `Button` object is created.


    Inside an HTML `Button` element you can put content like text or images. This
    is the difference between this element and buttons created with the `input` element.


