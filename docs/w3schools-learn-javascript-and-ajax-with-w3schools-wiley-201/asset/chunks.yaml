    );\n}\nelse\n{\nalert(\"You pressed Cancel!\");\n}\n}\n</script>\n</head>\n<body>\n\
    <input type=\"button\" onclick=\"show_confirm()\" value=\"Show a confirm box\"\
    \ />\n</body>\n</</html>\n```\n\n**图 9.5**\n\n**图 9.6**\n\n## prompt 提示框\n\n如果你想让用户在页面上或从页面输入一个值，通常使用提示框。\n\
    \n当提示框弹出时，用户在输入值后必须点击“确定”或“取消”才能继续。\n\n如果用户点击“确定”，框将返回输入值。如果用户点击“取消”，框将返回 `null`。\n\
