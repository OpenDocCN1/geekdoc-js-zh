    \ milliseconds.\n\nSome examples of instantiating a date:\n```javascript\ntoday\
    \ = new Date()\nd1 = new Date(\"October 13, 1975 11:13:00\")\nd2 = new Date(79,5,24)\n\
    d3 = new Date(79,5,24,11,33,0)\n```\n\nFor a complete reference of all the properties\
    \ and methods that can be used with the `Date` object, go to the complete `Date`\
    \ object reference in Appendix A.\n\nThe reference contains a brief description\
    \ and examples of use for each property and method!\n\n### Set Dates\nWe can easily\
