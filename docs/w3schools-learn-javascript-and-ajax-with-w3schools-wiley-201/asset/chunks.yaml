    # Chapter 3: JavaScript variables


    ### In this Chapter

    - Do You Remember Algebra from School?

    - JavaScript Variables

    - Declaring (Creating) JavaScript Variables

    - Assigning Values to Undeclared JavaScript Variables

    - Redeclaring JavaScript Variables

    - JavaScript Arithmetic


    Variables are “containers” for storing information.


    ### Do you remember algebra from school?

    Do you remember algebra from school?

    `x = 5`, `y = 6`, `z = x + y`. Do you remember that a letter (like `x`) could
    be used to hold a value (like `5`), and that you could use the information given
    to calculate the value of `z` to be `11`?


    These letters are called **variables**. Variables can be used to hold values (`x
    = 5`) or expressions (`z = x + y`).


    ### JavaScript variables

    As with algebra, JavaScript variables are used to hold values or expressions.
    A variable can have a short name, like `x`, or a more descriptive name, like `carname`.


    **Rules for JavaScript variable names:**

    1. Variable names are case sensitive (`y` and `Y` are two different variables).

    2. Variable names must begin with a letter, the underscore character, or a dollar
    sign. (The `$` character is used primarily by code-generation tools.)

    3. Subsequent characters may be letter, number, underscore, or dollar sign.


    **Note**: There are 59 reserved words that are not legal variable names.


    **Tip**: Because JavaScript is case sensitive, variable names are case sensitive.


    A variable’s value can change during the execution of a script. You can refer
    to a variable by its name to display or change its value. Your result is shown
    in Figure 3.1.


    **Try it yourself >>**


    ```html

    <html>

    <body>

    <script type="text/javascript"> var firstname;

    firstname="Hege";

    document.write(firstname);

    document.write("<br />");

    firstname="Tove";

    document.write(firstname);

    </script>

    <p>The script above declares a variable, assigns a value to it, displays the value,
    changes the value, and displays the value again.</p>

    </body>

    </html>

    ```


    **Figure 3.1**


    ## Declaring (Creating) JavaScript variables

    Creating variables in JavaScript is most often referred to as “declaring” variables.


    You can declare JavaScript variables with the `var` statement: `var x;`


    ```javascript

    var x;

    var carname;

    ```


    After the declaration shown, the variables are empty (They have no values yet.).
    However you can also assign values to the variables when you declare them:

    ```javascript

    var x=5;

    var carname="Volvo";

    ```


    After the execution of the preceding statements, the variable `x` will hold the
    value `5`, and `carname` will hold the value `Volvo`.


    **Note**: When you assign a text value to a variable, use quotes around the value.


    ### Assigning values to Undeclared JavaScript variables

    If you assign values to variables that have not yet been declared, the variables
    will automatically be declared the following statements:

    ```javascript

    x=5;

    carname="Volvo";

    ```


    ### Redeclaring JavaScript variables

    If you redeclare a JavaScript variable, it will not lose its original value. After
    the execution of the preceding statements, the variable `x` still have the value
    of `5`. The value of `x` is not reset (or cleared) when you redeclare it:

    ```javascript

    var x;

    x=5;

    ```


    ### JavaScript arithmetic

    As with algebra, you can do arithmetic operations with JavaScript variables. If
    at least one variable on the right side of an assignment expression contains a
    string value, the result will be a string. Only if all the variables to the right
    of the assignment operator are numbers will the result a number.


    Arithmetic operators are used to perform arithmetic between variables and values.
    Given that `y = 5`, the following table explains the arithmetic operators.


    | Operator | Description | example | result |

    | :--- | :--- | :--- | :--- |

    | `+` | Addition | `x = y+2` | `7` |

    | `-` | Subtraction | `x = y-2` | `3` |

    | `*` | Multiplication | `x = y*2` | `10` |

    | `/` | Division | `x = y/2` | `2.5` |

    | `%` | Modulus (division remainder) | `x = y%2` | `1` |

    | `++` | Increment | `x = ++y` | `6` |

    | `--` | Decrement | `x = --y` | `4` |


    ## JavaScript assignment Operators

    Assignment operators are used to assign values to JavaScript variables. Given
    that `x = 10` and `y = 5`, the following table explains the assignment operators:


    | Operator | example | Same as | result |

    | :--- | :--- | :--- | :--- |

    | `=` | `x = y` | - | `5` |

    | `+=` | `x += y` | `x = x+y` | `15` |

    | `-=` | `x -= y` | `x = x-y` | `5` |

    | `*=` | `x *= y` | `x = x*y` | `50` |

    | `/=` | `x /= y` | `x = x/y` | `2` |

    | `%=` | `x %= y` | `x = x%y` | `0` |


    ### the + Operator Used on Strings

    The `+` operator also can be used to concatenate string variables or text values
    together. To concatenate two or more string variables together, use the `+` operator:

    ```javascript

    txt1="What a very";

    txt2="nice day";

    txt3=txt1+txt2;

    ```

    After the execution of the preceding statements, the variable `txt3` contains
    “What averyday”.


    To add a space between the two strings, insert a space into one of the strings:

    ```javascript

    txt1="What a very ";

    txt2="nice day";

    txt3=txt1+txt2;

    ```

    Or insert a space into the expression:

    ```javascript

    txt1="What a very";

    txt2="nice day";

    txt3=txt1+" "+txt2;

    ```

    After the execution of the preceding statements, the variable `txt3` contains:
    “What a very nice day”.


    ### adding Strings and Numbers

    The rule is as follows: If you add a number and a string, the result will be a
    string! Your results are shown in Figure 4.1.


    **Figure 4.1**


    # Chapter 4: JavaScript Operators


    **Try it yourself >>**


    ```html

    <html>

    <body>

    <script type="text/javascript"> x=5+5;

    document.write(x);

    document.write("<br />");

    x="5"+"5";

    document.write(x);

    document.write("<br />");

    x=5+"5";

    document.write(x);

