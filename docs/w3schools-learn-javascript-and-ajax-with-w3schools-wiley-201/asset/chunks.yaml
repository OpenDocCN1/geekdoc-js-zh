    ```\n\n![Image 23](img/index-54_1.png)\n\n**第 7 章：Javascript 循环**\n\n**图 7.3:\
    \ do...while 循环**\n\n`do...while` 循环是 `while` 循环的一种变体。该循环会执行代码块*一次*，然后只要指定的条件为真，它就会重复循环。\n\
    \n语法如下：\n\n```javascript\ndo\n{\n  要执行的代码\n}\nwhile (var<=endvalue);\n```\n\n\
