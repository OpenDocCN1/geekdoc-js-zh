    # Chapter 13: JavaScript Special Characters and Guidelines in this Chapter


    - Insert Special Characters

    - JavaScript Is Case Sensitive

    - White Space

    - Break up a Code Line


    In JavaScript, you can add special characters to a text string by using the backslash
    character. Also, when scripting with JavaScript, you should know some other important
    guidelines.


    ### insert Special Characters


    The backslash `\` is used to insert apostrophes, new lines, quotes, and other
    special characters into a text string.


    Look at the following JavaScript code:


    ```javascript

    var txt="We are the so-called "Vikings" from the north."; document.write(txt);

    ```


    In JavaScript, a string is started and stopped with either single or double quotes.
    This means that the preceding string will be chopped to `We are the so-called`.


    To solve this problem, you must place a backslash `\` before each double quote
    in “Viking”. This turns each double quote into a string literal: `var txt="We
    are the so-called \"Vikings\" from the north."; document.write(txt);`


    73

    learn JavaScript and ajax with w3schools JavaScript will now output the proper
    text string: `We are the so-called “Vikings” from the north.`.


    Here is another example:


    ```javascript

    document.write ("You \& I are singing!");

    ```

    The previous example will produce the following output: `You & I are singing!`


    The following table lists other special characters that can be added to a text
    string with the backslash sign:


    | Code | Outputs |

    | :--- | :--- |

    | `\''` | single quote |

    | `\"` | double quote |

    | `\&` | ampersand |

    | `\\` | backslash |

    | `\n` | new line |

    | `\r` | carriage return |

    | `\t` | tab |

    | `\b` | backspace |

    | `\f` | form feed |


    ### JavaScript is Case Sensitive


    A function named `myfunction` is not the same as `myFunction` and a variable named
    `myVar` is not the same as `myvar`.


    JavaScript is case sensitive; therefore, watch your capitalization closely when
    you create or call variables, objects, and functions.


    ### White Space


    JavaScript ignores extra spaces. You can add white space to your script to make
    it more readable. The following lines are equivalent:


    ```javascript

    name="Hege";

    name = "Hege";

    ```


    ### Break up a Code line


    Text in code statements contained within quotes is called a string literal. A
    string literal may not be broken across lines except by inserting the backslash
    character `\` at the point where you want to break the string: `document.write("Hello
    World!");`


    74

    Chapter 13: JavaScript Special Characters and Guidelines The following will generate
    an “unterminated string literal” script error: `document.write("Hello World!");`


    Another option is to use the concatenate operator `+` to break the string: `document.write("Hello
    "+ "World!");`


    Code statements may be broken across lines, but the backslash character must not
    be used in this case. The following is legal JavaScript:


    ```javascript

    document.write

    ("Hello "

    +

    "World!"

    );

    ```


    As a rule, break code statements or string literals across lines only when the
    length of the line or literal makes it difficult to read.


    You can break up a code line within a text string with a backslash. The following
    example will be displayed properly:


    ```javascript

    document.write("Hello \

    World!");

    ```


    However, you cannot break up a code line like this: `document.write \ ("Hello
    World!");`


