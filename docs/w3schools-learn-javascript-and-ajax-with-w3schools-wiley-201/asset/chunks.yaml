    **Note**: If the `value` parameter cannot be converted into a number, it returns
    `NaN` (Not-a-Number).


    ## number Object properties


    | property | description |

    | :--- | :--- |

    | `constructor` | Returns the function that created the `Number` object’s prototype
    |

    | `MAX_VALUE` | Returns the largest number possible in JavaScript |

    | `MIN_VALUE` | Returns the smallest number possible in JavaScript |

    | `NEGATIVE_INFINITY` | Represents negative infinity (returned on overflow) |

    | `POSITIVE_INFINITY` | Represents infinity (returned on overflow) |

    | `prototype` | Allows you to add properties and methods to an object |


    ## number Object Methods


    | Method | description |

    | :--- | :--- |

    | `toExponential(x)` | Converts a number to exponential notation |

    | `toFixed(x)` | Formats a number with `x` number of digits after the decimal
    point |

    | `toPrecision(x)` | Formats a number to `x` significant digits |

    | `toString()` | Converts a `Number` object to a string |

    | `valueOf()` | Returns the primitive value of a `Number` object |


    ## String Object


    The `String` object is used to manipulate a stored piece of text. `String` objects
    are created with `new String()`.


    The syntax is as follows:


    ```javascript

    var txt = new String(string);

    ```

    or more simply:


    ```javascript

    var txt = string;

    ```


    For a tutorial about the `String` object, see Chapter 15, “JavaScript String Object.”


    ## String Object properties


    | property | description |

    | :--- | :--- |

    | `constructor` | Returns the function that created the `String` object’s prototype
    |

    | `length` | Returns the length of a string |

    | `prototype` | Allows you to add properties and methods to an object |


    ## Appendix A: JavaScript Objects - String Object Methods


    | Method | description |

    | :--- | :--- |

    | `charAt()` | Returns the character at the specified index |

    | `charCodeAt()` | Returns the Unicode of the character at the specified index
    |

    | `concat()` | Joins two or more strings, and returns a copy of the joined strings
    |

    | `fromCharCode()` | Converts Unicode values to characters |

    | `indexOf()` | Returns the position of the first found occurrence of a specified
    value in a string |

    | `lastIndexOf()` | Returns the position of the last found occurrence of a specified
    value in a string |

    | `match()` | Searches for a match within the string using a regular expression.
    Returns an array or null if no matches found. |

    | `replace()` | Searches for a match between a substring (or regular expression)
    and a string, and replaces the matched substring with a new substring |

    | `search()` | Searches for a match between a regular expression and a string,
    and returns the position of the match or –1 if not found |

    | `slice()` | Extracts a part of a string and returns a new string |

    | `split()` | Splits a string into an array of substrings |

    | `substr()` | Extracts the characters from a string, beginning at a specified
    start position through the specified number of characters |

    | `substring()` | Extracts the characters from a string, between two specified
    indices |

    | `toLowerCase()` | Converts a string to lowercase letters |

    | `toUpperCase()` | Converts a string to uppercase letters |

    | `valueOf()` | Returns the primitive value of a `String` object |


    ## String HTML Wrapper Methods


    The HTML wrapper methods return the string wrapped inside the appropriate HTML
    tag.


    | Method | description |

    | :--- | :--- |

    | `anchor()` | Creates an anchor |

    | `big()` | Displays a string using a big font |

    | `blink()` | Displays a blinking string |

    | `bold()` | Displays a string in bold |

    | `fixed()` | Displays a string using a fixed-pitch font |

    | `fontcolor()` | Displays a string using a specified color |

    | `fontsize()` | Displays a string using a specified size |

    | `italics()` | Displays a string in italic |

    | `link()` | Displays a string as a hyperlink |

    | `small()` | Displays a string using a small font |

    | `strike()` | Displays a string with a strikethrough |

    | `sub()` | Displays a string as subscript text |

    | `sup()` | Displays a string as superscript text |


    ## Learn JavaScript and Ajax with w3schools - regexp Object


    A regular expression is an object that describes a pattern of characters. Regular
    expressions are used to perform pattern-matching and search-and-replace functions
    on text.


    The syntax is as follows:


    ```javascript

    var txt=new RegExp(pattern,modifiers);

    ```

    or more simply:


    ```javascript

    var txt=/pattern/modifiers;

    ```


    - `Pattern` specifies the pattern of an expression.

    - `Modifiers` specify whether a search should be global, case-sensitive, and so
    on.


    For a tutorial about the `RegExp` object, see Chapter 20, “JavaScript RegExp Object.”


    ### Modifiers


    Modifiers are used to perform case-insensitive and global searches:


    | Modifier | description |

    | :--- | :--- |

    | `i` | Perform case-insensitive matching |

    | `g` | Perform a global match (find all matches rather than stopping after the
    first match) |

    | `m` | Perform multiline matching |


    ### Brackets


    Brackets are used to find a range of characters:


    | expression | description |

    | :--- | :--- |

    | `[abc]` | Match any character between the brackets |

    | `[^abc]` | Match any character not between the brackets |

    | `[0-9]` | Match any digit from 0 to 9 |

    | `[a-z]` | Match any character from lowercase a to lowercase z |

    | `[A-Z]` | Match any character from uppercase A to uppercase Z |

    | `[a-Z]` | Match any character from lowercase a to uppercase Z |

    | `[adgk]` | Match any character in the given set |

    | `[^adgk]` | Match any character outside the given set |

    | `[red|blue|green]` | Match any of the alternatives specified |


    ## Appendix A: JavaScript Objects - Metacharacters


    Metacharacters are characters with a special meaning:


    | Metacharacter | description |

    | :--- | :--- |

    | `.` | Find a single character, except newline or line terminator |

    | `\w` | Match any alphanumeric character, including the underscore |

    | `\W` | Match any nonalphanumeric character |

    | `\d` | Find a digit |

    | `\D` | Find a nondigit character |

    | `\s` | Find a single whitespace character |

    | `\S` | Find a single nonwhitespace character |

    | `\b` | Match at the beginning/end of a word |

    | `\B` | Match not at the beginning/end of a word |

    | `\0` | Find a NUL character |

    | `\n` | Find a new line |

    | `\f` | Find a form feed |

    | `\r` | Find a carriage return |

    | `\t` | Find a tab |

    | `\v` | Find a vertical tab |

    | `\xxx` | Find the character specified by an octal number |

    | `\xdd` | Find the character specified by a hexadecimal number |

    | `\uxxxx` | Find the Unicode character specified by a hexadecimal number |


    ### Quantifiers


    | Quantifier | description |

    | :--- | :--- |

    | `+` | Match the preceding character 1 or more times |

    | `*` | Match the preceding character 0 or more times |

    | `?` | Match the preceding character 0 or 1 time |

    | `{x}` | Where `x` is a positive integer, matches exactly `x` occurrences of
    the preceding character |

    | `{x,y}` | Where `x` and `y` are positive integers, matches at least `x` and
    no more than `y` occurrences of the preceding character |

    | `{x,}` | Where `x` is a positive integer, matches at least `x` occurrences of
    the preceding character |

    | `n$` | Match any string with `n` at the end of it |

    | `^n` | Match any string with `n` at the beginning of it |

    | `n(?=m)` | Match `n` only if followed by `m` |

    | `n(?|m)` | Match `n` only if not followed by `m` |


    ## regexp Object properties


    | property | description |

    | :--- | :--- |

    | `global` | Specifies if the `g` modifier is set |

    | `ignoreCase` | Specifies if the `i` modifier is set |

    | `lastIndex` | The index at which to start the next match |

    | `multiline` | Specifies if the `m` modifier is set |

    | `source` | The text of the `RegExp` pattern |


    ## regexp Object Methods


    | Method | description |

    | :--- | :--- |

    | `compile()` | Compiles a regular expression |

    | `exec()` | Tests for a match in a string. Returns a result array |

    | `test()` | Tests for a match in a string. Returns true or false |


    ## JavaScript Global properties and Functions


    The JavaScript global properties and functions can be used with all the built-in
    JavaScript objects.


    ### JavaScript Global properties


    | property | description |

    | :--- | :--- |

    | `Infinity` | A numeric value that represents positive/negative infinity |

    | `NaN` | “Not-a-Number” value |

    | `undefined` | Indicates that a variable has not been assigned a value |


    ### JavaScript Global Functions


    | Function | description |

    | :--- | :--- |

    | `decodeURI()` | Decodes a URI |

    | `decodeURIComponent()` | Decodes a URI component |

    | `encodeURI()` | Encodes a URI |

    | `encodeURIComponent()` | Encodes a URI component |

    | `escape()` | Encodes a string |

    | `eval()` | Evaluates a string and executes it as if it were a JavaScript `eval()`
    |

