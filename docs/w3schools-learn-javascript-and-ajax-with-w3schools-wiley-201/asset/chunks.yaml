- fmt: "\nThe function will return the product of these two parameters.\n\n## Figure\
    \ 10.6\n### the Lifetime of JavaScript variables\n\nIf you declare a variable\
    \ within a function, the variable can be accessed only within that function. When\
    \ you exit the function, the variable is destroyed. These variables are called\
    \ `local variables`. You can have local variables with the same name in different\
    \ functions, because each is recognized only by the function in which it is declared.\n\
    \nIf you declare a variable outside a function, all the functions on your page\
    \ can access it. These variables are called `global variables`.\n\nThe lifetime\
    \ of these variables starts when they are declared and ends when the page is closed.\n\
    \n## Chapter 11\n### JavaSCript eventS\n\n### in this Chapter\n- `onLoad` and\
    \ `onUnload`\n- `onFocus`, `onBlur`, and `onChange`\n- `onSubmit`\n- `onMouseOver`\
    \ and `onMouseOut`\n- `onClick`\n\nEvents are actions that can be detected by\
    \ JavaScript.\n\nBy using JavaScript, we have the ability to create dynamic Web\
    \ pages.\n\nEvery element on a Web page has certain events that can trigger a\
    \ JavaScript. For example, we can use the `onClick` event of a button element\
    \ to indicate that a function will run when a user clicks the button. We define\
    \ the events in the HTML tags.\n\nExamples of events:\n- A mouse click\n- A Web\
    \ page or an image loading\n- Mousing over a hot spot on the Web page\n- Selecting\
    \ an input field in an HTML form\n- Submitting an HTML form\n\n**Note**: Events\
    \ are normally used in combination with functions, and the function will not be\
    \ executed before the event occurs!\n\n### onLoad and onUnload\nThe `onLoad` and\
    \ `onUnload` events are triggered when the user enters or leaves the page.\n\n\
    The `onLoad` event is often used to check the visitor’s browser type and browser\
    \ version and load the proper version of the Web page based on the information.\n\
    \n### Chapter 11: JavaScript events\nBoth the `onLoad` and `onUnload` events often\
    \ are used to deal with cookies that should be set when a user enters or leaves\
    \ a page. For example, you could have a popup asking for the user’s name upon\
    \ his first arrival to your page. The name is then stored in a cookie. Next time\
    \ the visitor arrives at your page, you could have another popup saying something\
    \ like: “Welcome John Doe!”.\n\n### onFocus, onBlur, and onChange\nThe `onFocus`,\
    \ `onBlur`, and `onChange` events are often used in combination with validation\
    \ of form fields.\n\nThe `onFocus` and `onBlur` events are complementary and are\
    \ caused by the user clicking outside of the current window, frame, or form element\
    \ or using the `Tab` key to move among fields or elements. When the user leaves\
    \ an element, that element triggers a `blur` event. When the user moves to a new\
    \ element, that element triggers a `focus` event.\n\nFollowing is an example of\
    \ how to use the `onChange` event. The `checkEmail()` function will be called\
    \ whenever the user changes the content of the field:\n\n```html\n<input type=\"\
    text\" size=\"30\" id=\"email\" onchange=\"checkEmail()\">\n```\n\n### onSubmit\n\
    The `onSubmit` event may be used to validate form fields before submitting the\
    \ form.\n\n**tip**: Because the programmer controls the function executed on `onSubmit`,\
    \ he can validate any, all, or no inputs as he sees fit.\n\nFollowing is an example\
    \ of how to use the `onSubmit` event. The `checkForm()` function will be called\
    \ when the user clicks the Submit button in the form. If the field values are\
    \ not accepted, the submit should be cancelled. The function `checkForm()` returns\
    \ either `true` or `false`. If it returns `true`, the form will be submitted,\
    \ otherwise the submit will be cancelled:\n\n```html\n<form method=\"post\" action=\"\
    xxx.htm\" onsubmit=\"return checkForm()\">\n```\n\n### onMouseOver and onMouseOut\n\
    `onMouseOver` and `onMouseOut` often are used to create Rollover buttons.\n\n\
    Following is an example of an `onMouseOver` event. An alert box appears when an\
    \ `onMouseOver` event is detected:\n\n```html\n<a href=\"http://www.w3schools.com\"\
    \ onmouseover=\"alert('An onMouseOver event');return false\">\n<img src=\"w3s.gif\"\
    \ alt=\"w3schools\" />\n</a>\n```\n\n### onClick\nThe `onClick` event occurs when\
    \ the user mouse clicks on a visible element on the screen. The following example\
    \ could be used to translate text on a page when requested by the user:\n\n```html\n\
    <input type=\"button\" name=\"language\" value=\"Click for Spanish\" onclick=\"\
    translate()\">\n```\n\n## Chapter 12\n### JavaScript\n### try…Catch and throw\
    \ statements\n\n### in this Chapter\n- JavaScript—Catching Errors\n- The `try...catch`\
    \ Statement\n- The `throw` Statement\n\n### javascript—Catching errors\nWhen browsing\
    \ Web pages on the Internet, we all have seen a JavaScript alert box telling us\
    \ there is a runtime error and asking “Do you wish to debug?” Error messages like\
    \ this may be useful for developers but not for users. When users see errors,\
    \ they often leave the Web page.\n\nThis chapter teaches you how to catch and\
    \ handle JavaScript error messages so you don’t lose your audience.\n\n### the\
    \ try...catch statement\nThe `try…catch` statement enables you to trap errors\
    \ that occur during the execution of a block of code. The `try` block contains\
    \ the code to be run, and the `catch` block contains the code to be executed if\
    \ an error occurs.\n\nThe syntax is as follows:\n\n```javascript\ntry\n{\n   \
    \ //Run some code here\n}\ncatch(err)\n{\n    //Handle errors here\n}\n```\n\n\
    **note**: Note that `try...catch` is written in lowercase letters. Using uppercase\
    \ letters will generate a JavaScript error!\n\nThe following example is supposed\
    \ to alert “Welcome guest!” when the button is clicked. However, there’s a typo\
    \ in the `message()` function. `alert()` is misspelled as `adddlert()`. A JavaScript\
    \ error occurs. The `catch` block catches the error and executes a custom code\
    \ to handle it. The code displays a custom error message informing the user what\
    \ happened. Your results are shown in Figures 12.1 and 12.2.\n\n**Try it yourself\
    \ >>**\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\">\nvar txt=\"\
    \";\n\nfunction message()\n{\n    try\n    {\n        adddlert(\"Welcome guest!\"\
    );\n    }\n    catch(err)\n    {\n        txt=\"There was an error on this page.\\\
    n\\n\"; \n        txt+=\"Error message: \" + err.message + \"\\n\\n\"; \n    \
    \    txt+=\"Click OK to continue.\\n\\n\";\n        alert(txt);\n    }\n}\n</script>\n\
    </head>\n```\n\nThe next example uses a `confirm` box to display a custom message\
    \ telling users they can click OK to continue or click Cancel to go to the homepage.\
    \ If the `confirm` method returns `false`, the user clicked Cancel, and the code\
    \ redirects the user. If the `confirm` method returns `true`, the code does nothing.\
    \ Your results are shown in Figures 12.3 and 12.4.\n\n**Try it yourself >>**\n\
    \n```html\n<html>\n<head>\n<script type=\"text/javascript\">\nvar txt=\"\";\n\n\
    function message()\n{\n    try\n    {\n        adddlert(\"Welcome guest!\");\n\
    \    }\n    catch(err)\n    {\n        txt=\"There was an error on this page.\\\
    n\\n\"; \n        txt+=\"Click OK to continue viewing this page,\\n\"; \n    \
    \    txt+=\"or Cancel to return to the home page.\\n\\n\"; \n        if(!confirm(txt))\n\
    \        {\n            document.location.href=\"http://www.w3schools.com/\";\n\
    \        }\n    }\n}\n</script>\n</head>\n<body>\n<input type=\"button\" value=\"\
    View message\" onclick=\"message()\" />\n</body>\n</html>\n```\n\n### Chapter\
    \ 12: javascript try…Catch and throw statements\n### the throw statement\nThe\
    \ `throw` statement allows you to create an exception. If you use this statement\
    \ together with the `try...catch` statement, you can control program flow and\
    \ generate accurate error messages.\n\nThe syntax is as follows:\n\n```javascript\n\
    throw(exception)\n```\n"
