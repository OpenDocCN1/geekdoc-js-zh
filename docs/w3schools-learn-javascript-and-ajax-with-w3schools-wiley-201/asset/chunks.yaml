    ### document Object

    Each HTML document loaded into a browser window becomes a `Document` object. The
    `Document` object provides access to all HTML elements in a page, from within
    a script.


    **Tip**: The `Document` object is also part of the `Window` object and can be
    accessed through the `window.document` property.


    ### document Object collections

    | collection | description | W3c |

    | :--- | :--- | :--- |

    | `anchors[]` | Returns an array of all the anchors in the document | Yes |

    | `forms[]` | Returns an array of all the forms in the document | Yes |

    | `images[]` | Returns an array of all the images in the document | Yes |

    | `links[]` | Returns an array of all the links in the document | Yes |


    ### document Object properties

    | property | description | W3c |

    | :--- | :--- | :--- |

    | `cookie` | Returns all name/value pairs of cookies in the document | Yes |

    | `documentMode` | Returns the mode used by the browser to render the document
    | No |

    | `domain` | Returns the domain name of the server that loaded the document |
    Yes |

    | `lastModified` | Returns the date and time the document was last modified |
    No |

    | `readyState` | Returns the (loading) status of the document | No |

    | `document` | Returns the URL of the document that loaded the current referrer
    | Yes |

    | `title` | Sets or returns the title of the document | Yes |

    | `URL` | Returns the full URL of the document | Yes |


    ### document Object Methods

    | Method | description | W3c |

    | :--- | :--- | :--- |

    | `document.open()` | Closes the output stream previously opened with `close()`
    | Yes |

    | `getElementById()` | Accesses the first element with the specified id | Yes
    |

    | `getElementsByName()` | Accesses all elements with a specified name | Yes |

    | `getElementsByTagName()` | Accesses all elements with a specified tagname |
    Yes |

    | `document.write()` or `document.writeln()` | Opens an output stream to collect
    the output from `open()` | Yes |

    | `document` | Writes HTML expressions or JavaScript code to a `write()` | Yes
    |

    | `each` | Same as `write()`, but adds a newline character after `writeln()` |
    Yes |


    ### event Object

    The `Event` object gives you information about an event that has occurred. The
    `Event` object represents the state of an event, such as the element in which
    the event occurred, the state of the keyboard keys, the location of the mouse,
    and the state of the mouse buttons. Events are normally used in combination with
    functions, and the function will not be executed before the event occurs!


    ### event Handlers

    New to HTML 4.0 was the ability to let HTML events trigger actions in the browser,
    like starting a JavaScript when a user clicks on an HTML element. Following is
    a list of the attributes that can be inserted into HTML tags to define event actions.


    | Attribute | The event occurs when... | ie | F | O | W3c |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | `onblur` | An element loses focus | | | | Yes |

    | `onchange` | The content of a field changes | | | | Yes |

    | `onclick` | Mouse clicks an object | | | | Yes |

    | `ondblclick` | Mouse double-clicks an object | | | | Yes |

    | `onerror` | An error occurs when loading a document or an image | | | | Yes
    |

    | `onfocus` | An element gets focus | | | | Yes |

    | `onkeydown` | A keyboard key is pressed | | | | Yes |

    | `onkeypress` | A keyboard key is pressed or held down | | | | Yes |

    | `onkeyup` | A keyboard key is released | | | | Yes |

    | `onload` | A page or an image is finished loading | | | | Yes |

    | `onmousedown` | A mouse button is pressed | | | | Yes |

    | `onmousemove` | The mouse is moved | | | | Yes |

    | `onmouseout` | The mouse is moved off an element | | | | Yes |

    | `onmouseover` | The mouse is moved over an element | | | | Yes |

    | `onmouseup` | A mouse button is released | | | | Yes |

    | `onresize` | A window or frame is resized | | | | Yes |

    | `onselect` | Text is selected | | | | Yes |

    | `onunload` | The user exits the page | | | | Yes |


    ### Mouse / Keyboard Attributes

    | property | description | ie | F | O | W3c |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | `altKey` | Returns whether the Alt key was pressed when an `altKey` was triggered
    | | | | Yes |

    | `button` | Returns which mouse button was clicked when an `button` was triggered
    | | | | Yes |

    | `clientX` | Returns the horizontal coordinate of the mouse | | | | Yes |

    | `clientY` | Returns the vertical coordinate of the mouse | | | | Yes |

    | `ctrlKey` | Returns whether the Ctrl key was pressed when an `ctrlKey` was triggered
    | | | | Yes |

    | `metaKey` | Returns whether the meta key was pressed when an `metaKey` was triggered
    | | | | Yes |

    | `relatedTarget` | Returns the element related to the event | | | | Yes |

    | `screenX` | Returns the horizontal coordinate of the mouse | | | | Yes |

    | `screenY` | Returns the vertical coordinate of the mouse | | | | Yes |

    | `shiftKey` | Returns whether the Shift key was pressed when an `shiftKey` was
    triggered | | | | Yes |


    ### Other event Attributes

    | property | description | ie | F | O | W3c |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | `bubbles` | Returns a Boolean value that indicates whether event is a bubbling
    event | | | | Yes |

    | `cancelable` | Returns a Boolean value that indicates whether event can have
    its default action prevented | | | | Yes |

    | `currentTarget` | Returns the element whose event listeners are registered |
    | | | |

    | `eventPhase` | Returns which phase of the event flow is currently being evaluated
    | | | | |

    | `target` | Returns the element that triggered the event | | | | |

    | `timeStamp` | Returns the time stamp, in milliseconds, from the epoch (system
    start or event trigger) | | | | |

    | `type` | Returns the name of the event | | | | Yes |


    ### element Object

    The collections, properties, methods, and events in the following tables can be
    used on all HTML elements.


    ### element Object collections

    | collection | description | W3c |

    | :--- | :--- | :--- |

    | `attributes[]` | Returns an array of the attributes of an element | Yes |

    | `childNodes[]` | Returns an array of child nodes for an element | Yes |


    ### element Object properties

    | property | description | W3c |

    | :--- | :--- | :--- |

    | `accessKey` | Sets or returns an accesskey for an element | Yes |

    | `className` | Sets or returns the class attribute of an element | Yes |

    | `clientHeight` | Returns the viewable height of the content on a page (including
    borders, margins, or scrollbars) | Yes |

    | `clientWidth` | Returns the viewable width of the content on a page (including
    borders, margins, or scrollbars) | Yes |

    | `dir` | Sets or returns the text direction of an element | Yes |

    | `disabled` | Sets or returns the disabled attribute of an element | Yes |

    | `firstChild` | Returns the first child of an element | Yes |

    | `height` | Sets or returns the height attribute of an element | Yes |

    | `id` | Sets or returns the id of an element | Yes |

