    \    // code for IE6, IE5\n    return new ActiveXObject(\"Microsoft.XMLHTTP\"\
    );\n  }\n  return null;\n}\n```\n\n### AJAX 服务器页面\n\n由前面的 JavaScript 脚本调用的服务器页面是一个名为\
    \ `getcustomer.asp` 的 ASP 文件。该 ASP 页面使用 VBScript 用于于信息服务器 (IIS)。它可以很容易重写为 PHP\
    \ 或或其他服务器语言。\n\n该代码对数据库执行查询并以 HTML 表格返回结果：\n\n```asp\n<%\nresponse.expires=-1\n\
    sql=\"SELECT * FROM CUSTOMERS WHERE CUSTOMERID=\"\nsql=sql & \"'\" & request.querystring(\"\
    q\") & \"'\"\nset conn=Server.CreateObject(\"ADODB.Connection\") \nconn.Provider=\"\
    Microsoft.Jet.OLEDB.4.0\"\nconn.Open(Server.Mappath(\"/db/northwind.mdb\")) \n\
    set rs=Server.CreateObject(\"ADODB.recordset\") \nrs.Open sql,conn\nresponse.write(\"\
    <table>\")\ndo until rs.EOF\n  for each x in rs.Fields\n    response.write(\"\
    <tr><td><b>\" & x.name & \"</b></td>\") \n    response.write(\"<td>\" & x.value\
    \ & \"</td></tr>\") \n  next\n  rs.MoveNext\nloop\nresponse.write(\"</table>\"\
    )\n%>\n```\n\n### AJAX XML 示例\n\n#### 本章节\n- AJAX JavaScript\n- AJAX 服务器页面\n-\
    \ XML 文件\n\nAJAX 可用于与 XML 文件进行交互通信。图 34.1 中的示例演示了 页面如何通过 AJAX 技术从 XML 文件获取信息。\n\
    \n前面的示例包含一个简单的 HTML 表单和一个指向 JavaScript 的链接：\n\n```html\n<<html>\n<head>\n  <script\
