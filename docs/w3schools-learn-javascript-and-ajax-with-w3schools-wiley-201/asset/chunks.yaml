    {

    var t=setTimeout("alert(''I am displayed after 3 seconds!'')",3000);

    }

    </script>

    </head>

    <body>

    <form>

    <input type="button" value="Display alert box!"

    onClick="timedMsg()" />

    </form>

    </body>

    </html>

