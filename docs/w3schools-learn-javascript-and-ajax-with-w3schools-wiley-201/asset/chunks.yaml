    # Chapter 14: JavaScript Objects Intro


    ### In this Chapter


    - Object-Oriented Programming

    - Properties

    - Methods


    JavaScript as a programming language has strong object-oriented capabilities.
    An Object-Oriented (OOL) language enables you to model data using objects consisting
    of properties and methods that operate on those properties.


    ### Object-Oriented programming


    Creating your own objects is explained later in the section “Advanced JavaScript.”
    We start by looking at the built-in JavaScript objects and how they are used.
    The next pages explain each built-in JavaScript object in detail. Note that an
    object is just a special kind of data. An object has properties and methods.


    ### properties


    Properties are the values associated with an object. In the following example,
    we use the `length` property of the `String` object to return the number of characters
    in a string:


    ```html

    <script type="text/javascript"> var txt="Hello World!";

    document.write(txt.length);

    </script>

    ```


    79

    Learn JavaScript and Ajax with w3schools

    The output of the previous code will be `12`


    ### Methods


    Methods are the actions that can be performed on objects. In the following example,
    we use the `toUpperCase()` method of the `String` object to display a text in
    uppercase letters:


    ```html

    <script type="text/javascript"> var str="Hello world!";

    document.write(str.toUpperCase());

    </script>

    ```

    The output of the previous code will be `HELLO WORLD!`


    80

    # Chapter 15: JavaScript String Object


    ### in this Chapter


    - String Object

    - Examples


    The String object is used to manipulate a stored piece of text.


    The following example uses the `length` property of the `String` object to find
    the length of a string:


    ```javascript

    var txt="Hello world!";

    document.write(txt.length);

    ```

    The preceding code will result in the output `12`


    The following example uses the `toUpperCase()` method of the `String` object to
    convert a string to uppercase letters:


    ```javascript

    var txt="Hello world!";

    document.write(txt.toUpperCase());

    ```

    The preceding code will result in the output `HELLO WORLD!`


