    .... Your AJAX script goes here ...


    }


    </script>


    </head>


    The next chapters explain the script (using AJAX) and how to make the application
    work.


    The various supporting files and images, including the test1.txt and test2.txt
    files, are accessed when completing this tutorial online at www.


