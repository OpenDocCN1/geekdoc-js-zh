    # Chapter 20: JavaScript regexp


    ## The RegExp Object


    ### In this Chapter

    - What Is RegExp?

    - RegExp Modifiers

    - `test()`

    - `exec()`


    `RegExp` is short for regular expression.


    ### What is regexp?


    A regular expression is an object that describes a pattern of characters. When
    you search in a text, you can use a pattern to describe what you are searching
    for.


    A simple pattern can be a single character. A more complicated pattern can consist
    of more characters and can be used for parsing, format checking, substitution,
    and more.


    Regular expressions are used to perform powerful pattern-matching and search-and-replace
    functions on text.


    The syntax is as follows:


    `var txt=new RegExp(pattern,modifiers);`


    or more simply:


    `var txt=/pattern/modifiers;`


    115


    ![Image 81](index-127_1.png)


    **Learn JavaScript and ajax with w3schools**


    The syntax follows a couple of general guidelines:

    - The pattern specifies the pattern of an expression.

    - The modifiers specify whether a search should be global, case-sensitive, and
    so on.


    ### regexp Modifiers


    Modifiers are used to perform case-insensitive and global searches.


    - The `i` modifier is used to perform case-insensitive matching.

    - The `g` modifier is used to perform a global match (find all matches rather
    than stopping after the first match).


    The following example demonstrates how to do a case-insensitive search for “w3schools”
    in a string:


    `var str="Visit W3Schools";`

    `var patt1=/w3schools/i;`


    Your results are shown in Figure 20.1.


    **Try it yourself >>**


    ```html

    <html>

    <body>

    <script type="text/javascript"> var str = "Visit W3Schools";

    var patt1 = /w3schools/i;

    document.write(str.match(patt1));

    </script>

    </body>

    </html>

    ```


    **Figure 20.1**


