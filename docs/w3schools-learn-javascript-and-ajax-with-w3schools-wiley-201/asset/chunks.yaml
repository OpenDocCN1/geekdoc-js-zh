    ## AJAX


    AJAX 等于异步 JavaScript 和 XML。


    AJAX 基于 JavaScript 和 `HTTP` 请求。AJAX 并不是一种新的编程语言，而是使用现有标准的新方法。


    AJAX 是与 Web 服务器进行数据交换并更改网页部分内容而无需刷新整个页面的艺术。


    ## 你应该已经知道的


