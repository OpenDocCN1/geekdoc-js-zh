    | `valueOf()` | Returns the primitive value of the Date object |


    ## Math Object


    The `Math` object allows you to perform mathematical tasks. `Math` is not a constructor.
    All properties/methods of `Math` can be called using `Math` without creating it.
    The syntax is as follows:


    ```javascript

    var x = Math.PI; // Returns PI

    var y = Math.sqrt(16); // Returns the square root of 16

    ```


    For a tutorial about the `Math` object, see Chapter 19, “JavaScript Math Object.”


    206


    ### Math properties


    | property | Description |

    | :--- | :--- |

    | `E` | Returns Euler’s number, the base of the natural logarithm (approx. 2.718)
    |

    | `PI` | Returns PI (approx. 3.14159) |


    ### Math Methods


    | Method | Description |

    | :--- | :--- |

    | `abs(x)` | Returns the absolute value of `x` |

    | `acos(x)` | Returns the arccosine of `x`, in radians |

    | `asin(x)` | Returns the arcsine of `x`, in radians |

    | `atan(x)` | Returns the arctangent of `x` as a numeric value between –PI/2 and
    PI/2 |

    | `atan2(y,x)` | Returns the arctangent of the quotient of its arguments |

    | `ceil(x)` | Returns `x`, rounded upward to the nearest integer |

    | `cos(x)` | Returns the cosine of `x` (`x` is in radians) |

    | `exp(x)` | Returns the value of `E` to the power of `x` |

    | `floor(x)` | Returns `x`, rounded downward to the nearest integer |

    | `log(x)` | Returns the natural logarithm (base E) of `x` |

    | `max(x,y,z,...,n)` | Returns the number with the highest value |

    | `min(x,y,z,...,n)` | Returns the number with the lowest value |

    | `pow(x,y)` | Returns the value of `x` to the power of `y` |

    | `random()` | Returns a random number between 0 and 1 |

    | `round(x)` | Rounds `x` to the nearest integer |

    | `sin(x)` | Returns the sine of `x` (`x` is in radians) |

    | `sqrt(x)` | Returns the square root of `x` |

    | `tan(x)` | Returns the tangent of `x` (`x` is in radians) |


    ## number Object


    The `Number` object is an object wrapper for primitive numeric values. `Number`
    objects are created with `new Number()`.


    The syntax is as follows:


    ```javascript

    var num = new Number(value);

    ```


