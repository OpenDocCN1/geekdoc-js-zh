    ❑ The stateChanged() Function


    ❑ AJAX Suggest Source Code


    AJAX can be used to create more interactive applications.


    The following AJAX example demonstrates how a Web page can communicate with a
    Web server while a user enters data into an HTML form.


    For this example, use the name “Kelly.” Note what happens as you type a name in
    the input field, as shown in Figure 32.1.


    **Figure 32.1**


    **the htML Form**


    The preceding form has the following HTML code:


    <form>


    First Name: <input type="text" id="txt1"


    onkeyup="showHint(this.value)" />


    </form>


    <p>Suggestions: <span id="txtHint"></span></p> It is just a simple HTML form with
    an input field called "txt1".


    **175**


    **Learn JavaScript and Ajax with w3schools** An event attribute for the input
    field defines a function to be triggered by the onkeyup event.


    The paragraph below the form contains a span called "txtHint". The span is used
    as a placeholder for data retrieved from the Web server.'
