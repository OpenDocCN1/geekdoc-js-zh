    ❑ JavaScript Objects


    ❑ Creating Your Own Objects


    Objects are useful to organize information.


    **javascript objects**


    Earlier in this book, you learned that JavaScript has several built-in objects,
    like String, Date, Array, and more. In addition to these built-in objects, you
    also can create your own.


    An object is just a special kind of data, a collection of properties and methods.


    Let’s illustrate with an example and create an object that models a person. Properties
    are the values associated with the object. The person’s properties include name,
    height, weight, age, skin tone, eye color, and so on. All persons have these properties,
    but the values of those properties differ from person to person. Objects also
    have methods. Methods are the actions that can be performed on objects. The person’s
    methods could be eat(), sleep(), work(), play(), and so on.


    **properties**


    The syntax for accessing a property of an object is as follows: objName.propName


    **151**


    **Learn javascript and ajax with w3schools** You can add a property to an object
    by simply giving it a value. Assume that the personObj already exists; you can
    give it properties named firstname, lastname, age, and eyecolor as follows:


    personObj.firstname="John";


    personObj.lastname="Doe";


    personObj.age=30;


    personObj.eyecolor="blue";


    document.write(personObj.firstname);


    The preceding code generates the following output: John


    **Methods**


    An object also can contain methods.


    You can call a method with the following syntax: objName.methodName()


    **n o t e** Parameters required for the method can be passed between the parentheses.


    To call a method called sleep() for the personObj: personObj.sleep();


    If the sleep() method accepts a parameter for the number of hours, it could be
    called like this:


    personObj.sleep(8)


    **Creating your own objects**


    There are two ways to create a new object: You can create a direct instance of
    an object, or you can create a template of an object.


    **Create a Direct instance of an object**


    The following code creates an instance of an object and adds four properties to
    it: personObj=new Object();


    personObj.firstname="John";


