    With JavaScript, we can create animated images.


    The trick is to let a JavaScript change between different images on different
    events.


    In the following example, we add an image that should act as a link button on
    a Web page. We then add an onMouseOver event and an onMouseOut event that will
    run two JavaScript functions that change between the images.


    **the htmL Code**


    The HTML code looks like this:


    <a href="http://www.w3schools.com" target="_blank">


    <img border="0" alt="Visit w3schools!" src="b_pink.gif"


    id="b1"


    onmouseOver="mouseOver()" onmouseOut="mouseOut()" /></a> Note that we have given
    the image an id, to make it possible for JavaScript to address it later.


    The onMouseOver event tells the browser that once a mouse is rolled over the image,
    the browser should execute a function that replaces the image with another image.


    The onMouseOut event tells the browser that once a mouse is rolled away from the
    image, another JavaScript function should be executed. This function inserts the
    original image again.


    **138**


    **Chapter24: JavaScript animation** **the JavaScript Code**


    The changing between the images is done with the following JavaScript:


    <script type="text/javascript"> function mouseOver()


    {


    document.getElementById("b1").src ="b_blue.gif";


    }


    function mouseOut()


    {


    document.getElementById("b1").src ="b_pink.gif";


    }


    </script>


    The function mouseOver() causes the image to shift to “b_blue.gif.”


    The function mouseOut() causes the image to shift to “b_pink.gif.”


