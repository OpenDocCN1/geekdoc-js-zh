    | :--- | :--- | :--- |

    | `onabort` | 图像加载被中断时 | 是 |

    | `onerror` | 加载图像时发生错误 | 是 |

    | `onload` | 图像完成加载时 | 是 |


    **标准属性、方法和事件**


    `Image` 对象也支持标准属性、方法和事件。


    ### Button 对象


    `Button` 对象代表表单中的按钮。


    对于 HTML 表单中的每个 `<input type="button">` 标签，都会创建一个 `Button` 对象。


    你可以通过遍历表单的 `elements[]` 数组或使用 `document.getElementById()` 来访问按钮。


    ### Button 对象属性


    | 属性 | 说明 | W3c |

    | :--- | :--- | :--- |

    | `alt` | 设置或返回在浏览器不支持时显示的替代文本 | 是 |

    | `disabled` | 设置或返回按钮是否被禁用 | 是 |

    | `form` | 返回包含按钮的表单的引用 | 是 |

    | `name` | 设置或返回按钮的名称 | 是 |

    | `type` | 返回按钮表单元素的类型 | 是 |

    | `value` | 设置或返回显示在按钮上的文本 | 是 |


