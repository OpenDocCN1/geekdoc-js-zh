  trans: "\n\n在第 30 章“AJAX—XMLHttpRequest 对象”中，你将学习更多关于 `XMLHttpRequest` 的知识。\n\n\
    ### 总结\n下面的示例将你所学的知识整合在一起。你的结果如图 29.1 所示。\n\n#### 尝试一下 >>\n\n```html\n<html\n\
    <head>\n<script type=\"text/javascript\">\nfunction loadXMLDoc(url)\n{\n  if (window.XMLHttpRequest)\
    \ {\n    // code for IE7+, Firefox, Chrome, Opera, Safari\n    xmlhttp=new XMLHttpRequest();\n\
    \  }\n  else {\n    // code for IE6, IE5\n    xmlhttp=new ActiveXObject(\"Microsoft.XMLHTTP\"\
    );\n  }\n  xmlhttp.open(\"GET\",url,false);\n  xmlhttp.send(null);\n  document.getElementById('test').innerHTML=xmlhttp.responseText;\n\
    }\n</script>\n</head>\n<body>\n<div id=\"test\">\n  <h2>Click to let AJAX change\
    \ this text</h2>h2>\n</div>\n<button type=\"button\" onclick=\"loadXMLDoc('test1.txt')\"\
    >Click Me</button>\n<button type=\"button\" onclick=\"loadXMLDoc('test2.txt')\"\
    >Click Me</button>\n</body>\n</html>\n```\n\n**图 29.1**\n\n### 第 30 章：本章介绍的 AJAX—XMLHttpRequest\
    \ 对象的方法与属性\n- 重要方法\n- 向服务器发送 AJAX 请求\n- 重要属性\n- `responseText` 属性\n- `XMLHttpRequest`\
    \ Open—使用 False（假值）\n- `XMLHttpRequest` Open—使用 True（真值）\n- `readyState` 属性\n\
    - `onreadystatechange` 属性\n\n在本章中，你将学习 `HttpRequest` 对象的重要方法和属性。\n\n#### 重要方法\n\
    `XMLHttpRequest` 对象有两个重要的方法： \n1. `open()` 方法 \n2. `send()` 方法\n\n#### 向服务器发送\
    \ AJAX 请求\n要向 Web 服务器发送请求，请使用 `open()` 和 `send()` 方法。`open()` 方法接受三个参数。第一个参数定义使用哪种方法（`GET`\
    \ 或 `POST`）。第二个参数指定服务器资源的名称（`URL`）。第三个参数指定请求是否应该异步处理。\n\n`send()` 方法将请求发送到服务器。假设请求的文件名为\
    \ `time.asp`，则代码为：`url=\"time.asp\"`\n\n```\nxmlhttp.open(\"GET\",url,true);\n\
    xmlhttp.send(null);\n```\n在示例中，我们假设当前 Web 页面和请求的资源都在同一个目录下。\n\n#### 重要属性\n`XMLHttpRequest`\
    \ 对象有三个重要的属性：\n1. `responseText` 属性\n2. `readyState` 属性\n3. `onreadystatechange`\
    \ 属性\n\n#### `responseText` 属性\n`XMLHttpRequest` 对象将从服务器请求获取的任何数据存储在它的 `responseText`\
    \ 属性中。在上节中，你通过以下语句将 `responseText` 属性的内容复制到 HTML 中：\n\n```javascript\ndocument.getElementById('test').innerHTML=xmlhttp.responseText\n\
    ```\n\n#### XMLHttpRequest Open—使用 False\n在之前的示例中，我们使用了这种简化的语法：\n```javascript\n\
    xmlhttp.open(\"GET\",url,false);\nxmlhttp.send(null);\ndocument.getElementById('test').innerHTML=xmlhttp.responseText;\n\
    ```\n`open` 调用中的第三个参数是“false”。这告诉 `XMLHttpRequest` 对象等待服务器请求完成后后再执行下一条语句。对于小型应用程序和简单的服务器请求，这可能是可以的。但如果请求耗时很久或无法提供，可能会导致你的\
    \ Web 应用程序挂起或停止。\n\n#### XMLHttpRequest Open—使用 true\n通过将 `open` 调用中的第三个参数改为“true”，你告诉\
    \ `XMLHttpRequest` 对象在向服务器发送请求后继续执行。由于在确定请求已完全完成之前，你不能简单地开始使用服务器请求的响应，因此你需要将 `XMLHttpRequest`\
    \ 的 `onreadystatechange` 属性设置为一个函数（或函数名），以便在完成后执行。在此 `onreadystatechange` 函数中，你必须在使用服务器调用的结果之前测试\
    \ `readyState` 属性。只需将代码更改为：\n\n```javascript\nxmlhttp.onreadystatechange=function()\n\
    {\n  if(xmlhttp.readyState==4) { // 请求完成\n    document.getElementById('test').innerHTML=xmlhttp.responseText;\n\
    \  }\n}\nxmlhttp.open(\"GET\",url,true);\nxmlhttp.send(null);\n```\n\n#### `readyState`\
    \ 属性\n`readyState` 属性持有服务器响应的状态。`readyState` 属性的可能值如下表所示：\n\n| state | description\
    \ |\n| :--- | :--- |\n| 0 | 请求未初始化 |\n| 1 | 请求已建立 |\n| 2 | 请求已发送 |\n| 3 | 请求处理中\
    \ |\n| 4 | 请求已完成 |\n\n#### `onreadystatechange` 属性\n`onreadystatechange` 属性存储了一个函数（或函数名），每当\
    \ `readyState` 属性发生变化时都会自动调用该函数。你可以这样在属性中定义整个函数：\n\n```javascript\nxmlhttp.onreadystatechange=function()\n\
    {\n  if(xmlhttp.readyState==4) {\n    document.getElementById('test').innerHTML=xmlhttp.responseText;\n\
    \  }\n}\nxmlhttp.open(\"GET\",url,true);\nxmlhttp.send(null);\n```\n或者你也可以简单存储在其他地方定义的函数名，如下：\n\
    \n```javascript\nxmlhttp.onreadystatechange=stateChanged;\n```\n\n```javascript\n\
    function stateChanged() {\n  if(xmlhttp.readyState==4) {\n    document.getElementById('test').innerHTML=xmlhttp.responseText;\n\
    \  }\n}\n```\n\n"
- fmt: "\nWhen a user inputs data, the function called `showHint()` is executed. The\
    \ execution of the function is triggered by the `onkeyup` event. In other words,\
    \ each time a user presses and then releases a key inside the input field, the\
    \ function `showHint` is called.\n\n### the showhint() Function\n\nThe `showHint()`\
    \ function is a very simple JavaScript function placed in the `<head>` section\
    \ of the HTML page:\n\n```javascript\nvar xmlhttp;\n\nfunction showHint(str)\n\
    {\n  if (str.length==0)\n  {\n    document.getElementById(\"txtHint\").innerHTML=\"\
    \";\n    return;\n  }\n  xmlhttp=GetXmlHttpObject();\n  if (xmlhttp==null)\n \
    \ {\n    alert (\"Your browser does not support XMLHTTP!\");\n    return;\n  }\n\
    \  var url = \"gethint.asp\";\n  url = url + \"?q =\" +str;\n  url = url + \"\
    &sid=\" +Math.random(); \n  xmlhttp.onreadystatechange=stateChanged;\n  xmlhttp.open(\"\
    GET\",url,true);\n  xmlhttp.send(null);\n}\n```\n\nThe preceding function executes\
    \ every time a character is entered in the input field.\n\n#### Chapter 32: AJAX\
    \ Suggest\n\nIf there is input in the input field (`str.length > 0`), the `showHint()`\
    \ function executes the following:\n\n- Defines the URL (`*filename*`) to send\
    \ to the server\n- Adds a parameter (`*q*`) to the URL with the content of the\
    \ input field\n- Adds a random number to prevent the server from using a cached\
    \ file\n- Creates an `XMLHttp` object and tells the object to execute a function\
    \ called `stateChanged` when a change is triggered\n- Opens the `XMLHttp` object\
    \ with the given URL\n- Sends an HTTP request to the server\n\nIf the input field\
    \ is empty, the function simply clears the content of the `txtHint` placeholder.\n\
    \n### the getXmlhttpObject() Function\n\nThe `showHint()` function calls a function\
    \ named `GetXmlHttpObject()`. The purpose of the `GetXmlHttpObject()` function\
    \ is to solve the problem of creating different `XMLHttp` objects for different\
    \ browsers:\n\n```javascript\nfunction GetXmlHttpObject()\n{\n  if (window.XMLHttpRequest)\n\
    \  {\n    // code for IE7+, Firefox, Chrome, Opera, Safari return new XMLHttpRequest();\n\
    \    return new XMLHttpRequest();\n  }\n  if (window.ActiveXObject)\n  {\n   \
    \ // code for IE6, IE5\n    return new ActiveXObject(\"Microsoft.XMLHTTP\");\n\
    \  }\n  return null;\n}\n```\n\n### the stateChanged() Function\n\nThe `stateChanged()`\
    \ function contains the following code:\n\n```javascript\nfunction stateChanged()\n\
    {\n  if (xmlhttp.readyState==4)\n  {\n    document.getElementById(\"txtHint\"\
    ).innerHTML=xmlhttp.responseText;\n  }\n}\n```\n\nThe `stateChanged()` function\
    \ executes every time the state of the `XMLHttp` object changes. When the state\
    \ changes to 4 (“complete”), the content of the `txtHint` placeholder is filled\
    \ with the response text.\n\n### AJAX Suggest Source Code\n\nThe following source\
    \ code belongs to the previous AJAX example. You can copy and paste it, and try\
    \ it yourself. **NOTE** Be sure to try it on a server with ASP or PHP enabled.\n\
    \n#### the AJAX htML page\n\nThis is the HTML page. It contains a simple HTML\
    \ form and a link to a JavaScript.\n\n```html\n<html>\n<head>\n  <script src=\"\
    clienthint.js\"></script>\n</head>\n<body>\n  <form>\n    First Name: <input type=\"\
    text\" id=\"txt1\" onkeyup=\"showHint(this.value)\" />\n  </form>\n  <p>Suggestions:\
    \ <span id=\"txtHint\"></span></p>\n</body>\n</html>\n```\n\n#### the AJAX JavaScript\n\
    \nThis is the JavaScript code, stored in the file `clienthint.js`:\n\n```javascript\n\
    var xmlhttp\nfunction showHint(str)\n{\n  if (str.length==0)\n  {\n    document.getElementById(\"\
    txtHint\").innerHTML=\"\";\n    return;\n  }\n  xmlhttp=GetXmlHttpObject();\n\
    \  if (xmlhttp==null)\n  {\n    alert (\"Your browser does not support XMLHTTP!\"\
    );\n    return;\n  }\n  var url=\"gethint.asp\";\n  url=url+\"?q=\"+str;\n  url=url+\"\
    &sid=\"+Math.random();\n  xmlhttp.onreadystatechange=stateChanged;\n  xmlhttp.open(\"\
    GET\",url,true);\n  xmlhttp.send(null);\n}\nfunction stateChanged()\n{\n  if (xmlhttp.readyState==4)\n\
    \  {\n    document.getElementById(\"txtHint\").innerHTML=xmlhttp.responseText;\n\
    \  }\n}\nfunction GetXmlHttpObject()\n{\n  if (window.XMLHttpRequest)\n  {\n \
    \   // code for IE7+, Firefox, Chrome, Opera, Safari\n    return new XMLHttpRequest();\n\
    \  }\n  if (window.ActiveXObject)\n  {\n    // code for IE6, IE5\n    return new\
    \ ActiveXObject(\"Microsoft.XMLHTTP\");\n  }\n  return null;\n}\n```\n\n#### the\
    \ AJAX Server page—ASp and php\n\nThere is no such thing as an AJAX server. AJAX\
    \ pages can be served by any Internet server. The server page called by the JavaScript\
    \ in the previous example is a simple ASP file called `gethint.asp`. Following\
    \ are two examples of the server page code, one written in ASP and one in PHP.\n\
    \n#### AJAX ASp Example\n\nThe code in the `gethint.asp` page is written in VBScript\
    \ for an Internet Information Server (IIS). It checks an array of names and returns\
    \ the corresponding names to the client:\n\n```asp\n<%\nresponse.expires=-1\n\
    dim a(30)\n'Fill up array with names\na(1)=\"Anna\"\na(2)=\"Brittany\"\na(3)=\"\
    Cinderella\"\na(4)=\"Diana\"\na(5)=\"Eva\"\na(6)=\"Fiona\"\na(7)=\"Gunda\"\na(8)=\"\
    Hege\"\na(9)=\"Inga\"\na(10)=\"Johanna\"\na(11)=\"Kitty\"\na(12)=\"Linda\"\na(13)=\"\
    Nina\"\na(14)=\"Ophelia\"\na(15)=\"Petunia\"\na(16)=\"Amanda\"\na(17)=\"Raquel\"\
    \na(18)=\"Cindy\"\na(19)=\"Doris\"\na(20)=\"Eve\"\na(21)=\"Evita\"\na(22)=\"Sunniva\"\
    \na(23)=\"Tove\"\na(24)=\"Unni\"\na(25)=\"Violet\"\na(26)=\"Liza\"\na(27)=\"Elizabeth\"\
    \na(28)=\"Ellen\"\na(29)=\"Wenche\"\na(30)=\"Vicky\"\n%>\n```\n\n#### AJAX php\n\
    \nThe preceding code can be rewritten in PHP. To run the entire example in PHP,\
    \ remember to change the value of `url` in `clienthint.js` from `gethint.asp`\
    \ to `gethint.php`.\n\n```php\n<?php\n// Fill up array with names\n$a=[\"Anna\"\
    , \"Brittany\", \"Cinderella\", \"Diana\", \"Eva\", \"Fiona\", \"Gunda\", \"Hege\"\
    , \"Inga\", \"Johanna\", \"Kitty\", \"Linda\", \"Nina\", \"Ophelia\", \"Petunia\"\
    , \"Amanda\", \"Raquel\", \"Cindy\", \"Doris\", \"Eve\", \"Evita\", \"Sunniva\"\
    , \"Tove\", \"Unni\", \"Violet\", \"Liza\", \"Elizabeth\", \"Ellen\", \"Wenche\"\
    , \"Vicky\"];\n\n//get q parameter from URL\n$q=$_GET[\"q\"];\n\n//lookup all\
    \ hints from array if length of q>0\nif (strlen($q) > 0)\n{\n  $hint=\"\";\n \
    \ for($i=0; $i<count($a); $i++)\n  {\n    if (strtolower($q)==strtolower(substr($a[$i],0,strlen($q))))\n\
    \    {\n      if ($hint==\"\")\n      {\n        $hint=$a[$i];\n      }\n    \
    \  else\n      {\n        $hint=$hint.\" , \".$a[$i];\n      }\n    }\n  }\n}\n\
    \n// Set output to \"no suggestion\" if no hint were found\n// or to the correct\
    \ values\nif ($hint == \"\")\n{\n  $response=\"no suggestion\";\n}\nelse\n{\n\
    \  $response=$hint;\n}\n\n//output the response\necho $response;\n?>\n```\n\n\
    ### Chapter 33: AJAX Database Example\n\nAJAX can be used for interactive communication\
    \ with a database. The example shown in Figure 33.1 demonstrates how a Web page\
    \ can fetch information from a database with AJAX technology.\n\n**In this Chapter:**\n\
    - The AJAX JavaScript\n- The AJAX Server Page\n\n#### Figure 33.1\n\nThe preceding\
    \ example contains a simple HTML form and a link to a JavaScript:\n\n```html\n\
    <html>\n<head>\n  <script type=\"text/javascript\" src=\"selectcustomer.js\"></script>\n\
    </head>\n<body>\n  <form>\n    Select a Customer:\n    <select name=\"customers\"\
    \ onchange=\"showCustomer(this.value)\">\n      <option value=\"ALFKI\">Alfreds\
    \ Futterkiste</option>\n      <option value=\"NORTS \">North/South</option>\n\
    \      <option value=\"WOLZA\">Wolski Zajazd</option>\n    </select>\n  </form>\n\
    \  <div id=\"txtHint\"><b>Customer info will be listed here.</b></div>\n</body>\n\
    </html>\n```\n"
