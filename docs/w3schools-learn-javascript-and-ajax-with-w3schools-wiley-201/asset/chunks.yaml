    ## 第 27 章：创建你自己的对象


    # JavaScript 对象


    对象有助于组织信息。对象只是一种特殊的数据类型，属性和方法的集合。在书的前面，你已经学习了 JavaScript 有几个内置对象，如 `String`、`Date`、`Array`
    等。除了这些内置对象之外，你也可以创建自己的对象。让我们通过一个示例来说明，并创建一个模拟人的对象。属性是与对象相关的值。人的属性包括姓名、体重、年龄、肤色等。对象拥有方法。方法是在对象上执行的操作。人的方法可以是
    `eat()`、`sleep()`、`play()` 等。


    ## 属性


    访问对象属性的语法如下：`objName.propName`


    添加属性


    你可以通过简单地赋值给对象添加属性。假设 `personObj` 已存在；你可以给它命名为 `firstname`、`lastname`、`age` 和 `eyolor`
    的属性，如下：


    ```javascript

    personObj.firstname="John";

    personObj.lastname="Doe";

    personObj.age=30;

    personObj.eyolor="blue";

    ```


    ## 方法


    对象也可以包含方法。你可以使用以下语法调用方法：`objName.methodName()`


    方法所需的参数可以传递在括号之间。为 `personObj` 调用 `sleep()` 方法：`personObj.sleep()`


    如果 `sleep()` 方法接受小时参数，可以这样调用：`personObj.sleep(8)`


    ## 创建对象


    创建新对象有两种方法：你可以创建一个对象的直接实例，也可以创建一个对象的模板。


    ### 创建对象的直接实例


    下面的代码创建一个对象实例并为其添加四个属性：


    ```javascript

    personObj=new Object();

    personObj.firstname="John";

    personObj.lastname="Doe";

    personObj.age=50;

    personObj.eyolor="blue";

    ```


    ## 152


