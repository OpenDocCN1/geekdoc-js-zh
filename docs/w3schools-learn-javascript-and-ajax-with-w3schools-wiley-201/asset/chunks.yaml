    \ is \" + i); document.write(\"<br />\");\n}\n</script>\n<p>解释：当 `i=3` 时循环将跳过。</p>\n\
    </body>\n</</html>\n```\n\n### for...in 语句\n\n`for...in` 语句遍历数组的元素。语法如下：\n\n```javascript\n\
