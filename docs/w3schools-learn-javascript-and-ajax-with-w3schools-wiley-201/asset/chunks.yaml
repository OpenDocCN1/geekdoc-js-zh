  trans: "\n\n# Prompt 提示框\n\n## 弹出框\n\nJavaScript 有三种类型的弹出框：警告框（alert box）、确认框（confirm\
    \ box）和提示框（prompt box）。\n\n## alert 警告框\n\n当你想向用户显示信息时，通常使用警告框。\n\n当警告框弹出时，用户必须点击“确定”才能继续。\n\
    \n语法如下：\n\n```\nalert(\"sometext\");\n```\n\n你的结果如图 9.1 所示。当你点击按钮时，图 9.2 中的警告框会弹出。\n\
    \n**自己试试 >>**\n\n```html\n<html>\n<head>\n*(继续)*\n**53**\n![Image 29](img/index-65_1.png)\n\
