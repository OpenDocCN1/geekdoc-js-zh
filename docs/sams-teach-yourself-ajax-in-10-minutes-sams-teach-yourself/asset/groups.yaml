    # Elements of an HTML Page


    Let''s look at Listing 2.1 in a little more detail.


    The first element on the page is known as the DOCTYPE element. Its purpose is
    to notify the browser of the “flavor” of HTML used in the document. The DOCTYPE
    element used throughout this book refers to HTML 4.0 Transitional, a fairly forgiving
    version of the HTML specification that allows the use of some earlier markup styles
    and structures in addition to the latest HTML 4.0 specifications.


    The DOCTYPE element must always occur right at the beginning of the HTML document.


    Next, that the remainder of the document is enclosed by the elements <html> at
    the start of the page and </html> at the end. These tags notify the browser that
    what lies between should be interpreted and displayed as an HTML document.


    > Caution Although many modern browsers correctly display HTML without these tags,
    it is bad practice to omit them. Even if the page is shown on your own PC, you
    have no idea what operating system and browser a visitor may be using—he may not
    be so lucky.


    The document within these outer tags is split into two further sections. The first
    is enclosed in <head> and </head> tags, and the second is contained between <body>
    and </body>. Essentially, the document''s head is used to store information about
    the document that is not to be displayed in the browser window, whereas the body
    of the document contains text to be interpreted and displayed to the user via
    the browser window.


    # <head> of the Document


    From Listing 2.1 we can see that the head of our simple HTML document contains
    only one line—the words A Simple HTML Document enclosed in <title> and </title>
    tags.'
  - '[PAGE 27]


    # Writing Web Pages in HTML


    Remember that the head section contains information that is not to be played in
    the browser window. This is not, then, the title displayed at the top of our page
    text, as you can confirm by looking again at Figure 2.1. Neither the document
    title refer to the filename of the document, which in this case is testpage.html.


    In fact, the document title fulfils a number of functions, among them:


    +   * Search engines often use the page title (among other factors) to help them
    decide what a page is about.


    +   * When you bookmark a page, it is generally saved by default as the document
    title.


    +   * Most browsers, when minimized, display the title of the current document
    on their icon or taskbar button.


    It''s important, therefore, to choose a meaningful and descriptive title for each
    page that you create.


    Many other elements are used in the head section of a document, including link,
    meta, and script elements. Although we don''t give an account of them here, they
    are described throughout the book as they occur.


    # The Document <body>


    Referring to Listing 2.1, we can clearly see that the content of the document''s
    body section is made up of the text we want to display on the page, plus some
    tags that help us to define how that text should look.


    To define that certain words should appear in bold type, for example, we enclose
    those words in <b> and </body> tags. Similarly, to convert words into an italic
    typeface, we can use the <i> and </iframe> tags.


    The heading, My HTML Page, is enclosed between <h1> and </h1> tags. These indicate
    that we intend the enclosed text to be a heading. HTML allows for six levels of
    headings, from h1 (the most prominent) to h6. You can use any of the intermediate
    values h2, h3, h4, and h5 to display pages having various levels of subtitles,
    for instance corresponding to chapter, section, and paragraph headings. Anything
    displayed within header tags is displayed on a line by itself.'
