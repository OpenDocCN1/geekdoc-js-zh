    \n当服务器请求完全完成且对象可以进行进一步处理时，`readyState` 的值最终会变为 4。\n\n> 并非所有可能的值都存在于任何给对象中。如果某些状态与对象的内容类型没有关系，则对象可能会“跳过”某些状态。\n\
    \n在大多数实际情况下，你应该检查 `readyState` 属性是否达到值 4，此时你可以确定服务器已经完成其任务，且 `XMLHttpRequest`\
    \ 对象已准备就绪可以使用。\n\n## 服务器响应状态码\n\n除了 `readyState` 属性外，你还有另一种进一步的方法来检查异步请求是否执行正确：HTTP\
    \ 服务器状态码。\n\nHTTP 响应在第 3 节“使用 HTTP 发送请求”中讨论过。如果你参考表 3.1，你会发现响应状态码 200 对应于服务器的\
    \ OK 消息。\n\n在我们进一步开发回调函数时，我们将看到如何测试这一点。\n\n## 回调函数\n\n到目前，你已经学习了如何创建一个 `XMLHttpRequest`\
    \ 对象的实例、声明回调函数的标识，以及准备并发送异步服务器请求。你还知道哪些属性可以告诉何时何时响应响应可以使用。\n\n让我们来看看我们的回调函数 `responseAjax()`。\n\
    \n首先，注意，每当 `onreadystatechange` 属性的值发生变化时，都会调用此函数。通常，当此函数被调用时，要求它什么都不做，因为 `readyState`\
    \ 属性的值尚未达到 4，因此我们知道服务器请求尚未完成处理。\n\n我们可以使用 JavaScript 的 `if` 语句来实现这一点：\n\n```javascript\n\
    function responseAjax() {\n// 我们只对 readyState 为 4 感兴趣\n// if(myRequest.readyState\
    \ == 4) {\n    program execution statements ...\n}\n}\n```\n\n除了检查服务器请求已完成之外，我们还想检查\
    \ HTTP 响应状态码，以确保它等于 200，这表示对我们的异步 HTTP 请求有成功的响应。\n\n参考表 8.1，我们可以看到 `XMLHttpRequest\
    \ myRequest` 有两个属性报告 HTTP 状态响应。这些是：\n\n```javascript\nmyRequest.status\n```\n\n\
    它包含状态响应码，\n\n```javascript\nmyRequest.statusText\n```\n\n包含原因短语。\n\n我们可以通过进一步的循环使用这些属性：\n\
    \n```javascript\nfunction responseAjax() {\n// 我们只对 readyState 为 4 感兴趣\n// 即 \"\
    loaded\"\nif(myRequest.readyState == 4) {\n    // 如果服务器 HTTP 响应为 \"OK\"\n    if(myRequest.status\
    \ == 200) {\n        ... program execution statements\n    } else {\n        //\
    \ 为任何其他\n        // HTTP 响应发出错误消息\n        alert(\"An error has occurred: \");\n\
    \    }\n}\n} + myRequest.statusText;\n```\n\n这段代码在我们的语句中引入了 `else` 子句。除 200以外的任何服务器响应会导致此\
    \ `else` 子句的内容被执行，打开一个包含从服务器返回的原因短语文本的警告对话框。\n\n## 使用回调函数\n\n那么，我们如何从 HTML 页面调用我们的\
    \ `ajax()` 函数呢？让我们来看例子。这里是 HTML 页面中简化表单的代码：\n\n```html\n<form name='form1'>\n\
    Name: <input type='text' name='myname'><br>\nTel: <input type='text' name='telno'><br>\n\
    <input type='submit'>\n</form>\n```\n\n我们将使用表单中文本输入字段的 `onclick` 事件处理器来启动函数：\n\
    \n```html\n<form name='form1'>\nName: <input type='text' name='myname' onBlur='ajax()'><br>\n\
    Tel: <input type='text' name='telno'><br>\n<input type='submit'>\n</form>\n```\n\
    \n当用户离开相关字段时，`onBlur` 事件处理器会被激活。在这种情况下，当用户离开该字段时，`onBlur` 事件处理器会被激活……（注：原文此处存在大量重复文本，翻译时已按逻辑处理）。\n\
    \n## 10\n\n### responseText 和 responseXML 属性\n\n在本节中，你将学习如何处理服务器返回的数据。\n\n###\
    \ responseText 属性\n\n`responseText` 属性尝试将服务器返回的信息表示为字符串。\n\n> 提示 如果 `XMLHttpRequest`\
    \ 调用失败或尚未发送，`responseText` 的值为 `null`。\n\n让我们再次查看回调函数的原型：\n\n```javascript\nfunction\
    \ responseAjax() {\n// 我们只对 readyState 为 4 感兴趣\n// 即 \"loaded\"\nif(myRequest.readyState\
    \ == 4) {\n  // 服务器 HTTP 响应为 \"OK\"\n  if(myRequest.status == 200) {\n    // program\
    \ execution statements ...\n  } else {\n    // 为其他 HTTP 发出错误消息\n    alert(\"An\
