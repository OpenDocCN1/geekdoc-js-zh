    \ == 200) {\n    output = req.responseText;\n    document.getElementById(pageElement).innerHTML\
    \ = output;\n  }\n}\n```\n\n函数 `callAHAH` 封装了创建 `XMLHttpRequest` 对象实例、声明回调函数以及发送请求的任务。\n\
    \n注意，我们并没有简单地声明\n`req.onreadystatechange = responseAHAH;`\n\n而是使用了 JavaScript\
    \ 构造结构\n`req.onreadystatechange = function(responseAHAH);`\n\n这种类型的声明允许我们向声明的函数传递参数，在本例中，该参数标识要更新的页面元素。\n\
    \n`callAHAH()` 还接受一个额外的参数 `callMessage`。该参数包含一个字符串，定义了我们在等待服务器请求结果时在目标元素中显示的内容。这为用户提供了某种程度的反馈，表明页面上正在发生什么。在实践中，这可能是一行文本，例如“正在更新页面；请稍候\
    \ ...”。\n\n然而，你仍然可以选择向此字符串中嵌入一些 HTML 代码。在 `<img>` 元素中使用动画 GIF 图片是警告用户进程正在运行的有效方法。\n\
    \n回调函数 `responseAHAH()` 执行特定的任务，即将 `responseText` 中返回的字符串应用到所选页面元素 `pageElement`\
    \ 的 `innerHTML` 属性：\n\n```javascript\noutput = req.responseText;\ndocument.getElementById(pageElement).innerHTML\
    \ = output;\n```\n\n# AHAH—异步 HTML 和 HTTP 135\n\n这段代码被封装成一个名为 `myAHAHlib.js` 的文件，你可以从\
    \ HTML 页面调用它，从而让你的 AHAH 应用程序可以使用这些函数。下一节将展示其用例的一些示例。\n\n## 使用 myAHAHlib.js\n\n\
    在第 4 节“使用 JavaScript 进行客户端编码”中，我们遇到了位于外部文件并在我们的页面中引用的 JavaScript 函数概念。\n\n这就是我们如何通过这种形式的语句来使用新文件\
    \ `myAHAHlib.js`：\n\n```html\n<script language=\"JavaScript\" SRC=\"myAHAHlib.js\"\
    ></script>\n```\n\n然后，我们就可以随时随地调用脚本中的函数了。\n\n以下是此类 HTML 页面的骨架源代码：\n\n```html\n\
    <html>\n<head>\n<title>另一个 Ajax 应用</title>\n<script language=\"JavaScript\" SRC=\"\
    myAHAHlib.js\"></script>\n</head>\n<body>\n<form>\n<input type=\"button\" onclick=\"\
    callAHAH('serverscript.php?parameter=x', display('Please wait - page updating\
    \ ...'))\">\n这里是服务器响应发布的位置：<br>\n<div id=\"displaydiv\"></div>\n</form>\n</body>\n\
    </html>\n```\n\n在这个简单的 HTML 页面中，使用一个按钮元素来创建触发 `callAHAH()` 方法的事件。该方法将文本字符串“Please\
    \ wait - page updating ...”放置在 `id=displaydiv` 的 `<div>` 元素中，并将异步服务器调用发送到 URL\
    \ `serverscript.php?parameter=x`。\n\n当 `responseAHAH()` 检测到服务器已完成响应时，将使用存储在 `responseText`\
    \ 中的值来更新 `<div>` 元素的内容；它不再显示“请等待”消息，而是是 `<div>` 现在将显示服务器返回的任何文本。\n\n## 在项目中应用\
    \ myAHAlib.js\n\n我们可以通过另一个简单的 Ajax 应用来演示这些技术。这一次，我们将构建一个脚本，从用户输入的 URL 中获取“keywords”（关键词）元标签信息。\n\
    \n> 元标签（Metatags）是 HTML 页面 `<head>` 部分中可选的 HTML 容器元素。它们包含了有关网页的数据，这些数据对于搜索引擎和索引决定如何对页面内容进行分类很有用。如果存在'keywords'\
    \ 元标签通常包含一个用逗号分隔的单词列表，其含义与网站内容相关。'keywords' 元标签的示例所示：\n\n```html\n<meta name=\"\
    keywords\" content=\"programming, design, development, Ajax, JavaScript, XMLHttpRequest,\
    \ script\">\n```\n\n列表 13.2 显示了 HTML 代码。\n\n## 列表 13.2 getkeywords.html\n\n```html\n\
    <html\n<head>\n<title>“关键词”元标签抓取器</title>\n<SCRIPT language=\"JavaScript\" SRC=\"\
    myAHAHlib.js\"></SCRIPT>\n</head>\n<body>\n```\n\n```html\n<script type=\"text/javascript\"\
    \ src=\"ahahLib.js\"></script>\n<form>\n<table>\n<tr>\n<td>URL: http://</td>\n\
    </tr>\n<tr>\n<td>\n<input type=\"text\" id=\"myurl\" name=\"myurl\" size=\"30\"\
    >\n<input type=\"button\" onclick=\"callAHAH('keywords.php?url='+document.getElementById('myurl').value,'displaydiv','Please\
    \ wait; loading content ...')\" value=\"Fetch\">\n</td>\n</tr>\n<tr><td colspan=\"\
    2\" height id=\"displaydiv\"></td></tr>\n</table>\n</form>\n</body>\n</html>\n\
    ```\n\n最后，考虑服务器端脚本：\n\n```php\n<?php\n$tags = meta_tags('http://');\n$result =\
    \ $tags['keywords'];\nif(strlen($result) > 0) {\n  echo $result;\n} else {\n \
    \ echo \"No keywords found\";\n}\n?>\n```\n\n我们将选定的 URL 传递给方法：`$tags = meta_tags('http://');`\n\
    \n该方法专门设计用于关联数组的形式解析 HTML 页面。在本例中，我们得到了：`$result = $tags['keywords'];` 然后我们通过\
    \ `strlen()` 测量返回字符串的长度来检查是否存在关键词。\n\n## 第 13 节\n\n> 提示 在 PHP 方法前的 @ 字符告诉解释器如果遇到问题则不要输出错误消息。在本例中我们需要它，因为并不是所有页面都包含关键词。\n\
    \n当首次加载 getkeywords.html 时，我们看到了图 13.1 所示的内容。我们被邀请输入 URL。当我们点击 Fetch 按钮时，执行 `callAHAH()`\
    \ 并我们的 URL 作为参数发送到服务器端脚本。与此同时，“Please wait; loading content ...\" 被放置在 `<div>`\
    \ 容器中。虽然可能可见瞬间，但现在有了类似于 13.2 的显示。\n\n# AHAH—异步 HTML 和 HTTP 139\n\n最后，当服务器调用完成后，`responseText`\
    \ 属性的内容加载到 `<div>` 容器中，产生 13.3 的显示。\n\n## 扩展 myAHAlib.js\n\n目前，myAHAlib.js 是 AHAH\
    \ 的简单实现。根据使用情况，有许多方法对其改进和扩展。我们没有在本节中涵盖这些内容，而是将其留给你们自己实验。这里是一些入门建议：\n\n- 目前仅支持\
    \ GET 请求。如何修改函数以允许 POST 请求？\n- 第 11 节“我们的第一个 Ajax 应用”中讨论的大部分用户反馈并未在 `responseAHAH()`\
    \ 中实现。\n- 是否可以修改 `callAHAH()` 以接收一个要更新的页面元素数组，并在（在合适的服务器端脚本帮助下）一次处理它们？\n\n我们尚未考虑的选项是在\
    \ `responseText` 中传递 JavaScript 代码。由于 JavaScript 源代码（如 HTML 页面中的其他所有内容）是由纯文本编写的语句组成的，因此你可以从服务器通过\
    \ `responseText` 属性返回 JavaScript 源。\n可以使用 JavaScript 的 `eval()` 方法执行此 JavaScript\
    \ 代码：\n`eval(object.responseText);`\n\n考虑你的服务器脚本返回字符串：\n`alert('Hello World!');`\n\
    \n在这种情况下，`eval()` 方法将内容作为 JavaScript 语句执行，创建一个带有确定按钮的显示“Hello World!”的对话框。\n\n"
