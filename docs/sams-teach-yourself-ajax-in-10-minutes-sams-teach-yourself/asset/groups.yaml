    # LESSON 5

    Server-Side Programming in PHP


    Ajax applications can work with virtually any server-side language, requiring
    only that the server should return correctly formatted responses to its HTTP requests.
    This lesson introduces PHP, a popular open source scripting language used on a
    huge number of web servers throughout the world.


    # Introducing PHP


    Like JavaScript, PHP is composed of commands that can be embedded within the HTML
    code of your pages. PHP however is a server-side programming language—that is,
    it works hand-in-hand with your web server to process the source code of a page
    before that page is sent to the browser.


    # Why Do I Need To Know?


    As you are already aware, Ajax applications make calls to the web server and subsequently
    use the returned information in the page currently being viewed. You need a way
    to run programs on the server to process the Ajax request and return the required
    data.


    Ajax can work with various server-side technologies including PHP, ASP, Java,
    and others. This book uses PHP, arguably the most popular and easy to use of the
    available server-side languages.


    This lesson provides an introduction to PHP for those who have never encountered
    it and a refresher of the basics for any who have.'
