    # # Monitoring Server Status


    The XMLHttpRequest object contains mechanisms by which we can stay informed of
    our Ajax request and determine when the information returned by the server is
    ready to use in our application.


    Let''s now have a look at the relevant properties.


    # # The readyState Property


    The readyState property of the XMLHttpRequest object gives you information from
    the server about the current state of a request you have made. This property is
    monitored by the onreadychange property, and changes in the value of readyState
    cause onreadystatechange to become true and therefore cause the appropriate function
    (responseAjax() in our example) to be executed.


    > Tip The function called on completion of the server request is normally referred
    to as the callback function.


    readyState can take the following values:


    +   - 0 = uninitialized

    - 1 = loading'
