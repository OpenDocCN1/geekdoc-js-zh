    # LESSON 7

    Anatomy of an Ajax Application


    In this lesson you will learn about the individual building blocks of Ajax and
    how they fit together to form the architecture of an Ajax application. Subsequent
    lessons here in Part II, “Introducing Ajax,” examine these components in more
    detail, finally assembling them into a working Ajax application.


    # The Need for Ajax


    In Part I, “A Refresher on Web Technologies,” we reviewed the core technologies
    that form the components of an Ajax application. By now, you will hopefully have
    at least a rudimentary knowledge of JavaScript, PHP, and XML, all of which we
    will use in Part II.


    Before discussing the individual components, let’s look in more detail at what
    we want from our Ajax application.


    # Traditional Versus Ajax Client-Server Interactions


    Lesson 1, “Anatomy of a Website,” discussed the traditional page-based model of
    a website user interface. When you interact with such a website, individual pages
    containing text, images, data entry forms, and so forth are presented one at a
    time. Each page must be dealt with individually before navigating to the next.


    For instance, you may complete the data entry fields of a form, editing and re-editing
    your entries as much as you want, knowing that the data will not be sent to the
    server until the form is finally submitted.


    ![](img/2ee8632a2c5a7a595049f49876099e38_80_0.png)'
- md: '

    Figure 7.1 illustrates this interaction.


    ![](img/2ee8632a2c5a7a595049f49876099e38_81_0.png)


    ## FIGURE 7.1 Traditional client-server interactions.


    After you submit a form or follow a navigation link, you then wait while the browser
    screen refreshes to display the new or revised page that has been delivered by
    the server.


    As your experience as an Internet user grows, using this interface becomes almost
    second nature. You learn certain rules of thumb that help to keep you out of trouble,
    such as “don’t press the Submit button a second,” and “don’t press the Back button
    after submitting a form.”


    Unfortunately, interfaces built using this model have a few drawbacks. First,
    there is a significant delay while each new or revised page is loaded. This interrupts
    you, as we, perceive as the “flow” of the application.


    Furthermore, a whole page must be loaded on each occasion, even when most of its
    content is identical to that of the previous page. Items common to many pages
    on a website, such as header, footer, and navigation sections, can amount to a
    significant proportion of the data contained in the page.


    Figure 7.2 illustrates a website displaying pages before and after the submission
    of a form, showing how much identical content has been reloaded and how relatively
    little of the display has actually changed.


    ## Lesson 7


    ![](img/2ee8632a2c5a7a595049f49876099e38_82_0.png)


    **FIGURE 7.2** Many page items are reloaded unnecessarily.


    This unnecessary download of data wastes bandwidth and further exacerbates the
    delay in loading each new page.


    > Note **Bandwidth** refers to the capacity of a communications channel to carry
    information. On the Internet, bandwidth is usually measured in bps (bits per second)
    or in higher multiples as Mbps (million bits per second).


    ## The Rich User Experience


    The combined effect of the issues just described is to offer a much inferior user
    experience compared to that provided by the vast majority of desktop applications.


    On the desktop, you expect the display contents of a program to remain visible
    and the interface elements to respond to commands while the processes occur quietly
    in the background. As I write this lesson using a word processor, for example,
    I can save the document to disk, scroll or page up and down, and alter font faces
    and sizes without having to wait on each occasion for the entire display to be
    refreshed.


    Ajax allows you to add to your web application interfaces some of the functionality
    more commonly seen in desktop applications and often referred to as a rich user
    experience.


    ## Introducing Ajax


    To improve the user''s experience, you need to add some extra capabilities to
    the traditional page-based interface design. You want your user''s page to be
    interactive, responding to the user''s actions with revised content, and be updated
    without any interruptions for page loads or screen refreshes.


    To achieve this, Ajax builds an extra layer of processing between the web page
    and the server.


    This layer, often referred to as an Ajax Engine or Ajax Framework, intercepts
    requests from the user and in the background handles server communications quietly,
    unobtrusively, and asynchronously. By this we mean server requests and responses
    no longer need to coincide with particular user actions; may happen at any time
    convenient to the user and to the correct operation of the application. The browser
    does not freeze and await the completion by the server of the last request but
    instead lets the user carry on scrolling, clicking, and typing in the current
    page.


    The updating of page elements to reflect the revised information received from
    the server is also looked after by Ajax, happening dynamically while the page
    continues to be used.


    Figure 7.3 represents how these interactions take place.


    ![](img/2ee8632a2c5a7a595049f49876099e38_83_0.png)


    **FIGURE 7.3** Ajax client-server interaction.


    ## A Real Ajax Application—Google Suggest


    To see an example of an Ajax application in action, let''s have a look at Google
    Suggest. This application extends the familiar Google search engine to offer the
    user suggestions for suitable search terms, based on what he has so far typed.


    With each key pressed by the user, the application''s Ajax layer queries Google''s
    server for suitably similar search phrases and presents the returned data in a
    drop-down box. Along with each suggested phrase is listed the number of results
    that would be expected for a search conducted using that phrase. At any point
    the user has the option to select one of these suggestions instead of continuing
    to type and have Google process the search.


    Because the server is queried with every keypress, this drop-down list updates
    dynamically as the user types—without waiting for page refreshes or similar interruptions.


    Figure 7.4 shows the program in action. You can try it for yourself by following
    the links from Google''s home page http://www.google.com/webphp?complete=1&hl=en.


    ![](img/2ee8632a2c5a7a595049f49876099e38_84_0.png)


    **Figure 7.4** An example of an Ajax application—Google Suggest.


    ## Anatomy of an Ajax Application


    Next let''s identify the individual components of such an Ajax application and
    see how they work together.


    > Note Google has presented other Ajax-enabled applications that you can try,
    including the gmail web mail service and the Google Maps street mapping program.

    See the Google website at http://www.google.com/


    ## The Constituent Parts of Ajax


    Now let''s examine the components of Ajax one at a time.


    ## The XMLHttpRequest Object


    In the traditional style of web page, when you issue a server request via a hyperlink
    or a form submission, the server accepts that request, carries out any server-side
    processing, and subsequently serves to you a new page. While this processing takes
    place, the user interface is effectively frozen. You are made quite aware of this,
    when the server has completed its task, by the appearance in the browser of the
    new or revised page.


    With asynchronous server requests, however, such communications occur in the background,
    and the completion of such a request does not necessarily coincide with a screen
    refresh or a new page being loaded. You must therefore make other arrangements
    to find out what progress the server has in dealing with the request.


    You can do so by means of the XMLHttpRequest object. This JavaScript object is
    capable of making a connection to the server and issuing HTTP requests without
    the necessity of associated page load. In following lessons you will see how an
    instance of such an object can be created, and how its properties and methods
    can be used by JavaScript routines included in the page.


    > Tip As a security measure, the XMLHttpRequest object can generally only make
    calls to URLs within the same domain and cannot directly call a remote server.


    Lesson 8, "The XMLHttpRequest Object," discusses how to create an instance of
    the XMLHttpRequest object and reviews its properties and methods.


    ## Talking with the Server


    So far as the server-side is concerned, the communication from the XMLHttpRequest
    object is just another HTTP request. Ajax applications care little about what
    languages or operating environments exist at the server; provided that the client-side
    Ajax layer receives a timely and correctly formatted HTTP response from the server,
    everything will work just fine.

