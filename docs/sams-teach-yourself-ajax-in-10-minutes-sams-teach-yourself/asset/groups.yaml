    # LESSON 21


    # Using XOAD


    In this lesson you will learn about XOAD, a server-side framework with Ajax support
    written by Stanimir Angeloff.


    # Introducing XOAD


    So far in this part of the book we have looked at the prototype.js and Rico libraries
    and how they can help you to develop Ajax applications. Unlike these client-side
    libraries, which are written in JavaScript, XOAD is a server-side Ajax toolkit
    written in PHP.


    This lesson discusses some of the concepts behind XOAD and the basics of its use.


    > Tip XOAD is an acronym for XMLHttpRequest Object-oriented Application Development.


    All our work so far has concentrated on the use of JavaScript to handle both the
    server request and the returned data in Ajax applications. XOAD is a server-based
    solution written in PHP that takes a slightly different approach.


    XOAD applications make server-based PHP functions available to the client-side
    JavaScript interpreter by passing serialized versions of them as JavaScript objects.


    > Note Under the hood, XOAD employs JSON (JavaScript Object Notation) for communications.
    JSON was described in Lesson 19, "The prototype.js Toolkit.",'
  - "[PAGE 226]\n\n# Downloading and Installing XOAD\n\nXOAD is made up of many PHP\
    \ and supporting scripts and can be down-loaded as an archive file from http://sourceforge.net/projects/xoad.\
    \ To install XOAD successfully, you need access to a web server that supports\
    \ PHP and (to use the more advanced features of XOAD) the MySQL database. Detailed\
    \ instructions for installing XOAD can be found in the downloaded material, and\
    \ there is a public forum at http://forums.xoad.org.\n\n# A Simple XOAD Page\n\
    \nLet's take a look at an example of the simplest XOAD page. Suppose that you\
    \ have a PHP class that you want to use in your XOAD application. This class is\
    \ stored in the PHP file myClass.class.php:\n\n```\n<?php\nclass myCamera {\n\
    \    function strlen($mystring) {\n        return strlen($mystring);\n    }\n\
    \    function xoadGetMeta() {\n        XOAD_Client::mapMethods($this, array('stLength'));\n\
    \        XOAD_Client::publicMethods($this, array('stLength'));\n    }\n}\n?>\n\
    ```\n\nThis simple class has only one function, strlen(), which merely returns\
    \ the length of a string in the form of the function xoadGetMeta(). This information\
    \ tells XOAD which methods from the class are available to be exported to the\
    \ main application. In this case there is one, strlen().\n\n> Caution It is not\
    \ absolutely necessary to include metadata in the class, but it is recommended.\
    \ Without metadata, all methods will be public, and method names will be converted\
    \ to lowercase.\n\nYou now need to start constructing the main application script\
    \ xoad.php."
