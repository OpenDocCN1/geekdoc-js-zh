    In the <div> element id=displaydiv and sends the asynchronous server call to the
    URL serverscript.php?parameter=x.


    When responseAHAH() detects that the server has completed its response, the <div>
    element''s content is updated using the value stored in responseText; instead
    of showing the “please wait” message, the <div> now displays whatever text the
    server has returned.


    # # Applying myAHLlib.js in a Project


    We can demonstrate these techniques with a further simple Ajax application. This
    time, we''ll build a script to grab the ''keywords'' metatag information from
    a user-entered URL.


    > Metatags are optional HTML container elements in the <head> section of an HTML
    page. They contain data about the web page that is useful to search engines and
    indices in deciding how the page''s content should be classified. The ''keywords''
    metatag, where present, typically contains a comma-separated list of words with
    meanings relevant to the site content. An example of a ''keywords'' metatag might
    look like this:


    ```

    <meta name="keywords" content="programming, design,

    development, Ajax, JavaScript, XMLHttpRequest,

    script">

    ```


    Listing 13.2 shows the HTML code.


    # Listing 13.2 getkeywords.html


    ```

    <html>

    <head>

    <title>A ''Keywords'' Metatag Grabber</title>

    <SCRIPT language="JavaScript" SRC="myAHAlib.js">

    </SCRIPT>

    </head>

    <body>

    ```'
