    # A Brief Introduction to XML


    that document structure definitions may be found in an external file, race.dtd,
    which would perhaps contain something like the following:


    ```

    <!ELEMENT race (yacht+)>

    <!ELEMENT yacht (name, skipper, helm)>

    <!ATTLIST yacht raceNo #CDATA #REQUIRED>

    <!ELEMENT name (#PCDATA)>

    <!ELEMENT skipper (#PCDATA)>

    <!ELEMENT helm (#PCDATA)>

    ```


    Alternatively, this information could be quoted in the DOCTYPE Declaration itself,
    placed between [ and ] characters:


    ```

    <!DOCTYPE [

    <!ELEMENT race (yacht+)>

    <!ATTLIST yacht raceNo #CDATA #REQUIRED>

    <!ELEMENT yacht (name, skipper, helm)>

    <!ELEMENT name (#PCDATA)>

    <!ELEMENT skipper (#PCDATA)>

    <!ELEMENT helm (#PCDATA)>

    ]

    ```


    In this case we define four elements—namely, race, yacht, skipper, and helm—and
    one attribute list.


    > Tip DOCTYPE Declarations can contain both internal and external references,
    known as the internal and external subsets of the DTD.


    # Element Declarations


    The line


    ```

    <!ELEMENT race (yacht+>

    ```


    declares that the <race> element will contain elements of type <yacht>, whereas
    the + character indicates that there may be any number of occurrences from one
    upward of such <yacht> elements. Alternatively, we could use the * character to
    indicate any number of occurrences including zero, or the ? character to indicate
    zero or one occurrence. The absence of all of these characters indicates that
    there should be exactly one <yacht> element within <race>.'
  - '[PAGE 76]


    <lt;yacht&gt; element is declared to contain three further elements, &lt;name&gt;,
    &lt;skipper&gt;, and &lt;helm&gt;. The #CDATA term contained in the declarations
    for those elements stands for parsed character data and indicates that these elements
    contain character-based data and may not contain further elements. Other possible
    content types include MIXED (text and elements) and ANY (any valid content).


    # Attribute List Declarations


    Our example also contains the line


    ```

    <!ATLIST raceNo #CDATA #REQUIRED >

    ```


    Such declarations are used to specify what attributes are permitted or required
    for any given element. In our example, we specify that the &lt;yacht&gt; element
    has an attribute raceNo, the value of which is comprised of #CDATA (character
    data).


    The term #REQUIRED indicates that, in this example, the &lt;yacht&gt; element
    must have such an attribute. Other possibilities includeIMPLIED, specifying that
    such an attribute is optional; #DEFAULT followed by a value in quotation marks,
    specifying a default value for the attribute should none be declared in the XML
    document; or #FIXED followed by a value in quotation marks, fixing the value of
    the attribute to that quoted.


    # Valid XML


    If an XML document contains a DOTYPE Declaration and complies fully with the declarations
    it contains, it is said to be a valid XML document.


