    \  <option value=\"1\">Option B</option>\n  <option value=\"2\">Option C</option>\n\
    </select>\n```\n\nHere we could use\n\n```\n$F('input1')\n```\n\nto return the\
    \ value in the text box and\n\n```\n$F('input2')\n```\n\nto return the value of\
    \ the currently selected option of the select box. The $F() function works equally\
