    # LESSON 19


    # The prototype.js Toolkit


    In this lesson you will learn about the prototype.js JavaScript library and how
    it can reduce the work required for building capable Ajax applications.


    # Introducing prototype.js


    Part IV, “Commercial and Open Source Ajax Resources,” looks at some available
    code libraries and frameworks for Ajax development.


    We begin this lesson with Sam Stephenson''s prototype.js, a popular JavaScript
    library containing an array of functions useful in the development of cross-browser
    JavaScript routines, and including specific support for Ajax. You''ll see how
    your JavaScript code can be simplified by using this library''s powerful support
    for DOM manipulation, HTML forms, and the XMLHttpRequest object.


    The latest version of the prototype.js library can be downloaded from http://prototype.conio/.


    > Caution At the time of writing, prototype.js is at version 1.4.0. If you download
    a different version, check the documentation to see whether there are differences
    between your version and the one described here.'
- md: "\nIncluding the library in your web application is simple, just include in\
    \ the <head> section of your HTML document the line:\n<script src=\"prototype.js\"\
    \ Language=\"JavaScript\" type=\"text/javascript\"></script>\n\nprototype.js contains\
    \ a broad range of functions that can make JavaScript code quicker, and the resulting\
    \ scripts cleaner and easier to maintain.\n\nThe library includes general-purpose\
    \ functions providing shortcuts to regular programming tasks, a wrapper for HTML\
    \ forms, an object to encapsulate the XMLHttpRequest object, methods and objects\
    \ for simplifying DOM tasks, and more.\n\nLet’s take a look at some of these tools.\n\
    \n## The $() Function\n\n$() is essentially a shortcut to the getElementById()\
    \ DOM method. Normally, to return the value of a particular element you would\
    \ use an expression such as\n\n```javascript\nvar mydata = document.getElementById('someElementID');\n\
    ```\n\n$() function simplifies this task by returning the value of the element\
    \ whose ID is passed to it as an argument:\n\n```javascript\nvar mydata = $('someElementID');\n\
    ```\n\nFurthermore, $() (unlike getElementById()) can accept multiple element\
    \ IDs as an argument and return an array of the associated element values. Consider\
    \ this line of code:\n\n```javascript\nmydataArray = $('id1','id2','id3');\n```\n\
    \nIn this example:\n\n- mydataArray[0] contains value of element with ID id1.\n\
    - mydataArray[1] contains value of element with ID id2.\n- mydataArray[2] contains\
    \ value of element with ID id3.\n\n## The $F() Function\n\nThe $F() function returns\
    \ the value of a form field when the input element or its ID is passed to it as\
    \ an argument. Look at the following HTML snippet:\n\n```html\n<input type=\"\
    text\" id=\"input1\" name=\"input1\">\n<select id=\"input2\">\n  <option value=\"\
    0\">Option A</option>\n  <option value=\"1\">Option B</option>\n  <option value=\"\
    2\">Option C</option>\n</select>\n```\n\nHere we could use\n\n```javascript\n\
    $F('input1')\n```\n\nto return the value in the text box and\n\n```javascript\n\
    $F('input2')\n```\n\nto return the value of the currently selected option of the\
    \ select box. The $F() function works equally well on check box and text area\
    \ input elements, making it easy to return the value regardless of the input element\
    \ type.\n\n## The Form Object\n\nprototype.js defines a Form object having several\
    \ useful methods for simplifying HTML form manipulation.\n\nYou can return an\
    \ array of a form's input fields by calling the getElements() method:\n\n```javascript\n\
    inputs = Form.getElements('thisform');\n```\n\nThe serialize() method allows input\
