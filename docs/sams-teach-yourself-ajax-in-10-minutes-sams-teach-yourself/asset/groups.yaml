  - "[PAGE 228]\n\n# 218 Lesson 21\n\nI won't go into much detail about how the PHP\
    \ code works; this is after a book about Ajax, not advanced PHP. It's important,\
    \ though, to understand the concepts that underpin the code, so let's step through\
    \ Listing 21.1 and try to understand what's happening:\n\n```\n<?php\nrequire_once('myClass.php');\n\
    require_once('xad.php');\nXOAD_Server::allClasses('myClass');\nif (XOAD_Server::runServer())\
    \ {\n    exit;\n}\n?>\n<?= XOAD_Utilities::header('.') ?>\n```\n\nThe first part\
    \ of the script includes both xad.php and the required file myClass.php, and informs\
    \ XOAD which classes it may access (in this case only).\n\nThe XOAD function runServer()\
    \ checks whether the XOAD request is a client callback, and if it handles it appropriately.\
    \ The header() function is used to register the client headers.\n\nNow's look\
    \ at the remainder of the script:\n\n```\n<script type=\"text/javascript\">\n\
    var myobj = <?= XOAD_Client::register(new myClass()) ?>;\nvar mystring = 'My XOAD\
    \ Application';\nmyobj.stLengthError = function(error) {\n    alert(error.message);\n\
    \    return true;\n}\nmobj.stLength(mystring, function(result) {\n    document.write('String:\
    \ ' + mystring + ' Length: ' + result);\n});\n</script>\n```\n\nSee how the remainder\
    \ of the script is a <script>...</script> element?\nThe line\n\n```\nvar myobj\
    \ = <?= XOAD_Client::register(new myClass()) ?>;\n```\n\nexports the public methods\
    \ declared in myClass.php to a JavaScript object. We now have a JavaScript object\
    \ with a method stLength() that allows us to use the method of the same name from\
