    # 84 Lesson 8


    Because you don''t know in advance which browser, version, or operating system
    your users will have, your code must adapt its behavior on-the-fly to ensure that
    the instance of the object will be created successfully.


    For the majority of browsers that support XMLHttpRequest as a native object (Mozilla,
    Opera, and the rest), creating an instance of this object is straightforward.
    The following line creates an XMLHttpRequest object called request:


    ```

    var request = new XMLHttpRequest();

    ```


    Here we have declared a variable request and assigned to it the value returned
    from the statement new XMLHttpRequest(), which is invoking the constructor method
    for the XMLHttpRequest object.


    To achieve the equivalent result in Microsoft Internet Explorer, you need to create
    an ActiveX object. Here''s an example:


    ```

    var request = new ActiveXObject("Microsoft.XMLHTTP");

    ```


    Once again, this assigns the name request to the new object.


    To contemplate matters a little more, some versions of Internet Explorer have
    a different version of MSXML, the Microsoft XML parser, installed; in those cases
    you need to use the following instruction:


    ```

    var request = new ActiveXObject("Msxml2.XMLHTTP");

    ```


    # A Solution for All Browsers


    You need, therefore, to create a script that will correctly create an instance
    of a XMLHttpRequest regardless of which browser you are using (provided, of course,
    the browser supports XMLHttpRequest).


    A good solution to this problem is to have your try in turn each method of creating
    an instance of the object, until one such method succeeds. Have a look at Listing
    8.1, in which such a strategy is used.'
