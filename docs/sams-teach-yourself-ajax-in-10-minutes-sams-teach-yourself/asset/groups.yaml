    # The HTTP Response


    In answer to such a request, the server typically issues an HTTP response, the
    first line of which is often referred to as the *status line*. In that line the
    server echoes the HTTP version and gives a response status code (which is a three-digit
    integer) and a short message known as a *reason phrase*. Here''s an example HTTP
    response:


    ```

    HTTP/1.0 200 OK

    ```


    The response status code and reason are essentially intended as machine-human-readable
    versions of the same message, though the reason phrase may vary a little from
    server to server. Table 3.1 lists some examples of status codes and reason phrases.
    The first digit of the status code usually gives some clue about the nature of
    the message:


    +   * 1**—Information

    * 2**—Success

    * 3**—Redirected

    * 4**—Client error

    * 5**—Server error


    # TABLE 3.1 Some Commonly Encountered HTTP Response Status Codes


    | Status Code | Explanation |

    |---|---|n| 200 - OK | The request succeeded. |

    | 204 - No Content | The document contains no data. |

    | 301 - Moved Permanently | The resource has permanently moved to a different
    URI. |

    | 401 - Not Authorized | The request needs user authentication. |

    | 403 - Forbidden | The server has refused to fulfill the request. |

    | 404 - Not Found | The requested resource does not exist on the server. |'
