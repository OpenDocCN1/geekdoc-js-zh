  - '[PAGE 213]


    # Lesson 20


    # Using Rico


    In this lesson you will learn the basics of Rico, a powerful Ajax and user interface
    development framework.


    # Introducing Rico


    In Lesson 19, “The prototype.js Toolkit,” we looked at prototype.js, a powerful
    and useful JavaScript library that simplifies many of the tasks facing the Ajax
    developer.


    In this lesson we''ll take a look at Rico, a sophisticated Ajax framework employing
    the prototype.js library.


    Rico is an open source library that extends the capabilities of prototype.js to
    provide a rich set of interface development tools. In addition to the Ajax techniques
    discussed so far, Rico offers a whole range of tools such as drag-and-drop, cinematic
    effects, and more.


    > Tip Rico is the Spanish word for rich, which seems appropriate for a toolkit
    designed for building rich interfaces!


    # Using Rico in Your Applications


    To start using Rico to build applications with rich user interfaces, you need
    to include both Rico and prototype.js libraries in the <head>...</head> section
    of your web pages.


    ```

    <script src="scripts/prototype.js"></script>

    <script src="scripts/rico.js"></script>

    ```'
  - "[PAGE 214]\n\n# Rico’s AjaxEngine\n\nThe inclusion of rico.js causes an instance\
    \ called ajaxEngine of an AjaxEngine object to be created automatically ready\
    \ for you to use. The AjaxEngine is Rico’s mechanism for adding Ajax capabilities\
    \ to your web pages.\n\nThe AjaxEngine requires a three-step process to update\
    \ page elements via Ajax:\n\n+   1. Register the request handler. Registering\
    \ the request handler associates a unique name with a particular URL to be called\
    \ via Ajax.\n2. Register the response handler. Rico can deal with the return of\
    \ both HTML data and JavaScript code within the XML returned from the server.\
    \ In the former case, the response handler identifies a page element that is to\
    \ be updated using the returned data; in the latter case, a JavaScript object\
    \ that handles the server response.\n3. Make the Ajax call from the page by using\
    \ an appropriate handler.\n\nWe first register our request handler by making a\
    \ call to the registerRequest() method of ajaxEngine: ajaxEngine.registerRequest('getData',\
    \ 'getData.php');\n\nWe now have associated the name getData with a request to\
    \ the server routine getData.php. That server-side routine is required to return\
    \ a response in well-formed XML. The following is an example of a typical response:\n\
    \n```\n<ajax-response>\n  <response type=\"element\" id=\"showdata\">\n    <div\
    \ class=\"datadisplay\">\n      The <b>cat</b> sat on the <b>mat</b>\n    </div>\n\
    \  </response>\n</ajax-response>\n```"
  - "[PAGE 215]\n\nSuch responses always have a root element <ajax-response>. The\
    \ <response> element it contains in this example has two attributes, type element\
    \ and id showdata. These signify, respectively, that the response contains HTML,\
    \ and that this HTML is to be used to update the page element id showdata. This\
    \ element is updated via its innerHTML property.\n\n> > **Tip** Rico is capable\
    \ of updating multiple page elements from one request. To achieve this, the <ajax-response>\
    \ element may contain multiple <response> elements.\n\nThe other form of response\
    \ that Rico can return is a JavaScript object. Here’s an example:\n\n```\n<ajax-response>\n\
    <response type=\"object\" id=\"myTransform\">\n  <sentence>The cat sat on the\
    \ mat.</sentence>\n</response>\n</ajax-response>\n```\n\nHere the type by a JavaScript\
    \ object, the identity of which is contained in the id value (here myHandler).\
    \ is dealt with. The content of the response is always passed to the ajaxUpdate\
    \ method of this object.\n\nHow the response handler is registered depends on\
    \ which type of response we are dealing with. For responses of type element, you\
    \ can simply call: ajaxEngine.registerAjaxElement('showdata');\n\nIn the case\
    \ of responses containing a JavaScript object, you will need: ajaxEngine.registerAjaxObject('myTransform',\
    \ new myHandler());\n\nWhereas responses of type element are simply intended for\
    \ the updating of HTML page elements, responses of type object can have handlers\
    \ to process responses in any way they want. This allows Rico applications to\
    \ be built ranging from simple to sophisticated."
  - "[PAGE 216]\n\n# A Simple Example\n\nWe can see Rico in action using the simple\
    \ script of Listing 20.1. This application updates two HTML elements with a single\
    \ call to Rico’s ajaxEngine object. The script for the application is in Listing\
    \ 20.1.\n\n# Listing 20.1 A Simple Rico Application\n\n```\n<!DOCTYPE HTML PUBLIC\
    \ \"-W3C//DTD HTML 4.0\n// Transitional/EN\"\n<script src=\"http://www.w3.org/TR/html4/loose.dtd\"\
    >\n<html>\n<head>\n<title>Opening Rico</title>\n<script src=\"prototype.js\"></script>\n\
    <script src=\"rico.js\"></script>\n<script type=\"text/javascript\">\nfunction\
    \ callRICO()\n{\najaxEngine.registerRequest('myRequest', 'ricotest.php');\najaxEngine.registerAjaxElement('display');\n\
    ajaxEngine.registerAjaxElement('heading');\n}\n</script>\n</head>\n<body onload=\"\
    callRICO()\">\n<div id=\"heading\"><h3>Demonstrating Rico</h3></div>\n<input type=\"\
    button\" value=\"Get Server Data\"\n onclick=\"ajaxEngine.sendRequest('myRequest')\"\
    />\n<div id=\"display \\ ₼<p>This text should be replaced with\n <div>server data\
    \ ...</p></div>\n</body>\n</html>\n```\n\nYou will see from the code that the\
    \ single function callRICO() is used to register both the single request handler\
    \ myRequest and two response handlers. The response handlers are used to update\
    \ two <div> containers; one of these contains the page’s heading, the other a\
    \ short text message. On making the Rico request, the contents of both are updated,\
    \ leaving the page with a new title and now displaying some server information\
    \ instead of the previous text message. Figure 20.1 shows before and after screenshots."
- md: "\n# Using Rico\n\n![](img/2ee8632a2c5a7a595049f49876099e38_217_0.png)\n\n##\
    \ 20.1 Updating multiple page elements with Rico.\n\nThe server routine is a simple\
    \ PHP script that outputs the required XML data. The script uses PHP's `$SERVER['SERVER_SIGNATURE']`\
    \ global variable. Note that the script constructs and returns two <response>\
    \ elements, each responsible for updating a particular element in the HTML page.\n\
    \nListing 20.2 shows the server script.\n\n### LISTING 20.2 The Server Script\
    \ for Generating <ajax-response>\n\n```php\n<?php\nheader(\"Content-Type:text/xml\"\
    );\nheader(\"Cache-Control:no-cache\");\nheader(\"Pragma:no-cache\");\necho \"\
    <ajax-response><response type=\\\"response\"\nid=\\\"display\\\"><p>\n\" . \\\
    $SERVER['SERVER_SIGNATURE'] .\n\"</p></response>\n\" . \"<response type=\\\"element\\\
    \" id=\\\"heading\\\">\n<h3>Some Information about the Server</h3>\"\n\" . \"\
    </response></ajax-response>\";\n?>\n```\n\n# Lesson 20\n\n> Tip Lesson 9, \"Talking\
    \ with the Server,\" discussed problems that can occur due to the browser cache.\
    \ In that lesson we used a workaround involving adding a parameter of random value\
    \ to the URL of the server resource we wanted to call.\n\nThis script example\
    \ uses another technique, including the header commands\n\n```\nheader(\"Cache-Control:no-cache\"\
    );\nheader(\"Pragma:no-cache\");\n```\n\ninstructing the browser not to cache\
    \ this page, but to collect a new copy from the server each time.\n\n> Caution\
    \ PHP's $_SERVER global array variable was introduced in PHP 4.1.0. If you have\
    \ an older version of PHP installed, you'll need the global variable $_SERVER_VARS\
    \ instead.\n\n# Rico’s Other Interface Tools\n\nRico’s capabilities aren't limited\
