    # Cinematic Effects


    In addition to Ajax and drag-and-drop tools, Rico also makes available a host
    of user interface gadgets known collectively as **cinematic effects**.


    > Note Rico''s cinematic effects are extensions to the Effect class found in prototype.js.


    These effects include animation of page elements (changing their sizes and/or
    shapes), fading effects (altering the opacity of page elements), applying rounded
    corners to objects, and manipulating object colors.'
  - '[PAGE 224]


    Used alongside the interface techniques previously discussed, these effects can
    help you to build sophisticated, eye-catching, and user-friendly interfaces much
    more reminiscent of desktop applications than of web pages.


    # Summary


    Following our examination of the prototype.js library in the Lesson 19, this lesson
    moved on to experiment with Rico. Rico is an open source framework based on prototype.js
    that offers a simple way to integrate Ajax, along with drag-and-drop and other
    visual effects, into user interface designs.


    Finally, in Lesson 21, “Using XOAD,” we will look into an Ajax framework that
    uses an alternative approach—the server-side, PHP-based XOAD.'
- md: "\n# LESSON 21\n\n## Using XOAD\n\nIn this lesson you will learn about XOAD,\
    \ a server-side framework with Ajax support written by Stanimir Angeloff.\n\n\
    ## Introducing XOAD\n\nSo far in this part of the book we have looked at the prototype.js\
    \ and Rico libraries and how they can help you to develop Ajax applications. Unlike\
    \ these client-side libraries, which are written in JavaScript, XOAD is a server-side\
    \ Ajax toolkit written in PHP.\n\nThis lesson discusses some of the concepts behind\
    \ XOAD and the basics of its use.\n\n> Tip: XOAD is an acronym for XMLHttpRequest\
    \ Object-oriented Application Development.\n\nAll our work so far has concentrated\
    \ on the use of JavaScript to handle both the server request and the returned\
    \ data in Ajax applications. XOAD is a server-based solution written in PHP that\
    \ takes a slightly different approach.\n\nXOAD applications make server-based\
    \ PHP functions available to the client-side JavaScript interpreter by passing\
    \ serialized versions of them as JavaScript objects.\n\n> Note: Under the hood,\
    \ XOAD employs JSON (JavaScript Object Notation) for communications. JSON was\
    \ described in Lesson 19, \"The prototype.js Toolkit.\"\n\n## Downloading and\
    \ Installing XOAD\n\nXOAD is made up of many PHP and supporting scripts and can\
    \ be down-loaded as an archive file from http://sourceforge.net/projects/xoad.\
    \ To install XOAD successfully, you need access to a web server that supports\
    \ PHP and (to use the more advanced features of XOAD) the MySQL database. Detailed\
    \ instructions for installing XOAD can be found in the downloaded material, and\
    \ there is a public forum at http://forums.xoad.org.\n\n## A Simple XOAD Page\n\
    \nLet's take a look at an example of the simplest XOAD page. Suppose that you\
    \ have a PHP class that you want to use in your XOAD application. This class is\
    \ stored in the PHP file myClass.class.php:\n\n```php\n<?php\nclass myCamera {\n\
    \    function strlen($mystring) {\n        return strlen($mystring);\n    }\n\
    \    function xoadGetMeta() {\n        XOAD_Client::mapMethods($this, array('stLength'));\n\
    \        XOAD_Client::publicMethods($this, array('stLength'));\n    }\n}\n?>\n\
    ```\n\nThis simple class has only one function, strlen(), which merely returns\
    \ the length of a string in the form of the function xoadGetMeta(). This information\
    \ tells XOAD which methods from the class are available to be exported to the\
    \ main application. In this case there is one, strlen().\n\n> Caution: It is not\
    \ absolutely necessary to include metadata in the class, but it is recommended.\
    \ Without metadata, all methods will be public, and method names will be converted\
    \ to lowercase.\n\nYou now need to start constructing the main application script\
    \ xoad.php.\n\n## Using XOAD\n\n> Tip: The Ajax applications developed in previous\
    \ lessons were HTML files with file extensions .htm or .html. Because our XOAD\
    \ application contains PHP code, it must have a suitable file extension. Most\
    \ web server and PHP implementations will accept a file extension of .php, and\
    \ some will allow other extensions as .php4 or .html.\n\nListing 21.1: the XOAD\
    \ application. This is a fairly pointless program that simply returns the length\
    \ of a string, \"My XOAD Application\". Nevertheless, it demonstrates the concept\
    \ of methods from server-side PHP classes made available on the client side as\
    \ JavaScript objects.\n\n### Listing 21.1 A Simple XOAD Application\n\n```php\n\
    <?php\nrequire_once('myClass.class.php');\nrequire_once('xoad.php');\nXOAD_Server::allowClasses('myClass');\n\
    if (XOAD_Server::runServer()) {\n    exit;\n}\n?>\n<?= XOAD_Utilities::header('.')\
    \ ?>\n<script type=\"text/javascript\">\nvar myobj = <?= XOAD_Client::register(new\
    \ Class()) ?>;\nvar mystring = 'My XOAD Application';\nmyobj.onLengthError = function(error)\
    \ {\n    alert(error.message);\n    return true;\n}\nmyobj.strlen(mystring, function(result)\
    \ {\n    document.write('String: ' + mystring + '<br />Length: ' + result);\n\
    });\n</script>\n```\n\nOn loading the preceding document into a browser, the page\
    \ simply says:\nString: My XOAD Application\nLength: 19\n\nI won't go into much\
    \ detail about how the PHP code works; this is a book about Ajax, not advanced\
    \ PHP. It's important, though, to understand the concepts that underpin the code,\
    \ so let's step through Listing 21.1 and try to understand what's happening:\n\
    \n```php\n<?php\nrequire_once('myClass.php');\nrequire_once('xad.php');\nXOAD_Server::allClasses('myClass');\n\
    if (XOAD_Server::runServer()) {\n    exit;\n}\n?>\n<?= XOAD_Utilities::header('.')\
    \ ?>\n```\n\nThe first part of the script includes both xad.php and the required\
    \ file myClass.php, and informs XOAD which classes it may access (in this case\
    \ only).\n\nThe XOAD function runServer() checks whether the XOAD request is a\
    \ client callback, and if it handles it appropriately. The header() function is\
    \ used to register the client headers.\n\nNow's look at the remainder of the script:\n\
    \n```html\n<script type=\"text/javascript\">\nvar myobj = <?= XOAD_Client::register(new\
    \ myClass()) ?>;\nvar mystring = 'My XOAD Application';\nmyobj.stLengthError =\
    \ function(error) {\n    alert(error.message);\n    return true;\n}\nmyobj.strlen(mystring,\
    \ function(result) {\n    document.write('String: ' + mystring + '<br />Length:\
    \ ' + result);\n});\n</script>\n```\n\nSee how the remainder of the script is:\n\
    ```html\nvar myobj = <?= XOAD_Client::register(new myClass()) ?>;\n```\nThe line\
    \ exports methods declared in myClass.php to a JavaScript object.\n\n## XOAD HTML\n\
    \nXOAD HTML is an extension that allows for easy updating of HTML elements. The\
    \ following examples show the use of XOAD_HTML::getElementById() and XOAD_HTML::getElementsByTagName().\n\
    \n## XOAD_getElementById()\n\nThe XOAD_HTML::getElementById() method, like its\
    \ JavaScript equivalent, identifies the page element. Rather than include an external\
    \ file, in this example we have defined a class, Updater, within the application\
    \ itself. The first line uses XOAD_HTML::getElementById() to identify the page\
    \ element.\n\n### Listing 21.2 A Simple XOAD\n\n```php\n<?php\nclass Updater {\n\
    \    function change() {\n        $mtext = &XOAD_HTML::getElementById('display');\n\
    \        $mtext->style['backgroundColor'] = 'yellow';\n        $mtext->innerHTML\
    \ = 'My background color has changed.';\n    }\n}\ndefine('XOAD_OHANDLE', true);\n\
    ```\n\nThe XOAD_HTML::getElementById() method is similar to the code in Listing\
    \ 21.1. The function change() is made available as a JavaScript object. Listing\
    \ 21.2 shows the operation. The <div> with id=\"status\" is identified by the\
    \ page element.\n\n### Listing 21.2 Continued\n\n```php\n<?php\nrequire_once('xoad.php');\n\
    ?>\n<?= XOAD_Utilities::header('.') ?>\n<div id=\"status\">My background color\
    \ is white.</div>\n<script type=\"text/javascript\">\nvar myobj = XOAD_Client::register(new\
    \ Updater()) ?>;\n</script>\n```\n\n## XOAD_HTML::getElementsByTagName()\n\nThe\
    \ XOAD_HTML::getElementsByTagName() method returns an array of elements with a\
    \ certain type. Listing 21.3 identifies all page elements of type <div> and changes\
    \ some of their style attributes.\n\n### Listing 21.3 Changing All Page Elements\
    \ of a Given Type\n\n```php\n<?php\nclass Updater\n{\n    function change()\n\
    \    {\n        $myDivs = &XOAD_HTML::getElementsByTagName('div');\n        $myDivs->style['height']\
    \ = '60';\n        $myDivs->style['width'] = '350';\n        $myDivs->style['backgroundColor']\
    \ = 'lightgreen';\n        $myDivs->innerHTML = 'Size and color changed by XOAD';\n\
    \    }\n}\ndefine('XOAD_AUTOHANDLE', true);\nrequire_once('xoad.php');\n?>\n<?php\
    \ XOAD_Utilities::header('.') ?>\n<style>\ndiv {\nborder:1px solid black;\nheight:80;\n\
    width:150\n}\n</style>\n<div>Div 1</div>\n<br />\n<div>Div 2</div>\n<br />\n<div>Div\
    \ 3</div>\n<a href=\"#server\" onclick=\"myobj.change();\nreturn false;\"&gt;Update\
    \ All Divs</a>\n```\n\nThe three <div> elements in the page are identified by\
    \ XOAD_HTML::getElementsByTagName() and have their styles and sizes changed.\n"
  mdcn: "\n\n# 第 21 \n\n## 使用 XOAD\n\n在本节中，你将学习 XOAD，这是一个由 Stanimir Angeloff 编写的支持\
    \ Ajax 的服务器端框架。\n\n## 介绍 XOAD\n\n在本书的这一部分，我们查看了 prototype.js 和 Rico 库以及它们如何帮助你开发\
    \ Ajax 应用。与用 JavaScript 编写的客户端库不同，XOAD 是一个用 PHP 编写的服务器端 Ajax 工具包。\n\n本节讨论了 XOAD\
    \ 后的一些概念及其基本用法。\n\n> 提示：XOAD 是 XMLHttpRequest Object-oriented Application Development（面向对象的应用程序开发）的缩写。\n\
    \n到目前，我们的工作一直集中在使用 JavaScript 处理 Ajax 应用中的服务器请求和返回数据。XOAD 是一个用 PHP 编写的基于服务器的解决方案，它采用了稍不同的方法。\n\
    \nXOAD 应用通过将函数的序列化版本作为 JavaScript 对象，为客户端 JavaScript 解释器提供服务器 PHP 函数。\n\n> 注意：在底层，XOAD\
    \ 使用 JSON（JavaScript 对象表示）进行通信。JSON 已在第 19 节“prototype.js 工具包”中介绍过。\n\n## 下载与安装\
    \ XOAD\n\nXOAD 由许多 PHP 辅助脚本组成，可以从 http://sourceforge.net/projects/xoad 下载压缩包文件。要成功安装\
    \ XOAD，你需要访问一个支持 PHP 和（为了使用 XOAD 的更高级功能）MySQL 数据库的 Web 服务器。安装 XOAD 的详细说明可以在下载的材料中找到，http://forums.xoad.org\
    \ 有一个公共论坛。\n\n## 一个简单的 XOAD 页面\n\n让我们来看一个简单的 XOAD 页面的示例。假设你有一个想在 XOAD 应用使用的 PHP\
    \ 类。该类存储在 PHP 文件 `myClass.class.php` 中：\n\n```php\n<?php\nclass myCamera {\n \
    \   function strlen($mystring) {\n        return strlen($mystring);\n    }\n \
    \   function xoadGetMeta() {\n        XOAD_Client::mapMethods($this, array('stLength'));\n\
    \        XOAD_Client::publicMethods($this, array('stLength'));\n    }\n}\n?>\n\
    ```\n\n这个简单的类只有一个函数 `strlen()`，它仅仅以函数 `xoadGetMeta()` 的形式返回字符串的长度。此信息告诉 XOAD 类中哪些方法可以导出到主应用程序。在这种情况下，有一个方法，即\
    \ `strlen()`。\n\n> 警告：类中并非绝对必要包含元数据，但建议这样做。如果没有元数据，所有方法将是公开的，并且方法名将转换为小写。\n\n\
    你现在需要开始构建主应用程序脚本 `xoad.php`。\n\n## 使用 XOAD\n\n> 提示：在之前的节中开发的 Ajax 应用是扩展名为 .htm\
    \ 或 .html 的 HTML 文件。由于我们的 XOAD 应用包含 PHP 代码，它必须有一个适当的文件扩展名。大多数 Web 服务器和 PHP 实现都接受\
    \ .php 扩展名，有些还允许 .php4 或 .html 等其他扩展名。\n\n列表 21.1：XOAD 应用。这是一个相当无的程序，它只是返回字符串“My\
    \ XOAD Application”的长度。尽管如此，它演示了将服务器端 PHP 类的方法作为 JavaScript 对象提供给客户端的概念。\n\n###\
    \ 列表 21.1 一个简单的 XOAD 应用\n\n```php\n<?php\nrequire_once('myClass.class.php');\n\
    require_once('xoad.php');\nXOAD_Server::allowClasses('myClass');\nif (XOAD_Server::runServer())\
    \ {\n    exit;\n}\n?>\n<?= XOAD_Utilities::header('.') ?>\n<script type=\"text/javascript\"\
    >\nvar myobj = <?= XOAD_Client::register(new Class()) ?>;\nvar mystring = 'My\
    \ XOAD Application';\nmyobj.onLengthError = function(error) {\n    alert(error.message);\n\
    \    return true;\n}\nmyobj.strlen(mystring, function(result) {\n    document.write('String:\
    \ ' + mystring + '<br />Length: ' + result);\n});\n</script>\n```\n\n将前面的文档加载到浏览器中，页面简单地显示：\n\
    String: My XOAD Application\nLength: 19\n\n我不会详细介绍 PHP 代码是如何运行的；这是一本关于 Ajax 的书，而不是高级\
    \ PHP。不过，理解支撑代码的概念是很重要的，所以让我们逐步检查列表 21.1 并尝试理解正在发生什么：\n\n```php\n<?php\nrequire_once('myClass.php');\n\
    require_once('xad.php');\nXOAD_Server::allClasses('myClass');\nif (XOAD_Server::runServer())\
    \ {\n    exit;\n}\n?>\n<?= XOAD_Utilities::header('.') ?>\n```\n\n脚本的第一部分包含了 `xad.php`\
    \ 和所需的文件 `myClass.php`，并通知 XOAD 它可以访问哪些类（在本例中只有一个）。\n\nXOAD 函数 `runServer()` 检查\
    \ XOAD 请求是否为客户端回调，并进行适当处理。`header()` 函数用于注册客户端头。\n\n现在来看脚本的剩余部分：\n\n```html\n\
    <script type=\"text/javascript\">\nvar myobj = <?= XOAD_Client::register(new myClass())\
    \ ?>;\nvar mystring = 'My XOAD Application';\nmyobj.stLengthError = function(error)\
    \ {\n    alert(error.message);\n    return true;\n}\nmyobj.strlen(mystring, function(result)\
    \ {\n    document.write('String: ' + mystring + '<br />Length: ' + result);\n\
    });\n</script>\n```\n\n看到脚本的剩余部分：\n```html\nvar myobj = <?= XOAD_Client::register(new\
    \ Class()) ?>;\n```\n该行将 `myClass.php` 中声明的方法导出到 JavaScript 对象。\n\n## XOAD HTML\n\
    \nXOAD HTML 是一个允许轻松更新 HTML 元素的扩展。下面的示例展示了 `XOAD_HTML::getElementById()` 和 `XOAD_HTML::getElementsByTagName()`\
    \ 的用法。\n\n## XOAD_getElementById()\n\n`XOAD_HTML::getElementById()` 方法与其 JavaScript\
    \ 等效方法类似，可以识别元素。而不是包含外部文件，在本例中我们在内部定义了一个类 `Updater`。第一行使用 `XOAD_HTML::getElementById()`\
    \ 来识别页面元素。\n\n### 列表 21.2 一个简单的 XOAD\n\n```php\n<?php\nclass Updater {\n    function\
    \ change() {\n        $mtext = &XOAD_HTML::getElementById('display');\n      \
    \  $mtext->style['backgroundColor'] = 'yellow';\n        $mtext->innerHTML = 'My\
    \ background color changed.';\n    }\n}\ndefine('XOAD_HANDLE', true);\n```\n\n\
    `XOAD_HTML::getElementById()` 方法类似于列表 21.1 中的代码。`change()` 函数作为 JavaScript 对象提供。列表\
    \ 21.2 显示了该操作。id 为 `status` 的 `<div>` 被页面识别出来。\n\n### 列表 21.2 继续\n\n```php\n<?php\n\
    require_once('xoad.php');\n?>\n<?= XOAD_Utilities::header('.') ?>\n<div id=\"\
    status\">My background color is white.</div>\n<script type=\"text/javascript\"\
    >\nvar myobj = <?= XOAD_Client::register(new Updater()) ?>;\n</script>\n```\n\n\
    ## XOAD_HTML::getElementsByTagName()\n\n`XOAD_HTML::getElementsByTagName()` 方法返回特定类型的元素数组。列表\
    \ 21.3 识别所有类型为 `<div>` 的元素并更改它们的一些样式属性。\n\n### 列表 21.3 更改指定类型的页面元素\n\n```php\n\
    <?php\nclass Updater\n{\n    function change()\n    {\n        $myDivs = &XOAD_HTML::getElementsByTagName('div');\n\
    \        $myDivs->style['height'] = '60';\n        $myDivs->style['width'] = '350';\n\
    \        $myDivs->style['backgroundColor'] = 'lightgreen';\n        $myDivs->innerHTML\
    \ = 'Size and color changed by XOAD';\n    }\n}\ndefine('XOAD_AUTOHANDLE', true);\n\
    require_once('xoad.php');\n?>\n<?php XOAD_Utilities::header('.') ?>\n<style>\n\
    div {\nborder:1px solid black;\nheight:80;\nwidth:150\n}\n</style>\n<div>Div 1</div>\n\
    <br />\n<div>Div 2</div>\n<br />\n<div>Div 3</div>\n<a href=\"#server\" onclick=\"\
    myobj.change();\nreturn false;\"&gt;Update All Divs&lt;\n```\n\n页面上的三个 <div> 元素被\
    \ `XOAD_HTML::getElementsByTagName()` 识别，并且它们的样式和大小发生了变化。\n\n"
