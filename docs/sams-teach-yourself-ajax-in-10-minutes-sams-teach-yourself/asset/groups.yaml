    \ information and place it in the DOM.\n\n# REST and Ajax\n\nYou know already\
    \ that the XMLHttpRequest object has methods that directly deal with HTTP types.\
    \ Accessing RESTful services is therefore simplified. Because you know that each\
    \ resource exposed by the service has a unique URL, and that the methods available\
    \ by the service are standard HTTP methods, it becomes a simple matter to construct\
    \ the XMLHttpRequest calls.\n\n# Summary\n\nThis lesson introduced the concept\
    \ of web services and the principles underlying the REST protocol. REST requires\
    \ that all resources be accessible via unique URLs and that all required actions\
    \ can be carried out on those resources by means of the HTTP methods. This makes\
    \ RESTful services interface comfortably with Ajax applications, due to the XMLHttpRequest\
    \ object having methods that directly reference URLs and HTTP methods.\n\n# Lesson\
    \ 16: Using SOAP\n\nIn this lesson you will learn about using web services with\
    \ the SOAP protocol.\n\n# Introducing SOAP (Simple Object Access Protocol)\n\n\
    In Lesson 15, \"Web Services and the REST Protocol,\" we discussed web services\
    \ and in particular saw how the REST (Representational State Transfer) protocol\
    \ can be used to provide a consistent application programming interface (API)\
    \ to such services.\n\n REST is a good example of a protocol designed to operate\
    \ with resource-oriented services, those that provide a simple mechanism to locate\
    \ a resource and a set of basic methods that can manipulate a resource. In a resource-oriented\
    \ service, those methods normally revolve around creating, retrieving, modifying,\
    \ and deleting pieces of information.\n\nIn the case of REST, the methods are\
    \ those specified in the HTTP specifications—GET, POST, PUT, and DELETE.\n\nIn\
    \ certain cases, however, we are more interested in the actions a web service\
    \ can carry out than in the resources it control. We might call such services\
