    > The full name Simple Object Access Protocol has been dropped in the later versions
    of the SOAP specifications, as it was felt that the direction of the project had
    shifted and the name was no longer appropriate. The protocol continues to be referred
    to as SOAP.


    # The Background of the SOAP Protocol


    SOAP began in the late 1990s when XML was itself a fledgling technology and another
    XML-based web service protocol, called XML-RPC, had a joint upbringing with W3C
    in 2000.


    SOAP was designed essentially as a means of packaging remote calls (requests to
    invoke programs on remote machines) into XML wrappers in a standardized way.


    Numerous enterprises contributed to the early development of SOAP, including IBM,
    Microsoft, and Userland. The development of SOAP later passed to the XML Protocols
    Working Group of the W3C.


    > You can get the latest information on the SOAP specification from the W3C website
    at http://www.w3.org/2000/xp/Group/


    # The SOAP Protocol


    SOAP is an XML-based messaging protocol. A SOAP request is an XML document with
    the following main constituents:


    +   * An envelope that defines the document as a SOAP request

    * A body element containing information about the call and the expected responses

    * Optional header and fault elements that carry supplementary information'
  - "[PAGE 178]\n\nLet’s look at a skeleton SOAP request:\n\n```\n<?xml version=\"\
    1.0\"?>\n<SOAP-ENV:Envelope\nxmlns:SOAP-ENV=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \nSOAP-ENV:encodingStyle=\n=\"http://schemas.xmlsoap.org/soap/encoding/\"\n  <SOAP-ENV:Header>\n\
    \  .. various commands ..\n</SOAP-ENV:Header>\n<SOAP-ENV:Body>\n  .. various commands\
    \ ..\n<SOAP-ENV:Fault>\n  .. various commands ..\n</SOAP-ENV:Fault>\n</SOAP-ENV:Body>\n\
    </SOAP-ENV:Envelope>\n```\n\nNote that the SOAP request is an XML file, which\
    \ has as its root the Envelope element.\n\nThe first line of the Envelope is\n\
    \n```\n<SOAP-ENV:Envelope xmlns:SOAP-EN =\n=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \nSOAP-ENV:encodingStyle=\n=\"http://schemas.xmlsoap.org/soap/encoding/\"\n```\n\
    \nThis line declares the xmlns:soap namespace, which must always have the value\
    \ xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\".\n\n> Tip A namespace\
    \ is an identifier to uniquely group a set of XML elements or attributes, providing\
    \ a means to qualify their names, so that names in other schemas do not conflict\
    \ with them.\n\nThe encodingStyle attribute contains information defining the\
    \ data types used in the message.\n\nNext appears the Header element, which is\
    \ optional but must, if present, the first element in the message. Attributes\
    \ defined in the Header element define how the message is to be processed by the\
    \ receiving application."
  - '[PAGE 179]


    # Web Services Using SOAP


    The body element of the SOAP message contains the message intended for the final
    recipient.


    The serialized arguments are contained within the SOAP request''s body element.
    The call''s XML element must immediately follow the opening XML tag of the SOAP
    body and must have the same name as the remote method being called.


    The body may also contain a Fault element (but no more than one). This element
    is defined in the SOAP specification and is intended to carry information about
    any errors that may have occurred. If it exists, it must be a child element of
    the body element. The Fault element has various child elements including faultcode,
    faultstring, and detail, which contain specific details of the fault condition.


    # Code Example of a SOAP Request


    Let''s see how a typical SOAP request might look:


    ```

    <xml version="1.0"?>

    <SOAP-Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/" encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">

    <SOAP-ENV:Body>

    <m:GetInvoiceTotal xmlns:m="http://www.somedomain.com/invoices">

    <m:Invoice>77293</m:Invoice>

    </m:GetInvoiceTotal>

    </SOAP-ENV:Envelope>

    ```


    In the preceding example, the m:GetInvoiceTotal and m:Invoice elements are specific
    to the particular, and are not part of SOAP itself. These elements constitute
    the message contained in the SOAP envelope.


    Let''s see what the SOAP response from the web service might look like:


    ```

    <xml version="1.0"?>

    <SOAP-Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/" encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">

    <SOAP-ENV:Body>

    ```'
