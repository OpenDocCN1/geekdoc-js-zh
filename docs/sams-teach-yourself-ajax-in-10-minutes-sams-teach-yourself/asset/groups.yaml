  - '[PAGE 99]


    Over the next few lessons we''ll examine how these methods and properties are
    used to create the functions that form the building blocks of Ajax applications.


    For now, let''s examine just a few of these methods.


    # The open( ) Method


    The open() method prepares the XMLHttpRequest object to communicate with the server.
    You need to supply at least the two mandatory arguments to this method:


    +   - First, specify which HTTP method you intend to use, usually GET or POST.
    (The use of GET and POST HTTP requests were discussed in Lesson 3, "Sending Requests
    Using HTTP.")

    - Next, the destination URL of the request is included as the second argument.
    If making a GET request, this URL needs to be suitably encoded with any parameters
    and their values as part of the URL.


    For security reasons, the XMLHttpRequest object is allowed to communicate only
    with URLs within its own domain. An attempt to connect to a remote domain results
    in a "permission denied" error message.


    > Caution A common mistake is to reference your domain at mydomain.com in a call
    made from www.mydomain.com. The two will be regarded as different by the JavaScript
    interpreter, and connection will not be allowed.


    Optionally you may include a third argument to the send request, a Boolean value
    to declare whether the request is being sent in asynchronous mode. If set to false,
    the request will not be sent in asynchronous mode, and the page will be effectively
    locked until the request is completed. The default value of true will be assumed
    if the parameter is omitted, and requests will then be sent asynchronously.'
  - '[PAGE 100]


    > Note A Boolean data type has only two possible values, 1 (or true) and 0 (false).


    # The send() Method


    Having prepared the XMLHttpRequest using the open() method, you can send the request
    using the send() method. One argument is accepted by the send() function.


    If your request is a GET request, the request information will be encoded into
    the destination URL, and you can simply invoke the send() method using the objectname.send(null);


    ```

    objectname.send(null);

    ```


    However, if you are making a POST request, the content of the request (suitably
    encoded) will be passed as the argument.


    ```

    objectname.setRequestHeader(''Content-Type'', ''application/x-www-form-urlencoded'');

    objectname.send(var1=value1&var2=value2);

    ```


    In this case we use the setHeader method to indicate what type of content we are
    including.


    # Summary


    This lesson introduced the XMLHttpRequest object, the driving force behind any
    Ajax application, and illustrated how an instance of such an object is created
    for Internet Explorer and for other, non-Microsoft browsers. We also briefly examined
    some of the object''s properties and methods.


    Following lessons will show how more of the object''s methods and properties are
    used.'
