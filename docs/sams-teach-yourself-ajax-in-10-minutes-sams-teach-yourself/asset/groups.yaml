    The server said: \" + myRequest.responseText);\n  } else {\n    // 为其他 HTTP 响应发出错误消息\n\
    \    alert(\"An error has occurred: \");\n  }\n}\n```\n\n## 总结\n\n本节查看了 XMLHttpRequest\
    \ 与服务器通信的方式，包括发送异步请求、监控服务器状态以及执行回调函数。\n\n"
