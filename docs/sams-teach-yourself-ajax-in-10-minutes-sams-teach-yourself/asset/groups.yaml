    # Sams Teach Yourself AJAX in Ten Minutes


    Internet applications with much more appealing user interfaces than those to which
    we have become accustomed.


    When using popular desktop applications, we expect the results of our work to
    be made available immediately, without fuss, and without having to wait for the
    whole screen to be redrawn by the program. While using a spreadsheet such as Excel,
    for instance, we expect the changes we make in one cell to propagate immediately
    through the neighboring cells while we continue to type, scroll the page, or use
    the mouse.


    Unfortunately, this sort of interaction is seldom available to users of web-based
    applications. More common is the experience of entering data into form fields,
    clicking on a button or link, and then sitting back the page slowly reloads to
    exhibit the results of the request. In addition, we often find that the majority
    of the reloaded page consists of elements that are identical to those of the previous
    page and that therefore have been reloaded unnecessarily; background images, logos,
    and menus are frequent offenders.


    Ajax promises us a solution to this problem. By working as an extra layer between
    the user''s browser and the web server, Ajax handles server communications, submitting
    server requests and processing the returned data. The results may then be integrated
    seamlessly into the page being viewed, without page needing to be refreshed or
    a new loaded.


    In Ajax applications, such server requests are not necessarily synchronized with
    user actions such as clicking on buttons or links. A well-written Ajax application
    may already have asked of the server, and the data required by the user—before
    the user even knew they wanted it. This is the meaning of the asynchronous part
    of the Ajax acronym.


    The parts of an Ajax application that happen "under the hood" of the user''s browser,
    such as sending server queries and dealing with the returned data, are written
    in JavaScript, and XML is an increasingly popular means of coding and formatting
    information used by Ajax to efficiently transfer data between server and client.


    We''ll look at all these techniques, and how they can be made to work together,
    as we work through the lessons.


    # Who This Book Is For


    This volume is aimed primarily at web developers seeking to build better interfaces
    for the users of their web applications and programmers from desktop environments
    looking to transfer their applications to the Internet.


    It proves useful to web designers eager to learn how the latest techniques can
    offer new outlets for their creativity. Although the nature of Ajax applications
    means that they require some programming, all the required technologies are explained
    from first principles within the book, so even those with little or no programming
    experience should be able to follow the lessons without a great deal of difficulty.


    # # What Do I Need To Use This Book?


    The main requirement is to have an interest in exploring how people and computers
    work better together. Although some programming experience, especially in JavaScript,
    will certainly be useful it is by no means mandatory because there are introductory
    tutorials in all the required technologies.


    To try out the program code for yourself you need access to a web server and the
    means to upload files to it (for example, via File Transfer Protocol, usually
    called FTP). Make sure that your web host allows you to use PHP scripts on the
    server, though the majority do these days.


    To write and edit program code you need a suitable text editor. Windows Notepad
    does the job perfectly well, though some specialized programmers'' editors offer
    additional facilities such as line numbering and syntax highlighting. The appendix
    contains details of some excellent examples that may be downloaded and used free
    of charge.


    # Conventions Used in This Book


    In addition to the main text of each lesson, you will find a number of boxes labeled
    as Tips, Notes, and Cautions.


    > **Tip** Tips offer useful shortcuts or easier ways to achieve something.


    > **Note** Notes are snippets of extra information relevant to the current theme
    of the text.


    > **Caution** Cautions detail traps that may catch the unwary and advise how to
    avoid them.


    # # Online Resources and Errata


    Visit the Sams Publishing website at www.sampublishing.com where you can download
    the example code and obtain further information and details of errata.


    # # LESSON 1


    # # Anatomy of a Website


    We have a lot of ground to cover in this book, so let''s get to it. We''ll begin
    by reviewing in this lesson what the World Wide Web is and where it came from.
    Afterward we''ll take a look at some of the major components that make it work.


    # ## A Short History of the Web


    In the late 1950s, the U.S. government formed the Advanced Research Projects Agency
    ARPA. This was largely a response to the Russian success in launching the Sputnik
    satellite and employed some of the country''s top scientific intellects in research
    work with U.S. military applications.


    During the 1960s, the agency created a decentralized computer network known as
    ARPANet. This embryonic network initially linked four computers located at the
    University of California at Los Angeles, Stanford Research Institute, the University
    of California at Santa Barbara, and the University of Utah, with more nodes added
    in the early 1970s.


    The network had initially been designed using the then-technology of packet switching
    and was intended as a communication system that would remain functional even if
    some nodes should be destroyed by a nuclear attack.


    Email was implemented in 1972, closely followed by the telnet protocol for logging
    on to remote computers and the File Transfer Protocol (FTP), enabling file transfer
    between computers.


    This developing network was enhanced further in subsequent years with improvements
    to many facets of its protocols and tools. However, it was not until 1989 when
    Tim Berners-Lee and his colleagues at the European particle physics laboratory
    CERN (Conseil Européen pour la Recherche Nuclaire) proposed the concept of linking
    documents with hypertext that the now familiar World Wide Web began to take shape.
    (Wait, the text was split: European ... proposed the concept of linking documents
    with hypertext that the now familiar World Wide Web began to take shape. The year
    1993 saw the introduction of Mosaic, the first graphical web browser and fore-runner
    of the famous Netscape Navigator.)


    The use of hypertext pages and hyperlinks helped define the page-based interface
    model that we still regard as the norm for web applications today.


    # Workings of the World Wide Web


    The World Wide Web operates using a client/server networking principle. When you
    enter the URL (the web address) of a web page into your browser and click on Go,
    you ask the browser to make an HTTP request of the particular computer having
    that address. On receiving this, that computer returns (“serves”) the required
    page to you in a format that your browser can interpret and display. Figure 1.1
    illustrates this relation. In the case of the Internet, of course, the server
    and client computers may be located anywhere in the world.


    FIGURE 1.1 How web servers and clients (browsers) interact.


    Lesson 3, “Sending Requests Using the HTTP Protocol,” discusses the nitty-gritty
    of HTTP requests in more detail. For now, suffice to [say] say that your HTTP
    request contains several pieces of information needed so that your page may be
    correctly identified and served to you, including the following:


    - The domain at which the page is stored (for example, mydomain.com)

    - The name of the page (This is the name of a file in the web server''s file system—for
    example, mypage.html)

    - The names and values of any parameters that you want to send with your request


    # Anatomy of a Website


    What Is a Web Page?


    Anyone with experience using the World Wide Web will be familiar with the term
    web page. The traditional user interface for websites involves the visitor navigating
    among a series of connected pages containing text, images, and so forth, like
    the pages of a magazine.


    Generally, each web page is actually a separate file on the server. The collection
    of individual pages constituting a website is managed by a program called web
    server.


    # Web Servers


    A web server is a program that interprets HTTP requests and delivers the appropriate
    web page in a format that your browser can understand. Many examples are available,
    most running under either UNIX/Linux operating systems or under some version of
    Microsoft Windows.


    > The web server is often used in popular speech to refer to both the web server
    program—such as Apache—and the computer on which it runs.


    Perhaps the best-known server application is the Apache Web Server from the Apache
    Software Foundation (http://www.apache.org), an open source project used to serve
    millions of websites around the world (see Figure 1.2).

