    **FIGURE 2.2** Our test page with the body color changed to gray.


    > > **Tip** Color values in HTML are coded using a hexadecimal system. Each color
    value is made up from three component values, corresponding to red, green, and
    blue. Each of the color values can range from hex 00 to hex ff (zero to 255 in
    decimal notation). The three hex numbers are concatenated into a string prefixed
