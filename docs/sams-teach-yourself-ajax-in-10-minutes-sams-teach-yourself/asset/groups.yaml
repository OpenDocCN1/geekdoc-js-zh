    # REST and Ajx


    You know already that the XMLHttpRequest object has methods that allow you to
    directly deal with HTTP request types and URLs.


    Accessing RESTful services is therefore simplified to a great extent. Because
    you know that each resource exposed by the web service API has a unique URL, and
    that the methods available by the service are standard HTTP methods, it becomes
    a simple matter to construct the required XMLHttpRequest calls.


    The prospect of being able to access a wide variety of web services from within
    Ajax applications, and use the returned information within those applications,
    is attractive—even more so if you can use a consistent and simple interface protocol.


    # Summary


    This lesson introduced the concept of web services and the principles underlying
    the REST protocol.


    REST requires that all resources be made accessible via unique URLs and that all
    required actions can be carried out on those resources by means of the standard
    HTTP methods. This makes RESTful web services interface comfortably with Ajax
    applications, due to the XMLHttpRequest object having methods that directly reference
    URLs and HTTP methods to create server requests.


    Lesson 16 discusses a different style of web service using SOAP and how it relates
    to Ajax development.'
