    # # LESSON 18

    # Ajax

    # "Gotchas"


    In this lesson you''ll learn about some of the common Ajax mistakes and how to
    avoid them.


    # ## Common Ajax Errors


    Ajax has some common pitfalls waiting to catch the unwary developer. In this lesson,
    the last lesson of Part III, we''ll review some of these pitfalls and discuss
    possible approaches to finding solutions.


    The list is not exhaustive, and the solutions offered are not necessarily appropriate
    for every occasion. They should, however, provide some food for thought.


    # ## The Back Button


    All browsers in common use a Back button on the navigation bar. The browser maintains
    a list of recently visited pages in memory and allows you to step back through
    these to revisit pages you have recently seen.


    Users have become used to the Back button as a standard part of the experience,
    just as they have with the other facets of the page-based paradigm.


    Ajax, as you have learned, does much to shake off the idea of web-based information
    being delivered in separate, page-sized chunks; with an Ajax application, you
    may be able to change page content over and over again without any thought of
    reloading the browser display with a whole new page.'
  - '[PAGE 195]


    Tip JavaScript has its own equivalent of the Back button written into the language.
    The statements

    OnClick = "history.back()"


    OnClick = "history.go(-1)"


    both mimic the action of clicking the Back button once.


    What then of the Back button?

    This issue has caused considerable debate among developers recently. There seem
    to be two main schools of thought:


    +   - Create a means of recording state programmatically, and use to re-create
    a previous state when the Back button is pressed.

    - Persuade users that the Back button is no longer necessary.


    Artificially re-creating former states is indeed possible but adds a great deal
    of complexity to Ajax code and is therefore somewhat the province of the braver
    programmer!

    Although the latter option sounds a bit like it’s trying to avoid the issue, it
    perhaps has some merit. If you use Ajax to re-create desktop-like user interfaces,
    is worthy of note that desktop applications generally don’t have—or need—a Back
    button because the notion of separate “pages” never enters the user’s head!


    # # Bookmarking and Links


    This problem is not unrelated to the Back button issue.


    When you bookmark a page, you are attempting to save a shortcut to some content.
    In the page-based metaphor, this is not unreasonable; although pages can have
    some degree of dynamic content, being able'
  - '[PAGE 196]


    subsequently to find the page itself usually gets us close enough to seeing what
    we saw on our previous visit.


    Ajax, however, can use the same page address for a whole application, with large
    quantities of dynamic content being returned from the server in accordance with
    a user''s actions.


    What happens when you want to bookmark a particular screen of information/or pass
    that link to a friend or colleague? Merely using the URL of the current page is
    unlikely to produce the results you require.


    Although it may be difficult to totally eradicate this problem, it may be possible
    to alleviate it somewhat by providing permanent links to specially chosen states
    of an application.


    # Telling the User That Something Is Happening


    This is another issue somewhat related to the change of interface style away from
    separate pages.


    The user who is already familiar with browsing web pages may have become accustomed
    to program activity coinciding with the loading of a new or revised page.


    Many Ajax applications therefore provide some consistent visual clue that activity
    is happening; perhaps a stationary graphic image might be replaced by an animated
    version, the cursor style might change, or a pop-up message. Some of these techniques
    have been mentioned in some of the lessons in this book.


    # Making Ajax Degrade Elegantly


    The lessons in this book have covered the development of Ajax applications using
    various modern browsers. It is still possible, though, that a user might surprise
    you by attempting to use your application with a browser that is too old to support
    the necessary technologies. Alternatively, a visitor''s browser may have JavaScript
    and/or ActiveX disabled (for security or other reasons).'
  - '[PAGE 197]


    It is unfortunate if an Ajax application should break down under these conditions.


    At the least, the occurrence of obvious errors (such as a failure to create an
    instance of the XMLHttpRequest object) should be reported to the user. If the
    Ajax application is so complex that it cannot be automatically revert to a non-Ajax
    mode of operation, perhaps the user can at least be redirected to a non-Ajax version
    of the application.


    > Tip You can detect JavaScript is unavailable by using the <noscript> ... </noscript>
    tags in your HTML page. Statements between these tags are evaluated only if JavaScript
    is NOT available:

    <script>

    JavaScript is not available in this browser.<br />

    Please go a <a href="otherplace.htm">HERE</a> for the HTML-only version.<br />

    </script>


    # Dealing with Search Engine Spiders


    Search engines gather information about websites through various means, an important
    one being the use of automated programs called spiders.


    Spiders, as their name suggests, "crawl the web" by reading web pages and following
    links, building a database of content and other relevant information about particular
    websites. This database, better known as an index, is queried by search engine
    visitors using their key words and returns suggestions of relevant pages for them
    to visit.


    This can create a problem for highly dynamic sites, which rely on user interaction
    (rather than surfing) to invoke the loading of new content delivered over-demand
    by the server. The visiting spider may not have access to the content that would
    be loaded by dynamic means and therefore never gets to index.


    The problem can be exacerbated further by the use of Ajax, with its tendency to
    deliver even more content in still fewer pages.'
