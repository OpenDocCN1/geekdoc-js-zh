    # # Summary


    The JavaScript DOM methods, when used with the XMLHttpRequest object and XML data,
    provide a powerful means of transferring, organizing, and either displaying or
    otherwise processing data that has a sophisticated structure.


    In this lesson you saw how DOM elements can be added, deleted, and manipulated
    to restructure an application''s DOM in accordance with XML data received in the
    XMLHttpRequest object''s responseXML.'
