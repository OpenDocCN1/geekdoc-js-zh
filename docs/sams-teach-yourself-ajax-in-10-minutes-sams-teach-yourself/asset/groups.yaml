    # LESSON 13

    AHAH—

    Asynchronous

    HTML and

    HTTP


    In this lesson you will learn how to use AHAH (Asynchronous HTML and HTTP) to
    build Ajax-style applications without using XML.


    # Introducing AHAH


    You saw in Lesson 12, "Returning Data as Text," just how much can be achieved
    with an Ajax application without using any XML at all. Many tasks, from simply
    updating the text on a page to complicated data structures, can be carried out
    using only the text string whose value is returned in the XMLHttpRequest object''s
    responseText property.


    It is possible to build complete and useful applications without any XML at all.
    In fact, the term AHAH (Asynchronous HTML and HTTP) has been coined for such applications.


    This lesson takes the concepts of Lesson 12 a little further, examining in more
    detail where—and how—AHAH can be applied.


    > Note This technique, a kind of subset of Ajax, has been given various acronyms.
    These include AHAH (asynchronous HTML and HTTP), JAH (Just Asynchronous HTML),
    and HAJ (HTML and JavaScript). In this book we''ll refer to it as AHAH.'
