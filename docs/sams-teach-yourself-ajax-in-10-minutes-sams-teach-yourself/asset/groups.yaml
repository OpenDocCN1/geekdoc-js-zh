    \ you can add to your user interfaces using the Rico toolkit. Although these techniques\
    \ do not themselves use Ajax, it takes little imagination to realize what they\
    \ might achieve when combined with Rico’s Ajax tools.\n\n# Drag-and-Drop\n\nBoth\
    \ desktop applications and the operating systems on which they run make widespread\
    \ use of drag-and-drop to simplify the user interface. The JavaScript techniques\
    \ required to implement drag-and-drop can be tricky to master, not least because\
    \ of the many cross-browser issues that arise.\n\nDrag-and-drop using Rico, however,\
    \ is simple.\n\n# Using Rico 209\n\nIncluding the rico.js file in your application\
    \ automatically causes the creation of an object called dndMgr, Rico's Drag and\
