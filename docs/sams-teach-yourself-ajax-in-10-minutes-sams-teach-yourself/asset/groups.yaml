    # Lesson 17


    The steps required to “Ajaxify” myAJAXlib.js in the <head> area of the page.


    +   1. Include the Ajax library myAJAXlib.js in the <head> area of the page.


    +   2. Write a callback function to deal with the returned information.


    +   3. Add an event handler to the page to invoke the server call.


    We''ll start demonstrating a GET request and using the information returned in
    the responseText property. This is similar to the situation we faced when dealing
    with AHAH in Lesson 13.


    Including the Ajax library is straightforward:


    ```

    <head>

    <script Language="JavaScript" src="myAJAXlib.js"></script>

    ```


    Next, we need to define our callback function to deal with the value stored in
    the responseText property. For these examples, we''ll simply display the returned
    text in an alert:


    ```

    <head>

    <script Language="JavaScript" src="myAJAXlib.js"></script>

    <script Language="JavaScript">

    function cback(text) {

    alert(text);

    }

    </script>

    ```


    Finally, we need to add an event handler call to call our button:


    ```

    onclick="doAjax(''libtest.php'',''param=hello'',''cback'',''get,\''0'')")

    ```


    Our server-side script libtest.php simply echoes back the parameter sent as the
    second argument:


    ```

    <?php

    echo "Parameter value was ".\$param;

    ?>

    ```


    While the remaining parameters of the function declare that the callback function
    is called cback, that we want to send an HTTP GET request, and we expect the returned
    data to be in responseText.'
