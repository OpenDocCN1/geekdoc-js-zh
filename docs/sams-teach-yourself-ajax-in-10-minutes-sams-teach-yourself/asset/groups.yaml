    # Lesson 13


    > Tip The @ character placed before a PHP method tells the PHP interpreter not
    to output an error message if the method should encounter a problem during execution.
    We require it in this instance because not all web pages contain a ''keywords''
    metatag; in the cases where none exists, we would prefer the method to return
    an empty string so that we can add our own error handling.


