    # Project—An RSS Headline Reader


    Let''s now take what we''ve learned returning XML data from the server and use
    these techniques to tackle a new project.


    XML data is made available on the Internet in many forms. One of the most popular
    is the RSS feed, a particular type of XML source usually containing news or other
    topical and regularly updated items. RSS feeds are available from many sources
    on the Web, including most broadcast companies and newspaper publishers, as well
    as specialist sites for all manner of subjects.


    We will write an Ajax application to take a URL for an RSS feed, collect the XML,
    and list the titles and descriptions of the news items contained in the feed.


    The following is part of the XML for a typical RSS feed:


    ```

    <rss version="0.91">

    <channel>

    <title>MyRSSfeed.com</title>

    <link>http://www.********.com/</link>

    <description>My RSS feed</description>

    <language>en-us</language>

    <item>

    <title>New Store Opens</title>

    <link>http://www.********.html</link>

    <description>A new music store opened today in Canal Road.

    The new business, Ajax Records, caters for a wide range of musical tastes.</description>

    </item>

    <item>

    <title>Bad Weather Affects Transport</title>

    <link>http://www.********.html</link>

    <description>Trains and buses were disrupted badly today due to heavy snow. Police
    advised people not to travel unless absolutely necessary.</description>

    </item>

    <item>

    <title>Date Announced for Mayoral Election</title>

    <link>http://www.********.html</link>

    ```'
