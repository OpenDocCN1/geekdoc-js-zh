    # Lesson 20


    > Tip Lesson 9, "Talking with the Server," discussed problems that can occur due
    to the browser cache. In that lesson we used a workaround involving adding a parameter
    of random value to the URL of the server resource we wanted to call.


    This script example uses another technique, including the header commands


    ```

    header("Cache-Control:no-cache");

    header("Pragma:no-cache");

    ```


    instructing the browser not to cache this page, but to collect a new copy from
    the server each time.


    > Caution PHP''s $_SERVER global array variable was introduced in PHP 4.1.0. If
    you have an older version of PHP installed, you''ll need the global variable $_SERVER_VARS
    instead.


    # Rico’s Other Interface Tools


    Rico’s capabilities aren''t limited to aiding the development of Ajax applications.
    Let''s look at some other capabilities you can add to your user interfaces using
    the Rico toolkit. Although these techniques do not themselves use Ajax, it takes
    little imagination to realize what they might achieve when combined with Rico’s
    Ajax tools.


    # Drag-and-Drop


    Both desktop applications and the operating systems on which they run make widespread
    use of drag-and-drop to simplify the user interface. The JavaScript techniques
    required to implement drag-and-drop can be tricky to master, not least because
    of the many cross-browser issues that arise.


    Drag-and-drop using Rico, however, is simple.'
  - '[PAGE 219]


    # Using Rico 209


    Including the rico.js file in your application automatically causes the creation
    of an object called dndMgr, Rico''s Drag and Drop Manager. Using the dndMgr object
    is like using AjaxEngine; this time, though, we need to register Ajax requests
    and responses, draggable items and drop zones (page elements that can receive
    dropped items).


    These tasks are carried out via the registerDraggable and registerDropZone methods:


    ```

    dndMgr.registerDraggable( new Rico.Draggable(''test'',

    ''dragElementID'') );

    dndMgr.registerDropZone(new Rico.Dropzone

    ''(dropElementID'') );

    ```


    These two simple commands declare, respectively, a page element with ID dragElementID
    as draggable, and another element with ID dropElementID as a drop zone. The argument
    ''test'' of the registerDraggable() method defines a type for the draggable item,
    which can be tested and used by subsequent code, if required.


    # Example of a Drag-and-Drop Interface


    Listing 20.3 shows how simple it is to implement drag-and-drop using Rico. The
    displayed HTML page is shown in Figure 20.2.


