    # Extending myAHAlib.js


    As it stands, myAHAlib.js is a simple implementation of AHAH. There are many ways
    it could be improved and extended, depending on how it is to be used. Rather than
    cover these in this lesson, we''ll leave these for your own experimentation. Here''s
    a few suggestions to get you started:


    +   - Currently only GET requests are supported. How might the functions be modified
    to allow POST requests?

    - Much of the user feedback discussed in Lesson 11, "Our First Ajax Application,"
    is not implemented in responseAHAH().

    - Is it possible for callAHAH() to be modified to accept an array of page elements
    for updating and (with the aid of a suitable server-side script) process them
    all at once?


    > One option we haven''t considered is the idea of passing back JavaScript code
    within responseText. Because JavaScript source code (like everything else in an
    HTML page) is made up of statements written in plain text, you can return JavaScript
    source from the server in the responseText property.

    You can then execute this JavaScript code using JavaScript''s eval() method:

    eval(object.responseText);


    Consider the situation where your server script returns the string:

    `alert(''Hello World!'');`


    In this case the eval() method would execute the content as a JavaScript statement,
    creating a dialog saying ''Hello World!'' with an OK button.'
- md: "\n# Summary\n\nIt will hopefully become clear, in the course of this lesson\
    \ and Lesson 12, that Ajax can achieve a lot of functionality without using any\
    \ XML at all.\n\nBy carefully using combinations of client-side coding in JavaScript\
    \ and server-side scripting in your chosen language, you can create data schemes\
    \ of high complexity.\n\nIn simpler applications, where all you want to do is\
    \ update the text of page elements, the XMLHttpRequest object's functionality\
    \ may be abstracted into a JavaScript function library and called from an HTML\
    \ page via straightforward methods.\n\nFor some tasks, however, you need to leverage\
    \ the power of XML. We’ll look at this subject in Lesson 14, “Returning Data as\
    \ XML.”\n\n# LESSON 14\n# Returning Data as XML\n\nIn this lesson you will learn\
    \ to use XML data returned from the server as the responseXML property of the\
    \ XMLHttpRequest object.\n\n## Adding the “x” to Ajax\n\nLesson 12, “Returning\
    \ Data as Text,” and Lesson 13, “AHAH—Asynchronous HTML and HTTP,” dealt with\
    \ some length with the true value contained in responseText and looked at several\
    \ techniques for using this information in applications. These examples ranged\
    \ from simple updates of page element text to applications using more sophisticated\
    \ data structures encoded string values that can be stored and transferred in\
    \ the responseText property.\n\nThe X in Ajax does, of course, stand for XML,\
    \ and there are good reasons for using the power of XML in your applications.\
    \ This is particularly true when you need to use highly structured information\
    \ and/or perform complex transactions between different types of representation.\n\
    \nAs discussed previously, the XMLHttpRequest object has a further property called\
    \ responseXML, which can be used to transfer information from the server via XML,\
    \ rather than in text strings.\n\nYou saw in Lesson 11, “Our First Ajax Application,”\
    \ how JavaScript’s document object model (DOM) methods can help you process this\
    \ XML information. This lesson looks at these techniques in a little more detail\
    \ and hopefully gives you a taste of what Ajax applications can achieve when leveraging\
    \ the power of XML.\n\n## The responseXML Property\n\nWhereas the responseText\
    \ of the XMLHttpRequest object contains a string, responseXML can be treated as\
    \ if it were an XML document.\n\n> **Caution** You need to make sure that your\
    \ server presents valid and well-formed XML to be returned via the responseXML\
    \ property. In situations where XML cannot be correctly parsed by the XMLHttpRequest\
    \ object, perhaps due to well-formedness errors or problems with unsupported character\
    \ encoding, the content of the responseXML is unpredictable and also likely to\
    \ be different in different browsers.\n\n> **Note** Like the responseText property,\
    \ the value stored in responseXML is read-only, so you cannot write directly to\
    \ this property; to manipulate it you must copy the value to another variable:\n\
    \n```\nvar myobject = http.responseXML;\n```\n\nThe complete structure and data\
    \ contained in the XML document can now be made available by using JavaScript’s\
    \ DOM methods. Later in the lesson we will demonstrate this with another working\
    \ Ajax application, but let's revisit the JavaScript DOM methods and introduce\
    \ a few new ones.\n\n## More JavaScript DOM Methods\n\nYou met some of the JavaScript\
    \ DOM methods, such as getElementById and getElementsByTagName, in previous lessons.\
    \ In those cases, we were mostly concerned with reading the values of the nodes\
    \ to write those values into HTML elements.\n\n## 144 Lesson 14\n\nThis lesson\
    \ looks at the DOM methods that can be used to actually create elements, thereby\
    \ changing the structure of the page.\n\nThe Document Object Model can be thought\
    \ of as a treelike structure of nodes. As well as reading the values associated\
    \ with those nodes, you can create and modify the nodes themselves, thereby changing\
    \ the structure and content of your document.\n\nTo add new elements to a page,\
    \ you need to first create the elements and attach them to the appropriate point\
    \ in your DOM tree. Let’s look at a simple example using the following HTML document:\n\
    \n```html\n<html\n<head>\n<title>Test Document</title>\n</head>\n<body>\nWe want\
    \ to place some text here:<br />\n<div id=\"displaydiv\"></div>\n</body>\n</html>\n\
    ```\n\nIn this example, we want to add the text \"Hello World!\" to the `&lt;div&gt;`\
    \ container in the document body. We will put your JavaScript routine into a function\
    \ that we'll call from the body's onLoad() event handler.\n\nFirst, we will use\
    \ the JavaScript DOM method createNode() to, well, create a text node:\n\n```\n\
    var textNode = createNode('Hello World!');\n```\n\nWe now to attach textNode to\
    \ the DOM tree of the document at the appropriate point.\n\nYou first learned\
    \ about child nodes in Lesson 4, \"Client-Side Coding Using JavaScript\": hopefully,\
    \ you recall that nodes in a document are said to have children if they contain\
    \ other document elements. JavaScript has an appendChild() method, which allows\
    \ us to attach our new text node to the DOM tree by making a child node of an\
    \ existing document.\n\nIn this case, we want our text to be inside the `&lt;div&gt;`\
    \ container having the id displaydiv:\n\n```\nvar textnode = document.createTextNode('Hello\
    \ World!');\ndocument.getElementById('displaydiv').appendChild(textnode);\n```\n\
    \n> **Note** Compare this DOM-based method of writing content to the page with\
    \ the innerHTML method used in Lesson 11.\n\nLet's look at the complete source\
    \ of the page, after wrapping this JavaScript code into a function and adding\
    \ the onLoad() event handler to execute it:\n\n```html\n<html>\n<head>\n<title>Test\
    \ Document</title>\n</head>\n<script type=\"JavaScript\">\nfunction hello() {\n\
    \  var textnode = document.createTextNode('Hello World!');\n  document.getElementById('displaydiv').appendChild(textnode);\n\
    }\n</script>\n<body onload=\"hello()\">\nWe want to place some text here:<br />\n\
    <div id=\"displaydiv\"></div>\n</body>\n</html>\n```\n\nFigure 14.1 shows the\
    \ browser after loading this.\n\nWhen you want to create other elements besides\
    \ text nodes, you can do so using the createElement() method, which works pretty\
    \ much like createTextNode().\n\n```\nvar newdiv = document.createElement(\"div\"\
    );\n```\n\nIn general, you simply pass the type of the element as an argument\
    \ to createElement() to generate the required type of element.\n\n## An Overview\
    \ of DOM Methods\n\nThis book is about Ajax, not just about JavaScript DOM techniques,\
    \ so we’re not going to reproduce here a comprehensive guide to all the methods\
    \ and properties. However, Table 14.1 itemizes some of the more useful ones.\n\
    \n## Returning Data as XML\n\n> **Tip If you need a more comprehensive account\
    \ of the JavaScript DOM methods and properties, Andrew Watt gives a useful list\
    \ in his excellent book Sams Teach Yourself XML in 10 Minutes (Sams Publishing,\
    \ ISBN 0672324171).\n\n### Table 14.1 Some JavaScript DOM Properties and Methods\n\
    \n| Property | Description |\n| :--- | :--- |\n| childNodes | Array of child nodes\
    \ |\n| firstChild | The first Child node |\n| lastChild | The last Child node\
    \ |\n| nodeName | Name of the node |\n| nodeType | Type of node |\n| nodeValue\
    \ | Value contained in the node |\n| nextSibling | Next node sharing the same\
    \ parent |\n| previousSibling | Previous node sharing same parent |\n| parentNode\
    \ | Parent of this node |\n| **Node Methods** | |\n| AppendChild | Add a new child\
    \ node |\n| HasChildNodes | True if this node has children |\n| RemoveChild |\
    \ Deletes a child node |\n| **Document Methods** | |\n| CreateAttribute | Make\
    \ a new attribute for an element |\n| CreateElement | Make a new document element\
    \ |\n| CreateTextNode | Make a text item |\n| GetElementsByTagName | Create an\
    \ array of tagnames |\n| GetElementsByById | Find an element by its ID |\n"
  mdcn: "\n\n# 总结\n\n在本节和第 12 节中，你应该会发现 Ajax 可以在完全不使用 XML 的情况下实现许多功能。\n\n通过仔细组合使用\
    \ JavaScript 客户端编码和你所选语言的服务器端脚本，你可以创建高复杂程度的数据方案。\n\n在较简单的应用程序中，如果你只是想更新页面元素的文本，`XMLHttpRequest`\
    \ 对象的功能可以被抽象为 JavaScript 函数库，并通过简单的方法从 HTML 页面进行调用。\n\n然而，对于某些任务，你需要利用 XML 的强大。我们将在第\
    \ 14 节“以 XML 返回数据”中讨论这一主题。\n\n# 第14 节\n# 以 XML 返回数据\n\n在本节中，你将学习如何将服务器返回的 XML\
    \ 数据作为 `XMLHttpRequest` 对象的 `responseXML` 属性。\n\n## 为 Ajax 添加“x”\n\n第 12 节“以文本返回数据”和第\
    \ 13 节“AHAH——异步 HTML 和 HTTP”花篇幅讨论了 `responseText` 中包含的真实值，并研究了在应用程序中使用这些信息的几种技术。这些示例从简单的页面元素文本更新，到使用更复杂的数据结构的编码字符串值（这些值可以存储并传输在\
    \ `responseText` 属性中）的应用程序。\n\n当然，Ajax 中的 X 代表 XML，在你的应用程序中使用 XML 的力量是有充分理由的。当你需要使用高度结构化的信息和/或在不同类型的表示之间执行复杂事务时，情况尤其如此。\n\
    \n正如之前讨论的，`XMLHttpRequest` 对象还有一个名为 `responseXML` 的属性，它可以通过 XML 从服务器传输信息，而不是通过文本字符串传输。\n\
    \n你在第 11 节“我们的第一个 Ajax 应用程序”中已经看到 JavaScript 的文档对象模型（DOM）方法如何帮助你处理这些 XML 信息。本节将更详细地研究这些技术，并希望让你领略当利用\
    \ XML 的力量时 Ajax 能够实现什么。\n\n## responseXML 属性\n\n`XMLHttpRequest` 对象的 `responseText`\
    \ 包含一个字符串，而 `responseXML` 可以被视为一个 XML 文档。\n\n> **注意** 你需要确保你的服务器呈现了有效且格式良好的 XML，以便通过\
    \ `responseXML` 属性返回。在 `XMLHttpRequest` 对象无法正确解析 XML 的情况下（可能是由于格式错误或不支持的字符编码问题），`responseXML`\
    \ 的内容是不可预测的，并且在不同浏览器中也可能不同。\n\n> **注意** 与 `responseText` 属性一样，存储在 `responseXML`\
    \ 中的值是只读的，因此你不能直接写入此属性；要操作它，必须将值复制到另一个变量：\n\n```\nvar myobject = http.responseXML;\n\
    ```\n\n现在可以使用 JavaScript 的 DOM 方法获取 XML 文档中包含的结构和数据。在本节稍后的部分，我们将通过另一个运行的 Ajax\
    \ 应用程序演示这一点，但让我们重新回顾 JavaScript DOM 方法并引入几个新方法。\n\n## 更多 JavaScript DOM 方法\n\n\
    你在之前的课程中已经遇到过一些 JavaScript DOM 方法，例如 `getElementById` 和 `getElementsByTagName`。在那些情况下，我们主要关注读取节点的值以便将这些值写入\
    \ HTML 元素中。\n\n## 144 第14 节\n\n本节将介绍可以用于实际创建元素的 DOM 方法，从而改变页面结构。\n\n文档对象模型可以被看为节点的树形结构。除了读取与这些节点关联的值外，你还可以创建和修改节点本身，从而改变文档的结构和内容。\n\
    \n要在页面上添加新元素，你首先需要创建元素并将它们挂载到 DOM 树的相应位置。让我们使用以下 HTML 文档来看一个简单的示例：\n\n```html\n\
    <html\n<head>\n<title>Test Document</title>\n</head>\n<body>\nWe want to place\
    \ some text here:<br />\n<div id=\"displaydiv\"></div>\n</body>\n</html>\n```\n\
    \n在例例中，我们想在文档正体的 `&lt;div&gt;` 容器中添加文本“Hello World!”。我们将你的 JavaScript 程序放入一个函数中，并在正体的\
    \ `onLoad()` 事件处理器中调用它。\n\n首先，我们将使用 JavaScript DOM 方法 `createNode()`（注：此处应为 createTextNode）来，额创建一个文本节点：\n\
    \n```\nvar textNode = createNode('Hello World!');\n```\n\n现在我们需要将 `textNode` 挂载到文档\
    \ DOM 树的相应位置。\n\n你早在第 4 节“使用 JavaScript 进行客户端编码”中学习了子节点：希望你还记得，如果文档中的节点包含其他文档元素，则称该节点具有子节点。JavaScript\
    \ 有一个 `appendChild()` 方法，它允许我们通过成为现有文档的子节点来将新的文本节点挂载到 DOM 树上。\n\n在这种情况下，我们希望文本位于\
    \ id 为 `displaydiv` 的 `&lt;div&gt;` 容器内部：\n\n```\nvar textnode = document.createTextNode('Hello\
    \ World!');\ndocument.getElementById('displaydiv').appendChild(textnode);\n```\n\
    \n> **注意** 将这种基于 DOM 的写入页面内容的方法与第 11 节中使用的 `innerHTML` 方法进行对比。\n\n让我们页面的完整源代码，我们将这段\
    \ JavaScript 代码封装进函数中并添加 `onLoad()` 事件处理器来执行它：\n\n```html\n<html>\n<head>\n<title>Test\
    \ Document</title>\n</head>\n<script type=\"JavaScript\">\nfunction hello() {\n\
    \  var textnode = document.createTextNode('Hello World!');\n  document.getElementById('displaydiv').appendChild(textnode);\n\
    }\n</script>\n<body onload=\"hello()\">\nWe want to place some text here:<br />\n\
    <div id=\"displaydiv\"></div>\n</body>\n</html>\n```\n\n图 14.1 显示了加载此后的浏览器。\n\n\
    当你想要创建文本节点之外的其他元素时，可以使用 `createElement()` 方法，它的工作原理与 `createTextNodeNode()` 几乎相同。\n\
    \n```\nvar newdiv = document.createElement(\"div\");\n```\n\n通常情况下，你只需将元素类型作为参数传递给\
    \ `createElement()` 即可生成所需类型的元素。\n\n## DOM 方法概述\n\n这本书是关于 Ajax 的，而不仅仅关于 JavaScript\
    \ DOM 技术，因此我们不会在这里复制关于所有方法和属性的全面指南。然而，表 14.1 列出了一些更有用的方法。\n\n## 以 XML 返回数据\n\n\
    > **提示** 如果你需要关于 JavaScript DOM 方法和属性的更全面的叙述，Andrew Watt 在他出色的书籍《Sams Teach Yourself\
    \ XML in 10 Minutes》（Sams Publishing, ISBN 0672324171）中提供了一个非常有用的列表。\n\n### 表\
    \ 14.1 一 JavaScript DOM 属性和方法\n\n| 属性 | 说明 |\n| :--- | :--- |\n| childNodes |\
    \ 子节点数组 |\n| firstChild | 第一个子节点 |\n| lastChild | 最后一个子节点 |\n| nodeName | 节点名称\
    \ |\n| nodeType | 节点类型 |\n| nodeValue | 节点包含的值 |\n| nextSibling | 同一父节点的下一个节点\
    \ |\n| previousSibling | 同一父节点的上一个节点 |\n| parentNode | 节点的父节点 |\n| **节点方法** |\
    \ |\n| AppendChild | 添加新的子节点 |\n| HasChildNodes | 如果此节点有子节点则为真 |\n| RemoveChild\
    \ | 删除子节点 |\n| **文档方法** | |\n| CreateAttribute | 为元素创建新属性 |\n| CreateElement |\
    \ 创建新的文档元素 |\n| CreateTextNode | 创建文本项 |\n| GetElementsByTagName | 创建标签名的数组 |\n\
    | GetElementsByById | 通过 ID 查找元素 |\n\n"
