    # # LESSON 12

    Returning Data as Text


    In this lesson you will learn some more techniques for using the responseText
    property to add functionality to Ajax applications.


    # ## Getting More from the responseText Property


    The lessons of Part II, "Introducing Ajax," discussed the individual components
    that make Ajax work, culminating in a complete Ajax application. In Part III,
    "More Complex Ajax Technologies," each lesson examines how you can extend what
    you know to develop more sophisticated Ajax applications.


    For this lesson, we''ll look a little more closely at the responseText property
    of the XMLHttpRequest object and see how we can give our application some extra
    functionality via its use.


    As you have seen in previous lessons, the XMLHttpRequest object provides two properties
    that contain information received from the server, responseText and responseXML.
    The former presents the calling application with the server data in string format,
    whereas the latter provides DOM-compatible XML that can be parsed using JavaScript
    methods.


    Although the responseXML property allows you to carry out some sophisticated programming
    tasks, each can be achieved just by manipulating the value stored in the responseText
    property.


    # ## Returning Text


    The term text is perhaps a little misleading. The responseText property contains
    a character string, the value of which you can assign to a JavaScript variable
    via a simple assignment statement:


    ```

    var mytext = http.responseText;

    ```'
  - '[PAGE 134]


    There is no rule saying that the value contained in such a string must be legible;
    in fact, the value can contain complete gibberish provided that the string contains
    only characters that JavaScript accepts in a string variable.


    This fact allows a degree of flexibility in what sorts of information you can
    transfer using this property.


    # Using Returned Text Directly in Page Elements


    Perhaps the simplest example is to consider the use of value in responseText updating
    the textual part of a page element, say a <div> container. In this case you may
    simply take the returned string and apply it to the page element in question.


