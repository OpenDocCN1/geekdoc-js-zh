    # Anatomy of an Ajax Application


    It is possible to build simple Ajax applications with no server-side scripting
    at all, simply by having the XMLHttpRequest object call a static server-resource
    such as an XML or text file.


    Ajax applications may make calls to various other server-side resources such as
    web services. Later in the book we''ll look at some examples of calling web services
    using protocols such as SOAP and REST.


    > Note: In this book we''ll be using the popular PHP scripting language for our
    server-side routines, but if you are more comfortable with ASP, JSP, or some other
    server-side language, go right ahead and use it in your Ajax applications.


    # Dealing with the Server Response


    Once notified that an asynchronous request has been successfully completed, you
    may then utilize the information returned by the server.


    Ajax allows for this information to be returned in a number of formats, including
    ASCII text and XML data.


    Depending on the nature of the application, you may then translate, display, or
    otherwise process this information within the current page.


    We''ll look into these issues in Lesson 10, “Using the Returned Data."


    # Other Housekeeping Tasks


    An Ajax application will be required to carry out a number of other duties too.
    Examples include detecting error conditions and handling them appropriately, and
    keeping the user informed about the status of submitted Ajax requests.


    You will see various examples in later lessons.


    # Putting It All Together


    Suppose that you want to design a new Ajax application, or update a legacy web
    application to include Ajax techniques. How do you do about it?


    First you need to decide what page events and user actions will be responsible
    for the sending of an asynchronous HTTP request. You may decide, for example,
    that the onMouseEnter event of an image will result in a request being sent to
    the server to retrieve further information about the subject of the picture; or
    that the onClick event belonging to a button will generate a server request for
    information with which to populate the fields on a form.


    You saw in Lesson 4, "Client-Side Coding Using JavaScript," how JavaScript can
    be used to execute instructions on occurrences such as these, by employing event
    handlers. In your Ajax applications, such methods will be responsible for initiating
    asynchronous HTTP requests via XMLHttpRequest.


    Having made the request, you need to write routines to monitor the progress of
    that request until you hear from the server that the request has been successfully
    completed.


    Finally, after receiving notification that the server has completed its task,
    you need a routine to retrieve the information returned from the server and apply
    it in the application. You may, for example, want to use the newly returned data
    to change the contents of the page’s body text, populate the fields of a form,
    or pop open an information window.


    Figure 7.5 shows the flow diagram of all this.


    In Lesson 11, "Our First Ajax Application," we’ll use what we have learned to
    construct a complete Ajax application.


    ![](img/2ee8632a2c5a7a595049f49876099e38_89_0.png)


    **FIGURE 7.5** How the components of an Ajax application work together.


    ## Summary


    This lesson discussed the shortcomings of the traditional web interface, identifying
    specific problems we want to overcome. We also introduced the various building
    blocks of an Ajax application and discussed how they work together.


    In the following lessons of Part II, we will look at these components in more
    detail, finally using them to build a complete Ajax application.


    ![](img/2ee8632a2c5a7a595049f49876099e38_90_0.png)


    # LESSON 8


    # The XMLHttpRequest Object


    In this lesson you will learn how to create an instance of the XMLHttpRequest
    object regardless of which browser your user may have. The object''s properties
    and methods will be introduced.


    # More About JavaScript Objects


    Lesson 7, "Anatomy of an Ajax Application," introduced the building blocks of
    an Ajax application and discussed how these pieces fit together.


    This lesson examines the object at the heart of every Ajax application—the XMLHttpRequest
    object.


    > Note: You briefly meet objects in Lesson 4, "Client-Side Coding Using JavaScript,"
    when we discussed the document object associated with a web page. The XMLHttpRequest
    object, after it has been created, comes a further such object within the page''s
    object hierarchy and has its own properties and methods.


    An object can be thought of as a single package containing a set of properties,
    which contain and classify data, and a set of methods with which the object can
    perform actions on that data.


    Suppose, for example, that we had an object of type wheelbarrow. Such an object
    might have a property contents, which describes how many items the wheelbarrow
    holds at any given moment. Methods might include fill(), tip(), forward(), and
    stop(). When using JavaScript you can design such objects as you see fit.


    However, in addition to user-defined objects, JavaScript has a range of ready-made
    objects for use in scripts. These are referred to as native objects. Examples
    of JavaScript’s native objects include Math(), String(), and Date().


    ## Creating an Instance of an Object


    Many objects, such as the document object that you saw in Lesson 4, already exist
    and do not need you to create an instance of them. Others, however, require you
    to create an instance of the object in question before you can use it.


    You can create an instance of an object by calling a method known as the object’s
    constructor, using the new keyword:


    ```

    var myBarrow = new Wheelbarrow();

    ```


    Having created an instance myBarrow of the wheelbarrow, properties and methods
    for the object may be manipulated using a simple syntax:


    ```

    myBarrow.contents = 20;

    myBarrow.forward();

    myBarrow.stop();

    myBarrow.tip();

    ```


    Of course, you are liberty to create other instances of the same object and have
    them exist concurrently:


    ```

    var myBarrow = new Wheelbarrow();

    var yourBarrow = new Wheelbarrow();

    myBarrow.contents = 20;

    yourBarrow.contents = 50;

    ```


    ## The Document Object Model or DOM


    We mentioned briefly in Lesson 4 the hierarchy of objects “built in” to a web
    page and known as the Document Object Model. You access these objects and their
    properties and methods in the same way as native objects and objects that you
    devise and create yourself.


    > Note: The Document Object Model or DOM is really not a part of JavaScript but
    a separate entity existing outside it. Although you can use JavaScript to manipulate
    DOM objects, other scripting languages may equally well access them too.


    In later lessons you will see how the XMLHttpRequest object can use XML data returned
    from the server in response to XMLHttpRequest calls to create additional DOM objects
    you can use.


    # Introducing XMLHttpRequest


    XMLHttpRequest is supported by virtually all modern browsers, Microsoft''s Internet
    Explorer 5+ and a variety of non-Microsoft browsers, including Mozilla, Firefox,
    Konqueror, Opera, and Safari, is supported on a wide range of platforms, including
    Microsoft Windows, UNIX/Linux, and Mac OS X.


    > Caution: Some browsers may require attention to their security settings to allow
    the XMLHttpRequest object to operate correctly. See your browser''s documentation
    for details.


    The purpose of the XMLHttpRequest object is to allow JavaScript to formulate HTTP
    requests and submit them to the server. Traditionally programmed web applications
    normally make such calls synchronously, in conjunction with a user-initiated event
    such as clicking on a link or submitting a form, resulting in a new or updated
    page being served to the browser.


    Using XMLHttpRequest, however, you can have your page make calls asynchronously
    in the background, allowing you to continue using the page without the interruption
    of a browser refresh and the loading of a new or revised page. Although the object''s
    name begins with XML, in fact, any type of document may be returned from the server;
    ASCII text, HTML, and XML are all popular choices, and we will encounter all of
    these in the course of the book.


    # Creating the XMLHttpRequest Object


    You cannot make use of the XMLHttpRequest until you have created an instance of
    it. Creating an instance of an object in JavaScript is usually just a matter of
    making a call to a method known as the object''s constructor. In the case of XMLHttpRequest,
    however, you must change this routine a little to cater for the peculiarities
    of different browsers, as you see in the following section.


    ## Different Rules for Different Browsers


    Microsoft first introduced the XMLHttpRequest object, implementing it in Internet
    Explorer 5 as an ActiveX object.


    > ActiveX is a proprietary Microsoft technology for enabling active objects into
    web pages. Among the available web browsers, it is currently only supported in
    Microsoft''s Internet Explorer. Internet Explorer uses its built-in XML parser,
    MSXML, to create the XMLHttpRequest object.

