    # Lesson 14


    ![](img/2ee8632a2c5a7a595049f49876099e38_156_0.png)


    **Figure 14.1** The DOM says “Hello World!”


    When you want to create other page elements besides text nodes, you can do so
    using the createElement() method, which works pretty much like createTextNode().
    We could, in fact, have used createElement() to create the <div> container itself,
    prior to adding our ''Hello World!'' text node.


    ```

    var newdiv = document.createElement("div");

    ```


    In general, you simply pass the type of the required page element as an argument
    to createElement() to generate the required type of element.


    # An Overview of DOM Methods


    This book is about Ajax, not just about JavaScript DOM techniques, so we’re not
