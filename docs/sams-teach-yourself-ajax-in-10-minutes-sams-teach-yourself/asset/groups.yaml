  - '[PAGE 87]


    # Anatomy of an Ajax Application


    It is possible to build simple Ajax applications with no server-side script-ing
    at all, simply by having the XMLHttpRequest object call call a static server-resource
    such as an XML or text file.


    Ajax applications may make calls to various other server-side resources such as
    web services. Later in the book we''ll look at some examples of calling web services
    using protocols such as SOAP and REST.


    > Note In this book we''ll be using the popular PHP scripting language for our
    server-side routines, but if you are more comfortable with ASP, JSP, or some other
    server-side language, go right ahead and use it in your Ajax applications.


    # Dealing with the Server Response


    Once notified that an asynchronous request has been successfully com-pleted, you
    may then utilize the information returned by the server.


    Ajax allows for this information to be returned in a number of formats, including
    ASCII text and XML data.


    Depending on the nature of the application, you may then translate, dis-play,
    or otherwise process this information within the current page.


    We''ll look into these issues in Lesson 10, “Using the Returned Data."


    # Other Housekeeping Tasks


    An Ajax application will be required to carry out a number of other duties too.
    Examples include detecting error conditions and handling them appropriately, and
    keeping the user informed about the status of submitted Ajax requests.


    You will see various examples in later lessons.'
  - '[PAGE 88]


    # Putting It All Together


    Suppose that you want to design a new Ajax application, or update a legacy web
    application to include Ajax techniques. How do you do about it?


    First you need to decide what page events and user actions will be responsible
    for the sending of an asynchronous HTTP request. You may decide, for example,
    that the onMouseEnter event of an image will result in a request being sent to
    the server to retrieve further information about the subject of the picture; or
    that the onClick event belonging to a button will generate a server request for
    information with which to populate the fields on a form.


    You saw in Lesson 4, "Client-Side Coding Using JavaScript, how JavaScript can
    be used to execute instructions on occurrences such as these, by employing event
    handlers. In your Ajax applications, such methods will be responsible for initiating
    asynchronous HTTP requests via XMLHttpRequest.


    Having made the request, you need to write routines to monitor the progress of
    that request until you hear from the server that the request has been successfully
    completed.


    Finally, after receiving notification that the server has completed its task,
    you need a routine to retrieve the information returned from the server and apply
    it in the application. You may, for example, want to use the newly returned data
    to change the contents of the page’s body text, populate the fields of a form,
    or pop open an information window.


    Figure 7.5 shows the flow diagram of all this.


    In Lesson 11, "Our First Ajax Application," we’ll use what we have learned to
    construct a complete Ajax application.'
  - '[PAGE 89]


    ![](img/2ee8632a2c5a7a595049f49876099e38_89_0.png)


    **FIGURE 7.5** How the components of an Ajax application work together.


    # # Summary


    This lesson discussed the shortcomings of the traditional web interface, identifying
    specific problems we want to overcome. We also introduced the various building
    blocks of an Ajax application and discussed how they work together.


    In the following lessons of Part II, we will look at these components in more
    detail, finally using them to build a complete Ajax application.'
