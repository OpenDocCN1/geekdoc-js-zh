    # Lesson 21


    ![](img/2ee8632a2c5a7a595049f49876099e38_232_0.png)


    FIGURE 21.2 Selecting multiple page elements with XOAD_HTML.


    > Tip: XOAD_HTML has many other capabilities. Details of all the functions available
    within XOAD_HTML are in the XOAD download.


    # Advanced Programming with XOAD


    XOAD has a range of advanced capabilities over and above those discussed in this
    lesson. In case you want to investigate the limits of what is possible using XOAD,
    here is an overview of the currently supported techniques.


    # XOAD Events


    The XOAD framework also has support for events. A XOAD instigated on one client''s
    computer can be stored on the server and subsequently detected by other clients,
    making it possible to build complex applications in which users can interact.
    Such applications might, for instance, include chat, groupware, or similar collaborative
    tools.


    # Cache Handling with XOAD


    XOAD allows for the caching on the server using the XOAD_Cache class. Caching
    results gives significant performance improvements, especially when server-side
    routines are time-intensive (such as sorting a large data set or performing queries
    on a sizeable database table).


    # XOAD Controls


    You can define custom client controls in XOAD using the XOAD_Controls class.


    > Tip: At the time of writing, the current version of XOAD is 0.6.0.0. If the
    version you download is different, consult the documentation included in the download.


    # Summary


    This lesson examined a server-side implementation of an Ajax toolkit, in the form
    of XOAD.


    XOAD allows the methods contained within PHP classes stored on the server to be
    made available to client programs using JavaScript. This forms an interesting
    contrast in approach compared to the client-side techniques discussed in Lessons
    19 and 20.


    This concludes Part IV of the book and, in fact, the book itself. You should now
    have a good understanding of Ajax application architecture and the coding techniques
    on which it is based.


    Good luck with your experiments in Ajax!


