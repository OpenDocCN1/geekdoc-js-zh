  - '[PAGE 182]


    # Reviewing SOAP and REST


    Over the course of this lesson and Lesson 15, we’ve looked at the REST and SOAP
    approaches to using web services.


    Although other web services protocols exist, a significant REST versus SOAP argument
    has been waged among developers over the last couple of years.


    I don’t intend to join that argument about SOAP. Instead, let’s summarize the
    similarities and differences between the two approaches:


    +   - REST leverages the standard HTTP methods, GET, POST, and DELETE to create
    remote procedure calls having comparable functions. Web service implementations
    using the REST protocol seem particularly suited toward resource-based services,
    where the most-used methods generally involve creating, editing, retrieving, and
    deleting information. On the downside, REST requires a little more knowledge about
    the HTTP protocol.


    +   - The SOAP protocol adds substantial complexity, with the necessity to serialize
    the remote call and construct a SOAP envelope to contain. Further work arises
    from the need to “unpack” the returned data from its SOAP envelope before parsing
    the data. These extra steps can also have an impact on performance, with SOAP
    often being a bit slower in operation than REST for a similar task. SOAP does,
    however, make a more complete job of separating the remote procedure call from
    its method of transport, as well as add a number of extra features and facilities,
    such as the Fault element and type checking via namespaces.


    # Summary


    In this lesson we considered SOAP, the Simple Object Access Protocol. SOAP is
    a popular web service protocol with a rather different approach to the REST protocol
    utilized in Lesson 15.


    Either style of web service can be used via XMLHttpRequest, though they differ
    somewhat in the complexity of the code involved.'
- md: "\n# LESSON 17\nA JavaScript Library for Ajax\n\nIn this lesson you will learn\
    \ how to encapsulate some of the techniques studied up to now into a small JavaScript\
    \ library that you can call from your applications.\n\n## An Ajax Library\n\n\
    Through the lessons and code examples up to now, we have developed a number of\
    \ JavaScript code techniques for implementing the various parts of an Ajax application.\
    \ Among these methods are:\n\n- A method for generating an instance of the XMLHttpRequest\
    \ object, which works across the range of currently popular browsers\n- Routines\
    \ for building and sending GET and POST requests via the XMLHttpRequest object\n\
    - Techniques for avoiding unwanted caching of GET requests\n- A style of callback\
    \ function that checks for correct completion of the XMLHttpRequest call prior\
    \ to carrying out your wishes\n- Methods of providing user feedback\n- Techniques\
    \ for dealing with text data returned in responseText\n- Techniques for dealing\
    \ with XML information returned in responseXML\n\n## Lesson 17\n\nIn addition,\
    \ you saw in Lesson 13, “AHA—Asynchronous HTML and HTTP,” how some of these methods\
    \ could be abstracted into a small JavaScript “library” (in that case containing\
    \ only two functions).\n\nThis lesson extends that idea to build a more fully\
    \ featured library that allows Ajax facilities to be added simply to an HTML page\
    \ with minimal additional code.\n\nOf necessity, our Ajax library will not be\
    \ as complex or comprehensive as the open source projects described later in the\
    \ book; however, it will be complete enough to use in the construction of functional\
    \ Ajax\n\n## Reviewing myAAHlib.js\n\nListing 17.1 shows the code of myAAHlib.js,\
    \ reproduced from Lesson 13.\n\n- Listing 17.1 myAAHlib.js\n\n```javascript\n\
    function callAAH(url, pageElement, callMessage) {\n  document.getElementById(pageElement).innerHTML\n\
    \  = callMessage;\n  try {\n    req = new XMLHttpRequest(); /* e.g. Firefox */\n\
    \  } catch (e) {\n    req = new ActiveXObject(\"Msxml2.XMLHTTP\");\n    /* some\
    \ versions IE */\n  } catch (e) {\n    try {\n      req = new ActiveXObject(\"\
    Microsoft.XMLHTTP\");\n    /* some versions IE */\n    } catch (E) {\n      req\
    \ = false;\n    }\n  }\n  req.onreadystatechange =\nfunction(){responseAAH(pageElement);});\n\
    \  req.open(\"GET\",url,true);\n  req.send(null);\n}\n```\n\n```javascript\nfunction\
    \ responseAHAH(pageElement) {\n  var output = '';\n  if(req.readyState == 4) {\n\
    \    if(req.status == 200) {\n      output = req.responseText;\n      document.getElementById(pageElement).innerHTML\
    \ = output;\n    }\n  }\n}\n```\n\nLet's consider how we may extend the capabilities\
    \ of this library:\n\n- There is currently support only for HTTP GET requests.\
    \ It would be useful to be support at least the HTTP POST request too, especially\
    \ if you intend to build applications using the REST protocol (as described in\
    \ Lesson 15, \"Web Services and the REST Protocol\")\n- The library currently\
    \ only deals with text information returned via responseText and has no means\
    \ to deal with responseXML.\n\n## Implementing Our Library\n\nHaving identified\
    \ what needs to be done, we'll now put together a more capable Ajax library.\n\
    \n## Creating XMLHttpRequest Instances\n\nLet's turn our attention first to the\
    \ routine for creating instances of the XMLHttpRequest object.\n\nCurrently this\
    \ function is coupled tightly with the routine for constructing and sending HTTP\
    \ requests. Let's decouple the part responsible for the creation of the XMLHttpRequest\
    \ instance and put it into a function of its own:\n\n```javascript\nfunction createREQ()\
    \ {\n  try {\n    var req = new XMLHttpRequest(); /* e.g. Firefox */\n  } catch(err)\
    \ {\n    try {\n      req = new ActiveXObject(\"Msxml2.XMLHTTP\");\n      /* some\
    \ versions IE */\n    } catch (err2) {\n      try {\n        req = new ActiveXObject(\"\
    Microsoft.XMLHTTP\");\n        /* some versions IE */\n      } catch (err3) {\n\
    \        req = false;\n      }\n    }\n  }\n  return req;\n}\n```\n\nWe can now\
    \ create XMLHttpRequest object instances by simply calling the following function:\n\
    \n```javascript\nvar myreq = createREQ();\n```\n\n## HTTP GET and POST Requests\n\
    \nWe'll start with the GET request because we already support that type of request:\n\
    \n```javascript\nfunction requestGET(url, query, req) {\nmyRand=parseInt(Math.random()*999999999);\n\
    req.open(\"GET\",url+''+query+'&rand='+myRand,true);\nreq.send(null);\n}\n```\n\
    \nTo this request we must pass arguments to the URL to which the request will\
    \ be sent and the identity of the XMLHttpRequest object instance.\n\nWe could\
    \ exclude the query argument because, it's encoded into the URL. We keep the two\
    \ arguments separate here to maintain a similar interface to the function for\
    \ making POST requests.\n\nThe query argument must be suitably encoded prior to\
    \ calling the function, though the cache-busting random element is added by the\
    \ function.\n\n## A JavaScript Library for Ajax\n\nNext, the POST function:\n\n\
    ```javascript\nfunction requestPOST(url, query, req) {\nreq.open(\"POST\", url,\
    \ true);\nreq.setRequestHeader('Content-Type',\n  'application/x-www-form-urlencoded');\n\
    req.send(query);\n}\n```\n\n## The Callback Function\n\nHow do we deal with the\
    \ callback function? We are going to add further function:\n\n```javascript\n\
    function doCallback(item) {\neval(callback +)');\n}\n```\n\nThis uses JavaScript's\
    \ eval() to execute another function whose name is passed to it as an argument,\
    \ while also passing to that via item. Let's look at how these functions interact\
    \ when called from event handler:\n\n```javascript\nfunction doAjax(url,query,callback,reqtype,getxml)\
    \ {\n// create the XMLHttpRequest instance\nvar req = createREQ();\nmyreq.onreadystatechange\
    \ = function() {\nif(req.readyState == 4) {\nif(req.status == 200) {\nitem = req.responseText;\n\
    if(getxml==1) {\nitem = req.responseXML;\n}\ndoCallback(callback);\n}\n}\n```\n\
    \nOur doAjax function now takes five arguments:\n\n- url—The target URL for the\
    \ call\n- query—The encoded string\n- callback—Identity of the callback function\n\
