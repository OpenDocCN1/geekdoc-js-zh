    # Lesson 1


    particle physics laboratory CERN (Conseil Européen pour la Recherche Nuclaire)
    proposed the concept of linking documents with hypertext that the now familiar
    World Wide Web began to take shape. The year 1993 saw the introduction of Mosaic,
    the first graphical web browser and fore-runner of the famous Netscape Navigator.


    The use of hypertext pages and hyperlinks helped define the page-based interface
    model that we still regard as the norm for web applications today.


    # Workings of the World Wide Web


    The World Wide Web operates using a client/server networking principle. When you
    enter the URL (the web address) of a web page into your browser and click on Go,
    you ask the browser to make an HTTP request of the particular computer having
    that address. On receiving this, that computer returns (“serves”) the required
    page to you in a format that your browser can interpret and display. Figure 1.1
    illustrates this relation. In the case of the Internet, of course, the server
    and client computers may be located anywhere in the world.


    ![](img/2ee8632a2c5a7a595049f49876099e38_16_0.png)


    FIGURE 1.1 How web servers and clients (browsers) interact.


    Lesson 3, “Sending Requests Using the HTTP Protocol,” discusses the nitty-gritty
    of HTTP requests in more detail. For now, suffice to that'
