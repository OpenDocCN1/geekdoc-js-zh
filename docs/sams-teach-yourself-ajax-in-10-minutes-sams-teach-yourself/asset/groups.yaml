    # LESSON 10


    # Using the Returned Data


    In this lesson you will learn how to process the information returned from the
    server in response to an Ajax request.


    # The responseText and responseXML Properties


    Lesson 9, “Talking with the Server,” discussed the server communications that
    allow you to send and monitor asynchronous server requests. The final piece of
    the Ajax jigsaw is the information returned by the server in response to a request.


    This lesson discusses what forms that information can take, and how you can process
    and use it in an application. We will use two of the XMLHttpRequest object''s
    properties, namely responseText and responseXML.


    Table 8.1 listed several properties of the XMLHttpRequest object that we have
    yet to describe. Among these are the responseText and responseXML properties.


    Lesson 9 discussed how we could use the readyState property of the XMLHttpRequest
    object to determine the current status of the XMLHttpRequest call. By the time
    our server has completed, detected by the condition myRequest.readyState == 4
    for our XMLHttpRequest object myRequest, then the two properties responseText
    and responseXML will respectively contain text and XML representations of the
    data returned by the server.


    In this lesson you''ll see how to access the information contained in these two
    properties and apply each in an Ajax application.'
