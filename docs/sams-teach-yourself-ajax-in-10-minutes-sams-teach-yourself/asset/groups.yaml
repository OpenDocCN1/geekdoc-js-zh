    ## 什么是 HTML？


    互联网由数百万独立的页面组成，而这些页面通常用文本标记语言编写，即 HTML。


    这揭示了关于 HTML 的大量信息。我们使用它来标记文本文档，以便 Web 浏览器知道如何显示它们，并在内部或页面之间定义超链接以提供导航。


    任何人（像我这样）都能记得旧 WYSIG 文字处理程序对文本标记非常熟悉。这些旧应用程序需要在想要显示为粗体、斜体或下划线的文本段落放置特殊字符。


    ## 编写 HTML 需要什么工具？


    由于 HTML 标记元素仅使用键盘字符，您只需要一个良好的文本编辑器来构建 HTML 页面。有很多编辑器可用，大多数操作系统都预安装了这样一个程序。例如，如果您使用的是某些版本的
    Windows，内置的 Notepad 程序就足够。


    > 提示 虽然 Notepad 是一个非常实用的文本编辑器，但可以使用许多所谓的程序员编辑器，它们提供行号和语法高亮等额外功能。许多编辑器是开源的，并可以免费下载。对于较大或更复杂的编程任务，考虑此类编辑器是非常值得的。


    > 注意 虽然文本编辑器是编写程序代码的理想选择，但使用文字处理软件可能会由于此类程序通常在输出代码中嵌入意外标记和其他符号而导致问题。如果您选择使用文字处理器，请确保它能够将文件保存为纯
    ASCII 文本。


    # 我们的 HTML 文档


    让我们直接开始创建一个简单的 HTML 文档。打开 Notepad（或您选择的任何编辑器）并输入列表 2.1 所示的文本。HTML 标记元素（称为标签）是位于
    < 和 > 包围的字符字符串。


