    # LESSON 8


    # The

    HTTPRequest Object


    In this lesson you will learn how to create an instance of the

    HTTPRequest object regardless of which browser your user may have.

    The object''s properties and methods will be introduced.


    # More About JavaScript Objects


    Lesson 7, "Anatomy of an Ajax Application," introduced the building

    blocks of an Ajax application and discussed how these pieces fit together.


    This lesson examines the object at the heart of every Ajax application—

    HTTPRequest object.


    > Note You briefly meet objects in Lesson 4, "Client-

    Side Coding Using JavaScript," when we discussed the

    document object associated with a web page. The

    HTTPRequest object, after it has been created,

    comes a further such object within the page''s object

    hierarchy and has its own properties and methods.


    An object can be thought of as a single package containing a set of prop-\erties,
    which contain and classify data, and a set of methods with which

    t object can perform actions on that data.


    Suppose, for example, that we had an object of type wheelbarrow. Such

    an object might have a property contents, which describes how many

    items the wheelbarrow holds at any given moment. Methods might'
  - '[PAGE 91]


    include fill(), tip(), forward(), and stop(). When using JavaScript you can design
    such objects as you see fit.


    However, in addition to user-defined objects, JavaScript has a range of ready-made
    objects for use in scripts. These are referred to as native objects. Examples
    of JavaScript’s native objects include Math(), String(), and Date().


    # # Creating an Instance of an Object


    Many objects, such as the document object that you saw in Lesson 4, already exist
    and do not need you to create an instance of them. Others, however, require you
    to create an instance of the object in question before you can use it.


    You can create an instance of an object by calling a method known as the object’s
    constructor, using the new keyword:


    ```

    var myBarrow = new Wheelbarrow();

    ```


    Having created an instance myBarrow of the wheelbarrow, properties and methods
    for the object may be manipulated using a simple syntax:


    ```

    myBarrow.contents = 20;

    myBarrow.forward();

    myBarrow.stop();

    myBarrow.tip();

    ```


    Of course, you are liberty to create other instances of the same object and have
    them exist concurrently:


    ```

    var myBarrow = new Wheelbarrow();

    var yourBarrow = new Wheelbarrow();

    myBarrow.contents = 20;

    yourBarrow.contents = 50;

    ```


    # # The Document Object Model or DOM


    We mentioned briefly in Lesson 4 the hierarchy of objects “built in” to a web
    page and known as the Document Object Model. You access these objects and their
    properties and methods in the same way as native objects and objects that you
    devise and create yourself.'
  - '[PAGE 92]


    > Note The Document Object Model or DOM is really not a part of JavaScript but
    a separate entity existing outside it. Although you can use JavaScript to manipulate
    DOM objects, other scripting languages may equally well access them too.


    In later lessons you will see how the XMLHttpRequest object can use XML data returned
    from the server in response to XMLHttpRequest calls to create additional DOM objects
    that you can use in your scripts.


    # Introducing XMLHttpRequest


    XMLHttpRequest is supported by virtually all modern browsers, Microsoft''s Internet
    Explorer 5+ and a variety of non-Microsoft browsers, including Mozilla, Firefox,
    Konqueror, Opera, and Safari, is supported on a wide range of platforms, including
    Microsoft Windows, UNIX/Linux, and Mac OS X.


    > Caution Some browsers may require attention to their security settings to allow
    the XMLHttpRequest object to operate correctly. See your browser''s documentation
    for details.


    The purpose of the XMLHttpRequest object is to allow JavaScript to formulate HTTP
    requests and submit them to the server. Traditionally programmed web applications
    normally make such calls synchronously, in conjunction with a user-initiated event
    such as clicking on a link or submitting a form, resulting in a new or updated
    page being served to the browser.


    Using XMLHttpRequest, however, you can have your page make calls asynchronously
    in the background, allowing you to continue using the page without the interruption
    of a browser refresh and the loading of a new or revised page.'
  - '[PAGE 93]


    This capability underpins Ajax applications, making the XMLHttpRequest object
    the key to Ajax programming.


    > Although the object''s name begins with XML, in fact, any type of document may
    be returned from the server; ASCII text, HTML, and XML are all popular choices,
    and we will encounter all of these in the course of the book.


    # Creating the XMLHttpRequest Object


    You cannot make use of the XMLHttpRequest until you have created an instance of
    it. Creating an instance of an object in JavaScript is usually just a matter of
    making a call to a method known as the object''s constructor. In the case of XMLHttpRequest,
    however, you must change this routine a little to cater for the peculiarities
    of different browsers, as you see in the following section.


    # Different Rules for Different Browsers


    Microsoft first introduced the XMLHttpRequest object, implementing it in Internet
    Explorer 5 as an ActiveX object.


    > ActiveX is a proprietary Microsoft technology for enabling active objects into
    web pages. Among the available web browsers, it is currently only supported in
    Microsoft''s Internet Explorer. Internet Explorer uses its built-in XML parser,
    MSXML, to create the XMLHttpRequest object.


    Most other browser developers have now included in their products an equivalent
    object, but implemented as a native object in the browser’s JavaScript interpreter.'
