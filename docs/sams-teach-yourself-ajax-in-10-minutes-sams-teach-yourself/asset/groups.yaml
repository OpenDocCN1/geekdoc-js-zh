    188 Lesson 18


    It would seem wise to ensure spiders can index a static version of all relevant
    content somewhere on the site. Because spiders follow links embedded in pages,
    the provision of a hypertext linked site map can be a useful addition in this
    regard.


    ## Pointing Out Page Elements


    Without careful design, it may not be apparent to users which items on the page
    they can click or on interface with to make something happen.


    It is worth using a consistent style throughout an application to show which page
    elements cause server requests or some other dynamic activity. It is somewhat
    reminiscent of the way hypertext links in HTML pages need to be styled differently
    than plain text so it''s clear to a user that they perform an additional function.


    At the expense of a more costly effort, instructions and information about active
    elements can be incorporated in ToolTip-style pop-ups. This is, of course, especially
    important when a click on an active link can have a major effect on the application''s
    state. Figure 18.1 shows an example of such a pop-up information box.


    ![](img/2ee8632a2c5a7a595049f49876099e38_198_0.png)


    **Figure 18.1** Pop-up information helps users to understand interfaces.


    ## Don’t Use Ajax Where It’s Inappropriate


    Attractive as Ajax undoubtedly is for improving web interfaces, you need to accept
    that there are many situations where the use of Ajax detracts from the user experience
    instead of adding to it.


    This is especially where the page-based interface metaphor is perfectly adequate,
    for perhaps even of greater relevance to, the content and style of the site. Text-based
    sites with split conveniently into chapter-styled pages can often benefit much
    from intelligently designed hyperlinking as they can from the addition of Ajax
    functionality.


    Small sites in particular may struggle to get sufficient benefit from an Ajax
    interface to balance the associated costs of additional code and added complexity.


    ## Security


    Ajax does not itself seem to present any security issues that are not already
    present when designing web applications. It is notable, however, that Ajax-enhanced
    applications tend to contain more client-side code than they did previously.


    Because the content of client-side code can be viewed easily by any user of the
    application, it is important that sensitive information not be revealed within
    it. In this context, sensitive information is not limited to such things as usernames
    and passwords (though they are, of course, sensitive), but includes business logic.
    Make the server-side scripts responsible for carrying out issues as database connection.
    Validate data on the server before applying it to any important processing.


    ## Test Code Across Multiple Platforms


    It will be clear from the content of this book that the various browsers behave
    differently in their implementation of JavaScript. The major difference in the
    generation of XMLHttpRequest object instances between Microsoft and non-Microsoft
    browsers is a fundamental example, but there is a host of minor differences, too.


    The DOM, in particular, is handled rather differently, not only between browsers
    but also between different versions of the browser. CSS implementation is another
    area where minor differences still proliferate.


    Although it has always been important to test new applications on various browsers,
    this is perhaps more important than ever faced with the added complexity of Ajax
    applications.


    Hopefully browsers will continue to become more standards-compliant, but until
    then test applications on as many different platforms and with as different browsers
    as possible.


    ## Ajax Won’t Cure a Bad Design


    All the dynamic interactivity in the world won''t correct a web application with
    a design that is fundamentally flawed.


    All the tenets of good web design still apply to Ajax applications:


    - Write for multiple browsers and validate your code.

    - Comment and document your code so that you can debug it later.

    - Use small graphics wherever possible so that they load quickly.

    - Make sure that your choices of colors, backgrounds, font sizes, and styles don''t
    make pages difficult to read.


    > Tip The W3C offers a free online validator at http://validator.w3.org/


    ## Some Programming Gotchas


    Some of these have been alluded to in various lessons, but it’s worth grouping
    them here. These are probably the most common programming issues that Ajax developers
    bump up against at some time or other!


    ## Browser Caching of GET Requests


    Making repeated GET requests to the same URL can often lead to the response coming
    not from the server but from the browser cache. This problem seems especially
    significant when using Internet Explorer.


    Although in theory this can be cured with the use of suitable HTTP headers, in
    practice the cache can be stubborn.


    An effective way of stepping this problem is to add a random element to the URL
    to which the request is sent; the browser interprets this as a request to a different
    page rather than a cached version.


    In the text we achieved this by adding a random number. Another approach favored
    by many is to add a number derived from the time, which will cause to be different
    every time:


    ```

    var url = "serverscript.php?*rand="+new Date().getTime();

    ```


    ## Permission Denied Errors


    Receiving a Permission Error usually means that you have fallen foul of the security
    measure preventing cross-domain requests from being made by an XMLHttpRequest
    object.


    Calls must be made to server programs existing in the same domain as the calling
    script.


    > Caution Be careful that the domain is written exactly the same way. Somomain.com
    may be interpreted as referring to a different domain from www.somedomain.com,
    and permission will be denied.


    ## Escaping Content


    When constructing queries for GET or POST requests, remember to escape variables
    that could contain spaces or other nontext characters. In the following code,
    the value idValue has been collected from a text input field on a form, so we
    escape it to ensure correct encoding:


    ```

    http.open("GET", url + escape(idValue) + "&rand=" + myRandom, true);

    ```


    ## Summary


    Ajax undoubtedly has the potential to greatly improve web interfaces. However,
    the paradigm change from traditional page-based interfaces to highly dynamic applications
    has created a few potholes for developers to step into. In this lesson we''ve
    tried to round up a few of the better-known ones.


    Some of these issues have already been encountered in the other lessons, others
    will perhaps not become apparent until you start to develop real-world applications.
    This lesson concludes Part III, “More Complex Ajax Technologies.” If you have
    followed the lessons through to this point, you will by now have a good grip on
    the XMLHttpRequest object, JavaScript, XML, and the Document Object Model, and
    be capable of creating Ajax applications from first principles.


    Fortunately, you don''t have to always work from first principles. Many open source
    and commercial projects on the Internet offer a wide variety of Ajax frameworks,
    tools, and resources.


    Part IV, “Commercial and Open Source Ajax Resources,” of the book concludes our
    journey through Ajax development by looking at some of these resources and their
    capabilities.


    # LESSON 19


    ## The prototype.js Toolkit


    In this lesson you will learn about the prototype.js JavaScript library and how
    it can reduce the work required for building capable Ajax applications.


    ## Introducing prototype.js


    Part IV, “Commercial and Open Source Ajax Resources,” looks at some available
    code libraries and frameworks for Ajax development.


    We begin this lesson with Sam Stephenson''s prototype.js, a popular JavaScript
    library containing an array of functions useful in the development of cross-browser
    JavaScript routines, and including specific support for Ajax. You''ll see how
    your JavaScript code can be simplified by using this library''s powerful support
    for DOM manipulation, HTML forms, and the XMLHttpRequest object.


    The latest version of the prototype.js library can be downloaded from http://prototype.conio/.


    > Caution At the time of writing, prototype.js is at version 1.4.0. If you download
    a different version, check the documentation to see whether there are differences
    between your version and the one described here.

