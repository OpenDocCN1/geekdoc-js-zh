    # 200 Lesson 19


    Now let''s build a simple HTML page to display the current stock price.

    This page forms the base for our Ajax application:


    ```

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"

    //"http://www.w3.org/TR/html4/loose.dtd">

    <html>

    <head>

    <script src="prototype.js" Language="JavaScript">

    <type type="text/javascript"></script>

    <title>Stock Reader powered by Prototype.js</title>

    </head>

    <body>

    <h2>Stock Reader</h2>

    <h4>Powered by Prototype.js</h4>

    <p>Current Stock Price:</p>

    <div id="price"></div>

    </body>

    </html>

    ```


    Note that we included the prototype.js library by means of a <script> tag

    in the document header. We also defined a <div> id set to "price",

    will be used to display the current stock price.


    We now need to implement the Ajax.PeriodicalUpdater class, which

    we''ll attach to the document body element''s onLoad event handler. Listing

    19.1 shows the complete script.


    # LISTING 19.1 Ajax Stock Price Reader Using prototype.js


    ```

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01

    //Transitional//EN"

    //"http://www.w3.org/TR/html4/loose.dtd">

    <html>

    <head>

    <script src="prototype.js" Language="JavaScript">

    <type type="text/javascript"></script>

    <script>

    function checkprice() {

    var myAjax = new Ajax.PeriodicalUpdater(''price'',

    ''rand.php'', {method: ''post'', frequency: 3.0,

    day: 1});

    }

    </script>

    <title>Stock Reader powered by Prototype.js</title>

    ```'
