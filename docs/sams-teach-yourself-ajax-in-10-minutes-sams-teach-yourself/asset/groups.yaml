    # ## 20.1 Updating multiple page elements with Rico.


    The server routine is a simple PHP script that outputs the required XML data.
    The script uses PHP''s `$SERVER[''SERVER_SIGNATURE'']` global variable. Note that
    the script constructs and returns two <response> elements, each responsible for
    updating a particular element in the HTML page.


    Listing 20.2 shows the server script.


    # ### LISTING 20.2 The Server Script for Generating <ajax-response>


    ```

    <?php

    header("Content-Type:text/xml");

    header("Cache-Control:no-cache");

    header("Pragma:no-cache");

    echo "<ajax-response><response type=\response"

    id="display"><p>

    " . \$SERVER[''SERVER_SIGNATURE''] .

    "</p></response>

    " . "<response type=\element" id="heading\>

    <h3>Some Information about the Server</h3>

    " . "</response></ajax-response>";

    ?>

    ```'
