    \        var newpara3 = document.createElement('p');\n        var para3 = document.getElementById('news');\n\
    \        para3.appendChild(newpara3);\n        newpara3.appendChild(newtext3);\n\
    \        newpara3.className = \"link\";\n      }\n    }\n  }\n}\n</script>\n<body>\n\
    <center>\n<h3>Ajax RSS Reader</h3>\n<form name=\"form1\">\nURL of RSS feed: <input\
    \ type=\"text\" name=\"feed\" size=\"50\" value=\"http:///\"><input type=\"button\"\
    \nonclick=\"getRSS()\" value=\"Get Feed\"><br><br>\n<div id=\"news\" class=\"\
    displaybox\">\n<h4>Feed Titles</h4></div>\n</form>\n</center>\n</body>\n</html>\n\
    ```\n\nMostly we are concerned with describing the workings of the callback function.\n\
    \n# The Callback Function\n\nIn addition to the usual duties of checking the XMLHttpRequest\
    \ readyState and status properties, this function undertakes the following tasks:\n\
    \n- Remove from the display <div> any elements from previous listings.\n- Parse\
