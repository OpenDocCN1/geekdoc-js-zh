  mdcn: "\n## HTTP 响应\n\n响应此类请求，服务器通常会发布 HTTP 响应，其第一行通常被称为*状态行*（status line）。在这一行中，服务器会返回\
    \ HTTP 版本，并给出一个响应状态码（一个三位整数）和一个被称为*理由短*（reason phrase）的短消息。这里是一个 HTTP 响应示例：\n\n\
    ```\nHTTP/1.0 200 OK\n```\n\n响应状态码和理由本质上是同一条消息的机器和人类可读版本，尽管理由短在不同服务器之间可能略有不同。表\
    \ 3.1 列出了一些状态码和理由短的示例。状态码的第一数字通常提供了关于消息性质的某些线索：\n\n- *1**—信息性\n- *2**—成功性\n- *3**—已重定向\n\
    - *4**—客户端错误\n- *5**—服务器错误\n\n## 表 3.1 一些常见的 HTTP 响应状态码\n\n| 状态码 | 解释 |\n|---|---|\n\
    | 200 - OK | 请求成功。 |\n| 204 - No Content | 文档不包含数据。 |\n| 301 - Moved Permanently\
    \ | 资源已永久移动到不同的 URI。 |\n| 401 - Not Authorized | 请求需要用户验证。 |\n| 403 - Forbidden\
    \ | 服务器拒绝执行请求。 |\n| 404 - Not Found | 请求的资源在服务器上不存在。 |\n\n## 使用 HTTP 发送请求\n\n\
    | 状态码 | 解释 |\n| --- | --- |\n| 408 - Request Timeout | 客户端未能在服务器允许的时间内发送请求。 |\n\
    | 500 - Server Error | 由于脚本故障、服务器配置错误或类似原因。 |\n\n> 提示：状态码的详细列表由世界维网联盟（W3C）维护，可以在\
    \ http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html 访问。\n\n响应可能还包含标头行，每行包含一个与\
    \ HTTP 请求类似的标头和值对，但通常包含有关服务器和/或返回资源的信息：\n\nServer: Apache/1.3.22\nLast-Modified:\
    \ Fri, 24 Dec 1999 13:33:59 GMT\n\n## HTML 表单\n\nWeb 页面通常包含你可以输入信息的字段。示例包括选择框、复选框以及你可以输入信息的字段。表\
    \ 3.2 列出了一些流行的 HTML 表单标签。\n\n## 表 3.2 一些常见的 HTML 表单标签\n\n| 标签 | 描述 |\n| --- |\
    \ --- |\n| <form>...</form> | 整个表单的容器 |\n| <input /> | 数据输入元素；包括文本、密码、复选框和单选按钮字段，以及提交和重置按钮\
    \ |\n| <select>...</select> | 下拉选择框 |\n| <option>...</option> | 选择框内的选项 |\n| <textarea>...</textarea>\
    \ | 多行文本输入字段 |\n\n## 第 3 节\n\n完成表单后，你通常会被邀请使用标签恰当的按钮或其他页面元素来提交它。\n\n此时，HTML 表单根据用户输入的数据构建并发送\
    \ HTTP 请求。表单可以使用 GET 或 POST 请求类型，这具体由 `<form>` 标签的 `method` 属性指定。\n\n## GET 和\
    \ POST 请求\n\n偶尔你可能会听到说，GET 和 POST 请求之间的区别在于 GET 请求仅用于获取（GETting，即检索数据），而 POST\
    \ 请求有许多用途，例如上传数据、发送邮件等。\n\n虽然这种经验法则可能有些其道理，但从构建方式的角度考虑这两种 HTTP 请求之间的差异是有益益的。\n\
    \nGET 请求将它要发送的消息编码为查询字符串，该字符串附加到服务器资源的 URL 之后。另一方面，POST 请求将其消息发送在请求的正文（message\
    \ body）中。此时实际发生的情况是输入的数据被编码并通过 HTTP 请求发送到表单 `action` 属性声明的 URL，在那里，提交的数据将以某种方式进行处理。\n\
    \nHTTP 请求是 GET 类型还是 POST 类型，以及表单发送到哪个 URL，这些都是在表单的 HTML 标记中确定的。让我们来看一个典型表单的 HTML\
    \ 代码：\n\n```\n<form action=\"http://sometargetdomain.com/some.htm\"\n  method=\"\
    post\">\nYour Surname: <input type=\"text\" size=\"50\" name=\"surname\" />\n\
    <br />\n<input type=\"submit\" value=\"Send\" />\n</form>\n```\n\n这段代码段嵌入 Web\
