    \ contain fields where you can enter information. Examples include select boxes,\
    \ check boxes, and fields where you can type information. Table 3.2 lists some\
    \ popular HTML form tags.\n\n## TABLE 3.2 Some Common HTML Form Tags\n\n| Tag\
    \ | Description |\n| --- | --- |\n| <form>...</form> | Container for the entire\
    \ form |\n| <input /> | Data entry element; includes text, password, check box\
    \ and radio button fields, and submit and reset buttons |\n| <select>...</select>\
    \ | Drop-down select box |\n| <option>...</option> | Selectable option within\
    \ select box |\n| <textarea>...</textarea> | Text entry field with multiple rows\
    \ |\n\n## Lesson 3\n\nAfter you have completed the form you are usually invited\
    \ to submit it, using an appropriately labeled button or other page element.\n\
    \nAt this point, the HTML form constructs and sends an HTTP request from the user-entered\
    \ data. The form can use either the GET or POST request type, as specified in\
    \ the method attribute of the <form> tag.\n\n## GET and POST Requests\n\nOccasionally\
    \ you may hear it said that the difference between GET and POST requests is that\
    \ GET requests are just for GETting (that is, retrieving data, whereas POST requests\
    \ can have many uses, such as uploading data, sending mail, and so on.\n\nAlthough\
    \ there may be some merit in this rule of thumb, it's instructive to consider\
    \ the differences between these two HTTP requests in terms of how they are constructed.\n\
    \nA GET request encodes the message it sends into a query string, which is appended\
    \ to the URL of the server resource. A POST request, on the other hand, sends\
    \ its message in the message body of the request. What actually happens at this\
    \ point is that the entered data is encoded and sent, via an HTTP request, to\
    \ the URL declared in the action attribute of the form, where the submitted data\
    \ will be processed in some way.\n\nWhether the HTTP request is of type GET or\
    \ POST or the URL to which the form is sent are both determined in the HTML markup\
    \ of the form. Let's look at the HTML code of a typical form:\n\n```\n<form action=\"\
    http://sometargetdomain.com/some.htm\"\n  method=\"post\">\nYour Surname: <input\
    \ type=\"text\" size=\"50\" name=\"surname\" />\n<br />\n<input type=\"submit\"\
    \ value=\"Send\" />\n</form>\n```\n\nThis snippet of code, when embedded in a\
    \ web page, produces the simple form shown in Figure 3.1.\n\n![](img/2ee8632a2c5a7a595049f49876099e38_43_0.png)\n\
    \n**FIGURE 3.1** A simple HTML form.\n\nLet's take a look at the code, line by\
    \ line. First, we begin the form by using the <form> tag, and in this example\
    \ we give the tag two attributes. The action attribute determines the URL to which\
    \ the submitted form will be sent. This may be to another page on the same server\
    \ and described by a relative path, or to a remote domain, as the code behind\
    \ the form in Figure 3.1.\n\n## Summary\n\nThis lesson covered some basics of\
    \ server requests and responses using the HTTP protocol, the main communications\
    \ protocol of the World Wide Web. In particular, we discussed how GET and POST\
    \ requests are constructed, and how they are used in HTML forms. Additionally,\
    \ we saw some examples of responses to these requests that we might receive from\
    \ the server.\n[/content] (Wait, the user text provided was extremely repetitive/duplicated.\
    \ I will provide the clean de-duplicated version now. The de-duplicated text is\
    \ what I actually processed above. I'll just output the final de-duplicated text\
    \ once.).)Wait, I see the mistake in my internal thought process. I will just\
    \ provide the final clean output as requested.\n\n[content]\n## The HTTP Response\n\
    \nIn answer to such a request, the server typically issues an HTTP response, the\
    \ first line of which is often referred to as the *status line*. In that line\
    \ the server echoes the HTTP version and gives a response status code (which is\
    \ a three-digit integer) and a short message known as a *reason phrase*. Here's\
    \ an example HTTP response:\n\n```\nHTTP/1.0 200 OK\n```\n\nThe response status\
    \ code and reason are essentially intended as machine-human-readable versions\
    \ of the same message, though the reason phrase may vary a little from server\
    \ to server. Table 3.1 lists some examples of status codes and reason phrases.\
    \ The first digit of the status code usually gives some clue about the nature\
    \ of the message:\n\n- *1**—Information\n- *2**—Success\n- *3**—Redirected\n-\
    \ *4**—Client error\n- *5**—Server error\n\n## TABLE 3.1 Some Commonly Encountered\
    \ HTTP Response Status Codes\n\n| Status Code | Explanation |\n|---|---|\n| 200\
    \ - OK | The request succeeded. |\n| 204 - No Content | The document contains\
    \ no data. |\n| 301 - Moved Permanently | The resource has permanently moved to\
    \ a different URI. |\n| 401 - Not Authorized | The request needs user authentication.\
    \ |\n| 403 - Forbidden | The server has refused to fulfill the request. |\n| 404\
    \ - Not Found | The requested resource does not exist on the server. |\n\n## Sending\
    \ Requests Using HTTP\n\n| Status Code | Explanation |\n| --- | --- |\n| 408 -\
    \ Request Timeout | The client failed to send a request in the time allowed by\
    \ the server. |\n| 500 - Server Error | Due to a malfunctioning script, server\
    \ configuration error or similar. |\n\n> Tip A detailed list of status codes is\
    \ maintained by the World Wide Web Consortium, W3C, and is available at http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html.\n\
    \nThe response may also contain header lines each containing a header and value\
    \ pair similar to those of the HTTP request but generally containing information\
    \ about the server and/or the resource being returned:\n\nServer: Apache/1.3.22\n\
