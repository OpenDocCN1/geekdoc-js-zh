    # AHAH—Asynchronous HTML and HTTP 135


    This code has been packaged into a file named myAHAHlib.js, which you can call
    from an HTML page, making the functions available to your AHAH application. The
    next section shows some examples of its use.


    # Using myAHAHlib.js


    In Lesson 4, "Client-Side Coding Using JavaScript," we encountered the concept
    of JavaScript functions located in an external file that is referred to within
    our page.


    That''s how we use our new file myAHAHlib.js, using a statement in this form:


    ```

    <script language="JavaScript" SRC="myAHAHlib.js"></script>

    ```


    We will then be at liberty to call the functions within the script whenever we
    want.


    The following is the skeleton source code of such an HTML page:


    ```

    <html>

    <head>

    <title>Another Ajax Application</title>

    <script language="JavaScript" SRC="myAHAHlib.js"></script>

    </head>

    <body>

    <form>

    <input type="button" onclick="callAHAH(''serverscript.php?parameter=x'',

    display(''Please wait - page updating ...'')" >

    This is the place the server response will be posted:<br>

    <div id="displaydiv"></div>

    </form>

    </body>

    </html>

    ```


    In this simple HTML page, a button element is used to create the event that causes
    the callAHAH() method to be called. This method places the text string


    ''Please wait - page updating ...'''
