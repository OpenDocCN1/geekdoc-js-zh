    \n# LESSON 12\nReturning Data as Text\n\nIn this lesson you will learn some more\
    \ techniques for using the `responseText` property to add functionality to Ajax\
    \ applications.\n\n## Getting More from the responseText Property\n\nThe lessons\
    \ of Part II, \"Introducing Ajax,\" discussed the individual components that make\
    \ Ajax work, culminating in a complete Ajax application. In Part III, \"More Complex\
    \ Ajax Technologies,\" each lesson examines how you can extend what you know to\
    \ develop more sophisticated Ajax applications.\n\nFor this lesson, we'll look\
    \ a little more closely at the `responseText` property of the XMLHttpRequest object\
    \ and see how we can give our application some extra functionality via its use.\n\
    \nAs you have seen in previous lessons, the XMLHttpRequest object provides two\
    \ properties that contain information received from the server, `responseText`\
    \ and `responseXML`. The former presents the calling application with the server\
    \ data in string format, whereas the latter provides DOM-compatible XML that can\
    \ be parsed using JavaScript methods.\n\nAlthough the `responseXML` property allows\
    \ you to carry out some sophisticated programming tasks, each can be achieved\
    \ just by manipulating the value stored in the `responseText` property.\n\n##\
    \ Returning Text\n\nThe term text is perhaps a little misleading. The `responseText`\
    \ property contains a string, you you assign to a JavaScript variable via simple\
    \ assignment:\n\n```javascript\nvar mytext = http.responseText;\n```\n\n# Using\
    \ Text Directly in Page Elements\n\nPerhaps the simplest example is to consider\
    \ the use of `responseText` updating the page element, say a <div> container.\
    \ There is no rule saying that the value contained in such a string must be legible;\
    \ in fact, the value can contain gibberish you may simply take the returned string\
    \ and apply it to the page element in question. For example:\n\n```html\n<html>\n\
    <head>\n<title>My Ajax Application</title>\n</head>\n<body>\nHere is the text\
    \ returned by the server:\n<div id=\"myPageElement\"></div>\n</body>\n</html>\n\
    ```\n\nClearly this is a simple page that, as it stands, would merely output the\
    \ line \"Here is the text returned by the server\" and nothing else.\n\nNow suppose\
    \ that we add to the page the necessary JavaScript routines to generate an instance\
    \ of XMLHttpRequest (in this case called http) and make a server request in response\
    \ to the onload() event handler of the page's <body>. Listing 12.1 shows the source\
    \ code for the revised page.\n\n# LISTING 12.1 A Basic Application Using the responseText\
    \ Property\n\n```html\n<html>\n<head>\n<title>My Ajax Application</title>\n<script\
    \ language=\"JavaScript\">\nfunction getXMLHttpRequest() {\ntry {\nreq = new XMLHttpRequest();\n\
    } catch(err1) {\n  try {\n    req = new ActiveX(\"Msxml2.XMLHTTP\");\n  } catch\
    \ (err2) {\n    try {\n      req = new ActiveX(\"Microsoft.XMLHTTP\");\n    }\
    \ catch (err3) {\n      req = false;\n    }\n  }\n}\nreturn req;\n}\nvar http\
    \ = getXMLHttpRequest();\n\nfunction getServerText() {\n  var myurl = 'textserver.php';\n\
    \  var myRand = parseInt(Math.random()*9999999999999);\n  var modurl = myurl+'rand='+myRand;\n\
    \  http.open(\"GET\", modurl, true);\n  http.onreadystatechange = useHttpResponse;\n\
    \  http.send(null);\n}\n\nfunction useHttpResponse() {\n  if (http.readyState\
    \ == 4) {\n    var mytext = http.responseText;\n    document.getElementById('myPageElement').innerHTML\
    \ = mytext;\n  } else {\n    document.getElementById('myPageElement').innerHTML\
    \ = '';\n  }\n}\n</script>\n</head>\n<body onload=\"getServerText()\">\nHere is\
    \ the text returned by the server:\n<div id=\"myPageElement\"></div>\n</body>\n\
    </html>\n```\n"
