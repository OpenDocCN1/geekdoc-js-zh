    \ JavaScript 技术可能很难精通，尤其是由于会产生许多跨浏览器问题。\n\n然而，使用 Rico 进行拖放是非常简单的。\n\n# 使用 Rico\
    \ 209\n\n在应用程序中包含 `rico.js` 文件会自动创建一个名为 `dndMgr` 的对象，它是 Rico 的拖放管理器。使用 `dndMgr`\
    \ 对象就像使用 `AjaxEngine` 一样；但这次，我们需要注册 Ajax 请求和响应、可拖拽项目以及落点区域（可以接收拖放项目的页面元素）。\n\n\
    这些任务通过 `registerDraggable` 和 `registerDropZone` 方法完成：\n\n```\ndndMgr.registerDraggable(\
    \ new Rico.Draggable('test',\n'dragElementID') );\ndndMgr.registerDropZone(new\
    \ Rico.Dropzone\n'(dropElementID') );\n```\n\n这两个简单的命令分别声明了 ID 为 `dragElementID`\
    \ 的页面元素为可拖拽的，并将 ID 为 `dropElementID` 的另一个元素为落点区域。`registerDraggable()` 方法的参数 `'test'`\
    \ 定义了可拖拽项目的类型，如果需要，后续代码对其进行测试和使用。\n\n# 拖放接口示例\n\n列表 20.3 显示了使用 Rico 实现拖放有多简单。显示的\
    \ HTML 页面如图 20.2 所示。\n\n# 列表 20.3 使用 Rico 的简单拖放\n\n```\n<!DOCTYPE TYPE PUBLIC\
    \ \"-//W3C//DTD HTML 4.01// Transitional//EN\"\n// \"http://www.w3.com/TR/html4/loose.dtd\"\
    >\n<html>\n<head>\n<script src=\"prototype.js\"></script>\n<script src=\"rico.js\"\
    ></script>\n<style>\nbody {\nfont:10px normal arial, helvetica, verdana;\nbackground-color:#dddddd;\n\
    }\n\ndiv.simpleDropPanel {\nwidth : 260px;\nheight : 180px;\n```\n\n# 列表 20.3\
    \ 继续\n\n```\nbackground-color: #ffffff;\npadding : 5px;\nborder : 1px solid #333333;\n\
    }\n\ndiv.box {\nwidth : 200px;\ncursor : hand;\nbackground-color: #ffffff;\nmoz-opacity\
    \ : 0.6;\nfilter : alpha(Opacity=60);\nborder : 1px solid #333333;\n}\n</style>\n\
    <head>\n<body>\n<table width=\"550\">\n<tr>\n<td><h3>拖放</h3></td>\n<p>按照通常的方式，使用左鼠标键将数据项拖放到目标字段中。注意在拖放操作期间可用目标字段是如何改变颜色的。</p>\n\
    <p>刷新页面重新开始。</p>\n<div class=\"box\" id=\"draggable1\">这是一个可拖拽数据项</div>\n<div\
    \ class=\"box\" id=\"draggable2\">这是另一个</div>\n<div class=\"box\" id=\"draggable3\"\
    >这是第三个</div>\n</tr>\n</table>\n```\n*（注：第 220-221 页中表格结构的 OCR 识别是碎片化的；我根据文中标准的\
    \ Rico 拖放实现模式重构了逻辑结构。）*\n\n等等，根据提供的文本提供第 220-221 页的正确重构：\n\n"
