    \ ahead to Figure 2.3 to see an example of how a table looks displayed in a browser\
    \ window.\n\n## Hyperlinks\n\nHypertext links (hyperlinks) are fundamental to\
    \ the operation of HTML. By clicking on a hyperlink, you can navigate to a new\
