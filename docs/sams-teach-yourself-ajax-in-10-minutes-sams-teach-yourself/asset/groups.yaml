    The result, so far as the user is concerned, is that she sees the remaining fields
    magically populated with data before submitting—or even complete—the form.


    How might we use the returned data to achieve such a result is discussed in Lesson
    10, "Using the Returned Data."


    # Summary


    This lesson looked at the ways in which our XMLHttpRequest object can communicate
