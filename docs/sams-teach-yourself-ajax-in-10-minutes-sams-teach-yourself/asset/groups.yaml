    <input type=\"button\" value=\"Go\" onclick=\"updateDIV(targetDiv)\">\n<div id=\"\
    targetDiv\"></div>\n```\n\n### Ajax.PeriodicalUpdater\n\nThe Ajax.PeriodicalUpdater\
    \ class can be used to repeatedly create an Ajax.Updater instance. In this way\
    \ you can have a page element updated after a certain time has elapsed. This can\
    \ be useful for such applications as a stock market ticker or an RSS reader because\
    \ it ensures that the visitor is always viewing reasonably up-to-date information.\n\
    \nAjax.PeriodicalUpdater adds two further parameters to the Ajax.Updater options:\n\
    \n- The delay in seconds between updates. Default is two seconds.\n- The multiplier\
    \ by which successive delays are increased if the server should return unchanged\
    \ data. Default value is 1, which leaves the delay constant.\n\nHere's an example\
    \ call to Ajax.PeriodicalUpdater:\n\n```javascript\nvar myAjax = new Ajax.PeriodicalUpdater(elementID,\
    \ url,\n{frequency: 3.0, decay: 2.0});\n```\n\nHere we elected to set the initial\
    \ delay to 3 seconds and have this delay length in each time unchanged data is\
    \ returned by the server.\n\n## Example Project—Stock Price Reader\n\nLet's use\
    \ the prototype.js library to build a simple reader that updates periodically\
    \ to show the latest value returned from the server. In this example, we'll use\
    \ a server-side script rand.php to simulate a changing stock price:\n\n```php\n\
    <?php\nrand((double) microtime( )*1000000);\n$price = 50 + rand(0,5000)/100;\n\
    echo \"$price\";\n?>\n```\n\nThis script initializes PHP's random number routine\
    \ by calling the srand() function and passing it an argument derived from the\
    \ current time. The rand(0,5000) function is then used to generate a random number\
    \ that is manipulated arithmetically to produce phony “stock prices” in the range\
    \ 50.00 to 100.00.\n"
