- md: "\n# Lesson 12\n\nMost, and probably all, of this code will be familiar from\
    \ previous lessons. The part that interests us here is the callback function useHttpResponse(),\
    \ which contains these lines:\n\n```\nvar mytext = http.responseText;\ndocument.getElementById('myPageElement').innerHTML\
    \ = mytext;\n```\n\nWe have simply assigned the value received in responseText\
    \ to become the content of our chosen <div> container.\n\nRunning the preceding\
    \ code with the simple server-side script\n\n```php\n<?php\necho \"This is the\
    \ text from the server\";\n?>\n```\n\nproduces the screen display of Figure 12.1.\n\
    \n![](img/2ee8632a2c5a7a595049f49876099e38_136_0.png)\n\nFIGURE 12.1 Displaying\
    \ text in a page element via responseText.\n\n# Including HTML in responseText\n\
    \nNow let's modify the code from the preceding example.\n\nAs you know from previous\
    \ lessons, HTML markup is entirely composed of tags written using text characters.\
    \ If the value contained in the responseText property is used for modifying the\
    \ display of the page from which the server request is being sent, there is nothing\
    \ to stop us having our server script include HTML markup in the information returns.\n\
    \nSuppose that once again use the code of Listing 12.1 but with a modified server\
    \ script:\n\n```php\n<?php\necho \"<h3>Returning Formatted Text</h3>\";\necho\
    \ \"<hr />\";\necho \"We can use HTML to <strong>format</strong>\";\n// text before\
    \ we return it!\"\n?>\n```\n\nFigure 12.2 shows the resulting browser display.\n\
    \n![](img/2ee8632a2c5a7a595049f49876099e38_137_0.png)\n\nFIGURE 12.2 Display showing\
    \ HTML formatted at the server.\n\nA slightly more involved example, consider\
    \ the case where the the server script generates more complex output. We want\
    \ our application to take this server output and display it as the contents of\
    \ a table.\n\nThis time we'll use our server-side PHP script to generate some\
    \ tabular information:\n\n# Lesson 12\n\n```php\n<?php\n$days = array('Monday','Tuesday','Wednesday',\n\
    'Thursday','Friday','Saturday','Sunday');\necho \"<table border='2'>\";\";\necho\
    \ \"<tr><th>Day Number</th><th>Day Name</th></tr>\";\nfor($i=0; $i<7; $i++) {\n\
    \    echo \"<tr><td>\" . $i . \"</td><td>\" . $days[$i] . \"</td></tr>\";\n}\n\
    echo \"</table>\";\n?>\n```\n\nOnce again using the code of Listing 12.1 to call\
    \ the server-side script via XMLHttpRequest, we obtain a page as displayed in\
    \ Figure 12.3.\n\n![](img/2ee8632a2c5a7a595049f49876099e38_138_0.png)\n\nFigure\
    \ 12.3 Returning more complex HTML.\n\n# More Complex Formatted Data\n\nSo far\
    \ we have demonstrated ways to return text that may be directly applied to an\
    \ element on a web page. So far, so good. However, if you are willing to do a\
    \ little more work in JavaScript to manipulate the returned data, you can achieve\
    \ even more.\n\nProvided that the server returns a string value in the responseText\
    \ property of the XMLHttpRequest object, you can use any data format you may devise\
    \ to encode information within it.\n\nConsider the following server-side script,\
    \ which uses the same data array in the previous example:\n\n```php\n$days = array('Monday',\
    \ 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday');\n$numdays\
    \ = sizeof($days);\nfor($i=0;$i<$numdays; $i++)\n{\n    echo $days[$i].\"|\";\n\
    }\necho $days[$numdays-1];\n?>\n```\n\n> Note The use of the PHP sizeof() function\
    \ to determine the number of items in the array. In PHP, as in JavaScript, array\
    \ keys are numbered from 0 rather than 1.\n\nThe string returned in the responseText\
    \ property now contains the days of the week, separated—or delimited—by the pipe\
    \ character |. we copy this string into a JavaScript variable mystring,\n\n`var\
    \ mystring = http.responseText;`\n\nwe will find that the variable mystring contains\
    \ the string\nMonday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday\n\nWe may\
    \ now conveniently divide this string into an array using JavaScript’s split()\
    \ method:\n\n```javascript\nvar results = http.responseText.split(\"||\");\n```\n\
    \n> Tip The JavaScript split() method slices up a string, making each cut wherever\
    \ in the string it locates the character that it has been given as an argument.\
    \ That character need not be a pipe; popular alternatives are commas or slashes.\n\
    \nWe now have a JavaScript array results containing our data:\n\n```javascript\n\
    results[0] = 'Monday'\nresults[1] = 'Tuesday'\netc...\n```\n\nRather than simply\
    \ displaying the received data, we can now use it in JavaScript routines in any\
    \ way we want.\n\n> Tip For complex data formats, XML may be a better way to receive\
    \ and handle data from the server. However, it is remarkable how much can be done\
    \ just by using the responseText.\n\n# Summary\n\nWith little effort, the XMLHttpRequest\
    \ object's responseText property can be persuaded to do more than simply return\
    \ some text to a page. In this lesson you saw examples of AHAH, from simple updating\
    \ of page, to complex data.\n\n# LESSON 13\nAsynchronous\nHTML\nHTTP\n\n# Introducing\
    \ AHAH\n\nIt is possible to build complete and useful applications without any\
    \ XML. In fact, the term AHAH (Asynchronous HTML and HTTP) has been coined for\
    \ such applications. These include JAH (Just Asynchronous), HAJ (HTML and JavaScript).\
    \ In this book we'll refer to it as AHAH.\n\n# Why AHAH Instead of Ajax?\n\nThere\
    \ is no doubt that XML is an important technology with diverse capabilities. For\
    \ complex applications with sophisticated data structures it may well be the best—or\
    \ perhaps the only—option. However, using XML can sometimes complicate the design\
    \ of application, including:\n\n- Work involved in the design of custom schemas\
    \ for data.\n- Cross-browser compatibility issues using JavaScript DOM methods.\n\
    - Performance may suffer from having to carry out processor-intensive XML parsing.\n\
    \nUsing AHAH can help you avoid these headaches, while offering a few more advantages\
    \ to:\n\n- Easy wiring of some web pages.\n- HTML can be easier to fault-find\
    \ than XML.\n- Use of CSS to style the returned information, rather than having\
    \ to use XSLT.\n\n> XSLT is a transformation language used to convert XML documents\
    \ into other formats—for example, into HTML suitable for browser to display.\n\
    \n# Creating a Small Library for AHAH\n\nThe Ajax applications examined in the\
    \ last of lessons, although complete and functional, involved a lot of JavaScript\
    \ code into our pages. As you have seen, each application tends to contain similar\
    \ functions:\n\n- A method to create an instance of the XMLHttpRequest object,\
    \ configure it, and send it\n- A callback function to deal with the returned text\
    \ contained in the responseText property\n\nYou can abstract these functions into\
    \ simple JavaScript function calls, in cases where you simply want to update a\
    \ single page element with a new value returned from the server.\n\n# Introducing\
    \ myAHAlib.js\n\nConsider Listing 13.1; most of this code will be instantly recognizable\
    \ to you.\n\nLISTING 13.1 myAHAlib.js\n\n```javascriptfunction callAHA(url, pageElement,\
    \ callMessage) {\n  document.getElementById(pageElement).innerHTML = callMessage;\n\
    \  try {\n    req = new XMLHttpRequest(); /* e.g. Firefox */\n  } catch (e) {\n\
    \    try {\n      req = new ActiveX(\"Msxml12.XMLHttpRequest\"); // /* some versions\
    \ IE */\n    } catch (e) {\n      try {\n        req = new ActiveX(\"Microsoft.XMLHttpRequest\"\
    ); // /* some versions IE */\n      } catch (e) {\n        req = false;\n    \
    \  }\n    }\n    if (req) {\n      req.onreadystatechange = function() {responseAHA(pageElement)};\n\
    \      req.open(\"GET\",url,true);\n      req.send(null);\n    }\n  }\n}\n\nfunction\
    \ responseAHA(pageElement) {\n  var output = '';\n```\n"
