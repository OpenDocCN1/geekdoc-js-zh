    <table border=\"2\">\n```\n\n同时，我们通过使用 `<th>` 元素的 `BGCOLOR` 属性稍微加深了表格头单元格的背景：\n\
    \n```html\n<th bgcolor=\"#aaaaaa\">Attraction</th>\n```\n\n![](img/2ee8632a2c5a7a595049f49876099e38_33_0.png)\n\
    \n图 2.3 在 Mozilla Firefox 中显示的 seville.html。\n\n## 一些有 HTML 标签\n\n表 2.1 列出了一些常用的\
