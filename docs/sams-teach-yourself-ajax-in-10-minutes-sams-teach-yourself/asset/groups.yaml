    \ = \"http://xml.amazon.com/onca/xml3\";\n$url .= \"?item=$.assoc_id\";\n$url\
    \ .= \"&dev-dev=$.dev_token\";\n$url .= \"&ManufacturerSearch=$manuf\";\n$url\
    \ .= \"&mode=books\";\n$url .= \"&sort=+salesrank\";\n$url .= \"&offer=All\";\n\
    $url .= \"&type=lite\";\n$url .= \"&page=1\";\n$url .= \"&f=xml\";\n```\n\nSubmitting\
    \ this URL, we receive an XML file containing details of all matching books. I\
    \ won't reproduce the whole file here (there are more than 5,000 titles!), but\
    \ Listing 15.1 shows an extract from the XML file, including the first book in\
    \ the list.\n\n# Listing 15.1 Example of XML Returned by Amazon Web Service\n\n\
    ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<ProductInfo xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\"\n  xsi:noNamespaceSchemaLocation\n\
    \    \"http://xml.amazon.com/schemas/3/dev-lite.xsd\">\n<Request>\n  <Args>\n\
    \    <Arg value=\"Mozilla/4.0 (compatible; MSIE 6.0;\nWindows NT 5.1; SV1; .NET\
    \ CL 1.1.4322)\"\n    name=\"UserAgent\" />\n    <Arg />\n    <Arg value=\"0G2GC2CT7MRWB37PRXAS4B\"\
    \ name=\"RequestID\" />\n  <Arg value=\"All\" name=\"offer\" />\n```\n\nClearly\
    \ we now process this XML document in any way we want. For example, Lesson 14,\
