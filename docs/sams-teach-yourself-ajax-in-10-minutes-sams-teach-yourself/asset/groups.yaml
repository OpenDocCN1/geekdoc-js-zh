    > Caution Although JavaScript is likely to be supported by your browser, it is
    usually possible for the browser options to be configured so as to disable its
    use. If you find that you cannot get any JavaScript commands to work, consult
    your browser''s help files to find out how to check whether JavaScript is correctly
    enabled.


    Note Microsoft’s Internet Explorer browser actually runs a proprietary Microsoft
    language called Jscript, instead of JavaScript. The two are, however, virtually
    identical and therefore largely compatible. Where differences occur, they are
    described in the text.


    # Why Do I Need To Know About JavaScript?


    The j in Ajax stands for JavaScript; you use functions written in this language
    and embedded within your web pages to formulate Ajax server calls and to handle
    and process the response returned from the server.


    # What Is (and Isn’t) Covered in This Lesson


    There is no room here for an exhaustive guide to all JavaScript’s functions. Instead
    this lesson concentrates on those aspects of the language necessary for later
    developing Ajax applications.


    After completing this lesson, you’ll have experience with the following:


    +   * Embedding JavaScript commands and external JavaScript files into web pages

    * Using some of the common JavaScript commands

    * Using event handlers to launch JavaScript commands

    * Working with JavaScript variables and objects

    * Abstracting JavaScript commands into functions'
