    # Variables


    The concept of a variable might already be familiar to you if you''ve ever done
    any algebra, or programmed in just about any computer language. A variable is
    a piece of data given a name by which you can conveniently refer to it. In JavaScript,
    you declare variables with the keyword var:


    ```

    var speed = 63;

    ```


    The preceding line of code declares the variable speed and by using the assignment
    operator = assigns it a value of 63.


    We may now use this variable in other statements:


    ```

    var speedlimit = 55;

    var speed = 63;

    var excess_speed = speed - speedlimit;

    ```


    Variables need not be numeric; the statement


    ```

    var lastname = ''Smith'';

    ```


    assigns a string to the variable lastname.

    Both numeric and string variables may be manipulated within JavaScript statements.
    Consider the following code:


    ```

    var firstname = ''Susan'';

    var lastname = ''Smith'';

    document.writeln(''Hello, '' + firstname + '' '' + lastname);

    ```


    This code would write Hello, Susan Smith into our document.


    # Objects


    You met the concept of an object earlier in the lesson and saw how objects have
    both properties that describe them and methods that perform actions on them.


    Objects in JavaScript have a hierarchical relationship. References begin with
    the highest-level object, with subsequent levels appended separated by a period:


    ```

    document.image1.src

    ```'
- md: "\nThis string starts with the object document, then refers to an object image\
    \ within that object, and finally the property src (the source file for the image).\n\
    \n> Note In fact, the object that truly has the highest level in the object hierarchy\
    \ is window, which refers to the browser screen and everything within it. In general,\
    \ you don't need to include this object; JavaScript assumes it to be there.\n\n\
    Let's say we have the following HTML code somewhere in our page:\n\n```\n<form\
    \ name=\"form1\" action=\"somepage.html\" method=\"post\">\n<input type=\"text\"\
    \ name=\"lastname\">\n<input type=\"submit\" value=\"Submit\">\n</form>\n```\n\
    \nWe can refer, in JavaScript, to the string that the user has typed into the\
    \ lastname field by referring to the property value of the object corresponding\
    \ to that field:\n\n```\ndocument.form1.lastname.value\n```\n\n## Example—Form\
    \ Validation\n\nLet's use this technique to check a user's entered form data for\
    \ validity. We want to trap the entry of the user attempting to submit the form\
    \ and use this to trigger our JavaScript function, which checks the data for validity.\
    \ Here's the HTML code for our form:\n\n```\n<form name=\"form1\" method=\"post\"\
    \ action=\"otherpage.html\">\nEnter a number from 1 to 10: <input size=\"4\" type=\"\
    text\"\nname=\"number\">\n<input type=\"submit\" value=\"Enter\"\nonsubmit=\"\
    return numcheck()\"\n</form>\n```\n\nWe see here that the onSubmit event handler\
    \ is called when the Submit button is clicked and calls a JavaScript function\
    \ called numcheck. We need this function to check what our user has entered for\
    \ validity, and either submit the form or (if the entry is invalid) issue an error.\
    \ Note the word return prior to the function call. This is here because on this\
    \ occasion we want the function to tell us whether the submit method should be\
    \ allowed to go ahead. We want our function to return a value of false to the\
    \ form if the form submission is to be stopped. Here's the:\n\n```\n<script language=\"\
    JavaScript\" type=\"text/javascript\">\nfunction numbered() {\n  var numbered\
    \ = document.form1.username.value;\n  if((numbered>=1)&&(numbered<=10)) {\n  \
    \  return true;\n  } else {\n    alert(\"Your entry was invalid. Please try again.\"\
    );\n    return false;\n  }\n}\n```\n\nThe first action of the function is to assign\
    \ the user's entered value to the variable numbered. We then test that number\
    \ for validity by checking it it is greater than or equal to 1 and less than or\
    \ equal to 10. Depending on the result, we either return a value of true to the\
    \ calling form (thus allowing the form to be submitted) or pop up a dialog informing\
    \ of the error. In the latter case, when the user clicks OK to clear the dialog,\
    \ a value of false is returned to the calling form, preventing the form from being\
    \ submitted until the user enters appropriate data.\n\n## Summary\n\nThis lesson\
    \ covered the basics of JavaScript programming. We saw how JavaScript commands\
    \ may be integrated into HTML pages, discussed grouping JavaScript commands into\
    \ functions, and learned how event handlers are employed to launch JavaScript\
    \ commands and functions.\n\n## LESSON 5\n### Server-Side Programming in PHP\n\
    \nAjax applications can work with virtually any server-side language, requiring\
    \ only that the server should return correctly formatted responses to its HTTP\
    \ requests. This lesson introduces PHP, a popular open source scripting language\
    \ used on a huge number of web servers throughout the world.\n\n## Introducing\
    \ PHP\n\nLike JavaScript, PHP is composed of commands that can be embedded within\
    \ the HTML code of your pages. PHP however is a server-side programming language—that\
    \ is, it works hand-in-hand with your web server to process the source code of\
    \ a page before that page is sent to the browser.\n\n## Why Do I Need To Know?\n\
    \nAs you are already aware, Ajax applications make calls to the web server and\
    \ subsequently use the returned information in the page currently being viewed.\
    \ You need a way to run programs on the server to process the Ajax request and\
    \ return the required data.\n\nAjax can work with various server-side technologies\
    \ including PHP, ASP, Java, and others. This book uses PHP, arguably the most\
    \ popular and easy to use of the available server-side languages.\n\nThis lesson\
    \ provides an introduction to PHP for those who have never encountered it and\
    \ a refresher of the basics for any who have.\n\n## What Is (and Isn’t) Covered\
    \ in This Lesson\n\nAs with every lesson in this part of the book, it is neither\
    \ feasible appropriate to give an exhaustive course on every aspect of the subject.\n\
    \nThis lesson covers the basics of PHP programming with some practical examples,\
    \ concentrating mainly on those aspects of PHP most relevant to our explorations\
    \ of Ajax.\n\n> Tip The PHP website at http://uk.php.net/ is an invaluable source\
    \ of information, downloads, and documentation relating to PHP.\n\n> Tip For a\
    \ much more complete course on PHP, try Sams Teach Yourself PHP in 24 Hours by\
    \ Matt Zandstra.\n\n## Embedding PHP in HTML Pages\n\nPHP statements are embedded\
    \ into HTML documents by surrounding the PHP statements with <?php and ?> tags.\
    \ Anything between such tags is evaluated by the web server and replaced with\
    \ appropriate HTML code, prior to the page being served to the browser.\n\nYou\
    \ can have many sets of <?php and ?> tags in your page as you want.\n\n> Tip Web\
    \ servers normally recognize the file extension which files contain PHP code and\
    \ process them accordingly. The most used file extension for PHP files is .php,\
    \ but you may also see .php3, .php4, .shtml, and various others. To make your\
    \ code portable to many web server environments as possible, it’s best to stick\
    \ with .php.\n\n## Server-Side Programming in PHP 55\n\n## Outputting HTML from\
    \ PHP\n\nSeveral PHP commands can help you write text and HTML code directly into\
    \ your page. Perhaps the simplest is the echo command:\n\n```\necho \"I wrote\
    \ this line using PHP\";\n```\n\nThe preceding statement simply places \"I wrote\
    \ this line using PHP\" into the HTML document at precisely the place where the\
    \ PHP statement occurs.\n\nListing 5.1 shows the source code of a PHP file to\
    \ print Hello World in the window.\n\n## LISTING 5.1 Printing Hello World in PHP\n\
    \n```\n<html>\n<head>\n<title>A Simple PHP Script</title>\n</head>\n<body>\n<?php\
    \ echo \"<h1>Hello World!</h1>\"; ?>\n</body>\n</html>\n```\n\nNote in this script,\
    \ the output string also contains some HTML tags, `<h1>` and `</h1>`. As the PHP-statstatements\
    \ are executed by the web server before serving the page to us, these tags are\
    \ written into the document’s HTML along with the “Hello World” text and evaluated\
    \ by our browser with all other HTML markup in the document. Figure 5.1 shows\
    \ the browser displaying “Hello World” page.\n\nIf we ask the browser to show\
    \ us the source of this page, it displays the following code, in which we can\
    \ see that the PHP elements have been completely evaluated by the web server,\
    \ which has inserted the relevant HTML into the page:\n\n```\n<html>\n<head>\n\
    <title>A Simple PHP Script</title>\n</head>\n<body>\n<h1>Hello World!</h1></body>\n\
    </html>\n```\n\n![](img/2ee8632a2c5a7a595049f49876099e38_66_0.png)\n\n**FIGURE\
    \ 5.1** \"Hello World\" in PHP.\n\n## Variables in PHP\n\nVariables in PHP, much\
    \ like in any programming language, are named pockets in which pieces of data\
    \ are stored. All variable names in PHP must begin with a \"$\" character, followed\
    \ by a string made up of letters, numbers, and underscores.\n\n> Caution Variable\
    \ names are case sensitive in PHP. For example, $varname and $VarName represent\
