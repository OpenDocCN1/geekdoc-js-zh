    displayed in Internet Explorer.


    Another example is Microsoft IIS (Internet Information Services), often used on
    host computers running the Microsoft Windows operating system.


    > Note: Not all Windows-based hosts use IIS. Other web servers are available for
    Windows, including a version of the popular Apache Web Server.


    ## Server-Side Programming


    Server-side programs, scripts, or languages, refer to programs that run on the
    server computer. Many languages and tools are available for server-side programming,
    including PHP, Java, and ASP (the latter being available only on servers running
    the Microsoft Windows operating system). Sophisticated server setups often also
    include databases of information that can be addressed by server-side scripts.


    ## Anatomy of a Website


    > Note: Server-side programming in this book is carried using the popular PHP
    scripting language, which is flexible, is easy to use, and can be run on nearly
    all servers. Ajax, however, can function equally well as any server-side scripting
    language.


    The purposes of such scripts are various. In general, however, they are all designed
    to preprocess a web page before it is returned to you. By this we mean that some
    or all of the page content will have been modified to suit the context of your
    request—perhaps to display a particular destination or to show only these products
    that match your hobbies and interests. Server-side scripting allows web pages
    to be served with rich and varied content that would be beyond the scope of static
    pages.


    ## Web Browsers


    A web browser is a program on a surfer''s computer that is used to interpret and
    display web pages. The first graphical web browser, Mosaic, eventually developed
    into the famous range of browsers produced by Netscape.


    > Note: By graphical web browser we mean one that can display not only the text
    elements of an HTML document but also images and colors. Typically, such browsers
    use a point-and-click interface using a mouse or similar device. There also exist
    text-based browsers, the best known of which is Lynx (http://lynx.org/), which
    display HTML pages on character-based displays such as terminals, emulators, and
    operating systems with command-line interfaces.


    The Netscape series of browsers, once the most successful available, were eventually
    joined by Microsoft’s Internet Explorer, which went to dominate the market. Recent
    competitive efforts, though, have introduced a wide range of browser products
    including Opera, Safari, Konquer, and Mozilla’s Firefox, an open source web browser
    that has recently gained an enthusiastic following (see Figure 1.3).


    Browsers are readily available for many operating systems, including Windows,
    UNIX/Linux, and Macintosh, as well as for other computing devices from mobile
    telephones to PDAs (Personal Digital Assistants) and pocket computers.


    ![](img/2ee8632a2c5a7a595049f49876099e38_20.png)


    FIGURE 1.3 The Firefox browser from Mozilla Project home page.


    ## Client-Side Programming


    We have already discussed how server scripts can improve your web experience by
    offering pages that contain rich and varied content created at the server and
    inserted into the page before it is sent to you. Client-side programming, on the
    other hand, happens not at the server inside the user''s browser after the page
    has been received. Such scripts allow you to carry out many tasks with the data
    in the received page, including performing calculations, changing display colors
    and styles, checking the validity of user input, and much more.


    Nearly all browsers support some version or other of a client-side scripting language
    called JavaScript, which is an integral part of Ajax and is the language we''ll
    be using in this book for client-side programming.


    ## DNS—The Domain Name Service


    Every computer connected to the Internet has a unique numerical address (called
    an IP address) assigned to it. However, when you want to view a website in your
    browser, you don''t generally want to type in a series of numbers—you want to
    use the domain name of the site in question. After all, it''s much easier to remember
    www.domain.com than something like 198.105.232.4.


    When you request a web page by its domain name, your Internet service provider
    submits that domain name to a DNS server, which tries to look up the database
    entry associated with the name and obtain the corresponding IP address. If it''s
    successful, you are connected to the site; otherwise you receive an error.


    The many DNS servers around the Internet are connected together into a network
    that constantly updates itself as changes are made. When DNS information for a
    website changes, the revised address information is propagated throughout the
    DNS servers of the entire Internet, typically within 24 hours.


    ## Summary


    In Lesson 1 we discussed the history and development of the Internet and reviewed
    the functions of some of its major components including web servers and web browsers.
    We also considered the page-based nature of the traditional website user interface
    and had a brief look at what server- and client-side scripting can achieve to
    improve users'' surfing experience.


    # LESSON 2 Writing Web Pages in HTML


    In this lesson we introduce HTML, the markup language behind virtually every page
    of the World Wide Web. A sound knowledge of HTML provides an excellent foundation
    for the Ajax applications discussed in later lessons.


    ## Introducing HTML


    It wouldn’t be appropriate to try to give an exhaustive account of HTML (Hypertext
    Markup Language)—or, indeed, any of the other component technologies of Ajax—within
    this book. Instead we’ll review the fundamental principles and give some code
    examples to illustrate them, paying particular attention to the subjects that
    will become relevant when we start to develop Ajax applications.


    > Tip If you want to explore HTML in greater detail, Sams Publishing offers a
    number of titles that will help you, including Sams Teach Yourself HTML 4 in 24
    Hours by Dick Oliver.


    ## What Is HTML?


    The World Wide Web is constructed from millions of individual pages, and those
    pages are, in general, written in Hypertext Markup Language, better known as HTML.


    That gives away a lot of information about the nature of HTML. We use it to mark
    up our text documents so that web browsers know how to display them and define
    hypertext links within them to provide navigation within or between them.


    Anyone (like me) can remember the old pre-WYSIWYG word processing programs will
    already be familiar with text markup. Most of these old applications required
    that special characters be placed at the beginning and end of sections of text
    that you wanted to be displayed as (for instance) bold, italic, or underlined
    text.


    ## What Tools Are Needed to Write HTML?


    Because the elements used in HTML markup employ only keyboard characters, all
    you really need is a good text editor to construct HTML pages. Many are available,
    and most operating systems have at least one such program installed. If you''re
    using some version of Windows, for example, the built-in Notepad application works
    just fine.


    > Tip Although Notepad is a perfectly serviceable text editor, many so-called
    programmers'' editors are available offering additional functions such as line
    numbering and syntax highlighting. Many of these are under source licences and
    can be downloaded at no cost. It is well worth considering such an editor, especially
    for larger or more complex programming tasks.


    > Caution Although text editors are ideal for writing program code, the use of
    word processing software can cause problems due to unwanted markup and other symbols
    that such programs often embed in the output code. If you choose to use a word
    processor, make sure that it is capable of saving files as plain ASCII text.


    # Our First HTML Document


    Let''s jump right in and create a simple HTML document. Open Notepad (or whatever
    you''ve chosen to use) and enter the text shown in Listing 2.1. The HTML markup
    elements (often referred to as tags) are the character strings enclosed by < and
    >.

