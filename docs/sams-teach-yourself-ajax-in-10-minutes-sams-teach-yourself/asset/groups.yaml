    \ | 整个文档 |\n| `<head>...</head>` | 文档头头部 |\n\n## 表 2.1 续\n文档标签\n\n| | |\n|---|---|\n\
    | `<body>...</body>` | 文档正文 |\n| `<title>...</title>` | 文档标题 |\n| `<a>...</a>`\
    \ | 超链接 |\n| `<b>...</b>` | 粗体文本 |\n| `<em>...</em>` | 强调文本（斜体） |\n| `<font>...</font>`\
    \ | 更改的字体 |\n| `<i>...</i>` | 斜体文本 |\n| `<small>...</small>` | 小号文本 |\n| `<table>...</table>`\
    \ | 表格 |\n| `<tr>...</tr>` | 表格行 |\n| `<th>...</th>` | 表格头单元格 |\n| `<td>...</td>`\
    \ | 表格正文单元格 |\n| `<ul>...</ul>` | 无序列表 |\n| `<ol>...</ol>` | 有序列表（数字列表） |\n| `<li>...</li>`\
    \ | 无序或有序列表中的列表项 |\n\n> 提示：万维网联盟（W3C）负责管理 HTML、HTTP、XML 以及许多其他网络技术的定义。其网站地址为 http://www.w3.org/。\n\
    \n## 两分钟理解层级样式表\n\n之前的网页样式处理方法有一些缺点。首先，你需要显式说明每个页面元素的属性。当你想要更改页的外观时，需要逐行检查代码并更改每个属性。这对于几个页面可能还可以，但随着内容的增加，维护将变得困难。此外，应用于\
    \ HTML 元素的属性限制了显示方式的范围。\n\n难道对代码进行一处更改并将该更改应用到所有 HTML 元素更好吗？为了实现这一目标，你在 HTML 文档的头部使用\
    \ `<style>` 标签嵌入样式：\n\n```css\n<style type=\"text/css\">\n  ... 样式语句\n</style>\n\
    ```\n\n或者，它们也可以通过 `link` 元素从外部文件链接，再次放在文档的头部：\n\n```html\n<link rel=\"stylesheet\"\
    \ href=\"mysheet.css\" type=\"text/css\" />\n```\n\n> 提示：你甚至可以动态定义样式。这些被称为内联样式。以列表\
    \ 2.2 的 body 标签为例，你可以使用内联样式实现相同的效果：\n`<body style=\"background-color:#cccccc\"\
    >`\n\n## 设置样式表规则\n\n样式表允许你为各种 HTML 元素设置样式规则。规则包含两个部分：选择器，用于识别应该影响哪个 HTML 标签；声明，包含你的样式规则。以下示例定义了段落元素\
    \ `<p>` 的样式：\n\n```css\np {color: #33333}\n```\n\n假设除了灰色外，你希望段落标签 `<p> ... </p>`\
    \ 中的文本显示为斜体：\n\n```css\np {color: #333333; font-style: italic}\n```\n\n样式表可以包含你需要的任意规则。你也可以通过逗号分隔标签同时对多个标签应用声明。以下规则确定所有\
    \ h1、h2 和 h3 显示为蓝色：\n\n```css\nh1, h2, h3 {color: blue}\n```\n\n## 总结\n\n本节讨论了使用\
    \ HTML 语言进行网页布局的基础，包括 HTML 文档结构、HTML 元素示例以及使用属性和样式表进行页面样式。\n\n## 第 3 \n使用 HTTP\
    \ 发送请求\n\n万维网通信使用多种协议，也许最重要的 HTTP，它是 Ajax 应用的基础。本节介绍了 HTTP 协议并展示了它是如何被使用的。\n\n\
    ## 介绍 HTTP\n\nHTTP 或超文本传输协议是万维网的主要协议。当你在浏览器中输入地址时，浏览器使用 HTTP 进行请求和接收。\n\n## 为什么我需要知道这些？\n\
    \n本质上，HTTP 定义了关于消息格式的规则。\n\n## 本节涵盖了（以及未涵盖）\n\n本节检查了这些结构的一些示例。\n\n## HTTP 请求\n\
    \n在与目标服务器建立连接后，HTTP 客户端允许以下格式的请求：\n\n- 一行起始行\n- 可选的若干行头部行\n- 一个空行\n- 可选的消息正文\n\
    \n起始行通常分为三部分：方法名称、所需服务器资源的路径以及所使用的 HTTP 版本。一个典型的起始行如下：\n\n```\nGET /sams/testpage.html\
    \ HTTP/1.0\n```\n\n在此行中，我们告诉服务器我们正在发送 GET 类型的 HTTP 请求（在下一节中详细说明），我们使用 1.0 版本发送，并且我们需要的服务器资源（包括本地路径）是：\n\
    \n```\n/sams/testpage.html\n```\n\n> 注意：在此示例中，我们寻找的服务器资源在我们服务器上，因此我们相对路径。它可能在另一个服务器上，情况下服务器资源将包含完整的\
    \ URL。\n\n头部行用于发送有关请求的信息或消息正文中发送的数据。每行发送一个参数值对，参数和值用冒号分隔。示例：\n\n```\nUser-Agent:\
    \ [发送请求的程序名称]\n```\n\n例如，Internet Explorer v5.5 提供如下：\nUser-agent: Mozilla/4.0\
    \ (compatible; MSIE 5.5; Windows NT 5.0)\n\n常见的头部另一个示例是 Accept 头部，它声明了哪些信息将被服务器认为是可接受的响应：\n\
    \n```\nAccept: text/plain, text/html\n```\n\n通过发布上述示例中的头部，结果是通知发送应用程序可以接受纯文本或\
    \ HTML 响应（也就是说，它不具备处理例如音频或视频文件的能力）。\n\n## HTTP 请求与响应\n\nHTTP 协议可以被比作基于一系列问答的对话，我们分别称之为请求和响应。\n\
    \n其内容易于阅读和理解，因为它们的语法接近纯英语。\n\n> 注意：HTTP 请求方法包括 POST、GET、PUT、DELETE 和 HEAD。在我们追求\
    \ Ajax 的过程中，目前有趣的是 GET 和 POST 请求。此处未涵盖 PUT、DELETE 和 HEAD 请求。\n\n"
