    # What Is (and Isn’t) Covered in This Lesson


    As with every lesson in this part of the book, it is neither feasible appropriate
    to give an exhaustive course on every aspect of the subject.


    This lesson covers the basics of PHP programming with some practical examples,
    concentrating mainly on those aspects of PHP most relevant to our explorations
    of Ajax.


    > Tip The PHP website at http://uk.php.net/ is an invaluable source of information,
    downloads, and documentation relating to PHP.


    > Tip For a much more complete course on PHP, try Sams Teach Yourself PHP in 24
    Hours by Matt Zandstra.


    # Embedding PHP in HTML Pages


    PHP statements are embedded into HTML documents by surrounding the PHP statements
    with <?php and ?> tags. Anything between such tags is evaluated by the web server
    and replaced with appropriate HTML code, prior to the page being served to the
    browser.


    You can have many sets of <?php and ?> tags in your page as you want.


    > Tip Web servers normally recognize the file extension which files contain PHP
    code and process them accordingly. The most used file extension for PHP files
    is .php, but you may also see .php3, .php4, .shtml, and various others. To make
    your code portable to many web server environments as possible, it’s best to stick
    with .php.'
