    The Apache Software Foundation

    http://www.apache.org/


    The Apache Software Foundation provides support for the Apache community of open-source
    software projects. The projects are characterized by a collaborative, consensus-based
    process, an open and pragmatic software license, and a desire to create high-quality
    software that benefits all. We strive to ensure that developers are not dependent
    on any group of sharers, rather a community of developers around them.


