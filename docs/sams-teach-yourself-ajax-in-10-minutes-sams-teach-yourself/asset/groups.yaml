    \nXML data is made available on the Internet in many forms. One of the most popular\
    \ is the RSS feed, a particular type of XML source usually containing news or\
    \ other topical and regularly updated items. RSS feeds are available from many\
    \ sources on the Web, including most broadcast companies and newspaper publishers,\
    \ as well as specialist sites for all manner of subjects.\n\nWe will write an\
    \ Ajax application to take a URL for an RSS feed, collect the XML, and list the\
    \ titles and descriptions of the news items contained in the feed.\n\nThe following\
    \ is part of the XML for a typical RSS feed:\n\n```\n<rss version=\"0.91\">\n\
    <channel>\n<title>MyRSSfeed.com</title>\n<link>http://www.********.com/</link>\n\
    <description>My RSS feed</description>\n<language>en-us</language>\n<item>\n<title>New\
    \ Store Opens</title>\n<link>http://www.********.html</link>\n<description>A new\
    \ music store opened today in Canal Road.\nThe new business, Ajax Records, caters\
    \ for a wide range of musical tastes.</description>\n</item>\n<item>\n<title>Bad\
    \ Weather Affects Transport</title>\n<link>http://www.********.html</link>\n<description>Trains\
    \ and buses were disrupted badly today due to heavy snow. Police advised people\
    \ not to travel unless absolutely necessary.</description>\n</item>\n<item>\n\
    <title>Date Announced for Mayoral Election</title>\n<link>http://www.********.html</link>\n\
    <description>September 4th has been announced as the date\nfor the next mayoral\
    \ election. Watch local news for more\ndetails.</description>\n</item>\n</channel>\n\
    </rss>\n```\n\nFrom the first line\n\n```\n<rss version=\"0.91\">\n```\n\nwe see\
    \ that we are dealing with RSS version 0.91 in this case. The versions of RSS\
    \ differ quite a bit, but for the purposes of our example we only care about the\
    \ <title>, <link>, and <description> elements for the individual news items, which\
    \ remain essentially unchanged from version to version.\n\n# The HTML Page for\
    \ Our Application\n\nOur page needs to contain an input field to enter the URL\
    \ of the required RSS feed and a button to instruct the application to collect\
    \ the data. We will also have a <div> container in which to display our parsed\
    \ data:\n\n```\n<html>\n<head>\n<title>An Ajax RSS Reader</title>\n</head>\n<body>\n\
    <h3>An Ajax RSS Reader</h3>\n<form name=\"form1\">\nURL of RSS feed: <input type=\"\
    text\" name=\"feed\" size=\"50\" value=\"http:///\"><input type=\"button\" value=\"\
    Get Feed\"><br /><br>\n<div id=\"news\"><h4>Feed Titles</h4></div>\n</form>\n\
    </body>\n</html>\n```\n\nIf we save this code to a file rss.htm and load it into\
    \ our browser, we see something like the display shown in Figure 14.2.\n\n# Lesson\
    \ 14\n\n![](img/2ee8632a2c5a7a595049f49876099e38_160_0.png)\n\n**FIGURE 14.2**\
    \ Displaying the base HTML document for our RSS feed reader.\n\nMuch of the code\
