  mdcn: "\n\n# Web 服务与 REST 协议 161\n\n由于我们是在查询信息而非尝试更改信息，因此我们简单地向前面的 URL 发送一个 HTTP\
    \ GET 请求。服务器可能会返回如下 XML：\n\n```xml\n<articles>\n  <article>\n    <id>173</id>\n\
    \    <title>New Concepts in Ajax</title>\n    <author>P.D. Johnstone</author>\n\
    \  </article>\n  <article>\n    <id>218</id>\n    <title>More Ajax Ideas</title>\n\
