    inputlist = Form.serialize('thisform');\n```\n\nUsing the preceding line of code,\
    \ the variable inputlist would now contain a string of serialized parameter and\
    \ value pairs:\n\nfield1=value1&field2=value2&field3=value3...\n\nForm.disable('thisform')\
    \ and Form.enable('thisform') each do exactly what it says on the tin.\n\n## The\
    \ Try.these() Function\n\nPrevious lessons discussed the use of exceptions to\
    \ enable you to catch runtime errors and deal with them cleanly. The Try.these()\
    \ function provides a convenient way to encapsulate these methods to provide a\
    \ cross-browser solution where JavaScript implementation details differ:\n\n```javascript\n\
    return Try.these(function1(),function2(),function3(), ...);\n```\n\nThe functions\
    \ are processed in sequence, operation moving to the next function when an error\
    \ condition causes an exception to be thrown. Operation stops when any of the\
    \ functions completes successfully, at which point the function returns true.\n\
    \nApplying this function to the creation of an XMLHttpRequest instance shows the\
    \ simplicity of the resulting code:\n\n```javascript\nreturn Try.these(\nfunction()\
    \ {return new ActiveXObject('Msxml12.XMLHTTP')},\nfunction() {return new ActiveXObject('Microsoft.XMLHTTP')},\n\
    function() {return new XMLHttpRequest()()}\n)\n```\n\n> Note: You may want to\
    \ compare this code snippet with Listing 8.1 to see how much code complexity has\
    \ been reduced and readability improved.\n\n## Wrapping XMLHttpRequest—the Ajax\
    \ Object\n\nprototype.js defines an Ajax object designed to simplify the development\
    \ of your JavaScript code when building Ajax applications. This object has a number\
    \ of classes that encapsulate the code you need to send server requests, monitor\
    \ their progress, and deal with the returned data.\n\n### Ajax.Request\n\nAjax.Request\
    \ deals with the details of creating an instance of the HTTPRequest object and\
    \ sending a correctly formatted request. Calling it is straightforward:\n\n```javascript\n\
    var myAjax = new Ajax.Request( url, {method: 'post',\nparameters: mydata, onComplete:\
    \ responsefunction });\n```\n\nIn this call, url defines the location of the server\
    \ resource to be called, method may be either post or get, mydata is a serialized\
    \ string containing the request parameters, and responsefunction is the name of\
    \ the callback function that handles the server response.\n\n> Tip: The second\
    \ argument is constructed using a notation often called JSON (JavaScript Object\
    \ Notation). The argument is built up from a series of parameter:value pairs,\
    \ the whole contained within braces. The parameter values themselves may be JSON\
    \ objects, arrays, or simple values.\n\nJSON is popular as a data interchange\
    \ protocol due to its ease of construction, ease of parsing, and language independence.\
    \ You can find out more about it at http://www.json.org.\n\nThe onComplete parameter\
    \ is one of several options corresponding to the possible values of the XMLHttpRequest\
    \ readyState properties, in this case is a readyState value of 4 (Complete). There\
    \ are several other options, including asynchronous:false to indicate that a call\
    \ should be made synchronously.\n\n### Ajax.Updater\n\nOn occasions when you require\
    \ the returned data to update a page element, the Ajax.Updater class can simplify\
    \ the task. All you need to do is specify which element should be updated:\n\n\
