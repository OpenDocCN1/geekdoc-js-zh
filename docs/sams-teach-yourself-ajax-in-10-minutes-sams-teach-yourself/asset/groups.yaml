- md: "\nEach time we enter the URL of a different RSS feed into the input field and\
    \ click the button, the <div> content is updated to show the items belonging to\
    \ the new RSS feed. This being an Ajax application, there is of course no need\
    \ to reload the whole page.\n\n## The Server-Side Code\n\nBecause of the security\
    \ constraints built into the XMLHttpRequest object, we can't fetch an RSS feed\
    \ directly; we must use a script with a URL on our own server, and with this script\
    \ collect the remote XML file and deliver it to the Ajax application.\n\nIn this\
    \ case, we do not require that the server-side script ssrps.php should modify\
    \ the XML file but simply route it back to us via the responseXML of the XMLHttpRequest\
    \ object. We say that the script is acting as a proxy because it is retrieving\
    \ the remote resource on behalf of the Ajax application.\n\nListing 14.2 the code\
    \ of the PHP script.\n\n## Listing 14.2 Server Script for the RSS Headline Reader\n\
    \n```php\n<?php\n$mysession = curl_init($_GET['feed']);\ncurl_setopt($mysession,\
    \ CURLOPT_HEADER, false);\ncurl_setopt($mysession, CURLOPT_RETURNTRANSFER, true);\n\
    $out = curl_exec($mysession);\nheader('Content-Type: text/xml');\necho $out;\n\
    curl_close($mysession);\n?>\n```\n\nThe script uses the cURL PHP library, a set\
    \ of routines for making Internet file transfer easier to program. A full description\
    \ of cURL would not be appropriate here; suffice to say that this short script\
    \ first receives the URL of the required RSS feed by referring to the variable\
    \ sent by the Ajax application. The two lines that call the curl_setopt() function\
    \ declare, respectively, that we don't want the headers sent with the remote file,\
    \ but we do want the file contents. The curl_exec() function then makes the data\
    \ transfer.\n\nAfter that it's simply a matter of adding an appropriate header\
    \ by using the familiar PHP header() command and returning the data to our Ajax\
    \ application.\n\n> Tip For a full description of using CURL with PHP, see the\
    \ PHP website at http://uk2.php.net/curl and/or the curl site at http://curl.haxx.se/.\n\
    \nFigure 14.3 shows the RSS reader in action, in this case displaying content\
    \ from a CNN newsfeed.\n\n![](img/2ee8632a2c5a7a595049f49876099e38_166_0.png)\n\
    \nFIGURE 14.3 The Ajax RSS reader in action.\n\n## Summary\n\nThe JavaScript DOM\
    \ methods, when used with the XMLHttpRequest object and XML data, provide a powerful\
    \ means of transferring, organizing, and either displaying or otherwise processing\
    \ data that has a sophisticated structure.\n\nIn this lesson you saw how DOM elements\
    \ can be added, deleted, and manipulated to restructure an application's DOM in\
    \ accordance with XML data received in the XMLHttpRequest object's responseXML.\n\
    \n## LESSON 15\nWeb Services and the REST Protocol\n\nIn this lesson you will\
    \ learn the basics of web services and how to implement them using the REST (Representational\
    \ State Transfer) protocol.\n\n## Introduction to Web Services\n\nSo far you have\
    \ seen several example applications in which we have called server-side scripts\
    \ to carry out tasks. In each case we devised data structures to transfer the\
    \ information and written routines to handle data both to and from the server.\n\
    \nSuppose, though, that you wanted to make your server-side programs more generally\
    \ available. Perhaps you can imagine that several different web applications might\
    \ interface with such scripts for their own purposes. As well as browsers requesting\
    \ pages directly, perhaps other applications (for example Ajax applications operating\
    \ via XMLHttpRequest calls) might also make data requests and expect to receive,\
    \ data that they can understand and manipulate.\n\nIn such cases it would be beneficial\
    \ to have some form of standardization in the interfaces that your program makes\
    \ available. This principle provides the basis of what have come to be known as\
    \ web services.\n\nAs an example, suppose that your server application produces\
    \ XML-formatted forecast data in response to a request containing geographical\
    \ information.\n\nThe nature of this type of service makes it broadly applicable;\
    \ such an application might have a wide variety of “clients” ranging from simple\
    \ web pages that present new weather forecasts in their local area to complex\
    \ aviation or travel planning applications that require the data for more demanding\
    \ uses.\n\nThis type of service is just one small example of what a web service\
    \ might be capable of doing. Thousands of web services are active on the Internet,\
    \ providing a mind-boggling array of facilities including user authentication,\
    \ payment processing, content syndication, messaging, and a host of others.\n\n\
    In general, a web service makes available an application programming interface\
    \ (API), which allows client applications to build interfaces to the service.\
    \ Although any Internet protocol might be used to create web services, XML and\
    \ HTTP are popular options.\n\nA number of protocols and techniques have emerged\
    \ that help you to create and utilize web services. This lesson looks at perhaps\
    \ the simplest of those, called REST (Representational State Transfer), and Lesson\
    \ 16, “Web Services Using SOAP,” discusses another protocol, this time called\
    \ SOAP (the Simple Object Access Protocol). Each lesson highlights how they may\
    \ be useful in Ajax applications.\n\n## REST—Representational State Transfer\n\
    \nREST is centered on two main principles for generalized network design:\n\n\
    - Resources are represented by URLs—A resource can be thought of as a “noun” and\
    \ refers to some entity we want to deal with in the API of a web service; this\
    \ could be a document, a person, a meeting, a location, and so on. Each resource\
    \ in a REST application has a unique URL.\n\n- Operations are carried out via\
    \ standard HTTP methods—HTTP methods as GET, POST, PUT, and DELETE are used to\
    \ carry out operations on resources. In this way we can consider such operations\
    \ as “verbs” acting on resources.\n\n## A Hypothetical REST Example\n\nTo understand\
    \ how and why we might apply these ideas, let's look at a hypothetical example.\n\
    \nSuppose that we have a service that allows writers to submit, edit, and read\
    \ articles. Applying so-called RESTful principles to the design of this application,\
    \ the following occurs:\n\n- Each submitted article has a unique URL, for example:\n\
    \  `http://somedomain.com/articles/173`\n\n- We only require that the URL be unique\
    \ for each article; for instance\n`http://somedomain.com/articles/list.php?id=173`\n\
    \n> Although REST requires that URLs are unique, it does not follow that each\
    \ resource must have a corresponding physical page. In many cases the resource\
    \ is generated by the web service at the time of the request—for example, by reference\
    \ to a database.\n\n- To retrieve an article to read or edit, our client application\
    \ would simply use an HTTP GET request to the URL of the article in question.\n\
    \n- To upload a new article, a POST request would be used, containing information\
    \ about the article. The server would respond with the URL of the newly uploaded\
    \ article.\n\n- To update an edited article, a PUT request would be used, containing\
    \ the revised content.\n\n- HTTP DELETE would be employed to delete a particular\
    \ article.\n\nIn this way, the web service is using an interface familiar to anyone\
    \ who has used the World Wide Web. We do not need to devise a library of API methods\
    \ for sending or retrieving information; we already have them in the form of the\
    \ standard HTTP methods.\n\n> Note The World Wide Web itself is a REST application.\n\
    \n## Query Information Using GET\n\nAn important issue concerning the use of the\
    \ HTTP GET request in a RESTful application is that it never change the server\
    \ state. To put it another way: We only GET requests to ask for information from\
    \ the server, never to add or alter information already there.\n\nPOST, PUT, and\
    \ DELETE calls can all change the server status in some way.\n\n## Stateless Operation\n\
    \nAll server exchanges in a RESTful application should be stateless. By stateless\
    \ we mean that the call itself must contain all the information required by the\
    \ server to carry out the required task, rather than depending on some state or\
    \ context currently present on the server. We cannot, for example, require the\
    \ server to refer to information sent in previous requests.\n\n## Using REST in\
    \ Practice\n\nLet's expand on the example quoted earlier involving our articles\
    \ web service.\n\n### Reading a List of Available Articles\n\nThe list of available\
    \ articles is a resource. Because the web service conforms to REST principles,\
    \ we expect the service to provide a URL by which we can access this resource,\
    \ for instance:\n\n```\nhttp://somdomain.com/articles/list.php\n```\n"
