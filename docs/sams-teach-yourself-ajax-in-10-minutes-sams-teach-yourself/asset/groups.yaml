    \n\nOnClick = \"history.back()\"\n\n[Wait, I will just provide the clean version\
    \ of the unique content.]\n\n## Making Ajax Degrade Elegantly\n\nThe lessons in\
    \ this book have covered the development of Ajax applications using various browsers.\
    \ It is still possible, though, that a visitor's browser may have disabled.\n\n\
    It is unfortunate if an Ajax application should break down under these conditions.\n\
    \nAt the least, the occurrence of obvious errors (such as a failure to create\
    \ an instance of the XMLHttpRequest object) should be reported to the user. If\
    \ the Ajax application is so complex that it cannot automatically revert to a\
    \ non-Ajax mode of operation, perhaps the user can at least be redirected to a\
    \ non-Ajax version.\n\n> Tip You can detect JavaScript is unavailable by using\
    \ the <noscript> ... </noscript> tags. Statements between these tags are evaluated\
    \ only if JavaScript is NOT available:\n<noscript>\nJavaScript is not available\
    \ in this browser.<br />\nPlease go a <a href=\"other.htm\">HERE</a> for the HTML-only\
    \ version.<br />\n</noscript>\n\n## Dealing with Search Engine Spiders\n\nSearch\
    \ engines gather information about websites through various means, an important\
    \ one being the use of automated programs called spiders.\n\nSpiders, as their\
    \ name suggests, \"crawl the web\" by reading web pages and following links, building\
    \ a database of content and other relevant information about particular websites.\
    \ This database, better known as an index, is queried by search engine visitors\
    \ using their key words and returns suggestions of relevant pages for them to\
    \ visit.\n\nThis can create a problem for highly dynamic sites, which rely on\
    \ user interaction (rather than surfing) to invoke the loading of new content\
    \ delivered over-demand by the server. The visiting spider may not have access\
    \ to the content that would be loaded by dynamic means and therefore never gets\
    \ to index.\n"
