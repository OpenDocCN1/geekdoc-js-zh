  - '[PAGE 209]


    # The prototype.js Toolkit 199


    applications as a stock market ticker or an RSS reader because it ensures that
    the visitor is always viewing reasonably up-to-date information.


    Ajax.PeriodicalUpdater adds two further parameters to the Ajax.Updater options:


    +   - The delay in seconds between successive updates. Default is two seconds.

    - The multiplier by which successive delays are increased if the server should
    return unchanged data. Default value is 1, which leaves the delay constant.


    Here''s an example call to Ajax.PeriodicalUpdater:


    ```

    var myAjax = new Ajax.PeriodicalUpdater(elementID, url,

    ->{frequency: 3.0, decay: 2.0});

    ```


    Here we elected to set the initial delay to 3 seconds and have this delay length
    in each time unchanged data is returned by the server.


    # Example Project—Stock Price Reader


    Let''s use the prototype.js library to build a simple reader that updates periodically
    to show the latest value returned from the server. In this example, we''ll use
    a server-side script rand.php to simulate a changing stock price:


    ```

    <?php

    rand((double) microtime( )*1000000);

    $price = 50 + rand(0,5000)/100;

    echo "$price";

    ?>

    ```


    This script initializes PHP''s random number routine by calling the srand() function
    and passing it an argument derived from the current time. The rand(0,5000) function
    is then used to generate a random number that is manipulated arithmetically to
    produce phony “stock prices” in the range 50.00 to 100.00.'
- md: "\n## 200 Lesson 19\n\nNow let's build a simple HTML page to display the current\
    \ stock price.\nThis page forms the base for our Ajax application:\n\n```html\n\
    <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\n//http://www.w3.org/TR/html4/loose.dtd\"\
    >\n<html>\n<head>\n<script src=\"prototype.js\" Language=\"JavaScript\">\n<script\
    \ type=\"text/javascript\"></script>\n<title>Stock Reader powered by Prototype.js</title>\n\
    </head>\n<body>\n<h2>Stock Reader</h2>\n<h4>Powered by Prototype.js</h4>\n<p>Current\
    \ Stock Price:</p>\n<div id=\"price\"></div>\n</body>\n</html>\n```\n\nNote that\
    \ we included the prototype.js library by means of a <script> tag\nin the document\
    \ header. We also defined a <div> id set to \"price\",\nwill be used to display\
    \ the current stock price.\n\nWe now need to implement the Ajax.PeriodicalUpdater\
    \ class, which\nwe'll attach to the document body element's onLoad event handler.\
    \ Listing\n19.1 shows the complete script.\n\n## LISTING 19.1 Ajax Stock Price\
    \ Reader Using prototype.js\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML\
    \ 4.01\n//Transitional//EN\"\n//http://www.w3.org/TR/html4/loose.dtd\">\n<html>\n\
    <head>\n<script src=\"prototype.js\" Language=\"JavaScript\">\n<script type=\"\
    text/javascript\"></script>\n<script>\nfunction checkprice() {\nvar myAjax = new\
    \ Ajax.PeriodicalUpdater('price',\n'rand.php', {method: 'post', frequency: 3.0,\n\
    day: 1});\n}\n</script>\n<title>Stock Reader powered by Prototype.js</title>\n\
    ```\n\n## The prototype.js Toolkit 201\n\n```html\n<head>\n<body onLoad=\"checkprice()\"\
    >\n<h2>Stock Reader</h2>\n<h4>Powered by Prototype.js</h4>\n<p>Current Stock Price:</p>\n\
    <div id=\"price\">*</div>\n</body>\n</html>\n```\n\nLook how simple the code for\
    \ the application has become through using prototype.js. Implementing the application\
    \ is merely a matter of defining a one-line function checkprice() to instantiate\
    \ its repeating Ajax call and calling that function from the body element's onLoad\
    \ event handler.\n\nFrom the arguments passed to Ajax.PeriodicUpdater, you'll\
    \ see that a 3-second repeat interval has been specified. This period does not\
    \ change with subsequent calls because the decay value has been set to 1.\n\n\
    Figure 19.1 shows the application running. What cannot be seen from the figure,\
    \ is the stock price updating itself every 3 seconds to show a new value.\n\n\
    ![](img/2ee8632a2c5a7a595049f49876099e38_211_0.png)\n\n**Figure 19.1** Ajax stock\
    \ reader.\n\nThis simple example does not come close to showing off the power\
    \ and versatility of the prototype.js library. Rather, it is intended to get you\
    \ started with your own experiments by offering an easy point of access to this\
    \ great resource.\n\n## Summary\n\nIn this first lesson in Part IV of the book,\
    \ we discussed the use of the powerful and elegant prototype.js JavaScript library.\n\
    \nThe functions made available by this library greatly simplify some of the trickier\
    \ programming tasks when developing Ajax applications.\n\nThe library offers good\
    \ support for the XMLHttpRequest object, along with time-saving shortcuts for\
    \ DOM handling, HTML forms, and many other techniques relevant to Ajax development.\n\
    \n## Lesson 20\n\n## Using Rico\n\nIn this lesson you will learn the basics of\
    \ Rico, a powerful Ajax and user interface development framework.\n\n## Introducing\
    \ Rico\n\nIn Lesson 19, “The prototype.js Toolkit,” we looked at prototype.js,\
    \ a powerful and useful JavaScript library that simplifies many of the tasks facing\
    \ the Ajax developer.\n\nIn this lesson we'll take a look at Rico, a sophisticated\
    \ Ajax framework employing the prototype.js library.\n\nRico is an open source\
    \ library that extends the capabilities of prototype.js to provide a rich set\
    \ of interface development tools. In addition to the Ajax techniques discussed\
    \ so far, Rico offers a whole range of tools such as drag-and-drop, cinematic\
    \ effects, and more.\n\n> Tip Rico is the Spanish word for rich, which seems appropriate\
    \ for a toolkit designed for building rich interfaces!\n\n## Using Rico in Your\
    \ Applications\n\nTo start using Rico to build applications with rich user interfaces,\
    \ you need to include both Rico and prototype.js libraries in the <head>...</head>\
    \ section of your web pages.\n\n```html\n<script src=\"scripts/prototype.js\"\
    ></script>\n<script src=\"scripts/rico.js\"></script>\n```\n\n## Rico’s AjaxEngine\n\
    \nThe inclusion of rico.js causes an instance called ajaxEngine of an AjaxEngine\
    \ object to be created automatically ready for you to use. The AjaxEngine is Rico’s\
    \ mechanism for adding Ajax capabilities to your web pages.\n\nThe AjaxEngine\
    \ requires a three-step process to update page elements via Ajax:\n\n- 1. Register\
    \ the request handler. Registering the request handler associates a unique name\
    \ with a particular URL to be called via Ajax.\n- 2. Register the response handler.\
    \ Rico can deal with the return of both HTML data and JavaScript code within the\
    \ XML returned from the.\n- 3. Make the Ajax call from the page.\n\nIn the case\
    \ of responses containing a JavaScript object, you will need: ajaxEngine.registerAjaxObject('myTransform',\
    \ new myHandler());\n\nHow the response handler is registered depends on which\
    \ type response we are dealing with. For responses of element, you can simply\
    \ call: ajaxEngine.registerAjaxElement('showdata');\n\nWe first register our request\
    \ handler by using the following: ajaxEngine.registerRequest('myRequest', 'getData.php');\n\
    \nWhereas responses of element are simply intended for the updating page elements,\
    \ responses of object can have handlers to process responses in any way they want.\n\
    \nThe content of the response is always passed to the update method of this object.\
    \ This allows Rico applications to be built ranging from simple to sophisticated.\n\
    \n## Simple Example\n\nWe can see Rico in action using the simple script of 20.1.\
    \ This application updates two HTML elements with a single call to Rico’s ajaxEngine\
    \ object. The script for the application is in Listing 20.1.\n\n## LISTING 20.1\
    \ A Simple Rico Application\n\n```html\n<!DOCTYPE HTML PUBLIC \"-W3C//DTD HTML\
    \ 4.01\n//Transitional//EN\"\n//http.w3.org/TR/html4/loose.dtd\">\n<html>\n<head>\n\
    <title>Opening Rico</title>\n<script src=\"prototype.js\"></script>\n<script src=\"\
    rico.js\"></script>\n<script type=\"text/javascript\">\nfunction callRICO()\n\
    {\najaxEngine.registerRequest('myRequest', 'ricotest.php');\najaxEngine.registerAjaxElement('display');\n\
    ajaxEngine.registerAjaxElement('heading');\n}\n</script>\n</head>\n<body onload=\"\
    callRICO()\">\n<div id=\"heading\"><h3>Demonstrating Rico</h3></div>\n<input type=\"\
    button\" value=\"Get Server Data\"\n onclick=\"ajaxEngine.sendRequest('myRequest')\"\
    />\n<div id=\"display\" ₼<p>This text should be replaced with\n <div>>server data\
    \ ...</p></div>\n</body>\n</html>\n```\n"
