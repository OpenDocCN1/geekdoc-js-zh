    # LESSON 16

    Web Services

    Using SOAP


    In this lesson you will learn about using web services with the SOAP protocol.


    # Introducing SOAP (Simple Object Access Protocol)


    In Lesson 15, "Web Services and the REST Protocol," we discussed web services
    and in particular saw how the REST (Representational State Transfer) protocol
    can be used to provide a consistent application programming interface (API) to
    such services.


    REST is a good example of a protocol designed to operate with resource-oriented
    services, those that provide a simple mechanism to locate a resource and a set
    of basic methods that can manipulate a resource. In a resource-oriented service,
    those methods normally revolve around creating, retrieving, modifying, and deleting
    pieces of information.


    In the case of REST, the methods are those specified in the HTTP specifications—GET,
    POST, PUT, and DELETE.


    In certain cases, however, we are more interested in the actions a web service
    can carry out than in the resources it control. We might call such services action-oriented.
    In these situations the resources themselves have some importance, but the key
    issues concern the details of the activities undertaken by the service.


    The most popular and widely used protocol for designing action-oriented web services
    is SOAP, the Simple Object Access Protocol.


    This lesson looks at SOAP, comparing and contrasting it where appropriate with
    the REST protocol discussed in Lesson 15.'
- md: "\n> The full name Simple Object Access Protocol has been dropped in the later\
    \ versions of the SOAP specifications, as it was felt that the direction of the\
    \ project had shifted and the name was no longer appropriate. The protocol continues\
    \ to be referred to as SOAP.\n\n## The Background of the SOAP Protocol\n\nSOAP\
    \ began in the late 1990s when XML was itself a fledgling technology and another\
    \ XML-based web service protocol, called XML-RPC, had a joint upbringing with\
    \ W3C in 2000.\n\nSOAP was designed essentially as a means of packaging remote\
    \ calls (requests to invoke programs on remote machines) into XML wrappers in\
    \ a standardized way.\n\nNumerous enterprises contributed to the early development\
    \ of SOAP, including IBM, Microsoft, and Userland. The development of SOAP later\
    \ passed to the XML Protocols Working Group of the W3C.\n\n> You can get the latest\
    \ information on the SOAP specification from the W3C website at http://www.w3.org/2000/xp/Group/\n\
    \n## The SOAP Protocol\n\nSOAP is an XML-based messaging protocol. A SOAP request\
    \ is an XML document with the following main constituents:\n\n- An envelope that\
    \ defines the document as a SOAP request\n- A body element containing information\
    \ about the call and the expected responses\n- Optional header and fault elements\
    \ that carry supplementary information\n\nLet’s look at a skeleton SOAP request:\n\
    \n```xml\n<?xml version=\"1.0\"?>\n<SOAP-ENV:Envelope\nxmlns:SOAP-ENV=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \nSOAP-ENV:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\">\n  <SOAP-ENV:Header>\n\
    \  .. various commands ..\n</SOAP-ENV:Header>\n<SOAP-ENV:Body>\n  .. various commands\
    \ ..\n<SOAP-ENV:Fault>\n  .. various commands ..\n</SOAP-ENV:Fault>\n</SOAP-ENV:Body>\n\
    </SOAP-ENV:Envelope>\n```\n\nNote that the SOAP request is an XML file, which\
    \ has as its root the Envelope element.\n\nThe first line of the Envelope is\n\
    \n```xml\n<SOAP-ENV:Envelope xmlns:SOAP-ENV=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \nSOAP-ENV:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\n```\n\n\
    This line declares the xmlns:soap namespace, which must always have the value\
    \ xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\".\n\n> Tip A namespace\
    \ is an identifier to uniquely group a set of XML elements or attributes, providing\
    \ a means to qualify their names, so that names in other schemas do not conflict\
    \ with them.\n\nThe encodingStyle attribute contains information defining the\
    \ data types used in the message.\n\nNext appears the Header element, which is\
    \ optional but must, if present, the first element in the message. Attributes\
    \ defined in the Header element define how the message is to be processed by the\
    \ receiving application.\n\n## Web Services Using SOAP\n\nThe body element of\
    \ the SOAP message contains the message intended for the final recipient.\n\n\
    The serialized arguments are contained within the SOAP request's body element.\
    \ The call's XML element must immediately follow the opening XML tag of the SOAP\
    \ body and must have the same name as the remote method being called.\n\nThe body\
    \ may also contain a Fault element (but no more than one). This element is defined\
    \ in the SOAP specification and is intended to carry information about any errors\
    \ that may have occurred. If it exists, it must be a child element of the body\
    \ element. The Fault element has various child elements including faultcode, faultstring,\
    \ and detail, which contain specific details of the fault condition.\n\n## Code\
    \ Example of a SOAP Request\n\nLet's see how a typical SOAP request might look:\n\
    \n```xml\n<?xml version=\"1.0\"?>\n<SOAP-Envelope xmlns:SOAP-ENV=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \ encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\">\n<SOAP-ENV:Body>\n\
    <m:GetInvoiceTotal xmlns:m=\"http://www.somedomain.com/invoices\">\n<m:Invoice>77293</m:Invoice>\n\
    </m:GetInvoiceTotal>\n</SOAP-ENV:Envelope>\n```\n\nIn the preceding example, the\
    \ m:GetInvoiceTotal and m:Invoice elements are specific to the particular, and\
    \ are not part of SOAP itself. These elements constitute the message contained\
    \ in the SOAP envelope.\n\nLet's see what the SOAP response from the web service\
    \ might look like:\n\n```xml\n<?xml version=\"1.0\"?>\n<SOAP-Envelope xmlns:SOAP-ENV=\"\
    http://schemas.xmlsoap.org/soap/envelope/\" encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\
    >\n<SOAP-ENV:Body>\n<m:ShowInvoice xmlns:m=\"http://www.somedomain.com/invoices\"\
    >\n<m:InvoiceTotal>3295.00</m:InvoiceTotal>\n</m:ShowInvoice>\n</SOAP-ENV:Body>\n\
    </SOAP-ENV:Envelope>\n```\n\n## Sending the SOAP Request Via HTTP\n\nA SOAP message\
    \ may be transmitted via HTTP GET or HTTP POST. If sent via HTTP POST, the SOAP\
    \ message requires at least one HTTP header to be; this defines the Content-Type:\n\
    \nContent-Type: text/xml\n\nAfter a successful SOAP exchange, you would expect\
    \ to receive the SOAP response preceded by an appropriate HTTP header:\n\n```http\n\
    HTTP/1.1 200 OK\nContent-Type: text/xml\nContent-Length: ...\n<?xml version=\"\
    1.0\"?>\n<SOAP-Envelope xmlns:SOAP-ENV=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \ encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\">\n<SOAP-ENV:Body>\n\
    <m:ShowInvoice xmlns:m=\"http://www.somedomain.com/invoices\">\n<m:InvoiceTotal>3295.00</m:InvoiceTotal>\n\
    </m:ShowInvoice>\n</SOAP-ENV:Body>\n</SOAP-ENV:Envelope>\n```\n\n## Using Ajax\
    \ and SOAP\n\nTo use SOAP with Ajax, you need to perform a number of separate\
    \ steps:\n\n1. Create the SOAP envelope.\n2. Serialize the application-specific\
    \ information into XML.\n3. Create the SOAP body containing the application-specific\
    \ data.\n4. Send the request via the XMLHttpRequest object.\n\nHow might the resulting\
    \ code look?\n\n```javascript\nvar invoiceno = '77293';\nvar xhr = new XMLHttpRequest();\n\
    xhr.open(\"POST\", \"http://www.somedomain.com/invoices\", true);\nxhr.setRequestHeader(\"\
    Content-Type\", \"text/xml\");\nxhr.onreadystatechange = function() {\n  if (xhr.readyState\
    \ == 4 && xhr.status == 200) {\n    alert(\"The server said: \" + xhr.responseText);\n\
    \  }\n};\nvar mySOAP = '<?xml version=\"1.0\"?>\n<SOAP-Envelope xmlns:SOAP-ENV=\"\
    http://schemas.xmlsoap.org/soap/envelope/\" encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\
    >\n<SOAP-ENV:Body>\n<m:GetInvoiceTotal xmlns:m=\"http://www.somedomain.com/invoices\"\
    >\n<m:Invoice>' + invoiceno + '</m:Invoice>\n</m:GetInvoiceTotal>\n</SOAP-ENV:Body>\n\
    </SOAP-ENV:Envelope>';\nxhr.send(mySOAP);\n```\n\nWe have constructed the entire\
    \ SOAP envelope in a JavaScript variable, before passing it to the send() function\
    \ of the XMLHttpRequest object.\n\nThe value returned by the server must be first\
    \ parsed to recover the SOAP response and then to recover the application data\
    \ from the body of the SOAP message.\n"
  mdcn: "\n\n> Simple Object Access Protocol（简单对象访问协议）的全称在 SOAP 规范的后期版本中被弃用，因为人们认为项目的方向已经发生变化，该名称不再适用。该协议仍然被称为\
    \ SOAP。\n\n## SOAP 协议的背景\n\nSOAP 起于 20 世纪 90 年代末，当时 XML 本还是一项新兴技术，而另一种基于 XML 的\
    \ Web 服务协议 XML-RPC 则在 2000 年与 W3C 共同诞生。\n\nSOAP 的设计初衷是为了以标准化的方式将远程调用（在远程机器上运行程序的请求）封装在\
    \ XML 包装器中。\n\n许多企业对 SOAP 的早期开发出了贡献，包括 IBM、Microsoft 和 Userland。随后，SOAP 的开发交 W3C\
    \ 的 XML 协议工作组。\n\n> 你可以通过 W3C 网站 http://www.w3.org/2000/xp/Group/ 获取有关 SOAP 规范的最新信息。\n\
    \n## SOAP 协议\n\nSOAP 是一种基于 XML 的消息协议。一个 SOAP 请求是一个包含以下主要部分的 XML 文档：\n\n- 封包（Envelope）：定义该文档为\
    \ SOAP 请求\n- 主体元素（Body）：包含关于调用和预期响应的信息\n- 可选的头元素（Header）和故障（Fault）元素：携带补充信息\n\n\
    让我们来看一个 SOAP 请求的框架：\n\n```xml\n<?xml version=\"1.0\"?>\n<SOAP-ENV:Envelope\nxmlns:SOAP-ENV=\"\
    http://schemas.xmlsoap.org/soap/envelope/\"\nSOAP-ENV:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\
    >\n  <SOAP-ENV:Header>\n  .. various commands ..\n</SOAP-ENV:Header>\n<SOAP-ENV:Body>\n\
    \  .. various commands ..\n<SOAP-ENV:Fault>\n  .. various commands ..\n</SOAP-ENV:Fault>\n\
    </SOAP-ENV:Body>\n</SOAP-ENV:Envelope>\n```\n\n注意，SOAP 请求是一个 XML 文件，其根元素是 `Envelope`。\n\
    \n`Envelope` 的第一行是：\n\n```xml\n<SOAP-ENV:Envelope xmlns:SOAP-ENV=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \nSOAP-ENV:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\n```\n\n\
    这一行声明了 `xmlns:soap` 命名空间，其值必须始终为 `xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    `。\n\n> 提示：命名空间用于唯一分组一组 XML 元素或属性的标识符，提供限定其名称的方法，以便与其他架构中的名称与它们发生冲突。\n\n`encodingStyle`\
    \ 属性包含了定义消息中所用数据类型的信息。\n\n接下来是 `Header` 元素，它是可选的，但如果存在，它必须是消息中的第一个元素。`Header`\
    \ 元素中定义的属性定义了接收应用程序如何处理该消息。\n\n## 使用 SOAP 的 Web 服务\n\nSOAP 消息主体元素包含发送给最终接收者的消息。\n\
    \n序列化的参数包含在 SOAP 请求的主体元素中。调用的 XML 元素必须紧跟在 SOAP 主体的起始 XML 标签之后，并且必须与被调用的远程方法同名。\n\
    \n主体还可以包含一个 `Fault` 元素（但最多于一个）。该元素在 SOAP 规范中定义，用于携带可能发生的任何错误信息。如果它存在，它必须是主体元素的子元素。`Fault`\
    \ 元素具有各种子元素，包括 `faultcode`、`faultstring` 和 `detail`，它们包含了故障状况的具体细节。\n\n## SOAP\
    \ 请求的代码示例\n\n让我们看看一个典型的 SOAP 请求可能是什么样的：\n\n```xml\n<?xml version=\"1.0\"?>\n<SOAP-Envelope\
    \ xmlns:SOAP-ENV=\"http://schemas.xmlsoap.org/soap/envelope/\" encodingStyle=\"\
    http://schemas.xmlsoap.org/soap/encoding/\">\n<SOAP-ENV:Body>\n<m:GetInvoiceTotal\
    \ xmlns:m=\"http://www.somedomain.com/invoices\">\n<m:Invoice>77293</m:Invoice>\n\
    </m:GetInvoiceTotal>\n</SOAP-ENV:Envelope>\n```\n\n在前面的示例中，`m:GetInvoiceTotal`\
    \ 和 `m:Invoice` 元素是特定的，并不是 SOAP 本身的一部分。这些元素构成了 SOAP 封包中包含的消息。\n\n让我们看看 Web 服务的\
    \ SOAP 响应可能是什么样的：\n\n```xml\n<?xml version=\"1.0\"?>\n<SOAP-Envelope xmlns:SOAP-ENV=\"\
    http://schemas.xmlsoap.org/soap/envelope/\" encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\
    >\n<SOAP-ENV:Body>\n<m:ShowInvoice xmlns:m=\"http://www.somedomain.com/invoices\"\
    >\n<m:InvoiceTotal>3295.00</m:InvoiceTotal>\n</m:ShowInvoice>\n</SOAP-ENV:Body>\n\
    </SOAP-ENV:Envelope>\n```\n\n## 通过 HTTP 发送 SOAP 请求\n\nSOAP 消息可以通过 HTTP GET 或 HTTP\
    \ POST 传输。如果通过 HTTP POST 发送，SOAP 消息至少需要一个 HTTP 头来定义 `Content-Type`：\n\nContent-Type:\
    \ text/xml\n\n在成功的 SOAP 交换之后，你将期望收到带有适当 HTTP 头的 SOAP 响应：\n\n```http\nHTTP/1.1\
    \ 200 OK\nContent-Type: text/xml\nContent-Length: ...\n<?xml version=\"1.0\"?>\n\
    <SOAP-Envelope xmlns:SOAP-ENV=\"http://schemas.xmlsoap.org/soap/envelope/\" encodingStyle=\"\
    http://schemas.xmlsoap.org/soap/encoding/\">\n<SOAP-ENV:Body>\n<m:ShowInvoice\
    \ xmlns:m=\"http://www.somedomain.com/invoices\">\n<m:InvoiceTotal>3295.00</m:InvoiceTotal>\n\
    </m:ShowInvoice>\n</SOAP-ENV:Body>\n</SOAP-ENV:Envelope>\n```\n\n## 使用 Ajax SOAP\n\
    \n要在 Ajax 中使用 SOAP 需要执行若干独立步骤：\n\n1. 创建 SOAP 封包。\n2. 将特定的信息序列化为 XML。\n3. 创建包含特定数据的\
    \ SOAP主体。\n4. 通过 XMLHttpRequest 对象发送请求。\n\n生成的代码可能是什么样的？\n\n```javascript\nvar\
    \ invoiceno = '77293';\nvar xhr = new XMLHttpRequest();\nxhr.open(\"POST\", \"\
    http://www.somedomain.com/invoices\", true);\nxhr.setRequestHeader(\"Content-Type\"\
    , \"text/xml\");\nxhr.onreadystatechange = function() {\n  if (xhr.readyState\
    \ == 4 && xhr.status == 200) {\n    alert(\"服务器说：\" + xhr.responseText);\n  }\n\
    };\nvar mySOAP = '<?xml version=\"1.0\"?>\n<SOAP-Envelope xmlns:SOAP-ENV=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \ encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\">\n<SOAP-ENV:Body>\n\
    <m:GetInvoiceTotal xmlns:m=\"http://www.somedomain.com/invoices\">\n<m:Invoice>'\
    \ + invoiceno + '</m:Invoice>\n</m:GetInvoiceTotal>\n</SOAP-ENV:Body>\n</SOAP-ENV:Envelope>';\n\
    xhr.send(mySOAP);\n```\n\n我们在传递给 XMLHttpRequest 对象的 send() 方法之前，已经在 JavaScript\
    \ 变量中构建了整个 SOAP 封包。\n\n服务器返回的值必须经过解析以恢复 SOAP 响应，然后从 SOAP 消息主体中恢复应用数据。\n\n"
