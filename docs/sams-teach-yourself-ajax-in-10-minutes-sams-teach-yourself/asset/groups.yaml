    Each time we enter the URL of a different RSS feed into the input field and click
    the button, the <div> content is updated to show the items belonging to the new
    RSS feed. This being an Ajax application, there is of course no need to reload
    the whole page.


    # The Server-Side Code


    Because of the security constraints built into the XMLHttpRequest object, we can''t
    fetch an RSS feed directly; we must use a script with a URL on our own server,
    and with this script collect the remote XML file and deliver it to the Ajax application.


    In this case, we do not require that the server-side script ssrps.php should modify
    the XML file but simply route it back to us via the responseXML of the XMLHttpRequest
    object. We say that the script is acting as a proxy because it is retrieving the
    remote resource on behalf of the Ajax application.


    Listing 14.2 the code of the PHP script.


    # Listing 14.2 Server Script for the RSS Headline Reader


    ```

    <?php

    $mysession = curl_init($_GET[''feed'']);

    curl_setopt($mysession, CURLOPT_HEADER, false);

    curl_setopt($mysession, CURLOPT_RETURNTRANSFER, true);

    $out = curl_exec($mysession);

    header(''Content-Type: text/xml'');

    echo $out;

    curl_close($mysession);

    ?>

    ```


    The script uses the cURL PHP library, a set of routines for making Internet file
    transfer easier to program. A full description of cURL would not be appropriate
    here; suffice to say that this short script first receives the URL of the required
    RSS feed by referring to the variable sent by the Ajax application. The two lines
    that call the curl_setopt() function declare, respectively, that we don''t want
    the headers sent with the remote file, but we do want the file contents. The curl_exec()
    function then makes the data transfer.'
