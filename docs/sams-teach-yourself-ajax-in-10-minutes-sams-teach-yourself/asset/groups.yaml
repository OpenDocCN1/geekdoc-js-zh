    \ #ffffff;\nmoz-opacity : 0.6;\nfilter : alpha(Opacity=60);\nborder : 1px solid\
    \ #333333;\n}\n</style>\n<head>\n<body>\n<table width=\"550\">\n<tr>\n<td><h3>Drag\
