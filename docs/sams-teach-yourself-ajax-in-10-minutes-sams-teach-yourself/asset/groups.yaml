    \ list |\n| `<li>...</li>` | List item in bulleted or ordered list |\n\n> Tip\
    \ The World Wide Web Consortium is responsible for administering the definitions\
    \ of HTML, HTTP, XML, and many other web technologies. Its website is at http://www.w3.org/.\n\
    \n## Cascading Style Sheets in Two Minutes\n\nThe preceding approach to styling\
    \ web pages has a few downsides.\n\nFirst, you need to explicitly state the attributes\
    \ of each page element. When you want to change the look of the page, you need\
    \ to go through the source code line by line and change every instance of every\
    \ attribute. This may be okay with a few pages, but as the amount of content increases,\
    \ the pages become more difficult to maintain. Additionally, the attributes applied\
    \ to HTML elements allow only limited scope for how to adjust they are displayed.\n\
    \nWouldn't it be better to make one change to the code and have that change applied\
    \ to all HTML elements of a given type? As I'm sure you've already guessed, you\
    \ can.\n\nTo achieve this goal you use styles. Styles may be embedded within your\
    \ HTML document using `<style>` tags in the head of the document:\n\n```css\n\
    <style type=\"text/css\">\n  ... style definition statements ...\n</style>\n```\n\
    \nAlternatively, they may be linked from an external file, using a link element,\
    \ once again placed in the head section of the document:\n\n```html\n<link rel=\"\
    stylesheet\" href=\"mysylesheet.css\" type=\"text/css\" />\n```\n\n> Tip You can\
    \ even define styles on-the-fly. These are known as inline styles and can be applied\
    \ to individual HTML elements. Taking the body tag of Listing 2.2 as an example:\n\
    `<body bgcolor=\"#cccccc\">`\n\nYou could achieve the same effect using an inline\
    \ style:\n`<body style=\"background-color:#cccccc\">`\n\n## Setting Style Sheet\
    \ Rules\n\nStyle sheets allow you to set styling rules for the various HTML elements.\
    \ A rule has two components: the selector, which identifies which HTML tag the\
    \ rule should affect, and the declaration, which contains your styling rule. The\
    \ following example defines a style for the paragraph element, `<p>`:\n\n```css\n\
    p {color: #333333}\n```\n\nThis example determines that any text enclosed in paragraph\
    \ tags `<p> ... </p>` should be displayed using dark gray text. You may specify\
    \ more than one rule for each tag. Suppose that, in addition to gray text, you\
    \ want all the text in the paragraph element to be displayed in italics:\n\n```css\n\
    p {color: #333333; font-style: italic}\n```\n\nA style sheet can contain as many\
    \ rules as you require.\n\nYou may also apply a declaration to more than one tag\
    \ at once, by separating the tag selectors with commas. The following rule determines\
    \ that all h1, h2, and h3 headings appear in blue text:\n\n```css\nh1, h2, h3\
    \ {color: blue}\n```\n\n## Summary\n\nThis lesson discussed the basics of web\
    \ page layout using Hypertext Markup Language, including the structure of HTML\
    \ documents, examples of HTML page elements, and page styling using both element\
    \ attributes and cascading style sheets.\n\n## LESSON 3\nSending Requests Using\
    \ HTTP\n\nVarious protocols are used for communication over the World Wide Web,\
    \ perhaps the most important being HTTP, the protocol that is also fundamental\
    \ to Ajax applications. This lesson introduces the HTTP protocol and shows how\
    \ it is used to.\n\n## Introducing HTTP\n\nHTTP or Hypertext Transfer Protocol\
    \ is the main protocol of the World Wide Web. When you type an address into your\
    \ browser, the browser uses HTTP to request and receive.\n\n## Why Do I Need To\
    \ Know About This?\n\nIn essence, HTTP defines a set of rules regarding how messages\
    \ are formatted.\n\n## What Is (and Isn’t) Covered in This\n\nThis section examines\
    \ the structure of these, along with a few examples of.\n\n## The HTTP Request\n\
    \nAfter opening a connection to the intended server, the HTTP client permits a\
    \ request in the following format:\n\n- An opening line\n- Optionally, a number\
    \ of header lines\n- A blank line\n- Optionally, a message body\n\nThe opening\
    \ line is generally split into three parts: the name of the method, the path to\
    \ the required server resource, and the HTTP version used. A typical opening line\
    \ might read:\n\n```\nGET /sams/testpage.html HTTP/1.0\n```\n\nIn this line we\
    \ are telling the server that we are sending an HTTP request of type GET (explained\
    \ more fully in the next section), we are sending this using version 1.0, and\
    \ the server resource we require (including its local path) is\n\n```\n/sams/testpage.html\n\
    ```\n\n> Note In this example the server resource we seek is on our own server,\
    \ so we have quoted a relative path. It could be of course on another server,\
    \ in which case the server resource would include the full URL.\n\nHeader lines\
    \ are used to send information about the request, or about the data being sent\
    \ in the message body. One parameter and value pair is sent per line, the parameter\
    \ and value being separated by a colon. Here’s example:\n\n```\nUser-Agent: [name\
    \ of program sending request]\n```\n\nFor instance, Internet Explorer v5.5 offers\
    \ something like the following:\nUser-agent: Mozilla/4.0 (compatible; MSIE 5.5;\
    \ Windows NT 5.0)\n\nA further example of a common header is the Accept: header,\
    \ which states that sort(s) of information will be found acceptable as a response\
    \ from the server:\n\n```\nAccept: text/plain, text/html\n```\n\nBy issuing the\
    \ header in the preceding example, the result is informing the sending application\
    \ can accept either plain text or HTML responses (that is, it is not equipped\
    \ to deal with, say, an audio or video file).\n\n## The HTTP Request and Response\n\
    \nThe HTTP protocol can be likened to a conversation based on series of questions\
    \ and answers, which we refer to respectively as requests and responses.\n\nThe\
    \ contents of are easy to read and understand, being near plain English in their\
    \ syntax.\n\n> Note HTTP request methods include POST, GET, PUT, DELETE, and HEAD.\
    \ By far the most interesting in our pursuit of Ajax are the GET and POST requests.\
    \ The PUT, DELETE, and HEAD requests are not covered here.\n"
