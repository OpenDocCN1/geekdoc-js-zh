    # Why Use AHAH Instead of Ajax?


    There is no doubt that XML is an important technology with diverse and powerful
    capabilities. For complex Ajax applications with sophisticated data structures
    it may well be the best—or perhaps the only—option. However, using XML can sometimes
    complicate the design of an application, including:


    +   - Work involved in the design of custom schemas for XML data.

    - Cross-browser compatibility issues when using JavaScript’s DOM methods.

    - Performance may suffer from having to carry out processor-intensive XML parsing.


    Using AHAH can help you avoid these headaches, while offering a few more advantages
    to:


    +   - Easy rewiring of some preexisting web pages.

    - HTML can be easier to fault-find than XML.

    - Use of CSS to style the returned information, rather than having to use XSLT.


    > XSLT is a transformation language used to convert XML documents into other formats—for
    example, into HTML suitable for a browser to display.


    In the following sections we''ll package our AHAH scripts into a neat external
    JavaScript file that we can call from our applications.


    # Creating a Small Library for AHAH


    The Ajax applications examined in the last couple of lessons, although complete
    and functional, involved embedding a lot of JavaScript code into our pages. As
    you have seen, each application tends to contain similar functions:'
