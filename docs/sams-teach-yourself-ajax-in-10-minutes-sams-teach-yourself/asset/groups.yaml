    \ 元素。虽然我们在这里没有对它们进行说明，但书中会在它们出现时进行描述。\n\n## 文档的 <body>\n\n参考列表 2.1，我们可以清楚地看到，文档的主体部分由我们想要在页面上显示的文本以及帮助我们定义文本外观的标签组成。\n\
    \n要定义某些单词为**粗体**，我们将它们包在 `<b>` 和 `</b>` 标签中。同样，为了将单词转换为*斜体*，我们可以使用 `<i>` 和 `</i>`\
    \ 标签。\n\n标题“My HTML Page”由 `<h1>` 和 `</h1>` 标签包围。这些标签指示包围的内容是一个标题。HTML 允许六级标题，从\
    \ `<h1>`（最显著）到 `<h6>`。你可以使用任何中间值 `<h2>`、`<h3>`、`<h4>` 和 `<h5>`，它们分别对应章节、小节和段落。\n\
    \n到为止讨论的所有标签都是容器——也就是说它们由起始标签和结束标签组成，你可以在它们之间放置要操作的内容。然而，某些元素不是容器，但可以单独使用。例如 `<br\
    \ />` 标签表示换行。另一个例子是 `<hr>`（水平线）。\n\n> **提示**：如果你想在 HTML 的主体部分编写内容但不想让它被浏览器解释并显示在屏幕上，你可以通过写注释来实现：<!--\
    \ this is just a comment -->\n\n## 为 HTML 添加属性\n\n有时需要指定标签应该如何表现。在这种情况下，你添加参数和值对，这些被称为**属性**：\n\
    \n```html\n<body bgcolor=\"cccccc\">\n  ... 页面内容 ...\n</body>\n```\n\n在这个示例中，`<body>`\
