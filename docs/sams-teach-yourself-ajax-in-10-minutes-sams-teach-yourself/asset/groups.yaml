    \    <title>Pushing the Ajax Envelope</title>\n    <author>Z.R. Lawson</author>\n\
    \  </article>\n</articles>\n```\n\n# 获取特定文章\n\n由于这是另一次信息请求，我们再次需要提交一个 HTTP GET\
    \ 请求。我们的 Web 服务可能允许我们向以下地址发送请求：\n\n```\nhttp://somedomain.com/articles/list.php?id=218\n\
    ```\n\n并获得返回：\n\n```xml\n<article>\n  <id>218</id>\n  <title>More Ajax Ideas</title>\n\
    \  <author>S.N. Braithwaite</author>\n</article>\n```\n\n# 上传新文章\n\n在这种情况下，我们需要发布\
    \ POST 请求而非 GET 请求。在与之前概述的假设类似的情况下，服务器可能会为新文章分配 id 值，留给我们来为标题和作者元素编码参数和值对：\n\n\
    ```javascript\nvar articleTitle = 'Another Angle on Ajax';\nvar articleAuthor\
    \ = 'K.B. Schmidt';\nvar url = '/articles/upload.php';\nvar poststring = 'title='+encodeURI(articleTitle)+\n\
    '&author='+encodeURI(articleAuthor);\nhttp.onreadystatechange = callbackFunction();\n\
    http.open('POST', url, true);\nhttp.setRequestHeader('Content-type',\n'application/x-www-form-urlencoded');\n\
    http.setRequestHeader('Content-length', poststring.length);\nhttp.send(poststring);\n\
    ```\n\n# 现实世界中的 REST——Amazon REST API\n\n领先的在线博客 Amazon.com 提供了 REST Web 服务，帮助开发人员将\
    \ Amazon 的浏览和购物功能集成到他们的 Web 应用中。\n\n> 注意：Amazon.com 经常将 REST 协议称为 XML-over-HTTP\
    \ 或 XML/HTTP。\n\n通过首先创建一个包含所需搜索参数（如发布者、排序、作者等）的参数/值对的 URL，并向该 URL 发送 GET 请求，可以引导\
    \ Amazon Web 服务返回一个包含产品详情的 XML 文档。我们可以将其解析为 XML 以创建 DOM 对象在网页中显示，或根据应用程序的需求提供进一步处理的数据。\n\
    \n> 提示：Amazon 要求你获取开发者令牌（token）以便为其 Web 服务开发客户端应用程序。在构建指向 Amazon Web 服务的 REST\
    \ 请求时，将需要此令牌。你还可以获取 Amazon  Associates ID，以便通过在网站上投放 Amazon 服务来盈利。详情请参阅 http://www.amazon.com。\n\
    \n# Web 服务与 REST 协议\n\n让我们在实践中开发一个 REST 请求，以返回书籍列表。可以进行许多类型的搜索，但在本例中，我们请求一份由 Sams\
    \ 出版的书籍列表。\n\n我们开始从基础 URL 构建 GET 请求：\n\n```javascript\n$url = 'http://xml.amazon.com/onca/xml3';\n\
    ```\n\n然后我们需要添加许多参数/值对来完成请求：\n\n```javascript\n$assoc_id = \"XXXXXXXXXXXX\"; //\
    \ 你的 Amazon Associates ID\n$dev_token = \"ZZZZZZZZZZ\"; // 你的开发者令牌\n$manuf = \"\
    Sams\";\n$url = \"http://xml.amazon.com/onca/xml3\";\n$url .= \"?item=$.assoc_id\"\
    ;\n$url .= \"&dev-dev=$.dev_token\";\n$url .= \"&ManufacturerSearch=$manuf\";\n\
    $url .= \"&mode=books\";\n$url .= \"&sort=+salesrank\";\n$url .= \"&offer=All\"\
    ;\n$url .= \"&type=lite\";\n$url .= \"&page=1\";\n$url .= \"&f=xml\";\n```\n\n\
    提交此 URL 后，我们收到一个包含所有匹配书籍详情的 XML 文件。我在这里不再复制整个文件（有 5000 多个标题！），但列表 15.1 显示了 XML\
    \ 文件的片段，包括列表的第一本书。\n\n# 列表 15.1 Amazon Web 服务返回的 XML 示例\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\" ?>\n<ProductInfo xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \n  xsi:noNamespaceSchemaLocation\n    \"http://xml.amazon.com/schemas/3/dev-lite.xsd\"\
    >\n<Request>\n  <Args>\n    <Arg value=\"Mozilla/4.0 (compatible; MSIE 6.0;\n\
    Windows NT 5.1; SV1; .NET CL 1.1.4322)\"\n    name=\"UserAgent\" />\n    <Arg\
    \ />\n    <Arg value=\"0G2GC2CT7MRWB37PRXAS4B\" name=\"RequestID\" />\n  <Arg\
    \ value=\"All\" name=\"offer\" />\n```\n\n显然，我们现在可以以任何方式处理此 XML 文档。例如，第 14 “以\
    \ XML 返回数据”讨论了如何使用 JavaScript 方法选择信息并将其放入 DOM。\n\n# REST 与 Ajax\n\n你已经知道 XMLHttpRequest\
    \ 对象直接处理 HTTP 类型。因此，访问 RESTful 服务变得简单。因为你知道服务暴露的每个资源都有唯一的 URL，并且服务可用的方法是标准的 HTTP\
    \ 方法。\n\n# 总结\n\n本节引入了 Web 服务概念以及 REST 协议的原理。REST 要求所有资源都通过唯一的 URL 访问，并且可以通过 HTTP\
    \ 方法在这些资源上执行所有操作。由于 XMLHttpRequest 对象的方法直接引用 URL 和 HTTP 方法，这使得 RESTful 服务能够与 Ajax\
    \ 应用良好交互。\n\n# 第 16 ：使用 SOAP\n\n在本节中，你将学习使用 SOAP 协议使用 Web 服务。#介绍 SOAP（简单对象访问协议）\n\
    \n在第 15 节“Web 服务与 REST 协议”中，我们讨论了 Web 服务，并特别看到 REST（表述状态传输）协议如何为此类服务提供一致的应用程序接口（API）。\n\
    \nREST 是一个设计用于操作资源导向型服务的良好示例，这类服务提供了一种定位资源的简单机制以及可以操作资源的基础方法。在资源导向型服务中，这些方法通常围绕创建、检索、修改和删除信息展开。\n\
    \n在 REST 的情况下，方法是 HTTP 规范中指定的那些——GET、POST、PUT 和 DELETE。\n\n在某些情况下，我们对 Web 服务可以执行的操作比对它控制的资源更感兴趣。我们可以将此类服务称为操作导向型。在这些情况下，资源本身具有一定的重要性，但关键问题在于服务所执行活动的细节。\n\
    \n设计操作导向型 Web 服务最流行且最广泛的协议是 SOAP，即简单对象访问协议。\n\n"
