    \ 函数提供了一种方便的方法来封装这些方法，从而在 JavaScript 实现细节存在差异的情况下提供跨浏览器解决方案：\n\n```javascript\n\
    return Try.these(function1(),function2(),function3(), ...);\n```\n\n这些函数按顺序处理，当错误条件导致抛出异常时，操作将移动到下一个函数。当任何函数成功完成时，操作停止，此时函数返回\
    \ `true`。\n\n将此函数应用于创建 `XMLHttpRequest` 实例展示了生成代码的简单性：\n\n```javascript\nreturn\
    \ Try.these(\nfunction() {return new ActiveXObject('Msxml12.XMLHTTP')},\nfunction()\
    \ {return new ActiveXObject('Microsoft.XMLHTTP')},\nfunction() {return new XMLHttpRequest()()}\n\
    )\n```\n\n> 注意：你可能希望将此代码段与列表 8.1 进行对比，看看代码复杂度降低了多少，可读性提高了多少。\n\n## 封装 XMLHttpRequest——Ajax\
    \ 对象\n\nprototype.js 定义了一个 Ajax 对象，旨在构建 Ajax 应用时简化你的 JavaScript 代码开发。该对象包含许多类，封装了发送服务器请求、监控进度以及处理返回数据所需的代码。\n\
    \n### Ajax.Request\n\nAjax.Request 处理创建 `HTTPRequest` 对象实例以及发送格式正确请求的细节工作。调用它非常直接：\n\
    \n```javascript\nvar myAjax = new Ajax.Request( url, {method: 'post',\nparameters:\
    \ mydata, onComplete: responsefunction });\n```\n\n在此调用中，`url` 定义了要调用的服务器资源的位置，`method`\
    \ 可以是 `post` 或 `get`，`mydata` 是包含请求的序列化字符串，`responsefunction` 是处理服务器响应的回调函数名称。\n\
    \n> 提示：第二个参数使用通常称为 JSON（JavaScript 对象表示法）的符号构建。该参数由一系列 `parameter:value` 对组成，全部包含在大括号内。参数值本身可以是\
    \ JSON 对象、数组或简单值。\n\nJSON 因其易于构建、易于解析和语言无关性而广受欢迎。你可以在 http://www.json.org 找到更多信息。\n\
    \n`onComplete` 参数是多个选项之一，对应 `XMLHttpRequest.readyState` 属性的可能值，在这种情况下，它是 `readyState`\
    \ 值为 4（完成）。还有其他选项，包括 `asynchronous:false`，表示应进行同步调用。\n\n### Ajax.Updater\n\n在需要返回的数据来更新页面元素的情况下，`Ajax.Updater`\
    \ 类可以简化这项任务。你只需要指定应该更新哪个元素：\n\n```javascript\nvar myAjax = Ajax.Updater(elementID,\
    \ options);\n```\n\n该调用与 `Ajax.Request` 类似，但增加了目标元素的 ID。以下是 `Ajax.Updater` 的代码示例：\n\
    \n```html\n<script>\nfunction updateDIV(mydiv) {\n  var url = 'http://example.com/serverscript.php';\n\
    \  var params = 'param1=value1&param2=value2';\n  var myAjax = new Ajax.Updater(\n\
    \    mydiv,\n    url,\n    {method: 'get', parameters: params}\n  );\n}\n</script>\n\
    <input type=\"button\" value=\"Go\" onclick=\"updateDIV(targetDiv)\">\n<div id=\"\
    targetDiv\"></</div>\n```\n\n### Ajax.PeriodicalUpdater\n\n`Ajax.PeriodicalUpdater`\
    \ 类可以重复创建 `Ajax.Updater` 实例。通过这种方式，你可以让页面元素在经过一定时间后进行更新。这对于股票行情或 RSS 阅读器等应用非常有用，因为它确保了访问者始终看到的是最新的信息。\n\
    \n`Ajax.PeriodicalUpdater` 为 `Ajax.Updater` 选项增加了两个参数：\n\n- 更新之间的延迟时间（秒）。默认为两秒。\n\
    - 如果服务器返回未更改的数据，则后续延迟的倍数。默认值为 1，即保持延迟不变。\n\n这里是调用 `Ajax.PeriodicalUpdater` 的示例：\n\
    \n```javascript\nvar myAjax = new Ajax.PeriodicalUpdater(elementID, url,\n{frequency:\
    \ 3.0, decay: 2.0});\n```\n\n在这里我们选择初始延迟为 3 秒，并在每次服务器返回未更改的数据时增加延迟长度。\n\n## 示例项目——价格阅读器\n\
    \n让我们使用 prototype.js 库构建一个定期更新以显示最新值的阅读器。在本例中，我们将使用服务器端脚本 `rand.php` 来模拟变化的股票价格：\n\
    \n```php\n<?php\nrand((double) microtime( )*1000000);\n$price = 50 + rand(0,5000)/100;\n\
    echo \"$price\";\n?>\n```\n\n该脚本通过调用 `srand()` 函数并传递基于当前时间的参数来初始化 PHP 的随机数程序。然后使用\
    \ `rand(0,5000)` 函数生成一个随机数，通过算术处理产生 50.00 到 100.00 范围内的虚假“股票价格”。\n\n"
