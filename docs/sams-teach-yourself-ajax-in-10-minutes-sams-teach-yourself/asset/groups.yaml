    \ 标签之间。本质上，文档的头部（head）用于存储不会在浏览器窗口中显示的文档信息，而文档的主体（body）则包含了通过浏览器窗口解释并显示给用户的文本。\n\
    \n## 文档的 <head>\n\n从列表 2.1 我们可以看到，我们简单 HTML 文档的头部只包含一行——由 `<title>` 和 `</title>`\
    \ 标签包围的“A Simple HTML Document”文字。\n\n## 使用 HTML 编写网页\n\n请记住，头部部分包含不会在浏览器窗口中播放/显示的信息。因此，它并不是显示在页面文本顶部的标题，你可以再次查看图\
