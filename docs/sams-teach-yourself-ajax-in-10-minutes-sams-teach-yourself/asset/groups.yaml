    \n## 总结\n\n在本书的第四部分的第一节中，我们讨论了强大且优雅的 prototype.js JavaScript 库的使用。\n\n该库提供的函数极大地简化了开发\
    \ Ajax 应用程序时一些棘手的编程任务。\n\n该库对 `XMLHttpRequest` 对象提供了良好的支持，并为 DOM 处理、HTML 表单以及许多与\
    \ Ajax 开发相关的技术提供了节省时间的快捷方法。\n\n## 课程 20\n\n## 使用 Rico\n\n在这一节中，你将学习 Rico，这是一个强大的\
    \ Ajax 和用户界面开发框架。\n\n## 介绍 Rico\n\n在第 19 节“prototype.js 工具包”中，我们查看了 prototype.js，这是一个强大且实用的\
    \ JavaScript 库，简化了 Ajax 开发者面临的许多任务。\n\n在这一节中，我们将查看 Rico，这是一个采用 prototype.js 库的复杂\
    \ Ajax 框架。\n\nRico 是一个开源库，扩展了 prototype.js 的功能，提供了一套丰富的界面开发工具。除了目前讨论的 Ajax 技术外，Rico\
    \ 还提供了全系列工具，如拖放、电影效果等。\n\n> 提示：Rico 是西班牙语中“丰富的”的意思，这对于一个旨在构建丰富界面的工具包来说非常合适！\n\n\
    ## 在应用程序中使用 Rico\n\n要开始使用 Rico 构建具有丰富用户界面的应用程序，你需要在页面的 `<head>...</head>` 部分同时引入\
    \ Rico 和 prototype.js 库。\n\n```html\n<script src=\"scripts/prototype.js\"></script>\n\
    <script src=\"scripts/rico.js\"></script>\n```\n\n## Rico 的 AjaxEngine\n\n引入 `rico.js`\
    \ 会自动创建一个名为 `ajaxEngine` 的 `AjaxEngine` 对象实例，供你使用。`AjaxEngine` 是 Rico 为你的网页添加\
    \ Ajax 能力的机制。\n\n`AjaxEngine` 需要三个步骤来通过 Ajax 更新页面元素：\n\n- 1. 注册请求处理器。注册请求处理器会将唯一名称与通过\
    \ Ajax 调用的特定 URL 关联。\n- 2. 注册响应处理器。Rico 可以处理从返回的 XML 中返回 HTML 数据和 JavaScript 代码。\n\
    - 3. 从页面发起 Ajax 调用。\n\n在响应包含 JavaScript 对象的情况下，你需要：`ajaxEngine.registerAjaxObject('myTransform',\
    \ new myHandler());`\n\n响应处理器的注册取决于我们正在处理哪种类型的响应。对于元素（element）响应，你可以直接调用：`ajaxEngine.registerAjaxElement('showdata');`。\n\
    \n我们首先使用以下代码注册请求处理器：`ajaxEngine.registerRequest('myRequest', 'getData.php');`。\n\
    \n而元素响应仅用于更新页面元素，对象响应（object responses）可以有处理器以以它们任何想要的方式处理响应。\n\n响应的内容始终传递给该对象的\
    \ `update` 方法。这允许构建从简单到复杂的 Rico 应用程序。\n\n## 简单示例\n\n我们可以通过使用 20.1 的简单脚本看到 Rico\
    \ 的运行。该应用程序通过对 Rico 的 `ajaxEngine` 对象的单一调用更新两个 HTML 元素。应用程序的脚本在列表 20.1 中。\n\n\
    ## 列表 20.1 一个简单的 Rico 应用程序\n\n```html\n<!DOCTYPE HTML PUBLIC \"-W3C//DTD HTML\
    \ 4.01\n//Transitional//EN\"\n//http.w3.org/TR/html4/loose.dtd\">\n<html>\n<head>\n\
    <title>Opening Rico</title>\n<script src=\"prototype.js\"></script>\n<script src=\"\
    rico.js\"></script>\n<script type=\"text/javascript\">\nfunction callRICO()\n\
    {\najaxEngine.registerRequest('myRequest', 'ricotest.php');\najaxEngine.registerAjaxElement('display');\n\
    ajaxEngine.registerAjaxElement('heading');\n}\n</script>\n</head>\n<body onload=\"\
    callRICO()\">\n<div id=\"heading\"><h3>Demonstrating Rico</h3></div>\n<input type=\"\
    button\" value=\"Get Server Data\"\n onclick=\"ajaxEngine.sendRequest('myRequest')\"\
    />\n<div id=\"display\"><p>This text should be replaced with\n <<div>>server data\
    \ ...</div></p></div>\n</body>\n</html>\n```\n\n"
