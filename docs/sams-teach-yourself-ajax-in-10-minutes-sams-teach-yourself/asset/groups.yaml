    # Server-Side Programming


    Server-side programs, scripts, or languages, refer to programs that run on the
    server computer. Many languages and tools are available for server-side programming,
    including PHP, Java, and ASP (the latter being available only on servers running
    the Microsoft Windows operating system). Sophisticated server setups often also
    include databases of information that can be addressed by server-side scripts.'
  - '[PAGE 19]


    # Anatomy of a Website


    > Note Server-side programming in this book is carried using the popular PHP scripting
    language, which is flexible, is easy to use, and can be run on nearly all servers.
    Ajax, however, can function equally well as any server-side scripting language.


    The purposes of such scripts are various. In general, however, they are all designed
    to preprocess a web page before it is returned to you. By this we mean that some
    or all of the page content will have been modified to suit the context of your
    request—perhaps to display run times to a particular destination and on a specific
    date, or to show only these products from a catalog that match your static hobbies
    and interests.


    In this web server-side scripting allows web pages to be served with rich and
    varied content that would be beyond the scope of any design using static pages—that
    is, pages with fixed content.


    # Web Browsers


    A web browser is a program on a web surfer''s computer that is used to interpret
    and display web pages. The first graphical web browser, Mosaic, eventually developed
    into the famous range of browsers produced by Netscape.


    > Note By graphical web browser we mean one that can display not only the text
    elements of an HTML document but also images and colors. Typically, such browsers
    are a point-and-click interface using a mouse or similar pointing device.


    There also exist text-based web browsers, the best known of which is Lynx (http://lynx.browser.org/),
    which display HTML pages on character-based displays such as terminals, terminal
    emulators, and operating systems with command-line interfaces such as DOS.'
