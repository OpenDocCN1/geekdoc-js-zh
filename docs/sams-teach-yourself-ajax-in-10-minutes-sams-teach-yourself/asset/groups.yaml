    \ within the page's <div> container. Each title and description will be contained\
    \ in its own paragraph element (which we'll also construct for the purpose) and\
    \ be styled by a style sheet to display as we want.\n\n# The Code in Full\n\n\
    Let's jump right in and look at the code, shown in Listing 14.1.\n\n**LISTING\
    \ 14.1** Ajax RSS Headline Reader\n\n```\n<html>\n<head>\n<title>An Ajax RSS Headline\
    \ Reader</title>\n</head>\n<style>\n```\n\n# Returning Data as XML\n\n```\n.title\
