- img_proc: true
  md: '# Lesson 3


    The variable surname (the name attribute given to the Your Surname input field)
    and its value (the data we entered in that field) will also have been sent to
    this destination page, encoded into the body of the POST request and invisible
    to users.


    Now suppose that the form would construct the first line of the code as follows:


    ```

    <form action="http://www.sometargetdomain.com/homepage.htm"

    method="get">

    ```


    On using the form, we would still be taken to the same destination, and the same
    variable and its value would also be transmitted. This time, however, the form
    would construct and send a GET request containing the data from the form. Looking
    at the address bar of the browser, after-submitting the form, we would find that
    it now contains:


    ```

    http://www.example.com/page.htm?surname=Ballard

    ```


    Here we can see how the parameter and its value have been appended to the URL.
    If the form had contained further input fields, the values entered in those fields
    would also have been appended to the URL as parameter=value pairs, with each pair
    separated by an & &. Here''s an example in which we assume that the form has a
    further text input field called firstname:


    ```

    http://www.example.com/page.htm?surname=Ballard&firstname=Phil

    ```


    Some characters, such as spaces and various punctuation marks, are not allowed
    to be transmitted in their original format. The HTML form encodes these characters
    into a form that can be transmitted correctly. An equivalent process decodes these
    values at the receiving page before processing them, making the encoding/decoding
    operation essentially invisible to the user. We can, however, see what this encoding
    looks like by making a GET request and examining the URL constructed in doing
    so.


    Suppose that instead of the surname field in our form we have a fullname field
    that asks for the full name of the user and encodes information into a GET request.
    Then, after submitting the form, we might see the following URL in the browser:


    ```

    http://www.example.com/page.htm?fullname=Phil+Ballard

    ```'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'Here the space in the name has been replaced by the + character; the decoding
    process at the receiving end removes this character and replaces the space.


    > Note In many cases, you may use either the POST or GET method for your form
    submissions and achieve essentially identical results. The difference becomes
    important, however, when you learn how to construct server calls in Ajax applications.


    The XMLHttpRequest object at the heart of all Ajax applications uses HTTP to make
    requests of the server and receive responses. The content of these HTTP requests
    are essentially identical to those generated when an HTML form is submitted.


    # Summary


    This lesson covered some basics of server requests and responses using the HTTP
    protocol, the main communications protocol of the World Wide Web. In particular,
    we discussed how GET and POST requests are constructed, and how they are used
    in HTML forms. Additionally, we saw some examples of responses to these requests
    that we might receive from the server.'
