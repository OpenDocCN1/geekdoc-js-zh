  md: '# # LESSON 14

    # Returning Data as XML


    In this lesson you will learn to use XML data returned from the server as the
    responseXML property of the XMLHttpRequest object.


    # ## Adding the “x” to Ajax


    Lesson 12, “Returning Data as Text,” and Lesson 13, “AHAH—Asynchronous HTML and
    HTTP,” dealt with some length with the true value contained in responseText and
    looked at several techniques for using this information in applications. These
    examples ranged from simple updates of page element text to applications using
    more sophisticated data structures encoded string values that can be stored and
    transferred in the responseText property.


    The X in Ajax does, of course, stand for XML, and there are good reasons for using
    the power of XML in your applications. This is particularly true when you need
    to use highly structured information and/or perform complex transactions between
    different types of representation.


    As discussed previously, the XMLHttpRequest object has a further property called
    responseXML, which can be used to transfer information from the server via XML,
    rather than in text strings.


    You saw in Lesson 11, “Our First Ajax Application,” how JavaScript’s document
    object model (DOM) methods can help you process this XML information. This lesson
    looks at these techniques in a little more detail and hopefully gives you a taste
    of what Ajax applications can achieve when leveraging the power of XML.


    ![](img/2ee8632a2c5a7a595049f49876099e38_152_0.png)'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# # The responseXML Property


    Whereas the responseText of the XMLHttpRequest object contains a string, responseXML
    can be treated as if it were an XML document.


    > > **Caution** You need to make sure that your server presents valid and well-formed
    XML to be returned via the responseXML property. In situations where XML cannot
    be correctly parsed by the XMLHttpRequest object, perhaps due to well-formedness
    errors or problems with unsupported character encoding, the content of the responseXML
    is unpredictable and also likely to be different in different browsers.


    > **Note** Like the responseText property, the value stored in responseXML is
    read-only, so you cannot write directly to this property; to manipulate it you
    must copy the value to another variable:


    ```

    var myobject = http.responseXML;

    ```


    The complete structure and data contained in the XML document can now be made
    available by using JavaScript’s DOM methods. Later in the lesson we will demonstrate
    this with another working Ajax application, but let''s revisit the JavaScript
    DOM methods and introduce a few new ones.


    # # More JavaScript DOM Methods


    You met some of the JavaScript DOM methods, such as getElementById and getElementsByTagName,
    in previous lessons. In those cases, we were mostly concerned with reading the
    values of the nodes to write those values into HTML elements.'
  merge: -1
