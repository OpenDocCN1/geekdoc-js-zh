  md: '# Lesson 20


    # Using Rico


    In this lesson you will learn the basics of Rico, a powerful Ajax and user interface
    development framework.


    # Introducing Rico


    In Lesson 19, “The prototype.js Toolkit,” we looked at prototype.js, a powerful
    and useful JavaScript library that simplifies many of the tasks facing the Ajax
    developer.


    In this lesson we''ll take a look at Rico, a sophisticated Ajax framework employing
    the prototype.js library.


    Rico is an open source library that extends the capabilities of prototype.js to
    provide a rich set of interface development tools. In addition to the Ajax techniques
    discussed so far, Rico offers a whole range of tools such as drag-and-drop, cinematic
    effects, and more.


    > Tip Rico is the Spanish word for rich, which seems appropriate for a toolkit
    designed for building rich interfaces!


    # Using Rico in Your Applications


    To start using Rico to build applications with rich user interfaces, you need
    to include both Rico and prototype.js libraries in the <head>...</head> section
    of your web pages.


    ```

    <script src="scripts/prototype.js"></script>

    <script src="scripts/rico.js"></script>

    ```'
