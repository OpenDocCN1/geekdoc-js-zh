  md: 'There is no rule saying that the value contained in such a string must be legible;
    in fact, the value can contain complete gibberish provided that the string contains
    only characters that JavaScript accepts in a string variable.


    This fact allows a degree of flexibility in what sorts of information you can
    transfer using this property.


