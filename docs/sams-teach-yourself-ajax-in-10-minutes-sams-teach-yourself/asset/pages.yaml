- img_proc: true
  md: 'field1=value1&field2=value2&field3=value3...


    Form.disable(''thisform'') and Form.enable(''thisform'') each do exactly what
    it says on the tin.


    # The Try.these() Function


    Previous lessons discussed the use of exceptions to enable you to catch runtime
    errors and deal with them cleanly. The Try.these() function provides a convenient
    way to encapsulate these methods to provide a cross-browser solution where JavaScript
    implementation details differ:


    ```

    return Try.these(function1(),function2(),function3(), ...);

    ```


    The functions are processed in sequence, operation moving to the next function
    when an error condition causes an exception to be thrown. Operation stops when
    any of the functions completes successfully, at which point the function returns
    true.


    Applying this function to the creation of an XMLHttpRequest instance shows the
    simplicity of the resulting code:


    ```

    return Try.these(

    function() {return new ActiveXObject(''Msxml12.XMLHTTP'')},

    function() {return new ActiveXObject(''Microsoft.XMLHTTP'')},

    function() {return new XMLHttpRequest()()}

    )

    ```


    > Note You may want to compare this code snippet with Listing 8.1 to see how much
    code complexity has been reduced and readability improved.


    # Wrapping XMLHttpRequest—the Ajax Object


    prototype.js defines an Ajax object designed to simplify the development of your
    JavaScript code when building Ajax applications. This object has a number of classes
    that encapsulate the code you need to send server requests, monitor their progress,
    and deal with the returned data.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Ajax.Request


    Ajax.Request deals with the details of creating an instance of the

    HTTPRequest object and sending a correctly formatted request. Calling

    it is straightforward


    ```

    var myAjax = new Ajax.Request( url, {method: ''post'',

    parameters: mydata, onComplete: responsefunction });

    ```


    In this call, url defines the location of the server resource to be called,

    method may be either post or get, mydata is a serialized string containing

    t request parameters, and responsefunction is the name of the callback

    function that handles the server response.


    > Tip The second argument is constructed using a

    notation often called JSON (JavaScript Object

    Notation). The argument is built up from a series of

    parameter:value pairs, the whole contained within

    braces. The parameter values themselves may be JSON

    objects, arrays, or simple values.


    JSON is popular as a data interchange protocol due to\its ease of construction,
    ease of parsing, and language

    independence. You can find out more about it at

    http://www.json.org.


    The onComplete parameter is one of several options corresponding to the

    possible values of the XMLHttpRequest readyState properties, in this case

    areadyState value of 4 (Complete). You might instead specify that the

    callback function should execute during the prior phases Loading, Loaded,

    or Interactive, by using the associated parameters onLoad, onLoaded,

    or onInteractive.


    There are several other optional parameters, including

    asynchronous:false


    to indicate that a server call should be made synchronously. The default

    value for the asynchronous option is true.'
  merge: -1
  pgno: 207
- img_proc: true
  md: "# Ajax.Updater\n\nOn occasions when you require the returned data to update\
    \ a page element, the Ajax.Updater class can simplify the task. All you need to\
    \ do is to specify which element should be updated:\n\n```\nvar myAjax = new Ajax.Updater(elementID,\
    \ url, options);\n```\n\nThe call is somewhat similar to that for Ajax.Request\
    \ but with the addition of the target element's ID as the first argument. The\
    \ following is a code example of Ajax.Updater:\n\n```\n<script>\nfunction updateDIV(mydiv)\
    \ {\n  var url = 'http://example.com/serverscript.php';\n  var params = 'param1=value1&param2=value2';\n\
    \  var myAjax = new Ajax.Updater(\n    mydiv,\n    url,\n    {method: 'get', parameters:\
    \ params}\n  );\n}\n</script>\n<input type=\"button\" value=\"Go\" onclick=\"\
    updateDIV(targetDiv)\"><div id=\"targetDiv\"></div>\n```\n\nOnce again, several\
    \ additional options may be used when making the call. A noteworthy one is the\
    \ addition of\nevalscripts:true\n\nto the options list. With this option added,\
    \ any JavaScript code returned by the server will be evaluated.\n\n# Ajax.PeriodicalUpdater\n\
    \nThe Ajax.PeriodicalUpdater class can be used to repeatedly create an Ajax.Updater\
    \ instance. In this way you can have a page element updated after a certain time\
    \ interval has elapsed. This can be useful for such"
  merge: -1
  pgno: 208
- img_proc: true
  md: '# The prototype.js Toolkit 199


    applications as a stock market ticker or an RSS reader because it ensures that
    the visitor is always viewing reasonably up-to-date information.


    Ajax.PeriodicalUpdater adds two further parameters to the Ajax.Updater options:


    +   - The delay in seconds between successive updates. Default is two seconds.

    - The multiplier by which successive delays are increased if the server should
    return unchanged data. Default value is 1, which leaves the delay constant.


    Here''s an example call to Ajax.PeriodicalUpdater:


    ```

    var myAjax = new Ajax.PeriodicalUpdater(elementID, url,

    ->{frequency: 3.0, decay: 2.0});

    ```


    Here we elected to set the initial delay to 3 seconds and have this delay length
    in each time unchanged data is returned by the server.


    # Example Project—Stock Price Reader


    Let''s use the prototype.js library to build a simple reader that updates periodically
    to show the latest value returned from the server. In this example, we''ll use
    a server-side script rand.php to simulate a changing stock price:


    ```

    <?php

    rand((double) microtime( )*1000000);

    $price = 50 + rand(0,5000)/100;

    echo "$price";

    ?>

    ```


    This script initializes PHP''s random number routine by calling the srand() function
    and passing it an argument derived from the current time. The rand(0,5000) function
    is then used to generate a random number that is manipulated arithmetically to
    produce phony “stock prices” in the range 50.00 to 100.00.'
  merge: -1
