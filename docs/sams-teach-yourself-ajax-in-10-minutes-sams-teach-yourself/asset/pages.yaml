  md: '# Sending Requests Using HTTP


    ![](img/2ee8632a2c5a7a595049f49876099e38_43_0.png)


    **FIGURE 3.1** A simple HTML form.


    Let''s take a look at the code, line by line. First, we begin the form by using
    the <form> tag, and in this example we give the tag two attributes. The action
    attribute determines the URL to which the submitted form will be sent. This may
    be to another page on the same server and described by a relative path, or to
    a remote domain, as the code behind the form in Figure 3.1.


    Next we find the attribute method, which determines whether we want the data to
    be submitted with a GET or a POST request.


    Now suppose that we completed the form by entering the value Ballard into the
    surname field. On submitting the form by clicking the Send button, we are taken
    to http://www.sometargetdomain.com/somepage.htm, where the submitted data will
    be processed—perhaps adding the surname to a database, for example.'
