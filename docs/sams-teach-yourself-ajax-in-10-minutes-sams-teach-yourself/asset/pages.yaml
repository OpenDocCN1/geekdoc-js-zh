  md: '# Variables


    The concept of a variable might already be familiar to you if you''ve ever done
    any algebra, or programmed in just about any computer language. A variable is
    a piece of data given a name by which you can conveniently refer to it. In JavaScript,
    you declare variables with the keyword var:


    ```

    var speed = 63;

    ```


    The preceding line of code declares the variable speed and by using the assignment
    operator = assigns it a value of 63.


    We may now use this variable in other statements:


    ```

    var speedlimit = 55;

    var speed = 63;

    var excess_speed = speed - speedlimit;

    ```


    Variables need not be numeric; the statement


    ```

    var lastname = ''Smith'';

    ```


    assigns a string to the variable lastname.

    Both numeric and string variables may be manipulated within JavaScript statements.
    Consider the following code:


    ```

    var firstname = ''Susan'';

    var lastname = ''Smith'';

    document.writeln(''Hello, '' + firstname + '' '' + lastname);

    ```


    This code would write Hello, Susan Smith into our document.


    # Objects


    You met the concept of an object earlier in the lesson and saw how objects have
    both properties that describe them and methods that perform actions on them.


    Objects in JavaScript have a hierarchical relationship. References begin with
    the highest-level object, with subsequent levels appended separated by a period:


    ```

    document.image1.src

    ```'
