  md: '# LESSON 15

    Web Services and the REST Protocol


    In this lesson you will learn the basics of web services and how to implement
    them using the REST (Representational State Transfer) protocol.


    # Introduction to Web Services


    So far you have seen several example applications in which we have called server-side
    scripts to carry out tasks. In each case we devised data structures to transfer
    the information and written routines to handle data both to and from the server.


    Suppose, though, that you wanted to make your server-side programs more generally
    available. Perhaps you can imagine that several different web applications might
    interface with such scripts for their own purposes. As well as browsers requesting
    pages directly, perhaps other applications (for example Ajax applications operating
    via XMLHttpRequest calls) might also make data requests and expect to receive,
    data that they can understand and manipulate.


    In such cases it would be beneficial to have some form of standardization in the
    interfaces that your program makes available. This principle provides the basis
    of what have come to be known as web services.


    As an example, suppose that your server application produces XML-formatted forecast
    data in response to a request containing geographical information.


    The nature of this type of service makes it broadly applicable; such an application
    might have a wide variety of “clients” ranging from simple'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'web pages that present new weather forecasts in their local area to complex
    aviation or travel planning applications that require the data for more demanding
    uses.


    This type of service is just one small example of what a web service might be
    capable of doing. Thousands of web services are active on the Internet, providing
    a mind-boggling array of facilities including user authentication, payment processing,
    content syndication, messaging, and a host of others.


    In general, a web service makes available an application programming interface
    (API), which allows client applications to build interfaces to the service. Although
    any Internet protocol might be used to create web services, XML and HTTP are popular
    options.


    A number of protocols and techniques have emerged that help you to create and
    utilize web services. This lesson looks at perhaps the simplest of those, called
    REST (Representational State Transfer), and Lesson 16, “Web Services Using SOAP,”
    discusses another protocol, this time called SOAP (the Simple Object Access Protocol).
    Each lesson highlights how they may be useful in Ajax applications.


    # REST—Representational State Transfer


    REST is centered on two main principles for generalized network design:


    +   - Resources are represented by URLs—A resource can be thought of as a “noun”
    and refers to some entity we want to deal with in the API of a web service; this
    could be a document, a person, a meeting, a location, and so on. Each resource
    in a REST application has a unique URL.


    +   - Operations are carried out via standard HTTP methods—HTTP methods as GET,
    POST, PUT, and DELETE are used to carry out operations on resources. In this way
    we can consider such operations as “verbs” acting on resources.'
  merge: -1
  pgno: 168
- img_proc: true
  md: "# A Hypothetical REST Example\n\nTo understand how and why we might apply these\
    \ ideas, let's look at a hypothetical example.\n\nSuppose that we have a service\
    \ that allows writers to submit, edit, and read articles. Applying so-called RESTful\
    \ principles to the design of this application, the following occurs:\n\n+   -\
    \ Each submitted article has a unique URL, for example:\n  `http://somedomain.com/articles/173`\n\
    \n+   - We only require that the URL be unique for each article; for instance\n\
    `http://somedomain.com/articles/list.php?id=173`\n\n> Although REST requires that\
    \ URLs are unique, it does not follow that each resource must have a corresponding\
    \ physical page. In many cases the resource is generated by the web service at\
    \ the time of the request—for example, by reference to a database.\n\n+   - To\
    \ retrieve an article to read or edit, our client application would simply use\
    \ an HTTP GET request to the URL of the article in question.\n\n+   - To upload\
    \ a new article, a POST request would be used, containing information about the\
    \ article. The server would respond with the URL of the newly uploaded article.\n\
    \n+   - To update an edited article, a PUT request would be used, containing the\
    \ revised content.\n\n+   - HTTP DELETE would be employed to delete a particular\
    \ article."
  merge: -1
  pgno: 169
- img_proc: true
  md: 'In this way, the web service is using an interface familiar to anyone who has
    used the World Wide Web. We do not need to devise a library of API methods for
    sending or retrieving information; we already have them in the form of the standard
    HTTP methods.


    > Note The World Wide Web itself is a REST application.


    # Query Information Using GET


    An important issue concerning the use of the HTTP GET request in a RESTful application
    is that it should never change the server state. To put it another way: We only
    GET requests to ask for information from the server, never to add or alter information
    already there.


    POST, PUT, and DELETE calls can all change the server status in some way.


    # Stateless Operation


    All server exchanges in a RESTful application should be stateless. By stateless
    we mean that the call itself must contain all the information required by the
    server to carry out the required task, rather than depending on some state or
    context currently present on the server. We cannot, for example, require the server
    to refer to information sent in previous requests.


    # Using REST in Practice


    Let''s expand on the example quoted earlier involving our articles web service.


    # Reading a List of Available Articles


    The list of available articles is a resource. Because the web service conforms
    to REST principles, we expect the service to provide a URL by which we can access
    this resource, for instance:


    ```

    http://somdomain.com/articles/list.php

    ```'
