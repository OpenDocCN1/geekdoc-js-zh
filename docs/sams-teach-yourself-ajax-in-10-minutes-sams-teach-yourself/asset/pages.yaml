    </SOAP-ENV:Envelope>

    ```


    # Using Ajax and SOAP


    To use SOAP with Ajax, you need to perform a number of separate steps:


    +   1. Create the SOAP envelope.


    +   2. Serialize the application-specific information into XML.'
