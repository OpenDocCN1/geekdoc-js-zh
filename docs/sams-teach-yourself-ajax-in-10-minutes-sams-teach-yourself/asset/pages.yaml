  md: '# Lesson 9


    Next, we need to tell our XMLHttpRequest object myRequest what it should do with
    the “progress reports” it will receive from the server. The XMLHttpRequest object
    has a property onreadystatechange that contains information about what function
    should be called whenever the server status changes, and in the next line


    ```

    myRequest.onreadystatechange = responseAjax;

    ```


    we assign the function responseAjax() to do this job. We will write this function
    later in the lesson.


    # Dealing with the Browser Cache


    All browsers maintain a so-called cache of visited web pages, a local record of
    page contents stored on the hard disk of the browser''s computer. When you request
    a particular web page, the browser first tries to load the page from its cache,
    rather than submitting a new HTTP request.


    > Note This appears to be more of a problem with IE than with the non-Microsoft
    browsers. Only GET requests are affected; POST requests are not cached.


    Although this can sometimes be advantageous in terms of page load times, it creates
    a difficulty when trying to write Ajax applications. Ajax is all about talking
    to the server, not reloading information from cache; so when you make an asynchronous
    request to the server, a new HTTP request must be generated every time.


    It is possible to add HTTP headers to the data returned by server-side routes,
