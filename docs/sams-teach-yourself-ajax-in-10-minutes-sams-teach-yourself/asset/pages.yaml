  md: '# LESSON 5

    Server-Side Programming in PHP


    Ajax applications can work with virtually any server-side language, requiring
    only that the server should return correctly formatted responses to its HTTP requests.
    This lesson introduces PHP, a popular open source scripting language used on a
    huge number of web servers throughout the world.


    # Introducing PHP


    Like JavaScript, PHP is composed of commands that can be embedded within the HTML
    code of your pages. PHP however is a server-side programming language—that is,
    it works hand-in-hand with your web server to process the source code of a page
    before that page is sent to the browser.


    # Why Do I Need To Know?


    As you are already aware, Ajax applications make calls to the web server and subsequently
    use the returned information in the page currently being viewed. You need a way
    to run programs on the server to process the Ajax request and return the required
    data.


    Ajax can work with various server-side technologies including PHP, ASP, Java,
    and others. This book uses PHP, arguably the most popular and easy to use of the
    available server-side languages.


    This lesson provides an introduction to PHP for those who have never encountered
    it and a refresher of the basics for any who have.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# What Is (and Isn’t) Covered in This Lesson


    As with every lesson in this part of the book, it is neither feasible appropriate
    to give an exhaustive course on every aspect of the subject.


    This lesson covers the basics of PHP programming with some practical examples,
    concentrating mainly on those aspects of PHP most relevant to our explorations
    of Ajax.


    > Tip The PHP website at http://uk.php.net/ is an invaluable source of information,
    downloads, and documentation relating to PHP.


    > Tip For a much more complete course on PHP, try Sams Teach Yourself PHP in 24
    Hours by Matt Zandstra.


    # Embedding PHP in HTML Pages


    PHP statements are embedded into HTML documents by surrounding the PHP statements
    with <?php and ?> tags. Anything between such tags is evaluated by the web server
    and replaced with appropriate HTML code, prior to the page being served to the
    browser.


    You can have many sets of <?php and ?> tags in your page as you want.


    > Tip Web servers normally recognize the file extension which files contain PHP
    code and process them accordingly. The most used file extension for PHP files
    is .php, but you may also see .php3, .php4, .shtml, and various others. To make
    your code portable to many web server environments as possible, it’s best to stick
    with .php.'
