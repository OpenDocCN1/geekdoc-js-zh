- img_proc: true
  md: '# Images


    Images can be inserted in our page by means of the <img /> tag. In this case we
    specify the source file of the image as a parameter by using the src attribute.
    Other aspects of the image display that we can alter this way include the borders,
    width, and height of the image:


    ```

    <img src="myimage.jpg" border="2" width="250" height="175" />

    ```


    Border width, image width, and image height are in numbers of pixels (the “dots”)
    formed by individual picture elements on the screen.


    > A further attribute for images is alt, which is an abbreviation of alternative
    text. This specifies a short description of the image that will be offered to
    users whose browsers cannot, or are configured not to display images. Alternative
    text can also be important in making your website accessible to those with visual
    impairment and other disabilities:

    <img src="myimage.jpg" alt="Description of Image" />


    # Tables


    Often you want to display information in tabular format, and HTML has a set of
    elements designed specifically for this purpose:


    ```

    <table>

    <tr><th>Column Header 1</th><th>Column Header 2</th></tr>

    <tr><td>Data Cell 1</td><td>Data Cell 2</td></tr>

    <tr><td>Data Cell 3</td><td>Data Cell 4</td></tr>

    </table>

    ```


    The <table> and </table> tags contain a nested hierarchy of other tags, including
    <tr> and </tr>, which define individual table rows; <th> and </th>, which indicate
    cells in the table header; and <td> and </td>, which contain individual cells
    of data table.


    Look ahead to Figure 2.3 to see an example of how a table looks displayed in a
    browser window.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Hyperlinks


    Hypertext links (hyperlinks) are fundamental to the operation of HTML. By clicking
    on a hyperlink, you can navigate to a new location, be that to another point on
    the current page or to some point on a different page on another website entirely.


    Links are contained within an <a>, or anchor tag, a container that encloses the
    text that will become the link. The destination of the link is passed to this
    tag as a parameter href:


    Here is <a href="newpage.html">my hyperlink</a>


    Clicking on the my hyperlink in the above example results in the browser requesting
    the webpage.html.


    > Tip A hyperlink can contain images as well as, or instead of, text. Look at
    this example:

    <a href="newpage.html"><img src="picfile.gif"></a>


    Here, a user can click on the picfile.gif to navigate to webpage.html.


    # A More Advanced HTML Page


    Let''s revisit our testpage.html and add some extra elements. Listing 2.2 shows
    seville.html, developed from our original HTML page but different content in the
    <body> section of the document. Figure 2.3 shows how the page looks when displayed,
    this time in Mozilla Firefox.


    Now we have applied a background tint to the body area of the document. The content
    of the body area has been centered on the page, and that content now includes
    an image (which we''ve given a two-pixel-wide border), a heading and a subheading,
    a simple table, and some text.


    # Listing 2.2 seville.html


    ```

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">

    ```'
  merge: -1
  pgno: 31
