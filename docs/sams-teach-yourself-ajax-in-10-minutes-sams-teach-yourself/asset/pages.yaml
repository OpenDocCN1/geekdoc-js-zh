  md: '# LESSON 2

    Writing Web Pages in HTML


    In this lesson we introduce HTML, the markup language behind virtually every page
    of the World Wide Web. A sound knowledge of HTML provides an excellent foundation
    for the Ajax applications discussed in later lessons.


    # Introducing HTML


    It wouldn’t be appropriate to try to give an exhaustive account of HTML (Hypertext
    Markup Language)—or, indeed, any of the other component technologies of Ajax—within
    this book. Instead we’ll review the fundamental principles and give some code
    examples to illustrate them, paying particular attention to the subjects that
    will become relevant when we start to develop Ajax applications.


    > Tip If you want to explore HTML in greater detail, Sams Publishing offers a
    number of titles that will help you, including Sams Teach Yourself HTML 4 in 24
    Hours by Dick Oliver.


    # What Is HTML?


    The World Wide Web is constructed from millions of individual pages, and those
    pages are, in general, written in Hypertext Markup Language, better known as HTML.


    That gives away a lot of information about the nature of HTML. We use it to mark
    up our text documents so that web browsers know how to display them and define
    hypertext links within them to provide navigation within or between them.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Anyone (like me) can remember the old pre-WYSIWYG word processing programs
    will already be familiar with text markup. Most of these old applications required
    that special characters be placed at the beginning and end of sections of text
    that you wanted to be displayed as (for instance) bold, italic, or underlined
    text.


    # What Tools Are Needed to Write HTML?


    Because the elements used in HTML markup employ only keyboard characters, all
    you really need is a good text editor to construct HTML pages. Many are available,
    and most operating systems have at least one such program already installed. If
    you''re using some version of Windows, for example, the built-in Notepad application
    works just fine.


    > Tip Although Notepad is a perfectly serviceable text editor, many so-called
    programmers'' editors are available offering additional functions such as line
    numbering and syntax highlighting. Many of these are under source licences and
    can be downloaded and at no cost. It is well worth considering such an editor,
    especially for larger or more complex programming tasks.


    > Caution Although text editors are ideal for writing program code, the use of
    word processing software can cause problems due to unwanted markup and other symbols
    that such programs often embed in the output code. If you choose to use a word
    processor, make sure that it is capable of saving files as plain ASCII text.


    # Our First HTML Document


    Let''s jump right in and create a simple HTML document. Open Notepad (or whatever
    you''ve chosen to use) and enter the text shown in Listing 2.1. The HTML markup
    elements (often referred to as tags) are the character strings enclosed by < and
    >.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# LISTING 2.1 testpage.html


    ```

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"

    //"http://www.w3.org/TR/html4/loose.dtd">

    <html>

    <head>

    <title>A Simple HTML Document</title>

    </head>

    <body>

    <h1>My HTML Page</h1>

    Welcome to my first page written in HTML.<br />

    This is simply a text document with some HTML markup to show some words in <b>bold</b>
    and some other words in <i>italics</i>.

    <br />

    </body>

    </html>

    ```


    Now save the document somewhere on your computer, giving it the name testpage.html.


    If you now load that page into your favorite browser, such as Internet Explorer
    or Firefox, you should see something like the window displayed in Internet Explorer
    2.1.


    ![](img/2ee8632a2c5a7a595049f49876099e38_25_0.png)


    FIGURE 2.1 Our test document displayed in Internet Explorer.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Elements of an HTML Page


    Let''s look at Listing 2.1 in a little more detail.


    The first element on the page is known as the DOCTYPE element. Its purpose is
    to notify the browser of the “flavor” of HTML used in the document. The DOCTYPE
    element used throughout this book refers to HTML 4.0 Transitional, a fairly forgiving
    version of the HTML specification that allows the use of some earlier markup styles
    and structures in addition to the latest HTML 4.0 specifications.


    The DOCTYPE element must always occur right at the beginning of the HTML document.


    Next, that the remainder of the document is enclosed by the elements <html> at
    the start of the page and </html> at the end. These tags notify the browser that
    what lies between should be interpreted and displayed as an HTML document.


    > Caution Although many modern browsers correctly display HTML without these tags,
    it is bad practice to omit them. Even if the page is shown on your own PC, you
    have no idea what operating system and browser a visitor may be using—he may not
    be so lucky.


    The document within these outer tags is split into two further sections. The first
    is enclosed in <head> and </head> tags, and the second is contained between <body>
    and </body>. Essentially, the document''s head is used to store information about
    the document that is not to be displayed in the browser window, whereas the body
    of the document contains text to be interpreted and displayed to the user via
    the browser window.


    # <head> of the Document


    From Listing 2.1 we can see that the head of our simple HTML document contains
    only one line—the words A Simple HTML Document enclosed in <title> and </title>
    tags.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Writing Web Pages in HTML


    Remember that the head section contains information that is not to be played in
    the browser window. This is not, then, the title displayed at the top of our page
    text, as you can confirm by looking again at Figure 2.1. Neither the document
    title refer to the filename of the document, which in this case is testpage.html.


    In fact, the document title fulfils a number of functions, among them:


    +   * Search engines often use the page title (among other factors) to help them
    decide what a page is about.


    +   * When you bookmark a page, it is generally saved by default as the document
    title.


    +   * Most browsers, when minimized, display the title of the current document
    on their icon or taskbar button.


    It''s important, therefore, to choose a meaningful and descriptive title for each
    page that you create.


    Many other elements are used in the head section of a document, including link,
    meta, and script elements. Although we don''t give an account of them here, they
    are described throughout the book as they occur.


    # The Document <body>


    Referring to Listing 2.1, we can clearly see that the content of the document''s
    body section is made up of the text we want to display on the page, plus some
    tags that help us to define how that text should look.


    To define that certain words should appear in bold type, for example, we enclose
    those words in <b> and </body> tags. Similarly, to convert words into an italic
    typeface, we can use the <i> and </iframe> tags.


    The heading, My HTML Page, is enclosed between <h1> and </h1> tags. These indicate
    that we intend the enclosed text to be a heading. HTML allows for six levels of
    headings, from h1 (the most prominent) to h6. You can use any of the intermediate
    values h2, h3, h4, and h5 to display pages having various levels of subtitles,
    for instance corresponding to chapter, section, and paragraph headings. Anything
    displayed within header tags is displayed on a line by itself.'
  merge: -1
  pgno: 27
- img_proc: true
  md: "All tags discussed so far have been containers—that is, they consist of opening\
    \ and closing tags between which you place the text that you want these tags to\
    \ act upon. Some elements, however, are not containers but can be used alone.\
    \ Listing 2.1 shows one element: the <br /> tag, which signifies a line break.\
    \ Another example is <hr> (a horizontal line).\n\n> > Tip If you want to write\
    \ in the body section of the HTML page but don't want it to be interpreted by\
    \ the browser and therefore displayed on the screen, you may do so by writing\
    \ it as a comment. HTML comments start with the character <-- and end the string\
    \ --> as in this example:\n<!-- this is just a comment and won't be displayed\
    \ in the browser -->\n\n# Adding Attributes to HTML Elements\n\nOccasionally there\
    \ is a need to specify exactly how a markup tag should behave. In such cases you\
    \ can add (usually within the opening tag) parameter and value pairs, known as\
    \ attributes, to change the behavior of the element:\n\n```\n<body bgcolor=\"\
    cccccc\"\n  ... page content goes here ...\n</body>\n```\n\nIn this example, the\
    \ behavior of the <body> tag has been modified by adjusting its BGCOLOR (background\
    \ color) property to a light gray. Figure 2.2 shows the effect this has if applied\
    \ to our file testpage.html:"
  merge: -1
  pgno: 28
- img_proc: true
  md: '![](img/2ee8632a2c5a7a595049f49876099e38_29_0.png)


    **FIGURE 2.2** Our test page with the body color changed to gray.


    > > **Tip** Color values in HTML are coded using a hexadecimal system. Each color
    value is made up from three component values, corresponding to red, green, and
    blue. Each of the color values can range from hex 00 to hex ff (zero to 255 in
    decimal notation). The three hex numbers are concatenated into a string prefixed
    with a hash character #. The color value #000000 therefore corresponds to black,
    and #ffffff to pure white.'
  merge: -1
