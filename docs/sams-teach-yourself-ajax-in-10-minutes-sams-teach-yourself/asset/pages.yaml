  md: "# Cascading Style Sheets in Two Minutes\n\nThe preceding approach to styling\
    \ web pages has a few downsides.\n\nFirst, you need to explicitly state the attributes\
    \ of each page element. When you want to change the look of the page, you need\
    \ to go through the source code line by line and change every instance of every\
    \ attribute. This may be okay with a few pages, but as the amount of content increases,\
    \ the pages become more difficult to maintain. Additionally, the attributes applied\
    \ to HTML elements allow only limited scope for how to adjust they are displayed.\n\
    \nWouldn't it be better to make one change to the code and have that change applied\
    \ to all HTML elements of a given type? As I'm sure you've already guessed, you\
    \ can.\n\nTo achieve this goal you use styles. Styles may be embedded within your\
    \ HTML document using style tags in the head of the document:\n\n```\n<style type=\"\
    text/css\">\n  ... style definition statements ...\n</style>\n```\n\nAlternatively,\
    \ they may be linked from an external file, using a link element, once again placed\
    \ in the head section of the document:\n\n```\n<link rel=\"stylesheet\" href=\"\
    mysylesheet.css\" type=\"text/css\" />\n```\n\n> Tip You can even define styles\
    \ on-the-fly. These are known as inline styles and can be applied to individual\
    \ HTML elements. Taking the body tag of Listing 2.2 as an example:\n<body bgcolor=\"\
    #cccccc\">\n\nYou could achieve the same effect using an inline style:\n<body\
    \ style=\"background-color:#cccccc\">"
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Setting Style Sheet Rules


    Style sheets allow you to set styling rules for the various HTML elements. A rule
    has two components: the selector, which identifies which HTML tag the rule should
    affect, and the declaration, which contains your styling rule. The following example
    defines a style for the paragraph element, <p>:


    ```

    P {color: #333333}

    ```


    This example determines that any text enclosed in paragraph tags <p> ... </p>
    should be displayed using dark gray text. You may specify more than one rule for
    each tag. Suppose that, in addition to gray text, you want all the text in the
    paragraph element to be displayed in italics:


    ```

    P {color: #333333; font-style: italic}

    ```


    A style sheet can contain as many rules as you require.


    You may also apply a declaration to more than one tag at once, by separating the
    tag selectors with commas. The following rule determines that all h1, h2, and
    h3 headings appear in blue text:


    ```

    H1, H2, H3 {color: blue}

    ```


    # Summary


    This lesson discussed the basics of web page layout using Hypertext Markup Language,
    including the structure of HTML documents, examples of HTML page elements, and
    page styling using both element attributes and cascading style sheets.'
  merge: -1
  pgno: 36
