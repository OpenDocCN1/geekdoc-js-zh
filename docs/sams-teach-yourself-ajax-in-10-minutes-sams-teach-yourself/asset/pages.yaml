  md: "# Rico’s AjaxEngine\n\nThe inclusion of rico.js causes an instance called ajaxEngine\
    \ of an AjaxEngine object to be created automatically ready for you to use. The\
    \ AjaxEngine is Rico’s mechanism for adding Ajax capabilities to your web pages.\n\
    \nThe AjaxEngine requires a three-step process to update page elements via Ajax:\n\
    \n+   1. Register the request handler. Registering the request handler associates\
    \ a unique name with a particular URL to be called via Ajax.\n2. Register the\
    \ response handler. Rico can deal with the return of both HTML data and JavaScript\
    \ code within the XML returned from the server. In the former case, the response\
    \ handler identifies a page element that is to be updated using the returned data;\
    \ in the latter case, a JavaScript object that handles the server response.\n\
    3. Make the Ajax call from the page by using an appropriate handler.\n\nWe first\
    \ register our request handler by making a call to the registerRequest() method\
    \ of ajaxEngine: ajaxEngine.registerRequest('getData', 'getData.php');\n\nWe now\
    \ have associated the name getData with a request to the server routine getData.php.\
    \ That server-side routine is required to return a response in well-formed XML.\
    \ The following is an example of a typical response:\n\n```\n<ajax-response>\n\
    \  <response type=\"element\" id=\"showdata\">\n    <div class=\"datadisplay\"\
    >\n      The <b>cat</b> sat on the <b>mat</b>\n    </div>\n  </response>\n</ajax-response>\n\
    ```"
  merge: -1
  pgno: 214
- img_proc: true
  md: "Such responses always have a root element <ajax-response>. The <response> element\
    \ it contains in this example has two attributes, type element and id showdata.\
    \ These signify, respectively, that the response contains HTML, and that this\
    \ HTML is to be used to update the page element id showdata. This element is updated\
    \ via its innerHTML property.\n\n> > **Tip** Rico is capable of updating multiple\
    \ page elements from one request. To achieve this, the <ajax-response> element\
    \ may contain multiple <response> elements.\n\nThe other form of response that\
    \ Rico can return is a JavaScript object. Here’s an example:\n\n```\n<ajax-response>\n\
    <response type=\"object\" id=\"myTransform\">\n  <sentence>The cat sat on the\
    \ mat.</sentence>\n</response>\n</ajax-response>\n```\n\nHere the type by a JavaScript\
    \ object, the identity of which is contained in the id value (here myHandler).\
    \ is dealt with. The content of the response is always passed to the ajaxUpdate\
    \ method of this object.\n\nHow the response handler is registered depends on\
    \ which type of response we are dealing with. For responses of type element, you\
    \ can simply call: ajaxEngine.registerAjaxElement('showdata');\n\nIn the case\
    \ of responses containing a JavaScript object, you will need: ajaxEngine.registerAjaxObject('myTransform',\
    \ new myHandler());\n\nWhereas responses of type element are simply intended for\
    \ the updating of HTML page elements, responses of type object can have handlers\
    \ to process responses in any way they want. This allows Rico applications to\
    \ be built ranging from simple to sophisticated."
  merge: -1
  pgno: 215
- img_proc: true
  md: "# A Simple Example\n\nWe can see Rico in action using the simple script of\
    \ Listing 20.1. This application updates two HTML elements with a single call\
    \ to Rico’s ajaxEngine object. The script for the application is in Listing 20.1.\n\
    \n# Listing 20.1 A Simple Rico Application\n\n```\n<!DOCTYPE HTML PUBLIC \"-W3C//DTD\
    \ HTML 4.0\n// Transitional/EN\"\n<script src=\"http://www.w3.org/TR/html4/loose.dtd\"\
    >\n<html>\n<head>\n<title>Opening Rico</title>\n<script src=\"prototype.js\"></script>\n\
    <script src=\"rico.js\"></script>\n<script type=\"text/javascript\">\nfunction\
    \ callRICO()\n{\najaxEngine.registerRequest('myRequest', 'ricotest.php');\najaxEngine.registerAjaxElement('display');\n\
    ajaxEngine.registerAjaxElement('heading');\n}\n</script>\n</head>\n<body onload=\"\
    callRICO()\">\n<div id=\"heading\"><h3>Demonstrating Rico</h3></div>\n<input type=\"\
    button\" value=\"Get Server Data\"\n onclick=\"ajaxEngine.sendRequest('myRequest')\"\
    />\n<div id=\"display \\ ₼<p>This text should be replaced with\n <div>server data\
    \ ...</p></div>\n</body>\n</html>\n```\n\nYou will see from the code that the\
    \ single function callRICO() is used to register both the single request handler\
    \ myRequest and two response handlers. The response handlers are used to update\
    \ two <div> containers; one of these contains the page’s heading, the other a\
    \ short text message. On making the Rico request, the contents of both are updated,\
    \ leaving the page with a new title and now displaying some server information\
    \ instead of the previous text message. Figure 20.1 shows before and after screenshots."
  merge: -1
