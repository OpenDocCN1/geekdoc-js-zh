  md: "Unfortunately such strategies vary widely in their effectiveness. Different\
    \ browsers have different cache handling strategies and support different header\
    \ declarations, making it difficult to ensure that pages are not cached.\n\nA\
    \ commonly used trick to work around this problem involves the adding of a parameter\
    \ with a random and meaningless value to the request data. In the case of a GET\
    \ request, this necessitates adding a further parameter and value pair to the\
    \ end of the URL.\n\nIf the random part of the URL is different each time, this\
    \ effectively \"fools\" the browser into believing that it is to send the asynchronous\
    \ request to an address not previously visited. This results in a new HTTP request\
    \ being sent on every occasion.\n\nLet's see how to achieve this. In JavaScript,\
    \ you can generate random numbers using the Math.random() method of the native\
    \ Math() object. Listing 9.2 contains a couple of changes to our callAjax() function.\n\
    \n# Listing 9.2 Dealing with the Browser Cache\n\n```\nfunction getXMLHttpRequest()\
    \ {\n  var req = false;\n  try {\n    req = new XMLHttpRequest(); /* e.g. Firefox\
    \ */\n  } catch (err1) {\n    try {\n      req = new ActiveX(\"Msxml2.XMLHTTP\"\
    );\n      /* some versions IE */\n    } catch (err2) {\n      try {\n        req\
    \ = new ActiveX(\"Microsoft.XMLHTTP\");\n        /* some versions IE */\n    \
    \  }\n    }\n  }\\}\n```\n\ncontinues"
