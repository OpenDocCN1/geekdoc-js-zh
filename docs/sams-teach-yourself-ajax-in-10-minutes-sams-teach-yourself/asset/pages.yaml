    # More About JavaScript Objects


    Lesson 7, "Anatomy of an Ajax Application," introduced the building

    blocks of an Ajax application and discussed how these pieces fit together.


    This lesson examines the object at the heart of every Ajax application—

    HTTPRequest object.


    > Note You briefly meet objects in Lesson 4, "Client-

