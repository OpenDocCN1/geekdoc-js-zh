  md: '# Document Prolog


    Other information may be optionally included before the document element, forming
    the document''s prolog. An example is the XML declaration:


    ```

    <?xml version="1.0" ?>

    ```


    > Caution If such a declaration exists, it must be the first thing in the document.
    Not even white space is allowed before it.


    The prolog may also contain, in addition to various comments and processing instructions,
    a Document Type Declaration.


    # Document Type Declaration


    The optional Document Type Declaration (often referred to as a DOCTYPE declaration)
    is a statement of a permitted structure of an XML document. It usually contains
    (or refers to another file that contains) information about the names of the elements
    in the document and the relationships between those elements.


    > Caution Take care not to confuse the Document Type (DOCTYPE) Declaration with
    the Document Type Definition (DTD). The DTD is comprised of both the markup declarations
    contained in the DOCTYPE Declaration and those contained in any external file
    to which the DOCTYPE Declaration refers.


    Let''s look at an example Document Type Declaration for the yacht race document:


    ```

    <!DOCTYPE race SYSTEM race.dtd>

    ```


    This declaration, which would appear in the document before the <race> element,
    specifies that the document element will be called <race> and'
