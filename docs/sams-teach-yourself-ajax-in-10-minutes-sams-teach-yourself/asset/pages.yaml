  md: "# LISTING 21.3 Changing All Page Elements of a Given Type\n\n```\n<?php\nclass\
    \ Updater\n{\n    function change()\n    {\n        $myDivs &= &XOAD_HTML::getElementsByTagName('div');\n\
    \        $myDivs->style['height'] = '60';\n        $myDivs->style['width'] = '350';\n\
    \        $myDivs->style['backgroundColor'] = 'lightgreen';\n        $myDivs->innerHTML\
    \ = 'Size and color changed by XOAD';\n    }\nendine('XOAD_AUTOHANDLE', true);\n\
    require_once('xoad.php');\n?>\n<?php XOAD_Utilities::header('.') ?>\n<script type=\"\
    text/javascript\">\nvar myobj = <?= XOAD_Client::register(new Updater()) ?>;\n\
    </script>\n<style>\ndiv {\nborder:1px solid black;\nheight:80;\nwidth:150\n}\n\
    </style>\n<div>Div 1</div>\n<br />\n<div>Div 2</div>\n<br />\n<div>Div 3</div>\n\
    <a href=\"#server\" onclick=\"myobj.change();\nreturn false;\"&gt;Update All Divs</</a>\n\
    ```\n\nThe three <div> elements in the page are identified by XOAD_HTML::getElementsByTagName()\
    \ and have their styles and sizes changed.\n\nFigure 21.2 shows the program in\
    \ operation."
