  md: '# 106 Lesson 10


    > Caution Make sure that your PHP script does not output anything—even white space
    characters such as spaces and line returns—prior to issuing a header() instruction;
    otherwise, an error will occur.


    The header returned is the parameter and value pair

    Content-Type: text/xml


    which announces to our XMLHTTPRequest object to expect that the following data
    from the server will be formatted as XML.


    The next line is a PHP echo statement that outputs this simple, but complete,
    XML document:


    ```

    <?xml version="1.0" ?>

    <greeting>

    Hello Ajax caller!

    </greeting>

    ```


    > Note In PHP you need to escape any quotes that occur within a quoted string
    to ensure that the meaning of the statement is unambiguous. You do so using a
    backslash character, hence the PHP command

    echo "img src=\"picture.gif\">";

    produces the output:

    <img src="picture.gif">


    When the server call is completed, we now find this XML document loaded into the
    responseXML property of our XMLHttpRequest object.'
