  md: '# # LESSON 1


    # # Anatomy of a Website


    We have a lot of ground to cover in this book, so let''s get to it. We''ll begin
    by reviewing in this lesson what the World Wide Web is and where it came from.
    Afterward we''ll take a look at some of the major components that make it work.


    # ## A Short History of the Web


    In the late 1950s, the U.S. government formed the Advanced Research Projects Agency
    ARPA. This was largely a response to the Russian success in launching the Sputnik
    satellite and employed some of the country''s top scientific intellects in research
    work with U.S. military applications.


    During the 1960s, the agency created a decentralized computer network known as
    ARPANet. This embryonic network initially linked four computers located at the
    University of California at Los Angeles, Stanford Research Institute, the University
    of California at Santa Barbara, and the University of Utah, with more nodes added
    in the early 1970s.


    The network had initially been designed using the then-technology of packet switching
    and was intended as a communication system that would remain functional even if
    some nodes should be destroyed by a nuclear attack.


    Email was implemented in 1972, closely followed by the telnet protocol for logging
    on to remote computers and the File Transfer Protocol (FTP), enabling file transfer
    between computers.


    This developing network was enhanced further in subsequent years with improvements
    to many facets of its protocols and tools. However, it was not until 1989 when
    Tim Berners-Lee and his colleagues at the European


    ![](img/2ee8632a2c5a7a595049f49876099e38_15_0.png)'
