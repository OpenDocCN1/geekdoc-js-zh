  md: '# Talking with the Server 93


    > Tip Lines starting with // are treated as comments by JavaScript. You may use
    lines like these to document your code or add other useful notes, and your browser''s
    JavaScript interpreter will ignore them when executing code instructions.


    First, we need to create an instance of an XMLHttpRequest object and call myRequest.
    You''ll no doubt recognize the code for this Lesson 8.


    Next we''ll look at the function callAjax().


    The first line simply declares a variable and assigns a value to it:


    ```

    var lastname = ''Smith'';

