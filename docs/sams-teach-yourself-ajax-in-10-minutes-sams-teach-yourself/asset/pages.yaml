  md: '# LESSON 6


    # A Brief Introduction to XML


    The “x” of Ajax stands for XML, a powerful markup language that can allow your
    Ajax applications to transfer and process complex, structured information. This
    lesson discusses the basics of creating and using XML documents.


    # Introducing XML


    Anyone who has carried out any HTML markup will already be some-what familiar
    with the nature of XML code. XML (eXtensible Markup Language) has many similarities
    in markup style to HTML.


    Whereas HTML is intended to determine how web pages are displayed, XML has a rather
    more wide-ranging use. XML documents can be used in all manner of data storage
    and data exchange exchanges ranging from document storage and retrieval to roles
    traditionally fulfilled by database programs.


    # Why Do I Need To Know This?


    One of the ways use of XML is for the transfer of structured information between
    applications. In Ajax you can use XML to return information from the server to
    your Ajax application, where it may be parsed and used.


    # What Is (and Isn’t) Covered in This Lesson


    In common with the other lessons in this section of the book, we do not attempt
    to offer a complete and thorough treatise on XML. Rather, this'
  merge: -1
