    # Outputting HTML from PHP


    Several PHP commands can help you write text and HTML code directly into your
    page. Perhaps the simplest is the echo command:


    echo "I wrote this line using PHP";


    The preceding statement simply places "I wrote this line using PHP" into the HTML
    document at precisely the place where the PHP statement occurs.


    Listing 5.1 shows the source code of a PHP file to print Hello World in the window.


    # LISTING 5.1 Printing Hello World in PHP


    ```

    <html>

    <head>

    <title>A Simple PHP Script</title>

    </head>

    <body>

    <?php echo "<h1>Hello World!</h1>"; ?>

    </body>

    </html>

    ```


    Note in this script, the output string also contains some HTML tags, `<h1>` and
    `</h1>`. As the PHP statements are executed by the web server before serving the
    page to us, these tags are written into the document’s HTML along with the “Hello
    World” text and evaluated by our browser with all other HTML markup in the document.
    Figure 5.1 shows the browser displaying “Hello World” page.


    If we ask the browser to show us the source of this page, it displays the following
