  md: '# Lesson 12


    > Tip The JavaScript split() method slices up a string, making each cut wherever
    in the string it locates the character that it has been given as an argument.
    That character need not be a pipe; popular alternatives are commas or slashes.


    We now have a JavaScript array array results containing our data:


    ```

    results[0] = ''Monday''

    results[1] = ''Tuesday''

    etc...

    ```


    Rather than simply displaying the received data, we can now use it in JavaScript
    routines in any way we want.


    > Tip For complex data formats, XML may be a better way to receive and handle
    data from the server. However, it is remarkable how much can be done just by using
    the responseText.


    # Summary


    With little effort, the XMLHttpRequest object''s responseText property can be
    persuaded to do more than simply return some text to display in a web page.


    For all the most complex data formats, it may prove simpler to manipulate responseText
    than to deal with the added complexity of XML.


    In this lesson you saw several examples of this technique, ranging from the simple
    update of text content within a page element, to the manipulation of more complex
    data structures.'
