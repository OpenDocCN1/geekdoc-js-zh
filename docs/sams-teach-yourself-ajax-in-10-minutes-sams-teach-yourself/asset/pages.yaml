    This is the piece of data that our function intends to send to the server, as
    the value of a variable called surname that is required by our server-side script.
    In reality, of course, the value of such data would usually be obtained dynamically
    by handling a page event such as a mouse click or a keyboard entry, but for now
    this will serve as a simple example.


    The server request we intend to make a GET request, so we must construct a suitable
    URL having our parameter and value pairs suitably coded on the end; the next line
    carries this out:


    ```

    var url = "myservercript.php?surname=" + lastname;

    ```


    We dealt briefly with the open() method in Lesson 8. We will use it in the next
    line to prepare our server request:

    myRequest.open("GET", url, true);


    This line specifies that we are preparing a GET request and passes it to the destination
    URL complete with the appended content of the GET request.


    The third parameter, true, indicates that we want our request to be handled asynchronously.
    In this case it could have been omitted because the default value of true is assumed
    in such cases. However, it does no harm to include it for clarity.'
