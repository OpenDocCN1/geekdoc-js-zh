  md: '# Using Rico 209


    Including the rico.js file in your application automatically causes the creation
    of an object called dndMgr, Rico''s Drag and Drop Manager. Using the dndMgr object
    is like using AjaxEngine; this time, though, we need to register Ajax requests
    and responses, draggable items and drop zones (page elements that can receive
    dropped items).


    These tasks are carried out via the registerDraggable and registerDropZone methods:


    ```

    dndMgr.registerDraggable( new Rico.Draggable(''test'',

    ''dragElementID'') );

    dndMgr.registerDropZone(new Rico.Dropzone

    ''(dropElementID'') );

    ```


    These two simple commands declare, respectively, a page element with ID dragElementID
    as draggable, and another element with ID dropElementID as a drop zone. The argument
    ''test'' of the registerDraggable() method defines a type for the draggable item,
    which can be tested and used by subsequent code, if required.


