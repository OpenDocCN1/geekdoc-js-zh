  md: '# Web Services Using SOAP


    The body element of the SOAP message contains the message intended for the final
    recipient.


    The serialized arguments are contained within the SOAP request''s body element.
    The call''s XML element must immediately follow the opening XML tag of the SOAP
    body and must have the same name as the remote method being called.


    The body may also contain a Fault element (but no more than one). This element
    is defined in the SOAP specification and is intended to carry information about
    any errors that may have occurred. If it exists, it must be a child element of
    the body element. The Fault element has various child elements including faultcode,
    faultstring, and detail, which contain specific details of the fault condition.


    # Code Example of a SOAP Request


    Let''s see how a typical SOAP request might look:


    ```

    <xml version="1.0"?>

    <SOAP-Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/" encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">

    <SOAP-ENV:Body>

    <m:GetInvoiceTotal xmlns:m="http://www.somedomain.com/invoices">

    <m:Invoice>77293</m:Invoice>

    </m:GetInvoiceTotal>

    </SOAP-ENV:Envelope>

    ```


    In the preceding example, the m:GetInvoiceTotal and m:Invoice elements are specific
    to the particular, and are not part of SOAP itself. These elements constitute
    the message contained in the SOAP envelope.


    Let''s see what the SOAP response from the web service might look like:


    ```

    <xml version="1.0"?>

    <SOAP-Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/" encodingStyle="http://schemas.xmlsoap.org/soap/encoding/">

    <SOAP-ENV:Body>

    ```'
  merge: -1
