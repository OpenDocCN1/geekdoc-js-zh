  md: 'lesson covers the basics of the language and its application, concentrating
    mainly on those aspects relevant to your work with Ajax.


    > Tip If you want a more in-depth tutorial in XML, see Sams Teach Yourself XML
    in 10 Minutes by Andrew H. Watt.


    # XML Basics


    XML is a markup language that allows data to be stored and transmitted in a structured,
    hierarchical manner. It has similarities in markup style to HTML, but whereas
    HTML has a fixed list of element definitions and is designed primarily to allow
    you to define how a document should be displayed, XML elements may be defined
    within a particular XML document to suit the data being described there.


    In common with HTML, markup elements (normally referred to as tags) enclosed by
    < and > are used to annotate the contents of a text file, describing the information
    it contains.


    > Note The similarities between XML and HTML are not purely accidental. Both are
    based on SGML (Standard Generalized Markup Language), a system for organizing
    the elements of a document. SGML was developed and standardized by the International
    Organization for Standards (ISO).


    Unlike the tags in HTML, though, whose definitions are fixed, XML tags can be
    defined to be anything you want, allowing you to describe virtually any kind of
    data. Consider this example of an XML document:


    ```

    <yacht raceNo=''74''>

    <name>Wanderer</name>

    <skipper>Walter Jeffries</ski>

    <helm>Sally Jacobs</helm>

    </yacht>

    ```'
