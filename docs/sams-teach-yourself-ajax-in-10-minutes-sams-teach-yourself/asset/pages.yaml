    # ## 20.1 Updating multiple page elements with Rico.


    The server routine is a simple PHP script that outputs the required XML data.
    The script uses PHP''s `$SERVER[''SERVER_SIGNATURE'']` global variable. Note that
    the script constructs and returns two <response> elements, each responsible for
    updating a particular element in the HTML page.


