  md: '# Introduction


    Ajax is stirring up high levels of interest in the Internet development community.
    Ajax allows developers to provide visitors to their websites slick, intuitive
    user interfaces somewhat like those of desktop applications instead of using the
    traditional page-based web paradigm.


    Based on well-known and understood technologies such as JavaScript and XML, Ajax
    is easily learned by those familiar with the mainstream web design technologies
    and does not require users to have any browser plugins or other special software.


    # About This Book


    Part of the Sams Publishing Teach Yourself in 10 Minutes series, this book aims
    to teach the basics of building Ajax applications for the Internet. Divided into
    bite-sized lessons, each designed to take no more than about 10 minutes to complete,
    this volume offers


    +   - A review of the technologies on which the World Wide Web is based

    - Basic tutorials/refresers in HTML, JavaScript, PHP, and XML

    - An understanding of the architecture of Ajax applications

    - Example Ajax coding projects


    After completing all the lessons you''ll be equipped to write and understand Ajax
    applications, including all necessary client- and server-side programming.


    # What Is Ajax?


    Ajax stands for Asynchronous JavaScript And XML. Although strictly speaking Ajax
    itself is not a technology, it mixes well-known programming techniques in an uncommon
    way to enable web developers to build'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Sams Teach Yourself AJAX in Ten Minutes


    Internet applications with much more appealing user interfaces than those to which
    we have become accustomed.


    When using popular desktop applications, we expect the results of our work to
    be made available immediately, without fuss, and without having to wait for the
    whole screen to be redrawn by the program. While using a spreadsheet such as Excel,
    for instance, we expect the changes we make in one cell to propagate immediately
    through the neighboring cells while we continue to type, scroll the page, or use
    the mouse.


    Unfortunately, this sort of interaction is seldom available to users of web-based
    applications. More common is the experience of entering data into form fields,
    clicking on a button or link, and then sitting back the page slowly reloads to
    exhibit the results of the request. In addition, we often find that the majority
    of the reloaded page consists of elements that are identical to those of the previous
    page and that therefore been reloaded unnecessarily; background images, logos,
    and menus are frequent offenders.


    Ajax promises us a solution to this problem. By working as an extra layer between
    the user''s browser and the web server, Ajax handles server communications, submitting
    server requests and processing the returned data. The results may then be integrated
    seamlessly into the page being viewed, without page needing to be refreshed or
    a new loaded.


    In Ajax applications, such server requests are not necessarily synchronized with
    user actions such as clicking on buttons or links. A well-written Ajax application
    may already have asked of the server, and the data required by the user—before
    the user even knew wanted it. This is the meaning of the asynchronous part of
    the Ajax acronym.


    The parts of an Ajax application that happen "under the hood" of the user''s browser,
    such as sending server queries and dealing with the returned data, are written
    in JavaScript, and XML is an increasingly popular means of coding and formatting
    information used by Ajax to efficiently transfer data between server and client.


    We''ll look at all these techniques, and how they can be made to work together,
    as we work through the lessons.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Who This Book Is For


    This volume is aimed primarily at web developers seeking to build better interfaces
    for the users of their web applications and programmers from desktop environments
    looking to transfer their applications to the Internet.


    It proves useful to web designers eager to learn how the latest techniques can
    offer new outlets for their creativity. Although the nature of Ajax applications
    means that they require some programming, all the required technologies are explained
    from first principles within the book, so even those work with little or no programming
    experience should be able to follow the lessons without a great deal of difficulty.


    # What Do I Need To Use This Book?


    The main requirement is to have an interest in exploring how people and computers
    work better together. Although some programming experience, especially in JavaScript,
    will certainly be useful it is by no means mandatory because there are introductory
    tutorials in all the required technologies.


    To try out the program code for yourself you need access to a web server and the
    means to upload files to it (for example, via File Transfer Protocol, usually
    called FTP). Make sure that your web host allows you to use PHP scripts on the
    server, though the majority do these days.


    To write and edit program code you need a suitable text editor. Windows Notepad
    does the job perfectly well, though some specialized programmers'' editors offer
    additional facilities such as line numbering and syntax highlighting. The appendix
    contains details of some excellent examples that may be downloaded and used free
    of charge.


    # Conventions Used in This Book


    In addition to the main text of each lesson, you will find a number of boxes labeled
    as Tips, Notes, and Cautions.'
