    #  Real World REST—the Amazon REST API


    Leading online bloggers Amazon.com makes a available of REST web services to help
    developers integrate Amazon browsing and shopping facilities into their web applications.


    > Note Amazon.com often refers to the REST protocol as XML-over-HTTP or XML/HTTP.


    By first creating a URL containing parameter/value pairs for the required search
    parameters (such as publisher, sort order, author, and so on) and submitting a
    GET request to this URL, the Amazon web service can be persuaded to return an
    XML document containing product details. We may then parse that into XML to create
    DOM objects for display in a web page or to provide data for further processing
    as required by our application.


