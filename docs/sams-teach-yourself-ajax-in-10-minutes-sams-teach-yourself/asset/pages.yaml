    # Cinematic Effects


    In addition to Ajax and drag-and-drop tools, Rico also makes available a host
    of user interface gadgets known collectively as **cinematic effects**.


    > Note Rico''s cinematic effects are extensions to the Effect class found in prototype.js.


    These effects include animation of page elements (changing their sizes and/or
    shapes), fading effects (altering the opacity of page elements), applying rounded
    corners to objects, and manipulating object colors.'
