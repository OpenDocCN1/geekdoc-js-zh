  md: '# LESSON 21


    # Using XOAD


    In this lesson you will learn about XOAD, a server-side framework with Ajax support
    written by Stanimir Angeloff.


    # Introducing XOAD


    So far in this part of the book we have looked at the prototype.js and Rico libraries
    and how they can help you to develop Ajax applications. Unlike these client-side
    libraries, which are written in JavaScript, XOAD is a server-side Ajax toolkit
    written in PHP.


    This lesson discusses some of the concepts behind XOAD and the basics of its use.


    > Tip XOAD is an acronym for XMLHttpRequest Object-oriented Application Development.


    All our work so far has concentrated on the use of JavaScript to handle both the
    server request and the returned data in Ajax applications. XOAD is a server-based
    solution written in PHP that takes a slightly different approach.


    XOAD applications make server-based PHP functions available to the client-side
    JavaScript interpreter by passing serialized versions of them as JavaScript objects.


    > Note Under the hood, XOAD employs JSON (JavaScript Object Notation) for communications.
    JSON was described in Lesson 19, "The prototype.js Toolkit.",'
  merge: -1
  pgno: 225
- img_proc: true
  md: "# Downloading and Installing XOAD\n\nXOAD is made up of many PHP and supporting\
    \ scripts and can be down-loaded as an archive file from http://sourceforge.net/projects/xoad.\
    \ To install XOAD successfully, you need access to a web server that supports\
    \ PHP and (to use the more advanced features of XOAD) the MySQL database. Detailed\
    \ instructions for installing XOAD can be found in the downloaded material, and\
    \ there is a public forum at http://forums.xoad.org.\n\n# A Simple XOAD Page\n\
    \nLet's take a look at an example of the simplest XOAD page. Suppose that you\
    \ have a PHP class that you want to use in your XOAD application. This class is\
    \ stored in the PHP file myClass.class.php:\n\n```\n<?php\nclass myCamera {\n\
    \    function strlen($mystring) {\n        return strlen($mystring);\n    }\n\
    \    function xoadGetMeta() {\n        XOAD_Client::mapMethods($this, array('stLength'));\n\
    \        XOAD_Client::publicMethods($this, array('stLength'));\n    }\n}\n?>\n\
    ```\n\nThis simple class has only one function, strlen(), which merely returns\
    \ the length of a string in the form of the function xoadGetMeta(). This information\
    \ tells XOAD which methods from the class are available to be exported to the\
    \ main application. In this case there is one, strlen().\n\n> Caution It is not\
    \ absolutely necessary to include metadata in the class, but it is recommended.\
    \ Without metadata, all methods will be public, and method names will be converted\
    \ to lowercase.\n\nYou now need to start constructing the main application script\
    \ xoad.php."
  merge: -1
  pgno: 226
- img_proc: true
  md: "# Using XOAD 217\n\n> Tip The Ajax applications developed in previous lessons\
    \ were HTML files with file extensions .htm or .html. Because our XOAD application\
    \ contains PHP code, it must have a suitable file extension. Most web server and\
    \ PHP implementations will accept a file extension of .php, and some will allow\
    \ other extensions as .php4 or .html.\n\nListing 21.1 the XOAD application. This\
    \ is a fairly pointless program that simply returns the length of a string, \"\
    My XOAD Application\". Nevertheless, it demonstrates the concept of methods from\
    \ server-side PHP classes made available on the client side as JavaScript objects.\n\
    \n# Listing 21.1 A Simple XOAD Application\n\n```\n<?php\nrequire_once('myClass.class.php');\n\
    require_once('xoad.php');\nXOAD_Server::allowClasses('myClass');\nif (XOAD_Server::runServer())\
    \ {\n    exit;\n}\n?>\n<= XOAD_Utilities::header('.') ?>\n<script type=\"text/javascript\"\
    >\nvar myobj = <= XOAD_Client::register(new Class()) ?>;\nvar mystring = 'My XOAD\
    \ Application';\nmyobj.onLengthError = function(error) {\n    alert(error.message);\n\
    \    return true;\n}\nmyobj.strlen(mystring, function(result) {\n    document.write('String:\
    \ ' + mystring + '<br />Length: ' + result);\n});\n</script>\n```\n\nOn loading\
    \ the preceding document into a browser, the page simply says:\nString: My XOAD\
    \ Application\nLength: 19"
  merge: -1
  pgno: 227
- img_proc: true
  md: "# 218 Lesson 21\n\nI won't go into much detail about how the PHP code works;\
    \ this is after a book about Ajax, not advanced PHP. It's important, though, to\
    \ understand the concepts that underpin the code, so let's step through Listing\
    \ 21.1 and try to understand what's happening:\n\n```\n<?php\nrequire_once('myClass.php');\n\
    require_once('xad.php');\nXOAD_Server::allClasses('myClass');\nif (XOAD_Server::runServer())\
    \ {\n    exit;\n}\n?>\n<?= XOAD_Utilities::header('.') ?>\n```\n\nThe first part\
    \ of the script includes both xad.php and the required file myClass.php, and informs\
    \ XOAD which classes it may access (in this case only).\n\nThe XOAD function runServer()\
    \ checks whether the XOAD request is a client callback, and if it handles it appropriately.\
    \ The header() function is used to register the client headers.\n\nNow's look\
    \ at the remainder of the script:\n\n```\n<script type=\"text/javascript\">\n\
    var myobj = <?= XOAD_Client::register(new myClass()) ?>;\nvar mystring = 'My XOAD\
    \ Application';\nmyobj.stLengthError = function(error) {\n    alert(error.message);\n\
    \    return true;\n}\nmobj.stLength(mystring, function(result) {\n    document.write('String:\
    \ ' + mystring + ' Length: ' + result);\n});\n</script>\n```\n\nSee how the remainder\
    \ of the script is a <script>...</script> element?\nThe line\n\n```\nvar myobj\
    \ = <?= XOAD_Client::register(new myClass()) ?>;\n```\n\nexports the public methods\
    \ declared in myClass.php to a JavaScript object. We now have a JavaScript object\
    \ with a method stLength() that allows us to use the method of the same name from\
    \ the PHP class Class."
  merge: -1
  pgno: 228
- img_proc: true
  md: "# XOAD HTML\n\nXOAD HTML is an extension that allows for the easy updating\
    \ of HTML page elements using XOAD. The following examples show the use of the\
    \ XOAD_HTML::getElementById() and XOAD_HTML::getElementsByTagName() methods, which\
    \ do exactly the same thing as their equivalent JavaScript DOM methods.\n\n# XOAD_HTML::getElementById()\n\
    \nYou will recognize the layout of the code in Listing 21.2 as being similar in\
    \ structure to the basic XOAD program discussed earlier.\n\nRather than include\
    \ an external class file, in this example we have defined a class, Updater, then\
    \ within the application itself. The class contains a single function, change().\n\
    \nThe first line in that function uses XOAD_HTML::getElementById() to identify\
    \ the page element and ID of display. Subsequent program lines proceed to change\
    \ the text and background color of the page element.\n\nThe function change()\
    \ is made available as a method of the JavaScript object myobj and then be called\
    \ by any other JavaScript method:\n\n```\n<a href=\"#server\" onclick=\"myobj.change();\n\
    ➥return false;\">Change It!</a>\n```\n\nFigure 21.2 shows the program's operation.\n\
    \n# Listing 21.2 Application to Use XOAD_HTML::getElementById\n\n```\n<?php\n\
    class Updater {\n    function change() {\n        $mtext = &XOAD_HTML::getElementById('display');\n\
    \        $mtext->style['backgroundColor'] = 'yellow';\n        $mtext->innerHTML\
    \ = 'My background\n    color has changed.';\n    }\n}\ndefine('XOAD_AUTOHAND',\
    \ true);\n```\n\ncontinues"
  merge: -1
