    <m:ShowInvoice xmlns:m=

    "http://www.somedomain.com/invoices">

    <m:InvoiceTotal>3295.00</m:InvoiceTotal>

    </m:ShowInvoiceTotal>

    </SOAP-ENV:Body>

    </SOAP-ENV:Envelope>

    ```


    # Sending the SOAP Request Via HTTP


    A SOAP message may be transmitted via HTTP GET or HTTP POST. If sent via HTTP
    POST, the SOAP message requires at least one HTTP header to be; this defines the
    Content-Type:


    Content-Type: text/xml


    After a successful SOAP exchange, you would expect to receive the SOAP response
    preceded by an appropriate HTTP header:


    ```

    HTTP/1.1 200 OK

    Content-Type: text/xml

    Content-Length: yyy

    <xml version="1.0"?>

    <SOAP-ENV:Envelope xmlns:SOAP-ENV=

    "http://schemas.xmlsoap.org/soap/encoding/" SOAP-

    encodingStyle="http://schemas.xmlsoap.org/soap/encoding/"

