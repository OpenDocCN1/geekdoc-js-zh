- img_proc: true
  md: '# Anatomy of an Ajax Application


    Next let''s identify the individual components of such an Ajax application

    and see how they work together.


    > Note Google has presented other Ajax-enabled applications that you can try,
    including the gmail web mail service and the Google Maps street mapping program.

    See the Google website at http://www.google.com/ for details.


    # The Constituent Parts of Ajax


    Now let''s examine the components of an Ajax application one at a time.


    # The XMLHttpRequest Object


    When you click on a hyperlink or submit an HTML form, you send an

    HTTP request to the server, which responds by serving to you a new or

    revised page. For your web application to work asynchronously, however,

    you must have a means to send HTTP requests to the server without an

    associated request to display a new page.


    You can do so by means of the XMLHttpRequest object. This JavaScript

    object is capable of making a connection to the server and issuing an

    HTTP request without the necessity of an associated page load.


    In following lessons you will see how an instance of such an object can

    be created, and how its properties and methods can be used by JavaScript

    routines included in the web page to establish asynchronous communication-

    with the server.


    > Tip As a security measure, the XMLHttpRequest object can generally only make
    calls to URLs within

    t same domain as the calling page and cannot directly call a remote server.'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'Lesson 8, "The XMLHTTPRequest Object," discusses how to create an instance
    of the XMLHTTPRequest object and reviews the object’properties and methods.


    # Talking with the Server


    In the traditional style of web page, when you issue a server request via a hyperlink
    or a form submission, the server accepts that request, carries out any required
    server-side processing, and subsequently serves to you a new page with content
    appropriate to the action you have undertaken.


    While this processing takes place, the user interface is effectively frozen. You
    are made quite aware of this, when the server has completed its task, by the appearance
    in the browser of the new or revised page.


    With asynchronous server requests, however, such communications occur in the background,
    and the completion of such a request does not necessarily coincide with a screen
    refresh or a new page being loaded. You must therefore make other arrangements
    to find out what progress the server has in dealing with the request.


    The XMLHTTPRequest object possesses a convenient property to report on the progress
    of the server request. You can examine this property using JavaScript routines
    to determine the point at which the server has completed its task and the results
    are available for use.


    Your Ajax armour must therefore include a routine to monitor the status of a request
    and to act accordingly. We’ll look at this in more detail in Lesson 9, “Talking
    with the Server.’


    # What Happens at the Server?


    So far as the server-side is concerned, the communication from the XMLHTTPRequest
    object is just another HTTP request. Ajax applications care little about what
    languages or operating environments exist at the server; provided that the client-side
    Ajax layer receives a timely and correctly formatted HTTP response from the server,
    everything will work just fine.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Anatomy of an Ajax Application


    It is possible to build simple Ajax applications with no server-side script-ing
    at all, simply by having the XMLHttpRequest object call call a static server-resource
    such as an XML or text file.


    Ajax applications may make calls to various other server-side resources such as
    web services. Later in the book we''ll look at some examples of calling web services
    using protocols such as SOAP and REST.


    > Note In this book we''ll be using the popular PHP scripting language for our
    server-side routines, but if you are more comfortable with ASP, JSP, or some other
    server-side language, go right ahead and use it in your Ajax applications.


    # Dealing with the Server Response


    Once notified that an asynchronous request has been successfully com-pleted, you
    may then utilize the information returned by the server.


    Ajax allows for this information to be returned in a number of formats, including
    ASCII text and XML data.


    Depending on the nature of the application, you may then translate, dis-play,
    or otherwise process this information within the current page.


    We''ll look into these issues in Lesson 10, “Using the Returned Data."


    # Other Housekeeping Tasks


    An Ajax application will be required to carry out a number of other duties too.
    Examples include detecting error conditions and handling them appropriately, and
    keeping the user informed about the status of submitted Ajax requests.


    You will see various examples in later lessons.'
  merge: -1
