  md: '# 144 Lesson 14


    This lesson looks at the DOM methods that can be used to actually create elements,
    thereby changing the structure of the page.


    The Document Object Model can be thought of as a treelike structure of nodes.
    As well as reading the values associated with those nodes, you can create and
    modify the nodes themselves, thereby changing the structure and content of your
    document.


    To add new elements to a page, you need to first create the elements and attach
    them to the appropriate point in your DOM tree. Let’s look at a simple example
    using the following HTML document:


    ```

    <html>

    <head>

    <title>Test Document</title>

    </head>

    <body>

    We want to place some text here:<br />

    <div id="displaydiv"></div>

    </body>

    </html>

    ```


    In this example, we want to add the text "Hello World!" to the <div> container
    in the document body. We will put your JavaScript routine into a function that
    we''ll call from the body''s onLoad() event handler.


    First, we will use the JavaScript DOM method createNode() to, well, create a text
    node:


    ```

    var textNode = createNode(''Hello World!'');

    ```


    We now to attach textNode to the DOM tree of the document at the appropriate point.


    You first learned about child nodes in Lesson 4, "Client-Side Coding Using JavaScript":
    hopefully, you recall that nodes in a document are said to have children if they
    contain other document elements. JavaScript has an appendChild() method, which
    allows us to attach our new text node to the DOM tree by making a child node of
    an existing document.


    In this case, we want our text to be inside the <div> container having the id
    displaydiv:'
