    *Output:*


    ![](img/8a6860449d086ad6675add2b749bcc36_180_0.png)


    *Fig - 7\. 36*


    This code works fine in my Firefox browser, which is the latest version of Firefox
    at the


    time of writing. However when I run it in in an older version of Firefox it doesn’t
    work! It’s not


    working because the older version doesn’t support the “**repeat()**” method.


    Now if I want an older browser to support my ES6 code without Webpack, Babel,
    etc. then


    I need to add a Polyfill that allows Firefox to support **repeat()**, most of
    the Polyfills are available on


    https://developer.mozilla.org.


    Now working with Polyfill boiler-plates is not a good idea, they mutate the window
    object


    which is not appropriate; instead what you can do is to approach this two ways:


    1)


    You can use “


    **babel-polyfill**


    ” package


    : -


    All you have to do is either “**import**” or “**require()**” **babel-polyfill**
    library and you are


    good to go.


    1)


    You can use Pollyfill.io library


    : -


    This library comes with a plug-n-play script tag that determines what polyfills
    a


    browser needs and plugs those polyfills to the scripts accordingly. All you have
    to do is


    add their script tag to your HTML file and they will do the rest.


    Now you can also create your own polyfills, that or you can keep your job! Your
    choice...


