    8)


    Now we don’t have a **main.js** file but we have an **index.js** file in which
    we will write


    out ES6 code and then compile it to ES5\. Let’s fill our **index.js** file with
    the following


    ES6 code and save it:


    ![](img/8a6860449d086ad6675add2b749bcc36_178_0.png)


    *Fig - 7\. 32*


    9)


    Now we will execute the following command “**npm run babel**” to get a **main.js**
    file


    which for now will be identical to our **index.js** file.


    10) The reason that nothing happened is because we never configured Babel to do


    anything. Now we can configure Babel with a “**.babelrc**” or we can add the contents


    of “**.babelrc**” inside our **package.json** file in a new property named “**babel**”
    which is


    what I recommend. All we have to do is add a “**babel**” property with a “**presets**”
    sub-


    property to our **package.json** file, like the following example:


    ![](img/8a6860449d086ad6675add2b749bcc36_178_1.png)


    *Fig - 7\. 33*


    This will tell Babel to compile our code using the “es2015” preset which will


    convert ES6 code to ES5.


