    ## Closing Arguments


    Let’s revisit the lessons of this chapter and take a look at what we have learned!
    Following lessons are the rough outline of this chapter.


    - ES6 comes with a feature called “De-structuring” which allows us to extract
    variables from arrays and objects, and significantly cut down code quantity.

    - Members of objects can be extracted as variables with the same variable name
    as the name of the key; it can also be renamed.

    - Using the rest/spread operator with iterators.

    - Swapping values of variables using de-structuring without declaring a third
    **temp** variable.

    - De-structuring can be used to work with functions too.

    - The **for/of** loop is a new feature in ES6, it iterates through an array returning
    the values of each index.

    - Iterables methods like **forEach()**, and **map()** can’t use some keywords
    like loops do.

