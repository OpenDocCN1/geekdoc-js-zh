- md: '

    Following is a list of Terminology paired with brief explanations where needed:


    - *Artificial Neural Networks aka ANNs*

    Artificial neural networks are algorithms inspired by the human and animal brain.
    These programs learn by examples, without being programmed for a particular purpose.


    - *Intelligence vs Artificial Intelligence*

    Intelligence can be defined in many ways, including concepts like Logic and Reasoning,
    Learning & Understanding, Self-awareness, Emotions, Creativity, etc.

    Vaguely speaking Artificial intelligence is Intelligence expressed by something
    Artificial like a Computer, Robot, etc. instead of a Natural organism or system.

    The presence of Intelligence in machines rises many philosophical questions about
    the nature of intelligence, person-hood, rights of humans and machines, etc.


    - *Deep Learning*

    Deep learning is a subdivision of Machine Learning which uses Artificial Neural
    Networks and other methods to create and train algorithms that are capable of
    learning deeper concepts about the provided Data. These ANNs (CNNs mostly) are
    many layers deep.


    - *NLP*

    NLP aka “Natural language processing” is a subdivision of Machine Leaning which
    focuses on training programs to understand human language, including but not limited
    to voice, expression, meaning, context, subtext, etc.


    - *Data Science*

    Data science is a cross bred field that uses ML/AI to understand Data. Data science
    includes stuff like data mining, data visualization, big data, etc.


    - *Statistics*

    Statistics is a branch of Mathematics that involves the collection of data, and
    the usage of Mathematical models to study, understand, organize, analyze, interpret,
    and present data.


    - *Robotics*

    In Robotics we study the nature, design and structure, construction and operation,
    and anything else related to Robots.


    - *Brain-Computer Interface*

    Brain-Computer Interface aka BCI essentially means telepathically controlling
    computer instead of using a keyboard, mouse, voice, etc. These type of computers
    will have a faster interface, will require less energy, and will save us from
    stuff like a sore voice, or carpel tunnel.


    - *RobotOps*

    RobotOps is DevOps for Robotics. Tools like “GORT” are used for RobotOps.


    - *IoT*

    Basically Internet of things aka IoT is the concept of an Internet that connects
    stuff like our Microwaves, Refrigerators, Cellphones, etc. into a gigantic network
    like the Internet we use.


    - *Ubiquitous computing*

    The concept of Ubiquitous Technology (also known as pervasive computing, ambient
    intelligence, etc.) refers to technology that seamlessly integrates with our life
    to the point where we don’t even know it’s technology, or that we are using it.
    Stuff like clothes, books, bed-sheets and pillowcases, buildings, etc. are all
    examples of technology which many will consider natural instead of artificial.
    Ubiquitous computing refers to the usage of computers without users consciously
    realizing that they are using it, for example using a smart refrigerator, etc.


    - *Theano*

    Theano is a Python library and optimizing compiler for Mathematics. At the time
    of writing Theano was a “3 Clause BSD License” aka “New BSD License”.


    - *Keras*

    Keras is a FOSS library for Deep Learning models. It combines the power of Theano
    and TensorFlow enabling us to create and train ANN models.


    - *TensorFlow*

    TensorFlow is a Apache License 2.0 library for Tensor Mathematics and Machine
    Learning. It can be used with Python, JavaScript, NodeJS, Go, C, C++, etc. and
    can be used both with and without GPU acceleration.


    - *Data-sets*

    A Data-set is a collection of Data paired with proper Meta-data. For example Images
    with tags to telling us what the image is about, like a picture of a Dog paired
    with the work "Dog". The Data is usually hard to comprehend by a computer, and
    the Meta-data is in a easy to comprehend form for computers.

    There are Data-sets like MINST which programmers (or should we call them Trainers)
    use to train Neural Networks and ML Models. MINST is a Data-set comprised of Hand-written
    Images of numbers. You can make your own Data-sets and post them on GitHub or
    something…

    Using a Data-set like MINST a Convolutional neural network aka CNN can use each
    pixel''s info from an image as input to a Neuron on the input layer.Hence to process
    a 8px*8px 2bit image 64 neurons will be required in the input layer if no additional
    information is to be paired with it.


    ## AI/ML, Data Science and Technology


    ### Initiatives


    The fields of AI/ML, Data Science, and Technology is always on the bleeding edge
    of its R&D stuff. If you are really interested you may want to follow certain
    companies, people, and projects for the latest stuff. Following are the ones I
    strongly recommend:


    1. **Open AI** (Ilya Sutskever, Sam Altman, Greg Brockman). Used to be non-profit
    but not anymore. Partnered with Microsoft Corp in an investment of US$1 billion.
    Not so Open anymore. About 120 employed, as of 2020. Their objective is “Discovering
    and enacting the path to safe artificial general intelligence”. People like LinkedIn’s
    Reid Hoffman, and Paypal’s Peter Thiel are affiliated to some extent.


    2. **Clearview AI** (Highly controversial and Weaponize-able Facial recognition).
    Users include (but not limited to) American Law enforcement like NYPD, one of
    the largest armed law enforcement agencies, not including state police, auxiliary
    police officers, school safety agents, traffic police, and retired officers. The
    program is used by law enforcement in Australia, Canada, Denmark, Norway, and
    more. **Commercial users** include Security companies, Home Depot, AT&T, Well
    Fargo, AI Center of Advanced Studies (Riyadh, Saudi Arabia), Founders Fund, SoftBank,
    etc. The New York Times described the use of Clearview''s app as "**a secret plaything
    of the rich**".


    3. **Google Brain** (Deep learning, and AI) Research Team. Is involved in AI-based
    encryption, Image enhancement, Google Translate, Robotics, etc.


    4. **Blue Brain Project** (Swiss), Objective is to create a digital brain of a
    rodent and eventually a human by reverse-engineering mammalian brains. Lead by
    Henry Markram, who initially aimed to create a digital neo-cortical column (the
    fundamental unit of a neo-cortex) of mice, the goal was archived my Markram in
    2006. The project has consistently progressed since it’s inception. The project
    is funded primarily by the Swiss government and the Future and Emerging Technologies
    grant. The project uses Neuron software for modeling neurons; written in C, C++,
    and FORTRAN, the primary scripting language is Hoc (Brian Kernighan, Rob Pike,
    also implemented in Plan), Python is also available.


    5. **Project Jupyter** (Objective: To support interactive data science and scientific
    computing across all programming languages.). Nonprofit. Used by Google, Microsoft,
    IBM, NASA, UC Berkeley, etc.


    6. **Humanity+** (non-profit, Nick Bostrom) An international organization which
    advocates the ethical use of emerging technologies to enhance human capacities.


    7. **2045 Initiative** (non-profit, Dmitry Itskov) A network and community of
    researchers in the field of life extension, and Cyborgs.


    8. **Elon Musk** (FRS) (Open AI, Neuralink, etc.), not on the board of Open AI
    anymore, but still a donor and reportedly has significant affiliation. Owns Neuralink.
    Is famous of cutting edge companies including SpaceX, Tesla, Inc. The Boring Company,
    PayPal, SolarCity, etc. And is doing amazing work on Hyperloop, Musk electric
    jet, Sustainable energy, Mars colonization, and more.


    9. **Ray Kurzweil** (Author, Inventor, Futurist, Transhumanist). Received the
    National Medal of Technology and Innovation. Present in the National Inventors
    Hall of Fame. Has 21 honorary doctorates. Kurzweil, Google, NASA Ames Research
    Center created the “Singularity University”.


    10. **Peter Thiel** (Author “*Zero to One*”, Legendary Tech Investor and founder
    of “Founder’s Fund”). Portfolio includes Facebook, Airbnb, Linked-In, Yelp Inc.,
    Spotify, Space X, Stripe.

