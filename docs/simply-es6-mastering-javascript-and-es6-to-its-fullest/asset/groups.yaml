  mdcn: '


    以下是术语列表以及在需要时的简要解释：


    - *人工神经网络（Artificial Neural Networks，简称 ANNs）*

    人工神经网络受人类和动物大脑启发的算法。这些程序通过示例进行学习，而不是为了特定目的而编程。


    - *智能与人工智能（Intelligence vs Artificial Intelligence）*

    智能可以用许多方式定义，包括逻辑与推理、学习与理解、自我意识、情感、创造力等概念。

    广义地说，人工智能是由某种人工客体（如计算机、机器人等）表达的智能，而不是自然生物体或系统。

    机器中智能的存在引发了关于智能本质、人格、人类与机器权利等许多哲学问题。


    - *深度学习（Deep Learning）*

    深度学习是机器学习的一个分支，它利用人工神经网络和其他方法来创建并训练算法，使其能够对提供的数据学习更深层次的概念。这些 ANN（主要是 CNN）具有许多层深度。


    - *NLP（自然语言处理）*

    NLP 又称为“自然语言处理”，是机器学习的一个分支，侧重于训练程序来理解人类语言，包括但不限于语音、表达、意义、语境、潜台词等。


    - *数据科学（Data Science）*

    数据科学是一个交叉领域，使用机器学习/人工智能（ML/AI）来理解数据。数据科学包括数据挖掘、数据可视化、大数据等。


    - *统计学（Statistics）*

    统计学是数学的一个分支，涉及数据的收集以及使用数学模型对数据进行研究、理解、组织、分析、解释和展示。


    - *机器人学（Robotics）*

    在机器人学中，我们研究机器人的本质、设计与结构、构造与操作以及与机器人相关的的一切。


    - *脑机接口（Brain-Computer Interface）*

    脑机接口简称 BCI，本质上是指通过意念控制计算机，而不是使用键盘、鼠标、语音等。这类计算机将具有更高的效率，需要更少的能量，并使我们免受嗓哑或腕管综合症等问题的困。


    - *机器人运营（RobotOps）*

    RobotOps 是机器人领域的 DevOps。像“GORT”之类的工具被用于 RobotOps。


    - *物联网（IoT）*

    基本上，物联网（IoT）是一个互联网概念，将我们的微波炉、冰箱、手机等设备连接到像我们正在使用的互联网一样巨大的网络中。


    - *泛在计算（Ubiquitous computing）*

    泛在技术（也称为无处不在计算、环境智能等）的概念指的是与我们的生活无缝整合的技术，以至于我们甚至不知道它是技术，或者不知道我们正在使用它。像衣服、书籍、床单和枕套、建筑等都是技术的例子，许多人认为这些是自然的而非人造的。泛在计算是指在用户没有意识到自己正在使用的情况下使用计算机，例如使用智能冰箱等。


    - *Theano*

    Theano 是一个用于数学的 Python 库和优化编译器。在编写本文时，Theano 采用的是“三句 BSD 许可证”，即“新 BSD 许可证”。


    - *Keras*

    Keras 是一个用于深度学习模型的开源软件库（FOSS）。它结合了 Theano 和 TensorFlow 的力量，使我们能够创建并训练 ANN 模型。


    - *TensorFlow*

    TensorFlow 是一个基于 Apache License 2.0 的张量数学和机器学习库。它可以与 Python、JavaScript、NodeJS、Go、C、C++
    等配合使用，并可以在使用或不使用 GPU 加速的情况下。


    - *数据集（Data-sets）*

    数据集是带有适当元数据（Meta-data）的数据集合。例如，带有标签的图像可以告诉我们图像的什么，比如一张狗的照片配上“狗”字。数据通常很难被计算机理解，而元数据是以计算机易于理解的形式存在的。

    有像 MNIST 这样的数据集，程序员（或我们应该称他们为训练者）使用它们来训练神经网络和机器学习模型。MNIST 是由手写数字图像组成的数据集。你可以创建自己的数据集并将其发布在
    GitHub 之类的平台上……

    使用像 MNIST 这样的数据集，卷积神经网络（简称 CNN）可以使用图像中每个像素的信息作为输入层某个神经元的输入。因此，为了处理一个 8px*8px 的
    2 位图像，在没有额外信息匹配的情况下，输入层需要 64 个神经元。


    ## AI/ML、数据科学与技术


    ### 计划与动态


    AI/ML、数据科学和技术领域始终处于其研发的最前沿。如果你真的感兴趣，你可能想要关注某些公司、人物和项目以获取最新动态。以下是我强烈推荐的：


    1. **Open AI**（Ilya Sutskever, Sam Altman, Greg Brockman）。曾是非利组织，但现在不再是了。与微软公司合作了
    10 亿美元的投资。不再那么开放。截至 2020 年有 120 名员工。他们的目标是“发现并实现通安全通用人工智能的路径”。像 LinkedIn 的 Reid
    Hoffman 和 Paypal 的 Peter Thiel 等人某种程度上与之相关。


    2. **Clearview AI**（极具争议且可武器化的面部识别）。用户包括（但不限于）美国执法部门，如纽约警察局（NYPD），最大的武装执法机构之一（不包括州警察、辅助警察、学校安全员、交通警察和退休人员）。该程序被澳大利亚、加拿大、丹麦、挪威等地的执法部门使用。**商业用户**包括安全公司、Home
    Depot、AT&T、富国银行、高级研究 AI 中心（沙特阿拉伯利雅得）、Founders Fund、软银行等。《纽约时报》将使用 Clearview 的应用描述为“**富人的秘密玩具**”。


    3. **Google Brain**（深度学习和人工智能研究团队）。涉及基于 AI 的加密、图像增强、谷歌翻译、机器人技术等。


    4. **蓝脑 项目**（瑞士），目标是通过反向工程创建一个啮齿动物的大脑，最终是人类的大脑。由 Henry Markram 领导，他最初在 2006 年目标是创建一个小鼠的新皮层柱（新皮层的基本单位）。该项目自诞生以来一直进展。项目主要由瑞士政府和未来技术基金资助。项目使用
    Neuron 建模；用 C、C++ 和 FORTRAN 编写，主要脚本语言是 Hoc（Brian Kernighan, Rob Pike 实现，基于 Plan），Python
    也可用。


    5. **Project Jupyter**（目标：支持跨编程语言的交互式数据科学和科学计算）。非营利。谷歌、微软、IBM、NASA、伯克利大学等在使用。


    6. **Humanity+**（非营利，Nick Bostrom）倡倡利用新兴技术增强人类能力的国际组织。


    7. **2045 计划**（非营利，Dmitry Itskov）寿命延长和半人领域研究人员的网络和社区。


    8. **Elon Musk**（FRS）（Open AI, Neuralink 等），不再是 Open AI 的董事会成员，但仍是捐赠者并据报道有重大关联。拥有
    Neuralink。以其尖端公司闻名，包括 SpaceX、Tesla, Inc.、The Boring Company、PayPal、SolarCity 等。并在超级回路、马斯克喷气、可持续能源、火星殖民化等方面表现卓越。


    9. **Ray Kurzweil**（作者、发明家、未来主义者、超人类主义）。获得国家技术与创新奖。进入国家发明名人堂。拥有 21 个名誉学位。Kurzweil、谷歌、NASA
    阿姆斯研究中心创立了“奇点大学”。


    10. **Peter Thiel**（《从零到一》作者、传奇科技投资者，“Founder’s Fund”的创始人）。投资组合包括 Facebook、Airbnb、LinkedIn、Yelp
    Inc.、Spotify、Space X、Stripe。


