  - '[PAGE 167]


    **Renaming Imports with import/as:**


    Named imports can be imported with different names than their original export
    names, as


    shown in Fig – 7.10:


    import { myVar  as  name, myFunk  as  greet } from  ''./names'';


    console.log(name, greet);


    *Fig - 7\. 10*


    This imports **myVar** and **myFunk** and rename them “name” and “greet”. This
    functionality


    is very useful and comes built-in with many languages, and has been only recently
    implemented in


    JavaScript, before that we had inefficient workarounds.


    **Setting up webpack**


    Follow the following instructions to setup webpack for ES6 support; at the time
    of writing


    **import** feature was not inherently supported by popular browsers. Also note
    that these instructions


    may not work anymore if webpack has been updated, in that case check the well
    written official


    documentation of webpack.


    Instructions:


    1)


    Create a new directory for your app.


    2)


    Navigate to your app directory with Terminal.


    3)


    Initialize NPM with the following command:


    **npm init**


    4)


    Install development tools webpack & webpack-cli with NPM:


    **npm i webpack webpack-cli –save-dev**


    (**-dev** flag installs modules that are not part of our app, they are just used
    in


    development)


    5)


    In your app directory make 2 new folders named “dist” and “src”.


    a.


    The “dist” directory will hold the final, converted to ES5, Uglified, and


    Minified post webpack bundled files.


    b.


    The “src” directory holds the source code for your files that need to be


    bundled with webpack.


