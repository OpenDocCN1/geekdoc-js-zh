    “Rest parameter” and that is totally fine with me. So as you already know the
    three periods (**…**) represent a rest/spread operator, and once you get the hang
    of it, it will become your go to guy, replacing a ton of other approaches you
    have used in the past.


    Now you already have encountered the following code:


    ```javascript

    2 let arr = ["...0123456789"];

    3 console.log(arr);

    ```

    *Fig - 4.23*


    *Output:*


    ![](img/8a6860449d086ad6675add2b749bcc36_111_0.png)

    *Fig - 4.24*


    And you already know that the rest/spread operator on line #2 **spreads** out
    each character of the string into an array. Let me show you another example of
    this:


    ```javascript

    2 console.log(["a", "b", "c", "d"]);

    3 console.log([...abcd"]);

    ```

    *Fig - 4.25*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_111_1.png)

    *Fig - 4.26*


    See how the code on line #2 and #3 give identical output? Using the rest/spread
    operator to do this is simpler than writing out so many quotation marks. Here
    line #2 reads “log an array with members a, b, c, and d”, in the interim the code
    on line #3 reads “log an array with characters of the string `abcd` **spread**
    out as its members”.


    Now there are more applications of the rest/spread operator, take a look at the
    following code:


    ```javascript

    2 let arr = [1,2,3,4,5];

    3 let arr2 = [6,7,8,9,10];

    4 let numbers = [...arr, ...arr2];

    5 console.log(numbers);

    ```

    *Fig - 4.27*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_111_2.png)

    *Fig - 4.28*


    See how we amalgamated both arrays? Line #4 reads “First spread out all the members
    of **arr** inside an array, then spread out all the members of **arr2** inside
    an array, then assign that array to a Variable named numbers”. This can be done
    with more than two arrays too.


    Deprived of the rest/spread operator we would be forced to use methods like **concat()**,
    **push()**, **unshift()**, **slice()**, **splice()**, etc; Imagine doing it with
    multiple arrays without the rest/spread operator, the very thought is appalling.


    Now the rest/spread operator can also be used to duplicate an array. Take a look
    at the following example:


    *Input*


    ![](img/8a6860449d086ad6675add2b749bcc36_112_0.png)

    *Fig - 4.29*


    *Output:*


    ![](img/8a6860449d086ad6675add2b749bcc36_112_1.png)

    *Fig - 4.30*


    Did you see how appending/pushing “a” to **arr** appended it to **arr2** also?
    Now why did this came to pass? Well, let me read this code out from line #2 to
    #4, it goes like this “Assign an array **[1,2,3,4,5]** to a Variable hereafter
    named **arr**; then assign the same array to another Variable hereafter named
    **arr2**; affix **`a`** at the end of the original array”. Now if both **arr**
    and **arr2** bring up to the same data (from memory), any changes made to any
    of them are in fact being made to the data itself, and when either of the Variables
    call that data they both get the mutated version; this is called assigning by
    reference, where the data is not duplicated but entangled, as a consequence both
    arrays are at the mercy of each other.


    Now if we fancy duplicating the data we have to use clever tricks, one of which
    is using rest/spread operator. Take a look at the following code to learn how
    to do it:


    *Input:*


    ![](img/8a6860449d086ad6675add2b749bcc36_113_0.png)

    *Fig - 4.31*


    *Output:*


    ![](img/8a6860449d086ad6675add2b749bcc36_113_1.png)

    *Fig - 4.32*


    Now if you compare Fig – 4.29 & Fig – 4.30 with Fig – 4.31 & Fig – 4.32 you will
    realize how valuable the rest/spread operator is. The code in Fig–4.31 lines #2
    to #4 reads “Assign an array **[1,2,3,4,5]** to a Variable named **arr**; then
    assign the value of **arr** to another Variable named **arr2**; affix `a` at the
    end of the **arr** array”. This time we have deposited the data discretely and
    mutated only one array without affecting the other; in this case both arrays are
    independent of each other.


    Another decent use of the rest/spread operator is with functions, take a look
    at the following code:


    ```javascript

    2 function myFunk() {

    3 return Array.from(arguments).reduce((prev, next)=>prev-next);

    }

    5 let args = ["...1234"].map(x=> +x);

    6 console.log(myFunk.apply(null, args)); //logs: -8

    ```

    *Fig - 4.33*


    There is a simpler way to write this:


    ```javascript

    2 function myFunk(...params) {

    3 return params.reduce((prev, next)=>prev-next);

    }

    5 let args = ["...1234"].map(x=> +x);

    6 console.log(myFunk(...args)); //logs: -8

    ```

    *Fig - 4.34*


    Now there are a couple of things to learn here, but first things first, let’s
    read this code out loud, it goes like this “Declare a procedure/function that
    reduces down to a single value all the arguments passed to it; log what this function
    returns when the following arguments are passed to it: [1,2,3,4]”.


    On line #2 the **...params** says “Store the first argument in **params**, then
    store the **rest** of the arguments in **params**”. Here the rest/spread operator
    may be called a “Rest parameter” since its giving the rest of the values to a
    Variable.


    On line #3 the reduce method reduces all the values down to a single value by
    taking the 1st value, subtracting the 2nd from it, then subtracting the 3rd from
    it, and this goes on until no members are left in the array; then the final value
    is returned.


    On line #5 it reads “**Spread** each character in the string `1234` into an array,
    convert each character to a number, set that array to a Variable named **args**”.
    Here the rest/spread operator may be called a “Spread operator” since it’s taking
    values out from a Variable and spreading them around.


    On line #6 it says “Spread each member of the **args** array into the arguments
    section of **myFunk()** and pass these arguments, log the result”.


    Now let’s get one thing clear, when to call it “Rest” and when to call it “Spread”?
    I have a simple way to figure it out, if the operator is giving values to a Variable
    it’s a “Rest parameter”, if the operator is taking values out of a Variable and
    spreading them around it’s a “Spread operator”.


