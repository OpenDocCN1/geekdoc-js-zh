    **Closing Arguments**


    Let’s revisit the lessons of this chapter and take a look at what we have learned!
    Following


    lessons are the rough outline of this chapter.


    1)


    A primitive is a data that is not an object and has no methods.


    2)


    JavaScript has 6 datatypes: String, Number, Boolean, Null, Undefined, and the
    newly


    added “Symbol” (in ES6).


    3)


    All symbols are unique, if compared the output will be false unless it is true
    due to law of


    identity.


    4)


    Symbols are non-iterable/enumerable.


    5)


    **Object.getOwnPropertySymbols()** method is used to get symbolic keys from an
    object.


    6)


    Linting is the process of enforcing good coding practices and style, it is used
    to make code


    more manageable, readable, and immune to problems.


    7)


    ESLint is the prime linting software that comes with a CLI and has different plugins
    for


    famous code-editors; it is used to lint JavaScript/ES6 code.


    8)


    ESLint is configured in a file named “**.eslintrc.json**” which may be hidden,
    as files which


    have a period/dot as a first character in filename are hidden by default in some
    OSes and


    UIs.


    9)


    In “**.eslintrc.json**” file the “env” property holds the environments for which
    our code is


    written for, the “extends” property holds the style-guide info we are using, and
    the rules


    property holds the status of the rules we are modifying from the style guide we
    are using.


    10) Airbnb is the best style guide to choose as a rule of thumb.


    11) ESLint comes with a CLI to use for Linting, however many code editors come
    with a built-


    in or an add-on version of ESLint.


    12) We can add exceptions for global variables with a global header comment like
