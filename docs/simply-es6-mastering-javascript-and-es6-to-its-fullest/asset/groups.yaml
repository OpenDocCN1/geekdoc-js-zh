    *Fig - 4.42*\n\n*Output:*\n\n![](img/8a6860449d086ad6675add2b749bcc36_118_1.png)\n\
    *Fig - 4.43*\n\n*Input (amended):*\n\n![](img/8a6860449d086ad6675add2b749bcc36_119_0.png)\n\
    *Fig - 4.44*\n\nNow the output for both of them is identical, and the amended\
    \ input is much more convenient.\n\n## Practice Project\n\nNow we will work on\
    \ a project, and you will make a MVP version of it. This is just a simple “Paint\
    \ App” but upon this same logic a lot of complex software can be developed. Go\
    \ through the following exercise, keep it simple, and take it as it comes:\n\n\
    1) Use JavaScript/ES6 to generate HTML & CSS.\n2) Build a “Paint App” with the\
    \ ability to alter resolution by mutating the **app.resW** & **app.resH** variables.\n\
    3) The display should represent a 2d array named **matrix**.\n4) Compound loops\
    \ should be used to iterate through the matrix/multidimensional-array.\n\nHere\
    \ is the code we have:\n\n```javascript\nHTML:{\n  const app = {\n    resW: 30,\n\
    \    resH: 30,\n    turnOn(i) {\n      let item = document.getElementsByClassName(\"\
    pixels\")[i];\n      item.className = (item.className !== \"pixels on\" ? \"pixels\
    \ on\" : \"pixels off\");\n    },\n  };\n\n  const matrix = Array(app.resH)\n\
    \    .fill(Array(app.resW).fill(\"\"));\n\n  let count = 0;\n  for (let [row,\
    \ rowMatrix] of matrix.entries()) {\n    for (let col in rowMatrix) {\n      document.getElementById(\"\
    display\").innerHTML +=\n        `<div class=\"pixels\" onclick=\"app.turnOn(${count})\"\
    ></div>`;\n\n      let item = document.getElementsByClassName(\"pixels\")[count++].style;\n\
    \      [item.left, item.top] = [`${(col)*10}px`, `${(row)*10}px`];\n    }\n  }\n\
    }\n```\n*Fig - 4.45*\n\nThe HTML part is:\n\n```javascript\nHTML:{\n  document.body.innerHTML\
    \ = `\n    <style>\n      .pixels {\n        height:10px;\n        width:10px;\n\
    \        background-color:#EEE;\n        position:absolute;\n      }\n      .pixels:hover{background-color:#F00;}\n\
    \      .on {background-color:#000;}\n    </style>\n    <div id=\"display\"></div>\n\
    \  `;\n}\n```\n*Fig - 4.46*\n\nNow let me narrate each line of code so we can\
    \ learn it better:\n\nFirst of all there is the **HTML** label, it covers most\
    \ of the HTML & CSS generation process of our code.\n\nThere is a class named\
    \ **pixels** which belongs to each individual pixel on our canvas, it makes our\
    \ pixels square shaped. Now in modern day an actual pixel is one of those really\
    \ small squares on the screen of our laptop, however back in the day those squares\
    \ used to be gigantic, very close to the ones in our app; our browser may crash\
    \ if we try to generate a 1px-600px*800px canvas, so instead we are generating\
    \ a 10px-30px*30px canvas.\n\n**Note:** HTML has canvas elements which are better\
    \ suited for this task, but here we are taking a more hands-on approach.\n\nThere\
    \ is a hover pseudo-class on pixels, this highlights (in red) the pixel to show\
    \ the user which pixel their cursor is targeting.\n\nThere is a class named **on**\
    \ which changes the color of a white pixel to a black pixel giving the user the\
    \ ability to draw and write on the canvas with black color.\n\nThere is a divider\
    \ with id “**display**” this will enclose all our pixels within itself. This concludes\
    \ the **HTML** label portion of our code.\n\nThen on line #19 we have an object\
    \ named “**app**”, in this object we are plotting some vital policies of our app,\
    \ we have the width and the amount of pixels in each row of our app’s canvas established\
    \ in **resW** property, and we have the height and the amount of pixels assembled\
    \ in each column of our app’s canvas established in **resH** property. Finally\
    \ we have the method that toggles a pixel between black and white so we can draw\
    \ upon our canvas. To this point we are just storing data that is a prerequisite\
    \ to spreading out canvas.\n\nThen on lines #29 to #33 we have a variable named\
    \ “**matrix**”, this is a record of each pixel in our canvas, if ever need to\
    \ export our drawings into a separate file we will actually be saving a multidimensional\
    \ matrix of pixel data. This code narrates like “Declare a variable named **matrix**,\
    \ in this variable we have an array with (**resH**) amount of members, within\
    \ this array all members are arrays, each of latter array has (**resW**) amount\
    \ of members, each of these members are empty string”.\n\nNow from line #35 to\
    \ #47 we have a two-way loop that extracts each pixel data from our matrix and\
    \ directs it towards **display** on lines #39 to #41; Now on lines #43 to #46\
    \ we are placing each pixel to its proper place. The **row** & **col** variables\
    \ on lines #36 & #37 are numbers and are used as coordinates for pixels. The code\
    \ narrates like “Extract the first pixel from **matrix** and spread it on (**display**),\
    \ give this pixel the class `pixels` and the ability to toggle between black and\
    \ white when clicked; place this pixel on coordinates (x, y) where x equals 10\
    \ times its vertical placement and y equals 10 times its horizontal placement”.\n\
    \n![](img/8a6860449d086ad6675add2b749bcc36_122_0.png)\n*Fig - 4.47*\n![](img/8a6860449d086ad6675add2b749bcc36_122_1.png)\n\
    *Fig - 4.48*\n![](img/8a6860449d086ad6675add2b749bcc36_122_2.png)\n*Fig - 4.49*\n\
    ![](img/8a6860449d086ad6675add2b749bcc36_122_3.png)\n*Fig - 4.50*\n\nNow let’s\
    \ see some output and let’s wrap up this section. The images you see from Fig\
    \ – 4.47 to Fig – 4.50 are amazing works of pixel art! Now that is it for this\
    \ project! Happy Coding….\n\n## Closing Arguments\n\nLet’s revisit the lessons\
    \ of this chapter and take a look at what we learned! Following lessons are the\
    \ rough outline of this chapter.\n\n1. **Object.keys()** is a method that returns\
    \ an array comprised of keys of the provided argument object as members.\n2. **Object.entries()**\
    \ is a method that returns an array comprised of 2-member arrays in which the\
    \ first member is a key and the second member is a corresponding value, this information\
    \ is extracted from the argument object provided.\n3. There are significant difference\
    \ between arrays and other Iterables.\n4. **Array.from()** is a method that returns\
    \ the provided argument iterable after converting it to a true array.\n5. **Array.of()**\
    \ is a method that returns the provided arguments after converting it to a true\
    \ array.\n6. **Array()** and **Array.fill()** methods can be used to generate\
    \ foundational matrices.\n7. Arrays have methods like **find()**, **findIndex()**,\
    \ **some()**, **every()**, etc… these methods can be used to vet the array’s members.\n\
    8. ES6 comes with a very worthwhile feature called **rest/spread** operator.\n\
    9. If it’s giving the “rest of values” to a Variable it may perhaps be called\
    \ a “Rest-parameter”; and if its taking values out of a Variable and spreading\
    \ it around then it’s called a “Spread-operator”.\n10. ES6 comes with a shorthand\
    \ way to compose methods.\n11. Objects have an auto-spread technique to compose\
    \ keys and values.\n\nAnother thing I want you to leave with is “Polyfills”, which\
    \ is simply sort of a prefix code that fixes a feature in web browsers that doesn’t\
    \ have native support for that feature.\n\n## Chapter 5 – Requests & Promises\n\
    \n### Promise & fetch\n\nA promise is an assurance we give to someone that we\
    \ will carry out some action. Code has promises too, when doing something a **Promise**\
    \ assures us that it will be done, it may not be able to do it straightaway but\
    \ somewhere down the line it will be done. In JavaScript it goes like this: If\
    \ you ask for some data either you will get it, or you will get an error; but\
    \ another thing you can get is a **Promise**.\n\nA **Promise** works like this,\
    \ I ask my associate to get me the information of our client “John”. My associate\
    \ says “Ok, I am going to look for that information but I **Promise** that I will\
    \ come back with an answer.” Then she goes to look for it. After a while I ask\
    \ about John and she replies “Still searching of that info”. (Also known as promise\
    \ pending in JavaScript). After she finds the info she comes by and stands near\
    \ the phone instead of giving me the information (she is exceptionally gawky).\
    \ I have to ask for it, only then she says “I have fulfilled my promise, here\
    \ is the info you needed”.\n\nLet’s look at the following code:\n\nInput:\n\n\
    ```html\n<!doctype html>\n<html>\n<head>\n  <meta charset=\"UTF-8\">\n</head>\n\
    <body>\n  <script>\n    let myRes = fetch(\"http://localhost:3000/database\");\n\
    \    console.log(myRes);\n  </script>\n</body>\n</html>\n<!--just a comment -->\n\
    ```\n*Fig - 5.1*\n\nOn line #9 I have asked my associate to fetch some information\
    \ from “**localhost:3000/database**” (I will make available the NodeJS back-end\
    \ code later in this chapter). On line #10 I ask her what info she was able to\
    \ find."
