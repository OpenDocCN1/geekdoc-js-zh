    AltSchool, and ClearView AI, etc. Initially invested in Facebook via a Convertible
    bond.


    Once replaced Elon Musk as the CEO of PayPal (then X.com). Invests in research
    and ventures related to AI, Life Extension, Sea Steading. He is involved in Breakout
    Labs which funds research outside of corporate, government, or academics confines.
    The Thiel Fellowship annually awards $100,000 to 20 people under the age of 23
    for them to drop out of college and create their own ventures.


    11. Other notable candidates are Future of Life Institute, Mars Society, Singularity
    University, Lifeboat Foundation, Human Brain Project**, Apache Mahout**, BRAIN
    Initiative**, Operation Serenata de Amor, Cyc, The Venus Project, etc.


    **Note:** For those of you interested in AI/ML, Robotics, IoT, and other related
    technology from an Academic point of view I suggest reading up on it in academic
    journals and following updates from people actually doing the research instead
    of reading blogs, or listening to podcasts. A good source is “**arXiv.org**”.


    ## Cylon, Artoo, and Gobot


    The Robotics projects Cylon, Artoo, and Gobot are frameworks for using JavaScript,
    Ruby, and Go language for programming hardware like Robots, IoT, etc. When I discovered
    these projects I instantly fell in love with them, and what a coincidence it is?!
    JavaScript, Ruby, and Go are my favorite languages among others. At the time of
    writing the following common hardware and related tech was supported:


    1. Arduino

    2. Raspberry Pi

    3. Intel Galileo, Edison. and IoT Analytics

    4. OpenCV (BSD, real-time Computer Vision Library)

    5. WICED Sense.

    6. Bebop (Parrot''s drone with dual-core CPI, quad-code GPU, 9GB flash Memory,
    14MP camera, and WiFi hot-spot).

    7. Electric Imp (IoT)

    8. Joystick (Dual-shock 3, X-box 360, and all SDL compatible USB joystick.)

    9. Keyboard

    10. Audio & Speech interface.


    The following commonly General Purpose Input/Output aka GPIO based devices are
    supported:


    1. Analog sensor

    2. Button

    3. Direct Pin

    4. IR Range Finder

    5. LED

    6. Motor

    7. Relay


    The support is not limited to this list, and more and more support is coming everyday.
    These projects come with modules for HTTP/HTTPS (REST), socket.io, and mqtt.


    ## TensorFlowJS


    In it''s essence TensorFlow and all other Machine Learning libraries are just
    collection of function and routines for High Tech Mathematics. TensorFlowJS is
    a JavaScript Framework that enables us to build and train machine learning models
    with JavaScript. TensorFlowJS is used to build deep neural network. It powers
    some of the greatest AI tech we have these days.


    In recent chapters we have learned some Mathematics related with Tensors. As a
    revision remember the following terms:


    1. 4-dimensional Tensors are Arrays with 3-dimensional Tensors as members.

    2. 3-dimensional Tensors are Arrays with 2-dimensional Tensors as members.

    3. 2-dimensional Tensors aka Matrices are Arrays with 1-dimensional Tensors as
    members.

    4. 1-dimensional Tensors aka Arrays aka Vectors are Arrays with 0-dimensional
    Tensors as members.

    5. 0-dimensional Tensors aka Scalars are Numbers.


    In Mathematics Tensors can have any amount of dimensions as we want, they have
    shape which is defined by the length of their members and sub-members, and sub-members
    of sub-members, and so on.


    Just like Arrays, Tensors have index values too! However they look more like map
    coordinates, so a 1-dimensional Tensor aka Array have index values like 0, 1,
    2, 3, 4, etc. a 2-dimensional Tensor has index values like (0, 0), (0, 1), (0,
    2), (1, 0), (1, 1), etc. and a 3-dimensional Tensor has index values like (0,
    0, 0), (0, 0, 1), (1, 0, 1), (3, 1, 0), etc. and so on.


    **Note:** Tensors, Arrays, Matrices, Vectors, etc. are not synonymous. They have
    different definitions in Mathematics, and Computer Programming. Don’t confuse
    them with each other! In TensorFlow Tensors are an immutable form of data.


    With TensorFlow we can create, train, export, and import ML models in form of
    sessions. TensorFlow can be used for stuff like Machine Learning, Data Science,
