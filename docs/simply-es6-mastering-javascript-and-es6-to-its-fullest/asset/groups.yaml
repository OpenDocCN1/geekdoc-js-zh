    \ 等视为对象。\n2) 它们无法被迭代。\n3) 它的长度为 undefined 或 0。\n4) 原型中缺少 `clear()` 方法。\n5) 每当发生垃圾回收，如果任何对象被删除或设置为\
    \ null 或 undefined，如果它们是 WeakSet 的成员，它们也会被移除（垃圾回收在不同环境中工作方式不同）。\n6) 由于垃圾回收需要时间，在对象删除和垃圾回收之间，我们仍然可以从\
    \ WeakSet 中访问被删除的对象。\n\n关于 WeakSets 你能发现的唯一就是自动清理和垃圾回收，但不需要这样做，只需看下面的代码：\n\n```javascript\n\
    let myJohn = {name: \"John\"};\nlet myJane = {name: \"Jane\"};\nlet myWeakSet\
    \ = new WeakSet([myJohn, myJane]);\nconsole.log(myWeakSet);\n\nmyJohn = null;\n\
    console.log(myWeakSet);\n```\n*图 - 8.39*\n\n输出：\n\n![](img/8a6860449d086ad6675add2b749bcc36_210_0.png)\n\
    \n*图 - 8.40*\n\n在这里第 1 行和第 2 行有两个任意对象，myJohn 和 myJane。第 4 行我们创建了一个包含两个成员 myJohn\
    \ 和 myJane 的新 WeakSet。当我们在第 5 行第一次打印这个 WeakSet 时，它正常打印。我们将 myJohn 设置为 null 并再次打印这个\
    \ WeakSet，这次也正常打印，然而当我们几秒钟、几分钟后打印这个 WeakSet 时，一旦垃圾回收运行，myJohn 就会失去在该 WeakSet 中的成员。\n\
    \n**注意：** 如果你的垃圾回收设置不同或不是按间隔运行，这将不起作用。\n\n## Maps\n\nMaps 之于 Objects 如 Sets 之于\
    \ Arrays，是一种姐妹数据结构。Maps 基本上是键值对的 Sets。\n\n现在 Maps 也有一些特性：\n\n1) 它拥有 Sets 的几个方法，如\
    \ `has()`、`get()`、`delete()`。\n2) 要向 Map 添加成员，你可以使用 `set()` 方法。\n3) 你可以使用 `forEach()`\
    \ 和 `for/of` 方法遍历 Map。\n\n现在来看下面的代码：\n\n```javascript\nconst myMap = new Map();\n\
    \nmyMap.set(\"fName\", \"John\");\nmyMap.set(\"lName\", \"Doe\");\nmyMap.set(\"\
    age\", 40);\n\nconsole.log(myMap);\n```\n*图 - 8.41*\n\n输出：\n\n![](img/8a6860449d086ad6675add2b749bcc36_211_0.png)\n\
    \n*图 - 8.42*\n\n在这里第 1 行我们声明了一个新变量并为其赋值了一个新的空 Map。第 3 行到第 5 行我们创建了三个键 (**fname**、**lname**、**age**）并将这些键与对应的值（**“John”**、**“Doe”**、**40**）配对。第\
    \ 7 行我们打印了 Map 的值。输出所示，每个键都有对应的值，但输出并不是对象，而是一个 Map。\n\n"
