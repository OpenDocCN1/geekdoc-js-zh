    2) Labeling is like laying borders, any code within the {} is a citizen, any outside
    code is an immigrant. The name of the border is like the name of a country.


    ## The Let and the Const


    Let’s start with “Scopes”. A Scope is a simple term used in coding to define where
    you can call a variable/code and where you can’t call it. In JavaScript we use
    prefixes like “var”, “let”, or “const” to control the scope of a variable and
    avoid data leaks.


    In JavaScript some variables can be declared without any prefix:


    ```javascript

    3  x  = 5;

    4 document.write(x); //output: 5

    ```

    *Fig - 1. 7*


    This method is highly discouraged. However later in your JavaScript journey it
    will be almost inevitable to avoid them if you are using 3rd party libraries.
    You should get used to plugging these leaks with “let” and “const”. There is a
    simple way to avoid these types of leaks. "use strict";


    ```javascript

    3  "use strict";

    4  x  = 5; // throws error

    ```

    *Fig - 1. 8*


    This error comes out in the console.


    ![](img/8a6860449d086ad6675add2b749bcc36_18_0.png)

    *Fig - 1. 9*


    With “use strict” you can avoid errors that arise from undeclared variables. Another
    important thing to know about keyword-less declarations is that those declarations
    belong to the **window** object; declarations with **var** also belong to the
    **window** object. The variables declared with prefix/keyword “**var**” can be
    called almost anywhere after it is declared. It has a **“declared once, call anywhere”**
    policy. However it can also be **re-declared** which is a problem for us.


    ```javascript

    3  var  x = "Harry"

    4  var  x = "Jerry"

    5 document.write(x); //output: Jerry

    ```

    *Fig - 1. 10*


    See here:-


    1) We first declared x, on line 3 we set its value to “Harry”.

    2) We then declared another x and set its value to “Jerry”.

    3) When we call x on line 5 it recalls its last assigned value.

    4) The ability to re-declare a variable is the main problem here.


    Another problem with “**var**” is that it creates immigrant variables.


    ```javascript

    3  // outside Canada

    4

    5  canada: {

    6  //inside Canada

    7  var  citizen = "John";

    8 }

    9

    10 document.write(citizen); //output: John

    ```

    *Fig - 1. 11*


    Anything outside {} is outside Canadian, anything inside {} is within borders.
    A Canadian citizen is an immigrant outside borders. Ideally JavaScript borders
    are kept to keep citizens inside (this is not a perfect metaphor). Citizens declared
    with “**var**” can go outside without any restriction, this is also a major problem.
    “**var**” stays inside the {} of a function but leaks outside scope which is why
    people say “**var**” is “function scoped”. “**let**” and “**const**” do the same
    job as “**var**”; however they cannot be called where they stay. When using ES6
    we tend to avoid “**var**” as much as possible, replace it with “**let**” and
    “**const**. As a fun little experiment to take some old code and replace all occurrences
    of “**var**” with “**let**”, then try to replace as many “**let**” occurrences
    as possible with “**const**”. Now let’s talk about Mary.


    ```javascript

    3  canada: {

    4  let canadianCitizen = "Mary";

    5 document.write(canadianCitizen); //output: Mary

    6

    7  ontario: {

    8 document.write(canadianCitizen); //output: Mary

    9 }

    10

    11 alberta: {

    12 document.write(canadianCitizen); //output: Mary

    13 }

    14

    15 document.write(canadianCitizen); //output: undefined

    ```

    *Fig - 1. 12*


    Mary can move around inside Canada she can go to Ontario, or anywhere else but
    she can’t leave Canada due to its “No easy out” policy for “**let**” and “**const**.


    Another important ability of “**let**” is it being a sort of “Sync” function,
    on the other hand “**var**” is sort of an “Async” function. Consider the following
    case:Loop with var:


    ```javascript

    1  for (var  i = 0; i < 5; i++) {

    2  setTimeout(function(){

    3  console.log(i); //logs “5” five times

    4 }, 1000);

    5

    ```

    *Fig - 1. 13*


    Same loop with let:

    ```javascript

    3  for (let  i = 0; i < 5; i++) {

    4  setTimeout(function(){

    5  console.log(i);

    6  /*

    7  logs:

    8  0

    9  1

    10 2

    11 3

    12 4

    13 */

    14 }, 1000);

    5

    ```

    *Fig - 1. 14*


    When we used “var” console called “i” five times after 1 second; however we used
    “let” console called “i” every iteration of the loop and logged the value 1 second
    after calling it. Here we have observed that loops and timeouts with “**var” behaves
    like a cheap pizza joint where they wait for all pizzas to get cold before delivering
    them. On the other hand loops and timeouts with “**let” behave like a fast food
    joint where they dispatch the order ASAP and it gets to you in time.


