- md: "\n## Chapter 3 – Arrays, Loops, and Tensors\n\n### De-structuring\n\nES6 comes\
    \ with a simpler way to extract variables from objects, De-structuring. Let’s\
    \ look at the following code:\n\nWith ES6:\n\n```javascript\nconst myObj = {\n\
    \  name: \"John\",\n  age: 45\n}\n\nlet {name, age} = myObj;\n\nconsole.log(name);\n\
    console.log(age);\n```\n\n*Fig - 3.1*\n\nThe code on line #7 is called “De-structuring”.\
    \ Here it is used to extract members from an object. Here is the Output:\n\n![](img/8a6860449d086ad6675add2b749bcc36_65_0.png)\n\
    \n*Fig - 3.2*\n\nIn the example in Fig – 3.3 the same code is written without\
    \ ES6 de-structuring feature. As we can see here de-structuring feature acts as\
    \ a shorthand for assigning variables a value from an object, as long as the name\
    \ of that variable and the name of the key of its assigned value is the same.\n\
    \n```javascript\nconst myObj = {\n  name: \"John\",\n  age: 45\n}\nlet name =\
    \ myObj.name;\nlet age = myObj.age;\n\nconsole.log(name);\nconsole.log(age);\n\
    ```\n\n*Fig - 3.3*\n\nBut what if we want to name the variable something else?\
    \ ES6 has got you covered.\n\n```javascript\nconst myObj = {\n  name: \"John\"\
    ,\n  age: 45\n}\n\nlet {name: myName, age: myAge} = myObj;\n\nconsole.log(name);\n\
    console.log(age);\n```\n\n*Fig - 3.4*\n\nIn Fig – 3.4, on line #7 we now have\
    \ assigned different names to the extracted values.\n\n**Note:** In JavaScript\
    \ “name” is a pre-assigned global variable and is a member of the **window** object.\n\
    \nNow let’s use de-structuring in another example. This time we will use de-structuring\
    \ with nested objects and default values. Take a look at the following example:\n\
    \n```javascript\nconst BATCAVE = {\n  firstName: \"Bruce\",\n  lastName: \"Wayne\"\
    ,\n  superheroIdentity: {\n    name: \"Batman\",\n    powers: [\"He is rich!\"\
    , \"Alfred\"],\n    sidekick: \"Robin\"\n  }\n}\n\nlet {\n  firstName,\n  age\
    \ = \"Unknown\",\n  superheroIdentity: {powers, sidekick:friend},\n} = BATCAVE;\n\
    \nconsole.log(firstName);\nconsole.log(age);\nconsole.log(powers);\nconsole.log(friend);\n\
    ```\n\n*Fig - 3.5*\n\nBravo! We have used de-structuring to find out batman’s\
    \ true identity!\n\nOn line #13 we extracted his real name from the **BATCAVE**\
    \ object and assigned it to a variable called **“firstName”**.\n\nOn line #14\
    \ we extracted his age, however we found no data on his age in the **BATCAVE**\
    \ object so we assigned it the default value **“Unknown”**.\n\nOn line #15 we\
    \ have extracted the **superheroIdentity** data from **BATCAVE** and assigned\
    \ the value of **superheroIdentity.powers** to a variable called **powers**. We\
    \ have also assigned the value of **superheroIdentity.sidekick** to a variable\
    \ called **friend** since sidekick is offensive to Robin and that guy is crazy!\n\
    \nThere is a simpler way to write the code on line #15 and we can write it separately\
    \ too:\n\n```javascript\nlet {\n  firstName,\n  age = \"Unknown\",\n} = BATCAVE;\n\
    \nlet { powers, sidekick:friend } = BATCAVE.superheroIdentity;\n```\n\n*Fig -\
    \ 3.6*\n\nEither way the output will be the same:\n\n![](img/8a6860449d086ad6675add2b749bcc36_67_0.png)\n\
    \n*Fig - 3.7*\n\nDe-structuring works very well with multi-assignments of variables,\
    \ nesting can get a little nasty however as long as we are looking out for readability\
    \ and writing useful comments where they are needed we will be good to go.\n\n\
    ### De-structuring arrays\n\nES6 De-structuring works with arrays too. Take a\
    \ look at the following example:\n\n```javascript\nlet [youngMan, oldMan, halfMan]\
    \ = [\"Jon\", \"Jorah\", \"Tyrion\", \"\"];\n\nconsole.log(youngMan);\nconsole.log(oldMan);\n\
    console.log(halfMan);\n```\n\n*Fig - 3.8*\n\nOutput:\n\n![](img/8a6860449d086ad6675add2b749bcc36_68_0.png)\n\
    \n*Fig - 3.9*\n\nAll the members in the left-hand array are declared as variables\
    \ and assigned values from the right-hand array according to their index. Can\
    \ you also see the extra member in the array on the right-hand side of the assignment?\
    \ Extra members in the right-hand array are ignored while de-structuring and extra\
    \ members in the left-hand array will result in undefined at the end of the left-hand\
    \ array.\n\nExample:\n\n```javascript\nlet infoArr = [\"Jon\", \"Jorah\", \"Tyrion\"\
    ];\nlet [youngMan, oldMan, halfMan, bestMan] = infoArr;\n\nconsole.log(infoArr);\n\
    console.log(youngMan);\nconsole.log(oldMan);\nconsole.log(halfMan);\nconsole.log(bestMan);\n\
    ```\n\n*Fig - 3.10*\n\nOutput:\n\nThis can be avoided using default assignments,\
    \ for example:\n\n```javascript\nlet infoArr = [\"Jon\", \"Jorah\", \"Tyrion\"\
    ];\nlet [youngMan, oldMan, halfMan, bestMan = \"Samwell\"] = infoArr;\n\nconsole.log(infoArr);\n\
    console.log(youngMan);\nconsole.log(oldMan);\nconsole.log(halfMan);\nconsole.log(bestMan);\n\
    ```\n\n*Fig - 3.11*\n\nOutput:\n\n![](img/8a6860449d086ad6675add2b74bcc36_69_1.png)\n\
    \nWe can also use array destructuring to extract data from strings. Look at the\
    \ following example:\n\n```javascript\nlet [\n  firstDestination,\n  secondDestination,\n\
    \  thirdDestination,\n  ...restOfThem\n] = \"Aberdeen, Dundee, Edinburgh, Glasgow,\
    \ Moray\".split(\", \");\n\nconsole.log(firstDestination);\nconsole.log(secondDestination);\n\
    console.log(thirdDestination);\nconsole.log(restOfThem);\n```\n\n*Fig - 3.12*\n\
    \nAfter splitting the string it will turn into an array, then we can de-structure\
    \ to get our values. The ...Rest operator on line #6 declares an array called\
    \ “restOfThem” and pushes the leftover values to it. Rest/Spread operator is further\
    \ later in this book.\n\nOutput:\n\n![](img/8a6860449d086ad6675add2b74bcc36_70_0.png)\n\
    \n*Fig - 3.13*\n\nWe can also use destructuring to swap the values of two variables.\
    \ Look at the following code:\n\n```javascript\nlet outsideBox = \"blue\";\nlet\
    \ insideBox = \"red\";\n\nconsole.log(outsideBox, insideBox);\n\n[outsideBox,\
    \ insideBox] = [insideBox, outsideBox];\n\nconsole.log(outsideBox, insideBox);\n\
    ```\n\n*Fig - 3.14*\n\nOutput:\n\n![](img/8a6860449d086ad6675add2b74bcc36_71_0.png)\n\
    \n*Fig - 3.15*\n\nOn line #7 we swap the values of two variables, no need to declare\
    \ a _temp and test the limits of memory; although I am sure’s using _temp under\
    \ the hood.\n\n### De-structuring functions and arguments\n\nThere is another\
    \ way we can use the de-structuring feature of ES6, we can use it with functions\
    \ and their returned value; following is an example of function destructuring\
    \ when a function returns an object:\n\n```javascript\nconst playerData = lvl\
    \ => {\n  return {\n    health: (lvl * 3) + 100,\n    power: (lvl - lvl/2),\n\
    \    energy: (lvl * 2) + 100,\n  };\n}\n\nlet {\n  health,\n  power,\n  energy\n\
    } = playerData(10);\n\nconsole.log(health); //output: 130\nconsole.log(power);\
    \ //output: 5\nconsole.log(energy); //output: 120\n```\n\n*Fig - 3.16*\n\nWithout\
    \ ES6 destructuring this would look like:\n\n```javascript\nconst playerData =\
    \ lvl => {\n  return {\n    health: (lvl * 3) + 100,\n    power: (lvl - lvl/2),\n\
    \    energy: (lvl * 2) + 100,\n  };\n}\n\nlet health = playerData(10).health;\n\
    let power = playerData(10).power;\nlet energy = playerData(10).energy;\n\nconsole.log(health);\
    \ //output: 130\nconsole.log(power); //output: 5\nconsole.log(energy); //output:\
    \ 120\n```\n\n*Fig - 3.17*\n\nCrazy right? and here is an example where a function\
    \ returns an array with ES6:\n\n```javascript\nconst playerCoordinates = () =>\
    \ {\n  return [0.65, 0.35];\n}\n\nlet [x, y] = playerCoordinates();\n\nconsole.log(x);\
    \ //output: 0.65\nconsole.log(y); //output: 0.35\n```\n\n*Fig - 3.18*\n\nWithout\
    \ ES6 destructuring this would look like:\n\n```javascript\nconst playerCoordinates\
    \ = () => {\n  return [0.65, 0.35];\n}\n\nlet x = playerCoordinates()[0];\nlet\
    \ y = playerCoordinates()[1];\n\nconsole.log(x); //output: 0.65\nconsole.log(y);\
    \ //output: 0.35\n```\n\n*Fig - 3.19*\n\nBy using destructuring we can make multiple\
    \ assignments easier to write, and we can integrate functions better with them.\
    \ However, there is another, more powerful use of destructuring when combined\
    \ with the ability to set default values for parameters. Check the following code:\n\
    \n```javascript\nconst playerData = (lvl, powerUps) => {\n  return {\n    health:\
    \ (lvl * 3) + 100 + powerUps,\n    power: (lvl - lvl/2) + powerUps,\n    energy:\
    \ (lvl * 2) + 100 + powerUps,\n  };\n}\n\nlet {\n  health,\n  power,\n  energy\n\
    } = playerData(10);\n```\n\n*Fig - 3.20*\n"
  mdcn: "\n\n## 第3章 – 数组、循环与张量\n\n### 解构 (De-structuring)\n\nES6 提供了一种更简单的方法从对象中提取变量：解构（De-structuring）。让我们来看代码：\n\
    \n使用 ES6：\n\n```javascript\nconst myObj = {\n  name: \"John\",\n  age: 45\n}\n\
    \nlet {name, age} = myObj;\n\nconsole.log(name);\nconsole.log(age);\n```\n\n*图\
    \ - 3.1*\n\n第 #7 行的代码被称为“解构”。在这里，它被用于从对象中提取成员。输出结果如下：\n\n![](img/8a6860449d086ad6675add2b749bcc36_65_0.png)\n\
    \n*图 - 3.2*\n\n在图 – 3.3 的示例中，在不使用 ES6 解构功能的情况下编写了相同的代码。我们可以看到，解构功能充当了从对象为变量赋值值的简写，只要变量名与其赋值值的键名相同即可。\n\
    \n```javascript\nconst myObj = {\n  name: \"John\",\n  age: 45\n}\nlet name =\
    \ myObj.name;\nlet age = myObj.age;\n\nconsole.log(name);\nconsole.log(age);\n\
    ```\n\n*图 - 3.3*\n\n但如果我们想给变量起另一个名字呢？ES6 已经为你解决了这个问题。\n\n```javascript\nconst\
    \ myObj = {\n  name: \"John\",\n  age: 45\n}\n\nlet {name: myName, age: myAge}\
    \ = myObj;\n\nconsole.log(name);\nconsole.log(age);\n```\n\n*图 - 3.4*\n\n在图 –\
    \ 3.4 中，第 #7 行现在为提取的值分配了不同的名称。\n\n**注意：** 在 JavaScript 中，“name” 是一个预定义的的全局变量，是\
    \ **window** 对象的成员。\n\n现在让我们在另一个示例中使用解构。这次我们将使用带有嵌套对象和默认值的解构。请看以下示例：\n\n```javascript\n\
    const BATCAVE = {\n  firstName: \"Bruce\",\n  lastName: \"Wayne\",\n  superheroIdentity:\
    \ {\n    name: \"Batman\",\n    powers: [\"He is rich!\", \"Alfred\"],\n    sidekick:\
    \ \"Robin\"\n  }\n}\n\nlet {\n  firstName,\n  age = \"Unknown\",\n  superheroIdentity:\
    \ {powers, sidekick:friend},\n} = BATCAVE;\n\nconsole.log(firstName);\nconsole.log(age);\n\
    console.log(powers);\nconsole.log(friend);\n```\n\n*图 - 3.5*\n\n好极！我们使用解构找到了蝙蝠的真实身份！\n\
    \n第 #13 行，我们从 **BATCAVE** 对象中提取了他的真实姓名，并将其赋值给名为 **“firstName”** 的变量。\n\n第 #14\
    \ 行，我们提取了他的年龄，但我们在 **BATCAVE** 对象中没有找到他年龄的数据，因此我们为其分配了默认值 **“Unknown”**。\n\n第\
    \ #15 行，我们从 **BATCAVE** 中提取了 **superheroIdentity** 数据，并将 **superheroIdentity.powers**\
    \ 的值赋值给名为 **powers** 的变量。我们还将 **superheroIdentity.sidekick** 的值赋值给名为 **friend**\
    \ 的变量，因为 sidekick 对 Robin 来说是攻击性的，而那家伙疯了！\n\n编写第 #15 行的代码有更简单的方法，我们可以分开写：\n\n\
    ```javascript\nlet {\n  firstName,\n  age = \"Unknown\",\n} = BATCAVE;\n\nlet\
    \ { powers, sidekick:friend } = BATCAVE.superheroIdentity;\n```\n\n*图 - 3.6*\n\
    \n无论哪种方式，输出都是相同的：\n\n![](img/8a6860449d086ad6675add2b749bcc36_67_0.png)\n\n*图\
    \ - 3.7*\n\n解构在变量的多重赋值中工作得非常好，不过嵌套可能会变得有点复杂，但只要我们关注可读性并在需要的地方编写有用的注释，我们就没问题了。\n\
    \n### 解构数组\n\nES6 解构也适用于数组。请看以下示例：\n\n```javascript\nlet [youngMan, oldMan, halfMan]\
    \ = [\"Jon\", \"Jorah\", \"Tyrion\", \"\"];\n\nconsole.log(youngMan);\nconsole.log(oldMan);\n\
    console.log(halfMan);\n```\n\n*图 - 3.8*\n\n输出：\n\n![](img/8a6860449d086ad6675add2b749bcc36_68_0.png)\n\
    \n*图 - 3.9*\n\n左侧数组中的所有成员都被声明为变量，并根据其索引从右侧数组赋值。你还能看到赋值语句右侧数组中的额外成员吗？在解构时，右侧数组中的额外成员会被忽略，而左侧数组中的额外成员会导致左侧数组末尾的结果为\
    \ undefined。\n\n示例：\n\n```javascript\nlet infoArr = [\"Jon\", \"Jorah\", \"Tyrion\"\
    ];\nlet [youngMan, oldMan, halfMan, bestMan] = infoArr;\n\nconsole.log(infoArr);\n\
    console.log(youngMan);\nconsole.log(oldMan);\nconsole.log(halfMan);\nconsole.log(bestMan);\n\
    ```\n\n*图 - 3.10*\n\n输出：\n\n可以使用默认赋值来避免这种情况，例如：\n\n```javascript\nlet infoArr\
    \ = [\"Jon\", \"Jorah\", \"Tyrion\"];\nlet [youngMan, oldMan, halfMan, bestMan\
    \ = \"Samwell\"] = infoArr;\n\nconsole.log(infoArr);\nconsole.log(youngMan);\n\
    console.log(oldMan);\nconsole.log(halfMan);\nconsole.log(bestMan);\n```\n\n*图\
    \ - 3.11*\n\n输出：\n\n![](img/8a6860449d086ad6675add2b749bcc36_69_1.png)\n\n我们还可以使用数组解构从字符串中提取数据。看以下示例：\n\
    \n```javascript\nlet [\n  firstDestination,\n  secondDestination,\n  thirdDestination,\n\
    \  ...restOfThem\n] = \"Aberdeen, Dundee, Edinburgh, Glasgow, Glasgow\";\n\nconsole.log(firstDestination);\n\
    console.log(secondDestination);\nconsole.log(thirdDestination);\n```\n\n*图 - 3.12*\n\
    \n解构在多重赋值中工作得非常好，...restOfThem 提取了剩余部分。输出：\n\n![](img/8a6860449d086ad6675add2b749bcc36_70_0.png)\n\
    \n*图 - 3.13*\n\n我们还可以使用数组解构从字符串中提取数据。看以下示例：\n\n```javascript\nlet [\n  firstDestination,\n\
    \  secondDestination,\n  thirdDestination,\n  ...restOfThem\n] = \"Aberdeen, Dundee,\
    \ Edinburgh, Glasgow, Glasgow\";\n\nconsole.log(firstDestination);\nconsole.log(secondDestination);\n\
    console.log(thirdDestination);\n```\n\n*图 - 3.14*\n\n解构在多重赋值中工作得非常好，...restOfThem\
    \ 提取了剩余部分。输出：\n\n![](img/8a6860449d086ad6675add2b749bcc36_71_0.png)\n\n*图 - 3.15*\n\
    \n### 数组的解构 (Destructuring arrays)\n\nES6 解构也适用于数组。看以下示例：\n\n```javascript\nlet\
    \ [youngMan, oldMan, halfMan] = [\"Jon\", \"Jorah\", \"Tyrion\", \"\"];\n\nconsole.log(youngMan);\n\
    console.log(oldMan);\nconsole.log(halfMan);\n```\n\n*图 - 3.8*\n\n输出：\n\n![](img/8a6860449d086ad6675add2b749bcc36_68_0.png)\n\
    \n*图 - 3.9*\n\n左侧数组中的所有成员都被声明为变量，并根据其索引从右侧数组赋值。你还能看到赋值语句右侧数组中的额外成员吗？在解构时，右侧数组中的额外成员会被忽略，而左侧数组中的额外成员会导致左侧数组末尾的结果为\
    \ undefined。\n\n示例：\n\n```javascript\nlet infoArr = [\"Jon\", \"Jorah\", \"Tyrion\"\
    ];\nlet [youngMan, oldMan, halfMan, bestMan] = infoArr;\n\nconsole.log(infoArr);\n\
    console.log(youngMan);\nconsole.log(oldMan);\nconsole.log(halfMan);\nconsole.log(bestMan);\n\
    ```\n\n*图 - 3.10*\n\n输出：\n\n可以使用默认赋值来避免这种情况，例如：\n\n```javascript\nlet infoArr\
    \ = [\"Jon\", \"Jorah\", \"Tyrion\"];\nlet [youngMan, oldMan, halfMan, bestMan\
    \ = \"Samwell\"] = infoArr;\n\nconsole.log(infoArr);\nconsole.log(youngMan);\n\
    console.log(oldMan);\nconsole.log(halfMan);\nconsole.log(bestMan);\n```\n\n*图\
    \ - 3.11*\n\n输出：\n\n![](img/8a6860449d086ad6675add2b749bcc36_69_1.png)\n\n我们还可以使用数组解构从字符串中提取数据。看以下示例：\n\
    \n```javascript\nlet [\n  firstDestination,\n  secondDestination,\n  thirdDestination,\n\
    \  ...restOfThem\n] = \"Aberdeen, Dundee, Edinburgh, Glasgow, Glasgow\";\n\nconsole.log(firstDestination);\n\
