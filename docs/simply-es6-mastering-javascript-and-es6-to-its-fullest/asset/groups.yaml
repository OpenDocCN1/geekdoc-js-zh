    5  var  arr = "abcdefghijklmnopqrstuvwxyz";

    6  arr = arr.split("");

    7

    8  for (var  i in arr) {

    9 document.write( arr[i] + "<br>" );

    10 }

    11

    12 }

    ```

    *Fig - 1. 3*


