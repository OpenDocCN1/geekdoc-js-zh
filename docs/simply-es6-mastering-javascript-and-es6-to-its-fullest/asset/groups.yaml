- md: "\n## Closing Arguments\n\nLet’s revisit the lessons of this chapter and take\
    \ a look at what we have learned! Following lessons are the rough outline of this\
    \ chapter.\n\n1. ES6 comes with many features to deal with control-flow aspects\
    \ of our code.\n2. Promises are processes that takes time to resolve, thus we\
    \ need to wait for them to resolve before we can execute code that depends on\
    \ the promise being fulfilled.\n3. ES6 comes with a new feature called **fetch()**\
    \ which is a new way to request resources and data.\n4. Different processes can\
    \ be chained together to have better control flow.\n5. “Thenables” are methods\
    \ chained with promises, they are used to wait for a promise to resolve before\
    \ executing code enclosed within their bounds.\n6. “Thenables” are also promises\
    \ themselves.\n7. Data extracted from a promise may need to be converted to JSON,\
    \ blob, simple text format, etc. to make it more user friendly.\n8. Using **fetch()**\
    \ or any other requests methods may result in **CORS** (Cross-origin resource\
    \ sharing) errors which can be overridden using middle-ware, CORS-allowing headers,\
    \ or browser settings. However a need to override CORS rules is a sign that an\
    \ algorithm is flawed by design and should be altered to follow CORS principles.\n\
    9. Calling a promise before it resolves will result in a “Promise pending” object\
    \ returned.\n10. The **catch()** method can be used to handle any errors disturbing\
    \ a promise or anything else that returns an error.\n11. Both **then()** and **catch()**\
    \ methods take a function as an argument, while using **catch()** with **then()**\
    \ is not required as **then()** can be passed another function as a second argument\
    \ that will handle any errors springing from it. However **catch()** method can\
    \ still be used for readability purposes.\n12. There is also the old method of\
    \ making requests using the XMLHttpRequest routine, which can be used to make\
    \ a more specific request (**fetch()** can do it too!).\n13. Multiple promises\
    \ can be dealt with using **Promise.all()** method which can be passed an array\
    \ of Promises as argument. The **all()** method is also a promise and will resolve\
    \ when all the provided promises are resolved.\n\n## Chapter 6 – Primitives, Linting,\
    \ and IDE material\n\n### The primitives\n\nThe word “Primitive” is seldom used\
    \ in JavaScript, probably because almost all data is subject to methods and behaves\
    \ as a proto-object; however Primitives are a thing!\n\nA “Primitive” is data\
    \ that’s not an object and has no methods.\n\nJavaScript has 6 datatypes: Strings,\
    \ Numbers, Booleans, Null, Undefined, and the newly added “Symbol” (in ES6).\n\
    \nThere are a few traits of the symbol data type:\n\n1) All symbols are unique\
    \ in the sense that none of them are equal to the other (Check Fig – 6.1).\n2)\
    \ Symbols are non iterable. You can’t use loops on an object with Symbols as keys.\n\
    \n```javascript\nconst like = Symbol(\"thumbs up\");\nconst thumb = Symbol(\"\
    thumbs up\");\n\nconsole.log(\n  like === like,\n  like == like,\n  like === thumb,\n\
    \  like == thumb,\n  Symbol(\"thumbs up\") === Symbol(\"thumb up\"),\n  Symbol(\"\
    thumbs up\") == Symbol(\"thumb up\")\n);\n```\n*Fig - 6.1*\n\nNow you can see\
    \ how the data, data-type, and Variables go when compared with each other. As\
    \ a rule of thumb when two symbols are compared for equality the result will be\
    \ **false**, and as a rule of thumb when a variable is compared to itself it will\
    \ always resolve to **true**. This is much like the “Law of Identity” in mathematics,\
    \ where all things are equal to themselves.\n\n*Output:*\n![](img/8a6860449d086ad6675add2b749bcc36_142_0.png)\n\
    *Fig - 6.2*\n\nSince objects with symbols as keys are non-iterable they can sometimes\
    \ be used to store secret data that the end-user cannot access without keys; In\
    \ that case we can get the keys with the **Object.getOwnPropertySymbols()** method,\
    \ it returns an array of keys of the object provided as the argument.\n\n```javascript\n\
    let myObj = {\n  [Symbol(\"a\")]: \"something1\",\n  [Symbol(\"b\")]: \"something2\"\
    ,\n  [Symbol(\"b\")]: \"something3\",\n};\n\nconsole.log(myObj[Symbol(\"b\")]);\n\
    \nlet myObjKeys = Object.getOwnPropertySymbols(myObj);\n\nconsole.log(myObjKeys);\n\
    \nfor(let k of myObjKeys) {\n  console.log(myObj[k]);\n}\n```\n*Fig - 6.3*\n\n\
    *Output:*\n![](img/8a6860449d086ad6675add2b749bcc36_143_0.png)\n*Fig - 6.4*\n\n\
    Static code analysis aka Linting is finding and fixing errors in code. Linting\
    \ also promotes consistent coding practices. When using ESLint with **npm install\
    \ -g**, The **-g** flag is added to make ESLint installs globally.\n\nYou may\
    \ have to complete setup before you can use:\n\n1. Open a Terminal.\n2. Navigate\
    \ to your JavaScript file.\n3. Execute the following:\n\nAfter we have confirmed\
    \ that ESLint is installed properly we will run the command: “**eslint --init**”.\
    \ This will initialize an eslintrc.json file, we will be prompted with a few questions,\
    \ if you don’t know what you are doing here are the answers:\n\n- How would you\
    \ like to use ESLint? To check syntax and find problems.\n- What type of modules\
    \ does your project use? JavaScript modules <import/export>\n- Which framework\
    \ does your project use? None of these *(for now)*.\n- Where does your code run?\
    \ Press **a** and then **enter**. So your code will be linted for both browser\
    \ and Node.js.\n\nYou may have to complete setup before you can use:\n\n1. Open\
    \ a Terminal.\n2. Navigate to your JavaScript file.\n3. Execute the following:\
    \ **eslint fileName.js**\n\nNow we will (as a precaution) check for the ESLint\
    \ version using the command: “**eslint -v**”, the output should be: Here it tells\
    \ us that we have ESLint version 5.14.1 installed in this directory (or globally).\n\
    \nThis is how you use ESLint with its CLI:\n"
  mdcn: "\n\n## 结语\n\n让我们回顾一下本章的课程，看看我们学到了什么！以下内容是本章的大大纲。\n\n1. ES6 引入了许多用于处理代码控制流的特性。\n\
    2. Promise 是需要时间来解析的过程，因此我们需要在等待它们解析完成之前，执行依赖于该 promise 完成状态的代码。\n3. ES6 引入了一个名为\
    \ **fetch()** 的新特性，这是请求资源和数据的新方式。\n4. 不同的过程可以链在一起，以获得更好的控制流。\n5. “Thenables”是链在\
    \ promise 上的方法，它们用于在执行其范围内包含的代码之前，等待 promise 的解析完成。\n6. “Thenables”本身也是 promise。\n\
    7. 从 promise 中提取的数据可能需要转换为 JSON、blob、简单文本格式等，以使其对用户更友善。\n8. 使用 **fetch()** 或任何其他请求方法可能会导致\
    \ **CORS**（跨源资源共享）错误，这些错误可以通过中间件、允许 CORS 的标头或浏览器设置来覆盖。然而，需要覆盖 CORS 规则是算法设计存在缺陷的迹象，应该进行修改以遵循\
    \ CORS 原则。\n9. 在 promise 解析之前调用它将导致返回一个“Promise pending”（等待中）对象。\n10. **catch()**\
    \ 方法可以处理任何干扰 promise 或其他返回错误的内容。\n11. **then()** 和 **catch()** 方法都接受函数作为参数，在使用\
    \ **catch()** 配合 **then()** 时并不是要求的，因为 **then()** 可以传递另一个函数作为第二个参数来处理由此产生的任何错误。然而，为了可读性考虑，仍然可以使用\
    \ **catch()** 方法。\n12. 还有一种使用 `XMLHttpRequest` 例程进行请求的旧方法，它可以用于创建更特定的请求（**fetch()**\
    \ 也可以做到！）。\n13. 多个 promise 可以 **Promise.all()** 方法处理，该方法接受一个 promise 数组作为参数。**all()**\
    \ 方法也是一个 promise，并在所有提供的 promise 都解析后完成解析。\n\n## 第 6 章 – 原始类型、代码检查与 IDE \n\n###\
    \ 原始类型 (Primitives)\n\n“Primitive”（原始类型）一词在 JavaScript 中很少使用，可能是因为几乎所有数据都适用方法并表现得像原型对象；然而，原始类型确实是存在的！\n\
    \n“Primitive”是指不是对象且没有方法的数据。\n\nJavaScript 有 6 种数据类型：字符串（Strings）、数字（Numbers）、布尔值（Booleans）、Null、Undefined\
    \ 以及（在 ES6 中）新添加的“Symbol”。\n\nsymbol 数据类型有几个特点：\n\n1) 所有的 symbol 都是唯一的，从意义上说，它们都不等于彼此（检查图\
    \ 6.1）。\n2) Symbols 是不可迭代的。你不能对一个以 Symbols 为键的对象使用循环。\n\n```javascript\nconst\
    \ like = Symbol(\"thumbs up\");\nconst thumb = Symbol(\"thumbs up\");\n\nconsole.log(\n\
    \  like === like,\n  like == like,\n  like === thumb,\n  like == thumb,\n  Symbol(\"\
    thumbs up\") === Symbol(\"thumb up\"),\n  Symbol(\"thumbs up\") == Symbol(\"thumb\
    \ up\")\n);\n```\n*图 - 6.1*\n\n现在你可以看到数据、数据类型和变量相互比较时的情况了。根据经验，当对两个 symbol 进行等值比较时，结果将为\
    \ **false**；而当一个变量与其自身比较时，它将始终解析为 **true**。这非常像数学中的“同一律”，即所有事物都等于它们自身。\n\n*输出：*\n\
    ![](img/8a6860449d086ad6675add2b749bcc36_142_0.png)\n*图 - 6.2*\n\n由于以 symbol 为键的对象是不可迭代的，它们有时可以用来存储最终用户在没有键的情况下访问的秘密数据；在这种情况下，我们可以使用\
    \ **Object.getOwnPropertySymbols()** 方法获取键，它返回一个作为参数提供的对象的键的数组。\n\n```javascript\n\
    let myObj = {\n  [Symbol(\"a\")]: \"something1\",\n  [Symbol(\"b\")]: \"something2\"\
    ,\n  [Symbol(\"b\")]: \"something3\",\n};\n\nconsole.log(myObj[Symbol(\"b\")]);\n\
    \nlet myObjKeys = Object.getOwnPropertySymbols(myObj);\n\nconsole.log(myObjKeys);\n\
    \nfor(let k of myObjKeys) {\n  console.log(myObj[k]);\n}\n```\n*图 - 6.3*\n\n*输出：*\n\
    ![](img/8a6860449d086ad6675add2b749bcc36_143_0.png)\n*图 - 6.4*\n\n静态代码分析又称为 Linting（代码检查），是发现并修复代码中的错误。Linting\
    \ 还促进了一致的代码规范。在使用 **npm install -g** 安装 ESLint 时，添加了 **-g** 标志是为了全局安装 ESLint。\n\
    \n在在使用之前，你可能需要完成设置：\n\n1. 打开终端（Terminal）。\n2. 导航到你的 JavaScript 文件所在目录。\n3. 执行以下操作：\n\
    \n在我们确认 ESLint 安装正确后，我们将运行命令：“**eslint --init**”。这将初始化一个 eslintrc.json 文件，系统会提示你回答几个问题，如果你不知道在这里该做什么，这里是答案：\n\
    \n- 你想如何使用 ESLint？检查语法并发现问题。\n- 你的项目使用什么种类型的模块？JavaScript 模块 <import/export>\n\
    - 你的项目使用哪个框架？以上都没有（*目前*）。\n- 你的代码运行在哪里？按 **a** 然后按 **enter**。这样你的代码将针对浏览器和 Node.js\
    \ 进行检查。\n\n在在使用之前，你可能需要完成设置：\n\n1. 打开终端。\n2. 导航到你的 JavaScript 文件所在目录。\n3. 执行以下操作：**eslint\
    \ fileName.js**\n\n现在我们将（以防起见）使用命令：“**eslint -v**”检查 ESLint 版本，输出应该是：这里告诉我们我们在此目录下（或全局）安装了\
    \ 5.14.1 版本的 ESLint。\n\n这就是你如何通过 CLI 使用 ESLint 的：\n\n"
