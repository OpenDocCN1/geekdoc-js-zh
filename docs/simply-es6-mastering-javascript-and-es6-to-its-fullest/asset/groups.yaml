    more about the rule.


    We can also disable some rules while coding without editing the “**.eslintrc.json**”


    discretely. This can be done from the linter-eslint package settings.


    You can do it by following instructions:


    1)


    Go to settings tab in the top-pane.


    2)


    Go to Packages tab in the left-pane.


    3)


    Find **linter-eslint** and click on settings.


    4)


    Go to Automatic Fixes section and see Disable specific rules from fixes input
    section.


