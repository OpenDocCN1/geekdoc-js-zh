    **Closing Arguments**


    Let’s revisit the lessons of this chapter and take a look at what we have learned!
    Following


    lessons are the rough outline of this chapter.


    1)


    When we declare a class with a name it’s called a “**class declaration**”.


    2)


    When we assign a nameless class to an Variable it’s called a “**class expression**”.


    3)


    Certain keywords like “**this**” are not rebounded to class expressions.


    4)


    The **constructor()** method is used in classes to assign properties to the output
    Object.


    5)


    Static methods are methods with “**static**” keyword as a prefix, these methods
    are


    methods of only the Class and not its instances.


    6)


    Getters & Setters are used to control the flow of information in and out of an
    object.


    7)


    Extending Classes allows our Classes to improve upon the code of the parent Class.


    8)


    Classes can also be extended to build in Classes like **Arrays**.


    9)


    Generators are functions that pause themselves when they **yield** a value and
    resume


    after being called again.


    10) We can use the **for/of** loop to iterate through the generators.


    11) Proxies are used to intercept, read, write, and mutate the code of other Objects.


    12) Sets are a sister data structure of Arrays; they are enumerable, and they
    don’t have


    index ranks.


    13) Weak Sets are sort of a little sister to Sets; they don’t have any length,
    and they only


    take Objects as their members.


    14) Maps are a sister data structure of Objects; they have some commonalities
    with Sets.


    15) Weak Maps are the little sister of Maps, they have no length, their keys must
    be


    Objects, and they don’t have index values.


    16) Both of the “Weak” data structures are garbage collected, this means if an
    item ceases


    to exist anywhere else in the code, then it will also be removed from Weak Sets
    and


    Weak Maps.


