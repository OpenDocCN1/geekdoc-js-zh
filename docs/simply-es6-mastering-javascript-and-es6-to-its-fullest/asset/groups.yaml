    **Closing Arguments**


    First let’s revisit what we have learned, we began learning comments and labels
    to promote readability of code. We went on to learn 4 different ways of declaring
    a Variable. Then we discussed functions and default assignments. We will end this
    chapter with a revision and some exercises to practice what we have learned.


    1) The key to writing good JavaScript code is to focus on readability and scale-ability;
    Proper use of comments and labels allows us to document our code and improve its
    quality.


    2) Using spaces instead of tabs for Indentation, while tabs make code more clear
    to read it all comes down to habit. A code written with tabs is not scaleable
    because it need to be formatted every time we move to a new framework or IDE.


    3) I use flags to complement comments, following is a list of flags I use on a
    daily basis:

    **Note:** I do not encourage the use of these methods, in my particular case these
    methods improve the communication between me and squad. You are not meant to adapt
    these methods, just learn from them. You can use these conventions, or you can
    develop your own. Different projects require different flags, however it is a
    requirement for your team to agree and practice the same conventions and share
    it with other members of the team to develop mind! You can even double or triple
    flag, however if your code needs too much then it may be flawed by design.


    4) The difference between keyword-less, **var**, **let**, and **const** is of
    scope and mutability. Keyword-less variables are accessible everywhere they are
    still member of the **window** object, they are also highly discouraged unless
    you know what you are doing. “use strict” is a method that prevents calling undeclared
    variables, it comes very handy when we want to avoid declaration and “Variable
    is undefined” errors.


    ![](img/8a6860449d086ad6675add2b749bcc36_40_0.png)

    *Fig - 1. 69*


    5) The variables declared with **var** have a “declared once, anywhere” policy.
    The only exception is them leaking out of functions, this is why they are called
    function scoped. They can also be **Hoisted** (called before a declaration) but
    will return undefined.


    6) The variables declared with **let** or **const** can be called only within
    scope and their scope is defined by the last opening bracket that preceded them.
    This default scope can be changed with the re-binding method Since these variables
    can’t escape their scope it is easy to remember them as having a “No easy out”
    policy.


    7) The variables declared with **let** or **const** also have Async behavior which
    allows them to return more accurate values than **var.**


    8) The variables declared with **const** cannot be re-assigned, however parts
    of them can be assigned without any problems.


    9) To truly make an object immutable we can use **Object.freeze()** method.


    10) Operating on undeclared variables will throw an error instead of undefined/null/NaN.


    11) It is a well followed convention to name Variables with all caps and underscores
    in place of spaces when declaring them with **const**.


    12) Fat arrow functions can be written without an explicit return.


    13) Keywords like “**this**” and “**super**” remain bound to their previous binding
    when used within fat arrow function.


    14) The keywords “**this**” is bound to the built-in object by default. The **bind()**
    method can be used to rebind “**this**”.


    15) ES6 provides the feature of default assignments, instead of asking for a parameter
    we can now ask for a parameter and assign it a default value at the same time
    and place in our code. This plugs a lot of data leaks and errors.


