    ### Searching at the start


    Now outside of a character set the caret sign is used to test for patterns at
    the beginning of a string. Look at the following example:


    ```javascript

    1 const myString = "About and about!";

    2 const myRegex1 = /about/ig;

    3 const myRegex2 = /^about/ig;

