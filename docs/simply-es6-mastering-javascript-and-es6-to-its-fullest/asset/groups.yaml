    }\n```\n*图 - 4.45*\n\nHTML 部分是：\n\n```javascript\nHTML:{\n  document.body.innerHTML\
    \ = `\n    <style>\n      .pixels {\n        height:10px;\n        width:10px;\n\
    \        background-color:#EEE;\n        position:absolute;\n      }\n      .pixels:hover{background-color:#F00;}\n\
    \      .on {background-color:#000;}\n    </style>\n    <div id=\"display\"></div>\n\
    \  `;\n}\n```\n*图 - 4.46*\n\n现在让我来逐行讲解每一行代码，以便我们更好地学习：\n\n首先是 **HTML** 标签，它涵盖了我们代码中大部分的\
    \ HTML & CSS 生成过程。\n\n这里有一个名为 **pixels** 的类，它属于我们画布上的每一个像素，它让我们的像素呈正方形。在现代，一个真正的像素是笔记本电脑屏幕上那些非常小的正方形之一，但在过去，那些正方形曾是巨大的，非常接近我们应用程序中的那些；如果我们尝试生成一个\
