    ## 箭头函数


    JavaScript 有编写函数的新方法。它更简单、更易管理，而且它更易读。首先，让我们看看旧方式和 ES6 方式之间的主要区别。


    旧方式：


    1 function funk() {

    3 // 这里的代码

    4 }


    *图 - 1. 44*


    ES6 方式：


    1 const funk = () => {

    3 // 这里的代码

    4 }


    *图 - 1. 45*


