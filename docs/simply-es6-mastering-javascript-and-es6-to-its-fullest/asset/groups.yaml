- md: "\n## Chapter 7 – Upgrading your Development Methodology\n\n### Babel, Webpack,\
    \ & Development Tools\n\nIf you approach the **package.json** file you may see\
    \ there are 2 kinds of dependencies described in them, there are the usual run\
    \ of the mill dependencies, and there are the devDependencies.\n\nDevelopment\
    \ dependencies are tools used to develop the software, they are not needed for\
    \ the software to be used. There is no need to package developer tools with your\
    \ app, once your work is done their work is done, so their cumbersome load will\
    \ not be included within your apps.\n\nLet’s see it this way, you are a carpenter,\
    \ you use hammers, screw drivers, screws, nails, etc. to develop a chair. When\
    \ you ship that chair you need to ship it with the nails and screws but not the\
    \ hammer and screw driver. The hammer and screw driver are the developer tools,\
    \ while the nails and screws are the dependencies, imagine that!\n\nAt one point\
    \ or another you will need some developer tools to rescue you from boilerplates,\
    \ and polyfills, etc. Development tools are also required to improve production\
    \ quality, time, etc. and add advanced functionality to your code. Most development\
    \ tools here are installed using Node Package Manager aka NPM using the following\
    \ syntax of Terminal commands:\n\n**npm i <pkg-name> --save-dev**\n\nModules installed\
    \ like this are installed as development dependencies.\n\n**Babel** is a developer\
    \ tool used to modify ES6 code to fit ES5 standards, as not all browsers and environments\
    \ support all features of ES6. Following Babel tools are used in standard ES6\
    \ development and you may need to install them at some point:\n\n1) babel-loader\n\
    2) babel-core\n3) babel-preset-es2015\n\nTerminal command to install all Babel\
    \ developer tools mentioned above:\n\n**npm i babel-loader babel-core babel-preset-es2015\
    \ --save-dev**\n\nFurther instructions for using Babel are available further down\
    \ the line.\n\n**Webpack** is a developer tool used to bundle your complex modules\
    \ with dependencies to simple static assets and minified and optimized distributions.\
    \ Basically it converts unsupported files to supported one.\n\nTerminal command\
    \ to install Webpack:\n\n**npm i webpack webpack-cli --save-dev**\n\nWebpack may\
    \ need a configuration file, if your Webpack is < v4.0.0 or you plan to add plugins\
    \ then it needs to be configured with a “**webpack.config.js**” configuration\
    \ file. A CLI for Webpack may also be needed. (see later sections to learn how\
    \ to setup webpack)\n\nMost development tools are updated very frequently and\
    \ you need to stay updated with their documentation if you want to use them often.\n\
    \n### The Import/Export\n\nThe **import/export** feature supplants the **require()**\
    \ method or HTML importing in JavaScript/ES6, with this kind of importing scripts\
    \ and modules becomes simpler to install and jack in. This feature wouldn’t work\
    \ in front-end apps without bundling with webpack to manually converting with\
    \ Babel. Webpack supports **import/export** features out of box, however if you\
    \ are using any other ES6 code that is not supported by your environment/browser\
    \ then you need to use Babel development tools to convert the code.\n\nI imagine\
    \ before there was modules, bindings, and libraries most of the code comprised\
    \ of boilerplate stuff, even in the era of using actual tape & punch cards for\
    \ logic processing. Thankfully now we have modules so we don’t have to deal with\
    \ boilerplates (code that is copy-pasted a lot).\n\n### Exports\n\nThe **export**\
    \ keyword is used to pass on data to whoever is importing it. There are two ways\
    \ to export data, the **default export** and the **named export**.\n\nA “**default\
    \ export**” is shown in Fig – 7.1:\n\n```javascript\nconst name = “Ray”;\nexport\
    \ default name;\n```\n*Fig - 7.1*\n\nHere we have exported the “**name**” variable\
    \ as this module’s default export. There can only be one default export per module.\n\
    \nA “**named export**” is shown in Fig – 7.2:\n\n```javascript\nexport const myVar\
    \ = “Ray”;\nexport function myFunk() {\nreturn “Hello World”;\n}\n```\n*Fig -\
    \ 7.2*\n\nHere we have exported both **myVar** and **myFunk** separately as named\
    \ exports. There is no limit to named exports.\n\n### Imports\n\nTo import node\
    \ modules we need to install them and load them by their name only, while importing\
    \ non-node modules we need to import them with their directory addresses.\n\n\
    The **import** keyword is used to add code that another script/module is exporting\
    \ to our script/module. We can import a singular method by name like in Fig –\
    \ 7.1 or the whole binding like in Fig – 7.2.\n\n```javascript\nimport { join\
    \ } from ‘lodash’;\n```\n*Fig - 7.3*\n\n```javascript\nimport _ from ‘lodash’;\n\
    ```\n*Fig - 7.4*\n\nThere are two types of **imports**:\n\n1. Imports from “default\
    \ exports”.\n2. Imports from “named exports”.\n\nDefault exports can be imported\
    \ with any name as shown in Fig – 7.5, “**import name from './names’**” can be\
    \ “**import anything from ‘names’**”. If Fig – 7.1 is the ‘**names**’ module then\
    \ this would be the import method.\n\n```javascript\nimport name from './names';\n\
    console.log(name);\n```\n*Fig - 7.5*\n\nFor importing named exports we need their\
    \ export names as shown in Fig – 7.6. If Fig – 7.2 is the ‘**names**’ module then\
    \ this would be the import method.\n\n```javascript\nimport { myVar, myFunk }\
    \ from './names';\n```\n*Fig - 7.6*\n\n**myVar** and **myFunk** cannot be named\
    \ anything else before importing successfully.\n\n### Multiple exporting:\n\n\
    Multiple Variables can be exported in a single line like in Fig – 7.7.\n\n```javascript\n\
    const myVar = “Ray”;\nfunction myFunk() {\nreturn “Hello World”;\n}\nexport {\
    \ myVar, myFunk };\n```\n*Fig - 7.7*\n\n### Renaming Exports with export/as:\n\
    \nNamed exports can be exported with different names than their originally declared\
    \ names, as shown in Fig – 7.8:\n\n```javascript\nconst myVar = \"Ray\";\nfunction\
    \ myFunk() {\nreturn \"Hello World\";\n}\nexport { myVar as name, myFunk as greet\
    \ };\n```\n*Fig - 7.8*\n\n### Setting up webpack\n\nFollow the following instructions:\n\
    \n1. Create a new directory for your app.\n2. Navigate to your directory with\
    \ Terminal.\n3. Initialize NPM with the following command: **npm init**\n4. Install\
    \ development tools webpack & webpack-cli with: **npm i webpack webpack-cli --save-dev**\n\
    5. In your app make  new folders “dist” and “src”.\n    a. The “dist” directory\
    \ will hold the final, converted to ES5, Uglified, and Minified post webpack bundled\
    \ files.\n    b. The “src” directory holds the source code that need to be bundled\
    \ with webpack.\n6. Modify your **package.json** file by adding the following\
    \ properties:\n   ```json\n   \"scripts\": {\n     \"webpack\": \"webpack\"\n\
    \   }\n   ```\n7. At this point install any dependencies you want bundled with\
    \ your app, examples include “**npm i lodash --save**” etc.\n8. Now **import**\
    \ these modules in your **src/index.js** which has ES6 and other unsupported code.\n\
    9. Using Terminal to navigate to your app’s directory and execute the command:\
    \ “**npx webpack**”. Note: If you have this command set up in the **scripts**\
    \ property of **package.json** then you can execute it by “**npm run webpack**”\
    \ command.\n\nAfter following these instruction you will see some output, possibly\
    \ with a warning like the following example. Now if you load and use the **dist/main.js**\
    \ script (which is the post-webpack version of **src/index.js**) you will able\
    \ to run all the code flawlessly.\n\nNow remember, you work on the JavaScript\
    \ files in the **./src** directory and after bundling them with webpack you use\
    \ their bundled corresponding javascript files in the **./dist** directory.\n"
  mdcn: "\n\n## 第 7 章 – 升级你的开发方法\n\n### Babel, Webpack 与开发工具\n\n如果你查看 **package.json**\
    \ 文件，可能会发现其中描述了 2 类依赖：一种是普通的依赖，另一种是 devDependencies（开发依赖）。\n\n开发依赖是用于开发软件的工具，软件运行时不需要它们。没有必要将开发者工具打包到你的应用中，一旦你的工作完成，它们使命就结束了，因此它们沉重的负载不会包含在你的应用中。\n\
    \n我们可以这样想：你是一个木工，你使用锤子、螺丝刀、螺丝、钉子等来制作一把椅子。当你交付这把椅子时，你需要带上钉子和螺丝，但不需要锤子和螺丝刀。锤子和螺丝刀是开发工具，而钉子和螺丝是依赖，想象一下！\n\
    \n在某些时刻，你需要一些开发者工具来帮你从样板代码、补丁（polyfills）等中解脱。开发工具还需要提高生产质量、效率等并为你的代码添加高级功能。这里的大多数开发工具都是使用\
    \ Node Package Manager（简称 NPM）通过以下终端命令安装的：\n\n**npm i <pkg-name> --save-dev**\n\
    \n以此方式安装的模块将作为开发依赖安装。\n\n**Babel** 是一种开发工具，用于将 ES6 代码修改以符合 ES5 标准，因为并不是所有的浏览器和环境都支持\
    \ ES6 的所有功能。以下 Babel 工具用于标准的 ES6 开发，你可能在某时需要安装它们：\n\n1) babel-loader\n2) babel-core\n\
    3) babel-preset-es2015\n\n安装上述所有 Babel 开发者工具的终端命令：\n\n**npm i babel-loader babel-core\
    \ babel-preset-es2015 --save-dev**\n\n关于使用 Babel 的进一步说明将在后文中给出。\n\n**Webpack**\
    \ 是一种开发工具，用于将你复杂的模块及其依赖打包成简单的静态资源，以及经过压缩和优化的发行版本。基本上，它将不支持的文件转换为支持支持的文件。\n\n安装\
    \ Webpack 的终端命令：\n\n**npm i webpack webpack-cli --save-dev**\n\nWebpack 可能需要一个配置文件，如果你的\
    \ Webpack 版本小于 v4.0.0 或者你计划添加插件，那么它需要通过“**webpack.config.js**”配置文件进行配置。可能还需要 Webpack\
    \ 的 CLI（命令行界面）。（参见后文章节学习如何设置 webpack）\n\n大多数开发工具的更新非常频繁，如果你经常使用它们，就需要一直关注它们的文档更新。\n\
    \n### 导入/导出 (Import/Export)\n\n**import/export** 功能在 JavaScript/ES6 中取代了 **require()**\
    \ 方法或 HTML 导入，通过这种方式，脚本和模块的导入变得更容易安装和接入。如果没有通过 webpack 打包并使用 Babel 进行手动转换，此功能在前端应用中无法工作。Webpack\
    \ 原生支持 **import/export** 功能，但如果你在使用任何你的环境/浏览器不支持的 ES6 代码，那么你就需要使用 Babel 开发工具来转换代码。\n\
    \n我想象在有模块、绑定和库出现之前，大部分代码都由样板内容组成，即使在实际使用磁带和打孔卡进行逻辑处理的时代也是如此。幸好我们现在有了模块，我们就不再需要处理样板代码（大量复制粘贴的代码）。\n\
    \n### 导出 (Exports)\n\n**export** 关键字用于将数据传递给导入它的人。导出数据有两种方式：**默认导出（default export）**和**命名导出（named\
    \ export）**。\n\n图 - 7.1 显示了“**默认导出**”：\n\n```javascript\nconst name = “Ray”;\n\
    export default name;\n```\n*图 - 7.1*\n\n在这里，我们将“**name**”变量作为此模块的默认导出。每个模块只能有一个默认导出。\n\
    \n图 - 7.2 显示了“**命名导出**”：\n\n```javascript\nexport const myVar = “Ray”;\nexport\
    \ function myFunk() {\nreturn “Hello World”;\n}\n```\n*图 - 7.2*\n\n在这里，我们分别将 **myVar**\
    \ 和 **myFunk** 作为命名导出导出。命名导出的数量没有限制。\n\n### 导入 (Imports)\n\n要导入 node 模块，我们需要安装它们并仅通过名称加载它们；而导入非\
    \ node 模块时，我们需要通过目录地址进行导入。\n\n**import** 关键字用于将另一个脚本/模块导出的代码添加到我们的脚本/模块中。我们可以通过名称导入单个方法（如图\
    \ - 7.1 所示），也可以导入整个绑定（如图 - 7.2 所示）。\n\n```javascript\nimport { join } from ‘lodash’;\n\
    ```\n*图 - 7.3*\n\n```javascript\nimport _ from ‘lodash’;\n```\n*图 - 7.4*\n\n导入**imports**）有两种类型：\n\
    \n1. 从“默认导出”导入。\n2. 从“命名导出”导入。\n\n默认导出可以使用任何名称进行导入，如图 - 7.5 所示，“**import name\
    \ from './names’**”可以写为“**import anything from ‘names’**”。如果图 - 7.1 是“**names**”模块，那么这就是这种导入方法。\n\
    \n```javascript\nimport name from './names';\nconsole.log(name);\n```\n*图 - 7.5*\n\
    \n导入命名导出需要使用它们的导出名称，如图 - 7.6 所示。如果图 - 7.2 是“**names**”模块，那么这就是这种导入方法。\n\n```javascript\n\
    import { myVar, myFunk } from './names';\n```\n*图 - 7.6*\n\n在成功导入之前，**myVar**\
    \ 和 **myFunk** 可以重命名。\n\n### 多变量导出 (Multiple exporting):\n\n多个变量可以在同一行中导出，如图 -\
    \ 7.7 所示。\n\n```javascript\nconst myVar = “Ray”;\nfunction myFunk() {\nreturn\
    \ “Hello World”;\n}\nexport { myVar, myFunk };\n```\n*图 - 7.7*\n\n### 使用 as 重命名导出\
    \ (Renaming Exports with as):\n\n命名导出可以使用与原始声明不同的名称进行导出，如图 - 7.8 所示：\n\n```javascript\n\
    const myVar = \"Ray\";\nfunction myFunk() {\nreturn \"Hello World\";\n}\nexport\
    \ { myVar as name, myFunk as greet };\n```\n*图 - 7.8*\n\n### 设置 webpack (Setting\
    \ up webpack)\n\n遵循以下步骤：\n\n1. 为你的应用创建一个目录。\n2. 在终端进入该目录。\n3. 使用以下命令初始化：`npm init`\n\
    4. 安装开发工具 webpack & webpack-cli：`npm i webpack webpack-cli --save-dev`\n5. 在应用中创建文件夹“dist”和“src”：\n\
    \    a. “dist”目录将包含转换为 ES5、经过压缩和最小化的 webpack 打包文件。\n    b. “src”目录包含需要用 webpack\
    \ 打包的源码。\n6. 通过修改 **package.json** 文件来添加以下属性：\n   ```json\n   \"scripts\": {\n\
    \     \"webpack\": \"webpack\"\n   }\n   ```\n7. 此时安装任何随应用打包的依赖项，示例包括 `npm i lodash\
    \ --save` 等。\n8. 现在在 **src/index.js** 中导入这些模块，该文件包含 ES6 和其他不支持的代码。\n9. 使用终端进入应用目录并执行命令：`npx\
    \ webpack`。注意：如果你已经在 **package.json** 的 **scripts** 属性中设置了该命令，可以通过 `npm run webpack`\
    \ 命令执行。\n\n按照这些指令操作，你将看到某些输出，可能包含类似示例的警告。现在如果你加载并使用 **dist/main.js** 脚本（它是 **src/index.js**\
    \ 的 webpack 版本），你将能够无缝运行所有代码。\n\n现在记住，你在 **./src** 目录中处理 JavaScript 文件，在使用 webpack\
    \ 打包后，使用 **./dist** 目录中对应的对应的 JavaScript 文件。\n\n"
