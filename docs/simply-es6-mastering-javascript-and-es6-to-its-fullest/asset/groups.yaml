    See how the output is **true** 5 times once for each member of the array **myString**,
    and **false** for its last member. The blue colored “**i**” flag in Fig – 9.7
    after the Regex string pattern “**ray**” is used to tell the Regex to search for
    the string without the case-sensitivity requirement (Colorization may be different
    in your editor).


    ### Extracting strings with match()


    The **match()** method of strings can be passed a Regex to find and extract a
    string matching the provided Regex pattern. Look at the following code:


    ```javascript

    1 const myString = "Hello World! ";

    2 const myRegex = /world/i;

    3

    4 console.log(myString.match(myRegex));

    ```

    *Fig - 9.9*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_223_1.png)


    *Fig - 9.10*


    Here on line #1 we have an arbitrary string. On line #2 we have a Regex pattern
    that finds the string **“world”** while ignoring the case-sensitivity. On line
    #4 we have used the **match()** method of **myString** and passed it the argument
    **myRegex**, then logged the result. The **match()** will return an array with
    the only member being the first instance.


    To get an array of all instances we need to pass the “**g**” flag to the Regex
    (yes, we can pass multiple flags).


    ```javascript

    1 const myString = "baa Sheep";

    2 const myRegex = /baa/ig;

    3

    4 console.log(myString.match(myRegex));

    ```

    *Fig - 9.11*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_224_0.png)


    *Fig - 9.12*


    See the blue colored “**g**” flag in Fig – 9.11 together with the “**i**” flag?
    That tells the Regex to find all the occurrences.


    Now if we want to find a word and it’s misspelled? Then we can use a wild character
    of Regex, a simple dot/period is used to replace characters. Let’s look at the
    following code:


    ```javascript

    1 const myString = "baa Sheep";

    2 const myRegex = /b.a/ig;

    3

    4 console.log(myString.match(myRegex));

    ```

    *Fig - 9.13*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_224_1.png)


    *Fig - 9.14*


    See, now the Regex pattern in **myRegex** tells the **match()** method to find
    all occurrences of a string in which the first character is “b”, the second character
    can be anything, and the third character is “a”.


    Now there is another thing you need to learn to improve your Regex pattern, take
    a look at the following code, particularly the bits between the braces “**[iu]**”:


    ```javascript

    1 const myString = "bitter better";

    2 const myRegex = /b[iu]tter/ig;

    3

    4 console.log(myString.match(myRegex));

    ```

    *Fig - 9.15*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_225_0.png)


    *Fig - 9.16*


    The characters “u” and “i” enclosed between the braces “**[]**” in **myRegex**
    tells the Regex pattern that the second character of the string to find is either
    “i” or “u”. You can add 3 or more characters between the braces too.


    Now if you don’t know the particular characters and you don’t want to use the
    wildcard character, then you can use the **hyphen** character prefixed with the
    starting letter (a) and suffixed with the ending letter (b) to tell the Regex
    that the character can be any character in-between (a) and (b). Take a look at
    the following code:


    ```javascript

    1 const myString = "bcdfghjmnpqrstvwxyz";

    2 const myRegex = /[a-m]/ig;

    3

    4 console.log(myString.match(myRegex));

    ```

    *Fig - 9.17*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_225_1.png)


    *Fig - 9.18*


    Here on line #1 we have an arbitrary string. On line #2 we have a Regex pattern
    that tells us to find **each** character from “**a**” to “**m**” ignoring **case-sensitivity**.
    On line #4 we have logged our results after using the **match()** method.


    ### Numbers and Regex


    Now you don’t have to test or match alphabet characters only, you can also write
    a numeric Regex pattern. Let’s take a look at the following code:


    ```javascript

    1 const myString = "0123456789";

    2 const myRegex = /[3-7]/g;

    3

    4 console.log(myString.match(myRegex));

    ```

    *Fig - 9.19*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_226_0.png)


    *Fig - 9.20*


    See how Regex returns all numbers in-between 3 and 7? This way you can hunt down
    numbers in-between any other numbers (integers). Now if we need to test or match
    on a discontinued interval we can do the following:


    ```javascript

    1 const myString = "0123456789";

    2 const myRegex = /[1-37-9]/g;

    3

    4 console.log(myString.match(myRegex));

    ```

    *Fig - 9.21*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_226_1.png)


    *Fig - 9.22*


    Here the Regex is searching for numbers in-between 1 and 9, however all the numbers
    in-between 4 and 6 are ignored due to the discontinuity.


    ### Alphabets and Numbers


    We can tell the Regex pattern that the character is either an alphabet or a number
    using the following trick:


    ```javascript

    1 const myString = "0123456789ajci";

    2 const myRegex = /[a-z1-3]/g;

    3

    4 console.log(myString.match(myRegex));

    ```

    *Fig - 9.23*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_227_0.png)


    *Fig - 9.24*


    Here the Regex pattern tells us that the character is either a small cased alphabet
    from **a** to **z**, or a number in-between **1** and **3**.


    ### Negated character sets


    Now instead of telling the Regex pattern what characters to find we can tell it
    to ignore certain characters and find everything else. Let’s look at the following
    code:


    ```javascript

    1 const myString = "01234ajci!@";

    2 const myRegex = /[^a-i]/g;

    3

    4 console.log(myString.match(myRegex));

    ```

