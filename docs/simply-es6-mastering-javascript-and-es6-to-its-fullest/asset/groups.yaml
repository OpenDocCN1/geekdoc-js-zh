- md: "\nNow let’s iterate through a Map:\n\n```javascript\nconst myMap = new Map();\n\
    \nmyMap.set(\"fName\", \"John\");\nmyMap.set(\"lName\", \"Doe\");\nmyMap.set(\"\
    age\", 40);\n\nlet myArray = [\"fName\", \"lName\", \"age\"];\n\nmyArray.forEach(key\
    \ => {\n  console.log(myMap.get(key));\n});\n```\n*Fig - 8.43*\n\nOutput:\n![](img/8a6860449d086ad6675add2b749bcc36_212_0.png)\n\
    *Fig - 8.44*\n\nSee how on line #10 we used **myMap.get()** to get the values\
    \ of each key using the **forEach()** method on lines #9 to #11.\n\n## Adding\
    \ Metadata with Maps\n\nMaps can be used to store Metadata, that is data about\
    \ data. Since we can pair one thing with another, we can pair one object with\
    \ information about that object. Let’s take a look at the following code:\n\n\
    ```javascript\nconst myMap = new Map();\nconst John = {\n  name: \"John\",\n \
    \ age: 40\n};\n\nmyMap.set(John, \"John’s Bio\");\n\nconsole.log(myMap);\nconsole.log(myMap.get(John));\n\
    ```\n*Fig - 8.45*\n\nOutput:\n![](img/8a6860449d086ad6675add2b749bcc36_213_0.png)\n\
    *Fig - 8.46*\n\nHere on line #7 our key is an Object, and our corresponding value\
    \ is **“John’s Bio”** and when we logged the value of **John** (which is an object)\
    \ we got information about that object aka its Metadata **“John’s Bio”**. However\
    \ don’t try to replace comments with Metadata, that is just foul play.\n\n## WeakMaps\n\
    \nWeakMaps are a little sister of Maps. Their features are:\n\n1) They have no\
    \ length.\n2) Their keys must be objects.\n3) They cannot be iterated over, they\
    \ are not enumerable.\n4) They are garbage collected.\n\nLet’s take a look at\
    \ the following code:\n\n```javascript\nlet myJohn = {\n  name: \"John\",\n  age:\
    \ 40\n};\n\nlet myWeakMap = new WeakMap();\n\nmyWeakMap.set(myJohn, \"John’s Bio\"\
    );\nconsole.log(myWeakMap);\n```\n*Fig - 8.47*\n\nOutput:\n![](img/8a6860449d086ad6675add2b749bcc36_214_0.png)\n\
    \nSee, in the output **myWeakMap** has no length prop. Also when we delete the\
    \ **name** & **age** prop it is also deleted from the WeakMap; however here it\
    \ gets a little delicate, you see this disappearance may or may not happen due\
    \ to two of the reason:\n\n1) The props disappear because in JavaScript objects\
    \ are called by reference to the first object up the assignment chain.\n2) The\
    \ props disappear because they were garbage collected.\n\nWhat happens to the\
    \ data depends upon the framework, environment, etc. and there may be memory leaks\
    \ you need to be aware of.\n\n## Practice Project\n\nNow we will make a project\
    \ and then you will make a MVP version of it! Today we are making a simple “ES6\
    \ features database” app. Here we are using Atom, and Webpack to build this project,\
    \ but you can use anything you like.\n\nHere are the checkpoints, take it as it\
    \ comes:-\n\n1) Write the HTML, CSS, & JS files separately.\n2) Make an “ES6 features\
    \ database”.\n3) Use ES6, and any of the following: Webpack, Babel, BrowserSync\
    \ and SystemJS.\n4) Use ATOM, GIT, & ESLint.\n5) Make sure all files are properly\
    \ linted & working.\n\nGoing through this exercise will take you through the steps\
    \ one by one until they become instinctive. The following instructions assume\
    \ that you have Atom, Git, NPM, & ESLint pre-installed globally.\n\nSteps:-\n\n\
    1) Make a new directory from which we will work from.\n2) Add this directory to\
    \ Atom as a project.\n3) Initialize this folder with NPM using “**npm init**”\
    \ command in a Terminal; this will add the **package.json** file to this directory.\n\
    4) Install the following packages with NPM: (command “**npm i <pkg> --save**”)\n\
    \   a. Webpack: **npm i webpack webpack-cli --save-dev**\n5) In your app directory\
    \ make 2 new folders named “dist” and “src”, they will be used to hold distribution\
    \ files and source code.\n6) Modify your “**package.json**” file by adding the\
