    如果执行第 #6 行和第 #7 行的代码，它将向 **input** 数组追加 **“0”**，直到其长度达到 18 个字符。


    然后在第 #8 行，我们将遍历 **input** 数组，并将数组中的每个成员替换为其 ASCII 键值。


    在第 #9 行，我们将再次遍历 **input** 数组，并根据 ASCII 键值小于或大于 100，将每个成员替换为“0”或“1”。


