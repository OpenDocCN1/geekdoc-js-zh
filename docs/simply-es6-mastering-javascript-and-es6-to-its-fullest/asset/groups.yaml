    \ 模板字符串可以让操作 DOM 更具可读性。\n7) 留下 JS 注释。\n8) 在 ES6 中，我们可以用函数标记模板字符串以进行预处理。\n9) 标记函数接受多个参数，首先是字符串数组，随后是由字符串内部变量组成的数组；所有这些变量/代码可以使用函数参数中的剩余运算符（rest\
