    **Chapter 5 – Requests & Promises**


    **Promise & fetch**


    A promise is an assurance we give to someone that we will carry out some action.
    Code


    has promises too, when doing something a **Promise** assures us that it will be
    done, it may not be


    able to do it straightaway but somewhere down the line it will be done.


    In JavaScript it goes like this: If you ask for some data either you will get
    it, or you will get


    an error; but another thing you can get is a **Promise**.


    A **Promise** works like this, I ask my associate to get me the information of
    our client


    “John”.


    My associate says “Ok, I am going to look for that information but I **Promise**
    that I will


    come back with an answer.” Then she goes to look for it.


    After a while I ask her about John and she replies “Still searching of that info”.
    (Also


    known as promise pending in JavaScript).


    After she finds the info she comes by and stands near the phone instead of giving
    me the


    information (she is exceptionally gawky). I have to ask for it, only then she
    says “I have fulfilled my


    promise, here is the info you needed”.


    Let’s look at the following code:


    Input:


    1  <!doctype html>


    2  <html>


    3  <head>


    4  <meta  charset="UTF-8">


    5  </head>


    6  <body>


    7  <script>


    8


    9  let  myRes  =  fetch("http://localhost:3000/database");


    10  console.log(myRes);


    11


    12  </script>


    13  </body>


    14  </html>


    15  <!--just a comment -->


    *Fig - 5\. 1*


    On line #9 I have asked my associate to fetch some information from


    “**localhost:3000/database**” (I will make available the NodeJS back-end code
    later in this chapter).


    On line #10 I ask her what info she was able to find.


