    ## Fixing Lint Errors


    Remember back in chapter 2 we made a markdown previewer? Let’s try Airbnb linting
    on that, output in Fig – 6.18.

    ![](img/8a6860449d086ad6675add2b749bcc36_150_1.png)

    *Fig - 6.18*


    Look at that! 62 problems! Looks like we have got our hands full! Let’s take them
    one by one! (We will learn to use the **fix** flag later)


    **Problems:**


    1) The **no-tabs** errors are fixed by replacing tab characters with single spaces
    on the given row:col. Once we fix all the no-tab problems we have 43 problems
    left! Nearly 30% of the errors were because of the no-tabs rule.

    2) The **indent** errors are fixed by giving each line the expected number of
    space characters. Once we fix all the indent problems we have 32 problems left!
    Nearly 12% of the errors were because of the indent rule. According to this rule
    whenever we feel the need to use a tab we should just replace it with 2 space
    characters instead.

    3) The **no-param-reassign** errors are fixed by declaring new variables and assigning
    them the values of parameters instead of mutating parameters directly. (Every
    time we mutate a parameter we also mutate the arguments keyword). In our markdown
    previewer code there was only 1 no-param-reassign code but in a large code base
    this error cease wonders.

    4) The **quotes** errors are fixed by using the desired string symbol everywhere
    we need strings; the Airbnb style-guide prefers single quotes. Once we fix all
    the quotes problems we have 19 problems left! 12 of the errors were because of
    the quotes rule.

    5) The **no-undef** errors occur when we use an undefined Variable and these errors
    are fixed by telling ESLint that we have a global variable. Once we fix all the
    no-undef problems we have 18 problems left! Only 1 of the errors were because
    of the no-undef rule.

    a) This error is for DOMPurify Variable we used and it existed because of the
    way we loaded the library.

    b) Here we did this on purpose, later we will learn to import/export libraries
    and code.

    c) Now we can tell ESLint that we have global variables in the global setting,
    or we can do it by setting it up with individual files like the following technique.

    d) To tell ESLint that we have a global variable we can just use the top line
    of our code to give it a “globals” header supplied with the names of the global
    Variables used. Example in Fig – 6.19:

    ![](img/8a6860449d086ad6675add2b749bcc36_151_0.png)

    *Fig - 6.19*


    6) The **max-len** errors occur because we have exceeded the amount of characters
    allowed (by the style-guide) within a single line. Here we are getting a max-len
    error because of a comment I have on lines #52 to #74 which holds some content
    I copy/paste in the markdown-previewer to test it. Fortunately we only had 1 max-len
    error to fix, these errors are dragon-slayers! As a personal rule I avoid writing
    lines longer than 22 characters as much as I can.

    7) Now it’s time to use the --fix flag to fix our linting problems, I discourage
    the use of this flag unless you know the errors you are fixing and your code inside
    n’ out, and know that fixing these errors like this wouldn’t harm your code.

