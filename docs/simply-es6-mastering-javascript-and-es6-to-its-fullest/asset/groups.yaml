    ![](img/8a6860449d086ad6675add2b749bcc36_215_0.png)\n*图 - 8.48*\n7) 在你的 **package.json**\
    \ 文件的 script 属性中添加以下脚本。\n![](img/8a6860449d086ad6675add2b749bcc36_215_1.png)\n\
    *图 - 8.49*\n8) 向你的应用添加初始的 **src/index.js**、**dist/index.html**, **dist/main.css**\
