    **[1,2,3,4,5]** 赋值给后续名为 **arr** 的变量；然后将同一个数组赋值给另一个后续名为 **arr2** 的变量；在原数组末尾附加 **`a`**”。现在如果
    **arr** 和 **arr2** 都指向相同的数据（来自内存），对其中任何一个所做的修改实际上都是对数据本身进行的，当任一变量调用该数据时，它们都会得到修改后的版本；这被称为按引用赋值，数据没有被复制而是纠缠在一起，结果是两个数组都受对方的影响。


    现在如果我们想复制数据，必须使用巧妙的技巧，其中一种就是使用剩余/展开运算符。看以下代码学习如何操作：


    *输入:*


    ![](img/8a6860449d086ad6675add2b749bcc36_113_0.png)

    *图 - 4.31*


    *输出:*


    ![](img/8a6860449d086ad6675add2b749bcc36_113_1.png)

    *图 - 4.32*


    现在如果你对比 图 – 4.29 & 图 – 4.30 与 图 – 4.31 & 图 – 4.32，你会意识到剩余/展开运算符有多价值。图–4.31 中第
    #2 行到 #4 行意思是：“将数组 **[1,2,3,4,5]** 赋值给变量 **arr**；然后将该值赋值给另一个变量 **arr2**；在 **arr**
    末尾附加 `a`”。这次我们独立地修改了一个数组而不影响另一个；在这种情况下两个数组是相互独立的。


    剩余/展开运算符的另一个不错用法是函数，看以下代码：


    ```javascript

    2 function myFunk() {

    3 return Array.from(arguments).reduce((prev, next)=>prev-next);

    }

    5 let args = ["...1234"].map(x=> +x);

    6 console.log(myFunk.apply(null, args));

    ```

    *图 - 4.33*


    有一种更简单的写法：


    ```javascript

    2 function myFunk(...params) {

    3 return params.reduce((prev, next)=>prev-next);

    }

    5 let args = ["1234"].map(x=> +x);

    6 console.log(myFunk(...args));

    ```

    *图 - 4.34*


    现在这里了几点要学习，但首先，让我们读读这段代码，它是这样的：“声明一个过程，将传递给它的所有参数归约为值；当传递参数 [1,2,3,4] 时返回结果”。第
    #2 行的 **...params** 意思是：“将第一个参数存储在 **params** 中，然后将剩余的参数存储在 **params** 中”。这里剩余运算符可以被称为“剩余参数”，因为它将剩余的值赋值给变量。


    第 #3 行的 reduce 方法通过取第一个值、减去第二个值、再减去第三个值，以此类推，直到数组中没有成员；然后返回最终值。


    第 #5 行意思是：“将字符串 `1234` 中的每个字符**展开**成数组，将每个字符转换为数字，将该数组设为名为 **args** 的变量”。这里剩余/展开运算符可以被称为“展开运算符”，因为它从变量中取出值并展开它们。第
    #6 行意思是：“将 **args** 数组的每个成员展开到 **myFunk()** 的参数部分并传递这些参数，打印结果”。


    现在明确一点，什么时候叫“剩余”，什么时候叫“展开”？我有一个简单的判断方法：如果运算符给变量赋值，它就是“剩余参数”，如果运算符从变量取出值并展开，它就是“展开运算符”。


