    \ have some experience with this stuff then I suggest reading the book “Simply\
    \ Development”. To make these project you’ll need NodeJS and NPM installed on\
    \ your computer. The use of the following packages is recommended, however we\
    \ will not use most of them:\n\nPackages List:\n- cli – To make CLI programs.\n\
    - blessed – A curses-like library for interface development.\n- Chalk, To color\
    \ text output.\n- ink - To use React to build CLIs.\n- forever – For running scripts.\n\
    - grunt – For jobs.\n- clear – To clears screen.\n- Ora – For amazing spinners.\n\
    - clui – To draws command-line tables, gauges, and spinners.\n- figlet — To convert\
    \ text to ASCII art.\n- boxen - To draw boxes around your text.\n- Inquirer, enquirer,\
    \ prompts — To create complex, interactive CLI.\n- Minimist, commander, yargs,\
    \ arg — To parse arguments, and sub-commands.\n- configstore — To save and load\
    \ config.\n- oclif, gluegun – For building extensible CLIs by Heroku.\n- tmux\
    \ – To get Tmux/Screen (multiplexer) like UI.\n- email-prompt - For prompts.\n\
    - execa which allows us to easily run external commands like git.\n- pkg-install\
    \ to trigger either yarn install or npm install depending on what the user uses.\n\
    - listr which lets us specify a list of tasks and gives the user a neat progress\
    \ overview.\n- shellJS – for running Shell commands\n\nThere are several NPM packages\
    \ available on npm.com, One thing to be clear on is that none of these Packages\
    \ are needed to make CLI programs, only NodeJS and NPM is required any important\
    \ packages like ShellJS, Chalk, Figlet, etc. will be used in the following projects.\
    \ Knowing about stuff like Arguments is important but not required. I will be\
