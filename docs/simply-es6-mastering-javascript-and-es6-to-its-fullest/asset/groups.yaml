    with an exclamation mark as suffix instead of **“about”** excluding the exclamation
    mark.


    ### Successive matching


    Now if a character is repeated twice in succession and we just want to match to
    the first occurrences of that character, then we can use the plus sign to do this
    job. Let’s take a look at the following code:


    ```javascript

    1 const myString = "pizzazz";

    2 const myRegex1 = /z+/g;

    3 const myRegex2 = /z/g;

    4

    5 console.log(myString.match(myRegex1));

    6 console.log(myString.match(myRegex2));

