    a string, and if that “z” character is followed by another “z” character then
    it pairs it with that “z” before returning it, otherwise a single “z” character
    is returned.


    In comparison **myRegex2** signifies a pattern that matches every individual “z”
    regardless of what follows or precedes it.


    Now if you want to match all the identical, successive characters in a string
    then you can use an asterisk/star instead of a plus. Look at the following code:


    ```javascript

    1 const myString = "Snaaaaaaap! Snaaaap!";

