    \ a **for...of** loop on line #7; both loops are identical with the exception\
    \ of in/of keywords. A **for...in** loop logs only the index numbers in an array,\
    \ on the other hand a **for...of** loop logs only the values in that array.\n\n\
    Note that without for...of loop we can modify the **for...in** loop to do the\
    \ same job, however both these looping methods have significance. Take a look\
    \ at the following code:\n\n```javascript\nfor (let x in arr) {\n  x = arr[x];\n\
    \  console.log(x);\n  x = arr.indexOf(x);\n}\n\nfor (let x of arr) {\n  console.log(x);\n\
    }\n```\n\nFig-3.30\n\nBoth of these loops do the same thing, the for...in loop\
    \ just looks a bit low on its luck. The outcome of their performance may depend\
    \ on how they are compiled. The for...of loop is multifunctional too, it can be\
    \ used to get both the value and its index simultaneously. Here, take a look:\n\
    \n```javascript\nlet arr = [\"Proton\", \"Neutron\", \"Electron\", \"Posron\"\
    ];\nfor (let x of arr.entries()) {\n  console.log(x);\n}\n```\n\nFig-3.31\n\n\
    Output:\n\n![](img/8a6860449d086ad6675add2b749bcc36_77_0.png)\n\nFig-3.32\n\n\
    Using the **entries()** method permitted us to get both the index and its value\
