    *Fig - 7\. 28*


    Then you can just use a Terminal to navigate to the folder you need to host and


    execute the following command to host it:


    “**npm run server**”


    This is the way to go for non-windows users. It’s very convenient.


    **Babel**


    Wehave already established the following definition **“Babel** is a developer
    tool used to


    modify ES6 code to fit ES5 standards”, however Babel is so much more than that,
    it can be used to


    convert ES6 to ES5, it can be used to access features beyond ES6, it can be used
    to access


    experimental features of JavaScript, and it alone can be used to perform many
    essential function of


    development. A list of Babel plugins is available on its official website.


    Now we don’t need all the features of Babel right now, we just need the ES6 features
    from


    it, we can install them manually but that is not needed, we are going to install
    a ES6 aka ES2015


    “**preset**” which comes will all the ES6 features.


    Instruction to setup & use Babel:


    1)


    Use a Terminal to navigate to your app directory.


    2)


    Check NodeJS and NPM installations.


    3)


    Initialize NPM with “**npm init**”.


    4)


    Install Babel-cli and ES6 preset using “**npm i babel-cli babel-preset-es2015
    --save**”.


    5)


    Now our directory should look like this:


    ![](img/8a6860449d086ad6675add2b749bcc36_176_0.png)


    *Fig - 7\. 29*


