- md: "\n![](img/8a6860449d086ad6675add2b749bcc36_203_0.png)\n\nHere we have a simple\
    \ Proxy, to which we have passed an empty object, and a handler.\n\nThe first\
    \ trap in the handler is getting us the object’s prop we asked for when we called\
    \ it. The second trap in the handler is setting the new value of the trap when\
    \ we assign a new contact to **contacts**. So every time we call a prop of **contacts**\
    \ or assign a value to it we are doing it through a proxy that handles each call\
    \ and assignment through getters and setters.\n\nOn the website of MDN you can\
    \ find more traps and try them out.\n\n## Applications of Proxy\n\nFollowing are\
    \ a few applications of proxies.\n\n1) You need to correct the spelling of a prop.\n\
    2) You need to control the output and input of an object.\n3) You need to control\
    \ the assignment of props.\n4) You need to restrict information flow from that\
    \ object.\n5) You need to make libraries for better information flow control.\n\
    \nThis is just from the top of my head, the sky is the limit.\n\nLet’s look at\
    \ the following code:\n\n```javascript\nconst myObj = new Proxy({}, {\n  get(target,\
    \ name) {\n    return target[name];\n  },\n  set(target, name, value){\n    return\
    \ target[name.toLowerCase()] = value;\n  }\n});\n```\n*Fig - 8.28*\n\nOutput:\n\
    \n![](img/8a6860449d086ad6675add2b749bcc36_204_0.png)\n\n*Fig - 8.29*\n\nThe proxy\
    \ in this code ensures that every prop is named in all-small-cased letters, this\
    \ is because we have controlled the assignments to this object via its Proxy.\n\
    \n## Sets\n\nSets are a simple and very useful tool in ES6, there are more or\
    \ less sort of a sister to Arrays. If you are conditioned to using Arrays then\
    \ I suggest you start using Sets until their use becomes instinctive and strategic.\
    \ Sets are not meant to be used everywhere, we should approach them with the intent\
    \ of cutting down code quantity.\n\nLet’s take a look at the following code:\n\
    \n```javascript\nlet myFriends = new Set([\"Anna\", \"Jason\", \"Donna\"]);\n\
    console.log(myFriends);\n\nmyFriends.add(\"Eddie\");\nconsole.log(myFriends);\n\
    \nmyFriends.delete(\"Donna\");\nconsole.log(myFriends);\n```\n*Fig - 8.30*\n\n\
    Output:\n\n![](img/8a6860449d086ad6675add2b749bcc36_205_0.png)\n\n*Fig - 8.31*\n\
    \nOn line #1 we have declared a new set, it takes an array as its argument and\
    \ returns an array like data structure.\n\nOn line #4 we have added another item\
    \ \"**Eddie**” to the set using the **add()** method.\n\nOn line #7 we have removed\
    \ and item \"**Donna**” from the list.\n\nThis is how we create Sets, add to them\
    \ and remove particular values from them. Another thing you need to learn is:\
    \ not to add the same value more than once, if you do it nothing will happen,\
    \ or it will just overwrite the identical value.\n\nNow let’s take a look at the\
    \ following code:\n\n```javascript\nlet myFriends = new Set([\"Anna\", \"Jason\"\
    , \"Carlie\"]);\nconsole.log(myFriends);\n\nlet list = myFriends.values();\n```\n\
    *Fig - 8.32*\n\n*Output:*\n\n![](img/8a6860449d086ad6675add2b749bcc36_206_0.png)\n\
    \nThis code creates a generator using the **values()** method, then we can use\
    \ the **next()** method of the generator to iterate through the values.\n\n**Note:**\
    \ Sets are not enumerable, you can’t iterate through them using loops, maps, and\
    \ stuff; to iterate through them you need something like a generator.\n\n**Note:**\
    \ When using the **next()** method remember once the method pops out a value to\
    \ us it also removes it from the Set; this makes the **next()** method act like\
    \ a first come first serve waitress that throws out the customers once they are\
    \ done eating.\n\n**Note:** Sets don’t have index numbers like Arrays.\n\nNow\
    \ let’s take a look at the following code:\n\n```javascript\nlet myFriends = new\
    \ Set([\"Anna\", \"Jason\", \"Carlie\"]);\nconsole.log(myFriends);\n\nlet keyList\
    \ = myFriends.keys();\nconsole.log(keyList);\n```\n*Fig - 8.33*\n\nOutput:\n\n\
    ![](img/8a6860449d086ad6675add2b749bcc36_207_0.png)\n\n*Fig - 8.34*\n\nNow here\
    \ we have used the **keys()** method to get list of keys in this Set, just like\
    \ an object; however the keys are just the values. Notice the keys and their values\
    \ being same in the following code where we have used the **entries()** method\
    \ to create entryList.\n\n```javascript\nlet myFriends = new Set([\"Anna\", \"\
    Jason\", \"Carlie\"]);\nconsole.log(myFriends);\n\nlet entryList = myFriends.entries();\n\
    console.log(entryList);\n```\n*Fig - 8.35*\n\nOutput:\n\n![](img/8a6860449d086ad6675add2b749bcc36_208_0.png)\n\
    \n*Fig - 8.36*\n\nThe final thing I want you to learn is to use **has()** method.\
    \ Look at the following code:\n\n```javascript\nlet myFriends = new Set([\"Anna\"\
    , \"Jason\", \"Carlie\"]);\nconsole.log(myFriends);\n```\n*Fig - 8.37*\n\nOutput:\n\
    \n![](image_placeholder_208_1.png)\n\n*Fig - 8.38*\n\nThe **has()** method examines\
    \ the Set for the presence of a value and returns a Boolean upon the value found\
    \ or not.\n\n## Weak Sets\n\nWeak Sets are like Sets with a few trade-offs! They\
    \ are basically a sister to Sets. There are few things we need to know about WeakSets:\n\
    \n1) They can only have objects as members; Proxies, Lists, etc. count as objects.\n\
    2) They cannot be iterated over.\n3) Its length is undefined or 0.\n4) The **clear()**\
    \ method is absent from their prototype.\n5) Every time garbage collection occurs\
    \ if any objects are deleted or set to null or undefined then their reference\
    \ will also be removed from WeakSet if they are member of it. (Garbage collection\
    \ works differently for environment).\n6) Since garbage collection takes time,\
    \ there may be memory leaks; between the time object is deleted and garbage collected\
    \ we will still be able to access the deleted object from WeakSet.\n\nThe only\
    \ thing you can find about WeakSets is the self-clearing and garbage collection,\
    \ however there is no need to make stuff just take look at the following code:\n\
    \n```javascript\nlet myJohn = {name: \"John\"};\nlet myJane = {name: \"Jane\"\
    };\nlet myWeakSet = new WeakSet([myJohn, myJane]);\nconsole.log(myWeakSet);\n\n\
    myJohn = null;\nconsole.log(myWeakSet);\n```\n*Fig - 8.39*\n\nOutput:\n\n![](img/8a6860449d086ad6675add2b749bcc36_210_0.png)\n\
    \n*Fig - 8.40*\n\nHere on line #1 & #2 we have two arbitrary objects, myJohn &\
    \ myJane. on line #4 we create a new WeakSet with two members, myJohn & myJane.\
    \ When we first log this WeakSet on line #5 it logs properly. Then we set myJohn\
    \ to null and log this WeakSet again, this time it also logs properly, however\
    \ when we log this WeakSet after waiting a few seconds, minutes, etc. as soon\
    \ as the garbage collector runs myJohn will lose its membership from this WeakSet.\n\
    \n**Note:** This will not work if your garbage collector is set differently or\
    \ is not running by intervals.\n\n## Maps\n\nMaps are to Objects what Sets are\
    \ to Arrays, a sister data structure of sorts. Maps are basically Sets of keys\
    \ paired with their values.\n\nNow Maps have a few quirks too:\n\n1) It has a\
    \ few methods of Sets like **has()**, **get()**, **delete()**.\n2) To add members\
    \ to a Map you can use the **set()** method.\n3) You can iterate through a Map\
    \ with **forEach()**, and **for/of** methods.\n\nNow let’s take a look at the\
    \ following code:\n\n```javascript\nconst myMap = new Map();\n\nmyMap.set(\"fName\"\
    , \"John\");\nmyMap.set(\"lName\", \"Doe\");\nmyMap.set(\"age\", 40);\n\nconsole.log(myMap);\n\
    ```\n*Fig - 8.41*\n\nOutput:\n\n![](img/8a6860449d086ad6675add2b749bcc36_211_0.png)\n\
    \n*Fig - 8.42*\n\nHere on line #1 we have declared a new Variable and assigned\
    \ a new empty Map to it. Then on line #3 to line #5 we have created three keys\
    \ (**fname**, **lname**, **age**) and paired these keys with the corresponding\
    \ values of (**“John”**, **“Doe”**, **40**). Then on line #7 we have logged the\
    \ value of our Map. As you can see in the output each key has a corresponding\
    \ value, however the output is not quite an Object, it’s a Map.\n"
