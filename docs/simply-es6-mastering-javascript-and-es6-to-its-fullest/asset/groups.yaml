    \n有一个名为 **on** 的类，它会将白色像素变为黑色像素，赋予用户用黑色在画布上进行绘画和书写的能力。\n\n有一个 ID 为“**display**”的分割线，它将我们所有的像素封装在内部。这结束了我们代码中的\
