    \ Promises 的 **then()** 方法。**thenables、链式 promise、**以及 **Promise 方法** 的组合是给你们所有流程控制战士的三剑合一入门礼包。看看下面的代码：\n\
    \n```javascript\n<script>\nlet myRes = fetch(\"http://localhost:3000/database\"\
