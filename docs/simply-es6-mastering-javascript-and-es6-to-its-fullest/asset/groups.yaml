    only has the word **about** in them, ignoring case-sensitivity requirements".


    The second Regex on line #4 searches for "The very first word of a string being
    **about** or not, ignoring case-sensitivity requirements". Obviously the **g**
    flag is useless here.


    ### Searching at the end


    We can also use the dollar sign to search for a word at the end of a string. Look
    at the following code:


    ```javascript

    1 const myString = "About and about!";

    2 const myRegex1 = /about$/ig;

