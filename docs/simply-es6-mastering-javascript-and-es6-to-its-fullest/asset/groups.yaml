    **SystemJS & BrowserSync**


    Now webpack is not our only option when it comes to bundling, we also have “**SystemJS**”.


    Now my recommendation for you is to prefer webpack over SystemJS for development,
    however


    SystemJS is easier to setup so you can work with it as a supplementary tool. All
    this being said I


    want you to know there is a significant difference between WebPack and SystemJS,
    WebPack


    bundles modules into supported files and is a development tool, on the other hand
    SystemJS is a


    module loader and is shipped with your web-pages.


    We also have to setup the BrowserSync package for this. BrowserSync is a development


