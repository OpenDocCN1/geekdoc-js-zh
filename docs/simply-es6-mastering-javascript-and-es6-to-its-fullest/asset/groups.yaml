    #minuteForkShadow {\n  background-color: red;\n  height: 25vmin;\n}\n```\n*图 -\
    \ 7.49*\n\n**#clockFace** 用于赋予时钟本身形状。**.fork** & **.forkShadow** 用于赋予指针形状。**#hourForkShadow**\
    \ 用于给代表小时的指针设置颜色和位置。**#minuteForkShadow** 用于给代表分钟的指针设置颜色和位置。这里的技巧很简单。在时钟面上，我们将从\
    \ **12** 到 **6** 画一条不可见的线，这根线锚定在时钟的中心。\n\n在 **src/index.js** 中导入 Moment.js 以获取时间戳：\n\
    ```javascript\nimport moment from 'moment';\n\nsetInterval(() => {\n  const now\
