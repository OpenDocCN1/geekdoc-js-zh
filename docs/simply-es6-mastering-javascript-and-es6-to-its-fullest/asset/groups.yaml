    *图 - 8.46*\n\n在这里，第 7 行的键是一个对象，而我们对应的值是 **“John’s Bio”**。当我们打印 **John**（这是一个对象）的值时，我们得到了关于该对象的信息，即它的元数据\
    \ **“John’s Bio”**。不过，不要尝试用用元数据来替换注释，那是不当的行为。\n\n## WeakMaps\n\nWeakMaps 是 Maps\
    \ 的小妹。它们的特性是：\n\n1) 它们没有长度（length）。\n2) 它们的键必须是对象。\n3) 它们不能被遍历，它们是枚举的。\n4) 它们会被垃圾回收。\n\
    \n让我们来看下面的代码：\n\n```javascript\nlet myJohn = {\n  name: \"John\",\n  age: 40\n\
    };\n\nlet myWeakMap = new WeakMap();\n\nmyWeakMap.set(myJohn, \"John’s Bio\");\n\
    console.log(myWeakMap);\n```\n*图 - 8.47*\n\n输出：\n![](img/8a6860449d086ad6675add2b749bcc36_214_0.png)\n\
    \n看，在输出中 **myWeakMap** 没有长度属性。此外，当我们删除 **name** 和 **age** 属性时，它们也会从 WeakMap 中被删除；但这里情况变得有点微妙，你看，这种消失可能发生也可能不发生，原因有两个：\n\
    \n1) 属性消失是因为在 JavaScript 对象中，对象是通过引用指向赋值链上的第一个对象的。\n2) 属性消失是因为它们被垃圾回收了。\n\n数据发生什么取决于框架、环境等，并且可能存在你需要注意的内存泄漏。\n\
    \n## 实践项目项目\n\n现在我们将做一个项目，然后你将制作它的 MVP（最小可行性）版本！今天我们正在创建一个简单的“ES6特性数据库”应用。在这里我们使用\
    \ Atom 和 Webpack 来构建这个项目，但你可以使用任何喜欢的工具。\n\n以下是检查点，按步骤进行：\n\n1) 分别编写 HTML、CSS 和\
    \ JS 文件。\n2) 创建一个“ES6 特性数据库”。\n3) 使用 ES6 以及以下任何工具：Webpack, Babel, BrowserSync\
    \ 和 SystemJS。\n4) 使用 ATOM, GIT 和 ESLint。\n5) 确保所有文件都经过了正确的检查（lint）并可以运行。\n\n通过这个练习将带你逐个完成步骤，直到它们变成本能。以下指令假设你已经全局安装了\
