    \ res) {\n  res.send({\n    name: \"John\",\n    age: 35\n  });\n});\n\napp.get('/database',\
    \ function(req, res) {\n  res.sendFile(__dirname + \"/index.html\");\n});\n\n\
    app.listen(3000, function() {\n  console.log(\"Server is running on port 3000\"\
    );\n});\n```\n*图 5.7*\n"
