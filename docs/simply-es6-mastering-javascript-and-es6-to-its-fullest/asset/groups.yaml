    Here we have a simple Proxy, to which we have passed an empty object, and a handler.


    The first trap in the handler is getting us the object’s prop we asked for when
    we called it. The


    second trap in the handler is setting the new value of the trap when we assign
    a new contact to


    **contacts**. So every time we call a prop of **contacts** or assign a value to
    it we are doing it through a


    proxy that handles each call and assignment through getters and setters.


    On the website of MDN you can find more traps and try them out.


    **Applications of Proxy**


    Following are a few applications of proxies.


    1)


    You need to correct the spelling of a prop.


    2)


    You need to control the output and input of an object.


    3)


    You need to control the assignment of props.


    4)


    You need to restrict information flow from that object.


    5)


    You need to make libraries for better information flow control.


    This is just from the top of my head, the sky is the limit.


