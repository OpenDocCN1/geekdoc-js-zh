- md: "\n## Further import/export investigation\n\nImports work the same way for modules\
    \ as it works for the source files. Only this time we don't need to worry for\
    \ the support of **import/export** because dependencies are running in the webpack\
    \ environment instead of the browser, by the time dependencies reach the browser\
    \ they are part of the main.js file.\n\nSo suppose we created a module in “**app/src**”\
    \ directory and we named it “**myLodash**”, if inside **myLodash** we need to\
    \ **import** from **lodash** module we will import it as:\n\n`import _ from 'lodash';`\n\
    \n*Fig - 7.13*\n\nA module can export multiple named exports but only one default\
    \ export, and an individual module can export both a default export and multiple\
    \ named exports.\n\nLook at the following code to see what a **labAid.js** module\
    \ is exporting:\n\n```javascript\nexport default function (num) {\n  const val\
    \ = `${num}`;\n  if (val.includes('.')) return 'We need an integer';\n  const\
    \ expo = val.length - 1;\n  const coEff = [...val];\n  let sciNot = [...coEff,\
    \ ' x 10', `<sup>${expo}</sup>`];\n  sciNot[1] = (sciNot[1] === '0' ? sciNot[1]\
    \ : `.${sciNot[1]}`);\n  sciNot = sciNot.map(x => (x === '0' ? '' : x));\n  return\
    \ `${sciNot.join('')}`;\n}\n\nexport const definition = `Scientific notation is\
    \ a way of expressing numbers that are too big or too small to be conveniently\
    \ written in decimal form.`;\n```\n\n*Fig - 7.14*\n\nAnd look how it will be imported\
    \ by **index.js**:\n\n`import sciNot, { definition as def } from './labAid';`\n\
    \n*Fig - 7.15*\n\nHere in Fig – 7.15 **sciNot** imports the default export of\
    \ **labaid** and the named export called **definition** is imported as ‘**def**’.\n\
    \n## SystemJS & BrowserSync\n\nNow webpack is not our only option when it comes\
    \ to bundling, we also have “**SystemJS**”. Now my recommendation for you is to\
    \ prefer webpack over SystemJS for development, however SystemJS is easier to\
    \ setup so you can work with it as a supplementary tool. All this being said I\
    \ want you to know there is a significant difference between WebPack and SystemJS,\
    \ WebPack bundles modules into supported files and is a development tool, on the\
    \ other hand SystemJS is a module loader and is shipped with your web-pages.\n\
    \nWe also have to setup the BrowserSync package for this. BrowserSync is a development\
    \ tool used to make development stress-free. It can set up a local server in an\
    \ instant and gives us the ability of live reload, and that is just the tip of\
    \ the iceburg.\n\nSteps to set-up SystemJS & BrowserSync:\n\n1) Navigate to your\
    \ app directory.\n\n2) Make sure nodeJS & NPM is installed.\n![](img/8a6860449d086ad6675add2b749bcc36_170_0.png)\n\
    *Fig - 7.16*\n\n3) Download the SystemJS script from GitHub or get a URL to load\
    \ it from a CDN like JSPM (JavaScript Package Manager). ( This tutorial uses system@0.19.34.js).\n\
    \n4) Create a new index.html, and index.js file. Your directory should look like\
    \ this:\n![](img/8a6860449d086ad6675add2b749bcc36_170_1.png)\n*Fig - 7.17*\n\n\
    5) Install a module to import (as an example), here we are using ‘lodash’ (**npm\
    \ i lodash --save**) module.\n\n6) Import this module and use it inside index.js,\
    \ example in Fig – 7.18:\n![](img/8a6860449d086ad6675add2b749bcc36_171_0.png)\n\
    *Fig - 7.18*\n\n7) Add two script tags to your **index.html** file, one to import\
    \ **system.min.js** and another to configure SystemJS and import our **index.js**\
    \ file.\n![](img/8a6860449d086ad6675add2b749bcc36_171_1.png)\n*Fig - 7.19*\n\n\
    8) To install BrowserSync for local host first initialize NPM using the following\
    \ command from Terminal after navigation to your app directory: **npm init**\n\
    \n9) Now to install BrowserSync use the following command to globally install\
    \ it:\n![](img/8a6860449d086ad6675add2b749bcc36_171_2.png)\n*Fig - 7.20*\n\nOr\
    \ use this to locally install it after Terminal navigates to your app’s directory:\
    \ I suggest to install it locally.\n\n10) Now add launch server script to your\
    \ **package.json** file.\n![](img/8a6860449d086ad6675add2b749bcc36_172_1.png)\n\
    *Fig - 7.22*\n\n11) Use Terminal and navigating to our app’s directory to launch\
    \ our app with a server using “**npm run server**” to run “server” script from\
    \ package.json or “npx browser-sync start --directory --server '*.js, *.html,\
    \ *.css'” to run it directly. should see following output in Terminal:\n![](img/8a6860449d086ad6675add2b749bcc36_172_2.png)\n\
    *Fig - 7.23*\n\n12) Once you successfully complete step 12 we will get the following\
    \ webpage with catalog of all hosted files:\n![](img/8a6860449d086ad6675add2b749bcc36_173_0.png)\n\
    *Fig - 7.24*\n\n13) If all went well you should see the following output after\
    \ loading your index.html file:\n![](img/8a6860449d086ad6675add2b749bcc36_173_1.png)\n\
    \nNow I want to be very clear here, System.js is not a replacement for WebPack,\
    \ a beginner should prefer Webpack over System.js most of the times.\n\n## Live\
    \ Reloads with BrowserSync\n\nLive reloads can be very helpful when working with\
    \ HTML or CSS. This section may seem redundant but for those who want separate\
    \ instructions for BrowserSync Live Reload it is given here. Following are some\
    \ instructions for setting up live reloads with BrowserSync:-\n\n1) Open Terminal\
    \ and navigate to your app’s folder.\n\n2) Make sure NodeJS and NPM is installed,\
    \ like in Fig – 7.16.\n\n3) Now initialize NPM using: **npm init**\n\n4) Install\
    \ Browser-sync if not installed like in Fig – 7.20 or Fig – 7.21.\n\n5) Now add\
    \ launch server script to your **package.json** file like in Fig – 7.22.\n\n6)\
    \ Launch your app with a server using “**npm run server**”.\n\n7) Now you can\
    \ work on your code and every time you save your file it will auto-refresh aka\
    \ live reload in the browser. If you use BrowserSync all your assets will be available\
    \ on the local host, you can take your URL from there for modules or libraries\
    \ that require hosts to work.\n\n## Hosting servers with HTTP-Server\n\nThere\
    \ is an easier way to host files with NodeJS, the “HTTP-Server” module. It doesn’t\
    \ code with Live Reload features but it is extremely light-weight and requires\
    \ little configuration. Now you can simply just install NodeJS (comes with NPM),\
    \ with “**sudo apt install nodeJS npm**” if not installed, then you can globally\
    \ install HTTP-Server with “**npm i http-server -g**”; after everything is installed\
    \ using Terminal just navigate to the directory you want to host and execute “http-server\
    \ -p 2020” and your directory will be hosted at “localhost:2020” and the provided\
    \ IPV4 addresses on your Terminal’s display, which can be used by any device on\
    \ the same network to access the hosted directories. Following are some detailed\
    \ instructions to do the same thing locally. Steps to set it up:\n\n1) Create\
    \ a new directory.\n\n2) Add a file in it, any file will do (for demonstration).\n\
    \n3) Use a Terminal to navigate to this directory.\n\n4) Check if Node.JS and\
    \ NPM is installed with “**node -v**” & “**npm -v**”. If not installed use “**sudo\
    \ apt install nodeJS npm**” or alternatively install node from its official website.\n\
    \n5) Install HTTP-Server module with “**npm i http-server -g**” (you can skip\
    \ the –g flag if you want).\n\n6) Use the command “**http-server -p 2020**” to\
    \ host this directory at localhost:2020. You will see the following output in\
    \ your Terminal:\n![](img/8a6860449d086ad6675add2b749bcc36_174_0.png)\n*Fig -\
    \ 7.25*\n\n7) In Fig – 7.25 we are able to see a couple of IPV4 addresses, anyone\
    \ on the same network as you can use these addresses to access the hosted files.\
    \ Just put one of these addresses in the address bar and you can see the hosted\
    \ files, like the following example:\n![](img/8a6860449d086ad6675add2b749bcc36_175_0.png)\n\
    *Fig - 7.26*\n\nWe use HTTP-Server to host our media servers in our home and offices.\
    \ You can even write a .**bat** file or a Shell script to run boot the server.\
    \ Just write the following code in a text-file:\n![](img/8a6860449d086ad6675add2b749bcc36_175_1.png)\n\
    *Fig - 7.27*\n\nAnd save it with a “.bat” extension. Just run this batch file\
    \ to host its directory. Alternatively you can initialize NPM with “**npm init**”\
    \ and in package.json file add a new script with the following code:\n\n```json\n\
    \"scripts\": {\n  \"server\": \"http-server -p 2020\"\n}\n```\n"
  mdcn: "\n\n## 进一步导入导入导出研究\n\n模块的导入方式与源文件相同。只是这一次我们不需要担心 **import/export**（导入/导出）的支持，因为依赖项运行在\
    \ webpack 环境中，而不是浏览器；当依赖项到达浏览器时，它们已经是 main.js 文件的一部分了。\n\n假设我们在“**app/src**”目录下创建了一个模块并将其命名为“**myLodash**”，如果\
    \ **myLodash** 内部需要从 **lodash** 模块 **import** 内容，我们将这样导入：\n\n`import _ from 'lodash';`\n\
    \n*图 - 7.13*\n\n一个模块可以导出多个命名导出（named exports），但只能有一个默认导出（default export），且单个模块可以同时导出默认导出和多个命名导出。\n\
    \n查看以下代码了解 **labAid.js** 模块导出了什么：\n\n```javascript\nexport default function (num)\
    \ {\n  const val = `${num}`;\n  if (val.includes('.')) return 'We need an integer';\n\
    \  const expo = val.length - 1;\n  const coEff = [...val];\n  let sciNot = [...coEff,\
    \ ' x 10', `<sup>${expo}</sup>`];\n  sciNot[1] = (sciNot[1] === '0' ? sciNot[1]\
    \ : `.${sciNot[1]}`);\n  sciNot = sciNot.map(x => (x === '0' ? '' : x));\n  return\
    \ `${sciNot.join('')}`;\n}\n\nexport const definition = `Scientific notation is\
    \ a way of expressing numbers that are too big or too small to be conveniently\
    \ written in decimal form.`;\n```\n\n*图 - 7.14*\n\n再看 **index.js** 是如何导入它的：\n\n\
    `import sciNot, { definition as def } from './labAid';`\n\n*图 - 7.15*\n\n在图 7.15\
    \ 中，**sciNot** 导入了 **labaid** 的默认导出，而名为 **definition** 的命名导出被导入为‘**def**’。\n\n\
    ## SystemJS & BrowserSync\n\n现在，在打包方面 webpack 并不是我们唯一的选择，我们还有“**SystemJS**”。我的建议是你在开发时优先使用\
    \ webpack 而不是 SystemJS，然而 SystemJS 的配置更简单，你可以将其作为辅助工具使用。话虽如此，我想让你知道 WebPack 和\
    \ SystemJS 之间存在显著差异：WebPack 将模块打包成支持的文件，是一个开发工具；而 SystemJS 是一个模块加载器，随你的网页一起发布。\n\
    \n我们还需要为此配置 BrowserSync 包。BrowserSync 是一个用于让开发变得无压力的开发工具。它可以瞬间建立本地服务器，并赋予我们热刷新（live\
    \ reload）的能力，而这只是冰山一角。\n\n设置 SystemJS & BrowserSync 的步骤：\n\n1) 导航到你的应用目录。\n\n\
    2) 确保已安装 nodeJS & NPM。\n![](img/8a6860449d086ad6675add2b749bcc36_170_0.png)\n\
    *图 - 7.16*\n\n3) 从 GitHub 下载 SystemJS 脚本，或从像 JSPM（JavaScript 包管理器）这样的 CDN 获取加载它的\
    \ URL。（本教程使用 system@0.19.34.js）。\n\n4) 创建一个新的 index.html 和 index.js 文件。你的目录看起来应该像这样：\n\
    ![](img/8a6860449d086ad6675add2b749bcc36_170_1.png)\n*图 - 7.17*\n\n5) 安装一个需要导入的模块（作为示例），这里我们使用‘lodash’（**npm\
    \ i lodash --save**）模块。\n\n6) 在 index.js 中导入此模块并使用它，示例图 7.18：\n![](img/8a6860449d086ad6675add2b749bcc36_171_0.png)\n\
    *图 - 7.18*\n\n7) 在你的 **index.html** 文件中添加两个 script 标签，一个用于导入 **system.min.js**，另一个用于配置\
    \ SystemJS 并导入我们的 **index.js** 文件。\n![](img/8a6860449d086ad6675add2b749bcc36_171_1.png)\n\
    *图 - 7.19*\n\n8) 为了为本地主机安装 BrowserSync，首先在导航到应用目录后，在终端（Terminal）中使用以下命令初始化 NPM：**npm\
    \ init**\n\n9) 现在使用以下命令全局安装 BrowserSync：\n![](img/8a6860449d086ad6675add2b749bcc36_171_2.png)\n\
    *图 - 7.20*\n\n或者在终端导航到应用目录后使用此命令进行本地安装：我建议本地安装。\n\n10) 现在在你的 **package.json**\
    \ 文件中添加启动服务器脚本。\n![](img/8a6860449d086ad6675add2b749bcc36_172_1.png)\n*图 - 7.22*\n\
    \n11) 使用终端并导航到应用目录，使用“**npm run server**”通过服务器启动我们的应用，以运行 package.json 中的“server”脚本，或者使用“npx\
    \ server”来运行“server”脚本，其输出如下：\n![](img/8a6860449d086ad6675add2b749bcc36_172_1.png)\n\
    *图 - 7.23*\n\n12) 为了安装本地Sync，在导航到应用目录后使用以下输出：\n![](img/8a6860449d086ad6675add2b749bcc36_172_2.png)\n\
    *图 - 7.23*\n\n13) 成功安装 BrowserSync 后，你会看到以下输出：\n![](img/8a6860449d086ad6675add2b749bcc36_173_0.png)\n\
    *图 - 7.24*\n\n"
