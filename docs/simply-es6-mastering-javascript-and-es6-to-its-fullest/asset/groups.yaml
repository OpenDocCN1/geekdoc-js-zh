    看第 #2 行和 #3 行的代码是如何给出相同输出的？使用剩余/展开运算符来完成此比写这么多引号要简单。这里第 #2 行的意思是“打印一个包含 a, b,
    c, d 成员的数组”，与此同时，第 #3 行的意思是“打印一个将字符串 `abcd` 的字符**展开**为成员的数组”。


    现在剩余/展开运算符还有更多应用，看看以下代码：


    ```javascript

    2 let arr = [1,2,3,4,5];

