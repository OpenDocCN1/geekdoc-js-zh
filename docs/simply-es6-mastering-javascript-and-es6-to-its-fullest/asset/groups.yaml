    ESLint CLI 的习惯。将它们安装在闪存盘上实现即插即用，在 10 种情况下 9 种都能顺畅运行。


    现在你还可以在仓库中添加 Git hooks（在 push、commit、receive 等操作之前运行的代码），这样它们就只允许经过 Lint 的代码被推送到这些仓库中。


    网上有很多 hook 脚本可用，例如 pre-commit、post-commit、pre-receive、post-receive 等。这些 hook 脚本位于
    Git 初始化文件夹内部的 **“.git/hooks”** 目录下，这种初始化可以通过终端、Git 的 bash-CLI 或 Atom 内置的 Git GUI
    完成。


    要使用 **Git** hooks/pre-commit 代码，请遵循以下指令：


    1) 从其官方网站下载 Git 安装程序，或使用 APT、Chocolatey 或任何包管理器（通过管理员/root 权限）运行以下命令之一：“**choco
    install git**”、“sudo apt install **git-core**”等。


    2) 使用以下命令用 Git 创建一个新目录：“git init **<dirName>**”（我把我的目录命名为“lintedJSOnly”）。


    3) 使用终端（或 Git Bash（在 Windows 上随 Git 安装）进入你的新 Git 仓库：

    ![](img/8a6860449d086ad6675add2b749bcc36_159_0.png)

    *图 - 6.35*


    4) 现在你可以使用“touch index.js”创建一个新的 index.js 文件。


    5) 在 Atom 中打开此 index.js 文件（它也内置了 Git 支持）。


    6) 在 Atom 中打开“lintedJSOnly”目录，从左侧面板导航到“**.git**”目录。（也可以从 Git bash 导航）


    7) 复制一份名为“**commit-msg.sample**”的文件，并将其重命名为“**commit-msg**”。


    8) 打开此文件，清除原有的代码，并将图 – 6.37 中的代码添加其中。


    9) 现在回到 Atom 中的 index.js 文件，并点击右下角的 Git 图标，Atom 内会弹出一个右侧面板，你可以在其中提交更改（你也可以用 Git
    bash 提交，这也是我推荐的！稍后会提供命令）：

    ![](img/8a6860449d086ad6675add2b749bcc36_159_1.png)

    *图 - 6.36*


    10) 现在如果出现 linting 错误，修复它们并再次提交。如果所有错误都已修复，一个亮起的 index.js 文件将被成功提交。


    用于 Commit-msg 的 pre-commit 代码（你不需要太担心这个）：

    ![](img/8a6860449d086ad6675add2b749bcc36_160_0.png)

    *图 - 6.37*


    在仓库目录下，你还可以使用以下命令将更改提交到 Master 分支：


    1) git status

    2) git add –A

    3) git commit –m “用于标记 commit 的语句”


    运行这些命令可能需要一些时间，特别是如果你在目录内使用了 NPM 或类似内容时。


    **注意：** 作者本人并不使用 ATOM 作为他的首选 IDE，他使用的是 Vim！但是，出于本书的目的，建议使用 ATOM。作者相比于 Sublime
    和 VSCode 更倾向于使用 ATOM，因为 HTML、CSS 和 JS 之于 ATOM 就像 Vim-Script 之于 Vim。要进一步了解 Vim，请参阅指南“**Simply
    Vim, by Ray Voice**”。


    ## 实践项目


    现在我们将创建一个项目，然后你将制作它的 MVP 版本！记得我们在第 4 章的练习项目中制作过一个画图应用吗？我们将再次制作它，但这次我们将使用 Atom、Git
    和 ESLint。你可以使用其他编辑器如 Vim、Sublime 等，但我建议：


    - 使用 Atom

    - 使用 Git

    - 使用 ESLint


    以下是步骤：


    1) 创建项目。

    2) 初始化 Git。

    3) 配置 ESLint。

    4) 编写代码。

    5) 测试代码。

    6) 设置 hooks。

    7) 提交代码。

    8) 修复错误。

    9) 完善 UI。

    10) 完成定稿。

    11) 部署项目。

    12) 处理异常。

    13) 审查代码。


    ## 结语


    让我们回顾一下所学内容！


    1) 原生类型（primitive）不是对象且没有方法。

    2) JavaScript 有 6 种数据类型：String、Number、Boolean、Null、Undefined 和 Symbol。

    3) 所有的 symbol 都是唯一的，否则比较结果将为 false。

    4) Symbol 是不可迭代/不可枚举的。

    5) Object.getOwnPropertySymbols() 方法用于从对象获取符号键。

    6) Linting 是强制执行实践和风格的过程，它用于使代码更易于维护、易读且不受问题。

    7) ESLint 是主要的 linting 软件，带有 CLI 并拥有不同的代码编辑器插件；它用于 lint JavaScript/ES6 代码。

    8) ESLint 配置在一个名为 “.eslintrc.json”的文件中，该可能是隐藏的，因为在某些操作系统和 UI 中，点开头的文件默认是隐藏的。

    9) 在 “.eslintrc.json”文件中，“env”属性包含我们编写代码的环境，“extends”属性包含我们使用的样式指南信息，而“rules”属性包含我们正在修改的规则状态。

    10) Airbnb 是最值得推荐选择的样式指南。

    11) ESLint 带有一个 CLI 用于 Linting，然而许多代码编辑器都带有内置或插件版的 ESLint。

    12) 可以使用图 – 6.19 中的全局表头注释为全局变量添加异常。

    13) 可以使用图 – 6.22 中的 eslint disable 注释来禁用 ESLint。

    14) 要要在 ATOM 中使用 ESLint，你可以安装并配置“linter”和“linter-eslint”包。

    15) Atom 拥有内置的 Linting、Git 甚至 GitHub 的 GUI。

    16) 可以配置 Git hook 在 pre-commit 之前验证质量。

    17) 记得使用以下命令用名称和邮箱凭据登录 Git：“**git config user.email <email>**” & “**git config
    user.name <name>**”。


