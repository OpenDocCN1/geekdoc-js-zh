    ### Character classes


    When using Regex we don’t need to write any complex patterns by hand, we have
    shorthand called “Character classes” for that. Let’s look at the following code:


    ```javascript

    1 const myString1 = "Father Goes Down Ends Battle";

    2 const myString2 = "Battle_Ends_Down_Goes_Father";

    3

    4 const myRegex1 = /\w/ig;

    5 const myRegex2 = /\w+/ig;

    6

    7 console.log(myString1.match(myRegex1));

    8 console.log(myString1.match(myRegex2));

    9 console.log(myString2.match(myRegex1));

    10 console.log(myString2.match(myRegex2));

    ```


    *Fig - 9.38*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_232_0.png)


    *Fig - 9.39*


    The **\w** character class is equal to **[A-Za-z0-9_]**, so it searches for all
    capital-cased alphabets, all small-cased alphabets, and the underscore character.
    Here the first Regex searches for all characters in the **\w** character class;
    and the second Regex searches for all characters in the **\w** character class
    that occurs in succession.


    When we match the first Regex to the first string on line #7 it returns all the
    characters of the string with the exception of the blank-space characters. When
    the first Regex is with the second string on line #9 it does the same by returning
    all characters including the underscores but not the blank-spaces.


    When we match the second Regex with the first string on line #8 it returns all
    words in that string and ignores all the blank-spaces.


    Now here things get a little interesting, when we match the second Regex with
    the second string it returns the whole string, this is because previously when
    matched with the first string on line #8 there was un characters (blank-spaces)
    to separate the words however here the words are separated by underscores which
    are an accepted character for the **\w** character class, so in the end **myRegex2**
    decides to tally the whole string as one giant word to return.


    ```javascript

    1 const myString1 = "A 1000_Years!";

    2

    3 const myRegex1 = /\w/ig;

    4 const myRegex2 = /\W/ig;

    5 const myRegex3 = /\d/ig;

    6 const myRegex4 = /\D/ig;

    7

    8 console.log(myString1.match(myRegex1));

    9 console.log(myString1.match(myRegex2));

    10 console.log(myString1.match(myRegex3));

    11 console.log(myString1.match(myRegex4));

    ```


    *Fig - 9.40*


    *Output:*


    ![](img/8a6860449d086ad6675add2b749bcc36_233_0.png)


    *Fig - 9.41*


    Here is a table of some common character classes:


    - **\w** : Searches for capital-cased and small-cased English alphabets, numbers,
    and the underscore character.

    - **\W** : Searches for everything but what **\w** searches for, here it also
    searches for blank-space characters. It’s the inversion of **\w**.

    - **\d** : Searches for all numbers.

    - **\D** : Searches for anything but a number. It’s the inversion of **\d**.

    - **\s** : Searches for whitespaces like blank-space, tab, carriage return, form
    feed, and new line / line break characters. It’s a shorthand of writing **[ \r\t\f\n\v]**.

    - **\S** : It’s the inversion of the **\s** character class. It searches for everything
    excluding the characters in the **\s** class. It’s a shorthand of writing **[^
    \r\t\f\n\v]**.


