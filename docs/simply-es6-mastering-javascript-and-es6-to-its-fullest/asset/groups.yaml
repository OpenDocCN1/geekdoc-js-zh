- md: '

    To use this flag to auto-fix your linting errors execute the following command
    from your Terminal “**eslint index.js --fix**”, make sure your code is running
    fine both before and after auto-fixing it.


    Auto-fixing our code fixed all our errors but 1.


    8)


    At this point we have a **no-unused-var** error for a function we have called
    in our HTML, this is a false-positive however it still tells us that we should
    be attaching the function to our button with JavaScript instead of calling it
    from HTML as a preference. Here instead of fixing this false-positive error we
    will just leave a comment for the reader (There are other better ways to do this
    but leaving temporary comments is okay too).


    As a rule of thumb I avoid using JavaScript inside HTML. Also I have replaced
    fat-arrow functions with the **function** keyword because it reads better.


    Now our code reads like this:


    ```javascript

    32  function markdownFormat (str) {

    33  const tempStr =  str.split(''\n'')

    34  .map(x => (x.endsWith(''!head'')?`<b style=''font-size:7vmin; color:#111''>${x.split(''!'')[0]}</b>`:x))

    35  .map(x => (x.endsWith(''!subhead'')?`<b style=''font-size:5vmin; color:#222''>${x.split(''!'')[0]}</b>`:x))

    36  .map(x => (x.endsWith(''!bold'')?`<b>${x.split(''!'')[0]}</b>`:x))

    37  .map(x => (x.endsWith(''!burn'')?`<b style=''color:red''>${x.split(''!'')[0]}</b>`:x))

    38  .join(''<br>'');

    39  return tempStr;

    40 }


    42  function sanitize (strs, ...vals) {

    43  const dirty = strs.reduce((acc, curr, i) => `${acc}${vals[i-1] || ''''}${curr}`);

    44  const clean = DOMPurify.sanitize(dirty, {USE_PROFILES: { html: false}});

    45  return clean;

    46 }


    48  // submit() is Called with HTML

    49  function submit() {

    50  document.getElementById(''display'').innerHTML = markdownFormat(sanitize`${document.getElementById("codeBox").value}`);

    51 }

    ```


