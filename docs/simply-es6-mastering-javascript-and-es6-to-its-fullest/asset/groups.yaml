  - '[PAGE 179]


    11) Now run “**npm run babel**” command again and this time **main.js** contents
    will hold


    the ES5 version of our ES6 code, like the following example:


    ![](img/8a6860449d086ad6675add2b749bcc36_179_0.png)


    *Fig - 7\. 34*


    Amazing right?! And Babel even has a hot-reload property, so as you write and
    save ES6


    code in **index.js** you can see your code’s ES5 compilation live as long as the
    Terminal window


    carrying out the “**npm run babel**” command is running in the background.


    You can use additional plugins with Babel, however plugins are not something you
    are


    going to need in your day to day operations. Most of the time you will require
    babel presets and


    polyfills, I use presets for ES5 and React in most of my web development projects.


    Now before you start using Babel in your official projects I recommend that you
    get a firm


    grasp of it! Go to the official website and learn the documentation.


    **Polyfills**


    A Polyfill allows us to enable unsupported ES6 code without converting it to ES5\.
    In its


    simplest form Polyfills are just boiler-plates, they are just code.


    Look at the following example:


    Input:


    Let  arr  =  “abc”.repeat(3);


    document.body.innerHTML  =  arr;


