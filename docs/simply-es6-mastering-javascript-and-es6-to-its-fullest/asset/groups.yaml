    *图 - 4.28*


    看我们是如何合并两个数组的？第 #4 行的意思是“首先在数组内展开 **arr** 的所有成员，然后在数组内展开 **arr2** 的所有成员，然后将该数组赋值给名为
    numbers 的变量”。这也可以用于两个数组。


    如果没有剩余/展开运算符，我们将被迫使用如 **concat()**、**push()**、**unshift()**、**slice()**、**splice()**
    等方法；想象一下在没有剩余/展开运算符的情况下处理多个数组，这种想法本身就令人胆惊。


