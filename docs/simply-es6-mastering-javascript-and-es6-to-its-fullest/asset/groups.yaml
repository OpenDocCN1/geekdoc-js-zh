    ## Chapter 9 – Regex and ES6


    ## Regex


    “Regular expressions” aka “Regex” are code expressions that signify a pattern.
    These type of strings can be used to match, search, replace, etc. the desired
    item’s presence in a string, for example finding a specific word from a string.


    Now remember, you don’t need to learn and master the Regex, you can use libraries
    to do most of the work for you, however in my opinion the central function of
    the ES6 update of JavaScript is to cut down code quantity when writing code with
    JavaScript; and when it comes to cutting down code quantity Regex is your guy.
    Although Regex is not new to JavaScript and it’s used in other languages too,
    its use for JavaScript developers is invaluable.


    Full transparency: I am not a Regex expert, most programmers aren’t, even the
    best ones! We all use online services and plagiarism when it comes to Regex.


    **Note:** Regex is an expression, not a string! Do not wrap Regex expressions
    with quotation marks.


    ### Searching strings with test()


    First we will learn the **test()** method of Regex in JavaScript. Let’s look at
    the following code:


    ```javascript

    1 const myString = "a e i o u";

    2 const myRegex = /e/;

    3

    4 console.log(myRegex.test(myString));

    ```

    *Fig - 9.1*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_221_0.png)


    *Fig - 9.2*


    Here on line #1 we have an arbitrary string assigned to **myString**. On line
    #2 we have a Regex pattern assigned to **myRegex**. On line #4 we have applied
    the **test()** method of **myForm** to **myString**, and logged the value returned.


    The **test()** method takes a string and searches it for the patterns describes
    by the Regex, if the pattern is present in the string it returns **true**, else
    **false**. Here our test method searches the string for the string **“e”** in
    the **“a e i o u”** and when it finds the string it returns **true**.


    Now the following code does a similar thing:


    ```javascript

    1 const myString = "apple elephant iron orange umbrella";

    2 const myRegex = /iron/;

    3

    4 console.log(myRegex.test(myString));

    ```

    *Fig - 9.3*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_222_0.png)


    *Fig - 9.4*


    It searches for the string **“iron”** in **myString** and when it’s found **true**
    is returned.


    Now this type of string search is case-sensitive, here is another Regex that uses
    the “**|**” / **alternation** / **OR** / **pipe** operator to search for multiple
    strings:


    ```javascript

    1 const myString = "Ray or ray or RAY";

    2 const myRegex = /Ray|ray|RAY/;

    3

    4 console.log(myRegex.test(myString));

    ```

    *Fig - 9.5*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_222_0.png)


    *Fig - 9.6*


    This Regex checks for either **“Ray”**, **“ray”**, or **“RAY”** in **myString**.


    Now you can also write a Regexthat ignores case-sensitivity requirement. Look
    at the following code:


    ```javascript

    1 const myStrings = [

    2 “Ray”,

    3 “RAY”,

    4 “ray”,

    5 “rAy”,

    6 “raY”,

    7 “etc”

    8 ];

    9 const myRegex = /ray/i;

    10

    11 for (let string of myStrings) {

    12 console.log(myRegex.test(string));

    13 }

