    ## Chapter 1 – The Basics


    ES6 is a not-so-new upgrade to JavaScript. You see the JavaScript you have been
    using was the 5th edition of JavaScript, which was last updated in 2009 I think...
    For the longest time JavaScript/ES5 did all it could to support the web, however
    everything has to die so something better can be born… That better thing is ES6!
    ES6 together with Node.js and React-Native pushed JavaScript into another league!
    I have never seen something more versatile and useful than JavaScript except for
    C/C++. Although it depends on individual projects, the pros of JavaScript outweigh
    the cons by leagues. It may not be as fast as Assembly, Go, or C, and it may not
    be as easy to read as Python, but it is always my first choice to do the job!
    It is cross-platform, easily scalable and has a great future ahead.


    As an employer and project manager it has been my firsthand experience that JavaScript
    projects are overall cheaper than others. The labor is cheap and common, although
    the applicants are less experienced compared to say someone who writes Java, C#,
    or even Swift; however the best thing is the flow of debugging, almost all common
    bugs are well cataloged and easily fixed. On top of that most of the JavaScript
    related tech is free and open-source.


    The Motto of Java is “Write once, run anywhere!” if I remember correct (which
    I do!); However with Java writing once will make your firm go broke; JavaScript
    on the other hand can fulfill this promise without any heavy compromises.


    Going forth you should know a few things (if you don’t already), there are several
    ways to use JavaScript. You can use front-end with Node.js; you can use back-end
    with Express; you can use UI with React; you can use logic with algorithms; you
    can use data with databases; you can use APIs with REST; you can use testing with
    Jest.


    Remember, once you chose a convention and notation you have to stick with it throughout
    the project; I don’t need to tell you the difference between compiler and interpreter.
    A Compiler is sort of a translator that translates logic given by instructions;
    languages like C/C++ are compiled. An Interpreter is simply a transpiler of sorts
    it takes code and converts it to more desirable form; JavaScript is interpreted.
    Then there is a Parser, which converts data to more desirable form; HTML is parsed.


    ## Starting with Labels & Comments


    All good books on coding should start with labels and comments. Labels and comments
    make managing code easy. It also helps us avoid unnecessary importing of modules.
    To top that most of the people I have interviewed don’t really document and label
    their code, sometimes not makes it difficult to scale software and work on others.
    I’ll take a coder who documents properly over a coder who can do gymnastics any
    day.


    Comments in JavaScript are of two kind. The single line comment is written with
    `// comment`. While the multi-line comment is written with `/* comment */`.


    ```javascript

    // This is a single line comment

    // This is another single like comment


    /*

    This is a multi-line comment,

    it can be used to explain a section of

    code and should be used extensively with

    functions and scopes

    */

    ```'
