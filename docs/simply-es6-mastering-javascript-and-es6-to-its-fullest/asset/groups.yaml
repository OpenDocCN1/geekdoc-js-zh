    Compare this code to the code in Fig – 2.47, while the HTML portion is adopted
    from Fig – 2.47.


    This code is still poorly written since we have generated a ton of HTML with JavaScript
    without a framework or proper DOM practices. However it gets the job done! (Job
    being teaching complex ES6 principles without using 3 different languages and
    frameworks).


    ## Disabling ESLint


    Now suppose in Fig – 6.21 we need to disable ESLint! To do that we can add an
    “eslint-disable” header comment on the first line like Fig – 6.22.


    ```javascript

    2  let x = 2;

    3  let y = 3;

    4  console.log(2);

    5  //log: 2

    ```

    *Fig - 6.21*


    ```javascript

    1  /* eslint-disable */

    2  let x = 2;

    3  let y = 3;

    4  console.log(2);

    5  //log: 2

    ```

    *Fig - 6.22*


    This will disable ESLint through the file!


    Now what if we need to disable ESLint just for the code on line #3? Then we disable
    ESLint before the code on line #3 and enable it again after the code on line #3.
    Check Fig – 6.23.


    ```javascript

    2  let x = 2;

    3  /* eslint-disable */

    4  let y = 3;

    5  /* eslint-enable */

    6  console.log(2);

    7  //log: 2

    ```

    Fig - 6.23


    Now ESlint is disabled for all the code enclosed between lines #3 & #5.


    After linting this code it will look like the code in Fig – 6.24.


    ```javascript

    2  const x = 2;

    3  /* eslint-disable */

    4  let y = 3;

    5  /* eslint-enable */

    6  console.log(2);

    7  //log: 2

    ```

    *Fig - 6.24*


    Now what if I want to avoid only the “**no-unused-vars**” rule and lint the other
    stuff as per usual? Then I will disable only that rule like in Fig – 6.25.


    ```javascript

    const x = 2;

    /* eslint-disable no-unused-vars */

    const y = 3;

    /* eslint-enable no-unused-vars */

    console.log(2);

    //log: 2

    ```

    *Fig - 6.25*


    ## ESLint Plugins


    Plugins enhance the ability of ESLint, and you can find a list of them on:


    ![](img/8a6860449d086ad6675add2b749bcc36_154_0.png)

    *Fig - 6.26*


    To install ESLint plugins we have to use NPM or Yarn. The first plugin you need
    to learn is the “**eslint-plugin-html**” which is used to lint inline and internal
    JS code within an HTML file. To install “**eslint-plugin-html**” use your Terminal
    to execute the following command:


    **“npm install -g --save-dev eslint-plugin-html”**


    You can also find this command at their official Git-Hub page. This command installs
    this plugin globally so you can use it in all your files.


    Now we have to update the “**.eslintrc.json**” file which now looks like Fig –
    6.27.


    ```json

    1 {

    2  "env": {

    3  "browser": true,

    4  "es6": true,

    5  "node": true

    6 },

    7  "extends": "eslint-config-airbnb",

    8  "globals": {

    9  "Atomics": "readonly",

    10 "SharedArrayBuffer": "readonly"

    11 },

    12 "parserOptions": {

    13 "ecmaVersion": 2018,

    14 "sourceType": "module"

    15 },

    16 "rules": {

    17 "no-console": 0

    18 },

    19 "plugins": [

    20 "html"

    21 ]

    22 }

    ```

    *Fig - 6.27*


    Now we can better lint the HTML file in index.html (6.28).


    ```html

    1  <!doctype html>

    2  <html>

    3  <head>

    4  <meta charset="UTF-8">

    5  </head>

    6  <body>

    7  <script>

    8  let x = 2;

    9  let y = 3;

    10 console.log(2);

    11 </script>

    12 </body>

    13 </html>

    ```

    *Fig - 6.28*


    Linted:


    ```html

    1  <!doctype html>

    2  <html>

    3  <head>

    4  <meta charset="UTF-8">

    5  </head>

    6  <body>

    7  <script>

    8  const x = 2;

    9  const y = 3;

    10 console.log(2);

    11 </script>

    12 </body>

    13 </html>

    ```

    *Fig - 6.29*


    There are a lot of plugins for ESLint, covering them all here is not the purpose
    of this book but you can check them out. Another plugin I would like to learn
    is the “**eslint-plugin-json**” to list them. To install it use system console:
    **npm install -g --save-dev eslint-plugin-json**.


    You can also use **Sublime** code-editor with “Sublime-linter” and “ESLint” Package.
    Some people find sublime setup tougher compared to Atom but in the end it all
    comes down to exposure, if you use Sublime then use Sublime, if you use Atom then
    use Atom. We will use Atom from now on because going back and forth from **notepad++**
    to ESLint CLI is to some extent undesirable for us. I do want you to practice
    some more with the ESLint CLI before you move on, get some good rounds in. Atom
    with ESLint gives us a GUI like in Fig – 6.33.


    ![](img/8a6860449d086ad6675add2b749bcc36_157_0.png)

    *Fig - 6.33*


    Here we can fix the linting problem with a single click (beware), we have a little
    explanation for the error, we have the name of the rule that caused the error,
    and clicking on the small chain/link icons at the end of the lines will take us
    to “ESLint.org/docs/rules/**<ruleName>**” where we can learn more about the rule.


    We can also disable some rules while coding without editing the “**.eslintrc.json**”
    discretely. This can be done from the linter-eslint package settings. You can
    do it by following instructions:


    1. Go to settings tab in top-pane.

    2. Go to Packages tab in the left-pane.

    3. Find **linter-eslint** and click on settings.

    4. Go to Automatic Fixes section and see Disable specific rules from fixes input
    section.

