  - '[PAGE 163]


    **Chapter 7 – Upgrading your**


    **Development Methodology**


    **Babel, Webpack, & Development Tools**


    If you approach the **package.json** file you may see there are 2 kinds of dependencies


    described in them, there are the usual run of the mill dependencies, and there
    are the


    devDependencies.


    Development dependencies are tools used to develop the software, they are not
    needed for


    the software to be used. There is no need to package developer tools with your
    app, once your work


    is done their work is done, so their cumbersome load will not be included within
    your apps.


    Let’s see it this way, you are a carpenter, you use hammers, screw drivers, screws,
    nails,


    etc. to develop a chair. When you ship that chair you need to ship it with the
    nails and screws but


    not the hammer and screw driver. The hammer and screw driver are the developer
    tools, while the


    nails and screws are the dependencies, imagine that!


    At one point or another you will need some developer tools to rescue you from


    boilerplates, and polyfills, etc. Development tools are also required to improve
    production quality,


    time, etc. and add advanced functionality to your code. Most development tools
    here are installed


    using Node Package Manager aka NPM using the following syntax of Terminal commands:


    **npm i <pkg-name> --save-dev**


    Modules installed like this are installed as development dependencies.


    **Babel** is a developer tool used to modify ES6 code to fit ES5 standards, as
    not all browsers


    and environments support all features of ES6\. Following Babel tools are used
    in standard ES6


    development and you may need to install them at some point:


    1)


    babel-loader


    2)


    babel-core


    3)


    babel-preset-es2015


    Terminal command to install all Babel developer tools mentioned above:


    **npm i babel-loader babel-core babel-preset-es2015 --save-dev**


    Further instructions for using Babel are available further down the line.


    **Webpack** is a developer tool used to bundle your complex modules with dependencies
    to


    simple static assets and minified and optimized distributions. Basically it converts
    unsupported files


    to supported one.


    164 | P a g e'
  - '[PAGE 164]


    Terminal command to install Webpack:


    **npm i webpack webpack-cli --save-dev**


    Webpack may need a configuration file, if your Webpack is < v4.0.0 or you plan
    to add


    plugins then it needs to be configured with a “**webpack.config.js**” configuration
    file. A CLI for


    Webpack may also be needed. (see later sections to learn how to setup webpack)


    Most development tools are updated very frequently and you need to stay updated
    with


    their documentation if you want to use them often.


    **The Import/Export**


    The **import/export** feature supplants the **require()** method or HTML importing
    in


    JavaScript/ES6, with this kind of importing scripts and modules becomes simpler
    to install and jack-


    in. This feature wouldn’t work in front-end apps without bundling with webpack
    to manually


    converting with Babel. Webpack supports **import/export** features out of box,
    however if you are


    using any other ES6 code that is not supported by your environment/browser then
    you need to use


    Babel development tools to convert the code.


    I imagine before there was modules, bindings, and libraries most of the code comprised
    of


    boiler-plate stuff, even in the era of using actual tape & punch cards for logic
    processing. Thankfully


    now we have modules so we don’t have to deal with boiler-plates (code that is
    copy pasted a lot).


    **Exports**


    The **export** keyword is used to pass on data to whoever is importing it.


    There are two ways to export data, the **default export** and the **named export**.


    A “**default**  **export**” is shown in Fig – 7.1


    const  name  =  “Ray”;


    export  default  name;


    *Fig - 7\. 1*


    Here we have exported the “**name**” variable as this module’s default export.


    There can only be one default export per module.


    165 | P a g e'
  - '[PAGE 165]


    A “**named export**” is shown in Fig – 7.2


    export  const  myVar  =  “Ray”;


    export  function  myFunk() {


    return  “Hello  World”;


    }


    *Fig - 7\. 2*


    Here we have exported both **myVar** and **myFunk** separately as named exports.


    There is no limit to named exports.


    **Imports:**


    To import node modules we need to install them and load them by their name only,
    while


    importing non-node modules we need to import them with their directory addresses.


    The **import** keyword is used to add code that another script/module is exporting
    to our


    script/module. We can import a singular method by name like in Fig – 7.1 or the
    whole binding like


    in Fig – 7.2.


    import { join } from  ‘lodash’;


    *Fig - 7\. 3*


    import  _  from  ‘lodash’;


    *Fig - 7\. 4*


    There are two types of **imports**:


    1.


    Imports from “default exports”.


    2.


    Imports from “named exports”.


    Default exports can be imported with any name as shown in Fig – 7.5, “**import
    name from**


    **‘./names’**” can be “**import anything from ‘./names’**”. If Fig – 7.1 is the
    ‘**names**’ module then this


    would be the import method.


    import  name  from  ‘./names’;


    console.log(name);


    *Fig - 7\. 5*


    166 | P a g e'
  - '[PAGE 166]


    For importing named exports we need their export names as shown in Fig – 7.6\.
    If Fig –


    7.2 is the ‘**names**’ module then this would be the import method.


    import { myVar, myFunk } from  ‘./names’;


    *Fig - 7\. 6*


    **myVar** and **myFunk** cannot be named anything else before importing successfully.


    **Multiple exporting:**


    Multiple Variables can be exported in a single line like in Fig – 7.7.


    const  myVar  =  “Ray”;


    function  myFunk() {


    return  “Hello  World”;


    }


    export { myVar, myFunk };


    *Fig - 7\. 7*


    **Renaming Exports with export/as:**


    Named exports can be exported with different names than their originally declared
    names,


    as shown in Fig – 7.8:


    const  myVar  =  "Ray";


    function  myFunk() {


    return  "Hello World";


    }


    export { myVar  as  name, myFunk  as  greet };


    *Fig - 7\. 8*


    The **myVar** Variable is exported as “**name**” and the **myFunk** Variable is
    exported as


    “**greet**”, they will be imported as:


    import { name, greet } from  ''./names'';


    console.log(name, greet);


    *Fig - 7\. 9*


