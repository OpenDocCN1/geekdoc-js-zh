    One thing to remember when using plugins with editors is to update them frequently
    (both the editor and the plugins).


    Now I work on a lot of machines and Operating systems, not all of them can sustain
    modern IDEs and workstations, this is why I got into the habit of using the light-weight
    **notepad++** code editor with ESLint’s CLI. Install them on a flash drive for
    plug ‘n play and you are good to go 9 out of 10 times.


    Now you can also add Git hooks (code that runs before actions like push, commit,
    receive, etc) in your repos so they only allow Linted code to be pushed to those
    repos.


    There are a lot of hook scripts available on the web, examples include pre-commit,
    post-commit, pre-receive, post-receive, etc. These hook scripts reside in the
    **“.git/hooks”** directory inside Git initialized folders, this initializing can
    be done either with a Terminal, Git’s bash-CLI, or Atom’s built-in Git GUI.


    To use **Git** hooks/pre-commit code follow the following instructions:


    1) Download Git installer from its official website or use APT, Chocolatey or
    any other package manager (via admin/root privileges) with one of the following
    commands: “**choco install git**”, “sudo apt install **git-core**”, etc.


    2) Create a new directory with Git using the following command: “git init **<dirName>**”
    (I named mine “lintedJSOnly”).


    3) Navigate to your new Git repo using a Terminal or Git Bash (Installed with
    Git on Windows):

    ![](img/8a6860449d086ad6675add2b749bcc36_159_0.png)

    *Fig - 6.35*


    4) Now you can create a new index.js file using “touch index.js”.


    5) Open this index.js file in Atom (which has built it Git integration too).


    6) Open the “lintedJSOnly” directory within Atom and navigate to the “**.git**”
    directory from the left-pane. (can navigate from Git bash)


    7) Make a duplicate code of the file named “**commit-msg.sample**” and name it
    “**commit-msg**”.


    8) Open this file, clear out the pre-existing code and add the code in Fig – 6.37
    to it.


    9) Now go to the index.js file in Atom and click on the Git icon in the bottom
    right corner, a right-pane will be drawn within Atom from which you can commit
    the changes (you can commit with Git bash too, which is what I recommend! commands
    provided later):

    ![](img/8a6860449d086ad6675add2b749bcc36_159_1.png)

    *Fig - 6.36*


    10) Now if it gives linting errors then fix them and commit again. If all errors
    are fixed then a lighted index.js file will be committed successfully.


    Pre-commit code for Commit-msg (You don’t need to worry about this too much):

    ![](img/8a6860449d086ad6675add2b749bcc36_160_0.png)

    *Fig - 6.37*


    You can also commit changes to the Master with the following commands while in
    the repo directory:


    1) git status

    2) git add –A

    3) git commit –m “some statement to tag commit with”


    Running these commands may take a while, especially if you have used NPM or something
    inside the directory.


    **Note:** The author personally doesn''t use ATOM as his Primary IDE of choice,
    he uses Vim! However, for the purpose of this book the use of ATOM is recommended.
    The author does prefer ATOM over stuff like sublime, and VSCode for the reason
    that HTML, CSS, and JS is to ATOM what Vim-Script is to Vim. To further Learn
    about Vim use the guide “**Simply Vim, by Ray Voice**”.


    ## Practice Project


    Now we will make a project and then you will make a MVP version of it! Remember
    when we made a paint app in chapter 4’s practice project? We will make it again,
    but this time we will use Atom, Git, and ESLint. You can use other editors like
    Vim, Sublime, etc. but I recommend:


    - Use Atom

    - Use Git

    - Use ESLint


    Here are the steps:


    1) Create the project.

    2) Initialize Git.

    3) Configure ESLint.

    4) Write the code.

    5) Test the code.

    6) Set up hooks.

    7) Commit the code.

    8) Fix errors.

    9) Refine the UI.

    10) Finalize.

    11) Deploy the project.

    12) Handle exceptions.

    13) Review the code.


    ## Closing Arguments


    Let’s revisit what we have learned!


    1) A primitive is data that is not an object and has no methods.

    2) JavaScript has 6 datatypes: String, Number, Boolean, Null, Undefined, and Symbol.

    3) All symbols are unique, if compared identity will be false unless it is true.

    4) Symbols are non-iterable/enumerable.

    5) Object.getOwnPropertySymbols() method is used to get symbolic keys from an
    object.

    6) Linting is the process of enforcing good practices and style, it is used to
    make code more manageable, readable, and immune to problems.

    7) ESLint is the prime linting software that comes with a CLI and has different
    plugins for code-editors; it is used to lint JavaScript/ES6 code.

    8) ESLint is configured in a file named “**.eslintrc.json**” which may be hidden,
    as files which have a dot as first character are hidden by default in some OSes
    and UIs.

    9) In “**.eslintrc.json**” file the “env” property holds the environments for
    which our code is written, the “extends” property holds the style-guide info we
    are using, and the rules property holds the status of the rules we are modifying.

    10) Airbnb is the best style guide to choose as a rule of thumb.

    11) ESLint comes with a CLI to use for Linting, however many code editors come
    with a built-in or an add-on version of ESLint.

    12) We can add exceptions for global variables with a global header comment like
    the one in Fig – 6.19.

    13) We can disable ESLint with a eslint disable comment available in Fig – 6.22.

    14) To use ESLint with ATOM you can install and configure the “linter” & “linter-eslint”
    packages.

    15) Atom has a built in GUI for Linting, and Git, and even GitHub.

    16) A Git hook can be configured to verify lint quality pre-commit.

    17) Remember to log into Git with your credentials like name & email using the
    commands: “**git config user.email <email>**” & “**git config user.name <name>**”.

