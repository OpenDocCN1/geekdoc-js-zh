    variable.


    5.


    De-structuring can be used to work with functions too.


    6.


    The **for/of** loop is a new feature in ES6, it iterates through an array returning
    the values of


    each index.


    7.


    Iterables methods like **forEach()**, and **map()** can’t use some keywords like
    loops do.


    8.


    Multidimensional arrays are arrays that have other arrays as members.


