- md: "\n## Practice Project\n\nNow we will make a project and then you will make\
    \ a MVP version of it! Today we are making a simple “Analogue Clock” app. Here\
    \ we are using Atom, and Webpack to build this project, but you can use anything\
    \ you like.\n\nHere are the check points, take it as it comes:\n\n- 1) Write the\
    \ HTML, CSS, & JS files separately.\n- 2) Make an Analogue Clock.\n- 3) Use ES6,\
    \ and any of the following: Webpack, Babel, BrowserSync and SystemJS.\n- 4) Use\
    \ ATOM, GIT, & ESLint.\n- 5) Make sure all files are properly linted & working.\n\
    \nGoing through this exercise will take you through the steps one by one until\
    \ they become instinctive.\n\nThe following instructions assume that you have\
    \ Atom, Git, NPM, & ESLint pre-installed globally.\n\nSteps:\n\n- 1) Make a new\
    \ directory from which to work from.\n- 2) Add this directory to Atom as a project.\n\
    - 3) Initialize this folder with NPM using \"**npm init**” command in a Terminal;\
    \ this will add the **package.json** file to this directory.\n- 4) Install the\
    \ following packages with NPM: (command “**npm i <pkg> --save**”)\n    - a. Moment.js\
    \ : **npm i moment --save**\n    - b. Webpack : **npm i webpack webpack-cli --save-dev**\n\
    - 5) In your app directory make 2 new folders named “dist” and “src”, they will\
    \ be used to hold distribution files and source code.\n- 6) Modify your “**package.json**”\
    \ file by adding the following properties to it:\n![](img/8a6860449d086ad6675add2b749bcc36_183_0.png)\n\
    *Fig - 7.44*\n- 7) Add the following script to your **package.json** file’s script\
    \ property.\n![](img/8a6860449d086ad6675add2b749bcc36_183_1.png)\n*Fig - 7.45*\n\
    - 8) Add the initial **src/index.js**, **dist/index.html**, **dist/main.css**\
    \ files to your app’s directory. (code for these files is provided further down\
    \ the line).\n- 9) Execute “**npm run webpack**”; this will add a **dist/main.js**\
    \ file to your app’s directory.\n- 10) Link your **main.css**, **main.js**, **index.html**,\
    \ files together. Use the **script** and **link** tags, duh!\n- 11) Initialize\
    \ ESLint with “**eslint --init**” and extend it to Airbnb style guide. See previous\
    \ chapter for instructions. This will add a “.**.eslintrc**” file to your app’s\
    \ directory.\n- 12) Restart Atom! (If eslint doesn’t start after previous step).\n\
    - 13) Initialize this project in Git from Atom or Git.\n- 14) Properly log in\
    \ to Git with a Terminal, (You have to login every time you begin working on this\
    \ project):\n  **git config user.email <yourEmail>**\n  **git config user.name\
    \ <yourName>**\n- 15) Execute **git status** (to check if we are initialized with\
    \ Git).\n- 16) Execute **git add –A** (to stage all files, this may take a while\
    \ the first time).\n- 17) Execute **git commit –m** **“some statement to tag commit\
    \ with”** (to commit to master).\n- 18) Each of the following commits can be made\
    \ from within Atom, but beware at the time of writing Atom has known glitches\
    \ when making prolonged commits.\n- 19) Write code for your app. Source code is\
    \ provided below.\n- 20) Import Moment.js in **src/index.js** to get time stamps.\n\
    ![](img/8a6860449d086ad6675add2b749bcc36_184_0.png)\n*Fig - 7.46*\n- 21) Now code\
    \ your app, make sure to re-bundle JS files after every modification if using\
    \ Webpack or Babel.\n- 22) Code for HTML, CSS, and JS is provided below. Remember\
    \ to use the browser/environment console for testing and debugging, don’t use\
    \ **console.log()** unless you need the value of Variables at specific points\
    \ during code execution.\n\nCode for **index.html**:\n```html\n<body>\n  <div\
    \ id=\"clockFace\"></div>\n  <div id=\"minuteFork\" class=\"fork\">\n    <div\
    \ id=\"minuteForkShadow\" class=\"forkShadow\"></div>\n  </div>\n  <div id=\"\
    hourFork\" class=\"fork\">\n    <div id=\"hourForkShadow\" class=\"forkShadow\"\
    ></div>\n  </div>\n  <script src=\"./main.js\"></script>\n</body>\n```\n*Fig -\
    \ 7.47*\n\nCode for **main.css** (which will be linked within the **<head></head>**\
    \ tags line in the following figure):\n```html\n<link href=\"./main.css\" rel=\"\
    stylesheet\" type=\"text/css\"/>\n```\n*Fig - 7.48*\n```css\n#clockFace {\n  position:\
    \ absolute;\n  background-color: pink;\n  height: 50vmin;\n  width: 50vmin;\n\
    \  border-radius: 50%;\n}\n.fork {\n  position: absolute;\n  height: 50vmin;\n\
    \  left: 25vmin;\n}\n.forkShadow {\n  width: 50vmin;\n  border-radius: 50%;\n\
    }\n#hourForkShadow {\n  background-color: black;\n  margin-top: 6vmin;\n  height:\
    \ 19vmin;\n}\n#minuteForkShadow {\n  background-color: red;\n  height: 25vmin;\n\
    }\n```\n*Fig - 7.49*\n\n**#clockFace** is used to give form to the clock itself.\
    \ **.fork** & **.forkShadow** is used to give form to the forks. **#hourForkShadow**\
    \ is used to give color and position the fork representing hours. **#minuteForkShadow**\
    \ is used to give color and position the fork representing minutes. Here the trick\
    \ is simple. On the face of the clock we will draw an invisible line from **12**\
    \ to **6**, this line is anchored at the center of the clock and is rotated to\
    \ show time. Now the top half of this line is made visible, this gives the illusion\
    \ of a clock’s fork. The hour fork is shrank using **margin-top**, and **height**,\
    \ notice how the height of hour fork is smaller than the height of minute fork,\
    \ this is achieved on line #20 and #24. Using JavaScript & some simple math we\
    \ will rotate these forks to show time.\n\nCode for **index.js** (which will be\
    \ bundled into main.js):\n```javascript\nimport moment from 'moment';\n\nsetInterval(()\
    \ => {\n  const [hour, minute] = moment().format('LT')\n    .split(' ')[0]\n \
    \   .split(':')\n    .map(x => +x);\n  const hourRotation = (360 / 12) * hour;\n\
    \  const minuteRotation = (360 / 60) * minute;\n  document.getElementById('hourFork')\n\
    \    .style.transform = `rotate(${hourRotation}deg)`;\n  document.getElementById('minuteFork')\n\
    \    .style.transform = `rotate(${minuteRotation}deg)`;\n}, 1000);\n```\n*Fig\
    \ - 7.50*\n\nNow let’s get with the narration!\n\nOn line #1 we have imported\
    \ a ‘moment’ library which is used to get time stamps.\nOn line #3 we have an\
    \ interval set to run every second.\nOn lines #4 to #7 we first get a time stamp,\
    \ then separate time and [pm/am] suffix, then separate hours and minutes, then\
    \ converts the string to numbers using a unary operator.\nOn lines #8 & #9 we\
    \ convert the hours and minutes to degrees of fork rotation by multiplying them\
    \ with degree to hour, and degree to minute ratios.\nOn lines #10 to #18 we rotate\
    \ the forks on the clock to show the time.\n\nHere is the output of code:\n![](img/8a6860449d086ad6675add2b749bcc36_187_0.png)\n\
    *Fig - 7.51*\n\nGood luck with the project, remember you should find your own\
    \ ways to make this clock project! The point is to get yourself to write ES6 code.\n\
    \n## Closing Arguments\n\nLet’s revisit the lessons of this chapter and take a\
    \ look at what we have learned! Following lessons are the rough outline of this\
    \ chapter.\n\n- 1) Dependencies are modules and packages that are shipped with\
    \ your project and are required for your apps to perform.\n- 2) Development-dependencies\
    \ are modules and packages that are not shipped with your project, they are just\
    \ required during the development phase and then are disposed.\n- 3) While we\
    \ can install NPM packages with: **npm i <pkg-name> --save**\n  we should install\
    \ development packages with: **npm i <pkg-name> --save-dev**\n- 4) Babel is used\
    \ to convert advanced ECMAScript code like ES6, ES7, etc. to standard ES5 code.\n\
    - 5) Webpack is a developer tool used to bundle complex, unsupported files to\
    \ standard, supported files.\n- 6) To install Webpack and its CLI use: **npm i\
    \ webpack webpack-cli --save-dev**\n- 7) Import/Export syntax is used in ES6 to\
    \ link JavaScript files.\n- 8) Default exports can be imported without knowing\
    \ the name of exported Variable.\n- 9) Named export can only be imported when\
    \ the user knows the name of the exported Variable.\n- 10) Default imports can\
    \ be imported with any name.\n- 11) All imports can be reassigned to another Variable\
    \ using the “as” keyword.\n- 12) While NPM modules can be imported just with their\
    \ name, to import scripts manually we need their directory address.\n- 13) SystemJS\
    \ a dependency can be used as an alternative to Webpack when working with import/export.\n\
    - 14) BrowserSync is an awesome development tool with a ton of features, most\
    \ useful one being the live reload feature, and the handy local host.\n- 15) Babel\
    \ can be used with its CLI.\n- 16) Babel presets can be used to access a lot of\
    \ features bundled into a single preset. This way you can use features of ES6,\
    \ ES7, etc. and a lot of experimental features too. A list is available on Babel’s\
    \ website.\n- 17) Polyfills are boilerplate code used to add support for unsupported\
    \ JavaScript features.\n- 18) The **class** notation is used to create object\
    \ factories.\n"
