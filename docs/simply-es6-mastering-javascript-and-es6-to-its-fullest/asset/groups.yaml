    \ 的响应转换为 JSON 格式”。\n\n在第 #14 行说：“完成第二个 promise，然后创建一个第三个 promise 来将转换后的值打印到控制台”。\n\
    \n一旦第三个 promise 完成，数据就会自动记录。就是这样！这里需要注意的另一点是 thenables 和 promises 的链式调用。这样做是为了控制信息的流。例如，假设如果第\
    \ #1 行的某些代码是 thenable（使用了 **then()** 方法）或 promise，并且必须在第 #2 行的某些代码之前执行，那么第 #1\
    \ 行的代码将使用 **then()** 方法来包裹第 #2 行的代码。这样，第 #1 行的代码将解析，然后第 #2 行的代码才会执行。现在，如果我们有第三行代码需要前面的几行运行，那么它也将被一个\
    \ **then()** 语句包裹，并成为三成员 promise 链的一部分。\n\n如果我们不将数据转换为 JSON、blob 或文本就直接打印数据，我们将得到类似这样的：\n\
    \n![](img/8a6860449d086ad6675add2b749bcc36_1)\n*图 5.6*\n\n**注意：** **then()** 方法接受一个函数作为第一个参数，该函数在\
    \ promise 完成时运行。可以传递第二个函数作为参数，该函数在 promise 失败时运行。\n\n现在让我给你们展示如何写一个简单的服务器并用 node\
