    **npm i webpack web-pack-cli --save-dev**


    7)


    Import/Export syntax is used in ES6 to link JavaScript files.


    8)


    Default exports can be imported without knowing the name of exported Variable.


    9)


    Named export can only be imported when the user knows the name of the exported


    Variable.


    10) Default imports can be imported with any name.


    11) All imports can be reassigned to another Variable using the “**as**” keyword.


    12) While NPM modules can be imported just with their same, to import scripts
    manually


    we need their directory address.


    13) SystemJS is a dependency can be used as an alternative to Webpack when working


    with **import/export**.


    14) BrowserSync is an awesome development tool with a ton of features, most useful
    one


    being the live reload feature, and the handy local host.


    15) Babel can be used with its CLI.


    16) Babel presets can be used to access a lot of features bundled in to a single
    preset. This


    way you can use features of ES6, ES7, etc. and a lot of experimental features
    too. A


    list is available on Babel’s website.


    17) Polyfills are boilerplate code used to add support for unsupported JavaScript
    features.


    18) The **class** notation is used to create object factories.


