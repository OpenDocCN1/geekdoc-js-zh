    ## 剩余参数/展开运算符 (Rest/Spread Operator)


    剩余/展开运算符是我非常喜欢的特性，它让很多工作变得更简单且易于管理。现在有些人会称它为“展开运算符”和“剩余参数”，对我来说完全没问题。正如你所知到的，三个点
    (**…**) 代表剩余/展开运算符，一旦你掌握了它，它将成为你的得力助手，取代掉你过去用过的许多其他方法。


    现在你已经遇到过以下代码：


    ```javascript

    2 let arr = ["...0123456789"];

    3 console.log(arr);

