    There are more objects for this type of behavior.


    4. tf.tidy() - clears tensors from memory.


    5. tf.square(t1) or t1.square() - squares all members within a tensor.


    6. t1.shape – returns the shape of a Tensor (the lengths of all Arrays present
    within the Tensor).


    7. tf.dispose() - destroys the memory related to a Tensor.


    8. tf.tidy() - cleans up all Tensors that are not returned by a function after
    executing it.


    9. tf.memory() - Return an object which contains info about allocated memory.


    10. t2.add(t2) or tf.add(t1, t2) – Adds 2 Tensors.


    11. t2.sub(t2) or tf.sub(t1, t2) – Subtracts 2 Tensors.


    12. t2.mul(t2) or tf.mul(t1, t2) – Multiplies 2 Tensors.


    There are many more Methods available, specially Math related Operations.


    Math for Tensors is just like math of Matrices:


    - In Sum related stuff all members from Array “A” are added or subtracted with
    their counterparts (defined by index numbers) from Array “B”.

    - In Product related stuff all members from Array “A” are multiplied or divided
    by every other member from Array “B”.


    Same thing happens with Tensors of all dimensions.


    Better go read up on some Mathematics, before diving in further in Machine Learning.


    Good luck!


