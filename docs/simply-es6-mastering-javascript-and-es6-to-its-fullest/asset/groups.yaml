    12) 重启 Atom!（如果 eslint 没有启动的话）。\n13) 在 Git 中初始化此项目。\n14) 在终端中正确配置 Git（当你开始工作项目时）：\n\
    \    `git config user.email <yourEmail>`\n    `git config user.name <yourName>`\n\
    15) 执行 **git status**（检查是否已初始化 Git）。\n16) 执行 **git add -A**（添加所有文件，第一次可能需要一些时间）。\n\
