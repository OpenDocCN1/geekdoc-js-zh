  - '[PAGE 168]


    6)


    Modify your “**package.json**” file by adding the following properties to it:


    ![](img/8a6860449d086ad6675add2b749bcc36_168_0.png)


    *Fig - 7\. 11*


    This is so your module won’t be published by mistake, and “**dist/main.js**” becomes


    your main JavaScript file.


    7)


    At this point install any dependencies you want bundled with your app, examples


    include “**npm i lodash --save**” etc.


    8)


    Now **import** these modules in your **src/index.js** which has ES6 and other


    unsupported code. Importing examples in Fig – 7.3 & Fig – 7.4.


    9)


    Using Terminal to navigate to your app’s directory and execute the following


    command:


    “**npx webpack**”


    where **npx** probably stands for Node Package eXecute.


    **Note:** If you have this command set up in the **scripts** property of **package.json**
