    errors were because of the **no-tabs** rule.


    2)


    The **indent** errors are fixed by giving each line the expected number of space
    characters.


    Once we fix all the **indent** problems we have 32 problems left! Nearly 12% of
    the errors


    were because of the **indent** rule. According to this rule whenever we feel the
    need to use a


    tab we should just replace it with 2 space characters instead.


    3)


    The **no-param-reassign** errors are fixed by declaring new variables and assigning
    them


    the values of parameters instead of mutating parameters directly. (Every time
    we mutate a


    parameter we also mutate the **arguments** keyword). In our markdown previewer
    code


    there was only 1 **no-param-reassign** code but in a large code base this error
    cease


    wonders.


    4)


    The **quotes** errors are fixed by using the desired string symbol everywhere
    we need


    strings; the Airbnb style-guide prefers single quotes. Once we fix all the **quotes**
    problems


    we have 19 problems left! 12 of the errors were because of the **quotes** rule.


