    Now Labels are used to group a code together and refer to it later, however they
    can also be used to manage code. It depends on the coder, but more often than
    not it depends on the project manager and your fellow coders. Some people say
    using labels is a bad practice, some people just don’t like them. It’s the “Mere
    Exposure Effect”, people stay away because they don’t see them that often, however
    I have used labels all my life, it is sort of a pseudo-functional coding where
    you get its benefits and so much more power over your code just by labeling it
    properly.


    This is how a label looks like:


    ```javascript

    3  labelX: { //this is a label named labelX

    4  document.write("Hello world!");

    5 }

    ```

    *Fig - 1. 2*


    And this is how I use it without ES6 methods:


