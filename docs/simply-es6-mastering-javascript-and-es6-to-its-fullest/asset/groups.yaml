    the “.eslintrc.json” file where all the rules reside and more rules can be added.
    (We don’t always have to cross rules, we can use other workarounds).


    There are some things you should know about ESLint rules before you learn to modify
    them.


    1) There are three stages of rules: “off”, “warning”, and “error”.

    2) You should always understand the reason behind the rule you are modifying.

    3) By default ESLint has no rules.

    4) You can either compile a custom list of rules to use, or you can use a common,
    pre-made style guide.

    5) I recommend using style-guides like AirBnB’s as you will be working with other
    people who will be proficient the common style guides not your custom ones.


