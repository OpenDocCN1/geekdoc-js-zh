    第 4 行的函数与第 8 行的**箭头**函数的功能相同，但编写它所需的击键次数显著减少；显著多少呢？旧方式需要 35 次击键（包括换行/回车键），而 ES6
    方式包括回车键在内只需要 28 次击键，这差了 7 次击键；什么？你觉得这不多？好吧，我算过账，平均每个项目至少声明 50 个函数，有时超过 300 个，现在那是大量的函数了！到这个为止，我已经背下了
    function 的拼写了！！！但说真的，箭头函数写起来更简单，看起来也更舒服；所以我们可以说，至少匿名/lambda 函数使用箭头语法更好。


