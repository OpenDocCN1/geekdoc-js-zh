- md: "\n*Fig - 7.28*\n\nThen you can just use a Terminal to navigate to the folder\
    \ you need to host and execute the following command to host it:\n\n“**npm run\
    \ server**”\n\nThis is the way to go for non-windows users. It’s very convenient.\n\
    \n## Babel\n\nWe have already established the following definition “**Babel is\
    \ a developer tool used to modify ES6 code to fit ES5 standards”, however Babel\
    \ is so much more than that, it can be used to convert ES6 to ES5, it can be used\
    \ to access features beyond ES6, it can be used to access experimental features\
    \ of JavaScript, and it alone can be used to perform many essential function of\
    \ development. A list of Babel plugins is available on its official website.\n\
    \nNow we don’t need all the features of Babel right now, we just need the ES6\
    \ features from it, we can install them manually but that is not needed, we are\
    \ going to install a ES6 aka ES2015 “**preset**” which comes with all the ES6\
    \ features.\n\nInstruction to setup & use Babel:\n\n1) Use a Terminal to navigate\
    \ to your app directory.\n\n2) Check NodeJS and NPM installations.\n\n3) Initialize\
    \ NPM with “**npm init**”.\n\n4) Install Babel-cli and ES6 preset using “**npm\
    \ i babel-cli babel-preset-es2015 --save**”.\n\n5) Now our directory should look\
    \ like this:\n\n![](img/8a6860449d086ad6675add2b749bcc36_176_0.png)\n*Fig - 7.29*\n\
    \n6) Now we add the following “babel” script to our **package.json** (remove the\
    \ test script):\n\n![](img/8a6860449d086ad6675add2b749bcc36_177_0.png)\n*Fig -\
    \ 7.30*\n\n7) Now the content of our **index.html** is in Fig – 7.31 and it is\
    \ using **main.js** file not **index.js**:\n\n![](img/8a6860449d086ad6675add2b749bcc36_177_1.png)\n\
    *Fig - 7.31*\n\n8) Now we don’t have a **main.js** file but we have an **index.js**\
    \ file in which we will write out ES6 code and then compile it to ES5. Let’s fill\
    \ our **index.js** file with the following ES6 code and save it:\n\n![](img/8a6860449d086ad6675add2b749bcc36_178_0.png)\n\
    *Fig - 7.32*\n\n9) Now we will execute the following command “**npm run babel**”\
    \ to get a **main.js** file which for now will be identical to our **index.js**\
    \ file.\n\n10) The reason that nothing happened is because we never configured\
    \ Babel to do anything. Now we can configure Babel with a “.babelrc**” or we can\
    \ add the contents of “**.babelrc**” inside our **package.json** file in a new\
    \ property named “**babel**” which is what I recommend. All we have to do is add\
    \ a “**babel**” property with a “**presets**” sub-property to our **package.json**\
    \ file, like the following example:\n\n![](img/8a6860449d086ad6675add2b749bcc36_178_1.png)\n\
    *Fig - 7.33*\n\nThis will tell Babel to compile our code using the “es2015” preset\
    \ which will convert ES6 code to ES5.\n\n11) Now run “**npm run babel**” command\
    \ again and this time **main.js** contents will hold the ES5 version of our ES6\
    \ code, like the following example:\n\n![](img/8a6860449d086ad6675add2b749bcc36_179_0.png)\n\
    *Fig - 7.34*\n\nAmazing right?! And Babel even has a hot-reload property, so as\
    \ you write and save ES6 code in **index.js** you can see your code’s ES5 compilation\
    \ live as long as the Terminal window carrying out the “**npm run babel**” command\
    \ is running in the background.\n\nYou can use additional plugins with Babel,\
    \ however plugins are not something you are going to need in your day to day operations.\
    \ Most of the time you will require babel presets and polyfills, I use presets\
    \ for ES5 and React in most of my web development projects.\n\nNow before you\
    \ start using Babel in your official projects I recommend that you get a firm\
    \ grasp of it! Go to the official website and learn the documentation.\n\n## Polyfills\n\
    \nA Polyfill allows us to enable unsupported ES6 code without converting it to\
    \ ES5. In its simplest form Polyfills are just boiler-plates, they are just code.\n\
    \nLook at the following example:\n\nInput:\nLet arr = “abc”.repeat(3);\ndocument.body.innerHTML\
    \ = arr;\n*Fig - 7.35*\n\nOutput:\n![](img/8a6860449d086ad6675add2b749bcc36_180_0.png)\n\
    *Fig - 7.36*\n\nThis code works fine in my browser, which is the latest version\
    \ of Firefox at time of writing. However when I run it in an older version of\
    \ Firefox it doesn’t work! It’s not working because the older version doesn’t\
    \ support the “repeat()” method. Now if I want an older browser to support ES6\
    \ code without Webpack, Babel, etc. then I need to add a Polyfill that allows\
    \ Firefox to support repeat(), and most of Polyfills are available on https://developer.mozilla.org.\n\
    \nNow working with polyfill-plates is not a good idea, they mutate the window\
    \ object which is not appropriate; instead what you can do is approach this two\
    \ ways:\n\n- You can use “babel-polyfill” package: All you have to do is either\
    \ “import” or “require()”.\n- You can use Polyfill.io library: This library comes\
    \ with a plug-n-play script tag that determines what browser needs and plugs those\
    \ polyfills accordingly. You can also create your own polyfills!\n\n## Classes\
    \ & inheritance\n\nNow let’s see if we remember it correctly, classes are sort\
    \ of factories, they take arguments and return objects. Let’s look at the following\
    \ code:\n\nInput:\nfunction Person(name, age) {\n  name = name;\n  age = age;\n\
    }\nconst johnDoe = new Person(\"John Doe\", 45);\nconst janeDoe = new Person(\"\
    Jane Doe\", 45);\nconsole.log(johnDoe);\nconsole.log(janeDoe);\n*Fig - 7.37*\n\
    \nIn the code above the function on line #1 is a class written in the old ES5\
    \ notation, its purpose is to initialize objects using provided arguments. Note\
    \ the capitalization of its name, classes are declared with their name’s first\
    \ character as capitalized letter. We can add methods in its prototypes and then\
    \ those method will be inherited by every instance of that class. For example:\n\
    \nInput:\nfunction Person(name, age) {\n  name = name;\n  age = age;\n}\nPerson.prototype.info\
    \ = function() {\n  console.log(`%cthis.name} is ${this.age} years old`, \"font-size:22px;\
    \ color:orange\");\n};\nconst johnDoe = new Person(\"John Doe\", 45);\nconst janeDoe\
    \ = new Person(\"Jane Doe\", 45);\njohnDoe.info();\njaneDoe.info();\n*Fig - 7.39*\n\
    \nOutput:\n![](img/8a6860449d086ad6675add2b749bcc36_181_1.png)\n*Fig - 7.40*\n\
    \nHere the Person class had a new method named “info()” added to its prototype,\
    \ this method logs the information of the instance like its name and age in giant,\
    \ orange colored text.\n\nNow, ES6 comes with the “class” keyword which is a new\
    \ way to make classes. So this:\n\n```javascript\nfunction Pizza(topping, cheese)\
    \ {\n  name = `Pop’s ${topping} & ${cheese} pizza`;\n  topping = topping;\n  cheese\
    \ = cheese;\n}\nPizza.prototype.myOrder = function() {\n  console.log(`You ordered\
    \ %c${this.name}`, \"font-size:22px; color:red\");\n};\nconst myPepperoni = new\
    \ Pizza(\"pepperoni\", \"mozzarella\");\nmyPepperoni.myOrder();\n```\n*Fig - 7.41*\n\
    \nBecomes this:\n\n```javascript\nclass Pizza {\n  constructor(topping, cheese)\
    \ {\n    this.name = `Pop’s ${topping} & ${cheese} pizza`;\n    this.topping =\
    \ topping;\n    this.cheese = cheese;\n  }\n  myOrder() {\n    console.log(`You\
    \ ordered %c${this.name}`, \"font-size:22px; color:red\");\n  }\n}\nconst myPepperoni\
    \ = new Pizza(\"pepperoni\", \"mozzarella\");\nmyPepperoni.myOrder();\n```\n*Fig\
    \ - 7.42*\n\nOutput for both is:\n\n![](img/8a6860449d086ad6675add2b749bcc36_182_0.png)\n\
    *Fig - 7.43*\n\nNow I acknowledge that using the “class” keyword notation to declare\
    \ classes will somewhat increase the code quantity, but it will improve code quality\
    \ dramatically. For more Info check next chapter…\n"
