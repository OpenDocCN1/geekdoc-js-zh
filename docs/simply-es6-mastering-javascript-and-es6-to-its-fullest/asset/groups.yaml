    \ following in-between.\n\n**Note:** You may need a **\\s** character or any other\
    \ character classes to control that matching when using ranges.\n\n### Positive\
    \ and Negative Look-arounds\n\nA look-around pattern tells the Regex to search\
    \ for multiple pattern in a string. There are four categories of look-arounds:\
    \ there is the “Positive look-ahead” and the “Negative look-ahead”, then there\
    \ is the Positive Look-behind, and the negative look-behind.\n\nLet’s look at\
    \ some descriptions:\n\n1) A positive look-ahead is signified by a **(?=foo)**\
    \ sign, and it checks what immediately follows the current position in the string\
    \ is **foo**.\n\n2) A negative look-ahead is signified by a **(?!foo)** sign,\
    \ and it checks what immediately follows the current position in the string is\
    \ not **foo**.\n\n3) A look-behind is signified by a **(?<=foo)** and it checks\
    \ what immediately precedes the current position in the string is **foo**.\n\n\
    4) A look-behind is signified by a **(?<!foo)** and it checks what immediately\
    \ precedes the current position in the string is not **foo**.\n\nAlways enclose\
    \ a look-around within parenthesis.\n\nThe most basic application of a look-ahead\
    \ is to search for a password pattern. Look at the following code:\n\n```javascript\n\
    const password = \"abc123\";\nconst passwordRegex1 = /b(?=\\w)/;\nconst passwordRegex2\
    \ = /b(?!\\w)/;\n\nconsole.log(passwordRegex1.test(password));\nconsole.log(passwordRegex2.test(password));\n\
