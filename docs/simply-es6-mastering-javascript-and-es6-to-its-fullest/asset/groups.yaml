    **CLI Project #2 – CLI project initializing**


    **program**


    In this project we will make a simple Command Line Utility to initialize a CLI+NodeJS


    project. Let’s call it the “Congenial CLI Forge”!


    Use the following instructions to develop this project:


    1.


    Make a new directory for your project and name it “Congenial CLI Forge”.


    2.


    Navigate to it from a Terminal, and use `**npm init**` to initialize the project.


    3.


    Add a shebang sequence to index.es6.js.


    4.


    Use `**npm i babel-cli babel-preset-es2015 --save-dev –prefer-offline**`.


    5.


    Add the following code to your `**package.json**` in the appropriate place, scripts
    will go


    into scripts, and babel object will be put as a first-order member:


    "scripts": {


    "babel": "babel index.es6.js --watch --out-file index.js"


    },


    "babel": {


    "presets": ["es2015"]


    }


    6.


    Use `**npm run babel**` to transpile index.es6.js to index.js. Use another terminal
    for the rest


    of the commands.


    7.


    Add the following code (or you own code) to `**index.es6.js**`:


    #!/usr/bin/env node


    import  shell  from  ''shelljs'';


    const  PROJECT_NAME  =  process.argv[2];


    // Making project directory


    shell.exec(`mkdir ${PROJECT_NAME}`);


    // Making project javascript files


    shell.exec(`echo ''#!/usr/bin/env node'' >> ${PROJECT_NAME}/index.es6.js`);


    shell.exec(`touch ${PROJECT_NAME}/index.js`);


    // Initializing NPM


    shell.exec(`cd ${PROJECT_NAME} && npm init -y`);


    // Installing babel-cli and ES6 preset


    shell.exec(`cd ${PROJECT_NAME} && npm i babel-cli babel-preset-es2015 --save-dev


    --prefer-offline`); // Installed babel-cli and ES6 presets


    console.log(''Make sure to edit the package.json file!'');


    8.


    Use `**node index.js**` to check the output. Test if it works, it should create
    a project


    directory and install developer dependencies for you.


