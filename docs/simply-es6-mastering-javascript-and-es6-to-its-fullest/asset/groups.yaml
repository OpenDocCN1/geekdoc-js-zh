    ## The Arrow Functions


    JavaScript has a new way to write functions. It’s easier, more manageable, and
    to top it it’s more readable. First let’s see the main difference between the
    old way and the ES6 way.


    Old way:


    1 function funk() {

    3 // code here

    4 }


    *Fig - 1. 44*


    The ES6 way:


    1 const funk = () => {

    3 // code here

    4 }


    *Fig - 1. 45*


    This way may seem unreasonable since you can see no apparent reason to use fat
    arrow notation, and it appears to need more done; however that’s just an illusion!
    Fat arrow functions need less writing and are more readable. Look at the following
    examples.


    1 const x = "Hello World";

    4 setTimeout(function (){

    5 console.log(x);

    6 }, 1000);

    8 setTimeout(()=>{

    9 console.log(x);

    10 }, 1000);


    *Fig - 1. 46*


    The function on line 4 does the same thing as the **fat arrow** function on line
    8, however it requires significantly less key-strokes to write; how significant?
    Well the old way takes 35 key-strokes including the next-line/enter key, while
    the ES6 way takes 28 key-strokes including the enter key, that is a difference
    of 7 key-strokes; what? That’s not much you say? Well I did the math and on average
    I declare at least a 50 functions per project, sometimes over 300, now that is
    a lot of functions! By this time I have the spelling of function memorized!!!
    But seriously fat arrow guys are easier to write, and easy on the eyes too; so
    we can say that at least anonymous/lambda functions are better to write in fat
    arrow notation.

