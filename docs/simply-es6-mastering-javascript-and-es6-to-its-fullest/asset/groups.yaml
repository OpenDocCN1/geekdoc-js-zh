    However we use the console object very often, so now we should go to the official
    ESLint


    website to investigate the reason of discouraging the use of the **console** object.


    Now ESLint’s reason for discouraging the use of the **console** object is because
    the use of


    this object is for debugging purposes, however the end-user doesn’t need to see
    any output from the


    console, these outputs may contain sensitive information, or even just executing
    them slows down


    the script and the browser. Calls using console should be stripped from the final
    product.


    Now all that is fine but we still need to allow ourselves the use of the **console**
    object to


    perform debugging tasks, so we need to disable the no-console rule in the “**.eslintrc.json**”
    file where


    all the rules reside and more rules can be added. (We don’t always have to cross
    rules, we can use


    other workarounds).


    There are some things you should know about ESLint rules before you learn to modify


    them.


    1)


    There are three stages of rules: “off”, “warning”, and “error”.


    2)


    You should always understand the reason behind the rule you are modifying.


    3)


    By default ESLint has no rules.


    4)


    You can either compile a custom list of rules to use, or you can use a common,
