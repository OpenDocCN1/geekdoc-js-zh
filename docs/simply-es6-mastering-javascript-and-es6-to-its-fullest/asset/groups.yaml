    ## 第 1 章 – 基础


    ES6 对 JavaScript 来说并不是一个非常新的升级版。你会发现，你一直在使用的 JavaScript 是第 5 版 JavaScript，我记得最后一次更新是在
    2009 年……在很长一段时间里，JavaScript/ES5 尽所能地支持 Web，然而，万物皆有终结，以便更好的事物诞生……那个更好的东西就是 ES6！ES6
    同 Node.js 和 React-Native，将 JavaScript 推向了一个全新的层次！除了 C/C++ 外，我从未见过比 JavaScript
    更多功能且实用的东西。尽管它取决于具体的项目，但 JavaScript 的优点远超缺点。它可能没有汇编、Go 或 C 那么快，可能没有 Python 那么易于阅读，但它始终是我完成任务的首选！它是跨平台的，易扩展的，并且未来广阔。


    作为雇主和项目经理，我的亲身经验是 JavaScript 项目通常比其他项目便宜。劳动力廉价且常见，尽管申请者与编写 Java、C# 甚至 Swift 的人员相比经验较少；但最棒的是调试流程，几乎所有的常见
    bug 都有良好的记录且容易修复。此外，大多数与 JavaScript 相关的技术都是免费开源的。


    Java 的格言是“一次编写，随运行！”如果我没记错的话（我记得！）；然而，用 Java 编写一次会让你的公司破产；而 JavaScript 可以在不进行任何重大妥协的情况下履行这一承诺。


    在此之后你应该了解几件事（如果你还不知道的话），使用 JavaScript 有多种方法。你可以使用 Node.js 做前端；可以使用 Express 做后端；可以使用
    React 做 UI；可以使用算法处理逻辑；可以使用数据库处理数据；可以使用 REST 使用 API；可以使用 Jest 进行测试。


    记住，一旦你选择了一种约定和表示法，就必须贯穿整个项目坚持下去；我不需要向你解释编译器和解释器的区别。编译器是一种翻译器，翻译由指令提供的逻辑；像 C/C++
    这样的语言是被编译的。解释器简单来说是一种转译器，它获取代码并转换为更理想的形式；JavaScript 是被解释的。然后是解析器（Parser），它将数据转换为更理想的形式；HTML
    是被解析的。


    ## 从标签与注释开始


    所有优秀的编程书籍都应该从标签和注释开始。标签和注释让代码管理变得容易。它还能帮助我们避免不必要的模块导入。此外，我采访过的大多数并没有真正对他们的代码进行记录和标记，有时这会让软件扩展和他人协作变得困难。我任何时候都愿意选择一个记录良好的程序员，也不愿选择一个会体操的程序员。


    JavaScript 中的注释分为两种。单行注释使用 `// comment` 写。而多行注释则使用 `/* comment */` 写。


    ```javascript

    // 这是一个单行注释

    // 这是另一个单行注释


    /*

    这是一个多行注释，

    它可以用于解释一段代码，

    并应该在函数和作用域中广泛使用

    */

    ```

