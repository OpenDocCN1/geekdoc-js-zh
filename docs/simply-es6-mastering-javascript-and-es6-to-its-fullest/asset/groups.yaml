    Write the HTML, CSS, & JS files is separately.


    2)


    Make a Paint App.


    3)


    Use ATOM, GIT, & ESLint.


    4)


    Make sure all files are properly linted & working.


    5)


    Make a pre-commit-linting Git hook in the project.


    6)


    Commit the files to Master.


    Going through this exercise will take you through the steps one by one until they
