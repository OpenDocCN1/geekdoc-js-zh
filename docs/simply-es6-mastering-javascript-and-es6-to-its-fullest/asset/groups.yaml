- md: "\nIn a way **Cheese** is a parent class while **Pizza** is its child class\
    \ since Pizza is just cheese and bread. (But it’s more than that, am I right!?)\n\
    \n## Extending Class by Arrays\n\nJust like extending one class to another class,\
    \ classes can also be extended to **Array**; this will give the extended classes\
    \ traits of an array. Look at the following code for example:\n\n```javascript\n\
    class Recipe extends Array {\n  constructor(name, ...items) {\n    super(...items);\n\
    \    this.name = name;\n  }\n}\n\nconst recipe_1 = new Recipe(\"Fondue Feast\"\
    , \"Bread\", \"Cheese\", \"Oregano\");\n```\n*Fig - 8.11*\n\nOutput:\n![](img/8a6860449d086ad6675add2b749bcc36_196_0.png)\n\
    *Fig - 8.12*\n\nIn the code in Fig – 8.11, we have a class “**Recipe**” which\
    \ extends to the **Array** object, so all the instances of **Recipe** are arrays\
    \ as displayed in Fig 8.12.\n\nNotice that **name** is a property not a member\
    \ of the array. So we have an array with additional properties.\n\nWe can add\
    \ methods to our arrays as well, just like this:\n\n```javascript\nclass Recipe\
    \ extends Array {\n  constructor(name, ...items) {\n    super(...items);\n   \
    \ this.name = name;\n  }\n  append(ingredient) {\n    this.push(ingredient);\n\
    \  }\n}\n\nconst recipe_1 = new Recipe(\"Fondue Feast\", \"Bread\", \"Cheese\"\
    , \"Organgano\");\n```\n*Fig - 8.13*\n\nOutput:\n![](img/8a6860449d086ad6675add2b749bcc36_197_0.png)\n\
    *Fig - 8.14*\n\nUsing the method named “**append()**” that we wrote we can add\
    \ ingredients to our recipe.\n\nAnother thing you should notice is the output\
    \ of **for/in** and **for/of** loops when this array is subjected to them:\n\n\
    ```javascript\nfor(let x in recipe_1) {console.log(x)}\nfor(let x of recipe_1)\
    \ {console.log(x)}\n```\n*Fig - 8.15*\n\nOutput:\n![](img/8a6860449d086ad6675add2b749bcc36_197_1.png)\n\
    *Fig - 8.16*\n\nNow this outcome we expected, but what is that on the 4th line!?\
    \ Why is “name” logged?\n\nYou can see that it was logged by the **for/in** loop\
    \ on line #14, this is because the **for/in** loop iterates over properties (it\
    \ is looking **for** properties **in** array); on the other hand the **for/of**\
    \ loop iterates over the members of the array.\n\n## Generator functions & yield\n\
    \nA “Generator function” is a function with an asterisk “*” as a suffix after\
    \ the **function** keyword. A generator also has “Buffer returns” or “Yields”.\n\
    \nA **yield** is basically a return that gives an output and pauses the code after\
    \ it until the function calls the next **yield**. To use a generator and yield\
    \ properly we call it with the **next()** method, this method returns an object\
    \ with two properties “**value**” & “**done**”, the **value** prop gives us the\
    \ value returned by **yield** and the **done** prop tells us whether the function\
    \ is paused or completed executing by returning **true** or **false**. Let’s take\
    \ a look at the following code:\n\n```javascript\nfunction* myFunk() {\n  yield\
    \ \"1st\";\n  yield \"2nd\";\n  yield \"3rd\";\n  return \"4th\";\n}\n```\n*Fig\
    \ - 8.17*\n\nOutput:\n![](img/8a6860449d086ad6675add2b749bcc36_198_0.png)\n*Fig\
    \ - 8.18*\n\nHere we assigned the function to a variable, then called it with\
    \ the **next()** method three times; the 1st time it returned the 1st yield’s\
    \ value then paused the function after line #2 all the way to line #5, the 2nd\
    \ time it returned the 2nd yield’s value then paused the function after line #3\
    \ all the way to line #5, the 3rd time it returned the 3rd yield’s value then\
    \ paused the function after line #4 to line #5, each of these times it returned\
    \ with the **done** prop set to **false**, now the 4th time we called **x.next()**\
    \ we got the value from **return** on line #5 and the **done** prop was set to\
    \ true this is because now the function is finally done.\n\nNow don’t try to call\
    \ **myFunk().next()** it will move forward from the first yield and slow down\
    \ if called within a loop. Generators should always be used after being assigned\
    \ to a variable. If there is no **return** or **yield** in a function it will\
    \ just return the **value** prop as **undefined**. The asterisk can be used either\
    \ as a suffix to the **function** keyword or a prefix to the name.\n\n## Generators\
    \ & Asynchronous calls\n\nGenerators can be used with asynchronous requests and\
    \ responses to take a lot of guesswork and headache out of the equation. Let’s\
    \ look at the following code:\n\n```javascript\nconst login = (function* handshake()\
    \ {\n  yield \"You are here 1st\";\n  yield \"You are here 2nd\";\n  yield \"\
    You are here 3rd\";\n})();\n\nsetTimeout(() => {\n  console.log(login.next());\n\
    }, 1000);\n\nsetTimeout(() => {\n  console.log(login.next());\n}, 2000);\n\nsetTimeout(()\
    \ => {\n  console.log(login.next());\n}, 3000);\n```\n*Fig - 8.19*\n\nOutput:\n\
    ![](img/8a6860449d086ad6675add2b749bcc36_200_0.png)\n*Fig - 8.20*\n\nNow the code\
    \ in Fig - 8.19 on lines #1 to #5 we created a generator and assigned it to login\
    \ variable. On lines #7 to #9 we have some code simulating the 1st device logged.\
    \ On lines #11 to #13 we have some code simulating the 2nd device logged. On lines\
    \ #15 to #17 we have some code simulating the 3rd device logged. In the output\
    \ each device gets a rank from 1st to 3rd depending upon its order. This is to\
    \ demonstrate how calls of the same function at different times can get different\
    \ results without the function being written in a complex manner. These generators\
    \ are often used to work with APIs.\n\n## Generators & for/of loops\n\nGenerators\
    \ can easily be iterated through by **for/of** loop without using **next()** or\
    \ **next().value**. Look at the following code:\n\n```javascript\nfunction* myFunk\
    \ = (function* gen() {\n  yield \"You are here 1st\";\n  yield \"You are here\
    \ 2nd\";\n  yield \"You are here 3rd\";\n})();\n\nfor (let i of myFunk) {\n  console.log(i);\n\
    }\n```\n*Fig - 8.21*\n\nOutput:\n![](img/8a6860449d086ad6675add2b749bcc36_200_1.png)\n\
    *Fig - 8.22*\n\nSee how on line #8 of Fig – 8.21 we haven’t used **next()** or\
    \ its **value** prop.\n\n## Proxies\n\nProxies are a meta-programming feature,\
    \ which basically means that via proxies you can read, write, and mutate the code\
    \ itself. In ES6 proxies operate on objects using handlers, traps, targets, etc.\
    \ each of these expressions are simply clarified in the subsections.\n\nInput:\n\
    \n```javascript\nconst myObj = { name: 'John', age: 40 };\nconst myHandler = {\n\
    \  get(target) {\n    return target;\n  }\n};\nconst myObjViaProxy = new Proxy(myObj,\
    \ myHandler);\n```\n*Fig - 8.23*\n\nOutput:\n![](img/8a6860449d086ad6675add2b749bcc36_201_0.png)\n\
    *Fig - 8.24*\n\nIn the input on line #1 we have an arbitrary object. Lines #2\
    \ to #6 has a handler, which is basically an object that has methods to work on\
    \ the code itself. On lines #4 to #5 we have a **get** method that intercepts\
    \ the **target** object of that handler and works with it by reading, mutating,\
    \ etc. On line #7 we have another proxy **myObjViaProxy** that is a proxy to **myObj**.\
    \ In this line we have two arguments passed to this proxy, the first argument\
    \ is the target object which we are being directed towards by the proxy, and the\
    \ second argument is a handler which will handle the props before they are returned\
    \ to us. Each method in the handler is called a trap.\n\nLet’s look at another\
    \ example:\n\n```javascript\nconst myObj = { name: ' John ', age: 40 };\nconst\
    \ myHandler = {\n  get(target, name) {\n    return target[name].trim();\n  }\n\
    };\nconst myObjViaProxy = new Proxy(myObj, myHandler);\n```\n*Fig - 8.25*\n\n\
    ![](img/8a6860449d086ad6675add2b749bcc36_202_0.png)\n*Fig - 8.26*\n\nHere we have\
    \ another proxy on line #7, and notice on line #3 we have passed a **name** parameter\
    \ we will be passed the name of the prop we are calling as an argument, which\
    \ in this case we are accessing **myObj.name** so the prop-name passed to **name**\
    \ parameter will be **“name”**; don’t worry if it feels confusing, it will be\
    \ easier after a few practice rounds. On line #4 we used a **trim()** method to\
    \ fix the extra spaces in **myObj.name**.\n\nNow one thing I want to warn you\
    \ to know about here is the fact the objects in JavaScript are called by reference,\
    \ so if the original object is mutated, then each object that it is assigned to\
    \ will also be mutated.\n\nNow let’s look at another example:\n\n```javascript\n\
    const contacts = new Proxy({}, {\n  get(target, name) {\n    return target[name];\n\
    \  },\n  set(target, name, value) {\n    target[name] = value;\n  }\n});\n\nclass\
    \ Contact {\n  construction(name, number) {\n    this.name = name;\n    this.number\
    \ = number;\n  }\n}\n```\n*Fig - 8.27*\n"
  mdcn: "\n\n在某种意义上****Cheese**（奶酪）是一个父类而**Pizza**（披萨）是它的子类，因为披萨只是奶酪和面包。（但不仅仅如此，对吧！）\n\
    \n## 通过数组扩展类\n\n就像将一个类扩展到另一个类一样，类也可以扩展到 **Array**；这将使得扩展后的类具有数组的特性。请看下面的示例：\n\n\
    ```javascript\nclass Recipe extends Array {\n  constructor(name, ...items) {\n\
    \    super(...items);\n    this.name = name;\n  }\n}\n\nconst recipe_1 = new Recipe(\"\
    Fondue Feast\", \"Bread\", \"Cheese\", \"Oregano\");\n```\n*图 - 8.11*\n\n输出：\n\
    ![](img/8a6860449d086ad6675add2b749bcc36_196_0.png)\n*图 - 8.12*\n\n在图 8.11 代码中，我们有一个名为“**Recipe**”的类，它扩展了\
    \ **Array** 对象，因此如图 8.12 所示，所有 **Recipe** 的实例都是数组。\n\n注意，**name** 是一个属性而不是数组的成员。因此我们拥有一个带有额外属性的数组。\n\
    \n我们也可以为数组添加方法，如下所示：\n\n```javascript\nclass Recipe extends Array {\n  constructor(name,\
    \ ...items) {\n    super(...items);\n    this.name = name;\n  }\n  append(ingredient)\
    \ {\n    this.push(ingredient);\n  }\n}\n\nconst recipe_1 = new Recipe(\"Fondue\
    \ Feast\", \"Bread\", \"Cheese\", \"Organgano\");\n```\n*图 - 8.13*\n\n输出：\n![](img/8a6860449d086ad6675add2b749bcc36_197_0.png)\n\
    *图 - 8.14*\n\n使用我们写的名为“**append()**”的方法，我们可以为配谱添加食材。\n\n你应该注意的另一点是当该数组被 **for/in**\
    \ 和 **for/of** 循环处理时的输出：\n\n```javascript\nfor(let x in recipe_1) {console.log(x)}\n\
    for(let x of recipe_1) {console.log(x)}\n```\n*图 - 8.15*\n\n输出：\n![](img/8a6860449d086ad6675add2b749bcc36_197_1.png)\n\
    *图 - 8.16*\n\n现在结果是符合预期的，但第四行是什么！？为什么“name”被打印了？\n\n你可以看到它是通过第 14 行的 **for/in**\
    \ 循环打印的，这是因为 **for/in** 循环遍历的是属性（它是在数组**中**查找**属性）；而另一方面，**for/of** 循环遍历的是数组的成员。\n\
    \n## 生成器函数与 yield\n\n“生成器函数”是在 **function** 关键字后面带有星号“*”作为后缀的函数。生成器还具有“缓冲区返回”或“Yield（产出）”。\n\
    \n**yield** 基本上是一种返回，它提供一个输出并在之后暂停代码，直到函数调用下一个 **yield**。要正确地使用生成器和 yield，我们通过\
    \ **next()** 方法调用它，该方法返回一个带有两个属性“**value**”和“**done**”的对象，**value** 属性带给我们由 **yield**\
    \ 返回的值，而 **done** 属性告诉我们函数是暂停还是已完成执行（通过返回 **true** 或 **false**）。让我们来看下面的代码：\n\n\
    ```javascript\nfunction* myFunk() {\n  yield \"1st\";\n  yield \"2nd\";\n  yield\
    \ \"3rd\";\n  return \"4th\";\n}\n```\n*图 - 8.17*\n\n输出：\n![](img/8a6860449d086ad6675add2b749bcc36_198_0.png)\n\
    *图 - 8.18*\n\n在这里我们将函数赋值给一个变量，然后使用 **next()** 方法调用了三次；第一次它返回第一个 yield 的值，然后在第\
    \ 2 行后暂停函数，一直到第 5 行；第二次它返回第二个 yield 的值，然后在第 3 行后暂停函数，一直到第 5 行；第三次它返回第三个 yield\
    \ 的值，然后在第 4 行后暂停函数到第 5 行，每次返回时 **done** 属性都设置为 **false**。现在当我们第四次调用 **x.next()**\
    \ 时，我们得到了来自第 5 行 **return** 的值，且 **done** 属性被设置为 true，这是因为现在函数终于完成了。\n\n现在不要尝试调用\
    \ **myFunk().next()**，它将从第一个 yield 开始向前移动，如果在循环内调用将会变慢。生成器应该始终在赋值给变量后使用。如果函数中没有\
    \ **return** 或 **yield**，它将仅仅返回 **undefined** 的 **value** 属性。星号可以作为 **function**\
    \ 关键字的后缀，也可以作为名称的前缀。\n\n## 生成器与异步调用\n\n生成器可以与异步请求和响应一起使用，消除大量的猜测和头疼。让我们来看下面的代码：\n\
    \n```javascript\nconst login = (function* handshake() {\n  yield \"You are here\
    \ 1st\";\n  yield \"You are here 2nd\";\n  yield \"You are here 3rd\";\n})();\n\
    \nsetTimeout(() => {\n  console.log(login.next());\n}, 1000);\n\nsetTimeout(()\
    \ => {\n  console.log(login.next());\n}, 2000);\n\nsetTimeout(() => {\n  console.log(login.next());\n\
    }, 3000);\n```\n*图 - 8.19*\n\n输出：\n![](img/8a6860449d086ad6675add2b749bcc36_200_0.png)\n\
    *图 - 8.20*\n\n现在，图 8.19 的第 1 到 5 行创建了一个生成器并将其赋值给变量 login。在第 7 到 9 行，我们有一段代码模拟了第一个设备。在第\
    \ 11 到 13 行，我们有一段代码模拟了第二个设备。在第 15 到 17 行，我们有一段代码模拟了第三个设备。在输出中，每个设备根据顺序获取 1st 到\
    \ 3rd 的结果。这演示了如何以复杂的方式调用同一个函数以得到不同的结果。这些生成器通常用于处理 API。\n\n## 生成器与 for/of 循环\n\n\
    生成器可以轻松地通过 **for/of** 循环迭代，而无需使用 **next()** 或 **next().value**。看下面的代码：\n\n```javascript\n\
    function* myFunk = (function* gen() {\n  yield \"You are here 1st\";\n  yield\
    \ \"You are here 2nd\";\n  yield \"You are here 3rd\";\n})();\n\nfor (let i of\
    \ myFunk) {\n  console.log(i);\n}\n```\n*图 - 8.21*\n\n输出：\n![](img/8a6860449d086ad6675add2b749bcc36_200_1.png)\n\
    *图 - 8.22*\n\n看图 8.21 的行，我们没有使用 **next()** 或其 **value** 属性。\n\n## Proxy（代理）\n\n\
    Proxy 是一种元编程功能，意味着通过代理可以读取、写入和修改代码本身。ES6 代理使用处理器（handlers）、目标（targets）等来操作对象。这些表达式在子节中会有简单的说明。\n\
    \n输入：\n\n```javascript\nconst myObj = { name: 'John', age: 40 };\nconst myHandler\
    \ = {\n  get(target) {\n    return target;\n  }\n};\nconst myObjViaProxy = new\
    \ Proxy(myObj, myHandler);\n```\n*图 - 8.23*\n\n输出：\n![](img/8a6860449d086ad6675add2b749bcc36_201_0.png)\n\
    *图 - 8.24*\n\n在输入的第 1 行，我们有一个任意对象。第 2 到 6 行是一个处理器，它基本上是一个带有操作代码本身的方法的对象。在第 4 到\
    \ 5 行，我们有一个 **get** 方法来拦截处理器的 **target** 对象并通过读取、修改等方式对其操作。第 7 行，我们有另一个代理 **myObjViaProxy**，它是\
    \ **myObj** 的代理。这一行向此代理传递了两个参数：第一个参数是代理指向的目标对象，第二个参数是在属性返回给我们之前处理它们的处理器。处理器中的每个方法被称为“陷阱”（trap）。\n\
    \n来看另一个例子：\n\n```javascript\nconst myObj = { name: ' John ', age: 40 };\nconst\
    \ myHandler = {\n  get(target, name) {\n    return target[name].trim();\n  }\n\
    };\nconst myObjViaProxy = new Proxy(myObj, myHandler);\n```\n*图 - 8.25*\n\n![](img/8a6860449d086ad6675add2b749bcc36_202_0.png)\n\
    *图 - 8.26*\n\n在这里，我们在第 7 行有另一个代理，注意第 3 行我们传递了一个 **name** 参数，我们将传递作为参数调用的属性名称，在这种情况下我们正在访问\
    \ **myObj.name**，因此传递给 **name** 参数的属性名将是“name”；如果感到困惑不要担心，练习几次就会简单。在第 4 行，我们使用了\
    \ **trim()** 方法来修复 **myObj.name** 中多余的空格。\n\n现在我想提醒你们一点：JavaScript 中的对象是通过引用调用的，所以如果原始对象被修改，那么赋值给它的每个对象也会被修改。\n\
    \n现在来看另一个例子：\n\n```javascript\nconst contacts = new Proxy({}, {\n  get(target,\
    \ name) {\n    return target[name];\n  },\n  set(target, name, value) {\n    target[name]\
    \ = value;\n  }\n});\n\nclass Contact {\n  construction(name, number) {\n    this.name\
    \ = name;\n    this.number = number;\n  }\n}\n```\n*图 - 8.27*\n\n"
