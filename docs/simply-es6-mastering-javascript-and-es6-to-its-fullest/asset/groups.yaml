- md: "\n19) Classes require **constructor()** method and uses a keyword-less function\
    \ to create prototypes.\n\n20) CSS can also be used in the console, just so you\
    \ know!\n\n## Chapter 8 – JavaScript on Steroids\n\n### Classes & Constructors\n\
    \nNow the first thing I want to tell you about is the difference between the class\
    \ declaration and class expression. This difference is quite simple to learn!\
    \ When we declare a class with a name it’s called a “**class declaration**”, and\
    \ when we assign a nameless class to a Variable it’s called a “**class expression**”.\
    \ Look at the following examples:\n\nClass declaration:\n\n```javascript\nclass\
    \ Pizza {\n  constructor(topping, cheese) {\n    this.name = `Pop’s ${topping}\
    \ & ${cheese} pizza`;\n    this.topping = topping;\n    this.cheese = cheese;\n\
    \  }\n  myOrder() {\n    console.log(\n      `You ordered ${this.name}`\n    );\n\
    \  }\n}\n\nconst myPepperoni = new Pizza(\"pepperoni\", \"mozzarella\");\nmyPepperoni.myOrder();\n\
    ```\n*Fig - 8.1*\n\nClass expression:\n\n```javascript\nconst Beverage = class\
    \ {\n  constructor(name) {\n    this.name = this.name;\n  }\n  myOrder() {\n \
    \   console.log(\n      `You ordered ${this.name}`\n    );\n  }\n}\n\nconst myDrink\
    \ = new Beverage(\"coolaCola\");\nmyDrink.myOrder();\n```\n*Fig - 8.2*\n\nIn the\
    \ first figure we are declaring a class named “**Pizza**”, while in the second\
    \ figure we are declaring a class named “**Beverage**”.\n\nNow there is nothing\
    \ new to learn here, class declarations and class expression are just like function\
    \ declarations and function expressions. Just like functions the differences between\
    \ class declarations and expressions is a lack of ability to use the **“this”**\
    \ keyword and write recursive code inside class expressions, they are meant to\
    \ be used in different ways.\n\nNow there are a lot of method you can use to add\
    \ functionality to classes, however there is only one that is required, that is\
    \ the “**constructor()**” function; this function is where we assign values to\
    \ class properties. You can write a constructor less function too but a constructor\
    \ will be added to it by default.\n\n### Static methods\n\nStatic methods are\
    \ methods with “**static**” keyword as a prefix, these methods are available only\
    \ from the class itself! It means they are not a method of an instance, they are\
    \ a method of the class. Let’s look at the following code:\n\n```javascript\n\
    class Pizza {\n  constructor(topping, cheese) {\n    this.name = `Pop’s ${topping}\
    \ & ${cheese} pizza`;\n    this.topping = topping;\n    this.cheese = cheese;\n\
    \  }\n  myOrder() {\n    console.log(\n      `You ordered ${this.name}`,\n   \
    \ );\n  }\n  static myInfo() {\n    console.log(this);\n  }\n}\n\nconst myPepperoni\
    \ = new Pizza(\"pepperoni\", \"mozzarella\");\nmyPepperoni.myOrder();\nmyPepperoni.myInfo();\
    \ //throws error\nPizza.myInfo();\n```\n*Fig - 8.3*\n\nThe code above doesn’t\
    \ work! It throws an error on line #18, this is because **myInfo()** is not a\
    \ method of **myPepperoni**. See **myPepperoni** is an instance of **Pizza** class,\
    \ and **myInfo()** is a static method, which means it’s only available within\
    \ **Pizza**, it’s not available from its instances. If we comment out line #18\
    \ then this code works fine. Check out its output:\n\n![](img/8a6860449d086ad6675add2b749bcc36_192_0.png)\n\
    *Fig - 8.4*\n\n### Getters & Setters\n\nGetters and setters is a bitter area when\
    \ it comes to ES6, for some reason people always find a way to make their use\
    \ annoying as hell. Here in this book my job is to make things as simple as possible,\
    \ sometimes it means teaching something in a hyperbolic manner, and sometimes\
    \ it means omitting material I spent weeks investigating; however most of the\
    \ time it means writing and rewriting a single line hundreds of times because\
    \ I dread the day when a reader quits because of mistakes I made. All that being\
    \ said I think the most important part of learning is to **practice for practice’s\
    \ sake**, so remember to do that!\n\nLet’s look at the following code:\n\n```javascript\n\
    class Pizza {\n  constructor(name) {\n    this.name = name;\n  }\n  //getter\n\
    \  get name() {\n    return name;\n  }\n  //setter\n  set name(x) {\n    name\
    \ = x;\n  }\n}\nconst myPepperoni = new Pizza(\"Pop’s pepperoni pizza\");\n```\n\
    *Fig - 8.5*\n\n*Output:*\n![](img/8a6860449d086ad6675add2b749bcc36_193_0.png)\n\
    *Fig - 8.6*\n\nIn this code **this.name** is private/hidden; private properties\
    \ are not approachable directly! We have to use a getter like on lines #6 to #8,\
    \ all getter does is to return name when **myPepperoni.name** is called. Now if\
    \ we need to reassign the value of **myPepperoni.name** then we will use the setter\
    \ on lines #10 to #12. There is no need to over complicate these things, we use\
    \ getters and setters to hide properties of a class; when using getter and setters\
    \ they acts as middle between our calls and properties, this way they prevent\
    \ direct access and avoid data leaks. As a general rule in web development each\
    \ property should only be available through a getter, and modifiable through a\
    \ setter. In the output when we call **myPepperoni** in the first line returns\
    \ an empty object since there is only one property here and it is hidden. Then\
    \ when we call **myPepperoni.name** we are fact calling the getter on lines #6\
    \ to #8, this returns our name property. Then when we assign a new value to **myPepperoni.name**\
    \ we are fact calling the setter on lines #10 to #12, this setter takes the assigned\
    \ value as an argument and assigns it to our name property; all happens through\
    \ the name setter. Since taking value out of the name prop, and putting value\
    \ into the name prop happens through getter and setter, there is no access and\
    \ as a result our data inside the name prop remains safe. One important thing\
    \ to notice here is that getters and setters are fact methods! The clear distinction\
    \ is that when we are assigning to the prop we are using a setter, and when we\
    \ are calling the prop we are using a getter.\n\n### Extending Classes\n\nThere\
    \ is something called extended classes, these types of classes are children of\
    \ a parent class. Let’s take look at the following code:\n\n```javascript\nclass\
    \ MyClient {\n  constructor(name) {\n    this.name = name;\n  }\n}\n\nclass MyClientExtra\
    \ {\n  constructor(name, address) {\n    this.name = name;\n    this.address =\
    \ address;\n  }\n}\n```\n*Fig - 8.7*\n\nIn the code in the preceding figure there\
    \ are two classes, the first class and the second class has almost the same function,\
    \ both classes ask for a name when it is initializing an object to a variable;\
    \ the second class however has additional functionality, it also asks for an address\
    \ for its instances. As the second class is sort of a more specific version of\
    \ the first class because of class having added functionality, it can be written\
    \ the following way:\n\n```javascript\nclass MyClient {\n  constructor(name) {\n\
    \    this.name = name;\n  }\n}\n\nclass MyClientExtra extends MyClient {\n  constructor(name,\
    \ address) {\n    super(name);\n    this.address = address;\n  }\n}\n```\n*Fig\
    \ - 8.8*\n\nThis doesn’t feel like an improvement but it will once the classes\
    \ get bigger. This is essentially the same as the previous code but it’s a better\
    \ way to do things. The code in Fig – 8.8 line#9 calls a **super()** method, which\
    \ superimposes the provided arguments between the child class and its parent class.\
    \ This simply means that the arguments provided to the **super()** method is passed\
    \ on to the parent class, and the properties returned by the parent class becomes\
    \ properties of the child class. Let me show you what I am talking about:\n\n\
    Input:\n\n```javascript\nclass Drink {\n  constructor(name, qty) {\n    this.name\
    \ = name;\n    this.qty = qty + \"oz\";\n  }\n}\n\nclass Water extends Drink {\n\
    \  constructor(name, qty, type) {\n    super(name, qty);\n    this.type = type;\n\
    \  }\n}\n\nclass Cola extends Drink {\n  constructor(name, qty, kcals) {\n   \
    \ super(name, qty);\n    this.kcals = kcals;\n  }\n}\n```\n*Fig - 8.9*\n\n*Output:*\n\
    ![](img/8a6860449d086ad6675add2b749bcc36_195_0.png)\n*Fig - 8.10*\n\nIn Fig –\
    \ 8.9 we have a class “**Drink**”, and two other classes “**Water**” and “**Cola**”\
    \ both extensions of the “**Drink**” class., The **Drink** class takes in a name\
    \ and a quantity, the **Cola** class takes in an additional **Kcal** parameter,\
    \ and the **Water** class takes in an additional **type** parameter. In this case\
    \ the parameters **name**, and **qty** are superimposed between all three classes.\n"
  mdcn: "\n\n19) 类需要 **constructor()** 方法，并使用无关键字的函数来创建原型。\n\n20) 也可以在控制台中使用 CSS，只要你知道这一点就行！\n\
    \n## 第 8 章 – 强化版 JavaScript\n\n### 类与构造函数\n\n现在我想告诉你们的第一件事关于类声明（class declaration）和类表达式（class\
    \ expression）之间的区别。这个区别非常容易学习！当我们用名称声明一个类时，它被称为“**类声明（class declaration）**”，当我们把一个无名类赋值给变量时，它被称为“**类表达式（class\
    \ expression）**”。看以下示例：\n\n类声明：\n\n```javascript\nclass Pizza {\n  constructor(topping,\
    \ cheese) {\n    this.name = `Pop’s ${topping} & ${cheese} pizza`;\n    this.topping\
    \ = topping;\n    this.cheese = cheese;\n  }\n  myOrder() {\n    console.log(\n\
    \      `You ordered ${this.name}`\n    );\n  }\n}\n\nconst myPepperoni = new Pizza(\"\
    pepperoni\", \"mozzarella\");\nmyPepperoni.myOrder();\n```\n*图 - 8.1*\n\n类表达式：\n\
    \n```javascript\nconst Beverage = class {\n  constructor(name) {\n    this.name\
    \ = this.name;\n  }\n  myOrder() {\n    console.log(\n      `You ordered ${this.name}`\n\
    \    );\n  }\n}\n\nconst myDrink = new Beverage(\"coolaCola\");\nmyDrink.myOrder();\n\
    ```\n*图 - 8.2*\n\n在幅图中，我们声明了一个名为“**Pizza**”的类，而在第二幅图中，我们声明了一个名为“**Beverage**”的类。\n\
    \n现在这里没有什么新需要学习的，类声明和类表达式就像函数声明和函数表达式一样。就像函数一样，类声明和表达式之间的区别在于在类表达式中缺乏使用 **“this”**\
    \ 关键字和编写递归代码的能力，它们被旨在以不同的方式使用。\n\n现在你有很多方法可以给类添加功能，然而只有一种方法是必须的，那就是“**constructor()**”函数；这个函数是我们在为类属性赋值值的地方。你也可以写一个不带构造函数的函数，但默认会为它添加一个构造函数。\n\
    \n### 静态方法\n\n静态方法是以“**static**”关键字作为前缀的方法，这些方法仅能从类本身可用！这意味着它们不是实例的方法，而是类的方法。让我们看以下代码：\n\
    \n```javascript\nclass Pizza {\n  constructor(topping, cheese) {\n    this.name\
    \ = `Pop’s ${topping} & ${cheese} pizza`;\n    this.topping = topping;\n    this.cheese\
    \ = cheese;\n  }\n  myOrder() {\n    console.log(\n      `You ordered ${this.name}`,\n\
    \    );\n  }\n  static myInfo() {\n    console.log(this);\n  }\n}\n\nconst myPepperoni\
    \ = new Pizza(\"pepperoni\", \"mozzarella\");\nmyPepperoni.myOrder();\nmyPepperoni.myInfo();\
    \ // 报错\nPizza.myInfo();\n```\n*图 - 8.3*\n\n上面的代码不起作用！它在第 #18 行抛出了错误，这是因为 **myInfo()**\
    \ 不是 **myPepperoni** 的方法。看 **myPepperoni** 是 **Pizza** 类的实例，而 **myInfo()** 是一个静态方法，这意味着它只能在\
    \ **Pizza** 内部可用，不能从它的实例调用。如果我们注释掉第 #18 行，这段代码就能正常运行。查看它的输出：\n\n![](img/8a6860449d086ad6675add2b749bcc36_192_0.png)\n\
    *图 - 8.4*\n\n#### Getter (Getters) 与 Setter (Setters)\n\n在 ES6 中，getter 和 setter\
    \ 是一个棘手的领域，由于某种原因，人们总是能找到让它们的使用变得极其讨厌的方法。在书中，我的工作是让事情尽可能简单，有时这意味着以一种夸张的方式教授某些东西，有时意味着省略我花费数周时间研究的材料；然而，大多数时候意味着编写和重写单行代码数百次，因为我害怕读者因为我所犯的错误而中途。话虽如此，我认为学习中最重要的部分是**为了练习而练习**，所以记住这样做！\n\
    \n让我们看以下代码：\n\n```javascript\nclass Pizza {\n  constructor(name) {\n    this.name\
    \ = name;\n  }\n  //getter\n  get name() {\n    return name;\n  }\n  //setter\n\
    \  set name(x) {\n    name = x;\n  }\n}\nconst myPepperoni = new Pizza(\"Pop’s\
    \ pepperoni pizza\");\n```\n*图 - 8.5*\n\n*输出：*\n![](img/8a6860449d086ad6675add2b749bcc36_193_0.png)\n\
    *图 - 8.6*\n\n在这段代码中，**this.name** 是私有的/隐藏的；私有属性无法直接访问！我们必须使用像第 #6 行到 #8 行那样的 getter，getter\
    \ 只是在调用 **myPepperoni.name** 时返回 name。现在，如果我们需要重新分配 **myPepperoni.name** 的值，我们将使用第\
    \ #10 行到 #12 行的 setter。没有必要把这些事情搞复杂。\n\n#### 继承类 (Extending Classes)\n\n有一种被称为继承类的，它们是父类的子类。让我们看一下代码：\n\
    \n```javascript\nclass Client {\n  constructor(name) {\n    this.name = name;\n\
    \  }\n}\n\nclass ClientExtra {\n  constructor(name, address) {\n    this.name\
    \ = name;\n    this.address = address;\n  }\n}\n```\n*图 - 8.7*\n\n在前面的图中，有两个类，第一个类和第二个类几乎相同，第二个类具有额外的功能，这种类型的类可以这样写：\n\
    \n```javascript\nclass Client {\n  constructor(name) {\n    this.name = name;\n\
    \  }\n}\n\nclass ClientExtra extends Client {\n  constructor(name, address) {\n\
    \    super(name);\n    this.address = address;\n  }\n}\n```\n*图 - 8.8*\n\n这看起来并没有改进，但一旦类变大就会是。这本质上与之前的代码相同，但它是更好的方法。图\
    \ 8.8 中的代码行9 调用了 **super()** 方法，这叠加了提供的参数。这意味着传递给 **super()** 方法的参数传递给了父类，而父类返回的属性变成了子类的属性。让我告诉我在说什么：\n\
    \n输入：\n\n```javascript\nclass Drink {\n  constructor(name, qty) {\n    this.name\
    \ = name;\n    this.qty = qty + \"oz\";\n  }\n}\n\nclass Water extends Drink {\n\
    \  constructor(name, qty, type) {\n    super(name, qty);\n    this.type = type;\n\
    \  }\n}\n\nclass Cola extends Drink {\n  constructor(name, qty, kcals) {\n   \
    \ super(name, qty);\n    this.kcals = kcals;\n  }\n}\n```\n*图 - 8.9*\n\n输出：\n\
    ![](img/8a6860449d086ad6675add2b749bcc36_195_0.png)\n*图 - 8.10*\n\n在图 8.9 中，我们有一个类“**Drink**”，以及另外两个类“**Water**”和“**Cola**”，它们都是“**Drink**”类的扩展。**Drink**\
    \ 类接收一个名称和一个数量，**Cola** 类接收额外的 **Kcal** 参数，而 **Water** 类接收额外的 **type** 参数。在这种情况下，参数\
    \ **name** 和 **qty** 叠加在所有类之间。\n\n"
