    *Fig - 8.48*\n7) Add the following script to your **package.json** file’s script\
    \ property.\n![](img/8a6860449d086ad6675add2b749bcc36_215_1.png)\n*Fig - 8.49*\n\
    8) Add the initial **src/index.js**, **dist/index.html**, **dist/main.css** files\
    \ to your app’s directory. (code for these files is provided further down the\
    \ line).\n9) Execute “**npm run webpack**”; this will add a **dist/main.js** file\
    \ to your app’s directory.\n10) Link your **main.css**, **main.js**, **index.html**,\
    \ files together. Use the **script** and **link** tags, duh!\n11) Initialize ESLint\
    \ with “**eslint --init**” and extend it to Airbnb style. See chapter 6 for instructions.\
    \ This will add a “.eslintrc**” file to your app’s directory.\n12) Restart Atom!\
    \ (If eslint’t start after previous step).\n13) Initialize this project in Git\
    \ from Atom.\n14) Properly log in Git with Terminal, (You have to every time you\
    \ begin working on project):\n    `git config user.email <yourEmail>`\n    `git\
    \ config user.name <yourName>`\n15) Execute **git status** (to check if we are\
    \ initialized Git).\n16) Execute **git add -A** (to stage all files, this may\
    \ take a while the first time).\n17) Execute **git commit -m** “**some statement\
    \ to tag with**” (to commit to master).\n18) Each of the following commits can\
    \ be made within Atom, but beware the time of writing Atom has known glitches\
    \ when making prolonged commits.\n19) Write code for your app. Source code is\
    \ provided below.\n20) Import in **src/index.js**.\n![](img/8a6860449d086ad6675add2b749bcc36_216_0.png)\n\
    *Fig - 8.50*\n21) Now code your app, make sure to re-bundle JS files after modification\
    \ using Webpack or Babel.\n22) Code for HTML, CSS, and JS is provided below. Remember\
    \ to use browser console for testing and debugging, don’t use **console.log()**\
    \ unless you need value at specific points during execution.\n\nCode for index.html:\n\
    ```html\n<!doctype html>\n<html>\n<head>\n  <meta charset=\"UTF-8\">\n  <link\
    \ href=\"./main.css\" rel=\"stylesheet\" type=\"text/css\"/>\n</head>\n<body>\n\
    \  <h1>ES6 Features Database</h1>\n  <script src=\"./main.js\"></script>\n</body>\n\
    </html>\n```\n*Fig - 8.51*\n\nCode for main.css:\n```css\nbody {\n  background-color:\
    \ #f9f9f9;\n  font-family: cursive;\n}\nh1, h2, p {\n  text-align: center;\n \
    \ font-size: 0.8em;\n}\n.item {\n  background-color: white;\n}\n```\n*Fig - 8.52*\n\
    \nCode for index.js (which will be bundled into main.js using webpack):\n```javascript\n\
    const database = new Set([\n  {item: 1, name: \"Classes\", def: \"Now let’s see\
    \ …\"},\n  {item: 2, name: \"Getters & Setters\", def: \"Getters …\"},\n  {item:\
    \ 3, name: \"Generators\", def: \"A Generator...\"},\n  {item: 4, name: \"Proxy\"\
    , def: \"Proxyies are …\"},\n  {item: 5, name: \"Sets\", def: \"Sets are a …\"\
    },\n  {item: 6, name: \"Weak Sets\", def: \"Weak …\"},\n  {item: 7, name: \"Maps\"\
    , def: \"Maps are …\"},\n  {item: 8, name: \"Weak Maps\", def: \"Weak …\"},\n\
    \  {item: 9, name: \"Weak Sets\", def: \"Weak …\"}\n]);\n\nconst dataList = database.values();\n\
    \nfor(let i = 1; i <= 9; i++) {\n  const data = dataList.next().value;\n  document.body.innerHTML\
    \ += `\n    <div class=\"item\">\n      <h2>${data.item}. ${data.name}</h2>\n\
    \      <p>${data.def}</p>\n    </div>`;\n}\n```\n*Fig - 8.53*\n\nNow I have shrank\
    \ the **def** props value for better display in the code above. Let’s get started\
    \ with the narration!\n\nOn lines #1 to #11 we have a database created with a\
    \ Set. \nOn line #12 we have declared a Set iterator.\nOn lines #14 to #23 we\
    \ have looped through the database and appended each item in it to the DOM.\n\n\
    Here is the output of code:\n![](img/8a6860449d086ad6675add2b749bcc36_219_0.png)\n\
    *Fig - 8.54*\n\nGood luck with the project!\n\n## Closing Arguments\n\nLet’s revisit\
    \ the lessons of this chapter and take a look at what we have learned! Following\
    \ lessons are the rough outline of this chapter.\n\n1) When we declare a class\
    \ with a name it’s called a “class declaration”.\n2) When we assign a nameless\
    \ class to an Variable it’s called a “class expression”.\n3) Certain keywords\
    \ like “**this**” are not rebound to class expressions.\n4) The **constructor()**\
    \ method is used in classes to assign properties to the output Object.\n5) Static\
    \ methods are methods with “static” keyword as a prefix, these methods are methods\
    \ of only the Class and not its instances.\n6) Getters & Setters are used to control\
    \ the flow of information in and out of an object.\n7) Extending Classes allows\
    \ our Classes to improve upon the code of the parent Class.\n8) Classes can also\
    \ be extended to build in Classes like **Arrays**.\n9) Generators are functions\
    \ that pause themselves when they **yield** a value and resume after called again.\n\
    10) We can use the **for/of** loop to iterate through the generators.\n11) Proxies\
    \ are used to intercept, read, write, and mutate the code of other Objects.\n\
    12) Sets are a sister data structure of Arrays; they are enumerable, and they\
    \ don’t have index ranks.\n13) Weak Sets are sort of a little sister to Sets;\
    \ they don’t have any length, and they only take Objects as their members.\n14)\
    \ Maps are a sister data structure of Objects; they have some commonalities with\
    \ Sets.\n15) Weak Maps are the little sister of Maps, they have no length, their\
    \ keys must be Objects, and they don’t have index values.\n16) Both of the “Weak”\
    \ data structures are garbage collected, this means if an item ceases to exist\
    \ anywhere else in the code, then it will also be removed from Weak Sets and Weak\
    \ Maps.\n"
