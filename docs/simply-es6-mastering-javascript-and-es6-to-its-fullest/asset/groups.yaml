    \ 属性中建立了应用画布的宽度和每行的像素数量，在 **resH** 属性中建立了应用画布的高度和每列组装的像素数量。最后，我们有一个方法，可以在像素的黑色和白色之间切换，以便我们可以在画布上画图。到此为止，我们只是在存储这些是展开画布的前提数据。\n\
    \n接着在第 #29 行到 #33 行，我们有一个名为“**matrix**”的变量，这是画布上每个像素的记录，如果以后需要将绘画导出到单独的文件，我们实际上将保存一个像素数据的多维矩阵。这段代码的含义类似于：“声明一个名为\
    \ **matrix** 的变量，在这个变量中我们有一个包含 (**resH**) 个成员的数组，在这个数组内部，所有成员都是数组，每个后续数组都有 (**resW**)\
    \ 个成员，这些成员每一个都是空字符串”。\n\n现在从第 #35 行到 #47 行，我们有一个双层循环，从我们的矩阵中提取每个像素数据，并将其引向第 #39\
