  md: '4)


    A look-behind is signified by a **(?<!foo)** and it checks what immediately precedes
    the


    current position in the string is not **foo**.


    Always enclose a look-around within parenthesis.


    The most basic application of a look-ahead is to search for a password pattern.
    Look at the


    following code:


    1  const  password  =  “abc123”;


    2


    3  const  passwordRegex1  =  /b(?=\w)/;


    4  const  passwordRegex2  =  /b(?!\w)/;


