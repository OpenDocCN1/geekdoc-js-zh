    them all! It has


    complete Git integration. G**it** is a version control system, designed as a project
    management aid, it’s


    the industry standard.


    Now you can install “linter” and “linter-eslint” packages for Atom using Atom’s
    built-in


    package manager (GUI), however you may still need to run the “**npm init**” &
    “**eslint --init**”


    commands from system console.


    You can also use **Sublime** code-editor with “Sublime-linter” and “ESLint” Package.
    Some


    people find sublime setup tougher compared to Atom but in the end it all comes
    down to exposure, if


    you use Sublime then use Sublime, if you use Atom then use Atom. We will use Atom
    from now on


