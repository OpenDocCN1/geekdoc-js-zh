  md: '**Weak Sets**


    Weak Sets are like Sets with a few trade-offs! They are basically a sister to
    Sets. There are a


    few things we need to know about WeakSets:


    1)


    They can only have objects as members; Proxies, NodeLists, etc. also count as
    objects.


    2)


    They cannot be iterated over.


    3)


    Its length is **undefined** or **0**.


    4)


    The **clear()** method is absent from their prototype.


    5)


    Every time garbage collection occurs if any objects are deleted or set to **null**
    or **undefined**


    then their reference will also be removed from the WeakSet if they are a member
    of it.


    (Garbage collection works differently for every environment).


    6)


    Since garbage collection takes time, there may be memory leaks; between the time
    an


    object is deleted and garbage is collected we will still be able to access the
    deleted object


    by reference from the WeakSet.


    The only thing you can find mischievous about WeakSets is the self-clearing and
    garbage


    collection, however there is no need to make stuff prickly, just take a look at
    the following code:


    1  let  myJohn  = {name:  “John”};


    2  let  myJane  = {name:  “Jane”};


    3


    4  let  myWeakSet  =  new  WeakSet([myJohn, myJane]);


    5  console.log(myWeakSet);


    6


    7  myJohn  =  null;


    8  console.log(myWeakSet);


    *Fig - 8\. 39*


