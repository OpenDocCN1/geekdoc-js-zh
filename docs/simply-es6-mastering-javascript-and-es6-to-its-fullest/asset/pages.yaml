  md: '**Chapter 10 – Forging CLI software**


    **with JavaScript**


    A CLI or Command Line Interface based software is a program that is used from
    a


    Terminal-emulator like xTerm, Urxvt, St, etc. The usage of a CLI program is extremely
    common


    among IT people and Programmers, and its most often the best, most efficient way
    to do things.


    The best thing about JavaScript is that it’s a complete, high powered programming


    language, and it takes you form initial concept to first look in a flash. All
    you need is a web browser


    and the world is at your fingertips! However a guy like me who runs Debian or
    OpenBSD, who


    prefers CLI based software, and absolutely hates overwhelming GUIs needs a way
    to use JavaScript


    to make CLI based programs.


    In this chapter we will develop a few projects with JavaScript, ES6, and NodeJS.
    If you


    don’t already have some experience with this stuff then I suggest reading the
    book “Simply Web


    Development” – Anna Voice, Ray Voice.


    To make these project you’ll need NodeJS and NPM installed on your computer. The
    use of


    the following packages is recommended, however we will not use most of them here:


    Packages List:


    1.


    cli – To make CLI programs, not requited.


    2.


    chjj/blessed – A curses-like library for interface development.


