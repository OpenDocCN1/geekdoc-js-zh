    don''t need to worry for the support of **import/export** because dependencies
    are running in the


    webpack environment instead of the browser, by the time dependencies reach the
    browser they are


    part of the main.js file.


    So suppose we created a module in “**app/src**” directory and we named it “**myLodash**”,
    if


    inside **myLodash** we need to **import** from **lodash** module we will import
    it as:


    import  _  from  ‘lodash’;


    *Fig - 7\. 13*


    A module can export multiple named exports but only one default export, and an


    individual module can export both a default export and multiple named exports.


    Look at the following code to see what a **labAid.js** module is exporting:


    export  default  function (num) {


    const  val  =  `${num}`;


    if (val.includes(''.'')) return  ''We need an integer'';


    const  expo  =  val.length  -  1;


    const  coEff  = [...val];


    let  sciNot  = [...coEff, '' x 10'', `<sup>${expo}</sup>`];


    sciNot[1] = (sciNot[1] ===  ''0''  ?  sciNot[1] :  `.${sciNot[1]}`);


    sciNot  =  sciNot.map(x => (x  ===  ''0''  ?  ''''  :  x));


    return  `${sciNot.join('''')}`;


    }


    export  const  definition  =  `Scientific notation is a way of


    expressing numbers that are too big or too small to be


    conveniently written in decimal form.`;


    *Fig - 7\. 14*


    And look how it will be imported by **index.js**:


    import  sciNot, { definition  as  def } from  ''.labAid'';


    *Fig - 7\. 15*


    Here in Fig – 7.15 **sciNot** imports the default export of **labaid** and the
    named export called


    **definition** is imported as ‘**def**’.


