    As soon as the third promise is fulfilled the data gets logged by itself. That
    is it! Another


    thing to notice here is the chaining of thenables and promises. This is done to
    control the flow for


    information. For example hypothetically if some code on line #1 is a thenable
    (uses **then()** method)


    or promise and must execute before some code on line #2, then the code on line
    #1 will use a


    **then()** method to enclose the code on line #2\. This way code on line #1 will
    resolve, and only then


    the code on line #2 will execute. Now if we have a 3


    rd line of code that requires the previous lines to


    run then it will also be enclosed by a **then()** statement and will become part
    of a three member


    chain for promises.


