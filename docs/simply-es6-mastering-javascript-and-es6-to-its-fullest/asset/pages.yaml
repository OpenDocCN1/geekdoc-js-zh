  md: '**Closing Arguments**


    Let’s revisit the lessons of this chapter and take a look at what we have learned!
    Following


    lessons are the rough outline of this chapter.


    1.


    **Object.keys()** is a method that returns an array comprised of keys of the provided


    argument object as members.


    2.


    **Object.entries()** is a method that returns an array comprised of 2-member arrays
    in which


    the 1


    st member is a key and the 2


    nd member is a corresponding value, this information is


    extracted from the argument object provided.


    3.


    There are significant difference between arrays and other Iterables.


    4.


    **Array.from()** is a method that returns the provided argument iterable after
    converting it


    to a true array.


    5.


    **Array.of()** is a method that returns the provided arguments after converting
    it to a true


    array.


    6.


    **Array()** and **Array.fill()** methods can be used to generate foundational
    matrices.


    7.


    Arrays have methods like **find()**, **findIndex()**, **some()**, **every()**,
    etc… these methods can


    be used to vet the array’s members.


    8.


    ES6 comes with a very worthwhile feature called **rest/spread** operator.


    9.


    If it’s giving the “**rest** of values” to a Variable it may perhaps be called
    a “Rest-parameter”;


    and if its taking values out of a Variable and spreading it around then it’s called
    a “Spread-


    operator”.


    10.


    ES6 comes with a shorthand way to compose methods.


    11.


    Objects have an auto-spread technique to compose keys and values.


    Another thing I want you to leave with is “Polyfills”, which is simply sort of
    a prefix code that


    rigs a feature in web browsers that doesn’t have native support for that feature.


