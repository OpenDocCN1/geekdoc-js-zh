  md: '**Publish to NPM**


    These instructions will allow you to publish your projects to NPM Archives. It
    is not


    compulsory to follow these instructions, they are provided for instructional purposes
    only.


    1.


    To publish your file to NPM for others to use, first make an account on the NPM
    website


    npmjs.com.


    2.


    Then use `**npm login**` to login with NPM from the Terminal. You can check a
    proper login


    with `**npm whoami**`. (You may need to verify your email address).


    3.


    Then create a file named `**.npmignore**` in your project directory and add the
    text


    `**node_modules/**` to it. (This file is used to ignore files and directories
    that you don''t want


    to bundle with your program).


    4.


    Now check which files will be published with `**npm pack –dry-run**`.


    5.


    Now use `**npm publish**` to Publish your program to NPM Archives.


    6.


    Once successfully published anyone with NPM can install your package like `**npm
    i**


    **congenial-clock**` (with your package-name).


