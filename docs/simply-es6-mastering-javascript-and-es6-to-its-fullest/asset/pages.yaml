  md: 'Let me make this simpler:


    **Example 1 - What we are doing:**


    1)


    Declare a variable named myRes (**res**ponse) and assign it the data we **will**
    get from


    **fetch()**.


    2)


    Log the value of **myRes**.


    3)


    Get data from **fetch()**.


    **Example 2 - What we need to do:**


    1)


    Declare a variable named myRes (**res**ponse) and assign it the data we **will**
    get from


    **fetch()**.


    2)


    Get data from **fetch()**.


    3)


    Log the value of **myRes**.


    In example 1 we first logged the value of response and later fetched it. In example
    2 we first


    fetched it **then** logged it. So far we have been doing it in the wrong order.
    So how to implement the


    second method? We make the promise a **thenable**, meaning we use the **then()**
    method of Promises.


    The combination of **thenables, chaining promises,** and **Promise methods** is
    the triple threat


    starter pack for all of you flow control warriors. Take a look at the following
    code:


    7  <script>


    8


    9  let  myRes  =  fetch("http://localhost:3000/database");


    10  console.log(myRes);


    11


    12  myRes


    13 .then(res => res.json())


    14 .then(data => {


    15  console.log(data);


    16 });


    17


    18  </script>


    *Fig - 5\. 4*


    Now on line #10 when we asked **myRes** for the value to be logged it returned
    a “Promise


    pending” response because it hasn’t extracted the required data from localhost/provided-url.


