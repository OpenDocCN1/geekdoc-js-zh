  md: '**Practice Project**


    Now we will make a project and then you will make a MVP version of it! Remember
    when


    we made a paint app in chapter 4’s practice project? We will make it again, but
    this time we will use


    Atom, Git, and ESLint. You can use other editors like Vim, Sublime, etc. but I
    recommend that you


    use Atom based on my experience of the control-flow that comes with it!


    Here are the steps, take it as it comes:-


    1)


    Write the HTML, CSS, & JS files is separately.


    2)


    Make a Paint App.


    3)


    Use ATOM, GIT, & ESLint.


    4)


    Make sure all files are properly linted & working.


    5)


    Make a pre-commit-linting Git hook in the project.


    6)


    Commit the files to Master.


    Going through this exercise will take you through the steps one by one until they
    become


    instinctive.


    Steps:


    1)


    Make a new directory/folder named Paint App.


    2)


    Add this folder as a project directory in ATOM.


    3)


    Initialize GIT in this folder using ATOM.


    4)


    Write a separate HTML, CSS, JS file for this project.


    5)


    Test the project without committing.


    6)


    Add a pre-commit-linting Git hook in “**.git/hooks**” directory.


    7)


    Using a Terminal navigate to the project directory and execute the “**eslint --init**”


    command, then initialize the ESLint.


    8)


    Tell Git who you are with command “**git config user.name <userName>**” & “**git**


    **config user.email <userEmail>**”after navigating to the project directory with


    Terminal or Git Bash.


    9)


    Update the “**.eslint.json**” with setting for Airbnb style guide, and HTML, &
    JSON


    plugins.


    10) Now restart ATOM if the Linter doesn’t reconfigure by itself.


    11) Run the ESLint fix from within ATOM by right-clicking and selection “ESLint
    fix”


    option.


    12) Now fix any leftover errors. At this point you may have to rewrite some JS
    code, if


    that is the case then you can either re-write the code or you can add ESLint


    exceptions.


    13) Now commit the code to Master.


    The paint app output should be identical to the one in Chapter 4.


