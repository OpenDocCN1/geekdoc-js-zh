  md: '**CLI Project #1 – Congenial Clock utility**


    In this project we will make a simple Command Line Utility to check the current
    Time and


    Date. Let’s call it the “Congenial Clock”!


    Use the following instructions to develop this project:


    1.


    Make a new directory for your project and name it “Congenial Clock” or your own
    project


    name.


    2.


    Navigate to it from a Terminal, and use `**npm init**` to initialize the project.
    Answer any


    questions asked, if not sure about the answer just leave it at default value.
    You can also


    use `**npm init -y**` for all default value answers. The entry point to the project
    will be


    `**index.js**`.


    3.


    Make an `**index.es6.js**` file, and add the following line of code to the very
    first line of this


    file:


    #!/usr/bin/env node


    This is called a "Shebang Character Sequence". It’s used by all Shell scripts.
    It''s used to tell


    the Unix like operating environments to use the locally installed NodeJS for interpreting
    our code. In


    Windows it''s ignored because there it''s read as a comment but it''s still required
    by NPM.


    4.


    Use `**npm i babel-cli babel-preset-es2015 --save-dev --prefer-offline**` to install
    babel-cli


    and the ES6-preset to transpile ES6 to ES5, this doesn''t bundle these package
    with your


    program.


    5.


    Add the following code to your `**package.json**` in the appropriate place, scripts
    will go


    into scripts, and babel object will be put as a first-order member:


    "scripts": {


    "babel": "babel index.es6.js --watch --out-file index.js"


    },


    "babel": {


    "presets": ["es2015"]


    }


    6.


    Use `**npm run babel**` to transpile index.es6.js to index.js, this will watch
    the index.es6.js


    file and transpile upon alteration. This command will also consume your terminal
    for


    status updates, use another terminal for the rest of the commands.


    7.


    Use `**npm i chalk figlet --save --prefer-offline**` for Chalk and Figlet packages.


    8.


    Add the following code (or you own code) to `**index.es6.js**` (don’t double up
    the Shebang


    sequence):


    #!/usr/bin/env node


    import  chalk  from  ''chalk'';


    import  figlet  from  ''figlet'';


    // Getting a data object


    let  d  =  new Date();


