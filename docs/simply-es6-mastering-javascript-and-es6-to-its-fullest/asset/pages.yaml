  md: '**Chapter 1 – The Basics**


    ES6 is a not-so-new upgrade to JavaScript. You see the JavaScript you have been
    using was


    the 5


    th edition of JavaScript, which was last updated in 2009 I think... For the longest
    time


    JavaScript/ES5 did all it could to support the web, however everything has to
    die so something


    better can be born… That better thing is ES6! ES6 together with Node.js and React-Native
    pushed


    JavaScript in to another league! I have never seen something more versatile and
    useful than


    JavaScript except for C/C++. Although it depends on individual projects, the pros
    of JavaScript


    outweigh the cons by leagues. It may not be as fast as Assembly, Go, or C, and
    it may not be as easy


    to read as Python, but it is always my first choice to do the job! It is cross
    platform, easily scaleable


    and has a great future ahead.


    As an employer and project manager it has been my firsthand experience that JavaScript


    projects are overall cheaper than others. The labor is cheap and common, although
    the applicants


    are less experienced than compared to say someone who writes Java, C#, or even
    Swift; however the


    best thing is the flow of debugging, almost all common bugs are well cataloged
    and easily fixed. On


    top of that most of the JavaScript related tech is free and open-source.


    The Motto of Java is “Write once, run anywhere!” if I remember correct (which
    I do!);


    However with Java writing once will make your firm go broke; JavaScript on the
    other hand can


    fulfill this promise without any heavy compromises.


    Going forth you should know a few things (if you don’t already), there are several
    ways to


    use JavaScript. You can use it on front-end using only a web-browser; you can
    use it on the back-end


    with Node.js; you can use it to design a GUI using React’s JSX or DOM; you can
    use it to run


    simulations (Don’t, it’s slow and unreliable); you can to a fault do anything
    with JavaScript!


    Now At the point of writing all the major web-browsers support the ES6 JavaScript
    update.


    If you are running it in an environment that doesn’t support it then you can use
    a transpiler like


    “Babel” to convert ES6 code to JavaScript/ES5.


    One more thing, if at any point you encounter code that you don’t understand I
    want you


    to skim through it or write it yourself a few times before moving on.


    Sometimes I refer to ES6 code like “**Fat Arrow functions**” or “**Rest/Spread
    Operators**”


    before telling you about them because I want to you get a feel of ES6 before learning
    it. Stay calm,


    all ES6 terms will be explained sooner or later.


    Remember, to write ES6 you have to write ES6; you will become better with practice,
    not reading.


    I also refer to compiler/interpreter because people doing front-end web development
    face


    the interpreter but people doing back-end with Node.js or React-native, or other
    frameworks may


    face a compiler. Still I would like to explain the difference between a compiler
    and an interpreter in


    as simple words as I can conjure.


    16 | P a g e'
