    **Proxies**


    Proxies are a meta-programming feature, which basically means that via proxies
    you can


    read, write, and mutate the code itself. In ES6 proxies operate on objects using
    handlers, traps,


    targets, etc. each of these expressions are simply clarified in the subsequent
    subsections.


    Input:


    1  const  myObj  = { name:  ‘John’, age:  40 };


    2  const  myHandler  = {


    3  get(target){


    4  return  target;


    5 }


    6 };


    7  const  myObjViaProxy  =  new Proxy(myObj, myHandler);


    *Fig - 8\. 23*


    Output:


    ![](img/8a6860449d086ad6675add2b749bcc36_201_0.png)


    *Fig - 8\. 24*


    In the input on line #1 we have an arbitrary object. Lines #2 to #6 has a handler,
    which is


    basically an object that has methods to work on the code itself. On lines #4 to
    #5 we have a **get**


    method that intercepts the **target** object of that handler and works with it
    by reading, mutating, etc.


    On line #7 we have another proxy **myObjViaProxy** that is a proxy to **myObj**.
    In this line


    we have two arguments passed to this proxy, the first argument is the target object
    which we are


    being directed towards by the proxy, and the second argument is a handler which
    will handle the


    props before they are returned to us. Each method in the handler is called a trap.


    Let’s look at another example:


