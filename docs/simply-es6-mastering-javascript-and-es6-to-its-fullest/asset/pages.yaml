  md: '**Publish to GitHub**


    These instructions will allow you to publish your projects to GitHub. It is not
    compulsory


    to follow these instructions, they are provided for instructional purposes only.


    1.


    To add the project to GitHub first create a new Repo aka Repository on GitHub,
    and don''t


    add any files like `**.gitignore**`, `**LICENSE**`, `**README**`, etc. to it,
    all of them can be added


    later in your local fork. This Repo should have no conflicting history.


    2.


    Now use `**git init**` to initialize your project.


    3.


    Add a `**.gitignore**` file to your project directory. Add the text `**node_modules/**`
    to it. This


    file is used to ignore files and directories you don''t want to stage with Git
    (or bundle with


    your project). A list of useful files are provided at the `**github/gitignore**`
    Repo on GitHub.


    4.


    Add a `**README.md**` file now to your project directory. Add any text you want
    here,


    usually an introduction, notes, brief documentation, etc. goes here. This file
    is also used as


    your project’s home page on GitHub, and should be in Markdown format.


    5.


    A list of useful files are provided at the `github/gitignore` repo on GitHub.
    Other files like


    `**Community roles**`, `**LICENSE**`, `**Contributing**`, `**Project governance**`,
    `**Maintainers**`,


    etc. can be added later if you want. All files are supposed to be in Markdown
    format,


    except the `LICENSE` file, which may or may not be in Markdown.


    6.


    Use `**git add .**` to stage all files in your Repo.


    7.


    Use `**git commit -m "First commit"**` to commit this stage. You need to be logged
    into `**git**`


    for this.


    8.


    Use `**git remote add origin https://github.com/yourprofile/yourproject.git**`
    to attach


    the GitHub Repo with the local Repo.


    9.


    Use `**git push -u origin master**` to sync the local Repo with the GitHub Repo.


    10.


    Check on GitHub if the Repo is synced properly, and you are all done.


    11.


    Now anyone can use `**git clone yourRepo/address/onGitHub**`, to make a local
    copy of


    your Repo and test it.


    **Tip:** You can also use `**git**` with GitLab, etc. and you can also use GitHub
    with code from Subversion,


    Mercurial, or TFS project.


    **Note:** Did you know that NPM was earlier acquired by GitHub, which itself was
    acquired by


    Microsoft Corp.


