    **Setting Up TensorFlowJS**


    Let’s do some actual stuff with TensorFlowJS. In this section we will learn how
    to do a


    basic TensorFlowJS setup, and we will also give you a few examples to get you
    started in


    TensorFlow.


    To use TensorFlowJS we can use the following packages:


    1.


    TensorFlowJS - `npm i @tensorflow/tfjs`


    2.


    TensorFlowJS for NodeJS - `npm i @tensorflow/tfjs-node`


    3.


    TensorFlowJS for NodeJS with GPU acceleration - `npm i @tensorflow/tfjs-node-gpu`,


    Requires NVIDIA’s CUDA installed on Linux and an NVIDIA Graphics Card.


    4.


    TensorFlowJS as a tool form PIP - `pip install tensorflowjs`


    Here we will use TensorFlowJS with NodeJS. We can use `**npm i @tensorflow/tfjs-node**`,


    the NodeJS specific backed for TensorFlow connects to TensorFlow-C. The Browser
    and NodeJS


    packages come with their own API’s, hence `**tf.browser**` and `**tf.node**` are
    only importable from


    their respective modules. The NodeJS module provides synchronous operations only,
    hence the main


    thread will be blocked until the operation in completed.


    *Procedure*


    Let’s get started, use the following steps to set up a NodeJS based CLI interface
    to use


    TensorFlowJS:


    1.


    Make a new project directory and navigate to it from a Terminal.


    2.


    Initialize NPM with `**npm init -y**`. Make sure to use index.js as an entry point
    if you don’t


    use the `**-y**` flag.


    3.


    Install TensorFlowJS with `**npm i @tensorflow/tfjs-node**`.


    4.


    Install Babel and ES6 presets, and set them up in package.json, once the scripts
    are setup


    we can run them with `**npm run babel**`. Set the script to convert index.es6.js
    to index.js.


    5.


    Make an `index.es6.js` file.


