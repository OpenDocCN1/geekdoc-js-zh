    *Fig - 3\. 49*


    The array above is **7****2** units in length, where the base “2” represents the
    binary nature of


    the members of the Array. The length of the Tensors in a Tensor is also known
    as it’s Shape, but that


    is the story for another time...


    Then there are 2-dimensional Arrays aka “Matrix/Matrices” which refer to 1-dimensional


    Tensors (aka Array) as members of an Array.


