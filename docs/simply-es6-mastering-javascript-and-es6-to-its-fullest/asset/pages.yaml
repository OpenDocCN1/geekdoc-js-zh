  md: '6)


    The variables declared with **var** have a **“declared once, call anywhere”**
    policy. The only


    exception is them not leaking out of functions, this is why they are called function
    scoped.


    They can also be **Hoisted** (called before a declaration) but will return undefined.


    7)


    The variables declared with **let** or **const** can be called only within scope
    and their scope is


    defined by the last opening bracket that preceded them. This default scope can
    be changed


    with the re-binding method. Since these Variables can’t escape their scope/borders
    it is


    easy to remember them as having a **“No easy way out”** policy.


    8)


    The variables declared with **let** or **const** also have Async behavior which
    allows them to


    return more accurate values than **var.**


    9)


    The variables declared with **const** cannot be re-assigned, however parts of
    them can be re-


    assigned without any problems.


    10) To truly make an object immutable we can use **Object.freeze()** method.


    11) Operating on undeclared variables will throw an error instead of **undefined/null/NaN**.


    12) It is a well followed convention to name Variables with all caps and underscores
    in place


    of spaces when declaring them with **const**.


    13) Fat arrow functions can be written without an explicit return.


    14) Keywords like “**this**” and “**super**” remain bound to their previous binding
    when used


    within a fat arrow function.


    15) The keywords “**this**” is bound to the built-in **window** object by default.


    16) The **bind()** method can be used to rebind “**this**”.


    17) ES6 provides the feature of default assignments, instead of asking for a parameter
    we


    can now ask for a parameter and assign it a default value at the same time and
    place


    in our code. This plugs a lot of data leaks and errors.


