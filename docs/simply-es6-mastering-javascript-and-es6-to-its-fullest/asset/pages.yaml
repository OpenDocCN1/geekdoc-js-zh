    Let’s go down the memory lane and take a look at what we have learned! Following


    lessons are the rough outline of this chapter.


    1)


    There are a ton of benefits of using different themes and fonts.


    2)


    ES6 has a new way to write strings, it’s called template literals and is written
    with back-


    tick.


    3)


    Template literals are multi-line strings.


    4)


    ES6 has a new way to use variables and code inside strings using ${} notation
    within


    template literals.


    5)


    We don’t need to escape quotations in template literals.


    6)


    Template literals can make writing to the DOM more readable.


    7)


    Leave comments of the JS rendered HTML.


    8)


    In ES6 we can tag template literals with functions to pre-operate on them.


    9)


    Tagging functions takes multiple arguments, first an array of strings, followed
    by an array


    comprised of variables and code used inside the original string; all these variables/code


    can be contained within a single array by using the rest/spread operator in the
    function’s


    parameters.


    10) If a template literal ending on a variable is tagged, the tagger function
    will receive an


    empty string as the last element of the array passed to it as the first argument.


    11) Multi-assignment is a new way to assign values to variables in ES6, it’s also
    called De-


    structuring. See next chapter for more lessons on it.


    12) XSS or Cross-site Scripting is a dangerous exploit, your site is vulnerable
    if it doesn’t


    sanitize the input it takes from unknown sources.


    13) For input sanitization we use DOMPurify.js library in this book, other trusted
    libraries can


    also be used after thorough vetting for known exploits. Using custom functions
    to perform


    the sanitization is discouraged since even the best algorithms are not 100% safe
    to use for


    sanitization.


    14) The **reduce()** method can be applied to arrays to crush all the values down
    to one single


    value. The first argument it takes is the “accumulation bucket” where that ultimate
    value


    condenses, on the first iteration it has the first value of the original array
    as its initial


    value. The second argument it takes is the “current value” which is the value
    the iterating


    loop is focusing on in the current iteration. It can also take a index value as
    its third


    argument which always remains the index of the current iteration.


    15) ES6 comes with 4 new methods to operate on strings. They are pretty self-


    explanatory, and they come very handy.


