    **Linting code with ESLint**


    Static code analysis aka Linting is finding & fixing code that may or may not
    give rise to


    errors and problems later (sort of a precaution better than cure approach), it
    is also used to enforce


    good coding and style practices.


    Good linting promotes consistent style and improved production speed; it also
    helps us


    avoid the famous “I have never seen this code in my entire life!” syndrome.


    When using ES6 the linting software to use is the “ESLint” which can be installed
    with


    NPM using “**npm install –g eslint**”, after Node.js and NPM is installed.


