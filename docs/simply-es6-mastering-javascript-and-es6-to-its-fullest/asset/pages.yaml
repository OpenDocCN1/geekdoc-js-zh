  md: '**CLI Project #2 – CLI project initializing**


    **program**


    In this project we will make a simple Command Line Utility to initialize a CLI+NodeJS


    project. Let’s call it the “Congenial CLI Forge”!


    Use the following instructions to develop this project:


    1.


    Make a new directory for your project and name it “Congenial CLI Forge”.


    2.


    Navigate to it from a Terminal, and use `**npm init**` to initialize the project.


    3.


    Add a shebang sequence to index.es6.js.


    4.


    Use `**npm i babel-cli babel-preset-es2015 --save-dev –prefer-offline**`.


