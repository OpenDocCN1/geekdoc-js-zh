    **Positive and Negative Look-arounds**


    A look-around pattern tells the Regex to search for multiple pattern in a string.
    There are


    four categories of look-arounds: there is the “Positive look-ahead” and the “Negative
    look-ahead”,


    then there is the Positive Look-behind, and the negative look-behind.


    Let’s look at some descriptions:


    1)


    A positive look-ahead is signified by a **(?=foo)** sign, and it checks what immediately


    follows the current position in the string is **foo**.


    2)


    A negative look-ahead is signified by a **(?!foo)** sign, and it checks what immediately


    follows the current position in the string is not **foo**.


    3)


    A look-behind is signified by a **(?<=foo)** and it checks what immediately precedes


    the current position in the string is **foo**.


