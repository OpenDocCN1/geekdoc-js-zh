    *Fig - 5\. 2*


    Now the info in Fig – 5.3 was stored in “**http://localhost:3000/database**”.


    **Note:** Using the fetch API is subject to CORS standards, to work around this
    you can use the “cors”


    module in NodeJS, or any other CORS (Cross-Origin Resource Sharing) workarounds.
    Although this


    may not be necessary if you are importing with matching headers. If this all sounds
    strange to you


    then no worries! I got you. I have a server-less, totally client-side example
    further down the line in


    this section. Just make sure you understand the concepts.


    Data is at “**http://localhost:3000/database:**”:


    ![](img/8a6860449d086ad6675add2b749bcc36_125_1.png)


    *Fig - 5\. 3*


    But my associate is still searching for it, so instead of logging a response to
    our


    code/request, she logged “Promise pending”; this is since reading data from storage
    takes time (yes,


    even on SSD’s) and we asked her for the response too fast, she barely got any
    time to search for it.


    In other words we need to wait for the **fetch()** API to actually fetch the data
    before we log


    it.


