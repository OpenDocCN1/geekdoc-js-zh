  md: '*Output:*


    ![](img/8a6860449d086ad6675add2b749bcc36_193_0.png)


    *Fig - 8\. 6*


    In this code **this.name** is private/hidden; private properties are not approachable
    or


    visible directly! We have to use a getter like on lines #6 to #8, all this getter
    does is to return **name**


    when **myPepperoni.name** is called.


    Now if we need to reassign the value of **myPepperoni.name** then we will use
    the setter on


    lines #10 to #12.


    There is no need to over complicate these things, we use getters and setters to
    hide


    properties of a class; when using getter and setters they acts as middle-men between
    our calls and


    the called properties, this way they prevent direct access to these properties
    and avoid any data


    leaks.


    As a general rule in web development each property should only be available through
    a


    getter, and modifiable through a setter.


    In the output when we call **myPepperoni** in the first line the app returns an
    empty object


    since there is only one property here and it is hidden.


    Then when we call **myPepperoni.name** we are in fact calling our getter on lines
    #6 to


    #8, this returns our **name** property through the **name** getter.


    Then when we assign a new value to **myPepperoni.name** we are in fact calling
    our setter


    on lines #10 to #12, this setter takes the assigned value as an argument and assigns
    it to our **name**


    property; all this happens through the **name** setter.


    Since taking value out of the **name** prop, and putting value into the name prop,
    both


    happens through a getter and setter, there is no direct access and as a result
    our data inside the


    **name** prop remains safe.


    One very important thing to notice here is that getters and setters are in fact
    props, not


    methods!


