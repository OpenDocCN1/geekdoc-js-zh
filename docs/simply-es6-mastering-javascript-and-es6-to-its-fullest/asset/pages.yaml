- img_proc: true
  md: 'A Compiler is sort of a translator that translates logic given by a coding
    language to


    instructions for the ALU, languages like C/C++ are compiled. An Interpreter is
    simply a transpiler


    of sorts, it takes code and converts it to a more desirable form; JavaScript is
    interpreted. Then there


    is a Parser, which converts data to a more desirable form; HTML is parsed.


    Another thing to keep in mind is that when ES6 goes through a transpiler it is
    converted to


    ES5, so ES6 code may run slower.


    **Starting with Labels & Comments**


    All good books on coding should start with labels and comments. Labels and comments


    make managing your code easy to read and manageable. It also helps us avoid unnecessary


    importing and the usage of external modules. To top that most of the people I
    have interviewed don’t


    really document and label their code properly, sometimes not at all; this makes
    it difficult to scale


    your software and work on it with others. I’ll take a coder who documents properly
    over a coder


    who can do code gymnastics any day.


    Comments in JavaScript are of two kind.


    The single line comment is written with *“// comment here*”


    While the multi-line comment is written with “*/* Comment here */*”


    2  // This is a single line comment –selfNote


    3


    4  // This is another single like comment –redundant-selfNote


    5


    6  /*


    7 This is a multi-line comment,


    8 it can be used to explain a section of


    9 code and should be used extensively with


    10 functions and scopes


    11 */


    *Fig - 1\. 1*


    We should also use spaces for indentation instead of tabs.


    You can notice the “--selfNote” right?! It’s my own convention, you don’t have
    to do it but


    it makes the code more manageable during development.


    There are a lot of books out there that can teach you ways to document your code
    and use


    labels and comments, but from a short-term, practical stance all we need is minimal
    conventions and


    we are good to go. There are startups out there who spend days, sometimes weeks
    going through


    dense documentation of conventions just to modify a single line of code, we don’t
    want to be them.


    In this book I will show you how I personally manage literally millions of lines
    of code when needed.


    You can learn from it and then modify it as you like, but once you chose a convention
    and notation


    you have to stick with it throughout the project; I don’t need to tell you why,
    do I?


    17 | P a g e'
