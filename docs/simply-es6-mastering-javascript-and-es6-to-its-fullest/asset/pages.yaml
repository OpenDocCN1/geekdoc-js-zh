  md: '**Closing Arguments**


    Let’s revisit the lessons of this chapter and take a look at what we have learned!
    Following


    lessons are the rough outline of this chapter.


    1.


    ES6 comes with many features to deal with control-flow aspects of our code.


    2.


    Promises are processes that takes time to resolve, thus we need to wait for them
    to resolve


    before we can execute code that depends on the promise being fulfilled.


    3.


    ES6 comes with a new feature called **fetch()** which is a new way to request
    resources and


    data.


    4.


    Different processes can be chained together to have better control flow.


    5.


    “Thenables” are methods chained with promises, they are used to wait for a promise
    to


    resolve before executing code enclosed within their bounds.


    6.


    “Thenables” are also promises themselves.


    7.


    Data extracted from a promise may need to be converted to JSON, blob, simple text


    format, etc. to make it more user friendly.


    8.


    Using **fetch()** or any other requests methods may result in **CORS** (Cross-origin
    resource


    sharing) errors which can be overridden using middle-ware, CORS-allowing headers,
    or


    browser settings. However a need to override CORS rules is a sign that an algorithm
    is


    flawed by design and should be altered to follow CORS principles.


    9.


    Calling a promise before it resolves will result in a “Promise pending” object
    returned.


    10.


    The **catch()** method can be used to handle any errors disturbing a promise or
    anything


    else that returns an error.


    11.


    Both **then()** and **catch()** methods take a function as an argument, while
    using **catch()**


    with **then()** is not required as **then()** can be passed another function as
    a second argument


    that will handle any errors springing from it. However **catch()** method can
    still be used for


    readability purposes.


    12.


    There is also the old method of making requests using the XMLHttpRequest routine,
    which


    can be used to make a more specific request (**fetch()** can do it too!).


    13.


    Multiple promises can be dealt with using **Promise.all()** method which can be
    passed an


    array of Promises as argument. The **all()** method is also a promise and will
    resolve when


    all the provided promises are resolved.


