  md: '**Chapter 11 – Introduction to Machine**


    **Learning, AI, and Robotics with**


    **JavaScript**


    In this chapter we will unveil stuff about Machine Learning, AI, and Robotics
    related


    programming with JavaScript. Just to be clear this is not a programming lesson!
    You will not be


    learning any programming, however you will be using your existing programming
    skills to learn


    some new stuff related to Machine Learning. This chapter will cover the usage
    of TensorFlowJS for


    Tensor Mathematics on a Introductory level. When this chapter is over you will
    be able to use


    TensorFlowJS to some magnitude.


    **Machine Learning**


    Learning is defined as the acquisition of knowledge, understanding, skills, etc.
    The ability


    to learn is natural in humans, animals, and maybe even plants.


    Machine Learning is the branch of Computer Science which aims to study Algorithms
    that


    learn and improve, ultimately giving a more desirable output.


    As a elementary example we can imagine a Program that takes in input of an individual’s


    Education level and is asked to predict their Income, at first this program may
    throw random values


    at us, but if we can tell that program how far off it was from the real answer
    then in time it will


    learn and adjust, ultimately giving more and more accurate answers. Potentially
    this program is


    capable of giving us the best possible value it can just by looking at an individual’s
    education level,


    the value will still be far off from the actual values since Education level may
    not be that heavily


    correlated to Income, but the result will be as good as it can be. Such a program
    may use stuff like


    plotting values and regression analysis, also in turn it may learn to avoid the
    outliers in the data. The


    Algorithm of this type of program will be covered in the domain of Machine Learning.


    Machine Learning aka ML is more Mathematics than Computer Science under a particular


    light, however that can be said about all Algorithms! Machine Learning is a subdivision
    of Artificial


    Intelligence aka AI, one can also say that ML is sort of an application to AI.
    I often refer to Machine


    Learning and Artificial Intelligence as ML/AI.


