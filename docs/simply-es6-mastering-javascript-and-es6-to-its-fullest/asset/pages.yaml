- img_proc: true
  md: 'Now Labels are used to group a code together and refer to it later, however
    they can also


    be used to manage code. It depends on the coder, but more often than not it depends
    on the project


    manager and your fellow coders. Some people say using labels is a bad practice,
    some people just


    don’t like them. It’s the “Mere Exposure Effect”, people stay away because they
    don’t see them that


    often, however I have used labels all my life, it is sort of a pseudo-functional
    coding where you get


    its benefits and so much more power over your code just by labeling it properly.


    This is how a label looks like:


    3  labelX: { //this is a label named labelX


    4 document.write(“Hello world!”);


    5 }


    *Fig - 1\. 2*


    And this is how I use it without ES6 methods:


    3  printingAlphabets: { //this block print alphabets


    4


    5  var  arr  =  ”abcdefghijklmnopqrstuvwxyz”;


    6  arr  =  arr.split(“”);


    7


    8  for (var  i  in  arr) {


    9 document.write( arr[i] +  “<br>” );


    10 }


    11


    12 }


    *Fig - 1\. 3*


    This is with ES6:


    15  printingAlphabetsWithES6: { //this block prints alphabets with ES6


    16


    17  var  arr  = [...”abcdefghijklmnopqrstuvwxyz”];


    18  arr.map(x => document.write( x  +  “<br>”));


    19


    20 }


    *Fig - 1\. 4*


    This is with ES8:


    23  printingAlphabetsWithES8: { //this block prints alphabets with ES8


