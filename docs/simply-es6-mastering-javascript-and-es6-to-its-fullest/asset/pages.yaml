    *Fig - 9\. 46*


    *Output:*


    ![](img/8a6860449d086ad6675add2b749bcc36_236_0.png)


    *Fig - 9\. 47*


    The first Regex checks for the character following **“b”** is a member of the
    character class “**\**


    **w**”, since **“c”** is a member of “**\w**” it returns true.


    The second Regex checks for the character following **“b”** not being a member
    of the


    character class “**\w**”, since **“c”** is a member of “**\w**” it returns false.


    Not easy, but efficient! However in my view the use of Regex and external libraries
    for


    form verification compromises our application’s security, for this reason I advocate
    precaution when


    using Regex.


    **Capture Groups**


    A capture group is a pattern enclosed within parenthesis/brackets, it is used
    to check for a


    pattern multiple times without writing it multiple times. Look at the following
    code:


    1  const  myString  =  “abcabcabc abcabcabc”;


    2


    3  const  myRegex1  =  /(abc){2}/;


    4  const  myRegex2  =  /(abc){3}/;


    5  const  myRegex3  =  /(abc){4}/;


