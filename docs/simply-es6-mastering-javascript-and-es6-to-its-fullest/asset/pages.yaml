    **Generator functions & yield**


    A “Generator function” is a function with an asterisk “*****” as a suffix after
    the **function**


    keyword. A generator also has “Buffer returns” or “Yields”.


    A **yield** is basically a return that gives an output and pauses the code after
    it until the


    function calls the next **yield**. To use a generator and yield properly we call
    it with the **next()**


    method, this method returns an object with two properties “**value**” & “**done**”,
    the **value** prop gives


    us the value returned by **yield** and the **done** prop tells us whether the
    function is paused or


    completed executing by returning **true** or **false**. Let’s take a look at the
    following code:


    1  function*  myFunk() {


    2  yield  “1st”;


    3  yield  “2nd”;


    4  yield  “3rd”;


    5  return  “4th”;


