    the matrix array, looping through a total of 27 members.


    On line #28 we have declared a variable named **count** to use as a counter to
    keep track of


    the number of cubes we have looped through while we were in the loop.


    Each time the three-way loop runs we render a single cube on the DOM with code
    from


    lines #31 to #36\. We also give that cube a class of either “lit1”, “lit2”, or
    “lit3” depending upon


    which slice that cube belongs to and will it be on or off; if it is **on/active**
    we will give it a **lit** class, if


    it’s off we wouldn’t. If the corresponding cube is in the back slice we give it
    a class of “**lit1**”, if in


    middle we give it “**lit2**”, and if in front we give it “**lit3**”; these classes
    assign these cubes a color, an


    absence of these classes makes the cube see-through.


