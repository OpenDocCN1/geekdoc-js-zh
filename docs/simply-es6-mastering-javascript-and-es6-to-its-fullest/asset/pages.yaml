  md: 'By a rough definition a “Tensor” is an n-dimensional Array, where n is the
    number of


    Arrays inside the Tensor. So a 0-dimensional Tensor aka a “Scalar” is also an
    Array or a close relative


    of an Array.


    **Note:** From a loose perspective you can use the term Tensor and Multi-dimensional
    Array


    interchangeably.


    The Simplest form of Tensors are one dimensional Tensors aka Arrays, like the
    following


    array:


    *A “1-dimensional” Tensor is an Array with “0-dimensional” Tensors aka*


    *Scalars as it’s members; again it’s an “Array” with “Scalars” as it’s*


    *members.*


