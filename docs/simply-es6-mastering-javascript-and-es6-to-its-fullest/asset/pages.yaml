    exercises to practice what we have learned.


    1)


    The key to writing good JavaScript code is to focus on readability and scale-ability;
    Proper


    use of comments and labels allows us to document our code and improve its quality.


    2)


    Using spaces instead of tabs for Indentation, while tabs make code more clear
    to read it all


    comes down to habit. A code written with tabs is not scaleable because it need
    to be


    formatted every time we move to a new framework or IDE, even changing the preferences


    of your code-editor can force you to re-format the code.


    3)


    I use flags to complement comments, following is a list of flags I use on a daily
    basis:


    **Note:** I do not encourage the use of these methods, in my particular case these
    methods


    improve the communication between me and my squad. You are not meant to adapt
    these


    methods, just learn from them.


    You can use these conventions, or you can develop your own. Different projects


    require different flags, however it is a requirement for your team to agree and
    practice the


    same conventions and notations. I encourage my team’s developers to develop their
    own


    convention and share it with other


    members of the team to develop a


    hive mind among us!


    You can even double or triple flag,


    however if your code needs too much


    flags then it may be flawed by design


    as they say.


    4)


    The difference between keyword-less,


    **var**, **let**, and **const** declared Variables


    is of scope and mutability.


    5)


    Keyword-less variables are accessible


    everywhere they are still a member of


    the **window** object, they are also


    highly discouraged unless you know


    what you are doing. “use strict” is a


    method that prevents calling undeclared variables, it comes very handy when we
    want to


    avoid declaration and “Variable is undefined” errors.


