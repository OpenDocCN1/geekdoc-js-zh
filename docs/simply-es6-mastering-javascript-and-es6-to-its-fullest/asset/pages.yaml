    In recent chapters we have learned some Mathematics related with Tensors. As a
    revision


    remember the following terms:


    1.


    4-dimensional Tensors are Arrays with 3-dimensional Tensors as members.


    2.


    3-dimensional Tensors are Arrays with 2-dimensional Tensors as members.


    3.


    2-dimensional Tensors aka Matrices are Arrays with 1-dimensional Tensors as members.


    4.


    1-dimensional Tensors aka Arrays aka Vectors are Arrays with 0-dimensional Tensors
    as


    members.


    5.


    0-dimensional Tensors aka Scalars are Numbers.


    In Mathematics Tensors can have any amount of dimensions as we want, they have
    shape


    which is defined by the length of their members and sub-members, and sub-members
    of sub-


    members, and so on.


    Just like Arrays, Tensors have index values too! However they look more like map


    coordinates, so a 1-dimensional Tensor aka Array have index values like 0, 1,
    2, 3, 4, etc. a 2-


    dimensional Tensor has index values like (0, 0), (0 1), (0, 2), (1, 0), (1, 1),
    etc. and a 3-dimensional


    Tensor has index values like (0, 0, 0), (0, 0, 1), (1, 0, 1), (3, 1, 0), etc.
    and so on, more the


    dimensions the more members present in an index position.


    **Note:** Tensors, Arrays, Matrices, Vectors, etc. are not synonymous. They have
    different definitions in


    Mathematics, and Computer Programming. Don’t confuse them with each other! In
    TensorFlow


    Tensors are an immutable from of data.


