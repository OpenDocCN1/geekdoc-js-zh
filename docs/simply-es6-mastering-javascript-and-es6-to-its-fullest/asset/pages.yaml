    **Strings in ES6**


    In JavaScript a lot of freedom is allowed with the strings, but there are more
    than a few


    hiccups. ES6 brings new features to deal with these drawbacks.


    I will also be experimenting with a new theme in this chapter. This way you can
    get used


    to working on different code-editors and will be able to make a better choice
    when choosing a theme


    suiting your coding life-style. I often tweak the themes of my code-editor, it
    gives the “Novelty


    effect” which give you the “Fresh eyes” benefit when debugging.


    If you don’t realize the need for adopting a theme then consider the following:


    1)


    A good, dim background color can save your eyes a lot of pain.


    2)


    You can get zero-0, alphabet-O, confused if you are not using the right fonts;
    same thing


    happens with one-1, and alphabet-I.


    3)


    Color coding saves time and improves coding and debugging speed.


    I suggest using a dim red or blue shade in the background, with “Anonymous Pro”
    font as a primary


    theme. As a secondary theme use the opposite color tints in the background and
    “IBM 3270” as the


    font. I keep the keywords “Raspberry” or “Red” colored as setting this convention
    throughout all


    coding languages helps me pick-up code easily.


    Now for strings the first thing you need to do is recognize a few problems:


    1)


    In JavaScript/ES5 we need to concat/join strings with the **plus (+)** operator
    whenever we


    want to add a variable within a string.


    2)


    In JavaScript/ES5 we lack of a good way to write multi-line strings.


    3)


    In JavaScript/ES5 we have to escape quotation characters.


    4)


    Piling on an army or quotation marks together is just pure madness.


    ES6 changes all this, it comes with a feature to add variables within a strings.


    So this:


