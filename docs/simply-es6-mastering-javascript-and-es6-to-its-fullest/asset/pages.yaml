  md: '**Chapter 7 – Upgrading your**


    **Development Methodology**


    **Babel, Webpack, & Development Tools**


    If you approach the **package.json** file you may see there are 2 kinds of dependencies


    described in them, there are the usual run of the mill dependencies, and there
    are the


    devDependencies.


    Development dependencies are tools used to develop the software, they are not
    needed for


    the software to be used. There is no need to package developer tools with your
    app, once your work


    is done their work is done, so their cumbersome load will not be included within
    your apps.


    Let’s see it this way, you are a carpenter, you use hammers, screw drivers, screws,
    nails,


    etc. to develop a chair. When you ship that chair you need to ship it with the
    nails and screws but


    not the hammer and screw driver. The hammer and screw driver are the developer
    tools, while the


    nails and screws are the dependencies, imagine that!


    At one point or another you will need some developer tools to rescue you from


    boilerplates, and polyfills, etc. Development tools are also required to improve
    production quality,


    time, etc. and add advanced functionality to your code. Most development tools
    here are installed


    using Node Package Manager aka NPM using the following syntax of Terminal commands:


    **npm i <pkg-name> --save-dev**


    Modules installed like this are installed as development dependencies.


    **Babel** is a developer tool used to modify ES6 code to fit ES5 standards, as
    not all browsers


    and environments support all features of ES6\. Following Babel tools are used
    in standard ES6


    development and you may need to install them at some point:


    1)


    babel-loader


    2)


    babel-core


    3)


    babel-preset-es2015


    Terminal command to install all Babel developer tools mentioned above:


    **npm i babel-loader babel-core babel-preset-es2015 --save-dev**


    Further instructions for using Babel are available further down the line.


    **Webpack** is a developer tool used to bundle your complex modules with dependencies
    to


    simple static assets and minified and optimized distributions. Basically it converts
    unsupported files


    to supported one.


    164 | P a g e'
