  md: '**Chapter 6 – Primitives, Linting, and**


    **IDE material**


    **The primitives**


    The word “Primitive” is seldom used in JavaScript, probably because almost all
    data is


    subject to methods and behaves as a proto-object; however Primitives are a thing!


    A “Primitive” is data that’s not an object and has no methods.


    JavaScript has 6 datatypes: Strings, Numbers, Booleans, Null, Undefined, and the
    newly


    added “Symbol” (in ES6).


    There are a few traits of the symbol data type:


    1)


    All symbols are unique in the sense that none of them are equal to the other (Check


    Fig – 6.1).


    2)


    Symbols are non iterable. You can’t use loops on an object with Symbols as keys.


    2  const  like  =  Symbol("thumbs up");


    3  const  thumb  =  Symbol("thumbs up");


    4


    5  console.log(


    6  like  ===  like,


    7  like  ==  like,


    8


    9  like  ===  thumb,


    10  like  ==  thumb,


    11


    12  Symbol("thumbs up") ===  Symbol("thumb up"),


    13  Symbol("thumbs up") ==  Symbol("thumb up")


    14 );


    *Fig - 6\. 1*


    Now you can see how the data, data-type, and Variables go when compared with each


    other. As a rule of thumb when two symbols are compared for equality the result
    will be **false**, and


    as a rule of thumb when a variable is compared to itself it will always resolve
    to **true**. This is much


    like the “Law of Identity” in mathematics, where all things are equal to themselves.


