  md: '**Introduction and 2**


    **nd** **Edition Notes**


    The inception of this book occurred around December 2018 when I felt the need
    to make a


    common documentation for the use of freshly initiated members of my own team.
    This book was


    born out of my love for JavaScript and MERN stack! Reading this book cover to
    cover will


    significantly improve your Web and Software Development game, however the main
    goal of this


    book is to introduce the developer to the remarkable powers of JavaScript! The
    ES6 upgrade to


    JavaScript has given superpowers to JavaScript few people know about. This book
    covers almost


    everything that the modern day JavaScript programmer or Software Developer must
    know to


    improve their game, taking a Software Engineering perspective on JavaScript, ES6,
    and other


    development methods. Readers will go through intensive training involving ES6
    theory, Advanced


    projects, Applied Software Engineering Methodology, and History, Theory, and Mathematics
    related


    to Machine Learning.


    There is a lot of confusion about JavaScript among programmers. Many think it
    is


    something to be taken lightly! This is partly due to the stigma surrounding it;
    initially JavaScript was


    more a gimmick than a programming language; however those days are long gone!
    The JavaScript of


    today is powerful stuff. It has a strong legacy with ES6, TypeScript, React-Native,
    Dart, etc. and it


    also provides a remarkable developer experience! Frankly speaking JavaScript is
    not the best


    programming language! But it’s the programming language of tomorrow.


    Another factor which misrepresents JavaScript is that it’s mostly used by Web
    Developers


    in a Cooperate environment; for years these people have been misrepresenting JavaScript
    as


    something for Web Development only. Many startups truly are missing out on the
    benefits of


    JavaScript like cheap and highly competent labour, fast cross-platform development,
    backwards


    compatible code, etc.


    After the publication of the 1


    st Edition I’ve had the opportunity to talk to many of my


    readers from all around the world! Aside from it being a very humbling experience,
    it was also a


    very illuminating one. Programmers of all sorts discussed their learning experience
    with me and


    provided extraordinary insight to make this a better book. Aside from making a
    lot of friends and


    developing a great community, I was also able to learn much through this experience.
    The


    publication of this book helped me as much as it helped any reader who picked
    it up. The 1


    st Edition


    of this book was a really important bench-marking point for me, it was an instant
    best-seller!


    Encouraging me to write further.


    Something I felt somewhat bitter about was the fact that during the editing of
    the 1


    st


    Edition the book was deemed too lengthy, and was shaved down to a smaller form,
    leaving behind


    many important topics I wanted to cover desperately. The 2


    nd Edition of this book includes many


    topics I wanted to cover in the 1


    st Edition but didn’t.


