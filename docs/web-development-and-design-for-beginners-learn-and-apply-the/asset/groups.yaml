    # Separation Between HTML Structure and CSS Style


    The HTML <div> element is the generic container for flow content. It has no impact
    on the layout or content until it is styled in some way using CSS (for example,
    the style is applied directly to it, or a layout model type, such as Flexbox,
    is applied to its parent element).


    As a "pure" container, the <div> element is inherently nothing. Instead, it is
    used to group content to be easily styled using the class or id attributes, marking
    a section of a document as written in a different language (using the attribute
    lang), and so on.


    # A simple example


    ```

    <div>

    <p>You may insert any content</div>

    ```'
