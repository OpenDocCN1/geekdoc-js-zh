    \n## while 循环\n\n这是 JavaScript 提供的最简单的循环语句。它循环一段代码，直到指定的条件评估为真。一旦条件失败，循环就会停止。\n\
    \nwhile 循环的语法是：\n\n```javascript\nwhile (condition) {\n  // 要执行的代码\n}\n```\n\n\
    下面的示例定义了一个循环，只要变量 `a` 小于或等于 6，循环就会继续运行。变量 `a` 在每次循环运行时增加 1：\n\n```javascript\n\
    var a = 1;\nwhile(a <= 5) {\n  document.write(\"<p>The number is \"\n  + a + \"\
    </p>\");\n  a++;\n}\n```\n\n这是代码的输出：（图 6.4A）\n\nThe number is 1\n\n![](img/6dfe767126857d06708c3e3f536f3e6c_193_0.png)\n\
    \nThe number is 2\n\nThe number is 3\n\nThe number is 4\n\nThe number is 5\n\n\
    **注意：** 确保循环中指定的条件最终变为假。否则，循环将永远停止迭代，这被称为无限循环。一个常见的错误是忘记增加计数器变量（在我们例中是变量 `i`）。\n\
    \n**do ... while 循环**\n\ndo-while 循环与 while 循环有所不同。它在循环每次迭代结束后评估条件。使用 do-while\
    \ 循环，代码块执行一次，然后评估条件。如果条件为真，语句将重复执行，直到指定的条件评估为真。do-while 循环的通用语法为：\n\n```javascript\n\
