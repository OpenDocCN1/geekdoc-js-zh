    undefined

    ```


    Note that both Hello World and console.log() are expressions. However, the first,
    the literal Hello World! - simply evaluates and resolves a value of type string
    and is then classified as a string expression. While the other, the console.log(
    ) method, has a side effect (prints something on the screen) and returns the undefined
    value. Expressions that have a side effect are known as expression statements.


    I have a question, can expressions be part of the statements? Yes, they can and
