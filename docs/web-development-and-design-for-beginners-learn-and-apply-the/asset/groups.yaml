    ## How to Use HTML Table for Content


    A table is a coordinated and organized arrangement of data that comprises rows
    and columns (in tabular form). A table permits you to rapidly and effectively
    discover values that show some sort of connection between various kinds of data,
    like an individual and their age, or a day of the week, or the schedule for a
    neighborhood pool.


    ## Creating a simple table


    The structure of an HTML table is made up of the following tags:


    - Table tags: `<TABLE> </TABLE>`

    - Row tags: `<TR> </TR>`

    - Cell tags: `<TD> </TD>`


    Building an HTML table describes the table between the starting table tag, `<TABLE>`,
    and the ending table tag, `</TABLE>`. Between these tags, construct each row and
    each cell in the row.


    This is done by first starting the row with the start of line tag, `<TR>`, then
    creating the row by creating each cell with the start of cell tag, `<TD>`, adding
    the data for this cell, then closing the cell with the final cell tag, `</TD>`.
    When you''re done with all the cells in a row, close the row with the end of line
    mark, `</TR>`. Then, for each new row, repeat the start of the row process, building
    each cell in the row and closing the row.


    The below table is an example of a basic table with three rows and two columns
    of data (Figure 3.3).


    | 1 | 2 |

    |---|---|

    | 3 | 4 |

    | 5 | 6 |


    ![](img/6dfe767126857d06708c3e3f536f3e6c_97_0.png)


    This table appears like this on the web page (Figure 3.4):


    ![](img/6dfe767126857d06708c3e3f536f3e6c_98_0.png)


    The codes that generated this table is like this:


    ```html

    <TABLE>

    <TR>

    <TD>1</TD>

    <TD>2</TD>

    </TR>

    <TR>

    <TD>3</TD>

    <TD>4</TD>

    </TR>

    <TR>

    <TD>5</TD>

    <TD>6</TD>

    </TR>

    </TABLE>

    ```


    This table does not contain any borders, titles, or headers. If you want to add
    any of these properties to your table, you need to include extra HTML codes. The
    codes for these elements are explained later in the next section.


    ## Adding a title, border, and headings


    In addition to the basic table tags, there are several options for adding additional
    items to the table. For instance, if you add a border, title, and column headers
    to the table in the previous section, the table will look like this (Figure 3.5):


    ![](img/6dfe767126857d06708c3e3f536f3e6c_99_0.png)


    | TITLE OF THE TABLE |

    | Column A | Column B |

    | 1 | 2 |

    | 3 | 4 |

    | 5 | 6 |


    The following codes generated the border, TITLE OF THE TABLE, and column A and
    column B headings for this table (Figure 3.6):


    ![](img/6dfe767126857d06708c3e3f536f3e6c_100_0.png)


    | Column A | Column B |

    |---|---|

    | 1 | 2 |

    | 3 | 4 |

    | 5 | 6 |


    ```html

    <TABLE BORDER="5">

    <TR>

    <TH COLSPAN="2">TITLE OF THE TABLE</TH>

    </TR>

    <TR>

    <TH>Column A</TH>

    <TH>Column B</TH>

    </TR>

    ```


    **Note:** If you want to see the codes that generated cells 1 to 6, see the previous
    section. Note that the initial table tag, `<TABLE>`, now includes the border tag,
    `BORDER="5"`, which places a border around the table and surrounds each cell.
    Depending on how you design your table, you can determine the border size that
    best suits you and the overall design of your page. To add a title to your table,
    insert the title between the row `<TR>` and `</TR>`. The heading codes, `<TH>`
    and `</TH>`, depict a heading, and by default, these codes center the heading
    and make it bold. However, if you wish to span the title across columns, you must
    include the code `colspan="2"`. As this table has two columns, the code `COLSPAN="2"`
    was required to emphasize the text to make it bigger. In this table, note that
    `<h3>` and `</h3>` commands increased the size of the title. Finally, the `<BR>`
    tag has created a space just above the title.


    ## HTML Layout Using Tables


    The easiest and most common way to create layouts is to use the HTML `<table>`
    tag. These tables are organized in columns and rows, so you can use these rows
    and columns as you see fit. For example, the following HTML layout is achieved
    using a table with 3 rows and 2 columns, but the header footer spans both columns
    using the colspan attribute (Figure 3.7):


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Using Tables for HTML Layout</title>

    </head>

    <body>

    <table width="100%" border="0">

    <tr>

    <td colspan="2" bgcolor="#b5dcb3">

    <h1>This is Sample Web Page</h1>


    </tr>

    <tr valign="top">

    <td bgcolor="#aaa" width="50">

    <b>Main Menu</b><br />

    HTML<br />

    JavaScript<br />

    CSS...

    </td>

    <td bgcolor="#eee" width="100" height="200">

    Web design and Development

    </td>

    </tr>

    <tr>

    <td colspan="2" bgcolor="#b5dcb3">

    <center>

    Copyright © 2021

    </center>

    </td>

    </tr>

    </table>

    </body>

    </html>

    ```


    Run the HTML code above to see the result.


