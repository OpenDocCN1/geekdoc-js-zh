    \ // 输出: Hello,\nPeter\n```\n\n## JavaScript 循环\n\n当你需要重复执行同一代码块时，只要满足特定条件就会使用循环。循环背的思想是自动化计划内的重复任务，以节省时间和精力。JavaScript\
