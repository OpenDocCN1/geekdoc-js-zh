    \ `document` 对象是文档本身的根。元素继承自 `Node` 通用接口，这两个接口共同提供了你在单个元素上经常使用的许多属性和方法。\n\n这些元素还可以拥有特定的接口来处理它们所包含的数据类型，如上一节中的表格对象示例所示。\n\
