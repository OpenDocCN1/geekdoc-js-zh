    Conventional wisdom says that the jQuery plugin (and this also includes the Migrate
    plugin) must be included in the <head> tag, although there are valid arguments
    to insert it as the last statement just before the closing <body> tag; Placing
    it here can help speed up loading times on your site.


    This topic is not set in stone; There may be cases where you need to put it in
    the <head> tag, and this choice should be left to the developer''s needs. However,
    my personal preference is to put it in the <head> tag as it provides a clear separation
