- md: '

    You can do this by adding <meta name="viewport" content="width =device-width">
    into the <head> tag. This sets the width of the viewport to the width of the device.
    Since IE10 has decided to ignore this metadata, you will also need to add the
    following viewport rule to your CSS:


    ```

    @viewport{ zoom: 1.0; width: device-width; }

    ```


    # Make it compatible with mobile devices


    Becoming responsive doesn''t automatically mean your website is mobile-friendly.
    It can fit smaller screens, but a good user experience isn''t just about moving
    things around.


    An important thing to remember about RWD is that your site shouldn''t be wider
    than a column at the smallest breakpoint. Keep in mind that the average space
    required to tap on a mobile screen is 44 pixels. So it''s easier to put all of
    your elements on one long, single page that the user can browse, rather than trying
    to force them to navigate using tiny links and buttons.


    When you think of mobile users, consider that responsive design allows you to
    eliminate elements when reducing columns using conditional loading in CSS. Hide
    all non-essential content when screen space starts to shrink.


    # Test, and Test Again


    You should notice how easily it resizes when you resize your browser window if
    you''ve designed your website. However, this test is not sufficient. Use the different
    testing tools available in your editing tool and the different automated testing
    tools available. You ought to likewise test your site on every one of the gadgets
    to which you approach.


    The objective of each site is to make the ideal experience for its guests with
    the goal that they can discover precisely the thing they are searching for. At
    the point when individuals can''t get to the pages on your site, they get baffled
    and leave. Rather than mold your mobile experience into a specific box that can
    look good on all devices. Instead, why not take a mobile web design approach that
    ensures your site fits your visitors'' screens perfectly, whatever the device''s
    size is executing. Then, you won''t have to worry about your visitors leaving
    with responsive design alone because things don''t look right and aren''t working
    on your site.


    # USING BALSAMIQ TO MOCKUPS AND WIREFRAME


    Wireframing can be described as an activity to display the layout of a specific
    screen (mobile or web). As of late, there has been an expanding interest in wireframing
    the screens/pages to evaluate their adequacy.


    # Why Wireframing?


    Wireframing is necessary to save time invested in understanding a software requirement.
    As it is popularly said, a picture is worth a thousand words. Wireframing provides
    a view of any function/page requirements, effectively displaying the layout and
    elements of the screen. Ultimately, it also helps development teams move forward
    towards the common end goal.


    # Balsamiq as a Wireframing Tool


    Balsamiq is an excellent tool, meeting all the requirements of Wireframing, collaboration,
    and creativity. Its unique features allow the team member to quickly wireframe
    and get consensus on the feature to develop. This will eventually align the team
    with the layout resources.


    It also enables collaboration between different teams so that a team member can
    collaborate with other co-located or remotely located teams. Finally, its ability
    to export wireframes to PDF/PNG formats allows flexibility when sharing wireframes.


    We now know how effective Balsamiq is at creating real-time wireframes. Suppose
    we use this time at the start of software development to define stakeholder expectations.
    In that case, there will be greater satisfaction among stakeholders, given the
    minimum time required to create the wireframe. This is the main reason why Balsamiq
    is used by most product organizations, where customer/stakeholder relations service
    is essential.


    For a product manager/UX analyst, Balsamiq Mockups provides a platform to add
    value in the early stages of development. The product manager/UX analyst can seamlessly
    guide the product to success using their rich set of tools.


    # STRUCTURING THE PAGE WITH HTML


    As mentioned previously, HTML elements are the basic building blocks of the Web.
    HTML describes the structure (arrangement of components) of a web page. By the
    end of this chapter, you will have familiarized yourself with different HTML tags
    and how they work to organize the contents of a web page. You will also be able
    to create basic web pages that contain text, images, and hyperlinks. You will
    also learn how to implement responsive design through a simple HTML tag added
    to your web page.


    If you want to build a website, the first language you need to learn is HTML.
    HTML is the contraction for Hypertext Markup Language and is the most broadly
    utilized language for designing website pages.


    Hypertext alludes to how website pages (HTML docs) are connected together. Along
    these lines, the link accessible on a website page is known as hypertext.


    As the name suggests, HTML is a markup language, which implies that HTML is used
    to simply ''mark up'' a text document with tags that inform a web browser how
    it should be structured for display.


    Originally, HTML was designed to define the structure of documents, such as titles,
    paragraphs, lists, etc., to facilitate sharing of scientific information among
    researchers.


    Now, HTML is widely used to format web pages using various tags available in HTML
    language.


    # The Anatomy of the HTML Syntax


    HTML is a way of marking up text that allows you to format its appearance in a
    web browser and allows text to link to other content. To mark up the text and
    say how we want it to appear, we use HTML "tags" around the text we want to change.
    In almost all cases, it is a good idea to have a start tag and an end tag. Not
    adding a closing tag is one of the standard beginner''s mistakes and can lead
    to weird results.


    The main parts of our element are (see above Figure 3.1):


    - The opening tag: This consists of the name of the element (in this case p),
    surrounded by opening and closing angular brackets. Indicates where the element
    begins or begins to take effect, in this case, where the paragraph begins.

    - The closing tag is written the same way as the opening tag, except it includes
    a slash before the element name. Indicates where the element ends, in this case,
    where the paragraph ends.

    - Content: is the content of the element, which in this case just text.

    - The Element: The opening tag, closing tag, and content together form the element.


    # Understanding the HTML Boilerplate and HTML Doctypes


    Boilerplates are similar to templates in that they provide the elements needed
    to create the foundation of a building. Naturally, an HTML boilerplate is a set
    of files that form the basis of any website created by professionals in the industry
    who have encountered the same issues and do not want others to experience the
    same issues.


    Boilerplates often contain various file types associated with web builds, including
    HTML documents, basic CSS stylesheets, essential JavaScript, placeholder images,
    and documentation on how to use what you just downloaded.


    Let''s look at a line-by-line HTML template (Figure 3.2).


    ```

    Line 1 <!DOCTYPE html>

    Line 2 <html lang="en">

    Line 3 <head>

    Line 4 <meta charset="UTF-8">

    Line 5 <meta name="viewport" content="width=device, initial-scale=1.0">

    Line 6 <meta http-equiv="X-UA-Compatible" content="le=edge">

    Line 7 <title>Document</title>

    Line 8 </head>

    Line 9 <body>

    Line 10 </body>

    Line 11 </html>

    ```


    # Line 1


    Including a document type definition, a declaration is the first thing to do when
    creating an HTML document.


    ```

    <!DOCTYPE html>

    ```


    # Line 2


    The <html> element stands for HTML document root. The lang attribute is included
    to denote the document language for all the page text.


    ```html

    <html lang="en">

    ```

