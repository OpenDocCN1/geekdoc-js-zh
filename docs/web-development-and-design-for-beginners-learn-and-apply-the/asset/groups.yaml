    As seen in the above example, the age property is linked to the studObj1 instance.
    However, the studObj2 instance will not have the age property because it is defined
    only on the studObj1 instance.


    So, assuming we want to add new properties at a later stage to a particular function
    that will be shared across all instances, what should we do?


    The answer is the prototype. A prototype is an object associated with all functions
    and objects by default in JavaScript, where the prototype property of the function
    is accessible and editable, and the object''s prototype property (also known as
    an attribute) is not visible.


    Each function includes a prototype object by default.


    The prototype object is a special type of enumerable object with additional properties
    associated with it that will be shared among all instances of its constructor.


    Then, use the prototype property of a function in the example above to have age
