    # DRESSING UP THE PAGE WITH CSS


    CSS or Cascading Style Sheets is the language used to define a web page’s appear-ance.
    In this chapter you will learn how to put that concept into practice by adding
    CSS code to basic HTML documents to manipulate page properties like color, background,
    margins, alignment, and so on.


    CSS is the abbreviation for Cascading Style Sheets with an emphasis on "Style.".
    While HTML is used to organize a web document (defining titles and paragraphs
    and embedding images, videos, and other media). CSS steps in and specifies the
    document''s'
  - '[PAGE 111]


    style - the layout, colors, and sources are all determined with CSS. Think of
    HTML as the foundation (every home has one) and CSS as the aesthetic choices (there''s
    a big difference between a mid-century modern home and a Victorian mansion).


    # How Does CSS Work?


    Cascading Style Sheets brings style to your web pages by interacting with HTML
    elements.


    Elements are the individual HTML components of a web page, such as a paragraph,
    which in HTML might look like this:


    ```

    <p>This is my paragraph!</p>

    ```


    If you want this paragraph to appear in pink and bold for people who view your
    webpage through a browser, use CSS code like this:


    ```

    p { color:pink; font-weight:bold;

    }

    ```'
  - '[PAGE 112]


    In this case, "p" (the paragraph) is called the "selector": this is the part of
    the CSS code that specifies which HTML element the CSS styling will affect. In
    CSS, the selector is written to the left of the first key. The information in
    curly braces is known as a declaration. It contains properties and values that
    are applied to the selector. Properties things like font size, color, and margins,
    while values are the settings for those properties. In the example above, "color"
    and "font-weight" are properties, and "pink" and "bold" are values. The complete
    set in parentheses:


    ```

    { color:pink; font-weight:bold; }

    ```


    is the declaration, and again, "p" (which represents the HTML paragraph) is the
    selector. The same basic principles can be applied to change the font size, the
    background color, margin indentations, etc.nFor example:


    ```

    body { background-color: light blue; would make the background of the

    ```'
