    \ `left` 属性无效。这是默认值。\n\n```css\nposition: static;\n```\n\n# relative\n\n元素根据 `top`,\
    \ `right`, `bottom`, `left` 值相对于自身移动。当 `z-index` 为自动时，此值创建一个新的上下文。\n\n```css\n\
    position: relative;\n  top: 20px;\n  left: 20px;\n}\n```\n\n# absolute\n\n元素从实际流中移除，布局中不为元素留出空间。相反，它相对于最近的定位祖先放置（如果适用），否则相对于文档主体放置。\n\
    \n```css\npositioned {\n  position: absolute;\n  top: 30px;\n  left: 30px;\n}\n\
    ```\n\n# CSS font-style\n\nCSS `font-style` 属性定义了字体是否应该使用字体族中的普通、斜体或倾斜字体。斜体通常是斜体字，使用的水平空间通常较少。相比之下，倾斜字体是常规字体的倾斜版本。\n\
    \n当指定的样式不可用时，通过人工扭曲常规字形来模拟斜体和倾斜字体（使用字符合成来控制此行为）。\n\n`font-style` 属性表示为从下方值列表中选择的单个关键字，在不对称的情况下整合一个角度。\n\
    \n# 值\n\n- Normal: 从字体族中选择分类为普通的字体。\n- Italics: 选择分类为斜体的字体。如果没有斜体版本的字体，则使用分类为倾斜的版本。如果一个都不存在，则人工模拟该样式。\n\
    - Oblique: 选择分类为倾斜的字符。如果没有倾斜版本的字体，则使用斜体版本。如果一个都不存在，则人工模拟该样式。\n- oblique <angle>:\
    \ 选择一个倾斜字符并为文本倾斜指定角度。然而，如果所选字体族中至少有一个倾斜字体，则选择最接近指定角度的一个。\n\n如果没有可用的倾斜字体，浏览器将通过按指定的量倾斜常规字体来合成一个倾斜版本。有效值是在\
    \ -90deg 到 90deg 之间的角度值。如果没有选择角度，将使用 14 度。\n\n"
