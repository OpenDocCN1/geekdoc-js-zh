    # USING BALSAMIQ TO MOCKUPS AND WIREFRAME


    Wireframing can be described as an activity to display the layout of a specific
    screen (mobile or web). As of late, there has been an expanding interest in wireframing
    the screens/pages to evaluate their adequacy.


    # Why Wireframing?


    Wireframing is necessary to save time invested in understanding a software requirement.
    As it is popularly said, a picture is worth a thousand words. Wireframing provides
    a view of any function/page requirements, effectively displaying the layout and
    elements of the screen. Ultimately, it also helps development teams move forward
    towards the common end goal.


    # Balsamiq as a Wireframing Tool


    Balsamiq is an excellent tool, meeting all the requirements of Wireframing, collaboration,
    and creativity. Its unique features allow the team member to quickly wireframe
    and get consensus on the feature to develop. This will'
  - '[PAGE 73]


    eventually align the team with the layout resources.


    It also enables collaboration between different teams so that a team member can
    collaborate with other co-located or remotely located teams. Finally, its ability
    to export wireframes to PDF/PNG formats allows flexibility when sharing wireframes.


    We now know how effective Balsamiq is at creating real-time wireframes. Suppose
    we use this time at the start of software development to define stakeholder expectations.
    In that case, there will be greater satisfaction among stakeholders, given the
