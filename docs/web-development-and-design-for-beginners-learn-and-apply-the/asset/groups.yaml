    \ 字体网页。\n\n# Javascript\n\n这是一种比 CSS 或 HTML 更复杂的语言。JavaScript 是一种逻辑编程语言，可以修改网站的内容并根据用户的操作做出不同的响应。JavaScript\
    \ 的典型用途包括复选框、行动号召（CTA）以及为现有信息添加新的标识。\n\n简而言之，JavaScript 是一种允许 Web 开发人员构建交互式网站的编程语言。因此，你在网页上看到的大多数动态行为由于\
    \ JavaScript，它增强了浏览器的控制和默认行为。\n\n# 确认框的创建\n\nJavaScript 运行的一个示例是屏幕上弹出的框。你可能多次在在线表单中输入过信息，然后弹出一个确认窗口要求你点击“确定”或“取消”以继续。这是通过\
    \ JavaScript 成为可能的：在代码中，你会发现“if ... else ...”语句，如果用户点击“确定”，它会电脑执行特定操作，如果用户点击其他（即“取消”），则执行另一个操作。\n\
