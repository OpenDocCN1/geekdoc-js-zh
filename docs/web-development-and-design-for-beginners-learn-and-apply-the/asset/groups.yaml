    with compressed gzip.


    +   gzcat filename --- lets you view a file compressed with gzip without having
    to use gunzip (as gunzip -c). You can also print it directly by making use of
    the gzcat filename.


    # Print


    +   lpr file name --- print. Make use of the -P option to specify the printer
    name if you want to use a printer other than the default. For example, if you''re
    going to print on both sides, use ''lpr -Pvalkyr -d'', or if you are in CSLI,
    you can use ''lpr -Pcord115-d''.


    +   lpq --- check the printer queue, for example, to get the number needed for
    the deletion or see how many files will print before yours comes out.


    +   lprm jobnumber --- remove something from the print queue. You can find the
    job number using lpq. In theory, you should also specify a printer name, but this
    isn''t compulsory'
  - '[PAGE 308]


    as long as you use your default printer

    in the department.


    +   genscript --- converts plain text files to

    postscript for printing and offers some

    formatting options. Consider creating

    an alias as an alias ecop'' genscript -2 -r

    \! * | lpr -h - Pvalkyr'' to print two pages

    on one sheet of paper.


    +   dvips filename --- print .dvi files (that

    is files produced by LaTeX). You can

    make use of dviselect to print only

    selected pages.


    # Directory


    Directories, like folders on a Mac, are used to

    group files in a hierarchical structure.


    +   mkdir dirname --- create a new

    directory


    +   cd dirname --- change directory.

    Basically, "go" to a different directory,

    and you will see the files in that

    directory when you do "ls." It always

    starts from your "home directory," and'
  - '[PAGE 309]


    you can go back there by typing "cd" with no arguments. ''cd ..'' will allow you
    to move up one level from your current position. You don''t have to walk step
    by step; you can make big jumps or avoid walking by specifying the path names.


    +   - **pwd** --- tells you where you are currently.


    # Find things


    +   - **ff** --- search for files anywhere on the system. This can be beneficial
    if you have forgotten which directory you put a file in but remember the name.
    If you use ff -p, you don''t need the full name, just the starting. This can also
    be beneficial for finding other things about the system, such as documentation.


    +   - **grep string filename (s)** --- search for string in files. This can be
    beneficial for many purposes, such as finding the correct file out of many, figuring
    out the correct version of something, and'
  - '[PAGE 310]


    even doing some serious corpus work.

    grep comes in multiple varieties (grep,

    egrep, and fgrep ) and has many

    flexible options.


    # About other people


    +   - **w** --- tells you who is logged in and

    what they are doing. Especially useful:

    t"inactive" part. This allows you to

    see if they are sitting there typing on

    their keyboards right now.

    - **who** --- tells you who''s online and

    where it''s from. Beneficial if you are

    looking for someone who is physically

    in the same building or some other

    particular location as you.

    - **finger username** --- gives you a lot of

    information about that user, for

    example, when they last read their mail

    and if they are logged in. People often

    put other practical information, such as

    phone numbers and addresses, in a file

    called .plan. This information is also

    displayed by "finger."'
