    something for nothing. So, unless you have the money to purchase and power your
    servers, you will likely have to pay to host your business website.


    The good news is that once the site code is stored on the host''s servers, it
    is ready to be seen by visitors!


    ## A Domain Name


    Your domain name is the address you enter into the address bar of your web browser
    to access a website. A domain name example is www.example.com. A domain name is
    exclusive to a website. In other words, two sites cannot exist with the same domain
    name. Never!!


    While you shouldn''t necessarily need a custom domain name for your website, many
    website builders offer free plans that come with a free website address. However,
    these free website addresses come in the form of a subdomain. For instance, if
    your website builder is "sample.com," your free website address might be


    http://yourname.sample.com.


    This category of web address poses many issues:


    - Your site becomes a "hostage": since you don''t own example.com, you don''t
    even have a subdomain or subfolder for that domain name. The site builder has
    the right to create, delete as many subdomains and/or subfolders as he wishes,
    with or without notice.


    - Many customers don''t want to do business with a company that doesn''t have
    its own domain name. A personalized domain name (and a personalized domain email
    address) gives you the professionalism, credibility, and confidence you and your
    business need.


    - Search engines like Google and Bing favor domain names over subdomains.


    Custom domain names aren''t free, but these days you can quickly get one for free
    from many service providers by signing up for an annual service plan.


    ## How do domain names work?


    Okay, so there is a website. It exists, in the form of HTML code, on the server
    of a host. I want to visit this site. I have a computer, and it has a web browser.


    This browser will decompress the HTML code and convert it into a glossy web page
    full of text, images, and buttons to click.


    But my browser has to find it first. Before you send a letter to my house, you
    must know where I live. That''s why I have a house address. You can include the
    address on the letter, and the postman will know precisely where to go to deliver
    it. This letter will have a return address so that I can respond to you if necessary.


    Likewise, your website needs an address. A registered designation allows users
    to request information to read HTML code stored on your servers.


    This is where domains come in. We see domains every time. www.anything.com. A
    domain is a special designation that you pay to register so that visitors can
    find you.


    A common mistake that newbies to websites make is to confuse domain name registration
    with hosting services. Part of this comes from the misconception about how information
    lives on the Internet that we just covered: the idea that information is sort
    of out there, floating just around the "web."


    Thus, the misconception is that if you purchased your domain name, then you must
    have bought that part of the web, and then you can store whatever you want there.


    But remember: the information is on the computers. If you just registered a domain
    without purchasing hosting service, you have not actually purchased any computer
    space for your website. You didn''t buy the house ... you just reserved the mailbox.


    If you register a domain and host your website on a server, a user can access
    your site! They type your domain into their browser, which sends a request to
    their server. They can then access the HTML code on the server and translate it
    into a web page that they can interact with.


    ## A Web Server


    This is the computer that receives a web page request sent by your browser.


    For example, Your company is hiring for a position that has just opened, and you
    are responsible for writing the job posting. You might have created the most engaging
    ad, but unless you post it on a job board, no one will see it.


    The same goes for websites. You can make the most fantastic website, but it is
    neither accessible nor visible on the Internet unless uploaded to a web server.


    You can surely set up your own server at home. Still, it would require a considerable
    amount of knowledge, time, and resources (e.g., internet connection and electricity).
    Paying for a web hosting service would be the most logical, economical, and practical
    thing to do. Consider this as renting server space from a web host''s server.
    For a monthly subscription, web hosts allow you to use their server space to host
    your website and, as a server, they take care of all technical aspects of server
    setup and maintenance, as well as all resources needed to run the server, so you
    don''t have to worry about anything.


    ## How It All Goes Together


    Suppose you open your web browser and enter a domain name; your browser will display
    the web pages for the domain name you entered.


    But have you ever wondered how your browser knows what information to display?
    Each website will have a web address or domain name, and each domain name is linked
    to the IP address of the web server on which it resides. IP addresses are tracked
    and managed through the DNS (domain name server).


    The work of DNS is very similar to your mobile phone''s contacts app: Open the
    Contacts application, enter the name of a person, and your mobile phone returns
    the phone number of the person and other contact information you have possibly
    seized. You can now decide whether you want to call, email, or text that person.


    When we input a domain name into our browser, it actually conducts a series of
    surveys that include finding the IP address of the domain name, finding the web
    server, acquiring the web pages from the server and translating the codes on the
    screen. Fascinating, isn''t it? And these are the basics of how websites work.


    ## How HTML, CSS, & Javascript Contributes to Web Design


    While website builders don''t need it, for many people starting a website, the
    scariest thing on the horizon is the idea that they will have to program. And
    who would blame them? There''s a reason different forms of code are called "languages"
    - to many, and it can seem as intimidating as learning a peculiar way of speaking.


    But no matter how difficult the task, it is never as difficult as it seems once
    you get immersed in it. If you''re starting out with your own website, you might
    be wondering how to get started with programming. Using templates for website
    builders can be effective, but delving into your site''s essence can help you
    make minimal changes that a template can''t provide.


    There are countless different programming languages out there, and you wouldn''t
    expect to learn them all. However, you should have three main languages on hand
    for those who want to run a website. Don''t be intimidated by this number, as
    you don''t have to be an expert on each one - it would just be nice to have some
    basic knowledge. The three best languages to learn are:


    ### HTML


    HTML is at the core of each page, paying little heed to the intricacy of a site
    or the number of advancements included. It is fundamental expertise for any web
    proficient. This is the starting point for anyone learning to create content for
    the web.


    ### How does HTML work?


    HTML stands for HyperText Markup Language. "Markup language" means that, instead
    of using a programming language to execute functions, HTML uses tags to identify
    the various types of content and objectives that serve the web page.


    Markup language uses HTML tags, also known as "elements." These tags have very
    intuitive names: header tags, paragraph tags, image tags, etc.


    Each and every web page comprises a group of these HTML tags, thus, all kinds
    of content on the page are "encapsulated," that is, surrounded by HTML tags.

