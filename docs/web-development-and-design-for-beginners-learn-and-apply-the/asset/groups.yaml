    # Discussion of ECMAScript


    ECMA stands for European Computer Manufacturers Association. ECMAScript is used
    for a scripting language. It specifies the main features that a scripting language
    should provide and how those features should be implemented. JavaScript was created
    initially in Netscape, and they wanted to standardize the language. Then, they
    submitted the language to the European Computer Manufacturers Association (ECMA)
    for standardization. But there were trademark issues with the Javascript name,
    and the standard was renamed ECMAScript, which is the name it still has today.'
