    ## Left-hand-side Expressions


    These are the values on the left resulting from an assignment operation. Remember
    to assign a value to the left operand, and the right operand must somehow resolve
    to a value.


    ```

    let sum = 20 + 30;

    sum // 50

    ```


    This assignment is a typical example of the left-hand-side expression, where the
    variable sum refers to the value returned by the numeric operation 20 + 30, returning
    the number 50 as a result.


    ## How do I recognize an expression?


    Knowing what an expression is in your code tells you essential information. It
    tells you which units of code can be assigned to a variable and/or used where
    JavaScript expects a value. In JavaScript, expressions, including variable references,
    function calls, and property accessors, can be used wherever a value is expected.
    So much that one way to check if something is an expression is to put that unit
    of code where a value is expected and check if no errors are shown.


    For example, the console.log() method prints a value to the console and returns
    undefined. That expected value can be replaced with the "unit of code" you are
    testing. If that snippet is indeed an expression, it will print the resulting
    value on the console. Otherwise, it will generate an "Uncaught SyntaxError" error.


    ```

    console.log(''Hello World!''); // prints ''Hello World!'' to the console and returns
    undefined

    ```


    Note that both Hello World and console.log() are expressions. However, the first,
    the literal Hello World! - simply evaluates and resolves a value of type string
    and is then classified as a string expression. While the other, the console.log()
    method, has a side effect (prints something on the screen) and returns the undefined
    value. Expressions that have a side effect are known as expression statements.


    I have a question, can expressions be part of the statements? Yes, they can and
    usually are. All expressions that are statements are known as expression statements.
    However, before we look at expression statements, let''s talk about JavaScript
    statements first.


    ## What are JavaScript statements?


    A statement is a line of code that orders a task. Each program consists of a sequence
    of instructions.


    This definition implies that a statement is any unit of code that expresses an
    action to be performed. Thus, just like a book has many statements to tell a story,
    each program also has a collection of statements to perform specific tasks. These
    instructions usually start with a keyword and end with a semicolon '';'' or are
    enclosed within block statements {}.


    At this point, an important distinction we can make between expressions and statements
    that expressions are evaluated against a value, while statements are executed
    to make something happen. In JavaScript, there are three ways to "make something
    happen":


    - Execute an expression that has a side effect.

    - Declare new variables or new functions.

    - Change the default execution order of the JavaScript interpreter using control
    structures, such as conditionals, loops, and jumps.


    ## Expression statements


    A common way to "make something happen" is to evaluate an expression with a side
    effect. We saw in a previous example that expressions that have side effects,
    such as assignments and some function invocations, such as console.log("Hello
    world!"), can be statements, and when they do, they are called statement expressions.


    ## Assignment


    Assignments are expressions that have the side effect of changing the value of
    a variable.


    ```

    // Example of an assignment expression.

    welcomeMessage = ''Hello'' + name;

    // Increment ''++'' and decrement ''--'' operators.

    let counter = 0;

    counter++;

    counter--;

    ```


    ## Function invocation


    Function invocations are mainly expressions, but they alter the state of a program
    or the host environment because they have side effects. They also behave like
    statements and are, therefore another type of expression statement. There is no
    point in utilizing a function with no side effects unless they are part of a broader
    expression or assignment expression. For example, it doesn''t do much to invoke
    a function and simply discard its result:


    ```

    Math.pow (x, 2);

    ```


    Better to assign it to a variable and reuse it later in the program:


    ```

    powerOfTwo = Math.pow (x, 2);

    ```


    ## Declaration Statements


    As the name already suggests, declaration statements simply define new values
    (new variables, new functions, and new classes and import or export declarations)
    and give them names.


    Variable declarations, such as var, let, and const, as well as function declarations,
    declared with the function keyword followed by its name, such as getValue as in
    the example, fall into this category. They don''t make much happen, but they give
    structure to the program and are processed even before the code starts running.


    ```

    // Examples of variable declaration

    ```


    ```

    let sum = 4 + 5 + 6;

    const sum = y + z;

    ```


    ```

    // An example of named function

    ```


    ```

    function getValue(<expression>)

    {...}

    ```


    ## Object-Oriented Programming


    For starters, we''ll give you a simplistic high-level view of what object-oriented
    programming (OOP) is. We say simplistic because OOP can get very complicated.
    Giving it a complete treatment now would probably be more confusing than helpful.
    The basic idea of OOP is that we use objects to model things in the real world
    that we want to represent within our programs and provide an easy way to access
    functionality that would otherwise be difficult or impossible to use.


    Objects can contain related code and data, representing information about what
    you are trying to model and what functionality or behavior you want it to have.
    Object data (and often functions as well) can be stored neatly (the official word
    is encapsulated) within an object package (which can be given a specific name
    to refer to, sometimes referred to as a namespace), which facilitates structure
    and access. Objects are also commonly used as data repositories that can quickly
    be sent over the network.


    ## Prototype in Javascript


    JavaScript is a dynamic language. You can bind new properties to an object at
    any time, as shown below. (Figure 6.8)


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <h1>Demo: Attach property to object</h1>

    <script>

    function Student() {

    this.name = ''John'';

    this.gender = ''M'';

    }

    var studObj1 = new Student();

    studObj1.age = 15;

    alert(studObj1.age);

    var studObj2 = new Student();

    alert(studObj2.age);

    </script>

    </body>

