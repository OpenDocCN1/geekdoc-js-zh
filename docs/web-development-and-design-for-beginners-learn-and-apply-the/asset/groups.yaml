  mdcn: "\n\n一旦标签被打开，所有后续内容都会被视为该标签的一部分，直到你“关闭”该标签为止。当一个段落结束时，我在段落上放置一个结束标签：</p>。注意，结束标签与开启标签相似，区别在于左尖角括号后有一个斜杠。这是一个示例：\n\
    \n```\n<p> This is a paragraph. < / p>\n```\n\n使用 HTML，你可以添加标题、段落、检查换行符、创建列表、高亮文本、创建特殊字符、插入图像、创建链接、创建表格、控制某些样式等。\n\
    \n# CSS\n\nCSS 代表级联样式表（Cascading Style Sheets）。这种编程语言决定了 HTML 元素在网页前端实际上应该如何显示。\n\
    \n# HTML 对比 CSS\n\nHTML 提供了构建网站内容所需的各种工具。另一方面，CSS 帮助塑造这些内容，使其以应该看到的方式呈现给用户。这些语言是分离的，以确保网站在重新格式化之前已正确创建。\n\
    \n如果说 HTML 是干墙，那么 CSS 就是墨水。\n\n虽然 HTML 可以被视为网站的基本结构，但 CSS 负责为整个网站提供样式。那些鲜艳的颜色、背景图片和酷炫的字体？全归功于\
    \ CSS。这种语言影响网页的整体感觉和基调，使其成为网页设计师需要掌握的一项强大工具和重要技能。它同样允许网站能够适应各种屏幕尺寸和种类的设备。\n\n\
    基本上，CSS 是一套规则列表，可以将各种属性分配给 HTML 标签，这些属性适用于单个或多个标签、多个文档或整个文档。它的存在是因为当开发字体和颜色等设计元素时，网页设计师难以让\
    \ HTML 适应这些新功能。\n\n那么，CSS 到底意味着什么？CSS 代表级联样式表——“样式表”指的是文档本身。所有的网络浏览器都有一个默认样式表。因此，每个网页至少受到一个样式表的影响——无论网页设计师是否应用了任何样式，网页访客浏览器使用的默认样式表。例如，假设你的浏览器默认字体是\
