  - '[PAGE 315]


    # COLLABORATE AND EXPAND

    YOUR WEB DEVELOPMENT

    RESOURCES THROUGH GIT AND

    GITHUB


    When you''ve reached a skill level that allows you to work on bigger projects
    alongside other web developers; or when your web development files have expanded
    to a point that you need a proper way to manage them, you''d need a system like
    git and a service like GitHub. These systems allow you to easily store, maintain,
    and share your resources. By the end of this chapter, you''ll be knowledgeable
    about the ins and outs of both systems and confident in their use.


    This chapter will discuss how to get started'
  - '[PAGE 316]


    with Git. We''ll start by explaining some basic information about version control
    tools, then move on to how to get Git working on your system, and finally, how
    to set it up to get started. Ending this chapter, you should understand why Git
    exists, why you should use it, and you should be good to go.


    # What is Version Control?


    Version control lets you keep track of your work and helps you easily explore
    the changes you make, be it data, coding scripts, notes, and more. You''re probably
    already doing some sort of check if you save multiple files. However, this approach
    will leave you with dozens or hundreds of similar files, making it rather complicated
    to compare different versions and not easily shared between collaborators directly.
    With version control software like Git, version control is much easier and smoother
    to implement. In addition, using an online platform like


    GitHub to save your files means you have an online backup of your work, which
    is'
