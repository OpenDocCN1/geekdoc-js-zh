    of our digital life exists in web applications. It can be easy to believe that
    information exists "on the Internet." But the problem is this: The Internet is
    not a physical place. The Internet is a system that links computers together.


    This means that if the information is not stored on your computer, it will be
    stored on another computer elsewhere.


    Therefore, your Facebook photos do not exist in a vacuum. Instead, this data resides
    on a physical computer in one or more Facebook facilities, waiting for you or
    your grandfather to access it.


    Likewise, a website does not live "on the Internet." The HTML code for all websites
    is stored somewhere on a computer, waiting for a computer with an Internet browser
