    # THE STRUCTURE OF THIS BOOK AND HOW YOU WILL LEARN


    Web Development and Design For Beginners: Learn The Basics Of HTML5, CSS3, Javascript,
    JQuery, Bootstrap, DOM, UNIX Command and GitHub - For Building Responsive Websites:


    **Chapter One:** Knowing Your Way Around Virtual Space helps you understand how
    websites work & how HTML, CSS & JavaScript contribute.


    **Chapter Two:** Responsive Design Is the Way to Go. Discovering the method of
    creating websites that can adapt seamlessly to various devices, screen sizes,
    and so on.


    **Chapter Three:** Structuring the Page with HTML. Here, you will learn the anatomy
    of HTML syntax to structure your websites; you will also understand the HTML boilerplate
    and HTML doctypes.


    **Chapter Four:** Dressing Up the Page with CSS. Introduces you to the anatomy
    of cascading style sheets syntax and structure and how to use it to style your
    website.


    **Chapter Five:** Stay Focused on Responsive Web Design and Maximize Resources
    Through Bootstrap. Learn the fundamentals of implementing responsive web design,
    using Balsamiq to mockup and wireframe websites, the fundamentals of UI design
    for websites, etc.


    **Chapter Six:** Adding Interactivity with JavaScript. Reviews the fundamentals
    of Coding starting with alerts and prompts. You will understand variables and
    data types in JavaScript.


    **Chapter Seven:** Document Object Model helps you learn the tree structure of
    HTML-based websites and teaches you how to manipulate and change the HTML elements
    using your understanding of the DOM.


    **Chapter Eight:** Streamline Website Building with JQuery. You get to learn about
    jQuery functionality, manipulating text, styles, and attributes with jQuery, creating
    animations and customizations with jQuery, etc.


    **Chapter Nine:** UNIX Commands. The Unix Command Line walks you through how the
    basic bash commands in a Unix/Linux terminal can be used.


    **Chapter Ten:** Collaborate and Expand Your Web Development Resources Through
    Git and GitHub. GitHub helps us understand how to use git for version control
    and collaboration. Git forking, branching, and cloning.


    # Your Essential Toolkits


    Web design and development tools have come a long way in just a few years. With
    these advancements, we can harness the power of highly tested libraries to improve
    our workflow and unlock more possibilities in responsive design. Also, we can
    build things together with continuously improving version control systems. From
    browser add-ons and plugins to processors that optimize your code, there have
    never been so many possibilities for creating great web applications.


    But with the number of web development tools increasing almost every day, finding
    the best software to do the job can sometimes seem daunting. So to help you get
    started, we''ve created a list of essential frontend development tools to help
    you get started.


    # 1. Visual Studio Code


    Visual Studio Code has an extremely fast source code editor, perfect for everyday
    use. With support for several languages, VS Code helps you instantly produce bracket-matching,
    syntax highlighting, auto-indentation, box selection, snippets, and more. In addition,
    intuitive keyboard shortcuts, easy customization, and community-provided keyboard
    shortcut mappings allow you to easily navigate the code.


    For serious coding, you will often benefit from tools with a greater understanding
    of the code than simple blocks of text. Visual Studio Code includes built-in support
    for IntelliSense code completion, advanced learning and navigation of semantic
    code, and code refactoring.


    # 2. Chrome Developer Tools


    Wouldn''t you be happy if you could edit your HTML and CSS on the fly or debug
    your JavaScript code while still showing complete analysis of your website''s
    performance?


    Google Chrome''s built-in developer tools allow you to do just that. Bundled and
    available in Chrome and Safari, they enable developers to access the internal
    components of their web applications. Additionally, a range of networking tools
    can help you optimize load flows, while a timeline helps you better understand
    what the browser is doing at any given time.


    # 3. jQuery


    JavaScript has long been regarded as a vital frontend language by developers.
    However, it had its own problems: loaded with browser inconsistencies, its somewhat
    complicated and inaccessible syntax meant the functionality suffered.


    That was until 2006, when jQuery, a fast, small, cross-platform JavaScript library
    designed to simplify the frontend process, entered the scene. By neglecting much
    of the functionality generally left to developers, jQuery has allowed greater
    possibilities to create animations, add plugins, or even browse documents.


    And it''s clearly a success: jQuery was by far the most popular JavaScript library
    in 2015, installing 65% of the 10 million most visited sites on the web.


    # 4. GitHub


    It''s any developer''s nightmare - wait, no, it''s any developer''s dream. GitHub
