    # HTML Layout Using Tables


    The easiest and most common way to create layouts is to use the HTML <table> tag.
    These tables are organized in columns and rows, so you can use these rows and
    columns as you see fit.


    For example, the following HTML layout example is achieved using a table with
    3 rows and 2 columns, but the header and footer column spans both columns to using
    the colspan attribute (Figure 3.7):


    ```

    <!DOCTYPE html>

