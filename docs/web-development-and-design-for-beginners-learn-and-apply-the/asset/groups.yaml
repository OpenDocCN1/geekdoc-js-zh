    不劳而获。所以，除非你有资金来购买并运行自己的服务器，否则你可能需要付费来托管你的业务网站。


    好消息是，一旦网站代码存储在托管主的服务器上，它就可以供访问者查看了！


    ## 域名


    域名是你在网页浏览器地址栏中输入的、用于访问网站的地址。域名的示例是 www.example.com。域名对于网站来说是独有的。换句话说，两个网站不能拥有相同的域名。绝不可能！！


    虽然你的网站并不一定需要自定义域名，但许多网站构建器都提供附带免费网站地址的免费计划。然而，这些免费网站地址是以子域名的形式存在的。例如，如果你的网站构建器是“sample.com”，你的免费网站地址可能是：


    http://yourname.sample.com。


    这种类型的网页地址存在许多问题：


    - 你的网站会变成“人质”：因为你并不拥有 example.com，所以你甚至没有该域名的子域名或子文件夹。网站构建器有权根据意愿创建或删除任意子域名和/或子文件夹，无论是否通知。


    - 许多客户不想与一家没有自己域名的公司做生意。个性化的域名（以及个性化的域名邮箱地址）可以带给你和你你的业务所需的专业性、信誉和信心。


    -像 Google 和 Bing 等搜索引擎更青睐域名而非子域名。


    自定义域名不是免费的，但现在你通过向许多服务提供商注册年度服务计划，可以从那里快速免费获得一个。


    ## 域名是如何工作的？


    好了，假设有一个网站。它以 HTML 代码的形式存在于托管主的服务器上。我想访问这个网站。我有一台电脑，电脑上有一个网页浏览器。


    这个浏览器会解压 HTML 代码并将其转换为一个充满文本、图像和可点击按钮的精美网页。


    但我的浏览器必须先找到它。在你向我的家里寄信之前，你必须先知道我住在哪里。这就是为什么我有一个家庭地址。你可以把地址写在信上，邮递员就会确切知道去哪里投递。这封信将有一个回信地址，以便我在必要时回复你。


    同样地，你的网站也需要一个地址。注册的标识允许用户请求信息以读取存储在你的服务器上的 HTML 代码。


    这就是域名大显身场的地方。我们经常看到域名。www.anything.com。域名是一种特殊的标识，你通过付费注册它，以便访问者可以找到你。


    网站新手经常犯的一个常见错误是将域名注册与托管服务混淆。这部分源于对我们刚刚涵盖的关于信息在互联网上如何存在的误解：认为信息似乎是存在于某处，漂浮在“网络”周围。


    因此，这种误解是，如果你购买了域名，你就一定购买了网络的那个部分，然后你可以在那里存储任何想要的内容。


    但请记住：信息是在计算机器的。如果你只注册了域名而没有购买托管服务，你并没有为你的网站购买任何计算机空间。你没有买房子……你只是预留了邮箱。


    如果你注册了域名并在服务器上托管你的网站，用户就可以访问你的网站！他们在浏览器中输入你的域名，浏览器会向他们的服务器发送请求。然后他们就可以访问服务器上的
    HTML 代码，并将其转换为他们可以交互的网页。


    ## Web 服务器


    这是接收由你的浏览器发送的网页请求的计算机。


    例如，你的公司正在招聘一个新开放的职位，由你负责编写招聘公告。你可能创建了最有吸引力的广告，但除非将其发布在招聘板上，否则没人会看到它。


    网站也是如此。你可以制作最精彩的网站，但除非将其上传到 Web 服务器，否则它在互联网上既无法访问也无法可见。


    你当然可以在家里搭建自己的服务器。尽管如此，这仍然需要大量的知识、时间和资源（例如，网络连接和电力）。支付 Web 托管服务的费用将是最符合逻辑、最经济且实用的方法。将此考虑为从
    Web 托管主的服务器上租用服务器空间。通过每月订阅，Web 托管商允许你使用他们的服务器空间来托管你的网站，并且作为服务器，他们会负责服务器设置和维护的所有技术方面，以及运行服务器所需的所有资源，因此你不需要担心任何事情。


    ## 它们是如何整合在一起的


    假设你打开网页浏览器并输入一个域名；你的浏览器将显示你输入的域名的网页。


    但你是否想过你的浏览器是如何知道要显示哪些信息的？每个网站都将有一个网页地址或域名，而每个域名都链接到其所处的 Web 服务器的 IP 地址。IP 地址通过
    DNS（域名服务器）进行跟踪和管理。


    DNS 的工作与你手机上的联系人应用非常相似：打开联系人应用，输入一个人的名字，你的手机就会返回该人的电话号码以及你可能保存的其他联系信息。你现在可以决定是否要给那个人拨打电话、发送电子邮件或发送短信。


    当我们把域名输入浏览器时，它实际上执行了一系列调查，包括查找域名的 IP 地址、查找 Web 服务器、从服务器获取网页以及翻译屏幕上的代码。非常有趣，不是吗？这些都是网站运作的基本原理。


    ## HTML、CSS 和 Javascript 如何贡献于网页设计


    虽然网站构建器不需要这些，但对于许多开始网站的人来说，未来最令他们感到恐惧的是必须编程。

