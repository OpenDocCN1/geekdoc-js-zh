    !true // false

    false && ''Heya'' // false

    ```


    注意，`&&` 不需要其操作数为布尔值，因为所有的 JavaScript 值不是真即假。因此，产生假值的操作（false、null、undefined、0、-0、NaN
    和 ""）返回 `false`。相比之下，所有其他值以及所有对象都是 `true`，并被求值为 `true`。


    ## 左侧表达式


    这些是赋值操作产生的左侧值。记住给左操作数赋值一个值，并且右操作数必须以某种方式解析为一个值。


    ```

    let sum = 20 + 30;

    sum // 50

    ```


    此赋值是左侧表达式的典型示例，其中变量 `sum` 指向数值运算 `20 + 30` 返回的值，结果返回数字 `50`。


    ## 如何识别表达式？


    了解代码中什么是表达式可以让你获得至关重要的信息。它告诉你哪些代码单元可以赋值给变量，并/或用在 JavaScript 期望需要值的地方。在 JavaScript
    中，表达式（包括变量引用、函数调用和属性访问器）可以用任何任何需要值的地方。检查某个内容是否为表达式的一种方法是将该代码单元放置在期望值的地方，并检查是否显示任何错误。


    例如，`console.log()` 方法向控制台打印一个值并返回 `undefined`。这个预期的值可以被你正在测试的“代码单元”替换。如果该片段确实是一个表达式，它将在控制台上打印出结果值。否则，它将生成一个“Uncaught
    SyntaxError”错误。


    ```

    console.log(''Hello World!''); // 向控制台打印 ''Hello World!'' 并返回 undefined

    ```


    注意，`Hello World` 和 `console.log()` 都是表达式。然而，第一个，即字面量 `Hello World!` —— 仅仅求值并解析出一个字符串类型的值，然后被分类为字符串表达式。而后者，即
    `console.log()` 方法，具有副作用（在屏幕上打印某些内容）并返回 `undefined` 值。具有副作用的表达式被称为**表达式语句**。


    我有一个问题，表达式可以是语句的一部分吗？是的，它们可以，而且通常也是。所有作为语句的表达式被称为表达式语句。但在我们查看表达式语句之前，让我们先讨论 JavaScript
    语句。


    ## 什么是 JavaScript 语句？


    语句是排序任务的代码行。每个程序都由指令序列组成。


    这个定义意味着语句是任何表示要执行的操作的代码单元。因此，就像一本书有很多语句来讲述故事一样，每个程序也有一组语句来执行特定任务。这些指令通常以关键字开头，以分号
    `;` 结束，或者包含在块语句 `{}` 中。


    此时，我们可以在表达式和语句之间做出一个重要的区分：表达式是针对值进行求值的，而语句是执行以发生某些事的。在 JavaScript 中，有三种方法“发生某事”：


    - 执行具有副作用的表达式。

    - 声明新变量或新函数。

    - 使用控制结构（如条件判断、循环和跳转）改变 JavaScript 解释器的默认执行顺序。


    ## 表达式语句


    “发生某事”的一种常见方法是求值具有副作用的表达式。我们在之前的示例中看到，具有副作用的表达式（如赋值和某些函数调用，如 `console.log("Hello
    world!")`）可以是语句，当它们成为语句时，被称为语句表达式。


    ## 赋值


    赋值是具有改变变量值副作用的表达式。


    ```

    // 赋值表达式的示例。

    welcomeMessage = ''Hello'' + name;

    // 递增 ''++'' 和递减 ''--'' 运算符。

    let counter = 0;

    counter++;

    counter--;

    ```


    ## 函数调用


    函数调用主要是表达式，但由于它们具有副作用，它们会改变程序或主机环境的状态。它们的行为也像语句，因此是另一种类型的表达式语句。使用没有副作用的函数没有意义，除非它们是更广泛的表达式或赋值表达式的一部分。例如，调用一个函数并简单丢弃其结果意义不大：


    ```

    Math.pow (x, 2);

    ```


    更好的做法将其赋值给变量并在程序稍后复用它：


    ```

    powerOfTwo = Math.pow (x, 2);

    ```


    ## 声明语句


    正如名称所示，声明语句仅仅是定义新值（新变量、新函数以及新类和导入或导出声明）并为其命名。


    变量声明（如 `var`、`let` 和 `const`）以及用 `function` 关键字后跟名称函数声明（例如示例中的 `getValue`）属于这一类。它们没有发生太多事情，但它们为程序提供了结构，并在代码运行之前就已经被处理了。


    ```

    // 变量声明示例

    ```


    ```

    let sum = 4 + 5 + 6;

    const sum = y + z;

    ```


    ```

    // 命名函数示例

    ```


    ```

    function getValue(<expression>)

    {...}

    ```


    ## 面向对象编程


    首先，为你提供一个关于面向对象编程（OOP）的简单高层视角。我们说简单是因为 OOP 可以变得非常复杂。现在对其进行完全处理可能会比帮助更有困惑。OOP 的基本思想是使用对象来建模我们想要在程序中表示的现实世界事物，并提供一种简单的方法来访问那些原本难以或无法使用的功能。


    对象可以包含相关的代码和数据，代表你正尝试建模的信息以及你希望它具有的功能或行为。对象数据（通常也包括函数）可以整齐地存储（官方术语是**封装**）在对象包内部（可以给出一个特定的名称来引用，有时称为命名空间），这有利于结构化和访问。对象还经常用作数据存储库，可以快速发送到网络上。


    ## JavaScript 中的原型


    JavaScript 是一种动态语言。你可以随时向对象绑定新属性，如下所示。（图 6.8）


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <h1>Demo: 将属性绑定到对象</h1>

    <script>

    function Student() {

    this.name = ''John'';

    this.gender = ''M'';

    }

    var studObj1 = new Student();

    studObj1.age = 15;

    alert(studObj1.age);

    var studObj2 = new Student();

    alert(studObj2.age);

    </script>

    </body>

    </html>

    ```


    此页面显示：


    15


    ![15](img/6dfe767126857d06703e3f536f3e6c_223_0.png)


    如上面的示例所示，age 属性链接到 `studObj1` 实例。然而，`studObj2` 实例没有 age 属性，因为它只定义在 `studObj1`
    实例上。


    因此，假设我们想在后期阶段为特定函数添加新属性以便跨所有实例共享，我们应该做什么？


    答案是**原型**。原型是 JavaScript 中默认与所有函数和对象关联的对象，其中函数的原型属性是可以访问且可编辑的，而对象的原型属性（称为属性）是不可见的。


    每个函数默认包含一个原型对象。


    原型对象是一个特殊的枚举对象，关联了额外的属性，这些属性将在所有实例之间共享。


    然后，使用示例函数的原型属性让所有对象具有 age 属性，如下。（图 6.9）


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <h1>Demo: 原型</h1>

    <script>

    function Student() {

    this.name = ''John'';

    this.gender = ''M'';

    }

    Student.prototype.age = 15;

    var studObj1 = new Student();

    alert(studObj1.age);

    var studObj2 = new Student();

    alert(studObj2.age);

    </script>

    </body>

    </html>

    ```

