    However, before we look at expression statements, let''s talk about JavaScript
    statements first.


    # What are JavaScript statements?'
  - '[PAGE 217]


    A statement is a line of code that orders a task. Each program consists of a sequence
    of instructions.


    This definition implies that a statement is any unit of code that expresses an
    action to be performed. Thus, just like a book has many statements to tell a story,
    each program also has a collection of statements to perform specific tasks. These
    instructions usually start with a keyword and end with a semicolon '';'' or are
    enclosed within block statements {}.


    At this point, an important distinction we can make between expressions and statements
    that expressions are evaluated against a value, while statements are executed
    to make something happen. In JavaScript, there are three ways to "make something
    happen":


    +   - Execute an expression that has a side effect.


    +   - Declare new variables or new functions.


    +   - Change the default execution order of the JavaScript interpreter using control'
  - '[PAGE 218]


    structures, such as conditionals, loops, and jumps.


    # Expression statements


    A common way to "make something happen" is to evaluate an expression with a side
    effect. We saw in a previous example that expressions that have side effects,
    such as assignments and some function invocations, such as console.log("Hello
    world!"), can be statements, and when they do, theye are called statement expressions.


    # Assignment


    Assignments are expressions that have the side effect of changing the value of
    a variable.


    ```

    // Example of an assignment expression.

    welcomeMessage = ''Hello'' + name;

    // Increment ''++'' and decrement ''--'' operators.

    let counter = 0;

    counter++;

    counter--;

    ```'
