- md: "\n# DOM Interfaces\n\nThis is about real things and objects that you can use\
    \ to manipulate the DOM hierarchy. There are many places where understanding how\
    \ this works can be confusing. For instance, the object representing the HTML\
    \ form element acquires its name property from the HTMLFormElement interface but\
    \ its className property from the interface's HTMLElement. In both cases, the\
    \ desired property is on that form object.\n\nBut the relationship between the\
    \ objects and the interfaces they implement in the DOM can be confusing, so this\
    \ section tries to say something about the actual interfaces in the DOM specification\
    \ and how they are available.\n\n## Interfaces and objects\n\nMany objects borrow\
    \ from different interfaces. For example, the table object implements a specialized\
    \ HTMLTableElement interface, including createCaption and insertRow.\n\nLastly,\
    \ since an HTML element is also, as far as the DOM is concerned, a node within\
    \ the tree of nodes that comprises the object model for an HTML or XML page, the\
    \ table object also implements the most basic Node interface, from which element\
    \ derives from it.\n\nWhen you refer to a table object, as in the following example,\
    \ you often use these three interfaces interchangeably on the object, perhaps\
    \ without knowing it.\n\n```javascript\nconst table = document.getElementById(\"\
    table\");\nconst tableAttrs = table.attributes; // Node/Element\nfor (let i =\
    \ 0; i < tableAttrs.length; i++) {\n  // HTMLTableElement interface: border attribute\n\
    \  if(tableAttrs[i].nodeName.toLowerCase() == \"border\") {\n    table.border\
    \ = \"1\";\n  }\n  // HTMLTableElement interface: summary attribute\n  table.summary\
    \ = \"note: increased border\";\n}\n```\n\n## Main interfaces in the DOM\n\nThis\
    \ section shows some of the most commonly used interfaces in the DOM. The concept\
    \ is not to describe what these APIs do here but to give you an idea of the methods\
    \ and properties you will frequently see when using the DOM.\n\nWindow and document\
    \ objects are the objects whose interfaces are generally used most frequently\
    \ in DOM programming. In simple words, the window object represents something\
    \ like the browser, and the document object is the root of the document itself.\
    \ The element inherits from the node's generic interface, and together these two\
    \ interfaces offer many of the properties and methods you use on individual elements.\n\
    \nThese elements can also have specific interfaces to handle the type of data\
    \ they contain, as shown in the table object example in the previous section.\n\
    \nBelow is a short list of common XML APIs and web page scripts that use the DOM.\n\
    \n- document.querySelectorAll(name)\n- document.querySelector(selector)\n- document.createElement(name)\n\
    - element.innerHTML\n- parentNode.appendChild(node)\n- element.style.left\n- element.getAttribute()\n\
    - element.setAttribute()\n- element.addEventListener()\n- GlobalEventHandlers/onload\n\
    - window.content\n- window.scrollTo()\n\n## Testing the DOM API\n\nThis document\
    \ provides examples for each interface you can use in your web development. In\
    \ some cases, samples are complete HTML pages with the DOM access in a <script>,\
    \ the interface (e.g., buttons) required to run the script in a form, and HTML\
    \ elements on which also operate the DOM. In this case, you can cut and paste\
    \ the example into a new HTML document, save it, and run the example from your\
    \ browser.\n\nHowever, there are some cases where the examples are more concise.\
    \ For example, to run models that demonstrate only the interface's fundamental\
    \ relationship with HTML elements, you may want to create a test page where you\
    \ can easily access the interfaces from scripts. The following very simple webpage\
    \ provides a <script> element in the header. You can insert functions that test\
    \ the interface, some HTML elements with attributes that you can retrieve, configure\
    \ or manipulate, and the web UI needed to invoke them—functions from the browser.\n\
    \nYou can make use of this test page or create a new one to test the DOM interfaces\
    \ you are attracted to and see how they work on the browser platform. You can\
    \ update the content of the test function () as needed, create more buttons, or\
    \ add items as needed.\n\n```html\n<html>\n<head>\n  <title>DOM Tests</title>\n\
    \  <script>\n    function setBodyAttr(attr, value) {\n      if (document.body)\
    \ {\n        document.body[attr] = value;\n      } else {\n        throw new Error(\"\
    no support\");\n      }\n    }\n  </script>\n</head>\n<body>\n  <div style=\"\
    margin: .5in; height: 400px;\">\n    <form>\n      <p><b>text</b></p>\n      <select\
    \ onChange=\"setBodyAttr('text', this.value)\">\n        <option value=\"black\"\
    >black</option>\n        <option value=\"red\">red</option>\n        <option value=\"\
    white\">white</option>\n        <option value=\"gray\">gray</option>\n       \
    \ <option value=\"blue\">blue</option>\n        <option value=\"green\">green</option>\n\
    \      </select>\n      <input type=\"button\" value=\"version\" onclick=\"setBodyAttr('link',\
    \ this.value)\" />\n    </form>\n  </div>\n</body>\n</html>\n```\n\nTo test many\
    \ interfaces on a single page, such as properties that affect the web page, you\
    \ can create a similar test page with buttons, text fields, and other HTML elements.\
    \ In the above example, drop-down menus dynamically update the DOM-accessible\
    \ aspects of the web page, such as the background color (bgColor), the hyperlink\
    \ (link), and the text color (text). Thus, regardless of how you design your pages,\
    \ testing interfaces as you read them is significant for learning how to use the\
    \ DOM effectively.\n\n## JavaScript DOM - Changing HTML\n\nThe HTML DOM allows\
    \ JavaScript to modify the content of HTML.\n\n### Modifying HTML content\n\n\
    The simplest way to change the content of an HTML element is to use the innerHTML\
    \ property. To edit an HTML element content, use this syntax:\n\n```javascript\n\
    document.getElementById(id).innerHTML = new HTML\n```\n\nThis example changes\
    \ the contents of a <p> element:\n\n```html\n<html>\n<body>\n  <p id=\"p1\">Hello\
    \ World!</p>\n  <script>\n    document.getElementById(\"p1\").innerHTML = \"New\
    \ text!\";\n  </script>\n</body>\n</html>\n```\n\n### JavaScript can Change HTML\n\
    \nNew text! The paragraph above was changed by a script.\n\nExplanations (Figure\
    \ 7.3):\n- The HTML document in this example above contains a <p> element with\
    \ id = \"p1\"\n- We make use of the HTML DOM to get the element with id = \"p1\"\
    \n- A JavaScript alters the content (innerHTML) of that element to \"New text!\"\
    \n\nThis example changes the contents of an <h1> element:\n\n```html\n<html>\n\
    <body>\n  <h1 id=\"id01\">Old Heading</h1>\n  <script>\n    const element = document.getElementById(\"\
    id01\");\n    element.innerHTML = \"New Heading\";\n  </script>\n</body>\n</html>\n\
    ```\n\n### New Heading\n\nExplanations (Figure 7.4):\n- The above HTML document\
    \ contains an <h1> element with id = \"id01\"\n- We make use of the HTML DOM to\
    \ acquire the element with id = \"id01\"\n- A JavaScript modifies the content\
    \ (innerHTML) of that element to \"New title.\"\n\n### Modifying the Value of\
    \ an Attribute\n\nTo modify the value of an HTML attribute, use this syntax:\n\
    \n```javascript\ndocument.getElementById(id).attribute = new value\n```\n\nThe\
    \ example below changes the src attribute of an <img> element:\n\n```html\n<html>\n\
    <body>\n  <img id=\"myImage\" src=\"smiley.gif\">\n  <script>\n    document.getElementById(\"\
    myImage\").src = \"landscape.jpg\";\n  </script>\n</body>\n</html>\n```\n\n###\
    \ JavaScript HTML DOM\n\nThe original image was smiley.gif, but the script changed\
    \ it to landscape.jpg.\n\nExplanations (Figure 7.5):\n- The HTML document above\
    \ has an <img> element with id = \"myImage\"\n- We make use of the HTML DOM to\
    \ acquire the element with id =\n"
  mdcn: "\n\n# DOM 接口\n\n这些是关于你可以用于操作 DOM 层次结构的真实实体和对象。在许多地方，理解其工作原理可能会令人困惑。例如，代表\
    \ HTML 表单元素的对象从 `HTMLFormElement` 接口获取其 `name` 属性，但从该接口的父类 `HTMLElement` 获取其 `className`\
    \ 属性。在这两种情况下，所需的属性都存在于该表单对象。\n\n但 DOM 中对象与它们实现的接口之间的关系可能会令人困惑，因此本节将尝试介绍 DOM 规范中的实际接口以及它们是如何提供的。\n\
    \n## 接口与对象\n\n许多对象借用了不同的接口。例如，表格（table）对象实现了一个特殊的 `HTMLTableElement` 接口，包括 `createCaption`\
    \ 和 `insertRow`。\n\n最后，由于从 DOM 的角度来看，HTML 元素也是构成 HTML 或 XML 页面对象模型的节点树中的一个节点，因此表格对象还实现了最基本的\
    \ `Node` 接口，元素（element）正是派生自此。\n\n当你引用表格对象时（如下例所示），你通常会在该对象上互交替使用这三个接口，可能你并没有意识到这一点。\n\
