    # Anatomy of CSS Syntax and Structure


    So, in the previous chapter, we already got a taste of how easy it is to style
    an HTML element using CSS. So, why did it look the way it is? Here, we''ll explain
    the anatomy and syntax of CSS to better understand how it works. Let''s take a
    look at these CSS code examples that target H1 elements:


    ```

    h1 {

    color: Blue;

    }

    ```


    This is a selector with a property and a value - these are the main concepts of
    CSS, and you should try to remember their names as you go through this section.
    So in this example, h1 is the name of the selector, color is the property, and
    Blue is the value.


    Among these three concepts, you can see a'
  - '[PAGE 114]


    variety of special characters. There are braces around the property and the value,
    there is a colon separating the property from the value, and there is the semicolon
    after the value. Each makes makes it easier for the browser to analyze and understand
    your CSS code:


    +   - The brackets allow you to group different properties in the same rule (selector).

    - The colon tells the parser where the property ends and the value begins.

    - The semicolon tells the parser where the value ends.


    # How to use CSS Selectors


    A selector is simply the item to apply the style. But as you continue to write
    more CSS code, you''ll find that selectors aren''t just elements. Instead, these
    can be attributes, pseudo-classes, identifiers, classes, and descendants.


    CSS selectors select elements on an HTML page that match the patterns described
    in a'
