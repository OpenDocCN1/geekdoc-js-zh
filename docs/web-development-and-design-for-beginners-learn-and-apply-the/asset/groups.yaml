    \ `<span>` 元素的样式：\n\n```html\n<span style=\"background-color:red;\">我是一个元素。</span>\n\
    <span style=\"background-color:blue;\">我是第二个元素。</span>\n<span style=\"background-color:green;\"\
    >我是第三个元素。</span>\n<span>我们都在同一行内！</span>\n```\n\n通过配置 `display:inline`，也可以将块级元素显示在同一行内。此示例覆盖了默认的\
    \ `<li>` 标签设置，并将它们显示在单行内：（图 4.3）\n\n```css\nli {\n  display: inline;\n}\n```\n\
    \n对此 `<span>` 元素也发生了相同的默认设置覆盖：\n\n```css\nspan {\n  display: block;\n}\n```\n\n\
    ![](img/6dfe767126857d06708c3e3f536f3e6c_138_0.png)\n\n# block\n\n以下是块元素的特征：\n\
    \n- 元素占据最大的宽度。\n- 每个块元素都出现在新行上。\n- 元素对宽度和高度属性有响应。\n- 元素可以同时包含行内元素和块级元素。\n\n```html\n\
    <div style=\"background-color: red;\">我是一个元素。</div>\n<div style=\"background-color:\
