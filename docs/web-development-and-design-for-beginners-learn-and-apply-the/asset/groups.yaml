    # Function invocation


    Function invocations are mainly expressions, but they alter the state of a program
    or the host environment because they have side effects. They also behave like
    statements and are, therefore another type of expression statement. There is no
    point in utilizing a function with no side effects unless they are part of a broader
    expression or assignment expression. For example, it doesn''t do much to invoke
    a function and simply discard its result:


    ```

    Math.pow ( x, 2);

    ```


    Better to assign it to a variable and reuse it later in the program:


    ```

    powerOfTwo = Math.pow ( x, 2);

    ```'
