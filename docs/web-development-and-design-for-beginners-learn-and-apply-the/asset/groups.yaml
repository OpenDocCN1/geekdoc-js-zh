  mdcn: '

    然而，在我们开始之前，让我们快速了解一下 Web 设计与开发之间的区别。


    ## Web 设计意味着什么？


    Web 设计是指在互联网上显示的网站的设计。它指的是网站设计的视觉感受或布局和外观。外观指的是网站上的颜色、字体和图像。布局指的是信息是如何被结构化和分类的。设计网站的两种常用方法是自适应的：首先，内容是固定的且具有响应式的；其次，内容根据屏幕的大小动态移动。


    ## 什么是 Web 开发？


    打开 Google Chrome，输入“如何成为一名 Web 开发人员”并按回车；在几分之一钟内就会显示出数千条结果。是什么让这一切成为可能？网站开发！


    Web 开发通常指的是与为内网或互联网提供托管的网站进行创建、构建和维护相关的活动。它涉及 Web 设计、Web 编程、Web 发布和数据库管理等方面。


    为了总结它们的区别，让我们来看看 Web设计师和 Web 开发人员的角色。


    - Web 设计师使用 Photoshop、Illustrator、Sketch、Experience Design 等软件工具来设计一个包含所有基本信息且易于导航和使用的网站。相反，Web
    开发人员使用 HTML、JavaScript、PHP 等编程语言将这些项目转换为运行的网站。

    - 在上面的 Google 首页示例中，当你将光标悬停在麦克风符号上，会出现一个显示“通过语音搜索”的对话框。点击它会显示“现在说话”的消息。在整个过程中，显示消息、颜色、字体、对齐方式以及文本、搜索栏和麦克风大小的决定构成了
    Web 设计。同时，编程使 Web 设计得以实现。用户可以看到文本并点击构成 Web 开发的图标。


    ## 网页是如何运作的


    每个人都知道什么是网站。我们点击蓝色的小字，搜索 Google 东西，输入 www-something-or-other，然后我们就在看狗的照片了。网站就是这样工作的，不是吗？


    考虑到这是我们几乎所有人每天都会使用的东西，互联网对我们许多人来说仍然是一个谜团。好消息是：你不需要成为专业的 Web 开发人员就能理解网站是如何运作的。无论你的技术水平或经验水平如何，如果你是
    Web 设计的新手，你就需要知道网站是如何运行的。


    在你开始构建网站并将其发布到互联网之前，了解网站的工作原理至关重要。


    这里是一些帮助你入门的基础术语：


    - **网站**仅仅是 Web 代码页的集合——这些代码描述了页面的布局、格式和内容。

    - **Web 服务器**是连接到互联网的计算机，接收由浏览器发送的 Web 页面请求。

    - **浏览器**通过 IP 将你的地址连接到服务器。IP 地址是通过翻译域名获取的。（别担心，你的浏览器会自动完成这部分，所以你不需要自己查找 IP 地址。）


    换句话说，要在互联网上查看你的网站，需要以下内容：网站、你的域名和服务器。


    ## 网站


    网站是一组 Web 页面、图像和其他元素，它们被链接在一起，形成一个更大、更有结构化的文档。例如，如果一个网站是一本书，那么每一页就是一个 Web 页面。


    网站有时由单页或几千页页面组成。每个页面都将有自己的图像、文本和其他元素。所有 Web 页面和项目都放置在一个文件夹中，并存储在主机的服务器上。


    每个 Web 页面都是用代码编写的，这些代码描述了页面的布局、格式和内容。构建 Web 页面最常用且最广泛的语言是 HTML。


    Web 页是在互联网上显示信息的一种。它由文本、图像、链接、视频或按钮等元素组成。


    页面中包含的信息按信息层次进行组织，允许从一个页面导航到另一个页面。这些相关 Web 页面的通集就是网站。


    网站不是应用程序。它不是搜索引擎。（尽管网站可以包含这些元素。）网站在本质上只是公开收集和显示信息的方式。无论网站有多复杂，这一切都归于这个主要目标。


    ## 网站是如何运作的？


    ## 网站存储在哪里？什么是 Web 托管？


    所有数据必须存储在某处。我们的数字生活大部分存在于 Web 应用程序中。很容易认为信息存在于“互联网上”。但问题在于：互联网并不是一个物理场所。互联网是一个连接计算机的系统。


    这意味着如果信息没有存储在你的计算机上，它就会存储在其他地方另一台计算机上。


    因此，你的 Facebook 照片并不是存在于真空中的。相反，这些数据存储在一个或多个设施的物理计算机上，等待你或你的祖父访问它们。


    同样，网站并不生活在“互联网上”。所有网站的 HTML 代码存储在某处的计算机上，等待带有互联网浏览器的计算机访问这些信息。


    '
