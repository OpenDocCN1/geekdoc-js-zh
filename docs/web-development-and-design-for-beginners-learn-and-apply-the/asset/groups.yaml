    # Types of UNIX


    There are many multiple versions of UNIX, although they all share common similarities.
    The most popularly used varieties of UNIX are MacOS X, Sun Solaris, and GNU/Linux.


    # The UNIX OS


    The UNIX OS consists of three parts; the kernel, shell, and programs.


    # kernel


    The UNIX kernel is the heart of the operating'
