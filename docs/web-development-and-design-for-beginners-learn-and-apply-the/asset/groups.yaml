    So, you can make use of any scripting language that implements the ECMA standards
    as web browsers support the interpretation of ECMAScript when you specify (<script
    type="ecmascript">).


    ECMAScript is object-oriented and is conceived as a central language to which
    objects from any specific domain or context can be added, like the idea of a "document."
    For example, the World Wide Web Document Object Model. ECMAScript, together with
    the document object model, closely matches the current implementations of JavaScript
    and JScript. While it is likely to be used primarily as a standard scripting language
    for the World Wide Web (WWW), ECMAScript could also be used for any scripted application.


