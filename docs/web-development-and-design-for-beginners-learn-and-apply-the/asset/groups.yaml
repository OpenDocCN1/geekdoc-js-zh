    # JavaScript 中的变量和数据类型


    # 什么是变量？


    变量是所有编程语言的基础。变量用于存储数据，例如字符串、数字等。变量的数据可以被配置、更新和检索。通常，变量是值的符号。


    你可以使用 `var` 关键字来决定变量，而赋值运算符 (=) 用于给变量赋值。


    示例


    ```javascript

    var name = "James ";

    var age = 40;

    var isLoggedIn = true;

    ```


    提示：始终为变量起有意义的名字。驼峰命名法常用于包含多个单词的变量。在上面的示例中，创建了三个变量，第一个被赋值为字符串，第二个被赋值为数字，最后一个被赋值为布尔值。


    在 JavaScript 中，变量可以在没有显式初始值的情况下声明。这对于包含用户输入的变量很有用。


    示例


    ```

    // 如何声明变量

    var userName;

    userName = "Clark";

    ```


    # 同时声明多个变量


    此外，你也可以在一个声明中声明多个变量并设置它们的初始值。变量之间用逗号分隔，如下：


    ```javascript

    // 声明多个变量

    var name = "James", age = 40, isMarried = false;

    ```


    # JavaScript 变量命名规范


    以下是命名规则：


    - 变量名不能以数字开头。

    - 变量名必须以字母、下划线 (_) 或美元符号 ($) 开头。

    - 变量名只能包含字母 (A-z, 0-9) 和下划线。

    - 变量名不能是 JavaScript 关键字或保留字。

    - 变量名不能包含空格。


    # let 和 const 关键字


    ES6 引入了两个关键字 `let` 和 `const` 来声明变量。`const` 关键字的工作方式与 `let` 完全相同，区别在于使用 `const`
    声明的变量不能被重新赋值。这是一个示例：


    ```

    // 声明变量

    let name = "Harry Potter";

    let age = 11;

    let isStudent = true;

    // 声明常量

    const PI = 3.14;

    console.log(PI); // 3.14

    // 尝试赋值

    PI = 10; // error

    ```


    与声明函数作用域的 `var` 不同，`let` 和 `const` 声明块作用域变量 ({})。块作用域意味着在大括号之间创建一个范围。


    数据类型指定程序中可以存储和处理的数据类型。六种基础 JavaScript 数据类型分为三大类：原始（基本）、复合（引用）和唯一类型。Number、String
    和 Boolean 是原始类型。Array、object 和 function（都是对象类型）是复合类型。


    相比之下，Undefined 和 Null 是唯一类型。


    # 字符串


    字符串数据类型用于表示文本。JavaScript 中的字符串是被单引号 ('''')、双引号 (") 或反引号 (`) 包裹的字符序列。


    ```javascript

    let greeting = "Hello";

    let name = ''World'';

    let message = `${greeting}, ${name}`;

    ```


    字符串可以使用 `+` 运算符或模板字符串进行拼接。


    ```javascript

    let fullName = "John" + " " + "Doe";

    let message = `Hello ${fullName}`;

    ```


    字符串还有用于处理的内置方法：


    ```javascript

    let text = "JavaScript is Fun";

    console.log(text.toUpperCase()); // "JAVASCRIPT IS FUN"

    console.log(text.toLowerCase()); // "javascript is fun"

    console.log(text.length); // 16

    console.log(text.slice(0, 4)); // "Java"

    ```


    # Number 类型


    Number 类型表示数值，包括整数和浮点数。JavaScript 没有单独整数类型；所有数字都是 64 位二进制浮点数。


    ```javascript

    let count = 42;

    let price = 3.14;

    ```


    你可以对数字进行算术运算：


    ```javascript

    let sum = 10 + 5; // 15

    let difference = 10 - 5; // 5

    let product = 10 * 5; // 50

    let quotient = 10 / 5; // 2

    let exponent = 10 ** 2; // 100

    let remainder = 10 % 3; // 1

    ```


    JavaScript 还有特殊的数值值：


    - Infinity：除以零的结果。

    - -Infinity：负数除以零的结果。

    - NaN (Not-a-Number)：无效数学运算的结果。


    ```javascript

    let x = 10 / 0; // Infinity

    let y = "abc" / 5; // NaN

    ```


    Boolean 类型可以表示两个值之一：true 或 false。它常用于逻辑和控制流。


    ```javascript

    let isLoggedIn = true;

    let isFinished = false;

    ```


    布尔值通常是比较运算符的结果：


    ```javascript

    let a = 10;

    let b = 20;

    console.log(a > b); // false

    console.log(a < b); // true

    console.log(a === b); // false

    ```


