    # Descendant selectors


    A descendant selector is a child selector of another selector.


    ```

    nav > li {

    list-style: none;

    }

    ```


    # CSS PROPERTIES


    CSS properties are the styles used on particular selectors. They are written before
    the values in the CSS rule set are separated from property values by a colon.
    Thus, different HTML elements and selectors have different properties. Some properties
    can be used in any selector, i.e., they are universal. Others only work on specific
    selectors and under specific conditions.


    An example of this is grid template columns, which are used to style the layout
    of a page. This mainly works with divs whose display property is set to the grid
    (display: grid).


    Here are four widely-known properties to'
