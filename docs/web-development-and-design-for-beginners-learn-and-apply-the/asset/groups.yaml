    \n```javascript\n$(\"button\").click(function(){\n  var div = $(\"div\");\n  div.animate({left:\
    \ '100px',\n    \"slow\"});\n  div.animate({fontSize: '3em',\n    \"slow\"});\n\
    });\n```\n\n# UNIX 命令\n\n最终，你做的将不仅仅是编写单页网页文档并将其保存在本地硬盘上。当你积累了足够的技能后，你将创建整个网站并将它们托管到网上。那时，你就必须知道如何远程管理这些项目了。UNIX\
    \ 命令为此而生，本章将向你展示为什么以及如何做。\n\nUNIX 是 20 世纪 60 年代首次开发的操作系统，从那时起不断发展。\n\n我们所说的操作系统是指使计算机工作的程序集。它是一个用于服务器、桌面电脑和笔记本电脑的稳定、多用户、多任务系统。\n\
    \nUNIX 系统也有类似于 Microsoft Windows 的图形用户界面 (GUI)，提供了一个易于使用的环境。然而，对于图形程序未涵盖的操作或在\
    \ Windows 界面不可用的情况下（例如在 telnet 会话中），就需要 UNIX 知识。\n\n# UNIX 类型\n\nUNIX 有许多多个版本，尽管它们都有共同的相似之处。最流行的\
    \ UNIX 版本是 MacOS X、Sun Solaris 和 GNU/Linux。\n\n# UNIX 操作系统\n\nUNIX 操作系统由三部分组成：内核\
    \ (kernel)、shell 和程序。\n\n# kernel (内核)\n\nUNIX 内核是操作系统的核心：它为程序分配时间和内存，并管理系统中的文件存储和通信。\n\
    \n为了说明内核和 shell 如何工作，假设你在 shell 中输入了一个命令。shell 解析命令并请求内核执行它。内核执行任务并将结果返回给 shell。\n\
    \n# shell\n\nshell 充当了用户与内核之间的接口界面。它是一个命令行解释器 (CLI)，允许你与操作系统交互。shell 还提供了各种功能，如制表符补全、命令历史和脚本。\n\
    \n# 文件与进程\n\nUNIX 中的一切都是文件或进程。进程是一个由唯一 PID 标识的运行程序。文件是数据的集合。用户通过编辑器创建文件。文件示例：\n\
