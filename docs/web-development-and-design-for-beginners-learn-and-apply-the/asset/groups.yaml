    # 本书结构及你的学习之旅


    初学者 Web 开发与设计：学习 HTML5、CSS3、Javascript、JQuery、Bootstrap、DOM、UNIX 命令和 GitHub 基础
    - 构建响应式网站：


    **第一章：** 熟悉虚拟空间帮助你理解网站是如何运作的，以及 HTML、CSS 和 JavaScript 是如何贡献的。


    **第二章：** 响应式设计是大趋势。探索创建能够无缝适应各种设备、屏幕尺寸等的网站的方法。


    **第三章：** 使用 HTML 结构化页面。在这里，你将学习 HTML 语法的剖析以构建你的网站；你还将理解 HTML 模板代码和 HTML 文类型。


    **第四章：** 使用 CSS 美化页面。介绍层叠样式表语法的剖析和结构，以及如何使用它为你的网站设置样式。


    **第五章：** 专注于响应式 Web 设计并通过 Bootstrap 实现最大化。学习实现响应式 Web 设计的基础知识，使用 Balsamiq 进行网站原型设计和线框图、网站
    UI 设计的基础知识等。


    **第六章：** 使用 JavaScript 添加交互性。回顾从警框（alerts）和提示框（prompts）开始的编码基础。你将理解 JavaScript
    中的变量和数据类型。


    **第七章：** 文档对象模型（DOM）帮助你学习基于 HTML 的网站树结构，并教你如何利用对 DOM 的理解来操作和更改 HTML 元素。


    **第八章：** 使用 JQuery 简化网站构建。你将学习 jQuery 的功能、使用 jQuery 操作文本、样式和属性、使用 jQuery 创建动画和自定义等。


    **第九章：** UNIX 命令。Unix 命令行将带你了解如何在 Unix/Linux 终端中使用基础 bash 命令。


    **第十章：** 通过 Git 和 GitHub 协作并扩展你的 Web 开发资源。GitHub 帮助我们理解如何使用 git 进行版本控制和协作。Git
    的派叉（forking）、分支（branching）和克隆（cloning）。


    # 你的工具箱


    Web 设计和开发工具在短短几年内取得了巨大进步。随着这些进步，我们可以利用经过充分测试的库来改进工作流，并释放响应式设计的更多可能。此外，我们还可以通过不断改进的版本控制系统共同构建。从浏览器扩展程序、插件到优化代码的处理器，创建出色的
    Web 应用的可能性是前所未有的。


    但是，随着 Web 开发工具几乎每天都在增加，寻找最合适的软件来工作有时可能令人望畏。因此，为了帮助你入门，我们创建了一份必备前端开发工具清单。


    # 1. Visual Studio Code


    Visual Studio Code 拥有极其快速的源码编辑器，非常适合日常使用。由于支持多种语言，VS Code 可以帮助你即时生成括号匹配、语法高亮、自动缩进、框选择、代码片段等功能。此外，直观的键盘快捷键、易于自定义以及社区提供的快捷键映射允许你轻松导航代码。


    对于严肃的编码，你通常会受益于比简单文本块更理解代码的工具。Visual Studio Code 内置了对 IntelliSense 代码补全、语义代码的高级学习与导航以及代码重构的支持。


    # 2. Chrome 开发者工具


    能够实时编辑 HTML 和 CSS，或者在调试 JavaScript 代码的同时显示对网站性能的完整分析，你不会很高开心吗？


    Google Chrome 内置的开发者工具允许你这样做。这些工具内置在 Chrome 和 Safari 中，允许开发者访问其 Web 应用的内部组件。此外，一系列网络工具可以帮助你优化加载流，而时间线可以帮助你更好地理解浏览器在任何给定时间的做什么。


    # 3. jQuery


    JavaScript 长期以来被开发者视为至关重要的前端语言。然而，它也有自己的问题：充满了浏览器不差异，其有些复杂且难以访问的语法导致了功能受限。


    直到 2006 年，jQuery 出现了，这是一种为了简化前端流程而设计的快速、轻量、跨平台的 JavaScript 库。通过忽略许多通常留给开发者处理的功能，jQuery
    为创建动画、添加插件、甚至浏览文档提供了更大的可能性。


    显然，它是成功的：jQuery 是直到 2015 年最受欢迎的 JavaScript 库，安装了网络上 1000 万个访问量最大的网站中的 65%。


    # 4. GitHub


    它是任何开发者的噩梦——等，不，它是任何开发者的梦想。GitHub 帮助我们理解如何使用 git 进行版本控制和协作。Git 的派叉、分支和克隆。


    当你开始项目时，你可以看到所有所做的更改或恢复到之前的状态。仓库托管服务还包括错误跟踪、功能请求、管理和维基。许多雇主会寻找良好的 Git 技能，所以现在是申请的绝佳时机。


    # 5. Bootstrap


    你厌倦了输入相同的样式吗？一旦你开始定期构建应用，你就会注意到这些模式。UI 框架试图通过将常用元素抽象为复用模块来解决这些问题，允许开发者组织样式表、添加
    JavaScript 插件、创建模态对象。结果，Bootstrap 可以大幅减少你使用的代码量和时间。


    # Visual Studio Code 快速浏览


    那么，我们已经选择了文本编辑器，现在我们只需要将其安装到电脑上！


    # 安装过程


    运行 macOS、Windows 和 Linux（尤其是 Ubuntu 和 Debian）的电脑其安装步骤非常相似。在所有系统上使用 Visual Studio
    Code 都是一样的。


    - 1. 访问 Visual Code 网站下载最新版本的 Visual Studio Code。

    - 2. 将显示你的电脑操作系统，但如果显示的不正确，点击向下箭头，从下拉菜单中为你的操作系统选择相应的选项，并点击“Stable.”下的向下箭头图标。


    **Windows 用户：** 你将获得作为 .exe 文件格式的最新版 Visual Studio Code。

    **Mac 用户：** 最新版 Mac 版 Visual Studio Code 将以 .zip 文件格式下载。

    **Linux 用户：** .deb 和 rpm 是不同类型的数据存储文件。我们建议下载 .deb 文件，按照 Visual Studio Code 文档建议自动更新工作。


    - 3. 在 Visual Studio code 文件下载完成后，你需要安装它。在你的文件管理器中找到 Visual Studio code 文件。该程序允许你查看
    PC 上的文件和文件夹。


    Windows 用户：点击 .exe 文件启动安装程序。继续点击“Next”（下一步），最后点击“Finish”（完成）。

    Mac 用户：你下载的 .zip 文件应该在“下载”文件夹中。打开文件。如果看到消息，选择“Open”（打开）。

    Linux 用户：你下载的文件应该在“下载”文件夹中。在文件管理器中找到它，双击并在中央 GUI 软件中选择“Install”（安装），或运行以下命令之一。


