    <script>\nfunction Student() {\n  this.name = 'John';\n  this.gender = 'M';\n\
    }\nvar studObj = new Student();\nconsole.log(Student.prototype);\nconsole.log(studObj.prototype);\n\
    console.log(studObj.__proto__);\nconsole.log(typeof Student.prototype);\nconsole.log(typeof\
    \ studObj.__proto__);\nconsole.log(Student.prototype === studObj.__proto__);\n\
    </script>\n</body>\n</html>\n```\n\n如上例所示，可以使用 `<function-name>.prototype` 访问函数的原型（`prototype`）属性。然而，对象（实例）并不暴露\
    \ `prototype` 属性，但可以使用 `__proto__` 来访问。\n\n注意：`prototype` 属性是一种特殊的可枚举对象，不能通过 `for...in`\
    \ 或 `foreach` 循环进行遍历。\n\n# 实际练习\n\n- 1. 编写 JavaScript 代码使所有段落变为红色（如果它们具有 `red`\
    \ 类）。此代码必须在点击按钮时执行。（图 6.10）\n- 2. 创建一个简单的网页，包含一个带有 \"Hello,\" 字样的 `h2`、一个文本框和一个按钮。当用户在框内输入任何单词或短语并点击按钮时，应用用户的内容替换旧的\
    \ `h2`。使用动画让该单词旋转起来。\n\n# 文档对象模型 (DOM)\n\n在编程术语中，“对象”是数据的容器或表示。编程语言可以作用于对象来操作数据或其他对象。但在\
    \ Web 开发中，问题在于 HTML 文档并不是对象。在用编程语言对其进行处理之前，它们需要先被翻译或转换为对象。这正是 DOM（文档对象模型）大用武之地。DOM\
    \ 将 HTML 文档表示为一个对象，随后它就变成了 JavaScript 语言的编程接口。\n\nDOM（文档对象模型）是构成网页文档内容和结构的对象的数据表示。在本章中，我们将简要介绍\
    \ DOM。然后，我们将看到 DOM 如何在内存中渲染 HTML 或 XML 文档，并使用 API 创建应用程序和网页内容。\n\n# 什么是 DOM？\n\
    \nDOM 是用于 XML 和 HTML 文档的编程 API。它描述了文档的逻辑结构以及如何访问和操作文档。在 DOM 规范中，“document”一词的使用范围很广；XML\
    \ 越来越多地表示存储在各种系统中的不同类型信息。其中许多信息传统上被视为数据而非文档。然而，XML 像文档一样呈现这些数据，而 DOM 可用于处理这些数据。\n\
    \n在文档对象模型（DOM）中，文档具有类似于树的逻辑结构；更准确地说，它像是一个“树林”或“森林”，可以包含两棵或多棵树。然而，DOM 并没有指示文档将实现为树或树林，也没有规定对象之间的关系将如何具体实现。换句话说，对象模型规定了编程接口的逻辑模型，而这种逻辑模型可以根据特定实现认为合适的任何方式来实现。在本文规范中，我们使用“结构模型”术语来描述文档的树表示；我们刻意避免使用“树林”或“树”等术语，以避免暗示特定的实现。DOM\
    \ 结构模型的一个重要属性是结构同构性。\n\n因此，如果使用两个文档对象模型的实现来创建同一个文档的表示，它们将具有相同的结构模型，以及完全相同的对象和关系。\n\
    \n“文档对象模型”这一术语被选中是因为它是传统意义上面向对象设计中使用的“对象模型”。文档使用对象进行建模，该模型由文档结构、文档行为以及组成它的对象构成。换句话说，节点并不代表数据结构，它们代表的是对象。它们拥有函数和标识。作为一种对象模型，DOM\
    \ 标识了：\n\n- 用于表示和操作文档的对象和接口\n- 这些对象和接口的语义，包括行为和属性\n- 这些对象和接口之间的关系和协作\n\nSGML 文档结构传统上由抽象数据模型表示，而不是对象模型。在概念数据模型中，模型侧重于数据。在面向对象的编程语言中，数据被封装在隐藏数据的对象中，保护其免受直接的外部操作。与这些对象相关的函数控制了如何操作这些对象，并且是对象模型的一部分。\n\
    \n文档对象模型目前由两部分：DOM 核心（DOM Core）和 HTML DOM。DOM 核心代表用于 XML 文档的功能，是 HTML DOM 的基础。所有\
    \ DOM 实现都必须支持核心规范中列为“基础”的接口；此外，XML 实现必须支持核心规范中列为“扩展”的接口。HTML DOM 1 规范定义了 HTML\
    \ 文档所需的额外功能。\n\n# DOM 与 JavaScript\n\n本参考中的大多数示例都是 JavaScript。它是用 JavaScript 编写的；然而，它使用\
    \ DOM 来访问文档及其元素。文档对象模型并不是编程语言。但是，如果没有它，JavaScript 无法对网页、HTML 文档、XML 文档的概念。文档的每个元素（整个文档、头部、表格以及表格单元格内的文本）都是文档对象模型的一部分，因此可以通过\
    \ DOM 和编程语言进行操作。\n\n起初，JavaScript 和 DOM 紧密结合，但最终演变成了不同的实体。页面内容保存在 DOM 中，可以通过 JavaScript\
    \ 进行访问和操作，因此我们可以写出这个公式：\n\nAPI = JavaScript + DOM\n\nDOM 的设计目的是独立于特定的编程语言，通过单一一致的\
    \ API 提供文档表示。\n\n# 访问 DOM\n\n开始使用 DOM 不需要特殊操作。不同的浏览器有不同的 DOM 实现，这些实现对实际 DOM 的遵循程度各不相同。但是，每个浏览器都使用文档对象模型通过\
    \ JavaScript 访问网页。\n\n当你创建一个脚本时（无论是内联在 `<script>` 元素中还是通过脚本加载步骤嵌入网页），你都可以立即使用窗口或文档元素的\
    \ API 进入该文档的节点，即网页的各种元素。你的 DOM 编程可以像下面一样，使用窗口对象的 `alert( )` 函数显示警告消息，你可以使用更复杂的\
    \ DOM 方法创建新内容，如扩展示例所示。\n\n以下 JavaScript 在文档加载时（当整个 DOM 可用时）将显示警告：\n\n```html\n\
    <body onload=\"window.alert('This is my home page!');\">\n```\n\n下面的示例显示了如何创建一个新的\
    \ H1 元素，向该元素添加一些文本，然后将 H1 添加到文档的树中：（图 7.1）\n\n```html\n<html>\n<head>\n<script>\n\
    // 在加载文档后执行此函数\nwindow.onload = function() {\n// 在原本为空的 HTML 页面中创建几个元素\nconst\
    \ heading =\ndocument.createElement(\"h1\");\nconst heading_text =\ndocument.createTextNode(\"\
    Big Head!\");\nheading.appendChild(heading_text);\ndocument.body.appendChild(heading);\n\
    }\n</script>\n</head>\n</html>\n```\n\n"
