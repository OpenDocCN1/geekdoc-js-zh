    # Bootstrap Grid System


    The Bootstrap Grid System is a robust flexbox grid for creating responsive layouts
    of all shapes and sizes.


    Bootstrap''s grid system makes use of a series of containers, rows, and columns
    to align and organize content. It is built with flexbox and is totally responsive.


    Below is an example of a Bootstrap grid system and a detailed analysis of how
    the grid is put together.


    ```html

    <div class="container">

    <div class="row">

    ```


    ```html

    <div class="col-sm">

    One of three columns

    </div>

    <div class="col-sm">

    One of three columns

    </div>

    <div class="col-sm">

    One of three columns

    </div>

    </div>

    ```


    The example above generates three equal-width columns on small devices, medium,
    large and extra-large, using the classes CSS grid content-centered. These columns
    are content-centered with the parent container.


    In short, here''s how it works:


    - Containers provide a way to materialize and horizontally populate your site''s
    content. Use .container for responsive pixel width or .container-fluid for width:
    100% in all windows and device sizes.

    - Rows are skins around the columns. Each column has horizontal padding to control
    the space between them. This filling is cancelled out on the lines with negative
    margins. This way, all of the content in your columns is visually aligned along
    the left side.

    - In a grid layout, content must be placed inside columns, and only columns can
    be immediate children of rows.

    - Thanks to flexbox, the columns of the grid without a specified width will automatically
    be arranged in columns of equal width. For example, four examples of .col-sm are
    automatically 25% wide from the small breakpoint.

    - Column classes indicate how many columns you want to use compared to the potential
    of 12 per row. So if you need three columns of equal width, you can use .col-4.

    - Column widths are set as percentages, smooth and scaled relative to the parent
    element.

    - Columns are filled horizontally to create margins between individual columns;
    however, you can remove row margins and column padding with


    - To make the grid responsive, there are five grid breakpoints, one for each responsive
    breakpoint: all breakpoints (very small), small, medium, large, and extra-large.

    - The breakpoint grid points are based on minimum width media queries, which apply
    to that breakpoint and all above. For example, col-sm-4 applies to small, medium,
    large, and extra-large devices but not the first xs breakpoint.

    - You can use predefined grid classes (such as .col-4) or Sass mixin for more
    semantic markup.


    # Bootstrap Container


    In Bootstrap, the container sets the content margins relative to the responsive
    layout of behaviors. It is made up of row elements, and the row elements are the
    container of columns (called the grid system). In addition, the container class
    is used for creating boxed content.


    There are two classes of containers in Bootstrap:


    - container

    - container-fluid


    Note the basic layout of a container:


    ```html

    <html>

    <body>

    <div class="container">

    <div class="row">

    <div class="col-md-xx"></div>

    ....

    </div>

    <div class="row">

    <div class="col-md-xx"></div>

    ..

    </body>

    </html>

    ```


    ```html

    </div>

    </div>

    </body>

    </html>

    ```


