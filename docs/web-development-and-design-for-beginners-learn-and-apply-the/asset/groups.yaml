  mdcn: "\n\n# 1. 创建以下网页（仅限 HTML）：图 3.9\n\n![](img/6dfe767126857d06708c3e3f536f3e6c_109_0.png)\n\
    \n# 2. 创建以下表格（仅限 HTML）：图 3.10\n\n![](img/6dfe767126857d06708c3e3f536f3e6c_109_1.png)\n\
    \n# 使用 CSS 装饰页面\n\nCSS 或层级联样式表（Cascading Style Sheets）是用于定义网页外观的语言。在本章中，你将学习如何向基础\
    \ HTML 文档添加 CSS 代码将这一概念付诸实践，从而操作颜色、背景、边距、对齐等页面属性。\n\nCSS 是 Cascading Style Sheets\
    \ 的缩写，重点在于“样式（Style）”。HTML 用于组织网页文档（定义标题、段落并嵌入图像、视频和其他媒体），而 CSS 则介入并指定文档的样式——布局、颜色和来源都由\
    \ CSS 决定。将 HTML 视为基础（每个房子都有），将 CSS 视为审美选择（中世纪现代风家居与维多利亚式豪宅之间大不同）。\n\n## CSS 是如何工作的？\n\
    \n层级联样式表通过与 HTML 元素交互为你的网页带来样式。\n\n元素是网页的单个 HTML 组件，例如段落，它在 HTML 中可能看起来像这样：\n\n\
    ```\n<p>This is my paragraph!</p>\n```\n\n如果你想让这个段落在浏览器查看网页的人眼中显示为粉色且**加粗**，可以使用如下的\
    \ CSS 代码：\n\n```\np { color:pink; font-weight:bold;\n}\n```\n\n在这种情况下，“p”（段落）被称为“选择器（selector）”：这是\
    \ CSS 代码中指定 CSS 样式将影响哪个 HTML 元素的部分。在 CSS 中，选择器写在第一个键的左侧。大括号中的信息被称为“声明（declaration）”。它包含了应用到选择器的属性（properties）和值（values）。属性是指字体大小、颜色和边距等内容，而值则是这些属性的设置值。在上面的示例中，“color”和“font-weight”是属性，而“pink”和“bold”是值。括号内的完整集合：\n\
