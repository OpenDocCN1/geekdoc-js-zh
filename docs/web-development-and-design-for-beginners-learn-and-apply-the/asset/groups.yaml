    Use Bootstrap''s custom button styles for actions on forms, dialogs, and more,
    with support for multiple sizes, states, and more.


    Example: Bootstrap includes several predefined button styles, each with their
    own semantic purpose, with a few extras added for more control. (Figure 5.1)


    ![](img/6dfe767126857d06708c3e3f536f3e6c_167_0.png)


    ```html

    <button type="button" class="btn btn-primary">Primary</button>

    <button type="button" class="btn btn-secondary">Secondary</button>

    ```


    ```html

    <button type="button" class="btn-success">Success</button>

    <button type="button" class="btn-danger">Danger</button>

    <button type="button" class="btn-warning">Warning</button>

    <button type="button" class="btn-info">Info</button>

    <button type="button" class="btn-light">Light</button>

    <button type="button" class="btn-dark">Dark</button>

