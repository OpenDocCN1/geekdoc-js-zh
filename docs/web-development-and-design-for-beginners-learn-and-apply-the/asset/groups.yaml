    The most important commands within ftp are obtaining the files from the remote
    machine and placing them there (mget and mput allow you to specify more than one
    file at a time). It sounds simple, but make sure you don''t confuse the two, especially
    when your physical location doesn''t match the address of the ftp connection you''re
