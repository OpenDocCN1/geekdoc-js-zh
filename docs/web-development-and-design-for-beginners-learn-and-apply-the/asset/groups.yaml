    # How do I recognize an expression?


    Knowing what an expression is in your code tells you essential information. It
    tells you which units of code can be assigned to a variable and/or used where
    JavaScript expects a value. In JavaScript, expressions, including variable references,
    function calls, and property accessors, can be used wherever a value is expected.
    So much that one way to check if something is an expression is to put that unit
    of code where a value is expected and check if no errors are shown.


    For example, the console.log () method prints a value to the console and returns
    undefined. That expected value can be replaced with the "unit of code" you are
    testing. If that snippet'
