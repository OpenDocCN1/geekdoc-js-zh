    Giving it a complete treatment now would probably be more confusing than helpful.
    The basic idea of OOP is that we use objects to model things in the real world
    that we want to represent within our programs and provide an easy way to access
    functionality that would otherwise be difficult or impossible to use.


    Objects can contain related code and data, representing information about what
    you are trying to model and what functionality or behavior you want it to have.
    Object data (and often functions as well) can be stored neatly (the official word
    is encapsulated) within an object package (which can be given a specific name
    to refer to, sometimes referred to as a namespace), which facilitates structure
    and access. Objects are also commonly used as data repositories that can quickly
    be sent over the network.


