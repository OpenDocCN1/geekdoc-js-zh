    <div><span>我们都在单独的行内！</span></div>\n```\n\n# inline-block\n\nCSS `inline-block`\
    \ 是行内和块级功能的结合。主要区别是行内块对宽度和高度属性有响应。\n\n```css\ndiv {\n  display: inline-block;\n\
    \  height: 100px;\n  width: 100px;\n  background: red;\n  color: white;\n  padding:\
    \ 6px;\n  margin: 3px;\n}\n```\n\n这一特性使得 CSS `display: inline-block` 更适合创建布局。使用\
