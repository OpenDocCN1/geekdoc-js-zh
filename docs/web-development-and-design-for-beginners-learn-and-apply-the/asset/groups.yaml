    \ '100px',\n    \"slow\"});\n  div.animate({fontSize: '3em',\n    \"slow\"});\n\
    });\n```\n\n# UNIX COMMANDS \n\nEventually, you’ll be doing more than just coding\
    \ single-page web documents and keeping them in your hard drive. When you’ve gained\
    \ enough skills, you’ll be creating entire websites and hosting them online. That’s\
    \ when you’ll have to know how to manage these projects remotely. UNIX commands\
    \ exist for this purpose, and this chapter will show you why and how.\n\nUNIX\
    \ is an OS first developed in the 1960s and has been in constant development ever\
    \ since.\n\nBy operating system, we mean the set of programs that make the computer\
    \ work. It is a stable, multi-user, and multitasking system for servers, desktops,\
    \ and laptops.\n\nUNIX systems also have a Microsoft Windows-like graphical user\
    \ interface (GUI) that provides an easy-to-use environment. However, UNIX knowledge\
    \ is required for operations not covered by a graphical program or when a Windows\
    \ interface is unavailable, such as in a telnet session.\n\n# Types of UNIX\n\n\
    There are many multiple versions of UNIX, although they all share common similarities.\
    \ The most popularly used varieties of UNIX are MacOS X, Sun Solaris, and GNU/Linux.\n\
    \n# The UNIX OS\n\nThe UNIX OS consists of three parts; the kernel, shell, and\
    \ programs.\n\n# kernel\n\nThe UNIX kernel is the heart of the operating system:\
    \ it allocates time and memory to programs and manages file storage and communications\
    \ in systems.\n\nAs an illustration of how the kernel and shell work, assume you\
    \ type a command in the shell. The shell interprets the command and asks the kernel\
    \ to execute it. The kernel performs the task and returns the result to the shell.\n\
    \n# The Shell\n\nThe shell serves as an interface between the user and the kernel.\
    \ It is a command-line interpreter (CLI) that allows you to interact with the\
    \ operating system. The shell also provides various features such as tab completion,\
    \ command history, and scripting.\n\n# Files and processes\n\nEverything in UNIX\
    \ is a file or a process. A process is a running program identified by a unique\
    \ PID. A file is a collection of data. Users create files by using editors. File\
    \ examples:\n\n- A document (essay, etc.)\n- A program written in a high-level\
    \ language\n- Instructions that are directly machine-understandable and incomprehensible\
    \ to an occasional user\n- A directory containing information about subdirectories\
    \ and ordinary files\n\n# Basic UNIX Commands\n\nBe aware that not all of these\
    \ are part of UNIX itself, and you may not find them on all machines. But they\
    \ can all be used essentially the same way, by typing the command and pressing\
    \ enter. Note that some of these commands are not the same on non-Unix machines.\n\
    \n# File\n\n- ls list your files\n- ls -l lists your files in \"long format,\"\
    \ which contains a lot of information like the exact size of the file, who owns\
    \ the file and who has the right to view it, and when it was last modified.\n\
    - ls -a lists all files, including those whose names begin with a dot that you\
    \ don't always want to see. There are many more options, such as list files by\
    \ size, date, recursively, etc.\n\n- more filename displays the first part of\
    \ a file as far as possible on a screen. Just press the space bar to see more\
    \ or q to exit. You can make use of /pattern to search for a pattern.\n- emacs\
    \ filename is an editor that allows you to create and edit a file.\n- mv filename1\
    \ filename2 moves a file (i.e., give it a different name or move it to a different\
    \ directory).\n- cp filename1 filename2 copies a file\n- rm filename deletes a\
    \ file. It is recommended that you use the rm -i option, which will ask you for\
    \ confirmation before removing anything. You can set it as the default by creating\
    \ an alias on your .cshrc.\n- diff filename1 filename2 compares files and shows\
    \ their differences\n- wc filename lets you know how many lines, characters, and\
    \ words there are in a file\n- chmod options filename allows you to change the\
    \ read, write and execute permissions."
