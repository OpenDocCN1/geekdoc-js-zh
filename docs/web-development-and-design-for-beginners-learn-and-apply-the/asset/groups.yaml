    button\").click(function(){\n  $(\"div\").animate({\n    height: 'toggle'\n  });\n\
    });\n```\n\n# jQuery animate() - Uses Queue Functionality\n\nBy default, jQuery\
    \ has built-in queue functionality for animations.\n\nThis means that if you write\
    \ multiple calls to animate() one after the other, jQuery creates an \"internal\"\
    \ queue with these method calls. Then make the animated calls ONE by ONE.\n\n\
    So, if you want to run several animations one after the other, let's take advantage\
