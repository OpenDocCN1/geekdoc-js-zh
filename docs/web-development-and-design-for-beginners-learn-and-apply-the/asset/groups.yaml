    ## HTML Forms


    HTML forms are needed to collect different types of user input like contact details
    like name, email address, phone numbers, or information like credit card information,
    etc.


    Forms contain special elements called controls, such as input boxes, checkboxes,
    radio buttons, submit buttons, etc. Users often fill out a form by changing its
    controls, such as entering text, selecting items, etc., and submitting this form
    to a web server for further processing.


    The `<form>` tag is used to create an HTML form. Here is a simple example of a
    login form (Figure 3.8):


    ```html

    <form>

    <label>Username: <input type="text"></label>

    <label>Password: <input type="password"></label>

    <input type="submit" value="Submit">

    </form>

    ```


    ![](img/6dfe767126857d06708c3e3f536f3e6c_106_0.png)


    ## Separation Between HTML Structure and CSS Style


    The HTML `<div>` element is the generic container for flow content. It has no
    impact on the layout or content until it is styled in some way using CSS (for
    example, the style is applied directly to it, or a layout model type, such as
    Flexbox, is applied to its parent element).


    As a "pure" container, the `<div>` element is inherently nothing. Instead, it
    is used to group content to be easily styled using the `class` or `id` attributes,
    marking a section of a document as written in a different language (using the
    attribute `lang`), and so on.


    ## A simple example


    ```html

    <div>

    <p>You may insert any content</p>

    </div>

    ```


    ## A styled example


    This example creates a shaded area by styling the `<div>` using CSS. Take note
    of the use of the `class` property on the `<div>` to apply the style named "shadowbox"
    to the element.


    ## HTML


    ```html

    <div class="shadowbox">

    <p>Here''s a very interesting note

    displayed in a

    lovely shadowed box.</p>

    </div>

    ```


    ## CSS


    ```css

    .shadowbox {

    width: 15em;

    border: 1px solid #333;

    box-shadow: 8px 8px 5px #444;

    padding: 8px 12px;

    background-image: linear-

    gradient(180deg, #fff, #ddd 40%,

    #ccc);

    }

    ```


