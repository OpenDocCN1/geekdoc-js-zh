    \ to those selected elements.\n\nHere, we will take an in-depth look at the different\
    \ selectors in CSS and how you can implement them.\n\n# Universal selector\n\n\
    A universal selector is indicated by the symbol *. Affects all elements of the\
    \ document tree.\n\n```\n* {\n  color: purple;\n}\n```\n\nThis changes the color\
    \ of all elements in the HTML document, whether it is a paragraph, h1, h4, or\
