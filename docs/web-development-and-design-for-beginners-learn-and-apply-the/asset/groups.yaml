  - '[PAGE 75]


    # STRUCTURING THE PAGE WITH HTML


    As mentioned previously, HTML elements are the basic building blocks of the Web.
    HTML describes the structure (arrangement of components) of a web page. By the
    end of this chapter, you will have familiarized yourself with different HTML tags
    and how they work to organize the contents of a web page. You will also be able
    to create basic web pages that contain text, images, and hyperlinks. You will
    also learn how to implement responsive design through a simple HTML tag added
    to your web page.


    If you want to build a website, the first'
  - '[PAGE 76]


    language you need to learn is HTML. HTML is the contraction for Hypertext Markup
    Language and is the most broadly utilized language for designing website pages.


    Hypertext alludes to how website pages (HTML docs) are connected together. Along
    these lines, the link accessible on a website page is known as hypertext.


    As the name suggests, HTML is a markup language, which implies that HTML is used
    to simply ''mark up'' a text document with tags that inform a web browser how
    it should be structured for display.


    Originally, HTML was designed to define the structure of documents, such as titles,
    paragraphs, lists, etc., to facilitate sharing of scientific information among
    researchers.


    Now, HTML is widely used to format web pages using various tags available in HTML
    language.


    # The Anatomy of the HTML Syntax


    HTML is a way of marking up text that'
  - '[PAGE 77]


    allows you to format its appearance in a web browser and allows text to link to
    other content. To mark up the text and say how we want it to appear, we use HTML
    "tags" around the text we want to change. In almost all cases, it is a good idea
    to have a start tag and an end tag. Otherwise, your page might be confused as
    the web browser ( Firefox, Safari, Internet Explorer) will not know where to finish
    formatting.


    ![](img/6dfe767126857d06708c3e3f536f3e6c_77_0.png)


    ![](img/6dfe767126857d06708c3e3f536f3e6c_77_1.png)


    The main parts of our element are (see above Figure 3.1):'
  - '[PAGE 78]


    +   • The opening tag: This consists of the name of the element (in this case,
    p), surrounded by opening and closing angular brackets. Indicates where the element
    begins or begins to take effect, in this case, where the paragraph begins.


    +   • The closing tag is written the same way as the opening tag, except it includes
    a slash before the element name. Indicates where the element ends, in this case,
    where the paragraph ends. Not adding a closing tag is one of the standard beginner''s
    mistakes and can lead to weird results.


    +   • Content: is the content of the element, which in this case is just text.


    +   • The Element: The opening tag, closing tag, and content together form the
    element.


    # Understanding the HTML Boilerplate and HTML Doctypes


    Boilerplates are similar to templates in that they provide the elements needed
    to create'
  - '[PAGE 79]


    the foundation of a building. Naturally, an HTML boilerplate is a set of files
    that form the basis of any website created by professionals in the industry who
    have encountered the same issues and do not want others to experience the same
    issues.


    Boilerplates often contain various file types associated with web builds, including
    HTML documents, basic CSS stylesheets, essential JavaScript, placeholder images,
    and documentation on how to use what you have just downloaded.


    Let''s look at a line-by-line HTML template (Figure 3.2).'
  - '[PAGE 80]


    ```

    Line 1 <!DOCTYPE html>

    Line 2 <html lang="en">

    Line 3 <head>

    Line 4 <meta charset="UTF-8">

    Line 5 <meta name="viewport" content="width=device, initial-scale=1.0">

    Line 6 <meta http-equiv="X-UA-Compatible" content="le=edge">

    Line 7 <title>Document</title>

    Line 8 </head>

    Line 9 <body>

    Line 10 </body>

    Line 11 </html>

    ```


    ![](img/6dfe767126857d06708c3e3f536f3e6c_80_0.png)


