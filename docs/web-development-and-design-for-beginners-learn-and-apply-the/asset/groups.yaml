    \n# DRESSING UP THE PAGE WITH CSS\n\nCSS or Cascading Style Sheets is the language\
    \ used to define a web page’s appearance. In this chapter you will learn how to\
    \ put that concept into practice by adding CSS code to basic HTML documents to\
    \ manipulate page properties like color, background, margins, alignment, and so\
    \ on.\n\nCSS is the abbreviation for Cascading Style Sheets with an emphasis on\
    \ \"Style.\". While HTML is used to organize a web document (defining titles and\
    \ paragraphs and embedding images, videos, and other media). CSS steps in and\
    \ specifies the document's style - the layout, colors, and sources are all determined\
    \ with CSS. Think of HTML as the foundation (every home has one) and CSS as the\
    \ aesthetic choices (there's a big difference between a mid-century modern home\
    \ and a Victorian mansion).\n\n## How Does CSS Work?\n\nCascading Style Sheets\
    \ brings style to your web pages by interacting with HTML elements.\n\nElements\
    \ are the individual HTML components of a web page, such as a paragraph, which\
    \ in HTML might look like this:\n\n```\n<p>This is my paragraph!</p>\n```\n\n\
    If you want this paragraph to appear in pink and bold for people who view your\
    \ webpage through a browser, use CSS code like this:\n\n```\np { color:pink; font-weight:bold;\n\
    }\n```\n\nIn this case, \"p\" (the paragraph) is called the \"selector\": this\
    \ is the part of the CSS code that specifies which HTML element the CSS styling\
    \ will affect. In CSS, the selector is written to the left of the first key. The\
    \ information in curly braces is known as a declaration. It contains properties\
    \ and values that are applied to the selector. Properties things like font size,\
    \ color, and margins, while values are the settings for those properties. In the\
    \ example above, \"color\" and \"font-weight\" are properties, and \"pink\" and\
    \ \"bold\" are values. The complete set in parentheses:\n\n```\n{ color:pink;\
    \ font-weight:bold; }\n```\n\nis the declaration, and again, \"p\" (which represents\
    \ the HTML paragraph) is the selector. The same basic principles can be applied\
    \ to change the font size, the background color, margin indentations, etc. For\
    \ example:\n\n```\nbody { background-color: light blue; would make the background\
    \ of the page light blue or\np { font-size:20px; color:red; }\n```\nwill create\
    \ a 20 point font paragraph with red letters.\n\n## Anatomy of CSS Syntax and\
    \ Structure\n\nSo, in the previous chapter, we already got a taste of how easy\
    \ it is to style an HTML element using CSS. So, why did it look the way it is?\
    \ Here, we'll explain the anatomy and syntax of CSS to better understand how it\
    \ works. Let's take a look at these CSS code examples that target H1 elements:\n\
    \n```\nh1 {\ncolor: Blue;\n}\n```\n\nThis is a selector with a property and a\
    \ value - these are the main concepts of CSS, and you should try to remember their\
    \ names as you go through this section. So in this example, h1 is the name of\
    \ the selector, color is the property, and Blue is the value.\n\nAmong these three\
    \ concepts, you can see a variety of special characters. There are braces around\
    \ the property and the value, there is a colon separating the property from the\
    \ value, and there is the semicolon after the value. Each makes it easier for\
    \ the browser to analyze and understand your CSS code:\n\n- The brackets allow\
    \ you to group different properties in the same rule (selector).\n- The colon\
    \ tells the parser where the property ends and the value begins.\n- The semicolon\
    \ tells the parser where the value ends.\n\n## How to use CSS Selectors\n\nA selector\
    \ is simply the item to apply the style. But as you continue to write more CSS\
    \ code, you'll find that selectors aren't just elements. Instead, these can be\
    \ attributes, pseudo-classes, identifiers, classes, and descendants.\n\nCSS selectors\
    \ select elements on an HTML page that match the patterns described in a selector,\
    \ and style rules adhering to the selector are applied to those selected elements.\n\
    \nHere, we will take an in-depth look at the different selectors in CSS and how\
    \ you can implement them.\n\n### Universal selector\n\nA universal selector is\
    \ indicated by the symbol *. Affects all elements of the document tree.\n\n```\n\
    * {\n  color: purple;\n}\n```\n\nThis changes the color of all elements in the\
    \ HTML document, whether it is a paragraph, h1, h4, or list. * is also used to\
    \ target all values of a specific element.\n\n```\n*h1 {\n  text-transform: uppercase;\n\
    }\n```\n\nThis will change the h1 elements' value to uppercase only. No other\
    \ element will be affected.\n\n### Element selectors\n\nThis is the most common\
    \ selector and involves targeting members of a specific element when that element\
    \ is defined.\n\n```\np{\n  font-style: italic;\n}\n```\nThis turns them into\
    \ italics.\n\n### Descendant selectors\n\nA descendant selector is a child of\
    \ another.\n\n```\nnav > li {\nlist-style: none;\n}\n```\n\n## CSS PROPERTIES\n\
    \nCSS properties are the styles applied to the selector. They are written before\
    \ the colon. Here are some widely known:\n\n- Font properties\n- List properties\n\
    - Text properties\n- Border properties\n\n## Universal selector\n\nA universal\
    \ selector is indicated by the symbol *. Affects all elements of the document\
    \ tree.\n\n```\n* {\n  color: purple;\n}\n```\n\nThis changes the color of all\
    \ elements in the HTML document, whether it is a paragraph, h1, h4, or list. *\
    \ is also used to target all values of a specific element.\n\n```\n*h1 {\n  text-transform:\
    \ uppercase;\n}\n```\n\nThis will change the h1 elements' value to uppercase only.\
    \ No other element will be affected.\n\n### Element selectors\n\nThis is the most\
    \ common selector and involves targeting members of a specific element when that\
    \ element is defined.\n\n```\np{\n  font-style: italic;\n}\n```\nThis turns them\
    \ into italics.\n\n### Descendant selectors\n\nA descendant selector is a child\
    \ of another.\n\n```\nnav > li {\nlist-style: none;\n}\n```\n\n## CSS PROPERTIES\n\
    \nCSS properties are the styles applied to the selector. They are written before\
    \ the colon. Here are some widely known:\n\n- Font properties\n- List properties\n\
    - Text properties\n- Border properties\n\n## Font Properties\n\n| Properties |\
    \ Values | Descriptions |\n| --- | --- | --- |\n| font | font-style, font-variant,\
    \ font-weight, font-size/line-height, font-family, caption, icon, menu, message-box,\
    \ small-caption, status-bar, inherit | Sets the shorthand for all the font specifications\
    \ |\n| font-weight | normal, bold, lighter, 100, 200, 300, 400, 500, 600, 700,\
    \ 800, 900, inherit | Sets the weight of a font |\n| font-style | normal, italic,\
    \ oblique, initial, inherit | Sets the style of a font |\n\n## List Properties\n\
    \n| Properties | Values | Descriptions |\n| --- | --- | --- |\n| list-style |\
    \ list-style-type, list-style-position, list-style-image, inherit | Shorthand\
    \ combination for list-style-type, list-style-position, and list-style-image |\n\
    | list-image | none, url, initial, inherit | Sets an image as the list-item marker\
    \ |\n| list-style-type | none, disc, circle, square, decimal-leading-zero, armenian,\
    \ georgian, lower-alpha, upper-alpha, lower-greek, lower-latin, upper-latin, lower-roman,\
    \ upper-roman, inherit | This sets the type of list-item marker |\n\n## Text Properties\n\
    \n| Properties | Values | Descriptions |\n| --- | --- | --- |\n| color | Hex,\
    \ RGB, keyword | Sets the color of a text |\n| text-transform | uppercase, lowercase,\
    \ capitalize, none | Sets the capitalization of the text |\n| text-align | right,\
    \ left, center, justify | Sets the text alignment on the screen |\n| letter-spacing\
    \ | normal, length | Sets the spacing between text characters |\n| text-decoration\
