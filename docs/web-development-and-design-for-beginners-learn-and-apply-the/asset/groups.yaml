    \  var div = $(\"div\");\n  div.animate({height: '200px',\n    opacity: '0.4'},\
    \ 'slow');\n  div.animate({width: '200px',\n    opacity: '0.8'}, 'slow');\n  div.animate({height:\
    \ '50px',\n    opacity: '0.4'}, 'slow');\n  div.animate({width: '50px',\n    opacity:\
    \ '0.8'}, 'slow');\n});\n```\n\nThe following example first moves the <div> element\
