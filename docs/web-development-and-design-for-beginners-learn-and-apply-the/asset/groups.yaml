    \ ID 的样式。\n\n# CSS display 属性\n\nCSS `display` 属性控制 HTML 元素在网页上的呈现方式。\n\n# 行内元素与块级元素\n\
    \nHTML 元素分为两大类：块级元素（block elements）和行内元素（inline elements）。\n\n块元素（`<div>`, `<p>`,\
    \ `<h1>` 等）始终尽可能向两侧延伸并在新行开始。\n\n行内元素（`<span>`, `<img>`, `<a>` 等）只占据它们所需的空间。它们不需要在新行上开始。\n\
