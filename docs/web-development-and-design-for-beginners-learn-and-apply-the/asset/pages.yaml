  md: '# RESPONSIVE DESIGN IS THE

    WAY TO GO


    While the opening chapter gives an overview of general concepts related to websites
    and their roles in our daily life, this chapter introduces you to responsive design
    as an approach to developing modern websites. It also discusses the elements of—
    what goes into—a responsive website and how to implement underlying objectives.


    Responsive Web Design (RWD) has become a significant pattern as web experts convey
    a reliable user experience to develop cell phones and tablets.'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'Of course, making your website compatible with mobile devices is a must. Professional
    companies work hard to make sure their customers choose the best technology available
    and understand the importance of making their website responsive. Here are some
    ways to implement responsive design:


    # Planning for RWD


    Before you get to the actual design phase, it''s helpful to think about this process.
    For example, making your site fluid to accommodate the different screen sizes
    your visitors will be using. So, first, you need to decide which breakpoints you
    are going to design for. Typically, you''ll want to include a minimum width and
    maximum width for:


    +   * Smartphone, both vertically and horizontally (at least 480px).

    * Tablet, both vertically and horizontally (at least 768px).

    * Common desktop screen resolutions (greater than 768px).'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'Once you''ve figured out what breakpoints you''re projecting onto, it''s time
    to sketch some wireframes. These visual elements can help you determine the location
    of different elements as the screen shrinks or expands. You want to see how three
    columns will be displayed on a desktop feed, one on a smartphone and two on a
    tablet.


    # Be flexible


    Multimedia queries, defined by established breakpoints, detect the size of the
    browser used by a visitor. To make the site flexible, you must have a layout for
    your site. At the start of Responsive Design, the grid systems were fixed and
    split into several columns, such as 12 or 16. The columns were getting narrower
    as new columns were added.


    As the screen size now ranges from a portable device to a large screen TV, it
    requires more flexibility, so fluid grid systems are the best option. As an alternative
    to a layout based solely on the size of the pixel, the fluid grid is made up of
    a set number of columns. Still, each element of the site is designed with'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'widths and heights proportional rather than the size based on pixels.


    When making your site flexible, it''s essential to make sure you don''t overlook
    any images. When creating your stylesheets, be sure to assign a maximum width
    to any image in your design using: img {max-width: 100 percent}. This CSS snippet
    will resize images to 100% of the width available in their main elements so that
    they are resized to fit the visitor''s screen size.


    Along with the images, you''ll need to include code to ensure visitors'' mobile
    devices aren''t offering a larger version of your site. If you don''t configure
    the display to tell the browser to display the website based on the screen size,
    assuming what it should be is not encouraging.'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'You can do this by adding <meta name = "viewport" content = "width = device-width">
    into the <head> tag. This sets the width of the viewport to the width of the device.
    Since IE10 has decided to ignore this metadata, you will also need to add the
    following viewport rule to your CSS:


    ```

    @viewport{ zoom: 1.0; width: device-width; }

    ```


    # Make it compatible with mobile devices


    Becoming responsive doesn''t automatically mean your website is mobile-friendly.
    It can fit smaller screens, but a good user experience isn''t just about moving
    things around.


    An important thing to remember about RWD is that your site shouldn''t be wider
    than a column at the smallest breakpoint. Keep in mind that the average space
    required to tap on a mobile screen is 44 pixels. So it''s easier to put all of
    your elements on one long, single page that the user can browse, rather than trying
    to force them to navigate using tiny links and buttons.'
  merge: -1
  pgno: 69
- img_proc: true
  md: When you think of mobile users, consider that responsive design allows you to
    eliminate elements when reducing columns using conditional loading in CSS. Hide
    all non-essential content when screen space starts to shrink.
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Test, and Test Again


    You should notice how easily it resizes when you resize your browser window if
    you''ve designed your website. However, this test is not sufficient. Use the different
    testing tools available in your editing tool and the different automated testing
    tools available. You ought to likewise test your site on every one of the gadgets
