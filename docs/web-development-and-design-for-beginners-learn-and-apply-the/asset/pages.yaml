- img_proc: true
  md: 'However, before we begin, let''s take a quick look at the difference between
    web design and development.


    # What does Web Design imply?


    Web design means the design of websites displayed on the Internet. The look and
    feel or the layout and appearance of a website website design. Appearance refers
    to the colors, fonts, and images on a website. The layout refers to how information
    is structured and categorized. The two most common methods of designing a site
    are adaptive. First, the content is fixed and responsive. Second, the content
    moves dynamically according to the size of the screen.


    # What is Web Development?


    Open Google Chrome, type "How to become a web developer," and hit enter; thousands
    of results are displayed in fractions of a second. What makes this possible? Website
    Development!


    Web development generally refers to the activities associated with creating, building,'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'and maintaining websites for hosting on the intranet or the Internet. It entails
    aspects such as web design, web programming, web publishing, and database management.


    To summarize the difference, let''s look at the roles of a web designer and a
    web developer.


    +   - A web designer uses software tools like Photoshop, Illustrator, Sketch,
    Experience Design, etc., to design a website with all the essential information
    and is easy to navigate and use. On the contrary, a web developer turns these
    projects into a live website using programming languages like HTML, JavaScript,
    PHP, etc.

    - In the Google homepage example above, when you hover your cursor over the microphone
    symbol, a dialog box that says "Search by voice" appears. Clicking on it displays
    a "Speak now" message. Throughout this process, the decision to display messages,
    color, font, alignment, and size of text, search bar, and microphone'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'make up the web design. At the same time, the programming enables the web design
    to be made. The user can see the texts and click on the icon that constitutes
    web development.


    # How The Web Works


    Everyone knows what a website is. We click on the little blue letters, google
    stuff, type in www-something-or-other, and then we are looking at dog pictures.
    This is how a website works, isn''t it?


    Considering that it is something that we almost all use daily, the Internet can
