    +   1. Navigate through the Visual Studio Code site to download the latest version
    of Visual Studio Code.


    +   2. Your computer OS will be displayed, but if the displayed one is incorrect,
    click the down arrow and select the appropriate option for your operating system
    from the drop-down menu and click on the down arrow icon under "Stable.".


    **Windows Users:** You will get the latest version of Visual Studio Code as an
    .exe file.


    **Mac Users:** The latest version of Visual Studio Code for Mac will be downloaded
    as a .zip file.'
