    # Cloning and Forking


    Forking and cloning are, in several ways, very similar actions. Both effectively
    copy all source code from a repository. What sets them apart and influences your
    decision whether to fork or clone a repository is the intent behind the move.


    Forking a project means making a copy of its repository, renaming it, and using
    that copy as the basis for a new project. Forked projects are rarely added or
    merged to the original (master) repository. Fork a project so that you rarely,
    if ever, contribute to the main project.


    Cloning a project, on the contrary, is more of a technical move. The aim is to
    create a working copy of a project to make changes and contribute directly to
    the project. Cloning is essential to open source contributions. To contribute
    to a project that uses Git as a version control system, GitHub or other available
    options, such as BitBucket, starts by making a clone. This creates an exact copy
    of'
  merge: -1
