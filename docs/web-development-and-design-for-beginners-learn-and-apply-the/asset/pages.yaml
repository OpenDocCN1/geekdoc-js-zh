  md: '# CSS Font Style


    The CSS font-style property defines whether a font should be styled with a normal,
    italic, or oblique face from its font family.


    Italic faces are usually italic type, generally using less horizontal space than
    their counterparts without style. In contrast, the oblique faces are generally
    inclined versions of the regular face.


    When the specified style is unavailable, italic and oblique faces are simulated
    by artificially distorting normal face glyphs (use character synthesis to control
    this behavior).


    The font-style property is expressed as a single keyword selected from the list
    of values below, alternatively incorporating an angle if the keyword is asymmetric.


    # Values


    +   **Normal**: Select a font classified as normal from a font family.

    **Italics**: Select a font classified as italic. If'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'an italicized version of the face is not available, a version classified as
    oblique is used. If none are available, the style is artificially simulated.


    **Oblique:** Select a character classified as oblique. If an oblique version of
    the face is not available, an italic version is used. If none are available, the
    style is artificially simulated.


    **oblique <angle>**: Picks an oblique character and specifies an angle for the
    text slant. However, if at least one oblique face in the selected font family,
    the nearest to the specified angle is picked.


    If no tilted face is available, the browser will synthesize a tilted version of
    the character by tilting a normal face by the specified amount. Valid values are
    values in degrees between -90deg and 90deg inclusive. If no angle is selected,
    an angle of 14 degrees will be used. Positive values are skewed towards the end
    of the line, while negative values are skewed towards the beginning.'
