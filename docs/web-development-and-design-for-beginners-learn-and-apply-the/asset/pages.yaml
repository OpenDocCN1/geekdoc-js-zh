  md: '# DOCUMENT OBJECT MODEL


    In programming terminology, an ‘object’ is a container or representation for data.
    A programming language can act on an object to manipulate data or other objects.
    But the problem when it comes to web development is that html documents are not
    objects. They need to be translated or converted into objects before they can
    be worked on using programming languages. This is where the DOM or Document Object
    Model comes in. DOM represents an html document as an object. It then becomes
    a programming interface for the JavaScript language'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'The DOM (Document Object Model) is the data representation of the objects that
    make up the content and structure of a document on the web. In this chapter, we
    will briefly introduce the DOM. Then, we will see how the DOM renders an HTML
    or XML document in memory and uses APIs to create applications and web content.


    # What is the DOM?


    The DOM is a programming API for XML and HTML documents. It describes the document''s
    logical structure and how to access and manipulate a document. In the DOM specification,
    the word "document" is used broadly; XML is increasingly used to represent several
    different types of information stored in various systems. Many of these are traditionally
    viewed as data rather than documents. However, XML presents this data like documents,
    and the DOM can be used to handle this data.


    In the document object model (DOM), documents have a logical structure that closely
    resembles a tree; to be more exact, it'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'is like a "grove" or "forest" which can contain two or more trees. However,
    the DOM does not indicate that documents will be implemented as a tree or grove,
    nor does it specify how relationships between objects will be implemented in any
    way. In other words, the object model stipulates the logical model for the programming
    interface, and this logical model can be implemented in any way a particular implementation
    sees fit. In this specification, we use the term structure model to describe the
    tree representation of a document; we intentionally avoid terms like "grove" or
    "tree" to avoid implying a particular implementation. An important property of
    DOM structure models is a structural isomorphism.


    Thus, if two implementations of the Document Object Model are used to create a
    representation of the same document, they will make the same structure model with
    precisely the same objects and relationships.


    The term "Document Object Model" was selected because it is an "object model"
    used'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'in the traditional sense of object-oriented design. Documents are modeled using
    objects, and the model is made up of the document structure, the behavior of a
    document, and the objects that compose it. In other words, the nodes do not represent
    a data structure, and they represent objects. They have functions and identities.
    As an object model, the DOM identifies:


    +   - the objects and interfaces used to represent and manipulate a document

    - the semantics of these objects and interfaces, including behavior and attributes

    - the relationships and collaborations between these objects and interfaces


    The SGML document structure has traditionally been represented by an abstract
    data model, not an object model. In a conceptual data model, the model focuses
    on data. In object-oriented programming languages, the data is encapsulated in
    data-hidden objects, protecting it from direct'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'external manipulation. The functions associated with these objects control
    how the objects can be manipulated and are part of the object model.


    The document object model presently consists of two parts, DOM Core and HTML DOM.
    DOM Core stands for the functionality used for XML documents and serves as the
    basis for HTML DOM. All DOM implementations must support the interfaces listed
    as "fundamental" in the Core specification; Additionally, XML implementations
    must support interfaces listed as "extended" in the Core specification. The HTML
    DOM Level 1 specification defines the additional functionality required for HTML
    documents.


    # DOM and Javascript


    Most of the examples in this reference are JavaScript. It is written in JavaScript;
    however, it uses the DOM to access the document and its elements. The Document
    Object Model is not a programming language. Still, without it, the JavaScript'
