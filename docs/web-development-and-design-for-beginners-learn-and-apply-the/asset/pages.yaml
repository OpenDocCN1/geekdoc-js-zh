  md: '# CSS Float and Clear


    The CSS float property states how an element should float, while the CSS clear
    property specifies which elements can float next to the deleted element and on
    which side.


    # Float property


    The float property is used to position and format content; for example, it allows
    an image to float to the left of the text in a container.


    The float property will have one of the following values:


    +   **left** - Element floats to the left of its container.

    - **right** - Element floats to the right of its container.

    - **none** - Element does not float (it will be displayed exactly in the text).
    It is the default value.

    - **inherit** - Element inherits the float value from its parent.'
