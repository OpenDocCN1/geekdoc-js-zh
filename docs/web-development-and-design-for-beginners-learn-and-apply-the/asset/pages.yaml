    # The Clearfix Hack


    If a floating element is larger than the containing element, it will "overflow"
    its container. We can then add a clearfix hack to solve this problem:


    ```

    .clearfix {

    overflow: auto;

    }

    ```


    The overflow: auto clearfix works well as long as you can keep track of your margins
    and padding (if not, you may see scroll bars). The new modern clearfix hack, however,
    is safer to use, and the following code is used for most web pages:


    ```

    .clearfix::after {

    content: ""

    clear: both;

    display: table;

    }

    ```'
