  md: '# Your Essential Toolkits


    Web design and development tools have come a long way in just a few years. With
    these advancements, we can harness the power of highly tested libraries to improve
    our workflow and unlock more possibilities in responsive design. Also, we can
    build things together with continuously improving version control systems. From
    browser add-ons and plugins to processors that optimize your code, there have
    never been so many possibilities for creating great web applications.


    But with the number of web development tools increasing almost every day, finding
    the best software to do the job can sometimes seem daunting. So to help you get
    started, we''ve created a list of essential frontend development tools to help
    you get started.


    # 1. Visual Studio Code


    Visual Studio Code has an extremely fast source code editor, perfect for everyday
    use. With support for several languages, VS Code'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'helps you instantly produce bracket-matching, syntax highlighting, auto-indentation,
    box selection, snippets, and more. In addition, intuitive keyboard shortcuts,
    easy customization, and community-provided keyboard shortcut mappings allow you
    to easily navigate the code.


    For serious coding, you will often benefit from tools with a greater understanding
    of the code than simple blocks of text. Visual Studio Code includes built-in support
    for IntelliSense code completion, advanced learning and navigation of semantic
    code, and code refactoring.


    # 2. Chrome Developer Tools


    Wouldn''t you be happy if you could edit your HTML and CSS on the fly or debug
    your JavaScript code while still showing complete analysis of your website''s
    performance?


    Google Chrome''s built-in developer tools allow you to do just that. Bundled and
    available in Chrome and Safari, they enable'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'developers to access the internal components of their web applications. Additionally,
    a range of networking tools can help you optimize load flows, while a timeline
    helps you better understand what the browser is doing at any given time.


    # 3. jQuery


    JavaScript has long been regarded as a vital frentend language by developers.
    However, it had its own problems: loaded with browser inconsistencies, its somewhat
    complicated and inaccessible syntax meant the functionality suffered.


    That was until 2006, when jQuery, a fast, small, cross-platform JavaScript library
    designed to simplify the frontend process, entered the scene. By neglecting much
    of the functionality generally left to developers, jQuery has allowed greater
    possibilities to create animations, add plugins, or even browse documents.


    And it''s clearly a success: jQuery was by far the most popular JavaScript library
    in 2015,'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'installing 65% of the 10 million most visited sites on the web.


    # 4. GitHub


    It''s any developer''s worst nightmare - you''re working on a new project feature
    and screwing everything up. Enter version control systems (VCS) and, more more
    specifically, GitHub.


    When you start your project with the service, you can see all the changes made
    or even revert to the previous state (which serves as a remedy for those annoying
    mistakes). The repository hosting service additionally consists of a rich open-source
    development community (making team collaboration as easy as pie) and many other
    components as bug tracking, feature requests, management tasks, and wikis for
    each project.


    Many employers will be looking for good Git skills, so now is a great time to
    apply. Also, it''s a perfect way to get involved and learn from the best with
    a wide range of open-'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'source projects to work on.


    # 5. Twitter Bootstrap


    Are you tired of typing the same style for a container? And that button that keeps
    popping up? Once you start building frontend apps regularly, you''ll begin to
    notice the same patterns emerge.


    UI frameworks attempt to solve these problems by abstracting common elements into
    reusable modules, allowing developers to organize elements of new applications
    with speed and ease.


    Bootstrap is the most used of these frameworks, a complete UI package developed
    by the Twitter team. It comprises tools for standardizing stylesheets, adding
    JavaScript plugins, creating modal objects, and several other features. As a result,
    Bootstrap can dramatically minimize the amount of code (and time) you will use
    while building your project.


    # A Quick Tour of Visual Studio Code'
  merge: -1
