    # File compression


    +   - gzip filename --- compress files to take up much less space. Text files
    are typically compressed to about half their original size, but it strongly depends
    on the file size and the nature of the content. There are other tools for this
    purpose (e.g., compress), but gzip generally provides the highest compression
    rate. Gzip generates files with the ending ''.gz'' appended to the original file
    name.


    +   - gunzip filename --- decompresses files'
