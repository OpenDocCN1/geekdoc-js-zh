    and their components (e.g., elements). Each element of a document (the document
    as a whole, the header, the tables within the document, the table headers, the
    text within the table cells) is part of the document object model for that document,
    so all of them can be accessed and manipulated using the DOM and a programming
    language such as JavaScript.


    At first, JavaScript and DOM were closely intertwined but eventually evolved into
    different entities. The page content is saved in the DOM and is accessible and
