  md: '# UNIX COMMANDS


    Eventually, you’ll be doing more than just coding single-page web documents and
    keeping them in your hard drive. When you’ve gained enough skills, you’ll be creating
    entire websites and hosting them online. That’s when you’ll have to know how to
    manage these projects remotely. UNIX commands exist for this purpose, and this
    chapter will show you why and how.


    UNIX is an OS first developed in the 1960s and has been in constant development
    ever since.'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'By operating system, we mean the set of programs that make the computer work.
    It is a stable, multi-user, and multitasking system for servers, desktops, and
    laptops.


    UNIX systems also have a Microsoft Windows-like graphical user interface (GUI)
    that provides an easy-to-use environment. However, UNIX knowledge is required
    for operations not covered by a graphical program or when a Windows interface
    is unavailable, such as in a telnet session.


    # Types of UNIX


    There are many multiple versions of UNIX, although they all share common similarities.
    The most popularly used varieties of UNIX are MacOS X, Sun Solaris, and GNU/Linux.


    # The UNIX OS


    The UNIX OS consists of three parts; the kernel, shell, and programs.


    # kernel


    The UNIX kernel is the heart of the operating'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'system: it allocates time and memory to programs and manages file storage and
    communications in response to system calls.


    As an illustration of how the kernel and the shell work together, assume a user
    types rm myfile (that has the effect of removing the myfile file). The shell looks
    in the file archive for the file that contains the rm program and then asks the
    kernel, through system calls, to execute the rm program in myfile. When the rm
    myfile process has finished running, the shell gives the UNIX prompt% to the user,
    showing that it is waiting for additional commands.


    # The Shell


    The shell serves as an interface between the kernel and the user. When a user
    signs in, the login program verifies the username and password and then begins
    another program known as the shell. The shell is a CLI (command line interpreter).
    It translates the commands typed by the user and organizes their execution. The
    commands are themselves programs: when they finish, the'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'shell gives the user another prompt (% on our systems).


    The experienced user can customize their shell and users can use different shells
    on the same machine. School staff and students have the tcsh shell by default.


    The tcsh shell has some features to help the user enter commands.


    +   - **Filename completion:** By typing part of a command name, file name, or
    directory name and pressing the [Tab] key, the tcsh shell will automatically fill
    in the rest of the name. If the shell discovers more than one name starting with
    the letters you typed, it will beep and ask you to type a few more keys before
    pressing the Tab key again.

    - **History:** The shell keeps a list of the commands you typed. If you must repeat
    a command, use the cursor keys to scroll up and down the list or type history
    to get a list of previous commands.'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# Files and processes


    Everything in UNIX is a file or a process. A process is a running program identified
    by a unique PID (process identifier).


    A file is a collection of data. Users create files by making use of text editors,
    running compilers, and so on.


    File examples:


    +   - A document (report, essay, etc.)

    - A program text written in a high-level programming language.

    - Instructions that are directly machine-understandable and incomprehensible to
    an occasional user, such as a collection of binary digits (a binary or an executable
    file);

    - A directory containing information about its contents can be a mixture of other
    directories (subdirectories) and ordinary files.


    # Basic UNIX Commands'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'Be aware that not all of these are part of UNIX itself, and you may not find
    them on all UNIX machines. But they can all be used essentially the same way,
    by typing the command and pressing enter. Note that some of these commands are
    not the same on non-Solaris machines.


    If you made an error while typing, the easiest thing to do is press CTRL-u to
    delete the entire line. However, you can also edit the command line. UNIX is case-sensitive.


