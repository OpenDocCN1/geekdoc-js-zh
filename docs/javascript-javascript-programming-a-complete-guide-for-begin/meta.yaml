    \n示例\n\n```javascript\nfunction myFunction() {\n    document.getElementById(\"\
    demo1\").innerHTML = \"Hello Dolly\";\n    document.getElementById(\"demo2\").innerHTML\
    \ = \"How are you?\";\n}\n```\n"
