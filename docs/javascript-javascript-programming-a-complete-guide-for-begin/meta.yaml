  md: '# # JavaScript Keywords


    JavaScript statements often start with a keyword to identify the JavaScript action
    to be performed.


    Here is a list of some of the keywords you will learn about in this tutorial:


    | Keyword | Description |

    | --- | --- |

    | break | Terminates a switch or a loop |

    | continue | Jumps out of a loop and starts at the top |

    | debugger | Stops the execution of JavaScript, and calls (if available) debugging
    function |

    | do ... while | Executes a block of statements, and repeats the block, while
    a condition is true |

    | for | Marks a block of statements to be executed, as long as a condition is
    true |

    | function | Declares a function |

    | if ... else | Marks a block of statements to be executed, depending on a condition
    exits a function |

    | switch | Marks a block of statements to be executed, depending on different
    cases try ... catch Implements error handling to a block of statements |

    | var | Declares a variable |'
