    \ maintenance as well as other ancillary services at no additional costs and this\
    \ helps the companies to cut costs to a large extent.\n\n## JavaScript Where To\n\
    \n### The <script> Tag\n\nIn HTML, JavaScript code must be inserted between <script>\
    \ and </script> tags.\n\nExample\n\n```\n<script>\ndocument.getElementById(\"\
    demo\").innerHTML = \"My First JavaScript\";\n</script>\n```\n\nOld JavaScript\
    \ examples may use a type attribute: `<script type=\"text/javascript\">`.\nThe\
    \ type attribute is not required. JavaScript is the default scripting language\
    \ in HTML.\n\n### JavaScript in <head> or <body>\n\nYou can place any number of\
    \ scripts in an HTML document.\n\nScripts can be placed in the <body>, or in the\
    \ <head> section of an HTML page, or in both.\n\n#### JavaScript in <head>\n\n\
    In this example, a JavaScript function is placed in the <head> section of an HTML\
    \ page. \n\nThe function is invoked (called) when a button is clicked:\n\nExample\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\nfunction myFunction() {\n\
    \  document.getElementById(\"demo\").innerHTML = \"Paragraph changed.\";\n}\n\
    </script>\n</head>\n<body>\n<h1>A Web Page</h1>\n<p id=\"demo\">A Paragraph</p>\n\
    <button type=\"button\" onclick=\"myFunction()\">Try it</button>\n</body>\n</html>\n\
    ```\n\n#### JavaScript in <body>\n\nIn this example, a JavaScript function is\
    \ placed in the <body> section of an HTML page.\n\nThe function is invoked (called)\
    \ when a button is clicked:\n\nExample\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <script>\nfunction myFunction() {\n  document.getElementById(\"demo\").innerHTML\
    \ = \"Paragraph changed.\";\n}\n</script>\n</head>\n<body>\n<h1>A Web Page</h1>\n\
    <p id=\"demo\">A Paragraph</p>\n<button type=\"button\" onclick=\"myFunction()\"\
    >Try it</button>\n</body>\n</html>\n```\n\n```html\n<script>\nfunction myFunction()\
    \ {\n  document.getElementById(\"demo\").innerHTML = \"Paragraph changed.\";\n\
    }\n</script>\n```\n\n</body>\n</html>\n\n## External JavaScript\n\nExternal file:\
    \ myFunction.js\nfunction myFunction() {\n  document.getElementById(\"demo\").innerHTML\
    \ = \"Paragraph changed.\";\n}\nExternal scripts are practical when the same code\
    \ is used in many web pages.\n\nJavaScript files have the extension .js.\n\nTo\
    \ use an external script, put the name of the script file in the src (source)\
    \ attribute of a <script> tag:\n\nExample\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n\n<script src=\"myScript.js\"></script>\n\n</body>\n</html>\n```\n\n##\
    \ External JavaScript Advantages\n\nPlacing scripts in external files has some\
    \ advantages:\n\n- It separates HTML and code\n- It makes HTML and JavaScript\
    \ easier to read and maintain\n- Cached JavaScript files can speed up page loads\n\
    \nTo add several script files to one page - use several script tags:\n\nExample\n\
    \n```html\n<script src=\"myScript1.js\"></script>\n<script src=\"myScript2.js\"\
    ></script>\n```\n\n## External References\n\nExternal scripts can be referenced\
    \ with a full URL or with a path relative to the current web page.\n\nThis example\
    \ uses a full URL to link to a script:\n\nExample\n\n```html\n<script src=\"http://www.w3schools.com/js/myScript1.js\"\
    ></script>\n```\n\nThis example links to a script located in the same folder as\
    \ the current page:\n\nExample\n\n```html\n<script src=\"myScript1.js\"></script>\n\
    ```\n"
  mdcn: "\n\n## 与其他 Web 技术配合\n\n如前所述，TypeScript 开发者可以将其作为客户端脚本语言也可以作为服务端脚本语言。同时，你也可以选择\
    \ JavaScript 作为客户端技术，并与 PHP、Perl 和 Java 等广泛使用的 Web 技术配合使用。该脚本语言也常与 HTML5 和 CSS\
    \ 一起用于开发响应式网站，通过同一套代码库即可在各种设备上访问。\n\n然而，在使用 JavaScript 构建大型网站和 Web 应用时，你必须记住它的某些主要缺点。由于\
    \ JavaScript 代码在网络浏览器中执行，因此它容易受到各种安全攻击。此外，由于不同浏览器对代码的解释方式不同，代码会变得不可预测。\n\n包括 Google\
    \ 在内的主要搜索引擎机器人无法完全、充分地理解 JavaScript 编写的客户端代码。因此，使用过多 JavaScript 的 Web 应用其搜索引擎排名和可见性受到影响。但你仍然可以将\
    \ JavaScript 与 HTML5 和 CSS 等其他流行的 Web 技术结合，创建可在多个设备、系统和浏览器上访问的健壮 Web 应用。\n\n##\
    \ 为什么公司要招聘 JavaScript 开发者？\n\n企业越来越重视招聘 JavaScript 开发者。如今正投入大量的资金、时间和精力来招聘人才，特别是年轻和应届的毕业生，主要是为了他们的专业素质，以及他们契合最新的技术和开发趋势。\n\
    \n现在，有许多原因导致现代企业将资金投入到 JavaScript 开发者身上。\n\n企业青睐这些开发者的首要原因是他们的教育背景。大多数候选人拥有软件工程、计算机科学、信息技术以及与公司经营业务领域相关的学士学位。\n\
    \n然而，某些企业更看重经验，而不是他们所拥有的学位。尽管这是完全另一个问题。\n\n企业投入资金是因为这些专业人士对软件开发生命周期有深入的理解。此外，他们拥有强大的概念——这一事实增强了他们在客户端和服务端语言方面的编程技能。这至关重要，因为并不是每个项目或客户都只需要\
    \ JavaScript，还需要辅助的编程平台。此外，当涉及到个人特质时，这些专业人士具有极强的分析能力和故障排除专长——这在软件开发中非常有用。而且，他们具备了与团队中其他人同步工作所需的心理素质。这本身就足以成为公司招聘他们的理由。\n\
    \n除了这些问题之外，了解他们的职责并拥有卓越的职业眼光也会带来不同。大多数 JavaScript 开发程序都是专门为 Web 端以及通常用于网站和计算机系统的不同服务器应用程序而设计和开发的。\n\
    \n开发完成后，必须对程序进行适当评估。一个优秀的开发者还具备评估这些编程脚本的专业知识，因此公司雇用他们是为了降低成本，因为程序员既可以开发也可以评估脚本。他们还擅长对语言进行广泛测试，以确保其在交付给客户之前运行正常。他们还确保脚本完全没有\
    \ 错误。\n\n这些专业人士（尤其是应届毕业生）对最新的 Java 虚拟机 (JVM) 语言有丰富的知识，这有助于他们更快地完成任务。他们还擅长构建使语言更简单的应用程序。这在最终为公司节省了大量资金。\n\
    \n公司的关键在于寻找参与软件开发社区的最优秀工程师，这样他们才能跟上最新技术并在概念创造方面保持新鲜。这是为了确保企业从对业务发展支柱——JavaScript\
    \ 开发者的投入获得最大的回报。\n\n专家不仅技术高、经验丰富，还精通其他语言，如 c、C++、Net、Python、Joomla 等。他们拥有完美的技能。因此，尽管考虑到当今的通胀，招聘此类专业人士非常有成本效益，但公司仍然对其争相，因为这从短期和长期来看都是值得的。然而，为了节省成本，公司越来越倾向于聘请海外专业人士，而不是雇佣全职个人。这些专业人士提供维护以及其他辅助服务，无需额外费用，这有助于公司在很大程度上降低成本。\n\
    \n## JavaScript 的位置\n\n### <script> 标签\n\n在 HTML 中，JavaScript 代码必须插入在 `<script>`\
    \ 和 `</script>` 标签之间。\n\n示例\n\n```\n<script>\ndocument.getElementById(\"demo\"\
    ).innerHTML = \"My First JavaScript\";\n</script>\n```\n\n旧的 JavaScript 示例可能使用\
    \ `type` 属性：`<script type=\"text/javascript\">`。\n`type` 属性不是必须的。JavaScript 是\
    \ HTML 的默认脚本语言。\n\n <head> 或 <body> 中的 JavaScript\n\n你可以在 HTML 文档中放置任意数量的脚本。\n\
    \n脚本可以放置在 HTML 页面的 `<body>` 部分、`<head>` 部分，或者两者都放。\n\n#### <head> 中的 JavaScript\n\
    \n在此示例中，JavaScript 函数被放置在 HTML 页面的 `<head>` 部分。\n\n当点击按钮时调用（触发）该函数：\n\n示例\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\nfunction myFunction() {\n\
    \  document.getElementById(\"demo\").innerHTML = \"Paragraph changed.\";\n}\n\
    </script>\n</head>\n<body>\n<h1>A Web Page</h1>\n<p id=\"demo\">A Paragraph</p>\n\
    <button type=\"button\" onclick=\"myFunction()\">Try it</button>\n</body>\n</html>\n\
    ```\n\n#### <body> 中的 JavaScript\n\n在此示例中，JavaScript 函数被放置在 HTML 页面的 `<body>`\
    \ 部分。\n\n当点击按钮时调用（触发）该函数：\n\n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <script>\nfunction myFunction() {\n  document.getElementById(\"demo\").innerHTML\
    \ = \"Paragraph changed.\";\n}\n</script>\n</head>\n<body>\n<h1>A Web Page</h1>\n\
    <p id=\"demo\">A Paragraph</p>\n<button type=\"button\" onclick=\"myFunction()\"\
    >Try it</button>\n</body>\n</html>\n```\n\n```html\n<script>\nfunction myFunction()\
    \ {\n  document.getElementById(\"demo\").innerHTML = \"Paragraph changed.\";\n\
    }\n</script>\n```\n\n</body>\n</html>\n```\n\n## 外部 JavaScript\n\n外部文件：myFunction.js\n\
    ```javascript\nfunction myFunction() {\n  document.getElementById(\"demo\").innerHTML\
    \ = \"Paragraph changed.\";\n}\n```\n当同一代码在多个网页中使用时，外部脚本是非常实用的。\n\nJavaScript\
    \ 文件的扩展名为 `.js`。\n\n要使用外部脚本，将脚本文件名放在 `<script>` 标签的 `src`（源）属性中：\n\n示例\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n\n<script src=\"myScript.js\"></script>\n\n</body>\n\
    </html>\n```\n\n## 外部 JavaScript 的优势\n\n将脚本放在外部文件中具有某些优势：\n\n- 分离了 HTML 和代码\n\
    - 使 HTML 和 JavaScript 更于阅读和维护\n- 缓存的 JavaScript 文件可以加快页面加载\n\n要向一个页面添加多个脚本文件——使用多个\
    \ `<script>` 标签：\n\n示例\n\n```html\n<script src=\"myScript1.js\"></script>\n<script\
    \ src=\"myScript2.js\"></script>\n```\n\n## 外部引用\n\n外部脚本可以使用完整 URL 或相对于当前页面的路径引用。\n\
    \n此示例使用完整 URL 链接到脚本：\n\n示例\n\n```html\n<script src=\"http://www.w3schools.com/js/myScript1.js\"\
    ></script>\n```\n\n此示例链接到与当前页面相同文件夹下的脚本：\n\n示例\n\n```html\n<script src=\"myScript1.js\"\
    ></script>\n```\n\n"
