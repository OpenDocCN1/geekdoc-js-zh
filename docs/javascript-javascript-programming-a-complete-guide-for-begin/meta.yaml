    \ = x + 2; // 声明 y，给它赋值为 x + 2\n```\n\n### 多行注释\n\n多行注释以 /* 开头并以 /* 结束。\n\n/*\
    \ /* 和 */ 之间的任何文本都将被 JavaScript 忽略。\n\n此示例使用多行注释（注释块）来解释代码：\n\n示例\n\n```\n/*\n\
