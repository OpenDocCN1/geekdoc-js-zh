    \ 使用算术操作符（+ - * / `）计算值：\n\n### JavaScript 表达式\n\n表达式是值、变量和操作符的组合，计算出一个值。\n\n\
    计算过程被称为求值（evaluation）。\n\n例如，5 * 10 的求值结果为 50：\n\n```javascript\n5 * 10\n```\n\
    \n表达式也可以包含变量值：\n\n```javascript\nx * 10\n```\n\n值可以是各种类型，例如数字和字符串。\n\n例如，\"John\"\
    \ + \" \" + \"Doe\" 的求值结果为 \"John Doe\"：\n\n```javascript\n\"John\" + \" \" +\
    \ \"Doe\"\n```\n\n## JavaScript 关键字\n\nJavaScript 关键字用于标识要执行的操作。\n\n`var` 关键字告诉浏览器创建变量：\n\
    \n```javascript\nvar x, y;\nx = 5 + 6;\ny = x * 10;\n```\n\n## JavaScript 注释\n\
    \n并不是所有的 JavaScript 语句都会被“执行”。\n\n双斜杠 `//` 以及 `/*` 和 `*/` 之间的代码被视为注释。\n\n注释会被忽略，不会被执行：\n\
    \n```javascript\nvar x = 5; // I will be executed\n\n// var x = 6; I will NOT\
    \ be executed\n```\n\n自己尝试 »\n你将在后面的章节中学习更多关于注释的知识。\n\n### JavaScript 标识符\n标识符是名称。\n\
    \n在 JavaScript 中，标识符必须是字母、下划线 (_) 或美元符号 ($)。\n\n### JavaScript 区分大小写\n所有标识符都区分大小写。\n\
    \n```javascript\nvar lastname = \"Doe\";\nvar LastName = \"Doe\";\n```\n\n###\
    \ JavaScript 与驼峰命名法\n\n从历史上，程序员使用三种方法将单词组合为一个：\n\n- 连字符：`first-name`\n- 下划线：`first_name`\n\
    - 驼峰命名法：`firstName`\n\n### JavaScript 字符集\nJavaScript 使用 Unicode 字符集。Unicode 涵盖（几乎）世界上所有的字符、标点和符号。\n\
    \n## JavaScript 语句\n该语句告诉浏览器在 id=\"demo\" 的 HTML 元素内部写入 \"Hello Dolly\"：\n\n示例\n\
    \n```javascript\ndocument.getElementById(\"demo\").innerHTML = \"Hello Dolly\"\
    ;\n```\n\n### JavaScript 程序\n大多数 JavaScript 程序包含许多语句。\n\n语句按照编写顺序逐个执行。\n\n在此例中，x,\
    \ y 和 z 被赋予了值，最后显示了 z：\n\n示例\n\n```javascript\nvar x, y, z;\nx = 5;\ny = 6;\n\
    z = x + y;\ndocument.getElementById(\"demo\").innerHTML = z;\n```\n\n### 分号\n\
    分号隔开 JavaScript 语句。\n\n在每个可执行语句末尾添加分号：\n\n```javascript\na, b, c;\na = 5;\nb =\
    \ 6;\nc = a + b;\n```\n\n当用分号隔开时，允许在一行中写多个语句：\n\n```javascript\na = 5; b = 6;\
    \ c = a + b;\n```\n\n在网页上，你可能会看到没有分号的示例。\n\n语句结尾不需要加分号，但强烈建议加上。\n\n## JavaScript\
    \ 空格\nJavaScript 忽略多个空格。你可以在脚本中添加空格以提高其可读性。\n\n以下行是等价的：\n\n```javascript\nvar\
    \ person = \"Hege\";\nvar person=\"Hege\";\n```\n\n良好的做法是在操作符周围放置空格。\n\n```javascript\n\
    var x = y + z;\n```\n\n## JavaScript 行长度\n为了最佳的可读性，程序员通常喜欢避免代码行超过 80 个字符。\n\n\
    如果一条 JavaScript 语句无法一行，最佳折位置是在操作符之后：\n\n示例\n\n```javascript\ndocument.getElementById(\"\
    demo\").innerHTML = \n\"Hello Dolly\";\n```\n\n## JavaScript 代码块\nJavaScript 语句可以组合在花括号\
