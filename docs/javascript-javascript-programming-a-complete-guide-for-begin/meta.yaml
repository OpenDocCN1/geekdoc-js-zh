  md: '# Java and JavaScript: Not the Same


    A common problem for programmers is confusing the two programming languages Java
    and JavaScript. While the two languages share similarities, they are very different
    beasts and generally used in different applications.


    Java is a general-purpose programming language developed by Sun Microsystems as
    a way to let programmers "write-once, run anywhere". Java code is executed inside
    a virtual machine, so a Java application can be distributed without the developer
    having to worry about the different architectures and operating systems that the
    application might run on.


    JavaScript, on the other hand, is a scripting language. It''s only purpose is
    inside of web pages. When a web browser loads the page, it executes the JavaScript
    code inside it. The code can change how the web page looks and operates. For example,
    JavaScript code can be used to create a drop down menu that expands when you mouse
    over it, or an image gallery where the displayed image changes every so often.'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'This difference is most obvious in the libraries of the two languages. Java
    has a large standard library that has been standardized in the

    Java standard. This allows Java programmers to use a wide variety of tools when
    writing code. JavaScript''s standard library is much smaller and generally related
    to working with the HTML code in the web page.


    Further confusing the two languages is the fact that Java can also be used in
    a web page in the form of a Java applet. This is a small part of the web page
    where Java code runs and is displayed in the browser window.

    Java applets are generally used to create more advanced things in the browser,
    a game for example. JavaScript is not nearly powerful enough to create a complex
    game, so Java is used.

    This is where Java''s platform-independent advantage comes in. As long as the
    web browser has the Java plugin (and most do), the code will run the same no matter
    which web browser is used. This cannot be said for JavaScript, which is often
    implemented differently in the different web browsers, requiring various compatibility
    hacks.'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'And despite the fact that both can be used as web languages, JavaScript is
    vastly more important for the aspiring web programmer to learn. JavaScript''s
    simplicity also means that it runs quickly, so that small things may want to add
    to a web page aren''t boggedged down by Java''s virtual machine. This is a reason
    why Java isn''t used much on the web anymore: because it''s slow. A Java applet
    requires loading the large Java plugin and is overkill for all but large web projects,
    especially when more flexible tools such as HTML5 are becoming more widely used
    on the web.


    Java and JavaScript are two different programming languages. Each of them have
    their uses,but they are not interchangeable with each other.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# How to Use JavaScript to Get User Entry and Use the Entry in a Calculation


    The use of variables are key to all programming languages. You may remember the
    x''s and y''s from your high school algebra class. In programming, variables have
    even more meaning than just some vague idea of an unknown value. In programming,
    a variable is used as the name of a particular information storage area. You can
    then use variable name to call whatever happened to store there. If you throw
    away the old stuff and put something new in the storage are, the variable calls
    the new stuff.


    Some programming languages have to know ahead of time what you plan to store.
    They like to plan ahead of time what size storage area you are renting. Telling
    these language what you plan to store means that you have to declare a data type.
    These types of programming languages are called strongly typed languages. Other
    languages, such as JavaScript, could care less kind of stuff you are storing.'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'They decide what size space you need when you send it to the storage area.
    That is one reason JavaScript is less complicated to learn than some programming
    languages.


    However, there are still some things you will need to learn about data types because
    there are some side effects to not telling what type of information you want to
    store.


    In any case, the information still has a variable name. Here is an exercise that


    +   1) gathers information from a prompt box,

    2) puts it into a variable,

    3) does a calculation, and

    4) sends the answer back in an alert.


    Add this code to the of a new web page


    ```

    var SquareThis = prompt("Enter a number you would like to square.");

    var Answer;


    Answer = SquareThis * SquareThis;


    alert(Answer);",

    ```'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Basic Programming Skills in this Bit of Code


    1. When you do any kind of programming, you have to think of what pieces of information
    the computer will need to identify and hold on. Then you make variables to hold
    the information. In this example, we need to hold two pieces of information, 1)
    the number that will be squared, 2) the answer.


    2. You tell JavaScript that you want it to store information by naming var, a
    space and a variable name.


    3. The first line of this script does three jobs, 1) it tells JavaScript to set
    aside memory space for the variable SquareThis, 2) uses a pre-written function
    to prompt the user for a number, 3) it takes whatever the user types in the prompt
    box and puts it in the memory space for SquareThis.


    4. Notice that the function prompt requires an argument just like the alert()
    did. Notice too that the argument is in "", which means that the argument is a
    String type.


    5. Now the script needs a variable to hold the answer. This is done with "var
    Answer;\ 6. Everything is in place now to do the math: "Answer = SquareThis *
    SquareThis;" The part that tells the computer what kind of math to do is called
    an operator. The main operators are +, -, *, / (subtract, multiply, divide). There
    are many other operators, as well. A square is any number multiplied by itself,
    so this formula multiplies SquareThis by SquareThis.


    7. The program has an answer, but it needs to tell the user. Again, we will use
    an alert box.


    8. Now change the formula to do something else. Try adding another variable and
    another alert() to ask for another number (or several).'
