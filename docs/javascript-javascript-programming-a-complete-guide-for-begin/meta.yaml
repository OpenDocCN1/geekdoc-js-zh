  md: '# JavaScript Comments


    JavaScript comments can be used to explain JavaScript code, and to make it more
    readable.


    JavaScript comments can also be used to prevent execution, when testing alternative
    code.


    # Single Line Comments


    Single line comments start with //.


    Any text between // and the end of the line will be ignored by JavaScript (will
    not be executed).


    This example uses a single-line comment before each code line:


    Example


    ```

    // Change heading:

    document.getElementById("myH").innerHTML = "My First Page";n// Change paragraph:

    document.getElementById("myP").innerHTML = "My first paragraph."

    ```


    This example uses a single line comment at the end of each line to explain the
    code:


    Example


    ```

    var x = 5; // Declare x, give it the value of 5

    var y = x + 2; // Declare y, give it the value of x + 2

    ```


    # Multi-line Comments


    Multi-line comments start with /* and end with *.*'
  merge: -1
