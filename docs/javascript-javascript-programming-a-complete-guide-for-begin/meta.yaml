    myH\").innerHTML = \"My First Page\";\ndocument.getElementById(\"myP\").innerHTML\
    \ = \"My first paragraph.\";\n*/\n```\n\n## JavaScript 变量\n\nJavaScript 变量是存储数据值的容器。\n\
