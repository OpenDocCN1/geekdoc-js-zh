  md: '# JavaScript Variables


    JavaScript Variables


    JavaScript variables are containers for storing data values.


    In this example, x, y, and z, are variables:


    Example


    ```

    var x = 5;

    var y = 6;

    var z = x + y;

    ```


    From the example above, you can expect:


    +   * x stores the value 5

    * y stores the value 6

    * z stores the value 11


    Much Like Algebra


    In this example, price1, price2, and total, are variables:


    Example


    ```

    var price1 = 5;

    var price2 = 6;

    var total = price1 + price2;

    ```


    In programming, just like in algebra, we use variables (like price1) to hold values.


    In programming, just like in algebra, we use variables in expressions (total =
    price1 + price2).'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'From the example above, you can calculate the total to be 11.


    JavaScript variables are containers for storing data values.


    JavaScript Identifiers


    All JavaScript variables must be identified with unique names.


    These unique names are called identifiers.


    Identifiers can be short names (like x and y) or more descriptive names (age,
    sum, totalVolume).


    The general rules for constructing names for variables (unique identifiers) are:


    +   * Names can contain letters, digits, underscores, and dollar signs.

    * Names must begin with a letter

    * Names can also begin with $ and _ (but we will not use it in this tutorial)

    * Names are case sensitive (y and Y are different variables)

    * Reserved words (like JavaScript keywords) cannot be used as names


    JavaScript identifiers are case-sensitive.


    The Assignment Operator

    In JavaScript, the equal sign (=) is an "assignment" operator, not an "equal to"
    operator.


    This is different from algebra. The following does not make sense in algebra:


    ```

    x = x + 5

    ```


    In JavaScript, however, it makes perfect sense: it assigns the value of x + 5
    to x.


    (It calculates the value of x + 5 and puts the result into x. The value of x is
    incremented by 5.)'
  merge: -1
