    您还可以更改已添加到 Dreamweaver 8 的行为。要修改现有行为，请在代码视图（Code View）中找到您想要编辑的行为。选择它，它将出现在行为面板中“添加行为”按钮下方的列表中。从现在起，您可以修改事件发生的顺序、更改触发操作的事件或直接删除该行为。


    ## JavaScript 构建大型 Web 应用的效果如何？


    根据 w3techs.com 上发布的最新统计数据，目前超过 89% 的网站使用 JavaScript 作为客户端编程语言。作为一种跨平台且轻量级的编程语言，JavaScript
    使得程序员更容易构建响应式网站和 Web 应用，这些应用可以与流行的网络浏览器、操作系统和设备无缝协作。它还被程序员广泛用于网络浏览器的一部分，以完成浏览器控制、用户交互和异步通信等重要任务。


    此外，程序员还可以通过 Node.js 和类似的运行时环境将 JavaScript 作为服务器端脚本语言。同时，他们还可以使用各种开源框架来减少构建 JavaScript
    应用所需的时间和精力。它还可以与 HTML5 和 CSS 一起用于创建应用程序和游戏。因此，您可以始终考虑将 JavaScript 作为动态客户端编程语言来构建大型
    Web 应用。


    使用 JavaScript 进行大型 Web 应用开发的优势


    ## 主流网络浏览器支持


    大多数广泛使用的网络浏览器（包括 Firefox、Chrome、Internet Explorer、Safari 和 Opera）都支持 JavaScript。实现
    JavaScript 的新型浏览器也支持。因此，无论用户选择何种浏览器，都可以使用 JavaScript 访问 Web 应用。如果脚本语言由于某些原因被禁用，用户也可以通过启用它访问网站的所有功能。


    ## 无需使用任何特定工具


    JavaScript 是一种解释型编程语言。因此，您可以轻松编写代码而无需使用任何特定工具或程序。您只需打开记事本并开始编写 JavaScript 代码。此外，您可以使用许多编辑器来识别代码中的错误。编辑器会对脚本进行着色或重新格式，以便用户识别错误。


    ## 代码复用选项


    通过简单将代码放置在单独的文件，您可以在多个页面之间进一步复用 JavaScript 代码。将代码放置在页面后，该选项允许您在链接到相同功能的同时避免编写额外的代码。


    ## 许多库和框架


    您可以使用多种框架来减少构建 JavaScript 应用所需的时间和精力。许多程序员更倾向于使用 AngularJS、Ember 和 React 等动态框架。然而，您仍然可以根据特定需求从长列表中进行选择。例如，您可以使用
    Handlebars、Mustache。


    ## 相对更快


    如前所述，JavaScript 是一种客户端脚本语言。因此，代码在用户的系统上执行。由于代码执行时无需与服务器交互，处理速度相对更快。更快的处理使 Web
    应用能够通过提供丰富的体验来留住用户。


    ## 从服务器交付更新的响应数据


    JavaScript 进一步使用 XMLHttpRequest API 进行数据检索。该 API 向 Web 服务器发送 HTTP 或 HTTPS 请求，并将服务器发送的响应加载到脚本中。脚本可以根据从服务器收到的响应轻松更新当前网页。因此，可以通过向用户提供更新信息而无需重新加载网页，从而提高
    Web 应用的性能。


    ## 扩展网站功能


    JavaScript 让您更容易在不付出额外精力的情况下扩展 Web 应用的功能。您可以使用脚本语言在屏幕上创建视觉效果、计算数据并让网页更具交互性。JavaScript
    进一步允许您使用第三方脚本扩展网站功能。这种灵活性让您更容易在不使用任何额外插件或工具的情况下为 Web 应用添加开箱功能。


    ## 减少服务器负载


    服务器端脚本语言需要 Web 服务器在发送响应之前处理用户请求。因此，尽管用户拥有高速互联网连接，该过程仍需要额外的时间。但 JavaScript 代码在用户的机器上处理，不与网络浏览器交互。因此，Web
    服务器的压力和负载大大减轻，同时用户可以获得快速响应。在构建大型网站时，可以使用 JavaScript 为用户提供更快的响应，而不会给服务器带来过大负担。


    ## 优化本地缓存


    JavaScript 可以配合 HTML5 一起使用，使用户在没有活动互联网连接的情况下也能访问网站。这些技术在本地缓存数据方面有效，并在互联网连接恢复之前保持
    Web 应用的响应能力。您甚至可以使用 Kendo UI DataSource 等工具来跟踪本地对对象的更改，并在网络连接恢复后将更改上传到 Web 服务器。该选项允许您让
    Web 应用程序像移动应用程序一样工作。


    '
