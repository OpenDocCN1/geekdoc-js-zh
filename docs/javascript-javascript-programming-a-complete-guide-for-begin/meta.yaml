- img_proc: true
  md: '# JavaScript Operators


    JavaScript uses an assignment operator (= ) to assign values to variables:


    ```

    var x, y;

    x = 5;

    y = 6;

    ```


    JavaScript uses arithmetic operators (+ - * / ) to compute values:


    JavaScript Expressions


    An expression is a combination of values, variables, and operators, which computes
    to a value.


    The computation is called an evaluation.


    For example, 5 * 10 evaluates to 50:


    ```

    5 * 10

    ```


    Expressions can also contain variable values:


    ```

    x * 10

    ```


    The values can be of various types, such as numbers and strings.


    For example, "John" + " " + "Doe", evaluates to "John Doe":


    ```

    "John" + " " + "Doe"

    ```'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# JavaScript Keywords


    JavaScript keywords are used to identify actions to be performed.


    The var keyword tells the browser to create variables:


    ```

    var x, y;

    x = 5 + 6;

    y = x * 10;

    ```


    # JavaScript Comments


    Not all JavaScript statements are "executed".


    Code after double slashes // between /* and */ is treated as a comment.


    Comments are ignored, and will not be executed:


    ```

    var x = 5; // I will be executed


    // var x = 6; I will NOT be executed

    Try it Yourself »

    You will learn more about comments in a later chapter.

    ```


    # JavaScript Identifiers


    Identifiers are names.


    In JavaScript, identifiers are used to name variables (and keywords, and functions,
    and labels).


    The rules for legal names are much the same in most programming languages.'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'In JavaScript, the first character must be a letter, an underscore (_), or
    a dollar sign ($).


    Subsequent characters may be letters, digits, underscores, or dollar signs.


    Numbers are not allowed as the first character.

    This way JavaScript easily distinguish identifiers from numbers.


    # JavaScript is Case Sensitive


    All JavaScript identifiers are case sensitive.


    The variables lastName and lastname, are two different variables.


    ```

    var lastname, lastname;

    lastname = "Doe";

    lastname = "Peterson";

    ```


    JavaScript does not interpret VAR or Var as the keyword var.


    # JavaScript and Camel Case


    Historically, programmers have used three ways of joining multiple words into
    one

    variable name:


    Hyphens:


    first-name, last-name, master-card, inter-city.


    Hyphens are not allowed in JavaScript. It is reserved for subtractions.


    Underscore:


    first_name, last_name, master_card, inter-city.'
