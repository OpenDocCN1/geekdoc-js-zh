  - '[PAGE 29]


    # # Adding JavaScript in Dreamweaver 8


    JavaScript allows you to add interactive elements to a page and perform scripted
    functions on Web pages. Adding JavaScript in Dreamweaver 8 is not difficult, and
    does not require you to know JavaScript programming.


    In Dreamweaver 8, JavaScript is a "behavior" and is controlled through the Behaviours
    panel. You''ll use the Behaviours panel when adding JavaScript in Dreamweaver
    8 to a Web page you''re working with.


    To open the Behaviours panel, select Windows > Behaviours. Select the + button
    to activate a drop-down menu. The Add Behaviours drop down menu contains about
    twzen common JavaScript-controlled functions you may add to a page in Dreamweaver.
    Common functions like checking browser types and revisions, checking for a plug-in,
    displaying a Pop-up message, validating a form or going to a URL are examples
    of JavaScript behaviours you may add.


    Each behaviour in the Add Behaviours menu has a dialogue box that enables you
    to specify the actions that take place when a certain trigger is encountered.
    Trigger is an action that a visitor to your Web site may perform, such as clicking
    on a link, entering data into a form orousing over a particular location on the
    page.


    You''ll find the Validate Form behaviour useful if you collect typed information
    from your visitors. The Validate Form behaviour can be used to verify that data
    entered by a visitor is in the correct format or contains only valid data. Once
    you have configured the behaviour appropriately, select OK.


    If the behaviour you want to add is not the built-in JavaScript behaviours, you
    may select Get More Behaviours. This selection will take you to the Macromedia
    Dreamweaver Exchange Site. Here you''ll find user-created JavaScript behaviours
    that you may download. One caution: not all behaviours at this location are free
    of charge,'
  - '[PAGE 30]


    but you''ll find that adding new behaviours to your Dreamweaver interface is easy
    when you visit this site.


    You may also change a behaviour you have added to Dreamweaver 8. To modify an
    existing behaviour, find the behaviour you want to edit in Code View. Select it
    and it will appear in the list below the Add Behaviours button in the Behaviours
    panel. From this point, you may modify the order in which events occur, change
    the event that triggers an action or delete the behaviour altogether.'
  - '[PAGE 31]


    # # How Good Is JavaScript for Building a Large Scale Web Application?


    According to the most recent statistics posted on w3techs.com, more than 89% of
    websites currently use JavaScript as a client-side programming language. As a
    cross-platform and lightweight programming language, JavaScript makes it easier
    for programmers to build responsive websites and web applications that work with
    seamlessly with popular web browsers, operating systems and devices. It is also
    widely used by programmers as part of the web browsers to accomplish important
    tasks like browser control, user interaction, and asynchronous communication.


    Also, the programmers have option to use JavaScript as a server-side scripting
    language through Node.js and similar runtime environment. At the same time, they
    can also use a variety of open source frameworks to reduce the amount of time
    and effort required for building JavaScript applications. It can also be used
    along with HTML5 and CSS for creating web applications and games. So you can always
    consider using JavaScript as a dynamic client-side programming language for building
    large scale web applications.


    Advantages of Using JavaScript for Large Scale Web Application Development'
  - '[PAGE 32]


    # Supported by Major Web Browsers


    JavaScript is supported by most of the widely used web browsers including Firefox,
    Chrome, Internet Explorer, Safari and Opera. It is also supported by the new web
    browsers whose vendors have implemented JavaScript. So the users can access the
    web applications using JavaScript regardless of their choice of web browser. They
    also have option to access all functionality of the website by enabling the scripting
    language if it is disable due to some reason.'
  - '[PAGE 33]


    # No Need to Use Any Specific Tools


    JavaScript is an interpreted programming language. So you can easily write the
    code without using any specific tool or program. You can simply open a notepad,
    and start writing JavaScript code. Also, you have option to use a number of editors
    to identify the mistakes in the code. The editors colorize or reformat the script
    to make it easier for users to identify the errors.


    # Option to Reuse the Code


    You can further reuse the JavaScript code across multiple pages simply by placing
    the code in separate files. After placing the code with.js extension, you have
    to save the file which can be linked to multiple web pages by using the <script>
    tag to the HTML code of the page. The option enables you to avoid writing additional
    code while adding the same functionality to various parts of the website.


    # Many Libraries and Frameworks


    You have option to reduce the time and effort required for building large JavaScript
    applications by using several frameworks and libraries. Many programmers prefer
    using dynamic JavaScript frameworks like AngularJS, Backbone, Ember and React.
    However, you still have option to choose from a long list of JavaScript libraries
    according to your specific needs. For instance, you can effectually GUI development
    using libraries like HTMLX, Bootstrap, jQuery UI, DojoWidgets or AngularJS. Likewise,
    you use popular template systems like jQuery Mobile, Handlebars, Mustache and
    Cascade Framework.


    # Comparatively Faster


    As noted earlier, JavaScript is a client-side scripting language. So the code
    is executed on user''s system. As the code is executed without any server interaction,
    the processing is done at a comparatively faster. The faster processing enables
    the web application to keep the users engaged by delivering richer browsing experience.'
  - '[PAGE 34]


    # Deliver Updated Response Data from the Server


    JavaScript further uses the XMLHttpRequest API for data retrieval. The API sends
    HTTP or HTTPS requests to the web server, and load the response sent by the server
    in the script. The script can easily update the current web page based on the
    response data received from the server without reloading a new web page. So you
    can boost the web application''s performance by providing updated information
    to the users without reloading the web page completely.'
  - '[PAGE 35]


    # Extend the Website''s Functionality


    JavaScript makes it easier for you to extend the functionality of the web application
    without putting any extra effort. You can use the scripting language to create
    visual effects on the screen, calculate data, and make web pages more interactive.
    JavaScript further allows you to extend the website''s functionality by using
    third-party scripts. The flexibility makes it easier for you to add out-of-thebox
    features to the web application without using any additional plug-ins or tools.


    # Reduces Load on Server


    The server-side scripting languages require the web server to process the user
    request before response is sent to the user. So the process required additional
    time despite the user having a high-speed internet connection. But the JavaScript
    code is processed on the user''s machine, without interacting with the web browser.
    Thus, the strain and load on the web server is reduced drastically while the user
    gets quick response. You can use JavaScript while building large scale websites
    to provide faster response to users without putting excess strain on the server.


    # Optimizes Local Caching


    JavaScript can be used along with HTML5 to enable users to access websites even
    when there is not active internet connection. The technologies are effective in
    caching data locally, and keep the web application responsive till the internet
    connection is restored. You can even use tools like Kendo UI DataSource to track
    changes made to an object locally, and upload the changes to the web server once
    the network connection is restored. The option enables you to make the web applications
    work just like mobile apps.'
- md: "\n## Works with Other Web Technologies\n\nAs mentioned earlier, TypeScript\
    \ developers can be used as both client side and server side scripting language.\
    \ At the same time, you also have option to use JavaScript as a client side technology\
    \ along with some of the widely used web technologies like PHP, Perl and Java.\
    \ The scripting language is also used widely along with HTML5 and CSS for developing\
    \ responsive websites accessible on a variety of devices using the same code base.\n\
    \nHowever, you must keep in mind some of the major shortcomings of JavaScript\
    \ while using it for building large websites and web applications. As JavaScript\
    \ code is executed on the web browser, it becomes vulnerable to various security\
    \ attacks. Also, the code becomes unpredictable as individual browsers interpret\
    \ it differently.\n\nMajor bots of major search engines including Google cannot\
    \ understand the client-side code written in JavaScript completely and fully.\
