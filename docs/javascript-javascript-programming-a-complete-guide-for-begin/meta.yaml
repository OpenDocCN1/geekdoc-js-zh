    ## JavaScript Keywords


    JavaScript statements often start with a keyword to identify the JavaScript action
    to be performed.


    Here is a list of some of the keywords you will learn about in this tutorial:


    | Keyword | Description |

    | --- | --- |

    | break | Terminates a switch or a loop |

    | continue | Jumps out of a loop and starts at the top |

    | debugger | Stops the execution of JavaScript, and calls (if available) debugging
    function |

    | do ... while | Executes a block of statements, and repeats the block, while
    a condition is true |

    | for | Marks a block of statements to be executed, as long as a condition is
    true |

    | function | Declares a function |

    | if ... else | Marks a block of statements to be executed, depending on a condition
    exits a function |

    | switch | Marks a block of statements to be executed, depending on different
    cases |

    | try ... catch | Implements error handling to a block of statements |

    | var | Declares a variable |


    ## JavaScript Comments


    JavaScript comments can be used to explain JavaScript code, and to make it more
    readable.


    JavaScript comments can also be used to prevent execution, when testing alternative
    code.


    ### Single Line Comments


    Single line comments start with //.


    Any text between // and the end of the line will be ignored by JavaScript (will
    not be executed).


    This example uses a single-line comment before each code line:


    Example


    ```

    // Change heading:

    document.getElementById("myH").innerHTML = "My First Page";

    // Change paragraph:

    document.getElementById("myP").innerHTML = "My first paragraph."

    ```


    This example uses a single line comment at the end of each line to explain the
    code:


    Example


    ```

    var x = 5; // Declare x, give it the value of 5

    var y = x + 2; // Declare y, give it the value of x + 2

    ```


    ### Multi-line Comments


    Multi-line comments start with /* and end with *..


    Any text between /* and */ will be ignored by JavaScript.


    This example uses a multi-line comment (a comment block) to explain the code:


    Example


    ```

    /*

    The code below will change

    the heading with id = "myH"

    and the paragraph with id = "myP"

    in my web page:

    */

    document.getElementById("myH").innerHTML = "My First Page";

    document.getElementById("myP").innerHTML = "My first paragraph.";

    ```


    ### Using Comments to Prevent Execution


    Using comments to prevent execution of code is suitable for code testing.


    Adding // in front of a code line changes the code lines from an executable line
    to a

    comment.


    This example uses // to prevent execution of one of the code lines:


    Example


    ```

    //document.getElementById("myH").innerHTML = "My First Page";

    document.getElementById("myP").innerHTML = "My first paragraph.";

    ```


    This example uses a comment block to prevent execution of multiple lines:


    Example


    ```

    /*

    document.getElementById("myH").innerHTML = "My First Page";

    document.getElementById("myP").innerHTML = "My first paragraph.";

    */

    ```


    ## JavaScript Variables


    JavaScript variables are containers for storing data values.


    In this example, x, y, and z, are variables:


    Example


    ```

    var x = 5;

    var y = 6;

    var z = x + y;

    ```


    From the example above, you can expect:


    - x stores the value 5

    - y stores the value 6

    - z stores the value 11


    ### Much Like Algebra


    In this example, price1, price2, and total, are variables:


    Example


    ```

    var price1 = 5;

    var price2 = 6;

    var total = price1 + price2;

    ```


    In programming, just like in algebra, we use variables (like price1) to hold values.


    In programming, just like in algebra, we use variables in expressions (total =
    price1 + price2).


    From the example above, you can calculate the total to be 11.


    ### JavaScript Identifiers


    All JavaScript variables must be identified with unique names.


    These unique names are called identifiers.


    Identifiers can be short names (like x and y) or more descriptive names (age,
    sum, totalVolume).


    The general rules for constructing names for variables (unique identifiers) are:


    - Names can contain letters, digits, underscores, and dollar signs.

    - Names must begin with a letter

    - Names can also begin with $ and _ (but we will not use it in this tutorial)

    - Names are case sensitive (y and Y are different variables)

    - Reserved words (like JavaScript keywords) cannot be used as names


    JavaScript identifiers are case-sensitive.


    ### The Assignment Operator


    In JavaScript, the equal sign (=) is an "assignment" operator, not an "equal to"
    operator.


    This is different from algebra. The following does not make sense in algebra:


    ```

    x = x + 5

    ```


    In JavaScript, however, it makes perfect sense: it assigns the value of x + 5
    to x.


    (It calculates the value of x + 5 and puts the result into x. The value of x is
    incremented by 5.)


    The "equal to" operator is written like == in JavaScript.


    ## JavaScript Data Types


    JavaScript variables can hold numbers like 100 and text values like "John Doe".


    In programming, text values are called text strings.


    JavaScript can handle many types of data, but for now, just think of numbers and
    strings.


    Strings are written inside double or single quotes. Numbers are written without
    quotes.


    If you put a number in quotes, it will be treated as a text string.


    Example


    ```

    var pi = 3.14;

    var person = "John Doe";

    var answer = ''Yes I am!'';

    ```


    ## Declaring (Creating) JavaScript Variables


    Creating a variable in JavaScript is called "declaring" a variable.


    You declare a JavaScript variable with the var keyword:


    ```

    var carName;

    ```

    After the declaration, the variable has no value. (Technically it has the value
    of undefined)


    To assign a value to the variable, use the equal sign:


    ```

    carName = "Volvo";

    ```


    You can also assign a value to the variable when you declare it:


    ```

    var carName = "Volvo";

    ```


    In the example below, we create a variable called carName and assign the value

    "Volvo" to it.


    Then we "output" the value inside an HTML paragraph with id="demo":


    Example


    ```html

    <p id="demo"></p>

    ```


    ```html

    <script>

    var carName = "Volvo";

    document.getElementById("demo").innerHTML = carName;

    </script>

    ```


    ### One Statement, Many Variables


    You can declare many variables in one statement.


    Start the statement with var and separate the variables by comma:


    ```javascript

    var person = "John Doe", carName = "Volvo", price = 200;

    ```


    A declaration can span multiple lines:


    ```javascript

    var person = "John Doe",

    carName = "Volvo",

    price = 200;

    ```


    ### Value = undefined


    In computer programs, variables are often declared without a value. The value
    can be

    something to be calculated, or something will be provided later, like user input.


    A variable declared without a value will have the value undefined.


    The variable carName will have the value undefined after the execution of this
    statement:


    Example


    ```javascript

    var carName;

    ```


    ### Re-Declaring JavaScript Variables


    If you re-declare a JavaScript variable, it will not lose its value.


    The variable carName will still have the value "Volvo" after the execution of
    these statements:


    Example


    ```javascript

    var carName = "Volvo";

    var carName;

    ```


    ## JavaScript Arithmetic


    As with algebra, you can do arithmetic with JavaScript variables, using operators
    like = and +:


    Example


    ```javascript

    var x = 5 + 2 + 3;

    ```


    You can also add strings, but strings will be concatenated:


    Example


    ```javascript

    var x = "John" + " " + "Doe";

    ```


    Also try this:


    Example


    ```javascript

    var x = "5" + 2 + 3;

    ```


    ## JavaScript Operators


    Example

    Assign values to variables and add them together:


    ```javascript

    var x = 5; // assign the value 5 to x

    var y = 2; // assign the value 2 to y

    var z = x + y; // assign the value 7 to z (x + y)

    ```


    The assignment operator (=) assigns a value to a variable.


    Assignment

    var x = 10;


    Adding

    var x = 5;

    var y = 2;

    var z = x + y;


    The multiplication operator (*) multiplies numbers.


    Multiplying

    var x = 5;

    var y = 2;

    var z = x * y;


    ### JavaScript Arithmetic Operators


    Arithmetic operators are used to perform arithmetic on numbers:


    | Operator | Description |

    | --- | --- |

    | + | Addition |

