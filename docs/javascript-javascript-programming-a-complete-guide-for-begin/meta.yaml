  md: '# Manipulate Elements On A Webpage


    Javascript allows a way to change content or styles of a webpage upon a user interaction
    by a way of the aforementioned events. For example, hovering over a certain text
    can make an image appear, text on a submit button can change on submit, etc.


    # Provide Visual Effects


    Javascript has a host of ways to provide visual effects to a webpage that other
    server-side programming languages cannot. A typical example of this might be some
    fancy image rollover buttons.


    # Enables Dynamic Functions


    Javascript, together with AJAX (asynchronous JavaScript and XML), can be used
    to create dynamic applications. One example of this is to load dynamic content
    onto a webpage without refreshing the page.'
  merge: -1
