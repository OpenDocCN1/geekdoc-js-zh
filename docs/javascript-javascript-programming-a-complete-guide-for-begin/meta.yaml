    \n这种差异在两种语言的库中最为明显。Java 拥有一个巨大的标准库，该库在 Java 标准中已经标准化。这允许 Java 程序员在编写代码时使用各种工具。JavaScript\
    \ 的标准库要小得多，通常与处理网页中的 HTML 代码有关。\n\n进一步让这两种语言产生混淆的是，Java 还可以以 Java applet 的形式用于网页中。这是网页的一个小部分，Java\
    \ 代码在其中运行并在浏览器窗口中显示。Java applet 通常用于在浏览器中创建更高级的内容，例如游戏。JavaScript 的功能远不足以创建一个复杂的游戏，因此使用了\
    \ Java。\n\n这就是 Java 的平台无关优势大用武场。只要网页浏览器安装了 Java 插件（大多数浏览器都有），无论使用哪种网页浏览器，代码的运行都是相同的。这不能适用于\
    \ JavaScript，因为它在不同的网页浏览器中的实现方式往往不同，需要各种兼容性补丁。\n\n尽管两者都可以作为 Web 语言，但对于追求 Web 的程序员来说，学习\
    \ JavaScript 要重要得多。JavaScript 的简单性也意味着它运行速度快，因此网页上添加的小功能不会被 Java 虚拟机拖慢。这就是为什么\
    \ Java 不再被广泛用于 Web 的原因：因为它太慢了。Java applet 需要加载巨大的 Java 插件，对于大型 Web 项目之外的所有项目都是大过其实，特别是当像\
    \ HTML5 这样灵活的工具在 Web 上变得越来越广泛使用时。\n\nJava 和 JavaScript 是两种不同的编程语言。它们都有自己的用途，但它们不能互相替代。\n\
    \n## 如何使用 JavaScript 获取用户输入并在计算中使用该\n\n变量的使用是所有编程语言的关键。你可能还记得高中代数课上的 x 和 y。在编程中，变量的意义比仅仅是未知值的概念要大得多。在编程中，变量被用作特定信息存储区域的名称。然后你可以使用变量名来调用存储在那里的任何内容。如果你丢弃旧内容并在存储区域中放入新内容，变量就会指向新内容。\n\
    \n某些编程语言必须提前知道你打算存储什么。它们喜欢提前规划你正在租用多大的存储区域。告诉这些语言你打算存储什么意味着你必须声明数据类型。这些类型的编程语言被称为强类型语言。其他语言（如\
