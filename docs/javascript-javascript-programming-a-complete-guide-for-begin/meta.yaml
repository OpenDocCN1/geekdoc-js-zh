    \n## Java 和 JavaScript：并不一样\n\n程序员面临的一个常见问题是混淆 Java 和 JavaScript 这两种编程语言。虽然这两种语言有相似之处，但它们是完全不同的东西，通常用于不同的应用程序。\n\
    \nJava 是由 Sun Microsystems 开发的一种通用编程语言，旨在让程序员实现“一次编写，随运行”。Java 代码在虚拟机内部执行，因此 Java\
