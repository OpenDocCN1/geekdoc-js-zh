- md: "\n## JavaScript Output\n\nJavaScript Display Possibilities\nJavaScript can\
    \ \"display\" data in different ways:\n\n- Writing into an alert box, using window.alert().\n\
    - Writing into the HTML output using document.write().\n- Writing into an HTML\
    \ element, using innerHTML.\n- Writing into the browser console, using console.log().\n\
    \n### Using.alert()\nYou can use an alert box to display data:\n\nExample\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n\n<h1>My First Web Page</h1>\n<p>My\
    \ first paragraph.</p>\n\n<script>\nwindow.alert(5 + 6);\n</script>\n\n</body>\n\
    </html>\n```\n\n### Using document.write()\nFor testing purposes, it is convenient\
    \ to use document.write():\n\n# Example\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n\n<h1>My First Web Page</h1>\n<p>My first paragraph.</p>\n\n<script>\n\
    document.write(5 + 6);\n</script>\n\n</body>\n</html>\n```\n\nUsing document.write()\
    \ after an HTML document is fully loaded, will delete all existing HTML:\n\n#\
    \ Example\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\n<h1>My First Web Page</h1>\n\
    <p>My first paragraph.</p>\n\n<button onclick=\"document.write(5 + 6)\">Try it</button>\n\
    \n</body>\n</html>\n```\n\n### Using innerHTML\n\nTo access an HTML element, JavaScript\
    \ can use the document.getElementById(id) method.\n\nThe id attribute defines\
    \ the HTML element. The innerHTML property defines the HTML content:\n\nExample\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n\n<h1>My First Web Page</h1>\n<p>My\
    \ First Paragraph</p>\n\n<p id=\"demo\"></p>\n\n<script>\ndocument.getElementById(\"\
    demo\").innerHTML = 5 + 6;\n</script>\n\n</body>\n</html>\n```\n\nTo \"display\
    \ data\" in HTML, (in most cases) you will set the value of an innerHTML property.\n\
    \n### Using console.log()\n\nIn your browser, you can use the console.log() method\
    \ to display data.\n\nExample\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\n\
    <h1>My First Web Page</h1>\n\nMy first paragraph.\n\n<script>\nconsole.log(5 +\
    \ 6);\n</script>\n\n</body>\n</html>\n```\n\n## JavaScript Syntax\n\nJavaScript\
    \ syntax is the set of rules, how JavaScript programs are constructed.\n\n**JavaScript\
    \ Programs**\nA computer program is a list of \"instructions\" to be \"executed\"\
    \ by the computer.\nIn a programming language, these program instructions are\
    \ called statements.\n\nJavaScript is a programming language.\n\nJavaScript statements\
    \ are separated by semicolons:\n\nExample\n\n```javascript\nvar x, y, z;\nx =\
    \ 5;\ny = 6;\nz = x + y;\n```\n\nIn HTML, JavaScript programs are executed by\
    \ the web browser.\n\n### JavaScript Statements\nJavaScript statements are composed\
    \ of:\n\n- Values, Operators, Expressions, Keywords, and Comments.\n\n### JavaScript\
    \ Values\nThe JavaScript syntax defines two types of values: Fixed values and\
    \ variable values.\n\nFixed values are called literals. Variable values are called\
    \ variables.\n\n## JavaScript Literals\n\nThe most important rules for writing\
    \ fixed values are:\n\nNumbers are written with or without decimals:\n\n```\n\
    10.50\n```\n\n```\n1001\n```\n\nStrings are text, written within double or single\
    \ quotes:\n\n```\n\"John Doe\"\n```\n\n```\n'John Doe'\n```\n\n## JavaScript Variables\n\
    \nIn a programming language, variables are used to store data values.\n\nJavaScript\
    \ uses the var keyword to declare variables.\n\nAn equal sign is used to assign\
    \ values to variables.\n\nIn this example, x is defined as a variable. Then, x\
    \ is assigned (given) the value 6:\n\n```javascript\nvar x;\n```\n\n```javascript\n\
    x = 6;\n```\n\n## JavaScript Operators\n\nJavaScript uses an assignment operator\
    \ (= ) to assign values to variables:\n\n```javascript\nvar x, y;\nx = 5;\ny =\
    \ 6;\n```\n\nJavaScript uses arithmetic operators (+ - * / ) to compute values:\n\
    \n### JavaScript Expressions\n\nAn expression is a combination of values, variables,\
    \ and operators, which computes to a value.\n\nThe computation is called an evaluation.\n\
    \nFor example, 5 * 10 evaluates to 50:\n\n```javascript\n5 * 10\n```\n\nExpressions\
    \ can also contain variable values:\n\n```javascript\nx * 10\n```\n\nThe values\
    \ can be of various types, such as numbers and strings.\n\nFor example, \"John\"\
    \ + \" \" + \"Doe\", evaluates to \"John Doe\":\n\n```javascript\n\"John\" + \"\
    \ \" + \"Doe\"\n```\n\n## JavaScript Keywords\n\nJavaScript keywords are used\
    \ to identify actions to be performed.\n\nThe var keyword tells the browser to\
    \ create variables:\n\n```javascript\nvar x, y;\nx = 5 + 6;\ny = x * 10;\n```\n\
    \n## JavaScript Comments\n\nNot all JavaScript statements are \"executed\".\n\n\
    Code after double slashes // between /* and */ is treated as a comment.\n\nComments\
    \ are ignored, and will not be executed:\n\n```javascript\nvar x = 5; // I will\
    \ be executed\n\n// var x = 6; I will NOT be executed\n```\n\nTry it Yourself\
    \ »\nYou will learn more about comments in a later chapter.\n\n### JavaScript\
    \ Identifiers\nIdentifiers are names.\n\nIn JavaScript, identifiers must be a\
    \ letter, an underscore (_), or dollar sign ($).\n\n### JavaScript is Case Sensitive\n\
    All identifiers are case sensitive.\n\n```javascript\nvar lastname = \"Doe\";\n\
    var LastName = \"Doe\";\n```\n\n### JavaScript and Camel Case\n\nHistorically,\
    \ programmers used three ways of joining words into one:\n\n- Hyphens: `first-name`\n\
    - Underscore: `first_name`\n- Camel case: `firstName`\n\n### JavaScript Character\
    \ Set\nJavaScript uses the Unicode character set. Unicode covers (almost) all\
    \ the characters, punctuations, and symbols in the world.\n\n## JavaScript Statements\n\
    This statement tells the browser to write \"Hello Dolly\" inside an HTML element=\"\
    demo\":\n\nExample\n\n```javascript\ndocument.getElementById(\"demo\").innerHTML\
    \ = \"Hello Dolly\";\n```\n\n### JavaScript Programs\nMost JavaScript programs\
    \ contain many statements.\n\nThe statements are executed, one by one, in the\
    \ same order as they are written.\n\nIn this example x, y, and z are given values,\
    \ and finally z is displayed:\n\nExample\n\n```javascript\nvar x, y, z;\nx = 5;\n\
    y = 6;\nz = x + y;\ndocument.getElementById(\"demo\").innerHTML = z;\n```\n\n\
    ### Semicolons\nSemicolons separate JavaScript statements.\n\nAdd a semicolon\
    \ at the end of each executable statement:\n\n```javascript\na, b, c;\na = 5;\n\
    b = 6;\nc = a + b;\n```\n\nWhen separated by semicolons, multiple statements on\
    \ one line are allowed:\n\n```javascript\na = 5; b = 6; c = a + b;\n```\n\nOn\
    \ the web, you might see examples without semicolons.\n\nEnding statements with\
    \ semicolon is not required, highly recommended.\n\n## JavaScript White Space\n\
    JavaScript ignores multiple spaces. You can add white space to your script to\
    \ make it more readable.\n\nThe following lines are equivalent:\n\n```javascript\n\
    var person = \"Hege\";\nvar person=\"Hege\";\n```\n\nA good practice is to put\
    \ spaces around operators.\n\n```javascript\nvar x = y + z;\n```\n\n## JavaScript\
    \ Line Length and Line Breaks\nFor best readability, programmers often like to\
    \ avoid code lines longer than 80 characters.\n\nIf a JavaScript statement does\
    \ not fit on one line, the best place to break it, is after an operator:\n\nExample\n\
    \n```javascript\ndocument.getElementById(\"demo\").innerHTML = \n\"Hello Dolly\"\
    ;\n```\n\n## JavaScript Code Blocks\nJavaScript statements can be grouped together\
    \ in code blocks, inside curly brackets {...}.\n\nThe purpose of code blocks is\
    \ to define statements to be executed together.\n\nOne place you will find statements\
    \ grouped together in blocks, is in JavaScript functions:\n\nExample\n\n```javascript\n\
    function myFunction() {\n    document.getElementById(\"demo1\").innerHTML = \"\
    Hello Dolly\";\n    document.getElementById(\"demo2\").innerHTML = \"How are you?\"\
    ;\n}\n```\n"
  mdcn: "\n\n## JavaScript 输出\n\nJavaScript 的显示方式\nJavaScript 可以通过不同的方式“显示”数据：\n\n\
    - 使用 `window.alert()` 写入警告框。\n- 使用 `document.write()` 写入 HTML 输出中。\n- 使用 `innerHTML`\
    \ 写入 HTML 元素中。\n- 使用 `console.log()` 写入浏览器控制台。\n\n### 使用 .alert()\n你可以使用警告框来显示数据：\n\
    \n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\n<h1>My First Web Page</h1>\n\
    <p>My first paragraph.</p>\n\n<script>\nwindow.alert(5 + 6);\n</script>\n\n</body>\n\
    </html>\n```\n\n### 使用 document.write()\n为了测试之目的，使用 `document.write()` 是方便的：\n\
    \n# 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\n<h1>My First Web Page</h1>\n\
    <p>My first paragraph.</p>\n\n<script>\ndocument.write(5 + 6);\n</script>\n\n\
    </body>\n</html>\n```\n\n在 HTML 文档完全加载后使用 `document.write()`，将删除所有现有的 HTML：\n\n\
    # 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\n<h1>My First Web Page</h1>\n\
    <p>My first paragraph.</p>\n\n<button onclick=\"document.write(5 + 6)\">Try it</button>\n\
    \n</body>\n</html>\n```\n\n### 使用 innerHTML\n\n要访问 HTML 元素，JavaScript 可以使用 `document.getElementById(id)`\
    \ 方法。\n\n`id` 属性定义 HTML 元素。`innerHTML` 属性定义 HTML 内容：\n\n示例\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n\n<h1>My First Web Page</h1>\n<p>My First Paragraph</p>\n\
    \n<p id=\"demo\"></p>\n\n<script>\ndocument.getElementById(\"demo\").innerHTML\
    \ = 5 + 6;\n</script>\n\n</body>\n</html>\n```\n\n要在 HTML 中“显示数据”，（在大多数情况下），你将设置\
    \ `innerHTML` 属性的值。\n\n### 使用 console.log()\n\n在你的浏览器中，你可以使用 `console.log()` 方法来显示数据。\n\
    \n示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\n<h1>My First Web Page</h1>\n\
    \nMy first paragraph.\n\n<script>\nconsole.log(5 + 6);\n</script>\n\n</body>\n\
    </html>\n```\n\n## JavaScript 语法\n\nJavaScript 语法是构建 JavaScript 程序的规则集。\n\n**JavaScript\
    \ 程序**\n计算机程序是供计算机“执行”的一系列“指令”列表。\n在编程语言中，这些程序指令被称为语句。\n\nJavaScript 是一种编程语言。\n\
    \nJavaScript 语句用分号隔开：\n\n示例\n\n```javascript\nvar x, y, z;\nx = 5;\ny = 6;\nz\
    \ = x + y;\n```\n\n在 HTML 中，JavaScript 程序由 Web 浏览器执行。\n\n### JavaScript 语句\nJavaScript\
    \ 语句由以下部分组成：\n\n- 值、操作符、表达式、关键字和注释。\n\n### JavaScript 值\nJavaScript 语法定义了两种值：固定值和变量值。\n\
