    the number that will be squared, 2) the answer.


    2. You tell JavaScript that you want it to store information by naming var, a
    space and a variable name.


    3. The first line of this script does three jobs, 1) it tells JavaScript to set
    aside memory space for the variable SquareThis, 2) uses a pre-written function
    to prompt the user for a number, 3) it takes whatever the user types in the prompt
    box and puts it in the memory space for SquareThis.


    4. Notice that the function prompt requires an argument just like the alert()
    did. Notice too that the argument is in "", which means that the argument is a
    String type.


    5. Now the script needs a variable to hold the answer. This is done with "var
    Answer;\ 6. Everything is in place now to do the math: "Answer = SquareThis *
    SquareThis;" The part that tells the computer what kind of math to do is called
    an operator. The main operators are +, -, *, / (subtract, multiply, divide). There
    are many other operators, as well. A square is any number multiplied by itself,
    so this formula multiplies SquareThis by SquareThis.


    7. The program has an answer, but it needs to tell the user. Again, we will use
