    \ JavaScript 变量\n17. JavaScript 运算符（重复）\n18. 如何使用 JavaScript 获取输入并在计算中使用\n19.\
    \ 结论\n\n# JavaScript 编程简介\n\nJavaScript 是一种客户端编程语言，其处理引擎嵌入在 Internet Explorer、Netscape、Firefox\
    \ 等网络浏览器中。这使得处理引擎在浏览时能够读取和解释包含 JavaScript 代码的网页。\n\nJavaScript 首次于 1995 年出现，尽管当时它被称为\
    \ Livescript。这个名字后来被更改为 JavaScript。\n\nJavaScript 的发明是为了为 HTML 页面添加更多令人兴奋的功能。HTML\
    \ 本身相当无聊，除了制作网页之外它做不了什么。相比之下，JavaScript 编程可以提供许多令人兴奋的功能，如计算、允许用户与网页交互、执行验证、操作网页上的元素、提供出色的视觉效果、启用动态功能等。\n\
    \n所有这些功能都为网站用户提供了增强的用户体验。因为 JavaScript 是一种客户端语言，所有这些功能都可以实时可用，而无需浏览器一直引用服务器。这防止了时间延迟并增加了用户的满意度。\n\
    \nJavaScript 基本上是由 Netscape 公司创建的一门语言。该语言在最近几个月里获得了相当大的流行，因为它允许 Web 开发人员修改浏览器行为以及网站内容，而这些是使用传统的\
    \ HTML 工具甚至 CSS 无法完全实现的。在网页上使用 JavaScript 使得开发者能够控制其页面如何对用户的特定操作做出反应和行为、检查页面上显示的文档元素、在提交之前验证表单选项、检查原生浏览器详情、为特定操作设置\
    \ Cookie、为页面添加日期时间，甚至在网站中嵌入简单的微游戏。一旦你有了 OOP（面向对象编程）概念和 HTML 的基础知识，这门语言很容易学习和理解。\n\
    \n# 需要的软件和知识\n\n在开始学习新语言之前，你必须对 HTML 的 head 和 body 区域有基本的了解，并掌握一些用于添加图像、插入超链接、在文本语言中创建段落的简单语句。你可以用于开始\
    \ JavaScript 之旅的软件是基础文本编辑器。Windows 用户可以使用 Notepad 或 Notepad++，Mac 用户可以使用 TextEdit\
    \ 或 TextWler。代码需要一个网络浏览器（首选 Firefox 或 Google Chrome）才能成功编译和运行。\n\n# 入门之旅\n\n一个在\
    \ JavaScript 中打印自定义消息的简单程序看起来如下：\n\n```html\n<html>\n<head>\n<title>JavaScript\
    \ example</title>\n<script language=\"JavaScript\">\n<!--\ndocument.write(\"My\
    \ First JavaScript!\");\n-->\n</script>\n</head>\n<body> Hello World! </body>\n\
    </html>\n```\n\n在上述代码中使用 \"<-\" 和 \"-->\" 确保代码不会被不支持的旧版本浏览器显示。这确保了页面在不支持的浏览器上不会发生故障。\n\
    \n与其他任何 HTML 文件一样，你只需要将上述代码粘贴到 Notepad 中，然后以 \".html\" 扩展名保存。保存完成后，只需右键点击文件并选择“打开方式”。从这里选择一个网络浏览器（如果有\
    \ Mozilla Firefox）。代码将独立运行，结果显示在浏览器窗口中。\n\n# 注意事项\n\nJavaScript 代码大多位于 HTML 的\
    \ \"head\" 部分，但你也可以在 \"body\" 区域使用它们。\n\nJavaScript 代码通常以标签 \"<script language=\"\
    JavaScript\"> 开始并以 \"</script>\" 结束。\n\nJavaScript 代码始终嵌入 HTML 代码中，不能独立存在。\n\n\
    # 警告框\n\n如果你想为网站添加自定义警告框，可以使用 JavaScript 非常方便地实现。添加警告框的代码如下：\n\n```html\n<body>\n\
    <script>\nwindow.alert(\"This is JavaScript Alert Box!\")\n</script>\n</body>\n\
    ```\n\n同样，你可以添加其他警告，例如：\n\n- 1. 确认操作\n\nWindow. Confirm(\"确定要离开此网站吗？\")\n\n- 2.\
    \ 提示操作\n\nWindow.prompt(\"用户名字段留空。\")\n\n让我们更深入地查看使用 JavaScript 编程可以实现的各种功能：\n\
    \n"
