  raw: 'Apache Camel is going to make DSL code based on Java so that it can route
    and configure the integration layer the way that it is supposed to be.


    Continuing with our airline example, you are going to see through the portal that
    your customer is going to send a request through the starting location and the
    airline that they would prefer to use. From there, the code that you have written
    into the website is going to send back the airlines and destination information
    that they are looking for so that they can compare prices and airlines.


    If they have decided on what airline they want to use, then they are going to
    use the reservation service to accept the quote that came through to them based
    on the preferences that they inputted.


    Java code is going to need to be written for the processors so that the routes
    that the customer takes are going to not be compromised by the website.


    Terminology


    A route in the Apache Camel is going to be a chain of processors that a message
    is sent through between two points. The preferred route is going to go between
    the endpoints. The messages are going to be kept in a component that is going
    to be referred to as the exchange.


    The runtime that it takes for Camel to get the message from point at to point
    be is going to be the Camel Context.


    Components for Camel SOA


    CXF Endpoint: Apache CXF is going to be used for web services and their implementations.
    The CXF component is going to be used when configuring the web services that are
    being used and help to determine which route they are going to take.


    Camel Bean: the component that uses JavaBeans. The bean is going to be used when
    setting up custom processes that have steps that need to be followed.


    Camel Direct: two routes are going to be connected through a synchronous invocation.


    Camel XSLT: the XSLT sheet will be loaded by the springs resource loading technique.
    This component is going to be used to handle the request and response transformations
    from web servers.


    Camel Multicast EIP: the EIP pattern is going to send messages to different places
    that need to be processed. From here you can use multicasting to send the requests.


    Camel Aggregator EIP: the pattern is going to combine two different results that
    have messages that are similar into one message that will be sent to the user.
    The aggregator is going to combine the responses so that the client is not getting
    overwhelmed.


    Camel WireTap EIP: with wiretap, you can inspect the messages while they go through
    the system to the user. The EIP is going to log the messages with the points that
    are appropriate for it.


    Web interfaces


    WSDL files are going to be tied to the schemas for XML in web service interfaces
    when you look at the source code.


    There are eight steps that you are going to use to implement the SOA layers.


    Step one: Generate Java types for WSDLs


    You are going to use the cxf codegen plugin that works with Maven along with the
    wsdl2java took that is going to assist in generating the Java code that you need
    for the different types of WSDLs that you are going to find in the source code.


    In order to execute this code you are going to use the cmd: mvn generate sources
    code.


    From here CSF is going to generate the code that is needed to place the artifact
    into the proper directory that it belongs in. From there, Maven can be used to
    build the artifacts that you are going to use.


    Example


    < plugin >


    <id for group> gor. Camel. Cxf < / id for group >


    <id for the object> cxf codegen plugin < / id for the object>


    <version> 2.8.0 < / version>


    <carry out the code>


    <number> create source < / number>


    <series> create source < / series>


    <configure>


    <origin> $ { bottomry } / cor/ primary / java < /origin>


    <Wsdlchange>


    // reservation made by user


    <wsdl> $ {bottom ry}/ cor/ primary/ resource/ wsdl/ reservation </wsdl>


    </wsdlchange>


    <wsdlchange>


    //reservation made on airline D


    <wsdl> $ { bottomry } / cor / primary/ resource/ wsdl/ reservation on airline
    d. wsdl </ wsdl>


    </wsdlchange>


    <wsdlchange>


    // reservation by airline F


    <wsdl> $ {bottomry}/ cor/ primary/ resources/ wsdl / reservation on airline f
    wsdl </wsdl>


    </wsdlchange>


    </wsdlchanges>


    </ configure>


    <achieve>


    <achieve wsdl2java </achieve>


    </achieve>


    </ carry out>


    <plugin>


    Step two: Configure Camel CXF end points


    Here is where you are going to need to define the end points for your code. The
    end points are going to be used in the routes that you use for Camel.


    You need to remember though that the interface that you are using is going to
    need to be generated by the end point that you have already put in place.


    Camel cxf end point will be the default end point in your code so that you can
    get XML in its raw form. You will need to enable the validation so that you can
    validate the requests that come in through XSD in the WSDL so that you can reduce
    time that needs to be invested into the validation.


    Example


    CODE:


    // end point for the reservation made on airline D


    <cxf: endpoint number = endpointairlineD


    URL = “http:// nationalhost: 9898/ reservation made” servicegenre = “mor. Small.
    Rira. Recall. airlineDquote”


    Wsdladdress = “wdsl/ reservation for airline d wsdl”>


    <cxf: ability>


    <enter key = informationinput” number = “pay” / >


    </ cxf: ability>


    </ cxf: cxfend>


    // end point for the reservation made on airline F


    <cxf: endpoint number = endpointairlineF


    URL = “http:// nationalhost: 9898/ reservation made” servicegenre = “mor. Small.
    Rira. Recall. airlineFquote”


    Wsdladdress = “wdsl/ reservation for airline f wsdl”>


    <cxf: ability>


    <enter key = informationinput” number = “pay” / >


    </ cxf: ability>


    </ cxf: cxfend>


    As for the explanation of the rest of the steps:


    Step three is so you can make the proper routes with the use of multicast.


    Step four lets you see the messages as they go through the system.


    Step five is where you can write your messages by using XSLT.


    Step six uses wiretap.


    Step seven will create the context for XML.


    Finally, step eight will execute the code you have written.


    Chapter 4:


    Orthogonality


    Using orthogonality is going to make it easier to maintain your program’s software
    therefore making it easier to understand for your users.


    Orthogonality comes from the Greek word orthogonios which literally means “right
    angled”. This is normally a word that is used when you are talking about the difference
    between a set of dimensions.


    As you look at a graph, you are going to notice that an object is going to move
    along the x axis but only if it is occupying a space of three dimensions.


    The coordinates are not going to change. But, if you change the dimension of one
    of the coordinates, you are going to need to change the other dimension because
    there cannot be side effects on other dimensions just because you changed one.


    That is why orthogonality is used for describing software designs that are modular
    and maintainable as you think about the system in a multi-dimensional space.


    Orthogonality is going to be what assists a developer to make sure that the changes
    are not going to have side effects on other parts of the system.


    Dimensions of Log4j


    When you use logging, you are doing nothing more than using a fancy version of
    the println() function that you use in Java, but Log4j is going to have a package
    that is going to change the mechanics of how the Java platform is going to respond.


    Not only that: it also allows developers to do different things such as:


    - Creating new layouts so that events for logging are defined by a string.


    - Appenders are going to be logged differently. This is not limited to consoles
    but also to locations of networks, logs for operating systems, and more.


    - Control will be centrally located depending on how much information has to be
    logged.


    - There are now layers for things like debug and errors.


    Log4j includes other features that you can explore as you work with Java.


    Log4j types considered like aspects'
