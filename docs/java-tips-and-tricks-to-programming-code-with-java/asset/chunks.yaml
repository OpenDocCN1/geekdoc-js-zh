    # 互联网上使用 Java 客户端 SharePoint 服务


    在本章中，你将学习如何使用 Java 客户端对 SharePoint 文档进行 CRUD（增删改查）操作。重点将是你可以与 Microsoft 配合使用的复制和列表服务中的相关
    Web 服务。


    CRUD 服务也可以用于 `CAML`，它全称为“协作应用程序标记语言”（Collaborative Application Markup Language）。它基于
    XML，将利用与复制和列表时使用的不同方法。


    此外，你将能够构建一个 `CAML` 结构，该结构能够传递为代码中对象分配属性设置的各种条件。


    ## 背景


    当你处理可能以不同形式存在的大量数据，你可以在复合文件中查看这些数据，以便做出任何所需的决策。在此类环境中，会发生不同种类的监控。


    审计（Audit）将确保你正在处理的数据处于持续状态，然后可以将这些报告发送给需要它们的人员，以便将其保存到 SharePoint 中。


    但是，你将使用的引擎需要一个输出写入器概念，以帮助设置在 SharePoint 中的写入。这有助于数据库和 `SMTP` 服务器中发生的写入操作，从而避免需要手动完成所有工作。


    ## 与 SharePoint 通信


    当你使用 SharePoint 时，你将为你需要达到的解决方案编写自己的代码。这些代码将保存到 Microsoft SharePoint 网站上，这些代码也是生成的。


    由于你有两个服务与 Microsoft 配合使用，因此你将访问通过 SharePoint 提供的不同服务。它们将通过两个不同的位置进行通信。


    位置一为：`https://server/site/_vti_bin/Lists.asmx`


    第二个位置：`https://server/site/_vti_bin/Copy.asmx`


    ## 生成 Web 服务包


    为了生成你将使用的 Web 服务包，你将使用 `wsimport` 函数，你可以在查看 Java 安装路径时在 `bin` 目录下找到它。这是基于你安装了
    Java 1.6 版本的假设。


    SharePoint 将在 `HTTPS` 上运行，由于你使用的两个不同的 URL，当你查看正在使用的服务器时，可能会导致 `wsimport` 遇到一些问题。


    在这种情况下，你将得到一个类似下面的错误。


    ```

    [ERROR] bright. Protected.validator.validatorException: XPIK follow building untrue.
    Bright.procted.offered.certified.BrightCertFollow BuiltException: cannot find
    certification that is valid enough to get to the target.

    ```


    此错误发生是因为你使用的文件没有站点运行所需的适当证书。解决此问题的方法是本地下载 `WSDL` 文件。


    ### 示例：复制服务代码


    ```

    C : \ parma > "% JAVA_NATIONAL% \ nib \ swimport “ -e . -a come.microsoft. schemas.
    Sharpoint. Clean – hold -addmore -Anothing Copy. Swld

    ```


    解析 `DLSW`


    ```

    [ALERT] CLEAN opening “copyclean91” : please us a different holding than this
    Section 34 of file : / C: / parma/ Copy/ swdl

    ```


    代码正在创建


    ### 示例二：列表服务代码


    ```

    C : \ parma > "% JAVA_NATIONAL% \ nib \ swimport “ -e . -a come.microsoft. schemas.
    Sharpoint. Clean – hold -addmore -Anothing list. Swld

    ```


    解析 `DLSW`


    ```

    [ALERT] CLEAN opening “listclean91” : please us a different holding than this
    Section 34 of file : / C: / parma/ list/ swdl

    ```


    代码正在创建


    代码创建后，可以将其添加到你制作的解决方案中并使用。编译选项可以更改为不同的命令。然而，这样做将在你的源码内部以不同的方式创建类文件，同时允许 `Eclipse`
    在我们已经编写出源码的情况下对其进行编译。


    ## 安全


    为了让 SharePoint 按照你的要求运行，你需要更改你的流程以引入 `Axis2`。`Axis2` 会产生一些问题，但你可以通过结合 `JCIFS`
    和 `Axis2` 来克服这些。不过，你可能认为这有些过度了，但它会在实现你目标的同时，让完成你想要的操作变得更容易。


    如果你使用的网站拥有 `cacerts` 文件并已更新到其所在位置，只要站点的证书也是最新的，你就可以使用它。


    ```

    ajave.web.lss.trustbought – 你将使用此更新你正在使用的文件。

    ```


    # 第 3 章：使用 Apache Camel 进行 SOA 集成


    `Apache Camel` 是一种面向你运行的程序架构的集成服务。`Camel` 允许你配置集成，使其适用于 Web 服务，例如消息转换、路由和异常处理，而无需使用过多的
    `Java` 代码。


    `Java` 中的集成主要用于能够快速连接端点并确保高效且易于维护的项目。


    当你查看端点的开发时，集成将是你必须面对的挑战。然而，通过使用 `Apache Camel` 框架可以使其变得更容易。


    `API` 和 `Camel` 的不同组件在企业集成模式（简称 `EIPs`）方面会被广泛认可。`EIPs` 让处理 Web 服务集成所需的任务变得简单。


    ## 企业级集成示例


    想象为一家努力让客户更方便订座的大航空公司工作。现在实现此点的最简单的方法是在线。在创建服务时，它将比较多家航空公司及其价格，以便客户在想要旅行时获得最佳价格。


    将包含多个 Web 服务在其中，因为你所工作的航空公司必须从竞争对手的网站获取价格，以便提供给客户。


    你将根据客户正在寻找的航空体验制作报价列表。客户使用的门户将是他们量身定制的，并提供从目的地到最佳票价的一切所需。


    '
- fmt: "\nApache Camel is going to make DSL code based on Java so that it can route\
    \ and configure the integration layer the way that it is supposed to be.\n\nContinuing\
    \ with our airline example, you are going to see through the portal that your\
    \ customer is going to send a request through the starting location and the airline\
    \ that they would prefer to use. From there, the code that you have written into\
    \ the website is going to send back the airlines and destination information that\
    \ they are looking for so that they can compare prices and airlines.\n\nIf they\
    \ have decided on what airline they want to use, then they are going to use the\
    \ reservation service to accept the quote that came through to them based on the\
    \ preferences that they inputted.\n\nJava code is going to need to be written\
    \ for the processors so that the routes that the customer takes are going to not\
    \ be compromised by the website.\n\n# Terminology\n\nA `route` in the Apache Camel\
    \ is going to be a chain of processors that a message is sent through between\
    \ two points. The preferred `route` is going go between the `endpoints`. The messages\
    \ are going to be kept in a component that is going to be referred to as the `exchange`.\n\
    \nThe runtime that it takes for Camel to get the message from point a to point\
    \ b is going to be the `Camel Context`.\n\n## Components for Camel SOA\n\n- **CXF\
    \ Endpoint**: `Apache CXF` is going to be used for web services and their implementations.\
    \ The `CXF` component is going to be used when configuring the web services that\
    \ are being used and help to determine which `route` they are going to take.\n\
    - **Camel Bean**: the component that uses `JavaBeans`. The `bean` is going to\
    \ be used when setting up custom processes that have steps that need to be followed.\n\
    - **Camel Direct**: two routes are going to be connected through a synchronous\
    \ invocation.\n- **Camel XSLT**: The `XSLT` sheet will be loaded by the springs\
    \ resource loading technique. This component is going to be used to handle the\
    \ request and response transformations from web servers.\n- **Camel Multicast\
    \ EIP**: the `EIP` pattern is going to send messages to different places that\
    \ need to be processed. From here you can use multicasting to send the requests.\n\
    - **Camel Aggregator EIP**: the pattern is going to combine two different results\
    \ that have messages that are similar into one message that will be sent to the\
    \ user. The `aggregator` is going to combine the responses so that the client\
    \ is not getting overwhelmed.\n- **Camel WireTap EIP**: with `wiretap`, you can\
    \ inspect the messages while they go through the system to the user. The `EIP`\
    \ is going to log the messages with the points that are appropriate for it.\n\n\
    # Web interfaces\n\n`WSDL` files are going to be tied to the schemas for `XML`\
    \ in web service interfaces when you look at the source code.\n\nThere are eight\
    \ steps that you are going to use to implement the SOA layers.\n\n### Step one:\
    \ Generate Java types for WSDLs\n\nYou are going to use the `cxf codegen plugin`\
    \ that works with `Maven` along with the `wsdl2java` that is going to assist in\
    \ generating the Java code that you need for the different types of `WSDL` that\
    \ you are going to find in the source code.\n\nIn order to execute this code you\
    \ are going to use the cmd: `mvn generate sources code`.\n\nFrom here `CSF` is\
    \ going to generate the code that is needed to place the artifact into the proper\
    \ directory that it belongs in. From there, `Maven` can be used to build the artifacts\
    \ that you are going to use.\n\n#### Example\n\n```xml\n<plugin>\n    <id for\
    \ group>gor. Camel.Cxf</id for group>\n    <id for the object>cxf codegen plugin</id>\n\
    \    <version>2.8.0</version>\n    <carry out the code>\n        <number>create\
    \ source</number>\n        <series>create source</series>\n        <configure>\n\
    \            <origin>${bottomry}/cor/ primary / java</origin>\n            <Wsdlchange>\n\
    \                // reservation made by user\n                <wsdl>${bottomry}/cor/primary/resource/wsdl/reservation</wsdl>\n\
    \            </wsdlchange>\n            <wsdlchange>\n                //reservation\
    \ made on airline D\n                <wsdl>${bottomry}/cor/primary/resource/wsdl/reservation\
    \ on airline d.wsdl</wsdl>\n            </wsdlchange>\n            <wsdlchange>\n\
    \                // reservation by airline F\n                <wsdl>${bottomry}/cor/primary/resources/wsdl/reservation\
    \ on airline f wsdl</wsdl>\n            </wsdlchange>\n        </configure>\n\
    \        <achieve>\n            <achieve wsdl2java</achieve>\n        </achieve>\n\
    \    </carry out the code>\n</plugin>\n```\n\n### Step two: Configure Camel CXF\
    \ end points\n\nHere is where you are going to need to define the `endpoints`\
    \ for your code. The `endpoints` are going to be used in the `routes` that you\
    \ use for `Camel`.\n\nYou need to remember though that the interface that you\
    \ are using is going to be generated by the `endpoint` that you have already put\
