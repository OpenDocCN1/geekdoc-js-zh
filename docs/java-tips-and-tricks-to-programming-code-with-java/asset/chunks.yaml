  trans: "\nApache Camel 将生成基于 Java 的 DSL 代码，以便它能够按照预期的方式对集成层进行路由和配置。\n\n继续使用我们的航空公司示例，你将通过门户看到你的客户将发送一个请求，请求中包含起始位置和他们偏好使用的航空公司。从那里开始，你在网站上编写的代码将返回他们正在寻找的航空公司和目的地信息，以便他们可以比较价格和航空公司。\n\
    \n如果他们已经决定了想使用哪家航空公司，他们将使用预订服务来接受根据他们输入的偏好所发送给他们的报价。\n\n需要为这些处理器（processors）编写\
    \ Java 代码，以确保客户所经过的路由不会受到网站的干扰。\n\n# 术语\n\nApache Camel 中的 `route`（路由）将是一系列处理器链，消息在两个点之间通过该链发送。首选的\
    \ `route` 将运行于 `endpoints`（端点）之间。消息将保存在在一个称为 `exchange`（交换）的组件中。\n\nCamel 将消息从点\
    \ A 移动到点 B 所需的环境是 `Camel Context`（Camel 上下文）。\n\n## Camel SOA 组件\n\n- **CXF 端点**：`Apache\
    \ CXF` 将用于 Web 服务及其实现。在配置正在使用的 Web 服务时将使用 `CXF` 组件，并帮助确定它们将采取哪条 `route`。\n- **Camel\
    \ Bean**：使用 `JavaBeans` 的组件。在设置需要遵循某些步骤的自定义进程时，将使用 `bean`。\n- **Camel Direct**：两条路由将通过同步调用连接起来。\n\
    - **Camel XSLT**：`XSLT` 表将通过 Spring 资源加载技术加载。该组件将用于处理来自 Web 服务器的请求和响应转换。\n- **Camel\
    \ Multicast EIP**：该 `EIP` 模式将消息发送到需要处理的不同位置。从这里你可以使用多播（multicast）来发送请求。\n- **Camel\
    \ Aggregator EIP**：该模式将具有相似消息的不同结果合并为一条消息并发送给用户。`aggregator`（聚合器）将合并响应，以至于客户端不会信息过载。\n\
    - **Camel WireTap EIP**：通过 `wiretap`（跳线），你可以在消息通过系统到达用户时对其进行检查。`EIP` 将在合适的点记录消息。\n\
    \n# Web 接口\n\n在查看源代码时，`WSDL` 文件将与 Web 服务接口中的 `XML` 架构绑定。\n\n你将使用八个步骤来实现 SOA 层级。\n\
    \n### 第一步：为 WSDL 生成 Java 类型\n\n你将使用与 `Maven` 配合工作的 `cxf codegen plugin` 以及 `wsdl2java`，这将辅助生成你在源代码中发现的不同类型\
    \ `WSDL` 所需的 Java 代码。\n\n为了执行此代码，你将使用命令：`mvn generate sources code`。\n\n从这里开始\
    \ `CSF` 将生成所需的代码，并将构件（artifact）放置在它所属的正确目录。从那里，可以使用 `Maven` 构建你将使用的构件。\n\n####\
    \ 示例\n\n```xml\n<plugin>\n    <id for group>gor. Camel.Cxf</id for group>\n  \
    \  <id for the object>cxf codegen plugin</id>\n    <version>2.8.0</version>\n\
    \    <carry out the code>\n        <number>create source</number>\n        <series>create\
    \ source</series>\n        <configure>\n            <origin>${bottomry}/cor/ primary\
    \ / java</origin>\n            <Wsdlchange>\n                // reservation made\
    \ by user\n                <wsdl>${bottomry}/cor/primary/resource/wsdl/reservation</wsdl>\n\
    \            </Wsdlchange>\n            <wsdlchange>\n                //reservation\
    \ made on airline D\n                <wsdl>${bottomry}/cor/primary/resource/wsdl/reservation\
    \ on airline d.wsdl</wsdl>\n            </wsdlchange>\n            <wsdlchange>\n\
    \                // reservation by airline F\n                <wsdl>${bottomry}/cor/primary/resources/wsdl/reservation\
    \ on airline f wsdl</wsdl>\n            </wsdlchange>\n        </configure>\n\
    \        <achieve>\n            <achieve wsdl2java</achieve>\n        </achieve>\n\
    \    </carry out the code>\n</plugin>\n```\n\n### 第二步：配置 Camel CXF 端点\n\n在这里，你需要为你的代码定义\
    \ `endpoints`。这些 `endpoints` 将用于你用于 `Camel` 的 `routes` 中。\n\n但请记住，你正在使用的接口将由你已经部署的\
    \ `endpoint` 生成。\n\n`Camel cxf end point` 将是你代码中的默认 `endpoint`，以便你可以获取原始形式的 `XML`。你需要启用验证，以便验证通过\
    \ `WSDL` 中的 `XSD` 进的请求，从而减少需要投入到验证中的时间。\n\n#### 示例\n\n```xml\n// end point for\
    \ the reservation made on airline D\n<cxf: endpoint number=endpointairlineD\n\
    \    URL=\"http:// nationalhost: 9898/ reservation made\" \n    servicegenre=\"\
    mor. Small. Rira. Recall. airline.\n\"\n    Wchangechange/reservation on. d\"\
    >\n    <cxf: ability>\n        <enter key=\"informationinput\" number=\"pay\"\
    />\n    </cxf: ability>\n</cxf:end>\n\n// end point for the reservation made on\
    \ airline F\n<cxf: endpoint number=endpointairlineF\n    URL=\"http:// nationalhost:\
    \ 9898/ reservation made\" \n    servicegenre=\"mor. Small. Rira. Recall. airlineF=\"\
    \n    reservation f. f\">\n    <cxf: ability>\n        <enter key=\"informationinput\"\
    \ number=\"pay\"/>\n    </cxf: ability>\n</cxf:end>\n```\n"
