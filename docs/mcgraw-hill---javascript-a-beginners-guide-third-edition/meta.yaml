  md: '# Calling Functions with Parameters


    The previous example used three different functions to show three alerts. Although
    it works, it would be nice if you did not need to write a new function for each
    alert. You can avoid this by using parameters. You can create a function to be
    used multiple times to the same thing, but with the new information from the parameters
    each time.


    As mentioned earlier, variables are commonly used as parameters. However, you
    can also use a value as a parameter. You''ll learn about the different types of
    variable parameters, and then take a look at value parameters.


    If you want to send the values of certain variables to the function, you must
    first declare the variables and then be sure they have the values you need before
    you send them. Here, the scope of a variable becomes important. The scope of a
    variable determines where it is and if it is valid. JavaScript has global and
    local variables.


    # Using Global Variables


    Global variables are the variables that you learned about Chapter 3. Because they
    are defined outside any functions, they can be changed anywhere in the script—inside
    or outside of functions. A global variable is declared outside a function, as
    in the following code:


    ```

    var mycar="Honda";nvar paycheck="1200"; // These are global variables being declared

    ```


    The variables in this example can be changed anywhere in the script. This means
    that they can be accidentally overwritten or changed by a function.


    To understand how global variables can be affected by a function, consider an
    example that shows two alerts. You want one alert to tell you how much money you
    need to get a certain car, and the other one to tell you how much money you currently
    have and what type of car you now own. What would happen if you used the following
    code?


    ```

    var mycar="Honda";nvar paycheck="1200";nfunction new_car() {

    mycar="Ferrari";

    paycheck=3500;

    window.alert("You need $"+paycheck+" to get a "

    ```


    It may look like you created new variables inside the function, even though they
    had the same name. However, the script would output the following text in the
    two alerts:


    You need $3500 to get a Ferrari

    You make $3500 and have a Ferrari


    Obviously, this isn''t right.'
