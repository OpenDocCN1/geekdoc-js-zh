  md: '148 JavaScript: A Beginner''s Guide


    # Key Skills & Concepts


    +   - Understanding Event Handler Locations and Uses

    - Learning the Event Handlers

    - Creating Scripts Using Event Handlers

    - Other Ways to Register Events


    When creating scripts, you will often find that there use "events" (such as a
    moving mouse over a certain element or clicking a particular element) to click
    how you want your script to react. The way you do this is through the use of event
    handlers.

    To learn how the event handlers work, you need to learn what they are and why
    they are useful to you. You will then learn where event handlers are placed in
    a document and how to use them. Finally, you will see the various events in JavaScript
    and the event handlers that take care of each event. To get started, this chapter
    presents a general overview of event handlers.


    # What is an Event Handler?


    An event handler is a predefined JavaScript property of an object (in most cases
    an element in the document) that is used to handle an event on a Web page.

    You may ask the question "What is an event?" An event is something that happens
    when the viewer of the page performs some sort of action, such as clicking a mouse
    button, clicking a button on the page, changing the contents of a form, or moving
    the mouse over a link on the page. Events can also occur simply by the page loading
    or other actions.

    When occurs, you are able to use JavaScript event handlers to identify them and
    then perform a specific task or set of tasks. JavaScript enables you to react
    to an action by the viewer and to make scripts that are interactive, and more
    useful to you and to the viewer.


    # Why Event Handlers Are Useful


    Event handlers are useful because they enable you to gain access to the events
    that may occur on the page. For instance, if you wanted to send an alert to the
    viewer when he or she moves the mouse over a link, you could use the event handler
    to invoke the JavaScript alert you coded to react. You are now making things happen
    based on the actions of the viewer, which enables you to make more-interactive
    Web pages.

    Creating this interactivity is what many people find that JavaScript starts to
    become a little more fun to code and to use. With event handlers, you can create
    some surprises for the viewer or make some scripts that will add more functionality
    to the page. JavaScript can make a number of things happen on a Web page that
    will make the page more interesting than a static HTML document.'
  merge: -1
  pgno: 170
