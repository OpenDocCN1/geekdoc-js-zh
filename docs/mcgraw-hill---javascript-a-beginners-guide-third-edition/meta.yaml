  md: '# JavaScript: A Beginner’s Guide


    # Script Tags: Head Section or Body Section


    When adding scripts directly to a Web page rather than using an external file,
    making sure that variable and function declarations are in the head section helps
    to ensure they are available when the script calls them in the body section. However,
    since JavaScript often uses information from the document that may not have loaded
    yet, this become problematic. On the other hand, having a lot of JavaScript code
    in the body section can also be troublesome when you need to edit your HTML code
    (and if the JavaScript code is in the body section it will be after the element(s)
    that have the information JavaScript needs to use to ensure the necessary information
    is loaded). It is preferable to place all of your code into an external JavaScript
    file. Then, you can decide whether you want to place the script tags in the head
    or in the body section.


    If a script needs no information from the document, placing the script tags in
    the head section works very well. For example, you will create a script that sends
    an alert message to the viewer as soon as the page is opened in the browser. To
    make a message pop-up in a small message box, you use a JavaScript method window.alert.


    First, you''ll learn how to create a JavaScript alert, and then you''ll see how
    to build a function that matters and call the function in a script.


    # Creating a JavaScript Alert


    Rather than writing to the screen with the document.write() method, you can create
    a JavaScript alert that pops up in a message box using the window.alert. Like
    the document.write() method, the alert method takes the text string for the alert
    as a parameter, using this format:


    ```

    window.alert("alert_text");

    ```


    The string of text will be displayed in the pop-up box box.


    For example, suppose that you want to display "This is an alert!" in the pop-up
    box. You would write the code in your JavaScript file (we will use the filename
    js_alert.js) for this example like:


    ```

    window.alert("This is an alert!");

    ```


    Now you know how to make the alert up, but how can you get it to appear right
    as the page is opened? You can do this by making sure the script is called before
    the body section of the Web page is loaded. By placing script tags inside the
    <head> and </head> tags of the document, as shown next, you ensure that it will
    be executed before the rest of the page is loaded:


    ```

    <head>

    <title>Functions - Alert!</title>

    <script type="text/javascript" src="js_alert.js"></script>

    </head>

    <body>

    HTML code here

    </body>

    ```'
