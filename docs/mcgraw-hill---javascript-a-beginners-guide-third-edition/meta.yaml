    # The Decrement Operator (--)


    The decrement operator works in the same way as the increment operator, but it
    subtracts 1 from the operand rather than adding 1 to it. As with the increment
    operator, its placement before or after the operand is important.


    If you place the decrement operator before the operand, the operand is decremented,
    and then the remainder of the statement is executed. Here is an example:


    ```

    var num1=2;

    theresult=--num1;

    ```


    Here, the variable num1 is given a value of 2. On the next line, the code subtracts
    1 from num1 and then assigns the result to the variable there. Thus, the variable
    ends up with a value of 1 (2-1).


    When you place the operator after the operand, as in the next example, the rest
    of the statement is executed and the operator decrement:


    ```

    var num1=2;

    theresult=--num1;

    ```'
