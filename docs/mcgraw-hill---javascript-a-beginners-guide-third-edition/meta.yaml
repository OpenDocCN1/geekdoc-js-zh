    # # Ask the Expert


    **Q: Why are there so many assignment operators? If I can write x=x+1 instead
    of x+=1, why do I need to know about the extra assignment operators?


    **A:** They are provided as shortcuts, so that you don’t need to type the variable
    name in the same line. They also cut down the overall size of the script bit,
    which helps with the loading time of the Web page. You can use either method;
    it depends on how much you want to trim the script size or avoid extra typing.
    Also, it is good to know what these assignment operators do, so that you can recognize
    their purpose in scripts.


    **Q: Can I use more than one operator in a statement? What will happen if I do
    that?**


    **A:** Yes, you can use multiple operators in a single statement. The operators
    will be executed according to their precedence in the order of operations, which
    is covered in the next section.

