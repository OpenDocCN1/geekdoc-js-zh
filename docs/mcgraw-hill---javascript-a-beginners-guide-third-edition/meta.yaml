  md: "# The Keypress Event (onkeypress)\n\nThe keypress event occurs when a viewer\
    \ presses down a key on the keyboard and the corresponding character is typed.\
    \ This occurs between the kedown and the keyup events. To take care of this, you\
    \ use the keypress event handler, which can be placed in almost any HTML tag on\
    \ a Web page.\n\n# The Keyup Event (onkeyup)\n\nThe keyup event occurs when the\
    \ viewer lets go of a key on the keyboard, releasing the key. The event handler\
    \ for this is onkeyup, and it can be placed in almost any HTML tag on a Web page.\n\
    \nNOTE\n\nFor more information on the keydown, keypress, and keyup events, go\
    \ to www.quirrelks.org/js/keys.html. This will give you a better idea of how the\
    \ events work in different browsers and the type of coding you will need to use\
    \ with keystrokes cross-browser. Since these are supported somewhat inconsistently\
    \ from browser to browser, they will not be covered in detail in this book at\
    \ this time.\n\n# The Load Event (onload)\n\nThe load event occurs when a Web\
    \ page finishes loading. To handle this event, you use the onload event handler.\n\
    \nKeep in mind the load event occurs at a slightly different time than the alert\
    \ scripts you placed in your pages in earlier chapters. Those started your tasks\
    \ before the remainder of the page began loading. With the load event, however,\
    \ your tasks will be executed as soon as the page finishes the loading process.\n\
    \nIf you want to be shown when the page finishes loading, you could use the following\
    \ code:\n\nNotice that the onload event handler is added in the body\n\n```\n\
    <body onload=\"window.alert('\\m done loading now!');\">\nText for the body of\
    \ the page...\n</body>\n```\n\nWhen the page has finished loading, viewers will\
    \ get alert that tell them it is finished. It will be hard to distinguish the\
    \ timing of the load event from the preceding code de timing the instant alerts\
    \ in alert scripts the page will load very quickly, since it is all text. Figure\
    \ 7-4 shows how the preceding code example could appear in the browser.\n\nIf\
    \ you want to use the onload handler in the script code rather than the body tag,\
    \ you could write this in an external JavaScript file (save it as load_alert.js):\n\
    \n```\nwindow.onload = function() {\n  window.alert('\\m done loading now!');\n\
    };\n```"
