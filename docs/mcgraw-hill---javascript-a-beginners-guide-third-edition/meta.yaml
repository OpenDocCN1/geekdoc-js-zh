  md: '# Chapter 1: Introduction to JavaScript


    # Basic HTML and CSS Knowledge


    While you don''t need to be an HTML guru, you need to know where to place certain
    elements (like the head and body elements) and how to add your own attributes.
    This book will reference scripts in the head section (between the <head> and </head>
    tags) and the body section (between the <body> and </body> tags).


    Occasionally, you will also need to add an attribute to a tag for a script function
    properly. For example, you might need to name a form element using the id attribute,
    as shown in the following code:


    ```

    <input type="text" id="idname" />

    ```


    If you know the basics of tags and attributes, the HTML portion shouldn''t pose
    any problems to learning JavaScript.

    If you don''t have a basic knowledge of HTML, you can learn it fairly quickly
    through a number of media. For example, you can buy a book or look for some helpful
    information on the Web. A good book is HTML: A Beginner''s Guide, Fourth Edition
    by Wendy Willard (McGraw-Hill Professional, 2009). To find information about HTML
    on the Web, check out sites: www.pageresource.com/html and www.w3schools.com/html/default.asp.


    Occasionally, you will need to use CSS to add or change features on a Web page.
    We will mainly use CSS for the purposes of dynamically changing CSS properties
    via JavaScript in this book. A good place to learn CSS is www.w3schools.com/css/css-intro.asp.


    # Basic Editor and Web Browser Knowledge


    Before jumping in coding and with JavaScript, you must be able to use a text editor
    or HTML editor, and a Web browser. You''ll use these tools to create your scripts.


    # Text Editors


    A number of text editors and HTML editors support JavaScript. If you know HTML,
    you''ve probably used an HTML editor to create your HTML files, so might not have
    to change.


    However, some HTML editors have problems related to adding code or placing the
    code itself when you change the file). You may need to use a simpler editor or
    look for an HTML editor that handles the addition of your own JavaScript code
    easily (as as Adobe Dreamweaver). Some examples of text editors are Notepad, TextPad,
    and Simple Text.


    # Web Browsers


    If you''ve been coding in HTML, you probably won''t need to change your browser.
    However, some browsers have trouble with the newer versions of JavaScript. The
    choice of Web browser is ultimately up to you, as long as it''s compatible with
    JavaScript. I recommend one of the following browsers to test your JavaScript
    code:


    +   - Microsoft Internet Explorer version 6.0 or later

    - Mozilla Firefox version 1.0 or later

    - Opera version 6.0 or later'
