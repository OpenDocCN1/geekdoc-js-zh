  md: '# # Understanding Event Handler Locations and Uses


    To see how event handlers work, you need to know where you can place them in a
    document and how to use them to add JavaScript for an event.


    Event handlers can be used in a number of locations. They can be used directly
    within HTML elements by adding special attributes to those elements. They can
    also be used within the `<script> ` and `</script> ` tags or in an external JavaScript
    file.


    To understand better where event handlers are located, you need to learn how to
    add event handlers to your script.


    # ## Using an Event Handler in an HTML Element


    To use an event directly in an HTML element, you need to know the keyword for
    the event handler and where to place the event handler within the HTML code. To
    give you an example, I will introduce the onclick event handler, which is used
    to make something happen when the viewer clicks a specific area of the document.


    One element that can be clicked is a button. So, suppose you want to alert the
    viewer to something when the user clicks a button. You would write something similar
    to the following code:


    ```

    <input type="button" value="Click Me!" onclick="JavaScript code here" />

    ```


    To use an event handler, you add it as an additional attribute to an HTML tag.
    The only difference between an event handler "attribute" and an HTML attribute
    is that you can add JavaScript code inside an event handler attribute rather than
    just an attribute value. In the previous code, you would replace the JavaScript
    code here text with some actual JavaScript code.


    So, to make an alert pop up when the user clicks the button, you can add the necessary
    JavaScript code right inside your onclick attribute, as shown in the following
    example:


    ```

    <body>

    <form>

    <input type="button" value="Click Me!" onclick="window.alert(''Hi!'');" />

    </form>

    </body>

    ```


    The opening tag ends is used


    Notice how the onclick event handler works like an HTML attribute


    The closing tag ends the form


    When the viewer clicks this plain button, an alert will pop up with a greeting.
    Notice that the rules on quotes apply here. Using the onclick event handler as
    an attribute requires you to use double quotes around all of your JavaScript code,
    so when you need quote marks for the alert, you use single quotes in order to
    avoid possible errors.


    Also notice the alert command ends after the alert, which enables you to add additional
    JavaScript code to perform multiple actions on the click event rather than just
    a single JavaScript statement.'
