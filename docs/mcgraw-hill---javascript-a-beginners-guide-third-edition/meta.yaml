    The properties and methods for the DOM nodes will be useful to you as you create
    complex scripts. You will use the innerHTML and style properties quite often the
    remainder of this book, as well as some of the other DOM node properties and methods.


    # Try This 9-1 Add a DOM Node to the Document


    ```

    prjs9_1.html

    prjs9_1.js

    ```


    This project allows you to practice using the new document and DOM node properties
    and methods you have learned in this chapter.


    # Step by Step


    +   1. Create an HTML page with the following code for the body section and save
    it as prjs9_1.html:

    n```html

    <body>

    <div id="div1" title="Gosh!">

    Whatever I feel like I want to write...

    </div>

    <script type="text/javascript" src="prjs9_1.js"></script>

