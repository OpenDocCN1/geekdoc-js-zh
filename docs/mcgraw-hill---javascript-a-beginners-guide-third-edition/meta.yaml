    | productSub | The number of the browser being used (Firefox only) |

    | securityPolicy | An empty string—returned a value in Netscape 4.7 (Firefox only)
    |

    | systemLanguage | The default language used by the operating system (Internet
    Explorer only) |

    | userLanguage | The natural language of the operating system (Internet Explorer
    and Opera) |

    | userAgent | The user agent header for the browser |

    | vendor | An empty string—returned a string representing the vendor of the browser
    being used (Firefox only) |

    | vendorSub | An empty string—returned the version number of the browser being
    used (Firefox only)


    **Table 8-1** Properties of the Navigator Object


