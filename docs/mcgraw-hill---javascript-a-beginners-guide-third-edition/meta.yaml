  md: "# Ask the Expert\n\n**Q: Do I need to use curly brackets on every if/else block?\
    \ I have seen them used in code on the Web without the brackets. Why**\n\n**A:**\
    \ There is a shortcut that allows you to omit the curly brackets if you are only\
    \ going to execute a single JavaScript statement in the if and the else block.\
    \ If you are going to execute more than one statement, the curly brackets should\
    \ be used. For example, look at the following code:\n\n```\nif (x=2) {\n  window.alert(\"\
    Hi\");\n}\nelse {\n  window.alert(\"Bye\");\n}\n```\n\nSince only one JavaScript\
    \ statement is used inside the code blocks, you can use a shortcut that allows\
    \ you to omit the brackets:\n\n```\nif (x=2)\n  window.alert(\"Hi\");\nelse\n\
    \  window.alert(\"Bye\");\n```\n\nAs you see, it can save you some typing (which\
    \ is why you see this technique often in scripts on the Web). Keep in mind, however,\
    \ that if you decide to add more statements one of the blocks, you will need to\
    \ add the brackets back around the code in that block.\n\n**Q: Why am I bothering\
    \ with conditional statements if all I can do is assign the variable value and\
