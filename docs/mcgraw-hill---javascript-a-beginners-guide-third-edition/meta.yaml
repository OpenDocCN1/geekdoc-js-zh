    \ of the navigator object.\n\nNote that with this property, most browser returns\
    \ Mozilla, which was used as the code name for an early version of Netscape Navigator.\n\
    \n**The appName Property** This property allows you to find which type of browser\
    \ is using to view the page. If the browser is Firefox, the value of this property\
    \ will be Netscape. If the browser is Internet Explorer, the value of this property\
    \ will be Microsoft Internet Explorer. Other browsers will have corresponding\
    \ values.\n\nIf you need to know the value for a particular browser, you can create\
    \ a script to alert the value of this property, place the script inside script\
    \ tags on a Web page, and view the page in that browser. You will be alerted to\
    \ the value of the property for that browser. The following code shows how it\
    \ can be coded:\n\n```\nwindow.alert(\"You have \"+navigator.appName);\n```\n\n\
    Since this enables you to find out the type of browser being used, you can create\
    \ a simple browser-detection script.\nSuppose you want to create an alert based\
    \ on your opinion of the browser being used. You could use the navigator.appName\
    \ property to create an if/else block and send the appropriate comment to the\
    \ viewer by the browser type.\n\nThe following code shows an example of how you\
    \ could perform this task:\n\n```\n<body>\n<script type=\"text/javascript\">\n\
    switch (navigator.appName) {\n  case \"Netscape\" : window.alert(\"Firefox/Netscape\
    \ is cool.\"); break;\n  case \"Microsoft Internet Explorer\" : window.alert(\"\
    Internet Explorer is Cool.\"); break;\n  case \"opera\" : window.alert(\"Opera\
    \ is cool.\"); break;\n  default : window.alert(\"What browser is this?\");\n\
    }\n</script>\nHi, and welcome!\n</body>\n```\n\n> A switch block is used to determine\
    \ the value of the navigator .appName property and give the viewer the proper\
    \ alert\n\nAs you can see, the viewer can now find just what you think of the\
    \ browser being used.\nFigure 8-7 shows the alert you would get if you were using\
    \ Firefox to view the page.\n\n**The appVersion Property** This property has a\
    \ value of the number of the browser and some additional information. For example,\
    \ in Firefox 3 for Windows XP, you might see the following text as of this property:\n\
    \n+   5.0 (Windows; en-US)"
