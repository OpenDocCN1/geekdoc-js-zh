    # Try This Summary


    In this project, you were able to use your new knowledge of objects to create
    an object with properties and a method function. You were able to create a Web
    page that displays the prices of different computers in the browser.


    # Understanding Predefined JavaScript Objects


    In JavaScript, there are many predefined objects you can use to gain access to
    certain properties or methods you may need. You can make your scripts even more
    interactive once you learn the various objects and what you can do with.


    This book will be covering a number of the major predefined objects. Some of them
    will be the basis for an entire chapter, while others are smaller and may only
    need a portion of a chapter. To get started, in this chapter, you are going to
    look at the navigator object and history objects, and what you can do with.


    # The Navigator Object


    The navigator object gives you access to various properties of the viewer’s browser,
    such as its name, version and number. And its name comes from the Netscape Navigator
    browser, which preceded Mozilla/Firefox.


    The navigator object is part of the window object, which means you can access
    its properties and methods using window.navigator.property_or_method_name, it
    can also be shortened to simply navigator.property_or_method_name. This is true
    for direct properties or methods of the window object as well (for example, window.alert("Hi");
    could be shortened to simply alert("Hi"); and it would still be valid). You’ll
    commonly see properties and methods of the window object shortened in way to save
    extra typing or to shorten the source code.


    First, take a look at the properties of the navigator object.


    # Properties


    The properties of the navigator object let you find out various things about the
    browser you are viewing. The properties of the navigator object cannot be changed,
    because they are set as read-only. This is so you dont to change the user’s browser
    version from 6.0 to 7.0 or something similar. Inside, you can just find out what
    value of the property is and use it to allow your scripts to do different things
    for different browsers.


    Table 8-1 shows the properties of the navigator object and the values returned
    by each property. Also, if a property only works in one or two of the major browsers
    mentioned in this book, there is a note in parentheses for that property.'
