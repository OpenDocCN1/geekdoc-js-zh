  md: "# The links property (Array)\n\nThe links property, another array, holds a\
    \ value for each link (such as <a href=\"url\">) and linked area of an image map\
    \ (such as <area href=\"url\">) on a page. You can find out how many links are\
    \ on the page by using the document.links.length property.\n\n# The referrer Property\n\
    \nThe referrer property is used for informational purposes and holds the value\
    \ of the URL of the page that the viewer was before arriving at your page (the\
    \ referring page). While this can be useful, the viewer doesn't always come in\
    \ with a referring URL (such as using a bookmark or typing in the address), so\
    \ the value could be nothing. Also, the value of this property isn't always correct,\
    \ because different browsers may consider different types of things referring\
    \ the viewer to the new page, rather than just links.\n\nTo use this property,\
    \ you could send an alert to the viewers of a page telling them where they were\
    \ going to your page. Placing the code in the following example into the document\
    \ would trick:\n\n```\n<body>\n<script type=\"text/javascript\">\n  window.alert(\"\
    You came from \"+document.referrer+\"!\");\n</script>\n</body>\n```\n\nSo, if\
    \ the referring page was http://www.pagerource.com/webdes.ht, an alert saying\
    \ \"You came from http://www.pagerource.com/webdes.ht! would be sent to the viewer.\n\
    \n# The title Property\n\nThe title property holds the string value of the title\
    \ of the HTML document. The title is set inside <title> and </title> tags of a\
    \ page.\n\nYou can use the title property to display the title of the page to\
    \ place somewhere else in the top of the window. The following code would allow\
    \ you to do this:\n\n```\n<head>\n<title>Lions, Tigers and Bears!</title> ← The\
    \ title of the document is set here\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n  document.write(\"<h1>\" + document.title + \"</h1>\"); ← The title is shown\
    \ as a heading to the viewer\n</script>\nLions and tigers and bears were what\
    \ I saw when I went to ...\n</body>\n```\n\nThis displays your title as a heading\
    \ on the page. Figure 9-8 shows the result of this when viewed in a browser."
