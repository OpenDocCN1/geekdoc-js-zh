  md: "# JavaScript: A Beginner’s Guide\n\n**Anonymous Functions** One effective use\
    \ of the function expression is to use it without a function name to create an\
    \ anonymous function. An anonymous function is one that is created and called\
    \ at the same time, and is helpful when you wish to call a function in only one\
    \ place in your code (rather than declaring the function elsewhere in the code\
    \ and reusing it by calling it more than). The following is the general format\
    \ for an anonymous function:\n\n```\nvar varname = function(parameters) {\n  Code\
    \ for function\n};\n```\n\nThis uses the function keyword but not the name. \n\
    Anonymous functions are quite useful when dealing with JavaScript events. For\
    \ example, to react to a user clicking the mouse on a Web page, you could write\
    \ a simple function for a click event on the document and then call it, as in\
    \ the following code:\n\n```\nfunction do_no_click() {\n  window.alert(\"Do not\
    \ click on my page!\");\n}\ndocument.onclick = do_no_click;\n```\n\nThis declares\
    \ the function, then it calls it (without parentheses) to handle the click event.\n\
    \nHowever, you could combine these two steps into one using an anonymous function,\
    \ as follows:\n\n```\ndocument.onclick = function() {\n  window.alert(\"Do not\
    \ click on my page!\");\n};\n```\n\nSince the reaction to this event will only\
    \ be in one place in the JavaScript code, the anonymous function is a handy way\
    \ to handle the event without the need to declare the function elsewhere and then\
    \ call it again. This technique and the type of code used for event handling (such\
    \ as in the code listings above) will be discussed in more detail in Chapter 7.\n\
    \n# Ask the Expert\n\n**Q:** What if I put a function into my script but decide\
    \ not to call it in the script? Will it matter?\n\n**A:** The function won’t be\
    \ executed unless it is called. However, using unused functions makes the code\
    \ more difficult to maintain and will increase the download time for viewers (which\
    \ could make a difference on a slow connection as dial-up or in situations where\
    \ optimization of the download time of the code is desired). Also, if the function\
    \ contains syntax errors, it could send the viewer JavaScript errors and keep\
    \ other things on the Web page from working correctly."
