  md: '# Chapter 4: Using Functions 63


    names, keywords, or other parts of the code that must remain intact). Thus, the
    following code would be valid:


    ```

    function reallycool() {

    var a

    =

    5; var b = 3; var c = 6; }

    ```


    Though it may be more difficult to read, JavaScript will still see it as valid
    code since the proper syntax is otherwise in place.


    The format you choose for the curly brackets will likely depend on your background
    in programming and how you like to see the code. All the styles are acceptable
    to the JavaScript interpreter, so in this book, I will place the opening bracket
    on the same line as the function declaration (as in the second example format
    from this section) and may occasionally place the entirety of a function on one
    line if it is particularly short (as in the third example format in this section).


    # Naming Functions


    As variables, functions need to be carefully named to avoid problems with your
    scripts. The same rules that applied to variables apply to the naming of functions:
    case sensitivity, using allowed characters, avoiding reserved words, and giving
    functions meaningful names.


    > NOTE


    If you already know the rules for naming variables, you may wish to skip this
    section, since the function-naming rules are essentially the same. However, there
    are some details about choosing names for functions that you may find useful.


    # Using Case in Function Names


    Function names are case sensitive, just like variable names. This means that reallycool,
    REALLYCOOL, and ReallyCool represent different functions. Remember that you need
    to call your functions using the same case as you used in your declarations.


    # Using Allowed Characters and Avoiding Reserved Words


    The characters that are allowed for function names are the same as those you can
    use for variable names:


    +   - The function name must begin with a letter or an underscore character (\_).


    +   - The function name cannot contain any spaces.


    Also as variable names, you cannot use JavaScript reserved words for function
    names. Doing so can cause the function to fail, which can cause real problems
    within a script. Refer to the section "Avoiding Reserved Words" in Chapter 3 for
    a complete list of JavaScript reserved words.'
