  md: '# Key Skills & Concepts


    +   * Understanding the Operator Types

    * Understanding Mathematical Operators

    * Understanding Assignment Operators

    * Understanding Comparison Operators

    * Understanding Logical Operators

    * Understanding Order of Operations


    Operators do much of the work in scripts. In the previous chapters, you have seen
    examples of the use of assignment (=) and addition (+) operators. JavaScript offers
    many other types of operators to perform various operations.

    This chapter begins by giving an introduction to the different types of JavaScript
    operators. Then, you will learn about each operator and its use in scripts. Finally,
    you will learn about the order of precedence for operators, which determines which
    operations are performed before.


    # Understanding the Operator Types


    An operator is a symbol or word in JavaScript that performs some sort of calculation,
    comparison, or assignment on one or more values. In some cases, an operator provides
    a shortcut to shorten the code so that you have less to.

    Common calculations include finding the sum of two numbers, combining two strings,
    or dividing two numbers. Some common comparisons might be find if two values are
    equal or to see if one is greater than the other. A shortcut assignment operator
    might be used to assign a new value to a variable so that the variable name does
    not be typed twice.

    JavaScript uses several types of operators:


    +   **Mathematical** These operators are most often used to perform mathematical
    calculations on two values. The mathematical operators probably be the most familiar
    to you. You use symbols such as +, -, and *.


    +   **Assignment** These operators are used to assign new values to variables.
    As you learned in Chapter 3, one of the assignment operators is the symbol =.


    +   **Comparison** These operators are used to compare two values, two variables,
    or perhaps two longer statements. They use symbols as > (for “greater than”) and
    < (for “is less than”).'
