  md: '# Create a Computer Object


    In this project, you create objects on your own and develop the skills involved
    in object creation. The script will create a computer object and then use properties,
    methods, and instances of the object to create feature lists and price lists for
    the different types of computers.


    | pr8_1.html |

    | prjs8_1.js |


    # Step by Step


    +   1. Create an HTML page and add the necessary script tags to point to an external
    JavaScript file named prjs8_1.js.

    2. Create an external JavaScript file and save it as prjs8_1.js. It uses it for
    steps 3–12.

    3. Create an object named computer that has three properties named speed, hspace,
    and ram.

    4. Create an instance of the computer object and name it work_computer. Send the
    string values of 2GH for the speed parameter, 80GB for the hspace parameter, and
    1GB for the ram parameter.

    5. Create an instance of the computer object and name it home_computer. Send the
    string values of 1.5GH for the speed parameter, 40GB for the hspace parameter,
    and 512MB for the ram parameter.

    6. Create an instance of the computer object and name it laptop_computer. Send
    the string values of 1GH for the speed parameter, 20GB for the hspace parameter,
    and 256MB for the ram parameter.

    7. Create a function named get_price() that should be assigned to a variable named
    the_price. If the base price of a computer is 500 and the speed property of an
    object is equal to 2GH, add 200 to the value of the_price; otherwise, add 10 to
    the the_price. If the hspace property of an object is 80GB, add 50 to the value
    of the_price; otherwise, add 25 to the the_price. If the ram property of an object
    is 1GB, add 150 to the value of the_price; otherwise, add 75 to the the_price.
    End the function with a return statement that returns the value of the variable_price.

    8. Add a call to the function created in step 6 to the computer object. Give the
    method the name price.

    9. Assign the value returned by the price() method when used with the work_computer
    instance of the object to a variable named work_computer.price.

    10. Assign the value returned by the price() method when used with the home_computer
    instance of the object to a variable named home_computer.price.

    11. Assign the value returned by the price() method when used with the laptop_computer
    instance of the object to a variable named laptop_computer.price.


    (continued)'
