  md: "# 70 JavaScript: A Beginner’s Guide\n\nThis example defines the same function,\
    \ show_message(), on the first line. The function is followed by two lone window.alert\
    \ commands, and then the line that calls the function. Save the js_alert.js file\
    \ with this new code and then reload the js_alert.html file in your Web browser.\
    \ You should see an interesting result!\n\nThe two alert commands are the first\
    \ executable statements JavaScript, and they come first. The call to our function\
    \ is seen last, so the function is executed last. The result is three alerts,\
    \ in this order:\n\n+   - The user gets alert, “I am first, ha!” and needs to\
    \ click the OK button to get rid of it.\n\n+   - Then the alert that displays\
    \ “I am second, ha!” appears, and the viewer needs to click OK again.\n\n+   -\
    \ Finally, the function executes and the viewer sees “This is an alert!” and needs\
    \ to click OK a third time to end the alert frenzy.\n\nAlthough this example goes\
    \ overboard with its alerts, it helps you understand how function call works.\n\
    \nIf you are not worried about how soon the alerts display, the script can be\
    \ called in the body section as well. You gain more experience coding, choosing\
    \ whether to place script tags in the head or body section will become easier.\
    \ When you use information from the body of the HTML document, the script tags\
    \ typically are placed in the head section with a function set up to initialize\
    \ variables and functions when the page has loaded (this uses event handling,\
    \ which will be discussed in Chapter 7) or are placed in the body section (just\
    \ after the ending `</body>` tag). I will use the latter method in this book.\n\
    \n# Calling a Function from Another Function\n\nCalling a function within another\
    \ function can be a useful way to organize the sequence in which your events will\
    \ occur. Usually, the function is placed inside another function that has a larger\
    \ task to finish.\n\nWhen you place a function call within a function, you should\
    \ define the function that will be called before you define the function that\
    \ calls it, per the earlier suggestion that a function should be defined before\
