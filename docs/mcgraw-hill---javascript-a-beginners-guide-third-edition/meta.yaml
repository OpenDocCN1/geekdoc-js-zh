  md: '176 JavaScript: A Beginner’s Guide


    # Key Skills & Concepts


    +   - Defining Objects

    - Creating Objects

    - Understanding Predefined JavaScript Objects


    Since JavaScript is an object-based language, you need to look at objects to understand
    what they are and how you can use them. The predefined objects in JavaScript are
    very useful; however, to use them effectively, it is a good idea to learn how
    objects work in general and how to create your own objects if you need them.


    This chapter begins by defining what objects are and how objects can be useful
    to you in your scripts. You will then discover how to create and name your own
    objects that you can use in your code. Finally, this chapter introduces the properties
    and methods of the predefined navigator and history objects.


    # Defining Objects


    To begin using JavaScript objects, you need to find out what they are and how
    they can be useful in your scripts. First take a look at what JavaScript objects
    are.


    # What Is an Object?


    An object is a way of modeling something real, even though the object is an abstract
    entity. When you think of an object, you''ll probably want to visualize something
    general, such as a car. When you see a car, you notice that it has certain features,
    or properties. You might see that the car has a radio with a CD player, leather
    seats, and a V-8 engine. All of these are features of the car, or in terms of
    objects, properties of the car.


    You could break this down by making the radio have properties, or you could go
    the other way and make the car part of a larger object. For instance, you could
    say the CD has certain features, such as volume control, radio station presets,
    and a digital interface. If you go the other way, you could say that a car is
    part of an automobile object, which includes cars, vans, trucks, and various other
    vehicles as properties.


    By doing this, you could create a visualization that could be flowed down from
    the top. If you have an automobile that is a car, it would have properties of
    its own such as color, year, make, and model. It would be made up of other objects
    such as tires, a steering wheel, and a dashboard, each of which could have properties
    and objects of its own.


    If you follow the car down of the radio, you could suppose it has a CD radio with
    a digital interface, and you would see a pattern like the following:


    Automobile -> Car -> CD Radio -> Digital Interface'
