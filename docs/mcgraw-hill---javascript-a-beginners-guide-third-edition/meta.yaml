  md: "# Chapter 4: Using Functions\n\nSave the HTML file as js_alert.html and view\
    \ it in your Web browser. As you can see, this would certainly be an easy way\
    \ to show an alert when the page opens. However, because you are learning about\
    \ functions, you will take another approach.\n\n# Using a Function for a JavaScript\
    \ Alert\n\nThe following code uses a function in your external JavaScript file\
    \ to pop up an alert box. In your js_alert.js file, change the code to the following:\n\
    \n```\nNames and begins the function\nfunction show_message() {\n\twindow.alert(\"\
    This is an alert!\"); // The window.alert() command\n} // used in the function\n\
    show_message(); // The function is called and executes, causing the alert to pop\
    \ up\n```\n\nThis example creates a function named show_message() to do the job\
    \ of showing the alert. The alert will be shown only if you call the show_message()\
    \ function somewhere after it is defined. In this case, the function is called\
    \ right after its definition. The result is a small alert box with the message\
    \ “This is an alert!”\n\n![](bbox=[0.335, 0.452, 0.696, 0.532])\n\n> NOTE When\
    \ an alert box appears, you may see the page pause until you click the OK button,\
    \ or it may continue to load while waiting for you to click OK. This depends on\
    \ your browser.\n\nEven though the function is defined, it doesn't mean it will\
    \ be executed first. A function is not executed until it is called; in other words,\
    \ JavaScript will not use the function until it gets the function call in the\
    \ script.\n\nAny commands that come before the function call (and that are not\
    \ part of the function definition) will be executed before the function. For instance,\
    \ we could change the code in the JavaScript file as follows:\n\n```\nThe function\
    \ is defined\nfunction show_message() {\n\twindow.alert(\"This is an alert!\"\
    ); // This alert doesn't happen until the function is called\n}\nwindow.alert(\"\
    I am first, ha ha!\"); // This alert shows up first\nwindow.alert(\"I am second,\
    \ ha ha!\");\nshow_message(); // This alert is second\nThis finally calls the\
    \ function so that the alert inside it can display\n```"
