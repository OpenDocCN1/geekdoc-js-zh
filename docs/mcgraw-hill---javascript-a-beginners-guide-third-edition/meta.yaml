  md: '# Understanding Order of Operations


    **Q: What is with all of the parentheses? Why are they used in some cases but
    not in others? Is there a reason for them?


    **A: The parentheses used so far have been added for the readability of the statements.
    In some cases, it is necessary to use parentheses to get a desired result. This
    is something else that is covered in the next section.


    **Q: Are there any common typos that are made with all of these operators?


    **A: Often, the assignment operator (=) gets used in place of the comparison operator
    (==) because the second equal sign is left off by accident. Also, forgetting to
    use && and typing just & is another common typo that can cause trouble in a script.
    The same sort of mistake can occur with the logical OR (|) and bitwise OR (|)
    operators.


    In JavaScript, the operators have a certain order of precedence. In a statement
    with more than one operator involved, one may be executed before another, even
    though it is not in that the statement. For instance, look at this example:


    ```

    answer=8+7*2;

    ```


    If you remember how this works in mathematics, you will know that the multiplication
    is performed first on the 7*2 part of the statement, even it does not look like
    that is the right order when you read from left to right. The reason the multiplication
    is performed first is that the multiplication operator has a higher precedence
    in the order of operations than the addition operator. So, any multiplication
    within a statement will be performed before any addition, unless you override
    it somehow.


    As with math problems, in JavaScript, the way to override the order of operations
    is through the use of parentheses to set off the portion of the statement that
    should be executed first. Thus, if you wanted to be sure the addition was performed
    first in the preceding example, you would write it as shown here instead:


    ```

    answer=(8+7)*2;

    ```


    If you use more than one set of parentheses or operators of the same precedence
    on the same level, then they are read from left to right, as in this example:


    ```

    answer=(8-7)-(4*3)+(8-2);

    ```


    Since the parentheses are all on the same level (not nested), they are read from
    left to right. The addition and subtraction operators outside the parentheses
    have the same precedence, and thus are also read from left to right.'
