  md: '# Key Skills & Concepts


    +   - Understanding Variables

    - Why Variables Are Useful

    - Defining Variables for Your Scripts

    - Understanding Variable Types

    - Using Variables in Scripts


    Now that you have learned the basics of adding JavaScript to a Web page, it is
    time to get into the inner workings of the language. Since variables are an important
    part of JavaScript coding, you will need to know as much as possible about what
    they are and why they are useful in your scripts. Once you have an understanding
    of how variables work and what they can do, you will be able to move on to other
    topics that build on the use of the various types of variables.

    In chapter, you will begin by learning what variables are and why they are useful.
    You will then move to find out about the methods that are used to declare variables
    and how to assign a value to a variable. Finally, you will see how to use variables
    in your scripts.


    # Understanding Variables


    A variable represents or holds a value. The actual value of a variable can be
    changed at any time. To understand what a variable is, consider a basic statement
    that you may recall from algebra class:


    ```

    x=2

    ```


    The letter x is used as the name of the variable. It is assigned a value of 2.
    To change the value, you simply give x a new assignment:


    ```

    x=4

    ```


    The name of the variable stays the same, but now it represents a different value.

    Taking the math class example one step further, you probably had to solve a problem
    like this:


    ```

    If x=2, then 3+x=?

    ```


    To get the answer, put the value of 2 in place of the variable x in the problem,
    for 3+2=5. If the value of x changes, so does the answer to the problem. So, if
    x=7, then the calculation turns into 3+7, and now the result is 10.'
  merge: -1
  pgno: 56
- img_proc: false
  md: 'Variables in JavaScript are much like those used in mathematics. You give a
    variable name, and then assign it values based on your needs. If the value of
    the variable changes, it will change something that happens within the script.


    # # Why Variables Are Useful


    Using variables offers several benefits:


    +   - They can be used in places where the value they represent is unknown when
    the code is written.

    - They can save you time in writing and updating your scripts.

    - They can make the purpose of your code clearer.


    # # Variables as Placeholders for Unknown Values


    Oentimes, a variable will hold a place in memory for a value that is unknown at
    the time the script is written. A variable value might change based on something
    entered by the viewer or be changed by you later in the script code.


    For instance, you might have a function that takes in certain values based on
    user input (functions will be discussed in Chapter 4). Since the value of user
    input is unknown at the time the script is written, a variable can be used to
    hold the value that will be input by the user. This is true for any sort of user
    input, whether it be in the form of a JavaScript prompt/confirm box, input fields
    in a form, or other methods of input.


    # # Variables as Time-Savers


    Variables speed up script writing because their values can change. When you assign
    a value to a variable at the beginning of a script, the rest of the script can
    simply use the variable in its place. If you decide to change the value later,
    you need to change the code in only one place—where you assigned a value to the
    variable—rather in numerous places.


    For instance, suppose back in math class, you were asked to solve this problem:


    ```

    If x=2, 3+x-1+2-x=?

    ```


    You know that you need to substitute the value of 2 for each x that appears, for
    3+2-1+2=4. If the teacher wants you to do this problem again with a different
    value for x, the whole problem does not need to be rewritten. The teacher can
    just give you the following instruction:


    Solve the above problem for x=4.


    The longer and more complex the problem gets, the more useful the variable becomes.
    Rather than rewriting the same over and over, you can change one variable to offer
    an entirely new result.'
