  md: '# JavaScript: A Beginner’s Guide


    If you wanted to obtain the value of the title attribute of the div element, you
    could use document.getElementById to grab the div element by its id of div1. This
    would be the specified node for the DOM title property. Then, you could access
    the title property of the element node, as in the following code:


    ```

    var me_div = document.getElementById("div1");

    var me_title = me_div.title;

    window.alert("The title of the div element is " + me_title);

    ```


    This works like object properties, as you learned in the previous chapter. The
    me_div.title property returns the string value "All about me!" which is the value
    of the div element’s title attribute.


    Knowing this, you can use the DOM node methods in the same way.


    # DOM Node Methods


    Table 9-4 lists the DOM node methods.


    | Method | Description |

    |---|---|n| addEventListener() | Adds an event listener to the specified node
    to run a function on the event sent to it as a parameter |

    | addChild() | Appends a node as the last child of the specified node |

    | attachEvent() | Attaches an event to the specified node to run on the event
    sent to it as a parameter |

    | blur() | Removes focus from the specified node |

    | click() | Executes the click event on the specified node |

    | cloneNode() | Creates a clone of the specified node |

    | detachEvent() | Detaches an event from the specified node |

    | dispatchEvent() | Executes an event on the specified node |

    | focus() | Gives focus to the specified node |

    | getAttribute() | Returns the value of the attribute name sent to it as a parameter
    on the specified node |

    | getAttributeNS() | Returns the value of the attribute name and namespace sent
    to it as a parameter on the specified node |

    | getAttributeNode() | Returns the attribute node of the attribute name sent to
    it as a parameter for the specified node |

    | getAttributeNodeNS() | Returns the attribute node of the attribute name and
    namespace sent to it as parameters for the specified node |


    Table 9-4 The DOM Node Methods'
