  md: '# 22 JavaScript: A Beginner’s Guide


    # Ask the Expert


    **Q:** Why is there a dot (.) in the document.write() command?


    **A:** Document is one of JavaScript’s predefined objects, and write() is a predefined
    method of the document object. The dot puts the object and the method together
    to make the function work. Chapter 8 explains JavaScript objects, and Chapter
    9 is devoted to the document object.


    **Q:** How do I know when to add the script inside the head section and when to
    add it the body section?


    **A:** The main situation in which to add a script to the body section of a document
    is when you are writing directly to the page. In many cases, most of the scripting
    is accomplished in the head section, since you can use functions to call the code
    in the body section. We will use external scripts in this book, which will eliminate
    much of the dilemma since all the code will be in the external file.


