    > NOTE

    Not all of these properties work cross-browser. You can see more information on
    these properties by visiting http://developer.mozilla.org/en/DOM/Document#Methods
    and http://msdn.microsoft.com/en-us/library/ms531073(VS.aspx).


    # The getElementById Method


    The getElementById method is one that you have been using extensively in the book
    already. It allows you access to an element by the value of its id attribute.
    As you already know, if you have the following code, you can access the element
    with this method:


    ```

    <div id="some_text">This is some text.</div>

    ```


    Since the id attribute of the div element has the value of some_text, the document.getElementById()
    method can access the element using that value as a string parameter:


    ```

    var text_element = document.getElementById("some_text");

    ```


    As you have done before, you could make use of an event that occurs on this element
    and script a reaction to the event.


    # The getElementsByClassName() Method


    This method allows you to get an array filled with all the elements in the document
    that have the specified class name (from a CSS class) as a parameter. For example,
    to obtain all of the elements with a class name of number_one, you could use the
    following code:


    ```

    var my_class = document.getElementsByClassName("number_one");

    ```


    This can be a good way to access a particular group of elements on the page. Since
    it deals with arrays, this method will be discussed in more detail in Chapter
    11.'
