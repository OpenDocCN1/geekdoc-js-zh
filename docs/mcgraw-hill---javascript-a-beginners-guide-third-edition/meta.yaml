  md: '# Chapter 9: The Document Object


    ![](bbox=[0.095, 0.115, 0.904, 0.375])


    # # Welcome!


    Hello, John, and welcome to my page!


    **Figure 9-11** Once the button is clicked, the viewer will get a new page similar
    to this one


    # # The write() Method


    You started using the write() method early in the book, so you should know a bit
    about how it works already; but here''s a brief description of this method, as
    a refresher.

    The document.write() method is used to write a string value to the page. The following
    code would write "hi there" in the body of an HTML document:


    ```

    <body>

    <script type="text/javascript">

    document.write("hi there");

    </script>

    </body>

    ```


    # # The writeln() Method


    The writeln() method works the same way as document.write() method, but adds a
    JavaScript newline character (

    ) at the end of the statement. Recall that Chapter 3 discussed how the JavaScript
    newline character works—it only places a new line in the page source code to make
    it easier to read.


    # **TIP***


    While the newline character only affects the appearance of the source code when
    using document.write(), it can be used to create new lines in display elements
    created by JavaScript such as alert, prompt, and confirm boxes.'
  merge: -1
  pgno: 249
- img_proc: false
  md: '# 228 JavaScript: A Beginner’s Guide


    The appearance of the page itself is not affected by the JavaScript newline character.

    Recall the example from Chapter 3 that split the code into two different lines
    with the newline character:


    ```

    <body>

    <script type="text/javascript">

    document.write("<strong>JavaScript Rules!</strong>\n This is fun.");

    </script>

    </body>

    ```


    Since the document.writ() method adds a newline character at the end of the statement,
    you could rewrite the preceding code using the document.writ():


    ```

    <body>

    <script type="text/javascript">

    document.writ("<strong>JavaScript Rules!</strong>\n This is fun.");

    </script>

    </body>

    ```


    This would put the lines of code on two different lines in the page source, but
    would not affect the appearance of the page in the browser.


    # Creation Methods


    There are also methods of the document object (such as createElement(), createAttribute(),
    and createNode()) that allow you to create various elements or nodes on the page
    using JavaScript. To use them, the new content must be appended as a child of
    an existing node in the DOM. This is where DOM node properties and methods are
    needed.


    # DOM Node Properties


    The DOM node properties are listed in Table 9-3.


    | Property | Description |

    |---|---|

    | attributes | An array of all the attributes in the specified node; the name
    and value properties of this property can be used to access the attribute name
    or attribute value for each member of the array |

    | childNodes | An array of all the child nodes of the specified node |

    | className | Returns the value of the class attribute of the specified node |

    | clientHeight | Returns the height, in pixels, of the specified node |

    | clientWidth | Returns the width, in pixels, of the specified node |

    | dir | Returns the value of the direction of the text in the specified node (ltr
    or rtl) |

    | firstChild | Returns the first child node of the specified node |


    Table 9-3 The DOM Node Properties'
  merge: -1
