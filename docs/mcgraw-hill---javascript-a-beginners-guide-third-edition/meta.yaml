  md: '# Understanding Assignment Operators


    Assignment operators assign a value to a variable. They do not compare two items,
    nor do they perform logical tests.


    When you learned about variables in Chapter 3, you saw how the basic assignment
    operator, the single equal sign (=), is used to give an initial value or a new
    value to a variable, as in this example:


    ```

    var mytime=0;

    ```


    As you know, this assigns a value of 0 to a variable mytime.


    The other assignment operators also give new values to variables, but they do
    so in slightly different ways they perform a simple calculation as well. These
    operators are particularly useful within loops, as you will learn in later chapters.


    Table 5-2 summarizes the assignment operators, which are discussed in more detail
    in the following sections.


    # The Assignment Operator (=)


    You have been using the direct assignment operator since Chapter 3. It assigns
    the value on the right side of the operator to the variable on the left side,
    as in this example:


    ```

    var population=4500;

    ```


    This assigns the value of 4500 to the variable population.


    | Operator | Symbol | Function |

    | --- | --- | --- |

    | Assignment | = | Assigns the value on the right side of the operator to a variable
    |

    | Add and assign | += | Adds the value on the right side of the operator to the
    left side, and then assigns the new value to the variable |

    | Subtract and assign | -= | Subtracts the value on the right side of the operator
    from the left side, and then assigns the new value to the variable |

    | Multiply and assign | *= | Multiplies the value on the right side of the operator
    by the left side, and then assigns the new value to the variable |

    | Divide and assign | /= | Divides the variable on the left side of the operator
    by the value on the right side, and then assigns the new value to the variable
    |

    | Modulus and assign | %= | Takes the integer remainder of dividing the variable
    on the left side by the value on the right side, and assigns the new value to
    the variable |


    Table 5-2 The Assignment Operators'
