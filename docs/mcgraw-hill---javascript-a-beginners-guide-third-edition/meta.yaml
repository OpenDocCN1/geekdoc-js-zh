    # Remember, It''s Java


    JavaScript and Java are two different languages. Java is a full programming language
    that must be compiled (running a program software that converts the high-level
    code to machine language) before a program (often called a Java applet) can be
    executed. Java is more powerful but also more complex. JavaScript doesn''t need
    a compiler and is more lenient in a number of areas, such as syntax.'
