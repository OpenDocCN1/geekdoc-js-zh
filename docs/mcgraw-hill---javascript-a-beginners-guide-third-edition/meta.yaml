  md: 'The mouseover event will become much more useful to you in later chapters when
    you learn more things about what you can do with the various parts of a page.


    # The Mouse Event (onmouseover)


    The mouseover event occurs when a viewer moves the mouse away from an area on
    the page such as a link, linked image, or linked area of an image map. As the
    mouseover event, browsers will support the mouseover event in numerous areas.
    You take care of a mouse event by using the onmouseover event handler.


    Again, you can see the mouseover event most easily by setting up a link and adding
    the onmouseover event handler to the link. This time, you can make an alert pop
    up the user moves the mouse away from the link after passing (assuming it has
    not clicked). To do this, you can use the following code:


    The onmouseover event handler in a link tag


    ```

    <a href="http://www.pagesource.com" onmouseover="window.alert(''What, you didn''t
    like my link?'');"> Click Me!</a>

    ```


    This alert pops up when the viewer moves the mouse off the link and asks the viewer
    a question. Notice the escaped quote mark (\'') used in the word didn''t, which
    keeps you from getting a string error. Figure 7-6 shows this script in action.


    The mouseover event will become much more useful for you as you progress, especially
    when used in tandem with mouseover event.


    ![](bbox=[0.104, 0.563, 0.896, 0.836])


    **Figure 7-6** This alert pops up when the mouse is moved off the link'
