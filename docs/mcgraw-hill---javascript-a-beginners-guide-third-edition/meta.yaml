  md: '# Chapter 5: JavaScript Operators 93


    # # The Division Operator (/)


    The division operator is used to divide the value on its left side by the value
    on its right side. For example, the code 4/2 means 4 divided by 2 and gives the
    result of 2.


    For a JavaScript example of this action, take a look at this code:


    ```

    var num1=10;

    var num2=2;

    var theres=num1/num2;

    window.alert(theres);

    ```


    Two numbers are divided using the division operator


    This gives you an alert that says 5, the result of dividing 10 by 2.


    # # Division by Zero


    When you use the division operator, you need to be careful that you do not end
    dividing by zero in some way. If you do, the result is going to be either infinity
    or undefined, depending on your browser. The code that follows shows an example
    of this happening (although it is unlikely to occur exactly in this):


    ```

    var num1=10;

    var num2=0;

    var theres=num1/num2;

    window.alert(theres);

    ```


    Oh no! On this line you are dividing by zero


    This alert won''t be a number


    If you placed this code in a document, you might see an alert box like this:


    ![](bbox=[0.323, 0.527, 0.686, 0.626])


    To avoid dividing by zero, be careful about what numbers or variables you place
    on the right side of the division operator.


    # # Type Conversions in Division Calculations


    Another thing to remember with division is that if you have two values that do
    not divide evenly, the result is converted into a float, and thus have decimal
    places. The code that follows shows an example:


    ```

    var num1=3;

    var num2=4;

    var theres=num1/num2;

    window.alert(theres);

    ```


    The result in this case is 0.75, which is what you see in the alert box. Some
    browsers may not show the 0 before the decimal, and display .75 in the alert box
    instead.'
