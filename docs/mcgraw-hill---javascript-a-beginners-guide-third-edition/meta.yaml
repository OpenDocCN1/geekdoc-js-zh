  md: '# xxii JavaScript: A Beginner''s Guide


    # What This Book Covers


    The 16 chapters of this book cover specific topics on the JavaScript language.
    The first two chapters cover the most basic aspects of the language: what it is,
    what you need to know to begin JavaScript, and how to place JavaScript into an
    HTML file. The middle of the book (Chapters 3–15) covers beginning JavaScript
    topics from variables all the way to using JavaScript with frames. The final chapter
    (Chapter 16) introduces some advanced techniques, and points you toward resources
    if you want to learn more about JavaScript once you have completed the book.


    This book includes a number of special features in each chapter to assist you
    in learning JavaScript. These features include:


    +   **Key Skills & Concepts** Each chapter begins with a set of key skills and
    concepts that you will understand by the end of the chapter.


    +   **Ask the Expert** The Ask Expert Sections present commonly asked questions
    about topics covered in the preceding text, with responses from the author.


    +   **Try This** These sections get you to practice what you have learned using
    a hands-on approach. Each Try This will allow you to code a script through step-by-step
    directions on what you need to do in order to achieve the goal. You can find solutions
    to each project on the McGraw-Hill/Professional Web site at www.mhprofessional.com/computingdownload.


    +   **Notes, Tips, and Cautions** Notes, Tips, and Cautions call your attention
    to noteworthy statements that you will find helpful as you move through the chapters.


    +   **Code** Code listings display example source code used in scripts or programs.


    +   **Callouts** Callouts display helpful hints and notes about the example, pointing
    to the relevant lines in the code.


    +   **Self Test** Each chapter ends with a Self Test, a series of 15 questions
    to see if you have mastered the topics covered in the chapter. The answers to
    each Self Test can be found in the back of the book in the appendix.


    That is! You are not familiar with the organization and special features of this
    book to start your journey through JavaScript. If you find that you are stuck
    and need help, feel free to get online and visit the JavaScript discussion forums
    on the Web Xpertz site at www.webxpert.net/forums. The forums will allow you to
    interact with other JavaScript coders who may be able to help you with your questions.


    Now it is time to learn JavaScript. Get ready, set, and have fun!'
