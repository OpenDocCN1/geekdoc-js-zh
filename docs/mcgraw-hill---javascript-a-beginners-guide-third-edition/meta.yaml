  md: '# Ask the Expert


    **Q:** Why do I need to learn about variables? Couldn''t I just put in the number
    or text I want to use right where I''m going to use it?


    **A:** You can do that; however, it will make longer scripts much harder to write,
    read, and debug. It also makes it more difficult to update your scripts because,
    in order to change that number or text, you would need to change every line where
    it appears. When you use variables, you can modify just one line of code to change
    the value of every variable place it is used. As you gain more experience with
    JavaScript, you will see just how useful variables are.


    **Q:** Why don''t I need to define the type of number I am using (such as float
    or integer) when I declare a numeric variable?


    **A:** JavaScript doesn''t require this, which can be a good or bad feature depending
    on your perspective. To JavaScript, any number is a number and can be used as
    a number variable.


    **Q:** Why do I need to put quotation marks around the text in a string?


    **A:** This is done so that JavaScript knows where a string begins and ends. Without
    it, JavaScript would be unsure what should be in a string and what should not.


    **Q:** But doesn''t a semicolon enable a statement? Why not use that and lose
    the quote marks?


    **A:** A variable declaration or any command involving strings can become more
    complex when the addition operator is used to add two strings and/or variables
    together. When this happens, JavaScript needs to know when one string stops and
    another begins on the same line.


    **Q:** What does the backslash (\) character do, in general?


    **A:** If the backslash is followed by a code to create a special character, the
    special character is rendered in its place. Otherwise, the first character after
    a single backslash is seen "as-is" and treated as part of the string in it resides.


