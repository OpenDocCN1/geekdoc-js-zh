  md: '# 206 JavaScript: A Beginner’s Guide


    # Key Skills & Concepts


    +   - Defining the Document Object

    - Using the Document Object Model

    - Using the Properties of the Document Object

    - Using the Methods of the Document Object

    - Creating Dynamic Scripts


    Now that you know how objects work and how to use predefined JavaScript objects,
    it is time to look at some of the major predefined objects in JavaScript. This
    chapter covers the document object, which helps you to gather information about
    the page that is being viewed in the browser. As you will find out some of the
    document object''s properties and methods can be used to get information about
    the document or to change information about the document. You will also be introduced
    to the Document Object Model, and see how this can be used with style sheets to
    create dynamic scripts.


    # Defining the Document Object


    The document object is an object that is created by the browser for each new HTML
    page (document) that is viewed. By doing this, JavaScript gives you access to
    a number of properties and methods that can affect the document in various ways.

    You have been using the write() method of the document object for quite some time
    in this book. This method allows you to write a string of text into an HTML document.

    To begin your journey through the document object, you will take a look at the
    Document Object Model (DOM) and the various properties you can access with this
    object. Many of the properties will turn out to quite useful when writing scripts.


    # Using the Document Object Model


    The Document Object Model (DOM) allows JavaScript (and other scripting languages)
    to access the structure of the document in the browser. Each document is made
    up of structured nodes (for example, the body tag would be a node, and any elements
    within the body element would be child nodes of the body element). With this structure
    in place, a scripting language can access the elements within the document in
    a number of ways, allowing for the modification of the elements within the document.'
  merge: -1
  pgno: 228
- img_proc: false
  md: "# Chapter 9: The Document Object\n\n| body |\n| h1 (child node of body) ---\
    \ img (child node of body) |\n| My Page (child of h1 node) src=\"mymage.jpg\"\
    \ --- alt=\"My Picture\" (attribute nodes of img node) |\n\n**Figure 9-1** An\
    \ example of part of a document's structure\n\nIf you had the following HTML code,\
    \ you could use JavaScript to access its structure:\n\n```\n<body>\n  <h1>My Page</h1>\n\
    <img src=\"mymage.jpg\" alt=\"My Picture\" />\n</body>\n```\n\nFigure 9-1 shows\
    \ how the body element is a node, and how it can have child nodes and attribute\
    \ nodes.\n\nThe h1 and img elements are both child nodes of the body element.\
    \ Each element also has its own nodes. The h1 element contains a text as its child\
    \ node (the text \"My Page\"), while the img element contains two attributes (src=\"\
    mymage.jpg\" and alt=\"My Picture\\). This type of structure is available throughout\
    \ the document, so while this is a simple example, much more complex document\
    \ trees could be drawn for most HTML pages.\n\nYou have already accessing the\
    \ DOM using getElementById to access elements in the document by their id values.\
    \ You can also get groups of elements using methods as getElementsByTagName()\
    \ or getElementsByClassName().\n\nAccessing the DOM with JavaScript allows you\
    \ to create more dynamic scripts that can alter elements within the document in\
    \ reaction to user events. You can also be able to create elements and nodes using\
    \ JavaScript methods of the document object (such as createElement() or createTextNode()).\
    \ These types of scripts will be covered later in the chapter.\n\nFirst, you will\
    \ look at the properties of the document object\n\n# Using the Properties of the\
    \ Document Object\n\nTable 9-1 lists the properties of the document object with\
    \ a short description of each. Following the table, some specific properties are\
    \ discussed in more detail. Sample scripts are provided for several of the properties.\
    \ Note that a number of the properties use arrays to hold information. If you\
    \ would to learn about arrays to understand their use, see Chapter 11.\n\nNOTE\n\
    \nNot all of these properties work cross-browser. Also, a number of them have\
    \ been deprecated (alink, bgColor, fgColor, linkColor, and vlink). You can see\
    \ more information on these properties by visiting http://developer.mozilla.org/en/DOM/document#Properties\
    \ and http://msdn.microsoft.com/en-us/library/ms531073(VS.85).aspx."
  merge: -1
