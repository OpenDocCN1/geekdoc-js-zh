    # Creating Your First Script


    Now that you know how to use the HTML script tags to tell browsers about the JavaScript
    in a document, you''re ready to learn how to add the actual JavaScript code between
    script tags. The first coding example given to teach any language is one that
    writes some of text to the default output area, commonly known as a basic "Hello
    World" script. Following that, your first script will write a string of text to
    a Web page.


    # Writing a "Hello World" Script


    Rather than write "Hello World," you''ll use another line of code for this script:
    "Yes! I am now a JavaScript coder!" This requires only a single line of code,
    using the document.write method, which writes a string of text to the


    ```

    <script type="javascript">

    document.write("Yes! I am now a JavaScript coder!");

    </script>

    ```


    Notice the parentheses and quotation marks around the text. The parentheses are
    required because the document.write() method is a JavaScript function, which takes
    an argument in parentheses. You will learn more about JavaScript functions in
    Chapter 4.


    The quotation marks denote a string of text. A string is a type of variable that
    is defined in JavaScript by placing inside quotation marks. Chapter 3 provides
    details on strings and other types of JavaScript.


    The last thing to notice about your script is the semicolon at the end of the
    line. The semicolon signals the end of a JavaScript statement. A statement is
    a portion of code that does not need anything added to it to be complete in syntax
    (its form and order). A statement can be used to perform a single task, to perform
    multiple tasks, or to make calls to other parts of the script that most JavaScript
    statements end with a semicolon; it is a good idea to get in the habit of remembering
    to add one.


    # NOTE


    In later chapters, you will see lines that do not end in semicolons because they
    open or close a block of code. Also, many scripts you encounter may not end statements
    with semicolons. JavaScript is lenient about the use of a semicolon in cases;
    however, it is best to use the semicolon to end a statement because it can prevent
    possible errors and aid in debugging (removing errors) from the script later.'
