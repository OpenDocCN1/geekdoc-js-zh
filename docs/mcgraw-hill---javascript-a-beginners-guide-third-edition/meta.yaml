  md: "# 214  JavaScript: A Beginner's Guide\n\nThis code creates a document.funform\
    \ property from the name=\"funform\" attribute in the opening <form> tag. While\
    \ this doesn't do much on it, it does allow you access to the form elements within\
    \ the form.\n\nTheフォーム actually has properties under it, which are named after\
    \ the elements of the form. You could access the button you used in the form from\
    \ its name=\"funb\" attribute using document.funform.funb to get it; however,\
    \ even this doesn't let you do much by itself.\n\nYou need to dig down one more\
    \ level. The value property allows you to set or change the value of the contents\
    \ of a form. These elements are usually set in the value attribute of the form\
    \ element's tag. In this form, you could change the value of the text on the button\
    \ by accessing its value using document.funform.funb.value and assigning it a\
    \ new value.\n\nThe following example shows how you could use the onclick handler\
    \ to make the button text change when the button is clicked:\n\n```\n<body>\n\
    <form name=\"funform\">\n  <input type=\"button\" name=\"funb\" value=\"You can\
    \ click me I suppose\"\n  onclick=\"document.funform.funb.value='Thanks, you clicked\
    \ me!';\" />\n</form>\n</body>\n```\n\n9-5 shows how the page and the button will\
    \ look before the button is clicked. Notice that the button shows the text that\
    \ was set in the value attribute of its input tag. Now take a look at the button\
    \ in Figure 9-6, after it has clicked. The text on the button has changed! The\
    \ button lets you know that you clicked it, and it is displaying manners by saying\
    \ \"Thanks\" to you for the click.\n\nIt should be noted that while this will\
    \ work, modern browsers can simply access each form element and its value by assigning\
    \ it an id and using the document.getElementById() method instead of going through\
    \ the form's first.\n\n![](bbox=[0.102, 0.64, 0.895, 0.87])\n\nFigure-9-5 The\
    \ browser display before the button is clicked"
