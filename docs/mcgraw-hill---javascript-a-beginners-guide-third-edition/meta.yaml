    as mouseover, onmouseout, or others).

    You will notice that when the function is assigned to handle the event, the parentheses
    are not used after the function name. This is because you want to assign the execution
    of the function to the event rather than the result of the function (which is
    what you did when you used the return statement to assign the result of a function
    to variables in previous chapters—this particular function would return anything).
    Rather than just assigning a value, you want the function to be executed, the
    whole function is assigned to the event using just the function name.


    # Ask the Expert


    +   Q: Is there a JavaScript event for everything you could do on a Web page?


    +   A: No, but many of the actions you may take are covered by one of the events
    in JavaScript. It would be difficult to cover every possibility.


    +   Q: You mean I can just write some JavaScript by using an event handler like
    an HTML attribute?


    +   A: Yes, but keep in mind that giving an element id attribute and responding
    to the event in the JavaScript code will keep your HTML code cleaner.


    +   Q: If I add the event as an HTML attribute, how do I decide when to use a
    function and when to add the code directly into the event handler?


    +   A: If your JavaScript code is short and you''re not repeating it multiple
    times with other tags and/or events, you''ll probably want to add the code straight
    into the event handler as an attribute. If your code is really long or you will
    be repeating it numerous, you''ll probably want to use a function instead to make
    things easier to read and to make the code reusable.'
