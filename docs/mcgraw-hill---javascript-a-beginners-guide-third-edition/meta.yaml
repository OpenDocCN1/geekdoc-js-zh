  md: '# JavaScript: A Beginner’s Guide


    certain parts of your functionality are needed they can be helpful to the task
    at hand. These methods allow you to more easily add multiple functions for the
    same event and to more easily remove event handling functions that are not needed
    for a particular script. For now, you will just get a brief introduction to their
    use, which may prove helpful if they are needed or one of the methods begins to
    work in all the major browsers.


    First, you will look at the model from the World Wide Web Consortium (W3C). Next,
    you will look at the model from Microsoft.


    # The addEventListener() Method


    The addEventListener method is from W3C. It allows you to specify an event, a
    function to execute the event, and a value of true or false depending on how you
    want the event handler function to be executed in the capturing (true) or bubbling
    (false) phase. The general format looks like this:


    ```

    element.addEventListener(''event_type'', function_name, true_or_false);

    ```


    Thus, if you want to create a linked input button as you did earlier in this chapter,
    you could adjust the JavaScript code to look like:


    ```

    var web_page = "http://www.yahoo.com";nvar bl = document.getElementById(''btn1'');

    bl.addEventListener(''click'', function() { window.location = web_page; }, false);

    ```


    Notice that rather than using the event handler, this method uses the name of
    the event (instead of parentheses, or allows you to use an anonymous function
    (as shown above)).


    The capturing and bubbling matter when you have elements inside other elements
    that have the same event type registered to. Which event occurs first will depend
    on which method is used. If capturing is used, then the outermost element occurs
    first and the innermost element will occur last. If bubbling is used, the opposite
    is the case. The capturing phase occurs before the bubbling phase, so keep in
    mind when using both phases in a script.


    To remove an event, you would use the removeEventListener method:


    ```

    element.removeEventListener(''event_type'', function_name, true_or_false);

    ```


    # The attachEvent() Method


    The attachEvent method works in a similar way to addEventListener(). However,
    it only works with bubbling and does not currently (as of the time of this writing)
    it have a way to use event capturing. It is used like this:


    ```

    element.attachEvent(event_handler, function_name);

    ```'
