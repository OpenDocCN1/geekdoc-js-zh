  md: 'Loading the HTML page will now display both buttons. As with the back() method,
    the use of forward() without a forward page in the window’s history list will
    do nothing.


    **The go() Method** The go() method takes an integer as a parameter. The integer
    be a negative number to go back in the history list or a positive number to move
    forward in the history list. For instance, the following code would go back two
    pages in the window’s history:


    ```

    history.go(-2);

    ```


    The following code would go three pages forward in the history list:


    ```

    history.go(3);

    ```


    As with the other two methods, if the page viewer is attempting to access does
    not exist (for example, like history.go(15) may not exist in the window’s history),
    then the method will simply do nothing.


    The predefined JavaScript objects can be quite helpful. As you’ll see in the next
    chapter, the document object gives you access to a number of additional properties
    and methods for working with the HTML document.


    # Try This 8-2 Practice with the Predefined Navigator Object


    ```

    pr8_2.html

    prjs8_2.js

    ```


    This project allows you to practice using some of the properties and methods of
    the predefined navigator object. You will create a page that alerts the viewer
    to various types of information, based on the browser being used.


    # Step by Step


    +   1. Create an HTML page and save it as pr8_2.html.

    2. Create an external JavaScript file and save it as prjs8_2.js. Use it for steps
    3–12.

    3. Create an alert that pops up when the viewer enters the page. The alert should
    say “Hi! You are viewing my page with . .” followed by the name of the browser
    being used by the viewer.

    4. If the user has Java enabled, send a new alert to the viewer who says “You
    have Java enabled, that is cool!” If the viewer does not have Java enabled, send
    an alert that says “No Java? Well no stuff here then.”

    5. Send a new alert that tells the viewer what type of machine is being used.
    The alert should say “You are using . .” followed by the type of machine the viewer
    is viewing the page.

    6. Save the files and open the HTML file in one or more browsers (or other computers
    if you can). See how the results vary based on what is being used while viewing
    the Web page.


    (continued)'
