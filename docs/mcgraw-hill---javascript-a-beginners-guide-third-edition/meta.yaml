    \ yes, but recipe is not equal to yes, send an alert that says ‘Have the book\
    \ but no recipe’ to the viewer; otherwise, send an alert that says ‘You need a\
    \ cookbook’ to the browser.”\n\nThis is somewhat long complex statement, but you\
    \ can accomplish what you are by nesting an if/else statement within the block\
    \ of another if/else statement.\nTo see this work, consider the following example,\
    \ which puts the previous statement into JavaScript:\n\n```\nif (have_cookbook==\"\
    yes\") {\n  if (meatloaf_recipe==\"yes\") {\n    window.alert(\"Recipe found\"\
    );\n  } else {\n    window.alert(\"Have the book but no recipe\");\n  }\n} else\
    \ {\n  window.alert(\"You need a cookbook\");\n}\n```\n\nOh no, an if block requires\
    \ curly brackets all over the place! To help you figure out what is going on with\
    \ this piece of code, I will break it down into its individual parts.\n\nThe first\
    \ thing you get is the main (first, or outermost) block. Block you use to find\
    \ out whether the variable have_cookbook is equal to yes or not. If this comparison\
