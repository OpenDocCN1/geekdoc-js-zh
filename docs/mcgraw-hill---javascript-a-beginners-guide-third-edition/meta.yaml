  md: '60 JavaScript: A Beginner’s Guide


    # Key Skills & Concepts


    +   - What a Function Is

    - Why Functions Are Useful

    - Structuring Functions

    - Calling Functions in Your Scripts


    A JavaScript coder, you need to know how to use functions in your scripts. Functions
    can make your scripts more portable and easier to debug.

    This chapter covers the basics of using functions. First, you will find out what
    a function is and why functions are useful. Then, you will learn how to define
    and structure functions. Finally, you will learn how to call functions in your
    scripts.


    # What a Function Is


    Function is basically a little script within a larger script. Its purpose is to
    perform a single task or series of tasks. What a function does depends on what
    code you place inside it. For instance, a function might write a line of text
    to the browser or calculate a numeric value and return that value to the main
    script.

    As you recall from math class, a function can be used to calculate values on a
    coordinate plane. You may have seen calculations like these:


    ```

    f (x) =x+2

    y=x+2

    ```


    Both are commonly used to calculate the y coordinate from the value of the x coordinate.
    If you need the y when x is equal to 3, you substitute 3 for x to get the value:
    3+2=5. Using the function, you find that when x=3, y=5.

    The function itself is sitting on the page (or, in our case, the script) until
    you need to use it to perform its task. And you can use the function as many times
    as you need to, by calling it from the main script.


    # Why Functions Are Useful


    Functions help organize various parts of a script into the different tasks that
    must be accomplished. By using one function for writing text and another for making
    a calculation, make it easier for yourself and others to see the purpose of each
    section of the script, and thus debug it more easily.'
  merge: -1
  pgno: 82
- img_proc: false
  md: 'Another reason functions are useful is their reusability. They can be used
    more than once within a script to perform their task. Rather than rewriting the
    entire block of code, you can simply call the function again.


    Consider the simple function y=x+2. If you use it only once, the function doesn''t
    serve much purpose. If you need to several values, the function becomes increasingly
    useful. Rather than writing out the formula for each calculation, you can substitute
    the x each time you need the y value. So, if you need the y value when x is 3,
    4, and 5, you can use the function three times to get the y values. The function
    will calculate 5, 6, and 7, respectively. Instead of writing the content of the
    three functions, it only needs to be written once to get three answers.


    Functions can perform complex tasks and be quite lengthy. In the examples in this
    and later chapters, you''ll see how useful and time-saving they are in JavaScript.


    # Structuring Functions


    Now that you understand what functions are and why you want to use them, you need
    to learn how to structure them in your scripts. A function needs to be declared
    with its name and its code. There are also some optional additions you can use
    to make functions even more useful. You can import one or more variables into
    the function, which are called parameters. You can also return a value to the
    main script from the function using the return statement. You will start by looking
    at how the function begins.


    # Declaring Functions


    On the first line of a function, you declare it as a function, name, and indicate
    whether it accepts any parameters. To declare a function, you use the reserved
    word function, followed by its name, and a set of parentheses:


    ```

    function functionname()

    ```


    The reserved word function tells the browser that you are declaring a function
    and that more information will follow. The next piece of information is the function''s
    name. After that, the set of parentheses indicates whether the function accepts
    any parameters.


    For example, to name your function reallycool and indicate that it does not use
    any parameters, the first line looks like this:


    ```

    function reallycool()

    ```


    Because the function does not use any parameters, the parentheses are left empty.
    As with variable names, there are some special considerations for naming functions.
    You''ll learn about those considerations after the discussion of the function
    structure.


    You may have noticed that this line does not end with a semicolon; as the other
    code lines you''ve seen so far in this book. The semicolon is absent because you
    use a different technique to show where the function''s code begins and ends,
    as described next.'
