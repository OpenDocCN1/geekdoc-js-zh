  md: '# Writing a Page of JavaScript


    Now that you know how to use variables and write basic HTML code to the page using
    JavaScript, you will create a page that is almost entirely written with JavaScript
    (everything inside the `<body>` and `</body>` tags) as a way to reinforce the
    techniques you have learned to this point.


    # Creating the Framework


    The first thing you need is a basic framework for the page so that you know where
    to insert your script. Since you are writing information onto the page, the script
    tags will be placed within the `<body>` and `</body>` tags. In this case, an external
    script file named ch3_code.js will be used. The body section of your HTML document
    will look like this:


    The script tags are inserted here to call the external JavaScript file


    ```

    <body>

    <script type="text/javascript" src="ch3_code.js"></script>

    </body>

    ```


    The code you place in the ch3_code.js file will determine what shows up in the
    browser when you have finished.


    # Defining the Variables


    To begin your script file, use some JavaScript code to write an HTML heading.
    You could write the code as string directly into the `document.write()` command,
    as shown here:


    ```

    document.write("<h1>A Page of JavaScript</h1>");

    ```


    On the other hand, you could place the string inside a variable and use the variable
    inside the `document.write(headtext)` command in the script:


    ```

    var headtext="<h1>A Page of JavaScript</h1>";nOther code may be placed here...

    document.write(headtext);

    ```


    For this example, you will go with the second method, since it uses a variable.
    You will see how this can be a handy feature as you get further into the script.


    In fact, you create a bunch of variables to hold the strings of HTML code to add
    to the page. The next one will add a short sentence of introduction to the page.
    The variable declaration for the introduction will look like this:


    ```

    var myintro="Hello, welcome to my JavaScript page!";

    ```


    Next, add a link to the page. The variable declaration for the link will look
    like this:


    ```

    var linktag="<a href="http://www.pagerource.com">Link to a Site/</a>";

    ```


    Next, you''ll put in some red text to add a little color. Here''s the redtext
    variable definition:


    ```

    var redtext="<span style="color:red">I am so colorful today!</span>";

    ```'
