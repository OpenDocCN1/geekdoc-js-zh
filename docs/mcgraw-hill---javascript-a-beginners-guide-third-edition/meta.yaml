  md: '# JavaScript: A Beginner’s Guide


    # The Mouseover Event


    The mouseover occurs when a viewer moves the mouse cursor over an element on the
    page as a text link, linked image, or linked portion of an image map. The mouse
    event will also work in numerous other areas such as table cells and `<div>` and
    `</div>` tags. The mouse event is handled with the onmouseover event handler.


    The quickest way to use an onmouseover event handler is to set up a text link.
    When you add the onmouseover event handler to the link, you have the option to
    perform JavaScript commands when the viewer passes the cursor over the link. Thus,
    if you want to alert pop when the viewer moves the mouse over a link, you could
    do something like the following:


    The onmouseover event handler in a link tag


    ```

    <a href="http://www.pagerource.com" onmouseover="window.alert(''I told you not
    to try to click me!'');">

    Don''t Try Clicking Me!</a>

    ```


    This time the visitor doesn''t even get to click the link before being greeted
    with an alert. Keep in mind that a script like this could annoy your visitors
    if it is overused. Figure 7-5 shows the result of this script in a browser. The
    alert pops as soon as the mouse cursor moves over the link.


    Since there is need to click the link for something to happen, the browser won''t
    follow the link afterward. In fact, with this script in place, it is quite difficult
    to click the link at all because the alert keeps popping when you move your mouse
    over click it!


    ![](bbox=[0.104, 0.558, 0.896, 0.846])


    Figure 7-5 This alert pops up when the mouse cursor moves over to the link'
