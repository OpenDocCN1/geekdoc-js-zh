  md: '# if/else Statement Block Structure


    The first thing you deal with in an if/else statement is the first line, which
    tells the browser to continue or move along. You begin an if/else statement with
    the JavaScript keyword, followed by a comparison in parentheses. The following
    line shows a sample of the format of the first line:


    ```

    if (comparison here)

    ```


    You replace the comparison here with an actual comparison. To do this, you need
    to remember the comparison operators from the previous chapter. Suppose you want
    to see if a variable named boats is equal to 3. This is how you write the first
    line of the if/else block:


    ```

    if (boats==3)

    ```


    Remember that a comparison will return a value of true or false. This is where
    the return value becomes useful. If the comparison boats==3 returns true, the
    browser can go on the next line. If it returns false, the browser begins looking
    for the else keyword, or the first line of script after the block following the
    line is completed.


    If the comparison returns true, you need to make a block of statements after the
    if line that will be executed. To do this, you use the curly brackets similarly
    to the way you enclose commands for a function. The code shows how to add the
    brackets to enclose the code that will execute if the comparison returns true:


    ```

    if (boats==3) { <-- The comparison is on the first line

    JavaScript Statements Here <-- This is where JavaScript code will be added

    }

    ```


    If the comparison boats==3 returns true, the code you place within the brackets
    will be executed. If it returns false, the code inside the brackets is ignored
    and the line of code after the closing curly bracket is executed.


    If you wish to use an else block to execute a certain bit of code when the comparison
    returns false, you place the else keyword on the next line and follow it with
    its own set of curly brackets, in the following code:


    ```

    if (boats==3) { <-- The block begins with the if keyword and the comparison

    JavaScript Statements Here

    else <-- The block begins with the else keyword

    JavaScript Statements Here

    }

    ```


    Now you can see the entire if/else block and how it works to execute one of the
    two blocks of code within curly brackets. If the comparison returns true, the
    block of code following the statement is executed. If the comparison returns false,
    the block of code following the else keyword is executed.'
