  md: "# Chapter 4: Using Functions 77\n\nThe Function Declaration\nThis is the method\
    \ you have been using up to this point and one that will be used often in this\
    \ book. As you will recall, you simply declare the function as follows:\n\n```\n\
    function functionname() {\n  Code for function here\n}\n```\n\nYou can also add\
    \ parameters and/or return statements as mentioned earlier in this chapter.\n\n\
    # The Function Constructor\nThe function constructor creates a function object\
    \ in the same way you would create an instance of an object (arguments, will be\
    \ discussed in Chapter 8):\n\n```\nvar functionname = new Function (arguments,\
    \ code for function);\n```\n\nThis work like other functions, but the drawback\
    \ to this method is that it has poorer performance than the other methods (it\
    \ is evaluated every time it is used rather than only being parsed once). More\
    \ often than not, you will use one of the other methods for defining functions.\n\
    \n# The Expression\nThe function expression (also called the function operator)\
    \ uses the same syntax as a function declaration. The main difference between\
    \ this and a function declaration is that a variable with same name as the function\
    \ name can be used outside the function, while the function expression can only\
    \ access itself. For instance, the following code uses a function declaration\
    \ and can output an alert using the function name as a variable (the value of\
    \ the variable will be all of the function's code):\n\n```\nfunction send_alert()\
    \ {\n  var my_num = 1;\n}\nwindow.alert(send_alert);\n```\n\nOn the other hand,\
    \ the following code would give an error when run:\n\n```\nvar get_func = send_alert()\
    \ {\n  var my_num = 1;\n}\nwindow.alert(send_alert);\n```\n\nAs seen in the preceding\
    \ code, the function expression also uses a function name. However, the function\
    \ name cannot be used as a variable outside of the function.\n\nCAUTION\nThis\
    \ use of the function expression in Internet Explorer 7 (as of the time of this\
    \ writing) did not give an error, but gave the same result as the function declaration.\
    \ To test for this difference, Mozilla Firefox may be used."
