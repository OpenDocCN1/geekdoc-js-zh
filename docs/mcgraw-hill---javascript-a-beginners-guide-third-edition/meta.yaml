    # The Subtraction Operator (-)


    The subtraction operator is used to subtract the value on its right side from
    the value on its left side, as in mathematics. Here is an example:


    ```

    var result=10-3;

    window.alert(result);

    ```


    This code subtracts 3 (the number on the right of the operator) from 10 (the number
    on the left of the operator). The result is an alert that says 7.


    As the addition operator, you can use variables to hold the numbers you are working
    with. As in this example:


    ```

    var num1=10;

    var num2=3;

    var result=num1-num2;

    window.alert(result);

    ```


    The result is the same as the previous example: an alert that says 7.


    The use of variables with mathematical operators also works with the multiplication,
    division, and modulus operators, which are described in the next sections.


    # The Multiplication Operator (*)


    The multiplication operator is used to multiply the value on its right side by
    the value on its left side. Again, this is just like mathematical multiplication.
    The next example shows this operator in action:


    ```

    var num1=4;

    var num2=5;

    var thetotal=num1*num2;

    window.alert(thetotal);

    ```


    Here, you get an alert that says 20, the result of 4 times 5. This operator shouldn''t
    give you many surprises, so move on to the division operator.'
