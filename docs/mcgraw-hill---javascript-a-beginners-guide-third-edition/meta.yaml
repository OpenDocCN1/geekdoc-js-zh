    # # The Addition Operator (+)


    As you have seen, the addition operator can be used to combine two strings. It
    is also used to add numbers in mathematical calculations.


    # ### Variables for Addition Results


    One of the addition operator is to add two numbers to get the mathematical result.
    When adding numerical values, assign the result to a variable and use the variable
    later to make use of the result. For example, calculate the value of 4 plus 7
    and show the result, you could code it like this:


    ```

    var thesum=4+7; // Two numbers are added with the addition operator

    window.alert(thesum); // The result of the addition is shown as an alert to the
    viewer

    ```


    The result is an alert that says 11.


    To make the example little more complex, you could change one of the numbers to
    a variable:


    ```

    var num1=4; // A number is assigned to a variable

    var thesum=num1+7; // A number is added to the variable and

    window.alert(thesum); // the total is assigned to a new variable

    ```


    The result is the same as the previous example''s code: an alert that says 11.


    Taking the example one step further, you could make both of the numbers variables:


    ```

    var num1=4;

    var num2=7;

    var thesum=num1+num2; // Two variables are added using

    window.alert(thesum); // the addition operator

    ```'
