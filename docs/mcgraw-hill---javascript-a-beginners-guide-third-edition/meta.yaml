  md: "# Using break and continue\n\nThe break and continue statements allow you to\
    \ stop what a loop is currently doing, but work in different ways. As you will\
    \ recall the use of a break statement in a switch block earlier in the chapter,\
    \ the break statement stops the loop at that point and completely exits the loop,\
    \ moving to the next JavaScript statement after the loop. For instance, break\
    \ could be used in this:\n\n```\nfor (count=1;count<11;count++) {\n  if (count==5)\
    \ {\n    document.write(\"The loop is halfway done, and I am done with it!<br\
    \ />\");\n    break;// This will end the loop when count is equal to 5, rather\
    \ than allowing the loop to complete\n  }\n  else {\n    document.write(\"I am\
    \ part of a loop!<br />\");\n  }\n}\n```\n\nThe loop will go through normally\
    \ until count is equal to 5. When this happens, a special message is written to\
    \ the page and the break statement is used to end the loop entirely. Thus, rather\
    \ than going through the loop ten times, the loop will only be executed five times.\n\
    \nIf you decided that you did not want to leave the loop when that condition occurs,\
    \ you could modify the loop to use the continue statement during it. The continue\
    \ statement will stop the loop from executing any statements after the current\
    \ trip through the loop. However, it will go back to the beginning of the loop\
    \ and pick up where it left off, rather than exiting the loop entirely. For example,\
    \ you could use the following code:\n\n```\nfor (count=1;count<11;count++) {\n\
    \  if (count==5) {\n    continue;\n    document.write(\"count+\". I am part of\
    \ a loop!<br />\");\n  }\n}\n```\n\nThis time, nothing is written to the page\
    \ when count is equal to 5. Instead, the loop is told to go back to the beginning\
    \ and continue from there. The result is that “I am part of a loop!” message will\
    \ be written to the page only nine times (since nothing happens when count is\
    \ equal to 5). The loop is allowed to continue where it left off, rather than\
    \ being completely.\n\nThe break and continue statements will prove helpful to\
    \ you when special situations come up require you to stop the loop entirely or\
    \ to stop the loop and restart it at the beginning."
  merge: -1
  pgno: 163
