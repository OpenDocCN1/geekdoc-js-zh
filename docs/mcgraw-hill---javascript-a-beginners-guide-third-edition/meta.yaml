    # # Understanding Comparison Operators


    Comparison operators are often used with conditional statements and loops in order
    to perform actions only when a certain condition is met. Since these operators
    compare two values, they return a value of true or false, depending on the values
    on either side of the operator. In later chapters, you will learn how to create
    a block of code to be performed only when the comparison returns true.


    Table 5-3 summarizes the comparison operators, which are discussed in more detail
    in the following sections.


    | Operator | Symbol | Function |

    |---|---|---|

    | Is equal to | === | Returns true if the values on both sides of the operator
    are equal to each other |

    | Is not equal to | != | Returns true if the values on both sides of the operator
    are not equal to each other |

    | Is greater than | > | Returns true if the values on the left side of the operator
    is greater than the value on the right side |

    | Is less than | < | Returns true if the values on the left side of the operator
    is less than the value on the right side |

    | Is greater than or equal to | >= | Returns true if the values on the left side
    of the operator is greater than or equal to the value on the right side |

    | Is less than or equal to | <= | Returns true if the values on the left side
    of the operator is less than or equal to the value on the right side |

    | Strict is equal to | === | Returns true if the values on both sides are equal
    and of the same type |

    | Strict is not equal to | != | Returns true if the values on both sides are not
    equal or of the same type |


    **Table 5-3** The Comparison Operators'
