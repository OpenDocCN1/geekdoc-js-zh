    properties in detail.


    **The appName Property** This property holds the value of the application code
    name of the browser, which is something nothing like Mozilla. Other than writing
    to the screen or sending an alert to the viewer, you don''t have much use for
    it for this. The following code shows how to send an alert to the viewer to tell
    him or her the appName of the browser being used the page:


    ```

    window.alert("You are using "+navigator.appName");

    ```'
