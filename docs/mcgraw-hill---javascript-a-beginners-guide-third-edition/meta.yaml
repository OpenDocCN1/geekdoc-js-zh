    4. Create a new div element with the text "See you!" and add it to the document
    structure as a child of the div element with the id of "div1".

    5. Save the JavaScript file and open the HTML file in your browser to view the
    results.


    # Try This Summary


    In this project, you used your knowledge of the properties and methods of the
