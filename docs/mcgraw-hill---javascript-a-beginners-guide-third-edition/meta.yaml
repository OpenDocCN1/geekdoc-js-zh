  md: '# The Add-and-Assign Operator (+=)


    The += operator adds the value on the right side of the operator to the variable
    on the left side and assigns it to that variable new value. In essence, it is
    a shortcut to writing the type of code shown here:


    ```

    var money=1000;

    moneym=moneym+1;

    ```


    Here, the variable money is created and assigned a value of 1000. The code then
    changes the value by assigning it value of itself plus 1. The value assigned to
    the money variable is 1001.


    Instead of writing the variable name an extra time, you can use the add-and-assign
    operator to shorten the code. The following code gives the same result as the
    previous example, but saves a little typing:


    ```

    var money=1000;

    moneym+=1;

    ```


    Using the add-and-assign operator, this code adds 1 (the value on the right) to
    money the variable on the left), assigning the new value of 1001 to the variable
    money.


    This operator can be used to add any value, not just 1. For example, you could
    add 5 in the assignment, as in this example:


    ```

    var money=1000;

    moneym+=5;

    ```


    This time, money ends up with a value of 1005.


    You can even use a variable rather than a plain number value on the right side,
    as in this example:


    ```

    var money=1000;

    var bonus=300;

    moneym+=bonus;

    ```


    Here, bonus has a value of 300, which is added to the variable money, and then
    money is assigned the result of 1300. In this way, the value of the bonus variable
    can be changed to affect the result of the assignment.


    This assignment operator, like the addition mathematical operator, also works
    with strings. Thus, you could add on the end of a string value using this operator:


    ```

    var myname="Bob"

    mymame+=="by";

    ```


    This adds the string “by” to the end of the string “Bob”, which yields the string
    “Bobby”.'
