  md: '# JavaScript: A Beginner’s Guide


    # The Mouseup Event (onmouseup)


    The mouseup event occurs when the viewer releases the mouse button after pressing
    it down. The on event handler is used for this event, and it can be placed within
    almost any HTML tag on a Web page.


    # The Reset Event (onreset)


    The reset event occurs when a viewer uses a reset button to reset the form fields
    in a form. To take care of this event, you use the onset event handler, which
    can be added to the opening form tag in a form. The onset event handler also has
    a related method called reset(), which is covered in Chapter 14.


    # The Submit Event (onsubmit)


    The submit event occurs when the viewer submits a form on a Web page. This event
    uses the onsubmit event handler, which can be called from an opening form tag
    in a document. The onsubmit event handler also has a related method called submit(),
    which will be covered in Chapter 14.


    To see the submit event work, you have to create a form that can be submitted
    with a submit button. You will then add the onsubmit event handler to the opening
    form tag. The following code will give "Thank You" alert to the viewer once the
    submit button is clicked:


    ```

    <form onsubmit="window.alert(''Thank You'');">

    What’s your name?<br />

    <input type="text" id="thename"<br />

    <input type="submit" value="Submit Form">

    </form>

    ```


    The unload event does not do much good (especially with the contents of the form
    not really going anywhere), but this event will become more useful when you get
    to form validation in Chapter 14.


    # The Unload Event (onunload)


    The unload event occurs when a viewer leaves the current Web page. The viewer
    could leave by clicking a link, typing another address in the browser, or closing
    the window. The event handler is used for the unload event onunload.


    This event is known to annoy viewers, because it enables the site owner to do
    something while visitors are trying to move on to another page or Web site (forcing
    them to wait). To have an alert when the viewer leaves the page, you could write
    the following code:


    The unload event handler is added to the body tag


    ```

    <body onload="window.alert(''Be sure to come back, OK?'');">

    Other HTML code goes here...

    </body>

    ```'
