  md: '# Chapter 3: Using Variables


    For example, to name your variable paycheck and give it the numeric value 1200,
    use this statement:


    ```

    var paycheck=1200;

    ```


    The statement begins with the keyword var, followed by the variable paycheck,
    just as in the plain variable declaration described in the previous section. Next
    comes the assignment operator (=), which tells the browser to assign the value
    on the right side of the operator to the variable on the left side of the operator.
    To the right of the assignment operator is 1200, which is the numeric value being
    assigned to the variable paycheck. The line ends with a semicolon to mark the
    end of the statement.


    # CAUTION


    Be careful not to think of the assignment operator (=) as having the meaning "is
    equal to." The operator for "is equal to" is two equal signs together (==), as
    you''ll learn in Chapter 5.


    To declare and assign another variable, you use the same format, placing on a
    new line. For example, to set up a variable named tracking the amount of money
    you are spending from the paycheck variable, use these statements:


    ```

    var paycheck=1200; <--- Assigns a value of 1200 to the variable paycheck

    var spending=1500; <--- Assigns a value of 1500 to the variable spending

    ```


    Of course, you will also notice that this financial situation is headed for trouble,
    since the money spent in the spending variable is more than what is brought in
    by the budget for my paycheck variable. Oddly, it is starting to look like the
    budget for my Web site!


    The examples you''ve seen illustrate the proper and safe way to code variable
    declarations and assignments. However, the truth is that JavaScript allows a certain
    amount of flexibility when it comes to variables. In many cases, the code will
    work without using precise coding syntax. For example, you may see scripts written
    without using the var keyword the first time a variable is used. JavaScript will
    declare the variable first time it is used even if it is previously undeclared.
    An example is here:


    ```

    paycheck=1200;

    ```


    This works since the variable is being assigned a value (JavaScript will simply
    declare the variable and assign it the value of 1200). However, if you were trying
    to declare the variable without an assignment, the following would not be:


    ```

    paycheck;

    ```


    This declaration would still require the var keyword to be valid, as in the following:


    ```

    var paycheck;

    ```'
