    and not formname. To see the meaning of this, take a look at a page with a form
    on it. The following code will give you an HTML page that includes a form:


    ```

    <body>

    The form is a name to create a property

    <form name="funform" -->

    <input type="button" name="funb" value="You can click me I suppose " />

