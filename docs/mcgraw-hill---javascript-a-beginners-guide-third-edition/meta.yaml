    operators can be useful if you want to check on more than one condition at a time
    and use the results. Like the comparison operators, the logical operators return
    true or false, depending on the values on either side of the operator.


    Table 5-4 summarizes the logical operators, which are discussed in the following
    sections.


    # ## AND Operator (&&)


