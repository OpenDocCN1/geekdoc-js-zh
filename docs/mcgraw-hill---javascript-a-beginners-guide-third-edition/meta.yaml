  md: '# 6 JavaScript: A Beginner''s Guide


    # Which Version?


    At the time of this writing, the browsers recommended earlier in this chapter
    should support at least JavaScript 1.5. (The newest version of Firefox supports
    JavaScript 1.8.)


    You may also see or hear about Jscript or ECMAScript. JScript is the version of
    JavaScript that Microsoft Internet Explorer uses (which has additional features
    because it is implemented as a Windows Script engine; can use server-side languages
    to perform more complex tasks like updating databases). For more information on
    JScript, http://msdn.microsoft.com/en-us/library/hbc298.aspx.


    ECMAScript is the international name and specification for the JavaScript language,
    so it is not a new language but a standard that is set for JavaScript and JScript.
    For more on ECMAScript, see www.ecma-international.org/publications/standards/Ecma-262.htm.


    # Ask the Expert


    +   **Q:** You mentioned that I could use a text editor or HTML editor of my choice,
    I''m not sure quite what that means. What is a text editor and where can I find
    one?


    +   **A:** A text editor is a program that you can use to save and edit text.
    Text editors range from simple to complex, and a number of choices are available:
    Notepad, WordPad, Simple Text, and Corel WordPerfect X4, to a name. You can also
    purchase and download some from the Web, like NoteTab or TextPad.


    +   An HTML editor is either a more complex text editor or an editor that allows
    you to add code by clicking buttons or by other means—often called a What See
    Is What You Get (WYSIWYG) editor. I recommend a plain text editor or an HTML editor
    that doesn''t change any code you add to it manually. Examples of HTML editors
    are Adobe Dreamweaver and Softpress Freeway.


    +   **Q:** What exactly do I need to know about using an editor?


    +   **A:** Basically, you only need to know how to type plain text into the editor,
    save the file with an .html or .htm extension, and be able to open and edit it
    if necessary. Special features aren''t needed because HTML files are made of plain
    text.


    +   **Q:** What do I need to know about using a browser?


    +   **A:** All you need to know is how to open a local HTML file on your computer
    (or on the Web) and how to reload a page. If you don''t know how to open an HTML
    file from your computer, open your browser and go to the File menu. Look for an
    option that says something Open or Open File, and select it. You should be able
    to browse for the file you want to open like you would with other programs. The
