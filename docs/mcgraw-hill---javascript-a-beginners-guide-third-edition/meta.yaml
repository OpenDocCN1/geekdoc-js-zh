  md: '# JavaScript: A Beginner’s Guide


    # ## Similarities to Other Languages


    JavaScript has similarities to other programming and scripting languages. If you
    have experience with Java, C++, or C, you will notice some similarities in the
    syntax, which may help you learn more quickly. Because it''s a scripting language,
    JavaScript also has similarities to languages like Perl—it, too, can run through
    an interpreter rather than being compiled.


    If you have programming or scripting experience in any language, it will make
    learning JavaScript easier—but it isn''t required.


    # ## Beginning with JavaScript


    JavaScript came about as a joint effort between Netscape Communications Corporation
    and Sun Microsystems, Inc. The news release of the new language on December 4,
    1995, back when Netscape Navigator 2.0 was still in its beta version. JavaScript
    version 1.0 became available with the new browser. (Before it was JavaScript,
    it was called LiveScript.)


    JavaScript is an object-based, client-side scripting language that you can use
    to make Web pages more dynamic. To make sense of such a definition, let''s look
    at its important parts one


    # ### Object Based


    Object based means that JavaScript can use items objects. However, the objects
    are not class based (meaning no distinction is between a class and an instance);
    instead, they are just general objects. You''ll learn how to work with JavaScript
    objects in Chapter 8. You don''t need to understand them in any detail until you
    know a few other features of the language.


    # ### Client Side


    Client side means that JavaScript runs in the client (software) that the viewer
    is using, rather than on the Web server of the site serving the page. In this
    case, the client would be a Web browser. To make sense of this, let''s take a
    look at how a server-side language works and how a client-side language works.


    # ### Server-Side Languages


    A server-side language needs to get information from the Web browser or the Web
    server, and send to a program that runs on the host''s server, and then send the
    information back to the browser. There, an intermediate step must send and retrieve
    information from the server before the results of the program are seen in the
    browser.


    A server-side language often gives the programmer options that a client-side language
    doesn''t have, such as saving information on the Web server for later use, or
    using the new information to update a Web page and save the updates.


    However, a server-side language is likely to be limited in its ability to deal
    with special features of the browser window that can be accessed with a client-side
    language (like the content in a particular location on a Web page or the contents
    of a form before it''s submitted to the server).'
  merge: -1
  pgno: 30
- img_proc: false
  md: '# Chapter 1: Introduction to JavaScript 9


    # Client-Side Languages


    A client-side language is run directly through the client used by the viewer.
    In the case of JavaScript, the client is a Web browser. Therefore, JavaScript
    is run directly in the Web browser and doesn''t need to go through the extra step
    of sending and retrieving information from the Server.


    With a client-side language, the browser reads and interprets the code, and the
    results can be given to the viewer without getting information from the server
    first. This process can certain tasks run more quickly.


    A client-side language can also access special features of a browser that may
    not be accessible by a server-side language. However, a client-side language lacks
    the ability to save files or updates to a Web server like a server-side language.


    # NOTE


    Using the XMLHttpRequest object allows JavaScript to request data from the server.
    This will be covered briefly in Chapter 16.


    A client-side language is used for tasks that deals with parts of the browser
    or that allow information to be validated before it is sent to a server-side program
    or script. For instance, JavaScript can open a new window with specific dimensions,
    specific features (such as a location bar or status bar), and a specific point
    of placement on the screen.


    JavaScript can also be used to check the information entered into a form before
    it is sent to a server-side program. This processing can prevent strain on the
    Web server by preventing submissions with inaccurate or incomplete information.
    Rather than running the program on the server until the information is correct,
    that data can be sent to the server just with correct information.


    # Scripting Language


    A scripting language doesn''t require a program to be compiled before it is run.
    All the interpretation is done on-the-fly by the client.


    With a regular programming language, before you can run a program you have written,
    you must compile it with a special compiler to be sure there are no syntax errors.
    With a scripting language, the code is interpreted as it is loaded in the client.
    Thus, you can get the results of your code more quickly. However, errors won''t
    be caught before the script is run and could cause problems with the client if
    it can''t handle the errors. In the case of JavaScript, the error handling is
    up to the browser used by the viewer.


    # Putting It All Together


    With all this mind, you might wonder how JavaScript is run in a browser. You might
    wonder where to write your JavaScript code and what tells the browser it is different
    from anything else on a Web page. The answers are general for now, but the next
    chapter provides more details.


    JavaScript runs in the browser by being added into an existing HTML document (either
    directly or by referring to an external script file). You can add special tags
    and commands to'
  merge: -1
  pgno: 31
- img_proc: false
  md: '# 10 JavaScript: A Beginner’s Guide


