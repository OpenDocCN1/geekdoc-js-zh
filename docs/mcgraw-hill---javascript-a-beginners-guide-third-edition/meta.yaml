  md: '# Chapter 5: JavaScript Operators 89


    +   - **Logical** These operators are used to compare two conditional statements
    (or to operate

    on on one statement) to determine if the result is true and to proceed accordingly.
    They use

    symbols such as && (returns true if the statements on both sides of the operator
    are true)

    and || (returns true if a statement on either side of the operator is true)


    +   - **Bitwise** These are logical operators that work at the bit level (ones
    and zeros). They use

    symbols like << (for left-shifting bits) and >> (for right-shifting bits).


    +   - **Special** These are operators that perform special functions of their
    own.


    In this chapter, you will learn about each of these types of operators. This will
    be a general

    view of the function of each type of operator, so that you will know better the
    purpose of

    all the operators when you put them to use later. To begin, you''ll look at the
    mathematical

    operators in JavaScript.


    # Understanding Mathematical Operators


    For a mathematical calculation, you use a mathematical operator. The values that
    you use

    can be any sort of values you like. For instance, you could use two variables,
    two numbers,

    or a variable or a number. A few of these operators are able to perform a task
    on a single

    variable''s value.


    As a quick example, you will remember that you used the addition operator (+)
    to add two

    strings together in previous chapters. Here is an example of two string values
    being combined

    with the addition operator:


    ```

    window.alert("I begin and "+"this is the end.");

    ```


    You can also use the addition operator when one of the values is a variable, as
    in this example:


    ```

    var part1="I begin and "

    var part2="this is the end."

    window.alert("I begin and "+part2");

    ```


    The addition operator also works when both values are variables, as in the next
    example:


    These examples illustrate how you can use many of the mathematical operators with
    a

    number of values/or variables. This allows you some flexibility in the code you
    could write

    scripts.


    The three operators that work on single values are the increment, decrement, and
    unary

    negation operators. The increment and decrement operators are actually shortcuts
    to adding

    subtracting 1, so learning how to use them could save you some coding time.


    The mathematical operators and their functions are summarized in Table 5-1. The
    following

    sections discuss each operator in more detail.'
