  md: '# 158 JavaScript: A Beginner’s Guide


    To use this event handler to do the same thing with a link, you might be tempted
    to do something similar to the following:


    Oh no! This will give you problems because the browser will try to follow the
    link


    ```

    <body>

    <a href="http://none" onclick="window.alert(''Hey! You clicked me!'');">

    Don''t Click Me

    </a>

    </body>

    ```


    The problem with this code is that the alert will work, but the browser will continue
    to the original action of the link tag and attempt to go to http://none. This
    would probably cause a "Server not found" error in the browser.


    One way to avoid a "Server not found" error is to link to an actual page (which
    is good for accessibility); however, it may take a viewer with JavaScript away
    from the current page. To keep the link from being followed (if JavaScript is
    on), you need to add an extra statement to the JavaScript in the click event.
    You need to tell the browser not to continue after you have shown the viewer alert.
    To do this, you will add a return statement.


    Recall from Chapter 4 on functions that return a value to a script. Here, you
    are going to do essentially the same thing. You are going to return the Boolean
    value of false, which tells the browser that the event has been handled and no
    further action is required for the event. This will keep the browser from following
    the link after the alert has been shown. The following code shows how to do it
    in the return statement:


    ```

    <body>

    <a href="http://none"\ onclick="window.alert(''Hey! You clicked me!''); return
    false;">

    Don''t Click Me

    </body>

    ```


    The return false statement keeps the browser from trying to follow the link


    With this code, the click will be taken care of by the onclick event handler,
    and the browser will not worry about about attempting to follow the link in the
    hypertext reference (href) attribute.


    # NOTE


    You can also code JavaScript for a link using the javascript: command—for example,
    <a href="javascript:window.alert(''Hi!'');">Click</a>—but this method is not recommended
    for accessibility reasons (if JavaScript is on) the link doesn''t go anywhere).


    # The Focus Event (onfocus)


    The focus event occurs when the viewer gives focus to an element on a Web page.
    A viewer gives focus by clicking somewhere within the item, by using the keyboard
    to move to the item (via the TAB key), or via a script. For instance, a viewer
    who clicks a text box (before entering anything) gives that box the focus. Also,
    clicking an inactive window and making it the active window gives the window focus.'
