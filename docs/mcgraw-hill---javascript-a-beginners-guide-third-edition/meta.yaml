  md: '# Key Skills & Concepts


    +   * Using the HTML Script Tags

    * Creating Your First Script

    * Using External JavaScript Files

    * Using JavaScript Comments


    Now that you have been introduced to JavaScript, you''re ready to start coding.
    Since JavaScript code is run from HTML documents, you need to know how to tell
    browsers to run your scripts. The most common way to set off a script is use the
    HTML <script> and </script> tags in your document. You can place your script tags
    in either the head or body section of the HTML document.


    This chapter first shows how to use the script tags to begin and end a segment
    of JavaScript code. When you do, you will get started and running your scripts.
    At the end of the chapter, you will learn how to add JavaScript comments to document
    your scripts.


    # Using the HTML Script Tags


    Script tags are used to tell the browser where some type of scripting language
    will begin and end in an HTML document. In their most basic form, script tags
    appear just like any other set of HTML tags:


    ```

    <script>--- Tells the browser where script code begins

    JavaScript code here

    </script>--- Tells the browser where script code ends

    ```


    As you can see, there is the opening <script> tag, the JavaScript code, and then
    the closing </script> tag. When you use just the basic opening and closing tags
    like this, many browsers will assume that the scripting language to follow will
    be JavaScript. However, some browsers may need to tell where script begins and
    ends for the browser, script tags can also tell the browser where scripting language
    will be used and define the address for an external JavaScript file. These additional
    functions are achieved through the type and src (source) attributes.


    Besides distinguishing where script begins and ends for the browser, script tags
    can also tell the browser where scripting language will be used and define the
    address for an external JavaScript file. These additional functions are achieved
    through the type and src (source) attributes.


    # Identifying the Scripting Language


    The scripting language between the opening and closing script tags could be JavaScript,
    VBScript, or some other language. Even though JavaScript is usually set as the
    default scripting language in browsers, there may be some browsers that do not
    default to JavaScript.'
  merge: -1
