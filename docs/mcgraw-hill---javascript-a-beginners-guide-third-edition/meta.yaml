  md: '2 JavaScript: A Beginner’s Guide


    # Key Skills & Concepts


    +   - Using Text Editors, WYSIWYG Editors, and Web Browsers

    - Defining JavaScript

    - Differences Between JavaScript and Other Languages


    Welcome to JavaScript: A Beginner’s Guide, Third Edition! You''re obviously interested
    in learning JavaScript, but perhaps you''re not sure what you need to know to
    use it. This chapter answers some basic questions about what JavaScript is, discusses
    its advantages and limitations, explains how you can use it to create more dynamic
    and inviting Web pages, and provides a brief history of the language.

    JavaScript is ubiquitous on the Wide Web. You can use JavaScript both to make
    your Web pages more interactive, so that they react to a viewer''s actions, and
    to give your Web pages some special effects (visual or otherwise).

    JavaScript often gets thrown in Hypertext Markup Language (HTML) as one of the
    recommended languages for beginning Web developers (whether you would build Web
    sites for business or pleasure). Of course, you can build a Web page by using
    only HTML, JavaScript allows you to add additional features that a static page
    of HTML can''t provide without some sort of scripting or programming help.


    # What You Need to Know


    Before you begin learning about JavaScript, you should have (or obtain) a basic
    knowledge of the following:


    +   - HTML and Cascading Style Sheets (CSS)

    - Text editors

    - Web browsers

    - The different versions of JavaScript


    If you have this basic knowledge (the different versions of JavaScript will be
    discussed in this chapter), then you''ll do just fine as you work through this
    book. Knowing another programming/scripting language or having previous experience
    with JavaScript isn''t required. This book is a beginner''s guide to JavaScript.

    If you think you don''t have enough experience in one of the aforementioned areas,
    a closer look at each one may help you decide what to do.'
