  md: "# Chapter 9: The Document Object\n\n![](bbox=[0.104, 0.11, 0.896, 0.37])\n\n\
    **Figure 9-6** The browser display after the button is clicked\n\n# # The forms\
    \ Property (Array)\n\nThe forms property is an array that has an entry for each\
    \ form on a Web page. The array gives you an alternative to using the formsname\
    \ property; however, you still need to study arrays in Chapter 11 before you look\
    \ into this array in more detail.\n\nWith the other similar properties, you can\
    \ use the length property in the form of document.forms.length to find out how\
    \ many forms are on the page.\n\n# # The images Property (Array)\n\nThe images\
    \ property is another array. It has an entry for each image on a Web page. With\
    \ the other similar properties, you can use the length property in the form of\
    \ document.images.length to find out the number of images that are in HTML document.\n\
    \nAnother thing this property can be used for is detect whether browsers support\
    \ the Image object in JavaScript. This is helpful if you wish to preload an image.\
    \ Preloading an image is a good idea when using image scrolls (which you can create\
    \ in Chapter 16) and can also be useful if you want to place in the viewer's cache\
    \ file an image that will be used on another page within your Web site, to make\
    \ that page load more quickly for the viewer.\n\nTo check whether a browser supports\
    \ the Image object, you can place any code that needs the Image object within\
    \ an block. The block will test for the existence of the document images, as shown\
    \ in the following example:\n\n```\nif (document.images) {\n    // This is where\
    \ you place the code that needs\n    JavaScript Statements = document.images property\
    \ to work\n}\n```\n\nNote all you need inside the parentheses is document.images.\
    \ If this exists, it returns true (since anything besides null would be treated\
    \ as true—basically a short way"
