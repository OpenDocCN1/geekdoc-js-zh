  md: '# Chapter 8: Objects 177


    You could instead have a truck, but leave the other features the same. Then you
    would have the following pattern:


    Automobile -> Truck -> CD Radio -> Digital Interface


    The preceding example works a little bit like a family tree, with the top level
    starting everything. Each level after the top level may have brothers and sisters
    (objects on the same level). Then the tree can continue expanding. The visualization
    can get confusing, so you shouldn''t be confused when you work with the actual
    JavaScript objects. Many objects go just one level deep, so you won''t need to
    worry about the “family tree” very much. The main thing you want to learn is that
    an object can hold a number of properties inside that you can access from the
    outside to your use in your scripts.


    # Why Objects Are Useful


    Objects are useful because they give you another way to organize things within
    a script. Rather than having a bunch of similar variables that are out there on
    their own, you can group them under an object.


    If you take your object and create variables to represent the features of the
    car, you can begin to see how this type of grouping works. You could create variables
    with the seats, engine, and theradio. You will not create the car object later
    in the chapter, so for now assume that the car exists and it has the properties
    of seats, engine, and theradio. Since these properties are variables, they can
    have values. The question is, how do you access these properties to get their
    values?


    In JavaScript, you access properties through the use of the dot operator, which
    is just a dot or period. For instance, if you wanted the value of the seats property
    of the car, you could access it with the following line:


    ```

    var ctype = car.seats;

    ```


    Don''t let the assignment of the seats property to a variable (ctype) be confusing.
