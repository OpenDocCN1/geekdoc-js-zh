  md: '# Introduction


    Welcome to JavaScript: A Beginner''s Guide, Third Edition! Years ago, I was surfing
    the Web and noticed that people were publishing pages about themselves and calling
    them homepages. After viewing a number of these, I decided to create a homepage
    myself. I had no idea where to begin but, through trial and error, I figured out
    how to code HTML and publish my documents on a Web server. Over time, I saw some
    interesting effects used on other pages (like alert messages that popped out of
    nowhere or images that would magically change when I moved my mouse over them
    I was curious and just had to know what was being done to create those effects.


    Eventually, one site revealed what they were using to create those effects: JavaScript.
    I searched for information on it, and came across a few tutorials and scripts
    on the Web. Since I had programmed in other languages (such as a relatively obscure
    language Ada), I was able to catch on to JavaScript quickly by looking at these
    tutorials.


    I learned that I decided to create a Web site that would teach HTML and JavaScript
    as beginners. As I began the project, I received questions from visitors who were
    over my head—forcing me to go deeper and learn more about JavaScript. As a result
    I became familiar with this scripting language and what it can do. Not only can
    I add effects to a Web page, you can create scripts that perform useful tasks,
    validate input form, add navigational elements to documents, or react to user
    events.


    The goal of this book is to help you learn the basics of the JavaScript language
    with as little hair pulling and smashing as possible. You do not need any programming
    experience to learn JavaScript from this book. All you need is knowledge of HTML
    and/or XHTML, Cascading Style Sheets (CSS), and how to use your favorite text
    editor and browser (see Chapter 1 for more information).


    azzi'
  merge: -1
  pgno: 21
