  md: '# Chapter 6: Conditional Statements and Loops


    **Q:** Why is the conditional operator often referred to as the ternary operator?


    **A:** The conditional operator is the only JavaScript operator that takes three
    operands. Because of this, it is often called the ternary operator rather than
    one of several ternary operators. If JavaScript makes changes to add new operators
    in the future, this to reference the conditional operator may change.


    **Q:** I don''t like the idea of nesting one block inside another. Can I just
    forget about it and never nest anything?


    **A:** You could do that, but it will severely limit the scripts you code later
    because you won''t be able to use one comparison statement within another (which
    is sometimes necessary in more complex scripts). Nesting allows you to perform
    more complex tasks, as you will see in later scripts. It is best to learn nesting
    so that you can make use of it when you need to.


