    the URL in quotes. If you escape the quotes in the anchor tag, JavaScript allows
    you to write the HTML code to the page using the document.write() method, as in
    this example:


    ```

    <script type="text/javascript">

    document.write("<a href=\"http://someplace.com\">Text</a>");

    </script>

    ```


    This does the job, but there is also an easier way to make this work if you do
    not want to escape quotation marks all of the time.


    To avoid escaping the quotes in the preceding code, you could use single quotes
    for the URL address, as in this code:


    Single quotes within double quotes are okay


    ```

    <script type="text/javascript">

    document.write(''<a href="http://someplace.com">Text</a>'');

    n</script>

    ```


    You can also do this other way if you prefer to use single quotes on the outside,
    as in this example:


    Double quotes inside single quotes are also okay


    ```

    <script type="text/javascript">

    document.write(''<a href="http://someplace.com">Text</a>'');

    n</script>

    ```


    The important point to remember here is to be sure that you do not use the same
    type of quotation marks inside the string you use to enclose the string. If you
    need to go more than one level deep with the quotes, you need start escaping the
    quotes; this is because if you switch again, it will terminate the string. For
    example, look at this code:


    ```

    document.write("John said, \"Jeff!\" to someone.");

    document.write("John said, \"Hi!\" to someone.");

    ```


    The first one would work, since the quotes are escaped to keep the string going.
    However, the second line only switches to double quotes when the single quotes
    within the'
