  md: 'string. Placing the double quotes without escaping them causes the string to
    terminate

    and gives an error.


    As you can see, quotation marks can be a real pain when you need to use a large
    number

    of them within a string. However, remembering to use the backslash to escape the
    quotes when

    necessary will save you a few headaches when you are looking for a missing quote.
    I''ve

    had to look for missing quotes in my code a number of times, and my head was spinning
    afterna few of these encounters! Later in this chapter, you will see that you
    can add strings together,

    which can simplify the use of quotes for you.


    # Boolean


    A Boolean variable is one with a value of true or false. Here are examples:


    ```

    var JohnCodes=true;

    var JohnIsCool=false;

    ```


    Notice that the words true and false do not need to be enclosed in quotes. This
    is because they

    are reserved words, which JavaScript recognizes as Boolean values.


    Instead of using the words true and false, JavaScript also allows you to use the
    number 1

    of true and the number 0, as we have shown:


    ```

    var JohnCodes=1; --- Using the number 1 is the same as using the value of true

    var JohnIsCool=0; --- Using the number 0 is the same as using the value of false

    ```


    Boolean variables are useful when you need variables that can only have values
    of true and

    false, such as in event handlers (covered in Chapter 7).


    # NOTE


    When we talk about the concept of a Boolean variable, the first letter of the
    word

    Boolean is capitalized (because it is derived from the name of the mathematician

    George Bool). However, the JavaScript reserved word boolean is written in all

    lowercase letters when you use the keyword in a script.


    # Null


    Null means that the variable has no value. It is not a space, nor is it a zero;
    it is simply nothing.

    If you need to define a variable with a value of null, use a declaration like
    this:


    ```

    var variablename=null;

    ```


    As with the Boolean variables, you do not need to enclose this value in quotation
    marks

    do with string values, because JavaScript recognizes null as a keyword with a
    predefined

    value (nothing).


    Null variables are useful when you test for input in scripts, as you''ll learn
    in later

    chapters.'
