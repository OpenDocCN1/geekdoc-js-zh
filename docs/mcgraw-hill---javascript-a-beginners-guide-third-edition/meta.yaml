    # Naming Variables


    Before you naming your variables, you need to be aware of JavaScript’s naming
    rules. The factors you need to consider when choosing names are case sensitivity,
    invalid characters, and the names that are reserved by JavaScript. Additionally,
    you should try to keep your variables names that are both easy to remember and
    meaningful.


    # Using Case in Variables


    JavaScript variables are case sensitive—paycheck, PAYCHECK, Payment, and PaYcHe
    are different variables. When you create a variable, you need to use the same
    case when you use that variable’s name later in the script. If you change the
    capitalization at all, JavaScript sees it as a new variable or returns an error.
    Either way, it can cause problems with your script.


    Here are a couple of suggestions for using case in your variable names:


    +   - If you are using a variable name that consists of only one word, it is easiest
    to use lowercase for the entire name. It will be quicker to type, and you will
    know when you use it later to type it all in lowercase.


    +   - For a name with two words, you might decide to capitalize the first letter
    of each word. For example, you may name a variable MyCar or My_Car (you will see
    more on the underscore character, _, in the next section).


    The capitalization of variables is entirely up to you, you should use whatever
    style you are most comfortable with. It is best that you adopt a convention and
    continue to use it. For instance, if you name a variable using lowercase characters
    only, you should do the same throughout the script to avoid accidentally switching
    the case when using the variable. In this book, I use lowercase characters for
    variable names, to keep the code clear.


    # Using Allowed Characters


    An important rule to remember is that a variable must begin with a letter or an
    underscore character (_). The variable cannot begin with a number or any other
    character that is not'
