  md: "# Chapter 4: Using Functions\n\nNotice that the update_alert() function is\
    \ where all the real action happens. Everything is a function call. The call_alert()\
    \ function does nothing more than call the update_alert() function so that it\
    \ is executed. Finally, you see the command that starts the entire sequence, which\
    \ is the call to the call_alert() function. Since this is the first JavaScript\
    \ statement outside a function, it is executed first. When it is executed, it\
    \ just calls the update_alert() function, which does the work of displaying the\
    \ alert.\n\n# NOTE\n\nMost browsers would execute the preceding example without\
    \ a problem if you defined the update_alert() after you called it. However, there\
    \ is a chance that some browsers may not be lenient and will want the function\
    \ before it is called. Also, if the function is too far down the code to be loaded\
    \ in time, it will not work correctly. Thus, it is normally best to define a function\
    \ before it is called.\n\nNow suppose you want to create three functions to perform\
    \ tasks. To make sure they occur in the correct order, you can call them from\
    \ order within another function. Here is an example of this technique with three\
    \ functions that calls alert for various purposes:\n\n```\nfunction update_alert()\
    \ {\n  window.alert(\"Welcome! This site is updated daily!\");\n}\nfunction section_alert()\
    \ {\n  window.alert(\"Please visit the picture section!\");\n}\nfunction links_alert()\
    \ {\n  window.alert(\"Also, check out my links page!\");\n}\nfunction get_messages()\
    \ {\n  update_alert();\n  section_alert();\n  links_alert();\n}\nget_messages();\n\
    ```\n\nThe code begins by defining the three functions to call each alert. Then\
    \ it defines the get_messages() function, which just calls all the previous three\
    \ functions. Of course, the get_messages() function must be called to actually\
    \ perform this action. This happens as the first statement outside of a function.\n\
    \nOf course, creating a script that pops up message after message is not something\
    \ you typically want to do. Although the example demonstrates the correct use\
    \ of function calls, a script that would do this would likely annoy your viewers!\
    \ You'll see examples of practical uses of functions in later chapters."
