    # Understanding Variable Types


    So far, you''ve seen examples of variable values that are. In JavaScript, the
    variable values, or types, can include number, string, and null.

    Unlike stricter programming languages, JavaScript does not force you to declare
    the type of variable when you define it. JavaScript allows virtually any value
    to be assigned to any variable. Although this gives you flexibility in coding,
    you need to be careful because you can end up with unexpected results—especially
    when adding numbers.


    # Number


    Number variables are just—numbers. JavaScript does not require numbers to be declared
    as integers, floating-point (decimal) numbers, or any other type. Instead, any
    number is seen as just another number, whether it is 7, -2, 3.453, or anything
    else. The number will remain the same type until you perform a calculation to
    change the type. For instance, if you use an integer in a variable, it won''t
    suddenly have decimal places unless you perform a calculation of some sort to
    change it (dividing unevenly).\As you''ve seen, you define a number variable by
    using the keyword var:


    ```

    var variablename=number;

    ```'
