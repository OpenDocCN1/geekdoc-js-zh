  md: "# 200 JavaScript: A Beginner’s Guide\n\nThe following sections discuss each\
    \ of these methods in more detail.\n\n**The back() Method** The back() method\
    \ sends the browser to the last page visited in the history list before the current\
    \ page, which is like using the browser’s “back” button. To use it, you simply\
    \ call the method in your script where desired. Thus, if you wanted your own “back”\
    \ button made from a form button, you could use something similar to the following\
    \ code. First is the HTML body section code (save as history_01.html):\n\n```\n\
    <body>\n<form>\n  <input type=\"button\" value=\"Back\" id=\"back_button\" />\n\
    </form>\n<script type=\"text/javascript\" src=\"history_01.js\"></script>\n</body>\n\
    ```\n\nNext is the example JavaScript code (save as history_01.js):\n\n```\nvar\
    \ bb = document.getElementById(\"back_button\");\nbbb.onclick = function () {\n\
    \  history.back();\n};\n```\n\nThe HTML page will display the “back” button. When\
    \ you click it, the browser will go to the last page visited before the current\
    \ page. If the browser window has no previous history, clicking the button will\
    \ do nothing.\n\n**The forward() Method** The forward() method sends the browser\
    \ to the visited in the history list after the current page, which is like using\
    \ the browser’s “forward” button. To use it, you simply call the method in your\
    \ script where desired. Using this, you could update your previous script to add\
    \ a “forward” button as well. The updated HTML and JavaScript code is shown below:\n\
    \nThe HTML code:\n\n```\n<body>\n<form>\n  <input type=\"button\" value=\"Back\"\
    \ id=\"back_button\" /> /> \n  <input type=\"button\" value=\"Forward\" id=\"\
    forward_button\" />\n</form>\n<script type=\"text/javascript\" src=\"history_01.js\"\
    ></script>\n</body>\n```\n\nThe updated JavaScript code:\n\n```\nvar bb = document.getElementById(\"\
    back_button\");\nvar fb = document.getElementById(\"forward_button\");\nbbb.onclick\
    \ = function () {\n  history.back();\n};\nfb.onclick = function () {\n  history.forward();\n\
    };\n```"
  merge: -1
