  md: "# Chapter 9: The Document Object\n\nThis code sets up a div element node with\
    \ an id of div1, another div element node with an id of div2, the link with an\
    \ id of answer_link. Now, if you want to change the HTML code in the div element\
    \ so it displays the answer for the viewer when the link is clicked, you can use\
    \ the click event on the link to start the script in motion and then the innerHTML\
    \ property on the div element node to change the contents of that element from\
    \ the question to the answer:\n\n```\nvar div1 = document.getElementById(\"div1\"\
    );\nvar a_link = document.getElementById(\"answer_link\");\n\nanswer_link.onclick\
    \ = function() {\n  div1.innerHTML = \"That is easy, the answer is <strong>4</strong>\"\
    ;\n  return false;\n}\n```\n\nRecall that in order to keep this link from being\
    \ followed when clicked, you add the return false statement after performing the\
    \ desired actions.\n\nWhen run, this script changes the content inside the div\
    \ element on the page, so that the HTML code would now be the following (though\
    \ it will not be using the browser's \"View Source\" command):\n\n```\n<body>\n\
    \  <div id=\"div1\">\n    That is easy, the answer is <strong>4</strong>!\n  </div>\n\
    \  <div id=\"div2\">\n    <a href=\"answer.html\" id=\"answer_link\">Get the answer</a>\n\
    \  </div>\n</body>\n```\n\nAs you can see, this can be a handy way to make dynamic\
    \ changes to the content of a Web page.\n\n# TIP\n\nTo make the script accessible\
    \ to without JavaScript, a default link destination (answer.html) is used. Including\
    \ the answer text on the linked page allows users without JavaScript to click\
    \ the link and obtain the answer to the question.\n\nUsing what you have learned\
    \ in this chapter to access the DOM and use the properties and methods of the\
    \ document object and the DOM nodes, you can build scripts to make any number\
    \ of alterations to the document’s appearance or content."
