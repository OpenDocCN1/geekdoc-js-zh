  md: '# Variables as Code Clarifiers


    Since variables represent something, and you can give them meaningful names, they
    are often easier to recognize when you read over (and debug) scripts. If you just
    add numbers, you may forget what they stand for. For example, consider this line
    of code:


    ```

    TotalPrice=2.42+4.33;

    ```


    Here, the numbers could mean anything. Instead, you might assign 2.42 as the value
    of a variable named CandyPrice and 4.33 as the value of a variable named OilPrice:


    ```

    TotalPrice=CandyPrice+OilPrice;

    ```


    Now, rather than trying to remember the memory of the numbers, you can see that
    the script is adding some of candy to the price of some oil. This is also useful
    in debugging, because the meaningful names make it easier to spot errors.


    # Defining Variables for Your Scripts


    Now that you understand what variables are and why you want to use them, you need
    to learn how to make them work in your scripts. You create variables by *declaring*
    them. Then you assign values to them using the JavaScript assignment operator.
    When you name your variables, you need to follow the rules for naming variables
    in JavaScript, as well as consider the meaningfulness of the name.


    # Declaring Variables


    To declare a variable, you use the var keyword, which tells the browser that the
    text to follow will be the name of a new variable:


    ```

    var varilename;

    ```


    For example, to name your variable cooler, the declaration looks like this:


    ```

    var cooler;

    ```


    In this example, you have a new variable with the name cooler. The semicolon ends
    the statement. The variable cooler does not have a value assigned to it yet. As
    described in the next section, you can give your new variable a value at the same
    time that you declare it or you assign it a value later in your script.


    The code for giving a variable name is simple, but there are some restrictions
    on words you can use for variables and the cases of the letters. You''ll learn
    more about JavaScript naming rules after you see how to assign a value to a variable.


    # Assigning Values to Variables


    To assign a value to a variable, you use the JavaScript assignment operator, which
    is the equal to (=) symbol. If you want to declare a variable and assign a value
    to it on the same line, use this format:


    ```

    var varilename=variablevalue;

    ```'
