  md: '# Making a Call to a Variable


    The following code shows how to write the value of a variable to a Web page using
    the document.write() method:


    ```

    <script language="JavaScript">

    var mycar="Corvette"

    document.write(mycar); // Prints the value of the mycar to the browser

    </script>

    ```


    The script begins by declaring a variable mycar and giving it a value of "Corvette".
    Then, in the document.write() command, you see that just the variable name is
    inclus within the parentheses. The result of this script is simply to write "Corvette"
    to the browser. There are no quotation marks around the mycar variable that is
    being written to the page. The reason for this is that the mycar variable has
    already been given a string value, so it does not need to be within quotes to
    print its value to the page in the document.write() command. Already, you can
    see how using a variable has the advantage of making a short document.write()
    command easier to code.


    # Adding Variables to Text Strings


    The preceding code just prints the value of the variable in the browser. If you
    want to variable print along with some other text in the string, the document.write()
    command becomes more complex. The text string needs quotes around it if it has
    not been defined as a variable, and the variable needs to be on its own. You use
    the addition operator (+) to add the value of the variable to the string, as shown
    in this example:


    ```

    <script type="text/javascript">

    var mycar="Corvette"

    document.write("I like driving my "+mycar); // A variable is added to the string
    that is written to the browser

    </script>

    ```


    This code prints the following sentence in the browser window:


    I like driving my Corvette.


    Notice the space after the word "my" in the code. This ensures that a space appears
    before the variable is added to the string. If you used the line


    ```

    document.write("I like driving my"+mycar);

    ```


    the result would be


    I like driving my Corvette.


    When adding strings, you need to be careful to add the spaces that you want to
    appear in the output.'
