  md: '# About the Author


    **John Pollock** is employed as a Web Administrator during the day and works on
    Web sites and other projects during the evening. He runs two Web sites devoted
    to Web development and design—PageResource.com (www.pagerresource.com) and JavaScript
    City (www.javascriptcity.com) is a site that offers free JavaScript code to Web
    developers. John holds a bachelor of arts in English from Sam Houston State University
    and currently lives in New Waverly, Texas with his wife Heather.


    # About the Technical Editor


    **Scott Duffy** is an author and consultant based in Toronto, Canada. He designs
    and develops Web sites for small and medium-sized companies.'
