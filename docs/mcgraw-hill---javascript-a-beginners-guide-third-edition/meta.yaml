  md: '# The Subtract-and-Assign Operator (-=)


    The -= operator works like the += operator, except that it subtracts the value
    on the right side of the operator from the variable on the left side. This value
    is then assigned to the variable. Here is an example of this operator in action:


    ```

    var money=1000;

    var bills=800;

    mymoney=bills;

    ```


    This example subtracts the value of the bills variable from the money variable
    and assigns the result to mymoney. In the end, mymoney has a value of 200. Since
    this is similar to the add-and-assign operator, let''s move on to the next one
    (which is also very similar).


    # The Multiply-and-Assign Operator (*=)


    The *= operator multiplies the value on the right side of the operator by the
    left side. The result is then assigned to the variable. The next example shows
    this operator at work:


    ```

    var money=1000;

    var multby=2;

    mymoney*=multby;

    ```


    Here, the variable mymoney is multiplied by the value of the multby variable,
    which is 2. The result of 200 is then assigned to the variable.


    # The Divide-and-Assign Operator (/=)


    The /= operator divides the variable on the left side of the operator by the value
    on the right side. The result is then assigned to the variable. Here is an example:


    ```

    var money=1000;

    var cutpayby=2;

    mymoney/=cutpayby;

    ```


    In this example, the variable mymoney is divided by the value of the variable
    cutpayby, and the result is 500 is then assigned to the mymoney.


    # The Modulus-and-Assign Operator (%=)


    Like the other assignment that also perform math, the %= operator does a calculation
    for the variable assignment. It divides the variable on the left side of the operator
    by the right side, takes the integer remainder of the division, and assigns the
    result to the variable. Here is how you might assign a value to the mymoney variable
    using the modulus-and-assign operator:


    ```

    var money=1000;

    var cutpayby=2;

    mymoney%=cutpayby;

    ```'
