    \ get the alert that says “You do not have the right number of boats,” while the\
    \ alert in the first block is ignored.\n\nNow you know the basic structure of\
    \ the if/else statement block, you are ready to learn the technique of nesting\
    \ one block inside another.\n\n# Block Nesting\n\nIf you need something, you are\
    \ basically putting one structure inside another structure of the same or a similar\
    \ nature. With the if/else statement blocks, you are able to nest other if/else\
    \ statements within the first block after the comparison (“if block”) or within\
    \ the second block after the keyword (“else block”).\n\nFor example, you would\
    \ like the browser to execute a statement such as the: “If a variable named have_cookbook\
    \ is equal to yes, and if a variable meatloaf_recipe is equal to yes, send an\
