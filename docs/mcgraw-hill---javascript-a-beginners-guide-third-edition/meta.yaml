  md: '# Chapter 4: Using Functions 79


    Q: What happens if I decide to remove a function from my script later?


    A: This can cause trouble if you do not also remove any calls you made to the
    function. The script may cause a JavaScript error; or it may run but give you
    unexpected results. Also, before you remove a function, make sure that it does
    not perform a necessary task someplace in the script.


    Q: So, what happens if I call a function that doesn''t exist?


    A: Either you will get a JavaScript error or the browser will do nothing when
    the function is called, since it cannot find the function.


    Q: What is the best way to determine when to use a function and when to just code
    what I want right into the script?


    A: For the most part, you want to use a function if the code within the function
    will be reusable in some way. An instance that performs a specific calculation
    might be useful in more than one spot in the script. Also, if you just like the
    idea of organizing the code a little more, a function helps with that. If you
    decide the code will be used once in the script, you may just want to put the
    code right into the script as it is or use an anonymous function for it.


