  md: '# Inserting Comments on One Line


    If you want to add comment on a single line in your code, place a pair of forward
    slashes before the text of the comment:


    ```

    // Your comment here

    ```


    In this format, anything preceding the two slashes on a line is "live" code—code
    that will be executed—and anything after the slashes on that line is ignored.
    For example, suppose that you write this in your code:


    ```

    document.write("This is cool!"); // writes out my opinion

    ```


    The document.write() method will be run by the browser, the text "This is cool!"
    will be written to the page. However, the comment after the slashes will be ignored
    by the browser.


    If you place the slashes at the beginning of a line, the browser will ignore the
    entire line. Suppose that you move the slashes in the previous example to be the
    first items on the line:


    ```

    document.write("This is cool!"); // writes out my opinion

    ```


    In this format, the line is ignored, it begins with the two slashes that represent
    a JavaScript comment. The text will not be written to the page, since the code
    will not be executed by the browser. In effect, you are disabling the document.write()
    statement. You may wish to do this if the script containing this line has an error
    and you want to know whether or not this is causing problem.


    # Adding Multiple-Line Comments


    Comments denoted by a pair of forward slashes apply only to the line on which
    they appear; their effects are cut off at the end of the line. To add comments
    that span any number of lines, you use a different comment format: a forward slash
    followed by an asterisk at the beginning of the comment, the text of the comment,
    and an asterisk followed by a forward slash at the end of the comment. Here''s
    an example:


    ```

    /

    My script will write some text into my HTML document!

    All of this is ignored by the browser.

    */

    document.write("You can see me!");

    ```


    Using this format, you can begin the comment on one line and end it on another
    line.


    Multiple-line comments can be handy when you want to insert lengthier descriptions
    or other text, but you need to be careful when you use them. Look at this example
    to see if you can find a problem with it:


    ```

    <script type="text/javascript">

    /*

    This code won''t work for some reason.

    ```'
