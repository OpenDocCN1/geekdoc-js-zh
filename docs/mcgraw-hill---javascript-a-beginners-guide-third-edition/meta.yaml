  md: '# JavaScript: A Beginner’s Guide


    # Key Skills & Concepts


    +   - Defining Conditional Statements

    - Using Conditional Statements

    - Defining Loops

    - Using Loops


    Now that you have seen the various operators work in JavaScript, this chapter
    will instruct you in how to put them to good use. Conditional statements and loops
    enable you to make use of the mathematical, comparison, and logical operators
    because they enable you to specify in your code that an action should occur only
    when a condition is met (conditional statements) or should occur repeatedly (loops).

    This chapter begins by introducing you to conditional statements. You will discover
    what they are and why they are useful to you in scripts. Then, you will learn
    all the conditional statement blocks and how to use them. After that, you will
    learn what loops are and why they are useful to you in scripts. Finally, you will
    find out about each type of loop and how to use it within your scripts.


    # Defining Conditional Statements


    In order to use conditional statements, you need to know what they are and why
    they are useful to you in your scripts.


    # What Is a Conditional Statement?


    A conditional statement is a statement that you can use to execute a bit of code
    based on a condition or to do something else if that condition is not met. You
    can think of a conditional statement as being a bit like cause and effect. Perhaps
    a good way to parallel it would be to use a parent might say, as in the following:


    > "If your room is clean, you will get dessert. Otherwise, you will go to bed
    early."


    The first cause would be a clean room, which would have the effect of getting
    dessert.

    The second cause would be an unclean room, which would have the effect of an early
    bedtime.

    In your scripts, you may want to create a similar statement. Perhaps something
    more like the following line:


    ```

    "If a variable named momoney is greater than 1000, send an alert that says my
    finances are OK. Otherwise, send an alert saying I need more money!"

    ```'
