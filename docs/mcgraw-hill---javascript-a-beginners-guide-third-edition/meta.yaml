  md: '# 198 JavaScript: A Beginner’s Guide


    There are different values for various types of machines. If you want to let the
    viewer know the machine type being used, you could send an alert with this property:


    window.alert("Your machine is a "+navigator.platform+" machine.");


    While not very useful, the property could be used to redirect viewers to an appropriate
    page based on their type.


    **The plugins Property** This array holds the values of all the plugins installed
    in the viewer’s browser. You will find out more about arrays in Chapter 12.


    **The userAgent Property** This property gives you another string of information
    about the browser. This string is the user agent header for the browser. In Firefox
    Firefox 3 for Windows XP, you might see the following string:


    ```

    Mozilla/5.0 (Windows; Windows NT 5.1; en-US; rv:1.9.0.4)

    Gecko/2008102920

    Firefox/3.0.4

    ```


    It is pretty similar to the text you saw for the properties of the navigator.appVersion,
    but with a little information.


    Now that you know about the properties of the navigator object, you are ready
    to look at the methods of the object.


    # Methods


    The navigator object also has a number of methods you can use to perform various
    tasks.

    Table 8-2 shows the methods available in the navigator object.

    nThe following section looks at the javaEnabled() method and how it can be used.


    **The javaEnabled() Method** This method returns a Boolean value of true if the
    viewer has Java enabled in the browser; otherwise, it returns false. The javaEnabled()
    method could be useful if you want to display a Java app to the viewer, but only
    if the viewer has Java enabled in the browser.


    | Method | Purpose |

    |---|---|n| javaEnabled() | Used to test whether or not Java is enabled in the
    browser |

    | mozzLocallyAvailable() | Checks to see if a file at a certain address is enabled
    locally (Firefox only) |

    | preference() | Allows certain browser preferences to be set (requires signed
    script) |

    | registerCommandHandler() | Allows a Web site to set itself as a potential handler
    of a certain MIME type |

    | registerProtocolHandler() | Allows a Web site to set itself as a potential handler
    of a certain protocol |

    | taintEnabled() | Returns false—because the method is no longer in use. It was
    used to specify whether or not data tainting was enabled in the browser |


    # Table 8-2 Methods of the Navigator Object'
