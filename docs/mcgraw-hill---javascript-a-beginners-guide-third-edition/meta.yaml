  md: "# Using an Event Handler in the Script Code\n\nYou can also use an event handler\
    \ within the script code (using script tags in the HTML document or using an external\
    \ JavaScript file). One way to do this is to give the element an id attribute\
    \ and then use the JavaScript document.getElementById() to access the element.\
    \ Once that is done, you can tie it to an event.\n\n# Add the id Attribute\n\n\
    To use the previous script in this way, you will first add an id attribute to\
    \ the HTML tag for the input button, as shown here:\n\n```\n<body>\n<form>\n \
    \ <input type=\"button\" value=\"Click Me!\" id=\"say_hi\" />\n</form>\n<script\
    \ type=\"text/javascript\" src=\"js_event_01.js\"></script>\n</body>\n```\n\n\
    Notice that the button input was given an id of say_hi. You will use this to access\
    \ the button and tie it to an event in your script.\n\n# Access the Element\n\n\
    The document.getElementById() method allows you to access any element in the HTML\
    \ document that has an id attribute using the value of its id. In order to access\
    \ the button input element by using an id of say_hi, you could use the following\
    \ code:\n\n```\ndocument.getElementById(\"say_hi\");\n```\n\nThis simply tells\
    \ the browser to access the element with the id of say_hi in the HTML document.\
    \ This method could be used directly in the script to access the element, but\
    \ oftentimes you will want to assign this expression to a variable if you are\
    \ using type script. Then, you could use the following code:\n\n```\nvar hi_button\
    \ = document.getElementById(\"say_hi\");\n```\n\nNow, grab the rest of the code\
    \ from the JavaScript file (js_event_01.js) and add the new line of code, as shown\
    \ here:\n\n```\nfunction hi_and_bye() {\n  window.alert('Hi!');\n  window.alert('Bye!');\n\
    }\n\nvar hi_button = document.getElementById(\"say_hi\");\nhi_button.onclick =\
    \ hi_and_bye;\n```\n\nThere is now an additional line of code. The last line of\
    \ code takes the variable used for the input button and gives it the onclick event\
    \ handler by adding it after"
