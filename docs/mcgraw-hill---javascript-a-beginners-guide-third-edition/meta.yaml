  md: "# Chapter 4: Using Functions 73\n\nThis example demonstrates why you need to\
    \ use the var keyword when declaring variables. Without the var keyword, you are\
    \ not creating variables inside the function (which would make them local). Instead,\
    \ you are changing the value of your global variables—you are issuing a reassignment\
    \ command rather than a new variable command. To clear this up, you need to change\
    \ one set of variable names or use local variables, as described in the next section.\n\
    \n# Using Local Variables\n\nA local variable can be used only within the function\
    \ in which it is declared. It does not exist outside that function, unless you\
    \ pass it along to another function by a parameter.\nnThe key to creating a local\
    \ variable in a function is to be that you declare it using the var keyword. Otherwise,\
    \ any global variables by that name could be changed, as you saw in the previous\
    \ example. To declare a local variable, you must place it inside a function and\
    \ use the var keyword, as shown in this code:\n\n```\nfunction new_car() {\n \
    \ var mycar=\"Ferrari\";\n  var paycheck=\"3500\";\n}\n```\n\nThe mycar and paycheck\
    \ variables are now local variables, which can only be seen and changed by the\
    \ new_car() function.\nTherefore, to correct the script in the previous section,\
    \ you just need to add the var keyword to declare the local variables inside the\
    \ function, like this:\n\n```\nvar mycar=\"Honda\"\nvar paycheck=1200;\nfunction\
    \ new_car() {\n  var mycar=\"Ferrari\";\n  var paycheck=3500;\n  window.alert(\"\
    You need $\"+paycheck+\" to get a \"\n```\n\nThe alerts should appear as you intended:\n\
    \nYou need $3500 to get a Ferrari\nYou make $1200 and have a Honda\",\n\nAs you\
    \ can see, the scope of a variable may be important when you send certain variables\
    \ as parameters to a function.\n\n# Using Variables As Function Parameters\n\n\
