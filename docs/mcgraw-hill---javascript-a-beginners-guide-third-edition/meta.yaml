    # Defining Loops


    To begin using loops, you will want to know what loops are, what they can do,
    and why they can be useful to you in your scripts.


    # What Is a Loop?


    A loop is a block of code that allows you to repeat a section of code a certain
    number of times, perhaps changing variable values each time the code executes.
    By doing this, you are often able to shorten certain tasks into a few lines of
    code, rather than writing the same over and over again the script and tiring your
    fingers.


    # Why Loops Are Useful


    Loops are useful because they allow you to repeat lines of code without retyping
    them or using cut and paste in your text editor. This not only saves you time
    and trouble of repeatedly typing the same lines of code, but also avoids typing
    errors in the repeated lines. You are also able to change one or more variable
    values each the browser passes through the loop, which again saves you the time
    and trouble of typing a line that is only slightly different than the previous
    line.


    As a simple example, suppose you wanted to write a sentence onto a Web page in
    a row using JavaScript. Do normally, you might have to write this eight times
    like the following:


    ```

    document.write("All this typing gets tiring after a while<br />");

    document.write("All this typing gets tiring after a while<br />");

    document.write("All this typing gets tiring after a while<br />");

    document.write("All this typing gets tiring after a while<br />");

    document.write("All this typing gets tiring after a while<br />");

    document.write("All this typing gets tiring after a while<br />");

    document.write("All this typing gets tiring after a while<br />");

    document.write("All this typing gets tiring after a while<br />");

    document.write("All this typing gets tiring after a while<br />");

    ```


    Ouch! Cut and paste can make the task easier, but it would be tedious, especially
    if you decide to write the sentence 50 times instead. With a loop, you could write
    that document.write() statement just one time and then adjust the number of times
    you want to'
