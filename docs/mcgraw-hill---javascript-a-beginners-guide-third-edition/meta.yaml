    # Ask the Expert


    +   Q: Do I really have to create an instance of an object every time I want one
    when I use a constructor function?


    +   A: Yes. The constructor function gives the browser the structure of an object.
    To use structure, you need to create an instance of the object. You will see in
    Chapter 12 that you need to create instances some of the predefined JavaScript
    objects as well.


    +   Q: So what about object initializers? I don''t have to create instances with
    them?


    +   A: Object initializers create an object rather than just giving it a structure
    like a constructor function. So, the object created doesn''t need to have instances
    created.


    +   Q: Will I need to use self-written objects a lot?


    +   A: Probably not, but it depends on your script and what you want to do. Many
    of the scripts in this book use predefined JavaScript objects; however you may
    use a self-written object if it helps you with your scripts later.


    +   Q: Can an object have more than one method?


    +   A: You can include as many methods as you like in an object by repeating what
    you did with your method earlier in the chapter. For instance, you could have
    added another method to calculate the insurance costs of each type of car based
    on the properties you had for the types.'
