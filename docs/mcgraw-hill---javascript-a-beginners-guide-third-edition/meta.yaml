  md: "# Chapter 2: Placing JavaScript in an HTML File\n\nTo be safe, it is a good\
    \ idea to explicitly identify the language as JavaScript. You do do this by adding\
    \ the script attribute with the value of \"text/javascript\" to the opening script\
    \ tag:\n\n```\n<script type=\"text/javascript\">\n  // JavaScript code here\n\
    </script>\n```\n\nTells the browser scripting language will be JavaScript\n\n\
    The type attribute in the opening script tag is also required in XHTML for the\
    \ order Web page to validate.\n\nIn older versions of HTML, the script tag was\
    \ not case sensitive. However, with XHTML, the script tag must be in lowercase.\
    \ JavaScript is case sensitive in all versions, so you will need to be careful\
    \ with it. In this book, I will use XHTML 1.0 Transitional for the HTML code (all\
    \ tag and attribute names will be in lowercase). For the JavaScript code, I will\
    \ use the code that is needed for it to function correctly.\n\n# Calling External\
    \ Scripts\n\nScript tags are also useful if you wish to call an external JavaScript\
    \ file in your document. An external JavaScript file is a file that contains nothing\
    \ but JavaScript code, and it is saved with the .js extension. By calling an external\
    \ file, you can save the time of coding or copying a script into each page where\
    \ the script is needed. Instead, you can use a single line on each page that points\
    \ to the JavaScript file with all of the code.\n\nYou can call external using\
    \ an src attribute to the opening script tag:\n\n```\n<script type=\"text/javascript\"\
    \ src=\"yourfile.js\"></script>\n```\n\nThis example calls JavaScript file named\
    \ your.js from any page where you place the line. Be sure there are no spaces\
    \ or code between the opening and closing script tags, as this may cause the script\
    \ to fail.\n\nIf the script is extremely long, using the src attribute to add\
    \ the script to multiple pages on each page. Also, the browser will cache the\
    \ external JavaScript file the first time it is loaded, making subsequent Web\
    \ pages that use the script renderer. Using an external script is also helpful\
    \ when dealing with page validation and when to keep script separated from markup\
    \ (HTML) code.\n\n# Using <noscript></noscript> Tags\n\nOne way of providing alternate\
    \ content for those viewers without JavaScript (or JavaScript turned off) is to\
    \ use the noscript. The <noscript></noscript> tags may be placed anywhere in the\
    \ HTML document and can contain any content needed for viewers browsing without\
    \ JavaScript (such as viewers mobile browsers like the ones on Blackberry or iPhone).\
    \ For example:\n\n```\n<script type=\"text/javascript\">\n  document.write(\"\
    The color is red.\");\n</script>\n<noscript>\n  The color is red.\n</noscript>\n\
    ```\n\nDisplays for viewers with JavaScript\n\nBegins noscript content for those\
    \ viewers without JavaScript\n\nEnds noscript content"
  merge: -1
  pgno: 39
- img_proc: false
  md: "# Ask the Expert\n\n**Q:** Do I always need to use script tags to add JavaScript\
    \ to a page?\n\n**A:** It's possible to use event handlers that allow you to write\
    \ short bits of script within the event-handling attribute of an HTML tag. You'll\
    \ learn about event handlers in Chapter 7.\n\n**Q:** What about the language attribute?\n\
    \n**A:** With XHTML, the language attribute has been replaced by the type attribute.\
    \ The language attribute may cause a Web page to fail XHTML validation (in XHTML\
    \ strict) and is no longer considered.\n\n**Q:** My page won't validate in XHTML\
    \ strict (or transitional) when I add a script to it. How do I get the page to\
    \ validate?\n\n**A:** If the script contains characters used in XHTML such as\
    \ < (which is used for “less than”) in JavaScript but is seen as the beginning\
    \ of a new tag in XHTML), then the page won't validate with the script directly\
    \ in the document without a CDATA section:\n\n```\n<script type=\"text/javascript\"\
    >\n<![CDATA[--\nvar x = 5;\nvar y = 10;\nif (x < y) {\n  window.alert(\"x is less\
    \ than y\");\n}\n]>\n</script>\n```\n\nThis will allow the page to validate, but\
    \ because the <!CDATA[ and ]> characters are in the script, it will no longer\
    \ work. To fix this, you need JavaScript comments (/* and *) around those characters\
    \ when they are within the script tags:\n\n```\n<script type=\"text/javascript\"\
    >\n<!--<!CDATA[/*\nvar x = 5;\nvar y = 10;\nif (x < y) {\n  window.alert(\"x is\
    \ less than y\");\n}\n*/]]]-->\n</script>\n```\n\nAs you can see, this can get\
    \ tedious very quickly! Typically, the better option is to use an external script\
    \ file, which eliminates this problem because only the script tags themselves\
    \ are needed in the XHTML document."
  merge: -1
