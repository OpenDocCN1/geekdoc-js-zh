    # Calling Functions in Your Scripts


    Now that you know how the function itself, you need to learn how to call a function
    in

    your script. A call to a function in JavaScript is simply the function name along
    with the set of

    parentheses (with or without parameters between the opening and closing parentheses),

    with a semicolon; a normal JavaScript statement:


    ```

    functionname();

    ```


    You can call functions anywhere in your script code. You can even call a function
    inside

    of another function. A good rule to follow is to have the function definition
    come before the

    call in the script. The easiest way is to ensure that your function definition
    comes

    before your function call is to place all of your function definitions as the
    beginning of the

    script as possible.


    Defining a function before calling it is a suggestion for good coding practice,
