    # Type Conversions in Addition Calculations


    It is important to note how JavaScript performs type conversion when working with
    the mathematical operators. When you use the addition and other mathematical operators,
    you need to be aware that JavaScript automatically converts different values,
    like an integer (nondeciem numeric value) and a float (a decimal numeric value)
    to the appropriate type. For instance, you might have the following code:


    ```

    var num1=4.73; // This variable has decimal places

    var num2=7; // This variable is an integer

    var thesum=num1+num2;

    window.alert(thesum);

    ```


    When the script runs, you will see an alert with the result.


    ![](bbox=[0.342, 0.423, 0.696, 0.513])


    JavaScript added the integer and gave back a float: 11.73. JavaScript does this
    often, so you need to make sure that you have the right sort of values when you
    begin adding.

    For example, if you add a number and a string, the result will come out as though
    you had added two strings. Look at this example:


    ```

    var num1=4; // This variable is a number

    var num2="7"; // Oops! This variable is a string, not a number

    var thesum=num1+num2; // When they are added, they are added like strings

    window.alert(thesum);

    ```


    This looks as if it were adding the numbers 4 and 7, since both appear to be numbers.
    The trouble is that the 7 is a string in this case, not a number, because it has
    quotes around it. This causes the 4 to be converted to a string, and the two strings
    are added (combined). The result that appears in the alert box may surprise you.


    ![](bbox=[0.342, 0.797, 0.696, 0.887])'
