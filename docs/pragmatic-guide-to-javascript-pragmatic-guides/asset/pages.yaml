    +   Appendix D acts as a quick reference to the best helpful resources about JavaScript
    itself and the main frameworks; it sums the relevant parts of Appendix C, plus
    a number of extra resources, mostly language-related. I put it at the end of the
    book so it''s easier to locate.


    # How to Read This Book


    In the Pragmatic Guide series, each chapter consists of two facing pages—one with
    text and one with code. If you''re reading this book on paper, this flows naturally.
    But if you''re reading an electronic edition of this book, you may want to set
    your reader to display two pages at once, in the side-by-side or “two-up” mode,
    provided your display is large enough. This will give you the best results.'
