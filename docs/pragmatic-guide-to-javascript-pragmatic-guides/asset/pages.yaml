  md: '# Achieving Code Privacy with the Module Pattern


    The more JavaScript there is in your codebase, the more your global scope get
    “polluted” with numerous functions and variables that would actually be better
    kept private whatever code it uses. With this comes the risk of name collision,
    with one script unintentionally overwriting another’s identifiers. This leads
    to bugs.


    We need to be able to create self-contained, opaque batches of JavaScript code,
    which would expose only selected-identifiers, if any, to the outside world. Indeed,
    this is a major requirement for “programming in the large,” being able to bring
    in frameworks and libraries in any page without risking a clash. This is what
    the module pattern is for.


    The whole idea of the module pattern is to create a scope for var-declared identifiers
    and functions, a scope that only functions defined inside it can access. To make
    some of these definitions accessible to the outside world, our enclosing function
    has two choices. it may return an object with these selected values as properties
    (see the facing page); we need to assign that returned object to a variable in
    the outside scope. Another way is to pass the enclosing scope object that it writes
    properties (to make these global, you''d simply pass window).


    In JavaScript, identifiers are first used with the var declaring keyword as local.
    (They belong to the current function defined.) Identifiers first used without
    var are global. (They''re grafted onto the current default scope, which most of
    the time means the global window object.)


    In a few specific circumstances, the current default scope will not actually be
    global, so there are ways to execute code in a context where non-var identifiers
    will not leak into the global namespace—but that is a bit outside the scope of
    this task.


    Technically, you do not have to name your “public properties” exactly like your
    private identifiers. Indeed, you could define public methods on the fly in the
    returned object literal using anonymous functions. But such practices would result
    in code that is more obscure (or misleading) to read and—perhaps more importantly—to
    debug. As a rule of thumb, whenever possible, try to define your functions using
    named function expressions:


    ```

    function myFunctionName(...) { ... }

    ```


    This makes for clearer code and helps a lot with the readability of the stack
    traces when debugging your JavaScript.'
