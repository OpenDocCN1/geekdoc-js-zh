  md: 'So, we started stretching our JavaScript muscles with Part 1, focusing- on
    a few key aspects of the language. It is now time to dive into what ties JavaScript
    and our web pages together: manipulating the DOM.


    DOM manipulations mostly fall into a few categories:


    +   - Getting references to the elements we want to manipulate, covered in Task
    4, *Obtaining References to DOM Elements*


    +   - Changing their appearance, either instantly or in an animated fashion (most
    of the time it''s about showing, hiding, or moving them), as described in Task
    5, *Dynamically Styling Content*


    +   - Altering their contents, which is illustrated in Task 6, *Changing an Element''s
    Contents*


    All of this happens either during page initialization, in reaction to specific
    events, or sometimes after some time has passed. We will therefore discuss the
    following:


    +   - Page initialization in Task 7, *Running Code When the DOM Is Loaded*. More
    specifically, we''ll discuss how to detect when the DOM is loaded so we can start
    tweaking it.


    +   - How to listen on events, looking at the basics in Task 8, *Listening for
    Events (and Stopping)*, then aiming for efficiency with Task 9, *Leveraging Event
    Delegation*, and finally gaining power with Task 10, *Decoupling Behaviors with
    Custom Events*


    +   - How to play with timers (for instance to simulate background processing),
    in Task 11, *Simulating Background Processing*.


    And because they are such critical building blocks of significant web application,
    I''m going to show you code for them in all the major frameworks I selected for
    this book; at this level, they''re all functionally equivalent anyway. Compared
    anatomy was all the rage a couple centuries ago; it still remains a good way to
    get a wider perspective on things.'
