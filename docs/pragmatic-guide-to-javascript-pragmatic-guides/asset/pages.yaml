  md: '# Simulating Background Processing


    You may need to carry out lengthy processing in your web page; perhaps you intend
    to provide a computationally intensive, graphical representation of a large dataset
    from a table. You want to keep the browser responsive while crunching numbers
    and drawing stuff. This calls for background processing.


    This is how JavaScript engines execute your code:


    +   * JavaScript is essentially single-threaded.

    * Your JavaScript-running thread is, for all intents and purposes, shared with
    the rest of your page''s behavior. The immediate consequence is that when your
    JavaScript code runs, no rendering happens. No new content, no reflow, no redrawing
    of a page partially obscured by another window...nothing.


    So, if you run some intensive processing, your page will freeze until processing
    completes. That usually means your entire browser will have "abort script" mechanisms
    in place. Others, such as Chrome, mitigate this by running every page in its own
    process.


    Unless you go with Web Workers (which is certainly not a cross-browser option
    for now), you need to rely on pseudo-parallel tricks, and the main trick relies
    on a few methods—setTimeout() and clearTimeout()—provided by the global object.


    The idea is to partition a big job into any number of smaller steps, keeping track
    of our progress, knowing when to stop, and scheduling chunks at regular intervals.
    When a chunk is done, chunk schedules the next one for a short time later; in
    the meantime, the browser regains control, thereby being able to handle page activity
    and any other scripting that needs to run.


    Also clearTimeout() and cleaning up the timer handle you stored from your setTimeout
    call are not strictly required, both actions are good practice, reduce memory
    leaks, and have virtually no performance cost.


    This technique is great for going through a large processing job, but it''s terrible
    for behaviors demanding a smooth progression—as visual effects—since timer precision
    varies wildly (25–500 ms). In such situations, you should use a single-interval
    timer and rely on time differences for accurate measurement.


    11. For a real example of this, check out the main loop of Thomas Fuchs''s awesome
    Emile, a fifty-line visual effects library at http://github.com/madrobby/emile.'
