  md: '# Debugging JavaScript


    # ## B.1 Here Be Dragons


    Just a few years back, the art of debugging JavaScript code felt like handling
    unstable nitroglycer blindfolded on a trampoline. Not only did we feel dramatically
    under-equipped, but the tools we did have at our disposal were rather unwieldy
    and on the whole did not feel very helpful (except, in all fairness, for the IE
    debugging tools inside Visual Web Developer Express, which had been there for
    a while and were quite good).


    After all, JavaScript debugging at the time seemed so borderline dangerous that,
    in its time-honored Ghostbusters-based name tradition, Mozilla’s JavaScript debugger
    was christened Venman, and his baseline was “Don’t cross the streams.” Yes, things
    were—or at least felt—that hazardous.


    Then Joe Hewitt dropped by and released to the world what he unassingly referred
    to as “a bunch of scripts put together.” Firebug cast a great beacon of light
    on our forsaken field (that is, front-end web development), and there was much
    rejoicing in the land.


    And because the bar had so raised and the game so changed, good people from all
    browser vendors rolled up their sleeves and started tackling these problems, in
    their own ways, which is why we now have Safari’s Web Inspector, Opera’s Dragonfly,
    and, yes, even a pretty decent JavaScript debugger in Internet Explorer 8. Still,
    Firebug keeps plough ahead (at somewhat varying speed, admittedly) and retains
    a special place in the hearts of web developers.


    # ## Setting Up a Debug Bench


    The walkthroughs in this appendix all use a test page with a bit of JavaScript
    to step through, play with, and generally demo the script-debugging facilities
    of each browser. You can find these two files—debugbench.html and its debugbench.js
    dependency—in the online code archive for this book.'
