  md: '# Dynamically Styling Content


    The ability to get the current value (specified or computed) of a CSS property
    for an element—and more importantly to change that styling—is of paramount importance
    when creating a web UI. Unfortunately, browsers and W3C specs leave us pretty
    much in the dark here. All libraries provide more or less the same API, as you
    can see on the facing page.


    The answer, for dynamic styling, is to use classes.


    Being able to tweak styles manually is useful for developing your visual effects,
    but that''s an exercise best left to library authors and JavaScript ninjas. I
    believe that you, as a front-end developer, should cleanly separate the specific
    styling from your JavaScript code and rely only on toggling CSS class names for
    your own stuff and built-in effects provided by your library of choice.


    Indeed, all libraries provide a uniform API to add, remove, and check the presence
    of CSS class names from an element. MooTools, jQuery, YUI, Dojo, and Ext use addClass(),
    hasClass(), removeClass(), and toggleClass(). Prototype just appends a Name suffix
    to those (that is, hasClassName()).


    But don''t forget the shortcuts!


    All libraries provide various shortcuts for common use cases, both on the get
    and set sides, such as visibility (hide/show/toggle), opacity (as per CSS''s spec,
    even on IE), dimensions, and so on. Check the docs—the method names are often
    obvious.'
