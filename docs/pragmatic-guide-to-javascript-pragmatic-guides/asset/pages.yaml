  md: '# DEBUGGING JAVASCRIPT


    +   - Toggle breakpoints on specific lines of code: just click at the line''s
    level in the source pane''s left gutter

    - Require that a given condition be satisfied for a breakpoint to trigger: right-click
    the breakpoint''s bullet in the gutter, and type the JavaScript expression for
    the condition.

    - Disable a breakpoint for a while, without losing its position and conditions:
    go to the Breakpoints subtab, and uncheck the breakpoint''s checkbox.

    - Once a breakpoint was hit, step through the code: icons above the source pane
    let step into (that is, if the current line calls a function, step inside that
    function), (run run such function calls without stepping inside them), and step
    out the current function and resume manual stepping back in the caller function)

