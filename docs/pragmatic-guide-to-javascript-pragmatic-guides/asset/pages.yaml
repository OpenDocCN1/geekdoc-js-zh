    \ - 2);\n}\n```\n\n# ## Firefox Firebug\n\nYou can get Firebug at getfirebug.com\
    \ for the Mozilla Add-Ons directory at addons.mozilla.org. At the time of writing,\
    \ Firebug is ramping up to release its 1.4 version; several alphas have been around\
    \ for a while. Firebug had a somewhat difficult period for a while, when its Ajax-related\
    \ features resulted in weird behaviors like double requests, but it's been m and\
    \ is coming back to us in better shape than ever. So, if you left it during 1.2\
    \ to 1.3, you should definitely give it another try.\n\nBy default, Firebug's\
    \ features are disabled on any address you're browsing, including local files.\
    \ This is for performance reasons, and you just need to click the Firebug icon\
    \ on the right side of your status bar to open the Firebug panel and start enabling\
    \ the features you want for the current domain, page, or file.\n\nFirebug is very\
    \ feature-rich, but the areas of most concern for this book are the Console and\
    \ Script tabs. The console is a live JavaScript command line and a log your scripts\
    \ can write to the global console object and its built-in methods such as log(),\
    \ debug(), error(), and group(), to name a few. (Read about the whole console\
    \ API on Firebug's website.)"
