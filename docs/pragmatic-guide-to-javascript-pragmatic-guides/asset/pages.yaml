    services, in the best mashup spirit. I chose three trendy topics here: playing
    with Twitter, Flickr, and geo-related APIs.


    +   Appendix A is my take on a JavaScript cheat sheet; I attempted to condense
    the reference of the language and the important tips, leaving out a few language
    elements I felt superfluous. I hope you find it useful.


    +   Appendix B is about debugging JavaScript; you owe it to yourself to know everything
