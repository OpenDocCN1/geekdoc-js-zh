  md: '# Syndicating Your Flickr Updates


    Flickr provides a fairly large


    You can get most of the useful query features more easily through YQL. However,
    in this particular instance, we can just hack through the JSON variant of the
    Atom feeds Flickr provides for most pages, including user pages. The resulting
    dataset contains all the information we need, including prebuilt image and profile
    URLs, dimensions, and publication dates. Such a feed is limited to the latest
    twenty picture updates, but this remains a great fit for “Flickr updates” syndication.


    The JSON fragment on the facing page illustrates the kind of resultset we get.
    We are most interested in the photo thumbnail URL and date of publication here.
    could get the original dimensions and date of taking with a bit more work, too.
    However, to keep things simple here, we''ll stick to a single request and not
    too much tweaking.


    The image URL we get the medium-size version of our photos, when we want smaller,
    square thumbnails. We just need to change the image URL suffix from _m to _s to
    fix that.


    The facing code also nicely illustrates the Template class from Prototype, which
    lets us efficiently produce “formatted strings” in a repeatable way.


    Again, you can get more information in an unauthenticated way using the YQL tables
    for Flickr (with one request for the original resultset and then extra queries
    per photo for further details). And if you need to grab more info yet, or actually
    update data, the API is there, too.'
