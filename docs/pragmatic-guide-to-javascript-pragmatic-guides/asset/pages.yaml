  md: '# # Pulling Off Classy Tooltips


    Native tooltips (obtained through title= are unreliable at best. Text wrapping
    vs. stretching vs. truncation, line breaks, and appearance delays are all browser-
    or user-dependent. Plus, their content is plain text—no styling and certainly
    no rich markup.


    To reclaim control, we need to implement our own tooltips, positioning elements
    that get shown or hidden when the mouse enters specific areas of the page (or
    when the user tabs through, for better accessibility).


    Since this book is JavaScript, I will devote into the CSS parts. Also, I''ll limit
    the design approach to simple stuff: not overlaying the trigger element, moving
    alongside the mouse cursor, providing in-tooltip mouse-based UI, and so on.


    So, for purposes, the crux of the implementation is this: use CSS to hide the
    tooltip by default, and add a :hover selector on the container element (which
    doesn''t have to be a link) to restore its visibility.


    ![](img/36d099f98df3fc1ec6be478c5e81f7a6_53_0.png)


    However, that implementation won''t work with IE6, which only obeys :hover on
    <a> elements. You must use a script to react to mouseover and mouseout manually.
    Here, because of the way Prototype implements show() and hide(), we can''t prefiere
    tooltips through CSS rules—this explains the small IE6 hack I show in the sample
    CSS on the facing page.


    For advanced needs, odds are you''ll find your fit among the host of tooltip libraries
    out there, either directly in frameworks or based on them. Personally, my favorite
    Prototype-based library is the kick-off Prototip2.¹¹³


    > 13. http://www.nickstakenburg.com/projects/prototip2/'
