  md: '# Debug bench


    ![](img/36d099f98df3fc1ec6be478c5e81f7a6_122_0.png)


    Figure B.1: FIREBUG''S BASIC SCRIPT VIEW ON OUR DEBUG BENCH


    The Script tab is the actual debugger. It lets you browse all the JavaScript parts
    of your page (loaded files, inline event attributes, and so on), set breakpoints,
    step through your code, keep an eye on specific expressions or variables (on the
    Watch subtab), and look at the current stack trace (in the Stack subtab). It''s
    all we need for scrutinizing your JavaScript code as it runs.


    The basic view of the script debugger for our test bench is in Figure B.1.


    There are basically two ways to get code running here: either drop into the console
    and step away JavaScript the code we intend to examine or cause events in the
    page that triggers the same code. In our debug bench page, the fibo() function
    is called with argument 20 when a button is pressed. You can verify this by clicking
    the button—you should get a dialog box with the result (6,765). There are a number
    of things you can do in the debugger to dig into the details of this function''s
    execution:


    +   Choose a script file (or HTML page with inline scripts): click the arrow next
    to the filename above the source pane, and select your file.


    > 1. Technically, many debuggers let you get into step-by-step mode any time an
    exception is raised (that is, when an error happens). In Firebug, click the arrow
    next to the Script tab''s label for this kind of feature.'
