  md: '# TALKING WITH THE SERVER SIDE


    The previous part showed, among other things, how we could go about validating
    as much input as we could on the client side. It also started dipping into server-provided
    data for more involved validations, completions, and so on. Most web apps rely
    on a back end to do their thing; how they “talk” with that back end is the topic
    of this part.


    +   - We''ll first talk about cookies, one of the earliest ways of persisting
    state across requests, allowing us to create a session of navigation for our users
    so we can remember what they''ve done, remember who they are, and so on. This
    is covered in Task 27, Reading/Writing Cookies. Permanent cookies, stored on the
    user''s disk, let us “remember” them across visits, too, which can have useful
    applications. Unfortunately, native cookie manipulation in JavaScript is rather
    poor; we''ll see how to deal with them more easily.

    - We''ll then focus on the Big Boy of Web 2.0 applications and services: First,
    we''ll cover the basics of how to talk with our server without reloading the page:
    this is in Task 28, Loading Stuff Ajax (Same Domain).

    - Then we''ll get a good look at JSON in Task 29, Using JSON, and its cousin JSON-P
    in Task 30, Using JSON-P. These are a great way of exchanging data between a JavaScript-driven
    client and any server (so much easier to wield than XML),

    - Finally, as an opening path toward mashups, we''ll cover most of the (numerous)
    ways of talking with third-party services located on domains other than ours.
    This is available in Task 31, Cross-Domain “Ajax” (Take 1), and Task 32, Cross-Domain
    “Ajax” (Take 2).


    Debugging Ajax or JSON-P calls can be pretty tricky. If you haven''t read through
    it, be sure to check Appendix B, on page 101. You''ll get all the tools you need
    there to comfortably pry into whatever client-server exchanges your code is doing:
    there''s just no point in needlessly wasting hours and pulling your hair.'
  merge: -1
