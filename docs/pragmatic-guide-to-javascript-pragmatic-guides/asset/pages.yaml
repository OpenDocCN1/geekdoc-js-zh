  md: '# JavaScript Frameworks


    JavaScript is a great language all by itself. But when it comes to interacting
    with its environment—such as the DOM, CSS, or XMLHttpRequest, to name only the
    most common client-side examples—pure-JavaScript feels like building a skyscraper
    with a couple flintstone axes and a bunch of slippery logs. This is mostly because
    of two factors: the raw DOM interfaces have no reasonably high-level factors,
    and most browsers deviate from web standards in their own oh-so-particular ways.


    Because of this, a large number of JavaScript frameworks arose. Some of them gained
    enough traction and followers to become very well established, and I''ll take
    you through the most prominent ones in this appendix.


    Understand this right now: you should very much use a framework, perhaps even
    multiple frameworks, depending on the project or task at hand. The source code
    for such frameworks is very likely more robust, better tested, better documented,
    and better supported than what you would write on your own. Also, it''s there
    already, so it can save you countless hours of frustrating development. Be pragmatic
    about it!


    Choosing a framework is an important task, and you should pay attention to a number
    of factors. Here''s a list you can use:


    +   - How long has it been? Is the code mature and stable? Is it well tested?
    (That is, is there a strong, lively community around it? Can I find help easily?


    +   - Is there de good documentation, preferably official?


    +   - Does its API design work with my own sense of aesthetics? When I use this
    framework, do I end up with code I like to read and write?


    +   - Does the framework serve a particular set of goals? Is it targeted at a
    specific developer audience? If so, do my goals, or my profile, fit?


    On the other hand, here''s an oft-touched criterion you should not care about:
    codebase size. Gone are the days when serving JavaScript had to be slow, my friend.
    Nowadays, there are numerous techniques we can use to serve'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'otherwise large and well-commented codebase with lightning speed. These include
    comment stripping, code compression,¹ good HTTP response headers to help browsers
    cache, CDN distribution, and more.


    Popular frameworks resort to most or all of these tools to ensure your pages grab
    them in no time at all, so don''t start arguing about a few measly source code
    kilobytes, OK?


    # Prototype, script.aculo.us, and Scripty2


    Prototype is the first well-known JavaScript framework. Sam Stephenson created
    it at 3signals all the way back in February 2005 to provide a unified, easy-to-use
    API for DOM manipulation, event handling, and Ajax. Thomas Fuchs created script.aculo.us
    in 2005 as a companion API to Prototype, growing from the well-known Yellow Fade
    Technique to a full-blown size for visual effects, drag-and-drop, and a few bare-bones
    UI widgets. Scripty2 is a complete rewrite and expansion of script.aculo.us, currently
    in beta, that''s very much geared towards visual effects.


    The team behind Prototype fluctuates around a kernel of half a dozen volunteers,
    most prominently Sam Langel, and Andrew Dupont. Available under an MIT license
    (basically, it''s open source and usable anywhere), the complete source is available
    on GitHub for browsing, forking, and tweaking, and there''s a feedback mailing
    list plus a bog report system.


    An ecosystem has evolved around Prototype, including PDoc (a code documentation
    system), Evidence (a unit testing framework), Sprockets (an advanced JavaScript
    processing and concatenation tool), and 역할을 (a plug-ins repository). The community
    is alive and kicking, mostly on Google Groups. A number of books exists; to date,
    the most current are Practical Prototype and script.aculo.us [Dup08], by Andrew
    Dupont, and Prototype and script.aculo.us [Por07], by yours truly.


    Although Prototype is generally considered the first well-known JavaScript framework,
    in the past two years its popularity has slowly declining, apparently moving toward
    jQuery. It is, however, that these frameworks address distinct—although overlapping—sets
    of networks (and they certainly have very different code aesthetics).


    Prototype''s architecture, code aesthetics, and cohesive API design are very well
    suited to significant codebases with robust APIs, and "porting" of many Ruby''s
    goodies (such as the Enumerable module) make a lot of algorithm-heavy code easy
    to write. It''s a framework for people who want to embrace JavaScript and write
    awesome stuff with it, growing and maintaining


    +   - Avoid code obfuscation, though or whoever debugs on top of it will hate
    you.'
