    SSD drives, making their overall *snappy*. On the heels of phenomenon, virtual
    machines are getting a place of honor in any serious developer''s toolkit. VM
    software is cheap, sometimes free, and options are quite numerous: Parallels Desktop^7
    (on OS, Windows, and Linux), VMware Fusion^8 (on OS) or VMware Workstation^9 (on
    Windows), VirtualBox^10 (on just about any major OS), and many more story.


    This commoditization of virtual machines lets us set up VMs to replicate all the
    browser windows we test for: IE6 to IE9, various versions of Safari, Chrome, Firefox,
    Opera, and so on. Most browsers will not let you run multiple versions of them
    on a single OS, or if they do, you will not get 100 percent identical behavior
    with that said browser being the only version installed (in case point: the third-party
    MultipleIE package on Windows XP). VMs let you isolate successive versions in
    distinct OS images. Best of choice is OS X; this is easy to set on *a single computer*.
    Typically, the host OS of choice is X because of many factors, but the most relevant
    to me is: it''s easy to set up a Linux or Windows in a VM, but it''s very hard
    to run OS X inside a VM hosted on a non-Mac platform.


    By all means, go VM! This is so much more convenient than having to use multiple
    boxes or remote desktops while you keep colliding with other web developers using
    the same time.


    # B.8 The Network Be Your Enemy


    Sometimes you run into bugs that feel like *heisenbugs*:^11 they happen only when
    you *don''t* look. As soon as you start stepping through your code or try to reproduce
    this on your development box, the elusive behavior is nowhere to be found. What
    gives?


    This typically happens with Ajax stuff and high-latency or flaky connections (such
    as dial-ups or your corporate proxy barely keeping its head above water). To reproduce
    this kind of situation, you can use software known as *slow proxies*. My favorite
    tool in this area, and perhaps the most well-known, is Charles,^12 a Java-based
    tool (hence running on all platforms). Not only does it let throttle your perceived
    bandwidth, adjust your latency, and generally tweak your perceived network behavior,
    but it can also *record and replay* network sessions, and it provides detailed
    HTTP/HTTPS monitoring. Such tools are a godsend!


