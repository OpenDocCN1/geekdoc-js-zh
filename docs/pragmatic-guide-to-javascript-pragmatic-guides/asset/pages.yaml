  md: '# Introduction


    If you''ve been paying even minimal attention to JavaScript these past few years,
    you''ve heard this before: it''s the Next Big Language. Once the province of half-baked
    implementations and useless scrolling messages, it has become a world-class, dynamic,
    object-oriented language with super-fast implementations on the client and server
    sides.


    On the one hand, JavaScript''s designers are endowing it with a new healthy dose
    of power, through the EcmaScript 5 (ES5) specification. On the other hand, kick-ass
    engines (such as V8, JavaScriptCore, SpiderMonkey, Rhino, and Karakan) and emergent
    technologies (with CommonJS and Node) make it both useful in browsers and as stand-alone,
    powerful architectures on the server. Even the upcoming Internet Explorer 9 is
    upping its JavaScript game with the promise of huge boosts.


    Not only is JavaScript a powerful, dynamic language, but it now has a rich ecosystem
    of professional-grade development tools, infrastructures, frameworks, and tool
    kits. It is versatile, fast, and very well suited to a wide range of programming
    tasks, especially when it comes to web-based applications and services.


    It''s time to dive in!


    # What''s This Book About, and Who Is It For?


    This book is not really intended to teach you “JavaScript language.” For one thing,
    the language itself is not very complicated, so if you have prior experience in
    programming any reasonably common language—even it''s just the basics (variables,
    loops, and so on)—you''ll get your bearings easily enough. You don''t need to
    actually know JavaScript already (although it could help), and you certainly don''t
    need to be any sort of programming guru.


    Actually, if you''re looking for the kitty-gritty and the hardcore technical details
    of JavaScript, you''ll be better off reading a dedicated resource, such as


    +   1. http://commonjs.org/

    2. http://nodejs.org/'
