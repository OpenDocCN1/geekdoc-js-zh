  md: '# Reading/Writing Cookies


    Directly tweaking cookies on the client side is often useful. We can use to spare
    our users the need to redefine their settings at every page load by persisting
    stuff such as pagination size, active tab (in a tabbed UI) across post-redirect,
    collapsed/expanded nodes in a tree, and so on.


    Regardless of how we set up these cookies (in scope or expiry), the only native
    interface to the cookie subsystem we get is "DOM Level 0" document.cookie property.
    This property acts as a generator when read and as a setter/deleter when written
    to. Unfortunately, it didn''t go out of its way to provide a neat interface for
    individual cookie settings. It feels like we''re reading and writing raw HTTP
    headers!


    So, to spare us this tedious, most frameworks provide, either directly or through
    well-known plug-ins, more comfortable access to cookies. Cookie management is
    a small enough matter, though, that you should not have to depend on a framework
    for it. Even if you use a framework already—which you should!—and it has cookie-related
    features, you may not like its API for it.


    That''s why, I on the facing page, I wrote a stand-alone cookies JavaScript helper.
    It does not require any framework and attempts to provide a handy API (especially
    when it comes to options). It''s well tested and documented; you may want to give
    it a shot!


    Finally, you should keep in mind a few facts about cookies:


    +   - They reside on the client side, so they''re pretty much naked in the wild.
    You should never put sensitive data in there, unless you''re encrypting and tamper-proofing
    them in some robust way.


    +   - They are severely limited in size (4KB) and should therefore not be for
    storing large items of data (such as history, complex cart contents, text drafts,
    and so on).


    +   - They might not be available, although this is a very rare phenomenon. What''s
    a bit more frequent, however, is for set-expiry cookies not to persist across
    sessions, because of security policies in the browser (either because of company
    security policies or because your user configured their browser that way out of
    privacy concerns).


    So, try to use cookies only for extra comfort, especially persistent cookies.'
