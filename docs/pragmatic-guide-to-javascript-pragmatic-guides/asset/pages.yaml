  md: '# Temporarily Disabling a Submit Button


    Sometimes forms take a while to be processed on the server side.

    Perhaps we''re uploading a large file using a good ol'' <input type="file" />
    field, or the server is just busy for some reason. At any rate, we do not want
    our user to resubmit the form while we are processing it.

    Double-submits are so irritating, do you know?


    To avoid this, we can react to our form being submitted by disabling any of means
    submission, which boils down to <input> or <button> tags with type="submit" or
    type="image" attributes. Because a few browsers (such as our beloved MSIE) do
    not handle CSS attribute well, so we should "tag" those elements with a specific
    class, say submit, and use it to select elements we intend to disable.


    On the facing page, the first script shows the minimum Prototype-based code for
    that. It''s fairly straightforward.


    You will likely want to get the extra mile and add some further UI decoration
    to your form as it is submitting; not all browsers render disabled fields in a
    clear visual style, and perhaps you also want to stress the fact that something
    going on. (You''re not just disabling to be obnoxious, are you?)


    The second script illustrates adding a custom class to our <input> tags. The UI
    update that results from applying CSS is not "built-in" as a disabling call, we
    also want to make sure our browser can "take a breath" before we submit the form
    (at which time it''s likely to ignore any further visual update and just plow
    ahead with the submission).


    To solve this common problem, delay() the submit() call by just tenth of a second.


    Also notice the that = closure trick in our JavaScript code here. As you may know,
    calling a function (in this case, we end up delay(ing) lose our current binding—the
    value this refers. Instead of forcing such binding, which requires an extra layer
    of function wrapping and is therefore pretty costly, we rely on closures to let
    the code inside our ad hoc anonymous function retain a reference to our original
    this (the form being submitted) in order to call submit() in it due time.21


    21. Queasy about JS function bindings? Check out my ALA article at http://www.alistapart.com/articles/getoutbindings/for
    details. Not sure about closures and how they''re useful?

    My pal Jury "Kangax" Zaytsev wrote a great article about it at mdn.microsoft.com/en-us/scriptjunk/ff696765.aspx.'
  merge: -1
