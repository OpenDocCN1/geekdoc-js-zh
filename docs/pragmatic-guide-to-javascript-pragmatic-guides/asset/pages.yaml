  md: "# Specify maximum lengths through markup.\n\n```\nform/feedback/index.html\n\
    <p>\n  <label for=\"edtDescription\">Description</label>\n  <textarea id=\"edtDescription\"\
    \ name=\"description\" cols=\"40\"\n  rows=\"5\" class=\"maxLength200\"></textarea>\n\
    </p>\n```\n\n# Set up feedback for maximum-length fields.\n\n```\nform/feedback/feedback.js\n\
    var maxLengths = {};\n\nfunction bindMaxLengthFeedbacks() {\n  var mClass, maxLength,\
    \ feedback;\n  $('*class*=max-length]').each(function(field) {\n    field.up('.p').addClass('feedback');\n\
    \    mClass = field.className.match(/\\bmaxLength\\(\\d+)\\b/)[0];\n    maxLength\
    \ = parseInt(mClass.replace(/\\D+/g, ''), ''), 10);\n\n    feedback = new Element('span',\
    \ { 'class': 'feedback' });\n    maxLengths[field.id()] = [maxLength, feedback];\n\
    \    updateFeedback(field);\n    field.observe('keyup', updateFeedback);\n   \
    \ observe('keypress', updateFeedback);\n\n    feedback.clonePosition(field, {\
    \ setHeight: false,\n      offsetTop: field.offsetHeight + 2 });\n    field.insert({\
    \ after: feedback });\n  });\n}\n```\n\n# Give feedback on the fly.\n\n```\nform/feedback/feedback.js\n\
    function updateFeedback(e) {\n  var field = e.tagName ? e.element() :;\n  current\
    \ = field.getValue().length,\n  data = maxLengths[field.id], max = data[0];\n\
    \  delta = current < max ? max - current : 0;\n  data[1].update('Remaining: '\
    \ + delta);\n  if (current > max) {\n    field.setValue(field.getValue().substring(0,\
    \ max));\n  }\n}\n```"
