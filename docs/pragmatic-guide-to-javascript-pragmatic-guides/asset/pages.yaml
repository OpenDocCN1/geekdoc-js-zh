  md: "# Schedule and cancel execution of code.\n\nThese are the two core methods\
    \ at the heart of simulating background processing with timers:\n\n```\nvar handle\
    \ = window.setTimeout(callback, intervalInMs);\nwindow.clearTimeout(handle);\n\
    ```\n\n# Let your worker toggle background processing.\n\nThis book's source archive\
    \ includes a visual demo. The crux of the code goes like this:\n\n```\ndom/background.js\n\
    var CHUNK_INTERVAL = 25; // ms.\nvar running = false, progress = 0, processTimer;\n\
    \nfunction runChunk() {\n  window.clearTimeout(processTimer);\n  processTimer\
    \ = null;\n  if (!running) return;\n  // Some work chunk. Let's simulate it:\n\
    \  for (var i = 0; i < 10000; i += (Math.random() * 5).round())\n    ++progress;\n\
    \    updateUI(); // See source archive -- just updates a progressbar\n  if (progress\
    \ < 100)\n    processTimer = window.setTimeout(runChunk, CHUNK_INTERVAL);\n  }\
    \ else {\n    progress = 0, running = false;\n  }\n}\n\nfunction toggleProcessing()\
    \ {\n  running = !running;\n  if (running) {\n    processTimer = window.setTimeout(runChunk,\
    \ CHUNK_INTERVAL);\n  }\n}\n```"
