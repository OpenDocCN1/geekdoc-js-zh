  md: 'I wish I had owned this book when I first started doing JavaScript! ...it''s
    a must-read with great reference material for everyday JavaScript tasks.


    # Pragmatic Guide to JavaScript


    JavaScript is everywhere. It''s a key component of today''s Web—a powerful, dynamic
    language with a rich ecosystem of professional-grade development tools, infrastructures,
    frameworks, and toolkits. This book will get you up to speed quickly and painlessly
    with the 35 key JavaScript tasks you need to know.


    The task-oriented two-page spreads get you up and running fast. The left pages
    explain the underlying implementation for each task, and the right pages contain
    code snippets for each task, along with cross-references to related tasks.


    You''ll learn essential JavaScript tasks in a framework-agnostic way. Learn how
    to manipulate the DOM and CSS, and how to use event handlers and timers. You will
    discover JavaScript tricks for user interface functionality: tooltips, lightboxes,
    image processing, infinite scrolling, and more. You work with forms for receiving
    and validating input and explore the client-server relationship with cookies,
    JSON, and Ajax, as well as mashups with Twitter, Flickr, and geo-referenced APIs.
    We round it off with a cheat sheet that gives you JavaScript at a glance.


    Use this Pragmatic Guide to get started creating your own killer web applications,
    quickly and professionally.


    Christophe Porteneuwe has been doing IT R&D for more than ten years, specializing
    early in web development. He joined Prototype Core in 2006 and is the author of
    Prototype and script.aculo.us. Christophe is the CTO of Ciblo.net in Paris, France.


