  md: '# 23 Validating Forms: The Whole Nine Yards


    The two previous tasks—Task 21, Validating Forms: The Basics, on page 56 and Task
    22, Validating Forms: Going Further, on page 58—dealt with required fields and
    text input pattern checking. We now need to ping the server side for more-up-front
    checking.


    This is our first use of Ajax in this book, an area of JavaScript that can be
    troublesome to debug. If you haven''t yet, read through Appendix B, on page 101,
    before going on; the information there will, ideally, prove invaluable when you
    try to troubleshoot or tweak event- or Ajax-driven code.


    The poster child of Ajax validation is unique fields. Most often, this is logins
    and email addresses. We''ll implement such a check here for a login field, assuming
    an application mandates logins that are unique across all users.


    An important facet of Ajax validations is on-the-fly UI feedback, with behaviors
    such as check-in-progress and check-result indicators. So, our markup must plan
    for these UI elements. On a higher level, you must also decide, perhaps on a per-field
    basis, what triggering behavior you''re looking for. Should you check input *as
    it''s typed* (using high-frequency field monitoring) or *once it''s typed* (using
    change events)? In this example, I went with the former option, implying Prototype''s
    Field.Observer mechanism, which I did² with a 0.8" interval² so as not to strain
    slow typists too much.


    Our check starts by ignoring empty or one-letter inputs, assuming our system requires
    logins to be at least two characters long (so checks on shorter text would be
    useless). Then it fires up an Ajax GET request to a server-side checking script
    and relies on the HTTP response code (2xx = success; anything else is failure,
    with a special check status *is* filled in, because Opera ignores many 4xx codes
    to update the feedback UI appropriately.


    I also put a tiny server-side pseudo-check code in there. It simulates Internet-connection
    latency so you can see the spinner now and, and it returns appropriate HTTP response
    codes, depending on whether the login you typed is already known or not.


    > Yes, my geeky friends, I could have said "a 1.25Hz frequency."'
