  md: '# Using Optional, Variable, Named Arguments


    To master argument-fu, the thing you must really grok is: the parameters you explicitly
    name do not constrain the arguments you actually pass. Every function keeps a
    list of the arguments passed to it in a predefined local variable that behaves
    like an Array. (It has length and a [] operator.) So, declaring parameters is
    equivalent to providing local names for the first arguments that may be passed.
    If arguments are indeed passed in these positions, these identifiers will refer
    to them. If not, the identifiers will be undefined.


    Now, pay special attention to the beginning of the optional arguments example
    on the facing page. We''re testing whether a second argument was passed by using
    an undefined === rant test. Why the triple equal sign? The answer lies in the
    equivalence rules of JavaScript. Check this out:


    ```

    undefined === null // false

    undefined == null // true

    ```


    Ah. So, we consider null a valid value for rant, we need to check not only the
    value but the type of rant. That''s exactly what === does. It''s the strict equality
    operator.


    Often enough, you''ll use a more lax defension of “missing” for your argument.
    For instance, rant is supposed to be a usable test: empty strings, null, undefined,
    0, and false would likely all be considered. All of these are false-equivalent
    in JavaScript, so we could get pretty concise here:


    ```

    rant = rant || ''IE6 must die!''

    ```


    This broad range of false-equivalence in JavaScript is the main reason I use the
    in in the fourth example on the facing page, to determine whether the options
    object has a property already—instead of just testing options(opt). This code
    is fairly generic, and we''d like to be able to use it anywhere, so we''re taking
    a conservative approach and testing actual property presence, regardless of the
    property''s value.


    That example also shows the proper use of the for...in construct to iterate over
    an object''s properties.


    Finally, notice how I defined the defaults for repeat()''s arguments in a public
    property of the function itself. This allows our user to modify the defaults without
    resorting to a global object that is not syntactically related to our function.
    To generically grab a reference to our function from within itself, we use the
    special callee property of arguments.'
