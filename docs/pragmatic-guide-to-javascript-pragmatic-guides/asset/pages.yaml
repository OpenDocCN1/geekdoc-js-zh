  md: "# Implement JSON-P with bare-bones code.\n\nIn its simplest form, it just goes\
    \ like this:\n\n```\nserver/jsonp/jsonp.js\ndocument.element.firstChild.appendChild(\n\
    new Element('script', { type: 'text/javascript',\n  src: this.href + '&r=' + Math.random()\
    \ });});\n```\n\nThe previous code executes in the context of a link click handler,\
    \ so **this** is the <a> element being activated.\n\nThe random parameter is there\
    \ to circumvent browser caching; in production code, you'd check the URI decide\
    \ whether to prefix it with or ?.\n\nA more advanced way is to use dynamic id=\
    \ attributes for scripts and remove them-post to avoid flooding the DOM. The dynamic\
    \ id= can double as random parameter:\n\n```\nserver/jsonp/jsonp.js\nvar script\
    \ = new Element('script', { type: 'text/javascript',\nsrc: this.href});\nscript\
    \ += ('&r=' + script.identify());\nscript.observe('load', Element.remove.curry(script));\n\
    document.element.firstChild.appendChild(script);\n```\n\n# Use JSON-P facilities\
