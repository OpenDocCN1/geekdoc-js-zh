  md: "# # JavaScript Cheat Sheet\n\n# ## Built-in types & literals\n\n| Number |\
    \ 0, 42, 15, 310, -3e12 |\n|---|---|\n| String | \"Hello\", 'hello' (allows escapes\
    \ like \\uxxxx (unicode)) | |\n| Boolean | true, false |\n| Array | [1, 2, 3],\
