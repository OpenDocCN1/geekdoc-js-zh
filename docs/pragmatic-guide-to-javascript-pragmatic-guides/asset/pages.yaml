  md: '# IE8 and Developer Tools


    There''s no question about it: Internet Explorer 8 is a great step in the IE world.
    Aside from notable improvements in web standards support (although it still lags
    far behind modern browsers, it''s certainly not stuck in the Cretaceous among),
    these points are of immediate interest to us JavaScriptScripters:


    +   - The JavaScript engine in IE8 is on average seven times slower than other
    JavaScript engines in released browsers. This peaks at a factor of almost-twelve
    against Chrome''s V8 or the latest builds of Safari''s Squirrelish Extreme and
    Firefox''s Tracermonkey.


    Why is that a good news? IE7 used to be by ninety times slower. IE6 couldn''t
    live with the shame of its own factor figure. So, the IE team managed to improve
    its JavaScript engine by a factor of about thirteen, which has to be declared
    awesome, like it or not.


    +   - The DOM performance in IE8, is our second major pain point when scripting,
    which has also received significant love and is now lagging by an average factor
    of "only" four, which is also a major improvement.


    +   - IE8 has built-in "Developer Tools," which are a cleaned-up, snappier version
    of the IE Developer Toolbar we use in IE6 and IE7, with an actual JavaScript debugger
    thrown in. One that actually works and doesn''t entail incessant glitches between
    IE and an external debugging app.


    So, not only can we start thinking about enabling our fancy effects and Ajax operations
    in the IE world, but we can also do knowing debugging a whole lot easier!


    Incidentally, IE8 also explores ways to reduce the perceived performance impact
    of script loading. You still should use generic optimizations as “load scripts
    at the bottom of the page”³ and, even more importantly, script concatenation (for
    example, through Sprockets⁴) and gzip:ping⁵.


