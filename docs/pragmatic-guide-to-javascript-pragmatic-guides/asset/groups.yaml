    \ ref.cumulativeOffset().top - orig);\n    }\n  });\n};\n```\n\n## 第四部分\n\n###\
    \ 表单艺术 (Form-fu)\n\n表单是 Web 应用的关键部分。我们不断从用户那里收集信息以填写个人资料、设置任务和服务、发送消息等等。你在网上遇到的大多数表单在可用性和人体工程学方面处于糟糕状态。这部分尝试提供许多配方，以便在处理表单时改善用户体验（越来越多被称为\
    \ UX）。\n\n实用表单背的核心思想是：不要浪费用户的时间。\n\n- 避免重复提交，请使用任务 18：*临时禁用提交按钮*。\n- 让他们知道他们还可以输入多少文本，感谢任务\
    \ 19：*提供输入长度反馈*。\n- 允许他们随时切换选项，如任务 20 所示：*一次性勾选/取消勾选一组复选框*。\n- 尽可能立即验证他们的输入，参考任务\
    \ 21：*表单验证：基础*；任务 22：*表单验证：进阶*以及任务 23：*表单验证：全面指南*。难道你不喜欢事后发现用户名已被占用或密码不符合安全要求吗？\n\
    - 为特定字段提供额外帮助，如任务 24 所示：*提供实时帮助*。\n- 建议替代输入或补全：任务 25：*随输入自动补全*。\n- 让他们一次性上传多个文件：任务\
    \ 26：*动态文件上传*。\n\n这些只是为了让表单体验更加愉悦的一些示例。\n\n尽管如此，永远不要过度依赖 JavaScript。你的表单在没有脚本的情况下也应该能够工作；在编写表单时*渐进增强*至关重要。\n\
    \n## 临时禁用提交按钮\n\n有时表单在服务器上处理需要一段时间。也许我们正在使用 <input type=\"file\"/> 上传大文件，或者由于由于原因很忙。无论如何，我们都不希望用户在处理期间重复提交表单。双重提交非常烦人，不是吗？\n\
    \n为了避免这种情况，我们可以通过禁用任何提交手段来响应，这涉及到带有 type=\"submit\" 或 type=\"image\" 属性的 <input>\
    \ 或 <button> 标签。由于浏览器（如我们爱的 MSIE）处理 CSS 不良好，我们应该为这些元素标记一个类，例如 submit，并用它来选择要禁用的元素。\n\
    \n在页面上，第一个脚本显示了基于 Prototype 的最小代码。它非常简单。\n\n你可能想更进一步，在表单提交时添加一些额外的 UI 装饰；并不是所有的浏览器都会为禁用字段提供清晰样式，你可能还想强调这一点。（你不是为了混蛋而禁用的吧？）\n\
    \n第二个脚本说明了如何为 <input> 标签添加自定义类。应用 CSS 产生的 UI 更新并不是禁用调用的内置功能，我们还想确保在提交表单之前，浏览器可以“喘口气”（此时它可能会忽略任何进一步的视觉更新并直接提交）。\n\
    \n要解决这个常见问题，将 submit() 调用延迟十分分之一秒。\n\n还要注意我们 JavaScript 代码中的那个闭包（closure）技巧。如你可能所知，调用函数时（在本例中我们延迟）会丢失当前的绑定——即\
    \ this 指向的值。我们不需要强制进行这种绑定（这需要额外的函数封装层，因此开销很大），而是依靠闭包让我们临时匿名函数内部的代码保留对原始 this（即要提交的表单）的引用，以便在适当的时间在它内部调用\
    \ submit()。\n\n21. 对 JS 函数绑定感到不解？请查看我在 ALA 上的文章：http://www.alistapart.com/articles/getoutbindings/\
    \ 了解详细信息。不确定闭包及其用处？我的朋友 Jury \"Kangax\" Zaytsev 在该处写过一写很棒的文章：mdn.microsoft.com/en-us/scriptjunk/ff696765.aspx。\n\
    \n"
