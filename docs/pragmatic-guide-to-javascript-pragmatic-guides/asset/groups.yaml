    # 16 Implementing an “Infinite Scroll”


    Gmail introduced us to infinite scroll, spelling doom for pagination in a number
    of scenarios (certainly not all, though) find it more efficient to scroll through
    a boatload of items and use visual pattern matching rather than pointing to and
    clicking pagination link after pagination link.


    Pagination mostly arose for technical reasons alone:


    +   - Older browsers render slowly, forcing us to keep our pages “light enough.”

    - Bandwidth may be limited anywhere between client and server, encouraging us
    to stay lean.

    - Server-side processing time grows as the data grows. Rendering the entire dataset
    at once is not only unnecessary for a consumption standpoint but infeasible for
    our servers (or at the very least impractical and unwieldy), especially if they
    want to keep handling enough concurrent requests.


    Still, pagination was just one way—the nonJavaScript way. But as soon as JavaScript
    is enabled, you can hide any pagination links and replace them with infinite scroll
    when that makes sense. I leave that decision to your usability experts—and to
    your good sense.


    As you can see on the facing code, infinite scroll is nothing too fancy. The only
    tricky part is jumping through a couple of hoops to get our metrics right, across
    browsers, as evidenced in the lowEnough() method code.


    We check, essentially, that the bottom of the document is not too far below the
    bottom of your viewport. It’s just a matter of looking at the current state of
    vertical scrolling often enough—ten times per second is certainly snappy!—and
    loading more content through Ajax.


    From an accessibility (and failover) perspective, you may want to also offer pagination
    and perhaps hide Next links at setup time and then restore these links if your
    Ajax fetching fails users get an alternative.


    A note for you without a working PHP setup handy: you’ll just end up loading more
    stuff instantaneously, the PHP code simulates load time by waiting half a second
    before returning static content.'
- md: "\n## Check whether we scrolled low enough.\n\n```javascript\nfunction lowEnough()\
    \ {\n  var maxHeight = Math.max(document.body.scrollHeight,\n  document.body.offsetHeight);\n\
    \  var viewportHeight = window.innerHeight ||\n  document.documentElement.clientHeight\
    \ ||\n  document.body.clientHeight || 0;\n  var scrollHeight = window.pageYOffset\
    \ ||\n  document.documentElement.scrollTop ||\n  document.body.scrollTop || 0;\n\
    \  // Trigger for scrolls within 20 pixels from page bottom\n  return maxHeight\
    \ - viewportHeight - scrollHeight < 20;\n}\n```\n\n## Keep an eye on scroll level\
    \ and fetch more.\n\n```javascript\nfunction checkScroll() {\n  if (!lowEnough())\
    \ return pollScroll();\n  $('spinner').show();\n  new Ajax.Updater('posts', 'more.php',\
    \ {\n    method: 'get', insertion: 'bottom',\n    onComplete: function() { $('spinner').hide();\
    \ },\n    onSuccess: pollScroll\n  });\n}\n\nfunction pollScroll() { setTimeout(checkScroll,\
    \ 100); }\n\npollScroll();\n```\n\n## Maintaining Viewport When Loading Content\n\
    \nAt times, you may want to maintain the contents of the user's viewport—all that's\
    \ visible inside the browser—even as the user clicks to load more content above\
    \ it. For example, a user clicks to view previous comments, but you don't want\
    \ to push the user's scroll position down as the comments load from above.\n\n\
    In cases like this, you'll find yourself facing a small obstacle. Intuitively,\
    \ users expect that their position on the page will not move. But by loading content\
    \ above, you'll push the rest of the document, including the clicked zone, further\
    \ down the viewport and quite possibly outside of it.\n\nThe solution is to *preserve\
    \ the scrolling position relative to the viewport*. To do that, we need to grab\
    \ the viewport’s “scrolling offset”—the viewport position prior to loading content\
    \ above of what it displays—and restore that offset once the content has been\
    \ injected. Offsets are typically a messy business, full of cross-browser hairiness,\
    \ but to libraries such as Prototype and their position-related features, this\
    \ can actually be solved concisely.\n\nThe facing code is adapted from Gist by\
    \ Sam Stephenson. Before loading extra content, we grab the trigger link’s in-document\
    \ position (its `cumulativeOffset()`) and subtract it from the viewport's current\
    \ scrolling, which tells us how far down the trigger appears *in the viewport*.\
    \ Then, after the new content is injected, we determine what the viewport's new\
    \ offset should be, by using the converse substraction.\n\nReaders familiar with\
    \ Prototype may wonder why I went with `Ajax.Request` here, I did so because this\
    \ lets me grab the original scrolling position as late as possible, specifically\
    \ *after the Ajax request completes*, avoiding a weird “scroll reset” effect if\
    \ the user scrolls during the Ajax request.\n\nThis makes for a fairly nice user\
    \ experience, with very little code.\n\n## Preserve the viewport position.\n\n\
    ```html\nui/viewport/index.html\n<h2>Comments</h2>\n<div id=\"extraComments\"\
    >\n  <a id=\"LoadKnownComments\" href=\"?with_known_comments\">See previous\n\
    \  comments you already know about</a>\n</div>\n```\n\n<h3>Comment 5</h3>\n<p>Lorem\
    \ ipsum dolor sit amet, consectetur adipiscing elit, sed do\neiusmod tempor incididunt\
    \ ut labore et dolore magna aliqua. Ut enim\nminim veniam, quis nostrud exercitation\
    \ ullamco laboris nisi ut\naliquip ex ea commodo commodo consequat.</p>\n\n##\
    \ Grab the scroll before Ajax, and adjust after it.\n\n```javascript\nui/viewport/viewport.js\n\
    function loadKnownComments(e) {\n  e.stop();\n  var zone = $('extraComments'),\
    \ ref = zone.next('h3');\n  var upd = new Ajax.Request('known_comments.html',\
    \ {\n    method: 'get',\n    onSuccess: function(res) {\n      var orig = ref.cumulativeOffset().top;\n\
    \      document.viewport.getScrollOffsets().top;\n      zone.insert({ before:\
    \ res.responseText() });\n      window.scrollTo(0, ref.cumulativeOffset().top\
    \ - orig);\n    }\n  });\n};\n```\n\n## Part IV\n\n### Form-fu\n\nForms are a\
    \ key part of web applications. We are always gathering information from our users\
    \ to fill in profiles, set up tasks and services, send messages, and whatnot.\
    \ Most of the forms you encounter online are in a sorry state of usability and\
    \ ergonomics. This part attempts to provide a number of recipes to make user experience\
    \ (increasingly known as UX) better when dealing with forms.\n\nThe key idea behind\
    \ useful forms is this: don’t waste your users’ time.\n\n- Save from double submits,\
    \ using Task 18, *Temporarily Disabling a Submit Button*.\n- Let them know how\
    \ much text they can still type in, thanks to Task 19, *Providing Input Length\
    \ Feedback*.\n- Allow them to toggle choices on and off menace, as shown in Task\
    \ 20, *(Un)checking a Whole Set of Checkboxes at Once*.\n- Validate immediately\
    \ as much of their input as possible, with Task 21, *Validating Forms: The Basics*;\
    \ Task 22, *Validating Forms: Going Further*; and 23, *Validating Forms: The Nine\
    \ Yards*. You too know who likes to discover belatedly that their username is\
    \ already taken or that their password does not comply with security requirements?\n\
    - Provide extra help for particular fields, as illustrated in Task 24, *Providing\
    \ On-the-Fly Help*.\n- Suggest alternative inputs or completions: Task 25, *Autocompleting\
    \ Input As Typed*.\n- Let them upload multiple files in one pass, that’s Task\
    \ 26, *Dynamic File Uploads*.\n\nThose are just a few examples of what you can\
    \ do to make forms more pleasant.\n\nStill, never forget that you cannot take\
    \ JavaScript for granted. All your forms should still work without scripting;\
    \ perhaps you can add layers of comfort. When putting forms, *progressive enhancement*\
    \ is paramount.\n\n## Temporarily Disabling a Submit Button\n\nSometimes forms\
    \ take a while to be processed on the server. Perhaps we're uploading a large\
    \ file using <input type=\"file\" />, or the server is just busy for some reason.\
    \ At any rate, we do not want our user to resubmit the form while we are processing\
    \ it. Double-submits are so irritating, do you know?\n\nTo avoid this, we can\
    \ react to our form being submitted by disabling any of means, which boils down\
    \ to <input> or <button> tags with type=\"submit\" or type=\"image\" attributes.\
    \ Because a few browsers (such as our beloved MSIE) do not handle CSS well, we\
    \ should \"tag\" those elements with a specific class, say submit, and use it\
    \ to select elements we intend to disable.\n\nOn the facing page, the first script\
    \ shows the minimum Prototype-based code for that. It's fairly straightforward.\n\
    \nYou will likely want to get the extra mile and add some further UI decoration\
    \ to your form as it is submitting; not all browsers render disabled fields in\
    \ a clear style, and perhaps you also want to stress the fact that something on.\
    \ (You're not just disabling to be obnoxious, are you?)\n\nThe second script illustrates\
    \ adding a custom class to our <input> tags. The UI update that results from applying\
    \ CSS is not \"built-in\" as a disabling call, we also want to make sure our browser\
    \ can \"take a breath\" before we submit the form (at which time it's likely to\
    \ ignore any further visual update and just plow ahead with the submission).\n\
    \nTo solve this common problem, delay() the submit() call by just tenth of a second.\n\
    \nAlso notice the that closure trick in our JavaScript code here. As you may know,\
    \ calling a function (in this case, we end up delay(ing) lose our current binding—the\
    \ value this refers. Instead of forcing such binding, which requires an extra\
    \ layer of function wrapping and is therefore pretty costly, we rely on closures\
    \ to let the code inside our ad hoc anonymous function retain a reference to our\
