    You''ll also find a treasure trove of articles by Christian Heilmann, an evangelist
    at YDN, sprinkled across a number of popular web development online magazines.
    The docs contain hundreds of examples with step-by-step instructions. The quality
    of the docs explains why, at this point, there are precious few books about YUI,
    though. The only book I found of significance dates back to YUI2: Learning the
    YUI! Interface Library [Wel08].


    YUI is fairly popular. However, YUI is mostly used in the rich Internet application
    (RIA) space, like Dojo, because it is perceived to be rather overkill (and overweight)
    for less-UI-intensive use cases. In that respect, it''s often used in conjunction
    with useful YDN resources as the “reset” and “grid” style sheets. The community
    interaction is centralized at the official YUI Library website.


    YUI sports a few very good "selling points":


    - It has a very cohesive API (its style is consistent throughout).

    - It''s extremely well-tested and well-documented.

    - It pays special attention to accessibility (for example, ARIA support).

    - Its modular, load-on-demand approach, coupled with its massive CDN, keeps it
    very usable in lightweight environments.

    - It is officially maintained and supported by a large corporation (Yahoo!), which
    makes it a fairly low-risk bet when building your project''s technology stack.


    I do believe that you should favor a lighter-weight library for anything that''s
    sufficient, though. It makes for less stuff to absorb and digest. It also makes
    it easier for you to contribute quickly by fixing or extending stuff you need.


    These are four URLs you should know:


    - The official website is at http://developer.yahoo.com/yui/3/

    - The source code repository is at http://github.com/yui.

    - Bug reports and feedback are found at http://yuilibrary.com/projects/yui3/report.

    - Community resources in general are at http://yuilibrary.com/


    ## C.5 ExtJS


    ExtJS is a full-blown RIA framework focusing on rich, desktop-like UI widgets
    as tree views, datagrids, and dialog boxes. It started in 2006 (I think) as an
    add-on by Jack Slocum, which you could use over Prototype, jQuery, or YUI. Since
    then, it has evolved into a standalone, large framework targeted at building rich,
    desktop-style user interfaces; for instance, having great data grids and is a
    popular tool for building website administration pages.


    ExtJS is a product of the eponymous company, which provides related tools as Designer
    and the GWT bridge. It is available under a triple license: GPLv3, commercial,
    and OEM. This license caused quite a stir when it launched, not least because
    it prevented use in non-GPL-compatible open source projects. On the other hand,
    it means you can get commercial tech support, training, and subscriptions from
    the library. It''s too bad the repository is closed, accessible only through a
    custom page.


    Like all good projects with a full-time workforce behind them, ExtJS is moving
    fast. At the time of writing, it''s version 3.1, and 2010 is expected to see several
    major releases up to 4.0.


    Documentation is rather good, with an easily browseable—if sometimes terse—API
    reference, obviously built with ExtJS, and numerous complete application samples.
    You''ll also find a few books, most notably ExtJS Cookbook [Ram09], and ExtJS
    in Action [Gar10], released in late 2009, due to its six-person management team
    of unknown size.


    Finally, given the somewhat nature of the project, the ecosystem is mostly limited
    to the official website, sporting forums, and a good wiki-based Learning Center
    offering demos, screencasts, tutorials, and more. These are the mandatory links:


    - This is the ExtJS official website: http://extjs.com/.

    - Download it at http://www.extjs.com/products/extjs/download.php.

    - You can find the forum at http://www.extjs.com/forum/

    - The Learning Center''s home is at http://www.extjs.com/learn/Main_Page.


    ## C.6 Dojo


    We will complete this tour of the most popular frameworks with Dojo. It was created
    in 2004 through the arduous and joint efforts of Alex Russell, Dylan Schiemann,
    and David Schontzler while at Informatica, and it released on November 5, 2007,
    split into Dojo (the core), Dijit (the UI widgets), and DojoX (the plug-ins and
    extended features).


    Dojo plays in the same space as ExtJS now. It''s a major RIA framework with huge
    corporate backing. It is now nurtured by the Dojo Foundation, which includes corporate
    sponsors as IBM, Google, AOL, Thomson Reuters, TIBCO, Zend, and Yahoo, to name
    only a few. Its current release at the time of writing is 1.5.0. Unlike ExtJS
    though, Dojo is actually open source, dual-licensed under the Academic Free License
    2.1 and the BSD license, and maintaining public GitHub, Subversion, and Bazaar
    repositories.


    Dojo is also close to projects that are now under the umbrella of the Dojo Foundation,
    the most-known ones being cometD and DWR, two early—and still relevant—systems
    for doing pushes from the server to the browser (not to forget Sizzle, Perseverance,
    and Generic Interface).


    Dojo is very active at development conferences (with many meetups!) and in general
    maintains a lively community with dedicated forums. As far as community strength
    goes, it''s probably second only to jQuery. You''ll find a number of good books,
    including Mastering Dojo [RGR08], Dojo: the Definitive Guide [Rus08], Practical
    Dojo Projects [Zam08], and more recently Getting Started with Dojo.


    The online docs are very good, split among a Quick Start, a Reference Guide, and
    the API documentation, plus a entry point "popular solutions" that are task-oriented
    (for example, "Create charts from datasets").


    In my opinion, should you need to create RIA-type, desktop-like applications based
    on web standards, Dojo should be your primary choice.


    We''ll wrap up this appendix with a quick list of Dojo''s important URLs:


    - This is the official website: http://www.dojotoolkit.org/

    - You can access the repository at http://svn.dojotoolkit.org/src/ (pity they
    don''t use Git).

    - You can find bug tracking and reporting at http://bugs.dojotoolkit.org/

    - You can engage with the community at http://www.dojotoolkit.org/community.


    # Getting Help


    Well, I certainly hope you found this book useful. Still, you''ll need to find
    some solutions yourself, or you may need someone to confirm you''re on track.
    So, where can you get more help and engage with other people about all this?


    ## D.1 Help on JavaScript in General


    Having great frameworks around is no excuse for not knowing your JavaScript. Sometimes
    you actually need to write some actual code, or perhaps you can''t make use of
    your usual framework for various reasons (performance on mobile devices, anyone?).

