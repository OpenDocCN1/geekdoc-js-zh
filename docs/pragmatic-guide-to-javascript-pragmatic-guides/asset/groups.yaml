    # 获取帮助


    针对语言本身。你会发现各种参与者，从完全的新手到了不起的大师。

    * 你也可以在少数几个特定语言的子组中获得非英语讨论，例如 de.comp.lang.javascript、fr.comp.lang.javascript、japan.comp.lang.javascript
    等。


    # 邮件列表和论坛


    你可以发现有很多论坛，根据发布者的身份，其质量从糟糕透顶到优秀绝伦不等。只需避开那些复制粘贴的“垃圾桶”即可；那是坏习惯随处可见的根源。


    * Google Groups 在我之前提到的新闻组上维护了一个桥接，你可以去这里。

    * Sitepoint 通常很不错，你可以尝试他们的 JavaScript 论坛。

    * Webdeveloper 活动非常频繁。


    但说真的，尽可能选择第一个（新闻组桥接）。它的信噪比更高。


    # IRC 频道


    啊，IRC。这是另一个老牌工具了，但它很棒，因为，嗯，它是即时通讯工具。另一方面，它的实用性取决于你在线时是否也有博学多才的人同时在线。

    主频道位于 irc.freencode.net，频道名为 ##javascript。在任何给定时间内通常有 300 到 400 人参与。稍微找一找，你也可以找到几个不错的非英语频道。


    # 延伸阅读


    你可以找到许多关于 JavaScript 的权威书籍。我已经在参考文献中列出了许多本，但我会对其中几部分进行评论：


    * *JavaScript: The Definitive Guide* [Fla06]，由 David Flanagan 著，被广泛认为是 JavaScript
    圣经，这很有趣，因为 *JavaScript Bible* [Goo07] 是 Danny Goodman 著，由 Brendan Eich 作序。（即将出版第七版。）

    * 你可能还想看看 *JavaScript: The Good Parts* [Cro08]，由 Douglas Crockford 著，他是 JSON 和
    JSLint 背后的高手，他一直告诉我们不要使用该语言提供的三分之二的功能（笑）。


    2. http://groups.google.com/group/comp.lang.javascript

    3. http://www.sitepoint.com/forums/forumdisplay.php?f=15

    4. http://www.webdeveloper.com/forum/forumdisplay.php?forumid=3


    jQuery 的 John Resig 最近在 Sitepoint 写了一本看起来很棒的小书：*Secrets of the JavaScript Ninja*
    [Res09]。


    仍在 Sitepoint（虽然稍微过时）但有一本由多个作者编写的优秀书籍：*The Art and Science of JavaScript* [AEH+07]。


    卓越传道士 Chris Heilmann 编写了 *Beginning Script with DOM Scripting and Ajax: From Novice
    to Professional* [Hei06]，这也是一本非常好的读物。


    如果不加上 Thomas Fuchs 和 Amy Hoy 的最新结晶，我就失职了，这真的是关于性能、性能、还是性能的伴侣工具：*JavaScript Performance
    Rocks!* [HF09]。


