- md: "\n# Providing On-the-Fly Tooltips on Forms\n\nSometimes we put forms online.\
    \ Fields have advanced semantics and nontrivial input rules. For instance, we\
    \ may enforce complexity requirements on password fields, in which case it's best\
    \ practice (and just plain polite) to warn our users up front. When multiple fields\
    \ require detailed warnings and instructions, our forms can get cluttered.\n\n\
    | Field | | | Description |\n| :--- | :--- | :--- |\n| Login* | | Logins must\
    \ be unique, at least 3 characters long, and may only use letters, numbers, white\
    \ space, hyphens, underscores and periods. |\n| Password* | | |\n| First name*\
    \ | | |\n| Last name* | | |\n\nA useful approach is to put such details in per-field\
    \ tooltips and make them visible only when needed—when the field has focus. In\
    \ short, it's a form-related variation on what we did in Task 12, Pulling Off\
    \ Classy Tooltips, on page 34.\n\nNote that the best place for it would be inside\
    \ the labels, not just in the same paragraph. This way, such information is available\
    \ to, say, blind users regardless of their screen reader's current mode.\n\nStyling—especially\
    \ in terms of positioning the tooltips—is very important to this task, so I show\
    \ some CSS on the facing page. That's admittedly a trivial example. It can be\
    \ enhanced, both code-wise and performance-wise, if you use a library that simulates\
    \ bubbling for the focus and blur events, so you don't have to explicitly register\
    \ event listeners for every relevant field. At the time of this writing, the latest\
    \ jQuery does this out of the box, and you'll find more or less official plug-ins\
    \ for your most popular JavaScript frameworks to fit the bill.\n\n# Put tooltips\
    \ where they’re useful.\n\n```html\nform/tooltips/index.html\n<p>\n  <label for=\"\
    user_login\">\n    Login:\n    <span class=\"tooltip\" style=\"display: none\"\
    >\n      Logins are unique, at least 3 characters long,\n      and may only use\
    \ letters, numbers, white space,\n      hyphens, underscores and periods.\n  \
    \  </span>\n  </label>\n  <input type=\"text\" id=\"user_login\" name=\"user[login]\"\
    \n    class=\"required\" />\n</p>\n```\n\n# Style for uniform, class appearance.\n\
    \n```css\nform/tooltips/tooltips.css\n#registration label { float: left; width:\
    \ 6em; position: relative; zoom: 1; }\n#registration input.text { width: 12em;\
    \ }\n#registration .tooltip {\n  display: block; position: absolute; left: 24em;\
    \ top: 0;\n  padding: 0.35em 0.5em 0.35em 2em; width: 15em;\n  border: 1px solid\
    \ silver;\n  color: gray; font-size: 80%;\n  background: #ffc url(lightbulb.png)\
    \ 0.5em 0.3em no-repeat;\n}\n```\n\n# Show on focus, hide on blur.\n\n```javascript\n\
    form/tooltips/tooltips.js\ndocument.observe('dom:loaded', function() {\n  var\
    \ attr = Prototype.Browser.IE ? 'htmlFor' : 'for';\n  function showTooltip() {\n\
    \    var tooltip = $('label['+attr+='+this.id+'] .tooltip').first();\n    tooltip\
    \ && tooltip.show();\n  }\n  function hideTooltip() {\n    var tooltip = $('label['+attr+='+this.id+']\
    \ .tooltip').first();\n    tooltip && tooltip.hide();\n  }\n\n  $('#registration').getInputs().invoke('observe',\
    \ 'focus', showTooltip)\n  invoke('observe', 'blur', hideTooltip);\n});\n```\n\
    \n# Autocompleting Input As It's Typed\n\nWhat's even better than validating input\
    \ before it's sent to the server? Validating input as the user types! By matching\
    \ users' ongoing input against a database of valid/useful inputs, we can make\
    \ suggestions that not only help them correct, say, spelling errors, but also\
    \ save them from manually typing long stuff that is common enough to show up in\
    \ our suggestions list.\n\nLocal search: Ajax search: (capitals of the world)\n\
    \n| City | Country |\n| :--- | :--- |\n| Georgetown | Guyana |\n| Naypyidaw |\
    \ Myanmar |\n| Pyongyang | North Korea |\n\nThis is traditionally referred to\
    \ as autocompletion. The only question is whether your reference datasource is\
    \ prefetched on the client side (as a simple Array or perhaps a more richly structured\
    \ object, such as a JSON literal) or is stored on the server, repeatedly queried\
    \ as typing progresses.\n\nHere's a good rule of thumb: if your datasource is\
    \ small enough (such as a reference list of states, currencies, or model names\
    \ within a single brand), fetch inside the script (for instance, generate the\
    \ JavaScript literal for it when rendering the page). Otherwise, go Ajax, and\
    \ be sure to tune the query frequency so you get good user experience even with\
    \ slow connections or quick typists.\n\nScript.aculus 1.8 has a good autocompletion\
    \ control with a ton of customization options, which we'll use here, along with\
    \ its Prototype substrate. Depending on your datasource location, you can use\
    \ either Autocompleter.Local or Ajax.Autocompleter (I know, the naming isn't very\
    \ consistent; sorry about that). In the first case, you just specify your datasource\
    \ array and tweak match behavior with a handful of options (fullSearch, partialSearch,\
    \ partialChars, ignoreCase). In the Ajax case, you provide the base URI and regular\
    \ Ajax-related options.\n\n# Mark up a field for autocompletion.\n\n```html\n\
    form/autocompletion/index.html\n<div class=\"p\" id=\"local\">\n  <label for=\"\
    edtCachedSearch\">Local search:</label>\n  <input type=\"text\" id=\"edtCachedSearch\"\
    \ name=\"search\" type=\"text\" />\n  <div class=\"completions\"></div>\n</div>\n\
    ```\n\n# Style for readability.\n\n```css\nform/autocompletion/autocompletion.css\n\
    .completions {\n  border: 1px solid silver; background: white; font-size: 80%;\
    \ z-index: 2;\n}\n.completions ul { margin: 0; padding: 0; list-style: none; }\n\
    .completions li { line-height: 1.5em; white-space: nowrap; overflow: hidden; }\n\
    .completions li.selected { background: #faf; }\n.completions strong { color: green;\
    \ }\n```\n\n# Autocomplete from a client-side datasource.\n\n```javascript\nform/autocompletion/autocompletion.js\n\
    var FREQUENT_SEARCH = [\n  'JavaScript', 'JavaScript frameworks', 'Prototype',\
    \ 'Dojo',\n  'MooTools', 'Ext', 'Ext JS', 'Script.aculus', 'Ajax', 'XHR'\n];\n\
    \nfunction initCachedCompletions() {\n  var field = $(edtCachedSearch), zone =\
    \ field.next('.completions');\n  new Autocomplete.Local(field, zone, FREQUENT_SEARCH,\n\
    \    fullSearch: true);\n}\n```\n\n# Autocomplete with Ajax.\n\n```javascript\n\
    form/autocompletion/autocompletion.js\nfunction initAjaxCompletions() {\n  var\
    \ field = $(edtAjaxSearch), zone = field.next('.completions');\n  new Ajax.Autocompleter(field,\
    \ zone, 'autocomplete.php',\n    method: 'get', paramName: 'search');\n}\n```\n\
    \n# Related Tasks\n- Task 23, Validating Forms: The Whole Yards, page 60\n\nThe\
    \ upload feature currently built into HTML5 basically blows. It's single-file,\
    \ has no upload progress feedback, cannot filter on size or type constraints,\
    \ and uses Base64 encoding, which means every file is blown up. Unless we use\
    \ stuff like WebSockets or SWFUpload, we are stuck with all these limitations.\n\
    \nHowever, we can improve the user experience a bit by letting users pick files\
    \ in a nice way. When I say \"nice\" here, I mean \"without visible file controls.\"\
    \ I like how 3signals presents lists of files-to-uploaded: a flat, icon-decorated\
    \ list of filenames with the option to remove them from the upload queue.\n\n\
    The trick is to clone the file field every time its value is set, move the original\
    \ file field—hidden—in the \"queue,\" and reset the clone's value so the field\
    \ appears again. The facing code uses a `<ul>` for the queue, synthesizing a `<li>`\
    \ to hold the file field, filename, and removal icon every time a file is selected.\
    \ Input (multiple files at once, size/type enforcement, and so on), but that just\
    \ isn't possible with the current `<input type=\"file\">`; look up SWFUpload for\
    \ such nifty features.\n\nThe final bit of script shown here uses class names\
    \ from file extensions using a little mapping and handles queue item removal when\
    \ links in the queue are clicked.\n\n# Create the initial markup for your form.\n\
    \n```html\nform/uploads/index.html\n<form method=\"post\" action=\"server.php\"\
    \ enctype=\"multipart/form-data\">\n  <ul id=\"uploads\"></ul>\n  <p><input type=\"\
    file\" name=\"files[]\" id=\"fileSelector\" /></p>\n  <p><input type=\"submit\"\
    \ value=\"Send these files\"/></p>\n</form>\n```\n\n# Queue up uploads.\n\n```javascript\n\
    form/uploads/uploads.js\nfunction queueFile() {\n  var fileName = $(this), clone\
    \ = this.cloneNode(true);\n  var item = new Element('li', { 'class': getFileClass(fileName)\
    \ });\n  $(clone).observe('change', queueFile).setValue('');\n  this.parentNode.appendChild(clone);\n\
    \  item.appendChild(this);\n  item.appendChild(document.createTextNodeNode(fileName));\n\
    \  item.insert('<button><img src=\"remove.png\" alt=\"Remove\"/></button>');\n\
    \  $('#uploads').appendChild(item);\n}\n\ndocument.observe('dom:loaded', function\
    \ () {\n  $('#fileSelector').observe('change', queueFile);\n  $('#uploads').observe('click',\
    \ handleQueueRemoval);\n});\n```\n\n# Add some flair: per-extension styling and\
    \ queue removal.\n\n```javascript\nform/uploads/uploads.js\nvar ICONS = { doc:\
    \ $w('doc docx'), image: $w('jpg jpeg gif png') };\n\nfunction getFileClass(fileName)\
    \ {\n  var ext = (fileName.match(/\\.(.+)?$/) || [])[1].toString().toLowerCase();\n\
    \  var icon = ICONS.detect(function (pair) { return pair[1].include(ext); });\n\
    \  return (icon || []);\n}\n\nfunction handleQueueRemoval(e) {\n  var trigger\
    \ = e.findElement('button');\n  trigger && trigger.up('li').remove();\n}\n```\n"
