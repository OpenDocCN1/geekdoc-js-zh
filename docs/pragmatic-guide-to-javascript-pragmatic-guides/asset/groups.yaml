    Popular frameworks resort to most or all of these tools to ensure your pages grab
    them in no time at all, so don''t start arguing about a few measly source code
    kilobytes, OK?


    # Prototype, script.aculo.us, and Scripty2


    Prototype is the first well-known JavaScript framework. Sam Stephenson created
    it at 3signals all the way back in February 2005 to provide a unified, easy-to-use
    API for DOM manipulation, event handling, and Ajax. Thomas Fuchs created script.aculo.us
    in 2005 as a companion API to Prototype, growing from the well-known Yellow Fade
    Technique to a full-blown size for visual effects, drag-and-drop, and a few bare-bones
    UI widgets. Scripty2 is a complete rewrite and expansion of script.aculo.us, currently
    in beta, that''s very much geared towards visual effects.


    The team behind Prototype fluctuates around a kernel of half a dozen volunteers,
    most prominently Sam Langel, and Andrew Dupont. Available under an MIT license
    (basically, it''s open source and usable anywhere), the complete source is available
    on GitHub for browsing, forking, and tweaking, and there''s a feedback mailing
    list plus a bug report system.


    An ecosystem has evolved around Prototype, including PDoc (a code documentation
    system), Evidence (a unit testing framework), Sprockets (an advanced JavaScript
    processing and concatenation tool), and 역할을 (a plug-ins repository). The community
    is alive and kicking, mostly on Google Groups. A number of books exists; to date,
    the most current are Practical Prototype and script.aculo.us [Dup08], by Andrew
    Dupont, and Prototype and script.aculo.us [Por07], by yours truly.


    Although Prototype is generally considered the first well-known JavaScript framework,
    in the past two years its popularity has slowly declining, apparently moving toward
    jQuery. It is, however, that these frameworks address distinct—although overlapping—sets
    of networks (and they certainly have very different code aesthetics).


    Prototype''s architecture, code aesthetics, and cohesive API design are very well
    suited to significant codebases with robust APIs, and "porting" of many Ruby''s
    goodies (such as the Enumerable module) make a lot of algorithm-heavy code easy
    to write. It''s a framework for people who want to embrace JavaScript and write
    awesome stuff with it, growing and maintaining an application''s codebase over
    time.


    - Avoid code obfuscation, though or whoever debugs on top of it will hate you.


    So, it''s probably not the best choice for people just trying to pull some feature
    off or cobble together a website using widgets and plug-ins without knowing much
    about the language.


    Here''s a quick recap of the current versions at the time of this writing and
    the URLs you''re likely to know:


    - Prototype is at http://prototypejs.org/; its current version is 1.7.

    - script.aculo.us is at http://script.aculo.us/ (duh!); its current version is
    1.8.3, and development is basically frozen, because focus shifted to Scripty2.

    - Scripty2 can be found at http://script2.com/. It is currently in Alpha release
    6.

    - PDoc is at http://pdoc.org/.

    - Sprockets is at http://getsprockets.org/.

    - Scripteka is at http://scripteka.com/


    - The support mailing list is found at http://groups.google.com/group/prototype-scriptactulous.
    You can also use the #prototype IRC channel on Freenode.


    - The feedback mailing list is found at http://groups.google.com/group/prototype-core.
    Do not ask for help there—use the support list!


    - The official repository is on GitHub: http://github.com/sstephenson/prototype.


    - If you have bugs to report, first read the guide at http://prototype.org/contribute,
    prepare your report with care, and then head over to https://prototype.lighthouseapp.com.


    # C.2 jQuery and jQuery UI


    jQuery originated in August 2005 when John Resig, having played with Prototype,
    decided that although he loved the features, the API, and the general feel of
    the code, it didn''t quite suit his taste. So, he waited and tried something different.
    John is a friendly JavaScript guru working at Mozilla, for his undertaking the
    development of a framework was you could say, in the natural order of things.
    After a version 1.0 release in June 2006, jQuery enjoyed a rapid uptake in the
    last two years, thanks to massive community-driving work. The jQuery project was
    formally founded in September 2009, and its version 1.4 was released in January
    2010 amid a two-week celebration and coding fest. (The current version at the
    time of this writing is 1.4.2.)


    # JavaScript FRAMEWORKS


    jQuery’s focus is mostly on lowering the perceived barrier-to-entry for people
    wanting to spruce up their web pages with a bit of JavaScript without prior knowledge
    of the language (or something of programming in general). Its API provides a lot
    of quick shortcuts targeted at the most common use cases, and a number of plug-ins
    (some of them grouped in the jQuery UI project) take care of the rest. Recently
    I''ve been hearing people describe jQuery as a DSL for DOM manipulation” or state
    that “jQuery comes from selectors to code, allowing people who know CSS to use
    JavaScript.” Although not entirely accurate (in a bit, reductionist), such characterizations
    capture the essence of jQuery.


    The driving force behind jQuery is its astounding team. Aside from almost two
    dozen people working on plug-ins projects, the core, the UI, and the website,
    its force lies with the half-dozen people who nurture the jQuery community through
    conferences, events, and meetings. Having a number of corporate sponsors doesn’t
    hurt, but the project itself remains open source, using a dual GPL/MIT license,
    hosted at GitHub, and allowing bug reports through most.


    Around the core project and the jQuery UI, you''ll find a number of magazines
    and conferences, meetup groups, and online forums. Several jQuery books have been
    published, including jQuery for Dummies [Bei10], jQuery in Action [BK10], jQuery:
    Novice to Ninja [CS10], and jQuery Cookbook [Lin09].


    As I mentioned, I believe jQuery and Prototype address somewhat different need
    sets. I cannot deny see how appealing it is to large categories of users, as those
    needing JavaScript as a mere tool to get common tasks done in a snap. The teeming
    life of the jQuery community (who don''t want to learn too much API) is also a
    big plus, because it inspires confidence in the project''s longevity. jQuery is,
    at the time of this writing, version 1.4.2. Here’s a list of the URLs you may
    need or want to check out:


    - The official website is http://jquery.com/

    - The official website for jQuery UI is http://jqueryui.com/

    - Source code is hosted at GitHub: http://github.com/jquery/

    - Bug tracking can be found at http://dev.jquery.com/

    - All official forums can be found at http://docs.jquery.com/Discussion. This
    goes to show how widely known the framework has become!


    # C.3 MooTools


    Created in 2006 by Valerio Proietti the project is split into MooTools Core (the
    framework) and MooTools More (the plug-in repository).


    Supported by a core team of thirteen, MooTools is an open source, MIT-licensed
    project currently in 1.2.4. It is hosted on GitHub, with bug tracking and feature
    requests on Lighthouse and support through a Google Group and a dedicated forum.


    The significant book on MooTools is MooTools Essentials [New08].


    It seems as if MooTools has, at least, so far, the lowest popularity/reach among
    the frameworks in this appendix. Still, does it have a non-negligible developer
    mind share. Here are a few pointers you may need:


