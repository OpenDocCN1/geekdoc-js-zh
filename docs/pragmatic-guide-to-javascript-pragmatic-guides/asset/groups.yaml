    ## B.4 IE6, IE7, the IE Toolbar, and Web Developer Express


    Internet Explorer has long been the bane of web developers, if only because of
    its sudden de scent halt once the “browser wars” were over and Netscape laid day
    on the field. Microsoft is putting some significant effort now into recent versions
    of Internet Explorer (IE8 and IE9 typically make great leaps forward), IE6 and
    IE7 are more than a decade behind the competition when it comes to web standards,
    including JavaScript.


    To add injury, there is not even a remotely decent JavaScript debugger built into
    these browsers. There''s a rather dumb error console, and if you''re scouting
    for debugging solutions applicable to either of these versions, you''ll find a
    few options.


    Leaving the antiquated Microsoft Script Debugger, the most common tool is the
    Visual Web Developer Express edition: This is the free, limited edition of Microsoft’s
    mammoth Visual Web Developer tool, which is really a customized version of its
    Visual Studio series, targeted at web developers. It''s been around for a while
    and has a good JavaScript debugger.


    So yes, unless already using such tools for development (say, you do .NET stuff),
    you would have to download a multigabyte file (the installer, at 2.6MB, is just
    a proxy tool) to debug JavaScript. But if you need to debug JavaScript in IE6
    or IE7, it is worth going through, if only to preserve your sanity.² When configuring,
    remember that Silverlight nor SQL Server are quite necessary for our purpose here.


    Once installed, launch Visual Web Developer Express edition (that’s quite a mouthful,
    let''s just say “VWDE” from now on, shall we?); once it completes setup, you''ll
    get a welcome page similar to Figure B.7, on the facing page.


    The Express edition, being free, tries to reduce our elbow room by not letting
    us attach to a running browser. The trick, then, is to use it to spawn an attached
    browser. This is a web browser spawned by VWDE in debug mode, so JavaScript Errors
    get intercepted by VWDE’s debugger.


    Once we have an attached browser, we can use it to surf wherever we please. Errors
    will drop right into the debugger, and we can also grab running documents inside
    VWDE and put breakpoints and such in them. To replicate the manipulations from
    the first section of this appendix, you’ll need the latter option.


    To spawn an attached IE6 or IE7 browser, we need to play a bit with VWDE’s requirements.


    > ² You can download it at http://www.microsoft.com/express/download/default.aspx.


    ![](img/36d099f98df3fc1ec6be478c5e81f7a6_128_0.png)


    There are essentially two rules we must abide by here:


    - We must have a VWDE project set up and with debugging enabled.

    - We must set IE7 as our default browser so that it is the one launched by the
    “Start debugging” feature.


    Both requirements only need be dealt with once (unless you’re testing this on
    the machine where you also surf on a regular basis and therefore need to switch
    your default browser back and forth between IE and whatever elected browser you
    have). Let’s address these:


    - Open IE6 or IE7, and click Tools > Internet Options....

    - Go to the Advanced tab, and scroll to the Browsing section.

    - Make sure “Display a notification about every script error” is checked and both
    “Disable script debugging...” are unchecked.

    - Close IE entirely.

    - Click File > New Web Site....


    ## DEBUGGING JAVASCRIPT


    ![](img/36d099f98df3fc1ec6be478c5e81f7a6_129_0.png)


