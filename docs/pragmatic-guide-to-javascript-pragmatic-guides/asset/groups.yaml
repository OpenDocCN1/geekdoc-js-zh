    \ classes for, example, \"data storage\". They will use a two-part name: first\
    \ a maxPrefix, then a positive_integer, stating the maximum length we want. See\
    \ the markup on the facing page.\n\nThen we can use JavaScript to do the following:\n\
    \n- Dynamically create the form zones (I'll assume paragraphs, for the sake of\
    \ brevity) containing these elements (the facing code adds a class to the paragraph),\
