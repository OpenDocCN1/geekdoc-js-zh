  - "[PAGE 83]\n\n# Autocompleting Input As It's Typed\n\nWhat's even better than\
    \ validating input before it's sent to the server? Validating input as the user\
    \ types! By matching users' ongoing input against a database of valid/useful inputs,\
    \ we can make suggestions that not only help them correct, say, spelling errors,\
    \ but also save them from manually typing long stuff that is common enough to\
    \ show up in our suggestions list.\n\nLocal search:\n\nAjax search: (capitals\
    \ of the world)\n\n| yan |\n Georgetown (Guyana) |\n Naypyidaw (Myanmar) |\n Pyongyang\
    \ (North Korea) |\n\nThis is traditionally referred to as autocompletion. The\
    \ only question is whether your reference datasource is prefetched on the client\
    \ side (as a simple Array or perhaps a more richly structured object, such as\
    \ a JSON literal) or is stored on the server, repeatedly queried as typing progresses.\n\
    \nHere's a good rule of thumb: if your datasource is small enough (such as a reference\
    \ list of states, currencies, or model names within a single brand), fetch inside\
    \ the script (for instance, generate the JavaScript literal for it when rendering\
    \ the page). Otherwise, go Ajax, and be sure to tune the query frequency so you\
    \ get good user experience even with slow connections or quick typists.\n\nScript.aculus\
    \ 1.8 has a good autocompletion control with a ton of customization options, which\
    \ we'll use here, along with its Prototype substrate. Depending on your datasource\
    \ location, you can use either Autocompleter.Local or Ajax.Autocompleter (I know,\
    \ the naming isn't very consistent; sorry about that). In the first case, you\
    \ just specify your datasource array and tweak match behavior with a handful of\
    \ options (fullSearch, partialSearch, partialChars, ignoreCase). In the Ajax case,\
    \ you provide the base URI and regular Ajax-related options, including extra parameters\
    \ to send."
  - "[PAGE 84]\n\n# Mark up a field for autocompletion.\n\n```\nform/autocompletion/index.html\n\
    <div class=\"p\" id=\"local\">\n  <label for=\"edtCachedSearch\">Local search:</label>\n\
    \  <input type=\"text\" id=\"edtCachedSearch\" name=\"search\" type=\"text\" />\n\
    \  <div class=\"completions\"></div>\n</div>\n```\n\n# Style for readability.\n\
    \n```\nform/autocompletion/autocompletion.css\n.completions {\n  border: 1px solid\
    \ silver; background: white; font-size: 80%; z-index: 2;\n}\n.completions ul {\
    \ margin: 0; padding: 0; list-style-type: none; }\n.completions li { line-height:\
    \ 1.5em; white-space: nowrap;\n  overflow: hidden; }\n.completions li.selected\
    \ { background: #ffa; }\n.completions strong { color: green; }\n```\n\n# Autocomplete\
