    <form method=\"post\" action=\"server.php\" enctype=\"multipart/form-data\">\n\
    \  <ul id=\"uploads\"></ul>\n  <p><input type=\"file\" name=\"files[]\" id=\"\
    fileSelector\" /></p>\n  <p><input type=\"submit\" value=\"Send these files\"\
    /></p>\n</form>\n```\n\n# Queue up uploads.\n\n```\nform/uploads/uploads.js\n\
    function queueFile() {\n  var fileName = $(this), clone = this.cloneNode(true);\n\
    \  var item = new Element('li', { 'class': getFileClass(fileName) });\n  $(clone).observe('change',\
    \ queueFile).setValue('');\n  this.parentNode.appendChild(clone);\n  item.appendChild(this);\n\
    \  item.appendChild(document.createTextNodeNode(fileName));\n  item.insert('<button><img\
    \ src=\"remove.png\" alt=\"Remove\"/></button>');\n  $('#uploads').appendChild(item);\n\
    }\n\ndocument.observe('dom:loaded', function () {\n  $('#fileSelector').observe('change',\
    \ queueFile);\n  $('#uploads').observe('click', handleQueueRemoval);\n});\n```\n\
    \n# Add some flair: per-extension styling and queue removal.\n\n```\nform/uploads/uploads.js\n\
    var ICONS = ${{ doc: $w('doc docx'), image: $w('jpg jpeg gif png') }};\n\nfunction\
    \ getFileClass(fileName) {\n  var ext = (fileName.match(/\\.(.+)?$/) || [])[1].toString().toLowerCase();\n\
    \  var icon = ICONS.detect(function (pair) { return pair[1].include(ext); });\n\
    \  return (icon || []);\n}\n\nfunction handleQueueRemoval(e) {\n  var trigger\
    \ = e.findElement('button');\n  trigger && trigger.up('li').remove();\n}\n```"
- md: "\n# Part V\n\n# Talking with the Server Side\n\n# TALKING WITH THE SERVER SIDE\n\
    \nThe previous part showed, among other things, how we could go about validating\
    \ as much input as we could on the client side. It also started dipping into server-provided\
    \ data for more involved validations, completions, and so on. Most web apps rely\
    \ on a back end to do their thing; how they “talk” with that back end is the topic\
    \ of this part.\n\n- We'll first talk about cookies, one of the earliest ways\
    \ of persisting state across requests, allowing us to create a session of navigation\
    \ for our users so we can remember what they've done, remember who they are, and\
    \ so on. This is covered in Task 27, Reading/Writing Cookies. Permanent cookies,\
    \ stored on the user's disk, let us “remember” them across visits, too, which\
    \ can have useful applications. Unfortunately, native cookie manipulation in JavaScript\
    \ is rather poor; we'll see how to deal with them more easily.\n- We'll then focus\
    \ on the Big Boy of Web 2.0 applications and services: First, we'll cover the\
    \ basics of how to talk with our server without reloading the page: this is in\
    \ Task 28, Loading Stuff Ajax (Same Domain).\n- Then we'll get a good look at\
    \ JSON in Task 29, Using JSON, and its cousin JSON-P in Task 30, Using JSON-P.\
    \ These are a great way of exchanging data between a JavaScript-driven client\
    \ and any server (so much easier to wield than XML).\n- Finally, as an opening\
    \ path toward mashups, we'll cover most of the (numerous) ways of talking with\
    \ third-party services located on domains other than ours. This is available in\
    \ Task 31, Cross-Domain “Ajax” (Take 1), and Task 32, Cross-Domain “Ajax” (Take\
    \ 2).\n\nDebugging Ajax or JSON-P calls can be pretty tricky. If you haven't read\
    \ through it, be sure to check Appendix B, on page 101. You'll get all the tools\
    \ you need there to comfortably pry into whatever client-server exchanges your\
    \ code is doing: there's just no point in needlessly wasting hours and pulling\
    \ your hair.\n\n# Reading/Writing Cookies\n\nDirectly tweaking cookies on the\
    \ client side is often useful. We can use them to spare our users the need to\
    \ redefine their settings at every page load by persisting stuff such as pagination\
    \ size, active tab (in a tabbed UI) across post-redirect, collapsed/expanded nodes\
    \ in a tree, and so on.\n\nRegardless of how we set up these cookies (in scope\
    \ or expiry), the only native interface to the cookie subsystem we get is \"DOM\
    \ Level 0\" document.cookie property. This property acts as a generator when read\
    \ and as a setter/deleter when written to. Unfortunately, it didn't go out of\
    \ its way to provide a neat interface for individual cookie settings. It feels\
    \ like we're reading and writing raw HTTP headers!\n\nSo, to spare us this tedious\
    \ task, most frameworks provide, either directly or through well-known plug-ins,\
    \ more comfortable access to cookies. Cookie management is a small enough matter,\
    \ though, that you should not have to depend on a framework for it. Even if you\
    \ use a framework already—which you should!—and it has cookie-related features,\
    \ you may not like its API for it.\n\nThat's why, on the facing page, I wrote\
    \ a stand-alone cookies JavaScript helper. It does not require any framework and\
    \ attempts to provide a handy API (especially when it comes to options). It's\
    \ well tested and documented; you may want to give it a shot!\n\nFinally, you\
    \ should keep in mind a few facts about cookies:\n\n- They reside on the client\
    \ side, so they're pretty much naked in the wild. You should never put sensitive\
    \ data in there, unless you're encrypting and tamper-proofing them in some robust\
    \ way.\n- They are severely limited in size (4KB) and should therefore not be\
    \ for storing large items of data (such as history, complex cart contents, text\
    \ drafts, and so on).\n- They might not be available, although this is a very\
    \ rare phenomenon. What's a bit more frequent, however, is for set-expiry cookies\
    \ not to persist across sessions, because of security policies in the browser\
    \ (either because of company security policies or because your user configured\
    \ their browser that way out of privacy concerns).\n\nSo, try to use cookies only\
    \ for extra comfort, especially persistent cookies.\n\n# Use frameworks or plug-ins.\n\
    \n```\n// jQuery Cookie plug-in (http://code.google.com/p/cookies/)\n$.cookies.set(key,\
    \ value[, options])\n$.cookies.get(key)\n$.cookies.filter(nameRegExp)\n$.cookies.del(key[,\
    \ options])\n$.cookies.test()\n// MooTools\nCookie.write(key, value[, options])\n\
    Cookie.read(key)\nCookie.dispose(key[, options])\n// YUI 2 Cookie Utility\nYAHOO.util.Cookie.set(name,\
    \ value[, options]);\nYAHOO.util.Cookie.get(name[, typeOrDecoderCallback]);\n\
    YAHOO.util.Cookie.remove(name[, options]);\n// YUI -> 3\nCookie.set(name, value[,\
    \ options])\nCookie.get(name[, typeOrDecoderCallback]);\nCookie.remove(name[,\
    \ options]);\n// Dojo\ndojo.cookie(name, value[, options])\ndojo.cookie(name)\n\
    dojo.cookie(name, null, { expires: -1 });\n// Ext\nExt.util.Cookies.set(name,\
    \ value[, expires][], path][], domain][], secure])\nExt.util.Cookies.get(name)\n\
    Ext.util.Cookies.clear(name)\n```\n\n# Use my stand-alone cookies.js helper.\n\
    \n```\n// Helper available at http://github.com/tdd/cookies-js-helper\nCookie.get(name)\n\
    Cookie.list([nameRegExp])\nCookie.set(name, value[, options])\nCookie.remove(name[,\
    \ options])\nCookie.test()\n```\n\n# Loading Stuff Through Ajax (Same Domain)\n\
    \nPerforming an Ajax request, especially on the same domain as the current page,\
    \ is such a fundamental building block of today's web applications that I have\
    \ to mention how to do it in all major frameworks. However, I could not possibly\
    \ hope to fit all the details in this one page or even in ten pages. Every framework\
    \ provides a host of options, settings, and tweaks around Ajax behavior that take\
    \ a lot of space to cover.\n\nSo, I'll just point you in the right direction with\
    \ the generic signatures of the facing page and provide some examples:\n\n- All\
    \ frameworks allow you to send Ajax requests using any of the HTTP verbs—GET,\
    \ POST, PUT, and DELETE—and tweaked headers, so you can interact with, say, REST\
    \ services.\n- All frameworks provide a number of callbacks—start, failure, completion—and\
    \ response formats such as JavaScript, JSON-P, XML.\n- Several frameworks allow\
    \ you to specify general defaults for Ajax (for instance, jQuery has $.ajax.Defaults())\
    \ and register global callbacks to maintain a single Ajax indicator.\n- A number\
    \ of frameworks provide shortcuts for “Ajaxifying” forms, either using HTML-mandated\
    \ serialization or letting you tweak it.\n- Each framework provides bits of specific\
    \ functionality, such as file uploads capability, HTTP authentication support,\
    \ reentrancy and control request chaining, response caching.\n- You should always\
    \ make sure to provide useful behavior for both success and failure of your Ajax\
    \ calls. The failure case is too often ignored or poorly handled.\n\nA piece of\
    \ advice: using Ajax requests in synchronous mode is roughly equivalent to summoning\
    \ a vicious demon in your web page. If you want synchronous, up to it and just\
    \ a regular page reload!\n\n# Make a simple Ajax request.\n\n```\n// Prototype\n\
    new Ajax.Request({url[, options]})\nnew Ajax.Updater(container, url[, options])\n\
    // jQuery\n$.ajax([settings])\n// MooTools\nnew Request([options])\n// YUI < 3\n\
    YUI.util.connect.asyncRequest(method, url, callback, postData)\n// YUI >= 3\n\
    Y.io({url, config})\n// Dojo\ndojo.xhrGet(settings) // or xhrPost, xhrPut, xhrDelete.\n\
    // ExtJS\nExt.Ajax.request(settings)\n```\n\n# Use more involved, Prototype-based\
    \ features, for a taste.\n\n```\n// Prototype\nAjax.Responders.register({\n  onCreate:\
    \ function() { $('spinner').show(); },\n  onComplete: function() {\n    if (0\
    \ == Ajax.activeRequestCount) {\n      $('spinner').hide();\n    }\n  });\n```\n\
    \n```javascript\nnew Ajax.Updater({ success: 'latestUsers', '/users/latest', {\n\
    \  method: 'get',\n  parameters: { mode: 'summary', threshold: 'auto' },\n  evalScripts:\
    \ true,\n  onError: function() {\n    logError('We could not fetch the latest\
    \ logged-in users, sorry.');\n  }\n});\n```\n"
