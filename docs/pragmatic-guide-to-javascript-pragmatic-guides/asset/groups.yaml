    # Cross-Domain “Ajax” (Take 1)


    Sending data to, or retrieving it from, third-party services is an increasingly
    common need. In this of mashups, we routinely need our web pages to communicate
    with service and content providers, ideally without taxing our own servers in
    the process.


    There are a number of approaches to loading stuff behind the scenes, across domains.
    I''m going to show you the more important ones and stick to reliable stuff; that
    should be plenty enough for your actual use cases.


    Let me describe the lay of the land real quite:


    +   - A so-called server-side proxy will work every time, for every URL. If that
    works for you, you might need a number of tweaks if you play with file uploads,
    content types, POST requests, and the like (always sanitize and check incoming
    requests, though you don''t want to unwittingly become a spam gateway).


    +   - The future lies with cross-origin resource sharing (CORS), the W3C spec
    for cross-domain requests, which XHR2 uses.²⁵ Currently, however, this works only
    on Firefox 3.5+, Safari 4+, and Chrome. IE8 implements the basics (GET only, no
    custom headers, no credentials, and so on) but requires you to use a custom object,
    XdomainRequest.


    +   - If both these approaches are unavailable, then your ticket is either JSON-P
    or dynamic/hidden forms and <iframe>.


    +   - There''s no magic bullet for POSTing complex contents to another domain
    without using a server-side proxy. There are half-solutions (see the next task)
    but no one-size-fits-all solution.


    On the facing page, the book''s code for this task illustrates a nice CORS approach
    (no extra code needed; use XMLHttpRequest), a server-side proxy approach, and
    two dynamic approaches based on form, and one of them, <iframe> (returns a 204
    response code, which lets us skip the hidden <iframe> because the browser won''t
    attempt to navigate).


    I should stress that you should only use both forms and <iframe> if you don''t
    want to rely on external services; otherwise, YQL (reviewed in the next task)
    is definitely your ticket.


    > 25. Check out https://developer.mozilla.org/en/HTTP_access_control for more
    details on CORS and XHR2.'
