    +   - Getting references to the elements we want to manipulate, covered in Task
    4, *Obtaining References to DOM Elements*


    +   - Changing their appearance, either instantly or in an animated fashion (most
    of the time it''s about showing, hiding, or moving them), as described in Task
    5, *Dynamically Styling Content*


    +   - Altering their contents, which is illustrated in Task 6, *Changing an Element''s
    Contents*


    All of this happens either during page initialization, in reaction to specific
    events, or sometimes after some time has passed. We will therefore discuss the
    following:


    +   - Page initialization in Task 7, *Running Code When the DOM Is Loaded*. More
    specifically, we''ll discuss how to detect when the DOM is loaded so we can start
