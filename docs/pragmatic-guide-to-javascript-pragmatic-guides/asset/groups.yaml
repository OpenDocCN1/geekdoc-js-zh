- md: "\n# Using JSON\n\nJSON has become the past few years the preferred way of exchanging\
    \ data between remote resources and JavaScript-based clients. The JSON format^24\
    \ is actually a subset of the literal notations allowed by standard JavaScript.\
    \ JSON has a few limitations but clearly boasts two significant advantages over\
    \ XML:\n\n- It's lightweight (less verbose)\n- It does not require any particular\
    \ client-side technology—besides JavaScript itself—to be interpreted and processed.\n\
    \nNowadays, most server-side technologies provide facilities to encode any eligible\
    \ data structure into a JSON string and decode such strings when they come in.\
    \ Depending on your technology of choice, you may need to install an extra library\
    \ (easily found through Google), rest assured you're covered with Ruby, PHP, Python,\
    \ Java, ColdFusion, and ASP.NET, to name a few.\n\nJSON lets you encode, integer-indexed\
    \ arrays and associative arrays (aka hashes, dictionaries, or maps). In the latter\
    \ case, keys can be anything (as long as they're quoted), and values can be strings\
    \ (barring some escaping), Booleans, null, or regular/associative arrays, nested\
    \ to any depth you need. Decoding it is easy, but producing a JSON string requires\
    \ some coding, so most JavaScript frameworks do that for you. More often than\
    \ not, they also provide JSON-specific behavior for Ajax requests, as an extra\
    \ convenience.\n\nNote that JSON is supposed to be reasonably secure, which is\
    \ why it doesn't serialize functions. A valid JSON string always boils down to\
    \ an inert object literal, when run/interpreted, cannot do any harm by itself.\
    \ However, if what you get is not a valid JSON string—and embeds a malicious call—you're\
    \ at risk. This is why most JSON-parsing features offer an option to clear/sanitize\
    \ the string before running it.\n\nThis book's code features an example page that\
    \ fetches a JSON system info object through Ajax and populates a table row with\
    \ it, using a couple neat tricks. You should check it out!\n\nOne of the main\
    \ ways to use JSON these days is a small trick called JSON-P, which results in\
    \ passing a JSON object to a callback function predefined in a script. You'll\
    \ learn more about that in the next task.\n\n24. As defined on http://www.json.org/\n\
    \n# Decode/encode JSON string barehanded.\n\n```javascript\n// Fast but only secure\
    \ as jsonString\nvar data = eval('(' + jsonString + '');');\n\n// Native JSON\
    \ support or json2.js; more secure\nvar data = JSON.parse(jsonString);\n\nJSON.stringify(obj);\
    \ // Native JSON support\n```\n\n# Decode/encode a JSON string with frameworks.\n\
    \n```javascript\n// Prototype has toJSON() instance methods plus these:\nObject.toJSON(obj)\n\
    someJSONString.evalJSON([{sanitize = false}])\n// jQuery\n$.parse(someJSONString)\n\
    // Mootools\nJSON.encode(someJSONString[, secure = false])\nJSON.encode(obj)\n\
    // YUI\nY.JSON.parse(someJSONString)\nY.JSON.stringify(obj)\n// Dojo\ndndjo.fromJson(someJSONString)\n\
    dojo.toJSON(obj[, prettyPrint = false])\n// Ext\nExt.util.JSON.decode(someJSONString)\n\
    Ext.util.JSON.encode(obj)\n```\n\n# Related Tasks\n\n- Task 30, Using JSON-P,\
    \ on the next page\n\n# 30 Using JSON-P\n\nJSON-P is the predominant way to get\
    \ remote, structured data into JavaScript-based client. The main transport for\
    \ it relies on dynamically generated <script> tags, and has an interesting side\
    \ effect: the transport is not restricted by the same-origin policy. A growing\
    \ number of web services and APIs (especially the RESTful ones) provide a JSON\
    \ output format and JSON-P support.\n\nThe simple idea behind it is: you get back\
    \ a JavaScript source that a regular JSON literal to a callback function you provided.\
    \ This means that the callback function was defined beforehand by your own code\
    \ and made globally available (which is not so great, but we can work around it).\n\
    \nNow, depending on your mind-set and how much you can trust the resources you\
    \ intend to use with JSON-P, this can be either a relief (this is a great way\
    \ of emulating cross-domain Ajax) or a concern (JSON-P essentially runs JavaScript\
    \ generated by a third-party in your page).\n\nIf you're targeting your own server\
    \ and resources, you're in the clear, and it's all rainbows and unicorns. But\
    \ if you're targeting third-party resources you do not entirely trust, there could\
    \ be trouble. Because of the mechanism involved (a <script> tag), you cannot prepare\
    \ the returned JavaScript to make sure it's a safe JSON-P callback invocation.\
    \ To get that intermediary step, you'd have to use actual Ajax to get the script,\
    \ which won't work on all browsers for a third-party resource, as we'll see in\
    \ the next task.\n\nAt any rate, measuring trustworthiness and reliability of\
    \ your remote JSON-P providers is up to you.\n\nI should point out that the transport\
    \ we're using—dynamic <script> tags restricts JSON-P to GET requests and, consecutively,\
    \ to payloads at about 4KB (a traditional GET limitation). Although there's no\
    \ magic cure for the latter, with some help from the server side, we can easily\
    \ turn a GET request into anything else, as we'll see in Task 32, Cross-Domain\
    \ \"Ajax\" (Take 2), on page 82.\n\n# Implement JSON-P with bare-bones code.\n\
    \nIn its simplest form, it just goes like this:\n\n```javascript\nserver/jsonp/jsonp.js\n\
    document.element.firstChild.appendChild(\nnew Element('script', { type: 'text/javascript',\n\
    \  src: this.href + '&r=' + Math.random() });});\n```\n\nThe previous code executes\
    \ in the context of a link click handler, so **this** is the <a> element being\
    \ activated.\n\nThe random parameter is there to circumvent browser caching; in\
    \ production code, you'd check the URI decide whether to prefix it with or ?.\n\
    \nA more advanced way is to use dynamic id= attributes for scripts and remove\
    \ them-post to avoid flooding the DOM. The dynamic id= can double as random parameter:\n\
    \n```javascript\nserver/jsonp/jsonp.js\nvar script = new Element('script', { type:\
    \ 'text/javascript',\nsrc: this.href});\nscript += ('&r=' + script.identify());\n\
    script.observe('load', Element.remove.curry(script));\ndocument.element.firstChild.appendChild(script);\n\
    ```\n\n# Use JSON-P facilities from frameworks.\n\nA few frameworks provide functions,\
    \ specific to JSON-P, that can always come in handy:\n\n```javascript\n// jQuery\n\
    $.getJSON(url, data[], callback)\n// Mootools\nnew Request.JSONP({ url: ..., onComplete:\
    \ function(data) })\n// Dojo\ndojo.io.script({ url: ..., jsonp: function(data)\
    \ }});\n```\n\n# Related Tasks\n\n- Task 29, Using JSON, on page 76\n- Task 32,\
    \ Cross-Domain \"Ajax\" (Take 2), on page 82\n\n# Cross-Domain “Ajax” (Take 1)\n\
    \nSending data to, or retrieving it from, third-party services is an increasingly\
    \ common need. In this of mashups, we routinely need our web pages to communicate\
    \ with service providers, ideally without taxing our servers.\n\nThere are a number\
    \ of approaches to loading stuff behind the scenes, across domains. I'm going\
    \ to show you the more important ones and stick to reliable stuff; that should\
    \ be plenty enough for your actual cases.\n\n- A so-called server-side proxy will\
    \ work every time, for every URL. If that works for you, you might need a number\
    \ of tweaks if you play with file uploads, content types, POST requests, and the\
    \ like (always sanitize requests).\n- The future lies with cross-origin resource\
    \ sharing (CORS), the W3C spec for cross-domain requests, which XHR2 uses.⁵ Currently,\
    \ however, this works only on Firefox 3.5+, Safari 4+, and Chrome. IE8 implements\
    \ the basics (GET only, no custom headers, no credentials, and so on) but requires\
    \ you to use a custom object, XdomainRequest.\n- If both these approaches are\
    \ unavailable, then your ticket is either JSON-P or dynamic/hidden forms and <iframe>.\n\
    - There's no magic bullet for POSTing complex contents to another domain without\
    \ using a server-side proxy. There are half-solutions (see the next task) but\
    \ no one-size-fitsall solution.\n\nOn the facing page, the book's code for this\
    \ task illustrates a nice CORS approach (no extra code needed; use XMLHttpRequest),\
    \ a server-side proxy approach, and two dynamic approaches based on form, and\
    \ one of them, <iframe> (returns a 204 response code, which lets us skip the hidden\
    \ <iframe> because the browser won't attempt to navigate).\n\nI should stress\
    \ that you should only use both forms and <iframe> if you don't want to rely on\
    \ external services; otherwise, YQL (reviewed in the next task) is definitely\
    \ your ticket.\n\n> . Check out https://developer.mozilla.org/en/HTTP_access_control\
    \ for more details on CORS and XHR2.\n"
  mdcn: "\n\n# 使用 JSON\n\n过去几年中，JSON 已成为远程资源与基于 JavaScript 的客户端之间交换数据的首选方式。JSON 格式^24\
    \ 实际上标准 JavaScript 允许的字面量表示法的子集。JSON 有一些局限性，但相比 XML 明显具有两个显著优势：\n\n- 它非常轻量（冗余较少）\n\
    - 它除了 JavaScript 本身之外不需要任何特定的客户端技术来解释和处理。\n\n如今，大多数服务器端技术都提供了相关功能，可以将任何合格的数据结构编码为\
    \ JSON 字符串，并在这些字符串进入时对其进行解码。根据你选择的技术，你可能需要安装一个额外的库（可以通过 Google 轻松找到），请放心，Ruby、PHP、Python、Java、ColdFusion\
    \ 和 ASP.NET 等语言都已涵盖其中。\n\nJSON 允许你编码整数索引数组和关联数组（又称为哈希表、字典或映射）。在后一种情况下，键可以是任何内容（只要加上引号），值可以是字符串（除某些转义外）、布尔值、null\
    \ 或正规/关联数组，并可以嵌套到你需要的任何深度。解码它很容易，但生成 JSON 字符串需要一些代码编写，因此大多数 JavaScript 框架都会为你完成工作。通常情况下，它们还为\
    \ Ajax 请求提供了 JSON 特有的行为，作为额外的便利。\n\n请注意，JSON 被认为是相当安全的，这就是为什么它不序列化函数。一个有效的 JSON\
    \ 字符串始终归结为一个惰性的对象字面量，在运行/解释时，本身不会造成任何伤害。然而，如果你得到的不是一个有效的 JSON 字符串——并且嵌入了恶意调用——你就会面临风险。这就是为什么大多数\
    \ JSON 解析功能都提供了一个选项，可以在运行代码之前清除/清理该字符串。\n\n本书的代码中包含一个示例页面，该页面通过 Ajax 获取一个 JSON\
    \ 系统信息对象，并使用一些巧妙的技巧将其填充到表格行中。你应该检查一下！\n\n现在使用 JSON 的主要方法之一是一种被称为 JSON-P 的小技巧，其结果是将一个\
    \ JSON 对象传递给脚本中预定义的回调函数。你将在下一个任务中学习更多相关内容。\n\n24. 定义在 http://www.json.org/。\n\n\
    # 手动解码/编码 JSON 字符串。\n\n```javascript\n// 快速但仅当 jsonString 安全时有效\nvar data = eval('('\
    \ + jsonString + '');\n\n// 原生 JSON 支持或使用 json2.js；更安全\nvar data = JSON.parse(jsonString);\n\
    \nJSON.stringify(obj); // 原生 JSON 支持\n```\n\n# 使用框架解码/编码 JSON 字符串。\n\n```javascript\n\
    // Prototype 有 toJSON() 实例方法以及这些：\nObject.toJSON(obj)\nsomeJSONString.evalJSON([{sanitize\
    \ = false}])\n// jQuery\n$.parse(someJSONString)\n// Mootools\nJSON.encode(someJSONString[,\
    \ secure = false])\nJSON.encode(obj)\n// YUI\nY.JSON.parse(someJSONString)\nY.JSON.stringify(obj)\n\
    // Dojo\ndndjo.fromJson(someJSONString)\ndojo.toJSON(obj[, prettyPrint = false])\n\
    // Ext\nExt.util.JSON.decode(someJSONString)\nExt.util.JSON.encode(obj)\n```\n\
    \n# 相关任务\n\n- 下一页的任务 30，使用 JSON-P\n\n# 30 使用 JSON-P\n\nJSON-P是将远程结构化数据获取基于 JavaScript\
    \ 的客户端的主要方法。它的主要传输依赖于动态生成的 <script> 标签，并且有一个有趣的副作用：传输不受同源策略的限制。越来越多的 Web 服务和 API（尤其是\
    \ RESTful 类的）提供了 JSON 输出格式和 JSON-P 支持。\n\n其背后的简单想法是：你得到一个 JavaScript 源代码，将普通的\
    \ JSON 字面量传递给你你提供的回调函数。这意味着该回调函数是由自己的代码预先定义的，并且是全局可用的（这并不那么理想，但我们可以绕过它）。\n\n现在，取决于你的心态以及你对打算用\
    \ JSON-P 使用的资源有多大的信任，这可能是一种解脱（这是一种模拟跨域 Ajax 的极佳方法），也可能是一种担忧（JSON-P 本质上是在你的页面中运行由第三方生成的\
    \ JavaScript）。\n\n如果你针对的是自己的服务器和资源，那么你就是安全的，一切都是顺风顺水的。但如果你针对的是你不完全信任的第三方资源，可能会出现问题。由于涉及的机制（一个\
    \ <script> 标签），你无法对返回的 JavaScript 进行准备处理以确保它是一个安全的 JSON-P 回调调用。要获得那个中间步骤，你必须使用真正的\
    \ Ajax 来获取脚本，但对于第三方资源，这在所有浏览器上都可能不可行，正如我们在下一个任务中看到的。\n\n无论如何，衡量你的远程 JSON-P 提供者的信任和可靠性取决于你。\n\
    \n我应该指出，我们使用的传输方式——动态 <script> 标签将 JSON-P 限制在 GET 请求上，并随后限制负载在约 4KB（这是一个传统的 GET\
    \ 限制）。虽然对后者没有神奇的药物，但在服务器端的帮助下，我们可以轻松地将 GET 请求转换为任何其他，正如我们将在第82 页的任务 32 跨域“Ajax”（第2次）中看到的。\n\
    \n# 使用基础代码实现 JSON-P。\n\n在最简单的形式下，它如下：\n\n```javascript\nserver/jsonp/jsonp.js\n\
    document.element.firstChild.appendChild(\nnew Element('script', { type: 'text/javascript',\n\
    \  src: this.href + '&r=' + Math.random()}));\n```\n\n这种方法可以有效。\n\n# 使用框架使用 JSON-P。\n\
    \n一些框架提供了函数，通过单单和 <iframe>，其中部分可以避免浏览器缓存。另一种更高级的方法是使用动态 属性：\n\n```javascript\n\
    server/jsonp/jsonp.js\nvar script = new Element('script', { type: 'text/javascript',\n\
    \  src: this.href + '&r=' + Math.random()});\nscript.observe('load', function()\
    \ {\n  document.element.firstChild.removeChild(script);\n});\n```\n\n# 相关任务\n\n\
    - 第76页的任务 29，使用 JSON\n- 第82页的跨域“Ajax”（第2次）\n\n# 跨域“Ajax”（第1次）\n\n向第三方服务发送数据或从其获取数据是日益增长的需求。在这些组合中，我们经常需要网页与服务提供者通信，理想情况下不消耗我们的服务器。\n\
    \n跨域加载内容有多种方法。我将向你展示更重要的，这对于你的实际情况足够了。\n\n- 所谓的服务器端代理对每个 URL 都有效。如果这对有效，在处理文件上传、内容类型、POST\
    \ 请求等时你可能需要一些调整。\n- 未来在于跨源资源共享（CORS），这是跨域请求的 W3C 标准，XHR2 使用它。⁵ 然而，这仅适用于 Firefox\
    \ 3.5+、Safari 4+ 和 Chrome。IE8 实现了基本功能（仅限 GET、无自定义头、无凭据等），但需要你使用自定义对象 XdomainRequest。\n\
    - 如果这两种方法都不可用，那么你的选择是 JSON-P 或者动态/隐藏表单和 <iframe>。\n- 在不使用服务器端代理的情况下，向另一个域 POSTComplex内容没有神奇妙药。有一些解决方案（参见下一个任务），但没有通用的解决方案。\n\
    \n在面对的页面上，本书的任务代码说明了一种良好的 CORS 方法（不需要额外代码；使用 XMLHttpRequest），一种服务器端代理方法以及两种基于动态的方法，其中一种\
    \ <iframe>（返回 204 响应码，这让我们跳过隐藏的 <iframe>，因为浏览器不会尝试导航）。\n\n我应该强调，只有在你不想依赖外部服务时才同时使用形式和\
    \ <iframe>；否则，YQL（在下一个任务中回顾）绝对是你的选择。\n\n"
