    \ now that it's ready for prime time!\n\nNow when typing occurs, we just need\
    \ to update the feedback, and if we hit or exceed the maximum length (something\
    \ impossible on a `<textarea>`), we'll backtrack to the maximum allowed length.\n\
    \nNote a couple of tricks in this:\n\n- We listen for both `keyup` and `keypress`\
