    Steve Peter（他的排版让书籍非常漂亮）合作，非常令人兴奋。


    最后但同样重要的是，我永远感激我爱的妻子 Élodie。在过去的五年里，她忍受了四本书的创作，并且一直给予支持和爱。我是地球上最幸运的男人，我无法想象有更好的配偶。这本书，再次送给她。


