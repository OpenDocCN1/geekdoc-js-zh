  - '[PAGE 93]


    # Loading Stuff Through Ajax (Same Domain)


    Performing an Ajax request, especially on the same domain as the current page,
    is such a fundamental building block of today''s web applications that I have
    to mention how to do it in all major frameworks. However, I could not possibly
    hope to fit all the details in this one page or even in ten pages. Every framework
    provides a host of options, settings, and tweaks around Ajax behavior that take
    a lot of space to cover.


    So, I''ll just point you in the right direction with the generic signatures of
    the facing page and provide a few avenues of further exploration:


    +   * All frameworks let you send Ajax requests using any of the four basic HTTP
    verbs—GET, POST, PUT, and DELETE—and tweaked HTTP headers, so you can interact
    smoothly with, say, REST services.


    +   * All frameworks provide a number of callbacks—so you can apply custom processing
    to the Ajax response or pitch in the request life cycle (start/failure, completion,
    and so on). Ajax response formats as JavaScript, JSON, JSON-P, XML, and HTML often
    enjoy built-in, automatic decoding (and sometimes automatic processing, especially
    for JavaScript and JSON-P).


    +   * Several frameworks let you specify general defaults for Ajax options (for
    instance, jQuery has $.ajax.Defaults()) and register global callbacks (commonly
    used to maintain a single Ajax indicator—such as the famous “spinner”)—across
    all Ajax requests in the page, for example).


    +   * A number of frameworks provide shortcuts for “Ajaxifying” forms, either
    using the HTML-mandated serialization for them or letting you tweak it. For instance,
    YUI 3 has a form option, and Prototype equips <form> elements with a request()
    shortcut.


    +   * Each framework provides a few bits of specific functionality, such as file
    uploads capability, HTTP basic authentication support, reentrancy and control
    request chaining, response caching, and more.


    +   * You should always make sure to provide useful behavior for both success
    and failure of your Ajax calls. The failure case is too often ignored or poorly
    handled.


    A piece of advice: using Ajax requests in synchronous mode is roughly equivalent
    to summoning a vicious demon in your web page. If you want synchronous, up to
    it and just for a regular page reload!'
