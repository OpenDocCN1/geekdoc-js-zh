    ![](img/36d099f98df3fc1ec6be478c5e81f7a6_0_0.png)


    # 读者对《JavaScript 实战指南》的评价


    我真希望在刚开始学习 JavaScript 时就能拥有这本书！《JavaScript 实战指南》将通过向你展示流行的 JavaScript 库背后的运行机制，并就如何做正确的事实提供务实的建议和背景信息，让你在编写真实的
    JavaScript 程序方面向前迈出一大步。它汇聚了顶尖 JavaScript 开发者多年来的浓缩经验，是日常 JavaScript 任务的极佳参考，必读。


    - Thomas Fuchs，scriptulo.js 框架创建者


    这是一本令人印象深刻的实用技巧合集，可以帮助你在今天的浏览器中充分发挥 JavaScript 的作用，涵盖了从表单验证和 JSON 处理等基础知识到 mashups
    和地理定位等应用示例。我强烈向任何想要在 Web 应用中提高 JavaScript 效率的人推荐这本书。


    - Dylan Schiemann，SitePen 首席执行官，Dojo Toolkit 联合创始人


    如今市场上有很多 JavaScript 书籍，但大多数都倾向于关注新手或缺乏经验的 JavaScript 程序员。Porteneuve 并没有这样做，而这本实战指南在这方面是更好的选择。如果你是新手，请先去别处学习，当你积累了一些脚本经验后再回来；如果你以前用过
    JavaScript，那么《JavaScript 实战指南》将取一系列你可能听过或见过的技术，并让它们变得变得用。推荐。


    - Stuart Langridge，kryogenix.org, @sil


