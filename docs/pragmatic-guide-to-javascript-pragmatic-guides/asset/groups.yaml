    \n处理此问题的通用方法是非常简洁且高效的，即正则表达式。现在，如果你在开发者职业生涯的这个阶段对正则表达式感到不熟悉，请帮自己一个大忙，花出几个小时深入研究它们。尽管它们对初学者来说可能晦涩难，但它们建立在少数语法规则之上（大约十几个，其中一半通常足够了），而且了解“正则”将反复为你节省无数的编码时间。你可以在网上找到很多很好的交互式教程。\n\
    \n在对面的页面上，代码的想法是在字段上创建匹配基于正则检查的 CSS 类。我只是在里面放了三个正则，但你可以通过简单向 `FIELD_PATTERNS`\
    \ 字典中添加新的键值对来扩展功能。不过让我先躲避纯粹主义者的咬牙声吧。是的，我展示的模式没有涵盖小数、指数浮点表示法，以及目前使用的 0.1% 的电子邮件地址。这没什么大不了。这个任务是关于字段验证的，而不是正则表达式魔法。根据你的需要随时调整模式！\n\
    \n这段代码非常短且直观；这里我只想说明两个我感兴趣的点。首先，`$F(element)` 函数只是 `element.getValue()` 的简写。\n\
    \n其次，如果你在 JavaScript 中用过正则表达式，很有可能你使用了通用的 `myString.match(myPattern)` 这种方法。这种方法可行，因为它在没有匹配项时返回\
    \ `null`，否则返回匹配项的数组（或匹配组）。然而，当你只需要知道是否找到了匹配项，而不在乎匹配的具体细节时，你应该反转问题，让模式去 `test()`\
    \ 字符串，它只返回一个布尔值。\n\n事实上，`test()` 方法更健壮：如果传入的是字符串以外的其他内容，它不会崩溃，而尝试在非字符串上调用 `call()`\
    \ 则会失败。作为额外的好处，`test()` 效率略高。我喜欢习惯性使用此类性能优化点，特别是当它们不影响代码可读性（或没有代码代价）时。\n\n# 标记需要特殊语法的字段。\n\
    \n```html\nform/validation102/index.html\n<p>\n  <label for=\"user_email\">邮箱*</label>\n\
    \  <input type=\"text\" name=\"user[email]\" id=\"user_email\" class=\"required\
    \ text\" />\n</p>\n<p>\n  <label for=\"user_favnumber\">喜欢的数字</label>\n  <input\
    \ type=\"text\" name=\"user[favnumber]\" id=\"user_favnumber\" class=\"text\"\
    \ />\n</p>\n```\n\n# 检查特殊语法字段。\n\n```javascript\nform/validation102/validation102.js\n\
    var FIELD_PATTERNS = {\n  integer: /\\d+$/,\n  number: /\\d+(?:\\.\\d+)?$/,\n\
    \  email: /^[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,6}$/i\n};\n\nfunction checkBox(field)\
    \ {\n  var value = $(field).toString().strip();\n  for (var pattern in FIELD_PATTERNS)\
    \ {\n    if (!field.hasClassName(pattern)) continue;\n    if (!FIELD_PATTERNS[pattern].test(value))\
    \ return false;\n  }\n  return true;\n}\n```\n\n# 相关任务\n\n- 任务 21，表单验证：基础，在第 56\
