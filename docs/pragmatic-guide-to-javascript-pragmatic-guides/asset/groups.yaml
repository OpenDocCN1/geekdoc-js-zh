    \ });\n  );\n}\n```\n\n- Check out part of a JSON-encoded tweet.\n\n(Actual returned\
    \ datasets are far more detailed, and URLs are obviously not truncated—this is\
    \ just to give you an idea.)\n\n```json\n{\n  \"in_reply_to_screen_name\": null,\n\
    \  \"user\": {\n    \"friends_count\": 27, \"statuses_count\": 622,\n    \"name\"\
    : \"ChristophePorteneuve\",\n    \"followers_count\": 215,\n    \"profile_image_url\"\
    : \"http://a3.twimg.com/.../headshot_tdd_normal.jpg\",\n  },\n  \"id\": 953162839,\
    \ \"created_at\": \"Tue Feb 23 18:35:22 +0000 2010\",\n  \"in_reply_to_status_id\"\
    : null,\n  \"text\": \"15 pour 850m. Sympa av Saint-Ouen + av Clichy aux de...\"\
    \n}\n```\n\n# Syndicating Your Flickr Updates\n\nFlickr provides a fairly large.\n\
    \nYou can get most of the useful query features more easily through YQL. However,\
    \ in this particular instance, we can just hack through the JSON variant of the\
    \ Atom feeds Flickr provides for most pages, including user pages. The resulting\
    \ dataset contains all the information we need, including prebuilt image and profile\
    \ URLs, dimensions, and publication dates. Such a feed is limited to the latest\
    \ twenty picture updates, but this remains a great fit for “Flickr updates” syndication.\n\
    \nThe JSON fragment on the facing page illustrates the kind of resultset we get.\
    \ We are most interested in the photo thumbnail URL and date of publication here.\
    \ We could get the original dimensions and date of taking with a bit more work,\
    \ too. However, to keep things simple here, we'll stick to a single request and\
    \ not too much tweaking.\n\nThe image URL we get the medium-size version of our\
    \ photos, when we want smaller, square thumbnails. We just need to change the\
    \ image URL suffix from _m to _s to fix that.\n\nThe facing code also nicely illustrates\
    \ the Template class from Prototype, which lets us efficiently produce “formatted\
    \ strings” in a repeatable way.\n\nAgain, you can get more information in an unauthenticated\
    \ way using the YQL tables for Flickr (with one request for the original resultset\
    \ and then extra queries per photo for further details). And if you need to grab\
    \ more info yet, or actually update data, the API is there, too.\n\n# ▶ Fetch\
    \ someone's photos.\n\n```javascript\nmashups/flickr/flickr.js\nvar FLICKR_ENDPOINT='http://api.flickr.com/services/feeds/photos_public.json';\n\
    var FLICKR_USER_ID='97027332@N00'; // That's me!\nvar item = new Template({\n\
    \  '<li><a href=\"#{target}\"><img src=\"#{src}\" title=\"#{title}\"></a></li>'\n\
    });\n\nfunction jsonFlickrFeed(data) {\n  var stream = $('FlickrStream'), dateStr;\n\
    \  data.items.each(function(photo) {\n    d = photo.split(/\\D/);\n    dateStr\
    \ = d[1] + '/' + d[2] + '/' + d[0];\n    stream.insert(item.evaluate({\n     \
    \ src: media.a.replace(/\\s/g, '_'), target: photo.link,\n      title: 'Published\
    \ on ' + dateStr + ' GMT'\n    }));\n  });\n  $('indicator').removeClass('loading').update('Loaded!');\n\
    }\n\nfunction loadFlickrPhotostream() {\n  var uri = FLICKR_ENDPOINT + '?format=json&id='\
    \ + FLICKR_USER_ID;\n  document.documentElement.firstChild.appendChild(\n    new\
    \ Element('script', { type: 'text/javascript',\n      src: uri + '&r=' + Math.random()\
    \ });\n  );\n}\n```\n\n# ▶ Check out some of the JSON response.\n\n```json\njsonFlickrFeed({\n\
    \  // ...\n  \"items\": [\n    {\n      \"title\": \"P101071\",\n      \"link\"\
    : \"http://www.flickr.com/photos/97027332@N00/41059623/\",\n      \"media\": {\n\
    \        \"m\": \"http://farm.flickr.com/2638/41059623_ec0ca964_m.jpg\"\n    \
    \  },\n      \"date_taken\": \"2009-11-12T15:38:21\",\n      // ...\n      \"\
    published\": \"2009-11-15T18:54:22\",\n    },\n    // ...\n  ]\n```\n\n# Geocoding\
    \ a Location and Getting Photos\n\nGeolocation has become a very common need,\
    \ mostly thanks to the rise of the mobile Web, so we're going to illustrate two\
    \ main aspects of it:\n\n- First, turning a textual location (address, city or\
    \ country) into geocoding (which boils down to a latitude and longitude).\n- Second,\
    \ searching data based on these coordinates.\n\nA lot of APIs are available, including\
    \ prominent “geocoders” from Google!, GeoNames, and others. For our purposes,\
    \ I'll use a very simple, straightforward, and useful tool: Placemaker. This API\
    \ lets us analyze any text to extract one or more potential geocodes for it, and\
    \ we'll use to turn a location name (say, something typed into a form field) into\
    \ latitude and longitude.\n\nLike Yahoo! Developer APIs, Placemaker requires a\
    \ Yahoo AppID; the sample code has a working one, but you should get your own\
    \ to play with. Then you need to provide the JavaScript wrapper with it and call\
    \ its getPlaces() method with the text, a callback, and optionally the locale\
    \ (for instance, en-US or fr-FR) to help Placemaker analyze it correctly.\n\n\
    Notice a tiny trick in the code to “normalize” the resultset toward a guaranteed\
    \ array of places. Because a one-match case has a single property and a multiple-match\
    \ case returns an array named matches. On the Flickr side, we use the flickr.photos.search\
    \ method with its geo-related parameters lat and lon through a JSON-P call. If\
    \ you're interested in geocoded tracks that are on the client side and JavaScript-based—including\
    \ GeoIP and the W3C API—you can find a wealth of info, demo, and cool stuff on\
    \ the page maintained by evangelist Christian Heilmann.\n\n33. Often you'll also\
    \ want to use extra data such as accuracy and the bounding box.\n34. Get those\
    \ at https://developer.yahoo.com/wsregapp/\n35. http://isithack.com/hacks/geo/\n\
    \n# GEOCODING A LOCATION AND GETTING PHOTOS FOR IT\n\nFetch geolocations for any\
    \ text.\n\n(The following code actually assumes only the first geolocation is\
    \ relevant)\n\n```javascript\nmashups/geo/geo.js\n// Use your *API key for your\
    \ own code\nvar YAHOO_APPID = 'KWEZW_V34GVYNW0L0m6NTfwiMFR9ysko8gu6sBehuptUZop6jKF130v25hFTrrGeo';\n\
    \nfunction getGeolocation(text) {\n  Placemaker.config.appid = YAHOO_APPID;\n\
    \  $('#indicator').addClass('loading').update('Getting geolocation for ' + \n\
    \  text.escapeHTML() + '...').show();\n  Placemaker.getPlaces(text, function (places)\
    \ {\n    if (places.error) {\n      $('#indicator').removeClassName('loading');\n\
    \      update(places.error.escapeHTML());\n    } else {\n      var loc = places.matches\
    \ || [places.match]][0].place;\n      $('#indicator').update('Loading ' + loc.name\
    \ + \n      ' (' + loc.type + '...');\n      getGeoPhotos(loc.centroid.latitude,\
    \ loc.centroid.longitude);\n    }\n  }, 'en-US');\n}\n```\n\nFetch geo photos\
    \ from Flickr.\n\n```javascript\nmashups/geo.js\n// flickrCallback is very similar\
    \ to the Flickr syndication task's code.\n// Get full example code at http://prag.com/titles/pg_js/source_code\n\
    \nfunction getGeoPhotos(lat, lon) {\n  $('#indicator').addClass('loading').show();\n\
    \  var uri = FLICKR_ENDPOINT + '+' + Object.toQueryString({\n    method: 'flickr.photos.search',\
    \ api_key: FLICKR_API_KEY,\n    extras: 'date_taken,url_sq,description', lat:\
    \ lat, lon: lon,\n    per_page: 50, format: 'json', jsoncallback: 'flickrCallback'\n\
    \  });\n  document.documentElement.firstChild.appendChild(\n    new Element('script',\
    \ { type: 'text/javascript',\n    src: uri + '&r=' + Math.random() });\n  )\n\
    }\n```\n"
