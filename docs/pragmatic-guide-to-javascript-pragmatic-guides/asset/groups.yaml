    选项、局部变量、监视、调用堆栈检查、某种控制台（我希望微软能停止称它们为“立即窗口”……），以及我们可以禁用或删除的断点（尽管它们没有设置条件）。


    实际上，这些就是我们需要的全部！整个工具感觉非常灵敏，而且从没有让我的 IE8 卡死过。真的！


    ## B.6 Opera 和 Dragonfly


    Opera 在提供开发者工具方面采用了一种不寻的方法。它的 Dragonfly 工具是“既离线又在线的”，因为当你在 Opera 中打开它的面板时，它会通过互联网自动下载并更新。这意味着你在第一次使用它时需要在线，这应该不是什么问题。然而，根据我的个人经验，我发现它似乎需要在线才能正常工作。在离线状态下，即使我之前下载了它，它通常也会启动失败，因为它无法连接到
    Opera 的服务器（或类似原因）。


    它当前的版本（本文写作时为 alpha 3）明确表示它还很不稳定，我只能希望 Opera 的同事们在 UI 方面清醒过来，并从底层重新考虑他们那数以亿计的多级标签页方法。我认为所有其他工具使用类似
    Firebug 的布局是有原因的（它足够简单又足够强大），但 Opera 却一直在构建这种复杂、错综的 UI。不过，它在最近的版本中似乎变得好了一些。


    对于我们调试 JavaScript 的目的，我们只需要下一页图 B.10 所示的“脚本”标签中的内容。你会发现一些常用功能的工具栏按钮：运行/恢复、单步、单入、单出，以及何时自动触发调试模式（例如，进入函数、遇到错误）。下拉列表让你显示你想要调试的源文件（JavaScript
    或 HTML）；代码旁边的行隙可以让你处理


    ![](img/36d099f98df3fc1ec6be478c5e81f7a6_132_0.png)


