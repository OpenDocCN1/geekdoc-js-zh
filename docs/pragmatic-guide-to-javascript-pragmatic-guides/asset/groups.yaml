- md: "\n## Part III\n\n## UI Tricks\n\nManipulating the DOM is akin to our basic\
    \ tools. Ultimately, everything boils down to DOM tweaking. But most of our actual\
    \ needs are higher level than that, including creating useful interface (UI) effects,\
    \ behaviors, and widgets; handling forms in a useful manner; and much more still.\
    \ In this part, we will start with generally useful UI behaviors.\n\n- Task 12,\
    \ Pulling Off Classy Tooltips, will explore how to provide nice-looking, contextual\
    \ information \"bubbles\" in our pages.\n\n- Sometimes pop-up windows are OK;\
    \ and when they are, lack of JavaScript should not prevent access to the target\
    \ contents. See how to get the best of both worlds in Task 13, Making Unobtrusive\
    \ Pop-Ups.\n\n- Preloading images cannot always be done with CSS scripting (for\
    \ instance, with user-provided images); for such situations, Task 14, Preloading\
    \ Images, shows you how to resort to JavaScript.\n\n- Proper use of lightboxes\
    \ (pseudo-dialogs standing out by diminishing the remainder of the page) creates\
    \ a neat experience; Task 15, Creating a Lightbox Effect, shows a top-notch solution.\n\
    \n- Browsing large datasets is sometimes better done through smart scrolling,\
    \ as illustrated in Task 16, Implementing an \"Infinite Scroll\".\n\n- There are\
    \ times when you need to load new content above the position in the page that\
    \ triggers such loading; avoid destabilizing visual behavior, check Task 17, Maintaining\
    \ Viewport When Loading Content.\n\nFrom then on in this book, we will rely on\
    \ frameworks and libraries to ease our work; almost all of the time, I will go\
    \ with Prototype (the lightbox task will use a jQuery plug-in, though, because\
    \ it seemed the best tool for that particular job).\n\nStill, Prototype does not\
    \ necessarily appeal to every front-end developer over there, so check out the\
    \ GitHub repository for this book’s codebase.¹² I intend for people to create\
    \ forks of it adapted for whatever JavaScript framework they like best. This way,\
    \ you can get the code for these tasks in whatever framework you prefer. And if\
    \ it’s not there yet, why not go ahead and author it yourself?\n\n12. http://github.com/tdd/pragmatic-javascript\n\
    \n## Pulling Off Classy Tooltips\n\nNative tooltips (obtained through title=)\
    \ are unreliable at best. Text wrapping vs. stretching vs. truncation, line breaks,\
    \ and appearance delays are all browser or user-dependent. Plus, their content\
    \ is plain text—no styling and certainly no rich markup.\n\nTo reclaim control,\
    \ we need to implement our own tooltips, positioning elements that get shown or\
    \ hidden when the mouse enters specific areas of the page (or when the user tabs\
    \ through, for better accessibility).\n\nSince this book is JavaScript, I will\
    \ devote into the CSS parts. Also, I'll limit the design approach to simple stuff:\
    \ not overlaying the trigger element, moving alongside the mouse cursor, providing\
    \ in-tooltip mouse-based UI, and so on.\n\nSo, for purposes, the crux of the implementation\
    \ is this: use CSS to hide the tooltip by default, and add a :hover selector on\
    \ the container element (which doesn't have to be a link) to restore its visibility.\n\
    \nHowever, that implementation won't work with IE6, which only obeys :hover on\
    \ <a> elements. You must use a script to react to mouseover and mouseout manually.\
    \ Here, because of the way Prototype implements show() and hide(),, we can't prefer\
    \ tooltips through CSS rules—this explains the small IE6 hack I show in the sample\
    \ CSS on the facing page.\n\nFor advanced needs, odds are you'll find your fit\
    \ among the host of tooltip libraries out there, either directly in frameworks\
    \ or based on them. Personally, my favorite Prototype-based library is the kick-off\
    \ Prototip2.¹¹³\n\n> 13. http://www.nickstakenburg.com/projects/prototip2/\n\n\
    ### Tag the tooltip.\n\n```html\nui/tooltips/index.html\n<li tabindex=\"1\">\n\
    \  <span class=\"name\">Capacity: 1.5 TB</span>\n  <div class=\"tooltip\">\n \
    \   <p><strong>1.5 Terabyte = 1,536 Gigabytes</strong></p>\n    <p>Enough for\
    \ 50,000 songs, 1,000 DivX movies, 100,000\nhigh-definition photos, hundreds of\
    \ IDVD projects and\n plenty of backup space left.</p>\n  </div>\n</li>\n```\n\
    \n### Style the tooltip.\n\n```css\nui/tooltips/tooltips.css\n#files li { position:\
    \ relative; }\n#files li .tooltip {\n  position: absolute; top: 8px; left: 120px;\
    \ width: 24em;\n  z-index: 1; display: none;\n  /* IE6 doesn't know li:hover,\
    \ so we need to toggle via JS,\n     therefore in-rule display: none */\n  _display:\
    \ block;\n  border: 1px solid gray;\n  background: #fffddc3 url(bg_tooltip.png)\
    \ top left repeat-x;\n}\n#files li:hover .tooltip,\n#files li:focus .tooltip {\
    \ display: block; }\n```\n\n### Script for IE6 (which won't:hover on nonlinks).\n\
    \n```js\nui/tooltips/tooltips.js\nfunction toggle(reveal, e) {\n  var trigger\
    \ = e.currentTarget;\n  var tooltip = trigger && trigger.down('.tooltip');\n \
    \ if (!tooltip) return;\n  reveal ? tooltip.show() : tooltip.hide();\n}\n\ndocument.observe('dom:ready',\
    \ function () {\n  var isIE6 = Prototype.Browser.IE6;\n  if (!isIE6) return;\n\
    \  var files = $('files');\n  var tooltips = files && files.find('.tooltip');\n\
    \  if (!tooltips.length) return;\n  files.observe('mouseover', toggle.curry(true));\n\
    \  files.observe('mouseout', toggle.curry(false));\n});\n```\n\n## Making Unobtrusive\
    \ Pop-Ups\n\nWhether you’re using “actual” pop-ups (windows) or pseudo-ups (elements\
    \ on the current page, styled to look-like), the problem remains: how do you provide\
    \ access to this for users who can’t—open a window?\n\nThe gist of practice is\
    \ this: link to the target, and then use JavaScript to hook them up. If you’re\
    \ adding a pop-up or lightbox, use a good existing library and spare yourself\
    \ the living hell of cross-browser issues and positioning algorithms. Here are\
    \ a few pointers:\n\n- Scripty2’s UI part¹⁴\n- jQuery UI¹⁵\n- Dojo (based on Dojo)¹⁶\n\
    - YUI’s Overlay module⁷\n- Ext.Window⁸\n\nKeep in mind that small pop-up content\
    \ may qualify for a click-triggered rich tooltip instead of a full-on pop-up.\
    \ In such a situation, check out tooltip libraries.\n\n14. http://github.com/madrobby/scripty2\n\
    15. http://jqueryui.com/\n16. http://ojotoolkit.com/projects/dijit\n17. http://developer.yahoo.com/yui/3/overlay/\n\
    18. http://www.extjs.com/dev/docs/?class=Ext.Window\n\n### Tagups for progressive\
    \ enhancement.\n\n```html\nui/popups/index.html\n<p>The great thing about &lt;a\
    \ class=\"popup\" target=\"_blank\" href=\"http://prag.com/titles/pq_js&gt;Pocket\
    \ Guide to JavaScript&lt;/a&gt; is that it focuses on a bunch of specific, useful\
    \ tasks.</p>\n```\n\n### Script a plain window.open().\n\n```js\nui/popups/popup.js\n\
    var POPUP_FEATURES = 'status=yes, resizable=yes, scrollbars=yes, ' +\n  'width=800,height=500,left=100,top=100';\n\
    \nfunction hookPopupLink(e) {\n  var trigger = e.findElement('a.popup');\n  if\
    \ (!trigger) return;\n  e.stop(); trigger.blur();\n  var wdName = trigger.getAttribute('target')\
    \ ||\n    ('wnd' + trigger.identify());\n  window.open(trigger.href, wdName, POPUP_FEATURES).focus();\n\
    }\ndocument.observe('click', hookPopupLink);\n```\n"
