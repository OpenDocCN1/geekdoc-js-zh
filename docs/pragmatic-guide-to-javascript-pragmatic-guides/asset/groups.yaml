- md: "\n-   Part 6, the final part, pushes this idea further by talking with third-party\
    \ services, in the best mashup spirit. I chose three trendy topics here: playing\
    \ with Twitter, Flickr, and geo-related APIs.\n\n-   Appendix A is my take on\
    \ a JavaScript cheat sheet; I attempted to condense the reference of the language\
    \ and the important tips, leaving out a few language elements I felt superfluous.\
    \ I hope you find it useful.\n\n-   Appendix B is about debugging JavaScript;\
    \ you owe it to yourself to know everything inside it, if only to spare you countless\
    \ hours of hair-tearing, particularly when it comes to Internet Explorer.\n\n\
    -   Appendix C tries to provide a useful description of the major frameworks-I\
    \ chose to include in this book. I did my best to provide an accurate depiction\
    \ of all of them, presenting them in their best light and giving you a few tips\
    \ about how best to choose a framework, on a case-by-case basis.\n\n-   Appendix\
    \ D acts as a quick reference to the best helpful resources about JavaScript itself\
    \ and the main frameworks; it sums the relevant parts of Appendix C, plus a number\
    \ of extra resources, mostly language-related. I put it at the end of the book\
    \ so it's easier to locate.\n\n## How to Read This Book\n\nIn the Pragmatic Guide\
    \ series, each chapter consists of two facing pages—one with text and one with\
    \ code. If you're reading this book on paper, this flows naturally. But if you're\
    \ reading an electronic edition of this book, you may want to set your reader\
    \ to display two pages at once, in the side-by-side or “two-up” mode, provided\
    \ your display is large enough. This will give you the best results.\n\n## Part\
    \ I\n\n## Bread and Butter: Pure JavaScript\n\nIt's time to get started. This\
    \ part serves as a warm-up with a couple fundamental pieces of know-how about\
    \ bare-bones JavaScript. The code samples in the following tasks do not rely on\
    \ any framework or library.\n\n-   You'll learn how to access object properties\
    \ and methods dynamically (once your code decides what their name is) in Task\
    \ 1, Dynamically Selecting a Method/Property.\n-   In Task 2, Achieving Code Privacy\
    \ with the Module Pattern, you'll find out how to keep internals of your code\
    \ enclosed in a private scope to avoid “polluting” other code and keep your stuff\
    \ self-contained.\n-   Finally, you'll be able to create functions that can be\
    \ called with a wide variety of arguments, using Task 3, Using Optional, Variable,\
    \ and Named Arguments.\n\nRemember that you can get a full source code archive\
    \ for this book on its online page.⁷ You can also access them directly at the\
    \ demo site.⁸ Finally, don’t forget that a simple empty web page (later, with\
    \ whatever libraries or frameworks you need loaded in), with a JavaScript console\
    \ open, is all you need to test this stuff interactively.\n\n7. http://prag.com/titles/pg_js\n\
    8. http://demos.pocketjavascript.com\n\n## Dynamically Selecting Method/Property\n\
    \nOften you find yourself wanting to call one of two methods (functions associated\
    \ with an object) depending on the situation. Or instead of functions to call,\
    \ this could be about reading, or writing, to one of two possible properties (variables\
    \ associated with an object). The code for this would look something like what:\n\
    \n```javascript\nif (condition) {\n  myObj.method1(someArg);\n} else {\n  myObj.method2(someArg);\n\
    }\n```\n\nJavaScript offers a simple syntax for dynamically selecting methods\
    \ and properties, all relying on the square brackets ([]) operator. You see, JavaScript\
    \ has two interchangeable syntaxes for member access (that is a common dynamic\
    \ language trait):\n\n```javascript\nobj[expressionResultingInMemberName] ===\
    \ obj.memberName\n```\n\nIf you've plucked a value from an Array cell using its\
    \ integer index, you've already used the square brackets operator for dynamic\
    \ member selection! This is because Array objects have properties named after\
    \ their numerical indices (plus the length property). However, in this case, JavaScript\
    \ won't let you use the dot operator (.) for direct access, myArray.0 is invalid\
    \ syntax (too bad, that would have made a good nerd trick).\n\nHere's why using\
    \ the square brackets operator ([]) is more powerful than dot notation: you can\
    \ put anything in between the brackets to obtain the name of the member (property\
    \ or method) that you want to access. Common cases include literals, variables\
    \ holding the member, name composition expressions (mostly string concatenations),\
    \ and quick if/then the ternary operator (condition ? valueTrue : valueFalse).\
    \ It'll all be turned into a string first and then looked up the member you want\
    \ to use.\n\nIn JavaScript, functions are objects and can be referenced like any\
    \ other value. When an expression results in a function, you can call it by using\
    \ parentheses, possibly with arguments, just like you would on a function you're\
    \ calling straight by its name.\n\nNote that if the arguments you want to pass\
    \ to the method vary depending on which technique you select, using parentheses\
    \ may quickly become too cluttered for easy reading. In that case, for a regular\
    \ if/else structure is a wiser move.\n\nUse the square brackets ([]) operator.\n\
    \n```javascript\nobject['propertyName'] // => object.propertyName\nobject['methodName'](arg1)\
    \ // => object.methodName(arg1)\n```\n\nToggle behavior.\n\n```javascript\n//\
    \ Call() or hide(), depending on shouldBeVisible\nelement[shouldBeVisible ? 'show'\
    \ : 'hide']();\n```\n\nAvoid \"heavy\" animations on IE to favor immediate reflow\n\
    \n```javascript\n// (assumes we've got a properly set isIE)\nelement[isIE ? 'simpleEffect'\
    \ : 'complexEffect']();\n```\n\nCompose method names.\n\n```javascript\nelement[(enable\
    \ ? 'add' : 'remove') + 'ClassName']();\n```\n\nTry this example in any window.\n\
    \n```javascript\nvar love = { firstName: 'Élodie', lastName: 'Porteneuve' };\n\
    var useFirstName = true;\nalert(love[useFirstName ? 'firstName' : 'lastName']);\
    \ // \"Élodie\"\n```\n\n## Achieving Code Privacy with the Module Pattern\n\n\
    The more JavaScript there is in your codebase, the more global scope get “polluted”\
    \ with numerous functions and variables that would actually be kept private. With\
    \ this comes the risk of name collision, with one script overwriting another’s.\
    \ This leads to bugs.\n\nWe need to be able to create self-contained, opaque batches\
    \ of JavaScript code, which would expose only identifiers, if any, to the outside\
    \ world. Indeed, this is a major requirement for “programming in the large,” being\
    \ able to bring in frameworks and libraries without risking a clash. This is what\
    \ the module pattern is for.\n\nThe whole idea of the module pattern is to create\
    \ a scope for var-declared identifiers and functions, a scope that only functions\
    \ inside it can access. To make some of these definitions accessible to the outside\
    \ world, our enclosing function has two choices. it may return an object with\
    \ these selected values as properties (see the facing page); we need to assign\
    \ that returned object to a variable in the outside scope. Another way is to pass\
    \ the enclosing scope object that it writes properties (to make these global,\
    \ you'd simply pass window).\n\nIn JavaScript, identifiers are first used with\
    \ the var declaring keyword as local. (They belong to the current function defined.)\
    \ Identifiers first used without var are global. (They're grafted onto the current\
    \ default scope, which most of the time means the global window object.)\n\nIn\
    \ a few specific circumstances, the current default scope will not actually be\
    \ global, so there are ways to execute code in a context where non-var identifiers\
    \ will not leak into the global namespace—but that is a bit outside the scope\
    \ of this task.Technically, you do not have to name your “public properties” exactly\
    \ like your private identifiers. Indeed, you could define public methods on the\
    \ fly in the returned object literal using anonymous functions. But such practices\
    \ would result in code that is more obscure (or misleading) to read and—perhaps\
    \ more importantly—to debug. As a rule of thumb, whenever possible, try to define\
    \ your functions using named function expressions:\n\n```javascript\nfunction\
    \ myFunctionName(...) { ... }\n```\n"
