    如果你在过去的几年里对 JavaScript 即使有最微小的关注，你也听过这种说法：它是“下一个大语言”。它曾是半吊子实现和无用滚动消息的领地，现在它已成为一种世界级的、动态面向对象的语言，在客户端和服务器端都有极快的实现。


    一方面，JavaScript 的设计者正在通过 EcmaScript 5 (ES5) 规范赋予它新的、健康的动力。另一方面，强大的引擎（如 V8、JavaScriptCore、SpiderMonkey、Rhino
    和 Karakan）以及新兴技术（带有 CommonJS 和 Node）让它既在浏览器中非常有用，也可以作为服务器上独立且强大的架构。即使是即将推出的 Internet
    Explorer 9 也在提升其 JavaScript 水平，并承诺带来巨大的飞跃。


    JavaScript 不仅仅是一门强大的动态语言，它现在还拥有由专业级开发工具、基础设施、框架和工具包组成的丰富生态系统。它是多能、快速的，非常适合各种编程任务，特别是对于基于
    Web 的应用程序和服务而言。


    是时候深入学习了！


