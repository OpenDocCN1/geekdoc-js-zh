    \ regex) |\n| Object | { prop: value, ...value } |\n\n# ## Special values\n\n\
    | undefined | with no value assigned, or no argument passed |\n| null | not defined;\
    \ often the value of a \"no result\" DOM call, and for intentionally programming\
    \ \"no value\" to variables |\n| false, true |\n| NaN | Number that is not finite,\
    \ e.g., -Infinity |\n| Infinity | Result of a Number-Number operation, such as\
    \ a failed parse; use isFinite() for comparison |\n\n# ## Operators\n\n```\nArithmetic:\
    \ + - * / ++ --\nRemember; there's not intleft, just Numbers!\n%= modulo remainder.\
    \ Unary minus signs: -=\n++ and increment decrement. There's a clear reason to\
    \ use them as suffixes (x++), or prefixes (++x).\n```\n\n```\nComparisons: ==\
    \ != <= >= === =\n== equals values, using \"conversion protocols\". So * = \"\
    5\"\n0 false, null undefined.\n=== strict equality, value and type. Great for\
    \ defining literals\n!== means-not-equal (like VB/S? <).\n```\n\n# ## Boolean\
    \ logic: (&&) and (||) or\n\n```\nJust remember:\n&& has priority over || or\n\
    && short-circuiting (if a is false, then returns a)\n|| short-circuiting (if a\
    \ is true, then returns a)\n```\n\n# ## Regular expression\n\n```\nPriorities:\
    \ most C++ / Java / Ruby's...\n* / % = =\n+ - =\n^ is XOR, << >> >>> shift (with\
    \ sign zero/free -)\n```\n\n# ## Arrays\n\n```\nArray selector: array[index];\
    \ propName\n```\n\n# ## Objects\n\n```\nDynamic selector:\nobj['propname']; obj.propName\n\
    obj['methodName'](); obj.methodName()\ne.node(visible) ? 'show':'id'\n```\n\n\
    # ## Functions\n\n```\nfunction() {\n  // what's in here stays unless you explicitly\n\
    \  // bring it out by return or direct assignment.\n}\n```\n\n# ## Classes\n\n\
    (classes of matching constructor)\n\n# ## Variables\n\nLocal variables are declared\
    \ using var.\nnYou should strive to use/global variables.\nVariables can be assigned\
    \ on-the-fly; they're accessible\nwhere in their scope (mostly means the current\
    \ function)\n\n+   - \"\" (empty string), null and undefined are false\n\ndeemed\
    \ false. Everything else is true.\n\n# ## Scope\n\n# ## Variables and scope\n\n\
    Global: matches everywhere, not based on where defined\n\nFunction: (accessible\
    \ from here) (doesn't capture closure)\n\nLocal: (accessible only) (where defined)\n\
    \nIf you need to capture a group for later use, there's not a concern about which\n\
    details (groups, etc.), use regex.test() instead of\nthem to capture them.\n\n\
    Declaration: function name() { ... }\nExpression: function() { ... } (assigned\
    \ to a variable).\n\nDeclarations are 'hoisted' - meaning you can use any of them\n\
    where in the code (no 'prototypes' declarations needed).\n\nFunctions are objects\
    \ like literals, so they have methods of\nbinding their own: by reference (use\
    \ 'this' keyword). This\nmeans you can assign variables and pass them as argumentsn\n\
    \nArgument list doesn't specify types, and serve as 'hints' that\nassigns names\
    \ to the first few arguments passed. But JS\nallows you to pass as many arguments\
    \ as you want, and can\naccess through the built-in arrays object, which behaves\
    \ like\na Array (with length and default).\n\n```\n/[a-z]/ (matches lowercase)\n\
    /[A-Z]/ (matches uppercase)\n/[0-9]/ (matches any digit)\n\\w (matches any word\
    \ character)\n```\n\n```\n\\^ (start of string)\n\\$ (end of string)\n* (zero\
