  mdcn: "\n\n# 预加载图像\n\n当你的页面使用用户交互来改变显示的图像时（例如提供缩放、特写、正/反面视图等），你你不希望用户看到转瞬即的空白屏幕，因为图像突然需要一点时间来加载。你可能想要预加载这些图像。\n\
    \n从本质上，预加载图像只有三种方法：\n\n- *使用 JavaScript，使用具有适当 `src` 属性的动态创建 `Image` 对象：这样做¹可以让你检测预加载的图像是否确实已加载。*\n\
    - *使用 CSS 隐藏预加载的图像：这归结底就是使用隐藏的 `<img>` 标签来预加载图像。你可以隐藏 `<img>` 标签或一个公共容器（我更倾向于后者）。*\n\
    - *使用 CSS 贴图（sprites）：当你想要预加载如悬停效果或一系列相关图像（例如背景、边框和角）时，这绝对应该是你的首选方法。¹*\n\nCSS\
    \ 方法非常简单，但它提供的控制能力没有 JavaScript 方法那么大。对应页面上的标记和脚本假设，带有 `re=\"preloadZoom\"` 属性的图像标签有一个具有相同\
    \ URI（带有 `_closeup` 后缀）的特写版本已预加载，用于悬停特写。\n\n这通常是 JavaScript 优于 CSS 方法的情况。因为我们也应该在\
    \ JavaScript 中进行预加载。（如果没有可用 JavaScript，我们不会预加载以后无法显示的内容）。此外，在 JavaScript 中预加载可以避免标记/样式的膨胀。\n\
    \n通过 JavaScript，我们可以在确定图像已预加载时才切换到该图像，从而避免临时空白/不完整渲染的风险。非贴图的 CSS 方法存在切换到未加载图像的风险（尽管风险很低）。\n\
    \n关于快速加载图像的更多硬核技术，请查看 Steve Souders 2009 年 5 月的演讲：*让图像加载更快的 14 条规则。*²⁰\n\n> ¹⁹.\
    \ 查看具有开创性的 http://www.alistpart.com/articles/sprites 和较较的 http://css-tricks.com/css-sprites/。Steve\
    \ Souders 还维护着 SpriteMe 工具：http://spriteme.org/\n> ²⁰. http://stevesouders.com/docs/wordcamp-200905030\n\
    \n# 预加载标签。\n\n```html\nui/preloading/index.html\n```\n\n```html\n<ul id=\"products\"\
    >\n  <li><h2><a href=\"http://progrog.com/titles/cppssu\">\n    <img rel=\"preloadzoom\"\
    \ src=\"cppssu.jpg\" alt=\"\" />\n    <span>原型与脚本 (script.aculo.us)</span>\n \
    \ </a></h2></li>\n  <li><h2><a href=\"http://progrog.com/titles/vsscala\">\n \
    \   <img rel=\"preloadzoom\" src=\"vsscala.jpg\" alt=\"\" />\n    <span>编程 Scala</span>\n\
    \  </a></h2></li>\n</ul>\n```\n\n# 编写脚本实现预加载。\n\n```javascript\nui/preloading/preloading.js\n\
    ```\n\n```javascript\nfunction preloadImages() {\n  $('img[rel=\"preloadzoom\"\
    ]').each(function(img) {\n    var pimg = new Image();\n    pimg.src = img.src.replace(/(\\\
    .\\w+\\$)/, '_closeup$1');\n  });\n}\n\ndocument.observe('dom:loaded', preloadImages);\n\
    ```\n\n# 悬停到（理想情况下已预加载的）图像。\n\n```javascript\nui/preloading/preloading.js\n```\n\
    \n```javascript\nfunction togglePreloaded(e) {\n  var trigger = e.findElement('img[rel=\"\
    preloadZoom\"]');\n  if (trigger) return;\n  if (e.type == 'mouseover') {\n  \
    \  trigger.src = trigger.src.replace(/(\\.\\w+\\$)/, '_closeup$1');\n  } else\
    \ {\n    trigger.src = trigger.src.replace('_closeup', '');\n  }\n}\n\ndocument.observe('mouseover',\
    \ togglePreloaded);\nobserve('mouseout', togglePreloaded);\n```\n\n# 15 创建灯箱效果（Lightbox\
    \ Effect）\n\n灯箱效果是在显示某些内容的同时，通过一个阻止鼠标的遮层覆盖页面的其余部分。大多数情况下，灯箱 UI 位于页面的中心。灯箱通常包含图像，并从页面上的链接文本或链接缩略图启动。\n\
    \n![](img/36d099f98df3fc1ec6be478c5e81f7a6_59_0.png)\n\n在本书的示例中，我们使用 Janis Skarnelis\
    \ 编写的 FancyBox jQuery 插件将缩略图通过灯箱显示为更大的版本。它不侵入、相当轻量、即插即用且简单，并且开箱即用。尽管如此，如果你愿意，也可以查看书籍演示页底部的替代方案。\n\
    \nFancyBox 不限于图像内容——它可以调出任何内容，包括 `<iframe>` 内容。当链接的目标 URI 既不“看起来像图像文件”也不使用 `iframes`\
    \ 时，它默认采用即时 Ajax 加载。例如，大图像可以按需加载。\n\n与 UI 相关的库一样，FancyBox 需要至少加载一个脚本和一个 CSS 文件。它假设图像位于样式表文件夹中，避免了繁琐的\
    \ CSS 调整。FancyBox 对图像 URL 没有任何要求。\n\n要让链接变为灯箱效果，我们只需要获取它们并调用它们的 `fancybox()` 方法，如对应页面所示。它是可以的。\n\
