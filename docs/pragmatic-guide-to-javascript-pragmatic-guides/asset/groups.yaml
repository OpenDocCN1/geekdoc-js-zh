  - '[PAGE 106]


    The final part of this book covers concrete examples of making your own web page,
    located on your domain, talk with third-party services. There won''t be any custom
    server proxy or XML in here, just JSON-P and YQL, so this code is self-contained
    and works anywhere!


    However, you may find only the juicy bits in the code pages of this book. Sometimes
    may only a few finishing touches are required to wrap the demo. Be be sure to
    check these in the source code archive²⁸ or the live demo site²⁹ to see how it
    all fits together.


    +   - Syndicating your Twitter feed on a web page is a common feature nowadays,
    and doing it on the client side can help when you otherwise heavily cache the
    hosting page. Task 33, *Syndicating Your Twitter Updates*, has you covered.


    +   - Slapping your new Flickr photo uploads in a page block somewhere is equally
    common and is explained in Task 34, *Syndicating Your Flickr Updates.*


    +   - The third task, Task 35, *Geocoding a Location and Getting Photos For It*,
    explores an increasingly important aspect of the Web: geocoding (not to be confused
    with geolocation, which is also an important emerging trend but will only work
    on the latest, bleeding-edge browsers). Essentially, it''s about turning place
    names and addresses into actual geographic coordinates so you can pinpoint them
    on a map, put them in relation with other data (say, photos from Flickr or tweets!),
    and create all sorts of useful mashups multiple datasets together. The Web and
    its data are more hackable today than they ever were, and there is enormous potential
    in what we can do with this!'
  - '[PAGE 107]


    # Syndicating Your Twitter Updates


    Fetching your tweets is a piece of cake, as is using most of Twitter’s API. It’s
    just a simple JSON-P call, really!


    We won''t fetch retrieves, mentions, or whatnot here. This is because Twitter
    syndication happens in a business context, and where your Twitter account is used
    as an extra marketing channel and you''re not interested in showing retrieves
    tweets, replies, or mentions alongside your own messages. Moreover, the Twitter
    API does not provide a straightforward way to grab, say, retrieve retweets—you’d
    need two separate calls, one of them authenticated, which means that authentication
    to your own account would be available on the client side in your visitors'' browsers.
    And we don''t want that. (The other option is syndication on the server side,
    which falls outside the scope of this book.)


    In the code on the facing page, the actual fetching takes only a couple of lines,
    in the loadTwitterStream() gives you access to any username''s direct tweets through
    a URL,³⁰ and we''re interested in a JSON format.


    What you get back is an array of tweet objects with a wealth of properties, as
    created_at, geo, in_reply_to_status_id, source, and text.³³¹


    The twitterCallback() function on the facing page illustrates simple tweet formatting:
    linking a reply mention and URLs in general. In the online example code for this
    task, you’ll get an augmented version that also handles hash tags and mentions
    and shows author information (avatar, name, tweet count, and so on).


    Before you do too much with Twitter’s API, you should go through Twitter’s nice
    API documentation³² and also be careful about rate limits enforced on parts of
    the API to avoid overtaxing the system as your usage scales up.


