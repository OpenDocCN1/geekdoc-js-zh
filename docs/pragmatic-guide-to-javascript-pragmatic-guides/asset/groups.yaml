    \ {\n  return 'x';\n});\n```\n\n```javascript\nstr.substring(0, 3) // \"abc\"\n\
    str.split('') // [\"a\", \"b\", \"c\", \"d\", \"e\"]\nstr.slice(2) // \"cde\"\n\
    str.slice(2, 4) // \"cd\"\nstr.toLowerCase() // \"abcde\"\n```\n\n## A few global\
    \ variables\n\n```javascript\nvar x = Math.floor(Math.random() * 20); // Generate\
    \ random integer between 0 and 19\nvar element = document.createElement('div');\n\
    element.innerHTML = \"Hello World\";\ndocument.body.appendChild(element);\n```\n\
    \n> * without an exception, it halts at semicolon... * with an exception, no possible\
    \ conflict. This is the preferred calling method.\n\n## Identifiers and reserved\
    \ words\n\nIdentifiers must start with $ or underscore (letter, still valid),\
    \ from identifiers, like Array, and may continue with any character except reserved\
    \ words. There are less than 56 reserved words, most of which are not actual in\
    \ current versions of JavaScript.\n\n```\nabstract break case char const continue\
    \ delete do double else extends final for for in interface long native new package\
    \ public return short static switch synchronized this throws try typeof void while\n\
    ```\n\n# Debugging JavaScript\n\n## B.1 Here Be Dragons\n\nA few years back, the\
    \ art of debugging JavaScript code felt like handling unstable glycerin blindfolded\
    \ on a trampoline. Not only did we feel dramatically under-equipped, but the tools\
    \ we did have at our disposal were rather unwieldy and on the whole did not feel\
    \ very helpful (except, in all fairness, for the IE debugging tools inside Visual\
    \ Web Developer Express, which had been there for a while and were quite good).\n\
    \nAfter all, JavaScript debugging at the time seemed so borderline dangerous that,\
    \ in its time-honored Ghostbusters-based name tradition, Mozilla’s JavaScript\
    \ debugger was christened Venman, and his baseline was “Don’t cross the streams.”\
    \ Yes, things were—or at least felt—that hazardous.\n\nThen Joe Hewitt dropped\
    \ by and released to the world what he unassingly referred to as “a bunch of scripts\
    \ put together.” Firebug cast a great beacon of light on our forsaken field (that\
    \ is, front-end web development), and there was much rejoicing in the land.\n\n\
    And because the bar had so raised and the game so changed, good people from all\
    \ browser vendors rolled up their sleeves and started tackling these problems,\
    \ in their own ways, which is why we now have Safari’s Web Inspector, Opera’s\
    \ Dragonfly, and, yes, even a pretty decent JavaScript debugger in Internet Explorer\
    \ 8. Still, Firebug keeps plough ahead (at somewhat varying speed, admittedly)\
    \ and retains a special place in the hearts of web developers.\n\n## Setting Up\
    \ a Debug Bench\n\nThe walkthroughs in this appendix all use a test page with\
    \ a bit of JavaScript to step through, play with, and generally demo the script-debugging\
    \ facilities of each browser. You can find these two files—debugbench.html and\
    \ its debugbench.js dependency—in the online code archive for this book.\n"
