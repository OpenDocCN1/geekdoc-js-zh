    断点（右键点击它们来禁用/重新启用）；代码下方的命令行子标签（是的，就在下面……提供了类似于控制台的命令行；右侧标签提供了访问调用栈和局部变量的方法（在*检查*标签中）。


    简而言之，常规调试是可以的。但我承认，我通常的调试周期是这样的：首先，使用 Safari 或 Firefox。然后在“另一个”（无论是 Firefox 或
    Safari）以及 IE8、IE7 和 IE6（按此顺序）中进行验证和调整（如果需要）。最后，为了确保无无，在 Opera 和 Chrome 中运行快速检查。


    因此，我遵循我开发 XHTML/CSS 时使用的顺序。就像标记和样式一样，一旦你在 Safari、Firefox 和 IE 组中让 JavaScript 正常运行，它在
    Chrome 和 Opera 中通常也会运行得良好。所以，*在 Opera 中调试是一种很罕的需求。*


    最后说明一点，要清楚 Opera 中有一个“调试”菜单，它可以让你直接访问许多功能，这些功能让人联想起 Firefox 的 Web 开发者工具扩展或 Safari
    的开发菜单。你可以通过从 Opera 内部下载配置文件来启用它.¹


    ## 虚拟机是你的朋友


    如今，内存非常廉价。我们大多数 Web 开发者都在拥有 4GB 到 8GB 内存的机器上编写代码，更幸运的人还运行在 SSD 固硬盘上，这使得整体运行非常*敏捷*。随着这种现象的发展，虚拟机正成为任何严肃开发者工具箱中的重要位置。虚拟机软件很便宜，有时甚至是免费的，而且选项非常多：Parallels
    Desktop^7（适用于 macOS、Windows 和 Linux）、VMware Fusion^8（适用于 macOS）或 VMware Workstation^9（适用于
    Windows）、VirtualBox^10（适用于几乎任何主流操作系统），以及更多选择。


    这种虚拟机的商品化使我们能够设置虚拟机来复隆我们测试的所有浏览器窗口：IE6 到 IE9，各种版本的 Safari、Chrome、Firefox、Opera
    等。大多数浏览器都不会允许你在单个操作系统上运行它们的多个版本，或者即使允许了，你得到的行为也不会与该浏览器作为唯一安装版本时的行为 100% 相同（以防万：Windows
