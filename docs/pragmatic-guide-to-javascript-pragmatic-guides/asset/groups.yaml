    \n-   附录 B 关于 JavaScript 调试；你对自己的有义务了解其内部的一切，哪怕仅仅是为了省下无数小时抓耳挠腮的时间，特别是在涉及到 Internet\
    \ Explorer 时。\n\n-   附录 C 尝试对我选择在书中介绍的主要框架提供实用的描述。我尽力地对所有这些框架提供准确的描绘，将它们呈现出最好的一面，并根据具体情况为你提供一些关于如何选择框架的建议。\n\
