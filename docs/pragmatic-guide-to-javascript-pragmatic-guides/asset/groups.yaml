    # Maintaining Viewport When Loading Content


    At times, you may want to maintain the contents of the user''s viewport—all that''s
    visible inside the browser—even as the user clicks to load more content above
    it. For example, a user clicks to view previous comments, but you don''t want
    to push the user''s scroll position down as the comments load from above.


    In cases like this, you''ll find yourself facing a small obstacle. Intuitively,
    users expect that their position on the page will not move. But by loading content
    above, you''ll push the rest of the document, including the clicked zone, further
    down the viewport and quite possibly outside of it.


    The solution is to *preserve the scrolling position relative to the viewport*.
    To do that, we need to grab the viewport’s “scrolling offset”—the viewport position
    prior to loading content above of what it displays—and restore that offset once
    the content has been injected. Offsets are typically a messy business, full of
    cross-browser hairiness, but to libraries such as Prototype and their position-related
    features, this can actually be solved concisely.


    The facing code is adapted from Gist by Sam Stephenson. Before loading extra content,
    we grab the trigger link’s in-document position (its `cumulativeOffset()`) and
    subtract it from the viewport''s current scrolling, which tells us how far down
    the trigger appears *in the viewport*. Then, after the new content is injected,
    we determine what the viewport''s new offset should be, by using the converse
    substraction.


    Readers familiar with Prototype may wonder why I went with `Ajax.Request` here,
    I did so because this lets me grab the original scrolling position as late as
    possible, specifically *after the Ajax request completes*, avoiding a weird “scroll
    reset” effect if the user scrolls during the Ajax request.


    This makes for a fairly nice user experience, with very little code.'
