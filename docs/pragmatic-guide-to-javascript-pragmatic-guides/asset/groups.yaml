    # SAFARI 与网页检查器 (WEB INSPECTOR)


    ![](img/36d099f98df3fc1ec6be478c5e81f7a6_126_0.png)


    图 B.5：SAFARI 的网页检查器


    ![](img/36d099f98df3fc1ec6be478c5e81f7a6_126_1.png)


    图 B.6：在网页检查器中单步


    或者简单按下 `Esc` 键即可切换控制台的开启，无论你当前显示哪个部分。


    在 Safari 当前公共版本中，网页检查器与 Firefox 有几处不同；例如，你无法精确地移除一个断点，你只能禁用它。你同样无法为它设置条件。而且没有监视器（watches）。尽管如此，它已经是一个相当实用的工具（而且未来的版本只会变得更好）。你可以如图
    B.6 所示，看到递归栈中下方几层的单步执行效果，这显示了它的行为与 Firebug 有多么相似。


    ## B.4 IE6、IE7、IE 工具栏以及 Web Developer Express


    Internet Explorer 长期以来一直是 Web 开发者的噩梦，仅仅是因为在“浏览器大战”结束后、Netscape 退出市场后，它突然陷入了停滞。微软现在正对
    Internet Explorer 的最新版本投入巨大精力（IE8 和 IE9 通常在这些方面取得了跨越性的飞跃），但在 Web 标准（包括 JavaScript）方面，IE6
    和 IE7 比竞争对手落后了十多年。


    雪上加霜的是，这些浏览器内置的甚至没有一个稍微像得像样的 JavaScript 调试器。它们只有一个相当愚蠢的错误控制台，如果你在寻找适用于这两个任 own调试解决方案，你会发现几个选项。


    抛弃过时的微软脚本调试器（Microsoft Script Debugger）不谈，最常用的工具是 Visual Web Developer Express
    版：这是微软庞大的 Visual Web Developer 工具的免费限量版，它实际上是其 Visual Studio 系列针对 Web 开发者定制的轻量化版本。它已经存在了一段时间，并且拥有一个非常好的
    JavaScript 调试器。


    所以，是的，除非你已经在使用此类工具进行开发（例如，你在做 .NET 相关工作），否则你必须下载一个几兆字节的文件（安装程序仅为 2.6MB，只是一个代理工具）来调试
    JavaScript。但如果你需要在 IE6 或 IE7 中调试 JavaScript，它是值得去尝试的，仅仅是为了保持你的理智²。配置时，请记住，Silverlight
    或 SQL Server 对于我们这里的目的并不是完全必要的。


    安装完成后，启动 Visual Web Developer Express 版（这名字很长，我们以后就直接称它为“VWDE”好吗？）；一旦完成设置，你将在相反的页面看到一个与图
    B.7 类似的欢迎页。


    Express 版由于是免费的，它通过不让我们附加到正在运行的浏览器来限制我们的操作空间。因此，诀窍在于使用它来启动一个附加浏览器。这是一个由 VWDE 在调试模式下启动的网页浏览器，因此
    JavaScript 错误会被 VWDE 的调试器拦截。


    一旦我们有了附加的浏览器，就可以用它随心所欲地浏览。错误将直接掉入调试器，我们还可以从 VWDE 内部获取运行中的文档并在其中设置断点等。若要复制本附录第一节的操作，你需要后一种选项。


    要启动一个附加的 IE6 或 IE7 浏览器，我们需要对 VWDE 的要求进行一些调整。


    > ² 你可以在 http://www.microsoft.com/express/download/default.aspx 下载它。


    ![](img/36d099f98df3fc1ec6be478c5e81f7a6_128_0.png)


    在这里，我们本质上必须遵守两条规则：


    - 我们必须设置好一个 VWDE 项目并启用调试功能。

    - 我们必须将 IE7 设置为默认浏览器，这样它才是是由“启动调试”功能启动的。


    这两项要求只需要处理一次（除非你在经常日常上网的机器上进行此测试，因此需要在 IE 和你选定的其他浏览器之间来切换默认浏览器）。让我们来处理这些：


    - 打开 IE6 或 IE7，点击 工具（Tools） > Internet 选项（Internet Options）....

    - 转到高级（Advanced）选项卡，滚动到浏览（Browsing）部分。

    - 确保勾选了“对每个脚本错误显示通知”（Display a notification about every script error），并取消勾选两个“禁用脚本调试...”（Disable
    script debugging...）。

    - 完全关闭 IE。

    - 点击 文件（File） > 新建网站（New Web Site）....


    ## 调试 JavaScript


    ![](img/36d099f98df3fc1ec6be478c5e81f7a6_129_0.png)


    图 B.8：使用断点调试 IE7


    - 6. 选择“空网站”（Empty Web Site）选项，并浏览到你想要设置的任何虚拟目录。点击确定。

    - 7. 点击“启动调试”（Start debugging）菜单选项或图标（绿色箭头）。

    - 8. 第一次运行时，VWDE 检测到你的项目尚未设置好调试。它缺少一个特殊的 Web.config 文件。对话框提议为你创建该文件或在不进行调试的情况下继续——显然，勾选第一个选项并点击确定。

    - 9. 你应该会在任务栏中看到一个运行在动态端口的开发服务器，你的 IE 会打开一个以你项目目录命名的空目录列表。你应该看到任务栏中启动了一个运行在动态端口的开发服务器，你的
    IE 会打开一个以你项目目录命名的空目录列表。现在我们已经准备就绪，只需浏览 debugbench.html。一旦打开，进入 VWDE。在右侧的解决方案资源（Solution
    Explorer）中，你应该看到运行中的文档 debugbench.html 和 debugbench.js。双击后者。你在那里了！你现在可以在第 2 行设置断点，切换回
    IE，我们进入了熟悉的单步模式，如图 B.8 所示。*大搞定！*


    ## IE8 与开发者工具


    毫无疑问：Internet Explorer 8 是 IE 世界的一大步。除了在 Web 标准支持方面的显著改进（尽管仍远落后），这些点对我们非常重要：


    - IE8 中的 JavaScript 引擎比其他 JavaScript 引擎慢七倍。相对于 Chrome 的 V8 或 Safari、Firefox 的最新版本，峰值达到十二倍。


    为什么这是好消息？IE7 曾经慢了九十倍。IE6 无法忍受耻辱。因此，IE 团队将其 JavaScript 引擎改进了十三倍，无论你怎么如何，这都是令人赞叹的。


    - IE 中的 DOM 性能是我们脚本时的第二个主要痛点，它得到了大量的关注，现在仅慢四倍，这也是一个巨大的改进。


    - IE8 内置了“开发者工具”，它们是 IE6 和 IE7 中使用的 IE 工具栏的清理、更快速的版本，并附带了一个真正的 JavaScript 调试器。一个运行正常且不会导致
    IE 与外部应用程序之间频繁故障的调试器。


    所以，我们不仅可以开始在 IE 世界中开启花哨的效果和 Ajax 操作，还可以让调试变得容易得多！


    顺便说，IE8 还探索了减少脚本加载感知性能影响的方法。你仍然应该使用通用优化方案，如“在页面底部加载脚本”，更重要的是脚本合并（例如通过 Sprockets）和
    gzip 压缩。


    IE8 开发者工具面板打开了脚本选项卡并运行调试会话，如下一页的图 B.9 所示，带有我们现在熟悉的断点。切换调试器的开启和关闭只需点击工具栏上的大按钮，我们进入了熟悉的单步


    > 3. developer.yahoo.com/performance/rules.html#js_bottom

    4. https://sprockets.com

    5. 欲需更多关于网页加载和渲染性能的绝佳建议，请参阅 Thomas Fuchs 和 Amy Hoy 的优秀著作《JavaScript Performance
    Rocks! [HF09]，并查看 Yahoo! Developer Network 上的性能提示 http://developer.yahoo.com/performance/rules.html。


