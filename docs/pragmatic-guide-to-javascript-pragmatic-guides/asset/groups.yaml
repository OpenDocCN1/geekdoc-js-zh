    # Dedication


    Pour Élodie, ma femme, l''étoile de ma vie.


    To Élodie, my wife, always my shining star.


    # Acknowledgments


    Writing a book is never easy. A technical book doesn''t need a plot and spares
    the author anguish of the blank page, but it subjects the author to a world of
    pressure from peers and the duties to be technically accurate and to convey best
    practices. This is why writing a book remains a significant endeavor and why authors
    can use all the help they can get.


    In this book, I am first and foremost indebted to the amazing creators of the
    frameworks I mention and use. Not only did they grace the world with their praiseworthy
    work, but many also took the time to review this book and make sure I didn''t
    unintentionally disgrace their brainchildren. I owe heartfelt thanks to Sam Stephenson,
    Thomas Fuchs, John Resig, Alex Russell, Jack Slocum, and a large number of core
    developers and contributors who I couldn''t possibly have enough space to name
    here. I am even more indebted to the members of the Prototype Core team. They''ve
    been a helpful, highly skilled bunch with whom I''ve learned so much, especially
    Andrew Dupont, Tobie Lang, and Jurij Zaytsev.


    In the search for technical accuracy and overall book betterment, a number of
    people, some of whom I mentioned already, gracefully agreed to review this book
    and reduce the chances of my making a fool of myself. And I was indeed graced
    with an outstanding list of reviewers! I bow with respect and gratitude to Dion
    Almaer, Arnaud Berthomier, Aaron Gustafson, Christian Heilmann, Dylan Schiemann,
    and Sam Stephenson.


    This is my second book with the Pragmatic Programmers. Once again, Dave Thomas
    and Andy opened their virtual doors to me and let me work with their wonderful
    staff on this new series of books, the Pragmatic Guides. It''s a thrill to work
    with the series editor, Susanna Davidson Pfalzer; my editor, David McClintock
    (making his Prag debut); the keen-eyed Kim Wimpsett for copyediting; the wizardly
    Sara Lynn Eastler for producing a Pragmatic-quality index; and the skillful Steve
    Peter, whose typesetting makes the book look good.


    Last but by no means least, I am forever grateful to Élodie, my beloved wife.
    She''s put up with four books over the past five years, and she''s always been
    supportive and loving. I am the luckiest guy on Earth, and I could not dream of
    a better spouse. This book, once again, is for her.


    # Introduction


    If you''ve been paying even minimal attention to JavaScript these past few years,
    you''ve heard this before: it''s the Next Big Language. Once the province of half-baked
    implementations and useless scrolling messages, it has become a world-class, dynamic,
    object-oriented language with super-fast implementations on the client and server
    sides.


    On the one hand, JavaScript''s designers are endowing it with a new healthy dose
    of power, through the EcmaScript 5 (ES5) specification. On the other hand, kick-ass
    engines (such as V8, JavaScriptCore, SpiderMonkey, Rhino, and Karakan) and emergent
    technologies (with CommonJS and Node) make it both useful in browsers and as stand-alone,
    powerful architectures on the server. Even the upcoming Internet Explorer 9 is
    upping its JavaScript game with the promise of huge boosts.


    Not only is JavaScript a powerful, dynamic language, but it now has a rich ecosystem
    of professional-grade development tools, infrastructures, frameworks, and tool
    kits. It is versatile, fast, and very well suited to a wide range of programming
    tasks, especially when it comes to web-based applications and services.


    It''s time to dive in!


    # What''s This Book About, and Who Is It For?


    This book is not really intended to teach you “JavaScript language.” For one thing,
    the language itself is not very complicated, so if you have prior experience in
    programming any reasonably common language—even it''s just the basics (variables,
    loops, and so on)—you''ll get your bearings easily enough. You don''t need to
    actually know JavaScript already (although it could help), and you certainly don''t
    need to be any sort of programming guru.


    Actually, if you''re looking for the kitty-gritty and the hardcore technical details
    of JavaScript, you''ll be better off reading a dedicated resource, such as


    - 1. http://commonjs.org/

    - 2. http://nodejs.org/


    the “JavaScript skills” section of Opera’s excellent Web Standards Curriculum.
    Should you ever even need more intricate, implementation-level details, you could
    head to either the official specs of the language or one of the massive “bible”
    books such as David Flanagan’s JavaScript: The Definitive Guide [Fla06].


    This book aims to provide you with quick qualitative solutions to client-side
    JavaScript-based tasks, from low-level stuff (such as getting a ref- to a DOM
    element) to intricate features (such as Ajax-based autocompletion). Next we’ll
    tackle JavaScript, CSS, the DOM, Ajax, Ajax, JSON, and more. We won’t go deep
    into the server side; this book is mostly on the client side of things (most often
    the browser). You’ll encounter a couple of tiny PHP scripts along the way, for
    illustration purposes, but you could write your server side any way you like—including
    in JavaScript, for instance, with Node!


    It’s not just for copying and pasting, either. For each task you take care to
    highlight the key concepts, the potential gotchas, and the technical tricks you
    should take away from the task. Ultimately, you should step away from this book
    as a better JavaScript programmer.


    # This Book and JavaScript Libraries


    Let’s speak plainly here. If you’re doing any of nontrivial JavaScript programming
    and you’re not relying heavily on, established frameworks for it, You’re Doing
    It Wrong. On the browser side, effectively pulling off web page scripting is a
    challenge. You face obstacles from all sides: DOM inconsistencies, faulty language
    implementations, CSS quirks, weird Ajax bugs, and more. On the server side, once
    you have a runtime ready, you still feel the enormous task of putting together
    the basic bricks of an application server such as a datastore, a network stack,
    a module system, and so on.


    Fortunately, great people already solved these challenges for you. There’s a wealth
    of options, too, especially on the client side; take a look at Appendix C, on
    page 115, for details on the main JavaScript frameworks.


    Because any competent and pragmatic JavaScript developer will rely on one or more
    good frameworks, this book takes care to illustrate all the major client-side
    frameworks in what I think of as “basic” tasks. I selected Prototype, jQuery,
    MooTools, YUI, Dojo, and ExtJS, which should cover most of the “developer mind”
    in this business.


    - 3. http://www.opera.com/education/curriculum/


    # THIS BOOK AT GLANCE


    For "nonbasic" tasks, I went mostly with my favorite, Prototype except for one
    task (the lightbox one), where the solution I deem up being a jQuery plug-in.
    But really, you master the basic tasks, and you can rewrite or adapt your solutions
    using your framework of choice. And indeed to facilitate this, we''re putting
    the entire codebase for this book in a public GitHub repository. This way, creating
    another framework (say, jQuery) is as easy as clicking GitHub''s Fork button,
    and finding such versions of the codebase becomes a snap.


    Also note that all the code for this book, besides in a neatly packaged code archive
    on the book''s website, is available live for your testing and tweaking pleasure
    at http://demos.javascript.com/.


    - Part 1 covers a few JavaScript code patterns that are too ignored by JavaScript
    developers. They''re just about the language, so they''re framework-agnostic but
    indispensable for good coding on a daily basis. Be sure to start here!

    - Part 2 is mostly about what I refer as "basic" tasks, focusing on fundamental
    DOM and CSS manipulations, plus event handling and timers. Because of their "basic"
    status, I take care to list the relevant code for all frameworks, so you can pick
    whatever suits you best. You should also check out Appendix C, on page 115, when
    reading this part so you get a good picture of the framework landscape and make
    informed decisions.

    - Part 3 is all about the user interface, especially visual effects and neat UI
    ideas: good-looking tooltips, lightboxes, image preloading, infinite scrolling,
    and the like.

    - Part 4 is complementary to Part 3, because it focuses on forms, a critical part
    of most web applications. Among other things, a number of tools are there to assist,
    simplify, and validate input.

    - Part 5 is all about the client-server relationship, with topics such as cookies,
    JSON, and Ajax (same- and cross-domain).


    4. Full disclosure: I''m a member of Prototype Core.

    5. http://github.com/tdd/pragmatic-javascript

    6. http://pragprog.com/titles/pg_js

