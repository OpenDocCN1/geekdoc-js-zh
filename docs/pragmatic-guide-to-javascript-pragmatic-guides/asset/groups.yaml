    ```\n\n# 调试 JavaScript\n\n## B.1 危险\n\n几年前，调试 JavaScript 的艺术感觉就像在蹦床上闭着眼睛处理不稳定的甘油。我们不仅感到装备极度匮乏，而且我们拥有的工具也相当笨拙（公平地说，Visual\
