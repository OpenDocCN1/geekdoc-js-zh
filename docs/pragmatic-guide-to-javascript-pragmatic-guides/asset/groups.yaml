    # DEBUGGING JAVASCRIPT


    ![](img/36d099f98df3fc1ec6be478c5e81f7a6_131_0.png)


    Figure B.9: IE8 DEVELOPER TOOLS: SCRIPT TAB


    options, local variables, watches, callstack inspection, a sort of console (I
    wish Microsoft would stop calling those “immediate window”...), and breakpoints
    we can disable or remove (no conditions on them, though).


    That’s all we need, really! The whole thing feels responsive and never froze my
    IE8. Honest!


    ## B.6 Opera and Dragonfly


    Opera takes an uncommon approach to providing developer tools. Its Dragonfly tool
    is “both offline and online,” because it is automatically downloaded and updated
    through the Internet when you open its pane in Opera. This means you need to be
    online the first time you use it, which should hardly be an issue. However, in
    my personal experience, I found it to kind of require being online to simply work.
    When offline, even if I had downloaded it before, it usually aborted launch because
    it was not able to connect to Opera’s server (or something).


    Its current version (alpha 3 at the time of this writing) clearly states it’s
    still rough, and I can only hope the Opera folks will come to their senses, UI-wise,
    and rethink their gazillions-of-multilevel-tabs approach from the ground up. I
    would think all the other tools use a Firebug-like layout for a reason (it’s simple
    enough yet powerful enough), but Opera goes on and builds this complex, intricate
    UI. It seems to have been getting better in recent versions, though.


    For our purpose of debugging JavaScript, we just need what’s in the Scripts tab,
    as displayed in Figure B.10, on the next page. You’ll find toolbar buttons for
    the usual stuff: run/resume, step over, step into, step out, and when to automatically
    trigger debug mode (for example, entering a function, encountering an error).
    A drop-down list lets you display the source file (JavaScript or HTML) you want
    to debug through; the gutter next to the code lets you deal


    ![](img/36d099f98df3fc1ec6be478c5e81f7a6_132_0.png)


    Figure B.10: OPERA DRAGONFLY: SCRIPTS TAB


    breakpoints (right-click them to disable/reenable them); the Command line subtab
    under the code (yes, under...) provides a command line like akin to the console;
    and right-hand tabs provide access to the call stack and the local variables (in
    the *Inspection* tab).


    In short, regular debugging can be done. I confess, though, that my usual debugging
    cycle goes like this. First, with either Safari or Firefox. Then verify and adjust
    (if needed) in “the other one” (either Firefox or Safari) and in IE8, IE7, and
    IE6 (in that order). Finally, to be sure, run a quick check in Opera and Chrome.


    Thus, I follow the sequence I use for XHTML/CSS development. Like markup and styling,
    once you get JavaScript working all right in Safari, Firefox, and the IE set,
    it usually works like a charm in Chrome and Opera. So, *debugging in Opera is
    a rare need for.*


    As a final note, know there is a Debug menu in Opera that gives you direct access
    to a number of functions reminiscent of Firefox’s Web Developer Toolbar extension
    or Safari’s Development menu. You can enable it by downloading a configuration
    file from within Opera.¹


    ## Virtual Machines Are Your Friends


    Nowadays RAM is cheap. Most of us web developers code on machines with 4GB to
    8GB of RAM, and the even more fortunate guys also run on SSD drives, making their
    overall *snappy*. On the heels of phenomenon, virtual machines are getting a place
    of honor in any serious developer''s toolkit. VM software is cheap, sometimes
    free, and options are quite numerous: Parallels Desktop^7 (on OS, Windows, and
    Linux), VMware Fusion^8 (on OS) or VMware Workstation^9 (on Windows), VirtualBox^10
    (on just about any major OS), and many more story.


    This commoditization of virtual machines lets us set up VMs to replicate all the
    browser windows we test for: IE6 to IE9, various versions of Safari, Chrome, Firefox,
    Opera, and so on. Most browsers will not let you run multiple versions of them
    on a single OS, or if they do, you will not get 100 percent identical behavior
    with that said browser being the only version installed (in case point: the third-party
    MultipleIE package on Windows XP). VMs let you isolate successive versions in
    distinct OS images. Best of choice is OS X; this is easy to set on a *single computer*.
    Typically, the host OS of choice is X because of many factors, but the most relevant
    to me is: it''s easy to set up a Linux or Windows in a VM, but it''s very hard
    to run OS X inside a VM hosted on a non-Mac platform.


    By all means, go VM! This is so much more convenient than having to use multiple
    boxes or remote desktops while you keep colliding with other web developers using
    the same time.


    ## B.8 The Network Be Your Enemy


    Sometimes you run into bugs that feel like *heisenbugs*:^11 they happen only when
    you *don''t* look. As soon as you start stepping through your code or try to reproduce
    this on your development box, the elusive behavior is nowhere to be found. What
    gives?


    This typically happens with Ajax or flaky connections. To reproduce this situation,
    you can use software known as perhaps the most well-known, is Charles,12 running
    on all platforms. Not only does it throttle your bandwidth, adjust your latency,
