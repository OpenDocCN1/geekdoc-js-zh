    # Providing Input Length Feedback


    A common source of frustration when filling in forms is to suddenly see the text
    input stop dead, when there was some text turning us of the maximum length. Not
    only, but did you know that <textarea> has no maxLength=attribute? Seriously.
    It''s not valid HTML and will be blissfully ignored (unless you''re fortunate
    enough to be able to use HTML5).


    So, to provide a unified way to specify maximum lengths, we can rely on dedicated
    CSS classes for, example, "data storage". They will use a two-part name: first
    a maxPrefix, then a positive_integer, stating the maximum length we want. See
    the markup on the facing page.


    Then we can use JavaScript to do the following:


    +   - Dynamically create the form zones (I''ll assume paragraphs, for the sake
    of brevity) containing these elements (the facing code adds a class to the paragraph),
    and then dynamically create the placeholder for remaining-length feedback.

    - Initialize the feedback zone to the current state.

    - Bind appropriate event listeners for as-you-type feedback.

    - Position the feedback zone (I put it under the bottom-right corner of its matching
    field) and add it to the document, now that it''s ready for prime time!


    Now when typing occurs, we just need to update the feedback, and if we hit or
    exceed the maximum length (something impossible on a <textarea>), we''ll backtrack
    to the maximum allowed length.


    Note a couple of tricks in this:


    +   - We listen for bothkeyup and keypress in order to react to noncharacter keys
    (deletions, cuts, and pastes), and character keys. Listening tokeydown would be
    useless because it occurs before the text changes, and we have no reliable way
    of determining across browsers and keyboard layouts the text will change.

    - To avoid recomputing the maximum length at every keystroke, we cache it during
    setup. To associate maximum lengths with our fields, we use a JavaScript-based
    associative array between the fields* id=attributes and the fields themselves.
    This is lighter than using expanding properties.


    52. We use Prototype''s identify() here to make sure our element has an id.'
