    ## 当 DOM 加载时运行代码


    能够在页面 DOM 加载后立即运行代码，是让页面从一开始就具有响应能力的关键部分。


    如果你只有在窗口加载（load）事件触发时才进行点击，那么你的代码必须等待最后一个资源加载完毕——样式表、图像以及如 Google Analytics 追踪器之类的脚本，这可能会非常令人恼恼地缓慢。在初始页面渲染之后，这可能意味着很长的时间。


    所有的库都会以相当相似的方式处理这个问题。它们通过将函数绑定到它们提供的自定义触发器、自定义方法或自定义事件上来实现这一点的（例如 Prototype、MooTools
    和 YUI 3）。


    顺便说一下，你应该遵循良好的实践来编写页面样式：如果 UI 的部分依赖于 JavaScript，则非 JavaScript 的替代方案默认可见，而与 JavaScript
    相关的 UI 是隐藏的。那么在 DOM 加载事件中，你只需要为文档的 `body` 添加一个与 JavaScript 相关的类，并让 CSS 相应地切换可见性。这比通过
    JavaScript 隐藏无关的 UI 要得多，因为避免了页面加载期间 UI 闪烁的风险。


    现在说一个相当技术性的说明：假设你的初始化代码位于某处的实例方法中，并且该方法需要保留其绑定。它在内部使用 `this`，并需要它指向正确的包含实例。大多数库允许你通过普通的方法绑定来解决（例如使用
    Prototype 的 `bind()`），而 Dojo 和 Ext JS 则通过允许你提供方法的实例的显式引用，从一开始就解决了这个问题。这样，它们就可以直接在正确的上下文中调用该方法：


    ```javascript

    // Dojo

    dojo.addOnLoad(binding, fx)


    // Ext JS

    Ext.on(fx, binding)

    ```


    你还应该检查你的初始化代码是否真的可以在 DOM 加载时运行；在某些情况下，这实际上太早了。例如，你可能依赖于特定图像的加载，以便根据它们的尺寸设置 UI；或者类似地，你可能需要
    CSS 样式表加载并应用，以获取正确的元素尺寸、颜色等。这时，你可能需要等待窗口的加载事件。尽管如此，大多数情况下，DOM 加载已经“足够晚”，并且是一个完美的设置点。


    ## 在 DOM 加载时触发。


    ```javascript

    // Prototype

    document.observe(''dom:ready'', fx)

    // jQuery

    $(fx)

    // MooTools

    window.addEventListener(''domready'', fx)

    // YUI 3

    YUI.on(''domready'', fx)

    // Dojo

    dojo.addOnLoad(fx)

    // Ext JS

    Ext.onReady(fx)

    ```


    ## 相关任务


    - 任务 8，监听事件（并停止），在下一页


    ## 监听事件（并停止）


    事件是一个庞大的主题，这一页的内容无法涵盖即使是基础知识。核心思想是这样的：你在对面页面上看到的是一张非常短的参考卡。你应该（我几乎可以说，你必须）花时间仔细阅读你所库关于事件的文档和指南。精通事件技巧将获得
    100 倍的回报。


    特别需要注意的是，许多库都有监听特定事件的简写方法。因此，你可以调用 `click(handlerFx)` 而不是 `connect(''click'',
    handlerFx)`。另一个实用的技巧是，大多数库允许你在观察停止（stopping）时传递更少的参数，从而注销匹配该更广泛范围的所有事件（例如，所有的点击处理程序或该元素的所有处理程序）。


    值得注意的是：Dojo 使用单一机制来连接任何类型的事件（普通 DOM 事件、自定义事件、所谓的全局事件、发布-订阅机制、以及基础的*方法调用*）到任何类型函数的触发上（真正的事件处理程序、普通函数和方法）。这非常巧妙。而
    Ext 允许 `on()` 接受第四个参数，这提供了丰富的选项。


    如果你在文档级别观察事件（利用事件冒泡），所有的库都提供了一种简单的方法。例如，Prototype 允许你调用 `document.observe`，还有像
    `dojo.doc` 和 `Ext.get` 这样的封装器。然而，你不应该依赖与*事件捕获*（自上而下的事件传播/拦截）相关的参数和选项，因为它们在 IE8
    上通常没有良好的支持。


    所有的库都为你的处理程序提供了一个增强的 Event 对象，配备了 W3C 属性和方法，通常还有更多。


    情况下，处理函数作为函数引用传递会丢失其潜在的绑定并在全局范围内执行¹¹⁰。几个库直接解决了这个问题，允许你传递一个可选的作用域对象。


    最后，大多数库都支持自定义事件，并内置了一些（主流或其他其他的）事件。我知道没有 `DOM readiness`、`mouseenter` 和 `mouseleave`
    我将无法生存，这只是冰一角。


    > 10. 关于 JavaScript 绑定的完整故事——它的陷阱和技巧——请查看我的 ALA 文章：http://www.alistapart.com/articles/getoutbindingssituations。


    ## 在一个元素上监听事件。


    ```javascript

    // Prototype

    $(element).observe(''event'', handlerFx)

    // jQuery

    $(elementOrSelector).bind(''event'', handlerFx)

    // MooTools

    $(element).addEventListener(''event'', handlerFx)

    // YUI 3

    Y.on(''event'', handlerFx, elementOrSelector)

    // Dojo (不依赖上下文的 handlerFx 或需要上下文的方法)

    dojo.connect(element, ''event'', handlerFx)

    // Ext

    Ext.get(element).on(''event'', handlerFx)

    ```


    ## 在多个元素上监听事件。


    ```javascript

    // Prototype

    elements.observe(''event'', handlerFx)

    // jQuery

    $(elementOrSelector).bind(''event'', handlerFx)

    // MooTools

    $(element).addEventListener(''event'', handlerFx)

    // YUI 3

    Y.on(''event'', handlerFx, elementOrSelector)

    // Dojo

    dojo.connect(element, ''event'', handlerFx)

    // Ext

    Ext.get(element).on(''event'', handlerFx)

    ```


    ## 停止监听。


    ```javascript

    // Prototype

    $(element).stopObserve(''event'', handlerFx)

    // jQuery

    $(elementOrSelector).unbind(''event'', handlerFx)

    // MooTools

    $(element).removeEventListener(''event'', handlerFx)

    // YUI 3

    Y.detach(''event'', handlerFx, elementOrSelector)

    // Dojo

    dojo.disconnect(returned)

    // Ext (注意：是 ''un'' 不是 ''on'')

    Ext.get(element).un(''event'', handlerFx)

    ```


    ## 相关任务


    - 任务 7，当 DOM 加载时运行代码，第 20 页

    - 任务 9，利用事件委托，在下一页

    - 任务 10，通过自定义事件解耦行为，第 26 页


    ## 利用事件委托


    背记住这一点并让它成为你的：事件委托是更好的方法。


    你看，大多数事件都是冒泡的，例如鼠标或键盘事件。当它们在某处发生时，它们会沿着祖先链一直触发到文档元素（也就是说，除非这些元素中的某一个停止了冒泡）。如果我们有大量共享某种行为的元素，最好在
    DOM 高处监听它，在元素的最近祖先级别，或者直接在文档级别。这节省了大量的内存和 CPU 时间。


    在 DOM 高处监听对于 Ajax 加载的内容也很好。当你在内容外部监听时，新添加的元素会自动利用你的行为，而无需在加载后附加监听器。


    然而，有时我们不得不诉诸黑科技或完全放弃委托，因为我们的触发事件不冒泡。这确实令人沮丧。虽然存在变通代码来模拟部分冒泡，但它们无法冒泡仍然是一个麻烦。


    我应该提到，自从 jQuery 1.4 以来，`live()` 才变得足够灵活可以进行事件委托，而没有性能问题。从那个版本开始，它还获得了处理许多非冒泡事件的能力。相比之下，Dojo
    的 `behavior()` 看起来会使用事件委托，但它并不是。它只是语法糖。


    '
