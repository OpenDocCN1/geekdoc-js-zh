    # GETTING HELP


    to the language itself. You''ll find all kinds of attendees, from complete newbies
    to awesome gurus.

    * You can also get non-English discussion in the few language-specific subgroups,
    like de.comp.lang.javascript, fr.comp.lang.javascript, japan.comp.lang.javascript,
    and the like.


    # Mailing Lists and Forums


    You''ll find plenty of forums out there, with quality varying from abysmal to
    awesome, depending on who''s posting. Just stay away from cut-and-paste dumpsters;
    this is how bad practices popping up everywhere.


    * Google Groups maintains a bridge on the newsgroups I mentioned before, so you
    could head here.

    * Sitepoint is usually pretty good, so you could try their JavaScript forum.

    * Webdeveloper has a lot of activity.


    But seriously, go with the first one (the newsgroup bridge) whenever possible.
    There''s a higher signal-to-noise ratio.


    # IRC Channels


    Ah, IRC. This is another old-timer, but it''s great because, well, it''s instant
    messaging. On the other hand, its usefulness depends on whether knowledgeable
    people are logged in at the same time you can.

    Main is on irc.freencode.net, as ##javascript. It usually boasts between 300 and
    400 attendees at any given time. With a bit of poking around, you can also find
    a few good non-English channels.


    # Further Reading


    You can find a number of authoritative books on JavaScript. I''ve listed many
    in the bibliography, but I''ll comment on a few parts:


    * JavaScript: The Definitive Guide [Fla06], by David Flanagan, is widely acknowledged
    as the JavaScript bible, which is funny since the JavaScript Bible [Goo07] is
    by Danny Goodman, prefaced by Brendan Eich. (A seventh edition is due soon.)

