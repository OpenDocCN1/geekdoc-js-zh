    \n在这样的情况下，你会发现自己面临着一个微小的障碍。直觉上，用户期望他们在页面上的位置不会移动。但通过在上方加载内容，你会把文档的其余部分（包括点击区域）推向视口的更下处，并很可能将其推到视口之外。\n\
    \n解决方案是*保持相对于视口的滚动位置*。要做到这一点，我们需要获取视口的“滚动偏移量”（即在上方加载内容之前，视口显示内容之前的位置），并在内容注入后恢复该偏移量。偏移量（Offsets）通常是一项麻烦的事务，充满了跨浏览器的兼容性问题，但对于\
