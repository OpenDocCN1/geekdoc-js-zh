    ```\n\n## Math functions\n\nThe Math object provides access to static methods\
    \ for all common operations and a number of useful constants, here's a sample:\
    \ \n\n## Asynchronous code: timeouts\n\n```javascript\nvar timer = setTimeout(function()\
