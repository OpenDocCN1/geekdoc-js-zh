    # (Un)checking a Whole Set of Checkboxes at Once


    It happens time and again: you have a list, and there are operations your users
    would like to do en masse. The tasks of deleting, moving, archiving, and changing
    a given property for a number of them all boil down to letting your users check
    specific items.


    And sometimes, all of them. That can be a pain in the butt when the list is long,
    and that is why toggling is a nice UI feature.


    | Subject | Date | From | Size |

    |---|---|---|--|

    | Happy new year! | Jan 1, 2010 00:03am | Drew Barrimore | 1.8kb |

    | What''s your great IT book publisher again? | Jan 1, 2010 11:25am | David McClintock
    | 2.3kb |

    | You gotta check this out... | Jan 2, 2010 02:15pm | Julianne Moore | 4.2kb |


    The markup is simple. Let''s just put a checkbox in the reader''s head section
    to act as a toggler.


    The script itself is fairly concise: react to clicks on the toggler by looking
    up checkboxes in the matching <body> as a container for checkboxes of interest.
    updating their checked= attribute to reflect our togglers.


    Now, as an exercise, you could try to adapt this code to achieve two goals:


    +   - Allow multiple tables in the page, with a toggler. This mostly means you''ll
    replace an id= with a class and use event delegation to avoid registering too
    many listeners.

    - Cater to the more complex tables by allowing more than one <tbody> in a table.
    Yes, that is valid markup (one body semantic section of the table, when you group
    data in some way). Interestingly, if you add more than one <tbody>, you''ll end
    up simplifying the script!'
