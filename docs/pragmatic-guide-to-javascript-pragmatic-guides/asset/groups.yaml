    ## Running Code When the DOM Is Loaded


    Being able to run code as soon as the page''s DOM is loaded is a critical part
    of making your page responsive from the start.


    If you click in only when the window''s load event triggers, your code must wait
    for every last resource to be loaded—style sheets, images, and scripts such as
    Google Analytics trackers, which can be annoyingly slow. That can amount to a
    long time after the initial page rendering.


    All libraries naturally address this topic, in rather similar ways. By attaching
    a function to a custom trigger they provide, a custom method or a custom event
    (such as Prototype, MooTools, and YUI 3).


    By the way, you should style your page in a good practice: if parts of your UI
    rely on JavaScript, the non-JavaScript alternative is visible by default and the
    JavaScript-related UI is hidden. Then in the DOM-loaded event, you would just
    add a JavaScript-related class to your document''s body and let your CSS toggle
    visibilities accordingly. This is much better than hiding irrelevant UI through
    JavaScript, because it avoids the risk of UI flashing in in out during page load.


    Now for a rather technical side note: imagine your initialization code is in an
    instance method somewhere and that method needs to preserve its binding. It uses
    this internally and needs it to refer to its proper containing instance. Most
    libraries let you win with a regular method binding (such as with Prototype''s
    bind()), Dojo and Ext JS address this up front by letting you provide an explicit
    reference for the method''s instance. That way, they can call the method in its
    proper context directly:


    ```javascript

    // Dojo

    dojo.addOnLoad(binding, fx)


    // Ext JS

    Ext.on(fx, binding)

    ```


    You should also check whether your initialization code can actually run at DOM-loading
    time; in a few situations, this is actually too soon. For instance, you may depend
    on specific images being loaded so you can set up a UI based on their dimensions,
    or in a similar vein, you may need to have a CSS style sheet loaded and applied
    to get proper element dimensions, color, or whatnot. You may then need to wait
    for window''s load event. Most of the time, though, DOM-loading is “late enough”
    and makes a perfect setup spot.


    ## Trigger at DOM load.


    ```javascript

    // Prototype

    document.observe(''dom:ready'', fx)

    // jQuery

    $(fx)

    // MooTools

    window.addEventListener(''domready'', fx)

    // YUI 3

    YUI.on(''domready'', fx)

    // Dojo

    dojo.addOnLoad(fx)

    // Ext JS

    Ext.onReady(fx)

    ```


    ## Related Tasks


    - Task 8, Listening for Events (and Stopping), on the next page


    ## Listening for Events (and Stopping)


    Events are a huge subject, and there''s no way this-page spread will cover even
    the basics. The main idea is this: what you see on the facing page is a very short
    reference card. You should (I could almost say, you must) take the time to carefully
    read your library''s documentation and guides on events. Mastering event-fu will
    pay off 100 times over.


    In particular, note that many libraries have shorthand methods for listening to
    specific events. So, you could call, on `click(handlerFx)` instead of `connect(''click'',
    handlerFx)`. Another useful trick is that most libraries let you pass fewer arguments
    when you observe stopping, decommissioning all events that match that broader
    scope (all click handlers or all of the element''s handlers, for example).


    Noteworthy: Dojo uses a single mechanism to connect any sort of event (regular
    DOM event, custom events, so-called global events, publish-subscribe stuff, and
    bare-bones *method calls*) to the triggering of any sort of function (bona fide
    event handlers, plain functions, and methods). This is pretty nifty. And Ext allows
    a fourth argument to `on()`, which allows a wealth of options.


    Should you observe events at the document level (leveraging event bubbling), all
    libraries provide an easy way to do. For instance, Prototype lets you call `document.observe`,
    and there are wrappers like `dojo.doc` and `Ext.get`. However, you should not
    rely too much on arguments and options related to *event capture* (top-down event
    propagation/censorship), because they are often not properly supported on IE8.


    All libraries also take care to provide your handlers with a beefed-up Event object
    equipped with W3C-mandated properties and methods and often a few more, to boot.


    By default, handler functions, being passed as function references, lose their
    potential binding and execute in the global context.¹10 Several libraries address
    this on the spot, letting you pass an optional scope object.


    Finally, most libraries support custom events and bake a few ones in, mainstream
    or otherwise. I know I couldn''t live without DOM readiness, `mouseenter`, and
    `mouseleave`, to name but a few.


    > 10. For the whole story on JavaScript binding—its gotchas and tricks—check out
    my ALA article at http://www.alistapart.com/articles/getoutbindingssituations.


    ## Listen to an event on one element.


    ```javascript

    // Prototype

    $(element).observe(''event'', handlerFx)

    // jQuery

    $(elementOrSelector).bind(''event'', handlerFx)

    // MooTools

    $(element).addEventListener(''event'', handlerFx)

    // YUI 3

    Y.on(''event'', handlerFx, elementOrSelector)

    // Dojo (context-free handlerFx or context-requiring method)

    dojo.connect(element, ''event'', handlerFx)

    // Ext

    Ext.get(element).on(''event'', handlerFx)

    ```


    ## Listen to an event on multiple elements.


    ```javascript

    // Prototype

    elements.observe(''event'', handlerFx)

    // jQuery

    $(selector).bind(''event'', handlerFx)

    // YUI 3

    Y.on(''event'', handlerFx, selector)

    // Dojo

    dojo.query(selector).connect(''event'', handlerFx)

    // Ext

    Ext.addhaviors({''selector'': handlerFx})

    ```


    ## Stop listening.


    ```javascript

    // Prototype

    $(element).stopObserve(''event'', handlerFx)

    // jQuery

    $(elementOrSelector).unbind(''event'', handlerFx)

    // MooTools

    $(element).removeEventListener(''event'', handlerFx)

    // YUI 3

    Y.detach(''event'', handlerFx, elementOrSelector)

    // Dojo

    dojo.disconnect(handleReturned)

    // Ext (watch out: ''un'', not ''on'')

    Ext.get(element).un(''event'', handlerFx)

    ```


    ## Related Tasks


    - Task 7, Running Code When the DOM Is Loaded, on page 20

    - Task 9, Leveraging Event Delegation, on the next page

    - Task 10, Decoupling Behaviors with Custom Events, on page 26


    ## Leveraging Event Delegation


    Learn this by heart, and make it yours: event delegation is the better way.


    You see, most events bubble, such as mouse or keyboard events. When they happen
    somewhere in the DOM, they trigger on every element along the ancestor line, to
    the document element, from the inside out (that is, unless one of these elements
    has a listener that stops the bubbling). If we have a large number of elements
    that should share a behavior, we''re better off listening for it up in the DOM,
    at the level of the elements'' nearest ancestor or perhaps directly at the document
    level. This saves some significant memory and CPU time.


    Listening higher up in the DOM is also great for behaviors for Ajax-loaded contents.
    When you listen "outside" the loaded content, freshly added elements leverage
    your behavior automatically, without requiring post-load listener attachment.


    However, sometimes we have to resort to hacks or abandon delegation entirely,
    because our triggering events do not bubble. This de-ably is infuriating. Although
    workaround code exists to simulate bubbling for at least part of these, their
    inability to bubble is a hassle.


    I should mention that only since jQuery 1.4 did live() become flexible enough
    for event delegation per se, without performance issues. With that version, it
    also gained the ability to work on many nonbubbling events. On the other hand,
    Dojo''s behavior() seems like it would use event delegation, but it doesn''t.
    It''s just syntactic sugar.


    Note the findElement() call in the code sample, on line 2. Currently, our links
    just contain a simple text, so clicking within the link means clicking the link
    itself. But imagine you jazz things up and add an icon (such as a plus/minus icon).
    Then clicks could, technically, happen on the icon but still within the link.
    So with Prototype, when you attach a delegation-based event listener, be sure
    to always use the event''s findElement() method instead of its less element()
    counterpart.

