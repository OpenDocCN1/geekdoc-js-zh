    ## C.5 ExtJS


    ExtJS 是一个完整的 RIA 框架，专注于丰富的、类桌面的 UI 组件，如树形视图、数据网格和对话框。它于 2006 年（我记得是）作为 Jack Slocum
    的一个插件启动，你可以在 Prototype、jQuery 或 YUI 之上使用它。从那以后，它演变成了一个独立的大型框架，旨在构建丰富的、桌面风格的用户界面；例如，它拥有非常强大的数据网格，并且是构建网站管理页面的流行工具。


    ExtJS 是同名公司的产品，该公司还提供了如 Designer 和 GWT 桥接等相关工具。它采用三重许可发布：GPLv3、商业版和 OEM。该许可证在发布时引起了相当大的波动，很大程度上是因为阻止了在非
    GPL 兼容的开源项目中使用。另一方面，这意味着你可以从该库获得商业技术支持、培训和订阅。遗憾的是，它的仓库是关闭的，只能通过自定义页面访问。


    与所有由全职团队支持的优秀项目一样，ExtJS 正在快速发展。在编写本文时，它是 3.1 版本，预计 2010 年将看到多达 4.0 的多次重大发布。


    文档相当不错，拥有一个易于浏览（尽管有时很简练）的 API 参考（显然是用 ExtJS 的的），以及许多完整的应用程序示例。你还会发现几本书，最著名的是 2009
    年底发布的《*ExtJS Cookbook* [Ram09] 和《*ExtJS in Action* [Gar10]，这归功于其规模未知的六人管理团队。


    最后，考虑到该项目的某种非官方性质，其生态系统主要局限于官方网站、运动会论坛以及一个基于 Wiki 的良好的学习中心（Learning Center），该中心提供演示、录屏、教程等。这些是必经的链接：


    - 这是 ExtJS 官方网站：http://extjs.com/。

    - 在 http://www.extjs.com/products/extjs/download.php 下载。

    - 你可以在 http://www.extjs.com/forum/ 找到论坛。

    - 学习中心的主页位于：http://www.extjs.com/learn/Main_Page。


    ## C.6 Dojo


    我们将通过 Dojo 完成对最流行框架的巡检。它于 2004 年由 Alex Russell、Dylan Schiemann 和 David Schontzler
    在 Informatica 期间通过艰辛的共同努力创建，并于 2007 年 11 月 5 日发布，分为 Dojo（核心）、Dijit（UI 组件）和 DojoX（插件和扩展功能）。


    Dojo 现在与 ExtJS 处于同一领域。它是一个具有强大企业支持的主型 RIA 框架。它现在由 Dojo Foundation 养育，其企业赞助商包括
    IBM、Google、AOL、Thomson Reuters、TIBCO、Zend 和 Yahoo 等。在编写本文时的当前版本是 1.5.0。但与 ExtJS
    不同，Dojo 实际上是开源的，采用 Academic Free License 2.1 和 BSD 许可证双重许可，并维护着公共 GitHub、Subversion
    和 Bazaar 仓库。


    Dojo 与现在处于 Dojo Foundation 伞下的项目也很密切，最为人知的是 cometD 和 DWR，这是两个早期（且仍然适用）的从服务器向浏览器推送数据的系统（不要忘记
    Sizzle、Perseverance 和 Generic Interface）。


    Dojo 在开发会议上非常活跃（有许多聚会！），并且通常通过专门的论坛维护着充满活力的社区。就社区实力而言，它可能仅次于 jQuery。你会发现很多本很不错的书，包括《*Mastering
    Dojo* [RGR08]、《*Dojo: the Definitive Guide* [Rus08]、《*Practical Dojo Projects*
    [Zam08] 以及最近的《*Getting Started with Dojo*》。


