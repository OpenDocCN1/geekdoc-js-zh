    # 提供输入长度反馈\n\n填写表单时一个常见的挫败来源是：你会发现文本输入突然停止了，而其实是因为某些文本已经让我们达到了最大长度。不仅如此，你知道 `<textarea>`\
    \ 甚至没有 `maxLength` 属性吗？真的。它不是有效的 HTML，并且会被无情地忽略（除非你足够幸运，可以使用 HTML5 的话）。\n\n因此，为了提供一种统一指定最大长度的方法，我们可以依赖专门的\
    \ CSS 类，例如用于“数据存储”。它们将使用两部分命名：首先是前缀 `maxLength`，然后是一个正整数 `positive_integer`，表示我们想要的最大长度。参见对应页面的标记。\n\
    \n然后我们可以使用 JavaScript 执行以下操作：\n\n- 动态创建表单区域（为了简洁起见，我假设是段落标签），其中包含这些元素（对应的代码为段落添加了类），然后动态创建剩余长度反馈的占位符。\n\
    - 将反馈区域初始化为当前状态。\n- 为边输入边产生的反馈绑定适当的事件监听器。\n- 确定反馈区域的位置（我把它放在与其匹配字段的右下角）并将其添加到文档中，现在它已经准备就绪了！\n\
    \n现在当发生输入时，我们只需要更新反馈，如果我们达到或超过了最大长度（这在 `<textarea>` 上是不可能的），我们将回溯到允许的最大长度。\n\n\
    注意此过程的几个技巧：\n\n- 我们同时监听 `keyup` 和 `keypress`，以便响应非字符键（删除、剪切和粘贴）以及字符键。监听 `keydown`\
    \ 是没用的，因为它在文本更改之前发生，而且我们没有可靠的方法能够跨浏览器和键盘布局来确定文本是否会发生变化。\n- 为了避免每次按键时都重新计算最大长度，我们在设置期间对其进行了缓存。为了将最大长度与我们的字段关联起来，我们在字段的\
    \ `id` 属性和字段本身之间使用了一个基于 JavaScript 的关联数组。这比使用扩展属性要轻量得多。\n\n52. 我们在这里使用 Prototype\
    \ 的 `identify()` 来确保我们的元素拥有 id。\n\n# 通过标记语言（markup）指定最大长度。\n\n```html\nform/feedback/index.html\n\
    <p>\n  <label for=\"edtDescription\">描述</label>\n  <textarea id=\"edtDescription\"\
    \ name=\"description\" cols=\"40\"\n  rows=\"5\" class=\"maxLength200\"></textarea>\n\
    </p>\n```\n\n# 为最大长度字段设置反馈。\n\n```javascript\nform/feedback/feedback.js\nvar maxLengths\
