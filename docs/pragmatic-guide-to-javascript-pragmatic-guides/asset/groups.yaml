    # D.1 Help on JavaScript in General


    Having great frameworks around is no excuse for not knowing your JavaScript. Sometimes
    you actually need to write some actual code, or perhaps you can''t make use of
    your usual framework for various reasons (performance on mobile devices, anyone?).


    # Newsgroups


    Remember the time before DSL was (almost) everywhere? Before Google Groups? Before
    Google, actually? Well, perhaps you weren''t developing back then, but we had
    Usenet. It''s still around, and recently, a new generation has discovered how
    good it can be at, sharing binary files. Better still, it has newsgroups for every
    programming language known to man.


    Every ISP provides newsgroup access; it''s that ''NNTP server'' thing you saw
    on your subscription papers. And all aggregators, feed readers, and even email
    clients—Thunderbird, Entourage, Outlook, and yes, even Outlook Express—let you
    connect to an NNTP server and subscribe to newsgroups of your choice. Depending
    on your ISP, you''ll have your pick of thousands.


    Heck, even if you don''t want to access these groups that, Google Groups maintains
    bridges to most useful newsgroups, including the following ones:


    +   * The core of the action is at comp.lang.javascript. (The address is short
    for Computer LANGauge JavaScript.) It''s been around for and remains the main
    location for all online discussions related


    1 Except if you''re using the awesome, just-released zepto.js library by Thomas
    Fuchs: http://github.com/madrobby/zepto. Or you get faster-ever with vapor.js:
    http://github.com/madrobby/vapor.js.'
