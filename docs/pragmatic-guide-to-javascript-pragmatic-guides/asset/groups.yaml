    # JavaScript FRAMEWORKS


    jQuery’s focus is mostly on lowering the perceived barrier-to-entry for people
    wanting to spruce up their web pages with a bit of JavaScript without prior knowledge
    of the language (or something of programming in general). Its API provides a lot
    of quick shortcuts targeted at the most common use cases, and a number of plug-ins
    (some of them grouped in the jQuery UI project) take care of the rest. Recently
    I''ve been hearing people describe jQuery as a DSL for DOM manipulation” or state
    that “jQuery comes from selectors to code, allowing people who know CSS to use
    JavaScript.” Although not entirely accurate (in a bit, reductionist), such characterizations
    capture the essence of jQuery.


    The driving force behind jQuery is its astounding team. Aside from almost two
    dozen people working on plug-ins projects, the core, the UI, and the website,
    its force lies with the half-dozen people who nurture the jQuery community through
    conferences, events, and meetings. Having a number of corporate sponsors doesn’t
    hurt, but the project itself remains open source, using a dual GPL/MIT license,
    hosted at GitHub, and allowing bug reports through most.


    Around the core project and the jQuery UI, you''ll find a number of magazines
    and conferences, meetup groups, and online forums. Several jQuery books have been
    published, including jQuery for Dummies [Bei10], jQuery in Action [BK10], jQuery:
    Novice to Ninja [CS10], and jQuery Cookbook [Lin09].


    As I mentioned, I believe jQuery and Prototype address somewhat different need
    sets. I cannot deny see how appealing it is to large categories of users, as those
    needing JavaScript as a mere tool to get common tasks done in a snap. The teeming
    life of the jQuery community (who don''t want to learn too much API) is also a
    big plus, because it inspires confidence in the project''s longevity and level
    of support. jQuery is, at the time of this writing, version 1.4.2.


