    - 你可以在 http://bugs.dojotoolkit.org/ 找到错误跟踪和报告。

    - 你可以在 http://www.dojotoolkit.org/community/ 与社区互动。


    # 获取帮助


    我真的希望你发现这本书很有用。尽管如此，你仍然需要自己寻找一些解决方案，或者可能需要某人确认你的方向是否正确。那么，在哪里可以获得更多帮助并与他人讨论这些事情呢？


