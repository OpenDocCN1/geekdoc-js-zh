    \ || or\n&& short-circuiting (if a is false, then returns a)\n|| short-circuiting\
    \ (if a is true, then returns a)\n```\n\n## Regular expression\n\n```\nPriorities:\
    \ most C++ / Java / Ruby's...\n* / % = =\n+ - =\n^^ is XOR, << >> >>> shift (with\
