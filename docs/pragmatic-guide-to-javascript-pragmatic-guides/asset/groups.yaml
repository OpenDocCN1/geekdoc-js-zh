    The Art and Science of JavaScript [AEH+07].


    Evangelist extraordinaire Chris Heilmann authored Beginning Script with DOM Scripting
    and Ajax: From Novice to Professional [Hei06], which is also a great read.


    I would be remis if I did not add Thomas Fuchs and Amy Hoy''s latest jewel, which
    is really a companion tool for performance, performance, and performance: JavaScript
    Performance Rocks! [HF09].


