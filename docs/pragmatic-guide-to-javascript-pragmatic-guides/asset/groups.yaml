    \  email: /^[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,6}$/i\n};\n\nfunction checkBox(field)\
    \ {\n  var value = $(field).toString().strip();\n  for (var pattern in FIELD_PATTERNS)\
    \ {\n    if (!field.hasClassName(pattern)) continue;\n    if (!FIELD_PATTERNS[pattern].test(value))\
    \ return false;\n  }\n  return true;\n}\n```\n\n# Related Tasks\n\n- Task 21,\
    \ Validating Forms: Basics, on page 56\n- Task 23, Validating Forms: The Whole\
    \ Nine Yards, on following page\n\n# 23 Validating Forms: The Whole Nine Yards\n\
    \nThe previous tasks—Task 21, Validating Forms: Basics, on page 56 and Task 22,\
    \ Validating Forms: Going Further, on page 58—dealt with required fields and text\
    \ input pattern checking. We now need to ping the server side for front checking.\n\
    \nThis is our first use of Ajax in this book, an area of JavaScript that can be\
    \ troublesome to debug. If you haven't yet, read through Appendix B, on page 101,\
    \ before going on; the information there will prove invaluable when you try to\
    \ troubleshoot or tweak Ajax-driven code.\n\nThe poster child of Ajax validation\
    \ is unique fields. Most often, this is logins and email addresses. We'll implement\
    \ such a check here for login field, assuming an application mandates logins that\
    \ are unique across all users.\n\nAn important facet of Ajax validations is on-the-fly\
    \ UI feedback, with behaviors such as progress and result indicators. So our markup\
    \ must plan for these UI elements. On a higher level, you must also decide, perhaps\
    \ on a per-field basis, what triggering behavior you're looking for. Should you\
    \ check input *as it's typed* (using high-frequency monitoring) or *once it's\
    \ typed* (using change events)? In this example, I went with the former option,\
    \ implying Prototype's Field.Observer mechanism, which I did with a 0.8 interval\
    \ so not to strain slow typists too much.\n\nOur check starts by ignoring empty\
