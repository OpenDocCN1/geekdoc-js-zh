    # 35 Geocoding a Location and Getting Photos For It


    Geolocation has become a very common need, mostly thanks to the rise of the mobile
    Web, so we''re going to illustrate the two main aspects of it:


    +   - First, turning a textual location (address, city, region or country) into
    a geocoding (which essentially boils down to a latitude and a longitude)³³

    - Second, searching data based on these geocordinates


    A lot of APIs are available, including prominent “geocoders” from Google, Yahoo!,
    GeoNames, and others. For our purposes, I''ll use a very simple, straightforward,
    and useful tool: Placemaker API and Christian Heilmann''s JavaScript writer for,
    JS-Placemaker. This API lets us analyze any text to extract one or more potential
    geocodes for it, and we''ll use to turn a location name (say, something typed
    into a form field) into latitude and longitude coordinates.


    Like Yahoo! Developer Network APIs, Placemaker requires a Yahoo! AppID; the sample
    code on the fairly page has a working one, but you should get your own AppIDs
    to play with.³⁴ Then you need to provide the JavaScript wrapper with it and call
    its getPlaces() method with the text to analyze, a callback to process the results,
    and optionally the text''s locale (for instance, en-US or fr-FR) to help Placemaker
    analyze it correctly.


    Notice a tiny trick in the code to “normalize” the resultset toward a guaranteed
    array of places. Because a one-match case has a single match property and a multiple-match
    case returns an array named matches (matches || match) to construct both situations
    as an array.

    On the Flickr side, we use the flickr.photos.search method with its geo-related
    parameters lat and lon, through a JSON-P call

    If you''re interested in geocoded tracks that are on the client side and JavaScript-based—including
    GeoIP and the W3C Geo API—you can find a wealth of info, demo, and cool stuff
    on the page maintained by evangelist extraordinaire Christian Heilmann.³⁵


    > 33. Often you''ll also want to use extra data such as accuracy and the resulting
    bounding box.

    34. Get those at https://developer.apps.yahoo.com/wsregapp/

    35. http://isithackday.com/hacks/geo/'
