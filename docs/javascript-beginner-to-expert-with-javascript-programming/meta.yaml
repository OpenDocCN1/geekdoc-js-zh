    \n| 序号 | 算术运算符 | 描述 | 示例 |\n|-------|---------------------|-------------|---------|\n\
    | 1. | + (加法) | 用于将两个操作数相加。 | X + Y |\n| 2. | - (减法) | 用于从第一个操作数中减去第二个操作数。 | X\
    \ - Y |\n| 3. | * (乘法) | 用于将两个操作数相乘。 | X * Y |\n| 4. | / (除法) | 用于将两个操作数相除，即分子除以分母。\
    \ | X / Y |\n| 5. | % (取模) | 此运算符输出整数除法的余数。 | X % Y |\n| 6. | ++ (自增) | 将整数值增加\
