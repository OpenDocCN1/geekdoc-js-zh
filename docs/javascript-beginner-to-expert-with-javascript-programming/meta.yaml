    The following are the arithmetic operators which are supported by the JavaScript
    language.


    | S No. | Arithmetic Operator | Description | Example |

    |-------|---------------------|-------------|---------|

    | 1. | + (Addition) | It is used to add two operands. | X + Y |

    | 2. | - (Subtraction) | It is used to subtract the second operand from first
    operand. | X - Y |

