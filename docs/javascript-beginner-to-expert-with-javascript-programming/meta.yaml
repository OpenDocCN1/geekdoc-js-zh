    \ | 例如：Z = X - Y 将把 X - Y 的值赋给 Z 变量。 |\n| 2. | += (加法赋值) | 此运算符用于将右侧操作数加到左侧操作数上，并将结果赋给左侧操作数。\
    \ | 例如：Z += X 等价于 Z = Z + X |\n| 3. | -= (减法赋值) | 此运算符用于从左侧操作数中减去右侧操作数，并将结果赋给左侧操作数。\
    \ | 例如：Z -= X 等价于 Z = Z - X |\n| 4. | *= (乘法赋值) | 此运算符用于将左侧操作数乘以右侧操作数，并将结果赋给左侧操作数。\
    \ | 例如：Z *= X 等价于 Z = Z * X |\n```\n"
