  md: "# # Chapter 4\n\n# # JavaScript Syntax\n\nLike any other programming language,\
    \ JavaScript syntax has certain set of rules in which they are constructed.\n\n\
    # ## Programs in JavaScript\n\nA JavaScript program is a sequence of instructions\
    \ which are parsed and executed by the browser program. These sequence of program\
    \ instructions are known as statements.\n\n+   - JavaScript is an objected oriented\
    \ based programming language.\n- JavaScript statements are usually separated by\
    \ semicolons, however placing a semicolon at the end statement is optional.\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JavaScript\
    \ Syntax</title>\n<script type=\"text/javascript\">\n    var a = 101;\n    var\
    \ b = 300;\n    var sum = a + b;\n</script>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\n    document.write(\"sum of a + b = \"+sum);\n```"
  merge: -1
