  md: '# Chapter 15


    # JavaScript Objects


    JavaScript language is an Object Oriented Programming (OOP) based language which
    provides the following capabilities of OOPs language to the programmer.


    **Encapsulation** – is the concept with which we can store all the related information
    that includes data and methods, together in an object.


    **Aggregation** – is the concept which enables to store one object inside another
    object.


    **Inheritance** – is the concept that enables a class to inherit or re-use the
    properties and the methods of another class (or number of classes). It is also
    known as parent class.


    **Polymorphism** – is the concept that enables the programmer to write one function/method
    that execute different task in different ways but defined with the same name.
    Also known as method overloading.


    **Objects** — are composed of attributes. An attribute can be a function or a
    property. Function is considered to be a method of the object.


    # Object Properties in JavaScript


    Object properties in JavaScript can be of any of the three primitive data types
    (Number, String and Boolean), or any of the abstract data types (such as an object).
    Object properties are the variables which are used internally in the object’s
    methods. They can also be used as globally visible variables therefore, can be
    used throughout the page. The following is the syntax and the example.


    ```

    <!DOCTYPE html>

    <html>

    ```'
