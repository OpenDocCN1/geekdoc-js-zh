- md: "## Enabling or disabling the JavaScript support in Opera\n\nThe following are\
    \ the steps to enable or disable the JavaScript support in Opera.\n\n1.  Open\
    \ the Opera browser and follow *Tools* → *Preferences* from the menu.\n2.  Then,\
    \ Select the *Advanced option* from the dialog box.\n3.  Next, select the Content\
    \ from the listed items.\n4.  From there, select *Enable JavaScript* checkbox.\n\
    5.  Lastly, click OK button to enable the JavaScript support in Opera browser.\n\
    \nSimilarly, to disable the JavaScript support in Opera browser, we should not\
    \ select the *Enable JavaScript* checkbox and click on the OK button.\n\n## Warning\
    \ for Non-JavaScript Browsers\n\nWhen we have to do something very important by\
    \ using the JavaScript, then we can show a warning message to the user by using\
    \ the `<noscript>` tags. We can add a noscript block immediately after the script\
    \ block as shown below.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>No Script tag</title>\n</head>\n<body>\n  <script type=\"\
    text/javascript\">\n  document.write(\"JavaScript Support is enabled on your browser!\"\
    )\n  </script>\n  <noscript>\n        Please enable JavaScript support on your\
    \ browser.\n  </noscript>\n</body>\n</html>\n```\n\nIf any of the above browser\
    \ does not support JavaScript or JavaScript support is disabled, then the message\
    \ between the `<noscript></noscript>` tags will be shown on the screen.\n\n# Chapter\
    \ 6\n\n## JavaScript Placement\n\nPlacement of JavaScript code in the HTML document\
    \ is very flexible and can be placed in the following ways.\n\n**JavaScript in\
    \ `<head>`...`</head>` section** — It is the most preferred way to include the\
    \ JavaScript code in the head section of the HTML document. We can place the JavaScript\
    \ code or functions in the head section and can access these functions on the\
    \ web elements events as shown below.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>JS in head section</title>\n  <script type=\"\
    text/javascript\">\n      function showAlert(){\n          alert (\"This is an\
    \ alert from Head section!\");\n      }\n  </script>\n</head>\n<body>\n  <input\
    \ type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"/>\n</body>\n\
    </html>\n```\n\n### Output\n\nWhen we execute the above HTML program, the following\
    \ will be the output. In the output, we can see the alert with a message as “This\
    \ is an alert from Head section”, when we click on the button present on the web\
    \ page.\n\n**JavaScript in `<body>`...`</body>` section** — we can also place\
    \ the JavaScript code in the body section of the HTML code, however this approach\
    \ is not preferred as we call JavaScript functions from body section which are\
    \ preferably defined in the head section of the HTML document.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JS Body</title>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\ndocument.write(\"Welcome to\
    \ JavaScript Tutorials!\")\n</script>\n<p>Body section of the HTML document.</p>\n\
    </body>\n</html>\n```\n\n### Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output. In the output, we can see the text \"Welcome\
    \ to JavaScript Tutorials!\" written via JavaScript on the HTML page which is\
    \ placed in its body section.\n\n**JavaScript in `<body>`...`</body>` and `<head>`...`</head>`\
    \ sections** — in this approach, the JavaScript code is placed in both the head\
    \ and the body section of the HTML document as shown in the following example.\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JS\
    \ Head and Body</title>\n  <script type=\"text/javascript\">\n      function showAlert(){\n\
    \         alert(\"This is an alert from Head section!\");\n      }\n  </script>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\n\tdocument.write(\"Welcome\
    \ to JavaScript Tutorials!\")\n</script>\n<p>Body section of the HTML document.</p>\n\
    <input type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"/>\n\
    </body>\n</html>\n```\n\n### Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output. In the output, we can see the text \"Welcome\
    \ to JavaScript Tutorials!\" written via JavaScript on the HTML page which is\
    \ placed in its body section. At the same time, when we click on the button, it\
    \ will display an alert message as \"This is an alert from Head section\". This\
    \ is the JavaScript function called on click event of the button which is defined\
    \ in the head section of the HTML document.\n\n**JavaScript placed in an external\
    \ file and include in `<head>`...`</head>` section** — it is one of the best approach\
    \ of placing all the JavaScript code in an external file which has file extension\
    \ as **jscode.js** and we include this file in the head section of the HTML document.\
    \ All the functions which are present in this file can be called on various web\
    \ elements events defined in the body section of the HTML document. In the following\
    \ example we have declared the function as *showAlert()* in a separate file \"\
    demo.js\" located in js directory.\n\n```\nfunction showAlert(){\n    alert(\"\
    This is an alert from Head section!\");\n}\n```\n\nWe are including this external\
    \ JavaScript file in the head section of the HTML document as shown below.\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JS\
    \ External File</title>\n<script type=\"text/javascript\" src=\"js/demo.js\"></script>\n\
    </head>\n<body>\n    <input type=\"button\" onclick=\"showAlert();\" value=\"\
    Call JavaScript\" />\n</body>\n</html>\n```\n\n### Output\n\nWhen we execute the\
    \ above HTML program, the following will be the output. In the output, we can\
    \ see the alert with a message as “*This is an alert from Head section*”, this\
    \ is the JavaScript function called on click event of the button which is defined\
    \ in the external demo.js file and included in the head section of the HTML document.\
    \ This works the same way as if we include the JavaScript function code in the\
    \ head section of the HTML document.\n\n# Chapter 7\n\n## JavaScript Variables\n\
    \n**Datatypes in JavaScript**\n\nIt is the characteristic of every programming\
    \ language to support operations on the set of data types. These are the actual\
    \ values which are defined and manipulated in any programming language. Like any\
    \ other programming language, the JavaScript language allows us to work with the\
    \ following three primitive data types.\n\n*   Numbers, e.g. 1, 23, 10.50, 23.8990\
    \ etc.\n*   Strings or text data, e.g. “JavaScript”, “This is my language”, etc.\n\
    *   Boolean, as always it could be either true or false.\n\nApart from these three\
    \ primitive datatypes, JavaScript language also defines the following two trivial\
    \ data types. Each of which defines only a single value.\n\n*   Null.\n*   Undefined.\n\
    \nAlso, JavaScript language supports a composite data type known as object. JavaScript\
    \ objects will be covered in detail later in this tutorial.\n\nThis is to be noted\
    \ that the JavaScript language does not make a distinction between integer values\
    \ and floating-point values. JavaScript considers all numbers as the floating-point\
    \ values. JavaScript represents numbers by using the 64-bit floating-point format\
    \ which is defined by the IEEE 754 standard.\n\n**Variables in JavaScript**\n\n\
    As discussed earlier, the JavaScript language has variables as data containers\
    \ where we can place data into these containers and then refer this data by simply\
    \ naming the container. We declare JavaScript variable with the var keyword as\
    \ shown below."
  mdcn: "\n## 在 Opera 中启用或禁用 JavaScript 支持\n\n以下是在 Opera 中启用或禁用 JavaScript 支持的步骤。\n\
    \n1.  打开 Opera 浏览器，从菜单中依次选择 *工具* → *首选项*。\n2.  然后，在对话框中选择 *高级选项*。\n3.  接着，从列出的选项中选择\"\
    内容\"。\n4.  在那里，选中 *启用 JavaScript* 复选框。\n5.  最后，点击\"确定\"按钮以在 Opera 浏览器中启用 JavaScript\
    \ 支持。\n\n同样，要禁用 Opera 浏览器中的 JavaScript 支持，我们不应勾选 *启用 JavaScript* 复选框，然后点击\"确定\"\
    按钮。\n\n## 不支持 JavaScript 的浏览器的警告\n\n当我们必须使用 JavaScript 执行非常重要的操作时，可以使用 `<noscript>`\
    \ 标签向用户显示警告信息。我们可以在 script 代码块之后立即添加一个 noscript 代码块，如下所示。\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>No Script tag</title>\n\
    </head>\n<body>\n  <script type=\"text/javascript\">\n  document.write(\"JavaScript\
    \ Support is enabled on your browser!\")\n  </script>\n  <noscript>\n        Please\
    \ enable JavaScript support on your browser.\n  </noscript>\n</body>\n</html>\n\
    ```\n\n如果上述任何浏览器不支持 JavaScript 或 JavaScript 支持被禁用，则 `<noscript></noscript>` 标签之间的消息将显示在屏幕上。\n\
    \n# 第 6 章\n\n## JavaScript 的放置位置\n\nJavaScript 代码在 HTML 文档中的放置非常灵活，可以通过以下方式放置。\n\
    \n**在 `<head>`...`</head>` 部分中的 JavaScript** — 这是在 HTML 文档的 head 部分中包含 JavaScript\
    \ 代码的最常用方式。我们可以将 JavaScript 代码或函数放在 head 部分中，并且可以在网页元素的事件中访问这些函数，如下所示。\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JS in head\
    \ section</title>\n  <script type=\"text/javascript\">\n      function showAlert(){\n\
    \          alert (\"This is an alert from Head section!\");\n      }\n  </script>\n\
    </head>\n<body>\n  <input type=\"button\" onclick=\"showAlert();\" value=\"Call\
    \ JavaScript\"/>\n</body>\n</html>\n```\n\n### 输出\n\n当我们执行上述 HTML 程序时，将得到以下输出。在输出中，我们可以看到当点击网页上的按钮时，会弹出一条消息为\"\
    这是来自 head 部分的警报\"的警报框。\n\n**在 `<body>`...`</body>` 部分中的 JavaScript** — 我们也可以将\
    \ JavaScript 代码放在 HTML 代码的 body 部分中，但这种方法并不推荐，因为我们从 body 部分调用 JavaScript 函数，而这些函数最好在\
    \ HTML 文档的 head 部分中定义。\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>JS Body</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\ndocument.write(\"Welcome to JavaScript Tutorials!\")\n</script>\n<p>Body section\
    \ of the HTML document.</p>\n</body>\n</html>\n```\n\n### 输出\n\n当我们执行上述 HTML 程序时，将得到以下输出。在输出中，我们可以看到通过\
    \ JavaScript 写入 HTML 页面的文本\"Welcome to JavaScript Tutorials!\"，该文本位于 body 部分中。\n\
    \n**在 `<body>`...`</body>` 和 `<head>`...`</head>` 部分中的 JavaScript** — 在这种方法中，JavaScript\
    \ 代码同时放在 HTML 文档的 head 和 body 部分中，如下例所示。\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>JS Head and Body</title>\n  <script type=\"\
    text/javascript\">\n      function showAlert(){\n         alert(\"This is an alert\
    \ from Head section!\");\n      }\n  </script>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\n\tdocument.write(\"Welcome to JavaScript Tutorials!\")\n</script>\n\
    <p>Body section of the HTML document.</p>\n<input type=\"button\" onclick=\"showAlert();\"\
    \ value=\"Call JavaScript\"/>\n</body>\n</html>\n```\n\n### 输出\n\n当我们执行上述 HTML\
    \ 程序时，将得到以下输出。在输出中，我们可以看到通过 JavaScript 写入 HTML 页面的文本\"Welcome to JavaScript Tutorials!\"\
    ，该文本位于 body 部分中。同时，当我们点击按钮时，将显示一条警报消息\"This is an alert from Head section\"。这是在按钮的点击事件上调用的\
    \ JavaScript 函数，该函数定义在 HTML 文档的 head 部分中。\n\n**将 JavaScript 放在外部文件中并在 `<head>`...`</head>`\
    \ 部分中引入** — 这是一种最佳做法，将所有 JavaScript 代码放在一个外部文件中，文件扩展名为 **jscode.js**，然后在 HTML\
    \ 文档的 head 部分中引入该文件。该文件中包含的所有函数都可以在 HTML 文档 body 部分中定义的各种网页元素事件上被调用。在下面的示例中，我们在位于\
    \ js 目录下的单独文件\"demo.js\"中声明了函数 *showAlert()*。\n\n```\nfunction showAlert(){\n\
    \    alert(\"This is an alert from Head section!\");\n}\n```\n\n我们在 HTML 文档的 head\
    \ 部分中引入这个外部 JavaScript 文件，如下所示。\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=\"ISO-8859-1\">\n<title>JS External File</title>\n<script type=\"text/javascript\"\
    \ src=\"js/demo.js\"></script>\n</head>\n<body>\n    <input type=\"button\" onclick=\"\
    showAlert();\" value=\"Call JavaScript\" />\n</body>\n</html>\n```\n\n### 输出\n\
    \n当我们执行上述 HTML 程序时，将得到以下输出。在输出中，我们可以看到一条消息为\"*这是来自 head 部分的警报*\"的警报框，这是在按钮的点击事件上调用的\
    \ JavaScript 函数，该函数定义在外部 demo.js 文件中并被引入到 HTML 文档的 head 部分。这与将 JavaScript 函数代码直接放在\
    \ HTML 文档的 head 部分中效果相同。\n\n# 第 7 章\n\n## JavaScript 变量\n\n**JavaScript 中的数据类型**\n\
    \n支持对数据类型集合进行操作是每种编程语言的特性。这些是在任何编程语言中被定义和操作的实际值。与任何其他编程语言一样，JavaScript 语言允许我们使用以下三种基本数据类型。\n\
    \n*   数字，例如 1、23、10.50、23.8990 等。\n*   字符串或文本数据，例如\"JavaScript\"、\"This is my\
    \ language\"等。\n*   布尔值，它始终只能是 true 或 false。\n\n除了这三种基本数据类型之外，JavaScript 语言还定义了以下两种简单数据类型。每种数据类型只定义一个值。\n\
    \n*   Null。\n*   Undefined。\n\n此外，JavaScript 语言还支持一种称为对象的复合数据类型。JavaScript 对象将在本教程后面详细介绍。\n\
    \n需要注意的是，JavaScript 语言不区分整数值和浮点值。JavaScript 将所有数字都视为浮点值。JavaScript 使用 IEEE 754\
    \ 标准定义的 64 位浮点格式来表示数字。\n\n**JavaScript 中的变量**\n\n如前所述，JavaScript 语言使用变量作为数据容器，我们可以将数据放入这些容器中，然后通过简单地命名容器来引用这些数据。我们使用\
    \ var 关键字声明 JavaScript 变量，如下所示。\n"
