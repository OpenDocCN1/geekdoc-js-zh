    # Chapter 9: JavaScript Decision Making


    While writing a program, most of the time we face a situation where we have to
    make a decision. Decision making is the anticipation of conditions that could
    occur while execution of a program and there is a need to specify some actions
    according to those conditions.


    In a decision making structures, there is a condition which is either a single
    expression or multiple expressions. This condition when evaluated produce either
    TRUE or FALSE as outcome. Based on the outcome, we need to determine which action
    to take and which statements to execute. Refer the figure below to understand
    it clearly.


    Like any other programming language, the JavaScript language supports conditional
    statements which are used to perform different actions based on different conditions.
    The following are the conditional statement supported by the JavaScript language.


    - if statement.

    - if…else statement

    - if…else if… statement.

    - Switch case statement


    Let’s understand these statements with the help of a JavaScript program.


    **if statement** — the *if* statement is a basic control statement which allows
    the JavaScript code to make decisions and execute statements based on required
    condition. The following is the syntax.


    ## Syntax and Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    <title>Basic IF Statement</title>

    </head>

    <body>

    <script type="text/javascript">

    var salary = 10000;

    var expenses = 12000;

    if( expenses > salary ){

    document.write("<b>Please either start earning more or spend less!</b>");

    }

    </script>

    <p>We are inside the body section…</p>

    </body>

    </html>

    ```


    ## Output


    When we execute the above HTML program, the following will be the output. Since
    the condition in the “if” statement is true therefore, it will write the given
    text on the HTML page.


    **if…else statement** – the ‘if…else’ statement is the another form of the control
    statement which allows the JavaScript code to execute statements in a more controlled
    way. The following is syntax and example.


    ## Syntax and Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    <title>If Else Statement</title>

    </head>

    <body>

    <script type="text/javascript">

    var salary = 12000;

    var expenses = 10000;

    if( expenses > salary ){

    document.write("<b>Please either start earning more or spend less!</b>");

    }

    else {

    document.write("<b>You have enough money to spend!</b>");

    }

    </script>

    <p>We are inside the body section...</p>

    </body>

    </html>

    ```


    ## Output


    When we execute the above HTML program, the following will be the output. Since
    the condition in the "if" statement is false therefore, it has entered the else
    block and has written the given text on the HTML page.


    **if...else if... statement** —the *if...else if...* statement is another advanced
    form of *if...else* which allows the JavaScript code to make a correct decision
    out of the defined several conditions. It has the series of if statements in which
    each if is a part of the else clause of the last statement. These Statement(s)
    are executed based on the true condition, if it happens that none of the conditions
    is true, then the code present in the else block will be executed. The following
    is the syntax and example.


    ## Syntax and Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    <title>If Else If Statement</title>

    </head>

    <body>

    <script type="text/javascript">

    var salary = 12000;

    var expenses = 10000;

    if( expenses > salary ){

    document.write("<b>Please either start earning more or spend less!</b>");

    }

    else if (salary > 13000){

    document.write("<b>You have enough money to spend!</b>");

    }

    else {

    document.write("<b>Although you have enough money but you need to be careful!</b>");

    }

    </script>

    <p>We are inside the body section...</p>

    </body>

    </html>

    ```


    ## Output


    When we execute the above HTML program, the following will be the output. Since
    the condition in the “if” statement is false therefore, it has entered the else
    if block where there is another condition that happens to be false. Hence, it
    has written the given text on the HTML page which is present in the last else
    block.


    ## Switch Case Statement


    Starting with the JavaScript 1.2 version, it has started supporting a switch statement
    that handles exactly the situation as implemented by the repeated if…else if statements.


    A switch statement is used to give an expression that evaluate the several different
    statements based on the value of the expression. The JavaScript interpreter inspects
    each case against the return value of the expression until a match is found. If
    no match is found then it uses the default condition.


    Also, there is a *break* statements which is present at the end of a case code
    statement. If break is not declared here, then the interpreter would continue
    executing all the statement in each of the following cases.


    The following is the syntax and example of switch case statement.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    <title>Switch Case Statement</title>

    </head>

    <body>

    <script type="text/javascript">

    var expensecode=''X'';

    document.write("Entering the switch block<br />");

    switch (expensecode)

    {

    case ''X'': document.write("<b>Please either start earning more or spend less!</b>");

    break;


    case ''Y'': document.write("<b>You have enough money to spend!</b>");

    break;


    case ''Z'': document.write("<b>Although you have enough money but you need to
    be careful!</b>");

    break;


    default: document.write("<b>Sorry! You are in deep trouble!</b>");

    }

    </script>

    <p>We are inside the body section...</p>

    </body>

    </html>

    ```'
