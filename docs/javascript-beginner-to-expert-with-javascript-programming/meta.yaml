  md: '# Bitwise Operators


    The following are the bitwise operators which are supported by the JavaScript
    language.


    | S No. | Bitwise Operator | Description | Example |

    | :--- | :--- | :--- | :--- |

    | 1. | & (Bitwise AND) | This operator is used to perform a Boolean AND operation
    on each bit of its integer arguments. | Ex: (X & Y) is 2. |

    | 2. | \| (Bitwise OR) | This operator is used to perform a Boolean OR operation
    on each bit of its integer arguments. | Ex: (X \| Y) is 3. |

    | 3. | ^ (Bitwise XOR) | This operator is used to perform a Boolean exclusive
    OR operation on each bit of its integer arguments. Exclusive OR means that either
    operand one is true or operand two is true, but not both. | Ex: (X ^ Y) is 1.
    |

    | 4. | ~ (Bitwise Not) | Bitwise Not is a unary operator and operates by reversing
    all the bits in the operand. | Ex: (~B) is -4. |

    | 5. | << (Left Shift) | This operator is used move all the bits in its first
    operand to the left by the number of places specified in the second operand. |
    Ex: (X << 1) is 4. |'
