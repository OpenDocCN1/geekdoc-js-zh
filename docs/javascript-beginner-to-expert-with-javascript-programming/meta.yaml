- md: "| 属性 | 类型 | 说明 |\n| :--- | :--- | :--- |\n| **Onstorage** | script | This attribute\
    \ triggers when a document loads. |\n| **Onsubmit** | script | This attribute\
    \ triggers when a form is submitted. |\n| **Onsuspend** | script | This attribute\
    \ triggers when the browser has been fetching media data, but stopped before the\
    \ entire media file was fetched. |\n| **Ontimeupdate** | script | This attribute\
    \ triggers when media changes its playing position. |\n| **Onundo** | script |\
    \ This attribute triggers when a document performs an undo. |\n| **Onunload**\
    \ | script | This attribute triggers when the user leaves the document. |\n| **onvolumechange**\
    \ | script | This attribute triggers when media changes the volume, also when\
    \ volume is set to “mute”. |\n| **Onwaiting** | script | This attribute triggers\
    \ when media has stopped playing, but is expected to resume. |\n\n## The Benefits\
    \ of Early Morning Exercise\n\nExercising early in the morning can have a profound\
    \ impact on your overall well-being. Not only does it kickstart your metabolism,\
    \ but it also helps in establishing a disciplined routine that benefits both mental\
    \ and physical health.\n\n- Boosts energy levels for the day\n- Improves focus\
    \ and mental clarity\n- Encourages better sleep patterns\n- Helps in weight management\n\
    \n> \"Take care of your body. It's the only place you have to live.\" — Jim Rohn\n\
    \n| Time | Activity | Duration |\n| :--- | :--- | :--- |\n| 6:00 AM | Warm-up\
    \ | 10 mins |\n| 6:10 AM | Cardio | 30 mins |\n| 6:40 AM | Cool down | 10 mins\
    \ |\n\nConsistency is key. By committing to a morning routine, you are investing\
    \ in your future self.\n\n# Chapter 13 JavaScript Dialogue Boxes\n\nDialogue boxes\
    \ are used in JavaScript to raise a warning using alert, or ask for a confirmation,\
    \ or to accept an input from the user. To support these features, JavaScript has\
    \ three types of dialogue boxes as follows.\n\n- Alert Dialogue Box\n- Confirmation\
    \ Dialogue Box.\n- Prompt Dialogue Box\n\n## Alert Dialog Box\n\nWhen we want\
    \ to display a warning message to the users in a dialogue box, then we use an\
    \ alert dialogue box. E.g., when we validate a form using onsubmit event there\
    \ we do not accept any input from the user and just need to display a warning\
    \ message, in this case we use an alert box to display such a warning message.\
    \ Alert box just has only one “OK” button to click and proceed.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>On Submit Events</title>\n\
    <script type=\"text/javascript\">\nfunction validation() {\n    if(document.form1.textbox1.value\
    \ != \"\"){ \n        alert(‘Validation Passed’);\n        return false;\n   \
    \ }\n}\n</script>\n</head>\n<body>\n\n<form name=\"form1\" onsubmit=\"return validation()\"\
    >\n    <input type=\"text\" name=\"textbox1\">\n    <input type=\"submit\" value=\"\
    Submit\">\n</form>\n\n</body>\n</html>\n```\n\n```\nelse{\n    alert('Text Box\
    \ field cannot be empty!');\n    return false;\n}\n}\n</script>\n</head>\n<body>\n\
    <form name=\"form1\" method=\"GET\" action=\"onClickEvent.html\" onsubmit=\"return\
    \ validation()\">\n<input type=\"text\" name=\"textbox1\"/>\n<input type=\"submit\"\
    \ value=\"Submit\" />\n</form>\n</body>\n</html>\n```\n\n## Output\n\nWhen we\
    \ execute the above HTML program, the following will be the output. Here, we see\
    \ an alert dialogue box.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_95_0.png)\n\
    \n## Confirmation Dialog Box\n\nIn JavaScript language, a confirmation dialog\
    \ box is used when we need to take user's opinion on any option. It displays a\
    \ dialog box that has two buttons: OK button and Cancel button.\n\nWhen the user\
    \ clicks on the OK button, then the window method \"confirm ()\" will return a\
    \ true value. Otherwise, if the user clicks on the Cancel button, then \"confirm\
    \ ()\" method will returns a false value. The following is an example on the confirmation\
    \ dialogue box.\n\n```\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n<meta charset=\"\
    ISO-8859-1\">\n\n<title>Confirm Box</title>\n\n  <script type=\"text/javascript\"\
    >\n\n      function showAlert(){\n\n            confirm (\"This is an confirm\
    \ dialogue box example!\");\n\n      }\n\n  </script>\n\n</head>\n\n<body>\n\n\
    \  <p>Confirm box demo example.</p>\n\n  <input type=\"button\" onclick=\"showAlert();\"\
    \ value=\"Call JavaScript\"/>\n\n</body>\n\n</html>\n```\n\n## Output\n\nWhen\
    \ we execute the above HTML program, the following will be the output. Here, we\
    \ see a confirmation dialogue box.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_97_0.png)\n\
    \n## Prompt Dialog Box\n\nIn JavaScript language, a prompt dialog box is used\
    \ when we want to pop-up a text box that accepts the user input. Thus, it allows\
    \ the system to interact with the user. The user is required to enter the required\
    \ data into the field and then click on the OK button.\n\nSuch a dialog box is\
    \ displayed by using a method known as **\"prompt ()\"**. It accepts the following\
    \ two parameters.\n\n- A label that we want to display in the text box.\n- A default\
    \ string which is display in the text box.\n\nThe prompt dialog box has the following\
    \ two buttons.\n\n- The OK button.\n- The Cancel button.\n\nWhen the user clicks\
    \ on the OK button, then the window method **\"prompt ()\"** will return the value\
    \ which was entered by the user in the text box. Otherwise, if the user clicks\
    \ on the Cancel button, then the window method **\"prompt ()\"** will return a\
    \ null value.\n\nThe following is an example on the prompt dialogue box.\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Prompt\
    \ Box</title>\n  <script type=\"text/javascript\">\n        function showAlert(){\n\
    \                prompt (\"This is an prompt dialogue box example!\");\n     \
    \   }\n  </script>\n</head>\n<body>\n  <p>Prompt dialogue box demo example.</p>\n\
    \  <input type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"/>\n\
    </body>\n</html>\n```\n\n## Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output. Here, we see a prompt dialogue box.\n\nPrompt\
    \ dialogue box demo example.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_99_0.png)\n\
    \n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_99_1.png)\n\n# Chapter 14 JavaScript\
    \ Void Keyword\n\nIn JavaScript language, the void keyword can be used as a unary\
    \ operator which is appeared before its single operand, and may be of any type.\
    \ This unary operator specifies an expression which is required to be evaluated\
    \ without any return value.\n\nThe following is the syntax and an example of the\
    \ void keyword.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Void Keyword Example 1</title>\n</head>\n<body>\n\t<p>Click here to\
    \ invoke an alert!</p>\n\t<a href=\"javascript:void(alert('Here is the Void Keyword\
    \ demo'))\">Click Here!</a>\n</body>\n</html>\n```\n\n## Output\n\nWhen we execute\
    \ the above HTML program, the following will be the output. Here, we see an alert\
    \ dialogue box that popped out on the click of the responsive hyperlink (“Click\
    \ Here!”). On the other hand, if void argument is empty then we see no response\
    \ as in the case of the second hyperlink (“No response link!”) as the expression\
    \ “0” has no effect in JavaScript. When “0” is evaluated, it does not loads back\
    \ into the current document.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_102_0.png)\n\
    \nAlternatively, the void keyword in JavaScript is also used to generate the undefined\
    \ value as shown in the following example.\n\n```\n<!DOCTYPE html>\n\n<html>\n\
    \n<head>\n\n<meta charset=\"ISO-8859-1\">\n\n<title>Void Example 2</title>\n\n\
    \  <script type=\"text/javascript\">\n\n  function getVoidDemo(){\n\n  var x,y,z;\n\
    \n  x = void ( y = 50, z = 700 );\n\n  document.write('x = ' + x + ' y = ' + y\
    \ +' z = ' + z );\n\n  }\n\n  </script>\n\n</head>\n```\n\n```\n<body>\n    <p>Click\
    \ to get the Result...</p>\n    <form>\n        <input type=\"button\" value=\"\
    Get Result\"\n               onclick=\"getVoidDemo();\" />\n    </form>\n</body>\n\
    </html>\n```\n\n## Output\n\nWhen we execute the above HTML program, the following\
    \ will be the output. Here the value of the ‘x’ variable is undefined, however\
    \ variables ‘y’ and ‘z’ has the value as ‘50’ and ‘700’ respectively.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_103_0.png)"
