    # Variable Scope in JavaScript


    The scope of a variable is defined as the region of the program in which it is
    defined. The JavaScript variables can have the following two scopes.


    +   - **Global Variables scope** – is a global scope which means it can be defined
    anywhere in the JavaScript code and visible everywhere in the current HTML document.

    - **Local Variables scope** – is a local variable which will be visible only within
    a function where it is defined. The function parameters are always local to the
    function.


    This is to be noted that, within the body of a function, if both local and global
    variables are defined with the same name then local variable takes precedence
    over global variable'
