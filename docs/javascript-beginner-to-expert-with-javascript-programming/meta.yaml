  md: "# **Literals in JavaScript**\n\nThe following are the rules for writing literals\
    \ or fixed values in JavaScript.\n\n+   - Numbers are defined with or without\
    \ decimals.\n- Strings are the text that are written within single or double quotes.\n\
    \n# **Variables in JavaScript**\n\nThe following are the rules for writing variable\
    \ values which are used to store data values in JavaScript.\n\n+   - JavaScript\
    \ language uses the *var* keyword to declare the variables.\n- The value to a\
    \ variable is assigned by an equal sign.\n\n# **Operators in JavaScript**\n\n\
    The following are the operators used in JavaScript language.\n\n+   - **Assignment\
    \ operator** (=) is used to assign values to a variable.\n  - **Arithmetic operators**\
    \ (+-* /) are used for arithmetic operations such as addition, subtraction, multiplication,\
    \ and division.\n\n# **Expressions in JavaScript**\n\nAny expression in JavaScript\
    \ language is a combination of values, variables, and operators. These together\
    \ do computation. The computation is called an evaluation.\n\nAn expressions may\
    \ also contain variable values such as numbers and strings. E.g., \"Java\" + \"\
    Script\" will concatenate to \"JavaScript\".\n\nLet's understand this with the\
    \ help of the following example.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=\"ISO-8859-1\">\n```"
