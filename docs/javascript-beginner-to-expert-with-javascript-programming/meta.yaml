  - "[PAGE 68]\n\n**Loop initialization** — it is where we initialize our counter\
    \ value to a starting initial value. This statement is executed before the looping\
    \ begins.\n\n**Test statement** — it has the actual condition which is evaluated\
    \ to be true or false. If this condition evaluates to be true, then the block\
    \ of code inside the loop will be executed, otherwise, if false then the control\
    \ will exit the loop.\n\n**Iteration statement** — it is place where we increase\
    \ or decrease the counter value which was initialized in the first statement.\n\
    \nThe good part of for loop is that we can put all of these three statement parts\
    \ in a single line which is separated by semicolons. The following is the syntax\
    \ and the example.\n\n```\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n<meta charset=\"\
    ISO-8859-1\">\n\n<title>For Loop</title>\n\n</head>\n\n<body>\n\n <script type=\"\
    text/javascript\">\n\n document.write(\"Entering while Loop!\");\n\n for(counter\
    \ = 0;counter < 5; counter++){\n\n document.write(\"Current Counter is : \" +\
    \ counter + \"<br />\");\n\n }\n\n document.write(\"Exiting while Loop!\");\n\n\
    \ </script>\n\n <p>We are inside body section...</p>\n\n</body>\n\n</html>\n```"
