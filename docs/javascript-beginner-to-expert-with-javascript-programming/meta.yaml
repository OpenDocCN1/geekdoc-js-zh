- md: "Usually, all JavaScript statements are ended with a semi-colon. But these semi-colons\
    \ are optional when each of JavaScript statements are placed on a separate line.\
    \ Using the semi-colons at the end of each JavaScript statement is considered\
    \ as a good programming practice.\n\n## Case Sensitivity\nJavaScript language\
    \ is a case sensitive language. It means, the keywords, variables, function names,\
    \ identifiers, etc. should be used with a consistent capitalization of letters.\
    \ E.g. the identifier learn and LEARN are different from the point of view of\
    \ the JavaScript language.\n\n## Comments in JavaScript\nThe following are the\
    \ comment styles which are supported in the JavaScript language.\n\n- Single line\
    \ comment is declared as // (double slash).\n- Multiple line comments is declared\
    \ as /* JavaScript Statements on the multiple line */. It works for single line\
    \ comment as well.\n- It also recognized the HTML comment (opening sequence) <!--.\
    \ JavaScript treats this as a single-line comment as it does with the // comment.\n\
    - The closing sequence --> of HTML is not recognized by JavaScript, Therefore,\
    \ it should be written as //-->.\n\nThe following is an example that covers various\
    \ JavaScript Comments.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>JavaScript Comments</title>\n</head>\n<body>\n <script type=\"\
    text/javascript\">\n  <!-- The opening sequence single line comment.\n       \
    \ The closing sequence HTML comment//-->\n\n  // This is a single line comment.\n\
    \n  /*\n  * This is a multiple line comment in JavaScript\n  */\n </script>\n\
    </body>\n</html>\n```\n\n## Output\nWhen we execute the above HTML program, the\
    \ following will be the output (blank) since JavaScript interpreter has ignored\
    \ all the comments.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_19_0.png)\n\n\
    # Chapter 4\n## JavaScript Syntax\nLike any other programming language, JavaScript\
    \ syntax has certain set of rules in which they are constructed.\n\n### Programs\
    \ in JavaScript\nA JavaScript program is a sequence of instructions which are\
    \ parsed and executed by the browser program. These sequence of program instructions\
    \ are known as statements.\n\n- JavaScript is an objected oriented based programming\
    \ language.\n- JavaScript statements are usually separated by semicolons, however\
    \ placing a semicolon at the end statement is optional.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JavaScript Syntax</title>\n\
    <script type=\"text/javascript\">\n    var a = 101;\n    var b = 300;\n    var\
    \ sum = a + b;\n</script>\n</head>\n<body>\n<script type=\"text/javascript\">\n\
    \    document.write(\"sum of a + b = \"+sum);\n</script>\n</body>\n</html>\n```\n\
    \n### Output\nWhen we execute the above HTML program, the following will be the\
    \ output.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_21_0.png)\n\n### Statements\
    \ in JavaScript\nStatements in JavaScript programming language are composed of\
    \ the following.\n\n- Values\n- Operators\n- Expressions\n- Keywords, and\n- Comments.\n\
    \n### Values in JavaScript\nThe following are the two types of values in JavaScript.\n\
    \n- Fixed values, and\n- Variable values.\n\nLiterals are the fixed values and\
    \ the variable values are known as variables.\n\n### Literals in JavaScript\n\
    The following are the rules for writing literals or fixed values in JavaScript.\n\
    \n- Numbers are defined with or without decimals.\n- Strings are the text that\
    \ are written within single or double quotes.\n\n### Variables in JavaScript\n\
    The following are the rules for writing variable values which are used to store\
    \ data values in JavaScript.\n\n- JavaScript language uses the *var* keyword to\
    \ declare the variables.\n- The value to a variable is assigned by an equal sign.\n\
    \n### Operators in JavaScript\nThe following are the operators used in JavaScript\
    \ language.\n\n- **Assignment operator** (=) is used to assign values to a variable.\n\
    - **Arithmetic operators** (+-* /) are used for arithmetic operations such as\
    \ addition, subtraction, multiplication, and division.\n\n### Expressions in JavaScript\n\
    Any expression in JavaScript language is a combination of values, variables, and\
    \ operators. These together do computation. The computation is called an evaluation.\n\
    \nAn expressions may also contain variable values such as numbers and strings.\
    \ E.g., \"Java\" + \"Script\" will concatenate to \"JavaScript\".\n\nLet's understand\
    \ this with the help of the following example.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>JS Expressions</title>\n\n<script\
    \ type=\"text/javascript\">\n\n    var a = 101; //variable, assignment operator\
    \ and literal as number.\n\n    var b = 300;\n\n    var addition = a + b;\n\n\
    \    var str1 = \"Java\"; //variable, assignment operator and literal as String.\n\
    \n    var str2 = \"Script\";\n\n    var str3 = str1 + str2;\n\n</script>\n\n</head>\n\
    \n<body>\n\n<script type=\"text/javascript\">\n\n    document.write(\"Addition\
    \ of a + b = \"+addition);\n\n    document.write(\"<br>Concat of str1 + str2 =\
    \ \"+str3);\n\n</script>\n\n</body>\n\n</html>\n```\n\n### Output\nWhen we execute\
    \ the above HTML program, the following will be the output. The output shows the\
    \ addition and the concatenation operation.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_24_0.png)\n\
    \n### Keywords in JavaScript\nKeywords in JavaScript language are used to identify\
    \ the actions which are required to be performed. The `var` keyword directs the\
    \ browser to create a new variable as JavaScript Identifiers. In JavaScript language,\
    \ the identifiers are used to name variables (and keywords, and functions, and\
    \ labels).\n\nIn JavaScript language, the first character must be a letter, an\
    \ underscore (_), or a dollar sign ($) always. The subsequent characters may be\
    \ letters, digits, underscores, or dollar signs.\n\n### Camel Case and JavaScript\n\
    There are the following three ways of joining multiple words into one variable\
    \ name.\n\n- **Hyphens** — E.g., first-address, second-address, visa-passport,\
    \ city-name, etc.\n- **Underscore** — E.g., first_address, second_address, visa_passport,\
    \ city_name, etc.\n- **Camel Case** — E.g., FirstAddress, SecondAddress, VisaPassport,\
    \ InterName, etc. In JavaScript programming languages, the camel case often starts\
    \ with a lowercase letter e.g., firstAddress, secondAddress, visaPassport, cityName,\
    \ etc.\n\n### Character Set in JavaScript\nJavaScript language uses the Unicode\
    \ character set and it covers all the characters, punctuations, and symbols.\n\
    \n# Chapter 5\n## JavaScript Enabling and Disabling\nWeb browsers such as Internet\
    \ Explorer, Mozilla Firefox, Google Chrome, Opera, etc. come with built-in support\
    \ for JavaScript. We can enable or disable the browser support for JavaScript\
    \ manually. In this chapter we are going to discuss about the procedure of enabling\
    \ and disabling JavaScript support in these browsers.\n\n### Enabling the JavaScript\
    \ support in Internet Explorer\nThe following are the steps to turn on or enable\
    \ JavaScript support in Internet Explorer.\n\n- Navigate as Tools → Internet Options\
    \ from the menu tab.\n- From the dialog box, select the security tab.\n- Click\
    \ on the Custom Level button.\n- Scroll down the menu and find the scripting option.\n\
    - Select to enable the radio button under the Active scripting caption.\n- Lastly,\
    \ click on the OK button to enable the JavaScript support on IE browser.\n\n###\
    \ Disabling the JavaScript support in Internet Explorer\nTo turn off or disable\
    \ the JavaScript support in Internet Explorer, follow the above steps and select\
    \ to disable the radio button under Active scripting caption.\n\n### Enabling\
    \ the JavaScript support in Mozilla Firefox\nThe following are the steps to turn\
    \ on or enable the JavaScript support in Mozilla Firefox.\n\n- Open a new tab\
    \ and type *about: config* in the address bar.\n- There we will find the following\
    \ warning dialog Select and click on the button as \"I'll be careful, I promise!\"\
    \ as shown below.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_27_0.png)\n\n- Here,\
    \ we will observe the list of configure options in the browser. In the search\
    \ bar, type *javascript.enabled* as shown below.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_27_1.png)\n\
    \n- Here, we can find the option to *enable or disable* the javascript by right-clicking\
    \ on the value of that option select *toggle*.\n- Upon clicking toggle, if the\
    \ *javascript.enabled* is true then it will be converted to false. This will disable\
    \ the JavaScript support to the Mozilla Firefox web browser.\n\n### Disabling\
    \ the JavaScript support in Mozilla Firefox\nThe following are the steps to turn\
    \ off or disable the JavaScript support in Mozilla Firefox. If javascript is disabled\
    \ then it can be enabled upon *clicking toggle*, after following the similar steps\
    \ as explained before.\n\n### Enabling or disabling the JavaScript support in\
    \ Google Chrome\nThe following are the steps to enable or disable the JavaScript\
    \ support in Google Chrome.\n\nClick on the Chrome menu present at the top right\
    \ hand corner of the Chrome"
  mdcn: "\n通常，所有的 JavaScript 语句都以分号结尾。但是，当每个 JavaScript 语句单独放在一行时，这些分号是可选的。在每个 JavaScript\
    \ 语句末尾使用分号被认为是一种良好的编程实践。\n\n## 区分大小写\nJavaScript 语言是一种**区分大小写**的语言。这意味着关键字、变量、函数名、标识符等在使用时应保持字母大小写的一致性。例如，标识符\
    \ learn 和 LEARN 在 JavaScript 语言看来是不同的。\n\n## JavaScript 中的注释\n以下是 JavaScript 语言支持的注释风格。\n\
    \n- 单行注释使用 //（双斜杠）声明。\n- 多行注释使用 /* JavaScript 多行语句 */ 声明。它也适用于单行注释。\n- JavaScript\
    \ 也识别 HTML 注释（开始序列）<!--。JavaScript 将其视为单行注释，就像处理 // 注释一样。\n- HTML 的结束序列 --> 不被\
    \ JavaScript 识别，因此，应写为 //-->。\n\n以下是涵盖各种 JavaScript 注释的示例。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JavaScript Comments</title>\n\
    </head>\n<body>\n <script type=\"text/javascript\">\n  <!-- 开始序列单行注释。\n      \
    \  结束序列 HTML 注释//-->\n\n  // 这是单行注释。\n\n  /*\n  * 这是 JavaScript 中的多行注释\n  */\n\
    \ </script>\n</body>\n</html>\n```\n\n## 输出\n当我们执行上述 HTML 程序时，输出如下（空白），因为 JavaScript\
    \ 解释器已忽略所有注释。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_19_0.png)\n\n# 第 4 章\n\
    ## JavaScript 语法\n与任何其他编程语言一样，JavaScript 语法有一套特定的构建规则。\n\n### JavaScript 中的程序\n\
    JavaScript 程序是一系列由浏览器程序解析和执行的指令。这些程序指令序列称为语句。\n\n- JavaScript 是一种基于对象的编程语言。\n\
    - JavaScript 语句通常用分号分隔，但在语句末尾放置分号是可选的。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>JavaScript Syntax</title>\n<script type=\"\
    text/javascript\">\n    var a = 101;\n    var b = 300;\n    var sum = a + b;\n\
    </script>\n</head>\n<body>\n<script type=\"text/javascript\">\n    document.write(\"\
    sum of a + b = \"+sum);\n</script>\n</body>\n</html>\n```\n\n### 输出\n当我们执行上述 HTML\
    \ 程序时，输出如下。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_21_0.png)\n\n### JavaScript\
    \ 中的语句\nJavaScript 编程语言中的语句由以下部分组成。\n\n- 值\n- 运算符\n- 表达式\n- 关键字，以及\n- 注释。\n\n\
    ### JavaScript 中的值\nJavaScript 中有以下两种类型的值。\n\n- 固定值，以及\n- 变量值。\n\n字面量是固定值，变量值称为变量。\n\
    \n### JavaScript 中的字面量\n以下是 JavaScript 中书写字面量或固定值的规则。\n\n- 数字可以带或不带小数点定义。\n- 字符串是写在单引号或双引号内的文本。\n\
    \n### JavaScript 中的变量\n以下是 JavaScript 中用于存储数据值的变量值书写规则。\n\n- JavaScript 语言使用 *var*\
    \ 关键字来声明变量。\n- 变量的值通过等号赋值。\n\n### JavaScript 中的运算符\n以下是 JavaScript 语言中使用的运算符。\n\
    \n- **赋值运算符**（=）用于给变量赋值。\n- **算术运算符**（+-* /）用于算术运算，如加法、减法、乘法和除法。\n\n### JavaScript\
    \ 中的表达式\nJavaScript 语言中的任何表达式都是值、变量和运算符的组合。这些一起进行计算。这种计算称为求值。\n\n表达式也可以包含变量值，如数字和字符串。例如，\"\
    Java\" + \"Script\" 将连接为 \"JavaScript\"。\n\n让我们通过以下示例来理解这一点。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JS Expressions</title>\n\
    \n<script type=\"text/javascript\">\n\n    var a = 101; //变量、赋值运算符和数字字面量。\n\n\
    \    var b = 300;\n\n    var addition = a + b;\n\n    var str1 = \"Java\"; //变量、赋值运算符和字符串字面量。\n\
    \n    var str2 = \"Script\";\n\n    var str3 = str1 + str2;\n\n</script>\n\n</head>\n\
    \n<body>\n\n<script type=\"text/javascript\">\n\n    document.write(\"Addition\
    \ of a + b = \"+addition);\n\n    document.write(\"<br>Concat of str1 + str2 =\
    \ \"+str3);\n\n</script>\n\n</body>\n\n</html>\n```\n\n### 输出\n当我们执行上述 HTML 程序时，输出如下。输出显示了加法和连接操作。\n\
    \n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_24_0.png)\n\n### JavaScript 中的关键字\n\
    JavaScript 语言中的关键字用于标识需要执行的操作。`var` 关键字指示浏览器创建一个新变量作为 JavaScript 标识符。在 JavaScript\
    \ 语言中，标识符用于命名变量（以及关键字、函数和标签）。\n\n在 JavaScript 语言中，第一个字符必须是字母、下划线（_）或美元符号（$）。后续字符可以是字母、数字、下划线或美元符号。\n\
    \n### 驼峰命名法与 JavaScript\n将多个单词组合成一个变量名有以下三种方式。\n\n- **连字符** — 例如，first-address、second-address、visa-passport、city-name\
    \ 等。\n- **下划线** — 例如，first_address、second_address、visa_passport、city_name 等。\n\
    - **驼峰命名法** — 例如，FirstAddress、SecondAddress、VisaPassport、InterName 等。在 JavaScript\
    \ 编程语言中，驼峰命名法通常以小写字母开头，例如，firstAddress、secondAddress、visaPassport、cityName 等。\n\
    \n### JavaScript 中的字符集\nJavaScript 语言使用 Unicode 字符集，它涵盖了所有字符、标点符号和符号。\n\n# 第 5\
    \ 章\n## JavaScript 的启用和禁用\nInternet Explorer、Mozilla Firefox、Google Chrome、Opera\
    \ 等 Web 浏览器都内置了对 JavaScript 的支持。我们可以手动启用或禁用浏览器对 JavaScript 的支持。在本章中，我们将讨论在这些浏览器中启用和禁用\
    \ JavaScript 支持的操作步骤。\n\n### 在 Internet Explorer 中启用 JavaScript 支持\n以下是在 Internet\
    \ Explorer 中打开或启用 JavaScript 支持的步骤。\n\n- 从菜单栏导航到 工具 → Internet 选项。\n- 在对话框中，选择安全选项卡。\n\
    - 点击自定义级别按钮。\n- 向下滚动菜单并找到脚本选项。\n- 选择在 Active 脚本标题下启用单选按钮。\n- 最后，点击确定按钮以在 IE 浏览器中启用\
    \ JavaScript 支持。\n\n### 在 Internet Explorer 中禁用 JavaScript 支持\n要关闭或禁用 Internet\
    \ Explorer 中的 JavaScript 支持，请按照上述步骤操作，并选择在 Active 脚本标题下禁用单选按钮。\n\n### 在 Mozilla\
    \ Firefox 中启用 JavaScript 支持\n以下是在 Mozilla Firefox 中打开或启用 JavaScript 支持的步骤。\n\n\
    - 打开一个新标签页，在地址栏中输入 *about:config*。\n- 在那里，我们会找到以下警告对话框，选择并点击\"我会小心的，我保证！\"按钮，如下所示。\n\
    \n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_27_0.png)\n\n- 在这里，我们将看到浏览器中的配置选项列表。在搜索栏中，输入\
    \ *javascript.enabled*，如下所示。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_27_1.png)\n\
    \n- 在这里，我们可以通过右键单击该选项的值选择 *切换* 来 *启用或禁用* javascript。\n- 点击切换后，如果 *javascript.enabled*\
    \ 为 true，则它将变为 false。这将禁用 Mozilla Firefox Web 浏览器对 JavaScript 的支持。\n\n### 在 Mozilla\
    \ Firefox 中禁用 JavaScript 支持\n以下是在 Mozilla Firefox 中关闭或禁用 JavaScript 支持的步骤。如果 javascript\
    \ 已禁用，则按照前面解释的类似步骤，在 *点击切换* 后可以启用它。\n\n### 在 Google Chrome 中启用或禁用 JavaScript 支持\n\
    以下是在 Google Chrome 中启用或禁用 JavaScript 支持的步骤。\n\n点击 Chrome 菜单，该菜单位于 Chrome 的右上角\n"
