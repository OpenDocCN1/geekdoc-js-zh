    \ 中，由于它是一种无类型语言，变量可以持有任何数据类型（数字、字符串等）的值。与其他有类型语言（例如 C、C++、JAVA 等）不同，我们在声明变量时无需告诉\
    \ JavaScript 编译器变量将持有何种类型的值。此外，变量的值类型可以在程序执行过程中改变，JavaScript 解析器会自动处理这一点。\n\n\
    ## JavaScript 中的变量作用域\n\n变量的作用域定义为该变量被定义的程序区域。JavaScript 变量可以具有以下两种作用域。\n\n- **全局变量作用域**\
    \ – 是一个全局作用域，意味着它可以在 JavaScript 代码中的任何地方定义，并且在当前 HTML 文档中随处可见。\n- **局部变量作用域**\
    \ – 是一个局部变量，仅在其定义的函数内部可见。函数参数始终是函数的局部变量。\n\n需要注意的是，在函数体内，如果同时定义了同名的局部变量和全局变量，那么局部变量总是优先于全局变量。让我们通过以下示例来最好地理解这个概念。\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>变量作用域</title>\n\
    </head>\n\n<script type = \"text/javascript\">\nvar demoVar = \"global scope\"\
