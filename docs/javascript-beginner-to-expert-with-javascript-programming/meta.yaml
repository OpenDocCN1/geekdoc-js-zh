  md: "# **Confirmation Dialog Box**\n\nIn JavaScript language, a confirmation dialog\
    \ box is used when we need to take user's opinion on any option. It displays a\
    \ dialog box that has two buttons: OK button and Cancel button.\n\nWhen the user\
    \ clicks on the OK button, then the window method \"confirm ()\" will return a\
    \ true value. Otherwise, if the user clicks on the Cancel button, then \"confirm\
    \ ()\" method will returns a false value. The following is an example on the confirmation\
    \ dialogue box.\n\n```\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n<meta charset=\"\
    ISO-8859-1\">\n\n<title>Confirm Box</title>\n\n  <script type=\"text/javascript\"\
    >\n\n      function showAlert(){\n\n            confirm (\"This is an confirm\
    \ dialogue box example!\");\n\n      }\n\n  </script>\n\n</head>\n\n<body>\n\n\
    \  <p>Confirm box demo example.</p>\n\n  <input type=\"button\" onclick=\"showAlert();\"\
    \ value=\"Call JavaScript\"/>\n\n</body>\n\n</html>\n```"
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Output


    When we execute the above HTML program, the following will be the output. Here,
    we see a confirmation dialogue box.


    ![](img/dfdffb2fcf51f543f5686a3b5ebd34db_97_0.png)


    # Prompt Dialog Box


    In JavaScript language, a prompt dialog box is used when we want to pop-up a text
    box that accepts the user input. Thus, it allows the system to interact with the
    user. The user is required to enter the required data into the field and then
    click on the OK button.


    Such a dialog box is displayed by using a method known as **"prompt ()"**. It
    accepts the following two parameters.


    +   - A label that we want to display in the text box.

    - A default string which is display in the text box.


    The prompt dialog box has the following two buttons.


    +   - The OK button.

    - The Cancel button.


    When the user clicks on the OK button, then the window method **"prompt ()"**
    will return the value which was entered by the user in the text box. Otherwise,
    if the user clicks on the Cancel button, then the window method **"prompt ()"**
    will return a null value.


    The following is an example on the prompt dialogue box.'
  merge: -1
  pgno: 97
- img_proc: true
  md: "```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Prompt\
    \ Box</title>\n  <script type=\"text/javascript\">\n        function showAlert(){\n\
    \                prompt (\"This is an prompt dialogue box example!\");\n     \
    \   }\n  </script>\n</head>\n<body>\n  <p>Prompt dialogue box demo example.</p>\n\
    \  <input type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"/>\n\
