    \ >= Y) 为假。 |\n| 6 | <= (小于或等于) | 此运算符用于检查左操作数的值是否小于或等于右操作数的值，如果是，则条件为真。 | 例如：(X\
    \ <= Y) 为真。 |\n\n## 逻辑（或关系）运算符\n\n以下是 JavaScript 语言支持的逻辑或关系运算符。\n\n| 序号 | 逻辑运算符\
    \ | 描述 | 示例 |\n| --- | --- | --- | --- |\n| 1 | && (逻辑与) | 如果两个操作数都非零，则此运算符使条件为真。\
    \ | 例如：(X && Y) 为真。 |\n| 2 | \\|\\| (逻辑或) | 如果两个操作数中任何一个非零，则此运算符使条件为真。 | 例如：(X\
    \ \\|\\| Y) 为真。 |\n| 3 | ! (逻辑非) | 此运算符反转其操作数的逻辑状态。如果条件为真，则逻辑非运算符会将其变为假，反之亦然。\
    \ | 例如：!(X && Y) 为假。 |\n\n## 赋值运算符\n\n以下是 JavaScript 语言支持的赋值运算符。\n\n| 序号 | 赋值运算符\
