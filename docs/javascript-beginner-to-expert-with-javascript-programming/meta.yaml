  md: '# # Chapter 3

    # My First JavaScript Program


    JavaScript is a scripting language that could be injected anywhere on the web
    page between the <script>... </script> HTML tags, however it is always recommended
    to place in head section within <head> ... </head> tags.


    While parsing the markup text (HTML) on the web page, when the browser program
    encounters the <script> tag, it start interpreting all the text present between
    these tags (till </script>) as a script. The script tag accepts the following
    two attributes.


    +   - **Language** this attribute specifies the type of scripting language that
    we are using. Its value is "javascript" for JavaScript language. In the latest
    versions of HTML, this attribute have been phased out.


    - **Type** this attribute indicates the type of scripting language that is in
    use and its value will be set to "text/javascript" for JavaScript language.


    # ### My First JavaScript Program


    In the last chapter, we created an html file (MyFirstJavaScriptProgram.html).
    Let''s use this file to write our first JavaScript program as shown below.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    <title>My First JavaScript Program</title>

    </head>

    <body>

    ```'
  merge: -1
  pgno: 15
- img_proc: true
  md: "```\n<script language=\"javascript\" type=\"text/javascript\">\n    document.write(\"\
    Welcome to JavaScript First Program\");\n</script>\n</body>\n</html>\n```\n\n\
    # Explanation of the JavaScript Code\n\nHere, we have injected the JavaScript\
    \ code between <body> ... </body> tags of the HTML. In the JavaScript code/script,\
    \ we first declared the two attributes as discussed before and then with the help\
    \ of the document object we are writing the message “Welcome to JavaScript First\
    \ Program” on the web page.\n\n# Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_16_0.png)\n\
    \n# Whitespace and Line Breaks\n\nWe can use spaces, tabs, and newlines freely\
    \ in our JavaScript program as these are ignored by browser parser program while\
    \ parsing the JavaScript code. Also, we can freely format and indent our JavaScript\
    \ programs in a tidy way that make the script very easy to maintain, read and\
    \ understand.\n\n# Optional Semicolons"
  merge: -1
