- md: "## Chapter 15\n\n## JavaScript Objects\n\nJavaScript language is an Object\
    \ Oriented Programming (OOP) based language which provides the following capabilities\
    \ of OOPs language to the programmer.\n\n**Encapsulation** – is the concept with\
    \ which we can store all the related information that includes data and methods,\
    \ together in an object.\n\n**Aggregation** – is the concept which enables to\
    \ store one object inside another object.\n\n**Inheritance** – is the concept\
    \ that enables a class to inherit or re-use the properties and the methods of\
    \ another class (or number of classes). It is also known as parent class.\n\n\
    **Polymorphism** – is the concept that enables the programmer to write one function/method\
    \ that execute different task in different ways but defined with the same name.\
    \ Also known as method overloading.\n\n**Objects** — are composed of attributes.\
    \ An attribute can be a function or a property. Function is considered to be a\
    \ method of the object.\n\n## Object Properties in JavaScript\n\nObject properties\
    \ in JavaScript can be of any of the three primitive data types (Number, String\
    \ and Boolean), or any of the abstract data types (such as an object). Object\
    \ properties are the variables which are used internally in the object’s methods.\
    \ They can also be used as globally visible variables therefore, can be used throughout\
    \ the page. The following is the syntax and the example.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Objects Example</title>\n\
    <script type=\"text/javascript\">\n  objectName.objectProperty = propertyValue;\n\
    \  var str = document.title;\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\
    \nHere we are assigning the 'propertyValue' variable value to the object property\
    \ attribute 'objectProperty'. The object is referred with the name as 'objectName'.\n\
    \nIn the next statement of the above example, we are storing the value of the\
    \ document title using the \"title\" property of the document object into \"str\"\
    \ variable.\n\n## Object Methods in JavaScript\n\nObjects Methods are the functions\
    \ with which the object do manipulation or required executions. In JavaScript,\
    \ the function differs from the method in the following way: A function is a standalone\
    \ unit of statements whereas a method is attached to an object that can be referenced\
    \ by the \"this\" keyword.\n\nMethods can be used to display the object contents\
    \ on the HTML page. They can perform a complex mathematical operations on objects\
    \ properties attributes and the input parameters passed to the object method.\
    \ E.g., during this tutorial, we have used the \"write()\" method of the document\
    \ object where we pass the string or text as a parameter to be written on the\
    \ HTML page.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Object Method Example</title>\n<script type=\"text/javascript\">\n \
    \ document.write(\"Welcome to JavaScript Programming!\");\n</script>\n</head>\n\
    <body>\n</body>\n</html>\n```\n\n## User-Defined Objects in JavaScript\n\nIn JavaScript\
    \ language, all the user-defined objects as well as the built-in objects extends\
    \ to an object know as Object (similar to the JAVA language).\n\n## The *new*\
    \ Operator in JavaScript\n\nThe \"*new*\" operator is used for the creation of\
    \ an object instance. In order to create an object in JavaScript, the statement\
    \ has the *new* operator which is followed by the constructor method as shown\
    \ below. Here, the constructor methods are \"*Object ()*\", \"*Array ()*\", and\
    \ \"*Date ()*\". These constructors are the built-in JavaScript functions.\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>The\
    \ New Operator</title>\n<script type=\"text/javascript\">\n  var student = new\
    \ Object();\n  var languages = new Array(\"JavaScript\", \"Pascal\", \"Python\"\
    );\n  var day = new Date(\"August 24, 1989\");\n  alert (day);\n</script>\n</head>\n\
    <body>\n</body>\n</html>\n```\n\n## Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output. Here, we are displaying the properties of\
    \ the Date object on the alert dialogue box.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_107_0.png)\n\
    \n## The \"Object ()\" Constructor\n\nAs discussed before, the constructor is\
    \ a function which creates and initializes a JavaScript object. A special constructor\
    \ function known as \"Object ()\" is used to build the object in JavaScript. The\
    \ value returned by the \"Object ()\" constructor is assigned back to a variable\
    \ known as object reference variable. The following example demonstrates the creation\
    \ of an Object in JavaScript.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=\"ISO-8859-1\">\n<title>Object Creation</title>\n<script type=\"text/javascript\"\
    >\n  var student = new Object();\n  student.name = \"Appy\";\n  student.age =\
    \ \"21\";\n  student.course = \"JavaScript\";\n  function showDetails(){\n   \
    \     alert (\"Name: \"+student.name+ \" Age: \"+student.age+\" Course: \"+student.course);\n\
    \  }\n</script>\n</head>\n<body>\n  <input type=\"button\" onclick=\"showDetails();\"\
    \ value=\"Get Student Details!\" />\n</body>\n</html>\n```\n\nThis is to be noted\
    \ that the object properties variables are not defined with the var keyword.\n\
    \n## Output\n\nWhen we execute the above HTML program, the following will be the\
    \ output.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_109_0.png)\n\n## Defining\
    \ Methods for an Object in JavaScript\n\nIn the last example, we have demonstrated\
    \ to how to use the constructor that creates the object and assigns properties.\
    \ In the following example, we are going to demonstrate an example to define methods\
    \ for an object in JavaScript.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=\"ISO-8859-1\">\n<title>Object Methods</title>\n<script type=\"text/javascript\"\
    >\n   function student(name, course){\n      this.name = name;\n      this.course\
    \  = course;\n   }\n</script>\n```\n\n```javascript\nvar record = new student(\"\
    Appy\", \"JavaScript\");\n\nalert(\"name is : \" + record.name + \"Course is \"\
    + record.course);\n```\n\n## Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output. Here, we have added a function along with\
    \ an object.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_110_0.png)\n\n## The\
    \ 'with' Keyword in JavaScript\n\nIn JavaScript, the 'with' keyword is used as\
    \ a shorthand to refer an object's properties or methods.\n\nHere, the object\
    \ which is specified as an argument to with becomes the default object for the\
    \ duration of the block that follows. In this case, the properties and methods\
    \ for the object can be used without naming the object. The following is the syntax\
    \ and the example.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>With Keyword</title>\n<script type=\"text/javascript\">\n\
    // A function that will work as a method\nfunction addAge(years){\n    with(this){\n\
    \        age = years;\n    }\n}\n\nfunction student(name, course){\n    this.name\
    \ = name;\n    this.course = course;\n    this.age = 0;\n    this.addAge = addAge;\
    \ // Property that is a method.\n}\n</script>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\nvar record = new student(\"Appy\", \"JavaScript\");\nrecord.addAge(21);\n\
    alert(\"Name is : \" + record.name + \"\\nCourse is : \" + record.course +\n \
    \     \"\\nAge is : \" + record.age);\n</script>\n</body>\n</html>\n```\n\n##\
    \ Output\n\nWhen we execute the above HTML program, the following will be the\
    \ output. Here, we have used the 'with' keyword to add the age later by assigning\
    \ a method as a property.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_112_0.png)\n\
    \n## Native Objects in JavaScript\n\nJavaScript language has many built-in or\
    \ native objects. These native objects can be accessed in the program from anywhere\
    \ and they will work in the same way on any type of browser that is operating\
    \ on any type of the operating system. The following are the important JavaScript\
    \ Native Objects.\n\n- JavaScript Array Object.\n- JavaScript Boolean Object.\n\
    - JavaScript Date Object.\n- JavaScript Math Object.\n- JavaScript Number Object.\n\
    - JavaScript RegExp Object.\n- JavaScript String Object.\n\n## Conclusion\n\n\
    Thank you again for downloading this book!\n\nI hope this book was able to help\
    \ you learn JavaScript\n\nThe next step is to put these practices to work for\
    \ you.\n\nThank you and good luck!"
  mdcn: "\n## 第15章\n\n## JavaScript 对象\n\nJavaScript 语言是一种基于**面向对象编程（OOP）**的语言，它为程序员提供了\
    \ OOP 语言的以下能力。\n\n**封装（Encapsulation）**——是一种概念，通过它我们可以将所有相关信息（包括数据和方法）一起存储在一个对象中。\n\
    \n**聚合（Aggregation）**——是一种概念，它使得在一个对象内部存储另一个对象成为可能。\n\n**继承（Inheritance）**——是一种概念，它使得一个类能够继承或重用另一个类（或多个类）的属性和方法。这也被称为父类。\n\
    \n**多态（Polymorphism）**——是一种概念，它使得程序员可以编写一个函数/方法，以相同的名称定义，但在不同的情况下执行不同的任务。也被称为方法重载。\n\
    \n**对象 Mitch**——由属性组成。属性可以是函数或属性。函数被认为 Mitch 的方法。\n\n## JavaScript 中的对象属性\n\n\
    JavaScript 中的对象属性可以是三种原始数据类型（Number、String 和 Boolean）中的任意一种，也可以是抽象数据类型（例如对象）中的任意一种。对象属性是在\
    \ Mitch 方法中内部使用的变量。它们也可以作为全局可见的变量使用，因此可以在整个页面中使用。以下是语法和示例。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Objects Example</title>\n\
    <script type=\"text/javascript\">\n  objectName.objectProperty = propertyValue;\n\
    \  var str = document.title;\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\
    \n在这里，我们将 'propertyValue' 变量的值赋给 Mitch 属性属性 'objectProperty'。该 Mitch 通过名称 'objectName'\
    \ 来引用。\n\n在上一个示例的下一个语句中，我们使用 document Mitch 的 \"title\" 属性将文档标题的值存储到 \"str\" 变量中。\n\
    \n## JavaScript 中的 Mitch 方法\n\nMitch 方法是函数，通过它们，对象可以执行操作或必需的执行。在 JavaScript 中，函数与方法的区别如下：函数是一个独立的语句单元，而方法是附加到\
    \ Mitch 的，可以通过 \"this\" 关键字引用。\n\n方法可以用于在 HTML 页面上显示 Mitch 内容。它们可以对 Mitch 属性属性和传递给\
    \ Mitch 方法的输入参数执行复杂的数学运算。例如，在本教程中，我们使用了 document Mitch 的 \"write()\" 方法，其中我们将字符串或文本作为参数传递给该方法，以便写入\
    \ HTML 页面。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Object Method Example</title>\n<script type=\"text/javascript\">\n \
    \ document.write(\"Welcome to JavaScript Programming!\");\n</script>\n</head>\n\
    <body>\n</body>\n</html>\n```\n\n## JavaScript 中的用户自定义 Mitch 方法\n\n在 JavaScript\
    \ 语言中，所有用户定义的 Mitch 方法以及内置 Mitch 方法都扩展自一个称为 Object 的 Mitch（类似于 JAVA 语言）。\n\n##\
    \ JavaScript 中的 *new* 运算符\n\n\"*new*\" 运算符用于创建 Mitch 实例。为了在 JavaScript 中创建 Mitch\
    \ ，语句中包含 *new* 运算符，其后跟构造方法，如下所示。这里，构造方法是 \"*Object ()*\"、 \"*Array ()*\" 和 \"\
    *Date ()*\"。这些构造函数是内置的 JavaScript 函数。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>The New Operator</title>\n<script type=\"\
    text/javascript\">\n  var student = new Object();\n  var languages = new Array(\"\
    JavaScript\", \"Pascal\", \"Python\");\n  var day = new Date(\"August 24, 1989\"\
    );\n  alert (day);\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n## 输出\n\
    \n当我们执行上述 HTML 程序时，结果如下。这里，我们在警报对话框中显示 Date Mitch 的属性。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_107_0.png)\n\
    \n## \"Object ()\" 构造方法\n\n如前所述，构造方法是一个创建和初始化 JavaScript Mitch 的函数。一个特殊的构造方法 \"\
    Object ()\" 用于在 JavaScript 中构建 Mitch 方法。 \"Object ()\" 构造方法返回的值被赋给一个称为 Mitch 引用变量的变量。以下示例演示了在\
    \ JavaScript 中创建 Mitch 的方法。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=\"ISO-8859-1\">\n<title>Object Creation</title>\n<script type=\"text/javascript\"\
    >\n  var student = new Object();\n  student.name = \"Appy\";\n  student.age =\
    \ \"21\";\n  student.course = \"JavaScript\";\n  function showDetails(){\n   \
    \     alert (\"Name: \"+student.name+ \" Age: \"+student.age+\" Course: \"+student.course);\n\
    \  }\n</script>\n</head>\n<body>\n  <input type=\"button\" onclick=\"showDetails();\"\
    \ value=\"Get Student Details!\" />\n</body>\n</html>\n```\n\n需要注意的是，Mitch 属性变量没有用\
    \ var 关键字定义。\n\n## 输出\n\n当我们执行上述 HTML 程序时，结果如下。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_109_0.png)\n\
    \n## 在 JavaScript 中为 Mitch 方法定义方法\n\n在最后一个示例中，我们演示了如何使用构造方法创建 Mitch 方法并分配属性。在下面的示例中，我们将演示一个在\
    \ JavaScript 中为 Mitch 方法定义方法的示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>Object Methods</title>\n<script type=\"\
    text/javascript\">\n   function student(name, course){\n      this.name = name;\n\
    \      this.course  = course;\n   }\n</script>\n```\n\n```javascript\nvar record\
    \ = new student(\"Appy\", \"JavaScript\");\n\nalert(\"name is : \" + record.name\
    \ + \"Course is \"+ record.course);\n```\n\n## 输出\n\n当我们执行上述 HTML 程序时，结果如下。这里，我们为该\
    \ Mitch 方法添加了一个函数。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_110_0.png)\n\n\
    ## JavaScript 中的 'with' 关键字\n\n在 JavaScript 中，'with' 关键字用作引用 Mitch 属性或方法的简写。\n\
    \n这里，作为参数传递给 with 的 Mitch 方法在随后的代码块期间成为默认对象。在这种情况下，可以 Mitch 方法的属性和方法，而无需命名该 Mitch\
    \ 方法。以下是语法和示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>With Keyword</title>\n<script type=\"text/javascript\">\n// A function\
    \ that will work as a method\nfunction addAge(years){\n    with(this){\n     \
    \   age = years;\n    }\n}\n\nfunction student(name, course){\n    this.name =\
    \ name;\n    this.course = course;\n    this.age = 0;\n    this.addAge = addAge;\
    \ // Property that is a method.\n}\n</script>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\nvar record = new student(\"Appy\", \"JavaScript\");\nrecord.addAge(21);\n\
    alert(\"Name is : \" + record.name + \"\\nCourse is : \" + record.course +\n \
    \     \"\\nAge is : \" + record.age);\n</script>\n</body>\n</html>\n```\n\n##\
    \ 输出\n\n当我们执行上述 HTML 程序时，结果如下。这里，我们使用 'with' 关键字通过将方法作为属性来添加年龄。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_112_0.png)\n\
    \n## JavaScript 中的内置 Mitch 方法\n\nJavaScript 语言有许多内置或原生 Mitch 方法。这些原生 Mitch 方法可以在程序中的任何地方访问，并且它们在任何类型操作系统上运行的任何类型浏览器中都能以相同的方式工作。以下是重要的\
    \ JavaScript 原生 Mitch 方法。\n\n- JavaScript Array 对象。\n- JavaScript Boolean 对象。\n\
    - JavaScript Date 对象。\n- JavaScript Math 对象。\n- JavaScript Number 对象。\n- JavaScript\
    \ RegExp 对象。\n- JavaScript String 对象。\n\n## 结论\n\n再次感谢您下载本书！\n\n我希望这本书能够帮助您学习\
    \ JavaScript。\n\n下一步是将这些实践应用到您的工作中。\n\n祝您好运，谢谢！\n"
