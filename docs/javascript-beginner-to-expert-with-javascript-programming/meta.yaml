    multiple times to perform a number of operations in a program that demands high
    modularity and reusability. It eliminates the need of writing the same piece of
    code again and again and helps the programmers in writing modular codes. With
    the concept of functions, it is possible for a programmer to break a big program
    into a number of small and manageable functions which eventually reduces the redundancy.


    Like any other programming language, the JavaScript language also supports the
    required features to write modular code by using functions. Since the beginning
    of this tutorials, we are using functions like "alert ()" and "write ()" which
    gives us a little hint about the operations of the functions. These functions
    are in-built JavaScript functions. In JavaScript language, we can write our own
    functions like any other programming language that we are going to learn in this
    chapter.


