    \n### onsubmit Event Type\n\nIt is an event type that comes into play while we\
    \ submit a HTML form. We can also put our form validation against this event type.\n\
    \nIn the following example, we are demonstrating how onsubmit event is triggered.\
    \ We can"
  mdcn: "\n## 输出\n\n当我们执行上述 HTML 程序时，输出结果如下。在输出中，我们可以看到计数器的值被打印了 3 次（0、1 和 2），然后循环退出了。这是因为当计数器的值变为\
    \ 3 时，我们执行了 continue 循环控制语句，它将计数器递增到 4，跳过了文档写入部分，并重新检查条件。当计数器的值变为 4 时，我们执行了 break\
    \ 循环控制语句，这将最终退出当前循环，再次跳过文档写入语句。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_73_0.png)\n\
    \n## 第 11 章\n\n### JavaScript 函数\n\n函数可以被定义为一段组织良好、可多次重复使用的代码块，用于执行程序中需要高度模块化和可复用性的多种操作。它消除了反复编写相同代码的需要，帮助程序员编写模块化的代码。借助函数的概念，程序员可以将一个大程序拆分为多个小而易于管理的函数，从而最终减少冗余。\n\
    \n与任何其他编程语言一样，JavaScript 语言也支持通过使用函数来编写模块化代码的必要功能。从本教程开始以来，我们一直在使用 `alert()` 和\
    \ `write()` 等函数，这让我们对函数的操作有了一定的了解。这些函数是 JavaScript 的内置函数。在 JavaScript 语言中，我们可以像其他任何编程语言一样编写自己的函数，我们将在本章中学习这些内容。\n\
    \n### 函数定义\n\n函数可以在代码中的任何位置使用，只需定义一次即可。在 JavaScript 中，我们使用 `function` 关键字来定义函数，后面跟着一个唯一的函数名、一个参数列表（可以为空）以及一个用花括号包围的语句块。以下是\
    \ JavaScript 函数的语法和示例。\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Function Definition</title>\n<script type=\"text/javascript\"\
    >\nfunction sayHelloToJavaScript() {\n    alert(\"Welcome to the world of JavaScript!\"\
    );\n}\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n### 调用函数\n\n我们可以在脚本的后续部分或在\
    \ HTML 网页元素的事件上调用 JavaScript 函数，只需编写该函数的名称即可，如下方代码所示。\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Function Definition</title>\n\
    <script type=\"text/javascript\">\nfunction sayHelloToJavaScript() {\n    alert(\"\
    Welcome to the world of JavaScript!\");\n}\n</script>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n### 输出\n\n当我们执行上述 HTML 程序时，输出结果如下。这里，我们在按钮的点击事件上调用了 JavaScript\
    \ 函数，该函数显示一个提示框，其中的消息来自 HTML 的 head 部分，即 JavaScript 函数定义的位置。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_76_0.png)\n\
    \n### 函数参数\n\n到目前为止，我们使用的函数都没有输入参数。在 JavaScript 函数中，我们可以在调用时传递不同的参数。传递的参数值可以在函数内部使用，我们可以对这些参数进行操作。一个函数可以接受零个到多个参数。函数中的多个参数用逗号分隔。以下是参数化函数的语法和示例。\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Parameterized\
    \ Function</title>\n<script type=\"text/javascript\">\nfunction sayHelloToJavaScript(message,\
    \ entity, lang) {\n    alert(message + \" to the \" + entity + \" world of \"\
    \ + lang + \"!\");\n}\n</script>\n</head>\n<body>\n    <input type=\"button\"\
    \ onclick=\"sayHelloToJavaScript('Welcome', 'World', 'JavaScript');\" value=\"\
    Call JavaScript\"/>\n    <p>Body section of the HTML document.</p>\n</body>\n\
    </html>\n```\n\n### 输出\n\n当我们执行上述 HTML 程序时，输出结果如下。这里，我们在按钮的点击事件上调用了参数化的 JavaScript\
    \ 函数，该函数显示一个提示框，其中的消息来自 HTML 的 head 部分，即 JavaScript 函数定义的位置。这里，我们向函数传递了三个参数，并在提示消息中显示它们。\n\
    \n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_77_0.png)\n\n### return 语句\n\nJavaScript\
    \ 函数可以返回一个值，而 return 语句是可选的。当我们想从函数中返回一个值时，可以使用 return 语句。它应该是 JavaScript 函数中的最后一条语句。让我们通过以下示例来理解\
    \ return 函数的用法。\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Return Function</title>\n<script type=\"text/javascript\">\nfunction\
    \ concatString(message, entity, lang) {\n    var str = message + entity + lang;\n\
    \    return str;\n}\nfunction writeToDoc(message, entity, lang) {\n    concatStr\
    \ = concatString(message, entity, lang);\n    document.write(concatStr);\n}\n\
    </script>\n</head>\n<body>\n<input type=\"button\" onclick=\"writeToDoc('Welcome\
    \ to the', 'World of', 'JavaScript!');\" value=\"Call JavaScript\"/>\n<p>Body\
    \ section of the HTML document.</p>\n</body>\n</html>\n```\n\n### 输出\n\n当我们执行上述\
    \ HTML 程序时，输出结果如下。这里，我们在按钮的点击事件上调用了 JavaScript 函数，该函数在 HTML 页面上显示消息，消息来自 HTML\
    \ 的 head 部分，即 JavaScript 函数定义的位置。这里，我们向 \"writeToDoc\" 函数传递了三个字符串作为参数，该函数调用了 \"\
    concatString\" 函数，后者返回拼接后的字符串并写入文档。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_79_0.png)\n\
    \n## 第 12 章\n\n### JavaScript 事件\n\nJavaScript 事件是 JavaScript 与 HTML 文档进行交互的方式。当\
    \ HTML 页面上的任何值被用户或浏览器操作时，这些事件就会被触发。例如，当我们加载一个 HTML 页面时，这就是一个事件。同样，当我们点击页面上的按钮时，这也是一个事件。我们还可以想到其他事件的例子，如按下任意键、通过按钮提交表单、更改窗口大小等。\n\
    \n程序员可以使用这些 JavaScript 事件来触发和执行 JavaScript 编写的响应代码。这些响应包括在按钮点击时关闭窗口、向用户显示提示消息、验证表单数据等。\n\
    \nJavaScript 事件是文档对象模型（DOM）第 3 级的一部分。所有 HTML 网页元素都包含一组能够触发 JavaScript 函数代码的事件。\n\
    \n以下是几个示例，用于理解事件与调用 JavaScript 函数代码之间的关系。\n\n#### onclick 事件类型\n\n这是最常用的事件类型，当我们在\
    \ HTML 页面或网页元素上用鼠标左键点击按钮时，它会触发 JavaScript 代码。我们可以针对此事件类型设置验证等操作。以下示例演示了此事件。\n\n\
