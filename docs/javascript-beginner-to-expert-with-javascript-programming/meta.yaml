    \ affiliated with this document.\n\n## Table of Contents\n\n1. Introduction\n\
    2. Chapter 1 Intro to JavaScript Programming\n3. Chapter 2 Development IDE Setup\n\
    4. Chapter 3 My First JavaScript Program\n5. Chapter 4 JavaScript Syntax\n6. Chapter\
    \ 5 JavaScript Enabling and Disabling\n7. Chapter 6 JavaScript Placement\n8. Chapter\
    \ 7 JavaScript Variables\n9. Chapter 8 JavaScript Operators\n10. Chapter 9 JavaScript\
    \ Decision Making\n11. Chapter 10 JavaScript Loops\n12. Chapter 11 JavaScript\
    \ Functions\n13. Chapter 12 JavaScript Events\n14. Chapter 13 Dialogue Boxes\n\
    15. Chapter 14 JavaScript Void Keyword\n16. Chapter 15 JavaScript Objects\n17.\
    \ Conclusion\n\n---\n\n## Chapter 1\n\n## Introduction to JavaScript Programming\
    \ Language\n\nWelcome to the world of JavaScript, invented in 1995 by Brendan\
    \ Eich it is still the most commonly used scripting language around today. It\
    \ is high level, interpreted, cross platform and an open source programming language.\
    \ In this tutorial series, we are going to learn JavaScript with practical examples.\
    \ Before we dive in, let's go over some of the basics.\n\nJavaScript is an OOP\
    \ scripting language which mainly used in Web programming. It is responsible for\
    \ making web pages interactive; in simple words \"it tells web page what to perform\"\
    . Like HTML defines the contents of the web page and CSS defines the layout, JavaScript\
    \ make that web page work properly. JavaScript programs are the set of instructions\
    \ which are executed in the order they are written so while coding, we should\
    \ take care of the logical sequence. Do not get confused between Java and JavaScript,\
    \ they both are technically different languages in respect of their design, however\
    \ their standard libraries and syntaxes are same.\n\nNow, let's learn how to install\
    \ this amazing language on your computer and write our first JavaScript program.\n\
    \n## Chapter 2\n\n## Development IDE Setup\n\nWe are going to use eclipse as development\
    \ IDE throughout this tutorials for explaining JavaScript program examples practically.\
    \ The following are the steps to install eclipse and set up development environment\
    \ for JavaScript.\n\nPlease follow the below steps:\n\n1. Download the eclipse\
    \ from below link. Choose the latest stable version of the eclipse and make sure\
    \ that if your machine is 64-bit then choose 64-bit eclipse. In this tutorial,\
    \ eclipse MARS.1 version is used.\n\n   https://eclipse.org/downloads\n\n2. Click\
    \ on the eclipse.exe to open the eclipse which will ask to choose a local directory\
    \ as its workspace as shown in the below screenshot.\n\n3. Choose or create a\
    \ directory on any available drive and click on the OK button to start eclipse.\n\
    \n4. On the eclipse navigate as File -> New -> Static Web Project. Click on the\
    \ link as shown below.\n\n5. It will open up a dialogue box that will ask you\
    \ to enter the name of the project. Please enter the project name and click on\
    \ the 'Finish' button as shown below.\n\n6. On the left hand side of Eclipse (project\
    \ explorer), expand the project directory and right click on the 'WebContent'\
    \ folder. To add a HTML file in the current project navigate as New -> HTML File\
    \ as shown below.\n\n7. It will open up a dialogue box that will ask you to enter\
    \ the file name. Please enter the file name and click on the 'Finish' button as\
    \ shown below. This will add up an HTML file to the current static web project.\n\
    \nAt this point, you have successfully completed the development setup for JavaScript\
    \ programming. In the next chapter, we are going to develop our first JavaScript\
    \ program using this setup.\n\n## Chapter 3\n\n## My First JavaScript Program\n\
    \nJavaScript is a scripting language that could be injected anywhere on the web\
    \ page between the `<script>...</script>` HTML tags, however it is always recommended\
    \ to place in head section within `<head>...</head>` tags.\n\nWhile parsing the\
    \ markup text (HTML) on the web page, when the browser program encounters the\
    \ `<script>` tag, it start interpreting all the text present between these tags\
    \ (till `</script>`) as a script. The script tag accepts the following two attributes.\n\
    \n- **Language** this attribute specifies the type of scripting language that\
    \ we are using. Its value is \"javascript\" for JavaScript language. In the latest\
    \ versions of HTML, this attribute have been phased out.\n\n- **Type** this attribute\
    \ indicates the type of scripting language that is in use and its value will be\
    \ set to \"text/javascript\" for JavaScript language.\n\n### My First JavaScript\
    \ Program\n\nIn the last chapter, we created an html file (MyFirstJavaScriptProgram.html).\
    \ Let's use this file to write our first JavaScript program as shown below.\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>My\
    \ First JavaScript Program</title>\n</head>\n<body>\n<script language=\"javascript\"\
    \ type=\"text/javascript\">\n    document.write(\"Welcome to JavaScript First\
    \ Program\");\n</script>\n</body>\n</html>\n```\n\n## Explanation of the JavaScript\
    \ Code\n\nHere, we have injected the JavaScript code between `<body>...</body>`\
    \ tags of the HTML. In the JavaScript code/script, we first declared the two attributes\
    \ as discussed before and then with the help of the document object we are writing\
    \ the message \"Welcome to JavaScript First Program\" on the web page.\n\n## Output\n\
    \nWhen we execute the above HTML program, the following will be the output.\n\n\
    ## Whitespace and Line Breaks\n\nWe can use spaces, tabs, and newlines freely\
    \ in our JavaScript program as these are ignored by browser parser program while\
    \ parsing the JavaScript code. Also, we can freely format and indent our JavaScript\
    \ programs in a tidy way that make the script very easy to maintain, read and\
    \ understand.\n\n## Optional Semicolons"
