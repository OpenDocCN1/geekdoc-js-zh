    # Chapter 10 JavaScript Loops


    When any program is executed, it runs sequentially. The statement which appears
    first in the sequence is executed first then the next statement and so on till
    the last statement of the program. Many times there is a requirement to run same
    block of code in a program multiple times then there arises a need of a control
    structure known as loops.


    A loop makes a statement or group of statements in a block of code to execute
    multiple times if the condition is true and exits the loop when the condition
    becomes false. Such loop is illustrated in the below diagram.


    ![](img/dfdffb2fcf51f543f5686a3b5ebd34db_64_0.png)


    Like any other programming language, the JavaScript support looping and the following
    types of loops and the loop control statements.


    +   - While loop

    - Do…while loop

    - For loop'
  - "[PAGE 65]\n\n+   - for...in loop\n- Loop control statements\n\n# ### While loop\
    \ statement\n\nWhile loop is the most basic loop in JavaScript language. This\
    \ loop execute a statement or piece of code block repeatedly as long as an expression\
    \ is held true. The loop terminates, once the expression is false. The following\
    \ is the syntax and the example of while loop statement.\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>While Loop</title>\n</head>\n\
    <body>\n  <script type=\"text/javascript\">\n    var counter = 0;\n    document.write(\"\
