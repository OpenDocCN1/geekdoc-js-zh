    \n respective 作者拥有出版者未持有的所有版权。\n\n本文信息仅供参考，具有普遍适用性。信息的呈现不含任何合同或任何形式的保证承诺。\n\n\
    所使用的商标未经任何同意，商标的出版未经商标所有者的许可或支持。本书中的所有商标和品牌仅用于说明目的，归各自所有者所有，与本文档无关。\n\n## 目录\n\
    \n1. 引言\n2. 第 1 章 JavaScript 编程简介\n3. 第 2 章 开发环境 IDE 搭建\n4. 第 3 章 我的第一个 JavaScript\
    \ 程序\n5. 第 4 章 JavaScript 语法\n6. 第 5 章 JavaScript 的启用与禁用\n7. 第 6 章 JavaScript\
    \ 放置位置\n8. 第 7 章 JavaScript 变量\n9. 第 8 章 JavaScript 运算符\n10. 第 9 章 JavaScript\
    \ 条件判断\n11. 第 10 章 JavaScript 循环\n12. 第 11 章 JavaScript 函数\n13. 第 12 章 JavaScript\
    \ 事件\n14. 第 13 章 对话框\n15. 第 14 章 JavaScript void 关键字\n16. 第 15 章 JavaScript 对象\n\
    17. 总结\n\n---\n\n## 第 1 章\n\n## JavaScript 编程语言简介\n\n欢迎来到 JavaScript 的世界。JavaScript\
    \ 由 Brendan Eich 于 1995 年发明，至今仍是最常用的脚本语言。它是一种高级的、解释型的、跨平台的开源编程语言。在本系列教程中，我们将通过实际示例来学习\
    \ JavaScript。在深入学习之前，让我们先了解一些基础知识。\n\nJavaScript 是一种面向对象的脚本语言，主要用于 Web 编程。它负责使网页具有交互性；简单来说，它\"\
    告诉网页该做什么\"。就像 HTML 定义网页的内容，CSS 定义网页的布局一样，JavaScript 让网页能够正常运作。JavaScript 程序是由一系列指令组成的，这些指令按照编写顺序依次执行，因此在编码时，我们应注意逻辑顺序。不要将\
    \ Java 和 JavaScript 混淆，它们在设计上是两种完全不同的语言，但它们的标准库和语法是相同的。\n\n现在，让我们学习如何在计算机上安装这门令人惊叹的语言，并编写我们的第一个\
    \ JavaScript 程序。\n\n## 第 2 章\n\n## 开发环境 IDE 搭建\n\n在本教程中，我们将使用 Eclipse 作为开发 IDE\
    \ 来实际讲解 JavaScript 程序示例。以下是安装 Eclipse 并搭建 JavaScript 开发环境的步骤。\n\n请按照以下步骤操作：\n\n\
    1. 从以下链接下载 Eclipse。选择最新的稳定版本，并确保如果你的机器是 64 位的，则选择 64 位的 Eclipse。本教程中使用的是 Eclipse\
    \ MARS.1 版本。\n\n   https://eclipse.org/downloads\n\n2. 点击 eclipse.exe 打开 Eclipse，系统会要求你选择一个本地目录作为工作空间，如下图所示。\n\
    \n3. 选择或创建一个目录于任意可用磁盘上，然后点击\"确定\"按钮启动 Eclipse。\n\n4. 在 Eclipse 中导航至 File -> New\
    \ -> Static Web Project。如下图所示点击相应链接。\n\n5. 将弹出一个对话框，要求你输入项目名称。请输入项目名称并点击\"Finish\"\
    按钮，如下图所示。\n\n6. 在 Eclipse 左侧（项目资源管理器）中，展开项目目录，右键点击\"WebContent\"文件夹。要在当前项目中添加\
    \ HTML 文件，请导航至 New -> HTML File，如下图所示。\n\n7. 将弹出一个对话框，要求你输入文件名。请输入文件名并点击\"Finish\"\
    按钮，如下图所示。这将在当前静态 Web 项目中添加一个 HTML 文件。\n\n至此，你已成功完成了 JavaScript 编程的开发环境搭建。在下一章中，我们将使用此环境开发我们的第一个\
    \ JavaScript 程序。\n\n## 第 3 章\n\n## 我的第一个 JavaScript 程序\n\nJavaScript 是一种脚本语言，可以注入到网页中\
    \ `<script>...</script>` HTML 标签之间的任何位置，但通常建议将其放置在 `<head>...</head>` 标签内的 head\
    \ 部分。\n\n在解析网页上的标记文本（HTML）时，当浏览器程序遇到 `<script>` 标签时，它会开始将这些标签之间的所有文本（直到 `</script>`）解释为脚本。script\
    \ 标签接受以下两个属性。\n\n- **Language** 该属性指定我们使用的脚本语言类型。对于 JavaScript 语言，其值为 \"javascript\"\
    。在最新版本的 HTML 中，该属性已被淘汰。\n\n- **Type** 该属性指示所使用的脚本语言类型，对于 JavaScript 语言，其值设置为 \"\
    text/javascript\"。\n\n### 我的第一个 JavaScript 程序\n\n在上一章中，我们创建了一个 HTML 文件（MyFirstJavaScriptProgram.html）。让我们使用这个文件来编写我们的第一个\
    \ JavaScript 程序，如下所示。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>My First JavaScript Program</title>\n</head>\n<body>\n<script\
    \ language=\"javascript\" type=\"text/javascript\">\n    document.write(\"Welcome\
    \ to JavaScript First Program\");\n</script>\n</body>\n</html>\n```\n\n## JavaScript\
    \ 代码解析\n\n在这里，我们将 JavaScript 代码注入到 HTML 的 `<body>...</body>` 标签之间。在 JavaScript\
    \ 代码/脚本中，我们首先声明了前面讨论的两个属性，然后借助 document 对象在网页上输出消息 \"Welcome to JavaScript First\
    \ Program\"。\n\n## 输出结果\n\n当我们执行上述 HTML 程序时，输出结果如下。\n\n## 空白与换行\n\n我们可以在 JavaScript\
    \ 程序中自由使用空格、制表符和换行符，因为浏览器解析程序在解析 JavaScript 代码时会忽略这些空白字符。同时，我们可以自由地格式化和缩进 JavaScript\
    \ 程序，使其整洁有序，从而使脚本更易于维护、阅读和理解。\n\n## 可选分号\n"
