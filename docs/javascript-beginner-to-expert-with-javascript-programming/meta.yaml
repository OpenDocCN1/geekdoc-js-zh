    # The ''with'' Keyword in JavaScript


    In JavaScript, the ''with'' keyword is used as a shorthand to refer an object''s
    properties or methods.


    Here, the object which is specified as an argument to with becomes the default
    object for the duration of the block that follows. In this case, the properties
    and methods for the object can be used without naming the object. The following
    is the syntax and the example.'
