    \n# 第 13 章 JavaScript 对话框\n\n对话框在 JavaScript 中用于通过 alert 发出警告，或者请求确认，亦或接受用户输入。为了支持这些功能，JavaScript\
    \ 有以下三种类型的对话框。\n\n- 警告对话框\n- 确认对话框\n- 提示对话框\n\n## 警告对话框\n\n当我们想在对话框中向用户显示警告消息时，我们使用警告对话框。例如，当我们使用\
    \ onsubmit 事件验证表单时，我们不接受用户的任何输入，只需要显示一条警告消息，在这种情况下我们使用警告框来显示此类警告消息。警告框只有一个\"确定\"\
    按钮可以点击并继续。\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>On Submit Events</title>\n<script type=\"text/javascript\">\nfunction\
    \ validation() {\n    if(document.form1.textbox1.value != \"\"){ \n        alert('Validation\
    \ Passed');\n        return false;\n    }\n}\n</script>\n</head>\n<body>\n\n<form\
    \ name=\"form1\" onsubmit=\"return validation()\">\n    <input type=\"text\" name=\"\
    textbox1\">\n    <input type=\"submit\" value=\"Submit\">\n</form>\n\n</body>\n\
    </html>\n```\n\n```\nelse{\n    alert('Text Box field cannot be empty!');\n  \
    \  return false;\n}\n}\n</script>\n</head>\n<body>\n<form name=\"form1\" method=\"\
    GET\" action=\"onClickEvent.html\" onsubmit=\"return validation()\">\n<input type=\"\
    text\" name=\"textbox1\"/>\n<input type=\"submit\" value=\"Submit\" />\n</form>\n\
    </body>\n</html>\n```\n\n## 输出\n\n当我们执行上述 HTML 程序时，输出结果如下。这里我们可以看到一个警告对话框。\n\n\
    ![](img/dfdffb2fcf51f543f5686a3b5ebd34db_95_0.png)\n\n## 确认对话框\n\n在 JavaScript\
    \ 语言中，当我们需要就某个选项征求用户意见时，会使用确认对话框。它显示一个包含两个按钮的对话框：确定按钮和取消按钮。\n\n当用户点击确定按钮时，窗口方法\
    \ `confirm()` 将返回一个 true 值。否则，如果用户点击取消按钮，则 `confirm()` 方法将返回一个 false 值。以下是确认对话框的示例。\n\
    \n```\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n<meta charset=\"ISO-8859-1\">\n\n\
    <title>Confirm Box</title>\n\n  <script type=\"text/javascript\">\n\n      function\
    \ showAlert(){\n\n            confirm (\"This is an confirm dialogue box example!\"\
    );\n\n      }\n\n  </script>\n\n</head>\n\n<body>\n\n  <p>Confirm box demo example.</p>\n\
    \n  <input type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"\
    />\n\n</body>\n\n</html>\n```\n\n## 输出\n\n当我们执行上述 HTML 程序时，输出结果如下。这里我们可以看到一个确认对话框。\n\
    \n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_97_0.png)\n\n## 提示对话框\n\n在 JavaScript\
    \ 语言中，当我们想要弹出一个接受用户输入的文本框时，会使用提示对话框。因此，它允许系统与用户进行交互。用户需要在字段中输入所需数据，然后点击确定按钮。\n\
    \n此类对话框通过使用名为 **\"prompt()\"** 的方法来显示。它接受以下两个参数。\n\n- 我们想要在文本框中显示的标签。\n- 显示在文本框中的默认字符串。\n\
    \n提示对话框有以下两个按钮。\n\n- 确定按钮。\n- 取消按钮。\n\n当用户点击确定按钮时，窗口方法 **\"prompt()\"** 将返回用户在文本框中输入的值。否则，如果用户点击取消按钮，则窗口方法\
    \ **\"prompt()\"** 将返回一个 null 值。\n\n以下是提示对话框的示例。\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>Prompt Box</title>\n  <script type=\"\
    text/javascript\">\n        function showAlert(){\n                prompt (\"\
    This is an prompt dialogue box example!\");\n        }\n  </script>\n</head>\n\
    <body>\n  <p>Prompt dialogue box demo example.</p>\n  <input type=\"button\" onclick=\"\
    showAlert();\" value=\"Call JavaScript\"/>\n</body>\n</html>\n```\n\n## 输出\n\n\
    当我们执行上述 HTML 程序时，输出结果如下。这里我们可以看到一个提示对话框。\n\n提示对话框演示示例。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_99_0.png)\n\
    \n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_99_1.png)\n\n# 第 14 章 JavaScript void\
    \ 关键字\n\n在 JavaScript 语言中，void 关键字可以用作一元运算符，它出现在其唯一操作数之前，操作数可以是任何类型。此一元运算符指定一个需要被求值但不返回任何值的表达式。\n\
    \n以下是 void 关键字的语法和示例。\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Void Keyword Example 1</title>\n</head>\n<body>\n\t<p>Click\
    \ here to invoke an alert!</p>\n\t<a href=\"javascript:void(alert('Here is the\
    \ Void Keyword demo'))\">Click Here!</a>\n</body>\n</html>\n```\n\n## 输出\n\n当我们执行上述\
    \ HTML 程序时，输出结果如下。这里我们可以看到，点击响应式超链接（\"Click Here!\"）后弹出了一个警告对话框。另一方面，如果 void 参数为空，如第二个超链接（\"\
    No response link!\"）的情况，我们不会看到任何响应，因为表达式\"0\"在 JavaScript 中没有任何作用。当\"0\"被求值时，它不会重新加载到当前文档中。\n\
    \n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_102_0.png)\n\n另外，JavaScript 中的 void\
    \ 关键字也用于生成 undefined 值，如下例所示。\n\n```\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n\
    <meta charset=\"ISO-8859-1\">\n\n<title>Void Example 2</title>\n\n  <script type=\"\
    text/javascript\">\n\n  function getVoidDemo(){\n\n  var x,y,z;\n\n  x = void\
    \ ( y = 50, z = 700 );\n\n  document.write('x = ' + x + ' y = ' + y +' z = ' +\
    \ z );\n\n  }\n\n  </script>\n\n</head>\n```\n\n```\n<body>\n    <p>Click to get\
    \ the Result...</p>\n    <form>\n        <input type=\"button\" value=\"Get Result\"\
    \n               onclick=\"getVoidDemo();\" />\n    </form>\n</body>\n</html>\n\
    ```\n\n## 输出\n\n当我们执行上述 HTML 程序时，输出结果如下。这里变量 'x' 的值为 undefined，而变量 'y' 和 'z' 的值分别为\
    \ '50' 和 '700'。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_103_0.png)\n"
