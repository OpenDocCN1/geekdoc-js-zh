    \n## JavaScript 中的变量名\n\n在 JavaScript 语言中命名变量时应遵守以下规则。\n\n- 不得使用保留关键字作为变量名。这些关键字在本章的最后一节中列出。例如，*finally*、*goto*\
    \ 等变量名是无效的。\n- JavaScript 语言中的变量名绝不能以数字（0-9）开头。但是，它们可以以字母或下划线字符开头。例如，*10name*\
    \ 是一个无效的变量名，而 *_10name* 是一个有效的变量名。\n- JavaScript 中的变量名区分大小写。例如，*Address* 和 *address*\
    \ 在 JavaScript 语言中被视为两个不同的变量名。\n\n## JavaScript 中的保留字\n\n以下是 JavaScript 语言中所有保留字的列表。这些保留字不能用作\
    \ JavaScript 变量、循环标签、函数或任何对象名。\n\n| abstract | debugger | final | instanceof |\
    \ public |\n| --- | --- | --- | --- | --- |\n| boolean | default | finally | int\
    \ | return |\n| break | delete | float | interface | short |\n| byte | do | for\
    \ | long | static |\n| case | double | function | native | super |\n| catch |\
    \ else | goto | new | switch |\n| char | enum | if | null | synchronized |\n|\
    \ class | export | implements | package | this |\n| const | extends | import |\
