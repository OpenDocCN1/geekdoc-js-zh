- img_proc: true
  md: 'Usually, all JavaScript statements are ended with a semi-colon. But these semi-colons
    are optional when each of JavaScript statements are placed on a separate line.
    Using the semi-colons at the end of each JavaScript statement is considered as
    a good programming practice.


    # Case Sensitivity


    JavaScript language is a case sensitive language. It means, the keywords, variables,
    function names, identifiers, etc. should be used with a consistent capitalization
    of letters. E.g. the identifier learn and LEARN are different from the point of
    view of the JavaScript language.


    # Comments in JavaScript


    The following are the comment styles which are supported in the JavaScript language.


    +   - Single line comment is declared as // (double slash).

    - Multiple line comments is declared as /* JavaScript Statements on the multiple
    line */. It works for single line comment as well.

    - It also recognized the HTML comment (opening sequence) <!--. JavaScript treats
    this as a single-line comment as it does with the // comment.

    - The closing sequence --> of HTML is not recognized by JavaScript, Therefore,
    it should be written as //-->.'
  merge: -1
  pgno: 17
