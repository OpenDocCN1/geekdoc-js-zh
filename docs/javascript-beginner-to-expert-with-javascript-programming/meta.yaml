  md: '# Chapter 5


    # JavaScript Enabling and Disabling


    Web browsers such as Internet Explorer, Mozilla Firefox, Google Chrome, Opera,
    etc. come with built-in support for JavaScript. We can enable or disable the browser
    support for JavaScript manually. In this chapter we are going to discuss about
    the procedure of enabling and disabling JavaScript support in these browsers.


    # Enabling the JavaScript support in Internet Explorer


    The following are the steps to turn on or enable JavaScript support in Internet
    Explorer.


    +   Navigate as Tools → Internet Options from the menu tab.


    +   From the dialog box, select the security tab.


    +   Click on the Custom Level button.


    +   Scroll down the menu and find the scripting option.


    +   Select to enable the radio button under the Active scripting caption.


    +   Lastly, click on the OK button to enable the JavaScript support on IE browser.


    # Disabling the JavaScript support in Internet Explorer


    To turn off or disable the JavaScript support in Internet Explorer, follow the
    above steps and select to disable the radio button under Active scripting caption.


    # Enabling the JavaScript support in Mozilla Firefox


    The following are the steps to turn on or enable the JavaScript support in Mozilla
    Firefox.


    +   Open a new tab and type *about: config* in the address bar.


    There we will find the following warning dialog Select and click on the button'
