    ## Python 编程概览


    ## 第1章


    ### Python 编程语言简介


    你知道像 YouTube 和 Dropbox 这样的网站在其源代码中使用了 Python 吗？Python 是一门内容丰富且易于理解和应用的语言。使用 Python
    几乎可以开发任何东西。除 Windows 外，大多数操作系统（Mac、Linux、UNIX 等）默认都安装了 Python。它是一门开源的免费语言。在这本电子书里，我们将学习这门出色的编程语言，并通过各种实例来应用它。Python
    中没有类型声明的方法、参数、函数或变量（不像其他语言），这使得其代码简洁明了。如前所述，这门语言可用于方方面面，无论是构建网站、游戏还是搜索引擎。使用 Python
    的主要优势在于你不必显式运行编译器，它像 Perl 或 Shell 一样是一门纯粹的解释型语言。


    Python 源文件使用的文件扩展名为"..py"，并且它是一门大小写敏感的语言，因此"P"和"p"会被视为两个不同的变量。此外，Python 会自动判断变量的类型，例如，如果你设置
    x=4 和 y=''Python''，它会将 x 视为整数，将 y 视为字符串。我们将在后续章节中详细学习所有这些基础知识。在继续之前，有一些重要的要点需要记住：


    1. 赋值使用"="，比较使用"=="。例如，x=4，y=8，x==y

    2. "print"用于打印结果。

    3. 所有数学运算如 +、-、*、/、% 都用于数字。

    4. 当给变量赋值时，变量就被创建了。例如，a=5 会创建一个名为"a"的变量，其整数值为 5。无需事先定义它。

    5. "+"也可以用来连接两个字符串。例如，z="Hi"，z=z+"Python"

    6. 逻辑运算使用"and"、"or"、"not"，而不是符号。


    有三种基本数据类型：整数（数字默认类型）、浮点数（a=3.125）和字符串。字符串可以通过""（双引号）或单引号（''''）来定义。我们将在接下来的章节中通过具体的示例来了解所有数据类型。


    下面来看看在 Windows 操作系统上安装 Python 的分步指南。如前所述，如果你使用的是 UNIX 或 Linux 或 Mac 等其他操作系统，Python
    应该已经安装好并可以使用了。在 Linux 上你需要使用"%python"来获取详细信息，按"CTRL + D"退出。在 UNIX 上运行则使用"%python
    filename.py"。Python 以三个"大于号"符号（>>>）作为提示符。


    [点击此处在 Amazon 上查看 Python 编程的其余内容。](http://amzn.to/2auRjNy)


    或访问：[http://amzn.to/2auRjNy](http://amzn.to/2auRjNy)

    '
