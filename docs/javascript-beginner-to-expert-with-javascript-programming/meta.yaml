- md: "# Chapter 10 JavaScript Loops\n\nWhen any program is executed, it runs sequentially.\
    \ The statement which appears first in the sequence is executed first then the\
    \ next statement and so on till the last statement of the program. Many times\
    \ there is a requirement to run same block of code in a program multiple times\
    \ then there arises a need of a control structure known as loops.\n\nA loop makes\
    \ a statement or group of statements in a block of code to execute multiple times\
    \ if the condition is true and exits the loop when the condition becomes false.\
    \ Such loop is illustrated in the below diagram.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_64_0.png)\n\
    \nLike any other programming language, the JavaScript support looping and the\
    \ following types of loops and the loop control statements.\n\n- While loop\n\
    - Do…while loop\n- For loop\n- for...in loop\n- Loop control statements\n\n##\
    \ While loop statement\n\nWhile loop is the most basic loop in JavaScript language.\
    \ This loop execute a statement or piece of code block repeatedly as long as an\
    \ expression is held true. The loop terminates, once the expression is false.\
    \ The following is the syntax and the example of while loop statement.\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>While Loop</title>\n\
    </head>\n<body>\n  <script type=\"text/javascript\">\n    var counter = 0;\n \
    \   document.write(\"Entering while Loop!\");\n    while (counter < 5){\n    \
    \  document.write(\"Current Counter is : \" + counter + \"<br />\");\n      counter++;\n\
    \    }\n    document.write(\"Exiting while Loop!\");\n  </script>\n  <p>We are\
    \ inside body section…</p>\n</body>\n</html>\n```\n\n## Output\n\nWhen we execute\
    \ the above HTML program, the following will be the output. The counter will write\
    \ 5 times on the HTML page as it held its condition true 5 times.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_66_0.png)\n\
    \n## Do...while loop statement\n\nThe do...while loop is similar to that of the\
    \ while loop except that the condition check in case of do...while loop happens\
    \ at the end of the loop. This means that the code block inside the loop will\
    \ always be executed at least once, even if the condition is false. The following\
    \ is the syntax and the example of do...while loop statement.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Do While Loop</title>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\nvar counter = 0;\ndocument.write(\"\
    Entering while Loop!\");\n\ndo {\n    document.write(\"Current Counter is : \"\
    \ + counter + \"<br />\");\n    counter++;\n}\n\nwhile (counter < 5)\n\ndocument.write(\"\
    Exiting while Loop!\");\n\n</script>\n\n<p>We are inside body section...</p>\n\
    \n</body>\n\n</html>\n```\n\n## Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output. The counter will write 5 times on the HTML\
    \ page as it held its condition true 5 times including the first no check condition.\n\
    \n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_67_0.png)\n\n## For loop statement\n\
    \nThe 'for' loop is very important and mostly used looping statement in JavaScript\
    \ programming. The command has the following three important parts.\n\n**Loop\
    \ initialization** — it is where we initialize our counter value to a starting\
    \ initial value. This statement is executed before the looping begins.\n\n**Test\
    \ statement** — it has the actual condition which is evaluated to be true or false.\
    \ If this condition evaluates to be true, then the block of code inside the loop\
    \ will be executed, otherwise, if false then the control will exit the loop.\n\
    \n**Iteration statement** — it is place where we increase or decrease the counter\
    \ value which was initialized in the first statement.\n\nThe good part of for\
    \ loop is that we can put all of these three statement parts in a single line\
    \ which is separated by semicolons. The following is the syntax and the example.\n\
    \n```\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n<meta charset=\"ISO-8859-1\">\n\n\
    <title>For Loop</title>\n\n</head>\n\n<body>\n\n <script type=\"text/javascript\"\
    >\n\n document.write(\"Entering while Loop!\");\n\n for(counter = 0;counter <\
    \ 5; counter++){\n\n document.write(\"Current Counter is : \" + counter + \"<br\
    \ />\");\n\n }\n\n document.write(\"Exiting while Loop!\");\n\n </script>\n\n\
    \ <p>We are inside body section...</p>\n\n</body>\n\n</html>\n```\n\n## Output\n\
    \nWhen we execute the above HTML program, the following will be the output. The\
    \ counter will write 5 times on the HTML page as it held its condition true 5\
    \ times till the counter value becomes 5 and the loop exits.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_69_0.png)\n\
    \n## For...in loop statement\n\nThe *for...in* loop is used only in the special\
    \ cases where there is need to loop through an object's properties. The following\
    \ is the syntax and the example for *for...in* loop.\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>For In Statement</title>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\nvar prop;\ndocument.write(\"\
    Object Properties of Navigator <br /> \");\ndocument.write(\"Entering the loop!\"\
    );\nfor (prop in navigator) {\ndocument.write(prop);\n\ndocument.write(\"<br />\"\
    );\n}\n\ndocument.write(\"Exiting the loop!\");\n\n</script>\n\n<p>We are in the\
    \ body section...</p>\n\n</body>\n\n</html>\n```\n\n## Output\n\nWhen we execute\
    \ the above HTML program, the following will be the output. In the output, we\
    \ have iterated through the \"navigator\" object and displayed all the object\
    \ properties of the web browser's navigator object.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_70_0.png)\n\
    \n## Summary of Loops in JavaScript\n\n| Loop Type | Description |\n|---|---|\n\
    | while loop | While loop type, repeats a statement or group of statements while\
    \ a given condition is true. It tests the condition each time it executes the\
    \ loop body and it exits the loop when condition becomes false. |\n| for loop\
    \ | For loop type executes a sequence of statements multiple times and abbreviates\
    \ the code that manages the loop variable. |\n| nested loops | It is a loop within\
    \ a loop. In JavaScript, we can use a while loop in another while or for loop\
    \ or for loop in another while or for loop. |\n\n## Loop control statements\n\n\
    Loop control statements in JavaScript language are used to change execution from\
    \ its normal sequence. When such execution leaves a scope, all automatic objects\
    \ that were created in that scope are destroyed or removed.\n\nIn JavaScript language,\
    \ the following loop control statements are supported.\n\n| Control Statement\
    \ | Description |\n|---|---|\n| break statement | The break statement in JavaScript\
    \ is used to terminate the loop statement and transfers execution to the statement\
    \ immediately following after the end of loop. |\n| continue statement | The continue\
    \ statement in JavaScript is used to cause the loop to skip the remainder of its\
    \ body and immediately retest its condition prior to reiterating the looping body.\
    \ |\n\nLet's understand these loop control statement in a better way with the\
    \ help of the following example.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>Loop Control Statement</title>\n</head>\n\
    <body>\n  <script type=\"text/javascript\">\n    var counter = 0;\n    document.write(\"\
    Entering while Loop!<br>\");\n    while (counter < 5){\n      if (counter == 3){\n\
    \        counter++;\n        continue;\n      }\n      if (counter == 4){\n  \
    \      break;\n      }\n      document.write(\"Current Counter is : \" + counter\
    \ + \"<br />\");\n      counter++;\n    }\n    document.write(\"Exiting while\
    \ Loop!\");\n  </script>\n  <p>We are inside body section...</p>\n</body>\n</html>\n\
    ```\n\n---\n\nBut you need to be careful!\n\n```\n    break;\n\n    default: document.write(\"\
    No match found!<br />\")\n}\ndocument.write(\"<br>Exiting the switch block<br\
    \ />\");\n</script>\n<p>We are inside the body section…</p>\n</body>\n</html>\n\
    ```\n\n## Output\n\nWhen we execute the above HTML program, the following will\
    \ be the output. The program has written the text on HTML page whose case character\
    \ ('X') is matching.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_62_0.png)"
  mdcn: "\n# 第10章 JavaScript 循环\n\n当任何程序被执行时，它是按顺序运行的。序列中首先出现的语句最先被执行，然后是下一条语句，依此类推，直到程序的最后一条语句。很多时候，在程序中需要多次运行同一段代码块，这就产生了一种叫做循环的控制结构的需求。\n\
    \n循环会在条件为真时，使代码块中的一条或多条语句重复执行，并在条件变为假时退出循环。下面的图示说明了这种循环。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_64_0.png)\n\
    \n与其他编程语言一样，JavaScript 支持循环，并提供以下类型的循环和循环控制语句。\n\n- While 循环\n- Do…while 循环\n\
    - For 循环\n- for...in 循环\n- 循环控制语句\n\n## While 循环语句\n\nWhile 循环是 JavaScript 语言中最基本的循环。此循环会重复执行一条语句或一段代码块，只要表达式保持为真。一旦表达式为假，循环就会终止。以下是\
    \ while 循环语句的语法和示例。\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>While Loop</title>\n</head>\n<body>\n  <script type=\"text/javascript\"\
    >\n    var counter = 0;\n    document.write(\"Entering while Loop!\");\n    while\
    \ (counter < 5){\n      document.write(\"Current Counter is : \" + counter + \"\
    <br />\");\n      counter++;\n    }\n    document.write(\"Exiting while Loop!\"\
    );\n  </script>\n  <p>We are inside body section…</p>\n</body>\n</html>\n```\n\
    \n## 输出\n\n当我们执行上面的 HTML 程序时，输出将如下所示。计数器将在 HTML 页面上写入 5 次，因为它的条件保持为真 5 次。\n\n\
    ![](img/dfdffb2fcf51f543f5686a3b5ebd34db_66_0.png)\n\n## Do...while 循环语句\n\ndo...while\
    \ 循环与 while 循环类似，不同之处在于 do...while 循环的条件检查发生在循环的末尾。这意味着即使条件为假，循环内部的代码块也至少会被执行一次。以下是\
    \ do...while 循环语句的语法和示例。\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Do While Loop</title>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\nvar counter = 0;\ndocument.write(\"Entering while Loop!\"\
    );\n\ndo {\n    document.write(\"Current Counter is : \" + counter + \"<br />\"\
    );\n    counter++;\n}\n\nwhile (counter < 5)\n\ndocument.write(\"Exiting while\
    \ Loop!\");\n\n</script>\n\n<p>We are inside body section...</p>\n\n</body>\n\n\
    </html>\n```\n\n## 输出\n\n当我们执行上面的 HTML 程序时，输出将如下所示。计数器将在 HTML 页面上写入 5 次，因为它的条件保持为真\
    \ 5 次，包括第一次不检查条件的情况。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_67_0.png)\n\n\
    ## For 循环语句\n\n`for` 循环是 JavaScript 编程中非常重要且最常用的循环语句。该语句包含以下三个重要部分。\n\n**循环初始化**\
    \ — 这是我们将计数器值初始化为起始初始值的地方。此语句在循环开始之前执行。\n\n**测试语句** — 它包含实际的条件，该条件会被求值为真或假。如果该条件求值为真，则循环内部的代码块将被执行；否则，如果为假，则控制权将退出循环。\n\
    \n**迭代语句** — 这是我们增加或减少第一条语句中初始化的计数器值的地方。\n\nfor 循环的优点在于，我们可以将所有这三个语句部分放在一行中，用分号分隔。以下是语法和示例。\n\
    \n```\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n<meta charset=\"ISO-8859-1\">\n\n\
    <title>For Loop</title>\n\n</head>\n\n<body>\n\n <script type=\"text/javascript\"\
    >\n\n document.write(\"Entering while Loop!\");\n\n for(counter = 0;counter <\
    \ 5; counter++){\n\n document.write(\"Current Counter is : \" + counter + \"<br\
    \ />\");\n\n }\n\n document.write(\"Exiting while Loop!\");\n\n </script>\n\n\
    \ <p>We are inside body section...</p>\n\n</body>\n\n</html>\n```\n\n## 输出\n\n\
    当我们执行上面的 HTML 程序时，输出将如下所示。计数器将在 HTML 页面上写入 5 次，因为它的条件保持为真 5 次，直到计数器值变为 5 并退出循环。\n\
    \n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_69_0.png)\n\n## For...in 循环语句\n\n*for...in*\
    \ 循环仅用于需要遍历对象属性的特殊场合。以下是 *for...in* 循环的语法和示例。\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>For In Statement</title>\n</head>\n\
    <body>\n<script type=\"text/javascript\">\nvar prop;\ndocument.write(\"Object\
    \ Properties of Navigator <br /> \");\ndocument.write(\"Entering the loop!\");\n\
    for (prop in navigator) {\ndocument.write(prop);\n\ndocument.write(\"<br />\"\
    );\n}\n\ndocument.write(\"Exiting the loop!\");\n\n</script>\n\n<p>We are in the\
    \ body section...</p>\n\n</body>\n\n</html>\n```\n\n## 输出\n\n当我们执行上面的 HTML 程序时，输出将如下所示。在输出中，我们遍历了\
    \ `navigator` 对象并显示了 Web 浏览器 navigator 对象的所有属性。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_70_0.png)\n\
    \n## JavaScript 循环总结\n\n| 循环类型 | 描述 |\n|---|---|\n| while 循环 | While 循环类型，在给定条件为真时重复执行一条或一组语句。它每次执行循环体时都会检查条件，并在条件变为假时退出循环。\
    \ |\n| for 循环 | For 循环类型多次执行一系列语句，并简化了管理循环变量的代码。 |\n| 嵌套循环 | 它是一个循环内部的另一个循环。在\
    \ JavaScript 中，我们可以在另一个 while 或 for 循环中使用 while 循环，也可以在另一个 while 或 for 循环中使用 for\
    \ 循环。 |\n\n## 循环控制语句\n\nJavaScript 语言中的循环控制语句用于改变正常的执行顺序。当这样的执行离开一个作用域时，在该作用域中创建的所有自动对象都会被销毁或移除。\n\
    \n在 JavaScript 语言中，支持以下循环控制语句。\n\n| 控制语句 | 描述 |\n|---|---|\n| break 语句 | JavaScript\
    \ 中的 break 语句用于终止循环语句，并将执行转移到循环结束后的下一条语句。 |\n| continue 语句 | JavaScript 中的 continue\
    \ 语句用于使循环跳过当前循环体的剩余部分，并在重新迭代循环体之前立即重新测试其条件。 |\n\n让我们通过以下示例更好地理解这些循环控制语句。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Loop Control\
    \ Statement</title>\n</head>\n<body>\n  <script type=\"text/javascript\">\n  \
    \  var counter = 0;\n    document.write(\"Entering while Loop!<br>\");\n    while\
    \ (counter < 5){\n      if (counter == 3){\n        counter++;\n        continue;\n\
    \      }\n      if (counter == 4){\n        break;\n      }\n      document.write(\"\
    Current Counter is : \" + counter + \"<br />\");\n      counter++;\n    }\n  \
    \  document.write(\"Exiting while Loop!\");\n  </script>\n  <p>We are inside body\
    \ section...</p>\n</body>\n</html>\n```\n\n---\n\n但你需要小心！\n\n```\n    break;\n\
    \n    default: document.write(\"No match found!<br />\")\n}\ndocument.write(\"\
    <br>Exiting the switch block<br />\");\n</script>\n<p>We are inside the body section…</p>\n\
    </body>\n</html>\n```\n\n## 输出\n\n当我们执行上面的 HTML 程序时，输出将如下所示。程序已在 HTML 页面上写入了与其\
    \ case 字符（'X'）匹配的文本。\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_62_0.png)\n"
