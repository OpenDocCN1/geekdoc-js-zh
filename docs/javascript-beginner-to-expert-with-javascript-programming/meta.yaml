    \ (等于) | 此运算符用于检查两个操作数的值是否相等，如果两个值相等，则条件为真。 | 例如：(X == Y) 为假。 |\n| 2 | != (不等于)\
    \ | 此运算符用于检查两个操作数的值是否不相等，如果不相等，则条件为真。 | 例如：(X != Y) 为真。 |\n| 3 | > (大于) | 此运算符用于检查左操作数的值是否大于右操作数的值，如果是，则条件为真。\
    \ | 例如：(X > Y) 为假。 |\n| 4 | < (小于) | 此运算符用于检查左操作数的值是否小于右操作数的值，如果是，则条件为真。 | 例如：(X\
