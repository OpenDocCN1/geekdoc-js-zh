    \n## Chapter 11\n\n### JavaScript Functions\n\nA function may be defined as a\
    \ block of code that is well organized and reusable multiple times to perform\
    \ a number of operations in a program that demands high modularity and reusability.\
    \ It eliminates the need of writing the same piece of code again and again and\
    \ helps the programmers in writing modular codes. With the concept of functions,\
    \ it is possible for a programmer to break a big program into a number of small\
    \ and manageable functions which eventually reduces the redundancy.\n\nLike any\
    \ other programming language, the JavaScript language also supports the required\
    \ features to write modular code by using functions. Since the beginning of this\
    \ tutorials, we are using functions like \"alert()\" and \"write()\" which gives\
    \ us a little hint about the operations of the functions. These functions are\
    \ in-built JavaScript functions. In JavaScript language, we can write our own\
    \ functions like any other programming language that we are going to learn in\
    \ this chapter.\n\n### Function Definition\n\nFunctions are useable at any point\
    \ in the code for which we have to define them only once. In JavaScript, we define\
    \ a function by using the function keyword which is followed by a unique function\
    \ name, a list of parameters (that could be empty), and a statement block surrounded\
    \ by curly braces. The following is the syntax and the example of the JavaScript\
    \ function.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Function Definition</title>\n<script type=\"text/javascript\">\nfunction\
    \ sayHelloToJavaScript() {\n    alert(\"Welcome to the world of JavaScript!\"\
    );\n}\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n### Calling a Function\n\
    \nWe can invoke a JavaScript function later in the script or on the HTML web elements\
    \ events, we simply need to write the name of that function as shown in the following\
    \ code.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Function Definition</title>\n<script type=\"text/javascript\">\nfunction\
    \ sayHelloToJavaScript() {\n    alert(\"Welcome to the world of JavaScript!\"\
    );\n}\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n### Output\n\nWhen\
    \ we execute the above HTML program, the following will be the output. Here, we\
    \ are calling the JavaScript function on click event on the button which display\
    \ an alert with message which is picked up from the head section of the HTML where\
    \ JavaScript function is defined.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_76_0.png)\n\
    \n### Function Parameters\n\nTill this point, we have used the functions which\
    \ were without the input parameters. In a JavaScript function, we can pass different\
    \ parameters while calling it. The values of the passed parameters can be used\
    \ inside the function and we can do the manipulation on these parameters. A function\
    \ can take none to multiple parameters. Multiple parameters in a function are\
    \ separated by commas. The following is the syntax and the example of the parameterized\
    \ function.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Parameterized Function</title>\n<script type=\"text/javascript\">\n\
    function sayHelloToJavaScript(message, entity, lang) {\n    alert(message + \"\
    \ to the \" + entity + \" world of \" + lang + \"!\");\n}\n</script>\n</head>\n\
    <body>\n    <input type=\"button\" onclick=\"sayHelloToJavaScript('Welcome', 'World',\
    \ 'JavaScript');\" value=\"Call JavaScript\"/>\n    <p>Body section of the HTML\
    \ document.</p>\n</body>\n</html>\n```\n\n### Output\n\nWhen we execute the above\
    \ HTML program, the following will be the output. Here, we are calling the parameterized\
    \ JavaScript function on click event on the button which display an alert with\
    \ message which is picked up from the head section of the HTML where JavaScript\
    \ function is defined. Here, we are passing three parameters in the function which\
    \ we are displaying in the alert message.\n\n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_77_0.png)\n\
    \n### The return Statement\n\nA JavaScript function can return a value and this\
    \ return statement is optional. Return statement is used when we want to return\
    \ a value from a function. It should always be the last statement in a JavaScript\
    \ function. Let's understand the use of return function with the help of the following\
    \ example.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Return Function</title>\n<script type=\"text/javascript\">\nfunction\
    \ concatString(message, entity, lang) {\n    var str = message + entity + lang;\n\
    \    return str;\n}\nfunction writeToDoc(message, entity, lang) {\n    concatStr\
    \ = concatString(message, entity, lang);\n    document.write(concatStr);\n}\n\
    </script>\n</head>\n<body>\n<input type=\"button\" onclick=\"writeToDoc('Welcome\
    \ to the', 'World of', 'JavaScript!');\" value=\"Call JavaScript\"/>\n<p>Body\
    \ section of the HTML document.</p>\n</body>\n</html>\n```\n\n### Output\n\nWhen\
    \ we execute the above HTML program, the following will be the output. Here, we\
    \ are calling the JavaScript function on click event on the button which display\
    \ the message on the HTML page which is picked up from the head section of the\
    \ HTML where JavaScript function is defined. Here, we have passed three strings\
    \ in the \"writeToDoc\" function as the parameters which calls \"concatString\"\
    \ function which returns the concatenated string that is written on the document.\n\
    \n![](img/dfdffb2fcf51f543f5686a3b5ebd34db_79_0.png)\n\n## Chapter 12\n\n### JavaScript\
