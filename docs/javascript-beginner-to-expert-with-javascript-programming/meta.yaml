    \ page, it is known as an event. Similarly, when we click a button on the page,\
    \ it is also an event. We can think of other examples of events such as pressing\
    \ any key, submitting a form through button, changing the size of a window, etc.\n\
    \nProgrammers can use these JavaScript events to trigger and execute JavaScript\
    \ coded responses. These responses includes closing of a window on button click,\
    \ displaying alert message to user, validating the form data, etc.\n\nJavaScript\
    \ events are the part of the Document Object Model (DOM) Level 3. All HTML web\
    \ element contains a set of events which are capable of triggering JavaScript\
    \ function code.\n\nThe following are the few examples to understand the relation\
    \ between Event and invoking JavaScript function code.\n\n#### onclick Event Type\n\
    \nIt is the most frequently used event type that triggers a JavaScript code when\
    \ we left click the button of mouse on HTML page or web element. Here, we can\
    \ put our validation, etc., against this event type. The following example demonstrates\
    \ this event.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>On Click Events</title>\n<script type=\"text/javascript\">\nfunction\
    \ showAlert() {\n    alert(\"This is an alert on onclick event!\");\n}\n</script>\n\
    </head>\n<body>\n    <input type=\"button\" onclick=\"showAlert();\" value=\"\
    Call JavaScript\" />\n</body>\n</html>\n```\n\n### Output\n\nWhen we execute the\
    \ above HTML program, the following will be the output. We are invoking a JavaScript\
    \ function \"showAlert\" through a button onclick event which is displaying a\
