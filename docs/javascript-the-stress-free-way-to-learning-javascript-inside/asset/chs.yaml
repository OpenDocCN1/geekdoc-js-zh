- "# Javascript：从入门到精通无压力学习指南（初学者指南，基础）\n\n\n\n![](img/00052.jpeg)\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n# 引言\n\n感谢你并祝贺你下载了《JavaScript 学院》一书。这本书包含了如何掌握 JavaScript 语言基础的经过证明的步骤和策略。\n\
  \n本电子书是为想要快速轻松学习 JavaScript 的人设计的。通过关注 JavaScript 最重要的方面，这本书将在几页内教你你需要的所有知识。如果你想理解\
  \ JavaScript 编程语言的基础，这是你唯一需要的一本书。\n\n再次感谢下载本书，希望你喜欢！\n\n赠书：为了表示感谢，我想向你提供一份礼物。我附带了几本赠送书籍。请查看目录或滚动到最底部了解如何获取这些书籍！\n\
  \n# 第 1 章：JavaScript 语言\n\n## 基础信息\n\nJavaScript 是今天最流行的编程语言之一。这种语言在现代网站和网页的发展中起着重要作用。它的特性和功能可以帮助你创建支持用户交互的动态网站。此外，JavaScript\
  \ 是一种解释型计算机语言，具有强大的面向对象特性。\n\n这种语言最初被称为 `LiveScript`，但 NetScape（创建它的公司）将其更名为 JavaScript，以利用\
  \ Java 享有的普及。必须指出，JavaScript 与 Java 语言之间没有联系。\n\n## JavaScript 的客户端形式\n\n根据计算机专家的说法，该语言最流行的变体是客户端\
  \ JavaScript。网站开发者在创建项目时使用这种变体。通常，你可以通过两种不同的方式使用客户端 JavaScript：\n\n*   包含在网页代码中\n\
  \n\n\n\n\n*   `将其保存到外部文件中`\n\n对于第二个选项，你将需要使用 HTML 文档来引用外部文件，并将其链接到你的网站。\n\n基本上，在创建网页时并不需要使用静态\
  \ HTML。你可以包含允许浏览器控制、用户交互以及动态创建 HTML 文件的应用程序和程序。\n\n客户端（Client-Side）类型的 JavaScript\
  \ 相比于典型的 CGI（即通用网关接口）服务器端脚本具有多种优势。例如，你可以使用客户端 JavaScript 来判断用户是否在你的表表单字段中提供了有效的联系信息。\n\
  \n每当用户提交表单时，JavaScript 代码就会运行。然后，系统将分析提交的表单中的信息。这种机制确保了 Web 服务器不会处理无效的请求。因此，客户端\
  \ JavaScript 为你的网站提供了更好的安全性和性能。\n\n这种编程语言还允许你收集用户发起的隐式或显式操作（例如链接导航、按钮点击等）。\n\n##\
  \ JavaScript 提供的优势\n\n以下是该编程语言提供的主要优势：\n\n*   **减少服务器交互**—— JavaScript 可以在向 Web\
  \ 服务器发送数据之前验证用户输入的信息。这意味着你可以从你的服务器中过滤掉无用的流量。\n*   **即时反馈**—— 网站访问者将立即看到他们是否漏掉了某个字段或输入了错误数据。他们无需刷新页面即可看到错误信息。\n\
  *   **提高网页交互性**—— 通过 JavaScript，你可以生成对鼠标和键盘输入做出响应的用户界面。\n*   **增强界面**—— 在这种语言中，你可以轻松地为你的网站添加酷炫的界面元素（例如滑块、拖放组件等），为为你的网站访问者提供增强的界面。\n\
  \n## JavaScript 的劣势\n\n就像生活中的其他事物一样，JavaScript 也有自己的缺点。主要的包括：\n\n*   该语言没有多处理或多线程能力。\n\
  *   你不能使用 JavaScript 编写网络程序。该语言不支持专注于网络方面的程序/应用程序。\n*   你无法读取或编辑使用客户端 JavaScript\
  \ 编写的文件。出于安全考虑，这些功能被禁用了。\n\n# 第 2 章：JavaScript 语法\n\n你可以通过将 JavaScript 语句放置在网页 `<script>`\
  \ 标签内来实现这种语言。通常情况下，你可以将这些 `<script>` 标签放在网页的任何位置。然而，专业的网站开发者通常会将这些标签放在页面的 `<head>`\
  \ 标签内。\n\n基本上，`<script>` 标签指示浏览器将其包含的文本解释为脚本。以下是 JavaScript 的基本语法：\n\n![](img/00001.jpeg)\n\
  \n脚本标签接受以下属性：\n\n*   Language（语言）—— 此属性指示所正在使用的语言。然而，最新版本的 HTML 和 XHTML 不再支持此属性。\n\
  *   Type（类型）—— 这是现代网站和网页中使用的属性。你必须使用它来指定你正在使用的计算机语言。确保其值为“`text/javascript`”。\n\n\
  考虑到这些属性，JavaScript 的语法如下：\n\n![](img/00002.jpeg)\n\n## 首次使用 JavaScript\n\n在这一节中，你将首次使用这种脚本语言。你将使用的代码设计用于在计算机屏幕上显示“Hello\
  \ World”。正如你所看到的，JavaScript 代码（见下截图）涉及一个可选的 HTML 元素。该 HTML 注释允许你防止不支持 JavaScript\
  \ 语言的浏览器解析这些代码。\n\n符号 `//` 结束 HTML 注释。在 JavaScript 中，`//` 代表注释。这意味着你必须使用双斜杠来防止浏览器将\
  \ HTML 注释解释为你 JavaScript 语句的一部分。然后，你必须调用 `document.write()` 函数将字符串写入你的 HTML 文件中。\n\
  \n重要提示：你可以使用 `document.write()` 函数写入 HTML 语句、文本内容或两者兼有。\n\n以下是你必须输入到 JavaScript\
  \ 编辑器中的代码：\n\n![](img/00003.jpeg)\n\n如果编写和执行正确，上述代码将向你显示：Hello World!\n\n### 空格与换行\n\
  \n这种脚本语言忽略程序内部的制表符、空格和换行符。这意味着你可以使用这些元素使你的 JavaScript 代码更易读、更易理解。\n\n### 分号\n\n\
  与其他计算机语言（例如 `C++`）类似，JavaScript 要求你使用分号来结束简单的语句。然而，如果你的语句是分行输入的，你就不需要添加分号。例如，下面的代码即使没有分号也能正常运行：\n\
  \n![](img/00004.jpeg)\n\n### JavaScript 语句的大小写敏感性\n\n这种编程语言是对大小写敏感的。例如，“`WORD`”、“`Word`”和`word`”在\
  \ JavaScript 中被视为三个不同的实体。这意味着在处理函数、关键字、变量和其他标识符时，你必须保持字母大小写的一致。\n\n### JavaScript\
  \ 注释\n\n在 JavaScript 中创建注释时，你必须记住以下规则：\n\n*   该语言忽略放置在 `//` 和行尾之间的所有文本。\n*   你可以使用\
  \ `/*` 和 `*/` 来创建注释。通常情况下，程序员在创建多行注释时使用这些符号。\n*   JavaScript 还允许你在编写单行注释时使用 `<!—`（即\
  \ HTML 中用于开始注释的符号）。\n*   JavaScript 不识别 `-->`（即 HTML 中用于结束注释的符号）。你必须使用 `//-->` 代替。\n\
  \n# 第 3 章：JavaScript 代码的放置\n\n你可以将 JavaScript 代码放置在 HTML 文件的任何部分。然而，在 HTML 文档中保留\
  \ JavaScript 代码的推荐区域是：\n\n*   在 `<head> </head>` 区域内\n*   在 `<body></body>` 区域内\n\
  *   在文档的 `<head>` 和 `<body>` 区域\n*   在外部文件中\n\n本章将讨论这些区域。\n\n## 在 <head></head>\
  \ 区域使用 JavaScript\n\n如果你希望脚本在特定事件期间运行（例如用户点击按钮时），这是理想的区域。下面的示例代码将向你如何在此区域保存代码。\n\
  \n![](img/00005.jpeg)\n\n如果输入正确，该代码将显示：\n\n![](img/00006.jpeg)\n\n## 在 <body></body>\
  \ 区域使用 JavaScript\n\n通常情况下，如果你希望在网页加载时产生内容，你应该将 JavaScript 代码放置在 `<body>` 部分。在这里，你不需要定义任何函数。例如：\n\
  \n![](img/00007.jpeg)\n\n该代码生成以下结果：\n\n![](img/00008.jpeg)\n\n### 在文档的 <head> 和\
  \ <body> 区域放置代码\n\n你也可以将 JavaScript 代码放置在 HTML 文件的 `<head>` 和 `<body>` 区域。分析以下示例：\n\
  \n![](img/00009.jpeg)\n\n如果你正确输入了代码，打开 HTML 文件将得到：\n\n![](img/00010.jpeg)\n\n##\
  \ 在外部文件中放置代码\n\n在使用 JavaScript 时，你可能会遇到很多需要在不同网页上使用相同代码的情况。重复输入代码可能很无聊且耗时。幸运的是，你可以只需将\
  \ JavaScript 代码保存到外部文件中。然后，只需将该文件链接到需要相同代码的网页即可。\n\n在使用这种方法时，你应该使用 `<script>` 标签和\
  \ `src` 属性。查看下面的示例：\n\n![](img/00011.jpeg)\n\n这种方法要求你在文本文件中编写 JavaScript 代码，并使用\
  \ `.js` 作为扩展名保存（例如 example.js）。\n\n让我们尝试一个简单的练习。将下面的代码复制到文本文件中并保存为 `filename.js`。然后，在添加\
  \ `filename.js` 文件后，调用你 HTML 文档中的 `sayHello()` 函数。\n\n\n\n\n\n# 第 4 章：JavaScript\
  \ 语言中的变量\n\n## JavaScript 中的数据类型\n\n与其他编程语言类似，JavaScript 有它自己支持的数据类型。因此，你可以使用 JavaScript\
  \ 表示和操作某些值和信息。\n\n这种编程语言支持这些基本数据类型：\n\n* `Boolean`（布尔值，即 `true` 或 `false`）\n* `Strings`（字符串，例如“这本书非常棒。”）\n\
  * `Numbers`（数字，例如 1, 2, 3, 123 等）\n\nJavaScript 还支持 `null` 和 `undefined`，这是两种描述单一值的数据类型。最后，该语言使用了一种名为“object”（对象）的复杂数据类型。你将在本书的后面部分学习对象。\n\
  \n**注意：** JavaScript 将所有数字都视为浮点值。\n\n## 变量\n\n作为 JavaScript 用户，你可能将变量看作容器：你可以在变量中放置不同类型的信息。要访问存储的数据，你只需要指定存放它的容器即可。\n\
  \n在使用变量之前，你必须先对其进行声明。在 JavaScript 中，声明变量时应该使用 `var`。查看以下示例：\n\n![](img/00013.jpeg)\n\
  \n上面的代码声明两个变量：`money` 和 `name`。\n\n将数据保存到变量的过程被称为变量初始化。大多数程序员会在声明时初始化变量。然而，你也可以只声明变量而不保存任何值：一旦你需要，就可以将数据保存到变量中。\n\
  \n例如，你可以创建一个名为 `profit` 的变量而不输入任何值。一旦你从总收入中减去费用，就可以回到创建的变量并输入信息。要初始化变量，你只需要指定变量名，放置一个等号，并输入你想要赋值的值。这里有一个示例：\n\
  \n```javascript\nvar profit;\nprofit = 1,000,000.00;\n```\n\nJavaScript 被认为是一种“无类型”的计算机语言。这意味着\
  \ JavaScript 变量可以包含任何类型的数据。这与其它语言相比是一个巨大的优势，其他语言要求用户在创建变量时指定数据类型。\n\n## 变量的作用域\n\
  \n变量的“作用域”是你计算机程序中声明它的区域。JavaScript 支持以下作用域：\n\n* `Local`（局部）——局部变量仅在定义它的函数内部可见。这意味着一个函数无法使用另一个函数的局部变量。\n\
  * `Global`（全局）——全局变量对程序内部的所有函数可用。这意味着你可以在代码的任何地方定义它们。\n\n如果局部变量和全局变量同名，则局部变量将具有优先级。如果你使用已有的全局变量名在局部声明变量，你将隐藏该全局变量。分析下方的示例代码：\n\
  \n![](img/00014.jpeg)\n\n上面的代码将向你显示此结果：Local（局部）。\n\n## 变量命名\n\n在为变量选择名称时，你应该记住以下规则：\n\
  \n* 你不能使用任何 JavaScript 关键字（例如 `break`、`Boolean` 等）作为变量名。你将在稍后学习 JavaScript 关键字。\n\
  * 在命名变量时，可以使用字母、数字和下划线。但是，名称不能以数字开头。例如，`sample1` 是有效的，但 `1sample` 是无效。\n* 变量名是区分大小大小的。这意味着\
  \ JavaScript 将“SAMPLE”、“Sample”和“sample”视为三个不同的变量。\n\n## JavaScript 中的保留关键字\n\n\
  与其他编程语言类似，JavaScript 有一组具有特殊用途的单词。你不能在命名对象、方法、函数、循环和变量时使用这些词。下表将向你展示 JavaScript\
  \ 语言中所有的关键字。\n\n| if | do | in | int |\n| --- | --- | --- | --- |\n| new | try |\
  \ for | var |\n| else | enum | this | long |\n| byte | case | true | null |\n| char\
  \ | goto | void | with |\n| break | throw | false | final |\n| catch | float | class\
  \ | const |\n| while | short | super | switch |\n| export | throws | typeof | public\
  \ |\n| return | delete | static | double |\n| import | Instanceof | abstract | synchronized\
  \ |\n| Boolean | interface | extends | transient |\n| finally | package | private\
  \ | protected |\n| function | volatile | continue | debugger |\n| implements | |\
  \ | |\n\n# 第 5 章：JavaScript 运算符\n\nJavaScript 语言支持以下类型的运算符：\n\n* 逻辑运算符\n* 比较运算符\n\
  * 赋值运算符\n* 算术运算符\n* 位运算符\n* 杂杂运算符\n\n让我们讨论每种类型的运算符：\n\n## 逻辑运算符\n\nJavaScript 支持这些逻辑运算符：\n\
  \n**注意：** 假设 `x = 5` 且 `y = 10`。\n\n* `&&` —— 这被称为逻辑与（AND）运算符。如果两个操作数都不等于零，则条件为真。例如：`(x\
  \ && y)` 为真。\n* `||` —— 此运算符称为逻辑或（OR）运算符。如果至少有一个操作数不等于零，则条件为真。例如：`(x || y)` 为真。\n\
  * `!` —— 程序员将此运算符称为逻辑非（NOT）。此运算符会反转它所操作运算符的结果。例如：`!(x && y)` 为假。\n\n## 比较运算符\n\n\
  以下是你可以在 JavaScript 中使用的比较运算符：\n\n**注意：** 让我们使用以下变量：`x = 2;` `y = 4;`\n\n* `==` ——\
  \ 此运算符检查值的相等性。如果值相等，条件为真。例如：`x == y`。\n* `!=` —— 使用此运算符检查操作数是否不等。如果值不相等，条件为真。例如：`x\
  \ != y`。\n* `>` —— 此运算符检查左侧操作数是否大于右侧。如果是，条件为真。例如：`x > y`。\n* `<` —— 此运算符检查操作数是否小于。如果是，条件为真。例如：`x\
  \ < y`。\n* `>=` —— 你可以使用此运算符检查左侧操作数是否大于或等于右侧。如果是，条件为真。例如：`x >= y`。\n* `<=` —— 使用此运算符检查左侧操作数是否小于或等于右侧。如果是，条件为真。例如：`x\
  \ <= y`。\n\n## 赋值运算符\n\n这些是你可以用于赋值赋值的运算符：\n\n* `=` —— 这是简单赋值运算符。它将右侧操作数的值赋值给左侧操作数。例如：`z\
  \ = x + y` 将 `x + y` 的值赋值给 `z`。\n* `+=` —— 此运算符被称为加赋值运算符。它将两个操作数相加并将结果赋予左侧操作数。例如：`z\
  \ += x` 等于 `z = z + x`。\n* `-=` —— 程序员称之为减赋值运算符。它从左侧操作数中减去右侧操作数的值。然后，将差赋值给左侧操作数。例如：`z\
  \ -= x` 等于 `z = z - x`。\n* `*=` —— 此运算符称为乘赋值运算符。它将两个操作数相乘并将积赋予左侧操作数。例如：`z *= x`\
  \ 等于 `z = z * x`。\n* `/=` —— 这被称为除赋值运算符。它将左侧操作数的值除以右侧操作数的值。然后，将商赋值给左侧操作数。例如：`z /=\
  \ x` 等于 `z = z / x`。\n* `%=` —— JavaScript 用户将其称为取模赋值运算符。它取两个操作数的模并将结果赋予左侧操作数。例如：`z\
  \ %= x` 等于 `z = z % x`。\n\n\n\n\n\n下面的列表显示了 JavaScript 中可用的算术运算符。为了帮助你理解这些运算符是如何工作的，让我们来使用两个示例变量：`x\
  \ = 2`；`y = 4`。\n\n*   `+` – 如果你想对两个操作数进行加法（即运算符两侧的值），就应该使用此运算符。例如：`x + y = 6`。\n\
  *   `-` – 此运算符允许你在代码中执行减法。在这里，你将从第一个操作数的值中减去第二个操作数的值。例如：`y– x = 2`。\n*   `*` – 如果你想乘以两个操作数，就应该使用星号。例如：`x\
  \ * y = 8`。\n*   `/` – 使用此运算符，你用左侧操作数的值除以右侧操作数的值。例如：`y / x = 2`。\n*   `++` – 此运算符允许在你使用的操作数上加\
  \ 1。例如：`4++ = 5`。\n*   `--` – 此运算符从它所附的操作数上减去 1。例如：`x-- = 1`。\n\n**重要备注：** 你也可以使用\
  \ `+` 运算符来组合数字和字符串元素。例如：`\"x\" + 4 = x4`。\n\n## 位运算符\n\n这种编程语言允许你在代码中执行位位运算。以下是你可以使用的运算符：\n\
  \n**注意：** 让我们使用两个变量：`x = 2`；`y = 3`。\n\n*   `&` – 这被称为位与（Bitwise AND）运算符。它对参数中涉及的所有位执行布尔逻辑与操作。例如：`(x\
  \ & y)` 为 2。\n*   `|` – 程序员将此运算符称为位或（Bitwise OR）。它对参数中涉及的所有位执行布尔逻辑或操作。例如：`(x | y)`\
  \ 为 3。\n*   `^` – 这被称为位异或（Bitwise XOR）运算符。它对参数中涉及的所有位执行布尔逻辑异或操作。在异或逻辑中，只有一个操作数可以为真。例如：`(x\
  \ ^ y)` 为 1。\n*   `~` – 此运算符是单目的（`unary`，即它作用于单个操作数）。被称为位非（Bitwise NOT）运算符，它会反转操作数的位。例如：`(~y)`\
  \ 为 -4。\n*   `<<` – 此运算符被称为左移（Left Shift）。它根据右侧操作数指定的数字将左侧操作数的位向左移动。同时，它使用零来填充新位。将值向左移动\
  \ 1 位相当于将其乘以 2。因此，`(x << 1)` 结果为 4。\n*   `>>` - 这被称为右移（Right Shift）运算符。它根据右侧操作数提供的数字将左侧操作数的值向右移动。例如：`(x\
  \ >> 1)` 结果为 1。\n*   `>>>` – JavaScript 用户将此称为右移并补零（Right Shift and Zero）。它的功能与\
  \ `>>` 类似。唯一的区别是最左侧的位始终等于零。\n\n## 杂杂运算符\n\n本书这一部分将讨论两个不属于上述讨论类别的有用运算符。这些运算符是：\n\n\
  *   `?:` – 这被称为条件运算符（Conditional Operator）。它检查表达式的值是真还是假。然后，它根据评估结果执行分配的语句之一。例如，如果条件为真，运算符将为表达式赋值\
  \ 1。然而，如果条件为假，运算符将赋值 2。\n*   `typeof`– 这是一个单目运算符，意味着你可以将其用在单个操作数。你可以用它来确定操作数的数据类型。如果操作数是字符串、布尔或数字，此运算符给出\
  \ `string`、`boolean` 或 `number`。然后，根据评估结果给出真或假。\n\n下表提供了有关 `typeof` 运算符的有用信息：\n\n\
  | 数据类型 | typeof 结果 |\n| :--- | :--- |\n| Object | “object” |\n| Number | “number”\
  \ |\n| Boolean | “boolean” |\n| Undefined | “undefined” |\n| Null | “object” |\n\
  | Function | “function” |\n| String | “string” |\n\n# 第 6 章：条件语句\n\n在使用 JavaScript\
  \ 时，会遇到需要你从预定义的集合中选择一个的情况。在这种情况下，你必须使用条件语句。条件语句允许你的程序做出合理的判断并执行正确的流程。\n\n这种编程语言提供了你可以在代码中使用的条件语句。本章将讨论三个最重要的条件语句：(1)\
  \ `if` 语句，(2) `if… else` 语句，以及 (3) `if… else if…` 语句。\n\n让我们详细讨论这些语句：\n\n## 条件语句的流程图\n\
  \n下面的图片显示了条件语句的基本流程图。\n\n![](img/00015.jpeg)\n\n### if 语句\n\n该语句是 JavaScript 中的基础条件语句。它帮助程序做出决策并执行其他语句。\n\
  \n`if` 语句的语法是：\n\n![](img/00016.jpeg)\n\n上面的代码评估 JavaScript 表达式。如果评估结果为真，则将执行分配的语句。然而，如果结果为假，则没有任何分配的语句会被执行。\n\
  \n### if… else 语句\n\n该语句比上一个更复杂。这是因为你在该语句中使用比较运算符。\n\n这是 `if… else` 语句的语法：\n\n![](img/017.jpeg)\n\
  \n你可以使用上面的语法评估 JavaScript 表达式。如果结果为真，将执行 `if` 部分的语句。如果结果为假，反之，将执行 `else` 部分的语句。\n\
  \n### if… else if… 语句\n\n基本上，这是 `if… else` 语句的增强形式。通过提供多个条件，它帮助程序做出正确的决策。\n\n这是\
  \ `if… else if…` 语句的语法：\n\n![](img/0018.jpeg)\n\n如果你仔细想，上面的语法是一个简单的形式。它是 `if` 语句的集合，每个\
  \ `if` 都是前面语句的一部分。此语法根据评估结果执行语句。如果所有条件为假，系统将运行 `else` 部分。\n\n### Switch-case 语句\n\
  \n你可以使用一系列 `if… else` 语句来执行多路径分支系统。你在上一节中学习过这个。然而，这种方法并不总是理想的答案，特别是当所有分支都取决于一个变量的值时。\n\
  \n幸运的是，JavaScript 提供了 switch 语句。在上述情况下，单个 switch 语句比 `if… else` 语句更有效。\n\n这是基础 switch-case\
  \ 语句的流程图：\n\n![](img/0019.jpeg)\n\n### 语法\n\nswitch 语句旨在完成两件事：\n\n*   提供一个程序可以评估的表达式\n\
  *   提供根据评估结果运行的各种语句\n\nJavaScript 内置解释器会将每个 case 与表达式的值进行比较。此过程将持续到解释器找到匹配为止。如果没有找到匹配，解释器将运行默认条件。switch\
  \ 语句的语法是：\n\n![](img/00020.jpeg)\n\n此语法使用 break 语句来终止每个 case。如果你删除了这些 break 语句，JavaScript\
  \ 解释器将执行每个 case 内部的所有语句。\n\n第六章：JavaScript 中不同的循环类型\n\n在编写自己的程序时，你会遇到需要多次执行某操作的情况。显然，重复输入相同的内容是非常耗时的（而且极其无聊）。幸运的是，JavaScript\
  \ 提供了各种工具可以帮助你快速轻松地重复语句。这些工具被称为循环，它们是本章的主题。\n\n\n\n\n\n以下是可以在 JavaScript 语言中使用的循环：\n\
  \n## While 循环\n\n程序员认为这是 JavaScript 中最基础的循环类型。基本上，`while` 循环在表达式为真时会执行语句或代码块。一旦表达式变为假，循环将立即结束。\n\
  \n以下是 `while` 循环的流程图：\n\n![](img/00021.jpeg)\n\n### 语法\n\n以下是 `while` 循环的语法：\n\n\
  ![](img/00022.jpeg)\n\n在执行任何语句之前，`while` 循环会评估赋值表达式的条件。这意味着如果表达式为假，则不会执行任何语句。\n\n\
  ### Do… while 循环\n\n`do… while` 循环与 `while` 循环相似。唯一的区别是它在执行完赋值语句/语句后才评估表达式。如果评估结果为真，循环将再次执行该语句/语句。只有当结果变为假时，循环才会停止。正如此，即使评估结果为假，`do…\
  \ while` 循环也会至少运行一次。\n\n典型的 `do… while` 循环的流程图如下：\n\n![](img/00023.jpeg)\n\n###\
  \ 语法\n\n以下是 `do… while` 循环的语法：\n\n![](img/00024.jpeg)\n\n**重要**：语法末尾的分号是强制性的。请确保在所有的\
  \ `do… while` 循环中都包含它。\n\n### For 循环\n\n这种循环以其紧凑性著称。通常，`for loops` 包含以下部分：\n\n*\
  \   循环初始化——这是你从一个初始值开始计数器的部分。JavaScript 解释器会在运行循环本身之前执行这部分。\n*   测试语句——循环的这部分会评估赋值的条件。如果赋值条件为真，解释器将执行\
  \ `for` 循环内部的代码。然而，如果条件为假，系统控制权将交给 `for` 循环之后的语句。\n*   迭代语句——你可以使用这部分来增加或减少循环的计数器。\n\
  \nJavaScript 允许你将所有这些部分放在同一行中。你只需要用分号分隔每个部分即可。\n\n下面的图片显示了 `for` 循环的流程图：\n\n![](img/00025.jpeg)\n\
  \n### 语法\n\n`for` 循环的语法为：\n\n![](img/00026.jpeg)\n\n## 如何控制你的循环\n\nJavaScript 语言允许你操作所有的循环和切换（switch）。在某些情况下，你必须在到达最终部分之前退出循环语句。在某些情况下，你必须忽略代码的某部分并初始化下一个。\n\
  \n为了帮助你处理此类情况，这种编程语言提供了两个强大的工具：`break` 语句和 `continue` 语句。让我们详细讨论每个语句。\n\n### Break\
  \ 语句\n\n该语句在上一章引入，允许你提前退出任何循环。下面的图片将向你展示基础 `break` 语句的流程图。\n\n![](img/00027.jpeg)\n\
  \n**注意**：在我们讨论切换语句期间，你已经见过 `break` 语句是如何工作的。\n\n### Continue 语句\n\n`continue` 语句指示\
  \ JavaScript 解释器开始循环的下次迭代并忽略剩余的代码块。一旦系统遇到 `continue` 语句，程序流将进入表达式评估。如果条件仍然为真，`continue`\
  \ 语句将开始下次迭代。另一方面，如果条件变为假，程序控制将跳出循环。\n\n# 第 7 章：JavaScript 语言中的函数\n\n基本上，函数是可重用代码的集合，可以在程序的任何部分被调用。这意味着你不需要多次编写相同的代码。函数可以帮助程序员创建模块化代码。它们还允许程序员将大型程序拆分为较小的函数。\n\
  \n与任何其他编程语言一样，JavaScript 提供了通过函数帮助编写模块化代码的功能。你可能在本书提供的代码中见过如 `write()` 和 `alert()`\
  \ 这样的函数。你可以重复使用这些函数，但它们只在 JavaScript 中编写过一次。\n\n这种语言还允许你编写自己的函数。本章将教你 JavaScript\
  \ 函数的基础知识。\n\n## 如何定义函数\n\n你必须在使用函数之前对其进行定义。定义函数最流行的方法是使用 `function`（即 JavaScript\
  \ 关键字）。在输入 `function` 后，指定你想要使用的名称和参数。然后添加一个由大括号括起来的 JavaScript 语句块。\n\n**注意**：你可以创建一个没有定义任何参数的函数。因此，参数列表可以是空的。\n\
