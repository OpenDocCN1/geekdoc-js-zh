  \n# 第 1 章：Python 简介\n\n如果你正在寻找一种以代码可读性为主要关注点的通用、高级编程语言，你应该考虑 Python。它的语法允许你使用比 C、C++\
  \ 和 Java 等其他编程语言更少的代码行来表达概念。它支持广泛的编程范式，因此涵盖了命令式、函数式和面向对象的编程。此外，它还具有全面的标准库、动态类型系统和自动内存管理。\n\
  \n有许多解释器可以让你安装在不同的操作系统上；因此，你可以在各种系统上执行 Python。你甚至可以使用第三方应用程序。如果你不想安装解释器，可以将代码封装成独立的可执行程序，以便在不同环境中分发\
  \ Python 软件。\n\n## Python 语言的简史\n\nPython 由 Guido van Rossum 在 20 世纪 80 年代后期开发。最初只是一个圣诞项目。Van\
  \ Rossum 想要为 C 和 UNIX 黑客提供一种脚本语言解释器。他的小项目最终升级到 Python 2.0，于 2000 年 10 月发布。这个新版本具有完整的垃圾回收和\
  \ Unicode 支持。Python 3.0，也称为 Python 3000 和 py3k，于 2008 年 12 月发布，并向 2.6 和 2.7 版本回溯了某些特性。\n\
  \n## 为什么你应该使用 Python？\n\n编程语言的存在是有理由的。例如，Python 的开发是为了让程序员创建高效且高效的代码。它的主要目标是帮助初学者轻松快速地学习编程语言。由于减少了学习时间，你可以创建出用更晦涩、复杂的编程语言难以实现的实用应用程序。\n\
  \n通过 Python，你还可以从缩短应用程序开发时间中获益。如前所述，Python 的代码行比 C、C++ 和 Java 少。它的代码实际上短了五到十倍；因此更高效且不复杂。你可以花费更少的时间来开发应用程序，而花更多时间来调优和改进它们。\n\
  \n\n\n\n\n在检查漏洞和错误时，你所使用的编程语言易于阅读和理解至关重要。如果编程语言太复杂，你在编写代码和检查程序时可能会遇到困难。使用 `Python`，代码的读写性会变得容易得多；因此，你可以轻松解释代码并进行必要的更改。\n\
  \n此外，`Python` 还有许多其他用途。它是基于浏览器的脚本应用程序、创建优秀的用户界面和粗略的应用示例、与交互、处理 XML 以及设计数学、工程和科学应用的理想选择。\n\
  \n# Python 对比 C#、Java 和 Perl\n\n你可能会发现对编程语言进行相互比较是一项主观的任务。通常，它们的差异取决于个人偏好。尽管如此，有时这种比较是有科学数据支持的。无论如何，你都必须记住，并不存在全能的编程语言。作为一个程序员，你只需要找到一个最适合你目标或需求的语言即可。\n\
  \n## C#\n\n如果你有 `Java` 背景，你可能会发现 `C#` 和 `Java` 非常相似。但话又回来，与 `Java` 相比，`C#` 仍然有自己的优缺点。微软声称，他们开发\
  \ `C#` 的主要目标是产生一个更好的 `C` 和 `C++` 版本。然而，与 `C#` 相比，`Python` 具有更好的科学工程应用以及更好的跨平台支持。在在使用\
  \ `C`、`C++` 和 `Java` 时，它更具扩展性。它更容易学习和理解，并且允许各种计算机环境。它的代码也更加简洁。\n\n## Java\n\n程序员将\
  \ `Java` 视为一种一站式编程语言。多年来，他们一直在寻找一种可以随处运行和编写的，并发现了 `Java`，它可以在不同的平台和计算机环境中良好运行。尽管如此，`Python`\
  \ 也是一种一站式编程语言。它与 `Java` 非常相似，区别在于它的代码更简洁，更容易学习和理解。它的开发速度快得多，并且改进了可以存储不同数据类型的数据框或变量，这在运行应用程序时非常有用。\n\
  \n## PERL\n\n`PERL` 代表实用提取和报告语言（Practical Extraction and Report Language）。是一种适用于从另一个数据库获取和处理数据的编程语言。相比之下，`Python`\
  \ 比 `PERL`，因为它更容易阅读、实现、学习和理解。它具有更好的 `Java` 集成和数据保护。它还有较少的特定平台偏见。\n\n# 为什么 Python\
  \ 是初学者的理想选择？\n\n如果你刚刚开始编程，你可以考虑 `Python`。它是初学者的理想选择，因为它具有一致且简单的语法，以及丰富的标准库，允许你完成多个项目。其中涉及的作业不仅限于常见的四功能计算器和平衡性检查程序。\n\
  \n当你习惯了在 `Python` 中编写程序时，你会发现编写现实应用实际上非常简单。交互式解释器还允许你测试语言特性。在 `Python` 中，你可以专注于核心编程技能，如程序分解和数据类型设计，以及基础概念，包括过程和循环。\n\
  \n由于 `Python` 涉及到多个库的使用和系统调用，你可以开发具有易于编程的接口的应用程序。你还可以完成应用程序接口（`API`）所需的任务。\n\n如果你以前从未用过任何其他编程语言，请担心。即使是没有任何先编程知识或经验的人也可以轻松掌握\
  \ `Python` 编程语言的基础知识。\n\n至于安装，`Python` 很容易安装。大多数 `UNIX` 和 `Linux` 发行版实际上都包含了它的软件包中。如果你从惠尔-惠普（HP）购买了\
  \ Windows 电脑，你可以随时使用 `Python`，因为系统预装了它。\n\n为了让你操作更方便，你应该学习如何使用文本编辑器以及集成开发环境（`IDEs`）。阅读带有示例代码和程序的编程书籍也会有所帮助。\n\
  \n关于版权，`Python` 的开发者允许程序员对源码进行任何他们想做的事，只要忘记包含版权即可。版权规则并不严格。你甚至可以出售二进制和源代码形式的副本以及涉及使用\
  \ `Python` 的产品。然而，如果你想使用标志，请确保你获得了许可。\n\n`Python` 非常稳定。事实上，它稳定到足以日常使用。你可以预计在六到十八个月内出一个新版本。开发者发布漏洞修复版本，以确保新版本比之前的版本更好。\n\
  \n如果你想执行静态分析或搜索漏洞，可以使用 `Pylint` 或 `PyChecker`。前者是一个检查模块以符合符合编码标准的工具，并允许自定义插件。后者是一种在源代码中寻找漏洞的静态分析工具。\n\
  \n既然你已经学习了编程语言的基础知识，你可能仍然好奇 `Python` 是怎么命名的。Guido van Rossum 喜欢蟒蛇（pythons）吗？事实上，他其实喜欢的是一部名为《蒙提·派恩的飞行马团》（Monty\
  \ Python’s Flying Circus）的电视节目，而不是爬行动物。\n\n在 `Python` 开发期间，他正在读这部喜剧剧剧本，认为“Python”是一个合适的名字，因为它短、独特且具有恰好的神秘感。事实上，文档中允许并实际上鼓励对该喜剧剧进行引用。\n\
  \n# 第 2 章：语法\n\n`Python` 具有简单直接的语法。它甚至鼓励程序员在不使用准备好的或模板代码的情况下编写程序。`print` 指令实际上是所有指令中最简单的。它打印行并包含换行符。你可能会发现\
  \ `print` 指令在编程语言的新版本中有所不同。\n\n`Python` 2.0 是常用版本，而 `Python` 3.0 支持最新特性并在语义上更正确。无论如何，`print`语句在\
  \ 2.0 版本中不被视为函数；因此调用它时不需要括号。另一方面，`print`语句在 3.0 版本中被视为函数；因此你想调用它时必须使用括号。\n\n## 交互模式编程\n\
  \n你可以在不同的模式下执行程序。如果你在调用解释器时不传递脚本文件作为参数，这就是你会得到的：\n\n```\n$ python\nPython 2.4.3\
  \ ( #1, Nov 11 2010, 13:34:43 )\n[GCC 4.1.2 20080704 ( Red Hat 4.1.2– 48 )] on linux2\n\
  Type“help”,“credits” or“license” for more information.\n>>>\n```\n\n看到这个提示时，你可以输入文本并按回车。在这个例子中，我们将使用“Monty\
  \ Python and the Holy Grail”。\n\n```\n>>> print“Monty Python and the Holy Grail”\n\
  ```\n\n注意，如果你使用的是语言的新版本，你需要在打印语句中使用括号，如下所示：\n\n```\n>> print (“Monty Python and\
  \ the Holy Grail”)\n```\n\n无论你使用哪个版本，如果你运行上面的示例代码，你将获得以下输出：\n\nMonty Python and\
  \ the Holy Grail\n\n## 脚本模式编程\n\n如果你带脚本参数调用解释器，脚本将开始执行并一直运行完成。完成后，解释器将不再活动。考虑以下示例。示例程序写在脚本中，并具有\
  \ `.py` 扩展：\n\n```\nprint“Monty Python’s Flying Circus”;\n```\n\n如果你在 `test.py`\
  \ 文件中输入上述源代码并运行它：\n\n```\n$ python test. py\n```\n\n你将获得以下输出：\n\n\n\n\n\n# 蒙提蟒飞行戏\
  \ (Monty Python’s Flying Circus)\n\n执行脚本的另一种方法是修改 `.py` 文件，例如：\n\n```python\n#!\
  \ /usr /bin /python\n\nprint“Monty Python’s Flying Circus”;\n```\n\n如果你这样运行它：\n\n\
  ```bash\n$ chmod + x test.py\n$ ./test.py\n```\n\n你将得到以下输出：\n\n```\nMonty Python’s\
  \ Flying Circus\n```\n\n## 标识符\n\n标识符基本上用于确定函数、变量、模块、类以及任何其他对象。它以下划线 `_` 或字母开头，随后跟随数字、下划线、或其他字母。作为程序员，你可以随意使用任何字母或数字。你可以使用大写和小写字母。\n\
  \n然而，你不能在标识符中使用标点和特殊字符，例如 `@`、`$` 和 `%`。此外，Python 是一种大小敏感的编程语言。这意味着在代码中使用大写写字母时必须小心。例如，`wendy`、`Wendy`\
  \ 和 `WENDY` 是相同的名称，但在 Python 中被视为三个不同的标识符。\n\n### Python 标识符规则\n\n在编写 Python 程序时，你必须遵守以下规则：\n\
  \n*   类名必须始终以大写字母开头，而其他标识符必须以小写字母开头。\n*   如果标识符以单个前下划线开头，它是私有的。\n*   如果标识符以双前下划线开头，它是强私有的。\n\
  *   如果标识符以双后下划线结尾，它是语言定义的特殊名称。\n\n### 保留字\n\n请注意，在 Python 中某些单词不能作为常量、标识符名称或变量。所有关键字都使用小写字母编写。以下是该编程语言的保留字表：\n\
  \n| And | Assert | Break | Class | Continue |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| `def` | `del` | `elif` | `else` | `except` |\n| `exec` | `finally` | `for`\
  \ | `from` | `global` |\n| `if` | `import` | `in` | `is` | `lambda` |\n| `Not` |\
  \ `or` | `pass` | `print` | `raise` |\n| `return` | `try` | `while` | `with` | `yield`\
  \ |\n\n## 缩进与行\n\nPython 中没有使用花括号来表示类定义和函数的代码块。同样，流程控制也不包含其中。如果你想标记此类代码块，必须使用行缩进。你可以对空格进行调整，但要确保对块中的所有语句都进行缩进。为了帮助你进一步理解，请考虑以下示例代码：\n\
  \n```python\nif True:\n    print“Correct”\nelse:\n    print“Incorrect”\n\nif True\n\
  \    print“Input”\n    print“Correct”\nelse:\n    print“Input”\n    print“False\n\
  ```\n\n运行第一个示例会生成输出。然而，运行第二个会导致错误。为什么会发生这种情况呢？你必须记住，在 Python 中，块是通过对具有相同数量空间的连续行进行缩进形成的。\n\
  \n缩进只是分组语句的一种方式。程序员用它来代替代码块的花括号。支持制表符（Tabs）和空格，但标准缩进要求标准代码具有相似数量的空格。通常使用四个空格。看下面的示例：\n\
  \n```python\nw = 1\n\nif w == 1 :\n    # 这显示了正好四个空格的缩进\n    print“ w is 1 .“\n```\n\
  \n### 缩进误言\n\n关于 Python 缩进存在某些误言。以下是其中一些：\n\n*   每份源代码中必须有空白。\n    实际上，你不需要在所有的源代码中使用空白。空白并不一定具有重要意义，尽管缩进是。正如你所学到的，缩进是语句最左侧的空白。在其他任何地方，空白并不那么重要，可以省略。你可以以你喜欢的任何方式使用它，甚至在程序的任何地方插入任意的空白或不包含任何内容的空行。\n\
  *   此外，缩进的精确数量并不真正重要，但嵌套块的相对缩进才重要。当你使用隐式或显式的延续行时，缩进级别实际上并不会被识别。例如，你可以将一个列表跨越多行。这里的缩进完全不重要。看下面的示例：\n\
  \n```python\nfoo = [\n    ‘ a string ‘ ,\n    ‘ another string ‘ ,\n    ‘ a short\
  \ string ‘ ,\n]\n```\n\n\n\n\n解析过程实际上简单且定义明确。通常情况下，缩进级别的更改会被作为标记（tokens）插入到流中。缩进级别使用词法分析器或分词器的栈进行存储。起初，栈中只有一个值为\
  \ `0` 的值，它位于最左侧。\n\n每当开始一个嵌套块时，一个新的缩进级别就会被推入栈中。随后，缩进标记被插入流中，并最终传递给解析器。连续出现多个缩进标记是不可能的。\n\
  \n如果看到某行的缩进级别较小，值将开始从栈中弹出，直到其中一个值顶到栈顶。这等同于新的缩进级别。如果没有找到匹配的值，则会产生语法错误。每弹出一个值，就会生成一个取消缩进标记（dedent\
  \ token）。可以连续出现多个取消缩进标记。在每段源代码的末尾，会为栈中剩余的缩进级别生成取消缩进标记。这一过程会持续发生直到只剩下 `0`。\n\n##\
  \ 多行语句\n\n当你结束一个语句时，可以使用换行，也可以使用续行符（`\\`）来指示该行需要继续。为了帮助你进一步理解这一概念，请考虑以下示例：\n\n```\n\
  total = first_item + \\\n            second_item + \\\n            third_item\n\
  ```\n\n当你编写包含在括号（如 `{ }`、`( )` 和 `[ ]`）内部的语句时，不需要使用续行符。例如，如果你想显示一年的月份，可以写写：\n\n\
  ```\nyear = [‘January’ ,‘February’ ,‘March’ ,‘April’ ,‘May’ ,‘June’ ,‘July’ ,‘August’\
  \ ,‘September’ ,‘October’ ,‘November’ ,‘December’ ]\n```\n\n你被允许在一行编写多个语句，或者创建多个组作为语句块（suites）。在编写多个语句时，请记住分号（`;`）的使用至关重要。只要语句不开启新的代码块，分号就允许你编写尽可能多的语句。考虑以下示例：\n\
  \n```\nimport sys ; y =‘bar’ ; sys.stdout.write ( y +‘ \\n’ )\n```\n\n到底什么是语句块呢？简单来说，它们是由代码块组成的语句组。复合语句或复杂语句（如\
  \ `if`、`while`、`def` 和 `class`）需要一个语句块和一个头部行（header line）。\n\n那么头部行是什么？它们以关键字开始语句并以冒号（`:`）结束。此外，它们后面跟着一个或多行组成语句块的行。考虑以下示例：\n\
  \n```python\nif expression :\n    suite\nelif expression :\n    suite\nelse :\n\
  \    suite\n```\n\n## 引用\n\n作为程序员，你在表示字符串字面量时允许使用单引号（`’`）、双引号（`“`）和三引号（`‘’’` 或 `“””`）。同样，请确保在字符串的开头结尾使用相同类型的引号。通常，三引号用于跨多行的字符串。看以下示例：\n\
  \n```python\nparagraph =“”” 你正在阅读一个由多行和句子组成的段落示例。你是一个优秀的程序员。“””\n```\n\n## 注释\n\n\
  涉及注释时，你应该使用哈希符号（`#`）开头。然而，这个哈号不应该出现在字符串字面量内部。此外，它之后直到行末尾的字符都应该包含在注释中。在 Python 中，解释器不识别注释。为了帮助你进一步理解这一概念，请看以下示例：\n\
  \n```python\n# 这是第一条注释\nprint“ Monty Python’s Flying Circus is a British sketch\
  \ comedy series.” ;\n\n# 这是第二条注释\n```\n\n如果你运行上面的示例，将获得以下输出：\n\n`Monty Python’s\
  \ Flying Circus is a British sketch comedy series.`\n\n你也可以在表达式或语句之后编写另一个注释，如下所示：\n\
  \n```python\nname =“Wendy” # 这是一个示例注释\n```\n\n如果你想对多行进行注释，也可以这样做。例如：\n\n```python\n\
  # 这是一个示例注释。\n# 这也是一个注释。\n# 这是另一个注释。\n# 该注释由 Wendy 编写。\n```\n\n## 空行\n\n这些行在 Python\
  \ 语言中是不被识别的。尽管如此，它们非常注释。它们包含了空白甚至是注释。在交互式解释器会话中，必须使用空行来结束多行语句。\n\n# 第 3 章：数据类型\n\
  \n在 Python 中，输入数据根据不同的类别分类。分类的主要目的是帮助像你这样的程序员更高效地处理信息。这些类别充当数据存储位置，每当你运行 Python\
  \ 平台时都可以访问它们。\n\n## 变量\n\n变量包含专门分配给它们的值。如果你正在编写应用程序复杂代码，你可能希望将信息存储在这些变量中。不要担心，因为你可以在需要时随时访问它们。你甚至可以使用它们来确保你所需的信息。\n\
  \n## 数值类型\n\nPython 中的数字是不同的。在程序处理它之前，它必须经过某些数据方法。\n\n### 整数\n\n所有的整数都是整数。包含小数点的数字不是整数；因此，`3`\
  \ 是整数，而 `3.0` 不是。Python 中的整数以 `int` 类型为特征。\n\n注意，整数有容量限制。如果你尝试生成超出范围的值，将会产生错误。整数通常处理范围在\
  \ `-9223372036854775808` 到 `9223372036854775807` 之间的数字。\n\n`int` 变量有一些有趣的特征。例如，二进制只使用\
  \ `0` 和 `1`，八进制使用 `0` 到 `7`，十进制与十制系统相似，十六进制则使用字母 `A` 到 `F` 以及数字 `0` 到 `9`。\n\n###\
  \ 浮点数\n\nPython 中的任何包含小数点的数字都被视为浮点数。小数点后的数字是否为 `0` 无并不。例如，`3.0`、`1.5` 和 `11.4` 都是浮点数。它们存储在\
  \ `float` 类型中。浮点数相对于整数的一个巨大优势是它们拥有更大的存储空间；因此能够存储非常小或很大的值。\n\n同样，你不应该认为它们拥有无限空间。仍然存在限制。尽管如此，它们可以包含低至\
  \ `±2.2250738585072014e-308` 以及高达 `1.7976931348623157e+308` 的值。赋值方法有两种：首先你可以直接赋值；其次，可以使用科学计数法。记住，负指数产生分数等效值。\n\
  \n### 复数\n\n这些数字由实数和虚数组成。它们通常用于动态系统、量子力学、计算机图形、电气工程和流体力学。复数可以在 Python 和其他少数编程语言中处理。\n\
  \n### 布尔值\n\n这些是两个常量对象 `True` 和 `False`。它们表示真值。在数值语境中，它们充当 `0` 和 `1`。你可以使用 `bool()`\
  \ 函数为值分配布尔值，如果该值可以被解释为真值。\n\n### 字符串\n\n它们是用双引号连接的字符组。考虑以下示例：\n\n\n\n\n\n`TheString`\
  \ =“ Python 的名字源于一个受欢迎的喜剧节目。“\n\n如你在上方所示示例代码所示，短语 `Python got its name from a popular\
  \ comedy show.` 被赋值给变量 `TheString`。\n\n计算机无法理解字母，只能理解数字。因此，当你编写程序时，Python 会根据代表字母的数字对其进行读取和解释。例如，在美国标准信息交换代码（ASCII）中，数字\
  \ `65` 代表字母 `A`。所以，如果你输入：\n\n```python\nord (“ A“ )\n```\n\n你将得到输出：\n\n```\n65\n\
  ```\n\n由于计算机无法理解字母，你必须将字符串转换为数字。你可以使用 `int` 或 `float` 来实现这一点。如果你需要将数字转换为字符串，可以使用\
  \ `str`。\n\n# 第 4 章：运算符\n\n操作数的值通过运算符进行处理。Python 编程语言中使用了七种类型的运算符。下表显示了这些运算符，并对它们的功能进行了简要说明。\n\
  \n## 算术运算符\n\n| 运算符 | 说明 |\n| :--- | :--- |\n| 加法 (`+`) | 它将两个值相加。 |\n| 减法 (`-`)\
  \ | 它从上一个操作数减去第二个操作数。 |\n| 乘法 (`*`) | 它将两个值相乘。 |\n| 除法 (`/`) | 它将第一个操作数除以第二个操作数。\
  \ |\n| 取模 (`%`) | 它将第一个操作数除以第二个操作数并返回余数。 |\n| 幂 (`**`) | 它对运算符执行幂计算。 |\n| 整除(`//`)\
  \ | 它对操作数进行除法，但去掉结果后的小数点。 |\n\n## 比较运算符（关系运算符）\n\n| 运算符 | 说明 |\n| :--- | :--- |\n\
  | `==` | 如果两个操作数的值相等，则条件为真。 |\n| `!=` | 如果两个操作数的值不相等，则条件为真。 |\n| `<>` | 如果两个操作数的值不相等，则条件为真。\
  \ |\n| `>` | 如果左操作数的值大于右操作数的值，则条件为真。 |\n| `<` | 如果左操作数的值小于右操作数的值，则条件为真。 |\n| `>=`\
  \ | 如果左操作数的值大于或等于右操作数的值，则条件为真。 |\n| `<=` | 如果左操作数的值小于或等于右操作数的值，则条件为真。 |\n\n## 赋值运算符\n\
  \n| 运算符 | 说明 |\n| :--- | :--- |\n| `=` | 它将右操作数的值赋值给左操作数。 |\n| `+=` 加并赋值 | 它将右操作数加到左操作数，然后将结果分配给左操作数。\
  \ |\n| `-=` 减并赋值 | 它从左操作数减去右操作数，然后将结果分配给左操作数。 |\n| `*=` 乘并赋值 | 它将左操作数和右操作数相乘，然后将结果分配给左操作数。\
  \ |\n| `/=` 除并赋值 | 它将左操作数除以右操作数，然后将结果分配给左操作数。 |\n| `%=` 取模并赋值 | 它使用两个操作数寻找模，然后将结果分配给左操作数。\
  \ |\n| `**=` 幂并赋值 | 它对运算符执行幂计算，然后将值赋值给左操作数。 |\n| `//=` 整除赋值 | 它对运算符执行整除并将值赋值给左操作数。\
  \ |\n\n## 位运算符\n\n| 运算符 | 说明 |\n| :--- | :--- |\n| `&` 二进制与 | 如果该位在两个操作数中都存在，则复制该位。\
  \ |\n| `|` 二进制或 | 如果该位在任一操作数中存在，则复制该位。 |\n| `^` 二进制异或 | 如果该位在一个操作数中存在但不在另一个中，则复制该位。\
  \ |\n| `~` 二进制按位反 | 它反反位。 |\n| `<<` 二进制左移 | 它根据右操作数指定的位数，将左操作数的值向左移动。 |\n| `>>`\
  \ 二进制右移 | 它根据右操作数指定的位数，将左操作数的值向右移动。 |\n\n## 逻辑运算符\n\n| 运算符 | 说明 |\n| :--- | :---\
  \ |\n| `And` 逻辑与 | 如果两个操作数都为真，则条件为真。 |\n| `Or` 逻辑或 | 如果其中一个操作数非零，则条件为真。 |\n| `Not`\
  \ 逻辑非 | 它反转操作数的逻辑状态。 |\n\n## 成员运算符\n\n| 运算符 | 说明 |\n| :--- | :--- |\n| `Is` | 如果运算符两边的变量指向同一个对象，则结果为真。否则，结果为假。\
  \ |\n| `Not in` | 如果在特定序列中没有找到该变量，则结果为真。否则，结果为假。 |\n\n## 身份运算符\n\n| 运算符 | 说明 |\n\
  | :--- | :--- |\n| `Is` | 如果运算符两边的变量指向同一个对象，则结果为真。否则，结果为假。 |\n| `Is not` | 如果运算符两边的变量指向同一个对象，则结果为假。否则，结果为真。\
