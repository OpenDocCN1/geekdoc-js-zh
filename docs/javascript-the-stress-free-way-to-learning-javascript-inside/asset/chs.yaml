  \n![](img/00029.jpeg)\n\n该代码将给你此结果：\n\n![](img/00030.jpeg)\n\n## 函数的参数\n\n你目前为止看到的函数没有任何参数。然而，在调用/执行函数时，你可以轻松分配各种参数。你可以在函数内部捕获这些参数。一旦捕获，你可以根据需要修改这些参数。\n\
  \n### Return 语句\n\nJavaScript 你在函数中添加 `return` 语句。这个 `return` 语句是完全可选的，尽管如果你想从函数/函数中获取值，就必须使用它。通常，你应该将\
  \ `return` 语句放在函数的最后部分。\n\n例如，你可以向函数传递两个值。然后，你可以预期函数乘以这些值并在程序显示结果。\n\n### 嵌套函数\n\
  \nJavaScript 允许你将函数放在另一个函数内部。这个过程被称为“嵌套函数”。作为一个规则，你不能在循环或条件语句中函数定义。\n\n下面的代码将教你如何嵌套函数：\n\
