  \n## 第 1 章 – 为什么要学习 WordPress？\n\n很多人认为 WordPress 只是另一个博客平台。这种误解是因为在过去，WordPress\
  \ 确实是用于博客。但多年来，WordPress 已经演变成了一个动态内容管理系统（CMS）。虽然你仍然可以使用这个 CMS 创建一个基础博客，但它现在允许你构建一个功能完善的网站。\n\
  \nWordPress 最好的地方在于它非常灵活且易于使用。这是 WordPress 成为今天最流行的 CMS 的主要原因。目前网上活跃的网站约有 23% 是由\
  \ WordPress 驱动的。由于其多功能特性，许多知名品牌都在使用 WordPress 来驱动它们的网站，例如 eBay、《纽约时报》迪士尼、Facebook、《时代杂志》CNN、LinkedIn、索尼和谷歌。\n\
  \n让我们简单了解一下为什么你应该学习并使用 WordPress。\n\n### WordPress 赋予你自由\n\n基本上，WordPress 是一个免费软件。你有权以你任何需要的方式对其进行下载、安装、修改和使用。你可以构建任何类型的网站。它还是一个开源平台，这意味着源代码对任何人开放，方便他们学习、修改和实验。\n\
  \n全球数百万的人正在使用 WordPress，每天都有新人利用这个出色的 CMS 创建网站。人们能够轻松适应 WordPress 的主要原因是因为它非常容易使用和学习。\n\
  \n### 你可以轻松地管理 WordPress\n\nWordPress 内置了更新程序，这使得你能够通过 WordPress 内部的管理员仪表板轻松更新插件和模板。当\
  \ WordPress 有更新版本时，它还会通知你，你可以通过几次鼠标点击轻松完成更新。只要你设置了定期备份，所有内容都是安全的。\n\n### 你可以通过主题和插件扩展\
  \ WordPress\n\n值得注意的是，大多数使用 WordPress 的人既不是程序员，也不是网页设计师。事实上，有成千上万的个人在没有任何网站设计基础知识的情况下开始使用\
  \ WordPress。\n\nWordPress 之所以成为这样一个动态平台的主要原因是，你可以从数以千计的免费主题（网页模板）中进行选择，以改进网站的外观。因此，你可以根据网站的用途赋予其独特的设计和感觉。你可以为几乎任何需求找到找到的\
  \ WordPress 主题。你可以在第 2 章中了解更多信息。\n\nWordPress 还提供了极佳的灵活性，可以通过插件进行扩展。与主题类似，你可以使用数千个插件来增强你的网站。这些插件可以增强\
  \ WordPress 的功能，并为你的网站添加整个全新的平台。你可以在第 2 章中学习更多关于插件的内容。\n\n### WordPress 友好 SEO\n\
  \nWordPress 使用高质量且符合标准的代码开发，这些代码产生的语义化标记使你的网站对搜索引擎非常友好。WordPress 的设计和主题对搜索引擎非常友好，通过使用\
  \ SEO 插件，还可以使其对 SEO 更具吸引力。\n\n### WordPress 可以整合各种媒体\n\nWordPress 提供了一个动态平台，允许你使用不同的媒体类型。它内置的支持允许你处理视频、音频和照片内容。它还支持嵌入功能，允许你嵌入来自\
  \ YouTube 和 Vimeo 等外部网站的视频。\n\n### WordPress 提供可靠的安全功能\n\n网络安全是 WordPress 的基础元素之一，因此你可以通过该平台安全地运行任何网站。但由于互联网的广阔，这无法完全确定。互联网上存在想要进入尽可能多网站的入侵者。好在\
  \ WordPress 对安全插件防止任何形式的安全威胁。\n\n### 使用 WordPress 的方法\n\n你可以通过多种方式使用 WordPress。许多企业网站运行在\
  \ WordPress 上，并作为其销售产生的关键环节。你可以将 WordPress 用于以下用途：\n- 博客（个人或商业）\n- 在线游戏厅\n- CMS\n\
  - 作品集\n- 画廊\n- 在线商店\n- 会员门户\n- 视频策展网站\n- 评分网站\n- 以及更多！\n\n我希望这一章回答了你关于为什么要使用 WordPress\
  \ 问题。学习 WordPress 的最佳方法是开始使用它。在接后的章节中，你每天可以学习 WordPress 的基础元素。\n\n## 第 2 章 – 第一周：设置、仪表板、管理栏、设置、链接和图像\n\
  \n只要你能在两周内每天抽出一两个小时，WordPress 就是很好学的。你只需要非常基础的互联网技能，当然还需要具备准确遵循指令的能力。你甚至不需要学习 HTML\
  \ 或或其他语言来创建网站。尽管编程和编码技能在将来会有帮助，但开始使用 WordPress 并非必须。\n\n\n\n\n\n如果你担心其中一个比另一个更容易用，不必担心，它们的界面是相似的。使用\
  \ `WordPress.org` 是理想之选，因为你可以对自己的网站拥有完全控制权。尽管如此，你仍然需要选择一个适合你偏好和需求的 WordPress 平台。\n\
  \n选择平台后，下一步是选择你的域名和主机。请注意，域名是用户在搜索栏中输入访问你的页面所需的网页地址。然后，你需要选择网络托管服务，以便其他用户用户访问你的网站。\n\
  \n在网络托管提供商注册后，你可以使用 `SimpleScripts` 安装 WordPress，特别是如果你选择了 `BlueHost` 的话。\n\n###\
  \ 第一周第 2 天 - 仪表盘基础\n\n安装 WordPress 后，你就可以开始构建你的自定义网站或博客了。然而，在发布任何内容之前，最好先熟悉仪表盘的基础知识。仪表盘位于屏幕左侧，登录\
  \ `wp-admin` 账户后即可轻松看到。大多数用户将此称为你网站的后端。\n\n通过仪表盘的首页，你可以轻松访问网站内容，并查看 WordPress 平台的其他区域。仪表盘以称为\
  \ `Widgets`（小部件）的独立区块显示信息。默认的 WordPress 小部件有：`Welcome at a Glance`（欢迎概览）、`Quick\
  \ Draft`（快速草稿）、`Activity`（活动）和 `WordPress News`（WordPress 新闻）。\n\n`Welcome` 小部件显示创建新网站时可以执行的顶部任务链接。\n\
  \n`At a Glance` 小部件简要提供了你网站上页面、文章和评论的数量。每个内容类型都以链接形式显示，点击它们后你将被重定向到特定区域，以便轻松管理内容。\n\
  \n`QuickDraft` 小部件允许你轻松地编写新的文本内容。你可以快速编写标题、添加媒体、输入内容、插入标签、保存草稿或直接 `Publish`（发布）。\n\
  \n`Activity` 小部件显示最近的评论、已发布的文章和计划发布的文章。\n\n`WordPress News` 小部件包含来自 WordPress 官方博客的最新新闻、文章和公告。\n\
  \n你可以通过将鼠标指针悬停在标题栏上来展开、折叠和重新排列小部件。如果鼠标变成了四箭头图标，你可以按住左鼠标键并将小部件拖动到你想移动的区域。这被称为拖放功能。\n\
  \n你还可以通过插件或特殊的程序代码添加新的小部件。\n\n### 第一周第 3 天 - 管理员栏\n\n`Admin Bar`（管理栏）位于屏幕的最顶部。WordPress\
  \ 标志位于仪表盘的最左侧。鼠标悬停在标志上，你将看到有关 WordPress 特定信息的链接。如果你需要访问支持论坛或提供反馈，这些链接可以对你有所帮助。\n\
  \n你的网站名称位于标志的右侧。你可以悬停在上面，将看到一个子菜单，以访问你网站的前端。下一个区域提供了评论的简要视图。\n\n在左侧，你可以找到 `+ New`（新建）的链接。一旦你悬停在此链接上，将出现一个子菜单，将你重定向到用户、页面、媒体和文章的\
  \ `Add New`（添加）界面。你也可以使用仪表盘左侧区域的导航来完成这些操作，但如果你想快速操作，这些链接会大有帮助。\n\n你还可以在右侧区域看到显示“Howdy,\
  \ your name”文本的区域。你可以悬停在该区域以访问子菜单，用它你可以退出网站或编辑个人资料。\n\n### 管理栏的前端视图\n\n如果你当前登录了你的\
  \ WordPress 网站，`Admin Bar` 在你网站的前端站点上可见。尝试悬停在网站名称上并点击 `visit site`（访问站点），它将重定向到你网站的前端。\n\
  \n一旦你悬停在网站部分的标题上，你可以看到仪表盘链接，带你回到仪表盘首页，以及指向头部、背景、菜单、`widgets`（小部件）和主题的链接。请注意，这些部分也可以仪表盘左侧的导航面板中找到。\n\
  \n### 如何关闭管理栏视图\n\n`Admin Toolbar`（管理工具栏）通常有用，但有时你可能想关闭它以查看网站前端的完整视图。请注意，只有当你以 `admin`\
  \ 身份登录网站时，`Admin Bar` 才会出现。\n\n如果你想关闭它，只需点击 `Edit my Profile`（编辑我的资料）功能。会出现一个屏幕，你可以在文本旁边找到复选框：`Show\
  \ Toolbar when viewing site`（查看站点时显示工具栏）。你只需要取消勾选该框，滚动到底部并点击 `Update profile`（更新配置）来保存更改。\n\
  \n### 第一周第 4 和 5 天 – 探索 WordPress 设置\n\n在仪表盘上，找到 `Settings`（设置）菜单并悬停在上方。将出现一个子菜单，你可以在其中访问\
  \ WordPress 设置的几个选项：`General`（常规）、`Reading`（阅读）、`Writing`（写作）、`Media`（媒体）、`Discussion`（讨论）和\
  \ `Permalinks`（固定链接）。\n\n##常规设置\n\n为了探索，你可以首先进入 `General Settings`（常规设置）。在此选项中第一个元素是\
  \ `Site Title`（站点标题）和 `Tagline`（标语）。确保这些文本与你的网站匹配，因为你的站点标题将用于 SEO。默认情况下，WordPress\
  \ 显示“just another WordPress site”作为标语。你需要更改此标语来描述你的网站，因为它对你网站的 SEO 至关重要。\n\n接下来是\
  \ `WordPress Address (URL)`（WordPress 地址）。对于网站地址 URL，如果你希望网站主页与安装 WP 的目录分开，可以输入该\
  \ URL。此时最好不要动这些 URL。\n\n然后，你还会看到 `Email Address`（电子邮件地址），你将其用于管理目的，包括新用户通知。还有 `Membership`（会员）设置。WordPress\
  \ 允许在线用户注册你的网站。如果会员对你的网站至关重要，这是一个非常有用的功能。\n\n同时，`New User Default Role`（新用户默认角色）设置为\
  \ `subscriber`（订阅者）。现在不要碰此设置，因为你可能会向任何注册网站的用户授予管理员权限。\n\n然后，是 `Timezone`（时区）。浏览列表选择你偏好日期格式所在的城市。请注意，此格式将出现在你的文章中。在你更新这些设置后，不要忘记\
  \ `Save changes`（保存更改）。\n\n##阅读设置\n\n`Reading Settings`（阅读设置）显示了影响内容显示的设置。在这里你可以调整网站首页的显示方式——静态页面或最新的博客文章。在构建几个页面后，你可以在此设置中列出这些页面，以便它们出现在前端。\n\
  \n下一个设置部分将允许你控制 `RSS feeds`（RSS 馈）的内容显示，包括显示的最大文章以及你是只想显示摘要还是全文。`Search engine visibility`（搜索引擎可见性）是最后一个部分。如果你不想让搜索引擎索引你的网站，应该勾选\
  \ `Discourage search engines from indexing this site`（阻止搜索引擎索引此站点）。如果你处于开发阶段，这是一个很好的设置，此时仍不建议索引。\n\
  \n记得 `Save Changes`（保存更改）。\n\n##写作设置\n\n`Writing Settings`（写作设置）影响你网站的写作和发布。顶部的部分允许你控制仪表盘内的编辑器，而其他部分允许你控制外部发布方法。\n\
  \n第一个部分显示了默认分类格式和文章格式的选项。你还会看到 `Press This` 书签插件部分，它允许你轻松对互联网上发现感兴趣的内容写博客。如果你想使用它，首先需要将屏幕上的链接拖到浏览器的书签栏中。如果你在另一个站点上，只需点击书签即可访问弹出的窗口，通过你的博客分享内容。\n\
  \n\n\n\n同时，`通过电子邮件发布设置`将允许您向您的网站发送一封包含文章内容的电子邮件。为了使用此设置，您应该使用 `POP3` 访问设置一个秘密电子邮件账户。最后一部分可用于更新服务。一旦您发布了新文章，WordPress\
  \ 将立即通知您更新。请务必点击`保存更改`。\n\n### 媒体设置\n\n`媒体设置`页面允许您为想要添加到文章中的图像设置最大尺寸。如果您希望图片具有相同的大小，或者想为图片尺寸设置默认设置，这些设置将帮助您节省时间。\n\
  \n`上传文件`选项允许您选择是否希望将上传的文件按月份或按年份组织。请务必点击`保存更改`。\n\n### 讨论设置\n\n`讨论设置`允许您管理针对您的文章和页面的评论及链接。\n\
  \n第一部分是`默认文章设置`。第一个设置允许您管理指向其他博客的链接。第二个设置允许您管理指向您网站的追回链接（trackbacks）和 pings 链回链接（ping\
  \ backs）。最后，第三个设置允许您的网站访问者在新文章上发表评论。如果您不希望访问者对文章发表评论，可以取消勾选此框。\n\n`其他评论设置`允许您选择访问者发表评论的指南以及您如何管理他们的评论。\n\
  \n对于`每当……时邮件通知`部分，您可以选择在有人发表评论或评论被管理员处理时通过电子邮件接收通知。\n\n`在评论出现之前`部分允许您管理已发布的评论。通过此功能，您可以选择管理员是否应先批准评论，或者评论是否自动发布。\n\
  \n在`评论审核`部分中，您可以根据链接的数量更改评论的管理方式。在框内，您可以包含 `IPs`、`emails`、`names`、`words` 和 `URLs`\
  \ 来过滤评论以进行审核。此功能配合评论黑名单，可以帮助您防御博客免受不当和垃圾邮件评论的侵害。\n\n还有`头像（Avatar）`设置。您可以开启在您的网站上发表评论的用户头像，为还没有自己头像的用户选择默认头像，或者根据他们的评分过滤其评论。\n\
  \n再次，请务必点击`保存更改`。\n\n### 永久链接设置\n\n永久链接（Permalinks）是指每个页面和博客文章（包括标签和分类存档）的永久 URL。通常，永久链接是用于链接到您内容的网页地址。它的名称是由\
  \ permanent（永久）和 link（链接）组合而成的，因此称为 permalink。\n\nWordPress 中的`永久链接设置`允许您管理您的永久链接的默认结构。您可以从常用设置中选择，也可以构建自定义\
  \ URL。默认情况下，WordPress 使用带有问号和数字的 URL。您可能希望在此处更改永久链接以提高其向前兼容性、可用性和美观性。\n\n### 第一周第\
  \ 6 天 – 创建 WordPress 文章\n\n要创建您的第一篇文章，请在`仪表盘`的左侧找到`文章（Posts）`菜单。您可以点击展开它以访问子菜单，或直接将鼠标悬停在`文章`链接上。\n\
  \n在工具栏的`+ 新建`链接中，您也可以找到`添加新文章`页面。只需点击`添加`链接即可进入`添加文章`页面，这样您就可以开始创建第一篇 WordPress\
  \ 文章了。\n\n您可以在第一个框中输入文章标题。\n\n下方是`文章编辑器`或`文章格式设置`部分，您可以在这里输入或粘贴文章内容。右侧有两个标签页，显示了文章编辑的两种模式：`文本`和`可视化`。\n\
  \n`文本`标签允许您访问文章编辑器的纯文本 HTML 版本。您可以使用此模式来编辑文章的 HTML 代码。如果您不熟悉 HTML，建议使用可视化模式。\n\n\
  `可视化`标签非常适合熟悉 `WYSIWYG`（所见即所得）概念的开发者。它带有一个格式化工具栏，有不同的选项来格式化您的文章。如果您使用过 Microsoft\
  \ Word，这些图标中的许多看起来非常眼熟。\n\n`发布`框位于屏幕右侧栏顶部。如果您想保存文章，可以将其保存为草稿。`预览`按钮允许您预先查看文章在发布后的实际显示效果。`状态`将让您知道文章目前是草稿、已保存、已发布，或者如果您安排了发布时间，则它正处于待审核状态。\n\
  \n随后的链接允许您查看文章的可见性，或查看网站访问者将看到的内容。`发布`行显示文章将是立即发布还是在未来的某个日期发布。下一部分是分配给您的文章的`标签`和`分类`。稍后保存这节课。\n\
  \n如果您想更改编辑器的屏幕选项，可以点击右上角的`屏幕选项`标签。这将展开链接，您将看到这些选项，这些选项将显示在屏幕的文章编辑器上。\n\n在文章编辑器中，您可以直接拖放这些框的排列，以更改您希望它们在页面上的显示方式。\n\
  \n如果您在添加新文章时需要帮助，可以随时点击右上角的`帮助`标签。从这里，您可以轻松参考插入媒体、使用编辑器、添加文章标题的实用提示，以及自定义文章显示的指引。\n\
  \n### 第一周第 7 天 – 添加链接和图片\n\n链接对于您内容的 SEO 至关重要，而图片是提高文章吸引力和可读性的理想选择。WordPress 让向您的网站添加这些元素变得简单。\n\
  \n### 添加链接\n\n在页面或文章编辑器中，选择并高亮想要链接的文本，然后点击工具栏中的链接按钮。这将显示一个框，您可以在其中输入特定的 `URL`。如果您倾向于链接到现有内容，只需点击展开此部分。通过此功能，可以使用搜索栏来搜索网站，以及列表。如果链接准备好了，只需点击`添加链接`按钮。您的选择文本现在有了链接。如果您想删除链接，再次选择文本并点击`取消链接`按钮。\n\
  \n### 添加图片\n\n在文章中的合适位置插入您的图片。在文章编辑器的上方工具栏中，您将看到`添加媒体`按钮。点击此按钮显示`插入媒体`框。\n\nWordPress\
  \ 使用媒体库来存储所有的媒体文件（如视频和图片）。在此框中，您可以选择上传新文件或使用媒体库中的现有文件。如果您想上传图片，点击`选择文件`按钮并找到您想要使用的图片。\n\
  \n图片上传后，您会注意到它已添加到媒体库。在框的右侧区域，您将看到该附件的详细信息。在此部分，您可以查看`描述`、`替代文本`、`说明`和`标题`。您还可以选择图片的对齐方式，如`右对齐`、`左对齐`或`居中对齐`。\n\
  \n确保勾选框框。点击`插入文章`按钮。现在您可以看到图片已插入到文章中。\n\n\n\n在选择高级设置选项卡时，你将看到图片当前托管的链接、添加图片内边距的属性和样式、`CSS\
  \ Class` 以及图片以像素为单位的实际高度和宽度。\n\n接下来，返回图片。右上角的图标将允许你从文章中删除图片。点击 `Add Media`（添加媒体）按钮，你会看到相同的插入媒体对话框。在左侧，你将看到设置图库和选择特色图片的选项。如果你在媒体库中有足够的图片，你就可以向文章中添加整个图片图库。\n\
  \n特色图片（Featured images）被某些主题使用。如果你选择的主题支持特色图片，请选择该图片并返回文章编辑器。点击预览按钮并检查图片是否已插入。\n\
  \n# 第 3 章 – 第二周\n\n## 第 2 周第 1 天 – 分类与标签\n\n你可以将文章组织到各种分类中，例如主题或学科领域。例如，如果你正在写一篇文章，请考虑该文章更广泛的主题。如果你计划未来编写更多关于该主题的文章，那么将这些文章组织在一起是理想的。\n\
  \n### 添加新分类\n\n如果你还没有包含分类，点击显示 `+ Add new category`（添加新分类）的链接。点击 `Add new category`\
  \ 插入新分类。你会发现分类列表中已包含了一个新分类。要将分类添加到文章中，点击分类旁边的复选框。\n\n管理文章分类另一种方法是导航到位于 `Dashboard`（面板）菜单中的\
  \ `Posts > Categories`（文章 > 分类）链接。如果你点击 `Categories` 链接，就可以访问 `Categories` 页面。在这里，你可以查看右侧所有的分类，你也可以在其中添加新条目。\n\
  \n### 分类描述\n\n描述区域允许你添加更多关于与该分类关联的文章信息。某些 WordPress 主题会显示这些信息。\n\n### 分类层级\n\n与标签不同，分类可以嵌套成层级。例如，你可能有一个\
  \ `News`（新闻）分类，并在下方包含 `World News`（国际新闻）和 `Sports News`（体育新闻）子分类。\n\n### 分类别名（Slug）\n\
  \n`Category Slugs` 是分类的链接友好版本。这通常是小写形式，仅包含数字、连字符和字母。\n\n### 分类和标签的区别是什么\n\n将你的网站想象成一本书吧。分类类似于目录，而标签则像索引部分。\n\
  \n## 第 2 周第 2 天 – 创建 WordPress 页面\n\n创建新页面的第一步是在 `Dashboard` 中找到 `Pages`（页面）菜单。只需点击\
  \ `Add new`（新增）选项即可。\n\n你会发现页面编辑器与文章编辑器具有相同的界面。唯一的区别在于屏幕右侧部分可以找到几个框。添加页面标题，例如 `Contact\
  \ Us`（联系我们）。记住，如果你创建了固定固定链接，页面标题也将用作 `URL slug`。\n\n在为页面添加内容后，你可以 `Publish`（发布）页面编辑器的部分内容，这与你写文章时类似。如果你准备好发布，可以选择立即发布、安排在未来发布或对其进行排期。\n\
  \n`Page Attributes`（页面属性）部分包含了你新页面的父页面和模板。在 `Parent`（父级）部分，你可以根据层级组织页面。例如，你可以创建一个新页面并在其下方添加页面。请注意，对想要嵌套页面的层数没有限制。\n\
  \n`Template`（模板）部分允许你为新页面包含一个模板。如果你的主题允许自定义页面模板，这是可以的。\n\n`Order`（排序）界面允许你按数字顺序组织页面。页面通常按字母顺序组织，但你可以通过在此框中提供数字来选择自己的安排方式。\n\
  \n先预览页面，如果无误，则点击 `Publish`（发布）。\n\n## 第 2 周第 3 天 – 应用 WordPress 模板\n\n某些 WordPress\
  \ 主题带有模板，这些模板会更改网站前端的页面格式。通过页面模板，主题可以为页面外观以及特定元素的放置位置提供一些灵活性。\n\n添加页面模板的第一步是浏览 `Dashboard`\
  \ 中的 `Pages` 菜单，并找到编辑或添加新页面的链接。找到 `Page Attributes` 区域，在该你可以看到可以使用的模板下拉列表。根据 WordPress\
  \ 主题，你可以在下拉菜单中看到某些页面模板选项。\n\n要查看模板将如何更改页面外观，选择一个模板并预览它，以检查它是否适用于该页面。\n\n一旦你选择了想要使用的模板，就可以点击\
  \ `Publish`（发布）。\n\n## 第 2 周第 4 天 – 安装插件\n\n插件允许你为你的 WordPress 网站添加更多功能。安装插件非常简单。\n\
  \n第一步是在登录网站 `Dashboard` 后找到并展开 `Plugins`（插件）菜单。寻找 `Installed Plugins`（已安装插件）页面，你可以在那里看到网站上已安装插件列表。某些插件在安装\
  \ WordPress 时会自动安装，例如 `JetPack` 和 `Akismet`。\n\n要添加新插件，只需点击 `Add New`（新增）选项。从该页面，你可以选择从\
  \ `WP Plugin Directory`（插件 目录）浏览你想要安装的插件。你还可以根据插件的发布日期、人气或你标记为收藏的项目来过滤搜索。\n\n要开始上传插件，请遵循此流程：`Choose\
  \ file`（选择文件） > 找到插件 zip 文件 > Install Now（立即安装） > Activate（激活）。\n\n`Dashboard` 中\
  \ `Plugins` 下的最后一个菜单部分是 `Editor`（编辑器），你可以通过修改单独的文件使用它更改插件的某些元素。但请记住，如果你进行了某些修改，插件更新将覆盖你的更改。如果你不懂\
  \ PHP 代码，请不要修改插件。\n\n## 第 2 周第 5 天 – 管理 WordPress 主题\n\n管理 WordPress 主题的第一步是浏览 `Dashboard`\
  \ 中的 `Appearance`（外观）菜单。选择 `Manage Themes`（管理主题）页面。\n\n在顶部，你可以看到 `Active theme`（活动主题）以及\
  \ `Customize`（自定义）选项。当你点击此链接时，你可以看到一个预览窗口，允许你对 `Tagline` 和 `Site Title` 进行更改。\n\n\
  如果你返回 `themes` 标签，可以查看活动主题下的可用主题列表。这些主题已安装在你的 WP 站点上。\n\n如果你选择任何主题下方的 `Live Preview`（实时预览）链接，就可以看到网站使用该主题的效果。在预览中，你可以浏览不同的页面，查看该主题如何处理模板、存档和文章。在预览窗口的左侧，你可以编辑主题设置。\n\
  \n确保点击左上角的 `Save & Activate`（保存并激活）按钮以接受新主题。\n\n\n\n\n第一步是展开仪表面板左侧的 `Appearance`（外观）菜单。点击\
  \ `Appearance` 中的 `Menus`（菜单）链接，这将激活 `Menus` 编辑页面。输入你所需的名称，并点击 `Create menu`（创建菜单）。然后，你可以在左侧的框中添加菜单项目，例如链接、分类和页面。\n\
  \n如果你想更改在此页面看到的菜单选项，只需展开 `Screen Options`（显示选项）选项卡。然后，添加其他菜单选项，如 CSS 类、格式、标签和文章。\n\
  \n一旦整理好菜单项目，请务必点击 `Save Menu`（保存菜单）。\n\n## 第 2 周第 7 天 – 管理评论\n\n在基于 WordPress 构建的站点上管理评论与处理页面和文章的方式类似。\n\
  \n在仪表面板中，找到 `Comments`（评论）页面。你可以像自定义其他 WordPress 界面一样来自定义此界面。黄色指示器表示该评论需要审核。你可以通过\
  \ `Bulk Actions`（批量操作）或将悬停在操作链接上对评论进行回复。\n\n在 `Author`（作者）列中，除了作者姓名、博客 URL 和电子邮件地址外，还会显示评论者的\
  \ IP 地址。点击此链接将显示来自该特定地址的所有评论。\n\n在 `Comment`（评论）列中，每条评论都包含关于 `Submitted on`（提交时间）的信息，随后是评论发布在网站上的日期。点击时间和日期链接会将你重定向到网站上的那条评论。当你悬停在评论上时，你将看到对该评论进行的操作：批准、回复、编辑、垃圾桶或标记为垃圾邮件。\n\
  \n该列中有三个元素：`In Response To`（回复）。该文本指向评论所关联的文章名称，以及指向该特定条目编辑器的链接。\n\n# 额外：立即领取你的免费赠送书籍！\n\
