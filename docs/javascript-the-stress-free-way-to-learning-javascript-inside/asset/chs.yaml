  \ Up Your Computer`。\n\n在屏幕左侧选择 `Create System Image`，并选择你想保存的位置。\n\n### 更新\n\n\
  在安装 `Windows 10` 之前，你必须先进行更新。要做到此，请按照下面的说明操作：\n\n- 如果你使用的是 `Windows 7`，前往 `Start\
  \ Menu` > `Control Panel` > `System and Security` > `Windows Update`。\n- 对于 `Windows\
  \ 8`，前往 `Start` > `PC Settings` > `Update and Recovery` > `Windows Update`。\n- 对于其他版本，只需等待电脑发送更新提示即可。\n\
  \n### 等待 Windows 10 的提示。\n\n### 是是安装时间了！\n\n注意，这有两种方法可以实现。查看下方的第一种：\n\n你可以尝试这样做：\n\
  \n如果你的电脑运行在 `Windows 7` 或 `8` 或更早的版本上，你应该先从 `Microsoft` 下载一个 `Media Creation Tool`。检查你需要的\
  \ `32-bit` 还是 `64-bit` 版本。\n\n运行你下载的工具，然后选择 `Create Installation Media for Another\
  \ PC`，然后点击 `Next`。\n\n现在，在点击 `Next` 之前选择 `Language`、`Edition` 和 `Architecture`。\n\
  \n当询问使用哪种介质时，选择 `USB Flash Drive`。\n\n然后，将闪存驱动插入 `USB Port`，等待提示出现并点击 `Next`。电脑现在将下载\
  \ `Windows 10`。\n\n大约 10 分钟后，在 `Explorer` 中打开驱动器，然后选择 `Setup`。\n\n等待 `Ready to Install`\
  \ 提示，然后选择 `Choose What to Keep`。\n\n等待剩余的安装完成，你就大搞定了！\n\n或者，你也可以尝试下面的这种方法：\n\n第二种方法仅适用于那些电脑已经运行\
  \ `Windows 10` 的用户。如果你对目前的设置不满意，或者只是想完全刷新你的电脑，就应该这样做。你可以这样做：\n\n- 从 `Windows 10\
  \ Menu` 点击 `Settings`。\n- 点击 `Update and Security`。\n- 点击 `Recovery` > `Reset this\
  \ PC` > `Get Started`。\n- 选择 `Remove Everything`。\n- 等待剩余的安装完成。\n\n### 第二章：使用开始菜单\n\
  \n很多人发现 `Windows 10 Start Menu` 令人困惑——这确实非常明显，尤其是在刚开始。但别担心，在本章中，你将学习如何充分利用那个 `Start\
  \ Menu`——并确保它对你有效！\n\n你可以这样使用 `Start Menu`：\n\n1. 点击 `Start Menu`。\n2. 点击 `All Apps`。\n\
  3. 在 `Search Field` 中输入你要查找的应用或文件。\n4. `Power` 按钮允许关机。\n5. 要锁定电脑，只需右键点击账户名称即可可以看到以下选项：`lock`、`change\
  \ account`、`sign out`。\n6. 你可以在 `Start Menu` 上固定某些项目。要这样做，只需右键点击项目并 `Pin to Start`。\n\
  7. 要管理屏幕右侧的磁贴，只需右键点击磁贴并选择 `Unpin from Start` 或 `Pin to Taskbar`。\n\n### 同时使用开始菜单和全屏\n\
  \n如果你是一个多任务高手，并且想同时使用 `Start Screen` 和 `Start Menu`，你需要：\n\n- 点击 `Start` 按钮，进入 `Settings`\
  \ > `Personalization`。\n- 点击 `Start`。\n- 选择 `Use Fullscreen`。\n- 点击 `Start Screen`\
  \ 让 `Start Menu` 消失。\n- 取消选择 `Use Fullscreen` 返回 `Settings`。\n\n### 定义开始菜单\n\n注意，你可以完全自定义你看到的内容以及你希望电脑运行的方式！\n\
  \n- 要要在 `Start Menu` 和 `Start Screen` 之间切换，打开 `Settings` > `Personalization` > `Start`\
  \ > `Start Behaviors` > `Use Fullscreen Start when in Desktop`。\n- 要更改 `Start Menu`、窗口边框和任务栏的颜色，请前往\
  \ `Settings` > `Personalization` > `Colors`。如果你想要彩色的电脑，只需开启 `Show Color on Start`、`Taskbar`\
  \ 和 `Action Center` 即可实现。\n- 要自定义你看到的内容，前往 `Settings` > `Customize`。在那里，你会看到来自 `Microsoft`\
  \ 的建议应用列表。另一个设置将显示你最近打开的程序设置，最后一个是关于 `Jump List items` 的。\n- 点击 `Start` > `Choose\
  \ Folders` 选择你想在屏幕上看到的文件夹。\n- 再次点击 `Start` 查看你是否拥有所有文件夹和文件。\n\n### 秘密菜单\n\n还有一个所谓的“秘密”\
  \ `Start Menu`，你也可以使用并自定义。这是访问它的方法：\n\n右键点击 `Start icon`。\n\n你将看到一个包含几乎可以在电脑上进行的所有操作的菜单！\n\
  \n\n\n\n如果使用触摸屏，可以通过按住启动按钮至少 5 到 10 秒来访问此菜单！\n\n# 第 3 章：理解设置\n\n通过了解设置并知道如何使用它们，你将能够轻松地操作\
  \ Windows 10 并发挥其最大价值！\n\n## 账户\n\n你可以在 `Charms` 栏下找到 `账户` 标签，它基本上关于你的 Windows 账户。\n\
  \n你的 `账户` 是你的主登录账户。它与微软的云网络相连。\n\n`登录选项` 将询问你具体想以何种方式打开电脑。你可以使用普通的“密码+密码”登录，也可以选择\
  \ `Windows Hello`，这将允许你使用生物识别进行登录。\n\n`工作访问` 告诉你这台 电脑或你的账户是否已连接到另一个网络。\n\n`家庭和其他用户`\
  \ 允许你向电脑添加更多管理员。要执行此操作，只需点击 `为指定的访问设置账户` > `选择账户` > `选择应用`。\n\n`同步我的设置` 允许你将此 PC\
  \ 与你的其他设备以及家中的电脑进行同步。\n\n## 隐私\n\n当然，你也可以在 `Windows 10` 的帮助下确保你的隐私得到保护。方法如下：\n\n\
  `通用` 关乎决定你是否希望你的名字出现在应用程序、程序、照片以及任何连接到你电脑的文件中。\n\n`位置` 基本上基于 `GPS` 工作，并允许你决定是否让其他人看到你所在地。\n\
  \n`麦克风` 为你提供了开启或关闭麦克风的机会。\n\n`语音、笔画、打字` 主要为你提供是否使用 `Cortana`（Windows 10 的数字助手）的选项。\n\
  \n`账户信息`、`日历`、`联系人`、`消息`、`无线电` 仅让你决定是否将其与其他设备同步。\n\n`其他设备` 允许你将 `Xbox One` 以及在那里找到的信息与你的微软账户同步。\n\
  \n`反馈`。选择你是否希望微软每天、每周一次、自动地、总是或从不向你征求反馈。\n\n## 设备\n\n`设备` 标签提供了关于你想要与 PC 连接/同步的哪些设备的选项。\n\
  \n`打印机和扫描仪` 允许你向电脑添加打印机。要执行此操作，只需点击 `设备和打印机` > `设备管理器` > `相关设置` > `添加打印机或扫描仪` 并按照屏幕上的说明进行操作。\n\
  \n同时，`连接设备` 关于其他不是打印机或扫描仪的连接设备。\n\n`鼠标和触摸板` 为你提供了配置 `鼠标和触摸板` 设置的机会。只需选择 `鼠标和触摸板`\
  \ > `相关设置` > `其他鼠标选项`。\n\n`打字` 允许你选择是否想使用物理键盘或屏幕键盘。\n\n`自动播放` 允许你选择是否开启或关闭 `自动播放`。\n\
  \n## 轻松功能\n\n`轻松功能` 标签包含 Windows 10 的辅助功能设置。\n\n`讲述器` 帮助你获得语音协议。它基本上读取屏幕显示的内容或你输入的任何内容，你可以在\
  \ `David` 和 `Zira` 之间选择你的讲述器。你还可以添加你想要听到的声音或你想要关注的语言。\n\n`放大镜` 为你提供一个浮动工具栏并放大你的屏幕。\n\
  \n`高对比度` 允许你选择 `高对比度` 主题。\n\n`闭路字幕` 为你提供字幕以帮助你理解你在屏幕上听到的内容。它适用于 `Hulu` 和 `Netflix`\
  \ 等网站。\n\n`键盘和鼠标` 包含了，嗯，`键盘和鼠标` 设置——就像 Windows 早期版本中的一样。\n\n## 个性化\n\n尽管如此，你也有机会个性化你的\
  \ Windows 10 体验。请注意，你会有更多机会自定义你的体验——更多内容将在后面的章节中介绍。这里是基础知识：\n\n`背景` 主要是你电脑的壁纸，并选择你希望照片如何适应你的屏幕。\n\
  \n`颜色` 是将用于桌面、工具栏等的颜色。\n\n`锁定界面` 是你在屏幕锁定时在屏幕上看到的内容。点击 `图片`，你将看到最近使用的 5 张锁定屏幕图片，以及一个\
  \ `浏览` 按钮供你从文件中选择照片。选择 `幻灯片` 将将照片的幻灯片作为你的锁定屏幕。你还可以选择 `屏幕超时时间` 以及更多 `屏幕保护程序设置`。\n\
  \n`主题` 将帮助你选择想要使用的主题。进入 `经典主题设置` > `相关设置` 来执行此操作。\n\n`开始` 帮助你开启或关闭应用程序和通知以及更多。你将在下一章节中学习更多相关内容。\n\
  \n## 更新和恢复\n\n当然，你还有 `更新和恢复` 标签，它的工作原理如下：\n\n`激活` 关于你拥有的 Windows 版本，并提供更改 `产品密钥`\
  \ 的机会。\n\n`高级选项` 将提供更多可选的更新设置。\n\n`备份` 为你提供了备份设置的机会。\n\n点击 `检查更新` 以便手动检查更新。\n\n\
  `面向开发人员` 全关于在 Windows 10 上制作应用程序和程序。\n\n`恢复` 包含你可以用于修复电脑的选项，这些：`重置此`、`返回之前的版本` 和\
  \ `高级启动`。\n\n名为 `Windows 更新` 的标签包含你可能需要的所有内容。\n\n`Windows Defender`，同时是你的防护系统。\n\
  \n# 第 4 章：理解界面\n\n在本章中，你将学习更多操作 Windows 10 的方法。\n\n## 使用快速访问\n\n许多人说 `快速访问` 让 Windows\
  \ 10 变得更易管理——你可以通过以下方法实现：\n\n要向快速访问添加文件夹，只需右键点击并选择 `固定到快速访问`。\n\n要从快速访问取消某个固定的文件夹，只需右键点击并选择\
  \ `取消从快速访问`。\n\n要清除快速访问历史记录，只需点击 `查看` > `选项` > `隐私`。然后点击 `清除`。\n\n要更改文件资源器的打开方式，只需点击\
  \ `查看` > `选项` > `此电脑`。\n\n## 使用贴齐\n\n这是一项专属功能！它可以帮助你将窗口贴齐到屏幕的一侧，这样你就不用花费时间移动它。\n\
  \n要使用鼠标贴齐，点击窗口标题并拖向侧边。你将看到一个轮廓，显示你拖动后窗口将出现的位置。\n\n要使用键盘贴齐，只需按下 `Windows 键` + `左箭头`（或\
  \ `右箭头`）。\n\n要贴齐到屏幕的象限，只需按下 `Windows 键` + `向上箭头`（或 `向下箭头`）。\n\n## 使用多桌面\n\n是的，你在使用\
  \ Windows 10 时可以使用多个“桌面”。要实现这一点，请遵循以下说明：\n\n通过点击 `任务视图` 添加桌面。按下 `Tab` + `Ctrl`。\n\
  \n现在，你有两个虚拟桌面。在它们之间切换，只需按下 `Windows 键` + `CTRL` + `左箭头` 或 `Windows 键` + `CTRL` +\
  \ `右箭头`。\n\n要在桌面之间移动窗口，右键点击你想移动的窗口，然后选择你想将其移动到哪里。\n\n关闭桌面，只需点击 `X` 或按下 `Windows\
  \ 键` + `CTRL` + `F4`。\n\n\n\n\n\n既然你已经了解了基础知识，现在是时候尽情享受 Windows 10 了！\n\n# 第 5 章：了解功能\n\
  \n当然，为了确保你能够享受 Windows 10 的各种功能，学习如何使用它的许多功能是恰恰好的！\n\n## 在网页上书写\n\n这是 Windows 10\
  \ 的一个趣味功能！基本上，借助 Windows 10 自带的下一代浏览器 `Microsoft Edge`，你可以通过在网页上直接书写来增加一些乐趣！\n\n\
  要开始“书写”，点击浏览器窗口右上角看起来像笔和纸的图标。\n\n点击该后后你正在浏览的网页将刷新。然后你就可以使用屏幕上显示的工具在指定的网页上书写或涂鸦了！\n\
  \n要输入注释，可以使用前面提到的工具栏上的文本工具。\n\n你可以点击数字大钉并关闭文本框来使页面保持整洁。\n\n点击垃圾桶图标删除文本框以及注释钉。\n\n\
  你还可以使用剪切工具让光标变成十字准星。\n\n你还可以使用橡擦工具逐行擦除。只需点击、按住并在屏幕上你不想要的线条上移动即可。\n\n要分享或保存你完成的内容，只需点击保存图标。然后，屏幕上会弹出一个菜单。这会询问你是否想将项目添加到阅读列表、保存到\
  \ `OneNote` 或添加到收藏夹。只需选择你想要的操作即可。\n\n## 管理通知\n\n由于 Windows 10 被证明是新时代的操作系统，你可以预期它会为你提供实时通知。简而言之，你会收到来自\
  \ `Facebook`、`Twitter`、`Instagram` 以及你可能使用的任何其他应用的通知——只要它们连接到了你的 `Microsoft account`。\n\
  \n要选择你想接收哪些通知，前往`操作中心` > `来自这些应用的通知`。在那里，你会看到已安装的应用列表。只需选择你想要的通知，就设置好了！\n\n你还可以选择想要访问哪些`快速操作`。要执行此操作，前往`设置`\
  \ > `系统` > `通知和操作` > `选择你的快速操作`。\n\n## 快速共享文件\n\n找到你想共享的文件。\n\n在`文件资源管理器`中点击`共享`。\n\
  \n点击`共享` 按钮。\n\n选择你想与哪个程序共享该文件。\n\n通过`设置` > `系统` > `共享实验室` 配置选项。\n\n## 设置默认程序\n\n\
  你可以按照以下指令更改默认程序和协议：\n\n打开`设置` > `系统` > `默认应用`。\n\n更改你想用于电子邮件、日历、地图、网络浏览器、视频播放器、照片查看器等的程序。\n\
  \n要设置单个文件类型，前往`设置` > `系统` > `按类型选择默认应用`。\n\n要设置协议的默认值，前往`设置` > `系统` > `按协议选择默认应用`。\n\
  \n要更改默认程序，只需前往`设置` > `系统` > `设置默认值` > `设置默认程序` > `将程序设置为默认值` > `为此程序选择默认设置`。\n\n\
  ## 探索照片应用\n\n请注意`照片应用`现在有两个主要功能，它们是：`集合`和`相册`。你的照片在`集合`选项中按日期顺序排列。同时，`相册`包含应用为你自动创建的相册。\n\
  \n要添加文件夹，前往`设置` > `源` > `添加文件夹` > `将此文件夹添加到图片`。\n\n要显示来自 `OneDrive` 的照片和视频，只需选择`设置`\
  \ > `显示来自 OneDrive 的照片和视频`。\n\n要共享图片，只需选择你想共享的图片并点击`共享`！\n\n你还可以利用`筛选器`和其他`编辑功能`！\n\
  \n## 使用弹出窗口延迟快门速度\n\n你也可以通过确保捕获弹出窗口来延迟截屏时的快门速度。方法如下：\n\n打开`捕取工具`然后点击`延迟`。在 0 到 5\
  \ 之间选择数字。\n\n通过点击`新建`旁边的选项选择你想制作的`截取`类型。从`窗口`、`矩形`、`任意`、`全屏`中选择。\n\n点击`新建`即可开始截屏。你现在将拥有\
  \ 0 到 5 秒的间隔，取决于你之前的选择。屏幕将冻结，你就可以捕捉你想要的图像。\n\n点击`保存`保存你的截图。\n\n## 导入书签\n\n如果你之前使用过其他浏览器并想重新访问在其中创建的书签，只需将它们导入到\
  \ `Edge`。方法如下：\n\n打开`Edge`并点击`…`，然后点击`设置`。\n\n选择`从其他浏览器导入收藏`。\n\n选择所有想要从其导入书签的浏览器就设置好了！\n\
  \n## 侧载应用\n\n侧载非常重要，因为允许你安装 `Windows Store` 中不可用的应用。以下是操作方法：\n\n打开`设置` > `更新和安全性`。\n\
  \n前往`开发人员` > `侧载应用`。\n\n你现在将收到一个关于侧载具有危险性的警告。只需点击“是”表示你理解这些风险。\n\n## 禁用 Wi-Fi 密码共享\n\
  \n为了确保你的 `Wi-Fi` 连接保持安全，你可以禁用 Wi-Fi 密码共享。方法如下：\n\n前往`设置` > `网络和 Internet` > `Wi-Fi`。\n\
  \n## 进入安全模式\n\n如果 Windows 10 出现问题并需要进入安全模式，方法如下：\n\n打开`设置` > `更新和安全性` > `恢复`。\n\n\
  点击`疑解答` > `高级选项` > `重启`。\n\n# 第 6 章：键盘快捷键和更多技巧\n\n学习帮助你使用 Windows 10 的键盘快捷键和技巧\n\
  \n## 打开打开的快捷方式\n\n前往`开始菜单` > `所有应用`。\n\n找到你想创建快捷方式的程序并将其拖到桌面。右键点击。\n\n现在打开`快捷方式`选项卡。选择与该程序关联的按键（例如\
  \ `CTRL + ALT + [按键]`）。\n\n点击继续。\n\n## 命令提示的快捷方式\n\n前往`开始菜单` > `所有应用` > `Windows\
  \ 系统` > `命令提示`。\n\n点击`属性` > `选项` > `编辑` > `启用快捷快捷键`。\n\n现在是你可以使用的快捷键列表：\n\n```\n\
  Alt + F4 (关闭命令提示)\nCTRL + A (选择行内容)\nCTRL + C 或 CTRL + Insert (将选择的文本复制到剪贴板)\nCTRL\
  \ + F (在命令提示中查找)\nCTRL + M (进入标记模式)\nCTRL + Page Up/Down (屏幕向上或向下移动)\nCTRL + Shift\
  \ + Home/End (光标移动到缓冲区开头/结束，然后选择文本和输出)\nCTRL + Shift + Left/Right (光标向左或右移动并选择文本)\n\
  CTRL + Up/Down (向上或向下移动一行)\n```\n\n## 其他常用的键盘快捷键\n\nWindows  + 左 (将窗口靠到左侧)\n\nWindows\
  \  + 右 (将窗口靠到右侧)\n\nWindows  + 上/下 (将窗口靠到象限)\n\nWindows  + Tab (任务视图)\n\nWindows\
  \  + CTRL + 左 (返回上一个虚拟桌面)\n\nWindows  + CTRL + 右 (前往下一个虚拟桌面)\n\nWindows  + CTRL\
  \ + F4 (关闭当前虚拟桌面)\n\n\n\n\n\n# Windows Key + CTRL + D (创建新虚拟桌面)\n\n## 加速 Windows\
  \ 10\n\n为了实现更快的设置，只需进入搜索框，输入 `netplwiz` 并按回车。\n\n一旦你看到 `Users must enter a username\
  \ and password to use this computer` 标签，找到旁边的方框并取消勾选。\n\n为了获得更快的开始菜单，进入搜索框，输入 `sysdm.cpl`\
  \ 并按回车。\n\n点击 `Advanced` > `Settings`。\n\n取消勾选 `Activate Windows when Minimizing\
  \ and Maximizing`。\n\n点击 `Apply`。\n\n现在，为了更快地关闭电脑，只需在桌面上右键点击，点击 `New` > `Shortcut`，然后在位置字段输入以下内容：`%windir%\\\
  system32\\shutdown.exe/s/t/0`\n\n## 最大化 Windows 10 使用\n\n确保除了你正在使用的窗口外，最小化所有窗口。这将提高速度并确保电脑不会卡顿！\n\
  \n将回收站固定到开始菜单——就像回到过去一样！\n\n使用 `Alt` 键快速打开 `Properties Menu`。\n\n通过点击 `All Apps`\
  \ 然后点击你看到的数字和字母来快速浏览开始菜单。\n\n要在背景上进行滚动，只需点击 `Settings` > `Devices` > `Mouse` 和 `Touchpad`\
  \ > `Scroll Inactive Windows when I hover at them`。\n\n# 第 7 章：常见问题\n\n最后，这里有一些关于\
  \ Windows 10 的常见问题——为了您的方便提供了解答！\n\n**Q：Windows 10 是什么时候发布的？**\n\n**A：** Windows\
  \ 10 于 2015 年 7 月 28 日正式发布。这使得操作系统为 Windows 7 或 8 的用户可以免费使用一年。如果你在一年后没有升级到 Windows\
  \ 10 并决定升级，那么你需要为 Windows 10 支付 $119，为 Windows 10 专业版支付 $199。\n\n**Q：哪里可以 Windows\
  \ 10 应用？**\n\n**A：** 微软认为你可以在 Windows Store 购买一次，这些通用应用将可以在你与账户同步的所有设备上运行。甚至 Microsoft\
  \ Office 也能运行——你基本上可以过上便利的生活！\n\n**Q：它可以在笔记本电脑或 Windows 手机上运行吗？**\n\n**A：** Windows\
  \ 10 可以作为你的台式机/笔记本电脑、Windows 手机和平板的唯一操作系统。这是因为有了 Continuum，它是让 Windows 10 运行的核心驱动力——让你无论使用鼠标、键盘还是触摸屏都能轻松操作。你还可以下载并使用适合手指操作的全屏应用！**\n\
  \n**Q：如果我不希望应用占据所有屏幕空间，或者如果我想重新排列它们怎么办？**\n\n**A：** Windows 10 的强大之处在于全屏应用是可选的——如果你觉得你的设备与它们不兼容，你可以选择不下载它们。由于我们现在有了\
  \ Continuum，你可以预期应用将在你希望运行的设备上工作——并且它会调整形状，这样你不会在调整时感到困难。\n\n开始菜单也让人想起美好的过去，不像 Windows\
  \ 8 的菜单那样令人困惑（很多人都很讨厌它）。此外，正如你之前学到的，这个新的开始菜单利用动态磁贴，你可以根据自己的需求和偏好进行自定义——这使得 Windows\
  \ 10 成为你能拥有的最佳操作系统。\n\n得益于所谓的 Snap 功能，你还可以将应用并排排列。这就是象限区域的作用，正如你所看到的，你被赋予了一些命令可以用来它运行。很棒的一点是它支持多个虚拟桌面，所以如果你经常多任务处理，或者有很多事情要处理，这对你非常有帮助！\n\
  \n**Q：我必须使用 Windows 资源管理器吗？我可以使用其他浏览器吗？**\n\n**A：** Internet Explorer 虽然仍然是微软品牌的一部分，但已不再是主要的浏览器——所以你可以松口气了，特别是如果你以前发现它非常慢。现在，你将能够使用\
  \ Microsoft Edge（正如之前告诉你的），它有许多新功能和扩展，将为你提供极佳的体验。\n\nMicrosoft Edge 还带有 Cortana，你自己的虚拟助手，它将提供关于在地址栏中输入内容的建议，或收集你想访问的餐厅的信息，或者告诉你最新的促销活动等。这样，你将始终掌握信息——而且再也不会无聊了！\n\
  \n**Q：这真的比 Vista 好吗？还是我应该继续使用 Windows 7 或 8？**\n\n**A：** 嗯，Windows 10 绝对比 Vista\
  \ 好，因为它不像那样卡顿，可以在更多电脑上运行，而且相比 Windows 7 和 8 有许多升级。有些用户说自从他们使用 Windows 10 以来，笔记本电脑电池就开始耗电，但他们注意到当给笔记本更好地充电时，这种情况就不会发生。\n\
  \n简而言之，升级仍然是最好的，因为早早晚，Windows 7 或 8 中的应用可能会被淘汰，而 Windows 10 运行确实更快，而且工作方式更加流畅、专业！\n\
