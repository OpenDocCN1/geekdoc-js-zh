    如果使用触摸屏，可以通过按住启动按钮至少 5 到 10 秒来访问此菜单！


    # 第 3 章：理解设置


    通过了解设置并知道如何使用它们，你将能够轻松地操作 Windows 10 并发挥其最大价值！


    ## 账户


    你可以在 `Charms` 栏下找到 `账户` 标签，它基本上关于你的 Windows 账户。


    你的 `账户` 是你的主登录账户。它与微软的云网络相连。


    `登录选项` 将询问你具体想以何种方式打开电脑。你可以使用普通的“密码+密码”登录，也可以选择 `Windows Hello`，这将允许你使用生物识别进行登录。


    `工作访问` 告诉你这台 电脑或你的账户是否已连接到另一个网络。


    `家庭和其他用户` 允许你向电脑添加更多管理员。要执行此操作，只需点击 `为指定的访问设置账户` > `选择账户` > `选择应用`。


    `同步我的设置` 允许你将此 PC 与你的其他设备以及家中的电脑进行同步。


    ## 隐私


    当然，你也可以在 `Windows 10` 的帮助下确保你的隐私得到保护。方法如下：


    `通用` 关乎决定你是否希望你的名字出现在应用程序、程序、照片以及任何连接到你电脑的文件中。


    `位置` 基本上基于 `GPS` 工作，并允许你决定是否让其他人看到你所在地。


    `麦克风` 为你提供了开启或关闭麦克风的机会。


    `语音、笔画、打字` 主要为你提供是否使用 `Cortana`（Windows 10 的数字助手）的选项。


    `账户信息`、`日历`、`联系人`、`消息`、`无线电` 仅让你决定是否将其与其他设备同步。


    `其他设备` 允许你将 `Xbox One` 以及在那里找到的信息与你的微软账户同步。


    `反馈`。选择你是否希望微软每天、每周一次、自动地、总是或从不向你征求反馈。


    ## 设备


    `设备` 标签提供了关于你想要与 PC 连接/同步的哪些设备的选项。


    `打印机和扫描仪` 允许你向电脑添加打印机。要执行此操作，只需点击 `设备和打印机` > `设备管理器` > `相关设置` > `添加打印机或扫描仪` 并按照屏幕上的说明进行操作。


    同时，`连接设备` 关于其他不是打印机或扫描仪的连接设备。


    `鼠标和触摸板` 为你提供了配置 `鼠标和触摸板` 设置的机会。只需选择 `鼠标和触摸板` > `相关设置` > `其他鼠标选项`。


    `打字` 允许你选择是否想使用物理键盘或屏幕键盘。


    `自动播放` 允许你选择是否开启或关闭 `自动播放`。


    ## 轻松功能


    `轻松功能` 标签包含 Windows 10 的辅助功能设置。


    `讲述器` 帮助你获得语音协议。它基本上读取屏幕显示的内容或你输入的任何内容，你可以在 `David` 和 `Zira` 之间选择你的讲述器。你还可以添加你想要听到的声音或你想要关注的语言。


    `放大镜` 为你提供一个浮动工具栏并放大你的屏幕。


    `高对比度` 允许你选择 `高对比度` 主题。


    `闭路字幕` 为你提供字幕以帮助你理解你在屏幕上听到的内容。它适用于 `Hulu` 和 `Netflix` 等网站。


    `键盘和鼠标` 包含了，嗯，`键盘和鼠标` 设置——就像 Windows 早期版本中的一样。


    ## 个性化


    尽管如此，你也有机会个性化你的 Windows 10 体验。请注意，你会有更多机会自定义你的体验——更多内容将在后面的章节中介绍。这里是基础知识：


    `背景` 主要是你电脑的壁纸，并选择你希望照片如何适应你的屏幕。


    `颜色` 是将用于桌面、工具栏等的颜色。


    `锁定界面` 是你在屏幕锁定时在屏幕上看到的内容。点击 `图片`，你将看到最近使用的 5 张锁定屏幕图片，以及一个 `浏览` 按钮供你从文件中选择照片。选择
    `幻灯片` 将将照片的幻灯片作为你的锁定屏幕。你还可以选择 `屏幕超时时间` 以及更多 `屏幕保护程序设置`。


    `主题` 将帮助你选择想要使用的主题。进入 `经典主题设置` > `相关设置` 来执行此操作。


    `开始` 帮助你开启或关闭应用程序和通知以及更多。你将在下一章节中学习更多相关内容。


    ## 更新和恢复


    当然，你还有 `更新和恢复` 标签，它的工作原理如下：


    `激活` 关于你拥有的 Windows 版本，并提供更改 `产品密钥` 的机会。


    `高级选项` 将提供更多可选的更新设置。


    `备份` 为你提供了备份设置的机会。


    点击 `检查更新` 以便手动检查更新。


    `面向开发人员` 全关于在 Windows 10 上制作应用程序和程序。


    `恢复` 包含你可以用于修复电脑的选项，这些：`重置此`、`返回之前的版本` 和 `高级启动`。


    名为 `Windows 更新` 的标签包含你可能需要的所有内容。


    `Windows Defender`，同时是你的防护系统。


    # 第 4 章：理解界面


    在本章中，你将学习更多操作 Windows 10 的方法。


    ## 使用快速访问


    许多人说 `快速访问` 让 Windows 10 变得更易管理——你可以通过以下方法实现：


    要向快速访问添加文件夹，只需右键点击并选择 `固定到快速访问`。


    要从快速访问取消某个固定的文件夹，只需右键点击并选择 `取消从快速访问`。


    要清除快速访问历史记录，只需点击 `查看` > `选项` > `隐私`。然后点击 `清除`。


    要更改文件资源器的打开方式，只需点击 `查看` > `选项` > `此电脑`。


    ## 使用贴齐


    这是一项专属功能！它可以帮助你将窗口贴齐到屏幕的一侧，这样你就不用花费时间移动它。


    要使用鼠标贴齐，点击窗口标题并拖向侧边。你将看到一个轮廓，显示你拖动后窗口将出现的位置。


    要使用键盘贴齐，只需按下 `Windows 键` + `左箭头`（或 `右箭头`）。


    要贴齐到屏幕的象限，只需按下 `Windows 键` + `向上箭头`（或 `向下箭头`）。


    ## 使用多桌面


    是的，你在使用 Windows 10 时可以使用多个“桌面”。要实现这一点，请遵循以下说明：


    通过点击 `任务视图` 添加桌面。按下 `Tab` + `Ctrl`。


    现在，你有两个虚拟桌面。在它们之间切换，只需按下 `Windows 键` + `CTRL` + `左箭头` 或 `Windows 键` + `CTRL` +
    `右箭头`。


    要在桌面之间移动窗口，右键点击你想移动的窗口，然后选择你想将其移动到哪里。


    关闭桌面，只需点击 `X` 或按下 `Windows 键` + `CTRL` + `F4`。


    '
- fmt: '

    Now that you know the basics, it’s time to enjoy Windows 10 even more!


    # Chapter 5: Understanding the Features


    And of course, in order to make sure that you enjoy the various features of Windows
    10, it’s just right that you learn how to use its many features!


    ## Writing on Web Pages


    This is a fun feature of Windows 10! Basically, you can have a little fun by literally
    writing on web pages, with the help of Windows 10’s `Microsoft Edge`, a next-gen
    browser!


    To start “inking”, click on the icon that looks like pen and paper found on the
    upper right corner of the browser window.


    Once you have clicked that, the web page you’re browsing will refresh. You can
    then start using the tools you see onscreen to write or doodle on the said webpage!


    To type comments, you can use the text tool found on the toolbar mentioned earlier.


    You can declutter the page by clicking on the numbered pin and closing the text
    box.


    Click the trash icon to delete the text box, as well as the comment pin.


    You can also use the clipping tool to make crosshair out of your cursor.


    You can also erase line by line using the eraser tool. Just click, hold, and move
    over the lines you don’t want to see onscreen.


    To share or save what you have done, just click the save icon. Then, a pop-up
    menu will appear onscreen. This’ll ask you whether you want to add the project
    to your reading list, save to `OneNote`, or add to your favorites. Just choose
    what you want to happen.


    ## Managing Notifications


    Since Windows 10 proves to be the Operating System for the new age, you can expect
    it to give you real time notifications. In short, you’ll get notifications from
    `Facebook`, `Twitter`, `Instagram`, and any other apps you might be using—as long
    as they’re connected to your `Microsoft account`.


    To choose which notifications you’d like to have, go to `Action Center` > `Show
    Notifications from These Apps`. There, you’d see a list of the apps you have.
    Just choose what notifications you’d like to have and you’re all set!


    You can also choose which `Quick Actions` you’d like to have access to. To do
    this, go to `Settings` > `System` > `Notifications and Actions` > `Choose Your
    Quick Actions`.


    ## Sharing Files Quickly


    Look for the file that you want to share.


    Click `Sharing` in the `File Explorer`.


    Click `Share` button.


    Choose the program you’d want to share the said file with.


    Configure options by going to `Settings` > `System` > `Share Lab`.


    ## Setting Default Programs


    You can change default programs and protocols by following the instructions below:


    Open `Settings` > `System` > `Default Apps`.


    Change the programs you want to use for email, calendar, maps, web browser, video
    player, photo viewer, and the like.


    To set individual file types, go to `Settings` > `System` > `Choose Default Apps
    by File Type`.


    To set defaults for protocols, go to `Settings` > `System` > `Choose Default Apps
    by Protocol`.


    To change default programs, just go to `Settings` > `System` > `Set Defaults by
    App` > `Set Default Programs` > `Set Program as Default` > `Choose Defaults for
    this Program`.


    ## Exploring Photos App


    Take note that the `Photos App` now has two main features, and these are: `Collections`
    and `Albums`. Your photos are chronologically arranged by date in the `Collections`
    tab. Meanwhile, `Albums` contain albums that the app has created automatically
    for you.


    To add a folder, go to `Settings` > `Sources` > `Add a Folder` > `Add this Folder
    to Pictures`.


    To show photos and videos from `OneDrive`, just choose `Settings` > `Show my Photos
    and Videos from OneDrive`.


    To share pictures, just select the picture you want to share and click `Share`!


    You can also make use of `Filters` and other `Editing Features`, too!


    ## Delaying Shutter Speed with Pop-Ups


    You can also delay shutter speed in capturing screenshots by making sure that
    you get to capture pop-ups, too. Here’s how:


    Open `Snipping Tool` and then click `Delay`. Choose between numbers 0 to 5.


    Choose the type of `Snip` that you’d like to make by clicking what you find next
    to `New`. Choose from `window`, `rectangular`, `free-form`, `full-screen`.


    Click `New` so you could begin snipping. You will now have an allowance of 0 to
    5 seconds, depending on what you chose earlier. The screen will freeze and you’ll
    be able to capture the image you want.


    Click `Save` to save your screenshot.


    ## Importing Bookmarks


    If you have been using other browsers before and want to regain access to bookmarks
    you’ve made there, you can just import them to the `Edge`. Here’s how:


    Open `Edge` and click `…`, then click `Settings`.


    Choose `Import Favorites from Another Browser`.


    Choose all the browsers you want to import bookmarks from and you’re all set!


    ## Sideloading Apps


    Sideloading is important because it allows you to install apps that are not available
    in the `Windows Store`. Here’s how you can do it:


    Open `Settings` > `Update and Security`.


    Go to `For Developers` > `Sideload Apps`.


    You will now receive a warning about sideloading being dangerous. Just click `Yes`
    to say that you understand the risks.


    ## Disabling Wi-Fi Password Sharing


    In order to make sure that your `Wi-Fi` connection stays yours, and that you would
    have more privacy, you can disable `Wi-Fi` sharing! Here’s how:


    Go to `Settings` > `Network and Internet` > `Wi-Fi` > `Manage Wi-Fi Settings`.
    You can also turn off networks that automatically connect to `Skype`, `Quora`,
    `Outlook` or `Facebook`, as well.


    ## Booting in Safe Mode


    In case you are experiencing problems with Windows 10 and have to revert to Safe
    Mode, here’s what you have to do:


    Open `Settings` > `Update and Security` > `Recovery`.


    Click `Troubleshoot` > `Advanced Options` > `Restart`.


    # Chapter 6: Keyboard Shortcuts and More Tricks


    Learn keyboard shortcuts and tricks that will help you use Windows 10


    ## Shortcuts for Opening Programs


    Go to `Start Menu` > `All Apps`.


    Look for the app you want to make a shortcut for and drag it to the desktop. Right-click
    and then `Properties`.


    Now, the `Properties` window will open. Look for `Shortcut` tab and choose the
    key you’d want associated with the app (e.g., `CTRL + ALT + [chosen key]`).


    Click `Continue`.


    ## Shortcuts for Command Prompt


    Go to `Start Menu` > `All Apps` > `Windows System` > `Command Prompt`.


    Click `Properties` > `Options` > `Edit` > `Enable CTRL Key Shortcuts`.


    Now, here’s a list of shortcuts you could use:


    ```

    Alt + F4 (close command prompt)

    CTRL + A (select all in the current line)

    CTRL + C or CTRL + Insert (copy selected text to clipboard)

    CTRL + F (open Find from the Command Prompt)

    CTRL + M (enter mark mode)

    CTRL + Page Up/Down (move screen one page up or down)

    CTRL + Shift + Home/End (move cursor to the beginning/end of screen buffer, and
    then select text and beginning/end of output)

    CTRL + Shift + Left/Right (move cursor left/right and select text)

    CTRL + Up/Down (move one line or down)

    CTRL + V or Shift + Insert (paste copied text)

    Shift + Home/End (move cursor to beginning/end of current line and select text)

    Shift + Left/Right (move cursor left/right one character and select text)

    Shift + Page Up/Down (move cursor up/down screen and select text)

    Shift + Up/Down (move cursor up or down one line and then select text)

    Up/Down/Left/Right (In mark mode; move cursor up, down, left, or right)

    ```


    ## Other helpful Keyboard Shortcuts


    Windows Key + Left (Snap Window to Left Side of Screen)


    Windows Key + Right (Snap Window to Right Side of Screen)


    Windows Key + Up/Down (Snap Window to Quadrant)


    Windows Key + Tab (Task View)


    Windows Key + CTRL + Left (Go back to previous virtual desktop)


    Windows Key + CTRL + Right (Go to next virtual desktop)


    Windows Key + CTRL + F4 (Close current virtual desktop)

    '
