    [点击此处获取所有信息！](http://kindlebookspot.com/join-our-tech-community/)


    ## 第 1 章 – 为什么要学习 WordPress？


    很多人认为 WordPress 只是另一个博客平台。这种误解是因为在过去，WordPress 确实是用于博客。但多年来，WordPress 已经演变成了一个动态内容管理系统（CMS）。虽然你仍然可以使用这个
    CMS 创建一个基础博客，但它现在允许你构建一个功能完善的网站。


    WordPress 最好的地方在于它非常灵活且易于使用。这是 WordPress 成为今天最流行的 CMS 的主要原因。目前网上活跃的网站约有 23% 是由
    WordPress 驱动的。由于其多功能特性，许多知名品牌都在使用 WordPress 来驱动它们的网站，例如 eBay、《纽约时报》迪士尼、Facebook、《时代杂志》CNN、LinkedIn、索尼和谷歌。


    让我们简单了解一下为什么你应该学习并使用 WordPress。


    ### WordPress 赋予你自由


    基本上，WordPress 是一个免费软件。你有权以你任何需要的方式对其进行下载、安装、修改和使用。你可以构建任何类型的网站。它还是一个开源平台，这意味着源代码对任何人开放，方便他们学习、修改和实验。


    全球数百万的人正在使用 WordPress，每天都有新人利用这个出色的 CMS 创建网站。人们能够轻松适应 WordPress 的主要原因是因为它非常容易使用和学习。


    ### 你可以轻松地管理 WordPress


    WordPress 内置了更新程序，这使得你能够通过 WordPress 内部的管理员仪表板轻松更新插件和模板。当 WordPress 有更新版本时，它还会通知你，你可以通过几次鼠标点击轻松完成更新。只要你设置了定期备份，所有内容都是安全的。


    ### 你可以通过主题和插件扩展 WordPress


    值得注意的是，大多数使用 WordPress 的人既不是程序员，也不是网页设计师。事实上，有成千上万的个人在没有任何网站设计基础知识的情况下开始使用 WordPress。


    WordPress 之所以成为这样一个动态平台的主要原因是，你可以从数以千计的免费主题（网页模板）中进行选择，以改进网站的外观。因此，你可以根据网站的用途赋予其独特的设计和感觉。你可以为几乎任何需求找到找到的
    WordPress 主题。你可以在第 2 章中了解更多信息。


    WordPress 还提供了极佳的灵活性，可以通过插件进行扩展。与主题类似，你可以使用数千个插件来增强你的网站。这些插件可以增强 WordPress 的功能，并为你的网站添加整个全新的平台。你可以在第
    2 章中学习更多关于插件的内容。


    ### WordPress 友好 SEO


    WordPress 使用高质量且符合标准的代码开发，这些代码产生的语义化标记使你的网站对搜索引擎非常友好。WordPress 的设计和主题对搜索引擎非常友好，通过使用
    SEO 插件，还可以使其对 SEO 更具吸引力。


    ### WordPress 可以整合各种媒体


    WordPress 提供了一个动态平台，允许你使用不同的媒体类型。它内置的支持允许你处理视频、音频和照片内容。它还支持嵌入功能，允许你嵌入来自 YouTube
    和 Vimeo 等外部网站的视频。


    ### WordPress 提供可靠的安全功能


    网络安全是 WordPress 的基础元素之一，因此你可以通过该平台安全地运行任何网站。但由于互联网的广阔，这无法完全确定。互联网上存在想要进入尽可能多网站的入侵者。好在
    WordPress 对安全插件防止任何形式的安全威胁。


    ### 使用 WordPress 的方法


    你可以通过多种方式使用 WordPress。许多企业网站运行在 WordPress 上，并作为其销售产生的关键环节。你可以将 WordPress 用于以下用途：

    - 博客（个人或商业）

    - 在线游戏厅

    - CMS

    - 作品集

    - 画廊

    - 在线商店

    - 会员门户

    - 视频策展网站

    - 评分网站

    - 以及更多！


    我希望这一章回答了你关于为什么要使用 WordPress 问题。学习 WordPress 的最佳方法是开始使用它。在接后的章节中，你每天可以学习 WordPress
    的基础元素。


    ## 第 2 章 – 第一周：设置、仪表板、管理栏、设置、链接和图像


    只要你能在两周内每天抽出一两个小时，WordPress 就是很好学的。你只需要非常基础的互联网技能，当然还需要具备准确遵循指令的能力。你甚至不需要学习 HTML
    或或其他语言来创建网站。尽管编程和编码技能在将来会有帮助，但开始使用 WordPress 并非必须。


