    \ that is left at the stack. This continues to occur until there is 0 left.             \n\
    \nMultiline Statements\n\nWhen you end a statement, you can either use a new line\
    \ or a continuation symbol ( \\ ) if you want to indicate that the line needs\
    \ to continue. To help you understand this concept further, consider the following\
    \ example:\n\ntotal = first_item + \\\n\n              second_item + \\\n\n             \
    \ third_item\n\nThere is no need for you to use the continuation symbol when you\
    \ write statements that are contained within brackets, such as { }, ( ), and [\
    \ ]. For instance, if you wish to display the months in a year, you may simply\
    \ write:\n\nyear = [‘January’ ,‘February’ ,‘March’ ,‘April’ ,‘May’ ,‘June’ ,‘July’\
    \ ,‘August’ ,‘September’ ,‘October’ ,‘November’ ,‘December’ ]\n\nYou are allowed\
    \ to write multiple statements on a single line or create multiple groups as suites.\
    \ When it comes to writing multiple statements, keep in mind that the inclusion\
    \ of the semicolon ( ; ) is crucial. The semicolon allows you to write as many\
    \ statements as possible, as long as they do not start a new block of code. Consider\
    \ the following example:\n\nimport sys ; y =‘bar’ ;  sys.stdout.write ( y +‘ \\\
    n’ )\n\nSo what are suites exactly? Well, they are groups of statements that consist\
    \ of blocks of code. Compound or complex statements, such as if, while, def, and\
    \ class require a suite and a header line.\n\nSo what are header lines? They begin\
    \ statements with a keyword and end them with a colon ( : ) . Also, they are followed\
    \ by one or more lines that make up a suite. Consider the following example:\n\
    \nif expression :\n\n              suite\n\nelif expression :\n\n             \
    \ suite\n\nelse :\n\n              suite\n\nQuotation\n\nAs a programmer, you\
    \ are allowed to use a single quote (‘ ) , double quote (“ ), and a triple quote\
    \ (‘’’ or“”” ) when you denote string literals. Then again, see to it that you\
    \ use the same type of quotes at the start and end of your string. Typically,\
    \ triple quotes are used to span strings across multiple lines. Take a look at\
    \ the following example:\n\nparagraph =“”” You are reading an example of a paragraph\
    \ that consists multiple lines and sentences. You are an excellent programmer.“””\n\
    \nComments\n\nWhen it comes to comments, you should use the hash symbol ( # )\
    \ to start them. However, this hash symbol should not be within a string literal.\
    \ Also, the characters after it towards the end of the line should be included\
    \ in the comment. In Python, comments are not recognized by the interpreter. To\
    \ help you understand this concept further, take a look at the following example:\n\
    \n# This is the first comment\n\nprint“ Monty Python’s Flying Circus is a British\
    \ sketch comedy series.” ;\n\n# This is the second comment\n\nIf you run the example\
    \ given above, you will obtain the following output:\n\nMonty Python’s Flying\
    \ Circus is a British sketch comedy series.\n\nYou can also write another comment\
    \ after an expression or a statement, such as in the following:\n\nname =“Wendy”\
    \ # This is a sample comment\n\nIf you want to comment on multiple lines, you\
    \ may do so as well. For example:\n\n# This is a sample comment.\n\n# This one\
    \ is also a comment.\n\n# This is another comment.\n\n# This comment is written\
    \ by Wendy.\n\n## Blank Lines\n\nThese lines are not recognized in the Python\
    \ programming language. With this being said, they are pretty much like comments.\
    \ They contain whitespaces and even comments. You have to use empty lines to terminate\
    \ multiline statements in an interactive interpreter session.\n\n# \n\nChapter\
    \ 3: Data Types\n\nIn Python, input data are sorted according to different categories.\
    \ The primary purpose of sorting is to help programmers like you in processing\
    \ information more efficiently. Such categories function as data storage locations\
    \ that you can access whenever you run the Python platform.\n\nVariables\n\nVariables\
    \ contain values that have been specifically allocated to them. If you are working\
    \ on complex codes for applications, you may want to store your information in\
    \ these variables. Do not worry because you can access them anytime you need them.\
    \ You can even use them to ensure that the information you gather from your end\
    \ users stay safe and secured.\n\nNumeric Types\n\nNumbers in the Python programming\
    \ language are different from the numbers you use to solve problems in Algebra.\
    \ In Mathematics, adding .0 at the end of a number practically means nothing.\
    \ It does not make any difference to its value. For instance, 3 and 3.0 are the\
    \ same.\n\nIn Python, however, 3 and 3.0 are different numbers. Before the program\
    \ processes it, it has to undergo certain data processing methods. As a programmer,\
    \ you have to learn about the different numeric types.\n\nIntegers\n\nAll whole\
    \ numbers are integers. Numbers that contain a decimal point are not whole numbers;\
    \ therefore, 3 is a whole number while 3.0 is not. Integers in Python are characterized\
    \ by the data type int.\n\nTake note that integers have capacity limitations.\
    \ You will generate an error if you try to process a value beyond the allowed\
    \ limits. Integers typically process numbers between -9,223,372,036.854 and 9,223,372,036.854.\n\
    \nThere are interesting features that come with the int variable. For instance,\
    \ base 2 only uses 0 and 1, base 8 uses numbers from 0 to 7, base 10 has similar\
    \ properties with the decimal system and base 16 uses the letters A to F and the\
    \ numbers 0 to 9 as digits.\n\nFloating Point Values\n\nAny number that contains\
    \ a decimal point is considered as a floating point value in Python. It does not\
    \ matter if the number after the decimal point is 0 or not. 3.0, 1.5, and 11.4,\
    \ for example, are all floating point values. They are stored in the float data\
    \ type. One huge advantage of floating point values over integers is that they\
    \ have bigger storage spaces; hence, they are capable of storing very small or\
    \ large values.\n\nThen again, you should not think that they have an unlimited\
    \ storage space. There is still a limitation. Nevertheless, they can contain as\
    \ little as±2.2250738585072014× 10-308 and as much as 1.7976931348623157× 10-308.\
    \ There are a couple of ways to allocate values with the use of floating point\
    \ values. First, you can directly assign them. Second, you can use a scientific\
    \ notation. Keep in mind that negative exponents produce fraction equivalents.\n\
    \nComplex Numbers\n\nThese numbers consist of real numbers and imaginary numbers\
    \ combined. Usually, they are used in dynamic systems, quantum mechanics, computer\
    \ graphics, electrical engineering and fluid dynamics. Complex numbers can be\
    \ processed in Python and a few other programming languages.\n\nBoolean Values\n\
    \nThese are the two constant objects True and False. They represent truth values.\
    \ When used in a numeric context, they function as 0 and 1\\. You can use the\
    \ function bool to assign a value to a Boolean if such value may be interpreted\
    \ as a truth value.\n\nStrings\n\nThey are groups of characters that are connected\
    \ with double quotation marks. Consider the following example:"
