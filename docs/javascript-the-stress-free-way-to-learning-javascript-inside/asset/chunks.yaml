    下面的列表显示了 JavaScript 中可用的算术运算符。为了帮助你理解这些运算符是如何工作的，让我们来使用两个示例变量：`x = 2`；`y = 4`。


    *   `+` – 如果你想对两个操作数进行加法（即运算符两侧的值），就应该使用此运算符。例如：`x + y = 6`。

    *   `-` – 此运算符允许你在代码中执行减法。在这里，你将从第一个操作数的值中减去第二个操作数的值。例如：`y– x = 2`。

    *   `*` – 如果你想乘以两个操作数，就应该使用星号。例如：`x * y = 8`。

    *   `/` – 使用此运算符，你用左侧操作数的值除以右侧操作数的值。例如：`y / x = 2`。

    *   `++` – 此运算符允许在你使用的操作数上加 1。例如：`4++ = 5`。

    *   `--` – 此运算符从它所附的操作数上减去 1。例如：`x-- = 1`。


    **重要备注：** 你也可以使用 `+` 运算符来组合数字和字符串元素。例如：`"x" + 4 = x4`。


    ## 位运算符


    这种编程语言允许你在代码中执行位位运算。以下是你可以使用的运算符：


    **注意：** 让我们使用两个变量：`x = 2`；`y = 3`。


    *   `&` – 这被称为位与（Bitwise AND）运算符。它对参数中涉及的所有位执行布尔逻辑与操作。例如：`(x & y)` 为 2。

    *   `|` – 程序员将此运算符称为位或（Bitwise OR）。它对参数中涉及的所有位执行布尔逻辑或操作。例如：`(x | y)` 为 3。

    *   `^` – 这被称为位异或（Bitwise XOR）运算符。它对参数中涉及的所有位执行布尔逻辑异或操作。在异或逻辑中，只有一个操作数可以为真。例如：`(x
    ^ y)` 为 1。

    *   `~` – 此运算符是单目的（`unary`，即它作用于单个操作数）。被称为位非（Bitwise NOT）运算符，它会反转操作数的位。例如：`(~y)`
    为 -4。

    *   `<<` – 此运算符被称为左移（Left Shift）。它根据右侧操作数指定的数字将左侧操作数的位向左移动。同时，它使用零来填充新位。将值向左移动
    1 位相当于将其乘以 2。因此，`(x << 1)` 结果为 4。

    *   `>>` - 这被称为右移（Right Shift）运算符。它根据右侧操作数提供的数字将左侧操作数的值向右移动。例如：`(x >> 1)` 结果为
    1。

    *   `>>>` – JavaScript 用户将此称为右移并补零（Right Shift and Zero）。它的功能与 `>>` 类似。唯一的区别是最左侧的位始终等于零。


    ## 杂杂运算符


    本书这一部分将讨论两个不属于上述讨论类别的有用运算符。这些运算符是：


    *   `?:` – 这被称为条件运算符（Conditional Operator）。它检查表达式的值是真还是假。然后，它根据评估结果执行分配的语句之一。例如，如果条件为真，运算符将为表达式赋值
    1。然而，如果条件为假，运算符将赋值 2。

    *   `typeof`– 这是一个单目运算符，意味着你可以将其用在单个操作数。你可以用它来确定操作数的数据类型。如果操作数是字符串、布尔或数字，此运算符给出
    `string`、`boolean` 或 `number`。然后，根据评估结果给出真或假。


    下表提供了有关 `typeof` 运算符的有用信息：


    | 数据类型 | typeof 结果 |

    | :--- | :--- |

    | Object | “object” |

    | Number | “number” |

    | Boolean | “boolean” |

    | Undefined | “undefined” |

    | Null | “object” |

    | Function | “function” |

    | String | “string” |


    # 第 6 章：条件语句


    在使用 JavaScript 时，会遇到需要你从预定义的集合中选择一个的情况。在这种情况下，你必须使用条件语句。条件语句允许你的程序做出合理的判断并执行正确的流程。


    这种编程语言提供了你可以在代码中使用的条件语句。本章将讨论三个最重要的条件语句：(1) `if` 语句，(2) `if… else` 语句，以及 (3) `if…
    else if…` 语句。


    让我们详细讨论这些语句：


    ### 条件语句的流程图


    下面的图片显示了条件语句的基本流程图。


    ![](img/00015.jpeg)


    ### if 语句


    该语句是 JavaScript 中的基础条件语句。它帮助程序做出决策并执行其他语句。


    `if` 语句的语法是：


    ![](img/00016.jpeg)


    上面的代码评估 JavaScript 表达式。如果评估结果为真，则将执行分配的语句。然而，如果结果为假，则没有任何分配的语句会被执行。


    ### if… else 语句


    该语句比上一个更复杂。这是因为你在该语句中使用比较运算符。


    这是 `if… else` 语句的语法：


    ![](img/017.jpeg)


    你可以使用上面的语法评估 JavaScript 表达式。如果结果为真，将执行 `if` 部分的语句。如果结果为假，反之，将执行 `else` 部分的语句。


    ### if… else if… 语句


    基本上，这是 `if… else` 语句的增强形式。通过提供多个条件，它帮助程序做出正确的决策。


    这是 `if… else if…` 语句的语法：


    ![](img/0018.jpeg)


    如果你仔细想，上面的语法是一个简单的形式。它是 `if` 语句的集合，每个 `if` 都是前面语句的一部分。此语法根据评估结果执行语句。如果所有条件为假，系统将运行
    `else` 部分。


    ### Switch-case 语句


    你可以使用一系列 `if… else` 语句来执行多路径分支系统。你在上一节中学习过这个。然而，这种方法并不总是理想的答案，特别是当所有分支都取决于一个变量的值时。


    幸运的是，JavaScript 提供了 switch 语句。在上述情况下，单个 switch 语句比 `if… else` 语句更有效。


    这是基础 switch-case 语句的流程图：


    ![](img/0019.jpeg)


    ### 语法


    switch 语句旨在完成两件事：


    *   提供一个程序可以评估的表达式

    *   提供根据评估结果运行的各种语句


    JavaScript 内置解释器会将每个 case 与表达式的值进行比较。此过程将持续到解释器找到匹配为止。如果没有找到匹配，解释器将运行默认条件。switch
    语句的语法是：


    ![](img/00020.jpeg)


    此语法使用 break 语句来终止每个 case。如果你删除了这些 break 语句，JavaScript 解释器将执行每个 case 内部的所有语句。


    第六章：JavaScript 中不同的循环类型


    在编写自己的程序时，你会遇到需要多次执行某操作的情况。显然，重复输入相同的内容是非常耗时的（而且极其无聊）。幸运的是，JavaScript 提供了各种工具可以帮助你快速轻松地重复语句。这些工具被称为循环，它们是本章的主题。


