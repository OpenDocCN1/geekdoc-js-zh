    整数（也称为整体）的计算是 100% 准确的。然而，分数的计算并非如此。例如，“π”的值无法通过有限数量的小数来精确表示。许多数值丢失了它们的准确性，因为系统只有
    64 位空间来存储它们。如果你想避免与分数相关的问题，必须记住这些数字只是估算值。不要把它们视为精确的值。


    ## 算术运算


    这是你对数值进行的操作。通常情况下，算术运算（例如加法、除法、减法等）使用两个数值来生成新值。这是一个用 JavaScript 语言编写的算术运算示例：


    ```

    10 + 4 * 5

    ```


    `*` 和 `+` 符号被称为“运算符”。`+` 符号表示加法，而 `*` 表示乘法。你可以通过两个数值之间放置运算符来生成一个新的数值。需要注意的是，JavaScript
    中的算术运算遵循运算符优先级（也称为运算顺序）。在这里，你应该按照此顺序执行操作：括号、指数、乘法/除法以及加法/减法。如果你对上面的示例应用运算符优先级，10
    将加到 `4 * 5` 的乘积上。


    你可以使用括号来修改运算顺序。例如：


    ```

    (10 + 4) * 5

    ```


    在 JavaScript 语言中，`-` 符号表示减法，而 `/` 表示除法。你不需要担心运算符优先级。然而，如果你不确定，可以简单地在代码中添加括号。


    ## 特殊数字


    在使用 JavaScript 时，你会遇到三个被称为数字的值，尽管它们的行为并不完全如此。这些特殊值是：`Infinity`、`-Infinity` 和 `NaN`。`-Infinity`
    和 `Infinity` 分别代表负正无穷。通常情况下，你不应该信任基于无穷的计算。这些计算在数学上是不可靠的。


    另一方面，`NaN` 意味着“不是数字”（not a number）。如果你执行产生不精确或无意义结果的算术运算，就会得到这个特殊值。例如，如果你将零除以零（即
    `0 / 0`），你将得到 `NaN`。


    ## 字符串


    你应该使用字符串来表示基于文本的信息。你应该使用引号（即单引号或双引号）来包裹你的字符串。查看以下示例：


    ```

    ‘Five little monkeys’

    ```


    ```

    “I’m riding a bicycle”

    ```


    在创建字符串时，确保你的引号使用是一致的。如果你使用双引号开始某行，请使用相同的相同的符号结束该行。


    通常情况下，你可以使用引号包裹几乎任何内容。在对引号之间放入某些内容，JavaScript 语言就会将其转换为一个可用的字符串值。


    ### 如何“转义”字符


    有时你必须在语句中添加特殊字符。例如，在编写文本字符串时，你必须添加“换行符”（即你按下 Enter 键后获得的字符）。目前，JavaScript 要求程序员在带引号的文本中添加反斜杠。通过放置反斜杠，你是在告诉计算机下一个字符具有特殊的函数或含义。这个过程被称为“字符转义”。


    反斜杠后的引号将被视为行内容的一部分：它们不会结束字符串。如果你在反斜杠后放置 `n`，语句中将添加一个换行符。同样，由反斜杠引入的 `t` 将导致一个“制表符”字符（即你按下
    Tab 键后获得的字符）。这是一个简单的示例：


    ```

    “I’m the first one\nYou are the last”

    ```


    如果你执行上述字符串，将得到以下结果：


    ```

    I’m the first one

    You are the last

    ```


    在某些情况下，你可能在代码中使用“普通”的反斜杠。你不希望它成为特殊工具。你可以通过在另一个反斜杠之前放置一个反斜杠来实现这一点。也就是说，你正在转义一个反斜杠，以便将其转换为一个普通字符。分析以下示例：


    ```

    “You should use \\t to add a tab character in your statements”

    ```


    一旦编译并执行，该行将为你输出：


    ```

    You should use \t to add a tab character in your statements

    ```


    字符串不是数字，所以你不能对它们进行数学运算。然而，你可以在字符串上使用 `+` 来连接（即组合）它们。这里有一个示例：


    ```

    “Jav” + “aSc” + “ript”

    ```


    由于使用了 `+` 符号，上述分段的行产生了：`JavaScript.`。


    ## 一元运算符


    在这一节中，你将学习非符号运算符。为了开始讨论，让我们来聊一个名为 `typeof` 的运算符。这个运算符可以帮助你识别任何值的类型。查看以下示例：


    ![](img/00035.jpeg)


    上面的示例代码使用了 `console.log` 来显示通过 `typeof` 得到的结果。每当你运行这类代码时，你应该立即在计算机屏幕上看到该值。


    上一节提供的运算符需要两个值，而 `typeof` 需要一个。需要两个值的运算符被称为二元运算符。而与单个值工作的被称为一元运算符。


    ## 布尔值


    通常情况下，程序员需要能够区分两个选项的值，例如，“开启”或“关闭”。为了这个目的，JavaScript 支持一种名为 `Boolean` 的值类型（它只有两个值：`true`
    和 `false`）。


    ## 比较


    你可以使用以下方法创建布尔值：


    ![](img/0036.jpeg)


    `<` 和 `>` 字符分别表示“小于”和“大于”。这两个符号都属于“二元运算符”类别。如果你在代码中应用它们，将得到一个显示是否为真的布尔值。你可以使用相同的方法比较字符串：


    ![](img/0037.jpeg)


    字符串按字母顺序排列。此外，小写字母比大写字母“更重要”。这意味着“a” > “b” 是真的。JavaScript 还将特殊字符（如 -, ? 等）包含在字符串中。比较过程遵循
    Unicode —— 它为你可能需要的每个字符分配一个数字。此功能非常有用，因为它允许你通过将字符串转换为数字序列来存储。在比较字符串时，JavaScript
    从左到右工作，逐个检查每个字符的序列。


    你还可以使用类似的运算符，如 `<=`、`>=`、`!=` 和 `==`。查看示例：


    ![](img/0038.jpeg)


    在 JavaScript 中，仅有一个值不等于它自己。这个值就是 `NaN` 或“不是数字”。


    ![](img/0039.jpeg)


    最初，`NaN` 用于表示不理性计算的结果。因此，它不能等于其他理性计算的结果。


    ## 逻辑运算符


    在这一节中，你将学习可以应用于布尔值本身的不同操作。JavaScript 语言提供了三种运算符，即：与、非、或。你可以使用这些运算符对布尔值进行逻辑处理。正因如此，它们被称为“逻辑运算符”。


    ### a) 与 (and)


    `&&` 符号表示“与”。该运算符是二元的。此外，只有当你处理的两个值都为真时，它才会提供 `true` 结果。这里是一些示例：


    ![](img/0040.jpeg)


    ### b) 或 (or)


    如果你想使用“或”运算符，你应该使用 `||` 符号。如果你处理的值中有一个为真，“或”将将给你一个 `true` 结果。查看下方图片：


    ![](img/0041.jpeg)


    ### c) 非 (not)

