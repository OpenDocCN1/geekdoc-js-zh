    \n### 未定义值\n\nJavaScript 语言支持两个特殊值来表示缺乏有用的值。这两个特殊值是“undefined”和“null”。尽管这两个被视为合法的值，但它们不携带任何信息。\n\
    \n通常，如果一个 JavaScript 操作无法生成有用的值，它会输出“undefined”，仅仅因为需要生成一个值。\n\n根据专家的说法，`null`\
    \ 和 `undefined` 之间的区别是 JavaScript 设计者的一个错误。这意味着这两个值在大多数时候被认为是相等的。如果你必须处理这些值，只需将它们看作脚本中可以交换的元素即可。\n\
    \n### 如何自动转换类型\n\n你可能知道 JavaScript 接受任何应用，甚至是那些执行异常操作的应用。下面列出的表达式将清晰地演示这一概念：\n\
    \n```\n![](img/00043.jpeg)\n```\n\n如果你对错误的值类型应用运算符，JavaScript 将自动将该值转换为正确的类型。JavaScript\
    \ 使用一组规则执行此功能，这些规则有时是出乎意料或不受欢迎的。程序员将这种自动过程称为“类型转换”（type coercion）。正因如此，第一行的 `null`\
    \ 被转换为 `0`，而下一行的“5”被转换为 `5`（即从字符串到数字的转换）。然而，第三行尝试使用 `+` 拼接这些值，因此 `1` 变成了“1”（数字到字符串的转换）。\n\
    \n如果你将一个非数字值（“six”或 `undefined`）转换为数字，你将得到 `NaN` 结果。在 `NaN` 值上应用数学运算将产生更多的 `NaN`，所以如果你在意外或不受欢迎的情况下得到此值，请检查你的代码中是否存在多余的类型转换。\n\
    \n# 第 3 章：JavaScript 中的程序结构\n\n本章将教你“真正的编程”。你将使用 JavaScript 命令，这些命令超越了你目前为止使用的名词和短语。请仔细学习这些材料，因为这将帮助你在两周内掌握\
    \ JavaScript 的基础。\n\n## 语句和表达式\n\n在上一章中，你通过对现有值应用运算符来生成新值。看起来值的创建是 JavaScript\
    \ 程序中最重要的部分。然而，这只是这种强大语言的一小部分。\n\n创建值的代码部分被称为“表达式”（expression）。因此，你字面上编写的任何值（例如\
    \ `99` 或“99”）都属于此类。即使你将它们括在括号中，它们仍然被称为表达式。同样，即使你使用单元、二元或三元运算符，表达式仍然是表达式。上面的段强调了基于语言的编程接口的优势。表达式在任何人类语言中都相当于子句——它们内部可以包含其他表达式。这意味着你可以混合\
    \ JavaScript 表达式来描述复杂的计算。\n\n如果表达式等于子句，那么 JavaScript 语句就等于完整的句子。基本上，一个 JavaScript\
    \ 程序只是语句的集合。\n\n最基础的语句类型是一个值后跟一个分号。根据这一原则，我们可以创建这个简单的程序：\n\n```\n0;\nfalse;\n\
    ```\n\n在 JavaScript 中，上面的示例被视为一个完整的程序。尽管如此，它是毫无价值的。只有当语句执行某些影响其他事情的操作时它才有用（例如在屏幕上显示某些字符、改进编程环境等）。上面显示的两个语句仅仅创建了两个值（即\
    \ `0` 和 `false`）。它们没有改变或改进任何东西。如果你执行这个程序，你不会观察到任何显著的现象。\n\n## 变量\n\nJavaScript\
    \ 程序是如何维护自身的？它们是如何存储东西的？你已经见过如何使用旧值创建新值。然而，那个过程并没有修改原有的值。你还需要立即使用产生的值，否则它们将直接消失。\n\
    \n```\nvar example = 3 * 3;\n```\n\n在这个示例中，`var`（JavaScript 中的关键字之一）表示该行将创建一个变量。关键字之后是变量名，如果你想立即赋值，后面跟着一个\
    \ `=` 符号以及你所需的表达式。\n\n该语句生成了一个名为 `example` 的变量，并用它存储 `3 * 3` 的乘积。\n\n一旦定义了变量，你就可以在未来的\
    \ JavaScript 语句中使用它的名称作为普通表达式。你从该“表达式”中得到的值与你在创建它时赋值的值相同。查看以下示例：\n\n```javascript\n\
    var three = 3;\nconsole.log(three * three);\n// -> 9\n```\n\n在命名变量时，你可以使用任何不是关键字（例如\
    \ `var`）的单词。你可以在变量名中包含数字，但不能使用数字作为起始字符。例如，`programming1` 是有效的，但 `1programming`\
    \ 则。此外，你不能在变量命名中使用空格。在特殊字符方面，你可以使用美元符号（`$`）和下划线（`_`）。\n\n你可以更改给变量的值。在 JavaScript\
    \ 中，只需对任何变量使用 `=` 符号给它一个新值。\n\n```javascript\nvar taste = \"bitter\";\nconsole.log(taste);\n\
    // -> bitter\n\ntaste = \"sweet\";\nconsole.log(taste);\n// -> sweet\n```\n\n\
    通常情况下，你应该将变量视为触角而不是容器。变量抓取值，而不是包含值。这意味着多个变量可以指向同一个值。\n\n让我们分析一个简单的示例。你需要创建一个变量来记住\
    \ Johnny 欠你的钱。当他付给你 50 元时，你必须给现有变量分配一个新值。查看以下行：\n\n```javascript\nvar JohnnysDebt\
    \ = 200;\nJohnnysDebt = JohnnysDebt - 50;\nconsole.log(JohnnysDebt);\n// -> 150\n\
    ```\n\n如果你创建一个变量但不赋值，将被认为是空的。如果你请求它包含的值，它将给你 `undefined`。\n\nJavaScript 允许在一个\
    \ `var` 语句中包含多个变量。在使用此功能时，你应该使用逗号分隔变量。\n\n```javascript\nvar three = 3, four =\
    \ 4;\nconsole.log(three + four);\n// -> 7\n```\n\n### JavaScript 中的保留字\n\n正如前面所述，在命名变量时不能使用关键字。然而，还有其他你不能作为变量名的单词，因为\
    \ JavaScript 为未来的发展预留了它们。以下是该脚本语言的一些保留字：\n\n`in, do, let, if, new, try, with,\
    \ case, void, with, while, false, yield, extends, delete, default, const, debugger,\
    \ class, break, finally, null, private, return, import, protected, switch, super,\
    \ interface, instanceof, throw, implements`\n\n记住，在定义变量时不能使用上述单词。如果你忘记了了这个简单的规则，在处理\
    \ JavaScript 程序时可能会遇到问题。\n\n 环境\n\n"
