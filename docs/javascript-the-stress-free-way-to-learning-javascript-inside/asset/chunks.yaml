    # 第 1 章：JavaScript 语言


    ### 基础信息


    JavaScript 是今天最流行的编程语言之一。这种语言在现代网站和网页的发展中起着重要作用。它的特性和功能可以帮助你创建支持用户交互的动态网站。此外，JavaScript
    是一种解释型计算机语言，具有强大的面向对象特性。


    这种语言最初被称为 `LiveScript`，但 NetScape（创建它的公司）将其更名为 JavaScript，以利用 Java 享有的普及。必须指出，JavaScript
    与 Java 语言之间没有联系。


    ### JavaScript 的客户端形式


    根据计算机专家的说法，该语言最流行的变体是客户端 JavaScript。网站开发者在创建项目时使用这种变体。通常，你可以通过两种不同的方式使用客户端 JavaScript：


    *   包含在网页代码中


    '
- fmt: '

    *   `Save it in an external file`


    For the second option, you will need to use an HTML document to reference the
    external file and link it to your website.


    Basically, you don’t have to use static HTML in creating your webpages. You can
    include apps and programs that allow browser control, user interactions, and dynamic
    creation of HTML files.


    The Client-Side type of JavaScript has various advantages over typical CGI (i.e.
    Common Gateway Interface) server-side scripts. For instance, you can use Client-Side
    JavaScript to determine if the user has provided valid contact information in
    your form fields.


    JavaScript codes run whenever a user submits a form. Then, the system will analyze
    the information in the submitted form. This mechanism ensures that the Web Server
    won’t process invalid requests. Thus, Client-Side JavaScript offers better security
    and performance for your websites.


    This programming language also allows you to collect implicit or explicit actions
    that users initiate (e.g. link navigation, button clicks, etc.).


    ## The Advantages Offered by JavaScript


    Here are the main advantages offered by this programming language:


    * You can reduce server interactions– JavaScript can validate the information
    entered by the users before sending it to the web server. That means you can filter
    out the useless traffic from your server.

    * Instant feedback– Your website visitors will immediately see if they have missed
    a field or entered the wrong data. They will see the error message without any
    page reload.

    * Improved webpage interactivity– With JavaScript, you can generate user interfaces
    that respond to mouse and keyboard inputs.

    * Enhanced Interfaces– In this language, you can easily add cool interface items
    (e.g. sliders, drag-and-drop components, etc.) to provide your website visitors
    with an enhanced interface.


    ## The Disadvantages of JavaScript


    Just like other things in life, JavaScript has its own drawbacks. The main ones
    are:


    * This language doesn’t have multiprocessing or multithreading capabilities.

    * You can’t use JavaScript for networking programs. This language doesn’t support
    programs/applications that focus on networking.

    * You can’t read or edit files written using Client-Side JavaScript. These features
    are disabled for security reasons.


    # Chapter 2: The Syntax of JavaScript


    You may implement this language by placing JavaScript statements inside your webpage’s
    `<script>` tags. In general, you can put these `<script>` tags anywhere in the
    webpage. Professional website developers, however, usually keep these tags inside
    the page’s `<head>` tags.


    Basically, a `<script>` tag instructs browsers to interpret the text it contains
    as a script. Here is the basic syntax of JavaScript:


    ![](images/00001.jpeg)


    Script tags accept the following attributes:


    * Language– This attribute indicates the language being used. Recent versions
    of HTML and XHTML, however, no longer support this attribute.

    * Type– This is the attribute being used in modern sites and webpages. You must
    use it to indicate the computer language you are using. Make sure that its value
    is“`text/javascript”.


    Taking those attributes into account, the syntax of JavaScript is:


    ![](images/00002.jpeg)


    ## Using JavaScript for the First Time


    In this section, you’ll be using this scripting language for the first time. The
    code that you will use is designed to display“Hello World” on the screen of your
    computer. As you can see, the JavaScript code (see the screenshot below) involves
    an optional HTML element. That HTML comment allows you to save the code from browsers
    that don’t support the JavaScript language.


    The symbol`//` terminates the HTML comment. In JavaScript,`//` represents comments.
    That means you have to use a pair of slashes to prevent browsers from interpreting
    HTML comments as part of your JavaScript statements. Then, you must invoke the
    `document.write()` function to write a string into your HTML file.


    Important Note: You can use the `document.write()` function to write HTML statements,
    text-based content, or both.


    Here’s the code that you must type into your JavaScript editor:


    ![](images/00003.jpeg)


