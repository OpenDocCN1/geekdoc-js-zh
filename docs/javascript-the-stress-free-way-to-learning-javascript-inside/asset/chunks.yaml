    在检查漏洞和错误时，你所使用的编程语言易于阅读和理解至关重要。如果编程语言太复杂，你在编写代码和检查程序时可能会遇到困难。使用 `Python`，代码的读写性会变得容易得多；因此，你可以轻松解释代码并进行必要的更改。


    此外，`Python` 还有许多其他用途。它是基于浏览器的脚本应用程序、创建优秀的用户界面和粗略的应用示例、与交互、处理 XML 以及设计数学、工程和科学应用的理想选择。


    # Python 对比 C#、Java 和 Perl


    你可能会发现对编程语言进行相互比较是一项主观的任务。通常，它们的差异取决于个人偏好。尽管如此，有时这种比较是有科学数据支持的。无论如何，你都必须记住，并不存在全能的编程语言。作为一个程序员，你只需要找到一个最适合你目标或需求的语言即可。


    ## C#


    如果你有 `Java` 背景，你可能会发现 `C#` 和 `Java` 非常相似。但话又回来，与 `Java` 相比，`C#` 仍然有自己的优缺点。微软声称，他们开发
    `C#` 的主要目标是产生一个更好的 `C` 和 `C++` 版本。然而，与 `C#` 相比，`Python` 具有更好的科学工程应用以及更好的跨平台支持。在在使用
    `C`、`C++` 和 `Java` 时，它更具扩展性。它更容易学习和理解，并且允许各种计算机环境。它的代码也更加简洁。


    ## Java


    程序员将 `Java` 视为一种一站式编程语言。多年来，他们一直在寻找一种可以随处运行和编写的，并发现了 `Java`，它可以在不同的平台和计算机环境中良好运行。尽管如此，`Python`
    也是一种一站式编程语言。它与 `Java` 非常相似，区别在于它的代码更简洁，更容易学习和理解。它的开发速度快得多，并且改进了可以存储不同数据类型的数据框或变量，这在运行应用程序时非常有用。


    ## PERL


    `PERL` 代表实用提取和报告语言（Practical Extraction and Report Language）。是一种适用于从另一个数据库获取和处理数据的编程语言。相比之下，`Python`
    比 `PERL`，因为它更容易阅读、实现、学习和理解。它具有更好的 `Java` 集成和数据保护。它还有较少的特定平台偏见。


    # 为什么 Python 是初学者的理想选择？


    如果你刚刚开始编程，你可以考虑 `Python`。它是初学者的理想选择，因为它具有一致且简单的语法，以及丰富的标准库，允许你完成多个项目。其中涉及的作业不仅限于常见的四功能计算器和平衡性检查程序。


    当你习惯了在 `Python` 中编写程序时，你会发现编写现实应用实际上非常简单。交互式解释器还允许你测试语言特性。在 `Python` 中，你可以专注于核心编程技能，如程序分解和数据类型设计，以及基础概念，包括过程和循环。


    由于 `Python` 涉及到多个库的使用和系统调用，你可以开发具有易于编程的接口的应用程序。你还可以完成应用程序接口（`API`）所需的任务。


    如果你以前从未用过任何其他编程语言，请担心。即使是没有任何先编程知识或经验的人也可以轻松掌握 `Python` 编程语言的基础知识。


    至于安装，`Python` 很容易安装。大多数 `UNIX` 和 `Linux` 发行版实际上都包含了它的软件包中。如果你从惠尔-惠普（HP）购买了 Windows
    电脑，你可以随时使用 `Python`，因为系统预装了它。


    为了让你操作更方便，你应该学习如何使用文本编辑器以及集成开发环境（`IDEs`）。阅读带有示例代码和程序的编程书籍也会有所帮助。


    关于版权，`Python` 的开发者允许程序员对源码进行任何他们想做的事，只要忘记包含版权即可。版权规则并不严格。你甚至可以出售二进制和源代码形式的副本以及涉及使用
    `Python` 的产品。然而，如果你想使用标志，请确保你获得了许可。


    `Python` 非常稳定。事实上，它稳定到足以日常使用。你可以预计在六到十八个月内出一个新版本。开发者发布漏洞修复版本，以确保新版本比之前的版本更好。


    如果你想执行静态分析或搜索漏洞，可以使用 `Pylint` 或 `PyChecker`。前者是一个检查模块以符合符合编码标准的工具，并允许自定义插件。后者是一种在源代码中寻找漏洞的静态分析工具。


    既然你已经学习了编程语言的基础知识，你可能仍然好奇 `Python` 是怎么命名的。Guido van Rossum 喜欢蟒蛇（pythons）吗？事实上，他其实喜欢的是一部名为《蒙提·派恩的飞行马团》（Monty
    Python’s Flying Circus）的电视节目，而不是爬行动物。


    在 `Python` 开发期间，他正在读这部喜剧剧剧本，认为“Python”是一个合适的名字，因为它短、独特且具有恰好的神秘感。事实上，文档中允许并实际上鼓励对该喜剧剧进行引用。


    # 第 2 章：语法


    `Python` 具有简单直接的语法。它甚至鼓励程序员在不使用准备好的或模板代码的情况下编写程序。`print` 指令实际上是所有指令中最简单的。它打印行并包含换行符。你可能会发现
    `print` 指令在编程语言的新版本中有所不同。


    `Python` 2.0 是常用版本，而 `Python` 3.0 支持最新特性并在语义上更正确。无论如何，`print`语句在 2.0 版本中不被视为函数；因此调用它时不需要括号。另一方面，`print`语句在
    3.0 版本中被视为函数；因此你想调用它时必须使用括号。


    ## 交互模式编程


    你可以在不同的模式下执行程序。如果你在调用解释器时不传递脚本文件作为参数，这就是你会得到的：


    ```

    $ python

    Python 2.4.3 ( #1, Nov 11 2010, 13:34:43 )

    [GCC 4.1.2 20080704 ( Red Hat 4.1.2– 48 )] on linux2

    Type“help”,“credits” or“license” for more information.

    >>>

    ```


    看到这个提示时，你可以输入文本并按回车。在这个例子中，我们将使用“Monty Python and the Holy Grail”。


    ```

    >>> print“Monty Python and the Holy Grail”

    ```


    注意，如果你使用的是语言的新版本，你需要在打印语句中使用括号，如下所示：


    ```

    >> print (“Monty Python and the Holy Grail”)

    ```


    无论你使用哪个版本，如果你运行上面的示例代码，你将获得以下输出：


    Monty Python and the Holy Grail


    ## 脚本模式编程


    如果你带脚本参数调用解释器，脚本将开始执行并一直运行完成。完成后，解释器将不再活动。考虑以下示例。示例程序写在脚本中，并具有 `.py` 扩展：


    ```

    print“Monty Python’s Flying Circus”;

    ```


    如果你在 `test.py` 文件中输入上述源代码并运行它：


    ```

    $ python test. py

    ```


    你将获得以下输出：


