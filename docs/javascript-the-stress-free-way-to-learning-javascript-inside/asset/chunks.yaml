    The term “environment” refers to the set of active values and variables. Basically,
    environments cannot be empty while starting up a JavaScript program. Environments
    hold variables related to the language itself, and often, they have variables
    that allow interactions with computer systems. For instance, in web browsers,
    various functions and variables exist to check and affect the current website
    and read the inputs from the mouse and keyboard.


    ## The Functions


    The default JavaScript environment involves functions. Functions are pieces of
    computer programs linked to a value. You may apply these values to activate the
    linked program. For instance, in browser environments, `alert` (i.e. a variable)
    contains a function that displays a dialog box. Here’s an example:


    ```javascript

    alert("You are not authorized to access this page!");

    ```


    You may execute a function by placing parentheses after a JavaScript expression
    that generates a function value. Often, you’ll indicate the name of the variables
    that contain your desired functions. By enclosing values inside the parentheses,
    you are assigning those values to the program/s within the function. For the previous
    example, “alert” uses the assigned string to show a message in the resulting dialog
    box. Programmers use the term “arguments” when referring to the value/s assigned
    to a function.


    ## The “console.log”


    You can use `alert` when trying out new strings or statements. However, since
    it requires you to close out the resulting windows, you might find it inconvenient
    and time-consuming. Because of this, you might want to use the function you’ve
    seen in the earlier sections of this book: `console.log`. Almost all JavaScript
    systems (e.g. Node.js, web browsers, etc.) offer this function to transfer arguments
    to a text-compatible output device.


    When it comes to web browsers, the code’s output goes to the console of JavaScript.
    Although this section of the browser GUI is usually hidden, you can access it
    by pressing certain keys (i.e. for Windows computers, hit F12; For Mac computers,
    hit Command-Option-I). If you are having problems viewing this part, you may run
    an intra-device search for “developer tools” or “web console.” Analyze the following
    example:


    ```javascript

    var a = 99;

    console.log("one hundred minus one is", a);

    // -> one hundred minus one is 99

    ```


    As discussed earlier, you can’t use periods or commas when naming variables. However,
    the example given above contains one. The reason for this is that `console.log`
    isn’t an ordinary variable. It is a JavaScript expression that collects the “log”
    information from the value stored in `console` (which is a variable).


    ## The Return Values


    Writing information on the screen and displaying dialog boxes are known as side
    effects. Because of these side effects, functions are important in the JavaScript
    language. You may also use functions to generate values – in this case, a function
    can be useful even without its side effects. For instance, `Math.max` (a JavaScript
    function) receives an unlimited number of numeric values and indicates the highest
    one. Here’s an example:


    ```javascript

    console.log(Math.max(1, 2, 3, 4, 5));

    // -> 5

    ```


    In JavaScript, anything that generates values is considered as an expression.
    That means you can perform function calls in large expressions. In the example
    below, you’ll use the `Math.min` function as an input for the `+` operator:


    ```javascript

    console.log(Math.min(1, 2) + 98);

    // -> 99

    ```


    ## Chapter 4: More Information About Functions in JavaScript


    In the previous section, you’ve learned how to create and call function values.
    This chapter will help you understand this important topic further. According
    to expert programmers, functions serve as your main tools when using JavaScript.
    Functions are powerful tools that can help you design large programs, minimize
    redundancy, name subprograms, and secure isolation for each subprogram. That means
    you have to master functions if you want to be use JavaScript effectively. This
    chapter will help you to learn this scripting language in just two weeks.


    Many people apply functions to define new vocabularies. That means you can use
    them to create words and assign meanings.


    An average English speaker has about 20,000 words in his/her vocabulary. Well,
    programming languages usually don’t have that amount of built-in commands. That
    means the vocabulary in programming is more precise than those used in human languages.
    If you want to minimize redundancy, you have to add your own words into JavaScript
    and create your own vocabulary.


    ## How to Define a Function


    Defining a function is like defining an ordinary variable. The only difference
    is that the value you are assigning is a function. For instance, the code below
    defines a variable named “square.” This variable points to a function that generates
    the square of any assigned number.


    ![](images/00044.jpeg)


    When creating a function, you should start an expression with this keyword: `function`.
    Each function has two parts: (1) body and (2) parameter/s. The function’s body
    stores the JavaScript statements that you want to execute once the function is
    invoked (or called). Additionally, you should always enclose the body using curly
    braces (even if it contains a single statement).


    A parameter, on the other hand, is a name listed in the function’s definition.
    Functions may have one or more parameters. Actually, you can even create a function
    without entering any parameter. To help you understand this concept, let’s create
    two functions: `makeNoise` and `power`.


    ![](images/00045.jpeg)


    As you can see, `makeNoise` doesn’t have any parameter. Meanwhile, `power` has
    two (i.e. base and exponent).


    ## The Parameters and Scopes in JavaScript


    A function’s parameters behave like ordinary variables, although they get their
    original value from the programmer, not from the function they are linked to.


    Here is an important property of any function: all of the variables created in
    it (even the parameters) are local to it. That means, for instance, that `result`
    in the power statement will refresh itself each time the function is invoked.
    These separate repetitions don’t affect each other.


    It is important to note that this “principle of locality” is applicable only for
    variables and parameters defined using `var`. Additionally, you should define
    the variables and parameters within the function’s body. A variable defined outside
    of a function is called global, since it can be seen and accessed throughout the
    JavaScript application. You may access global variables and parameters from within
    a function if they have no “local” counterparts.


    The code below illustrates this concept. It declares and invokes two functions
    that give a value to `x`. The first function defines the variable as a local one.
    The second function, on the other hand, doesn’t. That means if you will reference
    `x` inside the function, you’ll point to the global `x` (shown at the first line
    of the example).


    ![](images/00046.jpeg)


    This functionality helps you in preventing unintended references or interactions
    between different functions. If JavaScript allows you to share all variables throughout
    the entire program, you’ll have to spend lots of time and effort in ensuring that
    names aren’t duplicated. Reusing variable names can give unexpected or undesirable
    effects on your codes. Thus, it can ruin the programs you are working on.


    Since this language treats local variables as if they exist only inside their
    respective function, it can work on functions as distinct worlds. JavaScript won’t
    have to worry about the entire application whenever you work on a single function.


    ## The Nested Scope


    Aside from defining local and global variables, JavaScript uses other methods
    to distinguish different kinds of functions. For example, you may create functions
    within existing functions. This technique produces multiple levels of locality.


    For instance, the function given below contains two functions:


    ![](images/00047.jpeg)

