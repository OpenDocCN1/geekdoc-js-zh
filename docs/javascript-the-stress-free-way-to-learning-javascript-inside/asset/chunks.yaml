    这两个函数（即 `flat` 和 `mountain`）都可以访问 `result` 变量，因为它们被放在声明该变量的函数内部。然而，它们无法访问彼此的变量。这意味着位于函数外部的程序环境无法访问其包含的变量。


    使用过其他语言的程序员可能会认为，他们可以通过大括号封装代码块来创建新的本地环境。但在 JavaScript 中，只有函数可以生成新的作用域。


    ## 将函数作为普通值使用


    通常，函数变量作为程序某些部分的名称。你不能修改现有的函数变量：一旦你定义了它们，它们将阻止你进行任何后续修改。这种特性可能会导致关于名称以及它们所指代的函数之间的混淆。


    显然，函数和变量是两个不同的东西。函数值可以像普通值一样执行操作——你可以在复杂表达式中并并它们。你可以更改函数值的位置，将其作为函数的参数传递等。同样，包含函数的变量仍然被视为普通变量。这意味着你可以给它们赋予新值。


    ## 声明


    JavaScript 提供了一种快速简单的方法来声明函数。你只需要使用 `function` 关键字开始你的语句。例如：


    ![](img/00048.jpeg)


    上述语句被称为“声明”。它定义了一个名为 `square` 的变量并赋予它一个特定的函数。这个例子很容易理解。然而，这种定义函数的方法有一个细微之处：


    ![](img/00049.jpeg)


    最后一个示例运行完美完美，即使函数被声明在它被赋值的代码之之下。这段代码是有效的，因为声明忽略了从上到下的语句结构。你实际上可以将声明移动到其作用域的顶部，以便本地代码可以访问它。此功能非常有用，因为它允许你以有意义的方式安排代码，而无需定义所有受影响的函数。


    ## 可选参数


    JavaScript 语言接受下面的代码。在调用它时，你不会遇到任何问题。


    ```

    alert(“Hi”, “Good Morning”, “How are you?”);

    ```


    从官方来说，`alert` 函数只接受一个参数。但是，如果你使用上面的示例代码调用它，它不会报错。它只会接受第一个参数（即“Hi”）并忽略其余部分。


    这门编程语言在处理分配给函数的参数数量时是“思想开放”的。如果你分配了太多的参数，它会接受有效的参数并忽略其他的。然而，如果你的参数不够，JavaScript
    将通过向适当的参数分配 `undefined` 来完成你的语句。


