    In JavaScript, there is just one value that is unequal to itself. This value is
    `NaN` or “not a number.”


    ![](images/00039.jpeg)


    Originally, `NaN` is used to represent the outcome of an irrational calculation.
    As such, it cannot be equal to the outcome of other irrational calculations.


