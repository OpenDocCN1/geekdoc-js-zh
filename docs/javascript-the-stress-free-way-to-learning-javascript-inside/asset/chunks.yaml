    *   `将其保存到外部文件中`


    对于第二个选项，你将需要使用 HTML 文档来引用外部文件，并将其链接到你的网站。


    基本上，在创建网页时并不需要使用静态 HTML。你可以包含允许浏览器控制、用户交互以及动态创建 HTML 文件的应用程序和程序。


    客户端（Client-Side）类型的 JavaScript 相比于典型的 CGI（即通用网关接口）服务器端脚本具有多种优势。例如，你可以使用客户端 JavaScript
    来判断用户是否在你的表表单字段中提供了有效的联系信息。


    每当用户提交表单时，JavaScript 代码就会运行。然后，系统将分析提交的表单中的信息。这种机制确保了 Web 服务器不会处理无效的请求。因此，客户端
    JavaScript 为你的网站提供了更好的安全性和性能。


    这种编程语言还允许你收集用户发起的隐式或显式操作（例如链接导航、按钮点击等）。


    ## JavaScript 提供的优势


    以下是该编程语言提供的主要优势：


    *   **减少服务器交互**—— JavaScript 可以在向 Web 服务器发送数据之前验证用户输入的信息。这意味着你可以从你的服务器中过滤掉无用的流量。

    *   **即时反馈**—— 网站访问者将立即看到他们是否漏掉了某个字段或输入了错误数据。他们无需刷新页面即可看到错误信息。

    *   **提高网页交互性**—— 通过 JavaScript，你可以生成对鼠标和键盘输入做出响应的用户界面。

    *   **增强界面**—— 在这种语言中，你可以轻松地为你的网站添加酷炫的界面元素（例如滑块、拖放组件等），为为你的网站访问者提供增强的界面。


    ## JavaScript 的劣势


    就像生活中的其他事物一样，JavaScript 也有自己的缺点。主要的包括：


    *   该语言没有多处理或多线程能力。

    *   你不能使用 JavaScript 编写网络程序。该语言不支持专注于网络方面的程序/应用程序。

    *   你无法读取或编辑使用客户端 JavaScript 编写的文件。出于安全考虑，这些功能被禁用了。


    # 第 2 章：JavaScript 语法


    你可以通过将 JavaScript 语句放置在网页 `<script>` 标签内来实现这种语言。通常情况下，你可以将这些 `<script>` 标签放在网页的任何位置。然而，专业的网站开发者通常会将这些标签放在页面的
    `<head>` 标签内。


    基本上，`<script>` 标签指示浏览器将其包含的文本解释为脚本。以下是 JavaScript 的基本语法：


    ![](img/00001.jpeg)


    脚本标签接受以下属性：


    *   Language（语言）—— 此属性指示所正在使用的语言。然而，最新版本的 HTML 和 XHTML 不再支持此属性。

    *   Type（类型）—— 这是现代网站和网页中使用的属性。你必须使用它来指定你正在使用的计算机语言。确保其值为“`text/javascript`”。


    考虑到这些属性，JavaScript 的语法如下：


    ![](img/00002.jpeg)


    ## 首次使用 JavaScript


    在这一节中，你将首次使用这种脚本语言。你将使用的代码设计用于在计算机屏幕上显示“Hello World”。正如你所看到的，JavaScript 代码（见下截图）涉及一个可选的
    HTML 元素。该 HTML 注释允许你防止不支持 JavaScript 语言的浏览器解析这些代码。


    符号 `//` 结束 HTML 注释。在 JavaScript 中，`//` 代表注释。这意味着你必须使用双斜杠来防止浏览器将 HTML 注释解释为你 JavaScript
    语句的一部分。然后，你必须调用 `document.write()` 函数将字符串写入你的 HTML 文件中。


    重要提示：你可以使用 `document.write()` 函数写入 HTML 语句、文本内容或两者兼有。


    以下是你必须输入到 JavaScript 编辑器中的代码：


    ![](img/00003.jpeg)


    如果编写和执行正确，上述代码将向你显示：Hello World!


    ### 空格与换行


    这种脚本语言忽略程序内部的制表符、空格和换行符。这意味着你可以使用这些元素使你的 JavaScript 代码更易读、更易理解。


    ### 分号


    与其他计算机语言（例如 `C++`）类似，JavaScript 要求你使用分号来结束简单的语句。然而，如果你的语句是分行输入的，你就不需要添加分号。例如，下面的代码即使没有分号也能正常运行：


    ![](img/00004.jpeg)


    ### JavaScript 语句的大小写敏感性


    这种编程语言是对大小写敏感的。例如，“`WORD`”、“`Word`”和`word`”在 JavaScript 中被视为三个不同的实体。这意味着在处理函数、关键字、变量和其他标识符时，你必须保持字母大小写的一致。


    ### JavaScript 注释


    在 JavaScript 中创建注释时，你必须记住以下规则：


    *   该语言忽略放置在 `//` 和行尾之间的所有文本。

    *   你可以使用 `/*` 和 `*/` 来创建注释。通常情况下，程序员在创建多行注释时使用这些符号。

    *   JavaScript 还允许你在编写单行注释时使用 `<!—`（即 HTML 中用于开始注释的符号）。

    *   JavaScript 不识别 `-->`（即 HTML 中用于结束注释的符号）。你必须使用 `//-->` 代替。


    # 第 3 章：JavaScript 代码的放置


    你可以将 JavaScript 代码放置在 HTML 文件的任何部分。然而，在 HTML 文档中保留 JavaScript 代码的推荐区域是：


    *   在 `<head> </head>` 区域内

    *   在 `<body></body>` 区域内

    *   在文档的 `<head>` 和 `<body>` 区域

    *   在外部文件中


    本章将讨论这些区域。


    ### 在 <head></head> 区域使用 JavaScript


    如果你希望脚本在特定事件期间运行（例如用户点击按钮时），这是理想的区域。下面的示例代码将向你如何在此区域保存代码。


