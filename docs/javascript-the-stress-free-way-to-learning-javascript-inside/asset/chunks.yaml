    The sample code given above used `console.log` to show the results you’ll get
    with `typeof`. Whenever you run this kind of code, you should immediately see
    the value on your computer screen.


    The operators given in the previous section required two values, while `typeof`
    requires one. Operators that require two values are known as binary operators.
    Those that work with a single value, however, are known as unary operators.


    ## The Boolean Values


    Usually, programmers need values that can distinguish between two options, such
    as “on” or “off” and “yes” or “no.” For this purpose, the JavaScript language
    supports a value type called `Boolean` (which has two values only: `true` and
    `false`).


    ## Comparisons


