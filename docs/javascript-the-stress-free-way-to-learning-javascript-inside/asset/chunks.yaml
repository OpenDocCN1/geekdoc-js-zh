  trans: '


    既然你已经了解了基础知识，现在是时候尽情享受 Windows 10 了！


    # 第 5 章：了解功能


    当然，为了确保你能够享受 Windows 10 的各种功能，学习如何使用它的许多功能是恰恰好的！


    ## 在网页上书写


    这是 Windows 10 的一个趣味功能！基本上，借助 Windows 10 自带的下一代浏览器 `Microsoft Edge`，你可以通过在网页上直接书写来增加一些乐趣！


    要开始“书写”，点击浏览器窗口右上角看起来像笔和纸的图标。


    点击该后后你正在浏览的网页将刷新。然后你就可以使用屏幕上显示的工具在指定的网页上书写或涂鸦了！


    要输入注释，可以使用前面提到的工具栏上的文本工具。


    你可以点击数字大钉并关闭文本框来使页面保持整洁。


    点击垃圾桶图标删除文本框以及注释钉。


    你还可以使用剪切工具让光标变成十字准星。


    你还可以使用橡擦工具逐行擦除。只需点击、按住并在屏幕上你不想要的线条上移动即可。


    要分享或保存你完成的内容，只需点击保存图标。然后，屏幕上会弹出一个菜单。这会询问你是否想将项目添加到阅读列表、保存到 `OneNote` 或添加到收藏夹。只需选择你想要的操作即可。


    ## 管理通知


    由于 Windows 10 被证明是新时代的操作系统，你可以预期它会为你提供实时通知。简而言之，你会收到来自 `Facebook`、`Twitter`、`Instagram`
    以及你可能使用的任何其他应用的通知——只要它们连接到了你的 `Microsoft account`。


    要选择你想接收哪些通知，前往`操作中心` > `来自这些应用的通知`。在那里，你会看到已安装的应用列表。只需选择你想要的通知，就设置好了！


    你还可以选择想要访问哪些`快速操作`。要执行此操作，前往`设置` > `系统` > `通知和操作` > `选择你的快速操作`。


    ## 快速共享文件


    找到你想共享的文件。


    在`文件资源管理器`中点击`共享`。


    点击`共享` 按钮。


    选择你想与哪个程序共享该文件。


    通过`设置` > `系统` > `共享实验室` 配置选项。


    ## 设置默认程序


    你可以按照以下指令更改默认程序和协议：


    打开`设置` > `系统` > `默认应用`。


    更改你想用于电子邮件、日历、地图、网络浏览器、视频播放器、照片查看器等的程序。


    要设置单个文件类型，前往`设置` > `系统` > `按类型选择默认应用`。


    要设置协议的默认值，前往`设置` > `系统` > `按协议选择默认应用`。


    要更改默认程序，只需前往`设置` > `系统` > `设置默认值` > `设置默认程序` > `将程序设置为默认值` > `为此程序选择默认设置`。


    ## 探索照片应用


    请注意`照片应用`现在有两个主要功能，它们是：`集合`和`相册`。你的照片在`集合`选项中按日期顺序排列。同时，`相册`包含应用为你自动创建的相册。


    要添加文件夹，前往`设置` > `源` > `添加文件夹` > `将此文件夹添加到图片`。


    要显示来自 `OneDrive` 的照片和视频，只需选择`设置` > `显示来自 OneDrive 的照片和视频`。


    要共享图片，只需选择你想共享的图片并点击`共享`！


    你还可以利用`筛选器`和其他`编辑功能`！


    ## 使用弹出窗口延迟快门速度


    你也可以通过确保捕获弹出窗口来延迟截屏时的快门速度。方法如下：


    打开`捕取工具`然后点击`延迟`。在 0 到 5 之间选择数字。


    通过点击`新建`旁边的选项选择你想制作的`截取`类型。从`窗口`、`矩形`、`任意`、`全屏`中选择。


    点击`新建`即可开始截屏。你现在将拥有 0 到 5 秒的间隔，取决于你之前的选择。屏幕将冻结，你就可以捕捉你想要的图像。


    点击`保存`保存你的截图。


    ## 导入书签


    如果你之前使用过其他浏览器并想重新访问在其中创建的书签，只需将它们导入到 `Edge`。方法如下：


    打开`Edge`并点击`…`，然后点击`设置`。


    选择`从其他浏览器导入收藏`。


    选择所有想要从其导入书签的浏览器就设置好了！


    ## 侧载应用


    侧载非常重要，因为允许你安装 `Windows Store` 中不可用的应用。以下是操作方法：


    打开`设置` > `更新和安全性`。


    前往`开发人员` > `侧载应用`。


    你现在将收到一个关于侧载具有危险性的警告。只需点击“是”表示你理解这些风险。


    ## 禁用 Wi-Fi 密码共享


    为了确保你的 `Wi-Fi` 连接保持安全，你可以禁用 Wi-Fi 密码共享。方法如下：


    前往`设置` > `网络和 Internet` > `Wi-Fi`。


    ## 进入安全模式


    如果 Windows 10 出现问题并需要进入安全模式，方法如下：


    打开`设置` > `更新和安全性` > `恢复`。


    点击`疑解答` > `高级选项` > `重启`。


    # 第 6 章：键盘快捷键和更多技巧


    学习帮助你使用 Windows 10 的键盘快捷键和技巧


    ## 打开打开的快捷方式


    前往`开始菜单` > `所有应用`。


    找到你想创建快捷方式的程序并将其拖到桌面。右键点击。


    现在打开`快捷方式`选项卡。选择与该程序关联的按键（例如 `CTRL + ALT + [按键]`）。


    点击继续。


    ## 命令提示的快捷方式


    前往`开始菜单` > `所有应用` > `Windows 系统` > `命令提示`。


    点击`属性` > `选项` > `编辑` > `启用快捷快捷键`。


    现在是你可以使用的快捷键列表：


    ```

    Alt + F4 (关闭命令提示)

    CTRL + A (选择行内容)

    CTRL + C 或 CTRL + Insert (将选择的文本复制到剪贴板)

    CTRL + F (在命令提示中查找)

    CTRL + M (进入标记模式)

    CTRL + Page Up/Down (屏幕向上或向下移动)

    CTRL + Shift + Home/End (光标移动到缓冲区开头/结束，然后选择文本和输出)

    CTRL + Shift + Left/Right (光标向左或右移动并选择文本)

    CTRL + Up/Down (向上或向下移动一行)

    ```


    ## 其他常用的键盘快捷键


    Windows  + 左 (将窗口靠到左侧)


    Windows  + 右 (将窗口靠到右侧)


    Windows  + 上/下 (将窗口靠到象限)


    Windows  + Tab (任务视图)


    Windows  + CTRL + 左 (返回上一个虚拟桌面)


    Windows  + CTRL + 右 (前往下一个虚拟桌面)


    Windows  + CTRL + F4 (关闭当前虚拟桌面)


