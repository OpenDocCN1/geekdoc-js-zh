    以下是可以在 JavaScript 语言中使用的循环：


    ## While 循环


    程序员认为这是 JavaScript 中最基础的循环类型。基本上，`while` 循环在表达式为真时会执行语句或代码块。一旦表达式变为假，循环将立即结束。


    以下是 `while` 循环的流程图：


    ![](img/00021.jpeg)


    ### 语法


    以下是 `while` 循环的语法：


    ![](img/00022.jpeg)


    在执行任何语句之前，`while` 循环会评估赋值表达式的条件。这意味着如果表达式为假，则不会执行任何语句。


    ### Do… while 循环


    `do… while` 循环与 `while` 循环相似。唯一的区别是它在执行完赋值语句/语句后才评估表达式。如果评估结果为真，循环将再次执行该语句/语句。只有当结果变为假时，循环才会停止。正如此，即使评估结果为假，`do…
    while` 循环也会至少运行一次。


    典型的 `do… while` 循环的流程图如下：


    ![](img/00023.jpeg)


    ### 语法


    以下是 `do… while` 循环的语法：


    ![](img/00024.jpeg)


    **重要**：语法末尾的分号是强制性的。请确保在所有的 `do… while` 循环中都包含它。


    ### For 循环


    这种循环以其紧凑性著称。通常，`for loops` 包含以下部分：


    *   循环初始化——这是你从一个初始值开始计数器的部分。JavaScript 解释器会在运行循环本身之前执行这部分。

    *   测试语句——循环的这部分会评估赋值的条件。如果赋值条件为真，解释器将执行 `for` 循环内部的代码。然而，如果条件为假，系统控制权将交给 `for`
    循环之后的语句。

    *   迭代语句——你可以使用这部分来增加或减少循环的计数器。


    JavaScript 允许你将所有这些部分放在同一行中。你只需要用分号分隔每个部分即可。


    下面的图片显示了 `for` 循环的流程图：


    ![](img/00025.jpeg)


    ### 语法


    `for` 循环的语法为：


    ![](img/00026.jpeg)


    ## 如何控制你的循环


    JavaScript 语言允许你操作所有的循环和切换（switch）。在某些情况下，你必须在到达最终部分之前退出循环语句。在某些情况下，你必须忽略代码的某部分并初始化下一个。


    为了帮助你处理此类情况，这种编程语言提供了两个强大的工具：`break` 语句和 `continue` 语句。让我们详细讨论每个语句。


    ### Break 语句


    该语句在上一章引入，允许你提前退出任何循环。下面的图片将向你展示基础 `break` 语句的流程图。


    ![](img/00027.jpeg)


    **注意**：在我们讨论切换语句期间，你已经见过 `break` 语句是如何工作的。


    ### Continue 语句


    `continue` 语句指示 JavaScript 解释器开始循环的下次迭代并忽略剩余的代码块。一旦系统遇到 `continue` 语句，程序流将进入表达式评估。如果条件仍然为真，`continue`
    语句将开始下次迭代。另一方面，如果条件变为假，程序控制将跳出循环。


    # 第 7 章：JavaScript 语言中的函数


    基本上，函数是可重用代码的集合，可以在程序的任何部分被调用。这意味着你不需要多次编写相同的代码。函数可以帮助程序员创建模块化代码。它们还允许程序员将大型程序拆分为较小的函数。


    与任何其他编程语言一样，JavaScript 提供了通过函数帮助编写模块化代码的功能。你可能在本书提供的代码中见过如 `write()` 和 `alert()`
    这样的函数。你可以重复使用这些函数，但它们只在 JavaScript 中编写过一次。


    这种语言还允许你编写自己的函数。本章将教你 JavaScript 函数的基础知识。


    ## 如何定义函数


    你必须在使用函数之前对其进行定义。定义函数最流行的方法是使用 `function`（即 JavaScript 关键字）。在输入 `function` 后，指定你想要使用的名称和参数。然后添加一个由大括号括起来的
    JavaScript 语句块。


    **注意**：你可以创建一个没有定义任何参数的函数。因此，参数列表可以是空的。


    这是你在定义函数时必须使用的语法：


    ![](img/00028.jpeg)


    ## 如何调用函数


    在你的脚本中调用函数，只需要指定函数的名称。你可以使用下面的代码作为示例：


    ![](img/00029.jpeg)


    该代码将给你此结果：


    ![](img/00030.jpeg)


    ## 函数的参数


    你目前为止看到的函数没有任何参数。然而，在调用/执行函数时，你可以轻松分配各种参数。你可以在函数内部捕获这些参数。一旦捕获，你可以根据需要修改这些参数。


    ### Return 语句


    JavaScript 你在函数中添加 `return` 语句。这个 `return` 语句是完全可选的，尽管如果你想从函数/函数中获取值，就必须使用它。通常，你应该将
    `return` 语句放在函数的最后部分。


    例如，你可以向函数传递两个值。然后，你可以预期函数乘以这些值并在程序显示结果。


    ### 嵌套函数


    JavaScript 允许你将函数放在另一个函数内部。这个过程被称为“嵌套函数”。作为一个规则，你不能在循环或条件语句中函数定义。


    下面的代码将教你如何嵌套函数：


    ![](img/00031.jpeg)


    上面的代码给出以下结果：


    ![](img/00032.jpeg)


    ## 使用 Function() 创建函数


    除了上面讨论的 `function` 语句外，你还可以通过使用 `Function()`（即 JavaScript 构造函数）和 `new`（即 JavaScript
    运算符）创建函数。


    要使用此构造函数，你必须使用以下语法：


    ![](img/00033.jpeg)


    此语法可以包含任意数量的字符串参数。最后一个参数作为函数体——它可以包含任意任意语句。


    **重要注意**：`Function()` 不为其生成的函数命名。程序员将这些无命名函数称为“匿名”函数。


    # 结


    再次感谢下载本书！


    我希望本书帮助你学习 JavaScript 的基础。


    下一步是使用 JavaScript 编程语言编写自己的网页或程序。


    ![](img/00034.jpeg)


