    Computations with integers (also known as whole numbers) are 100% accurate. Computations
    with fractions, however, are not. For example, the value of “pi” cannot be expressed
    accurately by a limited quantity of decimal numbers. A lot of number values lose
    their accuracy because there are only 64 bits to keep them. If you want to avoid
    problems related to fractions, you have to remember that these numbers are just
    estimates. Don’t treat them as accurate values.


    ## Arithmetic Operations


    This is what you do with numeric values. In general, arithmetic operations (e.g.
    addition, division, subtraction, etc.) use two numeric values to generate a new
    value. Here’s a sample arithmetic operation written in the JavaScript language:


    ```

    10 + 4 * 5

    ```


    The `*` and `+` signs are known as “operators.” The `+` sign represents addition
    while `*` represents multiplication. You can generate a new numeric value by placing
    an operator between 2 numeric values. It is important to note that arithmetic
    operations in JavaScript follow operator precedence (also called order of operations).
    Here, you should perform operations in this order: parentheses, exponents, multiplications/divisions,
    and additions/subtractions. If you will apply operator precedence in the example
    given above, 10 will be added to the product of `4 * 5`.


    You can use parentheses to modify the order of operations. For example:


    ```

    (10 + 4) * 5

    ```


    In the JavaScript language, the `-` sign represents subtraction while `/` represents
    division. You don’t have to worry about operator precedence. If you aren’t sure,
    however, you can simply add parentheses in your codes.


    ## The Special Numbers


    When using JavaScript, you’ll encounter three values that are referred to as numbers
    even if they don’t behave as such. These special values are: `Infinity`, `-Infinity`,
    and `NaN`. `-Infinity` and `Infinity` represent negative and positive infinities.
    In general, you shouldn’t trust computations based on infinities. These calculations
    aren’t mathematically reliable.


    `NaN`, on the other hand, means “not a number.” You’ll get this special value
    if you will perform arithmetic operations that give imprecise or meaningless result.
    For example, you’ll get `NaN` if you will divide zero by zero (i.e. `0 / 0`).


    ## Strings


    You should use strings to represent text-based information. You should use quotes
    (i.e. either single or double quotes) to enclose your strings. Check the following
    examples:


    ```

    ‘Five little monkeys’

    ```


    ```

    “I’m riding a bicycle”

    ```


    When creating strings, make sure that you are consistent with your quotes. If
    you started a line using double quotes, end the line using that same symbol.


    In general, you can use quotes to enclose almost anything. Put something between
    a pair of quotes and the JavaScript language will turn it into a usable string
    value.


    ### How to “Escape” a Character


    There are times when you have to add special characters in your statements. For
    example, you have to add “newlines” (i.e. the characters you’ll get after pressing
    the Enter key) when writing text strings. Currently, JavaScript requires programmers
    to add a backslash into quoted texts. By placing a backslash, you are telling
    the computer that the next character has a special function or meaning. This process
    is known as “escaping a character.”


    Quotes that come after a backslash will be considered as a part of the line: they
    won’t terminate the string. If you’ll place `n` after the backslash, a newline
    character will be added to the statement. Likewise, a `t` that is introduced by
    a backslash will result to a “tab” character (i.e. the one you’ll get after pressing
    the Tab key). Here is a simple example:


    ```

    “I’m the first one\nYou are the last”

    ```


    If you will execute the string given above, you’ll get the following:


    ```

    I’m the first one

    You are the last

    ```


    In certain situations, you want to use an “ordinary” backslash in your codes.
    You don’t want it to be a special tool. You can do this by placing a backslash
    before another backslash. That is, you are escaping a backslash so you can turn
    it into a normal character. Analyze the following example:


    ```

    “You should use \\t to add a tab character in your statements”

    ```


    Once compiled and executed, that line will give you:


    ```

    You should use \t to add a tab character in your statements

    ```


    Strings aren’t numbers so you can’t perform mathematical operations on them. However,
    you can use the `+` on your strings to concatenate (i.e. combine) them. Here’s
    an example:


    ```

    “Jav” + “aSc” + “ript”

    ```


    Because of the `+` signs, the segmented line given above produces: `JavaScript.`.


    ## The Unary Operators


    In this section, you’ll learn about the non-symbol operators. To start the discussion,
    let’s talk about an operator called `typeof`. This operator can help you in identifying
    the type of any value. Check the following examples:


