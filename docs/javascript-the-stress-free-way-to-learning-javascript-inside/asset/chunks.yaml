    information in separate blocks called Widgets. The default WordPress widgets are
    the following: Welcome at a Glance, Quick Draft, Activity, and WordPress News.


    The Welcome widget shows the links form the top tasks you can perform in creating
    a new website.


    The At a Glance widget offers a short glimpse of the number of pages, posts, and
    comments on your website. Every content types are shown in link form, and once
