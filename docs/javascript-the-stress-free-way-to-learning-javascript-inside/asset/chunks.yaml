    ## Part 1: First Week


    Here’s what you can learn in the first week of installing Windows 10!


    ### Chapter 1: Installing Windows 10


    Before installing `Windows 10`, you have to make sure that your computer is ready,
    which means you have to follow the following steps below:


    ### The Right Specs + Proper Back-Up


    First, make sure that your computer runs under the right specifications, which
    are as follows:


    - Graphics have to be `Direct-X 9` Capable Video Card with the `WDMM` Driver.

    - `RAM` has to be `2GB` (`64 Bit`) or `1GB` (`32 Bit`), and;

    - You need to have `20GB` (`64 Bit`) or `16GB` (`32 Bit`) of Disk Space;

    - Your Processor has to be `1GHZ CPU` or higher;


    Now, go ahead and back up the data that you have. You can either save your data
    on external hard disk, or on cloud services such as `Dropbox`, `Google Drive`,
    or `OneDrive`.


    For `Windows8`, you can simply back up personal files by clicking the `File History`
    button.


    You can also create a `System Image` to back up everything on your computer, especially
    if you’re using `Windows 7` or `8`. All you have to do is head to the `Control
    Panel`, and then choose `Back Up Your Computer`.


    On the left side of the screen, choose `Create System Image`, and choose where
    you would like to save it.


    ### Updates


    Before installing `Windows 10`, you have to have an update first. To do this,
    just follow the instructions below:


    - If you’re using `Windows 7`, go to `Start Menu` > `Control Panel` > `System
    and Security` > `Windows Update`.

    - For `Windows 8`, go to `Start` > `PC Settings` > `Update and Recovery` > `Windows
    Update`.

    - For other versions, just wait for the computer to send a prompt about the Update.


    #### Wait for the Windows 10 Prompt.


    #### Time to Install!


    Take note that there are two ways to do this. Check out the first one below:


    You can try doing this:


    If your computer is running on `Windows 7` or `8` or other earlier versions, you
    should first download a `Media Creation Tool` available from `Microsoft`. Check
    whether you need the `32-bit` or `64-bit` version.


    Run the tool that you have downloaded, and then select `Create Installation Media
    for Another PC`, and then click `Next`.


    Now, select `Language`, `Edition`, and `Architecture` before clicking `Next`.


    When asked which media to use, choose `USB Flash Drive`.


    Then, insert the flash drive into the `USB Port`, wait for a prompt, and click
    `Next`. The PC will now be downloading `Windows 10`.


    After around 10 minutes or so, open the drive in the `Explorer` and then choose
    `Setup`.


    Wait for the `Ready to Install` prompt, and then select `Choose What to Keep`.


    Wait for the rest of the installation to finish and you’re all set!


    Or, you can also try this one below:


    The second way is perfect only for those whose computers are already running on
    `Windows 10`. This should be done if you’re not happy with your current setup,
    or you just want to completely refresh your computer. You can do it this way:


    - Click `Settings` from the `Windows 10 Menu`.

    - Click `Update and Security`.

    - Click `Recovery` > `Reset this PC` > `Get Started`.

    - Choose `Remove Everything`.

    - Wait for the rest of the installation to finish.


    ### Chapter 2: Using the Start Menu


    A lot of people find the `Windows 10 Start Menu` to be confusing—and this is really
    evident, especially in the beginning. But don’t worry because in this chapter,
    you’ll learn how to make the most out of that `Start Menu`—and make sure that
    it’ll work for you!


    You can use the `Start Menu` this way:


    1. Click the `Start Menu`. This will appear on the left side of the screen.

    2. Click `All Apps`. Again, this’ll be on the left side of the screen. You’ll
    then see a display of all the apps installed on your computer.

    3. To search for an app or file, type what you’re looking for in the `Search Field`
    and you’ll see a list of choices popping up onscreen.

    4. The `Power` button would allow you to rest or shut down. This is found on the
    left column of the screen.

    5. To lock the PC, just right-click your account name and then you’d see the following
    options: `lock`, `change account picture`, `sign out`.

    6. You can also pin certain items on the `Start Menu`. To do this, just right
    click on the file and `Pin to Start`.

    7. To manage the tiles you see on the right side of the screen, just right-click
    on a tile, and then see a menu. Choose `Unpin from Start`, `Resize` or `Pin to
    Taskbar`.


    #### Using both Start Menu and Start Screen


    If you’re quite a multitasker and you want to work on both the `Start Screen`
    and `Start Menu`, here’s what you have to do:


    - Click `Start` button, followed by `Settings` > `Personalization`.

    - Click `Start`.

    - Choose `Use Fullscreen`.

    - Click `Start Screen` to make `Start Menu` disappear.

    - Uncheck `Use Fullscreen` to return to `Settings`.


    #### Customizing the Start Menu


    Take note that you can definitely customize what you see onscreen and how you
    want your PC to work for you!


    - To make a switch between the `Start Menu` and the `Start Screen`, open `Settings`
    > `Personalization` > `Start` > `Start Behaviors` > `Use Fullscreen Start when
    in Desktop`.

    - To change the color of the `Start Menu`, `window borders`, and `taskbar`, go
    to `Settings` > `Personalization` > `Colors`. If you want a brightly colored PC,
    just go to `Show Color on Start`, `Taskbar`, and `Action Center`, and it’ll happen.

    - To customize what you’ll see onscreen, go to `Settings` > `Customize`. There,
    you’ll see a list of suggested apps from `Microsoft`. Another setting would show
    you setting controls for your recently opened programs, and the last one would
    be about `Jump List items`.

    - Click `Start` > `Choose Folders` to choose which folders you’d like to see onscreen.

    - Click `Start` again to see whether you have all the folders and files that you
    need.


    ### The Secret Menu


    There is also a so-called “secret” `Start Menu` that you can also use and customize.
    Here’s how you can gain access to it:


    Right click on the `Start icon`.


    You will then see a pop-up menu with mostly everything you can do with the computer!

