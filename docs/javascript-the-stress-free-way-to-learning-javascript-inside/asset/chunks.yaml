    WordPress is the most popular website platform today, mainly because it is easy
    to use. Even without prior knowledge in web design and development, you can teach
    yourself in using WordPress.


    In fact, this book aims to teach you to start using WordPress in just two weeks
    or less.


    In this book you will learn:

    - What Wordpress is

    - How to use Wordpress

    - Common Wordpress features

    - And much more!


    Thanks again for downloading this book, I hope you enjoy it!


