    同时，`通过电子邮件发布设置`将允许您向您的网站发送一封包含文章内容的电子邮件。为了使用此设置，您应该使用 `POP3` 访问设置一个秘密电子邮件账户。最后一部分可用于更新服务。一旦您发布了新文章，WordPress
    将立即通知您更新。请务必点击`保存更改`。


    ## 媒体设置


    `媒体设置`页面允许您为想要添加到文章中的图像设置最大尺寸。如果您希望图片具有相同的大小，或者想为图片尺寸设置默认设置，这些设置将帮助您节省时间。


    `上传文件`选项允许您选择是否希望将上传的文件按月份或按年份组织。请务必点击`保存更改`。


    ## 讨论设置


    `讨论设置`允许您管理针对您的文章和页面的评论及链接。


    第一部分是`默认文章设置`。第一个设置允许您管理指向其他博客的链接。第二个设置允许您管理指向您网站的追回链接（trackbacks）和 pings 链回链接（ping
    backs）。最后，第三个设置允许您的网站访问者在新文章上发表评论。如果您不希望访问者对文章发表评论，可以取消勾选此框。


    `其他评论设置`允许您选择访问者发表评论的指南以及您如何管理他们的评论。


    对于`每当……时邮件通知`部分，您可以选择在有人发表评论或评论被管理员处理时通过电子邮件接收通知。


    `在评论出现之前`部分允许您管理已发布的评论。通过此功能，您可以选择管理员是否应先批准评论，或者评论是否自动发布。


    在`评论审核`部分中，您可以根据链接的数量更改评论的管理方式。在框内，您可以包含 `IPs`、`emails`、`names`、`words` 和 `URLs`
    来过滤评论以进行审核。此功能配合评论黑名单，可以帮助您防御博客免受不当和垃圾邮件评论的侵害。


    还有`头像（Avatar）`设置。您可以开启在您的网站上发表评论的用户头像，为还没有自己头像的用户选择默认头像，或者根据他们的评分过滤其评论。


    再次，请务必点击`保存更改`。


    ## 永久链接设置


    永久链接（Permalinks）是指每个页面和博客文章（包括标签和分类存档）的永久 URL。通常，永久链接是用于链接到您内容的网页地址。它的名称是由 permanent（永久）和
    link（链接）组合而成的，因此称为 permalink。


    WordPress 中的`永久链接设置`允许您管理您的永久链接的默认结构。您可以从常用设置中选择，也可以构建自定义 URL。默认情况下，WordPress
    使用带有问号和数字的 URL。您可能希望在此处更改永久链接以提高其向前兼容性、可用性和美观性。


    ## 第一周第 6 天 – 创建 WordPress 文章


    要创建您的第一篇文章，请在`仪表盘`的左侧找到`文章（Posts）`菜单。您可以点击展开它以访问子菜单，或直接将鼠标悬停在`文章`链接上。


    在工具栏的`+ 新建`链接中，您也可以找到`添加新文章`页面。只需点击`添加`链接即可进入`添加文章`页面，这样您就可以开始创建第一篇 WordPress
    文章了。


    您可以在第一个框中输入文章标题。


    下方是`文章编辑器`或`文章格式设置`部分，您可以在这里输入或粘贴文章内容。右侧有两个标签页，显示了文章编辑的两种模式：`文本`和`可视化`。


    `文本`标签允许您访问文章编辑器的纯文本 HTML 版本。您可以使用此模式来编辑文章的 HTML 代码。如果您不熟悉 HTML，建议使用可视化模式。


    `可视化`标签非常适合熟悉 `WYSIWYG`（所见即所得）概念的开发者。它带有一个格式化工具栏，有不同的选项来格式化您的文章。如果您使用过 Microsoft
    Word，这些图标中的许多看起来非常眼熟。


    `发布`框位于屏幕右侧栏顶部。如果您想保存文章，可以将其保存为草稿。`预览`按钮允许您预先查看文章在发布后的实际显示效果。`状态`将让您知道文章目前是草稿、已保存、已发布，或者如果您安排了发布时间，则它正处于待审核状态。


    随后的链接允许您查看文章的可见性，或查看网站访问者将看到的内容。`发布`行显示文章将是立即发布还是在未来的某个日期发布。下一部分是分配给您的文章的`标签`和`分类`。稍后保存这节课。


    如果您想更改编辑器的屏幕选项，可以点击右上角的`屏幕选项`标签。这将展开链接，您将看到这些选项，这些选项将显示在屏幕的文章编辑器上。


    在文章编辑器中，您可以直接拖放这些框的排列，以更改您希望它们在页面上的显示方式。


    如果您在添加新文章时需要帮助，可以随时点击右上角的`帮助`标签。从这里，您可以轻松参考插入媒体、使用编辑器、添加文章标题的实用提示，以及自定义文章显示的指引。


    ## 第一周第 7 天 – 添加链接和图片


    链接对于您内容的 SEO 至关重要，而图片是提高文章吸引力和可读性的理想选择。WordPress 让向您的网站添加这些元素变得简单。


    ### 添加链接


    在页面或文章编辑器中，选择并高亮想要链接的文本，然后点击工具栏中的链接按钮。这将显示一个框，您可以在其中输入特定的 `URL`。如果您倾向于链接到现有内容，只需点击展开此部分。通过此功能，可以使用搜索栏来搜索网站，以及列表。如果链接准备好了，只需点击`添加链接`按钮。您的选择文本现在有了链接。如果您想删除链接，再次选择文本并点击`取消链接`按钮。


    ### 添加图片


    在文章中的合适位置插入您的图片。在文章编辑器的上方工具栏中，您将看到`添加媒体`按钮。点击此按钮显示`插入媒体`框。


    WordPress 使用媒体库来存储所有的媒体文件（如视频和图片）。在此框中，您可以选择上传新文件或使用媒体库中的现有文件。如果您想上传图片，点击`选择文件`按钮并找到您想要使用的图片。


    图片上传后，您会注意到它已添加到媒体库。在框的右侧区域，您将看到该附件的详细信息。在此部分，您可以查看`描述`、`替代文本`、`说明`和`标题`。您还可以选择图片的对齐方式，如`右对齐`、`左对齐`或`居中对齐`。


    确保勾选框框。点击`插入文章`按钮。现在您可以看到图片已插入到文章中。

