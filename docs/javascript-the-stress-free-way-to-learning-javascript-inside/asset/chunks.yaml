    ## 第一部分：第一周


    在安装 Windows 10 的第一周你可以学到这些！


    ### 第一章：安装 Windows 10


    在安装 `Windows 10` 之前，你必须确保你的电脑已准备就，这意味着你需要按照下面的步骤操作：


    ### 正确的配置 + 适当备份


    首先，确保你的电脑符合正确的配置，如下：


    - 显卡必须是支持 `Direct-X 9` 且带有 `WDMM` 驱动程序的视频卡。

    - `RAM` 必须为 `2GB` (`64 Bit`) 或 `1GB` (`32 Bit`)；且

    - 你需要 `20GB` (`64 Bit`) 或 `16GB` (`32 Bit`) 的磁盘空间；

    - 你的处理器必须是 `1GHZ CPU` 或更高；


    现在，请备份你已有的数据。你可以将数据保存在外部硬盘上，也可以保存在 `Dropbox`、`Google Drive` 或 `OneDrive` 等云服务中。


    对于 `Windows8`，你可以通过点击 `File History` 按钮简单备份个人文件。


    你也可以创建一个 `System Image` 来备份电脑上的所有内容，特别是当你使用 `Windows 7` 或 `8` 的时候。你只需要进入 `Control
    Panel`，然后选择 `Back Up Your Computer`。


    在屏幕左侧选择 `Create System Image`，并选择你想保存的位置。


    ### 更新


    在安装 `Windows 10` 之前，你必须先进行更新。要做到此，请按照下面的说明操作：


    - 如果你使用的是 `Windows 7`，前往 `Start Menu` > `Control Panel` > `System and Security`
    > `Windows Update`。

    - 对于 `Windows 8`，前往 `Start` > `PC Settings` > `Update and Recovery` > `Windows
    Update`。

    - 对于其他版本，只需等待电脑发送更新提示即可。


    #### 等待 Windows 10 的提示。


    #### 是是安装时间了！


    注意，这有两种方法可以实现。查看下方的第一种：


    你可以尝试这样做：


    如果你的电脑运行在 `Windows 7` 或 `8` 或更早的版本上，你应该先从 `Microsoft` 下载一个 `Media Creation Tool`。检查你需要的
    `32-bit` 还是 `64-bit` 版本。


    运行你下载的工具，然后选择 `Create Installation Media for Another PC`，然后点击 `Next`。


    现在，在点击 `Next` 之前选择 `Language`、`Edition` 和 `Architecture`。


    当询问使用哪种介质时，选择 `USB Flash Drive`。


    然后，将闪存驱动插入 `USB Port`，等待提示出现并点击 `Next`。电脑现在将下载 `Windows 10`。


    大约 10 分钟后，在 `Explorer` 中打开驱动器，然后选择 `Setup`。


    等待 `Ready to Install` 提示，然后选择 `Choose What to Keep`。


    等待剩余的安装完成，你就大搞定了！


    或者，你也可以尝试下面的这种方法：


    第二种方法仅适用于那些电脑已经运行 `Windows 10` 的用户。如果你对目前的设置不满意，或者只是想完全刷新你的电脑，就应该这样做。你可以这样做：


    - 从 `Windows 10 Menu` 点击 `Settings`。

    - 点击 `Update and Security`。

    - 点击 `Recovery` > `Reset this PC` > `Get Started`。

    - 选择 `Remove Everything`。

    - 等待剩余的安装完成。


    ### 第二章：使用开始菜单


    很多人发现 `Windows 10 Start Menu` 令人困惑——这确实非常明显，尤其是在刚开始。但别担心，在本章中，你将学习如何充分利用那个 `Start
    Menu`——并确保它对你有效！


    你可以这样使用 `Start Menu`：


    1. 点击 `Start Menu`。

    2. 点击 `All Apps`。

    3. 在 `Search Field` 中输入你要查找的应用或文件。

    4. `Power` 按钮允许关机。

    5. 要锁定电脑，只需右键点击账户名称即可可以看到以下选项：`lock`、`change account`、`sign out`。

    6. 你可以在 `Start Menu` 上固定某些项目。要这样做，只需右键点击项目并 `Pin to Start`。

    7. 要管理屏幕右侧的磁贴，只需右键点击磁贴并选择 `Unpin from Start` 或 `Pin to Taskbar`。


    #### 同时使用开始菜单和全屏


    如果你是一个多任务高手，并且想同时使用 `Start Screen` 和 `Start Menu`，你需要：


    - 点击 `Start` 按钮，进入 `Settings` > `Personalization`。

    - 点击 `Start`。

    - 选择 `Use Fullscreen`。

    - 点击 `Start Screen` 让 `Start Menu` 消失。

    - 取消选择 `Use Fullscreen` 返回 `Settings`。


    #### 定义开始菜单


    注意，你可以完全自定义你看到的内容以及你希望电脑运行的方式！


    - 要要在 `Start Menu` 和 `Start Screen` 之间切换，打开 `Settings` > `Personalization` > `Start`
    > `Start Behaviors` > `Use Fullscreen Start when in Desktop`。

    - 要更改 `Start Menu`、窗口边框和任务栏的颜色，请前往 `Settings` > `Personalization` > `Colors`。如果你想要彩色的电脑，只需开启
    `Show Color on Start`、`Taskbar` 和 `Action Center` 即可实现。

    - 要自定义你看到的内容，前往 `Settings` > `Customize`。在那里，你会看到来自 `Microsoft` 的建议应用列表。另一个设置将显示你最近打开的程序设置，最后一个是关于
    `Jump List items` 的。

    - 点击 `Start` > `Choose Folders` 选择你想在屏幕上看到的文件夹。

    - 再次点击 `Start` 查看你是否拥有所有文件夹和文件。


    ### 秘密菜单


    还有一个所谓的“秘密” `Start Menu`，你也可以使用并自定义。这是访问它的方法：


    右键点击 `Start icon`。


    你将看到一个包含几乎可以在电脑上进行的所有操作的菜单！

