    “环境”一术指的是一组活动值和变量的集合。基本上，在启动 JavaScript 程序时，环境不能为空为空。环境存储了与语言本身相关的变量，通常，它们还包含允许与计算机系统交互的变量。例如，在浏览器中，存在各种函数和变量用于检查和影响当前网站，并读取来自鼠标和键盘的输入。


    ## 函数 (Functions)


    默认 JavaScript 环境涉及函数。函数是与值关联的计算机程序片段。你可以应用这些值来激活关联的程序。例如，在浏览器环境中，`alert`（即一个变量）包含一个显示对话框的函数。这是一个示例：


    ```javascript

    alert("You are not authorized to access this page!");

    ```


    你可以通过在生成函数值的 JavaScript 表达式后放置括号来执行函数。通常，你会指定包含你所需函数的变量名。通过在括号内包含值，你正在将这些值赋值给函数内部的程序。对于上一个例子，“alert”使用赋值的字符串在结果生成的对话框中显示消息。程序员在引用赋值给函数的值/多个值时使用“参数”（arguments）一词。


    ## “console.log”


    在尝试新的字符串或语句时，你可以使用 `alert`。然而，由于它要求你关闭生成的窗口，你可能会觉得既不方便又耗时。正因如此，你可能想使用在本书前面的章节中看到的函数：`console.log`。几乎所有的
    JavaScript 系统（例如 Node.js、网络浏览器等）都提供此函数将参数传输到文本兼容的输出设备。


    对于网络浏览器，代码的输出会发送到 JavaScript 的控制台。虽然浏览器 GUI 的这部分通常是隐藏的，但你可以通过按下某些键访问它（即对于 Windows
    ，按下 F12；对于 Mac ，按下 Command-Option-I）。如果你在查看此部分时遇到问题，可以在设备内搜索“开发者工具”或“网络控制台”。分析以下示例：


    ```javascript

    var a = 99;

    console.log("one hundred minus one is", a);

    // -> one hundred minus one is 99

    ```


    正如之前讨论的，在命名变量时不能使用句号或逗号。然而，上面的示例中包含了一个。原因是 `console.log` 并不是一个普通的变量。它是一个 JavaScript
    表达式，从存储在 `console`（这是一个变量）中的值中收集“日志”信息。


    ## 返回值 (The Return Values)


    在屏幕上写入信息和显示对话框被称为“副作用”（side effects）。因为这些副作用，函数在 JavaScript 语言中非常重要。你也可以使用函数来生成值——在这种情况下，函数即使没有副作用也是有用的。例如，`Math.max`（一个
    JavaScript 函数）接收无限数量的数值，并指示其中最大的一个。这是一个示例：


    ```javascript

    console.log(Math.max(1, 2, 3, 4, 5));

    // -> 5

    ```


    在 JavaScript 中，任何生成值的内容都被视为一个表达式。这意味着你可以在大型表达式中执行函数调用。在下面的示例中，你将使用 `Math.min`
    函数作为 `+` 运算符的输入：


    ```javascript

    console.log(Math.min(1, 2) + 98);

    // -> 99

    ```


    ## 第 4 章：关于 JavaScript 函数的更多信息


    在上一节中，你学习了如何创建和调用函数值。这一章将帮助你进一步理解这个重要课题。根据专家程序员的说法，在使用 JavaScript JavaScript 时，函数是你的主要工具。函数是强大的工具，可以帮助你设计大型程序、最小化冗余、命名子程序并为每个子程序安全隔离。这意味着如果你想有效地使用
    JavaScript，就必须掌握函数。本章将帮助你在短短两周内学会这种脚本语言。


    许多人应用函数来定义新词汇。这意味着你可以使用它们来创建单词并分配含义。


    普通英语母语者的词汇量大约有 20,000 个单词。然而，编程语言通常没有那么多大量的内置命令。这意味着编程中的词汇比人类语言中使用的更精确。如果你想最小化冗余，就必须向
    JavaScript 中添加自己的单词并创建你自己的词汇。


    ## 如何定义函数 (How to Define a Function)


    定义函数就像定义普通变量。唯一的区别在于你所赋值的值是一个函数。例如，下面的代码定义了一个名为“square”的变量。该变量指向一个生成任何赋值数字平方的函数。


    ![](img/00044.jpeg)


    在创建函数时，你应该用这个关键字开始表达式：`function`。每个函数都有两个部分：(1) 函数体和 (2) 参数。函数的体存储了你希望在函数被调用（或执行）时执行的
    JavaScript 语句。此外，你应该始终使用大括号包裹函数体（即使它只包含一条语句）。


    另一方面，参数是函数定义中列出的名称。函数可以有一个或多个参数。实际上，你甚至可以创建一个不输入任何参数的函数。为了帮助你理解这个概念，让我们创建两个函数：`makeNoise`
    和 `power`。


    ![](img/00045.jpeg)


    如你所示，`makeNoise` 没有参数。同时，`power` 有两个（即基数和指数）。


    ## JavaScript 中的参数和作用域 (The Parameters and Scopes in JavaScript)


    函数的参数行为类似于普通变量，尽管它们的原始值来自于程序员，而不是它们所关联的函数。


    这里是任何函数的一个重要属性：在其中创建的所有变量（甚至是参数）都是局部的。这意味着，例如，power 语句中的 `result` 在每次函数被调用时都会刷新。这些相互重复的操作不会相互影响。


    需要注意的是，这种“局部性原则”适用于使用 `var` 定义的变量和参数。此外，你应该在函数体内定义变量和参数。在函数外部定义的变量被称为全局变量，因为它们可以在整个
    JavaScript 应用程序中可见并访问。如果函数内部没有对应的“局部”变量，你可以在函数内部访问全局变量和参数。


    下面的代码说明了这一概念。它声明并调用了两个给 `x` 赋值的函数。第一个函数将变量定义为局部。另一个函数没有。这意味着如果你在函数内部引用 `x`，你将指向全局
    `x`（如示例的第一行所示）。


    ![](img/00046.jpeg)


    此功能有助于防止不同函数之间意外的引用或交互。如果 JavaScript 允许你在整个程序中共享所有变量，你将花费大量精力确保名称不重复。重复使用变量名会对你的代码产生意外或不理想的影响。因此，它可能会破坏你正在编写的程序。


    由于这种语言将局部变量视为仅存在于各自函数内部，因此它可以将函数作为独立的领域来处理。当你处理单个函数时，JavaScript 不需要担心整个应用程序。


    ## 嵌套作用域 (The Nested Scope)


    除了定义局部和全局变量，JavaScript 还使用其他方法区分不同类型的函数。例如，你可以在现有函数内部创建函数。这种技术产生了多层局部性。


    例如，给出的函数包含两个函数：


    ![](img/00047.jpeg)


