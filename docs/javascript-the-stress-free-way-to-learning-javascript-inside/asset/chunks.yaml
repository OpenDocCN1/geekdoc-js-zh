    第一步是展开仪表面板左侧的 `Appearance`（外观）菜单。点击 `Appearance` 中的 `Menus`（菜单）链接，这将激活 `Menus`
    编辑页面。输入你所需的名称，并点击 `Create menu`（创建菜单）。然后，你可以在左侧的框中添加菜单项目，例如链接、分类和页面。


    如果你想更改在此页面看到的菜单选项，只需展开 `Screen Options`（显示选项）选项卡。然后，添加其他菜单选项，如 CSS 类、格式、标签和文章。


    一旦整理好菜单项目，请务必点击 `Save Menu`（保存菜单）。


    # 第 2 周第 7 天 – 管理评论


    在基于 WordPress 构建的站点上管理评论与处理页面和文章的方式类似。


    在仪表面板中，找到 `Comments`（评论）页面。你可以像自定义其他 WordPress 界面一样来自定义此界面。黄色指示器表示该评论需要审核。你可以通过
    `Bulk Actions`（批量操作）或将悬停在操作链接上对评论进行回复。


    在 `Author`（作者）列中，除了作者姓名、博客 URL 和电子邮件地址外，还会显示评论者的 IP 地址。点击此链接将显示来自该特定地址的所有评论。


    在 `Comment`（评论）列中，每条评论都包含关于 `Submitted on`（提交时间）的信息，随后是评论发布在网站上的日期。点击时间和日期链接会将你重定向到网站上的那条评论。当你悬停在评论上时，你将看到对该评论进行的操作：批准、回复、编辑、垃圾桶或标记为垃圾邮件。


    该列中有三个元素：`In Response To`（回复）。该文本指向评论所关联的文章名称，以及指向该特定条目编辑器的链接。


