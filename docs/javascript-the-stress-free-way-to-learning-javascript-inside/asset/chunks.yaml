    在选择高级设置选项卡时，你将看到图片当前托管的链接、添加图片内边距的属性和样式、`CSS Class` 以及图片以像素为单位的实际高度和宽度。


    接下来，返回图片。右上角的图标将允许你从文章中删除图片。点击 `Add Media`（添加媒体）按钮，你会看到相同的插入媒体对话框。在左侧，你将看到设置图库和选择特色图片的选项。如果你在媒体库中有足够的图片，你就可以向文章中添加整个图片图库。


    特色图片（Featured images）被某些主题使用。如果你选择的主题支持特色图片，请选择该图片并返回文章编辑器。点击预览按钮并检查图片是否已插入。


    # 第 3 章 – 第二周


    ## 第 2 周第 1 天 – 分类与标签


    你可以将文章组织到各种分类中，例如主题或学科领域。例如，如果你正在写一篇文章，请考虑该文章更广泛的主题。如果你计划未来编写更多关于该主题的文章，那么将这些文章组织在一起是理想的。


    ### 添加新分类


    如果你还没有包含分类，点击显示 `+ Add new category`（添加新分类）的链接。点击 `Add new category` 插入新分类。你会发现分类列表中已包含了一个新分类。要将分类添加到文章中，点击分类旁边的复选框。


    管理文章分类另一种方法是导航到位于 `Dashboard`（面板）菜单中的 `Posts > Categories`（文章 > 分类）链接。如果你点击 `Categories`
    链接，就可以访问 `Categories` 页面。在这里，你可以查看右侧所有的分类，你也可以在其中添加新条目。


    ### 分类描述


    描述区域允许你添加更多关于与该分类关联的文章信息。某些 WordPress 主题会显示这些信息。


    ### 分类层级


    与标签不同，分类可以嵌套成层级。例如，你可能有一个 `News`（新闻）分类，并在下方包含 `World News`（国际新闻）和 `Sports News`（体育新闻）子分类。


    ### 分类别名（Slug）


    `Category Slugs` 是分类的链接友好版本。这通常是小写形式，仅包含数字、连字符和字母。


    ### 分类和标签的区别是什么


    将你的网站想象成一本书吧。分类类似于目录，而标签则像索引部分。


    ## 第 2 周第 2 天 – 创建 WordPress 页面


    创建新页面的第一步是在 `Dashboard` 中找到 `Pages`（页面）菜单。只需点击 `Add new`（新增）选项即可。


    你会发现页面编辑器与文章编辑器具有相同的界面。唯一的区别在于屏幕右侧部分可以找到几个框。添加页面标题，例如 `Contact Us`（联系我们）。记住，如果你创建了固定固定链接，页面标题也将用作
    `URL slug`。


    在为页面添加内容后，你可以 `Publish`（发布）页面编辑器的部分内容，这与你写文章时类似。如果你准备好发布，可以选择立即发布、安排在未来发布或对其进行排期。


    `Page Attributes`（页面属性）部分包含了你新页面的父页面和模板。在 `Parent`（父级）部分，你可以根据层级组织页面。例如，你可以创建一个新页面并在其下方添加页面。请注意，对想要嵌套页面的层数没有限制。


    `Template`（模板）部分允许你为新页面包含一个模板。如果你的主题允许自定义页面模板，这是可以的。


    `Order`（排序）界面允许你按数字顺序组织页面。页面通常按字母顺序组织，但你可以通过在此框中提供数字来选择自己的安排方式。


    先预览页面，如果无误，则点击 `Publish`（发布）。


    ## 第 2 周第 3 天 – 应用 WordPress 模板


    某些 WordPress 主题带有模板，这些模板会更改网站前端的页面格式。通过页面模板，主题可以为页面外观以及特定元素的放置位置提供一些灵活性。


    添加页面模板的第一步是浏览 `Dashboard` 中的 `Pages` 菜单，并找到编辑或添加新页面的链接。找到 `Page Attributes` 区域，在该你可以看到可以使用的模板下拉列表。根据
    WordPress 主题，你可以在下拉菜单中看到某些页面模板选项。


    要查看模板将如何更改页面外观，选择一个模板并预览它，以检查它是否适用于该页面。


    一旦你选择了想要使用的模板，就可以点击 `Publish`（发布）。


    ## 第 2 周第 4 天 – 安装插件


    插件允许你为你的 WordPress 网站添加更多功能。安装插件非常简单。


    第一步是在登录网站 `Dashboard` 后找到并展开 `Plugins`（插件）菜单。寻找 `Installed Plugins`（已安装插件）页面，你可以在那里看到网站上已安装插件列表。某些插件在安装
    WordPress 时会自动安装，例如 `JetPack` 和 `Akismet`。


    要添加新插件，只需点击 `Add New`（新增）选项。从该页面，你可以选择从 `WP Plugin Directory`（插件 目录）浏览你想要安装的插件。你还可以根据插件的发布日期、人气或你标记为收藏的项目来过滤搜索。


    要开始上传插件，请遵循此流程：`Choose file`（选择文件） > 找到插件 zip 文件 > Install Now（立即安装） > Activate（激活）。


    `Dashboard` 中 `Plugins` 下的最后一个菜单部分是 `Editor`（编辑器），你可以通过修改单独的文件使用它更改插件的某些元素。但请记住，如果你进行了某些修改，插件更新将覆盖你的更改。如果你不懂
    PHP 代码，请不要修改插件。


    ## 第 2 周第 5 天 – 管理 WordPress 主题


    管理 WordPress 主题的第一步是浏览 `Dashboard` 中的 `Appearance`（外观）菜单。选择 `Manage Themes`（管理主题）页面。


    在顶部，你可以看到 `Active theme`（活动主题）以及 `Customize`（自定义）选项。当你点击此链接时，你可以看到一个预览窗口，允许你对
    `Tagline` 和 `Site Title` 进行更改。


    如果你返回 `themes` 标签，可以查看活动主题下的可用主题列表。这些主题已安装在你的 WP 站点上。


    如果你选择任何主题下方的 `Live Preview`（实时预览）链接，就可以看到网站使用该主题的效果。在预览中，你可以浏览不同的页面，查看该主题如何处理模板、存档和文章。在预览窗口的左侧，你可以编辑主题设置。


    确保点击左上角的 `Save & Activate`（保存并激活）按钮以接受新主题。


