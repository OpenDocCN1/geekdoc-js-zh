    value that shows whether they are true. You can compare strings using the same
    method.


    ![](images/00037.jpeg)


    Strings are ordered alphabetically. Also, lowercase letters are “more important”
    than uppercase ones. That means “a” > “b” is true. JavaScript also includes special
    characters (e.g. -, ?, etc.) in arranging strings. The process of comparison follows
    Unicode – it assigns a number to each character you might need. This functionality
    is extremely useful since it allows you to store strings by converting them into
    number sequences. While comparing string values, JavaScript works from left to
    right, it checks the number sequences of each character individually.


    You may also use similar operators such as `<=` (i.e. less than or equal to),
    `>=` (i.e. greater than or equal to), `!=` (i.e. not equal to), and `==` (i.e.
