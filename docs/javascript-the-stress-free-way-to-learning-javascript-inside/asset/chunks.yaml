  trans: '


    如果你担心其中一个比另一个更容易用，不必担心，它们的界面是相似的。使用 `WordPress.org` 是理想之选，因为你可以对自己的网站拥有完全控制权。尽管如此，你仍然需要选择一个适合你偏好和需求的
    WordPress 平台。


    选择平台后，下一步是选择你的域名和主机。请注意，域名是用户在搜索栏中输入访问你的页面所需的网页地址。然后，你需要选择网络托管服务，以便其他用户用户访问你的网站。


    在网络托管提供商注册后，你可以使用 `SimpleScripts` 安装 WordPress，特别是如果你选择了 `BlueHost` 的话。


    # 第一周第 2 天 - 仪表盘基础


    安装 WordPress 后，你就可以开始构建你的自定义网站或博客了。然而，在发布任何内容之前，最好先熟悉仪表盘的基础知识。仪表盘位于屏幕左侧，登录 `wp-admin`
    账户后即可轻松看到。大多数用户将此称为你网站的后端。


    通过仪表盘的首页，你可以轻松访问网站内容，并查看 WordPress 平台的其他区域。仪表盘以称为 `Widgets`（小部件）的独立区块显示信息。默认的
    WordPress 小部件有：`Welcome at a Glance`（欢迎概览）、`Quick Draft`（快速草稿）、`Activity`（活动）和
    `WordPress News`（WordPress 新闻）。


    `Welcome` 小部件显示创建新网站时可以执行的顶部任务链接。


    `At a Glance` 小部件简要提供了你网站上页面、文章和评论的数量。每个内容类型都以链接形式显示，点击它们后你将被重定向到特定区域，以便轻松管理内容。


    `QuickDraft` 小部件允许你轻松地编写新的文本内容。你可以快速编写标题、添加媒体、输入内容、插入标签、保存草稿或直接 `Publish`（发布）。


    `Activity` 小部件显示最近的评论、已发布的文章和计划发布的文章。


    `WordPress News` 小部件包含来自 WordPress 官方博客的最新新闻、文章和公告。


    你可以通过将鼠标指针悬停在标题栏上来展开、折叠和重新排列小部件。如果鼠标变成了四箭头图标，你可以按住左鼠标键并将小部件拖动到你想移动的区域。这被称为拖放功能。


    你还可以通过插件或特殊的程序代码添加新的小部件。


    # 第一周第 3 天 - 管理员栏


    `Admin Bar`（管理栏）位于屏幕的最顶部。WordPress 标志位于仪表盘的最左侧。鼠标悬停在标志上，你将看到有关 WordPress 特定信息的链接。如果你需要访问支持论坛或提供反馈，这些链接可以对你有所帮助。


    你的网站名称位于标志的右侧。你可以悬停在上面，将看到一个子菜单，以访问你网站的前端。下一个区域提供了评论的简要视图。


    在左侧，你可以找到 `+ New`（新建）的链接。一旦你悬停在此链接上，将出现一个子菜单，将你重定向到用户、页面、媒体和文章的 `Add New`（添加）界面。你也可以使用仪表盘左侧区域的导航来完成这些操作，但如果你想快速操作，这些链接会大有帮助。


    你还可以在右侧区域看到显示“Howdy, your name”文本的区域。你可以悬停在该区域以访问子菜单，用它你可以退出网站或编辑个人资料。


    ## 管理栏的前端视图


    如果你当前登录了你的 WordPress 网站，`Admin Bar` 在你网站的前端站点上可见。尝试悬停在网站名称上并点击 `visit site`（访问站点），它将重定向到你网站的前端。


    一旦你悬停在网站部分的标题上，你可以看到仪表盘链接，带你回到仪表盘首页，以及指向头部、背景、菜单、`widgets`（小部件）和主题的链接。请注意，这些部分也可以仪表盘左侧的导航面板中找到。


    ## 如何关闭管理栏视图


    `Admin Toolbar`（管理工具栏）通常有用，但有时你可能想关闭它以查看网站前端的完整视图。请注意，只有当你以 `admin` 身份登录网站时，`Admin
    Bar` 才会出现。


    如果你想关闭它，只需点击 `Edit my Profile`（编辑我的资料）功能。会出现一个屏幕，你可以在文本旁边找到复选框：`Show Toolbar when
    viewing site`（查看站点时显示工具栏）。你只需要取消勾选该框，滚动到底部并点击 `Update profile`（更新配置）来保存更改。


    # 第一周第 4 和 5 天 – 探索 WordPress 设置


    在仪表盘上，找到 `Settings`（设置）菜单并悬停在上方。将出现一个子菜单，你可以在其中访问 WordPress 设置的几个选项：`General`（常规）、`Reading`（阅读）、`Writing`（写作）、`Media`（媒体）、`Discussion`（讨论）和
    `Permalinks`（固定链接）。


    ##常规设置


    为了探索，你可以首先进入 `General Settings`（常规设置）。在此选项中第一个元素是 `Site Title`（站点标题）和 `Tagline`（标语）。确保这些文本与你的网站匹配，因为你的站点标题将用于
    SEO。默认情况下，WordPress 显示“just another WordPress site”作为标语。你需要更改此标语来描述你的网站，因为它对你网站的
    SEO 至关重要。


    接下来是 `WordPress Address (URL)`（WordPress 地址）。对于网站地址 URL，如果你希望网站主页与安装 WP 的目录分开，可以输入该
    URL。此时最好不要动这些 URL。


    然后，你还会看到 `Email Address`（电子邮件地址），你将其用于管理目的，包括新用户通知。还有 `Membership`（会员）设置。WordPress
    允许在线用户注册你的网站。如果会员对你的网站至关重要，这是一个非常有用的功能。


    同时，`New User Default Role`（新用户默认角色）设置为 `subscriber`（订阅者）。现在不要碰此设置，因为你可能会向任何注册网站的用户授予管理员权限。


    然后，是 `Timezone`（时区）。浏览列表选择你偏好日期格式所在的城市。请注意，此格式将出现在你的文章中。在你更新这些设置后，不要忘记 `Save changes`（保存更改）。


    ##阅读设置


    `Reading Settings`（阅读设置）显示了影响内容显示的设置。在这里你可以调整网站首页的显示方式——静态页面或最新的博客文章。在构建几个页面后，你可以在此设置中列出这些页面，以便它们出现在前端。


    下一个设置部分将允许你控制 `RSS feeds`（RSS 馈）的内容显示，包括显示的最大文章以及你是只想显示摘要还是全文。`Search engine visibility`（搜索引擎可见性）是最后一个部分。如果你不想让搜索引擎索引你的网站，应该勾选
    `Discourage search engines from indexing this site`（阻止搜索引擎索引此站点）。如果你处于开发阶段，这是一个很好的设置，此时仍不建议索引。


    记得 `Save Changes`（保存更改）。


    ##写作设置


    `Writing Settings`（写作设置）影响你网站的写作和发布。顶部的部分允许你控制仪表盘内的编辑器，而其他部分允许你控制外部发布方法。


    第一个部分显示了默认分类格式和文章格式的选项。你还会看到 `Press This` 书签插件部分，它允许你轻松对互联网上发现感兴趣的内容写博客。如果你想使用它，首先需要将屏幕上的链接拖到浏览器的书签栏中。如果你在另一个站点上，只需点击书签即可访问弹出的窗口，通过你的博客分享内容。


