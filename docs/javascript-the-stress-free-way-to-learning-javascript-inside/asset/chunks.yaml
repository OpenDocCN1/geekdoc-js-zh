    \nProgrammers consider this as the most basic loop type in JavaScript. Basically,\
    \ while loops execute a statement or block of code while an expression is true.\
    \ The loops will end as soon as the expression becomes false.\n\nHere is the flowchart\
    \ of a while loop:\n\n![](images/00021.jpeg)\n\nThe Syntax\n\nHere is the syntax\
    \ of a while loop:\n\n![](images/00022.jpeg)\n\nBefore executing any statement,\
    \ a while loop evaluates the condition of the assigned expression. That means\
    \ if the expression is false, none of the statements will be performed.\n\nDo…\
    \ while Loops\n\nA“do… while” loop is similar to a while loop. The only difference\
    \ is that it evaluates the expression after executing the assigned statement/s.\
    \ If the result of the evaluation is true, the loop will execute the statement/s\
    \ again. The process will only stop once the result becomes false. Because of\
    \ this, a“do… while” loop will run at least once even if the result of the evaluation\
    \ is false.\n\nThe flowchart of a typical“do… while” loop is:\n\n![](images/00023.jpeg)\n\
    \nThe Syntax\n\nHere is the syntax of a“do… while” loop:\n\n![](images/00024.jpeg)\n\
    \nImportant: The semicolon at the end of the syntax is mandatory. Make sure that\
    \ you’ll include it in all of your“do… while” loops.\n\nFor Loops\n\nThis kind\
    \ of loop is known for its compactness. In general,“for loops” have the following\
    \ parts:\n\n*   Loop Initialization– This is the part where you begin your counter\
    \ at an initial value. The interpreter of JavaScript executes this part before\
    \ running the loop itself.\n\n*   Test Statement– This part of the loop evaluates\
    \ the assigned condition. If the assigned condition is true, the interpreter will\
    \ execute the code within the“for” loop. If the condition is false, however, the\
    \ system control will be given to the statement after the“for” loop.\n\n*   Iteration\
    \ Statement– You can use this part to increase or decrease the loop’s counter.\n\
    \nJavaScript allows you to place all of these parts in a single line. You just\
    \ have to separate each part using semicolons.\n\nThe image below shows the flowchart\
    \ of a“for” loop:\n\n![](images/00025.jpeg)\n\nThe Syntax\n\nThe syntax of a“for”\
    \ loop is:\n\n![](images/00026.jpeg)\n\nHow to Control Your Loops\n\nThe JavaScript\
    \ language allows you to manipulate all of your loops and switches. In some cases,\
    \ you have to exit a loop statement before reaching its final section. There are\
    \ also some situations where you have to ignore a certain part of the code and\
    \ initialize the next one.\n\nTo help you with such situations, this programming\
    \ language offers two powerful tools: the break statement and the continuestatement.\
    \ Let’s discuss each statement in detail.\n\nBreak Statements\n\nThis statement,\
    \ which was introduced in the previous chapter, allows you to exit any loop early.\
    \ The image below will show you the flowchart of a basic break statement.\n\n\
    ![](images/00027.jpeg)\n\nNote: You’ve seen how break statements work during our\
    \ discussion about switch statements.\n\nContinue Statements\n\nA continue statement\
    \ instructs the JavaScript interpreter to begin the next iteration of a loop and\
    \ ignore the remaining blocks of code. Once the system encounters a continue statement,\
    \ the flow of the program goes to the expression evaluation. If the condition\
    \ is still true, the continue statement will begin the next iteration. If the\
    \ condition becomes false, on the other hand, program control will go outside\
    \ the loop.\n\n# \n\nChapter 7: The Functions in the JavaScript Language\n\nBasically,\
    \ functions are collections of reusable codes that can be invoked at any part\
    \ of your program. That means you won’t have to write the same code multiple times.\
    \ Functions help programmers in creating modular codes. They also allow programmers\
    \ to divide a large program into smaller functions.\n\nJust like any other programming\
    \ language, JavaScript offers features that can help in writing modular codes\
    \ through functions. You’ve probably seen functions such as write() and alert()\
    \ in the codes given in this book. You can use these functions repeatedly, but\
    \ they were written in JavaScript once.\n\nThis language also allows you to write\
    \ your own functions. This chapter will teach you the basics of functions in JavaScript.\n\
    \nHow to Define a Function\n\nYou have to define functions before you can use\
    \ them. The most popular method of defining a function involves the use of function\
    \ (i.e. a JavaScript keyword). After typing function, specify the name and parameters\
    \ that you’d like to use. Then, add a block of JavaScript statement enclosed by\
    \ braces.\n\nNote: You may create a function without defining any parameter. Thus,\
    \ the list of parameters may be empty.\n\nHere is the syntax that you must use\
    \ when defining a function:\n\n![](images/00028.jpeg)\n\nHow to Call a Function\n\
    \nTo call a function in your scripts, you just have to specify the function’s\
    \ name. You may use the code below as an example:\n\n![](images/00029.jpeg)\n\n\
    That code will give you this result:\n\n![](images/00030.jpeg)\n\nThe Parameters\
    \ of a Function\n\nThe functions you’ve seen so far don’t have any parameter.\
    \ However, you can easily assign various parameters while invoking/calling a function.\
    \ You can capture these parameters within the function. Once captured, you may\
    \ modify those parameters according to your needs.\n\nReturn Statements\n\nJavaScript\
    \ allows you to add a return statement to your functions. This return statement\
    \ is completely optional, although you have to use it if you want to acquire values\
    \ from your function/s. In general, you should place the return statement at the\
    \ last section of your function.\n\nFor instance, you may pass two values into\
    \ your function. Then, you may expect that function to multiply the values and\
    \ show the result in the program you are calling.\n\nThe Nested Functions\n\n\
    JavaScript allows you to place a function inside another function. This process\
