    \ too. To help you understand this further, consider the following sample codes:\n\
    \n```python\nif True:\n    print“Correct”\nelse:\n    print“Incorrect”\n\nif True\n\
    \    print“Input”\n    print“Correct”\nelse:\n    print“Input”\n    print“False\n\
    ```\n\nRunning the first given example generates an output. Running the second\
    \ one, however, results in an error. Why did this happen? Well, you have to keep\
    \ in mind that in Python, blocks are formed by indenting continuous lines with\
    \ the same amount of space.\n\nIndentation is simply a way to group statements.\
    \ Programmers use it in place of curly braces of blocks of code. Tabs and spaces\
    \ are supported, but standard indentation requires standard codes to have similar\
    \ amounts of spaces. In general, four spaces are used. Take a look at the following\
    \ example:\n\n```python\nw = 1\n\nif w == 1 :\n    # This shows an indentation\
    \ with exactly four spaces\n    print“ w is 1 .“\n```\n\n### Indentation Myths\n\
    \nThere are certain myths that surround indentation in Python. Here are some of\
    \ them:\n\n*   A whitespace is necessary in every source code.\n    Actually,\
    \ you do not have to use whitespaces in all your source codes. A whitespace is\
    \ not necessarily significant, although an indentation is. As you have learned,\
    \ this is the whitespace found at the very left part of a statement. Everywhere\
    \ else, a whitespace is not that significant and may be omitted. You can use it\
    \ in any way you like, even inserting arbitrary whitespaces or empty lines that\
    \ do not contain anything anywhere in your program.\n*   Moreover, the exact amount\
    \ of indentation does not really matter, but the relative indentation of your\
    \ nested blocks does. The indentation level is actually not recognized when you\
    \ use implicit or explicit continuation lines. For instance, you may split a list\
    \ across multiple lines. The indentation is just not significant at all. Take\
    \ a look at the following example:\n\n```python\nfoo = [\n    ‘ a string ‘ ,\n\
    \    ‘ another string ‘ ,\n    ‘ a short string ‘ ,\n]\n```\n"
