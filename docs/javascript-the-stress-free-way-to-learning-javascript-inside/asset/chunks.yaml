    \ have to be careful when you use uppercase and lowercase letters in your codes.\
    \ For instance, `wendy`, `Wendy`, and `WENDY` are all the same name and yet they\
    \ are regarded as three different identifiers in Python.\n\n### Rules for Identifiers\
    \ in Python\n\nThere are several rules that you have to abide by when writing\
    \ programs in Python:\n\n*   The class name must always start with an uppercase\
    \ character while the rest of the identifiers must start with a lowercase character.\n\
    *   The identifier is private if it starts with just one leading underscore.\n\
    *   The identifier is strongly private if it starts with two leading underscores.\n\
    *   The identifier is a language-defined special name if it ends with two trailing\
    \ underscores.\n\n### Reserved Words\n\nTake note that there are certain words\
    \ you cannot use as constants, identifier names, or variables in Python. All keywords\
    \ are also written using lowercase letters. The following is a table of the reserved\
    \ words in the programming language:\n\n| And | Assert | Break | Class | Continue\
    \ |\n| :--- | :--- | :--- | :--- | :--- |\n| `def` | `del` | `elif` | `else` |\
    \ `except` |\n| `exec` | `finally` | `for` | `from` | `global` |\n| `if` | `import`\
    \ | `in` | `is` | `lambda` |\n| `Not` | `or` | `pass` | `print` | `raise` |\n\
    | `return` | `try` | `while` | `with` | `yield` |\n\n## Indentation and Lines\n\
    \nThere are no braces for the indication of blocks of code for class definition\
    \ and function in Python. Likewise, flow control is not included. If you want\
    \ to denote such blocks of code, you have to make use of line indentation. You\
