    # 第一章：JavaScript 与代码


    ## JavaScript – 通用信息


    JavaScript 早于 1995 年推出，作为一种向网页添加程序的方法。当时，它专门用于一种名为 `Netscape Navigator`（网景浏览器）的
    浏览器。由于 JavaScript 的成功，现在所有主流浏览器都支持它。这种语言允许程序员创建现代网络程序——即你可以在无需为每个操作重新加载网页的情况下与之交互程序。另一方面，传统的网站也使用
    JavaScript 来提供不同类型的功能和交互性。


    此时，你应该知道 JavaScript 与 `Java`（即当今领先的编程语言之一）没有关系。JavaScript 在其存在的第一年里曾被称为“Mocha”和“LiveScript”。然而，由于
    `Java` 编程语言极其流行，JavaScript 的所有者决定采用它的名字。这是一个为了利用 `Java` 的人气而设计的营销策略。


    ## 代码 – 通用信息


    代码是构成计算机程序和网络应用程序的文本。本电子书包含大量代码，因此你应该熟悉它们。计算机专家声称，编写代码和阅读代码是成为程序员的重要方面。因此，你应该阅读并理解书中包含的代码。如果你只是简单扫一眼代码示例，将剥夺自己良好的学习机会。


    初学者在分析代码时可能会遇到困难。然而，如果他们仔细阅读说明，他们一定会理解 JavaScript 是如何工作的。最好尝试使用 JavaScript 解释器运行代码示例。这样，你就可以立即获得关于代码在编译为程序后样子的信息。


    # 第二章：JavaScript 的不同方面


    ## 数据与位


    数据构成了数字世界。如果你“访问计算机内部的世界”，你将看到一件事：数据。你可以读取、编辑和生成数据。每当你保存新数据时，它将以位（bits）序列的形式存储。这就是为什么存储的数据具有相似外观和特征的原因。


    在编程中，`bit` 是任何具有两个值的东西（通常用 1 和 0 表示）。你可以将任何数据还原为 1 和 0 的序列。这个过程被称为数据位转换。


    ## 值


    典型的计算机系统涉及数十亿个位。这意味着处理数据可能极其混乱。如果你想处理如此惊人的信息，必须将其分成更小的块。在 JavaScript 中，这些信息块被称为
    `values`（值）。虽然所有值都由位组成，但它们有不同的类型和功能。JavaScript 支持六种类型，即：`strings`（字符串）、`numbers`（数字）、`functions`（函数）、`objects`（对象）、`undefined
    values`（未定义值）和 `Booleans`（布尔值）。


    生成一个 `value`，只需指定它的名称。这个过程简单快捷。你不需要收集材料或支付任何费用。只需指定值的名称，砰！你就拥有它了。


    本章将介绍 JavaScript 语言的基础元素（即运算符和值类型）。这些元素可以与 JavaScript 中的 `values` 交互。


    现在，让我们谈谈不同的值类型。


    ### 数字


    属于这种类型的值是……你猜得没错：数值。在编写 JavaScript 应用时，你必须使用以下格式：


    ```

    <number>

    ```


    例如，假设你在 JavaScript 程序中输入了此值：`99`。将在你的内存中为数字 `99` 创建位序列。


    JavaScript 语言使用 `64 bits` 来存储每个数值。用 `64 bits` 可以创建的模式是有限的，因此用它们表示的数字也是有限的。对于 `x`
    个进制数字，你能表示的数字等于 `10x`。同样，由于你有 `64` 位数字，你可以表示多达 `264` 个数值。


    以前，计算机内存非常小，人们不得不使用 8 位或 16 位组合表示数值。由于内存不足，用户在使用 JavaScript 时经常遇到“数据溢出”。然而，现在即使是基础桌面电脑也拥有大量内存。这意味着你可以轻松使用
    `64-bit sequences`——你再也不需要担心数据溢出了。


    数值还可以存储负整数。在这里，其中一个位表示值的符号（可以是 `+` 或 `-`）。此外，JavaScript 还支持非整数（即小数）。为了实现这一点，某些位存储了小数点在数值中的位置。


    你可以使用句点来编写小数和小数。例如：


    ```

    99.99

    ```


    另一方面，对于极大的数字或极小的数字，你可以通过添加一个 `e` 来使用科学计数法。只需在其后面加上正确的指数即可。例如：


    ```

    9.999e9 = 9.999 x 109

    ```

