    # 第 4 章：JavaScript 语言中的变量


    ## JavaScript 中的数据类型


    与其他编程语言类似，JavaScript 有它自己支持的数据类型。因此，你可以使用 JavaScript 表示和操作某些值和信息。


    这种编程语言支持这些基本数据类型：


    * `Boolean`（布尔值，即 `true` 或 `false`）

    * `Strings`（字符串，例如“这本书非常棒。”）

    * `Numbers`（数字，例如 1, 2, 3, 123 等）


    JavaScript 还支持 `null` 和 `undefined`，这是两种描述单一值的数据类型。最后，该语言使用了一种名为“object”（对象）的复杂数据类型。你将在本书的后面部分学习对象。


    **注意：** JavaScript 将所有数字都视为浮点值。


    ## 变量


    作为 JavaScript 用户，你可能将变量看作容器：你可以在变量中放置不同类型的信息。要访问存储的数据，你只需要指定存放它的容器即可。


    在使用变量之前，你必须先对其进行声明。在 JavaScript 中，声明变量时应该使用 `var`。查看以下示例：


    ![](img/00013.jpeg)


    上面的代码声明两个变量：`money` 和 `name`。


    将数据保存到变量的过程被称为变量初始化。大多数程序员会在声明时初始化变量。然而，你也可以只声明变量而不保存任何值：一旦你需要，就可以将数据保存到变量中。


    例如，你可以创建一个名为 `profit` 的变量而不输入任何值。一旦你从总收入中减去费用，就可以回到创建的变量并输入信息。要初始化变量，你只需要指定变量名，放置一个等号，并输入你想要赋值的值。这里有一个示例：


    ```javascript

    var profit;

    profit = 1,000,000.00;

    ```


    JavaScript 被认为是一种“无类型”的计算机语言。这意味着 JavaScript 变量可以包含任何类型的数据。这与其它语言相比是一个巨大的优势，其他语言要求用户在创建变量时指定数据类型。


    ## 变量的作用域


    变量的“作用域”是你计算机程序中声明它的区域。JavaScript 支持以下作用域：


    * `Local`（局部）——局部变量仅在定义它的函数内部可见。这意味着一个函数无法使用另一个函数的局部变量。

    * `Global`（全局）——全局变量对程序内部的所有函数可用。这意味着你可以在代码的任何地方定义它们。


    如果局部变量和全局变量同名，则局部变量将具有优先级。如果你使用已有的全局变量名在局部声明变量，你将隐藏该全局变量。分析下方的示例代码：


    ![](img/00014.jpeg)


    上面的代码将向你显示此结果：Local（局部）。


    ## 变量命名


    在为变量选择名称时，你应该记住以下规则：


    * 你不能使用任何 JavaScript 关键字（例如 `break`、`Boolean` 等）作为变量名。你将在稍后学习 JavaScript 关键字。

    * 在命名变量时，可以使用字母、数字和下划线。但是，名称不能以数字开头。例如，`sample1` 是有效的，但 `1sample` 是无效。

    * 变量名是区分大小大小的。这意味着 JavaScript 将“SAMPLE”、“Sample”和“sample”视为三个不同的变量。


    ## JavaScript 中的保留关键字


    与其他编程语言类似，JavaScript 有一组具有特殊用途的单词。你不能在命名对象、方法、函数、循环和变量时使用这些词。下表将向你展示 JavaScript
    语言中所有的关键字。


    | if | do | in | int |

    | --- | --- | --- | --- |

    | new | try | for | var |

    | else | enum | this | long |

    | byte | case | true | null |

    | char | goto | void | with |

    | break | throw | false | final |

    | catch | float | class | const |

    | while | short | super | switch |

    | export | throws | typeof | public |

    | return | delete | static | double |

    | import | Instanceof | abstract | synchronized |

    | Boolean | interface | extends | transient |

    | finally | package | private | protected |

    | function | volatile | continue | debugger |

    | implements | | | |


    # 第 5 章：JavaScript 运算符


    JavaScript 语言支持以下类型的运算符：


    * 逻辑运算符

    * 比较运算符

    * 赋值运算符

    * 算术运算符

    * 位运算符

    * 杂杂运算符


    让我们讨论每种类型的运算符：


    ## 逻辑运算符


    JavaScript 支持这些逻辑运算符：


    **注意：** 假设 `x = 5` 且 `y = 10`。


    * `&&` —— 这被称为逻辑与（AND）运算符。如果两个操作数都不等于零，则条件为真。例如：`(x && y)` 为真。

    * `||` —— 此运算符称为逻辑或（OR）运算符。如果至少有一个操作数不等于零，则条件为真。例如：`(x || y)` 为真。

    * `!` —— 程序员将此运算符称为逻辑非（NOT）。此运算符会反转它所操作运算符的结果。例如：`!(x && y)` 为假。


    ## 比较运算符


    以下是你可以在 JavaScript 中使用的比较运算符：


    **注意：** 让我们使用以下变量：`x = 2;` `y = 4;`


    * `==` —— 此运算符检查值的相等性。如果值相等，条件为真。例如：`x == y`。

    * `!=` —— 使用此运算符检查操作数是否不等。如果值不相等，条件为真。例如：`x != y`。

    * `>` —— 此运算符检查左侧操作数是否大于右侧。如果是，条件为真。例如：`x > y`。

    * `<` —— 此运算符检查操作数是否小于。如果是，条件为真。例如：`x < y`。

    * `>=` —— 你可以使用此运算符检查左侧操作数是否大于或等于右侧。如果是，条件为真。例如：`x >= y`。

    * `<=` —— 使用此运算符检查左侧操作数是否小于或等于右侧。如果是，条件为真。例如：`x <= y`。


    ## 赋值运算符


    这些是你可以用于赋值赋值的运算符：


    * `=` —— 这是简单赋值运算符。它将右侧操作数的值赋值给左侧操作数。例如：`z = x + y` 将 `x + y` 的值赋值给 `z`。

    * `+=` —— 此运算符被称为加赋值运算符。它将两个操作数相加并将结果赋予左侧操作数。例如：`z += x` 等于 `z = z + x`。

    * `-=` —— 程序员称之为减赋值运算符。它从左侧操作数中减去右侧操作数的值。然后，将差赋值给左侧操作数。例如：`z -= x` 等于 `z = z -
    x`。

    * `*=` —— 此运算符称为乘赋值运算符。它将两个操作数相乘并将积赋予左侧操作数。例如：`z *= x` 等于 `z = z * x`。

    * `/=` —— 这被称为除赋值运算符。它将左侧操作数的值除以右侧操作数的值。然后，将商赋值给左侧操作数。例如：`z /= x` 等于 `z = z /
    x`。

    * `%=` —— JavaScript 用户将其称为取模赋值运算符。它取两个操作数的模并将结果赋予左侧操作数。例如：`z %= x` 等于 `z = z
    % x`。


    '
- fmt: '

    The list below shows the arithmetic operators available in JavaScript. To help
    you understand how these operators work, let’s use two sample variables: `x =
    2`; `y = 4`.


    *   `+` – You should use this operator if you want to perform addition on two
    operands (i.e. the values on either side of the operator). For instance: `x +
    y = 6`.

    *   `-` – This operator allows you to perform subtraction on your codes. Here,
    you’ll deduct the value of the second operand from that of the first. For example:
    `y– x = 2`.

    *   `*` – You should use an asterisk if you want to multiply the two operands.
    For example: `x * y = 8`.

    *   `/` – With this operator, you’ll divide the value of the left-hand operand
    from that of the right-hand operand. For example: `y / x = 2`.

    *   `++` – This operator allows you to add 1 to the operand it is used on. For
    example: `4++ = 5`.

    *   `--` – This operator subtracts 1 from the operand it is attached to. For example:
    `x-- = 1`.


    **Important Note:** You may also use the `+` operator to combine numeric and string
    elements. For example, `"x" + 4 = x4`.


    ## The Bitwise Operators


    This programming language allows you to perform bitwise operations in your codes.
    Here are the operators that you can use:


    **Note:** Let’s use two variables: `x = 2`; `y = 3`.


    *   `&` – This is called the Bitwise AND operator. It conducts the Boolean AND
    operation on all of the bits involved in its arguments. For example: `(x & y)`
    is 2.

    *   `|` – Programmers refer to this operator as Bitwise OR. It conducts the Boolean
    OR operation on the bits involved in its arguments. For instance: `(x | y)` is
    3.

    *   `^` – This is known as the Bitwise XOR operator. It conducts the Boolean Exclusive
    OR operation on all of the bits involved in its arguments. With Exclusive OR,
    only one of the operands can be true. For example: `(x ^ y)` is 1.

    *   `~` – This operator is `unary` (i.e. it works on a single operand). Known
    as the Bitwise NOT operator, it reverses the bits of the operand. For example:
    `(~y)` is -4.

    *   `<<` – This operator is called Left Shift. It moves the bits of the left-hand
    operand to the left based on the number specified by the right-hand operand. Also,
    it uses zeros to fill new bits. Moving a value to the left by 1 position is like
    multiplying it by 2. Thus, `(x << 1)` gives 4.

    *   `>>` - This is known as the Right Shift operator. It moves the value of the
    left-hand operand to the right based on the number given by the right-hand operand.
    For example: `(x >> 1)` gives 1.

    *   `>>>` – JavaScript users call this `Right Shift and Zero.` Its function is
    similar to that of `>>`. The only difference is that the leftmost bits are always
    equal to zero.


    ## The Miscellaneous Operators


    This section of the book will discuss two useful operators that don’t belong to
    the categories discussed above. These operators are:


    *   `?:` – This is known as the `Conditional Operator.` It checks whether the
    value of an expression is true or false. Then, it performs one of the assigned
    statements based on the evaluation’s result. For example, if the condition is
    true, the operator will assign 1 to the expression. If the condition is false,
    however, the operator will assign 2.

    *   `typeof`– This is a unary operator, which means you can use it on a single
    operand. You can use it to determine an operand’s data type. This operator gives
    `string`, `boolean`, or `number` if the operand is a string, Boolean, or number.
    Then, it gives true or false, depending on the result of the evaluation.


    The table below provides useful information regarding the `typeof` operator:


    | Data Type | The typeof Result |

    | :--- | :--- |

    | Object | “object” |

    | Number | “number” |

    | Boolean | “boolean” |

    | Undefined | “undefined” |

    | Null | “object” |

    | Function | “function” |

    | String | “string” |


    # Chapter 6: The Conditional Statements


    While using JavaScript, there will be situations that require you to choose one
    out of a predetermined set of choices. In these cases, you must use conditional
    statements. A conditional statement allows your program to make proper judgments
    and execute correct processes.


    This programming language offers conditional statements that you can use on your
    codes. This chapter will discuss three of the most important conditional statements:
    (1) the `if` statement, (2) the `if… else` statement, and (3) the `if… else if…`
    statement.


    Let’s discuss these statements in detail:


    ### The Flow Chart of a Conditional Statement


    The image below shows the basic flow chart of a conditional statement.


    ![](images/00015.jpeg)


    ### The if Statement


    This statement serves as the basic conditional statement in JavaScript. It helps
    programs in making decisions and executing other statements.


    The syntax of the `if` statement is:


    ![](images/00016.jpeg)


    The code given above evaluates JavaScript expressions. If the result of the evaluation
    is true, the assigned statement/s will be performed. If the result is false, however,
    none of the assigned statements will be performed. In most cases, you’ll be using
    comparison operators with this statement.


    ### The if… else Statement


    This statement is more complex than the previous one. That’s because the `if…
    else` statement offers better control in executing statements conditionally.


    Here is the syntax of the `if… else` statement:


    ![](images/00017.jpeg)


    You can use the syntax given above to evaluate JavaScript expressions. If the
    result is true, the statement placed in the `if` section will be performed. If
    the result is false, on the other hand, the statement within the `else` section
    will be performed.


    ### The if… else if… Statement


    Basically, this is an enhanced form of the `if… else` statement. By providing
    multiple conditions, it helps your programs in making the right decisions and
    performing the correct actions.


    Here is the syntax that you must use when creating an `if… else if…` statement:


    ![](images/00018.jpeg)


    If you’ll think about it, the syntax given above is a basic one. It’s a simple
    collection of `if` statements where every `if` serves as a part of the preceding
    else clause. This syntax executes statement/s depending on the result of the evaluation.
