    # 第 1 章：Python 简介


    如果你正在寻找一种以代码可读性为主要关注点的通用、高级编程语言，你应该考虑 Python。它的语法允许你使用比 C、C++ 和 Java 等其他编程语言更少的代码行来表达概念。它支持广泛的编程范式，因此涵盖了命令式、函数式和面向对象的编程。此外，它还具有全面的标准库、动态类型系统和自动内存管理。


    有许多解释器可以让你安装在不同的操作系统上；因此，你可以在各种系统上执行 Python。你甚至可以使用第三方应用程序。如果你不想安装解释器，可以将代码封装成独立的可执行程序，以便在不同环境中分发
    Python 软件。


    ### Python 语言的简史


    Python 由 Guido van Rossum 在 20 世纪 80 年代后期开发。最初只是一个圣诞项目。Van Rossum 想要为 C 和 UNIX
    黑客提供一种脚本语言解释器。他的小项目最终升级到 Python 2.0，于 2000 年 10 月发布。这个新版本具有完整的垃圾回收和 Unicode 支持。Python
    3.0，也称为 Python 3000 和 py3k，于 2008 年 12 月发布，并向 2.6 和 2.7 版本回溯了某些特性。


    ### 为什么你应该使用 Python？


    编程语言的存在是有理由的。例如，Python 的开发是为了让程序员创建高效且高效的代码。它的主要目标是帮助初学者轻松快速地学习编程语言。由于减少了学习时间，你可以创建出用更晦涩、复杂的编程语言难以实现的实用应用程序。


    通过 Python，你还可以从缩短应用程序开发时间中获益。如前所述，Python 的代码行比 C、C++ 和 Java 少。它的代码实际上短了五到十倍；因此更高效且不复杂。你可以花费更少的时间来开发应用程序，而花更多时间来调优和改进它们。


