    `TheString` =“ Python 的名字源于一个受欢迎的喜剧节目。“


    如你在上方所示示例代码所示，短语 `Python got its name from a popular comedy show.` 被赋值给变量 `TheString`。


    计算机无法理解字母，只能理解数字。因此，当你编写程序时，Python 会根据代表字母的数字对其进行读取和解释。例如，在美国标准信息交换代码（ASCII）中，数字
    `65` 代表字母 `A`。所以，如果你输入：


    ```python

    ord (“ A“ )

    ```


    你将得到输出：


    ```

    65

    ```


    由于计算机无法理解字母，你必须将字符串转换为数字。你可以使用 `int` 或 `float` 来实现这一点。如果你需要将数字转换为字符串，可以使用 `str`。


    # 第 4 章：运算符


    操作数的值通过运算符进行处理。Python 编程语言中使用了七种类型的运算符。下表显示了这些运算符，并对它们的功能进行了简要说明。


    ## 算术运算符


    | 运算符 | 说明 |

    | :--- | :--- |

    | 加法 (`+`) | 它将两个值相加。 |

    | 减法 (`-`) | 它从上一个操作数减去第二个操作数。 |

    | 乘法 (`*`) | 它将两个值相乘。 |

    | 除法 (`/`) | 它将第一个操作数除以第二个操作数。 |

    | 取模 (`%`) | 它将第一个操作数除以第二个操作数并返回余数。 |

    | 幂 (`**`) | 它对运算符执行幂计算。 |

    | 整除(`//`) | 它对操作数进行除法，但去掉结果后的小数点。 |


    ## 比较运算符（关系运算符）


    | 运算符 | 说明 |

    | :--- | :--- |

    | `==` | 如果两个操作数的值相等，则条件为真。 |

    | `!=` | 如果两个操作数的值不相等，则条件为真。 |

    | `<>` | 如果两个操作数的值不相等，则条件为真。 |

    | `>` | 如果左操作数的值大于右操作数的值，则条件为真。 |

    | `<` | 如果左操作数的值小于右操作数的值，则条件为真。 |

    | `>=` | 如果左操作数的值大于或等于右操作数的值，则条件为真。 |

    | `<=` | 如果左操作数的值小于或等于右操作数的值，则条件为真。 |


    ## 赋值运算符


    | 运算符 | 说明 |

    | :--- | :--- |

    | `=` | 它将右操作数的值赋值给左操作数。 |

    | `+=` 加并赋值 | 它将右操作数加到左操作数，然后将结果分配给左操作数。 |

    | `-=` 减并赋值 | 它从左操作数减去右操作数，然后将结果分配给左操作数。 |

    | `*=` 乘并赋值 | 它将左操作数和右操作数相乘，然后将结果分配给左操作数。 |

    | `/=` 除并赋值 | 它将左操作数除以右操作数，然后将结果分配给左操作数。 |

    | `%=` 取模并赋值 | 它使用两个操作数寻找模，然后将结果分配给左操作数。 |

    | `**=` 幂并赋值 | 它对运算符执行幂计算，然后将值赋值给左操作数。 |

    | `//=` 整除赋值 | 它对运算符执行整除并将值赋值给左操作数。 |


    ## 位运算符


    | 运算符 | 说明 |

    | :--- | :--- |

    | `&` 二进制与 | 如果该位在两个操作数中都存在，则复制该位。 |

    | `|` 二进制或 | 如果该位在任一操作数中存在，则复制该位。 |

    | `^` 二进制异或 | 如果该位在一个操作数中存在但不在另一个中，则复制该位。 |

    | `~` 二进制按位反 | 它反反位。 |

    | `<<` 二进制左移 | 它根据右操作数指定的位数，将左操作数的值向左移动。 |

    | `>>` 二进制右移 | 它根据右操作数指定的位数，将左操作数的值向右移动。 |


    ## 逻辑运算符


    | 运算符 | 说明 |

    | :--- | :--- |

    | `And` 逻辑与 | 如果两个操作数都为真，则条件为真。 |

    | `Or` 逻辑或 | 如果其中一个操作数非零，则条件为真。 |

    | `Not` 逻辑非 | 它反转操作数的逻辑状态。 |


    ## 成员运算符


    | 运算符 | 说明 |

    | :--- | :--- |

    | `Is` | 如果运算符两边的变量指向同一个对象，则结果为真。否则，结果为假。 |

    | `Not in` | 如果在特定序列中没有找到该变量，则结果为真。否则，结果为假。 |


    ## 身份运算符


    | 运算符 | 说明 |

    | :--- | :--- |

    | `Is` | 如果运算符两边的变量指向同一个对象，则结果为真。否则，结果为假。 |

    | `Is not` | 如果运算符两边的变量指向同一个对象，则结果为假。否则，结果为真。 |


    # 结语


