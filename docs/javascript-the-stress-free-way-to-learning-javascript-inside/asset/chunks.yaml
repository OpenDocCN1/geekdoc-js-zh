    # Chapter 1: JavaScript and Codes


    ## JavaScript – General Information


    JavaScript was launched back in 1995 as a method of adding programs to webpages.
    Back then, it was exclusively used for a web browser called `Netscape Navigator`.
    Because of the success attained by JavaScript, all major browsers are now supporting
    it. This language allows programmers to create modern web programs – programs
    you can interact with without reloading webpages for each action. Traditional
    websites, on the other hand, also use JavaScript to provide different types of
    functionality and interactivity.


    At this point, you should know that JavaScript is not related with `Java` (i.e.
    one of the leading programming languages today). JavaScript was called “Mocha”
    and “LiveScript” during its first year of existence. However, because the `Java`
    programming language was extremely popular, the owners of JavaScript decided to
    adopt its name. It was a marketing maneuver designed to exploit the popularity
    enjoyed by `Java`.


    ## Codes – General Information


    Codes are the texts that form computer programs and web applications. This eBook
    contains lots of codes, so you should be familiar with them. Computer experts
    claim that writing codes and reading codes are important aspects of becoming a
    programmer. Thus, you should read and understand the codes included in this book.
    You’ll be robbing yourself of excellent learning opportunities if you will simply
    glance over the code samples.


    Beginners might experience difficulties in analyzing the codes. However, they
    will surely understand how JavaScript works if they will read the instructions
    carefully. It would be best if you will try the code samples using a JavaScript
    interpreter. This way, you can receive instant information about how codes look
    like once they are compiled as a program.


    # Chapter 2: The Different Aspects of JavaScript


    ## Data and Bits


    Data forms the digital world. If you’ll “visit the world inside a computer, there
    is one thing you will see: data. You may read, edit, and generate data. Whenever
    you save new data, it will be stored as sequences of bits. This is the reason
    why stored pieces of data have similar appearance and characteristics.


    In programming, a `bit` is anything that has two values (often represented by
    ones and zeros). You can reduce any piece of data into a series of ones and zeros.
    This process is known as data-to-bit conversion.


    ## Values


    Typical computer systems involve billions of bits. That means working with data
    can be extremely confusing. If you want to work with such a staggering amount
    of information, you have to divide it into smaller chunks. In JavaScript, these
    chunks of information are known as `values`. Although all values are formed by
    bits, they have different types and functions. JavaScript supports six types of
    values, namely: `strings`, `numbers`, `functions`, `objects`, `undefined values`,
    and `Booleans`.


    To generate a `value`, you just have to indicate its name. This process is easy
    and simple. You won’t have to collect materials or pay any fee. Just indicate
    a value’s name, and BAM! You have it.


    This chapter will introduce the basic elements of the JavaScript language (i.e.
    operators and value types). These elements can interact with the `values` in JavaScript.


    For now, let’s talk about the different types of values.


    ### The Numbers


    Values that belong to this type are… you guessed it right: numeric values. You
    have to use the following format when writing a JavaScript application:


    ```

    <number>

    ```


    For example, let’s say you entered this value into your JavaScript program: `99`.
    This will create a bit sequence for the number `99` inside your machine’s memory.


    The JavaScript language uses `64 bits` to store each number value. The number
    of patterns you can create with `64 bits` is limited, so the numbers that you
    can represent with them is also limited. For `x` decimal numbers, the numbers
    that you can represent is equal to `10x`. In the same manner, since you have `64
    digits`, you may represent up to `264 number values`.


    Before, computer memory was so small people had to use sets of eight or sixteen
    bits to indicate number values. Since the memory was insufficient, users often
    experienced “data overflows” when working with JavaScript. Today, however, even
    basic desktops possess lots of memory. That means you can easily use `64-bit sequences`
    – you won’t have to worry about data overflows anymore.


    Number values can also store negative integers. Here, one of the bits represent
    the value’s sign (either `+` or `-`). Additionally, JavaScript supports non-whole
    numbers (i.e. decimal numbers). To accomplish this, some bits store the decimal
    point’s position in the number value.


    You can write decimal and fractional numbers using a period. Here’s an example:


    ```

    99.99

    ```


    For extremely large or extremely small numbers, on the other hand, you may add
    an `e` to use the scientific notation. Just follow it up with the correct exponent.
    Here’s an example:


    ```

    9.999e9 = 9.999 x 109

    ```

