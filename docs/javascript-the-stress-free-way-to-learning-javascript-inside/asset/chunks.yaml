    # Chapter 3: Understanding Settings


    By understanding the settings and knowing how to use it, you’ll easily be able
    to navigate Windows 10 and make the most out of it!


    ## Accounts


    You can find the `Accounts` tab under the `Charms` bar, and is basically about
    your Windows account.


    Your `Account` is your primary sign-in account. This is linked to Microsoft’s
    Cloud Network.


    `Sign-in options` will ask you how exactly you want to open your computer. You
    can make use of normal log-in plus password, choose `Windows Hello`, which would
    allow you to log in using biometrics.


    `Work Access` tells you whether the PC or your account is connected to another
    network.


    `Family and Other Users` allows you to add more admins to the PC. To do this,
    just click `Set up account for assigned access` > `Choose an Account` > `Choose
    an App`.


    `Sync Your Settings` allows you to sync this PC with your other gadgets—and other
    computers at home, as well.


    ## Privacy


    Of course, you can also make sure that your privacy is protected with the help
    of `Windows 10`. Here’s how:


    `General` is about deciding whether you’d like your name to appear on apps, programs,
    photos, and any other file that is connected to your computer.


    `Location` basically works on `GPS`, and allows you whether you’d like to let
    others see where you are or not.


    `Microphone` gives you the chance to turn the microphone on or off.


    `Speech, Inking, Typing` mostly gives you the option to use `Cortana` (Windows
    10’s digital assistant) or not.


    `Account Info`, `Calendar`, `Contacts`, `Messaging`, `Radio` just give you permission
    whether you’d like to sync them with other devices or not.


    `Other Devices` gives you permission to sync `Xbox One` and information found
    there with your Microsoft account.


    `Feedback`. Choose whether you’d want Microsoft to ask you for feedback once a
    day, once a week, automatically, always, or never.


    ## Devices


    The `Devices` Tab gives you options as to which devices you’d like to connect/sync
    with your PC.


    `Printers and Scanners` allows you to add printers to your computer. To do this,
    just click `Devices and Printers` > `Device Manager` > `Related Settings` > `Add
    a Printer or Scanner` and follow the instructions you’ll see onscreen.


    `Connected Devices`, meanwhile, is about other connected devices that are not
    printers or scanners.


    `Mouse and Touchpad` gives you a chance to configure `Mouse and Touchpad` settings.
    Just choose `Mouse and Touchpad` > `Related Settings` > `Additional Mouse Options`.


    `Typing` allows you to choose whether you’d like to use a physical or onscreen
    keyboard.


    `Autoplay` allows you to choose whether `Autoplay` should be switched on or off.


    ## Ease of Access


    The `Ease of Access` Tab contains Windows 10’s Accessibility Settings.


    `Narrator` helps you gain voice protocol. It basically reads what is shown onscreen,
    or whatever you type, and you can choose between `David` and `Zira` as your narrator.
    You can also add the sounds you want to hear, or the language you want to focus
    on.


    `Magnifier` gives you a floating toolbar and also magnifies your screen.


    `High Contrast` allows you to choose a `High Contrast` theme.


    `Closed Captions` provides you with subtitles or captions to help you understand
    what you hear onscreen. It works for sites such as `Hulu` and `Netflix`.


    `Keyboard and Mouse` contains well, `Keyboard and Mouse` settings—like what’s
    in earlier versions of Windows.


    ## Personalization


    Then again, you also have the chance to personalize your Windows 10 Experience.
    Take note, though, that you’d have more chances to customize your experience—but
    more of that on a later chapter. Here are the basics first:


    `Background` is mainly just the wallpaper of your computer, and choose how you’d
    want the photo to fit on your screen.


    `Colors` are the colors that would be used for your desktop, toolbars, etc.


    `Lockscreen` is what you’ll see onscreen while it is locked. Click `Pictures`,
    and you’ll see the 5 recent lockscreen pictures used, as well as a `Browse` button
    for you to choose photos from your files. Choosing `Slideshow` would make a slideshow
    of pictures as your lockscreen. You can also choose `Screen Timeout`, and more
    `Screen Saver Settings`, as well.


    `Themes` would help you choose which theme you’d like to use. Go to `Classic Theme
    Settings` > `Related Settings` to do this.


    `Start` helps you turn applications and notifications on or off—and more. You’d
    learn more about this in the next chapter.


    ## Update and Restore


    And of course, you also have the `Update and Restore` tab, which works something
    like this:


    `Activation` is about the version of Windows that you have, and gives you the
    chance to change `Product Key`.


    `Advanced Options` would give you more Update settings to choose from.


    `Backup` gives you the chance to backup your settings.


    Click `Check for Updates` so you could check for updates manually.


    `For Developers` is all about making apps and programs while on Windows 10.


    `Recovery` contains options that you can use to fix your computer, which are:
    `Reset PC`, `Go back to Earlier Build`, and `Advanced Startup`.


    The tab named `Windows Update` contains everything you’d ever need to update Windows.


    `Windows Defender`, meanwhile, is your cloud protection system.


    # Chapter 4: Understanding Interface


    In this chapter, you’ll learn more ways to enjoy Windows 10—and it’s mostly about
    knowing how to work with its interface!


    ## Using Quick Access


    A lot of people say that `Quick Access` makes Windows 10 a whole lot more manageable—and
    there is a lot of truth to that. You can learn more about it below:


    To add a file to `Quick Access`, just navigate towards the file you want to add,
    and then simply click `Add to Quick Access`.


    To remove a file from `Quick Access`, go to the file and click `Unpin from Quick
    Access`.


    To remove recently used files and frequently used folders from `Quick Access`,
    just go to `View` > `Options` > `Privacy`. Then, uncheck the boxes that say `Show
    Recently Used Files`. Click `Clear` > `Clear Explorer History`.


    To change the way File Explorer opens, just click `View` > `Options` > `This PC`.


    ## Using Snap Assist


    This is a feature that is exclusive for Windows 10! This helps you snap a window
    to a certain side of the screen so you won’t spend lots of time moving it.


    To snap a window with the mouse, click on its title and drag it towards the side
    of the screen. You will then see an outline that will show you where the window
    would appear once you have dragged it.


    To snap with the keyboard, just press `Windows Key` + `Left Arrow` (or `Right
    Arrow`).


    To snap to one of the quadrants, just press `Windows Key` + `Up Arrow` (or `Down
    Arrow`), and then move it around by pressing `Windows Key` and arrow keys together.


    ## Using Multiple Desktops


    Yes, you can make use of multiple “desktops” while using Windows 10. To make this
    happen, just follow the instructions below:


    Add a desktop by clicking `Task View`. Press `Tab` + `Windows Key` > `New Desktop`.


    Now, you have two virtual desktops. To switch between them, just press `Windows
    Key` + `CTRL` + `Left Arrow` or `Windows Key` + `CTRL` + `Right Arrow`.


    To move windows between desktops, just right click on the window you’d want to
    move, then choose where you’d want to move it to.


    To close the desktop, just click `X` or press `Windows Key` + `CTRL` + `F4`.


    ## Hiding System Tray Icon


    To hide the System Tray Icon temporarily, all you have to do is drag and drop
    said icon to the hidden area found under the arrow. However, if you can see all
    of the icons onscreen, just open `Task Manager` (press `CTRL` + `ALT` + `DELETE`)
    and then go ahead and terminate `GWXUX` or `GWX`.


    To hide the System Tray Icon permanently, go to `Control Panel` > `Windows Update`.


    Choose `Installed Updates`—you’ll see this on the left side of the screen.


    Look for the label `Update for Microsoft Windows KB3035583` and remove said update.


    Always skip this update by hiding it from future updates.

