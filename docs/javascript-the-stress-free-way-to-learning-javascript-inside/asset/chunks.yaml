    ### Whitespaces and Line Breaks


    This scripting language ignores tabs, spaces, and newlines inside your programs.
    That means you may use these elements to make your JavaScript codes readable and
    understandable.


    ### Semicolons


    Similar to other computer languages (e.g. `C++`), JavaScript requires you to terminate
    simple statements using a semicolon. However, you won’t have to add a semicolon
    if your statements are entered on separate lines. For instance, the code below
    works fine even if it doesn’t have any semicolon:


    ![](images/00004.jpeg)


    ### The Case-Sensitivity of JavaScript Statements


    This programming language is case-sensitive. For example,“`WORD`,”`Word`,”and`word`
    are treated as three different entities in JavaScript. That means you must be
    consistent with letter capitalization when working on functions, keywords, variables,
    and other identifiers.


    ### JavaScript Comments


    You must remember the following rules when creating a comment in JavaScript:


    * This language ignores all of the text placed between the `//` and the end of
    a line.

    * You may use `/*` and `*/` to create comments. In general, programmers employ
    these symbols when creating multi-line comments.

    * JavaScript also allows you to use `<!—` (i.e. the symbol used in HTML to start
    comments) when writing single-line comments.

    * JavaScript doesn’t recognize `→` (i.e. the symbol used in HTML to end comments).
    You must use `//→` instead.


