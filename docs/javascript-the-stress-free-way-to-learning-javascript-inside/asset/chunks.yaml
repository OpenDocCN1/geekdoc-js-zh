- fmt: "\nMeanwhile, the `Post via email settings` will let you send an email to your\
    \ website with post content. In order to use this setting, you should set up a\
    \ secret e-mail account using a `POP3` access. The last section can be used to\
    \ update services. Once you publish a new post, WordPress will instantly notify\
    \ you of the updates. Be sure to `Save Changes`.\n\n## Media Settings\n\nThe `Media\
    \ Settings` page allows you to set max sizes for images you want to add into the\
    \ post. These settings will allow you to save time if you want images to be of\
    \ the same size, if you want to set default settings for image sizes.\n\nThe option\
    \ for `Uploading files` allows you to choose if you want your uploads to be organized\
    \ into month or year. Make certain to `Save Changes`.\n\n## Discussion Settings\n\
    \nThe `Discussion Settings` allow you to manage the comments and links to your\
    \ posts and pages.\n\nThe first section is the `default article settings`. The\
    \ first setting allows you to manage links you make to other blogs. The second\
    \ setting allows you to manage the trackbacks and ping backs or links back to\
    \ your site. Finally, the third setting allows your site visitors to post comments\
    \ on new articles. You can uncheck this box if you don’t want your visitors to\
    \ comment on the posts.\n\nThe `Other comment settings` allows you to choose the\
    \ guidelines for how visitors post comments and how you manage their comments.\n\
    \nFor the `email me whenever` section, you can select to be notified via email\
    \ if someone posts a comment or if a comment has been handled by a moderator.\n\
    \nThe section for `Before a comment appears` will allow you to manage the published\
    \ comments. Through this, you can select if an administrator should approve the\
    \ comments first or if the comments could be published automatically.\n\nIn the\
    \ section for `Comment Moderation`, you can change how a comment is managed depending\
    \ on the number of links. Inside the box, you can include `IPs`, `emails`, `names`,\
    \ `words`, and `URLs` to filter comments for moderation. This feature alongside\
    \ the comment blacklist are can help you in defending your blog against comments\
    \ that are inappropriate and spammy.\n\nThere is also the `Avatar` setting. You\
    \ can enable the avatars of users who posted comments on your website, select\
    \ a default avatar for users who don’t have their own avatar yet, or filter their\
    \ comments based on their ratings.\n\nAgain, be sure to `Save changes`.\n\n##\
    \ Permalink Settings\n\nPermalinks refer to the permanent URLs to each age and\
    \ blog post including tag and category archives. In general, a permalink is the\
    \ web address that can be used to link to your content. It got its name by combining\
    \ permanent and link. Hence, permalink.\n\nThe `Permalink settings` in WordPress\
    \ allows you to manage the default structure of your permalinks. You can either\
    \ select from common settings or build your customized URL. As a default, WordPress\
    \ utilizes URLs that have question marks and with numbers. You may want to change\
    \ the permalinks here to improve its forward compatibility, usability, and aesthetics.\n\
    \n## Week 1 Day 6 – Create a WordPress Post\n\nTo create your first post, find\
    \ the `Posts` menu in the left side of the `Dashboard`. You can click to expand\
    \ it to access the submenu or just hover over the link `Posts`.\n\nIn the `+ New`\
    \ link in the `Admin Bar`, you can also find the `Add New Posts` page. Just click\
    \ the link for the `Add New` to access the `Add New Post` page so you can start\
    \ creating your first WordPress post.\n\nYou can enter the title of your post\
    \ in the first box.\n\nBelow that is the `post editor` or `Post formatting` section,\
    \ where you will type or paste the post content. There are two tabs on the right\
    \ side of the tabs showing two modes of post editing: `Text` and `Visual`.\n\n\
    The `Text` tab will let you access a plain-text HTML version of the post editor.\
    \ You can use this mode to edit the HTML code of your post. If you are not comfortable\
    \ with HTML, the visual mode is recommended.\n\nThe `Visual` tab is ideal for\
    \ developers who are comfortable with the `WYSIWYG` (What You See Is What You\
    \ Get) concept. It comes with a format toolbar with different options to format\
    \ your posts. Many of these icons will look familiar if you have been using Microsoft\
    \ Word.\n\nThe `Publish` box is located at the top of the right column of the\
    \ screen. You can save your post as a draft if you want to save it. The `Preview`\
    \ button will allow you to take a glimpse of how the post will actually look once\
    \ you publish it. The `Status` will let you know if the post is currently a draft,\
    \ has been saved, already published or if it is a pending review if you have schedule\
    \ the post.\n\nThe succeeding links allows you to see the post’s visibility or\
    \ what will the site visitors see. The `Publish` line shows if the post will be\
    \ immediately published or at a future date. The next section are for `tags` and\
    \ `categories` assigned to your post. Save this lesson later.\n\nIf you want to\
    \ change the screen options for your editor, you can click the `screen options`\
    \ tab found in the upper right. This will expand the link and you will see the\
    \ options, which will be displayed on the screen’s post editor.\n\nIn the post\
    \ editor, you can just drag or drop the arrangement of these boxes, to change\
    \ how you want them to appear on the page.\n\nIf you need help in adding new posts,\
    \ you can just click the `Help` tab found in the upper right. From here, you can\
    \ easily refer on inserting media, using the editor, helpful tips for adding a\
    \ post title, and pointers on customizing your post display.\n\n## Week 1 Day\
    \ 7 – Adding Links and Images\n\nLinks are important for the SEO of your content,\
    \ while images are ideal to improve the appeal and readability of your posts.\
    \ WordPress makes it easy to add these two elements into your website.\n\n###\
    \ Adding Links\n\nIn the page editor or WordPress post, choose and highlight the\
    \ text, which you want to be added with link. Then, click the hyperlink button\
    \ located in the toolbar. This will reveal a box that you can use to enter the\
    \ specific `URL` of the hyperlink as well as the title which will be shown if\
    \ you hover over the link.\n\nIf you prefer linking to an existing content on\
    \ your site, you can just click to expand this section. With this, you can see\
    \ a search bar to search your website, as well as a list of present pages or posts.\
    \ Choosing one of the items on the list will also change the hyperlink. If your\
    \ hyperlink is ready, just click the `Add Link` button. Your chosen text will\
    \ now have a link. If you want to remove the link, choose the text again and choose\
    \ the `unlink` button. You will see that the link has been removed and the text\
    \ is in normal display again.\n\n### Adding Images\n\nChoose the best place in\
    \ the post to insert your image. On the upper section of the Post editor toolbar,\
    \ you will see the button `Add Media`. Click this button to reveal the `Insert\
    \ Media` box.\n\nWordPress stores a media library to keep all your media files\
    \ such as videos and images. In this box, you can select to either upload a new\
    \ file or use a present file from the media library. If you want to upload an\
    \ image, click the button `Select files` and find the image you want to use.\n\
    \nAfter your image has been uploaded, you will notice that it has been added to\
    \ the media library. On the right area of the box, you will see the attachment\
    \ details for the page. In this section, you can see the `Description`, `Alt text`,\
    \ `Caption` and `Title`. You can also select the image alignment such as `right`,\
    \ `left`, or `center`. \n\nEnsure that the image has a checkbox. Click the `insert\
    \ into post` button. Now you can see that your image has been inserted into your\
    \ post.\n\nOnce you click the image, you will see two boxes in the upper section\
    \ of the image. The first is the image icon. When you click this icon, you will\
    \ see that another box will appear where you can edit all the image details. In\
    \ this prompt, you can modify the image size based on the percentages or you can\
    \ change the link `URL`, `caption`, `alt text`, and `title`. You can also choose\
    \ the image link or to link the actual file of the image.\n"
  raw: 'Meanwhile, thePost via email settingswill let you send an email to your website
    with post content. In order to use this setting, you should set up a secret e-mail
    account using a POP3 access. The last section can be used to update services.
    Once you publish a new post, WordPress will instantly notify you of the updates.
    Be sure toSave Changes.


    Media Settings


    The Media Settings page allows you to set max sizes for images you want to add
    into the post. These settings will allow you to save time if you want images to
    be of the same size, if you want to set default settings for image sizes.


    The option forUploading filesallows you to choose if you want your uploads to
    be organized into month or year. Make certain toSave Changes.


    Discussion Settings


    TheDiscussion Settings allow you to manage the comments and links to your posts
    and pages.


    The first section is thedefault article settings. The first setting allows you
    to manage links you make to other blogs. The second setting allows you to manage
    the trackbacks and ping backs or links back to your site. Finally, the third setting
    allows your site visitors to post comments on new articles. You can uncheck this
    box if you don’t want your visitors to comment on the posts.


    TheOther comment settingsallows you to choose the guidelines for how visitors
    post comments and how you manage their comments.


    For theemail me whenever section, you can select to be notified via email if someone
    posts a comment or if a comment has been handled by a moderator.


    The section forBefore a comment appearswill allow you to manage the published
    comments. Through this, you can select if an administrator should approve the
    comments first or if the comments could be published automatically.


    In the section forComment Moderation,you can change how a comment is managed depending
    on the number of links. Inside the box, you can include IPs, emails, names, words,
    and URLs to filter comments for moderation. This feature alongside the comment
    blacklist are can help you in defending your blog against comments that are inappropriate
    and spammy.


    There is also theAvatar setting. You can enable the avatars of users who posted
    comments on your website, select a default avatar for users who don’t have their
    own avatar yet, or filter their comments based on their ratings.


    Again, be sure toSave changes.


    Permalink Settings


    Permalinks refer to the permanent URLs to each age and blog post including tag
    and category archives. In general, a permalink is the web address that can be
    used to link to your content. It got its name by combining permanent and link.
    Hence, permalink.


    The Permalink settings in WordPress allows you to manage the default structure
    of your permalinks. You can either select from common settings or build your customized
    URL. As a default, WordPress utilizes URLs that have question marks and with numbers.
    You may want to change the permalinks here to improve its forward compatibility,
    usability, and aesthetics.


    Week 1 Day 6 –Create a WordPress Post


    To create your first post, find thePosts menu in the left side of the Dashboard.
    You can click to expand it to access the submenu or just hover over the link Posts.


    In the+ Newlink in the Admin Bar, you can also find theAdd New Posts page. Just
    click the link for theAdd Newto access the Add New Post page so you can start
    creating your first WordPress post.


    You can enter the title of your post in the first box.


    Below that is thepost editor or Post formatting section, where you will type or
    paste the post content. There are two tabs on the right side of the tabs showing
    two modes of post editing:TextandVisual.


    TheText tab will let you access a plain-text HTML version of the post editor.
    You can use this mode to edit the HTML code of your post. If you are not comfortable
    with HTML, the visual mode is recommended.


    TheVisual tab is ideal for developers who are comfortable with the WYSIWYG (What
    You See Is What You Get) concept. It comes with a format toolbar with different
    options to format your posts. Many of these icons will look familiar if you have
    been using Microsoft Word.


    ThePublishbox is located at the top of the right column of the screen. You can
    save your post as a draft if you want to save it. ThePreview button will allow
    you to take a glimpse of how the post will actually look once you publish it.
    The Status will let you know if the post is currently a draft, has been saved,
    already published or if it is a pending review if you have schedule the post.


    The succeeding links allows you to see the post’s visibility or what will the
    site visitors see. The Publish line shows if the post will be immediately published
    or at a future date. The next section are fortagsandcategoriesassigned to your
    post. Save this lesson later.


    If you want to change the screen options for your editor, you can click the screen
    options tab found in the upper right. This will expand the link and you will see
    the options, which will be displayed on the screen’s post editor.


    In the post editor, you can just drag or drop the arrangement of these boxes,
    to change how you want them to appear on the page.


    If you need help in adding new posts, you can just click the Help tab found in
    the upper right. From here, you can easily refer on inserting media, using the
    editor, helpful tips for adding a post title, and pointers on customizing your
    post display.


    Week 1 Day 7 – Adding Links and Images


    Links are important for the SEO of your content, while images are ideal to improve
    the appeal and readability of your posts. WordPress makes it easy to add these
    two elements into your website.


    Adding Links


    In the page editor or WordPress post, choose and highlight the text, which you
    want to be added with link. Then, click the hyperlink button located in the toolbar.
    This will reveal a box that you can use to enter the specific URL of the hyperlink
    as well as the title which will be shown if you hover over the link. Clicking
    this checkbox will also allow you to access the link in the new tab.


    If you prefer linking to an existing content on your site, you can just click
    to expand this section. With this, you can see a search bar to search your website,
    as well as a list of present pages or posts.


    Choosing one of the items on the list will also change the hyperlink. If your
    hyperlink is ready, just click theAdd Link button. Your chosen text will now have
    a link. If you want to remove the link, choose the text again and choose the unlink
    button. You will see that the link has been removed and the text is in normal
    display again.


    Adding Images


    Choose the best place in the post to insert your image. On the upper section of
    the Post editor toolbar, you will see the buttonAdd Media. Click this button to
    reveal theInsert Media box.


    WordPress stores a media library to keep all your media files such as videos and
    images. In this box, you can select to either upload a new file or use a present
    file from the media library. If you want to upload an image, click the buttonSelect
    files and find the image you want to use.


    After your image has been uploaded, you will notice that it has been added to
    the media library. On the right area of the box, you will see the attachment details
    for the page. In this section, you can see theDescription,Alt text,CaptionandTitle.
    You can also select the imagealignmentsuch asright,left, orcenter. 


    Ensure that the image has a checkbox. Click theinsert into post button. Now you
    can see that your image has been inserted into your post.


    Once you click the image, you will see two boxes in the upper section of the image.
    The first is the image icon. When you click this icon, you will see that another
    box will appear where you can edit all the image details. In this prompt, you
    can modify the image size based on the percentages or you can change the link
    URL, caption, alt text, and title. You can also choose the image link or to link
    the actual file of the image.'
