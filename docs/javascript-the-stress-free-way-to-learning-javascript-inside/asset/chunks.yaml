    Boolean values. Because of that, they are known as “logical operators.”


    a) and


    The && symbol represents “and.” This operator is binary. Additionally, it provides
    a “true” result ONLY IF the two values you are working on are both true. Here
    are some examples:


    ![](images/00040.jpeg)


    b) or


    You should use the “||” symbol to if you want to use the “or” operator. “Or” will
    give you a “true” result if one of the values you are working on is true. Check
    the image below:


    ![](images/00041.jpeg)


    c)  not'
