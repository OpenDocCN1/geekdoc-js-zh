- fmt: "\n# Windows Key + CTRL + D (Create new virtual desktop)\n\n## Speeding Up\
    \ Windows 10\n\nTo create faster setup, just go to the Search Field, type `netplwiz`\
    \ and press Enter.\n\nOnce you see the label `Users must enter a username and\
    \ password to use this computer`, look for the box next to it, and unclick it.\n\
    \nTo get a faster Start Menu, go to the Search Field, type `sysdm.cpl`, and press\
    \ Enter.\n\nClick `Advanced` > `Settings`.\n\nUncheck `Activate Windows when Minimizing\
    \ and Maximizing`.\n\nClick `Apply`.\n\nNow, to shut the computer down faster,\
    \ just right click on the desktop, click `New` > `Shortcut`, and then type the\
    \ following in the location field: `%windir%\\system32\\shutdown.exe/s/t/0`\n\n\
    ## Maximizing Windows 10 Use\n\nMake sure to minimize all windows except for the\
    \ one that you’re using. This will speed up the process and make sure the computer\
    \ would not lag!\n\nPin the Recycle Bin to the Start Menu—just like the old times!\n\
    \nUse the `Alt` Key to quickly open the `Properties Menu`.\n\nSpeed through the\
    \ Start Menu by clicking `All Apps` and then clicking on the numbers and letters\
    \ you see.\n\nTo scroll on the background, just click `Settings` > `Devices` >\
    \ `Mouse` and `Touchpad` > `Scroll Inactive Windows when I hover at them`.\n\n\
    ## Chapter 7: FAQs\n\nFinally, here are frequently asked questions about Windows\
    \ 10—answered for your convenience!\n\n**Q: When was Windows 10 Launched?**\n\n\
    **A:** Windows 10 was officially launched in July 28, 2015. This makes it FREE\
    \ for one year for those whose operating systems are Windows 7 or 8. If after\
    \ a year you have not upgraded to Windows 10 and decide that you want to, you’d\
    \ have to pay $119 for Windows 10, and $199 for Windows 10 Pro.\n\n**Q: Where\
    \ can you get Windows 10 Apps?**\n\n**A:** Microsoft believes that you can buy\
    \ from the Windows Store once and then these universal apps would work on all\
    \ of the gadgets that you have synched with your account. Even Microsoft Office\
    \ will work—so you’d basically be able to live a life of convenience!\n\n**Q:\
    \ Can it work with laptops or Windows Phones?**\n\n**A:** Windows 10 can be the\
    \ sole OS for your desktop/laptop computer, Windows Phone, and Tablet. This is\
    \ because of Continuum, the said driving force that makes Windows 10 work—and\
    \ which makes it easy to operate whether by using mouse, keyboard, or touchscreen.\
    \ There are finger-friendly fullscreen apps that you could download and use, too!\n\
    \n**Q: What if I don’t want the apps to take all of the screen space, or what\
    \ if I want to re-arrange them?**\n\n**A:** The great thing about Windows 10 is\
    \ that fullscreen apps are optional—so if you feel like your device is not compatible\
    \ with them, you can opt not to download them. Since we now have Continuum, you\
    \ can expect that the apps will work on the gadget you want it to work on—and\
    \ that it will take its shape so you would not have a hard time to adjust.\n\n\
    The Start Menu is also reminiscent of the good old days and is not as confusing\
    \ as the one from Windows 8 (which a lot of people hated). Plus, as you may have\
    \ learned earlier, this new start menu makes use of Live Tiles that you can customize\
    \ for your own benefit and preferences—making Windows 10 the best operating system\
    \ you could have.\n\nYou can also arrange apps side by side, thanks to what is\
    \ called Snap. This is what the quadrants are for, and as you can see, you’ve\
    \ been given commands that you can use to make it work. The great thing is that\
    \ this supports multiple virtual desktops, so if you multitask a lot, or have\
    \ lots of things to address, this will certainly be helpful for you!\n\n**Q: Do\
    \ I have to use Windows Explorer? Or can I use other web browsers instead?**\n\
    \n**A:** Internet Explorer, while still part of the Microsoft Brand, is no longer\
    \ the main browser used—so you can breathe a sigh of relief, especially if you’ve\
    \ found it to be extremely slow in the past. Now, you’ll be able to use Microsoft\
    \ Edge (as you have been told earlier), which has lots of new functions and extensions\
    \ that will deliver a great experience for you.\n\nMicrosoft Edge also comes with\
    \ Cortana, your very own virtual assistant that will provide suggestions about\
    \ what to put in the address bar, or gather information about the restaurant you\
    \ want to visit, or tell you about latest promos and the like. This way, you’ll\
    \ always be informed—and will never get bored anymore!\n\n**Q: Is this really\
    \ better than Vista? Or should I just stick to Windows 7 or 8 instead?**\n\n**A:**\
    \ Well, Windows 10 is definitely better than Vista as it does not lag like that\
    \ and works on more computers, and also has a lot of upgrades from Windows 7 and\
    \ 8. Some users have said their laptops’ batteries have been draining ever since\
    \ they used Windows 10, but noticed that when they charge their laptops better,\
    \ then it does not happen.\n\nIn short, it would still be best to make an upgrade\
    \ because sooner or later, apps in Windows 7 or 8 might be phased out, and Windows\
    \ 10 really works faster, and works in a sleek, professional manner, too!\n\n\
    # Wordpress Bootcamp\n\n## Learn the Basics of Wordpress in Two Weeks\n\nMore\
    \ Free and Bargain Books at [KindleBookSpot.com](http://KindleBookSpot.com)\n\n\
    ## Table of Contents\n\n- Introduction\n- Chapter 1 - Why Learn WordPress?\n-\
    \ Chapter 2 - First Week: Setup, Dashboard, Admin Bar, Settings, Links and Images\n\
    \    - Week 1 Day 1 - Learn Initial Setup\n    - Week 1 Day 2 - Dashboard Basics\n\
    \    - Week 1 Day 3 - Admin Bar\n    - Week 1 Day 4 and 5 - Explore WordPress\
    \ Settings\n    - Week 1 Day 6 - Create a WordPress Post\n    - Week 1 Day 7 -\
    \ Adding Links & Images\n- Chapter 3 - Second Week: Categories, Tags, Pages, Templates,\
    \ Plug-ins, Themes, and more\n    - Week 2 Day 1 - Categories & Tags\n    - Week\
    \ 2 Day 2 - Create a WordPress Page\n    - Week 2 Day 3 - Applying a WordPress\
