  trans: "\n\n# 蒙提蟒飞行戏 (Monty Python’s Flying Circus)\n\n执行脚本的另一种方法是修改 `.py` 文件，例如：\n\
    \n```python\n#! /usr /bin /python\n\nprint“Monty Python’s Flying Circus”;\n```\n\
    \n如果你这样运行它：\n\n```bash\n$ chmod + x test.py\n$ ./test.py\n```\n\n你将得到以下输出：\n\n\
    ```\nMonty Python’s Flying Circus\n```\n\n## 标识符\n\n标识符基本上用于确定函数、变量、模块、类以及任何其他对象。它以下划线\
    \ `_` 或字母开头，随后跟随数字、下划线、或其他字母。作为程序员，你可以随意使用任何字母或数字。你可以使用大写和小写字母。\n\n然而，你不能在标识符中使用标点和特殊字符，例如\
    \ `@`、`$` 和 `%`。此外，Python 是一种大小敏感的编程语言。这意味着在代码中使用大写写字母时必须小心。例如，`wendy`、`Wendy`\
    \ 和 `WENDY` 是相同的名称，但在 Python 中被视为三个不同的标识符。\n\n### Python 标识符规则\n\n在编写 Python 程序时，你必须遵守以下规则：\n\
    \n*   类名必须始终以大写字母开头，而其他标识符必须以小写字母开头。\n*   如果标识符以单个前下划线开头，它是私有的。\n*   如果标识符以双前下划线开头，它是强私有的。\n\
    *   如果标识符以双后下划线结尾，它是语言定义的特殊名称。\n\n### 保留字\n\n请注意，在 Python 中某些单词不能作为常量、标识符名称或变量。所有关键字都使用小写字母编写。以下是该编程语言的保留字表：\n\
    \n| And | Assert | Break | Class | Continue |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n| `def` | `del` | `elif` | `else` | `except` |\n| `exec` | `finally` | `for`\
    \ | `from` | `global` |\n| `if` | `import` | `in` | `is` | `lambda` |\n| `Not`\
    \ | `or` | `pass` | `print` | `raise` |\n| `return` | `try` | `while` | `with`\
    \ | `yield` |\n\n## 缩进与行\n\nPython 中没有使用花括号来表示类定义和函数的代码块。同样，流程控制也不包含其中。如果你想标记此类代码块，必须使用行缩进。你可以对空格进行调整，但要确保对块中的所有语句都进行缩进。为了帮助你进一步理解，请考虑以下示例代码：\n\
    \n```python\nif True:\n    print“Correct”\nelse:\n    print“Incorrect”\n\nif True\n\
    \    print“Input”\n    print“Correct”\nelse:\n    print“Input”\n    print“False\n\
    ```\n\n运行第一个示例会生成输出。然而，运行第二个会导致错误。为什么会发生这种情况呢？你必须记住，在 Python 中，块是通过对具有相同数量空间的连续行进行缩进形成的。\n\
    \n缩进只是分组语句的一种方式。程序员用它来代替代码块的花括号。支持制表符（Tabs）和空格，但标准缩进要求标准代码具有相似数量的空格。通常使用四个空格。看下面的示例：\n\
    \n```python\nw = 1\n\nif w == 1 :\n    # 这显示了正好四个空格的缩进\n    print“ w is 1 .“\n\
    ```\n\n### 缩进误言\n\n关于 Python 缩进存在某些误言。以下是其中一些：\n\n*   每份源代码中必须有空白。\n    实际上，你不需要在所有的源代码中使用空白。空白并不一定具有重要意义，尽管缩进是。正如你所学到的，缩进是语句最左侧的空白。在其他任何地方，空白并不那么重要，可以省略。你可以以你喜欢的任何方式使用它，甚至在程序的任何地方插入任意的空白或不包含任何内容的空行。\n\
    *   此外，缩进的精确数量并不真正重要，但嵌套块的相对缩进才重要。当你使用隐式或显式的延续行时，缩进级别实际上并不会被识别。例如，你可以将一个列表跨越多行。这里的缩进完全不重要。看下面的示例：\n\
    \n```python\nfoo = [\n    ‘ a string ‘ ,\n    ‘ another string ‘ ,\n    ‘ a short\
    \ string ‘ ,\n]\n```\n\n"
- fmt: "\nThe parsing is actually simple and well defined. In general, the changes\
    \ to the level of indentation are inserted as tokens into the stream. The indentation\
    \ levels are stored using a stack from the lexical analyzer or tokenizer. At first,\
    \ the stack only has a value of `0`, which is found at the leftmost part.\n\n\
    Each time a nested block starts, a new level of indentation gets pushed on the\
    \ stack. The indent token is then inserted into the stream, which is eventually\
    \ passed on to the parser. It is not possible to have more than a single indent\
    \ token in succession.\n\nIn the event that a line is seen with a smaller level\
    \ of indentation, the values start popping from the stack until one of them gets\
    \ on top. This is equivalent to the new level of indentation. In case there is\
    \ nothing found, a syntax error is generated. For ever value popped, there is\
    \ a dedent token. It is possible to have multiple dedent tokens in succession.\
    \ At the end of every source code, there are dedent tokens generated for the level\
    \ of indentation that is left at the stack. This continues to occur until there\
    \ is `0` left.\n\n## Multiline Statements\n\nWhen you end a statement, you can\
    \ either use a new line or a continuation symbol (`\\`) if you want to indicate\
    \ that the line needs to continue. To help you understand this concept further,\
    \ consider the following example:\n\n```\ntotal = first_item + \\\n          \
    \  second_item + \\\n            third_item\n```\n\nThere is no need for you to\
    \ use the continuation symbol when you write statements that are contained within\
    \ brackets, such as `{ }`, `( )`, and `[ ]`. For instance, if you wish to display\
    \ the months in a year, you may simply write:\n\n```\nyear = [‘January’ ,‘February’\
    \ ,‘March’ ,‘April’ ,‘May’ ,‘June’ ,‘July’ ,‘August’ ,‘September’ ,‘October’ ,‘November’\
    \ ,‘December’ ]\n```\n\nYou are allowed to write multiple statements on a single\
    \ line or create multiple groups as suites. When it comes to writing multiple\
    \ statements, keep in mind that the inclusion of the semicolon (`;`) is crucial.\
    \ The semicolon allows you to write as many statements as possible, as long as\
    \ they do not start a new block of code. Consider the following example:\n\n```\n\
    import sys ; y =‘bar’ ; sys.stdout.write ( y +‘ \\n’ )\n```\n\nSo what are suites\
    \ exactly? Well, they are groups of statements that consist of blocks of code.\
    \ Compound or complex statements, such as `if`, `while`, `def`, and `class` require\
    \ a suite and a header line.\n\nSo what are header lines? They begin statements\
    \ with a keyword and end them with a colon (`:`). Also, they are followed by one\
    \ or more lines that make up a suite. Consider the following example:\n\n```python\n\
    if expression :\n    suite\nelif expression :\n    suite\nelse :\n    suite\n\
    ```\n\n## Quotation\n\nAs a programmer, you are allowed to use a single quote\
    \ (`’` ), double quote (`“`), and a triple quote (`‘’’` or `“””`) when you denote\
    \ string literals. Then again, see to it that you use the same type of quotes\
    \ at the start and end of your string. Typically, triple quotes are used to span\
    \ strings across multiple lines. Take a look at the following example:\n\n```python\n\
    paragraph =“”” You are reading an example of a paragraph that consists multiple\
    \ lines and sentences. You are an excellent programmer.“””\n```\n\n## Comments\n\
    \nWhen it comes to comments, you should use the hash symbol (`#`) to start them.\
    \ However, this hash symbol should not be within a string literal. Also, the characters\
    \ after it towards the end of the line should be included in the comment. In Python,\
    \ comments are not recognized by the interpreter. To help you understand this\
    \ concept further, take a look at the following example:\n\n```python\n# This\
    \ is the first comment\nprint“ Monty Python’s Flying Circus is a British sketch\
    \ comedy series.” ;\n\n# This is the second comment\n```\n\nIf you run the example\
    \ given above, you will obtain the following output:\n\n`Monty Python’s Flying\
    \ Circus is a British sketch comedy series.`\n\nYou can also write another comment\
    \ after an expression or a statement, such as in the following:\n\n```python\n\
    name =“Wendy” # This is a sample comment\n```\n\nIf you want to comment on multiple\
    \ lines, you may do so as well. For example:\n\n```python\n# This is a sample\
    \ comment.\n# This one is also a comment.\n# This is another comment.\n# This\
    \ comment is written by Wendy.\n```\n\n## Blank Lines\n\nThese lines are not recognized\
    \ in the Python programming language. With this being said, they are pretty much\
    \ like comments. They contain whitespaces and even comments. You have to use empty\
    \ lines to terminate multiline statements in an interactive interpreter session.\n\
    \n# Chapter 3: Data Types\n\nIn Python, input data are sorted according to different\
    \ categories. The primary purpose of sorting is to help programmers like you in\
    \ processing information more efficiently. Such categories function as data storage\
    \ locations that you can access whenever you run the Python platform.\n\n### Variables\n\
    \nVariables contain values that have been specifically allocated to them. If you\
    \ are working on complex codes for applications, you may want to store your information\
    \ in these variables. Do not worry because you can access them anytime you need\
    \ them. You can even use them to ensure that the information you need.\n\n###\
    \ Numeric Types\n\nNumbers in Python are different. Before the program processes\
    \ it, it has to undergo certain data methods.\n\n#### Integers\n\nAll whole numbers\
    \ are integers. Numbers that contain a decimal point are not whole numbers; therefore,\
    \ `3` is a whole number while `3.0` is not. Integers in Python are characterized\
    \ by the `int` type.\n\nTake note that integers have capacity limitations. You\
    \ will generate an error if you try to process a value beyond the allowed limits.\
    \ Integers typically process numbers between `-9,223,372,036,854,775,808` and\
    \ `9,223,372,036,854,775,807`.\n\nThere are interesting features that come with\
    \ the `int` variable. For instance, base 2 only uses `0` and `1`, base 8 uses\
    \ numbers from `0` to `7`, base 10 has similar properties with the decimal system\
    \ and base 16 uses the letters `A` to `F` and the numbers `0` to `9`.\n\n####\
    \ Floating Point Values\n\nAny number that contains a decimal point is considered\
    \ as floating point value in Python. It does not matter if the number after the\
    \ decimal point is `0` or not. `3.0`, `1.5`, and `11.4`, for example, are all\
    \ floating point values. They are stored in the `float` data type. One huge advantage\
    \ of floating point values over integers is that they have bigger storage spaces;\
    \ hence, they are capable of storing very small or large values.\n\nThen again,\
    \ you should not think that they have unlimited storage space. There is still\
    \ a limitation. Nevertheless, they can contain as little as `±2.2250738585072014e-308`\
    \ and as much as `1.7976931348623157e+308`. There are a couple of ways to allocate\
    \ values with the use of floating point values. First, you can directly assign\
    \ them. Second, you can use a scientific notation. Keep in mind that negative\
    \ exponents produce fraction equivalents.\n\n#### Complex Numbers\n\nThese numbers\
    \ consist of real numbers and imaginary numbers combined. Usually, they are used\
    \ in dynamic systems, quantum mechanics, computer graphics, electrical engineering\
    \ and fluid dynamics. Complex numbers can be processed in Python and a few other\
    \ programming languages.\n\n#### Boolean Values\n\nThese are the two constant\
    \ objects `True` and `False`. They represent truth values. When used in a numeric\
    \ context, they function as `0` and `1`. You can use the function `bool()` to\
    \ assign a value to a Boolean if such value may be interpreted as a truth value.\n\
    \n#### Strings\n\nThey are groups of characters that are connected with double\
    \ quotation marks. Consider the following example:\n"
