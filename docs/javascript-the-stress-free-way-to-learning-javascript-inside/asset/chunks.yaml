  trans: "\n\n# Windows Key + CTRL + D (创建新虚拟桌面)\n\n## 加速 Windows 10\n\n为了实现更快的设置，只需进入搜索框，输入\
    \ `netplwiz` 并按回车。\n\n一旦你看到 `Users must enter a username and password to use this\
    \ computer` 标签，找到旁边的方框并取消勾选。\n\n为了获得更快的开始菜单，进入搜索框，输入 `sysdm.cpl` 并按回车。\n\n点击 `Advanced`\
    \ > `Settings`。\n\n取消勾选 `Activate Windows when Minimizing and Maximizing`。\n\n\
    点击 `Apply`。\n\n现在，为了更快地关闭电脑，只需在桌面上右键点击，点击 `New` > `Shortcut`，然后在位置字段输入以下内容：`%windir%\\\
    system32\\shutdown.exe/s/t/0`\n\n## 最大化 Windows 10 使用\n\n确保除了你正在使用的窗口外，最小化所有窗口。这将提高速度并确保电脑不会卡顿！\n\
    \n将回收站固定到开始菜单——就像回到过去一样！\n\n使用 `Alt` 键快速打开 `Properties Menu`。\n\n通过点击 `All Apps`\
    \ 然后点击你看到的数字和字母来快速浏览开始菜单。\n\n要在背景上进行滚动，只需点击 `Settings` > `Devices` > `Mouse` 和\
    \ `Touchpad` > `Scroll Inactive Windows when I hover at them`。\n\n## 第 7 章：常见问题\n\
    \n最后，这里有一些关于 Windows 10 的常见问题——为了您的方便提供了解答！\n\n**Q：Windows 10 是什么时候发布的？**\n\n\
    **A：** Windows 10 于 2015 年 7 月 28 日正式发布。这使得操作系统为 Windows 7 或 8 的用户可以免费使用一年。如果你在一年后没有升级到\
    \ Windows 10 并决定升级，那么你需要为 Windows 10 支付 $119，为 Windows 10 专业版支付 $199。\n\n**Q：哪里可以\
    \ Windows 10 应用？**\n\n**A：** 微软认为你可以在 Windows Store 购买一次，这些通用应用将可以在你与账户同步的所有设备上运行。甚至\
    \ Microsoft Office 也能运行——你基本上可以过上便利的生活！\n\n**Q：它可以在笔记本电脑或 Windows 手机上运行吗？**\n\n\
    **A：** Windows 10 可以作为你的台式机/笔记本电脑、Windows 手机和平板的唯一操作系统。这是因为有了 Continuum，它是让 Windows\
    \ 10 运行的核心驱动力——让你无论使用鼠标、键盘还是触摸屏都能轻松操作。你还可以下载并使用适合手指操作的全屏应用！**\n\n**Q：如果我不希望应用占据所有屏幕空间，或者如果我想重新排列它们怎么办？**\n\
    \n**A：** Windows 10 的强大之处在于全屏应用是可选的——如果你觉得你的设备与它们不兼容，你可以选择不下载它们。由于我们现在有了 Continuum，你可以预期应用将在你希望运行的设备上工作——并且它会调整形状，这样你不会在调整时感到困难。\n\
    \n开始菜单也让人想起美好的过去，不像 Windows 8 的菜单那样令人困惑（很多人都很讨厌它）。此外，正如你之前学到的，这个新的开始菜单利用动态磁贴，你可以根据自己的需求和偏好进行自定义——这使得\
    \ Windows 10 成为你能拥有的最佳操作系统。\n\n得益于所谓的 Snap 功能，你还可以将应用并排排列。这就是象限区域的作用，正如你所看到的，你被赋予了一些命令可以用来它运行。很棒的一点是它支持多个虚拟桌面，所以如果你经常多任务处理，或者有很多事情要处理，这对你非常有帮助！\n\
    \n**Q：我必须使用 Windows 资源管理器吗？我可以使用其他浏览器吗？**\n\n**A：** Internet Explorer 虽然仍然是微软品牌的一部分，但已不再是主要的浏览器——所以你可以松口气了，特别是如果你以前发现它非常慢。现在，你将能够使用\
    \ Microsoft Edge（正如之前告诉你的），它有许多新功能和扩展，将为你提供极佳的体验。\n\nMicrosoft Edge 还带有 Cortana，你自己的虚拟助手，它将提供关于在地址栏中输入内容的建议，或收集你想访问的餐厅的信息，或者告诉你最新的促销活动等。这样，你将始终掌握信息——而且再也不会无聊了！\n\
    \n**Q：这真的比 Vista 好吗？还是我应该继续使用 Windows 7 或 8？**\n\n**A：** 嗯，Windows 10 绝对比 Vista\
    \ 好，因为它不像那样卡顿，可以在更多电脑上运行，而且相比 Windows 7 和 8 有许多升级。有些用户说自从他们使用 Windows 10 以来，笔记本电脑电池就开始耗电，但他们注意到当给笔记本更好地充电时，这种情况就不会发生。\n\
    \n简而言之，升级仍然是最好的，因为早早晚，Windows 7 或 8 中的应用可能会被淘汰，而 Windows 10 运行确实更快，而且工作方式更加流畅、专业！\n\
