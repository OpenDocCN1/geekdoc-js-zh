    Both functions (i.e. `flat` and `mountain`) can access the `result` variable because
    they are placed within the function that declares that variable. However, they
    can’t access each other’s variables. That means the program environment located
    outside the function cannot access the variables it contains.


    Programmers who have used other languages might think that they can create new
    local environments by enclosing code blocks using curly braces. In JavaScript,
    however, only functions can generate new scopes.


    ## Using Functions as Ordinary Values


    Usually, function variables serve as names for a certain piece of a program. You
    cannot modify existing function variables: once you have defined them, they will
    stop you from performing any future modifications. This characteristic can cause
    confusions regarding names and the functions they refer to.


    Obviously, a function and a variable are two different things. Function values
    can do what typical values can do – you may call and use them for complex expressions.
    You may change the location of a function value, assign it as an argument for
    a function, etc. In the same manner, variables that contain functions are still
    considered as regular variables. That means you can give them new values.


    ## Declarations


    JavaScript offers a quick and easy way to declare functions. You just have to
    start your statements using the keyword `function`. For instance:


    ![](images/00048.jpeg)


    The statement given above is known as a “declaration.” It defines a variable named
    `square` and gives it a certain function. This example is easy to understand.
    However, this method of defining functions has a subtlety:


    ![](images/00049.jpeg)


    The latest example works perfectly, even if the function is declared under the
    code it is assigned to. This code is valid because declarations ignore the top-to-bottom
    statement structure. You can actually move a declaration onto the top of its scope
    so that local codes can access it. This functionality can be useful since it allows
    you to arrange codes in a meaningful way, without having to define all of the
    affected functions.


    ## The Optional Arguments


    The JavaScript language accepts the code given below. You won’t encounter any
    problem while invoking it.


    ```

    alert(“Hi”, “Good Morning”, “How are you?”);

    ```


    Officially, the `alert` function accepts a single argument only. However, it won’t
    complain if you’ll invoke it using the sample code above. It will just accept
    the first argument (i.e. “Hi”) and ignore the rest.


    This programming language is “open-minded” when it comes to the quantity of arguments
    you can assign to your functions. If you’ll assign too many arguments, it will
    accept the valid ones and ignore the others. If your arguments are not enough,
    however, JavaScript will complete your statement by assigning `undefined` to the
    appropriate parameters.


