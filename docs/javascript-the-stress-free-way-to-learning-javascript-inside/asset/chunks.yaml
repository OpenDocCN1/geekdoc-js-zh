    ![](img/00009.jpeg)


    如果你正确输入了代码，打开 HTML 文件将得到：


    ![](img/00010.jpeg)


    ### 在外部文件中放置代码


    在使用 JavaScript 时，你可能会遇到很多需要在不同网页上使用相同代码的情况。重复输入代码可能很无聊且耗时。幸运的是，你可以只需将 JavaScript
    代码保存到外部文件中。然后，只需将该文件链接到需要相同代码的网页即可。


    在使用这种方法时，你应该使用 `<script>` 标签和 `src` 属性。查看下面的示例：


    ![](img/00011.jpeg)


    这种方法要求你在文本文件中编写 JavaScript 代码，并使用 `.js` 作为扩展名保存（例如 example.js）。


