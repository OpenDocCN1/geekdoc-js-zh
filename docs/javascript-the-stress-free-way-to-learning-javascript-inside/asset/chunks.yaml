  raw: 'You must use “!” (i.e. an exclamation mark) to indicate the “not” operator.
    This logical operator is unary:  you can use it on a single value. However, “not”
    is unique in that it reverses the value you’ll assign to it. For example, !false
    will give you true while !true will give you false.


    The Ternary Operator


    This logical operator works on three different values. Known as the conditional
    operator, it requires you to use “?” and “:” in your scripts. The following code
    will show you how to use it:


    ![](images/00042.jpeg)


    The value placed on the left-hand side of the “?” determines which of the remaining
    values will be selected. If it is “true,” the first option is selected. If it
    is false, however, the second option is chosen.


    Undefined Values


    The JavaScript language supports two special values to indicate the lack of a
    useful value. These special values are “undefined” and “null.” Although these
    two are considered as legitimate values, they don’t carry any information.


    Often, if a JavaScript operation cannot generate a useful value, it gives out
    “undefined” just because it is required to generate a value.


    According to experts, the difference between null and undefined is a mistake on
    the part of JavaScript designers. That means these two values are considered equal
    most of the time. If you have to work on these values, just think of them as interchangeable
    elements in your scripts.


    How to Convert Types Automatically


    You probably know that JavaScript accepts any application, even those that perform
    unusual things. The expressions listed below will demonstrate this concept clearly:


    ![](images/00043.jpeg)


    If you will apply an operator to an incorrect value type, JavaScript will automatically
    convert the said value into the proper type. JavaScript performs this function
    using a collection of rules that are sometimes unexpected or undesirable. Programmers
    refer to this automatic process as “type coercion.” Because of this, the null
    in the first line is converted to 0, while the “5” in the next line is converted
    to 5 (i.e. string-to-number conversion). The third line, however, tries to concatenate
    the values using the “+” sign, so the 1 becomes “1” (number-to-string-conversion).


    If you’ll convert a non-number value (“six” or undefined) into a number, you’ll
    get NaN as a result. Applying mathematical operations on a NaN value will produce
    more NaNs, so if you are getting this value in unexpected or undesirable situations,
    check your codes for unwanted type conversions.


    Chapter 3: The Program Structure in JavaScript


    This chapter will teach you “actual programming.” You’ll be using JavaScript commands
    that go beyond the nouns and phrases you’ve used so far. Study this material carefully
    since it will help you master the basics of JavaScript in two weeks.


    Statements and Expressions


    In the previous chapter, you generated new values by applying operators on existing
    values. It seems like value creation is the most important part of JavaScript
    programs. However, it’s just a small part of this powerful language.


    The part of a code that creates a value is known as “expression.” Thus, any value
    that you’ll write literally (e.g. 99 or “ninety-nine”) falls under this category.
    Expressions are still called expressions even if you’ll enclose them in parentheses.
    Also, an expression is still an expression even if you are using unary, binary,
    or ternary operators.


    The paragraph above highlights the advantages of a programming interface that
    is based on language. Expressions act as subsentences in any human language –
    they can hold other expressions inside them. That means you can mix JavaScript
    expressions to state confusing calculations.


    If expressions are equivalent to subsentences, JavaScript statements are equivalent
    to complete sentences. Basically, a JavaScript program is just a collection of
    statements.


    The most basic type of statement is a value followed by a semicolon. Based on
    this principle, we can create this simple program:


    0;


    false;


    In JavaScript, the sample given above is considered as a complete program. It’s
    a worthless one, though. Statements are only useful if they do something that
    affects other things (e.g. showing some characters on the screen, improving the
    programming environment, etc.). The two statements shown above simply create two
    values (i.e. 0 and false). They don’t change or improve anything. If you’ll execute
    this program, you won’t observe anything significant.


    The Variables


    How can JavaScript programs maintain themselves? How do they store things? You
    have seen how to create new values using old ones. However, that process doesn’t
    modify the preexisting values. You also need to use the resulting values immediately
    or they will simply disappear. To capture and hold values, JavaScript offers variables.


    var example = 3 * 3;


    In this example, var (one of the keywords in JavaScript) indicates that the line
    will create a variable. The keyword is followed by the variable’s name and, if
    you want to assign a value immediately, by an “=” sign and your desired expression.


    The statement generates a variable named “example” and uses it to store the product
    of 3 * 3.


    Once you have defined a variable, you can use its name as an ordinary expression
    in your future JavaScript statements. The value that you’ll get from that “expression”
    is identical to the value you assigned while creating it. Check the following
    example:


    var three = 3;


    console.log(three * three);


    // -> 9


    When naming variables, you can use any word that isn’t a keyword (e.g. var). You
    can include numbers in the variable’s name, but you can’t use a number as the
    initial character. For example, programming1 is valid but 1programming isn’t.
    Additionally, you cannot use spaces in naming variables. In terms of special characters,
    you can only use the dollar sign (i.e. $) and the underscore (i.e. _). JavaScript
    doesn’t allow you to use punctuation marks in variable names.


    You may change the value assigned to a variable. In JavaScript, you can simply
    use the “=” sign on any variable to give it a new value.


    var taste = “bitter”;


    console.log(taste);


    // -> bitter


    taste = “sweet”;


    console.log(taste);


    // -> sweet


    In general, you should think of variables as tentacles instead of containers.
    A variable grasps values, it doesn’t contain them. That means multiple variables
    can point to a single value.


    Let’s analyze a simple example. You need to generate a variable to remember the
    amount Johnny owes you. When he pays you $50, you have to assign a new value to
    the existing variable. Check the lines below:


    var JohnnysDebt = 200;


    JohnnysDebt = JohnnysDebt – 50;


    console.log(JohnnysDebt);


    // -> 150


    If you will create a variable without assigning a value, it will be considered
    empty. It will give you “undefined” if you’ll ask for the value it contains.


    JavaScript allows you to include several variables in one var statement. When
    using this functionality, you should separate the variables using commas. Here’s
    an example:


    var three = 3, four = 4;


    console.log(three + four);


    // -> 7


    The Reserved Words in JavaScript


    As discussed earlier, you can’t use keywords when naming your variables.  However,
    there are other words that you can’t use as variable names because JavaScript
    has reserved them for future developments. Here are some of the reserved words
    in this scripting language:


    in, do, let, if, new, try, with, case, void, with, while, false, yield, extends,
    delete, default, const, debugger, class, break, finally, null, private, return,
    import, protected, switch, super, interface, instanceof, throw, implements


    Keep in mind that you can’t use the words given above when defining variables.
    If you’ll forget about this simple rule, you might experience problems when working
    with JavaScript programs.


    JavaScript Environments'
