    # CHAPTER 4


    # # Flow Control with Async.js


    Up to this point, this book has been about using abstractions to manage async
    tasks throughout an application. PubSub, for instance, is an abstraction that
    lets us distribute events from their source to other layers of the application
    (e.g., from the view to the model). Promises are an abstraction that let us represent
    simple tasks with objects that can be combined to represent complex tasks. Together,
    these abstractions go a long way toward helping us solve the problem of callback
    spaghetti.


    There’s still one weak spot in our armor, though: iteration. What do we do when
    we need to perform a series of I/O operations, either in series or in parallel?
    This is such a common problem in the Node world that it has a name: *flow control*
    (also called *control flow*). And the same way that Underscore.js can dramatically
    simplify (synchronous) iterative code, a good flow control library can strip away
    the boilerplate from your async code.


    The most popular of these libraries is Caolan McMahon’s powerful Async.js.<sup>1</sup>
    In fact, as of this writing, Async.js is the third most required library in the
    npm registry,<sup>2</sup> sharing the limelight with superstars like Underscore.js
    and Express.


    In this chapter, we’ll explore what Async.js can do in a Node setting. (Async.js
    can run in the browser, too, but few client-side apps need it.) We’ll also take
    a brief look at an alternative library, Tim Caswell’s sleek Step.<sup>3</sup>


    +   1. https://github.com/caolan/async

    2. https://npmjs.org/

    3. https://github.com/creationix/step'
  - "[PAGE 62]\n\n# Installing Node and Async.js\n\nTo follow along with this chapter,\
    \ grab the latest Node from [http://nodejs.org/](http://nodejs.org/). After installing,\
    \ you should be able to run npm, the Node package manager. Use this command to\
    \ install Async.js and Step:\n\n```\nnpm install -g async step\n```\n\nThen use\
    \ `node file.js` to run any JavaScript file.\n\n# 4.1 The Async Ordering Problem\n\
    \nSuppose we want to read all of the files in the recipes directory, in alphabetical\
    \ order, and then concatenate their contents into a single string and display\
    \ it. We could do this quite easily using synchronous methods.\n\n```\nAsyncjs/synchronous.js\n\
    var fs = require('fs');\nprocess.chdir('recipes'); // change the working directory\n\
    \nvar concatenation = '';\n\nfs.readdirSync('.')\n  .filter(function(filename)\
    \ {\n    // ignore directories\n    return fs.statSync(filename).isFile();\n \
    \ })\n  .forEach(function(filename) {\n    // add contents to our output\n   \
    \ concatenation += fs.readFileSync(filename, 'utf8');\n  });\n\nconsole.log(concatenation);\n\
    ```\n\n(Be aware that the forEach iterator isn't available in older JavaScript\
    \ environments, such as IE6. You can fix this with a library like Kris Kowal's\
    \ es5-shim.[^4] We'll learn how to serve this library to just the browsers that\
    \ need it in [Chapter 6, *Async Script Loading*, on page 69](#).)\n\nBut all this\
    \ blocking is terribly inefficient, particularly if our application could be doing\
    \ something else simultaneously. The problem is that we can't just naïvely replace\n\
    \n```\nconcatenation += fs.readFileSync(filename, 'utf8');\n```\n\nwith its async\
    \ analog\n\n[^4]: [https://github.com/kriskowal/es5-shim/](https://github.com/kriskowal/es5-shim/)"
- md: "## 4.2 Async Collection Methods\n\nbecause there's no guarantee that the readFile\
    \ callbacks would fire in the order that the readFile calls were made in. readFile\
    \ just tells the OS to *start* reading a file. Most likely, shorter files will\
    \ be read more quickly than longer files. As a result, the order in which the\
    \ recipes are added to concatenation would be unpredictable. Plus, we'd have to\
    \ make our console.log line somehow run after all the callbacks have fired.\n\n\
    To use multiple async tasks and get a predictable result, we'll need to do some\
    \ planning.\n\nLet's try to solve this problem without bringing in any utility\
    \ functions. The simplest approach that I can think of is to run each readFile\
    \ from the callback of the previous one, while keeping track of the number of\
    \ callbacks that have fired so far in order to eventually show the output. Here's\
    \ my implementation:\n\n```\nfs.readFile(filename, 'utf8', function(err, contents)\
    \ {\n  if (err) throw err;\n  concatenation += contents;\n});\n```\n\n```\nAsyncjs/seriesByHand.js\n\
    var fs = require('fs');\nprocess.chdir('recipes'); // change the working directory\n\
    var concatenation = '';\n\nfs.readdir('.', function(err, filenames) {\n  if (err)\
    \ throw err;\n\n  function readFileAt(i) {\n    var filename = filenames[i];\n\
    \    fs.stat(filename, function(err, stats) {\n      if (err) throw err;\n   \
    \   if (! stats.isFile()) return readFileAt(i + 1);\n\n      fs.readFile(filename,\
    \ 'utf8', function(err, text) {\n        if (err) throw err;\n        concatenation\
    \ += text;\n        if (i + 1 === filenames.length) {\n          // all files\
    \ read, display the output\n          return console.log(concatenation);\n   \
    \     }\n        readFileAt(i + 1);\n      });\n    });\n  }\n  readFileAt(0);\n\
    });\n```\n\nThis is, as you may have noticed, a lot more code than the synchronous\
    \ version. When we used the synchronous filter and forEach methods, this took\
    \ about half as many lines and reads much more clearly! Wouldn't it be nice if\
    \ we could just drop in async equivalents of those wonderful iteration methods?\
    \ With Async.js, we can do just that!\n\n### When It's OK to Throw\n\nYou might\
    \ have noticed that I ignored my own advice from Section 1.4, Handling Async Errors,\
    \ on page 12 in that last code example. Throwing exceptions from callbacks is\
    \ poor form—in a production environment. However, for a simple example like this,\
    \ throwing exceptions is perfectly fine. In the unlikely event that this code\
    \ goes wrong, a throw will shut it down and give us a nice stacktrace explaining\
    \ why.\n\nThe real crime here is that the same error-handling logic, if (err)\
    \ throw err, is repeated three times! We'll see how Async.js can help us reduce\
    \ that repetition in Error Handling in Async.js, on page 52.\n\n### Functional\
    \ Style with Async.js\n\nWe want to replace the filter and forEach methods we\
    \ used for synchronous iteration with async analogs. Async.js gives us two options.\n\
    \n+   async.filter and async.forEach, which process the given array in parallel\n\
    +   async.filterSeries and async.forEachSeries, which process the given array\
    \ sequentially\n\nRunning our async operations in parallel would be faster, so\
    \ why would we want to use a series method? There are two reasons.\n\n+   The\
    \ aforementioned problem of unpredictable ordering. We might get around this by\
    \ storing our results in an array and then joining it, but that's an extra step.\n\
    +   There's a limit on the number of files that Node (or any application process)\
    \ can try to read simultaneously. If we hit that limit, the OS would give us an\
    \ error. If we read the files sequentially, we don't have to deal with this limitation.\n\
    \nSo, we'll stick to async.forEachSeries for now. Here's a straightforward adaptation\
    \ of our synchronous code to use Async.js's collection methods:\n\n```\nAsyncjs/forEachSeries.js\n\
    var async = require('async');\nvar fs = require('fs');\nprocess.chdir('recipes');\
    \ // change the working directory\n\nvar concatenation = '';\n\nvar dirContents\
    \ = fs.readdirSync('.');\n\nasync.filter(dirContents, isFilename, function(filenames)\
    \ {\n  async.forEachSeries(filenames, readAndConcat, onComplete);\n});\n\nfunction\
    \ isFilename(filename, callback) {\n  fs.stat(filename, function(err, stats) {\n\
    \    if (err) throw err;\n    callback(stats.isFile());\n  });\n}\n\nfunction\
    \ readAndConcat(filename, callback) {\n  fs.readFile(filename, 'utf8', function(err,\
    \ fileContents) {\n    if (err) return callback(err);\n    concatenation += fileContents;\n\
    \    callback();\n  });\n}\n\nfunction onComplete(err) {\n  if (err) throw err;\n\
    \  console.log(concatenation);\n}\n```\n\nNow our code splits up nicely into two\
    \ parts: the overall task (in the form of the async.filter and async.forEachSeries\
    \ calls) and the implementation details (in the form of two iterator functions\
    \ and one final callback).\n\nfilter and forEach aren't the only Async.js utilities\
    \ corresponding to standard functional iteration methods. There are also the following:\n\
    \n- reject/rejectSeries, the inverse of filter\n- map/mapSeries, for 1:1 transformations\n\
    - reduce/reduceRight, for transforming a value at each step\n- detect/detectSeries,\
    \ for finding a value matching a filter\n- sortBy, for generating a sorted copy\n\
    - some, for testing whether at least one value matches the given criterion\n-\
    \ every, for testing whether all values match the given criterion\n\nThese methods\
    \ are the core of Async.js, allowing you to perform common iterations with minimal\
    \ boilerplate. Before we move on to more advanced methods, let's take a look at\
    \ the way these methods deal with errors.\n\nIn our original async code, we had\
    \ three throws. In the Async.js version, we have two, yet all errors will still\
    \ be thrown. How does Async.js do it? And why can't we have just one throw?\n\n\
    Simply put, Async.js follows Node conventions. This means that every I/O callback\
    \ has the form (err, results...)—with the exception of callbacks where the result\
    \ is a boolean. Boolean callbacks just have the form (result), which is why our\
    \ isFilename iterator from the previous code example needs to handle errors on\
    \ its own.\n\n```\nAsyncjs/forEachSeries.js\nfunction isFilename(filename, callback)\
    \ {\n  fs.stat(filename, function(err, stats) {\n    if (err) throw err;\n   \
    \ callback(stats.isFile());\n  });\n}\n```\n\nBlame Node's fs.exists for setting\
    \ this precedent. That means that the iterators for the Async.js collection methods\
    \ (filter, reject, detect, some, every, and their series equivalents) can't report\
    \ errors.\n\nWith all non-boolean Async.js iterators, passing a value other than\
    \ null or undefined as the first argument to the iterator's callback will immediately\
    \ invoke the completion callback with that error. That's why readAndConcat can\
    \ do without throw.\n\n```\nAsyncjs/forEachSeries.js\nfunction readAndConcat(filename,\
    \ callback) {\n  fs.readFile(filename, 'utf8', function(err, fileContents) {\n\
    \    if (err) return callback(err);\n    concatenation += fileContents;\n    callback();\n\
    \  });\n}\n```\n\nSo, if callback(err) does get called from readAndConcat, that\
    \ err will be passed to onComplete. Async.js guarantees that onComplete will be\
    \ called only once, either the first time an error occurs or after all operations\
    \ have finished successfully.\n\n```\nAsyncjs/forEachSeries.js\nfunction onComplete(err)\
    \ {\n  if (err) throw err;\n  console.log(concatenation);\n}\n```\n\nNode's error\
    \ conventions may not ideal for Async.js's collection methods. But for all of\
    \ Async.js's other methods, following these conventions allow errors to flow neatly\
    \ from individual tasks to the completion callback. We'll see more examples of\
    \ this in the next section.\n\n## 4.3 Organizing Tasks with Async.js\n\nAsync.js's\
    \ collection methods solve the problem of applying a single async function to\
    \ a set of data. But what if, instead of a set of data, we have a set of functions?\
    \ In this section, we'll explore some of the powerful tools that Async.js has\
    \ for dispatching async functions and collecting their results.\n\n### Running\
    \ an Async Series\n\nSuppose we have an array of async functions that we want\
    \ to run in order. Without the use of a utility function, we might have to write\
    \ something like this:\n\n```\nfuncs[0](function() {\n  funcs[1](function() {\n\
    \    funcs[2](onComplete);\n  })\n});\n```\n\nFortunately, we have async.series\
    \ and async.waterfall. Each takes an array of functions (the task list) and runs\
    \ them sequentially, passing each one a Node-style callback. The difference between\
    \ the two is that async.series provides only the callback to each task, whereas\
    \ async.waterfall also provides the results from the previous task. (By \"results,\"\
    \ I mean the nonerror values each task passes to its callback.)\n\nLet's look\
    \ at a simple demonstration using timeouts.\n\n```\nAsyncjs/seriesTimers.js\n\
    var async = require ('async');\n\nvar start = new Date;\n\nasync.series([\n  function(callback)\
    \ { setTimeout(callback, 100); },\n  function(callback) { setTimeout(callback,\
    \ 300); },\n  function(callback) { setTimeout(callback, 200); }\n], function(err,\
    \ results) {\n  // show time elapsed since start\n  console.log('Completed in\
    \ ' + (new Date - start) + 'ms');\n});\n```"
  mdcn: "\n## 4.2 异步收集方法\n\n由于无法保证 readFile 回调函数的执行顺序与调用它们的顺序一致，因为 readFile仅仅是告诉操作系统*开始*读取文件。很可能更短的会比更长的文件读得更快作为结果，被添加到\
    \ concatination的食谱的顺序是不可预测的。此外，我们还得想办法让(console.log)行在所有回调函数触发后运行。\n\n要使用多个异步任务并获得可预期的结果，我们需要做某些计划。\n\
    \n让我们尝试在不引入任何实用函数的情况下解决这个问题。我能想到的最简单的方法是从上一个回调中运行每个 readFile 调用，同时跟踪到目前为止已触发的回调数以最终显示输出结果。以下是我的实现：\n\
    \n```\nfs.readFile(filename, 'utf8', function(err, contents) {\n  if (err) throw\
    \ err;\n  concatenation += contents;\n});\n```\n\n```\nAsyncjs/seriesByHand.js\n\
    var fs = require('fs');\nprocess.chdir('recipes'); // 更改工作目录\nvar concatenation\
    \ = '';\n\nfs.readdir('.', function(err, filenames) {\n  if (err) throw err;\n\
    \n  function readFileAt(i) {\n    var filename = filenames[i];\n    fs.stat(filename,\
    \ function(err, stats) {\n      if (err) throw err;\n      if (! stats.isFile())\
    \ return readFileAt(i + 1);\n\n      fs.readFile(filename, 'utf8', function(err,\
    \ text) {\n        if (err) throw err;\n        concatenation += text;\n     \
    \   if (i + 1 === filenames.length) {\n          // 所有文件已读取，显示输出\n          return\
    \ console.log(concatenation);\n        }\n        readFileAt(i + 1);\n      });\n\
    \    });\n  }\n  readFileAt(0);\n});\n```\n\n正如您可能注意到的那样，这比同步版本多了很多代码。当我们使用同步的\
    \ filter和forEach方法时，这需要少一半的代码行并阅读起来清晰得多！如果我们能直接放入那些出色迭代方法的异步对应物就好了吗？利用Async.js，我们可以做到这一点！\n\
    \n### 何时可以抛出异常\n\n您可能会注意到我忽略了自己在第4节中关于在第12页处理异步错误的建议。从回调函数中抛出异常的写法是不规范的——在生产环境中如此。然而对于像这样的简单示例来说，抛出异常是非常可以的。在不太可能发生代码出错的情况下，throw将关闭它并向我们提供一个美好的堆栈跟踪来解释原因。\n\
    \n这里的真正罪过在于相同的错误处理逻辑(if (err) throw err;)重复了三次！我们将看到Async.js如何在异步js中的“错误处理的”章节（第52页）帮助我们要减少这一重复。\n\
    \n### 使用 Async.js的功能风格\n\n我们想要用异步等效方法替换用于同步迭代的 filter和forEach方法。Async.js给出了两个选项：\n\
    \n+   async.filter和async.forEach，它们并行处理给定的数组\n+   async.filterSeries和async forEachSeries，按顺序处理给定数组\n\
    \n以并行方式运行我们的异步操作会更快，那么我们为什么要使用series（系列）方法呢？有两个原因：\n\n+   前述的不可预测排序问题。我们可能会通过将结果存储在数组中然后将其连接起来来解决这个问题，但这是一个额外的步骤\n\
    +   Node(或任何其他应用程序进程)可以尝试同时读取的文件数量有限制如果我们遇到这个限制操作系统将向我们抛出一个错误如果我们要按顺序读取文件，就不必处理这种局限性了\n\
    \n所以我们将坚持使用 async.forEachSeries。以下是我们同步代码的直接改编版本以使用Async.js的收集方法：\n\n```\nAsyncjs/forEachSeries.js\n\
    var async = require('async');\nvar fs = require('fs');\nprocess.chdir('recipes');\
    \ // 更改工作目录\n\nvar concatenation = '';\n\nvar dirContents = fs.readdirSync('.');\n\
    \nasync.filter(dirContents, isFilename, function(filenames) {\n  async.forEachSeries(filenames,\
    \ readAndConcat, onComplete);\n});\n\nfunction isFilename(filename, callback)\
    \ {\n    fs.stat(filename, function(err, stats) {\n      if (err) throw err;\n\
    \      callback(stats.isFile());\n    });} \n\n函数 readAndConcat(function(filename,callback){\n\
    \  fs.readFile(filename,'utf8',function(err,fileContents){    \n    if(err)returnCallbackError(err);\
    \  \n    concatenation+=file contents(); \n    CB(){callback()};   \n```\n\n现在我们的代码分成两部分：总体任务（以async.filter和\
    \ async.forEachSeries调用的形式）和实施细节(两个迭代函数和一个最终回调的形式) filter 和 forEach不是对应标准功能迭代方法的唯一Async.js实用工具还有以下内容:\n\
    \n-   reject/reject，filter的反面。\n    - map/mapSeries用于1:1转换\n    - reduce/reduceRight,在每一步变换一个值\n\
    \    detect/detectSeris,查找与过滤器匹配的值（检测）\n    sortBy生成排序副本\n    some测试至少有一个值是否给的标准符合条件\n\
    \    every 测试所有值是否符合给定标准\n\n这些方法是Async.js的核心，允许你用最少的样板代码执行常见的迭代。在我们转向更高级的方法之前，让我们看看这些方法如何处理错误。\n\
    \n在我们的原始异步代码中，我们有三个 throws（抛出的内容）。在Async.js版本中我们有两个然而所有的错误仍将抛出异常Async. 是这样做的吗？为什么我们不能只做一个抛出呢？\n\
    \n简而言之, Async.js遵循节点约定这意味着每个 I/O回调都是 (err,resutis)——除了那些结果是布尔值的回调。Boolean 回调只有(result),这就是我们的\
    \ isFilename迭代器从前面的代码示例中需要独立处理错误的原因。\n\n```\nAsyncjs/forEachSeries.js.function(isfilename(fnname,callback){\
    \  \nfs.stat(filename,function(err,stats){     \nif(err) throw err;       callback(stats.isFile());\
    \ \n    });}\n    \n```   \n归咎于Node的 fs.exists 为设定这一先例.这意味着 Async.js收集方法的迭代器(filter,reject,detect，\
    \ some,every和他们的串联等效版）无法报告错误。\n\n对于所有非布尔型Async.js 迭代器,传递的值不是null或undefined给到迭代器的回调立即调用完成该异常（错误）。这就是为什么\
    \ readAndConcat可以无需 throw的原因. \n\n```\nAsyncjs/forEachSeries.js   \nfunction read\
    \ And Concat(filename,callback){  \nfs.readFile(filename,'utf8', function(err,fileContents){\
    \        if(err) return Callback(Error);       \nconcatenation+=file conTents,\
    \     \nCB(){Callback()} \n    });}  \n\n\n\n因此，如果 callback(err) 从readAndConcat得到调用该\
    \ err将传递至 onComplete。Async.js保证 onCmplete只会有一次被调用的要么第一次发生错误或所有操作完成后成功完成.\n\n\n\
    ```\nAsyncjs/forEachSeries.js   \nfunctionOnComplete(err){       \nIf(Error）throwerr;\
    \     \nconsole.log(concatenatio);  \n}  \n\nNode的错误约定可能对 Async.js的收集方法不理想。但是对于\
