- md: "# Async JavaScript\n\nBuild More Responsive Apps with Less Code\n\nTrevor Burnham\n\
    \n## Early Praise for *Async JavaScript*\n\n> *Async JavaScript* is the first\
    \ full book I've seen dedicated to a key topic in JavaScript development today:\
    \ how to deal with concurrency and concurrent tasks without going crazy! For the\
    \ sake of your sanity, check this out.\n> \n> **➤ Peter Cooper**, editor of JavaScript\
    \ Weekly\n  \nTrevor delivers a concise guide to writing asynchronous JavaScript\
    \ with a perfect balance of browser and server-side examples. Part guide, part\
    \ overview, wholly engaging, this book is a must-read for any JavaScript developer\
    \ looking to level up.\n\n**➤ Wynn Netherland**, co-host of The Changelog\n\n\
    This is a complete guide to the asynchronous realm of JavaScript. The concepts\
    \ and tools covered by this book are essential to anyone willing to build full-blown,\
    \ well-structured and efficient JavaScript applications.\n\n> **➤ Julien Biezemans**,\
    \ Ruby/JavaScript developer, author of Cucumber.js\n\n## Table of Contents & Copyright\
    \ Information\n\n# ## Async JavaScript  \nBuild More Responsive Apps with Less\
    \ Code  \n\n**Trevor Burnham**  \nThe Pragmatic Bookshelf  \n\n---\n\nMany of\
