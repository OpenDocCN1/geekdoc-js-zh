  md: "If you've worked with DOM events before, you're no doubt familiar with bub-bling.\
    \ Whenever an element emits an event (such as a 'click'), its parent then emits\
    \ the event, then its grandparent, and so on, up to the root element, document—unless\
    \ the event's stopPropagation method is called at some point along the way. (jQuery\
    \ does this for us automatically when we return false from a handler.) But did\
    \ you know that jQuery's custom events bubble as well? For instance, if we have\
    \ a span named \"soda\" nested in a div named \"bottle,\" the code\n\n```\n$('#soda,\
    \ #bottle').on('fizz', function() {\n    console.log(this.id + ' emitted fizz');\n\
    });\n$('#soda').trigger('fizz');\n```\n\nwill emit the following output:\n` <\
    \ soda emitted fizz    bottle emitted fizz \" This bubbling isn't always desirable,\
    \ as we'll see in the following tooltips example. Fortunately, jQuery offers the\
    \ nonbubbling triggerHandler method as well.\n\n# Example: Tooltips\n\nWhen events\
    \ can be mapped intuitively to page elements, jQuery is an ideal way of distributing\
    \ them. For instance, suppose you're writing a tooltip library and you want only\
    \ one tooltip to be visible at a time. You might simply add the line\n\n```\n\
    $('.tooltip').remove();\n```\n\nto the start of the function that adds new tooltips.\
    \ But what if we decide later that we want certain containers to be isolated,\
    \ such as when a new tooltip is shown in the sidebar, tooltips everywhere else\
    \ are unaffected, and vice versa? Writing a selector for \"elements with class\
    \ tooltip that are not descendants of sidebar\" is tricky and not very efficient.\
    \ The problem would get exponentially harder if we decided to allow isolated containers\
    \ to be nested to an arbitrary depth.\n\nBut implementing this behavior with event\
    \ logic rather than selector logic is easy.\n\n```\n// $container could be $('#sidebar')\
    \ or $(document)\n$container.triggerHandler('newTooltip');\n$container.one('newTooltip',\
    \ function() {\n    $tooltip.remove();\n});\n```"
