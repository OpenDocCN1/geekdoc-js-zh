    \ go here -->\n    <script src=\"headScripts.js\"></script>\n    <script defer\
    \ src=\"deferredScripts.js\"></script>\n</head>\n<body>\n    <!-- content goes\
    \ here -->\n</body>\n</html>\n```\n\n+   1. http://caniuse.com/#search=defer"
  - '[PAGE 85]


    Just remember that it’s important to wrap `deferredScripts` so that it won’t run
    until after the document ready event in browsers that don’t support `defer`. If
    the body content is more than a couple of kilobytes, that trade-off is worthwhile.


    # Full Script Parallelization


    If you’re a hardcore every-millisecond-counts page load gearhead, `defer` may
    sound like weak sauce to you. You don’t want to wait until all previous scripts
    with `defer` have run. And you certainly don’t want those scripts to wait to run
    until the document is ready, not when they have to use `$(document).ready` anyway
    for Opera’s sake. You just want to load those scripts *as soon as possible* and
    run them *as soon as possible*.


    That’s why modern browsers offer the `async` attribute.


    ```

    <script async src="speedyGonzales.js"></script>

    <script async src="roadRunner.js"></script>

    ```


    If `defer` makes you think of an orderly queue waiting for the document to load,
    `async` should make you think of anarchy. Those two scripts shown earlier could
    run in any order, and they’ll run as soon as the JavaScript engine is available
    to run them, whether the document is ready or not. So, aside from feeling the
    need for speed, why would you use `async`?


    For most scripts, `async` is a tough sell. It’s not as widely supported as `defer`,
    so fewer users will notice the performance boost.⁵ And because `async` scripts
    can run at any time, it’s all too easy to introduce Heisenbugs that depend on
    when a script happens to finish loading.


    But for scripts that are intended to be independent, `async` is a small but significant
    win. Got a third-party script that adds a feedback widget and another that adds
    a tech support chat box? The page will run fine without them, and it doesn’t matter
    which one runs first. So, you can get a free speed boost by using `async` with
    them.


    > ### Async + Defer = ?


    You might be asking, “What if I use both `defer` and `async` on the same script?”
    The answer is that `async` overrides `defer` in browsers that support both. Since
    `defer` is more widely supported and provides the main benefit of `async`—allowing
    the DOM to render while the script downloads—I recommend using `defer` whenever
    you use `async`.


