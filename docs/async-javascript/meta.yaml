  md: "# Now or Later?\n\nTo begin our exploration of setTimeout, let’s look at a\
    \ simple example of a situation that often mystifies new JavaScripters, especially\
    \ those coming from multithreaded languages like Java and Ruby.\n\n```\nEventModel/loopWithTimeout.js\n\
    for (var i = 1; i <= 3; i++) {\n  setTimeout(function() { console.log(i); }, 0);\n\
    };\n```\n\n4\n4\n4\n\nMost newcomers to the language would expect the loop to\
    \ produce the output 1, 2, 3, or perhaps a juxtaposition of those three numbers\
    \ as the three timeouts (each scheduled to go off in 0 milliseconds) race to fire\
    \ first.\n\nTo understand why the output is 4, 4, 4 instead, there are three things\
    \ you need to know.\n\n+   - There's only one variable named i, scoped by the\
    \ declaration var i (which, incidentally, scopes it not within the loop but within\
    \ the closest function containing the loop).\n\n+   - After the loop, i===4, having\
    \ been incremented until it failed the condition i<=3.\n\n+   - JavaScript event\
    \ handlers don’t run until the thread is free.\n\nThe first two concepts are in\
    \ the realm of JavaScript 101, but the third comes as more of a surprise. When\
    \ I first started using JavaScript, I didn’t quite believe it. Java had trained\
    \ me to fear that my code could be interrupted at any moment. A million potential\
    \ edge cases filled me with anxiety as I wondered, “What if a rare event happened\
    \ between these two lines of code?”\n\nAnd then one day, that burden was lifted\
    \ from me....\n\n# Blocking the Thread\n\nThis piece of code demolished my preconceptions\
    \ about JavaScript events:\n\n```\nEventModel/loopBlockingTimeout.js\nvar start\
