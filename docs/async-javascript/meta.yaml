  md: '# ## Who Is This Book For?


    This book is aimed at intermediate JavaSighters. You should know how variables
    are scoped. Keywords like typeof, arguments, and this shouldn''t faze you. Perhaps
    most importantly, you should understand that


    ```

    func(function(arg) { return next(arg); });

    ```


    is just a needlessly verbose way of writing


    ```

    func(next);

    ```


    except in rare cases. (See Reg Braithwaite''s excellent article "Captain Obvious
    on JavaScript" for more examples of small but important functional idioms.)


    What you *don''t* need to know is how asynchronous events are scheduled in JavaScript.
    We''ll cover that in the next chapter.


    # ## Resources for Learning JavaScript


    As JavaScript has become the *lingua franca* of the Web (not to mention mobile
    devices), a vast number of informative books, courses, and sites devoted to it
    have appeared. Here are a few that I recommend:


    +   - If you''re new to programming altogether, check out the interactive tutorial
    site Codecademy.

    - If you''re coming from another language and want to get up and running with
    JavaScript as a language for scripting the browser, take the interactive jQuery
    Air courses on CodeSchool.

    - If you want a more formal introduction to the JavaScript language, absorb Marijn
    Haverbeke''s *Eloquent JavaScript*.

    - If you''re a JavaScript beginner who wants to level up and avoid common pitfalls,
    spend some time in the JavaScript Garden.


    # ## Where to Turn for Help?


    When pondering questions like "Should I use typeof or instanceof here?" steer
    clear of the dated W3Schools site (which, regrettably, tends to be favored by
    Google searches). Instead, head to the Mozilla Developer Network (MDN).'
  merge: -1
