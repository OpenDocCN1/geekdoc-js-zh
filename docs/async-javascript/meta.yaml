  mdcn: "\n## 附录 1\n\n# 驯服 JavaScript 的工具集\n\n本章是对在同步风格中编写异步 JavaScript 代码的一些更流行的工具的概览。这些工具中没有哪一种是替代对\
    \ JavaScript 事件进行透彻理解的；相反，它们可以通过给您的异步技能库增加一些技巧来补充这种理解。\n\n### A1.1 TameJS\n\n\
    OkCupid团队创造了一个巧妙的预编译器（拥有超过600名 GitHub关注者 (http://tamejs.org/)），它为JavaScript增添了两个关键字：`await`\
    \ 和 `defer`。一个**`await block`**定义了不会返回的代码，直到每个使用**`defer`**定义的异步任务都已完成为止。\n\n\
    ```\nawait {\n    setTimeout(defer(), 100);\n}\nconsole.log(\"this will run after\
    \ the 100ms timeout\");\n```\n\nTameJS团队还创造了一个具有相同**`await/defer`**机制的CoffeeScript分支，名为IcedCoffeeScript\
    \ (http://maxtaco.github.com/coffee-script/)。\n\n### A1.2 StratifiedJS\n\nStratifiedJS\
    \ (http://onilabs.com/stratifiedjs) 是等待/** `await/defer范式 **的一个替代品，它提供了更细粒度的控制结构，并使用了像**`waitfor`**和**`resume`**这样直观的名称。\n\
    \n```\nconsole.log('this code will run right away...');\nwaitfor() {\n    setTimeout(resume,\
    \ 500);\n}\nconsole.log('...and this will run 500ms later.');\n```\n\n虽然并没有被广泛使用，但StratifiedJS是一项雄心勃勃的项目，已经得到了像John\
    \ Resig（jQuery的创建者）¹这样的赞誉。**²**注意：StratifiedJS是规范的名字，而不是实现；官方的参考实现称为Oni Apollo。³\n\
    \n### A1.3 Kaffeine\n\nKaffeine是一个自诩为“扩展 JavaScript.\"⁴的预编译器。除了其他功能外，该语言提供简单句法糖来取消回调嵌套：只需在异步函数名之后添加**!**。Kaffeine假设函数的最后一个参数是回调函数，并简单地将该调用之后的所有代码转换为回调。\n\
    \n例如，在一个jQuery应用程序中，通常希望在$回调内运行所有内容（准备就绪后）。使用Kaffeine可以轻松做到这一点。\n\n```\n$!()\n\
    alert('The document is ready.');\n```\n\n虽然它并没有CoffeeScript那样大的拥护者，但这些功能使得检查Kaffeine非常值得一试。Coco和LiveScript这两个CoffeeScript分支具有类似的功能，将其称为**`backcalls`**。在Coco/LiveScript中，前面的示例将写成这样：\n\
    \n```\n<-$ \nalert 'The document is ready'\n```\n\nKaffeine/Coco/LiveScript的方法提供了TameJS/StratifiedJS的大部分功能，但学习曲线更平缓。\n\
    \n### A1.4 Streamline.js\n\n与Kaffeine一样，Streamline.js⁵提供了一种特殊语法，可将异步函数调用后的代码转换为其回调。只需使用_____来代替回调参数即可。\n\
    \n```\nfor (var s = 1; s < 60; s++) {\n  setTimeout(_, 1000);\n  console.log(s\
    \ + ' seconds have elapsed');\n}\nconsole.log('1 minute has elapsed');\n```\n\n\
    ---\n\n1. https://twitter.com/jeresig/statuses/164496725254479872\n2. https://github.com/onilabs/apollo\n\
    3. http://weepy.github.com/kaffeine/index.html\n4. https://github.com/Sage/streamlinejs\n\
    \n有趣的是，Streamline可以生成标准的回调驱动JavaScript代码或用于node-fibers的基于纤程的代码（见下一节）。此外，与大多数其他JavaScript预编译器不同，Streamline可以与CoffeeScript一起使用。\n\
    \n注意：Streamline期望回调遵循Node风格的参数列表约定 (err, results...)，这简化了Node中的错误处理，但在浏览器开发中使用时却比较困难。\n\
    \n### A1.5 Node-Fibers\n\n而本列表中列出的其他项目仅仅编译为纯JavaScript，但node-fibers实际上扩展了解释器运行的语言理解范围，添加了类线程结构称为*纤程\
    \ (http://en.wikipedia.org/wiki/Fiber_(computer_science))*⁶。一个纤程可以让渡给其他纤程，挂起自身的执行直到某个事件使其再次运行。\n\
    \n```\nvar fiber = Fiber.current;\nconsole.log('Yielding until the timeout elapses...')\n\
    setTimeout(function() {\n  fiber.run();\n}, 1000);\nFiber.yield();\nconsole.log('...1\
    \ second later');\n```\n\nnode-fibers相对于JavaScript预编译器的主要优势在于调试。node-fiber堆栈跟踪中的行号对应于node-fiver源代码中的行号，并且即使纤程在try/catch块内挂起时也能捕获抛出的异常。\n\
    \n### A1.6 JavaScript的未来：生成器 (Generators)\n\nECMAScript的最新版本（所有主流JavaScript运行时实现的规范）定义了一种新的JavaScript功能称为*generators\
    \ *(生成器)。一个生成器是包含yield语句的特殊类型函数。**`yield`**类似于return，除了生成器在下一次运行时将从该**`yield`\
    \ **语句处恢复。\n\n从概念上讲，生成器有点棘手。然而，Mozilla的Task.js (http://taskjs.org/)库展示了它们如何让异步代码更简单。因为生成器可以恢复执行，所以您可以编写如下代码：\n\
    \n```\ntask.spawn(function() {\n  console.log(\"Yielding...\");\n  yield task.sleep(1000);\n\
    \  console.log(\"...resuming 1 second later\");\n});\n```\n\n以下是代码工作原理的说明: **`task.spawn`**运行我们的生成器，它只是一个普通函数，除了包含yield之外。`task.sleep返回一个Promise（参见第3章，*Promises\
    \ and Deferreds*, 第31页），它在1000ms后解决。**`task.spawn`**将该Promise接收并将其attach **`our\
    \ generator`作为其resolve回调**。当Promise解决时，我们的生成器再次被调用，从yield处恢复。听起来可能很复杂，但它运作得非常完美。\n\
    \nECMAScript 6（也称为Harmony）尚未最终确定​​。目前，生成器的唯一重大实现是在Firefox浏览器中，并且只有在您的**`<script>`标签中指定JavaScript版本至少为1.7才启用，如下所示：**\n\
    \n```\n<script type=\"application/javascript;version=1.7\">\n```\n\n如果您被生成器所吸引⁷，则有一个工具可以允许您将使用生成器的代码（以及其他ECMAScript\
    \ 5+功能）编译为广泛支持的JavaScript代码：Google的Traceur。⁸\n\n---\n\n8. http://code.google.com/p/traceur-compiler/\n\
    \n## The Pragmatic Bookshelf (实用书柜)\n\nThe Pragmatic Bookshelf收录了由开发人员为开发人员撰写的书籍**。这些标题延续了著名的Pragmatic\
    \ Programmer风格，并继续赢得奖项和好评。随着开发变得越来越困难，实用的程序员们将提供更多产品和服务帮助您保持领先的游戏水平。**（注：根据原文语境，此处\"\
    Pragmatic Programmers”指代该团队或品牌）\n\n### 在线访问我们 (Visit Us Online)\n\n**本书主页 (This\
    \ Book's Home Page)**\n\n[http://pragprog.com/titles/tbajs](http://pragprog.com/titles/tbajs)\n\
    \n来自本书的源代码勘误表和其他资源。来给我们反馈吧！\n\n**注册更新通知 (Register for Updates)**\n\n[http://pragprog.com/updates](http://pragprog.com/updates)\n\
    \n当有新的更新和新书出版时随时收到通知。\n\n### 加入社区 (**Join the Community**)\n\n```\n[http://pragprog.com/community](http://pragprog.com/community)\n\
    ```\n\n阅读我们的博客，参加在线讨论，参与我们的邮件列表，与我们的wiki互动，并从其他实用程序程序员的经验中受益。**（注：原文可能意指“Pragmatic\
    \ Programmers\"作为群体名称，此处保留翻译一致性）**。\n\n**新颖和值得关注 (New and Noteworthy)**\n\n[http://pragprog.com/news](http://pragprog.com/news)\n\
    \n了解最新的务实发展、新书和其他产品。\n\n### 购买此书 (**Buy the Book**)\n\n如果您喜欢这本电子书，也许您想拥有这本书的纸质副本。您可以在我们的商店购买：[http://pragprog.com/titles/tbajs](http://pragprog.com/titles/tbajs)\n\
