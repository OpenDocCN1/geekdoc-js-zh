  md: "Typically， functions that take a callback take it as their last argument. (Regrettably，\
    \ the venerable setTimeout and setInterval are exceptions to this convention.)\
    \ But some async functions take callbacks indirectly, by return a Promise or using\
    \ PubSub. We'll learn about those patterns later in the book.\n\nUnfortunately，\
    \ the only way to be sure whether a function is async or not is to inspect its\
    \ source code. Some functions that are synchronous have an API that looks async，\
    \ either because they might become async in the future or because callbacks provide\
    \ a convenient way to return multiple arguments. When in doubt, don't depend on\
    \ a function being async.\n\n# Sometimes-Async Functions\n\nThere are functions\
    \ that are async sometimes but not at other times. For instance， jQuery's eponymous\
    \ function (typically aliased as $) can be used to delay a function until the\
    \ DOM has finished loading. But if the DOM has already finished loading, there's\
    \ no delay; its callback fires immediately.\n\nThis unpredictable behavior can\
    \ get you in a lot of trouble if you aren't careful. One mistake I've seen (and\
    \ made myself) is assuming that $ will run a function after other scripts on the\
    \ page have loaded.\n\n```\n// application.js\n$(function() {\n utils.log('Ready');\n\
    });\n\n// utils.js\nwindow.utils = {\n log: function() {\n if (window.console)\
    \ console.log.apply(console , arguments);\n }\n};\n\n<script src=\"application.js\"\
    ></script>\n<script src=\"util.js\"></script>\n```\n\nThis code works fine-unless\
    \ the browser loads the page from the cache, making the DOM ready before the script\
    \ runs. When that happens, the callback passed to $ runs before utils.log is set,\
    \ causing an error. (We could avoid this situation by taking a more modern approach\
    \ to client-side dependency management. See Chapter 6, Async Script Loading, on\
    \ page 69.)\n\nLet's look at another example."
