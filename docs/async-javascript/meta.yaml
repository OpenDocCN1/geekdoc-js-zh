  md: "Node's error conventions may not ideal for Async.js's collection methods. But\
    \ for all of Async.js's other methods, following these conventions allow errors\
    \ to flow neatly from individual tasks to the completion callback. We'll see more\
    \ examples of this in the next section.\n\n# 4.3 Organizing Tasks with Async.js\n\
    \nAsync.js's collection methods solve the problem of applying a single async function\
    \ to a set of data. But what if, instead of a set of data, we have a set of functions?\
    \ In this section, we'll explore some of the powerful tools that Async.js has\
    \ for dispatching async functions and collecting their results.\n\n# Running an\
    \ Async Series\n\nSuppose we have an array of async functions that we want to\
    \ run in order. Without the use of a utility function, we might have to write\
    \ something like this:\n\n```\nfuncs[0](function() {\n  funcs[1](function() {\n\
    \    funcs[2](onComplete);\n  })\n});\n```\n\nFortunately, we have async.series\
    \ and async.waterfall. Each takes an array of functions (the task list) and runs\
    \ them sequentially, passing each one a Node-style callback. The difference between\
    \ the two is that async.series provides only the callback to each task, whereas\
    \ async.waterfall also provides the results from the previous task. (By \"results,\"\
    \ I mean the nonerror values each task passes to its callback.)\n\nLet's look\
    \ at a simple demonstration using timeouts.\n\n```\nAsyncjs/seriesTimers.js\n\
    var async = require ('async');\n\nvar start = new Date;\n\nasync.series([\n  function(callback)\
    \ { setTimeout(callback, 100); },\n  function(callback) { setTimeout(callback,\
    \ 300); },\n  function(callback) { setTimeout(callback, 200); }\n], function(err,\
    \ results) {\n  // show time elapsed since start\n  console.log('Completed in\
    \ ' + (new Date - start) + 'ms');\n});\n```"
  merge: -1
  pgno: 67
- img_proc: true
  md: "(Substituting async.waterfall for async.series would have no effect on this\
    \ example, since each task's callback is run with no arguments.)\n\nThe completion\
    \ handler will run after a little over 600m because each task in the array is\
    \ completed in order. The callback that Async.js passes to each task function\
    \ simply asks, \"Is there an error (the first argument)? If not, then I'll collect\
    \ the result (the second argument) and run the next task.\"\n\nThe next time you\
    \ have a set of async functions that you want to run sequentially, reach for async.series\
    \ or async.waterfall. There's an excellent chance that one of them is the right\
    \ tool for the job.\n\n# Parallelizing Async Functions\n\nAsync.js offers a parallel\
    \ analog of async.series called async.parallel. Just like async.series, it takes\
    \ an array of functions of the form function(callback) {...}, plus an (optional)\
    \ completion handler that runs after the last callback fires.\n\nLet's repeat\
    \ our timeout example.\n\n```\nAsyncjs/parallelTimers.js\nvar async = require\
    \ ('async');\nvar start = new Date;\nasync.parallel([\n  function(callback) {\
    \ setTimeout(callback, 100); },\n  function(callback) { setTimeout(callback, 300);\
    \ },\n  function(callback) { setTimeout(callback, 200); }\n], function(err, results)\
    \ {\n  console.log('Completed in ' + (new Date - start) + 'ms');\n});\n```\n\n\
    Whereas async.series took the sum of the timeouts to complete (~600ms), async.parallel\
    \ takes only the max timeout (~300ms).\n\nConveniently, Async.js passes the results\
    \ to the completion handler in the order corresponding to the task array, not\
    \ the order in which the results were generated. Thus, you get the performance\
    \ benefits of parallelism without the unpredictability.\n\nAlong with the collection\
    \ methods, async.series, async.waterfall, and async.parallel are the heart and\
    \ soul of Async.js: simple, time-saving utility functions for the most common\
    \ async scenarios.\n\n# 4.4 Dynamic Async Queuing\n\nMost of the time, the simple\
    \ methods from the last two sections are enough to solve your async dilemmas.\
    \ But async.series and async.parallel have their limitations."
  merge: -1
