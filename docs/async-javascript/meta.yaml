    think async.queue.


    That''s it for our coverage of Async.js, the most widely used and, arguably, most
    feature-rich JavaScript flow control library. However, I don''t want you to get
    the impression that Async.js is the right tool for every callback-driven job.
    Let''s close out the chapter by looking at one of its top rivals, Step.


    # 4.5 Minimalist Flow Control with Step


    Tim Caswell''s Step is a lightweight library.[5] In fact, its API consists of
    a single function: Step.


    Step takes a list of functions; here''s an example:


    ```

    Step(task1, task2, task3);

    ```


    Each function can control the flow in three ways.


    +   - It can call this to make Step run the next function in the list.


    +   - It can call a callback generated by this.parallel or this.group n times
    to tell Step to run the next function n times.


    +   - It can return a value, which will also make Step run the next function in
    the list. This makes it easy to mix synchronous functions with async ones.


    The next function will receive the results of its predecessor (that is, its return
    value or the arguments it passed to this) or the results of all instances of its
    predecessor if that predecessor was run with this.parallel or this.group. (The
    difference is that this.parallel provides those results as separate arguments,
    while this.group merges them into arrays.)


    The entire library is, as of this writing, just 152 lines long (with comments)
    yet is versatile enough to handle most async flows. The downside of this minimalism
    is that a flow created with Step can be understood only by reading each function
    in it. Flows created with the everything-but-the-kitchen-sink Async.js tend to
    be more self-explanatory.


    Still, if you feel like rolling up your sleeves, writing Async.js-like utility
    functions in Step can be a great exercise. For example, here''s the equivalent
    of async.map in just eleven lines:


    5. https://github.com/creationix/step'
