  md: '# CHAPTER 1


    # Understanding JavaScript Events


    Events. How *do* they work? Confusion about JavaScript''s asynchronous event model
    is as old as JavaScript itself. Confusion leads to bugs, bugs lead to anger, and
    Yoda taught us the rest....


    Yet at heart, JavaScript events are both conceptually elegant and practical. Once
    you''ve accepted the language''s single-threaded design, it feels like a feature
    rather than a limitation. It means that your code is uninterruptible and that
    the events you schedule line up in an orderly fashion.


    In this chapter, we''ll take a tour of JavaScript''s asynchronous mechanisms and
    dispel some common misconceptions. We''ll see what setTimeout *really* does. Then
    we''ll discuss handling errors in callbacks. Finally, we''ll set up the main theme
    of this book: organizing async code for clarity and maintainability.


    # 1.1 Scheduling Events


    When we want to make a piece of code run in the future in JavaScript, we put it
    in a *callback*. A callback is just an ordinary function, except that it''s passed
    to a function like setTimeout or bound as a property like document.onready. When
    a callback runs, we say that an event (e.g., the timeout elapsing or the document
    becoming ready) has fired.


    Of course, the devil is in the details, even for something as seemingly simple
    as setTimeout. A common description of setTimeout goes something like this:


    > Given a callback and a delay of *n* milliseconds, setTimeout runs that callback
    *n* milliseconds later.


    But as we''ll see in this section, and throughout this chapter, that description
    is seriously flawed. In most cases, it''s only approximately true. In others,
    it''s flat-out wrong. To truly understand setTimeout, we have to understand the
    JavaScript event model as a whole.'
  merge: -1
