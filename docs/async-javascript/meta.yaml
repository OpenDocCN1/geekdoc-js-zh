    \nThe solution? Wrap the callback in a setTimeout.\n\n```\nif (socket.readyState\
    \ === WebSocket.OPEN) {\n  setTimeout(callback, 0);\n} else {\n  // ...\n}\n```\n\
    \nUsing a timeout here may feel like a kludge, but it's much better than having\
    \ an inconsistent API.\n\nIn this section, we've seen several best practices for\
    \ writing async functions. Don't rely on a function always being async, unless\
    \ you've read its source code. Avoid using timer methods to wait for something\
    \ to change. When returning a value and running a callback from the same function,\
    \ make sure the callback runs after the return.\n\nThis is a lot of information\
