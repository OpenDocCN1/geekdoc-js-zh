  md: "# Deferring Scripts\n\nIn the last section, I recommended `<body>` placement\
    \ for most scripts, since that allows the user to see the page more quickly and\
    \ avoids the overhead of binding to a “ready” event before manipulating the DOM.\
    \ But there is a downside: the browser won’t be able to start loading those scripts\
    \ until the whole document is loaded. For large documents being sent over slow\
    \ connections, this can be a major bottleneck.\n\nIdeally, we’d load those scripts\
    \ in parallel with the document, without delaying DOM rendering. Then when the\
    \ document is ready, we’d run the scripts because they’re loaded while preserving\
    \ the order of the `<script>` tags.\n\nIf you’ve read the book up to this point,\
    \ no doubt you’re excited about writing a custom Ajax script loader to meet these\
    \ requirements! But most browsers support a simpler solution.\n\n```\n<script\
    \ defer src=\"deferredScript.js\">\n```\n\nAdding that `defer` attribute tells\
    \ the browser this: “Start loading this script right away, but don’t run it until\
    \ the document is ready and all previous scripts with `defer` have finished running.”\
    \ Placing a deferred script in the `<head>` of your document gives you all the\
    \ advantages of `<body>` placement, plus a substantial speed boost in large documents!\n\
    \nThe downside? `defer` isn’t supported by all browsers. Notably, as of this writing,\
    \ even the latest Opera ignores the attribute.4 That means if you want to ensure\
    \ that your deferred scripts run after the document is loaded, you’ll have to\
    \ wrap each script’s code in something like jQuery’s `$(document).ready`. That\
    \ may be worthwhile, since something like 97 percent of your visitors will get\
    \ to enjoy the benefits of parallel loading, while the other 3 percent will still\
    \ get perfectly functional JavaScript.\n\nWith `defer`, we can improve on the\
    \ page example from the previous section by replacing `bodyScripts.js` with `deferredScripts.js`.\n\
    \n```\n<html>\n<head>\n    <!-- metadata and stylesheets go here -->\n    <script\
    \ src=\"headScripts.js\"></script>\n    <script defer src=\"deferredScripts.js\"\
    ></script>\n</head>\n<body>\n    <!-- content goes here -->\n</body>\n</html>\n\
    ```\n\n+   1. http://caniuse.com/#search=defer"
  merge: -1
  pgno: 84
- img_proc: true
  md: 'Just remember that it’s important to wrap `deferredScripts` so that it won’t
    run until after the document ready event in browsers that don’t support `defer`.
    If the body content is more than a couple of kilobytes, that trade-off is worthwhile.


    # Full Script Parallelization


    If you’re a hardcore every-millisecond-counts page load gearhead, `defer` may
    sound like weak sauce to you. You don’t want to wait until all previous scripts
    with `defer` have run. And you certainly don’t want those scripts to wait to run
    until the document is ready, not when they have to use `$(document).ready` anyway
    for Opera’s sake. You just want to load those scripts *as soon as possible* and
    run them *as soon as possible*.


    That’s why modern browsers offer the `async` attribute.


    ```

    <script async src="speedyGonzales.js"></script>

    <script async src="roadRunner.js"></script>

    ```


    If `defer` makes you think of an orderly queue waiting for the document to load,
    `async` should make you think of anarchy. Those two scripts shown earlier could
    run in any order, and they’ll run as soon as the JavaScript engine is available
    to run them, whether the document is ready or not. So, aside from feeling the
    need for speed, why would you use `async`?


    For most scripts, `async` is a tough sell. It’s not as widely supported as `defer`,
    so fewer users will notice the performance boost.⁵ And because `async` scripts
    can run at any time, it’s all too easy to introduce Heisenbugs that depend on
    when a script happens to finish loading.


    But for scripts that are intended to be independent, `async` is a small but significant
    win. Got a third-party script that adds a feedback widget and another that adds
    a tech support chat box? The page will run fine without them, and it doesn’t matter
    which one runs first. So, you can get a free speed boost by using `async` with
    them.


    > ### Async + Defer = ?


    You might be asking, “What if I use both `defer` and `async` on the same script?”
    The answer is that `async` overrides `defer` in browsers that support both. Since
    `defer` is more widely supported and provides the main benefit of `async`—allowing
    the DOM to render while the script downloads—I recommend using `defer` whenever
    you use `async`.


    5. [http://caniuse.com/#search=async](http://caniuse.com/#search=async)'
  merge: -1
  pgno: 85
- img_proc: true
  md: "Adding a couple of independent widgets to our last page example, we get the\
    \ following:\n\n```\n<html>\n<head>\n  <!-- metadata and stylesheets go here -->\n\
    \  <script src=\"headScripts.js\"></script>\n  <script src=\"deferredScripts.js\"\
    \ defer></script>\n</head>\n<body>\n  <!-- content goes here -->\n  <script async\
    \ defer src=\"feedbackWidget.js\"></script>\n  <script async defer src=\"chatWidget.js\"\
    ></script>\n</body>\n</html>\n```\n\nThis page structure makes your priorities\
    \ clear. In the vast majority of browsers, DOM rendering will be delayed only\
    \ until headScripts.js finishes running. deferredScripts.js will load in the background\
    \ while the DOM is rendered. Then, after DOM rendering, deferredScripts.js and\
    \ the two widget scripts will run. The order in which those scripts run is indeterminate\
    \ in browsers that support async. If you're not sure whether that's OK, don't\
    \ use async!\n\nIn this section, we've seen how a <script> tag's placement and\
    \ attributes you use can make a big difference in the time it takes for someone\
    \ to start using your page. In the next section, we'll see how you can take the\
    \ principle of async loading even further by using scripts to load other scripts.\n\
    \n# 6.3 Programmatic Loading\n\nWhile <script> tags are appealingly simple, there\
    \ are some situations that require a more sophisticated approach to script loading.\
    \ Perhaps we want a certain script to load only for users who meet certain requirements,\
    \ such as premium subscribers or gamers who've reached a certain level. Or we\
    \ may want a certain feature, like a chat widget, to load only when the user clicks\
    \ to activate it.\n\nIn this section, we'll look at how scripts can load other\
    \ scripts. After a brief look at low-level approaches, we'll look at two popular\
    \ libraries that make script loading a breeze: yepnope and Require.js.\n\n# Loading\
    \ Scripts Directly\n\nAt the browser API level, there are two (reasonable) ways\
    \ to fetch a script from a server and run it."
  merge: -1
  pgno: 86
- img_proc: true
  md: "The latter approach is nicer, since the browser takes care of the work of making\
    \ an HTTP request for you. Plus, eval has practical problems: leaking scope, making\
    \ a mess of debugging, and possibly degrading performance. So, to load a script\
    \ called feature.js, we would insert a &lt;script&gt; tag with some code like\
    \ this:\n\n```\nvar head = document.getElementsByTagName('head')[0];\nvar script\
    \ = document.createElement('script');\nscript.src = '/js/feature.js';\nhead.appendChild(script);\n\
    ```\n\nBut wait—how do we find out when the script has finished loading? We could,\
    \ of course, add some code in the script itself to trigger an event, but adding\
    \ that code to every script we load would be a chore (or, in the case of scripts\
    \ on a third-party server, impossible). The HTML5 specification defines an onload\
    \ attribute that we can bind a callback to.\n\n```\nscript.onload = function()\
    \ {\n  // now we can call functions defined in script\n};\n```\n\nHowever, onload\
    \ isn't supported in IE8 and older, which instead uses onreadystatechange. There\
    \ are also some weird edge cases in certain browsers when inserting &lt;script&gt;\
    \ tags. And I haven't even gotten into error handling! To avoid all of these headaches,\
    \ I highly recommend using a script-loading library.\n\n# Conditional Loading\
    \ with yepnope\n\nyepnope⁶ is a simple and lightweight library (just 1.7KB minified\
    \ and gzipped) designed to serve the most common dynamic loading needs without\
    \ frills. It can be used on its own or as part of the Modernizr feature detection\
    \ library.\n\nAt its simplest, yepnope loads a script and gives you a callback\
    \ for when the script has run.\n\n```\nyepnope({\n  load: 'oompaLoompas.js',\n\
    \  callback: function() {\n    console.log('Oompa-Loompas ready!');\n  }\n});\n\
    ```"
  merge: -1
  pgno: 87
- img_proc: true
  md: "Not impressed yet? Let's use yepnope to load multiple scripts in parallel and\
    \ run them in the given order. For example, suppose we want to load Backbone.js,\
    \ which depends on Underscore.js. All we have to do is provide the two script\
    \ locations in an array as the load parameter.\n\n```\nyepnope({\n  load: ['underscore.js',\
    \ 'backbone.js'],\n  complete: function() {\n    // Backbone logic goes here\n\
    \  }\n});\n```\n\nNotice that we used complete instead of callback here. The difference\
    \ is that callback is run for every resource in the load list, while complete\
    \ runs only after everything has been loaded.\n\nyepnope's trademark feature is\
    \ *conditional loading*. Given a test parameter, yepnope can load different resources\
    \ based on whether that value is truthy. For instance, if you're using Modernizr,\
    \ you can determine (to some degree of accuracy) whether the user is on a touchscreen\
    \ device and load different stylesheets and scripts accordingly.\n\n```\nyepnope({\n\
    \  test: Modernizr.touch,\n  yep: ['touchStyles.css', 'touchApplication.js'],\n\
    \  nope: ['mouseStyles.css', 'mouseApplication.js'],\n  complete: function() {\n\
    \    // either way, the application is now ready!\n  }\n});\n```\n\nWith a handful\
    \ of lines of code, we've set the stage to give users a completely different experience\
    \ based on their input device. Of course, we don't need both a yep and a nope\
    \ for every condition. One of the most common uses of yepnope is loading shims\
    \ to fill in functionality that's missing from older browsers.\n\n```\nyepnope({\n\
    \  test: window.json,\n  nope: ['json2.js'],\n  complete: function() {\n    //\
    \ now we can JSON safely\n  }\n});\n```\n\nHere's a good markup structure for\
    \ a page that uses yepnope:"
  merge: -1
  pgno: 88
- img_proc: true
  md: "```\n<html>\n<head>\n    <!-- metadata and stylesheets go here -->\n    <script\
    \ src=\"headScripts.js\"></script>\n    <script src=\"deferredScripts.js\" defer></script>\n\
    </head>\n<body>\n    <!-- content goes here -->\n</body>\n</html>\n```\n\nLook\
    \ familiar? This is the same structure we had in the section on defer. The only\
    \ difference is that yepnope.js has been concatenated into one of the script files\
    \ (likely at the top of deferredScripts.js), and anything that we need conditionally\
    \ (because the browser needs a shim) or want to load dynamically (in response\
    \ to a user action) can be loaded separately. The result should be a smaller deferredScripts.js.\n\
    \nI love yepnope. For relatively simple applications that just want to grab a\
    \ few shims or load a feature when a user clicks something, yepnope is pretty\
    \ much perfect. For truly voluminous applications, though, something stronger\
    \ is called for.\n\n# Smart Loading with Require.js and AMD\n\nRequire.js is the\
    \ script loader of choice for developers who want to turn the chaos of script-heavy\
    \ applications into something more orderly. It's a powerful package capable of\
    \ sorting out even the most complex dependency graphs automatically with AMD.\n\
    \nWe'll get to AMD in a moment, but first let's look at a simple script-loading\
    \ example with Require.js's eponymous function.\n\n```\nrequire(['moment'], function(moment)\
    \ {\n    console.log(moment().format('dddd'));  // day of the week\n});\n```\n\
    \nThe require function takes an array of script names and loads all of those scripts\
    \ in parallel. Unlike yepnope, Require.js doesn't ensure that the target scripts\
    \ run in order. Instead, it ensures that they run in an order such that each script's\
    \ dependencies are satisfied, provided that those scripts are specified via the\
    \ Asynchronous Module Definition (AMD).\n\nAMD is a specification<sup>7</sup>\
    \ that aims to do for the browser what the CommonJS standard has accomplished\
    \ for the server. (Node.js modules are based on the\n\n7. https://github.com/amdjs/amdjs-api/wiki/AMD"
  merge: -1
  pgno: 89
- img_proc: true
  md: "CommonJS standard.) It mandates a global function (provided by Require.js)\
    \ called define, which takes three parameters: a name, a list of dependencies,\
    \ and a callback for when those dependencies are loaded. For example, this is\
    \ a valid AMD definition for an application that depends on jQuery:\n\n```\ndefine('myApplication'\
    \ ['jquery'], function($) {\n    $('<body>').append('<p>Hello, async world!</p>');\n\
    });\n```\n\nNotice that the jQuery object, $, is passed to the callback. In fact,\
    \ the callback will always receive an argument corresponding to each item in the\
    \ dependency list. You might be wondering how define knew to capture the jQuery\
    \ object. The answer is that jQuery's own AMD definition^8 returns jQuery from\
    \ its define callback, thereby declaring “this is my exported object.”\n\n```\n\
    define( \"jquery\", [], function () { return jQuery; } );\n```\n\nThere’s a little\
    \ more to AMD than that, but that’s the essence. Adding AMD definitions to every\
    \ script in your application means you can call require and rest assured that\
    \ your callback won’t be invoked until not only are your direct dependencies met\
    \ but their dependencies and their dependencies’ dependencies are as well, all\
    \ loading with maximum parallelism and running in an order consistent with the\
    \ dependency graph.\n\nSounds great, right? But there’s a flip side: while AMD\
    \ has gotten some traction in the JavaScript community, there are plenty of doubters.\
    \ Jeremy Ashkenas, for instance, has declined to add the requisite boilerplate\
    \ to his popular Underscore.js and Backbone.js libraries, awaiting an anticipated\
    \ ECMAScript module standard. As a result, you can’t count on third-party modules\
    \ to have their own AMD definitions. Choosing AMD can make your application more\
    \ consistent, but it can also be a recipe for boilerplate code.\n\nIn these last\
    \ few pages, we’ve seen how you can load a script at runtime via DOM manipulation,\
    \ and we’ve looked at two libraries for simplifying that process: yepnope, a small,\
    \ precise tool, and Require.js, a large and powerful one. Which you choose ultimately\
    \ depends on what kind of application you’re developing and what kind of development\
    \ team you are. The more “enterprise-y” the application and the bigger the front-end\
    \ team, the more likely you are to benefit from the AMD-style modularization encouraged\
    \ by Require.js.\n\n8. See https://github.com/jquery/jquery/blob/master/src/exports.js#L17."
  merge: -1
  pgno: 90
- img_proc: true
  md: '# What We''ve Learned


    You can make your site much snappier by asynchronously loading the scripts you
    don''t need right away. The easiest way to do that is with judicious use of the
    defer and async attributes. If you need to load scripts conditionally, consider
    a loader like yepnope. And if your site has scores of interdependent scripts,
    take a good look at Require.js. Choose the right tool for the job, embrace it,
    and enjoy.


    And on that note, we''ve reached the end of the book. Thanks for taking the time
    to read it. It was my pleasure to write it. No matter where your JavaScript journey
    takes you from here, I hope that it''s rich in beautiful, event-driven code.'
  merge: -1
  pgno: 91
- img_proc: true
  md: "# APPENDIX 1\n\n# Tools for Taming JavaScript\n\nThis appendix is an overview\
    \ of some of the more popular tools for writing async JavaScript code in a more\
    \ synchronous style. None of these tools is a substitute for a proper understanding\
    \ of JavaScript events. Instead, they can complement that understanding by adding\
    \ a few more tricks to your async repertoire.\n\n# A1.1 TameJS\n\nThe OkCupid\
    \ team has created a clever precompiler with more than 600 GitHub watchers (http://tamejs.org/)\
    \ that adds two keywords to JavaScript, await and defer. An await block defines\
    \ code that won't return until each async task defined with defer has been completed.\n\
    \n```\nawait {\n    setTimeout(defer(), 100);\n}\nconsole.log(\"this will run\
    \ after the 100ms timeout\");\n```\n\nThe TameJS folks have also created a CoffeeScript\
    \ fork with the same await/defer mechanism called IcedCoffeeScript (http://maxtaco.github.com/coffee-script/).\n\
    \n# A1.2 StratifiedJS\n\nStratifiedJS (http://onilabs.com/stratifiedjs) is an\
    \ alternative to the await/defer paradigm that offers finer-grained control structures,\
    \ with intuitive names like waitfor and resume.\n\n```\nconsole.log('this code\
    \ will run right away...');\nwaitfor() {\n    setTimeout(resume, 500);\n}\nconsole.log('...and\
    \ this will run 500ms later.');\n```"
  merge: -1
  pgno: 92
- img_proc: true
  md: "Although not widely used, StratifiedJS is an ambitious project that’s received\
    \ praise from the likes of John Resig (the creator of jQuery).¹ Note that StratifiedJS\
    \ is the name of the specification, not the implementation; the official reference\
    \ implementation is called Oni Apollo.²\n\n# A1.3 Kaffeine\n\nKaffeine is a precompiler\
    \ that touts itself as “Extended JavaScript.”³ Among other features, the language\
    \ offers a simple syntactic sugar for un-nesting callbacks: just add ! after an\
    \ async function’s name. Kaffeine assumes that the function takes a callback as\
    \ its last argument and simply transforms all code after that call into the callback.\n\
    \nFor example, in a jQuery application, it’s common to want everything to run\
    \ from within a $ callback (after the document is ready). With Kaffeine, that’s\
    \ easily done.\n\n```\n$!()\nalert('The document is ready.');\n```\n\nAlthough\
    \ it doesn’t have as big a following as CoffeeScript, features like this make\
    \ Kaffeine well worth checking out. The CoffeeScript forks Coco and LiveScript\
    \ have a similar feature, which it calls backcalls. In Coco/LiveScript, the previous\
    \ example would be written like this:\n\n```\n<- $\nalert 'The document is ready'\n\
    ```\n\nThe Kaffeine/Coco/LiveScript approach provides much of the power of TameJS/StratifiedJS,\
    \ with less of a learning curve.\n\n# A1.4 Streamline.js\n\nLike Kaffeine, Streamline.js⁴\
    \ provides a special syntax for transforming the code after an async function\
    \ call into its callback. Just use _ in place of the callback argument.\n\n```\n\
    for (var s = 1; s < 60; s++) {\n  setTimeout(_, 1000);\n  console.log(s + ' seconds\
    \ have elapsed');\n}\nconsole.log('1 minute has elapsed');\n```\n\n+   1. https://twitter.com/jeresig/statuses/164496725254479872\n\
    2. https://github.com/onilabs/apollo\n3. http://weepy.github.com/kaffeine/index.html\n\
    4. https://github.com/Sage/streamlinejs"
  merge: -1
  pgno: 93
- img_proc: true
  md: "Interestingly, Streamline can generate either standard callback-driven JavaScript\
    \ or fiber-based code for node-fibers (see the next section). Also, unlike most\
    \ other JavaScript precompilers, Streamline can be used in conjunction with CoffeeScript.\n\
    \nNote that Streamline expects callbacks to follow the Node-style argument list\
    \ convention (err, results...), which eases error handling in Node but makes it\
    \ difficult to use for browser development.\n\n# A1.5 Node-Fibers\n\nWhile the\
    \ other projects I've listed here merely compile to plain JavaScript, node-fibers\
    \ actually extends the language understood by the Node runtime by adding threadlike\
    \ constructs called *fibers* ([http://en.wikipedia.org/wiki/Fiber_(computer_science)](http://en.wikipedia.org/wiki/Fiber_(computer_science))).\
    \ A fiber can yield to other fibers, suspending its own execution until an event\
    \ causes it run again.\n\n```\nvar fiber = Fiber.current;\nconsole.log('Yielding\
    \ until the timeout elapses...')\nsetTimeout(function() {\n  fiber.run();\n},\
    \ 1000);\nFiber.yield();\nconsole.log('...1 second later');\n```\n\nThe main advantage\
    \ of node-fibers over JavaScript precompilers is debugging. The line numbers in\
    \ node-fiber stack traces correspond to the line numbers in node-fiber source\
    \ code, and thrown exceptions can be caught even when a fiber yields within a\
    \ try/catch block.\n\n# A1.6 The Future of JavaScript: Generators\n\nThe latest\
    \ iteration of ECMAScript (the specification that all mainstream JavaScript runtimes\
    \ implement) defines a new JavaScript feature called *generators*. A generator\
    \ is a special type of function containing a yield statement. A yield is like\
    \ a return, except that the generator resumes from that yield statement the next\
    \ time it's run.\n\nConceptually, generators are a little tricky. However, Mozilla's\
    \ Task.js ([http://taskjs.org/](http://taskjs.org/)) library shows how they can\
    \ make async code simpler. Because generators can be resumed, you can write code\
    \ like this:\n\n```\ntask.spawn(function() {\n  console.log(\"Yielding...\");\n\
    \  yield task.sleep(1000);\n  console.log(\"...resuming 1 second later\");\n});\n\
    ```"
  merge: -1
  pgno: 94
- img_proc: true
  md: 'Here''s how this code works: task.spawn runs our generator, which is just a
    normal function except for the yield. task.sleep returns a Promise (see [Chapter
    3, *Promises and Deferreds*, on page 31](#)) that resolves in 1000ms. task.spawn
    takes that Promise and attaches our generator as its resolve callback. When the
    Promise resolves, our generator is called again, resuming after the yield. It
    may sound complicated, but it works beautifully.


    ECMAScript 6 (aka Harmony) hasn''t been finalized yet. Currently, the only major
    implementation of generators is in the Firefox browser, and they''re enabled only
    if you specify a JavaScript version of at least 1.7 in your `<script>` tags, like
    so:


    ```

    `<script` type="*application/javascript;version=1.7*"`>`

    ```


    If generators appeal to you, there is a tool that allows you to compile code that
    uses generators (and other ECMAScript 5+ features) into widely supported JavaScript
    code: Google''s Traceur.[5](http://code.google.com/p/traceur-compiler/)'
  merge: -1
  pgno: 95
