  md: 'Under Promises/A, a Promise is said to be “resolved” when it’s either fulfilled
    or failed.


    Up until the release of 1.8, jQuery’s `then` method was just a shorthand for invoking
    `done`, `fail`, and `progress` simultaneously, while Promises/A’s `then` acted
    more like jQuery’s `pipe`. jQuery 1.8 corrected this by making `then` a synonym
    for `pipe`. However, any further reconciliation with Promises/A is unlikely because
    of backward compatibility concerns.


    There are other, subtler differences as well. For instance, in Promises/A, whether
    a Promise returned by `then` is fulfilled or rejected depends on whether the invoked
    callback returns a value or throws an error. (Throwing errors from jQuery Promise
    callbacks is a bad idea because they’ll go uncaught.)


    Because of these issues, you should try to avoid interacting with multiple Promise
    implementations in the same project. If you’re just getting Promises from jQuery
    methods, use jQuery Promises. If you’re using another library that gives you CommonJS
    Promises, adopt Promises/A. Q.js makes it easy to “assimilate” jQuery Promises.


    ```

    var qPromise = Q.when(jqPromise);

    ```


    As long as these two standards remain divergent, this is the best way to make
    them play nice together. For more information, see the [Q.js docs](https://github.com/kriskowal/q).<sup>5</sup>


    # 3.8 Replacing Callbacks with Promises


    In a perfect world, every function that started an async task would return a Promise.
    Unfortunately, most JavaScript APIs (including the native functions available
    in all browsers and in Node.js) are callback-based, not Promise-based. In this
    section, we’ll see how Promises can be used with callback-based APIs.


    The most straightforward way to use Promises with a callback-based API is to create
    a Deferred and pass its trigger function(s) as the callback argument(s). For example,
    with a simple async function like `setTimeout`, we’d pass our Deferred’s `resolve`
    method.


    ```

    var timing = new $.Deferred();

    setTimeout(timing.resolve, 500);

    ```


    In cases where an error could occur, we’d write a callback that conditionally
    routes to either `resolve` or `reject`. For example, here’s how we’d work with
    a Node-style callback:


    5. [https://github.com/kriskowal/q](https://github.com/kriskowal/q)'
