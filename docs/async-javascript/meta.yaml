    \ achieve the same result with the following:\n\n```\ngrammarDeferred.resolve.call(slashdotter,\
    \ 'comment', 'Emacs');\n```\n\n## 3.4 Progress Notifications\n\nA Promise is a\
    \ bundle of things you want to happen when a process comes to an end. But didn't\
    \ a motivational poster once tell you hazards the journey is as important as the\
