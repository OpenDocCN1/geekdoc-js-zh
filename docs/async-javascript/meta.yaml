  - "[PAGE 84]\n\n# Deferring Scripts\n\nIn the last section, I recommended `<body>`\
    \ placement for most scripts, since that allows the user to see the page more\
    \ quickly and avoids the overhead of binding to a “ready” event before manipulating\
    \ the DOM. But there is a downside: the browser won’t be able to start loading\
