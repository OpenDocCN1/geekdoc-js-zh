    \ run JavaScript on the server. It was created because Ryan Dahl wanted an event-driven\
    \ server framework built on a high-level language. JavaScript just happened to\
    \ be the right language for the job. Why? Because the language is a perfect fit\
    \ for *nonblocking* I/O.\n\nIn other languages, it's tempting to \"block\" your\
    \ application (typically by running a loop) until an I/O request completes. In\
    \ JavaScript, that approach isn't even possible. A loop like this will run forever:\n\
    \n```\nvar ajaxRequest = new XMLHttpRequest;\najaxRequest.open('GET', url);\n\
    ajaxRequest.send(null);\nwhile (ajaxRequest.readyState === XMLHttpRequest.UNSENT)\
    \ {\n  // readyState can't change until the loop returns\n};\n```\n\nInstead,\
    \ you need to attach a handler and return to the event queue.\n\n```\nvar ajaxRequest\
    \ = new XMLHttpRequest;\najaxRequest.open('GET', url);\najaxRequest.send(null);\n\
    ajaxRequest.onreadystatechange = function() {\n  // ...\n};\n```\n\nThat's how\
    \ it goes. Whether you're waiting for a keypress from the user or a batch of data\
    \ from a remote server, you need to define a callback—unless your JavaScript environment\
    \ gives you a synchronous I/O function that does the blocking for you."
- md: "\n\nIn the browser, Ajax methods have an async option that can (but *should\
    \ never, ever*) be set to false, bringing the entire browser pane to a halt until\
    \ a response is received. In Node.js, synchronous API methods are clearly indicated\
    \ with names like fs.readFileSync. These are convenient when writing short scripts\
    \ but should be avoided when writing applications that need to handle multiple\
    \ requests or operations in parallel. And these days, which applications don't?\n\
    \nSome I/O functions have both synchronous and async effects. For instance, when\
    \ you manipulate the DOM in a modern browser, the changes are immediate from your\
    \ script's perspective but aren't rendered until you return to the event queue.\
    \ That prevents the DOM from being rendered in an inconsistent state. You can\
    \ see a simple demonstration of this at <http://jsfiddle.net/TrevorBurnham/SNBYV/>\n\
    \n## Is console.log Async?\n\nWebKit's console.log has surprised many a developer\
    \ by behaving asynchronously. In Chrome or Safari, this code will log `{foo: bar}`:\n\
    \n```javascript\n// EventModel/log.js\nvar obj = {};\nconsole.log(obj);\nobj.foo\
    \ = 'bar';\n```\n\nHow does this happen? Rather than taking a snapshot of the\
    \ object immediately, WebKit's console.log stores a reference to the object and\
    \ then takes a snapshot when the code returns to the event queue.\n\nNode's console.log,\
    \ on the other hand, is strictly synchronous, so the same code yields the output\
    \ `{}`.\n\nAdapting to nonblocking I/O is one of the biggest hurdles that newcomers\
    \ to JavaScript face, but it's also one of the language's key strengths. It makes\
    \ writing efficient, event-based code feel natural.\n\n## Timing Functions\n\n\
    We've seen how async functions are a natural fit for I/O operations, but sometimes\
    \ we want asynchronicity for its own sake. That is, we want to make a function\
    \ run at some point in the future, perhaps for an animation or a simulation. The\
    \ well-known functions for time-based events are setTimeout and its repeating\
    \ cousin, setInterval.\n\nUnfortunately, these well-known timer functions have\
    \ their flaws. As we saw in *Blocking the Thread*, on page 2, one of those flaws\
    \ is insurmountable: no JavaScript timing function can cause code to run while\
    \ other code is running in the same JavaScript process. But even with that limitation\
    \ in mind, setTimeout and setInterval are alarmingly imprecise. Here's a demonstration:\n\
    \n```javascript\n// EventModel/fireCount.js\nvar fireCount = 0;\nvar start = new\
    \ Date;\nvar timer = setInterval(function() {\n    if (new Date - start > 1000)\
    \ {\n        clearInterval(timer);\n        console.log(fireCount);\n        return;\n\
    \    }\n    fireCount++;\n}, 0);\n```\n\nWhen we schedule an event with setInterval\
    \ and a 0ms delay, it should run as often as possible, right? So, in a modern\
    \ browser powered by a speedy Intel i7 processor, at what rate does the event\
    \ fire?\n\nAbout 200/sec. That's across Chrome, Safari, and Firefox. Under Node,\
    \ the event fired at a rate of about 1000/sec. (Using setTimeout to schedule each\
    \ iteration yields similar results.) By comparison, replacing setInterval with\
    \ a simple while loop brings that rate to 4,000,000/sec in Chrome and 5,000,000/sec\
    \ in Node!\n\nWhat's going on? It turns out that setTimeout and setInterval are\
    \ slow by design. In fact, the HTML spec (which all major browsers respect) mandates\
    \ a minimum timeout/interval of 4ms!\n\nSo, what do you do when you need finer-grained\
    \ timing? Some runtimes offer alternatives.\n\n*   **In Node**, `process.nextTick`\
    \ lets you schedule an event to fire ASAP. On my system, process.nextTick events\
    \ fire at a rate of over 100,000/sec.\n*   Modern browsers (including IE9+) have\
    \ a requestAnimationFrame function, which serves a dual purpose: it allows JavaScript\
    \ animations to run at 60+ frames/sec, and it conserves CPU cycles by preventing\
    \ those animations from running in background tabs. In the latest Chrome, you\
    \ can even get submillisecond precision.\n\nThough they're the bread and butter\
    \ of async JavaScript, never forget that setTimeout and setInterval are imprecise\
    \ tools. When you just want to produce a short delay in Node, use `process.nextTick`.\
    \ In the browser, try to use a [shim](http://paulirish.com/2011/requestanimationframe-for-smart-animating/)\
    \ that defers to requestAnimationFrame in browsers that support it and falls back\
    \ on setTimeout in those that don't.\n\n```text\n+ 1. http://www.whatwg.org/specs/web-apps/current-work/multipage/timers.html#dom-windowtimers-settimeout\n\
    + 2. http://updates.html5rocks.com/2012/05/requestAnimationFrame-API-now-with-sub-millisecond-precision\n\
    ```\n\nThat concludes our brief overview of basic async functions in JavaScript.\
    \ But how do we tell when a function is async anyway? In the next section, we'll\
    \ ponder that question as we write our own async functions.\n\n## 1.3 Writing\
    \ Async Functions\n\nEvery async function in JavaScript is built on some other\
    \ async function(s). It's async functions all the way down (to native code)!\n\
    \nThe converse is also true: any function that uses an async function has to provide\
    \ the result of that operation in an async way. As we learned from *Blocking the\
    \ Thread*, on page 2, JavaScript doesn't provide a mechanism for preventing a\
    \ function from returning until an async operation has finished. in fact, until\
    \ the function returns, no async events will fire.\n\n### When Is a Function Async?\n\
    \nThe term async *function* is a bit of a misnomer: if you call a function, your\
    \ program simply won't continue until that function returns. What JavaScripters\
    \ mean when they call a function \"async\" is that it can cause another function\
    \ (called a callback [4] when it's passed as an argument to the function) to run\
    \ later from the event queue.\n\nSo, *an async function that takes a callback\
    \ will never fail this test*:\n\n```javascript\nvar functionHasReturned = false;\n\
    asyncFunction(function() {\n    console.assert(functionHasReturned);\n})\n\nfunctionHasReturned\
    \ = true;\n```\n\nAnother term for async functions is *nonblocking*. The term\
    \ emphasizes how speedy they are: a query made with an async MySQL driver may\
    \ take an hour but the function that sent the query will return in a matter of\
    \ microseconds—a boon to web servers that need to quickly process a high volume\
    \ of incoming requests.\n\nTypically, functions that take a callback take it as\
    \ their last argument. (Regrettably, the venerable setTimeout and setInterval\
    \ are exceptions to this convention.) But some async functions take callbacks\
    \ indirectly, by return a Promise or using PubSub. We'll learn about those patterns\
    \ later in the book.\n\nUnfortunately, the only way to be sure whether a function\
    \ is async or not is to inspect its source code. Some functions that are synchronous\
    \ have an API that looks async, either because they might become async in the\
    \ future or because callbacks provide a convenient way to return multiple arguments.\
    \ When in doubt, don't depend on a function being async.\n\n## Sometimes-Async\
    \ Functions\n\nThere are functions that are async sometimes but not at other times.\
    \ For instance, jQuery's eponymous function (typically aliased as $) can be used\
    \ to delay a function until the DOM has finished loading. But if the DOM has already\
    \ finished loading, there's no delay; its callback fires immediately.\n\nThis\
    \ unpredictable behavior can get you in a lot of trouble if you aren't careful.\
    \ One mistake I've seen (and made myself) is assuming that $ will run a function\
    \ after other scripts on the page have loaded.\n\n```html\n// application.js\n\
    $(function() {\n    utils.log('Ready');\n});\n\n// utils.js\nwindow.utils = {\n\
    \    log: function() {\n        if (window.console) console.log.apply(console,\
    \ arguments);\n    }\n};\n<script src=\"application.js\"></script>\n<script src=\"\
    util.js\"></script>\n```\n\nThis code works fine-unless the browser loads the\
    \ page from the cache, making the DOM ready before the script runs. When that\
    \ happens, the callback passed to $ runs before utils.log is set, causing an error.\
    \ (We could avoid this situation by taking a more modern approach to client-side\
    \ dependency management. See Chapter 6, Async Script Loading, on page 69.)\n\n\
    Let's look at another example."
  mdcn: "\n\n在浏览器中，Ajax方法有一个async选项，它可以（但*永远不应*）被设置为false，这会导致整个浏览器窗格在收到响应之前一直处于停止状态。在Node.js中，同步API方法通过像fs.readFileSync这样的名称明确标示。在编写短脚本时，这些方法很方便，但在编写需要并行处理多个请求或操作的应用程序时应避免使用。而如今，哪个应用程序不是这样呢？\n\
    \n一些I/O函数同时具有同步和异步效果。例如，当你在现代浏览器中操作DOM时，从你的脚本角度看，更改是立即生效的，但在返回事件队列之前不会被渲染。这防止了DOM在不一致的状态下被渲染。你可以在<http://jsfiddle.net/TrevorBurnham/SNBYV/>看到一个简单的演示。\n\
    \n## console.log是异步的吗？\n\nWebKit的console.log因其异步行为而令许多开发者感到惊讶。在Chrome或Safari中，这段代码将记录`{foo:\
    \ bar}`：\n\n```javascript\n// EventModel/log.js\nvar obj = {};\nconsole.log(obj);\n\
    obj.foo = 'bar';\n```\n\n这是如何发生的？WebKit的console.log并非立即获取对象的快照，而是存储对该对象的引用，然后在代码返回事件队列时获取快照。\n\
    \n另一方面，Node的console.log是严格同步的，因此相同的代码会产生`{}`的输出。\n\n适应非阻塞I/O是JavaScript新手面临的最大障碍之一，但它也是该语言的关键优势之一。它使得编写高效、基于事件的代码感觉很自然。\n\
    \n## 定时函数\n\n我们已经看到异步函数如何自然地适用于I/O操作，但有时我们为了异步而异步。也就是说，我们希望让函数在未来某个时间点运行，也许是为了动画或模拟。基于时间的事件的著名函数是setTimeout及其重复的变体setInterval。\n\
    \n不幸的是，这些著名的定时器函数有其缺陷。正如我们在*阻塞线程*（第2页）中所看到的，其中一个缺陷是无法克服的：没有JavaScript定时函数能在同一JavaScript进程中其他代码运行时导致代码运行。但即使考虑到这个限制，setTimeout和setInterval的不精确性也令人震惊。这里有一个演示：\n\
    \n```javascript\n// EventModel/fireCount.js\nvar fireCount = 0;\nvar start = new\
    \ Date;\nvar timer = setInterval(function() {\n    if (new Date - start > 1000)\
    \ {\n        clearInterval(timer);\n        console.log(fireCount);\n        return;\n\
    \    }\n    fireCount++;\n}, 0);\n```\n\n当我们用0ms延迟调度一个setInterval事件时，它应该尽可能频繁地运行，对吧？那么，在由高速Intel\
    \ i7处理器驱动的现代浏览器中，这个事件以什么速率触发？\n\n大约每秒200次。这包括Chrome、Safari和Firefox。在Node下，事件触发速率约为每秒1000次。（使用setTimeout调度每次迭代会产生类似结果。）相比之下，将setInterval替换为简单的while循环，在Chrome中将该速率提高到每秒4,000,000次，在Node中提高到每秒5,000,000次！\n\
    \n这是怎么回事？事实证明，setTimeout和setInterval在设计上就是慢的。事实上，HTML规范（所有主要浏览器都遵守）规定了最小超时/间隔为4ms！\n\
    \n那么，当你需要更精细的计时时该怎么办？一些运行时提供了替代方案。\n\n*   **在Node中**，`process.nextTick`让你可以调度一个事件尽快触发。在我的系统上，process.nextTick事件的触发速率超过每秒100,000次。\n\
    *   现代浏览器（包括IE9+）有一个requestAnimationFrame函数，它有两个用途：它允许JavaScript动画以每秒60帧以上的速度运行，并通过阻止这些动画在后台标签页中运行来节省CPU周期。在最新的Chrome中，你甚至可以获得亚毫秒级的精度。\n\
    \n尽管它们是异步JavaScript的支柱，但永远不要忘记setTimeout和setInterval是不精确的工具。当你只是想在Node中产生短延迟时，使用`process.nextTick`。在浏览器中，尽量使用[垫片](http://paulirish.com/2011/requestanimationframe-for-smart-animating/)，它在支持requestAnimationFrame的浏览器中会委托给requestAnimationFrame，而在不支持的浏览器中则回退到setTimeout。\n\
    \n```text\n+ 1. http://www.whatwg.org/specs/web-apps/current-work/multipage/timers.html#dom-windowtimers-settimeout\n\
    + 2. http://updates.html5rocks.com/2012/05/requestAnimationFrame-API-now-with-sub-millisecond-precision\n\
    ```\n\n至此，我们对JavaScript中基本异步函数的简要概述就结束了。但我们到底如何判断一个函数是否是异步的呢？在下一节中，我们将在编写自己的异步函数时思考这个问题。\n\
    \n## 1.3 编写异步函数\n\nJavaScript中的每个异步函数都是建立在其他一些异步函数之上的。异步函数一路向下（到原生代码）都是如此！\n\n\
    反过来也是对的：任何使用异步函数的函数都必须以异步方式提供该操作的结果。正如我们从*阻塞线程*（第2页）中学到的，JavaScript没有提供一种机制来防止函数在异步操作完成之前返回。事实上，在函数返回之前，不会触发任何异步事件。\n\
    \n### 何时函数是异步的？\n\n异步*函数*这个术语有点用词不当：如果你调用一个函数，程序将不会继续执行，直到该函数返回。当JavaScript程序员称一个函数为“异步”时，他们的意思是可以导致另一个函数（当作为参数传递给该函数时称为回调[4]）稍后从事件队列中运行。\n\
    \n因此，*一个接受回调的异步函数永远不会通过这个测试*：\n\n```javascript\nvar functionHasReturned = false;\n\
    asyncFunction(function() {\n    console.assert(functionHasReturned);\n})\n\nfunctionHasReturned\
    \ = true;\n```\n\n异步函数的另一个术语是*非阻塞*。这个术语强调了它们的速度：使用异步MySQL驱动程序进行的查询可能需要一个小时，但发送该查询的函数将在微秒内返回——对于需要快速处理大量传入请求的Web服务器来说，这是一个福音。\n\
    \n通常，接受回调的函数将其作为最后一个参数。（遗憾的是，著名的setTimeout和setInterval是此约定的例外。）但是一些异步函数通过返回Promise或使用PubSub间接接受回调。我们将在本书后面了解这些模式。\n\
    \n不幸的是，确保一个函数是否是异步的唯一方法是检查其源代码。一些同步函数的API看起来是异步的，要么是因为它们将来可能变成异步，要么是因为回调提供了一种返回多个参数的便捷方式。如有疑问，请不要依赖函数是异步的。\n\
    \n## 有时异步的函数\n\n有些函数有时是异步的，有时不是。例如，jQuery的同名函数（通常别名为$）可用于将函数延迟到DOM加载完成。但如果DOM已经加载完成，则没有延迟；其回调会立即触发。\n\
    \n如果你不小心，这种不可预测的行为可能会让你陷入很多麻烦。我见过（也犯过）的一个错误是假设$会在页面上其他脚本加载后运行函数。\n\n```html\n\
    // application.js\n$(function() {\n    utils.log('Ready');\n});\n\n// utils.js\n\
    window.utils = {\n    log: function() {\n        if (window.console) console.log.apply(console,\
    \ arguments);\n    }\n};\n<script src=\"application.js\"></script>\n<script src=\"\
    util.js\"></script>\n```\n\n这段代码运行正常——除非浏览器从缓存加载页面，导致DOM在脚本运行之前就准备就绪。当这种情况发生时，传递给$的回调在utils.log设置之前运行，导致错误。（我们可以通过采用更现代的客户端依赖管理方法来避免这种情况。参见第6章“异步脚本加载”，第69页。）\n\
    \n让我们看另一个例子。\n"
