    \n# CHAPTER 5\n\n## Multithreading with Workers\n\nAt the start of this book,\
    \ I described events as an alternative to multithing. More precisely, events replace\
    \ a specific kind of multithreading, the kind where multiple parts of an application\
    \ process run simultaneously (either virtually, through interrupts, or physically\
    \ on multiple CPU cores). This gets to be a problem when code running in different\
    \ threads has access to the same data. Even a line as simple as\n\n```\n{ i++;\
    \ }\n```\n\ncan be a source of pernicious Heisenbugs¹ when it allows separate\
    \ threads to modify the same i at the same time. Thankfully, this kind of multithreading\
    \ is impossible in JavaScript.\n\nOn the other hand, distributing tasks across\
    \ multiple CPU cores is increasingly essential because those cores are no longer\
    \ making the same exponential gains in efficiency, year after year, that used\
    \ to be expected. So, we need multithreading. Does that mean abandoning event-based\
    \ programming?\n\nAu contraire! While running on a single thread isn't ideal,\
    \ naïvely distributing an app across multiple cores can be even worse. Multicore\
    \ systems slow to a crawl when those cores have to constantly talk to each other\
    \ to avoid stepping on each other's toes. It's much better to give each core a\
    \ separate job and then sync up occasionally.\n\nThat's precisely what workers\
    \ do in JavaScript. From the master thread of your application, you tell a worker,\
    \ \"Go run this code in a separate thread.\"\n\nThe worker can send you messages\
    \ (and vice versa), which take the form of (what else?) callbacks run from the\
    \ event queue. In short, you interact with different threads the same way you\
    \ do I/O in JavaScript.\n\n> 1. http://en.wikipedia.org/wiki/Heisenbug\n\nIn this\
    \ chapter, we'll look at workers in both their browser and Node manifestations,\
    \ and we'll discuss some practical applications.\n\n> ## Threads vs. Processes\n\
    \nIn this chapter, I throw around the words *thread* and *process* interchangeably.\
    \ At the operating system level, there's an important distinction: threads within\
    \ a process can share state, while separate processes can't. But in JavaScript,\
    \ concurrent code (as run by workers) never shares state. So, workers may be implemented\
    \ using lightweight OS threads, but they behave like processes.\n\nThere are Node\
    \ libraries, most notably, Threads-A-GoGo,a that allow you to break the state-sharing\
    \ rule for the sake of efficiency. Those are beyond the scope of this chapter,\
    \ which is concerned only with concurrency in standard JavaScript.\n\na. https://github.com/xk/node-threads-a-gogo\n\
    \n## 5.1 Web Workers\n\nWeb workers are part of the living standard widely known\
    \ as HTML5. To create one, you call the global Worker constructor with the URL\
    \ of a script.\n\n```\nvar worker = new Worker('worker.js');\nworker.addEventListener('message',\
    \ function(e) {\n  console.log(e.data);  // echo whatever was sent by postMessage\n\
    });\n```\n\n(Usually, we want only the data property from the message event. If\
    \ we were binding the same event handler to multiple workers, we could use e.target\
    \ to determine which worker emitted the event.)\n\nSo, now we know how to listen\
    \ to workers. Conveniently, the interface for talking to workers is symmetrical:\
    \ we use worker.postMessage to send it, and the worker uses self.addEventListener('message',\
    \ ...) to receive it. Here's a complete example:\n\n```\n// master script\nvar\
    \ worker = new Worker('boknows.js');\nworker.addEventListener('message', function(e)\
    \ {\n  console.log(e.data);\n});\nworker.postMessage('football');\nworker.postMessage('baseball');\n\
    \n// boknows.js\nself.addEventListener('message', function(e) {\n  self.postMessage('Bo\
    \ knows ' + e.data);\n});\n```\n\nYou can play with the message-passing interface\
    \ at a little site I created, the Web Worker Sandbox.² Any time you create a new\
    \ example, it gets a unique URL that you can share.\n\n## Restrictions on Web\
    \ Workers\n\nWeb workers are primarily intended to handle complex computations\
    \ without compromising DOM responsiveness. Potential uses include the following:\n\
    \n- Decoding video as it streams in with the Broadway implementation of the H.264\
    \ codec³\n- Encrypting communications with the Stanford JavaScript Crypto Library⁴\n\
    - Parsing text in a web-based editor, à la Ace⁵\n\nIn fact, Ace already does this\
    \ by default. When you type code into an Ace-based editor, Ace needs to perform\
    \ some pretty heavy string analysis before updating the DOM with appropriate syntax\
    \ highlighting. In modern browsers, that analysis is done on a separate thread,\
    \ ensuring that the editor remains smooth and responsive.\n\nTypically, the worker\
    \ will send the result of its computations to the master thread, which will then\
    \ update the page. Why not update the page directly? Mainly, to keep JavaScript's\
    \ async abstractions intact. If a worker could alter the page's markup, we'd end\
    \ up in the same place as Java, wrapping our DOM manipulation code in mutexes\
    \ and semaphores to avoid race conditions.\n\nLikewise, a worker can't see the\
    \ global window object or any other object in the master thread (or in other worker\
    \ threads). When an object is sent through postMessage, it's transparently serialized\
    \ and unserialized; think JSON.parse(JSON.stringify(obj)). So, changes to the\
    \ original object won't affect the copy in the other thread.\n\nEven the trusty\
    \ console object isn't available to workers. All a worker *can* see is its own\
    \ global object, called self, and everything bundled with it: standard JavaScript\
    \ objects like setTimeout and Math, plus the browser's Ajax methods.\n\nAh yes,\
    \ Ajax! A worker can use XMLHttpRequest freely. It can even use WebSocket if the\
    \ browser supports it. That means the worker can pull data directly from the server.\
    \ And if we're dealing with a lot of data (like, say, streaming video that needs\
    \ to be decoded), keeping it in one thread rather than serializing it with postMessage\
    \ is a big win.\n\nThere's also a special importScripts function that will (synchronously)\
    \ load and run the given script(s).\n\n```\nimportScripts('https://raw.github.com/gist/1962739/danika.js');\n\
    ```\n\nNormally, synchronous loading is a big no-no, but remember that we're in\
    \ a secondary thread here. As long as the worker has nothing else to do, blocking\
    \ is A-OK.\n\n². http://webworkersandbox.com/\n³. https://github.com/nicjohnson145/Broadway\n\
    ⁴. http://crypto.stanford.edu/sjcl/\n⁵. http://ace.ajax.org/\n\n## Which Browsers\
    \ Support Web Workers?\n\nOn the desktop, the Web Worker standard has been implemented\
    \ in Chrome, Firefox, and Safari for a couple of years, and it's in IE10. Mobile\
    \ support is spotty as well. The latest iOS Safari supports them, but the latest\
    \ Android browser doesn't. At the time of this writing, that translates into 59.12\
    \ percent browser support, according to Caniuse.com.⁶\n\nIn short, you can't count\
    \ on your site's users having web workers. You can, however, easily write a shim\
