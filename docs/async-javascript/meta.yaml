  - '[PAGE 49]


    # A Tale of Two Terminologies


    You might have noticed that I''ve been saying that I “trigger” a Promise when
    I resolve or reject it and that a Promise that''s been resolved or rejected has
    been “triggered.” This is a nonstandard term, but I''ll be using it throughout
    this chapter. jQuery, unfortunately, lacks a succinct term for a Promise that''s
    been either resolved or rejected, other than the cumbersome “nonpending.”


    A more sensible terminology is used in the Promises/A spec and its implementations:
    a Promise is either *fulfilled* or rejected; either way, it''s resolved. We''ll
    learn more about that in [Section 3.7, jQuery vs. Promises/A, on page 43](Section%203.7,%20jQuery%20vs.%20Promises/A,%20on%20page%2043).


    ```

    var promptPromise = promptDeferred.promise();

    ```


    promptPromise is just a copy of promptDeferred without the resolve/reject methods.
    It doesn''t matter whether we bind a callback to a Deferred or to its Promise,
    because they share the same callbacks internally. They also share the same state
    (“pending”, “resolved”, or “rejected”). This means that creating multiple Promises
    for a single Deferred would be pointless. In fact, jQuery will just give you the
    same object.


    ```

    var promise1 = promptDeferred.promise();

    var promise2 = promptDeferred.promise();

    console.log(promise1 === promise2);  // true

    ```


    And calling promise on a pure Promise just gives you a reference to the same object.


    ```

    console.log(promise1 === promise1.promise());  // true

    ```


    The only reason to use the promise method is encapsulation. If we pass promptPromise
    around but keep promptDeferred to ourselves, we can rest assured that none of
    our callbacks will fire until we want them to fire.


    To reiterate, every Deferred contains a Promise, and every Promise represents
    a Deferred. When you have a Deferred, you control its state. When you have a pure
    Promise, you can only read that state and attach callbacks.


    # Promises in the jQuery API


    I started the chapter with the example of Promises returned by jQuery''s Ajax
    functions ($.ajax, $.get, and $.post). Ajax is a perfect use case for Promises:
    every call to a remote server will either succeed or fail, and you''ll want to
    handle those cases differently. But Promises can be just as useful for local async
    operations, like animations.'
