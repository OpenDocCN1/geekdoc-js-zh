- md: " But when I started writing the book you're reading now, I decided that doing\
    \ it in CoffeeScript would needlessly limit its appeal. By and large, CoffeeScripters\
    \ understand JavaScript perfectly well, whereas code like square = (x) => x *\
    \ x might as well be hieroglyphics to JavaScript purists.¹⁴\n\nSo, if you're a\
    \ CoffeeScripter, my apologies for the curly braces. Rest assured that the lessons\
    \ you draw from this book will carry over to any altJS language.\n\n## Resources\
    \ for This Book\n\nThis book has a website at [http://pragprog.com/book/tbajs/async-javascript](http://pragprog.com/book/tbajs/async-javascript).\
    \ There you can download the example code used in the book, get up-to-date information,\
    \ and ask book-related questions in a friendly forum.\n\nFor more general JavaScript-related\
    \ questions, I (again) heartily recommend Stack Overflow.¹⁵ I have no affiliation\
    \ with the site, but I am an avid fan with a proud 23,000 reputation points (and\
    \ counting). Coherent, well-formatted questions there are almost always answered\
    \ promptly.\n\nFinally, if you want to contact me directly, you can reach me at\
    \ trevorburnham@gmail.com or on Twitter: @trevorburnham. I'm always happy to hear\
    \ from my readers.\n\nEnough introduction. Let's get our async on!\n\n14. However,\
    \ maybe not for long: [http://wiki.ecmascript.org/doku.php?id=harmony:arrow_function_syntax](http://wiki.ecmascript.org/doku.php?id=harmony:arrow_function_syntax).\n\
    \n15. [http://stackoverflow.com/](http://stackoverflow.com/)\n\n## CHAPTER 1\n\
    \n## Understanding JavaScript Events\n\nEvents. How *do* they work? Confusion\
    \ about JavaScript's asynchronous event model is as old as JavaScript itself.\
    \ Confusion leads to bugs, bugs lead to anger, and Yoda taught us the rest....\n\
    \nYet at heart, JavaScript events are both conceptually elegant and practical.\
    \ Once you've accepted the language's single-threaded design, it feels like a\
    \ feature rather than a limitation. It means that your code is uninterruptible\
    \ and that the events you schedule line up in an orderly fashion.\n\nIn this chapter,\
    \ we'll take a tour of JavaScript's asynchronous mechanisms and dispel some common\
    \ misconceptions. We'll see what setTimeout *really* does. Then we'll discuss\
    \ handling errors in callbacks. Finally, we'll set up the main theme of this book:\
    \ organizing async code for clarity and maintainability.\n\n### 1.1 Scheduling\
    \ Events\n\nWhen we want to make a piece of code run in the future in JavaScript,\
    \ we put it in a *callback*. A callback is just an ordinary function, except that\
    \ it's passed to a function like setTimeout or bound as a property like document.onready.\
    \ When a callback runs, we say that an event (e.g., the timeout elapsing or the\
    \ document becoming ready) has fired.\n\nOf course, the devil is in the details,\
    \ even for something as seemingly simple as setTimeout. A common description of\
    \ setTimeout goes something like this:\n\n> Given a callback and a delay of *n*\
    \ milliseconds, setTimeout runs that callback *n* milliseconds later.\n\nBut as\
    \ we'll see in this section, and throughout this chapter, that description is\
    \ seriously flawed. In most cases, it's only approximately true. In others, it's\
    \ flat-out wrong. To truly understand setTimeout, we have to understand the JavaScript\
    \ event model as a whole.\n\n### Now or Later?\n\nTo begin our exploration of\
    \ setTimeout, let's look at a simple example of a situation that often mystifies\
    \ new JavaScripters, especially those coming from multithreaded languages like\
    \ Java and Ruby.\n\n```\nEventModel/loopWithTimeout.js\nfor (var i = 1; i <= 3;\
    \ i++) {\n  setTimeout(function() { console.log(i); }, 0);\n};\n```\n\n4\n4\n\
    4\n\nMost newcomers to the language would expect the loop to produce the output\
    \ 1, 2, 3, or perhaps a juxtaposition of those three numbers as the three timeouts\
    \ (each scheduled to go off in 0 milliseconds) race to fire first.\n\nTo understand\
    \ why the output is 4, 4, 4 instead, there are three things you need to know.\n\
    \n- There's only one variable named i, scoped by the declaration var i (which,\
    \ incidentally, scopes it not within the loop but within the closest function\
    \ containing the loop).\n\n- After the loop, i===4, having been incremented until\
    \ it failed the condition i<=3.\n\n- JavaScript event handlers don't run until\
    \ the thread is free.\n\nThe first two concepts are in the realm of JavaScript\
    \ 101, but the third comes as more of a surprise. When I first started using JavaScript,\
    \ I didn't quite believe it. Java had trained me to fear that my code could be\
    \ interrupted at any moment. A million potential edge cases filled me with anxiety\
    \ as I wondered, \"What if a rare event happened between these two lines of code?\"\
    \n\nAnd then one day, that burden was lifted from me....\n\n### Blocking the Thread\n\
    \nThis piece of code demolished my preconceptions about JavaScript events:\n\n\
    ```\nEventModel/loopBlockingTimeout.js\nvar start = new Date;\nsetTimeout(function(){\n\
    \  var end = new Date;\n  console.log('Time elapsed:', end - start, 'ms');\n},\
    \ 500);\nwhile (new Date - start < 1000) {};\n```\n\nIn my multithreaded mind-set,\
    \ I'd expected only 500ms to go by before the timed function ran. But that would\
    \ have required the loop, designed to last a full second, to be interrupted. Instead,\
    \ if you run the code, you'll get something like this:\n\n```\n< Time elapsed:\
    \ 1002ms\n```\n\nYou'll probably get a slightly different number; setTimeout and\
    \ setInterval are, alas, a lot less precise than you'd hope (see *Timing Functions,\
    \ on page 5*). But it will definitely be at least 1000, because the setTimeout\
    \ callback can't fire until the while loop has finished running.\n\nSo, if setTimeout\
    \ isn't using another thread, then what is it doing?\n\n### Meet the Queue\n\n\
    When we call setTimeout, a timeout event is *queued*. Then execution continues:\
    \ the line after the setTimeout call runs, and then the line after that, and so\
    \ on, until there are no lines left. Only then does the JavaScript virtual machine\
    \ ask, \"What's on the queue?\"\n\nIf there's at least one event on the queue\
    \ that's eligible to \"fire\" (like a 500ms timeout that was set 1000ms ago),\
    \ the VM will pick one and call its [handler](#) (e.g., the function we passed\
    \ in to setTimeout). When the handler returns, we go back to the queue.\n\nInput\
    \ events work the same way: when a user clicks a DOM element with a click handler\
    \ attached, a click event is queued. But the handler won't be executed until all\
    \ currently running code has finished (and, potentially, until after other events\
    \ have had their turn). That's why web pages that use JavaScript imprudently tend\
    \ to become unresponsive.\n\nYou might sometimes hear the term *event loop* used\
    \ to describe how the queue works. It's as if your code is being run from a loop\
    \ that looks like this:\n\n```\nrunYourScript();\nwhile (atLeastOneEventIsQueued)\
    \ {\n  fireNextQueuedEvent();\n};\n```\n\nOne implication of this is that each\
    \ event that fires will be at the root of the stack trace. We'll learn more about\
    \ that in [Section 1.4, Handling Async Errors, on page 12](#).\n\nThe ease of\
    \ event scheduling in JavaScript is one of the language's most powerful features.\
    \ Async functions like setTimeout make delayed execution simple, without spawning\
    \ threads. JavaScript code can never be interrupted, because events can be queued\
    \ only while code is running; they can't *fire* until it's done.\n\nIn the next\
    \ section, we'll take a closer look at the building blocks of async JavaScript.\n\
    \n### 1.2 Types of Async Functions\n\nEach JavaScript environment comes with its\
    \ own set of async functions. Some, like setTimeout and setInterval, are ubiquitous.\
    \ Others are unique to certain browsers or server-side frameworks. The async functions\
    \ provided by the JavaScript environment generally fall into two categories: I/O\
    \ and timing. These are the basic building blocks that you'll use to define complex\
    \ async behaviors in your applications.\n\n### I/O Functions\n\nNode.js wasn't\
    \ created so that people could run JavaScript on the server. It was created because\
    \ Ryan Dahl wanted an event-driven server framework built on a high-level language.\
    \ JavaScript just happened to be the right language for the job. Why? Because\
    \ the language is a perfect fit for *nonblocking* I/O.\n\nIn other languages,\
    \ it's tempting to \"block\" your application (typically by running a loop) until\
    \ an I/O request completes. In JavaScript, that approach isn't even possible.\
    \ A loop like this will run forever:\n\n```\nvar ajaxRequest = new XMLHttpRequest;\n\
    ajaxRequest.open('GET', url);\najaxRequest.send(null);\nwhile (ajaxRequest.readyState\
    \ === XMLHttpRequest.UNSENT) {\n  // readyState can't change until the loop returns\n\
    };\n```\n\nInstead, you need to attach a handler and return to the event queue.\n\
    \n```\nvar ajaxRequest = new XMLHttpRequest;\najaxRequest.open('GET', url);\n\
    ajaxRequest.send(null);\najaxRequest.onreadystatechange = function() {\n  // ...\n\
    };\n```\n\nThat's how it goes. Whether you're waiting for a keypress from the\
    \ user or a batch of data from a remote server, you need to define a callback—unless\
    \ your JavaScript environment gives you a synchronous I/O function that does the\
    \ blocking for you."
  mdcn: "\n但当我开始撰写你正在阅读的这本书时，我决定使用CoffeeScript编写会不必要地限制它的吸引力。总的来说，CoffeeScript用户非常精通JavaScript，而像`square\
    \ = (x) => x * x`这样的代码对JavaScript纯粹主义者来说可能如同象形文字。¹⁴\n\n所以，如果你是一位CoffeeScript用户，对于花括号的使用，我深表歉意。请放心，你从这本书中获得的经验教训将适用于任何替代JavaScript的语言。\n\
    \n## 本书资源\n\n本书的网站地址是 [http://pragprog.com/book/tbajs/async-javascript](http://pragprog.com/book/tbajs/async-javascript)。在那里，你可以下载书中使用的示例代码，获取最新信息，并在一个友好的论坛中提出与本书相关的问题。\n\
    \n对于更通用的JavaScript相关问题，我（再次）真诚地推荐Stack Overflow。¹⁵ 我与该网站没有关联，但我是一名热心的粉丝，拥有令人自豪的23,000个声望点（且还在增长）。在那里，表述清晰、格式规范的问题几乎总能迅速得到解答。\n\
    \n最后，如果你想直接联系我，可以通过trevorburnham@gmail.com或Twitter：@trevorburnham联系我。我总是很高兴收到读者的来信。\n\
    \n介绍到此为止。让我们开始异步之旅吧！\n\n14. 然而，可能不会持续太久：[http://wiki.ecmascript.org/doku.php?id=harmony:arrow_function_syntax](http://wiki.ecmascript.org/doku.php?id=harmony:arrow_function_syntax)。\n\
    \n15. [http://stackoverflow.com/](http://stackoverflow.com/)\n\n## 第1章\n\n## 理解JavaScript事件\n\
    \n事件。它们*到底*是如何工作的？关于JavaScript异步事件模型的困惑与JavaScript本身一样古老。困惑导致错误，错误引发愤怒，而尤达大师告诉了我们剩下的道理....\n\
    \n然而在本质上，JavaScript事件既概念优雅又实用。一旦你接受了这门语言的单线程设计，它感觉就像是一个特性而非限制。这意味着你的代码是不可中断的，并且你安排的事件会有序地排队。\n\
    \n在本章中，我们将浏览JavaScript的异步机制，并消除一些常见的误解。我们将看看`setTimeout`*真正*做了什么。然后我们将讨论在回调中处理错误。最后，我们将确立本书的主题：组织异步代码以提高清晰度和可维护性。\n\
    \n### 1.1 安排事件\n\n在JavaScript中，当我们想让一段代码在未来某个时间运行时，会将其放入一个*回调*中。回调只是一个普通函数，只不过它被传递给像`setTimeout`这样的函数，或者被绑定为像`document.onready`这样的属性。当回调运行时，我们说一个事件（例如，超时到期或文档准备就绪）被触发了。\n\
    \n当然，细节决定成败，即使对于`setTimeout`这样看似简单的东西也是如此。对`setTimeout`的一个常见描述是这样的：\n\n> 给定一个回调和*n*毫秒的延迟，`setTimeout`会在*n*毫秒后运行该回调。\n\
    \n但正如我们将在本节以及整个本章中看到的，这个描述存在严重缺陷。在大多数情况下，它只是近似正确。在其他情况下，它完全错误。要真正理解`setTimeout`，我们必须理解整个JavaScript事件模型。\n\
    \n### 现在还是以后？\n\n为了开始我们对`setTimeout`的探索，让我们看一个简单例子，它经常让JavaScript新手感到困惑，特别是那些来自Java和Ruby等多线程语言的开发者。\n\
    \n```\nEventModel/loopWithTimeout.js\nfor (var i = 1; i <= 3; i++) {\n  setTimeout(function()\
    \ { console.log(i); }, 0);\n};\n```\n\n4\n4\n4\n\n大多数语言新手会期望循环输出1, 2, 3，或者也许是这三个数字的某种组合，因为三个超时（每个都安排在0毫秒后触发）竞相首先触发。\n\
    \n要理解为什么输出是4, 4, 4而不是预期的结果，你需要知道三件事。\n\n- 只有一个名为`i`的变量，其作用域由声明`var i`决定（顺便说一句，它的作用域不是在循环内，而是在包含该循环的最近函数内）。\n\
    \n- 循环结束后，`i===4`，因为在循环条件`i<=3`失败之前它一直在递增。\n\n- JavaScript事件处理程序在主线程空闲之前不会运行。\n\
    \n前两个概念属于JavaScript入门知识，但第三个则更令人惊讶。当我刚开始使用JavaScript时，我对此并不完全相信。Java训练我担心我的代码可能随时被中断。数以百万计的潜在边缘情况让我充满焦虑，我想：“如果在这两行代码之间发生了一个罕见事件怎么办？”\n\
    \n然后有一天，这个负担从我身上卸下了....\n\n### 阻塞线程\n\n这段代码彻底改变了我对JavaScript事件的先入之见：\n\n```\n\
    EventModel/loopBlockingTimeout.js\nvar start = new Date;\nsetTimeout(function(){\n\
    \  var end = new Date;\n  console.log('Time elapsed:', end - start, 'ms');\n},\
    \ 500);\nwhile (new Date - start < 1000) {};\n```\n\n在我多线程的思维模式中，我原本期望定时函数在500毫秒后运行。但这需要设计为持续整整一秒的循环被中断。然而，如果你运行这段代码，你会得到类似这样的输出：\n\
    \n```\n< Time elapsed: 1002ms\n```\n\n你可能会得到一个略有不同的数字；遗憾的是，`setTimeout`和`setInterval`的精确度远不如你希望的那样（参见*第5页的“定时函数”*）。但它肯定会至少是1000毫秒，因为`setTimeout`的回调在`while`循环运行完成之前无法触发。\n\
    \n那么，如果`setTimeout`没有使用另一个线程，它到底在做什么呢？\n\n### 认识队列\n\n当我们调用`setTimeout`时，一个超时事件被*排入队列*。然后执行继续：`setTimeout`调用之后的那一行会运行，再之后的那一行也会运行，依此类推，直到没有更多行。只有那时JavaScript虚拟机才会问：“队列上有什么事件？”\n\
    \n如果队列上至少有一个有资格“触发”的事件（比如一个设置于1000毫秒前的500毫秒超时事件），虚拟机将选择一个并调用其[处理程序](#)（例如，我们传递给`setTimeout`的函数）。当处理程序返回后，我们又回到队列。\n\
    \n输入事件的工作方式相同：当用户点击一个附加了点击处理程序的DOM元素时，一个点击事件会被排入队列。但处理程序不会被执行，直到所有当前运行的代码完成（并且可能是在其他事件完成之后）。这就是为什么不谨慎使用JavaScript的网页往往变得无响应的原因。\n\
    \n你有时可能会听到*事件循环*这个术语，它描述了队列的工作原理。就好像你的代码是从一个看起来像这样的循环中运行的：\n\n```\nrunYourScript();\n\
    while (atLeastOneEventIsQueued) {\n  fireNextQueuedEvent();\n};\n```\n\n由此产生的一个结果是，每个触发的事件都将成为堆栈跟踪的根源。我们将在[第1.4节，处理异步错误，第12页](#)了解更多相关内容。\n\
    \nJavaScript中事件调度的简便性是这门语言最强大的特性之一。像`setTimeout`这样的异步函数使得延迟执行变得简单，而无需生成线程。JavaScript代码永远不会被中断，因为事件只能在代码运行时排队；它们不能在代码完成之前*触发*。\n\
    \n在下一节中，我们将更仔细地了解异步JavaScript的构建块。\n\n### 1.2 异步函数的类型\n\n每个JavaScript环境都自带一组异步函数。有些，如`setTimeout`和`setInterval`，是普遍存在的。其他一些则特定于某些浏览器或服务器端框架。JavaScript环境提供的异步函数通常分为两类：I/O和定时。这些是你将在应用程序中用于定义复杂异步行为的基本构建块。\n\
    \n### I/O函数\n\nNode.js的创建并非为了让人们能在服务器上运行JavaScript。它的创建是因为Ryan Dahl想要一个基于高级语言构建的事件驱动服务器框架。JavaScript恰好是这项工作的合适语言。为什么？因为这门语言非常适合*非阻塞*I/O。\n\
    \n在其他语言中，很容易“阻塞”你的应用程序（通常通过运行循环）直到I/O请求完成。在JavaScript中，这种做法甚至不可能。这样的循环将永远运行下去：\n\
    \n```\nvar ajaxRequest = new XMLHttpRequest;\najaxRequest.open('GET', url);\n\
    ajaxRequest.send(null);\nwhile (ajaxRequest.readyState === XMLHttpRequest.UNSENT)\
    \ {\n  // readyState在循环返回之前无法改变\n};\n```\n\n相反，你需要附加一个处理程序并返回到事件队列。\n\n```\nvar\
    \ ajaxRequest = new XMLHttpRequest;\najaxRequest.open('GET', url);\najaxRequest.send(null);\n\
    ajaxRequest.onreadystatechange = function() {\n  // ...\n};\n```\n\n事情就是这样。无论你是等待用户的按键还是来自远程服务器的一批数据，你都需要定义一个回调——除非你的JavaScript环境为你提供了一个执行阻塞的同步I/O函数。\n"
