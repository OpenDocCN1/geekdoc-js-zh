  mdcn: "\n# 异步 JavaScript\n\n用更少的代码构建更具响应性的应用\n\nTrevor Burnham\n\n## 对*Async JavaScript*的早期赞誉\n\
    \n> *Async JavaScript*是我所见过的第一本专注于当今 JavaScript 开发关键主题的完整著作：如何在不发疯的情况下处理并发和并发任务！为了您的理智，请阅读此书。\n\
    \n> **➤ Peter Cooper**，JavaScript Weekly 主编\n\nTrevor 提供了一份关于编写异步 JavaScript 的简明指南，在浏览器端和服务器端示例之间取得了完美平衡。既是指南，又是概述，引人入胜，这本书是任何希望提升水平的\
    \ JavaScript 开发者的必读之作。\n\n**➤ Wynn Netherland**，The Changelog 联合创始人\n\n这是一本关于\
    \ JavaScript 异步领域的完整指南。本书涵盖的概念和工具对于任何希望构建完整、结构良好且高效的 JavaScript 应用程序的人来说都是必不可少的。\n\
    \n> **➤ Julien Biezemans**，Ruby/JavaScript 开发者，Cucumber.js 作者\n\n## 目录与版权信息\n\n\
