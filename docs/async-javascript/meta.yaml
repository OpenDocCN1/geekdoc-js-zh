  md: "# Installing Node and Async.js\n\nTo follow along with this chapter, grab the\
    \ latest Node from [http://nodejs.org/](http://nodejs.org/). After installing,\
    \ you should be able to run npm, the Node package manager. Use this command to\
    \ install Async.js and Step:\n\n```\nnpm install -g async step\n```\n\nThen use\
    \ `node file.js` to run any JavaScript file.\n\n# 4.1 The Async Ordering Problem\n\
    \nSuppose we want to read all of the files in the recipes directory, in alphabetical\
    \ order, and then concatenate their contents into a single string and display\
    \ it. We could do this quite easily using synchronous methods.\n\n```\nAsyncjs/synchronous.js\n\
    var fs = require('fs');\nprocess.chdir('recipes'); // change the working directory\n\
    \nvar concatenation = '';\n\nfs.readdirSync('.')\n  .filter(function(filename)\
    \ {\n    // ignore directories\n    return fs.statSync(filename).isFile();\n \
    \ })\n  .forEach(function(filename) {\n    // add contents to our output\n   \
    \ concatenation += fs.readFileSync(filename, 'utf8');\n  });\n\nconsole.log(concatenation);\n\
    ```\n\n(Be aware that the forEach iterator isn't available in older JavaScript\
    \ environments, such as IE6. You can fix this with a library like Kris Kowal's\
    \ es5-shim.[^4] We'll learn how to serve this library to just the browsers that\
    \ need it in [Chapter 6, *Async Script Loading*, on page 69](#).)\n\nBut all this\
    \ blocking is terribly inefficient, particularly if our application could be doing\
    \ something else simultaneously. The problem is that we can't just naïvely replace\n\
    \n```\nconcatenation += fs.readFileSync(filename, 'utf8');\n```\n\nwith its async\
    \ analog\n\n[^4]: [https://github.com/kriskowal/es5-shim/](https://github.com/kriskowal/es5-shim/)"
