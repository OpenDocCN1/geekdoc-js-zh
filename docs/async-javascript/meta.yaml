    \n```\n<script defer src=\"deferredScript.js\">\n```\n\nAdding that `defer` attribute\
    \ tells the browser this: “Start loading this script right away, but don’t run\
    \ it until the document is ready and all previous scripts with `defer` have finished\
    \ running.” Placing a deferred script in the `<head>` of your document gives you\
    \ all the advantages of `<body>` placement, plus a substantial speed boost in\
    \ large documents!\n\nThe downside? `defer` isn’t supported by all browsers. Notably,\
    \ as of this writing, even the latest Opera ignores the attribute.4 That means\
    \ if you want to ensure that your deferred scripts run after the document is loaded,\
