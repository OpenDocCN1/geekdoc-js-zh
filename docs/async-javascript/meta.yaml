- md: " ## APPENDIX 1\n\n## Tools for Taming JavaScript\n\nThis appendix is an overview\
    \ of some of the more popular tools for writing async JavaScript code in a more\
    \ synchronous style. None of these tools is a substitute for a proper understanding\
    \ of JavaScript events. Instead, they can complement that understanding by adding\
    \ a few more tricks to your async repertoire.\n\n### A1.1 TameJS\n\nThe OkCupid\
    \ team has created a clever precompiler with more than 600 GitHub watchers (http://tamejs.org/)\
    \ that adds two keywords to JavaScript, await and defer. An await block defines\
    \ code that won't return until each async task defined with defer has been completed.\n\
    \n```\nawait {\n    setTimeout(defer(), 100);\n}\nconsole.log(\"this will run\
    \ after the 100ms timeout\");\n```\n\nThe TameJS folks have also created a CoffeeScript\
    \ fork with the same await/defer mechanism called IcedCoffeeScript (http://maxtaco.github.com/coffee-script/).\n\
    \n### A1.2 StratifiedJS\n\nStratifiedJS (http://onilabs.com/stratifiedjs) is an\
    \ alternative to the await/defer paradigm that offers finer-grained control structures,\
    \ with intuitive names like waitfor and resume.\n\n```\nconsole.log('this code\
    \ will run right away...');\nwaitfor() {\n    setTimeout(resume, 500);\n}\nconsole.log('...and\
    \ this will run 500ms later.');\n```\n\nAlthough not widely used, StratifiedJS\
    \ is an ambitious project that's received praise from the likes of John Resig\
    \ (the creator of jQuery).¹ Note that StratifiedJS is the name of the specification,\
    \ not the implementation; the official reference implementation is called Oni\
    \ Apollo.²\n\n### A1.3 Kaffeine\n\nKaffeine is a precompiler that touts itself\
    \ as \"Extended JavaScript.\"³ Among other features, the language offers a simple\
    \ syntactic sugar for un-nesting callbacks: just add ! after an async function's\
    \ name. Kaffeine assumes that the function takes a callback as its last argument\
    \ and simply transforms all code after that call into the callback.\n\nFor example,\
    \ in a jQuery application, it's common to want everything to run from within a\
    \ $ callback (after the document is ready). With Kaffeine, that's easily done.\n\
    \n```\n$!()\nalert('The document is ready.');\n```\n\nAlthough it doesn't have\
    \ as big a following as CoffeeScript, features like this make Kaffeine well worth\
    \ checking out. The CoffeeScript forks Coco and LiveScript have a similar feature,\
    \ which it calls backcalls. In Coco/LiveScript, the previous example would be\
    \ written like this:\n\n```\n<-$ \nalert 'The document is ready'\n```\n\nThe Kaffeine/Coco/LiveScript\
    \ approach provides much of the power of TameJS/StratifiedJS, with less of a learning\
    \ curve.\n\n### A1.4 Streamline.js\n\nLike Kaffeine, Streamline.js⁴ provides a\
    \ special syntax for transforming the code after an async function call into its\
    \ callback. Just use _ in place of the callback argument.\n\n```\nfor (var s =\
    \ 1; s < 60; s++) {\n  setTimeout(_, 1000);\n  console.log(s + ' seconds have\
    \ elapsed');\n}\nconsole.log('1 minute has elapsed');\n```\n\n---\n\n1. https://twitter.com/jeresig/statuses/164496725254479872\n\
    2. https://github.com/onilabs/apollo\n3. http://weepy.github.com/kaffeine/index.html\n\
    4. https://github.com/Sage/streamlinejs\n\nInterestingly, Streamline can generate\
    \ either standard callback-driven JavaScript or fiber-based code for node-fibers\
    \ (see the next section). Also, unlike most other JavaScript precompilers, Streamline\
    \ can be used in conjunction with CoffeeScript.\n\nNote that Streamline expects\
    \ callbacks to follow the Node-style argument list convention (err, results...),\
    \ which eases error handling in Node but makes it difficult to use for browser\
    \ development.\n\n### A1.5 Node-Fibers\n\nWhile the other projects I've listed\
    \ here merely compile to plain JavaScript, node-fibers actually extends the language\
    \ understood by the Node runtime by adding threadlike constructs called *fibers*\
    \ (http://en.wikipedia.org/wiki/Fiber_(computer_science)). A fiber can yield to\
    \ other fibers, suspending its own execution until an event causes it run again.\n\
    \n```\nvar fiber = Fiber.current;\nconsole.log('Yielding until the timeout elapses...')\n\
    setTimeout(function() {\n  fiber.run();\n}, 1000);\nFiber.yield();\nconsole.log('...1\
    \ second later');\n```\n\nThe main advantage of node-fibers over JavaScript precompilers\
    \ is debugging. The line numbers in node-fiber stack traces correspond to the\
    \ line numbers in node-fiber source code, and thrown exceptions can be caught\
    \ even when a fiber yields within a try/catch block.\n\n### A1.6 The Future of\
    \ JavaScript: Generators\n\nThe latest iteration of ECMAScript (the specification\
    \ that all mainstream JavaScript runtimes implement) defines a new JavaScript\
    \ feature called *generators*. A generator is a special type of function containing\
    \ a yield statement. A yield is like a return, except that the generator resumes\
    \ from that yield statement the next time it's run.\n\nConceptually, generators\
    \ are a little tricky. However, Mozilla's Task.js (http://taskjs.org/) library\
    \ shows how they can make async code simpler. Because generators can be resumed,\
    \ you can write code like this:\n\n```\ntask.spawn(function() {\n  console.log(\"\
    Yielding...\");\n  yield task.sleep(1000);\n  console.log(\"...resuming 1 second\
    \ later\");\n});\n```\n\nHere's how this code works: task.spawn runs our generator,\
    \ which is just a normal function except for the yield. task.sleep returns a Promise\
    \ (see Chapter 3, *Promises and Deferreds*, on page 31) that resolves in 1000ms.\
    \ task.spawn takes that Promise and attaches our generator as its resolve callback.\
    \ When the Promise resolves, our generator is called again, resuming after the\
    \ yield. It may sound complicated, but it works beautifully.\n\nECMAScript 6 (aka\
    \ Harmony) hasn't been finalized yet. Currently, the only major implementation\
    \ of generators is in the Firefox browser, and they're enabled only if you specify\
    \ a JavaScript version of at least 1.7 in your `<script>` tags, like so:\n\n```\n\
    <script type=\"application/javascript;version=1.7\">\n```\n\nIf generators appeal\
    \ to you, there is a tool that allows you to compile code that uses generators\
    \ (and other ECMAScript 5+ features) into widely supported JavaScript code: Google's\
    \ Traceur.⁵\n\n---\n\n5. http://code.google.com/p/traceur-compiler/\n\n## The\
    \ Pragmatic Bookshelf\n\nThe Pragmatic Bookshelf features books written by developers\
    \ for developers. The titles continue the well-known Pragmatic Programmer style\
