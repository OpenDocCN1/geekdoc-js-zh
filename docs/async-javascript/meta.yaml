    \ added the pipe method to Promises. Essentially, pipe\nsays this: “Give me a\
    \ callback for this Promise, and I'll give you a Promise\nthat represents the\
    \ result of that callback.\n\n```\nvar getPrompt = $.get('/query')\nvar postPromise\
    \ = getPromise.pipe(function(data) {\n    return $.post('/search', data)\n})\n\
    ```\n\nLooks like dark magic, right? Here's a breakdown: pipe takes one argument\n\
    for each type of callback: done, fail, and progress. So, in this example, we just\n\
    provided a callback that gets run when getPromise is resolved. The pipe method\n\
    returns a new Promise that’s resolved/rejected when the Promise returned\nfrom\
    \ our callback is resolved/rejected."
  - "[PAGE 56]\n\nEffectively, pipe is a window into the future!\n\nYou can also use\
    \ pipe to “filter” a Promise by modifying callback arguments. If a pipe callback\
    \ returns something other than a Promise/Deferred, then that value becomes the\
    \ callback argument. For instance, if you have a Promise that emits progress notifications\
    \ with a number between 0 and 1, you can use pipe to create an identical Promise\
    \ that emits progress notifications with a human-readable string instead.\n\n\
    ```\nvar promise2 = promise1.pipe(null, null, function(progress) {\n    return\
    \ Math.floor(progress * 100) + '% complete';\n});\n```\n\nTo summarize, there\
    \ are two things you can do from a pipe callback.\n\n+   - If you return a Promise,\
    \ the Promise returned by pipe will mimic it.\n- If you return a non-Promise value\
    \ (or nothing), the Promise returned by pipe will immediately be resolved, rejected,\
    \ or notified with that value, according to what just happened to the original\
    \ Promise.\n\npipe's rule for whether something is a Promise is the same as $.when's:\
    \ if it has a promise method, that method's return value is used as a Promise\
    \ representing the original object. Again, promise.promise() === promise.\n\n\
    # Pipe Cascading\n\npipe doesn't require you to provide every possible callback.\
    \ In fact, you'll usually just want to write\n\n```\nvar pipedPromise = originalPromise.pipe(successCallback);\n\
    ```\n\nor the following:\n\n```\nvar pipedPromise = originalPromise.pipe(null,\
    \ failCallback);\n```\n\nWe've seen what happens when the original Promise succeeds\
    \ in the first case, or fails in the second case, so that the piped Promise's\
    \ behavior depends on the return value of successCallback or failCallback. But\
    \ what about when we haven't given pipe a callback for what the original Promise\
    \ does?\n\nIt's simple. The piped Promise mimics the original Promise in those\
    \ cases. We can say that the original Promise's behavior cascades through the\
    \ piped Promise. This cascading is very handy, because it allows us to define\
    \ branching logic for async tasks with minimal effort. Suppose we have a three-step\
    \ process."
- md: "## 3.7 jQuery vs. Promises/A\n\nIn terms of capabilities, jQuery Promises and\
    \ Promises/A are nearly identical. Q.js, the most popular Promises/A library,\
    \ even offers methods that can work with jQuery Promises. The differences are\
    \ superficial; they use the same words to mean different things.\n\nAs previously\
    \ mentioned in Section 3.2, Making Promises, on page 33, jQuery uses the term\
    \ `resolve` as the opposite of `fail`, whereas Promises/A uses `fulfill`.\n\n\
    Under Promises/A, a Promise is said to be “resolved” when it’s either fulfilled\
    \ or failed.\n\nUp until the release of 1.8, jQuery’s `then` method was just a\
    \ shorthand for invoking `done`, `fail`, and `progress` simultaneously, while\
    \ Promises/A’s `then` acted more like jQuery’s `pipe`. jQuery 1.8 corrected this\
    \ by making `then` a synonym for `pipe`. However, any further reconciliation with\
    \ Promises/A is unlikely because of backward compatibility concerns.\n\nThere\
    \ are other, subtler differences as well. For instance, in Promises/A, whether\
    \ a Promise returned by `then` is fulfilled or rejected depends on whether the\
    \ invoked callback returns a value or throws an error. (Throwing errors from jQuery\
    \ Promise callbacks is a bad idea because they’ll go uncaught.)\n\nBecause of\
    \ these issues, you should try to avoid interacting with multiple Promise implementations\
    \ in the same project. If you’re just getting Promises from jQuery methods, use\
    \ jQuery Promises. If you’re using another library that gives you CommonJS Promises,\
    \ adopt Promises/A. Q.js makes it easy to “assimilate” jQuery Promises.\n\n```\n\
    var qPromise = Q.when(jqPromise);\n```\n\nAs long as these two standards remain\
    \ divergent, this is the best way to make them play nice together. For more information,\
    \ see the [Q.js docs](https://github.com/kriskowal/q).<sup>5</sup>\n\n## 3.8 Replacing\
    \ Callbacks with Promises\n\nIn a perfect world, every function that started an\
    \ async task would return a Promise. Unfortunately, most JavaScript APIs (including\
    \ the native functions available in all browsers and in Node.js) are callback-based,\
    \ not Promise-based. In this section, we’ll see how Promises can be used with\
    \ callback-based APIs.\n\nThe most straightforward way to use Promises with a\
    \ callback-based API is to create a Deferred and pass its trigger function(s)\
    \ as the callback argument(s). For example, with a simple async function like\
    \ `setTimeout`, we’d pass our Deferred’s `resolve` method.\n\n```\nvar timing\
    \ = new $.Deferred();\nsetTimeout(timing.resolve, 500);\n```\n\nIn cases where\
    \ an error could occur, we’d write a callback that conditionally routes to either\
    \ `resolve` or `reject`. For example, here’s how we’d work with a Node-style callback:\n\
    \n```\nvar fileReading = new $.Deferred();\nfs.readFile(filename, 'utf8', function(err)\
    \ {\n  if (err) {\n    fileReading.reject(err);\n  } else {\n    fileReading.resolve(Array.prototype.slice.call(arguments,\
    \ 1));\n  };\n});\n```\n\n(Yes, you can use jQuery from Node. Just npm install\
    \ jquery and use it like any other module. There's also a self-contained implementation\
    \ of jQuery-style Promises, simply called Standalone Deferred.<sup>6</sup>)\n\n\
    Writing this out routinely would be a drag, so why not make a utility function\
    \ to generate a Node-style callback from any given Deferred?\n\n```\ndeferredCallback\
    \ = function(deferred) {\n  return function(err) {\n    if (err) {\n      deferred.reject(err);\n\
    \    } else {\n      deferred.resolve(Array.prototype.slice.call(arguments, 1));\n\
    \    };\n  };\n}\n```\n\nWith that, we can write the previous example as follows:\n\
    \n```\nvar fileReading = new $.Deferred();\nfs.readFile(filename, 'utf8', deferredCallback(fileReading));\n\
    ```\n\nIn Q.js, Deferreds come with a node method for this right out of the box.\n\
    \n```\nvar fileReading = Q.defer();\nfs.readFile(filename, 'utf8', fileReading.node());\n\
    ```\n\nAs Promises become more popular, more and more JavaScript libraries will\
    \ follow jQuery's lead and return Promises from their async functions. Until then,\
    \ it takes only a few lines of code to turn any async function you want to use\
    \ into a Promise generator.\n\n## 3.9 What We've Learned\n\nIn my opinion, Promises\
    \ are one of the most exciting features to be added to jQuery in years. Not only\
    \ are they a big help in smoothing out the callback spaghetti that characterizes\
    \ typical Ajax-rich apps, but they also make it much easier to coordinate async\
    \ tasks of all kinds.\n\nUsing Promises takes some practice, especially when using\
    \ pipe, but it's a habit well worth developing. You'll be peering into the future\
    \ of JavaScript. The more APIs return Promises, the more compelling they become.\n\
    \nMicrosoft has announced that Windows 8's Metro environment will have a Promise-based\
    \ JavaScript API.<sup>7</sup> Where hipster developers and Microsoft both go,\
    \ the rest of the world is bound to follow.\n\n# CHAPTER 4 Flow Control with Async.js\n\
    \nUp to this point, this book has been about using abstractions to manage async\
    \ tasks throughout an application. PubSub, for instance, is an abstraction that\
    \ lets us distribute events from their source to other layers of the application\
    \ (e.g., from the view to the model). Promises are an abstraction that let us\
    \ represent simple tasks with objects that can be combined to represent complex\
    \ tasks. Together, these abstractions go a long way toward helping us solve the\
    \ problem of callback spaghetti.\n\nThere’s still one weak spot in our armor,\
    \ though: iteration. What do we do when we need to perform a series of I/O operations,\
    \ either in series or in parallel? This is such a common problem in the Node world\
    \ that it has a name: *flow control* (also called *control flow*). And the same\
    \ way that Underscore.js can dramatically simplify (synchronous) iterative code,\
    \ a good flow control library can strip away the boilerplate from your async code.\n\
    \nThe most popular of these libraries is Caolan McMahon’s powerful Async.js.<sup>1</sup>\
    \ In fact, as of this writing, Async.js is the third most required library in\
    \ the npm registry,<sup>2</sup> sharing the limelight with superstars like Underscore.js\
    \ and Express.\n\nIn this chapter, we’ll explore what Async.js can do in a Node\
    \ setting. (Async.js can run in the browser, too, but few client-side apps need\
    \ it.) We’ll also take a brief look at an alternative library, Tim Caswell’s sleek\
    \ Step.<sup>3</sup>\n\n## Installing Node and Async.js\n\nTo follow along with\
    \ this chapter, grab the latest Node from [http://nodejs.org/](http://nodejs.org/).\
    \ After installing, you should be able to run npm, the Node package manager. Use\
    \ this command to install Async.js and Step:\n\n```\nnpm install -g async step\n\
    ```\n\nThen use `node file.js` to run any JavaScript file.\n\n## 4.1 The Async\
    \ Ordering Problem\n\nSuppose we want to read all of the files in the recipes\
    \ directory, in alphabetical order, and then concatenate their contents into a\
    \ single string and display it. We could do this quite easily using synchronous\
    \ methods.\n\n```\nAsyncjs/synchronous.js\nvar fs = require('fs');\nprocess.chdir('recipes');\
    \ // change the working directory\n\nvar concatenation = '';\n\nfs.readdirSync('.')\n\
    \  .filter(function(filename) {\n    // ignore directories\n    return fs.statSync(filename).isFile();\n\
    \  })\n  .forEach(function(filename) {\n    // add contents to our output\n  \
    \  concatenation += fs.readFileSync(filename, 'utf8');\n  });\n\nconsole.log(concatenation);\n\
    ```\n\n(Be aware that the forEach iterator isn't available in older JavaScript\
    \ environments, such as IE6. You can fix this with a library like Kris Kowal's\
    \ es5-shim.<sup>4</sup> We'll learn how to serve this library to just the browsers\
    \ that need it in Chapter 6, *Async Script Loading*, on page 69.)\n\nBut all this\
    \ blocking is terribly inefficient, particularly if our application could be doing\
    \ something else simultaneously. The problem is that we can't just naïvely replace\n\
    \n```\nconcatenation += fs.readFileSync(filename, 'utf8');\n```\n\nwith its async\
    \ analog\n\n---\n<sup>5</sup> https://github.com/kriskowal/q\n<sup>6</sup> https://github.com/Mumakil/Standalone-Deferred\n\
    <sup>7</sup> http://msdn.microsoft.com/en-us/library/windows/apps/br211867.aspx\n\
    <sup>1</sup> https://github.com/caolan/async\n<sup>2</sup> https://npmjs.org/\n\
    <sup>3</sup> https://github.com/creationix/step\n<sup>4</sup> https://github.com/kriskowal/es5-shim/"
  mdcn: "\n## 3.7 jQuery 与 Promises/A\n\n就功能而言，jQuery Promise 与 Promises/A 几乎完全相同。最受欢迎的\
    \ Promises/A 库 Q.js 甚至提供了可与 jQuery Promise 配合使用的方法。这些差异只是表面上的；它们使用相同的词汇，但含义不同。\n\
    \n正如第 3.2 节《创建 Promise》（第 33 页）之前提到的，jQuery 将 `resolve` 一词用作 `fail` 的反义词，而 Promises/A\
    \ 则使用 `fulfill`。\n\n在 Promises/A 中，当一个 Promise 被满足或失败时，它被称为已“解决”。\n\n在 1.8 版本发布之前，jQuery\
    \ 的 `then` 方法只是同时调用 `done`、`fail` 和 `progress` 的简写，而 Promises/A 的 `then` 则更像 jQuery\
    \ 的 `pipe`。jQuery 1.8 通过将 `then` 设为 `pipe` 的同义词纠正了这一点。然而，由于向后兼容性问题，不太可能与 Promises/A\
    \ 进行进一步的协调。\n\n还有其他一些更微妙的差异。例如，在 Promises/A 中，`then` 返回的 Promise 是被满足还是被拒绝，取决于被调用的回调函数是返回值还是抛出错误。（从\
    \ jQuery Promise 回调中抛出错误是个糟糕的做法，因为这些错误不会被捕获。）\n\n由于这些问题，你应该尽量避免在同一项目中交互使用多个 Promise\
    \ 实现。如果你只是从 jQuery 方法获取 Promise，就使用 jQuery Promise。如果你使用另一个给你 CommonJS Promise\
    \ 的库，就采用 Promises/A。Q.js 使得“同化” jQuery Promise 变得非常简单。\n\n```\nvar qPromise =\
    \ Q.when(jqPromise);\n```\n\n只要这两个标准保持分歧，这就是让它们协同工作的最佳方式。更多信息，请参阅 [Q.js 文档](https://github.com/kriskowal/q)。<sup>5</sup>\n\
    \n## 3.8 用 Promise 替代回调\n\n在理想的世界里，每个启动异步任务的函数都会返回一个 Promise。不幸的是，大多数 JavaScript\
    \ API（包括所有浏览器和 Node.js 中可用的原生函数）都是基于回调的，而不是基于 Promise 的。在本节中，我们将看到如何将 Promise\
    \ 与基于回调的 API 结合使用。\n\n将 Promise 与基于回调的 API 结合使用的最直接方法是创建一个 Deferred，并将其触发函数作为回调参数传递。例如，对于像\
    \ `setTimeout` 这样的简单异步函数，我们会传递我们 Deferred 的 `resolve` 方法。\n\n```\nvar timing =\
    \ new $.Deferred();\nsetTimeout(timing.resolve, 500);\n```\n\n在可能发生错误的情况下，我们会编写一个回调函数，根据条件路由到\
    \ `resolve` 或 `reject`。例如，以下是我们如何处理 Node 风格回调的方式：\n\n```\nvar fileReading = new\
    \ $.Deferred();\nfs.readFile(filename, 'utf8', function(err) {\n  if (err) {\n\
    \    fileReading.reject(err);\n  } else {\n    fileReading.resolve(Array.prototype.slice.call(arguments,\
    \ 1));\n  };\n});\n```\n\n（是的，你可以从 Node 中使用 jQuery。只需 `npm install jquery` 并像使用任何其他模块一样使用它。也有一个独立的\
    \ jQuery 风格 Promise 实现，简单地称为 Standalone Deferred。<sup>6</sup>）\n\n每次这样写会很麻烦，为什么不创建一个实用函数，从任何给定的\
    \ Deferred 生成一个 Node 风格的回调呢？\n\n```\ndeferredCallback = function(deferred) {\n\
    \  return function(err) {\n    if (err) {\n      deferred.reject(err);\n    }\
    \ else {\n      deferred.resolve(Array.prototype.slice.call(arguments, 1));\n\
    \    };\n  };\n}\n```\n\n有了这个，我们可以将之前的例子写成：\n\n```\nvar fileReading = new $.Deferred();\n\
    fs.readFile(filename, 'utf8', deferredCallback(fileReading));\n```\n\n在 Q.js 中，Deferred\
    \ 开箱即带有一个 `node` 方法来处理这个。\n\n```\nvar fileReading = Q.defer();\nfs.readFile(filename,\
    \ 'utf8', fileReading.node());\n```\n\n随着 Promise 越来越流行，越来越多的 JavaScript 库将效仿\
    \ jQuery 的做法，在其异步函数中返回 Promise。在此之前，只需几行代码，你就可以将任何想要使用的异步函数转变为 Promise 生成器。\n\n\
    ## 3.9 我们学到了什么\n\n在我看来，Promise 是多年来添加到 jQuery 中最令人兴奋的特性之一。它们不仅极大地帮助我们理顺了典型 Ajax\
    \ 密集型应用中常见的回调地狱，而且也使协调各种异步任务变得更加容易。\n\n使用 Promise 需要一些练习，尤其是在使用 `pipe` 时，但这是一个值得培养的好习惯。你将窥见\
    \ JavaScript 的未来。返回 Promise 的 API 越多，它们就越有吸引力。\n\n微软已宣布 Windows 8 的 Metro 环境将拥有一个基于\
    \ Promise 的 JavaScript API。<sup>7</sup> 时尚开发者和微软都去的地方，世界其他地方也必然会跟随。\n\n# 第 4 章\
    \ 使用 Async.js 进行流控制\n\n到目前为止，本书一直在讨论使用抽象来管理整个应用程序中的异步任务。例如，PubSub 是一种抽象，允许我们将事件从其源分发到应用程序的其他层（例如，从视图到模型）。Promise\
    \ 是一种抽象，允许我们使用可组合的对象来表示简单任务，以表示复杂任务。这些抽象在帮助我们解决回调地狱问题方面大有帮助。\n\n然而，我们的盔甲中仍有一个弱点：迭代。当我们需要执行一系列\
    \ I/O 操作时，无论是串行还是并行，我们该怎么办？这在 Node 世界中是一个非常普遍的问题，它有一个名字：*流控制*（也称为*控制流*）。就像 Underscore.js\
    \ 可以极大地简化（同步）迭代代码一样，一个好的流控制库可以从你的异步代码中剥离掉样板代码。\n\n其中最受欢迎的库是 Caolan McMahon 强大的\
    \ Async.js。<sup>1</sup> 事实上，在撰写本文时，Async.js 是 npm 注册表中第三大最常被依赖的库，<sup>2</sup>\
    \ 与 Underscore.js 和 Express 等明星库共享聚光灯。\n\n在本章中，我们将探索 Async.js 在 Node 环境中的功能。（Async.js\
    \ 也可以在浏览器中运行，但很少有客户端应用需要它。）我们还将简要地看一下另一个替代库，Tim Caswell 的简洁 Step。<sup>3</sup>\n\
    \n## 安装 Node 和 Async.js\n\n要跟上本章内容，请从 [http://nodejs.org/](http://nodejs.org/)\
    \ 获取最新版的 Node。安装后，你应该能够运行 npm，即 Node 包管理器。使用此命令安装 Async.js 和 Step：\n\n```\nnpm\
    \ install -g async step\n```\n\n然后使用 `node file.js` 运行任何 JavaScript 文件。\n\n##\
    \ 4.1 Async 排序问题\n\n假设我们想要按字母顺序读取 recipes 目录中的所有文件，然后将它们的内容连接成一个字符串并显示出来。使用同步方法，我们可以相当轻松地完成这项工作。\n\
    \n```\nAsyncjs/synchronous.js\nvar fs = require('fs');\nprocess.chdir('recipes');\
    \ // 更改工作目录\n\nvar concatenation = '';\n\nfs.readdirSync('.')\n  .filter(function(filename)\
    \ {\n    // 忽略目录\n    return fs.statSync(filename).isFile();\n  })\n  .forEach(function(filename)\
    \ {\n    // 将内容添加到我们的输出\n    concatenation += fs.readFileSync(filename, 'utf8');\n\
    \  });\n\nconsole.log(concatenation);\n```\n\n（请注意，forEach 迭代器在较旧的 JavaScript\
    \ 环境（如 IE6）中不可用。你可以使用像 Kris Kowal 的 es5-shim 这样的库来解决这个问题。<sup>4</sup> 我们将在第 6\
    \ 章《异步脚本加载》（第 69 页）中学习如何将此库仅提供给需要它的浏览器。）\n\n但所有这些阻塞都极其低效，特别是如果我们的应用程序可以同时做其他事情。问题在于，我们不能天真地将\n\
    \n```\nconcatenation += fs.readFileSync(filename, 'utf8');\n```\n\n替换为其异步等效代码\n\
    \n---\n<sup>5</sup> https://github.com/kriskowal/q\n<sup>6</sup> https://github.com/Mumakil/Standalone-Deferred\n\
    <sup>7</sup> http://msdn.microsoft.com/en-us/library/windows/apps/br211867.aspx\n\
    <sup>1</sup> https://github.com/caolan/async\n<sup>2</sup> https://npmjs.org/\n\
    <sup>3</sup> https://github.com/creationix/step\n<sup>4</sup> https://github.com/kriskowal/es5-shim/\n"
