  - "[PAGE 10]\n\nWhatever the reason, JavaScript is here to stay. Apple got behind\
    \ JavaScript with WebKit and Safari. Microsoft is getting behind JavaScript with\
    \ Metro. Even Adobe is getting behind JavaScript with tools to generate HTML5\
    \ instead of Flash. What began as a humble browser feature has become arguably\
    \ the most important programming language in the world.\n\nThanks to the ubiquity\
    \ of web browsers, JavaScript has come closer than any other language to fulfilling\
    \ Java's old promise of “write once, run anywhere.” In 2007, Jeff Atwood coined\
    \ *Atwood's law*:\n\n> Any application that can be written in JavaScript will\
    \ eventually be written in JavaScript.³\n\n# Trouble in Paradise\n\nJavaScript\
    \ was conceived to be a single-threaded language where asynchronous tasks are\
    \ handled with events. When there are only a few potential events, event-based\
    \ code is much simpler than multithreaded code. It's conceptually elegant, and\
    \ it eliminates the need to wrap up data in mutexes and semaphores to make it\
    \ thread-safe. But when a number of events are expected, with state that needs\
    \ to be carried from one event to the next, that simplicity often gives way to\
    \ a code structure so terrifying that it's been dubbed the *Pyramid of Doom*.\n\
    \n```\nstep1(function(result1) {\n  step2(function(result2) {\n    step3(function(result3)\
    \ {\n      // and so on...\n    });\n  });\n});\n```\n\n“I love async, but I can't\
    \ code like this,” one developer famously complained on the Node.js Google Group.⁴\
    \ But the problem isn't with the language itself; it's with the way programmers\
    \ use the language. Dealing with complex sets of events in an elegant way is still\
    \ frontier territory in JavaScript.\n\nSo, let's push the frontier forward! Let's\
    \ prove to the world that even the most complex problems can be tackled with clean,\
    \ maintainable JavaScript code.\n\n+   3. http://www.codinghorror.com/blog/2007/07/the-principle-of-least-power.html\n\
    4. https://groups.google.com/forum/#!topic/nodejs/wzSUdkPICWg"
  - '[PAGE 11]


    # ## Who Is This Book For?


    This book is aimed at intermediate JavaSighters. You should know how variables
    are scoped. Keywords like typeof, arguments, and this shouldn''t faze you. Perhaps
    most importantly, you should understand that


    ```

    func(function(arg) { return next(arg); });

    ```


    is just a needlessly verbose way of writing


    ```

    func(next);

    ```


    except in rare cases. (See Reg Braithwaite''s excellent article "Captain Obvious
    on JavaScript" for more examples of small but important functional idioms.)


    What you *don''t* need to know is how asynchronous events are scheduled in JavaScript.
    We''ll cover that in the next chapter.


    # ## Resources for Learning JavaScript


    As JavaScript has become the *lingua franca* of the Web (not to mention mobile
    devices), a vast number of informative books, courses, and sites devoted to it
    have appeared. Here are a few that I recommend:


    +   - If you''re new to programming altogether, check out the interactive tutorial
    site Codecademy.

    - If you''re coming from another language and want to get up and running with
    JavaScript as a language for scripting the browser, take the interactive jQuery
    Air courses on CodeSchool.

    - If you want a more formal introduction to the JavaScript language, absorb Marijn
    Haverbeke''s *Eloquent JavaScript*.

    - If you''re a JavaScript beginner who wants to level up and avoid common pitfalls,
    spend some time in the JavaScript Garden.


    # ## Where to Turn for Help?


    When pondering questions like "Should I use typeof or instanceof here?" steer
    clear of the dated W3Schools site (which, regrettably, tends to be favored by
    Google searches). Instead, head to the Mozilla Developer Network (MDN).'
  - '[PAGE 12]


    The Mozilla Foundation (you may have heard of its browser, Firefox) is headed
    up by Brendan Eich, the creator of JavaScript. The foundation knows its stuff.


    If you can''t find your answer among MDN''s pages, take your question to Stack
    Overflow.¹¹ The site has fostered an amazingly helpful developer community, and
    it''s a safe bet that any coherent question tagged JavaScript will receive a punctual
    response.


    # Running the Code Examples


    This book is a bit unusual, in that I discuss both client-side (browser) and server-side
    (Node.js) code. That reflects the uniquely portable nature of JavaScript. The
    central concepts apply to all JavaScript environments, but certain examples are
    aimed at one or the other.


    Even if you have no interest in writing Node applications, I hope you''ll follow
    along by running these code snippets locally. See Running Code in Node.js, on
    page xiv for directions.


    # Which Examples Are Runnable?


    When you see a code snippet with a filename, that means it''s self-contained and
    can be run without modification. Here''s an example:


    ```

    Preface/stringConstructor.js

    console.log(''str''.constructor.name);

    ```


    The surrounding context should make it clear whether the code is runnable in the
    browser, in Node.js, or in both.


    When a code snippet doesn''t have a filename, that means it''s not self-contained.
    It may be part of a larger example, or it may be a hypothetical. Here''s an example:


    ```

    var tenSeconds = 10 * 1e3;

    setTimeout(launchSatellite, tenSeconds);

    ```


    These examples are meant to be read, not run.


    # Running Code in Node.js


    Node is very easy to install and use: just head to http://nodejs.org/, click Download,
    and run the Windows or OS X installer (or build from source on *nix). You can
    then run node from the command line to open a JavaScript REPL (analogous to Ruby''s
    irb environment).


