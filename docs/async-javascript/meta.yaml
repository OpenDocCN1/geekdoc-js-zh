  md: "In this chapter, we'll look at workers in both their browser and Node manifestations,\
    \ and we'll discuss some practical applications.\n\n> ## Threads vs. Processes\n\
    \nIn this chapter, I throw around the words *thread* and *process* interchangeably.\
    \ At the operating system level, there's an important distinction: threads within\
    \ a process can share state, while separate processes can't. But in JavaScript,\
    \ concurrent code (as run by workers) never shares state. So, workers may be implemented\
    \ using lightweight OS threads, but they behave like processes.\n\nThere are Node\
    \ libraries, most notably, Threads-A-GoGo,a that allow you to break the state-sharing\
    \ rule for the sake of efficiency. Those are beyond the scope of this chapter,\
    \ which is concerned only with concurrency in standard JavaScript.\n\na. [https://github.com/xk/node-threads-a-gogo](https://github.com/xk/node-threads-a-gogo)\n\
    \n# 5.1  Web Workers\n\nWeb workers are part of the living standard widely known\
    \ as HTML5. To create one, you call the global Worker constructor with the URL\
    \ of a script.\n\n```\nvar worker = new Worker('worker.js');\nworker.addEventListener('message',\
    \ function(e) {\n  console.log(e.data);  // echo whatever was sent by postMessage\n\
    });\n```\n\n(Usually, we want only the data property from the message event. If\
    \ we were binding the same event handler to multiple workers, we could use e.target\
    \ to determine which worker emitted the event.)\n\nSo, now we know how to listen\
    \ to workers. Conveniently, the interface for talking to workers is symmetrical:\
    \ we use worker.postMessage to send it, and the worker uses self.addEventListener('message',\
    \ ...) to receive it. Here's a complete example:\n\n```\n// master script\nvar\
    \ worker = new Worker('boknows.js');\nworker.addEventListener('message', function(e)\
    \ {\n  console.log(e.data);\n});\nworker.postMessage('football');\nworker.postMessage('baseball');\n\
    \n// boknows.js\nself.addEventListener('message', function(e) {\n  self.postMessage('Bo\
    \ knows ' + e.data);\n});\n```"
