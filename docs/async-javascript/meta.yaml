    Kris Kowal''s Q.js^2 and AJ ONeal''s Futures.^3 (In common usage, the terms *Promise*,
    *Deferred*, and *Future* are roughly synonymous.) **Q** is a fairly straightforward
    implementation of the Promises/A spec. Futures is a broader toolkit, incorporating
    many of the flow control features found in libraries like Async.js.


