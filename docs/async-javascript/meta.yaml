  md: 'In the browser, Ajax methods have an async option that can (but *should never,
    ever*) be set to false, bringing the entire browser pane to a halt until a response
    is received. In Node.js, synchronous API methods are clearly indicated with names
    like fs.readFileSync. These are convenient when writing short scripts but should
    be avoided when writing applications that need to handle multiple requests or
    operations in parallel. And these days, which applications don''t?


    Some I/O functions have both synchronous and async effects. For instance, when
    you manipulate the DOM in a modern browser, the changes are immediate from your
    script''s perspective but aren''t rendered until you return to the event queue.
    That prevents the DOM from being rendered in an inconsistent state. You can see
    a simple demonstration of this at <http://jsfiddle.net/TrevorBurnham/SNBYV/>


    # Is console.log Async?


    WebKit''s console.log has surprised many a developer by behaving asynchronously.
    In Chrome or Safari, this code will log {foo: bar}:


    ```

    EventModel/log.js

    var obj = {};

    console.log(obj);

    obj.foo = ''bar'';

    ```


    How does this happen? Rather than taking a snapshot of the object immediately,
    WebKit''s console.log stores a reference to the object and then takes a snapshot
    when the code returns to the event queue.


    Node''s console.log, on the other hand, is strictly synchronous, so the same code
    yields the output {}.


    Adapting to nonblocking I/O is one of the biggest hurdles that newcomers to JavaScript
    face, but it''s also one of the language''s key strengths. It makes writing efficient,
    event-based code feel natural.


    # Timing Functions


    We''ve seen how async functions are a natural fit for I/O operations, but sometimes
    we want asynchronicity for its own sake. That is, we want to make a function run
    at some point in the future, perhaps for an animation or a simulation. The well-known
    functions for time-based events are setTimeout and its repeating cousin, setInterval.


    Unfortunately, these well-known timer functions have their flaws. As we saw in
    *Blocking the Thread*, on page 2, one of those flaws is insurmountable: no JavaScript
    timing function can cause code to run while other code is running'
