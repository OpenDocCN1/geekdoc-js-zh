    fs.readFile('fhgwgaz.txt', function (error, data) {\n  if (err) {\n    return\
    \ console.error(err);\n  };\n  console.log(data.toString(\"utf8\"));\n});\n```\n\
    \n---\n\n在浏览器中，你可以将全局错误处理程序附加到 `window.onerror`。如果处理程序返回 true，它将阻止浏览器的默认错误处理行为。\n\
    \n```\nwindow.onerror = function(err) {\n  return true;  // 完全忽略所有错误\n};\n```\n\
    \n在生产环境中，你可能需要考虑使用 JavaScript 错误处理服务，例如 Errorception。⁷ Errorception 提供了一个现成的 `window.onerror`\
    \ 处理程序，将所有未捕获的异常报告给他们的服务器，然后服务器可以向你发送通知。\n\n## 在 Node.js 中\n\nNode 中与 `window.onerror`\
    \ 对应的是 `process` 对象的 `uncaughtException` 事件。通常，Node 应用程序会在未捕获的异常时立即退出。但只要存在至少一个\
    \ `uncaughtException` 处理程序，应用程序就会简单地返回到事件队列。\n\n```\nprocess.on('uncaughtException',\
    \ function(err) {\n  console.error(err); // 避免了关闭！\n});\n```\n\n然而，从 Node 0.8.4\
    \ 开始，`uncaughtException` 已被弃用。根据文档，⁸\n\n> uncaughtException 是一种非常粗糙的异常处理机制，将来可能会被移除……\n\
    \n不要使用它，改用 domain。\n\n什么是 domain？你可能会会问。Domain 是将 throw 转换为 'error' 事件的事件化对象。（我们将在第\
    \ 2 章第 19 页的\"分发事件\"中讨论更多关于事件化对象的内容。）以下是一个示例：\n\n```\nEventModel/domainThrow.js\n\
    var myDomain = require('domain').create();\nmyDomain.run(function() {\n  setTimeout(function()\
    \ {\n    throw new Error('Listen to me!');\n  }, 50);\n});\n\nmyDomain.on('error',\
    \ function(err) {\n  console.log('Error ignored!');\n});\n```\n\n7. http://errorception.com/\n\
    8. http://nodejs.org/docs/latest/api/process.html#process_event_uncaughtexception\n\
    \n超时事件中的 throw 只会触发 domain 的错误处理程序。\n\n< 错误被忽略了！\n\n很神奇，不是吗？Domain 让 throw 变得更加可接受了。不幸的是，它们只在\
    \ Node 0.8+ 中可用，而且截至本文撰写时，它们仍被视为实验性功能。更多信息请参阅 Node 文档。⁹\n\n无论你是在浏览器还是服务器上，全局异常处理程序都应被视为最后的手段。仅将它们用于调试。\n\
    \n## 抛出还是不抛出？\n\n当你收到一个错误时，最简单的做法就是抛出它。在 Node 代码中，你经常会看到如下所示的回调：\n\n```\nfunction(err)\
    \ {\n    if (err) throw err;\n    // ...\n}\n```\n\n我们将在第 4 章第 47 页的\"使用 Async.js\
    \ 进行流控制\"中经常使用这种习语。但在生产应用程序中，让常规异常和致命错误都冒泡到全局处理程序是不可接受的。在回调中使用 throw 是 JavaScript\
    \ 开发者说\"我现在不想考虑这个\"的方式。\n\n那么，抛出你知道会被捕获的异常呢？这同样是一个棘手的领域。2011 年，Isaac Schlueter（npm\
    \ 的创建者和 Node 开发的现任负责人）认为 try/catch 是一种反模式。¹⁰\n\n> Try/catch 是用漂亮的括号包裹的 goto。一旦错误被处理，就无法从上次中断的地方继续。更糟糕的是，在抛出错误的代码中，你根本不知道会跳转到哪里。当你返回错误码时，你正在履行一个契约。当你抛出时，你是在说：\"\
    我知道我在和你说话，但我现在要跳过你，直接和你的老板说话。\"这是无礼的。如果不是紧急情况，不要这样做；如果是紧急情况，那么我们应该崩溃。\n\nSchlueter\
    \ 主张将 throw 纯粹用作类似 assert 的构造，一种让应用程序在做出完全出乎意料的事情时停止运行的方式。Node 社区在很大程度上遵循了这一建议，尽管随着\
    \ domain 的出现，这种情况可能会改变。\n\n那么，当前处理异步错误的最佳实践是什么？我建议遵循 Schlueter 的建议：如果你想让整个应用程序停止，那就放心使用\
    \ throw。否则，请考虑一下应该如何处理错误。你想向用户显示错误消息？重试请求？唱一首《Daisy Bell》？那就近源处理，越接近eem_omon生成的源越好。\n\
    \n## 1.5 取消回调嵌套\n\nJavaScript 中最常见的反模式是在回调中嵌套回调。还记得引言中的\"末日金字塔\"吗？让我们来看一个你可能在\
    \ Node 服务器中看到的具体示例。\n\n```\nfunction checkPassword(username, passwordGuess, callback)\
    \ {\n  var queryStr = 'SELECT * FROM user WHERE username = ?';\n  db.query(selectUser,\
    \ username, function (err, result) {\n    if (err) throw err;\n    hash(passwordGuess,\
    \ function(passwordGuessHash) {\n      callback(passwordGuessHash === result['password_hash']);\n\
    \    });\n  });\n}\n```\n\n在这里，我们定义了一个异步函数（checkPassword），它触发另一个异步函数（db.query），后者又可能触发另一个异步函数（hash）。（如果不实际阅读它们的代码，不可能确定这些函数是否是异步的，但在这里做出这样的假设是合理的。）\n\
    \n这段代码有什么问题？现在，没什么。它能工作，而且简洁。但当我们尝试向其中添加新功能时，它就会变得非常棘手，比如处理数据库错误而不是抛出它（参见第 16\
    \ 页的\"抛出还是不抛出？\"），记录访问尝试、限流等等。\n\n嵌套回调诱使我们通过添加更多代码来添加更多功能，而不是以可管理、可重用的方式实现这些功能。下面这个\
    \ checkPassword 的等价实现避免了这种诱惑：\n\n```\nfunction checkPassword(username, passwordGuess,\
    \ callback) {\n  var passwordHash;\n  var queryStr = 'SELECT * FROM user WHERE\
    \ username = ?';\n  db.query(selectUser, username, queryCallback);\n\n  function\
    \ queryCallback(err, result) {\n    if (err) throw err;\n    passwordHash = result['password_hash'];\n\
    \    hash(passwordGuess, hashCallback);\n  }\n\n  function hashCallback(passwordGuessHash)\
    \ {\n    callback(passwordHash === passwordGuessHash);\n  }\n}\n```\n\n这种方法更冗长，但读起来更清晰，也更容易扩展。因为我们给了异步结果（passwordHash）更广泛的作\n\
    \n用域，所以我们有了更大的灵活性。\n\n作为一条规则，避免超过两层函数嵌套。关键是要想出一种方法，将异步结果存储在发起异步调用的函数之外，这样回调就不需要嵌套了。\n\
    \n如果这一切听起来很棘手，别担心。在后面的章节中，我们会看到很多异步事件在不嵌套处理程序的情况下按顺序运行的示例。\n\n## 1.6 我们学到了什么\n\
    \n在本章中，我们看到了 JavaScript 的单线程性既是福也是祸。在合适的人手中，它可以创造出美丽的代码，免受困扰多线程应用程序的可怕竞态条件的影响。但你需要培养正确的思维方式——以及正确的技术。\n\
    \n本书的其余部分将介绍用于在 JavaScript 中处理事件的库和设计模式。我们将要看到的所有示例都将在主流浏览器或未修改的 Node.js 中运行。然而，编写\
    \ JavaScript 并不是生成 JavaScript 代码的唯一方式。有关一些有趣的替代方案的概述，参见第 81 页的**附录 1，驯服 JavaScript\
    \ 的工具**。\n\n值得一提的是，JavaScript 中有一种多线程方式：你可以生成工作进程。每个生成的进程可以在与其他 I/O 相同的限制下与其他进程交换数据。工作进程使得利用多核成为可能，而不会违反\
    \ JavaScript 的规则（代码不能被中断；变量只能在其作用域内访问）。有关工作进程的更多信息，请跳至第 61 页的**第 5 章 使用工作进程进行多线程**。\n\
    \n接下来的两章将介绍基本的设计模式：PubSub，一种通过将回调分配给命名事件来组织回调的方式；以及 Promises，一种用于一次性事件的直观对象表示。\n"
