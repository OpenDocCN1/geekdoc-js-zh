    understand JavaScript perfectly well, whereas code like square = (x) => x * x
    might as well be hieroglyphics to JavaScript purists.¹⁴


    So, if you''re a CoffeeScripter, my apologies for the curly braces. Rest assured
    that the lessons you draw from this book will carry over to any altJS language.


