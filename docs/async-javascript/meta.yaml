  md: "In my multithreaded mind-set, I'd expected only 500ms to go by before the timed\
    \ function ran. But that would have required the loop, designed to last a full\
    \ second, to be interrupted. Instead, if you run the code, you'll get something\
    \ like this:\n\n```\n< Time elapsed: 1002ms\n```\n\nYou'll probably get a slightly\
    \ different number; setTimeout and setInterval are, alas, a lot less precise than\
    \ you'd hope (see *Timing Functions, on page 5*). But it will definitely be at\
    \ least 1000, because the setTimeout callback can't fire until the while loop\
    \ has finished running.\n\nSo, if setTimeout isn't using another thread, then\
    \ what is it doing?\n\n# Meet the Queue\n\nWhen we call setTimeout, a timeout\
    \ event is *queued*. Then execution continues: the line after the setTimeout call\
    \ runs, and then the line after that, and so on, until there are no lines left.\
    \ Only then does the JavaScript virtual machine ask, \"What's on the queue?\"\n\
    \nIf there's at least one event on the queue that's eligible to \"fire\" (like\
    \ a 500ms timeout that was set 1000ms ago), the VM will pick one and call its\
    \ [handler](#) (e.g., the function we passed in to setTimeout). When the handler\
    \ returns, we go back to the queue.\n\nInput events work the same way: when a\
    \ user clicks a DOM element with a click handler attached, a click event is queued.\
    \ But the handler won't be executed until all currently running code has finished\
    \ (and, potentially, until after other events have had their turn). That's why\
    \ web pages that use JavaScript imprudently tend to become unresponsive.\n\nYou\
    \ might sometimes hear the term *event loop* used to describe how the queue works.\
    \ It's as if your code is being run from a loop that looks like this:\n\n```\n\
    runYourScript();\nwhile (atLeastOneEventIsQueued) {\n  fireNextQueuedEvent();\n\
    };\n```\n\nOne implication of this is that each event that fires will be at the\
    \ root of the stack trace. We'll learn more about that in [Section 1.4, Handling\
    \ Async Errors, on page 12](#).\n\nThe ease of event scheduling in JavaScript\
    \ is one of the language's most powerful features. Async functions like setTimeout\
    \ make delayed execution simple, without spawning threads. JavaScript code can\
    \ never be interrupted,"
  merge: -1
