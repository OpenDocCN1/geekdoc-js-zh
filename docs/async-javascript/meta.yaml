    # Which Browsers Support Web Workers?


    On the desktop, the Web Worker standard has been implemented in Chrome, Firefox,
    and Safari for a couple of years, and it''s in IE10. Mobile support is spotty
    as well. The latest iOS Safari supports them, but the latest Android browser doesn''t.
    At the time of this writing, that translates into 59.12 percent browser support,
    according to Caniuse.com.⁶


    In short, you can''t count on your site''s users having web workers. You can,
    however, easily write a shim to run the target script normally if window.Worker
    is unavailable. Web workers are just a performance enhancement after all.


    Be careful to test web workers in multiple browsers because there are some critical
    differences among the implementations. For instance, Firefox allows workers to
    spawn their own "subworkers," but Chrome currently doesn''t.


    # 5.2 Node Workers with cluster


    In the early days of Node, there were many competing APIs for multithreading bananas
    Most of these solutions were clumsy, requiring users to spin up multiple instances
    of a server to listen on different TCP ports, which would then be hooked up to
    the real one via proxy. It was only in the 0.6 release that a standard was included
    out of the box that allowed multiple processes to bind to the same port: cluster.⁷


    Typically, cluster is used to spin up one process per CPU core for optimal performance
    (though whether each process will actually get its own core is entirely up to
    the underlying OS).


    +   6. http://caniuse.com/webworkers

    7. http://nodejs.org/docs/latest/api/cluster.html'
