    \ or not is to inspect its source code. Some functions that are synchronous have\
    \ an API that looks async， either because they might become async in the future\
    \ or because callbacks provide a convenient way to return multiple arguments.\
    \ When in doubt, don't depend on a function being async.\n\n# Sometimes-Async\
    \ Functions\n\nThere are functions that are async sometimes but not at other times.\
    \ For instance， jQuery's eponymous function (typically aliased as $) can be used\
    \ to delay a function until the DOM has finished loading. But if the DOM has already\
    \ finished loading, there's no delay; its callback fires immediately.\n\nThis\
    \ unpredictable behavior can get you in a lot of trouble if you aren't careful.\
    \ One mistake I've seen (and made myself) is assuming that $ will run a function\
    \ after other scripts on the page have loaded.\n\n```\n// application.js\n$(function()\
    \ {\n utils.log('Ready');\n});\n\n// utils.js\nwindow.utils = {\n log: function()\
    \ {\n if (window.console) console.log.apply(console , arguments);\n }\n};\n\n\
    <script src=\"application.js\"></script>\n<script src=\"util.js\"></script>\n\
    ```\n\nThis code works fine-unless the browser loads the page from the cache,\
    \ making the DOM ready before the script runs. When that happens, the callback\
    \ passed to $ runs before utils.log is set, causing an error. (We could avoid\
    \ this situation by taking a more modern approach to client-side dependency management.\
    \ See Chapter 6, Async Script Loading, on page 69.)\n\nLet's look at another example."
- md: " ## Async Functions with Caching\n\nA common variety of sometimes-async functions\
    \ is async request functions that cache their results. For example, suppose we're\
    \ writing a browser-based calculator that uses web workers to run calculations\
    \ in a separate thread. (We'll learn about the Web Worker API in [Chapter 5, Multithreading\
    \ with Workers, on page 61](https://example.com).) Our main script might look\
    \ like this:<sup>4</sup>\n\n```\nvar calculationCache = {},\n    calculationCallbacks\
    \ = {},\n    mathWorker = new Worker('calculator.js');\n\nmathWorker.addEventListener('message',\
    \ function(e) {\n    var message = e.data;\n    calculationCache[message.formula]\
    \ = message.result;\n    calculationCallbacks[message.formula](message.result);\n\
    });\n\nfunction runCalculation(formula, callback) {\n    if (formula in calculationCache)\
    \ {\n        return callback(calculationCache[formula]);\n    };\n    if (formula\
    \ in calculationCallbacks) {\n        return setTimeout(function() {\n       \
    \     runCalculation(formula, callback);\n        }, 0);\n    };\n    mathWorker.postMessage(formula);\n\
    \    calculationCallbacks[formula] = callback;\n}\n```\n\nHere, the `runCalculation`\
    \ function is synchronous when the result has already been cached but is asynchronous\
    \ otherwise. There are three possible scenarios.\n\n- The formula has already\
    \ been computed, so the result is in the calculationCache. In this case, `runCalculation`\
    \ is synchronous.\n- The formula has been sent to the worker, but the result hasn't\
    \ been received yet. In this case, `runCalculation` sets a timeout to call itself\
    \ again; the process will repeat until the result is in `calculationCache`.\n\
    - The formula hasn't yet been sent to the worker. In this case, we'll invoke the\
    \ callback from the worker's 'message' event listener.\n\nNotice that in scenarios\
    \ 2 and 3, we're waiting for a task to be completed in two different ways. I wrote\
    \ the example this way to illustrate common approaches when we're waiting for\
    \ something to change, like the value of the cached computation. Should we prefer\
    \ one approach over the other? Let's look at that next.\n\n## Async Recursion\
    \ vs. Callback Storage\n\nIn runCalculation, we waited for the worker to finish\
    \ its job by either repeating the same function call from a timeout (async recursion)\
    \ or simply storing a callback.\n\nWhich approach is best? At first glance, it\
    \ might seem easiest to use only async recursion, eliminating the need for the\
    \ calculationCallbacks object. Newcomers to JavaScript often use setTimeout for\
    \ this purpose because it resembles a common idiom of thread-based languages.\
    \ A Java version of this program would probably have a loop like this:\n\n```\n\
    while (!calculationCache.get(formula)) {\n  Thread.sleep(0);\n};\n```\n\nBut timeouts\
    \ aren't free. In large numbers, they can create a significant computational load.\
    \ The scary thing about async recursion is that there's no limit to the number\
    \ of timeouts that could be firing while we wait for the job to finish. Plus,\
    \ it makes our application's event structure unnecessarily complicated. For these\
    \ reasons, async recursion should be regarded as an anti-pattern.\n\nWe can avoid\
    \ async recursion in our calculator by storing an array of callbacks for each\
    \ formula.\n\n```\nvar calculationCache = {},\n    calculationCallbacks = {},\n\
    \    mathWorker = new Worker('calculator.js');\nmathWorker.addEventListener('message',\
    \ function(e) {\n  var message = e.data;\n  calculationCache[message.formula]\
    \ = message.result;\n  calculationCallbacks[message.formula]\n  .forEach(function(callback)\
    \ {\n    callback(message.result);\n  });\n});\n\nfunction runCalculation(formula,\
    \ callback) {\n  if (formula in calculationCache) {\n    return callback(calculationCache[formula]);\n\
    \  };\n```\n\n```\nif (formula in calculationCallbacks) {\n    return calculationCallbacks[formula].push(callback);\n\
    };\nmathWorker.postMessage(formula);\ncalculationCallbacks[formula] = [callback];\n\
    }\n```\n\nWithout the timeout, our code is much more straightforward, as well\
    \ as more efficient.\n\nIn general, avoid async recursion. It's necessary only\
    \ when you're dealing with a library that provides async functionality without\
    \ any kind of callback mechanism. And if you're ever in that situation, the first\
    \ thing you should do is write a patch for that library. Or find a better one.\n\
    \n## Mixing Returns and Callbacks\n\nIn both of our implementations of runCalculation,\
    \ we sometimes return a value. This was an arbitrary choice made for brevity.\
    \ The line\n\n```\nreturn callback(calculationCache[formula]);\n```\n\ncould easily\
    \ have been written as\n\n```\ncallback(calculationCache[formula]);\nreturn;\n\
    ```\n\nbecause the return value isn't intended to be used. This is a common idiom\
    \ in JavaScript, and it's usually harmless.\n\nHowever, some functions both return\
    \ a useful value and take a callback. In those cases, it's important to remember\
    \ that the callback will be called either synchronously (before the return) or\
    \ asynchronously (after the return).\n\nNever define a potentially synchronous\
    \ function that returns a value that might be useful in the callback. For example,\
    \ this function that opens a WebSocket⁵ connection to a given server (caching\
    \ to ensure only one connection per server) violates that rule:\n\n```\nvar webSocketCache\
    \ = {};\nfunction openWebSocket(serverAddress, callback) {\n  var socket;\n\n\
    \  if (serverAddress in webSocketCache) {\n    socket = webSocketCache[serverAddress];\n\
    \n    if (socket.readyState === WebSocket.OPEN) {\n      callback();\n```\n\n\
    +   5. https://developer.mozilla.org/en/WebSockets/\n\n```\n} else {\n  socket.onopen\
    \ = _.compose(callback, socket.onopen);\n};\n} else {\n  socket = new WebSocket(serverAddress);\n\
    \  webSocketCache[serverAddress] = socket;\n  socket.onopen = callback;\n};\n\
    return socket;\n};\n```\n\n(This code relies on the Underscore.js library. _.compose\
    \ defines a new function that runs both callback and the original socket.onopen\
    \ callback.⁶)\n\nThe problem with this code is that if the socket is already cached\
    \ and open, then the callback will run before the function returns, breaking this\
    \ code:\n\n```\nvar socket = openWebSocket(url, function() {\n  socket.send('Hello,\
    \ server!');\n});\n```\n\nThe solution? Wrap the callback in a setTimeout.\n\n\
    ```\nif (socket.readyState === WebSocket.OPEN) {\n  setTimeout(callback, 0);\n\
    } else {\n  // ...\n}\n```\n\nUsing a timeout here may feel like a kludge, but\
    \ it's much better than having an inconsistent API.\n\nIn this section, we've\
    \ seen several best practices for writing async functions. Don't rely on a function\
    \ always being async, unless you've read its source code. Avoid using timer methods\
    \ to wait for something to change. When returning a value and running a callback\
    \ from the same function, make sure the callback runs after the return.\n\nThis\
    \ is a lot of information to take in at once, but writing good async functions\
    \ is key to writing good JavaScript.\n\n## 1.4 Handling Async Errors\n\nLike many\
    \ modern languages, JavaScript allows you to throw exceptions and catch them in\
    \ a try/catch block. If uncaught, most environments will give you a helpful stack\
    \ trace. For example, this code will throw an exception because '{' is invalid\
    \ JSON:\n\n6. http://documentcloud.github.com/underscore/#compose\n\n```\nEventModel/stackTrace.js\n\
    function JSONToObject(jsonStr) {\n  return JSON.parse(jsonStr);\n}\nvar obj =\
    \ JSONToObject('{');\n```\n\n> SyntaxError: Unexpected end of input\n>     at\
    \ Object.parse (native)\n>     at JSONToObject (/AsyncJS/stackTrace.js:2:15)\n\
    >     at Object.<anonymous> (/AsyncJS/stackTrace.js:4:11)\n\nThe stack trace tells\
    \ us not only where the error was thrown from but also where the original mistake\
    \ was made: line 4. Unfortunately, tracking down the causes of async errors isn't\
    \ as straightforward. In this section, we'll see why throw is rarely the right\
    \ tool for handling errors in callbacks and how async APIs are designed around\
    \ this limitation.\n\n## Throwing from Callbacks\n\nWhat happens when we throw\
    \ an error from an async callback? Let's run a test.\n\n```\nEventModel/nestedErrors.js\n\
    setTimeout(function A() {\n  setTimeout(function B() {\n    setTimeout(function\
    \ C() {\n      throw new Error('Something terrible has happened!');\n    }, 0);\n\
    \  }, 0);\n}, 0);\n```\n\nThe result of this application is an extraordinarily\
    \ short stack trace.\n\n> Error: Something terrible has happened!\n>     at Timer.C\
    \ (/AsyncJS/nestedErrors.js:4:13)\n\nWait a minute—what happened to A and B? Why\
    \ aren't they in the stack trace? Well, because they weren't on the stack when\
    \ C ran. Each of the three functions was run directly from the event queue.\n\n\
    For the same reason, we can't catch errors thrown from async callbacks with a\
    \ try/catch block. Here's a demonstration:\n\n```\nEventModel/asyncTry.js\ntry\
    \ {\n  setTimeout(function() {\n    throw new Error('Catch me if you can!');\n\
    \  }, 0);\n} catch (e) {\n  console.error(e);\n}\n```"
  mdcn: "\n## 带缓存的异步函数\n\n一种常见的有时异步的函数是缓存其结果的异步请求函数。例如，假设我们正在编写一个基于浏览器的计算器，该计算器使用\
    \ Web Worker 在单独的线程中运行计算。（我们将在[第 5 章，使用 Worker 进行多线程，见第 61 页](https://example.com)学习\
    \ Web Worker API。）我们的主脚本可能如下所示：<sup>4</sup>\n\n```\nvar calculationCache = {},\n\
    \    calculationCallbacks = {},\n    mathWorker = new Worker('calculator.js');\n\
    \nmathWorker.addEventListener('message', function(e) {\n    var message = e.data;\n\
    \    calculationCache[message.formula] = message.result;\n    calculationCallbacks[message.formula](message.result);\n\
    });\n\nfunction runCalculation(formula, callback) {\n    if (formula in calculationCache)\
    \ {\n        return callback(calculationCache[formula]);\n    };\n    if (formula\
    \ in calculationCallbacks) {\n        return setTimeout(function() {\n       \
    \     runCalculation(formula, callback);\n        }, 0);\n    };\n    mathWorker.postMessage(formula);\n\
    \    calculationCallbacks[formula] = callback;\n}\n```\n\n这里，当结果已被缓存时，`runCalculation`\
    \ 函数是同步的，否则是异步的。有三种可能的场景。\n\n- 公式已经计算完毕，因此结果在 calculationCache 中。在这种情况下，`runCalculation`\
    \ 是同步的。\n- 公式已发送给 Worker，但尚未收到结果。在这种情况下，`runCalculation` 设置一个超时来再次调用自身；该过程将重复，直到结果出现在\
    \ `calculationCache` 中。\n- 公式尚未发送给 Worker。在这种情况下，我们将从 Worker 的 'message' 事件监听器中调用回调。\n\
    \n请注意，在场景 2 和 3 中，我们以两种不同的方式等待任务完成。我这样写示例是为了说明当我们等待某些事情发生变化时（如缓存计算的值）的常见方法。我们应该更倾向于哪种方法？接下来我们来探讨这个问题。\n\
    \n## 异步递归 vs. 回调存储\n\n在 `runCalculation` 中，我们通过从超时中重复相同的函数调用（异步递归）或简单地存储回调来等待\
    \ Worker 完成其工作。\n\n哪种方法最好？乍一看，似乎只使用异步递归最容易，从而消除了对 `calculationCallbacks` 对象的需求。JavaScript\
    \ 新手经常为此使用 `setTimeout`，因为它类似于基于线程的语言中的常见惯用法。该程序的 Java 版本可能会有一个像这样的循环：\n\n```\n\
    while (!calculationCache.get(formula)) {\n  Thread.sleep(0);\n};\n```\n\n但超时并非没有成本。大量超时会产生显著的计算负载。异步递归的可怕之处在于，在我们等待任务完成时，触发的超时数量没有限制。此外，它使我们应用程序的事件结构变得不必要地复杂。因此，异步递归应被视为一种反模式。\n\
    \n我们可以通过为每个公式存储一个回调数组来在我们的计算器中避免异步递归。\n\n```\nvar calculationCache = {},\n   \
    \ calculationCallbacks = {},\n    mathWorker = new Worker('calculator.js');\n\
    mathWorker.addEventListener('message', function(e) {\n  var message = e.data;\n\
    \  calculationCache[message.formula] = message.result;\n  calculationCallbacks[message.formula]\n\
    \  .forEach(function(callback) {\n    callback(message.result);\n  });\n});\n\n\
    function runCalculation(formula, callback) {\n  if (formula in calculationCache)\
    \ {\n    return callback(calculationCache[formula]);\n  };\n```\n\n```\nif (formula\
    \ in calculationCallbacks) {\n    return calculationCallbacks[formula].push(callback);\n\
    };\nmathWorker.postMessage(formula);\ncalculationCallbacks[formula] = [callback];\n\
    }\n```\n\n没有超时，我们的代码变得简单得多，也更高效。\n\n总的来说，避免异步递归。只有在处理不提供任何回调机制的异步功能库时才需要它。如果你遇到这种情况，你应该做的第一件事是为该库编写一个补丁。或者找一个更好的库。\n\
    \n## 混合使用返回值和回调\n\n在我们对 `runCalculation` 的两种实现中，我们有时会返回一个值。这是为了简洁而做出的任意选择。这行代码\n\
    \n```\nreturn callback(calculationCache[formula]);\n```\n\n可以很容易地写成\n\n```\ncallback(calculationCache[formula]);\n\
    return;\n```\n\n因为返回值并不打算被使用。这是 JavaScript 中的常见惯用法，通常无害。\n\n然而，一些函数既返回一个有用的值，又接受一个回调。在这些情况下，重要的是要记住回调将被同步调用（在返回之前）或异步调用（在返回之后）。\n\
    \n永远不要定义一个可能同步的函数，该函数返回一个可能在回调中有用的值。例如，这个打开到给定服务器的 WebSocket⁵ 连接的函数（缓存以确保每个服务器只有一个连接）违反了该规则：\n\
    \n```\nvar webSocketCache = {};\nfunction openWebSocket(serverAddress, callback)\
    \ {\n  var socket;\n\n  if (serverAddress in webSocketCache) {\n    socket = webSocketCache[serverAddress];\n\
    \n    if (socket.readyState === WebSocket.OPEN) {\n      callback();\n```\n\n\
    +   5. https://developer.mozilla.org/en/WebSockets/\n\n```\n} else {\n  socket.onopen\
    \ = _.compose(callback, socket.onopen);\n};\n} else {\n  socket = new WebSocket(serverAddress);\n\
    \  webSocketCache[serverAddress] = socket;\n  socket.onopen = callback;\n};\n\
    return socket;\n};\n```\n\n（此代码依赖于 Underscore.js 库。`_.compose` 定义了一个新函数，该函数同时运行\
    \ callback 和原始的 `socket.onopen` 回调。⁶）\n\n这段代码的问题在于，如果套接字已经被缓存并且是打开的，那么回调将在函数返回之前运行，这会破坏这段代码：\n\
    \n```\nvar socket = openWebSocket(url, function() {\n  socket.send('Hello, server!');\n\
    });\n```\n\n解决方案是什么？将回调包装在 `setTimeout` 中。\n\n```\nif (socket.readyState === WebSocket.OPEN)\
    \ {\n  setTimeout(callback, 0);\n} else {\n  // ...\n}\n```\n\n在这里使用超时可能感觉像是一种变通方法，但它比拥有一个不一致的\
    \ API 要好得多。\n\n在本节中，我们看到了编写异步函数的几个最佳实践。不要依赖一个函数总是异步的，除非你阅读过它的源代码。避免使用计时器方法等待事情发生变化。当从同一个函数返回值并运行回调时，确保回调在返回之后运行。\n\
    \n一次性接收这么多信息可能有点困难，但编写好的异步函数是编写好的 JavaScript 的关键。\n\n## 1.4 处理异步错误\n\n像许多现代语言一样，JavaScript\
    \ 允许你抛出异常并在 try/catch 块中捕获它们。如果未捕获，大多数环境会给你一个有用的堆栈跟踪。例如，这段代码会抛出一个异常，因为 '{' 不是有效的\
    \ JSON：\n\n6. http://documentcloud.github.com/underscore/#compose\n\n```\nEventModel/stackTrace.js\n\
    function JSONToObject(jsonStr) {\n  return JSON.parse(jsonStr);\n}\nvar obj =\
    \ JSONToObject('{');\n```\n\n> SyntaxError: Unexpected end of input\n>     at\
    \ Object.parse (native)\n>     at JSONToObject (/AsyncJS/stackTrace.js:2:15)\n\
    >     at Object.<anonymous> (/AsyncJS/stackTrace.js:4:11)\n\n堆栈跟踪不仅告诉我们错误是从哪里抛出的，还告诉我们最初的错误发生在哪里：第\
    \ 4 行。不幸的是，跟踪异步错误的原因并不那么简单。在本节中，我们将了解为什么 throw 很少是处理回调中错误的正确工具，以及异步 API 是如何围绕此限制设计的。\n\
    \n## 从回调中抛出错误\n\n当我们从异步回调中抛出错误时会发生什么？让我们运行一个测试。\n\n```\nEventModel/nestedErrors.js\n\
    setTimeout(function A() {\n  setTimeout(function B() {\n    setTimeout(function\
    \ C() {\n      throw new Error('Something terrible has happened!');\n    }, 0);\n\
    \  }, 0);\n}, 0);\n```\n\n这个应用程序的结果是一个非常短的堆栈跟踪。\n\n> Error: Something terrible\
    \ has happened!\n>     at Timer.C (/AsyncJS/nestedErrors.js:4:13)\n\n等一下——A 和\
    \ B 怎么了？为什么它们不在堆栈跟踪中？嗯，因为当 C 运行时，它们不在栈上。这三个函数都是直接从事件队列中运行的。\n\n出于同样的原因，我们不能用 try/catch\
    \ 块捕获从异步回调中抛出的错误。这是一个演示：\n\n```\nEventModel/asyncTry.js\ntry {\n  setTimeout(function()\
    \ {\n    throw new Error('Catch me if you can!');\n  }, 0);\n} catch (e) {\n \
    \ console.error(e);\n}\n```\n"
