    \ Accelerated JavaScript Development*.¹³\n\n¹³ http://pragprog.com/book/tbcoffee/coffeescript\n\
    ¹¹ http://stackoverflow.com/\n¹² (implied reference from context)"
  mdcn: "\n无论原因如何，JavaScript 都已经扎根于此。Apple 通过 WebKit 和 Safari 支持 JavaScript。微软通过 Metro\
    \ 支持 JavaScript。甚至 Adobe 也在支持 JavaScript，推出了将 Flash 转换为 HTML5 的工具。这个最初只是 humble\
    \ 浏览器功能的东西，如今已成为 arguably 世界上最重要的编程语言。\n\n得益于浏览器的普及，JavaScript 比其他任何语言都更接近实现 Java\
    \ 曾经承诺的\"编写一次，到处运行\"。2007 年，Jeff Atwood 提出了 *Atwood 定律*：\n\n> 任何可以用 JavaScript\
    \ 编写的应用，最终都将用 JavaScript 编写。³\n\n## 天堂里的麻烦\n\nJavaScript 从一开始就被设计为单线程语言，异步任务通过事件来处理。当只有少数几个潜在事件时，基于事件的代码比多线程代码简单得多。它在概念上非常优雅，而且消除了将数据包装在互斥锁和信号量中以实现线程安全的需要。但当一个事件需要携带状态从一个事件传递到下一个事件时，这种简洁性往往会让位于一种如此可怕以至于被称为\
    \ *Pyramid of Doom* 的代码结构。\n\n```\nstep1(function(result1) {\n  step2(function(result2)\
    \ {\n    step3(function(result3) {\n      // and so on...\n    });\n  });\n});\n\
    ```\n\n\"我爱异步，但我不能这样写代码，\"一位开发者在 Node.js Google Group 上 famously 抱怨道。⁴ 但问题并不在于语言本身，而在于程序员使用语言的方式。用优雅的方式处理复杂的事件组合在\
    \ JavaScript 中仍然是前沿领域。\n\n所以，让我们推动这个前沿前进吧！让我们向世界证明，即使是最复杂的问题，也可以用干净、可维护的 JavaScript\
    \ 代码来解决。\n\n³ http://www.codinghorror.com/blog/2007/07/the-principle-of-least-power.html\n\
    ⁴ https://groups.google.com/forum/#!topic/nodejs/wzSUdkPICWg\n\n## 这本书适合谁？\n\n\
    这本书面向中级 JavaScript 开发者。你应该了解变量的作用域范围。像 `typeof`、`arguments` 和 `this` 这样的关键字不应该让你感到困惑。或许最重要的是，你应该理解\n\
    \n```\nfunc(function(arg) { return next(arg); });\n```\n\n只是\n\n```\nfunc(next);\n\
    ```\n\n的一种 needless 冗长写法，除了极少数情况。（有关小型但重要的函数式习语的更多示例，请参阅 Reg Braithwaite 的优秀文章《Captain\
    \ Obvious on JavaScript》。）\n\n你*不需要*知道的是 JavaScript 中异步事件是如何调度的。我们将在下一章中介绍这一点。\n\
    \n## JavaScript 学习资源\n\n随着 JavaScript 成为 Web（更不用说移动设备）的 *lingua franca*，大量关于它的信息性书籍、课程和网站纷纷出现。以下是我推荐的一些：\n\
    \n- 如果你完全是编程新手，请查看交互式教程网站 Codecademy。\n- 如果你来自其他语言，希望快速上手 JavaScript 作为浏览器脚本语言，可以在\
    \ CodeSchool 上学习交互式 jQuery Air 课程。\n- 如果你想更正式地了解 JavaScript 语言，请研读 Marijn Haverbeke\
    \ 的 *Eloquent JavaScript*。\n- 如果你是希望提升水平并避免常见陷阱的 JavaScript 初学者，请花些时间阅读 JavaScript\
    \ Garden。\n\n## 在哪里寻求帮助？\n\n当思考\"我应该在这里使用 `typeof` 还是 `instanceof`？\"这样的问题时，请避开过时的\
    \ W3Schools 网站（遗憾的是，Google 搜索往往倾向于推荐它）。相反，请前往 Mozilla Developer Network (MDN)。\n\
    \nMozilla 基金会（你可能听说过它的浏览器，Firefox）由 Brendan Eich 领导，他是 JavaScript 的创始人。这个基金会精通其领域。\n\
    \n如果你在 MDN 的页面中找不到答案，请将你的问题带到 Stack Overflow。¹¹ 该网站培养了一个 amazingly 乐于助人的开发者社区，可以安全地打赌，任何标记为\
    \ JavaScript 的 coherent 问题都会得到准时的回应。\n\n## 运行代码示例\n\n这本书有点不寻常，因为我同时讨论了客户端（浏览器）和服务器端（Node.js）代码。这反映了\
    \ JavaScript 独特的可移植性。核心概念适用于所有 JavaScript 环境，但某些示例针对其中一种或另一种。\n\n即使你对编写 Node 应用没有兴趣，我也希望你能按照说明在本地运行这些代码片段。请参阅第\
    \ xiv 页的\"在 Node.js 中运行代码\"获取指导。\n\n## 哪些示例是可运行的？\n\n当你看到一个带有文件名的代码片段时，这意味着它是独立的，可以直接运行而无需修改。下面是一个例子：\n\
    \n```\nPreface/stringConstructor.js\nconsole.log('str'.constructor.name);\n```\n\
    \n周围的上下文应该能清楚地说明代码是在浏览器、Node.js 还是两者中都可以运行。\n\n当代码片段没有文件名时，这意味着它不是独立的。它可能是 larger\
    \ 示例的一部分，也可能是假设性的。下面是一个例子：\n\n```\nvar tenSeconds = 10 * 1e3;\nsetTimeout(launchSatellite,\
    \ tenSeconds);\n```\n\n这些示例是用来阅读的，不是用来运行的。\n\n## 在 Node.js 中运行代码\n\nNode 非常易于安装和使用：只需访问\
    \ http://nodejs.org/，点击下载，然后运行 Windows 或 OS X 安装程序（或在 *nix 上从源代码构建）。然后你可以在命令行中运行\
    \ `node` 来打开一个 JavaScript REPL（类似于 Ruby 的 `irb` 环境）。\n\n```\n$ node\n> Math.pow(5,\
    \ 6)\n15625\n```\n\n你可以通过将 JavaScript 文件名作为参数传递给 `node` 命令来运行它。\n\n```\n$ echo\
    \ \"console.log(typeof NaN)\" > foo.js\n$ node foo.js\nnumber\n```\n\n## 在浏览器中运行代码\n\
    \n每个现代浏览器都提供了一个 nice 的小 REPL，让你可以在当前页面的上下文中运行 JavaScript 代码。但对于多行代码示例，你最好使用像 jsFiddle\
    \ 这样的 web 沙箱。¹²\n\n使用 jsFiddle，你可以输入 JavaScript、HTML 和 CSS，然后点击运行（或按 Ctrl+Enter）查看结果。（控制台输出将显示在你的开发者控制台中。）你可以通过左侧边栏选择\
    \ jQuery 等框架。你还可以保存你的工作，从而获得一个可共享的 URL。\n\n## 本书中的代码风格\n\nJavaScript 没有官方的风格指南，但在一个项目中保持一致的风格很重要。对于这本书，我采用了以下（非常常见的）约定：\n\
    \n- 两空格缩进\n- camelCase 标识符\n- 在每个表达式的末尾使用分号，除了函数定义\n\n更专业地说，我采用了一种特殊的约定来处理函数调用链中的缩进，这是基于\
    \ Reg Braithwaite 的提议。规则本质上是这样的：链中的两个函数调用具有相同的缩进级别，当且仅当它们返回相同的对象。所以，例如，我可能会写如下代码：\n\
    \n```\n$('#container > ul li.inactive')\n  .slideUp();\n```\n\njQuery 的 `slideUp`\
    \ 方法返回调用它的同一对象。因此，它没有缩进。相比之下：\n\n```\nvar $paragraphClone = $('p:last')\n  .clone();\n\
    ```\n\n这里，`clone` 方法是缩进的，因为它返回一个不同的对象。\n这种约定的优点是它阐明了链中每个函数的返回值。这里是一个更复杂的例子：\n\n\
    ```\n$('h1')\n    .first()\n    .addClass('first')\n.end()\n    .last()\n    .addClass('last');\n\
    ```\n\njQuery 的 `first` 和 `last` 将集合过滤到其第一个和最后一个元素，而 `end`\n撤销上一个过滤器。所以，`end`\
    \ 没有缩进，因为它返回的值与\n`$('h1')` 相同。（`last` 被允许与 `first` 占据相同的缩进级别，因为\n链被重置了。）\n\n当我们进行函数式编程时，这种缩进方法尤其有用，\n\
    正如我们将在第 47 页的第 4 章《使用 Async.js 进行流程控制》中将看到的。\n\n```\n[1, 2, 3, 4, 5]\n    .filter(function(int)\
    \ { return int % 2 === 1; })\n        .forEach(function(odd) { console.log(odd);\
    \ })\n```\n\n## 关于 altJS 的一点说明\n\n许多语言可以编译为 JavaScript，使代码更容易编写。\n（你可以在 http://altjs.org\
    \ 找到一个相当全面的列表。）这本书不是关于\n它们的。它是关于在不使用预编译器的情况下编写最好的 JavaScript 代码。我没有什么反对 altJS\
    \ 的（见下一节），但我相信\n理解底层语言很重要。\n\n一些 altJS 语言专门旨在通过允许以\n更同步的风格编写来\"驯服\"异步回调。我在附录 1《驯服\
    \ JavaScript 的工具》第 81 页中包含了这些语言的概述。\n\n## CoffeeScript\n\n我 ♥ CoffeeScript 已经不是什么秘密了，这是一种美丽而富有表现力的语言，\n\
    编译为 JavaScript。我在 HubSpot 的日常工作中广泛使用它。\n我曾在 Railsconf 和 Øredev 等会议上做过关于它的演讲。而且它是\n\
    我的第一本书 *CoffeeScript: Accelerated JavaScript Development* 的主题。¹³\n\n¹³ http://pragprog.com/book/tbcoffee/coffeescript\n\
    ¹¹ http://stackoverflow.com/\n¹² （根据上下文暗示的参考文献）\n"
