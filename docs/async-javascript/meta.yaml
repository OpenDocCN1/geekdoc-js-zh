    \ NaN)\" > foo.js\n$ node foo.js\nnumber\n```\n\n# Running Code in the Browser\n\
    \nEvery modern browser provides a nice little REPL that lets you run JavaScript\
    \ code in the context of the current page. But for playing with multiline code\
    \ examples, you're better off using a web sandbox like jsFiddle.12\n\nWith jsFiddle,\
    \ you can enter JavaScript, HTML, and CSS, and then click Run (or press Ctrl+Enter)\
    \ to see the result. (console output will go to your developer console.) You can\
    \ bring in a framework like jQuery by choosing it in the left sidebar. And you\
    \ can save your work, giving you a shareable URL.\n\n# Code Style in This Book\n\
    \nJavaScript has no official style guide, but maintaining a consistent style within\
    \ a project is important. For this book, I've adopted the following (very common)\
    \ conventions:\n\n+   - Two-space indentation\n- camelCase identifiers\n- Semicolons\
    \ at the end of every expression, except function definitions\n\nMore esoterically,\
    \ I've adopted a special convention for indentation in a chain of function calls,\
    \ based on a proposal by Reg Braithwaite. The rule is, essentially, that two function\
    \ calls in a chain have the same indentation level if and only if they return\
    \ the same object. So, for instance, I might write the following:\n\n```\n$('#container\
    \ > ul li.inactive')\n  .slideUp();\n```\n\njQuery's slideUp method returns the\
    \ same object that it was called on. Thus, it isn't indented. By contrast:\n\n\
    ```\nvar $paragraphClone = $('p:last')\n  .clone();\n```"
