    \n在本章的其余部分，我们将专注于 jQuery Promise，除了[第 3.7 节 *jQuery 与 Promises/A*，第 43 页](#)。我们还将从\
    \ jQuery 中汲取词汇，特别是我们将在下一节看到的 Deferred 与 Promise 的区别，以及将“resolve”用作“reject”的反义词。\n\
