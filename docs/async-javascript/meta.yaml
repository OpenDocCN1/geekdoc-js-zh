  md: '(Notice the use of jQuery''s one instead of on. The difference is that one
    automatically removes the handler after it fires.)


    With these two lines of code, each tooltip will listen to its container and remove
    itself when the container gets a new tooltip. It''s a beautifully direct, efficient
    approach that saves us from having to store any state or engineer complex selectors
    (which would slow older browsers to a crawl—IE7 and older don''t even have a way
    of selecting all elements with the tooltip class without traversing the whole
    document!).


    Note that event bubbling would actually have defeated our intent in this case:
    when we create a new tooltip in the sidebar, we want only tooltips listening for
    the ''newTooltip'' event on the sidebar itself to go away, not those on the surrounding
    document. Always think carefully about whether trigger or triggerHandler is the
    right tool for the job.


    Custom jQuery events are an unusual twist on PubSub, since the events are emitted
    by selectable elements rather than by objects in our script. Much as evented models
    are an intuitive way of expressing state-related events, jQuery events let us
    express DOM-related events directly through the DOM, saving us from having to
    duplicate that state elsewhere in our application. Use them liberally, but try
    to avoid relying on the structure of your application''s markup —you don''t want
    your next redesign to break your script.


    # ## 2.4 What We''ve Learned


    In this chapter, we''ve learned about distributing events via PubSub, one of the
    most fundamental JavaScript design patterns. When you''re not subscribing to the
    events that are being published, PubSub is completely unobtrusive. The key to
    using PubSub properly is deciding which entities to distribute events through.


    We''ve seen that any object can be used for PubSub, simply by inheriting from
    something like Node''s EventEmitter. Whenever an object is associated with a set
    of async tasks or I/O events, it''s a good idea to make it evented.


    One class of evented object is the models in MVC libraries like Backbone.js. These
    models both contain application state and announce changes to it. Change events
    can trigger application logic, DOM updates, and synchronization with the server.
    It all feels very natural, which explains why Backbone has become a smash-hit
    library.'
