  md: "```\nvar concatenation = '';\n\nvar dirContents = fs.readdirSync('.');\n\n\
    async.filter(dirContents, isFilename, function(filenames) {\n  async.forEachSeries(filenames,\
    \ readAndConcat, onComplete);\n});\n\nfunction isFilename(filename, callback)\
    \ {\n  fs.stat(filename, function(err, stats) {\n    if (err) throw err;\n   \
    \ callback(stats.isFile());\n  });\n}\n\nfunction readAndConcat(filename, callback)\
    \ {\n  fs.readFile(filename, 'utf8', function(err, fileContents) {\n    if (err)\
    \ return callback(err);\n    concatenation += fileContents;\n    callback();\n\
    \  });\n}\n\nfunction onComplete(err) {\n  if (err) throw err;\n  console.log(concatenation);\n\
    }\n```\n\nNow our code splits up nicely into two parts: the overall task (in the\
    \ form of the async.filter and async.forEachSeries calls) and the implementation\
    \ details (in the form of two iterator functions and one final callback).\n\n\
    filter and forEach aren’t the only Async.js utilities corresponding to standard\
    \ functional iteration methods. There are also the following:\n\n+   - reject/rejectSeries,\
    \ the inverse of filter\n- map/mapSeries, for 1:1 transformations\n- reduce/reduceRight,\
    \ for transforming a value at each step\n- detect/detectSeries, for finding a\
    \ value matching a filter\n- sortBy, for generating a sorted copy\n- some, for\
    \ testing whether at least one value matches the given criterion\n- every, for\
    \ testing whether all values match the given criterion\n\nThese methods are the\
    \ core of Async.js, allowing you to perform common iterations with minimal boilerplate.\
    \ Before we move on to more advanced methods, let’s take a look at the way these\
    \ methods deal with errors."
