  md: "So, if you have five blocking `<script>` tags in the `<head>` of the document,\
    \ the user won't see anything but the page's title until all five scripts have\
    \ been downloaded and run. Further, while those scripts are being run, they'll\
    \ be able to see the document only up until that point. If they want to see any\
    \ of the good stuff that's waiting down in the `<body>`, they'll have to bind\
    \ a handler to an event like document.onreadystatechange.\n\nFor that reason,\
    \ it's become fashionable to put scripts at the end of the page's `<body>`. This\
    \ way, the user gets to see the page more quickly, and the scripts get to see\
    \ the DOM in all its glory without having to wait for an event to fire. For most\
    \ scripts, this move is a big improvement.\n\nBut not all scripts are alike. Before\
    \ you move a script down, ask yourself three questions.\n\n+   - Is there a chance\
    \ that this script will be called directly from inlined JavaScript in the `<body>`?\
    \ This may be obvious, but it's worth double-checking.\n- Does this script allow\
    \ older browsers to recognize HTML5 elements? Modernizr² does, which is why the\
    \ HTML5 Boilerplate³—an exemplar of best practices—includes it right up top.\n\
    - Is this script something that will determine how your page looks when it's rendered?\
    \ An example is Typekit's hosted fonts. If you put Typekit's script at the end\
    \ of your document, the text on your page will render twice: once immediately\
    \ and again after the script runs.\n\nIf the answer is \"yes\" to any of these\
    \ questions, that script should go in the `<head>`. Otherwise, it should go in\
    \ the `<body>`. Minifying and concatenating those two sets of scripts will give\
    \ you a document that looks like this:\n\n```\n<html>\n<head>\n  <!-- metadata\
    \ and stylesheets go here -->\n  <script src=\"headScripts.js\"></script>\n</head>\n\
    <body>\n  <!-- content goes here -->\n  <script src=\"bodyScripts.js\"></script>\n\
    </body>\n</html>\n```\n\nThis is great for load times, but be aware that it may\
    \ give the user a chance to interact with the page before bodyScripts.js is loaded.\n\
    \n2. http://modernizr.com/\n3. http://html5boilerplate.com/"
