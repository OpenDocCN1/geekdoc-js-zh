  md: "In our original async code, we had three throws. In the Async.js version, we\
    \ have two, yet all errors will still be thrown. How does Async.js do it? And\
    \ why can't we have just one throw?\n\nSimply put, Async.js follows Node conventions.\
    \ This means that every I/O callback has the form (err, results...)—with the exception\
    \ of callbacks where the result is a boolean. Boolean callbacks just have the\
    \ form (result), which is why our isFilename iterator from the previous code example\
    \ needs to handle errors on its own.\n\n```\nAsyncjs/forEachSeries.js\nfunction\
    \ isFilename(filename, callback) {\n  fs.stat(filename, function(err, stats) {\n\
    \    if (err) throw err;\n    callback(stats.isFile());\n  });\n}\n```\n\nBlame\
    \ Node's fs.exists for setting this precedent. That means that the iterators for\
    \ the Async.js collection methods (filter, reject, detect, some, every, and their\
    \ series equivalents) can't report errors.\n\nWith all non-boolean Async.js iterators,\
    \ passing a value other than null or undefined as the first argument to the iterator's\
    \ callback will immediately invoke the completion callback with that error. That's\
    \ why readAndConcat can do without throw.\n\n```\nAsyncjs/forEachSeries.js\nfunction\
    \ readAndConcat(filename, callback) {\n  fs.readFile(filename, 'utf8', function(err,\
    \ fileContents) {\n    if (err) return callback(err);\n    concatenation += fileContents;\n\
    \    callback();\n  });\n}\n```\n\nSo, if callback(err) does get called from readAndConcat,\
    \ that err will be passed to onComplete. Async.js guarantees that onComplete will\
    \ be called only once, either the first time an error occurs or after all operations\
    \ have finished successfully.\n\n```\nAsyncjs/forEachSeries.js\nfunction onComplete(err)\
    \ {\n  if (err) throw err;\n  console.log(concatenation);\n}\n```"
