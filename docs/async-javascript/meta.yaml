  md: '# 3.5 Combining Promises


    The existence of progress notifications doesn''t change the fact that, ultimately,
    every Promise is either resolved or rejected. (Or, it remains pending for eternity.)
    But why? Why not let Promises change to any state at any time?


    Mainly, Promises are designed this way because programmers *thrive* on binary.
    We know exactly how to put 1s and 0s together to perform astounding feats of logic.
    That''s a big reason why Promises are so powerful; they let us treat tasks as
    booleans.


    The most common use case for logically combining Promises is finding out when
    a set of async tasks has finished. Let''s say you''re showing a tutorial video
    while loading a game from the server. You want to start the game as soon as two
    things have happened, in any order.


    +   - The tutorial video has ended.

    - The game is loaded.


    Given a Promise representing each of these processes, your task is to start the
    game when both Promises are resolved. How would you do that?


    Enter jQuery''s *when* method.


    ```

    var gameReadying = $.when(tutorialPromise, gameLoadedPromise);

    gameReadying.done(startGame);

    ```


    *when* acts as a logical AND for Promise resolution. The Promise it generates
    is resolved as soon as all of the given Promises are resolved, or it is rejected
    as soon as any one of the given Promises is rejected.


    An excellent use case for *when* is combining multiple Ajax calls. If you need
    to make two POST calls at once and get a notification when both have succeeded,
    there''s no need to define a separate callback for each request.


    ```

    $.when($.post(''/1'', data1), $.post(''/2'', data2))

    .then(onPosted, onFailure);

    ```


    On success, *when* can get access to the callback arguments from each of its constituent
    Promises, but doing so is tricky. They''re passed as an argument list with the
    same order that the Promises were given to *when*. If a Promise provides multiple
    callback arguments, those arguments are converted to an array.


    So, to get all of the callback arguments from all of the Promises given to `$.when`,
    you might write something like this (though I don''t recommend it):'
