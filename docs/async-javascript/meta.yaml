    \ help. We'll also look at two popular script-loading libraries: yepnope and Require.js.\n\
    \n### Async Loading in Node.js\n\n> We'll be sticking to the browser in this chapter,\
    \ because async module loading in Node is rarely useful. Node once offered an\
