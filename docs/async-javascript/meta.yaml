    \n2. http://modernizr.com/\n3. http://html5boilerplate.com/\n\n## Deferring Scripts\n\
    \nIn the last section, I recommended `<body>` placement for most scripts, since\
    \ that allows the user to see the page more quickly and avoids the overhead of\
    \ binding to a “ready” event before manipulating the DOM. But there is a downside:\
    \ the browser won’t be able to start loading those scripts until the whole document\
    \ is loaded. For large documents being sent over slow connections, this can be\
    \ a major bottleneck.\n\nIdeally, we’d load those scripts in parallel with the\
    \ document, without delaying DOM rendering. Then when the document is ready, we’d\
    \ run the scripts because they’re loaded while preserving the order of the `<script>`\
    \ tags.\n\nIf you’ve read the book up to this point, no doubt you’re excited about\
    \ writing a custom Ajax script loader to meet these requirements! But most browsers\
    \ support a simpler solution.\n\n```\n<script defer src=\"deferredScript.js\"\
    >\n```\n\nAdding that `defer` attribute tells the browser this: “Start loading\
    \ this script right away, but don’t run it until the document is ready and all\
    \ previous scripts with `defer` have finished running.” Placing a deferred script\
    \ in the `<head>` of your document gives you all the advantages of `<body>` placement,\
    \ plus a substantial speed boost in large documents!\n\nThe downside? `defer`\
    \ isn’t supported by all browsers. Notably, as of this writing, even the latest\
    \ Opera ignores the attribute.⁴ That means if you want to ensure that your deferred\
    \ scripts run after the document is loaded, you’ll have to wrap each script’s\
    \ code in something like jQuery’s `$(document).ready`. That may be worthwhile,\
    \ since something like 97 percent of your visitors will get to enjoy the benefits\
    \ of parallel loading, while the other 3 percent will still get perfectly functional\
    \ JavaScript.\n\nWith `defer`, we can improve on the page example from the previous\
    \ section by replacing `bodyScripts.js` with `deferredScripts.js`.\n\n```\n<html>\n\
    <head>\n    <!-- metadata and stylesheets go here -->\n    <script src=\"headScripts.js\"\
    ></script>\n    <script defer src=\"deferredScripts.js\"></script>\n</head>\n\
    <body>\n    <!-- content goes here -->\n</body>\n</html>\n```\n\n4. http://caniuse.com/#search=defer\n\
    \nJust remember that it’s important to wrap `deferredScripts` so that it won’t\
    \ run until after the document ready event in browsers that don’t support `defer`.\
    \ If the body content is more than a couple of kilobytes, that trade-off is worthwhile.\n\
    \n## Full Script Parallelization\n\nIf you’re a hardcore every-millisecond-counts\
    \ page load gearhead, `defer` may sound like weak sauce to you. You don’t want\
