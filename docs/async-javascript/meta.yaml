  md: "Here, the clone method is indented because it returns a different object.\n\
    The advantage of this convention is that it clarifies what each function in a\n\
    chain is returning. Here’s a more complex example:\n\n```\n$('h1')\n    .first()\n\
    \    .addClass('first')\n.end()\n    .last()\n    .addClass('last');\n```\n\n\
    jQuery’s first and last filter a set down to its first and last elements, while\
    \ end\nundoes the last filter. So, end is unindented because it returns the same\
    \ value\nas $('h1'). (last is allowed to occupy the same indentation level as\
    \ first because\nthe chain was reset.)\n\nThis approach to indentation is especially\
    \ useful when we’re doing functional\nprogramming, as we’ll see in [Chapter 4,\
    \ Flow Control with Async.js, on page 47](Chapter 4, Flow Control with Async.js,\
    \ on page 47).\n\n```\n[1, 2, 3, 4, 5]\n    .filter(function(int) { return int\
    \ % 2 === 1; })\n        .forEach(function(odd) { console.log(odd); })\n```\n\n\
    # A Word on altJS\n\nA number of languages compile to JavaScript, making code\
    \ easier to write.\n(You can find a fairly comprehensive list at http://altjs.org.)\
