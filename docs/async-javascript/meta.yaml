  md: "# ### 2.1 PubSub\n\nSince the dawn of JavaScript, browsers have allowed event\
    \ handlers to be attached to DOM elements like so:\n\n```\nlink.onclick = clickHandler;\n\
    ```\n\nAh, simplicity itself! There's just one caveat: if you wanted *two* click\
    \ handlers for an element, you'd have to aggregate them yourself with a wrapper\
    \ function.\n\n```\nlink.onclick = function() {\n  clickHandler1.apply(this, arguments);\n\
    \  clickHandler2.apply(this, arguments);\n};\n```\n\nNot only is this tedious,\
    \ it's also a recipe for bloated, all-purpose handler functions. That's why the\
    \ W3C added addEventListener to the DOM specification in 2000 and jQuery abstracted\
    \ it with the bind method. bind makes it easy to add as many handlers as you like\
    \ to any event on any element (or set of elements), without worrying about stepping\
    \ on anyone else's toes.\n\n```\n$(link)\n  .bind('click', clickHandler1)\n  .bind('click',\
    \ clickHandler2);\n```\n\n(In jQuery 1.7+, the new on syntax is preferred over\
    \ bind.[1](http://api.jquery.com/on/) There's also the click method, which is\
    \ a shorthand for bind('click', ...); however, I prefer to consistently use bind/on.)\n\
    \nFrom a software architecture perspective, jQuery *publishes* the link element's\
    \ events to anyone who wants to *subscribe*. That's why it's called \"PubSub.\"\
    \n\nTheologically speaking, PubSub is a kind of democracy. The old-style DOM event\
    \ API, where binding to event meant writing object.onevent = ..., is now largely\
    \ forgotten in favor of PubSub. The architects of Node's API liked PubSub so much\
    \ that they decided to include a generic PubSub entity called EventEmitter that\
    \ other objects can inherit from. Just about every source of I/O in Node is an\
    \ EventEmitter: file streams, HTTP servers, and even the application process itself.\
    \ To wit:\n\n```\n['room', 'moon', 'cow jumping over the moon']\n.forEach(function(name)\
    \ {\n  process.on('exit', function() {\n    console.log('Goodnight, ' + name);\n\
    \  });\n});\n```"
  merge: -1
  pgno: 35
- img_proc: true
  md: "Countless stand-alone PubSub libraries exist for the browser. In addition,\
    \ many MVC frameworks like Backbone.js and Spine provide their own EventEmitter-like\
    \ modules. We'll talk more about Backbone later in this chapter.\n\n# EventEmitter\n\
    \nLet's use Node's EventEmitter as an example of a PubSub interface. It has a\
    \ simple, nearly minimal design.\n\nTo add an event handler to an EventEmitter,\
    \ just call on with the event type and the handler.\n\n```\nemitter.on('evacuate',\
    \ function(message) {\n  console.log(message);\n});\n```\n\nThe emit method will\
    \ call all handlers for the given event type. For instance, the following\n\n\
    ```\nemitter.emit('evacuate');\n```\n\nwould call all evacuate handlers.\n\nNote\
    \ that the term *event* here has nothing to do with the event queue. See [Synchronicity,\
    \ on page 22](#).\n\nYou can add any number of additional arguments when you emit\
    \ an event. All arguments are passed to all handlers.\n\n```\nemitter.emit('evacuate',\
    \ 'Woman and children first!');\n```\n\nThere are no restrictions on event names,\
    \ though the Node docs offer a useful convention.\n\nTypically, event names are\
    \ represented by a camel-cased string.^[2](http://nodejs.org/docs/latest/api/events.html)^\n\
    \nAll of EventEmitter's methods are public, but it's common convention for events\
    \ to be emitted only from \"inside\" the EventEmitter. That is, if you have an\
    \ object that inherits the EventEmitter prototype and uses this.emit to broadcast\
    \ events, its emit method shouldn't be called elsewhere.\n\n# Roll Your Own PubSub\n\
    \nPubSub implementations are so simple that we can create one in about a dozen\
    \ lines of code. The only state we need to store is a list of handlers for each\
    \ event type we support.\n\n```\nPubSub = {handlers: {}}\n```\n\n2. http://nodejs.org/docs/latest/api/events.html"
  merge: -1
  pgno: 36
