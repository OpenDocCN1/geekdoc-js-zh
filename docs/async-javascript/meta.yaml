- md: " **Chapter 1. Understanding JavaScript Events •**\n\nDo you see the problem\
    \ here? Our try/catch block will catch only those errors that occur within the\
    \ setTimeout function itself. Since setTimeout runs its callback asynchronously,\
    \ even when the timeout is 0, the error it throws will go straight to our application's\
    \ uncaught exception handler (see Handling Uncaught Exceptions, on page 14).\n\
    \n```\nEventModel/readFile.js\n\nvar fs = require('fs');\nfs.readFile('fhgwgaz.txt',\
    \ function (error, data) {\n  if (err) {\n    return console.error(err);\n  };\n\
    \  console.log(data.toString(\"utf8\"));\n});\n```\n\n---\n\nIn browsers, you\
    \ can attach a global error handler to `window.onerror`. If the handler returns\
    \ true, it'll prevent the browser's default error-handling behavior.\n\n```\n\
    window.onerror = function(err) {\n  return true;  // ignore all errors completely\n\
    };\n```\n\nIn production, you might want to consider a JavaScript error-handling\
    \ service, such as Errorception.⁷ Errorception provides a ready-made `window.onerror`\
    \ handler that reports all uncaught exceptions to their server, which can then\
    \ send you notifications.\n\n## In Node.js\n\nNode's analog to `window.onerror`\
    \ is the `process` object's `uncaughtException` event. Normally, a Node app will\
    \ exit immediately on an uncaught exception. But as long as at least one `uncaughtException`\
    \ handler exists, the app will simply return to the event queue.\n\n```\nprocess.on('uncaughtException',\
    \ function(err) {\n  console.error(err); // shutdown averted!\n});\n```\n\nHowever,\
    \ as of Node 0.8.4, `uncaughtException` is deprecated. According to the docs,⁸\n\
    \n> uncaughtException is a very crude mechanism for exception handling and may\
    \ be removed in the future...\n\nDon't use it, use domains instead.\n\nWhat are\
    \ domains? you ask. Domains are evented objects that convert throws into 'error'\
    \ events. (We'll talk more about evented objects in Chapter 2, Distributing Events,\
    \ on page 19.) Here's an example:\n\n```\nEventModel/domainThrow.js\nvar myDomain\
    \ = require('domain').create();\nmyDomain.run(function() {\n  setTimeout(function()\
    \ {\n    throw new Error('Listen to me!');\n  }, 50);\n});\n\nmyDomain.on('error',\
    \ function(err) {\n  console.log('Error ignored!');\n});\n```\n\n7. http://errorception.com/\n\
    8. http://nodejs.org/docs/latest/api/process.html#process_event_uncaughtexception\n\
    \nThe throw from the timeout event simply triggers the domain's error handler.\n\
    \n< Error ignored!\n\nMagical, isn't it? Domains make throw much more palatable.\
    \ Unfortunately, they're available only in Node 0.8+, and as of this writing,\
    \ they're still considered an experimental feature. For more information, see\
    \ the Node docs.⁹\n\nWhether you're in the browser or on the server, global exception\
    \ handlers should be seen as a measure of last resort. Use them only for debugging.\n\
    \n## To Throw or Not to Throw?\n\nWhen you're given an error, the easiest thing\
    \ to do with it is to throw it. In Node code, you'll often see callbacks that\
    \ look like this:\n\n```\nfunction(err) {\n    if (err) throw err;\n    // ...\n\
    }\n```\n\nWe'll use this idiom frequently in Chapter 4, Flow Control with Async.js,\
    \ on page 47. But in a production app, allowing routine exceptions and fatal errors\
    \ alike to bubble up to the global handler is unacceptable. throw in a callback\
    \ is a JavaScripter's way of saying, \"I don't want to think about this right\
    \ now.\"\n\nWhat about throwing exceptions that you know will be caught? That's\
    \ an equally thorny area. In 2011, Isaac Schlueter (creator of npm and current\
    \ head of Node development) argued that try/catch is an anti-pattern.¹⁰\n\n> Try/catch\
    \ is goto wrapped in pretty braces. There's no way to continue where you left\
    \ off, once the error is handled. What's worse, in the code that throws, you have\
    \ no idea where you're jumping to. When you return an error code, you are fulfilling\
    \ a contract. When you throw, you're saying, \"I know I was talking to you, but\
    \ I'm going to jump over you now and talk to your boss instead.\" It's rude. If\
    \ it's not an emergency, don't do that; if it is an emergency, then we should\
    \ crash.\n\nSchlueter advocated using throws purely as assert-like constructs,\
    \ a way of bringing applications to a halt when they're doing something completely\
    \ unexpected. The Node community has largely followed this recommendation, though\
    \ that may change with the emergence of domains.\n\nSo, what's the current best\
    \ practice for handling async errors? I suggest heeding Schlueter's advice: if\
    \ you want your whole application to stop, go ahead and use throw. Otherwise,\
    \ give some thought as to how the error should be handled. Do you want to show\
    \ the user an error message? Retry the request? Sing \"Daisy Bell\"? Then handle\
    \ it like that, as close to the source as possible.\n\n## 1.5 Un-nesting Callbacks\n\
    \nThe most common anti-pattern in JavaScript is nesting callbacks within callbacks.\
    \ Remember the Pyramid of Doom from the introduction? Let's look at a concrete\
    \ example that you might see in a Node server.\n\n```\nfunction checkPassword(username,\
    \ passwordGuess, callback) {\n  var queryStr = 'SELECT * FROM user WHERE username\
    \ = ?';\n  db.query(selectUser, username, function (err, result) {\n    if (err)\
    \ throw err;\n    hash(passwordGuess, function(passwordGuessHash) {\n      callback(passwordGuessHash\
    \ === result['password_hash']);\n    });\n  });\n}\n```\n\nHere we've defined\
    \ an async function (checkPassword), which fires another async function (db.query),\
    \ which potentially fires another async function (hash). (It's impossible to know\
    \ for certain whether these functions are async without actually reading their\
    \ code, but it's reasonable to assume so here.)\n\nWhat's the problem with this\
    \ code? Right now, nothing. It works, and it's succinct. But it's going to get\
    \ awfully hairy when we try to add new features to it, like handling that database\
    \ error instead of throwing it (see To Throw or Not to Throw?, on page 16), logging\
    \ access attempts, throttling, and so on.\n\nNested callbacks tempt us to add\
    \ more features by adding more code, rather than implementing those features in\
    \ manageable, reusable pieces. This equivalent implementation of checkPassword\
    \ avoids that temptation:\n\n```\nfunction checkPassword(username, passwordGuess,\
    \ callback) {\n  var passwordHash;\n  var queryStr = 'SELECT * FROM user WHERE\
    \ username = ?';\n  db.query(selectUser, username, queryCallback);\n\n  function\
    \ queryCallback(err, result) {\n    if (err) throw err;\n    passwordHash = result['password_hash'];\n\
    \    hash(passwordGuess, hashCallback);\n  }\n\n  function hashCallback(passwordGuessHash)\
    \ {\n    callback(passwordHash === passwordGuessHash);\n  }\n}\n```\n\nThis approach\
    \ is more verbose, but it reads more clearly and is much easier to extend. Because\
    \ we've given the async result (passwordHash) broader scope, we have more flexibility.\n\
    \nAs a rule, avoid more than two levels of function nesting. The key is to figure\
    \ out a way of storing async results outside of the function making the async\
    \ call so that the callback doesn't have to be nested.\n\nIf all of this sounds\
    \ tricky, don't worry. We'll see plenty of examples in later chapters of async\
    \ events running in sequence without nested handlers.\n\n## 1.6 What We've Learned\n\
    \nIn this chapter, we've seen how JavaScript's single-threadedness is both a blessing\
    \ and a curse. In the right hands, it makes for beautiful code free of the terrifying\
    \ race conditions that plague multithreaded apps. But you need to develop the\
    \ right mind-set—and the right techniques.\n\nThe rest of this book is concerned\
    \ with libraries and design patterns for working with events in JavaScript. All\
    \ of the examples we'll look at will run in either mainstream browsers or unmodified\
    \ Node.js. However, writing JavaScript isn't the only way to produce JavaScript\
    \ code. For an overview of some interesting alternatives, see **Appendix 1, Tools\
    \ for Taming JavaScript**, on **page 81**.\n\nIt bears mention here that there\
    \ is one kind of multithreading in JavaScript: you can spawn worker processes.\
    \ Each spawned process can exchange data with other processes under the same limitations\
    \ as any other I/O. Workers make it possible to utilize multiple cores, without\
    \ breaking the rules of JavaScript (code can't be interrupted; variables are accessible\
    \ only within their scope). For more on workers, skip ahead to **Chapter 5, Multithreading\
    \ with Workers**, on **page 61**.\n\nThe next two chapters are devoted to essential\
    \ design patterns: PubSub, a way of organizing callbacks by assigning them to\
    \ named events; and Promises, an intuitive object representation for one-shot\
    \ events."
  mdcn: "\n**第 1 章 理解 JavaScript 事件 •**\n\n你看到这里的问题了吗？我们的 try/catch 块只能捕获 setTimeout\
    \ 函数*内部*发生的错误。由于 setTimeout 是异步运行其回调函数的，即使超时时间为 0，它抛出的错误也会直接进入我们应用程序的未捕获异常处理程序（参见第\
