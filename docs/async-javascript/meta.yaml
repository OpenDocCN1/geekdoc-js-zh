    \ {\n    this[verb](object);\n});\ngrammarDeferred.resolveWith(slashdotter, ['comment',\
    \ 'Emacs']);\n```\n\n> Obviously Emacs is the best text editor.\n\nHaving to wrap\
    \ your arguments in an array is a pain, though. So, here's a handy tip: instead\
    \ of using `resolveWith`/`rejectWith`, you can just invoke plain `resolve`/`reject`\
