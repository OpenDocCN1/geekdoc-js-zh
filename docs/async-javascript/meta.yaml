  md: '# Set/Get on Evented Models


    JavaScript as we know it doesn''t have a mechanism for firing an event every time
    an object is modified. So, for evented models to work, we have to remember to
    use methods like Backbone''s set and get.


    ```

    style.set({font: ''Palatino''});  // triggers alert!

    style.get(''font'');              // "Palatino"

    style.font = ''Comic Sans'';      // no events fire

    style.font;                     // "Comic Sans"

    style.get(''font'');              // Still "Palatino"

    ```


    This may not be necessary in the future, if an ECMAScript proposal called Object.observe
    becomes widely adopted.a


    a. https://plus.google.com/111386188573471152118/posts/6peb6yffyWG


    To that end, Backbone models are often organized into Backbone collections, which
    are essentially evented arrays. You can listen for when models are added to and
    removed from them. Backbone collections automatically propagate events from the
    models they contain.


    For example, you might have a spriteCollection object containing hundreds of models
    representing things you''re drawing on a canvas element. Each time any of those
    sprites change, you need to redraw the canvas. Rather than attaching the redraw
    function as a handler for the change event on each sprite individually, you could
    instead just write the following:


    ```

    spriteCollection.on(''change'', redraw);

    ```


    Note that this automatic propagation goes only one level down. Backbone has no
    notion of nested collections. However, you can implement this propagation yourself
    using Backbone''s trigger method. With it, any Backbone object can emit arbitrary
    events.


    # Cycles and Nested Changes


    Propagating events from one object to another poses certain concerns. If an event
    on one object causes a series of events that will ultimately trigger the same
    event on the same object every time, then the result will be an event cycle. And
    if the cycle is synchronous, the result will be a stack overflow, like we saw
    in Synchronicity, on page 22.


    Yet oftentimes, a cycle of change events is exactly what we want. The most common
    case is a two-way binding, where two models have interrelated values. Suppose
    we want to ensure that x always equals 2 * y.'
