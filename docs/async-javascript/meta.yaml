  md: "# 2.2 Evented Models\n\nWhen an object has a PubSub interface, we call it an\
    \ _evented_ object. A special case is when an object used to store data (a _model_)\
    \ publishes events whenever its contents are modified. Models are the _M_ in Model-View-Controller\
    \ (MVC), which has become one of the hottest topics in JavaScript programming\
    \ in the last few years. The core concept is that MVC applications are data-centric\
    \ so that model events impact the DOM (aka the View) and the server (via the Controller).\n\
    \nLet's look at the hugely popular Backbone.js framework. You create a new model\
    \ like so:\n\n```\nstyle = new Backbone.Model({\n  { font: 'Georgia' }\n);\n```\n\
    \nmodel just represents the simple object that was passed in.\n\n```\nstyle.toJSON()\
    \ // {\"font\": \"Georgia\"}\n```\n\nBut unlike an ordinary object, this one publishes\
    \ notifications when a change is made.\n\n```\nstyle.on('change:font', function(model,\
    \ font) {\n  alert('Thank you for choosing ' + font + '!');\n});\n```\n\nOld-school\
    \ JavaScript made changes to the DOM directly from input event handlers. New-school\
    \ JavaScript makes changes to models, which then emit events that cause the DOM\
    \ to update. In nearly all apps, this separation of concerns results in more elegant,\
    \ intuitive code.\n\n# Propagating Model Events\n\nIn its simplest form, MVC consists\
    \ of wiring models to views: \"If this model changes this way, change the DOM\
    \ that way.\" But the biggest gains from MVC happen when change events bubble\
    \ up the data tree. Instead of subscribing to events on every leaf, you can just\
    \ subscribe to the roots and branches.\n\n> http://documentcloud.github.com/backbone/"
  merge: -1
