  - '[PAGE 34]


    # CHAPTER 2


    # Distributing Events


    In the previous chapter, we looked at how async events work in JavaScript. But
    in practice, how should we handle those events?


    That may sound like a silly question. Just attach a handler to each event your
    app cares about, right? But when a single event has several consequences, the
    "one event, one handler" approach forces handlers to grow to *gargantuan* proportions.


    Let''s say you''re building a web-based word processor like Google Docs. Every
    time a user presses a key, a number of things need to happen: the new character
    has to be displayed on the screen, the caret has to be moved, the action has to
    be pushed to the local undo history and synced to the server, spell-check may
    have to run, and the word count and page count may need to be updated. Carrying
    out all of these tasks and more from a single keypress handler is a daunting proposition.


    From a purely mechanical perspective, every task that we want performed in response
    to the event does indeed have to be initiated from its handler. But for the sake
    of us humans, it''s usually better to replace that massive event handler with
    a more malleable, dynamic construct—one that we can add tasks to, and remove tasks
    from, at runtime. In short, we want to use *distributed events*, where a single
    incident can trigger reactions throughout our application.


    In this chapter, you''ll learn to distribute events using the publish/subscribe
    pattern (aka *PubSub*). Along the way, we''ll meet several of PubSub''s manifestations:
    Node''s EventEmitter, Backbone''s evented models, and jQuery''s custom events.
    With the help of these tools, we''ll be able to un-nest callbacks, reduce duplication,
    and write event-driven code that''s easy to understand.'
  - "[PAGE 35]\n\n# ### 2.1 PubSub\n\nSince the dawn of JavaScript, browsers have\
    \ allowed event handlers to be attached to DOM elements like so:\n\n```\nlink.onclick\
    \ = clickHandler;\n```\n\nAh, simplicity itself! There's just one caveat: if you\
    \ wanted *two* click handlers for an element, you'd have to aggregate them yourself\
    \ with a wrapper function.\n\n```\nlink.onclick = function() {\n  clickHandler1.apply(this,\
    \ arguments);\n  clickHandler2.apply(this, arguments);\n};\n```\n\nNot only is\
    \ this tedious, it's also a recipe for bloated, all-purpose handler functions.\
    \ That's why the W3C added addEventListener to the DOM specification in 2000 and\
    \ jQuery abstracted it with the bind method. bind makes it easy to add as many\
    \ handlers as you like to any event on any element (or set of elements), without\
    \ worrying about stepping on anyone else's toes.\n\n```\n$(link)\n  .bind('click',\
    \ clickHandler1)\n  .bind('click', clickHandler2);\n```\n\n(In jQuery 1.7+, the\
    \ new on syntax is preferred over bind.[1](http://api.jquery.com/on/) There's\
    \ also the click method, which is a shorthand for bind('click', ...); however,\
    \ I prefer to consistently use bind/on.)\n\nFrom a software architecture perspective,\
    \ jQuery *publishes* the link element's events to anyone who wants to *subscribe*.\
    \ That's why it's called \"PubSub.\"\n\nTheologically speaking, PubSub is a kind\
    \ of democracy. The old-style DOM event API, where binding to event meant writing\
    \ object.onevent = ..., is now largely forgotten in favor of PubSub. The architects\
    \ of Node's API liked PubSub so much that they decided to include a generic PubSub\
    \ entity called EventEmitter that other objects can inherit from. Just about every\
    \ source of I/O in Node is an EventEmitter: file streams, HTTP servers, and even\
    \ the application process itself. To wit:\n\n```\n['room', 'moon', 'cow jumping\
    \ over the moon']\n.forEach(function(name) {\n  process.on('exit', function()\
    \ {\n    console.log('Goodnight, ' + name);\n  });\n});\n```"
  - "[PAGE 36]\n\nCountless stand-alone PubSub libraries exist for the browser. In\
    \ addition, many MVC frameworks like Backbone.js and Spine provide their own EventEmitter-like\
    \ modules. We'll talk more about Backbone later in this chapter.\n\n# EventEmitter\n\
    \nLet's use Node's EventEmitter as an example of a PubSub interface. It has a\
    \ simple, nearly minimal design.\n\nTo add an event handler to an EventEmitter,\
    \ just call on with the event type and the handler.\n\n```\nemitter.on('evacuate',\
    \ function(message) {\n  console.log(message);\n});\n```\n\nThe emit method will\
    \ call all handlers for the given event type. For instance, the following\n\n\
    ```\nemitter.emit('evacuate');\n```\n\nwould call all evacuate handlers.\n\nNote\
    \ that the term *event* here has nothing to do with the event queue. See [Synchronicity,\
    \ on page 22](#).\n\nYou can add any number of additional arguments when you emit\
    \ an event. All arguments are passed to all handlers.\n\n```\nemitter.emit('evacuate',\
    \ 'Woman and children first!');\n```\n\nThere are no restrictions on event names,\
    \ though the Node docs offer a useful convention.\n\nTypically, event names are\
    \ represented by a camel-cased string.^[2](http://nodejs.org/docs/latest/api/events.html)^\n\
    \nAll of EventEmitter's methods are public, but it's common convention for events\
    \ to be emitted only from \"inside\" the EventEmitter. That is, if you have an\
    \ object that inherits the EventEmitter prototype and uses this.emit to broadcast\
    \ events, its emit method shouldn't be called elsewhere.\n\n# Roll Your Own PubSub\n\
    \nPubSub implementations are so simple that we can create one in about a dozen\
    \ lines of code. The only state we need to store is a list of handlers for each\
    \ event type we support.\n\n```\nPubSub = {handlers: {}}\n```\n\n2. http://nodejs.org/docs/latest/api/events.html"
  - "[PAGE 37]\n\nWhen we add a listener, we push it to the end of the array (which\
    \ means that listeners will always be called in the order in which they were added).\n\
    \n```\nPubSub.on = function(eventType, handler) {\n  if (!(eventType in this.handlers))\
    \ {\n    this.handlers[eventType] = [];\n  }\n\n  this.handlers[eventType].push(handler);\n\
    \  return this;\n}\n```\n\nThen when an event is emitted, we loop through all\
    \ of our handlers.\n\n```\nPubSub.emit = function(eventType) {\n  var handlerArgs\
    \ = Array.prototype.slice.call(arguments, 1);\n  for (var i = 0; i < this.handlers[eventType].length;\
    \ i++) {\n    this.handlers[eventType][i].apply(this, handlerArgs);\n  }\n  return\
    \ this;\n}\n```\n\nThat's it. We've just implemented the core of Node's EventEmitter.\
    \ (The only major things we're missing are the ability to remove handlers and\
    \ to attach one-time handlers.)\n\nOf course, PubSub implementations vary slightly\
    \ feature-wise. When the jQuery team noticed that several different PubSub implementations\
    \ were being used throughout the library, they decided to abstract them with $.Callbacks\
    \ in jQuery 1.7.³ Instead of using an array to store the handlers corresponding\
    \ to an event type, you could use a $.Callbacks instance.\n\nMany PubSub implementations\
    \ parse the event string to provide special features. For example, you may be\
    \ familiar with namespaced events in jQuery: if I bind events named \"click.tbb\"\
    \ and \"hover.tbb\", I can unbind them both by simply calling unbind(\".tbb\"\
    ). Backbone.js lets you bind handlers to the \"all\" event type, causing them\
    \ to go off whenever anything happens. Both jQuery and Backbone let you bind or\
    \ emit multiple event types simultaneously by separating them with spaces, e.g.,\
    \ \"keypress mousemove\".\n\n# ## Synchronicity\n\nAlthough PubSub is an important\
    \ technique for dealing with async events, there's nothing inherently async about\
    \ it. Consider this code:"
  - "[PAGE 38]\n\n```\n$('input[type=submit]')\n.on('click', function() { console.log('foo');\
    \ })\n.trigger('click');\nconsole.log('bar');\n```\n\nThe output is\n\n```\nfoo\n\
    bar\n```\n\nproving that the click handler was invoked immediately by trigger.\
    \ In fact, whenever a jQuery event fires, all of its handlers will be executed\
    \ sequentially without interruption.\n\nSo, let's be clear: when the user clicks\
    \ the Submit button, that's an async event. The first click handler fires from\
    \ the event queue. But the event handler has no way of knowing whether it's being\
    \ run from the event queue or from your application code.\n\nIf too many handlers\
    \ fire in sequence, you risk blocking the thread and making the browser unresponsive.\
    \ Worse, if events are emitted from event handlers, they can easily create an\
    \ infinite cycle.\n\n```\n$('input[type=submit]')\n.on('click', function() {\n\
    \  $(this).trigger('click');  // stack overflow!\n});\n```\n\nThink back to the\
    \ word processor example at the start of this chapter. When a user presses a key,\
    \ many things need to happen, and several of them require complex calculations.\
    \ Doing them all before returning to the event queue would be a recipe for an\
    \ unresponsive app.\n\nA good solution to this problem is to maintain a queue\
    \ of things that don't need to happen right away and use a timed function to run\
    \ the next task in the queue periodically. A first attempt might look something\
    \ like this:\n\n```\nvar tasks = [];\nsetInterval(function() {\n  var nextTask;\n\
    \  if (nextTask = tasks.shift()) {\n    nextTask();\n  };\n}, 0);\n```\n\n(We'll\
    \ learn about a more sophisticated approach to job queuing in **Section 4.4, *Dynamic\
    \ Async Queuing***, on page 54.)\""
- md: " ## 2.2 Evented Models\n\nWhen an object has a PubSub interface, we call it\
    \ an _evented_ object. A special case is when an object used to store data (a\
    \ _model_) publishes events whenever its contents are modified. Models are the\
    \ _M_ in Model-View-Controller (MVC), which has become one of the hottest topics\
    \ in JavaScript programming in the last few years. The core concept is that MVC\
    \ applications are data-centric so that model events impact the DOM (aka the View)\
    \ and the server (via the Controller).\n\nLet's look at the hugely popular Backbone.js\
    \ framework. You create a new model like so:\n\n```\nstyle = new Backbone.Model({\n\
    \  font: 'Georgia'\n});\n```\n\n`model` just represents the simple object that\
    \ was passed in.\n\n```\nstyle.toJSON() // {\"font\": \"Georgia\"}\n```\n\nBut\
    \ unlike an ordinary object, this one publishes notifications when a change is\
    \ made.\n\n```\nstyle.on('change:font', function(model, font) {\n  alert('Thank\
    \ you for choosing ' + font + '!');\n});\n```\n\nOld-school JavaScript made changes\
    \ to the DOM directly from input event handlers. New-school JavaScript makes changes\
    \ to models, which then emit events that cause the DOM to update. In nearly all\
    \ apps, this separation of concerns results in more elegant, intuitive code.\n\
    \n## Propagating Model Events\n\nIn its simplest form, MVC consists of wiring\
    \ models to views: \"If this model changes this way, change the DOM that way.\"\
    \ But the biggest gains from MVC happen when change events bubble up the data\
    \ tree. Instead of subscribing to events on every leaf, you can just subscribe\
    \ to the roots and branches.\n\n> http://documentcloud.github.com/backbone/\n\n\
    ## Set/Get on Evented Models\n\nJavaScript as we know it doesn't have a mechanism\
    \ for firing an event every time an object is modified. So, for evented models\
    \ to work, we have to remember to use methods like Backbone's `set` and `get`.\n\
    \n```\nstyle.set({font: 'Palatino'});  // triggers alert!\nstyle.get('font');\
    \              // \"Palatino\"\nstyle.font = 'Comic Sans';      // no events fire\n\
    style.font;                     // \"Comic Sans\"\nstyle.get('font');        \
    \      // Still \"Palatino\"\n```\n\nThis may not be necessary in the future,\
    \ if an ECMAScript proposal called Object.observe becomes widely adopted.a\n\n\
    a. https://plus.google.com/111386188573471152118/posts/6peb6yffyWG\n\nTo that\
    \ end, Backbone models are often organized into Backbone collections, which are\
    \ essentially evented arrays. You can listen for when models are added to and\
    \ removed from them. Backbone collections automatically propagate events from\
    \ the models they contain.\n\nFor example, you might have a `spriteCollection`\
    \ object containing hundreds of models representing things you're drawing on a\
    \ canvas element. Each time any of those sprites change, you need to redraw the\
    \ canvas. Rather than attaching the redraw function as a handler for the `change`\
    \ event on each sprite individually, you could instead just write the following:\n\
    \n```\nspriteCollection.on('change', redraw);\n```\n\nNote that this automatic\
    \ propagation goes only one level down. Backbone has no notion of nested collections.\
    \ However, you can implement this propagation yourself using Backbone's `trigger`\
    \ method. With it, any Backbone object can emit arbitrary events.\n\n## Cycles\
    \ and Nested Change\n\nPropagating events from one object to another poses certain\
    \ concerns. If an event on one object causes a series of events that will ultimately\
    \ trigger the same event on the same object every time, then the result will be\
    \ an event cycle. And if the cycle is synchronous, the result will be a stack\
    \ overflow, like we saw in Synchronicity, on page 22.\n\nYet oftentimes, a cycle\
    \ of change events is exactly what we want. The most common case is a two-way\
    \ binding, where two models have interrelated values. Suppose we want to ensure\
    \ that x always equals 2 * y.\n\n```\nvar x = new Backbone.Model({value: 0});\n\
    var y = new Backbone.Model({value: 0});\nx.on('change:value', function(x, xVal)\
    \ { y.set({value: xVal / 2}); });\ny.on('change:value', function(y, yVal) { x.set({value:\
    \ 2 * yVal}); });\n```\n\nYou might expect this code to lead to an infinite loop\
    \ the moment the value of x or y is changed. But actually, it's quite safe, thanks\
    \ to two safeguards in Backbone.\n\n- `set` doesn't emit a change event if the\
    \ new value matches the old one.\n- Models can't emit a change event during one\
    \ of its own change events.\n\nThe second safeguard presents gotchas of its own.\
    \ Suppose a change is made to a model that results in a second change to the same\
    \ model. Because the second change is \"nested\" in the first one, it'll occur\
    \ silently. Observers won't have a chance to respond to it.\n\nClearly, maintaining\
    \ two-way data bindings in Backbone is a challenge. Another major MVC framework,\
    \ Ember.js, takes a different approach: two-way bindings are declared explicitly.\
    \ When one value changes, the other is updated asynchronously from a timeout event.\
    \ So, until that event fires, the application's data may be in an inconsistent\
    \ state.\n\nThere's no easy solution to the problem of bindings across evented\
    \ models. In Backbone, a prudent way to step around the issue is the `silent`\
    \ flag. If you add `{silent: true}` to a `set` event, no change event will happen.\
    \ So, if several entangled models need to be updated at once, a good approach\
    \ is to set them silently. Then call their change methods to fire the appropriate\
    \ events only after they're in a consistent state.\n\nEvented models give us an\
    \ intuitive way of transforming application state changes into events. Everything\
    \ Backbone and other MVC frameworks do is about these models, updating the DOM\
    \ and the server when their states change. Storing mutable data in evented models\
    \ is a great first step to reigning in the growing complexity of client-side JavaScript\
    \ applications.\n\n### 2.3 Custom jQuery Events\n\nCustom events are an underappreciated\
    \ feature of jQuery that make it easy to graft a powerful distributed event system\
    \ onto any web app, with no additional libraries. You can emit any event you want\
    \ from any DOM element from jQuery using `trigger`.\n\n```\n$('#tabby, #socks').on('meow',\
    \ function() {\n console.log(this.id + ' meowed');\n});\n$('#tabby').trigger('meow');\
    \ // \"tabby meowed\"\n$('#socks').trigger('meow'); // \"socks meowed\"\n```\n\
    \nIf you've worked with DOM events before, you're no doubt familiar with bubbling.\
    \ Whenever an element emits an event (such as a 'click'), its parent then emits\
    \ the event, then its grandparent, and so on, up to the root element, `document`—unless\
    \ the event's `stopPropagation` method is called at some point along the way.\
    \ (jQuery does this for us automatically when we return `false` from a handler.)\
    \ But did you know that jQuery's custom events bubble as well? For instance, if\
    \ we have a span named \"soda\" nested in a div named \"bottle,\" the code\n\n\
    ```\n$('#soda, #bottle').on('fizz', function() {\n    console.log(this.id + '\
    \ emitted fizz');\n});\n$('#soda').trigger('fizz');\n```\n\nwill emit the following\
    \ output:\n\n```\nsoda emitted fizz\nbottle emitted fizz\n```\n\nThis bubbling\
    \ isn't always desirable, as we'll see in the following tooltips example. Fortunately,\
    \ jQuery offers the nonbubbling `triggerHandler` method as well.\n\n## Example:\
    \ Tooltips\n\nWhen events can be mapped intuitively to page elements, jQuery is\
    \ an ideal way of distributing them. For instance, suppose you're writing a tooltip\
    \ library and you want only one tooltip to be visible at a time. You might simply\
    \ add the line\n\n```\n$('.tooltip').remove();\n```\n\nto the start of the function\
    \ that adds new tooltips. But what if we decide later that we want certain containers\
    \ to be isolated, such as when a new tooltip is shown in the sidebar, tooltips\
    \ everywhere else are unaffected, and vice versa? Writing a selector for \"elements\
    \ with class tooltip that are not descendants of sidebar\" is tricky and not very\
    \ efficient. The problem would get exponentially harder if we decided to allow\
    \ isolated containers to be nested to an arbitrary depth.\n\nBut implementing\
    \ this behavior with event logic rather than selector logic is easy.\n\n```\n\
    // $container could be $('#sidebar') or $(document)\n$container.triggerHandler('newTooltip');\n\
    $container.one('newTooltip', function() {\n    $tooltip.remove();\n});\n```"
  mdcn: "\n ## 2.2 事件化模型\n\n当一个对象拥有 PubSub 接口时，我们称其为_事件化_对象。一种特殊情况是，当用于存储数据的对象（_模型_）在其内容被修改时发布事件。模型是模型-视图-控制器（MVC）中的\
    \ _M_，这在过去的几年里已成为 JavaScript 编程中最热门的话题之一。核心概念是 MVC 应用以数据为中心，因此模型事件会影响 DOM（也称为视图）和服务器（通过控制器）。\n\
    \n让我们看看大受欢迎的 Backbone.js 框架。你可以这样创建一个新的模型：\n\n```\nstyle = new Backbone.Model({\n\
    \  font: 'Georgia'\n});\n```\n\n`model` 仅代表传入的那个简单对象。\n\n```\nstyle.toJSON() //\
    \ {\"font\": \"Georgia\"}\n```\n\n但与普通对象不同，这个对象会在做出更改时发布通知。\n\n```\nstyle.on('change:font',\
    \ function(model, font) {\n  alert('感谢你选择 ' + font + '!');\n});\n```\n\n传统 JavaScript\
    \ 直接通过输入事件处理程序更改 DOM。新一代 JavaScript 更改模型，然后发出事件，从而导致 DOM 更新。在几乎所有应用中，这种关注点分离带来了更优雅、更直观的代码。\n\
    \n## 传播模型事件\n\n在最简单的形式下，MVC 由将模型连接到视图组成：“如果模型以这种方式更改，DOM 就以这种方式更改。”但 MVC 的最大收益发生在变更事件沿着数据树向上冒泡时。你无需在每个叶节点订阅事件，只需订阅根节点和分支即可。\n\
    \n> http://documentcloud.github.com/backbone/\n\n## 事件化模型上的 Set/Get\n\n正如我们所知，JavaScript\
    \ 没有机制在每次对象被修改时触发事件。因此，为了让事件化模型起作用，我们必须记得使用像 Backbone 的 `set` 和 `get` 这样的方法。\n\
    \n```\nstyle.set({font: 'Palatino'});  // 触发警报！\nstyle.get('font');          \
    \    // \"Palatino\"\nstyle.font = 'Comic Sans';      // 不会触发事件\nstyle.font; \
    \                    // \"Comic Sans\"\nstyle.get('font');              // 仍然是\
    \ \"Palatino\"\n```\n\n如果被称为 Object.observe 的 ECMAScript 提案被广泛采用，这在将来可能不再是必需的a。\n\
    \na. https://plus.google.com/111386188573471152118/posts/6peb6yffyWG\n\n为此，Backbone\
    \ 模型通常组织成 Backbone 集合，这些集合本质上是事件化数组。你可以监听模型何时被添加或从中移除。Backbone 集合会自动传播它们包含的模型中的事件。\n\
    \n例如，你可能有一个 `spriteCollection` 对象，其中包含数百个代表你在画布元素上绘制内容的模型。每当这些精灵中的任何一个发生变化时，你都需要重绘画布。与其将重绘函数单独作为每个精灵的\
    \ `change` 事件的处理程序附加上去，你只需编写以下内容：\n\n```\nspriteCollection.on('change', redraw);\n\
    ```\n\n请注意，这种自动传播仅向下延伸一级。Backbone 没有嵌套集合的概念。然而，你可以使用 Backbone 的 `trigger` 方法自己实现这种传播。通过它，任何\
    \ Backbone 对象都可以发出任意事件。\n\n## 循环和嵌套变更\n\n从一个对象向另一个对象传播事件会引起某些关注。如果一个对象上的事件引发了一系列事件，最终每次都会触发同一对象上的同一事件，那么结果就是一个事件循环。如果循环是同步的，结果将是栈溢出，就像我们在第\
    \ 22 页的同步性中所见。\n\n然而，通常情况下，变更事件的循环正是我们所想要的。最常见的情况是双向绑定，其中两个模型具有相互关联的值。假设我们要确保\
    \ x 始终等于 2 * y。\n\n```\nvar x = new Backbone.Model({value: 0});\nvar y = new Backbone.Model({value:\
    \ 0});\nx.on('change:value', function(x, xVal) { y.set({value: xVal / 2}); });\n\
    y.on('change:value', function(y, yVal) { x.set({value: 2 * yVal}); });\n```\n\n\
    你可能期望这段代码在 x 或 y 的值被更改的瞬间导致无限循环。但实际上，由于 Backbone 中的两个保护措施，它非常安全。\n\n- 如果新值与旧值匹配，`set`\
    \ 不会发出变更事件。\n- 模型不能在其自身的变更事件期间发出变更事件。\n\n第二个保护措施本身也存在陷阱。假设对模型进行了更改，导致对同一模型进行了第二次更改。因为第二次更改是“嵌套”在第一次中的，它会静默发生。观察者没有机会对此做出反应。\n\
    \n显然，在 Backbone 中维护双向数据绑定是一个挑战。另一个主要的 MVC 框架 Ember.js 采取了不同的方法：双向绑定是显式声明的。当一个值更改时，另一个值会从超时事件异步更新。因此，在该事件触发之前，应用程序的数据可能处于不一致状态。\n\
    \n跨事件化模型的绑定问题没有简单的解决方案。在 Backbone 中，明智地避开这个问题的方法是使用 `silent` 标志。如果你向 `set` 添加\
    \ `{silent: true}`，就不会发生变更事件。因此，如果需要同时更新几个纠缠的模型，一个很好的方法是将它们静默设置。然后调用它们的更改方法，以仅在它们处于一致状态时触发适当的事件。\n\
    \n事件化模型为我们提供了一种直观的方式，将应用程序状态变化转换为事件。Backbone 和其他 MVC 框架所做的所有事情都是关于这些模型，当它们的状态发生变化时更新\
    \ DOM 和服务器。在事件化模型中存储可变数据是控制客户端 JavaScript 应用程序日益增长的复杂性的绝佳第一步。\n\n### 2.3 自定义 jQuery\
    \ 事件\n\n自定义事件是 jQuery 的一个未被充分重视的特性，它使得在任何 Web 应用中嫁接一个强大的分布式事件系统变得容易，而无需额外的库。你可以使用\
    \ `trigger` 从 jQuery 中的任何 DOM 元素发出任何你想要的事件。\n\n```\n$('#tabby, #socks').on('meow',\
    \ function() {\n console.log(this.id + ' meowed');\n});\n$('#tabby').trigger('meow');\
    \ // \"tabby meowed\"\n$('#socks').trigger('meow'); // \"socks meowed\"\n```\n\
    \n如果你之前处理过 DOM 事件，那么你无疑熟悉冒泡现象。每当一个元素发出一个事件（例如 'click'），它的父元素就会发出该事件，然后是其祖父元素，依此类推，一直上升到根元素\
    \ `document`——除非在此过程中某处调用了事件的 `stopPropagation` 方法。（当我们从处理程序返回 `false` 时，jQuery\
    \ 会自动为我们执行此操作。）。但你是否知道 jQuery 的自定义事件也会冒泡？例如，如果我们有一个名为 \"soda\" 的 span 嵌套在一个名为\
    \ \"bottle\" 的 div 中，代码\n\n```\n$('#soda, #bottle').on('fizz', function() {\n\
    \    console.log(this.id + ' emitted fizz');\n});\n$('#soda').trigger('fizz');\n\
    ```\n\n将产生以下输出：\n\n```\nsoda emitted fizz\nbottle emitted fizz\n```\n\n这种冒泡并不总是可取的，我们将在下面的工具提示示例中看到这一点。幸运的是，jQuery\
    \ 也提供了非冒泡的 `triggerHandler` 方法。\n\n## 示例：工具提示\n\n当事件可以直观地映射到页面元素时，jQuery 是分发它们的理想方式。例如，假设你在编写一个工具提示库，并且你希望一次只显示一个工具提示。你可能只是简单地在添加新工具提示的函数开头添加一行代码\n\
    \n```\n$('.tooltip').remove();\n```\n\n但是，如果我们稍后决定希望某些容器被隔离，例如当侧边栏中显示新工具提示时，其他地方不受影响，反之亦然呢？编写“不属于侧边栏后代的带有\
    \ tooltip 类的元素”的选择器很棘手，而且效率不高。如果我们决定允许隔离容器嵌套到任意深度，问题将呈指数级增长。\n\n但是，使用事件逻辑而不是选择器逻辑来实现这种行为很容易。\n\
    \n```\n// $container 可以是 $('#sidebar') 或 $(document)\n$container.triggerHandler('newTooltip');\n\
    $container.one('newTooltip', function() {\n    $tooltip.remove();\n});\n```\n"
