    You might wonder what''s so great about this change. Why would you want to attach
    a callback after an Ajax call has fired? In a word: *encapsulation*. If an Ajax
    call has multiple effects (triggering animations, inserting HTML, locking/unlocking
    user input, and so on), it''s awkward for the part of your app that''s making
    the request to handle all of them.


    It''s much more elegant to pass a Promise around. By passing a Promise, you''re
    announcing, "Something you might be interested in is happening. If you want to
    find out when it''s done, just give this Promise a callback." And like an EventEmitter,
    a Promise allows you to bind handlers to the same event as many times as you like
    (*stacking*). That makes it a lot easier to reduce code duplication when some
    small piece of functionality (like a "Loading" animation) is shared across several
    Ajax calls.


    But the biggest advantage of using Promises is that you can easily derive new
    Promises from existing ones. You might ask two Promises representing parallel
    tasks to give you a Promise that will inform you of their mutual completion. Or
    you might ask a Promise representing the first task in a series to give you a
    Promise representing the *final* task in the series. As we''ll soon see, these
    operations come naturally with Promises.


    # 3.1 A Very Brief History of Promises


    Promises have existed in many forms in many languages. The term was first used
    by C++ engineers on the Xanadu project, a forerunner to the Web. Promises were
    later used in the E programming language, which inspired Python developers to
    implement them in the form of the Twisted framework''s Deferreds.


    Promises hit the JavaScript mainstream in 2007 when the Dojo framework, taking
    a cue from Twisted, added an object called dojo.Deferred. At the time, the relatively
    mature Dojo rivaled the fledgling jQuery framework in popularity. In 2009, citing
    dojo.Deferred as an influence, Kris Zyp proposed the CommonJS Promises/A spec.¹
    That same year, Node.js made its first appearance. Node''s early iterations used
    Promises in its nonblocking API. However, in February 2010, Ryan Dahl made the
    decision to switch to the


