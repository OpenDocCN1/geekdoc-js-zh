  - "[PAGE 66]\n\nIn our original async code, we had three throws. In the Async.js\
    \ version, we have two, yet all errors will still be thrown. How does Async.js\
    \ do it? And why can't we have just one throw?\n\nSimply put, Async.js follows\
    \ Node conventions. This means that every I/O callback has the form (err, results...)—with\
    \ the exception of callbacks where the result is a boolean. Boolean callbacks\
    \ just have the form (result), which is why our isFilename iterator from the previous\
    \ code example needs to handle errors on its own.\n\n```\nAsyncjs/forEachSeries.js\n\
    function isFilename(filename, callback) {\n  fs.stat(filename, function(err, stats)\
    \ {\n    if (err) throw err;\n    callback(stats.isFile());\n  });\n}\n```\n\n\
    Blame Node's fs.exists for setting this precedent. That means that the iterators\
    \ for the Async.js collection methods (filter, reject, detect, some, every, and\
    \ their series equivalents) can't report errors.\n\nWith all non-boolean Async.js\
    \ iterators, passing a value other than null or undefined as the first argument\
    \ to the iterator's callback will immediately invoke the completion callback with\
    \ that error. That's why readAndConcat can do without throw.\n\n```\nAsyncjs/forEachSeries.js\n\
    function readAndConcat(filename, callback) {\n  fs.readFile(filename, 'utf8',\
    \ function(err, fileContents) {\n    if (err) return callback(err);\n    concatenation\
    \ += fileContents;\n    callback();\n  });\n}\n```\n\nSo, if callback(err) does\
    \ get called from readAndConcat, that err will be passed to onComplete. Async.js\
    \ guarantees that onComplete will be called only once, either the first time an\
    \ error occurs or after all operations have finished successfully.\n\n```\nAsyncjs/forEachSeries.js\n\
    function onComplete(err) {\n  if (err) throw err;\n  console.log(concatenation);\n\
    }\n```"
  - "[PAGE 67]\n\nNode's error conventions may not ideal for Async.js's collection\
    \ methods. But for all of Async.js's other methods, following these conventions\
    \ allow errors to flow neatly from individual tasks to the completion callback.\
    \ We'll see more examples of this in the next section.\n\n# 4.3 Organizing Tasks\
    \ with Async.js\n\nAsync.js's collection methods solve the problem of applying\
    \ a single async function to a set of data. But what if, instead of a set of data,\
    \ we have a set of functions? In this section, we'll explore some of the powerful\
    \ tools that Async.js has for dispatching async functions and collecting their\
    \ results.\n\n# Running an Async Series\n\nSuppose we have an array of async functions\
    \ that we want to run in order. Without the use of a utility function, we might\
    \ have to write something like this:\n\n```\nfuncs[0](function() {\n  funcs[1](function()\
    \ {\n    funcs[2](onComplete);\n  })\n});\n```\n\nFortunately, we have async.series\
    \ and async.waterfall. Each takes an array of functions (the task list) and runs\
    \ them sequentially, passing each one a Node-style callback. The difference between\
    \ the two is that async.series provides only the callback to each task, whereas\
    \ async.waterfall also provides the results from the previous task. (By \"results,\"\
    \ I mean the nonerror values each task passes to its callback.)\n\nLet's look\
    \ at a simple demonstration using timeouts.\n\n```\nAsyncjs/seriesTimers.js\n\
    var async = require ('async');\n\nvar start = new Date;\n\nasync.series([\n  function(callback)\
    \ { setTimeout(callback, 100); },\n  function(callback) { setTimeout(callback,\
    \ 300); },\n  function(callback) { setTimeout(callback, 200); }\n], function(err,\
    \ results) {\n  // show time elapsed since start\n  console.log('Completed in\
    \ ' + (new Date - start) + 'ms');\n});\n```"
- md: "\n\n(Substituting async.waterfall for async.series would have no effect on\
    \ this example, since each task's callback is run with no arguments.)\n\nThe completion\
    \ handler will run after a little over 600ms because each task in the array is\
    \ completed in order. The callback that Async.js passes to each task function\
    \ simply asks, \"Is there an error (the first argument)? If not, then I'll collect\
    \ the result (the second argument) and run the next task.\"\n\nThe next time you\
    \ have a set of async functions that you want to run sequentially, reach for async.series\
    \ or async.waterfall. There's an excellent chance that one of them is the right\
    \ tool for the job.\n\n## Parallelizing Async Functions\n\nAsync.js offers a parallel\
    \ analog of async.series called async.parallel. Just like async.series, it takes\
    \ an array of functions of the form `function(callback) {...}`, plus an (optional)\
    \ completion handler that runs after the last callback fires.\n\nLet's repeat\
    \ our timeout example.\n\n```js\n// Asyncjs/parallelTimers.js\nvar async = require('async');\n\
    var start = new Date;\nasync.parallel([\n  function(callback) { setTimeout(callback,\
    \ 100); },\n  function(callback) { setTimeout(callback, 300); },\n  function(callback)\
    \ { setTimeout(callback, 200); }\n], function(err, results) {\n  console.log('Completed\
    \ in ' + (new Date - start) + 'ms');\n});\n```\n\nWhereas async.series took the\
    \ sum of the timeouts to complete (~600ms), async.parallel takes only the max\
    \ timeout (~300ms).\n\nConveniently, Async.js passes the results to the completion\
    \ handler in the order corresponding to the task array, not the order in which\
    \ the results were generated. Thus, you get the performance benefits of parallelism\
    \ without the unpredictability.\n\nAlong with the collection methods, async.series,\
    \ async.waterfall, and async.parallel are the heart and soul of Async.js: simple,\
    \ time-saving utility functions for the most common async scenarios.\n\n+ - The\
    \ task array is static. Once you've called async.series or async.parallel, you\
    \ can't add or remove tasks.\n- There's also no way to ask, \"How many tasks have\
    \ been completed?\" It's a black box, unless you dispatch updates from the tasks\
    \ themselves.\n- You're limited to either no concurrency or unlimited concurrency.\
    \ That's a pretty big deal when it comes to file I/O. If we're operating on thousands\
    \ of files, we don't want to be inefficient by doing a series, but we're likely\
    \ to anger the OS if we try to do everything in parallel.\n\nAsync.js provides\
    \ a versatile method that addresses every one of these issues: async.queue.\n\n\
    ### Understanding the Queue\n\nThe basic concept underlying async.queue is reminiscent\
    \ of a DMV; it can handle multiple people simultaneously (up to the number of\
    \ clerks on duty), but rather than have a separate line for each clerk, it has\
    \ a single stack of numbers. When you arrive, you get a number. As each clerk\
    \ becomes free, the clerk calls the next number.\n\nasync.queue's interface is\
    \ a bit more complex than that of async.series and async.parallel. It takes a\
    \ function called the worker (rather than an array of functions) and a concurrency\
    \ value (the maximum number of simultaneous tasks the worker can process). Then\
    \ it returns a queue that we can push arbitrary task data onto (along with an\
    \ optional callback).\n\nHere's a trivial example:\n\n```js\n// Asyncjs/simpleQueue.js\n\
    var async = require('async');\n\nfunction worker(data, callback) {\n  console.log(data);\n\
    \  callback();\n}\nvar concurrency = 2;\nvar queue = async.queue(worker, concurrency);\n\
    queue.push(1);\nqueue.push(2);\nqueue.push(3);\n```\n\nNo matter what the concurrency\
    \ is (as long as it's at least 1), we get the following output:\n\n```\n1\n2\n\
    3\n```\n\nThere is a difference under the hood, though: with concurrency of 2,\
    \ we need two trips to the event queue. If it were 1, we'd need three trips, one\
    \ for each line. And if it were 3 or more, we'd need just one trip.\n\nA queue\
    \ with concurrency of 0 will do nothing. And if you want maximum concurrency,\
    \ just use Infinity.\n\n### Pushing Tasks\n\nAlthough queue.push shares the same\
    \ name as [].push, there are two critical differences.\n\nFirst,\n\n```js\nqueue.push([1,\
    \ 2, 3]);\n```\n\nis equivalent to the following:\n\n```js\nqueue.push(1);\nqueue.push(2);\n\
    queue.push(3);\n```\n\nThis means you can't use arrays directly as task data.\
    \ You can, however, use anything else—even functions. In fact, if you want to\
    \ use an array of functions like you would with async.series or async.parallel,\
    \ all you need to do is define a worker that passes its second argument to its\
    \ first.\n\n```js\nfunction worker(task, callback) {\n  task(callback);\n}\nvar\
    \ concurrency = 2;\nvar queue = async.queue(worker, concurrency);\nqueue.push(tasks);\n\
    ```\n\nSecond, you can provide a callback function along with each push; if you\
    \ do, it's given directly to the worker function as the callback argument. So,\
    \ for instance,\n\n```js\nqueue.push([1, 2, 3], function(err, result) {\n  console.log('Task\
    \ complete!');\n});\n```\n\nwill (assuming that the worker runs its callback)\
    \ emit the output Task complete! three times. push callbacks are invaluable because\
    \ async.queue, unlike async.series/async.parallel, doesn't store results internally.\
    \ If you want them, you'll have to capture them yourself.\n\n### Handling Completion\n\
    \nAs with `async.series` and its ilk, we can give `async.queue` a completion handler.\
    \ Instead of passing it as an argument, though, we need to attach it as a property\
    \ called `drain`. (Picture a tub full of incomplete tasks; when the last one has\
    \ gone down the drain, the callback fires.) Here's a demonstration with timers:\n\
    \n```js\n// Asyncjs/queueTimers.js\nvar async = require('async');\n\nfunction\
    \ worker(data, callback) {\n  setTimeout(callback, data);\n}\nvar concurrency\
    \ = 2;\nvar queue = async.queue(worker, concurrency);\nvar start = new Date;\n\
    queue.drain = function() {\n  console.log('Completed in ' + (new Date - start)\
    \ + 'ms');\n};\n\nqueue.push([100, 300, 200]);\n```\n\nRecall that `async.series`\
    \ took ~600ms to get through these timeouts (the sum), while `async.parallel`\
    \ took only ~300ms (the max). Here, concurrency is 2, so initially, the first\
    \ two timeouts will run in parallel. But when the 100ms timeout finishes, the\
    \ next task on the queue (the 200ms timeout) will immediately start. So, in this\
    \ case, `async.queue` will finish at about the same time as `async.parallel`.\
    \ The order matters: if 300 were the third timeout, the queue would take ~400ms\
    \ to complete.\n\nNote that we can always push more tasks onto the queue, and\
    \ `drain` will fire *every time* the last task on the queue has finished. Unfortunately,\
    \ this means that `async.queue` can't give us neatly ordered results the way `async.waterfall`\
    \ could. If we want to collect data from our queued tasks, we're on our own.\n\
    \n### Advanced Queue Callbacks\n\nAlthough `drain` is usually the only handler\
    \ you'll need, `async.queue` provides a few other events.\n\n+ - When the last\
    \ task has started running, the queue calls `empty`. (When the task finishes,\
    \ the queue calls `drain`.)\n- When the concurrency limit is reached, the queue\
    \ calls `saturated`.\n- If you provide a function as the second argument in a\
    \ `push`, it'll be called when the given task (or each task in the given array)\
    \ is finished.\n\nIn this section, we've seen how async.queue is one of the most\
    \ powerful functions in Async.js. When you need to run a large number of async\
    \ tasks with limited concurrency, think async.queue.\n\nThat's it for our coverage\
    \ of Async.js, the most widely used and, arguably, most feature-rich JavaScript\
    \ flow control library. However, I don't want you to get the impression that Async.js\
    \ is the right tool for every callback-driven job. Let's close out the chapter\
    \ by looking at one of its top rivals, Step.\n\n## 4.5 Minimalist Flow Control\
    \ with Step\n\nTim Caswell's Step is a lightweight library.[5] In fact, its API\
    \ consists of a single function: Step.\n\nStep takes a list of functions; here's\
    \ an example:\n\n```js\nStep(task1, task2, task3);\n```\n\nEach function can control\
    \ the flow in three ways.\n\n+ - It can call this to make Step run the next function\
    \ in the list.\n+ - It can call a callback generated by this.parallel or this.group\
    \ n times to tell Step to run the next function n times.\n+ - It can return a\
    \ value, which will also make Step run the next function in the list. This makes\
    \ it easy to mix synchronous functions with async ones.\n\nThe next function will\
    \ receive the results of its predecessor (that is, its return value or the arguments\
    \ it passed to this) or the results of all instances of its predecessor if that\
    \ predecessor was run with this.parallel or this.group. (The difference is that\
    \ this.parallel provides those results as separate arguments, while this.group\
    \ merges them into arrays.)\n\nThe entire library is, as of this writing, just\
    \ 152 lines long (with comments) yet is versatile enough to handle most async\
    \ flows. The downside of this minimalism is that a flow created with Step can\
    \ be understood only by reading each function in it. Flows created with the everything-but-the-kitchen-sink\
    \ Async.js tend to be more self-explanatory.\n\nStill, if you feel like rolling\
    \ up your sleeves, writing Async.js-like utility functions in Step can be a great\
    \ exercise. For example, here's the equivalent of async.map in just eleven lines:\n\
    \n5. https://github.com/creationix/step\n[/content]"
  mdcn: "\n(在此示例中，用 async.series 替换 async.waterfall 不会产生任何影响，因为每个任务的回调都是不带参数运行的。)\n\
    \n完成处理程序将在大约 600 毫秒后运行，因为数组中的每个任务都是按顺序完成的。Async.js 传递给每个任务函数的回调只问：\"有没有错误（第一个参数）？如果没有，那么我将收集结果（第二个参数）并运行下一个任务。\"\
    \n\n下次当你有一组想要顺序运行的异步函数时，请使用 async.series 或 async.waterfall。很有可能其中之一就是这项工作的合适工具。\n\
    \n## 并行化异步函数\n\nAsync.js 提供了一个与 async.series 对应的并行版本，称为 async.parallel。与 async.series\
    \ 一样，它接受一个形式为 `function(callback) {...}` 的函数数组，以及一个（可选的）完成处理程序，该处理程序在最后一个回调触发后运行。\n\
    \n让我们重复一下 timeout 示例。\n\n```js\n// Asyncjs/parallelTimers.js\nvar async = require('async');\n\
    var start = new Date;\nasync.parallel([\n  function(callback) { setTimeout(callback,\
    \ 100); },\n  function(callback) { setTimeout(callback, 300); },\n  function(callback)\
    \ { setTimeout(callback, 200); }\n], function(err, results) {\n  console.log('Completed\
    \ in ' + (new Date - start) + 'ms');\n});\n```\n\nasync.series 需要所有 timeout 的总和才能完成（约\
    \ 600 毫秒），而 async.parallel 只需要最大的 timeout（约 300 毫秒）。\n\n方便的是，Async.js 将结果按任务数组的顺序传递给完成处理程序，而不是按结果生成的顺序。因此，你可以获得并行的性能优势，而不必担心不可预测性。\n\
    \n与集合方法一起，async.series、async.waterfall 和 async.parallel 是 Async.js 的核心：简单、省时的实用函数，适用于最常见的异步场景。\n\
    \n+ - 任务数组是静态的。一旦调用了 async.series 或 async.parallel，就无法添加或删除任务。\n- 也无法询问\"已经完成了多少任务？\"\
    这是一个黑盒，除非你自己从任务中分发更新。\n- 你只能选择无并发或无限并发。这在文件 I/O 方面是一个相当大的问题。如果我们要处理数千个文件，我们不想通过串行来降低效率，但如果尝试并行处理所有内容，很可能会让操作系统不堪重负。\n\
    \nAsync.js 提供了一个多功能的方法来解决所有这些问题：async.queue。\n\n### 理解队列\n\nasync.queue 的基本概念让人联想到\
    \ DMV（车管所）；它可以同时处理多个人（最多取决于值班职员的数量），但它不是为每个职员设立单独的队列，而是有一个单一的叫号堆栈。当你到达时，你会得到一个号码。每当一个职员空闲时，该职员就会叫下一个号码。\n\
    \nasync.queue 的接口比 async.series 和 async.parallel 稍微复杂一些。它接受一个称为 worker 的函数（而不是函数数组）和一个并发值（worker\
    \ 可以同时处理的最大任务数）。然后它返回一个队列，我们可以将任意任务数据推入其中（连同可选的回调）。\n\n下面是一个简单的例子：\n\n```js\n\
    // Asyncjs/simpleQueue.js\nvar async = require('async');\n\nfunction worker(data,\
    \ callback) {\n  console.log(data);\n  callback();\n}\nvar concurrency = 2;\n\
    var queue = async.queue(worker, concurrency);\nqueue.push(1);\nqueue.push(2);\n\
    queue.push(3);\n```\n\n无论并发数是多少（只要至少为 1），我们都会得到以下输出：\n\n```\n1\n2\n3\n```\n\n\
