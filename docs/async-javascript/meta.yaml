    \n\nAsyncjs的收藏方法解决了将单个异步函数应用到一组数据的问题然而如果是一组函数而非数据集我们要如何使用呢？在本章节中我们将探索 Async.js用于分发异步函数和收集其结果的强大工具之一..\n\
