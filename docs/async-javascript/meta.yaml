  md: "# 4.2 Async Collection Methods\n\nbecause there's no guarantee that the readFile\
    \ callbacks would fire in the order that the readFile calls were made in. readFile\
    \ just tells the OS to *start* reading a file. Most likely, shorter files will\
    \ be read more quickly than longer files. As a result, the order in which the\
    \ recipes are added to concatenation would be unpredictable. Plus, we'd have to\
    \ make our console.log line somehow run after all the callbacks have fired.\n\n\
    To use multiple async tasks and get a predictable result, we'll need to do some\
    \ planning.\n\nLet's try to solve this problem without bringing in any utility\
    \ functions. The simplest approach that I can think of is to run each readFile\
    \ from the callback of the previous one, while keeping track of the number of\
    \ callbacks that have fired so far in order to eventually show the output. Here's\
    \ my implementation:\n\n```\nfs.readFile(filename, 'utf8', function(err, contents)\
    \ {\n  if (err) throw err;\n  concatenation += contents;\n});\n```\n\n```\nAsyncjs/seriesByHand.js\n\
    var fs = require('fs');\nprocess.chdir('recipes'); // change the working directory\n\
    var concatenation = '';\n\nfs.readdir('.', function(err, filenames) {\n  if (err)\
    \ throw err;\n\n  function readFileAt(i) {\n    var filename = filenames[i];\n\
    \    fs.stat(filename, function(err, stats) {\n      if (err) throw err;\n   \
    \   if (! stats.isFile()) return readFileAt(i + 1);\n\n      fs.readFile(filename,\
    \ 'utf8', function(err, text) {\n        if (err) throw err;\n        concatenation\
    \ += text;\n        if (i + 1 === filenames.length) {\n          // all files\
    \ read, display the output\n          return console.log(concatenation);\n   \
    \     }\n        readFileAt(i + 1);\n      });\n    });\n  }\n  readFileAt(0);\n\
    });\n```"
