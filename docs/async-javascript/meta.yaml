  md: 'Before we continue, here are a few important things to note:


    +   - The techniques in this chapter are not compatible with scripts that are
    inlined (defined directly in your page''s markup). Inlining should be avoided
    when possible. If you must inline a script, don''t try to use the defer or async
    attribute on it.

    - When using any of the techniques in this chapter, you should not use document.write.
    Its behavior in asynchronously loaded scripts is unpredictable. If you don''t
    know what document.write is, then good. Suffice to say it''s the GOTO of DOM manipulation.

    - This is not a definitive guide. I''ve neglected some important platform-specific
    details for the sake of brevity. For example, certain mobile browsers will refuse
    to cache scripts larger than a certain size. So, if you''re targeting those devices,
    it''s important to keep scripts small.


    Page load optimization is a rich subject on which whole books have been written,
    and script loading is just one factor. But for script-heavy sites that aren''t
    taking advantage of async loading, there''s plenty of low-hanging fruit to be
    picked using the techniques in this chapter.


    # ## 6.2 Reintroducing the <script> Tag


    At the risk of sounding hyperbolic, <script> is the most important HTML tag of
    all time. Don''t believe me? Consider that a page consisting entirely of a single
    script tag can do anything. It can spin itself a document from whole cloth, loading
    whatever resources it wants. By contrast, even the most marvelous page without
    a <script> tag is sharply limited, unable to respond to the user''s actions with
    anything more complicated than a CSS transition.


    In modern browsers, <script> comes in two refreshing flavors: classic and nonblocking.
    In this section, we''ll see how you can use both varieties to make your pages
    load as quickly as possible.


    # ### Where the Blocking Scripts Go


    A standard-issue <script> tag is commonly said to be blocking. That term has to
    be understood in context: when a modern browser sees a blocking <script> tag,
    it will continue to read the document past that point and download other resources
    (scripts and style sheets). However, it won''t evaluate those resources until
    the script has been fully downloaded and run.'
