    \ high-entropy binary digits.  \nBook version: P1.0—November 2012  \n\n---\n\n\
    *Dedicated to Steve Jobs and to the generation of entrepreneurs he inspired.*\n\
    \n# Contents\n+ **Acknowledgments** ...................... ix  \n+ [Introduction](#)\
    \ ......................... xii  \n\n## 1. **[Understanding JavaScript Events](#)**\
