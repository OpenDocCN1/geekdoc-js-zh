- img_proc: true
  md: "Notice that in scenarios 2 and 3, we're waiting for a task to be completed\
    \ in two different ways. I wrote the example this way to illustrate common approaches\
    \ when we're waiting for something to change, like the value of the cached computation.\
    \ Should we prefer one approach over the other? Let's look at that next.\n\n#\
    \ Async Recursion vs. Callback Storage\n\nIn runCalculation, we waited for the\
    \ worker to finish its job by either repeating the same function call from a timeout\
    \ (async recursion) or simply storing a callback.\n\nWhich approach is best? At\
    \ first glance, it might seem easiest to use only async recursion, eliminating\
    \ the need for the calculationCallbacks object. Newcomers to JavaScript often\
    \ use setTimeout for this purpose because it resembles a common idiom of thread-based\
    \ languages. A Java version of this program would probably have a loop like this:\n\
    \n```\nwhile (!calculationCache.get(formula)) {\n  Thread.sleep(0);\n};\n```\n\
    \nBut timeouts aren't free. In large numbers, they can create a significant computational\
    \ load. The scary thing about async recursion is that there's no limit to the\
    \ number of timeouts that could be firing while we wait for the job to finish.\
    \ Plus, it makes our application's event structure unnecessarily complicated.\
    \ For these reasons, async recursion should be regarded as an anti-pattern.\n\n\
    We can avoid async recursion in our calculator by storing an array of callbacks\
    \ for each formula.\n\n```\nvar calculationCache = {},\n    calculationCallbacks\
    \ = {},\n    mathWorker = new Worker('calculator.js');\nmathWorker.addEventListener('message',\
    \ function(e) {\n  var message = e.data;\n  calculationCache[message.formula]\
    \ = message.result;\n  calculationCallbacks[message.formula]\n  .forEach(function(callback)\
    \ {\n    callback(message.result);\n  });\n});\n\nfunction runCalculation(formula,\
    \ callback) {\n  if (formula in calculationCache) {\n    return callback(calculationCache[formula]);\n\
    \  };\n```"
