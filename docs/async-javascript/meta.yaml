    \ = function(err) {\n  return true;  // ignore all errors completely\n};\n```\n\
    \nIn production, you might want to consider a JavaScript error-handling service,\
    \ such as Errorception.⁷ Errorception provides a ready-made `window.onerror` handler\
    \ that reports all uncaught exceptions to their server, which can then send you\
    \ notifications.\n\n# In Node.js\n\nNode’s analog to `window.onerror` is the `process`\
    \ object’s `uncaughtException` event. Normally, a Node app will exit immediately\
    \ on an uncaught exception. But as long as at least one `uncaughtException` handler\
    \ exists, the app will simply return to the event queue.\n\n```\nprocess.on('uncaughtException',\
    \ function(err) {\n  console.error(err); // shutdown averted!\n});\n```\n\nHowever,\
    \ as of Node 0.8.4, `uncaughtException` is deprecated. According to the docs,⁸\n\
    \n> uncaughtException is a very crude mechanism for exception handling and may\
    \ be removed in the future...\n\nDon’t use it, use domains instead.\n\nWhat are\
    \ domains? you ask. Domains are evented objects that convert throws into 'error'\
    \ events. (We’ll talk more about evented objects in [Chapter 2, Distributing Events,\
    \ on page 19](#).) Here’s an example:\n\n```\nEventModel/domainThrow.js\nvar myDomain\
    \ = require('domain').create();\nmyDomain.run(function() {\n  setTimeout(function()\
    \ {\n    throw new Error('Listen to me!');\n  }, 50);\n});\n\nmyDomain.on('error',\
    \ function(err) {\n  console.log('Error ignored!');\n});\n```\n\n7. [http://errorception.com/](http://errorception.com/)\n\
    8. [http://nodejs.org/docs/latest/api/process.html#process_event_uncaughtexception](http://nodejs.org/docs/latest/api/process.html#process_event_uncaughtexception)"
  - "[PAGE 31]\n\nThe throw from the timeout event simply triggers the domain’s error\
    \ handler.\n< Error ignored!\nMagical, isn’t it? Domains make throw much more\
    \ palatable. Unfortunately, they’re available only in Node 0.8+, and as of this\
    \ writing, they’re still considered an experimental feature. For more information,\
    \ see the Node docs.⁹\nWhether you’re in the browser or on the server, global\
    \ exception handlers should be seen as a measure of last resort. Use them only\
    \ for debugging.\n\n# To Throw or Not to Throw?\n\nWhen you’re given an error,\
    \ the easiest thing to do with it is to throw it. In Node code, you’ll often see\
    \ callbacks that look like this:\n\n```\nfunction(err) {\n    if (err) throw err;\n\
    \    // ...\n}\n```\n\nWe’ll use this idiom frequently in [Chapter 4, Flow Control\
    \ with Async.js, on page 47](http://nodejs.org). But in a production app, allowing\
    \ routine exceptions and fatal errors alike to bubble up to the global handler\
    \ is unacceptable. throw in a callback is a JavaScripter’s way of saying, “I don’t\
    \ want to think about this right now.”\n\nWhat about throwing exceptions that\
    \ you know will be caught? That’s an equally thorny area. In 2011, Isaac Schlueter\
    \ (creator of npm and current head of Node development) argued that try/catch\
    \ is an anti-pattern.¹⁰\n\n> Try/catch is goto wrapped in pretty braces. There’s\
    \ no way to continue where you left off, once the error is handled. What’s worse,\
    \ in the code that throws, you have no idea where you’re jumping to. When you\
    \ return an error code, you are fulfilling a contract. When you throw, you’re\
    \ saying, “I know I was talking to you, but I’m going to jump over you now and\
    \ talk to your boss instead.” It’s rude. If it’s not an emergency, don’t do that;\
    \ if it is an emergency, then we should crash.\n\nSchlueter advocated using throws\
    \ purely as assert-like constructs, a way of bringing applications to a halt when\
    \ they’re doing something completely unexpected. The Node community has largely\
    \ followed this recommendation, though that may change with the emergence of domains.\n\
    \nSo, what’s the current best practice for handling async errors? I suggest heeding\
    \ Schlueter’s advice: if you want your whole application to stop, go ahead and\
    \ use throw. Otherwise, give some thought as to how the error should"
  - "[PAGE 32]\n\nbe handled. Do you want to show the user an error message? Retry\
    \ the request? Sing “Daisy Bell”? Then handle it like that, as close to the source\
    \ as possible.\n\n# 1.5 Un-nesting Callbacks\n\nThe most common anti-pattern in\
    \ JavaScript is nesting callbacks within callbacks. Remember the Pyramid of Doom\
    \ from the introduction? Let’s look at a concrete example that you might see in\
    \ a Node server.\n\n```\nfunction checkPassword(username, passwordGuess, callback)\
    \ {\n  var queryStr = 'SELECT * FROM user WHERE username = ?';\n  db.query(selectUser,\
    \ username, function (err, result) {\n    if (err) throw err;\n    hash(passwordGuess,\
    \ function(passwordGuessHash) {\n      callback(passwordGuessHash === result['password_hash']);\n\
    \    });\n  });\n}\n```\n\nHere we’ve defined an async function (checkPassword),\
    \ which fires another async function (db.query), which potentially fires another\
    \ async function (hash). (It’s impossible to know for certain whether these functions\
    \ are async without actually reading their code, but it’s reasonable to assume\
    \ so here.)\n\nWhat’s the problem with this code? Right now, nothing. It works,\
    \ and it’s succinct. But it’s going to get awfully hairy when we try to add new\
    \ features to it, like handling that database error instead of throwing it (see\
    \ *To Throw or Not to Throw?*, on page 16), logging access attempts, throttling,\
    \ and so on.\n\nNested callbacks tempt us to add more features by adding more\
    \ code, rather than implementing those features in manageable, reusable pieces.\
    \ This equivalent implementation of checkPassword avoids that temptation:\n\n\
    ```\nfunction checkPassword(username, passwordGuess, callback) {\n  var passwordHash;\n\
    \  var queryStr = 'SELECT * FROM user WHERE username = ?';\n  db.query(selectUser,\
    \ username, queryCallback);\n\n  function queryCallback(err, result) {\n    if\
    \ (err) throw err;\n    passwordHash = result['password_hash'];\n    hash(passwordGuess,\
    \ hashCallback);\n  }\n\n  function hashCallback(passwordGuessHash) {\n    callback(passwordHash\
    \ === passwordGuessHash);\n  }\n}\n```"
  - '[PAGE 33]


    This approach is more verbose, but it reads more clearly and is much easier to
    extend. Because we''ve given the async result (passwordHash) broader scope, we
    have more flexibility.


    As a rule, avoid more than two levels of function nesting. The key is to figure
    out a way of storing async results outside of the function making the async call
    so that the callback doesn''t have to be nested.


    If all of this sounds tricky, don''t worry. We''ll see plenty of examples in later
    chapters of async events running in sequence without nested handlers.


    # 1.6 What We''ve Learned


    In this chapter, we''ve seen how JavaScript''s single-threadedness is both a blessing
    and a curse. In the right hands, it makes for beautiful code free of the terrifying
    race conditions that plague multithreaded apps. But you need to develop the right
    mind-set—and the right techniques.


    The rest of this book is concerned with libraries and design patterns for working
    with events in JavaScript. All of the examples we''ll look at will run in either
    mainstream browsers or unmodified Node.js. However, writing JavaScript isn''t
    the only way to produce JavaScript code. For an overview of some interesting alternatives,
    see **Appendix 1, Tools for Taming JavaScript**, on **page 81**.


    It bears mention here that there is one kind of multithreading in JavaScript:
    you can spawn worker processes. Each spawned process can exchange data with other
    processes under the same limitations as any other I/O. Workers make it possible
    to utilize multiple cores, without breaking the rules of JavaScript (code can''t
    be interrupted; variables are accessible only within their scope). For more on
    workers, skip ahead to  **Chapter 5, Multithreading with Workers**,  on **page
    61**.


    The next two chapters are devoted to essential design patterns: PubSub, a way
    of organizing callbacks by assigning them to named events; and Promises, an intuitive
    object representation for one-shot events.'
- md: "## CHAPTER 2\n\n## Distributing Events\n\nIn the previous chapter, we looked\
    \ at how async events work in JavaScript. But in practice, how should we handle\
    \ those events?\n\nThat may sound like a silly question. Just attach a handler\
    \ to each event your app cares about, right? But when a single event has several\
    \ consequences, the \"one event, one handler\" approach forces handlers to grow\
    \ to *gargantuan* proportions.\n\nLet's say you're building a web-based word processor\
    \ like Google Docs. Every time a user presses a key, a number of things need to\
    \ happen: the new character has to be displayed on the screen, the caret has to\
    \ be moved, the action has to be pushed to the local undo history and synced to\
    \ the server, spell-check may have to run, and the word count and page count may\
    \ need to be updated. Carrying out all of these tasks and more from a single keypress\
    \ handler is a daunting proposition.\n\nFrom a purely mechanical perspective,\
    \ every task that we want performed in response to the event does indeed have\
    \ to be initiated from its handler. But for the sake of us humans, it's usually\
    \ better to replace that massive event handler with a more malleable, dynamic\
    \ construct—one that we can add tasks to, and remove tasks from, at runtime. In\
    \ short, we want to use *distributed events*, where a single incident can trigger\
    \ reactions throughout our application.\n\nIn this chapter, you'll learn to distribute\
    \ events using the publish/subscribe pattern (aka *PubSub*). Along the way, we'll\
    \ meet several of PubSub's manifestations: Node's EventEmitter, Backbone's evented\
    \ models, and jQuery's custom events. With the help of these tools, we'll be able\
    \ to un-nest callbacks, reduce duplication, and write event-driven code that's\
    \ easy to understand.\n\n### 2.1 PubSub\n\nSince the dawn of JavaScript, browsers\
    \ have allowed event handlers to be attached to DOM elements like so:\n\n```\n\
    link.onclick = clickHandler;\n```\n\nAh, simplicity itself! There's just one caveat:\
    \ if you wanted *two* click handlers for an element, you'd have to aggregate them\
    \ yourself with a wrapper function.\n\n```\nlink.onclick = function() {\n  clickHandler1.apply(this,\
    \ arguments);\n  clickHandler2.apply(this, arguments);\n};\n```\n\nNot only is\
    \ this tedious, it's also a recipe for bloated, all-purpose handler functions.\
    \ That's why the W3C added addEventListener to the DOM specification in 2000 and\
    \ jQuery abstracted it with the bind method. bind makes it easy to add as many\
    \ handlers as you like to any event on any element (or set of elements), without\
    \ worrying about stepping on anyone else's toes.\n\n```\n$(link)\n  .bind('click',\
    \ clickHandler1)\n  .bind('click', clickHandler2);\n```\n\n(In jQuery 1.7+, the\
    \ new on syntax is preferred over bind.[1](http://api.jquery.com/on/) There's\
    \ also the click method, which is a shorthand for bind('click', ...); however,\
    \ I prefer to consistently use bind/on.)\n\nFrom a software architecture perspective,\
    \ jQuery *publishes* the link element's events to anyone who wants to *subscribe*.\
    \ That's why it's called \"PubSub.\"\n\nTheologically speaking, PubSub is a kind\
    \ of democracy. The old-style DOM event API, where binding to event meant writing\
    \ object.onevent = ..., is now largely forgotten in favor of PubSub. The architects\
    \ of Node's API liked PubSub so much that they decided to include a generic PubSub\
    \ entity called EventEmitter that other objects can inherit from. Just about every\
    \ source of I/O in Node is an EventEmitter: file streams, HTTP servers, and even\
    \ the application process itself. To wit:\n\n```\n['room', 'moon', 'cow jumping\
    \ over the moon']\n.forEach(function(name) {\n  process.on('exit', function()\
    \ {\n    console.log('Goodnight, ' + name);\n  });\n});\n```\n\nCountless stand-alone\
    \ PubSub libraries exist for the browser. In addition, many MVC frameworks like\
    \ Backbone.js and Spine provide their own EventEmitter-like modules. We'll talk\
    \ more about Backbone later in this chapter.\n\n## EventEmitter\n\nLet's use Node's\
    \ EventEmitter as an example of a PubSub interface. It has a simple, nearly minimal\
    \ design.\n\nTo add an event handler to an EventEmitter, just call on with the\
    \ event type and the handler.\n\n```\nemitter.on('evacuate', function(message)\
    \ {\n  console.log(message);\n});\n```\n\nThe emit method will call all handlers\
    \ for the given event type. For instance, the following\n\n```\nemitter.emit('evacuate');\n\
    ```\n\nwould call all evacuate handlers.\n\nNote that the term *event* here has\
    \ nothing to do with the event queue. See [Synchronicity, on page 22](#).\n\n\
    You can add any number of additional arguments when you emit an event. All arguments\
    \ are passed to all handlers.\n\n```\nemitter.emit('evacuate', 'Woman and children\
    \ first!');\n```\n\nThere are no restrictions on event names, though the Node\
    \ docs offer a useful convention.\n\nTypically, event names are represented by\
    \ a camel-cased string.^[2](http://nodejs.org/docs/latest/api/events.html)^\n\n\
    All of EventEmitter's methods are public, but it's common convention for events\
    \ to be emitted only from \"inside\" the EventEmitter. That is, if you have an\
    \ object that inherits the EventEmitter prototype and uses this.emit to broadcast\
    \ events, its emit method shouldn't be called elsewhere.\n\n## Roll Your Own PubSub\n\
    \nPubSub implementations are so simple that we can create one in about a dozen\
    \ lines of code. The only state we need to store is a list of handlers for each\
    \ event type we support.\n\n```\nPubSub = {handlers: {}}\n```\n\n2. http://nodejs.org/docs/latest/api/events.html\n\
    \nWhen we add a listener, we push it to the end of the array (which means that\
    \ listeners will always be called in the order in which they were added).\n\n\
    ```\nPubSub.on = function(eventType, handler) {\n  if (!(eventType in this.handlers))\
    \ {\n    this.handlers[eventType] = [];\n  }\n\n  this.handlers[eventType].push(handler);\n\
    \  return this;\n}\n```\n\nThen when an event is emitted, we loop through all\
    \ of our handlers.\n\n```\nPubSub.emit = function(eventType) {\n  var handlerArgs\
    \ = Array.prototype.slice.call(arguments, 1);\n  for (var i = 0; i < this.handlers[eventType].length;\
    \ i++) {\n    this.handlers[eventType][i].apply(this, handlerArgs);\n  }\n  return\
    \ this;\n}\n```\n\nThat's it. We've just implemented the core of Node's EventEmitter.\
    \ (The only major things we're missing are the ability to remove handlers and\
    \ to attach one-time handlers.)\n\nOf course, PubSub implementations vary slightly\
    \ feature-wise. When the jQuery team noticed that several different PubSub implementations\
    \ were being used throughout the library, they decided to abstract them with $.Callbacks\
    \ in jQuery 1.7.³ Instead of using an array to store the handlers corresponding\
    \ to an event type, you could use a $.Callbacks instance.\n\nMany PubSub implementations\
    \ parse the event string to provide special features. For example, you may be\
    \ familiar with namespaced events in jQuery: if I bind events named \"click.tbb\"\
    \ and \"hover.tbb\", I can unbind them both by simply calling unbind(\".tbb\"\
    ). Backbone.js lets you bind handlers to the \"all\" event type, causing them\
    \ to go off whenever anything happens. Both jQuery and Backbone let you bind or\
    \ emit multiple event types simultaneously by separating them with spaces, e.g.,\
    \ \"keypress mousemove\".\n\n## Synchronicity\n\nAlthough PubSub is an important\
    \ technique for dealing with async events, there's nothing inherently async about\
    \ it. Consider this code:\n\n```\n$('input[type=submit]')\n.on('click', function()\
    \ { console.log('foo'); })\n.trigger('click');\nconsole.log('bar');\n```\n\nThe\
    \ output is\n\n```\nfoo\nbar\n```\n\nproving that the click handler was invoked\
    \ immediately by trigger. In fact, whenever a jQuery event fires, all of its handlers\
    \ will be executed sequentially without interruption.\n\nSo, let's be clear: when\
    \ the user clicks the Submit button, that's an async event. The first click handler\
    \ fires from the event queue. But the event handler has no way of knowing whether\
    \ it's being run from the event queue or from your application code.\n\nIf too\
    \ many handlers fire in sequence, you risk blocking the thread and making the\
    \ browser unresponsive. Worse, if events are emitted from event handlers, they\
    \ can easily create an infinite cycle.\n\n```\n$('input[type=submit]')\n.on('click',\
    \ function() {\n  $(this).trigger('click');  // stack overflow!\n});\n```\n\n\
    Think back to the word processor example at the start of this chapter. When a\
    \ user presses a key, many things need to happen, and several of them require\
    \ complex calculations. Doing them all before returning to the event queue would\
    \ be a recipe for an unresponsive app.\n\nA good solution to this problem is to\
    \ maintain a queue of things that don't need to happen right away and use a timed\
    \ function to run the next task in the queue periodically. A first attempt might\
    \ look something like this:\n\n```\nvar tasks = [];\nsetInterval(function() {\n\
    \  var nextTask;\n  if (nextTask = tasks.shift()) {\n    nextTask();\n  };\n},\
    \ 0);\n```\n\n(We'll learn about a more sophisticated approach to job queuing\
    \ in **Section 4.4, *Dynamic Async Queuing***, on page 54.)"
  mdcn: "\n## 第二章\n\n## 事件分发\n\n在上一章中，我们探讨了 JavaScript 中异步事件的运作方式。但在实践中，我们应该如何处理这些事件呢？\n\
    \n这听起来可能是一个愚蠢的问题：只需将处理程序附加到你应用程序关心的每个事件上就行了吧？但当单个事件产生多个后果时，“一个事件对应一个处理程序”的方法会迫使处理程序的规模增长至*巨大无比**。\n\
    \n假设你正在构建类似 Google Docs 的基于 Web 的文字处理器。每当用户按下一次按键，就会发生多种事情：新字符必须在屏幕上显示、插入点必须移动、该操作必须被推送到本地撤销历史并同步到服务器、拼写检查可能需要运行，以及单词计数和页数可能需要更新。仅从一个按键处理程序中执行所有这些任务以及其他任务是令人望而却步的。\n\
    \n从纯粹的机械角度来看，我们希望在响应事件时执行的每项任务确实都需要从其处理程序发起启动。但对于人类而言，用更灵活、动态的结构替换那个庞大的事件处理程序通常要好得多——这是一个可以在运行时向其添加或移除任务的构造体。简而言之，我们要使用*分布式事件**（distributed\
    \ events）的概念，其中单个事件可以触发应用程序中的各种反应。\n\n在本章中，你将学习如何使用 Publish/Subscribe 模式（也称为 *PubSub*\
    \ **来分发事件**。在此过程中，我们将接触到 PubSub 的几种表现形式：Node.js 的事件发射器、Backbone 的可事件化模型以及 jQuery\
    \ 的自定义事件。借助这些工具，我们将从回调函数中提取嵌套层数、减少重复代码，并编写易于理解的事件驱动代码。\n\n### 2.1 PubSub\n\n自从\
    \ JavaScript诞生之日起，浏览器就一直允许将事件处理程序类似这样附加到DOM元素上：\n\n```\nlink.onclick = clickHandler;\
    \  \n```  \n\nAh（啊），简单至极！这里只有一个细微差别：如果你想要为某个元素提供*两个**点击事件处理程序，你就必须自己使用包装函数将它们聚合。\n\
    \n```         \nlink.onclick = function() {   \n  clickHandler1.apply(this, arguments);\
    \   \n  clickHandler2.apply(this, arguments);  \n}; \n```  \n\n这不仅繁琐，还是导致臃肿、万金油式（all-purpose）处理函数的配方之源。这就是\
    \ W3C于2000年将addElementEventListener添加到DOM规范以及jQuery通过bind方法对其进行抽象的原因。bind使得你可以为任何元素（或任意一组元素的）上的任何事件轻松添加尽可能多的监听器，而无需担心踩到其他人的尾巴[1](http://api.jquery.com/on/)。\n\
    \n```        \n$(link)   \n  .bind('click', clickHandler1)  \n  .bind('click',\
    \ clickHandler2);         \n```  \n\n(在 jQuery 1.7+ 版本中，更倾向于使用新的 on 语法[1](http://api.jquery.com/on/)[^1]。还有一个\
    \ click 方法，它是 bind('click', ...; )的快捷方式；不过，我更倾向于始终一致地使用bind或on。)\n\n从软件架构的角度来看，jQuery*发布**（publish）了link元素的任何想要订阅其事件的人都会接收到的事件。这就是它为什么被称为\"\
    PubSub[2](http://nodejs.org/docs/latest/api/events.html)[^2]\"的原因。\n\n就神学而言，PubSub是一种民主制。旧式的DOM事件API中绑定到对象意味着书写\
    \ object.onevent=...等代码现在在某种程度上已被人们所遗忘（转而使用 PubSub）。Node.js API 的设计者非常喜欢PubSub，以至于他们决定包含一个通用的名为\
    \ EventEmitter的实体供其他对象继承。可以说，Node.js中的几乎每一项I/O来源都是一个EventEmmitter：文件流、HTTP服务器甚至是应用程序进程本身都可以作为示例[3](http://nodejs.org/docs/latest/api/events.html)[^2]\
    \ \n\n```        \n['room', 'moon', 'cow jumping over the moon']  \n.forEach(function(name)\
    \ {   \n  process.on('exit'. function()    \n    console.log('Goodnight, ` + name);\
    \      \n});     \n]);         \n```  \n\n对于浏览器存在无数独立的 PubSub库[4](http://nodejs.org/docs/latest/api/events.html).\
    \ [^2]。此外，许多 MVC框架如 Backbone.js和Spine也提供了自己的类似事件发射器的模块。我们将在本章后面更深入地讨论Backbone的内容\n\
    \n## 自行实现 EventEmitter\n\n让我们使用Node.js的EventEmitter作为PubSub接口的示例，其设计简单而紧凑：[4](http://nodejs.org/docs/latest/api/events.html)\
    \ [^2] \n\n要将处理程序附加到事件发射器上，只需调用on并传入事件类型和处理程序即可。  \n\n```         \nemitter.on('evacuate',\
    \ function(message) {     \n  console.log(message);  \n});         \n```\n\nemit方法将调用给定的所有指定类型的的处理函数。例如以下代码：\
    \   \n       \n`\nemitter.emit(\"vacature\"); \n ` \n\n会启动所有的 evacuation处理器[5](http://nodejs.org/docs/latest/api/events.html).\
    \ [^2]  \n\n请注意，此处使用的术语*事件**（event）与事件队列没有任何关系。请参见第 **22 页的[Synchronicity, on\
    \ page 22](#) ^。\n\n当你触发一个事件时，你可以添加任意数量的附加论据变量[6](http://nodejs.org/docs/latest/api/events.html)[^2]\
    \ 。所有这些参数都会传递给所有处理器函数：   \n\n`\nemitter.emit('evacuate', 'Woman and children first!');\
    \ \n ` \n\n对事件名称没有限制，尽管 Node.js文档建议了一些有用的约定^[7](http://nodejs.org/docs/latest/api/events.html)^。\
    \  \n\n通常，事件名由大驼峰命名的字符串表示^{8}(http://nodejs.org/docs/14. api/events.html) ^[]\
    \  。EventEmitter的所有方法都是公开的，但以在 Event Emitter“内部”仅发射事件的惯例是常见的做法[9](http://nodejs.org/docs/latest/api/events.html)[^2]。即如果你的对象继承了\
    \ EventEmitter原型并使用this.emit来广播事件，那么其emit 不应在其他地方被调用：[] 。\n\n## Roll Your Own\
    \ PubSub  \n\nPubSub实现非常简洁，我们可以用大约十二行代码就创建一个[7](http://nodejs.org/docs/latest/api/events.html).\
