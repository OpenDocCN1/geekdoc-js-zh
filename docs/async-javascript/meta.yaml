    # Introduction


    Originally devised to enhance web pages in Netscape 2.0, JavaScript is now faced
    with being a single-threaded language in a multimedia, multitasking, multicore
    world. Yet JavaScript has not only persevered since 1995, it''s thrived. One after
    the other, potential rivals in the browser—Flash, Silverlight, and Java applets,
    to name a few—have come and (more or less) gone.


    Meanwhile, when a programmer named Ryan Dahl wanted to build a new framework for
    event-driven servers, he searched the far reaches of computer science for a language
    that was both dynamic and single-threaded before realizing that the answer was
    right in front of him. And so, Node.js was born, and JavaScript became a force
    to be reckoned with in the server world.


    How did this happen? As recently as 2001, Paul Graham wrote the following in his
    essay "The Other Road Ahead":[1]


    > I would not even use JavaScript, if I were you... Most of the JavaScript I see
    on the Web isn''t necessary, and much of it breaks.


    Today, Graham is the lead partner at Y Combinator, the investment group behind
    Dropbox, Heroku, and hundreds of other start-ups—nearly all of which use JavaScript.
    As he put it in a revised version of the essay, "JavaScript now works."


    When did JavaScript become a respectable language? Some say the turning point
    was Gmail (2004), which showed the world that with a heavy dose of Ajax you could
    run a first-class email client in the browser. Others say that it was jQuery (2006),
    which abstracted the rival browser APIs of the time to create a *de facto* standard.
    (As of 2011, 48 percent of the top 17,000 websites use jQuery.[2])


    [1] A revised version of this essay can be found at [http://paulgraham.com/road.html](http://paulgraham.com/road.html).
    The original footnote can be found in the book *Hackers & Painters*.


    [2] [http://appendto.com/jquery-overtakes-flash](http://appendto.com/jquery-overtakes-flash)'
- md: "Whatever the reason, JavaScript is here to stay. Apple got behind JavaScript\
    \ with WebKit and Safari. Microsoft is getting behind JavaScript with Metro. Even\
    \ Adobe is getting behind JavaScript with tools to generate HTML5 instead of Flash.\
    \ What began as a humble browser feature has become arguably the most important\
    \ programming language in the world.\n\nThanks to the ubiquity of web browsers,\
    \ JavaScript has come closer than any other language to fulfilling Java's old\
    \ promise of “write once, run anywhere.” In 2007, Jeff Atwood coined *Atwood's\
    \ law*:\n\n> Any application that can be written in JavaScript will eventually\
    \ be written in JavaScript.³\n\n## Trouble in Paradise\n\nJavaScript was conceived\
    \ to be a single-threaded language where asynchronous tasks are handled with events.\
    \ When there are only a few potential events, event-based code is much simpler\
    \ than multithreaded code. It's conceptually elegant, and it eliminates the need\
    \ to wrap up data in mutexes and semaphores to make it thread-safe. But when a\
    \ number of events are expected, with state that needs to be carried from one\
    \ event to the next, that simplicity often gives way to a code structure so terrifying\
    \ that it's been dubbed the *Pyramid of Doom*.\n\n```\nstep1(function(result1)\
    \ {\n  step2(function(result2) {\n    step3(function(result3) {\n      // and\
    \ so on...\n    });\n  });\n});\n```\n\n“I love async, but I can't code like this,”\
    \ one developer famously complained on the Node.js Google Group.⁴ But the problem\
    \ isn't with the language itself; it's with the way programmers use the language.\
    \ Dealing with complex sets of events in an elegant way is still frontier territory\
    \ in JavaScript.\n\nSo, let's push the frontier forward! Let's prove to the world\
    \ that even the most complex problems can be tackled with clean, maintainable\
    \ JavaScript code.\n\n³ http://www.codinghorror.com/blog/2007/07/the-principle-of-least-power.html\n\
    ⁴ https://groups.google.com/forum/#!topic/nodejs/wzSUdkPICWg\n\n## Who Is This\
    \ Book For?\n\nThis book is aimed at intermediate JavaScripters. You should know\
    \ how variables are scoped. Keywords like `typeof`, `arguments`, and `this` shouldn't\
    \ faze you. Perhaps most importantly, you should understand that\n\n```\nfunc(function(arg)\
    \ { return next(arg); });\n```\n\nis just a needlessly verbose way of writing\n\
    \n```\nfunc(next);\n```\n\nexcept in rare cases. (See Reg Braithwaite's excellent\
    \ article \"Captain Obvious on JavaScript\" for more examples of small but important\
    \ functional idioms.)\n\nWhat you *don't* need to know is how asynchronous events\
    \ are scheduled in JavaScript. We'll cover that in the next chapter.\n\n## Resources\
    \ for Learning JavaScript\n\nAs JavaScript has become the *lingua franca* of the\
    \ Web (not to mention mobile devices), a vast number of informative books, courses,\
    \ and sites devoted to it have appeared. Here are a few that I recommend:\n\n\
    - If you're new to programming altogether, check out the interactive tutorial\
    \ site Codecademy.\n- If you're coming from another language and want to get up\
    \ and running with JavaScript as a language for scripting the browser, take the\
    \ interactive jQuery Air courses on CodeSchool.\n- If you want a more formal introduction\
    \ to the JavaScript language, absorb Marijn Haverbeke's *Eloquent JavaScript*.\n\
    - If you're a JavaScript beginner who wants to level up and avoid common pitfalls,\
    \ spend some time in the JavaScript Garden.\n\n## Where to Turn for Help?\n\n\
    When pondering questions like \"Should I use `typeof` or `instanceof` here?\"\
    \ steer clear of the dated W3Schools site (which, regrettably, tends to be favored\
    \ by Google searches). Instead, head to the Mozilla Developer Network (MDN).\n\
    \nThe Mozilla Foundation (you may have heard of its browser, Firefox) is headed\
    \ up by Brendan Eich, the creator of JavaScript. The foundation knows its stuff.\n\
    \nIf you can't find your answer among MDN's pages, take your question to Stack\
    \ Overflow.¹¹ The site has fostered an amazingly helpful developer community,\
    \ and it's a safe bet that any coherent question tagged JavaScript will receive\
    \ a punctual response.\n\n## Running the Code Examples\n\nThis book is a bit unusual,\
    \ in that I discuss both client-side (browser) and server-side (Node.js) code.\
    \ That reflects the uniquely portable nature of JavaScript. The central concepts\
    \ apply to all JavaScript environments, but certain examples are aimed at one\
    \ or the other.\n\nEven if you have no interest in writing Node applications,\
    \ I hope you'll follow along by running these code snippets locally. See Running\
    \ Code in Node.js, on page xiv for directions.\n\n## Which Examples Are Runnable?\n\
    \nWhen you see a code snippet with a filename, that means it's self-contained\
    \ and can be run without modification. Here's an example:\n\n```\nPreface/stringConstructor.js\n\
    console.log('str'.constructor.name);\n```\n\nThe surrounding context should make\
    \ it clear whether the code is runnable in the browser, in Node.js, or in both.\n\
    \nWhen a code snippet doesn't have a filename, that means it's not self-contained.\
    \ It may be part of a larger example, or it may be a hypothetical. Here's an example:\n\
    \n```\nvar tenSeconds = 10 * 1e3;\nsetTimeout(launchSatellite, tenSeconds);\n\
    ```\n\nThese examples are meant to be read, not run.\n\n## Running Code in Node.js\n\
    \nNode is very easy to install and use: just head to http://nodejs.org/, click\
    \ Download, and run the Windows or OS X installer (or build from source on *nix).\
    \ You can then run `node` from the command line to open a JavaScript REPL (analogous\
    \ to Ruby's `irb` environment).\n\n```\n$ node\n> Math.pow(5, 6)\n15625\n```\n\
    \nYou can run a JavaScript file by giving its name as an argument to the `node`\
    \ command.\n\n```\n$ echo \"console.log(typeof NaN)\" > foo.js\n$ node foo.js\n\
    number\n```\n\n## Running Code in the Browser\n\nEvery modern browser provides\
    \ a nice little REPL that lets you run JavaScript code in the context of the current\
    \ page. But for playing with multiline code examples, you're better off using\
    \ a web sandbox like jsFiddle.¹²\n\nWith jsFiddle, you can enter JavaScript, HTML,\
    \ and CSS, and then click Run (or press Ctrl+Enter) to see the result. (console\
    \ output will go to your developer console.) You can bring in a framework like\
    \ jQuery by choosing it in the left sidebar. And you can save your work, giving\
    \ you a shareable URL.\n\n## Code Style in This Book\n\nJavaScript has no official\
    \ style guide, but maintaining a consistent style within a project is important.\
    \ For this book, I've adopted the following (very common) conventions:\n\n- Two-space\
    \ indentation\n- camelCase identifiers\n- Semicolons at the end of every expression,\
    \ except function definitions\n\nMore esoterically, I've adopted a special convention\
    \ for indentation in a chain of function calls, based on a proposal by Reg Braithwaite.\
    \ The rule is, essentially, that two function calls in a chain have the same indentation\
    \ level if and only if they return the same object. So, for instance, I might\
    \ write the following:\n\n```\n$('#container > ul li.inactive')\n  .slideUp();\n\
    ```\n\njQuery's `slideUp` method returns the same object that it was called on.\
    \ Thus, it isn't indented. By contrast:\n\n```\nvar $paragraphClone = $('p:last')\n\
    \  .clone();\n```\n\nHere, the `clone` method is indented because it returns a\
    \ different object.\nThe advantage of this convention is that it clarifies what\
    \ each function in a\nchain is returning. Here’s a more complex example:\n\n```\n\
    $('h1')\n    .first()\n    .addClass('first')\n.end()\n    .last()\n    .addClass('last');\n\
    ```\n\njQuery’s `first` and `last` filter a set down to its first and last elements,\
    \ while `end`\nundoes the last filter. So, `end` is unindented because it returns\
    \ the same value\nas `$('h1')`. (`last` is allowed to occupy the same indentation\
    \ level as `first` because\nthe chain was reset.)\n\nThis approach to indentation\
    \ is especially useful when we’re doing functional\nprogramming, as we’ll see\
    \ in Chapter 4, Flow Control with Async.js, on page 47.\n\n```\n[1, 2, 3, 4, 5]\n\
    \    .filter(function(int) { return int % 2 === 1; })\n        .forEach(function(odd)\
    \ { console.log(odd); })\n```\n\n## A Word on altJS\n\nA number of languages compile\
    \ to JavaScript, making code easier to write.\n(You can find a fairly comprehensive\
    \ list at http://altjs.org.) This book isn’t about\nthem. It’s about writing the\
    \ best JavaScript code we can without the use of\na precompiler. I have nothing\
    \ against altJS (see the next section), but I believe\nit’s important to understand\
    \ the underlying language.\n\nSome altJS languages are aimed specifically at “taming”\
    \ async callbacks by\nallowing them to be written in a more synchronous style.\
    \ I’ve included an\noverview of these languages in Appendix 1, Tools for Taming\
    \ JavaScript, on page 81.\n\n## CoffeeScript\n\nIt’s no secret that I ♥ CoffeeScript,\
    \ a beautiful and expressive language that\ncompiles to JavaScript. I use it extensively\
    \ in my day-to-day work at HubSpot.\nI’ve given talks on it at conferences like\
