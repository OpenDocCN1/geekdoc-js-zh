  - '[PAGE 64]


    This is, as you may have noticed, a lot more code than the synchronous version.
    When we used the synchronous filter and forEach methods, this took about half
    as many lines and reads much more clearly! Wouldn’t it be nice if we could just
    drop in async equivalents of those wonderful iteration methods? With Async.js,
    we can do just that!


    # ## When It’s OK to Throw


    You might have noticed that I ignored my own advice from Section 1.4, Handling
    Async Errors, on page 12 in that last code example. Throwing exceptions from callbacks
    is poor form—in a production environment. However, for a simple example like this,
    throwing exceptions is perfectly fine. In the unlikely event that this code goes
    wrong, a throw will shut it down and give us a nice stacktrace explaining why.


    The real crime here is that the same error-handling logic, if (err) throw err,
    is repeated three times! We’ll see how Async.js can help us reduce that repetition
    in Error Handling in Async.js, on page 52.


    # ## Functional Style with Async.js


    We want to replace the filter and forEach methods we used for synchronous iteration
    with async analogs. Async.js gives us two options.


    +   async.filter and async.forEach, which process the given array in parallel


    +   async.filterSeries and async.forEachSeries, which process the given array
    sequentially


    Running our async operations in parallel would be faster, so why would we want
    to use a series method? There are two reasons.


    +   The aforementioned problem of unpredictable ordering. We might get around
    this by storing our results in an array and then joining it, but that’s an extra
    step.


    +   There’s a limit on the number of files that Node (or any application process)
    can try to read simultaneously. If we hit that limit, the OS would give us an
    error. If we read the files sequentially, we don’t have to deal with this limitation.


    So, we’ll stick to async.forEachSeries for now. Here’s a straightforward adaptation
    of our synchronous code to use Async.js’s collection methods:


    ```

    Asyncjs/forEachSeries.js

    var async = require(''async'');

    var fs = require(''fs'');

    process.chdir(''recipes''); // change the working directory

    ```'
