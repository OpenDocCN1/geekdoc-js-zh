    my two favorite programming languages. The other? Its little brother, CoffeeScript.
    The story of how I learned to stop worrying and love JavaScripting is a story
    shared by tens of thousands of programmers. I''d like to thank those who took
    JavaScript seriously from the start, shaping the rich development ecosystem the
    language enjoys today: John Resig, for creating the browser''s *de facto* standard
    library, jQuery; Jeremy Ashkenas, for producing CoffeeScript and the rich yet
    minimalistic Backbone.js framework; Ryan Dahl, for giving the language a robust
    server environment; and all the other programmers who''ve proven through their
    work that JavaScript is a first-class language after all.


    Of course, love alone didn''t write this book. I''d like to thank the Pragmatic
    Bookshelf team for helping me thoroughly renovate my original KickStarted manuscript
