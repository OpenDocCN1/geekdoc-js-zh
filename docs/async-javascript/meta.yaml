  - "[PAGE 57]\n\n```\nvar step1 = $.post('/step1', data1);\nvar step2 = step1.pipe(function()\
    \ {\n  return $.post('/step2', data2);\n});\nvar lastStep = step2.pipe(function()\
    \ {\n  return $.post('/step3', data3);\n});\n```\n\nHere, `lastStep` will resolve\
    \ only if all three Ajax calls succeeded, and it'll be rejected if *any* of the\
    \ three fail. If we care only about the process as a whole, we can omit the variable\
    \ declarations for the earlier steps.\n\n```\nvar posting = $.post('/step1', data1)\n\
    \  .pipe(function() {\n    return $.post('/step2', data2);\n  })\n    .pipe(function()\
    \ {\n      return $.post('/step3', data3);\n    });\n```\n\nWe could, equivalently,\
    \ nest the second pipe inside of the other.\n\n```\nvar posting = $.post('/step1',\
    \ data1)\n  .pipe(function() {\n    return $.post('/step2', data2)\n      .pipe(function()\
    \ {\n        return $.post('/step3', data3);\n      });\n  });\n```\n\nOf course,\
    \ this brings us back to the Pyramid of Doom. You should be aware of this style,\
    \ but as a rule, try to declare your piped Promises individually. The variable\
    \ names may not be necessary, but they make the code far more self-documenting.\n\
    \nThat concludes our tour of jQuery Promises. Now let's take a quick look at the\
    \ major alternative: the CommonJS Promises/A specification and its flagship implementation,\
    \ Q.js.\n\n# 3.7  jQuery vs. Promises/A\n\nIn terms of capabilities, jQuery Promises\
    \ and Promises/A are nearly identical. Q.js, the most popular Promises/A library,\
    \ even offers methods that can work with jQuery Promises. The differences are\
    \ superficial; they use the same words to mean different things.\n\nAs previously\
    \ mentioned in [Section 3.2, Making Promises, on page 33](Section%203.2,%20Making%20Promises,%20on%20page%2033),\
    \ jQuery uses the term `resolve` as the opposite of `fail`, whereas Promises/A\
    \ uses `fulfill`."
