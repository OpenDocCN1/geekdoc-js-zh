    \   {  \n     var handlerArgs= Array.prototype.slice.call(arguments, 1);   \n\
    \     for (var i=O;i< this.handlers[eventTyoelenght];i+){       \n       .this.\
    \ handlers[ eventType]. [i ]. apply(this ,handlerA rgs). ;     \n   }        \
    \         \n    returnthis;  \n        }          \n``` \n\n这就够了。我们刚刚实现了Node.js\
    \ EventEmitter的核心功能。（唯一缺少的主要功能是移除处理器和附加一次性处理程序的功能。）  \n\n当然，PubSub实现因功能而异略有不同[12](http://nodejs.org/docs/latest/api/events.html.\
    \ [^2] .当jQuery团队注意到库中正在使用多种不同的 PubSub 实现在他们决定通过在 jQuery 中的$. Callbacks进行抽象（在\
    \ jQuery 17)[4][3)]。与其用数组来存储对应于特定事件类型的处理程序，你可以使用一个 $.Callbacks实例[5](http://nodejs.org/docs/latest/api/events.html).\
    \ [^2] \n\n许多PubSub实现会解析事件字符串以提供特殊功能。例如你可能熟悉jQuery中的命名空间事件：如果我将名为\"click. tbb”和\
    \ \"hover.tbb 的事件绑定器，那么只需调用 unbind(\".t bb)就可以同时解除这两个绑定时[6](http://nodejs.org/docs/latest/api/events.html).\
    \ [^2] . BackBone.js允许你将处理器与“all事件类型（anything）进行绑定导致它们一旦有任何事情发生就触发。jQuery和Backbone都可以通过间隔多个事件来支持同时绑定或发射多种事件类型的功能，例如键人鼠标移动[7](http://nodejs.org/docs/latest/api/events.html.[^2]\
    \ \n\n## 同步性  \n\n尽管 PubSub是处理异步事件的重要技术之一但它本质上并非异步特性 [8][9)（http://node js. org/docus/late\
