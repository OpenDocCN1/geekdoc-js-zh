    # Restrictions on Web Workers


    Web workers are primarily intended to handle complex computations without compromising
    DOM responsiveness. Potential uses include the following:


    +   - Decoding video as it streams in with the Broadway implementation of the
    H.264 codec³

    - Encrypting communications with the Stanford JavaScript Crypto Library⁴

    - Parsing text in a web-based editor, à la Ace⁵


    In fact, Ace already does this by default. When you type code into an Ace-based
    editor, Ace needs to perform some pretty heavy string analysis before updating
    the DOM with appropriate syntax highlighting. In modern browsers, that analysis
    is done on a separate thread, ensuring that the editor remains smooth and responsive.


    Typically, the worker will send the result of its computations to the master thread,
    which will then update the page. Why not update the page directly? Mainly, to
    keep JavaScript''s async abstractions intact. If a worker could alter the page''s
    markup, we''d end up in the same place as Java, wrapping our DOM manipulation
    code in mutexes and semaphores to avoid race conditions.


    Likewise, a worker can''t see the global window object or any other object in
    the master thread (or in other worker threads). When an object is sent through
    postMessage, it''s transparently serialized and unserialized; think JSON.parse(JSON.stringify(obj)).
    So, changes to the original object won''t affect the copy in the other thread.


    Even the trusty console object isn''t available to workers. All a worker *can*
    see is its own global object, called self, and everything bundled with it: standard
    JavaScript objects like setTimeout and Math, plus the browser''s Ajax methods.


    Ah yes, Ajax! A worker can use XMLHttpRequest freely. It can even use WebSocket
    if the browser supports it. That means the worker can pull data directly from
    the server. And if we''re dealing with a lot of data (like, say, streaming video


    +   2. http://webworkersandbox.com/

    3. https://github.com/nicjohnson145/Broadway

    4. http://crypto.stanford.edu/sjcl/

    5. http://ace.ajax.org/'
