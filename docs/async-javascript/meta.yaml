    \ progress. For example, suppose we want to update an indicator of how far a person\
    \ has gotten toward their daily word goal for National Novel Writing Month (NaNoWriMo).^4\n\
    \n```\nvar nanowrimoing = $.Deferred();\nvar wordGoal = 5000;\nnanowrimoing.progress(function(wordCount)\
    \ {\n    var percentComplete = Math.floor(wordCount / wordGoal * 100);\n    $('#indicator').text(percentComplete\
    \ + '% complete');\n});\nnanowrimoing.done(function(){\n    $('#indicator').text('Good\
    \ job!');\n});\n```\n\nWith the nanowrimoing Deferred available, here's how we\
    \ respond to potential changes in word count:\n\n```\n$('#document').on('keypress',\
    \ function(){\n    var wordCount = $(this).val().split(/\\s+/).length;\n    if\
    \ (wordCount >= wordGoal) {\n        nanowrimoing.resolve();\n    };\n    nanowrimoing.notify(wordCount);\n\
    });\n```\n\nThe notify call on the Deferred invokes our progress callback. Just\
    \ like resolve and reject, notify can take arbitrary arguments. Note that calls\
    \ to nanowrimoing.notify will have no effect once nanowrimoing is resolved, just\
    \ like any additional resolve and reject calls would be ignored.\n\nSo, to recap,\
    \ a Promise takes three kinds of callbacks: done, fail, and progress. done callbacks\
    \ run when the Promise resolves, fail callbacks run when it's rejected, and progress\
    \ callbacks run whenever notify is called on a pending Deferred."
- md: "# 3.5 Combining Promises\n\nThe existence of progress notifications doesn't\
    \ change the fact that, ultimately, every Promise is either resolved or rejected.\
    \ (Or, it remains pending for eternity.) But why? Why not let Promises change\
    \ to any state at any time?\n\nMainly, Promises are designed this way because\
    \ programmers *thrive* on binary. We know exactly how to put 1s and 0s together\
    \ to perform astounding feats of logic. That's a big reason why Promises are so\
    \ powerful; they let us treat tasks as booleans.\n\nThe most common use case for\
    \ logically combining Promises is finding out when a set of async tasks has finished.\
    \ Let's say you're showing a tutorial video while loading a game from the server.\
    \ You want to start the game as soon as two things have happened, in any order.\n\
    \n- The tutorial video has ended.\n- The game is loaded.\n\nGiven a Promise representing\
    \ each of these processes, your task is to start the game when both Promises are\
    \ resolved. How would you do that?\n\nEnter jQuery's *when* method.\n\n```javascript\n\
    var gameReadying = $.when(tutorialPromise, gameLoadedPromise);\ngameReadying.done(startGame);\n\
    ```\n\n*when* acts as a logical AND for Promise resolution. The Promise it generates\
    \ is resolved as soon as all of the given Promises are resolved, or it is rejected\
    \ as soon as any one of the given Promises is rejected.\n\nAn excellent use case\
    \ for *when* is combining multiple Ajax calls. If you need to make two POST calls\
    \ at once and get a notification when both have succeeded, there's no need to\
    \ define a separate callback for each request.\n\n```javascript\n$.when($.post('/1',\
    \ data1), $.post('/2', data2))\n.then(onPosted, onFailure);\n```\n\nOn success,\
    \ *when* can get access to the callback arguments from each of its constituent\
    \ Promises, but doing so is tricky. They're passed as an argument list with the\
    \ same order that the Promises were given to *when*. If a Promise provides multiple\
    \ callback arguments, those arguments are converted to an array.\n\nSo, to get\
    \ all of the callback arguments from all of the Promises given to `$.when`, you\
    \ might write something like this (though I don't recommend it):\n\n```javascript\n\
    $.when(promise1, promise2)\n.done(function(promise1Args, promise2Args) {\n   \
    \ // ...\n});\n```\n\nIn this example, if promise1 resolved with the single argument\
    \ 'complete' and promise2 resolved with the arguments 1, 2, 3, then promise1Args\
    \ would just be the string 'complete', while promise2Args would be the array [1,\
    \ 2, 3].\n\nAlthough it's possible, you shouldn't parse when callback arguments\
    \ if you don't absolutely have to do so. Instead, attach callbacks directly to\
    \ the Promises passed to when to collect their results.\n\n```javascript\nvar\
    \ serverData = {};\nvar getting1 = $.get('/1')\n.done(function(result) {serverData['1']\
    \ = result;});\nvar getting2 = $.get('/2')\n.done(function(result) {serverData['2']\
    \ = result;});\n$.when(getting1, getting2)\n.done(function() {\n    // the GET\
    \ information is now in serverData...\n});\n```\n\n# Using Functions as Promises\n\
    \n`$.when`, and other jQuery methods that take Promises, allow you to pass in\
    \ non-Promises. These are treated like Promises that have resolved with the given\
    \ value in the corresponding argument slot. For instance,\n\n```javascript\n$.when('foo')\n\
    ```\n\nwill give you a Promise that immediately resolves with the value 'foo';\
    \ the following\n\n```javascript\nvar promise = $.Deferred().resolve('manchu');\n\
    $.when('foo', promise)\n```\n\nwill give you a Promise that immediately resolves\
    \ with the values 'foo' and 'manchu'; and the following\n\n```javascript\nvar\
    \ promise = $.Deferred().resolve(1, 2, 3);\n$.when('test', promise)\n```\n\nwill\
    \ give you a Promise that immediately resolves with the values 'test' and [1,\
    \ 2, 3]. (Remember, when a Deferred passes multiple arguments to resolve, those\
    \ arguments are coerced to an array by `$.when`.)\n\nThis raises the following\
    \ question: how does `$.when` know whether an argument is a Promise? It turns\
    \ out that jQuery checks each argument for a method named `promise`; if one exists,\
    \ jQuery uses the value returned by that method. A `Promise.prototype.promise`\
    \ method simply returns itself.\n\nAs you'll recall from Promises in the jQuery\
    \ API, on page 35, jQuery objects also have a `promise` method, which means that\
    \ `$.when` \"coerces\" jQuery objects into their animation Promises. So, if we\
    \ want to create a Promise that will resolve when we've fetched some data and\
    \ the `#loading` animation has completed, all we have to do is write this:\n\n\
    ```javascript\nvar fetching = $.get('/myData')\n$.when(fetching, $('#loading'))\n\
    ```\n\nJust remember that we have to do this after starting the animation. If\
    \ `#loading`'s animation queue is empty, its Promise resolves immediately.\n\n\
    ## ### 3.6 Binding to the Future with pipe\n\nA big reason why performing a series\
    \ of async tasks is often inconvenient in JavaScript is that you can't attach\
    \ handlers to the second task until the first one is complete. As an example,\
    \ let's GET data from one URL and then POST it to another.\n\n```javascript\n\
    var getPromise = $.get('/query')\ngetPromise.done(function(data) {\n    var postPromise\
    \ = $.post('/search', data)\n})\n// Now we'd like to attach handlers to postPromise\n\
    ```\n\nDo you see what the problem is here? We can't bind callbacks to `postPromise`\
    \ until our GET operation is done, because it doesn't exist yet! It's created\
    \ by a `$post` call that we can't make until we have the data that we're getting\
    \ asynchronously from the `$.get` call.\n\nThat's why jQuery 1.6 added the `pipe`\
    \ method to Promises. Essentially, `pipe` says this: \"Give me a callback for\
    \ this Promise, and I'll give you a Promise that represents the result of that\
    \ callback.\"\n\n```javascript\nvar getPrompt = $.get('/query')\nvar postPromise\
    \ = getPromise.pipe(function(data) {\n    return $.post('/search', data)\n})\n\
    ```\n\nLooks like dark magic, right? Here's a breakdown: `pipe` takes one argument\
    \ for each type of callback: `done`, `fail`, and `progress`. So, in this example,\
    \ we just provided a callback that gets run when `getPromise` is resolved. The\
    \ `pipe` method returns a new Promise that's resolved/rejected when the Promise\
    \ returned from our callback is resolved/rejected.\n\nEffectively, `pipe` is a\
    \ window into the future!\n\nYou can also use `pipe` to \"filter\" a Promise by\
    \ modifying callback arguments. If a `pipe` callback returns something other than\
    \ a Promise/Deferred, then that value becomes the callback argument. For instance,\
    \ if you have a Promise that emits progress notifications with a number between\
    \ 0 and 1, you can use `pipe` to create an identical Promise that emits progress\
    \ notifications with a human-readable string instead.\n\n```javascript\nvar promise2\
    \ = promise1.pipe(null, null, function(progress) {\n    return Math.floor(progress\
    \ * 100) + '% complete';\n});\n```\n\nTo summarize, there are two things you can\
    \ do from a `pipe` callback.\n\n- If you return a Promise, the Promise returned\
    \ by `pipe` will mimic it.\n- If you return a non-Promise value (or nothing),\
    \ the Promise returned by `pipe` will immediately be resolved, rejected, or notified\
    \ with that value, according to what just happened to the original Promise.\n\n\
    `pipe`'s rule for whether something is a Promise is the same as `$.when`'s: if\
    \ it has a `promise` method, that method's return value is used as a Promise representing\
    \ the original object. Again, `promise.promise() === promise`.\n\n### Pipe Cascading\n\
    \n`pipe` doesn't require you to provide every possible callback. In fact, you'll\
    \ usually just want to write\n\n```javascript\nvar pipedPromise = originalPromise.pipe(successCallback);\n\
    ```\n\nor the following:\n\n```javascript\nvar pipedPromise = originalPromise.pipe(null,\
    \ failCallback);\n```\n\nWe've seen what happens when the original Promise succeeds\
    \ in the first case, or fails in the second case, so that the piped Promise's\
    \ behavior depends on the return value of `successCallback` or `failCallback`.\
    \ But what about when we haven't given `pipe` a callback for what the original\
    \ Promise does?\n\nIt's simple. The piped Promise mimics the original Promise\
    \ in those cases. We can say that the original Promise's behavior cascades through\
    \ the piped Promise. This cascading is very handy, because it allows us to define\
    \ branching logic for async tasks with minimal effort. Suppose we have a three-step\
    \ process."
  mdcn: "\n# 3.5 组合 Promise\n\n进度通知的存在并不改变这样一个事实：归根结底，每个 Promise 要么被解决（resolved），要么被拒绝（rejected）。（或者，永远保持待定状态。）但为什么呢？为什么不让\
    \ Promise 在任何时候变成任何状态呢？\n\nPromise 被设计成这样，主要是因为程序员在*二元性*上如鱼得水。我们完全知道如何将 1 和 0\
    \ 组合起来，完成令人惊叹的逻辑壮举。这就是 Promise 如此强大的一个重要原因；它们让我们将任务视为布尔值。\n\n逻辑组合 Promise 最常见的用例是确定一组异步任务何时完成。假设你在加载游戏资源的同时播放教程视频。你想在两件事都发生之后立即开始游戏，不论先后顺序。\n\
    \n- 教程视频已结束。\n- 游戏已加载完毕。\n\n假设每项进程都对应一个 Promise，你的任务是在两个 Promise 都被解决时启动游戏。你会怎么做？\n\
    \n这就引出了 jQuery 的 *when* 方法。\n\n```javascript\nvar gameReadying = $.when(tutorialPromise,\
    \ gameLoadedPromise);\ngameReadying.done(startGame);\n```\n\n*when* 相当于 Promise\
    \ 解决的逻辑与（AND）。它生成的 Promise 在所有给定的 Promise 都被解决时解决，或者在任一给定的 Promise 被拒绝时立即拒绝。\n\
    \n*when* 的一个绝佳用例是组合多个 Ajax 调用。如果你需要同时发起两个 POST 请求，并在两者都成功时获得通知，无需为每个请求定义单独的回调。\n\
    \n```javascript\n$.when($.post('/1', data1), $.post('/2', data2))\n.then(onPosted,\
    \ onFailure);\n```\n\n成功时，*when* 可以访问其每个组成 Promise 的回调参数，但这样做比较棘手。它们以参数列表的形式传递，顺序与\
    \ Promise 传给 *when* 的顺序相同。如果一个 Promise 提供多个回调参数，这些参数会被转换为数组。\n\n因此，要获取传给 `$.when`\
    \ 的所有 Promise 的所有回调参数，你可以这样写（但我不推荐这样做）：\n\n```javascript\n$.when(promise1, promise2)\n\
    .done(function(promise1Args, promise2Args) {\n    // ...\n});\n```\n\n在这个例子中，如果\
    \ promise1 以单个参数 'complete' 解决，而 promise2 以参数 1, 2, 3 解决，那么 promise1Args 就是字符串\
    \ 'complete'，而 promise2Args 则是数组 [1, 2, 3]。\n\n虽然这是可行的，但如果你不是绝对必要，就不应该解析 when\
    \ 的回调参数。相反，应将回调直接附加到传给 when 的 Promise 上，以收集它们的结果。\n\n```javascript\nvar serverData\
    \ = {};\nvar getting1 = $.get('/1')\n.done(function(result) {serverData['1'] =\
    \ result;});\nvar getting2 = $.get('/2')\n.done(function(result) {serverData['2']\
    \ = result;});\n$.when(getting1, getting2)\n.done(function() {\n    // GET 的数据现在都在\
    \ serverData 中了……\n});\n```\n\n# 将函数用作 Promise\n\n`$.when` 以及其他接受 Promise 的 jQuery\
    \ 方法，允许你传入非 Promise 值。这些值被视为已在相应参数位置上以给定值解决的 Promise。例如，\n\n```javascript\n$.when('foo')\n\
    ```\n\n会给你一个立即以值 'foo' 解决的 Promise；下面的代码\n\n```javascript\nvar promise = $.Deferred().resolve('manchu');\n\
    $.when('foo', promise)\n```\n\n会给你一个立即以值 'foo' 和 'manchu' 解决的 Promise；而下面的代码\n\
    \n```javascript\nvar promise = $.Deferred().resolve(1, 2, 3);\n$.when('test',\
    \ promise)\n```\n\n会给你一个立即以值 'test' 和 [1, 2, 3] 解决的 Promise。（记住，当 Deferred 向 resolve\
    \ 传递多个参数时，`$.when` 会将这些参数强制转换为数组。）\n\n这就引出了一个问题：`$.when` 如何知道一个参数是否是 Promise？原来，jQuery\
    \ 会检查每个参数是否存在名为 `promise` 的方法；如果存在，jQuery 就使用该方法返回的值。`Promise.prototype.promise`\
    \ 方法只是返回它自身。\n\n正如你在第 35 页\"jQuery API 中的 Promise\"中所记得的，jQuery 对象也有一个 `promise`\
    \ 方法，这意味着 `$.when` 将 jQuery 对象\"强制转换\"为它们的动画 Promise。因此，如果我们想创建一个 Promise，在我们获取到某些数据且\
    \ `#loading` 动画完成时解决，我们只需这样写：\n\n```javascript\nvar fetching = $.get('/myData')\n\
