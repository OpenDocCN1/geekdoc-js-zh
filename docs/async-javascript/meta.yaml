- img_proc: true
  md: "because events can be queued only while code is running; they can't *fire*\
    \ until it's done.\n\nIn the next section, we'll take a closer look at the building\
    \ blocks of async JavaScript.\n\n# 1.2 Types of Async Functions\n\nEach JavaScript\
    \ environment comes with its own set of async functions. Some, like setTimeout\
    \ and setInterval, are ubiquitous. Others are unique to certain browsers or server-side\
    \ frameworks. The async functions provided by the JavaScript environment generally\
    \ fall into two categories: I/O and timing. These are the basic building blocks\
    \ that you'll use to define complex async behaviors in your applications.\n\n\
    # I/O Functions\n\nNode.js wasn't created so that people could run JavaScript\
    \ on the server. It was created because Ryan Dahl wanted an event-driven server\
    \ framework built on a high-level language. JavaScript just happened to be the\
    \ right language for the job. Why? Because the language is a perfect fit for *nonblocking*\
    \ I/O.\n\nIn other languages, it's tempting to \"block\" your application (typically\
    \ by running a loop) until an I/O request completes. In JavaScript, that approach\
    \ isn't even possible. A loop like this will run forever:\n\n```\nvar ajaxRequest\
    \ = new XMLHttpRequest;\najaxRequest.open('GET', url);\najaxRequest.send(null);\n\
    while (ajaxRequest.readyState === XMLHttpRequest.UNSENT) {\n  // readyState can't\
    \ change until the loop returns\n};\n```\n\nInstead, you need to attach a handler\
    \ and return to the event queue.\n\n```\nvar ajaxRequest = new XMLHttpRequest;\n\
    ajaxRequest.open('GET', url);\najaxRequest.send(null);\najaxRequest.onreadystatechange\
    \ = function() {\n  // ...\n};\n```\n\nThat's how it goes. Whether you're waiting\
    \ for a keypress from the user or a batch of data from a remote server, you need\
    \ to define a callback—unless your JavaScript environment gives you a synchronous\
    \ I/O function that does the blocking for you."
  merge: -1
  pgno: 19
