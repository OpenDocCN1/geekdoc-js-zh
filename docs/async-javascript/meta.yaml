  - "[PAGE 39]\n\n# 2.2 Evented Models\n\nWhen an object has a PubSub interface, we\
    \ call it an _evented_ object. A special case is when an object used to store\
    \ data (a _model_) publishes events whenever its contents are modified. Models\
    \ are the _M_ in Model-View-Controller (MVC), which has become one of the hottest\
    \ topics in JavaScript programming in the last few years. The core concept is\
    \ that MVC applications are data-centric so that model events impact the DOM (aka\
    \ the View) and the server (via the Controller).\n\nLet's look at the hugely popular\
    \ Backbone.js framework. You create a new model like so:\n\n```\nstyle = new Backbone.Model({\n\
    \  { font: 'Georgia' }\n);\n```\n\nmodel just represents the simple object that\
    \ was passed in.\n\n```\nstyle.toJSON() // {\"font\": \"Georgia\"}\n```\n\nBut\
    \ unlike an ordinary object, this one publishes notifications when a change is\
    \ made.\n\n```\nstyle.on('change:font', function(model, font) {\n  alert('Thank\
    \ you for choosing ' + font + '!');\n});\n```\n\nOld-school JavaScript made changes\
    \ to the DOM directly from input event handlers. New-school JavaScript makes changes\
    \ to models, which then emit events that cause the DOM to update. In nearly all\
    \ apps, this separation of concerns results in more elegant, intuitive code.\n\
    \n# Propagating Model Events\n\nIn its simplest form, MVC consists of wiring models\
    \ to views: \"If this model changes this way, change the DOM that way.\" But the\
    \ biggest gains from MVC happen when change events bubble up the data tree. Instead\
    \ of subscribing to events on every leaf, you can just subscribe to the roots\
    \ and branches.\n\n> http://documentcloud.github.com/backbone/"
  - '[PAGE 40]


    # Set/Get on Evented Models


    JavaScript as we know it doesn''t have a mechanism for firing an event every time
    an object is modified. So, for evented models to work, we have to remember to
    use methods like Backbone''s set and get.


    ```

    style.set({font: ''Palatino''});  // triggers alert!

    style.get(''font'');              // "Palatino"

    style.font = ''Comic Sans'';      // no events fire

    style.font;                     // "Comic Sans"

    style.get(''font'');              // Still "Palatino"

    ```


    This may not be necessary in the future, if an ECMAScript proposal called Object.observe
    becomes widely adopted.a


    a. https://plus.google.com/111386188573471152118/posts/6peb6yffyWG


    To that end, Backbone models are often organized into Backbone collections, which
    are essentially evented arrays. You can listen for when models are added to and
    removed from them. Backbone collections automatically propagate events from the
    models they contain.


    For example, you might have a spriteCollection object containing hundreds of models
    representing things you''re drawing on a canvas element. Each time any of those
    sprites change, you need to redraw the canvas. Rather than attaching the redraw
    function as a handler for the change event on each sprite individually, you could
    instead just write the following:


    ```

    spriteCollection.on(''change'', redraw);

    ```


    Note that this automatic propagation goes only one level down. Backbone has no
    notion of nested collections. However, you can implement this propagation yourself
    using Backbone''s trigger method. With it, any Backbone object can emit arbitrary
    events.


    # Cycles and Nested Changes


    Propagating events from one object to another poses certain concerns. If an event
    on one object causes a series of events that will ultimately trigger the same
    event on the same object every time, then the result will be an event cycle. And
    if the cycle is synchronous, the result will be a stack overflow, like we saw
    in Synchronicity, on page 22.


    Yet oftentimes, a cycle of change events is exactly what we want. The most common
    case is a two-way binding, where two models have interrelated values. Suppose
    we want to ensure that x always equals 2 * y.'
  - "[PAGE 41]\n\nvar x = new Backbone.Model({value: 0});\nvar y = new Backbone.Model({value:\
    \ 0});\nx.on('change:value', function(x, xVal) { y.set({value: xVal / 2}); });\n\
    y.on('change:value', function(y, yVal) { x.set({value: 2 * yVal}); });\n\nYou\
    \ might expect this code to lead to an infinite loop the moment the value of x\
    \ or y is changed. But actually, it's quite safe, thanks to two safeguards in\
    \ Backbone.\n\n+   - set doesn't emit a change event if the new value matches\
    \ the old one.\n- Models can't emit a change event during one of its own change\
    \ events.\n\nThe second safeguard presents gotchas of its own. Suppose a change\
    \ is made to a model that results in a second change to the same model. Because\
    \ the second change is \"nested\" in the first one, it'll occur silently. Observers\
    \ won't have a chance to respond to it.\n\nClearly, maintaining two-way data bindings\
    \ in Backbone is a challenge. Another major MVC framework, Ember.js, takes a different\
    \ approach: two-way bindings are declared explicitly. When one value changes,\
    \ the other is updated asynchronously from a timeout event. So, until that event\
    \ fires, the application's data may be in an inconsistent state.\n\nThere's no\
    \ easy solution to the problem of bindings across evented models. In Backbone,\
    \ a prudent way to step around the issue is the silent flag. If you add {silent:\
    \ true} to a set event, no change event will happen. So, if several entangled\
    \ models need to be updated at once, a good approach is to set them silently.\
    \ Then call their change methods to fire the appropriate events only after they're\
    \ in a consistent state.\n\nEvented models give us an intuitive way of transforming\
    \ application state changes into events. Everything Backbone and other MVC frameworks\
    \ do is about these models, updating the DOM and the server when their states\
    \ change. Storing mutable data in evented models is a great first step to reigning\
    \ in the growing complexity of client-side JavaScript applications.\n\n# ### 2.3\
    \ Custom jQuery Events\n\nCustom events are an underappreciated feature of jQuery\
    \ that make it easy to graft a powerful distributed event system onto any web\
    \ app, with no additional libraries. You can emit any event you want from any\
    \ DOM element from jQuery using trigger.\n\n```\n$('#tabby, #socks').on('meow',\
    \ function() {\n console.log(this.id + ' meowed');\n});\n$('#tabby').trigger('meow');\
    \ // \"tabby meowed\"\n$('#socks').trigger('meow'); // \"socks meowed\"\n```"
  - "[PAGE 42]\n\nIf you've worked with DOM events before, you're no doubt familiar\
    \ with bub-bling. Whenever an element emits an event (such as a 'click'), its\
    \ parent then emits the event, then its grandparent, and so on, up to the root\
    \ element, document—unless the event's stopPropagation method is called at some\
    \ point along the way. (jQuery does this for us automatically when we return false\
    \ from a handler.) But did you know that jQuery's custom events bubble as well?\
    \ For instance, if we have a span named \"soda\" nested in a div named \"bottle,\"\
    \ the code\n\n```\n$('#soda, #bottle').on('fizz', function() {\n    console.log(this.id\
    \ + ' emitted fizz');\n});\n$('#soda').trigger('fizz');\n```\n\nwill emit the\
    \ following output:\n` < soda emitted fizz    bottle emitted fizz \" This bubbling\
    \ isn't always desirable, as we'll see in the following tooltips example. Fortunately,\
    \ jQuery offers the nonbubbling triggerHandler method as well.\n\n# Example: Tooltips\n\
    \nWhen events can be mapped intuitively to page elements, jQuery is an ideal way\
    \ of distributing them. For instance, suppose you're writing a tooltip library\
    \ and you want only one tooltip to be visible at a time. You might simply add\
    \ the line\n\n```\n$('.tooltip').remove();\n```\n\nto the start of the function\
    \ that adds new tooltips. But what if we decide later that we want certain containers\
    \ to be isolated, such as when a new tooltip is shown in the sidebar, tooltips\
    \ everywhere else are unaffected, and vice versa? Writing a selector for \"elements\
    \ with class tooltip that are not descendants of sidebar\" is tricky and not very\
    \ efficient. The problem would get exponentially harder if we decided to allow\
    \ isolated containers to be nested to an arbitrary depth.\n\nBut implementing\
    \ this behavior with event logic rather than selector logic is easy.\n\n```\n\
    // $container could be $('#sidebar') or $(document)\n$container.triggerHandler('newTooltip');\n\
    $container.one('newTooltip', function() {\n    $tooltip.remove();\n});\n```"
- md: "## 2.4 What We've Learned\n\n(Notice the use of jQuery's `one` instead of `on`.\
    \ The difference is that `one` automatically removes the handler after it fires.)\n\
    \nWith these two lines of code, each tooltip will listen to its container and\
    \ remove itself when the container gets a new tooltip. It's a beautifully direct,\
    \ efficient approach that saves us from having to store any state or engineer\
    \ complex selectors (which would slow older browsers to a crawl—IE7 and older\
    \ don't even have a way of selecting all elements with the `tooltip` class without\
    \ traversing the whole document!).\n\nNote that event bubbling would actually\
    \ have defeated our intent in this case: when we create a new tooltip in the sidebar,\
    \ we want only tooltips listening for the 'newTooltip' event on the sidebar itself\
    \ to go away, not those on the surrounding document. Always think carefully about\
    \ whether `trigger` or `triggerHandler` is the right tool for the job.\n\nCustom\
    \ jQuery events are an unusual twist on PubSub, since the events are emitted by\
    \ selectable elements rather than by objects in our script. Much as evented models\
    \ are an intuitive way of expressing state-related events, jQuery events let us\
    \ express DOM-related events directly through the DOM, saving us from having to\
    \ duplicate that state elsewhere in our application. Use them liberally, but try\
    \ to avoid relying on the structure of your application's markup —you don't want\
    \ your next redesign to break your script.\n\nIn this chapter, we've learned about\
    \ distributing events via PubSub, one of the most fundamental JavaScript design\
    \ patterns. When you're not subscribing to the events that are being published,\
    \ PubSub is completely unobtrusive. The key to using PubSub properly is deciding\
    \ which entities to distribute events through.\n\nWe've seen that any object can\
    \ be used for PubSub, simply by inheriting from something like Node's EventEmitter.\
    \ Whenever an object is associated with a set of async tasks or I/O events, it's\
    \ a good idea to make it evented.\n\nOne class of evented object is the models\
    \ in MVC libraries like Backbone.js. These models both contain application state\
    \ and announce changes to it. Change events can trigger application logic, DOM\
    \ updates, and synchronization with the server. It all feels very natural, which\
    \ explains why Backbone has become a smash-hit library. DOM events complement\
    \ each other perfectly, helping to keep the application’s state and view encapsulated\
    \ from each other.\n\nAll of these are examples of PubSub in action. However,\
    \ as versatile as it is, PubSub isn’t the right tool for every job. In particular,\
    \ it’s a poor fit for one-shot events, when an async function performs a task\
    \ whose completion or failure needs to be handled in a unique way. (An Ajax request\
    \ is a common example.) One tool for solving that problem, called a *Promise*,\
    \ is the subject of the next chapter.\n\n# CHAPTER 3\n## Promises and Deferreds\n\
    \nIn 2010, I had this conversation with my prolific colleague Mr. Ajax:\n\nMe:\
    \ Hey, would you fetch some data from this URL for me, please?\n\nMr. Ajax: I'm\
    \ on it! Just give me a success callback so I can let you know when I'm done.\n\
    \nMe: OK, here you go. Thanks.\n\nMr. Ajax: Oh, and you should give me an error\
    \ callback, too. You know, just in case.\n\nMe: Good point. Anything else?\n\n\
    Mr. Ajax: Hey, I noticed that there's some code duplication between those two\
    \ callbacks! You could move that into a third always callback.\n\nMe: (impatiently)\
    \ Alright, I'll refactor them. Tell you what: why don't you run now, and I'll\
    \ give you the callbacks later?\n\nMr. Ajax: (irately) What do I look like, an\
    \ EventEmitter?\n\nThankfully, jQuery 1.5 changed Mr. Ajax's need-it-now attitude.\
    \ All of the Ajax functions you know and love ($.ajax, $.get, and $.post) now\
    \ return Promises. A Promise is an object that represents a task with two possible\
    \ outcomes (success or failure) and holds callbacks that fire when one outcome\
    \ or the other has occurred. For example, under jQuery 1.4, I'd have had to write\
    \ this:\n\n```\n// Promises/get-1.4.js\n$.get('/mydata', {\n success: onSuccess,\n\
    \ failure: onFailure,\n always: onAlways\n});\n```\n\nBut under jQuery 1.5+, I\
    \ can write this instead:\n\n```\n// Promises/get-1.5.js\nvar promise = $.get('/mydata');\n\
    promise.done(onSuccess);\npromise.fail(onFailure);\npromise.always(onAlways);\n\
    ```\n\nYou might wonder what's so great about this change. Why would you want\
    \ to attach a callback after an Ajax call has fired? In a word: *encapsulation*.\
    \ If an Ajax call has multiple effects (triggering animations, inserting HTML,\
    \ locking/unlocking user input, and so on), it's awkward for the part of your\
    \ app that's making the request to handle all of them.\n\nIt's much more elegant\
    \ to pass a Promise around. By passing a Promise, you're announcing, \"Something\
    \ you might be interested in is happening. If you want to find out when it's done,\
    \ just give this Promise a callback.\" And like an EventEmitter, a Promise allows\
    \ you to bind handlers to the same event as many times as you like (*stacking*).\
    \ That makes it a lot easier to reduce code duplication when some small piece\
    \ of functionality (like a \"Loading\" animation) is shared across several Ajax\
    \ calls.\n\nBut the biggest advantage of using Promises is that you can easily\
    \ derive new Promises from existing ones. You might ask two Promises representing\
    \ parallel tasks to give you a Promise that will inform you of their mutual completion.\
    \ Or you might ask a Promise representing the first task in a series to give you\
    \ a Promise representing the *final* task in the series. As we'll soon see, these\
    \ operations come naturally with Promises.\n\n### 3.1 A Very Brief History of\
    \ Promises\n\nPromises have existed in many forms in many languages. The term\
    \ was first used by C++ engineers on the Xanadu project, a forerunner to the Web.\
    \ Promises were later used in the E programming language, which inspired Python\
    \ developers to implement them in the form of the Twisted framework's Deferreds.\n\
    \nPromises hit the JavaScript mainstream in 2007 when the Dojo framework, taking\
    \ a cue from Twisted, added an object called `dojo.Deferred`. At the time, the\
    \ relatively mature Dojo rivaled the fledgling jQuery framework in popularity.\
    \ In 2009, citing `dojo.Deferred` as an influence, Kris Zyp proposed the CommonJS\
    \ Promises/A spec.¹ That same year, Node.js made its first appearance. Node's\
    \ early iterations used Promises in its nonblocking API. However, in February\
    \ 2010, Ryan Dahl made the decision to switch to the now-familiar `callback(err,\
    \ results...)` format, on the grounds that Promises are a higher-level construct\
    \ that belongs in \"userland.\"\n\nThis decision made way for competing Promises\
    \ implementations aimed at Node, notably Kris Kowal's Q.js² and AJ ONeal's Futures.³\
    \ (In common usage, the terms *Promise*, *Deferred*, and *Future* are roughly\
    \ synonymous.) **Q** is a fairly straightforward implementation of the Promises/A\
    \ spec. Futures is a broader toolkit, incorporating many of the flow control features\
    \ found in libraries like Async.js.\n\nBut the reason Promises are getting so\
    \ much attention today is, of course, jQuery. Accompanying a major rewrite of\
    \ $.ajax in January 2011, jQuery 1.5's Promises implementation thrilled countless\
    \ developers who were encountering Promises for the first time. Others, however,\
    \ were frustrated that the Promises/A spec had been ignored, leading to subtle\
    \ API differences.\n\nWe'll focus on jQuery Promises for the rest of this chapter,\
    \ except in [Section 3.7, *jQuery vs. Promises/A*, on page 43](#). We'll also\
    \ take our vocabulary cues from jQuery, particularly the distinction between Deferreds\
    \ and Promises that we'll see in the next section and the use of \"resolve\" as\
    \ the antonym of \"reject.\"\n\n### 3.2 Making Promises\n\nWe started this chapter\
    \ by showing how the Ajax methods in jQuery 1.5+ ($.ajax, $.get, and $.post) return\
    \ Promises. But to really understand Promises, we need to make a few of our own.\n\
    \nLet's give the user a prompt to hit either Y or N. The first thing we'll do\
    \ is create an instance of `$.Deferred` that represents the user's decision.\n\
    \n```javascript\nvar promptDeferred = new $.Deferred();\npromptDeferred.always(function(){\
