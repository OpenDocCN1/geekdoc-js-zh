    \ Promise 会立即解决。\n\n## ### 3.6 用 pipe 绑定未来\n\n在 JavaScript 中，执行一系列异步任务常常很不方便，因为你无法在第一个任务完成之前为第二个任务附加处理程序。例如，让我们从一个\
    \ URL 获取（GET）数据，然后将其发布（POST）到另一个 URL。\n\n```javascript\nvar getPromise = $.get('/query')\n\
    getPromise.done(function(data) {\n    var postPromise = $.post('/search', data)\n\
    })\n// 现在 we'd like to attach handlers to postPromise\n```\n\n你发现这里的问题了吗？在我们 GET\
    \ 操作完成之前，我们无法为 `postPromise` 绑定回调，因为它还不存在！它是由我们发起 `$post` 调用才创建的，而在我们异步地从 `$.get`\
    \ 调用获取到数据之前，我们无法发起这个调用。\n\n这就是为什么 jQuery 1.6 为 Promise 添加了 `pipe` 方法。本质上，`pipe`\
    \ 是这样的：\"给我一个针对此 Promise 的回调，我会给你一个代表该回调结果的 Promise。\"\n\n```javascript\nvar getPrompt\
    \ = $.get('/query')\nvar postPromise = getPromise.pipe(function(data) {\n    return\
    \ $.post('/search', data)\n})\n```\n\n看起来像黑魔法，对吧？以下是它的工作原理：`pipe` 为每种回调类型各接受一个参数：`done`、`fail`\
    \ 和 `progress`。所以，在这个例子中，我们只提供了一个在 `getPromise` 解决时运行的回调。`pipe` 方法返回一个新的 Promise`s`，它在我们的回调返回的\
    \ Promise 解决/拒绝时解决/拒绝。\n\n实际上，`pipe` 就是通往未来的窗口！\n\n你也可以使用 `pipe` 来\"过滤\" Promise，修改回调参数。如果\
    \ `pipe` 回调返回的是非 Promise/Deferred 的东西，那么该值就成为回调参数。例如，如果你有一个 Promise 发出 0 到 1 之间数字的进度通知，你可以使用\
    \ `pipe` 创建一个相同的 Promise，改为发出人类可读的字符串作为进度通知。\n\n```javascript\nvar promise2 =\
    \ promise1.pipe(null, null, function(progress) {\n    return Math.floor(progress\
    \ * 100) + '% complete';\n});\n```\n\n总结一下，你可以在 `pipe` 回调中做两件事。\n\n- 如果你返回一个 Promise，`pipe`\
    \ 返回的 Promise 会模仿它。\n- 如果你返回非 Promise 值（或什么都不返回），`pipe` 返回的 Promise 会立即根据原始 Promise\
    \ 刚刚发生的情况，以该值解决、拒绝或通知。\n\n`pipe` 判断某物是否为 Promise 的规则与 `$.when` 相同：如果它有 `promise`\
    \ 方法，该方法的返回值就被用作代表原始对象的 Promise。同样，`promise.promise() === promise`。\n\n### Pipe\
    \ 级联\n\n`pipe` 不要求你提供所有可能的回调。事实上，你通常只会写：\n\n```javascript\nvar pipedPromise =\
    \ originalPromise.pipe(successCallback);\n```\n\n或者：\n\n```javascript\nvar pipedPromise\
    \ = originalPromise.pipe(null, failCallback);\n```\n\n我们已经看到了当原始 Promise 在第一种情况下成功、或在第二种情况下失败时会发生什么，此时\
    \ pip过 的 Promise 的行为取决于 `successCallback` 或 `failCallback` 的返回值。但当我们没有为原始 Promise\
    \ 的行为提供 `pipe` 回调时会怎样呢？\n\n很简单。在这些情况下，被 pip过 的 Promise 会模仿原始 Promise。我们可以说原始 Promise\
    \ 的行为级联（cascades）通过了被 pip过 的 Promise。这种级联非常方便，因为它让我们能够以最小的努力为异步任务定义分支逻辑。假设我们有一个三步流程。\n"
