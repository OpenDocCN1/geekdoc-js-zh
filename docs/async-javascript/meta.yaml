- img_proc: true
  md: 'The Mozilla Foundation (you may have heard of its browser, Firefox) is headed
    up by Brendan Eich, the creator of JavaScript. The foundation knows its stuff.


    If you can''t find your answer among MDN''s pages, take your question to Stack
    Overflow.¹¹ The site has fostered an amazingly helpful developer community, and
    it''s a safe bet that any coherent question tagged JavaScript will receive a punctual
    response.


    # Running the Code Examples


    This book is a bit unusual, in that I discuss both client-side (browser) and server-side
    (Node.js) code. That reflects the uniquely portable nature of JavaScript. The
    central concepts apply to all JavaScript environments, but certain examples are
    aimed at one or the other.


    Even if you have no interest in writing Node applications, I hope you''ll follow
    along by running these code snippets locally. See Running Code in Node.js, on
    page xiv for directions.


    # Which Examples Are Runnable?


    When you see a code snippet with a filename, that means it''s self-contained and
    can be run without modification. Here''s an example:


    ```

    Preface/stringConstructor.js

    console.log(''str''.constructor.name);

    ```


    The surrounding context should make it clear whether the code is runnable in the
    browser, in Node.js, or in both.


    When a code snippet doesn''t have a filename, that means it''s not self-contained.
    It may be part of a larger example, or it may be a hypothetical. Here''s an example:


    ```

    var tenSeconds = 10 * 1e3;

    setTimeout(launchSatellite, tenSeconds);

    ```


    These examples are meant to be read, not run.


    # Running Code in Node.js


    Node is very easy to install and use: just head to http://nodejs.org/, click Download,
    and run the Windows or OS X installer (or build from source on *nix). You can
    then run node from the command line to open a JavaScript REPL (analogous to Ruby''s
    irb environment).


    11. http://stackoverflow.com/'
