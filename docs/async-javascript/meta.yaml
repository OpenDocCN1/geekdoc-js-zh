    # Restrictions on Node Workers


    For the most part, cluster obeys the same rules as web workers: there’s a master,
    and there are workers; they communicate via events with attached strings or serializable
    objects. However, while workers are obviously second-class citizens in the browser,
    Node’s workers possess all the rights and privileges of the master except, notably,
    the following:


    +   - The ability to shut down the application

    - The ability to spawn more workers

    - The ability to communicate with each other


    This gives the master the burden of being a hub for all interthread communication.
    Fortunately, this inconvenience can be abstracted away with a library like Roly
    Fentanes’ Clusterhub.⁹


    In this section, we’ve seen how workers have become an integral part of Node,
    allowing a server to utilize multiple cores without running multiple application
    instances. Node’s cluster API allows the same script to run concurrently, with
    one master process and any number of workers. To minimize the overhead of communication,
    shared state should be stored in an external database, such as Redis.


    # 5.3 What We’ve Learned


    It’s early, but I’d say the future of multicore JavaScript is bright. For any
    application that can be split up into largely independent processes that need
    to talk to each other only periodically, workers are a winning solution for leveraging
    maximum CPU power. Distributed computing has never been more fun.


