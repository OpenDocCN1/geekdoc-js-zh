    That concludes our brief overview of basic async functions in JavaScript. But
    how do we tell when a function is async anyway? In the next section, we''ll ponder
    that question as we write our own async functions.


    # # **1.3** Writing Async Functions

    Every async function in JavaScript is built on some other async function(s). It''s
    async functions all the way down (to native code)!


    The converse is also true: any function that uses an async function has to provide
    the result of that operation in an async way. As we learned from [Blocking the
    Thread, on page 2](#), JavaScript doesn''t provide a mechanism for preventing
    a function from returning until an async operation has finished.

    in fact, until the function returns, no async events will fire.


    **When Is a Function Async?**

    The term async *function* is a bit of a misnomer: if you call a function, your
    program simply won''t continue until that function returns. What JavaScripters
    mean when they call a function "async" is that it can cause another function (called
    a callback 4when it''s passed as an argument to the function) to run later from
    the event queue.


    So,_an async function that takes a callback will never fail this test:


    ```

    **var** functionHasReturned = false;

    asyncFunction(function() {

    console.assert (functionHasReturned);

    })


    functionHasReturned = true;

    ```


    **Another term** for async functions is *nonblocking*. The term emphasizes how
    speedy they are: a query made with an async MySQL driver may take an hour but
    the function that sent the query will return in a matter of microseconds—a boon
    to web servers that need to quickly process  a high volume of incoming requests.


    - ³ <http://paulirish.com/2011/requestanimationframe-for-smart-animating />'
