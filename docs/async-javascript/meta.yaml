  md: "The throw from the timeout event simply triggers the domain’s error handler.\n\
    < Error ignored!\nMagical, isn’t it? Domains make throw much more palatable. Unfortunately,\
    \ they’re available only in Node 0.8+, and as of this writing, they’re still considered\
    \ an experimental feature. For more information, see the Node docs.⁹\nWhether\
    \ you’re in the browser or on the server, global exception handlers should be\
    \ seen as a measure of last resort. Use them only for debugging.\n\n# To Throw\
    \ or Not to Throw?\n\nWhen you’re given an error, the easiest thing to do with\
    \ it is to throw it. In Node code, you’ll often see callbacks that look like this:\n\
    \n```\nfunction(err) {\n    if (err) throw err;\n    // ...\n}\n```\n\nWe’ll use\
    \ this idiom frequently in [Chapter 4, Flow Control with Async.js, on page 47](http://nodejs.org).\
    \ But in a production app, allowing routine exceptions and fatal errors alike\
    \ to bubble up to the global handler is unacceptable. throw in a callback is a\
    \ JavaScripter’s way of saying, “I don’t want to think about this right now.”\n\
    \nWhat about throwing exceptions that you know will be caught? That’s an equally\
    \ thorny area. In 2011, Isaac Schlueter (creator of npm and current head of Node\
    \ development) argued that try/catch is an anti-pattern.¹⁰\n\n> Try/catch is goto\
    \ wrapped in pretty braces. There’s no way to continue where you left off, once\
    \ the error is handled. What’s worse, in the code that throws, you have no idea\
    \ where you’re jumping to. When you return an error code, you are fulfilling a\
    \ contract. When you throw, you’re saying, “I know I was talking to you, but I’m\
    \ going to jump over you now and talk to your boss instead.” It’s rude. If it’s\
    \ not an emergency, don’t do that; if it is an emergency, then we should crash.\n\
    \nSchlueter advocated using throws purely as assert-like constructs, a way of\
    \ bringing applications to a halt when they’re doing something completely unexpected.\
    \ The Node community has largely followed this recommendation, though that may\
    \ change with the emergence of domains.\n\nSo, what’s the current best practice\
    \ for handling async errors? I suggest heeding Schlueter’s advice: if you want\
    \ your whole application to stop, go ahead and use throw. Otherwise, give some\
