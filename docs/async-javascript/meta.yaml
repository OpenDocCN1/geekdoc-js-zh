    \ Q.js.\n\n# 3.7  jQuery vs. Promises/A\n\nIn terms of capabilities, jQuery Promises\
    \ and Promises/A are nearly identical. Q.js, the most popular Promises/A library,\
    \ even offers methods that can work with jQuery Promises. The differences are\
    \ superficial; they use the same words to mean different things.\n\nAs previously\
    \ mentioned in [Section 3.2, Making Promises, on page 33](Section%203.2,%20Making%20Promises,%20on%20page%2033),\
    \ jQuery uses the term `resolve` as the opposite of `fail`, whereas Promises/A\
    \ uses `fulfill`."
