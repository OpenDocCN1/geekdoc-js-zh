    \n2010 年，我与我那才华横溢的同事 Ajax 先生进行了如下对话：\n\n我：嘿，你能帮我从这个 URL 获取一些数据吗？\n\nAjax 先生：我这就去！给我一个成功回调函数，完成后我就能通知你。\n\
