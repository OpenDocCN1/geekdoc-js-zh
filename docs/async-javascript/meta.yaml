- md: "The latter approach is nicer, since the browser takes care of the work of making\
    \ an HTTP request for you. Plus, eval has practical problems: leaking scope, making\
    \ a mess of debugging, and possibly degrading performance. So, to load a script\
    \ called feature.js, we would insert a `<script>` tag with some code like this:\n\
    \n```\nvar head = document.getElementsByTagName('head')[0];\nvar script = document.createElement('script');\n\
    script.src = '/js/feature.js';\nhead.appendChild(script);\n```\n\nBut wait—how\
    \ do we find out when the script has finished loading? We could, of course, add\
    \ some code in the script itself to trigger an event, but adding that code to\
    \ every script we load would be a chore (or, in the case of scripts on a third-party\
    \ server, impossible). The HTML5 specification defines an onload attribute that\
    \ we can bind a callback to.\n\n```\nscript.onload = function() {\n  // now we\
    \ can call functions defined in script\n};\n```\n\nHowever, onload isn't supported\
    \ in IE8 and older, which instead uses onreadystatechange. There are also some\
    \ weird edge cases in certain browsers when inserting `<script>` tags. And I haven't\
    \ even gotten into error handling! To avoid all of these headaches, I highly recommend\
    \ using a script-loading library.\n\n## Conditional Loading with yepnope\n\nyepnope⁶\
    \ is a simple and lightweight library (just 1.7KB minified and gzipped) designed\
    \ to serve the most common dynamic loading needs without frills. It can be used\
    \ on its own or as part of the Modernizr feature detection library.\n\nAt its\
    \ simplest, yepnope loads a script and gives you a callback for when the script\
    \ has run.\n\n```\nyepnope({\n  load: 'oompaLoompas.js',\n  callback: function()\
    \ {\n    console.log('Oompa-Loompas ready!');\n  }\n});\n```\n\nNot impressed\
    \ yet? Let's use yepnope to load multiple scripts in parallel and run them in\
    \ the given order. For example, suppose we want to load Backbone.js, which depends\
    \ on Underscore.js. All we have to do is provide the two script locations in an\
    \ array as the load parameter.\n\n```\nyepnope({\n  load: ['underscore.js', 'backbone.js'],\n\
    \  complete: function() {\n    // Backbone logic goes here\n  }\n});\n```\n\n\
    Notice that we used complete instead of callback here. The difference is that\
    \ callback is run for every resource in the load list, while complete runs only\
    \ after everything has been loaded.\n\nyepnope's trademark feature is *conditional\
    \ loading*. Given a test parameter, yepnope can load different resources based\
    \ on whether that value is truthy. For instance, if you're using Modernizr, you\
    \ can determine (to some degree of accuracy) whether the user is on a touchscreen\
    \ device and load different stylesheets and scripts accordingly.\n\n```\nyepnope({\n\
    \  test: Modernizr.touch,\n  yep: ['touchStyles.css', 'touchApplication.js'],\n\
    \  nope: ['mouseStyles.css', 'mouseApplication.js'],\n  complete: function() {\n\
    \    // either way, the application is now ready!\n  }\n});\n```\n\nWith a handful\
    \ of lines of code, we've set the stage to give users a completely different experience\
    \ based on their input device. Of course, we don't need both a yep and a nope\
    \ for every condition. One of the most common uses of yepnope is loading shims\
    \ to fill in functionality that's missing from older browsers.\n\n```\nyepnope({\n\
    \  test: window.json,\n  nope: ['json2.js'],\n  complete: function() {\n    //\
    \ now we can JSON safely\n  }\n});\n```\n\nHere's a good markup structure for\
    \ a page that uses yepnope:\n\n```\n<html>\n<head>\n    <!-- metadata and stylesheets\
    \ go here -->\n    <script src=\"headScripts.js\"></script>\n    <script src=\"\
    deferredScripts.js\" defer></script>\n</head>\n<body>\n    <!-- content goes here\
    \ -->\n</body>\n</html>\n```\n\nLook familiar? This is the same structure we had\
    \ in the section on defer. The only difference is that yepnope.js has been concatenated\
    \ into one of the script files (likely at the top of deferredScripts.js), and\
    \ anything that we need conditionally (because the browser needs a shim) or want\
    \ to load dynamically (in response to a user action) can be loaded separately.\
    \ The result should be a smaller deferredScripts.js.\n\nI love yepnope. For relatively\
    \ simple applications that just want to grab a few shims or load a feature when\
    \ a user clicks something, yepnope is pretty much perfect. For truly voluminous\
    \ applications, though, something stronger is called for.\n\n## Smart Loading\
    \ with Require.js and AMD\n\nRequire.js is the script loader of choice for developers\
    \ who want to turn the chaos of script-heavy applications into something more\
    \ orderly. It's a powerful package capable of sorting out even the most complex\
    \ dependency graphs automatically with AMD.\n\nWe'll get to AMD in a moment, but\
    \ first let's look at a simple script-loading example with Require.js's eponymous\
    \ function.\n\n```\nrequire(['moment'], function(moment) {\n    console.log(moment().format('dddd'));\
    \  // day of the week\n});\n```\n\nThe require function takes an array of script\
    \ names and loads all of those scripts in parallel. Unlike yepnope, Require.js\
    \ doesn't ensure that the target scripts run in order. Instead, it ensures that\
    \ they run in an order such that each script's dependencies are satisfied, provided\
    \ that those scripts are specified via the Asynchronous Module Definition (AMD).\n\
    \nAMD is a specification<sup>7</sup> that aims to do for the browser what the\
    \ CommonJS standard has accomplished for the server. (Node.js modules are based\
    \ on the CommonJS standard.) It mandates a global function (provided by Require.js)\
    \ called define, which takes three parameters: a name, a list of dependencies,\
    \ and a callback for when those dependencies are loaded. For example, this is\
    \ a valid AMD definition for an application that depends on jQuery:\n\n```\ndefine('myApplication',\
    \ ['jquery'], function($) {\n    $('<body>').append('<p>Hello, async world!</p>');\n\
    });\n```\n\nNotice that the jQuery object, $, is passed to the callback. In fact,\
    \ the callback will always receive an argument corresponding to each item in the\
    \ dependency list. You might be wondering how define knew to capture the jQuery\
    \ object. The answer is that jQuery's own AMD definition⁸ returns jQuery from\
    \ its define callback, thereby declaring “this is my exported object.”\n\n```\n\
    define( \"jquery\", [], function () { return jQuery; } );\n```\n\nThere’s a little\
    \ more to AMD than that, but that’s the essence. Adding AMD definitions to every\
    \ script in your application means you can call require and rest assured that\
    \ your callback won’t be invoked until not only are your direct dependencies met\
    \ but their dependencies and their dependencies’ dependencies are as well, all\
    \ loading with maximum parallelism and running in an order consistent with the\
    \ dependency graph.\n\nSounds great, right? But there’s a flip side: while AMD\
    \ has gotten some traction in the JavaScript community, there are plenty of doubters.\
    \ Jeremy Ashkenas, for instance, has declined to add the requisite boilerplate\
    \ to his popular Underscore.js and Backbone.js libraries, awaiting an anticipated\
    \ ECMAScript module standard. As a result, you can’t count on third-party modules\
    \ to have their own AMD definitions. Choosing AMD can make your application more\
    \ consistent, but it can also be a recipe for boilerplate code.\n\nIn these last\
    \ few pages, we’ve seen how you can load a script at runtime via DOM manipulation,\
    \ and we’ve looked at two libraries for simplifying that process: yepnope, a small,\
    \ precise tool, and Require.js, a large and powerful one. Which you choose ultimately\
    \ depends on what kind of application you’re developing and what kind of development\
    \ team you are. The more “enterprise-y” the application and the bigger the front-end\
    \ team, the more likely you are to benefit from the AMD-style modularization encouraged\
    \ by Require.js.\n\n⁷. https://github.com/amdjs/amdjs-api/wiki/AMD\n⁸. See https://github.com/jquery/jquery/blob/master/src/exports.js#L17.\n\
    \n## What We've Learned\n\nYou can make your site much snappier by asynchronously\
    \ loading the scripts you don't need right away. The easiest way to do that is\
    \ with judicious use of the defer and async attributes. If you need to load scripts\
    \ conditionally, consider a loader like yepnope. And if your site has scores of\
    \ interdependent scripts, take a good look at Require.js. Choose the right tool\
    \ for the job, embrace it, and enjoy.\n\nAnd on that note, we've reached the end\
    \ of the book. Thanks for taking the time to read it. It was my pleasure to write\
    \ it. No matter where your JavaScript journey takes you from here, I hope that\
    \ it's rich in beautiful, event-driven code."
  mdcn: "\n后一种方法更优，因为浏览器会为你处理HTTP请求的工作。此外，eval存在实际问题：泄漏作用域、使调试变得混乱，还可能降低性能。因此，要加载一个名为`feature.js`的脚本，我们会插入一个`<script>`标签，代码大致如下：\n\
    \n```\nvar head = document.getElementsByTagName('head')[0];\nvar script = document.createElement('script');\n\
    script.src = '/js/feature.js';\nhead.appendChild(script);\n```\n\n但是等等——我们如何得知脚本何时加载完毕？当然，我们可以在脚本本身添加一些代码来触发事件，但为每个加载的脚本都添加这段代码将是一件苦差事（或者，对于第三方服务器上的脚本来说，是不可能的）。HTML5规范定义了一个`onload`属性，我们可以将回调绑定到该属性上。\n\
    \n```\nscript.onload = function() {\n  // 现在我们可以调用脚本中定义的函数了\n};\n```\n\n然而，IE8及更早版本不支持`onload`，它们使用的是`onreadystatechange`。在某些浏览器中插入`<script>`标签时，还有一些奇怪的边缘情况。我甚至还没提到错误处理！为了避免所有这些麻烦，我强烈建议使用脚本加载库。\n\
    \n## 使用yepnope进行条件加载\n\nyepnope⁶是一个简单轻量级的库（压缩和gzip后仅1.7KB），旨在满足最常见的动态加载需求，而不花哨。它可以单独使用，也可以作为Modernizr特性检测库的一部分。\n\
    \n在最简单的情况下，yepnope加载一个脚本，并在脚本运行后给你一个回调。\n\n```\nyepnope({\n  load: 'oompaLoompas.js',\n\
    \  callback: function() {\n    console.log('Oompa-Loompas ready!');\n  }\n});\n\
    ```\n\n还没被打动？让我们用yepnope并行加载多个脚本，并按给定顺序运行它们。例如，假设我们想加载依赖于Underscore.js的Backbone.js。我们只需将两个脚本的位置作为load参数的数组提供即可。\n\
    \n```\nyepnope({\n  load: ['underscore.js', 'backbone.js'],\n  complete: function()\
    \ {\n    // Backbone逻辑放在这里\n  }\n});\n```\n\n注意我们这里使用了`complete`而不是`callback`。区别在于`callback`为load列表中的每个资源运行，而`complete`只在所有资源都加载完毕后运行。\n\
    \nyepnope的标志性特性是*条件加载*。给定一个test参数，yepnope可以根据该值是否为真值来加载不同的资源。例如，如果你在使用Modernizr，你可以（在一定程度上准确地）判断用户是否使用触摸屏设备，并相应地加载不同的样式表和脚本。\n\
    \n```\nyepnope({\n  test: Modernizr.touch,\n  yep: ['touchStyles.css', 'touchApplication.js'],\n\
    \  nope: ['mouseStyles.css', 'mouseApplication.js'],\n  complete: function() {\n\
    \    // 无论哪种方式，应用程序现在都准备好了！\n  }\n});\n```\n\n用短短几行代码，我们就为根据用户输入设备提供完全不同的体验奠定了基础。当然，我们不需要为每个条件都同时提供yep和nope。yepnope最常见的用途之一是加载polyfill，以填补旧浏览器缺失的功能。\n\
    \n```\nyepnope({\n  test: window.json,\n  nope: ['json2.js'],\n  complete: function()\
    \ {\n    // 现在我们可以安全地使用JSON了\n  }\n});\n```\n\n以下是使用yepnope的页面的良好标记结构：\n\n```\n\
    <html>\n<head>\n    <!-- 元数据和样式表放在这里 -->\n    <script src=\"headScripts.js\"></script>\n\
    \    <script src=\"deferredScripts.js\" defer></script>\n</head>\n<body>\n   \
    \ <!-- 内容放在这里 -->\n</body>\n</html>\n```\n\n看起来很熟悉？这与我们在defer部分讨论的结构相同。唯一的区别是yepnope.js已被合并到其中一个脚本文件中（可能位于deferredScripts.js的顶部），而所有我们需要条件加载（因为浏览器需要polyfill）或想要动态加载（响应用户操作）的内容都可以单独加载。结果应该是一个更小的deferredScripts.js。\n\
    \n我喜欢yepnope。对于那些只想抓取几个polyfill或在用户点击某处时加载一个功能的相对简单的应用程序来说，yepnope几乎完美。然而，对于真正庞大的应用程序，则需要更强大的工具。\n\
    \n## 使用Require.js和AMD进行智能加载\n\nRequire.js是那些希望将脚本密集型应用程序的混乱转化为更有秩序的开发者们首选的脚本加载器。它是一个强大的包，能够使用AMD自动处理最复杂的依赖关系图。\n\
    \n我们稍后会谈到AMD，但首先让我们看一个使用Require.js同名函数的简单脚本加载示例。\n\n```\nrequire(['moment'], function(moment)\
    \ {\n    console.log(moment().format('dddd'));  // 星期几\n});\n```\n\n`require`函数接受一个脚本名称数组，并并行加载所有这些脚本。与yepnope不同，Require.js并不确保目标脚本按顺序运行。相反，它确保它们运行的顺序使得每个脚本的依赖关系都得到满足，前提是这些脚本是通过异步模块定义（AMD）指定的。\n\
    \nAMD是一个规范⁷，旨在为浏览器实现CommonJS标准为服务器所做的事情。（Node.js模块基于CommonJS标准。）它强制要求一个全局函数（由Require.js提供），名为`define`，它接受三个参数：一个名称、一个依赖项列表，以及一个当这些依赖项加载完毕时的回调。例如，这是一个依赖于jQuery的应用程序的有效AMD定义：\n\
    \n```\ndefine('myApplication', ['jquery'], function($) {\n    $('<body>').append('<p>Hello,\
    \ async world!</p>');\n});\n```\n\n注意，jQuery对象`$`被传递给了回调。事实上，回调总是会收到一个对应于依赖列表中每个项目的参数。你可能想知道`define`是如何知道捕获jQuery对象的。答案是jQuery自己的AMD定义⁸在其`define`回调中返回了jQuery，从而声明“这是我导出的对象。”\n\
    \n```\ndefine( \"jquery\", [], function () { return jQuery; } );\n```\n\nAMD的内容比这稍微多一点，但这就是其精髓。为应用程序中的每个脚本添加AMD定义意味着你可以调用`require`，并放心，你的回调不仅会在你的直接依赖满足时被调用，而且当这些依赖的依赖以及依赖的依赖都满足时也会被调用，所有这些都以最大并行性加载，并按照与依赖关系图一致的顺序运行。\n\
    \n听起来很棒，对吧？但另一方面：虽然AMD在JavaScript社区中获得了一些支持，但也有很多怀疑者。例如，Jeremy Ashkenas拒绝为他流行的Underscore.js和Backbone.js库添加必要的样板代码，等待着一个预期的ECMAScript模块标准。因此，你不能指望第三方模块有自己的AMD定义。选择AMD可以使你的应用程序更一致，但也可能是样板代码的配方。\n\
    \n在最后几页中，我们了解了如何通过DOM操作在运行时加载脚本，并研究了两个简化此过程的库：yepnope，一个小而精确的工具；以及Require.js，一个大而强大的工具。你最终选择哪个取决于你正在开发什么样的应用程序以及你是什么样的开发团队。应用程序越“企业化”，前端团队越大，你就越有可能从Require.js所鼓励的AMD风格模块化中受益。\n\
    \n⁷. https://github.com/amdjs/amdjs-api/wiki/AMD\n⁸. 参见 https://github.com/jquery/jquery/blob/master/src/exports.js#L17.\n\
    \n## 我们学到了什么\n\n你可以通过异步加载那些不需要立即使用的脚本，使你的网站运行得更快。最简单的方法是明智地使用`defer`和`async`属性。如果你需要条件加载脚本，请考虑使用像yepnope这样的加载器。如果你的网站有大量相互依赖的脚本，请仔细研究一下Require.js。选择适合这项工作的工具，拥抱它，并享受它。\n\
    \n说到这里，我们已经到达了本书的结尾。感谢你花时间阅读它。能为您写作是我的荣幸。无论你的JavaScript之旅将你带向何方，我都希望它充满了优美、事件驱动的代码。\n"
