- img_proc: true
  md: "+   - The task array is static. Once you've called async.series or async.parallel,\
    \ you can't add or remove tasks.\n- There's also no way to ask, \"How many tasks\
    \ have been completed?\" It's a black box, unless you dispatch updates from the\
    \ tasks themselves.\n- You're limited to either no concurrency or unlimited concurrency.\
    \ That's a pretty big deal when it comes to file I/O. If we're operating on thousands\
    \ of files, we don't want to be inefficient by doing a series, but we're likely\
    \ to anger the OS if we try to do everything in parallel.\n\nAsync.js provides\
    \ a versatile method that addresses every one of these issues: async.queue.\n\n\
    # Understanding the Queue\n\nThe basic concept underlying async.queue is reminiscent\
    \ of a DMV; it can handle multiple people simultaneously (up to the number of\
    \ clerks on duty), but rather than have a separate line for each clerk, it has\
    \ a single stack of numbers. When you arrive, you get a number. As each clerk\
    \ becomes free, the clerk calls the next number.\n\nasync.queue's interface is\
    \ a bit more complex than that of async.series and async.parallel. It takes a\
    \ function called the worker (rather than an array of functions) and a concurrency\
    \ value (the maximum number of simultaneous tasks the worker can process). Then\
    \ it returns a queue that we can push arbitrary task data onto (along with an\
    \ optional callback).\n\nHere's a trivial example:\n\n```\nAsyncjs/simpleQueue.js\n\
    var async = require('async');\n\nfunction worker(data, callback) {\n  console.log(data);\n\
    \  callback();\n}\nvar concurrency = 2;\nvar queue = async.queue(worker, concurrency);\n\
    queue.push(1);\nqueue.push(2);\nqueue.push(3);\n```\n\nNo matter what the concurrency\
    \ is (as long as it's at least 1), we get the following output:\n\n```\n1\n2\n\
    3\n```"
  merge: -1
  pgno: 69
- img_proc: true
  md: "There is a difference under the hood, though: with concurrency of 2, we need\
    \ two trips to the event queue. If it were 1, we'd need three trips, one for each\
    \ line. And if it were 3 or more, we'd need just one trip.\n\nA queue with concurrency\
    \ of 0 will do nothing. And if you want maximum concurrency, just use Infinity.\n\
    \n# Pushing Tasks\n\nAlthough queue.push shares the same name as [].push, there\
    \ are two critical differences.\n\nFirst,\n\n```\nqueue.push([1, 2, 3]);\n```\n\
    \nis equivalent to the following:\n\n```\nqueue.push(1);\nqueue.push(2);\nqueue.push(3);\n\
    ```\n\nThis means you can't use arrays directly as task data. You can, however,\
    \ use anything else—even functions. In fact, if you want to use an array of functions\
    \ like you would with async.series or async.parallel, all you need to do is define\
    \ a worker that passes its second argument to its first.\n\n```\nfunction worker(task,\
    \ callback) {\n  task(callback);\n}\nvar concurrency = 2;\nvar queue = async.queue(worker,\
    \ concurrency);\nqueue.push(tasks);\n```\n\nSecond, you can provide a callback\
    \ function along with each push; if you do, it's given directly to the worker\
    \ function as the callback argument. So, for instance,\n\n```\nqueue.push([1,\
    \ 2, 3], function(err, result) {\n  console.log('Task complete!');\n});\n```\n\
    \nwill (assuming that the worker runs its callback) emit the output Task complete!\
    \ three times. push callbacks are invaluable because async.queue, unlike async.series/async.parallel,\
    \ doesn't store results internally. If you want them, you'll have to capture them\
    \ yourself."
  merge: -1
  pgno: 70
- img_proc: true
  md: "# Handling Completion\n\nAs with `async.series` and its ilk, we can give `async.queue`\
    \ a completion handler. Instead of passing it as an argument, though, we need\
    \ to attach it as a property called `drain`. (Picture a tub full of incomplete\
    \ tasks; when the last one has gone down the drain, the callback fires.) Here’s\
    \ a demonstration with timers:\n\n```\nAsyncjs/queueTimers.js\nvar async = require('async');\n\
    \nfunction worker(data, callback) {\n  setTimeout(callback, data);\n}\nvar concurrency\
    \ = 2;\nvar queue = async.queue(worker, concurrency);\nvar start = new Date;\n\
    queue.drain = function() {\n  console.log('Completed in ' + (new Date - start)\
    \ + 'ms');\n};\n\nqueue.push([100, 300, 200]);\n```\n\nRecall that `async.series`\
    \ took ~600ms to get through these timeouts (the sum), while `async.parallel`\
    \ took only ~300ms (the max). Here, concurrency is 2, so initially, the first\
    \ two timeouts will run in parallel. But when the 100ms timeout finishes, the\
    \ next task on the queue (the 200ms timeout) will immediately start. So, in this\
    \ case, `async.queue` will finish at about the same time as `async.parallel`.\
    \ The order matters: if 300 were the third timeout, the queue would take ~400ms\
    \ to complete.\n\nNote that we can always push more tasks onto the queue, and\
    \ `drain` will fire *every time* the last task on the queue has finished. Unfortunately,\
    \ this means that `async.queue` can’t give us neatly ordered results the way `async.waterfall`\
    \ could. If we want to collect data from our queued tasks, we’re on our own.\n\
    \n# Advanced Queue Callbacks\n\nAlthough `drain` is usually the only handler you’ll\
    \ need, `async.queue` provides a few other events.\n\n+   - When the last task\
    \ has started running, the queue calls `empty`. (When the task finishes, the queue\
    \ calls `drain`.)\n- When the concurrency limit is reached, the queue calls `saturated`.\n\
    - If you provide a function as the second argument in a `push`, it’ll be called\
    \ when the given task (or each task in the given array) is finished."
