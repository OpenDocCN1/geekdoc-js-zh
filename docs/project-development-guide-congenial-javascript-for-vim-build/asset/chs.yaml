  \ 目录，如果它不存在，或者它的任何父目录不存在，则创建它们。\n5. 在此目录下为你第 #1 步创建的 `congenial-JavaScript` 目录创建一个符号链接（即快捷方式）。使用命令：\n\
  ```bash\nln -s ~/congenial-JavaScript congenial-JavaScript\n```\n6. 现在在 `~/.vim/after/ftplugin/javascript/`\
  \ 中创建一个名为 `plugins.vim` 的文件。该文件用于激活 JavaScript 文件的插件。插件应像步骤 #8 那样在 `plugins.vim`\
