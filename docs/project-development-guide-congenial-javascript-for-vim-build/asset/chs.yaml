  \n让我们开始开发吧！\n\n## 第 3 章 – 软件编程\n在本章中，我们将涵盖 VimScript 的基础，然后是软件的实际编程，最后是测试。“写入/测试”循环将针对每个功能重复，直到涵盖了满意数量的功能。为了表达我的观点，我们保持了代码部分的简练，如果你遇到任何问题，请考虑增加对\
  \ VimScript 的接触。\n\n### VimScript 基础\n在下面的列表中描述了 VimScript 的基本功能，这并不是教程。任何具有某些编程经验的人应该理解这些。\n\
  \n1. `so` 关键字是 `source` 的缩写，它实际上是将一个脚本导入另一个脚本中，但这个定义并不是字面上的。VimScript 中的导入工作有所不同。\n\
  2. `nnoremap` 关键字告诉 Vim 在普通模式（Normal-mode）下在键序列和命令之间建立联系。\n3. `inoremap` 关键字告诉 Vim\
  \ 在插入模式（Insert-mode）下在键序列和命令之间建立联系。\n4. `function!` 关键字用于开始编写函数，`endfunction` 关键字用于结束它。\n\
  \n\n\n\n## Vim 关键字\n\n5. `echo` 关键字用于向 Vim 记录内容。\n\n6. `let` 关键字用于声明和重新赋值变量。\n\n\
  7. `call` 关键字用于调用函数。\n\n8. 函数声明末尾的 `abort` 关键字用于在发生错误时终止函数的执行过程。\n\n9. 需要时会提供进一步的解释，但仅是简要的。关于\
  \ Vim 和 VimScript 使用的完整指南，请参考以下书籍。\n\n*Simply Vim : A Comprehensive Guide to Mastering\
  \ the Vim text-editor* – Ray Voice\n\n## 在 JavaScript 中生成变量程序\n\n在 JavaScript 中，我们有\
  \ 3 种基础变量，它们通过 `var` | `let` | `const` 关键字声明。变量控制着访问范围和值的可变性，但在这里这些都不重要！我们只需要编写代码即可。每个模块将经过“编写/测试”循环，然后进行解释。\n\
  \n### 编写 (Write)\n\n按照以下步骤编写第一个功能：\n\n1. 在 `congenial-JavaScript.vim` 中添加以下代码并保存：\n\
  \n```bash\nso ~/.vim/after/ftplugin/javascript/congenial-JavaScript/modules/sourceCodeGenerator.vim\n\
  ```\n\n2. 为你的 `congenial-JavaScript.vim` 文件也添加以下代码：\n\n```vim\nnnoremap ,var :call\
  \ GenerateVariableWithScope()<cr>\n```\n\n3. 向你的 `modules/sourceCodeGenerator.vim`\
  \ 文件添加以下代码：\n\n```vim\n\" The program congenial-JavaScript was originally developed\
  \ by RayVoice “GitHub/Ray6464” “@rayshorthead” “rayvanet@gmail.com” on MIT License\n\
  function ! AddToDoc(dataToAdd) abort\n    execute 'normal i' .a:dataToAdd\nendfunction\n\
  \nfunction ! GenerateVariableWithScope() abort\n    let sSel = input( 'var/let/const\
  \ Pick 1/2/3: ' )\n    let sOps = [ 'var' , 'let' , 'const' ]\n    let sStd = sOps[sSel-1]\n\
  \n    let vName = input( 'Name of Variable: ' )\n    let vVal = input( 'Value of\
  \ Variable: ' )\n\n    call AddToDoc(sStd. ' ' .vName. ' = ' .vVal. ';' )\nendfunction\n\
  ```\n\n4. 在此代码中，我们使用了缩写以适应页面，但为了避免混淆，我建议你反转缩写，例如不要写“sSel”而写“scopeScelection”。以下是缩写列表：\n\
  \n    1. `sOps` = `scopeOptions`\n    2. `sStd` = `scopeSelected`\n    3. `vName`\
  \ = `variableName` 或 `varName`\n    4. `vVal` = `variableValue` 或 `varValue`\n\n\
  5. 记住，代码的可读性非常重要，确保你的代码像故事一样易读。在后面的章节中，我将向你展示如何编写像故事一样清晰易读的代码。\n\n6. 现在保存两个文件后，创建一个名为“something.js”的文件。在\
  \ Vim 中你可以使用 `:e something.js`。\n\n7. 现在在 `something.js` 的普通模式下使用 `,var `，Vim 几乎会立即询问以下问题：\n\
  \n    1. 范围 (Scope)\n    2. 名字 (Name)\n    3. 值 (Value)\n\n8. 给范围赋值：`1`\n9. 给名字赋值：`health`\n\
  10. 给值赋值：`100`\n\n11. 现在你应该会看到：\n\n```javascript\nvar health = 100;\n```\n\n12.\
  \ 如果一切运行正常，那么恭喜你；如果没有，请调试你的代码。VimScript 非常容易调试，可以在网上找到帮助，你也可以在 GitHub 的 `Ray6464/congenial-JavaScript`\
  \ 上提交 issue。\n\n### 测试与调试 (Test and Debug AddToDoc)\n\n以下指令将教你如何测试上一节第 #3 步所示的 `AddToDoc()`\
  \ 函数。\n\n1. 在你的 `modules` 目录下创建一个名为 `tests.vim` 文件。\n\n2. 在 `congenial-JavaScript.vim`\
  \ 中添加以下代码并保存：\n\n```bash\nso ~/.vim/after/ftplugin/javascript/congenial-JavaScript/modules/tests.vim\n\
  ```\n\n3. 在 `tests.vim` 文件中添加以下代码：\n\n```vim\nfunction ! Report(functionName) abort\n\
  \    echo \"Report: The Function [\" . a:functionName . \"] is working.     (PASS)\"\
  \nendfunction\n\nfunction ! Error(functionName) abort\n    echo \"Error: The Function\
  \ [\" . a:functionName. \"] is not working.  (FAIL)\"\nendfunction\n\nfunction !\
  \ ClearFile() abort\n    execute 'normal ggdG'\nendfunction\n\nfunction ! TestAddToDoc()\
  \ abort\n    let testName = \"AddToDoc\" ;\n    call AddToDoc( \"Hello World\" )\n\
  \    if getline ( \"1\" ) == \"Hello World\"\n        call Report(testName)\n  \
  \  else\n        call Error(testName)\n    endif\nendfunction\n\nfunction ! TestStart()\
  \ abort\n    call AddToDoc()\n    call ClearFile()\nendfunction\n```\n\n4. `tests.vim`\
  \ 文件能够调用 `sourceCodeGenerator.vim` 文件中的函数，是因为它们都被 `congenial-JavaScript.vim` 文件激活了，而后者是由\
  \ `plugins.vim` 文件激活的，而后者由于位于 `~/.vim/after/ftplugin/javascript/` 目录，在打开 JavaScript\
  \ 文件时会被激活。这虽然复杂，但它是我们最好的方法了！\n\n## 解释编写过程 (Explaining Write)\n\n1. `congenial-JavaScript.vim`\
  \ 文件导入了 `sourceCodeGenerator.vim` 脚本。\n2. `,var` 键绑定调用了 `GenerateVariableWithScope()`。\n\
  3. 在 `sourceCodeGenerator.vim` 文件中：\n    - `AddToDoc(dataToAdd)` 使用 `normal i` 插入文本。\n\
