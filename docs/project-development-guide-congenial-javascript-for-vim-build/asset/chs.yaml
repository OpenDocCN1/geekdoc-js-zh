- "# 项目开发指南：Vim 的 Congenial JavaScript：通过这份开发 Vim 编辑器 Congenial-JavaScript 插件的全面指南，构建你的作品集\n\
  \n\n\n![](img/Image00000.jpg)\n\n\n通过这份全面的指南，为 Vim 文本编辑器开发 Congenial-JavaScript\
  \ 插件并构建你的作品集。\n\n**前提条件：** Vim 和 JavaScript 基础知识\nProjectRay Voice\n\n\n\n\n\n\n\
  ## 引言\n本书是开发著名的 Vim Congenial-JavaScript 插件的全面指南。本书引导读者通过六个全面而简洁的步骤来开发和展示你的软件，从开发程序背后的初始想法，直到最后的发布和未来的开发阶段。书中包含了以下开发步骤：\n\
  \n1. 初始想法的开发。\n2. 项目启动，包括团队成员角色初始化。\n3. 软件编程与编码，包括通过构建自定义测试框架为 Vim 编写单元测试。\n4. 编写文档。\n\
  5. 使插件适合你的作品集。重点关注优雅编程的 3R（可读性、可重用性和重构）。\n6. 最终发布，包括将你的工作提交给他人（包括潜在雇主）进行同行评审。\n\n\
  \n\n\n本书采用了非常简洁且直接的方式呈现，即使是极微小的细节也提供了详细的步骤和解释。我的意图是不遗漏任何细节；因此，从编写第一行代码到`Refactoring`（重构）和`Rewriting`重写），一切都将以易于阅读的方式进行详细记录。一旦你开发了项目，甚至可以将其放入你的作品集中。原始项目采用\
  \ `MIT Licensed` 许可；请在源代码中为原作者（`Ray Voice`）注明，即“公开归属”。本书从单兵程序员/项目经理的角度编写，因此易于独自阅读，并能让你为加入更大的团队做做好准备。\n\
  \n### 前提条件\n要阅读这本书，你只需要了解以下内容：\n\n1. `Vim` 基础，例如什么是`Normal Mode`（普通模式）、`Insert Mode`（插入模式）等。\
  \ `VimScript`/`VimL` 也值得了解。\n2. `JavaScript` 基础。我们在本书中没有使用任何 `JavaScript`，但我们正在开发一个为\
  \ `JavaScript` 编码提供辅助工具。\n3. 编程基础。你需要了解`variables`（变量）、`functions`（函数）、`importing`（导入）等知识。如果你了解\
  \ `JavaScript`，这应该是轻而易举的。\n\n你可以通过阅读以下书籍获得所有前提条件，但如果你知道自己在做什么，则不需要阅读它们：\n* `Simply\
  \ Vim : A Comprehensive Guide to Mastering the Vim text-editor` – `Ray Voice`\n\
  * `Simply Web Development : An introduction to the world of Web development` – `Anna\
  \ Voice` and `Ray Voice`\n* `Simply ES6 : Mastering JavaScript and ES6 to its fullest`\
  \ – `Ray Voice` and `Anna`（针对高级 JavaScript）\n\n### 关于作者\n![](img/Image00002.jpg)\n\
  `Ray Voice` 是一位数学家、计算机研究员、软件开发者、连续创业者和畅销作家。他是“Ray & A Group Solutions”的 MD 和 CEO，这是一家位于亚洲的技术咨询公司，客户遍布全球。他还是“Technology\
  \ Application, Research, and Development Initiative Stratagem”（简称“TARDIS”）的创始人兼董事，这是一个命名巧妙的研发机构，其主要目的是通过开发未来的技术让世界变得更好。其成员来自各行各业。他们完成的大部分工作都是开源的，并使用\
  \ `MIT` 和 `BSD` 许可。研发运营的大部分资金来自举办研讨和工作坊。\nTwitter: @RayShortHead\n\n#### 作者感谢\n\
  以下人员参与了本书的开发，没有他们，这本书将无法完成。\n* `Anna Voice`（编辑）\n* `Siena Dahl-Joy`（贡献者）\n* `Ospan\
  \ Ali`（素材图片）\n向他们所有人表示感谢。\n\n## 第 1 章 - 初始想法的开发\n在本章中，我们将开始处理项目的初始想法。我们将回顾开发过程，然后直接进入原型设计和概念验证开发等方面，最后进行一些市场测试。\n\
  \n### 开发流程\n情况是这样的，我相信一旦有了初始想法和`Team of Developers`（开发团队），影响项目最终成功的因素就是流程！因此，在急于推进开发之前，确保流程是正确的至关重要。小型且精益的初创公司其优势在于为每个项目使用独特的开发流程，如果项目负责人清楚自己在做什么，这对项目会非常有益处。然而，这种模型在大多数情况下并不具有可扩展性，最好使用如\
  \ `Kanban`（看板）或 `Scrum` 等敏捷方法。本项目的开发流程将保持足够精简，以便一个人就能执行。流程如下：\n\n1. 以简洁直观的方式在没有外部帮助的情况下写下一个\
  \ `General Idea`（通用想法）。\n2. 为项目列出需求及其时间表。这类文档通常提供给你的财务资助者或负责项目库存/账户管理的人。这必须准确完成，因为这将用于为你的初创公司/公司绘制跑道时间线。一个具有\
  \ IT 经验的专业会计师可以为你节省大量资金。\n3. 构建一个 `Mock`（原型）和一个 `Proof-of-Concept`（概念验证）以与其他团队成员共享，通常由构思该程序的开发者在几乎或完全没有外部帮助的情况下构建。\n\
  4. 与团队成员和一些外部人员对 `Proof-of-concept` 进行内部市场测试。这是一个非常关键的时期，因为它可能为未来的许多工作奠定基调。\n5.\
  \ 较大的项目会建立如 `SCRUM` 的项目管理系统，而对于像这样的小型项目，一个人就可以微管理几个开发者。\n6. 启动项目并与所有团队成员共享 `Repository`（仓库）。在我的项目中，我强制每个人使用分级管理系统，他们只能将代码提交到自己的\
  \ `Repo` 中，并且只能与主管的 `repo` 合并。每个人在将其合并到原始 `Repo` 之前都会彻底审查其下属的工作。\n7. 团队成员之间举行简报会议以分配任务。在这部分，我与团队一起开发和审查\
  \ `Kanban boards`（看板）。这也可以作为 `SCRUM` 的一部分完成。\n8. 开始开发的实际编程阶段。\n9. 完成最后的调整，包括 Beta\
  \ 测试。\n10. 将项目推送到 `master repo`（主仓库），并作为以下形式之一分发给用户：\n    1. 更新他们现有的软件。\n    2.\
  \ 升级到他们当前的版本。\n    3. 滚动发布（Rolling release），类似于更新。\n    4. 实时版本（Live version），意味着用户始终使用最新版本。\n\
  11. 通常会举办发布派对或仪式。\n\n如果这些步骤让你感到压力很大，完全不用担心！我们不会执行像第 10 步那样的步骤，我也绝不会为你举办派对！\n\n###\
  \ 初始想法\n每个项目都有灵感，开发者总是在试图满足某种需求，或者试图填补某种空白。Congenial-coding 实践源于以下需求：\n\n1. 我患有腕管综合症！我不能打太多字，所以我依靠听写、语音转文字程序以及像\
  \ `Emmett-vim` 这样的程序来帮助我编码。\n2. 我使用许多语言编程，我担任了很长时间 `Forensic Programmer`（取证程序员），所以忘记编程语言的语法是我生活中的大罪，但它仍然时时发生。\n\
  \n### 取证编程\n我将自己描述为 `Forensic Programmer`，作为一名 `Forensic Programmer`，我诊断软件、源代码、UI/UX\
  \ 等问题并修复它们；确保它们不会以不可预测的方式再次发生。初始想法类似于漏洞赏，事实上，寻找漏洞是工作的一部分，但取证编程更广泛且目标不同。作为 `Forensic\
  \ Programmer`，我使用过许多编程语言、库和框架、编辑器、人员等，包括但不限于：\n\n1. `JavaScript`\n2. `TypeScript`\n\
  3. `ReactJS` 和 `React-Native`\n4. `C`、`C++`、`C#`、`Go` 和 `OpenCL`\n5. `Lua`\n6. `Common\
  \ Lisp`\n7. `Java`、`Kotlin` 和 `Scala`\n8. `FORTRAN`、`Alef` 和 `Limbo`（有一次）\n9. `Python`\n\
  10. `MATLAB`、`Octave`、`BRL-CAD` 等。\n11. `Sh/BASH Shell`、`BASIC` 和 `DOS batch`\n\
  12. `Haskell`\n13. `Curl`\n14. `Swift`\n15. `Rust`\n16. `AWK`\n17. 用于 `Flutter`\
  \ 的 `Dart`\n18. `PHP` 和 `SQL`\n19. `Ruby`\n20. `Perl`\n21. `Zig` 和 `Racket`\n22.\
  \ `BrainFuck` 和 `Shakespeare`（趣味）\n\n### 总大纲\n所以，我需要一个具有以下功能的程序：\n\n1. 它允许我用最少的打字量编写数百行代码。\n\
  2. 它应该帮助处理语言的语法。\n\n\n\n\n\n### 3. 它应该足够直观，这样我不会忘记如何使用它，否则还有意义呢！\n\n#### 开发特性\n\
  程序还需要一些“静默”功能，即开发特性。\n\n1. 它需要易于适配到 `JavaScript` 以外的语言，以便我可以将其移植到其他语言。\n2. 它在所有语言中应该保持一致，例如，声明变量的命令在\
  \ `JavaScript` 和 `C` 语言中应该是相同的，但它们的输出显然会不同。\n3. 它需要极快的速度；任何减慢 `Vim` 速度的插件都是不值得的。\n\
  \n#### 项目需求原型\n我将在没有太多外部帮助的情况下开发这个项目；然而，我仍然会向你展示是如何做的，这样你至少对公司是如何运作有一个基本的了解。在开发开始之前，我们需要为开发阶段准备预算，财务部门的人员审核预算，然后项目经理拥有完全的控制权！\n\
  \n虽然通常情况下并非如此，但我合作过财务部门从不放弃预算控制权的团队，这反过来在很大程度上损害了项目；对某人最糟糕的事情之一就是赋予他们责任，却实际上没有赋予他们执行该责任的权力。\n\
  \n#####我们的项目需求（抽象）\n让我们列出开发这个项目所需的物品清单。\n\n1. 我们需要一些能编写 `VimScript` 代码的人。\n2. 我们需要有人使用\
  \ `VimScript`、`Python` 等编写单元测试并生成开发报告。\n3. 我们需要有人来编写文档，这需要一套独立的技能组合。程序员编写的文档会让读者想自杀。\n\
  4. 我们需要一些人对我们的软件进行 Beta 测试。\n5. 我们假设我们有空间和设备来开发这个项目。\n\n##### 我们的项目需求（正式）\n虽然我们有初始需求列表，但我们不能向财务部门发送像上面那粗略列表，他们需要清晰的指南来计算预算。我们需要制定一份正式列表，描述我们要求的劳动力和预算的精确质量和数量。以下是列表更正式的版本：\n\
  \n1. `VimScript` 程序员 x 2-4 名。\n2. 具有编写单元测试经验的 `VimScript` 程序员。\n3. 具有编写文档经验的程序员。\n\
  4. 用于中立焦点小组的预算。\n5. 200 美元的开发期间预算，用于额外薪资、零用金、设备维护等。\n\n现在这是一份很好的正式文档了！虽然第 5 点会激怒某些人。正式文档看起来像下面：![](img/Image00003.jpg)\n\
  \n注意：这只是一个模拟文档。一旦交付此文档，通常会有一些谈判，然而，项目经理不能做出任何他们无法实现的陈述，并且在合理请求面前绝不让步。记住，在低预算上设定不可能实现的目标对项目非常有害，并且对与该项目相关的人员声誉产生极大危害。\n\
  \n#### 缩减需求\n有时我们没有足够的资源或预算来大规模开发项目，如果出现这种情况，我们可以采取采取以下方法：\n\n##### 精益创业者方法\n1.\
  \ 不再使用多个程序员和专门编写单元测试的程序员，而是雇佣一个小双人来完成工作并互相测试对方的工作。这在大型项目中可能是灾难性的。外包一些内容也是明智的。\n\
  2. 将文档编写者的角色交给一个低薪的`实习生`。\n3. 不要预订焦点小组，而是使用来自所谓“朋友和家人”的有机反馈。\n\n##### 穷困创业者方法\n\
  1. 手动（DIY）编写程序的一部分，包括单元测试，将其余部分放在 `GitHub`、`GitLab`、`BitBucket` 等平台上供他人贡献。\n2. 你自己编写部分文档，将其余放在\
  \ `GitHub` 上供他人贡献。\n3. 在线与他人分享程序；通过这种方式你可以获得一些非常棒（伤人的）的反馈。只需保持开放的心态和钢铁般的神经。\n\n\
  #### 概念验证与 Beta 测试\n我将担任你的项目经理，并已为你编写了一个概念验证代码。代码如下，将其放入你的 `.vimrc` 文件中，你就可以自己测试概念验证了：\n\
  \n```vim\n“ start of the proof-of-concept code\nfunction ! Append (dataToAppend)\
  \ abort\n    execute 'normal i' .a:dataToAppend\nendfunction\n\nfunction ! GenerateVariable\
  \ () abort\n    let scope = input ( 'var/let/const Pick 1/2/3: ' )\n    let scopeOptions\
  \ = [ 'var' , 'let' , 'const' ]\n    let scopeRes = scopeOptions [ scope -1]\n\n\
  \    let name = input ( 'Name of Variable: ' )\n    let value = input ( 'Value of\
  \ Variable: ' )\n\n    call Append ( scopeRes . ' ' . name . ' = ' . value . ';'\
  \ )\nendfunction\n\nnnoremap ,var :call GenerateVariable ()<cr>\n“ end of code\n\
  ```\n\n注意：目前你不需要知道这段 `VimScript` 代码的作用，基础的 `VimScript` 知识（如创建变量和函数）将在本书稍后的阶段解释。警告：不要复制/粘贴代码，要手动输入。在将此代码添加到你的\
  \ `.vimrc` 文件并调试任何安装问题（如果有）之后，我们可以按照以下步骤测试概念验证：\n\n1. 确保你添加到 `.vimrc` 文件的代码是正确的。Windows\
  \ 用户可以使用 `:echo $HOME ` 来找到他们的主目录。\n2. 在终端中使用 `vim ` 打开一个新文件。\n3. 进入新文件后，在普通模式下使用\
  \ `,var ` 查看魔法。该命令用于在 JavaScript 中声明变量并控制其作用域。\n4. 系统将询问变量的“作用域”，你可以输入 1、2 或 3 分别\
  \ `var`、`let` 或 `const`，然后按回车。第一次测试，输入 1 然后按回车。\n5. 系统将询问变量的“名称”。给它命名，然后按回车。第一次测试将变量命名为“player1Health”然后按回车。\n\
  6. 最后，系统将询问变量值，你可以传递 1、200、31、true、false、“JavaScript”、“Hello World”等值。字符串需要引号。第一次测试，输入\
  \ 100 作为值然后按回车。\n7. 如果你操作得当，你应该会在你的文档中看到以下内容：\n\n```\nvar player1Health = 100;\n\
  ```\n8. 如果你看到了，恭喜你刚刚筛选了程序背后的初始概念。\n9. 现在你应该把程序发给其他人测试。在继续之前，解决概念上的任何问题。\n10. 现在你需要开发一个真正有用且可以分发的程序版本。\n\
  11. 在继续之前，从你的 `.vimrc` 文件中移除概念验证代码。\n\n#### 设置项目管理系统\n对于这个项目，我为你提供了一个简单的项目管理系统来处理项目。该系统由\
  \ 5 个步骤组成：\n\n1. B acklog（待办列表）\n2. W rite（编写）\n3. T est and Debug（测试与调试）\n4. Problem（问题）\n\
  5. D one（完成）\n\n\n\n\n它在看板板（Kanban Board）上应该是这样的：![](img/Image00004.jpg) 我会给你一个待实现的功能待办列表（backlog），这些功能将以卡片/故事的形式给出。例如，它在看板板上看起来如下：![](img/Image00005.jpg)\n\
  \n在“写入”（Write）步骤，你将从待办事项列表中选取一个模块/功能卡片，将其从“待办事项”列移动到“写入”列，并对其进行编码。假设你选择了“功能 A”，看板板将如下所示：![](img/Image00006.jpg)\n\
  \n在“测试”（Test）步骤，你将从“写入”列中选取一个功能卡片并将其置于“测试与调试”（Test and Debug）列，对该功能进行测试，并在时对代码进行调试。如果你选择了“功能\
  \ A”，那么看板将如下所示：![](img/Image00007.jpg)\n\n当你完成“功能 A”的开发后，你将它的卡片移动到“完成”（Done）列，然后你就有了一些个人带宽来开始处理待办列表中的另一个功能。“问题”（Problem）列用于存放不属于任何其他列的内容，如有需要，可以在那里留下一片备注。\n\
  \n使用看板方法，你可以为每个团队/成员分配一个单一列进行工作，这也称为垂直分配（Vertical assignment）；或者你可以将单个功能分配给一个团队/成员，由他/她带它通过每一个列，直到进入“完成”列，这称为水平分配（horizontal\
  \ assignment）。每个团队都有自己的分配任务和自己的子看板板。\n\n我项目中的层次结构使用了一套术语：中心看板被称为“源板”（Origin-Board），子看板被称为“宏观板”（Macro-Boards），子子板被称为“中级板”（Meso-Boards），子子子子板被称为“微观板”（Micro-Boards）。不过，这显然是造出来的术语！这种想法是为了维护上级看板的优越性，因此中级板永远不会与微观板不同步。我做这一切是因为我不喜欢别人碰我的源板，随你怎么想吧！\n\
  \n书末提供了这种看板板的模板，你可以将其打印出来自己使用。你也可以使用像 Task Warrior 这样的程序进行单人、单调的项目管理。\n\n## 模块\n\
  以下是我们正在处理的模块列表：\n\n1. `congenial-JavaScript.vim` (黄色)\n2. `modules/sourceCodeGenerator.vim`\
  \ (绿色)\n3. `docs/outline.txt` (蓝色)\n\n每个模块都可以分配一种卡片颜色，然后待办事项列表就可以填充将在这些模块中实现的功能。我已经为你创建了以下待办事项；我们将在下一章之后开始工作。![](img/Image0008.jpg)\n\
  \n## 第 2 章 - 项目启动\n在本章中，我们将初始化项目的源仓库（Repository），与所有成员共享仓库，然后与我们的共同开发者分配任务。\n\n\
  如果你愿意，可以使用 Git 初始化你的项目，虽然这不是强制要求的。你可以使用 Git 或任何其他版本控制系统；强烈建议使用版本控制系统，除非你熟悉它们，否则不要使用。这里没有提供版本控制的说明，因此不会给出检出（check-out）、合并（merge）、推送（push）等步骤，你需要自己处理版本控制，如果你不知道怎么做就暂时避免，这是一个小型项目。没有提供创建\
  \ `contributors.md`、`LICENSE`、`README.md` 等文件的说明，因为它们在个人项目中不是必须的，但如果你把项目放在 GitHub\
  \ 上，你可以提供这些文件。\n\n### 初始化项目\n以下是我们初始化项目将采取的步骤：\n\n1. 在你的 `HOME` 目录下创建一个名为 `congenial-JavaScript`\
  \ 的目录。\n2. 在 `congenial-JavaScript` 内部创建以下目录：\n    - `docs`\n    - `modules`\n3.\
  \ 在 `congenial-JavaScript` 内部创建以下文件：\n    - `congenial-JavaScript.vim`\n    - `docs/outline.txt`\n\
