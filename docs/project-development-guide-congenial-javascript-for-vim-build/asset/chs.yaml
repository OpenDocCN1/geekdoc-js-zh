  \ 函数式编程代码\n\n函数式编程是一种编写优于 OOP（并非总是如此）而且更整洁的代码方式。当需要函数式编程时，我们应该强调：\n\n\n\n\n\n###\
  \ 1. 编写高阶函数。\n\n1. 顺便一下，不要修改任何数据。\n\n2. 使用如 `filter`、`map` 等方法，这些方法作用于数据并返回修改后的数据版本，而不修改原始数据。\n\
  \nJavaScript 有一些内置方法，如 `map()`、`filter()` 等，但我仍然倾向于使用后文描述的一些自定义高阶函数。在以函数式编程范式编写代码时，我们必须遵循以下规则：\n\
  \n- 函数不能受程序状态的影响。\n- 函数不应影响程序状态。\n- 函数必须用于将程序拆分为较小的、可测试的部分。\n- 函数可以被视为一等公民，这基本上意味着它们像任何其他数据一样，拥有具体的名称，可以作为参数传递，可以从其他函数返回等。\n\
  - 函数不能从用户那里获取输入。\n\n凭借对 Common Lisp 和 Wolfram 的丰富学习经验，我倾向于在 JavaScript 中采用函数式编程。让我们开始构建一些用于动态样板代码的生成器（Generators）。以下是针对函数式编程人士的简要术语。\n\
  \n1. 隔离函数 - 不依赖于程序状态（包括可能发生变化的全局变量）。\n2. 纯函数 - 相同的输入始终产生相同的输出。\n3. 将函数作为参数或将函数作为返回值的函数称为高阶函数（Higher\
  \ Order Functions）。\n4. 当函数传递到另一个函数或从另一个函数返回时，这些传入或返回的函数被称为 lambda。\n5. 函数不能有依赖，如果需要依赖，则必须作为参数传递，始终显式声明你的依赖。\n\
  \n以下是给函数式编程新手的的一些简易指南：\n\n1. 编写大量的函数。\n2. 永远不要在没有意图的情况下干扰变量。\n3. 尽可能使用 `const`。\n\
  4. 编写接受其他函数作为参数的函数。\n5. 编写返回其他函数的函数。\n6. 以易于测试的方式编写代码。此处的“测试”指的是单元测试和其他自动化测试方法。\n\
  7. 函数可以与构造函数一起使用类似于 `Classes`，在这种情况下，它们将被赋予一个以大字母开头的名称。\n\n以下是函数式 JavaScript 代码与普通代码的对比示例：\n\
  \n非函数式示例：\n```javascript\nlet x = 6;\nfunction double() {\n  return ++x;\n}\n```\n\
  \n函数式示例：\n```javascript\nlet x = 6;\nfunction double(input) {\n  return ++input;\n\
  }\n```\n\n以下是在 JavaScript 的 `Array` 对象中嵌入方法的示例。\n\n```javascript\nvar myArray =\
  \ [ 1 , 2 , 3 , 4 ] ;\nArray . prototype . newMap = function ( callback ){\n  let\
  \ neoArray = [] ;\n  this . forEach (( e , i ) => {\n    neoArray [ i ] = callback\
  \ ( e ) ;\n  }) ;\n  return neoArray ;\n} ;\nvar newArray = myArray . myMap ( function\
  \ ( item ){\n  return item * 2 ;\n}) ;\n```\n\n注意我们是如何使用 `this` 关键字和 `callback`\
  \ 单词的。`this` 关键字取代了 `Array`。`callback` 指要求函数作为值的参数。这种代码通常在函数式编程中使用。\n\n注意：我不建议在没有适当考虑的情况下修改\
  \ `Array` 对象。\n\n我们插件的代码编写章节到此结束，项目的官方仓库位于：https://github.com/Ray6464/congenial-JavaScript\
  \ \n\n如果你想贡献力量，请随时提交 PR（拉请求）。你可以从编写生成 `Array.forEach`、`Array.find()`、`Array.some()`、`Array.every()`、`Array.reduce()`、`Array.includes()`\
  \ 等代码开始。\n\n## 第 6 章 - 开发后工作、编写文档和提交拉请求\n\n在本章中，我们将处理项目开发中最重要的方面之一！编写文档。\n\n理想情况下，我们应该在编写文档之前对代码进行重构，但在项目中，我决定将其留给\
  \ GitHub 上的 FOSS 大军。我会进行一些重构，但其余留给在线贡献者。\n\n### 开发后工作\n\n以下是我通常执行的开发后工作列表，你在展示工作成果之前也应该执行这些。\n\
  \n#### 开发后工作示例\n\n1. 检查每个注释并判断它们是否有益处，删除任何无用的注释。\n2. 处理任何被注释掉的代码。\n3. 确保你的注释没有误导他人。\n\
  4. 确保你的代码遵循整洁代码的三个 R：可读性（Readability）、可重用性（Re-usability）和重构（Refactoring）！\n\n###\
  \ 注释重构\n\n在处理注释时，请记住这条格言：“写代码不写注释”。\n\n与其向你描述或告知，我将在我们代码的案例研究中向你展示我的意思。\n\n注意：此代码是为了教学目的而编写。警告：不要被以下快照中的行号分散注意力。\n\
  \n#### 案例 1\n\n在此例中，我们正在查看 `modules/tests.vim` 文件。\n\n代码（之前）：\n```vim\n\"----------------------\"\
  \nlet numberOfTestsPassed = 0\n\"----------------------\"\n\"----------------------\"\
  \nlet numberOfTestsFailed = 0\n\"----------------------\"\n...下方有几行...\n\"each test\
  \ is ran on a different line\n\"----------------------\"\nlet lineNumber = 1\n\"\
  ----------------------\"\n```\n\n代码（之后）：\n```vim\n\"----------------------\"\nlet\
  \ numberOfTestsPassed = 0\nlet numberOfTestsFailed = 0\nlet lineNumber = 1\n\"----------------------\"\
  \n```\n\n现在比较“之前”和“之后”快照，在“之前”快照中，我们有很多行，看起来很不方便；在“之后”快照中，我们将行数减少到了 5 行（包括美化后的注释）。\n\
  \n另一个变化是变量 `lineNumber` 的名称和行号；名称更改为 `headOverLineNumber`，其中“head”指的是解释图灵机概念的设备的“头”。这要求我们在各处更改变量名，在\
  \ Vim 中，我们可以使用 `%s/lineNumber/headOverLineNumber/g` 来执行。\n\n#### 案例 2\n\n在此例中，我们正在查看\
  \ `modules/tests.vim` 文件。\n\n代码（之前）：\n```vim\n\" lines are incremented here so the\
  \ test-head moves from line #1 -> #2, #2 -> #3, ...\nlet g :headOverLineNumber =\
  \ g :headOverLineNumber + 1\n```\n\n注意：这段代码存在于 `GenerateReport()` 和 `GenerateMultiLineReport()`\
  \ 函数中。\n\n代码（之后）：\n```vim\nfunction ! MoveHeadToNextLine() abort\n  let g :headOverLineNumber\
  \ = g :headOverLineNumber + 1\nendfunction\n```\n\n在这里，“之前”快照中的注释看起来心境很糟糕；在“之后”快照中，我们将为它提供自己的函数（如“之后”快照所示），然后用以下代码替换“之前”快照中的代码：\n\
  在 `GenerateReport()` 和 `GenerateMultiLineReport()` 函数中调用 `MoveHeadToNextLine`。\n\
  \n### 编写文档\n\n对于此项目，有两个文档文件：\n\n1. README.md（用于 GitHub 主页）\n2. docs/outline.txt（用于基础用户信息）\n\
  \n\n\n\n\n你可以在 GitHub 的 `ray6464/congenial-JavaScript` 上找到这些文件的内容。以下是 `outline.txt`\
  \ 的简要示例：\n\n### 生成动态模板的快捷键绑定\n\n| 命令 | 生成内容 (JavaScript) |\n| :--- | :--- |\n| `outline`\
  \ | 功能大纲 |\n| `var` | 变量 |\n| `label` | 标签 |\n| `loop` | 循环 |\n| `array` | 数组 |\n\
  | `log` | 标准输出，即 `console.log()` |\n| `timer` | 定时器 (`setInterval`) |\n| `split`\
  \ | `Array.split()` |\n| `map` | `Array.map()` |\n| `loarray` | 遍历数组 (`forEach`)\
  \ |\n\n`outlint.txt` 文件的目的是作为用户的快捷键，方便他们查看当前可以使用哪些功能。\n\n## 提交拉请求 (Pull Request)\n\
  在本节中，你将学习如何从 GitHub 克隆官方 Congenial-JavaScript 项目并对其进行修改。按照以下指令，你需要一个 GitHub 账号以及具备一些\
  \ Git 的基本知识。此外，通过 GitHub 提供的 Web GUI 可以轻松创建 Pull Request，因此此处不再介绍。本说明是为 Linux 用户准备的，Windows\
  \ 和 Mac 用户可以根据自己的情况修改指令。\n\n### 安装包的步骤\n\n1. 使用 `cd ~ && git clone https://github.com/Ray6464/congenial-JavaScript`\
  \ 在你的主目录下克隆此仓库。\n2. 在终端中进入 `~/.vim/after/ftplugin/javascript/`，如果这些目录不存在，请创建它们！\n\
  3. 使用 `ln -s ~/congenial-JavaScript` 为克隆目录创建一个符号链接。\n4. 执行 `cp ~/.vim/after/ftplugin/javascript/congenial-JavaScript/modules/plugins.vim\
  \ ~/.vim/after/ftplugin/javascript/plugins.vim`。这会让插件仅在扩展名为 `.js` 的文件中生效。\n5. 现在在\
  \ Vim 中打开一个 JavaScript 文件，例如 `vim something.js` 并尝试一下效果。插件现在应该可以工作了，如果没有，请检查在你的机器上安装它的最新说明。\n\
  6. 完成第一步后，你将在主目录下拥有我我仓库的克隆。一旦你对其进行了修改，就可以将这些更改提交到 Git，然后按照以下指令将它们推送到我在 GitHub 上创建的原始仓库。理想情况下，我们将较大的提交拆分为多个较小的提交，但为了简单起见，我们在这里做一个大提交。\n\
  7. 一旦你完成了更改，通过 `git add .` 将其暂存。\n8. 现在通过 `git commit -m “编写描述你所做更改的标题” -m “编写关于你所做更改的描述”进行提交。\n\
  9. 如果你想撤销较早的提交，请使用 `git revert CommitRefNumber`。\n\n### 修改并提交拉请求的步骤\n以下是在操作 Git\
  \ 仓库时需要遵循的几条指南。\n\n1. 克隆或分支一个仓库。\n2. 对源码文件进行你需要的修改。\n3. 绝对不要对 `LICENSE` 进行任何更改。\n\
  4. 通过提交来保存你的修改。\n5. 进入 `https://github.com/Ray6464/congenial-JavaScript/pulls`。\n\
  6. 创建一个拉请求。\n\n**免责声明**：本书作者或任何其他相关人员对任何数据丢失或其他任何损失不承担责任。\n\n## 第 7 章 - 让项目作品集更具展示性\n\
  在本章中，我们将学习一些技巧来装饰项目并使其更具吸引力。本章提供了改进项目整体外观的建议。\n\n### 为你的项目添加 ASCIINEMA 演示\n这是一个非常有用的技巧，Asciinema\
  \ 是一个可以将终端会话录制为 Cast 文件的工具，而 `asciicast2gif` 是可以将这些演示转换为 GIF 图像的工具，这些图像可以包含在 `README.md`\
  \ 文件中，供潜在用户查看。Asciicast 就像视觉装饰；它们真的能让项目变得漂亮！\n\n#### 录制 ASCIICAST 并将其上传 GitHub\n\
  \n1. 你可以使用 ASCIINEMA 录制终端；查看其网站上的安装说明。\n   - 使用 `asciinema rec congenialJScast –stdin`\
  \ 开始录制终端并将数据保存为文件 `congenialJScast`。\n   - 使用 `ctrl+d` 停止录制。\n   - 使用 `asciinema\
  \ play congenialJScast` 播放演示。\n2. 安装 `asciinema/asciicast2gif`，查看其 GitHub 仓库中的安装说明，或通过\
  \ npm 使用 `npm install --global asciicast2gif` 安装。\n3. 或者，你也可以通过 `npm install -g\
  \ svg-term-cli` 安装并使用 `svg-term-cli`。\n4. 使用 `ffmpeg` 或任何其他工具进一步编辑你的 GIF 文件。\n5.\
  \ 现在将这些 GIF 文件放在项目的 `docs` 目录下，然后将它们嵌入你的 `README.md` 文件。\n\n### 其他建议\n\n1. 使用 GitHub\
  \ Pages 为你的项目网站提供免费托管。例如 `emmet.io`、`cylonjs.com` 等。\n2. 你也可以查看其他免费托管替代方案，如 Tumbler、nearlyfreespeech.net、000webhostapp、blogspot\
  \ 等。\n3. 如果你有商业项目，建议你购买 VPS（而不是 VPN），它本质上是你拥有 root 权限的专用服务器。使用“Namecheap”购买 VPS，使用“Epik”购买域名（非关联营销广告）。\n\
  4. 为你的项目填充优质文案（文案写作），你可以自己写这些文案，也可以找有文案经验的人帮你完成。\n5. 你的项目完成后，将其发送给同行评审，发布在 Reddit\
  \ 上，在 Angel-list 上找到人并向他们发送你的作品集。\n6. 确保对有用的批评采取行动，不要让批评挫灭你的斗志！寻找和接受批评的艺术是生活中最有用的技能之一。\n\
