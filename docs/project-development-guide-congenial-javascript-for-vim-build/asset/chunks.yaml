    4.  You may not be familiar with the `len()` method, and `for/in` loops of VimScript!
    See below for instructions.


    ​ The `len()` method is for getting the length of an array/list. For example:


    1.  `let myArray = [“a”, “b”, “c”] ` has 3 members.


    2.  `len(myArray) ` will return `3 `.


    ​ The `for/in` loop is for iterating over arrays/lists while the “Man of the hour”
    variable assumes the role of a single member from the array.


    1.  `let myFruits = [“apple”, “mango”, “banana”] ` has 3 members, them being “apple”,
    “mango”, and “banana”.


    2.  The `for/in` loop `for fruit in myFruits ` will iterate over each member of
    the `myFruits` array.


    3.  During each iteration the “Man of the hour” variable (which is `fruit`) will
    be equal to a member from `myFruits`.


    4.  So during the 1st iteration `fruit` will be equal to `apple`.


    5.  In the 2nd iteration `fruit` will be equal to `mango`.


    6.  Finally in the 3rd iteration `fruit` will be equal to `banana`.


