    \ Management System\nFor this project, I have given you a simple project management\
    \ system to deal with the project. The system is comprised of 5 steps:\n\n1. B\
    \ acklog\n2. W rite\n3. T est and Debug\n4. Problem\n5. D one\n"
  raw: '3.  It should be intuitive enough so I don’t forget how to use it, otherwise
    what’s the point!


    Development Features​ The program also needs some silent aka development features.


    1.  It needs to be easily adaptable to languages other than JavaScript so I can
    port it for other languages.


    2.  It should be uniform and in conduct to all languages, for example a command
    to declare a variable should be same in JavaScript and C language, but it’s output
    will obviously be different.


    3.  It needs to be blazing fast; any plugin that slows down Vim is not worth it.


    Project Requirements Mockup​ I will be developing this project without much external
    help; however, I will still show you how it’s done so you have at-least some idea
    of how a firm works.​ Before development begins we need a budget for the development
    periods, someone from the financial depart clears the budget and then the project
    manager has full control of it!Although the following is usually not the case,
    I have worked with teams where the financial department never gives up control
    of the budget, this in turn harms the project to a great extent; one of the worst
    thing you can do to someone is to give them a responsibility but don’t actually
    give them the power to carry it out.Our Project Requirements (abstract)Let’s make
    a list of things we need to develop this project.


    1.  We need some people who can code in VimScript.


    2.  We need someone to write unit tests and generate reports on development using
    VimScript, Python, etc.


    3.  We need someone to write the documentation, this requires a separate skill-set.
    Documentation’s written by programmers make readers suicidal.


    4.  We need some people to beta-test our software.


    5.  We are assuming that we have the room and equipment to develop the project.


    Our Project Requirements (Official)​ While we have our list of initial requirements,
    we can’t send a rough list like the one presented above to the financial department,
    they need clear guidelines to calculate the budget. We need to develop an official
    list that describes the precise quality and quantity of the labour and budget
    we are demanding. Following is a more formal version of the list:


    1.  VimScript coders x2-x4.


    2.  VimScript coder with experience in writing unit tests.


    3.  A coder with experience in writing documentation.


    4.  Budget for impartial focus-groups.


    5.  Intra-development budget of $200 for additional payroll, petty-cash, equipment
    maintenance, etc.


    ​ Now this is a good official document! Although the 5th point will infuriate
    some people. The official document will look something like the following:![](Image00003.jpg)Note:
    This is only a mock document.​ Once this document is delivered usually there is
    some negotiation, however a project manager mustn’t make any claims they can’t
    deliver, and should never budge on reasonable requests.​ Remember, setting improbable
    goals on low budgets is very harmful for the project, and can be very harmful
    to the reputation of people associated with that project.Scaling down the demands​
    Sometimes we don’t have all the resources or the budget to develop a project at
    large scale, if this is the case we can take the following approaches:The Lean
    Entrepreneur approach


    1.  Instead of using multiple coders and a separate coder for writing unit tests,
    we hire a small duo to do the job and test each other’s work. This can prove to
    be disastrous in large-scale projects. It’s also smart to outsource some stuff.


    2.  Give the role of documentation writer to a low-paid Intern.


    3.  Instead of booking Focus-groups use organic feedback from the figurative “friends
    and family”.


    The Broke Entrepreneur approach


