- fmt: "\n![](Image00000.jpg)\n\n# ProjectDevelopmentGuide Congenial JavaScript for\
    \ Vim\n\nBuild your portfolio with this comprehensive guide to Developing the\
    \ Congenial-JavaScript Plugin for the Vim text-editor.\n\n**Prerequisite:** Basics\
