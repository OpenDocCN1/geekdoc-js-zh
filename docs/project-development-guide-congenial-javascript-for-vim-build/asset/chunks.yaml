  trans: "\n\n![](img/Image00000.jpg)\n\n# 项目开发指南：适用于 Vim 的 Congenial JavaScript\n\
    \n通过这份全面的指南，为 Vim 文本编辑器开发 Congenial-JavaScript 插件并构建你的作品集。\n\n**前提条件：** Vim 和\
    \ JavaScript 基础知识\nProjectRay Voice\n\n## Congenial-JavaScript 项目开发指南\n由 Ray Voice\
    \ 独立出版。版权所有 © 2020 Ray Voice。保留所有权利。除美国版权法允许的条款外，未经出版者事先书面许可，不得以任何形式复制、存储在任何检索系统中或通过任何手段（电子、机械、复印、录制或其他）传输本书或其部分内容。向版权所有者请求许可的邮件请发送至作者：`rayvanet@gmail.com`。\n\
    \n**免责声明：** 本书信息在出版时是正确的，但作者对错误或遗漏造成的损失或损害不承担任何责任。作者或参与本书制作的任何人员对任何损害、责任或虚假陈述不承担责任。为了保持相关人员的匿名性，某些姓名和细节已更改。书中的某些示例场景为虚构。与实际人物（无论在世或去世）的任何相似之处均属巧合。\n\
    \n**责任限制/免责声明：** 出版者和作者对本书内容的准确性或完整性不作任何陈述或保证，并特别排除所有保证，包括但不限于对特定用途适用性的保证。销售或促销材料不得创建或扩展任何保证。此处包含的建议和策略可能不适用于所有情况。本书的销售基于以下理解：即出版者并未从事法律、工程或其他专业服务。如果需要专业协助，应寻求合格专业人士的服务。出版者和作者均不对由此产生的损害承担责任。本书中提到的任何组织或网站仅作为引用和/或进一步信息的潜在来源，并不意味着作者或出版者认可该组织或网站可能提供的信息或其可能做出的建议。此外，读者应注意，书中列出的网络网站在本书编写与阅读之间可能已经发生了变化或消失。\n\
    \n## 目录\n- 引言\n- 关于作者\n- 作者致谢\n- 第 1 章 - 初始想法的开发\n- 第 2 章 - 项目启动\n- 第 3 章 – 软件编程\n\
    - 第 4 章 – 高级功能\n- 第 5 章 - JavaScript 的函数编程代码\n- 第 6 章 - 开发后工作、文档编写和提交 Pull 请求\n\
    - 第 7 章 - 使插件更适合作品集展示\n- 看板看板\n\n## 目录\n- 引言\n- 前提条件\n- 关于作者\n- 作者致谢\n- 第 1 章\
    \ - 初始想法的开发\n    - 开发过程\n        - 初始想法\n        - 溯源编程\n        - 总体大纲\n    -\
    \ 开发特性\n        - 项目需求原型\n        - 我们的项目需求（抽象）\n        - 我们的项目需求（正式）\n     \
    \   - 缩小需求\n        - 概念验证与 Beta 测试\n        - 设置项目管理系统\n        - 模块\n- 第 2 章\
    \ - 项目启动\n    - 初始化项目\n    - 任务划分\n- 第 3 章 – 软件编程\n    - VimScript 基础\n    - 生成变量的程序\n\
    \        - 编写\n        - 测试与调试 (AddToDoc)\n        - 解释\n        - 测试与调试 (GenerateVariableWithScope)\n\
    \    - 生成标签的程序\n        - 编写\n        - 测试与调试\n    - 生成 For 循环的程序\n        - 编写\n\
    \        - 测试与调试\n    - 生成数组的程序\n        - 编写\n        - 测试与调试\n    - 生成数组方法的程序\n\
    \        - 编写\n        - 测试与调试\n    - 生成计时器的程序\n        - 编写\n        - 测试与调试\n\
    \    - 生成标准输出的程序\n        - 编写\n        - 测试与调试\n    - 生成数组遍历 (ForEach) 的程序\n\
    \        - 编写\n        - 测试与调试\n    - 注意\n- 第 4 章 – 高级功能\n    - 基础功能\n    - NodeJS\n\
    \    - 内置变量\n    - 进程\n    - 代码重构\n    - 自定义发射器 (Emitter)\n    - 使用 HTTP 创建服务器\n\
    \    - FS 模块\n    - JavaScript Require() 和 Export\n    - NodeJS 基础服务器工具\n- 第 5\
    \ 章 - JavaScript 的函数编程代码\n- 第 6 章 - 开发后工作、文档编写和提交 Pull 请求\n    - 开发后工作\n    -\
    \ 重构注释\n    - 编写文档\n    - 提交 Pull 请求\n    - 安装包的步骤\n    - 修改并提交 Pull 请求的步骤\n-\
    \ 第 7 章 - 使插件更适合作品集展示\n    - 在你的项目中添加 ASCINEMA 演示\n    - 录制 ASCIICAST 并将其放到 GitHub\n\
    \    - 其他建议\n- 看板看板\n\n## 引言\n本书是开发著名的 Vim Congenial-JavaScript 插件的全面指南。本书引导读者通过六个全面而简洁的步骤来开发和展示你的软件，从开发程序背后的初始想法，直到最后的发布和未来的开发阶段。书中包含了以下开发步骤：\n\
    \n1. 初始想法的开发。\n2. 项目启动，包括团队成员角色初始化。\n3. 软件编程与编码，包括通过构建自定义测试框架为 Vim 编写单元测试。\n4.\
    \ 编写文档。\n5. 使插件适合你的作品集。重点关注优雅编程的 3R（可读性、可重用性和重构）。\n6. 最终发布，包括将你的工作提交给他人（包括潜在雇主）进行同行评审。\n\
    \n"
- fmt: "\nA very concise and straightforward manner has been taken to present this\
    \ book, with detailed steps and explanations for even the smallest possible things.\
    \ It will be my intention to keep nothing off-screen; so nothing will happen off-screen,\
    \ from writing the first line of code to `Refactoring` and `Rewriting`, everything\
    \ will be thoroughly documented in a reader-friendly manner. Once you develop\
    \ the project, you can even use it in your portfolio. The original project is\
    \ `MIT Licensed`; please add credit aka “Public-attribution” in your source code\
    \ to the original author (`Ray Voice`). The book is written from a solo-coder/project\
    \ manager point of view, hence it will be easy to go over alone, and it will prepare\
    \ you for becoming part of a larger team.\n\n### Prerequisites\nTo go over this\
    \ book, all you need is to know is the following:\n\n1. Basics of `Vim`, like\
    \ what is `Normal Mode`, `Insert Mode`, etc. Some `VimScript`/`VimL` is also worth\
    \ knowing.\n2. Basics of `JavaScript`. We don’t use any `JavaScript` in this book\
    \ but we are developing an aid for coding in `JavaScript`.\n3. Basics of Programming.\
    \ You need to know stuff like `variables`, `functions`, `importing`, etc. If you\
    \ know `JavaScript` then this should be a breeze.\n\nYou can acquire all these\
    \ prerequisites by reading the following books, however it’s not required to read\
    \ them if you know what you are doing\n* `Simply Vim : A Comprehensive Guide to\
    \ Mastering the Vim text-editor` – `Ray Voice`\n* `Simply Web Development : An\
    \ introduction to the world of Web development` – `Anna Voice` and `Ray Voice`\n\
    * `Simply ES6 : Mastering JavaScript and ES6 to its fullest` – `Ray Voice` and\
    \ `Anna` (For Advanced JavaScript)\n\n### About Authors\n![](Image00002.jpg)\n\
    `Ray Voice` is a Mathematician, Computer Researcher, Software Developer, Serial\
    \ Entrepreneur, and Bestselling Author. He is the MD, and CEO of “Ray & A Group\
    \ Solutions”, a Technology Business Consultation firm based in Asia, with clients\
    \ all around the world. He is also the Founder and Director of “Technology Application,\
    \ Research, and Development Initiative Stratagem” aka “TARDIS”, a cleverly named\
    \ R&D facility whose primary purpose is to make the world a better place by developing\
    \ the technology of tomorrow. Members come from all walks of life. Much of the\
    \ work done by them is Open Source and uses `MIT`, and `BSD` licenses. A big chuck\
    \ of funding for their R&D operations comes from conducting training seminars\
    \ and workshops.\nTwitter: @RayShortHead\n\n### Author’s Acknowledgments\nThe\
    \ following people were involved in the development of this book, without them\
    \ this book wouldn’t have been possible.\n* `Anna Voice` (editor)\n* `Siena Dahl-Joy`\
    \ (contributor)\n* `Ospan Ali` (stock image)\nAll of them have my thanks.\n\n\
    ## Chapter 1 - Development of the Initial Idea\nIn this chapter, we will start\
    \ working on the initial idea of the project. We’ll take a walk through the development\
    \ process, then we will dive right into stuff like mock designs and proof-of-concept\
    \ development, and finally we do some market testing.\n\n#### Development Process\n\
    Here is the thing, I believe that once the initial Idea and the `Team of Developers`\
    \ is in place it’s the process that influences the ultimate success of a project!\
    \ Hence, it’s very important to get the process right before getting ahead of\
    \ the development. Small and Lean Startups have the advantage of using unique\
    \ development processes for each project, this can be really good for the project\
    \ if the person leading the project knows what they are doing. However, this model\
    \ is not really scalable in most cases, it’s better to use Agile methods like\
    \ `Kanban` or `Scrum`. The development process of this project will be kept lean\
    \ enough so one person can follow it. The process will look like the following:\n\
    \n1. A `General Idea` will be written down in a clean and straightforward manner\
    \ without external help.\n2. A collection of requirements and their timeline will\
    \ be listed for the project. This type of document is usually given to your financial\
    \ backer or whomever is in-charge of inventory/accounts management for your project.\
    \ This must be done right, since this will be use to draw up a runway timeline\
    \ for your startup/company. A trained accountant with IT experience can save you\
    \ a significant amount of cash.\n3. A `Mock` and a `Proof-of-Concept` is built\
    \ to share with other team members, usually the developer who envisioned the program\
    \ builds this with little to no external help.\n4. An internal market testing\
    \ session of the `Proof-of-concept` is done with the team members and some external\
    \ individuals. This is a very critical time as this may set up the tone for a\
    \ lot of future stuff.\n5. A project management system like `SCRUM` is set-up\
    \ for larger projects, while for smaller projects like this one a single person\
    \ can micro-manage a hand full of developers.\n6. The project is initiated and\
    \ a `Repository` is shared with all team members. In my projects, I force everyone\
    \ to use a hierarchy management system where they can only commit code to their\
    \ own `Repo`, and can only merge it with their supervisor’s `repo`. Each person\
    \ thoroughly reviews the work of their subordinates before they merge it to the\
    \ origin `Repo`.\n7. Briefings are held among the team members to divide duties.\
    \ In this part, I develop and review `Kanban boards` with my team. This can also\
    \ be done as part of `SCRUM`.\n8. The actual programming section of development\
    \ is started.\n9. Final touch-ups including beta-testing is done.\n10. The project\
    \ is pushed to the `master repo` where it’s distributed to the users as one of\
    \ the following:\n    1. Update to their already existing software.\n    2. Upgrade\
    \ to their current version.\n    3. Rolling release, which is sort of like an\
    \ update.\n    4. Live version, which means the users are always using the latest\
    \ version.\n11. A launch party or ritual is usually held.\n\nIf these steps overwhelm\
    \ you then don’t worry at all! We won’t be performing certain steps like step\
    \ #10, and I’m certainly not throwing you a party!\n\n#### Initial Idea\nEvery\
    \ project has an inspiration, there is always a need the developer is trying meet,\
    \ or a gap they are trying to fill. The Congenial-coding practices sprung out\
    \ of the following needs:\n\n1. I have carpel tunnel! I can’t type much, so I\
    \ have to rely on dictation, speech-to-text programs, and programs like `Emmett-vim`\
    \ to help me code.\n2. I code in many languages, I have worked as a `Forensic\
    \ Programmer` for a really long time, so forgetting syntax of a programming language\
    \ is a grave sin in my life, but it still happens from time to time.\n\n#### Forensic\
    \ Programming\nI describe myself as a `Forensic Programmer`, as a `Forensic Programmer`\
    \ I diagnose problems in software, source-code, UI/UX, etc. and fix them; I make\
    \ sure they don’t occur again in an unpredictable manner. The initial idea is\
    \ much like Bug Bounty hunting, in fact bug hunting is a part of the job, however\
    \ Forensic Programming is broader and has different goals. As a `Forensic Programmer`,\
    \ I have worked with many programming languages, libraries, and frameworks, editors,\
    \ people, etc. including not limited to the following:\n\n1. `JavaScript`\n2.\
    \ `TypeScript`\n3. `ReactJS` and `React-Native`\n4. `C`, `C++`, `C#`, `Go`, and\
    \ `OpenCL`\n5. `Lua`\n6. `Common Lisp`\n7. `Java`, `Kotlin`, and `Scala`\n8. `FORTRAN`,\
    \ `Alef`, and `Limbo` (one time)\n9. `Python`\n10. `MATLAB`, `Octave`, `BRL-CAD`,\
    \ etc.\n11. `Sh/BASH Shell`, `BASIC`, and `DOS batch`\n12. `Haskell`\n13. `Curl`\n\
    14. `Swift`\n15. `Rust`\n16. `AWK`\n17. `Dart` for `Flutter`\n18. `PHP` and `SQL`\n\
    19. `Ruby`\n20. `Perl`\n21. `Zig` and `Racket`\n22. `BrainFuck` and `Shakespeare`\
    \ (for fun)\n\n#### The General outline\nSo, what I needed is a program that has\
    \ the following features:\n\n1. It allows me to write hundreds of lines of code\
    \ with the least amount of typing.\n2. It should help with the syntax of the language.\n"
  raw: "​ A very concise and straightforward manner has been taken to present this\
    \ book, with detailed steps and explanations for even the smallest possible things.​\
    \ It will be my intention to keep nothing off-screen; so nothing will happen off-screen,\
    \ from writing the first line of code to Refactoring and Rewriting, everything\
    \ will be thoroughly documented in a reader-friendly manner.​ Once you develop\
    \ the project, you can even use it in your portfolio.The original project is MIT\
    \ Licensed; please add credit aka “Public-attribution” in your source code to\
    \ the original author (Ray Voice).​ The book is written from a solo-coder/project\
    \ manager point of view, hence it will be easy to go over alone, and it will prepare\
    \ you for becoming part of a larger team.Prerequisites​ To go over this book,\
    \ all you need is to know is the following:\n\n1.  Basics of Vim, like what is\
    \ Normal Mode, Insert Mode, etc. Some VimScript/VimL is also worth knowing.\n\n\
    2.  Basics of JavaScript. We don’t use any JavaScript in this book but we are\
    \ developing an aid for coding in JavaScript.\n\n3.  Basics of Programming. You\
    \ need to know stuff like variables, functions, importing, etc. If you know JavaScript\
    \ then this should be a breeze.\n\n​ You can acquire all these prerequisites by\
    \ reading the following books, however it’s not required to read them if you know\
    \ what you are doing.Simply Vim : A Comprehensive Guide to Mastering the Vim text-editor\
    \ – Ray VoiceSimply Web Development : An introduction to the world of Web development\
    \ – Anna Voice and Ray VoiceSimply ES6 : Mastering JavaScript and ES6 to its fullest\
    \ – Ray Voice and Anna (For Advanced JavaScript)About Authors![](Image00002.jpg)Ray\
    \ Voice is a Mathematician, Computer Researcher, Software Developer, Serial Entrepreneur,\
