    \ of the variable. Give it a name, then press Enter. For the first testing name\
    \ the variable “player1Health” and then press Enter.\n6. Lastly, the system will\
    \ ask you for the variable value, you can pass it a value like 1, 200, 31, true,\
    \ false, “JavaScript”, “Hello World”, etc. quotations are required for strings.\
    \ For the first testing, write 100 as the value and then press Enter.\n7. If you\
    \ did everything right you should see the following appear in your document:\n\
