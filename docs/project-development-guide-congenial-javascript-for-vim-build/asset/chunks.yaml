  trans: "\n\n你可以在 GitHub 的 `ray6464/congenial-JavaScript` 上找到这些文件的内容。以下是 `outline.txt`\
    \ 的简要示例：\n\n### 生成动态模板的快捷键绑定\n\n| 命令 | 生成内容 (JavaScript) |\n| :--- | :--- |\n\
    | `outline` | 功能大纲 |\n| `var` | 变量 |\n| `label` | 标签 |\n| `loop` | 循环 |\n| `array`\
    \ | 数组 |\n| `log` | 标准输出，即 `console.log()` |\n| `timer` | 定时器 (`setInterval`)\
    \ |\n| `split` | `Array.split()` |\n| `map` | `Array.map()` |\n| `loarray` | 遍历数组\
    \ (`forEach`) |\n\n`outlint.txt` 文件的目的是作为用户的快捷键，方便他们查看当前可以使用哪些功能。\n\n## 提交拉请求\
    \ (Pull Request)\n在本节中，你将学习如何从 GitHub 克隆官方 Congenial-JavaScript 项目并对其进行修改。按照以下指令，你需要一个\
    \ GitHub 账号以及具备一些 Git 的基本知识。此外，通过 GitHub 提供的 Web GUI 可以轻松创建 Pull Request，因此此处不再介绍。本说明是为\
    \ Linux 用户准备的，Windows 和 Mac 用户可以根据自己的情况修改指令。\n\n### 安装包的步骤\n\n1. 使用 `cd ~ && git\
    \ clone https://github.com/Ray6464/congenial-JavaScript` 在你的主目录下克隆此仓库。\n2. 在终端中进入\
    \ `~/.vim/after/ftplugin/javascript/`，如果这些目录不存在，请创建它们！\n3. 使用 `ln -s ~/congenial-JavaScript`\
    \ 为克隆目录创建一个符号链接。\n4. 执行 `cp ~/.vim/after/ftplugin/javascript/congenial-JavaScript/modules/plugins.vim\
    \ ~/.vim/after/ftplugin/javascript/plugins.vim`。这会让插件仅在扩展名为 `.js` 的文件中生效。\n5.\
    \ 现在在 Vim 中打开一个 JavaScript 文件，例如 `vim something.js` 并尝试一下效果。插件现在应该可以工作了，如果没有，请检查在你的机器上安装它的最新说明。\n\
    6. 完成第一步后，你将在主目录下拥有我我仓库的克隆。一旦你对其进行了修改，就可以将这些更改提交到 Git，然后按照以下指令将它们推送到我在 GitHub\
    \ 上创建的原始仓库。理想情况下，我们将较大的提交拆分为多个较小的提交，但为了简单起见，我们在这里做一个大提交。\n7. 一旦你完成了更改，通过 `git\
    \ add .` 将其暂存。\n8. 现在通过 `git commit -m “编写描述你所做更改的标题” -m “编写关于你所做更改的描述”进行提交。\n\
    9. 如果你想撤销较早的提交，请使用 `git revert CommitRefNumber`。\n\n### 修改并提交拉请求的步骤\n以下是在操作 Git\
    \ 仓库时需要遵循的几条指南。\n\n1. 克隆或分支一个仓库。\n2. 对源码文件进行你需要的修改。\n3. 绝对不要对 `LICENSE` 进行任何更改。\n\
    4. 通过提交来保存你的修改。\n5. 进入 `https://github.com/Ray6464/congenial-JavaScript/pulls`。\n\
    6. 创建一个拉请求。\n\n**免责声明**：本书作者或任何其他相关人员对任何数据丢失或其他任何损失不承担责任。\n\n## 第 7 章 - 让项目作品集更具展示性\n\
    在本章中，我们将学习一些技巧来装饰项目并使其更具吸引力。本章提供了改进项目整体外观的建议。\n\n### 为你的项目添加 ASCIINEMA 演示\n这是一个非常有用的技巧，Asciinema\
    \ 是一个可以将终端会话录制为 Cast 文件的工具，而 `asciicast2gif` 是可以将这些演示转换为 GIF 图像的工具，这些图像可以包含在 `README.md`\
    \ 文件中，供潜在用户查看。Asciicast 就像视觉装饰；它们真的能让项目变得漂亮！\n\n#### 录制 ASCIICAST 并将其上传 GitHub\n\
    \n1. 你可以使用 ASCIINEMA 录制终端；查看其网站上的安装说明。\n   - 使用 `asciinema rec congenialJScast\
    \ –stdin` 开始录制终端并将数据保存为文件 `congenialJScast`。\n   - 使用 `ctrl+d` 停止录制。\n   - 使用\
    \ `asciinema play congenialJScast` 播放演示。\n2. 安装 `asciinema/asciicast2gif`，查看其\
    \ GitHub 仓库中的安装说明，或通过 npm 使用 `npm install --global asciicast2gif` 安装。\n3. 或者，你也可以通过\
    \ `npm install -g svg-term-cli` 安装并使用 `svg-term-cli`。\n4. 使用 `ffmpeg` 或任何其他工具进一步编辑你的\
    \ GIF 文件。\n5. 现在将这些 GIF 文件放在项目的 `docs` 目录下，然后将它们嵌入你的 `README.md` 文件。\n\n### 其他建议\n\
    \n1. 使用 GitHub Pages 为你的项目网站提供免费托管。例如 `emmet.io`、`cylonjs.com` 等。\n2. 你也可以查看其他免费托管替代方案，如\
    \ Tumbler、nearlyfreespeech.net、000webhostapp、blogspot 等。\n3. 如果你有商业项目，建议你购买 VPS（而不是\
    \ VPN），它本质上是你拥有 root 权限的专用服务器。使用“Namecheap”购买 VPS，使用“Epik”购买域名（非关联营销广告）。\n4. 为你的项目填充优质文案（文案写作），你可以自己写这些文案，也可以找有文案经验的人帮你完成。\n\
    5. 你的项目完成后，将其发送给同行评审，发布在 Reddit 上，在 Angel-list 上找到人并向他们发送你的作品集。\n6. 确保对有用的批评采取行动，不要让批评挫灭你的斗志！寻找和接受批评的艺术是生活中最有用的技能之一。\n\
    \nKanban Board![](img/Image00010.jpg)\n\n"
