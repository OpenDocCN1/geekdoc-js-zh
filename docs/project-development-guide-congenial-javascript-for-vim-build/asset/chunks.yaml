    \ save you a significant amount of cash.\n\n3.  A Mock and a Proof-of-Concept\
    \ is built to share with other team members, usually the developer who envisioned\
    \ the program builds this with little to no external help.\n\n4.  An internal\
    \ market testing session of the Proof-of-concept is done with the team members\
