- fmt: " own# NodeJS\n\n`NodeJS` (released in 2009) is a JavaScript Framework that\
    \ allows us to run JavaScript on servers. Before `NodeJS`, JavaScript could only\
    \ be used to create gimmicky websites, it basically acted as a styling-agent with\
    \ additional features; however now JavaScript is one of the most powerful languages\
    \ out there, possibly the most powerful (in a manner of speaking).\n\nIf you want\
    \ to learn, `NodeJS` use the book: “ Simply Web Development : An introduction\
    \ to the world of Web development - Anna Voice, Ray Voice” This book has comprehensive\
    \ introduction-level lessons to all topics you need to learn for both front-end\
    \ and back-end web development, and it’s part of a complete series which can be\
    \ used during your journey to become a full-stack engineer.\n\nFor `NodeJS` you\
    \ may want to learn about stuff like `NPM` for package management, `NVM` for version\
    \ management, etc. before moving on. Note: Some off-screen modifications may be\
    \ made to the code here, but nothing too morbid; you can figure it out yourself,\
    \ or modify the code to work without those modifications.\n\n## Built-in Variables\n\
    \n`NodeJS` has several built-in global variables; to add the use of these features\
    \ in congenial-JavaScript we can use the following code:\n\n```vim\nmodules/sourceCodeGenerator.vim:1\
    \   function ! GenBuiltInVars() abort\n2    let objectChoices = [ 'console' ,\
    \ 'global' , 'process' , 'document' ]\n3    let objectChoiceIndex = input( 'console/global/process/document'\
    \ . ' Pick 1/2/3/etc: ' )\n4     let objectChoice = objectChoices[objectChoiceIndex\
    \ -1 ]\n5     call AddToDoc(objectChoice)\n6   endfunction\ncongenial-JavaScript.vim:nnoremap\
    \ ,gvar : call GenBuiltInVars()< cr >\ninoremap < c - y >gvar <esc>: call GenBuiltInVars()<\
    \ cr >\n```\n\nHere we have the option to generate essential variables required\
    \ for back-end development; objects like `global`, `process`, etc. are the heart\
    \ of `NodeJS`.\n\n### Process props\n\nThe `process` object has several essential\
    \ props like `argv`, `env`, `platform`, etc. the following code is used to generate\
    \ process props (including the `process` object):\n\n```vim\nmodules/sourceCodeGenerator.vim:1\
    \   function ! GenProcessVars() abort\n2    let objectChoices = [ 'argv' , 'env'\
    \ , 'emitWarning()' , 'pid' , 'platform' ]\n3    let objectChoiceIndex = input(\
    \ 'argv/env/emitWarning/pid/platform' . ' Pick 1/2/3/etc: ' )\n4     let objectChoice\
    \ = objectChoices[objectChoiceIndex -1 ]\n5     call AddToDoc( 'process.' .objectChoice)\n\
    6   endfunction\ncongenial-JavaScript.vim:nnoremap ,pvar : call GenProcessVars()<\
    \ cr >\ninoremap < c - y >pvar <esc>: call GenProcessVars()< cr >\n```\n\n###\
    \ Events\n\n`NodeJS` is a run-time with capabilities to move heavy operations\
    \ to another thread (also called non-blocking runtimes and event-loops), making\
    \ `NodeJS` great for servers.\n\nTo generate `NodeJS` events we can use the following\
    \ code:\n\n```vim\nmodules/sourceCodeGenerator.vim:1   function ! GenEventVars()\
    \ abort\n2    let objectChoices = [ 'exit' , 'beforeExit' , 'abort' ]\n3    let\
    \ objectChoiceIndex = input( 'Events exit/beforeExit/abort' . ' Pick 1/2/3/etc:\
    \ ' )\n4     let objectChoice = objectChoices[objectChoiceIndex -1 ]\n5     call\
    \ AddToDoc( 'process.on(\"' .objectChoice. '\", function() {});' )\n6   endfunction\n\
    congenial-JavaScript.vim:nnoremap ,event :call GenEventVars()<cr>\ninoremap <\
    \ c - y >event <esc>: call GenProcessVars()< cr >\n```\n\n## Refactoring code\n\
    \nHere I have seen a pattern emerging among the functions described in this chapter,\
    \ so I have refactored the code to the following:\n\n```vim\nmodules/sourceCodeGenerator.vim:1\
    \   function ! ObjectWriter(objectChoices, index, preCode, postCode) abort\n2\
    \     let objectChoice = a :objectChoices[ a :index]\n3     call AddToDoc( a :preCode.objectChoice.\
    \ a :postCode)\n4   endfunction\n5   \n6   function ! GenerateBuiltInVariables()\
    \ abort\n7     let objectChoices = [ 'console' , 'global' , 'process' , 'window'\
    \ , 'document' ]\n8     let objectChoiceIndex = input( 'console/global/process/window/document'\
    \ . ' Pick 1/2/3/etc: ' )\n9      call ObjectWriter(objectChoices, objectChoiceIndex\
    \ -1 , '' , '' )\n10 endfunction\n11   \n12 function ! GenerateProcessVariables()\
    \ abort\n13   let objectChoices = [ 'argv' , 'env' , 'emitWarning()' , 'pid' ,\
    \ 'platform' , 'arch' ]\n14   let objectChoiceIndex = input( 'argv/env/emitWarning/pid/platform/arch'\
    \ . ' Pick 1/2/3/etc: ' )\n15   call ObjectWriter(objectChoices, objectChoiceIndex\
    \ -1 , 'process.' , '' )\n16 endfunction\n17   \n18 function ! GenerateEventVariables()\
    \ abort\n19   let objectChoices = [ 'exit' , 'beforeExit' , 'abort' ]\n20   let\
    \ objectChoiceIndex = input( 'Events exit/beforeExit/abort' . ' Pick 1/2/3/etc:\
    \ ' )\n21   call ObjectWriter(objectChoices, objectChoiceIndex -1 , 'process.on(\"\
    ' , '\", function() {});' )\n22 endfunction\n```\n\nNote: In all honesty, I developed\
    \ the pattern on purpose for this book. Now, this code can be further refactored\
    \ and reduced, but this is enough for now.\n\n## Custom Events Emitter\n\nTo generate\
    \ custom `NodeJS` events emitter we can use the following code:\n\n```vim\nmodules/sourceCodeGenerator.vim:1\
    \   function ! GenEventEmitter() abort\n2    call AddToDoc( \"const { EventEmitter\
    \ } = require('events')\" )\n3      call NewLine()\n4      call AddToDoc( 'const\
    \ eventEmitter = new EventEmitter();' )\n5      call NewLine()\n6      call AddToDoc(\
    \ \"eventEmitter.on('launch', () => {\" )\n7      call NewLine()\n8      call\
    \ AddToDoc( \"console.log('Server launched')\" )\n9      call NewLine()\n10  \
    \   call AddToDoc( \"})\" )\n11     call NewLine()\n12     call AddToDoc( \"eventEmitter.emit('launch')\"\
    \ )\n13 endfunction\ncongenial-JavaScript.vim:nnoremap ,emit : call GenEventEmitter()<\
    \ cr >\ninoremap < c - y >emit <esc>: call GenEventEmitter()< cr >\n```\n\n##\
    \ Creating a Server with HTTP code\n\nTo generate code for HTTP server code we\
    \ can use the following code:\nNote: Here I have built a new feature into `AddToDoc()`\
    \ for appending new lines at the end of output.\n\n```vim\nmodules/sourceCodeGenerator.vim:1\
    \   function ! GenServerCode() abort\n2   let serverPort = input( \"Which port\
    \ to use (8080,300, etc.):\" )\n3   call AddToDoc( \"var http = require('http');\"\
    \ )\n4   call NewLine()\n5   call NewLine()\n6   call AddToDoc( \"http.createServer(function\
    \ (req, res) {\" \"newLine\" )\n7   call AddToDoc( \"  res.writeHead(200, {'Content-Type':\
    \ 'text/html'});\" \"newLine\" )\n8   call AddToDoc( \"  res.write('server at\
    \ \" .serverPort. \" is up');\" \"newLine\" )\n9   call AddToDoc( \"  res.end();\"\
    \ \"newLine\" )\n10  call AddToDoc( \"}).listen(\" .serverPort. \"); \"newLine\"\
    \ )\n11 endfunction\ncongenial-JavaScript.vim:nnoremap ,server : call GenServerCode()<\
    \ cr >\ninoremap < c - y >server <esc>: call GenServerCode()< cr >\n```\n\n##\
    \ FS module code\n\nOne of the most powerful modules in `NodeJS` is the File System\
    \ aka `FS` module; it provides both blocking (`sync`) and non-blocking (`async`)\
    \ methods to work with files, etc. Here we will develop some file reading and\
    \ writing method for it. Take a look at `https://nodejs.org/api/fs.html`. Note:\
    \ Sync functions are blocking, which means the whole program must wait for the\
    \ “blocking code” to do it. To generate code for FS module we can use the following\
    \ code (this is a long one):\n\n```vim\nmodules/sourceCodeGenerator.vim:1   function\
    \ ! GenModuleCode() abort\n2   \"needs methods\"\n3   let fsMethods = input( '(1)\
    \ Read File, (2) Write File 1/2: ' )\n4   let blocking = input( 'blocking (sync)\
    \ or non-blocking (async) 1/2: ' )\n5   let fileName = input( 'fileName: ' )\n\
    6   \n7   if fsMethods == '2'\n8     let textOutput = input( 'What text do you\
    \ want written to file: ' )\n9     let dataVarName = input( 'Name of the variable\
    \ will store data: ' )\n10  endif\n11  \n12  if fileName == ''\n13     let fileName\
    \ = './database.json'\n14  endif\n15  \n16  if blocking == '1'\n17     if fsMethods\
    \ == '1'\n18       call AddToDoc( \"const { readFileSync } = require('fs');\"\
    \ \"newLine\" )\n19       call AddToDoc( \"const txt = readFileSync('\" .fileName.\
    \ \"', 'utf8');\" \"newLine\" )\n20       call AddToDoc( \"console.log(txt);\"\
    \ \"newLine\" )\n21     elseif fsMethods == '2'\n22       call AddToDoc( \"const\
    \ { writeFileSync } = require('fs');\" \"newLine\" )\n23       call AddToDoc(\
    \ \"const \" .dataVarName. \" = new Uint8Array(Buffer.from('\" .textOutput.')));\"\
    \ \"newLine\" )\n24       call AddToDoc( \"writeFileSync('\" .fileName. \"', .dataVarName.\
    \ \");\" \"newLine\" )\n25     endif\n26   endif\n27  elseif blocking == '2'\n\
    28     if fsMethods == '1'\n29       call AddToDoc( \"const { readFile } = require('fs');\"\
    \ \"newLine\" )\n30       call AddToDoc( \"readFile('\" .fileName. \"', 'utf8',\
    \ (err, txt)=>{\" \"newLine\" )\n31       call AddToDoc( \"  console.log(txt);\"\
    \ \"newLine\" )\n32       call AddToDoc( \"});\" \"newLine\" )\n33     elseif\
    \ fsMethods == '2'\n34       call AddToDoc( \"const { writeFile } = require('fs');\"\
    \ \"newLine\" )\n35       call AddToDoc( \"const \" .dataVarName. \" = new Uint8Array(Buffer.from('\"\
    \ .textOutput.')));\" \"newLine\" )\n36       call AddToDoc( \"writeFile('\" .fileName.\
    \ \"', .dataVarName. \", (err) => {\" \"newLine\" )\n37       call AddToDoc( \"\
    \  if (err) throw err;\" \"newLine\" )\n38       call AddToDoc( \"  console.log('The\
    \ file has been saved!');\" \"newLine\" )\n39       call AddToDoc( \"});\" \"\
    newLine\" )\n40     endif\n41   endif\n42 endfunction\ncongenial-JavaScript.vim:nnoremap\
    \ ,fs : call GenFSModuleCode()< cr >\ninoremap < c - y >emit <esc>: call GenFSModuleCode()<\
    \ cr >\n```\n\nThis code allows us to generate FS methods to read and write files,\
    \ both in a blocking and non-blocking manner.\n\n## JavaScript Require() and Export\n\
    \nIn JavaScript we use `Require()` and `modules.export` for importing and exporting\
    \ data from distinguished files, for more info read the book: Simply ES6: Mastering\
    \ JavaScript and ES6 to Its Fullest, 2nd Edition.\n\nTo generate code for Import\
    \ and Export (non-ES modules) we can use the following code:\n\n```vim\nmodules/sourceCodeGenerator.vim:1\
    \   function ! GenRequire() abort\n2    let moduleName = input( \"Module Name:\
    \ \" )\n3    let moduleImportedAs = input( \"Import data as: \" )\n4   \n5   \
    \ if moduleImportedAs == ''\n6      let moduleImportedAs = moduleName\n7    endif\n\
    8   \n9    call AddToDoc( \"const \" .moduleName. \" = require('\" .moduleImportedAs.\
    \ \"');\" )\n10 endfunction\n11 \n12 function ! AddProp() abort\n13   let propName\
    \ = input( \"Prop Name: \" )\n14   let propValue = input( \"Prop value: \" )\n\
    15   call AddToDoc( '  '.propName. ': '.propValue. ',' )\n16   let moreProp =\
    \ input( \"Add another? y/n: \" )\n17   if moreProp == \"y\"\n18     call AddProp()\n\
    19   endif\n20 endfunction\n21 \n22 function ! GenExport() abort\n23   call AddToDoc(\
    \ 'module.exports = {' )\n24   call AddProp()\n25   call AddToDoc( '}' )\n26 endfunction\n\
    congenial-JavaScript.vim:nnoremap ,require : call GenRequire()< cr >\ninoremap\
    \ < c - y >require <esc>: call GenRequire()< cr >\nnnoremap ,export : call GenExport()<\
    \ cr >\ninoremap < c - y >export <esc>: call GenExport()< cr >\n\n## Basic Express\
    \ Server Tools for NodeJS\n\nTo generate code for a Basic Express server with\
    \ NodeJS we can use the following code:\n\n```vim\nmodules/sourceCodeGenerator.vim:1\
    \   function ! GenExpServer() abort\n2   call AddToDoc( \"const express = require('express');\"\
    \ )\n3   call AddToDoc( \"const app = express();\" )\n4   call NewLine()\n5  \
    \ call AddToDoc( \"app.get('/', (req, res) {\" )\n6   call AddToDoc( \"  res.sendFile('index.html',\
    \ {root: __dirname});\" )\n7   call AddToDoc( \"});\" )\n8   call NewLine()\n\
    9   call AddToDoc( \"const port = process.env.PORT || 8080;\" )\n10  call AddToDoc(\
    \ \"app.listen(port, ()=>{console.log(`System Online: ${port}`)});\" )\n11 endfunction\n\
    12 \n13 function ! GenExpGet() abort\n14   let node = input( \"Node home/aboutme/etc:\
    \ \" )\n15   let fileURL = input( 'name and URL of File index.html/main.css/etc:\
    \ ' )\n16   call AddToDoc( \"app.get('\" .node. \"', (req, res) {\" )\n17   call\
    \ AddToDoc( \"  res.sendFile('\" .fileURL. \"', {root: __dirname});\" )\n18  \
    \ call AddToDoc( '});' )\n19 endfunction\ncongenial-JavaScript.vim:nnoremap ,express\
    \ : call GenExpServer()< cr >\ninoremap < c - y >express <esc>: call GenExpServer()<\
    \ cr >\nnnoremap ,express : call GenExpressGet()< cr >\ninoremap < c - y >express\
    \ <esc>: call GenExpGet()< cr >\n```\n\n## Chapter 5 – Functional Programming\
    \ Code for JavaScript\n\nFunctional programming is a way to write code that is\
    \ not only vastly better than OOP (not always), but it’s also cleaner. When function\
    \ programming is required, we should emphasize on:-\n"
