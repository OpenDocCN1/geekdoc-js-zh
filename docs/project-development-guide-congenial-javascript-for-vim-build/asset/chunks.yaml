  trans: "\n本书采用了非常简洁且直接的方式呈现，即使是极微小的细节也提供了详细的步骤和解释。我的意图是不遗漏任何细节；因此，从编写第一行代码到`Refactoring`（重构）和`Rewriting`重写），一切都将以易于阅读的方式进行详细记录。一旦你开发了项目，甚至可以将其放入你的作品集中。原始项目采用\
    \ `MIT Licensed` 许可；请在源代码中为原作者（`Ray Voice`）注明，即“公开归属”。本书从单兵程序员/项目经理的角度编写，因此易于独自阅读，并能让你为加入更大的团队做做好准备。\n\
    \n### 前提条件\n要阅读这本书，你只需要了解以下内容：\n\n1. `Vim` 基础，例如什么是`Normal Mode`（普通模式）、`Insert\
    \ Mode`（插入模式）等。 `VimScript`/`VimL` 也值得了解。\n2. `JavaScript` 基础。我们在本书中没有使用任何 `JavaScript`，但我们正在开发一个为\
    \ `JavaScript` 编码提供辅助工具。\n3. 编程基础。你需要了解`variables`（变量）、`functions`（函数）、`importing`（导入）等知识。如果你了解\
    \ `JavaScript`，这应该是轻而易举的。\n\n你可以通过阅读以下书籍获得所有前提条件，但如果你知道自己在做什么，则不需要阅读它们：\n* `Simply\
    \ Vim : A Comprehensive Guide to Mastering the Vim text-editor` – `Ray Voice`\n\
    * `Simply Web Development : An introduction to the world of Web development` –\
    \ `Anna Voice` and `Ray Voice`\n* `Simply ES6 : Mastering JavaScript and ES6 to\
    \ its fullest` – `Ray Voice` and `Anna`（针对高级 JavaScript）\n\n### 关于作者\n![](img/Image00002.jpg)\n\
    `Ray Voice` 是一位数学家、计算机研究员、软件开发者、连续创业者和畅销作家。他是“Ray & A Group Solutions”的 MD 和 CEO，这是一家位于亚洲的技术咨询公司，客户遍布全球。他还是“Technology\
    \ Application, Research, and Development Initiative Stratagem”（简称“TARDIS”）的创始人兼董事，这是一个命名巧妙的研发机构，其主要目的是通过开发未来的技术让世界变得更好。其成员来自各行各业。他们完成的大部分工作都是开源的，并使用\
    \ `MIT` 和 `BSD` 许可。研发运营的大部分资金来自举办研讨和工作坊。\nTwitter: @RayShortHead\n\n#### 作者感谢\n\
    以下人员参与了本书的开发，没有他们，这本书将无法完成。\n* `Anna Voice`（编辑）\n* `Siena Dahl-Joy`（贡献者）\n* `Ospan\
    \ Ali`（素材图片）\n向他们所有人表示感谢。\n\n## 第 1 章 - 初始想法的开发\n在本章中，我们将开始处理项目的初始想法。我们将回顾开发过程，然后直接进入原型设计和概念验证开发等方面，最后进行一些市场测试。\n\
    \n#### 开发流程\n情况是这样的，我相信一旦有了初始想法和`Team of Developers`（开发团队），影响项目最终成功的因素就是流程！因此，在急于推进开发之前，确保流程是正确的至关重要。小型且精益的初创公司其优势在于为每个项目使用独特的开发流程，如果项目负责人清楚自己在做什么，这对项目会非常有益处。然而，这种模型在大多数情况下并不具有可扩展性，最好使用如\
    \ `Kanban`（看板）或 `Scrum` 等敏捷方法。本项目的开发流程将保持足够精简，以便一个人就能执行。流程如下：\n\n1. 以简洁直观的方式在没有外部帮助的情况下写下一个\
    \ `General Idea`（通用想法）。\n2. 为项目列出需求及其时间表。这类文档通常提供给你的财务资助者或负责项目库存/账户管理的人。这必须准确完成，因为这将用于为你的初创公司/公司绘制跑道时间线。一个具有\
    \ IT 经验的专业会计师可以为你节省大量资金。\n3. 构建一个 `Mock`（原型）和一个 `Proof-of-Concept`（概念验证）以与其他团队成员共享，通常由构思该程序的开发者在几乎或完全没有外部帮助的情况下构建。\n\
    4. 与团队成员和一些外部人员对 `Proof-of-concept` 进行内部市场测试。这是一个非常关键的时期，因为它可能为未来的许多工作奠定基调。\n\
    5. 较大的项目会建立如 `SCRUM` 的项目管理系统，而对于像这样的小型项目，一个人就可以微管理几个开发者。\n6. 启动项目并与所有团队成员共享 `Repository`（仓库）。在我的项目中，我强制每个人使用分级管理系统，他们只能将代码提交到自己的\
    \ `Repo` 中，并且只能与主管的 `repo` 合并。每个人在将其合并到原始 `Repo` 之前都会彻底审查其下属的工作。\n7. 团队成员之间举行简报会议以分配任务。在这部分，我与团队一起开发和审查\
    \ `Kanban boards`（看板）。这也可以作为 `SCRUM` 的一部分完成。\n8. 开始开发的实际编程阶段。\n9. 完成最后的调整，包括 Beta\
    \ 测试。\n10. 将项目推送到 `master repo`（主仓库），并作为以下形式之一分发给用户：\n    1. 更新他们现有的软件。\n    2.\
    \ 升级到他们当前的版本。\n    3. 滚动发布（Rolling release），类似于更新。\n    4. 实时版本（Live version），意味着用户始终使用最新版本。\n\
    11. 通常会举办发布派对或仪式。\n\n如果这些步骤让你感到压力很大，完全不用担心！我们不会执行像第 10 步那样的步骤，我也绝不会为你举办派对！\n\n\
    #### 初始想法\n每个项目都有灵感，开发者总是在试图满足某种需求，或者试图填补某种空白。Congenial-coding 实践源于以下需求：\n\n1.\
    \ 我患有腕管综合症！我不能打太多字，所以我依靠听写、语音转文字程序以及像 `Emmett-vim` 这样的程序来帮助我编码。\n2. 我使用许多语言编程，我担任了很长时间\
    \ `Forensic Programmer`（取证程序员），所以忘记编程语言的语法是我生活中的大罪，但它仍然时时发生。\n\n#### 取证编程\n我将自己描述为\
    \ `Forensic Programmer`，作为一名 `Forensic Programmer`，我诊断软件、源代码、UI/UX 等问题并修复它们；确保它们不会以不可预测的方式再次发生。初始想法类似于漏洞赏，事实上，寻找漏洞是工作的一部分，但取证编程更广泛且目标不同。作为\
    \ `Forensic Programmer`，我使用过许多编程语言、库和框架、编辑器、人员等，包括但不限于：\n\n1. `JavaScript`\n2.\
    \ `TypeScript`\n3. `ReactJS` 和 `React-Native`\n4. `C`、`C++`、`C#`、`Go` 和 `OpenCL`\n\
    5. `Lua`\n6. `Common Lisp`\n7. `Java`、`Kotlin` 和 `Scala`\n8. `FORTRAN`、`Alef`\
    \ 和 `Limbo`（有一次）\n9. `Python`\n10. `MATLAB`、`Octave`、`BRL-CAD` 等。\n11. `Sh/BASH\
    \ Shell`、`BASIC` 和 `DOS batch`\n12. `Haskell`\n13. `Curl`\n14. `Swift`\n15. `Rust`\n\
    16. `AWK`\n17. 用于 `Flutter` 的 `Dart`\n18. `PHP` 和 `SQL`\n19. `Ruby`\n20. `Perl`\n\
    21. `Zig` 和 `Racket`\n22. `BrainFuck` 和 `Shakespeare`（趣味）\n\n#### 总大纲\n所以，我需要一个具有以下功能的程序：\n\
    \n1. 它允许我用最少的打字量编写数百行代码。\n2. 它应该帮助处理语言的语法。\n\n"
- fmt: "\n### 3. It should be intuitive enough so I don’t forget how to use it, otherwise\
    \ what’s the point!\n\n#### Development Features\nThe program also needs some\
    \ silent aka development features.\n\n1. It needs to be easily adaptable to languages\
    \ other than `JavaScript` so I can port it for other languages.\n2. It should\
    \ be uniform and in conduct to all languages, for example a command to declare\
    \ a variable should be same in `JavaScript` and `C` language, but it’s output\
    \ will obviously be different.\n3. It needs to be blazing fast; any plugin that\
    \ slows down `Vim` is not worth it.\n\n#### Project Requirements Mockup\nI will\
    \ be developing this project without much external help; however, I will still\
    \ show you how it’s done so you have at-least some idea of how a firm works. Before\
    \ development begins we need a budget for the development periods, someone from\
    \ the financial depart clears the budget and then the project manager has full\
    \ control of it!\n\nAlthough the following is usually not the case, I have worked\
    \ with teams where the financial department never gives up control of the budget,\
    \ this in turn harms the project to a great extent; one of the worst thing you\
    \ can do to someone is to give them a responsibility but don’t actually give them\
    \ the power to carry it out.\n\n##### Our Project Requirements (abstract)\nLet’s\
    \ make a list of things we need to develop this project.\n\n1. We need some people\
    \ who can code in `VimScript`.\n2. We need someone to write unit tests and generate\
    \ reports on development using `VimScript`, `Python`, etc.\n3. We need someone\
    \ to write the documentation, this requires a separate skill-set. Documentation’s\
    \ written by programmers make readers suicidal.\n4. We need some people to beta-test\
    \ our software.\n5. We are assuming that we have the room and equipment to develop\
    \ the project.\n\n##### Our Project Requirements (Official)\nWhile we have our\
    \ list of initial requirements, we can’t send a rough list like the one presented\
    \ above to the financial department, they need clear guidelines to calculate the\
    \ budget. We need to develop an official list that describes the precise quality\
    \ and quantity of the labour and budget we are demanding. Following is a more\
    \ formal version of the list:\n\n1. `VimScript` coders x2-x4.\n2. `VimScript`\
    \ coder with experience in writing unit tests.\n3. A coder with experience in\
    \ writing documentation.\n4. Budget for impartial focus-groups.\n5. Intra-development\
    \ budget of $200 for additional payroll, petty-cash, equipment maintenance, etc.\n\
    \nNow this is a good official document! Although the 5th point will infuriate\
    \ some people. The official document will look something like the following:![](Image00003.jpg)\n\
    \nNote: This is only a mock document. Once this document is delivered usually\
    \ there is some negotiation, however a project manager mustn’t make any claims\
    \ they can’t deliver, and should never budge on reasonable requests. Remember,\
    \ setting improbable goals on low budgets is very harmful for the project, and\
    \ can be very harmful to the reputation of people associated with that project.\n\
    \n#### Scaling down the demands\nSometimes we don’t have all the resources or\
    \ the budget to develop a project at large scale, if this is the case we can take\
    \ the following approaches:\n\n##### The Lean Entrepreneur approach\n1. Instead\
    \ of using multiple coders and a separate coder for writing unit tests, we hire\
    \ a small duo to do the job and test each other’s work. This can prove to be disastrous\
    \ in large-scale projects. It’s also smart to outsource some stuff.\n2. Give the\
    \ role of documentation writer to a low-paid `Intern`.\n3. Instead of booking\
    \ Focus-groups use organic feedback from the figurative “friends and family”.\n\
    \n##### The Broke Entrepreneur approach\n1. DIY some of the program including\
