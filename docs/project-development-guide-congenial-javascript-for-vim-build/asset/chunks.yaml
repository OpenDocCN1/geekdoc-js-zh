    \ of a project! Hence, it’s very important to get the process right before getting\
    \ ahead of the development.​ Small and Lean Startups have the advantage of using\
    \ unique development processes for each project, this can be really good for the\
    \ project if the person leading the project knows what they are doing. However,\
    \ this model is not really scalable in most cases, it’s better to use Agile methods\
    \ like Kanban or Scrum.​ The development process of this project will be kept\
    \ lean enough so one person can follow it. The process will look like the following:\n\
    \n1.  A General Idea will be written down in a clean and straightforward manner\
    \ without external help.\n\n2.  A collection of requirements and their timeline\
    \ will be listed for the project. This type of document is usually given to your\
