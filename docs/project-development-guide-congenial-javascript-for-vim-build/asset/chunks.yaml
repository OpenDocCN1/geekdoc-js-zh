  trans: "\n\n## 1. 编写高阶函数。\n\n1. 顺便一下，不要修改任何数据。\n\n2. 使用如 `filter`、`map` 等方法，这些方法作用于数据并返回修改后的数据版本，而不修改原始数据。\n\
    \nJavaScript 有一些内置方法，如 `map()`、`filter()` 等，但我仍然倾向于使用后文描述的一些自定义高阶函数。在以函数式编程范式编写代码时，我们必须遵循以下规则：\n\
    \n- 函数不能受程序状态的影响。\n- 函数不应影响程序状态。\n- 函数必须用于将程序拆分为较小的、可测试的部分。\n- 函数可以被视为一等公民，这基本上意味着它们像任何其他数据一样，拥有具体的名称，可以作为参数传递，可以从其他函数返回等。\n\
    - 函数不能从用户那里获取输入。\n\n凭借对 Common Lisp 和 Wolfram 的丰富学习经验，我倾向于在 JavaScript 中采用函数式编程。让我们开始构建一些用于动态样板代码的生成器（Generators）。以下是针对函数式编程人士的简要术语。\n\
    \n1. 隔离函数 - 不依赖于程序状态（包括可能发生变化的全局变量）。\n2. 纯函数 - 相同的输入始终产生相同的输出。\n3. 将函数作为参数或将函数作为返回值的函数称为高阶函数（Higher\
    \ Order Functions）。\n4. 当函数传递到另一个函数或从另一个函数返回时，这些传入或返回的函数被称为 lambda。\n5. 函数不能有依赖，如果需要依赖，则必须作为参数传递，始终显式声明你的依赖。\n\
    \n以下是给函数式编程新手的的一些简易指南：\n\n1. 编写大量的函数。\n2. 永远不要在没有意图的情况下干扰变量。\n3. 尽可能使用 `const`。\n\
    4. 编写接受其他函数作为参数的函数。\n5. 编写返回其他函数的函数。\n6. 以易于测试的方式编写代码。此处的“测试”指的是单元测试和其他自动化测试方法。\n\
    7. 函数可以与构造函数一起使用类似于 `Classes`，在这种情况下，它们将被赋予一个以大字母开头的名称。\n\n以下是函数式 JavaScript 代码与普通代码的对比示例：\n\
    \n非函数式示例：\n```javascript\nlet x = 6;\nfunction double() {\n  return ++x;\n}\n\
    ```\n\n函数式示例：\n```javascript\nlet x = 6;\nfunction double(input) {\n  return ++input;\n\
    }\n```\n\n以下是在 JavaScript 的 `Array` 对象中嵌入方法的示例。\n\n```javascript\nvar myArray\
    \ = [ 1 , 2 , 3 , 4 ] ;\nArray . prototype . newMap = function ( callback ){\n\
    \  let neoArray = [] ;\n  this . forEach (( e , i ) => {\n    neoArray [ i ] =\
    \ callback ( e ) ;\n  }) ;\n  return neoArray ;\n} ;\nvar newArray = myArray .\
    \ myMap ( function ( item ){\n  return item * 2 ;\n}) ;\n```\n\n注意我们是如何使用 `this`\
    \ 关键字和 `callback` 单词的。`this` 关键字取代了 `Array`。`callback` 指要求函数作为值的参数。这种代码通常在函数式编程中使用。\n\
    \n注意：我不建议在没有适当考虑的情况下修改 `Array` 对象。\n\n我们插件的代码编写章节到此结束，项目的官方仓库位于：https://github.com/Ray6464/congenial-JavaScript\
    \ \n\n如果你想贡献力量，请随时提交 PR（拉请求）。你可以从编写生成 `Array.forEach`、`Array.find()`、`Array.some()`、`Array.every()`、`Array.reduce()`、`Array.includes()`\
    \ 等代码开始。\n\n## 第 6 章 - 开发后工作、编写文档和提交拉请求\n\n在本章中，我们将处理项目开发中最重要的方面之一！编写文档。\n\n理想情况下，我们应该在编写文档之前对代码进行重构，但在项目中，我决定将其留给\
    \ GitHub 上的 FOSS 大军。我会进行一些重构，但其余留给在线贡献者。\n\n### 开发后工作\n\n以下是我通常执行的开发后工作列表，你在展示工作成果之前也应该执行这些。\n\
    \n#### 开发后工作示例\n\n1. 检查每个注释并判断它们是否有益处，删除任何无用的注释。\n2. 处理任何被注释掉的代码。\n3. 确保你的注释没有误导他人。\n\
    4. 确保你的代码遵循整洁代码的三个 R：可读性（Readability）、可重用性（Re-usability）和重构（Refactoring）！\n\n\
    ### 注释重构\n\n在处理注释时，请记住这条格言：“写代码不写注释”。\n\n与其向你描述或告知，我将在我们代码的案例研究中向你展示我的意思。\n\n\
    注意：此代码是为了教学目的而编写。警告：不要被以下快照中的行号分散注意力。\n\n#### 案例 1\n\n在此例中，我们正在查看 `modules/tests.vim`\
    \ 文件。\n\n代码（之前）：\n```vim\n\"----------------------\"\nlet numberOfTestsPassed\
    \ = 0\n\"----------------------\"\n\"----------------------\"\nlet numberOfTestsFailed\
    \ = 0\n\"----------------------\"\n...下方有几行...\n\"each test is ran on a different\
    \ line\n\"----------------------\"\nlet lineNumber = 1\n\"----------------------\"\
    \n```\n\n代码（之后）：\n```vim\n\"----------------------\"\nlet numberOfTestsPassed\
    \ = 0\nlet numberOfTestsFailed = 0\nlet lineNumber = 1\n\"----------------------\"\
    \n```\n\n现在比较“之前”和“之后”快照，在“之前”快照中，我们有很多行，看起来很不方便；在“之后”快照中，我们将行数减少到了 5 行（包括美化后的注释）。\n\
    \n另一个变化是变量 `lineNumber` 的名称和行号；名称更改为 `headOverLineNumber`，其中“head”指的是解释图灵机概念的设备的“头”。这要求我们在各处更改变量名，在\
    \ Vim 中，我们可以使用 `%s/lineNumber/headOverLineNumber/g` 来执行。\n\n#### 案例 2\n\n在此例中，我们正在查看\
    \ `modules/tests.vim` 文件。\n\n代码（之前）：\n```vim\n\" lines are incremented here so\
    \ the test-head moves from line #1 -> #2, #2 -> #3, ...\nlet g :headOverLineNumber\
    \ = g :headOverLineNumber + 1\n```\n\n注意：这段代码存在于 `GenerateReport()` 和 `GenerateMultiLineReport()`\
    \ 函数中。\n\n代码（之后）：\n```vim\nfunction ! MoveHeadToNextLine() abort\n  let g :headOverLineNumber\
    \ = g :headOverLineNumber + 1\nendfunction\n```\n\n在这里，“之前”快照中的注释看起来心境很糟糕；在“之后”快照中，我们将为它提供自己的函数（如“之后”快照所示），然后用以下代码替换“之前”快照中的代码：\n\
    在 `GenerateReport()` 和 `GenerateMultiLineReport()` 函数中调用 `MoveHeadToNextLine`。\n\
    \n### 编写文档\n\n对于此项目，有两个文档文件：\n\n1. README.md（用于 GitHub 主页）\n2. docs/outline.txt（用于基础用户信息）\n\
    \n"
- fmt: "\nYou can find the content of these files on GitHub at `ray6464/congenial-JavaScript`.\
    \ Following is a brief example of `outline.txt`:\n\n### Key Bindings to generate\
    \ Dynamic Boilerplate\n\n| Command | Generates (JavaScript) |\n| :--- | :--- |\n\
    | `outline` | Outline of Features |\n| `var` | Variable |\n| `label` | Label |\n\
    | `loop` | Loop |\n| `array` | Array |\n| `log` | Stdout aka `console.log()` |\n\
    | `timer` | Timer Loops (`setInterval`) |\n| `split` | `Array.split()` |\n| `map`\
    \ | `Array.map()` |\n| `loarray` | Loop Over Array (`forEach`) |\n\nThe purpose\
    \ of the `outlint.txt` file is to serve as a short-cut for users to see what features\
    \ they have available at hand.\n\n## Making a pull request\nIn this section, you\
    \ will learn how to clone the official Congenial-JavaScript project from GitHub\
    \ and make modifications to it. For the following instructions, you will need\
    \ a GitHub account, and some basic knowledge of Git usage. Also a Pull Request\
    \ is easily made with the web GUI provided by GitHub, so it’s not covered here.\
    \ The instructions are provided for linux users, windows and mac users can modify\
    \ the instructions for their use.\n\n### Steps To Install the package\n\n1. Use\
    \ `cd ~ && git clone https://github.com/Ray6464/congenial-JavaScript` to fork\
    \ this repo in your Home directory.\n2. In a terminal go to `~/.vim/after/ftplugin/javascript/`,\
    \ make these directories if they are absent!\n3. Make a symbolic-link to the cloned\
    \ directory with `ln -s ~/congenial-JavaScript`.\n4. Execute `cp ~/.vim/after/ftplugin/javascript/congenial-JavaScript/modules/plugins.vim\
    \ ~/.vim/after/ftplugin/javascript/plugins.vim`. This primes the plugin to work\
    \ only in files with `.js` extension.\n5. Now open a JavaScript file in Vim, like\
    \ `vim something.js` and try out the magic. The plugin should work now, if not\
    \ check the latest instructions to install it on your machine.\n6. After the 1st\
    \ step you will have a clone of my repo in your home directory, once you make\
    \ modifications to it you can Commit them to Git, and then Push them to the origin\
    \ repo I created on GitHub using the following instructions. Ideally, we break\
    \ down bigger commits to smaller ones, but for the sake of simplicity let’s make\
    \ a big one here.\n7. Once you have made the changes, stage them via `git add\
    \ .`.\n8. Now commit them via `git commit -m “Write a heading describing the changes\
    \ you have made” -m “Write a description about what changes you have made”`.\n\
    9. If you’d like to revert an older commit use `git revert CommitRefNumber`.\n\
    \n### Steps to make modification and make a pull request\nFollowing are a few\
    \ guidelines to follow while working with Git Repositories.\n\n1. Clone or fork\
    \ a Repo.\n2. Make any modifications you want to the source-code files.\n3. Never\
    \ make changes to `LICENSE`.\n4. Save your modifications by committing them.\n\
    5. Go to `https://github.com/Ray6464/congenial-JavaScript/pulls`.\n6. Make a pull\
    \ request.\n\n**Disclaimer**: The author of this book or any other related person/persons\
    \ cannot be held liable for any loss of data, or any other loss.\n\n## Chapter\
    \ 7 - Making the plugin presentable for the portfolio\nIn this chapter, we will\
    \ learn a few tricks to embellish the project and make it more presentable. This\
    \ chapter provides suggestions to improve the overall appearance of your project.\n\
    \n### Adding ASCIINEMA casts to your project\nThis is a very useful trick, Asciinema\
    \ is a tool that can record terminal sessions in files called Casts and `asciicast2gif`\
    \ is a tool that can convert those casts to GIF images, these images can be included\
    \ in the `README.md` file and then can be viewed by potential users. Asciicasts\
    \ serve as eye-candy; they can really prettify a project!\n\n#### Recording an\
    \ ASCIICAST and putting it on GitHub\n\n1. You can use ASCIINEMA to record terminals;\
    \ see installation instructions on their website.\n   - Use `asciinema rec congenialJScast\
    \ –stdin` to start recording your terminal and saving the data to a file named\
    \ `congenialJScast`.\n   - Use `ctrl+d` to stop recording.\n   - Use `asciinema\
    \ play congenialJScast` to play the cast.\n2. Install `asciinema/asciicast2gif`,\
    \ See installation instructions form their GitHub repo or install it from npm\
    \ using `npm install --global asciicast2gif`.\n3. Alternatively you can install\
    \ and use `svg-term-cli` via `npm install -g svg-term-cli`.\n4. Use `ffmpeg` or\
    \ any other tool to further edit your GIF files.\n5. Now add these GIF files by\
    \ putting them in the `docs` directory of your projects and then embedding them\
    \ your `README.md` file.\n\n### Other suggestions\n\n1. Use GitHub Pages to provide\
    \ free hosting to your project’s website. Like `emmet.io`, `cylonjs.com`, etc.\n\
    2. You can also look at free hosting alternatives like Tumbler, nearlyfreespeech.net,\
    \ 000webhostapp, blogspot, etc.\n3. If you have a commercial project I suggest\
    \ you to buy a VPS (not VPN), which is basically a Private Server where you have\
    \ root access, use “Namecheap” for a VPS and “Epik” for domain names (not affiliated\
    \ marketing advertisements).\n4. Fill your project with good copy (as in copy-writing),\
    \ you can write this copy yourself or ask someone with copy-writing experience\
    \ to do this for you. own5. Once your project is complete send it out to peers\
    \ or review, post it on Reddit, find people on Angel-list and send them your portfolio.\n\
    6. Make sure to act on useful criticism, don’t let criticism discourage you! The\
    \ art of scouring and accepting criticism is one of the most useful skills in\
    \ life.\n\nKanban Board![](Image00010.jpg)\n"
