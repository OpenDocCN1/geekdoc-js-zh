    2.  Partially write the documentation yourself, and put the rest on GitHub for
    others to contribute.


    3.  Share the program online with others; you can get some pretty great (hurtful)
    feedback this way. Just keep an open mind and ironclad nerves.


    Proof-of-Concept and Beta-testing​ I will be taking on the role of your Project
    Manager, and I’ve written a proof-of-concept for you. The code is provided below,
    put it in your “.vimrc” file and you will be able to test the proof of concept
    yourself:1  “ start of the proof-of-concept code2   function ! Append (dataToAppend)
    abort3      execute ''normal i'' .a:dataToAppend4    endfunction5   6   function
    ! GenerateVariable () abort7     let scope = input ( ''var/let/const Pick 1/2/3:
    '' )8     let scopeOptions = [ ''var'' , ''let'' , ''const'' ]9      let scopeRes
    = scopeOptions [ scope -1]10   11    let name = input ( ''Name of Variable: ''
    )12    let value = input ( ''Value of Variable: '' )13    14    call Append (
    scopeRes . '' '' . name . '' = '' . value . '';'' )15 endfunction1617 nnoremap
    ,var :call GenerateVariable ()<cr>18 “ end of codeNote: You don’t need to know
    what this VimScript code does for now, basic VimScript stuff like making variables
    and functions will be explained in this book at a later stage.Warning: Don’t copy/paste
    code, type it out by hand.​ After adding this code to your “.vimrc” file and debugging
    any installation problems (if any) we can test the proof-of-concept using the
    following steps:


    1.  Make sure the code you appended to your “.vimrc” file is proper. Windows users
    can use something like `:echo $HOME ` to find their HOME directory.


    2.  Open a new file in Vim by using the command `vim ` from the Terminal.


    3.  Once in a new file use `,var ` in Normal-mode to see the magic. This command
    is used to declare variables in JavaScript and control their scope.


    4.  The system will ask you for the “scope” of the variable, you can press 1,
