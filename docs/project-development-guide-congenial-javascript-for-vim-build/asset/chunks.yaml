    \ following steps:\n\n1. Make sure the code you appended to your `.vimrc` file\
    \ is proper. Windows users can use something like `:echo $HOME ` to find their\
    \ HOME directory.\n2. Open a new file in Vim by using the command `vim ` from\
    \ the Terminal.\n3. Once in a new file use `,var ` in Normal-mode to see the magic.\
    \ This command is used to declare variables in `JavaScript` and control their\
    \ scope.\n4. The system will ask you for the “scope” of the variable, you can\
    \ press 1, 2, or 3 for `var`, `let`, or `const`, then press Enter. For the first\
