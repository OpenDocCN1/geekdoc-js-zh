  trans: "\n它在看板板（Kanban Board）上应该是这样的：![](img/Image00004.jpg) 我会给你一个待实现的功能待办列表（backlog），这些功能将以卡片/故事的形式给出。例如，它在看板板上看起来如下：![](img/Image00005.jpg)\n\
    \n在“写入”（Write）步骤，你将从待办事项列表中选取一个模块/功能卡片，将其从“待办事项”列移动到“写入”列，并对其进行编码。假设你选择了“功能 A”，看板板将如下所示：![](img/Image00006.jpg)\n\
    \n在“测试”（Test）步骤，你将从“写入”列中选取一个功能卡片并将其置于“测试与调试”（Test and Debug）列，对该功能进行测试，并在时对代码进行调试。如果你选择了“功能\
    \ A”，那么看板将如下所示：![](img/Image00007.jpg)\n\n当你完成“功能 A”的开发后，你将它的卡片移动到“完成”（Done）列，然后你就有了一些个人带宽来开始处理待办列表中的另一个功能。“问题”（Problem）列用于存放不属于任何其他列的内容，如有需要，可以在那里留下一片备注。\n\
    \n使用看板方法，你可以为每个团队/成员分配一个单一列进行工作，这也称为垂直分配（Vertical assignment）；或者你可以将单个功能分配给一个团队/成员，由他/她带它通过每一个列，直到进入“完成”列，这称为水平分配（horizontal\
    \ assignment）。每个团队都有自己的分配任务和自己的子看板板。\n\n我项目中的层次结构使用了一套术语：中心看板被称为“源板”（Origin-Board），子看板被称为“宏观板”（Macro-Boards），子子板被称为“中级板”（Meso-Boards），子子子子板被称为“微观板”（Micro-Boards）。不过，这显然是造出来的术语！这种想法是为了维护上级看板的优越性，因此中级板永远不会与微观板不同步。我做这一切是因为我不喜欢别人碰我的源板，随你怎么想吧！\n\
    \n书末提供了这种看板板的模板，你可以将其打印出来自己使用。你也可以使用像 Task Warrior 这样的程序进行单人、单调的项目管理。\n\n## 模块\n\
    以下是我们正在处理的模块列表：\n\n1. `congenial-JavaScript.vim` (黄色)\n2. `modules/sourceCodeGenerator.vim`\
    \ (绿色)\n3. `docs/outline.txt` (蓝色)\n\n每个模块都可以分配一种卡片颜色，然后待办事项列表就可以填充将在这些模块中实现的功能。我已经为你创建了以下待办事项；我们将在下一章之后开始工作。![](img/Image0008.jpg)\n\
    \n## 第 2 章 - 项目启动\n在本章中，我们将初始化项目的源仓库（Repository），与所有成员共享仓库，然后与我们的共同开发者分配任务。\n\n\
    如果你愿意，可以使用 Git 初始化你的项目，虽然这不是强制要求的。你可以使用 Git 或任何其他版本控制系统；强烈建议使用版本控制系统，除非你熟悉它们，否则不要使用。这里没有提供版本控制的说明，因此不会给出检出（check-out）、合并（merge）、推送（push）等步骤，你需要自己处理版本控制，如果你不知道怎么做就暂时避免，这是一个小型项目。没有提供创建\
    \ `contributors.md`、`LICENSE`、`README.md` 等文件的说明，因为它们在个人项目中不是必须的，但如果你把项目放在 GitHub\
    \ 上，你可以提供这些文件。\n\n### 初始化项目\n以下是我们初始化项目将采取的步骤：\n\n1. 在你的 `HOME` 目录下创建一个名为 `congenial-JavaScript`\
    \ 的目录。\n2. 在 `congenial-JavaScript` 内部创建以下目录：\n    - `docs`\n    - `modules`\n\
    3. 在 `congenial-JavaScript` 内部创建以下文件：\n    - `congenial-JavaScript.vim`\n    -\
    \ `docs/outline.txt`\n    - `modules/sourceCodeGenerator.vim`\n4. 进入 `~/.vim/after/ftplugin/javascript/`\
    \ 目录，如果它不存在，或者它的任何父目录不存在，则创建它们。\n5. 在此目录下为你第 #1 步创建的 `congenial-JavaScript` 目录创建一个符号链接（即快捷方式）。使用命令：\n\
    ```bash\nln -s ~/congenial-JavaScript congenial-JavaScript\n```\n6. 现在在 `~/.vim/after/ftplugin/javascript/`\
    \ 中创建一个名为 `plugins.vim` 的文件。该文件用于激活 JavaScript 文件的插件。插件应像步骤 #8 那样在 `plugins.vim`\
    \ 中导入。\n7. 现在你应该拥有了 `.vim` 和 `congenial-JavaScript` 的如下目录结构：\n```\n~/|_ .vim/|\
    \ |_ after/| | !_ after/|   !_ ftplugin/| |      |_ javascript/| |      | |_ congenial-JavaScript/|\
    \ |      | !_ plugins.vim (用于激活插件)| |      |_…| |_ autoload/| |_ colors/| |_ ftplugin/|\
    \ |…|_ .vimrc (用于 vim 代码，与我们无关)|_ congenial-Javascript/| |_ congenial-JavaScript.vim\
    \ (中心插件文件)| |_ docs/| | !_ outline.txt (congenial-JavaScript 文档)| !_ modules/|\
    \   !_ sourceCodeGenerator.vim (重要模块)|_…\n```\n8. 在 `plugins.vim` 中添加以下代码行并保存：\n\
    ```vim\n1 \" 这是一个包含为 JavaScript 激活的插件列表的文件\n2 \" 语法是编写插件名称，后跟源（source）该插件的中心文件\n\
    3 \" 程序 congenial-JavaScript 最初由 RayVoice “GitHub/Ray6464” “@rayshorthead” “rayvanet@gmail.com”\
    \ 根据 MIT 许可证开发\n4 \" congenial-JavaScript5\n5 so ~/.vim/after/ftplugin/javascript/congenial-JavaScript/congenial-JavaScript.vim\n\
    ```\n9. 第 #5 行的代码实际上在 `plugins.vim` 脚本中导入了 `congenial-JavaScript.vim` 脚本。你也可以在此文件中添加你开发的插件。\n\
    10. 当我们在 Vim 中打开 JavaScript 文件时，它将执行 `plugins.vim`，从而激活 congenial-JavaScript 插件。\n\
    11. 现在项目启动完成。\n\n### 分配任务\n现在让我们分配开发任务，正如我向你承诺的，没有任何会在屏幕外发生，我已经联系了我的朋友 Siena 来参与这个项目，以下是她的回复：![](img/Image00009.jpg)\n\
    \n遗憾的是，我无法分享来自私人论坛的真实图片，但对话是这样的：\n\n1. 我发了概念验证方案给她测试，她很喜欢它。\n2. 我告诉她我需要涵盖的内容，比如创建变量、循环等，并承诺稍后发送完整列表。\n\
    3. 她和我同意建立一套通信系统，我们基本上同意采用一种通信方式，即建立一个受 Git 控制的私有远程仓库，我编写代码来实现所需的功能，她将以 FIFO（先进先出）的方式为这些功能编写测试，并将它们推送/上传到远程仓库。不过，为了演示，我会至少写一个测试。\n\
    \n让我们开始开发吧！\n\n## 第 3 章 – 软件编程\n在本章中，我们将涵盖 VimScript 的基础，然后是软件的实际编程，最后是测试。“写入/测试”循环将针对每个功能重复，直到涵盖了满意数量的功能。为了表达我的观点，我们保持了代码部分的简练，如果你遇到任何问题，请考虑增加对\
    \ VimScript 的接触。\n\n### VimScript 基础\n在下面的列表中描述了 VimScript 的基本功能，这并不是教程。任何具有某些编程经验的人应该理解这些。\n\
    \n1. `so` 关键字是 `source` 的缩写，它实际上是将一个脚本导入另一个脚本中，但这个定义并不是字面上的。VimScript 中的导入工作有所不同。\n\
    2. `nnoremap` 关键字告诉 Vim 在普通模式（Normal-mode）下在键序列和命令之间建立联系。\n3. `inoremap` 关键字告诉\
    \ Vim 在插入模式（Insert-mode）下在键序列和命令之间建立联系。\n4. `function!` 关键字用于开始编写函数，`endfunction`\
    \ 关键字用于结束它。\n"
- fmt: "\n## Vim Keywords\n\n5. The `echo` keyword is used to log stuff to Vim.\n\n\
    6. The `let` keyword is used to declare and reassign variables.\n\n7. The `call`\
    \ keyword is used to call functions.\n\n8. The `abort` keyword at the end of the\
    \ function declaration is for aborting a function’s process if an error occurs.\n\
    \n9. Further explanations will be given when needed, but only brief ones, for\
    \ a full guide on Vim and VimScript use the following book.\n\n*Simply Vim : A\
    \ Comprehensive Guide to Mastering the Vim text-editor* – Ray Voice\n\n## Program\
    \ to Generate a Variable In JavaScript\n\nIn JavaScript we have 3 kinds of basic\
    \ variables, they are declared with the `var` | `let` | `const` keywords. The\
    \ variables control the scope of access and mutability of values, however that\
    \ is all irrelevant here! We only need to code it. Each module will go through\
    \ the write/test cycle followed by explanations.\n\n### Write\n\nFollow these\
    \ steps to write the first feature:\n\n1. Inside `congenial-JavaScript.vim` add\
    \ the following lines of code and save it:\n\n```bash\nso ~/.vim/after/ftplugin/javascript/congenial-JavaScript/modules/sourceCodeGenerator.vim\n\
    ```\n\n2. Add the following code to your `congenial-JavaScript.vim` file too:\n\
    \n```vim\nnnoremap ,var :call GenerateVariableWithScope()<cr>\n```\n\n3. Add the\
    \ following code to your `modules/sourceCodeGenerator.vim` file:\n\n```vim\n\"\
    \ The program congenial-JavaScript was originally developed by RayVoice “GitHub/Ray6464”\
    \ “@rayshorthead” “rayvanet@gmail.com” on MIT License\nfunction ! AddToDoc(dataToAdd)\
    \ abort\n    execute 'normal i' .a:dataToAdd\nendfunction\n\nfunction ! GenerateVariableWithScope()\
    \ abort\n    let sSel = input( 'var/let/const Pick 1/2/3: ' )\n    let sOps =\
    \ [ 'var' , 'let' , 'const' ]\n    let sStd = sOps[sSel-1]\n\n    let vName =\
    \ input( 'Name of Variable: ' )\n    let vVal = input( 'Value of Variable: ' )\n\
    \n    call AddToDoc(sStd. ' ' .vName. ' = ' .vVal. ';' )\nendfunction\n```\n\n\
    4. In this code we have used abbreviations to fit the code in the page, however\
    \ to avoid confusion I suggest you reverse the abbreviations, so instead of “sSel”\
    \ write “scopeScelection”. Following is a list of abbreviations: \n\n    1. `sOps`\
    \ = `scopeOptions`\n    2. `sStd` = `scopeSelected`\n    3. `vName` = `variableName`\
    \ or `varName`\n    4. `vVal` = `variableValue` or `varValue`\n\n5. Remember that\
    \ Readability is very important to code, make sure your code is readable like\
    \ a story. In the latter chapters, I will show you how to write clean and readable\
    \ code that reads like a story.\n\n6. Now after saving both files, make a file\
    \ named “something.js”. In Vim you can use `:e something.js`.\n\n7. Now in Normal-mode\
    \ in `something.js` use `,var `, almost immediately Vim should ask you the following\
    \ questions:\n\n    1. Scope\n    2. Name\n    3. Value\n\n8. Give it the Scope\
    \ value: `1`\n9. Give it the Name value: `health`\n10. Give it the Value value:\
    \ `100`\n\n11. Now you should see the following:\n\n```javascript\nvar health\
    \ = 100;\n```\n\n12. If everything is working then congratulations, if not then\
    \ debug your code. VimScript is very easy to debug, help can easily be found online,\
    \ you can also raise an issue on GitHub at `Ray6464/congenial-JavaScript`.\n\n\
    ### Test and Debug (AddToDoc)\n\nThe following instructions will teach you how\
    \ to test the `AddToDoc()` function shown in step #3 of the previous section.\n\
    \n1. In your `modules` directory make a file named `tests.vim`.\n\n2. Inside `congenial-JavaScript.vim`\
    \ add the following lines of code and save it:\n\n```bash\nso ~/.vim/after/ftplugin/javascript/congenial-JavaScript/modules/tests.vim\n\
    ```\n\n3. In the `tests.vim` file add the following code:\n\n```vim\nfunction\
    \ ! Report(functionName) abort\n    echo \"Report: The Function [\" . a:functionName\
    \ . \"] is working.     (PASS)\"\nendfunction\n\nfunction ! Error(functionName)\
    \ abort\n    echo \"Error: The Function [\" . a:functionName. \"] is not working.\
    \  (FAIL)\"\nendfunction\n\nfunction ! ClearFile() abort\n    execute 'normal\
    \ ggdG'\nendfunction\n\nfunction ! TestAddToDoc() abort\n    let testName = \"\
    AddToDoc\" ;\n    call AddToDoc( \"Hello World\" )\n    if getline ( \"1\" ) ==\
    \ \"Hello World\"\n        call Report(testName)\n    else\n        call Error(testName)\n\
