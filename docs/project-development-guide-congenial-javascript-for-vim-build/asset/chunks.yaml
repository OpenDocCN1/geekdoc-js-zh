    Other suggestions


    1.  Use GitHub Pages to provide free hosting to your project’s website. Like `emmet.io`,
    `cylonjs.com`, etc.


    2.  You can also look at free hosting alternatives like Tumbler, nearlyfreespeech.net,
    000webhostapp, blogspot, etc.


    3.  If you have a commercial project I suggest you to buy a VPS (not VPN), which
    is basically a Private Server where you have root access, use “Namecheap” for
    a VPS and “Epik” for domain names (not affiliated marketing advertisements).


    4.  Fill your project with good copy (as in copy-writing), you can write this
    copy yourself or ask someone with copy-writing experience to do this for you.


    5.  Once your project is complete send it out to peers or review, post it on Reddit,
    find people on Angel-list and send them your portfolio.


    6.  Make sure to act on useful criticism, don’t let criticism discourage you!
    The art of scouring and accepting criticism is one of the most useful skills in
    life.


