  trans: "\n\n## Vim 关键字\n\n5. `echo` 关键字用于向 Vim 记录内容。\n\n6. `let` 关键字用于声明和重新赋值变量。\n\
    \n7. `call` 关键字用于调用函数。\n\n8. 函数声明末尾的 `abort` 关键字用于在发生错误时终止函数的执行过程。\n\n9. 需要时会提供进一步的解释，但仅是简要的。关于\
    \ Vim 和 VimScript 使用的完整指南，请参考以下书籍。\n\n*Simply Vim : A Comprehensive Guide to Mastering\
    \ the Vim text-editor* – Ray Voice\n\n## 在 JavaScript 中生成变量程序\n\n在 JavaScript\
    \ 中，我们有 3 种基础变量，它们通过 `var` | `let` | `const` 关键字声明。变量控制着访问范围和值的可变性，但在这里这些都不重要！我们只需要编写代码即可。每个模块将经过“编写/测试”循环，然后进行解释。\n\
    \n### 编写 (Write)\n\n按照以下步骤编写第一个功能：\n\n1. 在 `congenial-JavaScript.vim` 中添加以下代码并保存：\n\
    \n```bash\nso ~/.vim/after/ftplugin/javascript/congenial-JavaScript/modules/sourceCodeGenerator.vim\n\
    ```\n\n2. 为你的 `congenial-JavaScript.vim` 文件也添加以下代码：\n\n```vim\nnnoremap ,var :call\
    \ GenerateVariableWithScope()<cr>\n```\n\n3. 向你的 `modules/sourceCodeGenerator.vim`\
    \ 文件添加以下代码：\n\n```vim\n\" The program congenial-JavaScript was originally developed\
    \ by RayVoice “GitHub/Ray6464” “@rayshorthead” “rayvanet@gmail.com” on MIT License\n\
    function ! AddToDoc(dataToAdd) abort\n    execute 'normal i' .a:dataToAdd\nendfunction\n\
    \nfunction ! GenerateVariableWithScope() abort\n    let sSel = input( 'var/let/const\
    \ Pick 1/2/3: ' )\n    let sOps = [ 'var' , 'let' , 'const' ]\n    let sStd =\
    \ sOps[sSel-1]\n\n    let vName = input( 'Name of Variable: ' )\n    let vVal\
    \ = input( 'Value of Variable: ' )\n\n    call AddToDoc(sStd. ' ' .vName. ' =\
    \ ' .vVal. ';' )\nendfunction\n```\n\n4. 在此代码中，我们使用了缩写以适应页面，但为了避免混淆，我建议你反转缩写，例如不要写“sSel”而写“scopeScelection”。以下是缩写列表：\n\
    \n    1. `sOps` = `scopeOptions`\n    2. `sStd` = `scopeSelected`\n    3. `vName`\
    \ = `variableName` 或 `varName`\n    4. `vVal` = `variableValue` 或 `varValue`\n\
    \n5. 记住，代码的可读性非常重要，确保你的代码像故事一样易读。在后面的章节中，我将向你展示如何编写像故事一样清晰易读的代码。\n\n6. 现在保存两个文件后，创建一个名为“something.js”的文件。在\
    \ Vim 中你可以使用 `:e something.js`。\n\n7. 现在在 `something.js` 的普通模式下使用 `,var `，Vim\
    \ 几乎会立即询问以下问题：\n\n    1. 范围 (Scope)\n    2. 名字 (Name)\n    3. 值 (Value)\n\n8.\
    \ 给范围赋值：`1`\n9. 给名字赋值：`health`\n10. 给值赋值：`100`\n\n11. 现在你应该会看到：\n\n```javascript\n\
    var health = 100;\n```\n\n12. 如果一切运行正常，那么恭喜你；如果没有，请调试你的代码。VimScript 非常容易调试，可以在网上找到帮助，你也可以在\
    \ GitHub 的 `Ray6464/congenial-JavaScript` 上提交 issue。\n\n### 测试与调试 (Test and Debug\
    \ AddToDoc)\n\n以下指令将教你如何测试上一节第 #3 步所示的 `AddToDoc()` 函数。\n\n1. 在你的 `modules` 目录下创建一个名为\
    \ `tests.vim` 文件。\n\n2. 在 `congenial-JavaScript.vim` 中添加以下代码并保存：\n\n```bash\n\
    so ~/.vim/after/ftplugin/javascript/congenial-JavaScript/modules/tests.vim\n```\n\
    \n3. 在 `tests.vim` 文件中添加以下代码：\n\n```vim\nfunction ! Report(functionName) abort\n\
    \    echo \"Report: The Function [\" . a:functionName . \"] is working.     (PASS)\"\
    \nendfunction\n\nfunction ! Error(functionName) abort\n    echo \"Error: The Function\
    \ [\" . a:functionName. \"] is not working.  (FAIL)\"\nendfunction\n\nfunction\
    \ ! ClearFile() abort\n    execute 'normal ggdG'\nendfunction\n\nfunction ! TestAddToDoc()\
    \ abort\n    let testName = \"AddToDoc\" ;\n    call AddToDoc( \"Hello World\"\
    \ )\n    if getline ( \"1\" ) == \"Hello World\"\n        call Report(testName)\n\
    \    else\n        call Error(testName)\n    endif\nendfunction\n\nfunction !\
    \ TestStart() abort\n    call AddToDoc()\n    call ClearFile()\nendfunction\n\
    ```\n\n4. `tests.vim` 文件能够调用 `sourceCodeGenerator.vim` 文件中的函数，是因为它们都被 `congenial-JavaScript.vim`\
    \ 文件激活了，而后者是由 `plugins.vim` 文件激活的，而后者由于位于 `~/.vim/after/ftplugin/javascript/`\
    \ 目录，在打开 JavaScript 文件时会被激活。这虽然复杂，但它是我们最好的方法了！\n\n## 解释编写过程 (Explaining Write)\n\
    \n1. `congenial-JavaScript.vim` 文件导入了 `sourceCodeGenerator.vim` 脚本。\n2. `,var`\
    \ 键绑定调用了 `GenerateVariableWithScope()`。\n3. 在 `sourceCodeGenerator.vim` 文件中：\n\
    \    - `AddToDoc(dataToAdd)` 使用 `normal i` 插入文本。\n    - `GenerateVariableWithScope()`\
    \ 请求范围、名字和值，然后调用 `AddToDoc()`。\n4. `tests.vim` 文件包含：\n    - `Report(functionName)`\
    \ 用于记录成功。\n    - `Error(functionName)` 用于记录失败。\n    - `ClearFile()` 使用 `ggdG`\
    \ 清空文件。\n    - `TestAddToDoc()` 测试 `AddToDoc` 是否工作。\n    - `TestStart()` 协调测试套件。\n\
    \n"
- fmt: "\n10. `:.w !bash ` can be used to run commands on the current line through\
    \ `bash`, however this is not required here. The command writes the text on current\
    \ line in a `bash` `StdIn`, we can write it on the `StdIn` of any program.\n\n\
    11. We can also use `new “somefile.js”` to automate opening of a test file during\
    \ development. We aren’t using it here because I like to do it manually. `quit!\
    \ `\n\n12. Notice how clear file is commented out, it’s still in progress in the\
    \ greater scheme of things.\n\n## Test and Debug (GenerateVariableWithScope)\n\
    \nThe following instructions can be used to write a test that can automate Steps\
    \ #7 to #11 in the previous `Write` section, these steps will be used to test\
    \ the function `GenerateVariableWithScope()`.\n\n1. First of all we need to update\
    \ our code in the `modules/sourceCodeGenerator.vim` file, here we have rewritten\
    \ the `GenerateVariableWithScope()` function:\n\n```vim\nfunction ! GenerateVariableWithScope(\
    \ ... ) abort2\n    if a:0 > 03\n        let scopeSelection = a:14\n        let\
    \ varName = a:25\n        let varValue = a:36\n    else7\n        let scopeSelection\
    \ = input ( 'var/let/const Pick 1/2/3: ' )9\n        let varName = input ( 'Name\
    \ of Variable: ' )10\n        let varValue = input ( 'Value of Variable: ' )11\n\
    \    endif12\n    let scopeOptions = [ 'var' , 'let' , 'const' ]13\n    let scopeSelected\
    \ = scopeOptions[scopeSelection-1]14\n    call AddToDoc(scopeSelected. ' ' .varName.\
    \ ' = ' .varValue. ';' )15\nendfunction\n```\n\n2. This new version of `GenerateVariableWithScope()`\
    \ is improved so it provides an interface for testing. From now on, we will be\
    \ using “Test-Driven Development” approach, where unit-tests are written before\
    \ actual source code!\n\n3. If you want to use unit-testing in your development\
    \ I suggest using `Jenkins` (MIT) and `Selenium`.\n\n4. Notice the `...` symbol\
    \ on line #1, this allows functions to take in up-to 20 optional arguments. The\
    \ argument are accessible via `a:1, a:2, a:3, …, a:20`, while `a:0` stores the\
    \ number of arguments passed to the function.\n\n5. Here on line #2 the code checks\
    \ the number of arguments passed to the function, if that number is greater than\
    \ 0, then we run the automated test version of the function, else we run the function\
    \ that takes input from the user.\n\n6. Now, in `modules/tests.vim` add the following\
    \ code before the function `TestStart()`, ignore the line numbers, write the function\
    \ where you see fit.\n\n```vim\nfunction ! TestGenerateVariableWithScope() abort2\n\
    \    let testName = \"GenerateVariableWithScope\"3\n    call GenerateVariableWithScope(\
    \ 1 , \"Health\" , 100 )4\n    call NextLine()5\n    call GenerateVariableWithScope(\
    \ 2 , \"alive\" , \"true\" )6\n    call NextLine()7\n    call GenerateVariableWithScope(\
    \ 3 , \"class\" , \"'hero'\")8\n    let expectedOutput = \"var Health = 100;let\
    \ alive = true;const class = 'hero';\"9\n    if getline( \"2\" ).getline( \"3\"\
    \ ).getline( \"4\" ) == expectedOutput10\n        call Report(testName)11\n  \
    \  else12\n        call Error(testName)13\n    endif14\nendfunction\n```\n\n7.\
    \ Now in `modules/tests.vim` modify the `TestStart()` function so it looks like\
    \ this:\n\n```vim\nfunction ! TestStart()\n  call WriteTestHeaderToFile()\n  call\
    \ TestAddToDoc()\n  call NextLine()\n  call TestGenerateVariableWithScope()\n\
    \  call ReadTestReport()\"\n  call ClearFile()endfunction\n```\n\n8. A few more\
    \ functions are added to the `tests.vim` file, it ultimately looks like this:\n\
    \n```vim\nfunction ! Report(functionName) abort2\n    let result = \"Report: The\
    \ Function [\" . a:functionName . \"] is working. (PASS)\"3\n    call WriteToFile(result)4\n\
    endfunction\n\nfunction ! Error(functionName) abort7\n    let result = \"Error:\
    \ The Function [\" . a:functionName . \"] is not working. (FAIL)\"8\n    call\
    \ WriteToFile(result)9\nendfunction10\n\nfunction ! WriteToFile(data) abort12\n\
    \    \" Test Report is saved in the local project Dir13\n    call writefile([\
    \ a:data ], \"testReport.txt\" , \"a\" )14\n    \" appends logs to file15\nendfunction16\n\
    \nfunction ! WriteTestHeaderToFile() abort18\n    call WriteToFile( '' )19\n \
    \   call WriteToFile( '----------------------' )20\n    call WriteToFile(strftime(\
    \ '%c' ))21\n    call WriteToFile( '----------------------' )22\nendfunction\n\
    \nfunction ! ReadReport() abort25\n    \" Opens Test in New Window26\nendfunction\n\
    \nfunction ! ClearFile() abort29\n    \" ... normal '30Gd'33\nendfunction\n\n\
    function ! NextLine() abort34\n    \" ... normal ''35\nendfunction\n\nfunction\
    \ ! TestAddToDoc() abort37\n    \" ... 38\nendfunction\n```\n"
