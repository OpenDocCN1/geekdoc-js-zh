  trans: "\n# NodeJS\n\n`NodeJS`（发布于 2009 年）是一个 JavaScript 框架，它允许我们在服务器上运行 JavaScript。在\
    \ `NodeJS` 出现之前，JavaScript 只能用于创建花哨的网站，它基本上充当着带有额外功能的样式代理；但现在 JavaScript 已经是世界上最强大的语言之一，甚至可能是最强大的（从某种意义上说）。\n\
    \n如果你想学习 `NodeJS`，可以参考书籍：“Simply Web Development : An introduction to the world\
    \ of Web development - Anna Voice, Ray Voice”。这本书对你学习前后端 Web 开发需要的所有主题都提供了全面的入门级课程，并且它是完整系列的一部分，可以在你通成为全栈工程师的旅程中使用。\n\
    \n在继续学习 `NodeJS` 之前，你可能想学习一些内容，例如用于包管理的 `NPM`、用于版本管理的 `NVM` 等。注意：此处的代码可能会进行一些屏幕之外的修改，但并不算严重；你可以自行理解，或者修改代码使其在没有这些修改的情况下运行。\n\
    \n## 内置变量\n\n`NodeJS` 有几个内置的全局变量；为了在 congenial-JavaScript 中添加这些功能，我们可以使用以下代码：\n\
    \n```vim\nmodules/sourceCodeGenerator.vim:1   function ! GenBuiltInVars() abort\n\
    2    let objectChoices = [ 'console' , 'global' , 'process' , 'document' ]\n3\
    \    let objectChoiceIndex = input( 'console/global/process/document' . ' Pick\
    \ 1/2/3/etc: ' )\n4     let objectChoice = objectChoices[objectChoiceIndex -1\
    \ ]\n5     call AddToDoc(objectChoice)\n6   endfunction\ncongenial-JavaScript.vim:nnoremap\
    \ ,gvar : call GenBuiltInVars()< cr >\ninoremap < c - y >gvar <esc>: call GenBuiltInVars()<\
    \ cr >\n```\n\n在这里，我们可以选择生成后端开发所需的各种变量；像 `global`、`process` 等对象是 `NodeJS` 的核心。\n\
    \n### Process 属性\n\n`process` 对象有几个基本属性，如 `argv`、`env`、`platform` 等。以下代码用于生成 process\
    \ 属性（包括 `process` 对象）：\n\n```vim\nmodules/sourceCodeGenerator.vim:1   function\
    \ ! GenProcessVars() abort\n2    let objectChoices = [ 'argv' , 'env' , 'emitWarning()'\
    \ , 'pid' , 'platform' ]\n3    let objectChoiceIndex = input( 'argv/env/emitWarning/pid/platform'\
    \ . ' Pick 1/2/3/etc: ' )\n4     let objectChoice = objectChoices[objectChoiceIndex\
    \ -1 ]\n5     call AddToDoc( 'process.' .objectChoice)\n6   endfunction\ncongenial-JavaScript.vim:nnoremap\
    \ ,pvar : call GenProcessVars()< cr >\ninoremap < c - y >pvar <esc>: call GenProcessVars()<\
    \ cr >\n```\n\n### 事件\n\n`NodeJS` 是一个运行时，具有将重型操作移动到另一个线程的能力（也称为非阻塞运行时和事件循环），使得\
    \ `NodeJS` 非常适合服务器。\n\n要生成 `NodeJS` 事件，我们可以使用以下代码：\n\n```vim\nmodules/sourceCodeGenerator.vim:1\
    \   function ! GenEventVars() abort\n2    let objectChoices = [ 'exit' , 'beforeExit'\
    \ , 'abort' ]\n3    let objectChoiceIndex = input( 'Events exit/beforeExit/abort'\
    \ . ' Pick 1/2/3/etc: ' )\n4     let objectChoice = objectChoices[objectChoiceIndex\
    \ -1 ]\n5     call AddToDoc( 'process.on(\"' .objectChoice. '\", function() {});'\
    \ )\n6   endfunction\ncongenial-JavaScript.vim:nnoremap ,event :call GenEventVars()<cr>\n\
    inoremap < c - y >event <esc>: call GenProcessVars()< cr >\n```\n\n## 代码重构\n\n\
    在这里，我看到在本章描述的函数之间出现了一种模式，因此我将代码重构为：\n\n```vim\nmodules/sourceCodeGenerator.vim:1\
    \   function ! ObjectWriter(objectChoices, index, preCode, postCode) abort\n2\
    \     let objectChoice = a :objectChoices[ a :index]\n3     call AddToDoc( a :preCode.objectChoice.\
    \ a :postCode)\n4   endfunction\n5   \n6   function ! GenerateBuiltInVariables()\
    \ abort\n7     let objectChoices = [ 'console' , 'global' , 'process' , 'window'\
    \ , 'document' ]\n8     let objectChoiceIndex = input( 'console/global/process/window/document'\
    \ . ' Pick 1/2/3/etc: ' )\n9      call ObjectWriter(objectChoices, objectChoiceIndex\
    \ -1 , '' , '' )\n10 endfunction\n11   \n12 function ! GenerateProcessVariables()\
    \ abort\n13   let objectChoices = [ 'argv' , 'env' , 'emitWarning()' , 'pid' ,\
    \ 'platform' , 'arch' ]\n14   let objectChoiceIndex = input( 'argv/env/emitWarning/pid/platform/arch'\
    \ . ' Pick 1/2/3/etc: ' )\n15   call ObjectWriter(objectChoices, objectChoiceIndex\
    \ -1 , 'process.' , '' )\n16 endfunction\n17   \n18 function ! GenerateEventVariables()\
    \ abort\n19   let objectChoices = [ 'exit' , 'beforeExit' , 'abort' ]\n20   let\
    \ objectChoiceIndex = input( 'Events exit/beforeExit/abort' . ' Pick 1/2/3/etc:\
    \ ' )\n21   call ObjectWriter(objectChoices, objectChoiceIndex -1 , 'process.on(\"\
    ' , '\", function() {});' )\n22 endfunction\n```\n\n注意：诚实地说，我是为了这本书特意开发这种模式的。现在，这些代码可以进一步重构和简化，但目前足够了。\n\
    \n## 自定义事件器 (Event Emitter）\n\n要生成自定义的 `NodeJS` 事件器，我们可以使用以下代码：\n\n```vim\nmodules/sourceCodeGenerator.vim:1\
    \   function ! GenEventEmitter() abort\n2    call AddToDoc( \"const { EventEmitter\
    \ } = require('events')\" )\n3      call NewLine()\n4      call AddToDoc( 'const\
    \ eventEmitter = new EventEmitter();' )\n5      call NewLine()\n6      call AddToDoc(\
    \ \"eventEmitter.on('launch', () => {\" )\n7      call NewLine()\n8      call\
    \ AddToDoc( \"console.log('Server launched')\" )\n9      call NewLine()\n10  \
    \   call AddToDoc(})\" )\n11     call NewLine()\n12     call AddToDoc( \"eventEmitter.emit('launch')\"\
    \ )\n13 endfunction\ncongenial-JavaScript.vim:nnoremap ,emit : call GenEventEmitter()<\
    \ cr >\ninoremap < c - y >emit <esc>: call GenEventEmitter()< cr >\n\n## 使用带有\
    \ HTTP 代码的服务器\n\n要生成 HTTP 服务器代码，可以使用以下代码：\n注意：我在 `AddToDoc()` 中构建了一个新功能，用于在末尾追加行。\n\
    \n```vim\nmodules/sourceCodeGenerator.vim:1   function ! GenServerCode() abort\n\
    2   let serverPort = input( \"Which port to use (8080,300, etc.):\" )\n3   call\
    \ AddToDoc( \"var http = require('http');\" )\n4   call NewLine()\n5   call NewLine()\n\
    6   call AddToDoc( \"http.createServer(function (req, res) {\" )\n7   call AddToDoc(\
    \ \"  res.writeHead(200, {'Content-Type': 'text/html'});\" )\n8   call AddToDoc(\
    \ \"  res.write('server at \" .serverPort. \" is up');\" )\n9   call AddToDoc(\
    \ \"  res.end();\" )\n10  call AddToDoc( \"}).listen(\" .serverPort. \");\" )\n\
    11 endfunction\ncongenial-JavaScript.vim:nnoremap ,server : call GenServerCode()<\
    \ cr >\ninoremap < c - y >server <esc>: call GenServerCode()< cr >\n\n## FS 模块代码\n\
    \n`NodeJS` 最强大的模块之一是文件系统（`FS` 模块）；它提供了阻塞（`sync`）和非阻塞（`async`）方法来处理文件。在这里我们将为它开发一些读取和写入方法。请查看\
    \ `https://nodejs.org/fs.html`。\n\n```vim\nmodules/sourceCodeGenerator.vim:1 \
    \  function ! GenModuleCode() abort\n2   \"needs methods\"\n3   let fsMethods\
    \ = input( '(1) Read File, (2) Write File 1/2: ' )\n4   let blocking = input(\
    \ 'blocking (sync) or non-blocking (async) 1/2: ' )\n5   let fileName = input(\
    \ 'fileName: ' )\n6   \n7   if fsMethods == '2'\n8     let textOutput = input(\
    \ 'What text do you want written to file: ' )\n9     let dataVarName = input(\
    \ 'Name of the variable will store: ' )\n10  endif\n11  \n12  if fileName == ''\n\
    13     let fileName = './database.json'\n14  endif\n15  \n16  if blocking == '1'\n\
    17     if fsMethods == '1'\n18       call AddToDoc( \"const { readFileSync } =\
    \ require('fs');\" )\n19       call AddToDoc( \"const txt = readFileSync('\" .fileName.\
    \ \"', 'utf8');\" )\n20       call AddToDoc( \"console.log(txt);\" )\n21     elseif\
    \ fsMethods == '2'\n22       call AddToDoc( \"const { writeFileSync } = require('fs');\"\
    \ )\n23       call AddToDoc( \"const \" .dataVarName. \" = new Uint8Array(Buffer.from('\"\
    \ .textOutput.')));\" )\n24       call AddToDoc( \"writeFileSync('\" .fileName.\
    \ \"', .dataVarName. \"); )\n25     endif\n26   endif\n27  elseif blocking ==\
    \ '2'\n28     if fsMethods == '1'\n29       call AddToDoc( \"const { readFile\
    \ } = require('fs');\" )\n30       call AddToDoc( \"readFile('\" .fileName. \"\
    ', 'utf8', (err, txt)=>{\" )\n31       call AddToDoc( \"  console.log(txt);\"\
    \ )\n32       call AddToDoc( \"});\" )\n33     elseif fsMethods == '2'\n34   \
    \    call AddToDoc( \"const { writeFile } = require('fs');\" )\n35       call\
    \ AddToDoc( \"const \" .dataVarName. \" = new Uint8Array(Buffer.from('\" .textOutput.')));\"\
    \ )\n36       call AddToDoc( \"writeFile('\" .fileName. \"', .dataVarName. \"\
    , (err) => {\" )\n37       call AddToDoc( \"  if (err) throw err;\" )\n38    \
    \   call AddToDoc( \"  console.log('The file has been saved!');\" )\n39      \
    \ call AddToDoc( \"});\" )\n40     endif\n41   endif\n42 endfunction\ncongenial-JavaScript.vim:nnoremap\
    \ ,fs : call GenModuleCode()< cr >\ninoremap < c - y >emit <esc>: call GenModuleCode()<\
    \ cr >\n```\n\n这段代码允许我们生成用于读取和写入文件的 FS 方法，包括阻塞和非阻塞的方式。\n\n## JavaScript Require()\
    \ 和 Export\n\n在 JavaScript 中，我们使用 `Require()` 和 `modules.export` 从不同的文件中导入和导出数据，更多信息请阅读书籍：《Simply\
    \ ES6: Mastering JavaScript and ES6 to Its Fullest, 2nd Edition》。\n\n要生成导入和导出（非\
    \ ES 模块）的代码，可以使用以下代码：\n\n```vim\nmodules/sourceCodeGenerator.vim:1   function\
    \ ! GenRequire() abort\n2    let moduleName = input( \"Module Name: \" )\n3  \
    \  let moduleImportedAs = input( \"Import data as: \" )\n4   \n5    if moduleImportedAs\
    \ == ''\n6      let moduleImportedAs = moduleName\n7    endif\n8   \n9    call\
    \ AddToDoc( \"const \" .moduleName. \" = require('\" .moduleImportedAs. \"');\"\
    \ )\n10 endfunction\n11 \n12 function ! AddProp() abort\n13   let propName = input(\
    \ \"Prop Name: \" )\n14   let propValue = input( \"Prop value: \" )\n15   call\
    \ AddToDoc( '  '.propName. ': '.propValue. ',' )\n16   let moreProp = input( \"\
    Add another? y/n: \" )\n17   if moreProp == \"y\"\n18     call AddProp()\n19 \
    \  endif\n20 endfunction\n21 \n22 function ! GenExport() abort\n23   call AddToDoc(\
    \ 'module.exports = {' )\n24   call AddProp()\n25   call AddToDoc( '}' )\n26 endfunction\n\
    congenial-JavaScript.vim:nnoremap ,require : call GenRequire()< cr >\ninoremap\
    \ < c - y >require <esc>: call GenRequire()< cr >\nnnoremap ,export : call GenExport()<\
    \ cr >\ninoremap < c - y >export <esc>: call GenExport()< cr >\n\n## NodeJS 基础\
    \ Express 工具\n\n要为 NodeJS 生成基础 Express 服务器代码，可以使用以下代码：\n\n```vim\nmodules/sourceCodeGenerator.vim:1\
    \   function ! GenExpServer() abort\n2   call AddToDoc( \"const express = require('express');\"\
    \ )\n3   call AddToDoc( \"const app = express();\" )\n4   call NewLine()\n5  \
    \ call AddToDoc( \"app.get('/', (req, res) {\" )\n6   call AddToDoc( \"  res.sendFile('index.html',\
    \ {root: __dirname});\" )\n7   call AddToDoc( \"});\" )\n8   call NewLine()\n\
    9   call AddToDoc( \"const port = process.env.PORT || 8080;\" )\n10  call AddToDoc(\
    \ \"app.listen(port, ()=>{console.log(`System Online: ${port}`)});\" )\n11 endfunction\n\
    12 \n13 function ! GenExpGet() abort\n14   let node = input( \"Node home/aboutme/etc:\
    \ \" )\n15   let fileURL = input( 'name and URL of File index.html/main.css/etc:\
    \ ' )\n16   call AddToDoc( \"app.get('\" .node. \"', (req, res) {\" )\n17   call\
    \ AddToDoc( \"  res.sendFile('\" .fileURL. \"', {root: __dirname});\" )\n18  \
    \ call AddToDoc( \"});\" )\n19 endfunction\ncongenial-JavaScript.vim:nnoremap\
    \ ,express : call GenExpServer()< cr >\ninoremap < c - y >express <esc>: call\
    \ GenExpServer()< cr >\n```\n\n## 第 5 章 – JavaScript 函数式编程代码\n\n函数式编程是一种编写优于 OOP（并非总是如此）而且更整洁的代码方式。当需要函数式编程时，我们应该强调：\n\
    \n"
- fmt: "\n## 1. Writing higher order functions.\n\n1. Not mutating any data while\
    \ we are at it.\n\n2. Using methods like `filter`, `map`, etc. that works on a\
    \ piece of data and returns a modified version of the data without mutating the\
    \ original data.\n\nJavaScript has some built-in methods like `map()`, `filter()`,\
    \ etc. but I still prefer the usage of some custom higher order functions described\
    \ down the line. When writing code in a functional programming paradigm we must\
    \ adhere to the following rules:\n\n- Functions may not be influenced by the state\
    \ of the program.\n- Functions may not influence the state of the program.\n-\
    \ Functions must be used to break the program down into small, testable parts.\n\
    - Functions may be treated as first class citizens, which basically means just\
    \ like any other data functions will have concrete names, will be passed as arguments,\
    \ will be returned from other functions, etc.\n- Functions may not take input\
    \ from users.\n\nHaving extensive study experience with Common Lisp and Wolfram,\
    \ I prefer to lean towards functional programming for JavaScript as well. Let’s\
    \ start building some Generators for dynamic boiler-plate code. Following is some\
    \ brief terminology for Function Programming intellectuals.\n\n1. Isolated functions\
    \ - there is no dependence on the state of the program, which includes global\
    \ variables that are subject to change.\n2. Pure functions - the same input always\
    \ gives the same output.\n3. The functions that take a function as an argument,\
    \ or return a function as a return value are called Higher Order Functions.\n\
    4. When the functions are passed into another function or returned from another\
    \ function, then those functions which gets passed in or returned can be called\
    \ a lambda.\n5. Functions must not have dependencies, if a dependency is needed\
    \ then it must be passed as an argument, always declare your dependencies explicitly.\n\
    \nFollowing are some brief over-simplified guidelines for functional programming\
    \ newbies:-\n\n1. Write a lot of functions.\n2. Never mess with variables without\
    \ intent.\n3. Use `const` as much as possible.\n4. Write functions that take other\
    \ functions as arguments.\n5. Write functions that return other functions as arguments.\n\
    6. Write code in an easily testable way. Here “Tests” mean unit tests, and other\
    \ automated testing methods.\n7. Functions can be used with constructors to work\
    \ like `Classes`, in which case they will be assigned a name starting with a capital\
    \ letter.\n\nFollowing are some elementary examples of functional JavaScript code\
    \ compared to regular code:\n\nNon-functional example:\n```javascript\nlet x =\
    \ 6;\nfunction double() {\n  return ++x;\n}\n```\n\nFunctional example:\n```javascript\n\
    let x = 6;\nfunction double(input) {\n  return ++input;\n}\n```\n\nFollowing is\
    \ an example of embedding methods in the `Array` object in JavaScript.\n\n```javascript\n\
    var myArray = [ 1 , 2 , 3 , 4 ] ;\nArray . prototype . newMap = function ( callback\
    \ ){\n  let neoArray = [] ;\n  this . forEach (( e , i ) => {\n    neoArray [\
    \ i ] = callback ( e ) ;\n  }) ;\n  return neoArray ;\n} ;\nvar newArray = myArray\
    \ . myMap ( function ( item ){\n  return item * 2 ;\n}) ;\n```\n\nNotice how we\
    \ have use the `this` keyword, and the `callback` word. The `this` keyword is\
    \ used instead of `Array`. The `callback` word refers to a parameter that demands\
    \ a function as it’s value. This type of code is often used when using functional\
    \ programming.\n\nNote: I don’t recommend modifying the `Array` object without\
    \ proper care.\n\nThis concludes the section for writing code for our plugin,\
    \ the project’s offical repo is at:- https://github.com/Ray6464/congenial-JavaScript\
    \ \n\nIf you’d like to contribute feel free to make a PR. You can start by writing\
    \ code for stuff like generating `Array.forEach`, `Array.find()`, `Array.some()`,\
    \ `Array.every()`, `Array.reduce()`, `Array.includes()`, etc.\n\n## Chapter 6\
    \ - Post-development work, Writing documentation, and Making a pull request\n\n\
    In this chapter, we will work on one of the most important aspects of Project-development!\
    \ Writing documentation.\n\nIdeally, we should be working on refactoring code\
    \ before writing the documentation, but in this project I’ve decided to leave\
    \ it to the FOSS army on GitHub. I’ll do some refactoring, but leave the rest\
    \ to online contributors.\n\n### Post-development work\n\nFollowing is a list\
    \ of examples of Post-development work that I usually carry out, you should also\
    \ do it before presenting your work.\n\n#### Examples of Post-development work\n\
    \n1. Checking each comment and realizing if they are beneficial, removing any\
    \ useless comments.\n2. Deal with any commented out code.\n3. Make sure your comments\
    \ aren’t misdirecting others.\n4. Making sure your code follows the 3 R’s of Clean\
    \ code, Readability, Re-usability, and Refactoring!\n\n### Refactoring Comments\n\
    \nWhen dealing with comments remember the following quote:“Write code not comments”\n\
    \nInstead of describing or informing you, I’ll just show you what I mean in the\
    \ following case-studies of our code.\n\nNote: This code is written for instructive\
    \ purposes. Warning: Don’t get distracted by line numbering in the following snapshots.\n\
    \n#### Case 1\n\nIn this case, we are looking at the `modules/tests.vim` file.\n\
    \nCode (before):\n```vim\n\"----------------------\"\nlet numberOfTestsPassed\
    \ = 0\n\"----------------------\"\n\"----------------------\"\nlet numberOfTestsFailed\
    \ = 0\n\"----------------------\"\n...Several lines Below...\n\"each test is ran\
    \ on a different line\n\"----------------------\"\nlet lineNumber = 1\n\"----------------------\"\
    \n```\n\nCode (After):\n```vim\n\"----------------------\"\nlet numberOfTestsPassed\
    \ = 0\nlet numberOfTestsFailed = 0\nlet lineNumber = 1\n\"----------------------\"\
    \n```\n\nNow compare the “before” and “after” snapshot, in the “before” snapshot\
    \ we have a ton of lines which makes it look incommodious, in the “after” snapshot\
    \ we have reduced the lined down to 5 (including beautified comments).\n\nAnother\
    \ change is the change of name and line number of the variable `lineNumber`; the\
    \ name is changed to `headOverLineNumber` where “head” refers to the “head” of\
    \ the device used to explain the Turing Machine concept. This demands that we\
    \ change the variable name everywhere, in Vim we can use %s/lineNumber/headOverLineNumber/g\
    \ to do this.\n\n#### Case 2\n\nIn this case, we are looking at the `modules/tests.vim`\
    \ file.\n\nCode (before):\n```vim\n\" lines are incremented here so the test-head\
    \ moves from line #1 -> #2, #2 -> #3, ...\nlet g :headOverLineNumber = g :headOverLineNumber\
    \ + 1\n```\n\nNote: This code is present in the `GenerateReport()` and `GenerateMultiLineReport()`\
    \ functions.\n\nCode (after):\n```vim\nfunction ! MoveHeadToNextLine() abort\n\
    \  let g :headOverLineNumber = g :headOverLineNumber + 1\nendfunction\n```\n\n\
    Here the comment appears to be in a troubling mood in the “before” snapshot, in\
    \ the after snapshot we will give it’s own function (shown in the “after” snapshot),\
    \ then we will replace code in the “before” snapshot with:\ncall MoveHeadToNextLinein\
    \ both `GenerateReport()` and `GenerateMultiLineReport` functions.\n\n### Writing\
    \ Documentation\n\nFor this project, we have 2 documentation files:\n\n1. README.md\
