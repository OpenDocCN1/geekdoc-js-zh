  raw: '1.  Writing higher order functions.


    2.  Not mutating any data while we are at it.


    3.  Using methods like filter, map, etc. that works on a piece of data and returns
    a modified version of the data without mutating the original data.


    ​ JavaScript has some built-in methods like `map()`, `filter()`, etc. but I still
    prefer the usage of some custom higher order functions described down the line.​
    When writing code in a functional programming paradigm we must adhere to the following
    rules:


    *   Functions may not be influenced by the state of the program.


    *   Functions may not influence the state of the program.


    *   Functions must be used to break the program down into small, testable parts.


    *   Functions may be treated as first class citizens, which basically means just
    like any other data functions will have concrete names, will be passed as arguments,
    will be returned from other functions, etc.


    *   Functions may not take input from users.


    ​ Having extensive study experience with Common Lisp and Wolfram, I prefer to
    lean towards functional programming for JavaScript as well. Let’s start building
    some Generators for dynamic boiler-plate code.​ Following is some brief terminology
    for Function Programming intellectuals.


    1.  Isolated functions - there is no dependence on the state of the program, which
    includes global variables that are subject to change.


    2.  Pure functions - the same input always gives the same output.


    3.  The functions that take a function as an argument, or return a function as
    a return value are called Higher Order Functions.


    4.  When the functions are passed into another function or returned from another
    function, then those functions which gets passed in or returned can be called
    a lambda.


    5.  Functions must not have dependencies, if a dependency is needed then it must
    be passed as an argument, always declare your dependencies explicitly.


    ​ Following are some brief over-simplified guidelines for functional programming
    newbies:-


    1.  Write a lot of functions.


    2.  Never mess with variables without intent.


    3.  Use `const` as much as possible.


    4.  Write functions that take other functions as arguments.


    5.  Write functions that return other functions as arguments.


    6.  Write code in an easily testable way. Here “Tests” mean unit tests, and other
    automated testing methods.


    7.  Functions can be used with constructors to work like Classes, in which case
    they will be assigned a name starting with a capital letter.


    ​ Following are some elementary examples of functional JavaScript code compared
    to regular code:Non-functional example:let x = 6;function double() {  return ++x;}Functional
    example:let x = 6;function double(input) {  return ++input;}​ Following is an
    example of embedding methods in the Array object in JavaScript.var myArray = [
    1 , 2 , 3 , 4 ] ;Array . prototype . newMap = function ( callback ){  let neoArray
    = [] ;  this . forEach (( e , i ) => {    neoArray [ i ] = callback ( e ) ;  })
    ;  return neoArray ;} ;var newArray = newArray . myMap ( function ( item ){  return
    item * 2 ;}) ;​ Notice how we have use the `this ` keyword, and the `callback
    ` word. The `this` keyword is used instead of Array . The `callback` word refers
    to a parameter that demands a function as it’s value. This type of code is often
    used when using functional programming.Note: I don’t recommend modifying the Array
    object without proper care.​ This concludes the section for writing code for our
    plugin, the project’s offical repo is at:- [https://github.com/Ray6464/congenial-JavaScript](https://github.com/Ray6464/congenial-JavaScript)​
    If you’d like to contribute feel free to make a PR. You can start by writing code
    for stuff like generating Array.forEach, Array.find(), Array.some(), Array.every(),
    Array.reduce(), Array.includes(), etc.Chapter 6 - Post-development work, Writing
    documentation, and Making a pull request​ In this chapter, we will work on one
    of the most important aspects of Project-development! Writing documentation.​
    Ideally, we should be working on refactoring code before writing the documentation,
    but in this project I’ve decided to leave it to the FOSS army on GitHub. I’ll
    do some refactoring, but leave the rest to online contributors.Post-development
    work​ Following is a list of examples of Post-development work that I usually
    carry out, you should also do it before presenting your work.Examples of Post-development
    work


    1.  Checking each comment and realizing if they are beneficial, removing any useless
    comments.


    2.  Deal with any commented out code.


    3.  Make sure your comments aren’t misdirecting others.


    4.  Making sure your code follows the 3 R’s of Clean code, Readability, Re-usability,
    and Refactoring!


    Refactoring Comments​ When dealing with comments remember the following quote:“Write
    code not comments”​ Instead of describing or informing you, I’ll just show you
    what I mean in the following case-studies of our code.Note: This code is written
    for instructive purposes.Warning: Don’t get distracted by line numbering in the
    following snapshots.Case 1​ In this case, we are looking at the `modules/tests.vim`
    file.Code (before):1   "----------------------2  let numberOfTestsPassed = 03  
    "----------------------4  5   "----------------------6  let numberOfTestsFailed
    = 07   "----------------------…Several lines Below...45 " each test is ran on
    a different line Number46 "----------------------47 let lineNumber = 148 "----------------------Code
    (After):1   "----------------------2  let numberOfTestsPassed = 03  let numberOfTestsFailed
    = 04  let headOverlineNumber = 15   "----------------------​ Now compare the “before”
    and “after” snapshot, in the “before” snapshot we have a ton of lines which makes
    it look incommodious, in the “after” snapshot we have reduced the lined down to
    5 (including beautified comments).​ Another change is the change of name and line
    number of the variable `lineNumber`; the name is changed to `headOverLineNumber`
    where “head” refers to the “head” of the device used to explain the Turing Machine
    concept. This demands that we change the variable name everywhere, in Vim we can
    use `:%s/lineNumber/headOverLineNumber/g ` to do this.Case 2​ In this case, we
    are looking at the `modules/tests.vim` file.Code (before):" lines are incremented
    here so the test-head moves from line #1 -> #2, #2 -> #3, ...let g :headOverLineNumber
    = g :headOverLineNumber + 1Note: This code is present in the functions `GenerateReport()`
    and `GenerateMultiLineReport`.Code (after):function ! MoveHeadToNextLine() abort 
    let g :headOverLineNumber = g :headOverLineNumber + 1endfunction​ Here the comment
    appears to be in a troubling mood in the “before” snapshot, in the after snapshot
    we will give it it’s own function (shown in the “after” snapshot), then we will
    replace code in the “before” snapshot with:call ModeHeadToNextLinein both `GenerateReport()`
    and `GenerateMultiLineReport` functions.Writing Documentation​ For this project,
    we have 2 documentation files:


    1.  README.md (for GitHub main page)


    2.  docs/outline.txt (for basic user info)'
