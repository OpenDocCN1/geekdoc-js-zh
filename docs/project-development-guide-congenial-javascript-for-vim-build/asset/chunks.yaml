  trans: "\n\n### 3. 它应该足够直观，这样我不会忘记如何使用它，否则还有意义呢！\n\n#### 开发特性\n程序还需要一些“静默”功能，即开发特性。\n\
    \n1. 它需要易于适配到 `JavaScript` 以外的语言，以便我可以将其移植到其他语言。\n2. 它在所有语言中应该保持一致，例如，声明变量的命令在\
    \ `JavaScript` 和 `C` 语言中应该是相同的，但它们的输出显然会不同。\n3. 它需要极快的速度；任何减慢 `Vim` 速度的插件都是不值得的。\n\
    \n#### 项目需求原型\n我将在没有太多外部帮助的情况下开发这个项目；然而，我仍然会向你展示是如何做的，这样你至少对公司是如何运作有一个基本的了解。在开发开始之前，我们需要为开发阶段准备预算，财务部门的人员审核预算，然后项目经理拥有完全的控制权！\n\
    \n虽然通常情况下并非如此，但我合作过财务部门从不放弃预算控制权的团队，这反过来在很大程度上损害了项目；对某人最糟糕的事情之一就是赋予他们责任，却实际上没有赋予他们执行该责任的权力。\n\
    \n#####我们的项目需求（抽象）\n让我们列出开发这个项目所需的物品清单。\n\n1. 我们需要一些能编写 `VimScript` 代码的人。\n2.\
    \ 我们需要有人使用 `VimScript`、`Python` 等编写单元测试并生成开发报告。\n3. 我们需要有人来编写文档，这需要一套独立的技能组合。程序员编写的文档会让读者想自杀。\n\
    4. 我们需要一些人对我们的软件进行 Beta 测试。\n5. 我们假设我们有空间和设备来开发这个项目。\n\n##### 我们的项目需求（正式）\n虽然我们有初始需求列表，但我们不能向财务部门发送像上面那粗略列表，他们需要清晰的指南来计算预算。我们需要制定一份正式列表，描述我们要求的劳动力和预算的精确质量和数量。以下是列表更正式的版本：\n\
    \n1. `VimScript` 程序员 x 2-4 名。\n2. 具有编写单元测试经验的 `VimScript` 程序员。\n3. 具有编写文档经验的程序员。\n\
    4. 用于中立焦点小组的预算。\n5. 200 美元的开发期间预算，用于额外薪资、零用金、设备维护等。\n\n现在这是一份很好的正式文档了！虽然第 5 点会激怒某些人。正式文档看起来像下面：![](img/Image00003.jpg)\n\
    \n注意：这只是一个模拟文档。一旦交付此文档，通常会有一些谈判，然而，项目经理不能做出任何他们无法实现的陈述，并且在合理请求面前绝不让步。记住，在低预算上设定不可能实现的目标对项目非常有害，并且对与该项目相关的人员声誉产生极大危害。\n\
    \n#### 缩减需求\n有时我们没有足够的资源或预算来大规模开发项目，如果出现这种情况，我们可以采取采取以下方法：\n\n##### 精益创业者方法\n\
    1. 不再使用多个程序员和专门编写单元测试的程序员，而是雇佣一个小双人来完成工作并互相测试对方的工作。这在大型项目中可能是灾难性的。外包一些内容也是明智的。\n\
    2. 将文档编写者的角色交给一个低薪的`实习生`。\n3. 不要预订焦点小组，而是使用来自所谓“朋友和家人”的有机反馈。\n\n##### 穷困创业者方法\n\
    1. 手动（DIY）编写程序的一部分，包括单元测试，将其余部分放在 `GitHub`、`GitLab`、`BitBucket` 等平台上供他人贡献。\n2.\
    \ 你自己编写部分文档，将其余放在 `GitHub` 上供他人贡献。\n3. 在线与他人分享程序；通过这种方式你可以获得一些非常棒（伤人的）的反馈。只需保持开放的心态和钢铁般的神经。\n\
    \n#### 概念验证与 Beta 测试\n我将担任你的项目经理，并已为你编写了一个概念验证代码。代码如下，将其放入你的 `.vimrc` 文件中，你就可以自己测试概念验证了：\n\
    \n```vim\n“ start of the proof-of-concept code\nfunction ! Append (dataToAppend)\
    \ abort\n    execute 'normal i' .a:dataToAppend\nendfunction\n\nfunction ! GenerateVariable\
    \ () abort\n    let scope = input ( 'var/let/const Pick 1/2/3: ' )\n    let scopeOptions\
    \ = [ 'var' , 'let' , 'const' ]\n    let scopeRes = scopeOptions [ scope -1]\n\
    \n    let name = input ( 'Name of Variable: ' )\n    let value = input ( 'Value\
    \ of Variable: ' )\n\n    call Append ( scopeRes . ' ' . name . ' = ' . value\
    \ . ';' )\nendfunction\n\nnnoremap ,var :call GenerateVariable ()<cr>\n“ end of\
    \ code\n```\n\n注意：目前你不需要知道这段 `VimScript` 代码的作用，基础的 `VimScript` 知识（如创建变量和函数）将在本书稍后的阶段解释。警告：不要复制/粘贴代码，要手动输入。在将此代码添加到你的\
    \ `.vimrc` 文件并调试任何安装问题（如果有）之后，我们可以按照以下步骤测试概念验证：\n\n1. 确保你添加到 `.vimrc` 文件的代码是正确的。Windows\
    \ 用户可以使用 `:echo $HOME ` 来找到他们的主目录。\n2. 在终端中使用 `vim ` 打开一个新文件。\n3. 进入新文件后，在普通模式下使用\
    \ `,var ` 查看魔法。该命令用于在 JavaScript 中声明变量并控制其作用域。\n4. 系统将询问变量的“作用域”，你可以输入 1、2 或 3\
    \ 分别 `var`、`let` 或 `const`，然后按回车。第一次测试，输入 1 然后按回车。\n5. 系统将询问变量的“名称”。给它命名，然后按回车。第一次测试将变量命名为“player1Health”然后按回车。\n\
    6. 最后，系统将询问变量值，你可以传递 1、200、31、true、false、“JavaScript”、“Hello World”等值。字符串需要引号。第一次测试，输入\
    \ 100 作为值然后按回车。\n7. 如果你操作得当，你应该会在你的文档中看到以下内容：\n\n```\nvar player1Health = 100;\n\
    ```\n8. 如果你看到了，恭喜你刚刚筛选了程序背后的初始概念。\n9. 现在你应该把程序发给其他人测试。在继续之前，解决概念上的任何问题。\n10. 现在你需要开发一个真正有用且可以分发的程序版本。\n\
    11. 在继续之前，从你的 `.vimrc` 文件中移除概念验证代码。\n\n#### 设置项目管理系统\n对于这个项目，我为你提供了一个简单的项目管理系统来处理项目。该系统由\
    \ 5 个步骤组成：\n\n1. B acklog（待办列表）\n2. W rite（编写）\n3. T est and Debug（测试与调试）\n4.\
    \ Problem（问题）\n5. D one（完成）\n\n"
- fmt: "\nIt will look like this on a Kanban Board:![](Image00004.jpg) I will give\
    \ you a backlog of features to implement in the code, the features will be given\
    \ in form of cards/stories. For example, it will look like the following on a\
    \ Kanban Board:![](Image00005.jpg)\n\nIn the Write step you will pick up a module/feature\
    \ card from the backlog, move it from Backlog column to Write column, and code\
    \ it. Assuming that you picked “Feature A”, the Kanban Board will look like the\
    \ following:![](Image00006.jpg)\n\nIn the Test step, you will pick up a feature\
    \ card from the write column and put it under the “Test and Debug” column, perform\
    \ tests on that feature, and debug code if required. If you pick “feature A” then\
    \ the board will look like the following:![](Image00007.jpg)\n\nWhen you are done\
    \ developing “Feature A” you will move it’s card to the “Done” column, and then\
    \ you will have some personal bandwidth available to start working on another\
    \ feature from the Backlog. The Problem column is for stuff that doesn't belong\
    \ in any other column, leave a card there with a note if needed.\n\nUsing the\
    \ Kanban method you can assign each team/teammate a single column to work with,\
    \ also called Vertical assignment, or you can assign a single feature to a team/teammate\
    \ and he/she will take it through each column until it’s in the Done column, also\
    \ called a horizontal assignment. Each team has it’s own assignments, and their\
    \ own sub-Kanban boards.\n\nThe hierarchy in my projects using a lingo where the\
    \ central board is known as the Origin-Board, and the sub-boards are known as\
    \ the Macro-Boards, the sub-sub-boards, are called Meso-Boards, and the sub-sub-sub-boards\
    \ are called Micro-Boards. However, this is obviously made up lingo! The idea\
    \ is to conserve the superiority of the superior boards, so a Meso-Board will\
    \ never be out of sync with a Micro-Board. I did all this because I don’t like\
    \ people touching my Origin-board, make of it what you will!\n\nA template of\
    \ this Kanban Board is provided at the end of this book, you can print it out\
    \ for your own use. You can also use a program like Task Warrior for solo, mono-tonal\
    \ project management.\n\n## Modules\nFollowing is a list of modules we need to\
    \ work on:\n\n1. `congenial-JavaScript.vim` (Yellow)\n2. `modules/sourceCodeGenerator.vim`\
    \ (Green)\n3. `docs/outline.txt` (Blue)\n\nEach module can be assigned a card-color,\
    \ and then the backlog can be filled with features that will be implemented in\
    \ those modules. I have already create the following Backlog for you; we’ll start\
    \ working on it after the next chapter.![](Image0008.jpg)\n\n## Chapter 2 - Initiating\
    \ the project\nIn this chapter, we will initialize the project’s origin Repository,\
    \ share a Repo with all members, and then divide up duties with our co-developers.\n\
    \nYou can initialize your project with Git if you want, although it’s not required.\
    \ You can use Git or any other Version Control System; the usage of Version Control\
    \ Systems is heavenly recommended, but don’t use them unless you are familiar\
    \ with them. Instructions for Version Control are not provided here, so steps\
    \ for checking-out, merging, pushing, etc. will not be given, you are to deal\
    \ with Version control yourself, if you don’t know how then avoid it for now,\
    \ this is a small project. Instructions for making files like `contributors.md`,\
    \ `LICENSE`, `README.md`, etc. are not provided since they are not required in\
    \ personal projects, but if you put your project’s on GitHub you can provide these\
    \ files.\n\n### Initializing the project\nFollowing are the steps we will take\
    \ to initialize the project:\n\n1. Make a directory named `congenial-JavaScript`\
    \ in your `HOME` directory.\n2. Inside `congenial-JavaScript` make the following\
    \ directories:\n    - `docs`\n    - `modules`\n3. Inside `congenial-JavaScript`\
    \ make the following files:\n    - `congenial-JavaScript.vim`\n    - `docs/outline.txt`\n\
    \    - `modules/sourceCodeGenerator.vim`\n4. Go to your `~/.vim/after/ftplugin/javascript/`\
    \ directory, if it doesn't exist, or if any of it’s parent directories doesn't\
    \ exist then make them.\n5. In this directory make a symbolic link aka shortcut\
    \ for your `congenial-JavaScript` directory made in step #1. Use the command:\n\
    ```bash\nln -s ~/congenial-JavaScript congenial-JavaScript\n```\n6. Now in `~/.vim/after/ftplugin/javascript/`\
    \ make a file named `plugins.vim`. This file is used to activate plugins for JavaScript\
    \ files. The plugins are to be imported in `plugins.vim` like in step #8.\n7.\
    \ Now you should have the following layout of directories for `.vim` and `congenial-JavaScript`:\n\
    ```\n~/|_ .vim/| |_ after/| | !_ after/| |   !_ ftplugin/| |      |_ javascript/|\
    \ |      | |_ congenial-JavaScript/| |      | !_ plugins.vim (for activating plugins)|\
    \ |      |_…| |_ autoload/| |_ colors/| |_ ftplugin/| |…|_ .vimrc (for vim code,\
    \ not relevant to us)|_ congenial-Javascript/| |_ congenial-JavaScript.vim (central\
    \ plugin file)| |_ docs/| | !_ outline.txt (congenial-JavaScript docs)| !_ modules/|\
    \   !_ sourceCodeGenerator.vim (important module)|_…\n```\n8. Inside `plugins.vim`\
    \ add the following lines of code and save it:\n```vim\n1 \" This is a file with\
    \ a list of plugins activated for JavaScript\n2 \" The syntax is to write the\
    \ name of a plugin followed my sourcing that plugin's central file\n3 \" The program\
    \ congenial-JavaScript was originally developed by RayVoice “GitHub/Ray6464” “@rayshorthead”\
    \ “rayvanet@gmail.com” on MIT License\n4 \" congenial-JavaScript5\n5 so ~/.vim/after/ftplugin/javascript/congenial-JavaScript/congenial-JavaScript.vim\n\
    ```\n9. The code on line#5 practically imports the `congenial-JavaScript.vim`\
    \ script in the `plugins.vim` script. You can add other plugin you develop in\
    \ this file too.\n10. When we open a JavaScript file in Vim it will execute `plugins.vim`,\
    \ which will activate the congenial-JavaScript plugin.\n11. Now project initiation\
    \ is complete.\n\n### Dividing up Duties\nNow let’s divide up the duties of development,\
    \ as I have promised you that nothing will happen off-screen, I have contacted\
    \ my friend Siena to get involved in this project, and the following was her response:![](Image00009.jpg)\n\
    \nUnfortunately, I can’t really share the actual pictures from a private forum,\
    \ but the conversation went like this:\n\n1. I sent her the proof-of-concept to\
    \ test and she liked it.\n2. I told her about the stuff I needed to cover, like\
    \ making variables, loops, etc. and promised to send a full list later.\n3. She\
    \ and I agreed to set up a system of communication, we basically agreed to a type\
    \ of communication where we will set up an online Git controlled private remote\
    \ Repo, I will write code for implementing the required features, and she will\
    \ write tests for those features in a FIFO (first-in-first-out) fashion and push/upload\
    \ them to the remote Repo. However I will write at-least one test for the sake\
    \ of demonstration.\n\nLet’s start the development!\n\n## Chapter 3 – Programming\
    \ the Software\nIn this chapter, we will cover the basics of VimScript, followed\
    \ by the actual programming of our software, and then testing. The Write/Test\
    \ cycle will be repeated for each feature until a satisfactory number of features\
    \ are covered. To get my point across we've have kept the coding sections concise,\
    \ if you are having any problems than consider increasing your exposure to VimScript.\n\
    \n### Fundamentals of VimScript\nIn the following list the basic features of VimScript\
    \ are described, this is not meant to be a tutorial. Anyone with some programming\
    \ experience should be able to understand this.\n\n1. The `so` keyword is short\
    \ for source, it practically imports a script in to another script, however this\
    \ definition isn’t literal. Importing works differently in VimScript.\n2. The\
    \ `nnoremap` keyword tells Vim to create a bond between a key-sequence and a command\
    \ in Normal-mode.\n3. The `inoremap` keyword tells Vim to create a bond between\
    \ a key-sequence and a command in Insert-mode.\n4. The `function!` keyword is\
    \ used to start writing a function, and the `endfunction` keyword is used to end\
    \ it.\n"
  raw: "It will look like this on a Kanban Board:![](Image00004.jpg)​ I will give\
    \ you a backlog of features to implement in the code, the features will be given\
