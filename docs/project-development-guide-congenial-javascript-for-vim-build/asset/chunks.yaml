    \ tests on that feature, and debug code if required. If you pick “feature A” then\
    \ the board will look like the following:![](Image00007.jpg)​ When you are done\
    \ developing “Feature A” you will move it’s card to the “Done” column, and then\
    \ you will have some personal bandwidth available to start working on another\
    \ feature from the Backlog.​ The Problem column is for stuff that doesn't belong\
    \ in any other column, leave a card there with a note if needed.​ Using the Kanban\
    \ method you can assign each team/teammate a single column to work with, also\
    \ called Vertical assignment, or you can assign a single feature to a team/teammate\
    \ and he/she will take it through each column until it’s in the Done column, also\
    \ called a horizontal assignment.​ Each team has it’s own assignments, and their\
    \ own sub-Kanban boards.​ The hierarchy in my projects using a lingo where the\
    \ central board is known as the Origin-Board, and the sub-boards are known as\
    \ the Macro-Boards, the sub-sub-boards, are called Meso-Boards, and the sub-sub-sub-boards\
    \ are called Micro-Boards. However, this is obviously made up lingo! The idea\
    \ is to conserve the superiority of the superior boards, so a Meso-Board will\
    \ never be out of sync with a Micro-Board. I did all this because I don’t like\
    \ people touching my Origin-board, make of it what you will!​ A template of this\
    \ Kanban Board is provided at the end of this book, you can print it out for your\
    \ own use.​ You can also use a program like Task Warrior for solo, mono-tonal\
    \ project management.Modules​ Following is a list of modules we need to work on:\n\
    \n1.  congenial-JavaScript.vim (Yellow)\n\n2.  modules/sourceCodeGenerator.vim\
    \ (Green)\n\n3.  docs/outline.txt (Blue)\n\n​ Each module can be assigned a card-color,\
    \ and then the backlog can be filled with features that will be implemented in\
    \ those modules. I have already create the following Backlog for you; we’ll start\
    \ working on it after the next chapter.![](Image00008.jpg)Chapter 2 - Initiating\
    \ the project​ In this chapter, we will initialize the project’s origin Repository,\
    \ share a Repo with all members, and then divide up duties with our co-developers.​\
    \ You can initialize your project with Git if you want, although it’s not required.\
    \ You can use Git or any other Version Control System; the usage of Version Control\
    \ Systems is heavenly recommended, but don’t use them unless you are familiar\
    \ with them.​ Instructions for Version Control are not provided here, so steps\
    \ for checking-out, merging, pushing, etc. will not be given, you are to deal\
    \ with Version control yourself, if you don’t know how then avoid it for now,\
    \ this is a small project.​ Instructions for making files like `contributors.md`,\
    \ LICENSE, `README.md`, etc. are not provided since they are not required in personal\
    \ projects, but if you put your project’s on GitHub you can provide these files.Initializing\
    \ the project​ Following are the steps we will take to initialize the project:\n\
    \n1.  Make a directory named `congenial-JavaScript` in your HOME directory.\n\n\
    2.  Inside congenial-JavaScript make the following directories :\n\n    1.  docs\n\
    \n    2.  modules\n\n3.  Inside congenial-JavaScript make the following files\
    \ :\n\n    1.  congenial-JavaScript.vim\n\n    2.  docs/outline.txt\n\n    3.\
    \  modules/sourceCodeGenerator.vim\n\n4.  Go to your ~/.vim/after/ftplugin/javascript/\
    \ directory, if it doesn't exist, or if any of it’s parent directories doesn't\
    \ exist then make them.\n\n5.  In this directory make a symbolic link aka shortcut\
    \ for your congenial-JavaScript directory made in step #1\\. Use the command:\n\
    \nln -s ~/congenial-JavaScript congenial-JavaScript\n\n6.  Now in ~/.vim/after/ftplugin/javascript/\
    \ make a file named `plugins.vim`. This file is used to activate plugins for JavaScript\
    \ files. The plugins are to be imported in `plugins.vim` like in step #8.\n\n\
    7.  Now you should have the following layout of directories for `.vim` and `congenial-JavaScript`:\n\
    \n~/|_ .vim/| |_ after/| | !_ after/| |   !_ ftplugin/| |     |_ javascript/|\
    \ |     | |_ congenial-JavaScript/| |     | !_ plugins.vim (for activating plugins)|\
    \ |     |_…| |_ autoload/| |_ colors/| |_ ftplugin/| |…|_ .vimrc (for vim code,\
    \ not relevant to us)|_ congenial-Javascript/| |_ congenial-JavaScript.vim (central\
    \ plugin file)| |_ docs/| | !_ outline.txt (congenial-JavaScript docs)| !_ modules/|   !_\
    \ sourceCodeGenerator.vim (important module)|_…\n\n8.  Inside `plugins.vim` add\
    \ the following lines of code and save it:\n\n1   \" This is a file with a list\
    \ of plugins activated for JavaScript2   \" The syntax is to write the name of\
    \ a plugin followed my sourcing that plugin's central file3  \" The program congenial-JavaScript\
    \ was originally developed by RayVoice “GitHub/Ray6464” “@rayshorthead” “rayvanet@gmail.com”\
    \ on MIT License4   \" congenial-JavaScript5   so ~/.vim/after/ftplugin/javascript/congenial-JavaScript/congenial-JavaScript.vim\n\
    \n9.  The code on line#5 practically imports the `congenial-JavaScript.vim` script\
