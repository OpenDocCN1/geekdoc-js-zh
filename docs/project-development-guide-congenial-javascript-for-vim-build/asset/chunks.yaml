    \ THE INFORMATION THE ORGANIZATION OR WEBSITE MAY PROVIDE OR RECOMMENDATIONS IT\
    \ MAY MAKE. FURTHER, READERS SHOULD BE AWARE THAT INTERNET WEBSITES LISTED IN\
    \ THIS WORK MAY HAVE CHANGED OR DISAPPEA BETWEEN WHEN THIS WORK WAS WRITTEN AND\
    \ WHEN IT IS READ.\n\n## Outline\n- Introduction\n- About Authors\n- Author’s\
    \ Acknowledgments\n- Chapter 1 - Development of the Initial Idea\n- Chapter 2\
    \ - Initiating the project\n- Chapter 3 – Programming the Software\n- Chapter\
    \ 4 – Advanced Features\n- Chapter 5 – Functional Programming Code for JavaScript\n\
    - Chapter 6 - Post-development work, Writing documentation, and Making a pull\
    \ request\n- Chapter 7 - Making the plugin presentable for the portfolio\n- Kanban\
    \ Board\n\n## Table of Contents\n- Introduction\n- Prerequisites\n- About Authors\n\
    - Author’s Acknowledgments\n- Chapter 1 - Development of the Initial Idea\n  \
    \  - Development Process\n        - Initial Idea\n        - Forensic Programming\n\
    \        - The General outline\n    - Development Features\n        - Project\
    \ Requirements Mockup\n        - Our Project Requirements (abstract)\n       \
    \ - Our Project Requirements (Official)\n        - Scaling down the demands\n\
    \        - Proof-of-Concept and Beta-testing\n        - Setting up a Project Management\
    \ System\n        - Modules\n- Chapter 2 - Initiating the project\n    - Initializing\
    \ the project\n    - Dividing up Duties\n- Chapter 3 – Programming the Software\n\
    \    - Fundamentals of VimScript\n    - Program to Generate a Variable\n     \
    \   - Write\n        - Test and Debug (AddToDoc)\n        - Explanation\n    \
    \    - Test and Debug (GenerateVariableWithScope)\n    - Program to Generate a\
    \ label\n        - Write\n        - Test and Debug\n    - Program to Generate\
    \ a For Loop\n        - Write\n        - Test and Debug\n    - Program to Generate\
    \ an Array\n        - Write\n        - Test and Debug\n    - Program to Generate\
    \ Array methods\n        - Write\n        - Test and Debug\n    - Program to Generate\
    \ Timer\n        - Write\n        - Test and Debug\n    - Program to Generate\
    \ Stdout\n        - Write\n        - Test and Debug\n    - Program to Generate\
    \ Loops over Arrays (ForEach)\n        - Write\n        - Test and Debug\n   \
    \ - Note\n- Chapter 4 – Advanced Features\n    - Basic features\n    - NodeJS\n\
    \    - Built-in Variables\n    - Process\n    - Refactoring code\n    - Custom\
    \ Emitter\n    - Creating a Server with HTTP\n    - FS module\n    - JavaScript\
    \ Require() and Export\n    - Basic Server Tools for NodeJS\n- Chapter 5 – Functional\
    \ Programming Code for JavaScript\n- Chapter 6 - Post-development work, Writing\
    \ documentation, and Making a pull request\n    - Post-development work\n    -\
    \ Refactoring Comments\n    - Writing Documentation\n    - Making a pull request\n\
    \    - Steps To Install the package\n    - Steps to make modification and make\
    \ a pull request\n- Chapter 7 - Making the plugin presentable for the portfolio\n\
    \    - Adding ASCINEMA casts to your project\n    - Recording an ASCIICAST and\
    \ putting it on GitHub\n    - Other suggestions\n- Kanban Board\n\n## Introduction\n\
    This book is a comprehensive guide for developing the notorious Congenial-JavaScript\
    \ Plugin for Vim. This book takes the reader through six comprehensive yet concise\
    \ steps to develop and present your software, starting from developing the initial\
    \ idea behind the program, all the way to the final distribution and future development\
    \ phases.​ The book includes the following steps to development:\n\n1. Development\
    \ of the initial idea.\n2. Initiating the project, including Team Member Role\
    \ Initialization.\n3. Programming and Coding the Software, including writing unit\
    \ tests for Vim by building a custom testing framework.\n4. Writing documentation.\n\
    5. Making the plugin presentable for your portfolio. Heavy focus on the 3-Rs of\
    \ Elegant Programming (Readability, Re-usability, and Refactoring).\n6. Final\
    \ distribution including putting your work in front of other people including\
    \ potential employers for peer-review.\n"
