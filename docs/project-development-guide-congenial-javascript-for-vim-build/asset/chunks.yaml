    \ ' )\n    let value = input ( 'Value of Variable: ' )\n\n    call Append ( scopeRes\
    \ . ' ' . name . ' = ' . value . ';' )\nendfunction\n\nnnoremap ,var :call GenerateVariable\
    \ ()<cr>\n“ end of code\n```\n\nNote: You don’t need to know what this `VimScript`\
    \ code does for now, basic `VimScript` stuff like making variables and functions\
    \ will be explained in this book at a later stage. Warning: Don’t copy/paste code,\
