    \ up the tone for a lot of future stuff.\n\n5.  A project management system like\
    \ SCRUM is set-up for larger projects, while for smaller projects like this one\
    \ a single person can micro-manage a hand full of developers.\n\n6.  The project\
    \ is initiated and a Repository is shared with all team members. In my projects,\
    \ I force everyone to use a hierarchy management system where they can only commit\
    \ code to their own Repo, and can only merge it with their supervisor’s repo.\
    \ Each person thoroughly reviews the work of their subordinates before they merge\
    \ it to the origin Repo.\n\n7.  Briefings are held among the team members to divide\
    \ duties. In this part, I develop and review Kanban boards with my team. This\
    \ can also be done as part of SCRUM.\n\n8.  The actual programming section of\
    \ development is started.\n\n9.  Final touch-ups including beta-testing is done.\n\
    \n10.  The project is pushed to the master repo where it’s distributed to the\
    \ users as one of the following:\n\n    1.  Update to their already existing software.\n\
    \n    2.  Upgrade to their current version.\n\n    3.  Rolling release, which\
    \ is sort of like an update.\n\n    4.  Live version, which means the users are\
    \ always using the latest version.\n\n11.  A launch party or ritual is usually\
    \ held.\n\n​ If these steps overwhelm you then don’t worry at all! We won’t be\
    \ performing certain steps like step #10, and I’m certainly not throwing you a\
    \ party!Initial Idea​ Every project has an inspiration, there is always a need\
    \ the developer is trying meet, or a gap they are trying to fill. The Congenial-coding\
    \ practices sprung out of the following needs:\n\n1.  I have carpel tunnel! I\
    \ can’t type much, so I have to rely on dictation, speech-to-text programs, and\
    \ programs like Emmett-vim to help me code.\n\n2.  I code in many languages, I\
    \ have worked as a Forensic Programmer for a really long time, so forgetting syntax\
    \ of a programming language is a grave sin in my life, but it still happens from\
    \ time to time.\n\nForensic Programming​ I describe myself as a Forensic Programmer,\
    \ as a Forensic Programmer I diagnose problems in software, source-code, UI/UX,\
    \ etc. and fix them; I make sure they don’t occur again in an unpredictable manner.\
    \ The initial idea is much like Bug Bounty hunting, in fact bug hunting is a part\
    \ of the job, however Forensic Programming is broader and has different goals.​\
    \ As a Forensic Programmer, I have worked with many programming languages, libraries,\
    \ and frameworks, editors, people, etc. including but not limited to the following:\n\
    \n1.  JavaScript\n\n2.  TypeScript\n\n3.  ReactJS and React-Native\n\n4.  C, C++,\
    \ C#, Go, and OpenCL\n\n5.  Lua\n\n6.  Common Lisp\n\n7.  Java, Kotlin, and Scala\n\
    \n8.  FORTRAN, Alef, and Limbo (one time)\n\n9.  Python\n\n10.  MATLAB, Octave,\
    \ BRL-CAD, etc.\n\n11.  Sh/BASH Shell, BASIC, and DOS batch\n\n12.  Haskell\n\n\
    13.  Curl\n\n14.  Swift\n\n15.  Rust\n\n16.  AWK\n\n17.  Dart for Flutter\n\n\
    18.  PHP and SQL\n\n19.  Ruby\n\n20.  Perl\n\n21.  Zig and Racket\n\n22.  BrainFuck\
    \ and Shakespeare (for fun)\n\n​ The list turned out to be longer then I thought!\
    \ However my point is that we (yes, there are other Forensic Programmers like\
    \ me) can’t really remember proper syntax for all of these languages, for this\
    \ reason we need a plugin to help us through it.The General outline​ So, what\
