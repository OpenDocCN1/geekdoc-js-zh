    \ a Technology Business Consultation firm based in Asia, with clients all around\
    \ the world. He is also the Founder and Director of “Technology Application, Research,\
    \ and Development Initiative Stratagem” aka “TARDIS”, a cleverly named R&D facility\
    \ whose primary purpose is to make the world a better place by developing the\
    \ technology of tomorrow. Members come from all walks of life. Much of the work\
    \ done by them is Open Source and uses MIT, and BSD licenses. A big chuck of funding\
    \ for their R&D operations comes from conducting training seminars and workshops.Twitter:\
    \ @RayShortHeadAuthor’s AcknowledgmentsThe following people were involved in the\
    \ development of this book, without them this book wouldn’t have been possible.Anna\
    \ Voice (editor)Siena Dahl-Joy (contributor)Ospan Ali (stock image)All of them\
    \ have my thanks.Chapter 1 - Development of the Initial Idea​ In this chapter,\
