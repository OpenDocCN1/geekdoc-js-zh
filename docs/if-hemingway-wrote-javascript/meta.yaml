    \ though in over her head (literally) and generally uneasy about the whole situation,\
    \ she never loses her dignity and always gives as good as she gets. Much humor\
    \ is derived from this dynamic—the creatures' mild disdain for Alice is matched\
    \ by her gentle contempt for them.\n\nThe sequel, *Through the Looking-Glass,\
    \ and What Alice Found There*, is essentially a game of chess played on the other\
    \ side of Alice's bedroom mirror. It features the beloved nonsense poem \"Jabberwocky,\"\
    \ which is written in mirrored text and peppered with made-up words, some of which\
    \ (notably, the portmanteau *chortle*) have made it into everyday speech.\n\n\
    ```\n1 function downTheRabbitHole(growThisBig) {\n2   var theFullDeck = Array(growThisBig);\n\
    3   var theHatter = Function('return this/4').call(2*2);\n4   var theDuchess =\
    \ Boolean(\"The frumious Bandersnatch!\");\n5\n6   var theVerdict = \"the white\
