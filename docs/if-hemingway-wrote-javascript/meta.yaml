    Shakespeare''s solution comes in the form of a two-act comedy that draws heavily
    on JavaScript''s unusual mannerisms for levity. We''re introduced to the cast
    of players before settling in for the main event. In keeping with the traditions
    of Elizabethan comedy, the unsettling opening act (in which an incomplete result
    is prematurely presented) is happily resolved by the final act, affording us much
    comfort and cheer.


    The Bard gets a little wordy, but we wouldn''t have it any other way. Several
    clever devices are employed—for example, the use of Math.max ensures that theResult
    does not suffer the indignity of being addressed by a negative index.


    Notice that although Shakespeare''s comments are in iambic pentameter, he''s using
    weak endings (that is, adding an extra unstressed syllable). Shakespeare frequently
    used weak endings to denote enquiry or uncertainty (the Elizabethan equivalent
    of upspeak). We can only assume he found JavaScript as vexing as the rest of us
    do.'
