    footnotes is not a literary gimmick but an earnest (and to Wallace’s mind, necessary)
    attempt to include every relevant detail without disrupting the narrative flow.
    Similarly, Wallace’s snail-paced plot development owes more to obsession than
    to patience; while most authors are anxious to keep the story moving, Wallace
    feels duty-bound to stay with a scene for as long as he has something to say about
    it.


    In Wallace’s prose, the highbrow and the vernacular routinely rub shoulders in
    the same sentence, and phrases oscillate between well crafted and deliberately
    sloppy. Sentences sometimes stretch for hundreds of words with minimal punctuation,
    and in another nod to obsession, Wallace is apt to repeat himself or restate the
