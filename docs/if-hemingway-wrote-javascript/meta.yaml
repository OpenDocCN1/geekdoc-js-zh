    # IF HEMINGWAY WROTE JAVASCRIPT

    ERNEST HEMINGWAY


    The Hemingway paradox is, to some extent, the JavaScript paradox. Just as Hemingway
    uses only the sparsest prose to allow the intricacies of the human condition to
    surface, JavaScript’s terse and direct syntax, when used well, can crystalize
    complex logic into something tangible and immediate.


    Hemingway’s Fibonacci solution is code reduced to its essentials, with no word
    or variable wasted. It’s not fancy—maybe it’s even a little pedantic—but that’s
    the beauty of Hemingway’s writing. There’s no need for elaborate logic or showy
    variable names. Hemingway’s JavaScript is plain and clear, and it does only what
    is necessary—and then it gets out of the way to allow the full glory of the Fibonacci
    sequence to shine through.


    Hemingway didn’t suffer fools gladly, so if you ask for a series with fewer than
    two numbers, he’ll just ignore you or complain, “I’m tired and this question is
    idiotic.”


