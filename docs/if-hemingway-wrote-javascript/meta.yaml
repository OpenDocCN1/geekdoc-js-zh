    as a combat soldier in World War II left Salinger deeply traumatized. When he
    returned to America in 1946, he found a society preoccupied with shallow affectation
    and largely oblivious to the real-world horrors that were now deeply ingrained
    in his damaged psyche. Considering himself adrift in a world of “phonies,” he
    sought emotional solace in his writing.

    Salinger frequently features children whose honesty and vitality stand in sharp
    contrast to the duplicity and spiritual emptiness of his grown-up characters.
    In Salinger’s short story “A Perfect Day for Bananafish,” Seymour, a mentally
    fragile war veteran (something of a Salinger alter ego), is treated with indifference
    by his wife and seen as a monster by his mother-in-law. But Sybil, a young girl
    Seymour meets on the beach, is in awe of the flawed adult, and their relationship
    is the high point of an otherwise cheerless story.

    Salinger’s most famous work, the persistently popular (and regularly banned) *The
    Catcher in the Rye*, is a candid first-person account of 16-year-old Holden Caulfield’s
    perilous transition to'
