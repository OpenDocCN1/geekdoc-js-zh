  md: 'The popular image of Samuel Johnson as a con-vivial sage with a witty remark
    for every occasion owes much to James Boswell’s renowned 1791 biography, *Life
    of Samuel Johnson*. But there’s a darker side to Johnson that Boswell, whether
    by reverence or ignorance, tends to underplay.


    Johnson experienced ill health for most of his life. Aside from a series of physical
    ailments, there were copious mental gremlins. Johnson was an obsessive-compulsive,
    it’s likely he suffered from Tourette syndrome (his attempts at teach-ing were
    stymied by constant facial grimaces and nervous tics, which scared away patrons),
    and he was subject to crippling depression. These numerous maladies, exacerbated
    by parental debt, condemned Johnson to financial hardship for more than 30 years.
    It was Johnson’s sheer erudite brilliance, combined with an impeccable work ethic,
    that belatedly won him the recogni-tion that would lift him out of poverty.


