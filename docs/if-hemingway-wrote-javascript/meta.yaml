    stymied by constant facial grimaces and nervous tics, which scared away patrons),
    and he was subject to crippling depression. These numerous maladies, exacerbated
    by parental debt, condemned Johnson to financial hardship for more than 30 years.
    It was Johnson’s sheer erudite brilliance, combined with an impeccable work ethic,
    that belatedly won him the recogni-tion that would lift him out of poverty.


    In 1746, a consortium of prominent book-sellers commissioned Johnson to compile
    *A Dictionary of the English Language* in two volumes. Johnson’s was not the first
    English dictionary, but previous efforts were highly'
  - '[PAGE 66]


    selective, mainly focusing on uncommon words (which, paradoxically, are usually
    easier to define), and gave little or no indication of usage. Johnson’s dictionary
    defined 42,000 words, and each definition was supplemented with one or more literary
    quotations illustrating usage. It’s a testament to Boswell’s influence that Johnson’s
    dictionary is often viewed as a humorous work; yet, while there are a handful
    of witty definitions (most famously the self-deprecating explanation of lexicographer
    as “a harmless drudge”), the dictionary is genuinely scholarly and was still considered
    the preeminent English dictionary 100 years after it was first published. Johnson—who
    was also a biographer, poet and literary critic—was remarkably prolific, but his
    writing is sometimes criticized for being monotonous, even pedantic; he would
    often embrace opposing arguments in a single sentence, as though presenting both
    sides of an internal squabble. Yet therein lies Johnson’s attraction. While most
    writers gloss over their fickleness of opinion to present a unified thesis, Johnson
    invites us into his conflicted soul to reason along with him. The result is warm
    and richly human.'
