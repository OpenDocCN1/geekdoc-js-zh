    When Douglas Adams approached the BBC with a proposal for a comedy radio series
    called *The Ends of the Earth*, his writing career was in the doldrums and he''d
    moved back in with his mother to make ends meet. That series became *The Hitch-hiker''s
    Guide to the Galaxy*, and it spawned five novels, a television series, a stage
    show, a computer game, a movie, and a comic-book series.


    *The Hitchhiker''s Guide* is a rollicking inter-stellar odyssey featuring unassuming
    earthling Arthur Dent and a disparate array of mostly nonhumanoid acquaintances.
    The book, which has achieved cult status among science fiction lov-ers, doubles
    as a vehicle for Adams to off-load an endless Monty Python–esque stream of wry
    and witty observations about life, the universe, and everything. In this excerpt
    from the first book, Adams ponders human intelligence:


    > For instance, on the planet Earth, man had always assumed that he was more intelligent
    than dolphins because he had achieved so much—the wheel, New York, wars and so
    on—whilst all the dolphins had ever done was muck about in the water having a
    good time. But conversely, the dolphins had always believed that they were far
    more intelligent than man—for precisely the same reasons.¹'
  - '[PAGE 138]


    To some extent, Adams''s comic genius actually works against the book; Adams describes
    himself as “essentially a frivolous” writer, and much of the plot feels like filler
    in service of his clever one-liners.² There are other problems: The only obviously
    female character (and the only human besides Arthur) is Trillian, whom we are
    told (several times) is both exceptionally clever and exceptionally beautiful.
    Her character seems way too perfect for a mere humanoid, and yet for all her prowess,
    she''s given very little to do.


    Eventually, Adams burned out (“It felt like a mouse on a wheel; there was no pleasure
    coming into the cycle at any point”³) and turned to fresh endeavors, starting
    with the fantasy detective novel *Dirk Gently''s Holistic Detective Agency* (built
    upon unused *Doctor Who* scripts), which spawned a sequel, *The Long Dark Tea-Time
    of the Soul*.


    One of his final projects was the acclaimed radio series and nonfiction book *Last
    Chance to See*, in which Adams traveled to far-flung locations to hang out with
    animals on the brink of extinction. Fittingly, Adams described *Last Chance to
    See* as his favorite work.'
