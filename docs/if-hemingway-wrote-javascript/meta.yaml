- md: "# VIRGINIA WOOLF\n1882–1941\n\nVirginia Woolf was a pioneer of lyricism in\
    \ modern literature. Leaning heavily on stylistic devices—alliteration, assonance,\
    \ rhythm—Woolf’s unhurried language has a lush dreamlike quality. The following\
    \ passage from *To the Lighthouse* is ostensibly prose, but the meter is so strong\
    \ and the wordplay so rich that it reads like poetry:\n\n> The autumn trees, ravaged\
    \ as they are, take on the flash of tattered flags kindling in the gloom of cool\
    \ cathedral caves where golden letters on marble pages describe death in battle\
    \ and bow bones bleach and burn far away in Indian sands.¹\n\nHer sentences, unfettered\
    \ by formal structure, are rarely pithy and frequently expand into lengthy streams\
    \ of consciousness, strung together with semicolons and em dashes.\n\nConsidering\
    \ perception to be the greater part of reality, Woolf presents a composite truth\
    \ assembled not from words or deeds but from a million private thoughts—in her\
    \ own words, \"a whole made of shivering fragments.\" Woolf moves between her\
    \ characters, probing each psyche relentlessly and flooding the page with their\
    \ unspoken thoughts. In this devastating excerpt from *Mrs. Dalloway*, Clarissa\
    \ has just learned of a humiliating snub:\n\n> She put the pad on the hall table.\
    \ She began\n> to go slowly upstairs, with her hand on the\n> bannisters, as if\
    \ she had left a party, where\n> now this friend now that had flashed back\n>\
    \ her fate, her voice; had shut the door and gone\n> out and stood alone, a single\
    \ figure against the\n> appalling night . . . feeling herself suddenly\n> shriveled,\
    \ aged, breastless, the grinding,\n> blowing, flowering of the day, out of doors,\n\
    > out of the window, out of her body and brain\n> which now failed.\n\nNearly\
    \ a century later, Woolf's version of reality feels as potent as ever.\n\n# IF\
    \ HEMINGWAY WROTE JAVASCRIPT\nVIRGINIA WOOLF\n\n```javascript\nfunction happy(number)\
    \ {\n  var next, numeral, noneOfThese = [];\n\n  //unless the number was nothing;\
    \ or one; or unless it had been already tried\n  while (number && number != 1\
    \ && noneOfThese[number] == null) {\n    next = 0, numerals = String(number).split('')\n\
    \    //digits forced apart, now multiplied, now cast aside; in service of what?\n\
    \    while (next = next+numerals[0]*numerals[0], numerals.shift(), numerals.length);\n\
    \    noneOfThese[number] = true, number = next\n  }\n\n  //to be one; alone; happily\n\
    \  return number == 1\n}\n```\n\nIf the semicolon is the period of JavaScript,\
    \ then the comma operator is its semicolon. Programmer Woolf loves the comma operator,\
    \ and in her happy numbers solution, she uses it to excess. The result is a dreamy,\
    \ melancholic form of JavaScript (is there any other?) made dreamier still by\
    \ the heavy, almost dangerous level of *n* alliteration and some gorgeously expressive\
    \ pairings. In *To the Lighthouse*, Woolf writes of night’s shadows: “They lengthen;\
    \ they darken”; in her happy numbers solution we get the wistfully poetic `numerals.shift()`,\
    \ `numerals.length`. The mood is volatile. Woolf begins the exercise confidently\
    \ enough, yet even as she methodically talks us through the process, doubts emerge.\
    \ Gradually, her inner voice permeates the commentary; she anxiously relates each\
    \ number’s cold dissection. All this control, this manipulation . . . And to what\
    \ end?\n\nAt the conclusion, Woolf equates the value of happiness (i.e., the number\
    \ 1) with the joys of solitude, perhaps in reference to her famous essay “A Room\
    \ of One’s Own,” in which she makes the case that women writers should be given\
    \ literal and figurative space.\n\n> *Ther nis no werkman, whatsoever he be,*\n\
    > *That may code JS both wel and hastily.*\n\n# GEOFFREY\nCHAUCER\n1343–1400\n\
    \n# IF HEMINGWAY WROTE JAVASCRIPT\nGEOFFREY CHAUCER\n\nAs one of the first poets\
    \ to write in the Middle English vernacular, Geoffrey Chaucer made lexical and\
    \ stylistic choices that had a major influence on the language and literature\
    \ that followed. Although he almost always wrote in verse, many of Chaucer’s works\
    \ run for hundreds of pages and are considered precursors to the modern prose\
    \ novel. Chaucer’s relaxed style combined irreverent humor with compassion and\
    \ an understanding of the human condition that was rare for an author of his time.\n\
    \nChaucer’s most famous work, *The Canterbury Tales*, chronicles a diverse assortment\
    \ of pilgrims as they ride from London to a shrine in Canterbury. The pilgrims\
    \ (each identified by profession—the Knight, the Miller, the Summoner, the Pardoner,\
    \ and so on) take turns delivering the narrative, and although they’re drawn from\
    \ every social stratum and both sexes, Chaucer slips effortlessly into each persona.\
    \ The rich collage of perspectives that emerges provides an invaluable social\
    \ record of the period. Chaucer leans heavily on the stereotypes of the day, but\
    \ his portraits are affectionate—never pompous—and the effect is funny, informal,\
    \ and charming. Because there is no contemporary recording of Chaucer’s verse,\
    \ nor a continuous tradition of performance, we can’t be certain of the intended\
    \ meter. Even the number of syllables is up for debate; by Chaucer’s time, pronunciation\
    \ of trailing vowels was losing favor in conversational English but persisted\
    \ in the written form. However, it’s generally agreed that Chaucer’s long-line\
    \ verses are to be read as rhyming couplets of iambic pentameter, often called\
    \ *riding rhyme* in an allusion to the rhythm of the pilgrims’ horses in *The\
    \ Canterbury Tales* (and so perhaps meant to be delivered at a faster clip than,\
    \ say, Shakespeare’s walkable pentameter). Chaucer’s version of Middle English,\
    \ though unusual to modern English speakers, can be fairly easily inferred (especially\
    \ with the help of a basic glossary).¹ Here’s an excerpt from the “General Prologue”\
    \ to *The Canterbury Tales*, in which Chaucer apologizes for the bawdy nature\
    \ of the upcoming text by explaining that he is duty-bound to faithfully reproduce\
    \ his subjects’ accounts:\n\n> Whoso shal telle a tale after a man,\n> He moot\
    \ reherce as ny as evere he kan\n> Everich a word, if it be in his charge,\n>\
    \ Al speke he never so rudeliche or large,\n> Or ellis he moot telle his tale\
    \ untreve,\n> Or feyne thyng, or fynde wordes newe.²\n\nAnd here’s the same verse\
    \ in modern English:\n\n> Who tells the tale of any other man\n> Should render\
    \ it as nearly as he can,\n> If it be in his power, word for word,\n> Though from\
    \ him such rude speech was never heard.\n> If he does not, his tale will be untrue,\n\
    > The words will be invented, they’ll be new.³\n\n```javascript\n// Bifil that\
    \ in this seson, on this day,\n// In Eich-ian riddle solemnly I lay,\n// To telle\
    \ yow al the condicioun\n// Of nombres parfit and oohers gone astray.\nfunction\
    \ isGladNombre(nombre, ungladNombres) {\n  ungladNombres = ungladNombres || [];\n\
    \  if (ungladNombres.indexOf(nombre) > -1) {\n    return 'untrewe';\n  } else\
    \ {\n    return nombre == 1 ||\n      isGladNombre(summonTheSquares(nombre), ungladNombres.concat(nombre));\n\
    \  }\n}\n\nfunction summonTheSquares(nombre) {\n  return ooneFoldeNombres(nombre).map(sqwarer).reduce(summoner);\n\
    }\n\n// Men intente is pleyn, reeveled anon...\n// For nombres giv'n, re torne\
    \ the somme.\nfunction summoner(nombre, ootherNombre) {\n  return nombre + ootherNombre;\n\
    }\n\n// It suffreth me to tell in rhyme\n// Of acht tymes acht and nyne tymes\
    \ nyne.\nfunction sqwarer(nombre) {\n  return nombre * nombre;\n}\n\n// And now\
    \ the nombre splitte hymself\n// So oone and tweye results from twelfe.\nfunction\
    \ ooneFoldeNombres(nombre) {\n  return String(nombre).split('').map(Number);\n\
    }\n```\n\nThis is vintage Chaucer; in fact, it reads like an abbreviated version\
    \ of *The Canterbury Tales*. As with that sprawling masterpiece, this solution\
    \ is told by several protagonists in addition to the general narrator. (The Summoner\
    \ and The Sqwarer—also pronounced “squire”—might have been lifted directly from\
    \ his earlier work, but we'll let that go.)\n\nThe overall effect is oddly functional:\
    \ Notice how the general narrator speaks in declarative terms (summonTheSqwares),\
    \ and indeed there are no side effects that I can see. It's probably no coincidence\
    \ that *The Canterbury Tales* is equally unimperative; Chaucer pays little attention\
    \ to the passage of time and place—his primary interest is in the characters and\
    \ their stories."
  mdcn: "\n# 弗吉尼亚·伍尔夫\n1882–1941\n\n弗吉尼亚·伍尔夫是现代文学抒情风格的先驱。她大量运用修辞手法——头韵、谐音、韵律——其从容不迫的语言具有一种丰盈的梦幻特质。以下摘自《到灯塔去》的段落看似散文，但节奏如此鲜明，文字游戏如此丰富，读起来宛如诗歌：\n\
    \n> 秋日的树木，虽已凋零，却如破烂旗帜般闪耀，在阴冷大教堂般的幽暗洞穴中摇曳，那里大理石书页上的金色字母描述着战场上的死亡，白骨在遥远的印度沙滩上漂白、燃烧。¹\n\
    \n她的句子不受形式结构束缚，鲜少简练，常扩展成绵长的意识流，用分号和破折号串联。\n\n伍尔夫认为感知构成现实的主体，她呈现的并非由言语或行为拼凑，而是由百万个私人思绪组装的复合真相——用她的话说，是“由颤抖碎片构成的整体”。伍尔夫穿梭于角色之间，无情探询每个心灵，让未言说的思绪充斥页面。这段摘自《达洛维夫人》的震撼文字中，克拉丽莎刚得知一场羞辱性的冷遇：\n\
    \n> 她将记事簿放在门厅桌上，开始\n> 缓步上楼，手扶栏杆，\n> 仿佛刚离开一场聚会，此刻\n> 这位朋友、那位朋友接连闪过\n> 她的命运、她的声音；她已关门外出\n\
    > 独自伫立，单薄身影对抗着\n> 可怕的夜色……突然感觉自己\n> 枯萎、衰老、失去胸脯，白日\n> 那碾磨、吹拂、绽放的一切，\n> 在室外，窗外，从她逐渐衰竭的\n\
    > 身躯与头脑中流逝。\n\n近一个世纪后，伍尔夫笔下的现实依然如往昔般有力。\n\n# 如果海明威写JavaScript\n弗吉尼亚·伍尔夫\n\n```javascript\n\
    function happy(number) {\n  var next, numeral, noneOfThese = [];\n\n  //除非数字为零；或一；或已被尝试过\n\
    \  while (number && number != 1 && noneOfThese[number] == null) {\n    next =\
    \ 0, numerals = String(number).split('')\n    //数字被迫分离，相乘，舍弃；为何服务？\n    while\
    \ (next = next+numerals[0]*numerals[0], numerals.shift(), numerals.length);\n\
    \    noneOfThese[number] = true, number = next\n  }\n\n  //成为一；孤独；快乐\n  return\
    \ number == 1\n}\n```\n\n若说分号是JavaScript的句号，那么逗号运算符便是它的分号。程序员伍尔夫钟爱逗号运算符，在她的快乐数字解法中过度使用。这创造出梦幻、忧郁的JavaScript形式（还有其他形式吗？），因沉重、近乎危险的*头韵*和一些绝美表达而更添梦幻感。在《到灯塔去》中，伍尔夫写道夜之阴影：“它们拉长；它们变暗”；在她的快乐数字解法中，我们读到充满惆怅诗意的`numerals.shift()`、`numerals.length`。情绪变幻莫测。伍尔夫开始练习时足够自信，但即便在系统讲解过程时，疑虑仍悄然滋生。渐渐地，她的内心独白渗透进注释；她焦虑地拆解每个数字的冷酷本质。这一切控制、操纵……目的何在？\n\
    \n结尾处，伍尔夫将快乐的价值（即数字1）等同于独处的欢愉，或许暗指她著名的《一间自己的房间》，文中她主张女性作家应获得实体与隐喻的空间。\n\n> *无论何人，只要他愿，*\n\
    > *都能既好又快地编写JS。*\n\n# 杰弗里·\n乔叟\n1343–1400\n\n# 如果海明威写JavaScript\n杰弗里·乔叟\n\n作为最早用中古英语白话写作的诗人之一，杰弗里·乔叟的词汇与风格选择对后世语言文学影响深远。尽管几乎总以韵文创作，乔叟的许多作品篇幅长达数百页，被视为现代散文小说的先驱。乔叟的轻松风格融合了戏谑幽默、悲悯情怀以及对人类处境的深刻理解，这在当时的作者中实属罕见。\n\
    \n乔叟最著名的作品《坎特伯雷故事集》记录了一群朝圣者从伦敦前往坎特伯雷圣地的旅程。朝圣者们（各以职业命名——骑士、磨坊主、差役、赦罪僧等）轮流讲述故事，尽管来自各社会阶层与性别，乔叟却能轻松融入每个角色。由此产生的丰富视角拼贴为当时社会留下了宝贵记录。乔叟大量运用当时的刻板印象，但其描绘充满温情——从不浮夸——效果幽默、随性而迷人。由于乔叟韵文无当代录音，也无持续表演传统，我们无法确定其预定韵律。甚至音节数量也存争议；乔叟时代，尾元音在英语口语中已渐消退，但在书面语中延续。不过，学界普遍认为乔叟的长行诗句应读作五音步抑扬格对句，在《坎特伯雷故事集》中常被称为*驰骋韵*，暗指朝圣者马匹的节奏（因此可能比莎士比亚那适合漫步的五音步节奏更快）。乔叟的中古英语版本对现代英语使用者虽显陌生，却可相当容易地推断（尤其借助基础词汇表）。¹\
    \ 以下是《坎特伯雷故事集》“总引”的节选，乔叟为文本的粗俗之处致歉，解释道他有义务忠实复述叙述者的原话：\n\n> 若有人要讲述他人的故事，\n> 他应尽可能忠实复述\n\
    > 逐字逐句，若力所能及，\n> 即使对方言辞粗鄙放肆，\n> 否则他的故事便是虚假，\n> 要么捏造事实，要么创造新词。²\n\n这是同一诗句的现代英语版：\n\
    \n> 谁若讲述他人的故事，\n> 就该尽可能如实转述，\n> 若力所能及，逐字照搬，\n> 即使从未听闻如此粗言。\n> 若不如此，故事便是虚假，\n>\
    \ 词语将被虚构，全新创造。³\n\n```javascript\n// Bifil that in this seson, on this day,\n\
    // In Eich-ian riddle solemnly I lay,\n// To telle yow al the condicioun\n// Of\
    \ nombres parfit and oohers gone astray.\nfunction isGladNombre(nombre, ungladNombres)\
    \ {\n  ungladNombres = ungladNombres || [];\n  if (ungladNombres.indexOf(nombre)\
    \ > -1) {\n    return 'untrewe';\n  } else {\n    return nombre == 1 ||\n    \
    \  isGladNombre(summonTheSquares(nombre), ungladNombres.concat(nombre));\n  }\n\
    }\n\nfunction summonTheSquares(nombre) {\n  return ooneFoldeNombres(nombre).map(sqwarer).reduce(summoner);\n\
    }\n\n// Men intente is pleyn, reeveled anon...\n// For nombres giv'n, re torne\
    \ the somme.\nfunction summoner(nombre, ootherNombre) {\n  return nombre + ootherNombre;\n\
    }\n\n// It suffreth me to tell in rhyme\n// Of acht tymes acht and nyne tymes\
    \ nyne.\nfunction sqwarer(nombre) {\n  return nombre * nombre;\n}\n\n// And now\
    \ the nombre splitte hymself\n// So oone and tweye results from twelfe.\nfunction\
    \ ooneFoldeNombres(nombre) {\n  return String(nombre).split('').map(Number);\n\
    }\n```\n\n这是典型的乔叟；事实上，读起来像《坎特伯雷故事集》的缩写版。与那鸿篇巨制一样，此解法除总叙述者外，还有多位主角讲述。（差役和平方者——也发音为“squire”——可能直接取自其早期作品，但我们暂不深究。）\n\
    \n整体效果奇妙地实用：注意总叙述者使用陈述性术语（summonTheSqwares），我确实未见副作用。或许并非巧合，《坎特伯雷故事集》同样非命令式；乔叟几乎不关注时空流逝——其主要兴趣在于角色及其故事。\n"
