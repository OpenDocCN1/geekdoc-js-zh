  md: 'Nabokov''s version of English is all his own, and so it is with his JavaScript.


    So what on earth is going on here? Or should we ask what on earths? Because the
    keys to Nabokov''s solution are Terra and Antiterra, the twin worlds of his grandiose
    masterpiece Ada. Terra resembles our earth, while Antiterra merely almost resembles
    it, being shifted in time and divergent of history.


    Yes, yes, you ask, but what actually is going on here? Okay, remember how Holden
    Caulfield dispenses with history? Well, so does Nabokov (being famously wary of
    conventional wisdom''s tyranny). And how? By running two happy numbers puzzles
    simultaneously—one on Terra, the other on Antiterra. Since Antiterra spins a little
    faster than Terra, it looks ahead a little farther each time. Now, if Terra and
    Antiterra should ever elicit the same response at the same time, we know in advance
    that history has repeated itself, and must therefore be looping. At this point
    the game is up, and we declare the hapless number unhappy.


    On the other hand, should we be fortunate enough to reach numeric ecstasy, Nabokov
    will reprise the famous opening line of Lolita, only this time the exacting glossopharyngeal
    instruction is amended to form the word happiness.


    And that''s that. Though I admit I''m still scanning the code for evidence of
    further riddling . . .'
