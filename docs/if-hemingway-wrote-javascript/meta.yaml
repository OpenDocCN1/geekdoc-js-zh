    Breton has most likely named his Fibonacci exercise after an old flame. He visualizes
    iteration as a remote staircase plied by a ghostly fleet of ancient vessels. The
    staircase is of indeterminate length, but an umbrella appears to mark the point
    beyond which further ascent is impossible. As our protagonist climbs each step,
    the galleons and brigantines shuffle to the haunting melody of a lone bassoon.


    Breton’s solution is underpinned by characteristically elegant logic—he’s using
    a comma operator as an ethereal device with which to simultaneously assign brigantines
    to galleons and bassoons to brigantines.


    Hats off, André!'
