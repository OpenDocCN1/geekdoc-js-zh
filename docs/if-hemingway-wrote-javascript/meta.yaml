    \ = new Object({2:2, 6:3});\n\nfunction unfactorial(evidence){\n  //It is my belief,\
    \ Watson, founded upon my experience, that a\n  //mathematician would never chase\
    \ the factorial of zero.\n  if (evidence === 1) { return 1; }\n\n  //Seek out\
    \ logical precedence.\n  if (caseHistory[evidence]){\n    //Elementary!\n    return\
    \ caseHistory[evidence];\n  }\n\n  //Eliminate the impossible.\n  if (evidence\
