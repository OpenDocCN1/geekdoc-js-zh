  - '[PAGE 131]


    Lewis Carroll was an esteemed mathematician, a pioneering photographer, a philosopher,
    and an Anglican deacon, but he is best known for his fanciful nonsense stories.


    *Alice''s Adventures in Wonderland* is a remarkable piece of escapist literature
    that influenced works as diverse as *Finnegans Wake* and *The Matrix*. For all
    its suggested allegory and academic allusions, what makes Alice a classic is the
    sheer, unapologetic madness of it all. Written in an era when children''s fiction
    was dominated by stodgy morality tales, the plot of Alice couldn''t be more refreshing:
    Bored Alice falls down a rabbit hole and hangs out with a menagerie of lovable
    crazies. When a creature speaks gibberish or acts peculiarly (which is most of
    the time), Carroll doesn''t try to rationalize its behavior, as his contemporaries
    might have; instead, the reader is permitted to revel in absurdity for its own
    sake. Here''s a quintessentially harebrained exchange from the mad tea party:


    > "What a funny watch!" [Alice] remarked.

    "It tells the day of the month, and doesn''t tell what o''clock it is!"


    "Why should it?" muttered the Hatter. "Does your watch tell you what year it is?"


    "Of course not," Alice replied very readily: "but that''s because it stays the
    same year for such a long time together."'
  - '[PAGE 132]


    "Which is just the case with mine," said the Hatter.


    Alice felt dreadfully puzzled. The Hatter''s remark seemed to have no sort of
    meaning in it, and yet it was certainly English. "I don''t quite understand you,"
    she said, as politely as she could.


    "The Dormouse is asleep again," said the Hatter, and he poured a little hot tea
    upon its nose.¹


    The creatures of Wonderland are consistently rude to Alice, and though in over
    her head (literally) and generally uneasy about the whole situation, she never
    loses her dignity and always gives as good as she gets. Much humor is derived
    from this dynamic—the creatures'' mild disdain for Alice is matched by her gentle
    contempt for them.


    The sequel, *Through the Looking-Glass, and What Alice Found There*, is essentially
    a game of chess played on the other side of Alice''s bedroom mirror. It features
    the beloved nonsense poem "Jabberwocky," which is written in mirrored text and
    peppered with made-up words, some of which (notably, the portmanteau *chortle*)
    have made it into everyday speech.'
