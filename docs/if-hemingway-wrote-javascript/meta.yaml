    angles. The strength of Nabokov lies in the check (and balance) of the sinister
    obbligato.”⁴


    Nabokov is a writer in complete control. Words are his minions; characters, as
    he famously put it, are his “galley slaves.” And we, the readers, are probably
    just there for his amusement.'
