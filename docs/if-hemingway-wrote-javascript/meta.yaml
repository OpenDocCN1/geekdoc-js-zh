  md: 'The most celebrated English novelist of the 19th century, and still immensely
    popular today, Charles Dickens wrote 19 novels, none of which has ever gone out
    of print.


    Most of Dickens''s fiction was originally published in monthly installments—in
    magazines or as crudely bound, standalone pamphlets. Since each installment was
    relatively cheap, his stories were available to those of lesser means, which provided
    Dickens with a receptive audience for his accounts of social injustice. Damning
    portraits of villainous landowners and belligerent factory owners were juxtaposed,
    as never before, with vivid depictions of the destitution and squalor in London''s
    wretched underbelly.


    Dickens ended each installment with a cliffhanger—an unresolved misfortune or
    unexplained revelation—so as to beef up anticipation for the next issue. Famously,
    as Little Nell''s condition deteriorated, crowds in New York gathered on the wharf
    shouting, “Is Nell dead?!” to the crew of the vessel delivering the next installment
    of *The Old Curiosity Shop*.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'Everything about Dickens''s characters is larger than life, starting with their
    names. In Dickens''s world, names are invariably a window into their owners''
    personalities, whether via onomatopoeia (*Martin Chuzzlewit, Mercy Pecksniff,
    Polly Toodle*), portmanteau (*Mr. Murdstone, Lawrence Boythorn, Mr. Tulkinghorn*),
    or metaphor (*Mealy Potatoes, Mr. Smallweed, Clarence Barnacle*). Dickens assigns
    idiosyncrasies and affectations to great comic effect and uses his exceptional
    flair for dialect to designate education, social status, and morality.


    Dickens''s talent for portraying good and evil is to some extent his undoing.
    Whereas the best fiction recognizes that there is grace and ugliness in each of
    us, and exploits that conflict for dramatic effect, Dickens''s tendency to paint
    almost every character as either victim or villain limits our ability to identify
    with any of them. Then again, his lively writing, wonderful dialog, and eloquent
    fusing of dark and comic themes may be compensation enough.'
