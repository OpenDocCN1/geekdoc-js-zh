  md: 'Borges''s solution combines several of his favorite motifs: mathematical theory,
    the geometric arrangement of spaces, a suggestion of infinity, and a story within
    a story. This is classic Borges: a narrator—who, in his excitement, possibly overplays
    the staircase imagery—tells of a mysterious book (*Monsters Ascending a Staircase*),
    and within a few short lines, we''re right there living it.


    As we watch the dogged procession of upwardly mobile monsters, we can''t help
    wondering when Borges will get to the math part. Predictably, it turns out we
    were already there; the rank of the stair represents the numerator, and each monster''s
    stride the denominator. Stairs that remain unstomped have no divisors and are
    thus primes. By transporting us to this imaginary world, Borges creates a distraction
    from the raw mechanics of prime numbers, while simultaneously illustrating how
    utterly simple, and universal, they are.


    Borges''s logic is clean and well organized, and his JavaScript straightforward
    and free from unnecessary cleverness, as befits his dislike for syntactic filigree.
    Yet, by dint of a few well-chosen comments and variable names, he achieves a glorious
    otherworldly effect.'
