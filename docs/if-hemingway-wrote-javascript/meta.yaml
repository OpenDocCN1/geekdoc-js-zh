    阿瑟·柯南·道尔爵士\n\n阿瑟·柯南·道尔爵士接受过医学训练，而写作是他的天命。他创作了大量短篇小说、历史小说、浪漫小说和奇幻小说，以及无数关于军事、不公正和唯心论等多样主题的非虚构类书籍。但他最为人所知的，是塑造了标志性的侦探夏洛克·福尔摩斯。福尔摩斯故事的结构并无突破性；叙事大多是线性的，散文也带有十足的维多利亚时代的浮夸。福尔摩斯这个角色也并非完全原创——道尔几乎承认他使用了埃德加·爱伦·坡笔下的非正统侦探C·奥古斯特·杜宾作为蓝本（道尔也大量借鉴了坡对怪诞氛围的描绘）。但写作生动活泼，我们被聪明绝顶却古怪的福尔摩斯与极其理性却平凡的助手华生之间的情感鸿沟所吸引。除此之外，道尔还精心设计了一群奇妙古怪的次要人物，唤起了伦敦阴森的地下世界。\n\
    \n福尔摩斯本人缺陷明显。他懒惰、自负、虚荣、冲动且喜怒无常。他是个瘾君子，不信任女性，回避人际关系，并且强烈暗示有自闭倾向。对毒药和烟草品种的渊博知识与几乎完全缺乏基础科学常识形成鲜明对比。（在他们初次见面后不久，华生惊讶地得知福尔摩斯并不知道地球绕着太阳转。）甚至连他的方法也值得商榷。福尔摩斯声称的演绎法实际上是归纳法——一系列基于研究细节的猜测：\n\
    \n> 夜间访客有两位，一位因其身高而引人注目（我根据他的步长推算），另一位则穿着时髦，从他靴子留下的小巧而优雅的印记可以判断……我嗅了嗅死者的嘴唇，察觉到一丝微酸的气味，由此推断他是被迫服下了剧毒。¹\n\
    \n然而，无论是靠运气还是判断力，他是个赢家；他自己知道，我们也知道。\n\n## 如果海明威写JavaScript\n阿瑟·柯南·道尔爵士\n\n```javascript\n\
