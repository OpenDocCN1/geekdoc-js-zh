    Italo Calvino was both a masterful storyteller and a literary innovator. Fearing
    the traditional novel had run its course, and feeling imprisoned by its boundaries,
    Calvino experimented obsessively with new forms. His early novels were main-stream,
    realist affairs, and although they were well received, he was deeply unsatisfied,
    both with the tedium of production and the end result. Here, in a letter to a
    friend, he explains his unhappiness:


    > The novel I was writing, which for months and months had sucked all my blood
    (because, stubborn as I am, I was determined to finish it even though I no longer
    felt it was going anywhere), is dead, awful, full of wonderful clever things but
    desperately bad, forced, it''ll never work and I must not finish it.¹


    Four years later, Calvino experienced a creative epiphany:


    > I began doing what came most naturally to me—that is, following the memory of
    the things I had loved best since boyhood. Instead of making myself write the
    book I ought to write, the novel that was expected of me, I conjured up the book
    I myself would have liked to read, the sort by an unknown writer, from another
    age and another country, discovered in an attic.²'
  - '[PAGE 168]


    Calvino found his calling as a writer of postmodern fables. His breakthrough work,
    *The Cloven Viscount*, was written in just 30 days and chronicles the adventures
    of a nobleman who, literally split in half by a cannonball, continues to live
    as two separate people. Having found his voice, Calvino never looked back. He
    eagerly explored new forms—mathematical, symmetrical, self-referential—infusing
    each creation with a winsome cocktail of wit, badinage, and gentle melancholy.


    Today, Calvino is best known for the metafictional *If on a Winter''s Night a
    Traveler*, a nutty trompe l''oeil of a novel in which the author appears to bend
    the laws of nature by casting you, the reader, as the protagonist. Owing to a
    series of publishing errors, each alternate chapter is the beginning of an unrelated
    novel, and the book is an account of your vain attempt to read it. For all his
    shenanigans, Calvino never forgets that he is first and foremost a writer of stories.
    Each false start is a compelling tale, which, of course, leaves you wanting more.'
