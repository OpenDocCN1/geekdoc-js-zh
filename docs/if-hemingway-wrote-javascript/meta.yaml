    \n> 现在是我们不满的冬天\n\n```\nfunction theSeriesOfFIBONACCI(theSize) {\n    //一场两幕的计算\n\
    \    //运用了JAVA-SCRIPTE那幽默的逻辑\n\n    //角色表\n    var theResult; //一个包含数字的数组\n  \
    \  var theCounter; //一个服务于FOR循环的数字\n\n    //第一幕：为初始化添加一个零\n\n    //[登场：theResult]\n\
    \n    //为那高贵的列表授予一个零\n    var theResult = [0];\n\n    //第二幕：一个循环，查询并求和最后的两个数字\n\
