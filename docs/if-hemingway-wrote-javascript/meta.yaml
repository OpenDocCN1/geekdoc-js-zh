    \ describes a fake encyclopedia for a made-up planet, the discovery of which triggers\
    \ an unstoppable wave of imitation that gradually wipes out all existing cultures.\
    \ “The Garden of Forking Paths” cites a sprawling and chaotic novel in which each\
    \ protagonist embarks on all possible courses of action simultaneously, forming\
    \ an infinite network of temporal paths that occasionally converge at points in\
    \ the future.\n\nIn “The Library of Babel,” Borges tells of an endless array of\
    \ identical hexagonal rooms, all containing 20 shelves, each of which is stocked\
    \ with 32 identically bound 410-page books. At some point in history, a “librarian\
    \ of genius” deduced that, since no two books are alike and all books are formed\
    \ from a random assortment of the same characters, the library must contain every\
    \ book ever written and every book that will ever be written.<sup>4</sup> In an\
    \ uncanny nod to the not-yet-invented Internet, the library’s patrons gradually\
    \ realize that their ultimate treasure trove of knowledge is in fact an infinite\
    \ universe of almost entirely useless data.\n\nBorges was also an acclaimed poet.\
    \ Although his poems incorporate many of his favorite themes, they tend to be\
