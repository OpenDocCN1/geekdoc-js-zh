  md: 'What if William Shakespeare were asked to generate the Fibonacci series or
    Jane Austen had to write a factorial program?

    In *If Hemingway Wrote JavaScript*, author Angus Croll imagines short JavaScript
    programs as written by famous wordsmiths. The result is a peculiar and charming
    combination of prose, poetry, and programming.


    The best authors are those who obsess about language—and the same goes for JavaScript
    developers. To master either craft, you must experiment with language to develop
    your own style, your own idioms, and your own expressions. To that end, *If Hemingway
    Wrote JavaScript* playfully bridges the worlds of programming and literature for
    the literary geek in all of us.


    The AUTHOR

    Angus Croll is obsessed with JavaScript and literature in equal measure. He works
    on Twitter''s UI framework team, where he co-authored the Flight framework. He
    writes the influential *JavaScript, JavaScript* blog and speaks at conferences
    worldwide.'
