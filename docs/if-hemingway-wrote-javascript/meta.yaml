    ROBERTO BOLAÑO


    If you don''t read at least one book by Bolaño before you die, then you''ve wasted
    your life.

    As the last great Latin American writer of the 20th century, Bolaño is a worthy
    successor to the magical realists that preceded him, but his writing is harder
    to characterize. Yes, there are recurring themes: the protagonist (more often
    than not, an alter ego of the author) as literary action hero, poetry as a beacon
    of virility or a catalyst for intellectual gang warfare. But for all his professed
    love of form, Bolaño''s work is often messy, sprawling, and inconsistent, liable
    to lurch into pages of tangential minutiae or take a sudden turn that orphans
    erstwhile heroes and leaves tantalizing plotlines unresolved. Then again, that
    might just be the key to his greatness.

    Bolaño, a poet by inclination and a novelist by necessity, feels no need to comply
    with novelistic conventions (as one of his characters puts it, "Rules about plot
    only apply to novels'
