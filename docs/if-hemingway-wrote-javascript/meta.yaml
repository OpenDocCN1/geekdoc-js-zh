    Programming as we know it is anathema to Kerouac. His “Essentials of Spontaneous
    Prose” included the directive “never afterthink to ‘improve’ or defray impressions,”
    so we can assume refactoring is out.⁶


    Apparently, Kerouac fashioned this solution while in full-blown “jazz prosody”
    mode because planning was so alien to his process that even functions are verboten.
    His solution will return only the factorial of 43. If you want the factorial of
    another number, you’ll need to pull a stimulants-induced all-nighter and rewrite
