    # IF HEMINGWAY WROTE JAVASCRIPT

    JORGE LUIS BORGES


    The restrained elegance of Jorge Luis Borges''s phrasing stands in contrast to
    his fanciful imagery and wild, boundless imagination. Borges was a free spirit
    who followed his multiple obsessions (time, the universe, labyrinths, spaces)
    with unrestrained zeal and then transcribed them into simple, classically crafted
    prose. Borges always maintained that he was a reader at heart, sharing Nabokov''s
    fierce belief in reading for reading''s sake. He dismissed the importance of meaning
    or message (“I don’t intend to show anything. I have no intentions”¹). The purpose
    of a book, Borges insisted, is aesthetic pleasure; a writer should be judged “by
    the enjoyment he gives and by the emotions one gets.”² Borges never wrote a full-length
    novel; he felt they were unworthy of the effort: “The composition of vast books
    is a laborious and impoverishing extravagance. To go on for five hundred pages
    developing an idea whose perfect oral exposition is possible in a few minutes!”³
    Instead, he concocted vast imaginary books and made them the subject of his short
    stories. “Tlön, Uqbar, Orbis Tertius” describes a fake encyclopedia for a made-up
    planet, the discovery of which triggers'
  - '[PAGE 126]


    an unstoppable wave of imitation that gradually wipes out all existing cultures.
    “The Garden of Forking Paths” cites a sprawling and chaotic novel in which each
    protagonist embarks on all possible courses of action simultaneously, forming
    an infinite network of temporal paths that occasionally converge at points in
    the future.


    In “The Library of Babel,” Borges tells of an endless array of identical hexagonal
    rooms, all containing 20 shelves, each of which is stocked with 32 identically
    bound 410-page books. At some point in history, a “librarian of genius” deduced
    that, since no two books are alike and all books are formed from a random assortment
    of the same characters, the library must contain every book ever written and every
    book that will ever be written.<sup>4</sup> In an uncanny nod to the not-yet-invented
    Internet, the library’s patrons gradually realize that their ultimate treasure
    trove of knowledge is in fact an infinite universe of almost entirely useless
    data.


    Borges was also an acclaimed poet. Although his poems incorporate many of his
    favorite themes, they tend to be more personal than his stories, full of vulnerability
    and romantic angst.'
