  - '[PAGE 74]


    Doyle was clearly in full deerstalker- and magnifying glass–mode when solving
    the case of the hidden factorial.


    Or rather, unfactorial. Why? Because Holmes always works backward toward the deed’s
    inception. As he puts it, “It is a capital mistake to theorise before one has
    data. Insensibly one begins to twist facts to suit theories, instead of theories
    to suit facts.”² In this case, the data is the outcome of existing factorial procedures,
    and from this, Holmes establishes the theory that will track down those fiendish
    numbers at the operation’s source.


    As expected, Holmes’s process is precise and meticulously ordered; clearly, he
    was an early adopter of the imperative approach to programming. Notice he also
    directs his utility to run in strict mode; he’ll tolerate no sloppiness. He starts
    with an educated guess—characteristically disguised as certainty—in assuming that
    no sane person would seek the factorial of 0. Holmes quickly gains his stride
    so that by the end of the exercise, he imperiously derides those who would supply
    false arguments as charlatans and impostors. Case closed, Watson.'
