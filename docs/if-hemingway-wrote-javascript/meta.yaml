    \n# # 塞缪尔·约翰逊\n\n1709–1784\n\n塞缪尔·约翰逊作为一位风趣哲人、能为各种场合妙语连珠的流行形象，很大程度上归功于詹姆斯·鲍斯韦尔1791年出版的著名传记《约翰逊传》。但鲍斯韦尔，无论是出于敬仰还是无知，往往淡化了约翰逊性格中更阴暗的一面。\n\
    \n约翰逊一生大部分时间都饱受疾病困扰。除了接连不断的肉体病痛，他还有大量的精神困扰。约翰逊患有强迫症，很可能还受妥瑞氏症之苦（他的教学尝试因持续的面部抽搐和神经性抽动而受阻，这吓跑了赞助人），并且饱受令人衰弱的抑郁症折磨。这些众多的疾病，再加上父母的债务，使约翰逊陷入超过30年的经济困境。最终，是约翰逊渊博的才智，加上无可挑剔的职业道德，为他赢得了认可，使他得以摆脱贫困。\n\
    \n1746年，一群知名书商联合委托约翰逊编纂两卷本的《英语辞典》。约翰逊的辞典并非第一部英语辞典，但以往的成果都极具选择性，主要集中于不常见的单词（矛盾的是，这些词通常更容易定义），并且几乎没有或完全没有提供用法说明。约翰逊的辞典定义了42,000个单词，每个定义都附有一个或多个说明用法的文学引语。鲍斯韦尔的影响力可见一斑，因为约翰逊的辞典常被视为一部幽默作品；然而，尽管其中确实有一些机智的定义（最著名的是对“词典编纂者”的自贬式解释，称其为“一个无害的苦工”），但这本辞典是真正的学术著作，在出版100年后仍被认为是卓越的英语辞典。约翰逊——同时也是传记作家、诗人和文学评论家——作品极其丰富，但他的写作有时被批评为单调乏味，甚至学究气重；他经常在同一个句子里接纳对立的论点，仿佛在呈现内心争吵的双方。然而，这正是约翰逊的魅力所在。大多数作家会为了呈现一个统一的论点而掩饰自己观点的善变，而约翰逊却邀请我们进入他矛盾的灵魂，与他一同思考。其结果是温暖而充满人性的。\n\
    \n# 各种数字通过电子魔法被召唤而来。\n\n```coffeescript\nfactorial = (n) ->\n    # All argument\
    \ is against it, yet all belief is for it.\n    return 1 unless n\n\n    # Ingenious\
    \ sophistry to prove the palp'bly OBVIOUS\n    return 1 if n is 1\n\n    # Recursion\
    \ (n.)\n    # a program that calls 'pon itself in the manner of\n    # a dog returning\
    \ unto its VOMIT\n    return n * factorial n - 1\n```\n\n当我打开约翰逊完成的作业时，我发现这位好医生留下了一张简短的便条，解释他为什么选择使用CoffeeScript：“先生，`function`关键词是一个**累赘**，花括号则是毫无价值的**装饰**。我需要一个清晰明了的脚本来记录我各种**沉思**。”\n\
    \n确实，约翰逊的解决方案本可以清晰优雅，如果不是充斥着暴躁的俏皮话，暴露出他特有的自我怀疑和内心的反复纠结的话。他对`factorial(0)`等于1表示怀疑，对仅仅需要一整个语句来确认`factorial(1)`确实等于1感到好笑，并以一个讽刺性的递归定义结束，这个定义大概出自他自己的词典。\n\
    \n约翰逊的解决方案处于艺术与戏仿的交汇点——一种温和的自嘲，融合了简洁的表达和真正的美。先生，我向您脱帽致敬。\n\n![](img/e3611bbec0f345b635c8b5856486bcbb_69_0.png)\n\
