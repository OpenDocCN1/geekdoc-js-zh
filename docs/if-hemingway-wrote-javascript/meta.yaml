    Calvino, for whom traditional software patterns are too limiting, has chosen to
    write his sayIt solution in the form of his self-referential masterpiece *If on
    a Winter''s Night a Traveler*. And remarkably, it looks as if this daring gamble
    has paid off. Although the result is a little long-winded, there''s an elegance
    and symmetry to the neatly nested routines, while the logic is breezy and uncluttered.
    Notice that each function (chapter) bears a comment that is a playful take on
    the corresponding chapter title in the original work.


    On the face of it, nothing happens. Each function encloses another—deeper and
    deeper we go, opening functions like Russian dolls until we reach the core. Expecting
    an answer, we''re instead redirected back to Chapter 1, and with exasperation
    we begin the cycle anew.


    Cunningly, the meaningful part of the solution is squirreled away in the ostensibly
    trivial chapter0r function, which is invoked by each named chapter and offers
    up the next chapter or, when no word is passed, finally brings blessed relief
