- img_proc: true
  md: 'It all seemed so promising. Kafka’s solution, typically plain and lacking in
    ornamentation, looked robust enough. But running the code revealed a hideous bug,
    and there seems to be no way around it.


    At first all went well. With each successive call to sayIt, the supplied word
    was added to the stored array. Simple enough, right? When it came time to return
    the list of words, we called sayIt without arguments. But then the function started
    reinvoking itself. Again and again.


    Now we’re recursing endlessly, with no hope of redemption. But wait, I think it’s
    going to be okay after all because, look . . . we’re catching the stack overflow
    exception. And yet, this is where things get very strange indeed; our array of
    words has somehow become a terrible and useless string. It’s as though it were
    subject to some kind of metamorphosis . . .


    And so, alas, Kafka’s is the only solution in the book that does not successfully
    resolve itself.

    Very Kafkaesque.'
