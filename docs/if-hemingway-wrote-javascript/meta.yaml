    ## 前言


    安格斯和我因共同痴迷于"外部世界"而走到一起——这里的"外部"指任何与硅谷背道而驰的艺术、文学或其他表达。


    大约在2012年，这凝聚成了##ABC，一个实际上从未阅读过任何东西的IRC读书会。相反，我们更像是一个互助小组，聚集在一起，通过艺术和文学的视角，在世界中理解我们的工作、我们正在做的事情以及我们做事的方式。


    其中一些对话后来启发了http://byfat.xxx上的文章——比如迪瓦·马尼安出色的"YES P1Z LETS BURNNNN"或我的"rien ne
    tient en place"。但没有哪篇比安格斯的"假如海明威编写JavaScript"更受欢迎。


    安格斯成功地清晰表达了一个核心问题，这个问题困扰着我们许多人：我们对"精粹"以及"最佳方式"这类普遍说辞的反感。而他通过赞美JavaScript的声音和多样性，通过探索和实验做到了这一点。他让这门语言成为我们的，正是这种归属感解放了其表达的潜力——它的声音让我们的工作不仅变得可以忍受，而且真正令人兴奋。


    关于创造力和语言作为技艺的思考。看着这个想法从IRC发展到会议巡回，再到现在的书籍形式——这个媒介激发了整个思路——这很有趣。


    我不久后写道："就像一位画家画一碗水果，如果我必须以同样的方式表达每件作品——唯一的区别只是水果本身——我肯定早就疯了。"这种对编码以及我整个职业生涯的洞见，我非常感谢我亲爱的朋友安格斯以及他对创造力和语言作为技艺的思考。


    雅各布·桑顿 (@fat)

    2014年8月


    ## 引言


    欧内斯特·海明威会编写JavaScript吗？简·奥斯汀会与函数提升搏斗吗？弗兰兹·卡夫卡会因原型继承而陷入绝望吗？撇开一些恼人的事实（比如JavaScript直到1995年才被发明），很容易看出为什么这门最具文学性的计算机会语言会引起这些以及其他作家的兴趣。


    JavaScript与自然语言有许多共同之处。当以原创方式组合简单的习语时，它的表现力最为丰富；其语法虽有限却灵活，在不影响可读性的前提下促进了创新。而且，像自然语言一样，它随时可以书写。一些更为繁复的JavaScript表亲必须使用IDE（集成开发环境——一种编码的鲁布·戈德堡机械）进行编辑。JavaScript只需要一个文本文件和一颗开放的心。


    本书中的一些解决方案，至少可以说是不寻常的。最伟大的小说家、诗人和剧作家是那些准备开辟新天地、为后人铺路的人。


    > "所有最优秀的作家……都是那些公然违抗规则的人。"

    —史蒂芬·平克论规范性语言¹


    自然语言没有主导范式，JavaScript也是如此。开发者可以从各种方法中选择——过程式、函数式和面向对象——并根据需要融合它们。大多数想法可以用多种方式表达，许多JavaScript程序员可以通过其独特的编码风格被识别出来。


    同样，JavaScript语言的未来取决于其开发者的意愿，即突破极限，尝试新模式以造福整个社区。当优秀的程序员打破规则时，他们这样做是为了克服阻碍其表达能力的武断惯例。曾经被视为危险和激进的模式——立即

