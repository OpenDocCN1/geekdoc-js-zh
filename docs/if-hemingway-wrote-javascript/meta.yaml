  md: '# IF HEMINGWAY WROTE JAVASCRIPT

    DAVID FOSTER WALLACE


    Wallace is on familiar ground here: As an undergraduate he studied modal logic
    and mathematics, and later he wrote a book about infinity.⁴ Moreover, in a 1996
    radio interview, Wallace claimed he modeled *Infinite Jest* after the Sierpinski
    gasket, “which is a very primitive kind of pyramidal fractal.”⁵


    In the same interview (and perhaps still alluding to fractals), Wallace observes
    that much of modern intellectual life is about building relationships between
    discreet pieces of information, so it’s not hard to see why his algorithm of choice
    is the Sieve of Atkin, a series of apparently arbitrary logical fragments that
    together form a highly efficient prime-number generator.


    As a post-postmodern author who rejects serial irony as tedious and unconstructive,
    Wallace approaches the problem with honest enthusiasm. (You can be pretty certain
    he devoured the entire ECMA-Script standard before he wrote a line of code.) Such
    is his passion for explanatory detail that he very nearly drowns his JavaScript
    in a sea of characteristically DFW-esque annotations.


    Oh, and the title *yearOfTheLightningQuickAtkinSieve* is a nod to *Infinite Jest*,
    wherein chapters are named for calendar years, and calendar years are named for
    the highest bidder.'
