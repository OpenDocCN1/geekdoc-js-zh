    \ Meanwhile, the setting of `theDuchess` (a play on words suggesting `theCount`?)\
    \ to the Jabberwocky-esque *frumious Bandersnatch* is a pure red herring (the\
    \ value of `theDuchess` is reassigned a couple of lines later).\n\nBut the coup\
    \ de grâce is Carroll's use of the much-maligned but ridiculously powerful `eval`\
    \ statement. Carroll ingeniously collapses a whole mass of code into a few lines\
    \ by using `join` as an iterator, shoehorning the logic into the voids between\
    \ each array element. Finally, he uses `eval` to execute (Queen of Hearts-style)\
    \ the generated string, which by now is as long as the mouse's tail and as mad\
    \ as a March hare."
  mdcn: "\n## 豪尔赫·路易斯·博尔赫斯\n1899–1986\n\n## 如果海明威写了JavaScript\n豪尔赫·路易斯·博尔赫斯\n\n豪尔赫·路易斯·博尔赫斯措辞的克制优雅，与其奇异的意象和狂野无垠的想象力形成鲜明对比。博尔赫斯是一个自由的灵魂，他以毫无节制的热情追逐着自己多重的痴迷（时间、宇宙、迷宫、空间），然后将它们转录成简洁、经典的散文。博尔赫斯始终坚称自己本质上是个读者，与纳博科夫坚信为阅读而阅读的理念不谋而合。他摒弃意义或信息的重要性（“我无意展示任何东西。我没有意图”¹）。博尔赫斯坚持认为，一本书的目的在于审美愉悦；一个作家应“以其带来的愉悦以及读者获得的情感来评判。”²\
    \ 博尔赫斯从未写过一部长篇小说；他觉得这不值得费力：“创作鸿篇巨著是一项艰苦且令人贫瘠的放纵。花费五百页来发展一个用几分钟就能完美阐述清楚的想法！”³ 相反，他构思了大量虚构的书籍，并将它们作为自己短篇小说的主题。“《特隆、乌克巴尔、世界三》”描述了一本为虚构星球编造的百科全书，其发现引发了一场无法阻挡的模仿浪潮，逐渐抹去了所有现存文化。“《小径分岔的花园》”引用了一部庞杂混乱的小说，其中每个主角同时踏上所有可能的行动路线，形成一个无限的时间路径网络，这些路径偶尔在未来某个点汇聚。\n\
    \n在“《巴别图书馆》”中，博尔赫斯讲述了一个由无数相同六边形房间组成的无尽阵列，每个房间包含20个书架，每个书架上都摆放着32本装订相同的410页书籍。在历史的某个时刻，一位“天才图书馆员”推断出，由于没有两本书是相同的，而所有书籍都是由相同字符的随机组合构成，那么这座图书馆必然包含了有史以来写过的每一本书，以及未来将要写下的每一本书。<sup>4</sup>\
    \ 令人惊异地预示着尚未发明的互联网，图书馆的读者们逐渐意识到，他们最终的知识宝库实际上是一个几乎完全由无用数据构成的无限宇宙。\n\n博尔赫斯同时也是一位备受赞誉的诗人。尽管他的诗歌融入了许多他钟爱的主题，但它们往往比他的故事更个人化，充满了脆弱感与浪漫的焦虑。\n\
    \n```\n1   // They speak (I know) of finials, newels and balustrades\n2   // of\
    \ hidden spandrels and eternally clambering, broad-gaited beasts...\n3   \n4 \
    \  var monstersAscendingAStaircase = function(numberOfSteps) {\n5       var stairs\
    \ = []; stepsUntrodden = [];\n6       var largestGait = Math.sqrt(numberOfSteps);\n\
    7   \n8       // A succession of creatures mount the stairs;\n9       // each\
    \ creature's stride exceeds that of its predecessor.\n10      for (var i = 2;\
    \ i <= largestGait; i++) {\n11          if (!stairs[i]) {\n12              for\
    \ (var j = i * i; j <= numberOfSteps; j += i) {\n13                  stairs[j]\
    \ = 'stomp';\n14              }\n15          }\n16      }\n17  \n18      // Long-limbed\
    \ monsters won't tread on prime-numbered stairs.\n19      for (var i = 2; i <=\
    \ numberOfSteps; i++) {\n20          if (!stairs[i]) {\n21              stepsUntrodden.push(i);\n\
    22          }\n23      }\n24  \n25      // Here, then, is our answer.\n26    \
    \  return stepsUntrodden;\n27  };\n```\n\n博尔赫斯的解决方案结合了他几个最爱的主题：数学理论、空间的几何排列、对无限的暗示，以及故事中的故事。这是典型的博尔赫斯：一位叙述者——可能因兴奋而过度渲染了楼梯意象——讲述一本神秘的书（《怪物登楼》），在短短几行之内，我们就仿佛身临其境。\n\
