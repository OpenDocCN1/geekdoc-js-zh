    # IF HEMINGWAY WROTE JAVASCRIPT

    VLADIMIR NABOKOV


    Vladimir Nabokov is best known for Humbert Humbert''s slippery account of his
    obsession with 12-year-old Lolita, but he should perhaps be better known as a
    lingual aesthete without peer. Nabokov delights in fun and games, repurposing
    every fragment of each cleverly woven plot as a lexical playground for puns and
    anagrams, double entendres and almost-words, alliteration and acrostics. Yet those
    who dismiss Nabokov as merely a peddler of deftly chiseled whimsy overlook his
    ability to move or unnerve readers through vivid imagery. Here he summons a procession
    of sibilant *Ss*, rugged *Rs*, and bouncing *Bs* to render a wistful picture of
    childhood contentment:


    > > *A sense of security, of well-being, of summer warmth pervades my memory.
    That robust reality makes a ghost of the present. The mirror brims with brightness;
    a bumblebee has entered the room and bumps against the ceiling.*


    Then there''s his extraordinary gift for surface and sensory minutiae: a snowflake
    settling on the crystal glass of a wristwatch, the reflection from a bedstead,
    the suggestion of human speech in the echo of running tap water. To Nabokov, the
    "divine detail" is everything: "the capacity to wonder at trifles . . . these
    asides of the spirit, these footnotes in the volume of life are the highest forms
    of consciousness, and it is in this childishly speculative state of mind, so different


    114'
  - '[PAGE 116]


    from commonsense and its logic, that we know the world to be good.”²


    An endless supply of germane metaphors applies texture to every nuance. This passage
    from *Pnin* conveys the harrowing fallout of a dental visit:


    > His tongue, a fat sleek seal, used to flop and slide so happily among the familiar
    rocks, checking the contours of a battered but still secure kingdom, plunging
    from cave to cove, climbing this jag, nuzzling that notch, finding a shred of
    sweet seaweed in the same old cleft; but now not a landmark remained, and all
    there existed was a great dark wound, a terra incognita of gums which dread and
    disgust forbade one to investigate.³


    Nabokov’s highly original perspective on the everyday is extraordinarily funny.
    So is his mockery of the overearnest and the pretentious. Perhaps more than anyone,
    Nabokov believed in the thing for the sake of the thing; he had no time for the
    “literature of ideas” and held didacts in contempt. As Conrad Brenner wrote in
    the *New Republic*, “Humor becomes a swathe blighting all those falsely heavy
    approaches to life and literature, disclosing by the way its own irresistible
    angles. The strength of Nabokov lies in the check (and balance) of the sinister
    obbligato.”⁴


    Nabokov is a writer in complete control. Words are his minions; characters, as
    he famously put it, are his “galley slaves.” And we, the readers, are probably
    just there for his amusement.'
