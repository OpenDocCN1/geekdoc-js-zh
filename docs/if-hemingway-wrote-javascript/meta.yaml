    \ to split\n\n> > I don't think in any language. I think in JavaScript.\n\n# VLADIMIR\
    \ NABOKOV\n\n1899–1977\n\n# IF HEMINGWAY WROTE JAVASCRIPT\n\nVLADIMIR NABOKOV\n\
    \nVladimir Nabokov is best known for Humbert Humbert's slippery account of his\
    \ obsession with 12-year-old Lolita, but he should perhaps be better known as\
    \ a lingual aesthete without peer. Nabokov delights in fun and games, repurposing\
    \ every fragment of each cleverly woven plot as a lexical playground for puns\
    \ and anagrams, double entendres and almost-words, alliteration and acrostics.\
    \ Yet those who dismiss Nabokov as merely a peddler of deftly chiseled whimsy\
    \ overlook his ability to move or unnerve readers through vivid imagery. Here\
    \ he summons a procession of sibilant *Ss*, rugged *Rs*, and bouncing *Bs* to\
    \ render a wistful picture of childhood contentment:\n\n> > *A sense of security,\
    \ of well-being, of summer warmth pervades my memory. That robust reality makes\
    \ a ghost of the present. The mirror brims with brightness; a bumblebee has entered\
    \ the room and bumps against the ceiling.*\n\nThen there's his extraordinary gift\
    \ for surface and sensory minutiae: a snowflake settling on the crystal glass\
    \ of a wristwatch, the reflection from a bedstead, the suggestion of human speech\
    \ in the echo of running tap water. To Nabokov, the \"divine detail\" is everything:\
    \ \"the capacity to wonder at trifles . . . these asides of the spirit, these\
    \ footnotes in the volume of life are the highest forms of consciousness, and\
    \ it is in this childishly speculative state of mind, so different from commonsense\
    \ and its logic, that we know the world to be good.\"²\n\nAn endless supply of\
    \ germane metaphors applies texture to every nuance. This passage from *Pnin*\
    \ conveys the harrowing fallout of a dental visit:\n\n> His tongue, a fat sleek\
    \ seal, used to flop and slide so happily among the familiar rocks, checking the\
    \ contours of a battered but still secure kingdom, plunging from cave to cove,\
    \ climbing this jag, nuzzling that notch, finding a shred of sweet seaweed in\
    \ the same old cleft; but now not a landmark remained, and all there existed was\
    \ a great dark wound, a terra incognita of gums which dread and disgust forbade\
    \ one to investigate.³\n\nNabokov’s highly original perspective on the everyday\
    \ is extraordinarily funny. So is his mockery of the overearnest and the pretentious.\
    \ Perhaps more than anyone, Nabokov believed in the thing for the sake of the\
    \ thing; he had no time for the \"literature of ideas\" and held didacts in contempt.\
    \ As Conrad Brenner wrote in the *New Republic*, \"Humor becomes a swathe blighting\
    \ all those falsely heavy approaches to life and literature, disclosing by the\
    \ way its own irresistible angles. The strength of Nabokov lies in the check (and\
    \ balance) of the sinister obbligato.\"⁴\n\nNabokov is a writer in complete control.\
    \ Words are his minions; characters, as he famously put it, are his \"galley slaves.\"\
    \ And we, the readers, are probably just there for his amusement.\n\n# IF HEMINGWAY\
    \ WROTE JAVASCRIPT\n\n# VLADIMIR NABOKOV\n\n```\n/*\nIn Pergatorya, our oblivious\
    \ integer necessitated emotional validation by\nmeans of a dubious algorithm of\
    \ doubtful provenance. What followed was\na self-penned scryptogram exhibiting\
    \ the unhappy confluence of mechanical\npedantry and digital peasantry. (Code\
    \ is a bore to describe; yet a few basic\ndetails are, reluctantly, given.)\n\
    */\n\nfunction isItHappy(ourNumber) {\n  var terra, antiterra;\n  while (true)\
    \ {\n    var terra = theNextNumber(terra || ourNumber);\n    var antiterra = theNextNumber(theNextNumber(antiterra\
    \ || ourNumber));\n    if (terra == 1 || antiterra == 1) {\n      //Happiness:\
    \ a temerarious tonsil tripping down the mouth\n      //to thrust, at three, against\
    \ the palate.\n      //Hap. Ee. Ness.\n      return true;\n    }\n    if (terra\
    \ == antiterra) {\n      //(history repeats) terra, antiterra, terror!\n     \
    \ return false;\n    }\n  }\n}\n\nfunction theNextNumber(thisNumber) {\n  //being\
    \ concolorus with the outcome...\n  var ourResult = 0;\n  //trying not to imagine\
    \ the disasters inherent herein...\n  thisNumber.toString().split('').map(function(aDigit)\
    \ {\n    return aDigit * aDigit;\n  }).forEach(function(aSquaredDigit) {\n   \
    \ ourResult += aSquaredDigit;\n  });\n  return ourResult;\n}\n```\n\nNabokov's\
    \ version of English is all his own, and so it is with his JavaScript.\n\nSo what\
    \ on earth is going on here? Or should we ask what on earths? Because the keys\
    \ to Nabokov's solution are Terra and Antiterra, the twin worlds of his grandiose\
    \ masterpiece Ada. Terra resembles our earth, while Antiterra merely almost resembles\
    \ it, being shifted in time and divergent of history.\n\nYes, yes, you ask, but\
    \ what actually is going on here? Okay, remember how Holden Caulfield dispenses\
    \ with history? Well, so does Nabokov (being famously wary of conventional wisdom's\
    \ tyranny). And how? By running two happy numbers puzzles simultaneously—one on\
    \ Terra, the other on Antiterra. Since Antiterra spins a little faster than Terra,\
    \ it looks ahead a little farther each time. Now, if Terra and Antiterra should\
    \ ever elicit the same response at the same time, we know in advance that history\
    \ has repeated itself, and must therefore be looping. At this point the game is\
    \ up, and we declare the hapless number unhappy.\n\nOn the other hand, should\
    \ we be fortunate enough to reach numeric ecstasy, Nabokov will reprise the famous\
    \ opening line of Lolita, only this time the exacting glossopharyngeal instruction\
    \ is amended to form the word happiness.\n\nAnd that's that. Though I admit I'm\
    \ still scanning the code for evidence of further riddling . . .\n\n# The REFACTOR\n\
    \n*after \"Do not go gentle into that good night\"*\n*by Dylan Thomas*\n\n> Do\
    \ not go gentle into that rewrite,\nGood code should factor well at close of day;\n\
    Rage, rage against the gnarliness and blight.\n\nThough sage minds craft their\
    \ logic late at night,\nBecause it reads like forked spaghetti, they\nDo not go\
    \ gentle into that rewrite.\n\nBrave Model View exponents, burning bright;\nTheir\
    \ layers become lasagna down the way;\nRage, rage against the gnarliness and blight.\n\
    \nBold men who mostly think in black and white,\nThen learn, at last, to think\
