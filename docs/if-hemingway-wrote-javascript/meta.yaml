    SYLVIA PLATH


    It’s hard to separate Sylvia Plath’s writing from her troubled life. Plath’s suicide
    at age 30 more or less defined the public’s perception of her oeuvre: desperate,
    angry, and uncompromising—the so-called *confessional* voice. Yet by her own admission,
    Plath hid behind many masks, and it was only at the very end of her life that
    she fully allowed the constant feelings of hurt, alienation, and terror to flood
    unchecked onto the page. Most of the work for which she’s now famous was published
    posthumously.


    Plath dared to hope that her marriage to the British poet Ted Hughes (“the only
    man in the world who is my match”) would bury her lifelong demons.¹ Five years
    after their wedding, Plath and Hughes gave a rare interview to the BBC in which
    Plath attempts to convey a rosy picture of housewifely life and nonchalantly recalls
    a childhood battle with depression as though it were now just a footnote.² In
