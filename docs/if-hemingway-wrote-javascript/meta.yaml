  - '[PAGE 68]


    When I opened Johnson''s completed assignment, I found a short note from the good
    doctor, explaining why he had chosen to use CoffeeScript: “Sir, the funcktion
    key-word is an ALBATROSS, and the curly brace is worthless FILIGREE. I desire
    a clean and artickulate script for the dockumenting of my varied MUSINGS.”


    And indeed Johnson''s solution would be lucidly elegant, were it not liberally
    peppered with grouchy witticisms betraying his characteristic self-doubt and internal
    second-guessing. He expresses his incredulity that `factorial(0)` is 1, is amused
    that it should require an entire statement to ascertain that `factorial(1)` is
    indeed 1, and finishes with a sardonic definition of recursion lifted, presumably,
    from his own dictionary.


    Johnson''s solution lies at the intersection of art and parody—a gentle self-mocking
    blended with uncluttered expression and genuine beauty. A doff of the tricorn
    to you, sir.'
