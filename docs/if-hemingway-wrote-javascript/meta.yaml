  mdcn: "\n## 假如海明威来写JavaScript\n### J.D. 塞林格\n\n成年。《麦田里的守望者》经久不衰的一个原因是，塞林格精准地捕捉到了青春期的非理性与复杂性。霍尔顿对成年人的虚伪深感厌恶，但他自己却表现出不少傲慢与做作；他是个令人难以忍受的问题少年，但又天真得讨人喜欢，富有同情心，并且极为聪慧。只有霍尔顿才会逃学时（他已被那所寄宿学校开除），在中央车站的三明治吧里，与两位修女认真讨论《罗密欧与朱丽叶》。\n\
