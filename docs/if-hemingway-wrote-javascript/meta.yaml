    > There was no mercy on the streets, I couldn’t rest

    I’m barely standin’, ’bout to go to pieces, screamin’ peace

    And though my soul was deleted, I couldn’t see it

    I had my mind full of demons tryin’ to break free<sup>5</sup>


    Tupac may lack the lyrical finesse and sophisticated rhyming patterns of more
    high-craft rappers. Most of his words are short and to the point; he’s not trying
    to be clever. But that raw, unrefined honesty is exactly what packs such a punch.
