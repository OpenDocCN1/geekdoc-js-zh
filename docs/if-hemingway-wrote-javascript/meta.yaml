  md: 'JavaScript is an unconventional language, brimming with charming quirks and
    hidden features. Over the years developers have embraced this kookiness, recognizing
    it as a vehicle for creativity and channeling it to make beautiful things. Recently,
    however, some developers, ashamed of its bizarre nature, have tried to reinvent
    JavaScript as a mainstream language—questioning the value of more esoteric features
    and lamenting that anyone should have to understand them.


    Lewis Carroll is clearly on the liberal side of the debate; in fact, he''s gone
    out of his way to make his JavaScript as oddball as possible. `theHatter` (which,
    I think, is intended as a loose pun on `theFactor`) is initialized by means of
    the rarely used `Function` constructor and the much-feared `this` keyword, and
    he jumps through (croquet) hoops to assign an empty array to `theVerdict`. Meanwhile,
    the setting of `theDuchess` (a play on words suggesting `theCount`?) to the Jabberwocky-esque
    *frumious Bandersnatch* is a pure red herring (the value of `theDuchess` is reassigned
    a couple of lines later).


    But the coup de grâce is Carroll''s use of the much-maligned but ridiculously
    powerful `eval` statement. Carroll ingeniously collapses a whole mass of code
    into a few lines by using `join` as an iterator, shoehorning the logic into the
    voids between each array element. Finally, he uses `eval` to execute (Queen of
    Hearts-style) the generated string, which by now is as long as the mouse''s tail
    and as mad as a March hare.'
