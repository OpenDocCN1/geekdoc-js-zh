  md: 'The popular image of Franz Kafka—the persecuted outsider, writing dark tales
    of doomed entrapment—is as shallow as it is misleading. Kafka’s biographer and
    great friend Max Brod recalls a charming, calm, and funny man. Brod wrote of Kafka’s
    “pleasure in art and his joy in creating”¹ and of his reading his work aloud to
    friends, sometimes laughing “so much that there were moments he could not read
    any further.”² Moreover, an open-minded reading of his best-known works—*The Trial*,
    *The Castle*, and *The Metamorphosis*—reveals a rich vein of absurdist humor,
    and heroes who face adversity with both confidence and tenacity. Although he certainly
    had moments of profound despair, the real Kafka probably had little in common
    with the humorless, solitary, peddler-of-doom persona with which he is most often
    associated.


    Some of these misperceptions can be traced to the early canonical translations
    of Kafka’s work, which tended to gussy up the starkness of his original German
    to achieve a more literary cadence; sentences were shortened, repeated words replaced
    with synonyms, and formal expressions swapped for more lively colloquialisms.
    Later translators realized that most of Kafka’s “mistakes” were most likely intentional;
    his unsophisticated narrative imparts a naive, almost disinterested'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'quality that makes anomalies of plot seem more

    absurd than sinister.


    The effect is often more Chaplinesque than

    Kafkaesque. In *The Trial*, Joseph K.’s escalating

    legal problems are affecting his work, so when

    he’s asked to accompany a visiting Italian busi-

    nessman on a sightseeing trip, it’s imperative that

    he make a good impression. But disastrously, the

    Italian’s mustache is too bushy for K. to make out

    what he’s saying (and still, we’re told that K. is so

    intrigued at the possibility the mustache might be

    perfumed that it’s all he can do not to get close

    and take a sniff). In *The Metamorphosis*, Gregor

    Samsa is apparently less alarmed at having woken

    up in the body of a giant beetle than he is at the

    prospect of arriving to work late. The following

    excerpt culminates in one of literature’s most bril-

    liant understatements:


    > The next train left at seven o’clock. To catch that

    one, he would have to go in a mad rush. The

    sample collection wasn’t packed up yet, and he

    really didn’t feel particularly fresh and active.³


    *The Metamorphosis* illustrates how, despite (or

    maybe because of) Kafka’s aversion to pathos,

    his writing can be very moving. Who else could

    make us shed tears for an outsized cockroach?'
