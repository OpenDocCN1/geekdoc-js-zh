    ## FOREWORD


    Angus and I came together over a shared fascination with the outside—the outside
    being any art, literature, or other expression that runs counter to Silicon Valley.


    Around 2012, this coalesced into ##ABC, an IRC book club that never actually read
    anything. Instead, we were something like a support group, gathering to make sense
    of our work, what we were doing, and how we were doing it, within the world and
    through the lens of art and literature.


    Some of these conversations later informed writings on http://byfat.xxx—posts
    like Divya Manian’s excellent “YES P1Z LETS BURNNNN” or my “rien ne tient en place.”
    But none was quite so well received as Angus’s “If Hemingway Wrote JavaScript.”


    Angus managed to perfectly articulate an issue central to many of us: our antipathy
    toward “The Good Parts” and the general rhetoric of “the best way.” And he did
    so by celebrating JavaScript’s voice and variety, through exploration and experimentation.
    He was making the language ours, and it was precisely this ownership that served
    to liberate its potential for expression—its voice making our work not only bearable,
    but actually exciting.


    reflection on creativity and language as craft. It’s been fun to watch this idea
    evolve from IRC to the conference circuit, and now to book form—the medium that
    inspired this whole line of thought.


    I wrote, not long after that, “Like an artist painting a bowl of fruit, if I had
    to express each work the same way—with the only variety being in the fruits themselves—I’d
    surely have gone mad by now.” This insight on writing code, and my career at large,
    I owe very much to my dear friend Angus and his


    Jacob Thornton (@fat)

    August 2014


    ## INTRODUCTION


    Did Ernest Hemingway write JavaScript? Would Jane Austen have grappled with function
    hoisting? Was Franz Kafka driven to despair by prototypal inheritance? Brushing
    aside a few bothersome facts (such as JavaScript not being invented until 1995),
    it’s easy to see why this most literary of computer languages would have piqued
    the interest of these and other authors.


    a grab bag of approaches—procedural, functional, and object-oriented—and blend
    them as appropriate. Most ideas can be expressed in multiple ways, and many JavaScript
    programmers can be identified by their distinct coding style.


    JavaScript has plenty in common with natural language. It is at its most expressive
    when combining simple idioms in original ways; its syntax, which is limited yet
    flexible, promotes innovation without compromising readability. And, like natural
    language, it’s ready to write. Some of JavaScript’s more baroque cousins must
    be edited with an IDE (integrated development environment—a sort of Rube Goldberg
    machine for coding). JavaScript needs nothing more than a text file and an open
    mind.


    Some of the solutions in this book are, to say the least, unusual. The greatest
    novelists, poets, and playwrights are those who are prepared to stake out new
    ground and lay the tracks for those who follow.


    > “All the best writers . . . have been amongst the flagrant flouters.”

    —Steven Pinker on prescriptive language¹


    Natural language has no dominant paradigm, and neither does JavaScript. Developers
    can select from


    Similarly, the future of the JavaScript language depends on the willingness of
    its developers to push the limits, to experiment with new patterns that benefit
    the community at large. When good programmers break a rule, they do it to overcome
    an arbitrary convention that’s hampering their ability to express themselves.
