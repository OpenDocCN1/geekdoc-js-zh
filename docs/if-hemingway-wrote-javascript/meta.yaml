- md: "## DAN BROWN\n1964–\n\nDan Brown's big break came in 2003 with *The Da Vinci\
    \ Code*, a fast-moving, conspiracy-laden murder mystery, in which Brown puts tweed-clad\
    \ hero Robert Langdon on the trail of the Holy Grail, using Leonardo da Vinci's\
    \ cryptic brushwork for clues. The initial reception was rhapsodic. The *New York\
    \ Times* recommended it with “extreme enthusiasm,” describing Brown's writing\
    \ as “gleefully erudite,”$^{1}$ and the public reaction was just as fervent. *The\
    \ Da Vinci Code* moved quickly into the all-time best-seller list. Yet the critical\
    \ acclaim unraveled almost as quickly as Robert Langdon untangled those knotty\
    \ riddles. By the time the film version was released, the backlash was in full\
    \ effect. This time, the *New York Times* savagely ridiculed Brown's “um, prose\
    \ style,”$^{2}$ while the *New Yorker* called it “unmitigated junk.”$^{3}$ Each\
    \ of Brown's subsequent offerings, including the Dante-inspired *Inferno*, has\
    \ been a commercial hit—and a critical flop. Why did Brown's literary reputation\
    \ collapse? Well, for one, doubts were cast on the accuracy of *The Da Vinci Code*'s\
    \ historical assertions, and for another, Brown was subject to several lawsuits\
    \ for plagiarism. But mostly it's about the writing. The cliff-hangers, secret\
    \ societies, and ancient ciphers may have been enough to distract early reviewers,\
    \ but sooner or later the shortcomings of Brown's prose needed to be addressed.\n\
    \nBrown's phrasing is excessively weighty, as exemplified by the opening line\
    \ of *The Da Vinci Code*:\n\n> Renowned curator Jacques Saunière staggered through\
    \ the vaulted archway of the museum's Grand Gallery.⁴\n\nHanging the staggerer's\
    \ occupation in front of his name knocks the meter out of balance. Worse, as Geoffrey\
    \ K. Pullum notes, the information is gratuitous.⁵ In the very next paragraph\
    \ (and a further 10 times in the first two pages), Brown reminds us of Saunière's\
    \ profession, and since the prologue is entitled “Louvre Museum, Paris, 10:46\
    \ pm,” it's a safe bet Saunière is renowned. Good fiction, unlike journalism,\
    \ works the reader's imagination, yet Brown goes to great lengths to spoon-feed\
    \ the most glaringly obvious detail. He'll often use the same adverb or adjective\
    \ multiple times on a page, or even within the same paragraph. In the prologue\
    \ to *The Da Vinci Code* almost every action happens “slowly”; in *Inferno*, we’re\
    \ told no less than four times that Langdon’s doctor has “bushy eyebrows.”\n\n\
    Another questionable habit of Brown’s is his name-dropping of high-end products.\
    \ As noted by Tom Chivers in the *Telegraph*, Brown rarely misses a chance to\
    \ shoehorn, QVC-like, their details into the tightest of action sequences (“Yanking\
    \ his Manurhin MR-93 revolver from his shoulder holster, the captain dashed out\
    \ of the office,” or “Only those with a keen eye would notice his 14-karat gold\
    \ bishop’s ring with purple amethyst, large diamonds, and hand-tooled mitre-crozier\
    \ appliqué”).⁶\n\nBut in the end, it doesn’t matter. Brown’s got a recipe that\
    \ sells more copies than good writing ever could: take a mysterious organization\
    \ or artifact (preferably medieval, definitely controversial), gussy it up and\
    \ dumb it down until it’s palatable for the layperson, throw in a generous dash\
    \ of conspiracy theory and plenty of codes, and serve without editing.\n\n```\n\
    /*\nFACT: Some time in 1557, Michelangelo Moribundi, the renowned, bald-headed\n\
    alchemist, fashioned a secret code out of bits of asparagus and placed it in a\n\
    long-forgotten vault ...\n*/\nfunction theDaFibonacciCode(numeratiFettucini) {\n\
    \  // Wide awake, the bleary-eyed Langdon watched as two tall, lissome number\n\
    \  // ones, with big feet and a type of hat, sidled up to the rounded zero ...\n\
    \  var ilNumerati = [0,1,1];\n  // while theIntegerThatIncrementsOneByOne morphed\
    \ eerily into a ... three.\n  theIntegerThatIncrementsOneByOne = 3;\n  // Now\
    \ the silent ratio that could not be uttered had come to make it right.\n  TheBotticelliVector\
    \ = 1.61803;\n\n  while (theIntegerThatIncrementsOneByOne < numeratiFettucini)\
    \ {\n    // Somehow another number one appeared and theIntegerThatIncrementsOneByOne\n\
    \    // snatched at it gracefully.\n    theIntegerThatIncrementsOneByOne = theIntegerThatIncrementsOneByOne\
    \ + 1;\n\n    // The renowned, rounded 16-bit unsigned integer tentatively succumbed\
    \ to\n    // the strange force of the vector before pushing itself bodily into\
    \ the\n    // hands of the weakly typed array.\n    ilNumerati.push(\n      Math.round(ilNumerati[theIntegerThatIncrementsOneByOne\
    \ - 2] *\n        TheBotticelliVector)\n    );\n  }\n}\n```\n\n```\n27   // \"\
    Too many elementi?\" reminded the five-foot-eleven, bushy-eyebrowed Italian.\n\
    28   // Too many elements?\n29   if (ilInumerati.length > numeratiFettucini) {\n\
    30     // Intelligently, Langdon, sporting a Harris Tweed jacket (J.Crew, $79.99),\n\
    31     // sliced it with his Modell 1961 Ausführung 1994 Swiss Army knife.\n32\
    \     ilInumerati = ilInumerati.slice(0, numeratiFettucini);\n33   }\n34\n35 \
    \  // The kaleidoscope of truth had been shaken. Now, in front of them, sat the\n\
    36   // numerically sequenced sequenza numerica. Like a gleaming cathedral.\n\
    37   return ilInumerati;\n38\n39 }\n```\n\nDan Brown is right at home with the\
    \ Fibonacci sequence; indeed, it was cunningly used as a highly secure combination\
    \ for a safe in *The Da Vinci Code*.\n\nBut wait, what's this? It seems Brown\
    \ has discovered a dark and mysterious multiplier (*The Botticelli Vector*, no\
    \ less), which he uses to derive the next number from the one before. This arithmetic\
    \ alchemy is all well and good, but we're left wondering whether he knew he could\
    \ just add the previous two numbers to make the next one. Anyway, it seems to\
    \ work, so that's probably all that matters.\n\nJudging by the comments, Brown\
    \ is approaching this problem as though it were one of his blockbusting potboilers.\
    \ First there's the obligatory FACT, which assures us that what follows is rooted\
    \ in historical accuracy. Then there's the army of adjectives (because ambiguity\
    \ is the devil's tool) and the diligent inclusion of product details even as the\
    \ action reaches a nail-biting climax.\n\nSkipping gingerly over non sequiturs\
    \ and logical fallacies, we reach the movingly grandiloquent conclusion. Oh, the\
    \ glory.\n\n## The VARIABLE\nafter “The Raven”\nby Edgar Allan Poe\n\nOnce upon\
    \ a midnight dreary, while I struggled with JQuery,\nSighing softly, weak and\
    \ weary, troubled by my daunting chore,\nWhile I grappled with weak mapping, suddenly\
    \ a function wrapping\nformed a closure, gently trapping objects that had gone\
    \ before.\n\nAh, distinctly I remember, it was while debugging Ember,\nAs each\
    \ separate dying member left its host for evermore.\nEagerly I wished the morrow—vainly\
    \ I had sought to borrow\n(From my bookmarked trail of sorrow), APIs from Underscore.\n\
    \nThere I sat engaged in guessing the meaning of each cursed expression,\nEndless\
    \ callbacks in procession; nameless functions, nothing more,\nThis and more I\
    \ sat divining, strength and spirit fast declining,\nDisclose the value we’re\
    \ assigning! Tell me—tell me, I implore!\n\n## FACTORIAL\n\n**THE ASSIGNMENT:**\n\
    WRITE A FUNCTION THAT RETURNS THE FACTORIAL OF THE SUPPLIED ARGUMENT.\n\nFor any\
    \ positive integer $n$, the factorial of $n$ is the result of multiplying $n$\
    \ by all the positive integers of lesser value. So the factorial of 5, which is\
    \ usually written as 5!, is 5 × 4 × 3 × 2 × 1, or 120.\n\n![](img/e3611bbec0f345b635c8b5856486bcbb_49_0.png)\n\
    \n## D R I A L\n+   6. Jack Kerouac\n7. Jane Austen\n8. Samuel Johnson\n9. Sir\
    \ Arthur Conan Doyle\n10. James Joyce\n\nSomeone clever once decided that 0! is\
    \ 1, though no one can quite remember why. One explanation is that it keeps this\
    \ pattern happy:\n\n3! = 4!/4\n2! = 3!/3\n1! = 2!/2\n0! = 1!/1\n\nBased on that\
    \ premise, -1! would be infinity, which is why mention of negative factorials\
    \ tends to be accompanied by awkward coughing.\n\n![](img/e3611bbec0f345b635c8b5856486bcbb_51_0.png)\n\
    \nJavaScript is confessional and pure and all excited with the life of it."
  mdcn: "\n## 丹·布朗\n1964–\n\n丹·布朗的事业在2003年迎来重大转机，随着《达·芬奇密码》的出版，这部快节奏、充满阴谋的谋杀悬疑小说让身着粗花呢的英雄罗伯特·兰登踏上了追寻圣杯的旅程，并以列奥纳多·达·芬奇神秘的画作为线索。最初的评价是热烈的。《纽约时报》以“极大的热情”推荐它，形容布朗的写作为“博学而令人愉悦”，$^{1}$\
    \ 公众的反应同样热烈。《达·芬奇密码》迅速登上了史上畅销书排行榜。然而，批评界的赞誉几乎像罗伯特·兰登解开那些棘手谜题一样快地瓦解了。等到电影版上映时，反弹浪潮已全面爆发。这一次，《纽约时报》尖刻地嘲讽了布朗的“嗯，散文风格”，$^{2}$\
    \ 而《纽约客》则称之为“彻头彻尾的垃圾”。$^{3}$ 布朗后续的每部作品，包括受但丁启发的《地狱》，都取得了商业成功——却遭遇了评论界的失败。为什么布朗的文学声誉会崩溃？嗯，一方面，《达·芬奇密码》历史叙述的准确性受到质疑；另一方面，布朗因抄袭面临多起诉讼。但主要问题在于写作本身。悬念迭起的情节、秘密社团和古老密码或许足以转移早期评论家的注意力，但布朗散文中的缺陷迟早需要被正视。\n\
    \n布朗的措辞过于沉重，以《达·芬奇密码》的开篇句为例：\n\n> 著名的馆长雅克·索尼埃踉跄地穿过博物馆大画廊的拱形门廊。⁴\n\n将踉跄者的职业置于其姓名之前，破坏了语句的节奏平衡。更糟糕的是，正如杰弗里·K·普勒姆指出的，这些信息是多余的。⁵\
    \ 在紧接着的下一段（并且在开头两页中又出现了10次），布朗提醒我们索尼埃的职业，而既然序章的标题是“巴黎卢浮宫，晚上10:46”，完全可以肯定索尼埃是位名人。优秀的虚构作品，不同于新闻报道，会激发读者的想象力，然而布朗却费尽心机地灌输最显而易见的细节。他经常在同一页甚至同一段落中重复使用同一个副词或形容词；在《达·芬奇密码》的序章中，几乎每个动作都发生得“缓慢”；在《地狱》中，我们被告知不少于四次兰登的医生长着“浓密的眉毛”。\n\
    \n布朗另一个可疑的习惯是他对高端产品的生搬硬套。正如汤姆·奇弗斯在《电讯报》中指出的，布朗很少错过像QVC电视购物那样，在最紧张的动作序列中硬塞进产品细节的机会（“上尉从肩部枪套中猛地拔出他的马努林MR-93左轮手枪，冲出办公室”，或“只有眼力敏锐的人才会注意到他14K金的主教戒指，上面镶嵌着紫色紫水晶、大钻石和手工雕刻的主教冠与权杖图案”）。⁶\n\
    \n但最终，这并不重要。布朗有一套比任何好文笔都更能大卖的秘诀：找一个神秘的组织或物品（最好是中世纪的，肯定有争议的），把它包装美化并简化到外行也能理解，加入大量阴谋论和编码，然后未经编辑就直接出炉。\n\
    \n```\n/*\n事实：1557年某个时候，著名的秃头炼金术士米开朗基罗·莫里邦迪用芦笋\n碎片制作了一个秘密密码，并将其放入一个被遗忘已久的保险库……\n\
