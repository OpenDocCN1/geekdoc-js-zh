  - '[PAGE 111]


    This is vintage Chaucer; in fact, it reads like an abbreviated version of *The
    Canterbury Tales*. As with that sprawling masterpiece, this solu- tion is told
    by several protagonists in addition to the general narrator. (The Summoner and
    The Sqwarer—also pronounced “squire”—might have been lifted directly from his
    earlier work, but we''ll let that go.)


    The overall effect is oddly functional: Notice how the general narrator speaks
    in declarative terms (summonTheSqwares), and indeed there are no side effects
    that I can see. It''s probably no coincidence that *The Canterbury Tales* is equally
    unimperative; Chaucer pays little attention to the passage of time and place—his
    primary interest is in the characters and their stories.'
