    # IF HEMINGWAY WROTE JAVASCRIPT

    GEOFFREY CHAUCER


    As one of the first poets to write in the Middle English vernacular, Geoffrey
    Chaucer made lexical and stylistic choices that had a major influence on the language
    and literature that followed. Although he almost always wrote in verse, many of
    Chaucer’s works run for hundreds of pages and are considered precursors to the
    modern prose novel. Chaucer’s relaxed style combined irreverent humor with compassion
    and an understanding of the human condition that was rare for an author of his
    time.


    Chaucer’s most famous work, *The Canterbury Tales*, chronicles a diverse assortment
    of pilgrims as they ride from London to a shrine in Canterbury. The pilgrims (each
    identified by profession—the Knight, the Miller, the Summoner, the Pardoner, and
    so on) take turns delivering the narrative, and although they’re drawn from every
    social stratum and both sexes, Chaucer slips effortlessly into each persona. The
    rich collage of perspectives that emerges provides an invaluable social record
    of the period. Chaucer'
  - '[PAGE 108]


    leans heavily on the stereotypes of the day, but his portraits are affectionate—never
    pompous—and the effect is funny, informal, and charming. Because there is no contemporary
    recording of Chaucer’s verse, nor a continuous tradition of performance, we can’t
    be certain of the intended meter. Even the number of syllables is up for debate;
    by Chaucer’s time, pronunciation of trailing vowels was losing favor in conversational
    English but persisted in the written form. However, it’s generally agreed that
    Chaucer’s long-line verses are to be read as rhyming couplets of iambic pentameter,
    often called *riding rhyme* in an allusion to the rhythm of the pilgrims’ horses
    in *The Canterbury Tales* (and so perhaps meant to be delivered at a faster clip
    than, say, Shakespeare’s walkable pentameter). Chaucer’s version of Middle English,
    though unusual to modern English speakers, can be fairly easily inferred (especially
    with the help of a basic glossary).¹ Here’s an excerpt from the “General Prologue”
    to *The Canterbury Tales*, in'
  - '[PAGE 109]


    which Chaucer apologizes for the bawdy nature of the upcoming text by explaining
    that he is duty-bound to faithfully reproduce his subjects’ accounts:


    > Whoso shal telle a tale after a man,

    He moot reherce as ny as evere he kan

    Everich a word, if it be in his charge,

    Al speke he never so rudeliche or large,

    Or ellis he moot telle his tale untreve,

    Or feyne thyng, or fynde wordes newe.²


    And here’s the same verse in modern English:


    > Who tells the tale of any other man

    Should render it as nearly as he can,

    If it be in his power, word for word,

    Though from him such rude speech was never heard.

    If he does not, his tale will be untrue,

    The words will be invented, they’ll be new.³'
