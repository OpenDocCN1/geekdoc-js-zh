    Rage, rage against the gnarliness and blight.\n\nAnd you, dear reader, faithful\
    \ acolyte,\nAudaciously address this sad decay.\nDo not go gentle into that good\
    \ rewrite.\nRage, rage against the gnarliness and blight.\n\n# PRIME N\n\n# THE\
    \ ASSIGNMENT:\n\nWRITE A FUNCTION THAT RETURNS ALL THE PRIME NUMBERS UP TO THE\
