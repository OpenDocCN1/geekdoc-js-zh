  md: 'Arundhati Roy''s 1997 debut novel, *The God of Small Things*, took the literary
    world by storm. A critical and popular triumph, it won the prestigious Booker
    Prize and became the best-selling novel by a resident Indian. We''re still awaiting
    a second novel, but in the meantime, Roy has produced a steady stream of nonfiction.
    Most of it is politically themed, reflecting her anticorporate, pro-people, pro-environment
    philosophy.


    *The God of Small Things* is a masterpiece. Set in the southwest Indian state
    of Kerala between 1969 and 1993, it''s at once a profound indictment of the ingrained
    injustice of Roy''s homeland, and a stunningly evocative prose poem. From the
    opening lines, Roy''s writing dazzles:


    > May in Ayemenem is a hot, brooding month. The days are long and humid. The river
    shrinks and black crows gorge on bright mangoes in still, dustgreen trees. Red
    bananas ripen. Jackfruits burst. Dissolute bluebottles hum vacuously in the fruity
    air. Then they stun themselves against clear windowpanes and die, fatly baffled
    in the sun.¹


    And so it continues—a haunting, sad, and eloquent treatise on the natural beauty
    of her home state, and the vulnerability and malevolence of humanity. Even as
    we recoil at the brutality'
