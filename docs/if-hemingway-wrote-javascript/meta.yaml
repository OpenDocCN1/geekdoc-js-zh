    > 说真的，我他妈差点哭出来，我感到那么他妈的高兴。我不知道为什么。只是她看起来那么好，穿着蓝色大衣，不停地转啊转啊。¹\n\n```javascript\n\
    // 大多数数字都是他妈的骗子，我向上帝发誓。\nfunction howAreYaAnyway(number) {\n  // 我想做的是，我想来个循环。我是认真的。\n\
    \  do {\n    if (number < 5) break\n    thisNextNumber = 0\n    // 把它变成字符串。我是认真的。\n\
    \    number = String(number)\n    for (i in number)\n      thisNextNumber += number[i]*number[i]\n\
    \    // 把下一个数字直接放回原来的变量里。我承认这很老土。\n    number = thisNextNumber\n  } while (true)\n\
    \  // 只有大约五个数字是真正快乐的，这让我很要命。\n  return \"I'm \" + ['H','Unh'][number==1?0:1] +\
    \ \"appy, I really am\"\n}\n```\n\n塞林格的解决方案带有霍尔顿·考尔菲尔德第一人称叙事的所有特征——霍尔顿矛盾的心理展现得淋漓尽致。他告诉我们他对数字没兴趣，却又忍不住尽责地完成这个练习。他对语法和形式肆意妄为——省略了所有分号和大部分花括号；滥用\
    \ break 和三元运算符，显然只是为了好玩——然而他的逻辑背后是一种敏锐的智识，更不用说原创性。还有谁意识到所有不快乐的数字最终都会归结为 4？在他看来，传统做法——费力地记录已测试过的数字以避免无限循环——既不必要，也很虚伪。\n\
    \n霍尔顿知道自己聪明，但也缺乏安全感——几乎每条评论都以对他自己逻辑的自嘲收尾，以防万一自己错了。他最后的评论暴露出他对他人（甚至是他声称讨厌的人）极其敏感。他一开始猛烈抨击所有数字都是骗子，但对只有极少数数字真正感到快乐感到苦恼。我可不是开玩笑。\n\
    \n*跟随你的心，但带上JavaScript。*\n\n## 假如海明威来写JavaScript\n### 图帕克·夏库尔\n\n1971–1996\n\n\
    图帕克·阿玛鲁·夏库尔的双重身份很难调和。一个是理智、敏感且富有同情心的：十几岁就是演员和诗人，莎士比亚的崇拜者，在歌词中探讨女性困境、虐待儿童和贫困问题。另一个则是暴力的、携带枪支的*匪帮说唱*运动化身：进出监狱，肚子上纹着“Thug\
