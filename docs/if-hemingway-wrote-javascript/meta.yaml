    \n## LEWIS CARROLL\n---\n\n1832–1898\n\nLewis Carroll was an esteemed mathematician,\
    \ a pioneering photographer, a philosopher, and an Anglican deacon, but he is\
    \ best known for his fanciful nonsense stories.\n\n*Alice's Adventures in Wonderland*\
    \ is a remarkable piece of escapist literature that influenced works as diverse\
