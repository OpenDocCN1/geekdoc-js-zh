    *Infinite Jest* begins with a white-knuckle account of an admissions interview
    gone wrong. It’s tight, beautifully crafted, and visceral (“The familiar feeling
    of being misperceived is rising, and my chest bumps and thuds”^3). From there,
    things break down as Wallace presents us with a series of fragmented vignettes
    and loosely related portraits, until gradually, miraculously, a thread of plot
    emerges. *Infinite Jest* is many things: parody, fantasy, political thriller—at
    a high level, it’s even a mathematical exercise—but these are not the qualities
    that define its greatness. Rather, it’s the compassion with which Wallace articulates
    the plight of the desolate and the desperate, and his jaw-dropping eloquence,
