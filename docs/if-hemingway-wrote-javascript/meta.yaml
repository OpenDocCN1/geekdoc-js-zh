  mdcn: "\n## 术语表\n\n**Befil** 发生，降临\n**Eich-ian** 指代 JavaScript 的创造者 Brendan Eich\n\
    **Condicioun** 条件\n**Parfit** 完美\n**Nombre** 数字\n**Summon the Sqwares** 求平方和\n\
    **Oother** 其他\n**Summoner** 求和者，也是《坎特伯雷故事集》中的一个角色\n**Sqwarer** 平方者，也暗指《坎特伯雷故事集》中的侍从（Squire）\n\
    **Oone** 一\n**Tweye** 二\n**Acht** 八\n**Nyne** 九\n**Oonefolde** 展开，分裂\n\n> > 我不是用任何一种语言来思考的。我用\
    \ JavaScript 思考。\n\n# 弗拉基米尔·纳博科夫\n\n1899–1977\n\n# 如果海明威写了 JavaScript\n\n弗拉基米尔·纳博科夫\n\
    \n弗拉基米尔·纳博科夫最著名的或许是亨伯特·亨伯特关于他痴迷于12岁洛丽塔的那份滑脱的叙述，但他或许更应作为无与伦比的语言美学家而被铭记。纳博科夫沉醉于文字游戏，将他巧妙编织的每个情节碎片重新用作双关与文字游戏、双关语与似是而非的词汇、头韵与藏头诗的词汇游乐场。然而，那些将纳博科夫仅仅视为一个贩卖精雕细琢奇想的商贩的人，忽视了他通过生动意象打动或惊扰读者的能力。在此，他召唤出一连串嘶嘶作响的\
    \ *S*、粗犷的 *R* 和跳跃的 *B*，描绘出一幅对童年知足之情的怅然追忆：\n\n> > *一种安全感、幸福感、夏日的温暖弥漫在我的记忆中。那份坚实的现实使当下变得虚幻。镜子里盈满光亮；一只大黄蜂飞进房间，撞在天花板上。*\n\
    \n接着是他那非凡的、对表面与感官细节的捕捉天赋：一片雪花落在水晶表镜上，床架上的反光，自来水流淌的回声中暗示的人语。对纳博科夫而言，“神圣的细节”就是一切：“对琐碎事物感到惊奇的能力……这些精神的旁白，这些生命巨卷中的脚注，是意识的最高形式，正是在这种孩童般的、充满思辨的心境中——与常识及其逻辑如此不同——我们才认识到世界的美好。”²\n\
    \n无穷无尽的相关比喻为每一个细微之处增添了质感。这段选自《普宁》的文字传达了牙科就诊后的痛苦余波：\n\n> 他的舌头，一只光滑肥硕的海豹，过去常常在熟悉的礁石间愉快地翻滚滑动，检查着一个饱经摧残却依然稳固的王国的轮廓，从这个洞穴潜入那个海湾，攀上这处嶙峋，轻蹭那处凹陷，在同一个旧裂缝中找到一缕甜美的海藻；但如今地标荡然无存，存在的只有一个巨大的黑暗伤口，一片令人恐惧与厌恶、无人敢去探索的牙龈未知之域。³\n\
    \n纳博科夫对日常事物高度原创的视角极其有趣。他对过分认真和装腔作势者的嘲弄亦然。或许比任何人都更甚，纳博科夫信奉事物本身而为事物本身；他不待见“观念文学”，并且鄙视说教。正如康拉德·布伦纳在《新共和》上所写：“幽默成为一片席卷所有那些对生活和文学过分沉重、虚假接近方式的沃土，并在此过程中揭示了自身不可抗拒的角度。纳博科夫的力量在于对险恶伴奏的抑制（与平衡）。”⁴\n\
    \n纳博科夫是一位完全掌控一切的作家。文字是他的仆从；如他著名地所言，人物是他的“划桨奴隶”。而我们，读者，很可能只是为了博他一笑而存在。\n\n# 如果海明威写了\
    \ JavaScript\n\n# 弗拉基米尔·纳博科夫\n\n```\n/*\n在佩尔加托里亚，我们那懵懂的整数需要通过某种可疑出处的可疑算法来获得情感验证。随之而来的是一段自编的密码文本，展现了机械学究气与数字市侩气的不幸结合。（代码描述起来很无聊；但勉强给出一些基本细节。）\n\
    */\n\nfunction isItHappy(ourNumber) {\n  var terra, antiterra;\n  while (true)\
    \ {\n    var terra = theNextNumber(terra || ourNumber);\n    var antiterra = theNextNumber(theNextNumber(antiterra\
    \ || ourNumber));\n    if (terra == 1 || antiterra == 1) {\n      //幸福：一个莽撞的扁桃体滑落口腔，\n\
    \      //在第三下，抵住上颚。\n      //幸。福。感。\n      return true;\n    }\n    if (terra\
    \ == antiterra) {\n      //(历史重演) 地球，反地球，恐怖！\n      return false;\n    }\n  }\n\
    }\n\nfunction theNextNumber(thisNumber) {\n  //与结果同色……\n  var ourResult = 0;\n\
    \  //尽量不去想象其中固有的灾难……\n  thisNumber.toString().split('').map(function(aDigit) {\n\
    \    return aDigit * aDigit;\n  }).forEach(function(aSquaredDigit) {\n    ourResult\
    \ += aSquaredDigit;\n  });\n  return ourResult;\n}\n```\n\n纳博科夫版本的英语自成一派，他的 JavaScript\
    \ 也是如此。\n\n那么这里到底发生了什么？或者我们应该问，这里究竟发生了什么？因为纳博科夫解决方案的钥匙是“地球”和“反地球”，这是他宏伟巨著《阿达》中的双生世界。地球类似于我们的地球，而反地球只是近似相似，在时间上错位，历史也分道扬镳。\n\
    \n是的，是的，你问，但这里实际发生了什么？好吧，还记得霍尔顿·考尔菲德如何打发历史吗？纳博科夫也是如此（他以对传统智慧的暴政保持警惕而闻名）。如何做到的？通过同时运行两个“快乐数”谜题——一个在地球上，另一个在反地球上。由于反地球比地球转得稍快一点，它每次能预见得更远一些。现在，如果地球和反地球在同一时间给出相同的结果，我们便能提前知道历史已经重演，因此必然处于循环之中。至此，游戏结束，我们宣布这个不幸的数字是不快乐的。\n\
    \n另一方面，如果我们足够幸运达到了数字的狂喜，纳博科夫将重现《洛丽塔》著名的开篇句，只是这次，那精确的舌咽指令被修改成了“幸福感”一词。\n\n就是这样。尽管我承认我仍在扫描代码，寻找更多谜题的证据……\n\
    \n# 重构\n\n*仿效迪伦·托马斯的《不要温和地走入那个良夜》*\n\n> 不要温和地走入那次重写，\n好代码应在一日终结时良好地分解；\n愤怒，愤怒对抗那缠结与腐坏。\n\
    \n虽然睿智的头脑在深夜雕琢逻辑，\n因为它读起来像叉状的意大利面，\n他们不要温和地走入那次重写。\n\n勇敢的模型视图倡导者，燃烧着光亮；\n他们的层次在路途中变成千层面；\n\
