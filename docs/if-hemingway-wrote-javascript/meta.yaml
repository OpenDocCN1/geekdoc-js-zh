    into a life of silence, brought about by the trauma of abuse and forced separation
    from his mother:


    > Once the quietness arrived, it stayed and spread in Estha. It reached out of
    his head and enfolded him in its swampy arms. It rocked him to the rhythm of an
    ancient, fetal heartbeat. It sent its stealthy, suckered tentacles inching along
