  - '[PAGE 38]


    True to form, Bolaño’s exam paper is peppered with admissions of insecurity, embarrassment,
    and ignorance. The solution, though rather brilliant, is presented as something
    of an afterthought. Always obsessive, always tangential, he’s much happier offering
    us a mildly interesting but ultimately useless list of mathematical genii.

    The array is named rationalTheorists in homage to the visceral realists, a gang
    of guerilla poets featured in *The Savage Detectives*. That group is in turn based
    on Bolaño’s earlier real-life literary gang of two, the infrarealists. The such
    margins, boys! comment after the Pierre de Fermat entry is ostensibly a reference
    to Fermat’s famous marginal note, in which he proclaimed he had a proof for his
    “last theorem” but not enough space to document it. However, it may also be an
    oblique reference to Ulises Lima, the co-hero of *The Savage Detectives*, who
    was notorious for scribbling poems in the margins of printed books.

    There are other Bolaño traits here: the juxtaposition of long and short paragraphs,
    the absence of semicolons (mirroring the absence of quotation marks in his novels),
    and the use of implicit globals (suggesting that each variable is destined to
    make further appearances in subsequent chapters or even future spin-off novels).'
