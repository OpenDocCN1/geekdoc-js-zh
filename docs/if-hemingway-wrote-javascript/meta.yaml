    And to an observer therefore, perhaps barely there. Slowly, over the years, Estha
    withdrew from the world. He grew accustomed to the uneasy octopus that lived inside
    him and squirted its inky tranquilizer on his past. Gradually the reason for his
    silence was hidden away, entombed somewhere deep in the soothing folds of the
    fact of it.²'
  - '[PAGE 181]


    The book''s language is unorthodox. Roy confers new meanings on nouns and phrases
    (especially childhood creations) by capitalizing them. Many paragraphs are exceptionally
    short, sometimes only one word. The narration is technically third-person omniscient,
    but it makes frequent use of free indirect speech to assume the childhood perspective
    of twins Estha and, especially, Rahel (whose biography resembles the author''s),
    so sentences routinely blend the mature adult voice with the singsong lilt and
    creative vocabulary of curious preteens:


    > The woman in the neighboring car had biscuit crumbs on her mouth. Her husband
    lit a bent after-biscuit cigarette. He exhaled two tusks of smoke through his
    nostrils and for a fleeting moment looked like a wild boar. Mrs. Boar asked Rahel
    her name in a Baby Voice.³


    For almost a decade, rumors of a second novel have abounded. In a recent *New
    York Times Magazine* piece, Roy confirmed she was indeed working on another novel
    (but said she''s “keeping the subject secret for now”).⁴ We can only hope.'
