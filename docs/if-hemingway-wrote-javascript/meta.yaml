    # WILLIAM SHAKESPEARE


    1564–1616'
  - '[PAGE 23]


    In stark contrast to Hemingway''s hands-off approach, William Shakespeare probes
    the human psyche to the fullest. In wondrously expressive verse, he maps the dark
    crevices of his protagonists and lays bare their souls. Shakespeare''s commentary
    is universal because he recognizes in his subjects those archetypal traits that
    transcend geography and time.


    Shakespeare''s plays and sonnets make heavy use of *iambic pentameter*, which
    was the popular lyrical form of his time. A *foot* is a metrical unit consisting
    of a stressed syllable and one or more unstressed syllables, and an *iamb* is
    a two-syllable foot with the second syllable stressed (for example, "reVIEW" or
    "the CAT"). An iambic pentameter is 5 iambs in a row—10 syllables with stresses
    on the even-numbered syllables.'
  - '[PAGE 24]


    Here’s a simple couplet in iambic pentameter taken from Shakespeare’s “Sonnet
    18.” Stressed syllables are capitalized:


    > So LONG as MEN can BREATHE or EYES can SEE,

    So LONG lives THIS, and THIS gives LIFE to THEE.


    Shakespeare often adds dramatic emphasis by deviating from strict iambic pentameter—he
    might add an extra syllable or use an alternate stress. In the famous opening
    line of *Richard III*, the stress of the first foot is reversed (a *trochee*),
    highlighting the urgency of “now.”


    > NOW is the WINTER OF our DIScontent'
