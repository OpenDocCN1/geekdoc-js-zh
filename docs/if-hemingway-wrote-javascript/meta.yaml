    Truman Capote famously said of *On the Road*, “That’s not writing, it’s typing.”
    Jack Kerouac jokingly claimed, “It was dictated by the Holy Spirit! It doesn’t
    need editing!”¹ The popular image of Kerouac as an impulsive, spontaneous speed-writer
    unconcerned with plot, shape, form, or even punctuation was partly fueled by Kerouac
    himself, as in his 1968 *Paris Review* interview: “By not revising what you’ve
    already written you simply give the reader the actual workings of your mind during
    the writing itself: you confess your thoughts about events in your own unchangeable
    way.”²


    The reality was a little less radical. *On the Road* was meticulously prepared
    and heavily revised (the New York Public Library houses several drafts). Moreover,
    although Kerouac claimed to dislike the period and mistrust the comma, he used
    both liberally. Kerouac reflected that the Beat Generation he supposedly founded
    was “really just an idea in our minds,”³ and perhaps his version of spontaneous
    prose was more often vision than reality.


    That said, Kerouac’s writing constantly evolved in pursuit of the ideal literary
    voice, and reached its experimental zenith in *The Subterraneans*, which was written
    in just three days and featured, as the *New York Times* put it, “an almost schizophrenic
    disintegration of syntax—the effort to reproduce, by a sort of reflex action,
    the uninterrupted continuum of experience.”⁴ *The Subterraneans* is the Kerouac
    myth made real—disparate spurts of melody wrapped in vast poetic sentences like
    extended improvised jazz passages:


