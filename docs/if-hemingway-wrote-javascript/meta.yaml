    \ a writer should be judged “by the enjoyment he gives and by the emotions one\
    \ gets.”² Borges never wrote a full-length novel; he felt they were unworthy of\
    \ the effort: “The composition of vast books is a laborious and impoverishing\
    \ extravagance. To go on for five hundred pages developing an idea whose perfect\
    \ oral exposition is possible in a few minutes!”³ Instead, he concocted vast imaginary\
