    \ and clear, and it does only what is necessary—and then it gets out of the way\
    \ to allow the full glory of the Fibonacci sequence to shine through.\n\nHemingway\
    \ didn’t suffer fools gladly, so if you ask for a series with fewer than two numbers,\
