  md: 'Adams’s prime-number solution features contributions from some of his most
    beloved brain-children. For instance, the opening comment drips with the doleful
    sarcasm of Marvin, the amusingly depressed robot (who, ironically, embodies the
    darker side of the human condition more than any of *Hitchhiker*’s organic characters).
    Later on, Marvin moans about his aching semicolons.


    Meanwhile, the code itself represents the bizarre transmissions of a babel fish,
    the curious ear-dwelling creature that conveniently excretes nerve signals in
    the language of its host. Sadly, it seems this particular fish had a sore head,
    and so had a limited range of characters at its disposal. Adams apologizes for
    the fish’s decidedly un-JavaScripty transcript, but no matter: It turns out everything
    works just fine. Notice, by the way, the use of the ever-controversial `with`
    statement, which sends narrow-minded earthlings running for cover but is considered
    “mostly harmless” by those with a more rational, pan-galactic perspective.


    In another unusual twist, the generated prime numbers, instead of being returned
    en masse at the end of the program, are called out one by one by means of an `alert`.
    This clears the way for the grand finale, in which the bashful supercomputer Deep
