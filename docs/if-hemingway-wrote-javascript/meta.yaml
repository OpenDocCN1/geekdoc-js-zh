  md: 'Jane Austen’s solution demonstrates two pleasing characteristics for which
    she is justly famous. First, there’s her attention to plot and structural integrity,
    reflected here in the neat packaging of her code: She invokes the module pattern,
    hiding away the historical data (or ledger) within the folds of the superstructure.
    Second is her sometimes playful, sometimes subversive send-up of the powers that
    be and their ridiculous conventions.


    At first glance, Austen’s code appears to be submissive, yielding to every overbearing
    commandment and pious proclamation set forth by the more pedantic leaders in our
    community. Yet a closer reading reveals that this is nothing less than a full-on
    parody of the social norms of JavaScript. There are several clues to Austen’s
    real intent: Checking if the argument is a number mocks edge-case mania; overembellished
    (and often free indirect) comments poke fun at those who insist that `==` is the
    devil’s work; and the satirical fawning over the nice Mr. Crockford is an ironic
    justification for the all-too-common misuse of the `hasOwnProperty` method.


    Austen is on top of her game here, simultaneously gaining approval from the purveyors
    of code dogma while winking furiously at those who can see beyond the artifice
    and discern the subtext.'
