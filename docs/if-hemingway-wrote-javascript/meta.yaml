    \ Leibniz\", \"Andrey Kolmogorov\", \"Euclid of Alexandria\", \"Jules Henri Poincaré\"\
    , \"Srinivasa Ramanujan\", \"Alexander Grothendieck (who could forget?)\", \"\
    David Hilbert\", \"Alan Turing\", \"  John von Neumann\", \"Kurt Gödel\", \"Joseph-Louis\
    \ Lagrange\", \"Georg Cantor\", \"William Rowan Hamilton\", \"Carl Jacobi\", \"\
    Évariste Galois\", \"Nikolai Lobachevsky\", \"Joseph Fourier\", \"Pierre-Simon\
    \ Laplace\", \"Alonzo Church\", \"Nikolai Bogolyubov\"]\n17\n18     /**/\n19\n\
    20     //I didn't understand any of this, but here it is anyway.\n21     return\
    \ r\n22\n23     /**/\n24\n25     //Nothing happens here and if it does I'd rather\
    \ not talk about it.\n26   }\n```\n\nTrue to form, Bolaño’s exam paper is peppered\
    \ with admissions of insecurity, embarrassment, and ignorance. The solution, though\
    \ rather brilliant, is presented as something of an afterthought. Always obsessive,\
    \ always tangential, he’s much happier offering us a mildly interesting but ultimately\
    \ useless list of mathematical genii.\nThe array is named rationalTheorists in\
    \ homage to the visceral realists, a gang of guerilla poets featured in *The Savage\
    \ Detectives*. That group is in turn based on Bolaño’s earlier real-life literary\
    \ gang of two, the infrarealists. The such margins, boys! comment after the Pierre\
    \ de Fermat entry is ostensibly a reference to Fermat’s famous marginal note,\
    \ in which he proclaimed he had a proof for his “last theorem” but not enough\
    \ space to document it. However, it may also be an oblique reference to Ulises\
    \ Lima, the co-hero of *The Savage Detectives*, who was notorious for scribbling\
    \ poems in the margins of printed books.\nThere are other Bolaño traits here:\
    \ the juxtaposition of long and short paragraphs, the absence of semicolons (mirroring\
    \ the absence of quotation marks in his novels), and the use of implicit globals\
    \ (suggesting that each variable is destined to make further appearances in subsequent\
    \ chapters or even future spin-off novels).\n\n![](img/e3611bbec0f345b635c8b5856486bcbb_39_0.png)\n\
    \nMy mind tells me I will never understand JavaScript.\nAnd my heart tells me\
    \ I am not meant to."
  mdcn: "\n莎士比亚的解决方案是一部两幕喜剧，它大量借鉴了JavaScript的特殊行为以制造轻松效果。在进入主要事件之前，我们先认识了剧中角色。遵循伊丽莎白时期喜剧的传统，令人不安的第一幕（其中过早展示了一个不完整的结果）在最后一幕中得到了圆满解决，这带给我们极大的安慰与欢乐。\n\
    \n这位吟游诗人略显啰嗦，但我们并不希望他改变风格。剧中运用了几种巧妙的装置——例如，使用`Math.max`确保`theResult`不会因负索引寻址而遭受失礼之辱。\n\
    \n请注意，尽管莎士比亚的注释采用抑扬格五音步，但他使用了弱尾（即添加了一个额外的非重音音节）。莎士比亚常用弱尾来表示询问或不确定（相当于伊丽莎白时期的语调上扬）。我们只能推测，他和我们一样觉得JavaScript令人恼火。\n\
    \n![](img/e3611bbec0f345b635c8b5856486bcbb_27_0.png)\n\n> *无法想象骏马在番茄上奔驰的人是白痴。*\n\
    \n## 安德烈·布勒东\n\n1896–1966\n\n作为超现实主义运动的创始成员之一，安德烈·布勒东相信梦境比现实更有趣，并应构成我们创造性努力的基础。因此，名词的选择也遵循此原则。\n\
    尽管人们很容易嘲笑布勒东那些古怪的比喻，但他的作品历久弥新，始终饱含深情且美妙——那是无意识的听写，被温柔地抄录。以下是他的华丽诗作《Facteur Cheval》的节选，由戴维·加斯科因翻译。\n\
    \n*你记起然后你起身你下了火车*\n*瞥都没瞥一眼被巨大气压根攻击的机车*\n*它在原始森林中抱怨着被谋杀的锅炉*\n*它的烟囱冒着风信子烟，蜕下蓝色的蛇*\n\
    *然后我们继续前行，注定蜕变的植物*\n*每夜发出信号好让人能理解*\n*当他的房屋倒塌，他惊奇地站在奇异的包装箱前*\n*他的床带着走廊和楼梯寻找着这些箱子¹*\n\
    \n海明威若写JavaScript\n安德烈·布勒东\n\n```\nfunction Colette(umbrella) {\n  var staircase\
    \ = 0, galleons = 0, brigantines = 1;\n  var armada = [galleons, brigantines],\
    \ bassoon;\n  Array.prototype.embrace = [].push;\n\n  while (2 + staircase++ <\
    \ umbrella) {\n    bassoon = galleons + brigantines;\n    armada.embrace(brigantines\
    \ = (galleons = brigantines, bassoon));\n  }\n\n  return armada;\n}\n```\n\n布勒东很可能将他的斐波那契练习题以一位旧爱的名字命名。他将迭代想象为一段遥远的阶梯，由一支幽灵般的古代船队攀爬。阶梯长度不确定，但一把伞似乎标记了无法再攀登的点。当我们的主角每上一级台阶，双桅帆船和小帆船便随着一支孤零零的大管乐所奏的萦绕旋律而移动。\n\
    \n布勒东的解决方案以其标志性的优雅逻辑为支撑——他使用逗号运算符作为一种空灵的装置，同时将小帆船赋值给双桅帆船，将大管赋值给小帆船。\n\n致敬了，安德烈！\n\
    \n![](img/e3611bbec0f345b635c8b5856486bcbb_33_0.png)\n\n我们梦见了JavaScript，然后尖叫着醒来。\n\
    \n## 罗贝托·波拉尼奥\n\n1953–2003\n\n## 海明威若写JavaScript\n罗贝托·波拉尼奥\n\n如果你死前没有读过至少一本波拉尼奥的书，那你就是虚度此生。\n\
    作为20世纪最后一位伟大的拉美作家，波拉尼奥是他前辈魔幻现实主义者当之无愧的继承者，但他的作品更难归类。是的，有反复出现的主题：主人公（往往就是作者的分身）是文学行动英雄，诗歌是男子气概的灯塔或知识分子帮派斗争的催化剂。但尽管他声称热爱形式，波拉尼奥的作品常常显得杂乱、散漫且不一致，容易突兀地插入几页无关紧要的琐碎细节，或突然转向，抛弃先前的英雄，留下诱人的剧情悬而未决。不过，这或许正是他伟大的关键所在。\n\
    波拉尼奥本性是诗人，因必要而成为小说家，他觉得无需遵守小说惯例（正如他笔下一个人物所说，“情节规则只适用于那些模仿其他小说的小说”）。$^{1}$ 当更主流的作家不断推动其角色走向一个整洁——或至少是结论性的——结局时，波拉尼奥则满足于让他主角们变幻莫测的心理状态主导一切。这种缺乏编排使得那些随机出现的美与痛苦时刻更加引人入胜，正如他在《荒野侦探》中这个简短段落所展示的：\n\
    \n> *她也在看着我，我想我脸红了一点。我感到快乐。然后我立刻就把它搞砸了。*$^{2}$\n\n波拉尼奥的大部分角色都是流离失所、迷失或绝望的。人性的脆弱无一禁区。然而叙事很少是黑暗的。相反，波拉尼奥作为超然的观察者，散发着天真魅力而无傲慢或说教。当倦怠和不安全感再次打乱周密的计划时，波拉尼奥与我们一同欢笑，而非嘲笑我们。\n\
    \n海明威若写JavaScript\n\n罗贝托·波拉尼奥\n\n```\n1    function LeonardoPisanoBigollo(l) {\n\
    2\n3      if (l < 0) {\n4        return \"I'd prefer not to respond. (Although\
    \ several replies occur to me.)\"\n5      }\n6\n7      /**/\n8\n9      //Everything\
    \ is getting complicated.\n10     for (var i=2,r=[0,1].slice(0,l);i<l;r.push(r[i-1]+r[i-2]),i++)\n\
