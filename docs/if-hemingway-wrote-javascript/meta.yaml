  md: 'To some extent, Adams''s comic genius actually works against the book; Adams
    describes himself as “essentially a frivolous” writer, and much of the plot feels
    like filler in service of his clever one-liners.² There are other problems: The
    only obviously female character (and the only human besides Arthur) is Trillian,
    whom we are told (several times) is both exceptionally clever and exceptionally
    beautiful. Her character seems way too perfect for a mere humanoid, and yet for
    all her prowess, she''s given very little to do.


    Eventually, Adams burned out (“It felt like a mouse on a wheel; there was no pleasure
    coming into the cycle at any point”³) and turned to fresh endeavors, starting
    with the fantasy detective novel *Dirk Gently''s Holistic Detective Agency* (built
    upon unused *Doctor Who* scripts), which spawned a sequel, *The Long Dark Tea-Time
    of the Soul*.


    One of his final projects was the acclaimed radio series and nonfiction book *Last
    Chance to See*, in which Adams traveled to far-flung locations to hang out with
    animals on the brink of extinction. Fittingly, Adams described *Last Chance to
    See* as his favorite work.'
