  md: '“The plot of *The God of Small Things* is non-linear, and so is Roy’s JavaScript
    code. Just as the novel begins at the end and then fills in the gaps through a
    series of flashbacks, so the sayIt utility begins by returning the completed phrase
    before supplying the "Grubby Details." To this end, Roy’s solution leans heavily
    on function declarations, which will be *hoisted* (moved to the top of the code)
    by the compiler.


    With trademark elegance, Roy never once resorts to conditional logic. Her KochuFunction
    (*Kochu* is Malayalam for "little") makes use of the so-called *Russian doll pattern*,
    whereby after the function has been called once, it redefines itself.⁵ So the
    first time KochuFunction is called, it creates a new array seeded by the given
    word, after which it reinvents itself as a function for pushing subsequent words
    onto the existing array.


    Meanwhile, TheSayItSaveItThing returns whatever you need it to, without having
    to be told. If you call it with a word, the word gets stored. When you''re done
    calling it, the function itself is returned and will, thanks to a crafty toString
    method, magically reveal the completed phrase.


    Roy names her functions and variables from the perspective of the novel''s young
    twins, while the comments resemble her typically haunting (yet playful) narrative.'
