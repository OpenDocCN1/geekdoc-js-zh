    \ 一次又一次，在他的歌词中，图帕克拒绝匪徒生活，同时承认自己已无法回头，并预言自己即将死亡：\n\n> 街头没有怜悯，我无法休息\n> 我几乎站不住，快要崩溃，尖叫着和平\n\
    > 尽管我的灵魂已被抹去，我却看不见\n> 我满脑子都是试图挣脱的恶魔⁵\n\n图帕克可能缺乏那些更精于技艺的说唱歌词的细腻和复杂的押韵模式。他的大部分歌词简短而直截了当；他并不追求巧妙。但正是这种原始、未加修饰的诚实才如此具有冲击力。冲动且不加防备的图帕克，其矛盾的情感——敌意与谦卑、自信与怀疑、力量与脆弱——令人心酸地并存着。\n\
    \n## 假如海明威来写JavaScript\n### 图帕克·夏库尔\n\n```javascript\nvar theyDigits, theStash,\
    \ nextFigure, anEmptyHash = {}\n\nfunction isChillin(maFigure) {\n  theStash =\
    \ theStash || anEmptyHash\n  nextFigure = 0 /* 想象我归零 */\n  /* 为填充做准备 */\n  /*\
    \ 它们的先决条件是分割，所以 */ doFissionOn(maFigure)\n  sumTheySquares() /* 二次方加法，像个数学家一样\
    \ */\n  /* 而stash是缓存所有我死去数字的哈希表 */\n  /* 如果你的值是1，你就赢了，或者如果你在那个stash里，你就完了 */\n\
    \  if (nextFigure == 1) return \"chillin\"\n  if (theStash[nextFigure] == 'x')\
    \ return \"illin\"\n  theStash[nextFigure] = 'x' /* 保留历史记录 */\n  /* 打破迭代苦难的链条\
    \ */\n  return isChillin(nextFigure) /* 递归，重新调整，重新遍历这首诗 */\n}\n\nfunction doFissionOn(n)\
