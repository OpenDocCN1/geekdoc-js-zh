    # ERNEST

    HEMINGWAY


    1899–1961'
  - '[PAGE 17]


    Ernest Hemingway''s work is characterized by direct, uncomplicated prose and a
    lack of artifice. In his fiction, he describes only the tangible truths: dialog,
    action, superficial traits. He does not attempt to explain emotion; he leaves
    it alone. This is not because Hemingway doesn''t want his stories to convey feeling—quite
    the opposite: his intent is to create a vacuum so that it might be filled by the
    reader''s own experience. After all, emotion is more easily felt than described
    with words:


    > I have tried to eliminate everything unnecessary to conveying experience to
    the reader so that after he or she has read something it will become a part of
    his or her experience and seem actually to have happened.¹


    Hemingway''s prose is never showy, and his syntax is almost obsessively conventional.
    The short, unchallenging sentences and absence of difficult words add a childlike
    quality to his cadence. He assumes the role of naive observer, all the better
    to draw his readers into the emotional chaos beneath.'
