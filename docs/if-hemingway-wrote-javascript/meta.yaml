  md: '# IF HEMINGWAY WROTE JAVASCRIPT

    VLADIMIR NABOKOV


    Vladimir Nabokov is best known for Humbert Humbert''s slippery account of his
    obsession with 12-year-old Lolita, but he should perhaps be better known as a
    lingual aesthete without peer. Nabokov delights in fun and games, repurposing
    every fragment of each cleverly woven plot as a lexical playground for puns and
    anagrams, double entendres and almost-words, alliteration and acrostics. Yet those
    who dismiss Nabokov as merely a peddler of deftly chiseled whimsy overlook his
    ability to move or unnerve readers through vivid imagery. Here he summons a procession
    of sibilant *Ss*, rugged *Rs*, and bouncing *Bs* to render a wistful picture of
    childhood contentment:


    > > *A sense of security, of well-being, of summer warmth pervades my memory.
    That robust reality makes a ghost of the present. The mirror brims with brightness;
    a bumblebee has entered the room and bumps against the ceiling.*


    Then there''s his extraordinary gift for surface and sensory minutiae: a snowflake
    settling on the crystal glass of a wristwatch, the reflection from a bedstead,
    the suggestion of human speech in the echo of running tap water. To Nabokov, the
    "divine detail" is everything: "the capacity to wonder at trifles . . . these
    asides of the spirit, these footnotes in the volume of life are the highest forms
    of consciousness, and it is in this childishly speculative state of mind, so different


