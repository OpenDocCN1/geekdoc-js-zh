  md: 'Doyle was clearly in full deerstalker- and magnifying glass–mode when solving
    the case of the hidden factorial.


    Or rather, unfactorial. Why? Because Holmes always works backward toward the deed’s
    inception. As he puts it, “It is a capital mistake to theorise before one has
    data. Insensibly one begins to twist facts to suit theories, instead of theories
