    but in a more just world, it would be named the *Pingala* sequence, after the
    Sanskrit grammarian who documented it a thousand years earlier.


    As we progress through the series, the ratio between successive numbers tends
    toward a constant (roughly 1.61803) known as the *golden ratio*. Some mathematically
    inclined flora arrange their branches or petals according to the golden ratio—though
    its prevalence in nature is sometimes overstated.'
