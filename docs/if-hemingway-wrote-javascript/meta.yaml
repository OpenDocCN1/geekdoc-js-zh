  - '[PAGE 104]


    If the semicolon is the period of JavaScript, then the comma operator is its semicolon.
    Programmer Woolf loves the comma operator, and in her happy numbers solution,
    she uses it to excess. The result is a dreamy, melancholic form of JavaScript
    (is there any other?) made dreamier still by the heavy, almost dangerous level
    of *n* alliteration and some gorgeously expressive pairings. In *To the Lighthouse*,
    Woolf writes of night’s shadows: “They lengthen; they darken”; in her happy numbers
    solution we get the wistfully poetic `numerals.shift()`, `numerals.length`. The
    mood is volatile. Woolf begins the exercise confidently enough, yet even as she
    methodically talks us through the process, doubts emerge. Gradually, her inner
    voice permeates the commentary; she anxiously relates each number’s cold dissection.
    All this control, this manipulation . . . And to what end?


    At the conclusion, Woolf equates the value of happiness (i.e., the number 1) with
    the joys of solitude, perhaps in reference to her famous essay “A Room of One’s
    Own,” in which she makes the case that women writers should be given literal and
    figurative space.'
