    offthedocks. A luckchange, I see. Thinking

    young through the muddleage spread, the

    moral fat his mental leans on.*³


    Remarkably, over the years, tenacious readers

    have pieced together a discernible plotline,

    though they’re still divided over the identity of

    the characters.


    The latter part of Joyce’s life was quite

