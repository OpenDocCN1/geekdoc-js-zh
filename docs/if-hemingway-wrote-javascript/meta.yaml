    **JANE AUSTEN**


    With dazzling wit, captivating plotlines, and meticulous observation of the manners
    of her peers, Jane Austen reclaimed the novel from the syrupy sentimentalists
    who preceded her. Within her perfectly crafted velveteen passages lurks a bitingly
    cynical parody of the patriarchal society and the tedium of propriety.


    Considering the era in which she wrote, Austen was nothing short of a well-mannered
    revolutionary. The dominant literary form at the end of the 18th century was the
    *sentimental novel*, a mostly trashy and unrealistic genre that used sappy pathos
    to push readers’ emotional buttons and an aura of mushy goodness to tug at their
    heartstrings. Austen’s works, while superficially resembling this genre, ridicule
    the sentimentalist trifecta of fairy-tale love, chivalry, and honor in favor of
    more pertinent realities: money, wisdom, and prejudice.


    Austen also pioneered the use of *free indirect speech*, in which the narrative
    appears to express sentiments on the protagonist’s behalf. In this excerpt from
    *Emma*, the perspective gradually shifts from objective commentary to personal
    exclamation so that by the third sentence the point of view (and the attitude)
    is entirely Emma’s:


    > > *It was a very great relief to Emma to find Harriet as desirous as herself
    to avoid a meeting. Their intercourse was painful enough by letter. How much worse,
    had they been obliged to meet!*$^{1}$


