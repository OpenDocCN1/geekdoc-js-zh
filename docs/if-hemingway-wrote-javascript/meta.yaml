- md: "Shakespeare's solution comes in the form of a two-act comedy that draws heavily\
    \ on JavaScript's unusual mannerisms for levity. We're introduced to the cast\
    \ of players before settling in for the main event. In keeping with the traditions\
    \ of Elizabethan comedy, the unsettling opening act (in which an incomplete result\
    \ is prematurely presented) is happily resolved by the final act, affording us\
    \ much comfort and cheer.\n\nThe Bard gets a little wordy, but we wouldn't have\
    \ it any other way. Several clever devices are employed—for example, the use of\
    \ Math.max ensures that theResult does not suffer the indignity of being addressed\
    \ by a negative index.\n\nNotice that although Shakespeare's comments are in iambic\
    \ pentameter, he's using weak endings (that is, adding an extra unstressed syllable).\
    \ Shakespeare frequently used weak endings to denote enquiry or uncertainty (the\
    \ Elizabethan equivalent of upspeak). We can only assume he found JavaScript as\
    \ vexing as the rest of us do.\n\n![](img/e3611bbec0f345b635c8b5856486bcbb_27_0.png)\n\
    \n> *The man who can't visualize a horse galloping on a tomato is an idiot.*\n\
    \n## ANDRÉ BRETON\n\n1896–1966\n\nAs a founding member of the surrealist movement,\
    \ André Breton believed dreams were more interesting than reality and should form\
    \ the basis of our creative endeavors. Nouns are chosen accordingly.\nAlthough\
    \ it's easy to poke fun at Breton's eccentric metaphors, his work has aged well\
    \ and is invariably heartfelt and beautiful—the dictation of the unconscious,\
    \ tenderly transcribed. Here's an excerpt from his gorgeous poem “Facteur Cheval,”\
    \ translated by David Gascoyne.\n\n*You remembered then you got up you got out\
    \ of the train*\n*Without glancing at the locomotive attacked by immense barometric\
    \ roots*\n*Complaining about its murdered boilers in the virgin forest*\n*Its\
    \ funnels smoking jacinths and moulting blue snakes*\n*Then we went on, plants\
    \ subject to metamorphosis*\n*Each night making signs that man may understand*\n\
    *While his house collapses and he stands amazed before the singular packing-cases*\n\
    *Sought after by his bed with the corridor and the staircase¹*\n\nIF HEMINGWAY\
    \ WROTE JAVASCRIPT\nANDRÉ BRETON\n\n```\nfunction Colette(umbrella) {\n  var staircase\
    \ = 0, galleons = 0, brigantines = 1;\n  var armada = [galleons, brigantines],\
    \ bassoon;\n  Array.prototype.embrace = [].push;\n\n  while (2 + staircase++ <\
    \ umbrella) {\n    bassoon = galleons + brigantines;\n    armada.embrace(brigantines\
    \ = (galleons = brigantines, bassoon));\n  }\n\n  return armada;\n}\n```\n\nBreton\
    \ has most likely named his Fibonacci exercise after an old flame. He visualizes\
    \ iteration as a remote staircase plied by a ghostly fleet of ancient vessels.\
    \ The staircase is of indeterminate length, but an umbrella appears to mark the\
    \ point beyond which further ascent is impossible. As our protagonist climbs each\
    \ step, the galleons and brigantines shuffle to the haunting melody of a lone\
    \ bassoon.\n\nBreton’s solution is underpinned by characteristically elegant logic—he’s\
    \ using a comma operator as an ethereal device with which to simultaneously assign\
    \ brigantines to galleons and bassoons to brigantines.\n\nHats off, André!\n\n\
    ![](img/e3611bbec0f345b635c8b5856486bcbb_33_0.png)\n\nWe dreamed of JavaScript\
    \ and woke up screaming.\n\n## ROBERTO BOLAÑO\n\n1953–2003\n\n## IF HEMINGWAY\
    \ WROTE JAVASCRIPT\nROBERTO BOLAÑO\n\nIf you don't read at least one book by Bolaño\
    \ before you die, then you've wasted your life.\nAs the last great Latin American\
    \ writer of the 20th century, Bolaño is a worthy successor to the magical realists\
    \ that preceded him, but his writing is harder to characterize. Yes, there are\
    \ recurring themes: the protagonist (more often than not, an alter ego of the\
    \ author) as literary action hero, poetry as a beacon of virility or a catalyst\
    \ for intellectual gang warfare. But for all his professed love of form, Bolaño's\
    \ work is often messy, sprawling, and inconsistent, liable to lurch into pages\
    \ of tangential minutiae or take a sudden turn that orphans erstwhile heroes and\
    \ leaves tantalizing plotlines unresolved. Then again, that might just be the\
    \ key to his greatness.\nBolaño, a poet by inclination and a novelist by necessity,\
    \ feels no need to comply with novelistic conventions (as one of his characters\
    \ puts it, \"Rules about plot only apply to novels that are copies of other novels\"\
    ).$^{1}$ While more-mainstream authors constantly nudge their characters to a\
    \ tidy—or at least conclusive—result, Bolaño is content to let his protagonists'\
    \ fickle psychologies wag the dog. This lack of orchestration makes the random\
    \ moments of beauty and pain all the more compelling, as demonstrated by this\
    \ brief paragraph from *The Savage Detectives*:\n\n> *She was looking at me too,\
    \ and I think I blushed a little. I felt happy. Then right away I ruined it.*$^{2}$\n\
    \nMost of Bolaño's characters are displaced, lost, or desperate. No aspect of\
    \ human frailty is off-limits. Yet the narrative is rarely dark. On the contrary,\
    \ Bolaño, as the disinterested observer, exudes naïve charm without hubris or\
    \ homily. When ennui and insecurity once again derail the best laid plans, Bolaño\
    \ is laughing with us, not at us.\n\nIF HEMINGWAY WROTE JAVASCRIPT\n\nROBERTO\
    \ BOLAÑO\n\n```\n1    function LeonardoPisanoBigollo(l) {\n2\n3      if (l < 0)\
    \ {\n4        return \"I'd prefer not to respond. (Although several replies occur\
    \ to me.)\"\n5      }\n6\n7      /**/\n8\n9      //Everything is getting complicated.\n\
    10     for (var i=2,r=[0,1].slice(0,l);i<l;r.push(r[i-1]+r[i-2]),i++)\n11\n12\
    \     /**/\n13\n14     //Here are some other mathematicians. Mostly it's just\
