- img_proc: true
  md: 'Most of the authors in this book prepared for their assignment by attending
    JavaScript school. Such is the wizardry of her solution, we can only assume that
    Rowling went the extra mile and enrolled at Hogwarts, too.


    Rowling has called her solution `mumbleMore`, and like any competent magician,
    she begins by assembling the ingredients for the cauldron. `muggleBile` and `squib`
    are just there for flavor. The active ingredients are `wormword` (which usually
    represents the next word) and `pensieve` (a special memory device that Albus Dumbledore
    uses to store the array of words).


    Next we see the recipes for the two spells Rowling will be using. They''re both
    named for spells used in the Harry Potter books: `engorgio` (the engorgement charm)
    causes the subject—in this case, the pensieve of words—to swell in size, while
    `accio` (the summoning charm) recalls the pensieve''s memory.'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'The first time `mumbleMore` is called, the word is assigned to the `pensieve`.
    Then `engorgio` creates a new function that magically bakes the current value
    of `pensieve` into its first argument. Thus, the next time `mumbleMore` is called,
    `pensieve` is already preset to an array of all previous words, and the new word
    is assigned to the `wormword` argument. Still following? No one said sorcery was
    easy!


    This pattern repeats each time `mumbleMore` is called, until, eventually it''s
    called without passing a word parameter. At this point `accio` steps in to join
    the `pensieve` into a long string—and there''s your answer.


    Gallopin'' Gorgons!'
