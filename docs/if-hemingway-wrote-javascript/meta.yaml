    JORGE LUIS BORGES


    The restrained elegance of Jorge Luis Borges''s phrasing stands in contrast to
    his fanciful imagery and wild, boundless imagination. Borges was a free spirit
    who followed his multiple obsessions (time, the universe, labyrinths, spaces)
    with unrestrained zeal and then transcribed them into simple, classically crafted
    prose. Borges always maintained that he was a reader at heart, sharing Nabokov''s
    fierce belief in reading for reading''s sake. He dismissed the importance of meaning
    or message (“I don’t intend to show anything. I have no intentions”¹). The purpose
    of a book, Borges insisted, is aesthetic pleasure; a writer should be judged “by
    the enjoyment he gives and by the emotions one gets.”² Borges never wrote a full-length
    novel; he felt they were unworthy of the effort: “The composition of vast books
    is a laborious and impoverishing extravagance. To go on for five hundred pages
    developing an idea whose perfect oral exposition is possible in a few minutes!”³
    Instead, he concocted vast imaginary books and made them the subject of his short
    stories. “Tlön, Uqbar, Orbis Tertius” describes a fake encyclopedia for a made-up
    planet, the discovery of which triggers'
