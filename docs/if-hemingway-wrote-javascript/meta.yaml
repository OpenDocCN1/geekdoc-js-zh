  - '[PAGE 71]


    # IF HEMINGWAY WROTE JAVASCRIPT

    SIR ARTHUR CONAN DOYLE


    Sir Arthur Conan Doyle was a medical doctor by training and a writer by destiny.
    He wrote scores of short stories, historical novels, romances, and fantasy fiction,
    as well as countless nonfiction books on topics as diverse as the military, injustice,
    and spiritualism. But he’s best known as the creator of the iconic detective,
    Sherlock Holmes.

    There’s nothing groundbreaking about the format of the Holmes stories; the narrative
    is mostly linear and the prose exhibits plenty of Victorian pomposity. Nor is
    the character of Holmes entirely original—Doyle all but conceded that he used
    Edgar Allan Poe’s maverick detective C. Auguste Dupin as a blueprint (Doyle also
    draws heavily on Poe’s portrayal of the macabre). But the writing is lively, and
    we’re drawn to the emotional chasm between the brilliant but nutty Holmes and
    his eminently reasonable but pedestrian sidekick Watson. On top of that, Doyle
    concocts a delightfully freakish cast of minor characters, evoking London’s ghoulish
    underbelly.


    70'
  - '[PAGE 72]


    Holmes himself is deeply flawed. He''s lazy, conceited, vain, impetuous, and moody.
    He''s a drug addict who distrusts women and shuns relationships, and there''s
    a strong suggestion of autism. A peerless knowledge of poisons and tobacco varieties
    contrasts with almost total ignorance of basic science. (Shortly after their first
    meeting, Watson is astonished to learn that Holmes does not understand that the
    earth revolves around the sun.) Even his methods are questionable. What Holmes
    claims as deduction is actually induction—a series of guesses based on the study
    of minutiae:


    > The nocturnal visitors were two in number, one remarkable for his height (as
    I calculated from the length of his stride), and the other fashionably dressed,
    to judge from the small and elegant impression left by his boots. . . . Having
    sniffed the dead man''s lips I detected a slightly sour smell, and I came to the
    conclusion that he had bad poison forced upon him.¹


    Yet, whether by luck or good judgment, he''s a winner; he knows it, and so do
    we.'
