    # FACTORIAL


    **THE ASSIGNMENT:**

    WRITE A FUNCTION THAT RETURNS THE FACTORIAL OF THE SUPPLIED ARGUMENT.


    For any positive integer $n$, the factorial of $n$ is the result of multiplying
    $n$ by all the positive integers of lesser value. So the factorial of 5, which
    is usually written as 5!, is 5 × 4 × 3 × 2 × 1, or 120.


