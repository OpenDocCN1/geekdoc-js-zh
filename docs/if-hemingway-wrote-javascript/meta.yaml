  md: 'A master of overstatement, Dickens forms a solution that is nothing if not
    thorough. Instead of using a standalone prime-number utility, he chooses to augment
    `Number.prototype` so that the very numbers may discover their prime-ness for
    themselves. Regardless of the outcome, we''re treated to a gushing display of
    Dickens''s trademark sentimentality. When a number is composite (i.e., not prime),
    Dickens layers on the pathos, Little Nell–style, so that even the most coldhearted
    among us would be apt to choke up.<sup>1</sup> When the number is prime, the syrupy
    cheer is worthy of the Cheeryble brothers.<sup>2</sup>


    ```

    > MrsPrimmerwicksProgeny(6)

    Oh, 2 2 2 what a happy day this is for you and me!

    Oh, 3 3 3 what a happy day this is for you and me!

    It is a composite. The dear, gentle, patient, noble 4 is a composite.

    Oh, 5 5 5 what a happy day this is for you and me!

    It is a composite. The dear, gentle, patient, noble 6 is a composite.

    [2, 3, 5]

    ```


    (Note how Dickens uses `+this` to represent the number; `this` represents the
    number as an object, and `+` coerces it to its primitive value. He also uses the
    comma operator to return a Boolean value after console-logging his sentimental
    bilge.)


    As usual, Dickens uses wacky character names to full effect. `AddableChopper`
    is an incremental divisor to `BittyRemnant`''s waif-like remainder. `MaxwellNumberby`
    is the biggest number to test for; `AveryNumberby` represents every value in the
    iteration. `VenerableHeap` is Uriah''s less obsequi-ous twin brother—he''s responsible
    for delivering the result.'
