    Doctrine and dogma are the enemies of good JavaScript. Beware the overly protective
    mentor; reject the dry and narrow confines of computer science classes. Some developers
    thrive on rules and constraint, which is why there is Java. If 25 famous authors
    wrote Java, the result would be more or less the same every time. But JavaScript
    is much less prescriptive and appeals to those who value creativity over predictability.
    The best authors and the best JavaScript developers are those who obsess about
    language, who explore and play with it every day and in doing so develop their
    own idioms and their own voice.


    Finally, a word about the role of the humanities in software development. As vocational
    skills have become the order of the day, the liberal arts and social sciences
    are often dismissed as a sideshow for mushy technophobes or, worse, academics.
    One victim of this cultural hegemony is diversity (of people, and of approach)
    in the technology industry. Such narrow focus is self-defeating. Students of the
    humanities are more likely to have an inductive, open-ended approach to reasoning;
    they''re more likely to probe beyond the standard methodologies; and they''re
    more likely to question accepted practices. By bridging the disciplines, this
    book will play a small part, I hope, in enriching the gene pool of software development.


