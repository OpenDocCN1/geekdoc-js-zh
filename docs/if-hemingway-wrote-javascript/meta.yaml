    \       theDuchess = 1;\\n        theVerdict.push(theHatter);\\n        \" + theFullDeck.join(\"\
    theFullDeck[++theDuchess * theHatter]=true;\") + \"}\n10   \");\n11\n12   return\
    \ theVerdict;\n13 }\n```\n\nJavaScript is an unconventional language, brimming\
    \ with charming quirks and hidden features. Over the years developers have embraced\
    \ this kookiness, recognizing it as a vehicle for creativity and channeling it\
    \ to make beautiful things. Recently, however, some developers, ashamed of its\
    \ bizarre nature, have tried to reinvent JavaScript as a mainstream language—questioning\
    \ the value of more esoteric features and lamenting that anyone should have to\
    \ understand them.\n\nLewis Carroll is clearly on the liberal side of the debate;\
    \ in fact, he's gone out of his way to make his JavaScript as oddball as possible.\
    \ `theHatter` (which, I think, is intended as a loose pun on `theFactor`) is initialized\
    \ by means of the rarely used `Function` constructor and the much-feared `this`\
