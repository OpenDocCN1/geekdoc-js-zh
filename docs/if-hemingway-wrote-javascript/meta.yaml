    Someone clever once decided that 0! is 1, though no one can quite remember why.
    One explanation is that it keeps this pattern happy:


    3! = 4!/4

    2! = 3!/3

    1! = 2!/2

    0! = 1!/1


    Based on that premise, -1! would be infinity, which is why mention of negative
    factorials tends to be accompanied by awkward coughing.'
