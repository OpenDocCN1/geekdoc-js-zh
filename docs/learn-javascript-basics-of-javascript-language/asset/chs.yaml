  \n# 1.7 JavaScript 术语\n如果你是一个 JavaScript 程序员，你需要了解这些术语：\n- **分号** (`;`）：分号符号用于表示行结束。\n\
  - **方括号** (`[]`）：这些用于表示数组（Arrays）。\n- **大括号** (`{}`）：花括号用于定义作用域，如起始和结束点。\n- **括号**\
  \ (`()`）：用于调用函数。\n- **标识符**：是变量、函数、属性或对象的名称。\n- **变量**：存储值的标识符。\n- **运算符**：用于操作的特殊符号。例如算术运算符\
  \ `+` 用于相加数字。\n- **表达式**：解析为某些内容的变量或运算符。例如 `a = 1 + 2` 是一个表达式。\n- **语句**：执行操作的命令组或单个语句。它们以\
  \ `;` 结束。语句旨在执行某些操作。\n```javascript\n{\n  y = sum(1, 2);\n  alert(\"value of\" +\
  \ y);\n}\n```\n\n# 1.8 JavaScript 测试与调试\n由于 JavaScript 在浏览器中运行，调试 JavaScript 程序的唯一方法是使用浏览器工具。Chrome\
