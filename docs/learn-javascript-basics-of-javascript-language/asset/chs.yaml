  \n# 2 数据处理\n\n## 2.1 标识符\n\n### 标识符的使用\n标识符是带赋予变量、函数、对象、属性和事件的名称。定义标识符时需要遵循一些规则。\n\
  \n* 标识符只能包含字母、数字、下划线和美元符号 $\n* 标识符不能以数字开头。\n* 标识符是区分大小写的。\n* 标识符可以是任意长度。\n* 标识符不能使用关键字和保留字。\n\
  \n#### 一些有效的标识符：\n* `strFirstName`\n* `$var`\n* `index_1`\n* `crashReport`\n\n####\
  \ 无效的标识符：\n* `1PhoneNumber`\n* `false`\n* `long`\n* `package`\n\n#### 示例代码\n[下载示例](https://phpbootcampdemo.com/js/identifiers/downloads/js-identifiers-em1.zip)\n\
  ```html\n<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1.0\"><meta name=\"description\" content=\"\
  Page Description\"><title>Identifiers JavaScript</title><script>Alert('JavaScript\
  \ is Case Sensitive');</script></head><body><a href=\"#\" onclick=\"ALERT('Welcome\
