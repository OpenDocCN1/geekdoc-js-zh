  \n## 2.5 JavaScript 中的表达式\n\n### 3.1 赋值表达式\n\n赋值表达式的使用\n表达式被求得为一个结果值、最终值或单值。有几种表达式：\n\
  \n1. 赋值表达式\n2. 比较表达式\n3. 算术表达式\n4. 逻辑表达式\n\n我们将在本主题中介绍赋值表达式。表达式使用运算符来执行操作。`==` 是赋值运算符，将值赋给变量。`message\
  \ = “something”;` 是一个给 `message` 变量赋值的赋值表达式。\n\n#### 复合赋值运算符\n复合赋值运算符有助于完成超过一个运算符的工作。它将两个运算符结合在一起执行一个操作。复合赋值运算符有：\n\
  \n* `+=`\n* `-=`\n* `*=`\n\n```javascript\ncounter += 1;\ncounter = counter + 1;\n\
  counter -= 1;\ncounter = counter – 1;\ncounter *= 1;\ncounter = counter * 1;\n```\n\
