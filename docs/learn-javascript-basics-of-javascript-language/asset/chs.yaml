  \ ![](img/rsrc2VG.jpg)\n\n\n\n\n\n`alert` 是一个在网页上显示警报框的函数。`alert('some text here');`\
  \ 在行末尾添加分号 `;`。\n\n`<style>` 标签用于在该标签内编写 JavaScript。此标签 `<style>` 可以定义在 `<head>`\
  \ 或 `<body>` 中。在 `<style>` 标签内编写的 JavaScript 代码会在编写时被执行。\n\n如果你有两个连续的 `<script>`\
  \ 标签，那么 `<script>` 内部的代码会顺序执行。如果你将 `<script>` 标签放在 `<body>` 标签的末尾，则脚本会在页面加载后最后执行。\n\
