  \ 1.3 JavaScript 注释\n\n## 注释用法\n你可以使用特殊符号对 JavaScript 内部的代码进行注释。注释有助于单行或多行对代码进行说明。JavaScript\
  \ 引擎会忽略注释，它们不会显示在浏览器上。\n\nHTML 注释和 JavaScript 注释是不一样的。不要混淆 JavaScript 中的注释与 HTML\
  \ 中的注释。\n\nJavaScript 中有两种类型的注释：\n- **单行注释**：`//` – 这是单行注释。用于注释单行代码。\n- **多行注释**：`/*`\
  \ – 用于指示注释开始 / `*/` – 用于指示注释结束。`/*` 和 `*/` 之间的任何内容都不会被浏览器执行。\n\n#### 语法\n```html\n\
  <head>\n<script>\n// 这将向用户发出警报 – 单行注释\nalert('This is alerted on the browser');\n\
  /* 多行注释开始\nalert('This is not executed by the browser');\n多行注释结束 */\n</script>\n\
  </head>\n```\n\n### 示例\n[下载示例](https://phpbootcampdemo.com/js/comments/downloads/js-comments-em1.zip)\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
  \ content=\"Page Description\">\n<title>如何在 JavaScript 中编写注释</title>\n<!-- 这是 HTML\
  \ 注释 -->\n<script>\n/*\n这是 JS 中的多行注释。\n这与 HTML 注释不同。\n此块内的任何内容都将被忽略。\nalert('This\
  \ is Multi Line Comment Blok. Ignored by the Browser');\n*/\n// 使用文本向用户报警\nalert('Welcome\
  \ to JavaScript!');\n</script>\n<!-- 这是 HTML 注释 -->\n</head>\n<body>\n<h1>Heading</h1>\n\
  <p>Paragraph Text</p>\n<ul>\n<li>Item 1</li>\n<li>Item 2</li>\n<li>Item 3</li>\n\
  </ul>\n</body>\n</html>\n```\n\n* * *\n\n![](img/rsrc2VU.jpg) [实时预览](https://phpbootcampdemo.com/js/comments/em1)\n\
