  \ 1.4 外部 JavaScript\n\n## 外部 JavaScript 的用法\nJavaScript (JS) 可以写在另一个文件中并包含在 HTML\
  \ 页面中。使用外部 JS 的好处是，你只需要在一个地方更改 JS，就会影响整个网站的设计。\n\n外部 JS 文件名应为 `.js`，它可以包含在 HTML\
  \ 页面的任何位置。在 HTML 页面中使用：`<script type='text/javascript' />`。\n\n#### 语法\n```html\n\
  <head>\n<!-- 确保 javascriptcode.js 文件存在于 'javascript' 文件夹中 -->\n<script type='text/javascript'\
  \ src=\"javascript/javascriptcode.js\"></script>\n</head>\n```\n\n`<script>` 标签用于将资源链接到\
  \ HTML 页面。脚本属性会让浏览器知道资源的类型。`src` 属性类似于 `<img>` 标签，用于映射服务器上的文件位置。你甚至可以使用文件夹名/文件名来引用文件路径。\n\
  \n### 示例\n[下载示例](https://phpbootcampdemo.com/js/external/downloads/js-external-em1.zip)\n\
  有两个文件：`index.html`, `javascript/javascriptcode.js`。\n\n`javascriptcode.js` 文件通过\
  \ `<script>` 标签链接在 `index.html` 文件内部。`javascript` 是文件夹名称，它可以是任何名称，并非强制要求。`type`\
  \ 属性告诉文件内容的类型。在这种情况下，它是 `text/javascript`。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<meta name=\"description\" content=\"Page Description\"\
  >\n<title>External JavaScript</title>\n<script type='text/javascript' src=\"javascript/javascriptcode.js\"\
  ></script>\n</head>\n<body>\n<h1>External JavaScript!</h1>\n<p>Paragraph Text</p>\n\
  <ul>\n<li>Item 1</li>\n<li>Item 2</li>\n<li>Item 3</li>\n</ul>\n</body>\n</html>\n\
  ```\n文件名：`javascriptcode.js`\n```javascript\nalert('I am called from javascriptcode.js\
  \ file!');\n```\n\n\n\n\n\n![](img/rsrc2VW.jpg)[实时预览](https://phpbootcampdemo.com/js/external/em1)练习\
  \ 1[下载练习 1](https://phpbootcampdemo.com/js/external/downloads/js-external-ex1.zip)\n\
