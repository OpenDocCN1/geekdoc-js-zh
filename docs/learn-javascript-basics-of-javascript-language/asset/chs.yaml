  \n## 5.2 对象\n### 对象的使用\n对象将变量和函数组合在一起。对象中的变量被称为属性（Properties）。对象中的函数被称为方法（Methods）。\n\
  \n如果 `Hotel` 是一个对象，那么 `numberOfRoom` 就是一个属性，`checkAvailability()` 就是一个函数。\n\n####\
