  \n# 3.4 逻辑表达式\n\n### 逻辑表达式的使用\n表达式会被求值为结果值、最终值或单一值。\n有以下几种表达式：\n\n1. 赋值表达式\n2. 比较表达式\n\
  3. 算术表达式\n4. 逻辑表达式\n\n我们将在本主题介绍逻辑表达式。表达式使用运算符来执行操作。逻辑运算符用于根据多个条件检查条件是否为真或假。![](img/rsrc2XG.jpg)`&&`\
  \ 是逻辑运算符，它检查左侧和右侧的值并判断条件为真为假。\n\n* `(5 > 3)` – true\n* `(8 < 5)` – false\n* `true\
  \ && false = false`\n\n变量 `result` 将具有布尔值 false。\n\n#### 逻辑运算：\n* `&&` – 与 (AND)\n\
  * `||` – 或 (OR)\n* `!` – 非 (NOT)\n\n### 优先级\n优先级决定了哪个操作先求值。\n* `NOT`\n* `AND`\n\
  * `OR`\n\n### 示例\n[下载示例](https://phpbootcampdemo.com/js/logical/downloads/js-logical-em1.zip)\n\
