  练习 2：要求用户输入年龄，并判断他是儿童、成年人（age > 21）还是老年人（age > 55）。\n\n---\n\n## 4.2 switch 语句\n\
  \n### switch 语句的使用\n`switch` 语句用于检查一个值，并根据值匹配的结果做出决策。\n\n**语法：**\n```javascript\n\
  switch( variable ){\n  case value:\n    //Statement\n    break;\n  case value:\n\
  \    //Statement\n    break;\n  default:\n    //Statement\n    break;\n}\n```\n\n\
  **示例 1：**\n```javascript\nswitch ( dayOfWeek ){\n  case ‘Mon’:\n    alert(“Welcome\
  \ Monday”);\n    break;\n  case ‘Tuesday’:\n    alert(“Welcome Tuesday”);\n    break;\n\
  \  default:\n    alert(“Try Again!”);\n    break;\n}\n```\n\n```html\n<!DOCTYPE\
