  \ `Switch` 语句。\n\n**提示：**\n```javascript\nswitch(true){\n  case (input > 21):\n\
  \    //Statements\n    break\n}\n```\n\n---\n\n## 4.3 while 语句\n\n### while 循环的使用\n\
  `while` 语句用于循环执行一段代码块，运行直到满足条件为止。不断执行相同的代码块，直到条件被满足。\n\n**语法：**\n```javascript\n\
  while( condition ) {\n  //Statement\n}\n```\n\n**示例 1：**\n```javascript\nvar counter\
  \ = 0;\nwhile ( counter <= 10 ){\n  counter++;\n}\n```\n\n**语法：**\n```javascript\n\
  do{\n  //Statement\n} while ( condition );\n```\n\n**示例 1：**\n```javascript\nvar\
  \ counter = 0;\ndo{\n  counter++;\n} while ( counter <= 10 );\n```\n\n```html\n\
  <!DOCTYPE html>\n<html\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
  \ content=\"Page Description\">\n<title>While Statements</title>\n<script>\n  var\
  \ counter = 0;\n  while( counter <= 10){\n    console.log(\"While Counter: \" +\
  \ counter++);\n  }\n  counter = 0;\n  do{\n    console.log(\"Do Counter: \" + counter++);\n\
  \  }while( counter <= 10);\n</script>\n</head>\n<body>\n<h1>While Statements</h1>\n\
  </body>\n</html>\n```\n\n---\n\n### 练习 1\n练习 1：从用户接受两个数字，并打印它们之间的所有数字。最多打印 10 个数字。\n\
  \n- `break;` – 是一个关键字，用于在循环中跳出循环。\n- `continue;` – 是一个关键字，用于在循环中通过跳过下面的语句来继续循环。\n\
  \n**提示：**\n```javascript\nif( counter >= 10){\n  break;\n}\n```\n\n### 练习 2\n练习\
  \ 2：从用户接受两个数字，并只打印它们之间的偶数。最多打印 10 个数字。\n\n---\n\n## 4.4 for 语句\n\n### for 循环的使用\n\
  `for` 循环用于循环执行一段代码块，运行直到满足条件为止。不断执行相同的代码块，直到条件被满足。\n\n**语法：**\n```javascript\nfor(\
  \ counter initialization; condition; increments ) {\n  //Statement\n}\n```\n\n**示例\
  \ 1：**\n```javascript\nfor(var counter = 0; counter <= 10; counter++){\n  alert(counter);\n\
  }\n```\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"utf-8\">\n<meta\
