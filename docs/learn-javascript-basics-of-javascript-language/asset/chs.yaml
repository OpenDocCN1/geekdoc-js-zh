  \n# 4 语句 Statements\n\n## 4.1 if 语句\n### if 语句的使用\n`if` 语句用于检查条件并根据结果做出决策。当条件为真时执行某些操作，为假时执行其他操作。你可以将多个条件组合起来，根据条件选择操作。\n\
  \n**语法：**\n```javascript\nif ( condition1 ){\n// 语句\n} else if ( condition2 ){\n\
  // 语句\n} else {\n// 语句\n}\n```\n\n### 示例 1\n```javascript\nif( marks > 35 ){\nalert(“Passed!”);\n\
  }else{\nalert(“Try Again!”);\n}\n```\n\n### 示例 2\n```javascript\nif( marks > 35\
  \ && marks < 60 ){\nalert(“Passed with Grade C”);\n}else if ( marks > 60 && marks\
  \ < 80 ){\nalert(“Passed with Grade B”);\n}else if ( marks > 80 ){\nalert(“Passed\
  \ with Grade A”);\n}else{\nalert(“Try Again!”);\n}\n```\n\n[下载示例文件](https://phpbootcampdemo.com/js/statements-if/downloads/js-statements-if-em1.zip)\n\
