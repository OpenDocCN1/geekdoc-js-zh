  ;\n      break;\n    case 'tuesday':\n      result = \"Second Days of Week\";\n\
  \      break;\n    case 'wednesday':\n      result = \"Mid Week\";\n      break;\n\
  \    case 'thursday':\n      result = \"Preparing for Weekend\";\n      break;\n\
  \    case 'friday':\n      result = \"It's Friday!\";\n      break;\n    case 'saturday':\n\
  \      result = \"Enjoying Day!\";\n      break;\n    case 'sunday':\n      result\
  \ = \"Resting Day!\";\n      break;\n    default:\n      result = \"Cannot find\
  \ that Value!\";\n  }\n</script>\n</head>\n<body>\n<h1>Switch Statements</h1>\n\
  <script type=\"text/javascript\">\n  document.write( result );\n</script>\n</body>\n\
