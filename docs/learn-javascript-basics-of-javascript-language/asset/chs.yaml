  description\" content=\"Page Description\">\n<title>For Statements</title>\n<script>\n\
  \  for(var counter=0; counter<=10; counter++){\n    console.log(\"For Counter: \"\
  \ + counter);\n  }\n</script>\n</head>\n<body>\n<h1>For Statements</h1>\n</body>\n\
  </html>\n```\n\n\n\n\n\n![](img/rsrc2YR.jpg)[实时预览](https://phpbootcampdemo.com/js/statements-js/for/em1/after)练习\
