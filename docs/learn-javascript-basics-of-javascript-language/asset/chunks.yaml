    \n### Exercise 2: Show a alert message when clicked anywhere on the page. Find\
    \ the area when clicked – `alert` is raised and find the area where alerts are\
    \ not raised on the `body`.\n\n![](rsrc2W1.jpg)[Live Preview](https://phpbootcampdemo.com/js/inline/ex2)\n\
    \n# 1.6 Hello Sample JavaScript\n\n## Hello World Program\nYou can choose to write\
    \ JavaScript Internal, External or Inline and it will work. But the best way is\
    \ to organize your code into one file so that it is easy to fix issues at one\
    \ place for your entire site. For this hello world sample, we will use the inline\
    \ javascript. Once we know how to write functions and call them from on click\
    \ even then we improve this program. Instead of `alert` we will use `confirm`\
    \ method that shows ok and cancel button. However, we don’t take any action on\
    \ what user pressed so just show a different confirm box when user click the link.\n\
    `confirm(‘Enjoying JavaScript!’);`\n\n![](rsrc2W2.jpg)Sample Example\n[Download\
    \ the Example](https://phpbootcampdemo.com/js/sample/downloads/js-sample-em1.zip)\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>Sample JavaScript Program!</title>\n</head>\n\
    <body>\n  <h1>Sample JavaScript Program</h1>\n  <p>Paragraph Text</p>\n  <a href=\"\
    #\" onclick=\"alert('Hello World!');\">Hello Message!</a>\n  <br>\n  <a href=\"\
    #\" onclick=\"confirm('Enjoying JavaScript!');\">Do you Like?</a>\n</body>\n</html>\n\
    ```\n\n* * *\n\n![](rsrc2W3.jpg)[Live Preview](https://phpbootcampdemo.com/js/sample/em1)Exercise\
    \ 1[Download the Exercise 1](https://phpbootcampdemo.com/js/sample/downloads/js-sample-ex1.zip)\n\
    \n### Exercise 1: Show list of items 1, 2 and 3. When user clicks any links show\
    \ what they have clicked.\n\n![](rsrc2W4.jpg)[Live Preview](https://phpbootcampdemo.com/js/sample/ex1)Exercise\
    \ 2[Download the Exercise 2](https://phpbootcampdemo.com/js/sample/downloads/js-sample-ex2.zip)\n\
    \n### Exercise 2: Replace `onclick` with `onmouseover` in the above example and\
    \ see how `alert` is raised.\n\n![](rsrc2W5.jpg)[Live Preview](https://phpbootcampdemo.com/js/sample/ex2)\n\
    \n# 1.7 JavaScript Terminology\nThese are the terms you need to know if you are\
    \ a JavaScript Programmer:\n- **Semicolon** (`;`): Semicolor symbol is used to\
    \ indicate line is finished.\n- **Brackets** (`[]`): These are used to represent\
    \ Arrays.\n- **Braces** (`{}`): Flower brackets are used to define the scope like\
    \ starting point and ending point and we write the code inside this block.\n-\
    \ **parentheses** (`()`): Is used to call a function.\n- **Identifiers**: are\
    \ the name given to variables, functions, properties or object. Any thing you\
    \ name it is identifier.\n- **Variable**: Any identifier that stores value.\n\
    - **Operators**: Special symbols that are used to perform operation. Like Arithmetic\
    \ operator `+` is used to add two numbers.\n- **Expressions**: They are variables\
    \ or operators that resolves into something. Example: `a = 1 + 2` is an expression.\n\
    - **Statements**: Group of commands to perform action or could be a single statement.\
    \ They end with `;`. Statement are meant to do some action.\n```javascript\n{\n\
    \  y = sum(1, 2);\n  alert(\"value of y\" + y);\n}\n```\n\n# 1.8 Testing & Debugging\
    \ JavaScript\nBecause JavaScript runs in the browser the only way to debug the\
    \ JavaScript program is from the browser tools Chrome and Firefox has plenty of\
    \ debugging tools that can help to find the issue and fix it. You can pause the\
    \ execution of javascript program and debug it steps by step. You need to learn\
    \ this method to find the issues in JavaScript and fix it.\n\n### Inspect Window\n\
    Load any HTML program with JavaScript in Chrome and press `CTRL + SHIFT + I`.\
    \ This will load the Inspect Window. ![](rsrc2W6.jpg)\n\n### Console Tab\nConsole\
    \ tab is the output tab where you can write the logs of your program and view\
    \ it. Even browser will it is own log here if there is any issue in the HTML program.\n\
    ```javascript\nconsole.log('This is a log from JavaScript program');\n```\n![](rsrc2W7.jpg)\n\
    This is the easiest way to debug your program by writing `console.log` at many\
    \ places in your code and verify it from the inspect -> console window. [Download\
    \ the Example](https://phpbootcampdemo.com/js/testing/downloads/js-testing-em1.zip)\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
