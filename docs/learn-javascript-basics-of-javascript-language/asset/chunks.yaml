    ## 2.2 Variables


    ### Usage of Variables

    Variables are used to store information which are used inside the program.


    ![](rsrc2WG.jpg) `var` keyword is used to define a variable. `var message = “This
    is a test message”;` `=` ` is the assignment operator used to assign the value
    to the variable. `“”` double quotes is used to represent string value.; `;` semicolon
    is used to end the assignment statement.


    #### SYNTAX


    #### Declaring a Variable

    ```javascript

    var variableName;

    ```

    #### Initialize the variable with empty string

    ```javascript

    variableName = "";

    ```

    #### Assigning Value to the Variable.

    ```javascript

    variableName = “This is a Test Message!”;

    ```

    #### Multiple Variable

    ```javascript

    var name1, name2, name3;

    nam1 = “firstName”, name2 = “middleName”, name3 =”lastName”

    ```

    #### Defining the Integers & Decimals

    ```javascript

    var counter = 0;

    counter = 10;

    var total = 10.98;

    counter = total;

    ```


    #### Show Variable in alert message:

    ```javascript

    var firstName = “WPFreelancer.com”;

    alert(‘Welcome to ” + firstName );

    ```

    `+` symbol is used to attach a variable to the string and display it.


    #### Write Variables on HTML Document

    `document.write()` method can be used to write anything on the HTML page. As `alert`
    is used to show alerts similarly `document.write()` method is used to write content
    on the HTML page. It can also access variable defined in the head -> script section.

    ```html

    <script type=”text/javascript">

    document.write(“Your Message” + message + “<br>”);

    </script>

    ```


    #### Example

    [Download the Example](https://phpbootcampdemo.com/js/variables/downloads/js-variables-em1.zip)

    ```html

    <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,
    initial-scale=1.0"><meta name="description" content="Page Description"><title>Variables</title><script>

    //Declaring a Variable

    var message;

    //Initalizing a Variable with Empty String

    message = "";

    //Assigning value to the Variables

    message = "1) Say Hello to Variables!";

    //Displaying the Variables

    alert(message);

    console.log(message);

    var counter = 0;

    alert("2) Counter Before: " + counter);

    message = "2) Counter Before: " + counter;

    console.log(message);

    counter = 100;

    alert("3) Counter After: " + counter);

    message = "3) Counter After: " + counter;

    console.log(message);

    </script></head><body><h1>Variables</h1><script type="text/javascript">document.write("Variables:
    " + message);</script></body></html>

    ```


