    ### 3.3 算术表达式


    算术表达式的使用

    表达式被求得为一个结果值、最终值或单值。有几种表达式：


    1. 赋值表达式

    2. 比较表达式

    3. 算术表达式

    4. 逻辑表达式


    我们将在本主题中介绍赋值表达式。表达式使用运算符来执行操作。算术表达式始终求得一个单值。一组产生单值的操作![](img/rsrc2X8.jpg)`+` 是算术运算符，将两个值相加。`message`变量


    算术操作：


    * `+` – 加法

    * `-` – 减法

    * `*` – 乘法

    * `/` – 除法

    * `%` – 取模

    * `++` – 增

    * `--` – 减


    #### 优先级

    优先级决定先执行哪个。从左到右，这些运算符的优先级较高


