  trans: "\n\n![](img/rsrc2ZA.jpg) 点击文件名 – `scripts.js` [下载练习 2](https://phpbootcampdemo.com/js/testing-js/debug/downloads/js-testing-js-debug-ex1.zip)![](img/rsrc2ZB.jpg)\
    \ [实时预览 2](https://phpbootcampdemo.com/js/testing-js/debug/ex1/after)\n\n### 第\
    \ 2 步：使用 Chrome 打开 HTML 页面\n下载源代码并使用 `chrome` 浏览器打开 HTML 文件进行测试。\n\n### 第 3 步：打开开发者工具\n\
    ![](img/rsrc2ZC.jpg) 打开 Chrome 开发者工具的 3 种：\n\n1. `CTRL` + `SHIFT` + `I`\n2. `F12`\n\
    3. 右角菜单 -> 更多工具 -> 开发者工具\n\n### 第 4 步：调试\n找到错误文件的 2 种：\n\n1. 一旦打开控制台窗口，它会用红色显示错误。点击链接将带你进入\
    \ javascript 错误代码。\n2. 点击 `Source`（源）标签页并打开文件。它将用红色叉号显示文件中的任何错误。\n\n## 6.2 常见错误\n\
    \n### Common JavaScript 错误\n这些是你在编写 JavaScript 时可能犯的最常见 JavaScript 错误。\n\n- **末尾忘记分号\
    \ ‘;’。**\n- **JavaScript 是大小敏感的。** 所以请确保名称与描述的一致。\n- **赋值运算符与比较运算符的区别。**\n  示例：//\
    \ 使用赋值运算符代替比较运算符。\n  ```javascript\n  if( a = b ){\n    // 语句\n  }\n  ```\n- **将数字与字符串比较。**\n\
    - **字符串中忘记 ‘+ ‘ 符号。**\n  示例：`\"This is a sample ” + message + ” Program” + message1\
    \ ” to do it!”`\n- **忘记单引号的开头和结尾。**\n  示例：`‘This is a sample ‘ + message + ‘ Program’s\
    \ ‘ + message1 + ‘ to do it!’`\n- **If 语句中缺少括号**\n  示例：//缺少括号\n  ```javascript\n\
    \  if ( x > y) && (y > 100) {}\n  ```\n- **使用了错误的大小的关键字。**\n  示例：\n  ```javascript\n\
    \  Funtion add(){\n  }\n  ```\n- **将关键字作为变量名。**\n  示例：//关键字作为变量\n  ```javascript\n\
    \  var name = “hello”;\n  ```\n- **忘记关闭括号**\n  示例：\n  ```javascript\n  function\
    \ add(){\n  }\n  var total = add;\n  ```\n- **访问错误的数组索引。**\n  示例：\n  ```javascript\n\
    \  var myArray = new Array();\n  myArray[0] = “hello”;\n  alert( myArray[1] );\n\
    \  ```\n\n## 6.3 Try Catch 块\n\n### Try Catch 块的使用\n编程中的异常被称为运行时错误（Runtime Errors）。当发生运行时错误时，有一种方法可以捕获这些错误并将它们传递给应用程序，让程序整洁地退出。这被称为异常处理（Exception\
    \ Handling）。\n\n确保代码不会崩溃，并且如果崩溃了也能知道原因并整洁退出的过程。\n\n为了在 JavaScript 中处理运行时错误，我们使用了\
    \ `try-catch` 块。使用它，我们可以捕获错误并决定下一步做什么。\n\n**语法：**\n```javascript\ntry{\n  // 语句\n\
    }\ncatch(errorName) {\n  // 语句\n}\n```\n\n**示例：**\n```javascript\ntry {\n  var\
    \ firstName = \"\";\n  if( firstName == “” ) throw “Name is empty”\n}catch (error){\n\
    \  alert(error);\n}finally {\n  alert(“Thanks for playing!”);\n}\n```\n\n`try\
    \ {}` 块包含所有语句；`throw` 是一个从程序中抛出错误的关键字。一旦程序抛出错误，它将停止处理后续步骤。它将跳转到 `catch {}` 块。一旦调用\
    \ `throw`，就会执行 `catch {}` 块。程序安全地从 catch 块执行。`finally{}` 块无论是否有错误都会执行。它是关闭所有打开连接的好地方。处理整洁退出。\n\
    \n![](img/rsrc2ZD.jpg) [下载示例](https://phpbootcampdemo.com/js/testing-js/trycatch/downloads/js-testing-js-trycatch-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>Try Catch JavaScript</title>\n<script>\n\
    try{\n  var input1 = prompt(\"Enter some Number\");\n  // 当输入为空时抛出错误\n  if( input1\
    \ == \"\") throw \"No value mentioned\";\n  // 如果上面的代码出错，则此处不执行\n  alert(\"Input\
    \ is correct!\");\n}catch(error){\n  // 捕获错误\n  alert(error);\n}finally{\n  //\
    \ 无论是否有错误，这都会每次执行\n  alert(\"Have a good Day!\");\n}\n</script>\n</head>\n<body>\n\
    \  <h1>Heading</h1>\n  <p>Paragraph Text</p>\n  <ul>\n    <li>Item 1</li>\n  \
    \  <li>Item 2</li>\n    <li>Item 3</li>\n  </ul>\n</body>\n</html>\n```\n\n* *\
    \ *\n\n![](img/r2ZA.jpg) [实时预览](https://phpbootcampdemo.com/js/testing-js/trycatch/em1/after)\n\
    \n### 7 DOM 模型\n\n### 通过 ID 元素\nDocument Object Model（简称 DOM）本质上是 HTML 元素的树形表示。DOM\
    \ 由浏览器创建，以便你可以轻松地导航并修改元素。rsrc2ZA.jpg)\n\n### 读取元素的值\n你可以通过 JavaScript 函数从 DOM\
    \ 读取任何元素：\n\n1. `getElementById(id)`\n2. `getElementsByTagName(tagName)`\n3. `getElementsByName(name)`\n\
    4. `getElementsByClassName(className)`\n\n[下载示例](https://phpbootcampdemo.com/js/dom-js/getid/downloads/js-dom-js-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>Inline JavaScript</title>\n<script>\n\
    function show(){\n  var txtValue = document.getElementById('txtName').value;\n\
    \  alert( txtValue );\n}\n</script>\n</head>\n<body>\n  <h1>Access the DOM Elements</h1>\n\
    \  <form>\n    <input type=\"text\" id=\"txtName\" />\n    <input type=\"button\"\
    \ onclick=\"show();\" Value=\"Show Value\" />\n  </form>\n</body>\n</html>\n```\n\
    \n* * *\n\n![](img/rsrc2ZK.jpg)[实时预览](https://phpbootcampdemo.com/js/dom-js/getid/em1/after)\n\
    \n### 练习 1\n[下载练习 1](https://phpbootcampdemo.com/js/dom-js/getid/downloads/js-dom-js-getid-ex1.zip)\n\
    **练习 1：** 复制示例并将 `id=\"txtName\"` 改为 `name=\"txtName\"`，使用此方法访问相同的值。\n\n**getElementsByName.\
    \ 提示：**\n```javascript\nvar txtValue = document.getElementsByName('txtName’)[0].value;\n\
    ```\n![](img/rsrc2ZK.jpg)[实时预览](https://phpbootcampdemo.com/js/dom-js/getid/ex1/after)\n\
    \n### 练习 2\n[下载练习 2](https://phpbootcampdemo.com/js/dom-js/getid/downloads/js-dom-js-getid-ex2.zip)\n\
    **练习 2：** 使用数组访问所有的表单文本框元素，并通过名称访问它们。\n**提示：** `<input type=\"text\" name=\"txtName\"\
    \ />`\n\n"
- fmt: "\n<input type=\"text\" name=\"txtName\" />\n\n## 7.2 Update the Data\n\nThe\
    \ `innerHTML` property can be used to update data for any element. Adding data\
    \ to this attribute will modify the DOM element and it will reflect immediately\
    \ on the page.\n\nExample: `document.getElementById(id).innerHTML = \"This is\
    \ a added element\";`\n\n[Download the Example](https://phpbootcampdemo.com/js/dom-js/updatedid/downloads/js-dom-js-updatedid-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta\
    \ name=\"description\" content=\"Page Description\">\n  <title>Inline JavaScript</title>\n\
    \  <script>\n    function update(){\n      document.getElementById(\"txtValue\"\
    ).innerHTML = document.getElementById(\"txtName\").value;\n    }\n  </script>\n\
    </head>\n<body>\n  <h1>Update the DOM Elements</h1>\n  <p id=\"txtValue\"></p>\n\
    \  <form>\n    <input type=\"text\" id=\"txtName\" onkeypress=\"update();\"/>\n\
    \  </form>\n</body>\n</html>\n```\n\n---\n\n### Exercise 1\nCreate two Text box\
    \ and if user writes the data in one text box then display the text in other text\
    \ box.\n\nTip: `document.getElementsByName(\"txtName\")[1].value = document.getElementsByName(\"\
    txtName\")[0].value;`\n\n### Exercise 2\nShow a button and when user press ask\
    \ them to type heading then change the heading with the new value.\n\n[Live Preview](https://phpbootcampdemo.com/js/dom-js/updatedid/ex2/after)\n\
    \n---\n\n## 7.3 Access Form Elements\n\nYou can access all the form elements using\
    \ the DOM. This is very helpful when you want to check what user has entered the\
    \ data before sending the data to server to save it. It is called as `Client Side\
    \ Validation`.\n\n[Download the Example](https://phpbootcampdemo.com/js/dom-js/forms/downloads/js-dom-js-forms-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta\
    \ name=\"description\" content=\"Page Description\">\n  <title>Inline JavaScript</title>\n\
    \  <script>\n    function checkFormData(){\n      //Query all elements that tag\
    \ name as input\n      var inputs = document.getElementsByTagName(\"input\");\n\
    \      var message = \"Form Elements\\n\\n\";\n      for (var i=0; i < inputs.length;\
    \ i++){\n        if (inputs[i].getAttribute('type') == 'text'){\n          message\
    \ += inputs[i].getAttribute('name') + \": \";\n          message += inputs[i].value\
    \ + \"\\n\";\n        }\n      }\n      alert(message);\n    }\n  </script>\n\
    </head>\n<body>\n  <form name=\"user\" id=\"userfrm\" action=\"#\">\n    Your\
    \ Name: <input type=\"text\" name=\"name\" id=\"txt_name\" />\n    Your Email:\
    \ <input type=\"text\" name=\"email\" id=\"txt_email\" />\n    <input type=\"\
    button\" name=\"submit\" value=\"Submit\" onclick=\"checkFormData(); />\n  </form>\n\
    </body>\n</html>\n```\n\n---\n\n### Exercise 1\nRead the Checkbox checked on the\
    \ form using JavaScript.\n\nTip: `<input type=\"checkbox\" id=\"chkbox\" onclick=\"\
    showFormData()>` `document.getElementById(\"chkbox\").checked`\n\n### Exercise\
    \ 2\nCall JavaScript function when the form is submitted.\n\nTIP:\n```html\n<form\
    \ name=\"search\" onsubmit=\"return callFunction()\" >\n```\n\n---\n\n## 8 Snippets\
    \ JavaScript\n\n### 8.1 Access the Browser URL\n\nThis snippet of code will help\
    \ you to navigate the page front or back based on the page history. You can make\
    \ the page go back and front from the JavaScript.\n\n[Download the Snippet](https://phpbootcampdemo.com/js/snippets-js/downloads/js-snippets-js-snippets-em1)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta\
    \ name=\"description\" content=\"Page Description\">\n  <title>Snippets JavaScript</title>\n\
    \  <script>\n    function goBack(){\n      history.back();\n    }\n  </script>\n\
    </head>\n<body>\n  <a href=\"#\" onclick=\"goBack()\">Go Back</a>\n  <br>\n  <a\
    \ href=\"#\" onclick=\"history.forward()\">Go Forward</a>\n</body>\n</html>\n\
    ```\n\n## 9 Projects\n\n### 9.1 Form Validations\n\nThis project will show how\
    \ to validate the form using JavaScript.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n  <meta name=\"description\" content=\"Page Description\"\
    >\n  <title>Form Validations</title>\n  <script>\n    function checkFormData(){\n\
    \      var message = \"\";\n      //Access TextBox\n      var tname = document.getElementById(\"\
    txt_name\").value;\n      //Access Email\n      var temail = document.getElementById(\"\
    txt_email\").value;\n      //Access Age\n      var tage = document.getElementById(\"\
    txt_age\").value;\n      //Access Radio Button\n      var tgender1 = document.getElementById(\"\
    radio1\").checked;\n      var tgender2 = document.getElementById(\"radio2\").checked;\n\
    \      //Access Checkbox\n      var tchkbox = document.getElementById(\"chkbox\"\
    ).checked;\n      message = \"Name: \" + tname + \"<br>\";\n      message += \"\
    Email: \" + temail + \"<br>\";\n      message += \"Age: \" + tage + \"<br>\";\n\
    \      message += \"Male: \" + tgender1 + \"<br>\";\n      message += \"Female:\
    \ \" + tgender2 + \"<br>\";\n      message += \"Agreed: \" + tchkbox + \"<br>\"\
    ;\n      document.getElementById(\"tmessage\").innerHTML = message;\n    }\n \
    \ </script>\n</head>\n<body>\n  <p id=\"tmessage\"></p>\n  <h1>Form Validations</h1>\n\
    \  <form action=\"https://freelancer.com/\" method=\"get\">\n    Your Name: <input\
    \ type=\"text\" name=\"tname\" id=\"txt_name\" /> <br><br>\n    Your Email: <input\
    \ type=\"text\" name=\"temail\" id=\"txt_email\" /> <br><br>\n    Your Age: <input\
    \ type=\"text\" name=\"tage\" id=\"txt_age\" /> <br><br>\n    Male <input id=\"\
    radio1\" name=\"gender\" type=\"radio\" checked>\n    Female <input id=\"radio2\"\
    \ name=\"gender\" type=\"radio\"> <br><br>\n    <input type=\"checkbox\" id=\"\
    chkbox\" /> Agree to Terms <br><br>\n    <input type=\"button\" name=\"submit\"\
    \ value=\"Submit\" onclick=\"checkFormData(); />\n  </form>\n</body>\n</html>\n\
    ```\n\n### 9.2 Guess the Number\n\nThis project will ask user to guess the right\
    \ number between 1 to 10. It will keep asking the number until the user guess\
    \ it.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n\
    \  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    \  <meta name=\"description\" content=\"Page Description\">\n  <title>Guess The\
    \ Number</title>\n  <script>\n    var message = \"\";\n    var answer = 5;\n \
    \   do{\n      var input1 = prompt(\"Guess the Number Between 1 to 10!\");\n \
    \     input1 = parseInt(input1);\n      if( input1 != answer ){\n        alert(\"\
    Nope - Wrong.\");\n      }\n    }while(answer != input1);\n    message = \"You\
    \ Guessed it Right - \" + answer + \" is the answer!\";\n  </script>\n</head>\n\
    <body>\n  <h1>Guess the Number</h1>\n  <script type=\"text/javascript\">\n   \
    \ document.write(message);\n  </script>\n</body>\n</html>\n```\n"
