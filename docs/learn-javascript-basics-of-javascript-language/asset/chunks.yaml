    # 1.4 External JavaScript


    ## Usage of External JavaScript

    JavaScript (JS) can be written in another file and included inside the HTML page.
    This type of external JS is very powerful and helpful technique which is commonly
    used in every website development.


    Benefit of using this external JS is that you have one JS file that is included
    in all the website pages. By just changing at one place in the JS it will impact
    the overall site design look and feel. This is one of the best practice to separate
    the design with the html tags and store them in a external file and include it
    in all the HTML pages.


    External JS filename should be `.js` and it can be included anywhere inside the
    HTML page with `<script type=''text/javascript'' src=" />`.


    ### SYNTAX

    ```html

    <head>

    <!-- Make sure javascriptcode.js file exists in the ''javascript'' folder -->

    <script type=''text/javascript'' src="javascript/javascriptcode.js"></script>

    </head>

    ```


    `<script>` tag is used to link the resource to the HTML page. The attribute of
    script tag will let the browser knows what type of resource it is. `src` attribute
    is similar to `<img>` tag `src` to map the location of the file in the server
    with the path and filename. You can even mention the foldername/file name to refer
    the file path.


    ### Sample Example

    [Download the Example](https://phpbootcampdemo.com/js/external/downloads/js-external-em1.zip)

    There are two files: `index.html`, `javascript/javascriptcode.js`.


    `javascriptcode.js` file is linked inside the `index.html` file with `<script>`
    tag. `javascript` is the folder name it could be any name and not mandatory to
    have that name. `type` attribute tells the type of the content in the file. In
    this case, it is `text/javascript`.


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Page Description">

    <title>External JavaScript</title>

    <script type=''text/javascript'' src="javascript/javascriptcode.js"></script>

    </head>

    <body>

    <h1>External JavaScript!</h1>

    <p>Paragraph Text</p>

    <ul>

    <li>Item 1</li>

    <li>Item 2</li>

    <li>Item 3</li>

    </ul>

    </body>

    </html>

    ```

    FileName: `javascriptcode.js`

    ```javascript

    alert(''I am called from javascriptcode.js file!'');

    ```

