  trans: "\n\n### 练习 1\n练习 1：接受 1 到 10 之间的数字，并使用 `if` 语句检查用户输入的数字是否在要求的 1 到 10 之间。\n\
    \n### 练习 2\n练习 2：要求用户输入年龄，并判断他是儿童、成年人（age > 21）还是老年人（age > 55）。\n\n---\n\n## 4.2\
    \ switch 语句\n\n### switch 语句的使用\n`switch` 语句用于检查一个值，并根据值匹配的结果做出决策。\n\n**语法：**\n\
    ```javascript\nswitch( variable ){\n  case value:\n    //Statement\n    break;\n\
    \  case value:\n    //Statement\n    break;\n  default:\n    //Statement\n   \
    \ break;\n}\n```\n\n**示例 1：**\n```javascript\nswitch ( dayOfWeek ){\n  case ‘Mon’:\n\
    \    alert(“Welcome Monday”);\n    break;\n  case ‘Tuesday’:\n    alert(“Welcome\
    \ Tuesday”);\n    break;\n  default:\n    alert(“Try Again!”);\n    break;\n}\n\
    ```\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"utf-8\">\n<meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta\
    \ name=\"description\" content=\"Page Description\">\n<title>Switch Statements</title>\n\
    <script>\n  var dayOfWeek = prompt(\"Enter the Day of Week\");\n  var result;\n\
    \  dayOfWeek = dayOfWeek.toLowerCase();\n  switch(dayOfWeek){\n    case 'monday':\n\
    \      result = \"First Day of Week\";\n      break;\n    case 'tuesday':\n  \
    \    result = \"Second Days of Week\";\n      break;\n    case 'wednesday':\n\
    \      result = \"Mid Week\";\n      break;\n    case 'thursday':\n      result\
    \ = \"Preparing for Weekend\";\n      break;\n    case 'friday':\n      result\
    \ = \"It's Friday!\";\n      break;\n    case 'saturday':\n      result = \"Enjoying\
    \ Day!\";\n      break;\n    case 'sunday':\n      result = \"Resting Day!\";\n\
    \      break;\n    default:\n      result = \"Cannot find that Value!\";\n  }\n\
    </script>\n</head>\n<body>\n<h1>Switch Statements</h1>\n<script type=\"text/javascript\"\
    >\n  document.write( result );\n</script>\n</body>\n</html>\n```\n\n---\n\n###\
    \ 练习 1\n练习 1：接受 1 到 10 之间的数字，并使用 `Switch` 语句检查用户输入的数字是否在要求的 1 到 10 之间。\n\n###\
    \ 练习 2\n练习 2：要求用户输入年龄，并判断他是儿童、成年人（age > 21）还是老年人（age > 55）。使用 `Switch` 语句。\n\n\
    **提示：**\n```javascript\nswitch(true){\n  case (input > 21):\n    //Statements\n\
    \    break\n}\n```\n\n---\n\n## 4.3 while 语句\n\n### while 循环的使用\n`while` 语句用于循环执行一段代码块，运行直到满足条件为止。不断执行相同的代码块，直到条件被满足。\n\
    \n**语法：**\n```javascript\nwhile( condition ) {\n  //Statement\n}\n```\n\n**示例\
    \ 1：**\n```javascript\nvar counter = 0;\nwhile ( counter <= 10 ){\n  counter++;\n\
    }\n```\n\n**语法：**\n```javascript\ndo{\n  //Statement\n} while ( condition );\n\
    ```\n\n**示例 1：**\n```javascript\nvar counter = 0;\ndo{\n  counter++;\n} while\
    \ ( counter <= 10 );\n```\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"\
    utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n<meta name=\"description\" content=\"Page Description\">\n<title>While Statements</title>\n\
    <script>\n  var counter = 0;\n  while( counter <= 10){\n    console.log(\"While\
    \ Counter: \" + counter++);\n  }\n  counter = 0;\n  do{\n    console.log(\"Do\
    \ Counter: \" + counter++);\n  }while( counter <= 10);\n</script>\n</head>\n<body>\n\
    <h1>While Statements</h1>\n</body>\n</html>\n```\n\n---\n\n### 练习 1\n练习 1：从用户接受两个数字，并打印它们之间的所有数字。最多打印\
    \ 10 个数字。\n\n- `break;` – 是一个关键字，用于在循环中跳出循环。\n- `continue;` – 是一个关键字，用于在循环中通过跳过下面的语句来继续循环。\n\
    \n**提示：**\n```javascript\nif( counter >= 10){\n  break;\n}\n```\n\n### 练习 2\n\
    练习 2：从用户接受两个数字，并只打印它们之间的偶数。最多打印 10 个数字。\n\n---\n\n## 4.4 for 语句\n\n### for 循环的使用\n\
    `for` 循环用于循环执行一段代码块，运行直到满足条件为止。不断执行相同的代码块，直到条件被满足。\n\n**语法：**\n```javascript\n\
    for( counter initialization; condition; increments ) {\n  //Statement\n}\n```\n\
    \n**示例 1：**\n```javascript\nfor(var counter = 0; counter <= 10; counter++){\n\
    \  alert(counter);\n}\n```\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"\
    utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n<meta name=\"description\" content=\"Page Description\">\n<title>For Statements</title>\n\
    <script>\n  for(var counter=0; counter<=10; counter++){\n    console.log(\"For\
    \ Counter: \" + counter);\n  }\n</script>\n</head>\n<body>\n<h1>For Statements</h1>\n\
    </body>\n</html>\n```\n\n"
