    # 关于本书

    `JAVASCRIPT` 是一种客户端编程语言，允许 Web 开发人员创建可以在浏览器中运行的脚本。`JAVASCRIPT` 语言基本上用于在客户端运行程序。本书将帮助你理解
    `JAVASCRIPT` 语言的基础知识，以及如何将其诸诸以构建网站。


    ## 读者群

    本教程旨在满足所有渴望学习 `JAVASCRIPT` 基础知识读者的需求。


    ## 前提条件

    本书假设你没有任何编程方面的知识，并假设你处于初级水平。


