    ### 3.3 Arithmetic Expressions


    Usage of Arithmetic Expressions

    Expressions are evaluated into a result value or final value or single value.
    There are couple of Expressions:


    1. Assignment Expressions

    2. Comparison Expressions

    3. Arithmetic Expressions

    4. Logical Expressions


    We will look at Comparison Expressions in this topic. Expressions uses Operators
    to perform the activity. Arithmetic expression always evaluate into a single value.
    A series of operations that results into a single value.![](rsrc2XB.jpg)`+` is
    the arithmetic operator which adds two values. `message` variable


    Arithmetic Operations:


    * `+` – Addition

    * `-` – Subtraction

    * `*` – Multiple

    * `/` – Division

    * `%` – Modulus

    * `++` – Increment

    * `--` – Decrement


    #### Order of Precedence

    Order of precedence decides which operates evaluates first. From Left to Right,
    these operators has higher priority


    * `++`

    * `--`

    * `* / %`

    * `+ –`


    Increment Example:

    ```javascript

    counter = 10;

    counter++; // This means counter = counter + 1;

    ```


    #### Sample Example

    [Download the Example](https://phpbootcampdemo.com/js/arithmetic/downloads/js-arithmetic-em1.zip)


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Page Description">

    <title>Arithmetic Expressions</title>

    <script>

    var counter = 10;

    console.log(counter);

    counter = counter + 10;

    </script>

    </head>

    <body>

    <h1>Arithmetic Expressions</h1>

    <a href="#" onclick="counter++;console.log(counter);">Increase Counter</a>

    <a href="#" onclick="counter--;console.log(counter);">Decrease Counter</a>

    </body>

    </html>

    ```

