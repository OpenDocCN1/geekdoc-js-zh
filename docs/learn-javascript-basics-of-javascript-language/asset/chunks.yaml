    JavaScript8.1  Access the Browser URLUsage Browser History SnippetThis snippet
    of code will help you to navigate the page front or back based on the page history.You
    can make the page go back and front from the JavaScript.[Download the Snippet](https://phpbootcampdemo.com/js/snippets-js/downloads/js-snippets-js-snippets-em1.zip)<!DOCTYPE
    html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,
    initial-scale=1.0"><meta name="description" content="Page Description"><title>Snippets
    JavaScript</title><script>function goBack(){history.back();}</script></head><body><a
    href="#" onclick="goBack();">Go Back</a> <br><a href="#" onclick="history.forward();">Go
    Forward</a></body></html>[Live Preview](https://phpbootcampdemo.com/js/snippets-js/snippets/em1/after)![](rsrc2ZY.jpg)![](rsrc2ZZ.jpg)9  Projects
    JavaScript9.1  Form ValidationsForm ValidationThis project will show how to validate
    the form using the JavaScript.[Download the Example](https://phpbootcampdemo.com/js/projects-js/forms/downloads/js-projects-js-forms-em1.zip)<!DOCTYPE
    html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,
    initial-scale=1.0"><meta name="description" content="Page Description"><title>Form
    Validations JavaScript</title><script>function checkFormData(){var message = "";//Access
    the TextBoxvar tname = document.getElementById("txt_name").value;var temail =
    document.getElementById("txt_email").value;var tage = document.getElementById("txt_age").value;//Access
    the Radio Buttonvar tgender1 = document.getElementById("radio1").checked;var tgender2
    = document.getElementById("radio2").checked;//Access the Checkboxvar tchkbox =
    document.getElementById("chkbox").checked;message = "Name: " + tname + "<br>";message
    += "Email: " + temail + "<br>";message += "Age: " + tage + "<br>";message += "Male:
    " + tgender1 + "<br>";message += "Female: " + tgender2 + "<br>";message += "Agreed:
    " + tchkbox + "<br>";document.getElementById("tmessage").innerHTML = message;}</script></head><body><p
    id="tmessage"></p><h1>Form Validations</h1><form action="https://wpfreelancer.com/"
    method="get">Your Name: <input type="text" name="tname" id="txt_name" /> <br><br>Your
    Email: <input type="text" name="temail" id="txt_email" /> <br><br>Your Age: <input
    type="text" name="tage" id="txt_age" /> <br><br>Male <input id ="radio1" name="gender"
    type="radio" checked>Female <input id ="radio2" name="gender" type="radio"> <br><br><input
    type="checkbox" id="chkbox" /> Agree to our Terms <br> <br><input type="button"
    name="submit" value="Submit"onclick="checkFormData();" /></form></body></html>


