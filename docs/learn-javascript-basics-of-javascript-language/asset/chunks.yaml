    ## 2.5 Expressions in JavaScript


    ### 3.1 Assignment Expressions


    Usage of Assignment Expressions

    Expressions are evaluated into a result value or final value or single value.
    There are couple of Expressions:


    1. Assignment Expressions

    2. Comparison Expressions

    3. Arithmetic Expressions

    4. Logical Expressions


    We will look at Assignment Expressions in this topic. Expressions uses Operators
    to perform the activity.==` is the assignment operator which assigns the value
    to the variable. `message = “something”;` is a assignment expression that assign
    value to the `message` variable.


    #### Compound Assignment Operators

    Compound assignment operators helps to do more than one operators job. It combines
    two operators together to perform an action. Compound Assignment Operators are:


    * `+=`

    * `-=`

    * `*=`


    ```javascript

    counter += 1;

    counter = counter + 1;

    counter -= 1;

    counter = counter – 1;

    counter *= 1;

    counter = counter * 1;

    ```


    #### Sample Example

    [Download the Example](https://phpbootcampdemo.com/js/assignments/downloads/js-assignments-em1.zip)


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Page Description">

    <title>Assignment Expressions</title>

    <script>var counter = 10;</script>

    </head>

    <body>

    <h1>Assignment Expressions</h1>

    <a href="#" onclick="counter+=1;console.log(counter);">Increase Counter</a>

    <a href="#" onclick="counter-=1;console.log(counter);">Decrease Counter</a>

    <a href="#" onclick="counter*=2;console.log(counter);">Multiple Counter</a>

    </body>

    </html>

    ```


