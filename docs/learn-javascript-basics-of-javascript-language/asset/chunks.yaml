    ### 3.2 比较表达式


    比较表达式的使用

    表达式被求得为一个结果值、最终值或单值。有几种表达式：


    1. 赋值表达式

    2. 比较表达式

    3. 算术表达式

    4. 逻辑表达式


    我们将在本主题中介绍比较表达式。表达式使用运算符来执行操作。比较表达式始终求得真或假值![](img/rsrc2X3.jpg)`>` 是比较运算符，用于比较两个值。`message`
    变量将获得真或假值。


    比较操作：


    * `<` – 小于

    * `>` – 大于

    * `==` – 等于

    * `===` – 值相等且数据类型相等

    * `!==` – 值不相等且数据类型相等

    * `!=` – 不相等

    * `>=` – 大于或等于

    * `<=` – 小于或等于


    #### 条件运算符（三元运算符）

    JavaScript 还包含一种条件运算符，根据某些条件给变量赋值。

    `variablename = (condition) ? value1:value2`


    `counter = (10<=10) ? 10 : 0;`


