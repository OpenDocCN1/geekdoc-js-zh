    6.2  Common ErrorsCommon JavaScript ErrorsThese are the most common JavaScript
    errors that you might make while writing the JavaScript.Forgetting the Semicolors
    ‘;’ at the last.JavaScript is Case Sensitive. So make sure the names matches as
    it is described.Difference between Assignment and Comparison Operator.Example://Using
    Assignment Operator instead of Comparison Operator.


    if( a = b ){


    // Statement


    }Comparing Number with String.Forgetting the ‘+ ‘ sign in the string.Example:
     “This is a sample ” + message + ” Program” + message1 ” to do it!”;Forgetting
    the Single Quotes Opening and Closing.Example:  ‘This is a sample ‘ + message
    + ‘ Program’s ‘ + message1 + ‘ to do it!’;Missing Parenthesis in If StatementsExample://Missing
    Parenthesis


    if ( x > y) && (y > 100) {}Using Wrong Keywords Case.Example:Funtion add(){


    }Using Keywords as Variable name.Example://Keywords as Variable


    var name = “hello”;Forget to close the parenthesisExample:function add(){


    }var total = add;Accessing the Wrong Array Index.Example:var myArray = new Array();


    myArray[0] = “hello”;


    alert( myArray[1] );6.3  Try Catch BlockUsage of Try Catch BlocksExceptions in
    programming are referred as Runtime Errors.When Runtime Errors happens there is
    a way to catch those errors and pass it to the application and make a clean exit
    from the program.This is called as Exception Handling.The process of making sure
    the code will not break and if it does it know the reason for it and make a clean
    exit.To handle Runtime errors in the JavaScript we have try-catch blocks. Using
    this we can catch the errors and decide what to do next.SYNTAX:try{//Statements}catch(errorName)
    {//Statments}Example:try {var firstName = “”;if( firstName == “” ) throw “Name
    is empty”;}catch (error){alert(error);}finally {alert(“Thanks for playing!”);}try
    {} block will have all the statementsthrow is a keyword to throw an error from
    the program. Once the program throw an error it will stop processing the next
    steps. It will jump to catch {} block.catch {} block will be executed once the
    throw is called. The program will execute out from the catch block safely.finally{}
    block will execute every time irrespective of error or not. It is good place to
    close all open connections. Handle clean exit.![](rsrc2ZD.jpg)[Download the Example](https://phpbootcampdemo.com/js/testing-js/trycatch/downloads/js-testing-js-trycatch-em1.zip)<!DOCTYPE
    html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,
    initial-scale=1.0"><meta name="description" content="Page Description"><title>Try
    Catch JavaScript</title><script>try{var input1 = prompt("Enter some Number");//Throw
    an error when input is emptyif( input1 == "") throw "No value mentioned";//If
    the above code is error then this is not executedalert("Input is correct!");}catch(error){//Catch
    the erroralert(error);}finally{//This will execute every time with or without
    erroralert("Have a good Day!");}</script></head><body><h1>Heading</h1><p>Paragraph
    Text</p><ul><li>Item 1</li><li>Item 2</li><li>Item 3</li></ul></body></html>


