    \n## Exercise 1\nAccept two number from users and add those two numbers using\
    \ functions. Create Objects and Add and Subtract.\n\n![](rsrc2YX.jpg)[Live Preview](https://phpbootcampdemo.com/js/foe-js/objects/ex1/after)Exercise\
    \ 2[Download the Exercise 2](https://phpbootcampdemo.com/js/foe-js/objects/downloads/js-foe-js-objects-ex2.zip)\n\
    \n## Exercise 2\nAccept two number from user and print EVEN numbers only between\
