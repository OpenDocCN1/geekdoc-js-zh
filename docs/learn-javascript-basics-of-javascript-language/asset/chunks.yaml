    \ it.\n\n![](rsrc2YY.jpg)[Live Preview](https://phpbootcampdemo.com/js/foe-js/functions/ex2/after)\n\
    \n## 5.2 Objects\n### Usage of Objects\nObject groups variables and functions\
    \ together. Variables in objects are called as Properties. function in Objects\
    \ are called as Methods.\n\nIf `Hotel` is an Object then `numberOfRoom` is a Property\
    \ and `checkAvailability()` is a function.\n\n#### Object Literal:\n```javascript\n\
    var hotel = {\n  numberOfRooms: 10,\n  bookedRooms: 5,\n  checkAvailability():\
    \ function(){\n    return numberOfRooms – bookedRooms;\n  }\n};\nvar hotelTotalRooms\
    \ = hotel.numberOfRooms;\n// or\nvar hotelTotalRooms = hotel['numberOfRooms'];\n\
    var roomsFree = hotel.checkAvailability();\n```\n\n#### Creating an Object:\n\
    ```javascript\nvar hotel = new Object();\nhotel.numberOfRooms = 10;\nhotel.bookedRooms\
    \ = 5;\nhotel.checkAvailability = function(){\n  return this.numberOfRooms – this.bookedRooms\n\
    }\n```\n\n#### Object Function Notation:\n### Creating Object as a Function\n\
    ```javascript\nfunction hotel(totalRooms, roomLeft){\n  this.numberOfRooms = totalRooms;\n\
    \  this.bookedRooms = roomLeft;\n  this.checkAvailability = function(){\n    return\
    \ this.numberOfRooms – this.bookedRooms;\n  }\n}\nvar h1 = new hotel(10, 5);\n\
    var h2 = new hotel(10, 4);\n```\n[Download the Example](https://phpbootcampdemo.com/js/foe-js/objects/downloads/js-foe-js-objects-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
