    # 3.4 逻辑表达式


    ### 逻辑表达式的使用

    表达式会被求值为结果值、最终值或单一值。

    有以下几种表达式：


    1. 赋值表达式

    2. 比较表达式

    3. 算术表达式

    4. 逻辑表达式


    我们将在本主题介绍逻辑表达式。表达式使用运算符来执行操作。逻辑运算符用于根据多个条件检查条件是否为真或假。![](img/rsrc2XG.jpg)`&&`
    是逻辑运算符，它检查左侧和右侧的值并判断条件为真为假。


    * `(5 > 3)` – true

    * `(8 < 5)` – false

    * `true && false = false`


    变量 `result` 将具有布尔值 false。


    #### 逻辑运算：

    * `&&` – 与 (AND)

    * `||` – 或 (OR)

    * `!` – 非 (NOT)


    ### 优先级

    优先级决定了哪个操作先求值。

    * `NOT`

    * `AND`

    * `OR`


    ### 示例

    [下载示例](https://phpbootcampdemo.com/js/logical/downloads/js-logical-em1.zip)


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Page Description">

    <title>Arithmetic Expressions</title>

    <script>

    var input1 = prompt("Enter First Value: ");

    var input2 = prompt("Enter Second Value: ");

    var result = (input1 < input2) || (input1 == input2)

    </script>

    </head>

    <body>

    <h1>Arithmetic Expressions</h1>

    <script type="text/javascript">

    document.write(input1 + " <= " + input2 + " is "+ result);

    </script>

    </body>

    </html>

    ```


