    ### 3.2 Comparison Expressions


    Usage of Comparison Expressions

    Expressions are evaluated into a result value or final value or single value.
    There are couple of Expressions:


    1. Assignment Expressions

    2. Comparison Expressions

    3. Arithmetic Expressions

    4. Logical Expressions


    We will look at Comparison Expressions in this topic. Expressions uses Operators
    to perform the activity. Comparison expression always evaluate into a true or
    false value.![](rsrc2X3.jpg)`>` is the comparison operator which compares the
    two values. `message` variable will be have a true or false.


    Comparison Operations:


    * `<` – Less than

    * `>` – Greater than

    * `==` – Equal to

    * `===` – Equal value and Equal Data Type

    * `!==` – Not Equal Value and Equal Data Type

    * `!=` – Not Equal

    * `>=` – Greater than or Equal to

    * `<=` – Less than or Equal to


    #### Conditional (Ternary) Operator

    JavaScript also contains a conditional operator that assigns a value to a variable
    based on some condition.

    `variablename = (condition) ? value1:value2`


    `counter = (10<=10) ? 10 : 0;`


    #### Sample Example

    [Download the Example](https://phpbootcampdemo.com/js/comparison/downloads/js-comparison-em1.zip)


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Page Description">

    <title>Comparison Expressions</title>

    <script>

    var counter = 10 <= 10;//Conditional (Ternary) Operator

    var resultValue = (counter) ? 10:0;

    </script>

    </head>

    <body>

    <h1>Comparison Expressions</h1>

    <script type="text/javascript">

    document.write("Compared: " + counter);

    document.write("Result: " + resultValue);

    </script>

    </body>

    </html>

    ```


