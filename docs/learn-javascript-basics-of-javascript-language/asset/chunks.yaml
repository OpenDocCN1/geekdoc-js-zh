    # 3.7 布尔值


    ### 布尔的使用

    布尔变量有助于根据表达式做出决策或存储决策。布尔值可以是 true 或 false。

    你可以使用布尔变量作为条件来检查值是否真为假。


    `var result = 2 > 1;`

    `var message = (result) ? “CORRECT”: “WRONG”;`


