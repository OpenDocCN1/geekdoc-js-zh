    # 3.4 Logical Expressions


    ### Usage of Logical Expressions

    Expressions are evaluated into a result value or final value or single value.

    There are couple of Expressions:


    1. Assignment Expressions

    2. Comparison Expressions

    3. Arithmetic Expressions

    4. Logical Expressions


    We will look at Logical Expressions in this topic. Expressions uses Operators
    to perform the activity. Logical Operators are used to check the if the condition
    is true or false based on many conditions.![](rsrc2XG.jpg)`&&` is the logical
    operator which checks left side and right side value and decides if the condition
    is true or false.


    * `(5 > 3)` – true

    * `(8 < 5)` – false

    * `true && false = false`


    result variable will have false boolean value.


    #### Logical Operations:

    * `&&` – AND

    * `||` – OR

    * `!` – NOT


    ### Order of Precedence

    Order of precedence decides which operates evaluates first.

    * `NOT`

    * `AND`

    * `OR`


    ### Sample Example

    [Download the Example](https://phpbootcampdemo.com/js/logical/downloads/js-logical-em1.zip)


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Page Description">

    <title>Arithmetic Expressions</title>

    <script>

    var input1 = prompt("Enter First Value: ");

    var input2 = prompt("Enter Second Value: ");

    var result = (input1 < input2) || (input1 == input2)

    </script>

    </head>

    <body>

    <h1>Arithmetic Expressions</h1>

    <script type="text/javascript">

    document.write(input1 + " <= " + input2 + " is "+ result);

    </script>

    </body>

    </html>

    ```


