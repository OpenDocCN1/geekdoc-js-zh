    `alert` is a function to show alert box on the web page. `alert(''some text here'');`
    Add semicolon `;` at the end of the line.


    `<style>` tag is used to write the JavaScript inside this tag. This tag `<style>`
    can be defined in `<head>` or `<body>`. JavaScript code written inside the `<style>`
    tag are executed as it is written.


    If you have two `<script>` tag one after the other then code inside the `<script>`
    executes one after the other. If you put the `<script>` tag at the end of the
    `<body>` tag then the script is executed at the last after the page is loaded.


    ### Sample Example

    [Download the Example](https://phpbootcampdemo.com/js/internal/downloads/js-internal-em1.zip)


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Page Description">

    <title>Internal JavaScript</title>

    <script>alert(''This is called from Head Section!'');</script>

    </head>

    <body>

    <h1>Heading</h1>

    <p>Paragraph Text</p>

    <ul>

    <li>Item 1</li>

    <li>Item 2</li>

    <li>Item 3</li>

    </ul>

    </body>

    </html>

    ```


