    # 3.7 Boolean


    ### Usage of Boolean

    Boolean Variables helps to make decisions or store a decision based on an expression.
    Boolean values can be true or false.

    You can use boolean variable as a condition to check if the value is true or false.


    `var result = 2 > 1;`

    `var message = (result) ? “CORRECT”: “WRONG”;`


    ### Example:

    `var isTrue= “Henry” == “H3nry”;`

    Based on the conditional operator, the output can be stored in the boolean primitive
    data type. `isTrue` will hold false value. [Download the Example](https://phpbootcampdemo.com/js/boolean/downloads/js-boolean-em1.zip)


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Page Description">

    <title>Boolean Expressions</title>

    <script>

    var result = 2 > 1;

    var message = (result) ? "CORRECT": "WRONG";

    </script>

    </head>

    <body>

    <h1>Boolean Expression</h1>

    <script type="text/javascript">

    document.write(message);

    </script>

    </body>

