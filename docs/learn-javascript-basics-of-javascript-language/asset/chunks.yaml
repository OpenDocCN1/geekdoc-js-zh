    \n![](rsrc2YY.jpg)[Live Preview](https://phpbootcampdemo.com/js/foe-js/objects/ex2/after)\n\
    \n## 5.3 Events\n### Usage of Events\nEvents are actions that user performs on\
    \ the browsers. Functions that handle the events are called as Event Handlers.\
    \ Common Events with the:\n\n- `onClick`\n- `ondblClick`\n- `onmouseover`\n- `onmouseup`\n\
    - `onmouseout`\n\nExample: `<a href=\"#\" onmouseover=\"alert('hello')\">Mouse\
    \ Over</a>`\n\n* * *\n\n![](rsrc2Z4.jpg)[Live Preview](https://phpbootcampdemo.com/js/foe-js/events/em1/after)Exercise\
