    ## 2.3 Primitives


    ### Usage of Primitive Data Types

    Primitive data types means the basics data types that can be used in JavaScript
    programs. There are 3 Primitive Types:


    1. Number Data Type

    2. String Data Type

    3. Boolean Data Type


    Number Data Type is used to store whole, negative and decimal numbers. String
    Data Type is used to store character data. Boolean Data Type is used to store
    true and false values.


    #### Numeric Data:

    ```javascript

    var count = 1;

    ```

    #### String Data:

    // Use Single Quote or Double Quotes

    ```javascript

    var fullName = “WPFreelancer”;

    var lastName = ‘WPFreelancer’;

    ```

    #### Boolean Data:

    ```javascript

    var flag = true;

    var results = false;

    ```


    #### Sample Example

    [Download the Example](https://phpbootcampdemo.com/js/primitives/downloads/js-primitives-em1.zip)

    ```html

    <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,
    initial-scale=1.0"><meta name="description" content="Page Description"><title>Primitive</title><script>

    //Numeric Data Type

    var counter = 0;

    counter = counter + 100;

    console.log("Counter : " + counter);

    var decimalcount = 1.45;

    decimalcount = decimalcount + 74.32;

    console.log("Decimals : " + decimalcount);

    //String Data

    var fullName = "WPFreelancer";

    fullName = fullName + ''.com'';

    console.log("Website Name: " + fullName);

    //Boolean Data

    var flag = true;

    console.log("Flag Value: " + flag);

    </script></head><h1>Check the Console Log</h1></body></html>

    ```


