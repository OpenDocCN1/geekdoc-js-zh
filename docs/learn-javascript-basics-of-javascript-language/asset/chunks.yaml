    ## 2.2 变量


    ### 变量的使用

    变量用于存储程序内部使用的信息。


    ![](img/rsrc2WG.jpg) `var` 关键字用于定义变量。`var message = “This is a test message”;`
    `=` 是赋值运算符，用于给变量赋值。`“”` 双引号用于表示字符串值；`;` 分号用于结束结束赋值语句。


    #### 语法


    #### 声明变量

    ```javascript

    var variableName;

    ```

    #### 使用空字符串初始化变量

    ```javascript

    variableName = "";

    ```

    #### 给变量赋值

    ```javascript

    variableName = “This is a Test Message!”;

    ```

    #### 多变量声明

    ```javascript

    var name1, name2, name3;

    nam1 = “firstName”, name2 = “middleName”, name3 =”lastName”

    ```

    #### 定义整数和小数

    ```javascript

    var counter = 0;

    counter = 10;

    var total = 10.98;

    counter = total;

    ```


    #### 在 alert 消息中显示变量：

    ```javascript

    var firstName = “WPFreelancer.com”;

    alert(‘Welcome to ” + firstName );

    ```

    `+` 符号用于将变量附加到字符串并显示。


    #### 在 HTML 文档中写入变量

    `document.write()` 方法可用于在 HTML 页面上写入任何内容。`alert` 用于显示提示类似，`document.write()` 方法用于在
    HTML 页面上写入内容。它也可以访问在 head -> script 部分定义的变量。

    ```html

    <script type=”text/javascript">

    document.write(“Your Message” + message + “<br>”);

    </script>

    ```


    #### 示例

    [下载示例](https://phpbootcampdemo.com/js/variables/downloads/js-variables-em1.zip)

    ```html

    <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,
    initial-scale=1.0"><meta name="description" content="Page Description"><title>Variables</title><script>

    // 声明变量

    var message;

    // 使用空字符串初始化变量

    message = "";

    // 给变量赋值

    message = "2 to Variables";

    // 显示变量

    alert(message);

    // 变量赋值

    message = "3 to Variables";

    // 显示变量

    alert(message);

    // 变量赋值

    var counter = 0;

    // 变量赋值

    counter = 100;

    // 显示变量

    alert(counter);

    // 变量赋值

    counter = "2 to Variables";

    // 显示变量

    alert(counter);

    // 变量赋值

    counter = "3 to Variables";

    // 显示变量

    alert(counter);

    // 变量赋值

    var firstName = "WPFreelancer.com";

    // 在 alert 消息中显示变量

    alert(''Welcome to ” + firstName );

    // 变量赋值

    message = "2 to Variables";

    // 显示变量

    alert(message);

    // 变量赋值

    message = "3 to Variables";

    // 显示变量

    alert(message);

    // 在 HTML 文档中写入变量

    document.write(“Your Message” + message + “<br>”);

    // 变量赋值

    message = "2 to Variables";

    // 显示变量

    alert(message);

    // 变量赋值

    message = "3 to Variables";

    // 显示变量

    alert(message);

    // 在 HTML 文档中写入变量

    document.write(“Your Message” + message + “<br>”);

    </script></head><body><h1>Variables</h1></body></html>

    ```


