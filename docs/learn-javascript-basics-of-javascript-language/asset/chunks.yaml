    # 2 Working with Data


    ## 2.1 Identifiers


    ### Usage of Identifiers

    Identifiers are the name that we give to variables, functions, objects, properties
    and events. There are some rules that you need follow to define the Identifiers.


    * Identifiers can contain only letters, numbers, underscore and dollar sign

    * Identifiers cannot start with a number.

    * Identifiers are case sensitive

    * Identifiers can be any length.

    * Identifiers cannot use keywords and reserved words.


    #### Some of the Valid Identifiers:

    * `strFirstName`

    * `$var`

    * `index_1`

    * `crashReport`


    #### InValid Identifiers:

    * `1PhoneNumber`

    * `false`

    * `long`

    * `package`


    #### Sample Example

    [Download the Example](https://phpbootcampdemo.com/js/identifiers/downloads/js-identifiers-em1.zip)

    ```html

    <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,
    initial-scale=1.0"><meta name="description" content="Page Description"><title>Identifiers
    JavaScript</title><script>Alert(''JavaScript is Case Sensitive'');</script></head><body><a
    href="#" onclick="ALERT(''Welcome to JavaScript!'');">Click Me</a></body></html>

    ```


