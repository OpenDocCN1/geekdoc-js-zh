    \n# 5 Function, Objects and Events\n\n## 5.1 Functions\n### Usage of Functions\n\
    Functions is a block of statements that performs an action. You can pass parameters\
    \ to functions and it can return a value from the function using `return` keyword.\n\
    \n#### Syntax of Function Declaration:\n```javascript\nfunction nameOfFunction(Parameters){\n\
    \  return someValue;\n}\n```\n#### Example 1:\n```javascript\nfunction area(width,\
    \ height){\n  return width * height;\n}\nvar size = area(10, 20);\n```\n\n####\
    \ Syntax of Function Expression:\n```javascript\nvar nameOfFunction = function(Parameters){\n\
    \  return someValue;\n}\n```\n#### Example 1:\n```javascript\nvar area = function(width,\
    \ height){\n  return width * height;\n}\nvar size = area(10, 20);\n```\n\n####\
    \ Example of Immediately Invoked Functions:\n```javascript\nvar size = ( function(){\n\
    \  var width = 10;\n  var height = 20;\n  return width * height;\n}() );\n```\n\
    [Download the Example](https://phpbootcampdemo.com/js/foe-js/functions/downloads/js-foe-js-functions-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta\
    \ name=\"description\" content=\"Page Description\">\n  <title>Functions</title>\n\
    \  <script>\n    function sum(a, b){\n      return a + b;\n    }\n    var size\
    \ = function(width, height){\n      return width * height;\n    }\n  </script>\n\
    </head>\n<body>\n  <h1>Functions</h1>\n  <a href=\"#\" onclick=\"alert( sum(2,5)\
    \ );\">Add 2 + 5</a>\n  <br>\n  <a href=\"#\" onclick=\"alert( size(10,20) );\"\
    >Area of 10 * 20</a>\n</body>\n</html>\n```\n\n* * *\n\n![](rsrc2YW.jpg)[Live\
    \ Preview](https://phpbootcampdemo.com/js/foe-js/functions/em1/after)Exercise\
