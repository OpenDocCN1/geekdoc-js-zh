  trans: "\n\n<input type=\"text\" name=\"txtName\" />\n\n## 7.2 更新数据\n\n`innerHTML`\
    \ 属性可以更新任何元素的数据。向此属性添加数据将修改 DOM 元素，更改将立即反映在页面上。\n\n示例：`document.getElementById(id).innerHTML\
    \ = \"This is a added element\";`\n\n[下载示例](https://phpbootcampdemo.com/js/dom-js/updatedid/downloads/js-dom-js-updatedid-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta\
    \ name=\"description\" content=\"Page Description\">\n  <title>Inline JavaScript</title>\n\
    \  <script>\n    function update(){\n      document.getElementById(\"txtValue\"\
    ).innerHTML = document.getElementById(\"txtName\").value;\n    }\n  </script>\n\
    </head>\n<body>\n  <h1>Update the DOM Elements</h1>\n  <p id=\"txtValue\"></p>\n\
    \  <form>\n    <input type=\"text\" id=\"txtName\" onkeypress=\"update();\"/>\n\
    \  </form>\n</body>\n</html>\n```\n\n---\n\n### 练习 1\n创建两个文本框，如果用户在一个文本框中输入数据，则在另一个文本框中显示该文本。\n\
    \n提示：`document.getElementsByName(\"txtName\")[1].value = document.getElementsByName(\"\
    txtName\")[0].value;`\n\n### 练习 2\n显示一个按钮，当用户按下时，要求他们输入标题，然后用新值更改标题。\n\n[实时预览](https://phpbootcampdemo.com/js/dom-js/updatedid/ex2/after)\n\
    \n---\n\n## 7.3 访问表单元素\n\n你可以使用 DOM 访问所有的表单元素。当你需要在将数据发送到服务器保存之前检查用户输入了什么时，这非常有帮助。这被称为`客户端验证`。\n\
    \n[下载示例](https://phpbootcampdemo.com/js/dom-js/forms/downloads/js-dom-js-forms-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta\
    \ name=\"description\" content=\"Page Description\">\n  <title>Inline JavaScript</title>\n\
    \  <script>\n    function checkFormData(){\n      // 查询所有标签名为为 input 的元素\n   \
    \   var inputs = document.getElementsByTagName(\"input\");\n      var message\
    \ = \"Form Elements\\n\\n\";\n      for (var i=0; i < inputs.length; i++){\n \
    \       if (inputs[i].getAttribute('type') == 'text'){\n          message += inputs[i].getAttribute('name')\
    \ + \": \";\n          message += inputs[i].value + \"\\n\";\n        }\n    \
    \  }\n      alert(message);\n    }\n  </script>\n</head>\n<body>\n  <form name=\"\
    user\" id=\"userfrm\" action=\"#\">\n    Your Name: <input type=\"text\" name=\"\
    name\" id=\"txt_name\" />\n    Your Email: <input type=\"text\" name=\"email\"\
    \ id=\"txt_email\" />\n    <input type=\"button\" name=\"submit\" value=\"Submit\"\
    \ onclick=\"checkFormData(); />\n  </form>\n</body>\n</html>\n```\n\n---\n\n###\
    \ 练习 1\n使用 JavaScript 读取表单上被选中的复选框\n\n提示：`<input type=\"checkbox\" id=\"chkbox\"\
    \ onclick=\"showFormData()>` `document.getElementById(\"chkbox\").checked`\n\n\
    ### 练习 2\n在表单提交时调用 JavaScript 函数。\n\n提示：\n```html\n<form name=\"search\" onsubmit=\"\
    return callFunction()\" >\n```\n\n---\n\n## 8 JavaScript 代码片段\n\n### 8.1 访问浏览器\
    \ URL\n\n这段代码片段将帮助你根据页面历史记录向前或向后导航。你可以通过 JavaScript 让页面后退或前进。\n\n[下载代码片段](https://phpbootcampdemo.com/js/snippets-js/downloads/js-snippets-js-snippets-em1)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta\
    \ name=\"description\" content=\"Page Description\">\n  <title>Snippets JavaScript</title>\n\
    \  <script>\n    function goBack(){\n      history.back();\n    }\n  </script>\n\
    </head>\n<body>\n  <a href=\"#\" onclick=\"goBack()\">Go Back</a>\n  <br>\n  <a\
    \ href=\"#\" onclick=\"history.forward()\">Go Forward</a>\n</body>\n</html>\n\
    ```\n\n## 9 项目\n\n### 9.1 表单验证\n\n此项目将展示如何使用 JavaScript 验证表单。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n  <meta name=\"description\"\
    \ content=\"Page Description\">\n  <title>Form Validations</title>\n  <script>\n\
    \    function checkFormData(){\n      var message = \"\";\n      // 访问文本框\n  \
    \    var tname = document.getElementById(\"name\").value;\n      // 访问邮箱\n   \
    \   var temail = document.getElementById(\"email\").value;\n      // 访问年龄\n  \
    \    var tage = document.getElementById(\"age\").value;\n      // 访问单选按钮\n   \
    \   var tgender1 = document.getElementById(\"radio1\").checked;\n      // 访问单选按钮\n\
    \      var tgender2 = document.getElementById(\"radio2\").checked;\n      // 访问复选框\n\
    \      var tchkbox = document.getElementById(\"chkbox\").checked;\n      message\
    \ = \"Name: \" + tname + \"<br>\";\n      message += \"Email: \" + temail + \"\
    <br>\";\n      message += \"Age: \" + tage + \"<br>\";\n      message += \"Male:\
    \ \" + tgender1 + \"<br>\";\n      message += \"Female: \" + tgender2 + \"<br>\"\
    ;\n      message += \"Agreed: \" + tchkbox + \"<br>\";\n      document.getElementById(\"\
    tmessage\").innerHTML = message;\n    }\n  </script>\n</head>\n<body>\n  <p id=\"\
    tmessage\"></p>\n  <h1>Form Validations</h1>\n  <form action=\"https://freelancer.com/\"\
    \ method=\"get\">\n    Your Name: <input type=\"text\" name=\"name\" id=\"txt_name\"\
    \ /> <br><br>\n    Your Email: <input type=\"text\" name=\"email\" id=\"txt_email\"\
    \ /> <br><br>\n    Your Age: <input type=\"text\" name=\"age\" id=\"txt_age\"\
    \ /> <br><br>\n    Male <input type=\"radio\" name=\"gender\" id=\"radio1\" checked>\
    \ <br>\n    Female <input type=\"radio\" name=\"gender\" id=\"radio2\"> <br><br>\n\
    \    <input type=\"checkbox\" id=\"chkbox\" /> Agree to Terms <br><br>\n    <input\
    \ type=\"button\" name=\"submit\" value=\"Submit\" onclick=\"checkFormData();\
    \ />\n  </form>\n</body>\n</html>\n```\n\n### 9.2 猜数字\n\n此项目将要求用户猜 1 到 10 之间的正确数字。它会一直询问直到用户猜中。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta\
    \ name=\"description\" content=\"Page Description\">\n  <title>Guess The Number</title>\n\
    \  <script>\n    var message = \"\";\n    var answer = 5;\n    do{\n      var\
    \ input1 = prompt(\"Guess the Number Between 1 to 10!\");\n      input1 = parseInt(input1);\n\
    \      if( input1 != answer ){\n        alert(\"Nope - Wrong.\");\n      }\n \
    \   }while(answer != input1);\n    message = \"You Guessed it Right - \" + answer\
    \ + \" is the answer!\";\n  </script>\n</head>\n<body>\n  <h1>Guess the Number</h1>\n\
    \  <script type=\"text/javascript\">\n    document.write(message);\n  </script>\n\
    </body>\n</html>\n```\n\n"
