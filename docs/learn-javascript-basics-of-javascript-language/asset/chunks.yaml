    # 2 数据处理


    ## 2.1 标识符


    ### 标识符的使用

    标识符是带赋予变量、函数、对象、属性和事件的名称。定义标识符时需要遵循一些规则。


    * 标识符只能包含字母、数字、下划线和美元符号 $

    * 标识符不能以数字开头。

    * 标识符是区分大小写的。

    * 标识符可以是任意长度。

    * 标识符不能使用关键字和保留字。


    #### 一些有效的标识符：

    * `strFirstName`

    * `$var`

    * `index_1`

    * `crashReport`


    #### 无效的标识符：

    * `1PhoneNumber`

    * `false`

    * `long`

    * `package`


    #### 示例代码

    [下载示例](https://phpbootcampdemo.com/js/identifiers/downloads/js-identifiers-em1.zip)

    ```html

    <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,
    initial-scale=1.0"><meta name="description" content="Page Description"><title>Identifiers
    JavaScript</title><script>Alert(''JavaScript is Case Sensitive'');</script></head><body><a
    href="#" onclick="ALERT(''Welcome to JavaScript!'');">Click Me</a></body></html>

    ```


