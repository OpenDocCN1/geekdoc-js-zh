    the text in other text box.Tip:document.getElementsByName(“txtName”)[1].value
    = document.getElementsByName(“txtName”)[0].value;![](rsrc2ZR.jpg)Exercise 2[Download
    the Exercise 2](https://phpbootcampdemo.com/js/dom-js/updatedid/downloads/js-dom-js-updatedid-ex2.zip)Exercise
    2:  Show a button and when user press ask them to type heading then change the
    heading with the new value.![](rsrc2ZS.jpg)[Live Preview](https://phpbootcampdemo.com/js/dom-js/updatedid/ex2/after)7.3  Access
    Form ElementsAccess the Form ElementsYou can access all the form elements using
    the DOM.This is very helpful when you want to check what user has entered the
    data before sending the data to server to save it.It is called as Client Side
    Validation.[Download the Example](https://phpbootcampdemo.com/js/dom-js/forms/downloads/js-dom-js-forms-em1.zip)<!DOCTYPE
    html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,
    initial-scale=1.0"><meta name="description" content="Page Description"><title>Inline
    JavaScript</title><script>function checkFormData(){//Query all elements that tag
    name as inputvar inputs = document.getElementsByTagName("input");var message =
    "Form Elements\n\n";for (var i=0; i < inputs.length; i++){if (inputs[i].getAttribute(''type'')
    == ''text''){message += inputs[i].getAttribute(''name'') + ": ";message += inputs[i].value
    + "\n";}}alert(message);}</script></head><body><form name="user" id="userfrm"
    action="#">Your Name: <input type="text" name="name" id="txt_name" />Your Email:
    <input type="text" name="email" id="txt_email" /><input type="button" name="submit"
    value="Submit"onclick="checkFormData();" /></form></body></html>


    * * *


    ![](rsrc2ZT.jpg)[Live Preview](https://phpbootcampdemo.com/js/dom-js/forms/em1/after)Exercise
    1[Download the Exercise 1](https://phpbootcampdemo.com/js/dom-js/forms/downloads/js-dom-js-forms-ex1.zip)Exercise
    1:  Read the Checkbox checked on the form using JavaScript.![](rsrc2ZU.jpg)Tip:<input
    type=”checkbox” id=”chkbox” onclick=”showFormData()”>document.getElementById(“chkbox”).checkedExercise
    2[Download the Exercise 2](https://phpbootcampdemo.com/js/dom-js/forms/downloads/js-dom-js-forms-ex2.zip)Exercise
