    ## 2.3 基本类型


    #### 基本类型的使用

    基本类型是指在 JavaScript 程序中使用的基础数据类型。有 3 种基本类型：


    1. 数字类型

    2. 字符串类型

    3. 布尔类型


    数字类型用于存储整数和小数。字符串类型用于存储字符数据。布尔类型用于存储 true 和 false 值。


    #### 数字类型：

    ```javascript

    var count = 1;

    ```

    #### 字符串类型：

    // 使用单引号或双引号

    ```javascript

    var fullName = “WPFreelancer”;

    var lastName = ‘WPFreelancer’;

    ```

    #### 布尔类型：

    ```javascript

    var flag = true;

    var results = false;

    ```


