    # 1.3 Comments JavaScript


    ## Usage of Comments

    You can use the special notation to comment the code inside the JavaScript. Comments
    helps to document about the code with a single or multiple line. Comments are
    ignored by the JavaScript Engine and it is not displayed on the browser.


    HTML comments and JavasScript comments are not same. Don’t get confused with the
    comments in JavaScript vs comments in HTML.


    There are two types of Comments in JavaScript:

    - **Single Line Comments**: `//` – This is Single Line Comments. Use to comment
    one line.

    - **Multi Line Comments**: `/*` – is used to indicate the comments are starting
    / `*/` – is used to indicate the comments are ended. Anything between `/*` and
    `*/` will not be executed by the browser.


    ### SYNTAX

    ```html

    <head>

    <script>

    // This will alert the user – Single Line Comments

    alert(''This is alerted on the browser'');

    /* Starting of the Multi Line Comment

    alert(''This is not executed by the browser'');

    Ending of the Multi Line Comments */

    </script>

    </head>

    ```


    ### Sample Example

    [Download the Example](https://phpbootcampdemo.com/js/comments/downloads/js-comments-em1.zip)


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Page Description">

    <title>How to Write Comments in JavaScript</title>

    <!-- This is HTML Comments -->

    <script>

    /*

    This is a multi-line comment in JS.

    This is different than the HTML comments.

    Anything inside this block will be ignored.

    alert(''This is Multi Line Comment Blok. Ignored by the Browser'');

    */

    // Alert the user with the text

    alert(''Welcome to JavaScript!'');

    </script>

    <!-- This is HTML Comments -->

    </head>

    <body>

    <h1>Heading</h1>

    <p>Paragraph Text</p>

    <ul>

    <li>Item 1</li>

    <li>Item 2</li>

    <li>Item 3</li>

    </ul>

    </body>

    </html>

    ```


