    \n# 4 Statements\n\n## 4.1 if Statements\n### Usage of if Statements\n`if` statement\
    \ are used to check a condition and make a decision based on the result of the\
    \ condition. It can choose some action when the condition is true and also take\
    \ some action when false. You can nest multiple conditions together and decide\
    \ to choose one action based on multiple conditions.\n\n**Syntax:**\n```javascript\n\
    if ( condition1 ){\n// Statements\n} else if( condition2 ){\n// Statements\n}\
    \ else {\n// Statements\n}\n```\n\n### Example 1\n```javascript\nif( marks > 35\
    \ ){\nalert(“You are Passed!”);\n}else{\nalert(“Try Again!”);\n}\n```\n\n### Example\
    \ 2\n```javascript\nif( marks > 35 && marks < 60 ){\nalert(“You are Passed with\
    \ Grade C”);\n}else if ( marks > 60 && marks < 80 ){\nalert(“You are Passed with\
    \ Grade B”);\n}else if ( marks > 80 ){\nalert(“You are Passed with Grade A”);\n\
    }else{\nalert(“Try Again!”);\n}\n```\n\n[Download the Example](https://phpbootcampdemo.com/js/statements-js/if/downloads/js-statements-if-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>if Statements</title>\n<script>\nvar dayOfWeek\
