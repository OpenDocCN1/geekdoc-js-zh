    \n# 3.8 数组 Arrays\n\n## 数组的使用\n数组是特殊的对象类型，用于存储一个或多个被称为“元素”的项。每个元素可以是原始数据类型或对象。`length`\
    \ 用于指示数组中元素的个数。\n\n### 定义数组\n**数组字面量：**\n```javascript\nvar arrayName = [1, 2,\
    \ ‘white’, false];\n```\n**数组构造函数：**\n```javascript\nvar arrayName = new Array(length\
    \ / values);\n```\n\n![](img/rsrc2Y3.jpg)\n\n### 访问数组元素\n```javascript\narrayName[index]\n\
    ```\n\n### 数组元素的长度\n```javascript\nvar lenofArray = arrayName.length;\n```\n\n\
    ### 向数组添加值\n```javascript\nvar newArray = [];\nnewArray[0] = ‘white’;\nnewArray[1]\
    \ = ‘red’;\n```\n\n### 从数组中获取值\n```javascript\nvar color1 = newArray[0];\n```\n\
    \n### 在末尾添加新元素\n```javascript\nnewArray[ newArray.length] = ‘Black’;\n```\n\n\
    ### 数组的第一个元素\n```javascript\nvar firstElement = newArray[0];\n```\n\n[下载示例文件](https://phpbootcampdemo.com/js/arrays/downloads/js-arrays-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>布尔表达式</title>\n<script>\nvar colorsArray\
    \ = ['white', 'black', 'green', 'blue'];\nconsole.log(colorsArray);\nconsole.log(colorsArray.length);\n\
    console.log(colorsArray[0]);\nconsole.log(colorsArray[1]);\nconsole.log(colorsArray[2]);\n\
    console.log(colorsArray[3]);\n      colorsArray[colorsArray.length] = 'red';\n\
    console.log(colorsArray[4]);\n      console.log(colorsArray);\nconsole.log(colorsArray.length);\n\
    </script>\n</head>\n<body>\n<h1>Arrays</h1>\n</body>\n</html>\n```\n\n* *\n\n\
