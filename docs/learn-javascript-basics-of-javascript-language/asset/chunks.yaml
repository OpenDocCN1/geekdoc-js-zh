    \n# 3.9 日期与时间\n\n## 日期时间的使用\n`Date()` 是一个用于访问日期的类库。然而 `Date` 并不是原始数据类型。你需要创建一个\
    \ `Date` 实例来访问日期。\n\n```javascript\nvar today = new Date();\n```\n默认情况下，`today`\
    \ 将包含系统日期，并可以通过它的方法进行显示。\n\n### 日期方法\n- `toDateString()` – 返回格式化字符串形式的日期。\n- `getFullYear()`\
    \ – 返回 `Date` 中的 4 位年份。\n- `getDate()` – 返回 `Date` 中的每月几号。\n- `getMonth()` – 获取月份。\n\
    \n### 示例\n```javascript\nvar today = new Date();\nalert( today.toDateString()\
    \ );\n```\n\n[下载示例文件](https://phpbootcampdemo.com/js/datetime/downloads/js-datetime-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>日期与时间</title>\n<script>\nvar today = new\
    \ Date();\nconsole.log(today.toDateString());\nconsole.log(today.getFullYear());\n\
    console.log(today.getDate());\nconsole.log(today.getMonth());\n</script>\n</head>\n\
    <body>\n<h1>Date and Time</h1>\n<script>\n</body>\n</html>\n```\n\n* *\n\n![](img/rsrc2Y7.jpg)[Live\
    \ Preview](https://phpbootcampdemo.com/js/datetime/em1)练习 1[下载练习 1](https://phpbootcampdemo.com/js/datetime/downloads/js-datetime-ex1.zip)\n\
    练习 1：显示日期。\n\n![](img/rsrc2Y8.jpg)[Live Preview](https://phpbootcampdemo.com/js/datetime/ex1)练习\
    \ 2[下载练习 2](https://phpbootcampdemo.com/js/datetime/downloads/js-datetime-ex2.zip)\n\
    练习 2：显示今天是星期几。\n\n![](img/rsrc2Y9.jpg)[Live Preview](https://phpbootcampdemo.com/js/datetime/ex2)\n\
    \n# 4 语句 Statements\n\n## 4.1 if 语句\n### if 语句的使用\n`if` 语句用于检查条件并根据结果做出决策。当条件为真时执行某些操作，为假时执行其他操作。你可以将多个条件组合起来，根据条件选择操作。\n\
    \n**语法：**\n```javascript\nif ( condition1 ){\n// 语句\n} else if ( condition2 ){\n\
    // 语句\n} else {\n// 语句\n}\n```\n\n### 示例 1\n```javascript\nif( marks > 35 ){\n\
    alert(“Passed!”);\n}else{\nalert(“Try Again!”);\n}\n```\n\n### 示例 2\n```javascript\n\
    if( marks > 35 && marks < 60 ){\nalert(“Passed with Grade C”);\n}else if ( marks\
    \ > 60 && marks < 80 ){\nalert(“Passed with Grade B”);\n}else if ( marks > 80\
    \ ){\nalert(“Passed with Grade A”);\n}else{\nalert(“Try Again!”);\n}\n```\n\n\
    [下载示例文件](https://phpbootcampdemo.com/js/statements-if/downloads/js-statements-if-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>if Statements</title>\n<script>\nvar dayOfWeek\
    \ = prompt(\"Enter the Day of Week\");\nvar result;\ndayOfWeek = dayOfWeek.toLowerCase();\n\
    if( dayOfWeek == 'monday' || dayOfWeek == 'mon'){\nresult = \"First Day of Week\"\
    ;\n}else if( dayOfWeek == 'tuesday' || dayOfWeek == 'tue' ){\nresult = \"Second\
    \ Days of Week\";\n}else if( dayOfWeek == 'wednesday' || dayOfWeek == 'wed' ){\n\
    result = \"Mid Week\";\n}else if( dayOfWeek == 'thursday' || dayOfWeek == 'thurs'){\n\
    result = \"Preparing for Weekend\";\n}else if( dayOfWeek == 'friday' || dayOfWeek\
    \ == 'fri'){\nresult = \"It's Friday!\";\n}else if( dayOfWeek == 'saturday' ||\
    \ dayOfWeek == 'sat' ){\nresult = \"Enjoying Day!\";\n}else if( dayOfWeek == 'sunday'\
    \ || dayOfWeek == 'sun'){\nresult = \"Resting Day!\";\n}else{\nresult = \"Cannot\
    \ find that Value!\";\n}\n</script>\n</head>\n<body>\n<h1>if Statements</h1>\n\
    \  <script type=\"text/javascript\">\n  document.write( result );\n  </script>\n\
    </body>\n</html>\n```\n\n"
- fmt: "\n### Exercise 1\nExercise 1: Accept number 1 to 10 and check if the user\
    \ entered correctly between 1 to 10 as requested with the `if` Statement.\n\n\
    ### Exercise 2\nExercise 2: Ask user to enter the age and decides if he is kid,\
    \ man (`age > 21`) or senior citizen (`age > 55`).\n\n---\n\n## 4.2 switch Statements\n\
    \n### Usage of Switch Statements\n`switch` statement are used to check a value\
    \ and make a decision based on the result of the value matching.\n\n**Syntax:**\n\
    ```javascript\nswitch( variable ){\n  case value:\n    //Statement\n    break;\n\
    \  case value:\n    //Statement\n    break;\n  default:\n    //Statement\n   \
    \ break;\n}\n```\n\n**Example 1:**\n```javascript\nswitch ( dayOfWeek ){\n  case\
    \ ‘Mon’:\n    alert(“Welcome Monday”);\n    break;\n  case ‘Tuesday’:\n    alert(“Welcome\
    \ Tuesday”);\n    break;\n  default:\n    alert(“Try Again!”);\n    break;\n}\n\
    ```\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta\
    \ name=\"description\" content=\"Page Description\">\n<title>Switch Statements</title>\n\
    <script>\n  var dayOfWeek = prompt(\"Enter the Day of Week\");\n  var result;\n\
    \  dayOfWeek = dayOfWeek.toLowerCase();\n  switch(dayOfWeek){\n    case 'monday':\n\
    \      result = \"First Day of Week\";\n      break;\n    case 'tuesday':\n  \
    \    result = \"Second Days of Week\";\n      break;\n    case 'wednesday':\n\
    \      result = \"Mid Week\";\n      break;\n    case 'thursday':\n      result\
    \ = \"Preparing for Weekend\";\n      break;\n    case 'friday':\n      result\
    \ = \"It's Friday!\";\n      break;\n    case 'saturday':\n      result = \"Enjoying\
    \ Day!\";\n      break;\n    case 'sunday':\n      result = \"Resting Day!\";\n\
    \      break;\n    default:\n      result = \"Cannot find that Value!\";\n  }\n\
    </script>\n</head>\n<body>\n<h1>Switch Statements</h1>\n<script type=\"text/javascript\"\
    >\n  document.write( result );\n</script>\n</body>\n</html>\n```\n\n---\n\n###\
    \ Exercise 1\nExercise 1: Accept number 1 to 10 and check if the user entered\
    \ correctly between 1 to 10 as requested with the `Switch` Statement.\n\n### Exercise\
    \ 2\nExercise 2: Ask user to enter the age and decides if he is kid, man (`age\
    \ > 21`) or senior citizen (`age > 55`). Use the `Switch` Statement.\n\n**Tips:**\n\
    ```javascript\nswitch(true){\n  case (input > 21):\n    //Statements\n    break\n\
    }\n```\n\n---\n\n## 4.3 while Statements\n\n### Usage of While Loop\n`while` statement\
    \ are used to loop a block code and run it until a condition is met. Running the\
    \ same block of code until the condition is satisfied.\n\n**Syntax:**\n```javascript\n\
    while( condition ) {\n  //Statement\n}\n```\n\n**Example 1:**\n```javascript\n\
    var counter = 0;\nwhile ( counter <= 10 ){\n  counter++;\n}\n```\n\n**Syntax:**\n\
    ```javascript\ndo{\n  //Statement\n} while ( condition );\n```\n\n**Example 1:**\n\
    ```javascript\nvar counter = 0;\ndo{\n  counter++;\n} while ( counter <= 10 );\n\
    ```\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta\
    \ name=\"description\" content=\"Page Description\">\n<title>While Statements</title>\n\
    <script>\n  var counter = 0;\n  while( counter <= 10){\n    console.log(\"While\
    \ Counter: \" + counter++);\n  }\n  counter = 0;\n  do{\n    console.log(\"Do\
    \ Counter: \" + counter++);\n  }while( counter <= 10);\n</script>\n</head>\n<body>\n\
    <h1>While Statements</h1>\n</body>\n</html>\n```\n\n---\n\n### Exercise 1\nExercise\
    \ 1: Accept two number from user and print all the numbers between them. Print\
    \ only maximum of 10 numbers.\n\n- `break;` – is a keyword that can be used in\
    \ the loop to break from the loop.\n- `continue;` – is a keyword that can be used\
    \ in the loop to continue the loop by skipping the below statements.\n\n**Tip:**\n\
    ```javascript\nif( counter >= 10){\n  break;\n}\n```\n\n### Exercise 2\nExercise\
    \ 2: Accept two number from user and print EVEN numbers only between them. Print\
    \ only maximum of 10 numbers.\n\n---\n\n## 4.4 for Statements\n\n### Usage of\
    \ For Loop\n`for` Loop are used to loop a block code and run it until a condition\
    \ is met. Running the same block of code until the condition is satisfied.\n\n\
    **Syntax:**\n```javascript\nfor( counter initialization; condition; increments\
    \ ) {\n  //Statement\n}\n```\n\n**Example 1:**\n```javascript\nfor(var counter\
    \ = 0; counter <= 10; counter++){\n  alert(counter);\n}\n```\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\">\n<meta name=\"description\" content=\"\
    Page Description\">\n<title>For Statements</title>\n<script>\n  for(var counter=0;\
    \ counter<=10; counter++){\n    console.log(\"For Counter: \" + counter);\n  }\n\
    </script>\n</head>\n<body>\n<h1>For Statements</h1>\n</body>\n</html>\n```\n"
