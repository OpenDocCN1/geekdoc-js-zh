  trans: "\n\n![](img/rsrc2YR.jpg)[实时预览](https://phpbootcampdemo.com/js/statements-js/for/em1/after)练习\
    \ 1[下载练习 1](https://phpbootcampdemo.com/js/statements-js/for/downloads/js-statements-js-for-ex1.zip)\n\
    \n## 练习 1\n接受用户输入的两个数字并打印它们之间的所有数字。最多只打印 10 个数字。\n\n- `break;` – 关键字，用于在循环中跳出循环。\n\
    - `continue;` – 关键字，用于在循环中跳过后面的语句并继续循环。\n\n![](img/rsrc2YS.jpg)[实时预览](https://phpbootcampdemo.com/js/statements-js/for/ex1/after)练习\
    \ 2[下载练习 2](https://phpbootcampdemo.com/js/statements-js/for/downloads/js-statements-js-for-ex2.zip)\n\
    \n## 练习 2\n接受用户输入的两个数字并只打印它们之间的偶数。最多只打印 10 个数字。\n\n![](img/rsrc2YT.jpg)[实时预览](https://phpbootcampdemo.com/js/statements-js/for/ex2/after)![](img/rsrc2YU.jpg)![](img/rsrc2YV.jpg)\n\
    \n# 5 函数、对象和事件\n\n## 5.1 函数\n### 函数的使用\n函数是执行特定操作的语句块。你可以向函数传递参数，并可以使用 `return`\
    \ 关键字从函数返回值。\n\n#### 函数声明的语法：\n```javascript\nfunction nameOfFunction(Parameters){\n\
    \  return someValue;\n}\n```\n#### 示例 1:\n```javascript\nfunction area(width,\
    \ height){\n  return width * height;\n}\nvar size = area(10, 20);\n```\n\n####\
    \ 函数表达式的语法：\n```javascript\nvar nameOfFunction = function(Parameters){\n  return\
    \ someValue;\n}\n```\n#### 示例 1:\n```javascript\nvar area = function(width, height){\n\
    \  return width * height;\n}\nvar size = area(10, 20);\n```\n\n#### 立即执行函数的示例：\n\
    ```javascript\nvar size = ( function(){\n  var width = 10;\n  var height = 20;\n\
    \  return width * height;\n}() );\n```\n[下载示例](https://phpbootcampdemo.com/js/foe-js/functions/downloads/js-foe-js-functions-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta\
    \ name=\"description\" content=\"Page Description\">\n  <title>Functions</title>\n\
    \  <script>\n    function sum(a, b){\n      return a + b;\n    }\n    var size\
    \ = function(width, height){\n      return width * height;\n    }\n  </script>\n\
    </head>\n<body>\n  <h1>Functions</h1>\n  <a href=\"#\" onclick=\"alert( sum(2,5)\
    \ );\">加 2 + 5</a>\n  <br>\n  <a href=\"#\" onclick=\"alert( size(10,20) );\"\
    >10 * 20 的面积</a>\n</body>\n</html>\n```\n\n* * *\n\n![](img/rsrc2YW.jpg)[实时预览](https://phpbootcampdemo.com/js/foe-js/functions/em1/after)练习\
    \ 1[下载练习 1](https://phpbootcampdemo.com/js/foe-js/functions/downloads/js-foe-js-functions-ex1.zip)\n\
    \n## 练习 1\n接受用户输入的两个数字并使用函数相这两个数字。\n\n![](img/rsrc2YX.jpg)[实时预览](https://phpbootcampdemo.com/js/foe-js/functions/ex1/after)练习\
    \ 2[下载练习 2](https://phpbootcampdemo.com/js/foe-js/functions/downloads/js-foe-js-functions-ex2.zip)\n\
    \n## 练习 2\n接受用户输入的两个数字并只打印它们之间的偶数。最多只打印 10 个数字。为此此创建函数并执行它。\n\n![](img/rsrc2YY.jpg)[实时预览](https://phpbootcampdemo.com/js/foe-js/functions/ex2/after)\n\
    \n## 5.2 对象\n### 对象的使用\n对象将变量和函数组合在一起。对象中的变量被称为属性（Properties）。对象中的函数被称为方法（Methods）。\n\
    \n如果 `Hotel` 是一个对象，那么 `numberOfRoom` 就是一个属性，`checkAvailability()` 就是一个函数。\n\n\
    #### 对象字面量：\n```javascript\nvar hotel = {\n  numberOfRooms: 10,\n  bookedRooms:\
    \ 5,\n  checkAvailability(): function(){\n    return numberOfRooms – bookedRooms;\n\
    \  }\n};\nvar hotelTotalRooms = hotel.numberOfRooms;\n// 或\nvar hotelTotalRooms\
    \ = hotel['numberOfRooms'];\nvar roomsFree = hotel.checkAvailability();\n```\n\
    \n#### 创建对象：\n```javascript\nvar hotel = new Object();\nhotel.numberOfRooms =\
    \ 10;\nhotel.bookedRooms = 5;\nhotel.checkAvailability = function(){\n  return\
    \ this.numberOfRooms – this.bookedRooms\n}\n```\n\n#### 对象函数符号：\n### 将函数创建对象\n\
    ```javascript\nfunction hotel(totalRooms, roomLeft){\n  hotel.numberOfRooms =\
    \ totalRooms;\n  hotel.bookedRooms = roomLeft;\n  hotel.checkAvailability = function(){\n\
    \    return this.numberOfRooms – this.bookedRooms;\n  }\n}\nvar h1 = new hotel(10,\
    \ 5);\nvar h2 = new hotel(10, 4);\n```\n[下载示例](https://phpbootcampdemo.com/js/foe-js/objects/downloads/js-foe-js-objects-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta\
    \ name=\"description\" content=\"Page Description\">\n  <title>Objects</title>\n\
    \  <script>\n    function Area(a, b){\n      this.input1 = a;\n      this.input2\
    \ = b;\n      this.getArea = function(){\n        return this.input1 * this.input2;\n\
    \      }\n    }\n  </script>\n</head>\n<body>\n  <h1>Objects</h1>\n</body>\n</html>\n\
    ```\n*(纠正：HTML 块的源文本非常混乱/合并。我将根据规则清晰地格式化可见部分。)*\n\n* * *\n\n![](img/rsrc2YW.jpg)[实时预览](https://phpbootcampdemo.com/js/foe-js/objects/em1/after)练习\
    \ 1[下载练习 1](https://phpbootcampdemo.com/js/foe-js/objects/downloads/js-foe-js-objects-ex1.zip)\n\
    \n## 练习 1\n接受用户输入的两个数字并使用函数相这两个数字。创建对象并实现加减法。\n\n![](img/rsrc2YX.jpg)[实时预览](https://phpbootcampdemo.com/js/foe-js/objects/ex1/after)练习\
    \ 2[下载练习 2](https://phpbootcampdemo.com/js/foe-js/objects/downloads/js-foe-js-objects-ex2.zip)\n\
    \n## 练习 2\n接受用户输入的两个数字并只打印它们之间的偶数。最多只打印 10 个数字。为此创建一个对象并使用它。\n\n![](img/rsrc2YY.jpg)[实时预览](https://phpbootcampdemo.com/js/foe-js/objects/ex2/after)\n\
    \n## 5.3 事件\n### 事件的使用\n事件是用户在浏览器上执行的操作。处理事件的函数被称为事件处理器（Event Handlers）。常见的事件有：\n\
    \n- `onClick`\n- `ondblClick`\n- `onmouseover`\n- `onmouseup`\n- `onmouseout`\n\
    \n示例：`<a href=\"#\" onmouseover=\"alert('hello')\">鼠标悬停</a>`\n\n* * *\n\n![](img/rsrc2Z4.jpg)[实时预览](https://phpbootcampdemo.com/js/foe-js/events/em1/after)练习\
    \ 1[下载练习 1](https://phpbootcampdemo.com/js/foe-js/events/downloads/js-foe-js-events-ex1.zip)\n\
    \n## 练习 1\n当在链接上发生鼠标悬停和鼠标离开事件时触发警告。\n\n![](img/rsrc2Z5.jpg)[实时预览](https://phpbootcampdemo.com/js/foe-js/events/ex1/after)练习\
    \ 2[下载练习 2](https://phpbootcampdemo.com/js/foe-js/events/downloads/js-foe-js-events-ex2.zip)\n\
    \n## 练习 2\n在 body 上使用 `onload()` 事件来显示用户欢迎消息。\n\n# 6 测试\n### 6.1 调试\n#### 步骤 1:\
    \ 编写带有错误的 JavaScript 代码\n编写一个外部 JavaScript 文件 `scripts.js` 并将其包含在 HTML 文件中。尝试以下错误：\n\
    \n1. 将 JavaScript 文件链接错误命名为 `scripting.js` 而不是 `scripts.js`\n2. 使用下方的开发者工具验证并修复程序。\n\
    \n"
- fmt: "\n![](rsrc2ZA.jpg) Click on the file name – `scripts.js` [Download the Exercise\
    \ 2](https://phpbootcampdemo.com/js/testing-js/debug/downloads/js-testing-js-debug-ex1.zip)![](rsrc2ZB.jpg)\
    \ [Live Preview 2](https://phpbootcampdemo.com/js/testing-js/debug/ex1/after)\n\
    \n### Step 2: Open HTML Page Using Chrome\nDownload the Source code and open the\
    \ HTML file using the `chrome` browser and test it.\n\n### Step 3: Open Developer\
    \ Tools\n![](rsrc2ZC.jpg) 3 Ways to open the Chrome Developer Tool:\n\n1. `CTRL`\
    \ + `SHIFT` + `I`\n2. `F12`\n3. Top-Right Menu -> More Tools -> Developer Tools\n\
    \n### Step 4: Debug\nTwo ways to find the error file:\n\n1. Once you open the\
    \ console window it show the errors with red color. Clicking on the link will\
    \ take you to the javascript error code.\n2. Click on `Source` Tab and open the\
    \ file. It will show any errors in the file with red cross marks.\n\n## 6.2 Common\
    \ Errors\n\n### Common JavaScript Errors\nThese are the most common JavaScript\
    \ errors that you might make while writing the JavaScript.\n\n- **Forgetting the\
    \ Semicolon ‘;’ at the last.**\n- **JavaScript is Case Sensitive.** So make sure\
    \ the names matches as it is described.\n- **Difference between Assignment and\
    \ Comparison Operator.**\n  Example: //Using Assignment Operator instead of Comparison\
    \ Operator.\n  ```javascript\n  if( a = b ){\n    // Statement\n  }\n  ```\n-\
    \ **Comparing Number with String.**\n- **Forgetting the ‘+ ‘ sign in the string.**\n\
    \  Example: `\"This is a sample ” + message + ” Program” + message1 ” to do it!”;`\n\
    - **Forgetting the Single Quotes Opening and Closing.**\n  Example: `‘This is\
    \ a sample ‘ + message + ‘ Program’s ‘ + message1 + ‘ to do it!’;`\n- **Missing\
    \ Parenthesis in If Statements**\n  Example: //Missing Parenthesis\n  ```javascript\n\
    \  if ( x > y) && (y > 100) {}\n  ```\n- **Using Wrong Keywords Case.**\n  Example:\n\
    \  ```javascript\n  Funtion add(){\n  }\n  ```\n- **Using Keywords as Variable\
    \ name.**\n  Example: //Keywords as Variable\n  ```javascript\n  var name = “hello”;\n\
    \  ```\n- **Forget to close the parenthesis**\n  Example:\n  ```javascript\n \
    \ function add(){\n  }\n  var total = add;\n  ```\n- **Accessing the Wrong Array\
    \ Index.**\n  Example:\n  ```javascript\n  var myArray = new Array();\n  myArray[0]\
    \ = “hello”;\n  alert( myArray[1] );\n  ```\n\n## 6.3 Try Catch Block\n\n### Usage\
    \ of Try Catch Blocks\nExceptions in programming are referred as Runtime Errors.\
    \ When Runtime Errors happens there is a way to catch those errors and pass it\
    \ to the application and make a clean exit from the program. This is called as\
    \ Exception Handling.\n\nThe process of making sure the code will not break and\
    \ if it does it know the reason for it and make a clean exit.\n\nTo handle Runtime\
    \ errors in the JavaScript we have `try-catch` blocks. Using this we can catch\
    \ the errors and decide what to do next.\n\n**SYNTAX:**\n```javascript\ntry{\n\
    \  //Statements\n}\ncatch(errorName) {\n  //Statments\n}\n```\n\n**Example:**\n\
    ```javascript\ntry {\n  var firstName = \"\";\n  if( firstName == “” ) throw “Name\
    \ is empty”\n}catch (error){\n  alert(error);\n}finally {\n  alert(“Thanks for\
    \ playing!”);\n}\n```\n\n`try {}` block will have all the statements; `throw`\
    \ is a keyword to throw an error from the program. Once the program throw an error\
    \ it will stop processing the next steps. It will jump to `catch {}` block. `catch\
    \ {}` block will be executed once the `throw` is called. The program will execute\
    \ out from the catch block safely. `finally{}` block will execute every time irrespective\
    \ of error or not. It is good place to close all open connections. Handle clean\
    \ exit. \n\n![](rsrc2ZD.jpg) [Download the Example](https://phpbootcampdemo.com/js/testing-js/trycatch/downloads/js-testing-js-trycatch-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>Try Catch JavaScript</title>\n<script>\n\
    try{\n  var input1 = prompt(\"Enter some Number\");\n  //Throw an error when input\
    \ is empty\n  if( input1 == \"\") throw \"No value mentioned\";\n  //If the above\
    \ code is error then this is not executed\n  alert(\"Input is correct!\");\n}catch(error){\n\
    \  //Catch the error\n  alert(error);\n}finally{\n  //This will execute every\
    \ time with or without error\n  alert(\"Have a good Day!\");\n}\n</script>\n</head>\n\
    <body>\n  <h1>Heading</h1>\n  <p>Paragraph Text</p>\n  <ul>\n    <li>Item 1</li>\n\
    \    <li>Item 2</li>\n    <li>Item 3</li>\n  </ul>\n</body>\n</html>\n```\n\n\
    * * *\n\n![](rsrc2ZE.jpg) [Live Preview](https://phpbootcampdemo.com/js/testing-js/trycatch/em1/after)\n\
    \n### Exercise 1\n[Download the Exercise 1](https://phpbootcampdemo.com/js/testing-js/trycatch/downloads/js-testing-js-trycatch-ex1.zip)\n\
    **Exercise 1:** Accept one number from user and raise error if the number is not\
    \ integer.\nUse Function: `isNaN()` to check if the value is number or not.\n\
    ```javascript\nif( isNaN(input1) ){}\n```\n![](rsrc2ZF.jpg) [Live Preview](https://phpbootcampdemo.com/js/testing-js/trycatch/ex1/after)\n\
    \n### Exercise 2\n[Download the Exercise 2](https://phpbootcampdemo.com/js/testing-js/trycatch/downloads/js-testing-js-trycatch-ex2.zip)\n\
    **Exercise 2:** Ask user to enter number between 1 to 100. Show the following\
    \ message on the page:\n\n- If the input is between 1 to 100 – Thank the user\n\
    - If the input is greater than 100 – Ask user to enter number between 1 to 100\n\
    - If the input is not number – Ask user to enter numeric values. throw the error\
    \ here.\n\n![](rsrc2ZG.jpg) [Live Preview](https://phpbootcampdemo.com/js/testing-js/trycatch/ex2/after)![](rsrc2VN.jpg)![](rsrc2ZH.jpg)\n\
    \n## 7 Document Model\n\n### Find an Element by ID\nDocument Object Model or DOM\
    \ in short is nothing but the hierarchy representation of all HTML elements like\
    \ a tree. DOM is created by the browser so that it can easily navigate and make\
    \ changes to the elements. ![](rsrc2ZJ.jpg) Document – Parent element of the DOMElement\
    \ – Each box is text JavaScript can modify the DOM elements. By adding, removing\
    \ and reading the elements from the DOM.\n\n### Read a Value of an Element\nYou\
    \ can read any element from the DOM using JavaScript functions:\n\n1. `getElementById(idName)`\n\
    2. `getElementsByTagName(tagName)`\n3. `getElementsByName(name)`\n4. `getElementsByClassName(className)`\n\
    \n[Download the Example](https://phpbootcampdemo.com/js/dom-js/getid/downloads/js-dom-js-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>Inline JavaScript</title>\n<script>\n\
    function show(){\n  var txtValue = document.getElementById('txtName').value;\n\
    \  alert( txtValue );\n}\n</script>\n</head>\n<body>\n  <h1>Access the DOM Elements</h1>\n\
    \  <form>\n    <input type=\"text\" id=\"txtName\" />\n    <input type=\"button\"\
    \ onclick=\"show();\" Value=\"Show Value\" />\n  </form>\n</body>\n</html>\n```\n\
    \n* * *\n\n![](rsrc2ZK.jpg)(rsrc2ZM.jpg) [Live Preview](https://phpbootcampdemo.com/js/dom-js/getid/em1/after)\n\
    \n### Exercise 1\n[Download the Exercise 1](https://phpbootcampdemo.com/js/dom-js/getid/downloads/js-dom-js-getid-ex1.zip)\n\
    **Exercise 1:** Copy the example and change `id=\"txtName\"` to `name=\"txtName\"\
    ` and use this method to access the same value.\n\n**getElementsByName. Tips:**\n\
    ```javascript\nvar txtValue = document.getElementsByName('txtName’)[0].value;\n\
    ```\n![](rsrc2ZK.jpg)[Live Preview](https://phpbootcampdemo.com/js/dom-js/getid/ex1/after)\n\
    \n### Exercise 2\n[Download the Exercise 2](https://phpbootcampdemo.com/js/dom-js/getid/downloads/js-dom-js-getid-ex2.zip)\n\
    **Exercise 2:** Access all the form text box elements using arrays and access\
    \ them by name.\n**Tip:** `<input type=\"text\" name=\"txtName\" />`\n"
