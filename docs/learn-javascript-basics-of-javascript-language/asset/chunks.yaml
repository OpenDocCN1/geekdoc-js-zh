    \n### 练习 1：创建 `js1.js` 和 `js2.js` 并在 HTML 页面中链接它们。不要创建文件夹，将 js 文件与 HTML 文件放在一起。\n\
    \n文件名：`js1.js`\n`alert( ‘This is called from js1.js’ );`\n文件名：`js2.js`\n`alert(\
    \ ‘This is called from js2.js’ );`\n\n![](img/rsrc2VX.jpg)![](img/rsrc2VY.jpg)[实时预览](https://phpbootcampdemo.com/js/external/ex1)练习\
    \ 2[下载练习 2](https://phpbootcampdemo.com/js/external/downloads/js-external-ex2.zip)\n\
    \n### 练习 2：在 `<head>` 标签内放置一个 `<script>` 标签，在 `<body>` 标签末尾放置另一个 `<script>` 标签。交换顺序，先放\
    \ `js2.js`，后放 `js1.js`。\n\n![](img/rsrc2VY.jpg)![](img/rsrc2VX.jpg)[实时预览](https://phpbootcampdemo.com/js/external/ex2)\n\
    \n# 1.5 内联 JavaScript\n\n## 内联 JavaScript 的用法\n内联 JavaScript 定义在 HTML 标签内部，类似于一个属性。内联\
    \ JS 会覆盖在内部 JS 和外部 JS 中定义的所有样式。内联 JS 代码首先执行。这在 HTML 标签中作为属性定义。\n\n**语法：**\n`<a\
    \ href=”#” onclick=”alert(‘欢迎来到 JavaScript!’);”>点击我</a>`\n\n`onclick` 是 `<a>`\
    \ 标签的事件，当用户点击链接时会调用。调用此 `alert` 由浏览器本身处理。当用户点击链接时，浏览器会在此标签上触发 `click` 事件，因为我们要求在触发此事件时弹出一个\
    \ `alert`，因此调用了该方法。`onClick` 值中提到的任何内容都将作为 JavaScript 执行。JavaScript 写在双引号 “”内的这个\
    \ `onClick` 事件中。所有的 JavaScript 与内部和外部 JavaScript 中的完全相同。\n\n### 示例\n[下载示例](https://phpbootcampdemo.com/js/inline/downloads/js-inline-em1.zip)\n\
    ```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>内联 JavaScript</title>\n</head>\n<body>\n\
    \  <a href=\"#\" onclick=\"alert('Welcome to JavaScript!');\">点击我</a>\n</body>\n\
    </html>\n```\n\n* * *\n\n![](img/rsrc2VZ.jpg)[实时预览](https://phpbootcampdemo.com/js/inline/em1)练习\
    \ 1[下载练习 1](https://phpbootcampdemo.com/js/inline/downloads/js-inline-ex1.zip)\n\
    \n### 练习 1：添加一张图片，并在点击图片时显示弹窗消息。\n\n![](img/rsrc2W0.jpg)[实时预览](https://phpbootcampdemo.com/js/inline/ex1)练习\
    \ 2[下载练习 2](https://phpbootcampdemo.com/js/inline/downloads/js-inline-ex2.zip)\n\
    \n### 练习 2：点击页面任意位置处时显示弹窗消息。找到点击时会触发 `alert` 的区域，并找到 `body` 上不会触发弹窗的区域。\n\n![](img/rsrc2W1.jpg)[实时预览](https://phpbootcampdemo.com/js/inline/ex2)\n\
    \n# 1.6 Hello 示例 JavaScript\n\n## Hello World 程序\n你可以选择编写 JavaScript 内部、外部或内联代码，它们都能工作。但最好的方法是将代码组织在一个文件中，这样就可以为整个网站在某处修复问题。对于这个\
    \ hello world 示例，我们将使用内联 JavaScript。一旦我们知道如何编写函数并从点击事件调用它们，我们就会改进这个程序。我们将使用 `confirm`\
    \ 方法代替 `alert`，它会显示“确定”和“取消”按钮。然而，我们对用户按了任何键不执行任何操作，只需在用户点击链接时显示一个不同的确认框即可。\n\
    `confirm(‘享受 JavaScript 的乐趣！’);`\n\n![](img/rsrc2W2.jpg)示例\n[下载示例](https://phpbootcampdemo.com/js/sample/downloads/js-sample-em1.zip)\n\
    ```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>示例 JavaScript 程序!</title>\n</head>\n<body>\n\
    \  <h1>示例 JavaScript 程序</h1>\n  <p>段落文本</p>\n  <a href=\"#\" onclick=\"alert('Hello\
    \ World!');\">你好消息!</a>\n  <br>\n  <a href=\"#\" onclick=\"confirm('Enjoying JavaScript!');\"\
    >你喜欢吗？</a>\n</body>\n</html>\n```\n\n* * *\n\n![](img/rsrc2W3.jpg)[实时预览](https://phpbootcampdemo.com/js/sample/em1)练习\
    \ 1[下载练习 1](https://phpbootcampdemo.com/js/sample/downloads/js-sample-ex1.zip)\n\
    \n### 练习 1：显示项目 1, 2 和 3 的列表。当用户点击任何链接时，显示他们点击了什么。\n\n![](img/rsrc2W4.jpg)[实时预览](https://phpbootcampdemo.com/js/sample/ex1)练习\
    \ 2[下载练习 2](https://phpbootcampdemo.com/js/sample/downloads/js-sample-ex2.zip)\n\
    \n### 练习 2：在上面的示例中将 `onclick` 替换为 `onmouseover`，查看 `alert` 是如何触发的。\n\n![](img/rsrc2W5.jpg)[实时预览](https://phpbootcampdemo.com/js/sample/ex2)\n\
    \n# 1.7 JavaScript 术语\n如果你是一个 JavaScript 程序员，你需要了解这些术语：\n- **分号** (`;`）：分号符号用于表示行结束。\n\
    - **方括号** (`[]`）：这些用于表示数组（Arrays）。\n- **大括号** (`{}`）：花括号用于定义作用域，如起始和结束点。\n- **括号**\
    \ (`()`）：用于调用函数。\n- **标识符**：是变量、函数、属性或对象的名称。\n- **变量**：存储值的标识符。\n- **运算符**：用于操作的特殊符号。例如算术运算符\
    \ `+` 用于相加数字。\n- **表达式**：解析为某些内容的变量或运算符。例如 `a = 1 + 2` 是一个表达式。\n- **语句**：执行操作的命令组或单个语句。它们以\
    \ `;` 结束。语句旨在执行某些操作。\n```javascript\n{\n  y = sum(1, 2);\n  alert(\"value of\"\
    \ + y);\n}\n```\n\n# 1.8 JavaScript 测试与调试\n由于 JavaScript 在浏览器中运行，调试 JavaScript\
    \ 程序的唯一方法是使用浏览器工具。Chrome 和 Firefox 拥有大量的调试工具，可以帮助发现并修复问题。你需要学习这种方法来发现并修复 JavaScript\
    \ 问题。\n\n### 检查窗口\n在 Chrome 中加载任何 HTML 程序并按 `CTRL + SHIFT + I`。这将加载检查窗口![](img/rsrc2W6.jpg\n\
    \n### 控制台标签\n控制台标签是输出标签，你可以在这里编写程序日志并查看。即使 HTML 程序中有任何问题，浏览器也会在这里显示自己的日志。\n```javascript\n\
    console.log('This is a log from JavaScript program');\n```\n![](img/js-testing-em1.zip)\n\
    ```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>外部 JavaScript</title>\n<script type='text/javascript'\
    \ src=\"js1.js\"></script>\n</head>\n<body>\n  <h1>外部 JavaScript!</h1>\n  <p>段落文本</p>\n\
    \  <ul>\n    <li>项目 1</li>\n    <li>项目 2</li>\n    <li>项目 3</li>\n  </ul>\n</body>\n\
    </html>\n```\n\n"
