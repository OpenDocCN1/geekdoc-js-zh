    \n# 1.5 Inline JavaScript\n\n## Usage of Inline JavaScript\nInline JavaScript\
    \ is defined inside the HTML tag itself like an attribute. Inline JS overrides\
    \ all the styles defined in internal JS and External JS. Inline JS code is executed\
    \ first. This is defined in the HTML tag as a attribute.\n\n**SYNTAX:**\n`<a href=”#”\
    \ onclick=”alert(‘Welcome to JavaScript!’);”>Click Me</a>`\n\n`onclick` is a event\
    \ for `<a>` tag and it is called when user clicks on the link. Calling this `alert`\
    \ is handled by the browser itself. When user clicks on the link, browser will\
    \ raise the `click` event on this tag and because we ask to raise an `alert` when\
    \ this event is raised. This method is called. Whatever is mentioned inside the\
    \ `onClick` value will be executed as JavaScript. JavaScript is written inside\
    \ this `onClick` event within double quotes “”. All the JavaScript is exactly\
    \ similar as mentioned in internal and external JavaScript.\n\n### Sample Example\n\
    [Download the Example](https://phpbootcampdemo.com/js/inline/downloads/js-inline-em1.zip)\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"description\"\
    \ content=\"Page Description\">\n<title>Inline JavaScript</title>\n</head>\n<body>\n\
    \  <a href=\"#\" onclick=\"alert('Welcome to JavaScript!');\">Click Me</a>\n</body>\n\
    </html>\n```\n\n* * *\n\n![](rsrc2VZ.jpg)[Live Preview](https://phpbootcampdemo.com/js/inline/em1)Exercise\
    \ 1[Download the Exercise 1](https://php-[Download the Exercise 1](https://phpbootcampdemo.com/js/inline/downloads/js-inline-ex1.zip)\n\
