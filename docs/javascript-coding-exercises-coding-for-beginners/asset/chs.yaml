  ## 寻找接近 100 的值


  HTML 代码

  ```html

  <!DOCTYPE html>

  <html>

  <head>

  <meta charset="utf-8">

  <meta name="viewport" content="width-device">

  <title>JavaScript program to find a value which is nearest to 100 from two different
  given integer values.</title>

  </head>

  <body></body>

  </html>

  ```


  JAVASCRIPT 代码

  ```javascript

  function near_100(x, y) {

  if (x != y){

  x1 = Math.abs(x - 100);

  y1 = Math.abs(y - 100);

  if (x1 < y1){

  return x;

  }

  if (y1 < x1){

  return y;

  }

  return 0;}elsereturn false;

  }

  console.log(near_100(90, 89));

  console.log(near_100(-90, -89));

  console.log(near_100(90, 90));

  ```

  输出:

  90

  -89

