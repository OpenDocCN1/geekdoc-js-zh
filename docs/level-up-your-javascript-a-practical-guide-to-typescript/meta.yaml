    \ number>(\"hello\", 10);\n\n在这个示例中，GenericPair 类可以存储任何类型的值。类型参数 T 和 U 是从传递给构造函数的参数中推断出来的。\n\
    \n# 为什么使用泛型？\n\n- 可重用：泛型函数、接口和类可以在不同数据类型之间使用，减少代码重复。\n- 类型安全：泛型通过在编译时强制类型约束来确保类型安全。\n\
