    \ boolean }) => {\n  return showMessage ? <p>Hello, world!</p> : null;\n};\n```\n\
    \n- Mapping Over Arrays:\n```tsx\nconst items = ['item1', 'item2', 'item3'];\n\
    \nreturn (\n  <ul>\n    {items.map((item) => (\n      <li key={item}>{item}</li>\n\
