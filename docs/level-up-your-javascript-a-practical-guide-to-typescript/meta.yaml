    \ 应用的基础构建\n\n函数和接口是 TypeScript 中的基础构建块，允许你以模块化和复用的方式组织代码。通过理解如何有效地定义和使用函数和接口，你可以创建组织良好且易于维护的\
    \ TypeScript 应用。\n\n## 定义函数：执行的核心\n\n函数是你 TypeScript 代码的执行主体，它们封装了可复用的逻辑。它们允许你将复杂任务分解为更小、易管理的单元。\n\
    \n基础函数语法：\n\nTypeScript\n\n```typescript\nfunction greet(name: string): void {\n\
    \  console.log(\"Hello, \" + name.toUpperCase() + \"!\");\n}\n```\n\n在此示例中：用于声明函数的关键字。\n\
    \n- function: 声明函数的关键字。\n- greet: 函数名。\n- name:string: 名为 name 的字符串类型参数。\n- void:\
    \ 表示函数不返回值。\n\n## 函数签名：声明合约\n\n你可以使用类型别名来定义函数签名，为函数的使用方式提供清晰的合约：\n\n# TypeScript\n\
    \n```typescript\ntype GreetFunction = (name: string) => void;\n\nlet greet: GreetFunction\
    \ = (name) => {\n  console.log(\"Hello, \" + name.toUpperCase() + \"!\");\n};\n\
    ```\n\n## 可选参数：函数调用的灵活性\n\n你可以通过 `?` 符号让函数参数变为可选：\n\n# TypeScript\n\n```typescript\n\
    function greet(name: string, lastName?: string): void {\n  if (lastName) {\n \
    \   console.log(\"Hello, \" + name + \" \" + lastName + \"!\");\n  } else {\n\
    \    console.log(\"Hello, \" + name + \"!\");\n  }\n}\n```\n\n## 默认参数：提供默认值\n\n\
    你可以使用 `=` 运算符为参数指定默认值：\n\n# TypeScript\n\n```typescript\nfunction greet(name:\
    \ string, greeting: string = \"Hello\"): void {\n  console.log(greeting + \" \"\
    \ + name);\n}\n```\n\n## 剩余参数：收集多个参数\n\n你可以使用扩展运算符 `...` 收集多个参数：\n\nTypeScript\n\
    \n```typescript\nfunction sum(...numbers: number[]): number {\n  return numbers.reduce((total,\
    \ num) => total + num, 0);\n}\n```\n\n## 接口：对象的定义\n\n接口是定义对象的强大工具。它们规定了对象的形状，确保类型安全。\n\
    \n基础接口定义：\n\nTypeScript\n\n```typescript\ninterface Person {\n  firstName: string;\n\
    \  lastName: string;\n  age: number;\n}\n```\n\n使用接口创建对象：\n\nTypeScript\n\n```typescript\n\
    let person1: Person = {\n  firstName: \"Alice\",\n  lastName: \"Johnson\",\n \
    \ age: 30\n};\n```\n\n## 继承：创建关系\n\n你可以使用继承在接口之间创建关系：\n\nTypeScript\n\n```typescript\n\
    interface Employee extends Person {\n  salary: number;\n  position: string;\n\
    }\n```\n\n### 函数与接口的实际应用\n\n- 模块化代码：将代码分解为可复用的函数。\n- 增强可读性：使用清晰的函数和接口提高代码理解。\n\
    - 提升类型安全：通过类型检查防止错误。\n- 促进代码复用：使用接口创建复用的组件和库。\n- 提高可维护性：使代码更容易修改和更新。\n\n通过掌握函数和接口，你将能够编写组织良好、可维护且扩展的\
    \ TypeScript 应用。在下一节中，我们将深入探讨 TypeScript 中的类和面向对象编程。\n\n## 2.3 类与对象：应用的骨干\n\n\
    类和对象是面向对象编程（OOP）的基本概念，允许你模拟现实实体及其行为。TypeScript 提供了定义和使用类的强大灵活的方法。通过理解类，你可以创建结构良好、模块化且复用的代码。\n\
    \n## 定义类：对象的蓝图\n\n类是对象的蓝图。它定义了类的对象将具有的属性和方法。在 TypeScript 中定义类使用 `class` 关键字：\n\
    \nTypeScript\n\n```typescript\nclass Person {\n  firstName: string;\n  lastName:\
    \ string;\n  age: number;\n\n  constructor(firstName: string, lastName: string,\
    \ age: number) {\n    this.firstName = firstName;\n    this.lastName = lastName;\n\
    \    this.age = age;\n  }\n\n  greet() {\n    console.log(\"Hello, my name is\
    \ \" + this.firstName + \" \" + this.lastName);\n  }\n}\n```\n\n类的拆解：\n\n- 1.\
    \ 类声明：`class` 关键字声明了一个名为 `Person` 的类。\n- 2. 属性：类定义了三个属性：`firstName`、`lastName`\
    \ 和 `age`。\n- 3. 构造函数：构造函数是一个初始化属性特殊方法。它在创建类的实例时被调用。\n- 4. 方法：`greet` 方法是定义在类内部的函数。它可以访问对象的属性。\n\
    \n## 创建对象：赋予类生命\n\n要创建类的实例，你需要使用 `new` 关键字。\n\nTypeScript\n\n```typescript\nlet\
    \ person1 = new Person(\"Alice\", \"Johnson\", 30);\n```\n\n这创建了一个新的 `Person`\
    \ 对象并将其赋值给 `person1` 变量。然后你可以访问对象的属性和方法。\n\n"
