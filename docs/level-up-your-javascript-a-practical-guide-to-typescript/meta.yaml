    \ />\n    </div>\n  );\n};\n```\n\nIn this example:\n\n- The name variable is\
    \ inferred to be of type `string`.\n- The `Button` component is used with the\
    \ correct props.\n\n### Advanced Usage of TypeScript with JSX\n\n- Conditional\
