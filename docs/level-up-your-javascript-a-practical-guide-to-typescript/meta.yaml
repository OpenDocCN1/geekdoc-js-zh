    \n## 3.1 泛型：创建可重用组件\n\n泛型是 TypeScript 中的一项强大功能，允许你编写灵活且可重用的代码。通过使用泛型类型，你可以创建可以处理各种数据类型的组件，而不会损害类型安全。\n\
    \n理解泛型：\n\n泛型类型是稍后确定的类型的占位符。通过使用泛型，你可以编写可以在不同数据类型上运行函数、接口和类。这促进了代码的可重用性和类型安全。\n\
