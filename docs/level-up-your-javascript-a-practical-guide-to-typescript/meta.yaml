    # Chapter 1: Introduction to TypeScript


    # 1.1 What is TypeScript?


    TypeScript: A Supercharged JavaScript


    TypeScript is a superset of JavaScript, meaning that any valid JavaScript code
    is also valid TypeScript. However, TypeScript¹ adds a powerful feature: static
    typing.


    What is Static Typing?


    In statically typed languages, you declare the data type of a variable before
    using it. This allows the compiler to catch potential errors early on, such as
    trying to add a number to a string. TypeScript leverages the concept to make your
    JavaScript code more reliable, maintainable, and scalable.


    Why Use TypeScript?


    While JavaScript has been a powerful language for web development, it has its
    limitations.


    +   - Runtime Type Errors: JavaScript''s dynamic typing can lead to unexpected
    errors that only manifest during runtime.

    - Lack of Code IntelliSense: Without type information, code editors and IDEs cannot
    provide robust autocompletion, refactoring, and navigation features.'
