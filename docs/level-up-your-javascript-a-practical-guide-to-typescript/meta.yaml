    \  );\n};\n```\n\nIn this example:¹\n\n1. We define an interface CounterProps\
    \ to specify the initial value of the counter.\n2. We use the useState hook to\
    \ manage the count state.\n3. The increment function updates the count state using\
    \ the setCount function.\n4. The count and increment function are used within\
    \ the JSX to render the UI.\n\n### Example 2: Using TypeScript with Context API\n\
    \n```tsx\nimport React, { createContext, useContext, useState } from 'react';\n\
    \nconst ThemeContext = createContext<{ theme: 'light' | 'dark' }>();\n\nconst\
    \ ThemeProvider = ({ children }: { children: React.ReactNode }) => {\n  const\
    \ [theme, setTheme] = useState('light');\n\n  return (\n    <ThemeContext.Provider\
    \ value={{ theme }}>\n      {children}\n    </ThemeContext.Provider>\n  );\n};\n\
    \nconst ThemeAwareComponent = () => {\n  const { theme } = useContext(ThemeContext);\n\
    \n  return <div style={{ backgroundColor: theme === 'light' ? 'white' : 'black'\
