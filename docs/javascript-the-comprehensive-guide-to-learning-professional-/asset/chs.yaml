  \ |\n| validator | 用于验证字符串的库 | `npm install validator` | [`github.com/chriso/validator.js`](https://github.com/chriso/validator.js)\
  \ |\n\n### 表 17.1 使用包\n\n如所述，Node.js 此时 NPM 遵循 CommonJS 模块格式。这意味着要使用一个包，你必须通过 `require()`\
  \ 包含或导入它。\n\n列表 17.2 (#17_002.html_l17.2) 显示了一个示例。你刚刚安装的 lodash 包通过 `require('lodash')`\
  \ 集成，并被赋值给变量 `_`。该变量随后包含了对 lodash 包导出的所有函数和对象的引用（另请参见第 15 章 (#15_001.html_h15)）。其中一个函数是\
