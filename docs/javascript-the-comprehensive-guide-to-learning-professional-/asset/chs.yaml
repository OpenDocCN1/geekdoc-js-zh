  \n{\n  \"name\": \"sample package\",\n  \"version\": \"1.0.0\",\n  \"description\"\
  : \"Sample package JavaScript Manual,\n  \"main\": \"main.js\",\n  \"scripts\":\
  \ {\n    \"test\": \"mocha\"\n  },\n  \"keywords\": [\n    \"javascript\"\n  ],\n\
  \  \"author\": \"Philip Ackermann\",\n  \"license\": \"MIT\"\n}\n\nIs this ok? (yes)\
  \ \n```\n\n**列表 17.3 创建 NPM 包的命令行向导**\n\n该配置文件是一个 JSON 文件，包含了关于包的各种信息。每个包中必须存在该文件，并且至少包含相应包的名称和版本号；否则它无法被安装。名称和版本号的组合唯一标识了一个包。NPM\
  \ 需要这两者来解析和下载依赖项。\n\n##### 包的依赖\n\n除了包的通用数据外，对其他包的依赖也定义在配置文件中。如果你通过 NPM 安装包，依赖项将直接从此文件中按所需的正确版本进行安装。\n\
  \n所使用的 JSON 格式大致基于 CommonJS 下定义的包描述符文件格式 ([`wiki.commonjs.org/wiki/Packages/1.0#Package_Descriptor_File`](http://wiki.commonjs.org/wiki/Packages/1.0#Package_Descriptor_File))\
  \ 。表 17.2 (#17_002.html_t17.2) 提供了在此背景下可以使用的最重要属性的概述。完整列表请访问 [`docs.npmjs.com/files/package.json`](https://docs.npmjs.com/files/package.json)。\n\
  \n| 属性 | 描述 |\n| --- | --- |\n| `name` | 包的名称。 |\n| `version` | 包的版本。包名加版本号作为整个包的唯一\
  \ ID。此处支持语义版本控制（另请参见 http://semver.org](http://semver.org)) |\n| `description` |\
  \ 包的描述。 |\n| `main` | 包的主文件/入口文件。 |\n| `keywords` | 用于按主题分类包的关键词数组。例如，当你通过 `npm\
  \ search` 执行搜索时，这些关键词会被搜索到。 |\n| `homepage` | 项目主页的 URL。 |\n| `license` | 包的许可证。\
  \ |\n| `author` | 包的（主）作者。此处只能指定一个人。额外的作者可以使用 `contributors` 属性列出。一个 `Person` 对象由\
  \ `name`、`email`（可选）和 `url`（可选）属性组成。 |\n| `contributors` | `Person` 对象的数组。 |\n|\
  \ `repository` | 可用于指定管理包源代码的仓库。 |\n| `dependencies` | 在此你可以定义包对其他包的依赖关系。依赖项通过相应包的名称和版本来定义。除此之外，你还可以定义引用包的版本号是否必须精确匹配，或者版本号必须大于（或等于）或小于（或等于）指定的版本号。可以使用各种额外的占位符来灵活判断依赖项是否满足。在安装包时会直接安装这些依赖项。\
  \ |\n| `devDependencies` | 此处管理所有在开发期间需要但在生产环境中使用相应包时不需要的包。单元测试、代码质量检查、构建过程等包通常可以在这里找到。\
  \ |\n| `os` | 此属性允许你定义相应包在哪些操作系统下可执行。 |\n\n**表 17.2 package.json 配置文件的各种属性**\n\n\
  \n\n\n你可以使用 `npm info <package>` 命令输出相应包的 `package.json` 文件，而无需在计算机上安装该包。NPM 会从\
  \ NPM 仓库检索信息并在控制台上输出该文件。如果你想在安装包之前检查某些先决条件，这非常有用——例如使用的依赖项、对特定操作系统的支持情况等。\n\n####\
  \ 向 package.json 文件添加依赖\n\n通过在 `npm install` 命令中指定额外的 `--save` 参数，该依赖项不仅会被下载，还会被直接标记为\
  \ `package.json` 文件中的依赖项：\n\n```\nnpm install lodash --save\n```\n\n`--save-dev`\
  \ 参数以类似的方式将依赖写入配置文件的开发依赖（`devDependencies`）中：\n\n```bash\nnpm install mocha --save-dev\n\
  ```\n\n执行上述命令后，刚才的 `package.json` 文件将如列表 17.4 所示。\n\n```json\n{\n  \"name\": \"\
  sample package\",\n  \"version\": \"1.0.0\",\n  \"description\": \"Sample package\
  \ JavaScript Manual\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\"\
  : \"mocha\"\n  },\n  \"keywords\": [\n    \"javascript\"\n  ],\n  \"author\": \"\
  Philip Ackermann\",\n  \"license\": \"MIT\",\n  \"dependencies\": {\n    \"lodash\"\
  : \"~4.17.21\",\n  },\n  \"devDependencies\": {\n    \"mocha\": \"~8.4.0\"\n  }\n\
  }\n```\n\n**列表 17.4** 由依赖项扩展的 package.json 配置文件\n\n## 17.3 处理和触发事件\n\nNode.js 的大部分是事件驱动的。事件由事件发射器（event\
  \ emitters）触发——即 `EventEmitter` 类型的对象。在本节中，我们将向你要介绍如何在 Node.js 中使用这种基础编程范式（你已经从第\
  \ 6 章 原上了解了它）。\n\n### 17.3.1 触发和拦截事件\n\n`EventEmitter` 类型有两个主要方法（你可以在表格 17.3` 方法可用于定义在特定事件发生时执行的回调函数——换句话说，可以通过这种方式注册事件监听器。你可以使用\
  \ `EventEmitter` 的第二个方法 `emit()` 方法来触发事件。\n\n传递给 `on()` 方法的第一个参数是为要注册事件监听器的事件名称；第二个参数是函数形式的事件监听器。`emit()`\
  \ 方法传递的是事件名称以及用于调用已注册该事件的事件监听器的参数。\n\n此示例在列表 17.5` 调用触发了带有两个值 `John` 和 `Doe` 的事件。\n\
  \n```javascript\n'use strict';\nconst events = require('events');             //\
  \ 引入 events 包\nconst emitter = new events.EventEmitter();    // 创建发射器\nemitter.on(\
  \                               // 拦截事件\n  'personAdded',                      \
  \        // 事件名称\n  (firstName, lastName) => {                  // 回调函数\n    console.log(firstName\
  \ + ' ' + lastName);\n  }\n);\nemitter.emit(                                  触发事件\n\
  \  'personAdded',                              // 事件名称\n  'John',              \
  \                       // 参数 firstName\n  'Doe'                               \
  \        // 参数 lastName\n);                                            // 输出：\"\
  John Doe\"\n```\n\n**列表 17.5** 触发和拦截事件\n\n| 属性/方法 | 描述 |\n| --- | --- |\n| `EventEmitter.defaultMaxListeners`\
  \ | 为事件可以注册的事件监听器的默认最大数量。此值可以被覆盖。或者，可以使用 `setMaxListeners()` 方法为每个事件发射器单独定义最大数量。\
  \ |\n| `addListener(eventName, listener)` | `on()` 方法的别名。为某个事件注册新的事件监听器。 |\n| `emit(eventName\
  \ [, arg1], [, arg2], [, ...])` | 触发事件。 |\n| `eventNames()` | 返回一个包含事件发射器已注册事件监听器的事件名称的数组。\
  \ |\n| `getMaxListeners()` | 指定给定事件发射器的最大事件监听器数量。 |\n| `listenerCount(eventName)`\
  \ | 返回为某个事件注册的事件监听器数量。 |\n| `listeners(eventName)` | 返回一个包含某个事件注册的事件监听器的数组。 |\n\
  | `on(eventName, listener)` | 为某个事件注册新的事件监听器。 |\n| `once(eventName, listener)` |\
  \ 为某个事件注册新的事件监听器，但最多执行一次。 |\n| `prependListener(eventName, listener)` | 为某个事件注册新的事件监听器，并将其放在该事件注册的事件监听器数组的开头。\
  \ |\n| `prependOnceListener(eventName, listener)` | 与 `prependListener()` 类似，但相应的事件监听器最多调用一次。\
  \ |\n| `removeAllListeners([eventName])` | 移除为某个事件注册的所有事件监听器。 |\n| `removeListener(eventName,\
  \ listener)` | 为传递的事件移除传递的事件监听器。 |\n| `setMaxListeners(n)` | 设置事件发射器中每个事件可以注册的事件监听器最大数量。\
  \ |\n\n**表格 17.3** 处理事件的方法\n\n### 17.3.2 多次触发事件\n\n\n\n\n当然，也可以多次对事件调用 `emit()`\
  \ 方法，从而触发多次事件。例如，在 Listing 17.6 中，`personAdded` 事件被触发了两次，导致相应的事件监听器被执行了两次。\n\n```\n\
  'use strict';\nconst events = require('events');             // Include events package\n\
  const emitter = new events.EventEmitter();    // Create emitter\nemitter.on(   \
  \                                // Intercept event\n  'personAdded',          \
  \                    // Event name\n  (firstName, lastName) => {               \
  \   // Callback function\n    console.log(firstName + ' ' + lastName);\n  }\n);\n\
  emitter.emit(                                 // Trigger event\n  'personAdded',\
  \                              // Event name\n  'John',                        \
  \             // Parameter firstName\n  'Doe'                                  \
  \     // Parameter lastName\n);                                            // Output:\
  \ \"John Doe\"\nemitter.emit(                                 // Trigger event\n\
  \  'personAdded',                              // Event name\n  'James',       \
  \                             // Parameter firstName\n  'Doe'                  \
  \                     // Parameter lastName\n);                                \
  \            // Output: \"James Doe\" \n```\n\nListing 17.6 触发和拦截多次事件\n\n### 17.3.3\
  \ 恰好只拦截一次事件\n\n如果你希望注册的事件监听器只被调用一次——无论事件被触发的频率如何——请使用 `once()` 方法而不是 `on()` 方法来注册相应的事件监听器。Listing\
  \ 17.7 显示了此示例：在这里，`personAdded` 事件同样被触发了两次，但事件监听器只执行了一次。\n\n```\n'use strict';\n\
  const events = require('events');                     // Include events package\n\
  const emitter = new events.EventEmitter();            // Create emitter\nemitter.once(\
  \                                         // Intercept event\n  'personAdded', \
  \                                     // Event name\n  (firstName, lastName) =>\
  \ {                          // Callback function\n    console.log(firstName + '\
  \ ' + lastName);\n  }\n);\nemitter.emit('personAdded', 'John', 'Doe');         \
  \ // Output: \"John Doe\"\nemitter.emit('personAdded', 'James', 'Doe');        \
  \ // Event listener is not...\n                                                \
  \     // ... triggered. \n```\n\nListing 17.7 拦截单个事件\n\n#### 注意\n\n通过 `once()` 注册的事件监听器会在事件首次发生时被触发，并从事件发射器中移除。\n\
  \n### 17.3.4 多次拦截事件\n\n对某个事件多次调用 `on()` 方法并以这种方式为单个事件注册多个事件监听器是可以允许的。Listing 17.8\
  \ 显示了此示例，其中一个事件监听器注册用于 `personAdded` 事件发生时输出名字，另一个事件监听器注册用于输出姓。\n\n```\n'use strict';\n\
  const events = require('events');             // Include events package\nconst emitter\
  \ = new events.EventEmitter();    // Create emitter\nemitter.on(               \
  \                    // Intercept event\n  'personAdded',                      \
  \        // Event name\n  (firstName, lastName) => {                  // Callback\
  \ function\n    console.log('First name: ' + firstName);\n  }\n);\nemitter.on( \
  \                                  // Intercept event\n  'personAdded',        \
  \                      // Event name\n  (firstName, lastName) => {             \
  \     // Callback function\n    console.log('Last name: ' + lastName);\n  }\n);\n\
  emitter.emit(                                 // Trigger event\n  'personAdded',\
  \                              // Event name\n  'John',                        \
  \             // Parameter firstName\n  'Doe'                                  \
  \     // Parameter lastName\n); \n```\n\nListing 17.8 多次拦截单个事件\n\n## 17.4 访问文件系统\n\
  \nNode.js 提供了许多用于处理文件系统的函数。你可以读取文件、写入文件、创建目录、重命名文件和目录、更改两者的权限，以及更多操作。我们在这里只查看这些函数的片段。\n\
  \n### 17.4.1 读取文件\n\n每个 Node.js 安装中都提供的提供辅助函数的内部和默认包是 `fs` 包（`fs` 代表 file system；参见\
  \ [`nodejs.org/api/fs.html`](https://nodejs.org/api/fs.html)）。\n\n例如，读取文件时，你可以选择异步或同步方式（正如许多其他文件操作一样）。异步读取是通过\
  \ `readFile()` 函数完成的，如 Listing 17.9 所示，它期望两个参数：要读取的文件路径以及一个用于获取文件内容或在出错时获取相应错误信息的调函数。\n\
  \n```\n'use strict';\nconst fs = require('fs');\nfs.readFile('input.txt', (error,\
  \ data) => {\n  if (error) {\n    return console.error(error);\n  }\n  console.log(data.toString());\n\
  }); \n```\n\nListing 17.9 异步读取文件\n\n#### 注意\n\n`readFile()` 方法也可以通过三个参数调用：第一个是文件路径；第二个是配置对象，通过它你可以设置例如要使用的编码；第三个是回调函数。\n\
  \n作为异步 `readFile()` 函数的替代方案，你可以使用 `readFileSync()` 方法同步读取文件。与其使用回调函数，不如通过函数的返回值直接访问对应文件的内容。因此，如\
  \ Listing 17.10 所示，你只需要传递文件路径作为参数，并可选地传递一个配置对象作为第二个参数。\n\n```\n'use strict';\nconst\
  \ fs = require('fs');\nconst data = fs.readFileSync('input.txt');\nconsole.log(data.toString());\
  \ \n```\n\nListing 17.10 同步读取文件\n\n#### 从浏览器和 Node.js 中读取文件\n\n你从第 12 章知道，在没有用户同意的情况下，无法从浏览器执行的\
  \ JavaScript 代码访问用户文件。在 Node.js 中，情况有所不同：这取决于执行相应的 Node.js 应用或 JavaScript 的用户 ID，以及该用户是否有有足够的权限访问文件。\n\
  \n### 17.4.2 写入文件\n\n对于写入文件，你也可以使用一个异步函数和一个同步函数。你可以在 Listing 17.11 中看到前者的用法 `writeFile()`\
  \ 方法。作为参数，你传递要写入的文件路径、写入的内容以及在文件写入或发生错误时调用的回调函数。相比之下，在 Listing 17.12 中，你可以看到 `writeFileSync()`\
  \ 函数的使用。如预期，这里省略了回调函数，但调用的其余部分是相同的。\n\n\n\n\n\n```\n'use strict';\nconst fs = require('fs');\n\
  fs.writeFile('output.txt', 'Hello World', (error) => {\n  if (error) {\n    return\
  \ console.error(error);\n  }\n  fs.readFile('output.txt', (error, data) => {\n \
  \   if (error) {\n      return console.error(error);\n    }\n    console.log('Content:\
  \ ' + data.toString());\n  });\n}); \n```\n\n####  17.11 文件的异步写入\n\n```\n'use strict';\n\
  const fs = require('fs');\nfs.writeFileSync('output.txt', 'Hello World');\nconst\
  \ data = fs.readFileSync('output.txt');\nconsole.log(data.toString()); \n```\n\n\
  ####  17.12 文件的同步写入\n\n##### 注意事项\n\n`writeFile()` 和 `writeFileSync()` 函数还可以可选地传递一个配置对象作为额外参数（在\
  \ `writeFile()` 的情况下，插入在回调函数之前），该对象可用于指定写入数据的的编码等。\n\n### 17.4.3 读取文件信息\n\n要读取文件信息，你可以使用\
  \ `stat()` 函数。如 列表 17.13 和 列表 17.14 所示，它提供了关于文件的许多个不同的信息片段，例如创建日期、文件大小等（另见 [`man7.org/linux/man-pages/man2/stat.2.html`](http://man7.org/linux/man-pages/man2/stat.2.html)）。\n\
  \n```\n'use strict';\nconst fs = require('fs');\nfs.stat('input.txt', (error, stats)\
  \ => {\n  if (error) {\n    return console.error(error);\n  }\n  console.log(stats.isFile());\
  \        // true\n  console.log(stats.isDirectory());   // false\n  console.log(stats);\
  \                 // 见下一个列表\n}); \n```\n\n####  17.13 读取文件信息\n\n```\n{ dev: 16777218,\n\
  \  mode: 33188,\n  nlink: 1,\n  uid: 501,\n  gid: 20,\n  rdev: 0,\n  blksize: 4096,\n\
  \  ino: 57181993,\n  size: 10,\n  blocks: 8,\n  atime: Mon May 24 2021 20:03:35\
  \ GMT+0200 (CEST),\n  mtime: Mon May 24 2021 20:02:32 GMT+0200 (CEST),\n  ctime:\
  \ Mon May 24 2021 20:03:35 GMT+0200 (CEST),\n  birthtime: Mon May 24 2021 20:02:32\
  \ GMT+0200 (CEST) } \n```\n\n####  17.14 文件信息的示例输出\n\n##### 注意事项\n\n同样，对于 `stat()`，有一个对应的同步版本，形式为\
  \ `statSync()` 函数。但由于我们可以假设你现在已经理解了异步和同步操作之间的区别，我们此处将不再提供相应的示例。\n\n### 17.4.4 删除文件\n\
  \n要删除文件，你使用 `unlink()`（或 `unlinkSync()`）函数。它期望将要删除的文件路径作为参数，以及一个在删除文件后或发生错误时调用的回调函数。列表\
  \ 17.15 显示了这方面的示例：在这里，首先通过 `writeFile()` 创建一个文件，然后在该函数的回调函数中通过 `unlink()` 再次删除它。\n\
  \n```\n'use strict';\nconst fs = require('fs');\nfs.writeFile('output.txt', 'Hello\
  \ World', (error) => {\n  if (error) {\n    return console.error(error);\n  }\n\
  \  console.log('File created');\n  fs.unlink('output.txt', (error) => {\n    if\
  \ (error) {\n      return console.error(error);\n    }\n    console.log('File deleted\
  \ again');\n  });\n}); \n```\n\n####  17.15 删除文件\n\n### 17.4.5 操作目录\n\n`fs` 包还提供了许多用于操作目录的函数：例如，你可以使用\
  \ `mkdir()` 和 `mkdirSync()` 函数创建目录（见 列表 17.16），使用 `readdir()` 和 `readdirSync()`\
  \ 列出目录内的所有文件（见 列表 17.17），以及使用 `rmdir()` 和 `rmdirSync()` 删除目录（见 列表 17.18）。\n\n```\n\
  'use strict';\nconst fs = require('fs');\nfs.mkdir('test', (error) => {\n  if (error)\
  \ {\n    return console.error(error);\n  }\n  console.log('Directory created');\n\
  }); \n```\n\n####  17.16 异步创建目录\n\n```\n'use strict';\nconst fs = require('fs');\n\
  fs.readdir('test', (error, files) => {\n  if (error) {\n    return console.error(error);\n\
  \  }\n  console.log(files);\n}); \n```\n\n####  17.17 异步读取目录\n\n```\n'use strict';\n\
  const fs = require('fs');\nfs.rmdir('test', (error) => {\n  if (error) {\n    return\
  \ console.error(error);\n  }\n}); \n```\n\n####  17.18 异步删除目录\n\n##### 注意事项\n\n\
  我们在在本章中为止介绍的所有包已经包含在 Node.js 中。当然，还有几个没有包含在 Node.js 中：首先是 Express 框架，其次是 mongodb，它访问数据库成为可能。\n\
  \n### 17.5 启动服务器\n\n在我们引入 Express.js 之前，让我们简要回顾一下之前使用的 http 包。\n\n#### 17.5.1 创建服务器\n\
  \n列表 17.19 显示了如何使用 http 包 ([`nodejs.org/api/http.html`](https://nodejs.org/api/http.html))\
  \ 创建 Web 服务器：导入 http 包后，使用 `createServer()` 方法创建一个服务器对象，向该函数传递一个回调函数，该回调接收对服务器的请求并准备服务器的响应。在该回调函数内部，你可以访问代表服务器请求的对象（`request`\
  \ 参数）和一个代表服务器响应的对象（`response` 参数）。\n\n要生成响应，如示例所示，只需通过 `writeHead()` 方法在 `response`\
  \ 对象上设置适当 `Content-Type` 头部，并通过 `end()` 方法设置包含在响应中的数据即可。\n\n然后启动服务器，调用服务器对象上的 `listen()`\
  \ 方法。可以使用 `node main.js` 命令启动脚本。如果你现在在浏览器中调用 URL http://localhost:8080，你会得到输出 `Hello\
  \ World`。\n\n```\n'use strict';\nconst http = require('http');\nconst PORT = 8080;\n\
  function handleRequest(request, response){\n  response.writeHead(200, {'Content-Type':\
  \ 'text/plain'});\n  response.end('Hello World');\n}\nconst server = http.createServer(handleRequest);\n\
  server.listen(PORT, () => {\n  console.log(\"Server is running at: http://localhost:%s\"\
  , PORT);\n}); \n```\n\n#### \\ 17.19 使用 http 包的简单服务器（server.js 文件的内容）\n\n或者，你可以将其写得更紧凑一些，如\
  \ 列表 17.20 所示。\n\n```\n'use strict';\nconst http = require('http');\nhttp\n  .createServer((request,\
  \ response) => {\n    response.writeHead(200, {'Content-Type': 'text/plain'});\n\
  \    response.end('Hello World');\n  })\n  .listen(8080); \n```\n\n#### \\ 17.20\
  \ 更紧凑的 Web 服务器启动\n\n###### 服务器发送事件\n\n\n\n\n还记得 第 12 章 吗？在那里我们还通过 `http` 包启动了一个\
  \ Web 服务器来触发服务器发送事件（SSE）。所以如果你那时跳过了那个例子，现在是再次回顾一下的好时机。\n\n### 17.5.2 通过 Web 服务器提供文件\n\
  \n要从文件系统读取 HTML 文件并将其内容返回给客户端，只需在本章之前介绍的 `fs` 包（如代码列表 17.21 所示所示并将文件内容传递给 `write()`\
  \ 方法即可。\n\n```\n'use strict';\nconst http = require('http');\nconst url = require('url');\n\
  const fs = require('fs');\n// 1.) 创建服务器\nhttp.createServer((request, response) =>\
  \ { \n   // 2.) 查找路径\n   const pathname = url.parse(request.url).pathname;\n   //\
  \ 3.) 为路径读取文件\n   fs.readFile(pathname.substr(1), (error, data) => {\n      if (error)\
  \ {\n         return console.error(error);\n         // 3.1.) 文件未找到\n         //\
  \ HTTP 状态: 404 : NOT FOUND\n         // Content-Type: text/plain\n         response.writeHead(404,\
  \ {'Content-Type': 'text/plain'});\n      } else {\n         // 3.2.) 文件找到\n   \
  \      // HTTP 状态: 200 : OK\n         // Content-Type: text/html\n         response.writeHead(200,\
  \ {'Content-Type': 'text/html'});\n         response.write(data.toString());\n \
  \     }\n      // 4.) 发送响应\n      response.end();\n   });\n}).listen(8080); \n```\n\
  \n**代码列表 17.21** 读取 HTML 文件并发送到客户端\n\n### 17.5.3 为 Web 服务器创建客户端\n\n你不仅可以使用 `http`\
  \ 包来创建 Web 服务器，还可以自己向 Web 服务器发送请求。要做到这一点，请使用 `request()` 函数，如代码列表 17.22 所示，使用配置对象来配置要请求的\
  \ Web 服务器或其主机、端口以及可能的路径规范，并传递一个处理服务器响应的回调函数。\n\n```\n'use strict';\nconst http =\
  \ require('http');\nconst options = {\n   host: 'localhost',\n   port: '8080',\n\
  \   path: '/index.html' \n};\nfunction handleResponse(response){\n  let body = '';\n\
  \  response.on('data', (data) => {\n    body += data;\n  });\n  response.on('end',\
  \ () => {\n    console.log(body);\n  });\n}\nconst request = http.request(options,\
  \ handleResponse);\nrequest.end(); \n```\n\n**代码列表 17.22** 为 Web 服务器创建客户端并发送请求\n\
  \n#### 备注\n\n在示例中，你可以从 `response` 对象的 `on()` 方法看到它派自 `EventEmitter`。\n\n### 17.5.4\
  \ 定义路由\n\n当客户端向 Web 服务器发送请求时，服务器必须决定向客户端返回什么响应。这个过程通常被称为路由（routing）：服务器根据客户端的请求选择特定的路由并交付相应的响应。选择路由的标准可以包括，例如请求的\
  \ URL、传输的参数或使用的 HTTP 方法。代码列表 17.23 展示了这样一个示例。根据请求的 URL（存储在 `request` 对象的 `url` 属性中），服务器会生成不同的响应：`/`\
  \ URL 返回文本 `Hello World`，`/about` URL 返回文本 `About Us`，`/contact` URL 返回文本 `Contact\
  \ Information`。在所有其他情况下，服务器将生成适当的错误消息并连同 404 状态码返回给客户端。\n\n```\n'use strict';\n\
  const http = require('http');\nhttp.createServer((request, response) => {\n  if(request.url\
  \ === '/') {\n    response.writeHead(200, {'Content-Type': 'text/html;charset=UTF-8'});\n\
  \    response.end('Hello World');\n  } else if(request.url === '/about') {\n   \
  \ response.writeHead(200, {'Content-Type': 'text/html;charset=UTF-8'});\n    response.end('Über\
  \ Uns');\n  } else if(request.url === '/contact') {\n    response.writeHead(200,\
  \ {'Content-Type': 'text/html;charset=UTF-8'});\n    response.end('Contact information');\n\
  \  } else {\n    response.writeHead(404, {'Content-Type': 'text/plain'});\n    response.end('Requested\
  \ URL not found');\n  }\n\n}).listen(8080); \n```\n\n**代码列表 17.23** 根据请求的 URL 向客户端发送不同的响应\n\
  \n在示例中仍然相当容易处理的内容在更复杂的 Web 应用中可能会迅速变得非常混乱。这正是接下来介绍的 Express.js Web 框架所简化这一点之一。\n\
  \n### 17.5.5 使用 Express.js Web 框架\n\nExpress.js ([`expressjs.com`](http://expressjs.com))\
  \ 是一个用于 Node.js 的 Web 框架，它减少了开发 Web 应用的工作。要使用 Express.js，必须通过 `npm install express\
  \ -save` 命令作为本地依赖安装到相应的项目中。\n\n该包的使用见代码列表 17.24。通过 `require()` 引入包后，调用 `express()`\
  \ 会创建一个表示相应 Web 的对象的对象。使用其 `get()` 方法，你可以为 `GET` 请求定义路由，并将 URL 模式和生成给客户端响应的回调函数作为参数传递。该回调函数在\
  \ Express.js 的上下文中也称为中间件函数（middleware function）。\n\n```\n'use strict';\nconst express\
  \ = require('express');\nconst app = express();\napp.get('/', (request, response)\
  \ => {\n  response.send('Hello World');\n});\nconst server = app.listen(8080, ()\
  \ => {\n  const port = server.address().port;\n  console.log(\"Server is running\
  \ at: http://localhost:%s\", port);\n}); \n```\n\n**代码列表 17.24** 使用 express 包的简单服务器（server.js\
  \ 文件的内容）\n\n#### 生成 Express.js 应用\n\n如果你想基于 Express.js 创建 Web 应用，也可以使用 `express-generator`\
  \ 包 ([`github.com/expressjs/generator`](https://github.com/expressjs/generator))。该包提供了一个命令行工具，可用于生成\
  \ Express.js 应用的基础框架。\n\n除了 `get()` 方法外，还有其他方法可用，每个方法都与对应的 HTTP 方法同名：其中其他包括用于 `POST`\
  \ 请求的 `post()`（见代码列表 17.25）、用于 `PUT` 请求的 `put()`（见代码列表 17.26）以及用于 `DELETE` 请求的 `delete()`（见代码列表\
  \ 17.27）。\n\n```\napp.post('/something', (request, response) => {\n  response.send('POST\
  \ request processed');\n}); \n```\n\n**代码列表 17.25** 处理 POST 请求\n\n```\napp.put('/something',\
  \ (request, response) => {\n  response.send('PUT request processed');\n}); \n```\n\
  \n**代码列表 17.26** 处理 PUT 请求\n\n```\napp.delete('/something', (request, response)\
  \ => {\n  response.send('DELETE request processed');\n}); \n```\n\n**代码列表 17.27**\
  \ 处理 DELETE 请求\n\n你可以在表 17.4 中找到 Express.js 提供的同名方法的 HTTP 方法完整列表。\n\n| HTTP 方法 |\
  \ Express.js 中的方法调用 |\n| --- | --- |\n| CHECKOUT | `app.checkout()` |\n\n\n\n\n\n\
  | COPY | `app.copy()` |\n| :--- | :--- |\n| DELETE | `app.delete()` |\n| GET | `app.get()`\
  \ |\n| HEAD | `app.head()` |\n| LOCK | `app.lock()` |\n| MERGE | `app.merge()` |\n\
  | MKACTIVITY | `app.mkactivity()` |\n| MKCOL | `app.mkcol()` |\n| MOVE | `app.move()`\
  \ |\n| M-SEARCH | `app['m-search']()` |\n| NOTIFY | `app.notify()` |\n| OPTIONS\
  \ | `app.options()` |\n| PATCH | `app.patch()` |\n| POST | `app.post()` |\n| PURGE\
  \ | `app.purge()` |\n| PUT | `app.put()` |\n| REPORT | `app.report()` |\n| SEARCH\
  \ | `app.search()` |\n| SUBSCRIBE | `app.subscribe()` |\n| TRACE | `app.trace()`\
  \ |\n| UNLOCK | `app.unlock()` |\n| UNSUBSCRIBE | `app.unsubscribe()` |\n\n表 17.4\
  \ Express.js 中的 HTTP 方法与对应的方法调用\n\n#### 使用中间件\n\nExpress.js 的一个核心部分是我们刚才简要提到的中间件函数。这些函数可以串联起来以处理请求，实现不同的功能，例如\
  \ cookie 解析或更复杂的问题，如安全和访问控制。每个中间件函数都可以访问请求对象（request）、响应对象（response）以及下一个中间件函数（next）。\n\
  \n你可以在列表 17.28 中看到此类中间件示例。在这里使用了 `body-parser` 中间件包，通过它可以解析 HTTP 请求的内容（例如解析为 JSON\
  \ 格式，如列表所示）。解析后的内容可以通过请求对象的 `body` 属性在回调函数中访问。你也可以看到，要使用中间件函数，你需要向应用对象的 `use()`\
  \ 方法传递相应的调用。\n\n```\n'use strict';\nconst express = require('express');\nconst bodyParser\
  \ = require('body-parser');\nconst app = express();\napp.use(bodyParser.json())\n\
  app.get('/', (request, response) => {\n  const json = request.body;\n  // here normal\
  \ processing of the request\n});\napp.listen(8080); \n```\n\n列表 17.28 以 JSON 格式提供请求内容\n\
  \n你可以在列表 17.29 中看到另一个示例。在这里使用了 `cookie-parser` 中间件包，将相应头部中发送的 cookie 解析为数组。该数组随后可以在请求对象的\
  \ `cookies` 属性在回调函数中使用。\n\n```\n'use strict';\nconst express = require('express');\n\
  const cookieParser = require('cookie-parser');\nconst app = express();\napp.use(cookieParser());\n\
  app.get('/', (request, response) => {\n  const cookies = request.cookies;\n  //\
  \ here normal processing of the request\n});\napp.listen(8080); \n```\n\n列表 17.29\
  \ 提供请求的 Cookie\n\n列表 17.30 中所示 `morgan` 中间件包可用于自动记录请求——例如此处所示，记录到特定的文件中。\n\n```\n\
  'use strict';\nconst express = require('express');\nconst fs = require('fs');\n\
  const morgan = require('morgan');\nconst app = express();\nconst accessLogStream\
  \ = fs.createWriteStream(\n  __dirname + '/access.log', \n  {\n    Flags: 'a'}\n\
  \  )\napp.use(morgan('combined', {stream: accessLogStream}))\napp.get('/', (request,\
  \ response) => {\n  // here normal processing of the request\n}); \n```\n\n列表 17.30\
  \ 将所有请求记录到文件\n\n##### 安装中间件包\n\n由于大多数中间件函数都是独立的包，且未包含在 Express.js 中，你必须首先通过 `npm\
  \ install` 安装想要使用的包。要安装示例中显示的所有中间件包，可以使用以下命令：`npm install body-parser cookie-parser\
  \ morgan`。\n\n##### 其他中间件包\n\n可以在此处找到额外的中间件包列表：http://expressjs.com/en/resources/middleware.html](http://expressjs.com/en/resources/middleware.html)。\n\
  \n#### 配置静态文件\n\n为了通过服务器提供静态文件（例如图像、CSS 文件或 JavaScript 文件），之前描述的路由方法几乎没有意义：如果你必须在其中指定每一个图像，路由将变得极其繁琐。\n\
  \n因此，还有专门用于提供静态文件的中间件，它是 Express.js 的一个组成部分。相应的 `express.static()` 函数期望第一个参数为要将其内容作为静态资源提供的目录，可选的第二个参数是配置对象，该对象可用于定义哪些文件类型不被考虑。\n\
  \n例如，在列表 17.31 中，连续多次使用中间件函数将 `styles`、`scripts` 和 `images` 目录标记为静态或使其中的文件可用。这些文件可以通过以下\
  \ URL 访问：http://localhost:8000/images, http://localhost:8000/styles 和 http://localhost:8000/scripts。\n\
  \n```\n'use strict';\nconst express = require('express');\nconst app = express();\n\
  app.use(express.static('styles'));\napp.use(express.static('scripts'));\napp.use(express.static('images'));\
  \ \n```\n\n列表 17.31 提供静态文件\n\n另一种方法是指定一个缀路径，在该路径下提供静态文件。在列表 17.32 中，我们稍微修改了之前的示例，并将\
  \ `static` 前缀传递给 `use()` 方法。这些文件可以通过 http://localhost:8000/static/images, http://localhost:8000/static/styles\
  \ 和 http://localhost:8000/static/scripts 访问。\n\n```\n'use strict';\nconst express\
  \ = require('express');\nconst app = express();\napp.use('static', express.static('styles'));\n\
  app.use('static', express.static('scripts'));\napp.use('static', express.static('images'));\
  \ \n```\n\n列表 17.32 使用前缀路径提供静态文件\n\n\n\n\n\n要使用 `mongodb` 包，你首先需要在某些服务器上安装 MongoDB，或者（对于初学者来说是一个更简单的选项）——在你的开发计算机上进行本地安装。各种操作系统的相应对应安装说明可以在\
  \ [`docs.mongodb.com/manual/installation/`](https://docs.mongodb.com/manual/installation/)\
  \ 处找到。例如，Windows 有一个 MSI 安装文件，Linux 则（取决于发行版的不同）有 `.rpm` 或 `.deb` 包，而在 macOS 上，可以通过\
  \ brew 安装工具最方便地安装 MongoDB。\n\nMongoDB 将记录存储在目录中（例如在 macOS 上，它默认将记录存储在 `/data/db`）。因此，在启动\
  \ MongoDB 之前，你需要确保以下内容：\n\n1. 该目录存在。\n2. 启动 MongoDB 的用户对该目录具有写权限——例如通过以下命令：\n  \
  \  * `sudo mkdir /data/db`\n    * `sudo chmod 777 /data/db`\n\n## 配置 MongoDB 目录\n\
  \n如果你想使用默认目录以外的目录，可以在启动 MongoDB 时使用 `--dbpath` 参数进行定义：`mongod --dbpath <path_to_directory>`。\n\
  \n然后你可以使用 `sudo mongod` 命令（结尾没有 b）启动 MongoDB 服务器。\n\n### 17.6.2 安装 Node.js 的 MongoDB\
  \ 驱动\n\n要在 Node.js 下通过 JavaScript 访问 MongoDB，你需要相应的驱动程序，它以 `mongodb` 包的形式存在，可以通过\
  \ `npm install mongodb` 命令进行安装。\n\n## 17.6.3 建立连接\n\n与 MongoDB 数据库的通信通过 `MongoClient`\
  \ 对象进行，如列表 17.33` 方法，传递数据库的 URL 以及回调函数，该回调会在连接建立或建立连接过程中发生错误时调用。如果连接成功建立，在回调函数内部你就可以访问一个代表数据库的对象。\n\
  \n```\n'use strict';\nconst mongoDB = require('mongodb');                 // Include\
  \ mongodb package\nconst client = mongoDB.MongoClient;                 // Create\
  \ client\nconst url = 'mongodb://localhost:27017/exampleDB';  // URL to the database\n\
  client.connect(url, (error, db) => {                // Establish connection\n  if\
  \ (!error) {                                     // If there is no ...\n       \
  \                                             // ... error, ...\n    console.log('Connection\
  \ established');          // ... the connection ...\n                          \
  \                          // ... was established  \n                          \
  \                          // ... successfully.\n    db.close();               \
  \                      // Close connection\n  } \n}); \n```\n\n**列表 17.33** 建立与\
  \ MongoDB 连接\n\n### 17.6.4 创建集合\n\nMongoDB 将记录存储在集合（collections）中，这等于关系型数据库中的表。要创建一个新集合，你在数据库对象上执行\
  \ `createCollection()` 方法，如列表 17.34 所示。你传递要创建的集合名称以及回调函数，该回调会在集合创建成功或发生错误时调用。在前一种情况下，你会得到一个代表集合的对象（示例中的\
  \ `collection` 对象）。\n\n```\n'use strict';\nconst mongoDB = require('mongodb'); \
  \                // Include mongodb package\nconst client = mongoDB.MongoClient;\
  \                 // Create client\nconst url = 'mongodb://localhost:27017/exampleDB';\
  \  // URL to the database\nclient.connect(url, (error, db) => {                //\
  \ Establish connection\n  if (!error) {                                      \n\
  \    db.createCollection(                            // Create collection\n    \
  \  'persons',                                    // Name of collection\n      (error,\
  \ collection) => {                      // Callback handler\n        if(!error)\
  \ {\n          console.log('Collection created');\n        }\n        db.close();\n\
  \      }\n    );\n  }\n}); \n```\n\n**列表 17.34** 在 MongoDB 数据库中创建集合\n\n### 创建集合的替代方法\n\
  \n作为 `createCollection()` 方法的替代，你也可以使用 `collection()`。区别在于，后者在集合中存储第一个条目之前不会创建该命名的集合。\n\
  \n使用 MongoDB（与其他数据库一样）基于四个基本数据操作：创建、读取、更新和删除（CRUD）。在接下来的四个部分中，我们将展示如何在 MongoDB 数据库中执行这些操作操作。\n\
  \n### 17.6.5 保存对象\n\n要保存对象，可以在代表集合的对象可以使用 `insert()` 方法。其示例见列表 17.35：在这里，在连接数据库并创建集合后，创建了一个\
  \ `person` 对象并通过 `insert()` 将添加到集合中。\n\n```\n'use strict';\nconst mongoDB = require('mongodb');\
  \                 // Include mongodb package\nconst client = mongoDB.MongoClient;\
  \                 // Create client\nconst url = 'mongodb://localhost:27017/exampleDB';\
  \  // URL to the database\nclient.connect(url, (error, db) => {                //\
  \ Establish connection\n  if (!error) {                                     \n \
  \   db.collection(                                  // Create collection\n     \
  \ 'persons',                                    // Name of collection\n      (error,\
  \ collection) => {                      // Callback handler\n        if(!error)\
  \ {                                \n          const person = {                \
  \          // Object to be...\n            firstName:'John',                   \
  \    // ... saved\n            lastName: 'Doe'                         \n      \
  \    };                                        \n          collection.insert(  \
  \                      // Saving the ...\n            person,                  \
  \               // ... object\n           (error, result) => {                 \
  \    // Callback handler\n              if(!error) {\n                console.log(result);\n\
  \              }\n              db.close();\n            }\n          );\n     \
  \   }\n      }\n    );\n  }\n}); \n```\n\n**列表 17.35** 在集合中保存对象\n\n### 17.6.6 读取对象\n\
  \n要从集合中读取对象，使用 `find()` 方法。如果不带参数，它将返回相应集合中包含的所有对象（见列表 17.36）。\n\n\n\n\n\n```javascript\n\
  'use strict';\nconst mongoDB = require('mongodb');                 // Include mongodb\
  \ package\nconst client = mongoDB.MongoClient;                 // Create client\n\
  const url = 'mongodb://localhost:27017/exampleDB';  // URL to the database\nclient.connect(url,\
  \ (error, db) => {                // Establish connection\n  if (!error) {     \
  \                                \n    const collection = db.collection('persons');\
  \    // Find collection\n    const cursor = collection.find();               //\
  \ Create cursor\n    cursor.each( (error, document) => {             // Iterate\
  \ cursor\n      if(document) {                                \n        console.log(\
  \                                \n          document._id,                     \
  \        // internal ID\n          document.firstName,                       //\
  \ here: \"John\"\n          document.lastName                         // here: \"\
  Doe\"\n        );\n      } else {\n        db.close();\n      }\n    });\n  }\n\
  }); \n```\n\n 列表 17.36 从集合中读取所有对象\n\n如果你只想选择符合特定标准的对象，可以选择向 `find()` 方法传递一个相应的配置对象。例如，在列表\
  \ 17.37 中，执行的搜索结果仅包含 `lastName` 属性值为 `Doe` 的对象。\n\n```javascript\n'use strict';\n\
  const mongoDB = require('mongodb');                 // Include mongodb package\n\
  const client = mongoDB.MongoClient;                 // Create client\nconst url\
  \ = 'mongodb://localhost:27017/exampleDB';  // URL to the database\nclient.connect(url,\
  \ (error, db) => {                // Establish connection\n  if (!error) {\n   \
  \ const collection = db.collection('persons');    // Find collection\n    const\
  \ cursor = collection.find(                 // Create cursor\n      {          \
  \                                   // only persons...\n        lastName:      \
  \                             // ... whose last name is...\n        'Doe'      \
  \                                 // ... Doe\n      }\n    );\n    cursor.each(\
  \ (error, document) => {\n      if(document) {\n        console.log(\n         \
  \ document._id,\n          document.firstName,\n          document.lastName\n  \
  \      );\n      } else {\n        db.close();\n      }\n    });\n  }\n}); \n```\n\
  \n 列表 17.37 按属性搜索对象\n\n此外，你还可以在配置对象中使用比较、逻辑 AND 以及逻辑 OR（或）链接（参见表 17.5）。\n\n| 属性\
  \ | 描述 |\n| --- | --- |\n| 大于 | `find({ 'age': { $gt: 30 } })` |\n| 小于 | `find({\
  \ 'age': { $lt: 30 } })` |\n| 逻辑 AND | `find({ 'lastName': 'Doe', 'age': 30 })`\
  \ |\n| 逻辑 OR | `find({ $or: [{ 'lastName': 'Doe' }, { 'age': 30 }] })` |\n\n表 17.5\
  \ 各种搜索标准概述\n\n### 17.6.7 更新对象\n\n集合提供了三种不同的方法来更新对象：使用 `updateOne()` 可以更新单个对象，使用\
  \ `updateMany()` 更新多个对象，而使用 `replaceOne()` 可以替换对象。这三种方法都期望三个参数：一个描述要更新对象的配置对象，一个描述要进行更改的配置对象，以及一个更新更新完成后或发生错误时调用的回调函数。`updateOne()`\
  \ 的用法示例在列表 17.38 中。\n\n```javascript\n'use strict';\nconst mongoDB = require('mongodb');\
  \                 // Include mongodb package\nconst client = mongoDB.MongoClient;\
  \                 // Create client\nconst url = 'mongodb://localhost:27017/exampleDB';\
  \  // URL to the database\nclient.connect(url, (error, db) => {                //\
  \ Establish connection\n  if (!error) {                                     \n \
  \   const collection = db.collection('persons');    // Find collection\n    collection.updateOne(\
  \                           // Update object ...\n      {                      \
  \                       // ... which applies ...\n        firstName: 'John',   \
  \                       // ... to these ...\n        lastName: 'Doe'           \
  \                  // ... properties\n      },                                 \
  \           \n      {                                              Update the ...\n\
  \        $set: {                                     // ... object with ...\n  \
  \        firstName: 'James'                        // ... these ...\n        } \
  \                                          // ... properties\n      }, \n      (error,\
  \ results) => {\n        if(!error) {\n          console.log(results);\n       \
  \ }\n        db.close();\n      }\n    )\n  }\n}); \n```\n\n 列表 17.38 更新集合中的对象\n\
  \n### 17.6.8 删除对象\n\n要从集合中删除对象，你可以使用两种方法：`deleteOne()` 方法删除单个对象，而 `deleteMany()`\
  \ 方法删除多个对象。两种方法都期望一个配置对象作为参数，描述要删除的对象。例如，在列表 17.39 中，调用 `deleteMany()` 将删除 `persons`\
  \ 集合中所有 `lastName` 属性值为 `Doe` 的记录。\n\n```javascript\n'use strict';\nconst mongoDB\
  \ = require('mongodb');                 // Include mongodb package\nconst client\
  \ = mongoDB.MongoClient;                 // Create client\nconst url = 'mongodb://localhost:27017/exampleDB';\
  \  // URL to the database\nclient.connect(url, (error, db) => {                //\
  \ Establish connection\n  if (!error) {                                   \n   \
  \ const collection = db.collection('persons');   // Find collection\n    collection.deleteMany(\
  \                         // Delete persons ...\n      {                       \
  \                    // ... whose last name is ...\n        lastName: 'Doe'    \
  \                              // ... Doe\n      },\n      (error, results) => {\n\
  \        if(!error) {\n          console.log(results);\n        }\n        db.close();\n\
  \      }\n    );\n  }\n}); \n```\n\n 列表 17.39 从集合中删除对象\n\n###### MEAN 栈\n\n\n\n\n\
  \n在 Node.js 的 Web 应用开发中，你可能会遇到 MEAN（或 MEAN 栈）这个术语。它是过程中使用的四种基础技术的缩写：作为 MongoDB (M)，Express.js\
  \ 作为服务器端 Web 框架 (E)，Angular 作为客户端 Web 框架 (A)，最后是 Node.js (N)。\n\n## 17.7 使用流（Streams）\n\
  \nNode.js 中一个起着重要作用的概念是流（streams）。这指的是用于读取或写入数据的数据流。与其他输入输出类型相比，流的优势在于它们的性能，以及可以非常方便地组合流。\n\
  \n### 17.7.1 流的介绍和类型\n\n总来说，Node.js 提供了四种类型的流：\n\n- 可读流（Readable streams）用于从数据流中读取数据。\n\
  - 另一方面，可写流（writable streams）可以向数据流写入数据。\n- 双工流（Duplex streams）是可以同时用于读取和写入数据的流。\n\
  - 转换流（Transform streams）则构建在双工流的基础上，但它们提供了更简化的 API（参见图 17.3）。\n\n![Different Types\
  \ of Streams](img/img-f17.3.html)\n\n**图 17.3** 不同类型的流\n\n### 17.7.2 流的用例\n\n在具有连续数据流，或者在读写数据时可能会出现性能或内存问题的情况下，使用流总是有意义的。例如，如果你处理大量数据（如大图像、视频或日志文件）或从\
  \ Web 服务器下载大文件，你就应该使用流。对比一下：如果你不使用流读取大文件（例如如之前所示，在 Node.js 中使用 `fs` 包中的 `readFile()`\
  \ 方法），则整个文件必须加载到内存中！取决于文件的大小和可用内存，这可能会迅速导致性能或内存问题。然而，通过流，数据可以分块读取并分块进行处理。\n\n除了处理大文件外，流的使用在许多其他处理数据的场景中也有用。因此，流也适用于处理在服务器上的来自客户端的（大型）HTTP\
  \ 请求。例如，如果你想实现一个客户端能够向服务器上传文件的应用程序，你绝对应该基于流来实现相应的上传过程。当然，如果 Web 应用需要从服务器下载大文件，反之也是如此。流的进一步应用领域包括通过\
  \ socket 传输数据，以及在相应的父过程中处理子进程的标准输出和标准错误输出。\n\n此外，许多 Node.js 包以流 API 的形式提供其接口，使得它们非常容易组合和/或集成到现有的流架构中。例如，你可以通过流读取文件（使用\
  \ `fs` 模块的流），然后对其加密（使用 `crypto` 模块的流），然后对其压缩（使用 `zlib` 模块的流）。但在查看这种被称为“管道”（piping）的技术之前，让我们先简要看看如何使用流来读写数据。\n\
  \n### 17.7.3 使用流读取数据\n\n在第 17.4.1 节中，你学习了如何在 Node.js 中读取文件。那里所示方法的缺点是 `readFile()`\
  \ 方法及其同步变体 `readFileSync()` 在你通过代码访问内容之前，会将对应文件的内容完全读取到内存中。对于大文件，这会导致前面提到的的内存问题。\n\
  \n要使用流读取文件内容，你使用 `createReadStream()` 方法（同样来自 `fs` 包），如代码列表 17.40 所示，首先为对应文件创建一个可读流。默认情况下，可读流将读取的数据作为原始二进制缓冲区。或者，如列表所示，你可以向\
  \ `createReadStream()` 方法传递一个配置对象，并通过 `encoding` 属性定义要使用的编码。\n\n由于所有流类都是基于事件的，因此它们继承自\
  \ `EventEmitter` 类（Node.js API 中支持事件的默认类；第 17.3 节），可以通过 `on()` 方法注册各种事件监听器。例如，`readable`\
  \ 事件信号流中有新数据可用，然后可以通过调用 `read()` 方法进行读取。另一方面，`end` 事件在流中没有更多数据且到达数据末尾时被调用。\n\n```\n\
  'use strict';\nconst fs = require('fs');\nconst path = require('path');\n\nconst\
  \ INPUT = path.join(__dirname, '..', 'large.file');\n\nconst readableStream = fs.createReadStream(INPUT,\
  \ {\n  encoding: 'utf-8'\n});\n\nreadableStream.on('readable', () => {\n  const\
  \ data = readableStream.read();\n  console.log(data);\n});\n\nreadableStream.on('end',\
  \ () => {\n  console.log('File reading completed');\n}); \n```\n\n**代码列表 17.40**\
  \ 通过流读取文件\n\n基本上，流 API 区分了两种不同的模式：在暂停模式下（在代码列表 17.41 所示），如前面所述，通过 `readable` 事件通知流中有数据准备好读取。读取这些数据必须通过调用\
  \ `read()` 方法主动触发。因此，数据的消费者设置速度。\n\n另一方面，第二种模式是流式模式（flowing mode），数据源的数据以尽可能快的速度写入中；也就是说，数据的生产者指定速度。如果生产者发送数据的速度快于消费者处理的速度，数据可能会丢失。这种模式默认不启用，必须先显式启用——例如通过为\
  \ `data` 事件注册事件监听器，如代码列表 17.41 所示。\n\n```\n'use strict';\nconst fs = require('fs');\n\
  const path = require('path');\n\nconst INPUT = path.join(__dirname, '..', 'large.file');\n\
  \nconst readableStream = fs.createReadStream(INPUT);\n\nreadableStream.on('data',\
  \ (data) => {\n  console.log(data.toString('utf-8'));\n});\n\nreadableStream.on('end',\
  \ () => {\n  console.log('File reading completed');\n}); \n```\n\n**代码列表 17.41**\
  \ 流式模式读取文件\n\n### 17.7.4 使用流写入数据\n\n如何使用可写流写入（大）文件在代码列表 17.42 所示。与之前用于创建可读流的 `createReadStream()`\
  \ 方法类似，这里首先使用 `createWriteStream()` 方法创建一个可写流。你可以使用 `write()` 方法向流写入数据。作为第一个参数，你传递要写入的数据，以字符串形式或缓冲区形式。可选地，你可以使用第二个参数定义数据的编码，并使用第三个参数定义在相应数据写入后调用的回调函数。\n\
  \n\n\n\n\n要发送已完成写入数据的信号，你可以使用 `end()` 方法。该方法的签名与 `write()` 方法相同，但与后者不同，`end()` 中的三个参数都是可选的：作为第一个参数，你可以传递额外的数据，以便在关闭流之前将其写入流中；作为第二个参数，你可以定义使用的编码；作为第三个参数，你可以传递一个回调函数，该函数会在流的写入和关闭完成后被调用。\n\
  \n```javascript\n'use strict';\nconst fs = require('fs');\nconst path = require('path');\n\
  \nconst INPUT = path.join(__dirname, '..', 'large.file');\n\nconst writableStream\
  \ = fs.createWriteStream(INPUT);\n\nfor (let i = 0; i <= 100000; i++) {\n  writableStream.write(\n\
  \    'Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod \n\
  tempor incididunt ut labore et dolore magna aliqua...\\n',\n    'utf-8',\n    ()\
  \ => {\n      // 数据写入时的回调\n    }\n  );\n}\n\nwritableStream.end(\n    'Last line',\n\
  \    'utf-8',\n    () => {\n      // 数据写入完成的回调\n    }\n); \n```\n\n列表 17.42 通过可写流写入文件\n\
  \n### 17.7.5 使用管道（Piping）组合流\n\n流的一个优势是前面提到的管道选项。这使得将多个流相互组合或将它们一个接一个地连接成为可能。这允许将数据从可读流（或转换流）传递到可写流（或转换流）。管道类似于\
  \ Unix Shell 中的概念概念概念在 Shell 中，命令行命令可以使用 `|` 符号（管道符号）以许多不同的方式组合在一起。\n\n原则上，流的管道在\
  \ Node.js 中是这样工作的，如 列表 17.43 所示，使用的是 `pipe()` 方法。\n\n```javascript\nreadableStream\n\
  \  .pipe(transformStream1).\n  .pipe(transformStream2).\n  .pipe(writableStream);\
  \ \n```\n\n列表 17.43 管道原理\n\n为了让整个过程更具象感和实用性，我们后面有一个示例，可以在 Node.js 中使用管道非常轻松地解决：压缩（zipping）和解压（unzip）文件。\n\
  \n#### 实例示例：压缩文件\n\n对于压缩和解压，Node.js API 提供了 `zlib` 模块 ([`nodejs.org/api/zlib.html`](https://nodejs.org/api/zlib.html))，它直接为这些操作提供了相应的流。\n\
  \n在 列表 17.44 中，你可以看到如何使用此 API 和流来压缩文件。为此，总共创建了三个流：如你所知，`fs.createReadStream()` 方法用于创建一个可读流，用于从文件中读取要压缩的数据。`zlib.createGzip()`\
  \ 方法则创建一个执行实际压缩的转换流。随后，通过调用 `fs.createWriteStream()` 创建一个可写流，这反过来确保了压缩后的数据被写入（新）文件中。\n\
  \n初始化三个流后，使用 `pipe()` 方法将它们串联起来。该方法首先在可读流（`inputStream`）上调用，并将应将读取数据重定向的流（即名为 `gzipStream`\
  \ 的流）作为参数传递。因为 `pipe()` 的返回值也是流，因此单独的调用可以非常清晰地排序。因此，在第二步中，通过再次调用 `pipe()` 将来自 `gzipStream`\
  \ 的压缩数据传递给可写流（`outputStream`），最后将数据写入目标文件。\n\n```javascript\n'use strict';\nconst\
  \ fs = require('fs');\nconst path = require('path');\nconst zlib = require('zlib');\n\
  \nconst INPUT = path.join(\n  __dirname, \n  '..', \n  'data', \n  'input', \n \
  \ 'someFile.txt'\n);\nconst OUTPUT = path.join(\n  __dirname, \n  '..', \n  'data',\
  \ \n  'someFile.txt.gz'\n);\n\n// 1\\. 读取要压缩文件的流\nconst inputStream = fs.createReadStream(INPUT);\n\
  \n// 2\\. 用于压缩读取数据的流\nconst gzipStream = zlib.createGzip();\n\n// 3\\. 用于写入存档文件的流\n\
  const outputStream = fs.createWriteStream(OUTPUT);\n\ninputStream             //\
  \ 读取文件\n  .pipe(gzipStream)     // 压缩读取的文件\n  .pipe(outputStream);  // 写入存档文件 \n\
  ```\n\n列表 17.44 使用流压缩文件\n\n#### 实例示例：解压文件\n\n相反，之前压缩的数据也可以通过管道同样容易地解压。你可以在 列表 17.45\
  \ 中看到此处的源代码。该过程与之前的类似，只是方向相反：首先，通过可读流读取压缩文件。它的输出随后通过调用 `pipe()` 方法作为执行解压的流（`gunzipStream`）的输入。它的输出反过来作为可写流的输入，最后将解包的数据写入目标文件。\n\
  \n```javascript\n'use strict';\nconst fs = require('fs');\nconst path = require('path');\n\
  const zlib = require('zlib');\n\nconst INPUT = path.join(__dirname, '..', 'data',\
  \ 'someFile.txt.gz');\nconst OUTPUT = path.join(__dirname, '..', 'data', 'output');\n\
  const OUTPUT_FILE = path.join(OUTPUT, 'someFile.txt');\n\nfs.emptyDirSync(OUTPUT);\n\
  \n// 1\\. 读取要解压文件的流\nconst inputStream = fs.createReadStream(INPUT);\n\n// 2\\.\
  \ 用于解压读取数据的流\nconst gunzipStream = zlib.createGunzip();\n\n// 3\\. 用于写入存档文件的流\n\
  const outputStream = fs.createWriteStream(OUTPUT_FILE);\n\ninputStream         \
  \    // 读取文件\n  .pipe(gunzipStream)   // 解压读取的文件\n  .pipe(outputStream);  // 写入存档文件\n\
  ```\n\n列表 17.45 使用流解压缩文件\n\n### 17.7.6 管道过程中的错误处理\n\n使用 `pipe()` 方法虽然简单，但它并没有提供直接的错误处理。这意味着什么？答案很简单：如果在流管道中的任何一点发生错误，该错误不会传递给其他流。这反过来导致这些流无法自动关闭，随后可能会导致内存问题。\n\
  \n因此，Node.js 版本 10 引入了 `pipeline()` 函数，它正解决了这个问题。列表 17.46 显示了如何相应地调整压缩示例。作为参数，你将要串联连接的各个流作为管道传递给\
  \ `pipeline()` 函数。可选地，可以作为最后一个参数传递回调函数，该函数会在管道内发生错误时被调用。恰好在这一点上，你现在有了响应错误并执行任何清理工作（例如关闭流等）的选择。\n\
  \n\n\n\n\n```\n'use strict';\nconst fs = require('fs');\nconst path = require('path');\n\
  const zlib = require('zlib');\nconst { pipeline } = require('stream');\n\nconst\
  \ INPUT = path.join(__dirname, '..', 'data', 'input', 'someFile.txt');\nconst OUTPUT\
  \ = path.join(__dirname, '..', 'data', 'someFile.txt.gz');\n\nconst inputStream\
  \ = fs.createReadStream(INPUT);\nconst outputStream = fs.createWriteStream(OUTPUT);\n\
  const gzipStream = zlib.createGzip();\n\npipeline(\n  inputStream, \n  gzipStream,\
  \ \n  outputStream, \n  (error) => {\n    if (error) {\n      console.error('Compression\
  \ failed.');\n    } else {\n      console.log('Compression successful.');\n    }\n\
  \    // Perform cleanup ...\n    // ... for example, close streams, etc.\n  }\n\
  ); \n```\n\n列表 17.46 Node.js 10 之后的流错误处理\n\n## 17.8 总结\n\n在本章中，我们向您简要介绍了 Node.js，这是一种\
  \ JavaScript 的运行时环境和平台，对近年来 JavaScript 的再次成功做出了巨大贡献。如果您想深入研究 Node.js，我们可以向您推荐另一本关于该主题的书，它同样由\
  \ Rheinwerk Publishing 出版：Sebastian Springer 编写的《Node.js: The Comprehensive Guide》，这本书对\
  \ Node.js 进行了全面的介绍。我有幸为那本书提供了我的技术专家意见。\n\n现在，请记住本章的以下几点：\n\n*   Node.js 是一个单线程服务器，由以下主要组件组成：\n\
  \    *   事件循环，定期处理发送到 Node.js 服务器的新请求并对事件做出响应\n    *   若干内部工作线程，用于执行阻塞输入输出操作（另一方面，非阻塞输入输出操作由事件循环直接处理）\n\
  \    *   V8 运行时环境，它也被用于 Google Chrome\n    *   用 C 或 C++ 编写的原生模块，它们作为对 JavaScript\
  \ 无法直接实现的功能的封装器\n*   Node.js 模块（也称为包）也通过 Node.js 包管理器进行。\n*   Node.js 已经带了许多默认包，但互联网上针对几乎任何用例都有极其丰富的其他包。\n\
  *   您可以通过标准的 `fs` 包与文件系统交互：您可以创建或删除文件和目录、读取文件信息等。\n*   标准的 `events` 包支持事件驱动编程。其中包含的\
  \ `EventEmitter` 类型可用于注册事件监听器并触发事件。Node.js 中的许多其他对象都继承自 `EventEmitter`，因此也具有相应的\
  \ `on()` 和 `emit()` 方法。\n*   使用标准的 `http` 包，您可以在几分钟内创建自己的 Web 服务器。\n*   Express.js\
  \ 是一个 Web 框架，在构建 Web 应用程序时可以为您节省大量工作。它可以通过中间件包进行模块化扩展，增加额外的功能，例如将请求文本解析为 JSON、将\
  \ cookie 头解析为相应的数组或记录请求。\n*   `mongodb` 包可以访问 MongoDB 数据库，这是一种基于文档的 NoSQL 数据库，以\
  \ JSON 格式存储文档。\n*   使用 `Stream` API，可以分段读取或写入数据。当您处理大量大数据时，这总是很有意义的——例如读取非常大的文件或向服务器上传大图像文件。\n\
  \n# 18 使用 JavaScript 创建移动应用程序\n\n对于您来说，近年来智能手机和平板电脑等移动设备的使用量巨大应该不是新鲜事了。因此，移动应用程序（或\
  \ App）是一个规模巨大的市场——JavaScript 已经参与其中多年了。\n\n在本章中，我们将向您展示如何使用 JavaScript 创建移动应用程序。作为目前为该目的而存在的许多库的代表，我们将引入\
  \ React Native 作为示例。但在此之前，我们将先向您概述不同类型的移动应用程序。\n\n## 18.1 移动应用程序的不同类型\n\n基本上，移动应用程序分为原生应用程序、移动\
  \ Web 应用程序和混合应用程序。\n\n### 18.1.1 原生应用程序\n\n原生应用程序（也称为原生应用）是专门为特定的（移动）操作系统（如 Android\
  \ 或 iOS）开发的应用程序，因此可以优化地利用其功能和特性。\n\n#### 技术\n\n例如，使用 Android 作为操作系统的智能手机和平板电脑，原生应用程序是用\
  \ Java 或 Kotlin（使用 Android SDK）开发的。另一方面，对于 iPhone 和 iPad 等苹果设备，原生应用程序是用 Objective-C\
  \ 或 Swift 开发的。对于 Windows Mobile，则使用 Visual C#。\n\n#### 优势\n\n原生应用程序的优势在于正如前面提到的，您可以优化地访问相应终端设备的功能和特性。此外，在性能方面，原生应用程序仍然比后几节介绍的其他类型应用程序快，因为整个应用程序在执行之前已经针对相应的操作系统进行了编译（参见图\
  \ 18.1）。另一个优势是现有的文档和其他资源，这些通常由制造商直接提供。此外，相应的社区也非常出色。\n\n![原生应用程序可以访问原生功能](img/img-f18.1.html)\n\
  \n图 18.1 原生应用程序可以访问原生功能\n\n#### 劣势\n\n长期以来，原生应用程序的一个大缺点是必须为每个操作系统实现一个单独的版本。开发成本、所需的开发者知识以及维护工作也相应的高昂：如有疑问，团队至少需要一个\
  \ Android 或 Java 开发者、一个 Objective-C 或 Swift 开发者，以及一个负责实现 Windows Mobile 版本的人。\n\n\
  ### 18.1.2 移动 Web 应用程序\n\n移动 Web 应用程序（移动 Web App）正如其名，是普通的 Web 应用程序，但针对移动设备的使用进行了优化。\n\
  \n#### 技术\n\n移动 Web 应用程序使用 HTML5、CSS3 和 JavaScript 开发，并采用响应式设计原则（这就是为什么它们有时被称为 HTML5\
  \ 应用或响应式应用），然后在相应的终端设备上安装的浏览器中运行。与普通网站一样，应用程序的源代码位于服务器上，然后下载到终端设备并在那里执行。\n\n######\
  \ 响应式设计和 CSS3 媒体查询\n\n响应式设计或响应式 Web 设计是指网站开发中的一种范式，其中网站的布局适应查看该网站的终端设备的分辨率。CSS3\
  \ 媒体查询在这里主要用于为特定分辨率定义 CSS 规则。\n\n#### 优势\n\n\n\n\n移动端应用程序（Web Applications）的优势在于可以相对容易地导入更新，由于更新是在服务器端导入的，这会直接影响到所有分布式应用。另一个优势是，你只需要创建一个版本的应用程序，它就可以运行在所有常见的移动操作系统上（尽管这一优势在\
  \ `React Native` 等解决方案的面前又变得不那么明显了）。这既减少了初始开发工作和相关的开发成本，也减少了维护工作和相应的维护成本。开发者“仅需”\
  \ `HTML`、`JavaScript` 和 `CSS` 知识即可实现这类应用程序。\n\n## 缺点\n\n移动端 Web 应用的一个缺点是，出于安全考虑，其对原生硬件功能（如\
  \ `GPS`、`camera`、`microphone` 等）的访问受限（参见图 18.2）。此外，此类应用程序无法像原生应用程序一样安装在终端设备上，而必须始终在浏览器中运行。\n\
  \n![移动 Web 应用通常无法访问原生功能](img/img-f18.2.html)\n\n**图 18.2** 移动 Web 应用通常无法访问原生功能\n\
  \n### W3C 标准\n\n尽管 W3C 现在已经发布或正在制定许多不同的规范，以标准化对移动设备硬件功能的访问（例如，`Geolocation API`、[www.w3.org/TR/geolocation-API/](http://www.w3.org/TR/geolocation-API/)\
  \ 或 `Battery Status API`、[www.w3.org/TR/battery-status](http://www.w3.org/TR/battery-status)），但要让所有能够想象到的功能都通过\
  \ API 标准化并由各种移动浏览器相应实现，还需要一段时间时间。\n\n### 18.1.3 混合应用程序\n\n混合应用程序（hybrid apps）采用混合方法，尝试将原生应用程序的优势与移动\
  \ Web 应用的优点结合起来。\n\n原则上，移动端 Web 应用显示在原生应用程序内部。为了这一目的，`Android` 或 `iOS` 等相应平台提供了\
  \ `web views`，这是一种特殊的 GUI 组件，包含渲染引擎并可以显示 Web 应用程序的内容。Web 应用程序可以从服务器加载，也可以在相应的混合应用程序中离线保留。\n\
  \n#### 技术\n\n与移动 Web 应用一样，用于混合应用程序的技术用的是 `HTML5`、`CSS3` 和 `JavaScript`。此外，还需要一个原生部分来构成应用程序的（原生）框架，并提供诸如\
  \ `web view` 组件。你可以使用应用程序的原生部分将混合应用程序像原生应用一样安装在相应的终端设备上（顺便也可以使其可以在应用商店下载），并访问移动平台的各种硬件功能和特性（参见图\
  \ 18.3）。\n\n![原生容器允许从混合应用程序的 JavaScript 代码访问原生功能](img/img-f18.3.html)\n\n**图 18.3**\
  \ 原生容器允许从混合应用程序的 JavaScript 代码访问原生功能\n\n#### 优点\n\n混合应用结合了原生应用和移动 Web 应用的优势：它们可以原生安装，大多数情况下与平台无关，并且实际上“仅需”\
  \ `HTML5`、`CSS3` 和 `JavaScript` 知识。\n\n#### 缺点\n\n但也有缺点，尽管与优点相比是较小的：像 `Cordova`\
  \ ([`cordova.apache.org`](https://cordova.apache.org)) 这样的框架尝试为不同的硬件功能和移动平台特性实现\
  \ API，并保持这些接口尽可能通用——也就是说，它们代表了不同移动平台的“最小公约数”。然而，在某些情况下，一个平台提供的硬件功能可能与另一个不同，而这些通用\
  \ API 并没有考虑到这些差异。简而言之：在此方面，原生应用程序仍然比混合应用程序提供了更多机会。\n\n### 18.1.4 不同方法的比较\n\n选择哪种描述的类型来开发应用程序取决于多种因素：你是否想在应用商店中提供该应用程序？如果是，则可以排除移动\
  \ Web 应用，你必须开发原生应用或混合应用。应用程序是否必须尽可能快——也就是说，性能尽可能高？如果是，你可能会选择原生应用程序，因为它们使用了编译代码，其执行速度比\
  \ `JavaScript` 快。\n\n表 18.1 中提供了适用于你各自项目的应用程序类型的概述，可能还提供了决策支持，该表从不同的相关方面对这三种类型进行了比较。\n\
  \n| 方面 | 原生 | Web 端 | 混合 |\n| --- | --- | --- | --- |\n| 开发 | 每个平台必须创建一个应用程序。 |\
  \ 仅需开发一个应用程序，即可在所有平台上运行。 | 仅需开发一个应用程序，由于有了相应的原生组件，它可以像原生应用一样安装。 |\n| 编程语言和其他语言 |\
  \ `Objective-C`、`Swift`、带有 `Android SDK` 的 `Java`、`Visual C#` | `HTML5`、`CSS3`、`JavaScript`\
  \ | 加上每个平台的原生组件，HTML5、CSS3、JavaScript |\n| 平台无关性 | 否 | 是 | 是 |\n| 开发工作和成本 | 高 |\
  \ 低 | 中 |\n| 维护工作和成本 | 高 | 低 | 中 |\n| 平台间的复用性 | 低 | 高 | 高 |\n| 离线使用 | 在原生应用程序的不同视图之间切换通常不需要互联网。只有当应用程序使用在线功能时（例如访问\
  \ Web 服务）才需要互联网。 | 使用移动 Web 应用在这里往往需要连接互联网。但这可以通过 `HTML5` 特性（如应用程序缓存和离线数据库）来缓解。\
  \ | 混合应用程序通常不需要互联网，除非应用程序本身访问互联网。 |\n| 性能 | 原生应用程序与其它类型移动应用相比具有高性能，因为它们使用编译代码。 |\
  \ 移动 Web 应用是三种类型中最慢的。原因之一是用 `JavaScript` 编写的移动 Web 应用是被解释的（对比：原生应用程序的代码是编译的）。 |\
  \ 混合应用程序通常比原生应用程序慢，但比移动 Web 应用快。 |\n| 部署 | 原生应用通常从相应的应用商店下载安装。 | 移动 Web 应用托管在服务器上，不安装在终端设备上。\
  \ | 混合应用像原生应用一样从相应的应用商店下载安装。 |\n\n**表 18.1** 不同类型移动应用的比较\n\n### 注意\n\n`jQuery Mobile`\
  \ ([`jquerymobile.com`](https://jquerymobile.com)) 和 `Apache Cordova` ([`cordova.apache.org`](https://cordova.apache.org))\
  \ 库在近年来变得越来越不重要。如今人们使用更现代的解决方案，如 `NativeScript` ([`nativescript.org`](https://nativescript.org))、`Ionic`\
  \ ([`ionicframework.com`](https://ionicframework.com)) 或 `React Native` ([`reactnative.dev`](https://reactnative.dev))，后者将在后续节中介绍。\n\
  \n\n\n\n# 18.2 使用 React Native 创建移动应用程序\n\nReact Native ([`reactnative.dev/`](https://reactnative.dev/))\
  \ 基于 React Web 框架，它是与 Angular 和 Vue.js 一样最流行的框架之一。原则上说，如果你在开始使用 React Native 之前已经获得了\
  \ React 框架的经验，无疑是一个优势。然而，由于两者都基于 JavaScript，你应该能够在在没有任何 React 知识的情况下跟上以下示例。在涉及更多\
  \ React 特有的地方，我们会在相关点提供背景信息。\n\nReact Native 的目标是通过提供 UI 组件（它们具有移动应用原生 UI 组件——也称为控件——的典型外观和感受）以及定义应用程序各个“页面”之间过渡的能力，来促进移动\
  \ Web 应用程序的发展。\n\n### 18.2.1 React Native 的原理\n\n使用 React Native 可以正如其名，为移动设备创建具有原生\
  \ UI 的混合应用程序（原生应用）。这的方便之处在于，你可以使用 JavaScript 来实现应用程序，然后 React Native 会负责将这些代码转换为相应移动操作系统的“正确形状”。对于开发者来说，这是一个巨大的优势：你不需要学习新的编程语言来创建原生应用——不需要用\
  \ Swift 来构建原生 iOS 应用，也不需要 Java 来构建原生 Android 应用。这再次说明了 JavaScript 变得多么重要和通用。\n\n\
  ### 18.2.2 安装与项目初始化\n\n原则上，有几种方法安装 React Native 并创建基于 React Native 的应用程序。标准方法是通过\
  \ Expo 工具 ([`expo.io`](https://expo.io))，它使得应用程序的构建和部署过程变得简单得多。要使用该工具，必须将其作为全局 Node.js\
  \ 包安装——例如通过 NPM。执行此操作的命令是 `npm install --global expo-cli`。然后你可以使用 `expo` 命令，该命令又有几个子命令。\n\
  \n创建一个基于 React Native 的新项目，只需使用 `expo init` 命令并加上你想创建的应用程序名称：\n\n```\nexpo init\
  \ hello-world\n```\n\n随后将打开一个命令行向导，引导你完成应用程序的配置。你可以选择不同的模板，并从中选择所使用的编程语言（JavaScript\
  \ 和 TypeScript 可供选择）。在此选择默认的空白模板，以便使用 JavaScript 作为编程语言。\n\n此命令会创建一组文件和目录。快速查看 表\
  \ 18.2 以了解其具体内容，并获取 React Native 应用中典型项目结构的概述。\n\n| 文件/目录 | 描述 |\n| --- | --- |\n\
  | .expo | 包含 Expo 的配置文件 |\n| .expo-shared | 包含优化后的文件 |\n| assets | 包含额外的文件，如图像、视频和音频文件\
  \ |\n| node_modules | 应用程序所需的外部依赖（库和包） |\n| .gitignore | 用于定义哪些文件应该被 Git 版本管理系统忽略的配置文件（参见第\
  \ 21 章) 的配置文件 |\n| package.json | 配置文件，可以在其中配置应用程序使用的依赖项或脚本 |\n| yarn.lock | 用于（自动）记录应用程序具体使用了哪些依赖项的精确版本的文件\
  \ |\n\n**表 18.2** Expo 为 React Native 应用程序生成的文件和目录\n\n## 18.2.3 启动应用程序\n\n`expo`\
  \ 命令除了 `init` 子命令外还有其他子命令。例如，用于启动 React Native 应用的 `start`。方便的是，作为上一节项目生成的一部分，一些预配置的命令已经写入了\
  \ `package.json` 配置文件的 `scripts` 部分（参见列表 18.1），以便你为不同的操作系统或在不同的模拟器中启动应用程序。\n\n```json\n\
  {\n  \"main\": \"node_modules/expo/AppEntry.js\",\n  \"scripts\": {\n    \"start\"\
  : \"expo start\",\n    \"android\": \"expo start --android\",\n    \"ios\": \"expo\
  \ start --ios\",\n    \"web\": \"expo start --web\",\n    \"eject\": \"expo eject\"\
  \n  },\n  \"dependencies\": {\n    \"expo\": \"~42.0.1\",\n    \"expo-status-bar\"\
  : \"~1.0.4\",\n    \"react\": \"16.13.1\",\n    \"react-dom\": \"16.13.1\",\n  \
  \  \"react-native\": \"0.63.3\",\n    \"react-native-web\": \"~0.13.2\"\n  },\n\
  \  \"devDependencies\": {\n    \"@babel/core\": \"⁷.9.0\"\n  },\n  \"private\":\
  \ true\n}\n```\n\n**列表 18.1** package.json 文件\n\n可以使用以下命令：`npm start` 或 `expo start`\
  \ 在浏览器中打开 Expo 开发工具界面（参见图 18.4）。从此界面开始，你有几个选项：例如，你可以在此处不同的模拟器中打开应用程序，模拟器是在你的开发计算机上模拟移动设备的特殊软件，让你作为开发者能够直接看到应用程序在相应操作系统（iOS\
  \ 或 Android）上的外观和行为。或者，你可以使用以下命令直接在模拟器中启动应用程序：\n\n- `npm run android` 或 `expo start\
  \ --android` 在浏览器中打开开发工具，并在 Android 模拟器中启动应用程序。注意，必须安装相应的模拟器——例如，在 Android Studio\
  \ 中 ([`developer.android.com/studio`](https://developer.android.com/studio))。\n\
  - `npm run ios` 或 `expo start --ios` 在浏览器中打开开发工具，并在 iOS 模拟器中启动应用程序（参见图 18.5）。注意，这也必须安装相应的模拟器——例如作为\
  \ Xcode 的一部分 ([`developer.apple.com/xcode`](https://developer.apple.com/xcode))。\n\
  - `npm run web` 或 `expo start --web` 在浏览器中打开开发工具，并在另一个浏览器窗口中启动应用程序（参见图 18.6）。如果你没有为上述两个平台（iOS\
  \ 或 Android）之一安装模拟器，则这种变体非常有用。\n\n\n\n\n\n让我们仔细观察一下生成的代码，特别是 `App.js` 文件中的 JavaScript\
  \ 代码。该文件是应用程序的入口点，可以通过模拟器或浏览器窗口在启动应用程序时显示的细微提示来识别：“打开 App.js 以开始开发您的应用程序！”这正是我们现在要做的。好的一点是，如果应用程序已经通过前面描述的命令之一在模拟器中或在浏览器中启动，那么\
  \ Expo Dev Tools 会在后台确保当源代码发生更改时，应用程序会直接重加载。试一下：在编辑器或开发环境中打开 `App.js` 文件，并将欢迎文本更改为“Hello\
  \ World!”，如列表 18.2 所示。应用程序应该立即在模拟器/浏览器中进行自更新。\n\n```javascript\nimport { StatusBar\
  \ } from 'expo-status-bar';\nimport React from 'react';\nimport { StyleSheet, Text,\
  \ View } from 'react-native';\n\nexport default function App() {\n  return (\n \
  \   <View style={styles.container}>\n      <Text>Hello World!</Text>\n      <StatusBar\
  \ style=\"auto\" />\n    </View>\n  );\n}\n\nconst styles = StyleSheet.create({\n\
  \  container: {\n    flex: 1,\n    backgroundColor: '#fff',\n    alignItems: 'center',\n\
  \    justifyContent: 'center',\n  },\n}); \n```\n\n**列表 18.2** App.js 文件是应用程序的入口点（此处带有自定义的欢迎文本）\n\
  \n顺便如此，让我们简要解释一下其余代码。正如你在几行中看到的，React Native 使用原生模块语法导入 JavaScript 模块。通过这种方式，加载了来自不同外部库的各种组件：来自\
  \ Expo 的 `StatusBar` 组件、完整的 React 库，以及示例中使用的 React Native 库的一些组件。\n\n`export` 关键字用于导出\
  \ `App()` 函数，该函数由 React Native 在内部调用，并将应用程序作为返回值定义。这里让熟练的 JavaScript 开发者感到惊讶的是 `return`\
  \ 后面的奇怪语法——即返回值反映的内容。React 及其 React Native 支持以 JSX 格式形式呈现的自己的特殊语法，在这种格式中，可以“混合”\
  \ JavaScript 代码和 HTML 代码（详情请参阅 [`reactjs.org/docs/introducing-jsx.html`](https://reactjs.org/docs/introducing-jsx.html)）。\n\
  \n示例还使用了 React Native 库中的三个具体组件：`View` 类提供了一个容器（可以这么说），其中可以定义进一步的 UI 组件。`Text` 类顾如名，表示简单的文本。此外，`StyleSheet`\
  \ 类用于定义单个 UI 组件的外观。在这里，你可以通过传统的 CSS 规则定义诸如组件的背景颜色、文本的颜色或对齐等方面。\n\n### 注意\n\nJSX\
  \ 允许在 React 和 React Native 中“混合” HTML 代码、CSS 代码和 JavaScript 代码。然而，React 和 React\
  \ Native 在这方面有细微区别：在 React 中，你可以可以使用一对一翻译为 HTML 元素的元素（这些元素随后会被浏览器解释——即被浏览器“理解”并渲染），而在\
  \ React Native 中，你不能使用普通的 HTML 元素，因为代码之后转换的不是 HTML，而是相应的原生代码。因此，我们之后不会谈论 HTML 代码，而是谈论标记代码。\n\
  \n这同样适用于 CSS 代码：尽管 React Native 可用的 CSS 属性在名称上与 CSS 标准中的属性很大程度上相同，但 React Native\
  \ 内部并没有使用真实的 CSS。\n\n### 18.2.5 使用 UI 组件\n\nReact Native 提供了一整套 UI 组件，你可以直接在应用程序中使用它们。有关这些组件的概述，请参阅\
  \ React Native 官方文档 [`reactnative.dev/docs/components-and-apis`](https://reactnative.dev/docs/components-and-apis)。在之前的示例中，你看到\
  \ `View` 和 `Text` 组件被包含在 `App.js` 文件中。基本上，React Native 提供了许多 UI 组件，并辅以基于 React Native\
  \ 并提供额外 UI 组件的其他库。接下来，我们将按钮和文本输入字段的使用作为示例。\n\n#### 使用按钮\n\n要使用按钮，只需导入 `Button` 组件。你在标记代码中定义组件本身，就像你之前定义\
  \ `Text` 组件一样。你可以使用 `title` 属性来指定在按钮上显示哪些文本，并使用 `onPress` 属性指定点击按钮时要调用哪个函数。在列表 18.3\
  \ 中，指定了一个匿名箭头函数，其中使用 `Alert.alert()` 调用了警对对话框。`Alert` 是 React Native 提供的另一个 UI 组件。\n\
  \n```javascript\nimport { StatusBar } from 'expo-status-bar';\nimport React from\
  \ 'react';\nimport { Alert, Button, StyleSheet, Text, View } from 'react-native';\n\
  \nexport default function App() {\n  return (\n    <View style={styles.container}>\n\
  \      <Text>Hello World!</Text>\n      <Button\n        title=\"Click here\"\n\
  \        onPress={() => Alert.alert('Button clicked')}\n      />\n      <StatusBar\
  \ style=\"auto\" />\n    </View>\n  );\n}\n\nconst styles = StyleSheet.create({\n\
  \  container: {\n    flex: 1,\n    backgroundColor: '#fff',\n    alignItems: 'center',\n\
  \    justifyContent: 'center',\n  },\n}); \n```\n\n**列表 18.3** 使用按钮并显示提示消息\n\n如果你还没有停止应用程序，它应该在模拟器或浏览器窗口中自动刷新并显示按钮（参见图\
  \ 18.7）。\n\n![一个简单的按钮](img/img-f18.7.html)\n\n**图 18.7** 一个简单的按钮\n\n如果你现在点击按钮，之前定义的匿名函数会被调用并显示提示对话框（参见图\
  \ 18.8）。\n\n![点击按钮后出现的提示对话框](img/img-f18.8.html)\n\n**图 18.8** 点击按钮后出现的提示对话框\n\n\
  #### 使用输入字段\n\n在 React Native 中，文本输入字段由 `TextInput` 类表示。导入工作正常，如列表 18.4 所示，与之前导入\
  \ `Text` 和 `Button` 等其他类一样。然而，示例中还可以看到另外两点：一方面，文本输入字段的外观是通过额外的 CSS 规则配置的；另一方面，React\
  \ 库中 `useState()` 函数的使用非常醒目。通过此函数，可以管理组件的状态。\n\n\n\n\n调用 `useState()` 函数会返回一个包含两个元素的数组，在示例中，每个元素都通过数组解构直接写入两个变量中（这在第\
  \ 4 章中有所描述）。数组中的第一个值（示例中的 `firstName` 或 `lastName`）包含状态中的属性；第二个值（示例中的 `setFirstName`\
  \ 或 `setLastName`）包含一个可用于更新状态中相应属性的函数。可选地可以将一个默认值作为参数传递给 `useState()` 函数，该值将被初始赋值给相应的属性。\n\
  \n在示例中，定义了两个文本输入框（一个用于名，一个用于姓），其中 `onChangeText` 属性可用于指定一个在输入框中的文本发生变化时调用的函数。在这里，每种情况下都传递了相应的函数，这些函数是之前通过\
  \ `useState()` 创建的。也就是说，如果名输入框中的文本发生变化，就会调用 `setFirstName()` 函数并更新状态中的 `firstName`\
  \ 变量。如果姓输入框中的文本发生变化，则相应调用 `setLastName()` 函数并更新 `lastName` 变量。\n\n```javascript\n\
  import { StatusBar } from 'expo-status-bar';\nimport React, { useState } from 'react';\n\
  import { Alert, Button, StyleSheet, Text, TextInput, View } from 'react-native';\n\
  \nexport default function App() {\n\n  const [firstName, setFirstName] = useState('');\n\
  \  const [lastName, setLastName] = useState('');\n\n  return (\n    <View style={styles.container}>\n\
  \      <Text>Hello World!</Text>\n      <TextInput\n        style={styles.input}\n\
  \        onChangeText={(firstName) => setFirstName(firstName)}\n        value={firstName}\n\
  \        placeholder='First name'\n      />\n      <TextInput\n        style={styles.input}\n\
  \        onChangeText={(lastName) => setLastName(lastName)}\n        value={lastName}\n\
  \        placeholder='Last name'\n      />\n      <Button\n        title=\"Click\
  \ here\"\n        onPress={() => Alert.alert(`Hello ${firstName} ${lastName}`)}\n\
  \      />\n      <StatusBar style=\"auto\" />\n    </View>\n  );\n}\nconst styles\
  \ = StyleSheet.create({\n  container: {\n    flex: 1,\n    backgroundColor: '#fff',\n\
  \    alignItems: 'center',\n    justifyContent: 'center',\n  },\n  input: {\n  \
  \  height: 40,\n    width: '80%',\n    padding: 12,\n    margin: 12,\n    borderWidth:\
  \ 1,\n    borderRadius: 5,\n    borderColor: 'grey'\n  },\n}); \n```\n\n**列表 18.4**\
  \ 输入框的使用\n\n在列表 18.4 中，提示对话框中输出的消息也经过了调整。不再是之前的按钮已点击消息，现在显示的是一条个性化的欢迎消息，它会访问名和姓的值（参见图\
  \ 18.9）。\n\n![带有个性化欢迎消息的自定义提示对话框](img/img-f18.9.html)\n\n**图 18.9** 带有个性化欢迎消息的自定义提示对话框\n\
  \n### 18.2.6 与服务器的通信\n\n移动应用程序通常与服务器通信——例如，从服务器检索数据或向其发送数据。方便的是，React Native 在这方面支持\
  \ Fetch API，你已经在第 9 章中了解过它了。因此，与服务器的通信相对简单。列表 18.5 是熟悉的列表 18.4 中代码的扩展，其中名和姓的默认值现在从服务器加载并写入组件的状态中（从而写入文本框中）。正如你所见，这里使用了\
  \ React 的另一个特性：通过使用 `useEffect()` 可以定义页面副作用（[`reactjs.org/docs/hooks-effect.html`](https://reactjs.org/docs/hooks-effect.html)），例如服务器数据的初始加载。在作为参数传递给\
  \ `useEffect()` 函数的回调函数中，示例中定义了另一个函数（`loadData()`），它通过 Fetch API 从服务器加载数据，将 HTTP\
  \ 响应转换为 JSON 结构，并从该结构将 `firstName` 和 `lastName` 的数据写入状态中。\n\n```javascript\nimport\
  \ { StatusBar } from 'expo-status-bar';\nimport React, { useState, useEffect } from\
  \ 'react';\nimport { Alert, Button, StyleSheet, Text, TextInput, View } from 'react-native';\n\
  \nexport default function App() {\n\n  const [firstName, setFirstName] = useState('');\n\
  \  const [lastName, setLastName] = useState('');\n\n  useEffect(() => {\n    async\
  \ function loadData() {\n      const response = await fetch('http://localhost:3000/settings');\n\
  \      const data = await response.json();\n      setFirstName(data.firstName);\n\
  \      setLastName(data.lastName);\n    }\n    loadData();\n  });\n\n  return (\n\
  \    <View style={styles.container}>\n      ...\n    </View>\n  );\n}\n... \n```\n\
  \n**列表 18.5** 从服务器加载名和姓的默认数据\n\n### 18.2.7 构建和发布应用程序\n\n除了开发、调试和在模拟器中运行之外，Expo 还提供了构建和发布应用程序的功能——即将其上传到\
  \ Apple 的 App Store 或 Google Play 商店。只有这样，其他用户才能安装并使用你的应用程序！构建和发布应用程序的相关信息通过 `app.json`\
  \ 文件配置（该文件在通过 Expo 创建应用程序时自动生成）。构建应用程序时使用 `expo build:android` 或 `expo build:ios`\
  \ 命令，取决于目标平台。但为了让构建正常工作，你需要在 [`expo.io/`](https://expo.io/) 有一个账户，它是免费的，可以通过网站创建，也可以作为构建过程的一部分从命令行创建。关于使用\
  \ Expo 发布 React Native 应用的详细信息，请访问 [`docs.expo.io/distribution/building-standalone-apps`](https://docs.expo.io/distribution/building-standalone-apps)。\n\
  \n## 18.3 总结\n\n在本章中，你了解了 JavaScript 在创建移动应用程序中所起的作用。你学习了不同类型的移动应用程序以及 React Native\
  \ 库。以下列表总结了本章最重要的点：\n\n*   移动应用程序分为三种类型：\n    *   原生应用程序（Native applications）是专门针对（移动）操作系统开发的应用程序，因此可以充分利用其功能和特性。使用的编程语言包括\
  \ Java（带有 Android SDK）、Objective-C 和 Swift，或者像 React Native 等替代方案。\n    *   移动 Web\
  \ 应用程序（Mobile web applications）是针对移动设备使用优化的普通 应用程序。使用的技术是 HTML5、CSS3 和 JavaScript。\n\
  \    *   混合应用程序（Hybrid applications）是尝试结合原生应用程序优势与移动 Web 应用程序好处的应用程序。混合应用程序主要使用\
  \ HTML5、CSS3 和 JavaScript 开发，但必须有一部分小小的原生代码，允许访问硬件特性等。\n\n\n\n\n* 一个可以帮助开发原生 Web\
  \ 应用的库是 `React Native`。其逻辑使用 `JavaScript` 编写，图形界面通过 `JSX`（如果使用 `TypeScript` 则使用\
  \ `TSX`）编写，然后根据目标平台相应转换为 iOS 或 Android 代码。\n* 开发 React Native 应用最简单的方法是使用 `Expo`\
  \ 工具。通过 `Expo`，可以在各种 iOS 和 Android 模拟器中启动、调试和发布 React Native 应用。\n\n# 19 使用 JavaScript\
  \ 开发桌面应用程序\n\n现在也可以用 `JavaScript` 实现桌面应用程序。近年来，为此目的出现了两个主要的框架，我们将在本章中介绍。\n\n得益于现代\
  \ Web 技术，Web 应用在近年来变得越来越流行，在许多情况下已经取代了经典的桌面应用程序，或者提供了等效方案；这些被称为富能互联网应用（RIA）。然而，取决于用场景或需求，桌面应用程序在许多情况下仍然更有意义。\n\
  \n桌面应用程序相比于 Web 应用的优势包括：\n\n* 访问原生功能\nWeb 应用无法访问计算机的原生功能和硬件资源，或者只能在非常有限的范围内访问（例如通过相应的\
  \ Web API 或浏览器插件），相比之下，桌面应用程序不受此限制。一个经典的例子是访问文件系统：在 Web 应用中（通过 `file API`；参见第 12\
  \ 章、第 12.5 节），你只能访问用户显式选择的文件；而在桌面应用程序中，你基本上可以访问整个文件系统（前提你有相应的权限）。\n\n* 无需担心浏览器版本\n\
  开发 Web 应用时，通常需要花费大量的开发时间处理浏览器兼容性问题。这包括诸等问题：哪些浏览器支持哪些功能？从哪个浏览器版本开始？浏览器中哪些特殊特性或 Bug？如何修复这些问题？当然，polyfills\
  \ 在这可以有所帮助——即在浏览器不支持某个功能时模拟该功能的库。跨浏览器测试工具可以在不同的浏览器、版本和操作系统的组合中自动测试 Web 应用，这在开发过程中非常有帮助。然而，对于桌面应用程序，这个问题被完全消，因为你从根本不需要处理不同的浏览器或浏览器引擎（尽管诚实地指出，对于桌面应用程序，你在不同的操作系统、操作系统版本、架构等方面面临着大致类似的压力）。\n\
  \n* 无需访问互联网\nWeb 应用需要连接互联网。虽然可以使用 `Service Worker API`、`IndexedDB API` 和 `Web Storage\
  \ API` 等离线优先技术尽可能减少这种需求，但通常设计在没有互联网连接的情况下也能流畅运行的桌面应用程序要简单得多。\n\n* 无下载时间\nWeb 应用的复杂性以及集成第三方库和框架的数量对初始启动应用的时间有相应的影响。如果需要很长时间，将负面影响应用的可用性。尽管各种浏览器的缓存机制可以抵消这一点，但这个问题在桌面应用程序中甚至不会出现。尽管如此，桌面应用程序最初必须被下载，以便将其安装在自己的电脑上。\n\
  \n* 高用户流量下的性能\n对于 Web 应用，高访问率会对性能产生负面影响。对于桌面应用程序，并发活跃用户数是无关（至少对于 UI 代码而言）。只有当桌面应用程序集成了外部（Web）服务时，这些服务才会成为应用程序的瓶颈。\n\
  \n另一方面，当然，Web 应用相比桌面应用程序也有许多优势，其中一个非常重要的优势是：跨平台能力——即应用程序运行在所有操作系统（包括移动操作系统：Windows、Linux、macOS、Android、iOS）上的能力，前提是有浏览器形式提供的相应的运行时环境。相比之下，原生创建相应跨平台能力的桌面应用程序所需的努力和必要的编程技能也相应的高。\n\
  \n这正是我们将在后续章节介绍的 `NW.js` 和 `Electron` 框架用用场：它们将现代 Web 技术与使用它们创建桌面应用程序的能力相结合。这两个框架的方法相似，但仔细观察，它们显示出了差异。\n\
  \n## 19.1 NW.js\n\n`NW.js` ([`nwjs.io/`](https://nwjs.io/)) 是一个用于 HTML、CSS 和 `JavaScript`\
  \ 创建桌面应用程序的开源框架，由 Intel 于 2011 年开发。`NW.js` 的思想是将 `Node.js` JavaScript 运行时环境与 `WebKit`\
  \ 浏览器引擎（该框架的原名为 `node-webkit`）相结合，并以平台无关的方式提供。\n\n通过结合 `WebKit` 和 `Node.js`，`NW.js`\
  \ 一方面可以在桌面窗口内显示用 HTML、CSS 和 `JavaScript` 实现的应用程序（这通过 `WebKit` 实现），另一方面可以与底层操作系统进行交互——即使用原生功能（这反过来通过\
  \ `Node.js` 实现）。\n\n简单来说，`NW.js` 让“仅”” HTML、CSS 和 `JavaScript` 的 Web 开发者也能实现桌面应用程序。而且整个事情可以跨平台运行，因为\
  \ `NW.js` 会根据上述语言的单一代码库，为各种操作系统（Windows、Linux 和 macOS）生成相应的应用程序文件（稍后将详细介绍）。\n\n\
  ### 19.1.1 安装并创建应用程序\n\n`NW.js` 的安装非常简单：在项目网站上，你可以找到所有操作系统的相应安装文件。开发基于 `NW.js` 的应用程序，你需要下载软件开发工具包（SDK）版本。\n\
  \n一个极简的 `NW.js` 应用由两个到三个文件组成：一个配置文件、一个作为应用程序入口的 HTML 文件，通常至少一个包含应用程序逻辑的 JavaScript\
  \ 文件。让我们快速看看示例应用程序的这三个文件看起来什么样。\n\n`package.json` 配置文件（也称为清单文件）用于管理有关应用程序的通用元数据，如名称、版本号、作为应用程序入口的文件规范以及外部依赖，就像\
  \ `Node.js` 包一样。\n\n`name`、`version` 和入口也是 `NW.js` 应用程序 `package.json` 文件的最低要求。`name`\
  \ 和 `version` 属性的组合作为应用程序的标识符；`main` 属性指定初始加载的哪个 HTML 文件。\n\n因此，一个名为 `helloworld`、版本为\
  \ `1.0.0` 且 `index.html` 文件标记为入口的应用程序最小配置文件，看起来就像列表 19.1 所示的内容。\n\n```json\n{\n\
  \  \"name\": \"helloworld\",\n  \"version\": \"1.0.0\",\n  \"main\": \"index.html\"\
  \n}\n```\n\n**列表 19.1** `package.json` 文件的示例结构\n\n列表 19.2 显示了相应 HTML 文件的内容。你可以看到，这是普通的\
  \ HTML。逻辑则被合理地外包给单独的 JavaScript 文件（稍后将详细介绍）。\n\n\n\n\n\n```html\n<!DOCTYPE html>\n\
  <head>\n  <title>Hello World!</title>\n</head>\n<body>\n  <h1>Hello World!</h1>\n\
  \  <div>\n    Your operating system is: <span id=\"platform\"></span>\n  </div>\n\
  \  <script type=\"text/javascript\" src=\"./scripts/main.js\"></script>\n</body>\n\
  </html> \n```\n\n**列表 19.2** 入口点是一个 HTML 文件\n\nNW.js 通过全局对象 `nw` 提供了其 API，该对象可用于创建\
  \ UI 组件，例如上下文菜单等。相比之下，可以直接访问 DOM API 和各种 Node.js API。列表 19.3 显示了后两者的结合使用。在这里，在 `document`\
  \ 对象（DOM API）上，注册了一个针对 `DOMContentLoaded` 事件的事件监听器，在监听器中，通过 `os` Node.js 模块（Node.js\
  \ API）读取了所使用的平台信息，然后将此信息写入到 ID 为 `platform` 的元素中（再次使用了 DOM API）。\n\n```\nconst os\
  \ = require('os');\n// Register event listener (DOM API)\ndocument.addEventListener('DOMContentLoaded',\
  \ () => {\n  // Read information about the operating system (or platform) (Node.js\
  \ API)\n  const platform = os.platform();\n  // Write information to the DOM tree\
  \ (DOM API)\n  document.getElementById('platform').textContent = platform;\n});\
  \ \n```\n\n**列表 19.3** 访问 Node.js API\n\n### 注意\n\n在 NW.js 中，可以使用整个 DOM API 和整个\
  \ Node.js API（当然还有额外的库和包）。此外，NW.js 通过一些新增功能扩展了 DOM API 和 Node.js API——例如，文本输入字段的额外属性或\
  \ `process` 对象的额外属性。\n\n### 19.1.2 启动应用程序\n\n要运行前面所示的应用程序，你需要 NW.js 的 SDK，该 SDK\
  \ 已在本章开头处安装。然后，在命令行中进入项目根目录并运行命令 `<NWJS_TOOLS> .`，其中 `<NWJS_TOOLS>` 占位符根据操作系统的不同而，如列表\
  \ 19.4 所示。\n\n```\n# For Windows\n/path/to/nwjs/nw.exe .\n\n# For Linux\n/path/to/nwjs/nw\
  \ .\n\n# For macOS\n/path/to/nwjs/nwjs.app/Contents/MacOS/nwjs . \n```\n\n**列表 19.4**\
  \ 启动 NW.js 应用程序\n\n启动后，应用程序看起来应该像图 19.1。由于我们在 macOS 中启动了应用程序，截图显示的值为 `darwin`。如果你使用不同的操作系统，你自然会在在这里看到不同的值。\n\
  \n![启动后的 NW.js 应用程序](img/img-f19.1.html)\n\n**图 19.1** 启动后的 NW.js 应用程序\n\n### 19.1.3\
  \ 应用程序的打包\n\n对于打包 NW.js 应用程序——即将源代码文件“打包”成可执行文件——`nwjs-builder-phoenix` 包（[`github.com/evshiron/nwjs-builder-phoenix`](https://github.com/evshiron/nwjs-builder-phoenix)）是一个很好的选择。它可以通过\
  \ `npm install nwjs-builder-phoenix --save-dev` 命令作为开发依赖项安装，之后它会相应地出现在 `package.json`\
  \ 文件的 `devDependencies` 部分（参见列表 19.5）。\n\n```json\n{\n  \"name\": \"helloworld\"\
  ,\n  \"version\": \"1.0.0\",\n  \"main\": \"index.html\",\n  \"devDependencies\"\
  : {\n    \"nwjs-builder-phoenix\": \"¹.15.0\"\n  }\n} \n```\n\n**列表 19.5** package.json\
  \ 文件的示例结构\n\n为了为不同的操作系统“打包”项目，你还需要在该配置文件文件中添加另外两个条目（参见列表 19.6）：首先，你需要通过 `build`\
  \ 部分配置使用哪个版本的 NW.js。然后，在 `scripts` 下添加一个对应的条目，用于打包应用程序的较长的 `build` 命令会很有帮助。这样，你可以使用更短的\
  \ `npm run dist` 命令来调用构建过程。你使用 `-tasks` 参数指定你想为哪些平台打包应用程序。在示例中，通过这种方式总共生成了三个包：一个\
  \ Windows 的、一个 Linux 和一个 macOS 的（每个都是 64 位版本）。\n\n```json\n{\n  \"name\": \"helloworld\"\
  ,\n  \"version\": \"1.0.0\",\n  \"main\": \"index.html\",\n  \"scripts\": {\n  \
  \  \"dist\": \"build --tasks win-x64,linux-x64,mac-x64 --mirror https://dl.nwjs.io/\
  \ .\",\n  },\n  \"devDependencies\": {\n    \"nwjs-builder-phoenix\": \"¹.15.0\"\
  \n  },\n  \"build\": {\n    \"nwVersion\": \"0.14.7\"\n  }\n} \n```\n\n**列表 19.6**\
  \ 带有构建信息的 package.json 文件\n\n### 19.1.4 更多示例应用程序\n\n前面章节所示的示例显然非常简单。原则上，当然，你可以利用\
  \ HTML、CSS、JavaScript 和 Node.js 的知识来实现桌面应用程序。NW.js 可能的的一些灵感列在表 19.1 中。\n\n| 名称 |\
  \ 类型 | URL |\n| --- | --- | --- |\n| Facebook Desktop | Messenger | [`github.com/Aluxian/Messenger-Desktop`](https://github.com/Aluxian/Messenger-Desktop)\
  \ |\n| Gitter Desktop | Gitter 客户端 | [`github.com/gitterHQ/desktop`](https://github.com/gitterHQ/desktop)\
  \ |\n| Mango | Markdown 编辑 | [`github.com/egrcc/Mango`](https://github.com/egrcc/Mango)\
  \ |\n| WhatsApp Desktop | Messenger（非官方） | [`github.com/bcalik/Whatsapp-Desktop`](https://github.com/bcalik/Whatsapp-Desktop)\
  \ |\n\n**表 19.1** 基于 NW.js 的应用程序\n\n## 19.2 Electron\n\n创建桌面应用程序的第二个流行框架是 Electron（[`electron.atom.io/`](https://electron.atom.io/)）。Electron\
  \ 最初被 GitHub 用于开发 Atom 编辑器的一部分，但它在 2013 年作为一个独立的框架对外开放。\n\n原则上，Electron 与 NW.js\
  \ 相似。这并不奇怪——NW.js 的一个原始开发者之一之前在英特尔工作，现在继续为 GitHub 开发 Electron。尽管如此，NW.js 和 Electron\
  \ 之间存在一个对开发者来说非常重要的区别：在 NW.js 中，Node.js 和 WebKit 共享单个 JavaScript 上文，而在 Electron\
  \ 中有多个上下文——一个用于应用程序的后台进程，每个应用程序窗口一个。另一个区别是应用程序启动点的定义：在 NW.js 中，如前所述，这是一个 HTML 文件，而在\
  \ Electron 中它是 JavaScript 文件。\n\n#### 其他区别\n\n与 Electron 不同，NW.js 还允许将 JavaScript\
  \ 代码编译成原生代码，以防止源代码以可读形式随程序发布——但编译后的代码运行速度会慢约 30%。此外，NW.js 集成了 PDF 查看器和打印预览。而在 Electron\
  \ 中，你必须求助于外部库，例如 `pdf.js`（[`mozilla.github.io/pdf.js/`](https://mozilla.github.io/pdf.js/)）。\n\
  \n如前所述，Electron 区分了两种类型的进程：主进程和渲染进程。主进程（通常包含在 `main.js` 文件中）提供了 Electron 应用程序的入口点并控制应用程序的生命周期。例如，文件系统等原生组件也可以从主进程进行访问。\n\
  \n\n\n\n与之形成对比的是渲染进程（renderer processes），它们本质上代表了 Electron 应用中的一个（浏览器）窗口，并包含了 HTML、CSS\
  \ 和 JavaScript 的组合。因此，在渲染进程（或相应的 JavaScript 代码）中，你可以访问对应窗口的 DOM。尽管如此，你也可以在渲染进程中访问完整的\
  \ Node.js API。\n\n#### 注意\n因此，在一个应用程序中可以有多个渲染进程，但显而易见地只有一个主进程。\n\n### 19.2.1 安装和创建应用程序\n\
  \n生成 Electron 项目最简单的方法是通过 `electron-quick-start` Git 仓库，你可以通过 `git clone https://github.com/electron/electron-quick-start`\
  \ 命令对其进行克隆。该仓库包含一个最小化的示例应用程序，由 `package.json` 文件、`.gitignore` 文件、许可（license）和 readme\
  \ 文件以及以下文件组成：\n\n*   一个包含主进程代码的 JavaScript 文件，该文件反过来创建应用程序的主窗口（`main.js`）\n*   一个加载到主窗口的\
  \ HTML 文件（`index.html`），它提供了该窗口渲染进程的代码\n*   一个被该 HTML 文件引入的 JavaScript 文件（`renderer.js`），它包含由渲染进程处理的代码（最初，该文件除了一些注释外仍然为空）\n\
  \n列表 19.7 显示了经过自定义自定义的主进程代码（`main.js`）。与 Node.js 按照通常一样，`electron` 包是通过 `require()`\
  \ 函数引入的。这里导入的 `app` 变量代表应用程序；`BrowserWindow` 代表单个应用程序窗口。列表中的代码确保了一旦应用程序加载，就会通过 `createWindow()`\
  \ 函数创建一个宽度为 800 像素、高度为 600 像素的新应用程序窗口。\n\n```\nconst { app, BrowserWindow } = require('electron');\n\
  const path = require('path');\n\nfunction createWindow() {\n  const mainWindow =\
  \ new BrowserWindow({\n    width: 800,\n    height: 600,\n    webPreferences: {\n\
  \      preload: path.join(__dirname, 'preload.js')\n    }\n  })\n  mainWindow.loadFile('index.html');\n\
  }\n\napp.whenReady().then(() => {\n  createWindow();\n\n  app.on('activate', ()\
  \ => {\n    if (BrowserWindow.getAllWindows().length === 0) {\n      createWindow();\n\
  \    }\n  })\n});\n\napp.on('window-all-closed', () => {\n  if (process.platform\
  \ !== 'darwin') {\n    app.quit();\n  }\n}); \n```\n\n**列表 19.7** 主进程代码\n\n调用 `loadFile()`\
  \ 随后会将指定的 HTML 文件 `index.html` 加载到创建的应用程序窗口中。你可以在列表 19.8 中看到此文件的代码。\n\n```\n<!DOCTYPE\
  \ html>\n<html\n  <head>\n    <meta charset=\"UTF-8\">\n    <meta http-equiv=\"\
  Content-Security-Policy\" content=\"default-src 'self'; \nscript-src 'self'\">\n\
  \    <title>Hello World!</title>\n  </head>\n  <body><body>\n    <h1>Hello World!</h1>h1\n\
  \    <div>Node.js Version: <span id=\"node-version\"></span></div>\n    <div>Chromium\
  \ Version: <span id=\"chrome-version\"></span></div>\n    <div>Electron Version:\
  \ <span id=\"electron-version\"></span></div>\n    <script src=\"./renderer.js\"\
  ></script>\n  </body></body>\n</html> \n```\n\n**列表 19.8** 主窗口代码\n\n此外，当调用 `BrowserWindow`\
  \ 构造函数时，会加载另一个 JavaScript 文件（`preload.js`），它反过来确保所使用的 Chrome、Node.js 和 Electron\
  \ 的版本信息被写入为此目的提供的 HTML 占位元素中（参见列表 19.9）。\n\n```javascript\nwindow.addEventListener('DOMContentLoaded',\
  \ () => {\n  const replaceText = (selector, text) => {\n    const element = document.getElementById(selector);\n\
  \    if (element) {\n      element.innerText = text;\n    }\n  }\n\n  for (const\
  \ type of ['chrome', 'node', 'electron']) {\n    replaceText(`${type}-version`,\
  \ process.versions[type]);\n  }\n}) \n```\n\n**列表 19.9** preload.js 文件的内容\n\n接下来，让我们看看如何启动所示的示例应用程序。但在之前，你必须首先通过\
  \ `npm install` 命令安装所需的依赖项。\n\n### 19.2.2 启动应用程序\n\n启动应用程序并不困难：你只需要运行 `npm start`\
  \ 命令，Electron 就会在后台完成其余工作。然后我们之前使用 `createWindow()` 函数创建的应用程序窗口就会打开，它看起来就像我们示例中图\
  \ 19.2 中的截图一样。\n\n![启动后的 Electron 应用](img/img-f19.2.html)\n\n**图 19.2** 启动后的 Electron\
  \ 应用\n\n### 19.2.3 打包\n\n与 NW.js 一样，可以使用 Electron 为不同的操作系统打包应用程序。其中一种选项是使用 `electron-packager`\
  \ 包（[`github.com/electron-userland/electron-packager`](https://github.com/electron-userland/electron-packager)）。该包既可以通过编程调用，也可以从命令行调用。对于前者，只需通过\
  \ `npm install electron-packager --save-dev` 命令本地安装即可；对于后者，必须通过 `npm install -g\
  \ electron-packager` 命令全局安装该模块。\n\n在命令行上，使用 `electron-packager` 命令开始打包。在这里，你必须指定源目录、应用程序名称、目标平台（`darwin`、`linux`、`mas`、`win32`）及其体系（`ia32`、`x64`、`armv7l`）作为参数。例如，`electron-packager\
  \ . hello-world --platform=win32,linux,darwin --arch=x64` 命令为 Windows、Linux 和 macOS\
  \ 打包 64 位二进制文件。\n\n由于在某些情况下打包应用程序的命令可能会很长，因此像之前 NW.js 那样，在 `package.json` 文件中包含适当的脚本是一个好意（参见列表\
  \ 19.10 展示了一部分基于 Electron 的应用程序。如你所，其中包括一些你作为 Web 开发者可能每天使用的程序（例如 Atom、Postman、Slack\
  \ 或 Visual Studio Code），但你可能不知道其底层技术。\n\n| 名称 | 应用类型 | URL |\n\n| --- | --- | ---\
  \ |\n\n\n\n\n\n| Abricotine | Markdown 编辑器 | [`github.com/brrd/Abricotine`](https://github.com/brrd/Abricotine)\
  \ |\n| Atom | 代码编辑器 | [`github.com/atom/atom`](https://github.com/atom/atom) |\n\
  | Caret | Markdown 编辑器 | [`caret.io/`](http://caret.io/) |\n| Flow | 风险管理 | [`www.getflow.com/`](https://www.getflow.com/)\
  \ |\n| GitKraken | Git 客户端 | [`www.gitkraken.com/`](https://www.gitkraken.com/)\
  \ |\n| Kitematic | Docker 容器管理 | [`kitematic.com/`](https://kitematic.com/) |\n\
  | Min | 浏览器 | [`github.com/minbrowser/min`](https://github.com/minbrowser/min) |\n\
