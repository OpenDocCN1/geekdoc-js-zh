  \ node with ID \"outer\" \n```\n\n**代码列表 6.27** 点击标记为 2 的 <div> 元素时前一个程序的输出\n\n\
  你可以看到，通过 `addEventListener()` 方法注册的事件监听器默认注册在冒泡阶段。接下来，让我们来看看如何为捕获阶段注册事件监听器。\n\n\
  ### 冒泡阶段的事件处理器\n\n如果你注册一个事件处理器（无论通过 HTML 还是 JavaScript），它总会在冒泡阶段执行。与事件监听器不同，事件处理器不提供影响其执行阶段阶段的方法。\n\
  \n### 事件捕获示例\n\n使用 `addEventListener()` 方法，可以将一个函数注册为捕获阶段的事件监听器。这可以通过该方法的第三个参数进行控制：你可以指定一个布尔值，来决定相应的函数应该注册在冒泡阶段还是捕获阶段。\n\
  \n如前所述，默认情况下是在冒泡阶段注册，但如果你希望将事件监听器注册在捕获阶段，则需要传递值 `true`。这种示例在代码列表 6.28 中所示。它基本上是基于之前演示冒泡的示例。唯一的区别是，`click`\
  \ 事件的事件监听器现在注册在捕获阶段，而不是冒泡阶段。\n\n```javascript\nfunction init() {\n  const elements\
  \ = document.querySelectorAll('.level1, .level2, .level3');\n  for(let i=0; i<elements.length;\
  \ i++) {\n    elements[i].addEventListener('click', handler, true);\n    // elements[i].onclick\
  \ = handler;              // 总是冒泡阶段\n    // elements[i].attachEvent('click', handler);\
  \  // IE9 总是冒泡阶段\n  }\n} \n```\n\n**代码列表 6.28** 事件捕获\n\n如果你再次点击值为 `C` 的元素，事件将不会从目标元素开始触发冒泡阶段的事件监听器，而是从文档节点开始在捕获阶段触发（当然，冒泡阶段仍然会顺序运行，以便执行其他事件处理器以及那些注册在冒泡阶段的事件监听器）。\n\
  \n第一个拥有了该事件事件监听器的元素是最外层的 `<div>` 元素，这意味着第一个执行的是该元素的事件监听器。然后，事件沿 DOM 树移动（我们处于捕获阶段），并触发带有\
  \ `2` 的元素的事件监听器。最后，触发被点击的元素（目标元素 `C`）的事件监听器。\n\n\n\n\n\n程序的输出如 Listing 6.29 所示，它展示了这一序列。\n\
  \n```\nClicked on node with ID \"C\"\nEvent at node with ID \"outer\"\nClicked on\
  \ node with ID \"C\"\nEvent at node with ID \"second\"\nClicked on node with ID\
  \ \"C\"\nEvent at node with ID \"C\" \n```\n\n**Listing 6.29**��� 前一个程序的输出\n\n图形化结果反过来又与点击带有\
  \ `C` 的 `<div>` 元素时事件冒泡示例中的结果相似（参见图 6.10；与图 6.8 进行对比）。\n\n![如果你点击 C <div> 元素，在事件捕获期间，所有之前的元素都会被染灰色，从最外层的\
  \ <div> 元素开始](img/img-f6.10.html)\n\n**图 6.10**��� 如果你点击 C <div> 元素，在事件捕获期间，所有之前的元素都会被染灰色，从最外层的\
  \ <div> 元素开始\n\n即使你点击带有 `2` 的 `<div>` 元素，图形化结果也与事件冒泡示例相同（参见图 6.11；与图 6.9 进行对比），仅仅是事件监听器的执行顺序不同。\n\
  \n![如果你点击 2 <div> 元素，在事件捕获期间，所有之前的元素都会被染灰色，从最外层的 <div> 元素开始](img/img-f6.11.html)\n\
  \n**图 6.11**��� 如果你点击 2 <div> 元素，在事件捕获期间，所有之前的元素都会被染灰色，从最外层的 <div> 元素开始\n\n### 6.4.2\
  \ 中断事件流\n\n当事件被触发时，可以阻止通常由事件引起的操作：\n\n*   可以使用 `stopPropagation()` 方法阻止相应的事件传播到\
  \ DOM 树中的下一个元素，从而避免触发其他元素上的操作（或相应的事件处理器和事件监听器）。\n*   相反，可以使用 `preventDefault()`\
  \ 方法阻止在事件发生时执行浏览器的默认操作。例如，你可以阻止浏览器在点击链接时打开该链接，或者在点击提交按钮时提交表单。\n\n在 Listing 6.30\
  \ 中，你可以看到程序是如何稍作扩展的：使用了一个额外的 `if` 语句来检查当前元素（`this`）是否包含 CSS 类 `level2`——也就是说，检查当前元素是否为第二级元素，即带有\
  \ `1` 或 `2` 的两个 `<div>` 元素之一（最外层的 `<div>` 元素具有 CSS 类 `level1`，而四个内层 `<div>` 元素具有\
  \ CSS 类 `level3`；另参见 Listing 6.24）。如果是这种情况，则会在事件对象上执行 `stopPropagation()` 方法。\n\n\
  因此，如果你现在点击一个第三级 `<div>` 元素——例如，再次点击包含 `C` 的 `<div>` 元素——默认情况下（注册了冒泡阶段的事件监听器），只有该元素和包含\
  \ `2` 的元素会被染成灰色，而最外层元素不会（参见图 6.12 和 Listing 6.31 中的程序输出）。由于通过 `stopPropagation()`\
  \ 方法阻止了转发，因此不会到达最外层的 `<div>` 元素（参见图 6.13）。\n\n```\nfunction handler(ev) {\n  const\
  \ e = ev || window.event;\n  const target = e.target || e.srcElement;\n  this.classList.toggle('selected');\n\
  \  console.log(\n    `Clicked on node with ID \"${target.id}\"`\n  );\n  if(this.classList.contains('level2'))\
  \ {\n    e.stopPropagation();\n  }\n}\n```\n\n**Listing 6.30**� 事件流的终止\n![如果你点击\
  \ C <div> 元素，在事件捕获期间，所有之前的元素都会被染灰色，从最外层的 <div> 元素开始](img/img-f6.10.html)\n\n**图\
  \ 6.12**� 如果你点击 C <div> 元素，在事件捕获期间，所有之前的元素都会被染灰色，从最外层的 <div> 元素开始\n\n```\nClicked\
  \ on node with ID \"C\"\nEvent at node with ID \"outer\"\nClicked on node with ID\
  \ \"C\"\nEvent at node with ID \"second\"\n```\n\n**Listing 6.31**� 点击 C <div> 元素时前一个程序的输出\n\
  ![调用 stopPropagation() 阻止在冒泡阶段在 DOM 树中上升](img/img-f6.13.html)\n\n**图 6.13**� 调用\
  \ stopPropagation() 阻止在冒泡阶段在 DOM 树中上升\n\n#### 捕获阶段的事件监听器\n\n示例假设所有事件监听器都是为冒泡阶段注册的。反之，如果事件监听器是为捕获阶段注册的，结果将会有不同（参见图\
  \ 6.14），因为事件监听器是从文档节点开始评估的（参见图 6.15）。\n\n在事件捕获期间中断事件流，从文档节点到 2 <div> 元素的所有变为灰色](bilderklein/klein06_014.png)](img-f6.14.html)\n\
  \n**图 6.14**� 在事件捕获期间中断事件流，从文档节点到 2 <div> 元素的所有变为灰色\n\n![调用 stopPropagation() 阻止在捕获阶段在\
  \ DOM 树中下降](img/img-f6.15.html)\n\n**图 6.15**� 调用 stopPropagation() 阻止在捕获阶段在 DOM\
  \ 树中下降\n\n###### 立即中断事件流\n\n如你所知，你可以为每个元素的某个事件注册多个事件监听器。如果你在这些事件监听器之一中调用了 `stopPropagation()`\
  \ 方法，该元素的所有其他事件监听器仍会被执行。\n\n这在 Listing 6.32 中得到了说明。在这里，`handleClickEvent1()` 和 `handleClickEvent2()`\
  \ 函数被注册为所有 `<div>` 元素点击事件的监听器。正如之前的示例所示，`handleClickEvent1()` 方法切换 `selected` CSS\
  \ 类，从而在首次执行时将相应元素的背景颜色变为灰色。\n\n`handleClickEvent2()` 方法的作用类似，但效果是相应的元素获得一个虚线框。这两个方法都通过调用\
  \ `stopPropagation()` 方法来阻止事件的转发。\n\n\n\n\n\n如果你现在点击带有 `C` 的 `<div>` 元素，会先执行 `handleClickEvent1()`\
  \ 函数，然后事件对象会传播（尽管调用了 `stopPropagation()`），接着执行 `handleClickEvent2()` 函数。换句话说，`stopPropagation()`\
  \ 方法并阻止事件在同一个元素上为相应事件注册的事件监听器之间传播。它只阻止事件传播到注册在其他元素上的该事件的事件监听器。程序的运行结果如图图 6.16 所示。\n\
  \n```javascript\nfunction handleClickEvent1(ev) {\n  const e = ev || window.event;\n\
  \  this.classList.toggle('selected');\n  e.stopPropagation();\n}\nfunction handleClickEvent2(ev)\
  \ {\n  const e = ev || window.event;\n  this.classList.toggle('selected-border');\n\
  \  e.stopPropagation();\n}\nfunction init() {\n  const elements = document.querySelectorAll('.level1,\
  \ .level2, .level3');\n  for(let i=0; i<elements.length; i++) {\n    elements[i].addEventListener('click',\
  \ handleClickEvent1);\n    elements[i].addEventListener('click', handleClickEvent2);\n\
  \  }\n} \n```\n\n**代码列表 6.32** 示例中，首先注册了两个事件处理器\n\n![调用 stopPropagation() 时，两个注册的事件监听器都会被调用](img/img-f6.16.html)\n\
  \n**图 6.16** 调用 stopPropagation() 时，两个注册的事件监听器都会被调用\n\n然而，如果你想阻止事件的传播，即使对于注册在单个元素上的事件监听器也是如此，必须采用\
  \ `stopImmediatePropagation()` 方法。代码列表 6.33 显示了一个示例：`handleClickEvent1()` 函数现在调用了此方法，这反过来确保了第二个注册的事件监听器将不再调用\
  \ `handleClickEvent2()` 函数（见图 6.17）。\n\n```javascript\nfunction handleClickEvent1(ev)\
  \ {\n  const e = ev || window.event;\n  this.classList.toggle('selected');\n  e.stopImmediatePropagation();\n\
  }\nfunction handleClickEvent2(ev) {\n  const e = ev || window.event;\n  this.classList.toggle('selected-border');\n\
  \  e.stopPropagation();\n} \n```\n\n**代码列表 6.33** 立即取消传播也会防止注册在相应元素上的其他事件处理器被执行\n\
  \n![调用 stopImmediatePropagation() 后，同一元素上的后续事件监听器将不会执行](img/img-f6.17.html)\n\n\
  **图 6.17** 调用 stopImmediatePropagation() 后，同一元素上的后续事件监听器将不会执行\n\n#### 注意\n\n`stopPropagation()`\
  \ 方法阻止事件传播到定义在其他元素上相应事件的事件监听器，而 `stopImmediatePropagation()` 方法则阻止事件传播，即使对于那些在同一元素上注册的事件事件监听器。\n\
  \n### 6.4.3 阻止事件的默认行为\n\n虽然可以使用 `stopPropagation()` 和 `stopImmediatePropagation()`\
  \ 方法来阻止事件传播，但也可以使用 `preventDefault()` 方法来阻止浏览器的默认行为。\n\n代码列表 6.34 显示了这样一个示例。`handleLinkClicked()`\
  \ 函数被注册为链接（即 `<a>` 元素）`click` 事件的事件监听器。然而，如果点击链接，相应的链接 URL 将会被打开（正如我们所知，这是浏览器处理链接的默认行为）；调用\
  \ `preventDefault()` 方法可以阻止链接打开。\n\n```javascript\nfunction handleLinkClicked(e)\
  \ {\n  console.log('Link clicked');\n  e.preventDefault();\n}\n\nfunction init()\
  \ {\n  const element = document.getElementById('link');\n  element.addEventListener(\n\
  \    'click',\n    handleLinkClicked,\n    false\n  );\n}\n\ndocument.addEventListener('DOMContentLoaded',\
  \ init); \n```\n\n**代码列表 6.34** 阻止事件监听器的默认行为\n\n值得注意的特殊之处是，对于事件处理器（与事件监听器相反），调用\
  \ `preventDefault()` 方法是不可能的。相反，这种行为由返回值决定：如果该值为 `false`，则阻止默认行为；如果为 `true` 或未指定返回值，则执行默认函数。相应的示例在代码列表\
  \ 6.35 中所示。\n\n```javascript\nfunction handleLinkClicked(e) {\n  console.log('Link\
  \ clicked');\n  return false;\n}\n\nfunction init() {\n  const element = document.getElementById('link');\n\
  \  element.onclick = handleLinkClicked;\n}\n```\n\n**代码列表 6.35** 阻止默认行为\n\n####\
  \ 通用函数\n\n代码列表 6.36 显示了一个导致事件监听器和事件处理器阻止默认行为的通用辅助函数。该函数首先检查事件对象上是否存在 `preventDefault()`\
  \ 方法。如果是，则调用该方法。否则，通过 `returnValue` 属性将（现在假设的）事件处理器的返回值设置为 `false`。\n\n```javascript\n\
  function stopDefault(e) {\n  if (e && e.preventDefault) {\n    e.preventDefault();\n\
  \  } else if (window.event && window.event.returnValue) {\n    window.event.returnValue\
  \ = false;\n  }\n}\n```\n\n**代码列表 6.36** 辅助函数\n\n```javascript\nfunction handleLinkClicked(e)\
  \ {\n  console.log('Link clicked');\n  stopDefault(e);\n}\n\nfunction init() {\n\
  \  const element = document.getElementById('link');\n  element.onclick = handleLinkClicked;\n\
  \  const element2 = document.getElementById('link2');\n  element2.addEventListener(\n\
  \    'click',\n    handleLinkClicked,\n    false\n  );\n}\n\ndocument.addEventListener('DOMContentLoaded',\
  \ init);\n```\n\n**代码列表 6.37** 辅助函数的使用\n\n#### 事件处理器的返回值\n\n在定义为事件处理器的函数中，返回值 `false`\
  \ 不仅会阻止浏览器通常为相应事件执行的默认行为，还会阻止事件的传播。返回值 `false` 对于事件监听器实际上等同于调用 `preventDefault()`\
  \ 和 `stopPropagation()`。\n\n### 6.5 程序化触发事件\n\nJavaScript 中的事件（以及通用的事件驱动编程）不仅可以通过即时用户操作触发，还可以通过程序化的触发——即通过\
  \ JavaScript 代码触发。\n\n### 6.5.1 触发简单事件\n\n\n\n\n要通过编程触发事件，只需创建一个 `Event` 对象的实例，并将其作为参数传递给\
  \ DOM 树中任何元素均可使用的 `dispatchEvent()` 方法。\n\n传递给 `Event` 构造函数的第一个参数是一个定义事件类型的字符串。可选地，作为第二个参数传递的配置对象可用于确定该事件是否应该经过冒泡阶段（通过\
  \ `bubbles` 属性），以及是否允许阻止浏览器的默认行为（通过 `cancelable` 属性）。\n\n随后，可以将通过构造函数创建的对象实例传递给\
  \ `dispatchEvent()` 方法，该方法在内部会确保该事件在调用该方法的元素上触发。列表 6.38 展示了这一操作的一个示例。\n\n```javascript\n\
  function init() {\n  const element = document.getElementById('example')\n  const\
  \ event = new Event(\n  'example',             // 事件类型\n  {\n    bubbles: true,\
  \       // 允许冒泡\n    cancelable: false    // 默认行为无法...\n                       \
  \  // ...被阻止。\n  });\n  element.addEventListener(\n    'example',              \
  \              // 事件类型\n    (event) => {\n      console.log('Event triggered');\n\
  \      console.log(event.type);            // \"example\"\n    },\n    false\n \
  \ );\n  element.dispatchEvent(event);\n}\n\ndocument.addEventListener('DOMContentLoaded',\
  \ init); \n```\n\n**列表 6.38** 触发事件的示例\n\n### 6.5.2 使用传递的参数触发事件\n\n如果你想为触发的事件或相应的事件对象分配特定信息，并且这些信息可以在定义的事件处理器和注册的事件监听器中访问，请使用\
  \ `CustomEvent` 对象类型而不是 `Event` 对象类型。\n\n`CustomEvent` 的构造函数可以通过 `detail` 属性通过配置对象（也可以作为第二个参数传递）传递相应的数据。列表\
  \ 6.39 展示了这一操作的示例。在这里，一个对象（带有 `firstName`、`lastName` 和 `id` 属性）作为参数传递给事件对象，并在事件监听器中读取。\n\
  \n```javascript\nfunction init() {\n  const element = document.getElementById('example')\n\
  \  const event = new CustomEvent('example', {\n    detail: {\n      firstName: 'John',\n\
  \      lastName: 'Doe',\n      id: 4711\n    }\n  });\n  element.addEventListener(\n\
  \    'example',\n    (event) => {\n      console.log('Event triggered');\n     \
  \ console.log(event.type);             // \"example\"\n      console.log(event.detail.firstName);\
  \ // \"John\"\n      console.log(event.detail.lastName);  // \"Doe\"\n      console.log(event.detail.id);\
  \        // 4711\n    },\n    false\n  );\n  element.dispatchEvent(event);\n}\n\n\
  document.addEventListener('DOMContentLoaded', init); \n```\n\n**列表 6.39** 触发事件时指定参数的示例\n\
  \n### 6.5.3 触发默认事件\n\n此外，你还可以通过编程方式触发其他事件（例如鼠标事件或键盘事件），并以这种方式虚拟地模拟用户交互。要这样做，只需创建相应事件对象类型的实例，如\
  \ 列表 6.40 中使用鼠标事件所示，并将其传递给 `dispatchEvent()` 方法。\n\n```javascript\nfunction init()\
  \ {\n  const element = document.getElementById('example')\n  const event = new MouseEvent('click',\
  \ {\n    'view': window,\n    'bubbles': true,\n    'cancelable': true\n  });\n\
  \  element.addEventListener(\n    'click',\n    (event) => {\n      console.log('Element\
  \ clicked');\n    },\n    false\n  );\n  element.dispatchEvent(event);\n}\n\ndocument.addEventListener('DOMContentLoaded',\
  \ init); \n```\n\n**列表 6.40** 触发鼠标点击事件的示例\n\n#### 浏览器支持\n\n结束本章的最后一点是：本章介绍的事件（以及此处未处介绍的其他事件）的支持情况在浏览器之间可能不同。一如既往，涉及任何功能的浏览器支持时，[`caniuse.com`](http://caniuse.com)\
  \ 的 Can I Use 网站提供了良好的概览。\n\n## 6.6 总结\n\n在本章中，你学习了 JavaScript 事件驱动编程的基本操作。除此，你现在知道如何响应用户操作（无论是鼠标还是键盘交互）、表单输入或其他触发的事件。以下是最重要的点：\n\
  \n*   在事件驱动编程中，会触发可以在代码中处理的事件。\n*   通常情况下，响应事件的代码被称为事件处理器（event handler）或事件监听器（event\
  \ listener）。\n*   在 JavaScript 中，你可以使用 HTML（HTML 事件处理器）或 JavaScript（JavaScript 事件处理器）来定义事件处理器，但事件监听器只能通过\
  \ JavaScript 定义。\n*   在 JavaScript 中，事件监听器相对于事件处理器的优势在于你可以为一个元素注册多个监听器。\n*   在本章中，我们主要展示了如何在\
  \ DOM 树的元素上注册事件监听器。然而，注册事件监听器的概念远不止于：它们也可以注册到如 `window` 等对象上。\n*   JavaScript 开发中存在多种类型的事件，包括鼠标事件、键盘事件、表单交互事件等。\n\
  *   当事件在 DOM 树的元素上触发时，它会经过多个阶段：在捕获阶段，事件从文档节点向下传递到目标元素，执行每个注册的捕获阶段监听器。在目标阶段，注册在目标元素上的监听器被执行。在第三个阶段，即冒泡阶段，事件从目标元素向上回到文档节点，执行所有注册的冒泡阶段监听器。\n\
  *   最后，你学习了如何通过编程方式触发事件，无论是通过 `Event` 对象类型触发通用事件，通过 `CustomEvent` 对象类型使用参数触发事件，还是通过各种对象类型（如\
  \ `MouseEvent`）。\n\n# 7 处理表单\n\n表单以及相关的表单字段（如输入字段、选择列表等）是交互式应用程序的重要部分。基本上，表单即使没有\
  \ JavaScript 也可以工作，但 JavaScript 可以显著提高表单的交互性和用户友好性。\n\n除了前两个章节外，之前的章节都非常详尽，而关于表单处理的章节会让你放松一下——一方面因为它不那么冗长，另一方面是因为我们将回顾之前关于\
  \ DOM 和事件处理的两个章节中的许多概念。本章详细介绍了以下主题：\n\n*   如何在网页页面中选择表单并访问表单数据（第 7.1 节）？由于之前的章节，这部分内容对你来说都很容易。不过，这里确实有一些需要注意的特殊之处。\n\
  \n\n\n\n*   如何通过 JavaScript 提交表单（节 7.2）？你在第 6 章中学习过，你可以程序化地触发，例如鼠标事件或键盘事件。表单提交也可以通过\
  \ JavaScript 进行程序化执行（尽管方式与事件触发不同）。\n\n*   如何验证输入的表单数据——也就是说，检查其有效性（节 7.3）？我们在第 6\
  \ 章中将此主题作为实现目的的手段，用以解释事件处理。但在本章中，我们将讨论约束验证 API（Constraint Validation API），它是专门为验证表单设计的。\n\
  \n## 7.1 访问表单和表单字段\n\n在第 5 章中，你学习了如何使用 JavaScript 访问网页中的单个元素。访问表单的工作非常相似。\n\n###\
  \ 7.1.1 访问表单\n\n你有几种方法可以访问网页上的表单：\n\n*   通过第 5 章中介绍的元素选择方法：`getElementById()`、`getElementsByClassName()`、`getElementsByTagName()`、`getElementsByName()`、`querySelector()`\
  \ 和 `querySelectorAll()`。\n\n*   通过 `document` 对象的 `forms` 属性。\n\n*   通过 `document`\
  \ 对象的与对应表单名称对应的属性。\n\n让我们演示这三种访问方式。为此，首先看列表 7.1 中所示的表单。这是一个简单的登录表单，包含一个用于用户名的输入字段、一个用于输入密码的密码字段、一个用于保存登录数据的复选框以及一个用于提交表单的按钮（参见图\
  \ 7.1）。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
  UTF-8\">\n  <title>Form example</title>\n  <link rel=\"stylesheet\" href=\"styles/main.css\"\
  >\n  <link \n    href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/\n \
  \     bootstrap.min.css\"\n    rel=\"stylesheet\" \n    crossorigin=\"anonymous\"\
  \n  >\n  <link \n    rel=\"stylesheet\" \n    href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/\n\
  \      bootstrap-theme.min.css\" \n    crossorigin=\"anonymous\"\n  >\n</head>\n\
  <body\n<form \n  id=\"login\" \n  name=\"login\" \n  method=\"post\" \n  action=\"\
  login.html\"\n  class=\"form col-xs-4 center-block\"\n>\n  <div class=\"form-group\"\
  >\n    <label for=\"username\">Username:</label>\n    <input \n      type=\"text\"\
  \ \n      id=\"username\" \n      name=\"username\" \n      class=\"form-control\"\
  \ \n      value=\"\" \n      placeholder=\"Username\"\n    >\n  </div>\n  <div class=\"\
  form-group\">\n    <label for=\"password\">Password:</label>\n    <input \n    \
  \  type=\"password\" \n      id=\"password\" \n      name=\"password\" \n      class=\"\
  form-control\" \n      value=\"\" \n      placeholder=\"Password\"\n    >\n  </div>\n\
  \  <div class=\"checkbox\">\n    <label for=\"remember\">\n      <input \n     \
  \   type=\"checkbox\" \n        id=\"remember\" \n        name=\"remember\" \n \
  \       value=\"on\"\n      >\n      Remember login on this computer\n    </label>\n\
  \  </div>\n  <button \n    type=\"submit\" \n    id=\"submit\" \n    name=\"submit\"\
  \ \n    class=\"btn btn-primary btn-block\"\n  >\n    Login\n  </button>\n</form>\n\
  <script src=\"scripts/main.js\"></script>\n</body>\n</html>\n```\n\n**列表 7.1** 简单登录表单的\
  \ HTML 代码\n\n![一个简单的登录表单](img/klein07_001.png)](img-f7.1.html)\n\n**图 7.1** 一个简单的登录表单\n\
  \n### Bootstrap 框架\n\n为了让它看起来更漂亮，使用了 Bootstrap CSS 框架（[`getbootstrap.com`](http://getbootstrap.com))进行布局。\n\
  \n在列表 7.2 中，你可以看到上述提到的三种访问此表单的方法。你已经了解了通过 DOM 选择方法访问。另外两种访问类型在此时也很有趣。\n\n例如，`document`\
  \ 对象的 `forms` 属性包含网页上所有表单的列表。在列表中，表单按照它们出现的顺序排序：第一个在 `0`，第二个在 `1`，依此类推。此外，对于每个具有名称（即具有\
  \ `name` 属性）的表单，`document` 会隐式地提供相应的属性。\n\n```javascript\n// 1.) 通过 DOM 选择方法访问\n\
  const formById = document.getElementById('login');\nconst formByName = document.getElementsByName('login');\n\
  const formBySelector = document.querySelector('form');\n// 2.) 通过 forms 属性访问\nconst\
  \ formByForms = document.forms[0];\n// 3.) 通过表单名称访问\nconst formByNameField = document.login;\n\
  console.log(formById.id);              // \"login\"\nconsole.log(formByName.id);\
  \            // \"login\"\nconsole.log(formBySelector.id);       // \"login\"\n\
  console.log(formByForms.id);          // \"login\"\nconsole.log(formByNameField.id);\
  \       // \"login\"\n```\n\n**列表 7.2** 访问表单\n\n你应该选择哪种选择表单的方法？我们建议你始终使用选择方法之一，且最好是\
  \ `getElementById()` 或 `querySelector()` 方法。\n\n原因在于：虽然 `forms` 属性允许快速访问网页上的所有表单，但仔细观察会发现它有一个缺点。如果网页上有多个表单，那么就有必要确切知道目标表单的位置。此外，如果表单的顺序发生变化，或者（前面的）表单从网页中移除，或者添加了新的（前面的）表单，索引也必须进行调整。\n\
  \n通过 `document` 对象的同名属性通过表单名称访问也不理想，因为你必须小心不要选择与 `document` 对象现有属性或方法重名的名称。相比之下，`getElementById()`\
  \ 和 `querySelector()` 方法可以用于无歧地选择元素，从而在上述情况下不会出现问题。\n\n表单提供了各种属性，例如 `elements` 属性，允许你访问表单中包含的单个表单元素（详情见下一节）；`name`\
  \ 属性，包含表单的名称；以及 `action` 和 `method` 属性包含关于表单应触发什么操作（或表单数据应发送到哪个 URL）以及为此应使用何种 HTTP\
  \ 方法（`POST` 或 `GET`）。列表 7.3 展示了列表 7.1 中表单的若干示例。\n\n\n\n\n\n```\nconst form = document.getElementById('login');\n\
  console.log(form.elements);           // Form elements, details to follow\nconsole.log(form.length);\
  \             // Number of form elements\nconsole.log(form.name);              \
  \ // Name of the form, \"login\" in this case\nconsole.log(form.action);       \
  \      // Content of the \"action\" attribute\nconsole.log(form.method);       \
  \      // HTTP method, \"post\" in this case \n```\n\n列表 7.3 访问表单的选中属性\n\n### 7.1.2\
  \ 访问表单元素\n\n要访问表单内的单个表单元素，你有以下选项：\n\n- 使用选择元素的方法，例如 `getElementById()`、`getElementsByClassName()`、`getElementsByTagName()`、`getElementsByName()`、`querySelector()`\
  \ 和 `querySelectorAll()`\n- 使用相应 `form` 对象的 `elements` 属性\n\nListing 7.4 显示了某些相应的示例。通过\
  \ DOM 选择方法进行选择并不新鲜，因此我们将直接跳转到每个表单对象提供的 `elements` 属性。它存储了包含在相应表单中的表单元素列表。列表中的单个元素通过索引访问，这（与\
  \ Section 7.1.1 中讨论的 `forms` 属性一样）也反映了相应元素在表单中的位置。\n\n```\n// 1.) 通过 DOM 选择方法访问\n\
  const fieldUserNameById = document.getElementById('username');\nconst fieldPasswordById\
  \ = document.getElementById('password');\nconst fieldRememberById = document.getElementById('remember');\n\
  const buttonSubmitById = document.getElementById('submit');\nconsole.log(fieldUserNameById.id);\
  \    // \"username\"\nconsole.log(fieldPasswordById.id);    // \"password\"\nconsole.log(fieldRememberById.id);\
  \    // \"remember\"\nconsole.log(buttonSubmitById.id);     // \"submit\"\n\n//\
  \ 2.) 通过 elements 属性访问\nconst form = document.getElementById('login');\nconst formElements\
  \ = form.elements;\nconsole.log(formElements.length);     // 4\nconst fieldUserName\
  \ = formElements[0];\nconst fieldPassword = formElements[1];\nconst fieldRemember\
  \ = formElements[2];\nconst buttonSubmit = formElements[3];\nconsole.log(fieldUserName.id);\
  \        // \"username\"\nconsole.log(fieldPassword.id);        // \"password\"\n\
  console.log(fieldRemember.id);        // \"remember\"\nconsole.log(buttonSubmit.id);\
  \         // \"submit\" \n```\n\n列表 7.4 访问表单元素\n\n因此，我们刚刚关于访问表单给出的相同建议也适用于访问表单元素：通过\
  \ DOM 选择方法访问是应对 HTML 代码更改时韧性最强的选项，而通过 `elements` 属性访问是韧性最差的选项。如果表单元素的顺序（即表单内的元素顺序）发生变化，你必须反复调整\
  \ JavaScript 代码。\n\n每个表单元素由一种特殊的对象类型表示，如 Table 7.1 所示。你可以看到，文本字段、密码字段、单选按钮和复选框都由\
  \ `HTMLInputElement` 类型表示，文本区域由 `HTMLTextAreaElement` 类型表示，选择列表由 `HTMLSelectElement`\
  \ 类型表示，选择列表中的单个选项由 `HTMLOptionElement` 类型表示。\n\n| 对象类型 | 表单元素 |\n| --- | --- |\n\
  | 密码字段 | `HTMLInputElement` |\n| 文本字段 | `HTMLInputElement` |\n| 单选按钮 | `HTMLInputElement`\
  \ |\n| 复选框 | `HTMLInputElement` |\n| 文本区域 | `HTMLTextAreaElement` |\n| 选择列表 | `HTMLSelectElement`\
  \ |\n| 选择列表中的选项 | `HTMLOptionElement` |\n\n表 7.1 重要表单元素及其对应的对象类型\n\n#### HTML 组件的\
  \ JavaScript 对象\n\n如 Chapter 5 所述，不同的 HTML 组件也由不同的 JavaScript 对象表示，每个对象都有特定的属性和方法。在之前的章节中，这已经通过表单进行了演示（例如使用\
  \ `HTMLFormElement`、`HTMLInputElement` 或 `HTMLOptionElement` 类型）。\n\n现在让我们接下来的章节中向你展示如何访问单个表单元素。\n\
  \n### 7.1.3 读取文本字段和密码字段的值\n\n要访问文本字段的值，可以使用相应元素的 `value` 属性。Listing 7.5 显示了此示例。在这里，访问了开头示例中的两个输入字段（文本字段和密码字段），并为\
  \ `change` 事件注册了事件监听器，每当输入字段的值改变时，该事件就会触发。\n\n在事件监听器内部，`this` 关键字允许访问触发事件监听器的相应元素。换句话说，注册事件监听器的元素代表了它的执行上下文。此外，你会发现存储在\
  \ `value` 属性中的文本是以明文存储的，即使对于密码字段也是如此；也就是说没有以任何方式加密（文本字段和密码字段都是 `HTMLInputElement`\
  \ 类型）。\n\n```\nconst inputUsername = document.getElementById('username');\nconst\
  \ inputPassword = document.getElementById('password');\ninputUsername.addEventListener('change',\
  \ function(e) {\n  console.log(this.value);              // entered value\n});\n\
  inputPassword.addEventListener('change', function(e) {\n  console.log(this.value);\
  \              // entered value\n}); \n```\n\n列表 7.5 访问文本和密码字段的值\n\n然而，在事件监听器中使用\
  \ `this` 时，必须记住的一点是：如果事件监听器被表示为箭头函数，那么 `this` 指的不是定义事件监听器的元素，而是定义箭头函数时的上下文（另见 Chapter\
  \ 3）。\n\n因此，在定义为箭头函数的事件监听器中访问表单元素，还有另外两种方法：一方面，你可以将相应的表单元素缓存在变量中并访问它（示例如 Listing\
  \ 7.6 所示）。\n\n```\nconst inputUsername = document.getElementById('username');\n\
  const inputPassword = document.getElementById('password');\ninputUsername.addEventListener('change',\
  \ (e) => {\n  console.log(inputUsername.value);     // entered value\n  console.log(this.value);\
  \              // undefined\n});\ninputPassword.addEventListener('change', (e) =>\
  \ {\n  console.log(inputPassword.value);     // entered value\n  console.log(this.value);\
  \              // undefined\n}); \n```\n\n列表 7.6 在箭头函数定义的事件监听器中，this 不指向相应元素\n\n\
  \n\n\n另一方面，你可以使用事件对象来访问相应的表单元素。你已经在上一个章节中了解了如何操作，但为了完整性，这里在列表 7.7 中再次进行了插说明。\n\n\
  ```\ninputUsername.addEventListener('change', (e) => {\n  console.log(e.target.value);\
  \          // 输入的值\n});\ninputPassword.addEventListener('change', (e) => {\n  console.log(e.target.value);\
  \          // 输入的值\n}); \n```\n\n**列表 7.7 通过事件对象访问**\n\n### 7.1.4 读取复选框的值\n\n复选框的读取方式与文本字段和密码字段类似。在这里，同样可以通过\
  \ `value` 属性访问复选框的值（默认情况下，该属性的值为 `on`）。然而，要检查复选框是否被选中（即是否已勾选），你需要使用 `checked` 属性，它会返回一个相应的布尔值。示例见列表\
  \ 7.8。\n\n```\nconst checkbox = document.getElementById('remember');\ncheckbox.addEventListener('change',\
  \ (e) => {\n  console.log(checkbox.value);    // 默认值是 \"on\"\n  console.log(checkbox.checked);\
  \  // true 或 false\n}); \n```\n\n**列表 7.8 访问复选框**\n\n### 7.1.5 读取单选按钮的值\n\n通常，单选按钮总是以一组的形式出现在网页中。你可能已经知道，在一个单选按钮组中，一次只能选择一个单选按钮。单选按钮所属的组由\
  \ `name` 属性的值决定。例如，列表 7.9 中显示的单选按钮都属于 `order` 组（另参见图 7.2）。\n\n```\n...\n<body>\n\
  \  <form id=\"orderform\" name=\"orderform\" class=\"form col-xs-12 center-block\"\
  >\n    <div class=\"form-group\">\n      <input type=\"radio\" id=\"P001\" name=\"\
  order\" value=\"P001\">\n        <label for=\"P001\">Pizza Salami</label>\n    \
  \  </input>\n    </div>\n    <div class=\"form-group\">\n      <input type=\"radio\"\
  \ id=\"P002\" name=\"order\" value=\"P002\">\n        <label for=\"P002\">Pizza\
  \ Margherita</label>\n      </input>\n    </div>\n    <div class=\"form-group\"\
  >\n      <input type=\"radio\" id=\"P003\" name=\"order\" value=\"P003\">\n    \
  \    <label for=\"P003\">Pizza Tonno</label>\n      </input>\n    </div>\n    <div\
  \ class=\"form-group\">\n      <input type=\"radio\" id=\"P004\" name=\"order\"\
  \ value=\"P004\">\n        <label for=\"P004\">Pizza Mozzarella</label>\n      </input>\n\
  \    </div>\n    <div class=\"form-group\">\n      <input type=\"radio\" id=\"P005\"\
  \ name=\"order\" value=\"P005\">\n        <label for=\"P005\">Pizza Hawaii</label>\n\
  \      </input>\n    </div>\n  </form>\n  <div class=\"form col-xs-12 center-block\"\
  >\n    Selection:\n    <div id=\"selection\">\n    </div>\n  </div>\n</body>\n...\
  \ \n```\n\n**列表 7.9 使用单选按钮的 HTML 代码**\n\n![一组单选按钮](img/img-f7.2.html)\n\n**图 7.2\
  \ 一组单选按钮**\n\n列表 7.10 展示了如何访问组内的单个单选按钮。实现此最简单的方法是访问与单选按钮组同名的表单属性（在此例中，为 `order`\
  \ 属性）。在该属性中，组中的所有单选按钮都以列表的形式存储。在示例中，我们遍历了这个列表并为每个单选按钮注册了事件监听器。后者确保了当单选按钮被选中时（触发\
  \ `change` 事件），被选单选按钮的值（`value` 属性）会被写入 ID 为 `selection` 的 `div` 中（另参见图 7.2）。\n\n\
  ```\nconst messageContainer = document\n  .getElementById('selection');        \
  \           // 消息容器\nconst orderForm = document\n  .getElementById('orderform');\
  \                   // 表单\nconst radioButtons = orderForm.order;\nfor(let i=0; i<radioButtons.length;\
  \ i++) {\n  radioButtons[i].addEventListener('change', (e) => {\n    console.log(e.target.value);\
  \                  //例如 \"P002\"\n    messageContainer.innerText = e.target.value;\
  \  // 显示消息\n  });\n} \n```\n\n**列表 7.10 访问组中的单选按钮**\n\n### 7.1.6 选择列表的值\n\n接下来，我将向你展示如何访问选择列表的值。列表\
  \ 7.11 中显示的选择列表作为基础。\n\n```\n...\n<body>\n  <form id=\"orderform\" name=\"orderform\"\
  \ class=\"form col-xs-12 center-block\">\n    <div class=\"form-group\">\n     \
  \ <input type=\"radio\" id=\"P001\" name=\"order\" value=\"P001\">\n        <label\
  \ for=\"P001\">Pizza Salami</label>\n      </input>\n    </div>\n    <div class=\"\
  form-group\">\n      <input type=\"radio\" id=\"P002\" name=\"order\" value=\"P002\"\
  >\n        <label for=\"P002\">Pizza Margherita</label>\n      </input>\n    </div>\n\
  \    <div class=\"form-group\">\n      <input type=\"radio\" id=\"P003\" name=\"\
  order\" value=\"P003\">\n        <label for=\"P003\">Pizza Tonno</label>\n     \
  \ </input>\n    </div>\n    <div class=\"form-group\">\n      <input type=\"radio\"\
  \ id=\"P004\" name=\"order\" value=\"P004\">\n        <label for=\"P004\">Pizza\
  \ Mozzarella</label>\n      </input>\n    </div>\n    <div class=\"form-group\"\
  >\n      <input type=\"radio\" id=\"P005\" name=\"order\" value=\"P005\">\n    \
  \    <label for=\"P005\">Pizza Hawaii</label>\n      </input>\n    </div>\n  </form>\n\
  \  <div class=\"form col-xs-12 center-block\">\n    Selection:\n    <div id=\"selection\"\
  >\n    </div>\n  </div>\n</body>\n... \n```\n\n**列表 7.11 选择列表的 HTML 代码**\n\n选择列表也可以通过\
  \ `change` 事件做出响应。每当在选择列表中选择值时，就会触发此事件。再次，使用 `value` 属性来访问选中的值。示例见列表 7.12。`updateOrder()`\
  \ 函数被注册为 `change` 事件的事件监听器（这次不是箭头函数，因此可以使用 `this` 访问选择列表）。\n\n除此之外，选择列表拥有 `selectedIndex`\
  \ 属性，它包含了选中选项的索引。可以使用 `item()` 方法根据此索引访问相应的选择元素（类型为 `HTMLOptionElement`）。每个选择元素都有两个可以读取底层\
  \ `<option>` 元素的值（`value`）和文本（`text`）的属性。（后者包含在选择列表的 `value` 属性中。）\n\n```\nfunction\
  \ init() {\n  const messageContainer = document\n    .getElementById('selection');\
  \                   // 消息容器\n  const order = document.getElementById('order'); \
  \  // <select> 元素\n  order.addEventListener('change', updateOrder);    // 注册监听\n\
  \n  function updateOrder(event) {                 // this 的类型是\n               \
  \  // HTMLSelectElement\n    const value = this.value;                   // 当前选的值\n\
  \    const index = this.selectedIndex;           // 选中选项的索引\n    const option =\
  \ this.item(index);            // 对应的 <option> 元素\n    const text = this.item(index).text;\
  \         // <option> 元素的文本\n    const message = text + ' (' + value + ')';  //\
  \ 生成消息\n    messageContainer.innerText = message;       // 显示消息\n  }\n} \n```\n\n\
  **列表 7.12 访问选择列表的选中值**\n\n\n\n\n### 7.1.7 读取多选择列表的值\n\n如你所知，HTML 中可以使用 `multiple`\
  \ 属性来定义一个可以选择多个值的选择列表——即多选择列表（参见列表 7.13）。\n\n```\n...\n<select id=\"order\" name=\"\
  order\" size=\"4\" multiple>\n  <option selected value=\"P001\">Pizza Salami</option>\n\
  \  <option value=\"P002\">Pizza Margherita</option>\n  <option value=\"P003\">Pizza\
  \ Tonno</option>\n  <option value=\"P004\">Pizza Mozzarella</option>\n  <option\
  \ value=\"P005\">Pizza Hawaii</option>\n</select>\n... \n```\n\n**列表 7.13** 具有多重选择功能的选择列表的\
  \ HTML 代码\n\n然而，在这种情况下，之前使用的 `selectedIndex` 属性无法带你走多远。相反，你必须使用 `selectedOptions`\
  \ 属性，它包含一个已选值列表（更准确地说，是一个 `HTMLCollection` 类型的对象，而该类型又包含 `HTMLOptionElement` 类型的对象）。\n\
  \n列表 7.14 展示了如何使用该属性读取所有选值。你可以在图 7.4 中查看程序的运行。\n\n```\n...\nfunction updateOrder(event)\
  \ {\n  while (messageContainer.firstChild) {           // 删除所有消息\n    messageContainer.removeChild(\n\
  \      messageContainer.firstChild\n    );\n  }\n  const options = this.selectedOptions;\
  \           // 选中的选项\n  for (let i = 0; i < options.length; i++) {      // 遍历每个选项\
  \ ...\n    const message = options[i].text               // ... 生成 ...\n      +\
  \ ' (' + options[i].value + ')';            // ... 消息 ...\n    const div = document.createElement('div');\
  \    // ... 并添加 ...\n    const optionText = document                   //\n    \
  \  .createTextNode(message);                   //\n    div.appendChild(optionText);\
  \                  //\n    messageContainer.appendChild(div);            // ...\
  \ 添加到容器\n  }\n}\n... \n```\n\n**列表 7.14** 访问选择列表的所有选值\n\n![通过 JavaScript 在选择列表下方显示所有选值](img/img-f7.4.html)\n\
  \n**图 7.4** 通过 JavaScript 在选择列表下方显示所有选值\n\n### 7.1.8 使用 JavaScript 为选择列表填充值\n\n\
  在某些情况下，通过 JavaScript 动态生成下拉菜单列表中的选项可能是很有帮助的。要实现这一点，你可以选择简单地创建 `Option` 类型的新对象实例，并通过\
  \ `add()` 方法将它们添加到相应的选择列表中。这种方法的示例见列表 7.15。基于包含各种对象的 `options` 数组，使用计数循环为这些对象中的每一个生成一个条目并将其添加到列表中。\n\
  \n```javascript\nconst messageContainer = document.getElementById('selection');\n\
  const order = document.getElementById('order');\nconst options = [\n  {name: 'Pizza\
  \ Salami', id: 'P001'},\n  {name: 'Pizza Margherita', id: 'P002'},\n  {name: 'Pizza\
  \ Tonno', id: 'P003'},\n  {name: 'Pizza Mozzarella', id: 'P004'},\n  {name: 'Pizza\
  \ Hawaii', id: 'P005'}\n];\nfor(let i=0; i<options.length; i++) {\n  order.add(\n\
  \    new Option(         // <option> 元素的构造函数\n      options[i].name,  // 要显示的文本\n\
  \      options[i].id,    // 与选择关联的可选值\n      false,            // 设置 \"selected\"\
  \ \n                        // 属性的可选规范\n      false             // 关于是否应该预选 \n \
  \                       // 值的可选规范\n    )\n  );\n} \n```\n\n**列表 7.15** 通过 JavaScript\
  \ 向选择列表添加选项\n\n#### 选择文件\n\n若你为 `<input>` 元素的 `type` 属性分配值 `file`，相应的表单将显示一个可以用于选择文件的按钮（例如，以便通过表单上传图像或类似项目）。我们将在第\
  \ 12 章中向你展示如何使用 JavaScript 读取文件。该过程使用了 HTML5 首次引入的 API，因此该主题更适合放在该章节。\n\n## 7.2\
  \ 程序化提交和重置表单\n\nJavaScript 提供了程序化提交表单的可能性。为此，可以使用 `submit()` 方法。此外，可以使用 `reset()`\
  \ 方法重置输入到表单中的值。为了演示这些方法的使用，示例中的默认按钮已被替换为两个 `<span>` 元素。\n\n```html\n...\n<body>\n\
  <form id=\"login\" name=\"login\" action=\"login.html\" class=\"col-4\">\n  <div\
  \ class=\"form-group\">\n    <label for=\"username\">用户名:</label>\n    <input type=\"\
  text\" id=\"username\" name=\"username\" class=\"form-control\" placeholder=\"Username\"\
  >\n  </div>\n  <div class=\"form-group\">\n    <label for=\"password\">密码:</label>\n\
  \    <input type=\"password\" id=\"password\" name=\"password\" class=\"form-control\"\
  \ placeholder=\"Password\">\n  </div>\n  <div class=\"checkbox\">\n    <label for=\"\
  remember\">\n      <input type=\"checkbox\" id=\"remember\" name=\"remember\" value=\"\
  on\">\n      在此设备上登录\n    </label>\n  </div>\n  <span type=\"submit\" id=\"submit\"\
  \ name=\"submit\" class=\"btn btn-primary btn-block\">\n    登录\n  </span>\n  <span\
  \ type=\"reset\" id=\"reset\" name=\"reset\" class=\"btn btn-default btn-block\"\
  >\n    重置\n  </span>\n</form>\n</body>\n...\n```\n\n**列表 7.16** 适配后的登录表单\n\n```javascript\n\
  const loginForm = document.getElementById('login');\nconst loginButton = document.getElementById('submit');\n\
  loginButton.addEventListener('click', (e) => {\n  loginForm.submit();\n});\n```\n\
  \n**列表 7.17** 程序化提交表单\n\n```javascript\nconst loginForm = document.getElementById('login');\n\
  const resetButton = document.getElementById('reset');\nresetButton.addEventListener('click',\
  \ (e) => {\n  loginForm.reset();\n});\n```\n\n**列表 7.18** 程序化重置表单\n\n#### 为表单元素命名时要小心\n\
  \n注意，如果表单中存在名为 `submit` 的元素，则使用 `submit()` 方法提交表单将无法工作。为了理解这一点，请记住在表单内部，单个表单元素可以通过名称访问（第\
  \ 7.1.1 节）。如果你现在将 `submit` 值用于表单元素，表单的 `submit()` 方法将被覆盖。（同样适用于 `reset()` 方法以及此处未讨论的其他表单方法。）\n\
  \n\n\n\n\n自然，随之而来的是，只有当你确定不想使用 `submit()` 方法时，才应该对表单元素使用 `submit` 作为名称。\n\n## 7.3\
  \ 验证表单输入\n\n我们在第 6 章中向你展示了一个验证表单或表单字段中输入值的简单示例。但正如该章节提到的，使用 HTML5 验证输入字段要简单得多，因为它已经提供了一些原生的（native）验证选项。\n\
  \n### 定义\n\n在编程语言或 HTML 的背景下，`native`（原生）一词的意思类似于内置在语言中或包含在语言作用范围之内。因此，HTML5 中的原生验证意味着它已经包含在语言中，不需要通过\
  \ JavaScript 来实现。\n\nListing 7.19 展示了一个简单注册表单示例，该表单使用了适当的属性触发原生验证：例如，输入用户名和电子邮件地址的字段通过\
  \ `required` 属性标记为必填，而电子邮件字段也通过 `type` 属性（值为 `email`）标记为仅接受电子邮件地址的字段。输入网站的字段使用 `type`\
  \ 属性的值仅允许输入（有效的）URL，而输入年龄的字段仅接受特定范围内的数值（通过 `type` 属性的数值 `number`，范围由 `min` 和 `max`\
  \ 属性定义）。\n\n```html\n...\n<form id=\"register\" name=\"register\" method=\"post\"\
  \ action=\"register.html\">\n  <div class=\"form-group\">\n    <label for=\"username\"\
  >Username:</label>\n    <input \n      type=\"text\" \n      id=\"username\" \n\
  \      name=\"username\" \n      required \n      class=\"form-control\"\n    >\n\
  \  </div>\n    <div class=\"form-group\">\n    <label for=\"email\">E-mail:</label>\n\
  \    <input \n      type=\"email\" \n      id=\"email\" \n      name=\"email\" \n\
  \      required \n      class=\"form-control\"\n    >\n  </div>\n      <div class=\"\
  form-group\">\n    <label for=\"url\">Website:</label>\n    <input \n      type=\"\
  url\" \n      id=\"website\" \n      name=\"website\" \n      class=\"form-control\"\
  \n    >\n  </div>\n  <div class=\"form-group\">\n    <label for=\"age\">Age:</label>\n\
  \    <input \n      type=\"number\" \n      id=\"age\" \n      name=\"age\" \n \
  \     min=\"18\" \n      max=\"99\" \n      value=\"18\" \n      class=\"form-control\"\
  \n    >\n  </div>\n  <button \n    type=\"submit\" \n    id=\"submit\" \n    name=\"\
  submit\" \n    class=\"btn btn-primary btn-block\"\n  >\n    Login\n  </button>\n\
  </form>\n... \n```\n\n**Listing 7.19 原生 HTML5 验证示例**\n\n无需一行 JavaScript，你就已经对此类标准情况拥有了可以工作的验证。例如，如果你留空电子邮件地址字段并尝试提交表单，浏览器会生成相应的（但非常通用）错误消息，并应用为\
  \ CSS 伪类 `:invalid` 定义的 CSS 规则（参见 图 7.6 和 图 7.7）。\n\n![HTML5 中的原生验证](img/img-f7.6.html)\n\
  \n**图 7.6 HTML5 中的原生验证**\n\n![根据错误原因，表单有不同的消息](img/img-f7.7.html)\n\n**图 7.7 根据错误原因，表单有不同的消息**\n\
  \n### 表单的 CSS 伪类\n\n对于表单，`:required`、`:invalid` 和 `:valid` CSS 伪类可以用于定义影响外观的 CSS\
  \ 规则，如 20 所示：`:required` 伪类表示标记为必填的元素，`:invalid` 伪类表示包含无效值的元素，而 `:valid` 伪类表示包含有效值的元素。\n\
  \n```css\ninput:required:invalid, input:focus:invalid {\n     border: solid red;\n\
  }\ninput:required:valid {\n    border: solid lightgreen;\n}\n```\n\n7.8 显示了带有有效电子邮件地址的表单。如果现在提交表单，将没有问题。\n\
  \n![有效表单](img/img-f7.8.html)\n\n**图 7.8 有效表单**\n\n然而正如之前提到的，没有 JavaScript 的验证并不灵活。例如，如果你想检查输入的用户名是否已被占用，你无法通过\
  \ HTML 实现（你可能需要数据库查询，这只能通过 JavaScript 实现）。同样适用于验证单个表单元素之间的关系——例如两个输入字段的值是否相同。对于错误消息及其外观，纯\
  \ HTML 也存在限制。\n\n得益于约束验证 API（[`html.spec.whatwg.org/multipage/forms.html#the-constraint-validation-api`](https://html.spec.whatwg.org/multipage/forms.html#the-constraint-validation-api)），HTML5\
  \ 的原生验证也可以通过 JavaScript 进行控制，从而可以更灵活地访问和验证信息。为了这一目的，约束验证 API 定义了适用于表单和表单元素的各种属性和方法（参见表\
  \ 7.2](#07_003.html_t7.2)）。\n\n### 表 7.2 与原生验证相关的属性\n\n| 属性 | 说明 |\n| --- | ---\
  \ |\n| `willValidate` | 返回表单元素是否启用了验证。默认 `true`。如果表单元素通过 `disabled` 属性禁用，该属性值为 `false`。对于其他元素（如\
  \ `<div>` 元素），该属性返回 `undefined`。 |\n| `validity` | 一个 `ValidityState` 类型的对象，该对象包含了关于对应表单元素输入有效性的详细信息。这些信息列在表\
  \ 7.3 中。 |\n| `validationMessage` | 当输入数据无效时浏览器显示的验证消息。此消息取决于浏览器。对于刚才给出的示例，例如 Chrome\
  \ 和 Opera 返回值 `Fill in this field.`，Firefox 返回 `Please fill in this field.`（稍微友好一点），而\
  \ Safari 仅返回 `Value missing`（没那么友好）。 |\n\n\n\n\n\n`willValidate` 属性提供了有关表单元素是否激活了验证的信息，`validationMessage`\
  \ 属性在发生验证错误时包含相应的错误信息，而 `validity` 属性可用于得出关于错误原因的结论。该属性包含一个带有各种属性，每个属性都包含一个布尔值（参见表\
  \ 7.3）——例如，用于缺失输入的 `valueMissing`，用于低于最小或高于最大长度的 `tooShort` 或 `tooLong`，以及用于超出定义值范围的\
  \ `rangeUnderflow` 和 `rangeOverflow`。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Valid` |\
  \ 返回输入字段是否包含字段的指示 |\n| `valueMissing` | 返回输入字段是否为必填字段且未包含任何值的指示 |\n| `typeMismatch`\
  \ | 返回输入字段所需的类型（例如电子邮件地址）是否未通过输入的值的指示 |\n| `patternMismatch` | 返回输入的值是否匹配定义的模式的指示\
  \ |\n| `tooLong` | 返回输入的值是否过长的指示 |\n| `tooShort` | 返回的值是否过短的指示 |\n| `rangeUnderflow`\
  \ | 返回输入的值是否低于定义值范围的指示 |\n| `rangeOverflow` | 返回输入的值是否高于定义值范围的指示 |\n| `stepMismatch`\
  \ | 返回输入的值是否符合 `step` 属性的定义的指示 |\n| `badInput` | 返回输入的值是否无效的指示 |\n| `customError`\
  \ | 返回输入的值是否触发了用户自定义错误的指示 |\n\n**表 7.3** 表单验证相关属性概述\n\nListing 7.21 提供了一个在 JavaScript\
  \ 中使用原生验证的示例。其中，在输入电子邮件地址的文本字段上注册了 `change` 事件监听器。在事件监听器内部，输出了之前讨论的一些属性。\n\n```javascript\n\
  function init() {\n  const emailElement = document.getElementById('email');\n  emailElement.addEventListener('change',\
  \ validateEmail);\n}\n\nfunction validateEmail(e) {\n  const event = (e ? e : window.event);\
  \             // Event\n  const emailElement = (event.target                // Target\
  \ element\n    ? event.target\n    : event.srcElement);\n  console.log(emailElement.willValidate);\
  \           // true\n  console.log(emailElement.validity);               // ValidityState:\
  \ ...\n  console.log(emailElement.validity.valueMissing);  // ... Value present?\n\
  \  console.log(emailElement.validity.valid);         // ... Value valid?\n  console.log(emailElement.validationMessage);\
  \      // Validation message\n}\n\ndocument.addEventListener('DOMContentLoaded',\
  \ init); \n```\n\n**Listing 7.21** 验证数据的输出\n\n该示例可以变得更具实用性——例如，在发生错误时在输入字段下方显示相应的错误信息（参见图\
  \ 7.9）。\n\n![此处显示在输入字段下方，而不是验证消息的默认输出](img/img-f7.9.html)\n\n**图 7.9** 处处显示在输入字段下方，而不是验证消息的默认输出\n\
  \nListing 7.22 显示了相应的 JavaScript 代码（按照惯例，HTML 代码可以在书籍的下载区域找到）。\n\n取决于输入字段是否包含有效值（通过\
  \ `emailElement.validity.valid` 属性识别），如果适用，验证消息将显示在相应的容器元素中。\n\n```javascript\n\
  function validateEmail(e) {\n  ...\n\n  const errorContainer = document.getElementById('email-error');\n\
  \  const messageContainer = errorContainer.querySelector('.error-message');\n  if(!emailElement.validity.valid)\
  \ {\n    messageContainer.textContent = emailElement.validationMessage;\n    errorContainer.style.display\
  \ = 'block';\n  } else {\n    messageContainer.textContent = '';\n    errorContainer.style.display\
  \ = 'none';\n  }\n} \n```\n\n**Listing 7.22** 在输入字段下方显示验证消息\n\n除了上述属性外，得益于约束验证 API，表单和表单元素还有一些与验证相关的方法（参见表\
  \ 7.4）。例如，`checkValidity()` 方法可用于检查单个表单元素或整个表单是否有效（因此，该方法可以在两者上进行调用），`reportValidity()`\
  \ 方法确保在发生错误时也会显示验证消息（以其默认外观），而 `setCustomValidity()` 方法则允许你定义自定义的验证消息。\n\n| 方法 |\
  \ 描述 |\n| --- | --- |\n| `checkValidity()` | 此方法可以在单个表单元素或表单上调用。在第一情况下，它检查相应的表单元素是否包含有效值；在第二种情况下，它检查相应表单的所有表单元素是否包含有效值。在两种情况下，结果都是一个布尔值。\
  \ |\n| `reportValidity()` | 与 `checkValidity()` 方法，该方法也可以在单个表单元素或表单上调用。与 `checkValidity()`\
  \ 相比，它不仅检查表单元素/表单的有效性，还在浏览器中显示任何验证消息（以其默认外观）。 |\n| `setCustomValidity()` | 此方法允许你编写自定义的验证消息。\
  \ |\n\n**表 7.4** 与原生验证相关的方法\n\nListing 7.23 显示了使用 `setCustomValidity()` 的真实世界示例。表单通过第二个文本字段进行了扩展，提示用户再次输入其电子邮件地址，以防止输入有效但错误的电子邮件地址。`validateEmail()`\
  \ 函数在两个输入字段上均注册为 `change` 事件的事件监听器，并检查两个输入字段的内容是否相同。如果不同，则通过 `setCustomValidity()`\
  \ 设置相应的错误信息（反之，使用空字符串调用此方法则意味着验证成功）。你可以在图 7.10（验证失败）和图 7.11（验证成功）中查看程序的结果。\n\n\n\
  \n\n```javascript\nfunction init() {\n  const emailElement = document.getElementById('email');\n\
  \  const emailElement2 = document.getElementById('email2');\n  emailElement.addEventListener('change',\
  \ validateEmail);\n  emailElement2.addEventListener('change', validateEmail);\n\
  }\n\nfunction validateEmail(e) {\n  const emailElement = document.getElementById('email');\n\
  \  const emailElement2 = document.getElementById('email2');\n  if (emailElement.value\
  \ !== emailElement2.value) {\n    emailElement.setCustomValidity('E-mails must match.');\n\
  \    emailElement2.setCustomValidity('E-mails must match.');\n  } else {\n    emailElement.setCustomValidity('');\n\
  \    emailElement2.setCustomValidity('');\n  }\n\n  const errorContainer = document.getElementById('email-error');\n\
  \  const messageContainer = errorContainer.querySelector('.error-message');\n  if(!emailElement.validity.valid)\
  \ {\n    messageContainer.textContent = emailElement.validationMessage;\n    errorContainer.style.display\
  \ = 'block';\n  } else {\n    messageContainer.textContent = '';\n    errorContainer.style.display\
  \ = 'none';\n  }\n}\n\ndocument.addEventListener('DOMContentLoaded', init); \n```\n\
  \n代码列表 7.23 检查两个输入字段是否包含相同值\n\n![无法仅使用 HTML 实现的验证示例](img/img-f7.10.html)\n\n图 7.10\
  \ 无法仅使用 HTML 实现的验证示例\n\n![只有当两个邮箱字段都包含相同值时验证才成功](img/img-f7.11.html)\n\n图 7.11 只有当两个邮箱字段都包含相同值时，验证才成功\n\
  \n另一方面，如果你希望仅在表单提交或按下相应的提交按钮后才通过 JavaScript 触发原生验证，则你必须将 `noValidate` 属性设置为 `true`，如代码列表\
  \ 7.24 所示。在默认情况下，原生验证是在提交事件触发之前执行的。这意味着浏览器的默认输出（包括标准验证消息）会先显示，然后你才有机会执行自己的验证并通过\
  \ JavaScript 生成自定义输出。但如果你像示例所示将 `noValidate` 属性设置为 `true`，你就禁用了浏览器的默认输出。（顺便提一下，示例中的其余代码确保了表单中的所有表单元素都经过了有效性检查。）\n\
  \n```javascript\nfunction init() {\n  const registerForm = document.getElementById('register');\n\
  \  registerForm.noValidate = true; \n  registerForm.addEventListener('submit', validateForm);\n\
  }\n\ndocument.addEventListener('DOMContentLoaded', init);\n\nfunction validateForm(e)\
  \ {\n  const event = (e ? e : window.event); // 事件\n  const form = (event.target\
  \            // 目标元素\n            ? event.target\n            : event.srcElement);\n\
  \  let formIsValid = true;               // 表单有效性\n  const formElements =      \
  \            // 表单元素 ...\n    form.querySelectorAll(              // ... 支持 ...\n\
  \      'input, textarea, select');       // ... 原生验证\n  for (let i = 0; i < formElements.length;\
  \ i++) {\n    const formElement = formElements[i];\n    if (formElement.willValidate\
  \ !== 'undefined') {\n      formElement.checkValidity();\n    } else {\n       \
  \                                 // 浏览器不支持\n                                  \
  \      // 原生 HTML5 验证。\n    }\n    if (!formElement.validity.valid) {  // 如果值无效\
  \ ...\n      formIsValid = false;              // ... 表单数据无效。\n    }\n  }\n  if\
  \ (!formIsValid) {                   // 如果表单数据无效 ...\n    if (event.preventDefault)\
  \ {         // ...\n      event.preventDefault();           // ... 防止默认行为。\n   \
  \ }\n  }\n  return formIsValid;\n} \n```\n\n代码列表 7.24 验证表单内的所有表单字段\n\n## 7.4 总结\n\
  \n在本章中，你学习了如何处理表单。你学习了如何从不同类型的表单元素中读取值、如何验证表单数据以及如何提交表单。以下是本章需要记住的最重要要点：\n\n*  \
  \ 网页中的表单可以通过多种方式进行选择：通过熟悉的 DOM 选择方法、通过 `document` 对象的 `forms` 属性，以及通过 `document`\
  \ 对象中对应于相应表单名称的属性。\n*   为了避免在更改网页上表单顺序时修改 JavaScript 代码，你通常应该使用 `getElementById()`\
  \ 或 `querySelector()` 等 DOM 选择方法来选择表单。\n*   表单内的单个表单元素也可以通过不同的方式选择：通过 DOM 选择方法以及相应表单的\
  \ `elements` 属性。\n*   访问单个表单元素的值通常非常相似。文本字段、密码字段、复选框和单选按钮的值可以通过 `value` 属性访问。对于后两者，还可以使用\
  \ `checked` 属性来检查相应元素是否被选中。\n*   可以使用 `submit()` 方法通过 JavaScript 提交表单，而使用 `reset()`\
  \ 方法将它们重置为默认值。\n*   约束验证 API（Constraint Validation API）用于验证表单输入。使用此 API，你可以使用原生的\
  \ HTML5 验证并执行自己的验证。\n\n# 8 控制浏览器和读取浏览器信息\n\n除了你在第 5 章中学习的文档对象模型（DOM）之外，浏览器还提供了第二个特殊对象模型，你可以通过\
  \ JavaScript 访问与浏览器相关的信息。在本章中，我们将使用这个模型向你展示如何访问窗口信息、如何影响导航面板和浏览历史，以及如何识别浏览器。\n\n\
  在浏览器运行时，除了 DOM 之外，还有浏览器对象模型（BOM 或 BOM API）。通过这个模型，可以控制浏览器的某些方面（例如在浏览历史中后退），并从浏览器中读取某些信息（例如关于当前浏览器窗口的大小和位置）。\n\
  \n## 8.1 浏览器对象模型\n\n浏览器对象模型的入口是全局 `window` 对象，如图 8.1 所示。该对象代表单个浏览器窗口（更准确地说是单个浏览器标签页，因为每个浏览器标签页都包含自己的对象实例）。\n\
  \n这个全局对象也是文档对象模型的入口（见第 5 章），正如你所知，它由 `document` 对象表示。严格来说，后者实际上是 `window` 对象的的一个属性，但浏览器也会将其隐式地作为全局对象提供（因此你可以写\
  \ `document` 或 `window.document`）。\n\n\n\n\n\n我们在第 4 章中讨论过的标准 JavaScript 对象（如 `Object`、`Array`\
  \ 和 `Function`）同样也是 `window` 对象的属性，它们也可以作为全局变量可用。\n\n此外，`window` 对象还提供了各种 HTML5\
  \ Web APIs 的入口——例如，地理定位 API（Geolocation API）、存储 API（Storage API）等，我们将在第 12 章中讨论这些。\n\
  \n![浏览器对象模型分类](img/img-f8.1.html)\n\n**图 8.1** 浏览器对象模型分类\n\n然而，在本章中，我们暂时只处理 BOM\
  \ API。具体而言，我们将介绍以下五个直接源于 `window` 对象属性的议题：\n\n*   首先，有一些属性包含了关于浏览器窗口的具体信息，以及可以用于打开各种对话框的方法。我们将在第\
  \ 8.2 节中讨论这些属性和方法。\n*   其次，`location` 属性包含了浏览器窗口当前 URL 的信息（第 8.3 节）。该属性允许你访问当前 URL\
  \ 的各种组件。\n*   `history` 属性包含指向一个 `History` 类型对象的引用。这允许你访问和修改浏览历史（第 8.4 节）。\n*  \
  \ `navigator` 属性包含指向一个 `navigator` 类型对象的引用。该对象提供了浏览器的通用信息，如其名称、制造商详情等（第 8.5 节）。\n\
  *   `screen` 属性包含指向一个 `Screen` 类型对象的引用，你可以使用它来获取有关屏幕的信息，如高度和宽度、颜色深度、像素深度等（第 8.6\
  \ 节）。\n\n#### 背景信息\n\n严格来说，`window` 对象代表 ECMAScript 中定义的全局对象，因此它也拥有该对象标准中定义的所有属性（`undefined`、`NaN`\
  \ 等）和方法（`parseFloat()`、`parseInt()` 等），这些你已经在第 3 章中学习过了。`window` 对象代表全局对象这一事实，反过来导致了\
  \ `window` 对象的所有属性和方法在全局都可用（在访问它们时，并不总是需要在前面加上 `window`）。\n\n## 8.2 访问窗口信息\n\n让我们先介绍用于访问窗口信息的\
  \ `window` 对象通用属性，以及 `window` 对象提供的方法。\n\n### 8.2.1 确定浏览器窗口的大小和位置\n\n为了确定浏览器窗口的大小和位置，有一整套属性提供了各种想象的维度（见图\
  \ 8.2）。`outerHeight` 和 `outerWidth` 属性代表浏览器窗口的高度和宽度，包括所有显示的浏览器工具栏。另一方面，`innerHeight`\
  \ 和 `innerWidth` 属性代表不包含工具栏的高度和宽度，但包含滚动条。\n\n![浏览器窗口（或浏览器标签页）的大小和位置信息](img/img-f8.2.html)\n\
  \n**图 8.2** 浏览器窗口（或浏览器标签页）的大小和位置信息\n\n你可以使用 `screenX` 和 `screenY` 属性来查找浏览器窗口在屏幕上的水平和垂直位置。你可以使用\
  \ `scrollX` 和 `scrollY` 属性来确定浏览器窗口内容在水平和垂直方向滚动了多远（或者简单地使用 `pageXOffset` 和 `pageYOffset`）。这些属性的概述可以在表\
  \ 8.1 中找到，一些示例显示在清单 8.1 中。\n\n| 属性 | 描述 |\n| --- | --- |\n| `innerHeight` | 包含窗口内容的高度，包括（如果显示）滚动条但不包括浏览器工具栏\
  \ |\n| `innerWidth` | 包含窗口内容的宽度，包括（如果显示）滚动条但不包括浏览器工具栏 |\n| `outerHeight` | 包含浏览器窗口的高度，包括所有浏览器工具栏\
  \ |\n| `outerWidth` | 包含浏览器窗口的宽度，包括所有浏览器工具栏 |\n| `pageXOffset` | `window.scrollX`\
  \ 的别名 |\n| `pageYOffset` | `window.scrollY` 的别名 |\n| `screenX` | 包含浏览器窗口在 x 轴上的位置——换句话说，浏览器窗口距离屏幕左边缘的距离\
  \ |\n| `screenY` | 包含浏览器窗口在 y 轴上的位置——换句话说，浏览器窗口距离屏幕顶部的距离 |\n| `scrollX` | 包含网页已水平滚动的像素数\
  \ |\n| `scrollY` | 包含网页已垂直滚动的像素数 |\n\n**表 8.1** 与 window 对象的大小和位置相关的属性\n\n```\n\
  console.log(window.innerHeight);    // 例如：600\nconsole.log(window.innerWidth); \
  \    // 例如：1134\nconsole.log(window.screenX);        // 例如：100\nconsole.log(window.screenY);\
  \        // 例如：22\n```\n\n**清单 8.1** 确定浏览器窗口的大小\n\n你还可以还可以使用 `scrollX` 和 `scrollY`\
  \ 属性（未在图 8.2 中显示）来确定网页内容在浏览器窗口内水平和垂直方向滚动了多远。你在第 6 章中看到过这个示例，在那里我们使用 `scrollY` 属性根据垂直滚动位置让元素淡入网页。\n\
  \n### 8.2.2 更改浏览器窗口的大小和位置\n\n\n\n\n\n当然，你不仅可以确定浏览器窗口的大小和位置，还可以调整浏览器窗口的大小并改变它在屏幕上的位置。为了这一目的，`window`\
  \ 对象提供了多种方法（另见列表 8.2）：`moveBy()` 方法可按指定的像素数水平和垂直移动浏览器窗口，而 `moveTo()` 方法可将窗口移动到特定位置。通过\
  \ `resizeBy()` 方法，你可以按特定比例缩放浏览器窗口，通过 `resizeTo()` 方法，你可以将其调整到特定大小。`scrollTo()` 方法将窗口内容滚动到指定位置，而\
  \ `scrollBy()` 方法则按指定的水平和垂直像素数滚动窗口内容。所有这些方法的概述可以在表格 8.2 中找到。\n\n```\n// Move browser\
  \ window by 200 pixels both horizontally and vertically\nwindow.moveBy(200, 200);\n\
  // Move browser window to position (200, 200)\nwindow.moveTo(200, 200);\n// Enlarge\
  \ browser window by 200 pixels in width and height\nwindow.resizeBy(200, 200);\n\
  // Shrink browser window by 200 pixels in width and height\nwindow.resizeBy(-200,\
  \ -200);\n// Move browser content by 200 pixels both horizontally and vertically\n\
  window.scrollBy(200, 200);\n// Move browser content to position (200, 200)\nwindow.scrollTo(200,\
  \ 200); \n```\n\n**Listing 8.2** 更改浏览器窗口的大小和位置\n\n| 方法 | 说明 |\n| --- | --- |\n|\
  \ `moveBy()` | 按指定的像素数水平和垂直移动当前浏览器窗口。第一个参数决定水平移动，第二个参数决定垂直移动（单位为像素）。 |\n| `moveTo()`\
  \ | 将当前浏览器窗口水平和垂直移动到特定位置。第一个参数决定水平位置，第二个参数决定垂直位置（单位为像素）。 |\n| `resizeBy()` | 按指定的像素数水平和垂直缩放当前浏览器窗口。第一个参数决定水平缩放值，第二个参数决定垂直缩放值。\
  \ |\n| `resizeTo()` | 按指定的尺寸水平和垂直缩放当前浏览器窗口。第一个参数决定宽度，第二个参数决定高度。 |\n| `scroll()`\
  \ | 将窗口内容滚动到指定位置。第一个参数指示水平位置，第二个参数指示垂直位置。 |\n| `scrollBy()` | 按指定的因子滚动窗口内容。第一个参数指定水平滚动因子，第二个参数指定垂直滚动因子。\
  \ |\n| `scrollTo()` | 将窗口内容滚动到指定位置。第一个参数指示水平位置，第二个参数指示垂直位置。 |\n\n**Table 8.2** `window`\
  \ 对象定义浏览器窗口及窗口内容大小和位置的方法\n\n### 8.2.3 访问浏览器工具栏的显示信息\n\n浏览器窗口通常由各种组件组成（见图 8.3）。除了显示网页的内容区域外，还有一个地址栏，你可以在其中输入\
  \ URL（在大多数现代浏览器中，也可以输入搜索词，随后启动预配置的搜索引擎）；一个状态栏，用于指示（以及其他）网页是否已加载或正在加载；一个菜单栏；一个工具栏；一个“个人”栏（包含书签等）；以及最后但同样重要的滚动条，它们显示相应网页的水平和垂直位置。\n\
  \n![Structure of a Browser Window (or Browser Tab)](img/img-f8.3.html)\n\n**Figure\
  \ 8.3** 浏览器窗口（或浏览器标签页）的结构\n\n你可以使用表格 8.3 中列出的属性确定这些浏览器工具栏是否显示。\n\n| 属性 | 说明 |\n\
  | --- | --- |\n| `locationbar` | 一个对象的引用，该对象提供关于地址栏是否显示的信息 |\n| `menubar` | 一个对象的引用，该对象提供关于菜单栏是否显示的信息\
  \ |\n| `personalbar` | 一个对象的引用，该对象提供关于个人栏（例如书签栏）是否显示的信息 |\n| `scrollbars` | 一个对象的引用，该对象提供关于滚动条是否显示的信息\
  \ |\n| `statusbar` | 一个对象的引用，该对象提供关于状态栏是否显示的信息 |\n| `toolbar` | 一个对象的引用，该对象提供关于工具栏是否显示的信息\
  \ |\n\n**Table 8.3** `window` 对象关于各种浏览器工具栏的属性\n\n### 8.2.4 确定通用属性\n\n在前面章节介绍的属性外，我们在这里简要提到另外几个属性（见表格\
  \ 8.4）。例如，`name` 属性包含浏览器窗口的名称。这并不是加载的网页的标题（可以通过 `document.title` 确定），而是标识浏览器窗口本身的名称（另见第\
  \ 8.2.5 节）。\n\n`opener` 属性包含打开当前浏览器窗口的浏览器窗口（对象）（再次参见第 8.2.5 节）。然而，`self` 属性包含 `window`\
  \ 对象自身的引用。如果你想在事件监听器中访问当前的 `window` 对象，这特别有用，可以避免与 `this` 关键字产生冲突。\n\n| 属性 | 说明\
  \ |\n| --- | --- |\n| `name` | 包含窗口名称。 |\n| `opener` | 如果你通过 JavaScript 从另一个浏览器窗口打开浏览器窗口（第\
  \ 8.2.5 节），此属性包含指向原始窗口的引用。 |\n| `self` | 包含表示当前浏览器窗口的对象的引用。 |\n\n**Table 8.4** `window`\
  \ 对象的通用属性\n\n### 8.2.5 打开新浏览器窗口\n\n\n\n\n\n`open()` 方法用于打开新的浏览器窗口。其示例在列表 8.3 中所示。你传递给方法的第一个参数是你想在新窗口中打开的网页的\
  \ URL。作为第二个参数，你可以可选地指定新窗口的名称（不要将其与网页的名称混淆）。此外，第三个参数让你有机会影响窗口的外观和行为。你可以传递一个由表 8.5\
  \ 中所示的属性组成的字符串。相应属性的值通过等号直接附加到属性上；多个属性-值对之间用逗号分隔。\n\n例如，在列表 8.3 中，创建了一个宽度为 500 像素（`width`属性）且高度为\
  \ 500 像素（`height`属性）的浏览器窗口，它是可调整大小的（`resizable`属性），并且带有滚动条和状态栏（`scrollbars`和`status`属性）。对于后两种属性，以及通常那些只能取两种状态之一的属性，允许的值为\
  \ `yes` 和 `no`（在 `resizable` 示例中）以及 `1` 和 `0`（在 `scrollbars` 示例中）。或者也可以省略该值，在这种情况下，属性名的存在被评估为\
  \ `yes` 或 `1`（在 `status` 示例中）。\n\n```javascript\nconst linkOpen = document.getElementById('link-open');\n\
  linkOpen.addEventListener('click', (e) => {\n  const url = document.getElementById('url').value;\n\
  \  window.open(\n    url,                  // URL to open\n    'Window title', \
  \      // Name of the window\n    'width=500,' +        // Width of the window\n\
  \    'height=500,' +       // Height of the window\n    'resizable=yes,' +    //\
  \ Resizing possible\n    'scrollbars=1,' +     // Scrollbar enabled\n    'status'\
  \              // Status bar enabled\n  );\n}); \n```\n\n**列表 8.3** 打开浏览器窗口\n\n\
  | 参数 | 含义 |\n| --- | --- |\n| `height` | 新浏览器窗口的高度（像素） |\n| `innerHeight` | 新浏览器窗口显示区域的高度（像素）\
  \ |\n| `innerWidth` | 新浏览器窗口显示区域的宽度（像素） |\n| `left` | 新浏览器窗口左上角到屏幕左边缘的距离（像素） |\n\
  | `location` | 表示新浏览器窗口是否应该有地址栏 |\n| `menubar` | 表示新浏览器窗口是否应该有菜单栏 |\n| `resizable`\
  \ | 表示新浏览器窗口是否可以调整大小 |\n| `screenX` | 新浏览器窗口左上角到屏幕左边缘的距离（像素） |\n| `screenY` | 新浏览器窗口左上角到屏幕顶部的距离（像素）\
  \ |\n| `scrollbars` | 表示新浏览器窗口是否应该有滚动条 |\n| `status` | 表示新浏览器窗口是否应该有状态栏 |\n| `toolbar`\
  \ | 表示新浏览器窗口是否应该有工具栏 |\n| `top` | 新浏览器窗口左上角到屏幕顶部的距离（像素） |\n| `width` | 新浏览器窗口的宽度（像素）\
  \ |\n\n**表 8.5** 打开浏览器窗口的选择参数\n\n### 8.2.6 关闭浏览器窗口\n\n类似于 `open()` 方法，你也可以使用 `close()`\
  \ 方法再次关闭浏览器窗口。列表 8.4 展示了一个扩展了之前示例的示例，增加了一个按钮`linkClose`）。在`linkOpen`按钮的事件监听中，保存了已打开的浏览器窗口（你可以看到\
  \ `open()` 方法返回一个代表打开的浏览器窗口的对象）。在`linkClose`按钮的事件监听内部，对该对象调用 `close()` 方法，再次关闭之前打开的浏览器窗口。\n\
  \n```javascript\nconst windowReference;\nconst linkOpen = document.getElementById('link-open');\n\
  const linkClose = document.getElementById('link-close');\nlinkOpen.addEventListener('click',\
  \ (e) => {\n  const url = document.getElementById('url').value;\n  windowReference\
  \ = window.open(\n    url,\n    'Window title',\n    'width=500,height=500,resizable,scrollbars=yes,status=1'\n\
  \  );\n});\nlinkClose.addEventListener('click', (e) => {\n  windowReference.close();\n\
  }); \n```\n\n**列表 8.4** 关闭浏览器窗口\n\n#### 通过 JavaScript 打开浏览器窗口\n\n尽管我们刚刚展示了它是如何工作的，但我们建议不要通过\
  \ JavaScript 打开浏览器窗口。此类窗口总是带有烦人广告窗口的负面含义。大多数浏览器默认会忽略它们，在用户给出同意之前不会打开它们。\n\n### 8.2.7\
  \ 打开对话框\n\n除了目前为止介绍的打开和关闭浏览器窗口的方法外，`window` 对象还提供了更多方法（部分选择请参见表 8.6）。你已经从之前的章节中了解了其中三个：你可以使用\
  \ `alert()` 方法打开警告对话框，使用 `confirm()` 方法打开确认对话框，并使用 `prompt()` 方法打开一个可以输入文本的对话框。\n\
  \n此外，`find()` 方法可以搜索网页内的文本，`print()` 方法可以打印当前网页的内容（参见图 8.4）。\n\n| 方法 | 描述 |\n| ---\
  \ | --- |\n| `alert()` | 打开一个带有消息的对话框 |\n| `close()` | 关闭浏览器窗口（节 8.2.6） |\n| `confirm()`\
  \ | 打开一个带有消息的对话框 |\n| `find()` | 在浏览器窗口中搜索字符串 |\n| `open()` | 创建新的浏览器窗口（节 8.2.5）\
  \ |\n| `print()` | 打开一个用于打印窗口内容的对话框 |\n| `prompt()` | 打开一个允许用户输入文本的对话框 |\n\n**表\
  \ 8.6** 用于打开对话框的 window 对象方法\n\n![print() 方法打开用于打印当前网页的对话框](img/img-f8.4.html)\n\
  \n**图 8.4** print() 方法打开用于打印当前网页的对话框\n\n\n\n\n\n### 8.2.8 以时间控制的方式执行函数\n\n如果你想在网页中延迟（执行一次）或按特定间隔（重复执行）某些函数，`window`\
  \ 对象提供了几个用于此目的辅助方法（另参见表 8.7）。\n\n| 方法 | 描述 |\n| --- | --- |\n| `setInterval()` |\
  \ 在指定的时间间隔内执行函数。返回一个 ID，该 ID 可以作为参数传递给 `clearInterval()` 方法以中止函数的执行。 |\n| `clearInterval()`\
  \ | 取消由 `setInterval()` 触发的函数的执行。 |\n| `setTimeout()` | 在指定的时间后执行函数。返回一个 ID，该 ID\
  \ 可以作为参数传递给 `clearTimeout()` 方法以防止函数执行。 |\n| `clearTimeout()` | 取消由 `setTimeout()`\
  \ 触发的函数的执行。 |\n\n**表 8.7** `window` 对象用于按时间控制执行函数的方法\n\n`setTimeout()` 方法可用于定义在多长时间后执行某个特定函数。作为第一个参数，你传递一个匿名函数或相应函数的名称；作为第二个参数，传递执行该函数所需的毫秒时间间隔。代码列表\
  \ 8.5 中显示了一些示例。第一次调用 `setTimeout()` 传递了一个匿名函数，第二次调用传递了一个（匿名）箭头函数，第三次调用传递了 `printMessage()`\
  \ 函数。这三次调用都确保在 5,000 毫秒（即 5 秒）后执行传递的函数，并在控制台中输出消息 `Hello World`。\n\n```\nwindow.setTimeout(function()\
  \ {\n  console.log('Hello World');\n}, 5000);\n\nwindow.setTimeout(() => {\n  console.log('Hello\
  \ World');\n}, 5000);\nfunction printMessage() {\n  console.log('Hello World');\n\
  }\nwindow.setTimeout(printMessage, 5000); \n```\n\n**代码列表 8.5** 五秒后执行函数\n\n与 `setTimeout()`\
  \ 方法类似，`window` 对象提供了 `setInterval()` 方法，用于在特定的时间间隔内执行函数。作为第一个参数，你传递匿名函数或要执行的函数名称；作为第二个参数，传递执行该函数所需的毫秒间隔。代码列表\
  \ 8.6 显示了一些示例。对 `setInterval()` 的三次调用都会导致传递的函数每 5,000 毫秒执行一次。\n\n```\nwindow.setInterval(function()\
  \ {\n  console.log('Hello World');\n}, 5000);\n\nwindow.setInterval(() => {\n  console.log('Hello\
  \ World');\n}, 5000);\nfunction printMessage() {\n  console.log('Hello World');\n\
  }\nwindow.setInterval(printMessage, 5000); \n```\n\n**代码列表 8.6** 每五秒执行一次函数\n\n###\
  \ 8.3 访问当前打开网页的导航信息\n\n使用存储在 `location` 属性中的对象（类型为 `Location`），你可以访问当前浏览器窗口或标签页中加载的网页\
  \ URL 的信息。\n\n#### 8.3.1 访问 URL 的各个组件\n\nURL 由不同的组件组成，如图 8.5](#08_003.html_f8.5)\
  \ 所示。除其他外，一个 URL 包含协议、主机名、端口规范、路径规范和查询参数。访问 URL 各个组件的属性列在表 8.8 中。\n\n![URL 的组件](img/img-f8.5.html)\n\
  \n**图 8.5** URL 的组件\n\n| 属性 | 描述 |\n| --- | --- |\n| `href` | 包含整个 URL。 |\n| `protocol`\
  \ | 包含 URL 的协议，包括冒号，例如 `https:`。 |\n| `host` | 包含 URL 的主机名——例如 `javascripthandbuch.de`。如果有端口规范，也会被列出——例如\
  \ `philipackermann.de:8080`。 |\n| `hostname` | 包含 URL 的域名——例如 `javascripthandbuch.de`。与\
  \ `host` 属性不同，`hostname` 不包含端口规范。 |\n| `port` | 包含 URL 的端口——例如 `8080`。 |\n| `pathname`\
  \ | 包含 URL 的路径，以 `/` 开头。 |\n| `search` | 包含 URL 的参数——即查询字符串（也称为搜索字符串），包括一个前导问号——例如\
  \ `?firstName=John`。多个参数值对之间用 `&` 符号分隔——例如 `?firstName=John&lastName=Doe`。 |\n|\
  \ `hash` | 包含片段标识符，包括一个前导 `#`。在 URL `http://www.javascripthandbuch.de#services`\
  \ 情况下，它是 `#services`。如果你调用一个带有片段标识符的 URL，且相应的网页上有一个对应 ID 的元素，则显示区域将滚动到该元素。 |\n|\
  \ `username` | 包含 URL 中指定的用户名。对于 URL `https://john:secret@javascripthandbuch.de`，其值为值为\
  \ `john`。并非所有浏览器都支持。 |\n| `password` | 包含 URL 中指定的密码。对于 URL `https://max:secret@javascripthandbuch.de`，其值为为\
  \ `secret`。并非所有浏览器都支持。 |\n| `origin` | 包含 URL 的规范形式，由协议组成，后跟 `://`、域名，以及如果 URL 包含端口规范，则包含冒号和端口规范。\
  \ |\n\n**表 8.8** Location 的属性\n\n#### 8.3.2 访问查询字符串参数\n\n遗憾的是，没有可用的方法可以访问 URL 查询字符串中的单个参数。相反，你必须解析查询字符串本身或使用辅助函数，如代码列表\
  \ 8.7 所示。该函数接收要确定其值的参数名称，使用该参数创建一个正则表达式，并从 URL 的查询字符串（`location.search`）中提取该参数的值（如果可用）。\n\
  \n\n\n\n\n```\nfunction getParameterByName(name) {\n  name = name.replace(/[\\[]/,\
  \ '\\\\[').replace(/[\\]]/, '\\\\]');\n  const regex = new RegExp('[\\\\?&]' + name\
  \ + '=([^&#]*)'),\n    results = regex.exec(location.search);\n  return results\
  \ === null ? '' : decodeURIComponent(results[1].replace(/\\+/g, ' '));\n}\nconsole.log(getParameterByName('tests'));\
  \ \n```\n\n**列表 8.7** 用于提取单个查询字符串参数的辅助函数\n\n### 8.3.3 加载新网页\n\n要在当前浏览器窗口中加载新网页，你有几种选择方法。\n\
  \n`assign()` 方法接收一个 URL 作为参数并打开相应的网页。这会在浏览历史中创建一个新条目。你可以在 列表 8.8 中看到相关的示例。\n\n```javascript\n\
  const linkLoad = document.getElementById('link-load');\nlinkLoad.addEventListener('click',\
  \ (e) => {\n  const url = document.getElementById('url').value;\n  window.location.assign(url);\n\
  }); \n```\n\n**列表 8.8** 通过 `assign()` 方法加载网页\n\n基本上，`replace()` 方法的工作方式与 `assign()`\
  \ 方法相同：将要加载的网页的 URL 作为参数传递（参见 列表 8.9）。然而，与 `assign()` 不同，调用 `replace()` 不会在浏览历史中创建新条目。因此，在这种情况下，你将无法返回到之前访问过的网站。\n\
  \n```javascript\nconst linkLoad = document.getElementById('link-load');\nlinkLoad.addEventListener('click',\
  \ (e) => {\n  const url = document.getElementById('url').value;\n  window.location.replace(url);\n\
  }); \n```\n\n**列表 8.9** 使用 `replace()` 方法加载网页\n\n此外，`location` 对象的 `href` 属性也可以用于加载新网页，如\
  \ 列表 8.10 所示。\n\n```javascript\nconst linkLoad = document.getElementById('link-load');\n\
  linkLoad.addEventListener('click', (e) => {\n  const url = document.getElementById('url').value;\n\
  \  window.location.href = url;\n}); \n```\n\n**列表 8.10** 使用 `href` 属性加载网页\n\n如果你想重新加载当前网页，可以使用\
  \ `reload()` 方法。可选地向该方法传递一个布尔值，以决定是否应该从服务器重新加载网页（在这种情况下，传递值 `true`），或者浏览器是否也可以从其内部缓存重新加载网页（在这种情况下，传递值\
  \ `false`）。相关示例见 列表 8.11。\n\n```javascript\nconst linkReload = document.getElementById('link-reload');\n\
  linkReload.addEventListener('click', (e) => {\n  window.location.reload(true);\n\
  }); \n```\n\n**列表 8.11** 通过 `reload()` 方法重新加载网页\n\n## 8.4 查看和修改浏览历史\n\n`window`\
  \ 对象的 `history` 属性会带你进入一个表示浏览历史的对象。该对象（类型为 `History`）可以用于查看历史，但它也可以允许你更改历史。\n\n\
  ### 8.4.1 在浏览历史中导航\n\n每当浏览器加载新网页时，甚至是跳转到网页内的某个跳转标签（锚点），浏览器默认都会浏览历史中创建一个新条目（这里的例外是\
  \ `replace()` 方法，如 第 8.3.3 节` 方法后退一个条目，使用 `forward()` 方法前进一个条目，以及使用 `go()` 方法跳转浏览历史中的特定条目（参见\
  \ 表格 8.9）。一些示例如下：\n\n```javascript\nhistory.length;     // 条目数量\nhistory.back();\
  \      // 后退一个条目\nhistory.forward();   // 前进一个条目\nhistory.go(-1);      // 后退两个\n\
  history.go(2);       // 前进两个\nhistory.go(0);       // 当前网页\n```\n\n**列表 8.12** 浏览历史\n\
  \n**表格 8.9** 仍然有效的 History 旧属性和方法\n\n| 属性/方法 |  |\n| --- | --- |\n| `length` | 包含历史中的条目数量，包括当前加载的网页。\
  \ |\n| `back()` | 跳转到上一个网页。等同于用户点击后退按钮。 |\n| `forward()` | 跳转到下一个网页。等同于用户点击前进按钮。\
  \ |\n| `go()` | 跳转到历史记录中的某个特定网页。例如，值 `-1` 会打开上一个网页，值 `1` 会打开下一个网页。如果传递的值没有对应的网页，该方法将无任何操作。相反，如果调用的值为\
  \ `0`，则重新加载当前网页。 |\n\n### 8.4.2 单页应用的浏览历史\n\n然而，随着单页应用的兴起（仅重新加载网页的一部分），需要一种新功能来描述浏览历史中的记录。原因是：如果只重新加载网页的一部分，URL\
  \ 默认不会改变，因此浏览历史中没有新条目。无法无法书签，因为不同的网页（更准确地说，网页的不同状态）没有自己的 URL。\n\n因此，URL 的片段标识符被使用了很久（参见\
  \ 列表 8.8 中的 `hash` 属性）。如果重新加载网页的一部分，你只需更改片段标识符，即可确保在浏览历史中创建一个新条目。\n\n这是一个简单的示例：假设你正在访问\
  \ URL 为 `www.javasthandbuch.de` 的网页，它有五个不同的导航条目：首页、服务、技能、关于我们和联系。那么各个 URL 将是 `www.javasthandbuch.de#home`、`www.javasthandbuch.de#services`、`www.javasthandbuch.de#skills`、`www.javasthandbuch.de#aboutus`\
  \ 和 `www.javasthandbuch.de#contact`。由于包含 `#` 字符，此类 URL 也称为 hashbang URL（参见 列表 8.13）。\n\
  \n```html\n...\n<body>\n  <nav>\n    <ul>\n      <li><a href=\"#home\">Home</a></li>\n\
  \      <li><a href=\"#services\">Services</a></li>\n      <li><a href=\"#skills\"\
  >Skills</a></li>\n      <li><a href=\"#aboutus\">About Us</a></li>\n      <li><a\
  \ href=\"#contact\">Contact</a></li>\n    </ul>\n  </nav>\n  <main id=\"content\"\
  ></main>\n</body>\n... \n```\n\n**列表 8.13** Hashbang URL\n\n但这种技术并不是理想的；它具有一些局限性。例如，片段标识符仅在客户端可用，不会发送到服务器。\n\
  \n\n\n\n\n### 8.4.3 向浏览历史记录添加条目\n\n一段时间以来，在 History API 框架内已经提供了一些调整，使得在上述提到的情况下，也能更方便地处理浏览历史记录。该\
  \ API 为此目的定义了一个新属性和两个新方法：`state` 属性包含浏览历史中的当前条目，`pushState()` 方法可向历史记录中添加新条目，而 `replaceState()`\
  \ 方法可用于替换当前条目（参见表 8.10）。\n\n| 属性/方法 | 描述 |\n| --- | --- |\n| `state` | 包含浏览历史中的当前条目。\
  \ |\n| `pushState()` | 向历史记录添加一个条目。传递任何 JavaScript 对象（所谓的状态对象）、标题以及可选的 URL。 |\n\
  | `replaceState()` | 用新条目替换历史记录中的当前条目。传递一个状态对象、标题以及可选的 URL。 |\n\n**表 8.10** History\
  \ 较新的属性和方法\n\n让我通过修改之前的示例来演示这些方法的使用。首先，不再使用哈希锚（hashbang）URL。而是使用普通 URL，如代码 8.14\
  \ 中的 HTML 代码所示。目标不是在点击其中一个链接时加载新网页，而是在浏览历史记录中创建新条目的同时，更新 `<main>` 元素的内容。\n\n```\n\
  ...\n<body><body>\n  <nav>\n    <ul>\n      <li><a href=\"/home\">Home</a></li>\n\
  \      <li><a href=\"/services\">Services</a></li>\n      <li><a href=\"/skills\"\
  >Skills</a></li>\n      <li><a href=\"/aboutus\">About Us</a></li>\n      <li><a\
  \ href=\"/contact\">Contact</a></li>\n    </ul>\n  </nav>\n  <main id=\"content\"\
  ></main>\n</body>\n... \n```\n\n**代码 8.14** 使用新的 History API 时不需要哈希锚 URL\n\n代码 8.15\
  \ 显示了相应的 JavaScript 代码。对于网页上的每个链接，都注册了一个事件监听器，该监听器调用 `pushState()` 方法向浏览历史记录中添加新条目。这里传递的第一个参数是待显示的内容，为了简单起见，它包含在\
  \ `contents` 对象中（在实践中，内容会从服务器动态加载；另见第 9 章）。\n\n第二个参数是点击相应链接时在浏览器标题栏中显示的标题。为此，使用了相应链接元素的文本内容（`event.target.textContent`）。最后，第三个参数是显示在地址栏中的\
  \ URL。这里使用了相应链接元素 `href` 属性的内容（`event.target.href`）。\n\n在事件对象上调用 `preventDefault()`\
  \ 防止点击链接时执行默认操作。如果你忽略了此调用，浏览器将仅仅重新加载链接的 URL。\n\n```javascript\nfunction init() {\n\
  \  // 内容容器元素\n  const contentElement = document.getElementById('content');\n  //\
  \ 示例内容，通常通过 Ajax 加载\n  const contents = {\n      home: {\n        content: 'Home'\n\
  \      },\n      services: {\n        content: 'Services'\n      },\n      skills:\
  \ {\n        content: 'Skills'\n      },\n      aboutus: {\n        content: 'About\
  \ Us'\n      },\n      contact: {\n        content: 'Contact'\n      }\n    };\n\
  \  // 链接的事件监听器\n  function handleClick(event) {\n    const pageName = event.target.getAttribute('href').split('/').pop();\n\
  \    const content = contents[pageName];\n    updateContent(content.content);\n\
  \    history.pushState(\n      content,  // 状态对象\n      event.target.textContent,\
  \   // 标题\n      event.target.href           // URL\n    );\n    return event.preventDefault();\n\
  \  }\n  // 注册事件监听器\n  const linkElements = document.getElementsByTagName('a');\n\
  \  for (let i = 0; i < linkElements.length; i++) {\n    linkElements[i].addEventListener('click',\
  \ handleClick, true);\n  }\n  function updateContent(content) {\n    contentElement.textContent\
  \ = content;\n  }\n}\n\ndocument.addEventListener('DOMContentLoaded', init); \n\
  ```\n\n**代码 8.15** 向浏览历史记录添加条目\n\n#### Web 服务器\n\n代码 8.15 中的代码只有在通过服务器运行时才有效，直接作为文件打开则无效。\n\
  \n### 8.4.4 响应浏览历史记录的变化\n\n每当历史记录中的当前条目发生变化时（例如当你按下返回键），`popstate` 事件就会被触发。此时（即仅对于代码\
  \ 8.15` 方法仅在点击链接时被调用。\n\n为了实现这一点并在使用按钮时更新 `<main>` 元素的内容，你只需要在 `popstate` 的事件监听器内部调用\
  \ `updateContent()` 方法（参见代码 8.16）。\n\n事件监听器接收一个 `PopState` 类型的事件对象，其 `state` 属性允许你访问从浏览历史中移除的条目。在示例中，读取了它的\
  \ `content` 属性并将其添加到容器中。\n\n```javascript\nwindow.addEventListener('popstate', (event)\
  \ => {\n  updateContent(event.state.content);\n});\n```\n\n**代码 8.16** 响应浏览历史记录的变化\n\
  \n### 8.4.5 替换浏览历史记录中的当前条目\n\n要将浏览历史记录中的当前条目替换为另一个条目，可以使用 `replaceState()` 方法。与\
  \ `pushState()` 方法类似，该方法传递状态对象、名称以及可选的 URL（参见代码 8.17）。\n\n```javascript\nhistory.replaceState(\n\
  \  {\n    content: contentElement.textContent\n  },\n  document.title,\n  document.location.href\n\
  );\n```\n\n**代码 8.17** 替换浏览历史记录中的条目\n\n你可以在图 8.6 中看到浏览历史与 `pushState()` 及 `replaceState()`\
  \ 方法之间的联系（为了清晰起见，相应的条目仅用 URL 表示，而不是显示包括状态对象在内的完整信息）。\n\n![pushState() 和 replaceState()\
  \ 方法之间的区别](img/img-f8.6.html)\n\n**图 8.6** pushState() 和 replaceState() 方法之间的区别\n\
  \n## 8.5 识别浏览器并确定浏览器特性\n\n到目前为止，你已经了解如何访问并部分更改与浏览器窗口、当前 URL 以及浏览历史记录相关的信息。但如果你想访问通用浏览器信息（浏览器名称、浏览器制造商等），请使用\
  \ `window` 对象的 `navigator` 属性。\n\n\n\n\n\n# Navigator 对象\n\n存储在此属性中的 `Navigator`\
  \ 类型对象提供了各种此类信息（请参见表 8.11），但其中某些信息应当谨慎处理，或者已被标记为过时，不应再使用。\n\n| 属性 | 描述 |\n| ---\
  \ | --- |\n| `appCodeName` | 包含当前浏览器的内部代号（不可靠，因为每个浏览器返回的值均为 `Mozilla`）。 |\n| `appName`\
  \ | 包含当前浏览器的名称（不可靠，因为每个浏览器输出的值均为 `Netscape`）。 |\n| `appVersion` | 包含当前浏览器的版本号（不可靠）。\
  \ |\n| `battery` | 包含一个 `BatteryManager` 类型对象的引用，该对象提供了电量状态 API 的入口（参见第 12 章）。 |\n\
  | `cookieEnabled` | 包含是否启用 cookie 的指示。 |\n| `geolocation` | 包含一个 `Geolocation` 类型对象的引用，该对象提供了地理定位\
  \ API 的入口（参见第 12 章）。 |\n| `language` | 包含指示用户首选语言的字符串。通常，这是相应浏览器界面内使用的语言。如果无法确定首选语言，该属性值为\
  \ `null`。 |\n| `languages` | 包含一个字符串列表，指示用户的首选语言，其中最首选的语言位于第一（对应于 `language` 属性包含的语言）。\
  \ |\n| `mimeTypes` | 包含关于浏览器支持的 MIME 类型信息的列表。 |\n| `onLine` | 布尔值，指示浏览器是否已连接到互联网。\
  \ |\n| `platform` | 包含所用操作系统的信息（不可靠）。 |\n| `plugins` | 包含关于浏览器支持的插件信息的列表。 |\n| `product`\
  \ | 包含当前浏览器的产品名称。然而，为了向后兼容，它在每个浏览器中返回值 `Gecko`。 |\n| `productSub` | 包含当前浏览器的子标签（`20030107`\
  \ 或 `20100101`）。 |\n| `serviceWorker` | 包含一个 `ServiceWorker` 类型对象的引用，该对象提供了 Service\
  \ Worker API 的入口。 |\n| `userAgent` | 包含标识浏览器、其版本和操作系统的字符串。应当谨慎处理。 |\n| `vendor`\
  \ | 包含关于浏览器制造商的信息。 |\n| `vendorSub` | 包含当前浏览器或厂商的子标签。 |\n\n## 表 8.11 navigator 的属性\n\
  \n早些时候，`navigator` 对象经常通过 `userAgent` 属性对某些功能得出结论。例如，`userAgent` 返回类似 `Mozilla/5.0\
  \ (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124\
  \ Safari/537.36` 的值。\n\n但今天，这不再可靠了，因为浏览器为了兼容性通常会返回不同的字符串。相反，你应该使用特性检测。\n\n要检查浏览器是否支持\
  \ History API，可以检查 `history` 对象是否有 `pushState` 方法：\n\n```javascript\nif (window.history.pushState)\
  \ {\n  // 支持 History API\n} else {\n  // 不支持 History API\n}\n```\n\n### 列表 8.18\
  \ 特性检测示例\n\n注意：要检查浏览器是否支持特定功能，你不应该使用 `userAgent` 属性；而应使用特性检测。\n\n## 8.6 访问屏幕信息\n\
  \n存储在 `screen` 属性（`Screen` 类型）中的对象包含与屏幕相关的信息。这些包括屏幕的 `height` 和 `width`、`colorDepth`，以及屏幕上减去固定组件（如任务栏）后水平和垂直可用空间的信息。\n\
  \n图 8.7 说明了这些属性，你可以在表 8.12 中找到概述。\n\n## 表 8.12 屏幕窗口的属性\n\n| 属性 | 描述 |\n| --- | ---\
  \ |\n| `availTop` | 包含一个像素值，指示任务栏等固定屏幕组件从顶部占用的空间大小。 |\n| `availLeft` | 包含一个像素值，指示任务栏等固定屏幕组件从左侧占用的空间大小。\
  \ |\n| `availHeight` | 包含最大可用屏幕高度（像素为单位），减去始终显示的组件（例如任务栏）的高度。 |\n| `availWidth`\
  \ | 包含最大可用屏幕宽度（像素为单位），减去始终显示的组件（例如任务栏）的宽度。 |\n| `colorDepth` | 包含屏幕的色彩深度。 |\n| `height`\
  \ | 包含像素为单位的屏幕高度。 |\n| `width` | 包含像素为单位的屏幕宽度。 |\n\n\n\n\n\n| `orientation` | 包含一个\
  \ `ScreenOrientation` 类型对象的引用，该对象提供了关于屏幕方向的信息，是屏幕方向 API ([`www.w3.org/TR/screen-orientation`](http://www.w3.org/TR/screen-orientation))\
  \ 的一部分 |\n| `pixelDepth` | 包含屏幕的像素深度 |\n| `width` | 包含以像素为单位的屏幕宽度 |\n\n**表 8.12**\
  \ `screen` 对象的属性\n\n## 8.7 总结\n\n在本章中，你学习了浏览器对象模型（BOM），这是一种通过该模型可以访问浏览器各种组件的对象模型：\n\
  \n* 全局 `window` 对象是进入 BOM 的入口点。\n* `location` 对象可以用于访问当前 URL 的组件并刷新网页。\n* 通过使用 `history`\
  \ 对象，你可以浏览历史记录并在浏览历史记录中创建新条目。\n* `navigator` 对象为你提供了关于浏览器的详细信息，但并非所有信息都是始终可靠的。\n\
  * 通过 `screen` 对象，你可以获取有关屏幕的信息，如高度和宽度，以及色彩深度、像素深度等。\n\n## 9 动态重新加载网页内容\n\n从用户交互和用户友好性的角度来看，Ajax\
  \ 概念已成为现代 Web 应用开发中不可或缺的一部分。这种技术允许你通过服务器的内容动态更新网页的各个部分，而不是重新加载整个页面。\n\n在本章中，我们将向你展示如何在不重新加载整个网页的情况下动态重新加载或替换网页的部分。这背后的技术被称为\
  \ Ajax（异步 JavaScript 和 XML）。\n\n## 9.1 Ajax 的原理\n\nAjax 这一名称由 Jesse James Garrett\
  \ 在 2005 年的论文《Web 应用程序的新方法》（A New Approach to Web Applications）中首次提出。其核心思想是使用 JavaScript\
  \ 在后台与服务器交换数据，而无需完全加载网页页面本身。\n\n### 9.1.1 同步通信\n\n让我们先看看通过超文本传输协议（HTTP）实现的传输协议（Hypertext\
  \ Transfer Protocol）经典的客户端与服务器通信是如何工作的。客户端（通常是浏览器）向服务器发送一个请求（HTTP 请求），服务器对其进行评估并向客户端返回一个相应的响应（HTTP\
  \ 响应）。\n\n在网页加载方面，这意味着用户每当点击链接或填写表单时（例如），都会向服务器发送一个相应的 HTTP 请求，然后由服务器生成新网页的内容并将其返回给客户端（参见\
  \ 图 9.1）。\n\n这一过程不理想的方面是，客户端或浏览器必须等待服务器评估请求并准备响应。作为用户，你会注意到这一点，因为在此期间你将无法再次与网站进行交互；也就是说，在等待期间无法发出进一步的请求。由于这种原因，这种通信（启动请求与等待响应之间的有序交替）也被称为同步通信。\n\
  \n![同步通信的原理](img/img-f9.1.html)\n\n**图 9.1** 同步通信的原理\n\n为了使用一个更具说明性的例子，让我们看看网页内经典搜索函数的实现。使用搜索表单来输入搜索标准，然后提交表单。服务器评估搜索请求，通常会执行一次或多次数据库查询，并创建一个包含搜索结果的网页（参见\
  \ 图 9.2）。在服务器执行这些操作时，用户除了等待结果外无事可做。只有当所有搜索结果都确定且响应从服务器加载完成后，用户才能继续交互——例如，在概览中浏览搜索结果或详细查看每个结果。\n\
  \n![同步实现搜索的序列](img/img-f9.2.html)\n\n**图 9.2** 同步实现搜索的序列\n\n### 9.1.2 异步通信\n\n当使用\
  \ Ajax 时，通信是异步运行行的，而不是同步的，这就是为什么它被称为异步通信。与同步通信类似，首先从服务器加载一个完整的网页，或者客户端向服务器发送请求，由服务器进行处理并交付适当的响应。然而，与同步通信不同，异步通信还允许你在等待已发送请求的响应的同时，向服务器发送新请求（参见\
  \ 图 9.3）。这使得通过来自服务器的数据独立更新网页的各个部分成为可能。\n\n![异步通信的原理](img/img-f9.3.html)\n\n**图 9.3**\
  \ 异步通信的原理\n\n如果我们将其应用到搜索示例中，那么在提交搜索表单后，表单将被隐藏，显示一个进度条，并在——搜索完成后——显示搜索结果（参见 图 9.4）。网页的其他（固定）组件，如页眉、导航和页脚区域不会重新加载。\n\
  \n![异步实现搜索的工作流](img/img-f9.4.html)\n\n**图 9.4** 异步实现搜索的工作流\n\n这种方式具有一些优点：首先，固定组件的数据不需要重新传输，这对传输时间有积极影响。其次，用户可以继续与网站的其他组件进行交互。例如，可以分批从服务器获取搜索结果，而不是一次性获取。在从服务器获取更多结果的同时，用户就可以查看部分结果。\n\
  \n#### 注意\n\n总而言，异步通信可以显著提高网页（或 Web 应用）的友好性和易用性。\n\n从技术角度讲，异步通信期间仍然发送 HTTP 请求。区别在于这些请求不是直接由浏览器触发的，而是通过\
  \ JavaScript 控制的（尽管使用 JavaScript 也可以进行同步调用，稍后讨论）。\n\n这种差异再次在 图 9.5 中说明。在没有 Ajax\
  \ 时（图中左），HTTP 请求由浏览器直接执行，但在使用 Ajax 时（图中右），这是由相应的 JavaScript 代码完成的。JavaScript 代码还处理来自服务器的响应——例如相应更新用户界面。\n\
  \n![经典与基于 Ajax 的应用程序的区别](img/img-f9.5.html)\n\n**图 9.5** 经典与基于 Ajax 的应用程序的区别\n\n\
  ### 9.1.3 Ajax 的典型用例\n\n除了上一节描述的后台运行搜索过程示例外，还有许多其他使用 Ajax 的示例，我们将在前面简要介绍。\n\n####\
  \ 输入字段的自动补全\n\n\n\n\n\n一个经典的例子是输入字段的自动完成。其思想是在用户向相应的输入字段输入文本时，以选择列表的形式向用户显示输入建议（参见图\
  \ 9.6），从而预选可能的选择值。在技术上，你为相应输入字段的 `change` 事件注册一个事件监听器，使用 Ajax 向服务器发送包含当前输入内容的请求，并在下拉列表中显示服务器返回的匹配值。\n\
  \n![输入字段的自动完成](img/img-f9.6.html)\n\n**图 9.6** 输入字段的自动完成\n\n### 大量记录的分页\n\n\n\n\
  另一个例子是记录的分页处理（即将其分成单独的页面）。事实上，如果有很多不同的记录（例如用户表），那么不在一个长表格中显示所有记录是有意义的，而是每次显示部分数据，并提供在各个部分之间来回切换的选项。通常，在相应的表格上方或下方会提供导航选项，如图\
  \ 9.7 所示。\n\n![Ajax 常用于分页](img/img-f9.7.html)\n\n**图 9.7** Ajax 常用于分页\n\n该示例可以通过以下方式实现：首先通过\
  \ Ajax 从服务器加载部分记录（所谓的“第一页”，类似于前面描述的搜索结果）。如果用户现在点击另一个页面的链接，则将相应从服务器加载所选页面的记录。\n\n\
  ### 新闻滚动条（News Tickers）\n\n你可能在新闻或体育页面上看到新闻滚动条，它们使用 Ajax 定期向服务器发送请求，并在有新消息时显示它们。为了实现这一点，你在客户端使用\
  \ `setInterval()` 方法（参见第 8 章）通过 Ajax 按特定间隔向服务器发送请求。如果请求返回了新消息，将将其整合到新闻滚动条中。\n\n\
  ### 可编辑 UI 组件\n\nAjax 的概念极大地推动了 Web 应用程序的普及——即在浏览器中运行但看起来和用起来像经典桌面应用程序的网页。允许你编辑单个记录的表格是此类应用程序中使用的许多\
  \ GUI 组件之一（参见图 9.8）。通常，你可以通过双击表格单元格启动编辑模式，然后调整单元格中的值。在后台，相应的记录将通过 Ajax 与服务器上的数据库进行同步。\n\
  \n![通过 Ajax 简单编辑表格记录](img/img-f9.8.html)\n\n**图 9.8** 通过 Ajax 简单编辑表格记录\n\n#### 注意\n\
  \n除了这些用例之外，还有许多其他 Ajax 派上用场的地方。通常情况下，当你想在不重新加载网页的情况下从服务器动态加载数据或向服务器发送数据时，Ajax 非常有用。\n\
  \n### 9.1.4 使用的数据格式\n\n现在问题出现了：客户端和服务器之间传输什么数据，以及采用什么格式？原则上，你可以使用任何格式，但以下三种格式最常用：\n\
  \n* **HTML**\n    如果你想直接从服务器加载现成的 GUI 组件（也称为 widgets；例如日历组件等）并将其集成到网页中，这种格式就很有用。我们将在第\
  \ 9.4.2 节中向你如何将 HTML 作为数据格式。\n\n* **可扩展标记语言 (XML)**\n    如果你从服务器加载结构化数据（例如表格的各个记录）并希望根据这些数据在网页上生成内容，那么这种格式非常合适。我们将在第\
  \ 9.4.3 节中向你如何将 XML 作为数据格式。但在之前，我们将在第 9.2 节中为你介绍这种格式。\n\n* **JavaScript 对象表示法 (JSON)**\n\
  \    与 XML 一样，这种格式适用于你想从服务器加载数据以根据该数据在网页上生成内容的情况，但它比 XML 轻得多，在 JavaScript 应用程序中相对容易处理。我们将在第\
  \ 9.4.4 节中向你如何将 JSON 作为数据格式。这种格式的结构将在第 9.3 节中进行解释。\n\n#### 各种交换格式\n\n显然，“Asynchronous\
  \ JavaScript and XML”（异步 JavaScript 和 XML）这个术语实际上具有误导性，因为不仅 XML 可以作为交换格式。\n\n##\
  \ 9.2 XML 格式\n\nXML 是一种标记语言，可用于分层结构数据。\n\n### 9.2.1 XML 的结构\n\n从语法上讲，XML 看起来与 HTML\
  \ 相似（尽管细节上有些差异，我们现在不会讨论这些差异）；也就是说，有 XML 元素和 XML 属性。\n\n原则上，你可以自由决定在 XML 文档中使用哪些元素，以及在元素中使用哪些属性。但通常，两者都定义在\
  \ XML schema（或者也可以定义在文档类型定义 [DTD]）中）。XML schema 和 DTD 都包含规则，包括哪些元素可以使用、元素可以哪些属性以及哪些子元素。\n\
  \n#### 注意\n\nXML 文件具有 .xml 扩展名。\n\n### 9.2.2 XML 和 DOM API\n\n由于其分层结构，将 XML 文档表示为树形结构是合理的。例如，图\
  \ 9.9 显示了列表 9.1 示例的 XML 树。\n\n![XML 数据的树形结构表示](img/img-f9.9.html)\n\n**图 9.9** XML\
  \ 数据的树形结构表示\n\n\n\n\n\n当然，你会立即注意到 XML 树与 DOM 树非常相似（参见第 5 章）。这绝非巧合：DOM API 也用于 XML\
  \ 文档，因此可以像我们在第 5 章中讨论 HTML 文档那样，访问 XML 文档的内容。我们将在本章节后的第 9.2 节和第 9.4.3 节向你展示示例。\n\
  \n### 注意事项\n更准确地说，JavaScript 程序中的 XML 数据以与网页相同的方式表示为 `Document` 类型（即存储在 `document`\
  \ 变量中的对象）。\n\n### 9.2.3 将字符串转换为 XML 对象\n当你通过 Ajax 向服务器发送 XML 数据，或者反过来，通过 Ajax 从服务器检索\
  \ XML 数据时，数据会在后台进行转换。当 XML 对象（`Document` 类型）转换为字符串时，这被称为数据序列化。相反，将字符串转换为 XML 对象的过程被称为解析。原则上，你不需要了解这两者的工作原理，但在这方面具备一些背景知识无疑无坏处。\n\
  \n要根据包含 XML 格式数据的字符串创建 XML 对象，你可以使用 `DOMParser` 对象。它的 `parseFormString()` 方法可以接收相应的字符串作为第一个参数，并将\
  \ MIME 类型（通常为 `text/xml`）作为第二个参数。只要传递的字符串包含有效的 XML，你就会得到一个包含解析后 XML 的 `Document`\
  \ 类型对象（另见图 9.10）。列表 9.2 显示了一个相应的示例。你会发现，你已经熟悉的 DOM 选择方法（如 `querySelector()`）可以在解析后的\
  \ XML 对象上调用，以选择 XML 树中的单个元素。\n\n![可以使用 DOMParser 对象将字符串转换为 XML 对象](img/](img-f9.10.html)\n\
  \n**图 9.10** 可以可以使用 DOMParser 对象将字符串转换为 XML 对象\n\n```\nconst xmlString = `<?xml\
  \ version=\"1.0\" encoding=\"ISO-8859-1\"?>\n                <artists>\n       \
  \           <artist name=\"Kyuss\">\n                    <albums>\n            \
  \          <album>\n                        <title>Wretch</title>\n            \
  \            <year>1991</year>\n                      </album>\n               \
  \     </albums>\n                  </artist>\n                </artists>`;\nconst\
  \ domParser = new DOMParser();\nconst xmlDOM = domParser.parseFromString(xmlString,\
  \ 'text/xml');\nconst firstArtist = xmlDOM.querySelector('artist');\nconsole.log(firstArtist.getAttribute('name'));\
  \                  // \"Kyuss\"\nconsole.log(firstArtist.querySelector('title').textContent);\
  \    // \"Wretch\"\nconsole.log(firstArtist.querySelector('year').textContent);\
  \     // 1991 \n```\n\n**列表 9.2** 将字符串解析为 XML 文档\n\n### 9.2.4 将 XML 对象转换为字符串\n除了将字符串转换为\
  \ `Document`  XML 对象外，还有将 XML 对象转换为字符串的选择。在这种情况下使用的辅助对象是 `XMLSerializer` 对象。该对象提供了\
  \ `serializeToString()` 方法，将 XML 对象作为参数传递给它，如列表 9.3 所示。返回字符串形式的序列化 XML 对象（另见图 9.11）。\n\
  \n```\nconst xmlString = `<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n    \
  \            <artists>\n                  <artist name=\"Kyuss\">\n            \
  \        <albums>\n                      <album>\n                        <title>Wretch</title>\n\
  \                        <year>1991</year>\n                      </album>\n   \
  \                 </albums>\n                  </artist>\n                </artists>`;\n\
  const domParser = new DOMParser();\nconst xmlDOM = domParser.parseFromString(xmlString,\
  \ 'text/xml');\nconst xmlSerializer = new XMLSerializer();\nconst xmlStringSerialized\
  \ = xmlSerializer.serializeToString(xmlDOM);\nconsole.log(xmlStringSerialized);\
  \ \n```\n\n**列表 9.3** 将 XML 文档序列化为字符串\n\n长期以来，在应用程序之间（或客户端与服务器之间）交换数据时，XML 一直被认为是卓越的交换格式。然而，现在另一种格式已经建立起来，它由于其简单的结构以及与\
  \ JavaScript 应用程序的轻松集成而特别具有吸引力（任何长时间处理 XML 的人都知道，这种格式涉及大量的开销，除了实际内容外，还有很多“修饰”——例如元素的闭合标签，这只是众多例子之一）。因此，让我们简要介绍一下这个竞争对手。\n\
  \n![可以使用 XMLSerializer 对象将 XML 对象转换为字符串](img/](img-f9.11.html)\n\n**图 9.11** 可以可以使用\
  \ XMLSerializer 对象将 XML 对象转换为字符串\n\n## 9.3 JSON 格式\nJSON（读音类似于名字 \"Jason\"）在许多方面已经超越了\
  \ XML 格式。\n\n### 9.3.1 JSON 的结构\n从表面上看，JSON 格式看起来像对象字面量符号（参见第 3 章）。然而，在细节上有一些重要的区别，我们将在本节中向你展示。\n\
  \nJSON 格式的本质特征是它的括号，用于定义单个对象。对象的属性被括在引号中，并用冒号与其值分隔。值可以是字符串、数值、布尔值、数组、`null` 值或其他对象。列表\
  \ 9.4 显示了一个 JSON 文档的示例，其包含的数据与第 9.2.1 节中的 XML 文档相同（比较请参见列表 9.1）。\n\n```\n{\n  \"\
  artists\": [\n    {\n      \"name\": \"Kyuss\",\n      \"albums\": [\n        {\n\
  \          \"title\": \"Wretch\",\n          \"year\": 1991\n        },\n      \
  \  {\n          \"title\": \"Blues for the Red Sun\",\n          \"year\": 1992\n\
  \        },\n        {\n          \"title\": \"Welcome to Sky Valley\",\n      \
  \    \"year\": 1994\n        },\n        {\n          \"title\": \"...And the Circus\
  \ Leaves Town\",\n          \"year\": 1995\n        }\n      ]\n    },\n    {\n\
  \      \"name\": \"Ben Harper\",\n      \"albums\": [\n        {\n          \"title\"\
  : \"The Will to Live\",\n          \"year\": 1997\n        },\n        {\n     \
  \     \"title\": \"Burn to Shine\",\n          \"year\": 1999\n        },\n    \
  \    {\n          \"title\": \"Live from Mars\",\n          \"year\": 2001\n   \
  \     },\n        {\n          \"title\": \"Diamonds on the Inside\",\n        \
  \  \"year\": 2003\n        }\n      ]\n    }\n  ]\n} \n```\n\n**列表 9.4** JSON 文件示例\n\
  \n### 注意事项\nJSON 文件通常具有 .json 扩展名。\n\nJSON 的优点是它在 JavaScript 应用程序中使用非常方便。更具体地说，在\
  \ JSON 中构建的对象可以直接在 JavaScript 代码中使用，如列表 9.5 所示。在此处，之前讨论的对象（为了空间考虑经过了缩短）直接在 JavaScript\
  \ 代码中定义并赋值给变量 `object`。你可以像你已经知道的那样，使用点符号访问以此方式创建的 JavaScript 对象的属性。\n\n### JSON\
  \ 是对象字面量符号的子集\n\n\n\n\n更准确地说，JSON 格式是对象字面量表示法的子集，因此它是 JavaScript 的子集。这正是 JSON 可以直接在\
  \ JavaScript 中使用的原因。\n\n```\nconst object = {\n  \"artists\": [\n    {\n      \"\
  name\": \"Kyuss\",\n      \"albums\": []\n    },\n    {\n      \"name\": \"Ben Harper\"\
  ,\n      \"albums\": []\n    }\n  ]\n}\nconsole.log(object.artists);          //\
  \ [Object, Object]\nconsole.log(object.artists.length);   // 2\nconsole.log(object.artists[0].name);\
  \  // \"Kyuss\"\nconsole.log(object.artists[1].name);  // \"Ben Harper\" \n```\n\
  \n列表 9.5 JavaScript 直接支持 JSON 格式\n\n### 9.3.2 JSON 与 JavaScript 对象的区别\n\n如前所述，JSON\
  \ 格式与对象字面量表示法之间存在一些根本区别。例如，在 JSON 中，属性名必须用双引号括起来，而在对象字面量表示法中并非如此。这里可以使用单引号或双引号，或者如果属性名允许（例如，名称中没有连字符），甚至可以完全省略。\n\
  \n此外，如前提到的，JSON 中只能使用字符串、数字、布尔值、其他 (JSON) 对象或数组以及 `null` 值。然而，在对象字面量表示法中这种限制并不适用。例如，它还接受函数、正则表达式以及任何其他对象实例作为值。\n\
  \n#### 验证 JSON\n\n如果你不确定创建的 JSON 是否有效，许多用于检查 JSON 有效性的在线工具之一是位于 [`jsonlint.com`](http://jsonlint.com)\
  \ 上的 JSONLint 验证工具——以防你的开发环境或编辑器未提供此类功能。\n\n在处理 JSON 数据时，浏览器和 Node.js 中都提供了全局对象\
  \ `JSON`。该对象本质上提供了两个方法：一个用于将 JavaScript 对象转换为 JSON 格式的字符串，另一个用于将 JSON 格式的字符串转换为\
  \ JavaScript 对象。接下来，让我们简要向你展示如何使用这两个方法。\n\n### 9.3.3 将对象转换为 JSON 格式\n\n使用 `JSON`\
  \ 对象的 `stringify()` 方法，你可以将 JavaScript 对象转换为 JSON 格式的字符串。该方法期望将 JavaScript 对象作为第一个参数，并返回包含该对象\
  \ JSON 格式的字符串作为结果。\n\n作为第二个参数，你可以选择性传递一个函数来控制转换的某些方面：该函数在转换过程中会在 JavaScript 对象的每个属性上被调用。它的返回值随后决定了目标值，即为相应属性传输到转换后的\
  \ JSON 中的值。如果你不想转换值而想按原样接受它们，只需简单传递值 `null` 而不是函数。\n\n第三个参数也可以用于影响括号的缩进。列表 9.6 显示了这方面的示例，图\
  \ 9.12 相应地说明了转换的原理。\n\n```\nconst string = JSON.stringify(\n  object,          \
  \           // JavaScript 对象\n  (key, value) => {           // 替换函数\n    return\
  \ value;             // 返回值决定目标值\n  },\n  2                           // 缩进\n);\n\
  console.log(string); \n```\n\n列表 9.6 将 JavaScript 对象转换为 JSON 格式\n\n![JSON.stringify()\
  \ 方法可将 JavaScript 对象转换为 JSON 格式](img/img-f9.12.html)\n\n图 9.12 JSON.stringify()\
  \ 方法可将 JavaScript 对象转换为 JSON 格式\n\n### 9.3.4 将 JSON 格式转换为对象\n\n虽然提供了 `stringify()`\
  \ 用于将 JavaScript 对象转换为 JSON 格式，但 `parse()` 方法设计用于反向操作——即将 JSON 格式的字符串转换为 JavaScript\
  \ 对象。该方法期望将相应的字符串作为第一个参数。可选性地作为第二个参数传递的函数（类似于刚才对 `stringify()` 的用法）可用于控制转换过程中应使用哪个值作为目标对象。该函数会在每个属性上被调用。使用\
  \ `parse()` 方法的示例见列表 9.7。图 9.13 再次以图的形式说明了原理。\n\n```\nconst objectParsed = JSON.parse(\n\
  \  string,                                // JSON\n  (key, value) => {         \
  \             // 替换函数\n    return value;                        // 返回值决定目标值\n  }\n\
  );\nconsole.log(objectParsed.artists);          // [Object, Object]\nconsole.log(objectParsed.artists.length);\
  \   // 2\nconsole.log(objectParsed.artists[0].name);  // \"Kyuss\"\nconsole.log(objectParsed.artists[1].name);\
  \  // \"Ben Harper\" \n```\n\n列表 9.7 将 JSON 格式的字符串转换为 JavaScript 对象\n\n![JSON.parse()\
  \ 方法可将 JSON 格式的字符串转换为 JavaScript 对象](img/img-f9.13.html)\n\n图 9.13 JSON.parse()\
  \ 方法可将 JSON 格式的字符串转换为 JavaScript 对象\n\n## 9.4 通过 Ajax 发送请求\n\n关于理论和格式的介绍已经足够了。现在让我们展示如何具体地使用\
  \ Ajax 创建查询。\n\n### 9.4.1 XMLHttpRequest 对象\n\n所有类型 Ajax 请求的基础都是 `XMLHttpRequest`\
  \ 对象，它最初由微软开发，并逐渐被其他浏览器制造商采用。甚至 W3C 正在对该对象进行标准化（参见 [www.w3.org/TR/XMLHttpRequest/](http://www.w3.org/TR/XMLHttpRequest/)）。\n\
  \n#### 注意\n\nFetch API (第 9.4.8 节) 另一种发送异步 HTTP 请求（即 Ajax 请求）的方法——它简单得多。然而，我们将先讨论原始方案——出于教学考虑。之后，我们将介绍\
  \ Fetch API。\n\n#### Ajax 请求的流程\n\n在使用 `XMLHttpRequest` 对象时，制定 Ajax 请求的过程总是类似的（参见列表\
  \ 9.8），包含以下步骤：\n\n1.  创建 `XMLHttpRequest` 实例。\n2.  配置 `onload` 事件处理器或相应的事件监听器，该器将在相应的\
  \ HTTP 请求完成后被调用（稍后将详细介绍）。\n3.  通过调用 `open()` 方法启动 HTTP 请求。该方法接收请求所需的 HTTP 方法（例如\
  \ `GET` 或 `POST`）、请求指向的 URL 以及其他可选参数（参见表 9.1）。\n4.  配置 HTTP 请求。你可以可选地在这一步进行各种配置——例如定义随请求发送的标头。但重要的是，你必须在上一步之后（即在调用\
  \ `open()` 方法之后）但在下一步之前（即在调用 `send()` 方法之前）执行此配置。\n\n\n\n\n5. 通过调用 `send()` 方法发送\
  \ HTTP 请求。可选的是，此方法可以传递要随请求发送到服务器的数据（例如：表单数据；第 9.4.5 节）。\n\n```\n'use strict'; \n\
  const request = new XMLHttpRequest();  // 1.) 创建 XMLHttpRequest 对象\nrequest.onload\
  \ = (event) => {          // 2.) 定义事件处理器\n  console.log('Response loaded');\n}\n\
  request.open(                          // 3.) 开始请求 ...\n  'GET',               \
  \                // ... 指定 HTTP 方法...\n  'content/data.xml'                   //\
  \ ... 以及指定的 URL\n);\nrequest.setRequestHeader('Accept', 'text/html'); // 4.) 配置请求\n\
  request.send();                                  // 5.) 发送请求 \n```\n\n**列表 9.8**\
  \ 创建 Ajax 请求的典型流程\n\n### 设置 Web 服务器\n\n为了向 Web 服务器发送 Ajax 请求，你首先需要这样一个 Web 服务器。最简单的方法是在开发应用程序时，在你的开发计算机上本地运行服务器。某些开发环境（如\
  \ WebStorm）当你会在浏览器预览中打开 HTML 文档时，会在后台启动一个本地 Web 服务器。在这种情况下，下载目录中的示例应该可以直接运行。如果你使用不具备此类功能的编辑器或其他开发环境，你可能需要自己启动本地\
  \ Web 服务器并在必要时提前安装它。\n\n三个为人知的 Web 服务器有 Apache ([`httpd.apache.org`](https://httpd.apache.org))、nginx\
  \ ([`nginx.org`](http://nginx.org)) 和 Lighttpd ([www.lighttpd.net](http://www.lighttpd.net))。安装和配置请参阅这些服务器的网站。然而，在我们的案例中，使用\
  \ http-server Node.js 包 ([`github.com/indexzero/http-server`](https://github.com/indexzero/http-server))\
  \ 更简单。你只需要安装 Node.js（你会在本书的过程中安装它；请参见第 17 节），然后使用它的包管理器 `npm` 安装此包（`npm install\
  \ -g http-server`）。之后，就可以使用 `http-server` 命令启动一个以当前目录为根目录的本地 Web 服务器。对于后续示例，我们建议在相应列表对应的目录中执行该命令，或者在本章的目录中执行。\n\
  \n### XMLHttpRequest 的方法\n\n此外，`XMLHttpRequest` 对象提供了其他几个方法。你可以在表 9.1 中查看概览。\n\n\
  | 方法 | 描述 |\n| --- | --- |\n| `abort()` | 取消请求。 |\n| `getAllResponseHeaders()` |\
  \ 以字符串形式返回 HTTP 响应的所有头部。 |\n| `getResponseHeader(header)` | 返回指定头部名称对应的值。 |\n| `open(method,\
  \ url, async, user, password)` | 开始请求。你需要传递要使用的 HTTP 方法（例如 `GET` 或 `POST`）、请求应发送到的\
  \ URL、一个指定请求是同步的（`false`）还是异步的（`true`）的布尔值，以及可能用于受访问保护的 URL 的用户名和密码。 |\n| `overrideMimeType(mime)`\
  \ | 覆盖服务器返回的 MIME 类型。 |\n| `send()` | 发送请求。 |\n| `send(data)` | 发送请求并发送传递的数据——例如，表单数据（第\
  \ 9.4.5 节）。 |\n| `setRequestHeader(header, value)` | 设置指定头部的值。 |\n\n**表 9.1** XMLHttpRequest\
  \ 的方法\n\n### XMLHttpRequest 属性\n\n除了上述方法外，`XMLHttpRequest` 对象提供了许多属性（请参见表 9.2）。其中一些属性用于配置对象或相应的请求（例如各种事件处理器），另一些属性用于读取请求的结果（例如，正如你之后看到的，`response`、`responseText`\
  \ 和 `responseXML` 属性）。\n\n| 属性 | 描述 |\n| --- | --- |\n| `onabort` | 当通过 `abort()`\
  \ 方法取消请求时调用的事件处理器。 |\n| `onerror` | 当发生错误时调用的事件处理器。 |\n| `onload` | 当请求成功执行且响应可用时调用的事件处理器。\
  \ |\n| `onloadend` | 在请求成功执行后调用的事件处理器。 |\n| `onloadstart` | 在请求开始后调用的事件处理器。 |\n\
  | `onprogress` | 当请求进行中时调用的事件处理器。 |\n| `onreadystatechange` | 当请求状态改变时调用的事件处理器。\
  \ |\n| `ontimeout` | 如果请求因超时而被取消时调用的事件处理器。 |\n| `readyState` | 包含以数值编码的请求当前状态。 |\n\
  | `response` | 包含响应的“主体”，其类型可以是 `ArrayBuffer`、`Blob` 或 `Document`，或者是一个 JSON 对象、字符串；如果请求尚未完成或未成功，则为\
  \ `null`。 |\n| `responseText` | 以字符串形式包含响应，如果请求尚未完成或未成功，则值为 `null`。 |\n| `responseType`\
  \ | 此属性可用于确定响应应具有的数据类型。可以是以下值之一（括号内为响应类型）：<* 空字符串 (`String`) <* `arraybuffer` (`ArrayBuffer`)\
  \ <* `blob` (`Blob`) <* `document` (`Document`) <* `json`（从响应中解析的 JavaScript 对象）\
  \ <* `text` (`String`) |\n\n\n\n\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `responseXML`\
  \ | 包含作为 `Document` 类型对象的响应。 |\n| `status` | 包含请求的 HTTP 状态码（例如 `200`）。 |\n| `statusText`\
  \ | 除了 HTTP 状态码外，它还包含状态消息（例如 `200 OK`）。 |\n| `timeout` | 该属性用于定义请求在被超时中止之前可以持续的毫秒数。\
  \ |\n| `upload` | 事件处理程序，可用于跟踪上传数据时的状态。 |\n| `withCredentials` | 该属性用于定义是否应使用 cookie\
  \ 或授权标头等凭据发送请求。 |\n\n**表 9.2** XMLHttpRequest 的属性\n\n### 为 XMLHttpRequest 注册事件监听器\n\
  \n除了 表 9.1 中列出的方法外，`XMLHttpRequest` 对象还提供了 `addEventListener()` 方法，你可以使用它为各种事件注册事件监听器，正如你已经从\
  \ DOM 树中的元素中所了解过的那样（参见 第 6 章）。类似于 表 9.2 中列出的事件处理程序，这些事件包括 `abort`、`error`、`load`、`loadend`、`loadstart`、`progress`、`readystatechange`\
  \ 和 `timeout`（参见示例 9.9](#09_004.html_l9.9)）。\n\n```\nrequest.addEventListener('loadstart',\
  \ (event) => {\n  console.log('Request started');\n});\nrequest.addEventListener('progress',\
  \ (event) => {\n  console.log('Progress');\n});\nrequest.addEventListener('abort',\
  \ (event) => {\n  console.log('Request aborted');\n});\nrequest.addEventListener('error',\
  \ (event) => {\n  console.log('Error during request');\n});\nrequest.addEventListener('load',\
  \ (event) => {\n  console.log('Response loaded');\n});\nrequest.addEventListener('timeout',\
  \ (event) => {\n  console.log('Request aborted due to timeout');\n});\nrequest.addEventListener('loadend',\
  \ (event) => {\n  console.log('Request finished');\n}); \n```\n\n**示例 9.9** 关于 Ajax\
  \ 请求的各种事件\n\n### load 和 readystatechange 事件之间的区别\n\n旧版本的浏览器使用 `onreadystatechange`\
  \ 事件处理程序而不是 `onload` 事件处理程序（参见示例 9.10](#09_004.html_l9.10)）。每当基于 Ajax 的请求状态发生变化时，就会触发相应的\
  \ `readystatechange` 事件（所有可用的状态可见表 9.3）。\n\n要获取请求的最终结果，你必须检查是否已到达 `Loaded` 状态——即请求对象的\
  \ `readyState` 属性是否包含值 `4`。你还应该确保请求是成功的——即请求对象的 `status` 属性是否包含 HTTP 状态码 `200`（参见表\
  \ 9.4）。\n\n```\n// 针对旧版浏览器的脚本，因此使用 var 关键字\nvar request = new XMLHttpRequest();\n\
  request.onreadystatechange = function() {...\n  if (request.readyState === 4 &&\
  \ request.status === 200) {\n    var data = request.responseXML;\n    var entries\
  \ = data.getElementsByTagName('entry');\n    for (var i = 0; i < entries.length;\
  \ i++) {\n      /* Insert XML*/\n    }\n  }\n};\nrequest.open('GET', 'content/data.xml',\
  \ true);\nrequest.send(null); \n```\n\n**示例 9.10** 使用 onreadystatechange 事件处理程序\n\
  \n| 值 | 名称 | 含义 |\n| :--- | :--- | :--- |\n| `0` | 未初始化 | 已创建 `XMLHttpRequest` 实例（或等效类型），但尚未调用\
  \ `open()` 方法。 |\n| `1` | 已打开 | 已调用 `open()` 方法。 |\n| `2` | 已发送 | 已调用 `send()` 方法。\
  \ |\n| `3` | 正在接收中 | 正在下载服务器的响应。 |\n| `4` | 已加载 | 响应的响应已下载完成。 |\n\n**表 9.3** readyState\
  \ 的不同值\n\n| 值 | 名称 | 含义 |\n| :--- | :--- | :--- |\n| `200` | OK | 请求成功。 |\n| `401`\
  \ | 未授权 | 请求因为没有身份验证而失败。 |\n| `403` | 禁止访问 | 请求因为不允许访问相应的 URL 而失败。 |\n| `404` |\
  \ 未找到 | 请求因为未找到 URL 而失败。 |\n| `500` | 内部服务器错误 | 请求因为服务器内部错误而失败。 |\n\n**表 9.4** 不同的状态码示例\n\
  \n### 9.4.2 通过 Ajax 加载 HTML 数据\n\n如前所述，客户端与服务器之间通信的数据格式，或从服务器传输到客户端的数据格式，分别有多种选项可供。首先，让我们向你展示如何使用\
  \ Ajax 从服务器加载 HTML。你已经知道如何使用 Ajax 创建一个简单的请求。在请求成功（以及响应成功）后，唯一需要做的就是在相应的事件处理程序或事件监听器中为\
  \ `load` 事件读取请求对象的 `responseText` 属性（参见示例 9.11](#09_004.html_l9.11)）。该属性包含服务器返回的响应的“主体”（字符串形式，即不包含标头数据的传输数据）。你还应该将\
  \ `Accept` 标头设置为 `text/html`，以便服务器只接受包含 HTML 的响应。\n\n```\n'use strict'; \nconst\
  \ request = new XMLHttpRequest();              // 创建 XMLHttpRequest \n         \
  \                                           对象\nrequest.onload = (e) => {      \
  \                    // 当结果加载时 ...\n  if(request.status === 200) {\n    const html\
  \ = request.responseText;             // 字符串形式的 HTML 响应。\n  }\n};\nrequest.open(\n\
  \  'GET',                                           // 加载 ...\n  'content/snippet.html',\
  \                          // ... HTML 文件\n);\nrequest.responseType = '';      \
  \                   // 字符串形式的响应 ...\nrequest.setRequestHeader('Accept', 'text/html');\
  \   // ... 仅 HTML 类型\nrequest.send();                                    // 发送请求\
  \ \n```\n\n**示例 9.11** 通过 Ajax 加载 HTML 数据\n\n\n\n\n或者，你可以使用 `responseType` 属性来指定响应应直接解析为\
  \ `Document` 类型的对象。在事件处理器/事件监听器中，通过请求对象的 `responseXML` 属性可以访问它，如列表 9.12 所示。然后你可以使用我们在第\
  \ 5 章中过的技巧来访问解析后文档的内容，例如 `body` 属性，如列表所示。\n\n```\nconst request = new XMLHttpRequest();\
  \                // 创建 \n                                                     //\
  \ XMLHttpRequest\n                                                     // 对象\nrequest.onload\
  \ = () => {                             // 当结果 \n                              \
  \                       // 加载时 ...\n  if(request.status === 200) {\n    const html\
  \ = request.responseXML.body.innerHTML; // 解析为对象的\n                            \
  \                         // HTML 响应\n  }\n};\nrequest.open(\n  'GET',         \
  \                                    // 加载 ...\n  'content/snippet.html'       \
  \                      // ... HTML 文件\n); \nrequest.responseType = 'document'; \
  \                  // 响应作为\n                                                   \
  \  // 解析后的对象 ...\nrequest.setRequestHeader('Accept', 'text/html');     // ... 仅\
  \ HTML 类型\nrequest.send();                                      // 发送请求\n```\n\n\
  **列表 9.12**     通过 Ajax 加载 HTML 数据\n\n#### 使用示例：从服务器动态加载 HTML 内容\n\n为了动态重新加载网页的各个部分内容，你可以通过\
  \ Ajax 将它们作为 HTML 片段加载。这些 HTML 片段可以在服务器上预先加载，也可以由服务器在运行时动态生成（参见图 9.14）。下面的列表显示了一个示例。在列表\
  \ 9.13 中，你首先看到基础的 HTML 框架，它包含一个有两个项目（“登录”和“注册”）的导航栏，以及一个作为动态加载内容容器的 `<main>` 元素。\n\
  \n![服务器端的 HTML 生成](img/img-f9.14.html)\n\n**图 9.14** 服务器端的 HTML 生成\n\n```\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n    ...\n</head>\n<body>\n  <div class=\"container\"\
  >\n    <nav>\n      <ul class=\"nav nav-pills\">\n        <li role=\"presentation\"\
  >\n          <a id=\"login\" href=\"#\">Login</a>\n        </li>\n        <li role=\"\
  presentation\">\n          <a id=\"register\" href=\"#\">Register</a>\n        </li>\n\
  \      </ul>\n    </nav>\n    <main id=\"main-content\" class=\"container col-xs-offset-2\
  \ col-xs-8\"></main>\n  </div>\n</body>\n</html> \n```\n\n**列表 9.13**     HTML 框架\n\
  \n列表 9.14 中的 JavaScript 代码并不特别复杂。在 `init()` 方法中，为“登录”和“注册”导航元素的 `click`（点击）事件注册了两个事件监听器。当事件被触发时，每个事件监听器都会调用\
  \ `loadContent()` 方法，并指定要从服务器加载的 HTML 文件名（但不包含 `.html` 后缀）作为参数。\n\n在 `loadContent()`\
  \ 方法内部，随后通过 Ajax 执行对服务器的请求，并通过 `innerHTML` 属性将返回的 HTML 读取并加载到网页的内容区域。点击登录导航项将显示登录表单（参见图\
  \ 9.15）。\n\n```javascript\n'use strict';\nfunction init() {\n  const login = document.getElementById('login');\n\
  \  const register = document.getElementById('register');\n\n  login.addEventListener('click',\
  \ () => {\n    loadContent('login');\n  });\n\n  register.addEventListener('click',\
  \ () => {\n    loadContent('register');\n  });\n}\n\nfunction loadContent(name)\
  \ {\n  const request = new XMLHttpRequest();\n  request.onload = (e) => {\n    if(request.status\
  \ === 200) {\n      const htmlSnippet = request.responseText;\n      document.getElementById('main-content').innerHTML\
  \ = htmlSnippet;\n    }\n  };\n  request.open(\n    'GET', \n    name + '.html'\n\
  \  );\n  request.responseType = '';\n  request.setRequestHeader('Accept', 'text/html');\n\
  \  request.send();\n}\n\nwindow.addEventListener('DOMContentLoaded', init);\n```\n\
  \n**列表 9.14**     通过 Ajax 加载数据\n\n![点击登录时加载登录表单](img/img-f9.15.html)\n\n**图 9.15**\
  \ 点击登录时加载了登录表单\n\n![点击注册时加载注册表单](img/img-f9.16.html)\n\n**图 9.16** 点击注册时加载了注册表单\n\
  \n### 9.4.3 通过 Ajax 加载数据\n\n通常情况下，不以 HTML 格式加载数据，而在客户端负责生成 HTML 代码会更有意义。例如，如果你想从数据库读取不同的记录并将它们显示在\
  \ HTML 表格中，那么先在服务器上生成 HTML 表格再发送回客户端意义不大。更好的做法是仅从服务器获取单个记录（例如以 XML 文档的形式），然后在客户端侧生成\
  \ HTML 表格（参见图 9.17）。这确保了数据与 HTML 代码之间的清晰分离。\n\n![客户端的 HTML 生成](img/img-f9.17.html)\n\
  \n**图 9.17** 客户端的 HTML 生成\n\n要通过 Ajax 加载 XML 数据，请按照列表 9.15 所示的操作。原则上，浏览器通过 HTTP\
  \ 响应中服务器返回的 MIME 类型识别返回的内容是 XML 格式的数据。然而，你可以通过将 `document` 值赋值给 `responseType` 属性来帮助这种自动检测。在事件处理器/事件监听器中，解析后的\
  \ XML 可以通过 `responseXML` 属性以 `Document` 类型对象的的形式可用。此外，你应该将 `Accept` 请求头设置为 `text/xml`\
  \ 或 `application/xml`，以便仅接受 XML 格式的数据。\n\n```javascript\n'use strict'; \nconst request\
  \ = new XMLHttpRequest();\nrequest.onload = (e) => {\n  if(request.status === 200)\
  \ {\n    const xml = request.responseXML;\n    //此处对 XML 数据进行进一步处理\n    console.log(xml);\n\
  \  }\n};\nrequest.open(\n  'GET', \n  'content/data.xml'\n);\nrequest.responseType\
  \ = 'document';\nrequest.setRequestHeader('Accept', 'text/xml');\nrequest.send(null);\n\
  ```\n\n\n\n\n让我稍微扩展一下这个例子。目标是通过 Ajax 从服务器加载第 9.2 节所示的 XML 文档数据，并根据其生成一个 HTML 表格。要实现这一点，你可以按照列表\
  \ 9.16 所示所示进行操作。在这里，`artists.xml` 文件通过 Ajax 加载并在 `onload` 事件处理程序中进行处理。由于响应是一个 `Document`\
  \ 类型的对象，因此你将在第 5 章中学习过的 DOM 方法可以在该对象上执行。\n\n在示例中，通过调用 `getElementsByTagName()` 方法以这种方式选取所有的\
  \ `<artist>` 元素。随后，对这些选定的元素列表进行迭代，并（再次通过调用 `getElementsByTagName()`）选取相应 `<artist>`\
  \ 元素内的所有 `<album>` 元素。在这些元素的循环中，为每个条目在表格中创建一个新行（该代码被外包在 `createRow()` 方法中）。结果显示在图\
  \ 9.18 中。\n\n```\n'use strict';\nfunction init() {\n  const request = new XMLHttpRequest();\n\
  \  request.onload = () => {\n    if(request.status === 200) {\n      const xmlDoc\
  \ = request.responseXML;\n      const table = initTable();\n      // 1.) Select\
  \ all <artist> elements\n      const artists = xmlDoc.getElementsByTagName('artist');\n\
  \      for (let i = 0; i < artists.length; i++) {\n        const artist = artists[i];\n\
  \        // 2.) Select the <album> elements\n        const albums = artist.getElementsByTagName('album');\n\
  \        for (let j = 0; j < albums.length; j++) {\n          const album = albums[j];\n\
  \          // 3.) Create a new table row\n          const row = createRow(\n   \
  \         artist.getAttribute('name'),\n            album.getElementsByTagName('title')[0].childNodes[0].nodeValue,\n\
  \            album.getElementsByTagName('year')[0].childNodes[0].nodeValue\n   \
  \       );\n          table.tBodies[0].appendChild(row);\n        }\n      }\n \
  \     document.getElementById('artists-container').appendChild(table);\n    }\n\
  \  };\n  request.open('GET', 'artists.xml', true);\n  request.responseType = 'document';\n\
  \  request.setRequestHeader('Accept', 'text/xml');\n  request.send();\n}\n\nfunction\
  \ initTable() {\n  const table = document.createElement('table');\n  const tableHeader\
  \ = document.createElement('thead');\n  const headerRow = document.createElement('tr');\n\
  \  const headerColumnArtistName = document.createElement('th');\n  const headerColumnAlbumTitle\
  \ = document.createElement('th');\n  const headerColumnAlbumYear = document.createElement('th');\n\
  \  const tableBody = document.createElement('tbody');\n  headerColumnArtistName.appendChild(document.createTextNode('Name'));\n\
  \  headerColumnAlbumTitle.appendChild(document.createTextNode('Title'));\n  headerColumnAlbumYear.appendChild(document.createTextNode('Year'));\n\
  \  headerRow.appendChild(headerColumnArtistName);\n  headerRow.appendChild(headerColumnAlbumTitle);\n\
  \  headerRow.appendChild(headerColumnAlbumYear);\n  tableHeader.appendChild(headerRow);\n\
  \  table.appendChild(tableHeader);\n  table.appendChild(tableBody);\n  table.className\
  \ = 'table table-striped';\n  return table;\n}\n\nfunction createRow(artistName,\
  \ albumTitle, albumYear) {\n  const row = document.createElement('tr');\n  const\
  \ columnName = document.createElement('td');\n  const columnTitle = document.createElement('td');\n\
  \  const columnYear = document.createElement('td');\n  columnName.appendChild(document.createTextNode(artistName));\n\
  \  columnTitle.appendChild(document.createTextNode(albumTitle));\n  columnYear.appendChild(document.createTextNode(albumYear));\n\
  \  row.appendChild(columnName);\n  row.appendChild(columnTitle);\n  row.appendChild(columnYear);\n\
  \  return row;\n}\n```\n\n\n\n\n外层循环遍历所有艺术家（`result.artists`），内层循环遍历他们的专辑（`artist.albums`），每次通过调用\
  \ `createRow()` 在表格中生成新的一行。生成的 HTML 与在 XML 示例中生成的 HTML 没有任何不同。\n\n```\n'use strict';\n\
  const request = new XMLHttpRequest();\nrequest.onload = () => {\n  if(request.status\
  \ === 200) {\n    let result;\n    if (request.responseType === 'json') {\n    \
  \  result = request.response;\n    } else {\n      result = JSON.parse(request.responseText);\n\
  \    }\n    const table = initTable();\n    const artists = result.artists;\n  \
  \  for (let i = 0; i < artists.length; i++) {\n      const artist = artists[i];\n\
  \      const albums = artist.albums;\n      for (let j = 0; j < albums.length; j++)\
  \ {\n        const album = albums[j];\n        const row = createRow(\n        \
  \  artist.name,\n          album.title,\n          album.year\n        );\n    \
  \    table.tBodies[0].appendChild(row);\n      }\n    }\n    document.getElementById('artists-container').appendChild(table);\n\
  \  }\n};\nrequest.open('GET', 'artists.json', true);\nrequest.responseType = 'json';\n\
  request.setRequestHeader('Accept', 'application/json');\nrequest.send(); \n```\n\
  \n**列表 9.18** 通过 Ajax 加载 JSON 数据\n\n#### jQuery 库\n\n在第 10 章 中，我们将向你展示其他内容如何使用 jQuery\
  \ 库来表达 Ajax 请求，这种方式稍微简单，而且最重要的是它是与浏览器无关的。\n\n### 9.4.5 通过 Ajax 向服务器发送数据\n\n自然，不仅可以从服务器检索数据，你还可以向服务器发送数据。在这种情况下，你不再使用\
  \ `GET`，而是简单使用 `POST` 作为 HTTP 方法，并将适当的数据传递给 `send()` 方法。在这里你也可以自由地选择格式，但通常使用 JSON\
  \ 格式，因为正如前面提到的，用 JavaScript 很容易地生成它。\n\n示例见列表 9.19。首先，以习惯的方式创建 `newArtist` JavaScript\
  \ 对象。在构建 Ajax 请求时，将值 `artist/create` 指定为 URL，假设服务器端在该 URL 后面隐藏着相应的脚本，该脚本接收并处理发送到服务器的数据。为了不让服务器猜测发送的数据格式，建议也相应地设置\
  \ `Content-Type` 头部。在当前的 JSON 数据的示例中，它被设置为值 `application/json`。\n\n```\n'use strict';\n\
  const newArtist = {\n  \"name\": \"Deltron 3030\",\n  \"albums\": [\n    {\n   \
  \   \"title\": \"Deltron 3030\",\n      \"year\": 2000\n    },\n    {\n      \"\
  title\": \"Event 2\",\n      \"year\": 2013\n    }\n  ]\n}\nconst request = new\
  \ XMLHttpRequest();\nrequest.onload = () => {\n  if(request.status === 200) {\n\
  \    console.log('Data successfully sent.');\n  }\n};\nrequest.open('POST', 'artists/create');\n\
  request.setRequestHeader('Content-Type', 'application/json');\nrequest.send(newArtist);\
  \ \n```\n\n**列表 9.19** 通过 Ajax 向服务器发送 JSON 数据\n\n### 9.4.6 通过 Ajax 提交表单\n\n通过 `FormData`\
  \ 对象，JavaScript 提供了一种通过 Ajax 向服务器发送表单数据的简单方法。创建 `FormData` 对象实例后，你可以通过 `append()`\
  \ 方法添加单个属性及其值，如列表 9.20 所示。然后你将对象实例作为参数传递给 `send()` 方法。作为 HTTP 方法的值，你在这里也传递了 `POST`\
  \ 值。\n\n```\n'use strict';\nfunction init() {\n  const formData = new FormData();\n\
  \  formData.append('username', 'john.doe');\n  formData.append('email', 'john.doe@javasripripbuch.de');\n\
  \  formData.append('url', 'javascripthandbuch.de');\n  formData.append('age', 44);\n\
  \  const request = new XMLHttpRequest();\n  request.open('POST', 'register', true);\n\
  \  request.send(formData);\n}\ndocument.addEventListener('DOMContentLoaded', init);\
  \ \n```\n\n**列表 9.20** 通过 Ajax 提交表单\n\n由于 `FormData` 对象可以直接绑定到表单，发送表单数据变得更加简单。要实现这一点，只需将表单传递给\
  \ `FormData` 的构造函数即可，如列表 9.21 所示。\n\n```\n'use strict';\nfunction init() {\n  const\
  \ form = document.getElementById('register');\n  form.addEventListener('submit',\
  \ (e) => {\n    e.preventDefault();\n    const formData = new FormData(form);\n\
  \    const request = new XMLHttpRequest();\n    request.open('POST', 'register',\
  \ true);\n    request.send(formData);\n  });\n}\n```\n\n**列表 9.21** 将 FormData 对象绑定到表单\n\
  \n注意：在 `FormData` 对象出现之前，你必须手动从表单读取值，使用它们创建你自己的对象，并将该对象传递给 Ajax 调用。\n\n### 9.4.7\
  \ 从其他域加载数据\n\n出于安全考虑，无法通过 Ajax 从 JavaScript 代码加载域以外的其他域加载数据；也就是说，不允许跨源请求（参见图 9.20）。此原因主要是为了防止恶意代码从其他域加载。然而，仍有不同的技术允许你从其他域加载数据，我们将在本节中简要讨论它们。\n\
  \n![Cross-Origin Requests Are Not Allowed by Default](img/klein09_020.png)\n**图\
  \ 9.20** 默认不允许跨源请求\n\n#### 通过代理从其他服务器加载数据\n\n注意：我们不会列出任何具体的实现，因为在某些情况下，可能需要在服务器端也创建相应的程序，这将超出了本节的范围。这里的重点主要是为了解释各种技术的理论背景。\n\
  \n从另一个域加载 JavaScript 代码的一种方法是使用代理（参见图 9.21）。这是位于加载 JavaScript 代码的（自己的）域内的服务器上的一个组件，它连接到要加载其他数据的（外地的）域。\n\
  \n![A Server-Side Proxy Is Used to Bypass Cross-Origin Requests](img/klein09_021.png)\n\
  **图 9.21** 使用服务器端代理绕过跨源请求\n\n现在，你不再通过 Ajax 直接从另一个域加载数据，而是将请求发送到代理。根据请求，代理向另一个域发出自己的请求（在服务器端，通常对访问其他域没有限制）。然后代理处理该请求的响应，并将其作为对客户端原始请求的响应转发给客户端。\n\
  \n#### 通过 CORS 从其他服务器加载数据\n\n从异地服务器加载 JavaScript 的第二种选择是使用跨源资源共享（CORS）原则（参见图 9.22）。\n\
  \n\n\n\n\n首先，客户端向跨域域名发送预检请求（preflight request）。浏览器隐式地发送一个额外的（不可更改）`Origin`头部，指定指定加载\
  \ JavaScript 代码的域名。此外，`Access-Control-Request-Method` 头部被设置为值 `OPTION`。\n\n随后，跨域服务器会在预检响应中指示是否可以从那里加载数据。具体而言，服务器会发送\
  \ `Access-Control-Allow-Origin` 头部。只有当通过 JavaScript 发起请求的域名出现在该头部的值中，随后才会发送实际请求并返回实际响应。\n\
  \n![Cross-Origin Resource Sharing Allows Data to be Downloaded from Previously Defined\
  \ Servers](img/img-f9.22.html)\n\n**图 9.22** 跨源资源共享允许从定义的服务器下载数据\n\n### 浏览器支持与 CORS\
  \ 规范\n\nCORS 仅由较新的浏览器支持。旧版浏览器不支持此技术。可以在 [fetch.spec.whatwg.org/#http-cors-protocol](http://fetch.spec.whatwg.org/#http-cors-protocol)\
  \ 找到规范。\n\n### 通过 JSONP 从其他服务器加载数据\n\n从其他服务器加载数据的第三种方法称为带的 JSON（JSONP）。这利用了 JavaScript\
  \ 代码可以通过 `<script>` 元素从任何其他域名加载的事实。本质上，你通过 `<script>` 元素加载了两个 JavaScript 文件，如图 9.23](img-f9.23.html)\n\
  \n**图 9.23** 使用 JSONP 时，跨域的 JavaScript 代码调用本地域的 JavaScript 代码\n\n### 9.4.8 XMLHttpRequest\
  \ 的新替代方案：Fetch API\n\n这里应该提到，现在有了一个使用 `XMLHttpRequest` 对象创建异步请求的替代方案：Fetch API ([`fetch.spec.whatwg.org`](https://fetch.spec.whatwg.org))。\n\
  \n起点是全局函数 `fetch()`（或在 `window` 对象上定义的函数），它抽象了各种异步请求（`GET`、`POST` 等）并返回一个 `Promise`\
  \ 对象。可以在此对象上调用 `then()` 和 `catch()` 方法来定义结果处理和错误处理的回调（参见 列表 9.22），用于处理成功从服务器加载响应（`then()`）或发生错误（`catch()`）的情况。\n\
  \n在 `then()` 方法的回调函数中调用 `response.json()` 会在示例中创建一个流，通过该流可以将 HTTP 响应正文读取为 JSON。除了\
  \ JSON 流外，还有其他用于数组缓冲区（通过 `arrayBuffer()` 方法）、二进制大对象（BLOBs；通过 `blob()` 方法）、表单数据（通过\
  \ `formData()` 方法）和纯文本（通过 `text()` 方法）的流。\n\n```\n'use strict';\nfunction init()\
  \ {\n  // 1.) 查询 artists.json 文件\n  fetch('artists.json')\n    .then((response)\
  \ => {\n      // 响应对象包含以下属性：\n      console.log(response.status);     // 200\n \
  \     console.log(response.statusText); // \"OK\"\n      console.log(response.type);\
  \       // \"basic\"\n      console.log(response.bodyUsed);   // false\n      console.log(response.headers);\
  \    // []\n      console.log(response.ok);         // true\n      console.log(response.redirected);\
  \ // false\n      console.log(response.url);        // http://localhost:8080/artists.json\n\
  \                       // (取决于网络服务器的根目录)\n\n      // 2.) 将响应转换为 JavaScript 对象\n\
  \      return response.json();\n    })\n    .then((result) => {\n      // 3.) 评估转换后的\
  \ JavaScript 对象\n      const table = initTable();\n      const artists = result.artists;\n\
  \      for (let i = 0; i < artists.length; i++) {\n        const artist = artists[i];\n\
  \        const albums = artist.albums;\n        for (let j = 0; j < albums.length;\
  \ j++) {\n          const album = albums[j];\n          const row = createRow(\n\
  \            artist.name,\n            album.title,\n            album.year\n  \
  \        );\n          table.tBodies[0].appendChild(row);\n        }\n      }\n\
  \      document.getElementById('artists-container').appendChild(table);\n    })\n\
  \    .catch((error) => {\n      console.error(error);\n    });\n} \n```\n\n**列表\
  \ 9.22** 使用 Fetch API 进行 GET 请求\n\n由于 Fetch API 是基于 Promise 的，或者说调用 `fetch()` 返回一个\
  \ `Promise` 对象，你也可以结合 `await` 使用该 API。这使得源代码更具可读性，如 列表 9.23 {\n  try {\n    // 1.)\
  \ 查询 artists.json 文件\n    const response = await fetch('artists.json');\n    //\
  \ 响应对象包含以下属性：\n    console.log(response.status);     // 200\n    console.log(response.statusText);\
  \ // \"OK\"\n    console.log(response.type);       // \"basic\"\n    console.log(response.bodyUsed);\
  \   // false\n    console.log(response.headers);    // []\n    console.log(response.ok);\
  \         // true\n    console.log(response.redirected); // false\n    console.log(response.url);\
  \        // \"http://localhost:8080/artists.json\"\n                       // (取决于网络服务器的根目录)\n\
  \    // 2.) 将响应转换为 JavaScript 对象\n    const result = await response.json(); \n \
  \   // 3.) 评估转换后的 JavaScript 对象\n    const table = initTable();\n    const artists\
  \ = result.artists;\n    for (let i = 0; i < artists.length; i++) {\n      const\
  \ artist = artists[i];\n      const albums = artist.albums;\n      for (let j =\
  \ 0; j < albums.length; j++) {\n        const album = albums[j];\n        const\
  \ row = createRow(\n          artist.name,\n          album.title,\n          album.year\n\
  \        );\n        table.tBodies[0].appendChild(row);\n      }\n    }\n    document.getElementById('artists-container').appendChild(table);\n\
  \  } catch(error) {\n    console.error(error);\n  }\n}\n\nfunction initTable() {\n\
  \  const table = document.createElement('table');\n  // ... 同上\n  return table;\n\
  } \n```\n\n**列表 9.23** 结合 await 使用 Fetch API\n\n\n\n\n\n对于简单的 `GET` 请求，仅将 URL 作为参数传递给\
  \ `fetch()` 方法即可。对于基于其他 HTTP 方法或需要额外配置的 HTTP 请求，你可以通过第二个参数的形式来传递这些配置。例如，示例 9.24\
  \ 向你展示了如何以这种方式执行 `POST` 请求。你也可以在这里看到，配置对象不仅可以配置 HTTP 方法，还可以配置 HTTP 头部和正体（body）——即随请求传输的数据。\n\
  \n```\n'use strict';\nasync function init() {\n  try {\n    const body = {\n   \
  \   firstName: 'John',\n      lastName: 'Doe',\n    }\n    const response = await\
  \ fetch('register',\n      {\n        method: 'post',\n        headers: {\n    \
  \      'Accept': 'application/json',\n          'Content-Type': 'application/json'\n\
  \        },\n        body: JSON.stringify(body)\n      }\n    );\n    console.log(response);\n\
  \  } catch (error) {\n    console.error(error);\n  };\n}\n\ndocument.addEventListener('DOMContentLoaded',\
  \ init); \n```\n\n**示例 9.24** 使用 Fetch API 进行 POST 请求\n\n## 9.5 总结\n\n在本章中，你学习了一个增强\
  \ Web 应用程序用户体验的重要工具：使用 Ajax 进行异步通信。总结一下，像往常每个章节结束一样，这里是需要记住的关键点：\n\n*   通过 Ajax，可以使用\
  \ JavaScript 向服务器发送异步 HTTP 请求。例如，这允许在不需要重新加载整个网页的情况下更新页面的部分。\n*   XML 主要作为应用程序之间或客户端与服务器之间的交换格式。\n\
  *   JSON 是一种较新的格式——与 XML 相比——它也用于应用程序之间或客户端与服务器之间的数据交换。它在这方面非常流行，主要是因为与 XML 相比非常轻量、开销更小，并且被\
  \ JavaScript 原生支持。\n*   Ajax 请求的核心对象是 `XMLHttpRequest` 对象。\n*   通过 `FormData` 对象的帮助，也可以相对容易通过\
  \ Ajax 发送表单数据。\n*   原则上，无法通过 Ajax 从服务器加载数据，除非加载相应 JavaScript 代码的服务器。但是，有三种技术允许你从其他服务器加载数据：\n\
  \    * 在你自己的服务器上使用代理\n    * 使用 CORS\n    * 使用 JSONP\n* 与使用 `XMLHttpRequest` 对象相比，Fetch\
  \ API 简化了异步请求的发送。\n\n# 10 使用 jQuery 简化任务\n\n许多现在用 JavaScript 相对容易地完成的任务，在很长一段时间内由于浏览差异，只有通过大量的源代码才能实现。因此，出现了各种库来简化不同的任务，例如处理\
  \ DOM。在这些库中，著名的之一是 jQuery，即使在今天，它仍然每个 Web 开发者工具箱的一部分。\n\n可能最著名的 JavaScript 库之一是\
  \ jQuery 库 (`https://jquery.com`)，它在某种程度上大大简化了 JavaScript 的工作。虽然现在使用 DOM API 的标准方法也可以实现许多功能，但\
  \ jQuery 仍然是一个值得关注的库。本章将提供使用 jQuery 的概述，包括如何简化访问和操作 DOM、处理事件以及构建 Ajax 请求。\n\n###\
  \ 注意\n\njQuery 库的内容非常详尽，以至于我们无法在一个章节中涵盖它的所有方面。相反，我们将提供一组具有代表性的主题，并对该库进行良好的介绍。此外，我们不会详细地讨论这些选定的主题，而是会相对简洁地描述代码示例（我们假设你已经通过前面的章节掌握了必要的基础知识，如\
  \ DOM 处理、事件、Ajax 等）。\n\n## 10.1 介绍\n\n正如你在前面的章节中所看到的，不同浏览器在 DOM 操作、事件处理和 Ajax 方面存在差异。jQuery\
  \ 库抽象了这些特定器的细节并提供了一个统一的接口，且不仅适用于上述主题。因此，本质上 jQuery 具有以下优势：\n\n* 简化 DOM 操作\n  jQuery\
  \ 通过提供各种辅助方法简化了对 DOM 树元素的访问。在第 10.2 节中，我们将详细讨论这个主题。顺便说：当前 DOM API 的标准方法如 `querySelector()`\
  \ 和 `querySelectorAll()`（在旧浏览器中不可用）就是基于 jQuery 的理念。\n* 简化事件处理\n  jQuery 简化了事件处理并为此提供了辅助方法，我们将在第\
  \ 10.3 节中介绍它们。\n* 简化 Ajax 请求的构建\n  jQuery 简化了 Ajax 请求的构建——同样是通过隐藏特定器的细节。我们将在第 10.4\
  \ 节中介绍相应的辅助方法。\n\n### jQuery 并非总是必要的\n\n尽管 jQuery 是一个非常强大的库，但你不应该犯错误，将 jQuery 等同于\
  \ JavaScript 并先学习 jQuery 再学习 JavaScript 语言。jQuery 在很多情况下确实可以提供支持，但通常并不需要该库，因为你可以使用纯\
  \ JavaScript 甚至更轻量的库来解决相应的任务。像 You Might Need jQuery (`http://youmightneedjquery.com`)\
  \ 等网站通过各种示例证明了这一点。\n\n### 提示\n\n原则上，对于 JavaScript 开发者来说，既能够使用库又能牢固掌握基本概念是不错。\n\n\
  ### 10.1.1 嵌入 jQuery\n\n可以通过多种方式嵌入 jQuery 库。在 `https://jquery.com/download/`，你可以下载当前版本的库。除了“正常”版本外，还有一个压缩版本（即压缩版本），它在文件大小上尽可能小。下载文件后，你可以像通常一样通过\
  \ `<script>` 元素包含它（参见示例 10.1）。\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \  <title>jQuery example</title>\n  <link rel=\"stylesheet\" href=\"styles/main.css\"\
  \ type=\"text/css\">\n</head>\n<body>\n  <script src=\"scripts/jquery-3.6.0.min.js\"\
  ></script>\n  <script src=\"scripts/main.js\"></script>\n</body>\n</html>\n```\n\
  \n**示例 10.1** 嵌入下载的 jQuery 版本\n\n### 压缩版本与非压缩版本\n\n大多数库都提供普通版本（非压缩版本）和压缩版本（minified\
  \ version）供下载。在后者中，代码中的空格和通常的注释会被移除，例如，并进行了更多优化以减小文件大小，从而缩短下载时间。因此，库的压缩版本适用于系统。非压缩版本实际上只适用于你希望在开发期间查看相应的库——例如在调试期间。\n\
  \n### 10.1.2 通过内容分发网络嵌入 jQuery\n\n\n\n\n\n如果你按照描述下载了 jQuery 并将其作为本地依赖嵌入到你的网页中，然后将网站加载到服务器上，你必须也将\
  \ jQuery 加载到相应的服务器上。或者，你可以通过内容分发网络（CDN；参见注意框）集成 jQuery。对于 `jQuery`，相应的 URL（对应库的当前版本）是\
  \ [`code.jquery.com/jquery-3.6.0.min.js`](https://code.jquery.com/jquery-3.6.0.min.js)（参见列表\
  \ 10.2）。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n  <title>jQuery example</title>\n\
  \  <link rel=\"stylesheet\" href=\"styles/main.css\" type=\"text/css\">\n</head>\n\
  <body>\n  <script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n\
  \  <script src=\"scripts/main.js\"></script>\n</body>\n</html> \n```\n\n**列表 10.2**\
  \ 通过内容分发网络嵌入 jQuery\n\n### 内容分发网络\n\n内容分发网络（也称为内容传输网络）是一个通过互联网连接的服务器网络，用于分发请求以便尽可能快地响应。通常，请求的地理位置起着主要作用：例如，如果一个来自德国的用户访问你的网页，而你通过\
  \ CDN URL ([`code.jquery.com`](https://code.jquery.com)) 在那里嵌入了 jQuery，那么相应的代码将从德国的服务器发送给用户。相反，从美国访问你网页的用户将由位于那里的服务器服务。\n\
  \n### 10.1.3 使用 jQuery\n\njQuery 的核心是 `jQuery()` 函数或等效的快捷函数 `$()`（后文称为 jQuery 方法）。该函数可以使用各种参数进行调用（详情请参见\
  \ [`api.jquery.com/jQuery`](http://api.jquery.com/jQuery)），其中三种形式用得特别频繁：\n\n*  \
  \ 使用 CSS 选择器调用\n    在这种情况下，你向 `jQuery` 方法传递一个选择器（类似于 CSS 选择器，稍后会进行详细介绍），并接收一个对象作为返回值，该对象包含了匹配选择器的网页元素。此类示例在列表\
  \ 10.3 和列表 10.4 中显示。该方法返回的对象代表对应元素的所谓“包装对象”（后文称为 jQuery 对象），并为这些元素提供了各种方法（后文将详细介绍）。\n\
  \n```javascript\nconst selectedElements = jQuery('body > div > span'); \n```\n\n\
  **列表 10.3** jQuery() 函数\n\n```javascript\nconst selectedElements = $('body > div\
  \ > span'); \n```\n\n**列表 10.4** 更常用的快捷函数， $()\n\n*   使用来自 DOM 树的节点调用\n    作为使用选择器调用\
  \ `jQuery` 方法的替代方案，它也可以通过 DOM 树的节点或通过代表相应节点的相应 JavaScript 对象来调用。在这里，jQuery 对象同样代表对所传节点的包装对象，并提供了额外的额外方法。例如，要定义一个在\
  \ `document` 对象完全加载时调用的事件监听器，请按照列表 10.5 所示的操作进行。`document` 对象不存在 `ready()` 方法，但它是由\
  \ jQuery 对象间接提供的（另见节 10.3.2）。\n\n```javascript\n$(document).ready(() => {\n  console.log('Web\
  \ page loaded');\n}); \n```\n\n**列表 10.5** 使用来自 DOM 树的节点调用 jQuery 方法\n\n*   使用 HTML\
  \ 字符串调用\n    你也可以使用 `jQuery` 方法创建新元素。要执行此操作，只需将要创建的元素的适当 HTML 代码作为字符串传递给该方法，如列表\
  \ 10.6 所示。\n\n```javascript\nconst newElement = $('<<div>>New element</</div>>');\
  \ \n```\n\n**列表 10.6** 使用 HTML 字符串调用 jQuery 方法\n\n#### 注意\n在所有显示的情况下，`jQuery` 方法的返回值都是一个对象，它为对应元素增加了额外的功能即\
  \ jQuery 对象。该对象包含对一个或多个 DOM 树节点的引用，后文称为所选节点或所选元素。\n\n### 10.1.4 使用 jQuery 简化任务\n\
  \njQuery 简化了 DOM 操作这一事实通过一个示例得到了最好的证明。假设你有一个 HTML 列表，其中每个列表项包含一个 URL（文本形式，而非链接），你想用\
  \ JavaScript 从它们创建真实的链接。\n\n```javascript\n'use strict';\nfunction init() {\n  const\
  \ listItems = document.getElementsByTagName('li');\n  for(let i=0; i<listItems.length;\
  \ i++) {\n    const listItem = listItems[i];\n    const url = listItem.textContent;\n\
  \    listItem.textContent = '';\n    const link = document.createElement('a');\n\
  \    link.setAttribute('href', url);\n    const linkText = document.createTextNode(url);\n\
  \    link.appendChild(linkText);\n    listItem.appendChild(link);\n  }\n}\ndocument.addEventListener('DOMContentLoaded',\
  \ init); \n```\n\n**列表 10.7** 使用纯 JavaScript 创建链接\n\n对于一个实际上简单的任务来说，这代码并不简单。如果你使用\
  \ `innerHTML` 属性而不是 `createElement()`、`setAttribute()` 和 `createTextNode()` DOM\
  \ 方法，情况也不会变得更好了，如列表 10.8 所示。这段代码看起来也相对杂乱且拼凑。\n\n```javascript\n'use strict';\nfunction\
  \ init() {\n  const listItems = document.getElementsByTagName('li');\n  for(let\
  \ i=0; i<listItems.length; i++) {\n    listItems[i].innerHTML = '<a href=\"'\n \
  \   + listItems[i].textContent + '\">'\n    + listItems[i].textContent + '</a>';\n\
  \  }\n}\ndocument.addEventListener('DOMContentLoaded', init); \n```\n\n**列表 10.8**\
  \ 使用 innerHTML 创建链接\n\n使用 jQuery，事情会变得优雅许多，至少可以这么说。相应的代码在列表 10.9 所示。在这里使用了 `wrapInner()`\
  \ 方法，该方法由 jQuery 对象提供给选元素。该方法用示例中传递函数返回的 HTML 代码包裹所选元素的内容。比之前的代码简单得多！\n\n```javascript\n\
  'use strict';\nfunction init() {\n  $('li').wrapInner(\n    function() {\n     \
  \ return '<a href=\"' + this.textContent + '\"></a>'\n    }\n  );\n}\n$(document).ready(init)\
  \ \n```\n\n**列表 10.9** 使用 jQuery 创建链接\n\n### jQuery 插件\n顺便说一下，如果你在 jQuery 中没有找到某功能，互联网上有成千上万的插件可用。官方插件注册表\
  \ [`plugins.jquery.com/`](https://plugins.jquery.com/) 提供了非常好的概述。\n\n## 10.2 操作\
  \ DOM\n\n\n\n\n\n多亏了 `querySelector()` 和 `querySelectorAll()` 等方法，操作 DOM 并不像现在这样一直方便。在很长一段时间里，jQuery\
  \ 是以简单方式处理 DOM 的首选——例如选择、修改或添加元素。即使在今天，jQuery 仍然支持你完成以下任务（等）：\n\n*   元素选择 (第 10.2.1\
  \ 节)\n*   访问和修改内容 (第 10.2.2 节)\n*   过滤选定的元素 (第 10.2.3 节)\n*   访问属性 (第 10.2.4 节)\n\
  *   访问 CSS 属性 (第 10.2.5 节)\n*   在元素之间导航 (第 10.2.6 节)\n*   使用效果 (第 10.2.7 节)\n\n\
  ### 10.2.1 选择元素\n\n使用 jQuery，可以使用类似 CSS 的选择器来选择元素。这些选择器可以分为以下几组：\n\n*   基础选择器：你已经在\
  \ CSS 中知道的必用选择器（参见 表 10.1）\n*   层级选择器：涉及元素层级的选择器（参见 表 10.2），这些在 CSS 中也已知\n*   基础过滤选择器：允许你更具体地过滤单个元素的选择器，并非所有在\
  \ CSS 中存在（参见 表 10.3）\n*   内容过滤选择器：包含元素内容的选择器（参见 表 10.4）\n*   可见性过滤选择器：涉及元素可见性的选择器（参见\
  \ 表 10.5）\n*   属性过滤选择器：包含元素属性的选择器（参见 表 10.6）\n*   表单过滤选择器：专门用于选择表单元素的选择器（参见 表 10.7）\n\
  *   子元素过滤选择器：选择子元素的选择器（参见 表 10.8）\n\n| 选择器 | 描述 |\n| --- | --- |\n| `*` | 任意名称元素\
  \ |\n| `elementName` | 类型为 `elementName` 的元素 |\n| `#id` | ID 为 `id` 的元素 |\n| `.class`\
  \ | 具有 `class` 类的元素 |\n| `selector1, selector2` | 匹配 `selector1` 选择器或 `selector2`\
  \ 选择器的元素 |\n\n**表 10.1 jQuery 中的基础选择器**\n\n| 选择器 | 描述 |\n| --- | --- |\n| `element1\
  \ element2` | 位于类型 `element1` 元素内部的所有类型 `element2` 元素 |\n| `element1 > element2`\
  \ | 类型 `element1` 元素直接子元素的所有类型 `element2` 元素 |\n| `element1 + element2` | 直接跟在类型\
  \ `element1` 元素之后的类型 `element2` 元素 |\n| `element1 ~ element2` | 跟在类型 `element1`\
  \ 元素之后的类型 `element2` 元素 |\n\n**表 10.2 jQuery 中的层级选择器**\n\n| 选择器 | 描述 |\n| --- |\
  \ --- |\n| `:animated` | 选择当前用于动画的元素。 |\n| `:header` | 选择所有标题元素——即 `h1`、`h2`、`h3`、`h4`、`h5`、`h6`\
  \ |\n| `:lang()` | 选择所传语言的元素。 |\n| `:not()` | 选择不匹配所传选择器的元素。 |\n| `:root` | 选择根元素——即\
  \ `html` 元素。 |\n| `:target` | 选择由对应 URL 段标识的元素。例如，如果 URL 为 `...#jquery`，则 `(':target')`\
  \ 将选择 ID 为 `jquery` 的元素。 |\n\n**表 10.3 过滤选择器**\n\n| 选择器 | 描述 |\n| --- | --- |\n\
  | `:contains()` | 选择包含传入文本的元素 |\n| `:empty` | 选择没有元素或子节点的元素 |\n| `:has()` | 选择包含至少一个匹配所传选择器的元素的元素\
  \ |\n| `:parent` | 选择至少有一个子元素的元素 |\n\n**表 10.4 内容过滤选择器**\n\n| 选择器 | 描述 |\n| ---\
  \ | --- |\n| `:hidden` | 选择不可见的元素 |\n| `:visible` | 选择所有可见的元素 |\n\n**表 10.5 可见性过滤选择器**\n\
  \n| 选择器 | 描述 |\n| --- | --- |\n| `[name|= \"value\"]` | 选择属性 `name` 的元素，其值是以减号分隔的系列值，且第一个值为\
  \ `value` |\n| `[name*= \"value\"]` | 选择属性 `name` 的元素，其值包含子字符串 `value` |\n| `[name~=\
  \ \"value\"]` | 选择属性 `name` 的元素，其值为值列表，其中一个值等于 `value` |\n| `[name$= \"value\"]`\
  \ | 选择属性 `name` 的元素，其值以 `value` 结尾 |\n| `[name= \"value\"]` | 选择属性 `name` 且值为 `value`\
  \ 的元素 |\n| `[name!= \"value\"]` | 选择属性 `name` 且值不等于 `value` 的元素 |\n| `[name^= \"\
  value\"]` | 选择属性 `name` 的元素，其值以 `value` 开头 |\n| `[name]` | 选择具有属性 `name` 的元素 |\n\
