  \ 12.13 节 |\n\n**表 12.1** 本章讨论的 Web API\n\n此外——因为在介绍 Web Storage API 和 Indexed Database\
  \ API 之前介绍它们正好——我们将简要讨论 cookie 的原理，并向你展示如何使用 JavaScript 创建和读取它们。\n\n### 更多 Web API：月刊文章\n\
  \n我经常在德国的《web & mobile DEVELOPER》杂志上介绍各种 Web API。在这种背景下，我会关注这里提到的 API 以外的 API，以及处于非常早期阶段的\
  \ API。非常欢迎你也成为那里的读者。\n\n### 本书中更多 Web API\n\n我们在整个课程中已经涵盖了一些 API，包括通过 `JavaScript`\
  \ 绘图的 `Canvas` API（参见第 11 章）以及约束验证 API，后者可以使用 `JavaScript` 验证表单输入（参见第 7 章）。\n\n\
  ### W3C 与 WHATWG\n\n在 Web API 的语境下，理解万维网联盟（W3C）与 Web 超文本应用技术工作组（WHATWG）之间的区别也很重要。前者是万维网技术的标准化机构，包括\
  \ `HTML`、`CSS` 和各种 Web API。而 WHATWG 是一个工作组，其在 2004 年的创建主要是因为当时 W3C 各种 Web 标准的进展相当缓慢。这是因为\
  \ W3C 的目标是始终采用 Web 标准的最终版本，这在现在可能需要一段时间。相反，WHATWG 采取了不同的策略：它维护所谓的“活标准”（living standards）——这些规范通过与各种浏览器制造商（顺便说一下，他们也是工作组的一部分）紧密合作进行持续开发。在\
  \ Web API 方面，这意味着你经常会遇到两个变体：一个由 W3C 批准的“最终”版本，另一个是由 WHATWG 进一步开发的版本。\n\n## 12.1\
  \ 通过 JavaScript 通信\n\n这一节介绍如何使用 `JavaScript` 和适当的 Web API 与服务器通信。具体来说，我们将涵盖 Web\
  \ Socket API 和服务器发送事件。前者实现了客户端与服务器之间的双向通信，后者允许服务器向客户端主动发送消息。\n\n### 12.1.1 与服务器的单向通信\n\
  \n在关注 Web Socket API（以及双向通信）之前，我们首先将对“正常”通信——即单向通信——进行概述，并展示近年来出现的各种方法。\n\n当通过 `HTTP`\
  \ 通信时，通信是从客户端发生的，无论它是经典网站还是基于 `Ajax` 的 Web 应用程序。在所有情况下，都是客户端向服务器制定 `HTTP` 请求，服务器随后做出响应。服务器无法通过\
  \ `HTTP` 主动向客户端发送数据。\n\n客户端与服务器之间的通信是单向的——即从客户端到服务器的一个方向。尽管服务器会回复，因此你是在两个方向上进行通信，但这并没有改变主动通信仅方向一个的事实。\n\
  \n假设你开发了一个应用程序，消息需要不规律地存储在服务器上，并在 Web 应用程序中相对及时地显示。如果服务器能通知客户端新消息就好了。过去出现了各种技术通过黑科技（hacks）来实现此类需求。其中一种方法就是所谓的“轮询”（polling），客户端在后台（通过\
  \ `Ajax` 请求）向服务器请求新数据，服务器随后相应地做出（参见图 12.1）。\n\n![轮询原理](img/klein12_001.png)(img-f12.1)\n\
  \n**图 12.1** 轮询原理\n\n轮询技术的变体是所谓的“长轮询”（long polling），客户端同样在后台向服务器发送请求（参见图 12.2）。如果服务器上有新数据，服务器立即提供响应。相反，如果没有新数据，服务器将保持\
  \ `HTTP` 连接开启，直到服务器上有新数据或超过了之前指定的超时时间。在这两种情况下，一旦客户端收到服务器的适当响应，它就会发送另一个请求，服务器再次保持连接开启，依此类推。\n\
  \n![长轮询原理](img/klein12_002.png)(img-f12.2)\n\n**图 12.2** 长轮询原理\n\n\n\n\n然而，也有一些技术可以让服务器真正地向客户端发送数据，因此你不需要我们刚才描述的技术。这些技术之一就是所谓的\
  \ Web Socket API。\n\n### 12.1.2 与服务器的双向通信\n\n客户端和服务器之间的 Socket 连接可以通过 Web Socket\
  \ API 建立（[www.w3.org/TR/websockets/](http://www.w3.org/TR/websockets/) 或 [`html.spec.whatwg.org/multipage/comms.html#network`](https://html.spec.whatwg.org/multipage/comms.html#network)），通过它，客户端可以向服务器发送数据，服务器也可以向客户端发送数据。换句话说，客户端和服务器之间存在持久连接，双方都可以随时向对方发送数据（参见图\
  \ 12.3）。\n\n![Web Socket 的原理](img/img-f12.3.html)\n\n**图 12.3**    Web Socket 的原理\n\
  \n规范仅包含一种类型（或接口）：即 `WebSocket`。要建立 web socket 连接，你需要使用适当的构造函数，如列表 12.1 所示。\n\n```\n\
  const connection = new WebSocket('ws://example.com/test'); \n```\n\n**列表 12.1**   创建一个\
  \ Web Socket 连接\n\n关于连接的建立，`WebSocket` 提供了三个事件处理器：当 web socket 连接打开时，调用事件处理器 `onopen`；当建立连接时发生错误时，调用事件处理器\
  \ `onerror`；最后当连接再次关闭时，调用事件处理器 `onclose`（参见列表 12.2）。\n\n```\nconnection.onopen =\
  \ (event) => {\n  console.log('Connection opened');\n};\nconnection.onerror = (error)\
  \ => {\n  console.log(`WebSocket Error: ${error}`);\n};\nconnection.onclose = (event)\
  \ => {\n  console.log('Connection closed');\n}; \n```\n\n**列表 12.2**   建立连接的不同事件处理器\n\
  \n要向服务器发送数据，请使用 `send()` 方法，显而易见，这只在 `onopen` 事件处理器内部才有意义（参见列表 12.3）。\n\n```\nconnection.onopen\
  \ = (event) => {\n  connection.send('Message to server').\n}; \n```\n\n**列表 12.3**   向服务器发送消息\n\
  \n在这里，字符串、二进制大对象（BLOBs）、数组缓冲区和类型化数组都可以传递给 `send()` 方法。因此，要发送 JSON 格式的数据，必须先通过 `JSON.stringify()`\
  \ 转换相应的 JavaScript 对象，如列表 12.4 所示。\n\n```\nconst message = {\n  hello: 'world'\n\
  };\nconnection.send(JSON.stringify(message)); \n\n```\n\n**列表 12.4**   向服务器发送 JSON\
  \ 消息\n\n另一方面，为了能够响应服务器发送的数据，`WebSocket` 提供了另一个事件处理器 `onmessage`（参见列表 12.5）。\n\n\
  ```\nconnection.onmessage = (event) {\n  console.log(event.data.byteLength);\n};\
  \ \n```\n\n**列表 12.5**   接收来自服务器的消息\n\n如果你从服务器接收 JSON 数据，则必须使用 `JSON.parse()` 对其进行转换，如列表\
  \ 12.6 所示。\n\n```\nconnection.onmessage = (event) => {\n  try {\n    const data\
  \ = JSON.parse(event.data);\n    console.log(data);\n  } catch (error) {\n    console.error('Error\
  \ parsing');\n  }\n}; \n```\n\n**列表 12.6**   从服务器接收 JSON 消息 \n\n此外，与向服务器发送消息一样，也可以从服务器接收\
  \ BLOBs 和数组缓冲区。这是通过将 `binaryType` 属性设置为值 `blob` 或 `arraybuffer` 实现的，默认情况下为前者的值（参见列表\
  \ 12.7）。\n\n```\nconnection.binaryType = 'arraybuffer'; \n```\n\n**列表 12.7**   确定二进制类型\n\
  \n要关闭连接，请使用 `close()` 方法。\n\n```\nconnection.close(); \n```\n\n**列表 12.8**   关闭\
  \ Web 连接\n\n### 12.3 与服务器的双向通信\n\n客户端和服务器之间的 Socket 连接可以通过 Web Socket API 建立（[www.w3.org/TR/websockets/](http://www.w3.org/TR/websockets/)\
  \ 或 [`html.spec.whatwg.org/multipage/comms.html#network`](https://html.spec.whatwg.org/multipage/comms.html#network)），通过它，客户端可以向服务器发送数据，服务器也可以向客户端发送数据。换句话说，客户端和服务器之间存在持久连接，双方都可以随时向对方发送数据（参见图\
  \ 12.3）。\n\n![Web Socket 的原理](img/img-f12.3.html)\n\n**图 12.3**    Web Socket 的原理\n\
  \n#### 客户端\n\n规范仅包含一种类型（或接口）：即 `WebSocket`。要建立 web socket 连接，你需要使用适当的构造函数，如列表 12.1\
  \ 所示。\n\n```\nconst connection = new WebSocket('ws://example.com/test');\n```\n\n\
  **列表 12.1**   创建一个 Web Socket 连接\n\n关于连接的建立，`WebSocket` 提供了三个事件处理器：当 web socket\
  \ 连接打开时，调用事件处理器 `onopen`；当建立连接时发生错误时，调用事件处理器 `onerror`；最后当连接再次关闭时，调用事件处理器 `onclose`（参见列表\
  \ 12.2）。\n\n```\nconnection.onopen = (event) => {\n  console.log('Connection opened');\n\
  };\nconnection.onerror = (error) => {\n  console.log(`WebSocket Error: ${error}`);\n\
  };\nconnection.onclose = (event) => {\n  console.log('Connection closed');\n}; \n\
  ```\n\n**列表 12.2**   建立连接的不同事件处理器\n\n要向服务器发送数据，请使用 `send()` 方法，显而易见，这只在 `onopen`\
  \ 事件处理器内部才有意义（参见列表 12.3）。\n\n```\nconnection.onopen = (event) => {\n  connection.send('Message\
  \ to server').\n}; \n```\n\n**列表 12.3**   向服务器发送消息\n\n在这里，字符串、二进制大对象（BLOBs）、数组缓冲区和类型化数组都可以传递给\
  \ `send()` 方法。因此，要发送 JSON 格式的数据，必须先通过 `JSON.stringify()` 转换相应的 JavaScript 对象，如列表\
  \ 12.4 所示。\n\n```\nconst message = {\n  hello: 'world'\n};\nconnection.send(JSON.stringify(message));\
  \ \n```\n\n**列表 12.4**   向服务器发送 JSON 消息\n\n另一方面，为了能够响应服务器发送的数据，`WebSocket` 提供了另一个事件处理器\
  \ `onmessage`（参见列表 12.5）。\n\n```\nconnection.onmessage = (event) {\n  console.log(event.data.byteLength);\n\
  }; \n```\n\n**列表 12.5**   接收来自服务器的消息\n\n如果你从服务器接收 JSON 数据，则必须使用 `JSON.parse()` 对其进行转换，如列表\
  \ 12.6 所示。\n\n```\nconnection.onmessage = (event) => {\n  try {\n    const data\
  \ = JSON.parse(event.data);\n    console.log(data);\n  } catch (error) {\n    console.error('Error\
  \ parsing');\n  }\n}; \n```\n\n**列表 12.6**   从服务器接收 JSON 消息 \n\n此外，与向服务器发送消息一样，也可以从服务器接收\
  \ BLOBs 和数组缓冲区。这是通过将 `binaryType` 属性设置为值 `blob` 或 `arraybuffer` 实现的，默认情况下为前者的值（参见列表\
  \ 12.7）。\n\n```\nconnection.binaryType = 'arraybuffer'; \n```\n\n**列表 12.7**   确定二进制类型\n\
  \n要关闭连接，请使用 `close()` 方法。\n\n```\nconnection.close(); \n```\n\n**列表 12.8**   关闭\
  \ Web 连接\n\n### 服务器\n\n客户端和服务器之间的 Socket 连接可以通过 Web Socket API 建立（[www.w3.org/TR/websockets/](http://www.w3.org/TR/websockets/)\
  \ 或 [`html.spec.whatwg.org/multipage/comms.html#network`](https://html.spec.whatwg.org/multipage/comms.html#network)），通过它，客户端可以向服务器发送数据，服务器也可以向客户端发送数据。换句话说，客户端和服务器之间存在持久连接，双方都可以随时向对方发送数据（参见图\
  \ 12.3）。\n\n![Web Socket 的原理](img/img-f12.3.html)\n\n**图 12.3**    Web Socket 的原理\n\
  \nAPI 定义了 `EventSource` 接口，它代表一个生成事件的服务端。要定义这样一个事件，你将 URL 传递给相应的函数，如列表 12.9 所示，并定义一个事件处理器来响应服务器的消息。\n\
  \n```\nconst source = new EventSource('/events');\nsource.onmessage = (event) =>\
  \ {\n  console.log(event.data);\n  console.log(event.origin);\n  console.log(event.lastEventId);\n\
  }; \n```\n\n**列表 12.9**   指定源\n\n除了 `onmessage` 事件处理器外，`onopen` 和 `onerror` 事件处理器也是可用的。前者在与服务器的连接打开时调用，后者在发生错误时调用。\n\
  \n作为 `onmessage` 事件处理器的替代，你还可以使用 `addEventListener()` 方法注册事件监听器（参见列表 12.10）。\n\n\
  ```\nconst source = new EventSource('/events');\nsource.addEventListener('message',\
  \ (event) => {\n  document.body.innerHTML += `${event.data}<br>`;\n}); \n```\n\n\
  **列表 12.10**   注册事件监听器\n\n缺失的是发送消息的服务端代码。在这种情况下，还有什么比同样使用 JavaScript 来编写它们并使用 Node.js\
  \ 更合适呢？我们有点超前，因为直到第 17 章我们才会详细讨论 Node.js——但这仍然比什么都不显示或者用 PHP 或 Java 实现要好。\n\n因此，如果你想在自己的计算机上尝试以下示例，首先需要安装\
  \ Node.js。列表 12.11 显示了应用程序的服务端代码，它每五秒生成一个 1 到 20 之间数字的加法示例任务（例如“5 + 9 =4”并将相应的任务作为字符串发送给客户端（参见图\
  \ 12.5）。\n\n![单个任务从服务器发送到客户端](img/img-f12.5.html)\n\n**图 12.5**    单个任务从服务器发送到客户端\n\
  \n\n\n\n但这一切都有顺序：首先，前两行（如果忽略 `<samp>'use strict';</samp>` 则是二三行）导入了两个标准的 Node.js\
  \ 模块——`fs` 模块（file 系统的缩写），提供了提供了与文件系统操作相关的函数，以及 `http` 模块，它可以启动 Web 服务器。\n\n```javascript\n\
  const fs = require('fs');\nconst http = require('http');\nconst MIN = 1;\nconst\
  \ MAX = 20;\n\nconst server = http.createServer((request, response) => {\n  if (request.headers.accept\
  \ && request.headers.accept === 'text/event-stream') {\n    // URL for the event\
  \ source\n    if (request.url === '/events') {\n      sendEvent(request, response);\n\
  \    } else {\n      response.writeHead(404);\n      response.end();\n    }\n  }\
  \ else {\n    // URL for the HTML file\n    response.writeHead(200, {'Content-Type':\
  \ 'text/html'});\n    response.write(fs.readFileSync(__dirname + '/index.html'));\n\
  \    response.end();\n  }\n})\nserver.listen(8000);\n\nfunction sendEvent(request,\
  \ response) {\n  response.writeHead(200, {\n    'Content-Type': 'text/event-stream',\n\
  \    'Cache-Control': 'no-cache',\n    'Connection': 'keep-alive'\n  });\n\n  const\
  \ id = (new Date()).toLocaleTimeString();\n\n  setInterval(() => {\n    createServerSendEvent(response,\
  \ id);\n  }, 5000);\n\n  createServerSendEvent(response, id);\n}\n\nfunction createServerSendEvent(response,\
  \ id) {\n  const exercise = createRandomExercise();\n  response.write('id: ' + id\
  \ + '\\n');\n  response.write('data: ' + exercise + '\\n\\n');\n}\n\nfunction createRandomExercise()\
  \ {\n  const number1 = Math.floor(Math.random() * MAX) + MIN;\n  const number2 =\
  \ Math.floor(Math.random() * MAX) + MIN;\n  const exercise = number1 + ' + ' + number2\
  \ + ' = ';\n  return exercise;\n} \n```\n\n**Listing 12.11** 用于服务器发送事件（SSE）的 Web\
  \ 服务器实现\n\n为了这个目的，`http` 模块提供了 `createServer()` 方法，你向其传递一个回调函数，该函数会在向 Web 服务器发送每个\
  \ HTTP 请求时被调用（稍后会详细介绍这一点）。通过 `listen()` 方法，你启动 Web 服务器。在这里，你可以指定访问服务器的端口（在示例中为端口\
  \ `8000`）。在 `createServer()` 的回调函数内部，你可以访问 HTTP 请求（`request` 参数）和 HTTP 响应（`response`\
  \ 参数）。\n\n此示例处理了两种情况：分支的第一部分（`if` 部分）检查请求是否为想要将服务器作为事件源的请求，而分支的第二部分（`else` 部分）对所有其他请求返回\
  \ `index.html` 文件（即来自 [Listing 12.12] 的内容）。\n\n发送单个事件可以在 `sendEvent()` 方法中看到：在这里，服务器每五秒钟使用\
  \ `createServerSendEvent()` 函数生成一个服务器端事件。创建随机加法任务的代码位于 `createRandomExercise()`\
  \ 函数中。\n\n### 启动服务器\n\n要启动脚本——假设已安装 Node.js——输入 `node <filename>` 命令，其中 `<filename>`\
  \ 处使用 JavaScript 文件名。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n  <meta charset=\"\
  utf-8\" />\n  <link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css\"\
  \ crossorigin=\"anonymous\">\n</head>\n<body>\n  <script>\n    document.addEventListener('DOMContentLoaded',\
  \ () => {\n      const source = new EventSource('/events');\n      const list =\
  \ document.getElementById('exercises')\n      source.addEventListener('message',\
  \ (e) => {\n        const listItem = document.createElement('li');\n        listItem.classList.add('list-group-item');\n\
  \        listItem.textContent += e.data;\n        list.appendChild(listItem);\n\
  \      });\n    });\n  </script>\n  <ul id=\"exercises\" class=\"list-group\">\n\
  \  </ul>\n</body>\n</html> \n```\n\n**Listing 12.12** 接收服务器端事件的 HTML 代码\n\n## 12.2\
  \ 识别用户\n\n有些用例要求你能够能够在客户端存储数据并在稍后检索。在接下来的章节中，你将学习实现此所需的各种技术。让我们从 Cookie 开始，它不是 HTML5，而且功能较少。\n\
  \n### 12.2.1 使用 Cookie\n\nHTTP 协议是一种无状态协议，这意味着来自客户端的任何请求都是相互独立的（见 [Figure 12.6]）。\n\
  \n然而，你通常会有需要识别用户的用例。例如，想象一个网上商店，用户可以将商品添加到购物车中。这就是 Cookie 发挥用场的地方。Cookie 允许你在客户端存储少量信息（如果用户允许且未在浏览器中采取适当的预防措施），这些信息随\
  \ HTTP 请求 一起传输（见图 12.7）。\n\n![HTTP Is a Stateless Protocol]\n**图 12.6** HTTP 是无状态协议\n\
  \n![The Principle of Cookies]\n**图 12.7** Cookie 的原理\n\n此类 文件本质上包含以下信息：\n\n- Cookie\
  \ 的名称和值。名称不区分大小写，这意味着例如 `name` 和 `Name` 指向同一个 Cookie。值只允许字符串（而不是数字）。名称和值是唯一的强制性信息。指定其余信息是可选的。\n\
  - 服务器的域名以及应发送到服务器的服务器路径。例如，具有 `www.javascriptmanual.com` 域名的 Cookie 只发送到该域名。具有域名\
  \ `www.javascripthandbuch.de` 和路径 `/samplechapter` 的 Cookie 只发送到 `www.javascripthandbuch.de/samplechapter`，而不会发送到\
  \ `www.javasripthandbuch.de`。\n- Cookie 的有效期。在此指定的日期之后，Cookie 将过期、被删除且不再发送到服务器。如果在创建\
  \ Cookie 时没有指定有效期，它会在浏览器会话结束时默认删除。\n- 一个安全标志，可选择地指定 Cookie 是否仅在使用安全套接层 (SSL) 的连接上发送——例如，允许发送到\
  \ `https://www.javascripthandbuch.de` 但阻止发送到 `http://www.javascripthandbuch.de`。\n\
  \n### Cookie 内容\n\nCookie 包含文本——即没有源代码或可执行代码。\n\n### 识别用户的替代方案\n\n\n\n\n除了 cookies\
  \ 之外，还有其他识别用户的方法——例如，URL 重写，这涉及到重写网页内部的链接并添加一个标识用户的参数。如果用户随后点击该链接，服务器端的 URL 参数就可以用来识别是哪一个用户。\n\
  \n### 12.2.2 创建 Cookies\n\nCookies 可以通过两种方式创建：一方面，它们可以通过 HTTP 响应标头从服务器发送到客户端；另一方面，它们可以在客户端生成——例如，通过\
  \ JavaScript。我们将在稍后介绍第二种情况。\n\n管理 cookies 的起点是 `document` 对象的 `cookie` 属性。可以通过该属性读取和创建\
  \ cookies。然而，正如你将看到的，这种操作一点并不方便。例如，要添加 cookies，你需要编写如列表 12.13 所示的代码。\n\n```\ndocument.cookie\
  \ = 'username=John Doe';\ndocument.cookie = 'shoppingCartItemIDs=22345,23445,65464,74747,46646,;\
  \ expires=Sa, 31 Dec 2021 23:59:59 UTC; path=/'; \n```\n\n**列表 12.13 在 JavaScript\
  \ 中创建 Cookies**\n\n#### 本 HTML 文件的 Cookies\n\n当你在浏览器中打开本地 HTML 文件时，浏览器默认可能不会设置 cookies。例如在\
  \ Chrome 中，你必须带有 `--enable-file-cookies` 才能解析本地 HTML 文件的 cookies。相比之下，Safari 和 Firefox\
  \ 默认接受本地 HTML 文件的 cookies。\n\n在这里，首先让人困惑的是，在创建 `document.cookie = newCookie` 之后的赋值并没有覆盖\
  \ `cookie` 属性，而是添加了一个新的 cookie。参考上一个示例，这意味着在执行这两行代码后，将为该网站创建两个 cookie：一个名为 `username`\
  \ 值为 `John Doe` 的 cookie，另一个名为 `shoppingCartItemIDs` 值为 `22345,23445,65464,74747,46646`\
  \ 的 cookie。你还可以通过指定 `expires` 和 `path` 来定义 cookie 的过期日期和路径。\n\n#### 注意事项\n\n在后台，当给\
  \ `cookie` 属性赋值时，会调用一个 setter 方法（这是一个访问属性；另请参阅第 4 章）。该 setter 方法不会覆盖任何现有值，而是简单地追加新值。\n\
  \n### 12.2.3 读取 Cookies\n\n定义 cookies 已经够困惑了，读取它们也同样异常复杂，如列表 12.14 所示。事实上，访问 `document.cookie`\
  \ 只是会给你一个包含当前页面所有 cookie 键值对的字符串。\n\n```\nconsole.log(document.cookie); \n// 输出:\
  \ username=John Doe; \n// shoppingCartItemIDs=22345,23445,65464,74747,46646 \n```\n\
  \n**列表 12.14 在 JavaScript 中读取 Cookies**\n\n这意味着两点：一方面，你无法通过 `document.cookie` 读取\
  \ cookie 的其他信息（例如过期日期）；另一方面，为了能够访问单个 cookie 及其值，对字符串进行分割是非常耗时的。幸运的是，有一些库可以实现这一点，例如\
  \ https://github.com/ScottHamper/Cookies 库，或者位于 https://github.com/carhartl/jquery-cookie\
  \ 的 jQuery 插件。\n\n但如果你不想使用额外的库，可以使用列表 12.15 所示的辅助函数（基于 www.quirksmode.org/js/cookies.html\
  \ 博客文章）。`createCookie()` 用于创建新的 cookies，`readCookie()` 用于读取 cookies，而 `deleteCookie()`\
  \ 用于删除 cookies。\n\n```\n// File: cookie-utils.js\nfunction createCookie(name, value,\
  \ days) {\n  let expires = '';\n  if (days) {\n    const date = new Date();\n  \
  \  date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));\n    expires = ';\
  \ expires=' + date.toUTCString();\n  }\n  document.cookie = name + '=' + value +\
  \ expires + path=/';\n}\n\nfunction readCookie(name) {\n  const nameEQ = name +\
  \ '=';\n  const ca = document.cookie.split(';');\n  for (let i = 0; i < ca.length;\
  \ i++) {\n    let c = ca[i].trim();\n    if (c.indexOf(nameEQ) == 0) {\n      return\
  \ c.substring(nameEQ.length, c.length);\n    }\n  }\n  return null;\n}\n\nfunction\
  \ deleteCookie(name) {\n  document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00\
  \ UTC; path=/';\n}\n```\n\n**列表 12.15 用于写入、读取和删除 Cookies 的辅助函数**\n\n`createCookie()`\
  \ 函数期望三个参数：cookie 的名称和值，以及可选的 cookie 预期持续天数。`readCookie()` 函数期望 cookie 的名称并返回 cookie\
  \ 的值。JavaScript 中没有直接删除 cookie 方法。对于 `deleteCookie()` 函数的实现，我们现在利用了事实：过期的 cookie\
  \ 会失效并被浏览器删除。\n\n#### Cookies 的应用场景\n\nCookies 主要有两个用途：首先是识别用户（在 cookie 中存储用户 ID），其次是在客户端存储（少量）数据。\n\
  \n### 12.2.4 示例：基于 Cookies 的购物车\n\n该示例由三个组件/文件组成：`catalog.js` 文件（见列表 12.16）包含了虚拟数据。在现实生活中，你显然不会将这些信息完全存储在客户端\
  \ JavaScript 中，而是存储在服务器端，并通过 Web 服务提供访问。然而，对于示例和说明 cookies，这种架构就足够了。\n\n```\n//\
  \ File: catalog.js\nconst catalog = {\n  id22345: {\n    name: '腌黄瓜 (500 ml)',\n\
  \    price: '2.50'\n  },\n  id23445: {\n    name: '梨 (2 kg)',\n    price: '4.50'\n\
  \  },\n  id46647: {\n    name: '樱桃',\n    price: '2.50'\n  },\n  id65464: {\n  \
  \  name: '苹果 (2 kg)',\n    price: '4.50'\n  },\n  id46648: {\n    name: '沙拉',\n\
  \    price: '2.50'\n  },\n  id74747: {\n    name: '罐装樱桃 (1000 ml)',\n    price:\
  \ '2.50'\n  },\n  id46646: {\n    name: '香蕉',\n    price: '4.50'\n  }\n}\n```\n\n\
  **列表 12.16 目录中的所有项目，为了简单起放在客户端**\n\n列表 12.17 显示了生成购物车输出的基础 HTML 结构。用于 cookie 辅助函数的\
  \ JavaScript 文件（`cookie-utils.js`）、商品目录（`catalog.js`）以及购物车实现（`shopping-cart.js`，我们稍后会讨论）像往一样作为外部\
  \ JavaScript 文件引入。\n\n\n\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"UTF-8\">\n  <title>Shopping Cart with Cookies</title>\n</head>\n\
  <body>\n<div>Hello, <span id=\"username\"></span></div>\n<br>\n\n<div id=\"shopping-cart\"\
  >\n  You have <span id=\"shopping-cart-item-count\">0</span> items in your cart.\n\
  \  <ul id=\"shopping-cart-items\"></ul>\n</div>\n<script src=\"cookie-utils.js\"\
  ></script>\n<script src=\"catalog.js\"></script>\n<script src=\"shopping-cart.js\"\
  ></script>\n</body>\n</html> \n```\n\n**列表 12.17**     购物车的基础 HTML 结构\n\n购物车的实现显示在列表\
  \ 12.18 中。你可以在这里看到两个函数：用于显示用户名的 `showUsername()` 和用于显示购物车的 `showShoppingCart()`。这两个函数都访问了之前定义的\
  \ `readCookie()` 辅助函数，从相应的 cookie 中读取对应的数据。为了简单起见，用户名和购物车中的产品 ID 在脚本开始时使用 `createCookie()`\
  \ 初始化。通常，你会在用户登录后存储用户名，并在每次添加或删除产品后存储购物车。结果显示在图 12.8 中。\n\n```javascript\n// File:\
  \ shopping-cart.js\ncreateCookie('username', 'John Doe', 7);\ncreateCookie('shoppingCartItemIDs',\
  \ \n             'id22345,id23445,id65464,id74747,id46646',\n             7);\n\n\
  showUsername();\nshowShoppingCart();\n\nfunction showUsername() {\n  const username\
  \ = readCookie('username');\n  document.getElementById('username').textContent =\
  \ username;\n}\n\nfunction showShoppingCart() {\n  const ids = readCookie('shoppingCartItemIDs').split(',');\n\
  \  const itemsElement = document.getElementById('shopping-cart-items');\n  ids.forEach(function\
  \ (id) {\n    const item = catalog[id];\n    const itemElement = document.createElement('li');\n\
  \    itemElement.appendChild(document.createTextNode(item.name));\n    itemsElement.appendChild(itemElement);\n\
  \  });\n  document.getElementById('shopping-cart-item-count').textContent = ids.length;\n\
  } \n```\n\n**列表 12.18**     读取 Cookie 并显示购物车\n\n![购物车是使用 Cookie 的典型示例](img/img-f12.8.html)\n\
  \n**图 12.8**     购物车是使用 Cookie 的典型示例\n\n### 显示 Cookie 内容\n\n不同浏览器厂商的开发者工具允许你查看 cookie\
  \ 的内容。在 Chrome DevTools 中，你可以在 Resources • Cookies 下找到此功能（请参见图 12.9）。\n\n![不同的浏览器提供了可以查看\
  \ Cookie 的辅助工具——这里是 Chrome DevTools](img/img-f12.9.html)\n\n**图 12.9** 不同的浏览器提供了可以查看\
  \ Cookie 的辅助工具——这里是 Chrome DevTools\n\n### 12.2.5 Cookie 的缺点\n\n对应域和相关路径的所有 cookie\
  \ 都会随每次请求发送，这会影响数据量。此外，通过 HTTP 协议（而非通过安全的 HTTPS 协议）发送的 cookie 是明文传输的，取决于传输信息的类型，存在安全风险。cookie\
  \ 的另一个限制是允许的内存大小为 4 KB。\n\n## 12.3 使用浏览器存储\n\nWeb API ([`html.spec.whatwg.org/multipage/webstorage.html`](https://html.spec.whatwg.org/multipage/webstorage.html))\
  \ 定义了访问浏览器内部存储的接口。原则上，有两种不同类型的浏览器存储：本地浏览器存储（local storage），可以在不同的浏览器窗口和标签页之间访问；会话存储（session\
  \ storage），仅在浏览器标签页内可用（详情见本章后面的第 12.3.6 节）。\n\n前者——即本地存储——可以通过 `localStorage` 全局对象（或\
  \ `window.localStorage`）访问，后者会话存储可以通过 `sessionStorage` 全局对象（或 `window.sessionStorage`）访问。在\
  \ API 方面，这两种浏览器存储选项是相同的（请参见表格 12.2）；也就是说，它们具有相同的方法和属性（表示浏览器存储的对应对象类型均为 `Storage`）。\n\
  \n| 属性/方法 |  |\n| :--- | :--- |\n| `length` | 包含存储中元素的数量 |\n| `clear()` | 从存储中移除所有的键值对\
  \ |\n| `getItem(key)` | 根据键从存储中返回对应的值 |\n| `key(index)` | 返回存储中位置 `index` 处的键的名称\
  \ |\n| `removeItem(key)` | 从存储中移除（如果存在）所传键的键值对 |\n| `setItem(key, value)` | 在存储中为相应的键插入一个值，或者如果已存在同名的键则覆盖该值\
  \ |\n\n**表格 12.2** 存储的属性和方法\n\n### 12.3.1 在浏览器存储中存储值\n\n将值存储到浏览器存储是通过使用 `setItem()`\
  \ 方法完成的。对于此方法，你将要存储值的键作为第一个参数，将要存储的值作为第二个参数传递。如前所述，这适用于本地存储（请参见列表 12.19）和会话浏览器存储（请参见列表\
  \ 12.20）。\n\n```javascript\nlocalStorage.setItem('firstname', 'John');\nlocalStorage.setItem('lastname',\
  \ 'Doe'); \n```\n\n**列表 12.19** 向本地浏览器存储存储值\n\n```javascript\nsessionStorage.setItem('firstname',\
  \ 'John');\nsessionStorage.setItem('lastname', 'Doe'); \n```\n\n**列表 12.20** 向会话浏览器存储存储值\n\
  \n要存储的值必须是字符串，这意味着你应该先使用 `JSON.stringify()` 将对象转换为字符串，如列表 12.21 所示。\n\n如果你这样做，则将使用相应对象的\
  \ `toString()` 方法返回的值，默认是 `[object Object]` 字符串。这通常不是你想要的。\n\n```javascript\nconst\
  \ user = {\n  firstname: 'John',\n  lastname: 'Doe'\n}\nlocalStorage.setItem(\n\
  \  'user',\n  user                  // 错误：存储了 [object Object]\n);\nlocalStorage.setItem(\n\
  \  'user',\n  JSON.stringify(user)  // 正确：以 JSON 格式存储对象\n); \n```\n\n**列表 12.21**\
  \ 存储前必须将对象转换为字符串\n\n### 12.3.2 从浏览器存储中读取值\n\n类似于用于在对象存储中存储值的 `setItem()` 方法，可以使用\
  \ `getItem()` 方法根据键从对象存储中读取值（请参见列表 12.22）。\n\n\n\n\n\n```javascript\nconst firstname\
  \ = localStorage.getItem('firstname');  // 读取 \"firstname\" \n                 \
  \                                     // 属性\n                                  \
  \                    // 值\nconst lastname = localStorage.getItem('lastname'); //\
  \ 读取 \"lastname\" \n                                                   // 属性的值\n\
  console.log(firstname);                            // John\nconsole.log(lastname);\
  \                             // Doe \n```\n\n列表 12.22 从本地存储（Local Storage）读取值\n\
  \n在读取之前存储（并通过 `JSON.stringify()` 转换）的对象时，你必须记住通过 `JSON.parse()` 将相应的值转换回对象。毕竟，该值是一个字符串。例如，要再次从对象存储中读取列表\
  \ 12.21 中存储的 `user` 对象，请按照列表 12.23 所示所示操作。\n\n```javascript\nlet user = localStorage.getItem('user');\n\
  user = JSON.parse(user);\nconsole.log(user.firstname);                        //\
  \ John\nconsole.log(user.lastname);                         // Doe \n```\n\n列表 12.23\
  \ 从本地存储读取对象\n\n### 12.3.3 更新浏览器存储中的值\n\n没有单独的方法来更新浏览器存储选项之一中的值。此任务通过 `setItem()`\
  \ 方法完成。它确保如果键（key）已存在于对象存储中，则值将被覆盖。你可以在列表 12.24 中看到一个示例。\n\n```javascript\nlocalStorage.setItem('firstname',\
  \ 'John');\nlocalStorage.setItem('lastname', 'Doe');\nlet firstname = localStorage.getItem('firstname');\n\
  let lastname = localStorage.getItem('lastname');\nconsole.log(firstname);      \
  \                       // John\nconsole.log(lastname);                        \
  \      // Doe\nlocalStorage.setItem('firstname', 'James');\nlocalStorage.setItem('lastname',\
  \ 'Peterson');\nfirstname = localStorage.getItem('firstname');\nlastname = localStorage.getItem('lastname');\n\
  console.log(firstname);                             // James\nconsole.log(lastname);\
  \                              // Peterson \n```\n\n列表 12.24 更新浏览器存储中的值\n\n### 12.3.4\
  \ 从浏览器存储中删除值\n\n可以使用 `removeItem()` 方法选择性地删除浏览器存储中的单个项目，并将相应项目的键作为参数传递（参见列表 12.25）。如果你想删除的不仅仅是一个条目，而是浏览器存储的所有条目，则使用\
  \ `clear()` 方法。\n\n```javascript\nlocalStorage.setItem('firstname', 'John');\nlocalStorage.setItem('lastname',\
  \ 'Doe');\nconst firstname = localStorage.getItem('firstname');\nconst lastname\
  \ = localStorage.getItem('lastname');\nconsole.log(firstname);     // John\nconsole.log(lastname);\
  \      // Doe\nlocalStorage.removeItem('firstname');\nlocalStorage.removeItem('lastname');\
  \ \n```\n\n列表 12.25 从浏览器存储删除值\n\n### 12.3.5 响应浏览器存储的变化\n\n为了响应浏览器存储的变化，你可以使用 `window`\
  \ 对象的 `addEventListener()` 方法为 `storage` 事件注册事件监听器。每当浏览器存储（无论是 `localStorage` 还是\
  \ `sessionStorage`）发生变化时，该事件就会被触发。\n\n作为参数传递给事件监听器的对应事件对象类型为 `StorageEvent`，除了事件对象默认提供的属性外，它还包含其他属性，你可以在列表\
  \ 12.26 和表 12.3 中看到。`key` 属性包含发生变化的条目的键，`oldValue`包含旧值，`newValue`包含新值，`url`属性包含发生条目变化的文档\
  \ URL，`storageArea`包含受变化影响的存储对象。\n\n```javascript\nwindow.addEventListener('storage',\
  \ (e) => {\n  console.log(e.key);          // 更新条目的键\n  console.log(e.oldValue);\
  \     // 旧值\n  console.log(e.newValue);     // 新值\n  console.log(e.url)        \
  \   // 发生条目变化的文档 URL\n                               // ...\n  console.log(e.storageArea);\
  \  // 被更改的存储对象\n}); \n```\n\n列表 12.26 注册事件\n\n| 属性 |  |\n| --- | --- |\n| `key`\
  \ | 包含更新条目的键 |\n| `oldValue` | 包含存储在该键后的旧值 |\n| `newValue` | 包含现在存储在该键后的新值 |\n|\
  \ `url` | 包含条目变化的文档 URL |\n| `storageArea` | 包含被更改的存储对象的引用 |\n\n表 12.3 StorageEvent\
  \ 属性\n\n### 12.3.6 浏览器存储的不同类型\n\n正如你在前面的节中学到的那样，有两种不同类型的浏览器存储：本地存储（通过 `window.localStorage`\
  \ 访问）和会话存储（通过 `window.sessionStorage` 访问）。我们还没有解释两者之间的具体区别。现在让我们弥补这一点。\n\n原则上，这两种类型的存储的区别在于它们可见的位置或从哪里可以访问。本地存储如图\
  \ 12.10 所示，可以从相应浏览器内的所有窗口和标签页访问（当然，无法访问另一个浏览器的本地存储）。\n\n另一方面，会话存储每个窗口或标签页都是不同的，如图\
  \ 12.11 所示。因此，无法从另一个窗口或标签页访问窗口或标签页的会话存储。\n\n图 12.10 本地存储的原理\n\n图 12.11 会话存储的原理\n\
  \n### 12.3.7 示例：基于浏览器存储的购物车\n\n节 12.2.4 中的购物车示例在当时是基于 cookie 实现的，可以使用浏览器存储进行自定义，如列表\
  \ 12.27 所示。更改在列表中以**粗体**打印，并仅影响四行：即存储并再次读取用户名以及购物车中产品 ID 的那几行。其余代码以及 `catalog.js`（参见列表\
  \ 12.16）和 `index.html` 文件保持不变。\n\n\n\n\n\n```javascript\n// File: shopping-cart.js\n\
  localStorage.setItem('username', 'John Doe');\nlocalStorage.setItem('shoppingCartItemIDs',\
  \ JSON.stringify(\n  ['id22345','id23445','id65464','id74747','id46646'])\n);\n\n\
  showUsername();\nshowShoppingCart();\n\nfunction showUsername() {\n  const username\
  \ = localStorage.getItem('username');\n  document.getElementById('username').textContent\
  \ = username;\n}\n\nfunction showShoppingCart() {\n  const ids = JSON.parse(localStorage.getItem('shoppingCartItemIDs'));\n\
  \  const itemsElement = document.getElementById('shopping-cart-items');\n  ids.forEach(function\
  \ (id) {\n    const item = catalog[id];\n    const itemElement = document.createElement('li');\n\
  \    itemElement.appendChild(document.createTextNode(item.name));\n    itemsElement.appendChild(itemElement);\n\
  \  });\n  document.getElementById('shopping-cart-item-count').textContent = ids.length;\n\
  } \n```\n\n列表 12.27 从浏览器存储读取值并显示购物车\n\n### 查看浏览器存储的内容\n\n你通常可以通过各种浏览器工具查看各种浏览器存储区域。例如图\
  \ 12.12 显示了 Chrome DevTools。在那里你可以在“资源 (Resources) • 本地存储 (Local Storage)”找到本地浏览器存储，在“资源\
  \ (Resources) • 会话存储 (Session Storage)”找到会话存储。\n\n![可以使用各种浏览器工具检查本地存储，如 Chrome DevTools\
  \ 所示](img/img-f12.12.html)\n\n图 12.12 可以使用各种浏览器工具检查本地存储，如 Chrome DevTools 所示\n\n\
  ## 12.4 使用浏览器数据库\n\nIndexed Database API 或 IndexedDB API ([www.w3.org/TR/IndexedDB/](http://www.w3.org/TR/IndexedDB/))\
  \ 是一种存储在浏览器中或由浏览器实现并提供的数据库。在向你具体展示如何使用 IndexedDB API 之前，我们将先解释有关数据库的一些基本概念，特别是用于\
  \ IndexedDB 使用的概念。\n\n原则上，这种（客户端）数据库的工作方式与服务器端数据库相同；也就是说，你可以在其中创建记录、读取记录、更新或再次删除它们。\n\
  \n### CRUD 操作\n\n通常会一起讨论四个关键操作：创建、读取、更新和删除（CRUD）。\n\nIndexedDB 是一种非关系型数据库，也称为 NoSQL\
  \ 数据库。另一方面，还有关系型数据库，数据以不同表中的记录形式存储。`MySQL` 和 `PostgreSQL` 是关系型数据库的示例。在 NoSQL 数据库中，你存储的是对象。这里对键值存储器、列族、图数据库、文档数据库等进行了进一步区分。非关系型数据库的示例包括\
  \ `MongoDB`、`CouchDB`、`Redis` 或客户端的 `IndexedDB`。\n\nIndexedDB 的核心思想是在特定键下存储 JavaScriptJavaScript\
  \ 对象；也就是说，IndexedDB 是一个键值存储器。原则上，这与映射（map）数据结构可以比拟；也就是说，此类数据库中的单个对象作为值存储在某些键下。\n\
  \nIndexedDB 数据库的核心由对象存储器（object stores）组成。这些大致与关系型数据库中的表相似，包含了各种键值对。\n\n### 12.4.1\
  \ 打开数据库\n\n你可以通过 `window` 对象访问 IndexedDB。它的 `indexedDB` 属性包含一个类型为 `IDBFactory` 的对象，用于打开数据库等。为了此目的，该对象提供了\
  \ `open()` 方法。如列表 12.28 所示，你向它传递数据库名称，并可选将版本号作为第二个参数（后者在内部决定用于存储对象的数据库模式）。\n\n`open()`\
  \ 方法的返回值是一个 `IDBOpenDBRequest` 类型的对象；也就是说，此时你还没有拿到数据库本身（或代表它的对象），只是发出了打开相应数据库的请求。\n\
  \n为了能够访问数据库本身或在发生错误时访问相应的错误，可以在此请求对象上定义各种事件处理器。例如，可以使用 `onerror` 属性在发生错误时制定事件处理器，例如用户在浏览器中没有权限访问数据库时。`onsuccess`\
  \ 属性可用于定义在数据库成功打开后调用的事件处理器。\n\n```javascript\nconst idbFactory = window.indexedDB;\
  \     // 访问辅助对象\nconst request = idbFactory.open(         // 打开数据库...\n  'TestDatabase',\
  \                        // ...基于名称...\n  1                                    \
  \  // ...以及可选的版本\n);\nrequest.onerror = (event) => {           // 发生错误时的事件处理器\n\
  \  const error = event.target.error;      // 访问错误\n  console.error(error.message);\
  \          // 输出错误\n};\nrequest.onsuccess = (event) => {        // 正常情况的事件处理器\n\
  \  const database = event.target.result;  // 访问数据库\n  console.log(database.name);\
  \            // 输出: \"TestDatabase\"\n  console.log(database.version);         //\
  \ 输出: 1\n}; \n```\n\n列表 12.28 打开数据库\n\n在这些处理器内部，你随后可以相应访问错误对象（发生错误时）或数据库对象（正常情况下）。例如，`onsuccess`\
  \ 处理器中的 `event.target.result` 会带你进入 `IDBDatabase` 类型的对象，这反过来让你能够访问更多信息，如名称、版本甚至包含的对象存储器，并允许你创建和删除对象存储器，这在很快之后将非常重要。\n\
  \n### 浏览器前缀\n\n通常，新功能在相应规范获得最终批准之前就已经被各种浏览器实现。浏览器通常使用浏览器前缀来指示这一点。例如，在某些旧版本的浏览器中，IndexedDB\
  \ 并不是隐藏在 `indexedDB` 属性下，而是在相应的浏览器前缀属性下——例如 Firefox 的 `mozIndexedDB` 以及 Chrome 和\
  \ Safari 的 `webkitIndexedDB`。如果你也想包含这些浏览器，建议使用列表 12.29 所示出的代码片段。\n\n```javascript\n\
  window.indexedDB = window.indexedDB        // 针对正常情况\n                || window.mozIndexedDB\
  \     // 旧版本的 Firefox\n                || window.webkitIndexedDB  // 旧版本的 Chrome\n\
  \                || window.msIndexedDB      // 旧版本的 IE\n```\n\n列表 12.29 为旧浏览器回退到浏览器特定的\
  \ IndexedDB\n\n这简单地重置了 `window.indexedDB` 属性：如果该属性存在，则直接复用其值；否则，搜索相应的浏览器特定版本。如果你对\
  \ API 的其他对象（如 `window.IDBTransaction` 和 `window.IDBKeyRange`）重复此操作，你就可以获得在程序剩余部分中无需处理浏览器前缀的优势。\n\
  \n### 12.4.2 创建数据库\n\n\n\n\n\n创建一个新数据库基本上与我们在上一节中讨论的打开数据库没有区别。事实上，以下情况同样适用：如果你尝试打开一个尚的数据库，该数据库将被隐式创建。换句话说，打开和创建数据库的代码几乎是相同的。唯一的区别在于，创建数据库时，还应该创建所需的对象存储（object\
  \ stores）。\n\n现在，自然产生了一个问题：如何区分“打开”和“创建”数据库？答案由 `onupgradeneeded` 事件处理器提供。每当请求的数据库不存在（因此被创建），或者请求的数据库在当前版本中不存在时，该事件处理器就会被调用。在这两种情况下，被调用的事件处理器都会接收一个类型为\
  \ `IDBVersionChangeEvent` 的对象作为参数。通过该对象，你可以访问旧版本新版本（参见 Listing 12.30）。\n\n```\n\
  request.onupgradeneeded = (event) => {\n  console.log(event.oldVersion);       \
  \  // old version of the database\n  console.log(event.newVersion);         // new\
  \ version of the database\n  const database = event.target.result;  // Access to\
  \ the database\n} \n```\n\n**Listing 12.30** 当创建新数据库或数据库更改时被调用的事件处理器\n\n由于 `onupgradeneeded`\
  \ 仅在数据库尚未以这种形式存在时被调用，因此相应的事件处理器是创建对象存储或通常来说定义数据库架构（database schema）的合适位置。\n\n##\
  \ 数据库架构\n\n数据库架构定义了数据在数据库中的存储形式。以 IndexedDB 为例，这包含了数据库中包含的对象存储。\n\n### 12.4.3 创建对象存储\n\
  \n现在你已经知道如何连接到数据库，并理解了 `onupgradeneeded` 的工作原理或触发该事件的场景，我们将向你展示如何创建对象存储。通常，你会在 `onupgradeneeded`\
  \ 处理器中执行此（毕竟你只想创建一个对象存储）。\n\n你可以使用 `database` 对象上的 `createObjectStore()` 方法来创建对象存储。在此，你传递对象存储的名称以及可选的其他配置参数。例如，在\
  \ Listing 12.31 中，创建了一个名为 `Books` 的对象存储；此外，使用 `keyPath` 配置参数来定义 `isbn` 属性（存储在数据库中的对象的属性）作为键（稍后将对此详细介绍）。\n\
  \n```\nrequest.onupgradeneeded = (event) => { \n  const database = event.target.result;\
  \        // Access to the database object\n  const objectStore = database.createObjectStore(\
  \  // Create the object store ...\n    'Books',                                \
  \       // ... where a name...\n    { keyPath: 'isbn' }                        //\
  \ ... and optional parameters ...\n  );                                        \
  \   // ... can be passed.\n}; \n```\n\n**Listing 12.31** 创建对象存储\n\n## 增加数据库的版本号\n\
  \n如果在打开数据库时递了版本号，旧版本的对象存储将保留。你必须考虑这一点，因为如果你尝试重新创建一个已经存在的对象存储，将抛出错误。\n\n### 12.4.4\
  \ 向对象存储添加对象\n\n如所述，IndexedDB 是一种以整体形式存储对象的数据库，而不是像关系型数据库那样将对象的每个属性划分为表格的单独列。每个对象都存储在对象存储中，并在后面跟有一个键，用于稍后访问该对象。具体使用什么作为键由\
  \ `keyPath` 和 `autoIncrement` 配置参数决定。Table 12.4 显示了这两个参数的不同组合以及它们对键的含义。\n\n| keyPath\
  \ | autoIncrement | 描述 |\n| --- | --- | --- |\n| 未指定 | `false` | 对象存储可以存储各种值，特别是对于字符串或数字等原始数据类型。然而，每次添加时必须显式指定键。\
  \ |\n| 已指定 | `false` | 对象存储中只能存储对象（即：没有原始数据类型）。但这里的先决条件是这些对象必须有一个与指定的 `keyPath`\
  \ 属性相同的属性。 |\n| 未指定 | `true` | 对象存储可以存储各种值，特别是对于字符串或数字等原始数据类型。键会自动生成，但在添加值时可以可选地指定。\
  \ |\n| 已指定 | `true` | 对象存储中只能存储对象（即：没有原始数据类型）。键会自动创建并添加到到新对象中——如果该对象尚未具有与指定的 `keyPath`\
  \ 同名的属性。反之，如果对象中已存在该属性，则不生成键，而是使用已存储的值作为键。 |\n\n**Table 12.4** IndexedDB 的键生成机制\n\
  \n在 IndexedDB 中，对数据库执行的操作封装在事务（见方框）中。其工作原理请见 Listing 12.32。`transaction()` 方法通过\
  \ `database` 对象访问类型为 `IDBTransaction` 的事务对象。该方法的第一个参数是一个要在事务中访问的对象存储名称的数组。如果只需要访问一个对象存储，也可以传递单个字符串而不是数组。\n\
  \n## 事务\n\n通常，数据库世界中的事务指的是被视为封闭逻辑单元的操作序列。\n\n（可选）第二个参数可用于指定事务模式：可能的值包括 `readonly`（数据只读）、`readwrite`（数据可读可写）和\
  \ `versionchange`（数据、对象存储和索引可以更改；另见[Table 12.5）。如果不指定参数，默认使用 `readonly`。但由于这里的目的是向对象存储添加对象（即：向数据库写入数据），在示例中必须使用\
  \ `readwrite` 值或显式指定它。\n\n| Value | 描述 |\n| --- | --- |\n| `readonly` | 数据可以读取但不能更改。\
  \ |\n| `readwrite` | 数据可以读取也可以更改。 |\n| `versionchange` | 允许对数据进行所有类型的操作（即读和写）。这还包括删除或创建对象存储及索引的操作。\
  \ |\n\n**Table 12.5** 事务控制的允许值\n\n\n\n\n\n在下一步中，你通过存储在 `transaction` 变量中的 `IDBTransaction`\
  \ 类型对象来访问对象存储（这些存储在事务范围内是可用）。在示例中，这打开了之前创建的名为 `Books` 的对象存储。返回的对象类型为 `IDBObjectStore`，并具有各种方法——例如，添加对象、返回对象、删除对象等。\n\
  \n在示例中，使用 `add()` 方法将 `books` 数组中的对象逐个添加到对象存储中。可选地，可以将对象在对象存储中存储的键作为第二个参数传递此方法（示例中未显示）。此处适用于表\
  \ 12.4 中的规则。\n\n```javascript\nconst idbFactory = window.indexedDB;\nconst request\
  \ = idbFactory.open(\n  'TestDatabase',\n  9\n);\nconst books = [\n  {\n    'isbn':\
  \ '978-1-4932-2286-5',\n    'title': 'JavaScript: The Comprehensive Guide',\n  \
  \  'author': 'Philip Ackermann'\n  },\n  {\n    'isbn': '978-1-4932-2292-6',\n \
  \   'title': 'Node.js: The Comprehensive Guide',\n    'author': 'Sebastian Springer'\n\
  \  }\n]\nrequest.onerror = (event) => {\n  const error = event.target.error;\n \
  \ console.error(error.message);\n};\nrequest.onsuccess = (event) => {\n  const database\
  \ = event.target.result;\n  const transaction = database.transaction(          \
  \    // 打开事务\n    ['Books'],\n    'readwrite'                                  \
  \        // 写访问\n  );\n  const objectStore = transaction.objectStore('Books'); \
  \ // 打开对象存储\n  books.forEach(function(book) {\n    objectStore.add(book);      \
  \                         // 添加对象\n  });\n};\nrequest.onupgradeneeded = (event)\
  \ => {\n  const database = event.target.result;\n  const objectStore = database\n\
  \    .createObjectStore('Books', { keyPath: 'isbn' });\n} \n```\n\n**代码列表 12.32**\
  \ 向对象存储添加对象\n\n### 注意\n在旧版本的 IndexedDB API 中，`READ_ONLY`、`READ_WRITE` 和 `VERSION_CHANGE`\
  \ 常量可用 `IDBTransaction` 对象中。然而，由于一个 Bug，这些常量不再包含在当前的 API 中。\n\n### 查看数据库内容\n顺便提一下，借助各种浏览器工具可以对数据库、对象存储以及存储其中的对象的结构获得非常好的洞察，就像\
  \ cookie 和浏览器存储一样。\n\n例如，在 Chrome DevTools 中，你可以通过 Resources • IndexedDB 访问此功能（参见图\
  \ 12.13）。\n\n![Chrome DevTools 中的数据库和对象存储概览](img/img-f12.13.html)\n\n**图 12.13**\
  \ Chrome DevTools 中的数据库和对象存储概览\n\n### 12.4.5 从对象存储中读取对象\n一旦你理解了如何打开对象存储的原理，对其进行进一步操作并不困难。例如，要从对象存储中读取数据，你基本上按照刚才的操作进行即可：即连接到数据库，然后启动事务（在这种情况下\
  \ `readonly` 就足够了），并使用 `objectStore()` 方法访问相应的对象存储。你已经从之前的章节中了解了这一切；为了完整起见，在代码列表\
  \ 12.33 中再次显示。\n\n然后你可以使用 `get()` 方法和传递给此方法作为参数的键来访问对象存储中的对象。作为返回值，`get()` 返回一个\
  \ `IDBRequest` 类型的请求对象，正如你已经从打开数据库的 `open()` 方法中所了解的那样（尽管严格来说，那里是 `IDBOpenDBRequest`\
  \ 类型的对象，但原理是相同的）。换句话说，可以为正常情况（通过 `onsuccess` 属性）和错误情况（通过 `onerror` 属性）定义事件处理器。只要对象存储中存在于传递键的对象且没有发生错误，你就可以在\
  \ `onsuccess` 处理器中访问该对象。\n\n```javascript\nconst idbFactory = window.indexedDB;\n\
  const request = idbFactory.open('TestDatabase', 9);\nrequest.onerror = (event) =>\
  \ {\n  const error = event.target.error;\n  console.error(error.message);\n};\n\
  request.onsuccess = (event) => {\n  const database = event.target.result;\n  const\
  \ transaction = database.transaction('Books');    // 打开事务\n  const objectStore =\
  \ transaction.objectStore('Books'); // 打开对象存储\n  const request = objectStore.get('978-1-4932-2292-6');\
  \ // 查找键\n  request.onerror = (event) => {                  // ... 的事件处理器 \n   \
  \                                               // ... 错误情况\n    console.error(event.target.error.message);\
  \    // 输出错误信息\n  };\n  request.onsuccess = (event) => {                      //\
  \ ... 的事件处理器\n                                                        // ... 正常情况\n\
  \    console.log(request.result);                        // 输出对象\n  };\n}; \n```\n\
  \n**代码列表 12.33** 对象存储的读访问\n\n### 12.4.6 从对象存储中删除对象\n从对象存储中删除对象在模板代码方面遵循相同的原理，如代码列表\
  \ 12.34 所示。但由于删除也会更改数据库中的数据，因此必要在 `readwrite` 模式下启动相应的事务。\n\n要删除对象，你使用对象存储中的 `delete()`\
  \ 方法。该方法期望要删除对象的键作为其参数。与一样，返回值是 `IDBRequest` 类型的请求对象。\n\n```javascript\nconst idbFactory\
  \ = window.indexedDB;\nconst request = idbFactory.open('TestDatabase', 9);\nrequest.onerror\
  \ = (event) => {\n  const error = event.target.error;\n  console.error(error.message);\n\
  };\nrequest.onsuccess = (event) => {\n  const database = event.target.result;\n\
  \  const transaction = database.transaction(             // 打开事务\n    'Books',\n\
  \    'readwrite'                                         // 写访问\n  );\n  const objectStore\
  \ = transaction.objectStore('Books'); // 打开对象存储\n  const request = objectStore.delete('978-1-4932-2286-5');\
  \ // 删除操作\n  request.onerror = (event) => {                     // ... 的事件处理器\n\
  \                                     // ... 错误情况\n    console.error(event.target.error.message);\
  \       // 输出错误信息\n  };\n  request.onsuccess = (event) => {                    \
  \  // ... 的事件处理器\n                                                        // ...\
  \ 正常情况\n    console.log('Delete operation successful');\n  };\n}; \n```\n\n**代码列表\
  \ 12.34** 从对象存储中删除对象\n\n如果你不仅想删除对象存储中的某个特定对象，还要删除所有对象，可以使用 `clear()` 方法来实现（参见代码列表\
  \ 12.35）。\n\n\n\n\n\n```\nconst idbFactory = window.indexedDB;\nconst request =\
  \ idbFactory.open('TestDatabase', 9);\nrequest.onerror = (event) => {\n  const error\
  \ = event.target.error;\n  console.error(error.message);\n};\nrequest.onsuccess\
  \ = (event) => {\n  const database = event.target.result;\n  const transaction =\
  \ database.transaction(             // Open the transaction\n      'Books',\n  \
  \    'readwrite'                                       // Write access\n  );\n \
  \ const objectStore = transaction.objectStore('Books'); // Open the object store\n\
  \  const request = objectStore.clear();                  // Delete operation\n \
  \ request.onerror = (event) => {                        // Event handler for ...\n\
  \                                                        // ... Error case\n   \
  \ console.error(event.target.error.message);          // Output of the ...\n   \
  \                                                     // ... error message\n  };\n\
  \  request.onsuccess = (event) => {                      // Event handler for ...\n\
  \                                                        // ... Normal case.\n \
  \   console.log('Delete operation successful');\n  };\n}; \n```\n\n示例 12.35 从对象存储中删除所有对象\n\
  \n### 12.4.7 更新对象存储中的对象\n\n除了从对象存储中添加和删除对象外，你显然还需要方法来更新对象存储中的对象。原则上，一切又变得熟悉了，如 示例\
  \ 12.36 所示：打开数据库、在 `readwrite` 模式下创建事务、打开对象存储并使用 `get()` 方法读取相应的对象。然后，你对这种方式读取到的对象进行所需的更改，然后使用对象存储对象上的\
  \ `put()` 方法来更新对象存储中的对象。\n\n```\nconst idbFactory = window.indexedDB;\nconst request\
  \ = idbFactory.open('TestDatabase', 9);\nrequest.onerror = (event) => {\n  const\
  \ error = event.target.error;\n  console.error(error.message);\n};\nrequest.onsuccess\
  \ = (event) => {\n  const database = event.target.result;\n  const transaction =\
  \ database.transaction(             // Open the transaction\n    'Books',\n    'readwrite'\
  \                                         // Write access\n  );\n  const objectStore\
  \ = transaction.objectStore('Books'); // Open the object store\n  const request\
  \ = objectStore.get('978-1-4932-2286-5'); // Read the object\n  request.onerror\
  \ = (event) => {\n    console.error(event.target.error.message);\n  };\n  request.onsuccess\
  \ = (event) => {\n    const book = request.result;                         // Update\
  \ the object\n    book.title = ' JavaScript: The Comprehensive Guide by Philip Ackermann'\n\
  \    const requestUpdate = objectStore.put(book);         // Store the object\n\
  \    requestUpdate.onerror = (event) => {};\n    requestUpdate.onsuccess = (event)\
  \ => {};\n  };\n}; \n```\n\n示例 12.36 更新对象存储中的对象\n\n### 12.4.8 使用游标\n\n如果你想读取对象存储中的所有对象，可以使用游标，如\
  \ 示例 12.37 所示。在数据库的语境下，游标是一种遍历数据库中不同记录（即对象存储中的不同对象）的机制。`openCursor()` 方法用于创建一个用于创建游标的请求。在相应的\
  \ `success` 事件处理器中，你通过事件对象访问游标对象本身。这反过来提供了两个属性：`key` 属性包含相应条目的键，而 `value` 属性包含值本身——即该对象。`continue()`\
  \ 方法会导致游标移动到下一个条目（如果有的话），这反过来又会导致 `success` 事件处理器被再次执行，依此类推。\n\n```\nconst idbFactory\
  \ = window.indexedDB;\nconst request = idbFactory.open(\n  'TestDatabaseCursor',\n\
  \  1\n);\nconst books = [\n  {\n    'isbn': '978-1-4932-2286-5',\n    'title': 'JavaScript:\
  \ The Comprehensive Guide',\n    'author': 'Philip Ackermann'\n  },\n  {\n    'isbn':\
  \ '978-1-4932-2292-6',\n    'title': 'Node.js: The Comprehensive Guide',\n    'author':\
  \ 'Sebastian Springer'\n  }\n]\nrequest.onerror = (event) => {\n  const error =\
  \ event.target.error;\n  console.error(error.message);\n};\nrequest.onsuccess =\
  \ (event) => {\n  const database = event.target.result;\n  const transaction = database.transaction('Books');\n\
  \  const objectStore = transaction.objectStore('Books');\n  const request = objectStore.openCursor();\n\
  \  const books = [];\n  request.onsuccess = (event) => {\n    const cursor = event.target.result;\n\
  \    if (cursor) {\n      console.log(cursor.key);\n      console.log(cursor.value);\n\
  \      books.push(cursor.value);\n      cursor.continue();\n    } else {\n     \
  \ console.log(books);\n    }\n  };\n};\nrequest.onupgradeneeded = (event) => {\n\
  \  const database = event.target.result;\n  const objectStore = database.createObjectStore('Books',\
  \ { keyPath: 'isbn' });\n  books.forEach((book) => {\n    objectStore.add(book);\n\
  \  });\n} \n```\n\n示例 12.37 使用游标\n\n## 12.5 访问文件系统\n\n通过 File API，可以使用 JavaScript\
  \ 访问用户的本地文件，前提是用户之前已在相应的对话框中选择了这些文件。[www.w3.org/TR/FileAPI/](http://www.w3.org/TR/FileAPI/)\
  \ 规范定义了以下用于处理文件的接口：\n\n*   `File` 接口代表单个文件，并包含文件名或最后修改日期等信息。\n*   `FileList` 接口代表用户选择的\
  \ `File` 对象列表。\n*   `Blob` 接口代表二进制数据。\n*   `FileReader` 接口提供了读取 `File` 或 `Blob`\
  \ 类型对象的方法。\n\n原则上，选择文件有两种选项：我们之前讨论过的文件对话框，以及将文件拖放到 Web 页面特定区域以获取相应文件内容的可能性。让我们来看看这两个选项。\n\
  \n### 12.5.1 通过文件对话框选择文件\n\n为了能通过 File API 访问本地文件，用户必须先选择适当的文件（或）。这确保了任意文件不会在用户不知情的情况下通过\
  \ JavaScript 被读取。为用户提供文件选择的一种是通过 `<input>` 元素，将其 `type` 属性设置为值 `file`（参见 示例 12.38）。\n\
  \n```\n<input type=\"file\" id=\"files\" name=\"files[]\" multiple /> \n```\n\n\
  示例 12.38 在 HTML 中定义文件选择\n\n如果用户现在选择了一个或多个文件，`<input>` 元素的 `change` 事件将在后台触发。因此，为了能够响应文件选择，你只需要为该事件注册一个监听器，如\
  \ 示例 12.39 所示。\n\n\n\n\n```javascript\nfunction handleFileSelected(event) {\n  const\
  \ files = event.target.files;               // all selected files\n  let output\
  \ = '';                                // variable for result\n  for (let i = 0;\
  \ i < files.length; i++) {        // Iterate via all files ...\n    const file =\
  \ files[i];                        // ... View each file ...\n    output += '<li>'\
  \ +                            // ... and assemble ...\n                       \
  \                           // result HTML, \n                                 \
  \                 // consisting of:\n    '<strong>' + file.name + '</strong>' +\
  \        // file name\n    ' (' + (file.type || \"n/a\") + ') - ' +        // file\
  \ type\n    file.size + 'Bytes,' +                        // file size\n    ' changed\
  \ on: ' +                             // modification date\n    file.lastModifiedDate.toLocaleDateString()\
  \ + \n    '</li>';\n  }\n  document.getElementById('list').innerHTML = '<ul>' +\
  \ output + '</ul>';\n}\ndocument.getElementById('files').addEventListener(\n  'change',\
  \ \n  handleFileSelected, \n  false\n); \n```\n\n**列表 12.39** 通过文件对话框选择文件\n\n随后，可以通过触发事件的元素的\
  \ `files` 属性在事件监听器中访问选择的文件（`event.target.files`）。此列表包含了所有作为 `File` 对象存在的文件。这些 `File`\
  \ 对象尚未包含相应文件的内容，但它们包含了通用信息，例如文件名（`name` 属性）、文件类型（`type` 属性）、文件大小（`size` 属性）以及最后修改日期（`lastModifiedDate`\
  \ 属性）。在示例中，所有信息都显示在文件选择按钮下方（参见图 12.14）。\n\n![选择的文件显示在 HTML 列表中](img/img-f12.14.html)\n\
  \n**图 12.14** 选择的文件显示在 HTML 列表中\n\n### 12.5.2 通过拖放选择文件\n\n我们将在本章节的稍后部分讨论讨论拖放 API，但现在我们先向你展示如何使用拖放来选择文件。\n\
  \n列表 12.40 显示了相应的源代码。首先，你需要在相应的网页内定义一个区域作为拖放操作的目标（为了简单起见，以下称为“放置目标”）。在示例中，该区域是 ID\
  \ 为 `target` 的 `div` 元素。随后，在该元素上注册了两个事件监听器：`dragover` 事件的事件监听器（`handleDragOver()`）在文件被拖动到元素上（但尚未释放）时执行；而\
  \ `drop` 事件的事件监听器（`handleFileSelected()`）在文件随后被释放到元素上时执行。\n\n例如，在 `handleDragOver()`\
  \ 事件监听器中，可以部署合适的图标来向用户标记这是何种类型的拖放操作（如列表 12.39 中通过 `event.dataTransfer.dropEffect`\
  \ 所示）。文件的实际选择是在 `handleFileSelected()` 事件监听器中完成的，获取文件信息的方式与通过文件对话框选择时相同（参见列表 12.39）。\n\
  \n```javascript\nfunction handleFileSelected(event) {\n  event.stopPropagation();\n\
  \  event.preventDefault();\n\n  const files = event.dataTransfer.files;        \
  \  // all selected files\n  let output = '';                                 //\
  \ variable for event\n  for (let i = 0; i < files.length; i++) {         // Iterate\
  \ over all files ...\n    const file = files[i];                         // ...\
  \ view each file ...\n    output += '<li>' +                             // ...\
  \ and assemble ...\n                                                   // ... result\
  \ HTML, \n                                                   // consisting of:\n\
  \    '<strong>' + file.name + '</strong>' +         // file name\n    ' (' + (file.type\
  \ || \"n/a\") + ') - ' +         // file type\n    file.size + 'Bytes,' +      \
  \                   // file size\n    ' changed on: ' +                        \
  \      // Modification date\n    file.lastModifiedDate.toLocaleDateString() +\n\
  \    '</li>';\n  }\n  document.getElementById('list').innerHTML = '<ul>' + output\
  \ + '</ul>';\n}\n\nfunction handleDragOver(event) {\n  event.stopPropagation();\n\
  \  event.preventDefault();\n  event.dataTransfer.dropEffect = 'copy';\n}\n\nconst\
  \ dropTarget = document.getElementById('target');\ndropTarget.addEventListener('dragover',\
  \ handleDragOver, false);\ndropTarget.addEventListener('drop', handleFileSelected,\
  \ false); \n```\n\n**列表 12.40** 通过拖放选择文件\n\n![选择的文件再次显示在 HTML 列表中](img/img-f12.15.html)\n\
  \n**图 12.15** 选择的文件再次显示在 HTML 列表中\n\n### 12.5.3 读取文件\n\n到目前为止，我们只选择了文件，但还没有读取它们的内容。事实上，要读取文件内容，你必须先创建一个\
  \ `FileReader` 实例。该类型提供了多种读取文件的方法（参见表格 12.6）。这些包括：`readAsText()` 将文件作为字符串读取、`readBinaryString()`\
  \ 将文件作为二进制字符串读取、`readDataURL()` 将文件作为数据 URL 读取，以及 `readAsArrayBuffer()` 将文件作为数组缓冲区读取。\n\
  \n如果你调用了其中一个方法，在文件成功读取后（假设已定义了适当的事件处理器或注册了事件监听器），你将收到通知。如果触发了 `load` 事件，文件内容也可以通过\
  \ `result` 属性获取（同样位于相应的 `FileReader` 实例上）。\n\n| 方法 | 说明 |\n| | --- |\n| `readBinaryString()`\
  \ | 将数据作为二进制字符串读取。 |\n| `readAsText()` | 将数据作为文本读取。 |\n| `readDataURL()` | 将数据作为数据\
  \ URL 读取（参见方框）。 |\n| `readAsArrayBuffer()` | 将数据作为数组缓冲区读取。 |\n| `abort()` | 取消读取过程。\
  \ |\n\n**表格 12.6** FileReader 的不同方法\n\n除了 `load` 事件或相应的 `onload` 事件处理器外，还有其他几个事件处理器（或相应的事件），它们列在表格\
  \ 12.7 中。\n\n| 事件处理器 | 说明 |\n| | --- |\n| `onabort` | 当读取操作被中止时触发的 `abort` 事件的处理器\
  \ |\n| `onerror` | 当读取操作过程中发生错误时触发的 `error` 事件的处理器 |\n\n\n\n\n| `onload` | 读取操作成功完成时触发的\
  \ `load` 事件的处理器函数 |\n| `onloadstart` | 读取操作开始时触发的 `loadstart` 事件的处理器函数 |\n| `onloadend`\
  \ | 读取操作完成时触发的 `loadend` 事件的处理器函数 |\n| `onprogress` | 读取操作过程中触发的 `progress` 事件的处理器函数，用于提供进度信息\
  \ |\n\n**表 12.7** FileReader 的不同事件处理程序\n\n### Data URLs\n\nData URLs 是一种特殊的 URL\
  \ 方案（更准确地说，适用于 URI），用于在 HTML 代码中嵌入数据。Data URLs 以字符串 `data:` 开头，后跟 MIME 类型、编码信息以及相应的编码后的数据——例如，对于\
  \ Base64 编码的 PNG 图像，使用 `data:image/png;base64,jfdsfrRdF`。因此，通过数据 URL 的帮助，例如字符串形式的图像数据可以直接在\
  \ HTML 代码中使用，这反过来减少了网页的 HTTP 请求次数，因为浏览器不需要为图像发起第二次请求。\n\n### URL 与 URI 与 URN 的区别\n\
  \n此时，记住 URL（统一资源定位符）和 URI（统一资源标识符）之间的区别是有帮助的。这两个术语经常被（错误地）同义使用，但这并不完全准确。根据 RFC3986\
  \ (`http://tools.ietf.org/html/rfc3986#section-1.1.3`)，URL 连同 URN（统一资源名称）是 URI 的子集。或者反过来说，URI\
  \ 是 URL 和 URN 的超集。因此，以下结论适用：URL 和 URN 始终是 URI，但反过来则不然。\n\n但 URI、URL 和 URN 到底是什么呢？URI\
  \ 用于唯一标识资源。URL 是同时也包含有关如何定位资源的信息的 URI：例如，`http://javascripthandbuch.de` 就是一个 URL，因为它定义了可以通过\
  \ HTTP 协议定位资源。另一方面，`javascripthandbuch.de` 严格来说不是 URL 而是 URI，因为缺少了 `http://` 规范（浏览器通常知道通过自动插入相应的\
  \ `http://` 来处理这种情况，但一个有效的 URL 看起来仍然不同）。另一方面，URN 是一种基于历史的标识符，使用 `urn` 方案——例如 `urn:isbn:9783836223799`。\n\
  \n读取文件的示例位于列表 12.41 (#12_005.html_l12.41)对于对于用户选择的每个文件，都会检查文件类型以确定它是文本文件还是图像文件（不考虑其他情况）。对于文本文件，通过\
  \ `readAsText()` 读取内容并添加到 DOM 树中。对于图像文件，通过 `readAsDataURL()` 作为数据 URL 读取内容，并创建一个带有图像缩略图的\
  \ `<<img>>` 元素。\n\n```\nfunction handleFileSelected(event) {\n  const files = event.target.files;\n\
  \  for (let i = 0; i < files.length; i++) {\n    const file = files[i];\n    const\
  \ reader = new FileReader();\n    if(file.type.match('text.*')) {\n      reader.onload\
  \ = (event) => {\n        const span = document.createElement('span');\n       \
  \ span.innerHTML = reader.result;\n        document.getElementById('list').insertBefore(span,\
  \ null);\n      };\n      reader.readAsText(file);\n    } else if(file.type.match('image.*'))\
  \ {\n      reader.onload = (event) => {\n        const span = document.createElement('span');\n\
  \        span.innerHTML = `<img class=\"thumbnail\" src=\"${reader.result}\"/>`;\n\
  \        document.getElementById('list').insertBefore(span, null);\n      };\n \
  \     reader.readAsDataURL(file);\n    }\n  }\n}\ndocument\n  .getElementById('files')\n\
  \  .addEventListener('change', handleFileSelected, false); \n```\n\n**列表 12.41**\
  \ 读取文本和图像文件\n\n### 12.5.4 监控读取进度\n\n特别是当你想要通过 File API 读取大文件时，告知用户读取操作的进度是有帮助的。为了这个目的，正如你在上一节中看到的，File\
  \ API 或 `FileReader` 类型提供了 `onprogress` 事件处理程序。这里发送的对应事件对象是 `ProgressEvent` 类型（参见\
  \ `www.w3.org/TR/progress-events/`），它包含了 `loaded` 和 `total` 属性，这些属性分别包含相应文件的已加载字节数和完整总字节数。\n\
  \n可以使用这两个属性轻松地确定当前进度，如列表 12.42 (#12_005.html_l12.42) 所示。图 12.16 (#12_005.html_f12.16)\
  \ 显示应用程序的截图。作为一个示例，这里使用了一个几百 MB 的 ISO 文件，主要是为了有足够的时间创建截图。因此，代码使用了 `readAsBinaryString()`\
  \ 方法，因为 ISO 文件是二进制文件。\n\n### 其他事件处理程序\n\n在示例中，你还可以看到之前提到的其他事件处理程序：`onerror` 在发生错误时调用——例如，如果找不到或无法文件；`onabort`\
  \ 在文件读取被取消时调用（顺便提到是通过 `FileReader` 对象的 `abort()` 方法实现的）；以及 `onloadstart` 在文件读取开始时被调用。\n\
  \n```\nconst progress = document.querySelector('.percent');\nconst reader = new\
  \ FileReader();\nfunction updateProgress(event) {\n  if (event.lengthComputable)\
  \ {\n    const percentLoaded = Math.round((event.loaded / event.total) * 100);\n\
  \    if (percentLoaded < 100) {\n      progress.style.width = percentLoaded + '%';\n\
  \      progress.textContent = percentLoaded + '%';\n    }\n  }\n}\nfunction handleError(event)\
  \ {\n  switch (event.target.error.code) {\n    case event.target.error.NOT_FOUND_ERR:\n\
  \      console.error('File was not found');\n      break;\n    case event.target.error.NOT_READABLE_ERR:\n\
  \      console.error('File could not be read');\n      break;\n    case event.target.error.ABORT_ERR:\n\
  \      break;\n    default:\n      console.error('Unknown error');\n  }\n}\nfunction\
  \ handleFileSelected(event) {\n  progress.style.width = '0%';\n  progress.textContent\
  \ = '0%';\n  reader = new FileReader();\n  reader.onprogress = updateProgress;\n\
  \  reader.onerror = handleError;\n  reader.onabort = (event) => {\n    console.log('Reading\
  \ the file aborted');\n  };\n  reader.onloadstart = (event) => {\n    document.getElementById('progress-bar').className\
  \ = 'loading';\n  };\n  reader.onload = (event) => {\n    progress.style.width =\
  \ '100%';\n    progress.textContent = '100%';\n    setTimeout(() => {\n      document.getElementById('progress-bar').className\
  \ = '';\n    }, 2000);\n  };\n  reader.readAsBinaryString(event.target.files[0]);\n\
  }\n\ndocument\n  .getElementById('files')\n  .addEventListener('change', handleFileSelected,\
  \ false);\n\nfunction abortRead() {\n  reader.abort();\n}\ndocument\n  .getElementById('abort-file-reading')\n\
  \  .addEventListener('click', abortRead, false); \n```\n\n**列表 12.42** 监控读取进度\n\n\
  \n\n\n\n![通过进度条显示阅读进度](img/img-f12.16.html)\n\n**图 12.16**     通过进度条显示阅读进度\n\n##\
  \ 12.6 网页中的可移动组件\n\n“拖放”（drag and drop）术语指的是屏幕元素的“拖动”和“投放”——对于网页而言，这意味着对网页页面中的元素进行拖动和投放。要执行拖放操作，你需要点击想要移动的元素，按住鼠标键，将元素拖动到所需的位置，然后再次释放鼠标键将元素放置在目标位置。\n\
  \n### 12.6.1 拖放操作的事件\n\n在拖放操作期间会触发多个不同的事件，这些事件列在表 12.8 中。它们之间的相互关系在图 12.17 中所示。在拖放操作开始时，会触发`<samp\
  \ class=\"listingcharacter\">dragstart</span>` 事件，紧随后触发`<samp class=\"listingcharacter\"\
  >dragenter</span>` 事件，这两个事件都发生在待移动的元素（也称为拖放源）上。如果随后将该元素拖过网页的其他元素，会触发以下事件：当“进入”另一个元素时触发`<samp\
  \ class=\"listingcharacter\">dragenter</span>`；当被拖元素位于另一个元素上方时持续触发`<samp class=\"\
  listingcharacter\">dragover</span>`；以及当“离开”另一个元素时触发`<samp class=\"listingcharacter\"\
  >dragleave</span>`。当被拖元素在目标元素（投放目标）上释放时，这会触发该元素上的`<samp class=\"listingcharacter\"\
  >drop</span>` 事件以及被拖元素上的`<samp class=\"listingcharacter\">dragend</span>` 事件。\n\n\
  | 事件 | 描述 |\n| --- | --- |\n| `dragstart` | 当元素开始被拖动时触发 |\n| `drag` | 当元素被拖动期间持续触发\
  \ |\n| `dragend` | 当被拖元素被释放时触发 |\n| `dragenter` | 当元素在拖拽过程中“进入”某个元素时触发 |\n| `dragover`\
  \ | 如果在拖拽时位于该元素内部，则对该元素持续触发 |\n| `dragleave` | 如果元素在拖拽过程中“离开”某个元素时触发 |\n| `drop`\
  \ | 当被拖元素在某元素上释放时，对该元素触发 |\n\n**表 12.8**     拖放的各种事件\n\n![拖放中不同事件的概述](img/img-f12.17.html)\n\
  \n**图 12.17**     拖放中不同事件的概述\n\n### 12.6.2 定义可移动元素\n\n要定义网页内一个可以移动的元素（拖放源），你只需要定义相应元素的`<samp\
  \ class=\"listingcharacter\">draggable</span>` 属性（可以不带值，或将值设置为`<samp class=\"listingcharacter\"\
  >true</span>`）。从原则上讲，你可以将网页上的任何元素标记为`<samp class=\"listingcharacter\">draggable</span>`——例如图像、链接或任何其他\
  \ DOM 元素。\n\n代码 12.43 和图 12.18 展示了此类示例：ID 为 `contacts` 的`<samp class=\"listingcharacter\"\
  >div</div>` 元素的子元素（左图）都被标记为`<samp class=\"listingcharacter\">draggable</span>`，因此是可移动的。稍后我们将向你展示如何将这些元素移动到\
  \ ID 为 `target` 的`<samp class=\"listingcharacter\">div</div>` 元素中（右图）。\n\n```\n\
  <div id=\"contacts\">\n  <div class=\"contact\" draggable=\"true\">\n    <img class=\"\
  contact-image\" src=\"img/profile.jpeg\" draggable=\"false\">\n    <div class=\"\
  contact-details\">\n      <div>Name: Philip Ackermann</div>\n      <div>Twitter:\
  \ \n        <a href=\"https://twitter.com/cleancoderocker\">@cleancoderocker</a>\n\
  \      </div>\n      <div>Email: \n        <a href=\"mailto:info@philipackermann.de\"\
  >info@philipackermann.de</a>\n      </div>\n    </div>\n  </div>\n  <div class=\"\
  contact\" draggable=\"true\">\n    <img class=\"contact-image\" src=\"img/profile.jpeg\"\
  \ draggable=\"false\">\n    <div class=\"contact-details\">\n      <div>Name: Philip\
