  \n## 前言\n\nJavaScript 作为 Web 的通用语言，近年来变得越来越流行，现在已广泛应用于许多不同领域。无论是 Web、移动还是服务器端应用开发：JavaScript\
  \ 在所有领域都表现出色。\n\n本书对这种重要的语言提供了全面的见解，它已成为 Web 开发者不可或缺的工具。如果你以前从未编写过程序，不要担心——你也将获得编程基础介绍。\n\
  \n尽管 JavaScript 乍看起来非常简单，而且长期以来被认为是一种简单的脚本语言，但事实并非完全如此。JavaScript 背后的规范称为 `ECMAScript`\
  \ 标准，包含了一千页。我们在书中讨论的各种应用程序接口（`APIs`）的规范总和更为广泛。你甚至可以为 JavaScript 的 `jQuery` 库和 `Node.js`\
  \ 平台写整本书。简而言之：在单书中详细讨论所有这些主题是不可能的，也不是我的目标。\n\n标题中的“全面”（Comprehensive）一词并非指无所不，而是指详尽、广泛和多才。我将向你展示\
  \ JavaScript 的基础知识；如何使用 JavaScript 构建 Web、服务器端和移动应用；如何使用 JavaScript 控制微控制器；以及更多内容。对我来说，演示最核心、实用的方面（即你在日常\
  \ JavaScript 开发中需要的方面）比以无无不包的方式讨论每一个细微细节更为重要。\n\n### 目标读者\n\n本书面向不同的读者群体：一方面，是那些完全没有编程经验（无论是\
  \ JavaScript 还是任何其他编程语言）的读者。这些读者可以期待在书中获得编程概念和范式的背景知识，外还有对 JavaScript 的介绍。无论个人背景知识如何，本书都对语言本身以及最重要的\
  \ `APIs` 和应用领域提供了全面的介绍。另一方面，本书也面向已经熟悉 JavaScript 且现在想要加深经验，或只是想手头有一本可靠、全面的参考书的读者。\n\
  \n在任何情况下，为了理解 JavaScript 手册，如果你具备一些 `HTML` 知识和至少一些 `CSS` 知识将是优势。毕竟，这两种语言加上 JavaScript\
  \ 构成了现代 Web 开发的核心是有原因的。\n\n\n\n\n\n# 书籍结构\n\n本书大致可以分为四个部分：在前四章中，你将学习编程基础以及 JavaScript\
  \ 语言的核心——即该语言的基础组件。第 5 章到第 12 章将侧重于 JavaScript 在 Web 开发中的应用：如何创建动态内容、如何使用 JavaScript\
  \ 从服务器获取内容、如何使用 JavaScript 动态创建图形等。第 13 章到第 21 章将涉及更高级的概念，例如面向对象和函数式编程、Node.js 平台、移动和桌面应用开发以及\
  \ JavaScript 在物联网（IoT）中的应用。\n\n## 我应该如何阅读这本书？\n\n问题的答案取决于你的知识水平，包括通用编程水平特别是 JavaScript\
  \ 语言水平。如果你认为自己是初学者，那么最好从头到尾阅读这本书，尤其是前两部分——即第 1 章到第 12 章。这可以确保你不会遗漏理解后续章节所需的任何基本方面。\n\
  \n高级读者也可以根据自己的知识水平跳过单独章节。在代码示例中，我们特意保持了示例的自包含性，没有让它们跨越多个章节。这允许你选择单个主题，而无需一次性阅读多个章节。无论何情况下，你都可以将本书作为参考资料：得益于全面的参考章节、（希望）意义的标题以及详尽的索引，可以快速找到相关信息。\n\
