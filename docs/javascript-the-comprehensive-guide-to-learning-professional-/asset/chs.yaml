  \ `<tfoot` 元素。\n\n```\nconst table = document.querySelector('table');\nconsole.log(Object.getPrototypeOf(table));\
  \  // HTMLTableElement\nconsole.log(table.caption);                 // null\nconsole.log(table.tHead);\
  \                   // thead\nconsole.log(table.tBodies);                 // [tbody]\n\
  console.log(table.rows);                    // [tr, tr, tr, tr, tr, tr]\nconsole.log(table.tFoot);\
  \                   // null \n```\n\n**代码 5.32** 每个 HTML 元素由其自己的对象类型表示\n\n除了独立属性，不同的对象类型还有不同的方法：例如，代码\
  \ 5.33 所示的 `HTMLTableElement` 类型包含 `insertRow()` 方法（等其他），它可以直接创建一个新行（而无需通过 `document.createElement()`\
  \ 手动创建相应的 HTML 元素）。该方法返回一个 `HTMLTableRowElement` 类型的对象，该对象又包含 `insertCell()` 方法（等其他），可以直接向相应的行添加新的表格单元格。在示例中，通过这种方式创建了一个带有三个单元格的新表格行。这比代码\
  \ 5.29 中的示例清晰得多。\n\n```\nconst newRow = table.insertRow();\nconst newCell = newRow.insertCell(0);\n\
  newCell.textContent = 'Bob';\nnewRow.insertCell(1).textContent = 'Doe';\nnewRow.insertCell(2).textContent\
  \ = 'bob.doe@javascript.com'; \n```\n\n**代码 5.33** 不同的对象类型也有各自独立的方法\n\n### 属性名与元素名\n\
  \n注意，`tHead`、`tBodies` 和 `tFoot` 等对象属性采用驼峰法（CamelCase），而相应的 HTML 元素则使用小写（`<thead>`、`<tbody>`、`<tfoot>`）。\n\
  \n## 5.5 操作属性\n\nDOM API 提供了几种处理属性的方法：\n\n* 你可以使用 `getAttribute()` 方法访问元素的属性（第 5.5.1\
  \ 节）。\n* 你可以使用 `setAttribute()` 方法更改属性的值或为元素添加属性（第 5.5.2 节）。\n* 你可以通过 `createAttribute()`\
  \ 方法创建属性节点，并使用 `setAttributeNode()` 添加它们（第 5.5.3 节）。\n* 你可以使用 `removeAttribute()`\
  \ 方法移除属性（第 5.5.4 节）。\n\n### 5.5.1 读取属性值\n\n要访问属性的值，请在相应的元素上使用 `getAttribute()` 方法。该方法期望参数为相应的\
  \ HTML 属性名称。然后它返回对应属性的值。使用代码 5.34 中的 HTML 代码作为起点：它显示了一个带有 `id`、`class` 和 `href`\
  \ 属性的链接（`<a>` 元素）。\n\n```html\n<a id=\"home\" class=\"link\" href=\"index.html\"\
  >Home</a>\n```\n\n```javascript\nconst element = document.getElementById('home');\n\
  console.log(element.getAttribute('id'));    // home\nconsole.log(element.getAttribute('class'));\
  \ // link\nconsole.log(element.getAttribute('href'));  // index.html\n```\n\n\n\n\
  \n\n元素的属性通常也可以作为同名的属性可用——尽管 `class` 属性是一个例外：该属性可以通过 `className` 属性进行访问。列表 5.36 显示了一个相应的示例：`id`\
  \ 和 `href` 属性可以使用同名属性进行读取，而 `class` 属性则通过 `className` 属性访问。\n\n```\nconsole.log(element.id);\
  \        // home\nconsole.log(element.className); // link\nconsole.log(element.href);\
  \      // index.html \n```\n\n**列表 5.36** 元素的属性也可以作为属性可用\n\n然而，你应该注意以下几点：对于两个属性，通过\
  \ `getAttribute()` 方法访问返回的返回值与直接通过属性访问的返回值不同。对于 `style` 属性，`getAttribute()` 方法仅返回属性值中所包含的文本。另一方面，对\
  \ `style` 属性的访问会返回一个 `CSSStyleDeclaration` 类型的对象，可以用于详细访问相应的 CSS 信息。此外，所有可用于定义事件处理程序的属性（另见第\
  \ 6 章` 方法访问相应的属性，则将要执行的函数名称作为文本返回。\n\n查看列表 5.37 和列表 5.38。前者显示了一个具有各种属性的 HTML 按钮，包括\
  \ `style` 属性和 `onclick` 属性。在后者，你可以看到如何分别通过同名属性和 `getAttribute()` 方法访问这二者。\n\n```\n\
  <button id=\"create\" class=\"link\" style=\"background-color: green\" \nonclick=\"\
  createContact()\">Create contact</button> \n```\n\n**列表 5.37** 一个 HTML 按钮\n\n```\n\
  const button = document.getElementById('create');\nconsole.log(button.onclick);\
  \                        // Output of the \n                                   \
  \                 // function object\nconsole.log(typeof button.onclick);      \
  \           // Output: function\nconsole.log(button.getAttribute('onclick'));  \
  \      // createContact()\nconsole.log(typeof button.getAttribute('onclick')); //\
  \ Output: string\nconsole.log(button.style);                          // Output\
  \ of \n                                                    // CSSStyleDeclaration\n\
  console.log(typeof button.style);                   // Output: object\nconsole.log(button.getAttribute('style'));\
  \          // background-color: green\nconsole.log(typeof button.getAttribute('style'));\
  \   // Output: string \n```\n\n**列表 5.38** 访问事件处理程序和 style 属性根据访问类型的不同返回不同的返回值\n\
  \n直接访问 `onclick` 等事件处理程序属性不返回字符串而是返回函数的原因是该属性允许你为相应元素定义事件处理程序。也就是说，你可以将函数对象赋值给此属性。\n\
  \n直接访问 `style` 属性不返回字符串的原因是该属性可以用于编程地访问相应元素的 CSS 信息，即使具有写权限（正如你在本章中看到的）。\n\n###\
  \ 5.5.2 修改属性值或添加新属性\n\n要更改属性值或添加新属性，请对要更改属性的元素使用 `setAttribute()` 方法。该方法期望两个参数：属性名和新值。如果相应元素已经具有同名的属性，则该属性的值将被新值覆盖。如果该属性尚不存在，则会在元素上新添加相应的属性。示例在列表\
  \ 5.39 所示。该列表更改了之前选中的链接元素的 `class`、`href` 和 `target` 属性。\n\n```\nconst element =\
  \ document.getElementById('home');\nelement.setAttribute('class', 'link active');\n\
  element.setAttribute('href', 'newlink.html');\nelement.setAttribute('target', '_blank');\n\
  console.log(element.getAttribute('class'));   // link active\nconsole.log(element.getAttribute('href'));\
  \    // newlink.html\nconsole.log(element.getAttribute('target'));  // _blank \n\
  ```\n\n**列表 5.39** 你可以使用 setAttribute 方法更改 HTML 元素的现有属性或添加新属性\n\n或者，你也可以通过（通常是）同名的对象更改属性值或添加新属性（参见列表\
  \ 5.40）。\n\n```\nelement.className = 'link active';\nelement.href = 'newlink.html';\n\
  element.target = '_self';\nconsole.log(element.getAttribute('class'));   // link\
  \ active\nconsole.log(element.getAttribute('href'));    // newlink.html\nconsole.log(element.getAttribute('target'));\
  \  // _self \n```\n\n**列表 5.40** 属性也可以直接通过属性更改\n\n#### 注意\n\n在后台，当使用 `setAttribute()`\
  \ 方法时，会创建一个属性节点并将其作为子节点添加到相应元素的 DOM 树中。\n\n### 5.5.3 创建并添加属性节点\n\n与普通文本和处理元素一样，你也可以使用特殊方法\
  \ `createAttribute()` 创建属性节点。该方法期望要创建的属性名称作为参数。它随后返回新的属性节点。与之前提到的文本节点和元素节点一样，该节点也没有直接构建到\
  \ DOM 树中。你必须使用相应元素的 `setAttributeNode()` 方法手动进行操作（参见列表 5.41）。\n\n```\nconst element\
  \ = document.getElementById('home');\nconst attribute = document.createAttribute('target');\n\
  attribute.value = '_blank';\nelement.setAttributeNode(attribute);\nconsole.log(element.getAttribute('target'));\
  \  // _blank \n```\n\n**列表 5.41** 创建并添加属性节点\n\n### 5.5.4 属性\n\n你可以使用 `removeAttribute()`\
  \ 方法从元素中移除属性。在列表 5.42 中，这用于从链接元素移除 `class` 和 `href` 两个属性。随后，这两个属性将返回值 `null`。\n\n\
  ```\nconst element = document.getElementById('home');\nelement.removeAttribute('class');\n\
  element.removeAttribute('href');\nconsole.log(element.getAttribute('class'));  \
  \ // null\nconsole.log(element.getAttribute('href'));    // null \n```\n\n**列表 5.42**\
  \ 你可以使用 removeAttribute 方法从 HTML 元素移除属性\n\n### 5.5.5 访问 CSS 类\n\n\n\n\n虽然你已经在本章的一些示例中（至少是部分）见过它了，但我们将再次简要解释如何读取元素的\
  \ CSS 类。\n\n首先是熟悉的 `className` 属性，它在 Web 上的每个元素（即每个元素节点）上可用。该属性简单地包含对应元素的 `class`\
  \ 属性值，且格式为字符串。如果该元素有多个 CSS 类，这些类名在字符串内部用空格隔开。\n\n在过去，这有时会导致代码变得很繁琐，例如当你想向一个元素添加新的\
  \ CSS 类，或者（更糟糕的是）移除现有的 CSS 类。为什么很繁琐呢？因为在每种情况下，你都必须解析属性的值。\n\n这在 DOM API 的第 4 版本中得到了考虑。从那时起，元素（在\
  \ DOM API 中，而不是 HTML 中）拥有了额外的 `classList` 属性，它以列表的形式包含 CSS 类。从那时起，向元素添加或移除单个 CSS\
  \ 类变得简单得多了：\n\n*   可以使用 `add()` 方法向列表添加新的 CSS 类。\n*   可以使用 `remove()` 方法允许你从列表中移除\
  \ CSS 类。\n*   通过 `toggle()` 方法可以切换 CSS 类的。也就是说，如果 CSS 类存在列表中，则将其删除；如果不存在，则将其添加。该方法甚至可以与布尔条件绑定。\n\
  *   此外，可以使用 `contains()` 方法检查列表中是否包含某个 CSS 类。\n\nListing 5.43 显示了这些方法的某些示例。\n\n\
  ```\nconst element = document.getElementById('home');\nconsole.log(element.classList);\
  \                     // [\"link\"]\nelement.classList.add('active');          \
  \          // Add class\nconsole.log(element.classList);                     //\
  \ [\"link\", \"active\"]\nelement.classList.remove('active');                 //\
  \ Remove class\nconsole.log(element.classList);                     // [\"link\"\
  ]\nelement.classList.toggle('active');                 // Toggle class\nconsole.log(element.classList);\
  \                     // [\"link\", \"active\"]\nelement.classList.toggle('active');\
  \                 // Toggle class\nconsole.log(element.classList);             \
  \        // [\"link\"]\nconsole.log(element.classList.contains('link'));    // true\n\
  console.log(element.classList.contains('active'));  // false\nconst i = 5;\nconst\
  \ condition = i > 0;\nelement.classList.toggle('active', condition);      // Toggle\
  \ class\nconsole.log(element.classList);                     // [\"link\", \"active\"\
  ] \n```\n\n**Listing 5.43** 元素的 classList 属性使得处理 CSS 类变得非常\n\n## 5.6 总结\n\n在本章中，你学习了如何使用\
  \ JavaScript 访问并动态修改 页面内容。让我们总结一下要点：\n\n*   文档对象模型（DOM）代表了 Web 页面的模型，是一种层次树形结构。\n\
  *   该树形结构中的单个组件被称为节点，有不同类型的节点。最重要的包括文档节点、元素节点、文本节点和属性节点。此外，元素节点由不同类型表示，从 `HTMLElement`\
  \ 类型开始。\n*   DOM API 定义了属性和方法，允许你访问或修改 页面上的数据。\n*   例如，你可以使用 DOM API 添加元素、删除元素、修改文本以及添加或删除属性。\n\
  *   Web 上的元素可以通过多种方式选择：通过 ID、通过 CSS 类、元素名称、`name` 属性以及 CSS 选择器。\n*   从元素或节点开始，可以通过各种属性选择父元素/父节点、子元素/子节点以及兄弟元素/兄弟节点。\n\
  *   `textContent` 属性可以用于访问或设置节点的文本内容，而 `innerHTML` 属性可以用于访问元素的 HTML 内容。\n*   你可以通过\
  \ `createTextNode()` 创建文本节点，通过 `createElement()` 创建元素节点，通过 `createAttribute()` 创建属性节点。\n\
  *   在创建节点后，你必须先使用不同的方法将其添加到 DOM 树中：`insertBefore()`、`appendChild()` 和 `replaceChild()`。\n\
  \n# 6 处理和触发事件\n\nJavaScript 编程中的一个重要概念是事件，因此也是事件驱动编程。在本章中，我们将向你展示事件背后的原理，以及你如何使用事件驱动编程来响应用户在（Web）应用程序内触发的事件。\n\
  \n当你访问 Web 页面并执行某些操作时，后台会触发各种事件。例如，当页面完全加载时；当用户在文本框输入文字、从选择框中选择选项或点击按钮时；或者元素进入或离开屏幕时。在你的\
  \ JavaScript 代码中，你有机会响应这些事件。\n\n## 6.1 事件驱动编程的概念\n\n事件驱动编程的概念并非 JavaScript 特有；它也被用于其他语言。基本上，它的工作原理如下（参见图\
  \ 6.1）：在一侧，你有所谓的事件触发器（也称为事件发射器）。在图形用户界面（UI）的情况下，例如这些可以是按钮、文本框或任何其他 UI 组件。一旦你点击按钮或在文本框中输入文字，相应的组件（按钮或文本框）就会在后台触发一个事件。事件被触发后，它会被放入事件队列中，这确保了先触发的事件也会先处理。事件循环持续检查事件队列中是否有新事件，如果有，则将相应的事件转发给事件处理器。\n\
  \n在 JavaScript 中，这些事件处理器是简单的函数，允许你（开发者对触发的事件做出响应。因此，你可以使用事件驱动编程来表达诸如“当点击此按钮时，调用这个或那个函数”的内容。\n\
  \n![事件与事件处理的原理](img/img-f6.1.html)\n\n**图 6.1** 事件与事件处理的原理\n\n然而，事件驱动编程的原理并不局限于与用户界面的交互。在\
  \ JavaScript 开发中，还有在没有用户与用户界面交互的情况下触发的事件——即不是由用户触发而是通过程序触发的事件。例如在第 17 章中，我们将介绍 Node.js，这是一个\
  \ JavaScript 的运行时环境，它也使用事件来控制后台的许多事情。在本章中，我们将首先使用 Web 页面（主要是 UI）作为示例，向你展示如何使用事件编程。\n\
  \n## 6.2 响应事件\n\n为了在 Web 页面内的用户交互触发函数，需要三个步骤：\n\n\n\n\n\n1. 选择网页上应该对用户交互响应的元素。例如，如果你希望在用户点击表格列标题时触发一个函数，你必须先选择相应的\
  \ `<th>` 元素。\n\n2. 指定要捕获的事件。正如你很快将看到的，有许多不同的事件。例如，可以捕获鼠标点击、按键击、鼠标移动等。这一步也称为为元素绑定事件。\n\
  \n3. 指定要调用的函数。最后但同样重要的一点是，你需要定义当所选元素上发生相应事件时要调用的函数。例如，点击时表格中的数据是否会进行排序？在文本框中输入的文本是否会进行验证？\n\
  \n## 隐式事件\n\n在 Web 开发中，还有一些事件事件可以在不需要先选择元素的情况下捕获。这些事件包括在网页完全加载时触发的事件，以及许多其他事件。\n\
  \n在上一章中，你详细学习了如何选择网页上的元素，因此步骤 1 对你来说应该是轻菜易举的。现在，让我们来看看如何捕获事件或将其绑定到元素上，以及如何定义在事件触发时执行的代码。事实上，这方面有三种可能性：\n\
  \n### HTML 事件处理器\n\nHTML 事件处理器提供了一种响应事件的可能性，但它们现在不再被使用了。这种选项依赖于特殊的 HTML 属性，用于定义为哪个事件调用哪个函数。不再使用\
  \ HTML 事件处理器的原因是这种选项需要将 HTML 代码和 JavaScript 代码混合，从维护性等方面来看，这被认为不是一个好的选择。尽管如此，在第\
  \ 6.2.1 节中我们将为你展示这种类型事件处理器的细节。你不应该自己使用 HTML 事件处理器，但可能会在旧的 Web 应用中遇到它们，届时你应该理解原理。\n\
  \n### DOM 事件处理器\n\n响应事件的第二种方法是通过所谓的 DOM 事件处理器。它们之所以命名是因为它们是 DOM 规范的一部分，并通过 JavaScript\
  \ 定义。与 HTML 事件处理器相比，它们的优势是 HTML 代码和 JavaScript 代码没有混合。换句话说，应用程序的逻辑（响应事件）与应用程序的结构（HTML）分离了。尽管如此，DOM\
  \ 事件处理器也有显著的缺点或局限性：它们允许你仅为一个事件指定一个要调用的函数。我们将在第 6.2.2 节中为你展示所有的细节。\n\n### DOM 事件监听器\n\
  \n最后但同样重要的是，还有第三种响应事件的方法：所谓的 DOM 事件监听器。它们在 2000 年作为 DOM 规范第二个版本的一部分（[www.w3.org/TR/DOM-Level-2-Events/Overview.html](http://www.w3.org/TR/DOM-Level-2-Events/Overview.html)）引入，从那时起一直是事件处理的标准以及响应事件的推荐方式。原因是：在事件处理器的情况下，一个事件只能注册一个事件处理器，而事件监听器允许你为同一个事件注册多个事件监听器。我们将在第\
  \ 6.2.3 节中展示如何定义事件监听器。\n\n## jQuery 辅助库\n\n此外，还有各种 JavaScript 库可以简化或统一事件处理。最著名的例子之一是\
  \ jQuery 库，我们将在第 10 章中详细介绍它。第 10 章 的一部分也将涉及事件处理。\n\n## 术语定义\n\n“事件处理器”和“事件监听器”这两个术语在文献中经常被同义使用。但在\
  \ JavaScript 的情况下（如前所述），这两个术语之间是有区分的。也就是说，定义为 HTML 事件处理器或 DOM 事件处理器的函数在后文中被称为“事件处理器”，而定义为事件监听器的函数将相应地被称为“事件监听器”。\n\
  \n事件发生时的基本顺序如图 6.2 所示。首先，会检查是否为该事件定义了事件处理器或事件监听器。\n\n![事件处理流程](img/img-f6.2.html)\n\
  \n**图 6.2** 事件处理流程\n\n如果是这种情况，则执行相应的代码。另一方面，如果没有定义事件处理器/事件监听器，则会触发浏览器与相应事件关联的默认操作。在事件处理器/事件监听器内部，你还可以禁用这些事件的这些默认浏览器操作。我们将在第\
  \ 6.4 节中展示如何做到这一点。\n\n### 6.2.1 通过 HTML 定义事件处理器\n\n让我们以一个简单的用例作为事件处理的示例：验证一个只接受正数的表单字段。首先，唯一需要检查的是没有指定负值。应该在用户离开离开相应字段时触发验证。\n\
  \n#### HTML 中的原生验证\n\n在几年前，表单字段的验证只能使用 JavaScript 实现。但 HTML 现在包含了某些检查表单字段的选项。然而，它还没有\
  \ JavaScript 灵活，因此仍然建议 Web 开发者知道如何使用 JavaScript 来检查用户输入数据的有效性。\n\n#### 客户端验证和服务端验证\n\
  \n另一点：在用户可以填写和提交表单的生产应用程序中，你不仅要在客户端验证输入的数据，还要在服务器端进行验证。本质上，客户端验证是为了用户友好性并提醒用户错误。然而，服务器端验证确保了所传输的数据没有被用户（恶意地）篡改。\n\
  \n现在让我们向你展示如何使用 HTML 事件处理器来实现这个用例。正如之前提到的，HTML 事件处理器是在 HTML 代码中通过 HTML 属性定义的。HTML\
  \ 属性总是带有 `on` 前缀的事件名称。对于示例，HTML 属性是 `blur`，因为当表单元素失去焦点时会触发 `blur` 事件。\n\n该属性的值是在事件触发时要调用的函数。总而言之，如果函数像示例中那样命名为\
  \ `checkAgeNotNegative`，可能会导致以下 HTML 属性：\n\n```\nonblur=\"checkAgeNotNegative()\"\
  \n```\n\n你可以在列表 6.1 中查看完整的 HTML 代码。ID 为 `age` 的输入字段用于输入年龄，ID 为 `output` 的 `div`\
  \ 元素作为验证消息的容器。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta\
  \ charset=\"UTF-8\">\n  <title>HTML event handler</title>\n  <link rel=\"stylesheet\"\
  \ href=\"styles/main.css\">\n  <script src=\"scripts/main.js\"></script>\n</head>\n\
  <body>\n  <div>\n    <label for=\"age\"></label>\n    <input id=\"age\" type=\"\
  number\" value=\"0\" onblur=\"checkAgeNotNegative()\"/>\n  </div>\n  <div id=\"\
  output\"></</div>\n</body>\n</html>\n```\n\n**列表 6.1** 退出输入字段时调用的 HTML 事件处理器定义\n\
  \n\n\n\n被调用的函数（即事件处理器）显示在 Listing 6.2 中。实际上，这里发生的所有事情你已经在上一章中了解了：首先，输入框和容器通过它们的\
  \ ID 被确定，并为它们各分配一个变量。然后读取并检查输入框的值。如果该值小于 `0`（因此无效），则向容器写入相应的错误消息。另一方面，如果该值等于 `0`\
  \ 或更大（因此有效），则清空容器的文本内容（即分配一个空字符串）。后者是为了确保在输入框中输入无效值后又输入有效值，可以清除任何错误消息。\n\n```\n\
  function checkAgeNotNegative() {\n  const output = document.getElementById('output');\
  \  // 消息容器\n  const element = document.getElementById('age');    // 年龄输入框\n  const\
  \ age = element.value;                         // 当前年龄值\n  if(age < 0) {       \
  \                               // 如果值为负数 ...\n    output.textContent = 'Age cannot\
  \ be negative.';  // ... 输出错误 ...\n                                            \
  \         // ... 消息...\n  } else {                                           //\
  \ ... 否则 ...\n    output.textContent = '';                         // ... 删除消息。\n\
  \  }\n} \n```\n**Listing 6.2** 作为事件处理器被调用的函数\n\n如果你不想在离开输入框时立即触发验证，而是只在点击按钮时触发，那么可以相对容易地调整代码，如\
  \ Listing 6.3 所示。在这里，文本框中移除了 `blur` 事件的事件处理器，并插入了一个额外的按钮，为该按钮定义了 `click` 事件的事件处理器（它在点击相应的按钮时触发）。\n\
  \n```\n<input id=\"age\" type=\"number\" value=\"0\"/>\n<input type=\"submit\" value=\"\
  Check\" onclick=\"checkAgeNotNegative()\"/> \n```\n**Listing 6.3** 点击按钮时被调用的事件处理器定义\n\
  \n尽管 HTML 事件处理器看起来起来相对简单，但它们现在被认为是过时的，因为它们混合了 HTML 代码和 JavaScript 代码，这在大型应用程序中可能会变得混乱。相反，你最好使用\
  \ DOM 事件处理器（我们将在下一节中向你展示），或者（更好）使用事件监听器，我们将在 Section 6.2.3 中介绍。\n\n### 6.2.2 通过\
  \ JavaScript 定义事件处理器\n\nDOM 事件处理器解决了 HTML 和 JavaScript 代码混合的问题。如 Listing 6.4 所示，HTML\
  \ 代码保持不包含 JavaScript 调用。哪个元素在哪个事件时调用哪个函数，是在 JavaScript 代码中定义的。\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>HTML handler</title>\n\
  \  <link rel=\"stylesheet\" href=\"styles.css\">\n  <script src=\"main.js\"></script>\n\
  </head>\n<body>\n <div>\n    <label for=\"age\"></label>\n    <input id=\"age\"\
  \ type=\"number\" value=\"0\"/>\n  </div>\n  <div id=\"output\"></</div>>\n</body>\n\
  </html>\n```\n**Listing 6.4** 当使用 DOM 处理器时，HTML 保持不包含 JavaScript 代码\n\n其工作原理在 Listing\
  \ 6.5 所示。首先，要定义事件处理器的输入框再次基于 ID 的。对于该对象的 `onblur` 属性，你定义了要调用的函数名称。注意，与事件处理器不同，这里没有函数调用，而只是函数的名称（即没有括号对）。如果你写的是\
  \ `element.onblur = checkAgeNotNegative()` 而不是 `element.onblur = checkAgeNotNegative`，那么\
  \ `checkAgeNotNegative()` 函数调用的返回值将被定义为事件处理器。在这种情况下，这不是我们想要的。\n\n```javascript\n\
  function init() {\n  const element = document.getElementById('age'); // (1) 获取元素\n\
  \  element.onblur =                                // (2) 定义事件\n    checkAgeNotNegative;\
  \                          // (3) 定义事件处理器\n}\n\nwindow.onload = init; \n```\n**Listing\
  \ 6.5** DOM 事件处理器的定义\n\n#### 用于加载网页的事件监听器\n\n在 Listing 6.5 中，你还可以看到，`window` 对象的\
  \ `onload` 属性定义了一个在网页加载时被调用的事件处理器。如果没有这个事件处理器，`init()` 函数将不会被调用，因此表单元素上不会注册任何事件处理器。\n\
  \nDOM 事件处理器有一个小缺点，如前面所述：每个元素上的每个事件只能定义一个事件处理器。例如，如果你想扩展之前的验证，不仅调用一个检查输入值是否为负数的函数，还调用另一个检查输入值是否为数字的函数（我们称其为\
  \ `checkAgeIsNumber()`），那么将是不可能的，如 Listing 6.6 所示。该列表首先将 `checkAgeNotNegative` 函数定义为\
  \ `onblur` 属性的事件处理器，然后定义了 `checkAgeIsNumber` 函数。然而，后者仅仅确保了 `onblur` 属性被重置并覆盖了 `checkAgeNotNegative`\
  \ 的值。结果是调用了 `checkAgeIsNumber` 函数，而没有调用 `checkAgeIsNotNegative` 函数。\n\n```javascript\n\
  function init() {\n  const element = document.getElementById('age');\n  element.onblur\
  \ = checkAgeNotNegative;\n  element.onblur = checkAgeIsNumber;  // 在这里，事件处理器被覆盖了。\n\
  }\n\nwindow.onload = init; \n```\n**Listing 6.6** 每个事件只能定义一个事件处理器\n\n这个问题可以使用匿名函数来解决——至少对于这个例子而言。如\
  \ Listing 6.7 所示，`checkAgeNotNegative` 和 `checkAgeIsNumber` 函数可以简单地封装在一个匿名函数中，然后将其定义为事件处理器。\n\
  \n```javascript\nfunction init() {\n  const element = document.getElementById('age');\n\
  \  element.onblur = function() {            // 匿名函数 ...\n    checkAgeNotNegative();\
  \                 // ... 在其中，此函数和...\n    checkAgeIsNumber();                  \
  \  // ... 以及这个函数 ...\n                                           // ... 被调用\n  };\n\
  }\n\nwindow.onload = init; \n```\n**Listing 6.7** 匿名函数可以部分规避所述问题，但灵活性较低\n\n\n\n\n\
  \n上一节提到的事件处理程序的缺点并不适用于事件监听器（event listeners）或相关的 `addEventListener()` 方法（该方法通过 DOM\
  \ API 适用于 页面上的所有元素）。作为参数，它期望接收响应的事件名称以及事件监听器——即在事件发生时要调用的函数。可选地可以指定第三个参数来影响事件流（详细信息将在第\
  \ 6.4 节中介绍）。\n\nListing 6.8 显示了一个示例，其功能与前几节的代码相同：当在离开输入年龄的相应表单字段时，它调用 `checkAgeNotNegative()`\
  \ 函数。第一个参数是 `blur` 值（不带 `on`；不要使用 `onblur`）；第二个参数是函数名 `checkAgeNotNegative()`。\n\
  \n```javascript\nfunction init() {\n  const element = document.getElementById('age');\
  \    // Get element\n  element.addEventListener(           // Register event listener\n\
  \    'blur',                           // Name of the event\n    checkAgeNotNegative,\
  \              // Name of the event listener\n    false                        \
  \     // Event flow, details to follow later on\n  );\n}\ndocument.addEventListener('DOMContentLoaded',\
  \ init); \n```\n\n**Listing 6.8** 事件监听器的定义\n\n### 用于加载文档内容的事件监听器\n\n虽然我们在书中之前已经提到过它（例如在第\
  \ 3 章 中），但现在再次简要提到一下 `DOMContentLoaded` 事件。每当网页的整个 DOM 树加载完成后，它就会被触发，非常适合在网页上执行初始代码，例如注册事件监听器（或事件处理程序）。在书中的代码示例中，特别是书籍的下载区域，我们大多数情况下使用此事件来执行网页内部的代码。一个简单的示例在\
  \ Listing 6.9 中所示。\n\n```javascript\nfunction init() {\n  console.log('Document\
  \ loaded');\n}\n\ndocument.addEventListener('DOMContentLoaded', init);\n```\n\n\
  **Listing 6.9** 网页加载时执行的事件监听器的定义\n\n如果你想为 `load` 事件定义一个事件监听器（类似于 `window.onload`），请按照\
  \ Listing 6.10 所示的方法进行。`DOMContentLoaded` 事件与 `load` 事件的区别在于，前者在完整的网页文档（即 DOM 树）加载时触发，而后者在完整的网页文档加上所有外部资源（如\
  \ JavaScript 文件、CSS 文件等）都加载完成后才会触发。顺便提一下：`window` 对象没有类似的属性可以用于定义 `DOMContentLoaded`\
  \ 事件的事件处理程序。该事件只能通过事件监听器来捕获。\n\n```javascript\nfunction init() {\n  console.log('Document\
  \ and all resources loaded');\n}\n\ndocument.addEventListener('load', init);\n```\n\
  \n**Listing 6.10** 网页加载（包括所有资源）后执行的事件监听器的定义\n\n### attachEvent() 方法\n\n旧版本的 Internet\
  \ Explorer 不支持 `addEventListener()` 方法。因此，如果你在其他人的代码中遇到 `attachEvent()` 方法，请不要惊讶：这是\
  \ Internet Explorer 的一个私有方法，但它不属于任何标准的一部分，因此通常不应该使用。只有为了确保与旧版本 Internet Explorer\
  \ 的向后兼容，jQuery 等库在某些情况下内部才会使用这种非标准方法（另参见第 6.2.7 节）。\n\n### 6.2.4 定义多个事件监听器\n\n使用\
  \ `addEventListener()` 方法，现在也非常容易为同一个事件注册多个函数（而对于事件处理程序，这只能通过使用新的、通常是匿名函数的迂回方法来实现）。\n\
  \nListing 6.11 显示了一个示例，其中甚至三个不同的函数被注册为相应表单字段上 `blur` 事件的事件监听器：`clearMessage()` 函数确保消息被清除，`checkAgeNotNegative()`\
  \ 函数检查年龄是否为负，而 `checkAgeIsNumber()` 则确保输入的值是数字。\n\n```javascript\nfunction checkAgeNotNegative()\
  \ {\n  const element = document.getElementById('age');    // Input field\n  const\
  \ age = element.value;                         // Current value\n  if(age < 0) {\
  \                                      // If value is negative\n    showMessage('Age\
  \ cannot be negative.');          // output warning.\n  }\n}\n\nfunction checkAgeIsNumber()\
  \ {\n  const element = document.getElementById('age');    // Input field\n  const\
  \ age = element.value;                         // Current value\n  if(!isNaN(parseFloat(age))\
  \ && isFinite(age)) {  // If value is not\n                                    \
  \               // a number\n    showMessage('Age must be a number.');         \
  \   // output message.\n  }\n}\n\nfunction clearMessage() {\n  showMessage('');\n\
  }\n\nfunction showMessage(message) {\n  const output = document.getElementById('output');\n\
  \  output.textContent = message;\n}\n\nfunction init() {\n  const element = document.getElementById('age');\
  \ // Get element\n  element.addEventListener(           // Register event listener\n\
  \    'blur',                           // Name of the event\n    clearMessage, \
  \                    // Name of the event listener\n    false                  \
  \           // Event flow, details to follow later on\n  );\n  element.addEventListener(\
  \           // Register event listener\n    'blur',                           //\
  \ Name of the event\n    checkAgeNotNegative,              // Name of the event\
  \ listener\n    false                             // Event flow, details to follow\
  \ later on\n  );\n  element.addEventListener(           // Register event listener\n\
  \    'blur',                           // Name of the event\n    checkAgeIsNumber,\
  \                 // Name of the event listener\n    false                     \
  \        // Event flow, details to follow later on\n  );\n}\ndocument.addEventListener(\"\
  DOMContentLoaded\", init); \n```\n\n**Listing 6.11** 多个事件监听器的定义\n\n#### 注意\n\n事件监听器或\
  \ `addEventListener()` 方法的使用比事件处理程序灵活得多，因为你不仅可以指定单个函数，还可以指定任意数量的函数。\n\n### 6.2.5\
  \ 向事件监听器传递参数\n\n有时，你可能想向注册为事件监听器的函数传递参数。然而，这无法直接实现，因为你向 `addEventListener()` 方法传递的是函数本身。解决方案再次是使用匿名函数，如\
  \ Listing 6.12 所示。\n\n`checkAgeNotNegative()` 和 `checkAgeIsNumber()` 函数现在不再访问年龄的表单字段，而是期望一个数值作为参数进行检查。这使得这两个函数的可重用性显著提高，因为它们不再直接访问\
  \ DOM 树，理论上也可以在不同的语境中使用。\n\n\n\n\n\n此外，访问 DOM 树或表单字段的代码已经移动到新的 `getAgeValue()` 函数中。在事件监听器（两种情况下都是匿名函数）中，`getAgeValue()`\
  \ 返回的值会被传递给两个检查方法。\n\n```\nfunction checkAgeNotNegative(age) {\n  if(age < 0) {\n\
  \    showMessage('Age cannot be negative.');\n  }\n}\n\nfunction checkAgeIsNumber(age)\
  \ {\n  if(!(!isNaN(parseFloat(age)) && isFinite(age))) {\n    showMessage('Age must\
  \ be a number.');\n  }\n}\n\nfunction clearMessage() {\n  showMessage('');\n}\n\n\
  function showMessage(message) {\n  const output = document.getElementById('output');\n\
  \  output.textContent = message;\n}\n\nfunction getAgeValue() {\n  const element\
  \ = document.getElementById('age');\n  const age = element.value;\n  return age;\n\
  }\n\nfunction init() {\n  const element = document.getElementById('age');\n  element.addEventListener(\n\
  \    'blur',\n    clearMessage\n  );\n  element.addEventListener(\n    'blur',\n\
  \    function() {                      // anonymous function\n      const age =\
  \ getAgeValue();      // get value for age\n      checkAgeNotNegative(age);    \
  \   // call the actual function\n    }\n  );\n  element.addEventListener(\n    'blur',\n\
  \    function() {                      // anonymous function\n      const age =\
  \ getAgeValue();      // get value for age\n      checkAgeIsNumber(age);       \
  \   // call the actual function\n    }\n  );\n}\ndocument.addEventListener(\"DOMContentLoaded\"\
  , init); \n```\n\n**Listing 6.12** 向事件监听器传递参数\n\n### 作为箭头函数的事件监听器\n\n同样没有理由不将事件监听器定义为箭头函数。因此，前面的示例可以重写为如\
  \ Listing 6.13 所示。\n\n```\nelement.addEventListener(\n  'blur',\n  () => {     \
  \                      // anonymous arrow function\n    const age = getAgeValue();\
  \      // get value for age\n    checkAgeNotNegative(age);       // call the actual\
  \ function\n  }\n);\nelement.addEventListener(\n  'blur',\n  () => {           \
  \                // anonymous arrow function\n    const age = getAgeValue();   \
  \   // get value for age\n    checkAgeIsNumber(age);          // call the actual\
  \ function\n  }\n);\ndocument.addEventListener(\"DOMContentLoaded\", init);\n```\n\
  \n**Listing 6.13** 事件监听器也可以定义为箭头函数\n\n### 6.2.6 移除事件监听器\n\n为元素添加了某个事件的监听器也可以使用 `removeEventListener()`\
  \ 方法再次移除。作为参数，你传递事件的名称和要移除的事件监听器。\n\n如 Listing 6.14 所示所示。之前的年龄验证示例在此处扩展了一个复选框，该复选框可用于禁用或重新激活验证。为此，为复选框分配了一个\
  \ `change` 事件的事件监听器（每当复选框被启用或禁用时都会触发），在该事件监听器内部，使用 `checked` 属性来检查复选框是否启用。在前者情况下，会添加\
  \ `checkAgeNotNegative()` 和 `checkAgeIsNumber()` 事件监听器；在后者情况下，通过 `removeEventListener()`\
  \ 方法将它们移除。\n\n```\n/* Here are the other functions. */\nfunction init() {\n  const\
  \ element = document.getElementById('age');\n  element.addEventListener('blur',\
  \ clearMessage); \n  element.addEventListener('blur', checkAgeNotNegative); \n \
  \ element.addEventListener('blur', checkAgeIsNumber);\n  const checkBox = document.getElementById('validation');\
  \ \n  checkBox.addEventListener('change', () => {\n    if(checkBox.checked) {\n\
  \      element.addEventListener('blur', checkAgeNotNegative);\n      element.addEventListener('blur',\
  \ checkAgeIsNumber);\n    } else {\n      clearMessage();\n      element.removeEventListener('blur',\
  \ checkAgeNotNegative);\n      element.removeEventListener('blur', checkAgeIsNumber);\n\
  \    }\n  });\n}\ndocument.addEventListener(\"DOMContentLoaded\", init); \n```\n\
  \n**Listing 6.14** 移除事件监听器\n\n### 6.2.7 通过辅助函数定义事件处理器和事件监听器\n\n如果你想尽可能支持多的浏览器，但不想依赖像\
  \ jQuery 这样的库，可以使用 Listing 6.15 所示的 `addEvent()` 辅助函数。（记住：上面提到的 Internet Explorer\
  \ 专有方法是 `attachEvent()`。）该方法接受三个参数：要添加事件监听器（或事件处理器）的元素、要响应的事件、以及要注册的函数。\n\n该函数首先检查\
  \ `addEventListener()` 方法是否存在（这通常在 `window` 对象上检查）。如果存在，则使用该方法将函数注册为事件监听器。反之，如果方法不存在，函数将以同样的方式检查\
  \ `attachEvent()` 方法是否存在；如果是，则通过该方法注册函数。然而，如果 `attachEvent()` 方法也不存在，则函数将作为事件处理器注册。\n\
  \n```\nfunction addEvent(element, eventType, eventListener) {\n  if (window.addEventListener)\
  \ {\n    element.addEventListener(eventType, eventListener, false);\n  }\n  else\
  \ if (window.attachEvent) {\n    element.attachEvent('on' + eventType, eventListener);\n\
  \  }\n  else {\n    element['on' + eventType] = eventListener;\n  }\n} \n```\n\n\
  **Listing 6.15** 定义事件监听器或处理器的辅助函数\n\n`addEvent()` 辅助函数的用法如 Listing 6.16 所示。\n\n\
  ```\nfunction init() {\n  const element = document.getElementById('age');\n  addEvent(\n\
  \    element,\n    'blur',\n    clearMessage\n  );\n  addEvent(\n    element,\n\
  \    'blur',\n    function() {\n      const age = getAgeValue();\n      checkAgeNotNegative(age);\n\
  \    }\n  );\n  addEvent(\n    element,\n    'blur',\n    function() {\n      const\
  \ age = getAgeValue();\n      checkAgeIsNumber(age);\n    }\n  );\n} \n```\n\n**Listing\
  \ 6.16** 辅助函数的用法\n\n### 6.2.8 获取事件信息\n\n在注册为事件处理器或事件监听器的函数内部，可以通过调用相应函数时传递的参数来访问触发事件的某些信息（我们在之前的示例中由于原因省略了）。每个事件都由特定的对象类型表示——例如，鼠标事件由\
  \ `MouseEvent` 类型表示，键盘事件由 `KeyboardEvent` 类型表示。所有这些对象类型都派自一个共同的（父）类型：`Event` 类型。该类型提供的属性列在表\
  \ 6.1 中。（单个对象类型如 `MouseEvent` 和 `KeyboardEvent` 仍然提供其他属性，我们将在本章后面讨论它们。）\n\n| 属性\
  \ | 描述 |\n| --- | --- |\n| `bubbles` | 表示事件是否会在 DOM 树中向上移动(第 6.4 节) |\n| `cancelable`\
  \ | 表示事件是否可以被取消(第 6.4.2 节) |\n\n\n\n\n\n# 事件的属性\n\n| Property | 描述 |\n| :--- | :---\
  \ |\n| `currentTarget` | 包含指向事件当前目标的引用（第 6.4 节）。 |\n| `defaultPrevented` | 包含是否已调用了\
  \ `preventDefault()` 方法的指示（第 6.4.3 节）。 |\n| `eventPhase` | 包含代表事件当前所在阶段的数值（第 6.4.1\
  \ 节）。可能的值有：<ul><li>`0`（或 `Event.NONE`）</li><li>`1`（或 `Event.CAPTURING_PHASE`）</li><li>`2`（或\
  \ `Event.AT_TARGET`）</li><li>`3`（或 `Event.BUBBLING_PHASE`）</li></ul> |\n| `target`\
  \ | 包含指向事件原始目标的引用（第 6.4 节）。 |\n| `timeStamp` | 包含事件触发的时间。 |\n| `type` | 包含事件的名称。\
  \ |\n| `isTrusted` | 表示事件是由浏览器触发（例如通过点击按钮）还是由 JavaScript 代码触发（第 6.5 节）。 |\n\n**表\
  \ 6.1** 事件的属性\n\n访问此类事件对象的代码示例可以在 列表 6.17 中找到。在这里，你可以看到一个注册为按钮 `click` 事件的事件监听器的函数。当该函数被调用时，一个\
  \ `MouseEvent` 类型的对象将作为参数传递给它（因此它隐式地也是 `Event` 类型）。在函数内部，将输出该对象的各种属性（尽管我们在此省略了 `MouseEvent`\
  \ 类型定义的属性）。\n\n```javascript\nfunction buttonClicked(event) {\n  console.log(event.bubbles);\
  \           // true\n  console.log(event.cancelable);        // true\n  console.log(event.currentTarget);\
  \     // <input>\n  console.log(event.defaultPrevented);  // false\n  console.log(event.eventPhase);\
  \        // 2\n  console.log(event.target);            // <input>\n  console.log(event.timeStamp);\
  \         // e.g., 1453232649902\n  console.log(event.type);              // \"\
  click\"\n  console.log(event.isTrusted);         // true\n}\n\nfunction init() {\n\
  \  const element = document.getElementById('button'); // 获取按钮\n  element.addEventListener(\
  \           // 注册监听器\n    'click',                          // 事件名称\n    buttonClicked,\
  \                    // 事件监听器名称\n    false                             // 事件流，细节稍后将介绍\n\
  \  );\n}\n\ndocument.addEventListener('DOMContentLoaded', init); \n```\n\n**列表 6.17**\
  \ 访问事件对象\n\n## Internet Explorer 中的事件对象\n\n正如前面提到的，旧版本的 Internet Explorer 的行为并不总是符合标准的，对于事件对象来说也是如此。在这些浏览器中，该对象并不是作为参数传递给事件处理句的（在这些旧版本浏览器中不存在事件监听器），而是作为全局\
  \ `window` 对象的 `event` 属性提供的（该属性始终仅包含当前触发的事件）。\n\n幸运的是，事件对象的结构基本上仍然如 表 6.1 描述所示。然而，事件的目标元素（通常存储在\
  \ `target` 属性中）必须通过 `srcElement` 属性访问。\n\n你可以以与浏览器无关的方式访问事件对象和目标元素，如 列表 6.18 所示（但在本书后的示例中，为了清晰起见，我们不会使用这种无关无关的解决方案）。\n\
  \n```javascript\nfunction handler(ev) {\n  var e = ev || window.event;         \
  \      // 获取事件\n  var target = e.target || e.srcElement;    // 目标元素\n}\n```\n\n\
  **列表 6.18** 浏览器访问事件对象和目标元素\n\n如前所述，事件对象的类型取决于触发事件的类型。可用的事件类型——以及可用的对象类型——将在后续章节中详细介绍。\n\
  \n## 6.3 事件的类型\n\n在 Web 应用中，可能有不同类型的事件。本质上，可以区分以下类型：\n- 与鼠标交互（第 6.3.1 节）\n- 与键盘交互（第\
  \ 6.3.2 节）\n- 表单操作（第 6.3.3 节）\n- 元素聚焦（第 6.3.4 节）\n- 与 UI 相关（第 6.3.5 节）\n- 在移动设备上（第\
  \ 6.3.6 节）\n\n### 其他事件\n\n除了本章介绍的事件外，在开发时还会遇到许多其他事件：\n- 在 第 9 章中，我们将解释如何从服务器动态重新加载页面内容。\n\
  - 在 第 10 章中，我们将引入 jQuery 库，它简化并统一了 JavaScript 的许多方面。\n- 在 第 11 章中，我们将讨论使用 JavaScript\
  \ 创建图像的话题。\n- 同时，第 12 章中概述的各种 Web API 提供了开发者可以响应的各种事件。\n- Node.js（第 17 章 找到各种事件的良好概述。\n\
  \n### 6.3.1 与鼠标交互的事件\n\n与网页交互的经典形式是使用鼠标。每当用户移动鼠标或按下鼠标按钮时，后台都会触发一个事件。相关事件如表 6.2 所示。\n\
  \n`mousedown` 和 `mouseup` 事件分别在鼠标按钮按下和释放时触发，而 `mousemove` 事件在每次鼠标移动时触发。此外，还有各种事件根据鼠标指针移过或移离开元素而触发。\n\
  \n\n\n\n\n| 事件 | 描述 | 类型 |\n| :--- | :--- | :--- |\n| `mousedown` | 当在元素上按下鼠标键时触发\
  \ | `MouseEvent` |\n| `mouseup` | 当在元素上松开鼠标键时触发 | `MouseEvent` |\n| `mousemove`\
  \ | 当鼠标移动时触发 | `MouseEvent` |\n| `mouseover` | 当鼠标移动到元素上方时触发（参见注意框） | `MouseEvent`\
  \ |\n| `mouseout` | 当鼠标移出元素时触发（参见注意框） | `MouseEvent` |\n| `mouseenter` | 当鼠标进入元素区域时触发（参见注意框）\
  \ | `MouseEvent` |\n| `mouseleave` | 当鼠标移出元素区域时触发（参见注意框） | `MouseEvent` |\n\n###\
  \ 表 6.2 与鼠标交互时的事件概览\n\n#### mouseenter/mouseleave 与 mouseover/mouseout\n\n`mouseenter`\
  \ 和 `mouseover` 事件以及 `mouseout` 和 `mouseleave` 事件初看之下非常相似。前者在鼠标移动到元素上方时触发，后者在鼠标移出元素时触发。具体的差异在图\
  \ 6.3 中所示：`mouseenter` 和 `mouseleave` 只在跨越相应元素的外部边缘时触发，而 `mouseover` 和 `mouseout`\
  \ 在当另一个元素位于相应元素内部，且鼠标移动到其上方（即移出外层元素）或移出内部元素（并移动到外层元素上方）时，还会被额外触发。\n\n![mouseenter,\
  \ mouseout, mouseover, 和 mouseleave 鼠标事件的比较](img/img-f6.3.html)\n\n**图 6.3** mouseenter,\
  \ mouseout, mouseover, 和 mouseleave 鼠标事件的比较\n\n此外，你会发现所有鼠标事件都是 `MouseEvent` 对象类型。除了（超类）类型\
  \ `Event` 定义的属性外，该类型还提供了表 6.3 中所示的属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `altKey`\
  \ | 包含一个布尔值，用于指示在事件触发时是否按下了 (Alt) 键。 |\n| `button` | 包含一个数字，表示在事件触发时按下的鼠标键编号。 |\n\
  | `buttons` | 包含一个数字，表示事件触发时按下的鼠标键。数字 1 代表左键，数字 2 代表右键，数字 4 代表鼠标轮或中间键，数字 8 代表第四键，数字\
  \ 16 代表第五键。如果事件触发时按下了多个键，`buttons` 包含这些相应数字之和。 |\n| `clientX` | 事件触发时鼠标指针所在的 x 坐标（相对于\
  \ DOM 内容）。 |\n| `clientY` | 事件触发时鼠标指针所在的 y 坐标（相对于 DOM 内容）。 |\n| `ctrlKey` | 包含一个布尔值，用于指示在事件触发时是否按下了\
  \ (Ctrl) 键。 |\n| `metaKey` | 包含一个布尔值，用于指示在事件触发时是否按下了元键（meta key）（在 macOS 下，即为 (cmd)\
  \ 键；在 Windows 下，即为 (Windows) 键）。 |\n| `movementX` | 相对于上次 `mousemove` 事件触发时的 x 坐标的\
  \ x 轴偏移量。 |\n| `movementY` | 相对于上次 `mousemove` 事件触发时的 y 坐标的 y 轴偏移量。 |\n| `region`\
  \ | 包含事件所指的区域（或元素）的 ID。 |\n| `relatedTarget` | 包含相关的元素元素，该元素通过事件在主题上与当前目标元素关联。例如，当鼠标指针从一个元素拖动到另一个元素时，后者会触发一个\
  \ `mouseenter` 事件。此时 `relatedTarget` 属性将指向鼠标指针被拖出的那个元素。 |\n| `screenX` | 事件触发时鼠标指针所在的\
  \ x 坐标（相对于屏幕）。 |\n| `screenY` | 事件触发时鼠标指针所在的 y 坐标（相对于屏幕）。 |\n| `shiftKey` | 包含一个布尔值，用于指示在事件触发时是否按下了\
  \ (Shift) 键。 |\n\n### 表 6.3 MouseEvent 对象类型属性概览\n\n#### 注意\n\n出于空间考虑，我们不会详细介绍后续事件对象类型的所有属性，且不会包含相应的概览表。如果你正在查找特定对象类型的详细信息或各种\
  \ API，之前提到的网页是一个很好的参考去处：[`https://developer.mozilla.org/en-US/docs/Web/API/Event`](https://developer.mozilla.org/en-US/docs/Web/API/Event)。\n\
  \n以下两个列表展示了响应鼠标事件的示例，这在内容上稍微超前，但非常有启发性，并且可以用来练习。它说明了如何使用 Canvas API 和 `mousemove`\
  \ 事件将浏览器窗口的一部分用绘画区域（参见第 11 章）。\n\n列表 6.19 显示了作为基础的必要 HTML 代码。高亮的 `<canvas>` 元素代表绘图区域（更多内容参见第\
  \ 11 章）。列表 6.20 显示了 JavaScript 代码，确保当鼠标移动过绘图区域时，会根据鼠标移动绘制相应的线条。\n\n\n\n\n\n`handleMouseMove()`\
  \ 函数被注册在绘图区域，作为 `mousemove` 事件的事件监听器。当你将鼠标指针移动到此绘图区域上时，该事件会在后台被触发，并执行 `handleMouseMove()`\
  \ 函数。在该函数内部，将访问事件对象的 `clientX` 和 `clientY` 属性，这些属性是 `MouseEvent` 对象类型特有的。这两个属性包含了事件触发时鼠标指针的\
  \ x 和 y 坐标。根据这些位置信息，函数的接后续部分将相应地在绘图区域上绘制路径（你现在不需要详细理解这段代码；它包含许多我们在第 11 章之前将不会讨论的内容）。\n\
  \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <meta charset=\"UTF-8\">\n  <title>Draw\
  \ based on mouse position</title>\n  <link rel=\"stylesheet\" href=\"styles/main.css\"\
  >\n  <script src=\"scripts/main.js\"></script>\n</head>\n<body>\n<div id=\"container\"\
  >\n  <canvas id=\"canvas\" width=\"400\" height=\"400\">\n  </canvas>\n</div>\n\
  </body>\n</html> \n```\n\n**列表 6.19** 带有绘图区域的 HTML 源\n\n```javascript\nfunction\
  \ init() {\n  const canvas = document.getElementById('canvas');\n  canvas.addEventListener('mousemove',\
  \ handleMouseMove, false);\n  const context = canvas.getContext('2d');  // 获取绘图区域。\n\
  \  let started = false;                      // 注意路径开始。\n  function handleMouseMove(e)\
  \ {\n    let x, y;\n    if (e.clientX               // 如果指定了 x 位置 ...\n      ||\
  \ e.clientX == 0) {      // ... 且不为 0 ...\n      x = e.clientX;            // ...\
  \ 记住 x 位置 ...\n      y = e.clientY;            // ... 记住 y 位置。\n    }\n    if (!started)\
  \ {             // 如果路径尚未开始 ...\n      context.beginPath();      // ... 开始路径并 ...\n\
  \      context.moveTo(x, y);     // ... 移动到位置。\n      started = true;          \
  \ // 注意路径已开始。\n    } else {                    // 如果路径已开始 ...\n      context.lineTo(x,\
  \ y);     // ... 移动到位置 ...\n      context.stroke();         // ... 绘制连接线。\n    }\n\
  \  }\n}\n\ndocument.addEventListener('DOMContentLoaded', init); \n```\n\n**列表 6.20**\
  \ 使用 Canvas API 和 mousemove 事件在画布上绘图\n\n### 6.3.2 与键盘及文本字段交互时的事件\n\n当使用键盘时也会触发事件。每当用户按下键盘上的某个按键时，会触发三个事件：按下相应按键时触发\
  \ `keydown` 事件，释放按键时触发 `keyup` 事件，以及（在两者之间）`keypress` 事件，后者在虚拟上代表了所键入的字符。与键盘交互时触发的事件类型为\
  \ `KeyboardEvent` 类型（见表 6.4）。\n\n| 事件 |  | 对象类型 |\n| --- | --- | --- |\n| `keydown`\
  \ | 按下按键时触发。如果按键时间较长，事件将触发多次。 | `KeyboardEvent` |\n| `keyup` | 释放按键时触发。 | `KeyboardEvent`\
  \ |\n| `keypress` | 通过键盘插入字符时触发。此处适用以下原理：如果按键时间较长，事件将触发多次。 | `KeyboardEvent` |\n\
  \n**表 6.4** 与键盘交互时事件的概览\n\n关于使用键盘事件的示例，请参考相对详尽（但非常实用）的列表 6.21，它展示了如何使用方向键移动网页元素（在示例中是一个圆形的\
  \ `div` 元素）。\n\n为了这一目的，通过事件监听器捕获 `keydown` 事件。在事件监听器内部，确定被按下的键，并根据这些信息调用四个方法之一——`moveUp()`、`moveDown()`、`moveRight()`\
  \ 或 `moveLeft()`。这些方法中的每一个都会更新存储在 `position` 数组中的元素位置，并调用 `move()` 方法，该方法反通过 CSS\
  \ 更新元素的位置。如示例所示，`if-else` 语句检查事件对象是否具有 `key` 属性或 `keyIdentifier` 属性。前者仍被所有浏览器支持，这就是为什么示例使用了较旧的（现已废弃的）`keyIdentifier`\
  \ 属性。\n\n```javascript\nfunction init() {\n  window.addEventListener('keydown',\
  \ (event) => {\n    if (event.key !== undefined) {\n      // 包含在 DOM 标准的草案中。\n \
  \     // 例如被 Firefox 和 Internet Explorer 支持。\n      console.log(event.key);\n  \
  \    switch (event.key) {\n        case 'ArrowUp':\n          moveUp();\n      \
  \    break;\n        case 'ArrowLeft':\n          moveLeft();\n          break;\n\
  \        case 'ArrowRight':\n          moveRight();\n          break;\n        case\
  \ 'ArrowDown':\n          moveDown();\n          break;\n        default: return;\n\
  \      }\n    } else if (event.keyIdentifier !== undefined) {\n      // 包含在旧版的 DOM\
  \ API 中。\n      // 例如被 Chrome 和 Safari 支持。\n      console.log(event.keyIdentifier);\n\
  \      switch (event.keyIdentifier) {\n        case 'Up':\n          moveUp();\n\
  \          break;\n        case 'Left':\n          moveLeft();\n          break;\n\
  \        case 'Right':\n          moveRight();\n          break;\n        case 'Down':\n\
  \          moveDown();\n          break;\n        default: return;\n      }\n  \
  \  } else if (event.keyCode !== undefined) {\n      // 废弃\n    }\n  });\n\n  const\
  \ circle = document.getElementById('circle');\n  const position = [0, 0];\n  function\
  \ move() {\n    circle.style.top = position[0] + 'px';\n    circle.style.left =\
  \ position[1] + 'px';\n  }\n  function moveUp() {\n    position[0] -= 10;\n    move();\n\
  \  }\n\n  function moveRight() {\n    position[1] += 10;\n    move();\n  }\n\n \
  \ function moveLeft() {\n    position[1] -= 10;\n    move();\n  }\n\n  function\
  \ moveDown() {\n    position[0] += 10;\n    move();\n  }\n}\n```\n\n**列表 6.21**\
  \ 使用方向键和 keydown 事件移动元素\n\n### 6.3.3 处理表单时的事件\n\n处理表单时也有特殊的事件。例如，每当用户修改 `input`\
  \ 或 `textarea` 元素中的文本时，就会触发相应的事件；每当下拉列表、复选框或单选按钮组的选择值发生变化时；或者当表单提交或表单包含的值被重置时，都会触发。所有这些事件都由\
  \ `Event` 对象类型表示，因此它们不像鼠标事件或键盘事件那样有特定的对象类型（见表 6.5）。\n\n\n\n\n\n\n我们在这里不会列出任何代码示例，因为我们将在第\
  \ 7 章中详细介绍表单的操作，在那里你也将看到如何使用表单事件。\n\n| 事件 | 描述 | 对象类型 |\n| --- | --- | --- |\n|\
  \ `input` | 当 `<input>` 或 `<textarea>` 元素或具有 `contenteditable` 属性元素的属性发生变化时触发 |\
  \ `Event` |\n| `change` | 当选择列表、复选框或单选按钮组的选中值发生变化时触发 | `Event` |\n| `submit` | 当表单被提交时触发\
  \ | `Event` |\n| `reset` | 当表单被重置时（通过重置按钮）触发 | `Event` |\n\n**表 6.5** 与文本字段和表单交互时的事件概览\n\
  \n### 6.3.4 元素获取焦点焦点时的事件\n\n此外，每当网页上的元素获得焦点（例如，通过使用 (Tab) 键导航到该元素）或失去焦点时，都会触发一个事件。表\
  \ 6.6 提供了概述。如你所示，相应触发事件的对象类型均为 `FocusEvent` 类型。\n\n#### 注意\n请记住，在本章的开头示例中，你已经看到过如何使用\
  \ `blur` 事件来验证表单字段中的文本输入。\n\n| 事件 | 描述 | 对象类型 |\n| --- | --- | --- |\n| `focus`\
  \ | 当元素获得焦点时触发。 | `FocusEvent` |\n| `blur` | 当元素失去焦点时触发。 | `FocusEvent` |\n| `focusin`\
  \ | 当元素获得焦点时触发。与 `focus` 事件不同，此事件会冒泡 (第 6.4 节)）。 | `FocusEvent` |\n| `focusout`\
  \ | 当元素失去焦点时触发。与 `blur` 事件不同，此事件会冒泡 (第 6.4 节）。 | `FocusEvent` |\n\n**表 6.6** 元素获取焦点时的事件概览\n\
  \n### 6.3.5 用户界面的通用事件\n\n除了我们目前介绍的事件外，还有许多其他可以大致归类为 UI 事件的事件（其中大多数而非全部事件由 `UIEvent`\
  \ 类型表示）。表 6.7 提供了概述。\n\n| 事件 | 描述 | 对象类型 |\n| --- | --- | --- |\n| `load` | 当网页完全加载时触发\
  \ | `UIEvent` |\n| `unload` | 当网页卸载时触发，通常在相应的浏览器窗口中请求新网页时触发 | `UIEvent` |\n| `abort`\
  \ | 当资源加载被取消时触发 | `UIEvent` |\n| `Error` | 当加载网页时出现问题（例如 JavaScript 错误）时触发 | `UIEvent`\
  \ |\n| `select` | 当在网页上选择文本时触发 | `UIEvent` |\n| `resize` | 当浏览器窗口大小发生变化时触发 | `UIEvent`\
  \ |\n| `scroll` | 当向上或向下滚动时触发 | `UIEvent` |\n| `beforeunload` | 在网页卸载之前触发，通常在相应的浏览器窗口中请求新网页时触发\
  \ | `BeforeUnloadEvent` |\n| `DOMContentLoaded` | 当 DOM 树完全加载时触发 | `Event` |\n|\
  \ `cut` | 当内容从表单字段中剪切时（例如，使用快捷键 (X)）触发 | `Event` |\n| `copy` | 当内容从表单字段中复制时（例如，使用快捷键\
  \ (C)）触发 | `Event` |\n| `paste` | 当内容被插入到表单字段时（例如，使用快捷键 (V)）触发 | `Event` |\n| `select`\
  \ | 当在表单字段中选择文本时触发 | `Event` |\n\n**表 6.7** 与用户界面相关的事件概览\n\n#### `load` 事件的使用\n\
  在本章之前，你已经见过使用 `load` 事件的示例，当时我们讨论了在网页加载后执行初始代码（并注册事件处理器）。\n\n例如，`scroll` 事件的一个用例是根据垂直滚动位置显示网页元素。你可能以前见过这种效果；如今，它通常被用于所谓的“单页网页”（即所有内容都包含在单一垂直长页面上的网页）。如果用户在此类网页上向下滚动，网页的后续组件将逐渐淡入，例如文本或图像（有时从左侧或右侧进入屏幕）。\n\
  \n接两个代码列表显示了一个非常简单的实现（至少在视觉上），它根据垂直滚动位置显示文本。代码列表 6.22 仅包含 HTML 代码，旨在向你展示网页的结构（包含\
  \ CSS 的完整示例一如既往，可以在书的下载区域找到）。\n\n带有 `name` ID 且包含文本 `John Doe` 的 `<span>` 元素在网页加载时是隐藏的。代码列表\
  \ 6.23 还在网页加载时在 `window` 对象上为 `scroll` 事件注册了事件监听器 `handleScrollEvent()`。在该事件监听器内部，使用\
  \ `window.scrollY` 来确定垂直滚动位置（另见第 8 章）。当此滚动位置超过特定阈值（示例中的值 `10`）时，将从隐藏的 `<span>` 元素中移除\
  \ `hide` CSS 类并替换为 `show` CSS 类。为该 CSS 类定义的 CSS 规则（此处未显示）随后确保了元素会缓慢淡入。\n\n\n\n\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
  >\n  <title>滚动时元素淡入效果</title>\n  <link rel=\"stylesheet\" href=\"styles/main.css\"\
  >\n  <script src=\"scripts/main.js\"></script>\n</head>\n<body>\n  <div id=\"content\"\
  >\n    Hello\n    <span id=\"name\" class=\"hide\">John Doe</span>\n  </div>\n</body>\n\
  </html> \n```\n\n列出 6.22 根据滚动位置实现元素元素淡入的 HTML 源代码\n\n```javascript\nfunction init()\
  \ {\n  let scrollPosition = window.scrollY;\n  const nameElement = document.getElementById('name');\n\
  \n  function handleScrollEvent(e) {\n    scrollPosition = window.scrollY;\n    if(scrollPosition\
  \ > 10) {\n      nameElement.classList.remove('hide');\n      nameElement.classList.add('show');\n\
  \    }\n    else {\n      nameElement.classList.remove('show');\n      nameElement.classList.add('hide');\n\
  \    }\n  }\n  window.addEventListener('scroll', handleScrollEvent);\n}\n\ndocument.addEventListener('DOMContentLoaded',\
  \ init); \n```\n\n列出 6.23 使用滚动事件监听器根据滚动位置显示元素\n\n### 6.3.6 移动设备上的事件\n\n当使用移动设备（智能手机、平板电脑等）时，会触发许多其他事件。这背后的原因主要是由于此类终端设备的操作方式与传统的笔记本电脑或桌面计算机完全不同：你通常不是使用鼠标和键盘，而是使用手指或特殊的触控笔与相应的网站进行交互。\n\
  \n基于这些交互形式——这些形式很大程度上是为了触摸屏幕设计的——存在相应的事件来检测并响应终端设备屏幕上的触摸操作。\n\n此外，还有其他因素会影响移动设备，例如设备的倾斜或方向：它是向侧倾斜、向前还是向后倾斜的？事件也可以用于响应移动设备的移动。关于这方面最重要的事件概述，可以在表\
  \ 6.8 中找到。\n\n| 事件 | 说明 | 对象类型 |\n| --- | --- | --- |\n| <samp class=\"listingcharacter\"\
  >orientationchange</samp> | 当输入设备的方向发生时触发 | <samp class=\"listingcharacter\">Event</samp>\
  \ |\n| <samp class=\"listingcharacter\">deviceorientation</samp> | 当关于终端设备方向的新数据可用时触发\
  \ | <samp class=\"listingcharacter\">DeviceOrientationEvent</samp> |\n| <samp class=\"\
  listingcharacter\">devicemotion</samp> | 定期触发并指示作用于终端设备的加速度 | <samp class=\"listingcharacter\"\
  >DeviceMotionEvent</samp> |\n| <samp class=\"listingcharacter\">touchstart</samp>\
  \ | 当输入设备（通常是手指）触摸屏幕时触发 | <samp class=\"listingcharacter\">TouchEvent</samp> |\n\
  | <samp class=\"listingcharacter\">touchend</samp> | 当输入设备停止触摸时触发——换，当手指离开屏幕时 |\
  \ <samp class=\"listingcharacter\">TouchEvent</samp> |\n| <samp class=\"listingcharacter\"\
  >touchmove</samp> | 当输入设备在屏幕上移动时触发 | <samp class=\"listingcharacter\">TouchEvent</samp>\
  \ |\n| <samp class=\"listingcharacter\">touchcancel</samp> | 当触摸跟踪被中断时触发 | <samp\
  \ class=\"listingcharacter\">TouchEvent</samp> |\n\n表 6.8 移动设备事件精选\n\n#### 注意\n\n\
  为了不超出本章的范围，我们不会在此包含代码示例，而将在第 12 章中提供。在该章中，我们将向你如何识别和响应移动设备的方向和移动。\n\n## 6.4 理解并影响事件流\n\
  \n每当事件被触发时，它都会经过几个事件阶段。作为一名 JavaScript 开发人员，理解这些阶段以及它们如何与事件触发相关对你来说。\n\n### 6.4.1\
  \ 事件阶段\n\n基本上，事件流方面可以分为以下三个阶段：\n\n1. **捕获阶段 (Capturing phase)**\n   在此阶段，事件从 DOM\
  \ 树的顶端节点（文档节点）“向下”到达触发事件的元素，即目标元素（参见图 6.4）。\n\n2. **目标阶段 (Target phase)**\n   在此阶段，事件在目标元素上触发。\n\
  \n3. **冒泡阶段 (Bubbling phase)**\n   在此阶段，事件从 DOM 树中的目标元素“向上”回到文档节点（参见图 6.5）。\n\n\
  在捕获阶段和冒泡阶段期间，事件会触发在事件当前所在元素上为该事件注册的事件处理器或事件监听器。\n\n![在事件捕获中，事件向到底移动](img/#06_004.html_f6.4)\n\
  图 6.4 在事件捕获中，事件向到底移动\n\n![在冒泡过程中，事件向上到顶部移动](img/#06_004.html_f6.5)\n图 6.5 在冒泡过程中，事件向上到顶部移动\n\
  \n捕获阶段和冒泡阶段可以追溯到以前不同厂商的意见。当时的浏览器厂商 Netscape 认为事件应该始终调用 DOM 树中更靠元素的事件处理器/监听器，因此遵循所谓的事件捕获，它只包含捕获阶段（以及目标阶段）。但微软有不同的意见：在\
  \ Internet Explorer 中，事件首先触发目标元素上的事件处理器/监听器。也就是说，微软遵循事件冒泡原则，它反过来只包含冒泡阶段（以及目标阶段）。\n\
  \n然而，事件流长期以来由 W3C 标准化（参见[www.w3.org/TR/DOM-Level-3-Events#event-flow](http://www.w3.org/TR/DOM-Level-3-Events#event-flow)），并将两个阶段合并为一个事件流，如图\
  \ 6.6 所示。句话说，当事件被触发时，它首先经过捕获阶段，执行在该阶段注册的所有事件处理器/监听器（稍后介绍），然后经过目标阶段，执行在目标元素上注册的事件处理器/监听器，最后经过冒泡阶段，现在执行在该阶段注册的所有事件处理器/监听器。\n\
  \n![W3C 事件流结合了捕获、目标和冒泡阶段](img/#06_004.html_f6.6)\n图 6.6 W3C 事件流结合了捕获、目标和冒泡阶段\n\n\
  理解这种事件冒泡和事件捕获原理最简单的方法是使用示例。\n\n#### 事件冒泡示例\n\n让我们从一个事件冒泡示例开始。首先看列出 6.24 中的 HTML\
  \ 代码。它显示了一个外部 <samp class=\"listingcharacter\">div</samp> 元素（ID 为 `outer`），它包含了两个\
  \ <samp class=\"listingcharacter\">div</samp> 元素（ID 为 `first` 和 `second`），这两个元素每个又包含两个\
  \ <samp class=\"listingcharacter\">div</samp> 元素。该结构如图图 6.7 所示。\n\n\n\n\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>事件捕获与事件冒泡</title>\n\
  \  <link rel=\"stylesheet\" href=\"styles/main.css\">\n  <script src=\"scripts/main.js\"\
  ></script>\n</head>\n<body>\n<div id=\"outer\" class=\"level1\">\n  <div id=\"first\"\
  \ class=\"level2\">\n    1\n    <div id=\"A\" class=\"level3\">A</div>\n    <div\
  \ id=\"B\" class=\"level3\">B</div>\n  </div>\n  <div id=\"second\" class=\"level2\"\
  >\n    2\n    <div id=\"C\" class=\"level3\">C</div>\n    <div id=\"D\" class=\"\
  level3\">D</div>\n  </div>\n</div>\n</body>\n</html> \n```\n\n**代码列表 6.24** 事件示例的\
  \ HTML 代码\n\n![事件示例的起点](img/img-f6.7.html)\n\n**图 6.7** 事件示例的起点\n\n在代码列表 6.25 的\
  \ JavaScript 代码中，同一个函数现在被添加到这些 `<div>` 元素的事件监听器中。该函数的作用仅是通过 `classList.toggle()`\
  \ 切换 `selected` CSS 类，从而在白色和灰色背景之间切换。\n\n```javascript\nfunction handler(ev) {\n\
  \  const e = ev || window.event;                           // 获取事件\n  const target\
  \ = e.target || e.srcElement;                // 目标元素\n  this.classList.toggle('selected');\
  \                 // CSS 类\n  console.log(                                     \
  \  // 输出点击的...\n    `Clicked on node with ID \"${target.id}\"`         // ...元素\n\
  \  );\n  console.log(                                       // 输出当前的...\n    `Event\
  \ at node with ID \"${this.id}\"`             // ...元素\n  );\n}\nfunction init()\
  \ {\n  const elements = document.querySelectorAll(        // 所有元素...\n    '.level1,\
  \ ' +                                    // ...第一层的、...\n    '.level2, ' +     \
  \                               // ...第二层的、...\n    '.level3'                  \
  \                      // ...以及第三层... \n  );                                   \
  \              // ...级...\n  for(let i=0; i<elements.length; i++) {            \
  \ // ...获取一个...\n    elements[i].addEventListener(                    // ...为...注册监听器\n\
  \      'click',                                       // ...点击事件。\n      handler,\
  \ \n      false\n    );\n  }\n}\ndocument.addEventListener('DOMContentLoaded', init);\
  \ \n```\n\n**代码列表 6.25** 事件冒泡示例的代码\n\n如果你现在点击包含 `C` 的 `<div>` 元素（也就是说，点击了第三层 `<div>`\
  \ 层级中的一个元素），该元素会被涂成灰色。之后，事件被传递给父元素（带有 `2` 的元素），该元素也将该元素涂成灰色。然后，事件再次被转发（到最外层的 `<div>`\
  \ 元素），该处的事件监听器也会随之执行，相应地，该元素的背景颜色也会被设置为灰色。你可以在图 6.8 中看到结果，并在代码列表 6.26 中看到程序的输出。\n\
  \n```\nClicked on node with ID \"C\"\nEvent at node with ID \"C\"\nClicked on node\
  \ with ID \"C\"\nEvent at node with ID \"second\"\nClicked on node with ID \"C\"\
  \nEvent at node with ID \"outer\" \n```\n\n**代码列表 6.26** 点击标记为 C 的 <div> 元素时前一个程序的输出\n\
  \n![如果你点击标记为 C 的 <div> 元素，在事件冒泡期间，从目标元素开始，所有之前的元素都被涂成灰色](img/img-f6.8.html)\n\n\
  **图 6.8** 如果你点击标记为 C 的 <div> 元素，在事件冒泡期间，从目标元素开始，所有之前的元素都被涂成灰色\n\n另一方面，如果你点击带有 `2`\
  \ 的 `<div>` 元素（即第二层 `<div>` 层级中的元素），它的事件监听器会首先执行，背景颜色设置为灰色。然后，父元素的事件监听器——即最外层的 `<div>`\
  \ 元素——被执行，其背景颜色也被设置为灰色。你可以在图 6.9 中看到结果，并在代码列表 6.27 中看到程序的输出。\n\n![如果你点击标记为 2 的 <div>\
