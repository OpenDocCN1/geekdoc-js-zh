  \ |\n\n**表 12.20** 各 Web API 概述\n\n## 12.15 总结\n\n在本章中，你学习了各种 Web API。在此过程中，我们展示了以下\
  \ API：\n\n- `Web Socket API` 允许客户端与服务器之间的双向通信。\n- 使用服务器发送事件，服务器可以主动向客户端发送消息。\n-\
  \ 要存储客户端数据，可以使用 cookies、浏览器存储或 `IndexedDB`。浏览器存储分为本地存储（local storage）和会话存储（session\
  \ storage）：前者适用于浏览器的所有窗口和标签页，而后者每个窗口或标签页独有。\n- 通过 `File API`可以访问用户的文件，前提是用户已通过选择框或拖放操作选择了这些文件。\n\
  - 通过拖放，可以在网页内移动元素。\n- 默认情况下，`JavaScript` 在单线程中执行。然而，使用 `web workers` 和 `Web Worker\
  \ API`，可以将脚本执行分布在不同的线程中，尽管 `web workers` 无法访问 `DOM` 或 `window` 对象。\n- `Geolocation\
  \ API` 可访问用户的位置信息，前提是用户已给予许可。获取的信息可以与 `Google Maps API` 等结合使用，例如在地图上显示位置或路线。\n-\
  \ `Battery Status API` 允许你读取有关终端设备电池的信息。这包括电池状态、充电时间和运行时间。\n- `Web Speech API` 支持语音输出和语音识别。\n\
  - 使用 `Web Animation API`，可以通过 `JavaScript` 创建动画。\n- `Command Line API` 提供了一些在 Web\
  \ 应用开发过程中非常有用的功能。\n- `Internationalization API` 允许 Web 应用程序支持多语言。\n\n# 13 面向对象编程\n\
  \n尽管你在之前的章节中已经反复处理过对象，而且“面向对象编程”这个术语也已经简要提到并解释过，但关于这种重要的编程范式，你还有很多需要了解。如果你已经用过其他面向对象的编程语言，你会发现\
  \ `JavaScript` 处理某些的方式在根本上是不同的。如果你没有任何面向对象编程的经验，那就好了，因为这些内容可能更更容易适应。\n\n在 `JavaScript`\
  \ 中，面向对象的方式与 `Java` 等语言不同。本章首先解释面向对象编程的核心概念（抽象、数据封装、多态和继承），然后展示 `JavaScript` 中可用于实现这些概念的各种技术。\n\
  \n## 13.1 面向对象编程的原则\n\n在之前的第 3 章中，我们简要提到过面向对象编程的原则，从那时起，你已经在各种示例中看到在 `JavaScript`\
  \ 的许多地方处理对象。例如，网页的不同组件以 `Document Object Model`（文档对象模型）的形式表示，浏览器窗口的各个组件也是如此，甚至事件和错误也仅仅是对象。\n\
  \n但仅仅与对象工作这一事实并不意味着你也是以面向对象的方式进行工作。面向对象编程基于四个基本原则：\n\n- **抽象**：对象的抽象行为总结在 `classes`（类）或\
  \ `prototypes`（原型）中。\n- **数据封装**：属性和方法封装在 `classes`或 `prototypes` 中，并对外部访问隐藏。\n\
  - **继承**：属性和方法可以从一个 `class` 继承到另一个 `class`，或从一个对象（`prototype`）继承到另一个对象。\n- **多态**：对象可以根据其用途呈现不同的类型。\n\
  \n### 面向对象编程的其他原则\n\n还有其他一些特殊原则，例如聚合、耦合、关联和组合（参见例如 [`en.wikipedia.org/wiki/Package_principles`](https://en.wikipedia.org/wiki/Package_principles)），但我们在这里不讨论它们。\n\
  \n现在，当然第一个问题是 `classes` 和 `prototypes` 到底是什么。因此，我们将先解释这两个术语，并讨论它们与对象的联系，然后再回到面向对象的原则。\n\
  \n### 13.1.1 类、对象实例和原型\n\n在面向对象编程中，`class` 是对象的一种蓝图。可以说，`class` 充当模板，从该模板中可以在程序运行时创建单个的实例（对象实例）。在\
  \ `class` 内部，开发者定义了单个对象实例应该具有的属性和方法。属性代表对象实例的状态，方法代表它们的行为。在软件开发中，`Unified Modeling\
  \ Language (UML)` 中的 `class diagrams` 通常用于对单个类进行建模或表示类之间的关系，而对象之间的关系则在对象图中表示。\n\n\
  图 13.1 显示了这两种图的结合，其中你可以看到 `Animal` 类，以及该类的两个对象实例：`bello` 和 `bella`。在类/对象图中，类和对象都由划分为各个区域的矩形表示。\n\
  \n对于类，类名位于顶部，接着是一个列出属性的可选区域，然后是列出类方法的可选区域。属性列出了名称和数据类型，方法也列出了各个参数的名称和数据类型。可以可选指定其他方面，如返回值（针对方法）和可见性（针对属性和方法）。\n\
  \n对于对象，相应对象的名称也位于顶部（根据惯例小写），后面跟着冒号和该对象所属实例的类名。对象的属性通过名称指定，通常还带有具体值，但对象图中不存在方法列表。\n\
  \n![用于表示类和对象的类图与对象图结合](img/img-f13.1.html)\n\n**图 13.1** 用于表示类和对象的类图与对象图结合\n\n基于类的编程语言的一个示例是\
  \ `Java` 编程语言。然而，`JavaScript` 不是一种基于类的编程语言，尽管自 `ES2015` 以来有了 `class` 语法（稍后将详细介绍）。\n\
  \n\n\n\n相反，JavaScript 是一种基于对象的编程语言：对象的实例的创建不是基于类，而是基于其他对象。而这些其他对象则代表了原型（prototype）。\n\
  \n## 偏离 UML 标准\n\n由于 JavaScript 是一种基于对象的编程语言，且方法是直接定义在对象上的（而不是类上），因此我们在对象图中包含了一些方法以反映这一事实。尽管这在某种程度上偏离了\
  \ UML 标准，但在这种情况下简化了表示。\n\n由于这种原型原则，JavaScript 的编程类型也被称为基于原型的编程（prototype-based programming）或原型编程。另一个术语是无类编程（classless\
  \ programming），因为没有使用类。\n\n## 面向对象的类型\n\n面向对象的类型根据编程语言的不同也有不同的名称：在基于类的编程中，你谈论的是基于类的面向对象；在基于对象和/或基于原型的编程中，你谈论的是原型面向对象。\n\
  \n## JavaScript 并不知道真正的类\n\nJavaScript 自 `ES2015` 以来就开始使用“类”这一术语以及与之引入的类语法，但这些并不是真正的类（如\
  \ `Java` 中的类）；它们根结底只是“语法糖”。因此，在后文中，如果我们指的是这类“类”，会在“类”字上加上引号。在所有这种区别并不重要的情况下，我们会省略引号。\n\
  \n现在类和原型的概念已经明确，它们与对象的联系也已经展示，让我们在接下来的章节回到面向对象编程的基本原理。\n\n### 13.1.2 原则 1：定义抽象行为\n\
  \n在面向对象编程中，类或原型定义了具有相似状态和行为的多个对象实例的基础。因此，类和原型也可以被视为（具体）对象实例的抽象。\n\n类和原型分别定义了抽象行为（所有对象实例共有）或代表状态的属性（所有对象实例也共有）。在对象实例中，属性被提供了具体的值，从而定义了具体的状态（参见图\
  \ 13.2）。\n\n![类可以被视为具体对象实例的抽象](img/img-f13.2.html)\n\n**图 13.2** 类可以被视为具体对象实例的抽象\n\
  \n### 13.1.3 原则 2：封装条件和行为\n\n在面向对象中，数据封装（或信息隐藏）术语指的是将属性和方法分组到类或原型中，而实现细节保持隐藏：通常，你只通过方法提供属性，以防止直接访问它们，并防止对象被设置为未经授权的状态。\n\
  \n在图 13.3 中，这以草图的形式所示。`name`、`color` 和 `age` 属性通过前面的减号标记为私有：从外部无法直接访问这些属性，因此调用者\
  \ 1 的调用失败。\n\n![属性应该只通过方法访问](img/img-f13.3.html)\n\n**图 13.3** 属性应该只通过方法访问\n\n相反，类提供了\
  \ setter 和 getter 方法来访问属性，因此调用者 2 的调用成功了。这种访问器方法或简的访问器可以防止无效值被赋值给属性。但如果你允许直接访问属性（从而没有履行数据封装原则），这就无法保证了，因为此时也可以分配无效的值（例如，给\
  \ `color` 属性赋值为 `Doe`）。\n\n在 `Java` 等编程语言中，可以使用特殊关键字来防止属性值从外部被更改（即从对象实例外部——具体通过\
  \ `private` 关键字将它们标记为私有）。JavaScript 在方面长期以来一直相当笨拙，它本身只提供 `set` 和 `get` 关键字来将属性标记为访问属性，但不能让属性从外部完全不可访问。直到\
  \ `ES2022`，现在才可以通过特殊语法将私有属性标记为此类（章节 13.4.4）。\n\n### 13.1.4 原则 3：继承条件和行为\n\n在基于类的面向对象中，一个类可以从另一个类继承或衍生属性和方法，这被称为继承。\n\
  \n例如，`Dog` 类可以派自 `Animal` 类，并继承那里定义的方法。图 13.4 显示了此相应的类图。你可以看到 UML 中用箭头表示继承关系：`Cat`\
  \ 和 `Dog` 类派生自 `Animal` 类并继承它的方法，但它们每个又额外定义了一个方法。\n\n![类可以从其他类继承属性和方法](img/img-f13.4.html)\n\
  \n**图 13.4** 类可以从其他类继承属性和方法\n\n继承或派生的类也称为子类（subclass）；被继承的类相应称为超类（superclass）。\n\
  \n#### 子类型和超类型\n\n在原型面向对象中，对象可以继承自其他对象（原型）。由于子对象（subobject）和超对象（superobject）术语在这种语境并不常见，因此这里更常用的是子类型（subtype）和超类型（supertype）。\n\
  \n#### 注意\n\n类或对象的继承表示了一种“是”（as is）的关系：`Cat` 的实例也是 `Animal` 的实例。然而，反过来则不然：`Animal`\
  \ 的实例不一定是 `Cat` 的实例。\n\n### 13.1.5 原则 4：接受不同类型\n\n多态是对象根据上下文或其用途承担不同类型（形状）或表现为不同类型的能力。\n\
  \n例如，如果一个函数期望一个 `Animal` 类型的对象，那么可以传递 `Animal` 的实例，也可以传递 `Cat` 或 `Dog` 等子类的实例作为参数。你可以在所有期望\
  \ `Animal` 实例或 `Cat` 实例的地方使用 `Cat` 实例，并在所有期望 `Animal` 实例或 `Dog` 实例的地方使用 `Dog` 实例。这些实例是多态的：在某处它们可以假设更通用的类型\
  \ `Animal`，在另一个地方则假设更具体的类型 `Cat` 或 `Dog`。\n\n#### 静态类型与动态类型\n\n\n\n\n\n在严格类型或静态类型编程语言（如\
  \ `Java`）中，语言本身对多态性的重视比在弱类型或动态类型语言（如 `JavaScript`）中要得多。由于弱类型的特性，你可以将任何类型的对象作为函数的参数，例如，在遇到不允许的类型时，编译器不会报错抱怨。\n\
  \n### 注意\n子类的对象实例可以被视为相应父类的对象实例。\n\n### 13.1 JavaScript 与面向对象编程\n\n在面向对象编程方面，`JavaScript`\
  \ 的行为不像其他语言（例如 `Java`，我们经常用它来进行比较）那样明确。相反，`JavaScript` 中有几种技术可以以面向对象的方式进行编程。作为一名优秀的\
  \ `JavaScript` 开发者，你应该掌握所有这些技术。\n\n原则上，在以下内容之间进行了区分：\n\n*   原型面向对象：这是 `JavaScript`\
  \ 语言中最自然的面向对象方式，因为它只使用对象。\n*   伪类面向对象：这是面向对象的一种类型，其中你假装 `JavaScript` 是一种基于类的编程语言。在这里使用了构造器函数。\n\
  *   使用类语法的面向对象：这种面向对象类型代表了伪类面向对象在语法上的简化。\n\n出于教学考虑，按照提到的顺序介绍这些类型的面向对象方法是有意义的，尽管在实践中——至少对于新的\
  \ `JavaScript` 项目而言——你可能会直接使用类语法。所以，让我们先从原型面向对象开始。\n\n## 13.2 原型面向对象编程\n\n`JavaScript`\
  \ 是一种基于原型的语言，因此它不认识任何类——至少，不是真正的类。相反，`JavaScript` 中一切都是都是基于对象的。在本节中，我们将向你展示基于对象或原型（原型面向对象）的经典面向对象是如何工作的。\n\
  \n### 13.2.1 原型概念\n\n`JavaScript` 中的每个对象都基于一个原型。至少，几乎每个对象都是如此，因为某些对象——例如，所有对象的根对象\
  \ `Object`，或者原型被显式设置为 `null` 的对象——是没有原型的。\n\n每个对象还可以作为模板——即作为另一个对象的原型。在这种情况下，新对象从原型继承属性和方法。如果翻译成基于类的编程，这大致等同于创建一个子类：它从派生的超类或父类中继承属性和方法。\n\
  \n### 注意\n在原型继承中，类不继承自类，而是对象继承自对象。\n\n### 访问对象的原型\n\n对象的原型存储在 `__proto__` 属性中。该属性首次在\
  \ Firefox 浏览器中实现为内部 `[[Prototype]]` 属性的别名，从那时被几乎所有的浏览器或运行时环境采用。该特性直到第 6 版本才在 ECMAScript\
  \ 标准中被永久采纳。与其直接访问该属性，通常且推荐的做法是使用 `Object.getPrototypeOf()` 方法获取对象的原型。此外，可以使用 `Object.isPrototypeOf()`\
  \ 来检查一个对象是否是另一个对象的原型。\n\n### 13.2.2 派生对象\n\n要基于原型定义对象，请使用 `Object.create()` 方法（参见[第\
  \ 4 章]）。[列表 13.1] 显示了一个示例。在这里，最初定义了 `animal` 对象，它拥有 `eat()` 和 `drink()` 方法以及 `name`、`color`\
  \ 和 `age` 属性（出于空间考虑，这里省略了这些属性的额外 setter 和 getter）。随后，通过 `Object.create()` 创建了两个对象（`cat`\
  \ 和 `dog`），并将 `animal` 对象作为原型传入。\n\n```\nconst animal = {\n  name: '',\n  color:\
  \ 'Brown',\n  age: 0,\n  eat: function(food) {\n    console.log('Chow chow, ' +\
  \ food + '!');\n  },\n  drink: function(drink) {\n    console.log('Mmmmmmh, ' +\
  \ drink + '!');\n  }\n}\nconst cat = Object.create(animal);\nconst dog = Object.create(animal);\
  \ \n```\n\n**列表 13.1** 基于原型创建对象\n\n### 注意\n记住：使用对象字面量符号创建对象时，无法指定原型。\n\n### 13.2.3\
  \ 继承方法和属性\n\n在原型面向对象中，对象继承自对象。例如，在[列表 13.2]中，`cat` 和 `dog` 两个对象从 `animal` 对象继承了\
  \ `eat()` 和 `drink()` 方法，以及 `name`、`color` 和 `age` 属性。因此，可以通过 `cat` 和 `dog` 对象访问所有内容。\n\
  \n```\nconst animal = {\n  name: '',\n  color: 'Brown',\n  age: 0,\n  eat: function(food)\
  \ {\n    console.log('Chow chow, ' + food + '!');\n  },\n  drink: function(drink)\
  \ {\n    console.log('Mmmmmmh, ' + drink + '!');\n  }\n}\nconst cat = Object.create(animal);\
  \  // 对象继承了 ...\ncat.eat('cat food');                // ... 方法 ...\ncat.drink('milk');\n\
  console.log(cat.color);             // ... 以及原型的属性。\nconst dog = Object.create(animal);\n\
  dog.eat('meat');                    // 输出: 'Chow, chow, meat!' \ndog.drink('water');\
  \                 // 输出: 'Mmmmmmh, water!'\nconsole.log(dog.color);            \
  \ // 输出: 'Brown' \n```\n\n**列表 13.2** 在原型继承中，对象继承自其他对象\n\n### 13.2.4 在继承对象中定义方法和属性\n\
  \n当然，在继承自原型的对象上定义额外的属性和方法也是可能的。例如，在[列表 13.3]中，`cat` 对象获得了新的 `meow()` 方法，而 `dog`\
  \ 对象获得了新的 `bark()` 方法。当然，这两个方法仅在各自的对象上可用：例如，`meow()` 方法无法在 `dog` 对象上调用，反之，`bark()`\
  \ 方法无法在 `cat` 对象上调用。\n\n\n\n\n\n```javascript\nconst animal = {\n  name: 'default',\n\
  \  color: 'Brown',\n  age: 0,\n  eat: function(food) {\n    console.log('Chow chow,\
  \ ' + food + '!');\n  },\n  drink: function(drink) {\n    console.log('Mmmmmmh,\
  \ ' + drink + '!');\n  }\n}\nconst cat = Object.create(animal);\ncat.meow = function()\
  \ {\n  console.log('Meowwwww!');\n}\ncat.eat('cat food');              // Output:\
  \ 'Chow, chow, cat food!'\ncat.drink('Milk');                // Output: 'Mmmmmmh,\
  \ milk!'\ncat.meow();  // Output: 'Meowwwww!'\nconsole.log(cat.color);         \
  \  // Output: 'Brown'\nconst dog = Object.create(animal);\ndog.bark = function()\
  \ {\n  console.log('Woof woof!');\n}\ndog.eat('meat');                  // Output:\
  \ 'Chow, chow, meat!' \ndog.drink('water');               // Output: 'Mmmmmmh, water!'\n\
  dog.bark();  // Output: 'Woof woof!'\nconsole.log(dog.color);           // Output:\
  \ 'Brown' \n```\n\n**Listing 13.3** 继承的对象可以定义新的方法和属性\n\n### 13.2.5 覆盖方法\n\n类，或者在原型对象编程的情况下，即继承层次结构中位置较低的对象，比继承层次结构中位置较高的对象更特殊。或者反过来说：层次结构中位置较高的类/对象比位置较低的更具抽象性。\n\
  \n特殊行为的产生，一方面是因为——正如我们刚刚看到的——新方法被添加到了类或对象中；但另一方面，也是因为继承的方法被覆盖了。\n\nListing 13.4\
  \ 显示了这方面的例子。之前的代码通过一个新对象 `vegetarianDog` 进行了扩展，该对象派自 `dog`。由于素食狗不吃肉，`eat()` 方法经过了相应的修改和覆盖：如果传递给方法的字符串包含\
  \ `meat` 值，它将返回一个相应的错误。\n\n所以，如果你现在对 `vegetarianDog` 对象调用 `eat()` 方法，使用的将正是这个方法，而不是\
  \ `animal` 对象中定义的方法。\n\n#### 注意\n\n`animal` 对象上的 `eat()` 方法显然不受对 `vegetarianDog`\
  \ 对象改变的影响。\n\n```javascript\nconst animal = {\n  name: '',\n  color: 'Brown',\n\
  \  age: 0,\n  eat: function(food) {\n    console.log('Chow chow, ' + food + '!');\n\
  \  },\n  drink: function(drink) {\n    console.log('Mmmmmmh, ' + drink + '!');\n\
  \  }\n}\nconst cat = Object.create(animal);\ncat.meow = function() {\n  console.log('Meowwwww!');\n\
  }\nconst dog = Object.create(animal);\ndog.bark = function() {\n  console.log('Woof\
  \ woof!');\n}\nconst vegetarianDog = Object.create(dog);\nvegetarianDog.eat = function(food)\
  \ {\n  if(food.indexOf('meat') >= 0 || food.indexOf('meat') >= 0) {\n    throw new\
  \ Error('I don’t eat meat!');\n  } else {\n    console.log('Chow chow, ' + food\
  \ + '!');\n  }\n} \nvegetarianDog.eat('cheese'); \n```\n\n**Listing 13.4** 在派生对象中覆盖方法\n\
  \n### 13.2.6 原型链\n\n对象通过原型链从其原型或所有之前的原型继承属性和方法。其过程如下：如果你访问一个对象的属性或方法，JavaScript\
  \ 解释器会首先检查该对象是否具有相应的属性/方法。如果是，则使用该属性/方法。如果不是，则访问对象的原型（存储在 `__proto__` 等属性中）。如果该属性/方法在那里也不存在，则检查原型的原型，依此类推，直到在某处到达基类\
  \ `Object` 对象（参见图 13.5）。\n\n参考图 13.5 中以（稍微修改过的）对象图形式所示示例，这意味着例如，如果你如 Listing 13.5\
  \ 所示对 `vegetarianDog` 对象调用 `eat()` 方法，它不会沿着原型链向上查找，因为该方法直接定义在对象上。相反，如果你调用 `bark()`\
  \ 方法，它会通过原型链向上一级到达 `dog` 对象。如果你调用 `drink()` 方法，它会向上两个级别到达 `animal` 对象。如果调用 `toString()`\
  \ 方法，它甚至会一直上到 `Object` 对象，因为只有那里定义了该方法。\n\n#### 注意\n\n因此，原型链是一个对象链，链中的每个对象都作为该链中后续对象的原型。\n\
  \n![原型链示例](img/img-f13.5.html)\n\n**图 13.5** 原型链的示例\n\n```javascript\n...\nvegetarianDog.eat('cheese');\
  \    // 存在于 vegetarionDog\nvegetarianDog.bark();           // 存在于 dog\nvegetarianDog.drink('water');\
  \   // 存在于 animal\nvegetarianDog.toString();       // 存在于 Object \n```\n\n**Listing\
  \ 13.5** 调用原型链中不同位置定义的方法\n\n### 13.2.7 调用原型的方法\n\n要调用对象原型形的方法，你必须先获取该对象的原型。原则上，你有两种方法：一方面，对象的原型存储在它的\
  \ `__proto__` 属性中；另一方面，你可以使用 `Object.getPrototypeOf()` 方法来确定对象的原型。因此，Listing 13.6\
  \ 和 Listing 13.7 中所示的两种都是有效的，尽管出于可读性考虑，我们建议你使用后者。\n\n在每种情况下发生了什么？在两种情况下，都首先通过上述路径访问当前对象（即\
  \ `vegetarianDog`）的原型，然后调用 `eat()` 方法，并在此基础上调用 `call()` 方法（参见第 4 章）。记住：这个方法对所有函数或方法默认可用，它的作用除了在特定上下文中执行相应的函数/方法外什么都不做。你将此执行上下文作为第一个参数传递给它；可选地，如示例所示，你可以传递更多参数，用于调用原始函数/方法。\n\
  \n```javascript\nconst vegetarianDog = Object.create(dog);\nvegetarianDog.eat =\
  \ function(food) {\n  if(food.indexOf('meat') >= 0 || food.indexOf('meat') >= 0)\
  \ {\n    throw new Error('I don’t eat meat!');\n  } else {\n    this.__proto__.eat.call(this,\
  \ food);\n  }\n}\nvegetarianDog.eat('cheese'); \n```\n\n**Listing 13.6** 通过 `__proto__`\
  \ 属性访问调用原型的方法\n\n```javascript\nconst vegetarianDog = Object.create(dog);\nvegetarianDog.eat\
  \ = function(food) {\n  if(food.indexOf('meat') >= 0 || food.indexOf('meat') >=\
  \ 0) {\n    throw new Error('I don’t eat meat!');\n  } else {\n    Object.getPrototypeOf(this).eat.call(this,\
  \ food);\n  }\n}\nvegetarianDog.eat('cheese'); \n```\n\n**Listing 13.7** 通过 getPrototypeOf()\
  \ 方法访问调用原型的方法\n\n### 13.2.8 原型对象编程与面向对象的原则\n\n最后，让我们简要总结一下开头提到的面向对象编程的基本原则如何在原型对象编程中实现的。\n\
  \n\n\n\n\n第一原则——即不同对象实例间共同行为的抽象——是基于这些行为是在原型（prototype）中实现的。这种行为还通过原型链派生对象来继承（在这方面，继承原则同样得到了）。\n\
  \n在 JavaScript 中，只有通过设计模式才能实现真正的数据封装，我们在这里还没有讨论这一点。但是，可以使用 `get` 和 `set` 关键字定义访问器属性，从而以某种方式控制对数据属性的访问，或使用属性属性对属性进行进一步配置（参见第\
  \ 4 章）。\n\n多态在 JavaScript 中是固有的，因为例如它对作为函数参数的类型没有内置限制。\n\n## 13.3 伪类面向对象\n\n与原型型面向对象不同，伪类面向对象基于构造函数的使用。其理念是让使用\
  \ JavaScript 进行面向对象编程感觉就像在进行基于类的编程。\n\n### 13.3.1 定义构造函数\n\n记住：构造函数无非就是“普通”函数。它们只有在带有\
  \ `new` 前缀被调用时，才会变成构造函数。此外，它们通常使用大驼峰命名法（UpperCamelCase）编写（从而遵循了良好的软件开发规范）。在构造函数内部，`this`\
  \ 关键字指向调用构造函数时创建的对象。构造函数的示例见列表 13.8。\n\n```javascript\nfunction Animal(name, color,\
  \ age) {\n  this.name = name;\n  this.color = color;\n  this.age = age;\n}; \n```\n\
  \n**列表 13.8** 可作为构造函数调用的函数定义\n\n### 13.3.2 创建对象实例\n\n要使用构造函数创建新对象实例，如所述，使用 `new`\
  \ 关键字调用构造函数。例如，在列表 13.9 中，了 `Animal` 的新实例，将 `Fishy`、`Green` 和 `2` 作为参数传递并将它们设置为创建实例上相应属性的值。\n\
  \n```javascript\nconst fish = new Animal('Fishy', 'Green', 2);\nconsole.log(fish.name);\
  \   // 输出: \"Fishy\"\nconsole.log(fish.color);  // 输出: \"Green\"\nconsole.log(fish.age);\
  \    // 输出: 2 \n```\n\n**列表 13.9** 使用构造函数创建对象实例\n\n### 13.3.3 定义方法\n\n为了为使用构造函数创建的所有对象实例创建通用方法，你需要在作为构造函数所创建的对象实例的原型的对象上定义它们。该对象存储在相应构造函数的\
  \ `prototype` 属性中。例如，在列表 13.10 中，`eat()` 和 `drink()` 方法被定义在 `Animal` 构造函数的原型对象上。随后，可以在\
  \ `fish` 对象实例上调用这两个方法。\n\n```javascript\nAnimal.prototype.eat = function(food) {\n\
  \  console.log('Chow chow, ' + food + '!');\n}\nAnimal.prototype.drink = function(drink)\
  \ {\n  console.log('Mmmmmmh, ' + drink + '!');\n}\nconst fish = new Animal('Fishy',\
  \ 'Green', 2);\nfish.eat('Algae');       // 输出: 'Chow Chow, algae!'\nfish.drink('water');\
  \     // 输出: 'Mmmmmmh, water!' \n```\n\n**列表 13.10** 方法的定义与调用\n\n### 13.3.4 从对象派生\n\
  \n伪类继承中的继承原则并不那么容易理解。所以，让我们用列表 13.11 所示的示例来解释它。为了更好地理解，你可以并行查看图 13.6 到图 13.11；这些每幅图都以类图的形式图形表示了相应代码行后\
  \ JavaScript 对象的状态（即使在这种情况下它们不是真实的类）。\n\n```javascript\n// 步骤 1\nfunction Animal(name,\
  \ color, age) {\n  this.name = name;\n  this.color = color;\n  this.age = age;\n\
  };\n// 步骤 2\nAnimal.prototype.eat = function(food) {\n  console.log('Chow chow,\
  \ ' + food);\n}\nAnimal.prototype.drink = function(drink) {\n  console.log('Mmmmmmh,\
  \ ' + drink);\n}\n// 步骤 3\nfunction Dog(name, color, age, type) {\n  Animal.call(this,\
  \ name, color, age);\n  this.type = type;\n};\n// 步骤 4\nDog.prototype = new Animal();\n\
  // 步骤 5\nDog.prototype.constructor = Dog;\n// 步骤 6\nDog.prototype.bark = function()\
  \ {\n  console.log('Woof woof');\n}\nconst bello = new Dog('Bello', 'White', 2,\
  \ 'Maltese');\nbello.bark();      // 输出: \"Woof woof\" \n```\n\n**列表 13.11** 构造函数在类继承中使用\n\
  \n首先，你定义了作为构造函数的 `Animal` 函数（步骤 1）。然而，隐地发生的事情比定义一个函数要得多。代码 `function Animal(...)`\
  \ 还导致了一个对象的创建，该对象存储在构造函数的 `prototype` 属性中，并反通过 `constructor` 属性链接到构造函数（参见图 13.6）。\n\
  \n**图 13.6** 步骤 1：定义 Animal 函数后的状态\n\n正如所述，`Animal.prototype` 对象是调用 `Animal` 构造函数时创建的对象的原型。在第二步中，方法现在被定义在这个原型上——在本例中，即\
  \ `eat()` 和 `drink()` 方法（参见图 13.7）。我们刚刚讨论过这一点。\n\n**图 13.7** 步骤 2：在原型上定义 eat() 和\
  \ drink() 方法\n\n在第三步中，继承方面变得有趣起来：事实上，现在我们正在讨论创建一个 `Animal` 的“子类”。为了这个目的，示例中定义了 `Dog`\
  \ 构造函数。图 13.8 显示了之后的状态。如你所示，`Dog` “类”和 `Animal` “类”之间还没有链接。你必须作为开发者手动创建这个链接。（顺便说：我们稍后会解释\
  \ `Animal.call(this, name, color, age)` 到底做了什么。）\n\n**图 13.8** 步骤 3：Dog 构造函数\n\n\
  \n\n\n\n从 `Dog` “类”到 `Animal` “类”的链接是通过原型对象之间的连接实现的——即从 `Dog.prototype` 到 `Animal.prototype`\
  \ 的连接。第 4 步中的代码 `Dog.prototype = new Animal();` 首先确保 `Dog.prototype` 引用了一个全新的对象，而该对象反过来又引用\
  \ `Animal.prototype` 对象作为其原型。对象的当前状态如图图 13.9 所示。\n\n![步骤 4：重新定义 Dog 原型](img/img-f13.9.html)\n\
  \n**图 13.9**&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;步骤\
  \ 4：重新定义 Dog 原型\n\n在这里你也可以看到，新的 `Dog.prototype` 对象与“旧的” `Dog.prototype` 对象相比，没有\
  \ `constructor` 属性，因此与 `Dog` 对象之间没有连接。这在第 5 步中得到了修正（参见图 13.10）。\n\n![步骤 5：将原型链接到构造函数](img/img-f13.10.html)\n\
  \n**图 13.10**&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;步骤\
  \ 5：将原型链接到构造函数\n\n最后，你定义了“子类”的方法——即 `Dog.prototype` 对象上的方法（第 6 步和图 13.11）。在这里，重要的是必须在\
  \ `Dog.prototype` 被重新定义**之后**才添加属性和方法（参见第 4 步）；否则它们将被定义在旧的 `Dog.prototype` 对象上并导致丢失。\n\
  \n![步骤 6：在原型上定义 bark() 方法](img/img-f13.11.html)\n\n**图 13.11**&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;步骤\
  \ 6：在原型上定义 `bark()` 方法\n\n图 13.11 因此此也展示了对象的最终状态：`Dog` 和 `Animal` 作为构造函数（或“类”），可以根据\
  \ `Dog.prototype` 和 `Animal.prototype` 原型创建新的对象实例。\n\n正如你后面将看到的，基于此，调用“父类”的构造函数和方法等技术也容易理解。\n\
  \n### 13.3.5 调用“父类”的构造函数\n\n要调用“父类”的构造函数，你只需要使用 `call()` 方法调用相应的构造函数，将 `this` 作为执行上下文，并可选地传递其他参数。列表\
  \ 13.12 显示了上一个列表中的相应片段，即在 `Dog` 构造函数中调用 `Animal` 构造函数。\n\n```\nfunction Dog(name,\
  \ color, age, type) {\n  Animal.call(this, name, color, age);\n  this.type = type;\n\
  }; \n```\n\n**列表 13.12**&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;调用“父类”的构造函数\n\
  \n### 13.3.6 重写方法\n\n要重写“子类”中的方法，你只需要在“子类”对应构造函数的底层的原型上定义对应的方法。例如，在列表 13.13 中，在\
  \ `VegetarianDog` “类”中，`eat()` 方法用之前节已知的逻辑进行了重写。\n\n```javascript\nfunction VegetarianDog(name,\
  \ color, age, type) {\n  Dog.call(this, name, color, age);\n  this.type = type;\n\
  };\nVegetarianDog.prototype.eat = function(food) {\n  if(food.indexOf('meat') >=\
  \ 0 || food.indexOf('meat') >= 0) {\n    throw new Error('I don’t eat meat!');\n\
  \  } else {\n    console.log('Chow chow, ' + food);\n  }\n} \n```\n\n**列表 13.13**&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;重写“子类”中的方法\
  \ \n\n### 13.3.7 调用“父类”的方法\n\n调用“父类”方法的方法与使用 `call()` 方法调用构造函数的方式类似。例如，在列表 13.14\
  \ 中，在 `VegetarianDog` “类”的 `eat()` 方法中调用了 `Animal` “类”的 `eat()` 方法。\n\n```javascript\n\
  function VegetarianDog(name, color, age, type) {\n  Dog.call(this, name, color,\
  \ age);\n  this.type = type;\n};\nVegetarianDog.prototype.eat = function(food) {\n\
  \  if(food.indexOf('meat') >= 0 || food.indexOf('meat') >= 0) {\n    throw new Error('I\
  \ don’t eat meat!');\n  } else {\n    Dog.prototype.eat.call(this, food);\n  }\n\
  } \nconst vegetarianDog = new VegetarianDog('Bella', 'White', 2, 'Maltese');\nvegetarianDog.eat('bread');\
  \ \n```\n\n**列表 13.14**&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;调用“父类”的方法\n\
  \n### 13.3.8 伪类面向对象方法与面向对象方法的原理\n\n行为的抽象是通过构造函数及其底层的原型提供的。伪类面向对象的方法中也可以实现继承，但它相对复杂。关于数据封装和多态性，情况与原型面向对象的方法相同。\n\
  \n## 13.4 使用类语法的面向对象\n\n自 ES2015 以来，新的类语法也引入了 ECMAScript 标准。正如前面提到的，这种类语法并不允许真正的基于类的编程，但由于使用的关键字和语法等原因，它感觉上相当相似。然而，类语法实际上只是掉了伪类面向对象方法的部分复杂性，因为对象和原型在后台仍在工作。\n\
  \n#### 注意\n\n来自 Java 等语言的开发者会对类语法感到格外亲切。尽管如此，作为一个 JavaScript 开发者，理解并掌握真正支撑 JavaScript\
  \ 语言的概念（如原型面向对象）对你来说是非常重要的。\n\n### 13.4.1 定义类\n\n要在 JavaScript 中定义“类”，你需要像列表 13.15\
  \ 所示使用 `class` 关键字（类声明）。在该关键字之后，编写类名，后跟一对括号来定义类的体（类体）。在类体内部，随后可以定义类的属性和方法（但注意，ES2022\
  \ 才能这样定义属性）。\n\n```javascript\nclass Animal {\n\n  name = 'John Sample Fish';\n\
  \  color = 'Gold';\n  age = '25';\n\n  constructor(name, color, age) {\n    this.name\
  \ = name ? name : this.name;\n    this.color = color ? color : this.color;\n   \
  \ this.age = age ? age : this.age;\n  }\n\n  eat(food) {\n    console.log(`Chow\
  \ chow, ${food}`);\n  }\n\n  drink(drink) {\n    console.log(`Mmmmmmh, ${drink}`);\n\
  \  }\n\n  toString() {\n    return `${this.name}, ${this.color}, ${this.age}`;\n\
  \  }\n\n} \n```\n\n**列表 13.15**&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;类示例\n\
  \n#### 类表达式\n\n除了类声明外，你仍然可以通过类表达式来定义类的选项。类被赋值给变量，稍后只能通过该变量名进行引用（参见列表 13.16）。`class`\
  \ 关键字后面的类名是可选的，且仅适用于类内部。\n\n\n\n\n\n```javascript\nconst AnimalClass = class Animal\
  \ {\n\n  name = 'John Sample Fish';\n  color = 'Gold';\n  age = '25';\n\n  constructor(name,\
  \ color, age) {\n    this.name = name ? name : this.name;\n    this.color = color\
  \ ? color : this.color;\n    this.age = age ? age : this.age;\n  }\n\n  eat(food)\
  \ {\n    console.log(`Chow chow, ${food}`);\n  }\n\n  drink(drink) {\n    console.log(`Mmmmmmh,\
  \ ${drink}`);\n  }\n\n  toString() {\n    return `${this.name}, ${this.color}, ${this.age}`;\n\
  \  }\n\n}\n```\n\n列表 13.16 类表达式的使用\n\n`constructor()` 方法在类中扮演着特殊角色，因为在创建“类”的新新对象实例时，该方法总是会被调用（将在下一节中详细介绍）。从原则上讲，这大致对应于一个构造函数：`constructor()`\
  \ 隐式地返回一个新的对象实例。在 `constructor()` 方法内部（以及像 `toString()` 示例中的其他方法中），你可以通过 `this`\
  \ 关键字访问该对象实例。在示例中，`name`、`color` 和 `age` 属性在 `constructor()` 方法中使用传入的构造参数被覆盖。三元运算符确保了只有当相应的参数也包含值时，才会覆盖相应的属性。\n\
  \n#### 注意\n\n`constructor()` 方法也被称为相应“类”的构造函数。\n\n### 13.4.2 创建对象实例\n\n要创建一个“类”的对象实例，请使用\
  \ `new` 关键字，正如你从构造函数中所了解的，以及如列表 13.17` 确保创建了一个 `Animal` 的新实例，其 `name` 属性具有默认值 `John\
  \ Sample Fish`，`color` 属性值为 `Gold`，`age` 属性值为 `25`（因为没有向构造函数传递任何参数）。另一方面，第二次调用构造函数将创建一个对象实例，其中的属性接收作为构造函数参数传递的值。\n\
  \n```javascript\nconst defaultAnimal = new Animal();\nconsole.log(defaultAnimal.toString());\
  \ // \"John Sample Fish, gold, 25\"\n\nconst fish = new Animal('Fishy', 'Green',\
  \ 2);\nfish.eat('Algen');                     // \"Chow chow, algae\"\nconsole.log(fish.toString());\
  \          // \"Fishy, Green, 2\" \n```\n\n列表 13.17 使用“类”创建对象实例并调用对象方法\n\n### 13.4.3\
  \ 定义 Getter (访问器) 和 Setter (赋值)\n\n在第 4 章中，你学习了可以使用 `get` 和 `set` 关键字在对象上定义 getter\
  \ 和 setter 方法。你也可以结合“类”结合使用相同的关键字来在类中定义 getter 和 setter。这方面的示例如列表 13.18 所示。这两个关键字像往常一样写在相应方法的名称之前。\n\
  \n还需要注意的是，相应的 getter 或 setter 方法名称与相应的属性名称不同，以防止无限递归、相关的栈溢出，从而导致相应程序崩溃。这里的一种方案是在属性名称前加上下划线（`_name`、`_color`、`_age`），如列表\
  \ 13.18 所示。\n\n```javascript\nclass Animal {\n\n  _name = 'John Sample Fish';\n\
  \  _color = 'Gold';\n  _age = '25';\n\n  constructor(name, color, age) {\n    this._name\
  \ = name ? name : this._name;\n    this._color = color ? color : this._color;\n\
  \    this._age = age ? age : this._age;\n  }\n\n  get name() {\n    return this._name;\n\
  \  }\n\n  set name(name) {\n    this._name = name;\n  }\n\n  get color() {\n   \
  \ return this._color;\n  }\n\n  set color(color) {\n    this._color = color;\n \
  \ }\n\n  get age() {\n    return this._age;\n  }\n\n  set age(age) {\n    this._age\
  \ = age;\n  }\n\n  eat(food) {\n    console.log(`Chow chow, ${food}`);\n  }\n\n\
  \  drink(drink) {\n    console.log(`Mmmmmmh, ${drink}`);\n  }\n\n  toString() {\n\
  \    return `${this._name}, ${this._color}, ${this._age}`;\n  }\n\n}\n\nconst snake\
  \ = new Animal('Hissy', 'Green', 5);\nconsole.log(snake.name);  // \"Hissy\"\nconsole.log(snake.color);\
  \ // \"Green\"\nconsole.log(snake.age);   // 5 \n```\n\n列表 13.18 Getter 和 Setter\
  \ 的定义\n\n### 13.4.4 定义私有属性和私有方法\n\n在属性前加上下划线显然只是表示该属性是私有的某种约定。下划线本身并防止从外部（即从对象外部）访问或覆盖属性。列表\
  \ 13.19 清楚地说明了这一点：所示代码是前一个列表的扩展，显示了三个“私有”属性（`_name`、`_color`、`_age`）可以被轻松用新值覆盖。\n\
  \n```javascript\nclass Animal {\n\n  _name = 'John Sample Fish';\n  _color = 'Gold';\n\
  \  _age = '25';\n\n  constructor(name, color, age) {\n    this._name = name ? name\
  \ : this._name;\n    this._color = color ? color : this._color;\n    this._age =\
  \ age ? age : this._age;\n  }\n\n  // 往常的 Setter 和 getter 方法\n\n  eat(food) {\n\
  \    console.log(`Chow chow, ${food}`);\n  }\n\n  drink(drink) {\n    console.log(`Mmmmmmh,\
  \ ${drink}`);\n  }\n\n  toString() {\n    return `${this._name}, ${this._color},\
  \ ${this._age}`;\n  }\n\n}\n\nconst snake = new Animal('Hissy', 'Green', 5);\nconsole.log(snake.name);\
  \  // \"Hissy\"\nconsole.log(snake.color); // \"Green\"\nconsole.log(snake.age);\
  \   // 5\n\nsnake._name = 4711;\nsnake._color = 'hello world';\nsnake._age = 'twenty';\n\
  \nconsole.log(snake.name);  // 4711\nconsole.log(snake.color); // \"hello world\"\
  \nconsole.log(snake.age);   // \"twenty\" \n```\n\n列表 13.19 此处并未从外部覆盖对象属性\n\n随着\
  \ ES2022，JavaScript 引入了真正的私有属性（和私有方法）。然而，这种语法需要一些时间来适应。并不是使用直观的关键字（如 Java 中提供的 `private`），而是在\
  \ JavaScript 中，私有属性通过在相应属性名称前加上 `#` 符号来标记。私有属性只能在对象属性的初始化部分、构造函数和对象方法中被访问，如列表 13.20\
  \ 所示。另一方面，从外部访问私有属性将导致 `SyntaxError`。\n\n\n\n\n\n```javascript\nclass Animal {\n\
  \n  #name = 'John Sample Fish';\n  #color = 'Gold';\n  #age = '25';\n\n  constructor(name,\
  \ color, age) {\n    this.#name = name ? name : this.#name;\n    this.#color = color\
  \ ? color : this.#color;\n    this.#age = age ? age : this.#age;\n  }\n\n  get name()\
  \ {\n    return this.#name;\n  }\n\n  set name(name) {\n    this.#name = name;\n\
  \  }\n\n  get color() {\n    return this.#color;\n  }\n\n  set color(color) {\n\
  \    this.#color = color;\n  }\n\n  get age() {\n    return this.#age;\n  }\n\n\
  \  set age(age) {\n    this.#age = age;\n  }\n\n  eat(food) {\n    console.log(`Chow\
  \ chow, ${food}`);\n  }\n\n  drink(drink) {\n    console.log(`Mmmmmmh, ${drink}`);\n\
  \  }\n\n  toString() {\n    return `${this.#name}, ${this.#color}, ${this.#age}`;\n\
  \  }\n\n}\n\nconst snake = new Animal('Hissy', 'Green', 5);\nconsole.log(snake.name);\
  \  // \"Hissy\"\nconsole.log(snake.color); // \"Green\"\nconsole.log(snake.age);\
  \   // 5\n\n// snake.#name = 4711;           // SyntaxError\n// snake.#color = 'hello\
  \ world'; // SyntaxError\n// snake.#age = 'twenty';        // SyntaxError \n```\n\
  \n**Listing 13.20** 私有属性无法从外部访问或覆盖\n\n与私有属性一样，你也可以将私有方法标记为私有。也就是说，你只需要在方法名前前加上 `#`\
  \ 字符（参见 Listing 13.21）。在访问方面，情况与私有属性相同：只有构造函数和其他对象方法可以访问私有方法。\n\n```javascript\n\
  class Animal {\n\n  #name = 'John Sample Fish';\n  #color = 'Gold';\n  #age = '25';\n\
  \n  constructor(name, color, age) {\n    this.#name = name ? name : this._name;\n\
  \    this.#color = color ? color : this._color;\n    this.#age = age ? age : this._age;\n\
  \  }\n\n  // 常规的 Setter 和 getter 方法\n\n  #eat(food) {\n    console.log(`Chow chow,\
  \ ${food}`);\n  }\n\n  #drink(drink) {\n    console.log(`Mmmmmmh, ${drink}`);\n\
  \  }\n\n  toString() {\n    return `${this.#name}, ${this.#color}, ${this.#age}`;\n\
  \  }\n\n}\n\nconst snake = new Animal('Hissy', 'Green', 5);\n// snake.#eat('bird');\
  \ // SyntaxError\n// snake.#drink('water'); // SyntaxError \n```\n\n**Listing 13.21**\
  \ 私有方法无法从外部调用（或覆盖）\n\n### 13.4.5 从“类”派生\n\n使用 `extends` 关键字，可以让一个“类”继承或派自另一个“类”。如\
  \ Listing 13.22 所示，该关键字只需写在（新的）“类”之后即可继承；关键字后跟着要继承的“类”的名称。如果你像 Listing 13.22 那样创建一个“子类”的实例，它将拥有“父类”中定义的方法以及“子类”中定义的方法。\n\
  \n```javascript\n...\nclass Dog extends Animal {\n\n  _type;\n\n  constructor(name,\
  \ color, age, type) {\n    super(name, color, age);\n    this._type = type ? type\
  \ : this._type;\n  }\n\n  get type() {\n    return this._type;\n  }\n\n  set type(type)\
  \ {\n    this._type = type;\n  }\n\n  bark() {\n    console.log('Woof woof');\n\
  \  }\n}\n\nconst dog = new Dog('Bello', 'White', 2, 'Maltese');\ndog.eat('cheese');\
  \     // \"Chow chow, cheese\"\ndog.bark();            // \"Woof woof\"\nconsole.log(dog.type);\
  \ // \"Maltese\" \n```\n\n**Listing 13.22** 派生类的示例\n\n在派生“类”的构造函数内部，可以通过 `super()`\
  \ 调用“父类”的构造函数（父构造函数）。顺便提一下，在构造函数内部访问 `this` 之前执行此操作是非常重要的。否则将会发生错误（更准确地说，会发生 `ReferenceError`），如\
  \ Listing 13.23 所示。\n\n```javascript\n...\nclass Dog extends Animal {\n\n  _type;\n\
  \n  constructor(name, color, age, type) {\n    this._type = type ? type : this._type;\
  \    // Error: this is not defined!\n    super(name, color, age);\n  }\n\n  get\
  \ type() {\n    return this._type;\n  }\n\n  set type(type) {\n    this._type =\
  \ type;\n  }\n\n  bark() {\n    console.log('Woof woof');\n  }\n}\n\nconst dog =\
  \ new Dog('Bello', 'White', 2, 'Maltese'); // Error!\ndog.eat('cheese'); \ndog.bark();\n\
  console.log(dog.type); \n```\n\n**Listing 13.23** 在访问 This 之前必须调用“父类”的构造函数\n\n如果在构造函数中完全省略了对父构造函数的调用，情况也是如此。因此，Listing\
  \ 13.24 也会导致错误。\n\n```javascript\n...\nclass Dog extends Animal {\n\n  _type;\n\n\
  \  constructor(name, color, age, type) {\n    // error, no call of parent constructor\n\
  \  }\n\n  get type() {\n    return this._type;\n  }\n\n  set type(type) {\n    this._type\
  \ = type;\n  }\n\n  bark() {\n    console.log('Woof woof');\n  }\n}\n\nconst dog\
  \ = new Dog('Bello', 'White', 2, 'Maltese'); // Error!\ndog.eat('cheese'); \ndog.bark();\n\
  console.log(dog.type); \n```\n\n**Listing 13.24** 必须省略父构造函数的调用\n\n然而，完全省略一个“类”的构造函数——即\
  \ `constructor()` 方法是可能的。在这种情况下，将一个构造函数将所有参数传递给父构造函数（参见 Listing 13.25）。但在示例中，这确保了\
  \ `_type` 属性没有被初始化（因为这之前在 `Animal` 类的构造函数中发生过），因此它保留了值 `undefined`。\n\n```javascript\n\
  ...\nclass Dog extends Animal {\n\n  _type;\n\n  // 使用了以下构造函数：\n  // constructor(...args)\
  \ {\n  //   super(...args);\n  // }\n\n  get type() {\n    return this._type;\n\
  \  }\n\n  set type(type) {\n    this._type = type;\n  }\n\n  bark() {\n    console.log('Woof\
  \ woof');\n  }\n}\n\nconst dog = new Dog('Bello', 'White', 2, 'Maltese');\ndog.eat('cheese');\
  \     // \"Chow chow, cheese\"\ndog.bark();            // \"Woof woof\"\nconsole.log(dog.type);\
  \ // undefined \n```\n\n**Listing 13.25** 构造函数可以省略\n\n#### 类语法创建与伪类对象面向相同的结构\n\n\
  `Animal`（参见 Listing 13.18）和 `Dog`（参见 Listing 13.22）“类”内部生成的结构与可行的伪类对象面向（参见 图 13.11）完全对应。\n\
  \n#### 从标准类派生\n\n从 ES2015 开始，也可以从 `Error` 和 `Array` 等标准对象派生。例如，在 Listing 13.26 中，`InvalidValueError`\
  \ “类”作为 `Error` 的“子类”被创建：它带有特定的错误消息调用父构造函数，并在 `value` 属性中记录了无效值。\n\n```javascript\n\
  class InvalidValueError extends Error {\n  constructor(value) {\n    super(`Invalid\
  \ value: ${value}`);\n    this.value = value;\n  }\n\n  get value() {\n    return\
  \ this._value;\n  }\n\n  set value(value) {\n    this._value = value;\n  }\n}\n\n\
  throw new InvalidValueError(5);\n```\n\n**Listing 13.26** 标准对象如 Error 也可以派生\n\n\
  ### 13.4.6 覆盖方法\n\n\n\n\n\n要在“子类”中重写一个方法，你只需定义一个与被重写方法同名的相应方法即可。示例可以在列表 13.27、列表\
  \ 13.28 以及列表 13.29 中找到。与其他类型面向对象编程示例一样，目标是创建一个派自 `Dog` 并重写 `eat()` 方法的新 `VegetarianDog`\
  \ 类。\n\n为了让这个示例更具面向对象，并将 `eat()` 方法更改为接收对象实例而不是字符串作为参数，你首先为食物创建一个简单的类层次结构（参见列表 13.27）。它由`Food`“基类”以及`Meat`和`Bread`两个“子类”组成。作为参数，构造函数期望字符串形式的相应食物的描述。`toString()`\
  \ 方法仅返回此描述，这还确保了 `Animal`“类”中 `eat()`方法的控制输出不需要调整，并能继续产生良好的输出。\n\n```\nclass Food\
  \ {\n\n  _description\n\n  constructor(description) {\n    this._description = description\
  \ ? description : this._description;\n  }\n\n  get description() {\n    return this._description;\n\
  \  }\n\n  set description(description) {\n    this._description = description;\n\
  \  }\n\n  toString() {\n    return this.description;\n  }\n\n}\nclass Meat extends\
  \ Food {}\n\nclass Bread extends Food {}\n\nconst bread = new Bread('wheat bread');\n\
  console.log(bread.description);      // \"wheat bread\"\nconst meat = new Meat('steak');\n\
  console.log(meat.description);       // \"steak\" \n```\n\n**列表 13.27** 一个简单的食物的对象模型\n\
  \n列表 13.28 随后显示了`VegetarianDog`“类”。现在，在`eat()`方法内部（与其他类型面向对象编程示例一样），并不检查字符串中是否包含`Meat`或`meat`值；只检查传递的参数是否是`Meat`“类”的实例。如果是的话，则抛出错误；否则，生成适当的输出。\n\
  \n```\nclass VegetarianDog extends Dog {\n\n  eat(food) {\n    if (food instanceof\
  \ Meat) {\n      throw new Error('I don't eat meat!');\n    } else {\n      console.log(`Chow\
  \ chow, ${food.description}!`);\n    }\n  }\n\n} \n```\n\n**列表 13.28** 重写方法\n\n\
  随后，可以如列表 13.29 所示调用该方法，每次都传递`Food`（或其“子类”）的实例。\n\n```\nconst dog = new VegetarianDog('Bello',\
  \ 'White', 2, 'Maltese');\ndog.eat(new Bread('wheat bread')); // \"Chow, chow, wheat\
  \ bread!\"\ndog.eat(new Meat('steak'));        // Error: \"I don't eat meat!\" \n\
  ```\n\n**列表 13.29** 调用被重写的方法\n\n###### 注意\n\n这里显示的结构使用单独的“类”来表示食物，这比使用字符串并在字符串中搜索特定值更符合面向对象的思想。\n\
  \n### 13.4.7 调用“父类”的方法\n\n如果你想在方法内部调用同类“类”的另一个方法，可以通过`this`关键字来实现。另一方面，如果你想在方法内部特异地调用“父类”的方法，则要使用`super`关键字，可以来说，它是对“父类”的引用。参考之前的示例，例如你可以在`VegetarianDog`“类”中复用`Animal`“父类”的`eat()`方法，专门用于传递给方法的食物不是肉的情况。列表\
  \ 13.30 展示了这是如何工作的。\n\n```\nclass VegetarianDog extends Dog {\n\n  eat(food) {\n\
  \    if (food instanceof Meat) {\n      throw new Error('I don’t eat meat!');\n\
  \    } else {\n      super.eat(food);\n    }\n  }\n\n}\n\nconst dog = new VegetarianDog('Bello',\
  \ 'White', 2, 'Maltese');\ndog.eat(new Bread('wheat bread')); // \"Chow, Chow, wheat\
  \ bread!\"\ndog.eat(new Meat('steak'));        // Error: \"I don't eat meat!\" \n\
  ```\n\n**列表 13.30** 调用“父类”的方法\n\n###### 避免重复代码\n\n这种类型复用的优点是避免了重复代码。例如，如果要在`eat()`方法中更改输出，只需要在一个地方进行——即`Animal`“类”中。但如果你保持列表\
  \ 13.28 中的代码不变，则必须调整输出。\n\n###### 访问“父类”的方法\n\n你也可以通过`this`访问“父类”的方法，但前提是相应方法在“子类”中不存在。\n\
  \n### 13.4.8 定义静态方法\n\n在面向对象编程中，静态方法是直接在类上而不是对象实例上调的方法。如果你想使用它们来提供在主题上属于类但并不一定需要对象实例的功能，那么静态方法总是合适的。在\
  \ JavaScript 语法中，你通过在方法前加上`static`关键字来将其定义为静态。随后，可以通过“类”直接调用该方法。在列表 13.31 中，定义了静态的`getAnimalColors()`方法，它返回一个带有预定义颜色值的对象。该方法只能在`Animal`“类”上调用，不能在其对象实例上调用。\n\
  \n```\nclass Animal {\n\n  _name = 'John Fish';\n  _color = 'Gold';\n  _age = '25';\n\
  \n  constructor(name, color, age) {\n    this._name = name ? name : this._name;\n\
  \    this._color = color ? color : this._color;\n    this._age = age ? age : this._age;\n\
  \  }\n\n  static getAnimalColors() {\n    return { \n      WHITE: 'White',\n   \
  \   BLACK: 'Black',\n      BROWN: 'Brown', \n      GREEN: 'Green',\n      YELLOW:\
  \ 'Yellow',\n      ORANGE: 'Orange'\n    }\n  }\n\n  ...\n\n}\n\nconsole.log(Animal.getAnimalColors());\n\
  // {\n  WHITE: 'White',\n  BLACK: 'Black',\n  BROWN: 'Brown',\n  GREEN: 'Green',\n\
  \  YELLOW: 'Yellow',\n  ORANGE: 'Orange'\n}\nconst bird = new Animal('Birdie', Animal.getAnimalColors().BLACK,\
  \ 5);\nconsole.log(bird.name);  // \"Birdie\"\nconsole.log(bird.color); // \"Black\"\
  \nconsole.log(bird.age);   // 5\n// console.log(bird.getAnimalColors()); // error\
  \ because method is static \n```\n\n**列表 13.31** 静态方法的定义和调用\n\n###### 静态方法是函数对象上的方法\n\
  \n由于包含`static`关键字的类语法最终只是伪类面向对象编程的语法改进，因此静态方法实际上是定义在构造函数相应的函数对象上的方法，而静态属性实际上是函数对象的属性。\n\
  \n\n\n\n\n### 13.4.9 定义静态属性\n\n除了静态方法外，面向对象还包含了静态属性的概念。与静态方法类似，静态属性直接定义在类上，你不需要对象实例即可访问这些属性。在列表\
  \ 13.32 中，为 `Animal` 类添加了一个静态的 `ANIMAL_COLORS` 属性。\n\n```javascript\nclass Animal\
  \ {\n\n  _name = 'John Sample Fish';\n  _color = 'Gold';\n  _age = '25';\n\n  static\
  \ ANIMAL_COLORS = {\n    WHITE: 'White',\n    BLACK: 'Black',\n    BROWN: 'Brown',\n\
  \    GREEN: 'Green',\n    YELLOW: 'Yellow',\n    ORANGE: 'Orange'\n  }\n\n  constructor(name,\
  \ color, age) {\n    this._name = name ? name : this._name;\n    this._color = color\
  \ ? color : this._color;\n    this._age = age ? age : this._age;\n  }\n\n  ...\n\
  \n}\n\nconsole.log(Animal.ANIMAL_COLORS);\n// {\n//   WHITE: 'White',\n//   BLACK:\
  \ 'Black',\n//   BROWN: 'Brown',\n//   GREEN: 'Green',\n//   YELLOW: 'Yellow',\n\
  //   ORANGE: 'Orange'\n// }\nconst bird = new Animal('Birdie', Animal.ANIMAL_COLORS.BLACK,\
  \ 5);\nconsole.log(bird.name);  // \"Birdie\"\nconsole.log(bird.color); // \"Black\"\
  \nconsole.log(bird.age);   // 5\n// console.log(bird.ANIMAL_COLORS); // undefined\
  \ \n```\n\n列表 13.32 使用关键字定义静态属性\n\n#### 注意\n\n在类体内显式定义静态属性的选项仍然相对较新（ES2022），且在本书时（2021\
  \ 年 6 月）尚未被所有浏览器或运行时环境支持（了解某个功能是否受支持的好地方是访问网站 [`kangax.github.io/compat-table/es2016plus`](https://kangax.github.io/compat-table/es2016plus)）。不过，作为使用\
  \ `static` 关键字的替代方案，你也可以通过在类语法之外将其定义为“类”的属性来“模拟”静态属性，如列表 13.33 所示。\n\n```javascript\n\
  Animal.ANIMAL_COLORS = { \n  WHITE: 'White',\n  BLACK: 'Black',\n  BROWN: 'Brown',\
  \ \n  GREEN: 'Green',\n  YELLOW: 'Yellow',\n  ORANGE: 'Orange'\n}\nconsole.log(Animal.ANIMAL_COLORS);\n\
  // {\n//   WHITE: 'White',\n//   BLACK: 'Black',\n//   BROWN: 'Brown',\n//   GREEN:\
  \ 'Green',\n//   YELLOW: 'Yellow',\n//   ORANGE: 'Orange'\n// }\nconst bird = new\
  \ Animal('Birdie', Animal.ANIMAL_COLORS.BLACK, 5);\nconsole.log(bird.name);  //\
  \ \"Birdie\"\nconsole.log(bird.color); // \"Black\"\nconsole.log(bird.age);   //\
  \ 5\n// console.log(bird.ANIMAL_COLORS); // undefined \n```\n\n列表 13.33 不使用关键字定义和调用静态属性\n\
  \n### 13.4.10 类语法与面向对象的原则\n\n由于类语法是伪类面向对象的一种简化，这里的情况与那里类似，但对开发者来说实现起来更简单：：在这里，不再使用构造函数，而是将抽象行为分组到“类”中，使得相应“类”的对象实例可以继承这些行为。\n\
  \n通过 `extends` 关键字定义继承关系也比伪类面向对象的方法更简单。然而，对于数据封装，目前还没有特殊的原生方法来限制属性和方法的可见性，例如，除目前为止提到的原型链和伪类面向对象的选项外没有。对于多态性，与其他类型的面向对象的情况也是如此。\n\
  \n## 13.5 总结\n\n本章引入了通用的面向对象概念，特别是 JavaScript 中的面向对象编程。你应该从本章中掌握以下几点：\n\n*   面向对象编程基于以下四个原则（以及其他原则）：\n\
  \    *   **抽象 (Abstraction)**\n        对象的抽象行为在类或原型中被总结。\n    *   **数据封装 (Data encapsulation)**\n\
  \        属性和方法以类或原型的形式封装，并对外部访问隐藏。\n    *   **继承 (Inheritance)**\n        属性和方法可以从一个类继承到另一个类，或从一个对象继承到另一个对象。\n\
  \    *   **多态 (Polymorphism)**\n        对象根据其用途呈现不同的类型。\n\n*   在 JavaScript 中，有几种类型的面向对象编程：\n\
  \    *   **原型面向对象 (Prototypical object orientation)**\n        这是 JavaScript 语言中最自然的面向对象类型。在这个过程中，对象是基于其他对象创建的。这些其他对象也被称为原型。\n\
  \    *   **伪类面向对象 (Pseudoclassical object orientation)**\n        这种面向对象类型，你假装 JavaScript\
  \ 是一种基于类的编程语言。在这里使用了构造函数。总的来说，开发者按照这种方法进行编程相当复杂。\n    *   **使用类语法的面向对象 (Object orientation\
  \ with class syntax)**\n        这种类型的面向对象代表了伪类面向对象的语法简化。可以使用 `class` 关键字定义“类”，使用\
  \ `extends` 关键字定义继承关系。此外，使用 `static` 关键字定义静态方法。\n\n# 14 函数式编程\n\n除了上一章介绍的面向对象编程外，函数式编程是另一种重要的编程范式，在\
  \ JavaScript 中起着核心作用。在本章中，我们将简要介绍各种函数概念。更复杂的话题超本书的范围。\n\nJavaScript 是一种包含了面向对象编程概念（你在上一章看到的）和函数式编程概念的编程语言。但函数式编程到底是什么？它和面向对象编程有什么区别？我们将在本章回答这些等方面问题，并展示如何使用\
  \ JavaScript 进行函数式编程。\n\n## 14.1 函数式编程原则\n\n函数式编程与其他范范一样，遵循不同的原则或具有特殊的特性。本质上如下：\n\
  \n*   **原则 1：函数是一等对象 (Functions are first-class objects)**\n    函数是一等对象（也被称为一等公民）。你在第\
  \ 4 章中看到了这意味着：函数可以像其他对象和原始值一样赋值给变量，并可以作为其他函数的参数或返回值。然而，在非函数式编程语言中，函数并没有表示为对象，因此无法这样处理它们。\n\
  \n*   **原则 2：函数处理不可变数据结构 (Functions work with immutable data structures)**\n   \
  \ 函数式编程中的数据结构通常是不可变的或不会被改变。相反，对数据结构的操作会在需要时创建新的数据结构并将其作为结果返回。例如在纯函数式编程语言中，一旦创建了列表或其他数据结构，就无法再更改（或只能通过间接方式）。顺便说，JavaScript\
  \ 不是纯函数式编程语言，这就是为什么在这里可以随时更改数组。\n\n*   **原则 3：函数没有副作用 (Functions have no side effects)**\n\
  \    将上一点进一步推导，另一个事实是，函数式编程中的函数通常完全没有副作用，表现得更像数学函数。这意味着函数式编程中的函数对于相同的输入总是返回相同的结果，但不会触发任何副作用。在纯函数式语言中，副作用已经由语言本身阻止了。JavaScript\
  \ 作为一种不是纯函数式的编程语言，允许函数对相同的输入返回不同的结果。\n\n\n\n\n\n# 原则 4：函数式程序是声明式的\n\n命令式编程是一种编程范式，你向计算机提供非常精确的指令，告知如何解决问题。命令式程序使用显式的循环语句（`while`\
  \ 循环、`for` 循环等）、条件语句（`if-else`）以及这些语句的序列（到本书为止，我们一直是在函数内部进行命令式编程的）。\n\n另一方面，函数式程序是声明式的，这意味着你作为开发者，制定程序时更多是在描述“应该做什么”。因此，函数式程序通常比相应的命令式代码更具可读性、更有意义且更紧凑。在第\
  \ 14.2 节中，我们将通过一些示例来这一点。\n\n图 14.1 了如何对函数式编程范式进行分类。\n\n与面向对象的编程不同，函数式编程关注的是函数而不是对象。JavaScript\
  \ 结合了两种编程范式。例如，你可以以面向对象的方式构建程序——即与对象交互——然后在对象方法内部转而使用函数式编程。\n\n![函数式编程原理](img/img-f14.1.html)\n\
  \n**图 14.1** 函数式编程原理\n\n### 备注\n函数式程序通常比面向对象或命令式编程中的相应变体更精简。\n\n### 函数式编程语言\n（几乎）纯函数式编程语言的示例包括\
  \ Haskell、Lisp 和 Miranda。如前所述，JavaScript 并不是纯函数式编程语言。例如，数组等数据结构在定义后仍然可以被修改，而在 Haskell\
  \ 中，这种操作是不允许的。\n\n## 14.2 命令式编程与函数式编程\n\n在本节中，我们将向你展示函数式编程相比命令式编程的优势。为了实现这一点，我们将介绍\
  \ JavaScript 数组提供的四种方法：\n\n*   用于遍历数组的 `forEach()` 方法（我们在第 4 章中讨论过）\n*   `map()`\
  \ 方法，用于将一个数组的元素映射到另一个数组的新元素\n*   `filter()` 方法，用于过滤数组中的元素\n*   `reduce()` 方法，用于将数组元素归约为一个单个值\n\
  \n### 14.2.1 使用 forEach() 方法迭代\n\n如果你想通过数组或列表进行迭代，你有几种（命令式的）选项，你已经在本书中学习过它们（例如，在第\
  \ 3 章中）：\n\n*   通过 `for` 循环\n*   通过 `while` 循环\n*   通过 `do-while` 循环\n*   通过 `for-in`\
  \ 循环\n*   通过 `for-of` 循环\n\n列表 14.1 再次展示了如何使用 `for` 循环输出数组元素。这里遍历的数组包含各种对象，这些对象反过来包含关于各种艺术家的信息（艺术家的名称及其出版的专辑）。\n\
  \n列表 14.1 中的源代码本应该输出数组的每个值。这应该是预期的结果。然而，代码实际上过于关注整个过程应该是如何工作的：初始化计数器变量、检查终止条件、基于索引访问数组，然后增加计数器变量。\n\
  \n如你所见，命令式程序包含许多额外代码（样板代码），这并不能提高程序的可读性，反而让它变得臃肿。无疑，作为开发者，你一定想避免这种情况。\n\n```javascript\n\
  const artists = [\n  {\n    name: 'Kyuss',\n    albums: [\n      { title: 'Wretch',\
  \ year: 1991 },\n      { title: 'Blues', year: 1992 },\n      { title: 'Welcome',\
  \ year: 1994 },\n      { title: 'And the Circus', year: 1995 }\n    ]\n  },\n  {\n\
  \    name: 'Ben Harper',\n    albums: [\n      { title: 'The Live', year: 1997 },\n\
  \      { title: 'Burn', year: 1999 },\n      { title: 'Live from Mars', year: 2001\
  \ },\n      { title: 'Diamonds on the Inside', year: 2003 }\n    ]\n  }\n];\nfor(let\
  \ i=0; i<artists.length; i++) {\n  console.log(artists[i].name);\n}\n```\n**列表 14.1**\
  \ 使用普通循环的命令式迭代\n\n使用函数式编程，问题通常可以用更具可读性的方式制定。对于给的问题，如列表 14.2 所示，`forEach()` 方法要合适得多。作为参数，你向它传递一个函数（回调函数），该函数会对每个元素调用，并带有三个参数：元素、索引和数组。\n\
  \n```javascript\nartists.forEach(\n  // 每个元素调用的函数\n  artist,               // (1)\
  \ 当前元素\n  index,                // (2) 元素的索引\n  artists               // (3) 整个数组\n\
  \  ) => {\n    console.log(artist.name);\n  }\n);\n```\n**列表 14.2** 使用 forEach()\
  \ 方法的函数式迭代\n\n尽管代码的行数并不一定短（相反，它更长，但这仅仅是因为格式的原因），但它已经易读得多。与命令式变体相比，现在的重点是程序的逻辑（做什么），而不是循环（怎么做）。如果你去掉列表\
  \ 14.2 => {\n  console.log(artist.name);\n});\n```\n**列表 14.3** 去掉注释并调整格式后，示例变得更加易读\n\
  \n如果你传递的是一个命名函数而不是匿名函数，如列表 14.4 {\n  console.log(artist.name);\n}\nartists.forEach(printName);\n\
  ```\n**列表 14.4** 用命名函数代替匿名函数进一步提高了可读性\n\n### 备注\n使用 `forEach()` 方法，你可以相对轻松地遍历数组的元素。与\
  \ `for` 循环等命令式代码变体相比，因此代码更容易读。\n\n\n\n\n通常情况下，你不仅想遍历数组的元素，还想同时为每个元素确定一个值并存储在另一个数组中——例如，计算自然数数组中每个数字的平方，或者（没那么无聊的）从对象数组中读取每个对象的某个属性，并将对应的值复制到新数组中。\n\
  \n让我们以 Listing 14.1 中的对象模型为例。假设我们要从那里显示的艺术家对象数组中，将艺术家的名称复制到一个新数组里。用命令式编程的方法，你可能会如\
  \ Listing 14.5 所示通过这种方式解决问题。\n\n```\nconst artistNames = [];\nfor(let i=0; i<artists.length;\
  \ i++) {\n  artistNames.push(artists[i].name);\n}\nconsole.log(artistNames);  //\
  \ ['Kyuss', 'Ben Harper'] \n```\n\n**Listing 14.5** 使用普通 for 循环的命令式映射\n\n与上一节的示例一样，`for`\
  \ 循环在这里占据了代码的大部分部分，尽管它只是实现目的的手段。相反，使用 `map()` 方法，代码会变得意义得多（参见 Listing 14.6）。该方法接受一个函数作为参数，该函数会为数组中的每个元素调用一次。该函数的返回值决定了写入目标数组对应元素的值。\n\
  \n```\nconst artistNames = artists.map(\n  (                        // 为每个元素调用函数\n\
  \    artist,                // (1) 当前元素\n    index,                 // (2) 当前元素的索引\n\
  \    artists                // (3) 整个数组\n  ) => {\n    return artist.name;    //\
  \ 返回值决定了\n                           // 结果数组中的新值\n  }\n);\nconsole.log(artistNames);\
  \  // ['Kyuss', 'Ben Harper'] \n```\n\n**Listing 14.6** 使用 map() 方法的功能式映射\n\n###\
  \ 注意\n\n使用 `map()` 方法，你可以根据现有数组创建一个新数组，它会为源数组中的每个元素调用指定的映射函数，并将其返回值放入目标数组。\n\n###\
  \ 14.2.3 使用 filter() 方法过滤值\n\n在第 4 章中，你学习了如何使用 `indexOf()` 和 `lastIndexOf()` 方法在数组中搜索元素。记住：如果传递的元素出现在数组中，这些方法将确定该元素的索引；如果元素未出现在数组中，则返回值\
  \ `-1`。\n\n但使用 `filter()` 方法可以更加灵活。作为一个示例，让我们取一个包含各种对象的数组，每个对象代表一张音乐专辑。从这个数组开始，过滤掉所有在千禧年之前发行的专辑。\n\
  \n### 注意\n\n出于教学考虑，Listing 14.7 中的对象模型结构与之前的示例略有不同。\n\n```\nconst albums = [\n \
  \ {\n    title: 'Push the Sky Away',\n    artist: 'Nick Cave',\n    year: 2013\n\
  \  },\n  {\n    title: 'No more shall we part',\n    artist: 'Nick Cave',\n    year:\
  \ 2001\n  },\n  {\n    title: 'Live from Mars',\n    artist: 'Ben Harper',\n   \
  \ year: 2003\n  },\n  {\n    title: 'The Will to Live',\n    artist: 'Ben Harper',\n\
  \    year: 1997\n  }\n]; \n```\n\n**Listing 14.7** 将用于过滤的简单对象\n\n用命令式的方法，你可能会如 Listing\
  \ 14.8 所示使用 `for` 循环来实现此任务。对于数组中的每个对象，在循环内部会检查其 `year` 属性是否小于 2000。如果是，则将元素添加到 `albums2000`\
  \ 结果数组中。\n\n```\nconst albums2000 = [];\nfor(let i=0; i<albums.length; i++) {\n\
  \  if(albums[i].year < 2000) {\n    albums2000.push(albums[i]);\n  }\n}\nconsole.log(albums2000.length);\
  \ \n```\n\n**Listing 14.8** 用命令式过滤数组元素\n\n使用 `filter()` 方法，这要简单得多。该参数是一个过滤函数。该方法返回一个包含所有过滤函数返回\
  \ `true` 的元素的数组。与 `map()` 和 `forEach()` 一一样，在回调函数内部，你再次可以访问当前元素及其索引，以及整个数组。它的返回值决定了这种情况：\n\
  \n```\nconst albums2000 = albums.filter(\n  (album,                          //\
  \ (1) 当前元素\n    index,                          // (2) 元素的索引\n    albums       \
  \                   // (3) 整个数组\n  ) => {\n    return album.year < 2000;\n  }\n\
  );\nconsole.log(albums2000.length); \n```\n\n**Listing 14.9** 使用 filter() 方法的功能式过滤\n\
  \n### 注意\n\n你可以使用 `filter()` 方法根据过滤函数从数组中过滤元素。该方法返回一个包含所有过滤函数返回 `true` 的元素的数组。\n\
  \n### 14.2.4 使用 reduce() 方法将多个值归约为值\n\n数组的另一个“功能式方法”是 `reduce()` 方法。该方法用于根据数组的元素确定一个单一值——也就是说，将数组的元素归约为单个值。\n\
  \n为了说明这种方法，假设根据 Listing 14.10 中的对象模型，需要确定所有专辑的数量（不是每个艺术家的，而是总数）。\n\n```\nconst artists\
  \ = [\n  {\n    name: 'Kyuss',\n    albums: [\n      {\n        title: 'Wretch',\n\
  \        year: 1991\n      },\n      {\n        title: 'Blues for the Red Sun',\n\
  \        year: 1992\n      },\n      {\n        title: 'Welcome to Sky Valley',\n\
  \        year: 1994\n      },\n      {\n        title: '...And the Circus Leaves\
  \ Town',\n        year: 1995\n      }\n    ]\n  },\n  {\n    name: 'Ben Harper',\n\
  \    albums: [\n      {\n        title: 'The Will to Live',\n        year: 1997\n\
  \      },\n      {\n        title: 'Burn to Shine',\n        year: 1999\n      },\n\
  \      {\n        title: 'Live from Mars',\n        year: 2001\n      },\n     \
  \ {\n        title: 'Diamonds on the Inside',\n        year: 2003\n      }\n   \
  \ ]\n  }\n]; \n```\n\n**Listing 14.10** 将作为归约基础的简单对象模型\n\n用命令式的方法，此问题可能会如 Listing\
  \ 14.11 所示通过 `for` 循环解决（顺便说一下，到目前为止它应该已经让你感到很烦了）。\n\n\n\n\n\n```\nlet totalAlbumCount\
  \ = 0;                        // 所有专辑的数量\nfor(let i=0, i<artists.length; i++) {\
  \           // 遍历所有艺术家:\n  const albumCount = artists[i].albums.length;  // 获取艺术家的...\n\
  \                                                // ...专辑数量...\n  totalAlbumCount\
  \ += albumCount;                // ...并增加...\n                                 \
  \               // ...总数。\n}\nconsole.log(totalAlbumCount);                   //\
  \ 8 \n```\n\n**Listing 14.11** 用于确定音乐专辑总数量的命令式变体\n\n通过 `reduce()` 方法，这种操作变得再次变得简单了。你传递一个函数作为参数（你现在已经了解其原理），该函数会像往常一样对数组中的每个元素进行调用。与之前讨论的其他方法一样，在传递的函数内部，你可以访问元素、索引以及整个数组。\n\
  \n此外，该函数还会接收上一次迭代的当前累加值作为参数。你可以可选地通过 `reduce()` 方法的第二个参数指定起始值。在示例中，累加的初始值为 `0`（参见\
  \ Listing 14.12）。\n\n对于 `artists` 数组中的每个元素，现在都会调用传递的函数，并将相应艺术家的专辑数量加上所有专辑的总数（`result`）中。\n\
  \n```\nconst totalAlbumCount = artists.reduce(       // reduce()-方法 ...\n  function(\
  \                         // ...期望一个回调函数。\n    result,                         //\
  \ (1) 当前中间结果\n    artist,                         // (2) 元素\n    index,        \
  \                  // (3) 元素在数组中的索引\n    artists                         // (4)\
  \ 数组\n  ) {\n    const albumCount = artist.albums.length;  // 艺术家的专辑数量\n    return\
  \ result + albumCount;               // 增加总计数\n  },\n  0                       \
  \          // 所有专辑的数量\n);\nconsole.log(totalAlbumCount);       // 8 \n```\n\n**Listing\
  \ 14.12** 用于确定音乐专辑总数量的函数式变体\n\n### Note\n\n`reduce()` 方法可以将数组中的元素或值归约为具有代表性的元素或值。\n\
  \n### 数组的其他函数式方法\n\n在此背景下，还有几种值得提到的数组方法，但此处不会进行详细讨论：\n\n* `every()` 方法可以用于检查数组中的每个元素是否符合所传递的回调函数定义的标准。\n\
  * `find()` 方法可以用于搜索第一个符合所传递的回调函数定义的元素。\n* `some()` 方法可以用于检查数组中至少有一个元素符合所传递的回调函数定义的标准。\n\
  * `reduceRight()` 方法原理上与 `reduce()` 方法类似，但它是从右到左遍历元素的，而不是从左到右。\n\n### 14.2.5 不同方法的组合\n\
  \n你可以看到，默认提供的这些数组方法已经让源代码变得更具可读性，并使问题的解决方案变得更加优雅。\n\n—例如，首先从艺术家数组中过滤出在 2000 年之后发布至少一张专辑的艺术家，然后“映射”（map）出这些艺术家的名称，最后对它们进行迭代。实现这一点的代码在函数式变体中极具可读性，特别是如果你为单个回调函数定义名称而不是匿名函数时（参见\
  \ Listing 14.13）。结果是，程序输出了字符串 `Ben Harper`，因为 Kyuss（不幸地）在 2000 年之后没有发布新专辑。\n\n```\n\
  function after2000(album) {\n  return album.year > 2000;\n}\nfunction hasAlbumAfter2000(artist)\
  \ {\n  return artist.albums.filter(after2000).length > 0;\n};\nfunction getArtistName(artist)\
  \ {\n  return artist.name;\n};\nfunction printName(name) {\n  console.log(name);\n\
  }\nartists\n  .filter(hasAlbumAfter2000)\n  .map(getArtistName)\n  .forEach(printName);\
  \ \n```\n\n**Listing 14.13** 所述方法的组合提供了具可读性的代码\n\n命令式的等价实现会冗长，并包含各种 `if` 查询和嵌套的\
  \ `for` 循环。我们目前暂跳过那部分代码。希望你已经产生了足够的兴趣来进一步深入接触函数式技术。\n\n## 14.3 总结\n\n在本章中，我们对 JavaScript\
  \ 的函数式编程进行了初步介绍。当然，函数式编程的主题比这里介绍的要复杂得多。\n\n如果你想学习更多关于这个主题，特别是它在 JavaScript 中的应用，请参考\
  \ Eric Elliott (2018) 编写的书籍《Composing Software: An Exploration of Functional Programming\
  \ and Object Composition in JavaScript》，它介绍了一些在 JavaScript 专业开发中常用的高级函数式技术。\n\n\
  从本章中，你应该掌握以下内容：\n\n* 在 JavaScript 中，函数是一等公民对象，这意味着它们可以赋值给变量，用函数的参数或返回值，并存储在数组中的值（例如）。\n\
  * 与面向对象的编程不同，函数式编程侧重于函数而不是对象。然而，两种编程范式完全可以结合。\n* 与命令式编程相比，命令式编程使用控制结构或语句以相对详细的方式告诉程序如何解决问题，而函数式编程程序倾向于描述正在做什么，这使得它们非常易读且自解释其义。\n\
  * 反映函数式概念（即对数据进行操作）的重要数组方法包括：\n    * `forEach()` 用于方便地遍历数组元素\n    * `map()` 将数组的元素映射到新值\n\
  \    * `filter()` 用于从数组中过滤元素\n    * `reduce()` 和 `reduceRight()` 将元素归约为单个值\n   \
  \ * `every()` 检查数组中的每个元素是否符合给定的标准\n    * `some()` 检查数组中至少有一个元素是否符合给定的标准\n\n# 15\
  \ 正确地结构化源代码\n\n软件项目变得越大，正确结构化源代码就越重要。这既是为了对代码有一个整体了解，并恰当数据封装数据和方法，为了避免在自己的源代码内部以及使用第三方库时变量、对象和函数之间的命名冲突。\n\
  \n\n\n\n\n默认情况下，自 ES2015 以来，JavaScript 提供了通过模块组合源代码的选项。但即使在过去，已经出现了各种设计模式和方法，可以用于实现这一需求。在本章中，出于历史原因和教学考量，我们将首先讨论这些设计模式，然后我们将更深入地介绍\
  \ ES2015 引入的原生模块。\n\n## 15.1 避免命名冲突\n\n当你开发一个稍微复杂的应用程序，且逻辑分布在多个 JavaScript 文件中时，或者你包含了无法控制其变量和函数命的第三方库时，你就应该开始考虑如何对源代码组件（变量、函数、对象等）进行分组了。毕竟，当所有内容都定义在全局层级时，很容易发生命名冲突。\n\
  \n图 15.1 显示了一个示例：两个 JavaScript 文件 `script1.js` 和 `script2.js` 分别定义了同名的变量（`MAX`）和同名的函数（`add()`）。只要这两个脚本分开使用的（从\
  \ `index1.html` 引入 `script1.js`，从 `index2.html` 引入 `script2.js`），就不会冲突。但一旦两个脚本被同时使用（在\
  \ `index3.html` 中），加载顺序就会决定变量 `MAX` 获得什么值，以及在两个函数中哪一个在 `add()` 名称下可用。\n\n在 C# 和\
  \ Java 等语言中，可以使用包（packages）和命名空间（namespaces）等功能对组件进行分组，使得在不同的包/命名空间内可以出现同名组件而互不影响。然而，JavaScript\
  \ 中既没有包也没有命名空间——但存在模拟命名空间的选项。这种技术被称为命名空间设计模式。\n\n![如果没有命名空间或某种形式的封装，不同脚本之间的命名冲突会迅速发生](img/img-f15.1.html)\n\
  \n**图 15.1** 如果没有命名空间或某种形式的封装，不同脚本之间的命名冲突会迅速发生\n\n这种思想是将相关的变量等内容合并到一个独立的对象中，该对象在应用程序中只存在一次，并作为一个简单的容器（参见图\
  \ 15.2）。这样，你至少为源代码引入了一些结构，并避免了在全局作用域中定义变量。只要这些容器对象具有全局唯一的名称（例如中的 `MathUtilities`\
  \ 和 `MoreMathUtilities`），这种方法就不会导致任何命名冲突。\n\n列表 15.1 显示了图 15.2 中所示组件的源代码。`MathUtilities`\
  \ 对象为 `MAX` 变量和 `add()` 函数形成了容器或命名空间；而 `MoreMathUtilities` 对象则为同名组件 `MAX` 和 `add()`\
  \ 形成了命名空间。然后通过容器对象访问这些变量和函数。\n\n```\nvar MathUtilities = MathUtilities || {}; \n\
  MathUtilities.MAX = 4711; \nMathUtilities.add = function(x, y) {\n  return x + y;\n\
  };\nvar result = MathUtilities.add(2, 2);\nconsole.log(result);            // 4\n\
  console.log(MathUtilities.MAX); // 4711\nMathUtilities.MAX = 2345;\nconsole.log(MathUtilities.MAX);\
  \ // 2345 \n```\n\n**列表 15.1** 命名空间设计模式\n\n![命名空间防止命名冲突](img/img-f15.2.html)\n\n\
  **图 15.2** 命名空间防止命名冲突\n\n#### 备注\n为了让后续列表尽可能真实，我们使用 `var` 关键字来创建变量，而不是 `let` 和 `const`\
  \ 关键字。支持较新关键字的 JavaScript 运行时环境通常也支持之前提到的原生模块，因此，在随后的设计模式中结合 `let` 将是非常不寻常的——或者在某些情况下根本无法工作（参见下一个备注框）。\n\
  \n根据 `var MathUtilities = MathUtilities || {};` 模式进行的调用，防止了可能已经存在的 `MathUtilities`\
  \ 对象不被覆盖。\n\n在更紧凑的对象字面量表示中，整个结构看起来如列表 15.2 所示。\n\n```\nvar MathUtilities = MathUtilities\
  \ || { \n  MAX: 4711,\n  add: function(x, y) {\n    return x + y;\n  }\n}; \n```\n\
  \n**列表 15.2** 对象字面量表示法命名空间设计模式\n\n#### 备注\n使用 `let` 关键字的表示（即 `let = MathUtilities\
  \ || {}`）在这种情况下不起作用；它会产生 `ReferenceError`。\n\n#### 备注\n命名空间设计模式并防止相应容器对象的变量、函数等从外部被重置（覆盖）（另参见列表\
  \ 15.1）。\n\n现在，当然，在为容器对象命名时，你可能会选择一个已经存在同名变量的名字（例如在包含的 JavaScript 库中）。为了解决这个问题，在实践中，如[列表\
  \ 15.3](#15_001.html_l15.3）和[列表 15.4](#15_001.html_l15.4）所示，命名空间也可以嵌套（嵌套命名空间），使用从\
  \ Java 或 C# 中已知的约定，根据各自项目部署反向写的域名。\n\n```\nvar de = de || {};\nde.philipackermann\
  \ = de.philipackermann || {};\nde.philipackermann.javascript = de.philipackermann.javascript\
  \ || {}; \n```\n\n**列表 15.3** 嵌套命名空间设计模式\n\n```\nvar de = de || { \n  philipackermann\
  \ : {\n    javascript : { }\n  } \n}; \n```\n\n**列表 15.4** 对象字面量表示法嵌套命名空间设计模式\n\n\
  #### 带有域名的命名空间的优势\n使用反向写的域名作为命名空间结构基础的优势在于，域名在全球范围内是唯一的。这确保了世界上没有其他开发者使用相同的命名空间（假设所有人都遵循这一约定）。\n\
  \n通过命名空间设计模式，命名冲突问题得到了解决，但正如你所看到的，变量和函数的可见性问题并没有解决。然而， true 信息隐藏（也称为数据封装）的概念，在建模对象时，向外部世界提供绝对必要的信息是有意义的。在下一节中，我们将引入模块设计模式，它可以像命名空间一样对单个组件进行分组，但也允许数据封装。\n\
  \n\n\n\n在此过程中，还出了两种准标准，它们的目标都是实现源代码的模块化：一方面是 `CommonJS`，它主要解决服务器端的模块使用问题——例如用于 `Node.js`\
  \ 环境；另一方面是异步模块定义 (AMD)，它用于在客户端部署模块——即那些在浏览器中使用的模块。\n\n在本节中，我们将介绍这些不同的概念和技术，以及目前仍然相对较新的原生模块支持。\n\
  \n### 15.2.1 模块设计模式\n\n长期以来，JavaScript 开发者如果想对源代码进行任何形式的结构化和模块化，必须自力为之。演变出的设计模式通常被称为模块设计模式。\n\
  \n#### 定义\n\n在软件开发中，设计模式（或模式）指的是某些代码模块，它们可以作为解决频繁出现问题的经过过的解决方案。每种编程范式和语言都有它们自己的设计模式。\n\
  \n模块设计模式基于刚刚介绍的命名空间设计模式，以及通过闭包（closures）和立即调用函数表达式（IIFEs）对数据进行封装，这两者都是相当高级的概念，我们在这里只进行简要介绍（在接下来的两个注释框中）。\n\
  \n#### 使用闭包\n\n闭包（也称为函数闭包）是由另一个函数返回的函数，它“封装”了该函数的变量和参数的值，并在虚拟上记住了它们。\n\n列表 15.5\
  \ 显示了一个使用闭包原理的代码示例。`counter()` 函数接收一个参数（`name`）并在第一行定义了一个变量（`i`）。该函数返回另一个函数作为返回值。这个返回的函数同时访问\
  \ `name` 参数和 `i` 变量。\n\n现在对 `counter()` 函数的每次调用都会创建一个函数，在每个情况下都“包含”当前的变量和参数赋值。因此，存储在变量\
  \ `counter1` 中的函数包含了包含了 `counter 1` 的值，而存储在变量 `counter2` 中的函数则包含了 `counter 2` 的值。重要的是，`counter()`\
  \ 函数返回的函数之间互不影响。调用 `counter1()` 会增加该函数可用的“包含”的变量 `i`，但不会影响 `counter2()` “包含”的变量\
  \ `i`。\n\n```javascript\nfunction counter(name) {\n  let i=0;\n  return function()\
  \ {\n    i++;\n    console.log(name + ': ' + i);\n  }\n}\nconst counter1 = counter('Counter\
  \ 1'); // 创建一个计数器\ncounter1();                            // Counter 1: 1\ncounter1();\
  \                            // Counter 1: 2\nconst counter2 = counter('Counter\
  \ 2'); // 创建一个计数器\ncounter2();                            // Counter 2: 1\ncounter2();\
  \                            // Counter 2: 2 \n```\n\n**列表 15.5** 在闭包中，外部函数的变量和参数被“封装”在内部函数中\n\
  \n#### 使用 IIFE\n\nIIFE 是在定义时被直接调用的函数。如列表 15.6 所示，函数在调用之前被两个括号包围。\n\n通过这种方式，解释器不会将函数视为声明（这在这种情况下会导致语法错误），而是将其视为表达式。\n\
  \n```javascript\n(function() {\n  console.log('This function is declared and called\
  \ immediately.')\n})();\n```\n\n**列表 15.6** 定义并直接调用函数的过程被称为 IIFE\n\n从原理上讲，列表 15.6\
  \ 中的代码与列表 15.7 中的代码作用相同。在这里，同样创建了一个函数然后直接调用它，但与 IIFE 有两点不同。第一个区别是它使用了两个独立的语句。第二个区别是\
  \ IIFE 是匿名的，因此只能被调用一次，而列表 15.7 中的函数因为有名称，可以被调用多次。\n\n```javascript\nconst namedFunction\
  \ = (function() {\n    console.log('This function is declared and called immediately.')\n\
  });\nnamedFunction();\n```\n\n**列表 15.7** IIFE 与此代码基本等价\n\nIIFE 通常用于为直接执行的代码定义一个独立的作用域。\n\
  \n模块设计模式的理念如下：通过 IIFE 的帮助，创建一个独立的作用域，这确保了模块的任何属性和函数都无法从外部访问。\n\nIIFE 还会返回一个包含模块提供的方法和属性的对象（导出对象——通俗，是公共\
  \ API）。该导出对象的方法可以访问模块内部定义的所有属性和函数（即在此定义了一个闭包）。\n\n列表 15.8 显示了该技术的简单示例。在这里你可以看到 `Module`\
  \ 模块，它包含两个变量 `x` 和 `y`，这两个变量仅在模块内部可见。IIFE 返回一个导出对象，该对象反过来包含 `getX()` 和 `getY()`\
  \ 方法，这是对上述两个（私有）变量的两个简单 getter 方法（见图 15.3）。\n\n```javascript\nvar Module = Module\
  \ || (function () { \n  // private variable\n  const x = 5;\n  // private variable\n\
  \  const y = 4711;\n  // public API\n  return {\n    // public function \n    getX:\
  \ function() {\n      return x;\n    },\n    // public function\n    getY: function()\
  \ {\n      return y;\n    }\n  } \n})();\nconsole.log(Module.getX());  // 5\nconsole.log(Module.getY());\
  \  // 4711\nModule.x = 888;\nModule.y = 888;\nconsole.log(Module.getX());  // 5\n\
  console.log(Module.getY());  // 4711 \n```\n\n**列表 15.8** 闭包与 IIFE 的模块设计模式\n\n**图\
  \ 15.3** 模块设计模式封装代码，允许某些变量保持私有\n\n现在只能从模块外部访问导出对象的方法——在本例中，即 `getX()` 和 `getY()`\
  \ 方法。如果你尝试覆盖私有属性（即 `x` 和 `y` 变量），如列表所示，这对变量没有影响。\n\n#### 命名空间设计模式上的 OR 操作\n\n这里有一个需要注意的小细节，你已经从命名空间设计模式中获了：模块开头的\
  \ OR 操作防止了模块被初始化多次。如果变量 `Module` 已经存在，则使用它；但如果不存在，则会调用 IIFE 并初始化一次模块。\n\n### 15.2.2\
  \ 暴露模块模块设计模式\n\n列表 15.8 的实现中另一个不太尽好的点是，如果你想在模块的方法内部调用同一个模块的其他方法，那么你必须始终在这些方法调用前加上模块名称。\n\
  \n\n\n\n\n例如，在 Listing 15.9 中，模块通过一个 `print()` 方法进行了扩展，该方法反过来调用了 `getX()` 和 `getY()`\
  \ 方法。这两个调用只有在对 `Module` 对象进行调用时才有效——即通过 `Module.getX()` 和 `Module.getY()` 调用。\n\n\
  ```javascript\nvar Module = Module || (function () { \n  const x = 5;\n  const y\
  \ = 4711;\n  return {\n    getX: function() {\n      return x;\n    },\n    getY:\
  \ function() {\n      return y;\n    },\n    // Access to own methods\n    print:\
  \ function() {\n      console.log(\n        'x: ' + \n        Module.getX() + \n\
  \        ', y: ' + \n        Module.getY()\n      )\n    }\n  } \n})(); \n```\n\n\
  **Listing 15.9** 经典模块设计模式中的函数调用\n\n为了解决这种不便，你可以使用一种通常被称为“暴露模块模式”（revealing module\
  \ pattern）的技巧。其思想是：要导出的方法不是定义在导出对象内部，而是定义在外部。在导出对象内部，你只需要引用该方法。\n\nListing 15.10\
  \ 展示了你如何使用这种技术在 `print()` 方法内部直接调用 `getX()` 和 `getY()` 方法，而无需加上模块名前。\n\n```javascript\n\
  var Module = Module || (function () { \n  const x = 5;\n  const y = 4711;\n  function\
  \ getX() {\n    return x;\n  }\n  function getY() {\n    return y;\n  }\n  function\
  \ print() {\n    console.log(\n      'x: ' + \n      getX() + \n      ', y: ' +\
  \ \n      getY()\n    )\n  }\n  // Return object contains only references.\n  return\
  \ {\n    getX: getX,\n getY: getY,\n print: print\n  } \n})();\nModule.print();\
  \ \n```\n\n**Listing 15.10** 暴露模块设计模式中的函数调用\n\n### 导入模块\n\n要在另一个模块内部导入模块，你只需将要导入的模块作为\
  \ IIFE（立即调用函数）的参数传递给另一个。例如，在 Listing 15.11 中，你可以看到两个模块：已知的 `Module` 模块（现在命名为 `ModuleA`）和新的\
  \ `ModuleB` 模块。通过将后者作为参数传递给另一个模块，可以在 `print()` 方法内访问 `ModuleB` 的 `printHelloWorld()`\
  \ 方法。如果你想导入多个模块，可以通过传递多个参数来继续这一过程。\n\n```javascript\nvar ModuleB = ModuleB || (function\
  \ () { \n  function printHelloWorld() {\n    console.log('Hello World');\n  }\n\
  \  return {\n    printHelloWorld: printHelloWorld\n  } \n})();\n\nvar ModuleA =\
  \ ModuleA || (function (moduleB) { \n  // 在模块内部，依赖项 ...\n  // ... 通过相应的 ...\n  //\
  \ ... 参数来获取。\n  const x = 5;\n  const y = 4711;\n  function getX() {\n    return\
  \ x;\n  }\n  function getY() {\n    return y;\n  }\n  function print() {\n    moduleB.printHelloWorld();\n\
  \    console.log(\n      'x: ' + \n      getX() + \n      ', y: ' + \n      getY()\n\
  \    )\n  }\n  return {\n    getX: getX,\n    getY: getY,\n    print: print\n  }\
  \ \n  // 依赖项作为参数传递。\n})(ModuleB);\nModuleA.print(); \n```\n\n**Listing 15.11** 导入模块\n\
  \n### 模块增强\n\n如果你想将一个模块的源代码分发到多个源文件中，可以使用一种小技巧，这种技术被称为“模块增强”（module augmentation）。要这样做，你只需将模块本身作为参数传递给\
  \ IIFE，添加属性和函数，最后使用模块本身作为返回值（参见 Listing 15.12）。\n\n```javascript\n// File 1\nvar\
  \ ModuleA = ModuleA || (function (moduleA) { \n  // 添加属性和函数\n  const x = 5;\n  const\
  \ y = 4711;\n  moduleA.getX = function() {\n    return x;\n  }\n  moduleA.getY =\
  \ function() {\n    return y;\n  }\n  // 模块本身作为返回值\n  return moduleA;\n  // 松散增强\n\
  })(ModuleA || {});\n\n// File 2\nvar ModuleA = (function (moduleA) { \n  // 添加属性和函数\n\
  \  moduleA.print = function() {\n    console.log(\n      'x: ' + \n      moduleA.getX()\
  \ + \n      ', y: ' + \n      moduleA.getY()\n    )\n  }\n  // 模块本身作为返回值\n  return\
  \ moduleA;\n  // 紧凑增强\n})(ModuleA);\n\n// File 3\nModuleA.print(); \n```\n\n**Listing\
  \ 15.12** 模块增强\n\n模块增强有两种变：松散增强（loose augmentation）和紧凑增强（tight augmentation）。使用松散增强，如果模块尚未创建，则将传递一个空对象作为参数（例如\
  \ Listing 15.12 中的 `ModuleA || {}`）。另一方面，紧凑增强假设模块已经存在（即：至少有另一个源文件已经加载）。这可以在 Listing\
  \ 15.12 中 `File 2` 注释下面的部分看到：这里只将 `ModuleA` 作为参数传递。在示例中，这是合理的，因为 `print()` 方法（定义在\
  \ `File 2` 中）依赖于 `getX()` 和 `getY()` 方法（后者又定义在 `File 1` 中）。\n\n松散增强的优点是，对模块贡献的脚本可以异步加载。哪个脚本先加载并不重要，因为在有万一的情况下，模块将被重新创建。紧凑增强则不然。在这里，应用程序假设在加载脚本时遵循特定的顺序。这样做的好处是，在一个文件中，你可以相信其他文件已经加载，并且添加到模块中的属性和方法已相应存在（例如\
  \ `print()` 方法中使用的 `getX()` 和 `getY()` 方法）。\n\n无论你使用哪种类型的模块增强，都有一个共同的缺点：为模块在一个源文件中定义的函数无法访问为同一模块的另一个源文件中定义的私有变量。例如，在\
  \ `print()` 方法（定义在 `File 2` 中）内部，无法直接访问 `x` 和 `y` 变量（定义在 `File 1` 中）。\n\n### 15.2.3\
  \ AMD\n\nAMD 是一种模块定义技术，通过异步加载来处理在浏览器中运行的应用程序。AMD 通过 `require.js` ([`requirejs.org`](http://requirejs.org))\
  \ 等实现。\n\nListing 15.13 展示了 AMD 中的模块定义。如果你仔细观察，可以识别出模块设计模式。要注册模块，可以使用 `define()`\
  \ 方法，它期望至少一个模块函数作为（第三个）参数，你在该中定义相应的模块。\n\n可选地，模块名称可以定义为第一个参数，当前模块所依赖的模块列表可以定义为第二个参数（在示例中为名为\
  \ `ModuleB` 的模块）。这些将作为模块内的参数可用（在示例中，通过 `moduleB`）。\n\n\n\n\n定义模块的函数（第三参数）返回一个表示公共\
  \ API 的对象，类似于模块设计模式。\n\n```javascript\n// Definition of ModuleA\ndefine(\n  'ModuleA',\
  \           // Name of the module\n  ['ModuleB'],         // Modules to be imported\n\
  \  function (moduleB) { // Function that defines the module\n    const x = 5;\n\
  \    const y = 4711;\n    const module = {\n      getX: function() {\n        return\
  \ x;\n      },\n      getY: function() {\n        return y;\n      },\n      print:\
  \ function() {\n        moduleB.printHelloWorld();\n        console.log(\n     \
  \     'x: ' + \n          this.getX() + \n          ', y: ' + \n          this.getY()\n\
  \        )\n      }\n    }\n    return module;\n  }\n);\n// Definition of 'ModuleB'\n\
  define(\n  'ModuleB',           // Name of the module\n  [],                  //\
  \ Modules to be imported\n  function () {        // Function that defines the module\n\
  \    const module = {\n      printHelloWorld: function() {\n        console.log('Hello\
  \ World');\n      }\n    }\n    return module;\n  }\n); \n```\n\n**Listing 15.13**\
  \ 使用 AMD 的模块定义\n\n为了包含模块，AMD 定义了 `require()` 函数，你可以在 Listing 15.14 中看到它的用法。与 `define()`\
  \ 一样，要包含的模块名称以数组的形式传递。相应的模块随后可以在代码中可用。\n\n```javascript\nrequire(['ModuleA'], function(moduleA){\n\
  \    moduleA.print();\n}); \n```\n\n**Listing 15.14** 使用 AMD 使用模块\n\n### 15.2.4\
  \ CommonJS\n\n与 AMD 不同，CommonJS（更准确地说，是它的模块规范；参见 [`wiki.commonjs.org/wiki/Modules/1.1`](http://wiki.commonjs.org/wiki/Modules/1.1)）处理服务器端的模块使用，例如用于\
  \ Node.js 中。\n\n在 Listing 15.15 中，你可以看到 CommonJS 与 AMD 相比更紧凑的模块定义。显而易，源代码并没有像 AMD\
  \ 那样封装在自己的 IIFE（立即调用函数表达式）中。CommonJS 的原理是将每个源代码文件本身视为一个独立的模块，具有其自己的作用域。在这样的作用范围内，本质上有三种不同的组件可用——`require()`\
  \ 方法、`exports` 对象和 `module` 对象：\n\n*   可以通过 `require()` 方法加载模块。相应模块的名称或路径被传递给该方法。例如，在\
  \ Listing 15.15 中，调用 `const moduleA = require('ModuleA')` 会将 `ModuleA.js` 文件或其中定义的模块加载到\
  \ `moduleA` 变量中。\n\n*   `exports` 对象表示导出对象——即公共 API。向该对象添加模块应该向外部提供的组件。例如，Listing\
  \ 15.15 导出了 `ModuleA` 中的 `print()` 方法和 `ModuleB` 中的 `printHelloWorld()` 方法。\n\n\
  *   `module` 对象（在示例中未使用）为当前模块提供额外的元信息，例如模块 ID 或查找模块的 URL。\n\n```javascript\n// File\
  \ \"ModuleA.js\"\n// Loading a module\nconst moduleB = require('ModuleB');\nconst\
  \ x = 5;\nconst y = 4711;\nfunction getX() {\n  return x;\n}\nfunction getY() {\n\
  \  return y;\n}\nfunction print() {\n  moduleB.printHelloWorld();\n  console.log(\n\
  \    'x: ' + \n    getX() + \n    ', y: ' + \n    getY()\n  );\n}\n// public API\n\
  exports.print = print; \n\n// File \"ModuleB.js\"\nfunction printHelloWorld() {\n\
  \  console.log('Hello World');\n}\n// public API\nexports.printHelloWorld = printHelloWorld;\
  \ \n\n// File \"main.js\"\n// Loading a module\nconst moduleA = require('ModuleA');\n\
  moduleA.print(); \n```\n\n**Listing 15.15** 使用 CommonJS 的模块定义\n\n### 15.2.5 原生模块\n\
  \n自 ES2015 以来，标准为 JavaScript 提供了原生的模块系统。这在标准相应的模块组件规范上体现了 AMD 和 CommonJS 之间的折中。因此，一方面，表示法与\
  \ CommonJS 同样紧凑（甚至更紧凑）；另一方面，可以同步（如 CommonJS）也可以异步（如 AMD）加载模块。因此，原生的 ES2015 模块既可以用于服务器端，也可以用于客户端。\n\
  \n#### 定义模块\n\n原生模块的原理与 CommonJS 相似：模块只是一个普通的脚本文件，你向其中“导出”模块要向外部世界提供的对象和函数。这种结构的导出可以通过多种方式实现：你可以显式地指定要导出的结构（这被称为命名导出；参见\
  \ Listing 15.16），或者指定一个单一默认导出，它大致代表模块的主体（参见 Listing 15.17）。在两种情况下，你都使用 `export`\
  \ 关键字。\n\n```javascript\n// File: logger.js\nexport function info(message) {\n \
  \ console.log(message);\n}\nexport function debug(message) {\n  console.debug(message);\n\
  }\nexport function warn(message) {\n  console.warn(message);\n}\nexport function\
  \ error(message) {\n  console.error(message);\n} \n```\n\n**Listing 15.16** 指定导出的定义\n\
  \n```javascript\n// File: Album.js\nexport default class Album {\n  constructor(artist,\
  \ title, year) {\n    this.interpret = interpret;\n    this.titel = titel;\n   \
  \ this.year = year;\n  }\n} \n```\n\n**Listing 15.17** 默认导出的定义\n\n默认导出的优势是，当你将相应的模块导入到另一个模块中（稍后会介绍）时，你不需要知道导出的结构在模块内部称什么。\n\
  \n###### 注意\n\n如果你想在 Node.js 下使用原生模块语法，需要在相应的 `package.json` 文件中将 `type` 条目设置为 `module`\
  \ 值。\n\n#### 导入模块\n\n导入模块有多种选项可用。假设之前在 Listing 15.16 中定义的模块存储在 `logger.js` 文件中。你可以直接导入该模块的各个命名导出，如\
  \ Listing 15.18 所示，指定 `import` 关键字和相应的命名导出。在示例中，导入的函数被赋值给当前模块中相同的变量。\n\n```javascript\n\
  import {\n  info, \n  debug, \n  warn, \n  Error\n} from './logger.js'\n\ninfo(4711);\
  \   // 调用 'logger' 模块的 'info' 函数 \ndebug(4711);  // 调用 'logger' 模块的 'debug' 函数\n\
  warn(4711);   // 调用 'logger' 模块的 'warn' 函数 \nerror(4711);  // 调用 'logger' 模块的 'error'\
  \ 函数 \n```\n\n**Listing 15.18** 从模块导入单个函数\n\n你还可以选择以不同的名称（别名）导入导出。这可以帮助，例如在“导入的导出”在各自模块中具有相同名称时避免命名冲突。要定义别名，使用\
  \ `as` 关键字，并在相应的导入导出后跟跟别名名称，如 Listing 15.19 所示。\n\n\n\n\n```javascript\nimport {\
  \               // 导入\n  info as i,           // ... 将 'info' 函数重命名为 'i'\n  debug\
  \ as d,          // ... 将 'debug' 函数重命名为 'd'\n  warn as w,           // ... 将 'warn'\
  \ 函数重命名为 'w'\n  error as e           // ... 将 'error' 函数重命名为 'e'\n} from './logger.js'\n\
  \ne(4711); // 调用 'logger' 模块的 error 函数 \n```\n\n列表 15.19 以不同的名称导入不同的导出内容\n\n如果你导入一个定义了默认导出（（之前讨论过）的模块，你可以像列表\
  \ 15.20 所示进行导入（导入的名称可以自由选择）。\n\n```javascript\nimport Album from './Album.js';\n\
  const album = new Album('Monster Magnet', 'Dopes to Infinity', 1994); \n```\n\n\
  列表 15.20 导入模块的默认组件\n\n### 动态导入模块\n\n`import` 关键字只能在顶层使用。因此，例如，你不能在 `if` 块或任何其他代码块中使用它。这也导致无法使用\
  \ `import` 关键字来动态导入模块。从 ES2020 开始，这个问题通过类似函数的 `import()` 得到了解决（它并不是真正的函数！）。\n\n\
  `import()` 语句用于动态加载模块，并将模块的路径作为参数传递。由于模块的导入是异步的，因此返回值是一个 promise 对象，可以像往常结合 `then()`/`catch()`\
  \ 或 `async`/`await` 使用（参见列表 15.21）。\n\n```javascript\n'use strict';\nconst loadModule\
  \ = true;\n\nif (loadModule) {\n  const moduleSpecifier = './logger.js';\n  import(moduleSpecifier)\n\
  \    .then(module => {\n      // 调用 'logger' 模块的 info 函数\n      module.info('Module\
  \ loaded dynamically!');\n      // 调用 'logger' 模块的 debug 函数\n      module.debug('Module\
  \ loaded dynamically!');\n      // 调用 'logger' 模块的 warn 函数\n      module.warn('Module\
  \ loaded dynamically!');\n      // 调用 'logger' 模块的 error 函数\n      module.error('Module\
  \ loaded dynamically!');\n    }).catch(error => {\n        console.error('Error\
  \ loading the module')\n    });\n} \n```\n\n列表 15.21 以不同的名称导入不同的组件\n\n#### 注意\n\n\
  动态导入模块的另一个优势是，要导入的模块路径也可以是动态定的。\n\n## 15.3 总结\n\n在 JavaScript 中，关于源代码的模块化有几种解决方案：\n\
  \n* 你可以使用命名空间设计模式来防止变量、对象、函数、类和其他组件之间的命名冲突。\n* 命名空间设计模式的原则基本上可以根据需要进行深度嵌套，在这种情况下，这被称为嵌套命名空间设计模式。\n\
  * 命名空间设计模式解决了命名冲突问题，但没有解决数据封装问题。另一方面，模块设计模式解决了这两个问题。\n* 模块设计模式存在不同的变体：经典模块设计模式和暴露模块设计模式（revealing\
  \ module design pattern）。\n* 除了模块设计模式，你还可以选择使用 AMD 或 CommonJS 来构建模块。前者异步加载模块，因此适用于浏览器环境；后者同步加载模块，因此更适用于独立于浏览器的应用程序。\n\
  * 然而，原生模块从 ES2015 开始才包含在 JavaScript 语言集中。\n* 从 ES2020 开始，也可以动态导入原生模块。\n\n表 15.1\
  \ 提供了 JavaScript 源代码模块化技术的比较。\n\n| | 语法 | 同步 | 异步 | 客户端 | 服务端 |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| 模块设计模式 | 较为复杂 | 紧耦合 | 松散耦合 | 是 | 是 |\n| CommonJS | 紧凑 |\
  \ 是 | 否 | 部分（但仅通过 Browserify 等工具） | 是 |\n| AMD | 复杂 | 否 | 是 | 是 | 否 |\n| 原生模块 (ES2015)\
  \ | 紧凑 | 是 | 是 | 是 | 是 |\n\n表 15.1 不同模块化技术的比较\n\n# 16 使用异步编程和其他高级特性\n\n在本章，我们将讨论异步编程。我们还将讨论其他对\
  \ JavaScript 开发有帮助的高级主题。\n\n让我们从异步编程开始。我们将看看它到底是什么，以及有哪些选项。然后我们将讨论属于高级编程分类的三个特性：迭代器（iterators）、生成器（generators）和代理（proxies）。\n\
  \n## 16.1 理解和使用异步编程\n\nJavaScript 开发的基本原则之一是异步编程，无论是构建 Ajax 请求还是（在本书后面的第 17 章所示：（异步的）`asyncFunction()`\
  \ 函数期望一个函数（`callbackFunction`）作为参数并在函数体内的某处调用它。\n\n```javascript\nfunction asyncFunction(callbackFunction)\
  \ {\n  // 此处更多代码\n  console.log('Prior to callback');\n  callbackFunction();\n \
  \ console.log('After callback');\n  // 此处更多代码\n}\nfunction callbackFunction() {\n\
  \  console.log('Calling callback');\n}\nasyncFunction(callbackFunction);\n// 输出:\n\
  // \"Prior to callback\"\n// \"Calling callback\"\n// \"After callback\" \n```\n\
  \n列表 16.1 回调模式的通用结构\n\n#### 传递函数而不是调用它们\n\n在处理回调时，避免列表 16.2 所示的疏忽错误。这种错误经常发生，导致本应作为回调函数的函数没有被传递，而是被调用了，其结果被错误地作为假设的回调函数传递。如果结果不是函数，会导致列表\
  \ 16.2 所示的 `object is not a function` 错误，并终止程序。\n\n```javascript\nasyncFunction(callbackFunction());\n\
  ```\n\n\n\n\n\n列表 16.2 注意：这里没有传递函数，而是调用了它！\n\n### 陷阱 1：异步函数的返回值\n\n异步函数不会通过 `return`\
  \ 关键字返回异步计算的结果，而是将其作为参数传递给回调函数（callback function）。让我们通过一个示例来说明这一点。为了这个目的，我们编写了一个简单的异步函数，它通过\
  \ `setTimeout()` 调用等待两秒，然后设置结果值（参见[列表 16.3]）。\n\n```\nfunction asyncFunction(callbackFunction)\
  \ {\n  let result;\n  setTimeout(\n    () => {\n      // 这在两秒后才会发生。\n      result\
  \ = Math.floor(Math.random() * 100) + 1;  // Random 数\n    }, \n    2000\n  );\n\
  \  return result;\n} \n```\n\n列表 16.3 使用了 return 的异步函数\n\n如果像调用同步函数一样调用这个异步函数，将迅速导致意想不到的程序行为，如[列表\
  \ 16.4]所示。程序将继续运行，而不会等待异步函数的结果，因此 `result` 变量中预期的结果是 `undefined`。\n\n```\nconst\
  \ result = asyncFunction();\nconsole.log(result); // undefined \n```\n\n列表 16.4\
  \ 异步函数的结果为 undefined\n\n稍后我们将向你展示这个示例在正确设置时应该是怎样的——无论是在调用回调函数还是返回结果，以及调用异步函数方面。在此之前，让我们为你展示关于异步函数需要注意的第二点。\n\
  \n### 陷阱 2：在异步函数中抛出错误\n\n在异步函数内部，你不能像[列表 16.5]中尝试的那样以通常的方式“抛”错误。原因是：当错误抛出时，调用代码已经继续执行，没有没有人捕获该错误了。\n\
  \n```\nfunction asyncFunction(callbackFunction) {\n  let result;\n  setTimeout(\n\
  \    () => {\n      result = Math.floor(Math.random() * 100) + 1;\n      if(result\
  \ < 50) {\n        throw new Error(`Random number ${result} less than 50.`);\n \
  \     }\n    }, \n    2000\n  );\n  return result;\n}\n\ntry {\n  const result =\
  \ asyncFunction();\n} catch(error) {\n  console.error(`Fehler: ${error}`); // 这行不会被调用！\n\
  } \n```\n\n列表 16.5 异步函数抛出的错误无法被捕获\n\n### 将结果和错误传递给回调函数\n\n因此，使用回调函数的异步函数既不能向调用代码返回值，也无法以“正常”方式（即同步方式）告知错误。\n\
  \n这恰恰是刚刚引入的回调函数的用用场：可以说，它们代表了异步函数与调用（同步）代码之间的联系。调用代码传递回调函数，而异步函数将结果值（返回值）或在发生错误时将错误对象作为参数调用此回调函数。然后，调用代码可以在回调函数内部对这两者都做出响应（参见[列表\
  \ 16.6]）。\n\n```\nfunction asyncFunction(callbackFunction) {\n  let result;\n  setTimeout(\n\
  \    () => {\n      // 这在两秒后才会发生。\n      result = Math.floor(Math.random() * 100)\
  \ + 1;\n      if(result >= 50) {\n        callbackFunction(\n          null,   \
  \       // null --> 无错误\n          result         // 结果\n        );\n       } else\
  \ {\n         callbackFunction(\n          new Error(`random number ${result} less\
  \ than 50.`), // 错误\n          undefined                                       \
  \    // 无结果\n        );\n       }\n     }, \n     2000\n  );\n}\n\nasyncFunction(\n\
  \  (error, result) => {\n    if(error) {\n      console.error(error);  // 回调中的错误处理\n\
  \    } else {\n      console.log(result);   // 回调中的结果处理\n    }\n  }\n); \n```\n\n\
  列表 16.6 通过回调进行错误和结果处理\n\n#### 回调函数的参数\n\n通常，回调函数的第一个参数接收一个可能的错误对象（如果没有发生错误，则接收值\
  \ `null`），并将异步计算的结果作为第二个参数。这种约定已成为 JavaScript 社区中公认的最佳实践。\n\n### 使用回调函数进行异步编程的问题\n\
  \n回调函数是 JavaScript 编程的一项基本特性。然而，过度使用回调函数会导致 JavaScript 开发者被称为“金字塔狱”（pyramid of doom）或“回调地狱”（callback\
  \ hell）的代码结构。\n\n这种代码结构发生在异步函数调用被过度嵌套时；也就是说，如果在一个异步函数的回调中调用了另一个异步函数，然后在该异步函数的回调中又调用了另一个异步函数，以此此类推。\n\
  \n[列表 16.7] 展示了这种情况的一个夸张示例，同时也说明了“金字塔狱”名称来源：嵌套的回调函数越多，这些函数就越靠右，导致整体呈现出金字塔状结构。\n\n\
  ```\nasyncFunction(\n  (error, result) => {\n    // 更多代码\n    asyncFunction2(\n\
  \      // 更多代码\n      (error2, result2) => {\n        // 更多代码\n        asyncFunction3(\n\
  \          (error3, result3) => {\n            // 更多代码\n            asyncFunction4(\n\
  \              (error4, result4) => {\n                // 更多代码\n               \
  \ asyncFunction5(\n                  (error5, result5) => {\n                  \
  \  // 更多代码\n                  }\n                );\n              }\n         \
  \   );\n          }\n        );\n      }\n    );\n  }\n); \n```\n\n列表 16.7 JavaScript\
  \ 开发者所畏之的金字塔狱\n\n### 16.1.2 使用 Promises\n\n由于需要大量的缩进，回调的嵌套导致了如上一节所示的金字塔狱。ES2015\
  \ 引入的 Promises 防止了此类代码结构，但仍然允许编写异步编程或构建异步程序，使其看起来像同步程序一样。因此，通过 Promises，通常更容易控制异步程序的流程。\n\
  \nPromises 本身无非是对象（`Promise` 类型的对象），可以说是它们充当异步函数结果的占位符（参见[列表 16.8]）。异步函数本身不再被传递回调处理程序，而是返回一个\
  \ `Promise` 对象，该对象可以访问两个封装的回调函数：一个用于告知结果值，另一个用于告知错误（通常这些回调函数命名为 `resolve()` 和 `reject()`\
  \ 以明确其意图）。这个简单而有效的技巧允许同步代码继续与 `Promise` 对象工作。\n\n```\nfunction asyncFunction() {\n\
  \  const promise = new promise(\n    function(resolve, reject) {\n      setTimeout(\n\
  \        () => {\n          const result = Math.floor(Math.random() * 100) + 1;\
  \  // 随机\n          if(result >= 50) {\n            resolve(result);  // 结果\n  \
  \        } else {\n            reject(`random number ${result} less than 50.`);\
  \  // 错误\n          }\n        }, 2000);\n    }\n  );\n  return promise;\n} \n```\n\
  \n列表 16.8 返回 Promise 对象的异步函数\n\n#### 处理 Promise\n\n\n\n\n\n因此，从调用代码的角度来看，你不再向异步函数传递回调参数。相反，你现在将此参数传递到从异步函数的返回值获取的\
  \ `Promise` 对象。`Promise` 对象为此项目的提供了 `then()` 方法。它可以接收一个用于处理结果的回调处理器和一个用于处理错误的回调处理器，如\
  \ 列表 16.9 所示。\n\n```\nasyncFunction().then(\n   (result) => {\n    console.log(result);\n\
  \  }, \n  (error) => {\n    console.error(error);\n  }, \n); \n```\n\n**列表 16.9**\
  \ 使用 Promises 调用异步函数\n\n异步函数与调用代码之间的关系如 插图 16.1 所示。\n\n作为将回调函数指定为 `then()` 第二个参数的替代方案，你也可以将其传递给\
  \ `catch()` 方法，如 列表 16.10 所示。这种变体现在用得更频繁，因为 `catch()` 让人一眼就能看出错误处理发生在哪里。\n\n```\n\
  asyncFunction()\n  .then(\n   (result) => {\n    console.log(result);\n  })\n  .catch(\n\
  \    (error) => {\n      console.error(error);\n    }\n  )\n); \n```\n\n**列表 16.10**\
  \ 使用 catch() 进行错误处理\n\n![Promise 对象与回调的连接](img/img-f16.1.html)\n\n**插图 16.1** Promise\
  \ 对象与回调的连接\n\n自 ES2018 年起，还可以使用 `finally()` 方法，它可以用于指定无论是否发生错误总是会被执行的回调函数（参见 列表\
  \ 16.11）。\n\n```\nasyncFunction()\n  .then(\n   (result) => {\n    console.log(result);\n\
  \  })\n  .catch(\n    (error) => {\n    console.error(error);\n    }\n  )\n  .finally(()\
  \ => {\n    console.log('Always executed.');\n  });\n); \n```\n\n**列表 16.11** 使用\
  \ finally() 进行错误处理\n\n### 链式 Promise 调用\n\n得益于 Promise API 的流式接口（Fluent API），`then()`\
  \ 的调用可以相对方便地一个一个排列，因为 `then()` 本身总是返回一个 `Promise` 对象。在 列表 16.12 的示例中，第一个回调处理器返回\
  \ `asyncFunction()` 的结果乘以 2，隐式地创建了一个 `Promise` 对象。回调处理器的返回值随后被用第二个回调处理器的输入。\n\n\
  ```\nasyncFunction()\n  .then((result) => {\n    return result * 2;\n  })\n  .then((result)\
  \ => {\n    // 这里 result 包含了上述结果乘以 2 的值。\n    console.log(result);\n  }); \n```\n\
  \n**列表 16.12** Promise 链\n\n#### 注意\n\n`then()` 方法总是隐式地返回一个 `Promise` 对象。\n\n得益于这种连接\
  \ Promise 的能力，也可以避免 列表 16.7 中的“地狱金字”，如 列表 16.13 所示。通过连接 `then()` 方法并传递适当的回调函数，代码可以保持在同一层。\n\
  \n```\nasyncFunction()\n  .then((result) => {\n    // asyncFunction2 的内容\n  })\n\
  \  .then((result) => {\n    // asyncFunction3 的内容\n  })\n  .then((result) => {\n\
  \    // asyncFunction4 的内容\n  })\n  .then((result) => {\n    // asyncFunction5 的内容\n\
  \  }); \n```\n\n**列表 16.13** 比地狱金字清晰得多：Promise 的连接\n\n### Promise 的状态\n\n在内部，`Promise`\
  \ 对象假设处于三种状态之一（另见 插图 16.2）：\n\n- `Pending`（等待中）意味着异步函数尚未完成。\n- `Fulfilled`（已完成）意味着异步函数成功完成（并且\
  \ `Promise` 对象包含一个结果值）。当回调函数 `resolve()` 被调用时，达到此状态。\n- `Rejected`（已拒绝）意味着异步函数未成功完成或导致了错误（并且\
  \ `Promise` 对象包含错误原因）。当调用 `reject()` 回调函数时，达到此状态。\n\n![Promise 的不同状态](img/img-f16.2.html)\n\
  \n**插图 16.2** Promise 的不同状态\n\n与 Promise 状态有关，“settled`（已就绪）一词也是相关的：如果一个 promise\
  \ 处于 settled 状态，意味着它已经变为 fulfilled 或 rejected 状态。换句话说，它不再处于 pending 状态。\n\n### 使用\
  \ Promise 辅助方法\n\n除了讨论的方法外，`Promise` 类还提供了各种静态辅助方法，这些方法在处理 promise 时非常有用，特别是在并行调用多个处理\
  \ promise 工作的各种异步函数时。例如，`Promise.all()` 方法期望一个 promise 数组（更准确地说，是 promise 的可迭代对象），它本身也返回一个\
  \ promise，如果所有提交的 promise 都已 fulfilled，则它变为 fulfilled；如果任何提交的 promise 被 rejected，则它变为\
  \ rejected。如果所有 promise 都已完成，`Promise.all()` 返回的 promise 将以数组的形式返回相应的结果。如果一个 promise\
  \ 导致错误（即它被拒绝），此错误将传递给 `Promise.all()`。\n\n列表 16.14 显示了如何使用该方法：首先，在这里创建了三个 promise，其中第一个和第三个被\
  \ fulfilled，第二个被 rejected。因此，`Promise.all()` 方法的调用（没有传递 2 号 promise）返回了 promise\
  \ 1 和 promise 3 的结果。然而第二次调用（现在也传递了 2 号 promise）导致了错误。\n\n```\n// Promise 1 是 \"\
  resolved\"\nconst promise1 = new Promise((resolve, reject) => resolve('1'));\n//\
  \ Promise 2 是 \"rejected\"\nconst promise2 = new Promise((resolve, reject) => reject('2'));\n\
  // Promise 3 是 \"resolved\"\nconst promise3 = new Promise((resolve, reject) => resolve('3'));\n\
  \nPromise\n  .all([promise1, promise3])\n  .then((result) => {\n    console.log(result);\n\
  \  })\n  .catch((error) => {\n    console.error(`Error: ${error}`);\n  });\n\n//\
  \ 输出: [ '1', '3' ]\n\nPromise\n  .all([promise1, promise2, promise3])\n  .then((result)\
  \ => {\n    console.log(result);\n  })\n  .catch((error) => {\n    console.error(`Error:\
  \ ${error}`);\n  });\n\n// 输出: \"Error: 2\" \n```\n\n**列表 16.14** 使用 Promise.all()\
  \ 方法\n\n`Promise.race()` 方法的工作原理与 `Promise.all()` 类似，但会在第一个变为 fulfilled 或 rejected\
  \ 的 promise 时直接结束。比喻地说，传递的各个 promise 正在进行一场比赛（因此该方法的名称）：第一个就绪的异步函数（即第一个被 resolve\
  \ 或 rejected）赢得了比赛。\n\n\n\n\n\nListing 16.15 显示了一个简单的示例。列表开头定义的三个 promise 与之前的列表相比经过细微修改，以更好地阐明\
  \ `Promise.race()` 的用法：promise 1 和 promise 3 使用 `setTimeout()` 方法来模拟两个在五秒后解析（resolve）的异步函数，而\
  \ promise 2 在两秒后被拒绝（reject）。换句话说，promise 2 赢得了竞速，`Promise.race()` 返回了由 promise 2\
  \ 抛出的错误。\n\n```\nconst promise1 = new Promise((resolve, reject) => {\n    setTimeout(()\
  \ => resolve('1'), 5000);\n});\nconst promise2 = new Promise((resolve, reject) =>\
  \ {\n    setTimeout(() => reject('2'), 2000);\n});\nconst promise3 = new Promise((resolve,\
  \ reject) => {\n    setTimeout(() => resolve('1'), 5000);\n});\n\nPromise\n  .race([promise1,\
  \ promise2, promise3])\n  .then((result) => {\n    console.log(result);\n  })\n\
  \  .catch((error) => {\n    console.error(`Error: ${error}`);\n  });\n\n// Output:\
  \ 1 \n```\n\n**Listing 16.15** 使用 Promise.race() 方法\n\n`Promise.allSettled()` 方法的工作原理与\
  \ `Promise.all()` 略有不同：它也期望 promise 数组或可迭代对象并返回一个 promise，但与 `Promise.all()` 不同的是，一旦给定的\
  \ promise 中有一个拒绝，返回的 promise 不会被拒绝。相反，当所有通过的 promise 都完成后（即当它们稳定时），该 promise 就会完成，无论它们是被解析还是被拒绝。结果是，promise\
  \ 返回一个对象数组，每个对象都包含相应 promise 的结果。Listing 16.16 显示了一个示例。\n\n```\nconst promise1 =\
  \ new Promise((resolve, reject) => resolve('1'));\nconst promise2 = new Promise((resolve,\
  \ reject) => reject('2'));\nconst promise3 = new Promise((resolve, reject) => resolve('3'));\n\
  \nPromise\n  .allSettled([promise1, promise3])\n  .then((result) => {\n    console.log(result);\n\
  \  })\n  .catch((error) => {\n    console.error(`Error: ${error}`);\n  });\n\n//\
  \ Output:\n// [\n//   { status: 'fulfilled', value: '1' },\n//   { status: 'fulfilled',\
  \ value: '3' }\n// ]\n\nPromise\n  .allSettled([promise1, promise2, promise3])\n\
  \  .then((result) => {\n    console.log(result);\n  })\n  .catch((error) => {\n\
  \    console.error(`Error: ${error}`);\n  });\n\n// Output:\n// [\n//   { status:\
  \ 'fulfilled', value: '1' },\n//   { status: 'rejected', reason: '2' },\n//   {\
  \ status: 'fulfilled', value: '3' }\n// ] \n```\n\n**Listing 16.16** 使用 Promise.allSettled()\
  \ 方法\n\n除了目前为止提出的三个方法外，ES2021 引入了 `Promise.any()` 方法。正如该方法的名字所示，它返回一个 promise，一旦通过的\
  \ promise 中有一个被解析，该 promise 就会完成。当所有通过的 promise 都被拒绝时，它才被拒绝（参见 Listing 16.17）。\n\
  \n```\nconst promise1 = new Promise((resolve, reject) => resolve('1'));\nconst promise2\
  \ = new Promise((resolve, reject) => reject('2'));\nconst promise3 = new Promise((resolve,\
  \ reject) => resolve('3'));\n\nPromise\n  .any([promise1, promise2, promise3])\n\
  \  .then((result) => {\n    console.log(result);\n  })\n  .catch((error) => {\n\
  \    console.error(`Error: ${error}`);\n  });\n\n// Output: 1\n```\n\n**Listing\
  \ 16.17** 使用 Promise.any() 方法\n\n除了上述三个辅助方法外，`Promise.resolve()` 和 `Promise.reject()`\
  \ 提供了更多方法来生成一个在所有通过的 promise 都被拒绝时被解析的拒绝（`Promise.any()`）（参见 Listing 16.18）。例如，之前的代码可以使用这些辅助方法重写（参见\
  \ Listing 16.18）。\n\n```\nconst promise1 = Promise.resolve('1');\nconst promise2\
  \ = Promise.reject('2');\nconst promise3 = Promise.resolve('3');\n\nPromise\n  .any([promise1,\
  \ promise2, promise3])\n  .then((result) => {\n    console.log(result);\n  })\n\
  \  .catch((error) => {\n    console.error(`Error: ${error}`);\n  });\n\n// Output:\
  \ 1\n```\n\n**Listing 16.18** 使用 Promise.resolve() 和 Promise.reject() 方法\n\n###\
  \ 16.1.3 使用异步函数\n\n与回调函数相比，promise 极大地简化了异步代码的编写。但更棒了：在 ES2017 版本中引入了异步函数，这进一步简化了异步代码（参见\
  \ Listing 16.19）。\n\n```\nasync function someAsyncFunction() {\n  // 异步计算\n  const\
  \ result = ...;\n  return result;\n}\n```\n\n**Listing 16.19** 使用 async 关键字\n\n\
  #### 注意\n\n内部，对于标记为 `async` 的函数会隐式创建并返回一个 `Promise` 对象。因此可以像之前一样直接通过 promise 访问结果（参见\
  \ Listing 16.20）。\n\n```\nsomeAsyncFunction()\n.then(result => console.log(result));\n\
  ```\n\n**Listing 16.20** 通过直接使用 promise 获取异步函数的结果\n\n在标记为 `async` 的异步函数内部，现在可以使用\
  \ `await` 关键字。如果你在函数调用前面加上这个关键字，调用函数将等待异步函数调用的结果确定。\n\nListing 16.21 显示了一个简单的示例。`randomNumber()`\
  \ 函数返回一个 1 到 100 之间的随机数，并带有时间延迟（以模拟异步特性）。在 `addTwoRandomNumbers()` 调用函数中，`await`\
  \ 的规范现在足以导致在 `randomNumber()` 执行完成后继续执行函数的执行。因此，首先确定 `a` 的值，然后是 `b` 的值，之后计算 `a +\
  \ b` 表达式——正如你对相应的同步代码所预期的那样。\n\n注意，使用 `await` 调用 `addTwoRandomNumbers()` 不能在顶层使用。相反，在列表中创建了一个匿名函数，标记为\
  \ `async` 关键字并直接调用（此处的例外是顶层 await，它允许至少在结合 ECMAScript 模块语法的情况下在顶层使用 `await`；参见 [https://github.com/tc39/proposal-top-level-await]）。\n\
  \n\n\n\n\n```javascript\nfunction randomNumber() {\n  return new Promise(resolve\
  \ => {\n    setTimeout(() => {\n      const x = Math.floor(Math.random() * 100)\
  \ + 1;\n      resolve(x);\n    }, 2000);\n  });\n}\n\nasync function addTwoRandomNumbers()\
  \ {\n  console.log('Calculation of first random number');\n  const a = await randomNumber();\n\
  \  console.log(`Result: ${a}`);\n  console.log('Calculation of second random number');\n\
  \  const b = await randomNumber();\n  console.log(`Result: ${b}`);\n  return a +\
  \ b;\n}\n\n(async () => {\n  const result = await addTwoRandomNumbers();\n  console.log(`Summe:\
  \ ${result}`);\n})();\n\n// Sample output:\n// Calculation of first random number\n\
  // Result: 38\n// Calculation of second random number\n// Result: 58\n// Total:\
  \ 96 \n```\n\n**列表 16.21** 使用 await 关键字\n\n与使用回调函数相比，这段源代码更容易易读和理解。当多个异步函数调用一个接一个排列时，这一点变得尤为明显，如列表\
  \ 16.22 所示。使用回调函数会变成混乱的、嵌套和缩进的函数调用，而使用 async 函数则保持得清晰得多。即使是列表中用于对比 promise 使用的代码，与\
  \ `await` 标记相比也不再那么清晰了。顺便提一下，你也可以在列表中看到，在使用 `await` 时也可以使用普通的 `try`/`catch` 语句——就像你习惯的同步函数调用一样。\n\
  \n```javascript\nclass UserRepository {\n\n  constructor() {\n    this._users =\
  \ new Map();\n  }\n\n  async save(user) {\n    this._users.set(user.id, user);\n\
  \    return Promise.resolve(user);\n  }\n\n  async find(id) {\n    const user =\
  \ this._users.get(id);\n    return Promise.resolve(user);\n  }\n}\n\nconst repository\
  \ = new UserRepository();\n\n// 使用 await\nasync function saveAndFindJames() {\n\
  \  const james= {\n    id: 4712\n    firstName: 'James',\n    lastName: 'Doe'\n\
  \  };\n  try {\n    const result = await repository.save(james);\n    const user\
  \ = await repository.find(result.id);\n    console.log(user);\n  } catch (error)\
  \ {\n    console.error(error);\n  }\n}\nsaveAndFindJames();\n\n// 使用 promises\n\
  function saveAndFindJohn() {\n  const john = {\n    id: 4711\n    firstName: JOHN\n\
  \    lastName: 'Doe'\n  };\n  repository.save(john)\n    .then(result => repository.find(result.id))\n\
  \    .then(user => console.log(user))\n    .catch(error => console.error(error));\n\
  }\n\nsaveAndFindJohn(); \n```\n\n**列表 16.22** 得益于 async 和 await 的清晰异步代码\n\n## 16.2\
  \ 封装对数据结构的迭代\n\n在本书中，你已经学习了遍历数组、映射 或集合等数据结构的不同方法。你还已经看到 `Map` 和 `Set` 数据类型（同样也对于\
  \ `Array`）通过 `keys()`、`values()` 和 `entries()` 方法返回迭代器，这些迭代器可以直接作为 `for-of` 循环的输入使用。\n\
  \n### 16.2.1 迭代器的原理\n\n通俗地讲，迭代器抽象了对数据结构的迭代。简单来说，这些对象包含一种指向底层数据结构的指针，该指针可以通过调用 `next()`\
  \ 方法在迭代器上移动。`next()` 返回指针随后指向的相应元素（参见图 16.3）。\n\n![Iterators Are a Kind of Pointer\
  \ to the Elements of a Data Structure](img/img-f16.3.html)\n\n**图 16.3** 迭代器是指向数据结构元素的指针\n\
  \n### 16.2.2 使用迭代器\n\n列表 16.23 展示了使用数组的 `values()` 方法返回的迭代器的示例。在迭代器上，连续调用多次 `next()`\
  \ 方法，直到到达迭代器末尾并输出所有值。`next()` 方法返回一个带有 `done` 和 `value` 属性的对象，并推进迭代器。`value` 属性包含当前值，而\
  \ `done` 属性包含是否已到达迭代器的末尾。\n\n```javascript\nconst artists = [\n  'Deep Purple',\n\
  \  'Jimi Hendrix',\n  'The Doors',\n  'King Crimson'\n];\nconst iterator = artists.values();\
  \ // 创建迭代器\nconst artist = iterator.next();  // 迭代器中的第一个值\nconsole.log(artist);\
  \             // 输出: {value: 'Deep Purple', done: false}\nartist = iterator.next();\
  \        // 在迭代器中继续\nconsole.log(artist);             // 输出: {value: 'Jimi Hendrix',\
  \ done: false}\nartist = iterator.next();        // 在迭代器中继续\nconsole.log(artist);\
  \             // 输出: {value: 'The Doors', done: false}\nartist = iterator.next();\
  \        // 在迭代器中继续\nconsole.log(artist);             // 输出: {value: 'King Crimson',\
  \ done: false}\nartist = iterator.next();        // 在迭代器中继续\nconsole.log(artist);\
  \             // 输出: {value: undefined, done: true}\n```\n\n**列表 16.23** next()\
  \ 方法可以用于控制迭代器\n\n### 16.2.3 创建你自己的迭代器\n\n如你所见，你可以访问 `Array`、`Set` 和 `Map` 数据结构的预定义迭代器。然而，你也可以创建自己的迭代器。\n\
  \n现在我们将通过一个示例来展示这一点，并创建一个反序输出数组元素的迭代器——即先输出最后一个元素，然后是倒数，以此类推，最后输出第一个元素。\n\n该代码在列表\
  \ 16.24 所示。你可以看到 `createIterator()` 函数内部的迭代器实现。这里首先了 `counter` 计数变量，它代表迭代器的内部指针，指向数组中相应的当前元素。初始时，该变量的值由\
  \ `array.length-1` 表达式确定，因此指向数组的最后一个元素。\n\n然后该函数返回迭代器对象。它的 `next()` 方法实现了迭代行为：如果\
  \ `counter` 计数变量（或指针变量）大于或等于 0，`next()` 返回一个 `done` 属性值为 `false` 的对象（因为迭代器尚未到达数组的末尾，在本例中是开头），并且其\
  \ `value` 属性包含由计数变量指向的数组中的对应元素。\n\n\n\n\n\n递减运算符 `--` 用于在确定相应元素后直接将计数器变量减  1。当计数器变量达到\
  \ `0` 时（即迭代器到达末尾），`next()` 会返回一个其 `done` 属性值为 `true` 且 `value` 属性值为 `undefined`\
  \ 的对象。\n\n```\nconst artists = [\n  'Deep Purple', \n  'Jimi Hendrix', \n  'The\
  \ Doors', \n  'King Crimson'\n];\nfunction createIterator(array) {\n  let counter\
  \ = array.length-1;\n  // 返回迭代器对象\n  return {\n    next: function(){\n      if (counter\
  \ < 0) {\n        return {\n          value: undefined, \n          done: true\n\
  \        };\n      } else {\n        return {\n          value: array[counter--],\n\
  \          done: false\n        };\n      }\n    }\n  }\n};\nconst iterator = createIterator(artists);\n\
  const artist = iterator.next();  // 迭代器中的第一个值\nconsole.log(artist);            \
  \ // 输出: {value: 'King Crimson', done: false}\nartist = iterator.next();       \
  \ // 继续迭代器\nconsole.log(artist);             // 输出: {value: 'The Doors', done: false}\n\
  artist = iterator.next();        // 继续迭代器\nconsole.log(artist);             // 输出:\
  \ {value: 'Jimi Hendrix', done: false}\nartist = iterator.next();        // 继续迭代器\n\
  console.log(artist);             // 输出: {value: 'Deep Purple', done: false}\nartist\
  \ = iterator.next();        // 继续迭代器\nconsole.log(artist);             // 输出: {value:\
  \ undefined, done: true} \n```\n\n**列表 16.24** 创建并使用自定义的迭代器\n\n### 16.2.4 创建可迭代对象\n\
  \n现在你已经知道了如何创建自定义的迭代器，那么创建一个可迭代对象并不困难。要做到这一点，如列表 16.25 所示，你首先定义一个对象作为数组的容器，该对象是即将被变为可迭代的对象。\n\
  \n```\nconst artists = [\n  'Deep Purple', \n  'Jimi Hendrix', \n  'The Doors',\
  \ \n  'King Crimson'\n];\nconst arrayWrapper = {\n  array: artists\n} \n```\n\n\
  **列表 16.25** 即将变为可迭代的对象\n\n在此之后，你只需要做的是在容器对象上定义 `Symbol.iterator` 属性，并将其值指定为一个返回迭代器的函数。\n\
  \n如列表 16.26 所示，这与列表 16.24 中刚刚演示的实现相似。唯一的区别是没有向传递给 `Symbol.iterator` 函数（或方法），而是在函数内部访问存储在容器对象中的数组。\n\
  \n```\narrayWrapper[Symbol.iterator] = function() {\n  const array = this.array;\n\
  \  let counter = this.array.length-1;\n  // 返回迭代器对象\n  return {\n    next: function(){\n\
  \      if (counter < 0) {\n        return {\n          done: true\n        };\n\
  \      } else {\n        return {\n          value: array[counter--],\n        \
  \  done: false\n        };\n      }\n    }\n  }\n}; \n```\n\n**列表 16.26** 迭代器的实现以及返回迭代器的方法实现\n\
  \n#### 注意\n\n在 JavaScript 中，如果一个对象拥有一个返回迭代器的内部 `Symbol.iterator` 方法，则它是可迭代的（图 16.4）。\n\
  \n![可迭代对象与迭代器之间的关系](img/img-f16.4.html)\n\n**图 16.4** 可迭代对象与迭代器之间的关系\n\n### 16.2.5\
  \ 遍历可迭代对象\n\n现在你已经让对象变得可迭代，可以将其作为 `for-of` 循环输入，就像 map、set 和数组一样（参见列表 16.27）。\n\n\
  ```\nfor(let artist of arrayWrapper) {  // 对迭代器进行迭代\n  console.log(artist);\n  //\
  \ 逐个输出：\n  // \"King Crimson\"\n  // \"The Doors\"\n  // \"Jimi Hendrix\"\n  //\
  \ \"Deep Purple\"\n} \n```\n\n**列表 16.27** 在 for-of 循环中使用可迭代对象\n\n## 16.3 暂停和恢复函数\n\
  \n通过 ES2015，ECMAScript 标准增加了一项功能，允许函数在某些点暂停并在稍后恢复。这里使用的结构是生成器（generators）。\n\n###\
  \ 16.3.1 创建生成器函数\n\n生成器函数使用 `function` 关键字定义，后面跟着一个星号（`*`）。当调用生成器函数时，它返回一个生成器，该生成器可以用于控制生成器定义的代码的执行。\n\
  \n使用新引入的 `yield` 运算符中断生成器。`yield` 运算符类似于 `return`，会返回一个值并导致生成器退出。这里的重点是，当下次调用生成器时，函数的执行将从\
  \ `yield` 之后继续。因此，列表 16.28 中的生成器函数在第一次调用返回 `1`，第二次调用返回 `2`。\n\n```javascript\nfunction*\
  \ returnOneThenTwo() {\n  console.log('A');\n  yield 1;               // 生成器在此停止并返回值\
  \ 1。\n  console.log('B');      // 在下次调用时，生成器继续...\n                         // 从这里开始执行...\n\
  \  yield 2;               // ...到这一行，生成器停止...\n                         // ...再次停止并在这次返回值\
  \ 2。\n  console.log('C');\n} \n```\n\n**列表 16.28** 一个简单的生成器函数\n\n### 16.3.2 创建生成器\n\
  \n让我们通过示例在实践中展示上述理论描述的生成器行为。在列表 16.29 中，通过调用 `returnOneThenTwo()` 生成器函数最初创建一个生成器。在这里，重要的是该调用尚未触发生成器本身。你通过对生成器对象使用\
  \ `next()` 方法来实现这一点。\n\n该方法不仅名称上与迭代器相似，而且还返回一个具有两个属性的对象：`done` 属性包含关于是否到达生成器末尾的信息，`value`\
  \ 属性包含每次情况下 `yield` 返回的实际值。\n\n在生成器上反复调用 `next()` 方法会导致控制流在 `yield` 处跳出生成器函数并在其后重新进入。\n\
  \n\n\n\n\n```javascript\nconst generator = returnOneThenReturnTwo(); \n// Calling\
  \ the generator function creates a generator.\n\nlet result = generator.next();\
  \    // Output: \"A\"\nconsole.log(result);              // Output: {done: false,\
  \ value: 1}\nresult = generator.next();        // Output: \"B\"\nconsole.log(result);\
  \              // Output: {done: false, value: 2}\nresult = generator.next();  \
  \      // Output: \"C\"\nconsole.log(result);              // Output: {done: true,\
  \ value: undefined}\n\nconst generator2 = returnOneThenReturnTwo();    // a second\
  \ generator\nlet result2 = generator2.next();  // Output: \"A\"\nconsole.log(result2);\
  \             // Output: {done: false, value: 1}\nresult2 = generator2.next(); \
  \     // Output: \"B\"\nconsole.log(result2);             // Output: {done: false,\
  \ value: 2}\nresult2 = generator2.next();      // Output: \"C\"\nconsole.log(result2);\
  \             // Output: {done: true, value: undefined} \n```\n\n**代码列表 16.29**\
  \ 创建和使用生成器\n\n### 注意事项\n\n因此，生成器无非一种特殊的迭代器。与迭代器一样，对生成器调用 `next()` 总是返回一个带有 `done`\
  \ 和 `value` 属性的对象。`done` 属性提供有关是否到达生成器末尾的信息，而 `value` 属性包含由当前 `yield` 返回的值。\n\n\
  ### 16.3.3 遍历生成器\n\n由于生成器是迭代器的一种特殊形式，因此它们也可以直接作为 `for-of` 循环的输入。代码列表 16.30 显示了相应的示例。\n\
  \n```javascript\nconst generator = returnOneThenReturnTwo();\nfor(let value of generator)\
  \ {\n  if(value) {\n    console.log(value);\n  } else {\n    break;\n  }\n}\n//\
  \ Output:\n// A\n// 1\n// B\n// 2\n// C \n```\n\n**代码列表 16.30** for-of 循环中的生成器\n\
  \n### 16.3.4 创建无限生成器\n\n创建可以生成无限序列的生成器也是可能的。例如，让我们取一个类似于计数器的生成器函数，它始终返回下一个更大的数字，从\
  \ `0` 开始。由于 `yield` 运算符原则上可以出现在函数内的任何位置，通过简单地在无限循环中放置 `yield`，就可以快速地实现这种计数功能，如代码列表\
  \ 16.31 所示。\n\n```javascript\nfunction* counter() {\n  let counter = 0;\n  while(true)\
  \ {\n    counter++;\n    yield counter;\n  }\n}\n\nconst counter1 = counter();\n\
  console.log(counter1.next());       // {done: false, value: 1}\nconsole.log(counter1.next());\
  \       // {done: false, value: 2}\nconsole.log(counter1.next());       // {done:\
  \ false, value: 3}\nconsole.log(counter1.next());       // {done: false, value:\
  \ 4}\nconsole.log(counter1.next());       // {done: false, value: 5}\n// and so\
  \ on \n```\n\n**代码列表 16.31** 用于计数的生成器函数\n\n### 16.3.5 使用参数控制生成器\n\n有时，能够从外部影响生成器是有帮助的——例如，控制它何时应该终止。为了实现这一点，可以向\
  \ `next()` 方法传递一个参数，该参数然后在生成器内部用作 `yield` 语句的输入值。\n\n代码列表 16.32 显示了之前的 `counter()`\
  \ 生成器函数，该函数已经过相应的调整，并评估了 `yield` 的返回值（或每个情况下传递的参数）。\n\n```javascript\nfunction*\
  \ counter() {\n    let counter = 0;\n    while(true) {\n        counter++;\n   \
  \     const restart = yield counter;\n        if(restart === true) {\n         \
  \   counter = 0;\n        }\n    }\n} \n```\n\n**代码列表 16.32** 带有 yield 返回值的生成器函数\n\
  \n`restart` 变量接收作为参数传递给 `next()` 调用的值。根据此值，`counter` 变量会被重置或不重置。因此，如果调用 `next()`\
  \ 时传入 `true`（如代码列表 16.33;\nconsole.log(counter1.next());       // {done: false,\
  \ value: 1}\nconsole.log(counter1.next());       // {done: false, value: 2}\nconsole.log(counter1.next());\
  \       // {done: false, value: 3}\nconsole.log(counter1.next());       // {done:\
  \ false, value: 4}\nconsole.log(counter1.next());       // {done: false, value:\
  \ 5}\nconsole.log(counter1.next(true));   // {done: false, value: 1}\nconsole.log(counter1.next());\
  \       // {done: false, value: 2}\nconsole.log(counter1.next());       // {done:\
  \ false, value: 3}\nconsole.log(counter1.next());       // {done: false, value:\
  \ 4}\nconsole.log(counter1.next());       // {done: false, value: 5} \n```\n\n**代码列表\
  \ 16.33** 使用带参数的 next()\n\n## 16.4 拦截对对象的访问\n\n另一个概念（在许多编程语言中被称为设计模式）在 ES2015 中原生引入了\
  \ JavaScript 语言。我们说的是代理（Proxies）。\n\n### 16.4.1 代理的原理\n\n在软件开发中，代理是另一个对象上游的对象，并作为该对象的替代品调用。代理对象允许你拦截、处理和转发对源对象的访问，还可以拦截并影响被拦截方法的返回值（请参见图\
  \ 16.5）。\n\n![可以通过代理拦截对象的方法调用](img/img-f16.5.html)\n\n**图 16.5** 可以通过代理拦截对象的方法调用\n\
  \n### 16.4.2 创建代理\n\n代理对象是通过调用 `Proxy(targetObject, handler);` 创建的（参见代码列表 16.34）。`Proxy()`\
  \ 函数期望两个参数：`targetObject` 代表要拦截访问的源对象，而 `handler` 指定响应对源对象访问的对象。在随后的代码中，你访问代理对象而不是源对象。\n\
  \n```javascript\nconst targetObject = {\n  firstName: null, \n  lastName: null\n\
  };\nconst handler = {/* is about to be implemented*/};\nconst proxy = new Proxy(targetObject,\
  \ handler);\nproxy.firstName = 'John';\nproxy.lastName = 'Doe';\nconsole.log(proxy.firstName);\n\
  console.log(proxy.lastName); \n```\n\n**代码列表 16.34** 创建代理\n\n### 16.4.3 为代理定义处理器\n\
  \n因此，代理提供了拦截方法调用的框架。要拦截的方法调用以及如何响应这些调用定义在处理器对象：许多预定义方法（称为陷阱 traps）可以在处理器对象上实现，然后根据对代理对象执行的操作进行调用。代理操作与在处理器上调用的方法之间的关系如表\
  \ 16.1](#16_004.html_t16.1）所示。\n\n| 处理器中的方法 | 操作 | 备注 |\n\n| --- | --- | --- |\n\
  | `apply(target, thisArgument, argumentsList)` | `proxy.apply(thisArgument,` | |\n\
  \n\n\n\n\n| `argumentsList)` 或 `proxy.call(thisArgument, ...argumentsList)` 或 `proxy(...argumentsList)`\
  \ | 仅当代理对象为函数时 |\n| `construct(target, argumentsList, newTarget)` | `new Proxy(...argumentsList)`\
  \ | 仅当代理对象为函数时 |\n| `defineProperty(target, property, propertyDescriptor)` | `Object.defineProperty(proxy,\
  \ property, propertyDescriptor)` | 适用于所有对象 |\n| `deleteProperty(target, property)`\
  \ | `delete proxy[property]` 或 `delete proxy.property` | 适用于所有对象 |\n| `enumerate(target)`\
  \ | `for(var i in proxy)` | 已从当前的 ECMAScript 标准中移除——即 ES2015 的后续版本 |\n| `get(targetObject,\
  \ property, proxy)` | `proxy[property]` 或 `proxy.property` | 适用于所有对象 |\n| `getOwnPropertyDescriptor(target,\
  \ property)` | `Object.getOwnPropertyDescriptor(proxy, property)` | 适用于所有对象 |\n\
  | `getPrototypeOf(target)` | `Object.getPrototypeOf(Proxy)` | 适用于所有对象 |\n| `has(property)`\
  \ | `property in proxy` | 适用于所有对象 |\n| `isExtensible(target)` | `Object.isExtensible(proxy)`\
  \ | 适用于所有对象 |\n| `ownKeys(target)` | `Object.getOwnPropertyPropertyNames (proxy)`\
  \ 或 `Object.getOwnPropertyPropertySymbols (proxy)` 或 `Object.keys(proxy)` | 适用于所有对象\
  \ |\n| `preventExtensions(target)` | `Object.preventExtensions(proxy)` | 适用于所有对象\
  \ |\n| `set(targetObject, property, value)` | `proxy[property] = value` 或 `proxy.property\
  \ = value` | 适用于所有对象 |\n| `setPrototypeOf(target, proto)` | `Object.setPrototypeOf(proxy,\
  \ proto)` | 适用于所有对象 |\n\n表 16.1 代理操作与处理器方法的对应关系\n\n使用处理器的示例在列表 16.35 所示。在这里，在处理器对象上定义了\
  \ `set` 和 `get` 方法。因此，在读取或设置底层对象的属性时，所有的访问都会被拦截。\n\n```\nconst person = {\n  firstName:\
  \ 'John',\n  lastName: 'Doe',\n  email: 'johndoe@javascripthandbuch.de',\n  age:\
  \ 42\n}\n\nconst handler = {\n  get(target, property) {\n      console.log(`Read\
  \ \"${target[property]}\" from property \"${property}\"`);\n      return target[property];\n\
  \  },\n\n  set(target, property, value) {\n    console.log(`Write \"${target[property]}\"\
  \ to property \"${property}\"`);\n    target[property] = value;\n  }\n}\n\nconst\
  \ proxy = new Proxy(person, handler);\nproxy.firstName = 'John';        // Call\
  \ set() of handler\n// Output: \n// Write value \"John\" to property \"firstName\"\
  \n\nproxy.lastName = 'Doe';          // Call set() of handler\n// Output:\n// Write\
  \ value \"Doe\" to property \"lastName\"\n\nconsole.log(proxy.firstName);    //\
  \ Call get() of handler\n// Output:\n// Read value \"John\" from property \"firstName\"\
  \n// John\n\nconsole.log(proxy.lastName);     // call get() of handler\n// Output:\n\
  // Read value \"Doe\" from property \"lastName\"\n// Doe\n\nconsole.log(proxy.age);\
  \          // call get() of handler\n// Output:\n// Read value \"42\" from property\
  \ \"age\"\n// 42 \n```\n\n列表 16.35 使用代理\n\n我们可以稍微扩展一下这个示例，例如在写入属性的陷阱中包含对年龄的验证。你可以在列表\
  \ 16.36 中看到这部分代码。每当尝试给 `age` 属性赋值时，系统都会进行一次检查，以确保该值确实是数字，且该数字不小于 0。如果不符合其中任一条件，则会抛出相应的错误。\n\
  \n```\nconst person = {\n  firstName: 'John',\n  lastName: 'Doe',\n  email: 'johndoe@javascripthandbuch.de',\n\
  \  age: 42\n}\n\nconst handler = {\n  get(target, property) {\n      console.log(`Read\
  \ \"${target[property]}\" from property \"${property}\"`);\n      return target[property];\n\
  \  },\n\n  set(target, property, value) {\n    if (property === 'age') {\n     \
  \ if (typeof value !== 'number') {\n          throw new Error('Age must be a number');\n\
  \      }\n      if (value < 0) {\n          throw new Error('Age must not be less\
  \ than 0')\n      }\n    }\n    console.log(`Write \"${target[property]}\" to property\
  \ \"${property}\"`);\n    target[property] = value;\n  }\n}\n\nconst proxy = new\
  \ Proxy(person, handler);\nproxy.age = -42; // Error: Age must not be less than\
  \ 0\\. \n```\n\n列表 16.36 带年龄验证的代理\n\n## 16.5 总结\n\n在本章中，我们介绍了异步编程，这是 JavaScript\
  \ 中的一个重要概念。你还学习了各种高级特性。以下是你应该从章中学的内容：\n\n*   在异步编程中，函数的调用和结果的返回不像同步编程那样直接耦合。相反，返回值（或函数的结果）以及错误会以不同的方式传递给调用代码。JavaScript\
  \ 为此目的提供了以下变体：\n\n\n\n\n\n- 回调函数（Callbacks）通过封装异步函数的回调函数，简化了异步代码的编写。ES2017 引入的新关键字\
  \ `async` 和 `await` 使得异步代码更具可读性。\n- Promises 通过将异步函数的回调函数封装在它们自己的对象中（这些对象提供了 `then()`、`catch()`\
  \ 和 `finally()` 方法），使得编写异步代码变得更加简单。\n- 异步函数（Async functions）内部通过 promise 工作，但得益于\
  \ `async` 和 `await` 关键字，代码变得更加清晰。\n- 迭代器（Iterators）封装了对数据结构进行迭代的行为。\n- 生成器（Generators）允许函数在某些点停止或中断，并在稍后的时间恢复。\n\
  - 代理（Proxies）使得拦截对象的访问成为可能。\n\n# 17 使用 Node.js 创建基于服务器的应用程序\n\n长期以来，JavaScript 仅限于在浏览器中使用。然而，近年来，这种语言开放了许多新的应用领域，我们将在本章节及后续两个章节介绍这些内容。我们将从这里开始，基于\
  \ Node.js 运行时环境使用 JavaScript 开发基于服务器的应用程序。\n\nNode.js 允许 JavaScript 在浏览器之外执行。它基于\
  \ V8 运行时环境（该环境也用于 Chrome），并对 JavaScript 近年来的再次成功做出了巨大贡献。\n\n## 17.1 Node.js 简介\n\
  \n严格来说，Node.js 不仅仅是一个运行时环境：它还为 JavaScript 提供了各种软件组件（模块或包），例如，读取文件、创建 Web 服务器、访问数据库等。为了实现这一点，Node.js\
  \ 包含了部分用 C 或 C++ 编写的原生组件。\n\n### 17.1.1 Node.js 架构\n\nNode.js 的流行很大程度上是因为它相对快速且具有扩展性，并使用了一些后文将解释的概念。为了更好地理解这一功能或\
  \ Node.js 的架构，让我们先看看 IIS 或 Apache Tomcat 等传统服务器是如何工作的对比（参见图 17.1）。\n\n对于这些服务器，用户向服务器的每个请求都会创建一个新线程，或者由服务器从线程池中选择一个线程分配给该请求。用户重新加载网页（从而向服务器产生新请求）也会发生这种情况。由于这些原因，这类服务器也被称为多线程服务器。\n\
  \n通常，请求还涉及某种形式的阻塞输入输出（阻塞 I/O）：例如，对数据库的搜索查询、加载非常特定的文件等。线程现在会等待直到相应操作的结果可用，但当然，它仍然占用内存。\n\
  \n如果执行了许多请求，会导致服务器的内存占用更高。输入输出操作耗的时间越长，这个问题越明显：只要线程处于阻塞状态，服务器就必须为新请求创建新线程。\n\n![传统服务器的架构](img/img-f17.1.html)\n\
  \n**图 17.1** 传统服务器的架构\n\n这正是 Node.js 架构发挥用场的地方（参见图 17.2）。Node.js 并不是每个请求使用一个线程，而是使用单个（主）线程接收所有请求并在请求队列中管理它们（因此\
  \ Node.js 是一个单线程服务器）。\n\n![Node.js 的架构](img/img-f17.2.html)\n\n**图 17.2** Node.js\
  \ 的架构\n\n在该线程内执行着一个所谓的事件循环（event loop），这是一个持续检查事件队列中的请求并处理来自输入输出操作事件的循环（稍后详细介绍）。如果用户向\
  \ Node.js 服务器发送请求，事件循环内部会进行检查，以判断下一个请求是否需要阻塞输入输出操作。如果不需要——即是非阻塞输入输出（nonblocking\
  \ I/O），则直接处理该请求并向用户发送相应的响应。\n\n相反，如果请求需要阻塞输入输出操作，则会触发多个 Node.js 内部工作单元（原则上是线程，只是\
  \ Node.js 内部的）之一来执行此操作。在这里会传递一个回调函数，该函数会在输入或输出操作完成后立即被调用（可以说，这些就是由事件循环处理的事件）。\n\n\
  但关键的一点是，主线程在阻塞输入输出操作期间不会停止：事件循环会不断轮询，检查新请求等。通过这种架构，Node.js 防止了创建越来越多的线程并占用计算能力，尽管这些线程只是在等待输入或输出操作的结果。\n\
  \n### 17.1.2 安装 Node.js\n\nNode.js 的安装相对简单：对于 Windows 和 Mac，可以在 [`nodejs.org/download/`](http://nodejs.org/download/)\
  \ 下载安装或可执行文件。对于其他操作系统，可以通过适当的包管理器安装 Node.js。相应的安装脚本可以在 [`nodejs.org/en/download/package-manager/`](https://nodejs.org/en/download/package-manager/)\
  \ 找到。\n\n安装成功后，命令行中可以使用 `node` 命令，你可以用它来执行 JavaScript 代码。你还可以使用 `node --version`\
  \ 或 `node -v` 显示 Node.js 安装的版本，以确保安装成功。\n\n要执行 JavaScript 文件，你将文件名（包括文件路径，如果适用）作为参数传递给\
  \ `node` 命令——例如 `node main.js`。\n\n#### 读取-评估-打印循环 (REPL)\n\n除了执行 JavaScript 文件外，你还可以使用\
  \ `node` 命令启动读取-评估-打印循环（REPL），这基本上是一个命令行，你可以在其中输入 JavaScript 指令并让它们直接执行。\n\n###\
  \ 17.1.3 一个简单的应用程序\n\nNode.js 最简单的应用程序无疑是在适当的脚本文件中编写 `console.log('Hello world');`\
  \ 语句并使用 `node main.js` 调用它：Node.js 解析该脚本，执行它，在控制台上输出消息 `Hello World`，就此结束。\n\n相比之下，稍微有趣一点\
  \ Hello World 示例显示在列表 17.1 中。在这里，你可以看到如何使用 http 包设置一个运行在 `localhost` 端口 8000 上的简单\
  \ Web 服务器，并用 `Hello World` 消息响应每个请求。如果你用 `node` 命令调用此脚本，Web 服务器将一直运行，直到你取消脚本（例如通过按下\
  \ (Ctrl)+ (C)）。\n\n\n\n\n\n正如列表所示，Node.js 在包的使用上遵循 CommonJS 规范：因此，要导入包，请使用 `require()`\
  \ 函数。我们将在本章稍后讨论 `http` 包时，更详细地讨论其余的方法。但你已经可以看到，在 Node.js 中，可以使用较少的代码行创建一个简单的 Web\
  \ 服务器。\n\n```javascript\n'use strict';\nconst http = require('http');\nhttp.createServer((request,\
  \ response) => {\n  response.writeHead(200, {\n    'Content-Type': 'text/plain'\n\
  \  });\n  response.write('Hello World');\n  response.end();\n}).listen(8000); \n\
  ```\n\n列表 17.1 一个简单的 Node.js 应用程序\n\n## 17.2 管理 Node.js 包\n\nNode.js 有许多不同的模块可用。某些模块（如前面简单演示的\
  \ `http` 包）包含在 Node.js 的安装中；另一些则可以通过 Node.js 包管理器 (NPM) 后续安装。\n\n### 17.2.1 安装 Node.js\
  \ 包管理器\n\n你有几种方法可以安装 NPM 工具：Windows 和 Mac 提供 MSI 和 .pkg 安装文件，Unix 系统则提供相应的安装脚本。进一步的安装选项可以在\
  \ [`github.com/npm/npm`](https://github.com/npm/npm) 中详细说明。\n\n然而，比单独安装 NPM 更常见的是通过\
  \ Node.js 间接安装。从 0.6.3 版本开始，NPM 已经包含在 Node.js 的安装中。正如所述，可以从 [`nodejs.org/download/`](http://nodejs.org/download/)\
  \ 下载适用于各种操作系统的安装或执行文件。安装 Node.js 后，你可以直接使用 `npm` 命令行。可以通过运行 `npm --version` 命令来验证安装，该命令会输出已安装\
  \ NPM 版本版本。\n\n#### NPM 和 Node.js 的版本\n\nNPM 的版本号与 Node.js 的版本号不同。例如，目前在我电脑上的 `node\
  \ --version` 命令输出版本 16.2.0，而 `npm --version` 命令输出版本 7.13.0。\n\n### 17.2.2 安装包\n\n\
  通过 NPM，你可以本地或全局安装包。如果你想将特定的 Node.js 包作为你某个应用程序的依赖，则本地安装很有用；如果你希望一个 Node.js 包对你所有的应用程序全局可用，或者它是像\
  \ `mocha` 或 `Grunt` 这样需要全局使用的工具，则全局安装更有意义（参见第 21 章）。\n\n#### 本地安装包\n\n安装包的命令是 `npm\
  \ install <package>`（简称 `npm i <package>`），其中 `<package>` 代表要安装的包。例如，要安装 `lodash`\
  \ 包 ([`lodash.com/`](https://lodash.com/))，调用以下命令：`npm install lodash`（或 `npm i\
  \ lodash`）。\n\n然后，如果当前目录下不存在该目录，NPM 会在当前目录下创建一个名为 `node_modules` 的新目录并将 `lodash`\
  \ 包安装到目录中。\n\nNPM 不仅确保指定的包已安装，而且如提到的，还会确保该包的所有依赖都已安装。这是对每个要安装的包递归执行的，直到所有依赖都得到解析并安装。\n\
  \n严格来说，`<package>` 不仅可以使用包的名称，还可以使用 URL，例如指向 GitHub 仓库的 URL。你可以在 [`docs.npmjs.com/cli/install`](https://docs.npmjs.com/cli/install)\
  \ 查看各种包安装选项的概述。\n\n#### 安装特定版本的包\n\n默认情况下，NPM 安装包的最新版本。但如果你想安装包的特定版本，只需在包名后指定它即可——例如，`npm\
  \ install lodash@4.3.5`。\n\n#### 全局安装包\n\n要全局安装包，必须将 `-g`（或 `--global`）标志作为参数传递给\
  \ `install` 命令。因为取决于配置，全局包位于一个你只有管理员权限才能写入的目录，在这种情况下，应该在相应的标识符下执行命令。例如，在 Unix 环境中，你会执行\
  \ `sudo npm install -g <package>`。\n\n#### 更新 NPM\n\n由于 NPM 的更新通常比 Node.js 更频繁，你也可以单独更新\
  \ NPM。方便的是，可以通过运行 `sudo npm install -g npm` 命令通过 NPM 自身来实现，因为 NPM 本身也是一个 NPM 包。\n\
  \n#### 各种 Web API 概述\n\n如果你在 `<package>` 中输入包名，它必须在 NPM 注册表中注册，这是一个可用包的目录。默认情况下，NPM\
  \ 从 [`registry.npmjs.org`](http://registry.npmjs.org) 注册表获取所有包。原则上，自定义注册表也可以托管在自己的服务器上。有关默认注册表中可用包的概述，请参见\
  \ [www.npmjs.org](http://www.npmjs.org)。目前那里列出了超过百万个包（截至 2021 年 5 月）。作为对比：2017 年\
  \ 10 月有约 475,000 个包，2016 年 5 月有 250,000 个，2014 年 9 月有 95,000 个。\n\n表 17.1 显示了一些选定的已知包。\n\
