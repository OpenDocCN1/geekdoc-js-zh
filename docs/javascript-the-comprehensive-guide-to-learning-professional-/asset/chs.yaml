  \ 选择器使用的一些示例\n\n##### 注意\n\n某些选择器如 `:odd`（用于选择所有“奇数”元素）、`:even`（用于选择所有“偶数”元素）、`:first`（用于选择第一个元素）和\
  \ `:last`（用于选择最后一个元素）自 jQuery 3.4 起已弃用。相反，你应该先使用适当的选择器选择元素，然后在结果上应用 `:odd`、`:even`、`:first`\
  \ 和 `:last` 方法（参见 列表 10.10）。\n\n#### 选择器的组合\n\n单独的选择器像你在 CSS 中知道的那样相互组合。\n\n###\
  \ 10.2.2 访问和修改内容\n\n通过上一节介绍的选择器选取元素后，jQuery 对象提供了多种方法来访问和修改内容。这些包括但不限于：\n\n* 访问\
  \ HTML 和文本内容（参见 表 10.9）\n* 在元素内部添加内容（参见 表 10.10）\n* 在元素外部添加内容（参见 表 10.11）\n* 在元素周围添加内容（参见\
  \ 表 10.12）\n* 替换内容（参见 表 10.13）\n\n### 表 10.9. 获取和定义的方法\n\n| 方法 |get |\n| --- | ---\
  \ |\n| `html()` | 不带参数时，该方法返回元素的 HTML 内容。带参数时，该方法设置元素的 HTML 内容。 |\n| `text()` |\
  \ 不带参数时，该方法返回元素的文本内容。带参数时，该方法设置元素的文本内容。 |\n\n| 方法 |get |\n| --- | --- |\n| `append()`\
  \ | 向选取元素的末尾添加内容：`$(a).append(b)` 将内容 `b` 添加到元素 `a` 的末尾。 |\n| `appendTo()` | `append()`\
  \ 的反向操作；即 `$(a).appendTo(b)` 将元素 `a` 作为内容添加到元素 `b` 的末尾。 |\n| `prepend()` | 在选取元素的开头插入内容：`$(a).prepend(b)`\
  \ 将内容 `b` 添加到元素 `a` 的开头。 |\n\n\n\n\n\n| `prependTo()` | `prepend()` 的相反方法；即，`$(a).prependTo(b)`\
  \ 将元素 `a` 作为内容添加到元素 `b` 的开头。 |\n\n**表 10.10** 在元素内部添加内容的方法\n\n![The Different Methods\
  \ for Adding Content inside and outside Elements](img/img-f10.1.html)\n\n**图 10.1**\
  \ 在元素内部和外部添加内容的不同方法\n\n| 方法 | 描述 |\n\n| --- | --- |\n\n| `after()` | 在每个选定的元素之后添加内容：`$(a).after(b)`\
  \ 将内容 `b` 插入到元素 `a` 之后（参见图 10.1）。 |\n| `before()` | 在每个选定的元素之前添加内容：`$(a).before(b)`\
  \ 将内容 `b` 插入到元素 `a` 之前（参见图 10.1）。 |\n| `insertAfter()` | `after()` 的相反方法；即，`$(a).insertAfter(b)`\
  \ 将元素 `a` 插入到元素 `b` 之后。 |\n| `insertBefore()` | `before()` 的相反方法；即，`$(a).insertBefore(b)`\
  \ 将元素 `a` 插入到元素 `b` 之前。 |\n\n**表 10.11** 在元素外部添加内容的方法\n\n| 方法 | 描述 |\n\n| --- |\
  \ --- |\n\n| `clone()` | 创建选定元素的副本。更准确地说，创建了一个所谓的深拷贝，它也会复制选定元素的子元素。 |\n| `wrap()`\
  \ | 在每个选定的元素周围添加新内容。 |\n| `wrapAll()` | 在所有选定的元素周围添加新内容。 |\n| `wrapInner()` | 在每个选定元素的内容周围添加新内容。\
  \ |\n\n**表 10.12** 在元素周围添加内容的方法\n\n| 方法 | 描述 |\n\n| --- | --- |\n\n| `replaceWith()`\
  \ | 用新内容替换选定的元素：`$(a).replaceWith(b)` 将元素 `a` 替换为内容 `b`。 |\n| `replaceAll()` | `replaceWith()`\
  \ 的相反方法；即，`$(a).replaceAll(b)` 将选择器 `b` 中的所有元素替换为 `a` 中的内容。 |\n\n**表 10.13** 替换内容的方法\n\
  \n| 方法 | 描述 |\n\n| --- | --- |\n\n| `detach()` | 将选定的元素从 DOM 树中移除，但保留对被移除元素的引用，以便稍后重新整合到\
  \ DOM 树中 |\n| `empty()` | 移除选定元素中的所有子节点 |\n| `remove()` | 从 DOM 树中移除选定的元素 |\n| `unwrap()`\
  \ | 从每个选定元素中移除父元素 |\n\n**表 10.14** 移除内容的方法\n\n这些方法的某些示例显示在代码列表 10.11 中。例如，你可以使用\
  \ `html()` 方法访问 HTML 内容，使用 `text()` 方法访问文本内容（均可用于读和写访问），使用 `append()` 在选定元素的现有内容后追加新内容，使用\
  \ `prepend()` 在现有内容之前插入内容，使用 `after()` 在选定元素之后追加新内容，以及使用 `before()` 在选定元素之前插入内容。\n\
  \n```\n// 添加新的 HTML 内容\n$('#main').html('<div>New content</div>');\n// 访问 HTML 内容\n\
  const htmlContent = $('#main').html();\n\n// 添加新的文本内容\n$('#main').text('New text\
  \ content');\n// 访问文本内容\nconst textContent = $('#main').text();\n\n// 在每个 CSS 类为\
  \ \"example\" 的 \n// <div> 元素的现有内容之后添加新内容\n$('div.example').append('<p>Example</p>');\n\
  \n// 在每个 CSS 类为 \"example\" 的 \n// <div> 元素的现有内容之前插入新内容\n$('div.example').prepend('<p>Example</p>');\n\
  \n// 在每个 CSS 类为 \"example\" 的 \n// <div> 元素之后添加新内容\n$('div.example').after('<p>Example</p>');\n\
  \n// 在每个 CSS 类为 \"example\" 的 \n// <div> 元素之前插入新内容\n$('div.example').before('<p>Example</p>');\
  \ \n```\n\n**代码列表 10.11** 更改和添加内容的示例\n\n### 10.2.3 过滤选定元素\n\njQuery 对象还为选定元素提供了各种方法，你可以用它们进一步缩小当前选中元素的范围（参见表\
  \ 10.15）。某些示例显示在代码列表 10.12 中：例如，`eq()` 方法将选择限制在索引为 2 的元素（即第三个 `<li>` 元素）；`first()`\
  \ 和 `last()` 方法让你分别选择选定元素中的第一个和最后一个；`filter()` 方法将选择限制在指定的选择器；而 `not()` 方法将选择限制在不匹配选择器的元素上。你还可以使用\
  \ `has()` 方法选择包含至少一个匹配给定选择器的子元素。图 10.2 插图了[代码列表 10.12]所示的过滤方法。\n\n```\n// 选择第三个\
  \ <li> 元素\n$('li').eq(2);\n// 选择第一个 <li> 元素\n$('li').first();\n// 选择具有 CSS 类 \"\
  .selected\" 的 <li> 元素\n$('li').filter('.selected');\n// 选择包含 <ul> 元素的 <li>\n$('li').has('ul');\n\
  // 选择具有 CSS 类 \".selected\" 的元素\n$('li').has('.selected');\n// 选择最后一个 <li> 元素\n\
  $('li').last();\n// 获取所有 <li> 元素的类\n$('li').map(() => { this.className });\n// 选择不具有\
  \ CSS 类 \".selected\" 的 <li> 元素\n$('li').not('.selected');\n// 选择前两个 <li> 元素\n$('li').slice(0,\
  \ 2); \n```\n\n**代码列表 10.12** 不同过滤方法的用法\n\n![Narrowing Down Elements via jQuery\
  \ Filter Methods](img/img-f10.2.html)\n\n**图 10.2** 通过 jQuery 过滤方法缩小范围\n\n| 方法 |\
  \ 描述 |\n\n| --- | --- |\n\n| `add()` | 向元素选择中添加新元素 |\n| `addBack()` | 将之前的选择添加到当前元素选择中\
  \ |\n| `eq()` | 将选定元素减少为给定索引的一个元素 |\n\n\n\n\n\n| 方法 | 说明 |\n| --- | --- |\n| `filter()`\
  \ | 将所选元素减少为符合条件的 (1) 匹配传递的选择器或 (2) 传递的过滤函数返回 `true` 的元素 |\n| `find()` | 选择所选元素的子元素，这些元素\
  \ (1) 匹配传递的选择器，(2) 包含在传递的 jQuery 对象中，或 (3) 等于传递的元素 |\n| `first()` | 将所选元素减少为第一个元素\
  \ |\n| `has()` | 将所选元素减少为拥有子元素的元素，该子元素符合 (1) 匹配传递的选择器或 (2) 等于传递的元素 |\n| `is()` |\
  \ 检查所选元素中是否至少有一个元素：(1) 匹配传递的选择器，(2) 对于传递的过滤函数返回 `true`，(3) 包含在传递的 jQuery 对象中，或 (4)\
  \ 是作为参数传递的元素之一 |\n| `last()` | 将所选元素减少为最后一个元素 |\n| `not()` | 将所选元素减少为 (1) 不匹配传递的选择器，(2)\
  \ 不匹配传递的过滤函数，或 (3) 不包含在传递的 jQuery 对象中的元素 |\n| `slice()` | 将所选元素减少为由起始和结束索引定义的子集\
  \ |\n\n表 10.15 过滤方法\n\n### 10.2.4 访问属性\n\njQuery 对象还提供了一些用于访问 HTML 属性的方法（参见表 10.16）。`attr()`\
  \ 方法可用于确定或重置属性值，如列表 10.13 所示：如果你向方法传递属性名称，该方法将返回属性的对应值；相反，如果你将另一个字符串作为第二个参数传递给方法，则该字符串将作为属性的新值。\n\
  \n或者，你可以向方法传递一个对象以便一次添加多个属性。在这种情况下，对象的属性名用作属性名称，对象的属性值用作属性的值。\n\n然而，要删除属性，请使用 `removeAttr()`\
  \ 方法。添加和移除 CSS 类，可以使用 `addClass()` 和 `removeClass()` 方法。不过，这两个方法实际上是多余的——至少对于支持\
  \ `classList` 属性的较新浏览器而言，通过 `add()` 和 `remove()` 方法提供了等等的功能。\n\n```\nconst element\
  \ = $('a#main');\n// 对元素的 \"href\" 属性进行读取访问\nconst href = element.attr('href');\n\
  // 对元素的 \"href\" 属性进行写入访问\nelement.attr('href', 'index.html');\n// 通过配置对象进行另一种写入访问\n\
  element.attr({\n  href: 'index.html',\n  target: '_blank'\n});\n// 从元素中移除 \"href\"\
  \ 属性\nelement.removeAttr('href');\n// 添加 CSS 类\nelement.addClass('highlighted');\n\
  // 移除 CSS 类\nelement.removeClass('highlighted'); \n```\n\n列表 10.13 访问属性和 CSS 类\n\
  \n| 方法 | 说明 |\n| --- | --- |\n| `attr()` | 带一个参数时，该方法返回属性的值（例如 `$('a#main').attr('href')`）。带两个参数时，该方法设置属性的值（例如\
  \ `$('a#main').attr('href', 'index.html')`）。 |\n| `removeAttr()` | 从元素中移除属性，例如 `$('a#main').removeAttr\
  \ ('href')`。 |\n| `addClass()` | 在 `class` 属性的值中添加新的 CSS 类。在较新的浏览器中，得于标准化的 `classList`\
  \ 属性及其 `add()` 方法，无需 jQuery 即可实现这一点。 |\n| `removeClass()` | 从 `class` 属性的值中移除 CSS\
  \ 类。同样得于 `classList` 属性及其 `remove()` 方法，在较新的浏览器中无需 jQuery 即可实现。然而，`removeClass()`\
  \ 方法也可以传递一个返回逗号分隔 CSS 类列表的函数。这种功能通过 `classList` 属性的 `remove()` 方法无法实现。 |\n| `toggleClass()`\
  \ | 切换 CSS 类：如果元素具有传递的类，则移除该类；如果元素不具有传递的类，则添加该类。 |\n\n表 10.16 访问属性和 CSS 类的方法\n\n\
  ### 10.2.5 访问 CSS 属性\n\n要访问 CSS 属性，jQuery 提供了 `css()` 方法。像 `html()`、`text()` 和 `attr()`\
  \ 等方法一样，该方法既可用于读取也可用于设置值。对于读取操作，向方法传递要读取其值的 CSS 属性名称；对于设置操作，将要设置的值作为第二个参数指定。\n\n\
  或者，类似于 `attr()` 方法，可以传递对象作为参数，相应的属性将用作 CSS 属性。此外，你也可以传递一个字符串数组作为参数，以一步之读取多个 CSS\
  \ 属性的值。列表 10.14 中显示了了一些示例。\n\n```\n// 读取 <body> 元素的背景颜色\nconst backgroundColor =\
  \ $('body').css('background-color');\n// 读取 <body> 元素的文字颜色和背景颜色\nconst properties\
  \ = $('body').css(['color', 'background-color']);\n// 设置 <body> 元素的背景颜色\n$('body').css('background-color',\
  \ 'blue');\n// 设置 <body> 元素的文字颜色和背景颜色\n$('body').css({\n 'color': 'white', \n 'background-color':\
  \ 'blue'\n}); \n```\n\n列表 10.14 访问 CSS 属性\n\n### 10.2.6 元素间的导航\n\n从存储在 jQuery 对象中的元素选择开始，你可以使用前面介绍的方法来查找与这些元素具有特定关系的元素，例如父元素、兄弟元素和子元素。列表\
  \ 10.15 中显示了一些示例。这些方法的相应描述可以在表 10.17 中找到。\n\n\n\n\n\n```javascript\n// Child elements\n\
  // Selection of all child elements of <ul>\nconst listItems = $('ul').children();\n\
  // Selection of the next link within <ul>\nconst closestLink = $('ul').closest('a');\n\
  \n// Sibling elements\n// Selection of the next sibling element\nconst nextSibling\
  \ = $('ul').next();\n// Selection of the next link element\nconst nextSiblingLink\
  \ = $('ul').next('a');\n// Selection of all next sibling elements\nconst nextSiblings\
  \ = $('ul').nextAll();\n// Selection of all next link elements\nconst nextSiblingLinks\
  \ = $('div').nextAll('a');\n// Selection of all next sibling elements up to the\
  \ specified element\nconst nextSiblingsUntil = $('div').nextUntil('a');\n// Selection\
  \ of the previous sibling element\nconst previousSibling = $('ul').prev();\n// Selection\
  \ of all previous sibling elements\nconst previousSiblings = $('ul').prevAll();\n\
  // Selection of all previous sibling elements up to the specified element\nconst\
  \ previousSiblingsUntil = $('div').prevUntil('a');\n// Selection of all sibling\
  \ elements\nconst siblings = $('div').siblings();\n\n// Parent elements\n// Selection\
  \ of the parent element\nconst parent = $('ul').parent();\n// Selection of all parent\
  \ elements\nconst parents = $('ul').parents();\n// Selection of all parent elements\
  \ up to the specified element\nconst parentsUntil = $('ul').parentsUntil('div');\
  \ \n```\n\n**Listing 10.15** 元素导航的各种示例\n\n| Method | Description |\n| --- | ---\
  \ |\n| `children()` | 选择所选元素的子元素。可以传递一个选择器——在这种情况下，只选择符合该选择器的子元素... |\n| `closest()`\
  \ | 在所选元素中选择第一个匹配作为参数传递的选择器的元素，或者其其中一个父元素匹配该选择器的元素。 |\n| `next()` | 选择所选元素的下一个兄弟元素。如果传递了选择器，则选择匹配该选择器的下一个兄弟元素。\
  \ |\n| `nextAll()` | 选择所选元素的所有后续兄弟元素。如果传递了选择器，则选择匹配该选择器的所有后续兄弟元素。 |\n| `nextUntil()`\
  \ | 选择所选元素的所有后续兄弟元素。如果传递了选择器，则选择到匹配该选择器的兄弟元素为止的所有后续兄弟元素。 |\n| `parent()` | 选择所选元素的父元素。\
  \ |\n| `parents()` | 选择所选元素在层级结构中之前的所有父元素。 |\n| `parentsUntil()` | 选择所选元素在层级结构中之前的所有父元素，直到\
  \ (1) 匹配传递的选择器，2) 匹配传递的元素或 (3) 被包含在传递的 jQuery 对象中。 |\n| `prev()` | 选择所选元素的上一个兄弟元素。如果传递了选择器，则选择匹配该选择器的上一个兄弟元素。\
  \ |\n| `prevAll()` | 选择所选元素的所有之前兄弟元素。如果传递了选择器，则选择匹配该选择器的所有之前兄弟元素。 |\n| `prevUntil()`\
  \ | 选择所选元素的所有之前兄弟元素。如果传递了选择器，则选择到匹配该选择器的兄弟元素为止的所有之前兄弟元素。 |\n| `siblings()` | 选择所选元素的所有兄弟元素。如果传递了选择器，则选择匹配该选择器的兄弟元素。\
  \ |\n\n**表格 10.17** 遍历 DOM 树的方法\n\n### 10.2.7 使用效果和动画\n\n网页元素淡入或淡出等效果并不总是像现在借助 CSS3\
  \ 动画那样易于实现。因此，难怪 jQuery 也提供了几种方法来实现这些效果，其中最重要的方法在 [表 10.18] 中。例如，通过 `fadeIn()`、`fadeOut()`\
  \ 和 `fadeToggle()`，可以让所选元素淡入和淡出，而 `slideDown()`、`slideUp()` 和 `slideToggle()` 则允许让所选元素滑入和滑出。\n\
  \n最灵活的选项由 `animate()` 提供。该方法可以以配置对象的形式传递各种需要动画处理的 CSS 属性、动画的速度或持续时间（既可以是字符串，如 `fast`\
  \ 或 `slow` 值之一，也可以指定毫秒持续时间的数值）、缓动函数（描述了动画速度相对于动画内时间的行为）以及一个在动画完全执行后调用的回调函数（参见 [列表\
  \ 10.16]）。\n\n| Method | Description |\n| --- | --- |\n| `animate()` | 实现 CSS 属性的动画。\
  \ |\n| `clearQueue()` | 从队列中移除所有尚未执行的动画。 |\n| `delay()` | 按指定的毫秒数延迟动画。 |\n| `dequeue()`\
  \ | 执行队列中的下一个动画。 |\n| `fadeIn()` | 将所选元素淡入。 |\n| `fadeOut()` | 将所选元素淡出。 |\n| `fadeTo()`\
  \ | 调整所选元素的透明度。 |\n| `fadeToggle()` | 根据元素状态将所选元素淡入或淡出：如果元素是可见的，则淡出；但如果不可见，则淡入。\
  \ |\n| `finish()` | 停止当前动画，从队列中移除所有动画，并将所选元素的 CSS 属性设置为目标值。 |\n| `hide()` | 隐藏所选元素。\
  \ |\n| `queue()` | 访问队列中的动画。 |\n| `show()` | 显示所选元素。 |\n| `slideDown()` | 将所选元素从顶部向下滑入。\
  \ |\n| `slideToggle()` | 根据元素状态让所选元素滑入或滑出：如果元素是可见的，则从底部滑出；但如果不可见，则从顶部向下滑入。 |\n|\
  \ `slideUp()` | 将所选元素从底部向上滑出。 |\n| `stop()` | 停止当前动画。 |\n| `toggle()` | 隐藏或显示所选元素：如果元素是可见的，则隐藏；但如果不可见，则显示。\
  \ |\n\n**表 10.18** 显示和隐藏元素的方法\n\n```javascript\n'use strict';\n$(document).ready(()\
  \ => {\n  $('main').animate(\n    { opacity: 0.75 }, // 属性\n    'fast',        \
  \    // 速度\n    'swing',           // 缓动\n    () => {\n      // 动画完成\n    }\n  );\n\
  }); \n```\n\n**列表 10.16** 访问 CSS 属性\n\n## 10.3 响应事件\n\n\n\n\n\n如你在第 6 章中所回顾的，有几种方法可以捕获事件。事件处理器通常适用于相应的事件，此外还可以通过\
  \ `addEventListener()` 方法为一个事件注册多个事件监听器。旧版本的 Internet Explorer 也使用 `attachEvent()`\
  \ 方法，其功能与此类似。\n\n我们在第 6 章中也展示了一个与浏览器无关的辅助函数。jQuery 库也提供了与浏览器无关的解决方案。\n\n### 10.3.1\
  \ 注册事件监听器\n\njQuery 提供了几种方法来响应事件或注册事件监听器。因此，一方面你可以使用在 jQuery 对象上调用的 `on()` 方法，如列表\
  \ 10.17 所示：你将要响应的事件名称作为第一个参数，并将函数形式的事件监听器作为第二个参数。\n\n```\n$('#button').on('click',\
  \ (event) => {\n  console.log('Button pressed');\n}); \n```\n\n**代码列表 10.17** 注册事件监听器\n\
  \n#### 注意\n\n如果 jQuery 对象包含对多个元素的引用，则对选择中的每个元素调用事件方法将触发相应的事件监听器。\n\n作为通用 `on()`\
  \ 方法的替代方案，jQuery 提供了专门以要捕获的事件命名的方法，例如在列表 10.18 中找到 `click()` 方法。逻辑上讲，这些事件方法不需要将相应的事件名称作为参数传递，只需要传递事件监听器。\n\
  \n```\n$('#button').click((event) => {\n  console.log('Button pressed');\n}); \n\
  ```\n\n**代码列表 10.18** 通过简写方法注册事件监听器\n\n总的来说，事件方法可以分类如下：\n\n* 通用事件方法（参见表 10.19）\n\
  * 处理鼠标事件的事件方法（第 10.3.3 节）\n* 处理键盘事件的事件方法（第 10.3.4 节）\n* 处理表单事件的事件方法（第 10.3.5 节）\n\
  \n| 方法 |  |\n| --- | --- |\n| `bind()` | 为事件添加事件监听器。但是，根据官方文档，从 jQuery 1.7 开始，应该使用\
  \ `on()` 方法。 |\n| `delegate()` | 对于旧版本的 jQuery，这是为事件添加事件监听器的首选方法。但是，从 jQuery 1.7\
  \ 开始，应该使用 `on()` 方法。 |\n| `off()` | 移除某个事件的事件监听器。 |\n| `on()` | 为事件添加事件监听器。 |\n\
  | `one()` | 为每个选定的元素添加一个每个事件最多触发一次的事件监听器。 |\n| `trigger()` | 运行为某个事件注册的所有事件监听器。\
  \ |\n| `triggerHandler()` | 与 `trigger()` 方法类似，但不会执行事件的默认行为（例如提交表单）。 |\n| `unbind()`\
  \ | 移除某个事件的事件监听器。但是，根据官方文档，从 jQuery 1.7 开始，应该使用 `off()` 方法。 |\n| `undelegate()`\
  \ | 对于旧版本的 jQuery，这是移除事件事件监听器的首选方法。但是，从 jQuery 1.7 开始，应该使用 `off()` 方法。 |\n\n**表\
  \ 10.19** 管理事件处理器的方法\n\n### 10.3.2 响应通用事件\n\n表 10.20 包含了一些为通用事件注册事件监听器的方法：`error()`\
  \ 允许你注册在选定元素发生 `error` 事件时触发的事件监听器；通过 `ready()` 注册的事件监听器会在相应元素加载后立即调用（参见列表 10.19）；通过\
  \ `resize()` 注册的事件监听器会在元素发生 `resize` 事件时调用；通过 `scroll()` 注册的事件监听器会在元素发生 `scroll`\
  \ 事件时调用。\n\n| 方法 | 描述 |\n| --- | --- |\n| `error()` | 注册在发生 `error` 事件时执行的事件监听器。\
  \ |\n| `ready()` | 注册在 DOM 或传递方法的元素完全加载后执行的事件监听器。 |\n| `resize()` | 注册在发生 `resize`\
  \ 事件时执行的事件监听器。 |\n| `scroll()` | 注册在元素滚动时执行的事件监听器。 |\n\n**表 10.20** 注册监听器的不同方法\n\
  \n```\n$(document).ready(() => {\n  console.log('Web page loaded');\n}); \n```\n\
  \n**代码列表 10.19** 为文档注册事件监听器\n\n### 10.3.3 响应鼠标事件\n\n表 10.21 显示了 jQuery 用于为鼠标事件注册事件监听器的方法。它们基本上对应于你从第\
  \ 6 章已经知道的事件：`click()` 和 `dblclick()` 用于鼠标点击；`focusin()` 和 `focusout()` 用于元素聚焦；以及\
  \ `mousedown()`、`mouseenter()`、`mouseleave()`、`mousemove()`、`mouseout()`、`mouseover()`\
  \ 和 `mouseup()` 用于鼠标在元素上的移动。\n\n| 方法 | 描述 |\n| --- | --- |\n| `click()` | 注册在鼠标点击时执行的事件监听器。\
  \ |\n| `dblclick()` | 注册在鼠标双击时执行的事件监听器。 |\n| `focusin()` | 注册在元素获取焦点时执行的事件监听器。 |\n\
  | `focusout()` | 注册在元素失去焦点时执行的事件监听器。 |\n| `hover()` | 注册在鼠标指针悬停在元素上时执行的事件监听器。 |\n\
  | `mousedown()` | 注册在鼠标指针位于元素上并按下鼠标时执行的事件监听器。 |\n| `mouseenter()` | 注册在鼠标指针进入元素时执行的事件监听器。\
  \ |\n| `mouseleave()` | 注册在鼠标指针离开元素时执行的事件监听器。 |\n\n\n\n\n\n| `mousemove()` | 注册当鼠标在元素上移动时触发的事件监听器\
  \ |\n| `mouseout()` | 注册当鼠标指针离开元素时执行的事件监听器 |\n| `mouseover()` | 注册当鼠标指针进入元素时执行的事件监听器\
  \ |\n| `mouseup()` | 注册当鼠标指针位于元素上且释放鼠标时执行的事件监听器 |\n\n### 表 10.21 处理鼠标事件的方法\n\n示例在列表\
  \ 10.20 中所示。\n\n```javascript\n$('button#target').click((event) => {\n  console.log('Button\
  \ was pressed');\n}); \n```\n\n#### 列表 10.20 为鼠标事件注册事件监听器\n\n顺便提一下，也可以使用事件方法来触发事件，而不是注册事件监听器。要这样做，只需直接调用对应的方法而不传递任何参数即可。例如，在列表\
  \ 10.21 中，在第二个事件监听器（注册在 ID 为 `target2` 的 `<button>` 元素上）内部，触发 ID 为 `target` 的 `<button>`\
  \ 元素的 `click` 事件。\n\n```javascript\n$('button#target').click((event) => {\n  console.log('Button\
  \ was pressed');\n});\n$('button#target2').click((event) => {\n  $('button#target').click();\n\
  }); \n```\n\n#### 列表 10.21 触发事件\n\n##### 注意\n\njQuery 中的大多数方法可以使用不同数量的参数调用，每个方法都有不同的功能。例如，在本章前面所示，你可以使用\
  \ `attr()` 方法同时读取和写入 HTML 属性；或者像刚才所示的，你可以使用事件方法同时注册事件监听器和触发事件。\n\n### 10.3.4 响应键盘事件\n\
  \n注册键盘事件的事件监听器，可以使用表 10.22 中列出的方法：`keydown()`、`keyup()` 和 `keypress()`，用于注册在按下或释放键时触发的事件监听器。同样，这些内容在第\
  \ 6 章中应该已经很熟悉。\n\n| 方法 | 描述 |\n| --- | --- |\n| `keydown()` | 注册当键盘上的键被按下时执行的事件监听器。如果按键时间较长，事件监听器将执行多次。\
  \ |\n| `keypress()` | 注册当键盘上的键被按下时执行的事件监听器。 |\n| `keyup()` | 注册当键盘上的键被释放时执行的事件监听器。\
  \ |\n\n#### 表 10.22 处理键盘事件的方法\n\n使用这些方法的示例在列表 10.22 中。这很好地说明了各个事件方法（或泛指所有 jQuery\
  \ 方法）如何连续使用。\n\n```javascript\n$('input#username')\n  .keypress((event) => {\n \
  \   console.log('Key for entering username pressed.');\n  })\n  .keydown((event)\
  \ => {\n    console.log('Key is pressed.');\n  })\n  .keyup((event) => {\n    console.log('Key\
  \ for entering username released.');\n  }); \n```\n\n#### 列表 10.22 为键盘事件注册不同的事件监听器\n\
  \n##### 流式 API\n\n当 API 允许你直接在方法的返回值上调用另一个方法时（如列表 10.22 所示），它被称为流式 API（Fluent API）。\n\
  \n### 10.3.5 响应表单事件\n\n表 10.23 中列出的与表单事件相关的事件监听器注册方法在第 6 章中应该也很熟悉：`blur()` 和 `focus()`\
  \ 用于注册表单字段失去或获得焦点时触发的事件监听器；`change()` 用于表单字段的值改变时；`select()` 用于表单字段选择了某个特定值时；以及\
  \ `submit()` 用于表单提交时。\n\n| 方法 | 描述 |\n| --- | --- |\n| `blur()` | 注册当表单字段失去焦点时执行的事件监听器\
  \ |\n| `change()` | 注册当选择列表、复选框或单选框组发生改变时执行的事件监听器 |\n| `focus()` | 注册当表单字段获得焦点时执行的事件监听器\
  \ |\n| `select()` | 注册当 `<input type=\"text\">` 或 `<textarea>` 元素的文本被选中时执行的事件监听器\
  \ |\n| `submit()` | 注册当表单提交时执行的事件监听器 |\n\n#### 表 10.23 表单事件的方法\n\n一些示例在列表 10.23\
  \ 中所示。\n\n```javascript\n$('input#username')\n  .focus((event) => {\n    console.log('Input\
  \ field focused.');\n  })\n  .blur((event) => {\n    console.log('Input field no\
  \ focused.');\n  })\n  .change((event) => {\n    console.log('Text changed.');\n\
  \  })\n  .select((event) => {\n    console.log('Text selected.');\n  }); \n```\n\
  \n#### 列表 10.23 为表单事件注册不同的事件监听器\n\n### 10.3.6 从事件获取信息\n\n事件对象作为参数在每个事件监听器可用，包含了不同的信息并提供了不同的方法，如表\
  \ 10.24 所示。基本上，这些都是在第 6 章中讨论的标准事件对象包含的信息，并补充了一些细节。但再次，jQuery 隐藏了特定器的细节，实现了跨浏览器的使用。\n\
  \n| 属性/方法 | 描述 |\n| --- | --- |\n| `currentTarget` | 冒泡阶段的当前元素 |\n| `data` | 传递给事件方法的可选数据对象\
  \ |\n| `delegateTarget` | 注册事件监听器的元素 |\n| `isDefaultPrevented()` | 表示事件对象上是否调用了\
  \ `preventDefault()` |\n| `isImmediatePropagationStopped()` | 表示事件对象上是否调用了 `stopImmediatePropagation()`\
  \ |\n| `isPropagationStopped()` | 表示事件对象上是否调用了 `stopPropagation()` |\n| `metaKey`\
  \ | 触发事件时是否按下了所谓的元键（Mac 键盘为 (cmd) 键；Windows 键盘为 (Windows) 键） |\n| `namespace` |\
  \ 事件的命名空间 |\n| `pageX` | 鼠标相对于文档左边缘的坐标 |\n| `pageY` | 鼠标相对于文档顶部的坐标 |\n\n\n\n\n\n\
  | `preventDefault()` | 防止事件的默认动作执行 |\n| `relatedTarget` | 对于触发事件的元素，包含与该事件直接相关的元素（例如，在\
  \ `mouseout` 事件的情况下，由同一用户操作触发了 `mouseover` 事件的元素） |\n| `result` | 包含之前为该事件触发的事件监听器的结果\
  \ |\n| `stopImmediatePropagation()` | 立即防止事件在冒泡阶段进一步向上触发 |\n| `stopPropagation()`\
  \ | 防止事件在冒泡阶段进一步向上触发 |\n| `target` | 包含触发事件的元素 |\n| `timeStamp` | 包含指示事件触发时间的时间戳\
  \ |\n| `type` | 包含事件的类型 |\n| `which` | 在鼠标或键盘事件的情况下，包含被按下的鼠标按键或键盘上的按键 |\n\n**表 10.24**\
  \ 事件对象的属性和方法\n\n代码列表 10.24 展示了如何访问这些信息的示例。最重要的是，你在这里也可以看到，可以可以向事件传递一个数据对象，然后你可以在事件监听器中访问该对象。\n\
  \n```\n$('input').on(\n  'change,\n  {\n    value : 4711                       //\
  \ Data object\n  },\n  (event) => {\n    console.log(event.currentTarget);  // current\
  \ element\n    console.log(event.data);           // data object\n    console.log(event.data.value);\
  \     // property of the data object\n    console.log(event.pageX);          //\
  \ x position of mouse\n    console.log(event.pageY);          // y position of mouse\n\
  \  }\n); \n```\n\n**代码列表 10.24** 访问 jQuery 事件对象\n\n## 10.4 创建 Ajax 请求\n\njQuery\
  \ 也大大简化了 Ajax 请求的生成。在这里，我们将展示如何通过适当的 jQuery 方法实现第 9 章中基于 Ajax 加载 HTML、XML 和 JSON\
  \ 数据的示例。\n\n### 10.4.1 创建 Ajax 请求\n\n对于创建 Ajax 请求，jQuery 提供了几种方法，列在表 10.25 中。这些方法除了\
  \ `load()` 方法外，不是像本章之前那样在元素选择集上调用的，而是直接在 `$` 对象上调用的。因此，我们之前称这些方法为 jQuery 全局方法。\n\
  \n| 方法 | 描述 |\n| --- | --- |\n| `$.ajax()` | 执行异步 HTTP 请求 |\n| `$.get()` | 使用 HTTP\
  \ `GET` 方法执行 HTTP 请求 |\n| `$.getJSON()` | 执行 HTTP `GET` 请求从服务器加载 JSON 数据 |\n| `$.getScript()`\
  \ | 执行 HTTP `GET` 请求从服务器加载 JavaScript 数据并直接执行它 |\n| `load()` | 执行 HTTP `GET` 请求从服务器加载\
  \ HTML 数据并将其直接嵌入到选中的元素中 |\n| `$.post()` | 使用 HTTP `POST` 方法执行 HTTP 请求 |\n\n**表 10.25**\
  \ 处理 Ajax 的主要方法\n\njQuery 全局方法 `ajax()`（或 `$.ajax()`）允许你创建任意的 Ajax 请求。该方法 get 配置对象在请求配置方面提供了最大的灵活性。\n\
  \n`get()` 和 `post()` 方法用于创建 `GET` 或 `POST` 请求，这意味着你不需要担心这些请求请求的特定配置，例如指定 HTTP 方法。\n\
  \n此外，还有专门的方法用于加载 HTML 数据 (`load()`)、加载 JSON 数据 (`getJSON()`) 以及加载 JavaScript 文件\
  \ (`getScript()`)。\n\n代码列表 10.25 展示了使用 `ajax()` 方法的示例，你已经在第 9 章中了解了它的原理：目标是从服务器加载\
  \ JSON 数据并为这些数据动态创建一个表格。\n\n请求的 URL 通过配置对象的 `url` 属性配置，预期的响应类型通过 `dataType` 属性指定（例如包括\
  \ `json`、`xml` 或 `html`），请求类型通过 `type` 属性指定。请求成功执行或出错的回调函数可以通过 `success` 和 `error`\
  \ 属性定义。在 `success` 回调函数中，在示例中通过 `data` 参数访问服务器的响应。因为这是 JSON 数据，如前面提到的，它可以被直接处理以创建表格。\n\
  \n```\n'use strict';\n$(document).ready(() => {\n  $.ajax({\n    url: 'artists.json',\n\
  \    dataType: 'json',\n    type: 'GET',\n    success: (data) => {\n      const\
  \ table = initTable();\n      const artists = data.artists;\n      for (let i =\
  \ 0; i < artists.length; i++) {\n        const artist = artists[i];\n        const\
  \ albums = artist.albums;\n        for (let j = 0; j < albums.length; j++) {\n \
  \         const album = albums[j];\n          const row = createRow(\n         \
  \   artist.name,\n            album.title,\n            album.year\n          );\n\
  \          $(table).find('tbody').append(row);\n        }\n      }\n      $('#artists-container').append(table);\n\
  \    },\n    error: (jqXHR, errorMessage, error) => {\n    }\n  });\n}); \n```\n\
  \n**代码列表 10.25** 生成 Ajax 请求\n\n作为通过 `success` 和 `error` 属性指定回调函数的备选方案，你也可以选择通过 `done()`\
  \ 和 `fail()` 方法来定义它们，得益于 jQuery 的链式 API，这些方法可以直接与调用 `ajax()` 方法结合使用（参见代码列表 10.26）。\n\
  \n\n\n\n\n```\n'use strict';\n$(document).ready(() => {\n  $.ajax({\n    url: 'artists.json',\n\
  \    dataType: 'json',\n    type: 'GET'\n  })\n  .done((data) => {\n    const table\
  \ = initTable();\n    const artists = data.artists;\n    for (let i = 0; i < artists.length;\
  \ i++) {\n      const artist = artists[i];\n      const albums = artist.albums;\n\
  \      for (let j = 0; j < albums.length; j++) {\n        const album = albums[j];\n\
  \        const row = createRow(\n          artist.name,\n          album.title,\n\
  \          album.year\n        );\n        $(table).find('tbody').append(row);\n\
  \      }\n    }\n    $('#artists-container').append(table);\n  })\n  .fail((jqXHR,\
  \ errorMessage, error) => {\n  });\n}); \n```\n\n**列表 10.26** 通过流式 API 生成 Ajax 请求\n\
  \n### 10.4.2 响应事件\n\n对于响应与处理 Ajax 请求相关的事件，jQuery 提供了表 10.26 所示的方法。\n\n| 方法 | 描述\
  \ |\n| --- | --- |\n| `ajaxComplete()` | 指定一个在 Ajax 请求完成时调用的事件监听器 |\n| `ajaxError()`\
  \ | 指定一个用于错误的事件监听器 |\n| `ajaxSend()` | 指定一个在 Ajax 请求发送时调用的事件监听器 |\n| `ajaxStart()`\
  \ | 指定一个在第一个 Ajax 请求开始时调用的事件监听器 |\n| `ajaxStop()` | 指定一个在所有 Ajax 请求完成后调用的事件监听器 |\n\
  | `ajaxSuccess()` | 指定一个每当 Ajax 请求成功完成时都调用的事件监听器 |\n\n**表 10.26** 处理 Ajax 事件的方法\n\
  \n示例在列表 10.27 中所示。这里有两点需要注意：首先，每个方法都是在元素选择（或相应的 jQuery 对象）上调用的；其次，每个事件监听器的参数数量各不同。`ajaxStart()`\
  \ 和 `ajaxStop()` 的事件监听器完全没有参数，`ajaxSend()` 和 `ajaxComplete()` 的事件监听器各接收一个事件对象、一个代表\
  \ Ajax 请求的对象以及一个与请求相关的配置对象。`ajaxSuccess()` 和 `ajaxError()` 方法的事件监听器分别接收响应数据和错误对象。\n\
  \n```\n$(document)\n  .ajaxStart(() => {\n    console.log('Request started.');\n\
  \  })\n  .ajaxSend((event, request, settings) => {\n    console.log('Request sent.');\n\
  \  })\n  .ajaxSuccess((event, request, settings, data) => {\n    console.log('Request\
  \ completed successfully');\n  })\n  .ajaxError((event, request, settings, error)\
  \ => {\n    console.log('Error on request: ' + error);\n  })\n  .ajaxComplete((event,\
  \ request, settings) => {\n    console.log('Request completed.');\n  })\n  .ajaxStop(()\
  \ => {\n    console.log('All requests completed.');\n  }); \n```\n\n**列表 10.27**\
  \ 为 Ajax 事件注册不同的事件监听器\n\n### 10.4.3 通过 Ajax 加载 HTML 数据\n\n要通过 Ajax 加载 HTML 数据，你可以按照列表\
  \ 10.28 所示的方法，并使用 jQuery 全局 `get()` 方法。这里的要点是将值 `html` 传递给 `dataType` 属性。然后你可以在相应的回调函数中使用\
  \ `html()` 将响应数据直接赋值给元素并作为 HTML 内容。\n\n```\n'use strict';\n$(document).ready(()\
  \ => {\n  const login = $('#login');\n  const register = $('#register');\n  login.click((e)\
  \ => {\n    e.preventDefault();\n    loadContent('login');\n  });\n  register.click((e)\
  \ => {\n    e.preventDefault();\n    loadContent('register');\n  });\n});\n\nfunction\
  \ loadContent(name) {\n  $.get({\n    url: name + '.html', \n    dataType: 'html'\n\
  \  }).done((data) => {\n    $('#main-content').html(data);\n  });\n} \n```\n\n**列表\
  \ 10.28** 通过 Ajax 加载 HTML 数据\n\n但使用 `load()` 方法此过程会变得更简单，如列表 10.29 所示。你可以直接在 jQuery\
  \ 对象（它所代表的选择器）上调用此方法。作为参数，你传递应该加载数据的 URL，以及一个可选的在数据加载成功后调用的回调函数。\n\n```javascript\n\
  function loadContent(name) {\n  $('#main-content').load(\n    name + '.html',\n\
  \    (responseText, status, jqXHR) => {\n      // ...\n    }\n```\n``` \n\n你可以可选地在\
  \ URL 和回调函数之间插入另一个参数——即定义随请求发送的数据（以字符串的形式）。这非常有用，例如当服务器需要根据数据生成此或那种响应时。\n\n### 10.4.4\
  \ 通过 Ajax 加载 XML 数据\n\n要加载 XML 数据，请使用列表 10.30 所示的 `get()` 方法，为 `dataType` 属性传递 `xml`\
  \ 值。在回调函数内部，响应数据将以 DOM 树的形式可用。这种方法的好处是 jQuery 的 `$()` 方法也可以使用它——例如使用列表所示的 `find()`\
  \ 方法选择所有的 `<artist>` 元素，使用 `each()`（这也是 jQuery 的另一个辅助方法）遍历这些元素，或者使用 `text()` 访问\
  \ `<title>` 和 `<year>` 元素的文本内容。\n\n```\n'use strict';\n$(document).ready(() => {\n\
  \  $.get({\n    url: 'artists.xml',\n    dataType: 'xml'\n  }).done((data) => {\n\
  \    const table = initTable();\n    const artists = $(data).find('artist');\n \
  \   artists.each((index, artist) => {\n      const albums = $(artist).find('album');\n\
  \      albums.each((index, album) => {\n        const row = createRow(\n       \
  \   artist.getAttribute('name'),\n          $(album).find('title').text(),\n   \
  \       $(album).find('year').text()\n        );\n        $(table).find('tbody').append(row);\n\
  \      });\n    });\n    $('#artists-container').append(table);\n  });\n}); \n```\n\
  \n**列表 10.30** 通过 Ajax 加载 XML 数据\n\n### 10.4.5 通过 Ajax 加载 JSON 数据\n\n我们在第 10.4.1\
  \ 节开头向你展示了如何使用 `ajax()` 方法通过 jQuery 加载 JSON 数据。列表 10.31 展示了使用 `get()` 方法的等效示例。你为\
  \ `dataType` 属性指定 `json` 值，然后就可以像往常一样在回调函数中访问服务器发送的 JSON 数据。\n\n\n\n\n\n```javascript\n\
  'use strict';\n$(document).ready(() => {\n  $.get({\n    url: 'artists.json',\n\
  \    dataType: 'json'\n  }).done((data) => {\n    const table = initTable();\n \
  \   const artists = data.artists;\n    for (let i = 0; i < artists.length; i++)\
  \ {\n      const artist = artists[i];\n      const albums = artist.albums;\n   \
  \   for (let j = 0; j < albums.length; j++) {\n        const album = albums[j];\n\
  \        const row = createRow(\n          artist.name,\n          album.title,\n\
  \          album.year\n        );\n        $(table).find('tbody').append(row);\n\
  \      }\n    }\n    $('#artists-container').append(table);\n  });\n}); \n```\n\n\
  列表 10.31 通过 Ajax 加载 JSON 数据\n\n另一种，jQuery 提供了 `getJSON()` 方法，它进一步简化了 JSON 数据请求（参见列表\
  \ 10.32）。作为参数，你向此方法传递要请求的 URL 以及一个用于访问服务器发送的 JSON 数据的回调函数。\n\n```javascript\n'use\
  \ strict';\n$(document).ready(() => {\n  $.getJSON(\n    'artists.json',\n    (\n\
  \      data, \n      textStatus, \n      jqXHRObject\n    ) => {\n      // 这里是已知的内容\n\
  \    }\n  );\n}); \n```\n\n列表 10.32 通过 Ajax 加载 JSON 数据的替代方案\n\n### 在请求中发送额外数据\n\n\
  正如你在 `load()` 方法中所看到的，你可以选择性地在 URL 和回调函数之间额外指定一个参数，用于定义要随请求发送到服务器的数据。\n\n## 10.5\
  \ 总结\n\n在本章中，你学习了流行的 jQuery JavaScript 库，它简化了许多工作，特别是在 DOM 操作、事件处理和创建 Ajax 请求方面。以下列表总结了最重要的方面：\n\
  \n* jQuery 是一个库，它主要隐藏了特定浏览器的细节，并为可以跨浏览器使用的重复任务提供了辅助方法。\n* 使用 jQuery 的核心是 `jQuery()`\
  \ 或 `$()` 方法。\n* 此外，你可以将选择器、现有元素或 HTML 字符串作为参数传递给此方法。\n* 作为返回值，该方法提供一个封装对象（jQuery\
  \ 对象），该对象通过额外的方法（jQuery 方法）扩展了相应的元素。\n* 因此，jQuery 对象提供了多种处理 DOM 的方法，包括：\n    * 访问元素内容的方法\n\
  \    * 过滤所选元素的方法\n    * 访问属性的方法\n    * 访问 CSS 属性的方法\n    * 在元素之间进行导航的方法\n    * 使元素或其\
  \ CSS 属性产生动画效果的方法\n* 对于事件处理，jQuery 提供了几种注册事件监听器的方法，包括：\n    * 为通用事件注册事件监听器的方法\n\
  \    * 为鼠标事件注册事件监听器的方法\n    * 为键盘事件注册事件监听器的方法\n    * 为表单事件注册事件监听器的方法\n* 创建 Ajax\
  \ 请求也通过许多辅助方法变得更加容易，这些包括：\n    * 创建任意 Ajax 请求的方法\n    * 创建 `GET` 请求的方法\n    * 创建\
  \ `POST` 请求的方法\n    * 通过 Ajax 直接将 HTML 内容加载到元素中的方法\n    * 加载 JavaScript 文件的方法\n\
  \    * 加载 JSON 文件的方法\n* 大多数辅助方法可以用于各种用途；例如，可以通过 `attr()` 方法读取和写入 HTML 属性，可以通过 `css()`\
  \ 方法读取和写入 CSS 属性，并且可以通过事件方法再次注册或移除事件监听器。\n\n最后，表 10.27 比较了如何使用 jQuery 和原生 JavaScript\
  \ 处理不同的问题。对于更多示例，我们建议查看之前提到的 [`youmightnotneedjquery.com`](http://youmagenotneedjquery.com)\
  \ 网站。在那里你可以看到这两种方式的代码在紧凑性上是相当的，特别是在 DOM 操作领域。在处理事件和 Ajax 时，jQuery 的代码仍然更紧凑一些。然而，在所有情况下，jQuery\
  \ 在很大程度上是不依赖浏览器的，而这并不总是适用于原生 JavaScript 变体。\n\n| 处理 DOM | |\n| :--- | :--- |\n|\
  \ 添加 CSS 类 | jQuery: `$(element).addClass(newClassName);` <br> 原生 JavaScript: `if\
  \ (element.classList) { element.classList.add(newClassName); } else { element.className\
  \ += ' ' + newClassName; }` |\n| 访问子元素 | jQuery: `$(element).children();` <br> 原生\
  \ JavaScript: `element.children` |\n| 遍历元素 | jQuery: `$(selector).each((index, element)\
  \ => { });` <br> 原生 JavaScript: `const elements = document.querySelectorAll(selector);\
  \ Array.prototype.forEach.call(elements, (element, index) => { });` |\n| 搜索元素下方的元素\
  \ | jQuery: `$(element).find(selector);` <br> 原生 JavaScript: `element.querySelectorAll(selector);`\
  \ |\n| 搜索元素 | jQuery: `$(selector);` <br> 原生 JavaScript: `document.querySelectorAll(selector);`\
  \ |\n| 访问属性 | jQuery: `$(element).attr(name);` <br> 原生 JavaScript: `element.getAttribute(name);`\
  \ |\n| 读取 HTML 内容 | jQuery: `$(element).html();` <br> 原生 JavaScript: `element.innerHTML;`\
  \ |\n| 写入 HTML 内容 | jQuery: `$(element).html(content);` <br> 原生 JavaScript: `element.innerHTML\
  \ = content;` |\n| 读取文本内容 | jQuery: `$(element).text();` <br> 原生 JavaScript: `element.textContent;`\
  \ |\n| 写入文本内容 | jQuery: `$(element).text(content);` <br> 原生 JavaScript: `element.textContent\
  \ = content;` |\n| 下一个元素 | jQuery: `$(element).next();` <br> 原生 JavaScript: `element.nextElementSibling;`\
  \ |\n| 上一个元素 | jQuery: `$(element).prev();` <br> 原生 JavaScript: `element.previousElementSibling;`\
  \ |\n| 处理事件 | 添加事件监听器 | jQuery: `$(element).on(eventName, eventHandler);` |\n\n\n\
  \n\n\n| | Pure JavaScript | jQuery |\n| :--- | :--- | :--- |\n| **添加事件监听器** | `element.addEventListener(eventName,\
  \ eventHandler);` | `$(element).on(eventName, eventHandler);` |\n| **移除事件监听器** |\
  \ `element.removeEventListener(eventName, eventHandler);` | `$(element).off(eventName,\
  \ eventHandler);` |\n| **文档加载时执行函数** | ```javascript\nfunction ready(callback) {\n\
  \  if (document.readyState != 'loading') {\n    callback();\n  } else {\n    document.addEventListener('DOMContentLoaded',\
  \ callback);\n  }\n}\n``` | `$(document).ready(() => { });` |\n| **处理 Ajax 请求**\
  \ | | |\n| **发送 GET 请求** | `fetch(url).then(response => {}).catch(error => {});`\
  \ | `$.ajax({\n  type: 'GET',\n  url: url,\n  success: response => {},\n  error:\
  \ () => {}\n});` |\n| **发送 POST 请求** | `fetch('url', { method: 'POST', body: data\
  \ }).then(response => {}).catch(error => {});` | `$.ajax({\n  type: 'POST',\n  url:\
  \ url,\n  data: data\n});` |\n| **通过 Ajax 加载 JSON** | `fetch('data.json').then(response\
  \ => response.json()).then(data => {}).catch(error => {});` | `$.getJSON('data.json',\
  \ (data) => {});` |\n\n**表 10.27** jQuery 与原生 JavaScript 的比较\n\n# 11 动态创建图像和图形\n\
  \n在本章中，你将学习两种使用 JavaScript 动态创建图像和图形的不同技术。\n\n对于图像的创建或图形的绘制，JavaScript（或浏览器）提供了两种不同的技术：首先是所谓的\
  \ `Canvas API`，通过它可以在 JavaScript 在预先定义的画布上进行“绘制”；其次是可缩矢量图形 (SVG) 格式，它允许对矢量图形进行声明式定义，这些图形可以被所有现代浏览器解释和显示。由于这种格式是\
  \ XML 格式，你也可以像往常一样 `DOM API` 通过 JavaScript 动态创建 SVG 图形。\n\n## 11.1 绘制图像\n\n`Canvas\
  \ API` ([www.w3.org/TR/2dcontext](http://www.w3.org/TR/2dcontext)) 允许你使用 JavaScript\
  \ 在浏览器窗口内进行基于程序的绘制。\n\n### 11.1.1 绘制区域\n\n绘制图形的基础是 `<canvas>` 元素。该元素代表绘制区域，可以在 JavaScript\
  \ 代码中访问它，并使用 `Canvas API` 在其上绘制。\n\n`width` 和 `height` 属性可用于定义绘制区域在屏幕上占据的宽度和高度。如果省略这些属性，该区域默认宽度为\
  \ 300 像素，高度为 150 像素。\n\n此外，通过 `id` 属性为 `<canvas>` 元素指定 ID 是非常有用的，如代码列表 11.1 所示，以便能够通过\
  \ `getElementById()` 从 JavaScript 中轻松地选择该元素。\n\n```html\n<canvas id=\"canvas\" width=\"\
  500\" height=\"300\">\n</canvas>\n```\n\n**代码列表 11.1** 使用 Canvas API 绘制的基础\n\n基本上，`<canvas>`\
  \ 元素可以通过 CSS 设置任何方式的，就像其他 HTML 元素一样。对于后续示例，我们将仅提供带框的元素（参见代码列表 11.2），以便通过这种方式将绘制区域与周围区域区分开。\n\
  \n```css\ncanvas {\n  border: 1px solid black;\n} \n```\n\n**代码列表 11.2** <canvas>\
  \ 元素可以通过 CSS 设置任何方式样式\n\n代码列表 11.3 显示了基础的整个 HTML 文件。\n\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Canvas example</title>\n\
  \  <link rel=\"stylesheet\" href=\"styles/main.css\" type=\"text/css\">\n</head>\n\
  <body>\n<main>\n  <canvas id=\"canvas\" width=\"500\" height=\"300\"></canvas>\n\
  </main>\n<script src=\"scripts/main.js\"></script>\n</body>\n</html>\n```\n\n**代码列表\
  \ 11.3** 包含绘制区域的整个 HTML 文件\n\n### 11.1.2 渲染上下文\n\n`<canvas>` 元素提供一个或多个渲染上下文，可用于操作绘制区域及其内容。`<canvas>`\
  \ 元素的 `getContext()` 方法可用于访问相应的上下文。该方法的参数期望一个上下文标识符（2D 渲染上下文为 `2d`，支持 WebGL 版本 1\
  \ 的浏览器的 3D 上下文为 `webgl`，支持 WebGL 版本 2 的浏览器的 3D 上下文为 `webgl2`；参见表 11.1` 方法将返回一个类型为\
  \ `CanvasRenderingContext2D` 的对象。 |\n| `webgl` | 用于在实现 WebGL 版本 1 的浏览器中渲染 3D 图形的上下文。如果你传递此标识符，`getContext()`\
  \ 方法将返回一个类型为 `WebGLRenderingContext` 的对象。 |\n\n\n\n\n\n| `webgl2` | 在实现 WebGL 2\
  \ 的浏览器中渲染 3D 图形的上下文。如果你传递此标识符，`getContext()` 方法将返回一个类型为 `WebGL2RenderingContext`\
  \ 的对象。 |\n\n**表 11.1** 可作为 `getContext()` 参数的不同渲染上下文的标识符\n\nListing 11.4 显示了访问绘制区域\
  \ 2D 上文所需的代码。`getContext()` 方法返回的对象类型为 `CanvasRenderingContext2D`，它是 Canvas API\
  \ 的入口。后续描述的所有方法都是在该对象上调用的。\n\n```\nconst canvas = document.getElementById('canvas');\n\
  const context = canvas.getContext('2d'); \n```\n\n**Listing 11.4** 通过 JavaScript\
  \ 访问渲染上下文\n\n2D 上文基于二维坐标系（参见图 11.1），在该系统中，你可以使用 x 和 y 坐标以像素精度进行绘图（并使用我们稍后介绍的各种辅助函数）。\n\
  \n![坐标系](img/img-f11.1.html)\n\n**图 11.1** 坐标系\n\n该坐标系的原点位于绘制区域左上角的坐标 (0,0)，这并不意外。矩形、圆形、曲线等图形元素都是相对于此原点坐标在绘制区域中绘制的。\n\
  \n## 检查对 Canvas API 的支持\n\n通常情况下，在 JavaScript 代码中使用并非所有浏览器都（或旧浏览器不支持）的 API 之前进行某些检查是良好的习惯。特性检测（Feature\
  \ detection）是这里的常用技术术语。对于 Canvas API，因此按照 Listing 11.5 所示所示是恰当的。\n\n```\nconst canvas\
  \ = document.getElementById('canvas');\nif (canvas.getContext){\n  const context\
  \ = canvas.getContext('2d');\n  // 在此处继续\n} \n```\n\n**Listing 11.5** Canvas API\
  \ 的特性检测\n\n在这里，我们首先检查代表 `<canvas>` 元素的对象（`getElementById()` 的返回值）是否具有 `getContext()`\
  \ 方法。只有在这种情况下，我们才能假设浏览器支持 Canvas API。\n\n### 11.1.3 绘制矩形\n\n为了让仍然空白的绘制区域变得丰富，我们将首先展示如何绘制简单的矩形。`CanvasRenderingContext2D`\
  \ 类型为此目的提供了三种不同的方法：`fillRect()` 方法创建一个填充了之前定义的背景色的矩形，`strokeRect()` 绘制矩形的轮廓（同样使用之前定义的框颜色），而\
  \ `clearRect()` 从绘制区域删除定义矩形内部的内容（参见表 11.2）。\n\n| 方法 | 描述 |\n| --- | --- |\n| `fillRect(x,\
  \ y, width, height)` | 在坐标 `x` 和 `y` 描述的点处绘制一个宽度为 `width`、高度为 `height` 指定的矩形，并用之前定义的背景色填充它\
  \ |\n| `strokeRect(x, y, width, height)` | 在坐标 `x` 和 `y` 描述的点处，使用之前定义的框颜色绘制一个宽度为\
  \ `width`、高度为 `height` 指定的矩形轮廓 |\n| `clearRect(x, y, width, height)` | 删除绘制区域中定义矩形内部的所有内容\
  \ |\n\n**表 11.2** 绘制矩形的不同方法\n\n这三种方法具有相同的四个参数：用于定义相应矩形左上角的 x 和 y 坐标，以及关于相应矩形宽度和高度的信息（参见图\
  \ 11.2）。\n\n![矩形的结构](img/img-f11.2.html)\n\n**图 11.2** 矩形的结构\n\nListing 11.6 显示了几个绘制矩形的示例。你会发现，在调用\
  \ `fillRect()` 和 `strokeRect()` 方法之前，首先通过渲染上下文中的 `fillStyle` 和 `strokeStyle` 属性定义了背景色和框颜色。图\
  \ 11.3 显示了这段源代码的结果：在左侧你可以看到两个填充的矩形，在右侧是带框的两个矩形。\n\n## 注意\n\n\n\n一旦设置，你定义的设置不仅影响紧随后的\
  \ `fillRect()` 或 `strokeRect()` 调用，还会影响所有后续调用。\n\n```\nfunction draw() {\n  const\
  \ canvas = document.getElementById('canvas');\n  if (canvas.getContext){\n    const\
  \ context = canvas.getContext('2d');\n    context.fillStyle = 'rgb(200,0,0)';\n\
  \    context.fillRect(10, 10, 80, 80);\n    context.fillStyle = 'rgba(0,0,200,0.5)';\n\
  \    context.fillRect(100, 10, 80, 80);\n    context.strokeStyle = 'rgb(200,0,0)';\n\
  \    context.strokeRect(190, 10, 80, 80);\n    context.strokeStyle = 'rgba(0,0,200,0.5)';\n\
  \    context.strokeRect(280, 10, 80, 80);\n    context.fillRect(370, 10, 80, 80);\n\
  \    context.clearRect(380, 20, 60, 20);\n    context.fillRect(390, 25, 10, 10);\n\
  \    context.fillRect(420, 25, 10, 10);\n    context.clearRect(385, 60, 50, 10);\n\
  \  }\n}\n```\n\n**Listing 11.6** 绘制矩形的示例\n\n![各种绘制的矩形](img/img-f11.3.html)\n\n**图\
  \ 11.3** 各种绘制的矩形\n\n### 11.1.4 使用路径\n\n在 Canvas API 的语文中，路径是由系列线条连接的坐标字符串。两点之间的线可以是直的也可以是曲线的。\n\
  \n#### 绘制直线\n\n\n\n\n\n基本上，使用 Canvas API 创建路径始终包含四个步骤：开始路径、绘制路径、关闭路径（可选）以及为背景或边框上（可选）。\n\
  \n列表 11.7 显示了一个简单的示例，绘制一条从点 (50, 200) 开始并直线到点 (400, 50) 的路径。在上下文对象上调用的 `beginPath()`\
  \ 方法开始创建路径。然后，通过 `moveTo()` 将虚拟的绘笔移动到由传递的 x 和 y 坐标定义的点。反之，通过 `lineTo()` 从此点到第二个点绘制一条直线，该第二个点的坐标通过适当的参数传递给此方法。最后，`stroke()`\
  \ 方法确保绘制的路径也获得颜色（在此例中为黑色，因为没有显式设置 `strokeStyle` 属性，且黑色是默认颜色）。你可以在图 11.4 中看到源码的结果。\n\
  \n```\nconst context = canvas.getContext('2d');\ncontext.beginPath();        //\
  \ Start of path\ncontext.moveTo(50, 200);    // Define starting point\ncontext.lineTo(400,\
  \ 50);    // Straight line to specified point\ncontext.stroke();           // Color\
  \ frame \n```\n\n**列表 11.7** 绘制路径的示例\n\n![通过路径绘制的线](img/img-f11.4.html)\n\n**图 11.4**\
  \ 通过路径绘制的线\n\n如果你不想只使用直线，可以通过调用其他方法（在调用 `stroke()` 之前）向路径中添加更多坐标，如列表 11.8;\ncontext.beginPath();\
  \        // Start of path\ncontext.moveTo(50, 200);    // Define starting point\n\
  context.lineTo(400, 50);    // Straight line to specified point\ncontext.lineTo(400,\
  \ 200);  // straight line to specified point\ncontext.stroke();           // Color\
  \ frame \n```\n\n**列表 11.8** 带有多个路径组件的绘制示例\n\n![包含多个路径组件的路径](img/img-f11.5.html)\n\
  \n**图 11.5** 包含多个路径组件的路径\n\n### 关闭路径\n\n如果你想关闭路径——即自动从当前点到起始点绘制一条线——你可以使用 `closePath()`\
  \ 方法来简化操作，而不是手动绘制一条到路径起点的线。列表 11.9;\ncontext.beginPath();        // Start of path\n\
  context.moveTo(50, 200);    // Define starting point\ncontext.lineTo(400, 50); \
  \   // Straight line to specified point\ncontext.lineTo(400, 200);   // straight\
  \ line to specified point\ncontext.closePath();  // Close path\ncontext.stroke();\
  \           // Color frame \n```\n\n**列表 11.9** 关闭路径的示例\n\n![关闭路径的示例](img/img-f11.6.html)\n\
  \n**图 11.6** 关闭路径的示例\n\n### Path2D 对象\n\n正如你在之前的列表中所看到的，你可以在上下文对象上调用绘制路径的方法。因为在处理许多路径时这可能会变得非常困惑，因此\
  \ `Path2D` 对象可以作为一种替代方案。该对象提供的方法在路径创建方面与上下文对象的方法相似，它特别适合处理许多路径，以便始终跟踪各种路径。列表 11.10\
  \ 显示了相应的源码，其产生的结果与列表 11.9;\nconst path = new Path2D();\npath.moveTo(50, 200);  \
  \  // Draw path\npath.lineTo(400, 50);    // Draw path\npath.lineTo(400, 200); \
  \  // Draw path\npath.closePath();        // Close path\ncontext.stroke(path); \
  \   // Color frame \n```\n\n**列表 11.10** 使用 Path2D 对象的示例\n\n### 绘制二次曲线\n\n在绘制方面，仅靠直线实际上并做不了什么。出于此原因，Canvas\
  \ API 提供了几种方法来绘制曲线。\n\n其中一种方法是 `quadraticCurveTo()`，它用于绘制所谓的二次贝塞尔曲线（参见图 11.7）。\n\
  \n![二次曲线](img/img-f11.7.html)\n\n**图 11.7** 二次曲线\n\n为了此目的，需要四个参数：前两个参数形成控制点的 x 和\
  \ y 坐标，它本质上影响了曲线的程度。而第三和第四个参数代表要绘制到目标点的 x 和 y 坐标。列表 11.11 显示了使用 `quadratic()` 的示例。\n\
  \n```\nconst context = canvas.getContext('2d');\nconst path = new Path2D();\npath.moveTo(25,100);\
  \    // Starting point\npath.quadraticCurveTo(\n  25,                   // control\
  \ point x coordinate\n  25,                   // control point y coordinate\n  100,\
  \                  // target point x coordinate\n  25                    // target\
  \ point y coordinate\n);\ncontext.stroke(path); \n```\n\n**列表 11.11** 绘制二次曲线的示例\n\
  \n### 绘制贝塞尔曲线\n\n除了绘制二次曲线外，Canvas API 还提供了一种用于绘制所谓的贝塞尔曲线的方法。在外观或参数化方面，它们比二次曲线更灵活，因为它们不是一个而是两个控制点（参见图\
  \ 11.8）。\n\n![贝塞尔曲线](img/img-f11.8.html)\n\n**图 11.8** 贝塞尔曲线\n\n对应的方法称为 `bezierCurveTo()`，它期望总共六个参数。前两个参数定义第一个控制点的坐标，接下来的两个参数定义第二个控制点的坐标，最后两个参数定义目标点的坐标。列表\
  \ 11.12 显示了一个源码示例。\n\n```\nconst context = canvas.getContext('2d');\nconst path\
  \ = new Path2D();\npath.moveTo(25,100);  // Starting point\npath.bezierCurveTo(\n\
  \  100,                // control point x1 coordinate\n  100,                //\
  \ control point y1 coordinate\n  25,                 // control point x2 coordinate\n\
  \  25,                 // control point y2 coordinate\n  100,                //\
  \ target point x coordinate\n  25                  // target point y coordinate\n\
  );\ncontext.stroke(path); \n```\n\n**列表 11.12** 绘制贝塞尔曲线的示例\n\n### 绘制圆弧和圆\n\n为了绘制圆弧或圆，你可以使用两种方法：`arcTo()`\
  \ 方法和 `arc()` 方法。列表 11.13 包含一个使用 `arcTo()` 的示例。该方法期望五个参数：第一个控制点的 x 和 y 坐标，第二个控制点的\
  \ x 和 y 坐标，以及要绘制的圆弧的半径（参见图 11.9）。\n\n\n\n\n\n```javascript\nconst context = canvas.getContext('2d');\n\
  const path = new Path2D();\npath.moveTo(25,200);  // Starting point\npath.arcTo(\n\
  \  25,                 // x coordinate first control point\n  25,              \
  \   // y coordinate first control point\n  200,                // x coordinate second\
  \ control point\n  25,                 // y coordinate second control point\n  90\
  \                  // Radius of arc\n);\npath.lineTo(200, 25); // Target point\n\
  context.stroke(path); \n```\n\n**列表 11.13** 使用 `arcTo()` 方法绘制的示例\n\n![使用 arcTo()\
  \ 方法示例](img/img-f11.9.html)\n\n**图 11.9** 使用 arcTo() 方法的示例\n\n列表 11.14 显示了如何使用 `arc()`\
  \ 方法。该方法接受六个参数：弧圆心的 x 和 y 坐标、弧的半径、起始和结束角度，以及一个指定弧应该顺时针还是逆时针绘制的布尔值（另参见图 11.10）。\n\
  \n```javascript\nconst context = canvas.getContext('2d');\nconst path = new Path2D();\n\
  path.moveTo(25,200);   // Starting point\npath.arc(\n  100,                 // x\
  \ coordinate of arc center\n  100,                 // y coordinate of arc center\n\
  \  50,                  // Radius of arc\n  25,                  // Start angle\n\
  \  25,                  // End angle\n  false                // draw clockwise\n\
  );\npath.lineTo(200, 25);  // Target point\ncontext.stroke(path); \n```\n\n**列表\
  \ 11.14** 使用 `arc()` 方法绘制的示例\n\n![使用 arc() 方法示例](img/img-f11.10.html)\n\n**图 11.10**\
  \ 使用 arc() 方法的示例\n\n### 11.1.5 绘制文本\n\n有两种方法可用于绘制文本：`fillText()` 方法和 `strokeText()`\
  \ 方法。你可能已经根据它们的名称猜出其用途：前者绘制用（之前定义的）背景颜色填充的文本，后者绘制用（之前定义的）边框颜色轮勒的文本。\n\n这两个方法都至少接受三个参数，并可选接受第四个参数：文本本身、x\
  \ 位置和 y 位置，以及（可选的）文本在绘制区域中可能占据的最大宽度。\n\n列表 11.15 包含一个如何使用该方法的示例。此外，可以使用 `context`\
  \ 对象的各种属性来操作文本的外观，例如字体大小、字体颜色、对齐方式或文本方向（另参见表 11.3）。\n\n```javascript\nconst context\
  \ = canvas.getContext('2d');\ncontext.font = '48px serif';                // Font\
  \ properties\ncontext.fillText('Hello World', 10, 50);    // Draw text\ncontext.strokeText('Hello\
  \ World', 10, 100); // Draw text \n```\n\n**列表 11.15** 绘制文本的示例\n\n| 属性 | 说明 |\n\
  | --- | --- |\n| `font` | 包含以字符字符串形式的文本外观信息，例如字体大小、字体颜色等。其语法与 CSS 中的 `font` 属性完全相同。\
  \ |\n| `textAlign` | 包含关于文本水平对齐的信息。可能的值有 `start`、`end`、`left`、`right` 和 `center`。\
  \ |\n| `textBaseline` | 包含关于文本垂直位置的信息。可能的值有 `top`、`hanging`、`middle`、`alphabetic`、`ideographic`\
  \ 和 `bottom`。 |\n| `Direction` | 包含关于文本方向的信息。可能的值有 `ltr`（从左到右）、`rtl`（从右到左）和 `inherit`。\
  \ |\n\n**表 11.3** 配置文本的各种属性\n\n### 11.1.6 绘制渐变\n\n区域和框架也可以填充颜色渐变。你可以选择线性颜色渐变和径向颜色渐变——正如你可能从图形程序中所知的那样。\n\
  \n#### 绘制线性渐变\n\n你可以使用 `createLinearGradient()` 方法绘制线性渐变。该方法以四个参数的形式传递起点的 x 和 y\
  \ 坐标（前两个参数）以及终点的 x 和 y 坐标（后两个参数）。\n\n该方法返回一个 `CanvasGradient` 类型的对象，可以通过 `addColorStop()`\
  \ 方法来确定渐变的特定颜色。传递给方法的第一个参数是相对位置（0.0 到 1.0 之间的值）以及相应的颜色值。\n\n在列表 11.16 中，创建了一个从点\
  \ (0, 0) 到点 (0, 150) 的颜色渐变，它在起始处（位置 0.0）值为 `#FF0000`（红色），在中间（位置 0.5）为 `#00FF00`（绿色），在结束处（位置\
  \ 1.0）为 `#0000FF`（蓝色）。结果所示图 11.11。\n\n```javascript\nconst context = canvas.getContext('2d');\n\
  const gradient = context.createLinearGradient(// Create gradient\n  0,         \
  \                                     // x coordinate starting point\n  0,     \
  \                                         // y coordinate starting point\n  0, \
  \                                             // x coordinate end point\n  150 \
  \                                            // y coordinate end point\n);\ngradient.addColorStop(0,\
  \ '#FF0000');              // first color value\ngradient.addColorStop(0.5, '#00FF00');\
  \            // second color value\ngradient.addColorStop(1, '#0000FF');       \
  \       // third color value\ncontext.fillStyle = gradient;                    \
  \ // Assign style\ncontext.fillRect(20, 20, 460, 240);               // Draw rectangle\
  \ \n```\n\n**列表 11.16** 创建线性渐变\n\n![线性渐变的结构](img/img-f11.11.html)\n\n**图 11.11**\
  \ 线性渐变的结构\n\n#### 绘制径向渐变\n\n与颜色在一个方向上运行（即线性）的线性颜色渐变相反，径向颜色渐变是径向运行的——即从一个点向所有方向开始。径向渐变由两个圆定义，如图\
  \ 11.12 所示：一个圆定义了渐变的中心；另一个定义了渐变的周边界。\n\n![径向渐变的结构](img/img-f11.12.html)\n\n**图 11.12**\
  \ 径向渐变的结构\n\nCanvas API 中对应的方法名为 `createRadialGradient()`，并且正如列表 11.17 所示，它接受六个参数，其中前三个参数代表定义中心的圆的\
  \ x 和 y 坐标以及半径，而后三个参数对定义圆周的圆执行相同的操作。你可以在图 11.13 中看到原文的结果。\n\n\n\n\n\n```\nconst\
  \ context = canvas.getContext('2d');\nconst gradient = context.createRadialGradient(\
  \   // 创建渐变\n  50,                                            // 圆心 1 x 坐标\n  100,\
  \                                           // 圆心 1 y 坐标\n  20,                \
  \                            // 圆 1 半径\n  100,                                 \
  \          // 圆心 2 x 坐标\n  100,                                           // 圆心\
  \ 2 y 坐标\n  80                                             // 圆 2 半径\n);\ngradient.addColorStop(0,\
  \ '#FF0000');             // 第一个颜色值\ngradient.addColorStop(0.5, '#00FF00');    \
  \       // 第二个颜色值\ngradient.addColorStop(1, 'rgba(0,0,255,0)');     // 第三个颜色值\n\
  context.fillStyle = gradient;                    // 赋值样式\ncontext.fillRect(10,10,200,200);\
  \                 // 绘制矩形\n```\n\n列表 11.17 创建径向渐变\n\n![径向渐变示例](img/img-f11.13.html)\n\
  \n图 11.13 径向渐变示例\n\n### 11.1.7 保存和恢复画布状态\n\n你已经看到，当使用 `fillRect()` 或 `fillText()`\
  \ 等方法时，可能需要提前在 context 对象中对填充颜色、字体等进行设置。为了保存这些设置，context 对象提供了 `save()` 方法。每当你调用一次此方法时，当前设置就会被放入栈中并保存。然后可以使用\
  \ `restore()` 方法在稍后的时间恢复这些设置。如果你想在不同的时间点多次复用某些设置，这种方法特别有用。\n\n列表 11.18 显示了此示例，代码生成了图\
  \ 11.14 所示的图形。步骤如下：首先，使用默认设置创建一个高为 150 像素、宽为 150 像素的正方形（默认填充颜色为黑色）。通过调用 `save()`，你可以将这些默认值保存到上述的栈中。然后，将填充颜色设置为\
  \ `#00FF00`（绿色），并创建一个稍小（水平和垂直方向都有偏移）的正方形。再次调用 `save()` 也会将这些设置保存到栈中。背景颜色设置为 `#FF0000`（红色），再次绘制一个较小的正方形。\n\
  \n随后调用 `restore()` 将加载栈中最后一次保存的设置，即填充颜色设置为绿色的设置（因此，随后创建的正方形具有这种颜色）。同样，第二次调用 `restore()`\
  \ 将加载默认设置，结果再次得到一个黑色正方形。\n\n```\n'use strict';\nfunction draw() {\n  const ctx =\
  \ document.getElementById('canvas').getContext('2d');\n\n  ctx.fillRect(0, 0, 150,\
  \ 150);    // 使用默认设置绘制正方形\n                                   // 背景颜色黑色\n  ctx.save();\
  \                      // 保存当前状态（状态 1）\n\n  ctx.fillStyle = '#00FF00';       //\
  \ 修改设置\n  ctx.fillRect(15, 15, 120, 120);  // 使用新设置绘制正方形\n                     \
  \              // 背景颜色绿色\n\n  ctx.save();                      // 保存当前状态（状态 2）\n\
  \  ctx.fillStyle = '#FF0000';       // 修改设置\n  ctx.fillRect(30, 30, 90, 90);   \
  \ // 使用新设置绘制正方形\n                                   // 背景颜色红色\n\n  ctx.restore();\
  \                   // 加载上一个状态（状态 2）\n  ctx.fillRect(45, 45, 60, 60);    // 使用之前的设置绘制正方形，\n\
  \                                   // 背景颜色绿色\n\n  ctx.restore();              \
  \     // 加载上一个状态（状态 1）\n  ctx.fillRect(60, 60, 30, 30);    // 使用默认设置绘制正方形\n    \
  \                               // 背景颜色黑色\n}\ndocument.addEventListener('DOMContentLoaded',\
  \ draw); \n```\n\n列表 11.18 保存和加载状态\n\n![设置可以通过 save() 和 restore() 复用状态](img/img-f11.14.html)\n\
  \n图 11.14 设置可以通过 save() 和 restore() 复用状态\n\n存储在栈上的状态还包含有关当前变换矩阵的信息。因此，正如你在后续章节的示例中所看到的，使用\
  \ `save()` 和 `restore()` 在变换的背景下也起着重要作用。\n\n### 11.1.8 使用变换\n\n为了变换绘制区域内的图形元素，你可以使用图\
  \ 11.15 所示的三种操作：\n\n*   缩放 (Scaling)\n    在这里你更改宽度和/或高度。\n*   旋转 (Rotation)\n  \
  \  在这里你更改角度。\n*   平移 (Translation)\n    在这里你更改 x 和/或 y 位置。\n\n![不同类型变换的概述](img/img-f11.15.html)\n\
  \n图 11.15 不同类型变换的概述\n\n#### Scaling 放\n\n要缩放图形元素，可以使用 `scale()` 方法。该方法期望第一个参数为水平缩放因子，第二个参数为垂直缩放因子。列表\
  \ 11.19 包含了此示例。在这里，连续创建了三个正方形（另见图 11.16），每个情况下传递的宽度和高度参数相同。尺寸的差异仅由之前各自的 `scale()`引起。因此，红色正方形缩放了\
  \ 7 倍，绿色正方形缩放了 6 倍，蓝色正方形缩放了 5 倍。\n\n```\nconst context = document.getElementById('canvas').getContext('2d');\n\
  context.save();                  // 保存初始状态\ncontext.fillStyle = '#FF0000';   //\
  \ 填充颜色红色\ncontext.scale(7,7);              // 缩放\ncontext.fillRect(0,0,40,40); \
  \    // 绘制红色正方形\ncontext.restore();               // 重置到初始状态\ncontext.save();  \
  \                // 保存初始状态\ncontext.fillStyle = '#00FF00';   // 填充颜色绿色\ncontext.scale(6,6);\
  \              // 缩放\ncontext.fillRect(0,0,40,40);     // 绘制绿色正方形\ncontext.restore();\
  \               // 重置到初始状态\ncontext.save();                  // 保存初始状态\ncontext.fillStyle\
  \ = '#0000FF';   // 填充颜色蓝色\ncontext.scale(5,5);              // 缩放\ncontext.fillRect(0,0,40,40);\
  \     // 绘制蓝色正方形 \n```\n\n列表 11.19 缩放不同的正方形\n\n![缩放结果](img/img-f11.16.html)\n\n\
  图 11.16 缩放结果\n\n###### 修改变换矩阵\n\n准确来说，调用 `scale()` 并不是缩放单个图形元素；而是改变了当前的变换矩阵。这意味着缩放设置首先影响在调用该方法后绘制到绘制区域的所有图形元素。如果你只想缩放单个图形元素，必须在绘制下一个相关元素之前，始终通过\
  \ `restore()` 和 `save()` 调用重置变换矩阵，如示例所示。\n\n#### Rotation\n\n\n\n\n要旋转图形元素，你可以使用\
  \ `rotate()` 方法。该方法期望一个参数，即你想旋转的角度。与 `scale()` 类似，使用 `rotate()` 也会影响绘图区域的变换矩阵，因此可能需要像\
  \ `scale()` 那样通过调用 `restore()` 和 `save()` 来再次重置它。\n\n列表 11.20 包含一个使用 `rotate()`\
  \ 的示例。图 11.17 显示了对应的结果。\n\n```\nconst context = document.getElementById('canvas').getContext('2d');\n\
  context.save();                     // 保存初始状态\ncontext.fillStyle = '#FF0000';  \
  \    // 填充颜色红色\ncontext.rotate(7);                  // 旋转（单位为弧度）\ncontext.fillRect(200,0,140,140);\
  \    // 绘制红色正方形\ncontext.restore();                  // 重置为初始状态\ncontext.save();\
  \                     // 保存初始状态\ncontext.fillStyle = '#00FF00';      // 填充颜色绿色\n\
  context.rotate(7);                  // 旋转（单位为弧度）\ncontext.fillRect(200,-180,140,140);\
  \ // 绘制绿色正方形\ncontext.restore();                  // 重置为初始状态\ncontext.save();  \
  \                   // 保存初始状态\ncontext.fillStyle = '#0000FF';      // 填充颜色蓝色\ncontext.rotate(7);\
  \                  // 旋转（单位为弧度）\ncontext.fillRect(380,-180,140,140); // 绘制蓝色正方形\
  \ \ncontext.restore();                  // 重置为初始状态\n```\n\n列表 11.20     不同正方形的旋转\n\
  \n![旋转结果](img/img-f11.17.html)\n\n图 11.17     旋转结果\n\n为了平移的目的，你可以使用 `translate()`\
  \ 方法，该方法期望水平和垂直位移的值作为参数。列表 11.21 包含了此用示例，而 图 11.18 显示了结果。\n\n```\nconst context\
  \ = document.getElementById('canvas').getContext('2d');\ncontext.save();       \
  \           // 保存初始状态\ncontext.fillStyle = '#FF0000';   // 填充颜色红色\ncontext.translate(40,\
  \ 40);       // 平移\ncontext.fillRect(0,0,40,40);     // 绘制红色正方形\ncontext.restore();\
  \               // 重置为初始状态\ncontext.save();                  // 保存初始状态\ncontext.fillStyle\
  \ = '#00FF00';   // 填充颜色绿色\ncontext.translate(100, 40);      // 平移\ncontext.fillRect(0,0,40,40);\
  \     // 绘制绿色正方形\ncontext.restore();               // 重置为初始状态\ncontext.save(); \
  \                 // 保存初始状态\ncontext.fillStyle = '#0000FF';   // 填充颜色蓝色\ncontext.translate(160,\
  \ 40);      // 平移\ncontext.fillRect(0,0,40,40);     // 绘制蓝色正方形 \n```\n\n列表 11.21\
  \     不同正方形的平移\n\n![平移结果](img/img-f11.18.html)\n\n图 11.18     平移结果\n\n### 11.1.9\
  \ 创建动画\n\n到此为止，你已经在示例中看到了如何使用 Canvas API 绘图，但动画也是可能的。不过，要创建一个动画，你需要手动绘制它的每一帧。原则上讲，其工作原理如下——最后三个步骤可以执行多次：\n\
  \n*   清空绘图区域\n*   可选的保存状态\n*   绘制\n*   可选的加载状态\n\n这四个步骤通常被封装在一个函数内部，然后按间隔调用该函数（对应动画的每一帧）。虽然这种基于时间的控制重复调用可以使用\
  \ `setInterval()` 函数来实现，但你应该使用 `requestAnimationFrame()` 方法。该方法专门为在网页中处理动画而设计，是反复以一致的时间间隔调用相应函数的最高效方法。\n\
  \n列表 11.22 显示了一个动画示例，其中三个彩色的矩形围绕某个点旋转。`redraw()` 函数包含了负责绘制矩形的代码。该函数在作为参数传递给 `requestAnimationFrame()`\
  \ 方法后会被调用。`requestAnimationFrame()` 的调用需要在两个点进行：首先是在 `draw()` 函数的开始，其次是在 `redraw()`\
  \ 函数的结束处。第一次调用会导致 `redraw()` 被初始调用并绘制动画的第一帧（实际上启动了动画），而第二次调用会导致 `redraw()` 持续调用自身，从而每次绘制动画的新的一帧（相当于无限地持续进行动画）。\n\
  \n```\nfunction draw() {\n  const canvas = document.getElementById('canvas');\n\
  \  if (canvas.getContext){\n    window.requestAnimationFrame(redraw);\n  }\n}\n\n\
  function redraw() {\n  const context = document.getElementById('canvas').getContext('2d');\n\
  \  context.clearRect(0,0,500,300);   // (1) 清空绘图区域\n  const time = new Date();\n\
  \  const angle = ((2*Math.PI)/6)*time.getSeconds() \n              + ((2*Math.PI)/6000)*time.getMilliseconds();\n\
  \                                    //红色矩形:\n  context.fillStyle = '#FF0000'; \
  \   //  \n  context.save();                   // (2) 保存状态\n  context.translate(150,150);\
  \       // (3) 绘制\n  context.rotate(angle);            //  \n  context.translate(0,25);\
  \          //  \n  context.fillRect(5,5,20,20);      //  \n  context.restore();\
  \                // (4) 加载状态\n                                    //绿色矩形:\n  context.fillStyle\
  \ = '#00FF00';    //  \n  context.save();                   // (2) 保存状态\n  context.translate(150,150);\
  \       // (3) 绘制\n  context.rotate(angle);            //  \n  context.translate(0,50);\
  \          //  \n  context.fillRect(5,5,20,20);      //  \n  context.restore();\
  \                // (4) 加载状态\n                                    //蓝色矩形:\n  context.fillStyle\
  \ = '#0000FF';    //  \n  context.save();                   // (2) 保存状态\n  context.translate(150,150);\
  \       // (3) 绘制\n  context.rotate(angle);            //  \n  context.translate(0,75);\
  \          //  \n  context.fillRect(5,5,20,20);      //  \n  context.restore();\
  \                // (4) 加载状态\n  window.requestAnimationFrame(redraw);\n}\nwindow.addEventListener('DOMContentLoaded',\
  \ draw); \n```\n\n列表 11.22     创建动画\n\n\n\n\n\n你可以手动创建 SVG 图形，但这通常非常繁琐，尤其是在创建更复杂的图形时。更简单的方法是在许多可选矢量程序之一中创建合适的图形（如\
  \ Adobe Illustrator、Inkscape 等其他程序通常提供此类选项），然后将其导出为 SVG 格式，然后在相应的网页中使用它们。你可以在 Listing\
  \ 11.23 中看到一个 SVG 文档的简单示例：黑色背景上的白圆。\n\n| 元素 | 含义 | 属性（选择） |\n| --- | --- | --- |\n\
  | `<rect>` | 矩形 | |\n| `x`: | x 坐标 | |\n| `y`: | y 坐标 | |\n| `width`: | 矩形宽度 | |\n\
  | `height`: | 矩形高度 | |\n| `rx`: | 圆角的水平半径 | |\n| `ry`: | 圆角的垂直半径 | |\n| `<circle>`\
  \ | 圆形 | |\n| `cx`: | 圆心的 x 坐标 | |\n| `cy`: | 圆心的 y 坐标 | |\n| `r`: | 半径 | |\n| `<ellipse>`\
  \ | 椭圆 | |\n| `cx`: | 中心点的 x 坐标 | |\n| `cy`: | 中心点的 y 坐标 | |\n| `rx`: | x 方向半轴半径\
  \ | |\n| `ry`: | y 方向半轴半径 | |\n| `<line>` | 两个点的线段 | |\n| `x1`: | 第一点的 x 坐标 | |\n\
  | `y1`: | 第一点的 y 坐标 | |\n| `x2`: | 第二点的 x 坐标 | |\n| `y2`: | 第二点的 y 坐标 | |\n| `<polyline>`\
  \ | 带有多个中间点的折线 | |\n| `points`: | 连接连接的各个点的 x 和 y 坐标列表，x-y 对用逗号或空格分隔 | |\n| `<polygon>`\
  \ | 多边形 | |\n| `points`: | 由线条连接的各个点的 x 和 y 坐标列表，x-y 对用逗号或空格分隔 | |\n| `<path>` |\
  \ 路径 | |\n| `<g>` | 图形元素组 | |\n| `<text>` | 文本内容 | |\n| `x`: | 基线的 x 坐标 | |\n| `y`:\
  \ | 基线的 y 坐标 | |\n| `<a>` | 超链接 | |\n| `<image>` | 外部图像 | |\n| `x`: | x 坐标 | |\n\
  | `y`: | y 坐标 | |\n| `width`: | 图像宽度 | |\n| `height`: | 图像高度 | |\n| `<linearGradient>`\
  \ | 线性渐变 | |\n| `<radialGradient>` | 径向渐变 | |\n\n**Table 11.4** SVG 重要元素概述\n\n```\n\
  <svg xmlns=\"http://www.w3.org/2000/svg\">\n  <rect width=\"100%\" height=\"100%\"\
  \ fill=\"#000000\" />\n  <circle id=\"circle\" cx=\"100\" cy=\"100\" r=\"80\" fill=\"\
  #ffffff\" />\n</svg> \n```\n\n**Listing 11.23** 简单 SVG 文档示例\n\n### 11.2.2 在 HTML\
  \ 中集成 SVG\n\n要在 HTML 中集成 SVG，你有几种选择，接下来的章节将简要介绍最重要的几种。\n\n#### 通过 `<img>` 元素集成\n\
  \n在这里，相应的 SVG 文件通过 `<img>` 元素的 `src` 属性进行链接（参见 Listing 11.24）。能够处理 SVG 的浏览器会将链接的\
  \ SVG 文档显示在 HTML 适当的位置。\n\n然而，这种集成方式不支持 SVG 内容内部定义的链接。出现在 SVG 文档中的 JavaScript 代码也是如此的。这些代码不会被解释或执行。\n\
  \n```\n<!DOCTYPE html>\n<html\n<head lang=\"en\">\n  ...\n</head>\n<body>\n  <img\
  \ src=\"example.svg\" alt=\"SVG\" width=\"500\" height=\"500\">\n</body>\n</html>\n\
  ```\n\n**Listing 11.24** 通过 `<img>` 元素集成\n\n#### 通过 `<iframe>` 元素集成\n\nSVG 文件也可以被定义为\
  \ `<iframe>` 元素的源源（参见 Listing 11.25）。与通过 `<img>` 元素集成类似，这种集成方式会解释 SVG 内容内部的链接并执行\
  \ JavaScript。\n\n```\n<!DOCTYPE html>\n<html\n<head lang=\"en\">\n  ...\n</head>\n\
  <body>\n  <iframe src=\"example.svg\" width=\"500\" height=\"500\" scrolling=\"\
  no\"></iframe>\n</body>\n</html>\n```\n\n**Listing 11.25** 通过 `<iframe>` 元素集成\n\n\
  #### 通过 `<object>` 元素集成\n\n你也可以使用 `<object>` 元素将 SVG 文件作为对象集成（参见 Listing 11.26）。对于无法显示\
  \ SVG 的旧浏览器，你还可以在 `<object>` 和结束标签之间指定备用内容，例如替代图像。\n\n```html\n<!DOCTYPE html>\n\
  <html\n<head lang=\"en\">\n  ...\n</head>\n<body>\n  <object data=\"example.svg\"\
  \ width=\"500\" height=\"500\">\n    <img src=\"example.jpg\" width=\"500\" height=\"\
  500\" alt=\"Alternative image\">\n  </object>\n</body>\n</html>\n```\n\n**Listing\
  \ 11.26** 通过 `<object>` 元素集成\n\n#### 通过 CSS 作为背景图像集成\n\nSVG 文件也可以用（用 `url()` 包裹）作为\
  \ CSS `background` 属性的值（参见 Listing 11.27）。在这种情况下，SVG 文件的内容被用作相应 CSS 规则选择的元素（或元素）的背景图像。然而，SVG\
  \ 内容中的链接和 JavaScript 代码将不会被解释。\n\n```html\n<!DOCTYPE html>\n<html\n<head lang=\"\
  en\">\n  ...\n</head>\n<body>\n  <div style=\"background: url(example.svg); width:\
  \ 500px; height: 500px\"></div>\n</body>\n</html>\n```\n\n**Listing 11.27** 通过 CSS\
  \ 作为背景图像集成\n\n#### Inline\n\n一个特别方便的特性是 SVG 也可以直接“内联”定义在 HTML 代码中（参见 Listing 11.28）。浏览器随后会在本地解释\
  \ SVG，因此链接和 JavaScript 也会被解释。\n\n```html\n<!DOCTYPE html>\n<html\n<head lang=\"\
  en\">\n  ...\n</head>\n<body>\n  <svg id=\"svg\" version=\"1.1\"\n       baseProfile=\"\
  full\"\n       width=\"500\" height=\"500\"\n       xmlns=\"http://www.w3.org/2000/svg\"\
  >\n    <rect width=\"100%\" height=\"100%\" />\n    <circle id=\"circle\" cx=\"\
  100\" cy=\"100\" r=\"80\" />\n  </svg>\n</body>\n</html>\n```\n\n**Listing 11.28**\
  \ 在 HTML 代码中的内联定义\n\n\n\n\n\n### 11.2.3 使用 CSS 更改 SVG 元素的样式\n\nSVG 文档中的单个元素可以使用\
  \ CSS 设置样式，尽管这些属性与你设置 HTML 元素时使用的属性不同。对于允许的元素列表，请参见表 11.5。你也可以在 SVG 规范 [www.w3.org/TR/SVG2/styling.html](http://www.w3.org/TR/SVG2/styling.html)\
  \ 中找到完整列表。\n\n| 属性 | 描述 |\n| --- | --- |\n| <samp class=\"listingcharacter\">cursor</samp>\
  \ | 鼠标指针 |\n| <samp class=\"listingcharacter\">fill</samp> | 填充颜色 |\n| <samp class=\"\
  listingcharacter\">fill-opacity</samp> | 填充颜色的透明度 |\n| <samp class=\"listingcharacter\"\
  >font-family</samp> | 字体族 |\n| <samp class=\"listingcharacter\">font-size</samp>\
  \ | 字体大小 |\n| <samp class=\"listingcharacter\">font-style</samp> | 字体样式 |\n| <samp\
  \ class=\"listingcharacter\">stroke</samp> | 描边颜色 |\n| <samp class=\"listingcharacter\"\
  >stroke-opacity</samp> | 描边的透明度 |\n| <samp class=\"listingcharacter\">stroke-width</samp>\
  \ | 描边宽度 |\n\n**表 11.5** SVG 的各种 CSS 属性选取\n\n代码列表 11.29 包含一个示例，其中使用 CSS 对代码列表 11.28\
  \ 中的 SVG 设置了样式。\n\n```\nrect {\n  stroke-width: 4;\n fill: #FFFFFF;\n stroke: #3080D0;\n\
  }\n\n#circle:hover {\n  cursor: pointer;\n}\n\n#circle {\n  fill-opacity: 0.5;\n\
  \  stroke-width: 4;\n  fill: #3080D0;\n  stroke: #3080D0;\n}\n#circle.active {\n\
  \  fill: #000000;\n}\n\ntext {\n  fill: #FFFFFF;\n  font-family: sans-serif;\n}\
  \ \n```\n\n**代码列表 11.29** 通过特殊属性使用 CSS 更改 SVG 元素的显示\n\n### 11.2.4 通过 JavaScript\
  \ 操作 SVG 元素的行为\n\n你不仅可以使用 CSS 为 SVG 文档中的元素设置样式，还可以 JavaScript 访问单个元素、修改它们、添加新元素，并基本上执行你已经在第\
  \ 5 章中熟悉的所有其他 DOM 操作。\n\n作为一个示例，我们将描述两个用例：首先，如何使用 JavaScript 为单个 SVG 元素添加事件监听器；其次，如何使用\
  \ JavaScript 动态更改图形元素的位置。\n\n#### 为 SVG 元素注册事件监听器\n\n代码列表 11.30 包含一个为 SVG 元素注册事件监听器的示例。在这里，通过\
  \ <samp class=\"listingcharacter\">getElementById()` 方法访问嵌入的 <samp class=\"listingcharacter\"\
  ><svg></samp> 元素，然后通过再次调用此方法确定 <samp class=\"listingcharacter\"><circle></samp>\
  \ 元素（这次是在找到的 <samp class=\"listingcharacter\"><svg></samp> 元素上）。之后，通过 <samp class=\"\
  listingcharacter\">addEventListener()` 方法注册了三个不同的事件监听器：当点击 <samp class=\"listingcharacter\"\
  ><circle></samp> 元素时，调用 <samp class=\"listingcharacter\">click` 事件的事件监听器；当鼠标指针移动到该元素上或离开该元素时，调用\
  \ <samp class=\"listingcharacter\">mouseover` 和 <samp class=\"listingcharacter\"\
  >mouseout` 事件的事件监听器。在两种情况下，<samp class=\"listingcharacter\">active` CSS 类都会来回切换，从而更改填充颜色（另，请参见代码列表\
  \ 11.29 中的 CSS）。\n\n```\n'use strict';\nfunction init() {\n  const svgDocument =\
  \ document.getElementById('svg');\n  const circle = svg.getElementById('circle');\n\
  \  circle.addEventListener('click', (e) => {\n    console.log('Hello World');\n\
  \  });\n  circle.addEventListener('mouseover', (e) => {\n    circle.classList.toggle('active');\n\
  \  });\n  circle.addEventListener('mouseout', (e) => {\n    circle.classList.toggle('active');\n\
  \  });\n}\n\nwindow.addEventListener('DOMContentLoaded', init); \n```\n\n**代码列表\
  \ 11.30** 为 SVG 元素注册事件监听器\n\n#### 动态更改 SVG 元素\n\nSVG 元素也可以通过 JavaScript 进行动态更改——例如\
  \ <samp class=\"listingcharacter\"><circle></samp> 元素的位置。为了这个目的，HTML/SVG 首先通过两个滑块进行了扩展，如代码列表\
  \ 11.31 所示。然后，为每个滑块添加 <samp class=\"listingcharacter\">change` 事件的事件监听器（参见代码列表 11.32），在其中调用\
  \ `moveCircle()` 函数。该函数期望两个参数：首先是位置，其次是方向（水平或垂直）。\n\n```\n<!DOCTYPE html>\n<html\n\
  <head>\n  <meta charset=\"UTF-8\">\n  <title>SVG example</title>\n  <link rel=\"\
  stylesheet\" href=\"styles.css\">\n</head>\n<body>\n  <svg xmlns=\"http://www.w3.org/2000/svg\"\
  \ width=\"500\" height=\"500\">\n    <circle id=\"circle\" cx=\"50\" cy=\"50\" r=\"\
  40\" />\n  </svg>\n  <div>X: <input type=\"range\" id=\"sliderX\" min=\"0\" max=\"\
  500\"></div>\n  <div>Y: <input type=\"range\" id=\"sliderY\" min=\"0\" max=\"500\"\
  ></div>\n  <script src=\"scripts/main.js\"></script>\n</body>\n</html>\n```\n\n\
  **代码列表 11.31** 通过滑块扩展 HTML\n\n```\n'use strict';\nfunction init() {\n  const sliderX\
  \ = document.getElementById('sliderX');\n  const sliderY = document.getElementById('sliderY');\n\
  \  sliderX.addEventListener('change', (e) => {\n    moveCircle(e.target.value, 'x');\n\
  \  });\n  sliderY.addEventListener('change', (e) => {\n    moveCircle(e.target.value,\
  \ 'y');\n  });\n}\n\nfunction moveCircle(value, direction) {\n  const svgDocument\
  \ = document.getElementById('svg');\n  const circle = svgDocument.getElementById('circle');\n\
  \  circle.setAttribute('c' + direction, value);\n}\n\nwindow.addEventListener('DOMContentLoaded',\
  \ init); \n```\n\n**代码列表 11.32** 更改元素的位置\n\n## 11.3 总结\n\n本章展示了如何使用 JavaScript 在浏览器窗口内创建图形。这里的要点如下：\n\
  \n*   使用 Canvas API，你可以在绘制区域内创建图形。\n*   <samp class=\"listingcharacter\"><canvas></samp>\
  \ 元素提供一个或多个渲染上下文，通过这些上下文可以操作绘制区域或其内容。\n*   对于绘制矩形，Canvas API 提供了三种方法：\n    *   <samp\
  \ class=\"listingcharacter\">fillRect()` 创建一个填充之前定义的背景颜色的矩形。\n    *   <samp class=\"\
  listingcharacter\">strokeRect()` 绘制矩形的轮廓（同样使用之前定义的描边颜色）。\n    *   <samp class=\"\
  listingcharacter\">clearRect()` 清除绘制区域内定义矩形的所有内容。\n*   所有其他几何形状都必须使用路径绘制。\n*   相反，文本可以使用\
  \ <samp class=\"listingcharacter\">fillText()` 和 <samp class=\"listingcharacter\"\
  >strokeText()` 方法生成。\n*   要绘制线性渐变，可以使用 <samp class=\"listingcharacter\">createLinearGradient()`\
  \ 方法，而 <samp class=\"listingcharacter\">createRadialGradient()` 方法允许你绘制径向渐变。\n*\
  \   此外，还有三种操作可变换图形元素：\n    *   缩放更改宽度和/或高度。\n    *   旋转更改角度。\n    *   平移更改 x 和/或\
  \ y 位置。\n\n\n\n\n\n* `SVG` 格式用于矢量图形的声明式定义。\n* SVG 可以通过 `<img>`、`<iframe>` 或 `<object>`\
  \ 元素集成，也可以通过 CSS 作为背景图像，或者直接内联在 HTML 中。\n* SVG 可以使用 CSS 进行样式设置，尽管某些属性与用于设置 HTML\
  \ 的 CSS 属性有所不同。\n* JavaScript 可以用于访问 SVG 文档的内容——例如，为单个图形元素注册事件监听器，或动态添加新的图形元素。\n\
  \n# 12 使用现代 Web API\n\nHTML5 为 Web 开发者提供了许多新的 `JavaScript` API，此外，这些 API 可用于各种实用的功能。在本章中，我们将涵盖其中一部分\
  \ API，并向你展示例如：与服务器通信的替代方案、如何存储数据以便离线可用、如何播放音频和视频文件，以及如何确定用户的地理位置。所有这些技术（以及更多）都能让你的\
  \ Web 应用程序更加动态和多功能。\n\n你可以轻松地用关于 Web API 的信息填满整本书，因此在本章中——尽管章节很长——我们只介绍一小部分广为人名的\
  \ API。具体来说，我们将介绍表 12.1 中列出的 API。\n\n| Web API |  | 章节 |\n| --- | --- | --- |\n|\
  \ Web Socket API | 实现客户端与服务器之间的双向通信 | 第 12.1.2 节 |\n| 服务器发送事件 (SSE) | 允许服务器向客户端主动发送消息\
  \ | 第 12.1.3 节 |\n| Web Storage API | 允许访问浏览器存储 | 第 12.3 节 |\n| Indexed Database\
  \ API | 允许访问浏览器数据库 | 第 12.4 节 |\n| File API | 允许访问文件系统 | 第 12.5 节 |\n| 拖放 API |\
  \ 允许组件在 Web 页面内移动 | 第 12.6 节 |\n| Web Worker API | 允许 JavaScript 程序并行运行 | 第 12.7\
