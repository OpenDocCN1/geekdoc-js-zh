- "# JavaScript：专业 JavaScript 编程学习全面指南\n\n\n\n\n\n\n\n\n# 亲爱的读者\n\n从我记忆中开始，我就一直想学开车。\n\
  \n由于各种生活变故，直到几年前我 28 岁时，才有机会去考驾照。第一节课那天，我跳进教练的车里，穿过了一个路口，转了四个右弯，随手停好车，然后由于恐惧，我僵硬着身体走下车回了自门门。一切本很顺利。但在第一个红绿灯前，看着汽车飞驰而过，我灵光一闪：汽车简直是受诅的死亡陷阱。我取消了剩下的课程。\n\
  \n一年后，我才再次报名。当我向新教练转述我之前的经历时，他——一个在驾校兼职的大学生——心领神会地点了点头。他的成年学员往往比他的青少年学生更焦虑。“你想太多了，”他说，“而且，你们的大脑发育太完全了。冲动控制更多，风险行为更少。”（这里遗憾地摇了摇头，仿佛在说大脑发育完全是一个不幸的特征。）“你需要跳出自我束缚。让自己稍微鲁莽一点。”\n\
  \n读者，我确实跳出了自我束缚。那年我成功学会了开车，我很自豪地说我喜欢它。我经常发现自己会回味教练的建议。当我考虑培养新爱好或学习新技能时，我会尽力做到无拘无地学习。\n\
  \n无论你是出于热情还是实用目的拿起这本书，无论你是初学者还是经验丰富的程序员，我都希望你在学习 `JavaScript` 时能获得同样的成功。你的驾驶教练是专家作者\
  \ Philip Ackermann，他撰写了一份详尽的手册，引导你开启 `JavaScript` 之旅，从语言基础到客户端端和服务器端编程。\n\n你对《JavaScript：全面指南》评价如何？您的评论和建议是帮助我们把书籍做得完美的最有用工具。请随时与我联系并分享您的任何赞誉或批评。\n\
