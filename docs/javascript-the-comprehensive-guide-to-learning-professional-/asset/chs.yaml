  \ |\n\n**表 19.2** 基于 Electron 的应用程序\n\n## 19.3 总结\n\n通过 NW.js 和 Electron，可以很容易地基于\
  \ HTML、CSS 和 JavaScript 创建跨平台的桌面应用程序。你应该记住本章的以下几点：\n\n*   NW.js 和 Electron 在原理上相似，都结合了\
  \ WebKit 和 Node.js。\n*   这两个框架都允许使用 DOM API 和 Node.js 的各种 API。\n*   HTML 文件是 NW.js\
  \ 的入口点；对于 Electron 来说则是 JavaScript 文件。\n*   在 NW.js 中，Node.js 和 WebKit 共享同一个 JavaScript\
  \ 上下文；而在 Electron 中，存在多个上下文，因为它在主进程和渲染进程之间做了区分。\n*   NW.js 和 Electron 都允许将应用程序打包用于不同的操作系统和架构。\n\
  \n# 20 使用 JavaScript 控制微控制器\n\n除了服务器端、移动端和桌面应用外，JavaScript 编程的另一个应用领域近年来也出现了：在微控制器或嵌入式系统中使用，这构成了物联网的基础。在本章中，我们将介绍与此背景相关的技术和库，并作为示例向你展示如何通过\
  \ JavaScript 读取温度传感器或控制 LED 灯。\n\n你可能以前听过“物联网”（IoT）这个术语。在最广泛的范围内，它指的是通过互联网将事物——即日常物品——进行联网。此类联网日常物品的经典例子包括：知道何时在线订购新牛奶的智能冰箱、在闹钟响起时独立准备新鲜咖啡的咖啡机，或者自动控制灯光、暖气和百叶窗的智能家居。\n\
  \n此外，微控制器在后台运行，读取传感器（温度传感器、运动传感器等）或控制执行器（在最简单的情况下是 LED，或者例如启动和关闭电机）。\n\n现在有许多不同的专有物联网解决方案和各种协议，让个体物体、微控制器等能够相互通信（Wi-Fi、低功耗蓝牙、无线电等），关于这个主题可以写一整本书。然而，我的意图是向你展示如何在选定的微控制器（以及微计算机）上运行\
  \ JavaScript，例如读取传感器或控制执行器。\n\n具体来说，我们将查看以下：\n\n*   Espruino 微控制器\n*   Tessel 微控制器\n\
  *   BeagleBone Black 微计算机\n*   Arduino 微控制器\n\n### 注意\n\n为了让本章的代码也能在上述微控制旧版本上运行，本章没有使用\
  \ `let` 和 `const` 关键字等“新”特性。\n\n## 20.1 Espruino\n\nEspruino（参见图 20.1）是一种不执行 C 甚至汇编代码（正如你从其他微控制器习惯那样），而是执行\
  \ JavaScript 代码的微控制器。\n\n![Espruino 板只有信用卡大小的一半](img/img-f20.1.html)\n\n**图 20.1**\
  \ Espruino 板只有信用卡大小的一半\n\n### 20.1.1 技术信息\n\nEspruino 板载上自带一个轻量级 JavaScript 解释器，原则上也可以安装并使用在其他设备上，它基于\
  \ 128 KB 的闪存和 8 KB 的 RAM。在 Espruino 上实现更多是不可能的，因为它只有 48 KB 的 RAM 和 256 KB 的闪存。对于工业用途来说不多，但对于原型开发足够了。它还配备了\
  \ 72 MHz 的 Arm Cortex-M3 处理器。\n\n此外，Espruino 提供一个 microSD 卡槽、一个 micro USB 端口、两个按钮、三个\
  \ LED 灯（红、绿、蓝）以及 44 个通用输入输出 (GPIO) 引脚，可连接传感器和执行器等外部组件（更多细节，请参阅制造商网站上的 [www.espruino.com](http://www.espruino.com)\
  \ 产品描述）。\n\nEspruino 的尺寸为 2.2 x 1.6 英寸，只有信用卡大小的一半，这就是为什么它非常适合物联网 项目的原型开发——例如测试和评估不同器的交互。\n\
  \n### 20.1.2 连接与安装\n\n要用 Espruino 开发，你必须先使用 micro USB 线将微控制器连接到 PC 或 Mac。在 Windows\
  \ 下，你必须安装一些特殊的驱动程序。在 Linux 下，你需要分配一些权限，而 macOS 通过即插即用提供该板。\n\n原则上，成功连接后，可以使用任何终端程序访问\
  \ Espruino。但是在开发期间，Espruino Web IDE 非常有用。这是制造商在其网站上提供的一个浏览器插件（参见图 20.2）。这个开发环境使得能够相对容易地将\
  \ JavaScript 代码加载到 Espruino 板上并在那里进行测试执行。\n\n![Espruino Web IDE 方便了 Espruino 的编程](img/img-f20.2.html)\n\
  \n**图 20.2** Espruino Web IDE 方便了 Espruino 的编程\n\n通过终端程序或 web IDE 连接到 Espruino 板后，你会发现自己处于开发板的命令行中，原则上可以直接执行任何\
  \ JavaScript 指令。更复杂的程序可以手动或通过 IDE 加载到板上。\n\n### 20.1.3 第一个示例\n\n\n\n\n\n除了你已经从 JavaScript\
  \ 标准中了解的对象和函数外，Espruino 还提供了它自己的对象和函数，用于控制开发板。例如，对于单个引脚的地址（例如 GPIO 引脚、LED 和推按钮），每种情况下都有相应的全局对象可用（例如\
  \ `LED1`、`LED2` 和 `LED3` 对象），它们都是 `Pin` 类的实例。后者具有不同的方法：例如，通过 `read()` 可以读取对应引脚的值或电平；通过\
  \ `write()` 可以写入引脚的值；通过 `set()` 可以直接设置为值 `1`；通过 `reset()` 可以直接设置为值 `0`（请参见代码列表 20.1）。\n\
  \n```\nLED1.set();           // Red LED on\nLED1.read();          // Output: true\n\
  LED1.reset();         // Red LED off\nLED1.read();          // Output: false\nLED1.write(1);\
  \        // Red LED on\nLED1.write(0);        // Red LED off\nLED1.write(true);\
  \     // Red LED on\nLED1.write(false);    // Red LED off\nLED1.write(HIGH);   \
  \  // red LED on, constant HIGH has value 1\nLED1.write(LOW);      // red LED off,\
  \ constant LOW has value 0\nLED2.write(1);        // Green LED on\nLED3.write(1);\
  \        // Blue LED on \n```\n\n**代码列表 20.1** 不同对象——LED1、LED2 和 LED3——引脚的抽象操作\n\
  \n### 20.1.4 控制 LED\n\n一个以短间隔闪亮三个内置 LED 的简单示例——可以说是是物联网世界的“Hello World”示例——在代码列表\
  \ 20.2 所示。首先，在这里定义了三个 `toggleRed()`、`toggleGreen()` 和 `toggleBlue()` 函数，它们用于切换对应\
  \ LED 的开启关闭。其次，`setInterval()` 定义了调用这些函数的间隔。在示例中，红色 LED 每 400 毫秒以此方式开启或关闭一次，绿色 LED\
  \ 每 420 毫秒一次，蓝色 LED 每 440 毫秒一次。\n\n```\nvar red = true;\nvar green = true;\nvar\
  \ blue = true;\n\nfunction toggleRed() {\n  red = !red;\n  LED1.write(red);\n}\n\
  function toggleGreen() {\n  green = !green;\n  LED2.write(green);\n}\nfunction toggleBlue()\
  \ {\n  blue = !blue;\n  LED3.write(blue);\n}\nsetInterval(toggleRed, 400);\nsetInterval(toggleGreen,\
  \ 420);\nsetInterval(toggleBlue, 440);\n```\n\n**代码列表 20.2** 间隔控制 LED 灯开关\n\n作为\
  \ `Pin` 的 `read()` 和 `write()` 方法的替代，提供了 `digitalWrite()` 和 `digitalRead()` 全局函数分别用于写入和读取引脚。`digitalWrite()`\
  \ 函数接收引脚编号和要写入该引脚的值。因此，上一个示例可以使用使用 `digitalWrite()` 进行调整，如代码列表 20.3 所示。\n\n```\n\
  var red = true;\nvar green = true;\nvar blue = true;\n\nfunction toggle1() {\n \
  \ red = !red;\n  digitalWrite(LED1, red);\n}\nfunction toggle2() {\n  green = !green;\n\
  \  digitalWrite(LED2, green); \n}\nfunction toggle3() {\n  blue = !blue;\n  digitalWrite(LED3,\
  \ blue); \n}\nsetInterval(toggle1, 400);\nsetInterval(toggle2, 420);\nsetInterval(toggle3,\
  \ 440); \n```\n\n**代码列表 20.3** 使用 digitalWrite() 间隔控制 LED 灯开关\n\n与通过 `digitalWrite()`\
  \ 写入值类似，`digitalRead()` 函数用于读取单个引脚的值。如果你向它传递引脚编号，你将获得该处当前测量的电平。一个通过推按钮开启或关闭 LED\
  \ 的示例在代码列表 20.4 所示。\n\n在代码列表中，为了读取推按钮的状态（已按下或未按下），使用了 `digitalRead()` 方法。`setWatch()`\
  \ 函数被用于来持续监控引脚的状态。如果状态发生变化，程序将执行传递的回调函数。在示例中，通过这种方式监控推按钮的状态（`BTN1`），一旦它被按下（从返回值\
  \ `1` 可以看出），红色 LED 就会开启或关闭，这由回调函数内部的代码进行控制。\n\n```\nvar red = true;\nsetWatch(function()\
  \ {\n if (digitalRead(BTN1) === 1) {\n    digitalWrite(LED1, red);\n    red = !red;\n\
  \  }\n}, BTN1, true); \n```\n\n**代码列表 20.4** 通过 digitalRead() 读取推按钮状态\n\n### 20.1.5\
  \ 更多模块\n\n你可以在 Espruino 文档中找到可用函数和对象的概览（包括 JavaScript 开发者熟悉的旧识，如 `JSON` 或 `console`\
  \ 对象）。此外，开箱即用许多 JavaScript 模块。例如，Espruino 开发板还可以通过 `http` 模块作为 HTTP 客户端或 HTTP 服务器使用，如代码列表\
  \ 20.5 和代码列表 20.6 所示。\n\n```\nvar http = require('http');\nhttp.get(\"http://www.espruino.com\"\
  , function(res) {\n res.on('data', function(data) {\n    console.log(data);\n  });\n\
  }); \n```\n\n**代码列表 20.5** 作为 HTTP 客户端的 Espruino 开发板\n\n```\nvar http = require('http');\n\
  http.createServer(function (req, res) {\n  res.writeHead(200);\n  res.end('Hello\
  \ World'); \n}).listen(8080); \n```\n\n**代码列表 20.6** 作为 HTTP 服务器的 Espruino 开发板\n\
  \n`fs` 模块还允许开发者访问 microSD 卡的文件系统。代码列表 20.7 示例了如何使用 `writeFileSync()` 方法写入文件，并使用\
  \ `readFileSync()` 方法读取。\n\n```\nvar fs = require('fs');\nfs.writeFileSync('file.txt',\
  \ 'Hello World');\nconsole.log(fs.readFileSync('file.txt')); \n```\n\n**代码列表 20.7**\
  \ 文件系统访问\n\n###### 更多模块\n\n有关默认提供的模块的完整参考，请访问 [www.espruino.com/Reference](http://www.espruino.com/Reference)。\n\
  \n### 20.1.6 读取传感器\n\n还可以接入额外的模块——例如访问传感器、执行器或其他连接组件。它们都通过 Node.js 包管理器 (npm) 安装。如果你使用\
  \ Espruino Web IDE，它会在你上传代码时自动为 Espruino 加载模块。或者可以将模块复制到 SD 卡的 `node_modules` 文件夹中，或者如果\
  \ Espruino 有 Wi-Fi 连接，可以直接从网上下载。\n\n可用模块的完整概览也可以在项目中找到。其中包含用于读取传感器的模块，如代码列表 20.8\
  \ 所示。\n\n```\nvar ow = new OneWire(A1);\nvar sensor = require(\"DS18B20\").connect(ow);\n\
  setInterval(function() {\n  // 输出测量的温度值\n  console.log(sensor.getTemp());\n}, 1000);\n\
  ```\n\n**代码列表 20.8** 读取温度传感器\n\n\n\n\n\n从模块名称（此处为 `DS18B20`）可以看出，各个模块通常具有很强的硬件特定性。这意味着，例如，没有任何一个通用模块可以用于任何温度传感器。\n\
  \n虽然示例仅展示了如何读取温度传感器的值，但可以相对容易地进行扩展——假设具备相应的电子工程知识——例如，可以根据此值来开启或关闭连接的加热器。\n\n###\
  \ 更小的：Espruino Pico\n\n如果说 Espruino 已经是一个娇小玲了，那么 Espruino Pico 则更上一层楼：尺寸仅为 1.3 x\
  \ 0.6 英寸，只有它大哥尺寸的四分之一。然而，这是以硬件为代价的：相比三个 LED，Espruino Pico 只有两个（红色和绿色）；相比两个按按钮，它只有一个；而相比\
  \ 44 个 GPIO 引脚，它只有 22 个。另一方面，内存得到了升级：使用了 84 MHz 的 Arm Cortex-M4 处理器、384 KB 闪存和 96\
  \ KB 运行内存。在价格方面，约 30 美元的 Espruino Pico 比约 35 美元的 Espruino 还要便宜一点。\n\n## 20.2 Tessel\n\
  \n与 Espruino 类似，Tessel 开发板（见 ）能够原生解析 JavaScript，其主要特点是具有模块化扩展性。\n\n### 20.2.1 技术信息\n\
  \nTessel 开发板（版本 1）具有一个 180 MHz 的 Arm Cortex-M3 处理器、32 MB 闪存、32 MB 运行内存、内置 Wi-Fi\
  \ 模块、一个 GPIO 条、四个 LED、两个按按钮、一个 micro USB 端口以及四个用于添加外部 Tessel 硬件模块的插槽。\n\n![Tessel\
  \ 开发板的特点是模块化扩展性。图像来源：https://tessel.io/press](img/img-f20.3.html)\n\n**图 20.3**\
  \ Tessel 开发板的特点是模块化扩展性。图像来源：[`tessel.io/press`](https://tessel.io/press)\n\n另一方面，Tessel\
  \ 2（见 ）配备了 580 MHz 的 MediaTek MT7620N 处理器、32 MB 闪存和 64 MB DDR2 运行内存、一个 micro USB\
  \ 端口和两个 USB 端口、一个 Wi-Fi 模块和一个以太网端口。然而，Tessel 2 上用于连接 Tessel 模块的插槽仅有两个。\n\n![版本 2\
  \ 的 Tessel 开发板。图像来源：https://tessel.io/press](img/img-f20.4.html)\n\n**图 20.4** 版本\
  \ 2 的 Tessel 开发板。图像来源：[`tessel.io/press`](https://tessel.io/press)\n\n### 20.2.2\
  \ 连接与安装\n\n开发时，Tessel 开发板通过 micro USB 连接到 PC 或 Mac。在开始开发之前，必须在相应的主机计算机通过 NPM 全局安装\
  \ `tessel` Node.js 模块：\n\n```\nnpm install -g tessel \n```\n\n之后，命令行中即可使用 `tessel`\
  \ 命令，用于在连接的开发板上执行 JavaScript 程序或将其上传到开发板上。`run` 参数用于启动程序：\n\n```\ntessel run index.js\
  \ \n```\n\n使用此参数，Tessel 将相应的程序加载到运行内存并在其中执行。然而，程序并没有加载到闪存中；这意味着，如果你再次断开 Tessel 开发板与主机的连接，程序将会丢失。要将程序加载到闪存——即在\
  \ Tessel 开发板上部署程序——你必须使用 `push` 参数：\n\n```\ntessel push index.js \n```\n\n### 20.2.3\
  \ 控制 LED\n\n要在 JavaScript 程序中控制 Tessel 开发板，必须通过 `require('tessel')` 引入相应的 Node.js\
  \ 模块（见 列表 20.9）。\n\n```\nvar tessel = require('tessel'); \n```\n\n**列表 20.9** 集成\
  \ tessel 模块\n\n该模块可以访问开发板的 LED（通过 `tessel.led` 数组）、可编程按按钮（通过 `tessel.button` 变量）以及各个端口——即模块连接和\
  \ GPIO 连接器条（通过 `tessel.port` 映射；API 的完整描述可以在 Tessel 文档中找到）。\n\n列表 20.10 中的代码示例展示了——类似于\
  \ Espruino 开发板的代码——一个用于交替 LED 的程序。该代码示例类似于 Espruino 开发板的代码，通过 `red`、`green` 和 `amber`\
  \ 变量，在固定间隔执行 `toggleGreen()`、`toggleBlue()` 和 `toggleRed()` 函数，来控制 LED 的交替开启和关闭。\n\
  \n#### 注意：\n\n以下代码示例均适用于 Tessel 的第一个版本。\n\n```\nvar tessel = require('tessel');\n\
  var red = true;\nvar green = true;\nvar blue = true;\nvar amber = true;\nfunction\
  \ toggleGreen() {\n  green = !green;\n  tessel.led[0].write(green);\n}\nfunction\
  \ toggleBlue() {\n  blue = !blue;\n  tessel.led[1].write(blue);\n}\nfunction toggleRed()\
  \ {\n  red = !red;\n  tessel.led[2].write(red);\n}\nfunction toggleAmber() {\n \
  \ amber = !amber;\n  tessel.led[3].write(amber);\n}\nsetInterval(toggleGreen, 400);\n\
  setInterval(toggleBlue, 420);\nsetInterval(toggleRed, 440);\nsetInterval(toggleAmber,\
  \ 460);\n```\n\n或者，你可以使用 `toggle()` 方法，这让你免于记忆状态的繁琐任务（见 列表 20.11）。\n\n```\nvar tessel\
  \ = require('tessel');\nvar greenLED = tessel.led[0].write(0);\nvar blueLED = tessel.led[1].write(0);\n\
  var redLED = tessel.led[2].write(0);\nvar amberLED = tessel.led[3].write(0);\nfunction\
  \ toggleGreen() {\n  greenLED.toggle();\n}\nfunction toggleBlue() {\n  blueLED.toggle();\n\
  }\nfunction toggleRed() {\n  redLED.toggle();\n}\nfunction toggleAmber() {\n  amberLED.toggle();\n\
  }\nsetInterval(toggleRed, 400);\nsetInterval(toggleGreen, 420);\nsetInterval(toggleBlue,\
  \ 440);\nsetInterval(toggleAmber, 460);\n```\n\n**列表 20.11** 使用 toggle 辅助函数控制 Tessel\
  \ 的 LED 交替开关\n\n### 20.2.4 编程按按钮\n\n如前所述，Tessel 开发板有两个按按钮。一个用于重启 Tessel 开发板。另一个尚未提供任何特殊功能，因此可以根据自己的需求进行编程。`button`\
  \ 对象为此目的提供了 `on()` 方法，用于定义 `press` 和 `release` 事件的处理程序。相应的示例可以在 列表 20.12 中找到：当按下按钮时，LED\
  \ 开启；当释放时，它再次关闭。\n\n```\nvar tessel = require('tessel');\ntessel.button.on('press',\
  \ function(time, type) {\n  tessel.led[0].write(1);\n});\ntessel.button.on('release',\
  \ function(time, type) {\n  ctessel.led[0].write(0);\n});\n```\n\n**列表 20.12** 控制\
  \ Tessel 开发板的 LED\n\n### 20.2.5 使用模块扩展 Tessel\n\nTessel 的特殊之处在于通过两个或四个模块连接实现的模块化扩展性。许多不同的模块适用于不同的应用程序，例如蓝牙适配器、加速度计（一种加速度传感器）或舵机控制。\n\
  \n\n\n\n\n所有这些模块都专为 Tessel 板设计，并相应针对 JavaScript 编程进行了优化（尽管这在模块的价格上有所体现——与非专利组件相比，这些模块要贵得多）。\n\
  \n每个 Tessel 模块都可以通过相应的 Node.js 模块进行控制。列表 20.13 显示了使用模块控制摄像头的示例。\n\n```javascript\n\
  var tessel = require('tessel');\nvar camera = require('camera-vc0706').use(tessel.port['A']);\
  \ \nvar notificationLED = tessel.led[3];\ncamera.on('ready', function() {\n  notificationLED.high();\n\
  \  camera.takePicture(function(err, image) {\n    if (err) {\n      console.error(err);\n\
  \    } else {\n      notificationLED.low();\n      var name = 'picture-' + \n  \
  \      Math.floor(Date.now()*1000) + \n        '.jpg';\n      process.sendfile(name,\
  \ image);\n      camera.disable();\n    }\n  });\n});\ncamera.on('error', function(err)\
  \ {\n  console.error(err);\n}); \n```\n\n**列表 20.13** 控制 Tessel 板的摄像头模块\n\n虽然示例再次刻意保持了简单，但已经很容易想象出摄像头模块可以实现的功能：例如，与运动传感器结合，实现一个依赖运动的监控系统原型将相对容易。录制的照片也可以存储在中央服务器上或直接通过电子邮件发送。得益于内置的\
  \ Wi-Fi 模块，Tessel 板甚至不需要通过太网连接。\n\n## 20.3 BeagleBone Black\n\nBeagleBone Black\
  \ ([`beagleboard.org/BLACK`](http://beagleboard.org/BLACK)；参见图 20.5) 是一种与树莓派相似的单板微型，因此与\
  \ Espruino 或 Tessel 微控制器相比，处于不同的量级，因为它提供了更高的性能和计算能力。\n\n![BeagleBone Black 是一台功能完备的电脑](img/img-f20.5.html)\n\
  \n**图 20.5** BeagleBone Black 是一台功能完备的电脑\n\n### 20.3.1 技术信息\n\nBeagleBone Black\
  \ 具有一个来自 AM335x 系列的 1 GHz ARM Cortex A8 处理器；USB、HDMI 和以太网端口以及四个 LED。它带有 2 GB 闪存和\
  \ 512 MB 内存。BeagleBone Black 可以通过各种扩展板（称为 capes；参见[`beagleboard.org/cape`](http://beagleboard.org/cape)）扩展额外的功能和组件。这些包括液晶显示器\
  \ (LCD)、电机控制器、用于电路实验的面包板等更多内容。\n\n可用 capes 的概览可以在 Embedded Linux 网站的 [`elinux.org/Beagleboard:BeagleBone_Capes`](http://elinux.org/Beagleboard:BeagleBone_Capes)\
  \ 找到。\n\n从原则上讲，BeagleBone Black 还可以使用其他语言（如 C、Python、Java 等）进行编程，因为默认安装的操作系统是完整的\
  \ Linux (Debian)。\n\n得益于 Node.js 运行时环境，可以直接在板上执行 JavaScript。要做到这一点，你可以在命令行上使用 `node`\
  \ 命令，或者使用 BeagleBone Black 默认提供的 Cloud9 IDE。\n\n### 20.3.2 连接与安装\n\nBeagleBone Black\
  \ 的安装和配置相对简单：通过 USB 将微型电脑连接到 PC 或 Mac 并随后安装驱动程序，你就可以在浏览器通过 http://192.168.7.2/ 访问\
  \ BeagleBone 的 Web 界面，并在 http://192.168.7.2:3000/ 安装 Cloud9 IDE（参见图 20.6）。\n\n![推荐使用\
  \ Cloud9 IDE 进行 BeagleBone Black 开发](img/img-f20.6.html)\n\n**图 20.6** 推荐使用 Cloud9\
  \ IDE 进行 BeagleBone Black 开发\n\n预装的 BoneScript 库 ([`beagleboard.org/support/bonescript`](http://beagleboard.org/support/bonescript))\
  \ 可用于该板的编程，可以像通常 Node.js 模块一样通过 `require('bonescript')` 命令集成到相应的程序中。它简化了对 BeagleBone\
  \ Black 硬件组件的。列表 20.14 显示了例如你如何通过此模块访问各个 LED。\n\n`digitalWrite()` 方法用于向引脚写入值，就像在\
  \ Espruino 的相应代码示例中传递一样。在列表中，所有四个 LED 都被设置为值 `1`；也就是说它们被开启了。\n\n```javascript\n\
  var b = require('bonescript');\nb.pinMode('USR0', b.OUTPUT);     // LED 0 为输出模式\n\
  b.pinMode('USR1', b.OUTPUT);     // LED 1 为输出模式\nb.pinMode('USR2', b.OUTPUT);  \
  \   // LED 2 为输出模式\nb.pinMode('USR3', b.OUTPUT);     // LED 3 为输出模式\nb.digitalWrite('USR0',\
  \ b.HIGH);  // 开启 LED 0\nb.digitalWrite('USR1', b.HIGH);  // 开启 LED 1\nb.digitalWrite('USR2',\
  \ b.HIGH);  // 开启 LED 2\nb.digitalWrite('USR3', b.HIGH);  // 开启 LED 3 \n```\n\n\
  **列表 20.14** 在 BeagleBone Black 上开关 LED\n\n#### 注意\n\n此时建议调用 `pinMode()` 以显式地将相应的\
  \ LED 引脚（`USR0`、`USR1`、`USR2` 和 `USR3`）定义为输出（在开启 BeagleBone Black 后，所有引脚默认定义为输入）。\n\
  \n### 20.3.3 控制 LED\n\n列表 20.15 显示了通过连接的按键切换 LED 开关的代码（示例的接线详情可以在 [`beagleboard.org/Support/BoneScript/pushbutton`](http://beagleboard.org/Support/BoneScript/pushbutton)\
  \ 找到）。编号为 `P8_19` 的引脚（连接按键的）定义为输入，引脚 `P8_13`（连接 LED 的）定义为输出。\n\n使用 `setInterval()`，你定义每隔\
  \ 100 毫秒调用一次 `check()` 函数。它通过 `digitalRead()` 读取连接按键的引脚值，或将该值传递给 `checkButton()`\
  \ 回调函数。在该函数内部，根据测量值（按键按下为 `1`，未按下为 `0`）通过 `digitalWrite()` 打开或关闭 LED。\n\n```javascript\n\
  var b = require('bonescript');\nb.pinMode('P8_19', b.INPUT);\nb.pinMode('P8_13',\
  \ b.OUTPUT);\nsetInterval(check, 100);\nfunction check(){\n  b.digitalRead('P8_19',\
  \ checkButton);\n}\nfunction checkButton(x) {\n  if(x.value == 1){\n    b.digitalWrite('P8_13',\
  \ b.HIGH);\n  }\n  else{\n    b.digitalWrite('P8_13', b.LOW);\n  }\n} \n```\n\n\
  **列表 20.15** 在 BeagleBone Black 上通过按键开关 LED\n\n## 20.4 Arduino\n\nArduino 单板电脑 ([www.arduino.cc](http://www.arduino.cc)；参见图\
  \ 20.7) 仍然是物联网开发最成熟的平台。然而，开发 C 可能并不是每个人的菜，因此现在也可以通过 JavaScript 远程控制 Arduino。\n\n\
  ![Arduino Uno 可以通过 Firmata 协议进行通信](img/img-f20.7.html)\n\n**图 20.7** Arduino Uno\
  \ 可以通过 Firmata 协议进行通信\n\n#### Arduino Yún\n\n\n\n\n\n尽管如此，为了完整起见，需要注意的是与后续示例中使用的\
  \ Uno 等其他 Arduino 不同，Arduino Yún 甚至包含一个 Node.js 安装程序，可以直接运行 JavaScript。\n\n### 20.4.1\
  \ Firmata 协议\n\nFirmata 协议基于 MIDI 消息格式（[www.midi.org/techspecs/midimessages.php](http://www.midi.org/techspecs/midimessages.php)），允许你从远程计算机与\
  \ Arduino（或通用的微控制器和微型）通信。原则上，任何微控制器都可以实现该协议，但 Arduino 板板的实现（[`github.com/firmata/arduino`](https://github.com/firmata/arduino））目前是最常用的。\n\
  \n### 20.4.2 连接与安装\n\n默认情况下，Arduino 上没有 Firmata 服务器，这意味着你必须先手动安装。最简单的方法是使用 Arduino\
  \ IDE，可以从 Arduino 网站（[www.arduino.cc/en/main/software](http://www.arduino.cc/en/main/software)）下载\
  \ Windows、macOS 或 Linux 版本。在成功安装并启动 IDE 后，必须通过 USB 将 Arduino 连接到 PC 或 Mac。在“工具”菜单中，选择相应的板子和端口，以便从你的\
  \ PC/Mac 到 Arduino 板板的上传过程以及 Firmata 服务器的安装能够顺利运行（参见图 20.8）。\n\n![选择板子和端口](img/img-f20.8.html)\n\
  \n**图 20.8** 选择板子和端口\n\n接下来，从文件 • 示例 • Firmata 菜单中选择 `StandardFirmata` 以打开 StandardFirmata\
  \ Sketch。这是一个包含 Firmata 服务器代码的源代码文件。随后，点击出现窗口中的“上传”按钮，将代码相应传输到 Arduino 板板。现在安装已完成：你可以再次关闭\
  \ Arduino IDE，Arduino 上的 Firmata 服务器已准备就绪。\n\n### 20.4.3 Johnny Five Node.js 模块\n\
  \n在客户端，有多个实现 Firmata 协议的库——例如适用于 Python、Perl、Ruby、Clojure、Java、.NET、PHP 和 JavaScript\
  \ 等语言。对于后者，Johnny Five 库（[`github.com/rwaldron/johnny-five`](https://github.com/rwaldron/johnny-five））可能是最广名的实现。\n\
  \n使用 `npm install johnny-five` 命令安装 Johnny Five（在客户端，而不是 Arduino 上）。然后你可以使用 `require('johnny-five')`\
  \ 将该模块集成到相应的 JavaScript 程序中。列表 20.16 显示了控制 Arduino 上 LED 的一个简单示例（这需要如图 20.7;\nvar\
  \ board = new five.Board({\n port: '/dev/cu.usbmodem14131'\n});\n\nvar LEDPIN =\
  \ 13;\nvar OUTPUT = 1;\n\nboard.on('ready', function() {\n  var value = 0;\n  this.pinMode(LEDPIN,\
  \ OUTPUT);\n  this.loop(2000, function() {\n      value = value ? 0 : 1;\n    this.digitalWrite(LEDPIN,\
  \ value);\n  });\n}); \n```\n\n**列表 20.16** 使用 Johnny Five 切换 LED 的开关\n\n你通过 `Board`\
  \ 实例与 Arduino 通信。程序使用 `on()` 方法为 `ready` 事件定义事件处理程序，该程序会在你建立与 Arduino 板板的连接时执行。\n\
  \n`loop()` 函数确保传递给它的事件处理程序被执行多次（在这里是每两秒一次）。处理器包含这些函数，确保使用 `digitalWrite()` 交替切换指定引脚上的\
  \ LED 开关。\n\n刚才在代码中手动完成的操作可以通过 `Led` 类进行简化，如列表 20.17 所示。它抽象了与 LED 灯的通信，并使用例如 `blink()`\
  \ 方法交替切换 LED 的开关。\n\n```\nvar five = require('johnny-five');\nvar board = new five.Board({\n\
  \  port: '/dev/cu.usbmodem14131'\n});\nboard.on('ready', function() {\n  var led\
  \ = new five.Led(13);\n  led.blink(2000);\n}); \n```\n\n**列表 20.17** 通过 LED 类使用\
  \ Johnny Five 切换 LED 的开关\n\n此外，还有许多类用于处理按按钮、键盘、摇杆、传感器（距离传感器、运动传感器、温度传感器等）等。例如，程序可以相对容易地扩展为使用按按钮切换\
  \ LED 的开关，如列表 20.18 所示。\n\n```\nvar five = require('johnny-five'), button, led;\n\
  var board = five.Board({\n  port: '/dev/cu.usbmodem14131'\n}).on('ready', function()\
  \ {\n  button = new five.Button(7);\n  led = new five.Led(13);\n  button.on('hit',\
  \ function() {\n    led.on();\n  }).on('release', function() {\n    led.off();\n\
  \  });\n}); \n```\n\n**列表 20.18** 在 Arduino 上通过按按钮切换 LED 的开关\n\n## 20.5 Cylon.js\n\
  \n如果你查看之前列表中的代码示例，你会发现它们在原理上非常相似，仅区别在于细节。这正是 Cylon.js 框架（[`cylonjs.com`](http://cylonjs.com)）介入的地方，它为包括\
  \ Tessel、BeagleBone Black 和 Arduino 在内的各种 IoT 平台创建一个统一接口。（目前不支持 Espruino。）\n\n你使用\
  \ `npm install cylon` 命令将 Cylon.js 作为 Node.js 模块安装。随后，像往常通过 `require('cylon')` 集成该模块。\n\
  \n### 20.5.1 使用 Cylon.js 控制 BeagleBone Black\n\n列表 20.19 显示了如何使用 Cylon.js 控制 BeagleBone\
  \ Black。你可以直接看到了一个相对易懂的 API。`connection()` 方法用于建立与相应微控制器（在此例为 BeagleBone Black）的连接，而相应的配置通过传递的配置对象的\
  \ `adaptor` 属性进行。随后，你可以使用 `device()` 方法配置 LED 和按钮等各种组件。\n\n传递给 `device()` 方法的第一个参数是相应组件的名称，然后在\
  \ JavaScript 代码中可以访问。组件的类型通过作为第二个参数传递的配置对象的 `driver` 属性指定；`pin` 属性决定组件连接到哪个引脚。配置完成后，使用\
  \ `start()` 方法启动整个程序。\n\n```\nvar Cylon = require('cylon');\nCylon\n  .robot()\n\
  \  .connection('beaglebone', { adaptor: 'beaglebone' })\n  .device('led', { driver:\
  \ 'led', pin: 'P9_12' })\n  .device('button', { driver: 'button', pin: 'P9_14' })\n\
  \  .on('ready', function(robot) {\n    robot.button.on('push', function() {\n  \
  \    robot.led.toggle();\n    });\n  });\nCylon.start(); \n```\n\n**列表 20.19** 使用\
  \ Cylon.js 控制 BeagleBone Black\n\n### 20.5.2 使用 Cylon.js 控制 Tessel 板板\n\n使用 Cylon.js\
  \ 控制 Tessel 板板所需的 JavaScript 代码基本上与控制 BeagleBone Black 的代码没有区别，如列表 20.20 所示。唯一的区别是使用的连接信息以及组件或其引脚的配置。\n\
  \n\n\n\n\n```javascript\nvar Cylon = require('cylon');\nCylon\n  .robot()\n  .connection('tessel',\
  \ { adaptor: 'tessel' })\n  .device('led', { driver: 'led', pin: 1 })\n  .device('button',\
  \ { driver: 'button', pin: 'config' })\n  .on('ready', function(robot) {\n    robot.button.on('push',\
  \ function() {\n      robot.led.toggle();\n    });\n  });\nCylon.start(); \n```\n\
  \n列表 20.20 使用 Cylon.js 控制 Tessel 板板\n\n### 20.5.3 使用 Cylon.js 控制 Arduino\n\n通过 `Cylon.js`\
  \ 控制 Arduino 时，相应的 JavaScript 代码本质上再次是相同的（参见 列表 20.21）。只有连接信息以及 LED 和按钮的配置有所不同。\n\
  \n```javascript\nvar Cylon = require('cylon');\nCylon\n  .robot()\n  .connection('arduino',\
  \ { adaptor: 'firmata', port: '/dev/cu.usbmodem14131' })\n  .device('led', { driver:\
  \ 'led', pin: 13 })\n  .device('button', { driver: 'button', pin: 2 })\n  .on('ready',\
  \ function(robot) {\n    robot.button.on('push', function() {\n      robot.led.toggle();\n\
  \    });\n  });\nCylon.start(); \n```\n\n列表 20.21 使用 Cylon.js 控制 Arduino\n\n## 20.6\
  \ 总结\n\n现在已经有一系列微控制器和微型可以运行 JavaScript 应用程序。在本章中，我们向你介绍了其中一些最著名的设备，并向你展示了一个控制 LED\
  \ 的（诚然是简单的）示例。总结一下，请记住：\n\n*   `Espruino` 微控制器可以原生运行 JavaScript。\n*   `Tessel` 微控制器也可以开箱即用地运行\
  \ JavaScript，并且相对容易扩展特殊的硬件模块。\n*   `BeagleBone Black` 微型电脑是一个类似于 `Raspberry Pi`\
  \ 的全功能微型计算机。\n*   大多数 `Arduino` 微型电脑无法运行 JavaScript，但仍然可以使用 `Firmata` 协议进行远程控制。\n\
  *   `Johnny Five` Node.js 模块是 `Firmata` 协议的客户端。\n*   `Cylon.js` JavaScript 库为与各种微控制器协作创建了统一的\
  \ API。\n\n# 21 建立专业的开发流程\n\n专业的软件开发还包括一个专业的开发流程。如何自动化重复性任务？如何自动检查源代码？管理源代码的最佳方法是什么？在本章中，我们将为你提供这些问题的答案，并向你展示为\
  \ JavaScript 应用程序开发建立专业开发流程的初要步骤。\n\n在本章中，我们将更详细地描述使用 JavaScript 进行软件开发的以下方面：\n\n\
  *   自动化重复任务（第 21.1 节）\n*   源代码的自动测试（第 21.2 节）\n*   使用版本控制系统的源代码管理（第 21.3 节）\n\n\
  ## 21.1 任务自动化\n\n作为一名开发者，你最终会发现，开发软件或 Web 应用程序时，某些任务需要反复执行。因此，逻辑上讲，与其总是亲自执行这些任务，不如使用适当的工具来减轻你的大量工作。在接下来的章节中，我们将介绍\
  \ JavaScript 环境中常用的两种此类工具：`Grunt` 和 `Gulp`。\n\n### 21.1.1 使用 Grunt 自动化任务\n\n`Grunt`([`gruntjs.com`](http://gruntjs.com))\
  \ 是一个基于 JavaScript 的构建工具，它可以接管开发者的任务并自动执行它们。`Grunt` 可以通过 `NPM` 作为 Node.js 包进行安装，尽管你应该为每个项目本地安装\
  \ `Grunt` 而不是全局安装。因为你通常只在应用程序开发期间使用 `Grunt`，所以在这里将其作为开发依赖项添加足够了。相应的命令如下：\n\n```bash\n\
  npm install grunt --save-dev \n```\n\n此外，你还需要 `grunt-cli` 包，它在全局提供了命令行命令 `grunt`（本章稍后会进行详细介绍），并需要通过以下命令全局安装：\n\
  \n```bash\nnpm install -g grunt-cli \n```\n\n你可以在一个名为 `Gruntfile.js` 的配置文件中定义每个项目由\
  \ `Grunt` 自动化的任务（简单称为任务），该文件通常位于相应项目的根目录下。你从后缀就可以看出该文件是一个 JavaScript 文件。它的通用结构如列表\
  \ 21.1 所示。\n\n```javascript\n'use strict';\nmodule.exports = function (grunt) {\n\
  \  // 1.) 配置\n  grunt.initConfig({\n    // ...\n  });\n  // 2.) 加载插件和任务\n  grunt.loadNpmTasks('...');\n\
  \  // 3.) 定义任务\n  grunt.registerTask('default', [ '...' ]);\n}; \n```\n\n列表 21.1\
  \ Grunt.js 文件的通用结构\n\n在以熟悉的 CommonJS 方式导出的匿名函数内部，实际配置分三个步骤完成：\n\n1.  你通过 `initConfig()`\
  \ 指定项目和任务配置。\n2.  可以使用 `loadNpmTasks()` 加载现有的插件和任务——即自动化任务。\n3.  你可以通过 `registerTask()`\
  \ 定义你自己的任务。\n\n列表 21.2 显示了一个简单任务的定义，该任务只是在控制台上输出 `Hello World` 消息。`registerTask()`\
  \ 方法的第一个参数是任务名称，第二个参数是短描述，第三个参数是包含任务实际逻辑的回调函数。然后可以使用 `grunt example` 命令调用该任务。\n\n\
  ```javascript\n'use strict';\nmodule.exports = function (grunt) {\n  grunt.registerTask('example',\
  \ 'A sample task.', () => {\n    console.log('Hello World')\n  });\n}; \n```\n\n\
  列表 21.2 Grunt 示例任务\n\n在回调函数中，你可以自动化任何复杂的任务。例如，你可以使用 `fs` 包将文件从 A 复制到 B，重启 Web 服务器等。对于许多此类任务，已经存在相应的插件，你稍可以将它们作为\
  \ Node.js 包进行安装。因此，在接下来的章节中，我们将关注此类插件的使用，而不是定义自定义任务（在此语境下，你拥有 JavaScript 在 Node.js\
  \ 下赋予的所有自由）。\n\n#### 使用插件\n\n`Grunt` 提供了丰富的现有插件，可以在 [`gruntjs.com/plugins`](http://gruntjs.com/plugins)\
  \ 查看。表 21.1 显示了一些知名插件的精选。正如你所见，有插件用于检查代码质量、压缩 JavaScript 或 CSS 文件、生成文档、运行自动化测试，以及正如提到的，还有许多其他任务。\n\
  \n| 插件 | 描述 |\n| --- | --- |\n| grunt-contrib-jshint | 使用 `JSHint`([`jshint.com`](http://jshint.com))\
  \ 验证 JavaScript 代码 |\n| grunt-contrib-uglify | 使用 `UglifyJS`([`github.com/mishoo/UglifyJS`](https://github.com/mishoo/UglifyJS)\
  \ 或 [`github.com/mishoo/UglifyJS2`](https://github.com/mishoo/UglifyJS2)) 压缩 JavaScript\
  \ 代码 |\n| grunt-contrib-concat | 将多个 JavaScript 文件合并为单个 JavaScript 文件 |\n| grunt-contrib-cssmin\
  \ | 压缩 CSS 文件 |\n| grunt-contrib-watch | 当观察到的文件变化时立即执行某些 `Grunt` 任务 |\n| grunt-contrib-qunit\
  \ | 基于 `QUnit`([`qunitjs.com/`](https://qunitjs.com/); 另参见 第 21.2.3 节) 执行单元测试 |\n\
  | grunt-contrib-yuidoc | 使用 `YUIDoc`([`yui.github.io/yuidoc/`](http://yui.github.io/yuidoc/))\
  \ 创建文档 |\n| grunt-mocha-test | 基于 `mocha`([`mochajs.org/`](https://mochajs.org/);\
  \ 另参见 第  21.2.4 节) 执行服务器端单元测试 |\n\n\n\n\n\n# 表 21.1 Grunt 某些插件概述\n\n## 安装插件\n\n\
  前文通过使用 `grunt-contrib-uglify` 插件描述了 Grunt 插件的使用，该插件可以使用 `UglifyJS` 等工具对源代码进行压缩。要使用某个插件，必须首先在相应的项目中进行安装；例如，对于提到的插件，您可以通过以下命令进行安装：\n\
  \n```\nnpm install grunt-contrib-uglify --save-dev \n```\n\n列表 21.3 显示了在 `Gruntfile.js`\
  \ 文件中使用该插件。`UglifyJS` 插件首先在 `initConfig()` 中配置，其中不仅指定了要处理的 JavaScript 文件的源目录和目标目录（`src`\
  \ 和 `dest`），还指定了任务名称（`uglify`）以及是否应该保留目标目录中的目录结构或将目标代码合并为一个文件（`expand`）。\n\n然后通过\
  \ `loadNpmTasks()` 调用加载插件。随后的 `registerTask()` 调用在此处是可选的，它仅用于确保该任务被定义为默认任务。这允许您不仅可以通过\
  \ `grunt uglify` 命令调用任务，还可以通过 `grunt` 命令调用任务。\n\n```\n'use strict';\nconst path\
  \ = require(\"path\");\nmodule.exports = function (grunt) {\n  const binDir = path.join(__dirname,\
  \ \"dist\", \"bin\");\n  grunt.initConfig({\n    uglify: {\n      module : {\n \
  \       files: [\n          {\n            expand : true,\n            src : [\n\
  \              '**/*.js', \n              '!dist/**/*.js', \n              '!node_modules/**/*.js',\
  \ \n              '!Gruntfile.js'\n            ],\n            dest : binDir\n \
  \         }\n        ]\n      }\n    }\n  });\n  grunt.loadNpmTasks('grunt-contrib-uglify');\n\
  \  grunt.registerTask('default', [ 'uglify' ]);\n}; \n```\n\n### 列表 21.3 在 Grunt\
  \ 使用 UglifyJS 插件\n\n### 默认任务\n\n如果您在基础配置文件中定义了多个任务，将这些任务中的一个或不同任务的组合定义为默认任务是有意义的。\n\
  \n项目越大，Grunt 的配置文件就越大；因此，批评者认为 Grunt 配置过于沉重（主要是因为通过 JavaScript 对象来定义任务的行为，并将这些对象传递给\
  \ `initConfig()` 方法）。\n\n作为 Grunt 的竞争对手，另一种工具在近年来变得越来越流行，它的配置负担要轻得多，并且采用整体的程序化方法。\n\
  \n### 21.1.2 使用 Gulp 自动化任务\n\nGrunt 的一个较年轻的替代方案被称为 Gulp ([`gulpjs.com`](http://gulpjs.com))，它也可以通过\
  \ NPM 全局安装：\n\n```\nnpm install -g gulp-cli \n```\n\n全局安装后，理想情况下应该通过以下命令将 Gulp 和一些插件作为依赖项直接添加到\
  \ `package.json` 文件中：\n\n```\nnpm install --save-dev gulp\nnpm install gulp-jshint\
  \ gulp-sass gulp-concat gulp-uglify gulp-rename --save-dev \n```\n\n与 Grunt 类似，Gulp\
  \ 通过 JavaScript 配置文件进行配置，文件名为 `gulpfile.js`。例如，一个 Gulp 的配置文件如列表 21.4 所示。\n\n```\n\
  const gulp = require('gulp');\nconst concat = require('gulp-concat');\nconst uglify\
  \ = require('gulp-uglify');\nconst rename = require('gulp-rename');\ngulp.task('example',\
  \ () => {\n  return gulp.src('scripts/*.js')   // 所有 JavaScript 文件 ...\n    .pipe(concat('all.js'))\
  \         // ... 合并 ...\n    .pipe(gulp.dest('dist'))        // ... 复制到目标文件夹 ...\n\
  \    .pipe(rename('all.min.js'))     // ... 重命名文件 ...\n    .pipe(uglify())     \
  \            // ... 压缩 ...\n    .pipe(gulp.dest('dist'));       // ... 并复制压缩后的文件\n\
  });\n\ngulp.task('default', ['example']); \n```\n\n### 列表 21.4 gulpfile.js 文件的一般结构\n\
  \n在 Gulp 中，可以使用 `task()` 方法定义单个任务，在该方法传递任务名称和一个包含任务逻辑的函数。可以使用 `pipe()` 方法按顺序连接任务的各个步骤。其结果比\
  \ Grunt 中类似的配置可读性高得多。\n\n示例中定义的任务可以通过 `gulp example` 命令调用，或者（因为该任务也被定义为默认任务）通过 `gulp`\
  \ 命令调用。\n\n## 21.2 源代码的自动化测试\n\n创建的源代码越多，或者源代码越复杂，验证源代码是否按预期执行就越困难且越昂贵。自动化测试，特别是所谓的单元测试，可以帮助您自动执行源代码并制定被测试代码应该满足的某些标准。\n\
  \n### 21.2.1 自动化测试的原理\n\n图 21.1 概述了自动化测试的原理。其核心思想是您编写特定的程序（测试程序或单元测试）来调用被测试的代码并检查代码的结果。\n\
  \n被测试的代码可以是单个函数（如图所示），也可以是各种函数或不同类和对象的组合。通常情况下，我们也会谈论“被测试类”或更泛指的“被测试系统”。单元测试中的检查也被称为断言（assertions）。一个单元测试通常还包含多个测试用例。\n\
  \n![单元测试的原理](img/img-f21.1)\n\n图 21.1 单元测试的原理\n\n假设您实现了一个 `add()` 函数，它的作用是相加两个数字并返回结果。那么单元测试将如图\
  \ 21.2 所示调用该函数（参数为 5 和 6），并检查实际结果是否与预期结果。如果匹配，则测试成功；否则失败。\n\n现在，为什么要写单元测试呢？为什么要费力编写额外的代码来检查您的其他（即正确的）源代码呢？有几个原因。首先，您使用测试来确保对代码的更改不会产生任何意外的副作用，因为如果发生了副作用，相应的测试将失败。其次，编写单元测试让您更通地思考代码的结构，因为您会自动注意编写简单且易测试的代码。这反过来通常具有良好的副作用，使其他人更容易使用和理解代码。\n\
  \n![测试加法函数](img/img-f21.2)\n\n图 21.2 测试加法函数\n\n### 21.2.2 测试驱动开发的原理\n\n当您将自动化测试的原理整合到开发工作流中，这被称为测试驱动开发（TDD）。这里的基本概念是一种迭代方法：在开始实现新组件（例如函数）之前，您首先定义单元测试，并确定新组件必须满足的要求。因此，您在\
  \ TDD 中遵循以下步骤（参见图 21.3）：\n\n1.  编写测试\n\n    在开始实现新组件之前，您先在单元测试中使用断言来定义待实现组件的要求。\n\
  \n2.  运行测试\n\n\n\n\n接下来，你运行一个最初会失败的测试（因为你还没有实现所需的功能）。\n\n### 3. 实现组件\n\n在这一步中，你实现组件，目标是满足测试的要求，以便在重新运行后通过测试。\n\
  \n### 4. 再次运行测试\n\n现在，你通过重新运行测试来验证是否正确实现了要求。只有当测试成功时，你才进入下一步。反，如果测试失败，你必须相应地调整组件，然后开始新的测试运行。\n\
  \n### 5. 优化组件\n\n在迭代的下一步，你现在可以优化组件（这也被称为重构）。通过重新运行测试，你可以始终确保优化不会影响实际功能。\n\n这一系列步骤被称为“红-绿-重构”（red-green-refactor），因为在许多工具中，失败的测试标记为红色，而成功的测试被标记为绿色。\n\
  \n![测试驱动开发工作流](img/img-f21.3.html)\n\n**图 21.3** 测试驱动开发工作流\n\n#### 模块、单元、组件\n\n\
  顺便提一下，在测试语境下，模块、单元和组件这些术语经常被同义使用。因此，我们也会提到模块测试、单元测试或组件测试。\n\n在接下来的章节中，我们将介绍两个具有代表性的工具：QUnit，它最适合测试依赖\
  \ DOM 的 JavaScript 测试（即测试客户端代码）；以及 mocha，我们推荐用它测试 Node.js 模块（即服务器端代码）。但基本上，使用这两个工具都可以测试客户端和服务器端代码。无论如何，独立于运行环境的\
  \ JavaScript 代码在两个框架下都能得到同样良好的测试。\n\n### 21.2.3 使用 QUnit 对源代码进行自动化测试\n\nQUnit ([`qunitjs.com`](http://qunitjs.com))\
  \ 最初由 John Resig 作为 jQuery 库的一部分开发，主要目标是测试 jQuery 的内部代码。随后在 2008 年，它变成了一个独立项目——仍然与\
  \ jQuery 紧密耦合，但至少从那时起，就可以测试基于 jQuery 库的自定义代码了。一年后的 2009 年，对 jQuery 的依赖被完全解决，因此今天\
  \ QUnit 可以用于测试任何 JavaScript 代码。\n\n#### 安装 QUnit\n\n除了之外，QUnit 可以通过 NPM 安装（`npm\
  \ install qunit`），这确保了 QUnit 下载所需的 JavaScript 和 CSS 文件，并将其作为依赖项添加到相应的项目中。或者，你也可以从网站手动下载这些文件。基本上，你需要两个文件：包含\
  \ QUnit 源代码的 JavaScript 文件和一个用于格式化测试结果的 CSS 文件。\n\n#### 编写测试\n\n让我们通过一个具体的示例来演示\
  \ QUnit：要实现 `MathFunctions.compare()` 函数。它应该比较两个数并返回三个返回值之一：如果第一个数大于第二个数，返回值 `1`；如果第一个数小于第二个数，返回值\
  \ `-1`；如果两个数相等，返回值 `0`。\n\n首先，你需要运行 QUnit 测试的容器：一个 HTML 文件（后文称为测试运行器文件），如 列表 21.5\
  \ 所示。测试本身通常在单独的 JavaScript 测试文件中编写，然后单独包含在该测试运行器文件中。测试运行器文件应两个 `<div>` 元素：ID 为 `qunit`\
  \ 的元素代表测试报告的容器，ID 为 `qunit-fixture` 的元素代表所谓的测试固件（test fixture）的容器。后者用于测试网页 DOM 的测试中，以提供待测试的\
  \ DOM 代码。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>QUnit example</title>\n  <link rel=\"stylesheet\" href=\"https://code.jquery.com/qunit/qunit-2.16.0.css\"\
  >\n</head>\n<body>\n  <div id=\"qunit\"></div>\n  <div id=\"qunit-fixture\"></div>\n\
  \  <script src=\"https://code.jquery.com/qunit/qunit-2.16.0.js\"></script>\n  <script\
  \ src=\"src/MathFunctions.js\"></script>\n  <script src=\"test/MathFunctionsTest.js\"\
  ></script>\n</body>\n</html>\n```\n\n**列表 21.5** testrunner.html 文件\n\n遵循 TDD 方法论，你做的下一件事是编写测试——即\
  \ `MathFunctionsTest.js` 文件的内容（参见 列表 21.6）。QUnit 中的每个测试用例都通过调用 `test()` 方法来定义。第一个参数以字符串的形式描述测试的意图。你在这里输入的文本应该尽可能有意义且无歧义，因为它将在稍后用于结果的展示。\n\
  \n作为 `test()` 的第二个参数，你通过回调函数指定测试的实际内容和测试步骤。在这个函数内部，你构建了各个断言（assertions）。\n\n在示例中，现在在三个测试用例中对\
  \ `MathFunctions.compare()` 函数提出了了三个不同的要求：\n\n*   如果两个数中的第一个较大，函数应该返回值 `1`。\n* \
  \  如果两个数中的第一个较小，函数应该返回值 `-1`。\n*   如果两个数相等，函数应该返回值 `0`。\n\n为了确保这一点，每个测试用例都使用了断言方法\
  \ `equal()`，该方法在回调函数中通过 `assert` 对象可用。第一个参数代表实际结果，而第二个参数是预期结果。第三个参数也可以通过字符串进一步影响结果的显示。\n\
  \n```javascript\n'use strict';\n// 1\\. Test case\nQUnit.test('MathFunctions.compare()\
  \ should return 1 if the first number is \ngreater.', (assert) => {\n  const number1\
  \ = 7;\n  const number2 = 5;\n  const result = MathFunctions.compare(number1, number2);\n\
  \  assert.equal(\n    result,                // actual result\n    1,          \
  \           // expected result\n    '7 is greater than 5'  // additional message\n\
  \  );\n});\n// 2\\. Test case\nQUnit.test('MathFunctions.compare() should return\
  \ -1 if the first number \nis smaller.', (assert) => {\n  const number1 = 5;\n \
  \ const number2 = 7;\n  const result = MathFunctions.compare(number1, number2);\n\
  \  assert.equal(\n    result,               // actual result\n    -1,          \
  \         // expected result\n    '5 is smaller than 7' // additional message\n\
  \  );\n});\n// 3\\. Test case\nQUnit.test('MathFunctions.compare() should return\
  \ 0 if both numbers are equal.', (assert) => {\n  const number1 = 5;\n  const number2\
  \ = 5;\n  const result = MathFunctions.compare(number1, number2);\n  assert.equal(\n\
  \    result,               // actual result\n    0,                    // expected\
  \ result\n    '5 is equal to 5'     // additional message\n  );\n}); \n```\n\n**列表\
  \ 21.6** 使用 QUnit 的简单单元测试\n\n除了 `equal()` 之外，QUnit 还提供了其他断言，其概览如 表 21.2 所示。\n\n\
  | 断言 | 含义 |\n| --- | --- |\n| `ok()` | 检查传递的值为 `true` |\n| `equal()` | 检查两个传递的值是否相等\
  \ (`==`) |\n\n\n\n\n\n| `notEqual()` | 检查传入的两个值是否不等 (`!=`) |\n| `strictEqual()`\
  \ | 检查传入的两个值是否严格相等 (`===`) |\n| `notStrictEqual()` | 检查传入的两个值是否严格不相等 (`!==`) |\n\
  | `deepEqual()` | 递归检查相等性 |\n| `notDeepEqual()` | 递归检查不相等 |\n| `propEqual()` | 对对象的（直接）属性进行严格类型和值的比较以判断相等\
  \ |\n| `notPropEqual()` | 对对象的（直接）属性进行严格类型和值的比较以判断不相等 |\n| `throws()` | 检查函数是否抛出错误\
  \ |\n\n**表 21.2 QUnit 断言概述**\n\n### 运行测试\n\n如果你此时在浏览器中打开测试运行器文件，你会发现测试将失败（参见图 21.4）。这是合乎逻辑的，因为目前还没有\
  \ `MathFunctions` 对象，更不用说 `compare()` 方法了。但正如你将在下一步中看到的，两者都可以快速实现。\n\n![QUnit 中的失败测试](img/img-f21.4.html)\n\
  \n**图 21.4 QUnit 中的失败测试**\n\n### 实现组件并再次运行测试\n\n`MathFunctions.compare()` 函数的功能实现相对简单，如列表\
  \ 21.7 所示。在函数内部，对传入的两个值进行比较并返回相应的结果。\n\n```\nconst MathFunctions = {\n  compare(number1,\
  \ number2) {\n    if(number1 > number2) {\n      return 1;\n    } else if(number2\
  \ > number1) {\n      return -1;\n    } else {\n      return 0;\n    }\n  }\n} \n\
  ```\n\n**列表 21.7 用于比较两个数字的简单函数**\n\n现在当你再次加载测试运行器文件时，测试应该是成功的，结果应该与图 21.5 所示的截图一致。\n\
  \n![QUnit 中的通过测试](img/img-f21.5.html)\n\n**图 21.5 QUnit 中的通过测试**\n\n### 编写另一个测试\n\
  \n我们现在可以考虑添加另一个测试，定义要求：只能向 `compare()` 方法传递数值；否则该方法应该抛出 `TypeError`。\n\n为了检查是否抛出了错误，QUnit\
  \ 提供了 `throws()` 方法，该方法也可以在 `assert` 对象上调用，如列表 21.8 所示。该方法的第一个参数接收一个要执行的函数，第二个参数是预期的错误，第三个参数可选的，用于结果显示的字符串。\n\
  \n```\nQUnit.test(\n  'MathFunctions.compare() is supposed to throw an error if\
  \ no numbers \n  were passed.', \n  (assert) => {\n    const number1 = \"5\";\n\
  \    const number2 = \"5\";\n    assert.throws(\n      () => MathFunctions.compare(number1,\
  \ number2),\n      new TypeError('Only numbers allowed.'),\n      'Strings are not\
  \ accepted.'\n    );\n  }\n); \n```\n\n**列表 21.8 此测试期望一个错误**\n\n如果你现在运行此测试（同你已经知道的测试一起），它将失败（参见图\
  \ 21.6），因为 `compare()` 方法的实现还没有检查参数的类型，也没有抛出错误。\n\n![新测试失败了](img/img-f21.6.html)\n\
  \n**图 21.6 新测试失败**\n\n因此，下一步将相应地调整实现，并仅接受数值作为参数。\n\n列表 21.9 包含了此此的代码：只要两个参数中有一个不是\
  \ `number` 类型，函数就会抛出 `TypeError`。如果你现在再次运行测试，它将不再失败了（参见图 21.7）。\n\n```\nconst MathFunctions\
  \ = {\n  compare(number1, number2) {\n    if(\n      typeof number1 !== 'number'\
  \ ||\n     typeof number2 !== 'number'\n    ) {\n      throw new TypeError('Only\
  \ numbers allowed.');\n    } else {\n      if(number1 > number2) {\n        return\
  \ 1;\n      } else if(number2 > number1) {\n        return -1;\n      } else {\n\
  \        return 0;\n      }\n    }\n  }\n} \n```\n\n**列表 21.9 调整后的实现现在抛出错误**\n\n\
  ![调整后测试现在成功了](img/img-f21.7.html)\n\n**图 21.7 调整后测试现在成功了**\n\n正如你所见，单元测试允许你逐步完善实现并添加特定需求。对于前面的示例，可以想象添加适当的测试来确保恰好传递了两个参数。通过始终运行组件的所有测试，你可以确保在实现新需求时，不会引起任何副作用（可以说，在代码中重新引入了\
  \ Bug），这些副作用会阻止你满足其他需求。\n\n### 21.2.4 使用 mocha 对源码进行自动化测试\n\n另一个可以独立于所用运行环境使用的测试框架是\
  \ mocha ([`mochajs.org`](http://mochajs.org))。如果你想在浏览器中使用 mocha，可以按照类似于使用 QUnit\
  \ 的方式进行：创建一个 HTML 测试运行器文件，并包含来自 mocha 库的 JavaScript 和 CSS 文件，以及相应的单元测试（更多信息请参见 [`mochajs.org/#browser-support`](http://mochajs.org/#browser-support)）。\n\
  \n但在接下来的章节中，我们将向你展示如何在命令行中使用 mocha。要做到这一点，你需要通过 `sudo npm install -g mocha` 命令全局安装\
  \ mocha 包（在 Windows 上不需要 `sudo`），这将使用户可以使用可以使用 `mocha` 命令。\n\n#### 编写测试\n\nmocha\
  \ 单元测试的依据是 `describe()` 函数，它可以用于启动一组测试，如列表 21.10 所示。第一个参数表示组的名称；第二个参数定义了一个包含实际测试或额外\
  \ `describe()` 调用的函数——即测试子集。\n\n你使用 `it()` 函数定义单个测试用例。第一个参数是测试的描述，第二个参数是包含实际测试过程的回调函数。\n\
  \n默认情况下，断言库是 `assert` 包，它已经是 Node.js 的一部分，因此不需要单独安装。\n\n\n\n\n\n```javascript\n\
  'use strict';\nconst MathFunctions = require('../src/MathFunctions')\nconst assert\
  \ = require('assert');\ndescribe('MathFunctions', () => {\n  describe('#compare()',\
  \ () => {\n    // 1\\. 测试用例\n    it('should return 0, if both numbers are equal.',\
  \ () => {\n      const number1 = 7;\n      const number2 = 5;\n      const result\
  \ = MathFunctions.compare(number1, number2);\n      assert.equal(\n        result,\
  \                // 实际结果\n        1,                     // 预期结果\n        '7 is\
  \ greater than 5'  // 额外的消息\n      );\n    });\n    // 2\\. 测试用例\n    it('should\
  \ return -1, if the first number is smaller.', () => {\n      const number1 = 5;\n\
  \      const number2 = 7;\n      const result = MathFunctions.compare(number1, number2);\n\
  \      assert.equal(\n        result,                // 实际结果\n        -1,      \
  \              // 预期结果\n        '5 is smaller than 7'  // 额外的消息\n      );\n    });\n\
  \    // 3\\. 测试用例\n    it('should return 0, if both numbers are equal.', () =>{\n\
  \      const number1 = 5;\n      const number2 = 5;\n      const result = MathFunctions.compare(number1,\
  \ number2);\n      assert.equal(\n        result,                // 实际结果\n     \
  \   0,                     // 预期结果\n        '5 is equal to 5'      // 额外的消息\n  \
  \    );\n    });\n    // 4\\. 测试用例\n    it('should throw an error if no numbers\
  \ were passed.', () => {\n      const number1 = '5';\n      const number2 = '5';\n\
  \      assert.throws(\n        () => {\n          MathFunctions.compare(number1,\
  \ number2)\n        },\n        TypeError              // 预期的错误类型\n      );\n  \
  \  });\n  });\n}); \n```\n\n**列表 21.10** 在 mocha 中对 `MathFunctions` 对象的单元测试\n\n\
  为了能够通过 `require()` 包含 `MathFunctions` 对象，必须将其转换为 CommonJS 模块，如 列表 21.11 所示。\n\n\
  ```javascript\nconst MathFunctions = {\n  compare(number1, number2) {\n    if(\n\
  \      typeof number1 !== 'number' ||\n      typeof number2 !== 'number'\n    )\
  \ {\n      throw new TypeError('Only numbers allowed.');\n    } else {\n      if(number1\
  \ > number2) {\n        return 1;\n      } else if(number2 > number1) {\n      \
  \  return -1;\n      } else {\n        return 0;\n      }\n    }\n  }\n}\nmodule.exports\
  \ = MathFunctions; \n```\n\n**列表 21.11** 适配于 CommonJS 的 `MathFunctions` 对象\n\n###\
  \ 运行测试\n\n可以通过 `mocha` 命令启动单元测试的执行。如果你不使用任何特殊参数，mocha 默认会在名为 `test` 的目录中搜索它们，并执行其中包含的所有测试。或者，你可以指定具体的路径或模式，例如\
  \ `mocha test/MathFunctionsTest.js` 或 `mocha test/**/*Test.js`，以专门运行单个测试或一组测试。\n\
  \n在命令行使用 mocha 时，支持几种类型的所谓的报告器（reporters）；这些报告器影响测试结果的格式。你可以在 表 21.3 中查看不同报告器的概述。可以通过\
  \ `-R` 参数定义报告器，如下所示：\n\n```\nmocha -R spec \n```\n\n此处指定的 `spec` 报告器会在命令行清晰地输出测试结果，见\
  \ 列表 21.12。\n\n```\nMathFunctions\n    compare()\n       should return 0, if both\
  \ numbers are equal.\n       should return -1, if the first number is smaller.\n\
  \       should return 0, if both numbers are equal.\n       should throw an error\
  \ if no numbers were passed. \n  (4ms)\n```\n\n**列表 21.12** 报告器的输出\n\n| 报告器 | 描述\
  \ |\n| --- | --- |\n| `dot` | 最小化输出，在命令行中以点的形式输出。 |\n| `spec` | 类似于规范的输出。 |\n| `TAP`\
  \ | Test Anything Protocol (TAP) 格式，参见 [`en.wikipedia.org/wiki/Anything_Protocol`](http://en.wikipedia.org/wiki/Anything_Protocol)。\
  \ |\n| `list` | 类似于 `spec`，但以列表形式。 |\n| `json` | JSON 格式输出。 |\n| `json-cov` | JSON\
  \ 格式，包含关于测试覆盖的信息。 |\n| `html-cov` | HTML 格式，包含关于测试覆盖的信息。 |\n| `min` | 最小化输出，仅包含测试的总结果。\
  \ |\n| `doc` | 文档输出，在 `<section>` 元素中嵌套测试。 |\n| `html` | 在浏览器中执行测试时自动使用的报告器，因为默认没有特定的\
  \ JavaScript 对象如 `document`。 |\n\n**表 21.3** 可用报告器选择\n\n## 21.3 代码管理\n\n为了结束本章以及本书，我们将对代码管理主题提供一个简短且凑的介绍。虽然关于这个主题可以写一整本书，但这里的目标是尽可能简洁地为你提供最重要的事实。\n\
  \n### 21.3.1 代码管理简介\n\n早晚，你必须考虑如何存储你的源代码以确保你有一份备份，并且如果你与多个开发者一起工作，如何让代码保持同步。简而言之，你需要担心代码管理。然而，这并不意味着你必须重新发明轮子：有各种所谓的版本管理系统（或版本控制系统\
  \ [VCS]）可以满足上述需求。\n\n版本控制系统用于记录软件代码随时间推移的变化。这样做的好处是：如果你想访问旧的代码状态，可以通过 VCS 轻松地做到。此外，文件的更改可以被追踪并恢复到旧状态。版本控制系统在团队协作中是不可或缺的。\n\
  \n在版本控制系统的背景下，对两种方法进行了基本区分：集中式 VCS 和去中心化 VCS。集中式 VCS 在很一段时间内一直是专业软件开发的标准。示例包括 CVS\
  \ 和 Subversion。集中式 VCS 的理念是软件项目的所有版本文件都管理在中央服务器的所谓仓库中，然后开发团队的每个开发者都可以访问它。作为开发者，你从自己的计算机上检索（通过相应的命令）想要处理的文件，进行编辑或添加新文件，然后再次（通过相应的命令）与中央服务器同步。图\
  \ 21.8 描述了这一过程。\n\n![集中式版本控制系统的原理](img/klein21_008.png)](img-f21.8.html)\n\n\n\n\
  \n\n## 图 21.8 集中版本控制系统的原理\n\n集中式版本控制系统（VCS）的缺点是，存储仓库的相应服务器必须始终可用，以便你将自己的更改上传到系统，或从其他开发者那里下载更新到自己的计算机。如果服务器不可用，开发者就会遇到麻烦。如果服务器或存储所有数据的硬盘崩溃，情况会更加糟糕。这时，数据历史将无法挽回地丢失——除非你提前做了备份，而通常情况下并非如此。在这种情况下，剩下的只有开发者计算机上数据的当前状态。\n\
  \n去中心化或分布式版本控制系统解决的正是这两个问题，例如 Mercurial ([www.mercurial-scm.org](http://www.mercurial-scm.org))\
  \ 或 Git ([`git-scm.com`](https://git-scm.com))，它们被广泛使用并在后续章节中进行了描述。去中心化 VCS 与集中式\
  \ VCS 的区别在于，单个开发者在其机器上不再仅拥有数据的最新版本；每个人在所谓的本地仓库中都拥有整个仓库的完整副本（参见图 21.9）。\n\n第一个优点：在这样的本地仓库中，开发者可以在不连接服务器的情况下“上传”数据更改，并在稍后（再次连接时）将本地仓库与远程仓库同步。\n\
  \n第二个优点：如果服务器发生任何损坏导致（集中的）远程仓库中的数据丢失，则可以从任何开发者的计算机上完全恢复——包括整个历史（前提是该计算机是最新的）。此外，开发者即使在没有服务器的情况下相互同步仓库，这与集中式\
  \ VCS 相比在工作流方面开启了一系列完全不同的可能性。\n\n![去中心化版本控制系统的原理](img/img-f21.9.html)\n\n**图 21.9**\
  \ 去中心化版本控制系统的原理\n\n`Git` 存储仓库数据信息的方式与大多数其他版本控制系统（无论是集中式的还是去中心化的）有根本不同。在大多数其他 VCS\
  \ 中，所有信息都存储为从文件第一个版本到上一个版本的更改列表（即所谓的增量；参见图 21.10），而 `Git` 在每次 `commit` 时（这在 `Git`\
  \ 中也称为“保存”）存储相应仓库所有文件的完整状态。\n\n因此，`Git` 为每个 `commit` 捕取整个仓库的镜像（快照）（参见图 21.11）。初看这似乎浪费内存，但实际上节省了大量的内存。例如，对于未更改的文件不会创建新副本，而仅创建快捷方式。\n\
  \n![在大多数版本控制系统中，每个版本只存储相应的更改](img/img-f21.10.html)\n\n**图 21.10** 在大多数版本控制系统中，每个版本只存储相应的更改\n\
  \n![在 Git 中，每个版本存储所有文件](img/img-f21.11.html)\n\n**图 21.11** 在 Git 中，每个版本存储所有文件\n\
  \n`Git` 与其他 VCS 的另一个区别是用于存储数据的地点数量。在大多数其他 VCS 中，有两个地方：本地工作副本（工作目录）——即你作为开发者当前正在使用的数据——以及仓库——即已经提交的数据。\n\
  \n但在 `Git` 中，除了这两个地方，还有另一个区域，称为暂存区（也称为索引；参见图 21.12）。\n\n![Git 版本控制中的不同区域](img/img-f21.12.html)\n\
  \n**图 21.12** Git 版本控制中的不同区域\n\n这是你专门编译对工作副本所做的更改并想要传输或提交（`commit`）到仓库的更改的地方。这第三部分以及与工作目录与仓库之间相关的解耦的优势是，你在编译\
  \ `commit` 时会灵活得多。\n\n### Git 与 GitHub\n\n顺便提一下，`Git` 等同于 `GitHub` ([`github.com`](https://github.com))。后者“仅仅”是一个使用\
  \ `Git` 的在线服务，可以在其上管理 `Git` 仓库。许多开源项目现在可以在 `GitHub` 上获得（你无疑已经在整本书中注意到了）。\n\n###\
  \ 21.3.2 安装和配置 Git 版本控制系统\n\n`Git` 的安装相对简单，无论使用什么操作系统。在 Linux 上，取决于发行版，你使用 `yum`\
  \ 或 `apt-get`——也就是说，使用以下用于 `yum` 命令：\n\n```\n$ sudo yum install git \n```\n\n或者用于\
  \ `apt-get` 的以下命令：\n\n```\n$ sudo apt-get install git \n```\n\n对于 Windows 和 macOS，可以从\
  \ `Git` 网站下载相应的安装文件。启动的安装程序应该是自而易懂的。\n\n安装 `Git` 后，你可以通过 `git` 命令使用 VCS。首先，你应该使用\
  \ `git config` 命令配置默认与你所做的每个 `commit` 关联的用户名和电子邮件地址（如果需要，两者也可以在以后按项目或按仓库进行设置）：\n\
  \n```\n$ git config --global user.name \"John Doe\"\n$ git config --global user.email\
  \ \"john.doe@javascripthandbuch.de\" \n```\n\n安装和配置后的第一步是创建一个新的 `Git` 仓库。你不仅这样做一次，而是对每个想要用\
  \ `Git` 进行版本控制的项目都要这样做。创建新的本地 `Git` 仓库基本上有两种方法。一方面，你可以在你自己的计算机上初始化一个目录作为 `Git` 仓库；另一方面，你可以从另一台计算机（或服务器）下载或克隆（clone）一个现有仓库到自己的计算机上（参见图\
  \ 21.13）。\n\n![创建新本地仓库的不同方法](img/img-f21.13.html)\n\n**图 21.13** 创建新本地仓库的不同方法\n\n\
  如果你想在 `Git` 中创建一个任何服务器上还没有的全新项目，则选择前者。如果你是一个加入已经通过远程仓库管理项目的的新开发者，后者就会派上用场。\n\n###\
  \ 21.3.3 创建新的本地仓库\n\n要将本地目录初始化为 `Git` 仓库，你必须运行 `git init` 命令：\n\n```\n$ mkdir example-project\n\
  $ cd example-project\n$ git init\nInitialized empty Git repository in /example-project/.git/\
  \ \n```\n\n这会在相应的项目文件夹（此处为 example-project）中后台创建 `.git` 目录。`Git` 随后会在该目录中存储关于仓库的所有信息（例如，相应仓库中文件和目录的历史；参见图\
  \ 21.14）。\n\n![.git 文件夹包含关于仓库的所有信息](img/img-f21.14.html)\n\n**图 21.14** .git 文件夹包含关于仓库的所有信息\n\
  \n### 21.3.4 克隆现有仓库\n\n\n\n\n要从服务器在你的本地机器上创建一个现有仓库的副本，你应该使用 `git clone` 命令。该命令将整个远程仓库的所有数据（包括所有版本，即数据的完整历史记录）传输到你的计算机上。例如，要从\
  \ GitHub ([`github.com/jquery/jquery`](https://github.com/jquery/jquery)) 上克隆 jQuery\
  \ 库的源代码，你必须使用以下命令：\n\n```\ngit clone git://github.com/jquery/jquery.git \n```\n\n\
  输出结果类似于下所示：\n\n```\nCloning into 'jquery'...\nremote: Counting objects: 41130, done.\n\
  remote: Total 41130 (delta 0), reused 0 (delta 0), pack-reused 41130\nReceiving\
  \ objects: 100% (41130/41130), 24.45 MiB | 1.50 MiB/s, done.\nResolving deltas:\
  \ 100% (29238/29238), done.\nChecking connectivity... done \n```\n\n### 21.3.5 将更改到暂存区\n\
  \n`git init` 命令仅用于将相应的目录初始化为 Git 仓库。该目录下可能存在的任何文件和子目录都不会被此命令自动添加到仓库中，而是首先位于前述提到的工作区中。因此，要将它们添加到仓库，你必须先将它们传输到暂存区，然后传输到仓库。\n\
  \n前一个操作——将文件添加到暂存区（参见图 21.15），是通过 `git add` 命令实现的：\n\n```\n$ git add *.js\n$ git\
  \ add **/*.js\n$ git add package.json \n```\n\n![git add 命令用于将更改添加到暂存区](img/img-f21.15.html)\n\
  \n**图 21.15** git add 命令用于将更改添加到暂存区（staging area）\n\n### 21.3.6 将更改传输到本地仓库\n\n一旦你将所有要包含在提交中的文件添加到暂存区，就可以使用\
  \ `git commit` 命令将它们提交到本地仓库（同样参见图 21.16）：\n\n```\n$ git commit -m \"Initial commit\"\
  \ \n```\n\n输出如下例所示：\n\n```\n[master (root-commit) 671cbc4] Initial commit\n4 files\
  \ changed, 14 insertions(+)\ncreate mode 100644 index.js\ncreate mode 100644 lib/examples.js\n\
  create mode 100644 package.json\ncreate mode 100644 tests/examples-tests.js \n```\n\
  \n![git commit 命令用于将更改从暂存区提交到本地仓库](img/img-f21.16.html)\n\n**图 21.16** git commit\
  \ 命令用于将更改从暂存区提交到本地仓库\n\n这种从工作区到暂存区再到本地仓库的两步数据传输，使得能够特意地将不同文件的更改合并到一次提交中，并作为一个包传输到仓库中。如果你随后选择了有意义的提交信息（如前面的示例所示，通过\
  \ `-m` 参数传递给 `git commit` 命令），这将产生非常清晰的更改历史。\n\n一旦提交，文件就位于本地仓库中，但工作目录不再包含任何更改。可以使用\
  \ `git status` 命令进行检查，该命令可以随时检索有关仓库的有用状态信息。当你现在调用该命令时，输出应如下：\n\n```\n$ git status\n\
  # On branch master\nnothing to commit, working directory clean \n```\n\n换句话说，工作区现在不包含任何可以提交的更改。\n\
  \n### 21.3.7 Git 中的不同状态\n\n文件在 Git 中可以处于几种状态之一：未跟踪（untracked 或未版本化）意味着文件尚未被版本控制系统考虑；已修改（modified\
  \ 或已编辑）意味着该文件自上次提交以来已被修改；未修改（unmodified 或未编辑）意味着自上次提交以来未被修改；已暂存（staged）意味着已修改的文件已安排在下一次提交中（参见图\
  \ 21.17）。\n\n![Git 版本控制中文件的不同状态](img/img-f21.17.html)\n\n**图 21.17** Git 版本控制中文件的不同状态\n\
  \n\n\n\n如果你在团队中工作，通常情况下会在将自己的更改（或提交）推送到远程仓库之前，会先将其他开发者的更改从远程仓库传输到自己的计算机或本地仓库。这是通过使用\
  \ `git fetch` 命令实现的，并将远程仓库的名称作为参数传递（参见图 21.19）：\n\n```\n$ git fetch origin \n```\n\
  \n![The git fetch Command Is Used to Commit Changes from a Remote Repository to\
  \ the Local Repository](img/img-f21.19.html)\n\n**图 21.19** git fetch 命令用于将更改从远程仓库提交到本地仓库\n\
  \n这意味着远程仓库中所有尚未进入本地仓库的提交都将传输到那里，即所谓的“远程分支”，这些分支是与主开发分支（通常是 master 分支）并行存在的开发分支。通过这种方式，你可以在随后将更改合并到自己的\
  \ master 分支之前，有机会审查相应的更改。后者通过 `git merge` 命令完成，该命令将远程分支的名称作为参数传递：\n\n```\n$ git\
  \ merge origin/master \n```\n\n在这里可能会发生其他开发者的更改与你的更改发生冲突。这些冲突随后可以通过命令行、编辑器或每个情况下使用的开发环境手动解决。作为\
  \ `git fetch` 后接 `git merge` 组合的替代方案，你也可以使用 `git pull` 命令，它会隐式地顺序执行这两个步骤。\n\n###\
  \ 21.3.10 在新分支上工作\n\n使用 Git 的一个核心部分是前面提到的分支功能。这些开发分支允许你独立于主开发分支开发新功能或修复 bug。默认情况下，你在\
  \ master 分支上工作（由 `git init` 命令默认创建）。\n\n可以使用 `git branch` 命令列出仓库的所有分支——在示例中只列出了\
  \ master 分支：\n\n```\n$ git branch\n* master \n```\n\n另一方面，可以使用 `git branch <branch>`\
  \ 命令创建新分支，其中 `<branch>` 是新分支的名称：\n\n```\n$ git branch feature-xyz\n$ git branch\n\
  feature-xyz\n* master \n```\n\n分支是 Git 开发过程中重要的组件。例如，如果你想添加新功能或修复 bug，通常会创建一个新分支，以封装来自主开发分支源代码的相关更改。通过这种方式，你可以确保不稳定的代码不会直接传输到主开发分支。\n\
  \n图 21.20 展示了这种策略。除了 master 分支外，这里还可以看到两个隔离开发线：一个是一个特性分支，另一个是修复分支。\n\n要切换分支，可以使用\
  \ `git checkout <branch>` 命令，其中 `<branch>`再次代表你想切换的分支名称。例如，要切换到刚刚创建的 `feature-xyz`\
  \ 分支，你应该输入以下命令：\n\n```\n$ git checkout feature-xyz \n```\n\n之后你将收到消息 `Switched to\
  \ branch 'feature-xyz'`。你也可以随时使用 `git branch` 命令检查自己是否处于新分支：在随后的输出中，活动分支用 `*` 符号标记：\n\
  \n```\n$ git branch\n* feature-xyz\nmaster \n```\n\n![Different Branches Enable\
  \ You to Develop Individual Features or Bug Fixes in Isolation from the Main Development\
  \ Branch](img/img-f21.20.html)\n\n**图 21.20** 不同的分支允许你独立于主开发分支开发各个功能或修复 bug\n\n\
  ### 21.3.11 从分支采纳更改\n\n一旦你在相应分支中完成了新功能的开发或 bug 修复，并想要将相关更改合并到主开发分支，你必须先切换到想要合并更改的分支，然后使用\
  \ `git merge` 命令（参见图 21.21）：\n\n```\n$ git checkout master\n$ git merge feature-xyz\n\
  Merge made by the 'recursive' strategy.\n lib/examples.js | 2 ++\n 1 file changed,\
  \ 2 insertions(+) \n```\n\n![The git merge Command Can Be Used to Transfer the Changes\
  \ from One Branch to Another](img/img-f21.21.html)\n\n**图 21.21** git merge 命令可将更改从一个分支传输到另一个分支\n\
  \n在出现的命令行对话框中，你可以自定义提交信息（默认情况下，此信息为 `Merge branch <branch>`，其中 `<branch>` 代表分支名称）。\n\
  \n### 21.3.12 重要命令和术语概述\n\n图 21.22 总结了使用 Git 最重要的命令，并显示了它们与各个 Git 区域的连接。\n\n![The\
  \ Areas of Git and the Different Commands](img/img-f21.22.html)\n\n**图 21.22** Git\
  \ 区域与不同的命令\n\n表 21.4 包含了常用命令的详细概述，使用 Git 的重要术语列在表 21.5 中。\n\n| 命令 | 说明 |\n| ---\
  \ | --- |\n| 创建仓库 | |\n| `git init` | 初始化一个新的 Git 仓库 |\n| `git clone ssh://<username>@<domain>/<repositoryname>.git`\
  \ | 根据 URL 克隆现有仓库 |\n| `git clone git@github.com:<username>/<repositoryname>` |\
  \ 根据 GitHub URL 克隆现有仓库 |\n| 本地更改 | |\n| `git status` | 输出状态信息 |\n| `git diff` |\
  \ 显示版本文件的更改 |\n| `git add .` | 将所有本地更改添加到下一次提交 |\n| `git add -p FILE` | 将文件的更改添加到下一次提交\
  \ |\n| `git commit -a` | 提交所有已跟踪更改 |\n| `git commit -m \"Update\"` | 提交暂区的更改 |\n\
  | `git commit --amend` | 修改最后提交（注意：不要修改已上传到远程仓库的提交） |\n| 提交历史 | |\n| `git log` |\
  \ 输出所有提交，从最近一次开始 |\n| `git log -p <file>` | 输出文件的所有提交，从最近一次开始 |\n| `git blame <file>`\
  \ | 输出谁在何时对文件做了什么更改 |\n| `git stash` | 将工作区的本地更改传输到剪贴板 |\n| `git stash pop` | 将剪贴板的本地更改传输到工作区\
  \ |\n| 分支与标签 | |\n| `git branch -av` | 列出所有分支 |\n\n\n\n\n\n| `git checkout <branch>`\
  \ | 切换到现有分支 |\n| `git branch <branch>` | 创建新的本地分支 |\n| `git checkout --track <remote>/<branch>`\
  \ | 基于远程分支创建新的本地分支 |\n| `git branch -d <branch>` | 删除本地分支 |\n| `git tag <tagname>`\
  \ |为当前提交添加标签 |\n\n### 更新与发布\n\n| `git remote -v` | 列出所有远程仓库 |\n| `git remote show\
  \ <remote>` | 显示特定远程仓库的信息 |\n| `git remote add <shortname> <url>` | 添加新的远程仓库 |\n\
  | `git fetch <remote>` | 从远程仓库下载所有更改，但不整合到 HEAD（即当前分支）中 |\n| `git pull <remote>\
  \ <branch>` | 从远程仓库下载所有更改并将它们直接整合或合并到 HEAD 中 |\n| `git push <remote> <branch>` |\
  \ 将本地更改上传到远程仓库 |\n| `git branch -dr <remote>/<branch>` | 删除远程仓库中的分支 |\n| `git push\
  \ --tags` | 将标签上传到远程仓库 |\n\n### 合并与变基\n\n| `git merge <branch>` | 将分支的更改合并到当前 HEAD\
  \ |\n| `git rebase <branch>` | 将当前 HEAD 变基到指定的分支 |\n\n### 撤销\n\n| `git reset --hard\
  \ HEAD` | 放弃工作区中所有的本地更改 |\n| `git checkout HEAD <file>` | 放弃工作区中单个文件的本地更改 |\n| `git\
  \ revert <commit>` | 撤消提交 |\n| `git reset --hard <commit>` | 将 HEAD 重置到之前的提交，并放弃之后的所有本地更改\
  \ |\n| `git reset <commit>` | 将 HEAD 重置到之前的提交，并保留之后的所有本地更改 |\n| `git reset --keep\
  \ <commit>` | 将 HEAD 重置到之前的提交，并保留之后发生且尚未提交的本地更改 |\n\n**表 21.4** Git 中最重要的命令\n\n\
  | 概念 | 含义 |\n| --- | --- |\n| Repository (仓库) | 包含（软件）项目的所有文件，包括之前的版本 |\n| Remote\
  \ repository (远程仓库) | 远程仓库 |\n| Working directory (工作目录) | 工作空间 |\n| Index/staging\
  \ area (暂存区) | 为提交到本地仓库而准备更改的区域 |\n| Commit (提交) | 将更改从暂存区传输到本地仓库 |\n| Push (推送)\
  \ | 将本地仓库的更改传输到远程仓库 |\n| Pull (拉取) | 将更改从远程仓库传输到本地仓库 |\n| Checkout (检出) | 从分支或提交检索工作副本\
  \ |\n| Clone (克隆) | 复制远程仓库 |\n| Branch (分支) | 独立的开发分支 |\n| Merge (合并) | 将一个分支的更改合并到另一个分支\
  \ |\n| Fork (分叉) | 仓库的分生版本 |\n| HEAD | 当前分支 |\n\n**表 21.5** Git 中最重要的术语\n\n## 21.4\
  \ 总结\n\n本章简要介绍了专业化开发流程的关键方面。在此背景下，我们详细讨论了三个主要方面（还有更多）。要点如下：\n\n* 对于某些重复性任务的自动化执行，你可以使用\
  \ `Grunt` 和 `Gulp` 工具。根据自动化任务的数量，`Grunt` 可能需要大量的配置工作，而 `Gulp` 由于其使用了 `Fluent API`，具有更高的可读性。\n\
  * 在测试驱动开发中，在实现新组件之前，你首先要在单元测试中使用断言来制定新组件必须完成的功能。\n* 测试驱动开发中的迭代由五个步骤组成：编写测试、运行测试、实现组件、再次运行测试以及重构组件。\n\
  * 在 `JavaScript` 中，有许多不同的单元测试框架，我们在本章介绍了其中两个：`QUnit` 特别适合测试客户端 `JavaScript`，而 `mocha`\
  \ 特别适合测试服务端 `JavaScript`。然而，这两个框架也可以用于这两种情境。\n* 你应该使用版本控制系统来管理你的源代码。一方面，这有利于团队协作；另一方面，它还提供了整个源代码的历史记录（从而提供了隐式备份）。\n\
  * 目前最流行的 VCS 可能是 `Git` —— 这是一种所谓的去中心化 VCS，每位开发者在自己的计算机上都拥有所有源代码版本的完整镜像。\n\n# A 作者\n\
