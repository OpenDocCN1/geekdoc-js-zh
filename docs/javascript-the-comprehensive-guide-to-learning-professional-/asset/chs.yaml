  \ Node.js 创建你自己的包。要这样做，你可以使用 `npm init` 命令，它通过命令行向导引导你完成步骤。列表 17.3 (#17_002.html_l17.3)\
  \ 中高亮的信息会被连续查询。向导的结果是一个名为 `package.json` 的文件（包配置文件），其内容可以在列表末尾看到。\n\n```\n此实用程序将引导你创建一个\
