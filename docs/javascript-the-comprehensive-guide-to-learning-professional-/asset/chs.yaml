  ### 12.6.3 移动元素\n\n在将待移动的元素标记为`<samp class=\"listingcharacter\">draggable</span>`之后，下一步是定义当元素移动时会发生什么。为了这个目的，在代码\
  \ 12.44 中注册了各种事件监听器。\n\n```\nconst items = document.getElementsByClassName('contact');\n\
  for (let i = 0; i < items.length; i++) {\n  const item = items[i];\n  item.addEventListener('dragstart',\
  \ (event) => {\n    event.dataTransfer.setData('text/html', event.target.outerHTML);\n\
  \  });\n}\nconst target = document.getElementById('target');\ntarget.addEventListener('dragover',\
  \ (event) => {\n  event.preventDefault();\n  return false;\n});\ntarget.addEventListener('dragenter',\
  \ (event) => {\n  event.target.classList.add('dragover');\n});\ntarget.addEventListener('dragleave',\
  \ (event) => {\n  event.target.classList.remove('dragover');\n});\ntarget.addEventListener('drop',\
  \ (event) => {\n  event.srcElement.innerHTML += event.dataTransfer.getData('text/html');\n\
  \  event.target.classList.remove('dragover');\n\n}) \n```\n\n**代码 12.44**     移动元素的拖放示例\n\
  \n\n\n\n\n首先在这里为所有可移动元素注册一个针对 `dragstart` 事件的事件监听器。在这个事件监听器中，可以通过事件对象的 `dataTransfer`\
  \ 属性获取一个 `DataTransfer` 类型的对象。这是一个容器，用于存储在拖放操作过程中应随被移动元素“一起移动”的数据。这些数据可以通过 `setData()`\
  \ 方法定义，稍后在目标对象上读取。在示例中，我们简单地使用了拖拽源的 HTML 内容（`event.target.outerHTML`）。\n\n在释放目标处，随后会在\
  \ `drop` 事件的事件监听器通过 `getData()` 方法访问这些数据，并将其添加到自定义的 HTML 中（通过 `event.srcElement.innerHTML`）。此外，还为\
  \ `dragenter` 和 `dragleave` 事件定义了事件监听器，它们会为释放目标添加或移除 `dragover` CSS 类，从而影响释放目标的外观。最终结果如图\
  \ 12.19 所示。\n\n### 传递任何数据\n\n你不一定非向 `DataTransfer` 对象中添加 HTML 数据。你可以在这里使用任何数据；例如，为了仅将缩略图的\
  \ URL 传输到 `DataTransfer` 对象，你可以编写列表 12.45 中的内容。\n\n```\nevent.dataTransfer.setData(\n\
  \  'text', \n  event.target.getElementsByClassName('contact-image')[0].src\n);\n\
  ```\n\n**列表 12.45** 定义 DataTransfer 对象的内容\n\n或者，你也可以只获取联系人的姓名、Twitter 用户名或电子邮件地址。`DataTransfer`\
  \ 对象并不一定需要包含标记为 `draggable` 的相应元素的 HTML 代码。\n\n![拖放操作后](img/img-f12.19.html)\n\n\
  **图 12.19** 拖放操作后\n\n## 12.7 任务的并行化\n\nJavaScript 是一种单线程执行的语言，这意味着多个脚本无法同时执行（参见图\
  \ 12.20）。脚本是逐行解释并执行的。\n\n此外，事件的触发以及相关事件监听器的执行并不是并行的：触发事件的代码会暂停，直到相应的事件监听器执行完毕。\n\
  \n相同的情况也适用于回调函数。例如，如果你向服务器发送一个 Ajax 请求，发送请求的脚本将继续执行，直到服务器准备好响应并发送到客户端，但一旦调用了评估服务器响应的回调函数，周围的代码就会暂停。\n\
  \n### 定义\n\n在软件开发中，线程是程序内部的执行流。单线程程序只使用单个线程。这与多线程程序形成对比，多线程程序不仅使用一个线程，而是使用多个线程，其中一个充当主线程。\n\
  \n![JavaScript 应用默认在单线程中运行](img/img-f12.20.html)\n\n**图 12.20** JavaScript 应用默认在单线程中运行\n\
  \n### 12.7.1 Web Workers 的原理\n\nWeb Worker API ([www.w3.org/TR/workers/](http://www.w3.org/TR/workers/))\
  \ 通过定义一个在 Web 应用程序中执行后台脚本的 API，抵消了脚本串行处理的局限性。通过此 API 定义的 web workers，现在可以在后台（即与主线程并行）执行某些计算密集型脚本，否则这些脚本会对比\
  \ Web 应用程序的性能产生负面影响。\n\nWeb workers 在独立的线程中执行（参见图 12.21）。因此，有必要将相应的代码也保持在单独的文件中。从主线程可以向单个\
  \ web worker 发送消息或从其接收消息。\n\n#### 注意\n\n默认情况下，JavaScript 中的任务可以异步执行，但不能并行执行。只有 web\
  \ workers 能够实现并行执行。\n\n![Web Workers 在独立的线程中执行](img/img-f12.21.html)\n\n**图 12.21**\
  \ Web Workers 在独立的线程中执行\n\n### 12.7.2 使用 Web Workers\n\n要创建一个 web worker，请使用 `Worker`\
  \ 构造函数，如列表 12.46 所示。你将由 web worker 执行的脚本名称或路径作为参数传递给它（参见列表 12.47）。\n\n要从主线程向 web\
  \ worker 发送消息，请使用 `postMessage()` 方法并将任何 JavaScript 对象作为消息传递参数。要在 web worker 侧接收消息，你必须为\
  \ `message` 事件注册相应的事件监听器（参见列表 12.47），或者定义 `onmessage` 事件处理器。要实现这一点，你通过 `self` 变量访问相应\
  \ web worker 的全局对象。\n\n反向的消息发送和接收方法相同：在 web worker 内部，你调用 `postMessage()` 方法向主线程发送消息。在主线程中，你可以在\
  \ `message` 事件的事件监听器或 `onmessage` 事件处理器中访问消息。\n\n```\n// File: main.js\nconst worker\
  \ = new Worker(\"scripts/worker.js\");\nconst message = 'Hello worker';\nconsole.log(`main\
  \ thread: Send message: ${message}`);\nworker.postMessage(message);\nworker.addEventListener('message',\
  \ (event) => {\n  console.log(`main thread: Response received from worker: ${event.data}`);\n\
  });\nworker.addEventListener('error', (event) => {\n  console.log('Error occurred');\n\
  }); \n```\n\n**列表 12.46** 主线程的内容\n\n```\n// File: worker.js\nself.addEventListener('message',\
  \ (event) => {\n  console.log(`Worker: Message received: ${event.data}`);\n  const\
  \ workerResult = 'Hello main thread';\n  console.log(`Worker: Return response: ${workerResult}`);\n\
  \  self.postMessage(workerResult);\n}); \n```\n\n**列表 12.47** Worker 的内容\n\n为了清晰起见，双向通信过程在图\
  \ 12.22 中再次展示出。\n\n![与 Web Workers 通信](img/img-f12.22.html)\n\n**图 12.22** 与 Web\
  \ Workers 通信\n\n因此，借助 web workers 的帮助，任务可以与主线程并行执行。然而，web workers 受到限制：首先，它们无法访问\
  \ DOM；其次，它们无法访问 `window` 对象。原因是：web workers 不是在浏览器窗口中执行，而是在后台执行。\n\n## 12.8 确定用户的位置\n\
  \n得益于 Geolocation API ([www.w3.org/TR/geolocation-API](http://www.w3.org/TR/geolocation-API))，可以确定用户的位置。我们将在接下来的章节中向你如何这样做。\n\
  \n### 12.8.1 获取位置信息\n\n\n\n\n\nGeolocation API 的入口点是 `navigator` 对象的 `geolocation`\
  \ 属性。为了获取用户的当前位置，`geolocation` 对象（类型为 `Geolocation`）提供了 `getCurrentPosition()` 方法。\n\
  \n由于位置是异步确定的，因此会将一个函数作为回调处理器传递给该方法，该函数会在位置确定后立即被调用。在此函数内部，可以访问各种信息，如 列表 12.48 和\
  \ 图 12.23 所示——例如，经度（`coords.longitude`）、纬度（`coords.latitude`）以及——（如果提供的话）速度（`speed`）和朝向（`heading`）。\n\
  \n```\nfunction getPosition() {\n  if(navigator.geolocation) {\n    navigator.geolocation.getCurrentPosition((position)\
  \ => {\n      document.getElementById('latitude').value = position.coords.latitude;\n\
  \      document.getElementById('longitude').value = position.coords.longitude;\n\
  \      document.getElementById('altitude').value = position.coords.altitude;\n \
  \     document.getElementById('accuracy').value = position.coords.accuracy;\n  \
  \    document.getElementById('altitudeAccuracy').value = \n          position.coords.altitudeAccuracy;\n\
  \      document.getElementById('heading').value = position.coords.heading;\n   \
  \   document.getElementById('speed').value = position.coords.speed;\n      document.getElementById('timestamp').value\
  \ = position.timestamp;\n    });\n  }\n} \n```\n\n**列表 12.48** 通过 Geolocation API\
  \ 确定位置\n\n![在 Chrome 中确定位置](img/img-f12.23.html)\n\n**图 12.23** 在 Chrome 中确定位置\n\
  \n## 用户同意\n\n为了确定用户的位置，用户必须给予其同意。因此，一旦在网页内中使用 Geolocation API 确定位置，就会显示相应的确认对话框（参见\
  \ 图 12.24、图 12.25 和 图 12.26）。\n\n![Chrome 中的确认对话框](img/img-f12.24.html)\n\n**图 12.24**\
  \ Chrome 中的确认对话框\n\n![Firefox 中的确认对话框](img/img-f12.25.html)\n\n**图 12.25** Firefox\
  \ 中的确认对话框\n\n![Opera 中的确认对话框](img/img-f12.26.html)\n\n**图 12.26** Opera 中的确认对话框\n\
  \n只有当用户在此处给予其（同意）时，才能使用该 API。如果用户拒绝访问位置信息，可以通过作为 `getCurrentPosition()` 方法第二个参数传递的另一个回调函数进行拦截（参见\
  \ 列表 12.49）。\n\n```javascript\nfunction getPosition() {\n  function successHandler(position)\
  \ {\n    document.getElementById('latitude').value = position.coords.latitude;\n\
  \    document.getElementById('longitude').value = position.coords.longitude;\n \
  \   document.getElementById('altitude').value = position.coords.altitude;\n    document.getElementById('accuracy').value\
  \ = position.coords.accuracy;\n    document.getElementById('altitudeAccuracy').value\
  \ = \n      position.coords.altitudeAccuracy;\n    document.getElementById('heading').value\
  \ = position.coords.heading;\n    document.getElementById('speed').value = position.coords.speed;\n\
  \    document.getElementById('timestamp').value = position.timestamp;\n  }\n  function\
  \ errorHandler(error) {\n    // 用户拒绝位置\n  }\n  if(navigator.geolocation) {\n   \
  \ navigator.geolocation.getCurrentPosition(successHandler, errorHandler);\n  }\n\
  }\n```\n\n**列表 12.49** 用户拒绝位置时的错误处理\n\n### 12.8.2 持续访问位置信息\n\n如果你不仅想确定一次位置，而是想持续确定，`watchPosition()`\
  \ 方法是一个很好的选择。该方法原理上与 `getCurrentPosition()` 相似，但每当位置信息变化时就会被持续调用。作为返回值，该方法还返回一个\
  \ ID，在稍后可以通过如 列表 12.50 所示的 `clearWatch()` 方法来停止位置确定。\n\n```javascript\nconst watchID\
  \ = navigator.geolocation.watchPosition((position) => {\n  document.getElementById('latitude').value\
  \ = position.coords.latitude;\n  document.getElementById('longitude').value = position.coords.longitude;\n\
  \  document.getElementById('altitude').value = position.coords.altitude;\n  document.getElementById('accuracy').value\
  \ = position.coords.accuracy;\n  document.getElementById('altitudeAccuracy').value\
  \ = \n     position.coords.altitudeAccuracy;\n  document.getElementById('heading').value\
  \ = position.coords.heading;\n  document.getElementById('speed').value = position.coords.speed;\n\
  \  document.getElementById('timestamp').value = position.timestamp;\n});\n// 稍后：\n\
  navigator.geolocation.clearWatch(watchID);\n```\n\n**列表 12.50** 持续确定位置\n\n### 12.8.3\
  \ 在地图上显示位置\n\nGeolocation API 可以用于各种应用目的。当确定的位置信息与 Google Maps API ([`developers.google.com/maps/?hl=en`](https://developers.google.com/maps/?hl=en))\
  \ 结合时，它变得特别有趣。\n\n你可以在 列表 12.51 中看到此用途的代码示例，结果如 图 12.27 所示。在此情况下，通过 Geolocation\
  \ API 确定的经纬度信息被传递给 Google Maps API。这里使用了 Google Maps API 的各种对象在地图上显示用户的位置，并带有一个“在这里”文本的小提示框。\n\
  \n```javascript\nfunction getPosition() {\n  function successHandler(position) {\n\
  \    /* 这里是填充输入字段的相同代码 */\n    const mapOptions = {\n      zoom: 6\n    };\n   \
  \ const map = new google.maps.Map(\n      document.getElementById('map-canvas'),\
  \ \n      mapOptions\n    );\n    const googlePosition = new google.maps.LatLng(\n\
  \      position.coords.latitude, \n      position.coords.longitude\n    );\n   \
  \ const infowindow = new google.maps.InfoWindow({\n      map: map,\n      position:\
  \ googlePosition,\n      content: 'You are here.'\n    });\n    map.setCenter(googlePosition);\n\
  \  }\n  function errorHandler(error) {\n    // 用户拒绝位置\n  }\n  if(navigator.geolocation)\
  \ {\n    navigator.geolocation.getCurrentPosition(successHandler, errorHandler);\n\
  \  }\n} \n```\n\n**列表 12.51** 结合 Google Maps API 使用 Geolocation API 在地图上显示用户位置\n\
  \n![在地图上显示位置](img/img-f12.23.html)\n\n**图 12.27** 上显示位置\n\n### 私有 API\n\nGoogle\
  \ Maps API 并不是由 W3C 或 WHATWG 标准化的官方 API，而是 Google 的私有 API。因此，该 API 在各种浏览器中默认不可用，必须通过相应的\
  \ JavaScript 文件手动集成到相应的网页中。\n\n除了 Google Maps API 之外，还有许多其他私有 API，不仅来自 Google，还来自\
  \ Spotify、LastFM、Twitter、Facebook、Instagram 等许多服务。\n\n\n\n\n\nProgrammableWeb 网站\
  \ [www.programmableweb.com/apis/directory](http://www.programmableweb.com/apis/directory)\
  \ 为这些 API 提供了很好的概述。\n\n### 12.8.4 显示路线\n\nGoogle Maps API 非常强大，你可以用它做很多很棒的事情，由于空间限制，我们在这里无法讨论。不过，我们确实挑选了一个有趣的用例：在地图旁边以文本形式显示路线，并在地图内部显示连接线。你可以在\
  \ Listing 12.52 中查看此代码。同样，根据确定的经纬度，当前位置将显示在地图上。根据此位置，你将获得前往柏林 Alexanderplatz 的路线。\n\
  \n```javascript\nfunction getPosition() {\n  function successHandler(position) {\n\
  \    /* here the same code as before for filling the input fields */\n    const\
  \ directionsService = new google.maps.DirectionsService();\n    const directionsRenderer\
  \ = new google.maps.DirectionsRenderer();\n    const mapOptions = {\n      zoom:\
  \ 6\n    };\n    const map = new google.maps.Map(\n      document.getElementById('map-canvas'),\
  \ \n      mapOptions\n    );\n    const travel = {\n      origin : new google.maps.LatLng(position.coords.latitude,\
  \ \n      position.coords.longitude),\n      destination : 'Alexanderplatz, Berlin',\n\
  \      travelMode : google.maps.DirectionsTravelMode.DRIVING\n    };\n    const\
  \ googlePosition = new google.maps.LatLng(\n      position.coords.latitude, \n \
  \     position.coords.longitude\n    );\n    map.setCenter(googlePosition);\n  \
  \  directionsRenderer.setMap(map);\n    directionsRenderer.setPanel(document.getElementById('map-directions'));\n\
  \    directionsService.route(travel, (result, status) => {\n      if (status ===\
  \ google.maps.DirectionsStatus.OK) {\n        directionsRenderer.setDirections(result);\n\
  \      }\n    });\n  }\n  function errorHandler(error) {\n    // User refuses position\
  \ determination\n  }\n  if(navigator.geolocation) {\n    navigator.geolocation.getCurrentPosition(successHandler,\
  \ errorHandler);\n  }\n} \n```\n\n**Listing 12.52** 结合 Geolocation API 和 Google\
  \ Maps API 显示路线\n\n### 12.9 读取终端设备的电池电量\n\n通过电量状态 API ([www.w3.org/TR/battery-status/](http://www.w3.org/TR/battery-status/))，可以访问终端设备的电池信息，因此，可以根据电池的充电状态相应地调整网页。为了此目的，API\
  \ 定义了 `BatteryManager` 接口，可以使用它来访问各种电量信息。通过 `navigator` 对象的（同样新的）`getBattery()`\
  \ 方法获取 `BatteryManager` 类型对象的实例引用。\n\n### 12.9.1 访问电量信息\n\n`BatteryManager` 接口提供了四个属性（参见\
  \ Table 12.9）。`charging` 属性（`boolean` 类型）提供有关电池当前是否正在充电的信息。`chargingTime` 属性给出一个时间（秒），表示电池充满需要多长时间。如果电池已经充满电，该属性的值为\
  \ `0`。相反，如果电池当前没有在充电，该属性的值为 `Infinity`。与 `chargingTime` 类似，`dischargingTime` 属性指定了电池完全放电所需的时间（也是秒）（如果电池当前正在充电，`dischargingTime`\
  \ 的值为 `Infinity`）。最后但同样重要的是，`level` 属性表示电池电量，范围为 `0`（未充电）到 `1`（充满电）之间的浮点数。\n\n|\
  \ 事件 | 描述 |\n| --- | --- |\n| `charging` | 表示电池是否正在充电 |\n| `chargingTime` | 表示电池充满所需的时间\
  \ |\n| `dischargingTime` | 表示电池完全放电所需的时间 |\n| `level` | 表示电量，范围为 `0`（未充电）到 `1`（充满电）之间的浮点数\
  \ |\n\n**Table 12.9** BatteryManager 的不同属性\n\n使用该 API 的简单示例可以在 Listing 12.53 中找到。如你所见，`getBattery()`\
  \ 方法并不直接返回 `BatteryManager` 对象，而是一个 `Promise` 对象。如果你在该对象上调用 `then()` 方法，就可以在传递的回调函数中获得\
  \ `BatteryManager` 对象。Figure 12.28 显示了电池当前正在充电时的程序输出。而 Figure 12.29 显示了电池当前未在充电时的输出。\n\
  \n```javascript\nfunction displayBatteryStatus(battery) {\n  document.getElementById('charge').innerHTML\
  \ = (battery.charging ? 'Yes' : 'No');\n  document.getElementById('charging-time').innerHTML\
  \ = battery.chargingTime;\n  document.getElementById('discharging-time').innerHTML\
  \ = battery.dischargingTime;\n  document.getElementById('battery-level').innerHTML\
  \ = battery.level;\n}\nnavigator.getBattery().then((battery) =>\n{\n  displayBatteryStatus(battery);\n\
  }); \n```\n\n**Listing 12.53** 读取与电池电量相关的各种属性\n\n![The Battery Is Being Charged](img/img-f12.28.html)\n\
  \n**Figure 12.28** 电池正在充电\n\n![The Battery Is Not Being Charged at the Moment](img/img-f12.29.html)\n\
  \n**Figure 12.29** 电池当前没有充电\n\n### 12.9.2 响应事件\n\n除了上述提到的属性外，可以使用 `addEventListener()`\
  \ 方法为 `BatteryManager` 分配以下四个事件的事件监听器：`chargingchange` 事件在充电状态改变时触发（即从正在充电变为未充电，或从未充电变为正在充电）。`levelchange`\
  \ 事件在电量级别改变时触发。`chargingtimechange` 和 `dischargingtimechange` 事件在电池充满（`chargingtimechange`）或放电（`dischargingtimechange`）的时间改变时触发（另见\
  \ Table 12.10）。Listing 12.54 显示了此的一个示例。\n\n| 事件 | 描述 |\n| --- | --- |\n| `chargingchange`\
  \ | 当终端设备改变其充电状态时触发——即从正在充电变为未充电，或从未充电变为正在充电 |\n| `levelchange` | 当电量级别改变时触发 |\n\
  \n\n\n\n\n| `chargingtimechange` | 当电池充满电所需的时间发生变化时触发 |\n| `dischargingtimechange`\
  \ | 当电池放电所需的时间发生变化时触发 |\n\n**表 12.10** 电池电量的的不同事件\n\n```\nif (navigator.getBattery)\n\
  {\n  function displayBatteryStatus(battery)\n  {\n    document.getElementById('charge').innerHTML\
  \ = \n      (battery.charging ? 'Yes' : 'No');\n    document.getElementById('charging-time').innerHTML\
  \ = battery.chargingTime;\n    document.getElementById('discharging-time').innerHTML\
  \ = \n      battery.dischargingTime;\n    document.getElementById('battery-level').innerHTML\
  \ = battery.level;\n  }\n\n  function chargingChangeHandler(event)\n  {\n    console.log('chargingchange');\n\
  \    displayBatteryStatus(event.target);\n  }\n\n  function chargingTimeChangeHandler(event)\n\
  \  {\n    console.log('chargingtimechange');\n    displayBatteryStatus(event.target);\n\
  \  }\n\n  function dischargingTimeChangeHandler(event)\n  {\n    console.log('dischargingtimechange');\n\
  \    displayBatteryStatus(event.target);\n  }\n\n  function levelChangeHandler(event)\n\
  \  {\n    console.log('levelchange');\n    displayBatteryStatus(event.target);\n\
  \  }\n\n  navigator.getBattery().then((battery) =>\n  {\n    displayBatteryStatus(battery);\n\
  \    battery.addEventListener('chargingchange', chargingChangeHandler);\n    battery.addEventListener('chargingtimechange',\
  \ chargingTimeChangeHandler);\n    battery.addEventListener('dischargingtimechange',\
  \ \n                             dischargingTimeChangeHandler);\n    battery.addEventListener('levelchange',\
  \ levelChangeHandler);\n  });\n} \n```\n\n**代码列表 12.54** 电池状态 API 的不同事件\n\n## 12.10\
  \ 输出语音和识别语音\n\nWeb Speech API ([`dvcs.w3.org/hg/speech-api/raw-file/tip/speechapi.html`](https://dvcs.w3.org/hg/speech-api/raw-file/tip/speechapi.html))\
  \ 允许 Web 开发者在网页内通过程序化的方式输出语音和识别语音。同样，该 API 定义了两个接口：用于语音识别的 ([`dvcs.w3.org/hg/speech-api/raw-file/tip/speechapi.html#speechreco-section`](https://dvcs.w3.org/hg/speech-api/raw-file/tip/speechapi.html#speechreco-section))\
  \ `SpeechRecognition` 和用于语音输出的 ([`dvcs.w3.org/hg/speech-api/raw-file/tip/speechapi.html#tts-section`](https://dvcs.w3.org/hg/speech-api/raw-file/tip/speechapi.html#tts-section))\
  \ `SpeechSynthesis`。该 API 由 Speech API 社区发布，但尚未成为官方的 W3C 标准。\n\n要确定当前浏览器是否支持 Web\
  \ Speech API，你需要测试两点：首先是否支持语音输出，其次是否支持语音识别。这两项测试通过特性检测完成。对于语音输出，检查 `window` 对象是否具有\
  \ `speechSynthesis` 属性（参见 代码列表 12.55）。对于语音识别，检查是否存在 `webkitSpeechRecognition` 属性（参见\
  \ 代码列表 12.56）。\n\n```\nif(window.speechSynthesis) {\n  // 支持语音输出\n} else {\n  //\
  \ 不支持语音输出\n}\n// 备用:\nif('speechSynthesis' in window) {\n  // 支持语音输出\n} else {\n\
  \  // 不支持语音输出\n} \n```\n\n**代码列表 12.55** 检查浏览器对语音输出的支持\n\n```\nif(window.webkitSpeechRecognition)\
  \ {\n  // 支持语音识别\n} else {\n  // 不支持语音识别\n}\n// 备用:\nif('webkitSpeechRecognition'\
  \ in window) {\n  // 支持语音识别\n} else {\n  // 不支持语音识别\n} \n```\n\n**代码列表 12.56** 检查浏览器对语音识别的支持\n\
  \n### 12.10.1 输出语音\n\n使用 Web Speech API 创建语音输出相对容易，正如你在 代码列表 12.57 中看到的。使用 `SpeechSynthesisUtterance`\
  \ 类型的对象来定义一种配置对象。要输出的文本通过 `text` 属性定义（或者在创建配置对象时也可以直接作为构造参数传递此文本）。\n\n然后，将配置对象传递给\
  \ `SpeechSynthesis` 对象的 `speak()` 方法。这确保了配置对象被添加到队列中。此外，还有 `cancel()`、`pause()`\
  \ 和 `resume()` 方法。\n\n```\nconst utterance = new SpeechSynthesisUtterance();\nutterance.text\
  \ = 'Hello';\nspeechSynthesis.speak(utterance);\n```\n\n**代码列表 12.57** 创建语音输出\n\n\
  `getVoices()` 方法也用于获取浏览器提供的语音。每个语音都有不同的属性，包括名称和语言缩写。一旦决定了语音，就可以通过 `SpeechSynthesisUtterance`\
  \ 实例上的 `voice` 属性来定义它，如 代码列表 12.58 所示。\n\n```\nconst utterance = new SpeechSynthesisUtterance();\n\
  const voices = speechSynthesis.getVoices();\nvoices.forEach(function(voice) {\n\
  \  console.log(voice.lang);\n  console.log(voice.name);\n});\nutterance.voice =\
  \ voices[1];\nspeechSynthesis.speak(utterance);\n```\n\n**代码列表 12.58** 语音输出语音选择\n\
  \n除了语音之外，还有其他属性可以自定义语音输出，包括语言缩写、音量、速度和音调。语言缩写的规范特别别实用，因为系统会自动选择合适的语音（参见 代码列表 12.59）。\n\
  \n```\nconst utterance = new SpeechSynthesisUtterance();\nutterance.text = 'Hello\
  \ World';\nutterance.lang = 'en';           // 语言缩写\nutterance.volume = 0.5;   \
  \       // 音量\nutterance.rate = 0.5;            // 速度\nutterance.pitch = 0.5;  \
  \         // 音调\nspeechSynthesis.speak(utterance);\n```\n\n**代码列表 12.59** 语音输出的进一步配置选项\n\
  \n最后但同样重要的是，可以使用事件处理器来响应作为语音输出一部分生成的各种事件。此类示例在 代码列表 12.60 中所示。你可以在 表 12.11 中找到所有事件列表。\n\
  \n```\nconst utterance = new SpeechSynthesisUtterance('Hello World');\nutterance.onstart\
  \ = event => {\n  console.log('Start speech output');\n};\nspeechSynthesis.speak(utterance);\n\
  ```\n\n**代码列表 12.60** 在语音输出中使用事件处理器\n\n| 事件 | 描述 | 事件处理器 |\n| --- | --- | --- |\n\
  | `boundary` | 当达到单词或短语限制时触发 | `onboundary` |\n| `end` | 在语音输出结束时触发 | `onend` |\n\
  | `error` | 在语音输出过程中发生错误时触发 | `onerror` |\n\n\n\n\n\n| `mark` | 在处理语音合成标记语言 (SSML)\
  \ 时，当在语音输出中找到 `<mark>` 标签时触发 | `onmark` |\n| `pause` | 当语音输出暂停时触发 | `onpause` |\n\
  | `resume` | 当语音输出恢复时触发 | `onresume` |\n| `start` | 当语音输出开始时触发 | `onstart` |\n\n\
  **表 12.11** 输出输出事件\n\n### 12.10.2 识别语音\n\n语音识别与语音输出完全分离，并由 `webkitSpeechRecognition`\
  \ 对象控制（浏览器前缀已经暗示该功能仅在基于 WebKit 的浏览器中可用）。`webkitSpeechRecognition` 对象实现了 API 中描述的\
  \ `SpeechRecognition` 接口。\n\n使用语音识别的示例在代码列表 12.61 中所示。`webkitSpeechRecognition`\
  \ 对象的 `continuous` 属性（默认设置为 `false`）指定语音识别应该是连续的，还是在用户停止说话时停止。`lang` 属性也可用于指定语言识别的目标语言。最后，`start()`\
  \ 方法用于开始语音识别。\n\n在语音识别中，与语音输出一样，会触发各种事件——例如，一旦语音被识别或在语音识别期间发生错误时（各种事件的概述见表 12.12）。\n\
  \n| 事件 | 描述 | 事件处理器 |\n| --- | --- | --- |\n| `audioend` | 在音频录制结束时触发 | `onaudioend`\
  \ |\n| `audiostart` | 在音频录制开始时触发 | `onaudiostart` |\n| `end` | 当语音识别服务终止时触发 | `onend`\
  \ |\n| `error` | 在语音识别期间发生错误时触发 | `onerror` |\n| `nomatch` | 当语音识别未返回结果时触发 | `onnomatch`\
  \ |\n| `result` | 当语音识别结果已知时触发 | `onresult` |\n| `soundstart` | 检测到声音（如语音）时触发 |\
  \ `onsoundstart` |\n| `soundend` | 不检测到声音时触发 | `onsoundend` |\n| `speechend` | 语音识别完成时触发\
  \ | `onspeechend` |\n| `speechstart` | 识别语音时触发 | `onspeechstart` |\n| `start` |\
  \ 当语音识别服务启动时触发 | `onstart` |\n\n**表 12.12** 语音识别事件\n\n例如，要访问语音识别的结果，您为 `result`\
  \ 事件注册一个事件处理器，如代码列表 12.61 所示。相应的事件对象随后通过 `results` 属性提供语音识别列表。列表中的每个条目包含一个或多个语音识别备选方案，以防语音识别出现歧义。每个备选方案有两个属性：`transcript`\
  \ 属性包含识别出的文本，`confidence` 属性包含一个 `0` 到 `1` 之间的值，表示该文本实际上是所说文本的概率。第一个位置的备选（示例中的 `firstResult[0]`）代表概率最高的结果。\n\
  \n```\nconst recognition = new webkitSpeechRecognition();\nrecognition.continuous\
  \ = true;\nrecognition.lang = 'en';\nrecognition.onresult = function(event){ \n\
  \  const results = event.results;\n  const firstResult = results[0]\n  const firstAlternative\
  \ = firstResult[0];\n  const transcript = firstAlternative.transcript;\n  const\
  \ confidence = firstAlternative.confidence;\n  console.log(transcript);\n  console.log(confidence);\n\
  }\nrecognition.start(); \n```\n\n**代码列表 12.61** 使用语音识别\n\n## 12.11 创建动画\n\nWeb Animation\
  \ API ([http://www.w3.org/TR/web-animations/]) 允许 Web 开发人员通过 JavaScript 在网页内定义和控制动画。出于此目的，API\
  \ 定义了各种新接口，这些接口目前已由 Firefox、Chrome 和 Opera 实现。Internet Explorer、Microsoft Edge 和\
  \ Safari 目前不支持该 API（更多信息，请查看 [Can I Use 网页页](http://caniuse.com/#search=web%20animations%20api)）。在尚未提供支持的浏览器中，可以使用\
  \ polyfills（填充方案），例如在 [https://github.com/web-animations/web-animations-js] 中找到的那个。\n\
  \n### 12.11.1 使用 API\n\nWeb Animation API 的核心是 `animate()` 方法，它是 API 为 DOM 元素新提供的方法。该方法可用于创建单个动画，每个动画都由一个（同样新的）`Animation`\
  \ 类型的对象表示（见表 12.13）。\n\n| 接口 | 描述 |\n| --- | --- |\n| `Animation` | 代表一个动画。 |\n\
  | `Animatable` | 代表网页上可动画的元素。由 `Element` 接口和 `PseudoElement` 接口实现，为网页上的所有 DOM 元素提供了\
  \ `animate()` 方法。 |\n| `AnimationTimeline` | 在时间轴上汇总动画。 |\n| `AnimationEffectTiming`\
  \ | 代表动画的效果（传递给 `animate()` 方法的第二个参数）。 |\n| `DocumentTimeline` | 在时间轴上汇总网页的动画。派自\
  \ `AnimationTimeline`。 |\n| `KeyframeEffect` | 代表动画单个帧的效果。作为数组参数传递给 `animate` 函数的对象的类型。\
  \ |\n\n**表 12.13** Web Animation API 的主要接口\n\n\n\n\n\n代码列表 12.62 显示了一个简单的示例：`animate()`\
  \ 方法接收一个关键帧描述数组作为第一个参数，并将一个配置对象作为第二个参数，该配置对象可用于定义动画的进一步属性（参见表 12.14）。\n\n你通过这两个参数可以进行的设置与你从处理\
  \ CSS 动画时熟悉的设置相似（参见代码列表 12.63）。关键帧描述可以映射到 `@keyframes` 规则，而配置对象可以映射到（CSS）简写属性 `animation`（或单独的\
  \ `animation-*` 属性）。\n\n每个关键帧对象的 `offset`（对象）属性可定义相应的关键帧在动画中的哪个时间点显示。如果省略了此属性，则各个关键帧将均匀分布在定义的持续时间内。\n\
  \n此外，可以为每个关键帧（可动画的）指定 CSS 属性（如 `transform` 或 `opacity`）以及动画元素在动画期间应承担的值。两个关键帧之间的值会自动进行插值处理。\n\
  \n简而言之，如果你已经处理过 CSS 动画，你就能很快理解 Web Animation API 的基础。原则上，这一切的工作原理相似的——只不过不是声明式的，而是通过编程实现的。\n\
  \n```javascript\n'use strict';\nfunction init() {\n  const animation = document.getElementById('circle').animate([\n\
  \    {\n      transform: 'scale(2)',\n      opacity: 1,\n      offset: 0\n    },\n\
  \    {\n      transform: 'scale(3)',\n      opacity: 0.8,\n      offset: 0.3\n \
  \   },\n    {\n      transform: 'scale(4)',\n      opacity: 0.6,\n      offset:\
  \ 0.6\n    },\n    {\n      transform: 'scale(5)',\n      opacity: 0.7,\n      offset:\
  \ 1\n    }\n  ], {\n    duration: 500,          // 持续时间（毫秒）\n    easing: 'ease-in-out',\
  \  // 动画行为\n    delay: 10,              // 延迟（毫秒）\n    iterations: Infinity,   //\
  \ 重复次数\n    direction: 'alternate', // 动画方向\n    fill: 'both'            // 动画的填充行为\n\
  \  });\n}\n\ndocument.addEventListener('DOMContentLoaded', init); \n```\n\n**代码列表\
  \ 12.62** 使用 Web Animation API\n\n| 属性 | 描述 |\n| --- | --- |\n| `delay` | 动画开始前的延迟（毫秒）\
  \ |\n| `endDelay` | 动画结束前的延迟（毫秒） |\n| `fill` | 动画的填充行为（`none`、`forwards`、`backwards`、`both`、`auto`）\
  \ |\n| `iterationStart` | 指定触发动画特定效果的迭代次数\n| `iterations` | 重复次数（`infinity` 或具体的数字）\
  \ |\n| `duration` | 动画的持续时间（毫秒） |\n| `direction` | 动画方向（`alternate`、`normal`、`reverse`、`alternate-reverse`）\
  \ |\n| `easing` | 动画行为（`ease`、`ease-in`、`ease-out`、`ease-in-out`、`cubic-bezier()`）\
  \ |\n\n**表 12.14** 动画配置选项\n\n```css\n@keyframes example {\n    0% {\n        transform:\
  \ scale(2);\n        opacity: 1;\n    }\n    30% {\n        transform: scale(3);\n\
  \        opacity: 0.8;\n    }\n    60% {\n        transform: scale(4);\n       \
  \ opacity: 0.6;\n    }\n    100% {\n        transform: scale(5);\n        opacity:\
  \ 0.7;\n    }\n}\n#circle {\n    animation: example 500ms ease-in-out 10ms infinite\
  \ alternate both;\n} \n```\n\n**代码列表 12.63** 等效的 CSS 动画\n\n### 12.11.2 控制动画\n\n\
  你可以通过 `animate()` 方法获取 `animation` 对象来控制动画的播放行为。可以通过 `pause()` 方法暂停动画，并通过 `play()`\
  \ 方法重新启动。`cancel()` 和 `finish()` 方法也允许你取消或完成动画。\n\n代码列表 12.62 显示了此相应的示例。在这里，通过 `click`\
  \ 监听器向 `animation` 对象添加了各种按钮。你也可以在这里看到可以使用 `playbackRate` 属性来影响动画的速度。\n\n```javascript\n\
  const buttonPause = document.getElementById('pause');\nbuttonPause.addEventListener('click',\
  \ () => {\n  animation.pause();\n});\nconst buttonPlay = document.getElementById('play');\n\
  buttonPlay.addEventListener('click', () => {\n  animation.play();\n});\nconst buttonCancel\
  \ = document.getElementById('cancel');\nbuttonCancel.addEventListener('click', ()\
  \ => {\n  animation.cancel();\n});\nconst buttonFinish = document.getElementById('finish');\n\
  buttonFinish.addEventListener('click', () => {\n  animation.finish();\n});\n\nconst\
  \ buttonFaster = document.getElementById('faster');\nbuttonFaster.addEventListener('click',\
  \ () => {\n  animation.playbackRate *= 2;\n});\nconst buttonSlower = document.getElementById('slower');\n\
  buttonSlower.addEventListener('click', () => {\n  animation.playbackRate /= 2;\n\
  });\n```\n\n**代码列表 12.64** 控制动画\n\n## 12.2 使用命令行工作\n\n浏览器工具（如 Chrome DevTools、Firebug\
  \ 或 Safari 的开发者工具）是任何 Web 开发人员的标准工具——无论是为了检查网页的 DOM 树、在控制台中生成输出、评估表达式和函数调用、为调试设置断点、遍历\
  \ Web 应用程序 JavaScript 代码的每一个步骤、分析应用程序性能或监控网络流量。\n\n但只有少数开发者知道这些工具通过 JavaScript 也提供了各种功能（参见表\
  \ 12.15）。这是一个简要概述相对不知的命令行 API 的良好机会，它在各自的开发者工具中受到 Chrome ([`developer.chrome.com/devtools/docs/commandline-api`](https://developer.chrome.com/devtools/docs/commandline-api))、Safari\
  \ ([`developer.apple.com/library/mac/documentation/AppleApplications/Conceptual/Safari_Developer_Guide/Console/Console.html)`](https://developer.apple.com/library/mac/documentation/AppleApplications/Conceptual/Safari_Developer_Guide/Console/Console.html))\
  \ 和 Firefox ([`developer.mozilla.org/en-US/docs/Tools/Web_Console`](https://developer.mozilla.org/en-US/docs/Tools/Web_Console))\
  \ 的支持。\n\n| 函数 | 描述 |\n| --- | --- |\n| `$(selector)` | `document.querySelector()`\
  \ 的别名。 |\n\n\n\n\n\n| `$(selector)` | `document.querySelectorAll()` 的别名。 |\n| `$x(xpath)`\
  \ | 返回匹配所传 XPath 的元素。 |\n| `$0` | 包含 DOM 树视图中当前选中的节点。 |\n| `$1..4` | 包含 DOM 树视图中最后选择的节点。\
  \ |\n| `$_` | 包含上一次评估表达式的结果。 |\n| `clear()` | 清空控制台。 |\n| `copy(object)` | 将对象的字符串表示复制到剪贴板。\
  \ |\n| `debug(function)` | 在调用所传函数时使调试器停止。 |\n| `dir(object)` | 输出传递对象的所有属性（`console.dir()`\
  \ 的别名）。 |\n| `dirxml(object)` | 输出传递对象的 XML  own（`console.dirxml()` 的别名）。 |\n| `getEventListeners(object)`\
  \ | 返回为对象注册的事件监听器。 |\n| `inspect(object/function)` | 打开 DOM 树视图，并选中所传或由所传函数返回的相应元素。\
  \ |\n| `keys(object)` | 返回一个包含对象属性名称的数组。 |\n| `monitor(function)` | 确保在调用所传函数时，生成相应的控制台输出，包括相应的传递参数。\
  \ |\n| `monitorEvents(object[, events])` | 开始监控由对象触发的事件。 |\n| `profile([title])`\
  \ |  JavaScript 性能分析器。可以传递一个标题，该标题将出现在性能报告中相应的位置。 |\n| `profileEnd()` | 停止 JavaScript\
  \ 性能分析器并创建一个报告。 |\n| `table(data [, columns])` | 以表格形式输出传递的对象。 |\n| `undebug(function)`\
  \ | 停止对函数的调试。 |\n| `unmonitor(function)` | 停止对函数的监控。 |\n| `unmonitorEvents(object[,\
  \ types])` | 停止对传递对象上的传递事件的监控。 |\n| `values(object)` | 以数组返回对象所有属性的值。 |\n\n**表 12.15**\
  \ 提供的方法概述\n\n### 12.12.1 选择和检查 DOM 元素\n\n从第 10 章中，你可能记得 `$` 对象，它默认提供了 jQuery 库的功能。在命令行\
  \ API（Command Line API）中，`$` 代表 `document.querySelector()` 方法的别名。\n\n因此，即使没有包含 jQuery，`document.querySelector('li')`\
  \ 调用也可以缩短为 `$('li')`，它返回网页上的第一个 `<li>` 元素（参见列表 12.65）。\n\n```javascript\nconst firstListItem\
  \ = $('li');\nconsole.log(firstListItem); \n```\n\n**列表 12.65** 选择第一个列表元素\n\n####\
  \ 注意事项\n\n在此语境下，请注意以下内容：如果网页嵌入了 jQuery，则该别名显然不可用（除非你将 jQuery 赋值给另一个变量）。\n\n类似于 `$()\
  \ `，`$$()` 方法代表 `document.querySelectorAll()` 方法的别名。例如，`$('li')` 调用返回整个网页上的所有列表项，而\
  \ `$('nav li')` 调用仅返回那些 `<nav>` 元素内部的列表项（参见列表 12.66）。\n\n```javascript\nconst allListItems\
  \ = $$('li');\nconsole.log(allListItems);\nconst allNavListItems = $$('nav li');\n\
  console.log(allNavListItems); \n```\n\n**列表 12.66** 在导航元素内选择所有列表元素\n\n![选择单个或所有列表元素](img/img-f12.30.html)\n\
  \n**图 12.30** 选择单个或所有列表元素\n\n`$x()` 方法返回匹配所传 XPath 表达式的元素，它也特别方便（参见列表 12.67）。\n\n\
  ```javascript\nconst listItems = $x('/HTML/BODY/UL/LI');\nconsole.log(listItems);\
  \ \n```\n\n**列表 12.67** 通过指定 XPath 表达式选择元素\n\n一旦你使用 `$()`、`$$` 或 `$x()` 函数之一（或使用\
  \ DOM 标准中的其他选择方法）选择了一个元素，你就可以命令行 API 的 `inspect()` 函数在相应开发者工具的 DOM 树视图中显示它（参见列表\
  \ 12.68）。\n\n```javascript\nconst firstListItem = $('li');\ninspect(firstListItem);\
  \ \n```\n\n**列表 12.68** 在开发者工具中显示元素\n\n![通过 XPath 表达式选择](img/img-f12.31.html)\n\n\
  **图 12.31** 通过 XPath 表达式选择\n\n#### 注意事项\n\n顺便提一下，可以使用快捷方式 `$0`、`$1`、`$2`、`$3` 和\
  \ `$4` 来访问 DOM 树中最后选择的五个元素（参见图 12.32）。\n\n![通过快捷方式选择](img/img-f12.32.html)\n\n**图\
  \ 12.32** 通过快捷方式选择\n\n### 12.12.2 事件分析\n\n`addEventListener()` 和 `removeListener()`\
  \ 方法你应该在第 6 章中已经熟悉了。它们可以用于为单个元素的特定事件注册或移除事件监听器。然而，缺少的是一种标准方法，让对象获取为特定事件注册的所有事件监听器。\n\
  \n命令行 API 额外定义了 `getEventListeners()` 函数，它正是为此目的而提供的（参见列表 12.69）。如果你向此函数传递一个对象，返回值是一个对象，它包含与每个事件同名的属性，而该属性反过来包含一个包含为相应事件注册的监听器的数组。\n\
  \n```javascript\nwindow.addEventListener('load', () => {\n  console.log('Document\
  \ loaded');\n});\nwindow.addEventListener('resize', () => {\n  console.log('Browser\
  \ window size changed');\n});\nconsole.log(getEventListeners(window)); \n```\n\n\
  **列表 12.69** 为对象注册的事件监听器输出\n\n![对象注册的事件监听器概述](img/img-f12.33.html)\n\n**图 12.33**\
  \ 为对象注册的事件监听器概述\n\n### 12.12.3 调试、监控与性能分析\n\n\n\n\n\n如你所知，断点可以通过相应开发者工具的 GUI 直接定义，也可以通过\
  \ `debugger` 关键字定义。命令行 API（Command Line API）提供了另一种选项：`debug()` 方法期望一个函数或对象方法作为参数，并在每次调用传入的函数或方法时停止相应程序的执行（请参阅\
  \ 列表 12.70）。\n\n```\nfunction createPerson(firstName, lastName, age) {\n  return\
  \ {\n    firstName: firstName, \n    lastName: lastName, \n    age: age\n  }\n}\n\
  debug(createPerson);\nconst max = createPerson('John', 'Doe', 55);\nundebug(createPerson);\
  \ \n```\n\n**列表 12.70** 调试函数\n\n如果想要撤销这种调试行为，只需调用 `undebug()` 即可；此处也必须将函数/方法作为参数传递。\n\
  \n如果你只想知道函数或方法何时以及带有哪些参数被调用，命令行 API 提供了 `monitor()` 函数。如果你将一个函数对象作为参数传递给此函数，随后对该函数的所有调用都将进行相应的记录。\n\
  \n在 列表 12.71 中，调用 `monitor(createPerson)` 会向控制台输出 `createPerson()` 函数的每次调用，包括传递给它的参数（请参阅\
  \ 图 12.34）。\n\n```\nfunction createPerson(firstName, lastName, age) {\n  return\
  \ {\n    firstName: firstName, \n    lastName: lastName, \n    age: age\n  }\n}\n\
  monitor(createPerson);\nconst max = createPerson('John', 'Doe', 55);\nconst moritz\
  \ = createPerson('James', 'Doe', 55);\n// later:\nunmonitor(createPerson); \n```\n\
  \n**列表 12.71** 监控函数\n\n这特别实用，例如可以快速检查函数是否没有在无意间带有错误或无效的参数被调用。要在稍后停止监控，可以以相同的方式执行\
  \ `unmonitor()` 函数（请参阅 图 12.35）。\n\n![调试 createPerson() 函数](img/img-f12.34.html)\n\
  \n**图 12.34** 调试 createPerson() 函数\n\n![监控 createPerson() 函数](img/img-f12.35.html)\n\
  \n**图 12.35** 监控 createPerson() 函数\n\n除了监控函数和方法，还可以监控事件的触发：可以使用 `monitorEvents()`\
  \ 函数启动监控，并通过 `unmonitorEvents()` 函数再次停止（请参阅 列表 12.72 和 图 12.36）。触发事件的对象和要执行监控的事件作为参数传递。除了具体的事件名称（如\
  \ `mousedown`、`mouseup`、`keydown` 和 `keyup`），还可以传递 表格 12.16 中所示的事件类型。\n\n```\nconst\
  \ button = document.getElementById('button');\nbutton.addEventListener('click',\
  \ () => {\n  console.log('Button pressed');\n});\nmonitorEvents(button, 'click');\n\
  // later:\nunmonitorEvents(button, 'click'); \n```\n\n**列表 12.72** 监控事件\n\n![监控\
  \ click 事件](img/img-f12.36.html)\n\n**图 12.36** 监控 click 事件\n\n| 事件快捷键 | 事件 |\n\
  | --- | --- |\n| `mouse` | `mousedown`, `mouseup`, `click`, `dblclick`, `mousemove`,\
  \ `mouseover`, `mouseout`, `mousewheel` |\n| `key` | `keydown`, `keyup` |\n| `touch`\
  \ | `touchstart`, `touchend`, `touchmove`, `touchcancel` |\n| `control` | `resize`,\
  \ `scroll` |\n| `focus` | `blur`, `change`, `select`, `submit` |\n\n**表格 12.16**\
  \ 事件快捷键\n\n如果网站运行不顺畅或其性能不尽人意，使用浏览器内部工具进行测量是一个好主意。命令行 API 也提供了此功能：可以通过调用 `profile()`\
  \ 函数启动性能分析（profiling），并通过调用 `profileEnd()` 停止，每次调用时都将分析所需的名称作为参数传递（请参阅 列表 12.73）。\n\
  \n```javascript\n// 开始性能分析/测量\nprofile('Sample profiles');\n// 执行待测量的代码\n// ...\n\
  // 停止性能分析/测量\nprofileEnd('Sample profiles'); \n```\n\n**列表 12.73** 对特定代码段进行性能分析\n\
  \n随后，可以在开发者工具的 Profiles（分析）选项卡中找到创建的分析（请参阅 图 12.37](img-f12.37.html)\n\n**图 12.37**\
  \ 对应用程序进行性能分析\n\n## 12.13 开发多语言应用程序\n\n一旦一个网站或 Web 应用程序需要多语言，国际化（简称 i18n——源于 internationalization\
  \ 一词的首字母 i、最后一个 n 以及它们之间的 18 个字母）就是不可避免的。其核心思想是以特定的结构组织应用程序，使其能够轻松地适应不同的语言（或更广泛地说，适应不同的地区）。\n\
  \n通常，应用程序的文本内容包含在每种语言的单独文件中（或每个区域设置；稍后会详细介绍），然后根据用户或语言设置进行加载。原则上，如果你使用模板引擎来从这些“字典文件”中获取单个文本模块，那么在应用程序内部实现这一点是相对容易的。\n\
  \n稍微复杂的是处理关于数值格式、日期时间格式或字符串比较的各种惯例。在德国，日期在前面，然后是月份，最后是年份，它们之间用点隔开（例如，2021 年 8 月\
  \ 12 日表示为 12.08.2021）。而在美国，月份在第一位，后面是日期和年份，使用斜杠作为分隔符（例如 08/12/2021）。在英国，排列方式与德国相同，但这里像美国风格一样使用斜杠作为分隔符（12/08/2021）。\n\
  \n\n\n\n这同样适用于数值或货币。在德国，句号作为千分位分隔符，逗号作为小数点分隔符，且货币符号置于数值之后（例如，`€ 123.456,79`）；而在美国，情况恰恰相反：这里逗号作为千分位分隔符，句号作为小数点分隔符，且货币符号置于数值之前（例如，\
  \ `$123,456.79`）。在世界其他地区，情况又不同。可以理解，如果你必须自己遵循并实现所有这些规则，可能会很快导致困惑。\n\n### 12.13.1\
  \ 术语解释\n\n在我们详细介绍国际化 API（Internationalization API）之前，让我们先了解国际化的一些基础信息和术语。\n\n如所述，使用某种语言的语言或地区是通过使用\
  \ `locale`（区域设置）定义的。`locale` 定义了用户的语言、区域以及任何其他特殊偏好——换句话说，是一个标识符（也称为语言标签），精确定义了应该使用哪种语言，并决定了如何格式化数值、日期、时间以及比较字符串。\n\
  \n语言标签的结构在 IETF 文档 BCP47 ([`tools.ietf.org/html/bcp47`](https://tools.ietf.org/html/bcp47))\
  \ 中规定。通常，语言标签由由减号分隔的字母和数字组合组成（这些组合也称为子标签）。\n\n第一个子标签是语言子标签，它可能包含来自 ISO 标准 639-1\
  \ ([`en.wikipedia.org/wiki/List_of_ISO_639-1_codes`](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes))\
  \ 的双字符代码，或者来自 ISO 标准 639-2 ([`en.wikipedia.org/wiki/List_of_ISO_639-2_codes`](https://en.wikipedia.org/wiki/List_of_ISO_639-2_codes))、639-3\
  \ ([`en.wikipedia.org/wiki/List_of_ISO_639-3_codes`](https://en.wikipedia.org/wiki/List_of_ISO_639-3_codes))\
  \ 和 639-5 ([`en.wikipedia.org/wiki/List_of_ISO_639-5_codes`](https://en.wikipedia.org/wiki/List_of_ISO_639-5_codes))\
  \ 的三字符代码。例如，德语的 locale 为 `<samp class=\"listingcharacter\">de</samp>`，英语为 `<samp\
  \ class=\"listingcharacter\">en</samp>`，意大利语为 `<samp class=\"listingcharacter\"\
  >it</samp>`以此此类推。\n\n所有其他子标签都是可选的，用于进一步缩小语言范围。例如，区域子标签可以定义使用该语言的国家或地区：例如 `<samp\
  \ class=\"listingcharacter\">de-DE</samp>` locale 定义了在德国使用的德语，而 `<samp class=\"\
  listingcharacter\">de-AT</samp>` locale 定义了在奥地利使用的德语。同样，`<samp class=\"listingcharacter\"\
  >en-US</samp>` locale 定义了在美国使用的英语，而 `<samp class=\"listingcharacter\">en-UK</samp>`\
  \ locale 定义了在英国使用的英语。\n\n还可以通过脚本子标签定义要使用的类型系统。对于许多语言（如英语），这是多余的，因为只能使用一种文字系统。然而，存在像中文这样允许不同文字系统的语言。脚本子标签的可能定义在\
  \ ISO 15924 ([`en.wikipedia.org/wiki/ISO_15924`](https://en.wikipedia.org/wiki/ISO_15924))\
  \ 中。例如，`<samp class=\"listingcharacter\">de-Latn</samp>` locale 定义了拉丁字母的德语，而`<samp\
  \ class=\"listingcharacter\">de-Latf</samp>` locale 定义了哥特体的德语，`<samp class=\"listingcharacter\"\
  >zh-Hans</samp>` locale 定义了简体中文，`<samp class=\"listingcharacter\">zh-Hant</samp>`\
  \ locale 定义了繁体中文。\n\n还可以通过变体子标签定义语言的特定变体。例如`<samp class=\"listingcharacter\">de-CH-1996</samp>`\
  \ locale 代表 1996 年拼写改革后的瑞士德语。\n\n如你所见，几乎没有任何语言变体是各种子标签无法覆盖的。但并不是这些：locale 定义可以使用扩展子标签几乎任意地扩展。对于\
  \ JavaScript 而言，RFC 6067 ([`tools.ietf.org/html/rfc6067`](https://tools.ietf.org/html/rfc6067))\
  \ 中定义的 BCP 47 Extension U 在此背景下相关。该扩展之所以命名是因为字符 `<samp class=\"listingcharacter\"\
  >u</samp>`，它在定义扩展子标签时作为前缀，后跟一个键和一个值。例如，`<samp class=\"listingcharacter\">de-DE-u-co-phonebk</samp>`\
  \ locale 定义了在德国使用的德语，其排序顺序（`<samp class=\"listingcharacter\">co</samp>` 表示排序 collation）与德国电话簿相同（`<samp\
  \ class=\"listingcharacter\">phonebk</samp>` 在此处是 phonebook 的缩写）。\n\nBCP 47 Extension\
  \ U 产生的其他选项还包括使用的日历定义（通过日历的 `<samp class=\"listingcharacter\">ca</samp>` 键，例如 `<samp\
  \ class=\"listingcharacter\">de-DE-u-ca-buddhist</samp>`）、使用的货币（通过货币的 `<samp class=\"\
  listingcharacter\">cu</samp>` 键）、使用的数字系统（通过数字系统的 `<samp class=\"listingcharacter\"\
  >nu</samp>` 键）以及使用的时区（通过时区的 `<samp class=\"listingcharacter\">tz</samp>` 键）。\n\n\
  ### 12.13.2 国际化 API\n\n之前描述的各种格式化问题正是 ECMAScript 2017 国际化 API ([`tc39.github.io/ecma402/`](https://tc39.github.io/ecma402/))\
  \ 发作用的地方：它允许对数值、日期和时间进行依赖语言的格式化，并进行字符串进行依赖字符串。\n\n该 API 基于现有的国际化 API，例如 .NET Framework\
  \ 或 Java 的国际化 API。该 API 第一版本由 ECMA TC39 在 2010 年发布。目前，该 API 已发布第四版本，并被大多数浏览器支持（参见\
  \ 12.74）。对于旧版浏览器，可以使用 `Intl.js` 等补丁程序 ([`github.com/andyearshaw/Intl.js`](https://github.com/andyearshaw/Intl.js))。\n\
  \n```\nif (window.Intl && typeof window.Intl === 'object'){\n  // 支持国际化 API\n} else\
  \ {\n  // 不支持国际化 API\n} \n```\n\n**12.74 检查国际化 API 的支持情况**\n\n国际化 API 的所有对象由中心 `<samp\
  \ class=\"listingcharacter\">Intl</samp>` 对象提供。该对象提供了与开头提到的需求类似的类型：\n\n*   `<samp\
  \ class=\"listingcharacter\">Intl.Collator</samp>`\n    允许你比较字符串，考虑国际化信息\n*   `<samp\
  \ class=\"listingcharacter\">Intl.DateTimeFormat</samp>`\n    允许对日期和时间进行格式化，考虑国际化信息\n\
  *   `<samp class=\"listingcharacter\">Intl.NumberFormat</samp>`\n    允许对数值进行格式化，考虑国际化信息\n\
  \n这些类型的具体实例可以使用相应的构造函数创建，在所有情况下都将相应的 locale 作为字符串传递（参见 12.75）。\n\n```javascript\n\
  const locale = 'de_DE';\nconst dateTimeFormatGermany = new Intl.DateTimeFormat(locale);\n\
  const numberFormatGermany = new Intl.NumberFormat(locale);\nconst collactorGermany\
  \ = new Intl.Collator(locale); \n```\n\n**12.75 创建格式化实例**\n\n\n\n另一种方法是传递一个 locale（区域语言）数组而不是单个\
  \ locale（参见列表 12.76）。在这种情况下，将使用数组中用户系统支持的第一个 locale。此时，如果一个 locale 不被支持且包含多个子标记（subtags），则会依次从该\
  \ locale 中移除子标记，并使用每次创建的 locale 重新检查。如果数组中包含的所有 locale 都不被支持，则使用默认 locale。\n\n```javascript\n\
  const locales = [\n  'zh-Hant', // 检查第一个 \"zh-Hant\"，然后是 \"zh\" ...\n  'en-US',\
  \   // …然后是 \"en-US\", 然后 \"en\", ...\n  'de-DE'    // …然后是 \"de-DE\", 然后 \"de\"\
  。\n];\nconst dateTimeFormatGermany = new Intl.DateTimeFormat(locales);\nconst numberFormatGermany\
  \ = new Intl.NumberFormat(locales);\nconst collactorGermany = new Intl.Collator(locales);\
  \ \n```\n\n**列表 12.76** 指定 locale 配置创建格式化实例\n\n此外，所有构造函数都可以传递一个配置对象作为第二个参数，用于控制进一步的方面（详细内容稍后会介绍）。\n\
  \n#### 注意\n\n你可以通过使用 `Intl.Collator.supportedLocalesOf()`、`Intl.DateTimeFormat.supportedLocalesOf()`\
  \ 和 `Intl.NumberFormat.supportedLocalesOf()` “静态”方法来确定某个 locale 是否被支持（参见列表 12.77）。这些方法中的每个都接受单个\
  \ locale 或 locale 数组作为参数，并返回传入的 locale 中受支持的的数组。\n\n```javascript\nconst locales\
  \ = ['zh-Hant', 'en-US', 'de-DE'];\nconsole.log(Intl.Collator.supportedLocalesOf(locales));\n\
  console.log(Intl.DateTimeFormat.supportedLocalesOf(locales));\nconsole.log(Intl.NumberFormat.supportedLocalesOf(locales));\n\
  ```\n\n**列表 12.77** 通过辅助函数创建格式化实例\n\n除了国际化 API 中定义的类型及其方法外，以下方法也适用于标准的 `Array`、`String`、`Number`\
  \ 和 `Date` 对象（这些对象不属于此 API，但也考虑了相应的 locale 信息）：\n\n* `Array.prototype.toLocaleString`\n\
  * `String.prototype.localeCompare`\n* `String.prototype.toLocaleLowerCase`\n* `String.prototype.toLocaleUpperCase`\n\
  * `Number.prototype.toLocaleString`\n* `Date.prototype.toLocaleString`\n* `Date.prototype.toLocaleDateString`\n\
  * `Date.prototype.toLocaleTimeString`\n\n### 12.13.3 比较字符字符串表达式\n\n`Collator` 类型用于比较字符串。为此，它提供了\
  \ `compare()` 方法，该方法接受两个字符串作为参数，并返回三个数值值之一：如果第一个字符串“大于”第二个字符串（即它在排序中位于第二个字符串之后），返回\
  \ 1；如果第二个字符串“大于”第一个字符串，返回 -1；如果两个字符串相等，则返回 0（参见列表 12.78）。\n\n```javascript\nconst\
  \ nameCollator = new Intl.Collator('de-DE');\nconsole.log(nameCollator.compare('Mustermann',\
  \ 'Meier'));  // 1\nconsole.log(nameCollator.compare('Meier', 'Mustermann'));  //\
  \ -1\nconsole.log(nameCollator.compare('Meier', 'Meier'));       // 0 \n```\n\n\
  **列表 12.78** 考虑本地化信息的字符串比较\n\n两个字符串的比较方式或应用的规则可以通过配置对象的 `sensitivity` 属性进一步自定义，该属性可以作为第二个参数传递给\
  \ `Collator` 构造函数。例如，`base` 值确保所有具有相同基字（例如字母 á、a 和 A）的字符被解释为具有相同的值（参见列表 12.79）。\n\
  \n```javascript\nconst nameCollator = new Intl.Collator('de-DE');\nconst nameCollatorBase=\
  \ new Intl.Collator('de-DE',\n  {\n    sensitivity: 'base'\n  }\n);\nconsole.log(nameCollator.compare('Mueller',\
  \ 'mueller'));\n// 返回值 1，因为 \"M\" 和 \"m\" 被解释为不同的\nconsole.log(nameCollatorBase.compare('Mueller',\
  \ 'mueller'));\n// 返回值 0，因为 \"M\" 和 \"m\" 被解释为相等的 \n```\n\n**列表 12.79** 考虑本地化信息的字符串比较\n\
  \n`compare()` 方法也可以方便地用于数组排序，如列表 12.80 所示。记住，`sort()` 数组方法可以可选地传递一个排序或比较函数，该函数将成对对相应数组中的元素进行比较，从而创建排序。如果你像示例那样传递相应\
  \ collator 的 `compare()` 方法，它可以为你完成排序工作。\n\n```javascript\nconst names = [\n  'Mustermann,\
  \ Max',\n  'Müller, Max',\n  'Mustermann, Moritz',\n  'Mueller, Moritz',\n  'Meier,\
  \ Petra',\n  'Meier, Peter'\n  ];\nconst nameCollator = new Intl.Collator('en',\
  \ {usage: 'sort'});\nconsole.log(names.sort(nameCollator.compare));\n// [\n// \"\
  Meier, Peter\",\n// \"Meier, Petra\",\n// \"Mueller, Moritz\",\n// \"Müller, Max\"\
  ,\n// \"Mustermann, Max\",\n// \"Mustermann, Moritz\"\n// ]\n```\n\n**列表 12.80**\
  \ 使用 Intl.Collator 排序\n\n在 collator 配置对象上可以设置的所有属性概述见表 12.17。\n\n| 属性 | 事件/说明 |\n\
  | --- | --- |\n| `localeMatcher` | 要使用的匹配算法。 |\n| `usage` | 指定由 collator 进行比较是用于排序还是字符串。可能的值分别为\
  \ `sort` 和 `search`。 |\n| `sensitivity` | 指定哪些字符被视为不相等。可能的值有 `base`、`accent`、`case`\
  \ 和 `variant`。 |\n| `ignorePunctuation` | 布尔值，指定是否忽略标点符号。 |\n| `numeric` | 布尔值，指定是否以数值方式比较字符串（例如\
  \ \"1\" < \"5\" < \"10\"）。 |\n| `caseFirst` | 布尔值，指定排序时小写字母还是大写字母在前。 |\n\n**表 12.17**\
  \ Intl.Collator 配置选项概述\n\n### 12.13.4 格式化日期和时间\n\n如前，`DateTimeFormat` 类型允许对日期和时间进行格式化。为了实现这一点，它提供了\
  \ `format()` 方法，该方法接受一个 `Date` 实例作为参数，并返回一个对应日期对象配置的字符串（参见列表 12.81 和列表 12.82）。配置选项的完整列表见表\
  \ 12.18。\n\n\n\n\n\n作为使用 `DateTimeFormat` 的替代方案，也可以直接在相应的 `Date` 对象实例上使用 `toLocaleString()`、`toLocaleDateString()`\
  \ 和 `toLocaleTimeString()` 方法。如前所述，这些方法也会考虑传递给方法调的 locale（语言/区域）信息。\n\n```javascript\n\
  const date = new Date(Date.UTC(2021, 8, 15, 8, 0, 0));\nconsole.log(new Intl.DateTimeFormat('de').format(date));\
  \    // 15.9.2021\nconsole.log(new Intl.DateTimeFormat('en-US').format(date)); //\
  \ 9/15/2021\nconsole.log(new Intl.DateTimeFormat('en-GB').format(date)); // 15/09/2021\n\
  console.log(date.toLocaleString('de'));                // 15.9.2021, 10:00:00\n\
  console.log(date.toLocaleString('en-US'));             // 9/15/2021, 10:00:00 AM\n\
  console.log(date.toLocaleString('en-GB'));             // 15/09/2021, 10:00:00\n\
  console.log(date.toLocaleDateString('de'));            // 15.9.2021\nconsole.log(date.toLocaleDateString('en-US'));\
  \         // 9/15/2021\nconsole.log(date.toLocaleDateString('en-GB'));         //\
  \ 15/09/2021\nconsole.log(date.toLocaleTimeString('de'));            // 10:00:00\n\
  console.log(date.toLocaleTimeString('en-US'));         // 10:00:00 AM\nconsole.log(date.toLocaleTimeString('en-GB'));\
  \         // 10:00:00 \n```\n\n**Listing 12.81** 格式化日期和时间\n\n```javascript\n...\n\
  console.log(new Intl.DateTimeFormat('en-US', {\n  year: '2-digit',\n  month: '2-digit'\n\
  }).format(date)); \n// 09/21\n\nconsole.log(new Intl.DateTimeFormat('en-US', {\n\
  \  year: '2-digit',\n  month: '2-digit',\n  day: '2-digit',\n  hour: '2-digit',\n\
  \  minute: '2-digit',\n  second: '2-digit'\n}).format(date)); \n// 09/15/21, 10:00:00\
  \ AM\n\nconsole.log(new Intl.DateTimeFormat('en-US', {\n  weekday: 'long',\n  era:\
  \ 'long',\n  year: '2-digit',\n  month: '2-digit',\n  day: '2-digit',\n  hour: '2-digit',\n\
  \  minute: '2-digit',\n  second: '2-digit',\n  timeZoneName: 'long'\n}).format(date));\n\
  // Wednesday, 09 15, 21 Anno Domini, \n// 10:00:00 AM Central European Summer Time\n\
  \nconsole.log(new Intl.DateTimeFormat('de', {\n  weekday: 'long',\n  era: 'long',\n\
  \  year: '2-digit',\n  month: '2-digit',\n  day: '2-digit',\n  hour: '2-digit',\n\
  \  minute: '2-digit',\n  second: '2-digit',\n  timeZoneName: 'long'\n}).format(date));\n\
  // Mittwoch, 15\\. 09 21 n. Chr., \n// 10:00:00 Mitteleuropäische Sommerzeit\n\n\
  const formatter = new Intl.DateTimeFormat('de', {\n  weekday: 'long',\n  era: 'long',\n\
  \  year: '2-digit',\n  month: '2-digit',\n  day: '2-digit',\n  hour: '2-digit',\n\
  \  minute: '2-digit',\n  second: '2-digit',\n  timeZoneName: 'long'\n});\nconsole.log(formatter.resolvedOptions());\n\
  /*\n{\n  locale: 'de',\n  calendar: 'gregory',\n  numberingSystem: 'latn',\n  timeZone:\
  \ 'Europe/Berlin',\n  hourCycle: 'h23',\n  hour12: false,\n  weekday: 'long',\n\
  \  era: 'long',\n  year: '2-digit',\n  month: '2-digit',\n  day: '2-digit',\n  hour:\
  \ '2-digit',\n  minute: '2-digit',\n  second: '2-digit',\n  timeZoneName: 'long'\n\
  }\n*/ \n```\n\n**Listing 12.82** 格式化日期和时间\n\n| 属性 | 描述 |\n| --- | --- |\n| `localeMatcher`\
  \ | 要使用的匹配算法。 |\n| `timeZone` | 要使用的时区。 |\n| `hour12` | 布尔值，指定使用 12 小时制还是 24 小时制作为基础。\
  \ |\n| `formatMatcher` | 要使用的匹配算法。 |\n| `weekday` | 格式化星期几的。可能的值有 `narrow`、`short`\
  \ 和 `long`。 |\n| `era` | 格式化年代（纪）的。可能的值有 `narrow`、`short` 和 `long`。 |\n| `year`\
  \ | 格式化年份的。可能的值有 `numeric` 和 `2-digit`。 |\n| `month` | 格式化月份的。可能的值有 `numeric`、`2-digit`、`narrow`\
  \ 和 `short`。 |\n| `day` | 格式化日期的。可能的值有 `numeric` 和 `2-digit`。 |\n| `hour` | 格式化小时的。可能的值有\
  \ `numeric` 和 `2-digit`。 |\n| `minute` | 格式化分钟的。可能的值有 `numeric` 和 `2-digit`。 |\n\
  | `second` | 格式化秒的。可能的值有 `numeric` 和 `2-digit`。 |\n| `timeZoneName` | 格式化时区的。可能的值有\
  \ `short` 和 `long`。 |\n\n**Table 12.18** `Intl.DateTimeFormat` 配置选项概览**\n\n### 12.13.5\
  \ 格式化数值\n\n数值的格式化在原理上与日期和时间的格式化相似：`NumberFormat` 的构造函数期望第一个参数为 locale，可选的第二个参数为配置对象，用于进一步细化格式化。例如，可以使用\
  \ `useGrouping` 属性定义是否使用分隔符（例如千分位分隔符），可以使用 `currency` 属性定义货币（如果该数字应格式化为货币金额），而 `minimumFractionDigits`\
  \ 和 `maximumFractionDigits` 属性可用于定义数字应有的最小或最大小数位数。更多示例可见 [Listing 12.83]，配置选项的完整概览可以在\
  \ [Table 12.19] 中找到。\n\n```javascript\nconst number = 123456.789;\nconsole.log(\n\
  \  new Intl.NumberFormat(\n    'de-DE',\n    {\n      style: 'currency',\n     \
  \ currency: 'EUR'\n    }\n  )\n  .format(number)\n);\n// 123.456,79 €\n\nconsole.log(\n\
  \  new Intl.NumberFormat(\n    'en-US',\n    {\n      style: 'currency',\n     \
  \ currency: 'EUR'\n    }\n  )\n  .format(number)\n);\n// €123,456.79\n\nconsole.log(\n\
  \  new Intl.NumberFormat(\n    'de-DE',\n    {\n      style: 'currency',\n     \
  \ currency: 'USD'\n    }\n  )\n  .format(number)\n);\n// 123.456,79 $\n\nconsole.log(\n\
  \  new Intl.NumberFormat(\n    'en-US',\n    {\n      style: 'currency',\n     \
  \ currency: 'USD'\n    }\n  )\n  .format(number)\n);\n// $123,456.79\n\nconsole.log(\n\
  \  new Intl.NumberFormat(\n    'de-DE',\n    {\n      style: 'currency',\n     \
  \ currency: 'EUR',\n      maximumSignificantDigits: 5\n    }\n  )\n  .format(number)\n\
  );\n// 123.460 €\n\nconsole.log(\n  new Intl.NumberFormat(\n    'de-DE',\n    {\n\
  \      style: 'currency',\n      currency: 'EUR',\n      minimumFractionDigits:\
  \ 5\n    }\n  )\n  .format(number)\n);\n// 123.456,78900 € \n```\n\n**Listing 12.83**\
  \ 格式化数值\n\n\n\n\n\n| `style` | 所使用的格式化样式。可用选项有：`decimal` 用于普通数字格式，`currency` 用于货币格式，以及\
  \ `percent` 用于百分比。 |\n| `currency` | 货币格式中使用的货币——例如，用于欧元的 `EUR` 或用于美元的 `USD`。 |\n\
  | `currencyDisplay` | 货币在货币格式中的显示方式规范。可能的值有：`symbol` 使用符号，`code` 使用相应的 ISO 货币代码，或\
  \ `name` 使用货币名称（如 `Euro`、`Dollar`）。 |\n| `useGrouping` | 布尔值，指定是否应该使用分隔符（例如，千分位分隔符）（例如\
  \ `1,000,000`）。 |\n| `minimumIntegerDigits` |  格式化时数字应具有的最小整数位数。如果数字未达到此最小位数，将从开头开始填充\
  \ 0。 |\n| `minimumFractionDigits` | 格式化时数字应具有的最小小数位数。如果数字未达到此最小位数，将从最后一位开始填充 0。\
  \ |\n| `maximumFractionDigits` | 格式化时数字应具有的最大小数位数。如果数字位数更多，则将进行相应的舍入。 |\n| `minimumSignificantDigits`\
  \ | 格式化时数字应具有的最小有效数字位数。如果数字未达到此最小位数，将从最后一位开始填充 0。 |\n| `maximumSignificantDigits`\
  \ | 格式化时数字应具有的最大有效数字位数。如果有效数字位数更多，则将进行相应的舍入。 |\n\n**表 12.19** `Intl.NumberFormat`\
  \ 配置选项概览\n\n## 12.14 各种 Web API 概述\n\n虽然我们没有在本章中描述所有的 Web API，但你已经有了了良好的了解，并将能够相对快速地自学其他\
