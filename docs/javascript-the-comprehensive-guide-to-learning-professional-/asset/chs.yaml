  \ Ackermann\n\n德国，莱茵河\n\n# 1 基础与简介\n\n在我们开始创建 JavaScript 程序之前，本章将为你概述什么是编程、分什么类型的编程语言，以及\
  \ JavaScript 语言的历史背景：这种语言多年来是如何演变的？JavaScript 和 ECMAScript 之间是什么关系？此外，我们将介绍 JavaScript\
  \ 的各种应用领域，并解释这些领域在近年来也发生了变化。\n\n本书的设计不仅是为了教你 JavaScript 语言，还向你介绍基础编程概念，以防你尚未熟悉任何编程语言。因此，在这个介绍章节中，我们将首先解释一些对全书都有帮助的基本术语和概念。如果你已经有一些编程经验，可以至少跳过本章的第一部分。另一方面，我们特意保持了这部分的简短，因为我们不想用编程理论论文让你感到无味，而是让你快速开始学习\
  \ JavaScript。因此，你也可以将这部分视为快速复习。\n\n在进入正题之前，关于本书还有一点说明：偶尔在讨论某些主题时，我们会提到之后才会详细解释的概念。通常情况下，在关于编程语言的书中并不能总是避免这一点。在某种程度上，作为作者，你面临着鸡生蛋的问题：没有一个就无法解释另一个，反之亦然。在这种情况下，为了清晰起见，我们包含了对详细讨论相应概念的章节或部分的引用。\n\
  \n## 1.1 编程基础\n\n在开始实际编程之前，你需要对编程的本质有一定的基本理解。我们为什么要写程序？程序是如何工作的？JavaScript 在此背景下起着什么角色？这种语言与其他编程语言有何不同？\n\
  \n### 1.1.1 与计算机通信\n\n让我们先从我们为什么要写程序开始，或者说，我们通过这样做追求什么目标。首先，编程是为了让计算机接管某些任务。这些任务可以是，例如我们人类难以自己解决的复杂问题，或者帮助我们在日常生活中工作得更有效。例如，想想文字处理器、电子邮件程序或你的浏览器。所有这些工具都是由人编写的。\n\
  \n简单来说，开发者的任务是给计算机下指令，使其能够执行给它的任务。换句话说，作为开发者，你为解决特定问题制定具体的步骤，例如对表格中的数据进行排序或验证网页上输入的表单数据。然后，计算机将逐一评估这些步骤。这大致类似于比饪食谱。在在那里，也定义了你需要遵循以实现目标的各个步骤。在编程中，开发者就是为计算机提供供遵循的食谱的人。\n\
  \n总而言之，计算机科学和软件开发中解决问题的步骤（即食谱）通常被称为 `algorithms`。因此，程序（也称为软件或应用程序）是 `algorithms`\
  \ 的序列，因此是一个可以由计算机执行的指令序列。\n\n###### 定义\n\n在软件开发中，解决问题的定义的步骤统称为 `algorithm`。这类似于烹饪食谱、操作说明或手册。从这个意义上说，`algorithm`\
  \ 是解决特定问题的计算机指令。\n\n###### 定义\n\n一个程序或软件由许多不同的 `algorithms` 组成。\n\n\n\n\n\n刚开始，编程初学者往往发现很难像计算机一样思考，并相应地定义算法中的步骤。毕竟，计算机会以非常精确的方式执行你提供给它的指令。虽然你作为人类在阅读烹饪食谱时可以随时动脑，并根据经验改变某些步骤，但计算机假设你制定的步骤应该按照设定的方式精确执行。相反，这意味着你作为开发者必须以同样精确的方式制定指令，并将自己置于计算机的位置。\n\
  \n### 贴士\n当我在 2000 年开始编程时，我一直在想，人到底是如何学会编写程序的，并对那些经验丰富的开发者的知识深感佩服。多年以后，我可以告诉你：你只有通过亲手实践才能学会。因此，你不光要读这本书，更要通过实践完成它，并一次一次自己创建程序。然而，不要给自己太大的压力，如果某些事情没有立即生效，不要感到焦虑。毕竟，作为一个开发者，你比任何事情都需要的都是毅力，以及每天学习新事物的意愿。\n\
  \n### 1.1.2 编程语言\n\n从深层来说，计算机处理的是 0 和 1；这是众常识。对于“0 和 1”，更专业的术语是二进制码、机器码或机器语言。这种二进制码的背景是仅识别两种状态的技术层面：0\
  \ 代表“关机”，1 代表“开机”。\n\n简单来说，0 和 1 的各种组合最终让计算机硬件执行各种操作，例如在你的显示器上显示某种特定颜色的像素点、响应鼠标移动或键盘输入，或者通过网络发送电子邮件。\n\
  \n但由于对于像我们这样的开发者来说，用 0 和 1 来为计算机描述指令将极其复杂（且耗时极不成比例），聪明人在某个时候发明了编程语言，这抽象并简化了这种与计算机的交互。\n\
  \n编程语言可以根据其抽象程度进一步分为不同的类别。`JavaScript` 是所谓的高级编程语言之一，因此它相对于 0 和 1 抽象得非常远。另一方面，汇编语言的抽象程度低得多。它们不需要你直接处理\
  \ 0 和 1，但使用的命令仍然相对晦涩，编程过程也相对复杂（参见图 1.1）。另一方面，你很快就会发现，在你适应之后，在 `JavaScript` 中使用的命令非常朗口、易懂且易记。\n\
  \n### 备注\n`JavaScript` 是一种高级编程语言。\n\n![高级编程语言从机器码抽象出来](img/img-f1.1.html)\n\n**图\
  \ 1.1** 高级编程语言从机器码抽象出来\n\n作为开发者，你通过编程语言编写的所有内容都存储在普通的文本文件中，称为源文件。此类文件的内容被称为源文本或源代码。\n\
  \n### 定义\n源代码是你作为开发者在给定的编程语言中编写的内容。另一方面，机器码是指计算机读取并执行的代码。\n\n为了让计算机理解并实现源代码中编写的指令，源代码必须被转换为计算机可以理解的格式——即之前提到的由\
  \ 0 和 1 组成的机器码（参见图 1.2）。\n\n![开发者可理解的源代码必须转换为计算机可理解的机器码以便其执行](img/img-f1.2.html)\n\
  \n**图 1.2** 开发者可理解的源代码必须转换为计算机可理解的机器码以便其执行\n\n基本上，有两种不同的方法可以实现这一点：通过编译器或通过解释器。（对这两者的解释稍后将给出。）根据编程语言使用的是编译器还是解释器，它可以被分为编译型编程语言、解释型编程语言或所谓的中间语言。\n\
  \n在我们解释这三种语言类型之间的具体区别并澄清编译器或解释器是什么之前，让我们注意一点：`JavaScript` 是一种解释型编程语言。这有优点，但也有缺点，正如我们稍后看到的。\n\
  \n#### 编译型编程语言\n在编译型编程语言的情况下，编译器将源代码转换为机器码或可执行的机器码文件（参见图 1.3）。这是通过将源代码中编写的指令转换为计算机的一系列指令来实现的。通过这种方式编译器生成的程序可以直接在其编译的操作系统上运行，无需任何其他辅助组件。\n\
  \n![编译器将源代码转换为可执行的机器码](img/img-f1.3.html)\n\n**图 1.3** 编译器将源代码转换为可执行的机器码\n\n编译型编程语言的示例包括\
  \ `C` 和 `C++`。例如，为了运行用 `C++` 编写的程序，必须先使用适当的 `C++` 编译器进行转换。但由于后者在操作系统之间存在差异，必须为每个操作系统编译一个单独的版本（参见图\
  \ 1.4）。\n\n![例如，C++ 是一种编译型编程语言](img/img-f1.4.html)\n\n**图 1.4** 例如，C++ 是一种编译型编程语言\n\
  \n为此，每个操作系统都需要一个独立的编译器。要在 Windows 上运行程序，必须先在 Windows 上使用相应的编译器编译。要在 Linux 上运行，必须在\
  \ Linux 上用编译器编译，如果要在 Mac 上运行，情况也是如此。虽然有一种方法在一个操作系统上编译代码并在另一个操作系统上运行（例如在 Linux 上编译并在\
  \ Windows 上运行，反之亦然；这种技术被称为交叉编译），但这并没有改变你必须花费大量精力让 `C++` 程序在不同操作系统上运行的事。我们还没有考虑处理器架构（32\
  \ 位和 64 位），每种架构都需要不同的编译方法。\n\n尽管需要付出巨大的努力，编译型程序仍然有一个我们顺带提到的关键优势：每种情况下生成的机器码可以在相应的操作系统上执行，无需辅助工具。因此，运行编译为机器码的程序不需要在操作系统上安装任何程序。这与即将讨论的解释型程序有显著区别。\n\
  \n### 定义\n为特定操作系统编译的程序也称为原生程序或原生应用。\n\n#### 解释型编程语言\n对于解释型编程语言，没有必要编译源代码。源代码不是由编译器翻译的，而是由解释器评估的（参见图\
  \ 1.5）。这种解释器必须安装在要运行程序的计算机（或相应的操作系统）上（与编译器相反，编译器只需要安装在编译相应源代码的计算机上）。\n\n![解释器直接评估源代码并逐指令将其转换为机器码](img/img-f1.5.html)\n\
  \n\n\n\n\n# 图 1.5 解释器直接评估源代码并逐条指令将其转换为机器码\n\n因此，如前文所述，JavaScript 是一种解释型编程语言（参见图\
  \ 1.6）。这意味着你基本上可以使用任何文本编辑器来编写 JavaScript 程序，并直接在浏览器中执行源代码，而无需任何额外的中间步骤。\n\n![JavaScript\
  \ 是一种由 JavaScript 解释器评估的解释型编程语言](img/img-f1.6.html)\n\n**图 1.6** 是一种由 JavaScript\
  \ 解释器评估的解释型编程语言\n\n### 注意\n在开发者社区中，解释型语言非常受欢迎，因为它们允许较快的开发，这正是因为省略了额外的编译步骤。\n\n因此，解释型编程语言需要一个解释器来执行程序。这通常是所谓的运行时环境（RTE）的一个组件。RTE\
  \ 用于允许应用程序在指定的操作系统上运行。除了解释器之外，RTE 还提供一些基本功能，如读写文件以及访问外围设备（鼠标、键盘、打印机等）。\n\n在大多数情况下以及刚开始，你可能会使用许多已经包含\
  \ JavaScript RTE 的浏览器之一，因为它们可以原生解释 JavaScript。但也有可用的 RTE 可以让你在浏览器运行 JavaScript 应用程序。\n\
  \n### 检查对单个语言特性的支持\n不同的 RTE 在支持的 JavaScript 语言特性方面有所不同。你可以在 [www.caniuse.com](http://www.caniuse.com)\
  \ 网站上找到很好的概述。\n\n近年来非常流行的 RTE 之一是 Node.js。我们甚至为这个主题专门编写了一个章节（第 17 章）。其他 JavaScript\
  \ 解释器在体积上非常小（因此所需的磁盘空间很少），也适合在微控制器上运行 JavaScript。第 20 章 将讨论这一主题。\n\n除了 JavaScript\
  \ 的 RTE 之外，其他编程语言也有 RTE。著名的例子包括用于运行 Java 程序的 Java 运行时环境 (JRE) 或微软的 .NET 通用运行时 (CLR)，它可以运行用\
  \ C#、Visual Basic 或 C++ 编写的程序。\n\n图 1.7 再次展示了 RTE 原理与原生应用程序关系的概述。\n\n![运行时环境的原理](img/img-f1.7.html)\n\
  \n**图 1.7** 运行时环境的原理\n\n### 注意\nJavaScript 不是编译型语言，而是解释型语言。\n\n编译器和解释器两种方法都有优点，但也有缺点。表\
  \ 1.1 显示了简要总结。\n\n| 编译器 | 解释器 |\n| --- | --- |\n| 程序每次执行都必须重新编译。 | 程序可以直接执行。 |\n\
  | 通常提供非常优异的性能，因为源代码不需要在运行时转换。 | 效率通常比编译型程序低，因为源代码转换发生在程序运行时。现在，在这种语境下经常使用所谓的即时编译（JIT）编译器。它们将源代码或频繁执行的代码转换为机器码，然后可以较快地执行。\
  \ |\n| 由于额外的编译步骤，可以更快地检测语法错误。 | 因为语法错误只在运行时检测，它们很容易被忽略。 |\n\n**表 1.1** 编译器和解释器的优缺点\n\
  \n### 中间语言\n有些编程语言无法被明确地归入上述两种类别之一（编译型和解释型），因为它们同时使用了编译器和解释器。例如，在 Java 中，源代码由编译器编译成所谓的字节码（一种中间代码），字节码反过来又需要一个解释器才能执行（参见图\
  \ 1.8）。\n\n![也存在某些结合了编译器和解释器的编程语言](img/img-f1.8.html)\n\n**图 1.8** 也存在某些结合了编译器和解释器的编程语言\n\
  \n这种方法的优点是，Java 应用程序不需要在以后运行的相同操作系统上编译（与编译型语言相反），因为字节码独立于操作系统。在相应的目标操作系统上唯一需要的是一个字节码的解释器——换句话说，就是\
  \ Java 的运行时环境（参见图 1.9）。\n\n![Java 编程语言是使用编译器和解释器的语言示例](img/img-f1.9.html)\n\n**图\
  \ 1.9** Java 编程语言是使用编译器和解释器的语言示例\n\n### 不同编程语言概述\n你现在了解了编译型和解释型编程语言之间的区别，也知道存在结合了两种方法的中间语言。你还学习了每类中的一个例子：C\
  \ 或 C++ 作为编译型语言示例，Java 作为中间语言示例，最后是 JavaScript 作为解释型语言示例。但其他著名的编程语言呢？你可以在表 1.2 中找到精精。\n\
  \n| 编程语言 | 类型 |\n| --- | --- |\n| Ada | 编译型 |\n| BASIC | 解释型 |\n| C | 编译型 |\n| C++\
  \ | 编译型 |\n| C# | 编译型 |\n| COBOL | 编译型 |\n| Fortran | 编译型 |\n| Go | 编译型 |\n| Java\
  \ | 中间语言 |\n| JavaScript | 解释型 |\n| Lisp | 中间语言 |\n| Objective-C | 编译型 |\n| Perl\
  \ | 解释型 |\n| PHP | 解释型 |\n| Python | 解释型 |\n| Ruby | 解释型 |\n| Rust | 编译型 |\n| Swift\
  \ | 编译型 |\n| Visual Basic | 编译型 |\n\n**表 1.2** 不同编程语言的分类\n\n### 1.1.3 程序设计的工具\n\
  作为开发者，你往往迫不及待想要开始实现算法——但在过程中应过于匆忙。最好先考虑算法的结构：解决给定问题需要哪些具体的步骤？有哪些特殊情况需要考虑？算法需要什么输入数据？应该返回什么结果？\n\
  \n在实现算法时，最好遵循以下步骤：\n\n1.  设定算法目标\n    你想通过算法实现什么？你想让计算机为你解决什么问题？是否有计算？是否有数据需要排序或检查用户输入？\n\
  2.  定义步骤\n    将问题分解为各个步骤。这些步骤按什么顺序执行？步骤之间有什么关系？某些步骤需要重复执行吗？或者在特定条件下执行？\n3.  编写算法\n\
  \    为了让计算机理解你的算法，你需要用编程语言编写它。在这种情况下，是 JavaScript。接下来的近 1300 页将帮助你完成这一点。\n\n####\
  \ 定义\n在编程语境下，实现是指使用特定的编程语言实现算法（更宽泛地说实现程序流）。\n\n\n\n\n\n问题越复杂，在实现之前思考每一个步骤就越重要。\n\
  \n## 流程图\n\n流程图，也称为程序流程图，是用于描述算法的图形化表示，允许你精确地定义单个步骤和整体流程。作为一名开发者，你的经验越丰富，且问题越简单，你就越可能避免预先绘制流程图。然而，在其他情况下，流程图对于清晰地理解算法的功能非常有帮助。请相信我：尽管初看这似乎是多余的（毕竟在画完流程图后你仍然需要编写相应的源代码），但合理的规划在后期会有回报。事实是，算法或前期问题越复杂，前期工作就越值得。\n\
  \n流程图本质上由由线条连接的不同形状的框组成。图 1.10 显示了一个流程图示例。它说明了网站登录过程的程序流程。如果输入的用户名和密码组合有效，则加载用户配置并重定向到欢迎页面。如果输入错误，且尚未超过最大失败登录次数，则显示错误信息并将用户重定向回登录页面。另一方面，如果超过了最大失败登录次数，则应锁定用户并向负责管理员发送通知邮件。\n\
  \n![流程图示例](img/img-f1.10.html)\n\n**图 1.10** 流程图示例\n\n流程图中的元素将在后文中描述。表 1.3 也给出了这些元素的概述。\n\
  \n开始/停止控制点用于描述算法的开始和结束。它们在流程图中被表示为圆角矩形。它们通常包含“开始（Start）”、“开始（Begin）”、“停止（Stop）或“结束（End）”标签，或者包含算法名称的更详细文字，例如示例中的“开始登录”、“登录失败”或“登录成功”。\n\
  \n算法的单个语句或操作在流程图中由普通矩形表示。作为标签，它们包含对每个步骤要执行内容的简短且意义的描述——例如“创建用户会话”。\n\n程序的输入和输出由平行四形表示。它们也标有简短描述，说明程序预期的什么类型的输入（例如“输入用户名和密码”）或将生成什么类型的输出（例如“显示错误信息”或“显示欢迎页面”）。\n\
  \n如果在算法的某一点需要决定执行以下指令中的哪一个，则在流程图中使用决策点进行描述，图形上表示为正菱形，每个菱形引引出两条路径。根据规则，它们被标记为可以用“是”或“否”回答的问题，或者可以用两个可能的答案中的一个回答的问题。这是因为决策点用于根据特定答案在流程图中遵循某条路径或另一条路径。答案写在从决策点引出的相应线上。示例中的决策点之一用于检查输入的凭据是否有效。如果\
  \ true（即如果对“访问数据有效吗？”的问题回答为“是”），则遵循图表右侧所示的路径。如果不是，则遵循图表左侧所示的路径。\n\n左右两侧各有一条线的矩形用于定义对子程序（或子算法）的调用，子程序同样由各种步骤组成。在流程图中，它们描述了锁定用户和向管理员发送通知邮件的子程序。\n\
  \n| 元素 | 标签 | 描述 |\n| --- | --- | --- |\n| ![内联图像](img/01_010_01.png) | 开始/停止检查点\
  \ | 用于描述算法的开始和结束 |\n| ![内联图像](img/01_010_02.png) | 操作 | 用于描述算法的单个语句或操作 |\n| ![内联图像](img/01_010_03.png)\
  \ | 输入和输出 | 用于描述输入或输出 |\n| ![内联图像](img/01_010_04.png) | 决策点 | 用于描述算法中的分支 |\n| ![内联图像](img/01_010_05.png)\
  \ | 执行子程序 | 用于描述对子程序的调用 |\n| ![内联图像](img/01_010_06.png) | 连接 | 用于连接流程图中的单个元素并描述算法的流程\
  \ |\n\n**表 1.3** 流程图最重要的元素\n\n### 流程图中的其他元素\n\n还有几个你可以在流程图中使用的元素，但它们并不常用，而且我们在书中剩余示例中不需要它们。例如，你可以在\
  \ [`en.wikipedia.org/wiki/Flowchart`](https://en.wikipedia.org/wiki/Flowchart) 找到这些元素的概述。\n\
  \n### 流程图独立于编程语言\n\n流程图的另一个优势是它们独立于所使用的编程语言。在我们的情况下，这并不重要（毕竟我们想用 JavaScript 编程），但原则上讲，这可以被视为优势。\n\
  \n## 伪代码\n\n作为流程图的替代（或补充），你还可以为程序设计创建所谓的伪代码。这意味着你用较接近自然语言而非具体的编程语言来编写算法的各个步骤。列表\
  \ 1.1 显示了将 图 1.10 中的算法转换为伪代码。\n\n```\n程序开始登录\n  读取用户名和密码\n  如果用户数据有效则\n    创建用户会话\n\
  \    显示欢迎页面\n  否则 \n    如果达到最大登录次数则\n      调用子程序锁定用户\n      调用子程序向管理员发送邮件\n    \
  \  显示错误信息\n      退出程序\n    否则\n      显示错误信息\n      重定向到输入\n      跳转到输入\n程序结束登录\n\
  ```\n\n**列表 1.1** 伪代码示例\n\n与预先确定使用元素的流程图不同，伪代码在这方面没有限制。根据规则，你使用诸如“读取”、“如果...那么...否则”、“显示”、“输出”、“当...一直执行”等词汇和句子成分。从流程图到伪代码的元素近似翻译见\
  \ 表 1.4。\n\n伪代码的一个基本特征（这也显示了与真实源代码的相似性）是行首的缩进。正如你在 列表 1.1 中看到的，取决于相应程序行而执行的程序行向右进一步缩进（通常缩进二到四个空格）。\n\
  \n| 伪代码 | 流程图元素 |\n| --- | --- |\n| `program start`, `program end` | 开始/停止检查点 |\n\
  | 以动词开头的活动句子，如 `create`, `show` 等 | 操作 |\n| `read`, `output` | 输入和输出 |\n| `if ...`\
  \ `else` | 决策点 |\n| `as long as ...` `execute` | 重复 |\n| `subroutine call` | 执行子程序\
  \ |\n\n**表 1.4** 伪代码中的句子成分与流程图元素之间的关系\n\n\n\n\n伪代码的优势与流程图一样，在于你可以预先思考算法的执行流，而不需要直接从你所选的编程语言的实现开始。虽然你写的文本与后后的源代码非常相似，但你不需要处理相应编程语言的语法特殊性。这让你能够完全专注于算法流程。此外，特别是对于更复杂的算法，伪代码比流程图要紧凑得多。\n\
  \n## 流程图、伪代码与编程语言\n\n在本书的课程中，你会发现编程语言中存在某些语言结构（在这里特指 `JavaScript`），流程图和伪代码都可以相对容易地应用于这些结构。\n\
  \n## 1.2 JavaScript 简介\n\n既然我们已经概括了了编程语言，本节将对 `JavaScript` 进行简要概述，但不会涉及该语言的细节。从本质上说，它将提供该语言的简要历史回顾，并介绍目前\
  \ `JavaScript` 使用的各种应用领域。\n\n### 1.2.1 历史\n\n编程语言的历史通常相当枯燥，很少非常有趣。出于这个原因，我们将本节尽量写短，只给出最重要的要点，而不涉及版本细节等内容。\n\
  \n与软件程序一样，编程语言也会不时更新。在这种情况下，编程语言会添加新功能以使开发人员的工作更容易，而其他在过去引起问题或简单少使用的功能则会被舍弃。因此，过去\
  \ `JavaScript` 也有不同的版本。\n\n`JavaScript` 的历史始于 1995 年，当时 Brendan Eich 在两周的创纪录时间内为\
  \ `Netscape Navigator`（现已过时的浏览器）设计了这种语言。起初，`JavaScript` 还没有现在的名称；它最初被称为 `Mocha`\
  \ 和 `LiveScript`。由于 Netscape 和 Sun（`Java` 编程语言背后的公司）之间的合作以及出于营销考虑（`Java` 编程语言在当时已经非常流行），该语言最终被重命名为\
  \ `JavaScript`。然而，该名称与 `Java` 的相似性不应让你草早下结论：除了名字相似，这两种语言几乎没有共同之处。\n\n在 `JavaScript`\
  \ 发布后不久，微软为 `Internet Explorer 3.0` 推出了与其兼容的语言（`JScript`）。为了协调这两种相似的语言，Netscape\
  \ 随后将 `JavaScript` 提交给欧洲计算机厂商协会（`ECMA`），目标是为该语言创建一个统一的标准。该标准从此以后 `ECMAScript` 的名称运行，并在\
  \ 2015 年的第 6 版本中采用（简称为 `ES6` 或 `ES2015`）。从那时起，标准每年都会添加新功能，因此约定不再使用独立的连续版本号，而是简单地在版本号中列出相应的历年份（参见表\
  \ 1.5）。\n\n| 版本名称 | 发布年份 |\n| --- | --- |\n| ES1 | 1997 |\n| ES2 | 1998 |\n| ES3\
  \ | 1999 |\n| ES4 | 未发布 |\n| ES5 | 2009 |\n| ES6/ES2015 | 2015 |\n| ES2016 | 2016\
  \ |\n| ES2017 | 2017 |\n| ES2018 | 2018 |\n| ES2019 | 2019 |\n| ES2020 | 2020 |\n\
  | ES2021 | 2021 |\n\n**表 1.5** JavaScript/ECMAScript 版本历史\n\n### ECMAScript 的其他变体\n\
  \n因此，`JavaScript` 只是该标准的变体之一（其他变体的示例包括通过 `Flash` 知知的 `ActionScript` 和用于许多 `Adobe`\
  \ 产品的 `ExtendScript`）。\n\n### 1.2.2 应用领域\n\n如今，`JavaScript` 不仅在网页和 Web 应用开发中处于领先地位，还是各种其他类型应用的良好选择。最重要的应用领域将在后面介绍。\n\
  \n## 术语定义\n\n由于我们在书中反复使用网页、网站和 Web 应用这些术语，我们在这里简要解释它们。网页是一个可以通过特定 `URL` 访问的单个 `HTML`\
  \ 文档（例如，[www.rheinwerk-computing.com/javascript_5554](http://www.rheinwerk-computing.com/javascript_5554)）。网站是各种单个网页的集合（例如\
  \ [www.rheinwerk-computing.com](http://www.rheinwerk-computing.com)）。\n\n然而，Web\
  \ 应用是一种感觉更像桌面应用程序而非网页的网页。示例包括 `Google Documents` 和类似的基于 Web 的软件应用程序。此类 Web 应用的另一个术语是富网络应用（rich\
  \ internet applications），指的是具有丰富内容和功能的 Web 应用。\n\n### Web 应用的前端\n\n在开发网站和 Web 应用时，通常会在浏览器客户端端执行的部分（所谓的前端）和在服务器端执行的部分（所谓的后端）进行区分。`JavaScript`\
  \ 根源于前端开发，很久以来，它主要用于通过动态效果“装点”网页的界面。\n\n![前端与后端（或客户端与服务器端）之间的关系](img/img-f1.11)\n\
  \n**图 1.11** 前端与后端（或客户端与服务器端）的关系\n\n90 年代提出的相关术语是动态 HTML (`DHTML`)，使用 `JavaScript`\
  \ 对 `HTML` 进行动态修改。DHTML 现在已经被遗忘了，因为从今天来看，它更多是基于糟糕实践而非最佳实践。因此，在第 5 章](#05_001.html_h5)\
  \ 中我们完全不会处理 DHTML，而是处理 DOM 脚本，这是另一种动态修改网页的方式。\n\n`DOM` 代表文档对象模型（Document Object\
  \ Model），指的是网页后的对象模型。这一主题将在第 5 章](#05_001.html_h5) 中详细讨论。在那里我们解释什么是对象模型。\n\n在软件开发范围内，糟糕实践指的是糟糕的编程技术，而最佳实践指的是优秀的编程技术。\n\
  \n在各种网站上，你可能见过表格排序功能（参见图 1.12](#01_002.html_f1.12)）以及根据标准过滤表项（参见图 1.13](#01_002.html_f1.13)）。两者都是动态修改网页以及使用\
  \ `JavaScript` 的典型案例。\n\n`JavaScript` 的一个重要里程碑以及更复杂的 Web 应用的基础是 `XMLHttpRequest`\
  \ 对象以及相关的 `Ajax`（异步 JavaScript 和 XML）的引入，它们首次允许从浏览器向服务器发送异步请求。为什么这如此特别、在什么情况下有用以及这个\
  \ `XMLHttpRequest` 对象到底，将在第 9 章](#09_001.html_h9) 中详细解释。目前，请注意它通常会提高 Web 应用的易用性，有助于避免加载时间，并让\
  \ Web 应用看起来更加动态。\n\n![使用 JavaScript 排序](img/img-f1.12)\n\n**图 1.12** 使用 JavaScript\
  \ 排序\n\n![使用 JavaScript 过滤数据](img/img-f1.13)\n\n**图 1.13** 使用 JavaScript 过滤数据\n\n\
  对于动态加载网页内容的另一个典型应用示例，请考虑新闻滚动条（news tickers），它们会在特定的间隔内自动更新，而无需用户再次获取网页。今天被认为是理所当然的事情在很长一段时间内是不可行的。\n\
  \n\n\n\n在网页中使用 JavaScript 的另一个典型用例是表单输入验证——例如，检查用户输入的有效性，以确定是否输入了有效的电子邮件地址或有效的手机号码（参见图\
  \ 1.14）。\n\n尽管 HTML（一种用于描述网页文档的超文本标记语言）在从 `HTML 4.01` 到 `HTML5` 的版本更新中发生了飞跃，并且许多表单输入现在也可以通过\
  \ HTML 直接进行检查而无需使用 JavaScript，但 JavaScript 仍然要灵活得多。在第 7 章 中，我们将向你展示如何使用 JavaScript\
  \ 实现此类验证等。\n\n如果你对 HTML 有所了解（我们假设你是懂的），你就会知道 HTML 包含了许多用于定义用户界面（UI）的基本组件，包括文本字段、单选按钮、复选框、表格、列表等。\n\
  \n![表单输入输入的验证](img/img-f1.14.html)\n\n**图 1.14** 表单输入验证\n\n然而，HTML 并没有提供复杂的界面元素或\
  \ UI 组件，包括标签页、可展开和折叠区域（手风琴）、自定义对话框等。同样，你必须求助于 JavaScript。\n\n### 定义\n用户界面是人与计算机（或更广泛地说，与机器）交互的基础。\n\
  \n在第 10 章 中，我们将介绍流行的 JavaScript 库 `jQuery`，并向你展示如何通过该库或其扩展（jQuery UI`）使用更复杂的 UI\
  \ 组件。\n\n### 定义\n在编程和软件开发的语境下，“库”或“软件库”指的是可以访问的功能集合。对于 JavaScript 来说，有极其数量的库用于各种不同的用途。\n\
  \n### Web 应用后端\n即使你在与 Web 应用交互时没有直接察觉，很大一部分应用程序逻辑也发生在服务器端——即后端，特别是在复杂的应用程序中。想象一个网站的简单搜索功能：在你向搜索表单中输入搜索条件并提交表单之后，在显示搜索结果之前，核心部分——即搜索本身——是在服务器上进行的（参见图\
  \ 1.15）。这同样需要编程。可能需要查询数据库、将结果放入特定格式中等等。\n\n直到几年前，JavaScript 还不能用于此目的，或者必须绕一段相当长的弯路。服务器端是预留给\
  \ `Java` 或 `PHP` 等语言的。但特别是 `Node.js` 的引入——这是一个可以在命令行上运行 JavaScript（因此也可以在服务器端运行）的运行时环境——导致了服务器端\
  \ JavaScript 应用的持续繁荣。这将在第 17 章中详细介绍。\n\n![许多在客户端启动的请求涉及服务端，而用户并未直接察觉这一点](img/img-f1.15.html)\n\
  \n**图 1.15** 许多在客户端启动的请求涉及服务端，而用户并未直接察觉这一点\n\n### 移动应用\n近年来，移动应用几乎变得比 Web 应用更重要了。基本上，它们可以分为三类：\n\
  \n*   **原生应用**：原生应用是指为特定的（移动）操作系统开发的应用程序，例如 `iOS`、`Android` 或 `Windows Mobile`。原生应用是为特定的操作系统编译的：例如，`iOS`\
  \ 应用使用 `Objective-C`（或最近最近的 `Swift`）编写，`Android` 应用使用 `Java` 编写，`Windows Mobile`\
  \ 应用使用 `C#` 编写。原生应用的性能通常优于非原生应用。原生应用还提供了更多访问特定移动设备某些功能的选项。\n*   **HTML5 应用**：HTML5\
  \ 应用仅使用标准的 `HTML5`、`CSS3`（层叠样式表）和 JavaScript 技术开发。优势是，由于此类应用不需要编译，它们不依赖于所使用的操作系统（只要安装了浏览器）。这意味着同一个\
  \ HTML5 应用可以在 `iOS`、`Android` 和 `Windows Mobile` 上运行。但 HTML5 应用的性能通常无法与原生应用相媲美。此外，它们无法访问特定移动设备的全部功能。\n\
  *   **混合应用**：混合应用是原生应用和 HTML5 应用的结合。它们完全使用 `HTML5`、`CSS3` 和 JavaScript 开发，但运行在一个特殊的原生容器中，这使得它们能够像原生应用一样访问对仅限\
  \ HTML5 应用隐藏的移动设备功能。\n\n在第 18 章 中，你将学习如何使用 `React Native` ([`reactnative.dev`](https://reactnative.dev))\
  \ 使用 JavaScript 构建移动应用。\n\n### 桌面应用\n结合 `HTML5` 和 `CSS3`，JavaScript 现在不仅用于浏览器，还用于桌面应用。例如，自\
  \ `Windows 8` 以来，已经可以完全使用这些技术创建原生应用了。`NW.js` ([`nwjs.io`](http://nwjs.io)) 和 `Electron`\
  \ ([`www.electronjs.org`](https://www.electronjs.org)) 框架使得开发跨操作系统的桌面应用（适用于 Linux、Windows\
  \ 和 Mac）成为可能。\n\n### 嵌入系统\n你可能听过“物联网”（IoT；也称为 Web of Things）。指的是将日常物体（事物）网络化。\n\n\
  一个经典的例子是智能冰箱，它发现没有牛奶了，会自动更新手机上的购物清单，或者通过在线商店直接购买牛奶。\n\n物联网还包括可穿戴设备——即穿在衣服中（不可见）或直接戴在身上（可见）的便携计算机，例如智能手表。许多此类设备都可以开箱使用\
  \ JavaScript 编程：例如，`Bangle.js` 智能手表 ([www.banglejs.com](http://www.banglejs.com))\
  \ 可以通过 JavaScript 编程，`Philips Hue` 智能灯 ([www.philips-hue.com/en-us](http://www.philips-hue.com/en-us))\
  \ 也是。可编程微控制示例包括 `Tessel` ([`tessel.io`](https://tessel.io)) 和 `Espruino` ([www.espruino.com](http://www.espruino.com))。通过\
  \ `Johnny Five` 库，也可以远程控制 `Arduino` 微控制器。\n\n当然，物联网领域产生了许多不同的 JavaScript 用例。从读取温度传感器到通过摄像头感知动作并开始录像的家庭监控系统，许多事情现在都可以用\
  \ JavaScript 实现（参见图 1.16](#01_002.html_f1.16)）。你将在第 20 章中找到关于该主题更详细的介绍。\n\n![JavaScript\
  \ 也可以用于控制微控制器](img/img-f1.16.html)\n\n**图 1.16** JavaScript 也可以用于控制微控制器\n\n####\
  \ 游戏和 3D 应用\nJavaScript 的其他用例包括浏览器游戏和 3D 应用。然而，这两个主题都非常复杂，我们不会在书中讨论它们。\n\n#### JavaScript：并非所有情况下的最佳选择\n\
  \n\n\n\n你可能认为除了 JavaScript 之外不需要任何编程语言，因为你反正可以用它做任何事情——但这显然不是事实。在过去的几年里，JavaScript\
  \ 经历了了爆炸性的增长，但这在某种程度上也值得商榷。很多事情在 JavaScript 中实现起来并不简单，而且对于许多其他任务，求助于其他编程语言更为合适。当然，你需要经验来判断哪种编程语言是解决特定问题的最佳选择。\n\
  \n## 1.3 总结\n\n希望我们没有在书的开头（特别是第一节）就用术语让你目不暇接，并希望我们已经阐明了编程和编程语言的本质，以及 JavaScript\
  \ 是如何融入整体图景的。从现在起，我们承诺，内容将变得少一些理论性。\n\n在此之前，这里是本章核心要点的简要总结。此类总结对于回顾你所学的内容以及掌握特定章节的核心观点非常有帮助。因此，你会在书中每个章节的末尾看到如下总结：\n\
  \n*   流程图用于以图形化的方式阐述算法或程序的流程。\n*   伪代码用于以文本形式描述算法或程序的流程。\n*   JavaScript 不是一种编译型编程语言，而是一种解释型编程语言。\n\
  *   JavaScript 允许你对 Web 应用的前端和后端进行编程。\n*   此外，JavaScript 还允许你开发移动应用、桌面应用、嵌入式应用、游戏以及\
  \ 3D 应用。\n\n## 2 入门\n\nJavaScript 仍然主要用于在浏览器内创建动态网页。在随后的章节中详细探讨其他应用领域之前，本章将向你展示如何将\
  \ JavaScript 嵌入到网页中并生成简单的输出。因此，本章是后续章节的基础。\n\n在深入接触 JavaScript 语言本身之前，你应该先了解 JavaScript\
  \ 在网页中如何与 HTML 和 CSS 关联，如何在网页中嵌入 JavaScript，以及如何生成输出。\n\n## 2.1 JavaScript 与 Web\
  \ 开发简介\n\n创建 Web 前端最重要的三个语言无疑是 HTML、CSS 和 JavaScript。每种语言都有其特定的用途。\n\n### 2.1.1\
  \ HTML、CSS 和 JavaScript 之间的关系\n\n在 HTML 中，你使用 HTML 元素来指定网页的结构以及网页上单个组件的含义（语义）。例如，它们描述了网页上的哪个区域是主体内容，哪个区域用于导航，并定义了如表单、列表、按钮、输入框或表格等组件，如\
  \ 图 2.1 所示。\n\n![HTML 用于定义网页的结构](img/img-f2.1.html)\n\n**图 2.1** HTML 用于定义网页的结构\n\
  \n另一方面，CSS 使用特殊的 CSS 规则来确定你之前在 HTML 中定义的单个组件应该如何显示；这被用于定义网页的设计和布局。例如，你可以定义文本颜色、字体大小、边框、背景颜色、颜色渐变等。图\
  \ 2.2 显示了如何使用 CSS 调整表头和单元格的字体及字体大小，在表格列和行之间添加边框，并交替表格行的背景颜色。整体看起来比没有 CSS 的版本要吸引人得多。\n\
  \n![通过 CSS，你定义网页中单个元素的布局和外观](img/img-f2.2.html)\n\n**图 2.2** 通过 CSS，你定义网页中单个元素的布局和外观\n\
  \n最后但同样重要的是，JavaScript 用于为网页（或网页上的组件）添加动态行为，或为网页提供更多交互性。示例包括排序和过滤表格数据，正如第 1 章中提到的那样（参见\
  \ 图 2.3 和 图 2.4）。因此，虽然 CSS 负责网页的设计，但 JavaScript 可用于提高网页的用户体验和交互性。\n\n![使用 JavaScript\
  \ 排序选项使网页更具用户友好性和交互性](img/img-f2.3.html)\n\n**图 2.3** 使用 JavaScript 排序选项使网页更具用户友好性和交互性\n\
  \n![使用 JavaScript 过滤选项使网页更具用户友好性和交互性](img/img-f2.4.html)\n\n**图 2.4** 使用 JavaScript\
  \ 过滤选项使网页更具用户友好性和交互性\n\n因此，在大多数情况下，网页是由 HTML、CSS 和 JavaScript 代码组合成的（参见 图 2.5）。注意，尽管我们刚刚说\
  \ JavaScript 负责网页的行为，但你可以在没有 JavaScript 的情况下创建功能网页。原则上，你也可以创建不带 CSS 的网页；这是可能的。在这种情况下，浏览器仅评估\
  \ HTML。这意味着网页将不那么华丽（没有 CSS），交互性也不那么强（没有 JavaScript），正如之前的 图 2.1 所示。\n\n![HTML、CSS\
  \ 和 JavaScript 的组合用于网页](img/img-f2.5.html)\n\n**图 2.5** 通常 HTML、CSS 和 JavaScript\
  \ 的组合用于网页\n\n###### 注意\nHTML 用于网页的结构，CSS 用于布局，JavaScript 用于行为。\n\n###### 定义\nWeb\
  \ 和软件开发人员在此范围内也提到三层：HTML 提供内容层，CSS 提供表现层，JavaScript 提供行为层。\n\n###### 各层级代码分离\n良好的开发风格是不混合各个层级——即让\
  \ HTML、CSS 和 JavaScript 代码相互独立并分在不同的文件中。这有助于跟踪 Web 项目，并最终确保你可以更有效地开发。此外，这种方法允许你将相同的\
  \ CSS 和 JavaScript 文件引入多个 HTML 文件中（参见 图 2.6），从而在多个 HTML 文件中复用相同的 CSS 规则或 JavaScript\
  \ 源代码。\n\n![将 CSS 和 JavaScript 代码放在文件中而不是直接放在 HTML 中更容易复用](img/img-f2.6.html)\n\n\
  **图 2.6** 将 CSS 和 JavaScript 代码放在文件中而不是直接放在 HTML 中更容易复用\n\n开发网站的好方法是首先考虑它的结构：网页有哪些不同的区域？标题有哪些？是否有以表格形式呈现的数据？导航选项有哪些？哪些信息包含页脚区域，哪些包含页眉区域？这种目的仅使用\
  \ HTML。网页看起来并不好看，交互性也不强，但这并不是我们第一步的重点，在这一步中，我们不想被核心元素——网页内容所分散注意力。\n\n\n\n\n在此结构基础的基础上，你将使用\
  \ `CSS` 实现设计，并使用 `JavaScript` 实现网页的行为。从原则上说，这两个步骤也可以由不同的成员并行完成。例如，网页设计师可能负责使用 `CSS`\
  \ 进行设计，而网页开发者则使用 `JavaScript` 编写功能（在实践中，网页设计师和网页开发者通常是同一个人，但在特别是包含大量网站的大型项目中，职责分工的情况并不罕见）。\n\
  \n## 网站开发的各个阶段\n\n在开发专业网站时，在开发步骤之前还有几个阶段。在开发开始之前，原型会在概念和设计阶段进行设计（可以是数字化的，也可以是相当传统的纸笔绘制）。因此，上述这种循序渐进的方法（先是\
  \ `HTML`，然后是 `CSS`，最后是 `JavaScript`）仅指开发阶段。\n\n## HTML 标记语言与 CSS 样式语言\n\n顺便说一下，`HTML`\
  \ 和 `CSS` 并不是编程语言！`HTML` 是一种标记语言而 `CSS` 是一种样式语言；在我们讨论的语言中，只有 `JavaScript` 是一种编程语言。严格来说，像“可以用\
  \ `HTML` 进行编程”这样的说法是不正确的。你反而应该说类似“可以用 `HTML` 实现这个”的话。\n\n## 定义\n\n在浏览器中展示网页的过程被称为“渲染”。开发者之间常用的短语是“浏览器渲染网页”。这涉及到评估\
  \ `HTML`、`CSS` 和 `JavaScript` 代码，创建一个适当的网页模型（我们将在第 5 章中讨论），并将网页“绘制”到浏览器窗口。详细来说，这个过程非常复杂，如果你对这个话题感兴趣，可能会阅读\
  \ [www.html5rocks.com/en/internals/howbrowserswork](http://www.html5rocks.com/en/internals/howbrowserswork）上的文章。\n\
  \n## 2.1.2 开发的工具\n\n从原则上讲，一个简单的文本编辑器对于创建 `JavaScript` 文件就足够（对于简单的代码示例也是），但早晚你应该获取一个专门为编写\
  \ `JavaScript` 设计的优秀编辑器（如果你电脑上还没有的话）。这样的编辑器可以帮助你，例如通过对源代码进行高亮、减少重复性工作、识别错误以及更多功能。\n\
  \n### 编辑器\n\n有很多非常好用的编辑器可以使用。例如，Sublime Text ([www.sublimetext.com](http://www.sublimetext.com);\
  \ 见第 2.7 页](#02_001.html_7)) 和 Atom ([`atom.io`](https://atom.io); 见第 2.8 页](#02_001.html_8))\
  \ 都适用于 Windows、macOS 和 Linux，在开发者社区中非常流行。虽然前者（ 2021 年  99，但 9 编辑器是免费的。详细来说，这两个编辑器都有自己的特点和优势，但它们仍然非常相似。尝试一下看看哪一个更适合你。\n\
  \n![Sublime Text Editor](img/img-f2.7.html)\n\n**图 2.7** Sublime Text 编辑器\n\n![Atom\
  \ Editor](img/img-f2.8.html)\n\n**图 2.8** Atom 编辑器\n\n### 开发环境\n\n通常，从 `Java` 或\
  \ `C++` 等语言转向 `JavaScript` 的软件开发者会使用集成开发环境 (IDEs)，正如从他们之前的编程语言中所知的。在某种程度上，你可以将开发环境看作比“普通”编辑器提供更多功能的编辑器，例如与版本控制系统同步、自动构建或集成测试框架。（如果你现在正一脸困惑地疑惑这些术语背后的含义，请等到第\
  \ 21 章](#21_001.html)，我们将更详细地讨论这些 `JavaScript` 软件开发的高级话题。）\n\n来自 IntelliJ 的 WebStorm\
  \ ([www.jetbrains.com/webstorm/](http://www.jetbrains.com/webstorm/); 见第 2.9 页](#02_001.html_9))\
  \ 是非常流行且优秀的开发环境示例。WebStorm 的单许可目前价格为 129 美元（个人版目前为 59 美元）。不过，如果你想先测试程序，可以从 WebStorm\
  \ 首页下载 30 天预览版。WebStorm 适用于 Windows、macOS 和 Linux。\n\n![WebStorm IDE](img/img-f2.9.html)\n\
  \n**图 2.9** WebStorm IDE\n\n同时，开发环境中的个人喜爱是微软的 Visual Studio Code ([`code.visualstudio.com`](https://code.visualstudio.com);\
  \ 见第 2.10 页](#02_001.html_10))。它是免费下载的，可以通过插件灵活扩展，例如，它的感知性能明显优于 WebStorm。\n\n我们讨论的编辑器和开发环境的简要概述见表\
  \ 2.1](#02_001.html_t2.1)。\n\n![Microsoft Visual Studio Code](img/img-f2.10.html)\n\
  \n**图 2.10** Microsoft Visual Studio Code\n\n| 名称 | 价格 | macOS | Linux | Windows\
  \ | 编辑器/开发环境 |\n| --- | --- | --- | --- | --- | --- |\n| Sublime Text | 99 美元 |\
  \ 是 | 是 | 是 | 编辑器 |\n| Atom | 免费 | 是 | 是 | 是 | 编辑器 |\n| Microsoft Visual Studio\
  \ Code | 免费 | 是 | 是 | 是 | 开发环境 |\n| WebStorm | 129 美元/59 美元 | 是 | 是 | 是 | 开发环境 |\n\
  \n**表 2.1** 用于 JavaScript 开发的推荐编辑器和开发环境\n\n### 提示\n\n在开始阶段——例如，为了尝试书中的代码示例——我们建议你使用本节提到的编辑器之一，而不是（还没有）开发环境。后者的缺点是它们在菜单和功能上部分过载，因此你不仅要学习\
  \ JavaScript，还要学习开发环境。让我们暂时为你省去这个麻烦吧。\n\n此外，开发环境只有在超过项目规模时才有意义。对于较小的项目和书中的示例，编辑器总是足够的。此外，编辑器在执行速度上通常比开发环境更快。\n\
  \n## 2.2 将 JavaScript 集成到网页中\n\n由于我们假设你已经如何创建 HTML 文件以及如何嵌入 CSS 文件，并且你“仅仅”是为了学习\
  \ JavaScript，所以我们不想在 HTML 和 CSS 的细节上浪费更多时间，而是直接开始 JavaScript。不要担心：嵌入和执行 JavaScript\
  \ 文件并不困难。\n\n### 学习 HTML 和 CSS\n\n如果你还没有接触过 HTML 或 CSS，关于这个主题的一个非常好的入门书籍是 Jon Duckett\
  \ 写的《HTML and CSS: Design and Build Websites》（2011, John Wiley & Sons）。\n\n按照传统（几乎所有编程语言书籍都是），我们将从一个非常简单的\
  \ Hello World 示例开始，它只输出 Hello World。这现在并不有趣，但现在的重点是向你展示如何在 HTML 文件中嵌入 JavaScript\
  \ 文件，以及如何执行 JavaScript 文件中包含的源代码。\n\n### 2.2.1 准备合适的文件夹结构\n\n\n\n\n\n为了入门并完成以下示例，我们建议你为每个示例都使用图\
  \ 2.11 所示的目录结构。`index.html` 文件位于顶层，因为它是浏览器的入口，也是你将直接在浏览器中调用的文件。\n\n![示例文件夹结构](img/img-f2.11.html)\n\
  \n图 2.11：示例文件夹结构\n\n然而，为 CSS 和 JavaScript 文件创建不同的文件夹是一个好主意。`styles`（用于 CSS 文件）和\
  \ `scripts`（用于 JavaScript 文件）这些名称非常常见。如果你在开发过程中处理大量的不同的 JavaScript 和 CSS 文件，这种分离（或通俗地使用子文件夹进行安排）会让你更容易跟进项目进度。\n\
  \n### JavaScript 应用的起点\n\n书中的大多数示例也遵循图 2.11 所示的布局，因为在开始阶段我们只会在浏览器中运行 JavaScript\
  \ 代码，使用 `index.html` 文件作为程序的某种入口。\n\n稍后，在第 17 章中，你将学习如何独立浏览器运行 JavaScript，从而独立于相应的\
  \ HTML 文件。在这种情况下，你不需要任何 HTML——因此不需要 CSS 文件。\n\n### 在浏览器中运行 JavaScript\n\n虽然你可以在不创建嵌入相应脚本的\
  \ HTML 文件的情况下执行 JavaScript（通过浏览器提供的特殊开发者工具；第 2.3.2 节），但目前我们不想使用此功能。\n\n### 2.2.2\
  \ 创建 JavaScript 文件\n\n如前所述，将 JavaScript 代码保存在单独的文件（或多个单独的文件）中，然后将其嵌入 HTML 代码中会更好。因此，你需要的是一个\
  \ JavaScript 文件。只需打开你喜欢的编辑器（或者如果你没有听我的建议，打开你选择的开发环境），创建一个新文件，输入列表 2.1 中提供的源代码行，然后将文件保存为\
  \ `main.js`。\n\n```javascript\nfunction showMessage() {\n  alert('Hello World');\n\
  } \n```\n\n列表 2.1：一个定义函数的非常简单的 JavaScript 示例\n\n#### 注意\n\nJavaScript 文件的扩展名为 `.js`。其他文件扩展名也是可能的，但\
  \ `.js` 扩展的优势在于编辑器、开发环境和浏览器可以直接知道其内容是什么。因此，你应该始终以 `.js` 扩展保存所有 JavaScript 文件。（顺便说一下，浏览器通过\
  \ Web 服务器传递的 `Content-Type` 头部识别交付的 JavaScript 文件，这是随文件从服务器传输的信息。）\n\n列表 2.1 定义了一个名为\
  \ `showMessage` 的函数，该函数反过来调用另一个函数（名为 `alert`）并向其传递消息 `Hello World`。`alert` 函数是 JavaScript\
  \ 标准函数，我们将在本章后面稍作讨论。然而，泛指函数将在第 3 章中详细介绍。\n\n### 本书补充下载\n\n此代码示例以及后续的所有示例都可以在书籍的产品补充区域找到（参见\
  \ [`www.rheinwerk-computing.com/5554`](https://www.rheinwerk-computing.com/5554)）。在那里你可以轻松下载代码并在你的编辑器中或直接在浏览器中打开它（尽管我们认为最有效的学习方法是按照步骤操作，自己输入这些示例）。\n\
  \n### 2.2.3 在 HTML 文件中嵌入 JavaScript 文件\n\n要在网页中使用 JavaScript 源代码，你需要将 JavaScript\
  \ 文件链接到网页，或将 JavaScript 文件嵌入 HTML 文件中。这是通过命名为 `<script>` 的 HTML 元素实现的。\n\n该元素有两种不同的使用方式：一方面，正如我们稍后将演示的，可以将外部\
  \ JavaScript 文件包含在 HTML 中。另一方面，JavaScript 源代码可以直接写在起始 `<script>` 标签和结束 `</script>`\
  \ 标签之间。\n\n稍后将显示后方法的示例，但这种方法只在特殊情况下有用，因为 JavaScript 代码和 HTML 代码将混合在了一起——也就是说，存储在一个文件中（由于上述提到的原因，这不是最佳实践）。所以，让我们先看看如何正确操作并包含单独的文件。\n\
  \n`<script>` 元素总共有六个属性，其中 `src` 属性无疑是最重要的：它用于指定要包含的 JavaScript 文件的路径（表 2.2 显示了其他属性的作用概述）。\n\
  \n| 属性 | 含义 | 注释 |\n| :--- | :--- | :--- |\n| `async` | 指定链接的 JavaScript 文件是否应以异步方式下载，以免中断其他文件的下载（第\
  \ 2.2.5 节）。这在与 `src` 属性结合时才有意义，但并非总是支持，特别是旧版浏览器。 | 可选 |\n| `charset` | 指定通过 `src`\
  \ 属性嵌入的源代码的字符集。这在与 `src` 属性结合时才有意义，但很少使用，因为大多数浏览器不尊重此属性。更好的样式是在整个网站中使用 UTF-8 并在\
  \ `<meta>` 元素中通过 `charset` 属性定义它。 | 可选 |\n| `defer` | 指定是否等待网页内容完全处理后再执行链接的 JavaScript\
  \ 文件（第 2.2.5 节）。这在与 `src` 属性结合时才有意义。 | 可选 |\n| `language` | 原意用于指示 JavaScript 代码的版本，但很大程度上被浏览器忽略。\
  \ | 过时 |\n| `src` | 指定要嵌入的 JavaScript 文件的路径。 | 可选 |\n| `type` | 用于指定 MIME 类型（见下文）以识别脚本语言（在我们的例中是\
  \ JavaScript）。然而，你也可以省略此属性，因为默认使用 `text/javascript`，大多数浏览器都支持。 | 可选 |\n\n**表 2.2：<script>\
  \ 元素的属性**\n\n现在创建一个名为 `index.html` 的 HTML 文件，并插入列表 2.2 所示的内容。\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Example</title>\n\
  \  <link rel=\"stylesheet\" href=\"styles/main.css\" type=\"text/css\">\n</head>\n\
  <body>\n<!--JavaScript 文件将在此包含 -->\n<script src=\"scripts/main.js\"></script>\n\
  </body>\n</html>\n```\n\n**列表 2.2：在 HTML 中嵌入 JavaScript**\n\n\n\n\n\n如果你现在在浏览器中打开此\
  \ HTML 文件，什么都不会发生，因为我们在 Listing 2.1 中定义的函数在任何地方都未被调用过。因此，请在 JavaScript 文件的末尾添加 `showMessage()`\
  \ 调用，如 Listing 2.3 所示，并在相应的浏览器中重新加载网页。这时，会弹出一个小的提示对话框，其中包含消息 `Hello World`，其外观根据浏览器的不同而略有差异（参见图\
  \ 2.12）。\n\n```\nfunction showMessage() {\n  alert('Hello World');\n}\nshowMessage();\
  \ \n```\n\n**Listing 2.3** 函数定义与函数调用\n\n![不同浏览器中的提示框](img/img-f2.12.html)\n\n**图\
  \ 2.12** 不同浏览器中的提示框\n\n## 定义\n\n多用途互联网邮件扩展格式（MIME）类型，也称为互联网媒体类型或内容类型，最初旨在区分包含不同内容（如图像、PDF\
  \ 文件等）的电子邮件中的内容类型。然而，现在 MIME 类型现在不仅用于电子邮件语境，还适用于任何通过互联网传输数据的场景。如果服务器发送了一个带有特殊 MIME\
  \ 类型的文件，客户端（例如浏览器）就能直接知道正在传输的是什么类型的数据。\n\n对于 JavaScript 来说，MIME 类型在很一段时间内都没有标准，因此有多种\
  \ MIME 类型——例如 `application/javascript`、`application/ecmascript`、`text/javascript`\
  \ 和 `text/ecmascript`。但从 2006 年起，已经有一个官方标准（[www.rfc-editor.org/rfc/rfc4329.txt](http://www.rfc-editor.org/rfc/rfc4329.txt））定义了\
  \ JavaScript 可接受的 MIME 类型。根据该标准，`text/javascript` 和 `text/ecmascript` 都已废弃，应该使用\
  \ `application/javascript` 和 `application/ecmascript`。讽刺的是，为 JavaScript 完全不指定任何\
  \ MIME 类型（在 `<script>` 元素中）是最安全的，因为大多数浏览器实际上会忽略 `type` 属性。\n\n## 嵌入多个 JavaScript\
  \ 文件\n\n当然，你可以在一个 HTML 文件中嵌入多个 JavaScript 文件。只需为每个想要包含的文件使用单独的 `<script>` 元素即可。\n\
  \n### 2.2.4 在 HTML 中直接定义 JavaScript\n\n为了完整起见，我们还将展示如何在 HTML 文件中直接定义 JavaScript。虽然这通常不建议这样做，因为这意味着在一个文件中混合了\
  \ HTML 和 JavaScript 代码，但了解它仍然可行也无无处。\n\n只需将相关的 JavaScript 代码写在 `<script>` 元素内部，而不是通过\
  \ `src` 属性进行链接即可。Listing 2.4 显示了与上一节相同的示例，但它没有使用独立的 JavaScript 文件来存放代码，而是直接将代码嵌入到\
  \ HTML 中。因此，`src` 属性被完全省略了。\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"UTF-8\">\n  <title>Example</title>\n  <link rel=\"stylesheet\"\
  \ href=\"styles/main.css\" type=\"text/css\">\n</head>\n<body>\n<script> \n```\n\
  \n```\n function showMessage() {\n    alert('Hello World');\n  }\n  showMessage();\
  \ \n```\n\n```\n</script>\n</body>\n</html> \n```\n\n**Listing 2.4** 仅适用于特殊情况：在\
  \ HTML 文件中直接定义 JavaScript\n\n### 注意事项\n\n注意，使用 `src` 属性的 `<script>` 元素在 `<script>`\
  \ 和 `</script>` 之间不能包含任何源代码。如果有的话，这些源代码将被忽略。\n\n### 提示\n\n请使用独立的 JavaScript 文件作为你的源代码，而不是将其直接写入\
  \ `<script>` 元素中。这可以在网页的结构（HTML）和行为（JavaScript）之间建立清晰的分离。\n\n### <noscript> 元素\n\
  \n你可以使用 `<noscript>` 元素定义一个 HTML 部分，当浏览器不支持 JavaScript 或被用户禁用时显示该部分（参见 Listing 2.5）。然而，如果支持或启用了\
  \ JavaScript，`<noscript>` 元素的内容将不会显示。\n\n```\n<noscript>\n  JavaScript is not available\
  \ or is disabled. <br />\n  Please use a browser that supports JavaScript.\n</noscript>\n\
  ```\n\n**Listing 2.5** noscript 使用示例\n\n### 2.2.5 script 元素的位置与执行\n\n如果你在几年前问一个\
  \ Web 开发人员在网页中哪里放置 `<script>` 元素，他们可能会建议你将其放在 `<head>` 区域。但从那以后，这个想法就被抛弃了。虽然 CSS\
  \ 文件仍然放置在 `<head>` 区域，但 JavaScript 文件应该放在闭合的 `</body>` 标签之前。原因是：当浏览器加载网页时，它加载的不只是\
  \ HTML 代码，还包括图像和文件等嵌入文件。取决于处理器和内存使用，现代浏览器能够并行下载多个文件。然而，当浏览器遇到 `<script>` 元素时，它会立即处理相应的源代码并使用\
  \ JavaScript 解释器对其进行评估。为了实现这一点，必须先下载相应的 JavaScript 源代码。在此期间，浏览器会暂停下载其他文件并解析（即处理）HTML\
  \ 代码，这反过来导致用户认为构建网页耗时更长（参见图 2.13）。\n\n![默认情况下，浏览器遇到 script 元素时 HTML 代码处理停止](img/img-f2.13.html)\n\
  \n**图 2.13** 默认情况下，浏览器遇到 script 元素时 HTML 代码处理停止\n\n此外，你通常会会在 JavaScript 源代码中访问网页上的\
  \ HTML 元素。（你将在第 5 章中看到它是如何工作的。）如果 JavaScript 代码在这些 HTML 元素处理之前执行，就会遇到访问错误（参见图 2.14）。不过，如果你将\
  \ `<script>` 元素放在闭合的 `</body>` 标签之前，在这方面就是安全的（参见图 2.15），因为在这种情况下，`<body>` 元素内部的所有元素都已加载（当然，其他的\
  \ `<script>` 元素除外）。\n\n![如果 JavaScript 访问尚未加载的 HTML 元素将发生错误](img/img-f2.14.html)\n\
  \n**图 2.14** 如果 JavaScript 访问尚未加载的 HTML 元素将发生错误\n\n\n\n\n\n# 图 2.14 如果 JavaScript\
  \ 访问尚未加载的 HTML 元素\n\n![如果 <script> 元素放置在闭合 </body> 标签之前，<body> 元素内的所有元素都已加载](img/img-f2.15.html)\n\
  \n# 图 2.15 如果 <script> 元素放置在闭合 </body> 标签之前，<body> 元素内的所有元素都已加载\n\n## 注意\n\n按照原则，你应当将\
  \ `<script></script>` 元素放置在 `<<body>></</body>>` 元素的末尾。这是因为浏览器在继续加载其他 HTML 元素之前，会先评估每个\
  \ `<script>` 元素中包含或嵌入的 JavaScript 源代码。\n\n两个可以影响 JavaScript 加载行为的属性是 `async` 和 `defer`\
  \ 属性，我们之前已经简要提到过它们（请参见 表 2.2）。前者确保浏览器在遇到 `<script>` 元素时，HTML 代码的处理不会暂停。JavaScript\
  \ 文件将是异步下载的（因此名为 `async`）。这一概念在 图 2.16 中所示。\n\n![由于 async 属性，HTML 代码会继续处理，直到相应的\
  \ JavaScript 下载](img/img-f2.16.html)\n\n# 图 2.16 由于 async 属性，HTML 代码会继续处理，直到相应的\
  \ JavaScript 下载\n\n如你所见，一旦相应的 JavaScript 文件完全下载完成，JavaScript 代码就会立即执行。\n\n`defer`\
  \ 属性在此基础上更进了一步。一方面，与 `async` 一样，该属性确保 HTML 代码的处理不会暂停。另一方面，JavaScript 源代码只有在 HTML\
  \ 代码被完全处理后才会执行（请参见 图 2.17）。JavaScript 代码的执行被实际上推迟了（因此名为 `defer`）。\n\n![defer 属性确保相应的\
  \ JavaScript 只有在网页的整个 HTML 代码加载后才会执行](img/img-f2.17.html)\n\n# 图 2.17 defer 属性确保相应的\
  \ JavaScript 只有在网页的整个 HTML 代码加载后才会执行\n\n那么你什么时候应该使用哪种属性呢？目前，你可以记住，默认情况下不使用这两个属性可能是最好的。`async`\
  \ 属性仅适用于完全独立工作且与网页上的 HTML 无关的脚本。Google Analytics 的使用就是一个例子。另一方面，`defer` 属性目前并不是所有浏览器都支持，因此你也应该谨慎考虑使用它。\n\
  \n## 定义\n\n另一种确保在执行 JavaScript 代码之前网页所有内容都已加载的方法是使用事件处理器和事件监听器。我们即将在 第 6 章 中详细介绍它们。但目前，我们将向你大致展示它们是如何使用的，因为在进入\
  \ 第 6 章 的示例之前，它们就会出现在书籍的源代码示例中。\n\n通常，事件处理器和事件监听器都用于响应程序执行期间发生的特定事件并执行某些代码。（事件处理器和事件监听器之间存在细微，但现在并不重要，我们将在\
  \ 第 6 章 中解释。）事件可以是鼠标点击、按键、窗口调整大小操作等。对于网页，也有各种触发并可以被此类事件处理器和事件监听器响应的事件。例如，当网页内容完全加载时会触发一个事件。\n\
  \n要为此事件定义事件处理器，你可以使用 `onload` 属性：你在此处指定的作为此类属性的值将在网页完全加载时被调用。作为值，你可以指定一个 JavaScript\
  \ 语句，例如调用函数，如 列表 2.6 所示。\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n \
  \ <meta charset=\"UTF-8\">\n  <title>Example</title>\n  <link rel=\"stylesheet\"\
  \ href=\"styles/main.css\" type=\"text/css\">\n</head>\n<body onload=\"showMessage()\"\
  >\n<script src=\"scripts/main.js\"></script>\n</</body>>>\n</</html>\n```\n\n# 列表\
  \ 2.6 使用事件处理器\n\n然而，事件监听器无法通过 HTML 定义。相反，你使用 `document` 对象的 `addEventListener()`\
  \ 函数（更多信息见后文），向该函数传递事件名称以及在事件触发时要执行的函数。\n\n```\nfunction showMessage() {\n  alert('Hello\
  \ World');\n}\ndocument.addEventListener('DOMContentLoaded', showMessage);\n```\n\
  \n# 列表 2.7 使用事件\n\n你刚刚添加到 `main.js` 文件末尾的 `showMessage()` 调用在两种情况下都需要删除。否则，该函数将被调用两次（一次由脚本调用，一次由事件调用），结果将连续显示消息。\n\
  \n## 2.2.6 显示源代码\n\n所有浏览器通常提供查看网页源代码的方法。这在很多情况下很有用，例如你想检查某个特定功能是如何实现的。\n\n在 Chrome\
  \ 中，你可以通过菜单查看 > 开发者 > 源代码来查看（参见 图 2.18）；在 Firefox 中，通过工具 > 浏览器 > 页面源代码查看（参见 图 2.19）；在\
  \ Safari 中，通过开发 > 显示网页源代码来查看（参见 图 2.20）；在 Opera 中，通过开发者 > 源代码查看（参见 图 2.21）；在 Microsoft\
  \ Edge 中，通过工具 > 开发者 > 源代码查看（参见 图 2.22）。\n\n![Chrome 中查看源代码](img/img-f2.18.html)\n\
  \n# 图 2.18 Chrome 中查看源代码\n\n![Firefox 中查看源代码](img/img-f2.19.html)\n\n# 图 2.19 Firefox\
  \ 中查看源代码\n\n![Safari 中查看源代码](img/img-f2.20.html)\n\n# 图 2.20 Safari 中查看源代码\n\n![Opera\
  \ 中查看源代码](img/img-f2.21.html)\n\n# 图 2.21 Opera 中查看源代码\n\n![Microsoft Edge 中查看源代码](img/img-f2.22.html)\n\
  \n# 图 2.22 Microsoft Edge 中查看源代码\n\n## 更复杂网页的源代码\n\n如果你查看复杂网页的源代码，它们通常会令人困惑。这通常由于多个原因引起：一方面，内容通常是动态生成的；另一方面，JavaScript\
  \ 经常被网页开发者刻意压缩和混淆——前者是为了节省空间，后者是为了保护源代码。本书不涉及源代码的压缩和混淆。\n\n\n\n\n\n如果你显示网页的源代码（无论在何种浏览器中），你首先看到的是该网页相应的\
  \ HTML 代码。方便的是，嵌入的文件（如 CSS 文件或 JavaScript 文件）在此源代码视图中被链接（参见图 2.23），这样你也可以轻松地获取链接文件的源代码（参见图\
  \ 2.24）。\n\n![Chrome 中 HTML 的源代码视图](img/img-f2.23.html)\n\n**图 2.23** Chrome 中 HTML\
  \ 的源代码视图\n\n![Chrome 中 JavaScript 的源代码视图](img/img-f2.24.html)\n\n**图 2.24** Chrome\
  \ 中 JavaScript 的源代码视图\n\n## 2.3 创建输出\n\n在 \"Hello World\" 示例中，你已经了解了如何通过调用 `alert()`\
  \ 函数来创建简单的输出。然而，还有其他几种选项。\n\n### 2.3.1 显示标准对话框\n\n除了调用 `alert()` 函数显示的已知的提示对话框（参见图\
  \ 2.25）外，JavaScript 语言还提供了两个标准函数来显示对话框。第一个是 `confirm()` 函数。它用于显示确认对话框——即是/否的决策（参见图\
  \ 2.26）。与提示对话框不同，确认对话框包含两个按钮：一个用于确认，另一个用于取消消息。第二个是 `prompt()` 函数。该函数会打开一个输入对话框，用户可以在其中输入文本（参见图\
  \ 2.27）。\n\n![简单提示对话框](img/img-f2.25.html)\n\n**图 2.25** 简单提示对话框\n\n![简单确认对话框](img/img-f2.26.html)\n\
  \n**图 2.26** 简单确认对话框\n\n![简单输入对话框](img/img-f2.27.html)\n\n**图 2.27** 简单输入对话框\n\n\
  在实践中，这些用于提示、确认和输入的标准对话框很少被使用，因为它们为语句提供的选项有限，而且正如前面的提示对话框所示，它们的设计取决于所用浏览器的布局，而这种布局通常与网页的布局不匹配。\n\
  \n出于如此，Web 开发人员喜欢使用各种 JavaScript 库之一，这些库提供了更精美、功能更丰富的对话框（参见图 2.28）。其中一个库是 jQuery\
  \ UI，它基于著名的 jQuery 库，并用各种 UI 组件对其进行了扩展。我们将在第 10 章中详细查看主库 jQuery 以及 jQuery UI。\n\n\
  ![使用 JavaScript 的自定义确认对话框](img/img-f2.28.html)\n\n**图 2.28** 使用 JavaScript 的自定义确认对话框\n\
  \n### 2.3.2 写入控制台\n\n在开发 JavaScript 应用时，你通常只想为了测试目的而为自己生成输出——例如，返回一个中间结果。对于这种仅用于测试的输出，显然将其放在用户也能看到的对话框中是没有意义的。出于这个原因，所有当前的浏览器现在都提供一个控制台，它正适合这种用途，你可以在\
  \ JavaScript 程序中访问它以输出消息。默认情况下，此控制台是隐藏的，因为网页用户通常对其无能作为。\n\n#### 显示控制台\n\n要激活控制台，请根据你的浏览器执行以下操作（我们在此不提供截图，因为这些菜单项可以在本章前面提到的显示源代码的菜单相似的位置找到）：\n\
  \n*   在 Chrome 中，选择“查看 • 开发者 • JavaScript 控制台”，这会在 Chrome 开发工具中打开控制台。\n*   在 Firefox\
  \ 中，通过“工具 • 浏览器工具 • 浏览器控制台”打开控制台。\n*   在 Safari 中，通过“开发 • 显示 JavaScript 控制台”打开控制台。\n\
  *   在 Opera 中，你必须先选择“开发者 • 开发者工具”，然后切换到“控制台”选项卡。\n*   在 Microsoft Edge 中，通过“工具 •\
  \ 开发者 • JavaScript 控制台”打开控制台。\n\n![默认情况下，控制台显示在浏览器窗口右侧或底部（此处为 Google Chrome)](img/img-f2.29.html)\n\
  \n**图 2.29** 默认情况下，控制台显示在浏览器窗口右侧或底部（此处为 Google Chrome）\n\n图 2.29 显示了控制台。你可以看到，它看起来并不特别，但如果你使用\
  \ JavaScript，它将是你的工具之一。\n\n#### 写入控制台\n\n为了写入控制台，浏览器提供了 `console` 对象。它最早由一个名为 Firebug\
  \ 的插件引入，提供了多种输出到控制台的方法。Firebug 本身已经停止维护，但 `console` 对象在几乎所有的环境中都是可用的。\n\n######\
  \ 控制台的标准 API\n\n`console` 提供的方法在不同环境之间存在差异。为了解决这个问题，正在创建一个标准的 API。\n\n一个通用支持的方法是\
  \ `log()` 方法，它可以用于生成简单的输出。要尝试使用控制台，只需将 `main.js` 的源代码替换为列表 2.8 并再次调用网页。\n\n```javascript\n\
  // scripts/main.js\nfunction showMessage() {\n  console.log('Hello developer');\n\
  }\n```\n\n**列表 2.8** 简单 JavaScript 示例\n\n根据浏览的不同，结果类似于图 2.30 所示。\n\n![Chrome 中的控制台输出](img/img-f2.30.html)\n\
  \n**图 2.30** Chrome 中的控制台输出\n\n除了 `log()` 方法，`console` 还提供了许多其他方法。重要方法的概述见表 2.3。\n\
  \n| 方法 | 描述 |\n| --- | --- |\n| `clear()` | 清空控制台。 |\n| `debug()` | 用于输出用于调试（或故障排除）的消息。（你可能需要先设置适当的开发者工具来返回此类输出。）\
  \ |\n| `error()` | 用于输出错误消息。某些浏览器会在控制台中的输出消息旁边显示错误图标。 |\n| `info()` | 这将在控制台中显示一条信息消息。某些浏览器（例如\
  \ Chrome）也会输出一个信息图标。 |\n| `log()` | 可能是 `console` 最常用的方法。向控制台生成普通输出。 |\n| `trace()`\
  \ | 向控制台输出堆栈跟踪——即方法调用栈（另参见第 3 章）。 |\n\n\n\n\n\n| `warn()` | 用于向控制台发出警告信息。再次重的是，大多数浏览器会在消息旁边显示一个相应的图标。\
  \ |\n\n**表 2.3** `console` 对象最重要的方法\n\nListing 2.9 显示了使用 `console` 对象的相应源代码。各个方法的输出会根据浏览器使用颜色或图标进行高亮显示（参见图\
  \ 2.31）。\n\n```\nconsole.log('Hello developer world');     // 普通消息输出\nconsole.debug('Hello\
  \ developer world');   // 调试消息输出\nconsole.error('Hello developer world');   // 错误消息输出\n\
  console.info('Hello developer world');    // 信息消息输出\nconsole.warn('Hello developer\
  \ world');    // 警告消息输出 \n```\n\n**代码列表 2.9** 使用 `console` 对象\n\n![不同消息类型用颜色或图标高亮](img/img-f2.31.html)\n\
  \n**图 2.31** 不同消息类型用颜色或图标高亮\n\n### 向控制台写入输入\n\n在最后几张截图中，你可能已经了输出下方的 `>` 符号。在这里，你可以输入任何\
  \ JavaScript 代码并立即执行。这是快速测试简单脚本的一种极佳方法，对于 Web 开发来说实际上必不可少。试一试：在提示符中输入 `showMessage()`\
  \ 命令，然后按回车（Enter）键执行。结果显示在图 2.32 中。\n\n![你也可以通过控制台执行源代码](img/img-f2.32.html)\n\n\
  **图 2.32** 你也可以通过控制台执行源代码\n\n#### 注意事项\n\n控制台窗口和 `console` 对象是 Web 开发人员的重要工具。趁机会让自己熟悉两者吧。\n\
  \n### 日志库\n\n`console` 对象非常适合开发期间的快速输出。然而，如果网页已上线或在生产环境中使用 JavaScript 应用程序，你就不再想继续使用\
  \ `console` 调用了（尽管它们通常不会显示给用户）。在实践中，你通常会使用特殊的日志库，这些库允许通过特定的配置设置来控制控制台输出的激活（用于开发）和去激活（用于生产环境使用）。不过，为了入门，也为了本书中的示例，使用\
  \ `console` 对象就已经足够了。\n\n### 2.3.3 使用现有的 UI 组件\n\n由于 `alert()`、`confirm()` 和 `prompt()`\
  \ 的用法相当过时，且仅对快速测试有用，而且通过 `console` 对象的输出本身就是留给开发者使用的，你显然仍然需要一种方法为网页用户创建更具吸引力的输出。为此，你可以将程序的输出写入到现有的\
  \ UI 组件中，例如文本字段等。\n\n代码列表 2.10、代码列表 2.11 以及图 2.33 显示了一个示例。它包含一个简单的表单，用于确定两个数字相加的结果。这两个数字可以输入两个文本字段中，通过点击按钮触发加法，结果写入第三个文本字段中。\n\
  \n你暂时不需要理解这个示例的代码，我们现在不会进入细节。目前，只需记住，当使用 JavaScript 进行 Web 开发时，使用 HTML 组件将程序的输出发送给用户是非常常见的做法。\n\
  \n```javascript\n// scripts/main.js\nfunction calculateSum() {\n  const x = parseInt(document.getElementById('field1').value);\n\
  \  const y = parseInt(document.getElementById('field2').value);\n  const result\
  \ = document.getElementById('result');\n  console.log(x + y);\n  result.value =\
  \ x + y;\n} \n```\n\n**代码列表 2.10** `main.js` 文件的 JavaScript 代码\n\n```javascript\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Example</title>\n\
  \  <link rel=\"stylesheet\" href=\"styles/main.css\" type=\"text/css\">\n</head>\n\
  <body>\n<div class=\"container\">\n  <div class=\"row\">\n    <label for=\"field1\"\
  >X</label> <input id=\"field1\" type=\"text\" value=\"5\">\n  </div>\n  <div class=\"\
  row\">\n    <label for=\"field2\">Y</label> <input id=\"field2\" type=\"text\" value=\"\
  5\">\n  </div>\n  <div class=\"row\">\n    <label for=\"result\">Result:</label>\
  \ <input id=\"result\" type=\"text\">\n    <button onclick=\"calculateSum()\">Calculate\
  \ sum</button>\n  </div>\n</div>\n<script src=\"scripts/main.js\"></script>\n</body>\n\
  </html>\n```\n\n**代码列表 2.11** 示例应用程序的 HTML 代码\n\n![示例](img/img-f2.33.html)\n\n**图\
  \ 2.33** 示例应用程序\n\n#### DOM 操作\n\n最复杂的场景是当你动态修改网页——例如动态显示结构化数据。我们将在第 5 章中详细讨论 DOM\
  \ 操作话题。\n\n### 2.4 总结\n\n在本章中，你学习了如何创建 JavaScript 文件并将其嵌入 HTML 中。你现在掌握了后续章节的基础知识。本章介绍了以下要点：\n\
  \n-   三种语言对前端开发至关重要：HTML 是标记语言，CSS 是定义设计布局的样式语言，JavaScript 是添加额外行为的编程语言。\n-   你可以直接使用\
  \ `<script>` 标签指定 JavaScript，也可以使用 `<script>` 标签的 `src` 属性嵌入独立的 JavaScript 文件。我们推荐后者，因为它确保了网页结构（HTML）与行为（JavaScript）的清晰分离。\n\
  -   你应该始终将 `<script>` 标签放在 `</body>` 标签之前。\n-   JavaScript 原生提供了三个生成输出的函数：`alert()`\
  \ 创建提示框、`confirm()` 创建确认框以及 `prompt()` 创建输入框。\n-   在实践中，人们不再使用这些（多为过时的）函数，而是使用更精美的对话框，例如\
  \ jQuery 库提供的对话框。\n-   此外，所有现代浏览器都提供了通过控制台生成输出的可能性，这主要是供你作为开发者使用的。\n\n\n\n\n\n要用算法解决问题，大多数情况下需要临时存储某些信息。这是通过变量实现的。变量本质上是可变的（变量型）缓存，你可以在其中存储值以便稍后访问。\n\
  \n### 3.1.1 定义变量\n\n为了能够使用变量，你需要执行两个步骤。首先，你需要创建一个变量。这个过程通常被称为变量声明。在 JavaScript 中声明变量，你可以使用\
  \ `var` 关键字，后跟变量名，如列表 3.1 所示。\n\n```\nvar firstName;\nvar lastName; \n```\n\n**列表\
  \ 3.1** 使用 `var` 关键字声明变量\n\n作为另一种备选方案，自 ES2015 起，可以使用 `let` 关键字来定义变量，这是推荐的方法，如列表\
  \ 3.2 所示。\n\n```\nlet firstName;\nlet lastName; \n```\n\n**列表 3.2** 使用 `let` 关键字声明变量\n\
  \n这两种源代码变体都定义了两个变量：一个名为 `firstName`，另一个名为 `lastName`。此时你不需要理解 `var` 和 `let` 之间的确区别。现在只需记住，如果相应的\
  \ JavaScript 运行时环境（或浏览器）支持，就应该使用 `let` 关键字。\n\n#### 严格模式\n\n正如你将在整本书中所看到的，JavaScript\
  \ 有许多怪异特性和功能，其中某些特性会导致在应用程序中难以发现的错误。为了防止这种情况，ES5 引入了严格模式（strict mode）。这种模式确保了这些可能出错的特性无法在脚本中使用。因此，严格模式最终导致了使用一个经过某种“清理”的\
  \ JavaScript 版本（即 JavaScript 的子集）。\n\n你可以对整个脚本激活严格模式，也可以专门针对单个函数。在第一情况下，你在脚本开头包含\
  \ `'use strict';` 语句（如列表 3.3 所示）；在第二情况下，你在相应函数的第一行包含它（稍后会对此详细介绍）。\n\n```\n'use strict';\n\
  let firstName;\nlet lastName;\n```\n\n**列表 3.3** 使用严格模式\n\n声明变量后，你可以为它分配一个实际值。这也被称为值赋值或变量初始化。它看起来像列表\
  \ 3.4 中的示例一样。\n\n```\nfirstName = 'John';\nlastName = 'Doe'; \n```\n\n**列表 3.4**\
  \ 变量初始化\n\n通过使用等号 `=`，你为变量分配了一个具体的值。在 JavaScript 中，等号是赋值运算符。它不像你在数学领域中预期的那样，代表两个值相等的表达式。在列表\
  \ 3.4 中，该运算符用于将值 `John` 分配给变量 `firstName`，将值 `Doe` 分配给变量 `lastName`。\n\n#### 未赋值值的变量\n\
  \n如果一个变量尚未赋值，则它还没有被定义，相应的值为 `undefined`。\n\n变量声明和变量初始化这两个步骤可以方便地合并为单个语句，如列表 3.5\
  \ 所示。\n\n```\nlet firstName = 'John';\nlet lastName = 'Doe'; \n```\n\n**列表 3.5**\
  \ 变量声明和变量初始化\n\n此外，你还可以在一个语句中声明并初始化多个变量：\n\n```\nlet firstName='John', lastName='Doe';\
  \ \n```\n\n在这里，两个变量 `firstName` 和 `lastName` 被声明并初始化。但在实践中，通常会将各个变量分布在几行以便获得更好的可读性：\n\
  \n```\nlet firstName = 'John',    // 这创建了一个变量 ...\n    lastName = 'Doe';      //\
  \ ... 而这创建了另一个。 \n```\n\n#### 自 ES2015 起的变量声明\n\n声明变量的最佳实践如下：使用 `let` 声明值在运行时可以改变的变量（计数器变量是一个经典的例子）。对于所有值不会改变的“变量”，请使用\
  \ `const`。换句话说，将这些“变量”定义为常量（参见第 3.1.3 节）。然而，你应该避免使用 `var` 来声明变量。\n\n正是我们在书中的做法：\n\
  \n*   我们只在所用运行时环境版本要求的示例中使用 `var`（例如在显式用于在旧版浏览器中运行的代码示例中）。\n*   我们对真实变量使用 `let`——也就是说，在所示代码示例中值会改变的变量（例如之前提到的计数器变量，或值被逐位“组装”的变量）。\n\
  *   我们对所有其他变量使用 `const`，它们实际上是常量。\n\n#### 定义\n\n关键字代表了编程语言语法的重要部分，在 JavaScript 中，它们确保解释器知道要做什么。对于\
  \ `var`、`let` 和 `const`，解释器知道要创建一个变量，并且必须为其预留适当的空间。\n\n#### 提示\n\n避免在不指定 `let` 或\
  \ `const` 的情况下声明新变量。否则，你可能会无意中覆盖已有的同名全局变量。顺便说一下，如果你尝试这样做，严格模式会产生错误。\n\n正如前面提到的，在变量被赋值后，可以为它们分配新值。列表\
  \ 3.6 展示了一个示例。在这种情况下，变量 `x` 首先被赋值为 `4711`，然后被赋值为 `5`。\n\n```\nlet x = 4711;\nconsole.log(x);\
  \  // 输出: 4711\nx = 5;\nconsole.log(x);  // 输出: 5 \n```\n\n**列表 3.6** 变量可以被新值覆盖；它们正如名称所言是变量的\n\
  \n### 3.1.2 使用有效的变量名\n\n你在选择变量命名时相对自由的，但有一些你必须遵守的限制。如果不遵守，运行程序时就会发生错误。\n\n#### 关键字\n\
  \n首先，有一些保留关键字是语言的一部分，并作为解释器的标识符，例如之前介绍的 `var` 和 `let` 关键字。如果你将这些关键字之一用变量名，解释器将产生困惑并报告相应的错误。\n\
  \n\n\n\n\n此外，JavaScript 中还有其他你可以用来定义某些内容的关键字。表 3.1  own 了 JavaScript 保留关键字的概述。虽然并不是所有的关键字在当前\
  \ JavaScript 版本中都具有功能——但它们是为语言的后续版本预留的——你仍然不能将这些关键字中的任何一个用变量。表格描述了这些关键字，但其中大多数将在右侧列出的章节或节中进行详细讨论。\n\
  \n| 关键字 | 描述 | 进一步讨论的章节或节 |\n| --- | --- | --- |\n| `async` | 用于指示异步函数 | 第 16 章\
  \ |\n| `await` | 用于等待异步函数的结果 | 第 16 章 |\n| `break` | 用于取消多路分支和循环 | 第 3 章, 第 3.4.4\
  \ 节 和 第 3.4.8 节 |\n| `case` | 用于在多路分支中定义单个程序分支 | 第 3 章, 第 3.4.4 节 |\n| `class` |\
  \ 用于定义类 | 第 13 章 |\n| `catch` | 用于拦截错误 | 第 3 章, 第 3.6.5 节 |\n| `const` | 用于定义常量\
  \ | 第 3 章, 第 3.1.3 节 |\n| `continue` | 用于取消循环迭代 | 第 3 章, 第 3.4.8 节 |\n| `debugger`\
  \ | 用于在程序中定义断点 | 第 3.7 节 |\n| `default` | 用于为多路分支定义标准程序分支 | 第 3 章, 第 3.4.4 节 |\n\
  | `delete` | 用于删除对象属性 | 第 4 章, 第 4.1.4 节 |\n| `do` | 用于定义尾控制循环 | 第 3 章, 第 3.4.7\
  \ 节 |\n| `else` | 用于在分支时定义备程序分支 | 第 3 章, 第 3.4.2 节 |\n| `enum` | 保留关键字；尚未分配功能 |\
  \ N/A |\n| `export` | 与模块结合使用 | 第 16 章 |\n| `extends` | 用于定义子类或父类 | 第 13 章 |\n|\
  \ `finally` | 用于在处理错误时定义默认行为 | 第 3 章, 第 3.6.5 节 |\n| `for` | 用于定义计数循环 | 第 3 章, 第\
  \ 3.4.5 节 |\n| `function` | 用于定义函数 | 第 3 章, 第 3.5.1 节 |\n| `if` | 用于定义条件语句和分支 |\
  \ 第 3 章, 第 3.4.1 节 和 第 3.4.2 节 |\n| `implements` | 保留关键字 | N/A |\n| `import` | 与模块结合使用\
  \ | 第 16 章 |\n| `in` | 检查对象是否包含属性或方法 | 第 3 章, 第 3.3.9 节 |\n| `interface` | 保留关键字\
  \ | N/A |\n| `instanceof` | 检查对象是否是原型的实例 | 第 13 章 |\n| `let` | 用于定义变量 | 第 3 章, 第\
  \ 3.1.1 节 |\n| `new` | 用于创建实例 | 第 4 章 |\n| `package` | 保留关键字；尚未分配功能 | N/A |\n| `private`\
  \ | 保留关键字；尚未分配功能 | N/A |\n| `protected` | 保留关键字；尚未分配功能 | N/A |\n| `public` | 保留关键字；尚未分配功能\
  \ | N/A |\n| `return` | 用于定义函数的返回值 | 第 3 章, 第 3.5.4 节 |\n| `static` | 用于定义静态属性和方法\
  \ | 第 13 章 |\n| `super` | 从（子）类访问父类 | 第 13 章 |\n| `switch` | 用于定义多路分支 | 第 3 章, 第\
  \ 3.4.4 节 |\n| `this` | 用于访问对象本身 | 第 4 章 |\n| `throw` | 用于抛出错误 | 第 3 章, 第 3.6.6\
  \ 节 |\n| `try` | 用于定义可能发生错误的代码块 | 第 3 章, 第 3.6.5 节 |\n| `typeof` | 确定变量类型 | 第 3\
  \ 章, 第 3.3.9 节 |\n| `var` | 用于定义变量 | 第 3 章, 第 3.1.1 节 |\n| `void` | 保留关键字；尚未分配功能\
  \ | N/A |\n| `while` | 用于定义头控制循环 | 第 3 章, 第 3.4.6 节 |\n| `with` | 保留关键字；不应使用且在严格模式下不允许，例如\
  \ | N/A |\n| `yield` | 用于生成器函数 | 第 16 章 |\n\n#### 已经赋值的变量名\n\n由于语法原因，你不能将关键字作为变量名，但还有一些你可以可以使用但不使用的名称。我们指的是已经赋值给现有全局标准变量的名称。\n\
  \n相关的标准变量基本上取决于运行时环境：浏览器定义的全局标准变量与服务器端运行时（如 Node.js）定义的变量不同。浏览器预定义了 `alert`、`document`\
  \ 或 `window` 等变量，而 Node.js 则拥有 `process`、`module` 和 `exports` 等预定义变量。\n\n\n\n\n\n\
  如果你使用这些预定义单词来定义新变量，可能会产生意想不到的后果并导致程序错误。代码列表 3.7 使用 `console` 对象演示了这一点（你可能已经在 第 2\
  \ 章 中学习过它）。在这种情况下，定义了一个名为 `console` 的变量并将其赋值为 `4711`。随后尝试在 `console` 对象上调用 `log()`\
  \ 方法时失败了。\n\n```\nconst number = 22;     // 定义变量\nconsole.log(number);   // 输出:\
  \ 22\nconst console = 4711;  // 定义变量\nconsole.log(number);   // TypeError: console.log\
  \ is not a function \n```\n\n**列表 3.7** 找不到 `log()` 函数，是因为 `console` 变量被重新定义，因此不再指向原始对象\n\
  \n如果你将这些单词之一作为变量名，你至少应该意识到这可能带来的副作用。在上一个例子中，这一点显而易见，错误也容易发现。但变量的可见性也起着作用，正如你将在书中看到的那样。现在，请记住这一点：如果可能，你应该避免为自己的变量使用预定义的变量名。浏览器运行时环境中的部分预定义变量名见\
  \ 表 3.2。你可以在互联网上找到详细的列表——例如在 [`developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects)。访问\
  \ [`nodejs.org/api/globals.html`](https://nodejs.org/api/globals.html) 可查看 Node.js\
  \ 全局对象的概述。\n\n| 预定义变量名 |\n| --- |\n| `alert` | `closed` | `frames` | `open` |\n\
  | `blur` | `document` | `location` | `screen` |\n| `close` | `focus` | `navigator`\
  \ | `window` |\n\n**表 3.2** 浏览器中的预定义变量名\n\n#### 允许的字符\n\n无论关键字和预定义变量名如何，变量名中只能使用某些字符，包括字母和数字，且变量名不能以数字开头。\n\
  \n关于允许字符的完整细节，请参阅 [`mathiasbynens.be/notes/javascript-identifiers`](https://mathiasbynens.be/notes/javascript-identifiers)（针对\
  \ ECMAScript 5）和 [`mathiasbynens.be/notes/javascript-identifiers-es6`](https://mathiasbynens.be/notes/javascript-identifiers-es6)（针对\
  \ ECMAScript 2015）的博客文章。但对于初学者来说，遵循这些规则就足够了：\n\n*   变量名只能以字母、美元符号（`$`）或下划线（`_`）开头。\n\
  *   变量名不能以数字开头。\n*   变量名可以包含字母、数字、美元符号和下划线，但不能包含其他字符，如句或连字符。\n\n列表 3.8 提供了一些有效无效变量名的示例。\n\
  \n```\nconst 2ndName = 'James';   // 无效，因为它以数字开头\nconst first%Name = 'John'; //\
  \ 无效，因为它包含特殊字符\nconst first-name = 'John'; // 无效，因为它包含连字符\nconst first_name = 'John';\
  \ // 有效\nconst _firstName = 'John'; // 有效\nconst $firstName = 'John'; // 有效 \n```\n\
  \n**列表 3.8** 有效和无效变量名的示例\n\n#### 大写敏感\n\n你还应该注意，变量名是大写敏感的。例如，`name`、`Name` 和 `nAme`分别代表不同的变量，如列表\
  \ 3.9 所示。\n\n```\nconst name = 'John';    // 这是一个不同的变量 ...\nconst Name = 'James';\
  \   // ... 与这个变量不同 ...\nconst nAme = 'Peter';   // ... 与这个变量不同。 \n```\n\n**列表 3.9**\
  \ JavaScript 区分变量名大写和小写\n\n但在实践中，你应该避免仅通过大小写来区分变量。这极有可能导致程序出现混乱。\n\n#### 驼峰命名法 (CamelCase)\n\
  \n在赋值变量名时，可以使用大写和小写字母。唯一重要的一点是你保持一致。例如，一种通接受的表示法是小驼峰命名法（lowerCase），即变量名以小写字母开头，如果名称由多个单词组成，则每个后续单词的首字母都大写。生成的变量名看起来就像骆驼背峰的形状。列表\
  \ 3.10 显示了一些示例。\n\n```\nconst defaultValue = 2345;\nconst firstName = 'John';\n\
  const lastName = 'Doe';\nconst isAdmin = true;\nconst userIsNot = true;\n```\n\n\
  **列表 3.10** 小驼峰命名法的变量名示例\n\n#### 小驼峰命名法与大驼命名法\n\n开发者经常频繁使用小驼峰命名法（lowerCamelCase）。除了小驼峰命名法外，还有大驼命名法（UpperCase）。唯一的区别是首字母是大写而不是小写。然而，大驼命名法不用于变量名，而是用于类名（请见第\
  \ 13 章）。\n\n#### 有意义的命名\n\n最后但同样重要的是，我们建议你选择尽可能有意义的变量名，这样你仅通过名称就能判断其用途（即不需要查看上下文代码）。例如，`uc`\
  \ 比 `userConfiguration` 更有意义，而 `x4` 比 `xCoordinate4` 更有意义。列表 3.11 展示了一些有意义和无意义的变量名示例。\n\
  \n```\n// 无意义的变量名\nconst fn = 'John';\nconst ln = 'Doe';\n// 有意义的变量名\nconst firstName\
  \ = 'John';\nconst lastName = 'Doe';\n```\n\n**列表 3.11** 有意义和无意义变量名的示例\n\n#### 注意\n\
  \n在命名变量时使用有意义的名字。这有助于你以及查看你代码的人更快地理解代码。至于这些名称所占的空间，你不需要担心变量名的长度，因为可以使用特殊工具（称为压缩工具）对源代码进行压缩处理。\n\
  \n#### 图籍推荐\n\n一本关于通用可读代码的非常棒书籍是 Robert C. Martin 写的《Clean Code: A Handbook of Agile\
  \ Software Craftsmanship》（Pearson, 2008）。在这书中，作者详细阐述了代码的各个方面。虽然代码示例不是用 JavaScript\
  \ 编写的（主要是 Java），但它们可以很容易地迁移到其他编程语言。\n\n#### 英语变量名\n\n在软件开发中，使用英语命名变量是一种常见做法：一方面，英语通常是国际团队的通用语言；另一方面，它是特殊字符最少的语言。\n\
  \n\n\n\n你已经学习过可以随时改变变量的值；你可以用新值覆盖变量。然而，有时你希望防止这种情况；也就是说，你实际上需要像变量但值不能被覆盖的变量。这些变量在编程中被称为**常量**，因为它们不是变量：一旦赋值，其值就会保持不变。\n\
  \n在 JavaScript 中，使用 `const` 关键字来定义常量，如示例 12 所示。\n\n```\nconst MAXIMUM = 5000; \n\
  ```\n\n**示例 12** 常量的声明\n\n在这里，你也可以看到常见的命名约定：使用大写，如果名称包含多个单词，用下划线分隔它们（例如 `MAXIMUM_AGE`）。\n\
  \n如果你尝试覆盖常量，如示例 13 所示，取决于运行时环境，语句会被静默忽略还是抛出错误。\n\n```\nconst MAXIMUM = 5000;\nMAXIMUM\
  \ = 4711;        // 运行时错误\nconsole.log(MAXIMUM);  // 输出: 5000 \n```\n\n**示例 13**\
  \ 常量不可被覆盖\n\n## 3.2 使用不同的数据类型\n\n总来说，JavaScript 区分六种数据类型：一方面是表示数字、字符串和布尔值的原始数据类型；另一方面是特殊类型\
  \ `null` 和 `undefined`，以及用于创建你自己的对象的 `Object` 类型（见第 4 章](#03_001.html_h4)）。\n\n\
  此外，我们将在本节中引入所谓的数组。严格来说，这些在 JavaScript 中不是数据类型，但它们对编程至关重要，我们在这里简要讨论它们（然后在第 4 章](#03_001.html_h4)中详细介绍）。不过，让我们从三种原始类型开始，因为它们最容易理解。\n\
  \n### 声明时的无数据类型\n\n与 Java 等编程语言不同，JavaScript 在声明变量时不需要指定数据类型，因为它是在运行时根据赋值的值动态确定的。\n\
  \n### 弱类型与强类型\n\n因为在声明变量时没有显式指定数据类型，这被称为**弱类型**。其他编程语言（如 Java）使用所谓的**强类型**或严格类型；也就是说，数据类型必须在变量声明时显式定义。如果编程时不小心，JavaScript\
  \ 中的弱类型可能会导致意想不到的问题，每当你处理多个不同数据类型的变量时都是。此外，JavaScript 中的弱类型也是错误的潜在来源。\n\n### 3.2.1\
  \ 数字\n\n正如你预期的，数字（更准确地说是数值）在编程中用于计算、描述数量范围或简单的计数——例如，计算购物车中所有物品的总数，统计用户访问页面的次数。\n\
  \n#### 定义数字\n\n在 JavaScript 中，数字由数值表示。例如，`9` 代表九，`4711` 代表四千七十一。小数（浮点数）用点表示——例如\
  \ `0.5` 或 `0.3333`。此外，负值也可以通过在数字前加上负号来定义——例如 `-5` 或 `-0.9`。从 ES2021 开始，可以在数字中使用下划线作为分隔符。对于较长的数字，这些分隔符可以显著提高可读性。事实上，可读性也是该功能的主要原因：数字在内部的表示仍与没有分隔符时（如下面的控制台输出所示）。\n\
  \n示例 14 显示了一些包含数字的变量定义。\n\n```\nconst number1 = 5;         // 整数定义\nconst number2\
  \ = 0.5;       // 小数定义\nconst number3 = -22;       // 负整数定义\nconst number4 = -0.9;\
  \      // 负小数定义\nconst number5 = 12_300;    // 进制表示的分符\nconst number6 = 1_000_000;\
  \    // 进制表示的分符\n\nconsole.log(number1);      // 5\nconsole.log(number2);      //\
  \ 0.5\nconsole.log(number3);      // -22\nconsole.log(number4);      // -0.9\nconsole.log(number5);\
  \      // 12300\nconsole.log(number6);      // 1000000 \n```\n\n**示例 14** 变量的定义\n\
  \n#### 进制\n\n可以使用不同的进制在 JavaScript 中定义整数。每情况的写法都不同。除了示例 14 所示的十进制表示（即 10 进制）外，可以使用二进制表示定义二进制数（2\
  \ 进制），八进制表示定义八进制数（8 进制），以及十六进制表示定义十六进制数（16 进制）。在开始阶段，你可能不会使用所有三种，或者很少使用。但是，你应该知道这些表示的存在以及它们的样子。\n\
  \n二进制数带有前缀 `0b`，后面跟着一系列 0 和 1——例如代表十进制值 85 的 `0b01010101`，如示例 15 所示。使用其他数字会导致错误。\n\
  \n```\nconst number1 = 0b01010101; // 二进制数定义（值为 85）\n// const number2 = 0b01010102;\
  \          // 无效二进制数\nconst number3 = 0b1010_0011_1010_0101; // 二进制表示的分符\n\nconsole.log(number1);\
  \                  // 85\nconsole.log(number3);                  // 41893\n```\n\
  \n**示例 15** 有效和无效二进制数的示例\n\n八进制数始终以 0 开头，后面跟着 0 到 7 之间的数字——例如代表十进制 40 的 `050`，如示例\
  \ 16 所示。如果某个数字超出 0 到 7 的范围，开头的 0 将被忽略，数字将被解释为十进制数。（八进制数的精确计算对我们目前并不重要。如果你对这个主题感兴趣，可以在\
  \ [`en.wikipedia.org/wiki/Octal`](https://en.wikipedia.org/wiki/Octal) 更多信息。）\n\n\
  ```\nconst number1 = 050;    // 八进制数定义（十进制值为 40）\n// const number2 = 078; // 无效八进制数（值为\
  \ 78）\nconst number3 = 011147; // 八进制数定义（十进制值为 4711）\n\nconsole.log(number1);  \
  \ // 40\nconsole.log(number3);   // 4711 \n```\n\n**示例 16** 有效和无效八进制数的示例\n\n\n\n\
  \n十六进制数始终以字符串 `0x` 开头，后面跟着一系列十六进制值：数字 0 到 9 以及字母 A 到 F 或 a 到 f（详情可以在 [`en.wikipedia.org/wiki/Hexadecimal`](https://en.wikipedia.org/wiki/Hexadecimal)\
  \ 处找到）。例如，十六进制值 `0xF` 代表十进制值 15。在 F 之后使用字母会导致语法错误，如 Listing 3.17 所示。与八进制数不同，系统不会对（错误的）十六进制值进行自动解释。\n\
  \n```\nconst number1 = 0xF;        // 定义一个十六进制数（十进制\n// 值为 15）\nconst number2 =\
  \ 0xb;        // 定义一个十六进制数（十进制\n// 值为 11）\n// const number3 = 0xG;     // 无效的十六进制数（语法错误）\n\
  const number4 = 0xAF_BC_C0; // 十六进制表示的分隔符\n\nconsole.log(number1);       // 15\n\
  console.log(number2);       // 11\nconsole.log(number4);       // 11517120\n```\n\
  \n**Listing 3.17** 有效和无效十六进制数的示例\n\n### 数字的数值范围\n\nJavaScript 中数字的数值范围是有限的；也就是说，你不能定义无限大或无限小的数字——毕竟，你的计算机也没有无限内存。最小可能的数字（即可以使用数字的最小值）存储在\
  \ `Number.MIN_VALUE` 变量中（更准确地说，存储在 `Number` 对象的 `MIN_VALUE` 属性中）。最大的数字（即数字的最大值）存储在\
  \ `Number.MAX_VALUE` 变量中。在大多数运行时，前者的值为 `5e-324`，后者值为 `1.7976931348623157e+308`（参见\
  \ Listing 3.18）。超出此数值范围的值无法显示。因此，如果计算的（实际）结果超出此范围，则将使用值 `-Infinity`（针对低于该范围的值）或\
  \ `Infinity`（针对高于该范围的值）来代替。\n\n```\nconsole.log(Number.MIN_VALUE);          // 输出:\
  \ 5e-324\nconsole.log(Number.MAX_VALUE);          // 输出: 1.7976931348623157e+308\n\
  console.log(Number.NEGATIVE_INFINITY);  // 输出: -Infinity\nconsole.log(Number.POSITIVE_INFINITY);\
  \  // 输出: Infinity \n```\n\n**Listing 3.18** 用于处理数值的几个特殊变量\n\n首先，你的应用程序可能永远不会触及这些限制，但再次强调，了解\
  \ JavaScript 数字的数值范围是有限的以及如何确定这些限制是有无害的（而且，如果你需要处理非常大的数字，你应该使用 `BigInt` 类型）。\n\n\
  #### 无效数值\n\n无法产生有效数值的计算将返回特殊值 `NaN`（“a number”的缩写，意为不是数字）。\n\n### 3.2.2 字符串\n\n\
  在编程中，字符串是字符序列——例如，字母、数字、特殊字符和控制字符。当你处理任何形式的文本时，都会使用字符串。例如，如果用户在商店页面上输入他们的姓名，你处理的就是一个字符字符串。如果你想向用户显示一条欢迎消息，情况也是如此；同样，你会使用字符串作为数据类型。\n\
  \n#### 字符串的定义\n\n字符串的开始和结束由引号定义。你可以同时使用单引号和双引号。然而，你必须在两者中选择其一；不允许使用混合形式。Listing\
  \ 3.19 展示了定义字符串的的一些示例。\n\n```javascript\nconst firstName = 'John';        // 单引号\n\
  const lastName = \"Doe\";          // 双引号\nconst age = \"22\";                //\
  \ 不是数字，但是一个字符串\nconst street = 'Sample Street\";  // 语法错误：混合形式\n```\n\n**Listing\
  \ 3.19** 字符串定义的示例\n\n#### 最佳实践：决定一种风格\n\n因为在实践中你经常想在字符串内部使用双引号，所以我们建议你使用单引号而不是双引号来定义字符串。这样你就可以避免对双引号进行转义。\n\
  \n在程序中不混合使用引号类型也是一种最佳实践——也就是说，不要在一个地方用单引号定义字符串，而在另一个地方用双引号定义另一个字符串。这是一种风格的一致性。\n\
  \n#### 字符的转义\n\n如果你想在字符串内部使用引号，你有几种选择，取决于你使用哪种类型的引号。Listing 3.20 显示了四种情况：如果你使用单引号定义字符串，你就可以轻松地使用双引号。同样，你可以在由双引号定义的字符串内部使用单引号。但在另外两种情况下——即在由单引号定义的字符串中使用单引号，或者在由双引号定义的字符串中使用双引号——你必须告诉\
  \ JavaScript 解释器不要将该引号解释为字符串的结束。你可以通过反斜字符来实现这一点。\n\n```javascript\nconst message1\
  \ = 'Your name is \"John\"';\nconst message2 = \"Your name is 'Doe'\";\nconst message3\
  \ = 'Your name is \\'John\\'';\nconst message4 = \"Your name is \\\"Doe\\\"\";\n\
  console.log(message1);  // 输出: Your name is \"John\"\nconsole.log(message2);  //\
  \ 输出: Your name is 'Doe'\nconsole.log(message3);  // 输出: Your name is 'John'\nconsole.log(message4);\
  \  // 输出: Your name is \"Doe\"\n```\n\n**Listing 3.20** 字符串内部引号的使用\n\n这种在前面添加反斜杠字符的技术术称为转义（反斜杠字符也被称为转义字符）。换句话说，你转义了相应的引号，以便解释器在确定字符串结束时忽略它。\n\
  \n除了单引号和双引号之外（无论你使用哪种引号来定义字符串），你还需要转义其他字符：控制字符，即无法以其本身表示的字符——例如换行、缩进等。\n\nTable\
  \ 3.3 显示了这些字符的选取。例如，通过 `\\n` 你可以插入换行；`\\t` 提供缩进；`\\f` 代表分页符。\n\n| 字符 | 含义 |\n| ---\
  \ | --- |\n| `\\n` | 新行符 |\n| `\\t` | 制表符/缩进 |\n\n\n\n\n\n| <samp class=\"listingcharacter\"\
  >\\b</samp> | 退格键 (Backspace) |\n| <samp class=\"listingcharacter\">\\r</samp> |\
  \ 回车 (Carriage return) |\n| <samp class=\"listingcharacter\">\\f</samp> | 换页 (Form\
  \ feed) |\n\n## 表 3.3 控制字符的选择\n\n列表 3.21 展示了在字符串中使用控制字符的简单示例：这里的 `<samp class=\"\
  listingcharacter\">\\n</samp>` 字符确保了在 `<samp class=\"listingcharacter\">Hello</samp>`\
  \ 单词之后以及 `<samp class=\"listingcharacter\">Mr.</samp>` 之后分别开始新行，如 列表 3.22 中的输出所示。\n\
  \n```\nconst message = 'Hello\\nMr.\\nDoe';\nconsole.log(message); \n```\n\n**列表\
  \ 3.21** 在字符串中使用控制字符的示例\n\n```\nHello\nMr.\nDoe \n```\n\n**列表 3.22** 列表 3.21 的输出\n\
  \n### 在网页中输出字符串\n\n如果你想将字符串输出到开发者控制台之外（如示例所示），而是直接在网页内容（我们将在 第 5 章 中详细介绍方法），你必须使用\
  \ `<samp class=\"listingcharacter\"><br/></samp>` 而不是 `<samp class=\"listingcharacter\"\
  >\\n</samp>` 来换行。\n\n### 在字符串中使用反斜杠字符\n\n要在字符串中表示反斜杠字符本身，必须通过反斜杠字符对其进行转义。这告诉解释器，转义后的反斜杠字符不应被视为转义字符本身。\n\
  \n### 使用模板字符串（Template Strings）\n\n在日常的字符串工作中，你通常希望在字符串的某些位置插入计算出的值或存储在变量中的值。通常使用字符串拼接来将各个部分组合成一个字符串（参见\
  \ 列表 3.23）。\n\n```javascript\nconst name = 'John Doe';\nconst age = 44;\nconst message\
  \ = 'My name is ' + name + ', I am ' + age + ' years old.';\nconsole.log(message);\
  \ // \"My name is John Doe, I am 44 years old.\" \n```\n\n**列表 3.23** 组合字符串\n\n\
  但当有许多变量部分需要合并到字符串时，这会很快变得混乱。此外，从性能角度来看，这种方法也不十分建议。这正是模板字符串派上用场的地方。你可以将模板字符串视为普通字符串的扩展形式。它们不像普通字符串那样由单引号或双引号定义，而是由\
  \ `<samp class=\"listingcharacter\">`</samp>` 字符（称为反引号）定义，如 列表 3.24 所示。\n\n```javascript\n\
  const message = `Hello world.`;\nconsole.log(message); // Hello world \n```\n\n\
  **列表 3.24** 模板字符串的定义\n\n起初这看起来和普通字符串并没有区别。然而，你可以使用模板字符串做更多操作。\n\n#### 在字符串中定义占位符\n\
  \n在模板字符串内部，你可以使用 `<samp class=\"listingcharacter\">${}</samp>` 标记来定义占位符，如 列表 3.25\
  \ 所示。在这个示例中，这两个占位符 `<samp class=\"listingcharacter\">${name}</samp>` 和 `<samp class=\"\
  listingcharacter\">${age}</samp>` 被填充了相应变量的值，并输出消息“My name is John Doe, I am 44\
  \ years old.”\n\n```javascript\nconst name = 'John Doe';\nconst age = 44;\nconst\
  \ message = `My name is ${name}, I am ${age} years old.`;\nconsole.log(message);\
  \ // My name is John Doe, I am 44 years old. \n```\n\n**列表 3.25** 模板字符串的应用\n\n####\
  \ 在字符串中求值表达式\n\n除了变量名，你还可以在大括号中使用任何其他表达式。例如，在 列表 3.26 中，第一个占位符求值为函数调用，第二个占位符求值为两个数字相加的表达式。\n\
  \n```javascript\nconst name = 'John Doe';\nconst age = 44;\nfunction getName() {\n\
  \  return name;\n}\nconst message = `My name is ${getName()}, I am twice the age\
  \ of ↩\n   ${age/2}.`;\nconsole.log(message); \n// \"My name is John Doe, I am twice\
  \ the age of 22.\" \n```\n\n**列表 3.26** 模板字符串可以包含任意表达式\n\n#### 定义多行字符串\n\n特别是当你处理长字符串时，在实践中你可能会经常将这些字符串分成几部分，然后通过\
  \ `<samp class=\"listingcharacter\">+</samp>` 运算符将它们分布在几行上（参见 列表 3.27）。包含在字符串输出中的换行必须像通常一样用\
  \ `<samp class=\"listingcharacter\">\\n</samp>` 编码。\n\n```javascript\nconst message\
  \ = 'Dear Mr. Doe,\\nwe are happy to return ' + \nthe requested documents for review.\\\
  n' + \n'Yours sincerely,\\nMrs. Smith,\\nCompany';\nconsole.log(message);\n// 输出:\n\
  // Dear Mr. Doe,\n// we are happy to return the requested documents for review.\n\
  // Yours sincerely,\n// Mrs. Smith,\n// Company\n```\n\n**列表 3.27** 未使用模板字符串的多行字符串\n\
  \n多亏了模板字符串，不再需要 `<samp class=\"listingcharacter\">+</samp>` 运算符，因为字符串内部是允许换行的。因此，列表\
  \ 3.28 中的示例可以使用模板字符串重写。此外，字符串中定义的换行也会传递到输出中。行没有缩进。\n\n```javascript\nconst message\
  \ = `Dear Mr. Doe,\nwe are happy to return the requested documents for review.\n\
  \nYours sincerely,\nMrs. Smith,\nCompany`;\nconsole.log(message);\n// 输出:\n// Dear\
  \ Mr. Doe,\n// we are happy to return the requested documents for review.\n// Yours\
  \ sincerely,\n// Mrs. Smith,\n// Company\n```\n\n**列表 3.28** 使用模板字符串的多行字符串\n\n###\
  \ 注意\n\n我们将在本章后面再次讨论模板字符串，在 第 3.5.8  节处理标签模板时。\n\n### 2.3 布尔值\n\n与数值值和字符串相比，布尔值处理起来相对较容易。这是因为它们只能取两个值之一：`<samp\
  \ class=\"listingcharacter\">true</samp>` 和 `<samp class=\"listingcharacter\">false</samp>`。当变量只有两个值可选时，布尔值通常是很好的选择（参见\
  \ 列表 3.29）。\n\n```javascript\nconst isLoggedIn = true;\nconst isAdmin = false; \n\
  ```\n\n**列表 3.29** 布尔变量的定义\n\n布尔值在定义分支方面起着核心作用。我们将在 第 3.4 节 中介绍如何操作。\n\n### 2.4\
  \ 数组\n\n你目前了解的变量每个只包含一个值：单个数字、单个字符串或单个布尔值。你现在应该知道在什么情况下使用哪种数据类型。\n\n例如，让我们考虑一个在线购物网站的用户。例如，用户的年龄将用数值值表示，用户的姓名将用字符串表示，而用户是否订阅了事通讯将用布尔值表示。\n\
  \n\n\n\n但是，为了表示用户的购物车（例如，它最简单的形式是项目名称的列表），仅靠原始数据类型是无法胜任的，因为你需要为购物车中的每个条目定义一个单独的变量，如\
  \ Listing 3.30 所示。\n\n```javascript\nconst shoppingCartItem1 = 'Record player';\
  \       // first item\nconst shoppingCartItem2 = 'Loudspeaker';         // second\
  \ item\nconst shoppingCartItem3 = 'Preamplifier';        // third item\nconst shoppingCartItem4\
  \ = 'Loudspeaker cables';  // fourth item \n```\n\n列表 3.30：在某些情况下，仅靠原始数据类型将不起作用\n\
  \n由于几个原因，这种过程将变得极其难以管理：首先，你从一开始就必须提供一定数量的变量，这意味着用户无法向购物车中添加超过预期数量的产品。其次，按名称对产品进行排序等操作也将耗费比例的时间，因为你必须手动将每个变量与其他所有变量进行比较。简而言之，仅使用目前所介绍的原始数据类型进行编程是极其不切实际的。\n\
  \n这正是数组派上用场的地方。数组无非列表；也就是说，数组不仅可以包含一个值，还可以包含多个值。对于购物车示例，你将使用数组来表示购物车。该数组中的各个条目将是购物车中产品的名称（可能可能还有识别号）。\n\
  \n在 JavaScript 中创建数组最常见且简单的方法是数组字面量表示法。在这里，你只需使用两个方括号 `[]` 来定义数组的开始和结束。包含在数组中的各个条目（或值或元素）写在这括号之间，并用逗号隔开。\n\
  \n示例见 Listing 3.31。在这种情况下，创建了一个名为 `shoppingCart` 的变量，并将此类数组赋值给它作为其值。该数组有四个条目——即\
  \ `Record player`、`Loudspeaker`、`Preamplifier` 和 `Loudspeaker cables` 字符串。\n\n```javascript\n\
  const shoppingCart = [    // start of array definition\n  'Record player',     \
  \   // first entry\n  'Loudspeaker',          // second entry\n  'Preamplifier',\
  \         // third entry\n  'Loudspeaker cables'    // fourth entry\n];        \
  \                // end of array definition \n```\n\n列表 3.31：通过字面量符号创建数组\n\n###\
  \ 注意\n\n与其像 Listing 3.31 那样为数组中的每个条目专门占用一行，这些条目也可以写在同一行，如 Listing 3.32 所示。然而，这不利于清晰度，特别是当数组中有许多条目时。因此，我们不建议这样做。\n\
  \n```javascript\nconst shoppingCart = [\n  'Record player', \n  'Loudspeaker', \n\
  \  'Preamplifier', \n  'Loudspeaker cables'\n];\nconst highscores = [74334, 24344,\
  \ 54533, 32553, 67556];\n```\n\n列表 3.32：在定义数组时，各个条目也可以包含在一行\n\n与 Java 等其他编程语言不同，数组也可以包含不同类型的条目。换句话说，一个数组可以包含数字，也可以包含字符串或布尔值、对象（稍后会详细介绍），甚至是其他数组（参见\
  \ Listing 3.33）。这是由于 JavaScript 的松散类型。此外，数组是动态增长的，这意味着当你创建一个数组时，不需要知道或指定其中应该包含多少元素。\n\
  \n```javascript\nconst values = [        // an array ...\n  'John Doe',        \
  \   // ... with a string ...\n  22,                   // ... a number ...\n  true\
  \                  // ... and a Boolean\n]; \n```\n\n列表 3.33：带有数值的数组定义示例\n\n###\
  \ 数组的内部结构\n\n你将在 第 4 章 中学习如何操作数组以及可以使用它们做什么。在该章节，你将学习如何向现有数组插入元素、从数组中删除元素、在数组中搜索特定元素、根据特定标准对数组元素进行排序等。尽管在此之前我们将向你展示数组的内部结构。它并不特别复杂，但对于理解本章后面的示例很有帮助。\n\
  \n事实上，数组具有所谓的基于索引的结构，这意味着数组中的每个元素都存储在特定的索引上（你也可以说存储在特定的位置上）。这些索引的计数从 0 开始——这非常常见——第一个元素在\
  \ 0，第二个第二个在 1，以此类推，直到最后一个元素在 `n-1`，其中 `n` 是数组的长度。例如，Listing 3.31 中的数组结构如图 3.1 所示。\n\
  \n![数组中条目的的位置——从 0 开始](img/f3.1)\n\n图 3.1：数组中条目的的位置——从 0 开始\n\n基于索引的结构在开发阶段对你很重要，因为可以使用索引来特定的访问元素。要这样做，只需在数组名称后的方括号中编写要访问元素的索引（参见\
  \ Listing 3.34）。\n\n```javascript\nconst item1 = shoppingCart[0];  // first entry\n\
  const item2 = shoppingCart[1];  // second entry\nconst item3 = shoppingCart[2];\
  \  // third entry\nconst item4 = shoppingCart[3];  // fourth entry\nconsole.log(item1);\
  \             // 'Record player'\nconsole.log(item2);             // 'Loudspeaker'\n\
  console.log(item3);             // 'Preamplifier'\nconsole.log(item4);         \
  \    // 'Loudspeaker cables' \n```\n\n列表 3.34：访问数组元素\n\n### 多维数组\n\n你已经学会了向数组添加数字、字符串和布尔值。然而，也可以向数组添加其他数组。这允许你创建多维数组（即数组的数组）。当你想在数组中存储相同数据的不同记录时，它们非常有用，类似于\
  \ Excel 表格（这是多维数组的一个示例）。\n\n#### 多维数组\n\n原则上，你还可以使用三维数组（即包含数组的数组，数组又包含数组）或任意维数的数组。然而，之后我们将讨论二维数组，因为它们是说明多维数组原理的理想选择。\n\
  \n例如，让我们考虑购物车示例，它再次在 Listing 3.35 中所示。这是一个一维数组，仅包含代表产品名称的字符串条目。\n\n```javascript\n\
  const shoppingCart = [\n  'Record player', \n  'Loudspeaker', \n  'Preamplifier',\
  \ \n  'Loudspeaker cables'\n]; \n```\n\n列表 3.35：一维数组\n\n\n\n\n```javascript\nconst\
  \ shoppingCart = [       // start of outer array\n  [                          //\
  \ first entry\n    'Record player',         // first element in the first array\n\
  \    200,                     // second element in the first array\n    1      \
  \                  // third element in the first array\n  ],\n  [              \
  \            // second entry\n    'Loudspeaker',           // first element in the\
  \ second array\n    400,                     // second element in the second array\n\
  \    2                        // third element in the second array\n  ],\n  [  \
  \                        // third entry\n    'Preamplifier',          // first element\
  \ in the third array\n    80,                      // second element in the third\
  \ array\n    1                        // third element in the third array\n  ],\n\
  \  [                          // fourth entry\n    'Loudspeaker cables',    // first\
  \ element in the fourth array\n    20,                      // second element in\
  \ the fourth array\n    2                        // third element in the fourth\
  \ array\n  ]\n];                           // end of outer array \n```\n\n列表 3.36\
  \ 多维数组的定义\n\n图 3.2 展示了此多维数组的结构。\n\n![多维数组的结构](img/img-f3.2.html)\n\n图 3.2 多维数组的结构\n\
  \n与一维数组一样，多维数组中的单个值可以通过索引来访问。然而，取决于你想要访问哪个维度中的哪个数组，你需要提供更详细的信息。例如，要访问第一个数组的第一个值（`Record\
  \ player` 值），你需要编写 `shoppingCart[0][0]`。第一个 `[0]` 访问第一个数组（在第一维度）；第二个 `[0]` 访问它的第一个值（在第二个维度）。列表\
  \ 3.37 显示了如何通过这种方式输出 `shoppingCart` 数组中所有数组的所有值。\n\n```javascript\nconsole.log(shoppingCart[0][0]);\
  \  // Output: Record player\nconsole.log(shoppingCart[0][1]);  // Output: 200\n\
  console.log(shoppingCart[0][2]);  // Output: 1\nconsole.log(shoppingCart[1][0]);\
  \  // Output: Loudspeaker\nconsole.log(shoppingCart[1][1]);  // Output: 400\nconsole.log(shoppingCart[1][2]);\
  \  // Output: 2\nconsole.log(shoppingCart[2][0]);  // Output: Preamplifier\nconsole.log(shoppingCart[2][1]);\
  \  // Output: 80\nconsole.log(shoppingCart[2][2]);  // Output: 1\nconsole.log(shoppingCart[3][0]);\
  \  // Output: Loudspeaker cables\nconsole.log(shoppingCart[3][1]);  // Output: 20\n\
  console.log(shoppingCart[3][2]);  // Output: 2 \n```\n\n列表 3.37 访问多维数组的值\n\n###\
  \ 3.2.5 对象\n\n自然，你可以在程序所需的所有数据存储在许多变量中。在某个时刻，你将会有几十、数百或数千个不同的变量，并且“见树不见林”（更不用说潜在的命名冲突了）。更好的做法——也是面向对象编程中的常见做法——是将相关的变量和函数组合在对象中。这种方法还创建了清晰性并增加了你的源码的可用性。\n\
  \n在对象的上下文中，变量被称为属性（对象属性）或特征，而函数则称为方法（对象方法）。属性提供关于其包含的对象的信息，例如人的姓名或年龄、购物车中的物品，或网页上的链接数量。对象方法代表了与它们被定义的对象相关的某些任务，例如调整人的年龄或向购物车中添加项目。\n\
  \n#### 对象的定义\n\n在 JavaScript 中创建对象的最简单方法是使用对象字面量符号。你只需使用大括号定义对象，并在这些大括号内列出对象属性和对象方法，用逗号隔开。例如，列表\
  \ 3.38 显示了如何定义一个代表购物车物品的对象。\n\n```javascript\nconst item = {\n  name: 'JavaScript:\
  \ The Comprehensive Guide', \n  price: 55.95,\n  author: 'Philip Ackermann', \n\
  \  isbn: '978-1-4932-2286-5', \n  printDescription: function() {\n    console.log(`${this.author}:\
  \ ${this.name}`);\n  }\n} \n```\n\n列表 3.38 使用对象字面量符号创建对象\n\n示例中的对象包含 `name`、`price`、`author`\
  \ 和 `isbn` 这四个属性，以及 `printDescription()` 方法。然而，对象实际上是键值对，因此键和值之间用冒号隔开。对象的结构在图 3.3\
  \ 中所示。\n\n![键值对表示的属性和方法](img/img-f3.3.html)\n\n图 3.3 用键值对表示的属性和方法\n\n###### this\
  \ 关键字\n\n如果你仔细观察上面的列表，你会注意到 `this` 关键字。该关键字用于指向当前对象（“自身”）。例如，`this.author` 允许你访问对象的\
  \ `author` 属性。`this` 经常会让 JavaScript 初学者感到困惑，所以我们会在书中后续部分对其进行详细介绍。\n\n在 JavaScript\
  \ 中创建对象有很多方法，但我们将在书中之后讨论它们。在这里列出它们仅是为了完整性：\n\n*   通过构造函数\n*   通过 `Object.create()`\
  \ 方法\n*   通过 ES2015 类的实例化\n\n### 3.2.6 特殊数据类型\n\n除了目前讨论的数据类型外，JavaScript 中还有两种特殊数据类型，它们在实践中经常被混淆或或用于相同的用途。这两种数据类型有一个共同点：它们都只只有一个值，这也反映在这些数据类型的名称中：`null`\
  \ 和 `undefined`。\n\n如果你声明了一个变量但尚未初始化它（即通过为其赋值值），它具有 `undefined` 值（见列表 3.39）。\n\n\
  ```javascript\nlet name;\nconsole.log(name); // Output: undefined\nname = 'John\
  \ Doe';\nconsole.log(name); // Output: John Doe \n```\n\n列表 3.39 只要变量尚未初始化，它就具有\
  \ undefined 值\n\n\n\n\n然而，`null` 数据类型表示一个空对象。例如，在列表 3.40 中，首先创建 `dog` 和 `person`\
  \ 对象，然后将 `dog` 对象赋值给 `person` 对象的 `pet` 属性。因此，如果你访问 `person.pet`，将输出 `dog` 对象，且\
  \ `person.pet` 属性指向 `dog` 对象。这种关系在图 3.4 中所示。如果你现在将 `person.pet` 属性设置为 `null`，指向\
  \ `dog` 对象的指针就会断开（参见图 3.5）。\n\n```javascript\nconst dog = {\n  name: 'Bello'\n}\n\
  const person = {\n  firstName: 'John', \n  lastName: 'Doe', \n  pet: dog\n}\nconsole.log(person.pet);\
  \  // 输出: Object {name: \"Bello\"}\nperson.pet = null;\nconsole.log(person.pet);\
  \  // 输出: null \n```\n\n**列表 3.40** 空值用于表示对象变量未被填充\n\n![pet 属性指向 dog 对象](img/img-f3.4.html)\n\
  \n**图 3.4** pet 属性指向 dog 对象\n\n![pet 属性现在指向由 null 表示的空对象](img/img-f3.5.html)\n\n\
  **图 3.5** pet 属性现在指向由 null 表示的空对象\n\n### undefined 与 null 的区别\n\n`undefined` 值不是设计为了手动赋值给变量的，但\
  \ `null` 值可以。`undefined` 值表示变量尚未初始化；`null` 值表示一个空对象指针。\n\n### 3.2.7 符号 (Symbols)\n\
  \n符号是 ES2015 引入的另一种原始数据类型；它们允许你定义唯一且不可变的值。可以使用 `Symbol()` 函数创建符号，并可选地传递一个符号描述作为参数。列表\
  \ 3.41 展示了几个示例。\n\n```javascript\nconst symbol1 = Symbol();\nconst symbol2 = Symbol('exampleDescription');\n\
  const symbol3 = Symbol();\nconst symbol4 = Symbol('exampleDescription');\nconsole.log(symbol1);\
  \              // 输出: Symbol()\nconsole.log(symbol2);              // 输出: Symbol(exampleDescription)\n\
  console.log(symbol3);              // 输出: Symbol()\nconsole.log(symbol4);      \
  \        // 输出: Symbol(exampleDescription)\nconsole.log(symbol1 === symbol3);  //\
  \ 输出: false\nconsole.log(symbol2 === symbol4);  // 输出: false \n```\n\n**列表 3.41**\
  \ 创建符号\n\n你会发现，无论创建符号时是否带有一个描述，也无论两个符号的描述是否相同，两个符号之间始终是不同的。因此，对两个符号进行比较的结果将为值 `false`，如列表所示。\n\
  \n我们稍后会回到符号话题——特别是在我们在下一章处理对象和对象属性时。现在，你只需要记住符号是唯一且不可变的，并且在实践中使用的频率远低于这里介绍的其他数据类型。\n\
  \n## 3.3 部署不同的运算符\n\n你现在已经知道如何定义不同数据类型的变量以及如何在它们中存储值。因此，编程的基础已经奠定。然而，通常你不仅想在程序中存储数据，还想处理这些数据，或者对其进行更改和组合以获得新数据。在实现商店页面时，你可能想根据购物车中的物品计算运费，或者根据收件者的姓名对新闻邮件进行个性化处理，添加诸如个人问候，例如“您的个人新闻邮件，John\
  \ Doe”。在 JavaScript（以及通用编程）中，你使用运算符来实现这些。\n\n从数学角度，你可能记得“表达式”（expression）这个术语。一个数学公式如\
  \ `5 * 17` 由操作数和运算符组成。在示例中，`5` 和 `17` 是操作数，`*` 是运算符。与语句（statements）不同，表达式总有一个返回的结果。在\
  \ `5 * 17` 的示例中，结果是 `85`。这相对简单。在实践中，表达式可能会更加复杂并包含多个操作数。\n\n### 注意\n\n语句和表达式经常被混淆，所以这里有一个简短的描述。在\
  \ JavaScript 中，每个语句都以分号结束。在 JavaScript（以及其他语言）中，变量和简单值都可以作为操作数。运算符连接表达式内部的各个操作数。根据操作数的数量，运算符分为以下几种类型：\n\
  \n- 指向单个操作数的运算符称为**一元运算符**（unary operator）。例如递增运算符 `++`，它可以直接让变量加一：`counter++`。\n\
  - 指向两个操作数的运算符称为**二元运算符**（binary operator）。例如加法运算符 `+`，它可以用于两个数字之和——例如 `x + y`。\n\
  - JavaScript 甚至提供了指向三个操作数的运算符。这就是**三元运算符**（ternary operator）（第 3.4.3 节）。\n\n###\
  \ 3.3.1 数字运算符\n\nJavaScript 提供了一套算术运算符——即用于数字处理和计算的运算符，包括加、减、乘、除和模运算符。此外，还有递增和递减运算符，它们分别为数字加\
  \ 1（递增运算符）或从数字减 1（递减运算符）。从 ES2016 开始，提供了指数运算符，用于计算幂。表格 3.4 为你提供了这些运算符的概述和示例。\n\n\
  | 计算类型 | 运算符 | 示例 | x 的结果 |\n| --- | --- | --- | --- |\n| 加法 | `+` | `let x = 20\
  \ + 20` | `40` |\n| 减法 | `-` | `let x = 20 - 5` | `15` |\n| 乘法 | `*` | `let x =\
  \ 20 * 5` | `100` |\n| 除法 | `/` | `let x = 100 / 5` | `20` |\n\n\n\n\n\n| 取模 | `%`\
  \ | `let x = 20; x % 6` | `2` |\n| 增 | `++` | `let x = 5; x++;` | `6` |\n| 减 | `--`\
  \ | `let x = 6; x--;` | `5` |\n| 幂计算 | `**` | `let x = 5**5;` | `3125` |\n\n###\
  \ 表 3.4 算术运算符\n\n关于算术运算符没有更多要说的了。你仍然需要知道运算符的求值顺序，以防表达式中使用了多个算术运算符。你可能在数学课中了解过这个问题。\n\
  \n你只需要记住，乘法和除法的执行顺序在加法和减法之前。因此，表达式 `4 + 4 * 5` 的结果为 `24`，因为先计算了 `4 * 5`，然后在第二步中将第一个操作数加到这个中间结果（`4\
  \ + 20`）。然而，如果你想先计算加法再计算乘法，必须用括号将加法的操作数括起来；例如，`(4 + 4) * 5` 的结果是 `40`。\n\n### 3.3.2\
  \ 更便于赋值的运算符\n\n经常会出现你想使用一个已经包含数字的变量作为操作数，同时将操作结果作为新值赋值给该变量。`result = result + 1`\
  \ 语句就是这样一个例子。`result` 变量一方面作为加法的操作数，另一方面又作为加法结果的目标变量。\n\n作为这种长写法的替代方案，你也可以使用加、减、乘、除和取余数运算符的简写形式，它结合了两个步骤：操作以及将结果赋值给对应的变量。列表\
  \ 3.42 显示了一些示例，表 3.5 提供了这些运算符的概述。\n\n```\nlet result = 5;\nresult += 11;  // 变量现在的值是\
  \ 16 ...\nresult -= 1;   // ... 现在的值是 15 ...\nresult /= 3;   // ... 现在的值是 5 ...\n\
  result *= 4;   // ... 现在的值是 20 ...\nresult %= 5;   // ... 现在的值是 0. \n```\n\n####\
  \ 列表 3.42 实践中的各种简写形式\n\n| 运算符 | 描述 | 示例 | 长写法 |\n| --- | --- | --- | --- |\n| `+=`\
  \ | 将右的操作数加上左侧变量的值，并将新值赋值给变量 | `result += 11` | `result = result + 11` |\n| `-=`\
  \ | 从左侧变量的值减去右的操作数，并将新值赋值给变量 | `result -= 11` | `result = result - 11` |\n| `*=`\
  \ | 将左侧变量的值乘以右的操作数，并将新值赋值给变量 | `result *= 11` | `result = result * 11` |\n| `/=`\
  \ | 将左侧变量的值除以右的操作数，并将新值赋值给变量 | `result /= 11` | `result = result / 11` |\n| `%=`\
  \ | 计算左侧变量值除以右操作数的余数，并将新值赋值给变量 | `result %= 11` | `result = result % 11` |\n| `**=`\
  \ | 返回左侧值的的右侧操作数幂的结果，并将新值赋值给变量 | `result **= 11` | `result = result ** 11` |\n\n\
  #### 表 3.5 各种组合的简写形式\n\n### 3.3.3 处理字符串的运算符\n\n在实践中，你偶尔会面临合并两个或多个字符串以形成新字符串的任务，例如个性化新闻通讯的示例。在\
  \ JavaScript 中，连接两个字符串的运算符是 `+` 运算符。列表 3.43 显示了一个示例。在这里，`salutation` 变量与 `name`\
  \ 变量拼接，该操作的结果存储在 `message` 变量中，该变量包含值 `Your newsletter,John Doe`（注意逗号后面缺少空格）。\n\n\
  ```\nconst salutation = 'Your newsletter,';\nconst name = 'John Doe';\nconst message\
  \ = salutation + name;\n```\n\n#### 列表 3.43 两个字符串的拼接\n\n要在逗号后插入一个空格，只需在拼接时包含它，如列表\
  \ 3.44 所示。在这里，使用了两次 `+` 运算符来连接变量 `salutation`、`name` 以及中间的空格（字符串 `' '`）。如你所见，用于字符串拼接的\
  \ `+` 运算符可以在表达式中多次使用。\n\n```javascript\nconst salutation = 'Your newsletter,'; //\
  \ 字符串 1\nconst name = 'John Doe';                         // 字符串 2\nconst message\
  \ = salutation + ' ' + name;         // 拼接加空格\n```\n\n#### 列表 3.44 三个字符串的拼接\n\n\
  除了 `+` 运算符外，你可以与字符串使用的另一个运算符是赋值运算符 `+=`。与一样，它用于将运算符右侧的值添加到左侧变量中，在字符串的情况下，这意味着将两个字符串拼接在一起。\n\
  \n因此，上面的示例也可以像列表 3.45 所示进行重写。在第一步中，将值 `\"Your newsletter,\"` 赋值给 `message` 变量，然后追加一个空格（变量现在的值是\
  \ `\"Your newsletter, \"`——即相同的消息，但包含一个空格），在最后一步中，添加 `name` 变量的内容（该变量现在拥有完整的欢迎消息，\"\
  Your newsletter, John Doe\"）。\n\n```javascript\nlet message = 'Your newsletter,';\n\
  message += ' ';\nmessage += name; \n```\n\n\n\n\n\n列表 3.45 使用赋值运算符进行拼接\n\n#### Note\
  \ 释\n可以与不同数据类型使用的运算符，例如 `+` 运算符和 `+=` 运算符（它们可以同时处理数字和字符串），也被称为重载运算符。在重载运算符的情况下，操作数的数据类型决定了具体执行哪种操作。对于之前提到的两个运算符而言，这取决于是执行的是（字符串的）拼接还是（数字的）加。\n\
  \n### 3.3.4 处理布尔值的运算符\n为了处理布尔值，编程中提供了各种运算符，这些运算符被称为逻辑运算符。总共有三个运算符：`&&` 运算符（与运算符）、`||`\
  \ 运算符（或运算符）和 `!` 运算符（逻辑非运算符），如表 3.6 展示了各种逻辑运算符的简单代码示例。两个初始变量 `isLoggedIn` 和 `isAdmin`\
  \ 分别具有值 `true` 和 `false`。因此，与操作返回 `false`（在变量 `isLoggedInAndAdmin` 中），或操作返回 `true`（在变量\
  \ `isLoggedInOrAdmin` 中），而 `isLoggedIn` 的取反返回 `false`（在变量 `isLoggedOut` 中）。\n\n\
  ```\nconst isLoggedIn = true;\nconst isAdmin = false;\nconst isLoggedInAndAdmin\
  \ = isLoggedIn && isAdmin; // AND operator\nconst isLoggedInOrAdmin = isLoggedIn\
  \ || isAdmin;  // OR operator\nconst isLoggedOut = !isLoggedIn;                \
  \  // negation\nconsole.log(isLoggedInAndAdmin);                  // false\nconsole.log(isLoggedInOrAdmin);\
  \                   // true\nconsole.log(isLoggedOut);                         //\
  \ false \n```\n\n**列表 3.46** 各种逻辑运算符的使用\n\n表 3.7 展示了各种操作数组合下逻辑与运算符的结果，表 3.8 展示了逻辑或运算符的结果，而表\
  \ 3.9 展示了逻辑非的结果。\n\n| 操作数 1 | 操作数 2 | 结果 |\n| --- | --- | --- |\n| `true` | `true`\
  \ | `true` |\n| `true` | `false` | `false` |\n| `false` | `true` | `false` |\n|\
  \ `false` | `false` | `false` |\n\n**表 3.7** 逻辑与操作结果\n\n| 操作数 1 | 操作数 2 | 结果 |\n\
  | --- | --- | --- |\n| `true` | `true` | `true` |\n| `true` | `false` | `false`\
  \ |\n| `false` | `true` | `true` |\n| `false` | `false` | `false` |\n\n**表 3.8**\
  \ 逻辑或操作结果\n\n| 操作数 | 结果 |\n| --- | --- |\n| `true` | `true` |\n| `false` | `true`\
  \ |\n\n**表 3.9** 逻辑非结果\n\n#### 用于非布尔操作数的布尔运算符\n起初可能让人困惑的一点是，布尔运算符也可以用于非值的操作数，例如数字、字符串或对象。在这种情况下，JavaScript\
  \ 解释器将根据后续的特殊规则运行。\n\n以下规则适用于逻辑与：\n* 如果第一个操作数求值为 `false`，则返回第一个操作数。求值为 `false` 的值也被称为假值（falsy\
  \ value）。例如数字 0 或空字符串。\n* 在所有其他情况下，返回第二个操作数。\n\n表 3.10 显示了概述，列表 3.47 展示了一些示例。\n\n\
  | 操作数 1 | 操作数 2 | 结果 |\n| --- | --- | --- |\n| Object | `x` | `x` |\n| `true` |\
  \ `x` | `x` |\n| `false` | `x` | `false` |\n| `x` | `null` | `null` |\n| `null`\
  \ | `x` | `null` |\n| `x` | `NaN` | `NaN` |\n| `NaN` | `x` | `NaN` |\n| `x` | `undefined`\
  \ | `undefined` |\n| `undefined` | `x` | `undefined` |\n\n\n\n\n\n```\nconst john\
  \ = {\n  firstName: 'John',\n  lastName: 'Doe'\n};\n\nconst james = {\n  firstName:\
  \ 'James',\n  lastName: 'Doe'\n};\n\nconst isJohnAndJames = john && james;\nconsole.log(isJohnAndJames);\
  \ \n// Output: Object {firstName: \"James\", lastName: \"Doe\"}\n\nconsole.log(false\
  \ && 'John');  // Output: false\nconsole.log('John' && null);   // Output: null\n\
  console.log(null && 'John');   // Output: null \n```\n\n## **Listing 3.47** 用于非布尔操作数的\
  \ AND 操作\n\n以下内容适用于逻辑 OR 操作：\n\n- 如果第一个操作数的求值结果为 `true`，则返回第一个操作数。\n- 在所有其他情况下，返回第二个操作数。\n\
  \n表 3.11 显示了另一个概述，而 Listing 3.48 提供了了一些代码示例。\n\n| 操作数 1 | 操作数 2 | 结果 |\n| --- |\
  \ --- | --- |\n| Object | `x` | Object |\n| `false` | `x` | `x` |\n| `x` | `null`\
  \ | `x` |\n| `null` | `x` | `x` |\n| `null` | `null` | `null` |\n| `x` | `NaN` |\
  \ `x` |\n| `NaN` | `x` | `x` |\n| `NaN` | `NaN` | `NaN` |\n| `x` | `undefined` |\
  \ `x` |\n| `undefined` | `x` | `x` |\n| `undefined` | `undefined` | `undefined`\
  \ |\n\n## **表 3.11** 非布尔操作数 OR 操作的结果结果\n\n```\nconst john = {\n  firstName: 'John',\n\
  \  lastName: 'Doe'\n};\n\nconst james = {\n  firstName: 'James',\n  lastName: 'Doe'\n\
  };\n\nconst isJohnOrJames = john || james;\nconsole.log(isJohnOrJames);\n// Output:\
  \ Object {firstName: \"John\", lastName: \"Doe\"}\nconsole.log(false || 'John');\
  \ // Output: John\nconsole.log('John' || null);  // Output: John\nconsole.log(null\
  \ || 'John');  // Output: John \n```\n\n## **Listing 3.48** 用于非布尔操作数的 OR 操作\n\n\
  以下内容适用于取反：\n\n- 空字符串返回 `true`；非空字符串返回 `false`。\n- 除 0 以外的所有数字（包括特殊的 `Infinity` 值）都返回\
  \ `false`，但数字 0 返回 `true`。\n- 对象返回 `false`。\n- 特殊值 `null`、`NaN` 和 `undefined` 均返回\
  \ `true`。\n\n表 3.12 显示了另一个概述，而 Listing 3.49 提供了一些代码示例。\n\n| 操作数 | 结果 |\n| --- |\
  \ --- |\n| 空字符串 | `true` |\n| 非空字符串 | `false` |\n| 数字 0 | `true` |\n| 不等于 0 的数字（包括\
  \ `Infinity`） | `false` |\n| 对象 | `false` |\n| `null` | `true` |\n| `NaN` | `true`\
  \ |\n\n## **表 3.12** 非布尔操作数取反的结果\n\n```\nconst john = {\n  firstName: 'John',\n\
  \  lastName: 'Doe'\n};\n\nconst james = {\n  firstName: 'James',\n  lastName: 'Doe'\n\
  };\n\nconst name = 'John';\nconst emptyString = '';\nconsole.log(!name);\nconsole.log(!emptyString);\n\
  const age = 0;\nconsole.log(!age);\nconst result = 25;\nconsole.log(!result);\n\
  const nullVal = null;\nconsole.log(!nullVal);\nconst nanVal = NaN;\nconsole.log(!nanVal);\n\
  const undefinedVal = undefined;\nconsole.log(!undefinedVal);\n```\n\n### 空值合并运算符\
  \ (Nullish Coalescing Operator)\n\nES2020 引入另一个逻辑运算符——空值合并运算符，它的工作方式与逻辑 OR 运算符 (`||`)\
  \ 类似，但有一个细微的区别：只有当左侧操作数为 `null` 或 `undefined` 时，`??` 运算符才返回右侧操作数的值。记住，OR 运算符即使左侧操作值为假值（falsy，即求值为为\
  \ `false` 的值），也会返回右侧操作数。\n\n```\nconst someNullValue = null;\nconst someUndefinedValue\
  \ = undefined;\nconst someNumber = 0;\nconst someText = '';\nconst someBoolean =\
  \ false;\n\n// 左侧操作数为 null --> 返回右侧操作数\nconst a = someNullValue ?? 'Default value\
  \ for null';\nconsole.log(a);\n// Output: Default value for null\n\n// 左侧操作数为 undefined\
  \ --> 返回右侧操作数\nconst b = someUndefinedValue ?? 'Default value for undefined';\n\
  console.log(b);\n// Output: Default value for undefined\n\n// 左侧操作数为 0（假值） --> 返回左侧操作数\n\
  const c = someNumber ?? 80;\nconsole.log(c);\n// Output: 0\n\n// 左侧操作数为空字符串（假值）\
  \ --> 返回左侧操作数\nconst d = someText ?? 'Default value for empty string';\nconsole.log(d);\n\
  // Output: ''\n\n// 左侧操作数为 false --> 返回左侧操作数\nconst e = someBoolean ?? true;\nconsole.log(e);\n\
  // Output: false\n\nconst x = 4711;\n\nconsole.log({}) ?? x);                //\
  \ {}\nconsole.log(false ?? x);             // false\nconsole.log(x ?? null);   \
  \           // 4711\nconsole.log(null ?? x);              // 4711\nconsole.log(null\
  \ ?? null);           // null\nconsole.log(x ?? NaN);               // 4711\nconsole.log(NaN\
  \ ?? x);               // NaN\nconsole.log(x ?? undefined);         // 4711\nconsole.log(undefined\
  \ ?? x);         // 4711\nconsole.log(undefined ?? undefined); // undefined \n```\n\
  \n## **Listing 3.50** 空值合并运算符实战\n\n正如你所见，根据逻辑表达式的结果，你会在编程中经常使用逻辑运算符。\n\n\n\n\n\n\
  | Object | `x` | Object |\n| :--- | :--- | :--- |\n| `false` | `x` | `false` |\n\
  | `x` | `null` | `x` |\n| `null` | `x` | `x` |\n| `null` | `null` | `null` |\n|\
  \ `x` | `NaN` | `x` |\n| `NaN` | `x` | `x` |\n| `NaN` | `NaN` | `NaN` |\n| `x` |\
  \ `undefined` | `x` |\n| `undefined` | `x` | `x` |\n| `undefined` | `undefined`\
  \ | `undefined` |\n\n**表 3.13** 非布尔操作数的 `??` 操作结果\n\n### 3.3.5 用于位操作的运算符\n\n位操作允许你对值的单个\
  \ own 位进行操作。在实践中，你可能很少会这样做，但在表 3.14 中显示了这些运算符的列表。\n\n| 运算符 | 含义 |\n| :--- | :---\
  \ |\n| `&` | 位与 |\n| `|` | 位或 |\n| `^` | 位异异 |\n| `~` | 位取反，其中数字 `x` 的结果为 `-(x +\
  \ 1)`。例如，对于数字 65，结果为 -66。 |\n| `<<` | 位左移 |\n| `>>` | 位右移 |\n| `>>>` | 无符号符号右移 |\n\
  \n**表 3.14** 位运算符\n\n代码列表 3.51 也显示了一些运算符的使用及其对应的结果。\n\n```\nlet BYTE_A = 0b00000001;\
  \       // Binary value 00000001, decimal value 1\n// Bitwise left shift\nBYTE_A\
  \ = BYTE_A << 1;          // Binary value 00000010, decimal value 2\nBYTE_A = BYTE_A\
  \ << 1;          // Binary value 00000100, decimal value 4\nBYTE_A = BYTE_A << 1;\
  \          // Binary value 00001000, decimal value 8\nBYTE_A = BYTE_A << 1;    \
  \      // Binary value 00010000, decimal value 16\n// bitwise right shift\nBYTE_A\
  \ = BYTE_A >> 1;          // Binary value 00001000, decimal value 8\nBYTE_A = BYTE_A\
  \ >> 1;          // Binary value 00000100, decimal value 4\nBYTE_A = BYTE_A >> 1;\
  \          // Binary value 00000010, decimal value 2\nBYTE_A = BYTE_A >> 1;    \
  \      // Binary value 00000001, decimal value 1\n\nlet BYTE_B = 0b01000001;   \
  \    // Binary value 01000001, decimal value 65\n\n// bitwise AND\nlet BYTE_C =\
  \ BYTE_A & BYTE_B;  // Binary value 00000001, decimal value 1\n\n// bitwise OR\n\
  let BYTE_D = BYTE_A | BYTE_B;  // Binary value 01000001, decimal value 65\n\n //\
  \ bitwise exclusive OR\nlet BYTE_E = BYTE_A ^ BYTE_B;  // Binary value 01000000,\
  \ decimal value 64 \n```\n\n**代码列表 3.51** 位运算符的使用\n\n### 3.3.6 用于比较值的运算符\n\n比较两个值无疑是编程中执行最频繁的任务之一，无论是比较字符串、数字还是布尔值。在这方面，JavaScript\
  \ 提供了几个运算符，在表 3.15 中进行了详细描述。\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `==` | 等（检查两个值是否相同）\
  \ |\n| `!=` | 不等于（检查两个值是否不等） |\n| `===` | 严格相等（检查值和数据类型是否相同） |\n| `!==` | 严格不等（检查值或数据类型是否不等）\
  \ |\n| `<` | 小于（检查左操作数是否小于右操作） |\n| `>` | 大于（检查左操作数是否大于右操作） |\n| `<=` | 小于等于（检查左操作数是否小于或等于右操作）\
  \ |\n| `>=` | 大于等于（检查左操作数是否大于或等于右操作） |\n\n**表 3.15** 关系运算符\n\n运算符 `<`, `>`, `<=`,\
  \ `>=` 对于数值的工作方式正如数学领域所预期的那样：它们被用于比较两个值，并检查左值是否分别小于（`<`）、大于（`>`）、小于等于（`<=`）或大于等于（`>=`）右值。这些运算符每一个返回一个布尔值。\n\
  \n到目前为止，这并没有什么新奇的。但值得提到的是各种相等或不等运算符的行为。每种情况都有两个运算符：用于测试相等的 `==` 和 `===`，以及用于测试不等的\
  \ `!=` 和 `!==`。区别在于，`==` 和 `!=` 仅比较两个值本身，而 `===` 和 `!==` 还会比较对应值的数据类型。\n\n\n\n\n\
  \nListing 3.52 和 Listing 3.53 提供了几个具体的示例。（请逐行并行查看这两个代码列表，以更好地理解运算符之间的区别。）例如，`==`\
  \ 运算符在比较 `false == 0` 时返回 `true`，因为解释器会尝试将第二个操作数（`0`）转换为第一个操作数的数据类型（即布尔数据类型）。由于\
  \ `0` 被转换为布尔值 `false`，因此比较的结果为 `true`。相反，`1` 被转换为布尔值 `true`，这就是为什么第二行的比较返回 `false`。\n\
  \n同样地，例如，如果第一个操作数也是字符串，则数值 `4711` 将被转换为字符串。因此，比较 `\"4711\" == 4711` 也会产生值 `true`。\n\
  \n```\nconsole.log(false == 0);      // 输出: true\nconsole.log(false == 1);     \
  \ // 输出: false\nconsole.log(true == 1);       // 输出: true\nconsole.log(true == 0);\
  \       // 输出: false\nconsole.log(\"4711\" == 4711);  // 输出: true\nconsole.log(false\
  \ != 0);      // 输出: false\nconsole.log(false != 1);      // 输出: true\nconsole.log(true\
  \ != 1);       // 输出: false\nconsole.log(true != 0);       // 输出: true\nconsole.log(\"\
  4711\" != 4711);  // 输出: false \n```\n\n**Listing 3.52** 用于测试相等和不相等的运算符使用\n\n####\
  \ 隐式类型转换\n\n将值自动转换为另一种数据类型也称为隐式类型转换。\n\n与 `==` 和 `!=` 运算符不同，`===` 和 `!==` 这两个运算符还会检查两个操作数的数据类型是否匹配。这在\
  \ Listing 3.53 中得到了证明，其中值 `false` 和 `0` 的比较（在 Listing 3.52 中结果为 `true`）现在结果为 `false`，因为第一个操作数是布尔值，而第二个操作数是数字。\n\
  \n```\nconsole.log(false === 0);     // 输出: false\nconsole.log(false === 1);   \
  \  // 输出: false\nconsole.log(true === 1);      // 输出: true\nconsole.log(true ===\
  \ 0);      // 输出: false\nconsole.log(\"4711\" === 4711); // 输出: false\nconsole.log(false\
  \ !== 0);     // 输出: true\nconsole.log(false !== 1);     // 输出: true\nconsole.log(true\
  \ !== 1);      // 输出: true\nconsole.log(true !== 0);      // 输出: true\nconsole.log(\"\
  4711\" !== 4711); // 输出: true \n```\n\n**Listing 3.53** 用于测试严格相等和严格不相等的运算符使用\n\n\
  #### Tips\n\n在比较两个变量时，始终使用严格比较运算符是一种最佳实践。这可以防止自动类型转换生效，自动类型转换往往会导致难以发现的程序错误。\n\n\
  #### 非数值值的比较运算符\n\n`<`, `>`, `<=` 和 `=` 运算符在与数值配合使用时非常可靠。如果你将这些运算符与数值与其他数据类型混合使用，由于自动类型转换，结果并不总是如预期的。然而，我们不会深入讨论这些特殊情况的细节。\n\
  \n### 3.3.7 可选链运算符\n\n在长一段时间内，JavaScript 中访问对象嵌套属性或方法的过程是非常繁琐的：在通往目标属性的路径上，你必须逐级检查层级中的所有属性是否存在。假设你想访问层级结构\
  \ `john.contact.email` 中的嵌套属性 `email`，如 Listing 3.54 所示。直到 ES2019 及其之前的版本，必须检查层级结构中的每一个属性是否存在。层级越深，检查就越费力，样板代码就越多，代码就越混乱。\n\
  \n```\nconst john = {\n  firstName: 'John',\n  lastName: 'Doe',\n  contact: {\n\
  \    email: 'john.doe@example.com'\n  }\n};\n\nconst james = {\n  firstName: 'James',\n\
  \  lastName: 'Doe',\n};\n\nif (john.contact && john.contact.email) {\n  console.log(john.contact.email);\n\
  }\n// 输出: john.doe@example.com\n\n// 运行时错误！\n// console.log(james.contact.email);\n\
  \nif (james.contact && james.contact.email) {\n  // 这将防止错误的发生\n}\n```\n\n**Listing\
  \ 3.54** 直至 ES2019 的嵌套属性访问\n\n幸运的是，ES2020 将可选链运算符包含在了标准中。该运算符被直接放置在访问的属性之后，这确保了只有当相应属性存在时才会访问下一层层级。如果不存在，访问尝试将终止。因此，使用可选链运算符后，之前的示例看起来将像\
  \ Listing 3.55。那些连续布尔表达式的样板代码被省略了，代码变得更加易读。\n\n```\nconst john = {\n  firstName:\
  \ 'John',\n  lastName: 'Doe',\n  contact: {\n    email: 'john.doe@example.com'\n\
  \  }\n};\n\nconst james = {\n  firstName: 'James',\n  lastName: 'Doe',\n};\n\n//\
  \ 通过可选链运算符访问嵌套属性：\nconsole.log(john.contact?.email);\n// 输出: john.doe@example.com\n\
  \nconsole.log(james.contact?.email);\n// 输出: undefined\n\n// 另一种可能性：在多层级上使用运算符\n\
  console.log(john?.contact?.email);\n// 输出: john.doe@example.com\n\nconsole.log(james?.contact?.email);\n\
  // 输出: undefined \n```\n\n**Listing 3.55** 使用可选链运算符访问嵌套属性\n\n#### Note\n\n方便的是，可选链运算符不仅可以访问属性，还可以访问方法。在这种情况下，只需将运算符放置在方法调用之后，如\
  \ Listing 3.56 所示。\n\n```\nconsole.log(someObject.someFunt()?.someValue);\n```\n\
  \n**Listing 3.56** 在方法中使用可选链运算符\n\n### 3.3.8 逻辑赋值运算符\n\nES2021 在标准中包含了逻辑赋值运算符。这组小型运算符将逻辑运算符和赋值表达式相结合，使得变量和对象属性的条件赋值变得更加简单。总共有三个逻辑赋值运算符，每个运算符作用于两个操作数（参见\
  \ Listing 3.57）。\n\n\n\n\n逻辑或赋值运算符 `||=` 是逻辑或 `||` 运算符与赋值运算符 `=` 的组合；也就是说，如果左操作的值为假（falsy），它会将右操作数赋值给左操作数，因此它是表达式\
  \ `a || (a = b)` 的简写。逻辑与赋值运算符 `&&=` 的工作原理类似，它将逻辑与 `&&` 运算符与赋值运算符 `=` 结合，并且只有在左操作值为真（truthy，即求值为\
  \ `true` 的值）时才将右操作数赋值给左操作数。这意味着它是表达式 `a && (a = b)` 的简写。空赋值运算符 `??=` 则是表达式 `a ??\
  \ (a = b)` 的简写。只有当第一个操作数为 `null` 或 `undefined` 时，它才会将第二个操作数赋值给第一个操作数。\n\n```\n//\
  \ logical OR assignment\nlet a1 = 5;\nlet a2 = null; \nlet a3 = false;\na1 ||= 7;\
  \ // --> 5\na2 ||= 7; // --> 7\na3 ||= 7; // --> 7\nconsole.log(`a1: ${a1}`); //\
  \ \"a1: 5\"\nconsole.log(`a2: ${a2}`); // \"a2: 7\"\nconsole.log(`a3: ${a3}`); //\
  \ \"a3: 7\"\n\n// logical AND assignment\nlet b1 = 5;\nlet b2 = null; \nlet b3 =\
  \ false;\nb1 &&= 7; // --> 7\nb2 &&= 7; // --> null\nb3 &&= 7; // --> false\nconsole.log(`b1:\
  \ ${b1}`); // \"b1: 7\"\nconsole.log(`b2: ${b2}`); // \"b2: null\"\nconsole.log(`b3:\
  \ ${b3}`); // \"b3: false\"\n\n// logical nullish assignment\nlet c1 = 5;\nlet c2\
  \ = null; \nlet c3 = false;\nc1 ??= 7; // --> 5\nc2 ??= 7; // --> 7\nc3 ??= 7; //\
  \ --> false\nconsole.log(`c1: ${c1}`); // \"c1: 5\" \nconsole.log(`c2: ${c2}`);\
  \ // \"c2: 7\" \nconsole.log(`c3: ${c3}`); // \"c3: false\" \n```\n\n**Listing 3.57**\
  \ 逻辑赋值运算符的比较\n\n#### 实例示例：对象属性的初始化\n\n新的逻辑赋值运算符对于初始化对象属性特别有用，如 Listing 3.58 所示。例如，语句\
  \ `james.lastName ||= 'Doe';` 在内部确保了如果对象 `james` 的 `lastName` 属性尚未被赋值，则将其初始化为值 `Doe`。作为对比，列表显示了在\
  \ ES2021 之前必须如何处理相同任务（`peter.lastName || (peter.lastName = 'Doe');`）。\n\n```javascript\n\
  const james = {\n  firstName: 'James',\n};\njames.firstName ||= 'John';\njames.lastName\
  \ ||= 'Doe';\nconsole.log(james);\n// { firstName: 'James', lastName: 'Doe' }\n\n\
  // 在 ES2021 之前，需要以下操作：\nconst peter = {\n  firstName: 'Peter'\n};\npeter.firstName\
  \ || (peter.firstName = 'John');\npeter.lastName || (peter.lastName = 'Doe');\n\
  console.log(peter);\n// { firstName: 'Peter', lastName: 'Doe' } \n```\n\n**Listing\
  \ 3.58** 用于初始化对象属性的逻辑赋值运算符\n\n### 3.3.9 特殊操作运算符\n\n除了所示的运算符外，JavaScript 中还有许多其他运算符，如\
  \ Table 3.16 所示。我们现在不会详细讨论这些运算符，而会在书中不同的位置进行讨论。\n\n| 操作 | 运算符 | 描述 |\n| --- | ---\
  \ | --- |\n| 条件运算符 | `<condition> ? <value1> : <value2>` | 三元运算符，根据条件（第一个操作数）返回两个值之一（由第二个和第三个操作数定义）。\
  \ |\n| 删除对象、对象属性或数组中的元素 | `delete` | 允许你从数组中删除元素以及从对象中删除属性。 |\n| 对象中是否存在某个属性 | `<property>\
  \ in <object>` | 检查对象是否具有某个属性。 |\n| 类型验证 | `<object> instanceof <type>` | 二元运算符，用于检查对象是否是特定类型。\
  \ |\n| 类型确定 | `typeof <Operand>` | 确定操作数的类型。操作数可以是对象、字符串、变量或如 `true` 或 `false` 之类的关键字。可选地可以在括号中指定操作数。\
  \ |\n\n**Table 3.16** JavaScript 中的特殊运算符\n\n## 3.4 控制程序的流程\n\n你现在已经知道如何在变量中存储不同的值并对它们进行计算。如果你还记得\
  \ 第 1 章 中的流程图和伪代码，你也会记得程序可以根据某些条件经过不同的路径。\n\n假设你想在用户已经登录的情况下在网页中显示一条特定消息，如果用户未登录则不显示此消息。或者你想根据数据列表动态地在网页上生成表格，但你并不知道列表中包含多少数据。\n\
  \n对于这些情况，编程语言提供了控制结构，允许你确定是否执行某个语句块以及执行该用例的次数。在编程中，前者通过条件语句处理，后者通过循环处理。让我们从第一种情况开始：条件语句。\n\
  \n### 3.4.1 定义条件语句\n\n通常情况下，你会希望在满足特定条件时执行程序中的某些语句。在编程中，这种条件语句可以使用 `if` 语句来实现。\n\
  \n`if` 语句的基本结构如 Listing 3.59 所示。if` 关键字启动 `if` 语句，括号包含条件，大括号包含在条件真时执行的语句。\n\n```javascript\n\
  if(condition) {\n  // 条件满足时执行的代码\n} \n```\n\n**Listing 3.59** 条件语句的基本结构\n\n例如，为了实现引言部分提到的根据用户是否登录显示消息的用例，你将像\
  \ Listing 3.60 那样使用 `if` 语句。`if` 语句的内容（括号内）只有在变量 `userIsLoggedIn` 值为 `true` 时才会执行。该示例的流程图如\
  \ Figure 3.7 所示。\n\n![Flowchart for a Conditional Statement](img/img-f3.7.html)\n\
  \n**Figure 3.7** 条件语句的流程图\n\n```javascript\nconst userIsLoggedIn = true;\nif(userIsLoggedIn)\
  \ {\n  const message = 'Welcome, ' + userName;\n  document.getElementById('message').textContent\
  \ = message;\n} \n```\n\n**Listing 3.60** 条件语句示例\n\n\n\n\n\n此时你不需要理解 `if` 语句中的具体内容，但可以对其进行快速解释：`document`\
  \ 变量是一个表示已加载网页的对象。该对象提供的 `getElementById()` 函数可以根据 ID 专门访问网页上的某个 HTML 元素。该函数随后返回一个表示该\
  \ HTML 元素的对应对象，并提供 `textContent` 属性，该属性随后可用于更改此元素的文本内容。这将在第 5 章中详细讨论。\n\n### 注意\n\
  \n`userIsLoggedIn` 变量并不一定包含布尔值。如果它包含其他值，`if` 语句将检查该值是否评估为 `true`。\n\n### 省略大括号\n\
  \n如果条件语句只包含一条语句，则也可以省略大括号（参见列表 3.61）。然而，我们强烈建议不要这样做，因为这种写法不如包含大括号的写法清晰，特别是在嵌套条件语句时。\n\
  \n```\nif(condition) \n  // 如果满足条件，则执行的程序代码\n```\n\n**列表 3.61** 使用大括号的 if 语句\n\n\
  ### 3.4.2 定义分支\n\n通过条件语句，你对布尔条件进行测试，并在满足条件时执行相应的语句（语句）。然而，你通常还希望在不满足布尔时不执行另一条语句。\n\
  \n这种情况不被称为条件语句，而是被称为分支（branching）。在这种情况下，代码采取两条路径之一：如果满足条件则走其中一条路径，如果不满足条件则走另一条路径。可以说，代码发生了分支。\n\
  \n要定义一个分支，请像使用条件语句一样使用 `if` 语句，但在此结构中添加另一个由 `else` 关键字引导的程序分支。其基本结构如列表 3.62 所示。\n\
  \n```\nif(condition) {\n  // 如果满足条件，则执行的程序代码\n} else {\n  // 如果不满足条件，则执行的程序代码\n\
  } \n```\n\n**列表 3.62** 分支的基本结构\n\n例如，上一节的源代码可以如列表 3.63 所示进行扩展。在那里，如果用户已登录，仍然会发出欢迎消息（即\
  \ `userIsLoggedIn` 变量值为 `true`）。对于另一种情况——即用户未登录（且 `userIsLoggedIn` 变量值为 `false`）——会调用\
  \ `displayLoginForm()` 函数（此处未详细显示）。\n\n```\nconst userIsLoggedIn = true;\nif(userIsLoggedIn)\
  \ {\n  const message = 'Welcome, ' + userName;\n  document.getElementById('message').textContent\
  \ = message;\n} else {\n  displayLoginForm();\n} \n```\n\n**列表 3.63** 分支的基本结构示例\n\
  \n该示例对应的流程图见图 3.8。唯一的区别是，与图 3.7 所示的流程图不同，现在在“否/否（No）”情况下也会执行一条语句。\n\n![if-else 分支的流程图](img/img-f3.8.html)\n\
  \n**图 3.8** if-else 分支的流程图\n\n### 测试多个条件\n\n在其他情况下，你可能不想在程序中只采取两条路径之一。有时，你可能希望测试多个条件，并根据满足了哪个条件来执行程序的某部分。也就是说，你还需要一种能够采取多个程序分支之一的方法。\n\
  \n假设你编写了一个应用程序，为特定年龄生成相应的电影建议。对于 8 岁的年龄，出现的电影建议应与 16 岁不同，对于 11 岁的年龄，应有与 35 岁不同的建议。换句话之，根据所选的年龄值，列出对应分分级的电影建议。\n\
  \n你也可以使用多个连续连续的单个条件语句来解决此类问题，但有一种更好的方法：if-else-if-else 分支。该结构的基本结构如列表 3.64 所示。\n\
  \n照常，从 `if` 语句和首先要检查的条件开始。然而，你可以通过 `else-if` 语句添加更多条件，如果满足了这些条件，将确保每个情况下都执行不同的程序分支。最后的\
  \ `else` 语句也可以用于定义在没有任何先决条件满足时执行的程序分支。\n\n```\nif(condition1) {\n  // 如果满足条件 1，则执行的程序分支\n\
  } else if(condition2) {\n  // 如果满足条件 2，则执行的程序分支\n} else {\n  // 如果都不满足，则执行的程序分支\n\
  }\n```\n\n**列表 3.64** if-else-if-else 分支的基本结构\n\n`else-if` 语句的数量是任意的。如列表 3.65 所示，你也可以通过在整个结构中插入额外的\
  \ `else-if` 块来测试多个条件或定义多个程序分支。\n\n```\nif(condition1) {\n  // 如果满足条件 1，则执行的程序分支\n\
  } else if(condition2) {\n  // 如果满足条件 2，则执行的程序分支\n} else if(condition3) {\n // 如果满足条件\
  \ 3，则执行的程序分支 \n} else if(condition4) {\n // 如果满足条件 4，则执行的程序分支 \n} else {\n  // 如果之前的条件都不满足，则执行的程序分支\n\
  } \n\n```\n\n**列表 3.65** else-if 语句的数量是任意的\n\n此外，结尾的 `else` 语句也可以省略（参见列表 3.66）。\n\
  \n```\nif(condition1) {\n  // 程序分支 1\n} else if(condition2) {\n  // 程序分支 2\n} \n\
  ```\n\n**列表 3.66** else 语句是可选的，也可以省略\n\n\n\n\n\n借助 `if-else-if-else` 语句，上述程序也可以相对容易地实现，如列表\
  \ 3.67 所示。`prompt()` 方法首先询问要显示电影分级的年龄。然后，第一个条件检查输入的年龄是否大于或等于 18 岁 (`age >= 18`）。如果是这种情况，则输出消息\
  \ `Show films with a rating of G, PG, PG-13, R, and NC-17.`。（当然，在实际应用中会有更多的操作）。另一方面，如果年龄小于\
  \ 18 岁，则继续测试：首先测试年龄是否大于或等于 17 岁 (`age >= 17`），然后是否大于或等于 13 岁 (`age >= 13`），最后测试是否大于或等于\
  \ 6 岁 (`age >= 6`）。例如，当输入数字 17 时，程序将输出 `Show films with a rating of G, PG, PG-13,\
  \ and R.`。\n\n```\nconst age = prompt('For what age are you looking for film tips?');\n\
  if(age >= 18) {\n  console.log('Show films with a rating of G, PG, PG-13, R, and\
  \ NC-17.');\n} else if(age >= 17) {\n  console.log('Show films with a rating of\
  \ G, PG, PG-13, and R.');\n} else if(age >= 13) {\n  console.log('Show films with\
  \ a rating of G, PG, and PG-13.');\n} else if(age >= 6) {\n  console.log('Show films\
  \ with a rating of G and PG.');\n} \n```\n\n**列表 3.67** if-else-if-else 分支示例\n\n\
  为了完整性和便于理解，图 3.9 再次展示了来自列表 3.67 代码对应的流程图。\n\n![if-else-if-else 分支的流程图](img/img-f3.9.html)\n\
  \n**图 3.9** if-else-if-else 分支的流程图\n\n该图很好地说明了程序流程，易于理解。此外，这个示例还揭示了条件的顺序非常重要。例如，如果你像列表\
  \ 3.68 那样更改顺序，程序的行为将不再按照原意运行。值 `17` 的输出现在是 `Show films with a rating of G and PG.`。为什么呢？毕竟，条件是以反向顺序检查的。但这恰恰是问题所在。例如，如果输入的年龄值为\
  \ `17`，第一个条件 (`age >= 6`) 已经满足，因此输出为 `Show films with a rating of G and PG.`。其他条件将不再被检查。\n\
  \n```\nconst age = prompt('For what age are you looking for film tips?');\nif(age\
  \ >= 6) {\n  console.log('Show films with a rating of G and PG.');\n} else if(age\
  \ >= 13) {\n  console.log('Show films with a rating of G, PG, and PG-13.');\n} else\
  \ if(age >= 17) {\n  console.log('Show films with a rating of G, PG, PG-13, and\
  \ R.');\n} else if(age >= 18) {\n  console.log('Show films with a rating of G, PG,\
  \ PG-13, R, and NC-17.');\n} \n```\n\n**列表 3.68** 条件的顺序对程序的执行至关重要\n\n关于这方面，原则上建议始终先测试更具体的条件，并将更具体的条件放在最后。例如，`age\
  \ >= 18` 比 `age >= 17` 更具体，后者比 `age >= 13` 更具体，而后者比 `age >= 6` 更具体。\n\n#### 嵌套分支\n\
  \n程序越复杂，你就越需要测试不同的条件并为不同的分支提供支持。假设你想扩展前面的示例（用户需要输入年龄），包含一个检查输入值是否为数字的判断。只有满足该条件时，程序中检查年龄具体数值的部分（嵌套的\
  \ `if-else-if-else` 语句）才会执行。如果该值不是数字，则输出相应的错误。该想法的实现在列表 3.70 所示。\n\n```\nconst age\
  \ = prompt('For what age are you looking for film tips?');\nif(!isNaN(parseFloat(age))\
  \ && isFinite(age)) {\n  if(age >= 18) {\n    console.log('Show films with a rating\
  \ of G, PG, PG-13, R, and NC-17.');\n  } else if(age >= 17) {\n    console.log('Show\
  \ films with a rating of G, PG, PG-13, and R.');\n  } else if(age >= 13) {\n   \
  \ console.log('Show films with a rating of G, PG, and PG-13.');\n  } else if(age\
  \ >= 6) {\n    console.log('Show films with a rating of G and PG.');\n  }\n} else\
  \ {\n  console.error('Invalid age entered.');\n} \n```\n\n**列表 3.70** 嵌套分支\n\n在此示例中，使用一个条件\
  \ (`!isNaN(parseFloat(age)) && isFinite(age)`) 来检查输入的值是否为数字。（诚然，这个条件稍微复杂一些，但对你目前的理解并不重要。）只有满足该条件时，程序中检查年龄具体数值的部分（嵌套的\
  \ `if-else-if-else` 语句）才会执行。如果不满足条件，则向控制台输出相应的错误。\n\n#### 使用更复杂的条件\n\n在日常编程中，你经常会使用这些运算符：与运算符、或运算符以及配合\
  \ `if` 语句的否定运算符来表示更复杂的条件。\n\n##### 注意\n\n在实践中，可以定义更复杂的条件。然而，正如编程中常见的情况，简单的代码也更易理解。\n\
  \n### 3.4.3 使用选择运算符\n\n\n\n\n在编程中，你通常需要根据条件为变量赋值一个值或另一个值。假设你想根据输入的年龄判断用户是否至少满 18\
  \ 岁，并将此检查的结果存储在变量 `isAtLeast18` 中。你可以使用 `if-else` 语句来实现这一点，如 列表 3.71 所示。如果年龄大于或等于\
  \ 18，则给变量赋值为 `true`；否则赋值为 `false`。\n\n```javascript\nconst age = prompt('Please\
  \ enter your age.');\nlet isAtLeast18;\nif(age >= 18) {\n  isAtLeast18 = true;\n\
  } else {\n  isAtLeast18 = false;\n}\nconsole.log(isAtLeast18); \n```\n\n**列表 3.71**\
  \ 使用分支进行变量赋值\n\n如果你在刚开始就给变量赋了一个初始值，也可以省略 `else` 部分，只使用条件语句（参见 列表 3.72）。\n\n```javascript\n\
  const age = prompt('Please enter your age.');\nlet isAtLeast18 = false;\nif(age\
  \ >= 18) {\n  isAtLeast18 = true;\n}\nconsole.log(isAtLeast18); \n```\n\n**列表 3.72**\
  \ 使用条件语句进行变量赋值\n\n这已经比 列表 3.71 中的代码要短了，但可以使用选择运算符进一步缩短。该运算符的结构如 列表 3.73 所示。\n\n\
  ```javascript\nconst variable = condition ? value1 : value2; \n```\n\n**列表 3.73**\
  \ 选择运算符的结构\n\n所以，目前来说，这是一个非常普通的赋值：在等号左侧，你编写变量名，在右侧包含带有选择运算符的表达式。这是一个三元运算符，因为它不是一个或两个，而是三个操作数。第一个操作数是要待检查的条件，后面跟着一个问号。第二个操作数是满足条件时赋值给变量的值。第三个操作数是不满足条件时赋值的值。这两个值之间用冒号隔开。\n\
  \n上一个示例可以使用选择运算符来实现，如 列表 3.74 所示。\n\n```javascript\nconst age = prompt('Please enter\
  \ your age.');\nconst isAtLeast18 = age >= 18 ? true : false;\nconsole.log(isAtLeast18);\
  \ \n```\n\n**列表 3.74** 使用选择运算符进行变量赋值\n\n你赋予变量的值可以是任何值，例如字符串，如 列表 3.75 所示。\n\n```javascript\n\
  const age = prompt('Please enter your age.');\nconst isAtLeast18 = age >= 18 ? true\
  \ : false;\nconst message = isAtLeast18 ? 'Over 18' : 'Under 18';\nconsole.log(message);\
  \ \n```\n\n**列表 3.75** 使用选择运算符赋值字符串\n\n### 注意\n\n条件语句和分支用于根据一个或多个条件在程序的几条路径中选择一条一条执行其中包含的语句。另一方面，选择运算符用于根据单个条件为变量赋值两个值之一。另请注意，你不应该嵌套选择运算符，也不应该使用代码块，这二者都会导致非常复杂且不可读的表达式。\n\
  \n### 3.4.4 定义多路分支\n\n你已经见过如何编写执行两个程序分支之一或多个程序分支之一的条件语句和分支。对于后者，`if-else-if-else`\
  \ 语句有一种替代方案，这在某些用例下甚至是更好的选择。我们所论的是多路分支，由于使用的关键字之一，它也被称为 switch 分支。基本上，这样的 `switch`\
  \ 语句与 `if-else-if-else` 分支可比，但它们的表示法比长序列的 `if-else-if-else` 分支清晰得多，特别是当要检查的变量可以取多个值时。`switch`\
  \ 语句的基本结构如 列表 3.76 所示。\n\n```javascript\nswitch(expression) {\n  case value1:\n\
  \    // Statements\n    break;\n  case value2:\n    // Statements\n    break;\n\
  \  case value3:\n    // Statements\n    break;\n  case value4:\n    // Statements\n\
  \    break;\n  default:\n    // Statements\n}\n```\n**列表 3.76** switch 的基本结构\n\n\
  `switch` 语句由关键字 `switch` 启动。其后是括号中的一个表达式，它的值将用于控制几个程序分支之一。单独的程序分支继而由关键字 `case` 定义。跟在此类\
  \ `case` 之后的值（在 列表 3.76 中的 `value1`、`value2`、`value3` 和 `value4`）与表达式进行比较。如果值匹配，则启动相应的程序分支；即执行位于\
  \ `case` 冒号后面的语句。\n\n在这样的程序分支中，你还可以使用关键字 `break` 跳出整个 `switch` 语句，从而终止相应的分支。通常，你会在每个\
  \ `case` 程序分支的结尾放置一个 `break`。但你也可以省略它。我们稍后会展示效果。\n\n为了捕获未被 `case` 语句捕获的情况，你使用关键字\
  \ `default`，它大致相当于 `if-else-if-else` 语句中结束的 `else`：如果之前定义的 `case` 语句都不适用，则执行 `default`\
  \ 程序分支中的语句。\n\n#### 示例\n\n让我们用一个具体的示例来解释 `switch` 语句的使用及其相对于 `if-else-if-else` 分支的优势。假设你编写了一个输出某些测试结果的网络应用程序。根据测试结果应该显示不同的图标。例如，失败的测试应该使用名为\
  \ `error.png` 的图标，通过的测试应该使用名为 `pass.png` 的图标，以此此类推（参见 表格 3.17）。测试结果在应用程序中使用 `0`\
  \ 到 `3` 进行编码。所有其他值（如 `4`、`5` 和 `-1`）都会产生名为 `unknown.png` 的图标。\n\n| 测试结果 | 含义 | 使用的图标\
  \ |\n| --- | --- | --- |\n| 0 | 测试通过 | pass.png |\n| 1 | 消息 | info.png |\n| 2 |\
  \ 警告 | warning.png |\n| 3 | 测试失败 | error.png |\n| 4 | 未知测试结果 | unknown.png |\n|\
  \ 5 | 未知测试结果 | unknown.png |\n| -1 | 未知测试结果 | unknown.png |\n\n\n\n\n# 表格 3.17 不同变量赋值的分配值\n\
  \n现在，你可以根据以下原理在 `if-else-if-else` 分支中测试测试结果：如果测试结果的值为 `0`，加载图像 `pass.png`；如果测试结果的值为\
  \ `1`，加载图像 `info.png`；以此此类推。\n\n相应的代码将如列表 3.77 所示。\n\n```\nconst testResultElement\
  \ = document.getElementById('testResult');\nconst testResult = 0;            //\
  \ 测试结果，通常会计算得出\nlet icon = null;                 // 用于图像名称的变量\nif(testResult ===\
  \ 0) {           // 检查测试结果。如果值为\n                                 // 0, ...\n  icon\
  \ = 'pass.png';             // ... 使用图像名称 \"pass.tif\"。\n} else if(testResult ===\
  \ 1) {    // 如果测试结果的值为 1, ...\n  icon = 'info.png';             // ... 使用图像名称 \"\
  info.tif\"。\n} else if(testResult === 2) {    // 如果测试结果的值为 2, ...\n  icon = 'warning.png';\
  \          // ... 使用图像名称 \"warning.tif\"。\n} else if(testResult === 3) {    // 如果测试结果的值为\
  \ 3, ...\n  icon = 'error.png';            // ... 使用图像名称 \"error.tif\"。\n} else\
  \ {                         // 对于所有其他值 ...\n  icon = 'unknown.png';          //\
  \ ... 使用图像名称 \"unknown.tif\"。\n}\ntestResultElement.src = 'img/' + icon;  // 设置相应的图像\n\
  ```\n\n## 列表 3.77 if-else-if-else 分支的使用\n\n相同功能但使用 `switch` 分支代替 `if-else-if-else`\
  \ 分支的程序如列表 3.78 所示。变量 `testResult`（包含测试结果）在这里被用作 `switch` 测试的输入；`case` 语句涵盖了该变量的四种可能值（`0`\
  \ 到 `3`）。此外，还有一个 `default` 语句，当变量不具有这些值中的任何一个时使用。\n\n```\nconst testResultElement\
  \ = document.getElementById('testResult');\nconst testResult = 0;        // 测试结果，通常会计算得出\n\
  let icon = null;             // 将图像名称的变量\nswitch(testResult) {         // 检查测试结果。\n\
  \  case 0:                    // 如果值为 0, ...\n    icon = 'pass.png';       // ...\
  \ 使用图像名称 \"pass.tif\"。\n    break;                   // 退出 switch 语句\n  case 1:\
  \                    // 如果测试结果的值为 1, ...\n    icon = 'info.png';       // ... 使用图像名称\
  \ \"info.tif\"。\n    break;                   // 退出 switch 语句\n  case 2:       \
  \             // 如果测试结果的值为 2, ...\n    icon = 'warning.png';    // ... 使用图像名称 \"\
  warning.tif\"。\n    break;                   // 退出 switch 语句\n  case 3:        \
  \            // 如果测试结果的值为 3, ...\n    icon = 'error.png';      // ... 使用图像名称 \"\
  error.tif\"。\n    break;                   // 退出 switch 语句\n  default:         \
  \          // 对于所有其他值 ...\n    icon = 'unknown.png';    // ... 使用图像名称 \"unknown.tif\"\
  。\n}\ntestResultElement.src = 'img/' + icon; \n```\n\n## 列表 3.78 使用 switch 应用\n\n\
  图 3.10 再次使用流程图说明了此示例。\n\n![switch 分支的流程图](img/img-f3.10.html)\n\n**图 3.10 switch\
  \ 分支的流程图**\n\n### 取消 switch 语句\n\n我们已经提到 `break` 通常写在 `case` 程序分支的末尾，但还没有解释原因。原因很简单：关键字\
  \ `break` 防止了后续 `case` 表达式的语句被执行。\n\n如果你省略了 `break`，如列表 3.79 所示，这将确保适用 `case` 之后定义的所有语句都会被执行。对于该示例，这意味着如果\
  \ `testResult` 的值为 `2`，变量 `icon` 将被赋值为 `warning.png`。然而，`case 3` 语句也会被执行，随后是 `default`\
  \ 语句，最终会导致 `icon` 接收到值 `unknown.png`。\n\n```\nconst testResultElement = document.getElementById('testResult');\n\
  const testResult = 0;        // 测试结果，通常会计算得出\nlet icon = null;             // 将图像名称的变量\n\
  switch(testResult) {         // 检查测试结果。\n  case 0:                    // 如果值为 0,\
  \ ...\n    icon = 'pass.png';       // ... 使用图像名称 \"pass.tif\"。\n    break;    \
  \               // 退出 switch 语句\n  case 1:                    // 如果测试结果的值为 1, ...\n\
  \    icon = 'info.png';       // ... 使用图像名称 \"info.tif\"。\n    break;          \
  \         // 退出 switch 语句\n  case 2:                    // 如果测试结果的值为 2, ...\n  \
  \  icon = 'warning.png';    // ... 使用图像名称 \"warning.tif\"。\n    break;         \
  \          // 退出 switch 语句\n  case 3:                    // 如果测试结果的值为 3, ...\n \
  \   icon = 'error.png';      // ... 使用图像名称 \"error.tif\"。\n    break;          \
  \         // 退出 switch 语句\n  default:                   // 对于所有其他值 ...\n    icon\
  \ = 'unknown.png';    // ... 使用图像名称 \"unknown.tif\"。\n}\ntestResultElement.src =\
  \ 'img/' + icon; \n```\n\n## 列表 3.79 使用 switch 应用\n\n在这个特定示例中，这不是想要的结果。然而，你可以利用这种行为并合并不同的\
  \ `case` 语句。如果你想为情况 `0`（测试通过）和 `1`（信息消息）使用相同的图像，并为情况 `2`（警告）和 `3`（测试失败）使用相同的图像，你可以如列表\
  \ 3.80 所示重写程序。\n\n\n\n\n\n```javascript\nconst testResultElement = document.getElementById('testResult');\n\
  const testResult = 0;        // Test result, would normally be calculated\nlet icon\
  \ = null;             // Variable that will contain the image name\nswitch(testResult)\
  \ {         // Check the test result.\n  case 0:                    // If this has\
  \ a value of 0 ...\n  case 1:                    // ... or a value of 1, ...\n \
  \   icon = 'pass.png';       // ... the image name \"pass.tif\" is used.\n    break;\
  \                   // Abort\n  case 2:                    // If the test result\
  \ has a value of 2, ...\n  case 3:                    // ... or a value of 3, ...\n\
  \    icon = 'error.png';      // ... the image name \"error.tif\" is used.\n   \
  \ break:                   // Abort\n  default:                   // For all other\
  \ values ...\n    icon = 'unknown.png';    // ... the image name \"unknown.tif\"\
  \ is used.\n}\ntestResultElement.src = 'img/' + icon; \n```\n\n**Listing 3.80**\
