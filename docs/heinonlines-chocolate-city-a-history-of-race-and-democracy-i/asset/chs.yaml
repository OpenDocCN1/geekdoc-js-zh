  \n## 致谢\n\n这本书源于一门被取消的课程。2009 年，乔治·德里克·马斯格罗夫在哥伦比亚特区大学教授的非裔美国人历史课程因注册人数不足，校方在开课第一天就终止了该课程。德里克被分配了一门新课：“哥伦比亚特区历史”。作为巴尔的摩本地人，他对华盛顿特区历史毫无背景，在接下来的学期里手忙脚乱，每次上课前都匆忙阅读他能找到的任何关于特区的书籍。\n\
  \n德里克喜欢自嘲，他把自己的特区历史窘境告诉了克里斯·迈尔斯·阿什——一位华盛顿本地人，当时已回到家乡并在 UDC 任职。我们很快成为好友，不仅因为我们是 UDC\
  \ 为数不多的三十多岁教师中的两位，还因为我们共同参与自由学校的经历。德里克在 1990 年代大部分时间效力于儿童保护基金会的自由学校项目，而克里斯则共同创办并运营了向日葵县自由项目——一个以\
  \ 1960 年代自由学校为蓝本的密西西比农村非营利项目。\n\n\n\n\n德里克鼓励克里斯加入他一起攻克华盛顿特区历史课程，我们共同重写了教学大纲。教授这门课程并与学生互动，加深了我们对这座城市的爱——它美丽、古怪、复杂，有时令人抓狂，却常常被外人嘲笑和误解。和许多土生土长的华盛顿人及长期居民一样，我们对这座城市怀有强烈的自豪感，尽管（或许正因为）它存在缺陷和裂痕，尤其是种族方面的裂痕。我们想讲述这座城市的故事，包括它的瑕疵，并且认为我们两人——一位白人、一位黑人，都是研究美国种族问题的历史学家——能够写出一部引人入胜、见解深刻的历史，帮助所有美国人理解他们的国家首都。\n\
  \n六年来，我们共同为这个项目努力。生活不断干扰写作过程。我们的家庭扩大了，我们换了工作，我们购买并翻新了破旧的老房子。有时压力太大。有一段时间，德里克几乎完全停止了写作，让克里斯独自完成了书的前半部分。但自始至终，这个项目都因深厚的友谊、我们对华盛顿特区的热爱，以及一个广阔的民主愿景而凝聚在一起——这个愿景承诺穷人和富人、女性和男性、黑人和白人同样享有自决权。\n\
  \n你现在读到的这本书，深深得益于我们一生中遇到的许多优秀老师。对克里斯来说，他在华盛顿特区公立学校时的两位老师尤为突出。他在爱丽丝·迪尔初中的八年级英语老师丽塔·迈尔斯，比他在大学或研究生院的任何老师都更推动他思考受众、节奏和句子结构。迈尔斯女士花了四十多年时间，把注意力不集中的初中生培养成敏锐的写作者。他在威尔逊高中十一年级的\
  \ AP 美国历史老师埃里希·马特尔，温和地促使他批判性地思考资料来源，并挑战他质疑自己的假设。虽然马特尔先生在课堂上说话轻声细语，但他有钢铁般的脊梁，在无数次与学校官员的斗争中捍卫了他的学生和原则。德里克必须感谢记者兼华盛顿特区“Go-Go”音乐场景研究者娜塔莉·霍普金森，她挑战他为普通读者写作，并提供了尖锐而深刻的评论。\n\
  \n如此规模的一本书也承载了巨大的学术债务。我们借鉴了许多专注学者的研究成果——包括康斯坦斯·麦克劳克林·格林、莱蒂蒂亚·伍兹·布朗、霍华德·吉列、凯特·马苏尔等人——他们贡献了深入研究的书籍、文章和论文，帮助我们理解了华盛顿特区种族与民主的丰富性和复杂性。请阅读《资料来源评述》以了解更多关于本书的学术基础以及过去一个世纪对华盛顿特区历史解读的变迁。\n\
  \n华盛顿特区历史领域不仅拥有学者，还拥有广泛的学生、博主和本地历史爱好者，他们多年来撰写文章、采访社区成员、翻阅旧报纸、捍卫当地地标，并讲述那些保存我们城市历史的故事。这些本地历史学家常常默默无闻，他们产出了那种细致入微、深入的研究，为像本书这样宏大的叙事增添了质感和细微差别。\n\
  \n有两位杰出的本地历史学家特别值得一提：简·弗罗因德尔·莱维和凯瑟琳·施奈德·史密斯。莱维是创建一套经过深入研究的精彩徒步导览的推动力，这些导览追溯了华盛顿特区各社区的历史。几乎从本书构思之初，她就一直是坚定（但友善）的批评者。史密斯协助组织了历史学家团队，编写了第一本华盛顿特区历史教科书《宏伟意图之城》（1983\
  \ 年）。史密斯在莱维的帮助下，于 1989 年创办了《华盛顿历史》杂志，两人在该领域一直是多产的作家和编辑。她们将华盛顿特区历史带给了成千上万的学生、游客、政策制定者和其他人。\n\
  \n我们感谢华盛顿特区公共图书馆华盛顿文献部的持续工作，它是本地历史的宝库；霍华德大学穆尔兰-斯平加恩研究中心，它提供了对理解这座城市至关重要的口述历史、个人收藏和组织文件；华盛顿特区历史学会，其《华盛顿历史》仍然是关于这座城市原创研究的最佳来源；以及乔治·华盛顿大学格尔曼图书馆的特藏部，它保存了广泛的本地原始资料。没有这些资源，进行严肃的本地研究根本不可能。\n\
  \n我们还利用了关于这座城市的大量报纸和其他当代文章。在学术（和政治）圈子里，哀叹“媒体”所谓的肤浅和简单可能是一种时尚。但如果没有记者报道正在发生的事情，我们会在哪里？记者没有奢侈的时间；他们没有漫长的休假来思考自己的工作；他们不能在研讨会和会议上讨论想法。他们只是写作，常常比我们历史学家写得好得多，在时间和版面空间的巨大压力下，他们捕捉到了那些否则会从历史记录中消失的瞬间。《国家情报报》、《晚星报》、《华盛顿蜜蜂报》、《华盛顿邮报》以及其他本地报纸为这座城市拍摄了详细的快照，提供了当代的采访、观点和想法，帮助我们理解人们如何看待他们正在经历的事件。我们向他们脱帽致敬。\n\
  \n毫不意外，我们后几章最富有启发性的资料来源就是参与者本人。我们感谢阿尔·希尔，他在 20 世纪 80 年代初理顺了城市财政；约翰尼·巴恩斯，他捍卫了西顿街租户，并担任了代表沃尔特·方特罗伊的幕僚长；吉米·加勒特，学生非暴力协调委员会成员，黑人教育中心的联合创始人；小托尼·刘易斯，他在西北汉诺威广场长大；弗兰克·沃特金斯和雷·安德森，他们在\
  \ 20 世纪 90 年代初为杰西·杰克逊工作；以及乔伊斯·拉德纳，学生非暴力协调委员会的老将，金融控制委员会的成员。他们都与德里克就所讨论的事件进行了长时间的对话。\n\
  \n许多华盛顿特区历史专家自愿抽出时间加强本书。我们华盛顿特区写作小组的成员，包括贝尔·克莱门特、阿曼达·赫伦、凯蒂·威尔斯和布雷特·威廉姆斯，对各个章节提供了重要的反馈和见解。肯·鲍林、约瑟夫·热内坦-皮拉瓦、蒂基亚·汉密尔顿、凯特·马苏尔、萨米尔·梅盖利、阿尔·莫斯、乔·雷迪、莎拉·舍恩菲尔德、威廉·G·托马斯和埃里克·耶林贡献了他们关于特定时代和人物的卓越知识，帮助我们避免了许多错误。\n\
  \n一些最有价值的反馈来自对华盛顿特区历史没有专业知识的读者。克里斯在科尔比学院教授的“华盛顿特区的种族与民主”课程的学生，为进行中的手稿撰写了逐章的“编辑笔记”——他们提供了读者的视角，迫使我们澄清并加强我们的散文。我们特别感谢佐伊·吉布森、玛吉·霍伊洛、娜塔莉·基尔希、伊恩·曼斯菲尔德和阿基布·雅库布，他们提出了深思熟虑、全面且有时毫不留情的评论。特区教师科斯比·亨特和布莱恩·罗哈尔与他们的学生分享了我们的作品，并帮助我们使这本书对更广泛的读者更易理解。学者和朋友们，包括特里·布顿、凯特·布朗、贾斯汀·狄龙、史蒂夫·埃斯蒂斯、诺拉莉·弗兰克尔、雷切尔·莱因哈德、加布·罗斯、米歇尔·斯科特和杰森·摩根·沃德，也对我们的作品提供了重要的视角。\n\
  \n\n\n德里克一直得到马里兰大学巴尔的摩县历史系丰富学者社区的支持，尤其是玛乔琳·卡斯，她在本科时指导过他，后来成为他的同事。有趣的是，玛乔琳在杜克大学读研究生时师从彼得·伍德——而彼得自克里斯在杜克大学读本科起就一直是他导师。作为一位杰出的历史学家和模范导师，彼得一直是这本书的坚定支持者和深思熟虑的批评者。克里斯的两位朋友，格雷格·科斯塔和肖恩·雷蒙德，自他们在“为美国而教”时期起，就一直是鼓励、洞察和辩论的重要来源，那时他们住在密西西比州伊塔贝纳（马里恩·巴里的出生地！）一栋没有暖气的房子里。肖恩阅读了每一章的初稿（通常很粗糙）；格雷格则等到“香肠”几乎可以下锅时才发表意见。\n\
  \n我们的家人一直是我们的基石和避风港。我们的妻子忍受了多年偷偷摸摸地工作，并帮助我们腾出时间进行研究和远离孩子的“写作静修”。克里斯将这本书献给娜娜（又名他的母亲玛杰里·迈尔斯），她在西北华盛顿的里诺路长大，至今仍住在他长大的西北西大道的那栋房子里。她深爱并了解这座城市，教会我们看到那些常常被忽视或忽略的人和地方的美好。我们希望这本书能帮助她以新的眼光看待她的家乡。德里克将这本书献给他的两个儿子，乔治·沃克·马斯格罗夫和约翰·弗里曼·马斯格罗夫，他们出生在华盛顿，没有其他家乡，必须在帮助创造这座城市未来的同时，接受它的历史。\n\
  \n**巧克力之城**\n\n![Image](img/f0001-01.jpg)\n\n## 引言\n\n## 永远是巧克力之城\n\n毫无疑问，世界上没有任何地方像美国首都那样，仅凭肤色就施加的压迫和迫害显得如此可憎和丑恶，因为美国政府建立时所依据的原则——它至今仍声称信奉这些原则——与每天在国旗保护下所实践的原则之间的鸿沟，是如此宽广而深邃。\n\
  \n——玛丽·丘奇·特雷尔，1906 年\n\n1963 年 8 月 28 日，华盛顿特区似乎处于最佳状态。尽管有关于种族暴力和混乱的可怕警告，这座城市还是迎来了超过\
  \ 25 万和平抗议者，参加“向华盛顿进军，争取就业与自由”活动。人群聚集在林肯纪念堂附近，聆听跨种族的鼓舞人心的演讲者阵容，最后来自阿拉巴马州的充满活力的年轻牧师马丁·路德·金发表了演讲。民权运动来到“这个神圣的地方”，金坚持说，“是为了实现民主的承诺。”¹\n\
  \n全世界的观众看到了金的演讲新闻片，以及微笑、流汗、举着标语的人群的图像，他们代表了美国广泛的横截面——黑人和白人，年轻人和老年人，北方人和南方人，犹太人和非犹太人。这次游行是美国充满活力的民主在行动中的生动证据。美丽、有序、热情好客的国家首都，似乎是金所称的“我国历史上最伟大的自由示威”的理想舞台。²\n\
  \n当天结束时，大多数抗议者挤上巴士回家，但大约 10%的游行参与者*已经*在家了。他们是华盛顿特区的居民，这座城市的本地人，这座城市既是美国的闪亮象征，也是对民主的明显拒绝。与其他美国公民不同，华盛顿特区居民在国会中没有代表，缺乏基本的自治权。他们的城市由三位总统任命的专员管理，而不是由地方选举的官员管理。所有种族的华盛顿人都没有投票权，任何地方的民选代表都无需尊重。\n\
  \n金呼吁“实现民主的承诺”在华盛顿特区引起了特别强烈的共鸣，因为它是全国第一个黑人占多数的主要城市。向华盛顿进军的人群可能体现了跨种族团结的理想，但华盛顿特区本身正处于种族动荡和变化之中。就在三年前，人口普查局统计证实了正在重塑这座城市的巨大人口转变。1950\
  \ 年，华盛顿特区有超过 80 万居民，其中近三分之二是白人；到 1960 年，该市失去了三分之一的白人人口，黑人约占 54%。³\n\n十年前还受到限制性契约、联邦法律和社会习俗保护的白人社区和学校，现在几乎全是黑人。随着紧张的白人家庭离开华盛顿，城市规划者推行“城市更新”计划，用通往全白人郊区的高速公路覆盖了华盛顿特区西南部黑人占多数的社区，引发了种族怨恨和社区抗议运动。新一代黑人活动家及其盟友挑战联邦和地方当局，要求为黑人多数提供足够的住房、平等的教育机会和基本的政治权利。对这些活动家来说，向华盛顿进军只凸显了华盛顿所代表的理想与华盛顿特区居民所面临的现实之间的巨大鸿沟。\n\
  \n正如黑人教育家玛丽·丘奇·特雷尔在 20 世纪初所指出的那样，没有哪个城市比国家首都更能体现美国广泛的民主希望与其持久的种族现实之间持续存在的紧张关系。从奴隶制到民权再到城市暴力，这些挑战我们国家的有争议的种族问题，在华盛顿特区以特别具有象征意义和实质性的力量上演。\n\
  \n然而，华盛顿不仅仅是我们国家更大范围的种族平等斗争的象征。它是一个在全国独一无二的城市，其种族历史是一个特别引人入胜的故事。哥伦比亚特区由宪法法令创建，由国会控制，是一个民主制度下没有投票权的首都，一个对全国政治变化高度敏感的政府所在地，一个位于南方但在政治和文化上被南北撕裂的城市。与其他东部主要城市不同，它从一开始就被规划，并在国家领导人的密切关注下发展。几乎在南方城市中独一无二的是，华盛顿特区是强大而公开的废奴运动的所在地，其受过教育的自由黑人社区使这座城市即使在奴隶制时期也成为黑人机会的灯塔。与其他城市地区相比，除了政府之外，它没有发展出任何有意义的工业，也没有吸引大量白人移民。既\
  \ cosmopolitan 又狭隘，既具有象征意义又独一无二，华盛顿特区一直是美国的象征，却又与国家分离。\n\n《巧克力之城》追溯了这座非凡城市中种族与民主的政治、经济和社会历史，从其作为奴隶制首都的起源，到\
  \ 2010 年带有种族色彩的市长选举。在那段时间里，这座城市经历了巨大的转变——从一个人烟稀少的种植园社会变成一个繁荣的大都市，从奴隶贸易中心变成全国第一个黑人占多数的城市，从一个自治城镇变成联邦领地，然后又变回来。它忍受了腐败的领导层和国会的干预，经历了内战和可卡因流行，并在城市更新和多次绅士化浪潮中幸存下来。\n\
  \n\n\n\n种族是华盛顿历史的核心，因此《巧克力城》并非仅仅是华盛顿特区非裔美国人社区的历史。相反，我们探讨种族与民主问题如何塑造了首都居民（无论何种种族）的生活。因此，我们的研究从该地区最早的种族冲突——欧洲定居者与美洲原住民之间的冲突——开始，并以\
  \ 21 世纪的人口革命作为结尾，这场革命正在戏剧性地重塑城市的种族轮廓。\n\n事实证明，种族因素（超越阶级、地区、政治和宗教等其他因素）是解释该市社会、经济和政治分裂的最重要原因。种族可能是一种社会和历史建构，在生物学上几乎没有依据，但它也是一种强大的现实体验，影响了华盛顿特区各族裔居民如何（以及在何处）生活、工作、投票和互动。自建城以来，种族、种族紧张关系以及城市人口种族构成的变化，一直是首都居民生活中的推动力量。\n\
  \n特区不民主的政治地位对该市的种族关系产生了削弱作用。华盛顿拥有许多象征自由的大理石纪念碑，但它仍然遭受着美国独立战争期间激怒爱国者的政治暴政：无代表不纳税。该市缺乏政治权力和基本自决权，深刻影响了其历史，限制了其政治和经济增长，使其受制于联邦立法者，并迫使该市居民陷入一种令人沮丧的角色——依赖者和申诉者，而非完全公民。这种民主渠道的缺失加剧了该市的种族分裂，因为种族一直是华盛顿特区持续被剥夺选举权的主要因素。\n\
  \n《巧克力城》探讨了作为国家首都如何对当地的种族斗争产生了既催化又有时令人沮丧的影响。作为美国的首都和国家领导人及外国观察者的家园，华盛顿特区常常成为全国范围内关于种族与民主意义斗争的战场，也是一个实验室，在这里，国家理念和议程得以代表（并以牺牲）当地人民利益的方式推行。1953\
  \ 年，一位黑人教育家告诉德怀特·艾森豪威尔总统，华盛顿是“国家的客厅”，是一个与其他城市标准不同的国家象征。在国家显微镜下，其种族斗争被放大和扭曲。⁴\n\n\
  本书有助于解释为什么种族不信任在首都乃至整个国家如此根深蒂固。种族分裂与阶级界限并行并加剧了后者，其根源可追溯至 18 世纪末该市的建立；在内战后的几代人中加深；在\
  \ 20 世纪中后期的动荡年代爆发；并在 21 世纪继续定义着该市的生活。华盛顿一直受到种族统治恐惧、致命种族骚乱和根深蒂固的种族怨恨的困扰。尽管 2008 年美国首位黑人总统的当选激励了一些居民想象一个后种族社会，但该市种族不信任的历史仍然牵连着，有时甚至笼罩着新来者和本地人。\n\
  \n然而，华盛顿特区的种族与民主历史并非仅仅是恐惧、骚乱和对抗的罗列。它也是一段充满希望、联盟和跨种族合作的鼓舞人心的历史。即使在居民与种族冲突作斗争的同时，华盛顿也吸引了致力于改革的志士，他们跨越种族界限，努力建设一个更加平等的城市。那些看似坚不可摧的种族障碍，在历史的不同时期却异常流动。废除奴隶制的非凡跨种族运动、跨种族对种族隔离的攻击，以及全市范围内阻止高速公路摧毁社区的努力，都是华盛顿人如何战胜恐惧和不信任以创造积极变革的例子。\n\
  \n我们撰写这本书是为了加深公众对种族与民主在我们城市和国家中互动方式的理解。很多时候，我们关于种族的公开讨论缺乏历史意识，或对我们许多种族分裂根源的认识不足。当代的种族斗争——在住房、教育、执法、政治等领域——并非仅仅是\
  \ 21 世纪突然出现的现象。它们是四个多世纪以来种族冲突和不信任的产物，这些冲突和不信任帮助创造了我们生活和互动的背景。\n\n我们在这些篇章中讲述的故事表明，种族进步既不是线性的，也不是不可避免的。它需要严肃、艰难、常常令人不适的工作，而进步可能（并且经常）被逆转。我们知道这个故事可能会激怒、挫败和激怒我们的读者——这是应该的。但我们也希望，它能激励他们投身于建设一个更公正、更平等、更民主的城市，这个城市体现了我们国家所能成为的最好样子。\n\
  \n## 第一章\n\n## 你的到来不是为了贸易，而是为了入侵我的人民并占有我的国家\n\n### *一个被围困的美洲原住民世界，1608–1790 年*\n\
  \n我们将逐步改变他们野蛮的本性，让他们为自己……的原始裸体感到羞耻，告知他们真正的上帝以及通往救赎的道路，并最终教导他们服从国王陛下及其总督。\n\n——威廉·斯特雷奇，1612\
  \ 年\n\n阿纳科斯蒂亚河有效地将华盛顿分割成两个分离且不平等的部分。在其北部和西部，山丘向上倾斜，通往联邦城市的纪念碑和西北华盛顿的富裕社区。在其南部和东部，则是“远东南”和“远东北”易发洪水的平地与山丘。这些“河东”社区在物理和心理上与华盛顿其他地区隔绝，历史上一直遭受政治忽视、经济剥夺和社会孤立。\n\
  \n河流本身反映了该地区的停滞。直到 19 世纪初，阿纳科斯蒂亚河与波托马克河不相上下——它是一条繁忙的贸易通道，水深足以让远洋船只航行至马里兰州布拉登斯堡，该地位于特区东北边界之外。但随着上游因烟草耗尽而侵蚀的土壤冲入河流，淤塞的阿纳科斯蒂亚河变得太浅，无法用于商业用途。该地区的经济萎缩。尽管当地环保组织做出了令人印象深刻的努力，但在\
  \ 21 世纪，阿纳科斯蒂亚河仍然是一条垃圾遍布的屏障，隔开了繁华的首都与其最贫穷、最黑人的社区。¹\n\n“阿纳科斯蒂亚”这个词在现代华盛顿几乎等同于“黑人”和“贫穷”，它源于我们现在称为国家首都的地区最早的种族斗争。这个词是“纳科斯廷”（Nacostine）的拉丁语发音和拼写，纳科斯廷是居住在波托马克河与阿纳科斯蒂亚河交汇处的美洲原住民部落。17\
  \ 世纪初，纳科斯廷人约有三百人，居住在纳科奇坦克（Nacotchtank），这是一个广阔的村庄，占据了如今联合基地阿纳科斯蒂亚-博林所在的河流平原。²\n\n\
  纳科奇坦克位于瀑布线正下方，这是皮埃蒙特高原向沿海平原陡降的崎岖断裂带，它坐落在分隔潮汐地区说阿尔冈昆语系民族与内陆易洛魁语系部落的边界上。这两个群体进行着利润丰厚的贸易，每年数百人聚集在一起，兜售海狸皮、铜、贝壳珠和其他商品。利用其地理位置的自然优势，纳科斯廷人充当了中间人，获利颇丰。\n\
  \n\n\n\n\n边疆带来了繁荣，但也带来了危险——来自萨斯奎汉诺克（Susquehanock）和马萨沃马克（Massawomack）等北方部落的战士频繁对上潮汐区发动破坏性袭击。靠近瀑布线的村庄，包括纳科特坦克（Nacotchtank），尤其容易受到攻击。它们向最高酋长领地寻求保护，这种实体中，酋长中的酋长要求臣属部落进贡，以换取军事保护。³\n\
  \n纳科斯廷人（Nacostines）与皮斯卡塔韦人（Piscataways）结盟。皮斯卡塔韦人以波托马克河和切萨皮克湾形成的巨大半岛为基地（即今天的马里兰州乔治王子县），统治着大约七千人。纳科特坦克位于其西部边界，纳科斯廷人向皮斯卡塔韦酋长进贡，该酋长的首府设在梅奥内（Mayone），顺流而下仅十五英里，即皮斯卡塔韦溪汇入波托马克河之处。\n\
  \n在纳科特坦克的南部和东部，是皮斯卡塔韦人的对手——强大的波瓦坦联盟（Powhatan Confederacy），以其令人生畏的领袖命名。波瓦坦以韦罗沃科莫科（Werowocomoco）为基地，该地位于约克河畔，即今天的弗吉尼亚州格洛斯特县，其势力范围从波托马克河南岸一直延伸到现代北卡罗来纳州的纽斯河。他统治着三十个臣属部落，共一万五千人，并向他们征收贡品。⁴\n\
  \n当英国殖民者于 1607 年春天在詹姆斯河上建立前哨站时，他们定居在这片庞大、分裂且政治成熟的印第安人群体之中。起初，他们在印第安人的世界中只是闯入者，受制于当地统治者的反复无常。然而，仅仅一百年后，这个以印第安人为主导的世界便消失了，该地区仅存的少数印第安人成了英国国王的监护对象。取而代之的是马里兰和弗吉尼亚殖民地的英国定居者、仆役和奴隶。要理解这一转变是如何发生的，我们必须探索在这片将成为美国首都的地区，围绕种族和民主的早期斗争。⁵\n\
  \n### *“我们将逐步改变他们野蛮的本性”：印第安人遭遇欧洲探险者*\n\n纳科特坦克在 1608 年夏天迎来了第一位欧洲访客——约翰·史密斯船长。史密斯出生于林肯郡威洛比的一个农民家庭，凭借坚强的意志和纯粹的运气，他把自己变成了绅士和冒险家。十六岁时，他逃离学徒生涯，在法国当过雇佣兵，在地中海当过私掠船船长，在土耳其当过奴隶。回到英格兰后，他获得了船长头衔，并跻身上流社会。然而，他仍不安于冒险，于是离开伦敦，加入弗吉尼亚公司，致力于在切萨皮克建立永久殖民地。⁶\n\
  \n当史密斯抵达纳科特坦克时，他和其他的英国殖民者已经在切萨皮克待了一年多。1607 年 5 月，他们在南方近两百英里处定居，位于波瓦坦联盟的中心地带。在一个低洼、沼泽的岛屿上，他们将其命名为詹姆斯敦，殖民者竖起栅栏堡垒，开始执行在美洲建立英格兰的任务。这项工程进展不顺。到\
  \ 9 月，领导不力、疾病、饥饿以及与周围印第安人的敌对行动使他们的数量减少了近一半。⁷\n\n波瓦坦远远地看着这些新来者挣扎求生。他本可以让殖民者饿死，或者派出一支袭击队将他们消灭，但他从这些闯入者身上看到了扩大自己经济和政治权力的机会。切萨皮克的阿尔冈昆人相信，铜和半透明的珠子是通往精神世界的通道，而酋长的权力部分来源于对这些珍贵物品的控制。詹姆斯敦的殖民者从英格兰带来了大量的铜、珠子以及铁制工具，用于交换食物。一位英国人形容波瓦坦“胆识过人、警惕性高、野心勃勃、善于扩张领土”，他决定通过将殖民者纳入自己的最高酋长领地，来获得对这些货物的独家获取权。⁸\n\
  \n1607 年 12 月，波瓦坦命令史密斯和殖民者离开詹姆斯敦，定居在卡帕霍瓦西克（Capahowasick），就在他首府的下游。史密斯写道，如果他们这样做，并向他提供“斧头和铜”，波瓦坦“承诺给我玉米、鹿肉，或者任何我们需要的食物……并且没有人会打扰我们。”⁹\
  \ 尽管饥饿且受到印第安邻居的骚扰，殖民者一定认为波瓦坦的提议荒谬且屈辱。他们跨越大西洋，完全意图（事实上也接到了弗吉尼亚公司的指示）征服土著并使他们皈依基督教。威廉·斯特雷奇在描述殖民者的意图时写道：“我们将逐步改变他们野蛮的本性，让他们为自己……野蛮的裸体感到羞耻，告知他们真正的上帝，并……教导他们服从国王陛下的权威。”但\
  \ 1608 年那个绝望的冬天不是摆这种高高在上姿态的时候。史密斯同意了条件，波瓦坦送来了食物，履行了自己的承诺。¹⁰\n\n![Image](img/f0001-02.jpg)\n\
  \n*“弗吉尼亚 / 由约翰·史密斯船长于 1606 年发现并描述；威廉·霍尔雕刻。”这张地图于 1612 年出版，展示了切萨皮克地区及印第安地名。波瓦坦酋长被描绘在左上角的长屋内。国会图书馆。*\n\
  \n然而，殖民者背弃了协议。他们不仅留在詹姆斯敦，史密斯还开始探查波瓦坦领地的薄弱边缘，以评估当地人口的军事实力，并为国王詹姆斯一世绘制新领地地图。1608 年\
  \ 6 月和 7 月，他进行了两次切萨皮克及其支流航行中的第一次，乘坐一艘敞篷驳船，带着十四名船员。这些人勘测了东岸的几个河流系统，然后重新穿越海湾，探索帕塔普斯科河和波托马克河。¹¹\n\
  \n不出所料，波瓦坦感到被冒犯，并指示他的臣属酋长们骚扰这支探险队。在下波托马克河沿岸，“所有的树林里都布满了伏兵，数量达三四千名野蛮人，他们涂着奇怪的颜料，面目狰狞，伪装得令人毛骨悚然，大喊大叫、咆哮哭嚎，就连地狱里的鬼魂也不会比他们更可怕，”史密斯在日记中写道。¹²\n\
  \n骚扰只有在史密斯离开波瓦坦的领地、进入上波托马克河时才停止，他成为第一个探索现在华盛顿特区所在地的欧洲人。当他七月中旬到达“莫亚奥内斯、纳科特坦克和托格斯”时，他写道：“当地人民竭尽全力招待我们。”这三个村庄是皮斯卡塔韦联盟的一部分，很可能热情地欢迎探险者，因为他们希望与英国人结盟，共同对抗近年来不断向波托马克河上游扩张的波瓦坦。¹³\n\
  \n\n\n\n\n如果波瓦坦最初将殖民者视为麻烦但仍有价值的盟友，那么现在他将他们视为威胁。史密斯返回詹姆斯敦后，波瓦坦召见他进行了一次紧张的会面，会上这位酋长指责殖民者对他的领土怀有野心：“你们来此并非为了贸易，而是为了入侵我的人民并占领我的土地。”短短几个月内，英国人与联盟之间的关系恶化成了战争。殖民者及其后代称之为第一次波瓦坦战争，这场战争持续了五年，暂时中止了殖民者对切萨皮克湾的探索。由于英国人蜷缩在詹姆斯敦内，纳科斯廷人在接触后的十年里很少见到欧洲人，他们的生活方式也几乎没有受到干扰。¹⁴\n\
  \n### *“他们知道我们的贸易可能会损害他们的利益”：英国商人瓦解原住民网络*\n\n尽管约翰·史密斯是第一个看到纳科奇坦克的英国人，但没有人比商人亨利·弗利特更了解这个村庄及其居民。弗利特出生于英格兰查塔姆的富裕家庭，1621\
  \ 年秋作为陪同他远房表亲、新任弗吉尼亚总督弗朗西斯·怀亚特爵士的代表团成员来到切萨皮克。他在詹姆斯敦下船时年仅二十岁，希望在新大陆发家致富。\n\n起初，这似乎是一项轻松的任务。怀亚特和他的代表团前往弗吉尼亚接管一个日益壮大的殖民地，该殖民地似乎与其美洲原住民邻居和平相处。1614\
  \ 年，殖民者赢得了第一次波瓦坦战争，作为谈判和平的一部分，波瓦坦同意向英国人提供食物，并承认他们对沿詹姆斯河夺取的优质农田的所有权。殖民者利用约翰·罗尔夫在烟草种植方面的实验，于\
  \ 1615 年在这片土地上种植了 2000 磅烟草。这种植物在英格兰卖出了高价，并在宫廷中变得时尚。找到了殖民地的经济作物后，弗吉尼亚公司进口了数百名契约佣工，扩大种植规模，并于\
  \ 1620 年出口了四万磅烟草。到怀亚特抵达时，殖民者已如此专注于烟草生产，以至于忽视了探索切萨皮克和使原住民皈依基督教的职责。他的主要任务是重新集中他们的精力。¹⁵\n\
  \n怀亚特从未有机会实施他的改革。1622 年 3 月 22 日上午，就在怀亚特抵达五个月后，波瓦坦战士若无其事地走进散布在詹姆斯河沿岸的八十多个种植园，要求借用锄头、铲子和其他工具，然后开始殴打并砍死他们的主人。短短几小时内，他们杀死了\
  \ 347 名男女老少，占英国人口的四分之一。波瓦坦的弟弟奥佩坎卡诺是这次袭击的幕后策划者，他的目的是迫使英国人撤退到詹姆斯敦并向联盟进贡。¹⁶\n\n这次袭击引发了伦敦方面的复仇呼声。弗吉尼亚公司官员断定原住民无可救药地野蛮，放弃了同化和转化当地居民的梦想，转而呼吁殖民者“摧毁那些试图摧毁我们的人”。¹⁷\
  \ 怀亚特及其副手于 1622 年发动了第二次波瓦坦战争，并花了十年时间对敌对酋长领地发动收获季袭击。他们偷窃玉米、焚烧村庄，让敌人在冬季前夕挨饿受冻——这是英国人在针对“野蛮”爱尔兰人的九年战争中开创的做法。总督和其他种植园主始终意识到自己的经济利益，他们用偷来的玉米喂养契约佣工，而这些佣工则转而将劳动力用于种植烟草。¹⁸\n\
  \n与第一次波瓦坦战争不同，纳科奇坦克未能幸免于暴力。为了寻找盟友，英国人找到了帕塔沃梅克人，这是一个独立的酋长领地，控制着现今弗吉尼亚州匡蒂科附近地区。帕塔沃梅克人从敌对行动中寻求自身利益，他们同意结盟，条件是英国人加入他们对北方“死敌”皮斯卡塔韦人的袭击。英国人同意了，他们一起袭击了纳科奇坦克，杀死了十八名男子，掠夺了食物储备，并烧毁了房屋。当天的袭击者中就有亨利·弗利特。¹⁹\n\
  \n纳科斯廷人在 1623 年 3 月进行了反击，当时弗利特返回纳科奇坦克以物易物换取玉米。纳科斯廷战士击溃了英国商人，杀死了二十人，并将弗利特扣为人质。怀亚特总督派出一支军事远征队对付纳科斯廷人——他吹嘘说他们“烧毁了他们的房屋和大量玉米”——但弗利特一直被囚禁，直到四年后殖民者支付赎金才将他释放。²⁰\n\
  \n讽刺的是，弗利特在纳科奇坦克的囚禁生活反而让他掌握了将英国人确立为波托马克河上主导贸易商所需的技能。他变得对这条河的地理了如指掌，并且“对印第安语的熟练程度超过了自己的母语”，他回忆道。获释后，他和两个兄弟着手垄断波托马克河上游的贸易。1632\
  \ 年春，他们在该地区搜寻毛皮，甚至在纳科奇坦克停留，在那里他们获得了令人印象深刻的八百张毛皮。\n\n尽管纳科斯廷人愿意与弗利特兄弟交易，但当兄弟俩试图直接与大瀑布以上的部落交易时，他们却犹豫了。几年前，马萨沃马克人从瀑布上方南下，猛烈袭击了波托马克河上游的部落。他们指定被征服的纳科斯廷人作为中间人，用弗利特的话说，“负责运送所有进入这条河的英国货物”。为了维持其特权地位，纳科斯廷人试图“阻止我与任何其他印第安人进行贸易”，弗利特写道，“因为他们知道我们的贸易可能会损害他们的利益”。弗利特毫不畏惧，无视了昔日的俘获者，驾船沿波托马克河而上，并派他的兄弟爱德华徒步数日，去会见马萨沃马克人的“四位国王”。国王们对弗利特兄弟的货物印象深刻，同意将纳科斯廷人排除在波托马克河上游的海狸贸易之外。²¹\n\
  \n弗利特兄弟等弗吉尼亚毛皮商人的成功引起了伦敦富有投资者的兴趣，其中包括耶稣会士、第一代巴尔的摩勋爵乔治·卡尔弗特爵士。受可观利润前景以及拯救原住民灵魂的愿望所驱使，卡尔弗特请求国王查理一世授予他北纬四十度线与波托马克河之间土地的宪章。卡尔弗特在其请求获批前几天去世，新殖民地马里兰的所有权传给了他的儿子塞西利乌斯。1634\
  \ 年抵达切萨皮克后，塞西利乌斯·卡尔弗特雇佣弗利特帮助他“适应……这个国家的习俗”。弗利特做到了这一点，甚至更多。他将卡尔弗特介绍给皮斯卡塔韦酋长万纳斯，后者将位于圣玛丽河上的废弃村庄亚科莫科（位于纳科奇坦克下游一百英里处）授予马里兰殖民者定居。²²\n\
  \n尽管他们的贸易网络已被瓦解，英国殖民者也在波托马克河下游建立了永久定居点，但纳科斯廷人仍然留在自己的土地上，除了少数商人和耶稣会传教士外，三十年来基本未受外来者打扰。\n\
  \n### *为了“使烟草产量更大”：英国人取代纳科斯廷人*\n\n\n\n\n纳科斯廷人的命运在 17 世纪 50 年代开始转变，当时海狸价格下跌导致马里兰殖民者从皮毛贸易重新转向烟草。烟草需要大量土地。这个在前二十年里几乎没有超出圣玛丽城周边范围的小殖民地，在\
  \ 17 世纪 50 年代和 60 年代迅速扩张，种植园主沿着波托马克河向北迁移，清除了水边大部分可耕地。²³\n\n殖民定居点最终抵达纳科斯廷人的领地。1663\
  \ 年，卡尔弗特勋爵将波托马克河与阿纳卡斯蒂亚河（当时称为东支流）交汇处的土地授予专利，其中包括一块 860 英亩的地块给了贵族托马斯·登特，他以其约克郡的家乡村庄命名该庄园为吉斯伯勒。三年后，根据马里兰议会与皮斯卡塔韦人之间的条约，卡尔弗特创建了后来被称为“保留地”的区域。尽管协议规定“上述几个民族（其中包括‘阿纳科斯坦克’）应继续留在他们现在居住的地方”，但卡尔弗特将保留地中心设在皮斯卡塔韦人的首都马约内，迫使纳科斯廷人放弃纳科塔克坦克，向南迁移数英里定居。少数人留在更靠近家乡的地方，搬到了波托马克河中的阿纳洛斯坦岛（现罗斯福岛）。殖民政府没有抵制这一营地，这群人的残余部分一直占据该地直到下个世纪。²⁴\n\
  \n到 1670 年，殖民者已经宣称拥有后来成为华盛顿特区的所有土地，但由于来自北部和东部的部落持续袭击，他们认为该地区是一个危险的边疆。大多数地主住在圣玛丽城，对其土地主张置之不理。在\
  \ 17 世纪 80 年代，他们开始派遣契约仆人和被奴役的人到该地区，从森林中开辟烟草田。被称为“外种植园”的生活孤独而艰难。工人们住在简陋的孤立前哨，遭受着不愿接受流离失所的纳科斯廷和皮斯卡塔韦战士的反复袭击。所有人都生活在来自北方的入侵恐惧中。直到\
  \ 1689 年，关于塞内卡人即将发动袭击的谣言导致种植园主约翰·艾迪生匆忙写信给查尔斯县治安官请求武器，“因为这些地区如此毫无防备，且居住地相距甚远。”²⁵\n\
  \n艾迪生是第一位在纳科斯廷领土上安家的欧洲显贵。作为一名水手和贸易公司所有者，艾迪生于 1677 年在马里兰定居。与富有的寡妇丽贝卡·登特结婚后，他购买了吉斯伯勒地块的上半部分，该地块覆盖了纳科塔克坦克曾经所在的河岸平原的大部分区域。到\
  \ 1688 年，他在伸入河中的一个岬角上建造了一座漂亮的砖房，距离纳科斯廷人旧栅栏的腐烂残骸不远。²⁶\n\n在接下来的十年里，艾迪生和外种植园的殖民者巩固了边疆。1692\
  \ 年，马里兰议会委托在殖民地北部边境沿线修建堡垒，并在堡垒之间调动“白人士兵”。艾迪生负责在波托马克河的小瀑布处建造查尔斯县堡垒，随后接到命令“招募五名士兵和一名上尉，从波托马克的连枷到佩图克森特的瀑布，或在其他必要的地方，搜寻所有潜行的印第安人。”²⁷\
  \ 艾迪生和他的“游骑兵”在该地区巡逻，为英国定居点向北延伸到今天的马里兰州布莱登斯堡扫清了道路。\n\n在边疆占据上风后，殖民者转而对付他们中间的剩余皮斯卡塔韦人和纳科斯廷人。正如总督弗朗西斯·尼科尔森所说，他们想要土著的土地，以“促使生产更多数量的烟草”。议会回应道，从上查尔斯县划出乔治王子县，任命艾迪生为上校指挥县民兵，并授权他“审理和裁决印第安人与英国人之间可能发生或出现的所有个人纠纷。”²⁸\
  \ 许多这些“个人纠纷”演变为暴力冲突，因为纳科斯廷人和皮斯卡塔韦人抵制英国对其土地和自治的最新入侵。²⁹\n\n艾迪生对土著袭击殖民者的行为做出了严厉回应。1697\
  \ 年对詹姆斯·斯托德特的一名奴隶的袭击引发了如此威胁性的反击，以至于皮斯卡塔韦人和纳科斯廷人暂时逃离保留地，前往北弗吉尼亚的山丘。他们后来返回，但最终在 1701\
  \ 年永久离开，接受了宾夕法尼亚总督的提议，在萨斯奎汉纳河下游定居保留地。随后的几年里，他们继续向北和向西迁移，逃离欧洲定居的前线，并与其他美洲原住民群体融合，直到\
  \ 18 世纪末从历史记录中消失。³⁰\n\n回到波托马克河与东支流的交汇处，艾迪生和他的殖民同胞创建了一个由土地贵族统治的种植园社会。到 1708 年，乔治王子县拥有超过四百户英国家庭。接替父亲担任县民兵上校的托马斯·艾迪生认为该地区足够安全，解散了游骑兵。在接下来的几十年里，这些殖民者中的富裕者越来越多地转向被奴役的非洲人，并大幅减少了作为殖民地白人人口基础的契约仆人的供应。³¹\n\
  \n在马里兰和弗吉尼亚，上波托马克河上的第一批城镇都是种植园的延伸。到 1730 年，被奴役的工人生产了如此多的烟草，以至于弗吉尼亚殖民地在波托马克河西岸建立了亨廷克里克仓库，以收集作物并顺流运出。该定居点于\
  \ 1749 年合并为亚历山大镇。四年前，马里兰种植园主乔治·戈登在一条向北延伸至内陆农场的“滚动路”与波托马克河交汇处建立了一个烟草检验站。仓库周围的区域在\
  \ 1751 年成为“乔治镇”，尽管马里兰立法机构直到 1789 年才颁发特许状。³²\n\n该地区的土地家族，包括登特家族、艾迪生家族、扬家族和比尔家族，利用其种植园的财富主导了该地区的民选职位。他们的子女、孙辈和曾孙辈将通婚、继承土地、担任公职，并在接下来的一个世纪里垄断了北弗吉尼亚和南马里兰的政治。事实上，艾迪生的曾孙、马里兰州长乔治·普莱特签署了割让法案，将波托马克河马里兰一侧的领土于\
  \ 1791 年转让给联邦政府作为首都所在地。³³\n\n战争、疾病和征服的累积效应摧毁了上波托马克河的美洲原住民。1608 年有数千人生活在河谷中，但到 1708\
  \ 年，只剩下几百人——被击败、分散，并受制于王室。接触本身最初并未给纳科塔克坦克带来多少变化，在 17 世纪 20 年代之前很少有欧洲人访问该村庄。然而，随着第二次波瓦坦战争的开始，纳科斯廷人被卷入了袭击与反袭击的暴力节奏中，这正是原住民与白人关系的特征。英国人从敌对行动中变得更加强大并渴望扩张，而包括纳科斯廷人在内的大多数美洲原住民则大大削弱。在接下来的三十年里，他们被排除在上波托马克河宝贵的贸易网络之外，并受制于马里兰殖民地。\n\
  \n\n\n到 17 世纪 60 年代，纳科斯廷人（Nacostines）人口锐减，贸易网络遭到破坏，他们先是向南迁移，随后又转向北方和西方，仓促地试图远离欧洲人的定居点。在他们遗弃的土地上，殖民者建立了种植园社会。少数留下的美洲原住民痛苦地看着自己的狩猎场和玉米田被欧洲契约仆役和非洲奴隶改造成烟草农场；他们的贸易路线成为跨大西洋商业链条中的一环，将切萨皮克湾与新英格兰乃至欧洲连接起来。这片后来成为美国首都的地区，如同沿着大西洋沿岸南北延伸的殖民地一样，是通过征服战争清理出来的，并在被窃取的土地上依靠强制劳动建立了定居点。\n\
  \n1790 年，当安德鲁·埃利科特开始测量这片将成为国家首都的十英里见方区域时，纳科斯廷人早已消失，纳科奇坦克（Nacotchtank）也已成为遥远的记忆——事实上，当托马斯·杰斐逊询问居住在东支流沿岸的美洲原住民的名字时，已经没有人记得了。在哥伦比亚特区建立后的一个世纪里，旧村庄遗址的地面上散落着美洲原住民的文物，但这些后来被史密森尼学会的考古学家和业余收藏家收集起来。20\
  \ 世纪初，纳科奇坦克的遗址被填埋，为一条军用飞机跑道让路，这条跑道后来成为阿纳科斯蒂亚-博林联合基地的一部分。如今，纳科斯廷人仅存的痕迹就是那条以他们名字拉丁化形式命名的河流：阿纳科斯蒂亚河。³⁴\n\
  \n## 第二章\n\n## 奴隶黑人与民主白人\n\n*建造一个奴隶制与自由并存的首都，1790–1815 年*\n\n就在此地，在骄傲的波托马克河畔……\n\
  \n谁能有耐心，哪怕看上一眼，\n\n那骄傲与苦难混杂的乌合之众，\n\n鞭子与宪章，镣铐与权利，\n\n奴隶黑人与民主白人……\n\n走吧，走吧——我宁愿在苏丹的示意下，\n\
  \n以不确定的期限保住我的脖子，\n\n在那自由几乎未被提及的地方，\n\n除了统治权之外别无权利，\n\n也不愿这样活着，让虚伪的自由\n\n在奴隶头上嘲弄地挥舞她的粗布旗帜。\n\
  \n——托马斯·摩尔，《来自华盛顿城》，1808 年\n\n在华盛顿西南部朗方长廊的南端，坐落着本杰明·班纳克公园，这是一片圆形区域，设有花岗岩喷泉，并可俯瞰波托马克河和码头的美景。该公园建于\
  \ 20 世纪 60 年代末，1971 年更名为班纳克公园以纪念他，是第一个以黑人命名的联邦公园，旨在纪念这位杰出的非裔美国天文学家，他曾协助勘测早期的华盛顿。该公园原本是打造一个与国家广场相连的充满活力的滨水区的一部分，如今却成了混凝土丛林中一处相对难以到达的绿洲。如同早期华盛顿的许多历史一样，它很容易被忽视和低估。¹\n\
  \n信息有误的导游会笑着声称华盛顿是“建在沼泽上的”，这种轻蔑的描述与当地的地理情况不符。在 18 世纪末，这座城市尚未存在之前，班纳克公园所在的土地是令人垂涎的农田，是顶级的种植园地带，拥有连绵起伏的山丘和奔流的小溪，汇入生机勃勃的波托马克河。距离班纳克喷泉不到一百英尺的地方，矗立着诺特利·扬的宅邸，这是一座占地八百英亩的种植园的核心，该种植园沿波托马克河延伸近两英里，直至与东支流交汇处，覆盖了华盛顿西南部的大部分地区。\n\
  \n扬的宅邸建于 1756 年左右，坐落在距河岸两百英尺的河堤上，从带柱廊的后门廊可以欣赏到全景。访客通过一条绿树成荫的入口抵达这座令人惊叹的两层砖结构建筑，它拥有十多个房间和四个引人注目的烟囱，烟囱点缀在屋顶的每个角落。爱尔兰访客约翰·奥康纳在\
  \ 1788 年评论道，它“不逊于某些欧洲王子的宫殿”。宅邸旁边有一座小教堂，扬作为马里兰州主要天主教家族之一的后裔，可以在不离开庄园、不违反该州禁止公开天主教礼拜禁令的情况下举行弥撒。²\n\
  \n诺特利·扬的财富和显赫地位可以通过他作为奴隶主的身份来衡量——实际上也很大程度上源于此——他是马里兰州少数拥有超过 100 名奴隶的奴隶主之一。到乔治·华盛顿选定以他的种植园为中心的十英里见方区域作为新政府所在地时，扬已经奴役了\
  \ 265 人。虽然扬的少数被奴役工人住在“庄园主宅邸”里，但其余的人住在下游的木屋里。他们耕种着从河岸向内陆延伸数百码的烟草和玉米田。他们的劳动使扬及其后代拥有了财富和时间，成为著名的公众人物，先是在马里兰州，后来在初生的华盛顿市，扬的女婿罗伯特·布伦特担任了该市的第一任市长。³\n\
  \n成为华盛顿的地区并非一张白纸，并非无人居住的沼泽荒野。它是一个功能完备的奴隶社会，一片点缀着由强大奴隶主家族拥有的烟草种植园的土地。奴隶制及其伴随的贵族政治生活方式，定义了后来成为国家政府所在地的南马里兰州和北弗吉尼亚州田野中的生活。在这片田野上发展起来的城市，将奴隶制融入了生活的方方面面。\n\
  \n事实上，华盛顿从一开始就体现了美国自身固有的矛盾，即自由与奴隶制并存的悖论，这种矛盾困扰着这个国家，并最终导致了内战。华盛顿既是千年来世界上第一个共和国的首都——又是一个奴隶劳动对经济生活不可或缺的城市。它既是充满抱负的民主国家的象征——又是美国民主种族局限性的证据。它既是“自由的堡垒”——又是奴隶制和奴隶贸易的中心。很少有观察者会忽略国家首都中的被奴役者。他们参与公共建设项目，他们在国会大厦的视线范围内被买卖，他们驾驶着穿梭于城市中的马车，他们侍奉着管理国家的人。早期的华盛顿是一个深深浸淫于奴隶制并从中受益匪浅的南方城市。\n\
  \n另一个嵌入城市结构中的矛盾可以追溯到美国独立战争。自治在哥伦比亚特区很早就消亡了。美国人为了抗议“无代表不纳税”而发动战争，甚至不到一代人的时间，国会就剥夺了华盛顿人民主的基本单位：投票权。尽管公民抗议迫使国会纳入了一种修改形式的自治，但即使是精英阶层的华盛顿人也缺乏基本的投票权。这座城市变成了一个政治殖民地，其命运不取决于称其为家的当地居民，而取决于暂时居住在那里的国家政治领袖。华盛顿从来*不仅仅*是一座城市，它成为了国家政治斗争的舞台，自由黑人、白人精英、欧洲移民、被奴役者以及国家政治领袖都在这里争夺着“自由”和“民主”在新首都中究竟意味着什么。\n\
  \n### *“让它甜一点”：南方赢得了首都*\n\n\n\n\n\n1790 年 6 月，当这三位男士坐下来共进晚餐时，他们早已是革命时期美国的传奇人物。其中一人写下了后来定义美国、并激励全球自由运动的文字——“我们认为这些真理是不言而喻的：人人生而平等。”另一人为美国宪法提供了理论框架，而餐桌上的第三位则正在为国家的经济体系奠定基础。托马斯·杰斐逊、詹姆斯·麦迪逊和亚历山大·汉密尔顿曾共同塑造了这个新生国家的诸多制度，而在杰斐逊位于曼哈顿的家中，这顿晚餐又将增添一项：国家的首都。在甜点上桌之前，这三人将就永久首都的选址达成一项重大协议，这一妥协将对未来的哥伦比亚特区产生决定性的影响。\n\
  \n这顿晚餐是杰斐逊的主意。他认为这是解决两个相互交织的辩论的途径，这两个辩论主导了 1788 年宪法批准后召开的第一届国会。这些辩论——一个关于联邦政府的财政权力，另一个关于联邦政府所在地——不仅揭示了南北之间的深刻分歧，也通过确保首都建成为一个蓄奴城市，奠定了华盛顿特区历史的走向。\n\
  \n晚餐前一天，国务卿杰斐逊正要去与华盛顿总统会面，途中遇到了情绪激动的亚历山大·汉密尔顿。这位战争英雄当时担任财政部长，他激动地告诉杰斐逊，自己对国家的经济危机越来越感到担忧，这场危机已使国会陷入瘫痪，并有可能撕裂整个国家。1783\
  \ 年独立战争结束不到十年，美国因战争而背负的债务已失控般螺旋上升。汉密尔顿担心，如果国家无法偿还债务，可能会被世界市场拒之门外，因为外国政府和个体投资者担心贷款永远无法收回，干脆拒绝与美国合作或投资。这个年轻的经济体将遭受重创，甚至可能永久瘫痪。⁴\n\
  \n为避免违约，汉密尔顿提出了一系列金融改革，其中包括“债务承接”——由联邦政府承担所有州债务，并承诺全额偿还。他希望将债务的经济负担转化为政治资产：国家统一和联邦政府的强化。但许多国会议员，尤其是来自杰斐逊家乡南方的议员，强烈反对债务承接，部分原因是许多南方州已经还清了债务。⁵\n\
  \n“债务承接”辩论大体上得到商业导向的北方支持，而遭到农业南方的反对，凸显了关于联邦政府角色的不同愿景。对汉密尔顿及其盟友（包括华盛顿总统）而言，一个充满活力的贸易国家需要强大的中央金融机构和一个能够行使宪法未明确列举权力的联邦政府。汉密尔顿的反对者普遍对这种中央集权持怀疑态度，担心联邦权力过度扩张，并拒绝汉密尔顿坚持认为宪法中的“必要和适当”条款允许如此大规模财政措施的观点。他们认为联邦政府只能行使那些对其存在不可或缺的权力。⁶\n\
  \n这个问题极具爆炸性，引发了杰斐逊所称的“国会历史上最激烈、最愤怒的争论”。⁷ 反对债务承接的人威胁要脱离联邦，而且他们拥有足够的票数来阻止这项措施。汉密尔顿知道杰斐逊在南方反对债务承接的议员中拥有相当大的信誉，因此当他和杰斐逊在总统官邸前踱步时，他恳求这位弗吉尼亚人帮助打破僵局。杰斐逊提议与麦迪逊共进晚餐，设想达成一项妥协，涉及另一个使国会陷入瘫痪的重大政治僵局：国家政府所在地的选址。\n\
  \n至少从 1783 年起，当一群大陆军退伍军人在邦联国会开会的宾夕法尼亚州议会大厦外举行喧闹抗议时，许多国家领导人就主张国家政府所在地应直接置于联邦政府控制之下。邦联国会并非抗议的目标——退伍军人是在向宾夕法尼亚行政委员会索要欠薪——但汉密尔顿和麦迪逊等政治领袖利用这一事件制造恐慌，声称除非国家政府完全控制其首都，否则它可能会被州利益所挟持。他们认为，拥有一个独立于现有各州的政府所在地，将加强国家政府，并使其免受各州压力。⁸\n\
  \n到 1787 年，这一想法在参加制宪会议的人中已变得司空见惯。他们将其写入宪法第一条第八款，授权国会“对于由某些州让与、经国会接受、成为合众国政府所在地的地区（不超过十平方英里），在任何情况下均行使专属立法权”。正是从这一条款中，诞生了我们今天所知的华盛顿特区。\n\
  \n宪法对特区的最大面积有具体规定，但未指定其位置。1789 年末，国会开始审议这个“政府所在地”应设在哪里。当时很少有人使用“首都”一词，这个词带有宏伟和规模的意味，似乎与一个新生共和国格格不入。与巴黎或伦敦那样的纪念性城市不同，包括托马斯·杰斐逊在内的许多美国人设想的是一个朴素的“联邦小镇”，只容纳政府，别无他物。无论朴素与否，政府所在地将为赢得这一殊荣的地方带来声望、繁荣和权力。杰斐逊本人估计，联邦城市每年将产生约一百万美元的经济活动——按\
  \ 21 世纪美元计算超过十亿美元——许多观察家认为它不可避免地会成为一个繁荣的政治、经济和文化中心。⁹\n\n政治领袖和城市推动者提出了十几个选址方案，1789\
  \ 年，众议院投票决定将政府所在地设在宾夕法尼亚州的萨斯奎汉纳河畔。然而，在接下来的一年里，设想在波托马克河畔建都的弗吉尼亚人——包括杰斐逊、麦迪逊以及华盛顿总统——策划了一场非凡的政变，推翻了众议院的投票，并说服国会将首都设在南方。他们寻求南方首都的原因与北方同僚相同——权力、声望和经济增长——但也是为了保护南方生活的核心制度：奴隶制。¹⁰\n\
  \n杰斐逊餐桌上的这三位男士深知奴隶制的全国性影响。近两百年来，自 1619 年一艘荷兰船首次将二十名被奴役的非洲人运抵詹姆斯敦以来，奴隶制一直是一个彻头彻尾的全国性事务。到美国独立战争时期，基于种族的世袭奴隶制已在从佐治亚到马萨诸塞的所有英国殖民地中根深蒂固。\n\
  \n\n\n\n然而，存在地区差异。在北方，小土地上的自耕农面临生长季节短、土壤相对贫瘠的困境，使得奴隶制即使存在，也仅在小规模上具有经济可行性。几乎所有北方奴隶主都拥有一两名奴隶。到\
  \ 1790 年，被奴役的人口仅占北方人口的 2%，而不到 6%的美国被奴役者生活在北方。但奴隶制对许多北方工业至关重要，包括造船和制帆业，北方公司和个体资助并主导了北美非洲奴隶贸易。¹¹\n\
  \n在南方，奴隶制在较温和的气候和更肥沃的土壤中蓬勃发展。在试图征服当地美洲原住民失败后，南方种植园主转向非洲奴隶制，为其农业经济提供劳动力。尽管大多数南方奴隶主拥有不到五名奴隶，但相当一部分少数人拥有数十甚至数百名被奴役者，他们在拥有数百甚至数千英亩土地的大型种植园中生活和工作，专门种植烟草和水稻等主要作物。三个最大的奴隶州中有两个是马里兰州和弗吉尼亚州，哥伦比亚特区将从这些州中划出。大约三分之一的马里兰居民是被奴役者，弗吉尼亚人中被奴役者约占\
  \ 40%。到 1790 年，这两个州共有近四十万被奴役者，约占北美奴隶人口的 55%。¹²\n\n尽管存在这些差异，殖民时代的政治领袖们普遍致力于维护奴隶制度。以两位测量马里兰和宾夕法尼亚边界的测量员命名的梅森-迪克森线，在地图上区分了北方和南方，但直到独立战争时期才成为文化和意识形态上的障碍。在\
  \ 1775 年战争爆发前的二十年里，一场国际运动开始挑战奴隶制的思想基础。对于新兴的奴隶制反对者来说，《独立宣言》激动人心的言辞只是凸显了新国家所倡导的自由与其约五分之一人民所遭受的束缚之间的明显矛盾。正如英国作家塞缪尔·约翰逊在评论抱怨英国暴政的美国爱国者时尖刻地指出：“我们怎么会听到在黑人驱赶者中发出最响亮的自由呼声？”许多被奴役者自己也开始用革命的语言提出要求，迫使美国奴隶主陷入尴尬境地：他们为自己争取自由，却拒绝给予黑人自由。¹³\n\
  \n一些美国人，尤其是北方人，开始将奴隶制视为自由时代的一种邪恶的过时之物。革命时期最坚定的反奴隶制领袖之一是亚历山大·汉密尔顿。这位才华横溢的加勒比奴隶主的私生子认为，奴隶制“削弱了工业的筋骨，剪断了商业的翅膀，并以各种形式带来苦难和贫困。”¹⁴他是纽约促进奴隶解放协会的创始成员之一，该协会是\
  \ 18 世纪 80 年代在北方涌现的数十个反奴隶制组织之一。到 1787 年夏天制宪会议召开时，七个北方州中有五个已经禁止了奴隶制。\n\n许多独立战争时期的领导人认为奴隶制是一种垂死的制度，会因自然经济原因而消亡。这种制度不仅在北方，而且在南方上区似乎也在衰落。在马里兰州和弗吉尼亚州，州立法机构修改了法律，使奴隶主更容易解放他们的奴隶，从而促进了自由黑人社区的增长。甚至许多南方奴隶主也对他们赖以生存的制度表示担忧。杰斐逊在他\
  \ 1784 年广为流传的论文《弗吉尼亚笔记》中，对奴隶制对美国人民的“不幸影响”感到忧虑。“主人与奴隶之间的整个交易是一方不断行使最狂暴的激情、最无情的专制，另一方则不断屈辱地服从。”华盛顿也认为奴隶制与一个建立在自由之上的国家不相容。受他自己作为奴隶主的经历以及他强烈反奴隶制的朋友拉法耶特侯爵的论点影响，他声称：“没有一个人比我更真诚地希望看到一项废除奴隶制的计划被采纳”，他认为奴隶制是“唯一不可避免的遗憾之事”。¹⁵\n\
  \n尽管他们内心痛苦，但很少有南方奴隶主将抽象的自由观念转化为具体的解放行动。即使是对奴隶制道德困境抱有同情的奴隶主，也因解放所带来的社会排斥和经济损失而退缩。华盛顿尽管私下哀叹，却一直持有他的奴隶直到去世。詹姆斯·麦迪逊也是如此，他担心自由可能对奴隶制产生革命性影响。在战争期间在费城生活了四年后，麦迪逊担心他的一个被奴役者比利“被污染得太深，不适合成为弗吉尼亚其他奴隶的合适同伴”。尽管他承认比利“渴望那种我们付出了如此多鲜血代价、并多次宣称是每个人应追求的权利的自由”，麦迪逊还是把他卖掉了。¹⁶\n\
  \n奴隶制仍然是南方经济的基石，对其合法性的质疑只会加剧许多南方白人的被围困感。在制宪会议上，奴隶制作为一个不受欢迎的提醒，凸显了两个地区日益增长的差异。“现在看来，人们相当清楚地认识到，真正的利益分歧不在于大小州之间，而在于北方和南方各州之间，”麦迪逊在会议中途沮丧地写道。“奴隶制及其后果构成了分界线。”¹⁷\n\
  \n这种“利益分歧”在关于国家政府所在地的辩论中显现出来。由于感到被人口更多的北方和不断扩张的西部所包围，南方人担心将首都设在北方——尤其是靠近费城这个美国反奴隶制运动的中心——最终会削弱奴隶制和南方权力。他们的担忧在\
  \ 1790 年初加剧，当时一群贵格会教徒向国会提交了两份请愿书，要求结束非洲奴隶贸易。第三份来自宾夕法尼亚废奴协会（由受人尊敬的本杰明·富兰克林领导）的请愿书鼓励国会彻底废除奴隶制。这些请愿书在国会引发了巨大反弹，并坚定了南方人将国家政府所在地设在奴隶制南方的决心。¹⁸\n\
  \n随着 1790 年春天的流逝，关于首都的辩论和关于金融体系的斗争都未得到解决。汉密尔顿及其支持者缺乏让债务承担法案通过国会所需的选票，而麦迪逊及其盟友则难以争取到足够票数将首都设在波托马克河畔。杰斐逊，绝非一个无动于衷的旁观者，介入其中，在他位于曼哈顿梅登巷\
  \ 57 号的租住房子的晚餐上促成了一场交易。\n\n\n\n\n这顿饭是由杰斐逊的奴隶厨师詹姆斯·赫明斯准备的，他是杰斐逊已故妻子玛莎同母异父的弟弟，年仅二十五岁，却从未被承认。赫明斯刚从法国为杰斐逊服务五年归来，在那里他学会了说法语，并亲眼目睹了席卷该国的革命热潮。他的妹妹萨莉也是奴隶，很快将成为杰斐逊的情妇，并生下四个与这位未来总统极为相似的孩子。萨莉·赫明斯的孩子们最终将获得自由，詹姆斯本人也是如此。杰斐逊一生中唯一释放的奴隶都是萨莉·赫明斯的亲属。正如奴隶制问题本身一样，赫明斯在晚宴上安静的存在时刻提醒着人们：年轻美利坚合众国最聪明的头脑们关于自由的沉重讨论，在很大程度上正是由他们身边的奴隶劳工所支撑的。¹⁹\n\
  \n晚宴上，汉密尔顿、麦迪逊和杰斐逊敲定了一项协议的核心内容。他们首先就承担债务法案达成一致。杰斐逊回忆道：“有人指出，这颗药丸对南方各州来说尤其苦涩，因此应该采取一些伴随措施来稍微缓和一下。”这剂“镇痛药”就是将首都设在波托马克河畔。因此，作为南方各州支持承担债务法案的交换，汉密尔顿将说服他的北方盟友，允许政府所在地设在南方。汉密尔顿作为全国领先的废奴倡导者之一，实际上为了推行他的国家经济议程而牺牲了自己在奴隶制问题上的原则。²⁰\n\
  \n由此产生的立法被命名为《1790 年居住法案》，因为它决定了政府将“居住”在何处。该法案于七月通过，赋予华盛顿总统权力，在波托马克河沿岸、东支流河口与上游七十英里处的科诺科奇格溪之间选择一处作为国家首都的地点。马里兰州和弗吉尼亚州将把必要的土地割让给联邦政府。作为对曾希望选址萨斯奎汉纳河的宾夕法尼亚人的安抚，国会同意在新政府所在地建设期间，将联邦政府迁至费城十年。国会将任命三名专员监督建设，并为政府于\
  \ 1800 年迁入做好准备。\n\n这一妥协确保了国家的财政未来，并使隐含权力原则合法化——这是汉密尔顿和联邦党人的两大胜利。但这一交易对未来华盛顿市造成了毁灭性后果。“我一直后悔美国首都从纽约或费城迁走，”华盛顿民权领袖玛丽·丘奇·特雷尔在\
  \ 1940 年写道，“如果它位于北方、东部或西部，有色人种的处境会比现在好得多。”²¹\n\n新城市安全地坐落在全国两个最大的蓄奴州之间，很可能支持奴隶制和国内奴隶贸易。华盛顿并非扎根于废奴种子早已生根发芽的北方，而是与南方的奴隶制紧密相连。首都不会在繁华、国际化的大都市中成长，而是在种植园地区发展，并在未来几代人中保持其乡村、南方的特色。华盛顿的居民和访客不会与费城强大且不断增长的自由黑人和废奴社区交融，而是会目睹奴隶贩子驱赶着成队的男女奴隶穿过城市。\n\
  \n在杰斐逊的餐桌上达成的重大交易，付出了巨大的代价。\n\n### *“无与伦比的壮丽前景”：在波托马克河上崛起的大首都愿景*\n\n对于詹姆斯·霍班来说，拟议中的国家首都提供了一个千载难逢的机会。霍班出生于爱尔兰，是著名都柏林皇家学院的熟练建筑师，独立战争后不久移居美国。他在南卡罗来纳州查尔斯顿定居，适应当地习俗，成为奴隶主，拥有一支值得信赖的奴隶木匠团队。他们一起建造了查尔斯顿县法院，这座宏伟的建筑在总统访问该港口城市时引起了乔治·华盛顿的注意。1792\
  \ 年，华盛顿总统和城市专员们选中霍班作为新国家政府所在地总统官邸设计竞赛的获胜者。²²\n\n与首都本身一样，霍班依靠奴隶劳动来充分利用他的机会。他于那年年底搬到该市，带来了五名奴隶：本、丹尼尔、哈里、彼得和汤姆。尽管霍班后来签署了一份呼吁在该市结束奴隶制的请愿书，但他直到\
  \ 1831 年去世前一直是一名奴隶主。霍班的奴隶与十几名白人木匠以及数十名白人和黑人的非熟练劳工一起，参与这项庞大的工程。霍班特别寻找爱尔兰移民，并鼓励他们加入他组建的地方民兵组织。霍班由自由劳工和奴隶劳工组成的多种族团队拼命工作，以满足华盛顿和专员们设定的时间表。²³\n\
  \n华盛顿总统选择了霍班及其团队工作的地点作为政府所在地。作为一位严厉、令人敬畏、受感恩国家普遍敬仰的远见卓识者，华盛顿被赋予广泛自由来选择地点和规划首都。总统以年轻中尉的活力和投机者的热情拥抱了这一挑战。作为毫不掩饰的民族主义者，他接受了亚历山大·汉密尔顿关于一个向西扩张并发展成为经济强国的商业国家的愿景，并将波托马克河视为通往西部的天然门户。在成为总统之前，他帮助发起并经营了帕托马克公司，该公司计划将波托马克河变成一条连接大西洋与富饶的俄亥俄河谷的繁忙水道。\n\
  \n总统将联邦城市视为国家抱负的体现。他相信，波托马克河畔的地点是一张白纸，他设想在此建造一座宏伟的国家首都，使其超越欧洲城市，成为这个不断壮大的共和国的合适堡垒。建造这座象征性的城市将是他职业生涯的完美收官，并有助于确保他帮助创建的国家的长期生存。\n\
  \n在选择联邦城市的地点时，商业考虑是他最优先考虑的因素。在波托马克河沿岸七十英里的范围内选择地点时，华盛顿立即将目光投向了他最熟悉的区域：最南端，距离他山顶的弗农山庄不到两英里。华盛顿夸耀说，这个地点“在壮丽前景、优质水源、清新空气和安全港湾方面，不逊于世界上任何地方”。它距离大西洋足够远，使得外国海军入侵不太可能，并且正好位于大瀑布的下游，这是可通航水域的最北端。“我毫不怀疑，”他在给朋友的信中写道，首都“凭借自然赋予的优势，以及靠近富饶的内陆地区和西部领土，将成为美国的商业中心。”²⁴\n\
  \n\n\n\n\n1791 年 1 月，华盛顿总统告知国会，他已选定波托马克河与东支流交汇处的一片区域，其中包括马里兰州现有的港口村庄乔治敦。他恳请议员们修改立法，使政府所在地也能涵盖东支流河口以南数英里的亚历山德里亚镇。这一决定对首都的种族发展产生了深远影响。当时，亚历山德里亚是一个拥有超过\
  \ 2700 名居民且不断发展的港口，其中近 20%的人口是奴隶。到 19 世纪 30 年代，这里的众多奴隶贩子将帮助华盛顿特区成为全国最大的奴隶贸易城市。将这一繁荣港口纳入联邦特区边界，巩固了奴隶制对这个新生首都的控制。²⁵\n\
  \n国会同意了华盛顿的选择。马里兰州割让了大约七十平方英里，弗吉尼亚州割让了约二十平方英里，另外十平方英里由波托马克河覆盖。华盛顿随后任命了三位密友作为专员，他们曾担任帕托马克公司的董事，并与他一样希望将新首都打造成商业中心和政府所在地。托马斯·约翰逊是马里兰州一位好斗的前州长，在华盛顿辞职后接管了公司。岩溪的丹尼尔·卡罗尔是一位世界性的天主教徒（他的兄弟约翰·卡罗尔主教帮助创办了乔治敦学院），他是国会中少数几位在承担债务问题上改变投票以换取首都建在波托马克河畔的南方人之一。大卫·斯图尔特是一位阴郁的弗吉尼亚种植园主兼医生，他娶了玛莎·华盛顿儿子的遗孀，从而成为总统的女婿。²⁶\n\
  \n这三个人——与新首都最著名的支持者华盛顿总统和国务卿杰斐逊一样——都拥有奴隶：约翰逊在马里兰州弗雷德里克的种植园里奴役了 38 人；卡罗尔在他位于现在马里兰州森林幽谷的种植园里拥有超过\
  \ 50 名奴隶；斯图尔特和他的妻子在亚历山德里亚的阿宾登种植园（现为里根国家机场所在地）拥有 300 名奴隶的三分之一权益。²⁷\n\n首要任务是彻底勘测该区域，以确定新城市的边界。为此，专员们选择了\
  \ 38 岁的测量员安德鲁·埃利科特，他是一名贵格会教徒和独立战争老兵，由詹姆斯·麦迪逊推荐。埃利科特或许是全国顶尖的测量员，经常与他的两个兄弟合作，但杰斐逊召唤他到波托马克河时，他的兄弟们已有其他工作。需要一位能干的助手陪同，埃利科特邀请了本杰明·班纳克——一位自由的黑人自学成才的数学家和业余天文学家，他独自住在马里兰州巴尔的摩县埃利科特表亲乔治的附近。²⁸\n\
  \n这是一个明智的选择。1791 年初，60 岁的班纳克满头白发，因风湿病已从烟草种植业退休，但他仍是一位敏锐的天文观测者。班纳克由他的白人祖母教会读写，一生只上过几周学，但他学得很快。他通过观察乔治·埃利科特进行观测来学习天文学。埃利科特借给他书籍和仪器，不久班纳克便开始自己进行观测，并发现普遍接受的计算中存在差异。当安德鲁·埃利科特找到他时，他已经花了一年多时间进行夜间观测和计算。尽管埃利科特最初对聘请一位未受过教育的黑人作为助手有所顾虑，但他还是雇用了班纳克，两人于\
  \ 2 月初前往亚历山德里亚。²⁹\n\n他们的任务是勘测并标记城市边界，沿途与自然条件、野生动物以及持怀疑态度的土地所有者作斗争。埃利科特带领六名劳工，花了两个月时间砍伐灌木、涉过溪流，并绘制出菱形联邦特区十英里长的边界。（在开辟出最初的边界后，他们返回清理边界两侧各二十英尺的区域，每英里放置一块石标——其中\
  \ 36 块原始石标至今仍可在其原始位置或附近看到。）班纳克因年事已高无法承担繁重的体力劳动，专注于校准仪器、进行数学投影和精确计算距离等智力工作。他大部分时间都在观测帐篷里，使用各种科学仪器每晚观测星星。在休息时间，他编写了一本年鉴，并于当年晚些时候出版。³⁰\n\
  \n班纳克的工作赢得了当地白人（包括专员们）的尊重。正如乔治·埃利科特的女儿回忆的那样：“他远超他们所遇到的所有同族人的卓越表现，使他们摒弃了所有种姓偏见，与他自由交谈，并欣赏他言论的清晰与独创性。”1791\
  \ 年 3 月的《乔治敦周报》声称，他“作为测量员和天文学家的能力清楚地证明，杰斐逊先生关于该种族缺乏智力天赋的结论是没有根据的。”³¹\n\n然而，班纳克拒绝接受自己天赋异禀因而值得特别赞扬的观点。相反，他坚持认为，只要获得自由，所有黑人都能发展成为社会的贡献者。他在\
  \ 1791 年 8 月一封引人注目的信中直接向托马斯·杰斐逊提出了这一论点，并将这封信连同他的年鉴一起寄给了国务卿。班纳克本人“充分品尝到了你所享有的那种自由与平等所带来的福祉”，他挑战杰斐逊将这些福祉扩展到所有黑人，并“根除那种普遍存在于我们身上的荒谬虚假的观念和看法”。班纳克提醒杰斐逊，在独立战争期间，杰斐逊“清楚地看到了奴隶制状态的不公正”，并写下了《独立宣言》中不朽的文字。那么，他如何能证明“通过欺诈和暴力扣留我如此众多的同胞，使他们处于呻吟的囚禁和残酷的压迫之下”是合理的呢？³²\n\
  \n杰斐逊对班纳克的工作印象深刻（或许也被他信中的大胆所打动），迅速回信，在一封公开信中写道：“没有人比我更希望看到像你所展示的这样证据，证明大自然赋予了我们黑人兄弟与其他人种同等的才能，而缺乏才能的表象仅仅是由于他们在非洲和美洲的卑贱生存状态所致。”然而，私下里，他质疑班纳克是否独立完成了这些工作。³³\n\
  \n班纳克的成就以及埃利科特跨种族勘测团队的成功，至少提出了一个建立在自由劳动而非奴隶劳动基础上的首都城市的可能性。在独立战争余晖中，平等主义言论在公众心中仍记忆犹新，奴隶制在新联邦城市中的强加并非不可避免。但城市专员及其上级联邦领导人的决定很快将关闭这种可能性。\n\
  \n\n\n\n当埃利科特和他的团队勘测土地时，华盛顿转向了他备受推崇的战时顾问彼得·查尔斯·朗方，委托他设计这座城市。朗方与华盛顿有着共同的愿景：建造一座气势恢宏、具有象征意义的首都，使其成为庞大共和帝国的中心。面对杰斐逊提出的按照常见网格布局设计的简单“联邦城镇”草案，朗方不屑一顾，称所有此类网格都“令人厌倦且乏味”。相反，他制定了一个令人惊叹的宏伟城市规划：宽阔的林荫大道、众多的公园，以及像光线（象征自由与民主）一样从国会大厦辐射出去的斜向街道。朗方摒弃了欧洲首都那些装饰华丽的政府建筑，选择了经典的希腊建筑风格。他想赋予这座新城市一种委员们所称的“共和式的简朴”，与旧世界君主制的浮华装饰形成对比，同时传达雅典民主永恒的美学吸引力和价值观。³⁴\n\
  \n![Image](img/f0001-03.jpg)\n\n*《哥伦比亚特区华盛顿市规划图》。这幅 1792 年版画的摹本展示了测量员安德鲁·埃利科特根据彼得·朗方的方案绘制的华盛顿市规划图。该规划向北延伸至边界街（今天的佛罗里达大道）。国会图书馆。*\n\
  \n华盛顿总统采纳了这一规划，但朗方性情急躁、缺乏政治手腕，得罪了杰斐逊以及其他他本应明智地去争取的人。当委员们要求提供朗方的规划副本，以便为政府土地拍卖做准备（拍卖所得将用于城市建设）时，这位傲慢的工程师却犹豫不决。僵局导致朗方愤然离职，迫使华盛顿和城市委员们转而求助于安德鲁·埃利科特，让他制定一份可用的城市蓝图。由于曾与朗方密切合作制定规划，埃利科特（而非后来传说中声称的本杰明·班纳克）得以重现原始规划，并对其做了一些修改。\n\
  \n由于只有不到十年的时间来建设国家政府所在地，委员们急于吸引投资者、劳工和居民到该地区。华盛顿总统和委员们确信波托马克河畔的首都将成为商业中心，于是自信地提议将土地拍卖给感兴趣的买家。但\
  \ 1791 年 10 月举行的第一次土地拍卖却是一场灾难——一万块地块中仅售出三十五块。拍卖结果惨淡，这是一个不祥之兆，表明这座城市不会像其支持者所希望的那样迅速或顺利地发展。³⁵\n\
  \n地区委员们不仅难以吸引土地买家，还发现很难招募到自由劳工。起初，他们对劳动力市场持乐观态度。“人们正翘首以盼，从各地涌向华盛顿，”他们在 1792 年 4\
  \ 月写给国务卿杰斐逊的信中说，“我们可能很快就能在这里召集两千名技工和劳工。”杰斐逊则不那么自信，他敦促委员们考虑从德国和欧洲其他地方引进工人。³⁶\n\n\
  委员们很快意识到，在农村地区能找到的白人工人相对较少，而这种稀缺性只会使劳动力更加昂贵。预期的欧洲工人移民潮根本没有出现。正如一位法国访客所说：“为数不多的可用工人既不可靠，雇佣费用又极其昂贵。”由于未能从国会获得大量拨款，也无法通过私人地块拍卖筹集到足够资金，委员们感到压力重重，不得不控制成本，不愿为劳动力支付高额工资。他们意识到，以他们愿意支付的价格，不可能找到足够的白人工人来完成这项工作。³⁷\n\
  \n但他们有一个替代方案：奴隶。\n\n### *“一种非常有用的制约”：被奴役的工人建造国家首都*\n\n委员们将奴隶劳动视为控制白人工人并最小化成本的有力手段。“工人的给养带来了如此多的开支和浪费，以至于迄今为止我们都让他们自行解决，”委员们在\
  \ 1793 年初向杰斐逊解释道。因此，他们需要寻找新的劳工，“其中一部分我们可以轻易地用黑人组成，并且我们认为这样做是合适的。今年夏天我们雇佣的那些黑人已经证明是一种非常有用的制约，使我们的局面保持冷静。”³⁸\
  \ 换句话说，通过提供更廉价的替代方案，被奴役的工人帮助委员们约束了白人工人。\n\n这座初生的首都城市决心将奴隶劳动作为其劳动力的重要组成部分，因为除此之外别无他法，这样做实在太经济、太便捷了。委员们决定不直接购买奴隶，而是“按年雇佣优秀的黑人劳工，主人为他们提供良好的衣物和每人一条毯子，委员们则提供食物，并向主人支付每年二十一英镑”（约合\
  \ 55 美元，相当于 21 世纪的 27,000 美元）。他们指示城市劳工主管埃利沙·威廉姆斯上尉“让这些按年雇佣的工人从日出工作到日落，尤其是那些黑人”。在一则广告中，他们写道：“华盛顿市诚聘：若干奴隶，在砖厂、采石场等处劳动，将支付优厚报酬。另需锯木工，可按百件计酬，或按月、按年支付工资。”³⁹\n\
  \n威廉姆斯本人是附近种植园的奴隶主，他花费大量时间招募和雇佣被奴役的工人。到 1794 年，该市已与种植园主签约，雇佣了至少四十六名奴隶，而在接下来的几年里，这一数字将增长到一百多人。同年，爱德华·伯罗斯将九名被奴役的人（包括一位带着两个孩子的母亲）挂牌出售，这是该市范围内举行的第一次奴隶拍卖。加上私营公司和供应商使用的奴隶劳动力，到\
  \ 1795 年，已有三百多名被奴役的工人在建造国家首都。那年八月，乔治敦颁布了一项法令，禁止奴隶饮用烈酒，并对任何协助逃跑奴隶的人处以五美元罚款。⁴⁰\n\n\
  被奴役的劳工与自由工人并肩工作，从事各种工作。（自由黑人劳工很少，但有一位名叫杰里·霍兰的人给委员们留下了深刻印象，一位测量员称他“完全有资格获得我们部门最高的工资”，因为他是“部门里最好的工人”。）他们每日配给咸肉、面包和玉米粉，砍伐树木为宽阔的大道和宽敞的联邦建筑腾出空间；他们挖掘沟渠以标记规划的广场，挖井以供应当地人口，并为宏伟的建筑挖掘地基；他们锯木、制砖、砌砖，以及开采、搬运和吊装石头。他们对这座城市至关重要，以至于威廉姆斯在\
  \ 1793 年告诉他的上司，他“今年夏天没有他们就无法完成工作”。⁴¹\n\n\n\n\n被奴役的劳工在当时两项主要的公共工程中尤为突出——建造总统府和国会大厦的两百名工人中，约有一半是奴隶。1798\
  \ 年，波兰访客尤利安·涅姆采维奇在游览华盛顿时，注意到大量被奴役的男性正在新建的国会大厦上劳作，与他们的自由白人同伴一起干活。当白人工人每天消失几次去“喝格罗格酒”时，涅姆采维奇观察到，“只有黑人在干活。”他起初以为这些黑人工人是定期领薪的劳动者，但很快发现“他们并非为自己工作；他们的主人将他们租出去，并扣下所有工钱。何等的人性！何等的自由之国！哪怕他们能分享一点收入也好！”⁴²\n\
  \n奴隶制在当地变得如此根深蒂固，以至于连怀有反奴隶制理想的新来者也难以抗拒。赢得国会大厦设计竞赛的英国贵格会教徒威廉·桑顿，于 1794 年携妻子安娜迁居乔治敦，成为华盛顿的专员之一。桑顿出生于西印度群岛托尔托拉岛的一个奴隶主家庭，他本人是一位文艺复兴式人物——画家、雕塑家、医生兼建筑师。年轻时，桑顿曾摒弃家族对奴隶制的拥护，成为早期废奴倡导者。1795\
  \ 年，作为专员，他提议通过购买“50 名聪明的黑人”来缓解城市石匠短缺的问题，并承诺如果他们同意在国会大厦工作五到六年，就给予他们自由。⁴³\n\n这一提议毫无进展。事实上，桑顿在华盛顿待得越久，其反奴隶制立场就越弱。1795\
  \ 年底，他和妻子购买了一座附近的农场，由此成为几个奴隶家庭的拥有者。尽管他公开宣称自己的信念，但经济不稳定的桑顿在有生之年并未解放他的奴隶；而安娜·桑顿无视他的遗嘱，在\
  \ 1828 年丈夫去世后选择不释放他们。家中一名被奴役男性引发的事件，在 1835 年触发了一场种族骚乱（见第三章）。⁴⁴\n\n城市中许多被奴役的劳工是“雇佣工”——即奴隶主按合同期限出租的奴隶，但没有任何未来自由的保障。这种安排对城市、奴隶主乃至被奴役的劳工本身都有好处。对专员们而言，短期雇佣奴隶是一种获得相对廉价且往往有技能的劳动力的方式，同时无需承担拥有奴隶的全部成本。事实证明，被奴役的劳工比自由工人更容易管理和监督，他们的住房、医疗和长期就业由奴隶主负责，而非城市。如果一名被奴役的劳工没有出现，专员们只需扣除支付给奴隶主的报酬。如果有人生病，专员们可以让他接受治疗，费用由奴隶主承担。⁴⁵\n\
  \n当地的奴隶主喜欢这种安排，因为在他们依赖劳动密集型烟草种植的收益逐渐减少时，临时出售奴隶劳动力能带来收入。一个多世纪的烟草种植耗尽了马里兰州南部和弗吉尼亚州东北部的土壤——1790\
  \ 年代中期的一位法国访客指出，华盛顿周边的乡村呈现出“贫瘠且耕作不良的土地”。随着种植园主转向需要更少工人的不同作物和耕作技术，他们发现自己劳动力过剩。许多家庭试图维持伴随奴隶主身份而来的地位，因此他们不卖掉奴隶，而是将他们出租。每个出租的奴隶每年可赚取\
  \ 55 至 65 美元，这种做法的利润如此丰厚，以至于远在马里兰州查尔斯县和圣玛丽县的奴隶主也试图将自己的奴隶出租到首都工作。两位专员和城市的一些劳工监工也加入了这一行列。⁴⁶\n\
  \n对于被奴役的劳工而言，被出租在一个原本严密的体系中提供了一丝自由。他们通常被雇佣较长时间——数月甚至一整年——这要求他们在城里寻找住所。尽管工作条件艰苦，但他们远离主人及其爪牙的压迫性监视，并与自由劳工一起工作。离开种植园工作的前景对一些被奴役者来说极具诱惑力，他们逃往城市。马里兰州的一个奴隶主家庭刊登广告寻找两名奴隶——克莱姆和威尔，“他们最后一次被看到是带着宽斧和其他工具前往华盛顿市。”克莱姆和威尔，如同他们那个时代以及未来几代中的许多黑人一样，可能将华盛顿视为更接近自由的一步。⁴⁷\n\
  \n对于白人劳工而言，在首都转向以奴隶制作为劳动力来源是一场经济灾难。奴隶制削弱了自由工人用来争取更高工资的经济杠杆。正如专员们深知的那样，被奴役的劳动力为白人工人提供了“非常有用的制约”——当雇主可以从附近的种植园雇佣极其廉价的替代者时，就很难争取更高的工资或更好的工作条件。\n\
  \n一旦奴隶制成为常见的劳动力来源，它就创造了一个自我延续的经济循环，压低工资并阻碍白人移民到该地区。最初，由于项目未经证实且预算有限，城市领导人难以招募足够的自由劳动力来完成工作。有限的劳动力供应推高了工资，使得使用被奴役的工人在经济上更为便捷和诱人。随着奴隶在首都建设中扮演更大角色，这座城市对白人工人变得更具吸引力。知道雇主可以雇佣奴隶竞争者，白人工人不得不接受比他们原本可能容忍的更低的工资和更恶劣的工作条件。这些条件反过来使得招募白人劳工更加困难，因为潜在的移民避开华盛顿，转而前往北方城市，在那里他们不必与奴隶劳动力竞争。\n\
  \n尽管缺乏筹码，华盛顿的白人工人经常抵制专员们压低工资的努力。有时，他们的抱怨暴露了对黑人同事的怨恨。1794 年，在总统府工作的白人石匠要求只允许他们招收白人学徒；专员们默许了。三年后，一群白人工人抱怨公共工程中的被奴役工人工资过高；作为回应，专员们暂时禁止黑人木匠在国会大厦或总统府工作。⁴⁸\n\
  \n但这种集体禁止雇佣被奴役和自由黑人的努力，最终在经济激励的暗礁上搁浅。对专员们而言，黑人的存在使他们能够以远低于其他方式的速度和成本建造城市，他们不会放弃这一宝贵的选择。由于奴隶制迅速成为一种常用的劳动力来源，种族分裂深深嵌入新首都的结构之中。国会决定将城市建在波托马克河畔，华盛顿总统选择了一个包含亚历山大市和乔治敦市的选址，任命三位奴隶主为城市首批专员，专员们转向使用奴隶劳动力——所有这些都导致该地区成为一个严重依赖奴隶制的城市。\n\
  \n\n\n\n到 1800 年 11 月联邦政府正式迁往华盛顿时，该市人口已激增至一万四千人，其中包括三千多名被奴役的居民。仅在华盛顿市本身（不包括乔治敦、亚历山大或未合并的县区），被奴役人口就占总人口的\
  \ 25%以上。大量黑人——无论被奴役还是自由——的存在，塑造了这座新城市的轮廓。\n\n### *“自由民族怀抱中的奴隶集合”：华盛顿居民挑战无代表权的纳税*\n\
  \n尽管关于其潜力的鼓吹言论不绝于耳，但当国家政府迁入时，华盛顿仍是一个乡村落后地区。已竣工的总统府和国会大厦北翼让人一窥未来的宏伟，但周边地区仍未开发。“我徒劳地寻找城市，却看不到房屋，”来自费城的新婚女子玛格丽特·贝亚德·史密斯哀叹道，她的丈夫塞缪尔创办了该市最著名的报纸《国家情报员》。朗方原本打算让华盛顿成为一座“宏伟距离之城”，但在机械化交通尚未出现的时代，他的规划使这个地方变得极其不便。异常宽阔的林荫大道“从未修缮；深深的车辙、岩石和树桩时刻阻碍你的前行，并时常威胁你的四肢脱臼，”一位英国访客抱怨道。⁴⁹\n\
  \n这座城市不仅在物理上未开发，在政治上也是如此。作为国会规划与控制的实验品，华盛顿背负着模糊的政治地位和不确定的经济前景。尽管被吹捧为“自由的堡垒”，它却极其不民主。与美国其他地区一样，绝大多数人口——女性、穷人以及有色人种（无论被奴役还是自由）——被系统性地排除在公共生活和城市决策之外。但华盛顿的特殊之处在于，穷人与城市精英共享了被剥夺选举权的命运。几乎——但并非完全——从建城之初起，华盛顿特区就被剥夺了基本的民主权利。\n\
  \n在华盛顿建设期间，国会要求居民遵守割让土地的各州法律。在波托马克河东岸，他们受马里兰州法律管辖；而在西岸，则受弗吉尼亚州法律管辖。宪法赋予国会在联邦区内“行使专属立法权”的权力，但国会中很少有人会预料到，国家首都的公民将被剥夺州居民的权利和特权。詹姆斯·麦迪逊在《联邦党人文集》中辩称，为特区割让土地的州将保障城市居民的权利，并且“出于地方目的、由他们自己的选举产生的市政立法机构，当然会被允许给他们。”像诺特利·扬这样的白人男性地主，直到\
  \ 1800 年 11 月仍能在地方、州和全国选举中投票。在 1800 年的总统选举中，扬和其他符合条件的华盛顿市居民跋涉到马里兰州的布莱登斯堡，与其他自由美国选民一起投票。⁵⁰\n\
  \n这种情况很快将改变。\n\n1800 年的选举使托马斯·杰斐逊及其共和党盟友上台，标志着联邦党人统治的终结。从一个政党到其反对党的和平过渡被恰当地誉为美国政治的一项标志性成就，但这次选举对特区的民主造成了沉重代价。在选举与杰斐逊就职之间的几个月里，国会中的跛脚鸭联邦党人匆忙行动，试图在他们的小政府共和党对手接管之前，尽可能多地将权力集中到联邦政府手中。两党在过去十年中一直就宪法所列许多权力的范围争论不休。最后一场战斗迫在眉睫：如何处理哥伦比亚特区。\n\
  \n联邦党人尽可能宽泛地解释“行使专属立法权”条款，以推进他们集中联邦权力的更大议程。1800 年 12 月，弗吉尼亚联邦党人亨利·李提出的一项初步法案，实质上授权国会充当联邦城市的当地立法机构。虽然乔治敦和亚历山大将保留其市政府，但华盛顿市的居民将没有任何市政府，且特区居民不得在全国或联邦选举中投票。⁵¹\n\
  \n随着联邦党人法案的消息传开——塞缪尔·哈里森·史密斯的新《国家情报员》报纸每天向居民报道国会活动——忧心忡忡的白人华盛顿居民强烈反对。该市白人社区的大部分人支持国会继续控制特区。一份由包括诺特利·扬和詹姆斯·霍班在内的两百多名居民签署的请愿书，呼吁国会“承担该领土的管辖权”，并制定“一套治理该领土的法律”。他们不希望特区继续处于马里兰州或弗吉尼亚州的管辖之下，担心如果国会不接管控制权，华盛顿可能会失去作为政府所在地的地位——仍有不少国会议员，尤其是来自宾夕法尼亚州的议员，希望将首都吸引回北方。⁵²\n\
  \n然而，城市居民拒绝承认国会控制意味着他们丧失自治和选举权。也许最热忱的自治倡导者是一位来自纽约的二十六岁年轻人，名叫奥古斯都·布雷沃特·伍德沃德。伍德沃德后来前往西部，作为密歇根州第一任首席大法官和密歇根大学的创始人之一而获得持久声誉，他是一个令人难忘的人物。四肢细长，鼻子突出，举止古怪，这在崇拜者眼中是才华的标志，在批评者眼中则是自负的证据。伍德沃德以律师为业，但性情上是个空想家，他撰写了一系列八篇论文，从\
  \ 1800 年底开始出现在《国家情报员》上，当时国会首次辩论如何治理特区。⁵³\n\n伍德沃德的文章对国会充当城市地方立法机构的设想充满了愤慨。“没有比将*大事*与*小事*混为一谈更糟糕的政策了，”他辩称。“后者会被前者吸收；被忽视和遗忘。”他担心国会太容易被国家事务分心，以至于无法“适当关注一个城镇、一个城市或一个特区的细微需求。”国会控制不仅对特区不利；它还会“损害”联邦当局的*尊严*，“使其忙于哥伦比亚特区的所有地方事务。”伍德沃德细致入微地阐述了特区如何在国会管辖下保持联邦城市地位，同时享有自治和在国会中的代表权。⁵⁴\n\
  \n国会中的联邦党人无视这种细微差别。在关于特区的辩论因一场全国选举危机而中断（该危机耗费了国会一个月的时间）之后，国会于 1801 年 2 月下旬匆忙通过了《组织法》，证明了伍德沃德关于地方事务经常被国家事务压倒的观点是正确的。该法案将特区的三个发达地区——华盛顿市、乔治敦和亚历山大——置于国会和总统的独家控制之下，从而巩固了国会对首都的控制。它将特区内未合并的领土划分为两个县：华盛顿县（马里兰州一侧）和亚历山大县（弗吉尼亚州一侧）。\n\
  \n\n\n\n这些地区的居民不再被视为马里兰州或弗吉尼亚州的公民；他们不能再投票选举总统；也不能再帮助选择国会议员。相反，他们成了被剥夺选举权的联邦臣民。或者，正如特拉华州众议员詹姆斯·阿什顿·贝亚德善意解释的那样，华盛顿特区的居民“是孩子，我们不想对他们施以暴政，而是希望抚养和培育他们。”⁵⁵\
  \ 就在“无代表不纳税”成为独立战争口号的一代人之后，特区居民失去了在所有选举中的投票权。他们的权利为了更大的国家议程而被牺牲，这并非最后一次。\n\n地方自治倡导者的持续抱怨促使新成立的共和党国会合并华盛顿市，并建立一个由总统任命市长和选举产生的市议会组成的市政府。（乔治城和亚历山大保留了各自的市政府。）这种有限的地方自治允许该市少量的白人男性土地所有者投票，在\
  \ 1802 年的选举中，约有 90%的人投了票。鉴于投票限制，23 名候选人的名单只有 233 张选票。尽管做出了让步，联邦政府仍然牢牢控制着特区。不仅总统任命市长，而且国会对任何地方立法都保留否决权。由于自治能力受到如此限制，特区居民“只能把自己看作自由民族怀抱中的一群奴隶”，伍德沃德愤怒地说。⁵⁶\n\
  \n政治民主的消亡——即使是特区高度受限的民主——将困扰这座城市。即使是最精英的华盛顿人，也只能作为恳求者，可以请愿、抗议和恳求国会的支持和批准，但他们无法让他们的政治赞助人负责。在该市作为国家首都诞生后的几个月内，甚至不到独立战争后的一代人，特区居民被剥夺选举权就被编入了联邦法律。两个多世纪后，这种政治上的无力依然存在。\n\
  \n缺乏真正的自治或在国家立法机构中的代表权，不仅意味着特区居民缺乏基本权利，而且意味着这座城市不可避免地会成为联邦权力斗争中的棋子，以及国会实验的实验室。由于能够直接控制华盛顿却不对其公民负责，国会和个别立法者可以在该市的地方事务上施加比在其他地方大得多的影响。正如联邦党人利用特区不确定的政治地位来推进他们关于联邦权力的更大议程一样，国会议员们经常利用地方问题来追求国家目标。这种“*大事*和*小事*”的混合将对未来长期实现种族平等的努力产生深远影响——尽管不总是负面的。\n\
  \n### *“大多数居民是低等人……或黑人”*：早期华盛顿的工人，被奴役者和自由人\n\n对于该市的大多数居民来说，缺乏政治代表权几乎不值得注意或并不罕见。大多数华盛顿人既不像奥古斯都·B·伍德沃德那样受过教育，也不像诺特利·扬那样拥有土地；相反，他们贫穷、未受教育且没有土地。正如财政部长奥利弗·沃尔科特抱怨的那样：“大多数居民是低等人，他们的外表表明邪恶和放纵，或者是黑人。”⁵⁷\n\
  \n沃尔科特部长可能暴露了他那个阶层的傲慢，但他说的有道理：该市的大多数居民是低收入体力劳动者或家庭佣工。由于这座城市似乎处于永久的建设状态，它主要吸引的白人是那些必须与被奴役和自由的黑人工人一起工作并与之竞争的劳动者。在\
  \ 1800 年人口普查中确定了职业的白人男性中，75%是劳动者，而只有不到 8%是专业人士或“绅士”。该市 4000 名白人男性中只有 233 人拥有价值 100\
  \ 美元或以上的不动产。⁵⁸\n\n该市的许多白人工人是爱尔兰人——据一位早期观察者称，约占该市白人人口的一半。尽管这一估计被夸大了，但爱尔兰工人和工匠（通常被称为“技工”）是这座不断发展的城市的重要组成部分，并将在其种族历史中发挥重要作用。美国摆脱了殖民统治，而\
  \ 18 世纪末的爱尔兰仍处于英国控制之下。美国独立战争激励了许多爱尔兰人逃离故土，到大西洋彼岸寻找机会。正如一位乐观的爱尔兰商人在他店外的招牌上宣称的那样：“彼得·罗杰斯，马具匠，来自爱尔兰的绿色田野和暴政，来到华盛顿的绿色街道和自由。”⁵⁹\n\
  \n第一批爱尔兰移民于 18 世纪 80 年代抵达后来成为华盛顿的地方。像许多非熟练的白人移民一样，他们是契约劳工——他们欠帕托马克公司一段服务期，该公司支付了他们前往美国的旅费。大约\
  \ 200 名爱尔兰工人帮助在乔治城以北的波托马克河大瀑布周围挖掘了一条运河。与后来的爱尔兰移民不同，许多早期爱尔兰人来到美国时几乎不懂英语——爱尔兰盖尔语是他们的母语，他们只能结结巴巴地学习英语。他们受到其他白人，特别是英国人和苏格兰人的严重歧视，这些人对旧世界的邻居怀有传统的敌意，而且像其他白人工人一样，他们受到城市精英的鄙视。“下层白人在智力上比黑人低一个等级，在礼貌上比黑人低十个等级，”第一夫人阿比盖尔·亚当斯嗤之以鼻。“他们看起来像是人性的渣滓。”⁶⁰\n\
  \n白人工人努力在一个奴隶制盛行的城市中获得经济立足点。尽管随着时间的推移，这座城市以其强大的自由黑人社区而闻名，但在 1800 年，华盛顿近 85%的黑人居民是被奴役的。大多数人生活在拥有少数被奴役者的家庭中；只有十个家庭，包括诺特利·扬的家庭，拥有十个或更多。被奴役的女性（1800\
  \ 年她们的人数比男性多出三比二）主要担任家庭佣工，在白人家庭中做饭、打扫和抚养孩子，而被奴役的男性则从事各种工作，从体力劳动到家庭服务。由于该市的许多奴隶主与附近的种植园有联系，奴隶（尤其是男性）经常根据季节性工作需要往返于城市和乡村之间。⁶¹\n\
  \n华盛顿在白人中形成了相对温和的奴役地点的声誉。英国人约翰·托尔伯特写道，在华盛顿特区，“这个不幸的阶级受到比大多数蓄奴州更人道的待遇。”爱尔兰作家 D·B·沃登声称，大多数华盛顿奴隶“衣着良好，营养充足。”白人奴隶主常常以善待奴隶而自豪。“我发现，为了得到良好的服务，没有必要对这些人大声呵斥，”城外一个种植园的女主人罗莎莉·斯蒂尔·卡尔弗特建议道。“你只需要坚定。”⁶²\n\
  \n\n\n\n尽管这种名声带有自我服务的色彩，但在相对意义上却是事实。与乡村种植园的生活相比，首都的奴隶制确实为被奴役者提供了更多机会。在偏远的种植园里，奴隶主几乎拥有独裁权力，可以随心所欲地对待奴隶；而在城市里，他们必须服从地方当局，以及邻居舆论施加的不成文压力。城市环境让被奴役者有机会在主人视线之外度过时光，并且常常与自由黑人相伴。由于城市居民通常不自己生产大部分食物、工具或衣物，他们会在城市市场（如第七街与西北宾夕法尼亚大道交汇处的中心市场）购买所需物品。这项任务通常落在被奴役的女性身上，她们利用去市场的时间探访朋友和家人。城市家庭通常让奴隶干的活更少，因此主人会将他们的奴隶出租给该地区的其他家庭。这些被奴役者往往可以独立生活，许多人住在西北\
  \ F 街沿线以及西北第十街圣帕特里克教堂后面的小房子里。⁶³\n\n查尔斯·鲍尔亲身经历过，在华盛顿当奴隶可能远比在乡下生活好得多。鲍尔出生在马里兰州卡尔弗特县的一个种植园里，生而为奴，母亲被卖掉后，绝望的父亲逃往北方，他由祖父抚养长大。在一个吝啬残酷的主人手下劳作时，他和同伴们“因缺乏充足且合适的食物而饱受折磨”，并且“因寒冷而苦不堪言”。他的主人把他租出去，在停泊于华盛顿海军造船厂的一艘军舰上做厨师，这对二十岁的鲍尔来说是一次大开眼界的经历。⁶⁴\n\
  \n“享受着丰盛的美食，我感到非常幸福，”他后来在 1837 年的回忆录《一个黑人查尔斯·鲍尔的冒险故事》中写道。船上的军官给了他衣服和钱，“我的职责虽然持续不断，但并不繁重。”他被允许“以自己喜欢的方式度过周日下午”，于是鲍尔漫步在城市的街道上，常常一直走到乔治敦，去看“那些崭新而宏伟的建筑”。在城里的两年间，鲍尔与许多其他黑人（包括被奴役者和自由人）交往。他注意到，城里的奴隶往往比种植园里的奴隶受到更好的待遇，因为出于“羞耻感或自豪感”，奴隶主在知道自己的行为会受到那些他们希望保持好感的人观察时，会“勉强给他们的奴隶提供足够的食物和衣服”。⁶⁵\n\
  \n然而，尽管有相对的机会，华盛顿的奴隶制仍然是一种严酷的制度，受经济考量驱动，并以暴力为后盾。这种制度对被奴役的家庭尤其具有破坏性。奴隶主经常将丈夫与妻子、父母与孩子分开，以最大限度地提高工人的效率和企业的盈利能力。主人经常将奴隶从城市的一处房产转移到乡下的另一处，在此过程中拆散家庭。如果主人的经济状况发生变化或奴隶价格上涨，他们可能会决定卖掉自己的财产。种植园女主人罗莎莉·斯蒂尔·卡尔弗特曾吹嘘自己对待奴隶并不严苛，但她经常讨论卖掉他们。“我们卖掉了你的女仆露西……卖了\
  \ 225 美元，”她在十月的一封信中随意地告诉父母。奴隶贸易在华盛顿十分兴盛。查尔斯·鲍尔“经常看到大群和我同肤色的人被长长的锁链拴在一起，驱赶着向南行进”。⁶⁶\n\
  \n逃跑很困难。“很少听说有色人种逃跑并完全摆脱主人的事，”鲍尔指出。尽管如此，在遇到一位自由黑人水手，听到他对费城自由生活的描述“让我心驰神往”后，鲍尔开始策划逃跑。然而，在他能逃走之前，他的主人出现在海军造船厂，告诉他已经被卖掉了。鲍尔回到了种植园生活并结了婚。但第二个孩子出生后不久，他经历了奴隶最可怕的噩梦——主人把他从家人身边卖掉了。“我的心在体内死去，”他回忆道，当时他被锁上颈枷，与另外五十一名奴隶锁在一起，被迫步行近五百英里，前往南卡罗来纳州哥伦比亚的一个拍卖台。（鲍尔最终逃脱，步行回到马里兰的家人身边，在那里作为逃亡者生活到\
  \ 1830 年。再次被抓获并送回奴隶制后，他再次逃脱并逃往宾夕法尼亚。）⁶⁷\n\n![Image](img/f0001-04.jpg)\n\n*“经过国会大厦的奴隶队列。”1814\
  \ 年 8 月国会大厦被英军烧毁前，被奴役的男子戴着手铐脚镣走在国会大厦前。奴隶制从建国之初就根植于国家首都。国会图书馆。*\n\n尽管成功概率很低且被捕后果严重，被奴役者仍反复尝试从华盛顿逃跑或逃往华盛顿。几乎从创刊之日起，《国家情报报》就刊登悬赏追捕逃亡者的广告。第一则广告出现在\
  \ 1800 年 12 月，寻找一个具有讽刺意味的名字“黑人菲德利奥，城里人都认识他”，据信他“潜伏”在妻子居住的种植园附近。“潜伏”是一个专门术语，用来描述那些试图消失在城市中并冒充自由身份的逃亡奴隶，这让奴隶主们束手无策。⁶⁸\n\
  \n该报还刊登了哥伦比亚特区执法官发布的通告，他经常抓获疑似逃亡者并将其关进当地监狱，同时报纸也列出了待售的奴隶。前纽约州众议员、后来成为华盛顿市长的约翰·彼得·范内斯刊登广告“出售一名黑人男孩”，向顾客保证这个十三四岁的男孩“健康、能干、诚实、强壮”。⁶⁹\n\
  \n一些被奴役者，尤其是女性，转向华盛顿的法院寻求救济。她们主动聘请白人律师，提起“自由诉讼”和“自由请愿”，要求获得解放。她们对自己所处的环境了如指掌，精心选择诉讼时机，以利用法律、政治或家庭状况的变化。米娜·奎因就是采取法律行动的被奴役者之一。奎因出身于一个由自由人和被奴役的马里兰人组成的大家庭，她聘请了律师弗朗西斯·斯科特·基，并于\
  \ 1810 年 1 月提起诉讼。（基是乔治敦居民，也是马里兰州国会议员菲利普·巴顿·基的侄子，后者曾在 1790 年代代表奎因家族成员出庭；“弗兰克”基当时尚未因创作《星条旗》而闻名。）⁷⁰\n\
  \n奎因声称她的曾祖母玛丽·奎因是一名自由女性，因此她依法有权获得自由。由于缺乏这一主张的文件证明，她转而依靠家族口述历史，证明自己出身于自由祖先。她的主人、华盛顿县种植园主约翰·赫本反驳说，玛丽·奎因一生都是奴隶。在引人注目的审判中，基传唤了自由出生的黑人西蒙·奎因，让他作证指控一名“自由基督徒白人”。尽管辩方反对，法庭仍允许他作证。然而，陪审团做出了不利于米娜·奎因的裁决。⁷¹\n\
  \n\n\n\n女王提起了上诉。她的案件——*女王诉赫本案*——最终于 1813 年提交至最高法院，但大法官们对奴隶制下的民众给予了双重打击。首席大法官约翰·马歇尔代表多数意见撰写了判决书，驳回了使用传闻证词来确定个人法律地位的做法，裁定在法律上，被奴役者被视为财产。马歇尔辩称，如果法院允许此类传闻证据，“任何人的财产都无法感到安全。”大法官加布里埃尔·杜瓦尔发表了简短但有力的异议。“有色人种，由于其在主人不受约束的权威下的无助处境，有权获得一切合理的保护，”杜瓦尔写道。“裁定此类案件中不得采纳传闻证据，将从根本上切断所有此类主张，并使其彻底终结，除非该主张源于近期发生的事实，而这种情况很少发生，或许永远不会发生。”⁷²\n\
  \n*女王案*的裁决，如同法院 1857 年臭名昭著的*德雷德·斯科特案*判决一样，削弱了被奴役者通过法院获得自由的能力。但华盛顿的被奴役者并未放弃斗争。他们一直寻求法律途径争取自由，直至内战爆发。从\
  \ 1800 年到 1862 年，大约有五百名被奴役者在哥伦比亚特区提起了自由诉讼。\n\n被奴役者追求自由的另一种方式是通过自我赎买。出于经济、家庭或道德原因，奴隶主有时会同意让奴隶赚钱攒钱以购买自由；其他时候，奴隶不得不秘密积累资金，并利用白人中间人进行购买。姐妹俩阿莱西娅·布朗宁·坦纳和索菲娅·布朗宁·贝尔使用了这两种方法获得了自由。她们出生在马里兰州乔治王子县帕塔克森特河沿岸的一个种植园，作为被奴役者，这两位富有创业精神和决心的姐妹抓住了新兴首都的机会，逃离了烟草田里艰苦的户外劳动以及种植园“大宅”里情感和体力上都令人疲惫的室内工作。⁷³\n\
  \n索菲娅开垦了一小块菜园，每天带着蔬菜到华盛顿市的市场出售。在女主人不知情的情况下，她开始存下一部分收入。她最终积攒了 400 美元（相当于 21 世纪的约\
  \ 7800 美元），并委托当地一位卫理公会牧师为她购买丈夫乔治·贝尔的自由，乔治·贝尔住在附近的种植园。乔治·贝尔后来买回了妻子和两个儿子的自由，这两个儿子是在“逃亡”期间被买下的——他们逃离了种植园，并在主人同意出售时仍处于在逃状态。贝尔一家搬进了城市，成为华盛顿自由黑人社区的领袖。⁷⁴\n\
  \n阿莱西娅同样将食物转化为自由。在主人的许可下，她在“总统广场”（今天的拉斐特广场）附近经营一个农产品摊位，托马斯·杰斐逊总统也是她的顾客之一。到 1810\
  \ 年，她已悄悄攒下超过 1400 美元（相当于 21 世纪的约 28000 美元），并通过一位白人中间人买下了自己的自由。由于没有自己的孩子——她的丈夫早逝，她从未再婚，尽管她保留了婚后的姓氏“坦纳”——她专注于解放自己的大家庭，后来又解放了亲密的朋友。她继续经营着利润丰厚的生意长达三十年，赚够了钱为另外二十五人赎身，其中包括她十六岁的侄子约翰·库克，他后来成为一位先驱教育家和牧师。坦纳一生都活跃在社区中，并在西北区第十四街和\
  \ H 街拥有一处被观察者称为“漂亮房产”的住所，距离白宫两个街区。⁷⁵\n\n布朗宁姐妹加入了华盛顿一个虽小但不断壮大的自由黑人社区。随着该地区烟草业的衰落以及城市对奴隶需求的减少，越来越多的被奴役者要么购买了自己的自由，要么被主人解放。在\
  \ 19 世纪最初的几十年里，自由黑人的数量增长远快于被奴役人口。华盛顿市在本世纪初有四百名自由黑人，几乎是该市合格选民人数的两倍。十年之内，这个数字几乎翻了两番，自由黑人占黑人人口的\
  \ 30%以上。大多数自由黑人与被奴役的同胞保持着密切联系。尽管他们的法律地位截然不同，自由黑人和被奴役黑人在城市中并未过着彼此隔离的生活。他们通过家庭——许多自由黑人有配偶、兄弟姐妹、父母甚至子女仍处于被奴役状态——以及通过教堂和其他社区机构联系在一起。⁷⁶\n\
  \n自由黑人移民被工作机会以及这座城市相对开放和宽容的特性所吸引。作为国家首都，华盛顿成为国内外政府官员的多元人口聚居地。北方人和外国人经常评论华盛顿看起来多么“南方化”，但这座城市的国际化使命缓和了黑人在其他南方城市所经历的一些严酷，自由黑人在此拥有比南方其他地方更多的行动自由。\n\
  \n自由黑人社区的首要任务之一是教育。由于被剥夺了进入该市于 1804 年建立的公立白人“贫民”学校的机会，华盛顿的黑人转而依靠少数几所由自由黑人和白人捐助者支持的私立学校。1807\
  \ 年，索菲娅·布朗宁·贝尔的丈夫乔治与同为前奴隶的摩西·利物浦和尼古拉斯·富兰克林——他们都是文盲——在东南区第二街和 D 街建立了贝尔学校，这是第一所向黑人儿童（无论自由还是被奴役）开放的学校。\n\
  \n在接下来的几年里，出现了几所小型学校，其中包括安妮·玛丽·霍尔创办的一所，她是乔治王子县人，成为该市第一位黑人教师。一位名叫玛丽·比林斯的英国寡妇开始允许黑人儿童与白人儿童一起上她的课。在白人家长抱怨后，比林斯干脆在乔治敦为黑人儿童建立了一所新学校。1820\
  \ 年，比林斯的一名学生，一位非凡的十五岁黑人女孩玛丽亚·贝克拉夫特，开办了自己的女子学校。后来它成为一所寄宿学校，贝克拉夫特继续领导乔治敦圣三一教堂的女子神学院。⁷⁷\n\
  \n表 1 华盛顿的黑人人口，1800–1830 年\n\n![Image](img/t0001-01.jpg)\n\n最初，这些学校同时面向被奴役和自由的儿童。然而，尽管华盛顿没有法律禁止教育奴隶，白人的压力迫使学校只专注于自由儿童。教育的解放潜力——以及定期与自由同学互动的机会——对既定秩序构成了太大的威胁。\n\
  \n\n\n在 19 世纪早期，针对黑人儿童的学校并非唯一被视为威胁的事物。自由黑人社区的壮大、奴隶与自由黑人的混杂、以及自治黑人机构的建立——这一切都在许多华盛顿白人居民中引发了恐惧。城市领导人利用法律来约束“奴隶、自由黑人和混血儿”（混血种族背景的人）。1808\
  \ 年，在国会的默许下，市议会通过了第一部黑人法典，补充了仍在哥伦比亚特区生效的马里兰州和弗吉尼亚州的奴隶法，并于 1812 年对其进行了扩展。该法典要求自由黑人向城市登记处提供“令人满意的证据”证明其自由身份；禁止黑人“以混乱或骚乱的方式”聚集；并对所有黑人（包括自由人和奴隶）实施宵禁（春季和夏季为晚上\
  \ 10 点，秋季和冬季为晚上 9 点）。违反法典的奴隶将面临最多 39 鞭的鞭刑，而自由黑人则可能被监禁或罚款 20 美元。⁷⁸\n\n这些黑人法典揭示了华盛顿白人生活中根深蒂固的种族恐惧。尽管这座城市以对黑人相对宽容而闻名，但华盛顿在建立之初就是一个充满种族紧张的城市。白人工人对黑人竞争感到不满，自由黑人紧抓任何一丝机会，白人领导人拼命想要发展和保护这座城市，奴隶们则在寻找自由——所有这些群体都在华盛顿的街道上不安地混杂在一起。种族紧张情绪在新首都的表面之下暗流涌动，以至于在\
  \ 1812 年战争爆发两年后，玛格丽特·贝亚德·史密斯更担心的不是英国对城市的攻击，而是“家中的敌人”——奴隶——可能利用战争作为借口发动叛乱。⁷⁹\n\n\
  国家的首都不仅部分由奴隶建造，而且它建立在诺特利·杨种植园上已经形成的完整奴隶社会之上。到 1802 年杨去世、他的女婿接任华盛顿首任市长时，杨曾经的种植园上已经遍布着不断发展的首都的街道、住宅和教堂——这座城市无法摆脱奴隶制的持久印记。\n\
  \n# 三\n\n## 我们对自由和平等的吹嘘不过是嘲弄\n\n### *直面国家首都的矛盾，1815–1836 年*\n\n现金收购 500 名黑人\n\n\
  包括男女，年龄 12 至 25 岁。拥有可能出售的仆从的人，联系我们将会发现有利可图，因为我们将以现金支付比当前或将来进入本市场的任何其他买家更高的价格。\n\n\
  *富兰克林与阿姆菲尔德*\n\n*亚历山大*\n\n——摘自《国家情报报》1835 年广告\n\n今天，位于亚历山大公爵街 1315 号的那栋狭窄的铅灰色建筑与周围环境并无太大区别。夹在两栋红砖建筑之间，这座不起眼的建筑很容易被误认为是老城亚历山大的又一家古雅商店，其高大的红门和玻璃煤气灯散发着旧式魅力。但在\
  \ 19 世纪 20 年代和 30 年代，这块哥伦比亚特区的房地产——亚历山大在 1846 年之前一直是特区的一部分——吸引了全国奴隶主和废奴主义者的注意。这里是富兰克林与阿姆菲尔德的总部，该公司是美国最大、利润最高的奴隶贸易公司。该公司拥有整个街区，三层楼高的公爵街办公室是这一庞大运营的神经中枢，每年出售超过一千名奴隶。\n\
  \n19 世纪 30 年代的访客当然不会认错这个地方。来自新英格兰、耶鲁大学毕业的拉丁语教授伊桑·艾伦·安德鲁斯在 1835 年访问富兰克林与阿姆菲尔德总部时写道：“当你走近它时，很容易就能辨认出来，因为院子周围有高高的粉刷墙……使它看起来像一座监狱。”这确实是一座监狱，是来自华盛顿地区各地的奴隶在被送往“下游”的新奥尔良和密西西比州纳奇兹的奴隶市场之前的临时关押地。¹\n\
  \n这个街区长的建筑群包括一家裁缝店、一间厨房和一个小型医院，还有营房，多达 150 名奴隶在那里过夜，被锁链拴在一起，睡在泥地上。少数武装白人看守着这些囚犯，他们白天不受束缚，但按性别分隔在两个院子里。奴隶们焦急地等待着南下的旅程，要么乘坐富兰克林与阿姆菲尔德定制的船只走水路，要么戴着镣铐徒步走陆路。\n\
  \n用一位英国访客的话来说，奴隶贩子通常被认为是“卑鄙、无知且粗俗的”，但艾萨克·富兰克林和约翰·阿姆菲尔德却塑造了一种绅士形象。阿姆菲尔德曾是北卡罗来纳州的马车夫，娶了富兰克林的侄女，他负责管理亚历山大办公室，而富兰克林则监督公司在密西西比州的业务。他们建立了一个创新的运营模式，充分利用了与新兴市场革命相关的商业进步。该公司全年投放广告以创造需求，购买自己的船只将产品运往南方市场，为顾客提供可靠的“定期”服务——每月\
  \ 1 日和 15 日有船只南下，并采用最新的会计技术来追踪利润。²\n\n由于对良好公关力量有着现代的理解，阿姆菲尔德用葡萄酒和点心欢迎访客，并慷慨地提供公爵街场地的参观服务。该公司以“一流船只”的承诺和对财产健康与福利的精心关注来吸引精明的奴隶买家。知道吃得好、穿得好的奴隶在拍卖台上能卖出更高的价格，公司给每个奴隶两套衣服用于南下之旅，并努力保持他们的动产相对健康。³\n\
  \n他们的方法极为成功。富兰克林与阿姆菲尔德占据了绝佳位置，能够利用美国奴隶制从上南方贫瘠的土地向下南方繁荣田野的转移。当弗吉尼亚、马里兰和特拉华的奴隶主出售种植园或转向劳动密集度较低的作物时，他们求助于富兰克林与阿姆菲尔德以及特区的其他奴隶贩子，以处理他们认为多余的财产——用\
  \ 1841 年访问华盛顿的英国废奴主义者约瑟夫·斯特奇的话来说，就是他们的“人肉作物”。⁴\n\n这是一项利润丰厚的生意。阿姆菲尔德宣称，在 19 世纪 30\
  \ 年代，奴隶的价格“*高得离谱*”，而且在整个深南方都有需求——他指出，儿童在卡罗来纳尤其畅销。到 1835 年富兰克林退休回到田纳西州的种植园时，据称他已是一位百万富翁，而阿姆菲尔德的财富估计为\
  \ 50 万美元（按 21 世纪美元计算，约合 6 亿美元）。富兰克林与阿姆菲尔德是整个南方最大的企业之一，仅次于最大的糖料或棉花种植园。该公司的成功帮助将特区变成了斯特奇所称的“美国奴隶贸易的主要中心”。事实上，在\
  \ 19 世纪 30 年代，国家首都是美国最大的奴隶贸易城市，仅亚历山大一地就有四家主要的奴隶贸易公司。⁵\n\n\n\n\n富兰克林与阿姆菲尔德在杜克街的奴隶围场揭示了美国首都如何从蓬勃发展的国内奴隶贸易中获利。1812\
  \ 年战争后的几十年里，华盛顿的奴隶制和奴隶贸易招致了国内外批评，因为废奴运动将矛头指向了哥伦比亚特区。尽管有些人坚持认为华盛顿应保持“国家冲突与对立派系之间的中立地带”，但制度的捍卫者和批评者都不同意这一观点。⁶\n\
  \n对于南卡罗来纳州参议员约翰·C·卡尔霍恩等南方奴隶主来说，华盛顿是南方的温泉关，是其“最薄弱环节”，南方领袖必须集中精力于此——如果哥伦比亚特区落入废奴主义之手，那么整个南方也将随之沦陷。而对于废奴主义者而言，用威廉·劳埃德·加里森的话说，华盛顿是“必须攻下的第一座堡垒”，以结束全国范围内的奴隶制。随着\
  \ 19 世纪 30 年代废奴主义成为美国政治中的一股全国性力量，关于奴隶制的全国性斗争在很大程度上围绕国家首都展开，当地的黑人和白人废奴主义者积极挑战城市内部的奴隶制。⁷\n\
  \n华盛顿之所以成为全国奴隶制斗争的战场，不仅因为它是政府所在地，还因为该市在政治上无能为力。在这个新兴共和国的首都，居民无法投票选举代表进入国会——而国会正是以这座城市为家——他们享有的自治权也十分有限。由于国会对市议会通过的任何立法拥有否决权，国家领导人可以（也确实）将华盛顿用作政治权力斗争中的棋子。\n\
  \n许多白人华盛顿居民因缺乏地方民主而感到愤怒，他们抗议要求扩大政治权利。19 世纪 20 年代见证了长期民主运动的开端，贫穷的白人男性争取投票权，乔治城和亚历山大的居民则试图恢复他们因家园成为国家首都而失去的政治权利。这些民主运动，加上在哥伦比亚特区废除奴隶制的地方和全国性努力，吓坏了精英阶层的华盛顿居民，并加剧了政治和种族紧张局势，最终在\
  \ 1835 年爆发。\n\n### “我不想去”：华盛顿反奴隶制运动的初次涌动\n\n直到 1815 年深秋，安·威廉姆斯一直过着相对平淡的生活。她出生在马里兰州布莱登斯堡的奴隶家庭，在奴隶制的束缚下为自己和家人争取到了一席之地。她嫁给了附近种植园的一个男人，夫妇俩生了两个女儿，之后她被卖给了丈夫的主人，一家人得以团聚在同一座种植园。当女儿们大约六岁和三岁时，主人去世了，威廉姆斯的命运发生了剧变。主人挥霍无度的儿子接管了庄园，并欠下巨额债务，开始变卖资产，包括他的奴隶。一天，当她的丈夫在种植园远处干活时，一个奴隶贩子出现，带走了威廉姆斯和她的女儿们。他押着她们步行到华盛顿，将她们关在\
  \ F 街乔治·米勒酒馆上方一个奴隶围场里的单独牢房中，同时他正在集结更多奴隶，准备组成一支南下的陆路奴隶队伍。⁸\n\n威廉姆斯和她的女儿们进入的这座城市，仍因毁灭性的\
  \ 1812 年战争而动荡不安。1814 年 8 月，身着红色军装的英国士兵攻入了防御薄弱的首都——此前美军在布莱登斯堡战役中惨败，使首都突然变得脆弱不堪；那场战役与其说是战斗，不如说是一次可耻的撤退，被媒体批评者戏称为“布莱登斯堡赛跑”。英军队伍中包括来自殖民地海军陆战队的士兵，这是一支全部由黑人组成的部队，约有两百名来自切萨皮克地区种植园的逃亡奴隶。这些人响应了英国海军中将亚历山大·科克伦的公告——任何支持英国人的奴隶都将获得自由；他们的部队表现出色，战后定居在加拿大和特立尼达。（英军中的黑人部队尤其激怒了弗朗西斯·斯科特·基，他是哥伦比亚特区的一名民兵军官，在布莱登斯堡战役中逃离。后来他在歌颂美国人在战争中的英勇时，在第三节中写道：“没有避难所能拯救雇佣兵和奴隶/逃离的恐惧或坟墓的阴霾。”如今很少有美国人会唱这首现在被称为《星条旗》的歌曲的这一部分。）⁹\n\
  \n英军试图通过焚烧美国首都来惩罚和羞辱这个新兴国家。他们点燃了总统府、闪闪发光的国会大厦以及几乎所有其他公共建筑——“城市火光冲天，天空被烈焰染红！”惊恐的玛格丽特·贝亚德·史密斯写道。美国人后来反击并击败了他们曾经的殖民统治者，但当安·威廉姆斯抵达华盛顿时，首都的重建工作才刚刚开始。和城市的大部分地区一样，国会大厦已成废墟，焦黑的残骸无法再用于公共用途。¹⁰\n\
  \n威廉姆斯和她的女儿们被卷入了日益增长的国内奴隶贸易的漩涡。尽管乔治·华盛顿和其他革命战争领袖曾期望奴隶制会随时间消亡，但伊莱·惠特尼在 1793 年发明的轧棉机重振了这一制度，并推动了全球纺织业的发展，导致对棉纤维的需求不断增长。奴隶制在南方腹地迅速扩张，而在马里兰州、弗吉尼亚州和上南方地区则逐渐衰落。宪法在\
  \ 1808 年禁止了非洲奴隶的进口，这意味着渴望奴隶劳动力的种植园主转而寻求国内来源。其结果是国内或内部奴隶贸易的兴起。\n\n奴隶贩子——华盛顿居民常称他们为“佐治亚人”——在上南方的田野中搜寻健康的奴隶，这些奴隶能在佐治亚州以及后来的阿拉巴马州和密西西比州繁荣的奴隶劳动营中卖出高价。“这里所有的奴隶都非常害怕被卖到佐治亚，他们认为这和他们被从故土撕裂一样糟糕，”一位白人观察者指出。到\
  \ 1815 年威廉姆斯被卖时，据弗朗西斯·斯科特·基称，每年在华盛顿有“数百名”奴隶被出售。¹¹\n\n当威廉姆斯在黎明前的黑暗中坐在牢房里时，她很可能在思考自己和女儿们面临的未来。经过数百英里的强行军，她们将被拍卖给出价最高的人——不是作为一个家庭，而是作为个体。她们将忍受无尽的劳作，在南方烈日下死亡的可能性很高，彼此分离，失去丈夫和父亲。“我不想去，”她后来回忆道。\n\
  \n威廉姆斯选择了一个既可怕又勇敢的选项。“一想到被迫离开她所熟悉的世界，她感到‘困惑和心烦意乱’，于是从三楼窗户跳到了下面的 F 街上。令人惊讶的是，她活了下来，但双臂骨折，脊柱下部碎裂。当她瘫倒在街上时，她的哭声惊醒了邻居，其中包括市长詹姆斯·布莱克——一位医生，他照料了她的伤势。¹²\n\
  \n\n\n\n威廉姆斯后来懊悔不已的绝望之举并未拯救她的家庭。那天早上，奴隶贩子发现她伤残后，便将她遗弃，带着她的女儿们和一群陌生奴隶踏上了漫长的南下之旅。酒馆老板乔治·米勒将她收为奴隶，她与他共同生活了近二十年。康复后，她与丈夫重聚，又生了四个孩子，但再也没见过那两个大女儿。\n\
  \n威廉姆斯并非那个冬天唯一采取极端手段抵抗被贩卖的奴隶。一位住在乔治敦弗朗西斯·斯科特·基家附近的 enslaved 妇女被奴隶贩子意外带走。基称她为“一向表现良好的忠实仆人”，她在前往威廉姆斯所在的乔治·米勒酒馆途中割断了自己的喉咙。她也活了下来，但到达酒馆时带着一道需要缝合的血淋淋的伤口。还有一位当地妇女，在得知自己被卖掉后，立即抓起一把切肉刀砍掉了自己的一只手，使自己在奴隶贩子眼中变得无法出售。¹³\n\
  \n![Image](img/f0001-05.jpg)\n*安·威廉姆斯为逃避被贩卖到南方，从三楼窗户跳下。她出现在杰西·托里 1817 年反奴隶制小册子《美国国内奴隶制写照》的封面上。国会图书馆。*\n\
  \n威廉姆斯的纵身一跃以及其他被奴役者的绝望抵抗，推动了华盛顿禁止奴隶贸易的漫长运动。1805 年，新泽西州众议员威廉·斯隆提出了一项解放哥伦比亚特区奴隶的法案。该法案以\
  \ 77 票对 31 票被彻底否决，南方州仅有一票赞成。此后，反对奴隶制的进展甚微。威廉姆斯摔落在 F 街几周后，她接受了杰西·托里的采访。托里是一位来自费城的\
  \ 28 岁白人医生，当时正作为反奴隶制巡回活动的一部分访问首都。她的故事令托里震惊。他后来在 1817 年那本言辞激烈的谴责奴隶制著作《美国国内奴隶制写照》的封面上，描绘了这位匿名的威廉姆斯跳窗的场景。托里的书是第一本将华盛顿直接置于美国日益壮大的废奴运动枪口下的反奴隶制小册子。同年晚些时候，俄亥俄州新出版的反奴隶制刊物《慈善家》也加入了托里的呼吁，要求废除哥伦比亚特区的奴隶制和奴隶贸易。¹⁴\n\
  \n托里对安·威廉姆斯的采访只是他在华盛顿期间经历的众多令人不安的事件之一。一天早上，当托里准备离开国会山附近的住所时，一个小男孩冲进门，结结巴巴地说：“那……那些佐治亚人赶着一群黑奴，两个两个锁在一起。”托里跟着男孩出去查看，远处他看到“一辆轻便篷车，后面跟着一队男人、女人和孩子，像送葬的队伍。”那些被奴役的人成对绑着绳索和铁链，在国会大厦的视线范围内行走，托里赶上了他们。他惊恐地站在宾夕法尼亚大道上，看着两个奴隶贩子驱赶着阴郁的奴隶们走向远处的波托马克河。就在这时，一名黑人马车夫（今天他会被称为出租车司机）经过。他指着那队奴隶喊道：“看见没！那不就是赤裸裸的谋杀吗？你不把那叫做赤裸裸的谋杀吗？”¹⁵\n\
  \n这些话深深触动了托里的良知。当他返回房间经过被烧黑的国会大厦时，他认为这座宏伟建筑被烧毁是合情合理的。托里写道——这些话半个世纪后在亚伯拉罕·林肯的第二次就职演说中得到了呼应——“如果认为，万国至高之父允许这桩看似可憎的交易发生，是作为一种炽烈而有益的警示，表明他对他的哥伦比亚儿女们的行为不满——他们建造并崇拜这座辉煌建筑作为自由殿堂，同时却用囚禁和苦役的枷锁压迫着十二到十五万非洲同胞……这会是迷信吗？”最令人难以置信的是，托里继续说道，“奴隶们正在被用来重建这座自由的圣殿”——正如二十年前他们曾帮助建造它一样。¹⁶\n\
  \n就在托里猛烈抨击被奴役工人重建国家自由象征的象征意义时，国会内部也响起了不满的骚动。1816 年 3 月，安·威廉姆斯跳窗事件发生仅三个月后，弗吉尼亚州众议员约翰·伦道夫发表了一篇引人注目的演讲，谴责哥伦比亚特区的奴隶贸易。伦道夫是一位暴躁易怒的奴隶主，后来与国务卿亨利·克莱决斗，他与奴隶制的关系错综复杂。他的继父曾撰写过一篇令人震惊的\
  \ 1796 年反奴隶制论文，他的兄弟则解放了所有奴隶并给了他们四百英亩土地。伦道夫本人私下谴责奴隶制，并最终在遗嘱中解放了他的奴隶，但在公开场合他却为奴隶制辩护——他认为联邦政府没有宪法权利干涉南方的奴隶制或奴隶贸易。¹⁷\n\
  \n然而，哥伦比亚特区的情况不同。由于该地区由国会控制，伦道夫认为联邦对城市奴隶贸易采取行动不存在宪法障碍，他呼吁国会制止他所称的“在上帝和人类面前哭泣的罪恶”。伦道夫认为，国家首都存在繁荣的奴隶市场损害了美国在世界眼中的声誉。作为一个吸引外国政要和游客的国际城市，华盛顿特别容易受到国际社会的愤怒。伦道夫回忆说，当一位外国政要评论说欧洲人会对国家首都的奴隶贸易感到“震惊和厌恶”时，他感到“羞愧”。像英国人亨利·布拉德肖·费伦这样的访客将华盛顿斥为“被绝对奴隶制的致命重压所削弱”，而备受尊敬的拉法耶特侯爵在\
  \ 1824 年备受瞩目的全国巡游中，对《国家情报报》上刊登的追捕逃亡奴隶广告感到震惊，并谴责了首都的奴隶制。外国人对哥伦比亚特区奴隶制和奴隶贸易的厌恶在未来几十年只会与日俱增。¹⁸\n\
  \n伦道夫自愿担任一个特别委员会的主席，调查哥伦比亚特区“非人且非法的奴隶贸易”。该委员会重点关注了奴隶贸易的两个特别令人不安的特征：一是“卑鄙、铁石心肠的主人”在出售时频繁拆散家庭；二是杰西·托里所称的“令人发指且可恶的做法，即绑架并贩卖那些其自由和道德权利受我们国家和州宪法保障的男人、女人和儿童，使其流放他乡。”委员会不仅听取了托里（批评者可能会将其斥为情绪化的煽动者）的证词，还听取了备受尊敬的当地领袖的证词，包括前第一夫人阿比盖尔·亚当斯的侄子、威严的地方法官威廉·克兰奇法官，他将在美国哥伦比亚特区巡回法院任职超过五十年。克兰奇证实了托里的指控，即自由黑人经常被那些急于利用南方高价牟利的奴隶贩子偷走并当作奴隶出售。¹⁹\n\
  \n\n\n另一位自愿协助委员会的当地领袖是乔治敦的律师弗朗西斯·斯科特·基，他曾在 1810 年为米娜·奎因的自由诉讼担任辩护。虔诚、博爱且理想主义的基时年三十七岁，是马里兰州弗雷德里克附近特拉鲁布拉（意为“红黏土”）种植园的奴隶主。他以种族人道主义者著称，认为保护并帮助被奴役者是基督徒的职责。当伦道夫的委员会开始调查哥伦比亚特区的奴隶贸易时，基激情澎湃地陈述了他目睹的虐待行为，包括“夫妻分离、父母与子女分离，以及自由人频繁被掳走，在夜间被匆忙带走，押送至该市并作为奴隶贩卖。”²⁰\n\
  \n基生前释放了七名奴隶（尽管去世时仍拥有八名），作为律师，他处理了数十起案件，帮助被奴役的家庭争取自由。其中一起案件涉及安·威廉姆斯本人。1828 年，即威廉姆斯宁可从三楼窗户跳下也不愿被卖掉的十三年后，基帮助她提起诉讼，要求从仍声称拥有她的酒馆老板乔治·米勒手中获得自由。经过四年的法律纠纷，法院最终将米勒送上法庭。一个全白人陪审团支持了威廉姆斯的请愿。她获得了自由。²¹\n\
  \n### *“清偿大部分道德债务”：华盛顿特区的殖民运动*\n\n弗朗西斯·斯科特·基并非废奴主义者。尽管他帮助了像安·威廉姆斯这样他认为值得帮助的个别奴隶，但他在晚年写道：“我仍然是奴隶主，若非如此，便是最大的不人道。”他认为黑人根本没有为解放做好准备，因此释放他们并期望他们繁荣是不公正甚至不道德的。然而，这位将美国永载史册为“自由之地”的人，也认识到奴隶制对美国民主的根本矛盾。用基的好友兼最高法院书记员伊莱亚斯·B·考德威尔的话来说，美国黑人的地位——无论被奴役还是自由——是“对我们所有宪法基础所依据的公民自由神圣原则的耻辱纪念碑。”²²\
  \ 两人着手进行一项雄心勃勃且充满争议的努力，以调和这一矛盾。\n\n基和考德威尔是后革命时代的人，他们认为自己这一代人必须解决白人民主制度中隐含的矛盾——在其疆域内存在超过一百五十万被奴役的黑人。考德威尔写道：“我们在《独立宣言》中说‘人人生而平等’，并拥有某些‘不可剥夺的权利’。然而，考虑到国家的安全，这被认为是不可能的；而且，鉴于目前对这些人的情感，只要他们与我们混杂在一起，他们永远无法获得这种平等，也无法享有这些‘不可剥夺的权利’。”²³\n\
  \n因此，唯一的解决方案是将黑人从国家中移除。基和考德威尔帮助弗吉尼亚奴隶主兼立法者查尔斯·芬顿·默瑟起草了一项法案，呼吁联邦政府购买北太平洋或非洲海岸的土地，以便重新安置被释放的奴隶。该法案于\
  \ 1816 年 12 月通过，成为首个支持后来被称为“殖民”运动的立法，该运动由考德威尔的妹夫罗伯特·芬利牧师领导。²⁴\n\n对于白人支持者而言，殖民似乎为解决棘手问题提供了简单方案。通过国会拨款和私人慈善，美国白人领袖将在非洲购买土地，并将自由黑人和前奴隶“遣返”（他们\
  \ conveniently 忽略了被奴役的美国人来源多样，根植于非洲不同地区的事实）。基和其他倡导者认为，这样做将使所有相关方受益。这个国家终于可以真实地宣称自己确实是民主国家；没有黑人的压力，白人将更幸福、更繁荣；而黑人自己则可以在自己的土地上作为自由公民享有充分的权利和特权。\n\
  \n白人支持者将殖民视为一项仁慈的事业。担任众议院牧师的长老会牧师拉尔夫·伦道夫·格利认为，殖民将“改善和重生”黑人的品格，并将“文明和基督教”带到非洲。通过帮助自由黑人返回家园，美国白人可以占据道德高地。正如肯塔基州众议院议长亨利·克莱所言：“如果我们不是给非洲居民带来我们无意中造成的邪恶和苦难，而是将我们的艺术、文明和宗教的祝福传递给她，难道我们不能希望美国将清偿她对该不幸大陆所欠下的很大一部分道德债务吗？”²⁵\n\
  \n如果说革命酝酿于波士顿，废奴主义发展于费城，那么殖民运动则主要起源于华盛顿。华盛顿及周边地区的奴隶主常常拥有过剩的奴隶，他们既无法保留，又不愿释放，且认为出售是不人道的；他们还生活在一个拥有大量自由黑人的地区。他们认为，殖民是处理他们认为日益严重的棘手问题的最公正、最负责任的方式。1816\
  \ 年 12 月，基和考德威尔协助组织了后来成为美国殖民协会（ACS）的成立会议，该协会是美国促进黑人重新定居非洲的首要组织。协会章程的五十位原始签署者中，有一半居住在华盛顿。ACS\
  \ 吸引了那些自认为在种族问题上“开明”的人士，包括备受尊敬的华盛顿人，如建筑师威廉·桑顿、法官威廉·克兰奇和《国家情报员》编辑威廉·西顿。他们在殖民运动中找到了一个将实际关切与慈善理想融合在一起的引人注目的运动。²⁶\n\
  \n尽管殖民倡导者动机各异，但他们普遍反对废除奴隶制。在 ACS 的成立会议上，基本人坚持要求组织章程明确声明其无意废除奴隶制。像约翰·伦道夫这样的奴隶主认为，殖民对于永久维持奴隶制至关重要。伦道夫辩称，自由黑人是“奴隶财产不安全且无利可图的最大根源之一”。将自由黑人送出国家将“使主人能够保有他的财产。”²⁷\n\
  \n殖民运动植根于切萨皮克地区特有的经济模式和父权主义冲动，但它激发了全国白人领袖的想象力。包括詹姆斯·麦迪逊总统和詹姆斯·门罗总统在内的著名政治家加入了这一运动。十年之内（并获得国会\
  \ 10 万美元拨款），ACS 帮助在非洲西海岸建立了新的利比里亚殖民地，并资助了数千名前奴隶迁移到那里。²⁸\n\n\n\n\n离开美国并享受完全自由的想法也吸引了一些黑人，这场运动的白人领袖们竭力推广他们的观点。威廉·西顿利用《*国家情报员*》来赞美保罗·卡夫——一位半黑人半印第安人的马萨诸塞州贵格会教徒，他曾将多批前奴隶重新安置到英国殖民地塞拉利昂，并在与美国殖民协会协调重新安置航行时于\
  \ 1817 年意外去世。一些华盛顿黑人至少在原则上表达了对殖民化的支持。一群“华盛顿市有色人种公民”通过了一项决议，认为离开美国是必要的，因为“我们认为我们不可能享有那种区分自由国家公民的选举自由。”²⁹\n\
  \n然而，即使同情这些论点的黑人也绝大多数拒绝了*殖民化*，他们担心这可能导致被迫驱逐到利比里亚。如果他们支持离开美国，他们更倾向于*移民*——一种自愿的、由黑人驱动的迁移，前往西半球唯一由黑人领导的国家海地。艾萨克·N·卡里，一位著名的黑人废奴主义者，曾担任《*自由杂志*》及其他反奴隶制报纸的当地代理人，他推广移民到海地，在\
  \ 1820 年代有超过八千名黑人这样做。³⁰\n\n然而，总的来说，自由和受奴役的华盛顿黑人更倾向于在美国境内争取平等，而不是迁移到别处。黑人领袖在媒体和公开会议上猛烈攻击殖民化，导致美国殖民协会领袖抱怨反对者“使有色人种自由人对这个机构产生了偏见，而这个机构的起源……是出于促进他们幸福的真诚愿望。”前奴隶托马斯·斯莫尔伍德最初支持殖民化，但后来认为这场运动是试图将黑人从他们出生的国家移除的伪装不良的努力，并积极反对。他估计“一百个人中没有一个能被诱导去非洲。”一位受奴役的华盛顿人告诉一位来访的记者，殖民化给黑人带来了“巨大伤害，因为它减少了之前对他们的一点兴趣，并增加了摆脱他们的愿望。”³¹\n\
  \n黑人对殖民化持怀疑态度是正确的。这场运动源于恐惧——恐惧废奴运动最终会导致解放，恐惧被解放的黑人永远无法融入美国社会，恐惧自由黑人会破坏白人民主和奴隶制。殖民化传达了一个强有力的信息，关于谁可以享受美国自由的祝福，谁不能。尽管利比里亚只安置了最终生活在美国的近四百万奴隶中的极小一部分，但殖民化吸引了许多代美国白人，他们认为自由黑人永远无法在他们的国家中占有一席之地。美国殖民协会在内战前的几十年达到顶峰，但一直活跃到\
  \ 20 世纪，最终在 1964 年关闭。³²\n\n### *“宪法不分肤色”：自由黑人对城市提出主张*\n\n华盛顿对殖民化的支持与该市自由黑人社区的规模和实力成正比。到\
  \ 1820 年，很明显华盛顿特区正在成为来自附近蓄奴州的自由黑人移民的磁石。周边州严厉镇压其自由黑人人口，因为奴隶主认识到他们对奴隶制构成的威胁——在弗吉尼亚，任何在\
  \ 1806 年后被解放的奴隶有一年时间离开该州，否则其自由将被撤销。相比之下，华盛顿看起来更有希望。该市有一个繁荣的自由黑人社区和许多黑人经营的机构。自由黑人居民在整个城市生活和工作，他们在城市环境中享有相对的行动自由，甚至还可以观看国会会议。在导致\
  \ 1820 年密苏里妥协的辩论期间，一家报纸指出，“走廊里挤满了有色人种，几乎把白人排除在外。”³³\n\n随着黑人向城市迁移的增加，通过自我赎买和遗嘱解放的奴隶数量也在增加。即使在米娜·奎因在\
  \ 1813 年输掉最高法院案件后，被奴役的人仍然提出索赔，并偶尔通过法院赢得自由。迁移、解放和诉讼使该市的自由黑人人口激增。在 1810 年代增长了 75%，在\
  \ 1820 年代又增长了 67%——是白人人口增长率的两倍多——而被奴役人口则趋于平稳。到 1830 年，该市大多数黑人居民是自由的。在南方城市中，只有华盛顿、巴尔的摩和圣路易斯在内战前拥有多数自由黑人人口。³⁴\n\
  \n自由黑人劳动者在城市中追求各种经济机会。女性在整个战前时期占黑人人口的大多数，主要担任家政工人，负责洗涤和熨烫衣物和亚麻布、接生和照顾孩子、为白人家庭做饭和打扫房屋，或做女裁缝。男性通常在公共和私人建筑项目中找到建筑和维护工人的工作，在城市众多的餐馆、酒店和寄宿公寓中担任厨师、服务员和理发师，以及在城市街道上担任出租马车夫、运货马车夫和搬运工，特别是在海军造船厂附近的繁华区域。黑人劳动者无法在联邦政府中获得高薪的文员职位，但只有一个联邦机构（邮政局）完全禁止他们就业。³⁵\n\
  \n一小部分自由华盛顿黑人成为专业人士——教师、牧师、企业主——并开始在城市购买房产。其中最成功的是贝弗利·斯诺，一位来自弗吉尼亚州林奇堡的自信、言辞犀利的企业家，他在\
  \ 1829 年被主人解放后不久搬到华盛顿特区。斯诺在被奴役时接受过厨师培训，他在西北区第六街和宾夕法尼亚大道的拐角处开了一家被一位报纸作家称为“时尚而优秀”的美食餐厅。提供最好的肉类以及斯诺的特色菜——绿海龟汤，这家餐厅取得了惊人的成功，吸引了大量富裕顾客。其他黑人商人在城市中也蓬勃发展，包括林奇·沃姆利，一位来自弗吉尼亚的移民，他从驾驶出租马车起家，后来经营一家马厩，并在西北区\
  \ I 街拥有房产。沃姆利和他的 10 个孩子成为该市最著名的自由黑人家庭之一；到 1840 年，超过 120 名华盛顿黑人拥有房产，其中就有几位沃姆利家族成员。³⁶\n\
  \n\n\n\n随着人数的增长，华盛顿的自由黑人居民开始寻求生活中更多的自主权，并着手建立自己的宗教机构。在城市早期，无论是被奴役的还是自由的黑人居民都参加白人教堂，但他们面临物理隔离，并不断受到提醒其从属地位，例如一些白人牧师在洗礼时拒绝触碰黑人儿童。因在乔治敦的蒙哥马利街教堂遭受歧视而愤怒，130\
  \ 多名黑人信徒于 1816 年脱离该教堂，建立了该市第一座黑人教堂“小方舟”（1846 年更名为锡安山联合卫理公会）。尽管在内战前一直由白人牧师领导，但锡安山在支持乔治敦的黑人社区方面发挥了重要作用。1820\
  \ 年，埃比尼泽教堂的黑人成员离开了他们拥有奴隶的牧师，成立了该市第一个自主的黑人会众——以色列伯特利有色人种卫理公会教堂，位于国会山脚下的东南第一街。几年后，当以色列伯特利面临失去其建筑时，阿莱西娅·布朗宁·坦纳和她的姐夫乔治·贝尔介入购买了这座教堂。³⁷\n\
  \n黑人的主动性和资源，有时辅以同情白人的捐赠，创办并维持了十四座战前黑人教堂，包括位于西北第十一街和 K 街的阿斯伯里非洲卫理公会教堂，该教堂拥有六百多名成员。（所有这些教堂都是新教教堂。黑人天主教徒长期留在白人管理的教堂内，部分原因是神父同样向黑人和白人教友施行圣礼；直到内战，黑人成员才建立了自己的教堂——圣奥古斯丁教堂。）这些战前教堂成为重要的社区机构，培养了种族自豪感，鼓励了黑人领导力，为儿童施洗和教育，连接了自由和被奴役的亲属，有时还为逃亡奴隶提供庇护。³⁸\n\
  \n华盛顿的黑人居民还通过创建自己的世俗机构，特别是互助协会，来彰显他们日益增长的自信心。这些互助组织汇集资源，帮助社区成员应对财务困境、医疗紧急情况和丧葬事宜。一个成功的例子是“坚决互助协会”，由包括乔治·贝尔在内的一群自由黑人于\
  \ 1818 年创立。除了传统上关注疾病和葬礼外，该协会还为自由黑人儿童创办了一所学校。它呼吁整个社区通过会费和捐款来支持这所学校，但为了缓解白人的担忧并“避免不愉快的事件”，该组织承诺不会教授奴隶儿童。该协会与其他社区机构一样，既反映了也培养了华盛顿黑人居民新兴的自主意识和自力更生精神。³⁹\n\
  \n迈克尔·夏纳体现了许多华盛顿黑人居民来之不易但脆弱的成功。他于 1805 年出生在马里兰州皮斯卡塔韦附近，生而为奴，后来搬到华盛顿特区，他的主人将他租借到海军造船厂当劳工。1827\
  \ 年主人去世后，他以 250 美元的价格被卖为“定期奴隶”给海军造船厂书记员托马斯·霍华德——夏纳在服役满十五年后将获得自由。他娶了一位名叫菲利斯的被奴役女子，夫妇俩育有六个孩子。他们成为埃比尼泽教堂的活跃成员，该教堂提供成人主日学课程，夏纳很可能在那里学会了读写。作为一名勤奋的工人，他赢得了同事和老板的尊重，他开始在一本非凡的日记中记录对日常生活的观察，揭示了战前华盛顿工人阶级的迷人见解。⁴⁰\n\
  \n但夏纳一家无法安稳地享受家庭生活。菲利斯的主人于 1833 年去世后，其子通过将菲利斯和夏纳的两个孩子卖给奴隶贸易公司富兰克林与阿姆菲尔德来偿还家庭债务。绝望的迈克尔·夏纳在六月写道，他们“从我身边被夺走并卖掉”。“在极大的痛苦中”，他花了几天紧张不安的时间，动员他所认识的所有白人关系，以帮助解救他的家人。夏纳的坚持和他对权力的精明理解得到了回报。他请来了海军造船厂的一位少将，后者帮助获得了法院命令，不仅迫使富兰克林与阿姆菲尔德让步，还安排了夏纳妻子和孩子的解放。这花了一周时间，但夏纳一家得以团聚。\n\
  \n夏纳也坚持不懈地追求自己的自由。当他的主人霍华德去世，霍华德遗嘱的执行人威胁要违反他解放奴隶的条款时，夏纳在法庭上对他们提出质疑。在白人律师小詹姆斯·霍班（白宫第一位建筑师之子）的帮助下，他于\
  \ 1836 年提交了一份自由请愿书，指控他“被不公正且非法地束缚在奴役中”。他赢了。作为自由人，他蓬勃发展，在海军造船厂工作了二十多年，积累了财产，并在内战后积极参与地方政治。他后来宣称：“我现在唯一的主人是宪法。”\n\
  \n尽管岌岌可危，但战前自由黑人人口在获得就业和积累财产方面取得的适度成功，为到 20 世纪初成为全国规模最大、最富有、受教育程度最高的黑人人口奠定了基础。这也播下了黑人社区内部阶级分化的种子。许多华盛顿的自由黑人居民拥有白人血统，并自认（并在人口普查中被归类）为“穆拉托人”（混血）；他们较浅的肤色证明了华盛顿的种族界限比固定的法律区分所暗示的更加流动和可渗透。由于与白人社区联系更紧密，许多混血居民比肤色较深的同龄人拥有更多受教育和工作机会，并且通常享有更高的地位。这些分化会随着时间的推移而加剧，尤其是在\
  \ 19 世纪末。⁴¹\n\n华盛顿自由黑人人口的急剧增长和成功令许多白人居民感到震惊，他们将自由黑人视为威胁。当地作家安妮·罗亚尔抱怨说，黑人“完全占据了这座城市，用他们的无礼、噪音和石头袭击人们。”罗亚尔指责国会“偏爱黑人而非白人”，并声称“这些黑人垄断了所有工作和所有现金……甚至我们的女性”，导致“可怜饥饿的白人”一无所有。战争部长詹姆斯·巴伯认为，有色人种自由人“无知、无礼且道德败坏”，他们的生计仅来自“卖淫、偷窃和乞讨”。他在\
  \ 1824 年表示，摆脱他们是“我们首要的目标”。⁴²\n\n该市的白人领导人也抱有同样的担忧。他们试图通过一系列日益严格的限制性黑人法典来阻止自由黑人迁入。“这些法律充斥着对有色人种（无论是奴隶还是自由人）个人自由的每一种可以想象到的羞辱性限制，”一位后来的观察者指出。“似乎已经假定这些谦卑而耐心的人随时准备暴动、叛乱以及各种不服从和邪恶行为。”⁴³\n\
  \n\n\n\n\n1820 年，国会授予市议会新权力后，市议员们通过了一项法律，要求所有“自由的有色人种，无论黑人或混血儿”在三十天内携带“自由证明文件或自由证据”以及三位“受人尊敬的白人居民”的证明书到市长面前，这三位居民需能证明他们“过着和平安静的生活”，并且是“勤劳诚实”的人，不太可能成为城市的负担。如果市长接受了这些证据，那么这位自由黑人申请者必须缴纳\
  \ 20 美元的保证金，承诺“行为良好、清醒且有序”。未能遵守规定可能导致 5 美元罚款、监禁以及被迫离开该市。⁴⁴\n\n然而，试图限制自由黑人的白人领袖遇到了一个问题：威廉·科斯廷。科斯廷在\
  \ 19 世纪初的华盛顿特区是一个引人注目的人物。他是前第一夫人玛莎·卡斯蒂斯·华盛顿未被承认的侄子兼孙子。他身为奴隶的母亲安·丹德里奇是华盛顿同母异父的妹妹，她被华盛顿的儿子强奸并生下了他。科斯廷生来自由，可能在华盛顿总统的弗农山庄种植园长大。他拥有非洲、欧洲和美洲原住民的混合血统，肤色呈浅棕色。他带着贵族般的气质和钢铁般的决心，要争取他认为属于自己的东西，绝非等闲之辈。⁴⁵\n\
  \n科斯廷深受白人和黑人社区的尊敬——就连约翰·昆西·亚当斯也曾评论说，科斯廷“虽然不是白人，但和该地区的任何人一样受人尊敬”——他在东南 A 街（现国会大厦的一部分）建造了住所，担任华盛顿银行的信使，并担任“坚定慈善协会”的主席。他的七个孩子就读于国会山上一所小型、种族融合的私立学校，他还从奴隶制中赎买了几个亲戚。⁴⁶\n\
  \n1821 年，科斯廷引发了一场轩然大波，当时，比亨利·戴维·梭罗著名的公民抗命行为早了近三十年，他故意拒绝遵守市议会的新法律，该法律要求他手持自由文件到市长面前。相反，他挑战当局执行该法律。当局逮捕他后，他提起诉讼，辩称该法律既违反了城市宪章，也违反了美国宪法。“宪法不区分肤色，”科斯廷坚持道，“所有不是奴隶的人都是同样自由的”，有色人种“有权来到这里，并主张所有公民特权”。科斯廷拒绝了开国元勋的种族排他性，为所有种族的人主张美国民主。他对宪法作为一部色盲文件的解释是惊人且新颖的，这一论点超前了其时代一个多世纪。\n\
  \n此案最终由巡回法院法官威廉·克兰奇审理，他在 1821 年对*科斯廷诉华盛顿案*做出的神秘裁决，既给该市的黑人社区带来了希望，也带来了挫折。克兰奇裁定，该法律“必须被解释为前瞻性的，而非追溯性的”，因此不适用于科斯廷和目前居住在该市的其他自由黑人。克兰奇写道，在修订城市宪章时，国会并未寻求“驱逐城市中那些既不能因任何罪行受到指责，也不能被怀疑有罪的长期居民”。⁴⁷\n\
  \n但这位谨慎的法官严重限制了他裁决的范围。他声称，该市有权“剥夺其部分公民享有其他公民所享有的某些政治权利”，包括投票权。该市还可以采取措施针对那些可能“败坏公共道德”的群体，因此它有权要求“自由有色人种以及流浪者和名声不佳者提供良好行为的担保”。克兰奇的裁决对科斯廷个人而言是一场胜利，但对未来的自由黑人社区而言并非如此。新法律不会对科斯廷和其他现有黑人居民执行，但法院确认了市议会的主要信息：新的黑人移民不受欢迎。⁴⁸\n\
  \n威廉·科斯廷曾试图迫使国家首都将宪法适用于开国元勋意图排除的群体——自由黑人，但未能成功。法院明确拒绝了黑人对公民平等的主张——在法律眼中，所有未被奴役的人并非同样自由。尽管正如克兰奇法官所承认的那样，科斯廷和其他长期居住的自由黑人是“有用的社会成员”，“为城市的发展和改善做出了贡献”，但他们仍然超出了宪法保护的范围。该市自由黑人社区的规模和活力——以及黑人居民主张完全公民身份的意愿——在白人城市领袖中引发了恐惧，他们随后通过了获得法院批准的压制性新法律。这种黑人力量、白人恐惧和法律压制的循环将在该市历史上反复上演。\n\
  \n### *“自由人的天赋权利与继承权”：华盛顿的白人民主推动*\n\n在威廉·科斯廷为自由黑人争取法律保护的同时，托马斯·卡伯里则为另一个被排斥的群体——贫穷的白人男性——争取政治权利。卡伯里是木材销售商的儿子，是一位虔诚的天主教徒，其爱尔兰祖先在独立战争前几十年就定居在马里兰乡村。1812\
  \ 年战争爆发时他 21 岁，他参军并在 1814 年 8 月英国人入侵时协助保卫城市。\n\n卡伯里是一位风度翩翩的年轻人，态度和蔼，对时尚服饰有独到眼光，并怀有炽热的政治抱负。战后不久，他在新建的华盛顿城市运河（大致沿今天的宪法大道）附近建造了“卡伯里码头”，并将其打造成蓬勃发展的生意，使他跻身社会名流。1818\
  \ 年，他带着五名奴隶、三个姐妹、一个侄子和一个侄女搬进了西北区第十七街和 C 街交界处一座庄严的联邦风格豪宅。他担任国家大都会银行行长，并很快开始了政治生涯，于\
  \ 1819 年首次当选市议员。到 1822 年，这位 30 岁的单身汉已将目光投向了市长职位。⁴⁹\n\n卡伯里似乎正是开国元勋们所设想的那种有德行的公民，他们将成为新国家各地社区的天然领袖。显赫家族的后裔、爱国军事服役记录、杰出的商业生涯……这些都是政治明星的要素。然而，卡伯里通过支持普通人挑战了当时的主流政治正统观念。与伊莱亚斯·考德威尔和弗朗西斯·斯科特·基一样，卡伯里也是后革命一代的产物，他也认识到了开国元勋的局限性。考德威尔和基寻求解决美国种族矛盾的方法，而卡伯里则专注于这个新生国家中固有的经济矛盾。\n\
  \n开国元勋们采纳了共和形式的代议制民主，但他们假设政治舞台将保留给他们所谓的自然贵族——受过教育、拥有财产的白人男性。他们认为，只有拥有财产的人才会对社区的长期福祉有切身利益；因此，只有他们才能被信任拥有统治权。相比之下，卡伯里支持安德鲁·杰克逊将军更广泛的“白人民主”愿景。尽管他相对富裕，但卡伯里支持成千上万没有财产的白人男性的权利，这些人构成了华盛顿男性人口的大多数。⁵⁰\n\
  \n\n\n\n卡伯里的民主观可能部分源于他的天主教信仰，该信仰强调对穷人的道德义务。他是华盛顿规模虽小但颇具影响力的天主教社区中最引人注目的成员之一。许多天主教家族，如扬家族、布伦特家族和卡罗尔家族，已在马里兰州扎根数代，他们努力融入华盛顿的政治和经济体系。与他们的新教同行一样，这些最富裕的家族（包括卡伯里家族）拥有奴隶；事实上，蓄奴是精英地位的标志。（一些天主教奴隶主让他们的奴隶皈依天主教，既有精神层面的原因，也因为他们相信，正如前乔治城大学校长约翰·格拉西牧师在\
  \ 1818 年所言，“天主教奴隶比其他奴隶更受青睐，因为他们对主人更温顺、更忠诚。”）⁵¹\n\n华盛顿的天主教徒保持着他们的宗教和文化传统。即使在 1810\
  \ 年代该市政治领导层向国会请愿要求获得驱逐城市流浪者的权利时，天主教社区仍帮助贫困移民寻找工作，并欢迎他们加入当地教会。19 世纪初，大多数爱尔兰移民抵达城镇时既无住所也无工作。当地天主教社区提供了资源，例如由爱尔兰酒馆老板、承包商和工人于\
  \ 1818 年成立的华盛顿市爱尔兰慈善协会，旨在援助贫困的爱尔兰家庭。由约翰·卡罗尔主教于 1789 年创立的乔治城大学成为移民的首选雇主，常常雇佣新抵达的移民担任厨师、裁缝或农场工人，直到他们找到固定工作。因此，爱尔兰移民的经历与华盛顿自由黑人的经历形成了鲜明对比，后者几乎没有社区资源可依靠，反而常常被期望成为其被奴役亲属的支持来源。⁵²\n\
  \n作为一名与爱尔兰移民一同礼拜的教友，以及一名与体力劳动者并肩工作的建筑商，卡伯里与他们产生了共同利益感，这使他与其他蓄奴精英成员区别开来。他的政治崛起令该地区更传统的领导人感到担忧，尤其是在\
  \ 1820 年国会修改城市宪章后他竞选市长时。国会扩大了市政府的权力，并将由议会任命的市长改为民选市长，使该地区选民每两年有机会选择他们的市长。这种民选自治的扩展持续了半个多世纪。⁵³\n\
  \n卡伯里于 1822 年竞选市长并获胜，引发了城市精英的愤怒。在弗朗西斯·斯科特·基的法律代理下，他们提起诉讼，指控卡伯里鼓励“不合格”（即贫困）选民投票。市参议会多数成员拒绝为新市长宣誓就职，导致市政厅几乎发生骚乱，需要警方干预。卡伯里上任后，他的反对者通过了一项有争议的“一百美元法”，将投票权限制在那些被评估拥有\
  \ 100 美元或以上财产的白人男性（按 21 世纪美元计算，经济价值超过 7 万美元）。卡伯里否决了该法案，但在他 1824 年连任失败后，市议会迅速再次通过了该法案。⁵⁴\n\
  \n该法案旨在将政府保留给特权阶层，激怒了白人工人。由脾气暴躁的前准将达夫·格林经营的杰克逊派新报纸《美国电讯报》成为工人阶级愤怒的喉舌，反对“可憎可恶的 100\
  \ 美元法”以及那些试图“在我们中间建立金钱贵族”的领导人。当卡伯里于 1826 年再次竞选市长时，工人们全力支持他，但投票限制削弱了他的支持基础。卡伯里落败。白人工人阶级不得不等待二十多年，才能再次在城市政治中施加广泛的政治影响。⁵⁵\n\
  \n杰克逊派强调普通人的政治权力，这激发了要求将亚历山大和乔治城“归还”给其原属州弗吉尼亚和马里兰的呼声。因政治上的无力感而愤怒，越来越多的港口城市白人居民开始质疑留在国家首都的明智性。\n\
  \n就在一代人之前，亚历山大和乔治城的杰出领导人曾是首都选址波托马克河畔最热心的支持者之一。在 1812 年战争之前，这些城镇发展迅速，其居民普遍具有国家导向。但战争暴露了华盛顿的脆弱性，促使许多国会议员公开讨论迁都。该市的捍卫者挫败了迁都挑战，但仍难以赢得国会的持续关注。尽管联邦立法者承诺重建国会大厦和其他公共建筑，但他们经常拒绝为华盛顿拨付足够资金，并忽视为该市制定法律规范。简而言之，正如一位致《国家情报报》的信件作者用呼应奥古斯都·伍德沃德几十年前论点的话抱怨的那样，国会过于关注“这个庞大帝国的更高和更大利益”，而无暇顾及地方事务。⁵⁶\n\
  \n许多亚历山大和乔治城居民将日益加剧的经济困境归咎于国会的忽视。由于国会规定所有联邦建筑必须在华盛顿市内建造，随着政府扩张，中心城市蓬勃发展。港口城市则停滞不前，尤其是在\
  \ 1820 年之后，波托马克河沿岸的海外贸易跌入谷底。亚历山大受到的打击尤为严重——其人口在 1810 年代增长不到 14%，在 1820 年代增长不到 1%，而华盛顿市的人口在\
  \ 1810 年代增长了超过 50%，在 1820 年代又增长了 30%。许多亚历山大居民感到经济上日益孤立。⁵⁷\n\n归还倡导者认为，国会的忽视部分源于“*缺乏政治自由*”，用一位白人亚历山大居民的话说。“任何被剥夺自由的社区，在自由州环绕下都不可能繁荣。”归还支持者用挑衅的语言将他们的政治困境描述为“奴役”，并哀叹国会“主人”对他们的冷漠。他们将愤怒倾注于向国会提交的请愿书（称为“纪念状”）和致编辑的信件中，恳求纠正一位居民所称的“卑躬屈膝的剥夺选举权和殖民地附庸状态”。支持者认为，将亚历山大和乔治城归还给其原属州不仅有助于居民“重新获得那些无价的特权——自由人的天赋权利和遗产”，还将带来更高的土地价值、更多的人口和更多的贸易。⁵⁸\n\
  \n\n\n\n\n但回归运动，如同争取白人男性普选权的斗争一样，并未获得普遍支持。尤其是华盛顿市的领导人担心，这会削弱将首都保留在波托马克河畔的支持。他们还担心，如果国会允许回归，那么它很可能连为这座城市提供的有限资金也会撤回。在\
  \ 1822 年华盛顿市参事会和市议会提交的一份请愿书中，建筑师詹姆斯·霍本及其他城市领导人断然拒绝改变联邦与城市的关系。他们更愿意“加固连接这座城市与国家的链条，而不是移除最小的一个环节”。他们认为，哥伦比亚特区“比我国任何地区都更充分、更有力地得到代表，因为它由整个国会集体代表。”⁵⁹\n\
  \n由于在白人群体中缺乏统一支持——尤其是缺乏白人精英的无条件支持——回归运动未能在国会中提出令人信服的理由。直到 19 世纪 30 年代和 40 年代，废除奴隶制的运动颠覆了地方和国家政治，回归问题才引起国会的关注。\n\
  \n### *“一个严重程度的祸害”：废奴运动瞄准华盛顿*\n\n约翰·F·库克在废奴主义思潮中成长。一位同时代的白人形容他的肤色“介于盎格鲁-撒克逊人与被诅咒的种族之间”，库克以鞋匠为业，以教育为天职。1826\
  \ 年，他 16 岁时获得自由，当时他的姑妈阿莱西娅·布朗宁·坦纳支付了 1450 美元（约合 21 世纪的 36000 美元）买下了他母亲和四个兄弟姐妹的自由。两年后，他就读于约翰·W·普劳特的哥伦比亚学院，这是位于西北区第十四街与\
  \ H 街交界处一所新兴学校中超过 100 名黑人学生之一。⁶⁰\n\n库克起初在学习上挣扎。但一次肩部受伤意外迫使他寻求体力消耗较小的工作后，他如饥似渴地阅读，成长为一名学者。他在黑人社区中承担起领导角色，为自由和受奴役的黑人建立了一个辩论社团，名为“青年道德与文学社”。到\
  \ 1834 年，他成就卓著、备受尊敬，接替普劳特成为哥伦比亚学院（他将其更名为联合神学院）的院长，七年后他创立了第一有色人种长老会教堂（后更名为第十五街长老会教堂）。在\
  \ 1855 年 45 岁英年早逝之前，他在教育和社区提升领域度过了非凡的二十年职业生涯。⁶¹\n\n作为一名有亲属仍处于奴役状态的前奴隶，库克憎恨这种“特殊”制度，并热切吸收了\
  \ 19 世纪 20 年代末在华盛顿自由黑人社区中弥漫的自由与机遇思想。多年来，华盛顿的自由黑人默默谴责奴隶制，帮助个别逃亡者获得自由，并在法庭上提起自由诉讼，但很少有人公开支持废奴。然而，到\
  \ 1826 年库克获得自由时，反奴隶制情绪正在北方蔓延，越来越多的人开始呼吁彻底废除奴隶制。⁶²\n\n大多数白人废奴主义者支持殖民化或渐进式解放，而新一代自由非洲裔美国人开始阐述不同的愿景——立即自由，无需谈论离开美国。波士顿的黑人废奴主义者于\
  \ 1826 年成立了“有色人种总协会”，次年，全国第一家由黑人经营的报纸《自由日报》在纽约开始出版。1829 年，大卫·沃克发表了令人振奋的《呼吁……致世界有色人种公民》，谴责奴隶制和殖民化，并挑战美国人践行《独立宣言》中写下的平等理想。“美国比白人更属于我们——我们用我们的*血与泪*丰富了它，”沃克写道。黑人废奴主义者大胆的言辞和不妥协的要求从根本上改变了美国废奴主义的进程，激励了黑人和白人废奴主义者，使他们的要求变得更加激进。⁶³\n\
  \n在《呼吁》中，沃克呼吁黑人利用教育、宗教和节制来领导争取自由的斗争；约翰·F·库克将这三者融入了他的毕生事业。在哥伦比亚学院，十几岁的库克很可能听说过并讨论过这群激进的黑人领袖及其倡导的思想。校长普劳特是该市最直言不讳的黑人废奴主义者之一。从《自由日报》创刊起，普劳特就是其授权代理人，他公开反对殖民化，后来因被指控协助逃亡奴隶而被捕。库克与普劳特一样具有紧迫感。他社区领导的最初行动之一，就是为一名“即将摆脱奴隶制束缚”的年轻人组织了一次募捐活动。⁶⁴\n\
  \n到 1830 年，像约翰·F·库克这样的自由黑人已成为该市黑人人口的大多数。他们社区日益增长的规模和力量令白人城市领导人担忧。1827 年，市议会通过了修订后的黑人法典，对违反宵禁者处以更高罚款，要求所有\
  \ 15 岁以上男性黑人和 13 岁以上女性黑人出示自由证明，并禁止任何人雇佣或窝藏无法出示自由文件的黑人。任何被发现没有文件的人将被假定为逃亡者并关押。众议院哥伦比亚特区委员会成员解释说，这一条款至关重要。如果被抓到没有文件的黑人被假定为自由人，该市将成为“逃亡奴隶的首选避难所和收容所”，这将是一种“无法忍受的滋扰”。⁶⁵\n\
  \n该法律还允许市监狱看守出售任何主人未认领且无力支付监狱费用的黑人囚犯——这增加了自由黑人被捕获并被假定为逃亡者后，可能被特区当局卖为奴隶的可能性。奴隶贩子学会了顺道去监狱看看是否有所谓的逃亡奴隶待售。⁶⁶\n\
  \n在这样的法律下，库克和他的自由黑人邻居可以建造学校和教堂，可以拥有自己的房屋和企业，可以建立并领导社区组织，但他们不能假设自己在城市街道上是安全的。尽管国会领导人认为自由黑人被错误监禁“完全超出合理可能性”，但特区的奴隶围栏有时确实关押着像本尼迪克特·哈珀这样的自由黑人囚犯。哈珀于\
  \ 1831 年因盗窃指控被捕，被带到一个奴隶围栏而非地方法官处。他担心自己会被卖掉，并设法从围栏的三楼窗户逃出。⁶⁷\n\n\n\n\n所罗门·诺瑟普就没那么幸运了。这位来自纽约的自由黑人音乐家在访问华盛顿时遭人伏击，被关进了威廉·H·威廉姆斯位于第七街和\
  \ B 街（现独立大道）西南角的奴隶围栏，这里就在如今赫什霍恩博物馆南边。这栋两层建筑因其粉刷的灰泥墙而被称为“黄房子”，诺瑟普后来写道，它“看上去只是一栋安静的私人住宅”，但“其构造使得外界永远看不到里面关押的‘人畜’”。在环绕场地的十英尺砖墙后面，穿过铁门，在十二英尺见方的牢房里，诺瑟普和其他囚犯遭受了可怕的殴打，在没有床铺和毯子的情况下彻夜难眠，并在被送往南方之前度过了痛苦不堪的日日夜夜。⁶⁸\n\
  \n“说来也怪，就在这栋房子的视线范围内，从它居高临下的位置俯瞰，竟是国会大厦，”诺瑟普苦涩地写道。“爱国代表们高谈自由与平等的声音，与可怜奴隶锁链的叮当声，几乎交织在一起。”诺瑟普被卖到路易斯安那州为奴，挣扎了十二年才重获自由。他在\
  \ 1853 年出版的《为奴十二年》中讲述了自己骇人听闻的经历。⁶⁹\n\n黄房子坐落在国家广场南侧一个奴隶围栏密集的繁华街区。对于奴隶贩子来说，这是个理想地点。往南几个街区就是码头，贩子们可以把他们的奴隶顺流运走；往北几个街区则是宾夕法尼亚大道上熙熙攘攘的市场，那里能找到买家和卖家。穿过第七街，在黄房子南边一点是罗比酒馆，废奴主义者爱德华·阿布迪将其描述为一个“破败的茅屋”，周围环绕着十四英尺高的木栅栏，“外面还有柱子防止逃跑”。同一街区还有另外两个围栏，一个由约瑟夫·W·尼尔公司经营，另一个由威廉·H·理查兹经营。⁷⁰\n\
  \n被奴役的人们也被关押（和出售）在连接白宫和国会大厦的宾夕法尼亚大道沿线。詹姆斯·伯奇，那个关押诺瑟普的虐待狂贩子，经常使用两家市中心酒店——美国酒店和圣查尔斯酒店——的围栏，酒店管理层向奴隶主保证：“本酒店老板拥有宽敞的地下牢房，用于安全关押奴隶，并通知顾客，您的奴隶将得到妥善照顾。若发生逃跑，老板将赔偿黑奴的全部价值。”白宫以东两个街区还有另外两个围栏——一个在拉斐特酒馆，另一个在德凯特故居的庭院里。在第七街和宾夕法尼亚大道交汇处的中心市场（现国家档案馆所在地），购物者可以在购买杂货的同时购买被奴役的人。⁷¹\n\
  \n尽管并非每天发生，但在 19 世纪 20 年代末和 30 年代初，随着关于奴隶制、奴隶贸易以及华盛顿自由黑人地位的辩论愈演愈烈，在首都绑架自由黑人的事件成为了一个引爆点。奴隶制在华盛顿逐渐式微——随着华盛顿城市化程度提高，对奴隶劳动力的需求减少，许多奴隶主发现出售或释放奴隶比继续供养他们更有利可图。哥伦比亚特区的奴隶人口在\
  \ 1820 年达到峰值 4520 人，此后稳步下降，而城市其他地区则显著增长。⁷²\n\n然而，这一制度仍然是城市生活中无法回避的一部分。被奴役的人随处可见：在最好的酒店当服务员，在街上赶马车，在公共市场购物，有时还在当地妓院卖淫。在精英白人居民的家中，奴隶负责打扫、做饭、园艺、梳洗、熨烫、裁缝、洗衣以及大量其他日常杂务。被奴役的华盛顿人还\
  \ prominently 担任南方国会议员的仆人，也在总统府服务——前十二位总统中，有八位是奴隶主，他们带着奴隶到首都服侍自己。⁷³\n\n奴隶队列 regularly\
  \ 蜿蜒穿过市中心，每天《国家情报报》的读者都能看到几家奴隶贩子的广告，包括富兰克林和阿姆菲尔德公司，以及各种逃亡奴隶通告，主人悬赏捉拿逃跑的奴隶。奴隶贸易不仅让个人致富，还支撑了当地经济，并为市政项目提供了资金。1834\
  \ 年，国会利用向奴隶贩子收取的 400 美元许可费，帮助华盛顿市疏浚切萨皮克和俄亥俄运河。它还使私人机构受益。1838 年，当乔治城学院面临财务困难时，学校官员决定将\
  \ 272 名在该学院马里兰农场劳作的奴隶以 11.5 万美元（按 21 世纪美元计算超过 6000 万美元）的价格卖给两位路易斯安那种植园主，从而保住了学院。⁷⁴\n\
  \n废奴主义者将目光投向哥伦比亚特区，既有象征意义，也有现实考量。作为国家首都，华盛顿代表了美国人民的最高理想，废奴主义者认为它不应被奴隶制的罪恶所玷污。“奴隶制在合众国的任何地方都是可耻的，但在哥伦比亚特区范围内，在国会和欧洲各国公使的眼前，尤其如此，”《自由日报》的编辑们在\
  \ 1828 年写道。“后者看到每天上演的令人作呕的场景，难道不会理所当然地感叹，我们所有关于自由和平等的夸耀都不过是嘲弄吗？”废奴主义者认为，在华盛顿结束奴隶制，将发出一个关于国家优先事项和原则的有力信息。⁷⁵\n\
  \n从实际政治角度来看，将重点放在华盛顿而非南方其他地方也是合理的，因为只有联邦政府有权决定该市奴隶制的命运。南方奴隶主不能像对待其他地方的奴隶制那样声称此事应由地方立法机构处理——国会*就是*地方政府。“哥伦比亚特区奴隶制问题完全处于国会的权力范围之内，*国会作为特区的立法机构*，”废奴主义者伊桑·艾伦·安德鲁斯写道。“即使他们通过一项普遍解放计划，只要尊重特区选民的权利，南方就没有理由抱怨，就像弗吉尼亚或马里兰立法机构采取类似行动一样。”⁷⁶\n\
  \n华盛顿——在南方城市中几乎是独一无二的——充满了反奴隶制活动。据《自由日报》报道，到 1827 年，马里兰、特区和亚历山大已经建立了十几个正式的废奴协会。“人道恳求，私利敦促，宗教命令我们采取行动”，以消除“一个后果如此有害、性质如此可耻的罪恶”，哥伦比亚特区废奴协会的领导人写道。白人废奴主义者，如亚历山大慈善协会的贵格会教徒塞缪尔·詹尼，将自己的专业知识和资源用于自由诉讼，包括\
  \ 1827 年一起成功的案件，其中十二名黑人请愿者对当地奴隶贩子提起诉讼并获胜。⁷⁷\n\n\n\n\n\n许多废奴主义者的精力集中在奴隶贸易上，到 19 世纪\
  \ 20 年代末，奴隶贸易已发展成一项规模庞大且利润丰厚的生意。以富兰克林与阿姆菲尔德为首的本地奴隶贩子，是该行业的主导者。奴隶贸易中赤裸裸的日常暴行激起了反奴隶制人士的愤怒。反奴隶制作家和艺术家们在他们的期刊、小册子和宣传单中充斥着对奴隶贸易现场的生动描绘——戴着镣铐的男女穿行于城市，拍卖台上家庭被拆散，拥挤恶臭的奴隶牢房里人们等待着可怕的命运。“当国会的演说家们在城市的一角高谈阔论自由，大声宣称‘所有人都是平等的’……拍卖商却在另一角公开贩卖人肉！”苏格兰作家托马斯·汉密尔顿指责道。⁷⁸\n\
  \n然而，奴隶贸易并未困扰某些国会议员。“尽管在家庭分离时，他们的感情有时会受到伤害，”1829 年众议院哥伦比亚特区委员会的一份报告总结道，被卖到南方的奴隶受益于“更温和宜人的气候”，并且“他们的境况往往因此改善，心情也更加愉快。”⁷⁹\n\
  \n华盛顿的白人废奴活动家于 1828 年动员起来，准备了一份由一千多名当地居民签署的请愿书，呼吁国会废除该市的奴隶制。许多签署者，《自由日报》得意地宣称，“属于有影响力的阶层，其中一些是奴隶主”，包括前市长托马斯·卡伯里。请愿书认为，奴隶制是“一种严重程度的邪恶，极大地损害了本特区的繁荣与幸福，并给我们建立的自由制度带来了不一致的耻辱。”请愿者呼吁逐步解放，从\
  \ 1828 年 7 月 4 日当天或之后出生的奴隶儿童开始。⁸⁰\n\n这份请愿书是当地反奴隶制运动的一项非凡成就，但它掩盖了废奴主义者与殖民主义者之间日益扩大的裂痕。两个团体的成员都签署了请愿书，但他们并不共享相同的政治目标。帮助起草请愿书的亚历山大市白人废奴主义者塞缪尔·詹尼相信立即废除奴隶制，但“知道人们心中对此的偏见”，他默许了呼吁逐步解放。与此同时，许多其他签署者希望明确表示，他们支持逐步解放的唯一条件是获得自由的奴隶将被送往利比里亚。⁸¹\n\
  \n这种裂痕体现在两位著名的白人废奴主义者身上，他们于 1830 年试图将这座城市作为自己的家：本杰明·伦迪，当时可能是最重要的反奴隶制期刊《普世解放天才》的出版人（该刊总部位于巴尔的摩），以及他的助手，一位名叫威廉·劳埃德·加里森的二十四岁鲁莽青年。伦迪身材瘦小但精力充沛，机智敏锐，在他每月出版的四英寸宽的小册子中勇敢地挑战奴隶主和奴隶贩子。像当时大多数反奴隶制白人一样，他赞成逐步废除奴隶制，并将殖民化视为自由黑人解放后可接受的选择。\n\
  \n加里森钦佩伦迪，但他逐渐摒弃了导师的方法。受大卫·沃克和他在巴尔的摩遇到的黑人废奴主义者的影响，急躁的加里森逐渐以立即废除奴隶制的激烈倡导者和殖民化的坚决反对者而闻名。他在伦迪手下工作时越来越不安，并提议在华盛顿开设《天才》的分支机构。伦迪否定了这个想法，于是\
  \ 1830 年初，加里森决定独自创办一份基于华盛顿的报纸。\n\n华盛顿的亲奴隶制领导人对他避之不及。当加里森考虑购买《华盛顿观察家》（一份财政拮据、支持殖民化的报纸）的印刷所时，美国殖民协会的官员们动员起来阻止了这笔交易。由于无法在华盛顿开店，加里森转而北上波士顿，在那里创办了《解放者》，一份被南方奴隶主憎恨的激进报纸。随着他的门徒受挫，而自己在巴尔的摩面临法律麻烦，伦迪重新考虑了华盛顿。他于\
  \ 1830 年底将印刷业务迁至该市，以便集中精力处理“在哥伦比亚特区逐步彻底废除奴隶制的问题”。⁸²\n\n伦迪试图缓和废奴主义者与殖民主义者之间的紧张关系，但在关键的\
  \ 1831 年之后，分裂变得不可挽回。那年一月，加里森开始出版《解放者》，他对奴隶主和殖民主义者的猛烈抨击帮助推动了反奴隶制运动进入一个更具对抗性的阶段，无论是在全国范围内还是地方上。同年春末，华盛顿的自由黑人居民在非洲卫理公会教堂举行了一次公开会议，谴责殖民化。会议由教育家约翰·W·普劳特主持，该团体决议：“孕育他们的土地，是他们唯一真正而确实的家园——在没有教育益处的情况下离开家园，将是失策、不明智且不恰当的。”⁸³\n\
  \n八月发生了一场灾难性事件，阻碍了废奴主义者的势头。在弗吉尼亚州南安普敦县（华盛顿以南约 180 英里），一位名叫纳特·特纳的富有魅力的奴隶传教士带领七十名奴隶发动了一场血腥叛乱，杀死了数十名白人，随后被州民兵击退。特纳的起义，加上几个月后牙买加发生的大规模奴隶叛乱，引发了白人对整个南方广泛奴隶起义的恐惧。那年秋天，乔治敦市政府加强了其黑人法典，禁止出版“会煽动奴隶或有色人种叛乱或反抗”的出版物，尤其是名为《解放者》的报纸。当地白人教堂曾提供融合的主日学课程，现在却对黑人儿童关闭了大门。一直对废奴主义者保持警惕的许多特区领导人，尤其是像弗朗西斯·斯科特·基（时任该市地方检察官）这样的殖民主义者，开始将这场运动视为致命威胁。⁸⁴\n\
  \n19 世纪 30 年代初，紧张局势升级，废奴主义者呼吁发起大规模请愿运动，以说服国会结束华盛顿的奴隶贸易。如同十多年前的杰西·托里一样，19 世纪 30 年代初的废奴主义者利用民主和自由的语言与意象，来凸显国家首都奴隶制的虚伪。废奴主义文学将国会大厦的图像与奴隶队列和拍卖台的场景并置，挑战美国人“用请愿书淹没国会”。成千上万的请愿书涌入国会，导致邮件收发室不堪重负。⁸⁵\n\
  \n![Image](img/f0001-06.jpg)\n\n*“美国的奴隶市场”。美国反奴隶制协会在 1836 年制作了这张宣传单，作为其大规模请愿废除华盛顿奴隶制运动的一部分。右下角的最后一幕展示了在华盛顿特区亚历山大市富兰克林与阿姆菲尔德总部（美国最大的奴隶贸易运营机构）的奴隶。国会图书馆。*\n\
  \n\n\n\n\n在日益增加的审视和压力下，哥伦比亚特区的白人领袖和国会中的南方领袖放弃了自美国独立战争以来常见的为奴隶制辩护的论调。他们将这一制度重新塑造为一种“积极的善”，并指责废奴主义者才是真正的威胁，反奴隶制的鼓动将引发流血冲突。*《美国政治家》*的编辑警告说，华盛顿的奴隶制问题是一个爆炸性话题，任何措施都必须“像将点燃的火柴靠近火药引线一样谨慎和周密。”⁸⁶\n\
  \n### *“我和你们一样拥有自由的权利！”：“雪暴”与鲁本·克兰德尔审判*\n\n爆炸发生在 1835 年夏末。8 月 4 日，一名 18 岁的被奴役男子阿瑟·鲍恩在约翰·F·库克的辩论协会与一群自由黑人和被奴役的黑人男子饮酒辩论，度过了一个夜晚。鲍恩或许是著名建筑师威廉·桑顿的遗孀安娜·桑顿所拥有的五名奴隶中最受宠爱的一个。午夜过后，他醉醺醺地跌跌撞撞回家，脑海中萦绕着刚刚讨论过的自由思想。⁸⁷\n\
  \n他最终无精打采地站在安娜·桑顿卧室门口，腋下夹着一把斧头，却迎面撞上了与桑顿同睡一室的母亲玛丽亚。玛丽亚设法将儿子推出卧室，而桑顿则从后门跑出去求救。几分钟后，两名邻居赶到，听到阿瑟·鲍恩猛敲卧室门，喊道：“我和你们一样拥有自由的权利！”⁸⁸\n\
  \n警方在那周晚些时候未流血地逮捕了鲍恩，但这一事件让华盛顿的白人社区感到不安，并在国家首都引发了两周的骚乱。当城市报纸对这场“最血腥的悲剧”义愤填膺时，一群白人技工（熟练工人）涌向城市监狱，企图对鲍恩实施报复。迈克尔·希纳在日记中写道，这群暴徒希望“把桑顿太太的混血男仆抓出来，不经法官或陪审团就把他吊死。”⁸⁹\n\
  \n许多技工早已对种族冲突跃跃欲试。一周前，海军造船厂的白人工人曾罢工抗议纪律整顿，但自由黑人和被奴役的黑人工人仍继续工作，这激怒了技工们。鲍恩事件给了他们发泄怒火的机会。局势变得如此危险，以至于地方检察官弗朗西斯·斯科特·基请求联邦援助，一支海军陆战队从造船厂被派去封锁监狱并恢复秩序。⁹⁰\n\
  \n对许多当地白人来说，鲍恩是一个噩梦成真：一个通常心满意足的奴隶（至少据他的女主人所说）被自由黑人和他们的废奴主义思想腐蚀了。奴隶主在论证奴隶制是一种“积极的善”时，认为奴役是黑人的自然状态，被奴役的非裔美国人缺乏独立思考和行动的能力。按照这种逻辑，鲍恩不可能自己要求自由并攻击主人——一定有一个白人废奴主义恶棍潜伏在这场爆发背后。\n\
  \n随着鲍恩安全入狱，白人领袖将责任 squarely 归咎于废奴主义者及其盟友。威廉·劳埃德·加里森领导的美国反奴隶制协会仅在上个月就通过邮件发送了 17.5\
  \ 万份请愿书，*《国家情报报》*的编辑愤怒地称这是“**可恶的恶行**”，助长了“当今的狂热精神”。对桑顿的袭击不过是“**第一颗果实**”，是“最近泛滥于这座城市及全国蓄奴地区的煽动性出版物”的结果。许多白人观察者声称，鲍恩是因阅读废奴主义文献而被激怒的。一位忧心忡忡的白人华盛顿居民写道，如果善良的桑顿都能遭到袭击，“那么其他公民还能指望从过去二十年聚集在我们中间的自由黑人和奴隶那里得到什么呢？”⁹¹\n\
  \n但仅仅谴责匿名的废奴主义者是不够的。白人指控者需要一个替罪羊，他们找到了一个不起眼的白人植物学家兼医生鲁本·克兰德尔，他最近刚搬到该地区。克兰德尔的姐姐普鲁登斯是一位直言不讳的废奴主义者，但鲁本并非奴隶制的激烈反对者——他从未加入任何反奴隶制组织，也从未公开支持解放奴隶。然而，一位访客在他的店里看到了一些废奴主义文献，并警告克兰德尔“这种小册子在这里行不通，纬度太偏南了。”访客借走了一本小册子，于是关于城里来了新废奴主义者的谣言四起。直到鲍恩袭击事件和周末的暴徒威胁之后，地方检察官基才采取行动。为了平息日益增长的不满，他下令逮捕克兰德尔，并指控他“出版恶意诽谤的言论，意图在哥伦比亚特区的奴隶和有色人种自由民中煽动叛乱和暴动。”⁹²\n\
  \n克兰德尔的逮捕引发了另一波暴力。当克兰德尔被押往监狱时，一名男子喊道：“我们应该把这个该死的恶棍抓起来，吊在树上。”但海军陆战队仍在监狱周围保持队形。由于无法抓到傲慢的奴隶鲍恩或疑似废奴主义者的克兰德尔，技工暴徒转而将怒火发泄到另一个他们憎恨的群体：自由黑人。⁹³\n\
  \n暴徒首先瞄准了贝弗利·斯诺，他是高档美食餐厅“享乐食堂”的自由黑人老板。尽管斯诺在光顾他餐厅的白人精英中结交了朋友，但白人工人视他为对种族秩序的冒犯。作为城里可能提供最奢华美食的供应商，斯诺受过教育、事业有成，甚至有点居高临下。有传言说他曾吹嘘“可以随心所欲地得到任何技工的妻子或女儿”。这个谣言，加上对他暗中支持废奴主义以及普遍无法无天精神的指控，导致一群由数百名男子和男孩组成的愤怒暴徒，用一位白人目击者的话说，“要抓住斯诺，给他涂上柏油、粘上羽毛，或者更糟。”⁹⁴\n\
  \n斯诺在白人朋友的帮助下逃离了城市。他不在时，暴徒洗劫了他的餐厅。随后，暴徒又摧毁了约翰·F·库克的学校，鲍恩被怀疑在那里接受了废奴主义思想的灌输。在暴徒到来之前，白人邻居匆忙赶到\
  \ K 街的库克家中，告诉他“快走，因为暴徒正在杀害所有帮助黑人的家伙。别停下。”库克逃往费城，一年后才返回这座城市。暴徒又纵火烧毁了另一所学校，并在自由黑人社区中继续肆虐。直到联邦军队的介入以及几天后安德鲁·杰克逊总统度假归来，这场“雪暴”才告结束，城市恢复了平静。⁹⁵\n\
  \n\n\n\n\n暴民对斯诺、库克以及自由黑人社区的袭击，揭示了这座城市种族分裂的经济维度。白人工人，尤其是爱尔兰社区中，经济怨恨根深蒂固。19 世纪 20\
  \ 年代末，切萨皮克与俄亥俄公司招募了超过一千名爱尔兰移民修建 C&O 运河，爱尔兰社区由此迅速壮大。在运河及其他工程中，白人工人与黑人工人（包括奴隶和自由人）竞争，且往往占据上风。巴尔的摩至华盛顿的道路由爱尔兰工人铺设，尽管有观察者指出，“这条道路所穿越的地区挤满了黑人，他们急需更有利可图的就业机会。”19\
  \ 世纪 30 年代初，白人工人还赢得了用碎石铺设宾夕法尼亚大道的合同。⁹⁶\n\n然而，华盛顿的白人工人抱怨黑人同行主导了公共建设项目，并将他们共同承受的低工资和恶劣工作条件归咎于黑人工人。当他们像在海军造船厂那样集体行动以改善自身处境时，常常发现老板可以转而雇佣黑人工人。1834\
  \ 年和 1835 年，许多北方城市的白人工人经常发动骚乱，以表达对老板和竞争对手的不满。频繁的骚乱让一位华盛顿白人写道：“这个国家正流行暴民热。”华盛顿的“斯诺风暴”是\
  \ 1835 年夏季东海岸沿线城市爆发的一系列骚乱的一部分，其中许多骚乱针对的是自由黑人和教育他们的学校。⁹⁷\n\n“所有这些针对黑人的攻击，原因在于他们以更低的工资参与工作竞争，”华盛顿支持奴隶制的工人报纸《合众国电讯报》解释道。“他们的生活标准低于白人劳工，因此能够以更低的价格抢走工作。”该报认为，白人工人对自由黑人的愤怒是南方应抵制解放的首要原因。“一旦解放发生，北方就会对黑人关闭大门”，因为北方白人工人根本不会容忍黑人移民。届时，华盛顿和其他南方城市将陷入大量自由黑人人口的困境，从而摧毁白人社区。⁹⁸\n\
  \n白人工人猛烈攻击黑人，不仅因为他们可以相对不受惩罚地这样做，还因为他们对普遍的市场变化感到沮丧——这些变化削弱了他们的自主权，挑战了他们的独立感。与 19\
  \ 世纪 30 年代中期其他城市的暴乱者一样，华盛顿的暴民对社会和经济上的上层人士心怀不满。十多年前，华盛顿的社会和经济精英就已向托马斯·卡伯里及其支持者明确表示，没有足够财产的人——无论是否为白人——将被排除在政治进程之外。在一个上层社会举足轻重的城市里，白人工人被排斥在权力之外。骚乱常常成为表达不满的替代手段。⁹⁹\n\
  \n政治上无权、经济上依附、社会上受压迫的白人工人对上层阶级怒火中烧，但他们选择将暴力施加于唯一比他们更受贬低的群体——黑人和他们的废奴主义盟友。一家新创办的工人报纸《华盛顿人报》的编辑写道，在经济动荡和种族紧张时期，“废奴主义和奴隶制对我们而言比我们能想到的任何其他事情都更重要。”编辑们后来呼吁南方立法机构“绞死每一个来到他们中间干涉他们奴隶的人。”¹⁰⁰\n\
  \n白人工人的愤怒以及自由黑人带来的威胁感令白人领袖们感到恐惧，在接下来的一年里，他们试图重新控制首都。这一过程中的核心人物之一是地区检察官弗朗西斯·斯科特·基。从亚瑟·鲍恩的审判开始，到鲁本·克兰德尔以及“斯诺风暴”暴民数名成员的起诉，基试图重建他认为这座城市已经失去的秩序。\n\
  \n二十年来，基已今非昔比。年轻时，他坚信奴隶制是一种垂死的制度——在他的城市里确实如此——并追求他认为高尚且人道的解决方案，以应对奴隶制消亡带来的问题：殖民化。曾有一段时间，殖民化似乎确实可行。利比里亚于\
  \ 19 世纪 20 年代初建立，如今有数千名前奴隶生活在那里。\n\n然而，到了 19 世纪 30 年代中期，殖民化已被废奴主义所取代。废奴主义运动包括那些支持某种形式渐进式解放的人，以及要求立即结束奴隶制、让自由黑人留在美国的激进少数派。废奴主义威胁要压倒殖民化，并削弱其道德合法性。越来越多的反奴隶制白人开始同意约翰·W·普劳特和其他黑人废奴主义者的观点，他们谴责殖民化是一种阴险、道德上令人厌恶的阴谋，旨在加强奴隶制并驱逐黑人。\n\
  \n随着废奴主义者声音日益高涨，殖民化运动中的一些领导人试图通过撇清与奴隶主及其他南方支持者的关系来削弱他们的攻击。这一努力的一部分包括 1833 年试图将基（以及克兰奇法官、《国家情报报》编辑威廉·西顿和其他华盛顿领导人）从美国殖民协会的董事会中除名——他们自该协会成立以来一直担任董事。尽管这一努力失败了，但受到打击的基积极寻求重新确立自己在董事会中的地位，并将殖民化重新确立为解决美国自由黑人“问题”的最人道方案。¹⁰¹\n\
  \n鲍恩的审判于 1836 年 11 月开始，相对迅速，判决结果几乎没有悬念。尽管安娜·桑顿试图保护她的奴隶，坚称他并无恶意，但其他证人的证词与之矛盾。基巧妙地说服法官，不允许鲍恩的醉酒状态成为其行为的借口，并不断冲击白人陪审员恐惧的神经。辩方结案后，陪审团仅用了十五分钟就判定鲍恩谋杀未遂罪名成立。他被判处死刑，但桑顿不肯放弃他。她利用自己与白宫的社会关系，直接向安德鲁·杰克逊总统求情。经过数月的请愿和请求，杰克逊最终同意并赦免了鲍恩。作为赦免协议的一部分，鲍恩被卖给总统的一位朋友，并被带离了这座城市。¹⁰²\n\
  \n相比之下，鲁本·克兰德尔的审判则是一场轰动一时的事件。在富有的废奴主义者的资助下，克兰德尔聘请了两位顶级律师，并在挤满国会议员和其他名人的法庭上提出了强有力的辩护。代表这座城市人民出庭的是无处不在的基，他辩称这是华盛顿“有史以来审理的最重要案件之一”。他对陪审团的结案陈词引人注目，深刻反映了驱使许多华盛顿白人的焦虑情绪。\n\
  \n\n\n\n基伊坚称，此案代表了“两种伟大且相互冲突的权利之间的碰撞：——我们以及整个蓄奴群体自我防卫的权利；以及他人推翻其法律、扰乱其安宁的权利。”如果无法阻止废奴主义者传播他们可憎的言论，当地白人将不得不屈服并承受后果，包括解放黑奴和种族融合。基伊怒斥道，反对这一点的白人将不得不逃离这座城市，“而人权与种族融合的朋友们可以来取代我们的位置。”¹⁰³\n\
  \n当辩方大量引用基伊多年前反对奴隶制的演讲时，基伊回应称，解放黑奴“比奴隶制本身更邪恶”。基伊坚称，黑人的真正朋友是奴隶主本人，尤其是那些帮助建立利比里亚并资助数千名前美国奴隶移民的人。¹⁰⁴\n\
  \n尽管基伊恳求，陪审团仍宣判克兰德尔所有罪名不成立。这一判决未必反映了对废奴主义的认同；陪审员可能只是认为克兰德尔本人并未计划煽动华盛顿的黑人群体。虽然重获自由，但克兰德尔在监狱中度过了八个月，出来时已病弱不堪。不到两年，他便因在卫生条件恶劣的城市监狱中感染肺结核而去世。¹⁰⁵\n\
  \n在 1835 年夏末的“骚乱事件”之后，许多当地白人变得更加紧张。“我们被自由黑人淹没了，”一位写信给《华盛顿人报》的人抱怨道。不断增长的自由黑人人口是一座“火山”，另一位白人居民警告说，除非采取更严厉的新措施来阻止黑人迁入城市，否则它将“以难以想象的速度在我们脚下”继续膨胀。面对公众的强烈抗议，次年市议会通过了一部更严苛的黑人法典，要求黑人缴纳\
  \ 1000 美元保证金（需由五名白人居民签字担保），禁止他们在晚上 10 点后举行会议，并禁止他们获得除驾驶马车和四轮马车以外的任何行业执照。¹⁰⁶\n\n\
  华盛顿特区修订后的黑人法典，恰逢全国范围内将奴隶制从公共话语中彻底清除的协同努力。国会中许多支持奴隶制的领导人认为，在公共领域继续争论奴隶制实在太危险了。于是，1836\
  \ 年 5 月，国会通过了平克尼决议，统称为“钳口规则”。国会坚称“不应以任何方式干涉哥伦比亚特区的奴隶制”，并决议不对“任何以任何方式、任何程度涉及奴隶制或废除奴隶制主题的请愿书、备忘录、决议、提案或文件”采取任何行动。¹⁰⁷\n\
  \n当反奴隶制代表、宾夕法尼亚州的撒迪厄斯·史蒂文斯攻击钳口规则时，《华盛顿人报》的编辑们迅速回应：“我们，哥伦比亚特区的人民，对他和他的决议毫不在乎。那些*黑鬼*是我们的，我们凭*权利*和*武力*拥有他们。”¹⁰⁸\n\
  \n《华盛顿人报》的编辑们和国会中支持奴隶制的议员们或许曾希望，钳口规则和华盛顿特区限制性的黑人法典能有效让华盛顿的黑人居民沉默，并阻止黑人迁入城市。但尽管言辞激烈，黑人居民拒绝温顺地屈服于这些新限制。该市的自由黑人社区过于强大且根深蒂固，无法完全压制。新黑人法典生效两天后，自由黑人理发师、贝弗利·斯诺的朋友艾萨克·N·卡里申请续签在其店内销售香水的执照。作为一名直言不讳的废奴主义者，卡里习惯于挑战权威。在市长拒绝他的申请后，他\
  \ defiantly 继续销售香水。市政官员逮捕了他，并处以 50 美元罚款。\n\n如同十五年前的威廉·科斯廷一样，卡里将市政府告上法庭——并获胜诉。巡回法院推翻了执照限制，称其“与国家的普遍法律相抵触”。法官威廉·克兰奇曾在\
  \ 1821 年“科斯廷诉华盛顿案”中谨慎地触及种族平等的边缘，而在“卡里诉华盛顿案”（1836 年）中，他对黑人权利做出了引人注目的辩护¹⁰⁹：“尽管自由有色人种不享有自由白人享有的同等政治权利，但他们拥有同等的公民权利……这些公民权利包括从事任何合法且无害的行业、商业或职业的权利。”克兰奇的裁决保护了黑人企业，并有助于维护该市作为对黑人企业家相对开放之地的声誉，尽管黑人法典的其他部分仍然有效。¹¹⁰\n\
  \n艾萨克·卡里对 1836 年黑人法典的抵抗——以及部分胜利——揭示了 19 世纪初这个新生国家面临的一个根本问题：黑人在美国民主中应占有什么地位？严苛黑人法典的通过，从某种意义上说是自治的胜利。选民的强烈抗议促使当地民选官员相对迅速地采取行动，为感知到的问题提出了新解决方案。但该解决方案针对的是一个被系统性地排除在政治进程之外的少数种族。由于缺乏政治手段来捍卫自身利益或追究民选官员的责任，华盛顿的黑人居民建立了自己的机构，并转向非选举产生的司法机构来保护他们的社区免受民主暴政的侵害。\n\
  \n弗朗西斯·斯科特·基和其他白人殖民主义者认为，黑人在美国民主中根本没有立足之地，并主张将他们完全驱逐出这个国家。但华盛顿的黑人居民拒绝离开。相反，他们宣称“这片给予他们生命的土地……是他们唯一*真实而真正的家园*”，正如废奴主义教育家约翰·普劳特所言。他们结婚、养育家庭、相互照顾，尽管物质贫困。他们建立了教堂、学校、互助协会和其他社区机构，将奴隶和自由黑人居民团结在一起，并保护他们免受白人至上主义最严酷的影响。他们勤奋工作，开办企业，购买房产，有时甚至在白人的抵制下取得成功。该特区的白人政治领导层，如《华盛顿人报》的编辑们，坚称白人完全控制着这座城市及其机构，但安·威廉姆斯、约翰·F·库克、威廉·科斯廷、艾萨克·卡里和其他华盛顿黑人居民证明，这种控制是岌岌可危的。在接下来的二十年里，随着种族与民主、奴隶制与自由等问题撕裂这座城市和国家，白人权力将受到严峻考验。\n\
  \n## 第四章\n\n## 奴隶制必须消亡\n\n### *华盛顿人身束缚的动荡终结，1836–1862 年*\n\n无论各州情况如何，哥伦比亚特区的奴隶制都是一件国家事务——我们的事务。\n\
  \n——*北极星报*，1848 年 5 月\n\n位于 F 街西北、第四街与第五街之间的国家建筑博物馆，是一座令人惊叹的红砖建筑，占据了司法广场地铁站对面整整一个街区。该建筑由蒙哥马利·梅格斯于\
  \ 19 世纪 80 年代设计，用于容纳抚恤金管理局（负责照顾内战老兵），其设计模仿了罗马的米开朗基罗法尔内塞宫，内部有一个巨大的中央大厅，设有 75 英尺高的大理石科林斯柱和一座优雅的喷泉。¹\n\
  \n\n\n\n19 世纪 40 年代至 50 年代，如今博物馆所在的位置曾矗立着一座更为朴素的建筑：臭名昭著的华盛顿特区监狱。这座建于 1839 年的三层监狱位于地块东北角，正对\
  \ G 街，因其灰泥墙涂着丑陋的浅蓝色而被戏称为“蓝壶”。监狱装有铁栅栏窗和百叶窗，提供石砌牢房，还有一个用于关押重刑犯的“铁笼”。监狱后方，穿过如今的大厅和司法广场，一条台伯河的黏滑支流缓缓流向市政厅。²\n\
  \n台伯河在现代华盛顿已从视野中消失，被埋入地下管道。但它曾一度主宰市中心，从西北部士兵之家附近的一股细流，逐渐扩展为宽达八百英尺的水域，最终在白宫前汇入波托马克河。尽管这个名字带有古典韵味（这片土地原本属于一个名为“罗马”的种植园，其主人为这条小溪命名），但到了\
  \ 19 世纪中期，台伯河已变得污秽不堪。它流入华盛顿市运河——这条运河建于 1815 年，是皮埃尔·朗方规划中连接波托马克河与东支流的一部分。一位华盛顿居民回忆道，台伯河“以可耻的停滞状态横穿城市，最终穿过绿色浮渣和黏液，渗入更加可耻的运河，而这条运河本身就是一个露天污水沟和化粪池，是所有污秽之物的\
  \ receptacle，是城市的害虫滋生地和耻辱。”³\n\n这条恶臭的运河象征着城市本身的经济停滞。到 19 世纪中期，华盛顿显然未能实现乔治·华盛顿对商业枢纽的梦想。地方领导人曾试图修建切萨皮克与俄亥俄运河，希望将波托马克河与俄亥俄河连接起来，从而打开通往西部市场的门户，但这一不幸的努力几乎让城市破产。他们向切萨皮克与俄亥俄运河公司投入了\
  \ 150 万美元的公共资金（按 21 世纪美元计算超过 4.14 亿美元），并借款支付城市债务的利息，但成本失控。到 1834 年，华盛顿市负债超过 170\
  \ 万美元，需要国会救助。巴尔的摩与俄亥俄铁路的迅速崛起使这条运河在 1850 年部分完工之前就已过时。⁴\n\n波托马克河和东支流的淤塞加剧了城市的经济问题，而缺乏良好的交通使得城市未能发展出重要的私营产业。1812\
  \ 年战争后的几十年里，华盛顿逐渐依赖联邦政府，涌现的企业也往往服务于政府工作人员和项目。1820 年至 1850 年间，华盛顿的人口翻了一番多，从 23,336\
  \ 人增至 51,687 人，但在一个惊人快速发展的时代，它未能跟上其他城市地区的步伐——纽约人口翻了两番，超过 50 万；新奥尔良增长了近七倍，达到 11.6\
  \ 万；辛辛那提从不到 1 万人增长到超过 11.5 万。华盛顿在 1820 年曾是全国第九大城市，但三十年后跌至第十八位。⁵\n\n英国作家查尔斯·狄更斯在\
  \ 1842 年访问时曾著名地贬低华盛顿为“宏伟意图之城”。“宽阔的大道始于虚无，通向无处；长达一英里的街道，只缺房屋、道路和居民；公共建筑只缺公众来完善；以及大道的装饰物，只缺大道来装饰——这就是它的主要特征。”由于人口稀少，商业“几乎不值一提”，一位爱尔兰作家在\
  \ 1855 年直言不讳地总结道：“联邦首府必须被视为一个明显的失败。”⁶\n\n这座城市还饱受严重犯罪之苦，尤其是在沿运河和台伯河发展起来的某些粗野街区，包括爱尔兰人的据点斯旺普德尔（今联合车站以北）和红灯区谋杀湾（今联邦三角区）。由于从犯罪猖獗的街头不断抓获小偷、斗殴者和妓女，“蓝壶”频繁使用。\n\
  \n但“蓝壶”不仅仅是关押轻罪犯的场所。这座苍白的碍眼建筑也是日益激烈的奴隶制戏剧的中心舞台。尽管国会试图用“钳口规则”压制公开辩论，但关于首都奴隶制的问题并未消亡。沮丧的废奴主义者无法克服他们所谓的“奴隶权力”，于是转入“地下”，帮助华盛顿地区的奴隶逃往自由。随着越来越多的被奴役者“潜逃”（逃亡者广告中常用的术语），城市领导人试图通过抓捕和惩罚逃亡者来维护这种特殊制度。\n\
  \n他们采取的一种有争议的方式是将疑似逃亡者投入“蓝壶”——即使他们是自由人。“在华盛顿，”难以置信的狄更斯写道，“任何治安法官都可以给任何走在街上的黑人戴上镣铐，并把他投入监狱：黑人的任何罪行都不需要。法官说：‘我认为此人是逃亡者，’然后把他关起来。公众舆论授权法官在这样做之后，在报纸上刊登广告，警告他的主人来认领他，否则他将被卖掉以支付监狱费用。但假设他是一个自由黑人，没有主人，人们自然会认为他会被释放。不：他被卖掉以补偿他的狱卒。”⁷\n\
  \n1826 年至 1828 年间，共有 101 名逃亡者被关进“蓝壶”。其中，81 人被送还主人，15 人被证明是自由人后获释；其余 5 人无人认领，被卖掉以支付监狱费用。⁸\n\
  \n对于废奴主义者来说，随着 1848 年与墨西哥短暂而胜利的战争结束后，关于奴隶制的全国辩论愈演愈烈，“蓝壶”逐渐成为奴隶制罪恶的象征。关于是否允许在新获得的西部领土上实行奴隶制的问题，任何钳口规则都无法压制，而国家的两大政党——民主党和辉格党——开始沿着地区界线分裂。奴隶制主导了国会辩论，导致俄亥俄州众议员威廉·索耶在\
  \ 1849 年一次关于华盛顿特区奴隶贸易的辩论中抱怨道：“早上是黑人——中午是可怜的黑人——到了晚上，这个黑人又被强加给我们。”⁹ 随着国家危险地滑向内战，奴隶制的反对者和捍卫者将华盛顿置于美国人类奴役斗争的前线。\n\
  \n### *“地下铁路”：华盛顿特区跨种族反奴隶制社区的发展*\n\n托马斯·斯莫尔伍德和查尔斯·T·托里是一对不太可能的搭档。在一个很少有人与另一种族成员建立真正关系的时代，斯莫尔伍德和托里却有着相互钦佩的纽带。斯莫尔伍德\
  \ 1801 年出生于乔治王子县，生而为奴，童年时学会了读写，并攒够了钱在三十岁时赎回了自由。他搬到华盛顿，参与反奴隶制活动，担任奥尔巴尼《自由警钟》报的当地通讯员。作为一个反传统和持异议者，他对当地黑人神职人员的怯懦感到愤慨，并质疑白人废奴主义者的动机。他相信更激进的斗争策略，他的妻子伊丽莎白也是如此——她是一位自由的黑人弗吉尼亚人。伊丽莎白在西北第十三街的一家寄宿公寓工作，该公寓由一位名叫帕吉特夫人的反奴隶制白人女性经营。帕吉特夫人的一位寄宿者是一位名叫查尔斯·T·托里的新英格兰白人废奴主义者。\n\
  \n\n\n\n托里曾在埃克塞特和耶鲁求学，他书卷气十足却胆识过人，是个热情洋溢、有时甚至鲁莽的年轻人。二十八岁时他来到华盛顿，担任北方几家报纸的当地通讯员。1842\
  \ 年初，他因参加黑人教堂活动并闯入安纳波利斯的一场奴隶主大会而立即激怒了白人精英。他被拖出会场并投入监狱，在那里遇到了一个黑人家庭的十三名成员，他们被拘留等待被送回奴隶制。怀着成为下一个威廉·劳埃德·加里森的愿景，托里写下充满激情的信件，谴责奴隶主是“人类鬣狗”，并宣称：“如今上帝已在安纳波利斯监狱的墙上写下……‘奴隶制必须灭亡。’”托里返回华盛顿后，伊丽莎白·斯莫尔伍德安排这两位鲁莽的活动家会面，随着反奴隶制运动转向新方向，他们成为了坚定的盟友。¹⁰\n\
  \n托马斯·斯莫尔伍德鄙视大多数废奴主义者，却视托里为“挚友”。他们挑战了华盛顿反奴隶制社区的主流情绪。在 1835 年“雪暴动”及其后对自由黑人的镇压，以及\
  \ 1836 年国会实施“禁言规则”之后，华盛顿的许多反奴隶制活动家认为在可预见的未来废除该市的奴隶制希望渺茫。作为回应，一些白人废奴主义者利用北方富人的资金购买个别奴隶并给予他们自由。斯莫尔伍德和托里鄙视这种想法——他们认为购买奴隶只会使不道德的体制合法化并使其致富。相反，他们寻求更直接、更具对抗性的行动。\n\
  \n在伊丽莎白·斯莫尔伍德和帕吉特夫人的支持下，托马斯·斯莫尔伍德和托里策划并实施了秘密逃亡，帮助华盛顿地区有意愿的奴隶通过一个由安全屋组成的地下网络逃往北方获得自由。“有人发誓说有一条‘地下铁路’，他们通过它‘在地下’旅行，”俄亥俄州的废奴主义代表约书亚·吉丁斯写道，“妇女和儿童……整个家庭都消失了。”后来被称为“地下铁路”的并非由废奴运动领袖协调的全国性网络；相反，它由无数地方网络组成，涉及黑人和白人活动家的小型小组，他们有时与更北方的其他废奴主义者和慈善家保持松散联系。¹¹\n\
  \n当地地下铁路的成功依赖于华盛顿自由和受奴役黑人的勇气与人脉，以及白人盟友的战略性协助。华盛顿地区的逃亡者经常求助于当地的“ conductors”，例如伦纳德·格莱姆斯，他是一名自由黑人马车夫，住在西北区\
  \ 22 街与 H 街拐角处。格莱姆斯肤色较浅，足以冒充白人，他在特区长大，经常为白人奴隶主工作，驾车带他们前往邻近各州。目睹了受奴役者所忍受的可怕条件后，他致力于帮助逃亡者获得自由。他在\
  \ 1839 年于北弗吉尼亚被捕前帮助了许多逃亡者，并在监狱服刑两年。（格莱姆斯家的位置如今在乔治华盛顿大学校园内设有一块纪念牌匾。）¹²\n\n斯莫尔伍德和托里扩大了华盛顿的地下铁路。两人声称在合作的两年内帮助了\
  \ 150 名奴隶逃脱。在几次与法律的惊险擦肩而过后，托里于 1844 年 6 月在巴尔的摩被捕，被指控协助逃亡者。再次入狱后，他成为全国废奴主义者眼中的英雄，但监禁期间他的健康状况迅速恶化。他于\
  \ 1846 年在狱中死于肺结核。斯莫尔伍德逃离该市前往加拿大，在那里开了一家五金店，撰写了一本自传，并成为多伦多日益壮大的黑人社区的主要成员。¹³\n\n尽管斯莫尔伍德和托里的合作戛然而止，但地下铁路依然存在，受奴役者在整个\
  \ 1840 年代和 1850 年代继续寻求摆脱主人的自由。“奴隶们几乎每天都在逃离特区，”白人废奴主义者西奥多·韦尔德于 1842 年抵达该市时兴奋地写道。逃亡者有时会在当地教堂找到避难所，包括乔治敦的锡安联合卫理公会教堂。锡安山的成员将逃亡奴隶藏在教堂墓地（位于西北区\
  \ Q 街）的一个墓穴中，教堂记录中注明了被“带走”（被奴隶巡逻队抓获）、“离开”（逃往北方）或“失踪”的成员。¹⁴\n\n逃亡奴隶以及被奴隶贩子诱捕的自由黑人，常常寻求富有同情心的白人盟友帮助，通过地下铁路或法庭逃脱。一位弗吉尼亚奴隶主抱怨说，华盛顿的黑人利用白人律师“窥探每个人对其黑人的所有权”。其中一位律师是大卫·霍尔，他于\
  \ 1820 年来到华盛顿，跟随导师、殖民倡导者伊莱亚斯·考德威尔学习法律。霍尔后来摒弃了殖民思想，成为反奴隶制活动家，有时会购买奴隶以给予他们自由。他为约翰·布什提供了法律援助，布什是一名自由黑人，因在\
  \ 1843 年的一次逃亡中帮助斯莫尔伍德和托里而被捕，霍尔最终使他无罪释放。¹⁵\n\n全国知名的白人废奴主义者也参与了当地的地下铁路。来自俄亥俄州的好斗边疆人、众议员约书亚·吉丁斯或许是国会中最具对抗性的反奴隶制成员。他与其他反奴隶制代表和活动家一起住在安·斯普里格的东北区第一街寄宿公寓，他们称之为“废奴之家”。通过公开谴责奴隶制以及为个别奴隶所做的幕后个人努力，吉丁斯和他的同住者们为决心获得自由的受奴役黑人提供了道义和物质支持。¹⁶\n\
  \n华盛顿跨种族反奴隶制社区日益壮大，加速了亚历山大市回归弗吉尼亚的呼声。许多居民希望将波托马克河以西的所有特区土地“归还”给弗吉尼亚州。随着废奴主义者在 1830\
  \ 年代中期势力增强，数千份反奴隶制请愿书涌入国会，以及越来越多的受奴役者逃亡，许多亚历山大市的白人开始将回归视为一种方式，不仅是为了获得政治权利和经济繁荣，也是为了保护他们拥有和交易奴隶财产的权利，免受一位亚历山大市写信者所称的“实验性国会”的反复无常影响。¹⁷\n\
  \n这两个核心问题——民主与奴隶制——在回归支持者心中是相互强化的。由于特区居民没有政治权利，他们无法捍卫自己的财产权——而在禁言规则时期，“财产”往往是奴隶制的委婉说法。华盛顿已成为“一个立法实验的场所……针对人民的权利和财产”，一位回归倡导者在《亚历山大公报》上抱怨道。到\
  \ 1840 年，亚历山大市的白人居民对回归的支持急剧增加。当年举行的回归公投以近三比一的优势通过。¹⁸\n\n\n\n当地的支持者将他们的诉求提交至弗吉尼亚州众议院，但这一问题却陷入了该州西部山区（那里几乎没有奴隶制）的领袖与来自东部潮水地区的奴隶主代表之间的政治角力。将亚历山德里亚并入将增强东部种植园主的力量，于是他们于\
  \ 1846 年初推动弗吉尼亚州众议院通过了回归法案。国会于同年夏天批准，9 月，亚历山德里亚的白人选民以压倒性多数（763 票对 222 票）支持回归，引发了大规模的庆祝活动。¹⁹\n\
  \n亚历山德里亚的黑人则对自己的未来忧心忡忡。“每隔一刻钟公布一次投票结果时，有色人种压抑的哀号和悲叹不断向上帝祈求帮助和救援，”自由黑人商人摩西·赫本写道。“我们预计我们的学校将全部解散，我们多年来享有的特权将被全部剥夺。”果然，回归后不到一年，亚历山德里亚的黑人学校就被关闭了。自由黑人的迁入基本停止，许多长期居民离开了这座城市。到\
  \ 1850 年，亚历山德里亚的自由黑人人口相比 1840 年的高峰下降了近 30%。该港口的奴隶贸易如今不再受联邦干预，继续增长，而废奴主义者则将注意力转向了缩水后的国家首都。²⁰\n\
  \n### *“我们立刻就能把奴隶制赶出这个特区！”：珍珠号逃亡及其后果*\n\n1848 年 4 月，华盛顿见证了美国历史上规模最大的一次奴隶逃亡企图。这场密谋始于丹尼尔·贝尔，他被一位同时代人描述为一名“健壮、可敬、勤劳”的自由黑人木匠，在海军造船厂工作。贝尔的妻子和家人（九个孩子、两个孙辈）也是自由人，但他们的前女主人正采取法律手段试图将他们夺回。绝望之下，贝尔找到了威廉·卓别林，后者接替已故的查尔斯·托里成为华盛顿最引人注目的白人废奴主义者。卓别林是马萨诸塞州的律师，也是独立战争英雄的孙子，他来到华盛顿担任反奴隶制报纸《奥尔巴尼爱国者报》的编辑。卓别林与贝尔合作，为一次精心策划的逃亡安排了资金，参与其中的还有一位名叫丹尼尔·德雷顿的、不务正业的白人费城船长。²¹\n\
  \n计划是让德雷顿驾驶他的纵帆船“珍珠号”装载一批木材驶入华盛顿。卸下木材后，他将用逃亡的奴隶装满船只，沿切萨皮克湾南下，然后北上驶向自由之地。为了招募愿意逃亡的人，贝尔找到了盟友：保罗·詹宁斯（詹姆斯·麦迪逊的前奴隶，当时担任参议员丹尼尔·韦伯斯特的贴身男仆）和塞缪尔·埃德蒙森（马里兰州蒙哥马利县一位自由黑人农民的儿子，本人仍是奴隶）。²²\n\
  \n逃亡的时机具有丰富的象征意义。到 4 月初，关于二月革命的消息已传过大西洋，这场革命为法国带来了民主的希望。4 月 13 日，“珍珠号”在华盛顿停靠时，民主党举办了一系列庆祝革命的活动。在一次露天演讲中，密西西比州参议员亨利·富特高呼：“暴君和奴隶制的时代正迅速走向终结。”富特认为，法国发生的一切为世界“提供了普世建立公民和宗教自由的承诺”。华盛顿的奴隶们当然希望如此。到\
  \ 4 月 15 日黎明前“珍珠号”准备出发时，已有 76 人爬上船，其中包括 13 名儿童、至少一位前第一夫人多莉·麦迪逊的奴隶，以及塞缪尔·埃德蒙森的五个兄弟姐妹。²³\n\
  \n船于当天清晨起航，但立即遇到了麻烦。风停了，潮水涌来，船随波逐流，浪费了逃亡者希望领先于追捕者的宝贵时间。周日早晨，全城的奴隶主醒来发现自己的奴隶失踪后，立即组织了一支追捕队。他们从一个名叫迪格斯（可能对逃亡者心怀不满）的黑人奴隶那里获得了关键信息。据《纽约先驱报》一位记者激动地报道，三十名“武装到牙齿”的人征用了一艘船，追赶“珍珠号”，在\
  \ 140 英里后追上了它——当时它正停泊在马里兰州瞭望角附近的水域，那里是波托马克河汇入切萨皮克湾的地方。他们未流一滴血就俘虏了“珍珠号”上的乘客和船员，随后返回华盛顿。\n\
  \n“他们返回共和国首都被视为一场胜利，”一位目击者写道。“船在第六街码头靠岸后，一股狂喜席卷全城”，逃亡者被押往“蓝罐”监狱。一群白人暴徒袭击了这群人，尤其将怒火倾泻在德雷顿和“珍珠号”上的另外两名白人船员身上。由于无法阻止他们被安全关押，愤怒的白人华盛顿人转而将注意力投向其他被认为是同谋的白人活动家。接下来的一周，众议员吉丁斯多次受到威胁，但暴徒主要针对该市唯一一家反奴隶制报纸《国家时代报》，华盛顿的许多人——包括一些国会议员和总统詹姆斯·波尔克本人——都认为该报煽动了这次逃亡。²⁴\n\
  \n《国家时代报》由加马利尔·贝利于一年前创办，他是一位主张渐进式解放的温和派人士。该报拒绝诋毁南方奴隶主，发行量很大，甚至在南方也是如此。（该报后来因连载哈里特·比彻·斯托的小说而全国闻名，这部小说讲述了一个具有耶稣般承受苦难和宽恕能力的奴隶的故事。该系列于\
  \ 1851 年 6 月首次发表，一直持续到 1852 年 4 月，大受欢迎，斯托随后将其以书籍形式出版，名为《汤姆叔叔的小屋》。）但贝利相对温和的反奴隶制信仰并未平息暴徒的怒火——此时暴徒已达数千人——他们多次试图摧毁该报的印刷机，但都被当地辅助警卫队阻止。一个分裂的小团体试图给虚弱的贝利涂上柏油并粘上羽毛，但贝利在他家前廊直面暴徒，说服了成员们他与这次逃亡企图无关。²⁵\n\
  \n贝利避免了报复，但被俘的“珍珠号”逃亡者的命运则是迅速而可怕的。一位反奴隶制记者写道，仅仅十天内，他们全部“被卖掉并分散到南方各地”。少数有关系的奴隶被同情他们的白人买下。丹尼尔·贝尔的妻子和两个孩子被当地白人废奴主义者托马斯·布莱格登买下并释放；两名埃德蒙森姐妹因肤色白皙、容貌美丽而被估价高于其他奴隶（2400\
  \ 美元），这引发了一场大规模的北方筹款活动，筹得的资金足以买下她们的自由。然而，对于绝大多数人来说，这次绝望的自由尝试最终导致了他们在南方腹地的悲惨生活。²⁶\n\
  \n\n\n\n\n被称为“*珍珠号*事件”的这次逃亡尝试加剧了南北之间的紧张局势，该地区许多惊恐的奴隶主纷纷抛弃了他们的奴隶。在*珍珠号*事件后的两年里，奴隶销售量急剧上升。“几乎每天都有成队的戴着镣铐的奴隶穿过这座城市，”威廉·查普林在\
  \ 1850 年春天写道。*珍珠号*成为废奴主义者集结的号角。“这 77 人‘征服’自由的尝试，是多年来反奴隶制事业中最伟大的事件，”查普林写道。“如果我们废奴主义者抓住机会，就能立刻将奴隶制赶出这个特区！”逃亡者被捕后不久，一份在波士顿各地散发的募捐传单宣称：“无论各州情况如何，哥伦比亚特区的奴隶制都是一项全国性事务——我们的事务。”²⁷\n\
  \n在众议员约书亚·吉丁斯的领导下，国会中的反奴隶制成员将*珍珠号*事件与欧洲的民主革命联系起来，并更加明确地谴责华盛顿的奴隶制和奴隶贸易。在众议院会议上，吉丁斯为被奴役者使用暴力保护自己的权利辩护，令南方人震惊：“如果我是一个有色人种，就像我现在是白人一样，我会毫不犹豫地杀死任何试图抓住我并奴役我的奴隶捕手。”1848\
  \ 年 12 月，吉丁斯提出一项法案，要求在特区就奴隶制举行全民公投，由*所有*男性居民——包括白人和黑人、自由人和被奴役者——投票。吉丁斯呼吁黑人选举权，这吓坏了他的国会同僚，他们迅速搁置了此事。《国家时代》的加马利尔·贝利批评吉丁斯的法案“旨在激起强烈的敌意”。²⁸\n\
  \n就在吉丁斯的奴隶制公投提案夭折几周后，他在“废奴之家”的一位室友提出了一个截然不同的方案，旨在终结特区的奴隶贸易和奴隶制。亚伯拉罕·林肯是来自伊利诺伊州的一位瘦削的跛脚鸭众议员，这是他第一个也是唯一一个任期的最后会期。在华盛顿的短暂时间里，林肯亲眼目睹了奴隶制的残酷本质——国会大厦附近的奴隶围栏、废奴之家一名雇佣奴隶被绑架、以及*珍珠号*逃亡者被贩卖。尽管他与吉丁斯一样在道德上反对奴隶制，但他倾向于不那么激进的策略，并寻求一种政治上可行的解决方案，既能获得特区白人居民的支持，也能赢得国会中南方人和北方人的支持。他长期以来一直同意废奴主义者的观点，即国会有权在首都废除奴隶制，但他坚持认为，只有在特区人民支持的情况下才能行使这一权力。²⁹\n\
  \n林肯提出了渐进式、有补偿的解放方案，该方案只有在特区选民批准后才能生效。他的法案包括一项豁免条款，允许拥有奴隶的国会议员在任职期间保留被奴役者。在提出该法案之前，他会见了特区市长威廉·西顿，并相信西顿和其他地方领导人会支持该法案。然而，当林肯后来得知南方国会议员说服西顿市长反对该法案时，他放弃了这个问题。林肯从未正式提出这项立法，而是将注意力从特区解放转向阻止奴隶制向西部领土扩张。³⁰\n\
  \n1849 年初林肯离开国会后，华盛顿围绕奴隶制的紧张局势升级。这一问题成为最终促成 1850 年妥协案谈判中的最后症结之一。1850 年妥协案是一系列法案的总和，共同帮助避免了迫在眉睫的地区战争。在肯塔基州垂死的参议员亨利·克莱的引导下，1850\
  \ 年妥协案接纳加利福尼亚州作为自由州加入联邦，并禁止在华盛顿进行奴隶贸易——这是对北方的两项重要让步。作为交换，反奴隶制的国会议员不得不接受一项更严厉的《逃亡奴隶法》，这是南方白人的首要目标之一。根据新法律，如果北方人被发现在帮助逃亡者，他们将承担刑事责任。该法律赋予奴隶主前往北方并强行带走他们声称属于自己奴隶的权力；废奴主义者的回应是将地下铁路延伸至加拿大。\n\
  \n1850 年妥协案将联邦从几乎必然的灾难中拯救出来，但它并未解决华盛顿的种族问题。尽管华盛顿的黑人居民及其废奴主义盟友为城市奴隶贸易的终结而欢欣鼓舞，但他们的胜利是有限的。华盛顿不再作为州际奴隶贸易的中转站，但这意味着的实际影响可能比表面看起来要小。奴隶贩子并没有倒闭；他们只是越过波托马克河，在对岸继续他们的生意。四年前导致亚历山大市回归弗吉尼亚的白人民主运动，限制了奴隶贸易禁令的影响。正如废奴主义者威廉·杰伊所哀叹的那样：“禁止进口奴隶出售，确实为国家首都的*声誉*赢得了一些东西，但对人道事业毫无帮助，因为这种交易只是从华盛顿转移到了亚历山大。”³¹\n\
  \n奴隶贸易条款仅禁止将奴隶从蓄奴州*进口*到华盛顿再转售到其他地方。城市居民仍然可以买卖*本地*奴隶，包括在公开拍卖中，而且在奴隶贸易禁令生效很久之后，游客们仍然会偶尔看到戴着镣铐的奴隶队伍艰难地穿过街道。尽管华盛顿被奴役人口的比例继续下降，就像几十年来一样——1850\
  \ 年，不到 27%的黑人人口是被奴役的；到 1860 年，仅略高于 22%——但奴隶制在华盛顿仍然非常显眼，而且该制度背后有强大的政治和经济利益支持。³²\n\
  \n《逃亡奴隶法》使逃跑变得更加危险，但华盛顿及周边地区的许多被奴役者仍然通过逃亡来争取自由。像安东尼·鲍恩这样的华盛顿黑人居民挺身而出帮助他们。鲍恩 1809\
  \ 年出生于马里兰州，生而为奴，他从主人那里租用自己，攒了 425 美元于 1830 年赎回了自由。后来他也赎回了妻子的自由。他搬到华盛顿，在美国专利局找到一份职员工作，并在西南区\
  \ E 街 85 号安家，离今天的联邦中心地铁站不远。鲍恩的家成为黑人组织活动的中心。1853 年，他开始为后来成为全国第一个黑人基督教青年会的组织举办会议；三年后，他开始为一个名为圣保罗协会（后来称为圣保罗教堂）的新宗教机构举行礼拜。这所房子也成为逃亡奴隶的避难所，他们乘船抵达第六街码头，鲍恩会在那里迎接他们并迅速将他们带到安全地带。³³\n\
  \n\n\n\n\n逃亡者自身面临着巨大的风险。安娜·玛丽亚·威姆斯是一名 15 岁的被奴役女孩，一位废奴主义者形容她为“肤色明亮的混血儿，身材匀称，聪明且相貌出众”。她住在马里兰州一座城市北部的种植园里，主人嗜酒如命，其妻子则“脾气暴躁、爱发牢骚”。当地白人废奴主义者雅各布·比奇洛与费城的黑人废奴主义者威廉·斯蒂尔合作，花费\
  \ 1000 美元买下了安娜·玛丽亚的母亲，又用 1600 美元（按 21 世纪美元计算，分别约为 3 万和 5 万美元）买下了她的姐姐，但主人拒绝放手安娜·玛丽亚。由于担心她可能试图逃跑，主人强迫她与自己及妻子同睡一间卧室。她最终在\
  \ 1855 年秋天逃脱，方法是女扮男装，化名“乔·赖特”，一路来到华盛顿，找到了比奇洛。“这座城市里到处都是煽动者，”比奇洛警告道，他们必须避开那些悬赏 100\
  \ 或 200 美元、企图诱使他人出卖逃亡者的奴隶猎人。比奇洛将威姆斯偷偷带出城，送往费城，斯蒂尔正在那里等候。他帮助她抵达纽约，并在著名废奴主义者刘易斯·塔潘的协助下，最终前往加拿大。³⁴\n\
  \n白人废奴主义者常常与她们试图帮助的逃亡者共同承担风险，尽管她们所面临的后果与被抓获的黑人所遭受的苦难相比微不足道。在《逃亡奴隶法》生效前不久，策划“珍珠号”逃亡事件的主谋之一威廉·卓别林试图帮助两名逃亡奴隶——加兰·怀特和艾伦，这两人分别属于佐治亚州的两位美国参议员。当他们穿过哥伦比亚特区边界进入马里兰州银泉市时，三人遭遇了一队全副武装的警察和私人奴隶捕手。在一场激烈的枪战后，卓别林被捕。富有的废奴主义朋友为他支付了保释金，但他离开了这座城市前往纽约，再也没有回来。那两名逃亡者的境遇则没那么好。艾伦被抓获并立即送还给了他的主人。怀特逃跑了，但最终自首，当局强迫他重新沦为奴隶。（他后来再次逃脱，并在内战中担任了一个黑人团的随军牧师。）³⁵\n\
  \n被奴役的人们也通过自我赎身来追求自由。在整个战前时期，尤其是 19 世纪 50 年代，奴隶家庭共同努力为个别成员赎买自由。尽管这需要多年时间，并且常常需要白人中间人或自由黑人亲属的介入，但自我赎身为黑人家庭提供了一条相对安全且合法的途径，使他们能够保持完整并最终共同享受自由。由于所需的自由证书费用为\
  \ 50 美元且难以获得，通过这种方式赎身的家庭成员并不总能登记为法律上的自由人。在法律眼中，他们仍处于被奴役状态，但他们享有自由的特权，并以自由男女的身份生活。被奴役者通过自我赎身追求自由的主动性，可能有助于说服雅各布·比奇洛和其他当地白人废奴主义者放下对这一做法的个人疑虑。到\
  \ 19 世纪 50 年代初，他们开始利用北方废奴主义者的财富，为哥伦比亚特区的奴隶赎买自由。³⁶\n\n华盛顿的跨种族反奴隶制活动家网络也合作改善了城市中自由黑人的生活。这种合作的一个例子是私立有色人种女子学校，该校于\
  \ 1851 年 12 月开学，最初只有六名学生，挤在西北区第十一街与纽约大道交汇处一栋住宅内一间 14 平方英尺的房间里。学校的创办人是一位严厉且体弱多病的白人纽约人，名叫默蒂拉·迈纳。她\
  \ 36 岁，单身，性格倔强固执。19 世纪 40 年代在密西西比州教书时，迈纳亲眼目睹了奴隶制的恐怖。这段经历使她转变为一名废奴主义者，迈纳回家后致力于教育自由黑人女孩，她相信这些女孩将教导未来一代曾被奴役的人如何充分利用他们的自由。她选择在华盛顿——最南端且合法办学的城市——开办一所学校。³⁷\n\
  \n迈纳的办学计划最初让一些当地废奴主义者感到担忧。《国家时代》的加马利尔·贝利无视了她的求助请求，而黑人教育家约翰·F·库克——他本人已为黑人儿童建立了一所学校——担心“任何带有废奴色彩的东西”都会遭到抵制。但雅各布·比奇洛提供了帮助，迈纳主要依靠北方废奴主义者的启动资金开办了学校。随着学校的发展，她赢得了这座城市跨种族反奴隶制社区的支持。尽管面临许多白人反对者的威胁，迈纳和她跨种族的教师团队并未回避争议。学生们学习传统科目，如家政学和“三\
  \ R”（读、写、算），同时也学习政治——他们阅读弗雷德里克·道格拉斯的《北极星》、威廉·劳埃德·加里森的《解放者》以及其他废奴主义文学作品。当地的“流氓”在街上威胁她的学生，并试图将迈纳赶出城，但她拒绝被吓倒。她睡在学校楼上，手边放着一把左轮手枪。“想袭击我的学校？你们不敢！”她对一群潜在的袭击者喊道。“没有法律禁止我教这些人，我就要教他们，哪怕死也要教！”³⁸\n\
  \n迈纳的有色人种女子学校，如同安娜·玛丽亚·威姆斯勇敢逃往加拿大一样，展示了内战前十年间跨种族合作的程度。尽管几乎所有的美国白人都被灌输了优越感，但像默蒂拉·迈纳和雅各布·比奇洛这样的白人废奴主义者，在大多数白人同龄人只能将黑人男女视为奴隶或仆人的时代，与哥伦比亚特区的黑人并肩工作并为他们服务。他们的跨种族努力之所以更加引人注目，是因为这一切发生在该市——如同整个国家一样——在\
  \ 1850 年妥协案之后经历种族与政治紧张局势不断升级的时期。\n\n### *没有“避难之城”：白人官员打压华盛顿自由黑人*\n\n很少有华盛顿白人拥护废奴主义。该市白人领导层中更具代表性的是像沃尔特·莱诺克斯这样的人。莱诺克斯在华盛顿出生并长大，是一位苏格兰裔美国木匠的儿子，其父通过投资华盛顿特区房地产发家。在耶鲁大学就读后，他回到家乡从事法律和政治事业。他留着胡须，发际线逐渐后退，以风流倜傥著称，与他的朋友（后来的市长）理查德·沃勒克合住一间热闹的单身公寓。莱诺克斯在地方政坛迅速崛起。他\
  \ 25 岁当选市议员，不久后成为市参议会主席，随后在 1850 年市长选举中以 33 岁的年龄险胜。³⁹\n\n莱诺克斯的竞选活动开启了地方政治中一个动荡的党派时代。1848\
  \ 年，在围绕托马斯·卡伯里当选的民主浪潮过去一代人之后，经过全国范围内长达数十年的争取全体白人男性普选权的努力，国会取消了投票的经济障碍，将选举权扩大到所有在该市居住至少一年的白人男性。这对地方选举的影响是巨大的——市长选举中的投票数翻了一番多，随着贫穷白人男性涌向投票站，选举变得更加党派化和竞争激烈。莱诺克斯在\
  \ 1850 年获胜，但两年后就被赶下台；19 世纪 50 年代，哥伦比亚特区没有一位市长赢得连任。⁴⁰\n\n\n\n\n莱诺克斯在导致 1850 年妥协案的激烈辩论中就职。与肯塔基州参议员亨利·克莱一样，他是辉格党成员，认为维护联邦——以华盛顿为首都——是国家的首要任务。但莱诺克斯与华盛顿其他白人领袖一样，也是同情南方的奴隶主。事实上，大多数华盛顿白人自视为南方人，当国会中的党派冲突带上地区色彩时，他们倾向于站在南方一边。尽管包括市长西顿在内的一些知名人士曾支持禁止奴隶贸易以转移对城市的批评，但他们对于国会以不民主的方式强加其意志感到愤怒。\n\
  \n奴隶贸易禁令引发了一个令人不安的问题：如果国会有权取缔华盛顿特区的奴隶贸易，那么奴隶制本身是否会是下一个目标？哥伦比亚特区的奴隶制或许并非一个正在发展的制度，但它是南方权力的关键晴雨表。对于害怕被人口更多、增长更快的北方在政治和经济上主导的南方人来说，未能捍卫国家首都的奴隶制将意味着南方注定永远软弱。当佐治亚州立法机构列出其认为值得脱离联邦的具体罪行时，在华盛顿结束奴隶制位列榜首。⁴¹\n\
  \n当地白人官员还担心该禁令会引发自由黑人涌入城市。由于拥有长期存在的自由黑人社区、政府职位、小而重要的学校网络、相当数量的黑人企业以及各种黑人经营的教堂，哥伦比亚特区已经吸引了来自周边地区的自由黑人移民。华盛顿特区超过一半的黑人居民来自马里兰州或弗吉尼亚州。在\
  \ 1840 年代，华盛顿的自由黑人人口增长了近 55%，超过一万人——几乎占城市总人口的 20%，占黑人居民近四分之三。如今，随着禁令生效，乔治城市长亨利·艾迪生等白人领袖担心自由黑人会“蜂拥至哥伦比亚特区，如同逃往避难之城”。⁴²\n\
  \n田纳西州参议员（后来的总统候选人）约翰·贝尔在最后一次试图破坏华盛顿特区奴隶贸易禁令的努力中解释道，事态已刻不容缓。“如果有色人种人口在未来以过去几年的比例增长，它很快就会成为该地区无法忍受的祸害，”他警告说。“白人居民，除非国会行使权力，否则将被迫选择要么用武力驱逐他们，要么成为持续混乱的牺牲品。两者必有一方屈服。”与华盛顿特区的许多白人领袖一样，贝尔参议员承诺只有在有条款将解放的奴隶“迁出”该国的情况下，才支持在特区解放奴隶——这是殖民主义者三十多年来的梦想。⁴³\n\
  \n表 2 华盛顿的黑人人口，1830–1860 年\n\n![Image](img/t0001-02.jpg)\n\n由于无法阻止奴隶贸易禁令，莱诺克斯市长和华盛顿特区的民选官员齐心协力阻止黑人迁入城市。从\
  \ 1850 年底开始，他们通过了一系列对黑人法典的修正案，以降低自由黑人的生活吸引力。黑人移民必须在抵达后五天内向市政官员登记，否则将面临罚款并被驱逐出城。秘密会议被禁止，黑人的任何公开会议都必须得到市长亲自批准。自由黑人居民还必须支付\
  \ 50 美元购买自由证书，这一措施旨在使他们定居城市的成本高得令人望而却步——50 美元相当于熟练工人几个月的工资。⁴⁴\n\n这些立法调整伴随着选择性且残酷的执法。妥协案通过后不久，华盛顿市议会将警力扩大了一倍。在整个\
  \ 1850 年代，黑人被捕的可能性是白人的三倍。纽约记者弗雷德里克·劳·奥姆斯特德报道了一起事件，涉及 24 名“体面的有色人种男子”在一次秘密会议中被发现。“他们会议的目的似乎纯粹是慈善性质的，”奥姆斯特德写道，但他们被逮捕并带到地方法官面前。这些人被发现携带一本圣经，以及一份用于购买一名被奴役妇女自由的“认捐书”。令奥姆斯特德震惊的是，其中一名被奴役的男子被判处鞭刑，另外四人被送进济贫院。其余每人被罚款\
  \ 111 美元——按 21 世纪美元计算超过 3500 美元——然后被释放。⁴⁵\n\n黑人法典和加强执法使华盛顿成为一个更严酷、更不宽容的城市。作为回应，黑人向城市的迁移放缓。经过几十年的显著增长，在\
  \ 1850 年代，自由黑人人口仅增加了一千多一点，增幅仅为 10%，而白人人口增长了 60%。与此同时，被奴役人口下降了超过 13%，因为许多奴隶主决定出售或解放他们的奴隶，而不是等待国会可能禁止奴隶制。到\
  \ 1860 年，城市中黑人的比例降至不到 20%——这是华盛顿历史上（无论之前还是之后）的最低点。⁴⁶\n\n在这样的环境下，迈尔蒂拉·迈纳的“有色人种女孩学校”成为了目标。1856\
  \ 年底，迈纳开始筹集资金建造一所寄宿学校，为自由黑人学生提供中等教育和教师培训。这一扩建计划引发了强烈反对，最终摧毁了学校。带头的是前市长沃尔特·莱诺克斯。莱诺克斯担心这所寄宿学校会吸引来自整个地区的黑人移民，直到他在\
  \ 1857 年初写给《国家情报员》的一封信中警告说，“我们的特区将被他们淹没”。莱诺克斯继续说道，教授黑人学生“超出初级课程”的内容将导致社会动荡，因为这会造就“一个不安分的人口，比以往更不愿意接受社会分配给他们的地位”。白人的反对成功削弱了学校，迈纳很快放弃了她的扩建计划。她本就不佳的健康状况在\
  \ 1850 年代末急剧恶化，她离开城市休养。她离开后，入学人数减少，学校于 1860 年关闭。⁴⁷\n\n### *“值得尊敬的白人”：爱尔兰移民、一无所知党与白人华盛顿的政治暴力*\n\
  \n仅靠法律无法解释 1850 年代华盛顿黑人人口的相对下降。另一个因素是移民。华盛顿开始吸引成千上万的外国出生的白人劳工，这在很大程度上归功于联邦建筑热潮，旨在巩固联邦，并在\
  \ 1850 年妥协案后展示对维护国家统一的新承诺。除了期待已久的国会大厦扩建外，国会还资助了几个劳动密集型项目，包括新的引水渠和下水道系统。由于如此多的公共建筑，对各种劳工的需求很大，包括熟练工和非熟练工、移民和本地人。整个国家在\
  \ 1850 年代经历了移民热潮，但华盛顿的外国出生人口增长速度是全国速度的 1.5 倍，到 1860 年达到该市白人人口的 16%的峰值。⁴⁸\n\n\n\n\
  \n该市的新移民中许多是爱尔兰人。19 世纪 40 年代中期，肆虐爱尔兰马铃薯田的枯萎病在接下来的十年里将超过 120 万爱尔兰移民（主要是贫穷的天主教徒）推向了美国海岸。大多数人最终定居在波士顿、纽约和其他东北部城市，但仍有数千人南下前往华盛顿。该市的爱尔兰人口在\
  \ 19 世纪 50 年代增长了两倍多，达到约 7200 人，是第二大族群德国人（也是奴隶人口）的两倍多。弗雷德里克·劳·奥姆斯特德在 1855 年写道：“如今，爱尔兰和德国的劳工与仆人已经比*奴隶*还要多，而且白人工人的比例每年都在增加。”⁴⁹\n\
  \n这些移民来到一个已有成熟爱尔兰社区的城市，这里拥有酒馆、企业和教堂——尤其是位于西北 F 街的圣帕特里克教堂，该教堂在 1854 年任命了一位爱尔兰移民蒂莫西·奥图尔神父为牧师。许多爱尔兰人在国会山以北约半英里处、台伯河沿岸的一片沼泽地带找到了住所，那里离他们工作的建筑工地不远。起初只是一片简陋的棚屋混杂区，后来逐渐发展成为“沼泽池”（Swampoodle），这个名称是该地区两个显著特征的结合：“沼泽”（swamp）和“水坑”（puddle）。这个富有诗意的区域后来成为圣阿洛伊修斯教区的核心，并最终成为贡萨加学院高中所在地，直到\
  \ 21 世纪仍是社区的一部分。⁵⁰\n\n沼泽池地区极度爱尔兰化且极度贫困，以街头暴力、过度拥挤以及与黑人社区的冲突而闻名。尽管传奇的爱尔兰领袖丹尼尔·奥康奈尔曾谴责美国奴隶制，并将黑人的自由斗争比作爱尔兰的独立斗争，但华盛顿的爱尔兰人往往采纳当地白人的习俗，并与该市的黑人居民形成了不稳定的关系。与德国人和苏格兰人不同，大多数爱尔兰移民抵达该市时没有适销对路的技能，因此他们直接与无技能的黑人工人（无论男女）竞争。他们面临竞争劣势：无论是奴隶还是自由的黑人劳动力，通常都要便宜得多。⁵¹\n\
  \n为了对抗他们认为的不公平竞争，爱尔兰移民诉诸集体行动，与其他白人工人联合起来，迫使雇主在他们和黑人劳工之间做出选择。例如，在 1852 年初，随着联邦建筑热潮的兴起，超过\
  \ 260 名白人工人向国会请愿，要求禁止在“公共建筑中使用自由黑人和奴隶”，转而雇佣“值得尊敬的白人”，因为他们是“国家在战争或内乱时期的主要支柱”。请愿书总结道：“公职从来就不是为那种肤色的人设计的，而是为美利坚合众国的自由白人公民设计的。”⁵²\n\
  \n集体行动，加上针对自由黑人工人的法律歧视框架，帮助爱尔兰人在低技能经济中站稳了脚跟。爱尔兰女性——被刻板地称为“布里吉特”，就像黑人女佣常被称为“嬷嬷”一样——为雇主提供了自由黑人女性的替代选择，她们很快主导了家政服务市场。随着需求减少，越来越多的自由黑人女性不再迁往该市。黑人男性也是如此。著名的黑人废奴主义者弗雷德里克·道格拉斯在\
  \ 1853 年观察到：“每时每刻，我们都被挤出某些工作岗位，为那些刚从翡翠岛（爱尔兰）来的新移民腾出空间，他们的饥饿和肤色使他们享有特殊优待。这些白人正在成为家仆、厨师、管家、侍者和跑腿”——这正是黑人男性所从事的工作类型。⁵³\n\
  \n由于处于经济阶梯的底层，许多爱尔兰人强烈抵制任何将他们与黑人归为同一阶级的暗示，尽管在 1860 年，爱尔兰家庭拥有的财产仅为非爱尔兰白人华盛顿人的八分之一。他们的经济状况迫使他们从事低贱的工作，有时他们被证明是难以相处的工人。弗雷德里克·劳·奥姆斯特德在华盛顿期间注意到了爱尔兰仆人与黑人仆人之间的差异。他发现，在他住的旅馆里帮他生火的“年迈黑人”比“爱尔兰小伙子们”更随意，对顺从的形式也更漠不关心。奥姆斯特德观察到，这位黑人“火夫”并不喜欢卑躬屈膝，但他似乎更认命。他脸上带着“一种无力的愤怒表情，以及一种虚弱的神情。”⁵⁴\n\
  \n奥姆斯特德的观察揭示了自由黑人与爱尔兰移民在人生观上的深刻差异，这源于他们在获取权力方面的根本不同。尽管华盛顿为黑人居民提供了比其他南方城市更多的经济机会，但大多数自由黑人很少能指望获得比他们目前从事的低收入工作更好的机会——几乎没有向上流动的空间。事实上，通过获得自由，他们已经达到了顶峰。尽管他们自己很穷，但许多自由黑人拥有被奴役的家人，这些家人指望他们帮助。如果奥姆斯特德房间里的黑人火夫表现出“一种无力的愤怒表情”，那是因为他几乎没有经济、法律或政治机会来改变自己的处境。\n\
  \n相比之下，爱尔兰“小伙子们”抱有更高的期望。他们是自愿来到这座城市的，抵达后发现了一个成熟的爱尔兰社区，这个社区努力为他们提供工作、住房和社交网络。如果他们遇到麻烦，可以依靠为帮助穷人而建立的天主教机构网络。他们可以成为归化公民，最终投票、竞选公职，并充分参与公民事务。奥姆斯特德房间里的爱尔兰小伙子们可能对顺从表现得不那么“随意和漠不关心”，因为他们更容易想象一个不必再卑躬屈膝的未来。\n\
  \n华盛顿的爱尔兰人认为自己是白人，声称拥有与白人身份相关的特权，并且常常对有关其社会地位的轻微冒犯敏感。“他们不愿与黑人交往，”一位爱尔兰观察者写道，“他们不断努力摆脱奴役的枷锁。”然而，通过从事通常与黑人工人相关的低地位工作，肤色白皙的爱尔兰人面临着严重的阶级和宗教偏见。在\
  \ 21 世纪的美国，白人族裔界限已经模糊，但在 19 世纪中期，这些界限却格外鲜明。该地区的爱尔兰人是“一群野蛮、无纪律、好斗的人……无论男女都热衷于打架和酗酒，”一位苏格兰裔的白人华盛顿人这样概括，反映了典型的偏见。“人们相信，而且很可能确实如此，除了他们的神父，没有人能控制他们。”一位奴隶主告诉记者奥姆斯特德，爱尔兰工人“不诚实，不会严格遵守工作指示，比黑人需要更多的个人监督。”⁵⁵\n\
  \n在一年一度的圣帕特里克节游行之前，爱尔兰社区的居民经常发现附近树上挂着“填充的帕迪”。这些稻草填充的假人，空酒瓶从口袋里伸出来，利用了人们对爱尔兰人酗酒和愚蠢的刻板印象。爱尔兰工人还必须面对“愚蠢的帕迪”这一刻板印象，奥姆斯特德将其定义为“那些不太懂英语，并且因移民航行而仍然虚弱僵硬的爱尔兰人。”⁵⁶\n\
  \n\n\n\n\n爱尔兰移民的涌入重新激发了全美白人美国人的“本土主义”情绪。本土主义批评者指责爱尔兰人酗酒成性、易犯罪和暴力，并担心爱尔兰人参与政治会导致选民欺诈、集团投票，以及罗马教皇控制地方政府。华盛顿在\
  \ 19 世纪 30 年代曾经历过一场短暂的本土主义运动，但该运动拒绝了宗教偏执，部分原因是其领导层包含许多天主教徒。然而，19 世纪 50 年代的本土主义却深刻反爱尔兰、反天主教，并催生了一场神秘的全美政治运动，该运动正式名称为美国党，但后来被称为“一无所知党”。该运动最初秘密集会——当被问及该党的活动时，成员们会回答“我什么都不知道”——并在整个东北部地区扎根。“一无所知党”拒绝了两大主流政党，提供了第三条道路，吸引了许多经济上焦虑的工薪和中产阶级白人选民。\n\
  \n在华盛顿，“一无所知党”同时利用了种族偏见和阶级怨恨。随着该市投票规则的放宽，贫穷的白人男性现在有了投票权。许多本土出生的白人劳工涌向“一无所知党”，因为他们视其为反建制派；投票给这个新党，就是既反对傲慢的富裕阶层，也反对他们中间的外国天主教徒。几十年来，华盛顿的地方选举一直由\
  \ W·W·西顿这样的人主导，他是备受尊敬的《国家情报员》编辑，并在整个 19 世纪 40 年代担任市长。但随着“一无所知党”的崛起，华盛顿的市政选举变得充满对抗和仇外情绪。⁵⁷\n\
  \n在紧张的三年里，“一无所知党”为地方政治注入了戏剧性和暴力，其中大部分针对爱尔兰社区。该党在 1854 年强势掌权，赢得了市议会和市参议院的多数席位，并拿下了市长职位，尽管正如一位观察者所言，它遭到了“本社区中大多数有反思能力的人”的反对。同年发生了一起厚颜无耻的事件：一个据称与“一无所知党”有联系的团伙闯入华盛顿纪念碑建筑工地，偷走了教皇庇护九世捐赠给该项目的一块巨石，并将其扔进了波托马克河。据《晚星报》报道，在\
  \ 1856 年选举期间，一个投票站发生的插队事件演变成了一场大规模混战，其中“爱尔兰人被追打、殴打，并被石头和砖块投掷，而他们几乎没有抵抗”。当地警察中充斥着“一无所知党”的任命者，几乎未采取任何措施制止暴力。⁵⁸\n\
  \n“一无所知党”运动帮助凝聚了该市的天主教社区。华盛顿早期的天主教徒出身于马里兰州古老的蓄奴家族。贵族式的天主教领袖们竭力融入更广泛的白人社区，并倾向于将贫穷的天主教移民视为麻烦和负担。但面对来自“一无所知党”的生存威胁——不仅是在地方，也在国会——天主教社区以前所未有的方式团结起来。“我们都靠迫害为生，现在食物充足，”1854\
  \ 年《天主教镜报》的华盛顿通讯员写道。圣帕特里克教堂的蒂莫西·奥图尔神父等移民的回应是拒绝同化，并建立强大、自给自足的天主教机构。建于 1857 年斯瓦姆普德尔的圣阿洛伊修斯教堂是一座自豪的移民教堂，绝大多数信徒是爱尔兰人，它服务于劳动阶层的会众需求，并发展出广泛的社会服务，包括一家孤儿院和一家慈善协会，以照顾贫困、患病和年老者。⁵⁹\n\
  \n随着华盛顿天主教徒跨越阶级界限团结起来，他们在该市的精英领导层中找到了盟友。建制派领袖们被“一无所知党”打了个措手不及，用一位致信《晚星报》的读者的话来说，他们抨击该运动是“反美和反基督教的”。《晚星报》和《国家情报员》的编辑和读者们严厉谴责该运动，并捍卫华盛顿的天主教徒。“在所有地方，这座城市最不应该对天主教徒和归化公民抱有狭隘和排外的偏见，”一位署名“本土新教徒”的人在《国家情报员》中写道，并指出诺特利·扬、丹尼尔·卡罗尔和詹姆斯·霍本等天主教徒在城市建设中发挥了关键作用。⁶⁰\n\
  \n该市的白人精英试图通过将“一无所知党”与该市最受唾弃的政治团体——废奴主义者——混为一谈来削弱他们。二十年来，废奴主义者已招致华盛顿大部分白人的敌意。到 19\
  \ 世纪 50 年代初，随着辉格党因奴隶制问题而分裂，许多著名的废奴主义者，包括宾夕法尼亚州众议员撒迪厄斯·史蒂文斯和马萨诸塞州参议员亨利·威尔逊，将“一无所知党”运动视为打破全国奴隶制僵局的机会。在威尔逊（后来成为解放华盛顿奴隶法案的起草者）的领导下，北方的“一无所知党”人推动该党反对奴隶制。华盛顿特区的“一无所知党”人，包括该市“一无所知党”报纸《每日美国机关报》的蓄奴编辑维斯帕西安·埃利斯，坚持认为奴隶制不关联邦政府的事。这一问题在\
  \ 1855 年该党全国代表大会上成为广为人知的焦点，当时南方的“一无所知党”人击退了威尔逊试图让该党正式拥护废奴的努力。尽管亲奴隶制势力获胜，但政治损害已经造成——在许多人的心目中，“一无所知党”与废奴主义被联系在了一起。⁶¹\n\
  \n在 1856 年选举期间，《晚星报》谴责“废奴主义和‘一无所知党’主义的狂热”，并将政治暴力归咎于“废奴和‘一无所知党’演说家及报刊的叛国言论”。⁶² 那一年被证明是该市“一无所知党”势力的顶峰，因为他们输掉了市长竞选，并在市参议院和市议会中失去了大部分席位。\n\
  \n但政治暴力仍在继续，并在 1857 年达到高潮，当时在西北第七街的北方自由市场（今天的弗农山广场所在地）发生了一场选举日骚乱。在当地警察的纵容下，一个受“一无所知党”煽动的超过\
  \ 1200 人的暴徒，手持枪支、刀具、棍棒和一门口径六磅的小型加农炮，占领了街道，迫使华盛顿市长向总统詹姆斯·布坎南（他本人是爱尔兰移民之子）求助。布坎南派遣了\
  \ 100 名海军陆战队员平息暴力，他们在一次血腥冲突后做到了这一点，冲突造成 8 人死亡，20 多人受伤。这是自杰斐逊政府以来联邦军队首次向美国公民开火，许多华盛顿人谴责这些杀戮是“军事处决”。“一无所知党”在那天的选举中惨败，此后在该市再未成为一股严肃的政治力量。⁶³\n\
  \n\n\n\n\n到 19 世纪 50 年代末，本土主义运动已逐渐式微，但蓄奴的华盛顿仍然是一座政治动荡的城市。1859 年 10 月，废奴主义者约翰·布朗试图在弗吉尼亚州哈珀斯费里煽动奴隶起义后，紧张的华盛顿官员从联邦战争部调拨武器，在所有进入城市的入口设置岗哨，并命令警察驱散黑人的公开或私下集会。次年春天的市长竞选中，民主党人詹姆斯·贝雷特在一支准军事力量的帮助下赢得连任，这支力量破坏了共和党的集会并恐吓选民。1860\
  \ 年 11 月，共和党人亚伯拉罕·林肯赢得总统选举后，近三百名愤怒的民主党民兵组织“国民志愿军”成员洗劫了共和党在华盛顿的总部。随着南方各州在 1860 年底至\
  \ 1861 年初相继脱离联邦，政治暴力、政治动机的纵火和私刑困扰着这个国家的首都。这个国家及其首都跌入一场内战，用一位华盛顿白人的话来说，这场战争将“让一切和所有人天翻地覆”。⁶⁴\n\
  \n### *“北方佬之城”：内战降临华盛顿*\n\n内战前夕，哥伦比亚特区在地理、文化和政治上仍然是一个典型的南方城市——超过 75%的非本地人口来自南方。大多数白人居民认同南方倾向，即捍卫奴隶制、谴责废奴主义者，并恐惧反奴隶制的共和党崛起。威廉·奥纳，一位脾气暴躁、健谈的白人居民，他的日记捕捉了许多华盛顿白人的愤怒与沮丧，他写道，北方只是想“征服南方并偷走黑鬼”。民主党人已控制总统职位八年，并用南方人和“面团脸”（支持南方的北方人）填满了联邦职位。记者本·珀利·普尔指出，许多南方同情者占据着“重要的文职、军事和海军职位”，他们“好斗而挑衅，为联邦政府的强制措施设置一切障碍”。⁶⁵\n\
  \n特区缺乏政治权利，这影响了众多华盛顿白人对南北冲突的看法。作为联邦城市的居民，他们曾经历过国家政府将其意志强加于民选代表的挫败感，例如国会禁止奴隶贸易时。他们理解当政府官员未能维护其利益时的无力感。他们与南方一样，恐惧一个咄咄逼人的国家政府干涉各州内部事务。更令他们感到屈辱的是，他们甚至在使林肯成为总统的选举中没有发言权——华盛顿人还要再等一百年才能在总统选举中投票。\n\
  \n然而，即使在 1860 年 11 月林肯获胜后，很少有华盛顿白人举起分裂的旗帜。“分裂或脱离联邦的想法是可怕且*令人震惊*的，”伊丽莎白·林赛·洛马克斯写道，她是一位白人母亲、陆军遗孀，有南方血统但同情联邦。“*愿上帝保佑我们免遭这样的灾难*。”⁶⁶\
  \ 分裂和战争对这座城市构成了致命威胁。如果马里兰州和弗吉尼亚州都脱离联邦，联邦政府所在地将被敌人包围，成为敌意海洋中漂泊的孤岛。政府将不得不逃往北方，留下一个失去存在意义的城市。没有联邦政府，没有合众国，华盛顿将枯萎。\n\
  \n在一篇愤怒的社论中，《星报》谴责当地分裂主义者支持南方，尽管“他们知道自己的财产以及朋友和邻居的财产依赖于联邦的存续”。1861 年 1 月，《大西洋月刊》的一位通讯员写道，华盛顿的“命运就是联邦的命运”。身材魁梧的弗吉尼亚人温菲尔德·斯科特将军（与他的门徒罗伯特·E·李不同，他在家乡脱离联邦后仍选择忠于联邦）告诉林肯总统：“先生，首都不会被攻陷；首都不会被攻陷。”这对联邦来说将是难以想象、甚至可能是致命的一击。⁶⁷\n\
  \n对许多当地白人来说，维护联邦仍是首要任务，他们担心过分强调废除奴隶制可能会破坏这一目标。著名的布莱尔家族体现了这一观点。弗朗西斯·普雷斯顿·布莱尔（人称普雷斯顿）原籍肯塔基，1830\
  \ 年来到华盛顿，成为安德鲁·杰克逊非正式“厨房内阁”的一员，并留下来出版《环球报》。布莱尔和他热衷政治的家庭住在白宫对面的一栋两层砖房里（现为官方总统宾馆），夏天则在马里兰州乡间一处据点度过，那里有一条闪烁着云母的小溪，他们将其命名为银泉。⁶⁸\n\
  \n尽管这个家族拥有奴隶，但他们自认为在这个问题上属于政治温和派。他们帮助发起了反奴隶制的共和党，并反对将奴隶制扩展到西部领土，但他们拒绝废奴主义，认为其不切实际且对南方充满敌意，除非同时制定“为黑人提供其他地方家园”的计划。对小布莱尔来说，最重要的是“支持宪法与联邦——我们对此的关心超过对黑鬼的关心”。与布莱尔家族一样，该市许多新移民，尤其是爱尔兰人，即使反对废奴并排斥共和党（许多一无所知党人已在此找到归宿），也与联邦有着紧密联系。⁶⁹\n\
  \n林肯试图安抚南方白人、北方民主党人以及本党内的温和派，表明他无意废除任何已存在奴隶制的地方，包括华盛顿。在竞选期间，他曾谈论限制奴隶制的扩张，但从未提及废奴。如果他这样做了，他永远不可能赢得党内提名，更不用说大选了。在\
  \ 1849 年他试图立法在特区禁止奴隶制失败后，他便回避了华盛顿的解放问题。“我没有打算建议废除哥伦比亚特区的奴隶制，也没有打算建议在蓄奴州之间进行奴隶贸易，”他在\
  \ 1860 年 12 月向一位担忧的南方人保证。即使在分裂和敌对行动开始后，林肯也一再强调战争的目标不是结束奴隶制——他首先寻求的是维护联邦的实体和政治完整。⁷⁰\n\
  \n\n\n\n\n尽管林肯做出了保证，南方白人几乎没有人信任他。他们审视他的过往记录，得出结论认为他充其量只是个隐秘的废奴主义者。随着南方各州相继脱离联邦，南方政治领袖和官僚——包括许多华盛顿最古老、最有权势的家族——收拾行装离开了华盛顿，通常还带走了他们的奴隶。来自哥伦比亚特区的约四百名白人加入了南方邦联军队。前市长沃尔特·伦诺克斯逃往里士满，为邦联政府工作。富有的银行家兼当地慈善家\
  \ W·W·科克兰（后来创建了一座著名艺术博物馆）毫不掩饰他对南方的同情，尽管他缺乏付诸行动的勇气——他在欧洲度过了战争岁月。一些白人居民留在城里，秘密协助南方。在林肯当选到就职之间的几个月里，关于南方阴谋夺取这座城市的谣言四起，共和党人质疑当地居民的忠诚度。市长詹姆斯·贝雷特因拒绝宣誓效忠联邦而被捕。⁷¹\n\
  \n1861 年 3 月林肯的就职典礼没有发生重大事件，但暗流涌动的紧张局势仅一个月后就爆发了。4 月 12 日，南卡罗来纳州军队在查尔斯顿港的联邦堡垒萨姆特堡打响了战争的第一枪。许多华盛顿人担心邦联会把首都作为目标，尤其是在\
  \ 4 月 17 日弗吉尼亚州脱离联邦之后。敌人就在波托马克河对岸，而城市缺乏重要的军事设施保护，因此极其脆弱。林肯本人告诉他的内阁，如果“我是（邦联将军皮埃尔·G·T·）博雷加德，我就会拿下华盛顿。”当巴尔的摩的平民暴徒袭击了前来保卫城市的马萨诸塞州士兵，而血迹斑斑的部队于\
  \ 4 月 19 日抵达华盛顿，已有四人死亡时，居民的恐惧只增不减。地方民兵匆忙在街头集结，居民们焦急地等待增援，担心入侵的邦联军队可能先到。⁷²\n\n雅各布·多德森并没有坐等救兵到来。作为一名自由黑人华盛顿居民，他的家族曾为密苏里州参议员托马斯·哈特·本顿工作，多德森曾与著名探险家（兼总统候选人）约翰·C·弗里蒙特一起在西部度过了多年艰苦的旅行生涯。现年三十五岁的多德森是一名经验丰富的神枪手，拥有军事经验，他主动提出动员自由黑人社区保卫联邦首都。4\
  \ 月 23 日，他写信给战争部长西蒙·卡梅伦，承诺提供“本城三百名可靠的有色自由公民，他们愿意服役保卫这座城市。”但卡梅伦拒绝了。“我必须说明，本部目前无意征召任何有色人种士兵为政府服役，”他一周后写道。卡梅伦显然宁愿冒首都安全的风险，也不愿开创一个允许黑人为联邦作战的政治危险先例。⁷³\n\
  \n多德森写信两天后，陷入困境的城市迎来了来自纽约的数千名士兵。（其中就有罗伯特·古尔德·肖，他后来因担任全黑人军团的白人指挥官而闻名，一个著名街区以他的名字命名。）华盛顿之围解除了。⁷⁴\n\
  \n这座城市很快充满了生机，成千上万形形色色的移民涌入——准备作战的士兵和军官、管理战争事务的政府文员、寻求从战时合同中获利的商人、以及在联邦首都寻求自由的逃亡奴隶。如今作为联邦军队的总部，华盛顿变成了“一座军营，一座兵营和医院之城”，来访记者诺亚·布鲁克斯写道。“长长的陆军辎重车队和炮兵部队不断隆隆驶过街道；白天黑夜的任何时候，空气中都充斥着疾驰的骑兵小队的马蹄声；军刀的铿锵声和行进中的步兵有节奏的步伐声不绝于耳。”军事兵营在空地上拔地而起，街道上满是操练的士兵列队行进。“这座城市就像蜂群出巢日的蜂巢，一片忙碌、活跃和明显的混乱，”记者洛伊丝·亚当斯写道。城市人口激增。大都会警察局估计，华盛顿的人口在\
  \ 1860 年至 1864 年间几乎翻了一番，从勉强超过 75,000 人增长到大约 140,000 人。⁷⁵\n\n北方共和党人涌入华盛顿。在公务员制度保护尚未建立的时代，林肯政府官员——如废奴主义财政部长萨蒙·P·蔡斯——系统地用反奴隶制的政府文员取代了亲奴隶制的文员。随着一两年之前还被视为激进和禁忌的思想如今得到官方认可，哥伦比亚特区的性质发生了巨大变化。例如，共和党人邀请废奴主义演讲者参加史密森学会的系列讲座。塞尔斯·J·鲍恩，一位来自纽约的雄心勃勃的白人废奴主义者，曾在\
  \ 1850 年代与迈尔蒂拉·迈纳共事，他参加了这些讲座并感到惊讶：“每个在那里演讲的人，如果一年前在华盛顿胆敢说出同样的观点，都会掉脑袋。”⁷⁶\n\n与其他城市一样，华盛顿的媒体带有党派色彩，该市的主要报纸毫不掩饰地支持联邦。《国家情报报》代表林肯政府，《国家共和党人报》代表党内保守派，《每日纪事报》则是激进派的喉舌。甚至曾反对林肯的《晚星报》也转向了共和党。南方同情者——联邦主义者称之为“分离派”——可能仍留在城里，但他们的声音被亲联邦的舆论浪潮淹没了。1861\
  \ 年 12 月，《国家共和党人报》得意地宣称，华盛顿正在变成一个“扬基城市”。⁷⁷\n\n### *“我们中间的一场社会和政治革命”：华盛顿的奴隶赢得自由*\n\
  \n伊丽莎白·凯克利从她在白宫的岗位上见证了华盛顿的战时转变，她在那里担任女裁缝。⁷⁸ 作为弗吉尼亚一位著名种植园主及其家奴的女儿，凯克利在被奴役的三十七年中遭受了情感、身体和性虐待——她的独生子是在被一个主人多次强奸后出生的。由母亲教授缝纫，坚韧而足智多谋的凯克利在圣路易斯被奴役期间就成为了一名熟练的女裁缝，她利用自己的技能赚钱，并在作为客户的有权势的白人女性中赢得了朋友。在他们的帮助下，她于\
  \ 1855 年为自己和儿子赎回了自由，五年后她在华盛顿开始了新生活。\n\n作为一名进入城市的自由黑人女性，她需要市长颁发的许可证才能留下，她利用一位客户的关系获得了许可证。她迅速崛起，因设计罗伯特·E·李和杰斐逊·戴维斯等显赫人物的妻子的礼服而闻名当地。就在林肯总统就职典礼后的第二天，凯克利成为新任第一夫人玛丽·托德·林肯的首席女装裁缝。这两位女性变得异常亲密——林肯称凯克利是她“唯一真正的朋友”——凯克利成为华盛顿自由黑人社区中有影响力的一员。⁷⁹\n\
  \n\n\n\n\n与其他华盛顿黑人一样，凯克利强烈支持联邦军队。她的儿子乔治冒充白人，于 1861 年志愿加入密苏里第一志愿团，并在同年八月的威尔逊溪战役中阵亡。尽管总统另有说辞，但南方的黑人普遍将这场战争视为一场关于自由的战争。他们将联邦军队视为解放之师，几乎在联邦士兵出现的任何地方，被奴役的人们都开始逃离种植园。奴隶们为争取自身自由而采取的主动行动迫使林肯不得不采取行动，并最终推动他支持解放奴隶。⁸⁰\n\
  \n在战争的头一年半里，林肯试图维持微妙的政治平衡。一方面，他不能允许脱离联邦的州摧毁合众国，因此必须迅速而严厉地采取行动镇压叛乱。另一方面，他又不想疏远边境蓄奴州，这些州的支持对于赢得战争至关重要。尤其是马里兰州，它至关重要。如果马里兰州也脱离联邦，那么联邦政府和联邦军队将不得不撤往更北方的安全地带，这无论在象征意义上还是实质上都是沉重打击。马里兰州在总统选举中投票支持了南方民主党候选人，其州长是一位“一无所知党”成员，试图在战争中保持中立，而林肯则努力安抚他的担忧。\n\
  \n林肯希望维持马里兰州及其他边境州的支持，这促使他制定了一项对奴隶主友好的逃亡奴隶政策。他最初命令联邦士兵将所有逃亡奴隶关押起来，并交还给他们的主人。在战争第一个整月里，华盛顿特区的士兵抓获了\
  \ 73 名逃亡者，将他们关进“蓝罐”监狱，然后送回奴隶制。但这一政策违背了战略逻辑。毕竟，被奴役的劳工是南方战争机器的重要组成部分。为什么联邦士兵要充当那些背叛国家的叛徒的奴隶捕手呢？⁸¹\n\
  \n联邦将军本杰明·巴特勒是马萨诸塞州的民主党人，曾在 1860 年支持杰斐逊·戴维斯竞选总统但未成功，他违抗了林肯的命令。1861 年 6 月，巴特勒在联邦控制的弗吉尼亚州门罗堡（位于华盛顿特区以南约\
  \ 180 英里）执行任务时，在他的营地遇到了三名逃亡奴隶，即使奴隶主前来索要，他也拒绝将这些人送回奴隶制。相反，他把他们留在士兵中，称他们为“战争违禁品”。这个在法律上存疑的术语就此固定下来——很快，逃亡奴隶作为一个群体被称为“违禁品”。⁸²\n\
  \n其他联邦军官效仿巴特勒的做法，激怒了尚未脱离联邦的南方各州的奴隶主。马里兰州国会议员查尔斯·卡尔弗特谴责军队允许被奴役的人在华盛顿周围的营地定居，声称这些营地成了“我们奴隶的收容所”。为了维持他们的支持，林肯在同年\
  \ 7 月重申了他的立场：将军们必须允许奴隶主找回他们的奴隶。混乱局面一直持续到 8 月初，国会通过了第一部《没收法》，允许联邦军队没收并解放那些其主人被证实曾利用他们协助南方邦联军队的被奴役者。然而，该法不适用于忠诚蓄奴州（如马里兰州）或哥伦比亚特区内的奴隶主所拥有的奴隶。如果这些奴隶中的任何人试图逃跑，他们仍将根据仍然有效的《逃亡奴隶法》被抓获并归还。⁸³\n\
  \n在《没收法》通过后的几个月里，数百名被奴役的人——包括许多没有法律保护的马里兰州逃亡者——涌入哥伦比亚特区，在当地黑人居民的家中找到了庇护和安全。他们在城里的出现引发了另一个重要问题：如何判断一个逃亡奴隶的主人是否忠于联邦？一个人决定了这个问题的答案，他就是哥伦比亚特区的联邦执法官沃德·H·拉蒙。⁸⁴\n\
  \n拉蒙是弗吉尼亚人，身材魁梧，怀有亲奴隶制的本能，他曾是总统的法律合伙人，后来成为总统自封的保镖。作为执法官，拉蒙管理着“蓝罐”监狱，那里很快因关押抓获的逃亡者而人满为患。拉蒙认为大多数逃亡者来自马里兰州，因此是从“忠诚”的主人那里逃走的，他拒绝将他们视为“违禁品”，而是严格执行《逃亡奴隶法》的字面规定。他把他们塞进旧监狱，在那里他们忍受着恶劣的条件，正如一份政府报告在\
  \ 1861 年夏天所描述的“一座通风不良、不卫生的建筑”。⁸⁵\n\n“蓝罐”监狱成了废奴主义批评的众矢之的——废奴主义者称其为“华盛顿奴隶围栏”。马萨诸塞州参议员亨利·威尔逊及其在国会中的废奴主义盟友聘请了先驱私家侦探艾伦·平克顿调查拉蒙和“蓝罐”监狱的状况。平克顿发现有\
  \ 60 名据称是逃亡奴隶的人未经指控被关押，其中一些人实际上是自由人，他还指控无人认领的逃亡者仍被出售以弥补监狱费用。一组耸人听闻的两页插图出现在《弗兰克·莱斯利画报》上，描绘了监狱中的恐怖场景，引发了全国范围的愤怒。批评之声如此强烈，以至于林肯本人不得不介入，命令拉蒙停止关押逃亡奴隶，除非他们被指控犯有实际罪行。⁸⁶\n\
  \n![Image](img/f0001-07.jpg)\n\n*“监狱之秘——华盛顿的黑洞”。即使在内战开始后，仍有三千多人在国家首都处于被奴役状态。亚瑟·拉姆利的版画发表于\
  \ 1861 年 12 月 28 日的《弗兰克·莱斯利画报》，帮助推动了国会禁止华盛顿特区奴隶制的进程。国会图书馆。*\n\n围绕“蓝罐”监狱的争议助长了在华盛顿禁止奴隶制的运动。到\
  \ 1861 年底，脱离联邦派的代表已撤出国会大厦，使共和党人得以相对自由地推行其立法议程。参议员威尔逊带头起草了一项实际上将解放哥伦比亚特区奴隶的法案，他不仅赢得了废奴主义者的支持，还赢得了许多温和派共和党人的支持，包括《国家共和党人》的编辑们。\n\
  \n威尔逊的法案激怒了大多数华盛顿白人。《国家情报员》的编辑们抨击这一“突然、强制且彻底的解放行为”，而《晚星报》则列出了“哥伦比亚特区解放奴隶法案不应通过的二十条理由”。尽管《晚星报》支持联邦，但它仍然支持奴隶制，希望在维护城市（这需要支持联邦）与维护白人权力（这需要支持奴隶制）之间找到平衡。编辑们反映了白人精英的主流情绪，警告说该法案“只是我们中间一场社会和政治革命的开始”。他们推论，如果国会能够“违背我们的意愿解放我们的黑人”，那么它“就能而且或许会赋予他们与白人平等的公民和政治特权”。⁸⁷\n\
  \n\n\n\n\n市议会和市议会的成员也试图劝阻国会通过解放法案。在四月初提交给国会的“联合指示决议”中，他们警告说，该法案最终将“把这座城市……变成自由黑人的收容所——这是每个美国社区都不受欢迎的人口。”市议员威廉·摩尔更进一步。“如果这种狂热精神盛行，我们将陷入从未想象过的恐怖之中，”他说，“这将是一个平等或灭绝的问题。这两个种族永远无法平等共存。”⁸⁸\n\
  \n《晚星报》的编辑和其他当地白人在一点上是对的：国会确实在将自己的意志强加给华盛顿特区的居民。但地方民主从来不是国会的优先事项。共和党国会议员将华盛顿视为测试其种族政策的地方。俄亥俄州参议员约翰·谢尔曼（其兄威廉将作为联邦将军赢得荣耀）认为，华盛顿是“解放实验”的完美地点。谢尔曼辩称，华盛顿“是自由黑人的天堂”，黑人“在这里比在任何其他地方享有更多的社会平等”，因此首先解放华盛顿的奴隶是合理的。⁸⁹\n\
  \n尽管大多数南方代表已不再出席，解放法案在国会仍遭遇阻力。北方民主党人和一些共和党人认为这会损害联邦的战争努力，并辩称国会无权在任何地方废除奴隶制。边境州的代表担心这会在他们的家乡州开创废除奴隶制的先例，马里兰州的代表则担心（事实证明是有先见之明的）他们的奴隶会逃往华盛顿。在参议院，围绕殖民化问题爆发了一场争论，起因是肯塔基州参议员加勒特·戴维斯提出了一项修正案，要求被解放的华盛顿居民离开美国。对该修正案的投票以\
  \ 19 比 19 陷入僵局，迫使副总统汉尼拔·哈姆林投下打破平局的“反对票”。最终法案没有强制殖民化，而是包含了一项鼓励自愿移民的条款。⁹⁰\n\n该法案轻松通过：1862\
  \ 年 4 月 3 日参议院以 29 比 14 通过，4 月 11 日众议院以 92 比 38 通过。林肯于 4 月 16 日签署了该法案，这一天在华盛顿被称为解放日。\n\
  \n从林肯的角度来看，该法案并不理想。它命令立即解放，而不是他长期以来倡导的逐步解放，而且肯定没有像他希望的那样得到当地居民的支持。但正如总统在批准该法案后所写的那样，“我很高兴补偿和殖民化这两项原则都在法案中得到承认并实际应用。”⁹¹\n\
  \n该法案的标题是“关于释放哥伦比亚特区某些被强制服务或劳动的人的法案”，甚至没有使用“奴隶”、“奴隶制”或“解放”等词。它允许“忠诚的”奴隶主为其新获自由的奴隶提出补偿要求。它设立了一个三人委员会来评估索赔，并为每个被奴役者支付高达\
  \ 300 美元的补偿，并为此设立了一个 100 万美元的基金。值得注意的一步是，委员会被要求接受证词，“不得因肤色而排除任何证人”。该法律还设立了一个 10\
  \ 万美元的基金，帮助黑人“移民到海地或利比里亚共和国”。⁹²\n\n正如《星报》所担心的那样，解放法案确实只是“我们中间的一场社会和政治革命”的开端。共和党国会议员不满足于仅仅解放特区的被奴役者，他们试图消除该城市中奴隶制的法律残余。在\
  \ 1862 年春末夏初的一系列立法中，国会废除了该城市的黑人法典，为黑人学生建立了公立学校系统，并要求“在哥伦比亚特区的所有司法程序中，不得因肤色而排除任何证人”。黑人现在可以在没有法律限制的情况下从事任何经济活动，可以在没有官方许可的情况下和平集会，并且不再面临种族歧视性的宵禁。⁹³\n\
  \n这是一场速度和规模都令人震惊的立法革命，并在北方的黑人社区引发了庆祝活动。然而，在华盛顿的黑人居民中，反应相对克制。为了不激怒白人邻居或引发暴力，黑人教会领袖不鼓励游行或喧闹的公共庆祝活动，而是提倡私人庆祝和“感恩与祈祷日”。在该法案通过前几天，非洲裔卫理公会主教丹尼尔·佩恩向即将获得自由的被奴役者——“被赎回者”——发表了一篇布道建议：“欢迎的不是懒惰、恶习、放荡和犯罪，而是受到良好规范的自由”，这种自由需要信仰、教育和“工作、工作、工作！”解放后一周内，第十五街长老会教堂的成员决议：“通过我们的勤劳、精力、道德品行和品格，我们将证明自己值得被信任，成为自由人。”⁹⁴\n\
  \n尽管华盛顿的黑人普遍拥护解放，但他们在法案中关于殖民化的条款上存在分歧。林肯总统仍然致力于殖民化——一位记者称其为“他解决国家问题的首选灵丹妙药”——并希望组织一批自由黑人和新获解放的奴隶，在现今巴拿马的奇里基建立定居点。该市几位著名的黑人领袖，包括以色列伯特利教堂富有魅力的亨利·麦克尼尔·特纳，支持林肯的计划，并请求国会为其提供资金。在整个\
  \ 1862 年夏天，招募人员在曾是奴隶的华盛顿居民中找到了愿意倾听的听众，他们将殖民化视为在远离白人种族主义者的新地方重新开始的机会。⁹⁵\n\n但其他黑人领袖，包括小约翰·F·库克，对殖民化运动的重新推动感到愤怒。27\
  \ 岁的库克像他父亲一样是一名教育工作者，他帮助创立了社会、公民与统计协会（SCSA），这是一个由受过良好教育、相对富裕的华盛顿黑人组成的公民团体。许多 SCSA\
  \ 成员对殖民化运动心存疑虑，并对殖民化代理人进行口头和身体上的抨击，指责他们“冷酷无情、毫无原则地利用”前奴隶。⁹⁶\n\n库克和其他 SCSA 成员是那年八月与林肯总统会面讨论奇里基计划的黑人领袖代表团的一部分。在会面之前，代表团发表了一份措辞尖锐的决议，谴责该想法“不明智、不吉利且不礼貌”。林肯称他们的反对“极其自私”，并坚称“对我们双方来说……分开更好”。然而，尽管有高层的大力支持，奇里基计划最终因后勤困难、黑人的持续抵抗以及中美洲国家政府的外交反对而瓦解。随着\
  \ 1863 年 1 月 1 日生效的《解放宣言》基本上将自由——而非殖民化——定为官方联邦政策，这个问题逐渐淡出。⁹⁷\n\n\n\n\n\n哥伦比亚特区解放法案设立了一个由三人组成的联邦解放索赔委员会来裁决索赔。委员会聘请了来自巴尔的摩的前奴隶贩子\
  \ B·M·坎贝尔，协助评估被奴役者的价值。一位观察者后来指出，坎贝尔“极其细致地”完成了工作，“让（奴隶）跳舞以展示他们四肢的柔韧性，并张开嘴巴证明他们牙齿完好”。尽管一些华盛顿的奴隶主要么卖掉了他们的奴隶，要么将他们送到别处居住，但在法案通过后的三个月内，委员会已批准了来自一千多名奴隶主的\
  \ 909 项索赔，涉及 2981 名被奴役者。另有 111 名奴隶因被认为太年轻、太老或病重而不值得补偿，被无偿解放。该市最大的奴隶主乔治·华盛顿·杨（诺特利·杨的后裔）为其声称拥有的\
  \ 69 名奴隶获得了 17,771.85 美元——按 21 世纪美元计算约为 43 万美元。甚至虔诚的圣母访亲修女会也为乔治敦修道院拥有的 12 名被奴役者申请并获得了补偿。政府总共花费了\
  \ 993,406 美元来补偿前奴隶主。⁹⁸\n\n一些获得补偿的索赔者是黑人。在整个南方，自由黑人时常购买家庭成员，但他们有时没有提交适当的文件或支付必要的费用来合法地解放他们。一位名叫加布里埃尔·科克利（Gabriel\
  \ Coakley）的自由黑人在 1850 年代末购买了他的妻子和家人的自由，但他从未提交他们的文件。因此，他们在法律上“属于”他。于是，凭借一位著名白人律师的宣誓书，他申请了补偿并获得了\
  \ 1,489.20 美元。⁹⁹\n\n并非所有奴隶主都遵守法律条款。亚历山大·麦考密克（Alexander McCormick）在一个横跨马里兰州和华盛顿东北部边界的种植园里拥有五名奴隶。他的大部分土地以及奴隶宿舍都位于哥伦比亚特区一侧。1862\
  \ 年初，当国会辩论解放法案时，麦考密克匆忙在马里兰州一侧为他的被奴役工人建造了新住所。他辩称，由于他们不再居住在特区，因此不受解放法案的约束，并拒绝为他们提交补偿申请。没有这样的申请，这些奴隶就无法获得自由。意识到多达\
  \ 150 名奴隶主通过不提交申请来规避法律，国会修订了解放法案，允许被奴役者自行提交申请——这是一个革命性的步骤。麦考密克的奴隶——埃梅琳·韦奇（Emeline\
  \ Wedge）和她的两个孩子、她的妹妹爱丽丝（Alice）以及她的母亲玛丽（Mary）——提交了请愿书，并在委员会面前作证说他们实际上在特区生活和工作。1862\
  \ 年 12 月 30 日，他们终于获得了自由。¹⁰⁰\n\n同样获得自由的还有菲利普·里德（Philip Reed），一位熟练的金属工匠，他正在协助铸造即将安放在新国会大厦穹顶上的青铜“自由雕像”。还有埃莉诺拉和卡罗琳·贝尔（Eleanora\
  \ and Caroline Bell），两位来自“珍珠号”的逃亡者，她们在华盛顿一直处于被奴役状态。以及一岁的亚伯拉罕·林肯·霍金斯（Abraham Lincoln\
  \ Hawkins），他以新当选的总统命名。近 3100 名在首都遭受奴役的男女老少获得了自由。由于特区解放比《解放宣言》生效早了近九个月，他们成为了全国“首批获得自由的人”，这一殊荣将令他们世代引以为傲。¹⁰¹\n\
  \n经过六十多年不懈的抵抗、绝望的逃亡、政治鼓动，以及最终战争的爆发，华盛顿的奴隶制终于被终结了。华盛顿本已是逃亡奴隶和自由黑人的首选目的地，如今更与黑人机遇紧密相连。原本源源不断的黑人移民潮变成了洪流。这座城市即将进入一个前所未有的变革时期。\n\
  \n## 第五章\n\n## 解放、赋予选举权、教育\n\n### *自由与跨种族民主的希望，1862–1869 年*\n\n“本特区已在各种令公民憎恶的立法形式下被*当作实验品*……而现在，国会中激进派的粗暴权力又威胁要给予最暴虐的一击。他们企图*将黑人平等强加给不情愿的哥伦比亚特区人民，而这些人刚刚几乎一致地抗议这种平等*。”——《国家情报报》，1866\
  \ 年 1 月\n\n今天的富兰克林广场是西北区第十三街、第十四街、I 街和 K 街之间的一片绿地。广场以本杰明·富兰克林命名，但并没有这位身材臃肿的同名者的雕像或标志，不过它提供了遮荫的树木、一个迷人的喷泉，以及在城市峡谷中的一丝宁静。广场边缘闪耀着为游说精英建造的玻璃塔楼，只有一个例外：由著名德国建筑师阿道夫·克卢斯于\
  \ 1868 年设计的红砖富兰克林学校。这所学校在开放时是一座精巧建筑的奇迹，到 20 世纪末却变成了一个无家可归者收容所。2008 年，城市领导人决定关闭收容所，引发了一场喧闹的抗议，在一个快速绅士化的城市中引发了关于种族、阶级和公平的质疑。\n\
  \n富兰克林广场长期以来一直是争议和庆祝活动的场所。事实上，在富兰克林学校开放的两年前，该广场举办了该市历史上最令人难忘的活动之一：内战后的第一个解放日庆祝活动。1866\
  \ 年 4 月 16 日，即特区解放四周年纪念日，庆祝活动以一场漫长的游行开始，游行队伍穿过数英里坑洼不平的街道，从乔治敦一直走到国会大厦，并特意在坚定的废奴主义者查尔斯·萨姆纳的住所前停留，以及行政官邸前，游行者在那里高呼要求安德鲁·约翰逊总统露面。当约翰逊出现时，人群欢呼起来，尽管他们要求平等权利直接挑战了总统的政策。¹\n\
  \n由五千名游行者组成的队伍代表了该市各种有组织的黑人活动形式——军事营、兄弟会组织、教会团体、共济会、政党——其长度之长，据自由民局的白色人种领袖 O·O·霍华德将军回忆，“没有一个点能让人看到整个队伍”。游行队伍蜿蜒行进至富兰克林广场，据《哈珀周刊》报道，那里聚集了上万名观众，一片“密集的黑人面孔，偶尔点缀着几个白人面孔”，他们与游行者一起庆祝、歌唱并祈祷感恩。空气中充满了音乐和活力。“乐队在演奏，鼓声在敲响，人们在四面八方欢呼，而人群……来回移动，”一位记者写道。²\n\
  \n![Image](img/f0001-08.jpg)\n\n*“有色人种在华盛顿庆祝哥伦比亚特区废除奴隶制”。1866 年，超过一万人在富兰克林广场庆祝解放日。在\
  \ 19 世纪后期的大部分时间里，4 月 16 日的年度庆祝活动是华盛顿黑人日历上最重要的日子之一。国会图书馆。*\n\n\n\n\n讲台上挂满了横幅和旗帜，台上站着一百多人，堪称废奴主义者和激进共和党人的“名人录”，其中包括霍华德将军、共同起草禁止奴隶制的第十三修正案的康涅狄格州参议员莱曼·特朗布尔，以及华盛顿特区解放法案的发起人马萨诸塞州参议员亨利·威尔逊。主题演讲由第十五街长老会教堂的黑人牧师亨利·海兰·加内特发表，他在演说家中的声望或许只有弗雷德里克·道格拉斯能与之媲美。这位前马里兰州奴隶身高六英尺，尽管截去了一条腿，但仪态庄重，他用一篇充满激情的演讲捕捉了庆祝的气氛。“今天，自由的原则取得了胜利，”加内特对人群说道。“上帝与我们同在，我们必须获得自由。”³\n\
  \n这一事件不仅仅是庆祝一年前的废奴、解放和联邦胜利的时刻。这也是展示黑人社区新获得的政治力量，并激励支持者为未来的政治斗争做准备的机会。解放只是迈向一等公民身份的第一步；仅凭自由不足以保护黑人居民的利益。随着奴隶获得解放、战争取得胜利，黑人现在寻求确保民主中最基本的权利：选举权。“我们已经获得了我们的公民权利，”讲台上方悬挂的一条横幅上写道。“赋予我们选举权，一切就大功告成了。”⁴\n\
  \n富兰克林广场的解放日庆祝活动是华盛顿自战争开始以来所经历的几乎难以想象的变化的有力公开体现。不到五年前，华盛顿还是一个由禁止黑人“骚乱”集会的黑人法典统治的奴隶城市；而现在，数千名有组织的华盛顿黑人占据了市中心的大部分地区，进行了一天的庆祝活动。就在几年前，黑人个人在拥有枪支方面面临法律障碍，也没有黑人能参军；而现在，整团整团武装的黑人民兵公开在街上行进。战前，政治是白人男性的专属领域；而现在，在国会中白人激进派的支持下，华盛顿的黑人组织起来进行政治活动，并公开争取投票权。这是一场惊人的转变，给整个地区的黑人注入了希望，使他们相信自己能够充分参与一个种族融合的民主制度——这是这个国家，乃至整个世界前所未见的。\n\
  \n然而，保守的白人华盛顿人却带着恐惧观看着这一景象。“白天和夜晚都在威士忌饮酒和各种黑鬼的恶行中结束，”威廉·奥纳在日记中抱怨道。如此多的黑人狂欢者聚集在该地区，以至于白人“不得不躲到台阶上和商店里，就像我这样，直到黑鬼们过去。”当他凝视着占领城市街道的黑人人群时，奥纳的思绪飞速转向这一事件对未来的政治影响：“这么多黑鬼要靠白人的税收来养活！”⁵\
  \ 奥纳担心自己正在目睹一场根本性的政治转变，这场转变将迫使他和其他白人至上主义者靠边站，而华盛顿黑人及其白人盟友不仅控制了街道，也控制了政治。\n\n对于华盛顿来说，也许比全国其他地区更甚，战争和重建是一段动荡时期。由于国会对该市拥有专属权力，华盛顿是国会激进派能够不受州和地方当局干扰实施其政策的唯一地方。即使在战争激烈进行时，激进共和党人仍试图将华盛顿变成查尔斯·萨姆纳所称的“全国的榜样”，一个种族融合的美国原型，黑人享有政治和公民（尽管不是社会）平等。⁶\n\
  \n从自由民救济到黑人选举权再到教育，每一项重大的重建立法都在哥伦比亚特区进行了“实地测试”，然后才在顽固的南方推行。这种转变很少是顺利或没有争议的。批评者抱怨说，华盛顿被用作“激进植物的实验花园”，白人保守派则竭力阻止平等的种子生根发芽。但没有人能否认，这个曾经是奴隶制和奴隶贸易南方堡垒的国家首都，正处在种族和政治变革的前沿。⁷\n\
  \n### *“背着全部家当”：黑人移民涌入华盛顿*\n\n1862 年春天，战争结果仍悬而未决时，约翰·华盛顿心中想的只有自由。他二十四岁，生来就是奴隶，他知道联邦军队正在逼近他在弗吉尼亚州弗雷德里克斯堡的家，他想加入其中。他肤色较浅，在乡村种植园里作为家奴长大，学会了读写——这些技能帮助他赢得了一位名叫安妮的自由黑人女性的芳心（他于\
  \ 1862 年初与她结婚），后来还写了一本关于自己逃离奴隶制的回忆录。\n\n到 1862 年 4 月 18 日，也就是林肯总统签署华盛顿特区解放法案仅仅两天后，北方佬士兵已经距离华盛顿工作的弗雷德里克斯堡旅馆不到一英里，他当时在那里做奴隶酒保。他的老板关闭了旅馆，要求他跟随他们前往邦联军队防线，但他“暗中决定不去”。他兴奋不已，从旅馆顶上看着北方佬逼近：“我无法表达我新生的希望，因为我已经感觉自己现在肯定能获得自由了。”那天晚上，他一边听着联邦乐队演奏《星条旗》的声音，一边和一位表兄偷偷溜上拉帕汉诺克河，穿过联邦防线，永远地离开了奴隶制。⁸\n\
  \n华盛顿为联邦军队工作了几个月，直到得知自己头上悬赏 300 美元。他把怀孕的妻子留在弗雷德里克斯堡，自己和六名家人北上前往华盛顿特区。他们到达的那天晚上不得不在西北第十四街露宿，第二天才在乔治敦找到住处。华盛顿“当时没有手艺，也不知道该做什么”，但他很快找到了一份装瓶酒的工作，每天\
  \ 1.25 美元。安妮·华盛顿和他们刚出生的儿子不久后也来与他团聚，他们在国家首都开始了新生活。⁹\n\n华盛顿一家是那年夏天开始迁移到华盛顿特区的数百名弗雷德里克斯堡黑人居民中的一部分。他们中的许多人，包括华盛顿一家，都是弗雷德里克斯堡示罗浸信会的成员。一到华盛顿特区，他们迅速在第十六街和第十七街之间的\
  \ L 街上的一间“小棚屋”里重建了教堂。随着教堂发展到八百多名成员，并建造了一座两层砖砌的圣殿，华盛顿一家一直是忠实的会众，直到 1924 年教堂迁至现在的位置——西北第九街和\
  \ P 街交汇处。¹⁰\n\n\n\n\n华盛顿家族是解放法案颁布后涌入该城的黑人移民潮中的一部分。逃亡者从南方各地逃来，尤其是邻近的马里兰州和弗吉尼亚州。他们以个人或家庭的形式抵达，有时甚至成群结队，并在战争期间持续涌入。到\
  \ 1870 年，华盛顿的黑人人口增长了三倍多，达到四万三千人，占城市总人口的比例从 19%跃升至 33%。\"华盛顿似乎成了黑皮肤绅士们的麦加，\"来自纽约的黑人教育家威廉·J·威尔逊在\
  \ 1863 年 5 月首次访问该城时兴奋地写道，\"到处都是黑人，黑人，黑人。政府马车上是黑人——货运马车上是黑人——出租马车上是黑人——运土车上是黑人——酒店里、理发店里、所有房子里、所有街道上都是黑人。\"\
  移民潮似乎证实了华盛顿白人对解放最深的恐惧。¹¹\n\n加上白人士兵、官僚和战时企业家的涌入，黑人移民将这座城市推向了极限。涌入的移民——被称为\"违禁品\"\
  或\"自由民\"——绝大多数贫穷、缺乏技能且未受教育。与约翰·华盛顿不同，绝大多数人是文盲，而哥伦比亚特区自由黑人的文盲率仅为 30%。他们来到华盛顿时，白宫裁缝伊丽莎白·凯克利回忆道，\"\
  背着全部家当\"。战时对非熟练劳动力的需求相对较高，因此大多数前奴隶都能找到工作，但由于住房、食物和基本物资短缺，城市的生活成本高得离谱。他们生活在极其恶劣的条件下，往往住在最不理想的地方：沿着城市运河搭建棚屋，挤进小巷，堆在漏水的陋室里，寄宿在马厩阁楼中。¹²\n\
  \n华盛顿的黑人居民向新来者敞开了家门和机构。在华盛顿，《盎格鲁-非洲周报》的记者写道：\"我们为一个从锁链中逃脱的可怜灵魂而欢欣，胜过攻取九十九座城池。\"\
  以色列伯特利教堂的亨利·麦克尼尔·特纳赞扬黑人社区\"敞开了他们最精致的客厅，让出了厨房、阁楼甚至壁橱，来庇护这些逃脱的子孙。\"伊丽莎白·凯克利本人离奴隶制并不遥远，她与第十五街长老会教堂的成员共同牵头成立了\"\
  违禁品救济协会\"，其他教堂也成立了类似组织。全国自由民救济协会（NFRA）赞扬华盛顿的黑人居民\"为他们的不幸同胞所表现出的关心和热情\"。¹³\n\n中产阶级黑人居民希望吸纳移民并帮助他们自立——用\
  \ 19 世纪的话说就是\"提升\"他们——但前奴隶面临的挑战之大，有时超出了私人努力的能力。前奴隶兼废奴主义者哈丽特·雅各布斯，其自传《一个女奴的生活片段》使她成为反奴隶制圈子的传奇人物，于\
  \ 1862 年夏天访问华盛顿，并对她所见的前奴隶的生活条件感到震惊。\"我发现男人、女人和孩子都挤在一起，不分年龄或性别。有些人处于最悲惨的境地。许多人患有麻疹、白喉、猩红热和伤寒。有些人只有几块肮脏的破布可以躺下；其他人除了光秃秃的地板外一无所有。\"\
  1862 年，一场天花疫情肆虐了该城的黑人社区，随着寒冷而绝望的前奴隶挤在拥挤肮脏的环境中，疫情迅速蔓延。¹⁴\n\n移民的规模迫使联邦政府介入，帮助前奴隶适应新生活——而市政府拒绝提供任何援助。通过军需部新设立的\"\
  违禁品部门\"（自由民局的前身），军队让自由民参与修建保护城市免受南方邦联入侵的堡垒环。工人及其家属往往定居在堡垒附近，为后来在雷诺堡、杜邦堡等军事设施附近繁荣发展的黑人社区奠定了基础，这些社区一直延续到\
  \ 20 世纪。\n\n自由民男女还在当地医院工作，从事各种工作，包括挖沟、清洁、锯木、生火、园艺、烹饪以及\"翻捡\"垃圾。与白人劳工相比，一位军官声称，\"\
  黑人是更优秀的工人，更尽职尽责，更少放纵，且易于管理。\"所谓的违禁品工人在战时华盛顿拥有经济杠杆。前奴隶首次能够出售自己的劳动力并选择雇主，他们设法争取尽可能好的条件。由于需求旺盛，即使是体力劳动者每月也能挣到\
  \ 20 到 25 美元，外加口粮——这远高于其他北方工人，但仍不足以跟上华盛顿不断上涨的生活成本。¹⁵\n\n然而，许多前奴隶无法工作——他们太老、太小或病得太重。为了帮助病人和老人，军队设立了一个\"\
  违禁品基金\"，资金来源是从军需部黑人工人的工资中每月扣除 5 美元。这项\"违禁品税\"激怒了一些自由黑人劳工，他们反对必须为前奴隶家庭买单。一群工人向战争部长埃德温·斯坦顿抱怨，认为他们不应\"\
  比我们这类白人劳工更应缴纳违禁品税\"，但该税仍被保留。¹⁶\n\n违禁品基金用于资助政府在该城设立的\"违禁品营地\"。像现代难民营一样，违禁品营地旨在成为安全、临时的住所，人们可以在那里获得庇护、食物和就业援助。然而，一旦建立，它们便吸引了长期居民，并成为疾病的温床，以及当地白人的言语和身体攻击的目标——这些白人憎恨逃亡者的存在。战争期间，多达一万名前奴隶在特区地区经过此类营地。¹⁷\n\
  \n特区的军事总督詹姆斯·S·沃兹沃思，一位富有的纽约废奴主义者，努力建立一个人道体系来应对涌入城市的大量移民。不堪重负的军官最初将无家可归的前奴隶关进旧国会监狱，与南方邦联战俘共用空间。1862\
  \ 年初对天花爆发的担忧促使沃兹沃思征用了达夫·格林排屋的住房，这是国会大厦对面著名的寄宿公寓群，其中包括废奴之家——亚伯拉罕·林肯在 19 世纪 40 年代担任国会议员时曾居住于此。这些排屋很快被填满，约四百人挤进了原本容纳五十人的空间。¹⁸\n\
  \n\n\n\n这些营地正演变成一场人道主义危机，沃兹沃思（Wadsworth）借助战前废奴运动的经验来应对这一局面。随着奴隶解放，废奴主义者的关注点从帮助逃亡奴隶逃脱转向帮助前奴隶适应自由生活。由于华盛顿既是国家首都，又聚集了大量难民，这里成了北方传教士的磁石，尤其是那些前来与形形色色的救济组织（如全国自由民救济协会和美国传教士协会）共事的白人女性。\n\
  \n她们将自己的工作视为神圣的召唤。1862 年 4 月华盛顿特区解放法案通过仅几周后，由联邦雇员发起的全国自由民救济协会华盛顿分会，旨在“教导（前奴隶）基督教与文明；向他们灌输秩序、勤劳、节俭和自立的观念；并通过激发他们的自尊心，提升他们在人类等级中的地位。”这些私人组织不仅为违禁品营地提供了大量工作人员，还筹集资金，并向北方捐助者以及当地黑人教会征集实物捐赠，以补充政府提供的微薄口粮和衣物。¹⁹\n\
  \n美国传教士协会的丹福斯·尼科尔斯（Danforth Nichols）是一位来自波士顿的卫理公会牧师，拥有无可挑剔的废奴记录，他于 1862 年 6 月成为违禁品营地的负责人。他的首批举措之一是在西北区第十二街和佛蒙特大道交汇处建造巴克营地（Camp\
  \ Barker），以缓解过度拥挤的状况。巴克营地（尼科尔斯称之为“华盛顿违禁品仓库”）建于战前曾是墓地和砖厂的地方，于 1862 年 7 月开放，容纳了 400\
  \ 名居民，但迅速扩张。到 1863 年 4 月，这里挤满了 1000 名居民，他们被塞进 10 英尺乘 12 英尺的小木屋里，每间小屋都挤着十几个人。居民缺乏足够的厕所、水源和卫生设施，疾病像野火般蔓延——1863\
  \ 年夏天的天花疫情肆虐营地，每周导致二十多名居民死亡。²⁰\n\n巴克营地距离白宫以北仅一英里，那年夏天，林肯总统每天往返于西北区士兵之家附近的季节性别墅时都会经过这里。1863\
  \ 年 5 月，尼科尔斯主管与军方官员合作，将营地居民迁往波托马克河对岸，在邦联将军罗伯特·E·李的阿灵顿庄园上建造一个“自由民村”——这一绝妙的讽刺并未被营地规划者或居民忽视。该自由民村于当年\
  \ 12 月正式启用，象征着尼科尔斯和其他白人废奴主义者投入救济工作的传教士热情。从纸面上看，它类似于一个现代规划社区，沿着一条环绕中央池塘的乡村道路，整齐排列着\
  \ 50 栋双户住宅，并配有医院、学校、教堂和“老年及体弱自由民之家”。营地规划者希望“纯净的乡村空气”能改善居民健康，并期望工作计划能鼓励扬基式的自立、勤劳和节俭美德。²¹\n\
  \n巴克营地、自由民村以及华盛顿地区的其他违禁品营地为新获自由的黑人提供了重要帮助，但它们也帮助改造并最终摧毁了战前存在的跨种族改革社区。部分原因在于，改革者只是被形势压垮了——解放和战争引发了规模如此之大、速度如此之快的移民潮，以至于即使那些真正致力于帮助前奴隶的人，也难以找到充分的解决方案，尤其是在战争压力下的联邦政府所能提供的资源极其有限的情况下。但阶级、文化和控制问题也撕裂了这个社区，主要沿着种族界限。\n\
  \n战前，白人和黑人的废奴改革者往往共享中产阶级的价值观和品味——尊重优雅举止、欣赏社会差异、强调谨慎和审慎。参与跨种族组织的黑人通常是城市精英，包括相对富裕、受过良好教育、往往是混血的非裔美国人，他们与白人废奴主义者密切合作、相互依赖（有时也表现出顺从）。当丹福斯·尼科尔斯抵达华盛顿时，他陪同一位黑人牧师游览城市，并与另一位黑人牧师共进晚餐，他赞许地指出：“华盛顿有好茶，黑人也知道如何按照礼仪规则泡茶和上茶。”²²\n\
  \n然而，在战争期间，改革者遇到了截然不同的黑人阶层。涌入城市的大批逃亡和解放的奴隶往往直接来自种植园生活，他们既没有白人改革者也没有华盛顿精英黑人的那种品茶雅致。他们身无分文、没有工作、没有受过教育，遇到了同情他们困境但常常看不起他们的受过教育的北方白人。营地工作人员和救济工作者在与前奴隶的关系中产生了一种家长式的责任感，这种态度往往表现为控制黑人的行为和决定。“跟他们讲道理是行不通的，”尼科尔斯解释道，“你必须告诉他们该做什么。”²³\n\
  \n在更早的奴隶制时代，富有同情心的白人废奴主义者的家长作风或许曾被勉强容忍甚至欢迎。但如今不再如此。解放打破了顺从的束缚，许多华盛顿黑人挑战任何居高临下的暗示。在整个战争期间，他们对仁慈的白人改革者做出的一些决定感到愤怒，对强加给他们的限制感到不满，并挑战他们所遇到的局限。他们主张自己作为完全公民的权利，而不仅仅是前奴隶。“我以政府的名誉和承诺交出了我的孩子，让他去扛枪，结果他去了，失去了生命，”自由民村居民贝齐·布朗在投诉营地主管尼科尔斯时作证说，“先生，我认为这已经足够了。”²⁴\n\
  \n主管尼科尔斯是黑人批评者的特别目标。他未经营地居民或当地黑人领袖协商就做出专断决定，因此赢得了傲慢和虐待的名声。当他决定将巴克营地居民迁往自由民村时，居民们犹豫了——其中\
  \ 80%的人干脆拒绝前往，他们告诉一位传教士，“他们宁愿在华盛顿饿死，也不愿去阿灵顿受尼科尔斯管辖。”在尼科尔斯和其他白人改革者看来，这是一个在健康环境中生活和工作机会，而在前奴隶眼中，这却是重返南方奴隶制。他们认为尼科尔斯“更适合当南方种植园的监工”。黑人通讯员兼征兵员托马斯·辛顿称他为“十足的暴君”和“畜生”，因为他将年长居民驱逐出社区。自由民村开放后，军方官员摧毁了巴克营地，但仍有五百多名前居民留在了该地区。²⁵\n\
  \n\n\n\n正如尼科尔斯和其他白人改革者所发现的那样，许多黑人并不愿意被动接受白人的恩惠——他们希望在解放后的世界里掌控自己的命运。威廉·J·威尔逊正是这种诉求的化身。威尔逊在坎普·巴克学校担任教师，是该地区美国传教士协会学校中唯一受雇的黑人教师。他生而为奴，却设法获得了自由，随后前往布鲁克林，在那里当了二十年的教师和校长。他因卓越的教育成就和公共活动而声名远扬。他以笔名“埃塞俄普”在弗雷德里克·道格拉斯的废奴报纸上发表文章，有时会与当地白人的意见发生冲突。²⁶\n\
  \n威尔逊在 1863 年首次访问华盛顿时便对其印象深刻，次年他搬到这座城市，负责管理坎普·巴克学校。校舍没有厕所，只有几把破椅子作为家具，但威尔逊和他的妻子玛丽将其变成了一所熙熙攘攘的学校，平均约有\
  \ 250 名学生，其中包括许多成年人。他们急需更多帮助，但威廉坚持一点：学校的教师必须是黑人。“有色人种必须学会自己做自己的事，只接受主导阶级的协助。这与要完成的工作本身同样重要，”他告诉上司。“只要主导阶级占据我们中的首要位置，即使可以避免这种情况，而我们却被视为未成年人和恩惠的接受者，我们就永远只是同样无助、依赖的奴隶。”威尔逊夫妇可能与丹福思及其他白人改革者有着共同的目标——他们都希望帮助前奴隶成为有生产力、自力更生且独立的公民——但他们和其他黑人活动家高度重视自主权。自由的全部意义就在于能够为自己而活。²⁷\n\
  \n阶级、文化和控制权上的冲突不仅分裂了白人和黑人改革者，也在华盛顿的黑人社区内部爆发。许多华盛顿的黑人领袖，如教育家小约翰·F·库克，生来自由，受过教育，战前过着相对稳定的生活。他们曾与中上层白人并肩作战，争取黑人自由，并向往中产阶级的理想。战前，受过教育的华盛顿黑人社区的主流道德规范吸收并同化了来自南方农村的少量移民。但战争期间，成千上万的前种植园奴隶突然涌入，改变了这一局面。\n\
  \n当解放最终到来时，黑人领袖们欣喜若狂，但他们也担心农村移民可能会破坏他们在城市中艰难取得的成果。这些新华盛顿人显得如此不同，如此乡土，如此喧闹，而且对一些中产阶级黑人来说，他们对自由毫无准备。“从奴隶制到自由的过渡太突然了，”伊丽莎白·凯克利写道，前奴隶“并没有为展现在[他们]面前的新生活做好准备。”²⁸\n\
  \n尽管黑人领袖努力强调工作、节制和教育等中产阶级美德，但一些前奴隶仍难以找到工作，并触犯了法律。对前奴隶的担忧在黑人社区中流传。黑人通讯员托马斯·欣顿抱怨那些衣着过分的自由民，“他们已经下定决心不让自己在工作上受累。”这些分歧并未逃过白人观察者的眼睛。记者洛伊丝·亚当斯目睹了本地黑人华盛顿人与新来者之间的冲突，指出“一些华盛顿的有色人种本地人对他们那些血统更纯正但不够贵族气的违禁品兄弟姊妹表现出极大的厌恶。”军官威廉·多斯特写道：“华盛顿的自由有色人种憎恨[前奴隶]如同竞争对手。奴隶们则鄙视他们是逃犯。”²⁹\n\
  \n前奴隶感激人们给予他们的慷慨，但有时他们也对本地华盛顿人流露出的优越感和居高临下的态度感到愤恨。1864 年，一位匿名写信给《每周盎格鲁-非洲人》报的人已经受够了针对南方移民的“不友善”批评和“偏见”，尤其是来自北方访客的。“我们是一个敏感的民族，一直受到那些认为来到华盛顿就是来到南方、面对一群迟钝傻瓜的人的不公正对待和批评，”写信人警告说。“不要带着你们仓促形成的、基于道听途说的观点来到我们中间，而是带给我们光明、榜样和智慧，而不是那么多的挑剔。”³⁰\n\
  \n尽管偶尔发生种族内部争吵，但黑人社区总体上仍然团结一致，拥护并倡导超越单纯“不再是奴隶”的广泛自由、平等和公民权定义。华盛顿黑人社区的迅速增长无疑带来了挑战，但也为重新定义城市中的种族关系提供了机会。无论是本地人还是新近到来的黑人华盛顿人，都联合起来，在面对战时限制解放革命性影响的努力中，坚定地维护自己的权利。\n\
  \n### *“自由，自由，自由无处不在！”：黑人华盛顿人推动革命性变革*\n\n凭借不断增长的人数，并因感到有联邦政府支持而充满力量，黑人华盛顿人以前所未有的方式挑战当局。他们的首要目标之一是《逃亡奴隶法》，该法在技术上仍然适用于从边境蓄奴州逃出的奴隶，即使在\
  \ 1862 年 4 月华盛顿特区解放法案和 1863 年 1 月《解放宣言》通过之后也是如此。华盛顿特区联邦法院于 1862 年设立了一个逃亡奴隶委员会，以帮助奴隶主追回他们逃跑的财产，但委员们发现他们根本无法执行该法律。他们与联邦官员（尤其是该地区的军事总督詹姆斯·沃兹沃思）斗争，并遇到了来自黑人华盛顿人几乎无法克服的抵抗。\n\
  \n成群的黑人居民骚扰潜在的奴隶追捕者，挤满法庭向委员们作证。到 1862 年 5 月下旬，《国家共和党人》报报道称，“我们的街道上不断发生斗殴和打斗，每天都有令人心碎的景象。”编辑们认为，“《逃亡奴隶法》无法在这里执行而不引发骚乱和冲突，这将是可悲的，甚至可能危及公共和平。”尽管该法律直到\
  \ 1864 年才被废除，但到 1862 年中期，它在国家首都实际上已经形同虚设。³¹\n\n一位弗吉尼亚奴隶主发现，试图重新主张对现居华盛顿的前奴隶的所有权是徒劳的。他在一位圣公会牧师的陪同下前往华盛顿特区，想要追回几名从他种植园逃跑、现在华盛顿为联邦军队做洗衣女工的女奴。在与主管丹福思·尼科尔斯以及这些前奴隶会面时，这位奴隶主恳求她们回去，但女人们拒绝了。其中一人递给尼科尔斯一把屠刀，指示他“把那个要来带走我女儿的人身上的邪恶血液放干。”奴隶主空手而归。³²\n\
  \n\n\n\n黑人居民也宣称对城市公共空间的所有权。自解放伊始，华盛顿的街道便成为各类黑人庆祝活动的舞台。诸如大联合共济会等黑人组织将会议和集会移至公共区域，在街头游行，记者洛伊丝·亚当斯描述道，他们“身着华丽的盛装，行进时乐队奏乐，手持花环和装饰着格言的标语，星条旗在他们前进的整条线路上方飘扬。”³³\n\
  \n这些公共活动中的言辞——大胆、强调、甚至带有对抗性——反映了华盛顿黑人感受到的崭新而强烈的权力与平等意识。在 1863 年的解放日庆祝活动上，托马斯·欣顿赞扬了一名因不服从命令而用刺刀刺伤白人士兵的黑人士兵，并痛斥他在城市中目睹的持续歧视。\n\
  \n当数千名来自安息日学校联盟的学生和教师从第十五街长老会教堂游行穿过市中心，抵达以色列伯特利教堂时，一名参与者惊叹道：“支持奴隶制的公民几乎不敢相信自己的眼睛。”到\
  \ 1863 年，黑人已将华盛顿的街道——几年前还曾踏过奴隶贩运队伍——转变为解放的证明场。³⁴\n\n华盛顿黑人还争取全面接受教育的权利。“让孩子们留在学校，”佩恩主教在解放之际敦促新获自由的黑奴，“即使你们必须少吃、少喝、穿更粗糙的衣服。”他们确实这样做了。“他们最大的渴望是学会阅读，”哈丽雅特·雅各布斯在描述她遇到的新获自由的华盛顿时写道。渴望获得曾被剥夺的教育，前奴隶们涌入当地教堂、自由民援助协会以及新获自由者自己建立的私立学校。这些学校通常设在临时建筑中，资源匮乏，但到\
  \ 1864 年，这座城市已拥有超过二十所日间学校和十八所夜校，教育着超过 4600 名黑人学生。³⁵\n\n战前已有黑人私立学校。然而，现在黑人领袖也推动获得公共教育的机会。战前，城市法律将\
  \ 10%的税收拨给公立学校基金，但该资金仅支持白人学校。解放后，国会要求将从黑人纳税人那里征收的 10%税收用于为黑人学生建立“初等学校体系”，由联邦任命的黑人学校董事会管理。然而，市议会连续两年拒绝将资金拨给这些学校。市长理查德·沃勒克在\
  \ 1862 年 6 月的选举中将反对黑人公立教育作为获胜议题，因此华盛顿特区第一所官方黑人公立学校直到 1864 年 3 月才开学。³⁶\n\n尽管有此延迟，华盛顿黑人仍比南方其他地区更早建立了公立学校。这些学校实行种族隔离，但教学和管理却是跨种族的努力。混血女性艾玛·V·布朗曾是迈尔蒂拉·迈纳学校的学生，在欧柏林学院学习后返回城市，在乔治敦\
  \ P 街的家中为黑人儿童开办了一所学校。她与白人学校专员丹尼尔·布里德以及来自新英格兰自由民援助协会的白人助理弗朗西斯·珀金斯密切合作，开始在华盛顿首批黑人公立学校之一任教。后来她成为位于西北区第十七街与\
  \ M 街交汇处的萨姆纳学校的校长。³⁷\n\n华盛顿黑人不仅争取作为自由公民的权利，还寻求承担公民身份的首要责任之一：作为士兵保卫国家。自 1861 年 4\
  \ 月紧张时期雅各布·多德森提出提供黑人士兵保卫城市但遭拒绝以来，黑人领袖及其白人盟友一直推动林肯政府招募黑人士兵加入联邦军队。他们将参军视为对完全平等和男子气概的无可争议的主张。“当你拿到枪，”华盛顿居民塞缪尔·威尔逊说，“你将成为一个男人。”³⁸\n\
  \n《解放宣言》于 1863 年 1 月为黑人服兵役打开了大门，由教育家小约翰·F·库克、地下铁路指挥者安东尼·鲍恩以及牧师亨利·麦克尼尔·特纳领导的跨种族努力很快在华盛顿招募了一个黑人团：第一美国有色人种部队。一些志愿者来自显赫的黑人家庭，但华盛顿在联邦军队服役的\
  \ 3265 名黑人中，大部分是迁移到城市的前奴隶。一些较富裕的黑人男性，如同他们的白人同龄人，选择花钱请人代替服役——这种做法激怒了鲍恩。战争提供了“有色人种为我们自己的自由而战的金色机会，”他于\
  \ 1864 年在韦斯利 AME 锡安教堂对人群说。我们“应该证明自己配得上我们所享有的自由。”³⁹\n\n到 1863 年 6 月底，华盛顿首批黑人士兵集合执勤，开始在波托马克河上的梅森岛（现罗斯福岛）进行训练。身着整洁蓝色联邦制服的黑人男性自信地在华盛顿街头操练的景象，捕捉了战争带来的黑人地位的巨大变化。曾经黑人处于明确的从属地位并依赖白人的宽宏大量，如今他们以民主制度下完全公民的身份主张自己——在公共空间举办活动，用公共资金教育子女，组织政治行动，并拿起武器为联邦而战。\n\
  \n华盛顿的白人至上主义者对改变这座城市的巨大变化感到震惊。黑人将解放视为成为完全公民的第一步，而大多数华盛顿白人则将解放视为最终目的地，是黑人抱负的天花板。华盛顿的许多联邦支持者可能勉强接受了解放的现实，但他们拒绝任何超越此限的东西。黑人在法律上可以自由，但他们不能与白人平等。市长理查德·沃勒克等城市领导人试图通过政治操纵和阻挠来限制解放的影响。他们的顽固不化导致白人记者洛伊丝·亚当斯谴责“华盛顿特区官员们胆小、谄媚的精神”，他们“对废奴主义、激进主义、进步等词语真正南方式的恐惧”表明，“如果奴隶制已死，其精神犹存。”⁴⁰\n\
  \n![Image](img/f0001-09.jpg)\n\n*第四有色人种步兵连 E 连，驻扎在华盛顿东北部的林肯堡。超过 3200 名华盛顿黑人在联邦军队服役。他们对联邦胜利的服役和贡献推动了战后争取投票权的努力。国会图书馆。*\n\
  \n\n\n企业，尤其是该市新兴的有轨电车公司，在黑人顾客日益增长的期望与许多白人顾客的保守愤怒之间艰难寻求平衡。华盛顿特区第一家有轨电车公司（华盛顿与乔治城铁路公司）成立于\
  \ 1862 年，沿袭了该市公共马车确立的普遍惯例——黑人不得坐在车厢内，但可以站在外侧平台上，那里会暴露在风雨中。黑人乘客如今反对这种做法。军事招募官兼记者托马斯·辛顿称这种隔离是“奴隶制在我们中间存在的特征之一”。尤其是黑人士兵拒绝站在外侧平台上。正如一位记者所指出：“士兵们乘坐有轨电车或任何他们想乘坐的车；你若是宣称因为他们是有色人种就不能乘坐，那还不如直接向他们宣战。”⁴¹\n\
  \n白人售票员坚决抵制任何习俗上的改变。一起广为人知的事件涉及联邦军黑人外科医生亚历山大·奥古斯塔少校，他被从十四街线的有轨电车上扔到了雨中。有轨电车公司试图通过为黑人乘客开设单独车厢来避免麻烦，但在解放后的华盛顿，这远远不够。抗议持续不断，1864\
  \ 年，在马萨诸塞州共和党参议员查尔斯·萨姆纳的领导下，国会利用其授予特许状的权力，迫使大都会铁路公司为白人和黑人乘客提供平等服务。⁴²\n\n一些白人居民以暴力回应这些革命性的变化。黑人士兵成为主要目标。战争期间由反对解放奴隶的白人联邦主义者创办的报纸《宪法联盟报》对黑人士兵表现出的“傲慢与高傲姿态”大为光火。编辑们认为，面对这种傲慢，白人的暴力是可以理解的，因为穿制服的黑人“因士兵这一新职业而虚荣膨胀……自认为比白人优越，变得无礼且专横。”⁴³\n\
  \n成群的白人暴徒还袭击了该市最显眼的黑人机构——教堂和学校——并试图恐吓牧师和教师。白人治安维持会成员使用暴力传递了一个明确的信息：黑人仍应被视为二等公民。白人警察很少干预制止此类暴力，而黑人受害者往往难以获得赔偿。“法律，”托马斯·辛顿在《解放者报》上愤怒地写道，“仅仅是为白人制定的，而不是为黑人。”⁴⁴\n\
  \n然而，白人的暴力无法阻止华盛顿的黑人居民在 1865 年宣称对美国民主最具象征意义的两座公共建筑的所有权。2 月，第十五街长老会教堂的牧师亨利·海兰·加内特成为第一位在国会大厦发表演讲的黑人，他在国会就禁止奴隶制的第十三修正案通过一事发表讲话。这一事件具有巨大的象征意义。奴隶曾帮助建造国会大厦，奴隶贩运队伍曾在它的阴影下经过，黑人曾一度被禁止进入其场地。如今，该市最杰出的黑人领袖之一站在了议长席上。\n\
  \n被洛伊斯·亚当斯描述为“一位受过教育、博览群书的人，一位真诚、令人愉悦的演说家，一位为其受压迫和受苦的人民的权利而热切辩护的人”的加内特，在“四面挤满了人”的旁听席前发表演讲，其中大多是热切的黑人访客。加内特不仅赞扬国会结束了他认为是对上帝和国家缔造者的罪行，还提出了美国黑人解放后的议程：“*解放、赋予选举权、教育，并将福音的祝福赐予每一位美国公民*。”⁴⁵\n\
  \n1865 年 4 月亚伯拉罕·林肯遇刺以及内战的结束，激励了华盛顿的黑人居民及其共和党盟友在第二个重要的民主象征——行政官邸——前哀悼、庆祝并集会。为了最大化其象征意义，组织者选择在\
  \ 7 月 4 日举办活动。在解放之前，7 月 4 日一直刺痛着黑人的神经，残酷地提醒着美国在种族和自由问题上的虚伪。但随着战争结束和国会通过第十三修正案（尚需四分之三的州批准），这个节日成为黑人争取其作为国家正式公民应有地位的又一次机会。他们在如今被称为椭圆广场（位于总统府南侧）的地方筹备了一场盛大的庆祝活动。主办方声称这是“有色人种首次尝试举办具有国家性质的庆祝活动”，数千人带着横幅、旗帜和食物前来参加。由小约翰·F·库克主持，废奴主义参议员亨利·威尔逊担任主旨发言人，一系列演讲者阐述了在解放后的世界中黑人权利的主张，而林肯的继任者安德鲁·约翰逊则在远处观望。⁴⁶\n\
  \n到 1865 年，华盛顿显然已经发生了不可逆转的变化。白人废奴主义者詹姆斯·麦金姆将这座城市与战前相比，写信给一位朋友说：“如今，我看到了什么？自由，自由，无处不在的自由！在总统府，在国会两院，在最高法院……在酒店，在公园，在街头，到处都是自由，人人自由！不是名义上或抽象的自由，而是真实而实际的自由。”麦金姆捕捉到了许多人对这座城市惊人转变所感受到的兴奋，但他夸大了华盛顿街头实际享有的自由程度。“每个人”能在华盛顿享受到多少自由，将在很大程度上取决于战后几年迫在眉睫的政治斗争。⁴⁷\n\
  \n### *“自谋生计的机会”：自由民局与战后自由的过渡*\n\n国会大厦顶部令人惊叹的新圆顶于 1863 年 12 月竣工，俯瞰着一座因战争而转型的城市——从一位观察者所称的容纳季节性政府的“安静、偏僻之地”转变为新兴联邦国家的行政神经中枢。战时紧急情况迫使国会开始现代化并改善城市的道路、下水道系统和供水设施，包括\
  \ 1863 年开通的耗资 330 万美元的华盛顿引水渠。四年来，这座城市因新来者的涌入而充满活力，国会的战时拨款推动了经济繁荣，在政府办公室、军队牲畜场、军事堡垒和医院中雇佣了数千名工人。1865\
  \ 年，该市人口激增至近 12.7 万，其中大多数人是在战争开始后抵达的——约一半的白人居民和三分之二的黑人居民是华盛顿的新来者。⁴⁸\n\n国会内部的转变同样引人注目。国会不再是蓄奴的南方权贵的领地，而是由新兴的共和党统治，该党因四年的战争和该党首位总统的遇刺而变得胆大妄为且心怀怨恨。在马萨诸塞州参议员查尔斯·萨姆纳和宾夕法尼亚州众议员撒迪厄斯·史蒂文斯等激进派的领导下，国会中的共和党人将战后时期视为扩大联邦权力、沿着更平等的路线重塑国家——以及惩罚敌人的机会。他们推行了一系列雄心勃勃的政策，为黑人在住房、工作、教育和政治方面的权利和机会奠定了坚实基础。\n\
  \n\n\n实施这些政策的最佳起点是华盛顿，国会在此拥有专属立法权。尽管这座城市从未被邦联占领，但激进共和党人将当地白人视为“骨子里的反叛者”，并将华盛顿视为后来被称为国会重建或激进重建的试验场。\n\
  \n该试验场最早的项目之一是难民、自由民和废弃土地局（简称自由民局），这是一个新的联邦机构，专注于帮助前奴隶适应自由生活。经过两年的争论——部分原因是包括弗雷德里克·道格拉斯在内的许多黑人领袖担心该机构固有的家长式作风——1865\
  \ 年 3 月，国会在战争部内设立了自由民局。在虔诚的联邦将军 O. O. 霍华德的领导下，它迅速成为战后最引人注目的政府机构之一。直到 1872 年解散，该局推行了富有创意且颇具争议的计划，这些计划将在未来多年塑造该市的种族关系。⁴⁹\n\
  \n该局负责“所有与来自叛乱州的难民和自由民相关的事务”，这是一项涵盖住房、教育、家庭团聚和就业援助的广泛使命——在没有任何联邦机构曾直接向个人提供援助的时代，这是联邦权力的显著扩张。然而，这种援助伴随着一系列期望。该局使命中一个未明说但至关重要的部分是“教化”曾被奴役的人，教导他们自给自足，并鼓励他们接受中产阶级的美德：勤劳、节俭、谨慎和信仰。由于其首都地位、靠近立法者和北方，以及近三万名前奴隶迁移到该市，华盛顿成为自由民局活动的焦点。⁵⁰\n\
  \n自由民局面临着艰巨的挑战。战争结束时，这座城市一片狼藉。联邦军队将国家广场变成了牲畜围场，市区内几乎所有的树木都被砍伐，许多城市公园变成了露天医院，道路坑洼不平几乎无法修复。军队的迅速复员摧毁了当地经济，依赖军队的生意纷纷倒闭。“华盛顿现在是一个沸腾、蒸腾、呻吟的漩涡，充斥着耗尽精力的人类，”洛伊斯·亚当斯在\
  \ 1865 年 6 月写道。⁵¹\n\n自由民群体处境艰难。许多当地白人仍将他们称为“违禁品”——威廉·奥纳抱怨说“把一个被偷来的南方黑鬼称为自由民简直是胡说八道”——当他们赖以生存的体力劳动工作随着军队消失时，他们陷入了困境。失业率高达\
  \ 80%，他们聚集在肮脏的营地和恶化的贫民窟中，疾病和饥饿如影随形。西北区一群绝望的前奴隶收集死马的骨头，试图将其作为肥料卖给农民；担心疾病传播，自由民局的卫生官员下令关闭了这一操作。一位市议员在\
  \ 1866 年估计，自战争开始以来抵达华盛顿的移民中，有一半已经死亡。⁵²\n\n为了应对这场人道主义危机，自由民局与军方和私人援助组织合作协调救援工作，向贫困的华盛顿居民提供食物、燃料、毯子和衣物。这种直接慈善是临时性的。该局官员担心自由民男女可能过度依赖联邦援助，而市长理查德·沃勒克等白人批评者声称，“成千上万的违禁品”正被“自由民局的施舍所诱惑，被吸引到这个‘自由民的天堂’来懒散度日。”⁵³然而，需求如此之大，以至于该局在其存续期间一直持续提供直接援助。\n\
  \n随着军队撤离，该局官员努力在哥伦比亚特区内为自由民寻找工作。和平时期的华盛顿根本无法为非熟练工人提供足够的经济机会。于是，该局变成了一个劳工安置办公室，代理人将北方雇主与黑人劳工联系起来。该局甚至为黑人离开城市支付交通费用，导致被指控“贩卖黑人”。该局官员声称，在三年内，他们帮助了超过\
  \ 7600 名前奴隶在华盛顿以外找到工作。该局的约翰·伊顿说，这样的工作给了获得自由的黑人“一个自食其力的机会，远离因居住在肮脏住所和无所事事而产生的恶习和疾病，这是一种卫生和社会危险，也是政府的负担。”⁵⁴\n\
  \n然而，许多前奴隶拒绝离开华盛顿，他们已在此立足，并相信可以依靠联邦保护。成千上万的人擅自占用无人居住的土地，尤其是在联邦堡垒附近，或者住在肮脏的私人营房里，常常招致白人邻居的愤怒。他们决心留在城市，不仅要求临时援助，还要求拥有自己的土地。⁵⁵\n\
  \n自由民对土地的渴望，加上该局自身对发展黑人自给自足的兴趣，促使官员们创建了鼓励黑人拥有土地和住房的计划。为了应对白人的批评，该局官员试图在已经是黑人聚居区或无人居住且远离白人邻居的地区建立“黑人殖民地”。通过这种方式，该局推动了住房种族隔离的进程，这一进程将标志着\
  \ 19 世纪末的特征。⁵⁶\n\n也许最成功的住房所有权计划是华盛顿东南区的巴里农场社区。巴里农场的起源是白人地主试图驱逐居住在西北区梅里迪恩山地区其土地上的黑人擅自占用者。霍华德将军与该地区的黑人家庭会面讨论此事，其中几人告诉他他们想要什么：土地。霍华德提议在阿纳科斯蒂亚河东岸建立一个黑人殖民地，就在白人小社区尤宁敦的南边，该地区在战争结束时几乎完全是乡村。⁵⁷\n\
  \n1867 年，霍华德使用自由民局的资金从已故奴隶主詹姆斯·巴里的家族手中购买了 375 英亩土地。鉴于当地对黑人土地所有权的敌意，一名白人中间人购买了这块土地，而该家族完全不知道它将被改造成黑人定居点。该局将这片区域划分为大约一英亩的地块，以每英亩\
  \ 125 至 300 美元的价格出售给前奴隶，其中包括建造一间两居室房屋所需的足够木材。居民有两年时间付款。早期居民之一是埃米莉·埃德蒙森，她是著名的前奴隶，曾于\
  \ 1848 年试图乘坐“珍珠号”逃跑。两年内，266 户家庭搬到了巴里农场，居民们很快建起了学校、教堂和其他社区机构。该地区于 1874 年正式更名为希尔斯代尔，形成了后来该市最大黑人社区的核心。⁵⁸\n\
  \n\n\n\n自由民局的另一项成就是教育，该机构的优先事项与黑人社区的利益不谋而合。该局为黑人儿童建造了数十所学校，通常是将现有的私立黑人学校纳入公立体系。事实上，随着公立机构与私人自由民救济组织提供的教师和工作人员密切合作，公立与私立之间的界限变得模糊。1866\
  \ 年 1 月，有 5600 名黑人学生在 50 多所日间学校就读；到 6 月，超过 1 万名学生在上学。当市教育总监亨利·巴纳德在 1867 年对黑人教育进行调查时，他发现黑人儿童入学比例高于白人儿童。巴纳德写道，黑人学生表现出非凡的“学习热忱”。“从未有任何一所黑人学校因缺乏学生而办不下去。”⁵⁹\n\
  \n对学习的追求也延伸到了高等教育。战争结束后不久，国家林肯纪念碑协会提议为获得自由的黑人建造一所大学，以纪念这位遇刺的总统。尽管这一想法未能实现，但 1867\
  \ 年 3 月，国会特许在西北第七街一处前违禁品营地附近建造一所新的男女同校、种族融合的大学。该大学最初由自由民局资助，校园内有一座三层楼高、花岗岩地基的教学楼，设有\
  \ 32 间教室、一栋女生宿舍（以战前教育家迈尔蒂拉·迈纳命名）以及一所医院。校董们以自由民局局长 O. O. 霍华德的名字命名该大学，他后来成为该校第三任校长。⁶⁰\n\
  \n从建校之初，霍华德大学就向所有种族开放（前违禁品营地白人主管丹福斯·尼科尔斯的三个女儿曾就读于此），但主要面向黑人学生，他们占学生总数的绝大多数。在霍华德将军的领导下，这所大学与当时南方各地为黑人学生创办的其他学院一样，致力于灌输虔诚、纪律和勤劳的美德。但它也强调学术追求，提供全面的课程，包括必修的希腊语和拉丁语课程，以及法律和医学方面的专业教育。到\
  \ 19 世纪末，霍华德大学已赢得全国首屈一指的黑人高等教育机构的声誉。\n\n然而，尽管取得了诸多成功，自由民局仍面临严峻挑战。该局的工作人员构成复杂，在提供救济的方式上存在冲突。反奴隶制运动的资深人士被该组织的使命所吸引，优先考虑同情、平等和种族正义。他们经常与该局的军人（强调自给自足和效率）以及担心选举后果的政治上级发生冲突。来自康涅狄格州的白人废奴主义者和女权倡导者约瑟芬·格里芬在自由民局华盛顿特区分局只待了一年，因为她多次与上司争执。被解雇后，她向一位朋友抱怨道：“我并不是说存在一个*直接阴谋*和*意图杀死*这些黑人，但我确实断言，在这座城市里，成千上万的人本可以得到援助，如果总统和自由民局愿意承认这些被解放者应得的权利，他们本可以获救。”⁶¹\n\
  \n无论是军人还是文职人员，自由民局官员普遍致力于重塑黑人的行为，使其符合白人社会的标准，这种家长式做法忽视了自由民对自主权的渴望。1866 年清理“谋杀湾”期间发生的一件事，就是该局与当地黑人社区互动的一个令人不安的例子。“谋杀湾”位于宾夕法尼亚大道以南，即现在的联邦三角区，那里过度拥挤、疾病肆虐、极度贫困。警察局长\
  \ A. C. 理查兹在给国会的报告中描述，几代同堂的家庭挤在“令人窒息且恶心”的八英尺见方的小屋里，“没有光线和通风”。⁶²\n\n自由民局官员担心这种肮脏的生活条件会导致道德和身体上的堕落，于是他们运来一车车石灰，强迫居民对房屋进行消毒，然后粉刷内外墙壁。社区里没有人被征求意见，没有人获得许可，也没有人可以拒绝参与。尽管自由民局官员吹嘘这些房屋“在卫生条件上已尽可能好”，但这一经历暴露了对黑人自主权缺乏尊重。在经历了奴隶制生活后，获得自由的黑人最珍视自主权，他们常常抵制自由民局官员的家长式态度和政策。⁶³\n\
  \n自由民局的使命也与许多当地白人领袖、保守派国会议员以及其他反对黑人平等的人士发生冲突。市长沃勒克等地方官员将违禁品社区视为严重问题，并抱怨“不可能”为自由民局的努力提供资金。市议员塞缪尔·皮尤担心，“国会强加给我们的沉重责任”将迫使该市削减对白人的服务。⁶⁴\n\
  \n其他白人居民指责自由民局存在种族偏袒。威廉·奥纳在西北 F 街的窗户旁愤怒地看着自由民局工作人员将一车车木柴送到黑人邻居手中，“却没有一根木柴送给‘穷苦白人’。”奥纳以他一贯直白的语言在日记中抱怨道：“黑鬼得到了一切——白人为此买单。”⁶⁵\
  \ 这种批评迫使自由民局改变政策，开始向贫困白人发放援助。1866 年接受援助的 9264 人中，约 45%是白人。⁶⁶\n\n尽管面临无情的反对、内部纷争以及控制黑人行为的倾向，自由民局在极短的时间内取得了显著进展。到\
  \ 1872 年关闭时，它帮助无数人度过了困难时期，为数千人（无论是在华盛顿特区还是其他地方）找到了工作，为黑人公共教育奠定了基础，并在阿纳科斯蒂亚创建了一个自给自足的黑人社区。作为第一个致力于改善社会福利的联邦机构，自由民局推动了内战结束后这座城市发生的巨大变革。\n\
  \n### *“没有选举权，我们就得不到保护”：争取黑人男性投票权的斗争*\n\n乔治·哈顿体现了战争结束后新时代的曙光。哈顿出生于乔治王子县的一个奴隶家庭，以一种不同寻常的方式获得了自由——从他的自由黑人父亲亨利·哈顿那里。在乔治的原主人去世后，亨利·哈顿买下了乔治、他的母亲和兄弟姐妹，全家搬到了华盛顿。亨利从未提交正式文件来合法解放乔治和另外两个孩子，因此当\
  \ 1862 年 4 月华盛顿特区解放法案通过时，他为他的三个“奴隶”提交了赔偿申请。他获得了 1839.60 美元。⁶⁷\n\n\n\n\n被形容为“深肤色黑白混血儿”的乔治·哈顿身材敦实，身高五英尺六英寸，用同时代人的话说，“满脑子都是机智与常识”，他嗓音洪亮，谈吐迷人，性格好斗。在\
  \ 1863 年的解放日庆祝活动上，年仅二十岁的哈顿坚决主张“在获得权利并能坐在车厢里之前，他绝不乘坐（有轨）电车”。两个月后，他成为首批报名加入美国有色人种部队的黑人之一。当他和另外一些黑人在征兵站排队时，一群愤怒的白人和警察上前挑衅。哈顿寸步不让，挑衅他们开枪。没有人敢开枪。⁶⁸\n\
  \n参战经历让哈顿确信黑人已经赢得了自由——“枷锁已落，我们的束缚结束了，”他写道——但联邦军队中挥之不去的种族主义让他怀疑黑人能否在美国被当作完全公民对待。哈顿在彼得斯堡战役中左膝中弹受伤，行动不便，于\
  \ 1864 年返回华盛顿，准备以战斗老兵和完全公民的身份主张自己的权利。他加入共和党，投身于关于选举权、融合学校以及劳工权利的政治斗争。五年之内，这位二十七岁的前奴隶当选为市议会议员。⁶⁹\n\
  \n乔治·哈顿从奴隶到议员的迅速崛起，显示出自 19 世纪 50 年代以来华盛顿发生了多么巨大的变化。他和其他黑人公职人员，或许是“激进派实验园”中最具争议的种子结出的果实：选举权。\n\
  \n争取黑人男性选举权的运动始于内战期间。哥伦比亚特区解放法案和《解放宣言》均未提及选举权，因为这个问题过于敏感——在 1862 年或 1863 年，只有最激进的白人共和党人支持这一想法。林肯总统和其他温和派共和党人认为，公民平等（即解放）不一定涉及政治平等（即投票权）。但黑人倡导者及其激进的白人支持者坚持认为两者不可分割。他们认为，要成为完全的美国人，黑人男性必须能够投票；在奴隶与公民之间，根本不存在既不投票也不属于奴隶的中间状态。\n\
  \n战争期间，黑人男性开始通过联邦联盟进行政治组织。哥伦比亚特区的联邦联盟成立于 1863 年，最初倡导种族隔离，但不到一年就变成了跨种族组织，其中充斥着许多参与招募黑人士兵的人。联邦联盟是跨种族政治领域的早期尝试，让黑人领袖有机会与白人同行合作，学习政治组织的方式。⁷⁰\n\
  \n战争本身，以及黑人士兵在帮助赢得战争中所起的关键作用，促使越来越多的白人共和党人支持黑人男性的选举权。到 1864 年，当国会开始辩论续期城市宪章时，查尔斯·萨姆纳和其他激进派试图要求赋予黑人男性选举权。“仅仅因为肤色而剥夺任何人的选举权，是不男子气、不基督教、不美国的行为，”《国家共和党人报》的编辑在\
  \ 1864 年 12 月写道。到 1865 年 4 月，就连林肯总统也开始向这一呼声让步，他表示他更希望“现在就将选举权授予那些非常聪明的人，以及那些作为士兵为我们的事业服务的人”——这一言论促使约翰·威尔克斯·布斯放弃绑架总统的计划，转而决定谋杀。然而，保守派共和党人和当地白人领袖的抵制阻碍了战时的推动。⁷¹\n\
  \n战后，华盛顿的黑人居民将选举权置于议程首位。在白宫前举行的盛大的 7 月 4 日林肯总统纪念活动上，一位又一位演讲者坚持认为投票权至关重要。哥伦比亚特区解放法案的起草者亨利·威尔逊参议员指出，市长沃勒克拒绝了参加活动的邀请，但“我隐约觉得，如果你们拥有选举权，沃勒克市长，或许整个市政府都会到场。”此后不久，黑人教会领袖组织了一个联合选举权联盟，以协调选举权运动。在黑人人口众多的第一选区（覆盖了从运河到岩溪的华盛顿市中心大部分地区），黑人专业人士牵头成立了第一选区民权协会，该协会倡导投票权，并组织抵制反对选举权的企业。⁷²\n\
  \n第一选区最杰出的领袖之一、教育家小约翰·F·库克帮助领导了一场请愿活动，以鼓励国会支持黑人男性的选举权。请愿书强调黑人男性已经赢得了这一权利，提到了黑人士兵的牺牲、哥伦比亚特区黑人企业家的成功，以及黑人对建设性社区机构的承诺。“我们有足够的智慧去勤奋工作、积累财产、建造并维持教堂和学习机构，”请愿书写道。“没有选举权，我们就得不到保护，容易遭受暴行的联合攻击。”这份请愿书在\
  \ 1865 年秋季提交给国会之前，征集了超过 2500 个签名。⁷³\n\n这份请愿书在激进共和党人中找到了共鸣。尽管在本党内属于少数，但激进派设定了战后的立法议程，并将哥伦比亚特区选举权法案列为重中之重——它是\
  \ H.R. 1，即 1865 年 12 月第三十九届国会召开时众议院审议的第一项立法。与解放法案一样，激进共和党人希望将华盛顿作为黑人男性选举权的试验场，并计划在南方各地推行。缅因州参议员洛特·莫里尔认为，国会将选举权扩大到黑人男性，是“不仅严格为哥伦比亚特区，而且在某种意义上为整个国家开创一项政策”。该法案“通过赋予选举权来完成解放”，并将“为整个国家树立榜样”，萨姆纳参议员表示赞同。“它成为一座火柱，照亮数百万人的脚步。”⁷⁴\n\
  \n然而，黑人男性的选举权仍然极具争议，即使在共和党内部也是如此。《晚星报》是一份温和的共和党报纸，随着时间推移变得越来越保守，它认为选举权法案是“对整个联邦白人劳动男性权利的宣战”。《星报》的编辑警告说，将选举权赋予“最无知、最无能的违禁品黑人”，将会“使这座城市非洲化”，并将其变成“黑人的乌托邦”。只有一家地方报纸《纪事报》支持选举权，而且还有限制条件，即不给前奴隶和无财产者投票权。激进派独自倡导“普适”的男性选举权，不设任何排除条件。⁷⁵\n\
  \n反对黑人男性选举权的人也认识到，哥伦比亚特区可能为全国树立先例。“华盛顿关于选举权的斗争不过是一场实验、一次小规模冲突、一个楔子，为国会中类似的运动铺平道路，以便将选举权赋予美国所有黑人，”肯塔基州参议员加勒特·戴维斯警告说。“这是四年前该党策略的延续，当时对哥伦比亚特区奴隶制的攻击预示着将要对其发起的全面运动。”⁷⁶华盛顿如何走，全国就会如何走。\n\
  \n\n\n在许多反对黑人男性选举权的人心中，对黑人政治权力的恐惧与对“社会平等”的恐惧交织在一起。很少有公众人物——无论黑人还是白人——声称支持社会平等，因为社会平等意味着在私人生活中不存在社会区分或对跨种族关系的限制。深知“社会平等”这个吓人鬼话的力量，就连支持黑人男性选举权的人也费尽心思地辩称，他们支持的是*公民*平等（法律平等保护）和*政治*平等（选举权和担任公职），而*不是*社会平等。⁷⁷\n\
  \n然而，反对者坚持认为，前者必然导致后者。《国家情报报》的编辑们——他们相当准确地代表了白人民主党人的观点——解释了授予黑人男性投票权如何会不可避免地导致种族混合。黑人选民将“通过党团会议的障眼法，在提名中智胜并票数压倒白人”，然后帮助选举黑人官员，这些官员将与白人同事密切合作并开始共度时光。他们将“混迹于‘那个圈子’的招待会和时尚聚会中；送他们的孩子上同一所学校；最终……在商业和其他交往中建立并维持所有关系，仿佛他们是同一种族、血统、血脉或世系。”⁷⁸\n\
  \n大多数华盛顿白人居民对战后推动黑人男性选举权的反应是近乎歇斯底里的恐慌。1865 年底，地方领导人仓促实施了一次关于黑人选举权的公投。公投仅限于白人选民，并遭到共和党白人抵制，结果不出所料。在华盛顿市，只有\
  \ 35 名选民支持将选举权扩大到黑人男性，而 6591 人反对；在乔治敦，投票结果是 712 票反对，1 票赞成。鉴于市长沃勒克所谓的“空前一致的意见”，白人领导人利用公投结果辩称，民主原则本身要求国会否决选举权法案。⁷⁹\n\
  \n“黑人平等对抗自治政府”——《国家情报报》一篇社论的标题如此醒目，这是 1866 年 1 月初几篇阐明白人社区反对黑人男性选举权理由的文章之一。“哥伦比亚特区的人民不是国会的奴隶，”编辑们坚持道。“本特区已经遭受过各种令公民憎恶的立法形式的*实验*，”而现在激进派试图“*将黑人平等强加给不情愿的哥伦比亚特区人民，而他们刚刚几乎一致地抗议这种平等*。”编辑们继续说道，作为特区的代表，国会应当尊重当地白人选民民主表达的意愿，尤其是考虑到当时北方\
  \ 24 个州中只有 5 个允许黑人男性投票。“*问题将在于完全合格公民所拥有的自治权*，与激进派试图*凌驾于美国人最珍视的特权之上强推黑人平等*之间的较量。”⁸⁰\n\
  \n联邦或许赢得了战争，但关于黑人男性选举权的斗争却让许多华盛顿白人居民的叛逆脊梁更加坚硬。他们厚颜无耻地表现出“一种本应随着叛乱而崩溃的精神”，一位惊讶的俄亥俄州记者艾米丽·埃德森·布里格斯在\
  \ 1866 年初写道。“李将军的巨大招摇画像出现在显眼之处，吸引路人注意。他终于占领了华盛顿。”⁸¹\n\n由市议员塞缪尔·皮尤领导的市议会特别委员会断然拒绝任何黑人平等的概念。“白人作为优越种族，必须而且永远会统治黑人，”皮尤宣称。“这是一个白人的国家和政府，而不是有色人种的。”众议院哥伦比亚特区委员会的一份报告称，允许“那些对政府一无所知、刚从奴隶制中解脱出来的贫穷、软弱的黑人行使地球上赋予人类的最高政治特权”是“有辱人格的”。《国家情报报》的编辑们警告说，推动选举权法案可能导致“种族战争”。⁸²\n\
  \n许多华盛顿白人居民认为黑人——尤其是以前的“违禁品”——对政治几乎没有能力或兴趣，因此将争议归咎于阴谋策划、渴望权力的北方共和党人。在 1866 年华盛顿的一次会议上，爱尔兰公民中央执行委员会谴责国会中的激进派试图“将黑人奴隶立刻转变为黑人选民，从而实际上将蓄奴州的政府交给任何能够哄骗或控制黑人的狡猾白人群体”。一位愤怒的威廉·奥纳写道，“黑鬼选举权”将“使大多数白人处于少数派的统治之下，并将全部政治权力交给无知的黑人，而这些黑人将受北方密使的统治，他们的选票也将被控制。”⁸³\n\
  \n选举权确实吸引了越来越多的共和党人，这既是出于平等主义的原因，也是出于政治原因。包括查尔斯·萨姆纳、亨利·威尔逊和撒迪厄斯·史蒂文斯在内的许多激进派，真诚地相信黑人的政治平等，并将选举权视为完全公民身份的基本要素。只有通过选票，黑人才能让政治领导人负责并保护自己社区的利益。更具战略眼光的共和党人认识到为政党建立更广泛基础的政治利益——一旦获得选举权，可以预期黑人选民几乎会一致投票给林肯的政党，即解放奴隶的政党。因此，黑人投票是维持政治权力和实施共和党战后重建愿景的关键。\n\
  \n这个问题也触动了情感上的弦。激进派和温和派共和党人都对战争耿耿于怀，尤其憎恨战争期间华盛顿普遍存在的亲南方情绪。有些人毫不掩饰对当地白人的敌意。印第安纳州众议员乔治·朱利安认为，授予黑人男性投票权不仅“是对他们公正的问题”，也是“对奴隶主和叛乱者的惩罚性公正”。在哥伦比亚特区，国会“有权通过选票进行惩罚，而行使这一权力将带来一种美妙的诗意的正义”。朱利安继续说道，黑人是否有资格投票并不重要：“在（黑人）和应该被绞死的白人叛乱者之间，（黑人）完全合格。”⁸⁴\n\
  \n1866 年 1 月，众议院通过了黑人男性选举权法案。当票数统计完毕时，众议院旁听席上的黑人观众和白人支持者兴奋地欢呼起来。\n\n整个 1866 年，华盛顿黑人居民不断向参议院施压，要求通过投票权法案。在四月的富兰克林广场解放日庆祝活动上，在写给当地报纸的信中，在演讲和布道中——他们明确表示，没有选票，他们就不可能完全自由。“我们的选举权，”一位华盛顿黑人写道，“是我们不获得就绝不会停止争取的东西。”⁸⁵\n\
  \n\n\n他们的支持增强了激进共和党人的力量，这些人在与总统安德鲁·约翰逊（一位南方民主党人、前奴隶主，对前邦联成员似乎比对前奴隶更同情）发生冲突时，在党内影响力日益增长。约翰逊对南方的宽容态度以及南方各州拒绝批准第十四修正案，激怒了许多北方选民，促使共和党人在\
  \ 1866 年国会选举中取得压倒性胜利。保守派和温和派共和党人逐渐向激进派阵营靠拢，尤其是在哥伦比亚特区黑人选举权问题上。1866 年 12 月，甚至在新当选议员就职之前，参议院就通过了选举权法案。\n\
  \n约翰逊总统迅速否决了该法案，声称这是“强加于不情愿的人民”，并且“会在种族之间引发对立和仇恨情绪”，因为允许黑人选民“对白人种族拥有最高控制权”。⁸⁶ 然而，国会于\
  \ 1867 年 1 月 8 日推翻了否决，法案立即生效。五年前还不可想象的事情，如今已成为国家首都的法律，并很快将成为全国的法律。\n\n### *“一场革命”：白人政治权力垄断的终结*\n\
  \n乔治城的黑人男子首次有机会展示选举权的力量。1867 年 2 月，他们投票罢免了时任市长亨利·艾迪生，此人曾抱怨“黑鬼投票”，并长期是黑人社区的祸害。据《晚星报》报道，黑人选民“以适度的谦逊行使了他们的新特权”，他们的成功激励了华盛顿市的共和党领导人，该市将于\
  \ 6 月举行全市选举。黑人领袖匆忙组织起自己的政治俱乐部，并加入跨种族的中央共和党协会，以动员和登记新的黑人选民。⁸⁷\n\n令白人保守派懊恼的是，黑人精英——受过教育、家境殷实、土生土长的城市居民——与备受诟病的前“违禁品”联手支持共和党。通过选区共和党俱乐部，像小约翰·F·库克这样的资深黑人领袖与乔治·哈顿等年轻的黑人内战老兵、迈克尔·夏纳等前奴隶，以及来自希洛浸信会的威廉·J·沃克牧师等南方新移民并肩工作。这些俱乐部不仅登记选民，还让黑人男子有机会代表华盛顿黑人行使集体权力。例如，第七选区共和党俱乐部挑战了殖民倡导者，并组织了一场全市范围的运动，抗议波托马克渡轮公司歧视黑人顾客。政治组织工作取得了显著成功：尽管黑人只占人口的\
  \ 30%，但到选举时，黑人已占登记选民的近 50%。⁸⁸\n\n这种前所未有的黑人权力行使引发了白人至上主义者的反击。由于担心持续的不满情绪会压低白人投票率，《国家情报报》和其他白人领袖呼吁进行积极的选民登记活动。在\
  \ 1867 年春天的“白人选民”会议上，他们试图唤醒白人居民的政治冷漠。“白人打败黑人的唯一办法，”一位白人选民争辩道，“就是比他们登记更多的人。”他们确实这样做了——与上一年相比，1867\
  \ 年选举登记的白人选民增加了 70%。到选举日，约有 9800 名白人和 8200 名黑人登记，但白人反激进派知道，黑人的选票几乎全部会投给共和党，而白人的选票则会分散。如果共和党获胜，一位在喧闹的选前集会上发言的人警告说，他们将“把选举权扩展到整个南方各州的田间黑人”，从而引发“种族战争，其结果必然是黑人的灭绝”。⁸⁹\n\
  \n一个新的政治黎明正在到来。1867 年 6 月 4 日选举日凌晨 2 点，黑人号手和吹奏者走上街头，提醒人们投票。华盛顿黑人倾巢而出，在投票站开门前排起长队，撑着伞耐心等待以遮挡阳光。尽管当天没有黑人候选人出现在选票上（因为城市宪章仍禁止黑人担任公职），但黑人选民带来了重大变革。共和党人在\
  \ 1867 年之前只在地方政治中扮演边缘角色，如今赢得了市参事会和市议会的大多数席位。黑人们燃起篝火，在街头唱歌庆祝。即将离任的市议会议长威廉·W·摩尔批评“居住在该市的黑人种族中信息更灵通的部分”与下层黑人结盟，“目的是压倒白人种族，并从他们手中夺取所有政治权力”。⁹⁰\n\
  \n哥伦比亚特区共和党人正在建立一个跨种族、跨阶级的联盟，这有望成为一股政治巨流。然而，种族歧视依然存在，尤其是在就业方面。1868 年初，近五千名黑人工人向国会请愿，要求解决公共岗位中的种族偏见招聘问题。“对我们的肤色，尤其是对我们作为有色人种自由人的身份，仍然存在如此强烈的偏见，以至于我们几乎被排除在所有就业领域之外，除了那些最繁重、临时性和卑微的工作，”他们写道。白人劳工经常拒绝与黑人同事一起工作，这使得黑人工人难以获得体面的工作。⁹¹\n\
  \n持续存在的歧视不仅损害了黑人的经济前景，也危及了共和党的政治计划。即使党内领导人强调平等，种族紧张关系仍削弱了该党。当哥伦比亚特区共和党人为 1868 年市政选举动员时，他们在是否将黑人候选人列入选票的问题上产生了分歧。黑人共和党人请愿国会，要求取消担任公职的肤色和财产资格。“黑人在战场上展现了勇气、爱国精神和价值，在公民生活中展现了能力、正直和忠诚，”乔治·哈顿和其他第四选区共和党人的一份请愿书写道。担任公职的考验“应该是杰斐逊式的标准：他是否有能力？他是否诚实？他是否公正？”⁹²\n\
  \n国会共和党人确实修改了城市宪章，允许黑人候选人参选，但一些白人共和党人提出了务实的政治反对意见，担心如果黑人候选人出现在选票上，“失败是必然的”。在第一选区共和党人的一次混乱会议上，争论变得激烈，当黑人成员发言时，有人喊道：“猴子！”一位愤怒的黑人共和党人阿尔弗雷德·戴解释了为什么他支持黑人候选人担任公职：“白人为有色人种什么都没做，我们不想再和他们有任何瓜葛。”⁹³\n\
  \n尽管存在这些紧张关系，共和党人在 1868 年市长选举中团结起来，这场选举在废奴主义者和激进共和党人塞尔斯·J·鲍文与民主党人约翰·T·吉文之间展开，后者以“反激进”或“保守”票参选。鲍文是一位高大、留着胡须的纽约人，1840\
  \ 年代移居华盛顿，性格粗鲁，但因长期支持黑人公立学校、大声疾呼捍卫黑人男子选举权以及帮助前奴隶获得救济而在黑人社区获得强烈支持。他以经济进步为竞选纲领，承诺实现城市现代化，并挫败将国家首都迁往圣路易斯的初步努力。⁹⁴\n\
  \n\n\n\n![Image](img/f0001-10.jpg)\n\n*“1867 年 6 月 3 日华盛顿的重要选举场景。” 黑人选民首次在 1867\
  \ 年乔治敦（2 月）和华盛顿市（6 月）的市政选举中投票。正如这幅来自《哈珀周刊》的素描所描绘的那样，黑人男性不仅投票，还担任了选举官员。* 国会图书馆。\n\
  \n鲍恩对黑人选民的呼吁让他的对手们感到不安，他们攻击他是“一个弄虚作假、欺诈成性的官迷”和“极端的煽动家”。选举日当天，《国家情报报》发表了一篇反鲍恩的社论，标题为“黑人对白人的战争”，并声称共和党人正从乡下“引进”黑人，付给他们\
  \ 3 美元让他们投票。⁹⁵\n\n这场竞选以争议告终——鲍恩以不到一百票的优势获胜，但时任市长沃勒克拒绝让他进入市长办公室。保守派的《乔治敦信使报》警告说：“两个种族现在正以致命的敌意相互对抗，只需再增加一点点刺激，就足以让国家首都的街道浸满人血。”经过数周的政治混乱，新市长才得以就职，与他一同上任的还有该市首批黑人民选官员：黑人占多数的第一选区选择了教育家小约翰·F·库克作为市议员，理发师卡特·A·斯图尔特进入市议会。⁹⁶\n\
  \n鲍恩的执政给这座城市及其政治带来了显著的变化。为了回报支持者，新市长将他政府中约 30%的职位任命给了黑人。他任命了两名黑人进入全白人的消防部门，让黑人担任选区委员，并聘请了一位黑人医生担任公共卫生医师。1869\
  \ 年 6 月，两名黑人警察加入了该市的警察队伍。⁹⁷\n\n鲍恩开启了一个大规模公共工程项目的时代：市政工人在 K 街沿线植树，修建了四英里长的下水道和十五英里长的人行道，并对那些出了名坑洼不平的道路进行了平整和分级。这些项目不仅让数千名失业劳工有了工作，也巩固了鲍恩在工人阶级黑人选民中的政治支持——因为华盛顿缺乏工业基础，黑人劳动者严重依赖公共工程项目来获得就业机会。鲍恩市长的保镖佩里·卡森后来成为西南区一位杰出的黑人政治领袖，他回忆说：“黑人分享了并享受了那个时代的普遍繁荣。许多简陋的小房子都是在鲍恩执政期间攒下的‘储备金’建造和维持的。”⁹⁸\n\
  \n到 1869 年，华盛顿的跨种族民主运动似乎即将带来革命性的变化。新当选的共和党总统尤利西斯·S·格兰特就职时，怀揣着将华盛顿打造成联邦至上权力有力象征的愿景，这一目标与鲍恩市长实现城市现代化的计划不谋而合。格兰特立即签署了被前任总统否决的法案，这些法案从华盛顿和乔治敦的特许状和法律中删除了“白人”一词，并赋予了黑人男性担任陪审员的权利。⁹⁹\n\
  \n5 月，一群黑人和白人市议员在两家城市餐馆被拒绝服务后，市议会禁止了公共娱乐场所的种族歧视——并且大多数白人市议员投票支持了该法案。次年，市议会加强了这项法律，将禁令范围扩大到餐馆、旅馆和其他私营场所。这些法律后来为华盛顿特区战后的民权运动提供了法律基础。¹⁰⁰\n\
  \n华盛顿作为黑人进步避风港的声誉吸引了全国一些顶尖的黑人知识分子和政治人物，包括领导新成立的霍华德大学法学院的俄亥俄州律师约翰·默瑟·兰斯顿，以及成为《新国家时代报》所有者和编辑的弗雷德里克·道格拉斯。1869\
  \ 年 6 月的选举带来了一批新的黑人民选官员：约翰·F·库克赢得了全市范围的登记官职位，来自全市七个选区的黑人男性——包括第四选区的乔治·哈顿——也当选进入了市议会。¹⁰¹\n\
  \n《晚星报》承认，这“真是一场革命”。华盛顿不再由全白人、亲奴隶制的精英阶层统治，而是拥抱了跨种族民主。白人对政治权力的垄断结束了。至少表面看来如此。¹⁰²\n\
  \n## 第六章\n\n## 无力自治\n\n### *民主的退却，1869–1890 年*\n\n老顽固们反对黑人选举权；既然他们无法取消它，他们就试图削弱甚至摧毁其行使的机会。这就是最近兴起的剥夺我们市政政府运动的全部秘密。\n\
  \n——*《新国家时代报》*，1870 年 1 月\n\n如今，一个长满青草的小三角地带标志着弗吉尼亚大道、第六街和 D 街在华盛顿西南区的交汇点。弗吉尼亚大道对面是铁路轨道；沿街区往下是一座建于\
  \ 20 世纪 50 年代、毫无特色的混凝土盒子式办公楼。这个十字路口嘈杂而单调，鲜有行人驻足。附近没有任何历史标志，没有任何迹象表明这里曾发生过任何值得注意的事情。然而，一个多世纪前，在这片曾经属于诺特利·扬庞大种植园的荒凉地点上，矗立着一座宏伟的三层砖砌建筑，名为“岛厅”，它曾是内战后华盛顿种族与民主戏剧的舞台。\n\
  \n岛厅得名于其所在的西南区社区。西南区南面和西面被波托马克河夹住，北面和东面则是臭名昭著的城市运河，它与城市其他部分隔绝，是一个乡村般的死水区。无论从字面还是比喻意义上说，它都是一个岛屿，并且在数代人的时间里一直保留着这个绰号和独特的文化，即使在\
  \ 19 世纪 70 年代运河被填平之后也是如此。这里既是拥有繁荣码头的港口城市的一部分，又是拥有带花园和鸡舍的大型住宅地块的郊区飞地，岛区或许是战后城市中最多样化的区域。这里居住着大量的爱尔兰社区，拥有几座天主教堂，最富有的居民是一位名叫帕特里克·卡利南的爱尔兰承包商。一个繁荣的德裔犹太人社区居住在岛厅附近，他们的塔木德托拉犹太会堂后来在\
  \ E 街拔地而起。沿波托马克河居住着以河流为生的渔民家庭，他们的生活方式对于北边一英里外的政府文员来说显得相当陌生。¹\n\n内战后几十年里，岛区增长最快的人口是黑人。西南区四号半街以东地区长期以来一直是一个由自由黑人和奴隶黑人组成的小社区的家园，其中包括地下铁路的指挥者安东尼·鲍恩。战后，寻求廉价住房的自由人被吸引到这个聚居地。该地区逐渐发展成一个熙熙攘攘、人口密集的社区，其中近\
  \ 80%是黑人，几乎全是工人阶级。许多最贫困的居民挤进了新兴的巷弄社区，在那里，一家人挤在没有室内管道的肮脏小屋中。到 1880 年，该市近 10%的黑人人口居住在岛区。²\n\
  \n\n\n\n岛厅是这些多元西南社区常见的聚会场所，其用途多变，反映了邻里生活的多样性。它那宽敞的舞厅曾举办过教堂礼拜、社区集市和政治会议，而较小的房间则接待过学生、共济会成员、政治家和企业家。战争期间，联邦军队征用它作为伤兵医院。武装冲突结束后，岛厅成为民主的舞台，充满了参与性和争议性的光辉。它接待了众多讨论时事的团体——倡导禁酒的希望分会、谈论爱尔兰独立的芬尼亚兄弟会、呼吁八小时工作制的工人大会。³\n\
  \n但岛厅内最棘手的问题还是特区政治。岛上黑人社区在战时的增长，开启了该地区政治史上一个动荡时期，正如城市其他地方一样。岛厅是周边政治选区的主要活动场所和投票点，该选区黑人和白人人数相当——在\
  \ 1871 年选举中，有 940 名登记的白人选民和 930 名登记的黑人选民。随着 19 世纪 60 年代末和 70 年代初关于黑人选举权和跨种族民主的争论升级，这座大厅成为一个火药味十足的场所，同时容纳了相互竞争的团体。⁴\n\
  \n岛厅是第七选区共和党人的常驻地，这群喧闹的家伙经常在嘈杂的会议上爆发激烈的内部纷争和对党内权威的挑战。1869 年选举前不久，该团体在此集会，为哥伦比亚特区共和党提名大会挑选代表。党的中央委员会决定选出十五人，其中十名黑人、五名白人——但第七选区共和党人对此完全不买账。经过激烈辩论，他们拒绝了肤色要求，坚称“共和党中没有‘白人’或‘有色人种’这样的字眼”。相反，他们只凭才干选拔，并选出了一个跨种族的候选人名单，其中包括安东尼·鲍恩、爱尔兰人帕特里克·卡利南，以及市长鲍恩的魁梧黑人保镖佩里·卡森。⁵\n\
  \n同一周，保守的白人民主党人在岛厅集会，他们愤怒的声音充斥着空气，谴责战后事态的发展。在共和党人的会议上，嘈杂的声浪淹没了主席台。而愤怒的保守派则更有秩序，他们仔细聆听前市议员托马斯·劳埃德主席的讲话，他猛烈抨击了激进派及其黑人盟友，这些人将他和其他白人民主党人赶下了台。“激进党的权力只是暂时的——是在欺骗黑人，损害他们自身的利益，”劳埃德警告说，“墙上已有字迹；时候将到，黑人会发现谁才是他们真正的朋友。”在忍受了政府的“鲁莽挥霍”之后，“老市民”们准备重新夺回控制权。他们将夺回自己的城市，“不会给黑人选举权，但会给他们食物和工作。”⁶\n\
  \n劳埃德和他的保守派盟友似乎未能阻止跨种族民主的到来。自内战结束以来，华盛顿一直是一场席卷南方的政治革命的先锋。随着 1870 年 2 月第十五修正案的批准，宪法现在确立了黑人的投票权，在整个南方，黑人选民改变了州议会甚至国会的构成。华盛顿黑人选民投票率很高，并且随着时间推移，他们在政治组织和动员方面越来越有经验。1869\
  \ 年的选举巩固了共和党对城市的控制，黑人现在在公共生活的各个层级和每个选区都担任职务。从选举权和赋权退回到仅仅“食物和工作”似乎不可想象。\n\n然而，种族平等和跨种族民主实验的长期结果仍不确定。尽管战后初期取得了种种成就，但特区的跨种族民主是脆弱的，是一项易受经济状况、国家政治和强权人物变化影响的初步尝试。正如托马斯·劳埃德所警告的，一场反革命在华盛顿政治的暗流中涌动，白人至上主义者组织起来反对激进派的统治。在像岛厅这样的地方，他们与共和党对手发生冲突，并挑战特区自治的基本前提。这些斗争的结果将决定近一个世纪以来国家首都民主的命运。\n\
  \n### *“老顽固们反对黑人选举权”：反对跨种族民主的反革命开始*\n\n亚历山大·谢泼德并不拥护民主，无论是跨种族还是其他形式的。他于 1835 年出生在西南区——距离岛厅仅几个街区——是一个富裕的、拥有奴隶的木材和煤炭商人的儿子。然而，在他十岁时父亲去世后，任何继承财富的希望都破灭了。他很快不得不辍学以帮助养家。他在\
  \ 19 世纪 50 年代华盛顿蓬勃发展的建筑行业中找到了自己的位置，迅速晋升为一家繁荣的管道和燃气设备公司的初级合伙人。内战爆发时，他应征入伍，在联邦派的哥伦比亚特区民兵组织“国家步枪队”中光荣服役。\n\
  \n甚至在他的民兵任期结束之前，谢泼德就竞选公职，于 1861 年中期赢得了市议会的席位。他立即开始推动将定义其政治生涯的事业：经济发展和实体“改善”，他在 1862\
  \ 年强调，这将“使这座首府配得上它所承载的神圣之名，配得上成为世界‘伟大共和国’的首都”。在 1864 年竞选市参议员席位失败后，谢泼德——此时已是该市最富有的人之一——通过该市最大的报纸《晚星报》（他成为其部分所有者）以及他于\
  \ 1865 年 10 月共同创立的华盛顿贸易委员会，继续积极推动经济发展。他方下巴、体格强壮，精力充沛，带着一种不苟言笑的严肃，是一位有远见的领导者，结合了贵族的特权感和白手起家者的不安分野心。⁷\n\
  \n战争期间，谢泼德强烈支持联邦，但并不反对奴隶制——当然不是激进派。像大多数华盛顿白人一样，即使是那些支持联邦的人，他也反对解放奴隶，否定黑人平等的观念，并拒绝黑人选举权。作为市议员，他在\
  \ 1862 年以 14 比 4 的多数票反对特区解放法案，并帮助至少一名奴隶主为其被解放的“财产”获得补偿。该法案通过两周后，谢泼德辩称，关于种族问题的“煽动”应该停止，他希望“本市关于黑人问题的讨论就此结束”，以便城市领导人能够专注于更重要的问题。到\
  \ 1864 年，他已经接受了解放，但他反对“红嘴废奴主义者”试图让黑人“与白人平等”的努力，并且“完全反对允许黑人投票的原则”。⁸\n\n\n\n谢泼德并非仅仅试图维护白人至上和白人专属政治。他还反对自安德鲁·杰克逊时代以来在全国范围内蔓延的广泛白人民主。谢泼德秉持开国元勋对民主的狭义定义，认为只有财产所有者才应承担领导责任。他主张，只有有产者才对社区有长期利益，才能制定深思熟虑的政策。允许穷人掌权，无异于让他们有权对他人财产征税和挥霍。就在国会中的激进共和党人及其当地黑人盟友推动更广泛的民主定义（将黑人男性纳入其中）之际，谢泼德——以及支持他的商人、银行家和房地产开发商——发起了一场反制运动，最终彻底摧毁了哥伦比亚特区的民主。\n\
  \n这座城市从跨种族民主走向普遍剥夺选举权（丧失投票权）的历程充满混乱，伴随着各种政治转折和联盟的不断变化。这一切始于一场运动，旨在将特区的三个政府（华盛顿市、乔治敦和华盛顿县）合并为一个直接由总统任命官员控制的行政单位。这场后来被称为“合并”运动的倡导者，其目标不仅仅是消除行政边界。他们还旨在撤销特区的自治权，代之以一个由总统任命、非选举产生的委员会。“这座城市的纳税人根本不想要任何形式的选举，而且已经\
  \ 20 年不想要了，”谢泼德在 1868 年初解释道。“我们想要一个诚实的委员会，而不是那些垮台的政治煽动者。”⁹\n\n合并与委员会统治的支持者将自己标榜为无党派改革者，关注“高效和谐”的政府和经济繁荣。他们认为，三个独立的司法管辖区滋生混乱和复杂性，阻碍发展，并产生重叠且往往过高的开支。谢泼德及其支持者相信，由委员会统治的合并政府将更有效、更高效，使特区能够推进全市范围的改善项目。他们坚称，如果国会清除阻碍经济增长的碎片化自治“灌木丛”，华盛顿将在经济上蓬勃发展。¹⁰\n\
  \n谢泼德认为，合并与委员会政府是“商业上的必要之举，绝不应与政治、黑人选举权或其他任何东西混为一谈”。然而，支持者和反对者都明白，这是对激进派推动黑人男性投票权的直接回应。这场运动的时机、其倡导的非民主解决方案、支持者的保守派构成——所有这些都表明，合并旨在为黑人政治权力以及白人保守派认为必然随之而来的过度征税、失控开支和普遍腐败问题，提供一个看似种族中立的解决方案。为了防止这种灾难，他们建议取消该市的民主。¹¹\n\
  \n合并运动于 1865 年底开始获得势头，恰逢激进派开始鼓动黑人选举权，并且其推进速度与黑人政治权力的扩展程度成正比。它吸引了广泛的白人保守派支持，将自称“老公民”（战前扎根于华盛顿的本土白人）和强烈反对黑人选举权的民主党人，与新成立的华盛顿贸易委员会的商人联合起来。贸易委员会是一个无党派组织，包括民主党人和富有的共和党人，其首要目标是促进经济增长。其创始成员——包括谢泼德、银行家乔治·W·里格斯和金融家\
  \ W·W·科科伦——动员“纳税人”和“有智识的公民”支持合并与委员会统治。\n\n1868 年，当该市宪章面临续期时，谢泼德及其在贸易委员会的盟友推动修改宪章，用联邦任命的委员会政府取代民选的市政当局。此前支持合并但对委员会统治持怀疑态度的《晚星报》开始软化立场——或许是因为亚历山大·谢泼德现在部分拥有该报。其社论开始反对自治。投票权“已被证明是一种幻觉和陷阱，让我们去抓代表权和权力的影子，却失去了本可以通过联邦政府负责的统治体系获得的实质性利益。”《晚星报》的编辑们认为，投票的特权或许“是一个我们可以用来换取更实质性利益的小玩意儿”——即联邦资金用于“与国家首都宏伟规划相称的改善和装饰体系”。¹²\n\
  \n用投票权换取更多联邦资金的想法在特区激进派（黑人和白人）中引发了轩然大波，他们全力捍卫民主。激进派主导的市议会发布了一份措辞激烈的决议，谴责此举是“反共和制的阴谋”和“企图剥夺本市人民行使自由人共同特权的权利，并借助金钱贵族统治他们”。愤怒的特区居民向国会递交请愿书，抨击这场运动及其支持者。一份请愿书将合并倡导者斥为“房地产投机者和冒险家”以及“所有同情或协助叛乱、并决心不惜一切代价剥夺有色人种投票权的人”。国会当时仍受激进派控制，于\
  \ 1868 年 5 月投票决定续签该市宪章，而未改变政府结构。¹³\n\n尽管拥有财富、影响力和报纸力量，合并运动最初仍举步维艰，因为它与当时的民主精神背道而驰。太多人对政治体系投入过深，不愿考虑放弃自治。受挫后，谢泼德及其商业盟友突然转变策略。他们没有直接推动一项剥夺特区居民选举权的合并法案，而是试图通过收编激进派运动来实现其经济目标。\n\
  \n1868 年初，当谢泼德意识到国会无意按照他的意愿修改宪章时，他和他的《晚星报》——多年来一直强烈反对黑人选举权和激进派的种族议程——突然转而支持市长候选人塞尔斯·鲍恩，希望激进派执政能让国会更愿意为城市改善项目提供资金。谢泼德的新方向疏远了老派的保守派民主党人，但也显示出他是一个精明的政治机会主义者。他暂时屈从于政治现实，搁置了对种族和民主的担忧，以追求他所倡导的经济发展。\n\
  \n\n\n这个联盟并未持续太久。鲍文当选了市长，但他的政治联盟在任期初期就开始瓦解，因为许多曾经的拥护者转而反对他。鲍文推动了一项计划，将分开的白人和黑人学校董事会合并为一个由市政府管理的董事会，但拒绝整合学校本身，这激怒了许多黑人选民。这个问题分裂了黑人社区，许多知名黑人领袖如约翰·F·库克公开反对市长，并质疑他的动机。许多黑人选民还质疑市长试图建立一个跨种族的共和党工人联盟，抱怨“激进的爱尔兰人”以牺牲黑人工人为代价获得了工作。¹⁴\n\
  \n然而，更致命的是破坏他执政的财政问题。鲍文雄心勃勃的议程——通过大规模公共工程项目重塑城市——吸引了想要工作的工人和寻求市政合同的商人。但这些项目需要大量资金，而城市根本没有。鲍文在\
  \ 1869 年夏天向国会求助，却空手而归。他重新评估了房产价值并发行了债券，这只会增加城市的债务并提高地方税收负担，激怒了温和派共和党人，并激发了政府反对者的活力。由于债务缠身且长期资金短缺，城市无力支付工人工资，从而疏远了核心选民群体。“干活却拿不到钱的人仍然是奴隶，”一次反鲍文集会上的标语写道。随着城市债务膨胀，市长成为腐败指控的目标。¹⁵\n\
  \n华盛顿特区的共和党开始分裂。一个新团体——独立改革共和党人——从鲍文阵营中脱离，并组建了一个由市长批评者组成的跨种族联盟。这证明了选民疏离的程度之深，以至于新政党吸引了前奴隶出身的市议员乔治·哈顿和商人亚历山大·谢泼德。哈顿是学校整合的直言不讳的支持者，也是黑人工人的倡导者，他反对市长对学校事务的处理不当，以及无法让城市财政秩序井然以支付工人工资。谢泼德则认为鲍文政府过于无能，无法实施改造城市所需的公共工程项目。¹⁶\n\
  \n谢泼德和哈顿在一件事上达成一致：鲍文操纵了黑人选民。在一次会议上，哈顿在欢呼和笑声中坚称：“那些腐败分子想要骑在黑人的背上进入办公室，挥舞党鞭说‘黑鬼们，排好队’，这样的时代已经过去了。”《晚星报》指责鲍文及其“小圈子”“对广大有色人种极度蔑视，将他们视为可买卖的投票材料，用一点小恩小惠就能收买。”仅仅几年后，谢泼德本人也面临类似的指控。¹⁷\n\
  \n在 1870 年的市长选举中，改革派提名了马修·埃默里，一位成功的石匠和建筑师，他体现了许多鲍文批评者所渴望的务实、注重经济的共和主义。由于被全国共和党领导人以及许多当地黑人盟友抛弃，鲍文在六月的选举中惨败，此后在特区政治中再未扮演重要角色。尽管埃默里不是激进派，但他公开承认黑人选民是需要争取的重要选民群体。“普世自由和普选权的重大问题已经由国家的呼声解决，”埃默里在作为市长的首次致辞中强调，“我们觉得这些问题不再与我们相关，我们很高兴能够放下它们，将注意力转向更直接的地方利益事务。”¹⁸\n\
  \n但埃默里宣布选举权问题已告终结，未免为时过早（或许是不真诚的）。特区的保守派领导人拒绝承认黑人投票和跨种族民主是不可逆转的，在接下来的四年里，他们成功发动了一场彻底废除选举权的斗争。\n\
  \n即使在 1870 年初支持埃默里的市长竞选时，谢泼德和其他改革派共和党人便与保守派民主党人联手，推动一项新战略，以巩固和改造特区的治理结构。谢泼德认为，鲍文政府是一场灾难，以至于引发了关于黑人选民是否有能力负责任地执政的质疑。“在这里，普选权的实验首次进行，并且……（不幸的是）塞尔斯·J·鲍文被推到了他现在的职位上，作为一个代表性人物，来证明我们的有色人种公民有能力选择合适的人作为统治者。”¹⁹\n\
  \n谢泼德的观点很明确：实验失败了。黑人选民有过机会，但选择不当。现在不仅是更换市长的时候，更是改变投票结构以确保此类错误不再发生的时候。\n\n改革派没有试图一次性得到他们想要的一切——合并加上由非选举产生的专员统治——而是选择了一条新路径：一个仿照西部领地政府建立的合并“领地”政府。谢泼德及其盟友宴请国会议员，带一些人在波托马克河上巡游，配有香槟和音乐。他们的密集游说奏效了。1871\
  \ 年 2 月，国会为合并后的哥伦比亚特区设立了一个单一的领地政府。新政府是一个民主混合体，由总统任命的州长、上议院立法委员会和公共工程委员会，以及民选的众议院代表和在美国众议院中无投票权的代表组成。²⁰\n\
  \n尽管特区选民仍可选举部分官员，但新领地政府的大部分权力掌握在总统任命者手中，尤其是公共工程委员会，该委员会控制着合同和赞助的分配。格兰特总统与谢泼德有着相同的愿景，即利用公共工程将城市从物理上改造成一个适合强大国家政府的宏伟首都，并任命谢泼德为五人委员会成员。谢泼德立即掌握了控制权，将其变成市政府最强大的部门。谢泼德名义上的上司、州长亨利·库克只是一个傀儡和橡皮图章。“为什么州长像一只温顺的羔羊？”《每日爱国者报》问道，“因为他被\
  \ A·谢泼德牵着走。”²¹\n\n谢泼德声称，该市 90%的“真正的纳税人和财产所有者”支持合并和领地政府，但党内有一个重要群体强烈反对：黑人选民。尽管许多黑人选民为了改革共和党而抛弃了鲍文，但很少有人支持合并，因为他们认为这是走向剥夺选举权的一步。乔治·瓦雄，一位黑人自由民局官员，后来成为霍华德大学的首位教授，谴责这场运动是“一个卑鄙的阴谋，旨在欺骗其中八千名自由民，剥夺他们的选举权，并欺骗他们新生的自由。”²²\n\
  \n\n\n\n随着重新振作的合并运动开始呼吁建立领地政府，黑人的反对声音也随之高涨。1870 年 1 月在华盛顿创刊的黑人周报《新时代》将合并列为早期抨击目标之一。“老顽固们反对黑人选举权；既然无法剥夺这一权利，他们就试图削弱——若非彻底摧毁——行使该权利的机会，”编辑\
  \ J.塞拉·马丁和弗雷德里克·道格拉斯写道，“这便是近期发起剥夺我们市政政府运动的全部秘密。”同月，市参事会和市议会通过了一项由黑人市议员卡特·斯图尔特起草的决议，谴责委员会制政府形式，因为该形式“暗示本市人民不具备行使选举权和自治权的资格，而根据我们的共和制度，其他所有人民都享有这些权利。”²³\n\
  \n黑人对新领地政府的反对跨越了所有阶层。黑人精英走上讲坛和报刊表达不满，而黑人工人则走上街头。1871 年 6 月 1 日，领地政府接管的第一天，黑人和白人公共工人集体罢工，抗议市政承包商支付的每天\
  \ 1.25 美元工资。大多数白人工人几天后复工，部分原因是承包商试图利用种族分裂，以每天 1.5 美元招募爱尔兰工人。但黑人工人坚持罢工近一周，要求每天工作八小时、工资\
  \ 2 美元。在受到白人媒体谴责后，黑人罢工者最终接受了由亚历山大·谢泼德斡旋的 1.5 美元妥协方案。这场短暂的罢工提高了工资，但他们很快发现，在新体制下，他们的影响力远不及鲍恩执政时期。²⁴\n\
  \n尽管许多黑人不信任谢泼德，但他试图通过恩庇政治来争取他们的政治支持。领地政府约三分之一的任命官员是黑人，谢泼德还（通过库克州长）策划了几项高调任命：最近搬到该市并编辑《新时代》的弗雷德里克·道格拉斯加入了立法委员会；约翰·默瑟·兰斯顿被任命为卫生委员会成员；约翰·F·库克被任命为城市登记官。²⁵\
  \ 谢泼德还雇佣黑人工人参与公共工程项目，并在 1871 年底的一次重大贷款公投中争取黑人选民的支持。\n\n谢泼德的努力为他赢得了黑人社区的大力支持，尽管并非普遍——曾协助组织罢工的乔治·哈顿成为直言不讳的批评者。大多数黑人选民欣赏谢泼德时代开启的经济机遇，但仍对其手段及对选举权的任何限制保持警惕。他们的怀疑是有道理的。\n\
  \n### *“一个没有城市政府的政府城市”：华盛顿特区失去选举权*\n\n谢泼德热情地拥抱了他的新权力。专注于促进经济增长，谢泼德将公共工程委员会变成了一个由纳税人资金驱动的发展引擎。当新政府于\
  \ 1871 年 6 月接管时，该委员会提出了一项耗资 660 万美元（按 21 世纪美元计算为 8.64 亿美元）的综合改善计划，承诺通过首先翻新市中心和宾夕法尼亚大道，然后沿康涅狄格大道向北和向西推进，来重塑这座城市。该计划需要\
  \ 400 万美元贷款，当年 11 月，华盛顿特区的选民——无论白人还是黑人——以压倒性多数批准了该贷款。贷款到手后，公共工程委员会开始了建设狂潮。\n\n![Image](img/f0001-11.jpg)\n\
  \n*“华盛顿市景”。尽管在内战期间经历了显著增长，1869 年的华盛顿市仍是一个相对欠发达的城市区域。作为备受争议的公共工程委员会负责人，亚历山大·谢泼德推动了快速经济发展，尤其是在华盛顿西北部。国会图书馆。*\n\
  \n成果令人瞩目。凭借不容异议的风格以及格兰特总统坚定不移的支持，谢泼德雇佣工人修建了超过 150 英里的城市街道、120 英里的下水道和 200 英里的人行道。城市工人种植了超过六万棵树，填平了令人作呕的城市运河，用约三千盏路灯照亮了华盛顿的夜晚，并拆除了破败的北方自由市场。他们改善了街道和电车线路，刺激了偏远地区的发展，引发了房地产繁荣。太平洋环岛（现称杜邦环岛）周边开始涌现精英阶层的维多利亚式豪宅。一位赞赏的记者写道，华盛顿“已焕然一新，抛掉了拐杖，实现了令老居民眼花缭乱的转变。”²⁶\n\
  \n谢泼德雄心勃勃的议程和债务驱动的支出激怒了富裕的白人保守派，尤其是民主党人和长期居住在华盛顿的人。他们曾支持合并和转向领地政府，希望限制黑人的政治权力，但当格兰特总统只任命共和党人进入新政府时，他们迅速感到失望。“没有一个老居民，没有一个民主党人，没有一个天主教徒，也没有一个爱尔兰人，”《乔治敦信使报》愤愤不平地说。共和党人在\
  \ 1871 年 4 月的众议院选举中占据主导地位——尽管 22 名新议员中只有两名黑人——民主党人担心新政府将继续将他们排除在权力之外。²⁷\n\n最激烈的批评者中有两位银行家，他们的名字将在华盛顿特区世代回响：W·W·科科伦和乔治·W·里格斯。他们共同拥有的里格斯银行是城市机构，直到\
  \ 2005 年被 PNC 银行收购。科科伦是南方同情者，内战期间自我流放至欧洲，在那里扩充了他世界级的艺术收藏。战后回国，他成为商界的主要声音，并于 1871\
  \ 年初开设了一家美术馆而获得赞誉。他的商业伙伴里格斯也在华盛顿有深厚根基，战后活跃于贸易委员会。尽管他们曾支持合并，但当领地政府推高公共债务时，科科伦和里格斯退缩了。他们通过创办反谢泼德的报纸《每日爱国者》、组织请愿要求联邦调查城市财政，以及在国会听证会上作证反对政府，领导了一场反对运动。²⁸\n\
  \n领地政府的反对者组成了哥伦比亚特区公民协会，他们指控市政政府挥霍无度，并指责谢泼德贿赂和操纵黑人选民。他们认为，无知的黑人支持腐败官员，后者随后洗劫国库。1872\
  \ 年《每日爱国者》一篇题为“我们的黑人统治者”的社论指控政府中的“唯利是图的冒险家”将黑人当作“政治傀儡”来积聚权力。“这些黑人除了空手和饥饿的嘴巴外什么也没带来，他们也不生产任何维持生计的东西，”编辑们声称，然而他们却构成了领地政府的机器。为了清除城市腐败并恢复经济理智，他们认为国会应废除特区的民主制度。“这里的多数选民，”里格斯在\
  \ 1872 年作证说，“没有自治能力。”²⁹\n\n\n\n\n一场对牧羊人友好的 1872 年国会调查几乎没有发现腐败证据，仅对领地政府发出了温和的谴责。但牧羊人（亚历山大·谢泼德）积累政治敌人的速度，与政府负债的速度一样快。他毫不掩饰地将公职与政治支持挂钩，并用丰厚的公共合同奖励盟友，导致批评者将他比作纽约臭名昭著的“老板”特威德。一位观察者写道，谢泼德政府是一个“小君主国”。“控制穷苦黑人的选票，让他们的劳动依赖于它，并利用它来对抗本市的财产和人民，正是这些人自己在做的事。”劣质工程和混乱的街道分级项目引发了诉讼，而国会山及其他地区的居民则指责政府在重点开发西北部的康涅狄格大道走廊时偏袒一方。随着丑闻缠身的格兰特总统在第二任期步履蹒跚，国会继续从南方的重建中撤退，全国记者（尤其是民主党报纸的记者）涌入首都，急于揭露这个由共和党管理的城市中的腐败。³⁰\n\
  \n如果不是财政困难，领地政府或许能够熬过批评者。改变城市面貌的公共项目代价高昂，和鲍恩市长一样，谢泼德没有钱支付这些项目。到 1873 年初，政府几乎破产，停止支付教师、劳工和其他市政雇员的工资。谢泼德试图发行更多债券、征收更高税收，并争取更多联邦支持来资助计划中的改进项目，但他的政治支持正在瓦解。然而，他仍然得到格兰特总统的信任，后者在亨利·库克辞职后于\
  \ 1873 年 9 月任命他为总督。³¹\n\n就在谢泼德就任总督几天后，国民经济崩溃了。1873 年恐慌由亨利·库克的兄弟、金融巨头杰伊·库克的财务崩溃引发，对哥伦比亚特区打击尤为严重，因为作为总督，亨利·库克曾将城市资金大量投资于他兄弟的企业。当杰伊·库克破产时，城市也随之破产。谢泼德政府基本上垮台了。《国家》杂志写道：“华盛顿确实是一座美丽的城市”，这要归功于谢泼德，但“领地政府已经崩溃，债务巨大，账目混乱到金额不明。税收繁重且带有歧视性，合同未履行，学校教师工资未付。”³²\n\
  \n随着城市崩溃，自由民储蓄银行也倒闭了，这对黑人社区来说是一个尤为沉重的打击。该银行于 1865 年由废奴主义金融家在华盛顿创立，旨在鼓励前奴隶储蓄、积累财产，并成为有生产力的公民。它发展迅速。到\
  \ 1873 年，它在所有 37 个州都有成员，存款达数百万美元，成为华盛顿黑人引以为傲的巨大源泉。\n\n然而，在谢泼德时代，白人银行官员开始以低于市场利率的贷款给自己和朋友，而总督库克则用银行资金来救助他兄弟濒临破产的北太平洋铁路。当城市在\
  \ 1873 年破产时，他们允许公共工程委员会用借据而非现金“偿还”未偿贷款。一年之内，银行倒闭，数千名小额储户和黑人组织失去了积蓄。愤怒的华盛顿黑人领袖，包括弗雷德里克·道格拉斯，谴责了导致倒闭的“大恶棍”，并呼吁联邦政府偿还储户。但联邦政府一分钱也没付。旨在促进节俭和储蓄的自由民储蓄银行，最终助长了黑人对金融机构、共和党甚至美国本身的怀疑。³³\n\
  \n经济混乱促使国会进行新一轮两党联合调查市政府。这一次，调查人员发现了严重贪污的证据。尽管没有迹象表明谢泼德个人获利，但调查凸显了他那种不择手段、为达目的不惜一切代价推动“改善”城市的做法，导致了利益冲突、权力兜售、无竞标合同和成本超支。他的公共工程项目账单达到近\
  \ 2100 万美元（按 21 世纪美元计算约 30 亿美元），比最初预计多出约 1400 万美元，是国会允许金额的两倍多。³⁴\n\n调查委员会的报告严厉谴责了谢泼德和公共工程委员会过度支出，但也指责特区选民允许立法机构和委员会如此挥霍。鉴于选民及其民选代表无法自我约束，委员会建议恢复由非选举产生的专员管理城市，就像\
  \ 18 世纪末建城初期那样。³⁵\n\n国会——一个不习惯快速行动的机构——不仅对谢泼德政府的过度行为，而且对特区的民主制度做出了迅速而痛苦的判决。1874\
  \ 年 6 月，就在委员会报告发布两天后，国会以 216 票对 22 票通过决议，终止领地政府，恢复由总统任命的三名专员组成的委员会来管理城市并偿还债务。根据法律，一名专员必须是美国陆军工程兵团的成员；按照惯例，另外两个专员职位由民主党和共和党平分。为回应地方压力，国会承诺承担该市年度预算的\
  \ 50%，承认联邦政府在华盛顿的存在增加了开支（因为需要维护公共建筑）并减少了收入（因为联邦财产不征税）。尽管这种专员统治的新制度最初是作为临时措施，但国会在\
  \ 1878 年将其永久化。³⁶\n\n特区的男性——无论白人还是黑人，富人还是穷人——都失去了投票权。他们在近一个世纪内没有投出过有意义的选票。³⁷\n\n\
  剥夺选举权的范围令人震惊。《国家》杂志的编辑写道：“根据这项法案，民选市政政府连一点痕迹都不剩：市议员、市议会、市长、工程委员会、学校董事会、警察委员会、初选、代表大会，全部被一扫而空，整个政府交给了三个人，由外部权威任命，不对同胞负责，只对总统和参议院负责。”特区专员托马斯·布莱恩解释说，通过这项新法律，国会希望“永远摆脱选举在其邻近地区的干扰影响”。白人作家玛丽·洛根后来评论道，华盛顿变成了“一个没有市政府的政府城市”。³⁸\n\
  \n失去选举权让特区选民和民选官员震惊。众议院代表——现在失业且无权——以象征性抗议回应，他们暂时洗劫了议事厅，拿走了从桌椅到肥皂和鸡毛掸子的一切。尽管所有物品第二天都归还了，但改革者抓住这个恶作剧作为特区民主固有腐败的证据。几十年来，只要提到“鸡毛掸子立法机构”，就会引起华盛顿精英们的哄笑，并成为两族裔民主过度的简洁代名词。³⁹\n\
  \n\n\n转向专员统治的种族含义，当代观察家们心知肚明。“在这个特区，黑人获得选举权的实验首次进行，”1874 年的《国家共和党人》写道。“难道共和党已经到了承认其失败的地步？并且准备进行进一步实验，将选举权从白人和黑人手中一并剥夺吗？”⁴⁰\
  \ 对于许多厌倦了激进派关注民权的共和党人来说，答案是肯定的。\n\n在备受诟病的众议院二十二名成员中，只有两名是黑人，而谢泼德的亲密顾问中则没有黑人。然而，批评者将“鸡毛掸子立法机构”以及谢泼德政府的丑闻和开支归咎于黑人选民。《国家》周刊总结道，由“无知的黑人选民”推上台的谢泼德政府行使了“不负责任的权力”。这座城市“应该由负责任的、而非恰好居住在此的不负责任的那部分人来控制”。《哈珀周刊》——一份通常支持激进派种族议程的共和党出版物——却支持回归专员统治，认为这是出于“权宜之计”和行政效率。“危险的并非黑人选举权，而是无知的选举权，”编辑们辩称。通过转向任命制市政府，华盛顿可以为其他城市树立榜样。⁴¹\n\
  \n亚历山大·谢泼德，这位在特区极大削弱民主的人，在新政府中艰难寻找自己的位置。1874 年，格兰特总统提名他担任特区三名新专员之一，但参议院以压倒性多数否决了他。两年内，谢泼德破产了。1880\
  \ 年，他离开这座城市，前往墨西哥的巴托皮拉斯寻求财富，在那里他建立了一个繁荣的银矿开采企业，经营了二十多年，直至 1902 年去世。⁴²\n\n在他离开后，谢泼德的声誉反而增长了。精英白人华盛顿人——其中许多人在他任职期间曾与他斗争——现在却颂扬他的成就。“华盛顿欠他一份无法偿还的债务，”该市新的民主党报纸《华盛顿邮报》在\
  \ 1885 年发表社论说。“这座城市的美景、吸引力和繁荣，都归功于他的才华、勇气和坚定不移的目标。”1909 年，白人城市领袖委托制作了一尊他们誉为“现代华盛顿之父”的雕像，放置在市政大楼前。正如黑人学者\
  \ W·E·B·杜波依斯几十年后感慨地反思：“谢泼德政权的危害和不诚实被归咎于有色人种选民，而重生之城的美景和成就则被归功于白人文明。”⁴³\n\n尽管谢泼德被神化，但重建时期的其他重要人物却没有那么幸运。前市长塞尔斯·鲍恩留在了这座城市，却已今非昔比。他当选时家财万贯，但一系列糟糕的投资使他失去财富，最终在联邦大楼里当了一名守夜人。他固执己见到最后，去世时悄无声息，朋友寥寥；他被葬在国会公墓一个不起眼的坟墓里。无论当时还是现在，很少有人记得他对黑人教育和选举权的倡导。⁴⁴\n\
  \n乔治·哈顿，这位从奴隶一跃成为市议员、并帮助组织黑人反对鲍恩政府和领地政府的人，也处境艰难。在他的政治生涯因专员统治的推行而结束后，他将自己的口才转向了牧师职业，于\
  \ 19 世纪 70 年代离开华盛顿前往肯塔基。他饱受酒精困扰，1894 年试图自杀，后来与妻子回到华盛顿地区，于 1904 年去世。⁴⁵ 和鲍恩一样，哈顿非凡的一生及其对这座城市的贡献在很大程度上已被遗忘。\n\
  \n国会在特区民主问题上的两步后退——先是限制选民在领地政府中的影响力，然后彻底废除民选职位——是共和党在全国范围内从南方重建中撤退的前奏。国会通过华盛顿特区剥夺选举权法案三年后，1877\
  \ 年的妥协案通过从南方撤出联邦军队结束了重建。在一代人的时间里，限制投票权的法案通过了南方各州立法机构。这也为如何对待海外非白人群体树立了一个不民主的先例。二十多年后，美西战争使美国军队掌管菲律宾，负责起草马尼拉城市宪章的陆军将军援引华盛顿特区的例子，作为拒绝给予菲律宾人自治的理由。⁴⁶\n\
  \n共和党不再有兴趣捍卫其民权议程，转而效仿亚历山大·谢泼德的模式，为白人精英的利益促进经济发展。在华盛顿，这意味着淡化或忽视黑人社区的利益，专注于经济增长，以建设一个“名副其实”的伟大首都。发展战胜了民主。特区跨种族民选政府的时代结束了。将近一个世纪后，新的时代才得以开始。\n\
  \n### *“有色人种朝圣者的麦加”：华盛顿特区受过教育的黑人社区蓬勃发展*\n\n奥林达图斯·西蒙·玻利瓦尔（O. S. B.）沃尔亲眼目睹了民主的倒退。作为该市的一名治安法官，沃尔抱有希望，认为这一挫折是暂时的，只是他自身所体现的漫长自由征途中的一次小小迂回。他于\
  \ 1825 年出生，母亲是奴隶，父亲是她的白人主人。十二岁时，他被送到俄亥俄州的一个贵格会社区抚养长大。沃尔在奥柏林——一个废奴主义中心——成为了一名鞋匠。1858\
  \ 年，他和其他反奴隶制治安员违抗《逃亡奴隶法》，解救了一名面临被重新捕获威胁的逃亡奴隶。⁴⁷\n\n战争期间，他与妹夫约翰·默瑟·兰斯顿一起，为著名的马萨诸塞州第五十四团及其他黑人部队招募黑人志愿兵。他本人也成为首批晋升为上尉军衔的黑人之一。战争结束时，沃尔加入了自由民局，并被派往南卡罗来纳州保护自由民。他宽肩厚背，肤色较浅，步入中年时对战后时代抱有很高的期望。⁴⁸\n\
  \n沃尔于 1867 年抵达华盛顿特区，正值跨种族民主在该市蓬勃发展之际。他充分利用了这座城市为黑人政治权力和经济进步提供的机会。当兰斯顿创办霍华德大学法学院时，沃尔是首批学生之一。他在城市郊区靠近霍华德大学的地方买了一栋豪华住宅——他价值\
  \ 3500 美元的房产比他所在种族融合社区的任何其他房产都值钱。他开设了一家律师事务所，而他的妻子阿曼达在当地一所黑人学校教书，这对夫妇还融入了第一公理会教堂。⁴⁹\n\
  \n在接下来的十年里，沃尔担任了多种公职，包括城市税务评估员、领地政府立法机构代表以及一个警察分局的治安法官。即使在选举权被剥夺之后，他仍然活跃在公共生活中。他创立了霍华德山援助协会，帮助居住在他所在社区的穷人，并在\
  \ 1882 年担任解放日二十周年纪念活动的主持人。⁵⁰\n\n\n\n\n沃尔斯家族、朗斯顿家族以及其他备受瞩目的黑人家庭，共同巩固了华盛顿作为黑人机遇之地的声誉。尽管选举权被剥夺，华盛顿在\
  \ 19 世纪 70 年代和 80 年代仍然是黑人移民的磁石。随着南方各地双种族的重建政府被推翻，私刑成为南方令人发指的景象，源源不断的黑人男女涌向华盛顿。该市的黑人人口在\
  \ 1870 年至 1890 年间增长了 74%，大致保持在总人口的三分之一，并超过了七万五千人。作为全国黑人人口最多的城市，华盛顿是“非洲种族的首都”，《哈珀斯》杂志的一位白人记者写道。⁵¹\n\
  \n尽管政治生活已萎缩，华盛顿仍然为能够利用这些机会的一小部分黑人居民提供了无与伦比的教育、经济和社会机会。黑人知识分子、活动家和教育工作者涌入这座城市，被霍华德大学以及诸如贝瑟尔文学与历史学会（一个成立于\
  \ 1882 年的私人俱乐部，以当时顶尖黑人思想家之间的辩论为特色）等公民机构所吸引。该学会的一位常驻演讲者是黑人教育家玛丽·安·沙德·卡里，她声称华盛顿是“寻求公民、宗教、社会和商业启蒙以及晋升或保护的有色人种朝圣者的麦加”。⁵²\n\
  \n沙德·卡里本人就是这些朝圣者之一。她出生于特拉华州的自由家庭，直言不讳且常常好斗的沙德·卡里在加拿大创办了一份废奴主义报纸，成为北美第一位黑人女性报纸编辑。她为联邦军队招募黑人士兵，随后于\
  \ 1869 年 9 月移居华盛顿教书。她的兄弟、两个姐妹和一个侄女不久后也跟随她来到这座城市。（她与华盛顿有家族联系——她的姐夫艾萨克·卡里早在 1836 年就曾赢得一场针对华盛顿限制性黑人法规的诉讼。）沙德·卡里于\
  \ 1883 年毕业于霍华德大学法学院，成为全国第二位获得法律学位的黑人女性，并在 60 岁时开始执业。她是一位多产的记者，为《新国家时代》和《人民倡导者》撰稿，还倡导妇女选举权，并创立了有色人种妇女进步选举权协会。她和其他受过教育、活跃且雄心勃勃的新来者，帮助该市精英黑人社区在\
  \ 19 世纪末蓬勃发展。⁵³\n\n正如沙德·卡里的例子所证明的那样，该市的黑人公立学校对教师和学生都具有全国性的吸引力。到 19 世纪 80 年代，战后零散的黑人半私立学校已整合成一个稳定的黑人公立学校体系，由一体化的市董事会管理，该董事会也监督白人学校系统。根据国会授权，董事会为两个学校系统提供了相对平等的资源，支付给黑人和白人教师的薪酬大致相同，并赋予黑人学校官员在管理学校方面相当大的自主权。⁵⁴\n\
  \n**表 3 华盛顿人口，1870–1900 年**\n\n![图片](img/t0001-03.jpg)\n\n在弗朗西斯·卡多佐（一位来自南卡罗来纳州的移民，也是全国第一位担任州级公职的黑人）的领导下，有色人种预备高中（即\
  \ M 街高中）发展成为全国顶尖的黑人高中，甚至可能是该市最好的学校，无论黑人还是白人学校。M 街高中成立于 1870 年，比华盛顿的白人高中早两年，是美国第一所黑人公立高中，并提供大学预科课程。其教师拥有哈佛大学和欧柏林学院等名校的学位。由于种族偏见，这些高素质的教师往往无法从事其他更赚钱的职业，他们全身心投入培养未来的黑人领袖。M\
  \ 街高中的毕业生进入了阿默斯特学院、威廉姆斯学院和其他顶尖大学。⁵⁵\n\n除了教育工作者，联邦工作人员构成了华盛顿不断壮大的黑人中产阶级的核心，这是该市黑人生活的一个特色，使其与众不同，尤其是在南方。其他南方城市，特别是新奥尔良和查尔斯顿，在贫困大众之外还拥有一个关系良好的黑人精英阶层，但华盛顿拥有一个规模可观且重要的中产阶级，主要由在联邦政府内部或与之相关、从事相对高薪且稳定工作的人组成。在重建时期，黑人利用他们新获得的政治权力和与共和党议员的接触，通过政治庇护增加了公共就业机会。在选举权被剥夺后，他们依靠与有权势的共和党人的关系来维持联邦职位。例如，弗雷德里克·道格拉斯曾担任美国法警，后来成为联邦契约登记官，这是一个由黑人担任了二十年的肥差。尽管缺乏投票权，华盛顿的黑人居民常常发现他们对共和党的忠诚以政府工作的形式得到回报，这有助于抵消日益受限的私人就业市场。⁵⁶\n\
  \n1883 年无党派联邦公务员制度的建立，帮助那些关系较少的黑人申请者有机会竞争日益增多的文员职位和其他中层职位。到 1891 年，联邦劳动力中有 10%是黑人。凭借稳定的工作和可观的收入，财政部、政府印刷局和自由民医院等联邦机构为雄心勃勃的华盛顿黑人提供了购房和养家糊口的机会。联邦工作，无论是任命还是基于功绩，都吸引了黑人移民来到这座城市，并维持了黑人中上层阶级。⁵⁷\n\
  \n由于联邦工作、黑人教师和其他专业人士的机会，以及令人印象深刻的教育机会，这座城市被誉为黑人精英之都。一本 1887 年的旅游指南声称，该特区“拥有比任何其他美国城市都更聪明、更有文化、更富裕的有色人种”。华盛顿是顶尖黑人知识分子的家园，例如亚历山大·克鲁梅尔（一位纽约人，曾一度倡导殖民化，后来成为圣路加圣公会教堂的著名牧师）；富有的企业家如詹姆斯·沃姆利（他著名的酒店主持了导致\
  \ 1877 年妥协的谈判，从而结束了重建时期）；老牌华盛顿家族的后裔，如城市税务员兼商人小约翰·F·库克；政治活动家如 W·卡尔文·蔡斯（该市最重要的黑人报纸《蜜蜂报》的好斗编辑）；以及高级黑人官员和前公职人员，包括来自密西西比州的美国参议员布兰奇·K·布鲁斯（他在\
  \ 1881 年参议员任期结束后仍留在特区）。“华盛顿的黑人可能是全国最富有的（黑人）群体，”黑人学者 W·E·B·杜波依斯写道。⁵⁸\n\n黑人精英的领军人物是弗雷德里克·道格拉斯，这位前逃亡奴隶、废奴主义者和不知疲倦的人权捍卫者，其“高尚的个人品格和伟大才能”，《哈珀斯周刊》写道，“赢得了普遍的认可和尊重”。尽管他曾在\
  \ 1870 年帮助创办了《新时代》，但道格拉斯直到两年后才永久移居这座城市。他最终定居在阿纳科斯蒂亚，并购买了一座占地十五英亩的宏伟山顶庄园，可以俯瞰阿纳科斯蒂亚河和华盛顿市中心，距离他的三个儿子居住的巴里农场黑人社区不远。他的儿子们帮助经营《新时代》，并投身于社区活动。⁵⁹\n\
  \n\n\n\n\n在华盛顿黑人圈子里，“精英”并不仅仅取决于财富。事实上，一些精英家庭为了维持富有的表象，在经济上捉襟见肘。一个人或一个家庭能否被视为《蜜蜂报》所称的“四百人”——这座城市最富有、最有成就的家庭（尽管上层阶级家庭的数量可能不到一百户）——取决于多种因素。在联邦政府担任白领职位能带来更高的社会地位，一个家庭在华盛顿居住的时间长短也同样重要，不过黑人精英群体中的许多显赫人物都是身居高位的新来者，包括来自密西西比州的布兰奇·K·布鲁斯和\
  \ P·B·S·平奇巴克，后者是路易斯安那州人，曾是美国第一位黑人州长。⁶⁰\n\n肤色也很重要。由于该市许多最成功的黑人家庭有着复杂的种族根源，包括 O·S·B·沃尔、约翰·默瑟·兰斯顿和布兰奇·K·布鲁斯在内的著名黑人领袖都是“穆拉托人”（有一方黑人父母）、“夸德隆人”（有一位黑人祖父母）或“奥克托隆人”（有一位黑人曾祖父母）。拥有白人血统的证据是地位和骄傲的源泉，而“穆拉托人”从事专业职位的可能性是其他人的两倍。黑人报纸上刊登着面部漂白剂的广告，声称能“将黑人或棕色人种的皮肤变白五个色度，让穆拉托人变得完全白皙”。在时髦的第十五街长老会教堂，浅肤色的教区居民在\
  \ 19 世纪 80 年代末反对任命一位深肤色的牧师（尽管该教堂的创始人老约翰·F·库克本人就是深肤色）。鉴于教育、抱负和机会的巨大差异，黑人社区内的社会平等“绝对*不可能*”，黑人报纸《人民倡导者》的编辑写道。⁶¹\n\
  \n在 1874 年剥夺选举权之后的几年里，华盛顿的黑人领导层主要由在废奴运动、内战和重建时期崭露头角的人组成。他们曾为美国黑人在有生之年取得的巨大进步而奋斗并亲眼目睹，因此普遍相信融入更广泛的美国社会是可能的，也是最终的明智选择。“同化，而非隔离，才是我们真正的政策和自然命运，”道格拉斯在一次解放日集会上对人群说。只要有可能，他们就会寻求加入现有的白人组织，而不是创建自己的组织。这一代人仍然致力于将融合作为理想，他们试图赢得白人“上流社会”对其自身精英地位的认可，并分享了白人同辈的维多利亚式品味——从着装到休闲活动，再到他们能够以当时的方式招待客人的豪华住宅。⁶²\n\
  \n赢得充分尊重并被平等对待的关键在于重新获得投票权。正如《蜜蜂报》的卡尔文·蔡斯在 1884 年所写：“有了选举权，我们就能做想做的事，否则不行。”⁶³ 当国会于\
  \ 1878 年通过法案剥夺华盛顿的民主自治权时，它声称这是对市政府结构的“永久性”改变。但华盛顿的黑人居民拒绝接受剥夺选举权作为最终裁决。失去投票权令人愤慨，尤其是在黑人最初花了那么长时间才赢得这一权利之后。他们不愿放弃重建时期的成果，为恢复这座城市的投票权而斗争——就在几年前，他们还能在这里行使前所未有的政治权力。\n\
  \n### *“神圣权利”还是“无意义的摆设”？华盛顿人就投票权展开辩论*\n\n剥夺选举权伤害了黑人和白人选民，但对华盛顿的黑人居民造成了毁灭性打击，因为它削弱了他们捍卫和推进自身利益的能力。弗雷德里克·道格拉斯对《明星报》说，选举权是“我种族的最大保护”。没有选票，黑人领袖们难以让市政官员负责，也难以确保获得公共职位。管理这座城市的专员——三人均为白人男性，直到\
  \ 1961 年所有专员都是如此——通常无视黑人的关切。黑人劳工抱怨说，他们被剥夺了市政合同，而在一个没有大型工业的城市，这些合同是重要的就业来源。专员们还对黑人的贫困视而不见，这种贫困以令人震惊的高比例持续存在。到\
  \ 1890 年，近 40%的黑人人口是文盲，弗里德曼医院 80%的患者被认为太穷而无力支付医疗费用，黑人婴儿死亡率高达惊人的每 1000 例出生中有 338.5\
  \ 例死亡。⁶⁴\n\n市政职位任命消失了。在重建时期，黑人男性有望获得大约三分之一的市政任命，但在 1879 年，警察部队的 50 个任命中只有一名黑人警官，而消防部门根本没有黑人获得职位。毫不奇怪，反黑人的警察暴力行为有所增加，成为黑人社区痛苦的根源，并成为黑人报纸的常客。“警察不尊重黑人，”西南区工人阶级黑人领袖佩里·卡森指责道。在一名白人警察在希尔斯代尔杀死一名年轻黑人男子后，卡森称华盛顿特区警察为“刺客”，并领导了一场“抗议运动”，要求市政官员起诉该警察。⁶⁵\n\
  \n正如在废奴运动和重建时期一样，黑人领袖寻求白人盟友以赢回投票权。1878 年永久剥夺选举权法案通过后，O·S·B·沃尔与约翰·F·库克、白人前市长塞尔斯·鲍恩以及白人前警察专员\
  \ A·C·理查兹联手，组织了一场跨种族运动，向国会和美国公众呼吁“无限选举权”。理查兹是俄亥俄州的废奴主义者，19 世纪 50 年代来到华盛顿，他是 1862\
  \ 年投票支持解放的四名市议员之一。几个月内，地方共和党中央委员会就建立了一个成熟的选举权运作机构，由弗里德曼医院的黑人医生查尔斯·珀维斯领导。“除非人民在选择统治者时有发言权，否则特区的利益永远得不到保护，”珀维斯辩称。在整个\
  \ 19 世纪 80 年代，选举权运动一直是一项跨种族的努力。⁶⁶\n\n选举权支持者主要诉诸这样一种理念：投票是公民身份的基本要素。论点很简单：作为美国公民，华盛顿人有权获得选票。如同他们的废奴主义前辈一样，他们自由地使用《独立宣言》和宪法的语言来推进他们的事业，坚持认为选举权是所有美国人的“神圣权利”，不能以任何理由被剥夺。“这是一个共和政体，每个公民都应享有平等的政治权利，无代表不纳税，”1883\
  \ 年一份呼吁恢复选举权的解放日宣言写道。⁶⁷\n\n\n\n\n支持者认为，选举权不仅是公民的基本权利，而且也是必要的，因为专员们并不代表特区人民。在专员统治的早期，被任命者都是与这座城市或其居民几乎没有联系的人。许多华盛顿人，甚至一些支持新政府的人，都认为他们脱离实际，对城市及其需求了解不足。“被选来统治我们的人，对我们的人民来说是陌生人，”A.\
  \ C. 理查兹抱怨道。*蜜蜂报*指责这些专员是“一个贵族小圈子”；*国家共和党报*则斥责特区政府的统治“专横、压迫，甚至在一定程度上无法无天，引发了近乎厌恶的广泛不满”。选举权倡导者认为，改善现状的唯一途径是废除专员统治，重建民主自治政府。⁶⁸\n\
  \n跨种族的选举权运动得到了日益激烈的劳工运动的强力支持。从 1892 年开始，声称代表约两万名华盛顿工人的劳动骑士团和美国劳工联合会联手，发起了一场基于阶级的争取地方自治的运动。劳工领袖们认为，有了选举权，两个种族的工人都能追究市政官员的责任，并争取到有利的城市合同。一份激进的新劳工报纸《华盛顿时报》致力于一场自称的“十字军东征”，争取投票权，认为“对哥伦比亚特区人民来说，没有哪个问题比选举权和自治问题更至关重要、更深入人心”。劳工领袖们举行群众集会，领导请愿活动，通过支持普选（男女皆可，不分黑白）的决议，并多次在国会作证，支持新罕布什尔州参议员雅各布·加林格于\
  \ 1896 年提出的一项法案，该法案要求在特区就选举权举行公投。⁶⁹\n\n然而，尽管活动频繁，加林格法案还是失败了，选举权运动也偃旗息鼓。支持者根本无法说服国会重新考虑其对特区投票权的全面禁令，很大程度上是因为他们面临着来自当地白人媒体和白人商界广泛而有组织的反对。一旦专员政府于\
  \ 1874 年建立，它很快就赢得了该市白人精英的青睐，他们“甚至很快就停止了对失去投票权的遗憾”，《国家》杂志写道。如今，政府不再掌握在黑人民主党人及其不可靠的白人盟友手中，而是安全地掌握在三位受人尊敬的白人手中，他们均由国会任命，而国会已经放弃了其激进议程，并且越来越关注精英阶层的关切。⁷⁰\n\
  \n前美国邮政总局局长、长期居住在华盛顿的霍雷肖·金表达了众多白人房产所有者的心声，他写道，“一项明智而仁慈的国会法案”“幸运地”取消了选举权。在民主政府下，“*纳税的*（即有财产的）公民在这件事上不仅‘只有部分发言权’——他们完全无能为力，如果无限制的选举权恢复，他们将再次如此。”对于金和其他白人精英来说，将权力掌握在少数人而非多数人手中要好得多。⁷¹\n\
  \n反对的部分原因是经济上的。华盛顿许多最有影响力的白人领袖认为，自治将危及联邦政府对城市预算 50%的贡献。他们担心国会不愿为地方选举官员管理的城市买单。“街道和干道的维护，以及政府的适当管理，远远超出了任何地方需求，其规模之大，如果没有联邦资金，根本无法满足，”商会辩称。预算稳定和行政效率显然比政治权利更重要，该市的纳税人自愿放弃选举权以促进经济发展。与联邦资金带来的实际利益相比，《星报》总结道，“在这个特区，选票只是一个毫无意义的摆设。”⁷²\n\
  \n但在这些经济论调之下，隐藏着种族主义的核心，表现为对跨种族民主的扭曲、种族化的记忆，这已成为许多华盛顿白人的常识共识。与南方其他地方一样，白人开始将华盛顿的重建时期视为一个悲剧性的、动荡的时代，当时跨种族民主的过度行为压倒了温和与责任的力量。“纳税人被新来的前奴隶完全淹没了，”《星报》写道，而诡计多端的“谋杀湾政客”——激进共和党人的代名词——利用了他们，“控制了整个选举机器”。面对过度开支、普遍腐败和种族敌意，“一个保守的北方派系感到有必要进行干预，以拯救所有人的共同财产和体面，”记者乔治·汤森在《哈珀斯》杂志上写道。⁷³\n\
  \n这种对重建时期可疑的解释很快在大多数华盛顿白人中固化成了不容置疑的真理——尽管臭名昭著的地方立法机构只有两名黑人成员，而公共工程委员会的白人任命者犯下了最严重的滥用职权行为。“一项关于黑人选举权的实验已经尝试过，并且失败了，”1893\
  \ 年一项有影响力的学术研究总结道。“刚从种植园出来的人，在那里他们完全没有接受过公民职责的教育，除了期望在那里谋生之外，对特区的福祉没有任何利益关联或财产的人，一下子被赋予了与……白人种族同等的权力”，而白人种族“最有资格”领导社区。⁷⁴\n\
  \n来自阿拉巴马州的参议员、前南方邦联将军约翰·摩根在 1890 年关于恢复特区选举权的辩论中给出了更直白的概括。摩根声称，黑人支持的地方政府“令人憎恶且可耻”，国会“发现有必要剥夺哥伦比亚特区每一个人的选举权，无论其声誉、品格或财产持有情况如何，以便借此摆脱涌入他们身上的黑人选举权这个负担”。摩根声称，这类似于“为了消灭老鼠而烧掉谷仓……老鼠就是黑人人口，谷仓就是哥伦比亚特区政府，‘鸡毛掸子立法机构’。”⁷⁵\n\
  \n选举权将再次导致“黑人统治”，《星报》写道，这解释了“为什么纳税人几乎一致反对在这里恢复选举权”。尽管“目前这种外来政府的形式几乎糟糕透顶”，《邮报》宣称，“但一个将特区控制权交给无知堕落的黑人的制度，则更糟糕。”据玛丽·洛根——一位敏锐的华盛顿精英观察者，随其战争英雄丈夫约翰来到这座城市——称，华盛顿的白人“拒绝让自己在市政选举中承受如此庞大的有色人种选票的风险。在这里定居的北方人用不了多久就会习惯这种思维方式。”⁷⁶\n\
  \n\n\n恢复该地区民主的最佳方式，一些反对选举权的人认为，是鼓励黑人迁出这座城市。1878 年《华盛顿邮报》的一篇社论认为，华盛顿有“过剩的黑人”——这是一个白领城市，没有多少农业或工业岗位，因此从周边种植园迁移来的非熟练黑人劳动者没有经济角色可扮演。该报推测，这座城市会“因立即迁出\
  \ 1.5 万至 2 万黑人人口而变得更富裕、更健康、更幸福”。在没有大规模移民的情况下，唯一的解决方案是“白人作为一个整体，发起一场坚定而仁慈的运动，以消除黑人在过去十几年中被灌输的错觉”，包括选举权。一位《星报》读者大约\
  \ 17 年后重申了这一点：“如果你摆脱了居住在这座城市的 9 万黑人，我就支持选举权。只要他们还在这里，我就反对。”⁷⁷\n\n面对这种充满种族色彩的反对，支持选举权的白人感到不得不直面肤色问题。美国劳工联合会秘书约瑟夫·波特哀叹道，“担心有色人种的选票会控制一切……是陈腐、老套、早已过时的吓人把戏”。前联邦将军查尔斯·霍维质疑了黑人投票导致重建时期腐败的观点，指出“参与（腐败）的官员都是任命的”。备受尊敬的外交官兼犹太领袖西蒙·沃尔夫对《华盛顿邮报》说：“黑人与无知的爱尔兰人、无知的德国人或无知的美国白人一样有权投票——而且他们的投票会更明智。”⁷⁸\n\
  \n选举权倡导者驳斥了反对者所指责的“黑人选民必然是‘无知且堕落’”的观点。他们认为，随着黑人教育的进步，越来越多的年轻黑人男性变得适合公民身份。《每日批评家》在\
  \ 1883 年指出：“如果现在恢复民选政府，会发现相当比例的有色人种选民具备良好的教育资格”，并且会负责任地投票。一位白人选举权支持者说，黑人是与时俱进的。“当该地区的选举权被废除时，人口主要由来自南方的有色人种组成。那时他们无知，麻烦不断，但现在他们接受了教育，成为了好公民，现在的选举权不会像战争刚结束时那样。”《蜜蜂报》的卡尔文·蔡斯表示同意。“这座城市里有一个受过教育的年轻群体”，他们会明智地行使投票权。⁷⁹\n\
  \n但选举权反对者仍不为所动。问题不在于少数受过教育、有思想的黑人，如弗雷德里克·道格拉斯或约翰·默瑟·兰斯顿，可能会投票。他们害怕的是黑人群众，以及他们通过人数行使权力的能力。“这里选举权的困难在于贫民窟元素，”前州长亚历山大·谢泼德在\
  \ 1895 年访问华盛顿时解释道。“我这么说并非要侮辱黑人，因为首都有许多聪明的有色人种，他们完全有能力在事务中拥有发言权，但近年来，如果恢复选举权，会有大量人口主导事务。”⁸⁰\
  \ 当白人批评者设想一个普选的世界时，他们想象着违禁品支持者在工人阶级华盛顿的威严领袖佩里·H·卡森的指挥下，洗劫城市金库。\n\n### *“体面与流氓行为”：阶级与肤色分裂华盛顿的黑人社区*\n\
  \n佩里·卡森和他的选民——贫穷、人数众多、喧闹且不屑于顺从——体现了白人对黑人投票的恐惧。卡森是西南区的政治大师，曾是一名粉刷工，后来晋升为法警、酒馆老板和政府任命官员。他于\
  \ 1842 年出生在马里兰州安妮公主县的一个自由家庭，十几岁时因帮助废奴主义者为逃亡奴隶寻找安全屋而被捕。战争期间他志愿加入联邦军队，战后来到华盛顿，先后担任市长塞尔斯·鲍恩的保镖和亚历山大·谢泼德的信使。重建时期，他组织了一个名为“蓝衣男孩”的非正式黑人团，该团通过保护居民免受斯旺普德尔的爱尔兰流氓袭击，在黑人社区赢得了尊重。这个团成为政治动员的有用工具，并为他赢得了此后一直使用的头衔：“上校”。⁸¹\n\
  \n尽管未受过正规教育，卡森上校却识字，具有迷人的气质和强有力的演讲风格。在 19 世纪 70 年代，他成为华盛顿工人阶级黑人中最杰出的领袖。《晚星报》称，卡森“实际上多年来控制着该地区大量的有色人种选票”。他的个人故事激励了支持者。“二十年前，这个人来到华盛顿，贫穷、受人鄙视，肩上扛着他的粉刷刷；今天，他教导人们可以做什么，因为他站在了最前列，”一位支持者在\
  \ 1884 年对一群共和党人说道。他身高六英尺六英寸，体重近 250 磅，皮肤黝黑，头发过早地银白，每年解放日游行时，他身着亮黄色礼服，骑在一匹令人印象深刻的灰色骏马上，走在队伍前列，令人难以忘怀。⁸²\n\
  \n卡森的支持来自黑人劳动者，他们占华盛顿黑人的绝大多数。在 19 世纪 70 年代，只有 3%的黑人劳动者被归类为政府工作人员、职员或专业人士；近 75%是非熟练劳动者或家政工人。⁸³\
  \ 受经济压力和日益固化的肤色界限所迫，低收入黑人劳动者居住在城市中日益黑化的社区。其中一些黑人社区，如 U 街走廊、今天洛根圆环附近的“地狱之底”以及西北上区的里诺堡，都是从附近的违禁品营地发展而来。随着自由民在城市扎根，他们向周边地区扩展。其他黑人社区，包括位于西南区四又二分之一街以东的“岛”上不断扩大的聚居地，长期以来一直是自由黑人和奴隶黑人的家园。\n\
  \n许多工人阶级黑人居民居住在巷弄社区，这成为华盛顿城市景观中一个臭名昭著的特征。城市的网格布局形成了巨大的街区，狭窄的巷弄深入广阔的街区内部。沿街矗立着大型住宅或排屋，通常由中上层居民居住。在巷弄内，一两间小屋是工人阶级的家园。这两个社区的居民往往从未谋面，彼此之间也鲜有往来。\n\
  \n在战前华盛顿相对罕见的巷弄社区，在内战期间及战后蓬勃发展，因为居民们争相在日益拥挤的老城区寻找住所。急于满足日益增长的住房需求的房地产开发商，通过在巷弄两旁建造数十栋住宅，最大限度地挖掘大型街区的盈利潜力。许多房屋建在只能通过另一条巷弄进入的“盲巷”中，从而形成了完全隐蔽于街景之外的社区。早期的巷弄社区按阶级隔离，但不一定按种族隔离——1863\
  \ 年，一名在“岛”上的“锡杯巷”巡逻的联邦士兵评论说，该巷弄“由白人和黑人共同居住，全都混在一起”。⁸⁴\n\n\n\n\n\n但随着小巷社区数量和规模的扩大，它们日益变得隔离，并吸纳了战争期间及战后大量黑人移民。到\
  \ 1880 年，该市约有 231 条有名有姓的小巷，居住着 10614 人，其中 87%是黑人；到 1897 年，警察局的一次特别人口普查发现，小巷居民达 18978\
  \ 人，其中 93%是黑人。该市近四分之一的黑人人口居住在小巷中。⁸⁵\n\n小巷社区普遍贫困、犯罪猖獗且不卫生。由于没有室内管道和通风设施，小巷住宅滋生并传播疾病，使本就营养不良的居民雪上加霜。小巷的死亡率极高，尤其是新生儿。1873\
  \ 年，在约翰·默瑟·兰斯顿指导下撰写的一份卫生委员会报告谴责了“破败不堪的棚屋”——这是许多小巷的典型特征，并坚称它们“不适合人类居住”。⁸⁶\n\n小巷生活艰苦，但小巷也孕育了一种坚韧的社区意识。如同现代郊区的死胡同，小巷提供了一个远离喧嚣街道的宁静避风港，在这里人人相识，大人们可以在门廊上闲聊消磨时光，孩子们则在街上玩耍。因贫困和孤立而团结在一起，对外来者和“街头人士”充满敌意，自称“小巷人”的人们在育儿、情感支持、紧急援助和友情方面相互依赖。合作帮助他们熬过了恶劣的生活条件，维系了他们的社区。事实上，尽管很少有居民拥有自己的房屋，但小巷社区往往能延续数代之久。⁸⁷\n\
  \n小巷居民和其他华盛顿黑人工人阶级在地方政治中扮演了积极角色。在重建时期，他们投票、组织集会、参加代表大会，并在公共领域发出自己的声音。在选举权被剥夺后，他们仍然参与共和党政治（偶尔有报道称存在黑人民主党人——在一个致力于白人至上的政党中，这实属罕见），并全力支持佩里·卡森。\n\
  \n卡森通过共和党全国代表大会（RNC）施加影响，各州代表团在此聚集，提名总统候选人、敲定党纲并制定全国党的议程。尽管华盛顿特区不是一个州，也没有选举人票，但全国党允许当地共和党人选出代表参加大会。当地党对这一选举过程非常重视，因为这是该市居民——无论黑人还是白人——在全国党内表达政治诉求的唯一机会。黑人工人阶级男性踊跃参加这些会议，给予卡森压倒性的支持。\n\
  \n从 1880 年到 1900 年，卡森在每次选举中都担任华盛顿特区的黑人代表出席共和党全国代表大会。这些会议常常喧闹不堪，充满戏剧性的演说、激烈的游说，偶尔还会爆发肢体冲突，令《华盛顿邮报》和其他反对选举权的人士感到厌恶，他们用生动且带有种族色彩的措辞描述这些会议。“几乎无法充分想象那些在初选中尖叫、嘶吼、斗殴的帮派所表现出的野蛮和恶魔行径、兽性的粗暴、以及毫无掩饰且令人作呕的兽性，”《华盛顿邮报》在\
  \ 1888 年告诉读者。这种狂野的行为，“带着所有塞内冈比亚的特征以及比塞内冈比亚更恶劣的手段”，凸显了将特区政府的控制权安全地掌握在未经选举的白人专员手中的重要性。“财产所有者和热爱秩序的公民因害怕被这样的暴民统治而情有可原。”《华盛顿邮报》发誓，绝不能再让黑人选民控制这座城市。“有一条高于任何人定法的法律——自然法则——禁止黑人在白人社区中统治。”⁸⁸\n\
  \n卡森及其支持者不仅招致了白人选举权反对者的批评，也激怒了许多精英黑人领袖，他们拒绝接受《华盛顿邮报》的种族主义，但仍认为卡森令人难堪。对于像卡尔文·蔡斯这样的人来说，卡森和他那些粗鲁的选民是恢复选举权的障碍，因为他们强化了白人对黑人政治的负面刻板印象。\n\
  \n蔡斯是该市最著名的黑人报纸《蜜蜂报》的编辑，他机智敏锐、充满政治热情。1854 年，蔡斯出生于华盛顿一个贵族、浅肤色的黑人家庭，他撰写挑衅性的社论，抨击白人的种族偏见，并呼吁黑人捍卫自己的权利。该报的报头承诺“对朋友如蜜，对敌人如刺”。在选举权被剥夺后，当许多黑人精英放弃政治时，他全身心投入政治纷争，希望领导一场由受过教育的黑人——社区的“最优秀者”——组成的运动，让他们成为城市真正的领导者。很少有人能与佩里·卡森的身材相匹敌，但蔡斯几乎做到了。他身高六英尺三英寸，肩膀宽阔，声音洪亮，在与卡森及其追随者的大会对峙中毫不退缩。近三十年来，这两人代表了黑人社区内部的政治分裂。⁸⁹\n\
  \n蔡斯认为，除非黑人选民证明自己配得上选举权，否则国会永远不会重新考虑这一问题。最好的方式就是选举可敬的人担任领袖。“只要这个特区仍然由流氓统治，”他写道，“我们就将继续被剥夺自治权。”只要暴民还在统治，赢回选举权就是“一件危险的事情，也是对本社区智慧的耻辱”。他认为，赢得选举权的关键在于击败卡森机器，他利用《蜜蜂报》从个人和政治上攻击卡森。“如果把华盛顿市翻个底朝天，也找不到比\
  \ P. H. 卡森更无知的人来代表这个社区了，”他写道。⁹⁰\n\n尽管蔡斯几乎垄断了黑人媒体，并在精英圈子中获得广泛支持，但他仍难以匹敌卡森的大众吸引力。每四年，蔡斯都会挑战卡森对共和党全国代表大会代表选举的控制；每四年，卡森都明显胜出。由于无法赢得广大黑人选民的支持，蔡斯感到沮丧，他将对手的成功归咎于威士忌和其他贿赂。在\
  \ 1884 年的一次失败后，他愤怒地写道（这句话呼应了白人选举权反对者的论调）：“那些会出卖自己的黑人是没有能力自治的。”他逐渐相信，解决办法是对投票权设置资格限制。“如果我们想要选举权，那就让它受到限制。让我们让所有人相信，作为年轻人，我们代表着体面的情感，我们的事业是正义的。”⁹¹\n\
  \n\n\n\n在蔡斯看来，他支持有限制的选举权而非普选，这体现了华盛顿乃至全国精英阶层（无论黑人还是白人）的观点，他们的生活与广大劳动者截然不同。重建时期曾帮助黑人社区团结在激进派推动的跨种族、跨阶级民主运动背后，但随着选举权被剥夺，吉姆·克劳法的蔓延迫使华盛顿的黑人居民退出政治和公共领域。与全国范围内出现的分化相呼应，华盛顿的黑人生活变得更加分层：注重肤色的精英阶层追求教育和经济机会，而这些机会对于他们那些更贫穷、受教育程度更低、肤色更深的邻居来说基本无法获得。作为企业主、教师、联邦职员和其他专业人士，他们住着更好的房子，享受不同的休闲活动，并渴望“体面”。这些生活方式和观念上的差异在政治上显现出来。\n\
  \n许多精英自认为是（并被官方归类为）“穆拉托人”而非“黑人”，当白人观察者将他们与其他黑人混为一谈时，他们感到恼火。爱丽丝·帕克·沙德的丈夫是自由民医院的医生，她在\
  \ 1890 年《邮报》一篇关于黑人“贵族”的特写中表达了这种精英阶层的挫败感。她被描述为“一位白人女性”，“身上没有非洲血统的痕迹”，沙德抱怨自己感到“屈辱”，因为“白人种族拒绝考虑这种血统混合，也不考虑我们的教育或能力。它坚持将像我丈夫这样的人与这个种族中最底层的人归为一类。”⁹²\n\
  \n反过来，黑人工人也对精英阶层的傲慢感到不满。约翰·E·布鲁斯是一位讽刺作家，他的父母曾是奴隶，母亲在华盛顿做家政，他嘲笑那些“与普通黑人死都不愿沾边”的富裕黑人。他写道，精英黑人社会“全是华而不实、虚影和作秀”。作家查尔斯·W·切斯纳特后来因探索种族身份复杂性的小说而闻名，他写道：“华盛顿的有色人种非常奢侈，把他们所有的收入，无论多少，都花在徒劳地维持‘派头’和上流社会上。”⁹³\n\
  \n卡尔文·蔡斯经常指责卡森迎合“种族中最底层的人”，而卡森则巧妙地利用了阶级冲突的深层暗流，有时质疑黑人精英对社区的承诺。“在这个特区，有很多像我这样的穆拉托人，从未试图摆脱自己的种族；从未试图扮演白人；并且一直致力于建设那个被萨姆纳、林肯和格兰特从奴役中解放出来的受压迫种族，”他对一群鼓掌的听众说。“但在这个城镇里，有些人想成为白人，他们登广告招聘白人女士……到他们家里做仆人。”他特别点名了一位领袖——约翰·默瑟·兰斯顿，称他为“白人的走狗”，在“品味、习惯或交往上，从来都不是一个黑人。”⁹⁴\n\
  \n富裕黑人与黑人工人阶级之间，以及蔡斯与卡森之间酝酿的愤怒，在解放日庆祝活动上公开爆发。在重建时期，解放日是华盛顿黑人日历上最重要的日子。一年一度的游行将黑人社区的所有阶层聚集在一起，激励他们采取政治行动。然而到了\
  \ 19 世纪 80 年代，解放日开始失去其团结的吸引力，反而成为黑人内部冲突的舞台，公开暴露了黑人社区内部的阶级紧张关系。⁹⁵\n\n蔡斯和其他精英对卡森领导的庆祝活动，以及更广泛地说，对他所代表的工人阶级黑人的行为越来越感到不安。蔡斯指责道，解放日越来越被“暴徒”主导，他们古怪的着装和粗鲁的行为让“我们当中最节俭、最自尊的人”感到难堪。“我们不应该被那些给这个社区带来耻辱的乌合之众和暴民所支配。人们想要的是一个体面的集会。”⁹⁶\n\
  \n和蔡斯一样，弗雷德里克·道格拉斯担心这种混乱的活动会给那些意图贬低黑人社区的白人批评者提供口实。道格拉斯认为，解放日应该“帮助我们缩短自己与那些在我们中间更先进、更受青睐的人之间的距离”。相反，它变成了一场混乱的大杂烩，充斥着“华而不实的表演、花哨的展示和散乱的游行队伍，这些队伍把我们城市的小巷和阴暗角落倾泻到拥挤的街道和大道的光天化日之下，从而向公众展示了有色人种中最不幸、最未进步、最停滞不前的阶层中极不相称的一部分，并因此招致公众的厌恶和蔑视。”⁹⁷\n\
  \n在选举权被剥夺后的许多年里，蔡斯试图从担任大元帅的卡森手中夺回这一活动的控制权。他利用自己的编辑平台推广一种不同的解放日，一种能够展现优雅、礼仪和教育的形象——他和精英们希望这种形象能帮助赢得白人的尊重，并恢复重建后失去的权利。到\
  \ 1886 年，沮丧的蔡斯提议举办一场竞争性的庆祝活动：一场低调的游行，最终在以色列伯特利教堂结束，一系列庄重的演讲者将统一传达提升和责任的信息。蔡斯敦促所有“体面的人”参加他的活动，并认为黑人社区必须在“体面与流氓行为”之间做出选择。\n\
  \n但上校对解放日的掌控反而加强了。他的支持者没有兴趣离开街道去安静地坐在教堂长椅上，那一年两个团体都按自己的计划进行了活动。在随后的几年里，令人沮丧的派系斗争只会加剧。“华盛顿特区的有色人种——作为一个整体——是在倒退吗？”1888\
  \ 年，黑人报纸《克利夫兰公报》的一位记者疑惑道。蔡斯将 1888 年的游行斥为“缺乏尊严、统一性和体面……一种耻辱”，并呼吁黑人筹集慈善资金，而不是把钱花在炫耀的游行上。⁹⁸\n\
  \n这一活动又持续了十年，尽管参与的黑人精英或中产阶级越来越少。由于 19 世纪 90 年代末爆发的暴力事件，年度游行失去了官方认可，当地学校官员不再给黑人公立学校学生放假参加。最后一次大规模游行于\
  \ 1901 年举行。到那时，连卡森也呼吁黑人社区停止游行，转而支持在学校和教堂举行室内庆祝活动。小规模的社区庆祝活动一直持续到 20 世纪 50 年代，但直到又一个世纪后，解放日才作为特区的一个官方假日回归。⁹⁹\n\
  \n当最后一支解放日乐队停止行进时，很明显，华盛顿对黑人来说已经变成了一个与他们上一代人所期望的截然不同的地方。在内战和重建时期，华盛顿是一个处于美国种族变革前沿的“北方佬城市”。成千上万的前奴隶迁移到华盛顿，与白人激进派和受过教育的黑人领袖一起，推动了一场雄心勃勃的跨种族民主实验。他们在短时间内取得了显著进步。黑人男性赢得了投票权，黑人领袖在全城范围内赢得了民选职位，黑人工人获得了公共和私营部门的工作机会，黑人学校成为全国典范，市政官员通过了全面的反歧视法律。\n\
  \n\n\n\n然而，正是这种成功引发了白人保守派和商业领袖的强烈反对，他们说服国会放弃了双种族民主的承诺，先是于 1871 年限制了领地政府的选举权，随后在\
  \ 1874 年彻底取消了自治。在接下来的几十年里，华盛顿推翻了重建时期的种族进步，这是整个地区推行白人至上主义的一部分。当市政法委员在 1901 年编纂《哥伦比亚特区法典》时，他们悄悄地从法律条文中删除了当地的反歧视法（尽管并未正式废除）。这座城市仍然拥有一个多元化且不断壮大的黑人中产阶级，但黑人的政治权力和抱负却日渐凋零。通往双种族、跨阶级民主的大门似乎已被砰然关闭。\n\
  \n## 第七章 全国展览之都\n\n### *建设一个现代、繁荣且种族隔离的首都，1890–1912*\n\n*一个没有工厂、没有廉租公寓、没有多少外国出生公民的城市；一个没有市长或市议员、无人投票的城市；一个没有市政府的政府城市；……一个仆人、马车夫、司机，甚至许多商人和警察都是非裔美国人的城市；……——华盛顿在所有这些方面以及其他许多方面都是独一无二的。*\n\
  \n——玛丽·洛根，1901 年\n\n21 世纪初的勒德罗伊特公园，有时会让人感觉像是来自不同时代的另一个城市。从华盛顿市中心向北穿过佛罗里达大道（以前称为边界街），街道突然摆脱了朗方城市网格的刻板布局，以奇怪的角度延伸，仿佛在挑战那位傲慢的法裔工程师及其过时的规划。哥特式风格的小屋和带有宽敞门廊的优雅意大利式别墅，庄严地坐落在狭窄的道路旁。许多\
  \ 19 世纪的原貌房屋得以保存，并在 21 世纪初随着资金雄厚的投资者和居民重新发现该地区而得到修复。尽管城市已将数字系统强加于勒德罗伊特公园，但如今的居民仍坚定地保留着以树木命名的街道名称，这些名称在\
  \ 19 世纪末该社区最初开发时就已存在。\n\n如今已被城市包围的勒德罗伊特公园，是华盛顿内战后第一个住宅郊区，一个田园诗般的区域，吸引了寻求一丝乡村宁静的富裕城市居民。这是安齐·巴伯的愿景，他是一位来自俄亥俄州的白人，内战后不久来到这座城市，负责管理霍华德大学的教育系，后来成为该校的代理校长。作为牧师的儿子，巴伯曾在欧柏林学院学习神学，但在华盛顿的房地产中找到了更世俗的回报。1873\
  \ 年，他和他的妹夫说服大学将校园以南不到半英里的 55 英亩土地卖给他们，并开始开发勒德罗伊特公园，以岳父的名字命名。巴伯在勒德罗伊特公园的成功，加上他作为霍华德大学校长那段充满丑闻的短暂任期所引发的敌意，使他放弃了教育事业，全身心投入商业。¹\n\
  \n从一开始，勒德罗伊特公园就是排外的。早期的广告承诺“没有破败的建筑”和“免受一切滋扰和不良特征的影响”。它在乡村环境中提供了全方位的城市便利设施，距离国会大厦仅几英里。著名建筑师詹姆斯·麦吉尔设计了数十栋住宅。到\
  \ 1880 年，这里有 64 座独特的乡村豪宅，售价高达 12000 美元，而当时政府职员年收入可能只有 1000 美元。就像一个现代的门禁社区，该社区有自己的私人垃圾清运服务，并雇佣了看守人“阻止闯入者和不受欢迎的人”，一位早期观察者写道。“这是一个人们可能想要或想象的排外定居点，其居民属于最高阶层。”在其存在的前二十年里，勒德罗伊特公园完全是白人社区。²\n\
  \n但巴伯担心，他心目中这个排外飞地的愿景正被北边山丘上日益逼近的存在所笼罩：霍华德大学。到 19 世纪 80 年代，霍华德大学拥有一些全国顶尖的黑人学者，并被誉为全国顶尖的黑人大学。大学周边地区被称为霍华德镇，吸引了越来越多的各阶层黑人居民。一个不断扩大的黑人社区出现在勒德罗伊特公园的北边界，危及了巴伯想要推广的排外性，因此他试图用一道栅栏将开发区域隔离起来。在南端，面向市中心，他建造了一个精致的铁木结构，带有华丽的大门；在北端，面向霍华德镇，据《邮报》报道，只有“一道高高的木板栅栏，未上漆且难看”。³\n\
  \n随着勒德罗伊特公园和霍华德镇在 19 世纪 80 年代的发展，这道栅栏成了争议的焦点。霍华德镇的居民抱怨说，栅栏阻挡了大学和市中心之间最直接的路线，迫使人们每次去购物或上班时都要绕道勒德罗伊特公园。一些勒德罗伊特公园的业主也抱怨说，栅栏限制了通往他们社区的通道，并阻止居民享受消防等城市服务，从而降低了房产价值。\n\
  \n到 1886 年，许多霍华德镇的居民开始偷偷穿过栅栏，这促使勒德罗伊特公园的领导层强制执行社区禁止外人进入的规定。1888 年 8 月，一群心怀不满的勒德罗伊特公园业主在黑人工人的帮助下拆除了栅栏，紧张局势升级。愤怒的栅栏支持者迅速重建了栅栏，加上了铁丝网，并雇佣了一名黑人警察看守。在接下来的三年里，这道破旧的屏障被拆毁和重建了好几次，一场“栅栏战争”愈演愈烈，记者们以毫不掩饰的乐趣报道这场争议。⁴\n\
  \n大多数观察者明白，种族和阶级是紧张局势的根本原因。《邮报》写道，霍华德镇是一个“或多或少有臭味的地方”，以“一幅由有色人种居住的摇摇欲坠的棚屋组成的风景如画的景象”为特色。一位勒德罗伊特公园的居民解释说，如果没有栅栏，“我们人口中最令人反感的元素会不分昼夜地挤过这里，而我们在这里建造家园的目标将完全落空。”有一次，栅栏支持者要求市政法委员买下霍华德镇，将其夷为平地，改造成公园。他们声称，这样做“将消除我们反对拆除栅栏的所有理由”。一位难以置信的委员想知道他们是否“想把有色人种赶出地球”。⁵\n\
  \n在一系列由白人房主提起的诉讼之后，栅栏终于在 1891 年被永久拆除。黑人行人自由地穿行在勒德罗伊特公园的街道上，黑人买家开始在该地区寻找住房。1893 年，一位名叫奥克塔维厄斯·威廉姆斯的国会山理发师成为该社区第一位黑人房主——他的女儿一直住在该社区直到\
  \ 20 世纪 70 年代。威廉姆斯一家忍受了射入家中的子弹和其他侮辱，但黑人居民继续零星涌入，白人业主则开始零星搬离。社区的肤色逐渐改变。到 20 世纪初，勒德罗伊特公园拥有一个由黑人房主组成的庞大“有色人种聚居区”；到第一次世界大战时，这里几乎完全是黑人社区，并在\
  \ 20 世纪余下的时间里一直如此。这里成为该市最著名黑人领袖的家园，包括活动家玛丽·丘奇·特雷尔和她的丈夫罗伯特、教育家安娜·朱莉娅·库珀，以及诗人保罗·劳伦斯·邓巴。勒德罗伊特公园的地址成为令人垂涎的成功标志，象征着一个人已跻身黑人精英阶层。⁶\n\
  \n\n\n\n勒德罗伊特公园最初是为富裕的白人居民打造的乡村度假胜地，后来转变为黑人上层阶级的主要社区，这体现了在 1878 年剥夺选举权至 1912 年伍德罗·威尔逊当选总统之间的几十年里，城市种族地理被重新洗牌的大规模人口与空间变迁。在重建时期，华盛顿的每个城区都拥有种族和经济多样化的社区，而华盛顿市中心仍然是一个充满活力的住宅和商业区。然而，到了\
  \ 20 世纪第二个十年，这座城市的面貌已截然不同。\n\n随着联邦政府的扩张和房地产的繁荣，城市突破了原有边界，远远超出了中心核心区。在房地产开发商、城市规划者以及无需对地方民主负责的国会领袖的推动下，华盛顿变成了一座“国家展示城”，以联邦建筑和纪念碑组成的纪念核心区为特色。居民们分散到周边社区，这些社区日益按种族和阶级隔离，专属的郊区飞地在富裕的白人华盛顿居民与大量贫困居民（无论黑人还是白人）之间设置了物理和心理上的距离。由于缺乏融合政治来促进跨种族互动，华盛顿的生活变得比以往任何时候都更加隔离。\n\
  \n### “华盛顿的边缘被敲掉了”：华盛顿特区在种族和经济上日益隔离\n\n从经历到职业，再到脸上那标志性的翘八字胡，迈伦·M·帕克堪称镀金时代华盛顿白人商人的典型代表。他是一位佛蒙特州老兵，内战期间曾在联邦将军乔治·阿姆斯特朗·卡斯特麾下服役，1865\
  \ 年来到华盛顿，成为战争部的一名文员。他晚上学习法律，并从哥伦比亚学院（今天的乔治·华盛顿大学的前身）获得学位，但和勒德罗伊特公园的创始人阿姆齐·巴伯一样，他被这座城市最大的私营产业——房地产所吸引。他创办了自己的房地产公司，随着城市的扩张而变得极其富有。到\
  \ 19 世纪 80 年代，他已确立了自己在华盛顿商界的重要地位。\n\n像当时大多数佛蒙特人一样，帕克终身是共和党人，但并非激进派。作为一个忙于学业和工作的年轻人，他没有参与重建时期的政治斗争，但他很快发现，成为富有的商人打开了众多政治大门，尤其是在\
  \ 1874 年剥夺选举权之后。在那个商人深度参与公共事务的时代，他作为一位雄心勃勃的公民领袖脱颖而出，赢得了媒体的高度赞扬。《华盛顿邮报》热情洋溢地称赞帕克是一位“有公益精神、进取的公民”，“彻底浸透了现代进步与改良的理念”。⁷\n\
  \n帕克处于有利位置，能够利用 19 世纪最后几十年席卷华盛顿的巨大变化。尽管谢泼德时代存在政治和金融丑闻，但这座城市依然蓬勃发展，人口从 1870 年的 13.17\
  \ 万翻了一番多，到 1900 年接近 28 万（使华盛顿特区成为南方第三大城市，仅次于巴尔的摩和新奥尔良）。联邦政府不断扩大的权力和声望——始终是华盛顿经济的引擎——推动了这一增长。联邦政府在内战期间获得了前所未有的权威，此后继续在美国生活中扮演越来越重要的角色，其官僚机构也随之迅速扩张。华盛顿的联邦雇员人数从战争初期的仅\
  \ 2200 人增加到世纪之交的 2.8 万多人。⁸\n\n尽管战后初期迁往华盛顿的移民多数是黑人，但 1870 年后，更多的白人来到这座城市。许多新来者与迈伦·帕克相似——年轻、受过相对良好教育的北方人，寻求白领经济机会。正如马萨诸塞州参议员亨利·卡伯特·洛奇所指出的，因为华盛顿“是一座政府城市，仅此而已”，它缺乏强大的工业基础来吸引那些挤满其他东海岸城市工厂的大量移民劳工。⁹\n\
  \n这座城市还吸引了一批新的极其富有的西部矿业巨头和其他暴发户，他们对华盛顿感兴趣不仅因为它是国家权力中心，还因为在这里打入上流社会比在其他地方更容易。这些新华盛顿人改变了城市的构成和特征，老派的南方家族重要性下降，新家族登上了舞台。这座城市充斥着新面孔和新财富，以至于马克·吐温将华盛顿作为他\
  \ 1873 年讽刺小说《镀金时代》的背景，这部小说后来成为那个时代过度奢靡的代名词。¹⁰\n\n城市本身也在扩张，这在很大程度上归功于一场交通革命。内战前，华盛顿是一座“步行城市”——居民通常可以步行上班、去市场、娱乐场所和其他地方。几乎所有城市居民，无论白人还是黑人，富人还是穷人，都住在华盛顿市中心或乔治敦的范围内。边界街以外的丘陵地区仍然人烟稀少，属于乡村。马拉有轨电车最早出现在战争期间，这是一种早期的公共交通形式，让华盛顿人的出行范围略有扩大。到\
  \ 19 世纪 80 年代，技术创新带来了电动有轨电车，这使得有财力的人可以住在边界街以北的陡坡上。交通的改善，加上人口增长和随之而来的住房短缺，推动了远离市中心地区的土地开发。“华盛顿的边缘被敲掉了，”新成立的贸易委员会在\
  \ 1890 年指出。华盛顿现在远远超出了皮埃尔·朗方最初规划的城市范围。¹¹\n\n随着城市变得更大、更繁荣、更现代化，它也变得更加隔离。战前的华盛顿社区在种族和经济上是多样化的，因为根本没有足够的空间让人们能够按阶级或种族进行显著程度的隔离。1860\
  \ 年，该市最富有的人、银行家 W·W·科克伦与低收入的黑人寡妇莱莎·特纳以及成功的黑人旅馆老板詹姆斯·沃姆利住在同一条 H 街上。¹² 但 19 世纪末出现的新社区更有可能在种族和经济上同质化，从而形成了这座城市在整个\
  \ 20 世纪都将持续存在的隔离地理格局。\n\n\n\n\n最早出现隔离的区域之一是乔治城以东的西区。西区的转变在很大程度上归功于一位特别引人注目且颇具影响力的新来者——威廉·斯图尔特，他于\
  \ 1865 年作为新成立的州内华达州的首位参议员抵达华盛顿。斯图尔特是纽约人，拥有耶鲁大学背景，他前往西部并在矿业中发了财。他的财富为他铺平了进入美国参议院的道路，他头戴牛仔帽来到华盛顿，准备赚更多的钱。他立即将他的创业眼光和冒险精神转向了城市的房地产市场。他押注城市将向西北方向发展，于是与两位矿业伙伴联手，以每平方英尺\
  \ 10 美分的价格花费 60 万美元（相当于 21 世纪的 1000 多万美元）购买了城市西区的土地，当时那里是一个边缘地带，主要居住着低收入工人。他在太平洋（现杜邦）圆环圈地，建造了一座巨大的五层红砖豪宅，而该区域当时只有零星工人棚屋，几乎别无他物。¹³\n\
  \n这座房子最初被怀疑者称为“斯图尔特的蠢行”，但它却引领了该地区的转变。在斯图尔特的朋友亚历山大·谢泼德的推动下，城市改善工程如街道平整、供水干管和人行道主要沿着康涅狄格大道、新罕布什尔大道和马萨诸塞大道这些汇聚于太平洋圆环的西北方向主干道推进。到\
  \ 1873 年这座豪宅开放时，土地售价已达每平方英尺 5 美元，斯图尔特看起来像个房地产天才。在接下来的三十年里，该市最富有的居民和外国使团建造了越来越大、越来越精致的住宅和大使馆，使“斯图尔特城堡”相形见绌，并推动土地价值飙升。¹⁴\n\
  \n有一段时间，该地区在种族和经济上仍是混合的。1875 年，《哈珀斯》杂志的一位记者指出，该地区的黑人居民特别坚决地留在自己的土地上。“他们对财产的执着是人类发展中最显著的表现之一，尽管土地被平整、加固、征税和诱惑，他们仍以先见和决心坚守自己在时尚西区的地块和棚屋。”玛丽·洛根指出：“在许多街道上，豪宅和棚屋仍然并排而立。”¹⁵\n\
  \n一些黑人家庭成功以可观的利润出售了土地，但随着他们土地评估价值的增长，房产税也随之增加。中低收入者越来越难以负担在西区的生活，除非他们是住家仆人。穷人仍留在社区的巷子里，包括第十八街、第十九街、L\
  \ 街和 M 街之间的“臭虫巷”。臭虫巷设有没有水、没有下水道连接、有时甚至没有门的户外箱式厕所。但在西区的街道上，曾经是一个融合的低收入社区，拥有小农场、屠宰场和其他小生意，如今变成了一个专属的上层白人社区。到\
  \ 20 世纪初，西区已成为一个主要由富人居住的时尚街区。¹⁶\n\n斯图尔特参议员的朋友、同为内华达州矿业百万富翁的弗朗西斯·纽兰兹有着更宏大的野心。他不满足于仅仅赚钱，而是想建造一个理想社区：切维蔡斯，以苏格兰的一个狩猎场命名。纽兰兹利用一系列稻草代理人和空壳公司来掩盖他的计划，在\
  \ 19 世纪 80 年代花费数百万美元购买了华盛顿西北部远郊的 1700 英亩土地，这些土地横跨城市与马里兰州蒙哥马利县的边界。他资助了一条从市中心延伸八英里到切维蔡斯湖的有轨电车线路，并花了三十多年时间开发一个模范社区，该社区拥有大型乡村住宅和豪华设施。¹⁷\n\
  \n早期的推动者并没有明确排斥黑人居民，但纽兰兹参议员以其对黑人的反感而闻名——他曾向民主党纲领提出一项“白人纲领”，旨在剥夺黑人选民的选举权并禁止亚洲移民，因为“这应该是一个白人的国家”。所有潜在的购房者都经过仔细筛选。正如一本宣传册所承诺的：“唯一的限制是那些经验证明在任何住宅区维持或增加价值、保护价值以及保护房产建造者免受不良元素侵蚀所必需的。”在世纪之交的华盛顿背景下，“经验”教会了什么教训，以及谁可能被视为“不良元素”，是显而易见的。¹⁸\n\
  \n切维蔡斯土地公司积极保护其隔离的排他性。1909 年，该公司起诉了一位开发商，该开发商在西部大道和威斯康星大道交叉口附近的一个名为贝尔蒙特的 subdivision\
  \ 中向黑人家庭出售了房屋。该公司重新获得了土地，并选择让其几十年不开发，而不是允许黑人居民居住在那里。即使在 21 世纪，切维蔡斯也几乎没有黑人或穷人居住。原本会成为贝尔蒙特的区域现在坐落着萨克斯第五大道和其他奢侈品商店。¹⁹\n\
  \n在没有房地产开发商和富有的政客介入的地方，多元社区自然生长。其中一个社区是坦纳利镇（现拼写为“Tenleytown”），位于西北部上区的一个丘陵地带，就在纽兰兹参议员的切维蔡斯以西。19\
  \ 世纪末仍相对乡村化的坦纳利镇是一个分散的社区，约有 1000 名居民，其中大约三分之一是黑人。一些自由黑人家庭在解放前就在该地区拥有土地，包括著名的沃姆利家族——族长詹姆斯·T·沃姆利在\
  \ 19 世纪 70 年代和 80 年代可能拥有该市最好的酒店，他的大家族在坦纳利镇拥有数百英亩土地。然而，大多数黑人居民是在战争期间和战后作为难民抵达的。他们占据了雷诺堡周围的区域（该市最高点），并在战后军队出售其财产时购买了那里的土地。他们住在大地块上，与白人邻居一起照料宽敞的花园。尽管黑人和白人居民分别去不同的教堂和学校，但他们住得很近，建立了一个相互依存、融合的社区，繁荣了几十年。²⁰\n\
  \n但坦纳利镇是个例外。勒德罗伊特公园、西区和切维蔡斯更能代表一个时代，在这个时代，整个城市出现了种族和经济隔离的社区，有时取代了以前混合的旧社区。在剥夺选举权后的几十年里，开发商利用房地产热潮，沿着后来成为地铁红线的地方，为白人购房者建造了郊区住宅区。一些开发项目，如卡洛拉马和华盛顿高地，是为上层阶级设计的；其他如布鲁克兰和佩特沃斯，则针对中产阶级。没有一个是为穷人或黑人建造的。通常，郊区\
  \ subdivision 在种族和经济上都是隔离的。²¹\n\n### *“代议制贵族”：华盛顿白人拥抱并控制委员会政府*\n\n\n\n\n这种新的居住隔离模式不仅得到了控制着新专员制政府的城市领导人的支持，也得到了那些组织成公民协会以保护自己社区的白人居民的支持。公民协会由白人男性房产所有者组成，在\
  \ 19 世纪 80 年代和 90 年代迅速兴起。他们的使命是维护房产价值、保持低税率，并为其社区争取城市服务。最早的协会是位于国会山的东华盛顿公民协会，其根源可追溯至重建时期，曾指控谢泼德政权不公平地将城市项目倾斜给西北部受偏袒的富裕选民。1874\
  \ 年剥夺选举权后，公民协会在全市如雨后春笋般涌现，人们努力让失去投票权的声音被听到。²²\n\n到世纪之交，已有二十个白人社区团体定期向专员请愿，表达他们的关切。“这种特殊城市政府的巨大成功，”一位学者在\
  \ 1897 年观察到，“在很大程度上归功于这些公民协会的警惕性监督。”另一位学者写道，这些协会“提供了代议制自治的替代品”，并有助于确保市政府尽管“本质上是专制的”，但“在运作上是民主的”。公民协会所宣称的“民主”将占人口近三分之一的黑人公民排除在外。华盛顿的黑人居民通过组织自己的社区团体作为回应，他们将其区分为*市民*协会（进入\
  \ 21 世纪后，社区公民协会仍以白人为主，而市民协会则以黑人为主）。1910 年，当白人团体成立一个伞式组织——公民协会联合会（FCA）时，领导人明确拒绝将黑人市民协会纳入其中。²³\n\
  \n公民协会通过强调捍卫“房产价值”来帮助证明和强制执行居住隔离，这是一个多变的概念，涵盖了从美化社区到确保城市服务再到监管潜在居民的一切。对于许多白人房主来说，社区中哪怕只有一个黑人家庭也意味着房产价值的下降。他们担心黑人家庭会不可避免地给他们的街道带来犯罪、贫困和丑陋。白人房产所有者利用公民协会，通过将黑人和穷人拒之门外来“改善”他们的社区。正如哥伦比亚高地公民协会在一本小册子中吹嘘的那样：“在哥伦比亚特区，找不到比‘高地’更不受令人反感阶层影响的社区了。”通过专注于维护“房产价值”，公民协会推动了向隔离城市的转变。²⁴\n\
  \n公民协会通常都抱有改善社区的共同目标，但它们之间经常争吵，并时常指责专员偏袒其竞争对手。一些最活跃的协会位于东华盛顿和南华盛顿，那里的居民抱怨专员忽视他们的需求，允许铁路轨道、工业场地和糟糕的基础设施破坏他们的社区。由于有如此多咄咄逼人的社区团体争夺专员的关注和资金，一些地方领导人担心过于狭隘的“地方主义”会损害城市，使华盛顿人显得心胸狭隘，只对自己所在的社区感兴趣。1886\
  \ 年 12 月，这些领导人联合成立了“百人委员会”，致力于“通过……对地方意见的可靠表达来改善我们的地方政府”。²⁵\n\n百人委员会并未长久存在。尽管其创始人承诺避免政治，但该委员会无法回避选举权、治理和种族等棘手问题。许多来自东华盛顿和南华盛顿的成员，由东华盛顿公民协会的迈克尔·韦勒领导，反对统治该市的三人民委员会，并主张委员会应推动恢复全面选举权和代表权。韦勒是英国人，他的祖父是\
  \ 1814 年焚烧该市的英军士兵之一，他在内战后不久移民美国，娶了一位国会山女子，并进入房地产业，成为东华盛顿的热情倡导者。尽管是民主党人，但他或许是该市最激进的白人选举权倡导者，将投票权和地方自治视为简单的原则问题：“目前的政府形式是不民主的。”²⁶\n\
  \n韦勒对自治的坚持最终分裂了百人委员会。保守派成员担心政府结构的任何改变都可能危及联邦政府对城市预算 50%的贡献，他们担心对专员制度的修修补补可能导致黑人再次投票。他们于\
  \ 1889 年秋季放弃了该组织，成立了华盛顿贸易委员会，这是一个接受剥夺选举权为不可改变现实的新团体，转而专注于经济增长和维护联邦政府对城市的财政支持。²⁷\
  \ 贸易委员会很快成为该市最重要的政治组织，其权力往往超过专员本身。它比任何其他地方组织都更有力地帮助创建并延续了一个现代隔离的华盛顿。²⁸\n\n贸易委员会将自己描绘成一个公正、无党派的团体，由受人尊敬、具有公民意识的领导人组成，他们将城市利益置于个人或社区利益之上。由于该市与国会的特殊关系以及缺乏自治，委员会创始人认为必须有一个能够“以公开、公正、无地方偏见的方式”代表城市利益的组织。在一个更依赖政府而非私营部门的城市，委员会关注的焦点与其说是“贸易”，不如说是经济发展和城市美化。自成立之初，它就寻求赢得国会的批准和资金，以“执行我们城市的规划者和奠基人所构想并开创的伟大计划”。²⁹\n\
  \n委员会主要由出生于东北部和俄亥俄州而非特区或南方的男性组成，吸引了来自全市的律师、房地产经纪人和商人，尽管大多数人居住在日益繁荣的西北部。在委员会的 27\
  \ 位创始成员中，有《华盛顿邮报》和《星报》的编辑贝利亚·威尔金斯和克罗斯比·诺伊斯；杂货商约翰·H·马格鲁德和伍德沃德与洛思罗普公司的零售商塞缪尔·W·伍德沃德，他们的企业后来成为华盛顿的长期机构；以及沃姆利酒店的黑人老板詹姆斯·T·沃姆利。（在整个\
  \ 19 世纪 90 年代，这个全男性委员会仅有少量融合——在 400 多名成员中，有 4 人是黑人。）委员会成员选举房地产经纪人迈伦·帕克为主席。³⁰\n\n\
  \n\n\n在帕克的领导下，该委员会蓬勃发展，迅速成为城市事务中最具影响力的声音。它填补了剥夺选举权留下的空白，为华盛顿精英阶层提供了表达政治诉求的出口，并在委员会制政府中赋予他们组织化的存在。该委员会致力于将自己定位为最了解本地信息的来源，成为委员和国会决策者可以信赖的专家。它设立了二十多个委员会，研究从公共建筑、交通到供水和公共卫生等一切事务。耐人寻味的是，其中没有关于贫困或选举权的委员会。\n\
  \n委员会成员定期撰写报告、出席听证会，并对委员和国会议员进行游说，同时努力与城市的主宰者建立个人关系。“委员会深知社会影响力的力量，”一位观察者写道。其年度晚宴吸引了数十名国会议员，并定期邀请决策者参加沿水滨的晚餐游船之旅。帕克在委员会的第二份年度报告中声称，贸易委员会“实际上是一个州议会、市议会和商会的结合体”。³¹\n\
  \n1892 年，即委员会成立仅三年后，其影响力变得更加直接——帕克离开委员会，成为了一名委员。帕克巩固了委员会与贸易委员会之间的关系，他的任期开启了一个长期局面：贸易委员会的成员资格几乎成为地方领导人被考虑担任委员职位的先决条件。委员会成员和委员密切合作，以推进他们的共同利益。到世纪之交，“过去在国会面前相互争执的公民代表团已经相对少见，”委员会主席西奥多·诺伊斯自豪地说。“通过哥伦比亚特区委员、贸易委员会以及处理特区事务的国会委员会之间的合作所取得的成就，已成为和谐价值的生动教材。”³²\n\
  \n委员会成员对恢复自治几乎没有兴趣或动力。事实上，他们强烈反对恢复投票权的努力，因为选举权会破坏委员会与委员之间舒适的关系。帕克在 1891 年写道，委员会制政府“既经济又更好”，因为它“不受政治纠葛的影响”。1896\
  \ 年，当选举权问题在国会提出时，委员们将此事提交给委员会，而委员会将其扼杀了。³³\n\n由任命制政府管理一个民主国家的首都似乎自相矛盾，政治学家 C.梅里韦瑟精辟地指出了其矛盾之处。“从法律上讲，这个制度是一种仁慈的专制；在实践中，它是一种代议制贵族政治，”他在\
  \ 1897 年写道。但精英白人华盛顿人吹捧《星报》所称的“不仅是本国，甚至是世界上治理最好的城市”的优点。《星报》认为，缺乏普选使委员们能够提供“诚实的政府，因为他们没有与公共责任感相冲突的义务”。实际上，剥夺选举权创造了良好的政府。“尽管许多好公民对在国家首都实行无代表不纳税的政府原则感到遗憾，”城市委员亨利·B·F·麦克法兰在\
  \ 1900 年辩称，“但普遍承认，对于哥伦比亚特区来说，目前的政府形式是最好的。”麦克法兰坚持认为，华盛顿的政府之所以卓越，是因为它是“由最优秀的公民治理的政府”。³⁴\n\
  \n由“最优秀的公民”——即与贸易委员会商人密切合作的任命委员——治理的政府，或许高效且“和谐”，但本质上是不民主的。它基本上是一个由精英组成、为精英服务、属于精英的政府。学者德洛斯·威尔科克斯警告说，这种政府的长期影响会腐蚀民主，他坚持认为这座城市最终应该实现自治。“否则，即使是最美丽的城市和最完美的管理，也只能证明民主作为解决我们国家市政问题伟大手段的失败。”然而，威尔科克斯和其他异议者的声音是孤独的，因为世纪之交，城市和国家领导人齐声呼吁将华盛顿重塑为一个闪闪发光、种族隔离的“美丽城市”。³⁵\n\
  \n### *“白色城市与首都城市”：麦克米兰计划与纪念性首都的崛起*\n\n当查尔斯·摩尔于 1889 年抵达华盛顿时，几乎没有人能预见到他将在重塑华盛顿市中心物理布局中发挥非凡作用。摩尔在内战前不久出生于新罕布什尔州，毕业于哈佛大学，后在密歇根州定居成为一名记者。他与一位名叫詹姆斯·麦克米兰的底特律商人兼共和党领袖成为朋友，后者通过制造铁路车厢和推广公用事业发了大财。麦克米兰利用其数百万美元在\
  \ 1888 年赢得了美国参议院席位，并邀请摩尔作为助手一同前往华盛顿。\n\n三十四岁的摩尔，认真、戴眼镜、人脉广泛，抵达华盛顿时对地方事务知之甚少，也毫无兴趣。当参议员麦克米兰于\
  \ 1891 年成为参议院哥伦比亚特区委员会主席时，摩尔担任了委员会书记员一职，这一职位使他在接下来的十几年里处于关于城市未来的激烈辩论中心。由于华盛顿特区独特的政治结构，摩尔——既非华盛顿本地人，也非民选官员，既非城市规划师，也非建筑师——对城市的形态和结构施加了非凡的影响力。³⁶\n\
  \n摩尔开始为参议院特区委员会工作后不久，1893 年的恐慌引发了当时美国历史上最严重的经济衰退。华盛顿成为社会动荡的舞台：一支由数百名失业者组成的跨种族团体，被称为“考克西失业请愿军”，从俄亥俄州游行到国会大厦，要求实施大规模公共工程计划以让人们重新就业——这是第一次来到华盛顿特区的此类抗议活动。尽管联邦政府的存在使华盛顿免受大萧条最严重的影响，但这座城市仍在挣扎。随着富裕和中产阶级居民迁往贸易委员会和房地产开发商所推崇的绿树成荫的郊区，华盛顿市中心的老旧社区日益破败，小巷社区蓬勃发展。³⁷\n\
  \n摩尔通过一场被称为“进步主义”的强大社会运动的视角来看待这些困境。进步运动是为了应对与城市生活相关的社会弊病——疾病、犯罪、过度拥挤、不卫生的生活条件——而兴起的，这些弊病源于\
  \ 19 世纪最后几十年美国城市的巨大增长。担心中经济动荡可能导致社会骚乱，中产阶级改革者试图在城市环境的混乱中创造秩序、稳定和清洁。这场运动有多种形式：禁酒倡导者试图限制酒类销售，良好政府改革者推动无记名投票，社会工作者建立社区服务中心以改善贫困社区的生活条件。\n\
  \n\n\n\n\n在华盛顿，最具影响力的进步主义努力或许是“城市美化”运动，其目标是通过美化城市居民所居住的物理结构，来塑造和改善他们的品格。改革者相信，如果他们能改善城市的*外观*和*功能*，就能改善城市居民的*行为*。美丽的建筑、公园和公共空间将激励人们展现道德和公民美德。景观设计师、建筑师和工程师革新了城市设计，强调宏伟、纪念性的公共建筑，这些建筑主导了城市天际线，并唤起居民的自豪感和敬畏感。³⁸\n\
  \n城市美化运动热衷者所设想的理想典范是 1893 年芝加哥世界博览会上的“白城”——一片统一、闪耀的新古典主义建筑群，吸引了国际目光，并激励了一代城市规划者。进步主义规划者如丹尼尔·伯纳姆——世界博览会背后的建筑大师——在华盛顿看到了潜在的白城。华盛顿从一开始就是一座规划城市，这迎合了规划者对秩序和可能性的感知，为他们提供了一个向世界展示城市美化运动如何重塑城市的机会。在一篇题为《白城与首都》的文章中，伯纳姆写道：“在这里，在美国的首都，美国人民已经宣布，这里将成为一场展览的舞台，展示单一而全面的规划能够如何发展和协调一座已然美丽的城市中城乡景观的多元部分。”³⁹\n\
  \n与其他东部城市不同，华盛顿没有大规模的工业部门污染水和空气，也缺乏大量涌入肮脏贫民窟的移民人口。“似乎没有其他城市像华盛顿那样，将美作为首要考虑，而将生活中更艰难、更粗糙的事物置于次要位置，”一位观察者在《斯克里布纳杂志》中写道。通过深思熟虑的规划，国家首都可以成为国家理想的化身，成为美国之美的独特表达，以及全国城市的典范。⁴⁰\n\
  \n华盛顿吸引城市规划者的第二个特点，是它在美国城市中独一无二之处：剥夺选举权和委员会治理。在丹尼尔·伯纳姆和查尔斯·摩尔等人看来，华盛顿不过是联邦政府的产物，一座应由国家而非本地人统治的国家城市。“国家首都由美国公民治理，他们在选举参议员和众议员时，也选出了市议员和立法机构成员；而国会则以开明的精神处理哥伦比亚特区事务，”摩尔写道。事实上，《纽约时报》的蒙哥马利·斯凯勒也表示赞同，决定何为“美丽与和谐”的权力，“更安全地交给哥伦比亚特区当局，而不是任何依赖全体成年男性居民投票来治理的城市”。由于无需担心地方民主问责，规划者可以与相对少数的地方和国家领导人合作，实现他们的愿景。可能反对规划者努力的地区居民——包括黑人社区和穷人——几乎没有机会影响讨论。⁴¹\n\
  \n贸易委员会和地方媒体的领导人强烈支持进步主义美化城市、使其成为国家展示窗口的努力。自成立以来，该委员会一直致力于加强联邦政府与其首都之间的关系，并长期倡导联邦政府为城市制定新的全面规划。在\
  \ 19 世纪 90 年代，经济困难和节俭的国会议员的抱怨导致国会放弃了支付特区预算 50%的承诺。由于担心联邦支持减弱，城市领导人寻求通过支持振兴华盛顿市中心、“使国家首都成为世界上最美丽的城市”的努力来重振这种关系。城市领导人利用\
  \ 1900 年城市百年纪念的机会向全国陈述理由，敦促国会“以与美国国家的尊严和资源相称的方式和程度，改善哥伦比亚特区”。⁴²\n\n他们在查尔斯·摩尔的老板、参议员詹姆斯·麦克米伦身上找到了一个愿意合作的盟友。与威廉·斯图尔特、弗朗西斯·纽兰兹以及其他从商人转行的参议员不同，麦克米伦并未试图在华盛顿房地产市场中中饱私囊。相反，作为参议院特区委员会主席，他成为了首都美化运动的有效倡导者。他与贸易委员会密切合作，推行了一项雄心勃勃的议程来重塑华盛顿，并挑战国会同僚履行对城市的信托承诺。在他的要求下，1901\
  \ 年初，参议院成立了哥伦比亚特区参议院公园改善委员会，麦克米伦本人担任主席，摩尔担任秘书。他们组建了一个由负责白城的著名建筑师组成的团队，包括丹尼尔·伯纳姆、波士顿的查尔斯·麦金以及小弗雷德里克·劳·奥姆斯特德。这三人带着摩尔，花了七周时间访问欧洲城市，开始设想如何将美国首都改造成一座具有旧世界宏伟与庄重的纪念性城市。⁴³\n\
  \n1902 年 1 月，在他们从欧洲返回后不到六个月，委员会制定了一项将彻底重塑城市的规划。尽管其许多想法曾以各种形式在不同时期被提出，但麦克米伦规划（后来如此称呼）将它们整合为一个统一的整体。该规划借助精心策划的公关活动推出，包括精美的宣传册、未来城市的惊艳模型，以及在科科伦艺术博物馆举办的盛会——西奥多·罗斯福总统及其夫人伊迪丝出席了活动——麦克米伦规划因其愿景的惊人广度和设计的优雅之美而赢得了广泛赞誉。⁴⁴\n\
  \n麦克米伦委员会成员对皮埃尔·朗方最初的城市规划情有独钟，他们认为这座城市应被视为“一件公民艺术作品”。对朗方规划的偏离——包括横穿国家广场的铁路轨道、突兀地矗立在广场中央的史密森尼城堡，以及沿广场两侧的维多利亚式建筑——都应“感到遗憾，并在可能的情况下通过拆除加以补救”。麦克米伦规划提议将国家广场改造成一个市民公园，一片宽阔的草地，从国会大厦延伸到拟建的亚伯拉罕·林肯纪念堂，两侧由树木和新古典主义政府建筑环绕。该规划还呼吁沿岩溪、波托马克河和阿纳科斯蒂亚河建立统一的公园系统，并通过美观的桥梁和绿树成荫的林荫道连接起来。⁴⁵\n\
  \n\n\n\n尽管得到了罗斯福总统、市政领导人和许多国会议员的强力支持，该计划仍面临若干严峻挑战，包括 1902 年 8 月麦克米兰参议员的意外去世、来自吝啬且专横的众议院议长约瑟夫·坎农的强烈反对，以及关于农业部与林肯纪念堂选址的争议。但随着时间的推移，麦克米兰计划展现出非凡的韧性，经受住了大多数挑战，尤其是在\
  \ 1910 年美术委员会成立之后——该委员会成为该计划原则的永久守护者。查尔斯·摩尔在该委员会任职近三十年，帮助确保了他上司愿景的实现。即使受到第一次世界大战的干扰，该计划仍稳步推进，于\
  \ 20 世纪 20 年代建成了林肯纪念堂，30 年代建成了联邦三角建筑群。其原则至今仍指导着规划者。麦克米兰计划帮助将华盛顿市中心变成了一座大理石与纪念碑之城，成为美国所能见到的最接近“白色之城”的实体表达。⁴⁶\n\
  \n随着麦克米兰计划的实施，又一个“新华盛顿”诞生了，建筑评论家蒙哥马利·舒伊勒惊叹地写道。艾萨克·马科森在《芒西杂志》上声称，看到改造后的华盛顿特区，“就如同目睹了一个胜利民主政体披着美丽与力量外衣的梦想成真”。这对查尔斯·摩尔和其他推动者而言是一场胜利，他们将华盛顿主要视为一座作为国家纪念碑的首都城市，而非供当地居民居住的生活之城。这是一场建筑凌驾于人民之上、“首都”凌驾于“城市”之上的胜利。⁴⁷\n\
  \n### *“城市中心的黑人棚屋将消失”：改革者瞄准胡同社区*\n\n与三十年前亚历山大·谢泼德推行的改革类似，麦克米兰计划几乎未关注华盛顿的贫困人口。在美化城市的追求中，规划者强调景观设计、建筑风格和概念统一。他们几乎没有停下来考虑其计划可能对贫困居民产生的影响。尽管华盛顿联合慈善机构呼吁“特别关注（城市的）贫困社区”，但这份\
  \ 171 页的计划仅有一次提及低收入人群——将其视为建设公园大道的障碍。⁴⁸\n\n丹尼尔·伯纳姆夸耀道，麦克米兰计划体现了美国人希望其领导人“移除并永远不让丑陋、不雅甚至平庸之物出现在视野中”的愿望。事实上，该计划很大程度上依赖于拆除国会大厦和国家广场周围的大量贫民窟和胡同，为新的公共纪念碑和政府建筑让路。在闪亮的白色之城新愿景中，穷人没有立足之地。1904\
  \ 年，《华盛顿生活》的一位作者直言不讳：“华盛顿城市美观的最大障碍是其黑人人口，他们的破旧住宅随处可见，构成了城市房地产价值最大的威胁。”麦克米兰计划帮助实现了《哈珀周刊》记者几年前的一项预测：“用不了几年，城市中心的黑人棚屋就会消失。它们已经在财富与辉煌的进军中节节败退。”⁴⁹\n\
  \n联合车站的建设是麦克米兰计划获批后早期实施的项目之一，它体现了美好事物的创造如何以牺牲穷人为代价。纵横交错穿过国家广场的铁路轨道长期以来一直是市政领导人和城市美化规划者的心头之患。这些碍眼的轨道破坏了景观，污染和噪音破坏了环境氛围，火车有时还会撞到动物和人。拆除轨道是实现该计划更大愿景的关键，因此成为早期优先事项。在丹尼尔·伯纳姆的个人游说和国会提供的\
  \ 300 万美元财政激励下，宾夕法尼亚铁路公司和巴尔的摩与俄亥俄铁路公司同意放弃它们在广场附近的火车站，联合建造一座伯纳姆设计的新古典主义杰作。联合车站——其名称并非源于南北战争的联邦，而是源于服务于该市的两大铁路公司的联合——规划建在国会大厦正北、斯旺普德尔社区的南缘。成队的骡子帮助铺设地基，数百名意大利石匠被引进参与这项工程，工程从\
  \ 1903 年持续到 1907 年。⁵⁰\n\n随着施工推平了数百座房屋，斯旺普德尔社区超过 1500 名贫困的爱尔兰居民，以及他们主要居住在胡同里的黑人邻居，被迫离开。房主获得了房产补偿，有些人搬到了北国会大厦街上更宽敞的房屋，但租户不得不在其他地方已经拥挤的胡同里寻找新住处。艰苦的斯旺普德尔社区变成了通往国家首都的闪亮门户。随着居民搬离，这个社区逐渐消失。到\
  \ 20 世纪 40 年代，它已不复存在，甚至很少有人记得它那个古怪的名字。⁵¹\n\n尽管斯旺普德尔的破坏或许是建造联合车站的意外后果，但华盛顿市中心那些“丑陋”和“不雅”的胡同社区则被直接列为清除目标。内战后的几十年里，城市的胡同曾断断续续地引起政府官员的关注，在\
  \ 19 世纪 70 年代，卫生委员会曾谴责了近千处胡同住宅。然而，在剥夺选举权之后，随着卫生官员失去谴责建筑的权力，胡同建设蓬勃发展。胡同社区的增长和胡同住宅的恶化，尤其是在较老的社区，激励了一代新的进步改革者，他们为彻底终结城市中所有胡同住宅而斗争。\n\
  \n清除胡同成为一项紧迫的优先事项，它将希望将市中心打造成美丽纪念碑城市的白人城市规划者和商业领袖，与致力于改善穷人生活和品性的白人社会改革者联合起来。为了争取公众支持并激励立法者采取行动，改革者发布了生动的报告、令人震惊的照片和耸人听闻的新闻文章，揭露了华盛顿特区胡同中恶劣的生活条件。在地方社区团体的资助下，劳工部调查员玛丽·克莱尔·德·格拉芬雷德于\
  \ 1896 年调查了华盛顿特区 50 处胡同住宅的生活状况。她研究的过度拥挤的住宅缺乏下水道连接和排水系统，依赖从脏井中抽水，并且通常有室外厕所，散发出“令人窒息”的恶臭。“令人作呕的环境”对胡同居民产生了削弱作用。“这些不幸的人已处于体面和道德的边缘，”德·格拉芬雷德写道，只有极少数例外者能在这样的环境中过上“虽然艰辛但尚算健康”的生活。⁵²\n\
  \n\n\n\n德格拉芬里德的报告激励了当地住房改革者发起一场慈善住房运动，旨在吸引私人投资并运用商业原则建造大量低成本住房。改革者主要出于对公共卫生、城市声誉以及住房不足对穷人品格造成削弱效应的担忧，例如乔治城大学卫生学教授乔治·科伯承诺“带来回报的慈善”。但他们难以筹集足够资金来实施计划，而商业导向使他们关注的重点并非最贫困的巷弄居民，而是那些有上进心、“值得帮助”的穷人。“应优先考虑勤劳且值得尊敬的申请人，”住房官员坚持认为，其理论依据是：为“更优秀的工薪阶层”提供坚固住房，将鼓励这一有抱负的群体腾出体面住房，供穷人居住。尽管取得了一些适度成功——到\
  \ 1904 年，住房改革者为 140 个低收入家庭（其中 30 个是黑人家庭）建造了住房——但这场运动未能显著解决住房问题。⁵³\n\n华盛顿特区 1900\
  \ 年的百年庆典和麦克米兰计划只会让国家首都的巷弄受到更多审视。著名摄影师雅各布·里斯在其 1890 年出版的《另一半人如何生活》一书中激励了大批揭黑记者，他宣称华盛顿的巷弄是世界上最糟糕的。里斯拍摄的照片将令人沮丧的巷弄与宏伟的国会大厦及其他令人印象深刻政府建筑并置。这些巷弄是“一滩腐烂的腐败物”，“扼杀了家庭生活和家庭精神”，里斯于\
  \ 1903 年 12 月在公理会第一教堂对满座听众说道。他敦促国会和他的朋友罗斯福总统立即采取行动消除巷弄住房。⁵⁴\n\n记者们以人类学家探访异域文化的方式撰写耸人听闻的报道，无一例外地突出巷弄生活中最不正常的方面。西南区的柳树巷隐藏在毗邻美国植物园的一个街区中，距离国会大厦仅几百码，是最大的巷弄之一，吸引了媒体和改革者的极大关注。据《华盛顿邮报》报道，这里居住着五百多名低收入居民，包括许多在斯旺普德尔家园被毁的贫穷爱尔兰家庭，柳树巷是“一个肮脏的贫民窟，罪犯和堕落阶层聚集于此，在身体和道德堕落的种种环境中共同居住。”在一次对柳树巷的突袭中，警方在一个十乘十五英尺的房间里发现了十五名男子，睡在布满害虫的稻草上。一名记者发现“完全没有水；卫生排水系统几乎不存在；各种不洁刺激疾病；没有地下室、没有排水系统的棚屋；挤满了儿童。”⁵⁵\n\
  \n白人巷弄改革者、城市领导人和当地媒体都一致认为：一个希望成为具有全球抱负国家美丽代表的首都城市，绝不能容忍巷弄的危险、肮脏和功能失调。清除巷弄是开明的自身利益。正如德格拉芬里德所写，改善巷弄条件既是“自私的利益”，也是“最高的道德义务”，因为巷弄是“城市健康的破坏者”，会将“污秽、疾病和流行病”引入“原本健康的社区”。周一晚间俱乐部则更为直观，制作了一张巷弄地图，标题醒目：“华盛顿特区的死胡同——隐秘滋生犯罪与疾病，杀死巷弄居民并感染街道居民。”⁵⁶\n\
  \n由于强调有序的中产阶级美德、对巷弄居民“传染”的恐惧，以及自认为掌握所有答案的傲慢，进步时代的巷弄改革者很容易被谴责为傲慢的多管闲事者，试图将自己的世界观强加给穷人。事实上，他们的语言在现代人听来可能显得无可救药地居高临下。然而，与那些通常忽视穷人或幻想简单地将穷人从城市中清除的规划者和城市领导人不同，联合慈善会的查尔斯·弗雷德里克·韦勒等巷弄改革者将穷人的生活置于华盛顿特区生活讨论的核心。\n\
  \n查尔斯·韦勒（与选举权倡导者迈克尔·韦勒无亲属关系）是芝加哥进步人士，也是全国操场运动的领导者，他在世纪之交来到华盛顿，在西南区开设了一家定居所。抵达后，他每次在柳树巷、斯旺普德尔、霍华德镇以及其他众所周知的贫困地区连续居住数周，以亲身体验穷人的生活。随后，他花了近十年时间进行演讲、撰写报告、在国会作证，并倡导清除巷弄。他抱怨说，在这座城市里，太多人被“自负的沾沾自喜”蒙蔽了双眼。⁵⁷\n\
  \n韦勒被西奥多·罗斯福总统任命为总统住宅委员会成员，他撰写了一份强有力的巷弄改革呼吁书，题为《被忽视的邻居》，详细描述了来自全市各地巷弄居民的故事。他呼吁为穷人制定类似麦克米兰计划的方案，即“一项全面计划，以稳步、渐进、毫不妥协的方式消除国家首都巷弄、廉租房和棚屋所代表的所有弊端。”他设想用“花园城市”取代巷弄，这些城市遍布公园、操场和公共区域，他认为这将鼓励巷弄居民过上更“健康”的生活。⁵⁸\n\
  \n尽管韦勒与那些试图将华盛顿打造成“美丽城市”的地方领导人有着一些共同目标，但他通过将城市的未来与选举权和自治联系起来而与他们显著不同。韦勒认为剥夺选举权是华盛顿许多功能失调的根源，并在《被忽视的邻居》结尾处对特区民主发出了充满激情的呼吁。他写道，在华盛顿，“相对少数足智多谋的公民”对任命制政府施加影响，但“资源较少的民众”几乎没有机会参与其中。没有选举权，大多数华盛顿人要么不了解公共问题，要么不关心正在发生的事情，因为他们对此无能为力。他认为，选举权是改善城市“重要甚至不可或缺”的一步，因为它有助于培养“更充分的社会意识”。\n\
  \n韦勒认识到种族是民主改革的主要障碍，但他敦促领导人超越这一点。“当地的可怕事物——大量有色人种的存在——不应被视为反对华盛顿普选权的决定性论据，因为从长远来看，在任何民主政府中，将任何公民群体排除在社区生活的这种教育关系之外都是不安全的。”⁵⁹\n\
  \n\n\n韦勒在剥夺选举权方面进展不大，但小巷改革运动在 20 世纪初取得了一些象征性的胜利。臭名昭著的柳树巷是国会最早采取行动的目标之一。据《星报》报道，在国会的资助下，市政府从私人地主手中买下了这条小巷，将其改造成一个公园，内设棒球场、戏水池和沙坑，以激发“社区的道德提升和福祉”。小巷改革者赢得了强大的盟友，包括哥伦比亚特区专员、当地媒体以及第一夫人埃伦·威尔逊，她带领上流社会的贵妇和其他人进行“大巡游”，走访当地小巷，以引起人们对这一问题的关注。威尔逊是一位特别有效的倡导者。在她因晚期肾病濒临死亡时，她仍继续向国会施压，要求对小巷采取行动。1914\
  \ 年 8 月 6 日，她去世当天，国会通过了一项法案，计划在 1918 年前结束华盛顿的小巷住宅。⁶⁰\n\n《小巷住宅法》是小巷改革者的一次显著胜利，但它实际上并未消除小巷住宅。第一次世界大战的介入造成了严重的住房短缺，导致国会推迟实施禁令，而这一推迟持续了整个\
  \ 20 世纪 20 年代。截至 1925 年，尽管经过了三十年的 agitation，仍有超过一万三千名穷人住在小巷里。⁶¹\n\n即使成功，清理小巷也带来了意想不到的后果，因为它加剧了低成本住房的短缺，尤其是对黑人居民而言。正如查尔斯·韦勒所解释的：“例如，在某些地方，一条由有色人种居住的小巷会被改造成一条只容纳白人家庭的小街道。在其他情况下，小巷的开放会提高土地价值；更昂贵的房屋将被建造，而低价出租的房源供应将减少。”旨在改善穷人生活的小巷改革，往往将他们连根拔起，赶出他们的社区，并推向市中心之外。对于被禁止迁往新的、种族隔离郊区的黑人居民来说，寻找住房变得极其困难。⁶²\n\
  \n19 世纪末 20 世纪初的进步主义改革极大地重塑了国家首都的物理布局。随着“美丽城市”规划者试图建造一座配得上华盛顿之名的首都城市，以及小巷改革者努力清除城市的贫民窟，这座城市的面貌逐渐变得截然不同，慢慢呈现出现代居民和游客所熟悉的形态：市中心是联邦建筑和公共纪念碑的核心，而日益种族隔离的社区则从市中心向外辐射。转型过程是不均衡且充满争议的，因为对城市的不同愿景在常常激烈的辩论中相互碰撞。但在许多关于城市规划的讨论中，缺少了一个重要元素：那些受改革带来的变化影响最大的人——城市黑人居民——的声音。\n\
  \n### *“在美利坚合众国首都身为有色人种意味着什么”：吉姆·克劳在特区扎根*\n\n玛丽·丘奇·特雷尔从未住过小巷。特雷尔 1863 年出生于孟菲斯，父母曾是奴隶，后来成为成功的商人，是美国最富有的黑人之一。她在学校表现出色，在欧柏林学院获得了古典文学学士和硕士学位。大学毕业后，她在欧洲学习了两年多外语，这对她那个时代的黑人女性来说是一种极不寻常的经历。她于\
  \ 1890 年来到华盛顿，在有色人种青年预备学校（即 M 街高中）任教，在那里遇到了罗伯特·H·特雷尔，他是一位哈佛毕业的精英黑人家庭的后代，来自弗吉尼亚。他们于\
  \ 1891 年结婚，成为该市最受尊敬的黑人夫妇之一。\n\n在弗雷德里克·道格拉斯的鼓励下，特雷尔即使在婚后也继续她的职业生涯——华盛顿特区学校规定禁止已婚女性任教——她于\
  \ 1896 年创立了全国有色人种妇女协会，并被任命为市教育委员会成员，成为全国第一位担任学校董事会成员的黑人女性。她经常为全国各地的流行出版物撰稿，并因其在种族关系、妇女选举权和教育方面的直言不讳而闻名。特雷尔身材高挑、皮肤白皙，体现了上层黑人的优雅。⁶³\n\
  \n华盛顿为特雷尔和其他黑人提供了南方其他地方无法获得的重大机会。作为国家首都，华盛顿承诺了自由和机会，希望联邦政府能够执行宪法。“华盛顿不是南方，”维尔玛·戴维斯坚持说，她是一位\
  \ 20 世纪初移居该市的黑人女佣。“这是首都，你有更多机会。吉姆·克劳（种族隔离）确实存在，但对我们来说，它仍然不是南方。”一位南卡罗来纳州的黑人裁缝在 1906\
  \ 年解释说，他计划搬到华盛顿特区，因为“我想尽可能靠近国旗。”⁶⁴\n\n随着 19 世纪末南方其他地区陷入私刑、债务奴役和成文种族隔离的深渊，黑人向华盛顿的迁移仍然强劲。该市的黑人人口在\
  \ 1880 年至 1900 年间增长了超过 45%，并且拥有全国最大的黑人社区——近八万七千人——占该市人口的 31%以上。尽管学校是种族隔离的，但许多公共机构并非如此。黑人居民可以自由地在弗农山广场宏伟的卡内基图书馆（1903\
  \ 年新开放）阅读，乘坐市内的有轨电车，在联邦食堂用餐，并毫无限制地在国家广场漫步。他们享受各种公共休闲活动，从园艺到骑自行车，并如饥似渴地阅读《华盛顿蜜蜂报》、《有色美国人》和其他黑人经营的报纸。一些著名的黑人作家甚至为《晚星报》等白人报纸撰稿。⁶⁵\n\
  \n联邦政府仍然是黑人的主要雇主，通过共和党的赞助，非裔美国人赢得了联邦和地方政府职位。西奥多·罗斯福总统于 1901 年任命罗伯特·特雷尔为华盛顿特区的治安法官，后来提升他成为美国第一位黑人联邦法官。华盛顿的黑人居民甚至可以在法庭上挑战白人权威并获胜。在一件著名的事件中，警方逮捕了一位名叫小罗伯特·佩勒姆的人口普查局职员，理由是他干涉了一名白人警察殴打一名黑人妇女。在法庭上，密歇根州共和党参议员威廉·奥尔登·史密斯代表佩勒姆。陪审团宣判他无罪，该警察后来因“行为有失警官身份”而被罚款。⁶⁶\n\
  \n华盛顿的就业和晋升机会部分源于该市不民主的政治结构。正如进步主义记者艾萨克·K·弗里德曼在《科利尔》杂志上所解释的那样，由于所有华盛顿人，无论黑人还是白人，都缺乏投票权，“非洲裔在数量上的多数，以及由此带来的政治优势，并不被白人所畏惧。”尽管偶尔有人抱怨生活在共和国却缺乏基本投票权，“但保守的商人们，由于害怕‘黑鬼统治’，很乐意让这个悖论保持原样。”⁶⁷\n\
  \n\n\n\n\n该市的黑人居民比该地区的其他黑人拥有更多自由，但这并不意味着他们拥有权力。与重建时期因政治潜力而受到尊重甚至敬畏不同，华盛顿的黑人有时被当作首都的一种有趣特色而受到居高临下的对待。*《哈珀周刊》*记者亨利·卢米斯·纳尔逊写道：“华盛顿的黑人，无论是自由人还是奴隶，或是奴隶或自由人的后代，在首都都受到善待，就像我们对待不负责任的孩子一样，而且带着一种不由自主的友好感，因为那些能带来娱乐、增添生活乐趣的人，你很难不对他们产生这种感情。”玛丽·洛根观察到：“只要黑人不试图‘掌控局面’，他们并不缺乏鼓励。”⁶⁸\n\
  \n尽管华盛顿享有“有色人种的天堂”之名，但许多华盛顿黑人仍在勉强度日。虽然联邦政府为受过教育的黑人职员和专业人士提供了中产阶级的薪水和机会，但它给予黑人体力劳动者的报酬微薄，福利也极少。超过\
  \ 80%的黑人联邦雇员年收入不足 840 美元（按 21 世纪美元计算约为 21,000 美元）。与此同时，哥伦比亚特区市政府对黑人雇员更不友好——450 名市政职员中只有\
  \ 9 名是黑人，398 名消防员中也只有 9 名是黑人。在政府之外，黑人工人忍受着恶劣的工作条件和极低的工资，而移居该市的黑人移民也几乎找不到工作机会。⁶⁹\n\
  \n占黑人居民多数的女性，即使受过教育，也往往很少有晋升机会。世纪之交，大约 90%的有工作的黑人女性从事家政服务。“厨房就是有色人种女性找到工作的地方，”从塔斯基吉学院带着教师资格证来到这座城市的日内瓦·威尔逊哀叹道，“你没有别的事可做。只能打扫、做饭，然后盼着改变。”对于弗吉尼亚州前奴隶的女儿玛丽·约翰逊·斯普罗来说，在华盛顿的生活意味着“日复一日地清洁和擦洗……对于一个像我这样的穷女孩来说，工作就是一切。”找不到家政工作的女性则承接洗衣和缝纫活，或者出售她们在自家小院里种植的鲜花、蔬菜和鸡蛋。⁷⁰\n\
  \n19 世纪末 20 世纪初，随着吉姆·克劳法在该地区蔓延，所有阶层的华盛顿黑人都深受其害。事实证明，华盛顿特区被剥夺选举权是一场地区性运动的开端，该运动通过识字要求、人头税和祖父条款，将黑人从整个南方的政治中排除出去。1901\
  \ 年后，美国国会中再无一名黑人男性。到世纪之交，联邦政府已放弃执行任何保护南方黑人权利的重建时期法律，而最高法院 1896 年在*普莱西诉弗格森案*中的裁决，使公共机构中的“隔离但平等”待遇合法化。法院援引国会支持华盛顿特区设立隔离学校作为种族隔离合宪性的证据。\n\
  \n邻近各州通过的吉姆·克劳法侵犯了华盛顿黑人的权利。1903 年马里兰州通过法律在火车上实施种族隔离后，佩里·卡森在华盛顿特区登上火车，立即被命令前往“有色人种”车厢。“我肯定是在哥伦比亚特区，列车长，”卡森抗议道，“这个地方没有‘吉姆·克劳’法。”列车长回答说：“我不知道，也不在乎，但你们有色人种从华盛顿出发时，必须乘坐‘吉姆·克劳’车厢。”卡森急于赶路，不愿惹事，便退让了。⁷¹\n\
  \n在华盛顿特区内部，种族氛围急剧恶化。曾经融合了各人种的公共剧院、餐馆和其他场所，如今开始设置肤色限制，因为国会中胆大妄为的南方民主党人及其当地盟友试图在整个城市更严格地推行南方式的种族隔离。在南卡罗来纳州参议员本·蒂尔曼的授意下，国会通过了一项反流浪法案，将“流浪者”的定义扩大到包括失业者，并威胁要将所有“游手好闲”的人送进劳教所长达一年。蒂尔曼解释说，该法案的目标是该市庞大的黑人人口，他指责这些黑人因“某些黑人被过度教育，产生了他们不可能达到的更高抱负”而导致了“犯罪行为”。⁷²\n\
  \n阿拉巴马州众议员托马斯·赫夫林不仅发起了一项对该市有轨电车实施种族隔离的法案，还采取了私刑行动。1908 年 3 月，他开枪打伤了一名黑人男子，声称该男子在有轨电车上使用污言秽语（一颗流弹也击中了一名白人旁观者）。尽管受到广泛批评，赫夫林却一分钟牢也没坐，就返回国会，决心推动他的有轨电车隔离法案通过。前华盛顿特区学校总监威廉·钱斯勒赞扬了赫夫林，并批评“胆怯的白人”让“成千上万的野蛮黑人”在城市里横行。他呼吁国会“在特区实施禁酒令、隔离车厢、鼓励工业化的法令、实用教育以及反流浪法”，以帮助这个“被剥夺选举权且无助的”城市解决其“黑人问题”。⁷³\n\
  \n玛丽·丘奇·特雷尔与其他黑人精英一样，免受吉姆·克劳法最严酷的影响，但她对肤色以无数种方式限制该市黑人机会的做法感到愤愤不平。在 1906 年发表的一篇广为流传的演讲中，她详细阐述了“在美国首都身为有色人种意味着什么”。这意味着每天都要遭受羞辱，因为美国黑人——与深色皮肤的外国人以及任何阶层的白人不同——被像“麻风病人”一样“赶出”餐馆、酒店和其他公共机构。这意味着经济前景受限，因为黑人工人被工会排斥，只能从事卑微的职业。这意味着在商店、有轨电车、住房和其他地方面临“难以忍受”的歧视。她警告说，其结果是“许多有色人种的青年在早年就被这个国家局势的无助与无望所震惊，以至于在一种坚忍的绝望中，他们听天由命。”⁷⁴\n\
  \n与南方其他地区相比，世纪之交的华盛顿在就业、教育和经济进步方面仍然提供了相对更多的机会，并且没有遭受肆虐南方的残酷种族暴力。但尽管有种种机遇和成就，尤其是在黑人精英中，“华盛顿的黑人生活更像是一个承诺，而非实现，”诗人（及勒德罗伊特公园居民）保罗·劳伦斯·邓巴在\
  \ 1900 年写道。⁷⁵ 与一代人之前该市的生活相比——以及与黑人的期望相比——世纪之交前后的几十年里，黑人居民的政治权力、社会地位和经济机会都出现了令人沮丧的下降。吉姆·克劳法正在华盛顿扎根，新一代华盛顿黑人正在努力争取他们在城市中的一席之地。\n\
  \n### *“我们要自己的”：华盛顿黑人要求自治，无视吉姆·克劳法*\n\n\n\n\n\n面对日益敌视的白人社会，19 世纪后期曾伤害黑人社区的内部分歧开始慢慢愈合。阶级差异依然存在，尤其是在社会生活中，但到了\
  \ 20 世纪初，黑人精英已将其策略从同化转向“提升整个种族”。他们曾试图进入白人俱乐部和组织，往往排斥贫困黑人，如今黑人领袖创建了自己的平行团体。他们曾通过极力强调自身与黑人工人阶级的差异来赢得白人认可，如今则建立了跨阶级联盟以增强整个社区的力量。他们曾主要依赖白人赞助者积累财富，如今其财富越来越多地通过商业和社区机构与黑人工人阶级联系在一起。华盛顿贸易委员会的黑人成员辞职了，默认了他们在该团体中缺乏影响力。这座城市变得更加明显的种族隔离。“在华盛顿，种族隔离比联邦任何其他城市都更彻底，”黑人社会工作者奥西奥拉·马登在\
  \ 1908 年写道。“白人和有色人种中的上等阶层对彼此一无所知。”⁷⁶\n\n玛丽·丘奇·特雷尔体现了黑人精英中的这种新做法。她是华盛顿年轻一代黑人领袖中的一员，他们在选举权被剥夺和种族隔离的背景下长大成人。与弗雷德里克·道格拉斯、约翰·默瑟·兰斯顿以及内战时期的其他人不同，这一代人未曾尝过废奴和战争胜利的滋味；他们只知道重建失败的苦果。他们受过教育、雄心勃勃，却深信华盛顿的白人对种族平等兴趣寥寥，因此他们倡导种族团结而非同化，主张黑人自给自足而非依赖白人赞助，建立黑人机构而非跨种族政治。面对当地和全国范围内日益增长的敌视平等的情绪，这些新领袖倡导强烈的种族自豪感，并将精力投入到发展并维持自己的企业、学校和机构中，以便在这座似乎偏离了自由轨道的城市中生存并繁荣。\n\
  \n特雷尔和其他黑人领袖呼吁跨越阶级和肤色的种族团结。“白得像总统官邸、黑得像国会大厦地下室的黑人，都被混为一谈并受到同样的歧视，”《有色美国人》指出。因此，黑人社区结成共同事业具有现实意义。弗雷德里克·道格拉斯的儿子查尔斯敦促华盛顿的黑人同胞在面对白人敌意时团结一致。作为一名退伍军人、公务员和前贝瑟尔文学与历史学会主席，道格拉斯对白人至上主义者正在推翻重建成果的方式感到愤怒。1899\
  \ 年 11 月，大歌剧院决定重新实行种族隔离，迫使黑人顾客坐到楼座，他呼吁抵制，并批评那些为吉姆·克劳座位付费的黑人顾客“缺乏自尊”。“像建造你们的教堂一样建造自己的剧院，”他建议道，并补充说，“难道我们要永远依赖白人提供剧院、酒店、咖啡馆和各种商店吗？”⁷⁷\n\
  \n在倡导创建黑人企业时，道格拉斯呼应了安德鲁·F·希利尔的呼声，后者是“新商业运动”的主要倡导者。希利尔在战前不久出生于佐治亚州的奴隶家庭，在中西部长大，1882\
  \ 年来到华盛顿就读霍华德大学法学院。他后来成为财政部的会计师，涉足房地产，并发明了两项能产生利润的发明。但他的热情在于培育黑人商业。为了在黑人企业家中建立一种同志情谊和共同使命感，他于\
  \ 1892 年开始出版《联合名录》，这是一本黑人商业成就的汇编，并经常谈论黑人需要将商业作为社会进步的手段。⁷⁸\n\n黑人企业受益于种族隔离的黑人社区兴起，例如西南区的“岛”以及西北区第七街和第十四街之间的\
  \ U 街（后来被称为肖）。白人商人往往拒绝在黑人社区经营，这为黑人企业留下了市场空间，例如首都储蓄银行，罗伯特·特雷尔是该银行的一名官员。早期几代黑人商人通过迎合富有的白人顾客而声名鹊起——回想一下贝弗利·斯诺和他的精致美食餐厅，以及詹姆斯·沃姆利的高档酒店——而\
  \ 19 世纪末的黑人企业家则专注于服务黑人顾客。黑人拥有的殡仪馆、理发店、餐馆和零售店在全市范围内激增。到 1901 年，希利尔的《联合名录》收录了华盛顿 1000\
  \ 多家黑人拥有的企业。而七年前只有 120 家。⁷⁹\n\n也许最积极、最有效的自助和种族自豪感倡导者是南妮·海伦·伯勒斯。作为前奴隶的黑皮肤女儿，伯勒斯在\
  \ M 街高中表现出色（玛丽·丘奇·特雷尔和安娜·朱莉娅·库珀都是她的导师），但 1896 年毕业后，她在华盛顿特区学校系统找工作时却举步维艰，她将此归咎于“政治”，这种政治让关系更好、肤色更浅的同龄人占得先机。这次冷遇成了她心中的一根刺，驱使她毕生致力于为低收入黑人女性开辟教育和就业机会。作为一名强有力的演说家，她成为全国浸信会妇女大会的负责人，并经常公开反对私刑、就业歧视、投票限制以及其他阻碍黑人进步的障碍。她还针对黑人社区内部的阶级分化和肤色歧视。她在\
  \ 1904 年的文章《不是肤色，而是品格》中充满了对那些患有“肤色恐惧症”的黑人“大规模漂白面孔和拉直头发”的愤慨。“肤色不是心灵或灵魂优越的标志，”她写道。⁸⁰\n\
  \n![Image](img/f0001-12.jpg)\n\n*“华盛顿特区全国妇女和女孩培训学校的学生。”南妮·海伦·伯勒斯于 1909 年在华盛顿东北区创办了全国妇女和女孩培训学校。学校秉承伯勒斯的自力更生精神，鼓励学生“工作，养活自己，诉诸自身的力量。”国会图书馆。*\n\
  \n伯勒斯持久的成就之一是她在 1909 年创办的全国妇女和女孩培训学校。学校最初有 35 名学生，占地 6 英亩，位于东北区第五十街和格兰特街的山顶上（现在是私立南妮·海伦·伯勒斯学校的所在地）。伯勒斯称其为“三\
  \ B 学校”——圣经、沐浴和扫帚——其校训体现了自力更生的精神：“工作，养活自己，诉诸自身的力量。”虽然学校提供古典文学课程，伯勒斯也坚持要求正确的语法，但学校主要侧重于基督教教育，并培养学生为工作做好准备，即使是做家政工人。“三分之二的有色人种女性必须靠双手劳动谋生，不把这支养家糊口的大军培养好，确实是一种疏忽，”伯勒斯说。⁸¹\n\
  \n\n\n\n\n对自助和建立黑人机构的强调，并未排除反对种族隔离和种族歧视的政治活动与集体组织。尽管所有华盛顿人——无论黑人还是白人——都被剥夺了通过传统选举方式行使政治权力的机会，但白人社区领袖通过商会和社区协会，对专员和国会施加了相当大的影响力。相比之下，黑人社区领袖常常感到他们的关切被例行忽视。这种影响力的不平衡并未促使黑人从公共领域退缩到“秘密城市”的局限中——这是许多世纪之交的观察者用来描述黑人华盛顿生活“隐藏”在白人视线之外的术语。相反，他们仍然积极参与政治活动，并例行向城市的国会统治者提出集体诉求。\n\
  \n群众集会是黑人组织社区、吸引媒体关注并在舆论法庭上陈述诉求的一种方式。群众集会通常由教堂主办，往往针对特定事件而举行——例如南方的一起私刑、像赫夫林众议员电车枪击案这样的种族动机袭击，或地方官员的种族主义言论。例如，1900\
  \ 年初，愤怒的黑人社区举行了多次群众集会，抗议专员约翰·怀特将华盛顿黑人居民比作“保险箱窃贼”和罪犯。“华盛顿人不能投票，你知道，”黑人联邦雇员斯旺·肯德里克写信给他的未婚妻说，“群众集会是我们让公众人物、国会议员等了解我们对事情看法的唯一手段。”尽管肯德里克如此断言，但华盛顿黑人还是以多种公开方式表达不满，从签署请愿书到举行抗议。玛丽·丘奇·特雷尔和其他直言不讳的领袖定期在国会委员会作证，黑人媒体有力地向广大读者传达社区的关切，黑人居民也组织了自己的社区协会。⁸²\n\
  \n也许最重要的是，许多华盛顿黑人将他们的政治精力投入到公立学校系统中。世纪之交，该市的黑人公立学校是黑人社区的骄傲，黑人领袖将教育视为种族提升的基本前提。他们认为，通过成为有教养、有生产力的社会成员，黑人将“证明”自己值得被当作完全公民对待。然而，黑人学校不仅仅是让下一代适应种族隔离现实的工具。它们还通过灌输自豪感、提供黑人权力和领导力的机会，削弱了白人至上的心态。\n\
  \n尽管他们对隔离学校所暗示的劣等性感到愤慨，但华盛顿黑人积极捍卫华盛顿特区的黑人学校系统，并顽强地争取国会坚持“隔离但平等”的后半部分。与南方其他地区的同行相比，他们能够在学校内部施加显著影响。自\
  \ 1868 年建立隔离学校系统后的三十多年里，黑人学校一直由黑人助理督学乔治·F·T·库克（奥柏林学院毕业，小约翰·F·库克的兄弟）管理。库克直接向学区的董事会汇报，而董事会按惯例是融合的，白人董事通常在涉及黑人学校的事务上听从黑人董事的意见。\n\
  \n由于被剥夺了投票权，黑人公民直接向国会请愿，并在国会听证会上作证支持学校。他们推动为设施提供平等资金，为教师争取平等薪酬——这些在法律上有规定，但实践中很少得到遵守。尽管存在持续的歧视，华盛顿特区黑人学生的人均支出是邻近弗吉尼亚州任何种族学生支出的两倍。黑人学校倡导者还坚持雇佣黑人在黑人学校工作。几十年来，白人女性一直在黑人公立学校广泛任教，但到\
  \ 1901 年，已没有白人教师留下。从中央办公室行政人员到维护设施的体力劳动者，学校都是黑人的。尽管他们从未完全自治——他们仍需向白人当局报告，并从国会拨款者那里寻求资金——但黑人行政人员拥有广泛的自主权来管理学校。⁸³\n\
  \n1900 年，随着吉姆·克劳法在整个城市和地区日益固化，黑人对学校的控制权直接受到攻击。白人学校官员指责助理督学库克任人唯亲、玩忽职守，并鼓励国会接管黑人学校。“我认为（华盛顿黑人）不适合被放任不管”来管理他们的学校，白人学校董事乔治·哈里斯将军在国会听证会上辩称。“我们有我们的遗传，我们比他们多一点文明，我认为我们对是非对错有比他们更敏锐的感觉。”当国会考虑一项提议完全废除黑人助理督学职位的法案时，该市的黑人社区动员起来捍卫他们学校的行政自主权。⁸⁴\n\
  \n反对该计划的黑人强调了让黑人官员担任如此重要职务的象征意义，从而成为黑人社区的适当榜样。“废除这个制度，你就给了华盛顿有色公民的自豪感、激励和团队精神致命一击，”黑人居民\
  \ N·B·马歇尔警告道。他们还主张作为公民有权管理自己的学校。“我们要自己的，”卡尔文·蔡斯在《蜜蜂报》上写道，拒绝白人领导黑人学校，认为这让人想起“旧南方战前观念，即有色人种不适合自治。”如果白人执意推行种族隔离，那么黑人就有权管理自己的学校，他们将动用一切政治力量来要求这一点。通过致国会议员的信件、国会证词、报纸社论和群众集会，华盛顿黑人强有力且有效地论证了黑人学校应继续由黑人学校官员管理。⁸⁵\n\
  \n黑人的压力迫使对方做出适度让步。国会通过了一项重组计划，保留了黑人的自治权，但形式有所削弱。国会没有废除黑人助理督学职位，而是设立了一个新的（白人）督学职位，负责监督两名助理督学——一名白人，一名黑人。该计划还设立了一名新的高中主任，这意味着黑人社区失去了对\
  \ M 街高中和迈纳师范学校（培养教师）的直接控制。黑人社区成员对新制度不满，拒绝接受重组作为最终裁决。他们积压的担忧在 1904 年因 M 街高中的一场争议而爆发，当时校长安娜·朱莉娅·库珀试图维护她对白人高中主任珀西·休斯的行政独立性。\n\
  \n\n\n\n库珀曾是一名奴隶，毕业于奥伯林学院，是一位著名作家，在许多方面都是玛丽·丘奇·特雷尔的翻版（有时也是竞争对手）。她推行了一项雄心勃勃的计划，旨在加强学校的经典课程，提高毕业生人数，并帮助毕业生获得名校奖学金。休斯认为她不服从命令，并试图通过公开指责她忽视纪律、放松学术标准来诋毁她。这位深受爱戴的学校领导人受到攻击，激怒了黑人社区，许多人挺身而出为她辩护。随后的争议引发了多次调查，并促使国会在\
  \ 1906 年对学校进行了又一次重组。部分由于黑人的投诉，国会废除了高中主任职位，并将 M 街高中、迈纳师范学校和阿姆斯特朗手工训练学校（建于 1902 年）置于黑人助理总监的领导下。黑人政治压力再次保护了学校中的黑人自治权。⁸⁶\n\
  \n重组斗争团结了黑人社区。尽管阶级分化依然存在，华盛顿特区的黑人几乎一致为黑人自治而战，并将教育卓越等同于他们相对不受白人干涉地管理学校的能力。他们的政治动员巩固了该市黑人学校系统作为全国典范的声誉。相比之下，许多南方同龄人在设备简陋的学校中苦苦挣扎，这些学校强化了他们在社会中的从属地位，而华盛顿特区的黑人学生则享受着维护良好的学校，拥有顶尖的教师队伍，教授非裔美国历史课程，并鼓励他们进入各类大学。特区的黑人学校紧跟进步主义教育改革，如改进教师培训和引入幼儿园，并提供各种丰富课程，包括以著名黑人领袖为特色的系列讲座，以及前往该地区文化和历史遗址的实地考察。M\
  \ 街高中（1917 年为纪念诗人保罗·劳伦斯·邓巴而更名）成为全美黑人的旗舰高中，其毕业生人数超过全国任何其他黑人高中。⁸⁷\n\n华盛顿特区黑人学校的成功——以及当地社区成功捍卫学校自治——激励了全国的黑人。20\
  \ 世纪初，华盛顿特区不仅仅是国家政府的所在地；它也体现了美国黑人的希望。“我们种族中居住在哥伦比亚特区的人的影响力远非地方性——而是全国性的，”布克·T·华盛顿在\
  \ 1905 年 M 街高中的毕业典礼上说。“这里的失败不是地方性的，而是全国性的；这里的成功也不是地方性的，而是全国性的。”⁸⁸\n\n但这座城市也象征着国家平等主义理想与种族主义现实之间令人沮丧的脱节。“毫无疑问，世界上没有任何地方像美国首都这样，仅凭肤色就进行的压迫和迫害显得如此可憎和丑恶，”玛丽·丘奇·特雷尔在\
  \ 1906 年写道，“因为本政府赖以建立、并仍宣称信奉的原则，与在国旗保护下日常实践的原则之间的鸿沟，如此宽广而深邃。”1913 年上任的新总统将把这条鸿沟拉得更宽。⁸⁹\n\
  \n## 第八章\n\n## 一个需要正视的新黑人\n\n## *种族隔离、战争与黑人战斗精神的新纪元，1912–1932*\n\n对国家首都有色人种社区的不公正，过去和将来都始终会激起全国的愤慨。\n\
  \n——阿奇博尔德·格里姆凯，1918 年\n\n雕刻印刷局的主楼位于国家广场南端，与潮汐湖畔的樱桃树林隔第十五街相望。这座巨大的新古典主义建筑由印第安纳石灰岩和花岗岩装饰而成，沿立面矗立着近一百英尺高的柱子，占据了一个多街区，拥有\
  \ 22.4 万平方英尺的金库和近 10 英亩的楼面面积，供其 1300 名员工使用。该局宏伟的规模并未吓退游客。每年约有 25 万人参观印刷新美钞的印刷机。该局在华盛顿特区的工厂每年印制超过\
  \ 34 亿张钞票。¹\n\n该局的主楼于 1914 年 3 月隆重开放。它被称为“工厂建筑的终极之作”，耗资 280 万美元（约合 21 世纪的 3 亿美元），并采用了当时最现代化的设施，包括一个先进的冷却系统，将饮用水保持在\
  \ 45 华氏度的低温，以及 32,700 块玻璃窗，使各楼层充满充足的自然光。宽敞的餐厅通向屋顶长廊，可俯瞰波托马克河的全景。虽然不属于 1901 年麦克米兰计划的原始部分，但该局的新建筑遵循了该计划对建筑一致性的要求，并且是\
  \ 20 世纪初华盛顿市中心改造的一部分。阴暗、光线不足的意大利式建筑以及简陋的排屋和巷弄公寓消失了。取而代之的是新古典主义的庞然大物，大理石见证了联邦政府的成长和权力。该局的新家体现了联邦政府的稳固和稳定，以及其员工所从事工作的严肃性。²\n\
  \n该局体现了内战爆发后几十年间联邦政府的巨大增长。战争开始时，该机构甚至还不存在。联邦官员很快意识到国家的货币供应不足以满足战争的财政需求，因此 1862 年国会授权财政部开始雕刻、印刷、裁剪和检查纸币。财政部官员斯宾塞·克拉克带着五名员工，启动了后来成为雕刻印刷局的机构（1874\
  \ 年获得永久名称）。随着联邦政府在国民生活中扮演越来越大的角色，该局迅速扩张。到世纪末，它在西南区第十四街和 B 街拐角处的狭小工厂里雇用了超过 2300 人。到第一次世界大战时，员工人数超过\
  \ 8400 人。³\n\n该局的大部分工作艰苦、嘈杂且肮脏——更像是一家工业工厂，而非白领联邦机构。它吸引了数百名爱尔兰移民和来自附近社区的黑人工人。男性印刷工及其女性助手忍受着低薪和出了名的恶劣工作条件。该局的女性是最早组织工会的联邦雇员之一。该局的工作可能很艰难，但与其他联邦工作一样，它为黑人工人提供了一定程度的就业保障、社会流动性和声望，并使他们免受私人劳动力市场的种族主义影响。⁴\n\
  \n尽管不时有人抱怨联邦招聘过程中存在微妙的种族主义，但政府仍然相对注重才能且易于进入。一个有抱负、受过教育的黑人工人可以参加公务员考试，获得一份白领文员工作，从而走向中产阶级的未来。由于大多数高级职位对黑人关闭，《邮报》在\
  \ 1909 年观察到，“最有能力的黑人”竞争中低层文员职位。“自然，有色人种经常在考试中胜出，一旦发生这种情况，就没有什么能阻止他获得任命。”⁵\n\n\n\n\
  \n此外，通过共和党进行的政治庇护仍然是黑人求职者的重要机会来源。自 1883 年文官委员会成立后的几十年里，华盛顿的黑人联邦雇员数量增长了四倍多，到 1907\
  \ 年已接近 2800 人。超过 400 名黑人专业人士和职员在华盛顿的联邦办公室工作，其中包括财政部登记官詹姆斯·纳皮尔，从 1911 年到 1913 年 3\
  \ 月，美国政府印制的每一张美元钞票上都有他的签名。⁶\n\n该局的黑人就业情况也遵循类似模式。1890 年，该局雇用了第一位黑人女员工弗朗西斯·弗拉德，担任印刷助理。当两名白人印刷工拒绝与她共事时，该局的共和党负责人解雇了他们，此举赢得了黑人社区的广泛赞誉。此后，黑人求职者纷纷涌向该局。到\
  \ 1893 年，该局约三分之一的考试申请者是黑人，近一百名黑人女性担任印刷助理。⁷\n\n但联邦政府可能是一个善变的朋友。即使在 1880 年代的文官改革之后，联邦政府工作中黑人雇员的命运仍然容易受到政治风向变化和领导层更迭的影响。在该局，机会之门在\
  \ 1893 年肯塔基州民主党人克劳德·约翰逊被任命为局长后不久就关闭了。被《蜜蜂报》描述为“黑人憎恨者”的约翰逊领导了一场对熟练黑人雇员的系统性清洗。一年之内，剩下的黑人印刷助理不到十人。文官委员会的一项调查谴责了这些解雇行为，但约翰逊仍留任。直到\
  \ 1897 年共和党重新执政，该局才再次向熟练黑人雇员开放。到 1908 年，黑人女印刷助理的人数已攀升至两百人以上。⁸\n\n1912 年民主党人伍德罗·威尔逊当选总统后，该局内部的种族问题再次激化，这反映了联邦官僚机构乃至整个城市的紧张局势。在威尔逊的两届任期内，联邦政府内部的种族关系可能成为该市黑人居民面临的最重要问题。这是一个“新自由”——威尔逊对有序社会的进步主义愿景——与“新奴隶制”——华盛顿黑人描述吉姆·克劳法在整个城市推行——并存的时代。这是一个黑人自决和城市自决的呼声重新引起共鸣的时代，因为这座城市成为了“为民主保障世界安全”的战争的行政指挥中心。这也是一个联邦政府本身成为战场、新的战斗精神注入全国种族斗争的时代。\n\
  \n这是种族冲突与抗争、怨恨与屈服的几十年，无论是在雕刻印刷局等机构的柱廊庇护所内，还是在华盛顿特区的街道上。该局闪亮的新建筑，如同点缀在华盛顿市区的其他美丽联邦纪念碑一样，传达出一种宏伟与现代感，但它们无法缓解在\
  \ 1910 年代和 1920 年代激荡国家首都的种族不平等与愤怒。\n\n### *“新奴隶制”：华盛顿黑人挑战联邦政府中的种族隔离*\n\n当民主党人伍德罗·威尔逊于\
  \ 1913 年 3 月就职时，罗斯巴德·默里已在雕刻印刷局担任印刷助理九年。她是一位土生土长的华盛顿人，被人口普查正式归类为“混血儿”，出生于 1885 年，19\
  \ 岁时毕业于北卡罗来纳州的斯科舍神学院。毕业后不久，她参加了文官考试，并在该局获得了一个入门级职位。她通过多次晋升逐步提升，到 1913 年，她写道，已经“达到了我能达到的最高位置”。默里积极参与社区和教会活动，住在西北区\
  \ U 街走廊沿线蓬勃发展的黑人文化和商业区附近。⁹\n\n默里和她在该局的同事们发现自己处于联邦部门中重新爆发的种族隔离斗争的前线，这场斗争在威尔逊入主白宫后愈演愈烈。威尔逊是弗吉尼亚人，受过学术训练，政治上属于进步派，在不到三年内从普林斯顿大学校长一跃成为新泽西州州长，再入主白宫。作为自内战前以来第一位当选总统的南方人，威尔逊体现了自重建以来美国白人之间的地区和解。他以“新自由”的承诺进行竞选，并将一个致力于政府效率和实验的进步主义理想的民主党政府带到了华盛顿。\n\
  \n威尔逊的许多任命者也拥护白人至上的南方理想。与新总统一样，他们不认为进步主义与种族隔离之间存在矛盾。就职后不久，威尔逊用白人取代了他前任的所有黑人任命者（仅保留两人），他的行政任命者悄悄鼓励联邦工作人员实行种族隔离，这是在罗斯福和塔夫脱总统时期开始的零星努力基础上进行的。无论是否有威尔逊的直接命令，在他的默许下，行政官员将黑人工人隔离在“黑人角落”，强迫他们使用“有色人种”厕所，甚至在联邦建筑中竖起了几块“仅限白人”的牌子。当活动人士质疑他的政府中日益严重的种族隔离时，威尔逊辩称，种族之间的物理隔离是必要的，以避免“摩擦……不满和不安”，从而既能提高效率，又能保护黑人工人免受进一步歧视。¹⁰\n\
  \n受到鼓舞的南方民主党人在国会攻击该市残留的融合习俗，重新提出法案，要求在华盛顿特区隔离有轨电车并禁止跨种族婚姻。内华达州参议员弗朗西斯·纽兰兹（切维蔡斯的创始人）提议将所有黑人送出美国，而全国民主公平竞争协会则大力游说反对任命黑人担任联邦职位。对黑人联邦雇员的持续攻击削弱了该市黑人的士气。“我从未见过（华盛顿的）有色人种像现在这样沮丧和愤恨，”布克·T·华盛顿在\
  \ 1913 年 8 月写道。¹¹\n\n![Image](img/f0001-13.jpg)\n\n*联邦雇员在公共卫生服务诊所等待治疗。总统伍德罗·威尔逊在整个联邦政府中巩固了种族隔离，打击了华盛顿黑人的士气，抑制了黑人的经济抱负。尽管华盛顿的大多数联邦建筑没有明确的隔离标志，但有时也会出现，如这家公共卫生服务诊所。国会图书馆。*\n\
  \n雕刻印刷局是最早感受到新隔离政策冲击的机构之一。1913 年 4 月初的一个晚上，距离威尔逊就职还不到一个月，代理财政部长、弗吉尼亚人约翰·斯凯尔顿·威廉姆斯顺道来到该局，惊恐地看到“年轻的白人女性和有色人种女性并肩工作，面对面坐着”。威廉姆斯通知该局局长约瑟夫·拉尔夫，新政府将不再容忍这种松懈。¹²\n\
  \n\n\n\n\n尽管最初担心局内的种族隔离会“难以实行”，拉尔夫和其他机构官员还是匆忙满足了威廉姆斯的要求。他们设立了独立的卫生间和储物柜，并在餐厅后排为黑人员工预留了桌子。受到这种新的、更具对抗性的隔离精神的鼓舞，一些白人员工开始投诉他们的黑人同事。7\
  \ 月，一位名叫罗斯·米勒的白人女性投诉了润湿部门的一位黑人主管路易丝·纳特；一周之内，拉尔夫局长就用一名白人男性取代了纳特。¹³\n\n就像战前的奴隶主坚称他们的奴隶对自己的处境感到满意一样，威廉姆斯、拉尔夫和其他行政官员声称，他们的黑人员工不仅从隔离待遇中受益，而且实际上更喜欢这样。为了回应来自威斯康星州进步派参议员罗伯特·拉福莱特的煽动性妻子贝尔·拉福莱特的批评，威廉姆斯报告说，根本没有“普遍命令”要求隔离该局。为黑人工人预留餐厅桌子仅仅是因为“据信他们在一起吃午餐会更好”。拉尔夫局长说，大多数黑人工人都毫无怨言地服从了。“有色人种员工曾表示，他们认为这种安排，包括独立的卫生间设施，非常令人满意且恰当，”拉尔夫解释道，“似乎只有那些不愿与自己种族成员交往的有色人种才会提出歧视的指控。”¹⁴\n\
  \n并非局里所有人都愿意接受这种新制度。在威廉姆斯 4 月首次视察后不久，罗斯巴德·默里和另外两名黑人印刷助理——伯莎·桑德斯和玛吉·凯斯——故意挑战他，反复与白人同事坐在一起，即使有两名员工（一白一黑）建议她们离开。拉尔夫把她们叫到办公室。与他同行的还有著名的白人住房改革家夏洛特·霍普金斯，她教训这些女性要接受现状。当这些女性反驳说实际上并没有单独的餐厅，只有厕所旁边的一个等候室时，据《蜜蜂报》报道，霍普金斯回应道：“为什么你们要去不受欢迎的地方？你们知道现在是民主党执政吗？如果你们这些人乖乖听话，远离不受欢迎的地方，我们或许会让你们保住职位。”¹⁵\n\
  \n显然，默里不愿意“乖乖听话”。据拉尔夫说，她在会议上表现得“无礼”且“傲慢”。她和她的同事们决定完全抵制餐厅，因为她们觉得“我们的食物让我们难以下咽”。然而，并非所有黑人员工都支持她们。据一位匿名黑人员工称，一位“老派黑人保姆”斥责这些年轻女性抱怨，并告诉她们应该庆幸自己还有工作。¹⁶\n\
  \n在内部受阻后，默里和她的抗议伙伴们将她们的投诉带到了一个一年前才在当地出现的新组织：全国有色人种协进会（NAACP）。NAACP 于 1909 年由一群跨种族的自由派人士创立，旨在建立一个全国性的民权组织网络，以对抗吉姆·克劳法的蔓延，并推动全面的政治和公民平等。尽管\
  \ 20 世纪初华盛顿的黑人曾参与过各种短命的政治团体，如全国黑人选举权联盟和黑人个人自由党，但事实证明，没有一个团体能像 NAACP 那样具有持久力或政治影响力。\n\
  \n以学者兼活动家 W·E·B·杜波依斯为其思想驱动力，NAACP 对当时最杰出的黑人领袖布克·T·华盛顿构成了直接挑战。华盛顿是一位在政治上精明的南方人，在白人中很受欢迎，他鼓励黑人在隔离的现实下实现自给自足和经济可持续性。他巧妙地利用赞助及其与白人政客的关系，以他在阿拉巴马州创办的塔斯基吉学院为基础，建立了一个强大的政治机器。出生于北方、性格暴躁的杜波依斯否定了华盛顿的“迁就主义”，并敦促美国黑人拒绝一切形式的隔离。同样才华横溢、雄心勃勃且固执己见的华盛顿和杜波依斯关系复杂，并逐渐相互怨恨，各自鼓励自己的支持者与对方的想法和倡议划清界限。¹⁷\n\
  \n“布克派”和“激进派”在特区不时发生冲突，但许多华盛顿黑人拒绝选边站队，而是大量借鉴两派的思想。例如，玛丽·丘奇·特雷尔与 W·E·B·杜波依斯密切合作，并拥护“激进”思想；然而，她仍然拒绝说布克·T·华盛顿的坏话，并且作为教育委员会成员，她支持布克派所倡导的职业培训。她后来写道：“我欣赏华盛顿博士训练大众谋生的努力，因为我知道，没有一个种族能在没有训练有素的劳动阶级的情况下，希望建立在稳固的经济基础之上。”她的丈夫罗伯特是一位公开的布克派，他的法官职位归功于塔斯基吉机器，并声称华盛顿特区\
  \ 99%的黑人居民支持华盛顿。¹⁸\n\n霍华德大学的凯利·米勒也对这两种方法表示同情。他是一位数学教授，对种族平等的热情使他涉足社会学，成为他那个时代最多产的黑人政治作家和演说家之一，但他被指责在斗争中“骑墙”而非明确表态。米勒为自己辩护道：“有效的骑术是通过跨坐来实现的”——在变幻莫测、不断变化的政治舞台上，米勒和许多其他华盛顿黑人更倾向于灵活周旋，而非僵化的教条主义。¹⁹\n\
  \nNAACP 华盛顿特区分会于 1912 年 3 月成立，是一个“大帐篷”，涵盖了该市黑人领导层内的各种意见。凭借其庞大的中产阶级支持者基础以及靠近联邦立法者的优势，它很快成为全国最大、最有影响力的\
  \ NAACP 分会。与全国性组织不同，它主要由黑人组成——当地华盛顿特区分会只有少数白人成员，其中一些人，如贝尔·拉福莱特，既非土生土长的华盛顿人，也非长期居民。华盛顿的白人通常对黑人社区日益增长的激进主义一无所知或未参与其中。²⁰\n\
  \n然而，当罗斯巴德·默里和她的同事于 1913 年春天来到 NAACP 时，她们从分会创始主席 J·米尔顿·沃尔德伦那里得到的帮助甚微。（她们最终将她们的故事告诉了贝尔·拉福莱特，后者在《拉福莱特杂志》上发表了对这三名女性的采访；默里后来因“不服从命令”被解雇，拉福莱特帮她找到了一份新工作。）沃尔德伦正陷入一场由他自己造成的、令人精疲力竭的领导危机。作为示罗浸信会教堂固执己见的牧师，沃尔德伦对共和党日益失望，并于\
  \ 1912 年为民主党人伍德罗·威尔逊助选。威尔逊当选后，沃尔德伦对里士满的听众说，南方白人“除了政治之外，在其他一切方面都是我们最好的朋友”，并实际上将黑人因对共和党奴性般的忠诚而导致自身被剥夺选举权的责任归咎于黑人自己。²¹\n\
  \n\n\n\n沃尔德伦的演讲在华盛顿特区支部内引发了激烈的批评浪潮。以教育家和活动家南妮·伯勒斯为首的本地批评者，与希望遏制华盛顿特区支部日益壮大的全国有色人种协进会（NAACP）官员联手，于\
  \ 1913 年夏天将沃尔德伦赶下台。他们任命阿奇博尔德·格里姆凯接替其职位，后者于 9 月担任临时主席，并于 1914 年 1 月正式当选。²²\n\n格里姆凯是一个打破刻板印象的人。他于\
  \ 1849 年出生为奴隶，是南卡罗来纳州一位著名种植园主与混血女奴所生的三个儿子之一，也是安吉丽娜和萨拉·格里姆凯的侄子——这对姐妹是战前时期最重要的南方白人废奴主义者。内战后，他移居北方，就读于宾夕法尼亚州的林肯大学，并成为哈佛法学院第二位黑人毕业生。他曾担任律师、编辑和作家，之后获得民主党总统格罗弗·克利夫兰的任命，于\
  \ 1894 年至 1898 年担任美国驻圣多明各领事。\n\n回到美国后不久，格里姆凯搬到华盛顿特区，与他的兄弟弗朗西斯同住，后者是第十五街长老会教堂的牧师。作为广受欢迎的《纽约每日时代》的专栏作家和美国黑人学院院长，用凯利·米勒的话说，格里姆凯是“激进派中的激进派”，坚决反对白人至上主义。他极其独立且富有挑衅性的反传统精神，时而支持、时而批评杜波依斯和布克·T·华盛顿。凭借雪白的头发和与之相配的修剪整齐的小胡子，格里姆凯在\
  \ 1910 年代成为该市最知名、最有效的黑人领袖。²³\n\n格里姆凯抓住联邦政府内部的种族隔离问题，将其视为一个机会，旨在团结该市四分五裂的黑人社区，支持羽翼未丰的华盛顿特区\
  \ NAACP，并建立一个类似于战前废奴运动的全国性跨种族种族平等运动。几个月内，他为华盛顿特区支部带来了焦点和活力，成员从 143 人增加到 700 人。该支部组织了一系列抗议和群众集会，其中包括\
  \ 1913 年 10 月的一次集会，吸引了近万人涌入距离威尔逊白宫仅五个街区的首都非洲裔卫理公会教堂，现场人满为患。格里姆凯指责道，威尔逊“自解放以来给了我们总统最无情的一击”，而联邦政府隔离黑人雇员的努力旨在“侮辱、羞辱、贬低[黑人]，并将他们推向新的奴役”。²⁴\n\
  \n反对联邦政府种族隔离的运动建立在华盛顿在全国意识中日益提升的地位之上。随着美国在外交事务中确立自己作为全球大国的地位，华盛顿作为不断扩大的联邦政府中心，其重要性也随之增加。这座城市不再被贬低为一个尘土飞扬的乡村小镇，而是随着麦克米兰规划所设想的闪闪发光的联邦城市逐渐成形，获得了全国的赞誉。格里姆凯和其他本地黑人领袖试图利用这座城市的新声望，引起人们对种族不公的关注。他们抓住威尔逊喜欢发表宏大、理想主义言论的特点，指出国家首都与这些理想相去甚远。黑人周刊《独立报》的编辑写道，华盛顿的种族歧视“既不爱国，也不民主”。²⁵\n\
  \nNAACP 的努力帮助挫败了国会中许多反黑人法案的通过，但未能阻止联邦政府内部种族隔离的蔓延。在威尔逊两届任期内，白人行政官员拒绝雇用或任命合格的黑人求职者，撰写关于黑人雇员的负面人事报告，并拒绝给资深黑人工人晋升。1914\
  \ 年的一项行政命令要求联邦工作申请附上照片，许多机构开始要求个人面试，这使得行政官员更容易歧视黑人求职者。²⁶\n\n威尔逊政府不均衡但最终成功地将联邦劳动力隔离的努力，不仅打击了华盛顿特区黑人联邦工人的士气。它还限制了他们的抱负，并有效收窄了受过教育的黑人仍可获得的少数经济进步和工作保障途径之一。²⁷\n\
  \n表 4 华盛顿人口，1910–1930 年\n\n![Image](img/t0001-04.jpg)\n\n约翰·亚伯拉罕·戴维斯的案例显示了威尔逊政策对黑人联邦工人的影响。戴维斯是华盛顿本地人，父亲是白人律师，母亲是黑人管家。他以\
  \ M 街高中毕业生代表的身份毕业，并于 1882 年在政府印刷局开始了职业生涯。他最初是一名低级劳工，每小时挣 25 美分。三十年后，他晋升为白领职员职位。一位主管形容他“工作彻底、精力充沛、认真负责，属于最高水平”，戴维斯年薪\
  \ 1400 美元，管理着十名员工，其中包括九名白人工人。他的家庭享受着中产阶级生活方式，在西北 S 街拥有一栋漂亮的房子，在弗吉尼亚州农村还有一个 85 英亩的农场。\n\
  \n但威尔逊政府阻止了戴维斯的向上流动。1913 年 3 月威尔逊就职一个月后，戴维斯在政府印刷局的主管将他降职，并削减了 15%的工资。第二年，他们将他一路降为劳工，年薪\
  \ 500 美元，回到了他三十年前开始职业生涯的岗位。戴维斯强烈抗议，但无法挽回损失。由于依赖联邦薪水，他家庭脆弱的中产阶级生活崩溃了，他们陷入了贫困。²⁸\n\
  \n随着联邦政府对黑人就业越来越不友好，这座城市作为黑人进步灯塔的吸引力减弱了。黑人向华盛顿的迁移放缓。到 1920 年，该市黑人人口仅占 25%，这是自内战以来的最低水平。²⁹\n\
  \n### *“民主的耻辱”：战时华盛顿的种族歧视*\n\n在与种族隔离蔓延的斗争中，华盛顿的黑人居民从美国卷入一场 1914 年爆发的欧洲冲突（后来被称为大战，再后来是第一次世界大战）中获得了修辞上的弹药。与之前的内战一样，大战对国家首都产生了变革性的影响。用一位记者的话说，华盛顿是“文明世界的战时首都”，是威尔逊政府以前所未有的方式控制国家经济和工业的庞大官僚战争努力的总部。除了不断扩大的武装部队外，政府还招募了一支白领工人大军——职员、簿记员、速记员和其他低级雇员，其中大多数是女性——为一系列负责监督战争努力的新联邦机构工作。《哈珀斯》的一位记者惊叹道：“这个城镇的人口像富矿采矿营地一样激增。”在美国于\
  \ 1917 年 4 月参战后的四个月内，估计有 6 万到 7.5 万名新工人抵达该市。到战争结束时，华盛顿特区的人口已膨胀至 52.6 万，自战争开始以来增长了约\
  \ 50%。³⁰\n\n\n\n\n\n然而，与内战不同的是，前往华盛顿的大批一战时期移民中绝大多数是白人，其中许多人来自南方腹地。尽管芝加哥和底特律等北方工业城市涌入了大量逃离南方、前往蓬勃发展的国防工厂工作的农村黑人，但相比之下，迁往华盛顿的黑人移民只是涓涓细流。鉴于威尔逊政府早期设置的联邦就业障碍，很少有黑人移民能在迅速扩张的官僚机构中期望获得比杂役更好的职位。³¹\n\
  \n新来的白人很快吸收了这座城市的种族习俗，但战时紧急情况常常使得严格执行种族隔离变得困难，尤其是在居住区。战争工作人员的激增使城市本已匮乏的住房资源捉襟见肘，租金飙升，在战争第一年就上涨了三倍多。住房官员放弃了到\
  \ 1918 年消除小巷住房的计划，转而争相创造更多空间。联邦政府在联合车站附近建造了数十座临时宿舍，官员们有时会征用无人居住的房屋，并施压房主向寄宿者敞开大门。“我们的家不再是我们的城堡，”一位华盛顿妇女抱怨道，“如果你离家过夜，早上很可能发现屋里挤满了嚼口香糖的年轻女子。”³²\n\
  \n尽管找房困难，许多白人移民仍拒绝在黑人民居区寻找房间。据估计，即使在住房危机最严重的时候，仍有四千间房间空置，因为它们不在西北区，因此“处于界限之外”。然而，有时对房间的迫切需求导致白人工人寄宿在黑人家中。白人战时工人约瑟芬·莱曼帮助来自密歇根的朋友找到了住处，“但是，”她哀叹道，“那房子由一个肤色太深、不合我们心意的女人经营，而且位于一个完全由同样肤色的人居住的街区。”他们还是住了下来，但莱曼决心为他们找一个更好的地方。³³\n\
  \n战争不仅削弱了种族隔离的可行性，还给华盛顿的黑人以及全国的非裔美国人提供了一件强有力的武器，用以攻击吉姆·克劳法的思想基础。通过穿上军装为国家而战，黑人士兵可以证明他们的男子气概，并对完全公民身份提出强有力的要求。论据是，如果国家能够信任黑人士兵让世界对民主更安全，那么它当然不能剥夺他们作为公民的基本权利。尽管全国有色人种协进会当地负责人阿奇博尔德·格里姆克和其他人对战争是否明智抱有严重疑虑，但华盛顿的大多数黑人领袖认为，支持比异议更能推动他们的事业。他们宣扬一位当地教会官员所称的“黑人的高度爱国精神和忠诚的责任感”，组织集会敦促黑人男子登记入伍。近\
  \ 26,500 人这样做了。³⁴\n\n华盛顿黑人是首批应征入伍的士兵之一——哥伦比亚特区国民警卫队第一独立营的 50 名军官和 929 名士兵于 1917\
  \ 年 3 月下旬集结，比威尔逊总统正式宣战早了一周。他们驻守白宫和城市周围的其他战略要地。近 600 名华盛顿黑人在隔离的第九十三师第 372 步兵团服役，该团由弗雷德里克·道格拉斯的儿子查尔斯·雷蒙德·道格拉斯组建，并赢得了法国和美国军事官员的尊重。³⁵\n\
  \n一战期间的服役——以及他们在军队中经常遭受的种族歧视——促使许多黑人退伍军人返回华盛顿，渴望为种族平等而战。雷福德·洛根是 M 街高中校友和威廉姆斯学院毕业生，后来成为霍华德大学开创性历史学家而闻名，他是第\
  \ 372 团的一名军官。战斗服役结束后，他在法国待了几年，而不是返回华盛顿面对持续的歧视。负面的战时经历促使另一位 M 街高中毕业生（阿默斯特学院校友）查尔斯·汉密尔顿·休斯顿成为一名民权诉讼律师。³⁶\n\
  \n回到国内，黑人领袖将战争与美国国内反对剥夺选举权、种族隔离和种族暴力的持续斗争联系起来，抓住战时关于民主和自决的言论，呼吁更大的种族正义。就在国会向德国宣战几天后，霍华德大学教授凯利·米勒在《晚星报》上明确指出了这种联系。“对于（黑人的）忠诚、军人效率或为国服务的意愿，无需丝毫担忧，”米勒向读者保证。但黑人的忠诚应得到回报。“那些为国旗的荣誉和荣耀而战的人，值得在这面旗帜下享有充分的自由和特权。”³⁷\n\
  \n然而，持续的种族歧视威胁着削弱黑人对战争的支持。动员开始后不久，情况就变得明朗：军方不打算将黑人新兵训练成战斗人员；相反，他们将被降级为白人士兵服务，担任厨师、清洁工和其他体力劳动者。米勒意识到，被排除在战斗之外将延续黑人士兵的二等公民身份，而不是增强他们对平等的要求，于是他与阿奇博尔德·格里姆克及其他华盛顿黑人一起，在\
  \ 5 月初与战争部长牛顿·贝克会面时，推动建立一体化的军事训练营。贝克拒绝了，但后来同意建立隔离的训练营，以培养黑人军官担任指挥职务。格里姆克和米勒知道，“吉姆·克劳营”并不理想，但黑人士兵至少有机会在战斗中证明自己的勇气。³⁸\n\
  \n华盛顿黑人还利用战争的言论在国内战线挑战种族主义。当红十字会拒绝登记黑人护士时，当地受过教育的黑人女性团体（也是全国大学妇女协会的前身）——大学女校友俱乐部——写了一封公开信给威尔逊总统，表达他们的沮丧。“爱尔兰人，甚至德国人，都像其他公民一样受到对待，”他们写道，“唯独我们，在这件事上，如同在其他一切事情上一样，被隔离。”他们挑战威尔逊，“通过打击其在美洲的敌人——种族歧视——来展示你对民主的信念。”当黑人宾客被排除在国会大厦的女士休息室和餐厅之外时，格里姆克和全国有色人种协进会用威尔逊式的理想主义质疑他们的不公待遇：“我们的国家参战是为了让世界对民主更安全，无论其众多民族的人种或肤色如何，还是我们的国家对德宣战仅仅是为了让世界对白人更安全？”³⁹\n\
  \n\n\n\n\n在战争官僚机构中，黑人工作者也遭遇了歧视，正如玛丽·丘奇·特雷尔所发现的那样。特雷尔参加了公务员考试，并填写了一份详细说明自己能力的问卷，包括她精通德语和法语。一位主管对她的资历印象深刻，将她叫到办公室，但惊讶地发现她并非他预想中的白人女性。他拒绝雇用她。相反，她在战争风险保险局找到了一份初级文员职位。她的主管误将肤色较浅的特雷尔安排到一个全是白人的房间，她在那里工作了两个月，直到官员们意识到错误，并以捏造的无能指控将她解雇。“这是我一生中最令人恼火的经历之一，”她后来写道。她在人口普查局的“有色人种女性部门”找到了一份新工作，但当机构官员禁止黑人女性使用她们多年来一直使用的卫生间时，她提出了反对。她向发布该命令的官员提出质疑，并在对方拒绝撤销命令后愤而辞职。“这份工作很愉快，而且我确实需要钱，”她回忆道，“但想到留在一个由那些不关心有色人种女性感受的男人领导的部门，我就感到厌恶。”⁴⁰\n\
  \n即使在华盛顿的黑人居民在军队和官僚机构中经历并反抗政府认可的偏见的同时，1917 年夏天全国爆发的种族暴力也激起了他们的愤怒。在伊利诺伊州东圣路易斯，耸人听闻的媒体报道称黑人犯罪浪潮高涨，这加剧了白人对刚从南方迁来的黑人移民的政治和经济怨恨。在两名白人（包括一名警察）在黑人社区被杀后，愤怒的白人暴徒花了三天时间在黑人聚居区横冲直撞，焚烧房屋并殴打他们看到的任何人。当地当局未加制止，暴徒杀害了超过一百名黑人，却无人被绳之以法。一个月后，休斯顿的黑人士兵因在隔离基地遭受虐待而报复，他们以攻击队形行进到镇上，杀死了十几名白人。然而，与东圣路易斯不同，当局迅速采取行动惩罚肇事者——其中\
  \ 13 名士兵立即被处决，另有 16 人被判处死刑。⁴¹\n\n东圣路易斯的“种族骚乱”以及休斯顿黑人士兵被处决的事件，加上当年发生的一系列骇人听闻的私刑，激怒了华盛顿的黑人居民。邓巴高中的教师无视学校董事会政策，佩戴哀悼标志以示抗议。在霍华德剧院的一次公开会议上，两名黑人退伍军人警告说：“我们对一个歧视、隔离、允许私刑和火刑的政府没有特别的忠诚。”凯利·米勒和阿奇博尔德·格里姆凯等黑人领袖加强了对威尔逊总统的批评。在\
  \ 1917 年 8 月致总统的一封题为《民主的耻辱》的公开信中，米勒称总统在国内支持自由的努力是“可悲的失败”，并挑战他采取更多措施保护黑人权利、防止种族暴力。“如果民主化地球上的国家导致它们以焚烧人类为乐，那又何必呢？”随着战争的推进，格里姆凯越来越沮丧，不仅因为种族歧视的持续存在，还因为他认为全国有色人种协进会支持战争努力的战略在道德上有所妥协。⁴²\n\
  \n黑人的异议引起了军方官员的注意，他们担心首都的黑人居民正在转向反对战争。军事情报局设有一个专门负责“黑人颠覆活动”的办公室，其特工监视着凯利·米勒和其他直言不讳的黑人领袖，并定期报告他们认为在华盛顿黑人中传播德国宣传的证据。“华盛顿有多少黑人是亲德的，这真是令人瞩目，”一位在黑人社区上城（现称肖）开店的德国店主告诉一名军事调查员。一位紧张的军事官员要求撤走保护白宫的华盛顿特区黑人国民警卫队，理由是“整个国家，特别是华盛顿的不稳定状况，尤其是与黑人问题相关的情况。”⁴³\n\
  \n1918 年 6 月，军事情报局派遣其唯一的黑人特工沃尔特·洛文少校调查“本市有色人种的不安情绪”。洛文是 M 街高中的毕业生，战前他的军旅生涯是作为一名陆军音乐家和乐队指挥度过的。他发现“这座城市从未有过如此艰难的时刻”。他捍卫了黑人社区的忠诚，但承认一些黑人工作者正在利用战争来改善生活。洛文写道，由于城里来了这么多新的战争工作者，“仆人们知道对劳动力的需求远大于供应，他们正在利用这个机会”要求更高的工资、更灵活的工作时间以及在工作场所更大的自主权。他采访的一位厨师坚持说，“她不会为任何白人做饭，除非每月至少\
  \ 75 美元”，因为她知道“厨师很难找，她可以在任何地方找到工作”。洛文少校指出，这种“独立姿态”，甚至“仆人的傲慢”，“极大地震惊了特区的白人”。然而，这不应“被视为德国宣传，而应被视为他们对自己在家庭中重要性的认识。”⁴⁴\n\
  \n洛文在华盛顿仆人中发现的那种自我主张，是第一次世界大战及之后许多美国黑人更大转变的一部分。渗透在战争努力中的自由与民主言论，以及黑人士兵在海外的出色表现，鼓励全国各地的黑人重新思考自己和他们的国家。许多黑人退伍军人在海外为自由而战后回到美国，不愿再顺从习俗，不愿再次屈服于低等地位。阿奇博尔德·格里姆凯宣称，黑人士兵“回来时已不是原来的他，而是一个新黑人。他回来是为了在自己的土地上挑战不公，并以一种在未来的痛苦或许血腥的岁月中不会让他失望的勇气去对抗邪恶。”⁴⁵\n\
  \n### *“华盛顿的种族战争”：1919 年种族骚乱及其后果*\n\n一种新的战斗精神，以工会领袖 A·菲利普·伦道夫和黑人民族主义者马库斯·加维等全国性人物为代表，注入了战后华盛顿的黑人生活，无论是黑人退伍军人还是非退伍军人，都努力确保战争能导致该市种族气候的重大变化。“通过他在几乎每一个军事部门中表现出的忠诚、英勇和效率……[黑人]\
  \ *已经证明了他有权在和平时期获得更充分的正义、尊重、机会和公平对待！*”埃米特·杰伊·斯科特写道，他是霍华德大学的管理人员，也是战时威尔逊政府中职位最高的黑人官员。当地全国有色人种协进会成员\
  \ J·R·霍金斯发布了一份黑人“十四点”宣言，与威尔逊总统的战后期望相呼应。该宣言呼吁政治权利、经济机会，以及废除隔离、私刑和歧视。⁴⁶\n\n\n\n\n\n\
  “新黑人”的自信与张扬让华盛顿及其他地方的白人感到恐惧和愤怒，他们希望战后能巩固种族隔离的现状。1918 年 11 月停战协定结束了海外战争，却在国内引发了经济和社会动荡——数百万士兵返乡后面临经济衰退、失业和罢工潮——白人对黑人进步及其所谓好战态度的怨恨只增不减。1919\
  \ 年的“红色夏季”期间，种族暴力席卷全国，从费城到阿肯色州伊莱恩等地，数百人死伤。华盛顿也未能幸免于暴力。⁴⁷\n\n这座城市在向和平时期过渡时面临巨大挑战。人口稳定在\
  \ 45.5 万，比战争开始时增加了约 10 万。官僚机构缩编，军队迅速复员，经济萎缩，留给决定留在华盛顿地区的众多军人和战时工人的工作岗位寥寥无几。许多复员士兵虽已不再现役，却仍穿着军装，游走在联邦与地方权力之间的模糊地带。数百人加入了准军事性质的社区警戒组织“家园防卫联盟”。这些受过军事训练、年轻躁动且常常无所事事的男子，经常在街头寻欢作乐。⁴⁸\n\
  \n在这本已动荡不安的局面中，又添了最后一根导火索：1919 年 6 月和 7 月，一名黑人男子实施了一系列性侵。当警方围捕黑人嫌疑人、白人自警团在全城搜捕罪犯时，当地媒体利用白人对跨种族性行为的深层恐惧，大肆刊登关于“袭击白人女性”的耸人听闻报道（尽管第一位受害者是一名黑人女教师）。华盛顿全国有色人种协进会深知媒体在\
  \ 1917 年东圣路易斯事件中如何煽动种族紧张局势，于 7 月初致信该市四家主要报纸的编辑，警告他们“正在用煽动性标题播下种族骚乱的种子”。不到两周，这些种子便结出了恶果。⁴⁹\n\
  \n7 月 18 日星期五晚上 10 点左右，年轻白人女子埃尔西·威廉姆斯从雕刻印刷局下班步行回家，据称两名黑人男子上前搭讪并试图抢走她的雨伞。尽管威廉姆斯并未受伤，但这一事件引发了《纽约时报》所称的“华盛顿种族战争”。威廉姆斯的丈夫在海军航空兵服役，消息迅速在城里的军人圈中传开。第二天晚上，数百名白人男子——主要是士兵，其中一些穿着军装——组成的暴徒涌向西南区的黑人社区布拉德菲尔德，袭击了数名黑人居民。《巴尔的摩太阳报》赞许地写道，这群暴徒“决心向华盛顿的黑人居民表明，这是白人的城镇，白人不仅打算管理它，还要确保自己家庭的安全”。警方介入，但未逮捕任何人——警察只是要求暴徒散去，他们照做了，没有发生进一步事件。⁵⁰\n\
  \n全国有色人种协进会立即致信海军部长约瑟夫斯·丹尼尔斯，要求他“约束那些……对骚乱负有责任的水兵和海军陆战队员”。但丹尼尔斯和其他联邦官员在首夜袭击后几乎未采取行动。市政当局也未能采取足够措施防止进一步暴力。由于警方执法不力，暴徒在周日晚上变得规模更大、更加胆大妄为。《华盛顿邮报》估计，暴徒人数达到一千至两千人，他们“涌过市中心区，沿着宾夕法尼亚大道搜寻黑人”。暴徒中的白人挥舞着刀、枪、棍棒和装满石子的手帕，在白宫前袭击了两名黑人男子，将拖下电车的黑人乘客野蛮殴打，并驾车穿过黑人社区开枪射击。⁵¹\n\
  \n随着暴力升级，黑人领袖与市政官员会面，呼吁地方和联邦官员采取行动平息城中的“极端无法无天”状态。但暴力仍在继续，部分原因是媒体的煽动。7 月 21 日星期一，《华盛顿邮报》头版报道告知读者，“已下令动员所有驻扎在华盛顿或附近、或在此休假的服务人员”，进行一场“清理行动”，这将使过去两晚的事件相形见绌。⁵²\n\
  \n华盛顿的黑人居民，尤其是退伍军人，将此通知解读为即将遭受袭击的明确警告。他们不愿让华盛顿成为“又一个东圣路易斯”，于是组织起来保护自己的社区，既对抗白人暴徒，也对抗当局。批评者指责警方助长了暴力，因为他们“给黑人和白人留下的印象是，他们是白人的盟友”。由于当地枪支经销商拒绝向黑人顾客出售枪支，一些黑人男子驱车前往巴尔的摩获取武器弹药，再分发到华盛顿。狙击手埋伏在联排别墅屋顶上，武装的黑人巡逻队沿着西北区第六街至第十四街之间的\
  \ U 街巡逻。在霍华德大学，预备役军官训练团军官准备运送武器弹药，而肤色较浅的退伍军人则混入白人暴徒中。全国有色人种协进会调查员詹姆斯·韦尔登·约翰逊写道，黑人社区“冷静而坚定，毫不畏惧”。“他们下定决心，不惜牺牲生命也要保卫自己和家园。”⁵³\n\
  \n随着黑人社区开始对白人袭击进行报复，周一晚上发生了最致命的暴力事件。战争部长牛顿·贝克下令骑兵进城，警察局长雷蒙德·普尔曼调集了 400 人的宪兵队封锁市中心区域，但战斗蔓延到了上城区和西南区的黑人聚居区。《华盛顿时报》报道称：“成群的白人和黑人像氏族成员一样在夜间互相追猎。”“华盛顿历史上从未有过如此严重的种族骚乱。”⁵⁴\n\
  \n周二，在连续三晚暴力升级后，贝克部长控制了局面（暴力爆发时，威尔逊总统正在波托马克河上巡游，他因病重且事务缠身，无暇过多关注骚乱）。贝克调遣了数百名联邦军队，据《华盛顿邮报》报道，数小时内，“国家首都几乎成了一座武装营地”。得益于当晚倾盆大雨，联邦军队基本维持了街道秩序，暴力逐渐平息。经过四天的混乱，六人死亡，数十人受伤，数百人被捕——骚乱期间每逮捕一名白人，就有大约十名黑人被捕。尽管流血事件频发，但财产损失却出奇地少，因为骚乱者主要互相攻击，而非破坏建筑。⁵⁵\n\
  \n\n\n\n\n当城市居民清扫碎玻璃、包扎伤员时，一股自豪感涌遍了黑人社区。他们没有让白人暴徒肆意横行，而是挺身而出保卫自己的街区，准备“为种族而死，对抗白人暴徒”，NAACP\
  \ 成员、邓巴高中历史教师内瓦尔·托马斯激动地写道。“我们面对的是新黑人，而非奴隶，”暴乱后的那个周日，希洛浸信会的 J·米尔顿·沃尔德伦牧师在布道中说。“黑人拯救了自己，也拯救了华盛顿，因为他们决心不逃跑，而是战斗——为保卫生命和家园而战，”钦佩的詹姆斯·韦尔登·约翰逊在《危机》杂志上写道。“如果白人暴徒未被制止——而正是黑人的坚定努力制止了他们——华盛顿就会变成另一个更糟糕的东圣路易斯。”⁵⁶\n\
  \n这场暴乱不仅展现了黑人社区的物理力量，也展现了其法律、政治和媒体实力。暴力肆虐之际，黑人领袖举行公开集会、向媒体发表讲话，并与白人当局进行秘密外交。暴乱后，黑人律师努力为在混乱中被捕的人洗脱罪名。黑人观众挤满法庭，他们成功推翻了大部分定罪和罚款。甚至\
  \ 17 岁的黑人少女卡丽·约翰逊——她在暴乱中杀死一名白人侦探而被判过失杀人——最终也获释了。⁵⁷\n\n黑人领袖及其盟友发起全国媒体攻势，以澄清暴乱的起因。在《调查》杂志上，美国劳工部的黑人经济学家乔治·E·海恩斯抨击了暴乱前几周耸人听闻的媒体报道，并将暴力归咎于“白人针对黑人的不法行为未受惩罚”，以及双方的“误解、恐惧和猜疑”。NAACP\
  \ 的赫伯特·塞利格曼在《新共和》杂志上撰文指出，黑人犯罪只是白人暴力真正原因的公开掩饰——“决心把黑人打回战前状态”，因为白人担心“黑人工资太高，变得‘独立’，即不再像南方白人希望的那样顺从。”⁵⁸\n\
  \n“华盛顿的种族战争”一周后又在芝加哥爆发了种族暴力，这让华盛顿特区及全国许多白人观察者感到恐惧。他们对暴力的规模以及黑人居民反击的意愿感到震惊，并将大部分责任归咎于黑人社区新的好战精神。“大战之前，华盛顿的大多数黑人行为端正，兼具北方和南方的观点，”《纽约时报》的编辑写道。“他们中的大多数承认白人的优越性，两个种族之间的麻烦是做梦也想不到的。”⁵⁹\n\
  \n军事情报部的 J·E·卡特勒少校——一位专门研究种族关系的白人社会学家——指出了暴乱的几个原因，但没有一个涉及组成暴徒的白人士兵。他认为，根本原因是“长期以来在这里进行的宣传，敦促有色人种坚持在所有方面与白人平等，并在必要时诉诸武力以确立自己的权利。”由于进行了反击，“许多黑人确信他们在暴乱中战胜了白人，他们展示了对白人暴徒和警察的优越性，甚至军队也无法对他们造成太大影响。”卡特勒警告说，这种态度可能“在不久的将来引发一些非常严重的种族冲突”。“毫无疑问，在我们的政治和社会生活中，有一个新黑人需要认真对待。”⁶⁰\n\
  \n卡特勒在军事情报部“黑人颠覆”部门的黑人同事沃尔特·洛文少校，对这位“新黑人”提供了更具同情心的视角。被他的军事上级称赞（或谴责）为“最佳类型的‘白人的黑人’”，保守而谨慎的洛文对战争期间黑人士兵遭受的虐待以及黑人平民被针对的情况越来越感到沮丧。在分析华盛顿及其他地方的暴乱时，洛文看到了一群被逼到极限的人。“黑人已经决定，他们再也无法忍受了，”他在离开军事情报部前的最后一份报告中写道。“他决定反击。”⁶¹\n\
  \n华盛顿黑人社区的抵抗精神激励了全国的黑人观察者，再次凸显了这座城市在美国黑人中的战略和象征作用。在评论华盛顿暴乱的影响时，全国最大的黑人报纸《芝加哥卫报》的编辑写道：“年轻一代的黑人男子不满足于像他们的父辈那样沿着阻力最小的道路前进。”⁶²\
  \ 与 1968 年 4 月马丁·路德·金遇刺后摧毁华盛顿的民间骚乱不同，1919 年的暴乱对城市黑人社区造成的长期损害很小。对暴乱期间官方不作为的不满挥之不去，但许多华盛顿黑人对自己社区面对白人暴力时的勇气感到理所当然的自豪。暴乱参与者是“民主事业的爱国者”，《蜜蜂报》的一位作者宣称，欢呼“新民主的曙光”。这场暴乱帮助在华盛顿及其他地方锻造了一种更加自信、坚定的黑人文化，这种文化即使在接下来十年中种族隔离加剧的情况下也会蓬勃发展。⁶³\n\
  \n### *“这个受苦却美丽的小奋斗世界”：20 世纪 20 年代华盛顿特区自信的黑人文化*\n\n内瓦尔·托马斯在 20 世纪 20 年代已不再年轻，但他无疑是令卡特勒少校恐惧的“新黑人”之一。他\
  \ 1874 年出生于俄亥俄州，世纪之交来到华盛顿，在国会图书馆工作，同时在霍华德大学获得两个学位。和玛丽·丘奇·特雷尔一样，他热爱旅行，形成了关于种族和民主的全球视野，并在邓巴高中教授历史近三十年。这位单身汉毕生致力于种族平等斗争，是\
  \ NAACP 华盛顿特区支部的创始成员之一，并以毫不妥协的战斗精神著称。1925 年，当阿奇博尔德·格里姆凯辞去 NAACP 当地支部负责人职务时，衣着考究、意志坚定的托马斯成为一致推选的继任者。⁶⁴\n\
  \n托马斯体现了 20 世纪 20 年代弥漫在华盛顿黑人社区中的自信精神。和许多黑人邻居一样，他强烈感受到挑战城市种族主义的压力。正如霍华德大学教授凯利·米勒在\
  \ 1925 年所解释的那样：“国家首都的有色人种公民肩负着更重的责任，要时刻坚持种族的全部权利”，因为“这里发生的事情会被其他社区效仿。”抵制“种族侮辱和羞辱”是“华盛顿黑人对自己、对种族、对国家应尽的义务。”在整个\
  \ 20 年代，华盛顿黑人公开而有力地挑战了城市根深蒂固的种族主义，建立了强大的社区机构，灌输黑人自豪感，并削弱了白人至上的思想基础。⁶⁵\n\n\n\n\n\n\
  骚乱后的一两年里，华盛顿的黑人居民有理由对种族进步的潜力持谨慎乐观态度。当地白人报纸虽未对自己在煽动危机中所扮演的角色表示歉意，但确实对黑人社区进行了更积极的报道。1919\
  \ 年 12 月的一场集会上，城市表彰了黑人退伍军人，包括前总统西奥多·罗斯福在内的多位白人政要赞扬了他们在战争中的贡献。1920 年的总统选举也带来了一丝希望，因为备受憎恶的伍德罗·威尔逊在经历了八年种族动荡后离任。竞选期间，俄亥俄州共和党参议员沃伦·哈丁（据传有黑人血统）明确支持种族平等，并坚称非裔美国人“已经赢得了应得的全部公民权利”。⁶⁶\n\
  \n但谨慎的乐观很快让位于沮丧和愤怒，正如黑人经营的《华盛顿论坛报》所称的“弥漫首都的日益增长的南方情绪”。《论坛报》、当地全国有色人种协进会（NAACP）及其他黑人组织强烈反对哈丁总统及随后的共和党政府，他们非但没有废除威尔逊政府的种族隔离政策，反而加以巩固，切断了该党与黑人选民的历史联系。哈丁几乎未向黑人开放联邦就业机会，上任第一年仅任命了三名非裔美国人担任联邦职位。1922\
  \ 年复活节周日，哈丁的公共建筑与场地主管公然在岩溪公园的野餐区挂满“仅供白人”和“仅供有色人种”的标牌，NAACP 动员盟友迅速将其移除。⁶⁷\n\n黑人声音还谴责了\
  \ 1922 年 5 月林肯纪念堂落成典礼上对黑人访客的不光彩待遇。这座以希腊风格为灵感的大型圣殿建在国家广场西端填海造地上，后来成为自由的象征，是一座大理石纪念碑，纪念被称为“伟大解放者”的人及其所维护的联邦所秉持的平等主义理想。然而，在这个明媚的春日，纪念堂恰恰标志着美国在种族问题上倒退了多少。活动组织者强迫持票黑人坐在远离舞台的隔离区。许多愤怒的宾客在活动开始前就离场了。⁶⁸\n\
  \n在落成典礼上，聚集的政要们刻意回避林肯的解放遗产，反而颂扬内战后白人之间的地区和解。当天唯一的黑人演讲者是罗伯特·鲁萨·莫顿，他接替布克·T·华盛顿担任塔斯基吉学院院长。莫顿最初起草了一篇尖锐而愤怒的演讲，强调美国未能实现林肯广阔的解放愿景。但在林肯纪念堂委员会审查人员反对后，他发表了一篇温和的颂词，赞美国家的种族进步，这篇演讲“只有陈词滥调”，《华盛顿论坛报》哀叹道，“他未能把握住属于自己的机会，真正代表这个种族。”⁶⁹\n\
  \n尼瓦尔·托马斯将莫顿怯懦顺从的言论与亨利·海兰·加内特振奋人心的言辞相比。加内特在 1865 年 4 月向国会发表演讲，敦促美国“解放、教育、赋予非裔美国人选举权”。在解放之初，大胆的加内特以毫不掩饰的道德力量挑战国家，要求其在即将到来的充满希望的时代善待黑人公民。经过半个世纪的种族暴力和日益加剧的隔离，被驯服的莫顿只能说出安抚性的陈词滥调来抚慰白人听众的良心。自加内特站在国会面前以来，情况已发生巨大变化，而且并未好转。⁷⁰\n\
  \n林肯纪念堂落成典礼举行之际，三 K 党已重新成为全国性的政治力量。自 1870 年代消亡后，三 K 党于 1915 年在佐治亚州重生，并迅速成长为强大的组织，在全国各地（包括哥伦比亚特区）设有分支。华盛顿特区分部成立于\
  \ 1921 年，声称有数百名成员，并试图展现温和形象——甚至组建了一支棒球队。据“首都领域的大妖怪”称，当地三 K 党分部只是“警察局的志愿辅助机构”。然而，其通讯却抨击“傲慢无礼”的华盛顿黑人，称他们“觉得一旦跨过波托马克河进入联邦政府管辖范围，就可以放纵自由甚至放肆”。尽管当地分部从未非常活跃，但全国三\
  \ K 党在 1925 年和 1926 年两次展示了其力量：超过三万名来自全国的三 K 党成员身着全套服饰沿宾夕法尼亚大道游行，尽管 NAACP 以及当地犹太教和天主教组织提出了抗议。⁷¹\n\
  \n首都种族隔离的顽固性和可见性令尼瓦尔·托马斯和其他华盛顿黑人感到沮丧。在 1923 年为《信使》月刊（该刊积极宣传新黑人的目标）撰写的一篇文章中，托马斯表达了许多受过教育的黑人同辈的愤怒。“除了重建时期的几年，国家首都对黑人而言一直是悲伤之地，”托马斯写道，“黑人越有教养、越有抱负，羞辱他、阻碍他进步的乐趣就越大，而自世界大战以来，这种决心就更强了。”\n\
  \n然而，托马斯拒绝屈服于绝望。“白人用其数量优势、压迫精神和不公正的政治权力垄断，全力压迫这个受苦却美丽的小小奋斗世界，但我们却在这一切中成长得更加丰满。”许多成功的华盛顿黑人以\
  \ defiant 的自豪感回应国家的侮辱和地方的不平等。“我已经超过 25 年没在华盛顿的白人剧院看过戏了，”凯利·米勒在《非裔美国人报》中写道，“我知道我错过了很多。但有些价值，与其以牺牲自尊为代价获得，不如错过。有骨气的无知胜过奴性的智慧。”⁷²\n\
  \n尽管——部分原因正是——种族隔离的限制，随着 1920 年代城市经济繁荣，华盛顿的大部分黑人社区依然蓬勃发展。由于被排除在更广阔的白人社会之外，黑人企业家和社区领袖将精力投入到发展自给自足的社区和机构中，黑人企业和文化在此繁荣。华盛顿特区中上层黑人文化的中心是\
  \ U 街。以霍华德大学为东端，U 街走廊向西延伸十几个街区至第十六街。整个 U 街地区拥有超过 300 家黑人拥有的企业和组织，包括怀特劳酒店和工业储蓄银行，两者均由一位非凡的、未受过正规教育的黑人企业家约翰·怀特劳·刘易斯创立。作为霍华德教授、联邦雇员、教师及其他成功黑人专业人士的家园，该地区体现了黑人的奋斗和经济成就。它也被称为“黑人百老汇”，拥有众多剧院和音乐俱乐部，本地之子爱德华·肯尼迪“公爵”埃林顿在此崛起为爵士乐巨星。一位居民回忆说，U\
  \ 街是“你穿上盛装去的地方”。⁷³\n\n\n\n\nU 街也见证了黑人知识分子的繁荣。霍华德大学哲学教授、首位黑人罗德学者阿兰·洛克，是后来被称为“新黑人文艺复兴”的全国性文化运动背后的推动力量。尽管这场运动最常与纽约哈莱姆区联系在一起，但华盛顿的黑人居民也发挥了积极作用。洛克于\
  \ 1925 年出版的《新黑人》收录了 35 位作家、诗人和剧作家的作品，其中近一半曾在华盛顿生活或来自华盛顿。其中许多是女性，包括全国有色人种协进会（NAACP）主席阿奇博尔德·格里姆克的女儿安吉丽娜·格里姆克，她在阿姆斯特朗高中和邓巴高中任教，同时业余创作诗歌。格里姆克和其他黑人知识分子每周六晚上聚集在乔治亚·道格拉斯·约翰逊举办的“S\
  \ 街沙龙”。约翰逊白天是劳工部的官僚，晚上则是诗人和活动家。“周六夜客”们，连同霍华德剧社和众多黑人文学社团，在华盛顿特区的黑人知识分子中营造了一种同志情谊。⁷⁴\n\
  \nU 街的知识分子活跃氛围挑战了关于种族、阶级、性别和性取向的流行观念。小说家让·图默的肤色极浅、头发极直，以至于常被误认为是白人，甚至黑人邻居也如此，他质疑了种族这一概念本身。作为美国首位黑人州长（短暂任职）P.\
  \ B. S. 平奇巴克的孙子，图默住在勒德罗伊特公园，是华盛顿精英黑人阶层的产物。他毕业于 M 街高中和霍华德大学，经常参加乔治亚·道格拉斯·约翰逊家的周六夜聚会，同时创作他后来成为突破性小说《甘蔗》的作品，该书于\
  \ 1923 年出版。他自认是黑人，但对美国僵化的种族二元论感到不满。在《甘蔗》获得评论界赞誉后，图默拒绝被贴上“伟大的*黑人*作家”的标签，并提出了一种种族混合的愿景，这比他的时代超前了半个多世纪。⁷⁵\n\
  \n图默从未“冒充”白人，但一些浅肤色的非裔美国人确实这样做了，他们利用自己白皙的皮肤——以及白人对黑人社区内部肤色差异的无知——来享受白人的特权。冒充可以是一种对白人至上文化的隐秘抵抗，是对不公正种族分类制度的个人挑战。关于华盛顿黑人白天从事“白人”工作、晚上回到黑人家庭和社区的故事比比皆是。浅肤色的黑人顾客经常坐在当地剧院的白人区，这促使白人老板雇佣黑人“侦察员”，以识别并驱逐坐在“错误”区域的黑人顾客。对冒充的文化迷恋——以及这种种族流动性对美国二元种族结构构成的威胁——在\
  \ 20 世纪 20 年代达到顶峰，当时流行文学甚至电影都在探讨这一主题。⁷⁶\n\n冒充是一种充满风险和令人忧虑的现象。这是一种只有肤色最浅的人才能使用的策略，而这一群体在华盛顿黑人中已经享有特权。尽管它凸显了吉姆·克劳法的荒谬和种族分类的随意性，但冒充也挑战了黑人的自我认同，并削弱了精英黑人社区。19\
  \ 世纪末许多著名的混血华盛顿黑人——包括 O. S. B. 沃尔、理查德·格里纳和布兰奇·K. 布鲁斯——他们的子女或孙辈最终选择以白人的身份生活。冒充可能带来切实的好处，如获得更好的工作、住房和教育，但也伴随着沉重的代价，因为那些“冒充”的人常常感到与社区脱节，失去了自我认同。⁷⁷\n\
  \n另一位“周六夜客”、作家玛丽塔·邦纳，表达了新黑人时代许多黑人女性心中沸腾的独特愤怒。邦纳是波士顿人，拥有拉德克利夫学院的学位，1924 年她来到华盛顿，在阿姆斯特朗高中任教，并很快写了一篇使她跻身黑人知识分子圈的文章：《论年轻——身为女性——且有色人种》。这篇文章于\
  \ 1925 年发表在《危机》杂志上，探讨了邦纳对自己“被纠缠——被网住——被束缚在黑人聚居区的海藻中”的愤怒。当白人摩登女郎以短发、吸烟和轻浮行为打破文化禁忌时，邦纳对种族主义和性别歧视提出了严肃的批判。“你身体的每一部分都变得苦涩，”邦纳写道，“你渴望爆发，摧毁一切白色的东西。”黑人女性被期望安静地坐着，默默忍受虐待，但邦纳提供了一种颠覆性的转折。“你必须安静地坐着……像佛陀一样——他和我一样是棕色皮肤——完全自在，完全自信；一动不动，洞悉一切……然后，当时机成熟时，你可以一跃而起——以你全部的高度——一个手势之间。”⁷⁸\n\
  \n邦纳、图默和其他黑人知识分子也挑战了他们眼中华盛顿精英黑人阶层的浮夸、物质主义和“自鸣得意”。兰斯顿·休斯是一位有抱负的诗人，他是重建时期领袖约翰·默瑟·兰斯顿的侄孙，曾与母亲和其他亲戚在华盛顿住了一年。他对\
  \ U 街那些拘谨的奋斗者不以为然：“以前在任何地方，我从未见过如此有影响力的人——有些钱的男人、有些姿色的女人、有些学识的教师——如此明显地确信自己的重要性和在社区中的高位。”仅仅几个街区之外，他在西北第七街的工人阶级社区发现了一种更有活力、更令人兴奋的文化。“第七街总是挤满了深肤色的劳动人民，他们还没有获得‘文化’和舞台大使的举止，粉红色、黑色和黄色的人仍然毫无歉意地做朋友，”休斯写道。对这座城市“有教养”阶层的千篇一律感到失望的休斯、图默和其他黑人思想家逃离了这座城市，前往哈莱姆。⁷⁹\n\
  \n阶级、肤色和文化的分歧削弱了 1919 年骚乱中华盛顿黑人之间短暂存在的共同目标感。即使随着新黑人运动的发展，黑人自豪感高涨，华盛顿的精英黑人仍竭力将自己与工人阶级区分开来，浅肤色仍然是社会地位的标志。较富裕的华盛顿黑人上不同的学校——通常是大学预科性质的邓巴高中，而不是专注于工业培训的阿姆斯特朗高中。他们在不同的教堂祈祷——如第十五街长老会教堂这样优雅的会众，而不是喧闹的浸信会教堂。他们居住在不同的区域——勒德罗伊特公园和\
  \ U 街，而不是西南区、第七街或小巷（即使在 1925 年，仍有超过 10%的黑人人口住在小巷里）。⁸⁰\n\n\n\n品味精致而克制的黑人中产阶级和精英阶层，对他们眼中下层华盛顿黑人的狂热宗教信仰和挥霍无度的消费习惯嗤之以鼻。“黑人之间的偏见，与黑人和白人之间的偏见一样多，”深肤色、中产阶级黑人居民爱德华·费根斯回忆道。“如果你肤色浅、明亮，几乎像白人，那么即使不符合经济标准，也能融入这座城市的社会领域。”一位年长、浅肤色的黑人女性安娜·默里向采访者承认了这种歧视，解释道：“我想我们大多数人这样做是为了保护我们的孩子”免受下层阶级的负面影响。“华盛顿黑人中大众与阶层之间的社会鸿沟，比美国任何其他城市都更为显著，”霍华德大学的凯利·米勒声称。⁸¹\n\
  \n许多精英所鄙视的低收入黑人社区在 1920 年代也蓬勃发展。随着南方移民在十年间涌入华盛顿，该社区显著增长。到 1930 年，该市黑人人口超过 27%，绝大多数黑人居民是贫困或工人阶级。许多移民是女性，她们并非为了追求自己的梦想，而是为了履行家庭义务。她们与亲属同住，承担起家务责任——照顾儿童和老人、做饭、打扫、接洗衣物——以便其他家庭成员外出工作。随着时间的推移，她们也找到了有薪工作，通常是在白人家庭中做佣人。新来者饱受思乡之苦、无休止的工作日程，以及偶尔来自本地华盛顿黑人的居高临下态度，同时还要承受巨大的经济压力来供养家乡的家人。“一旦开始工作，你就知道田纳西州的人指望着你挣来的那些便士，”家政工人多莱西亚·奥蒂斯回忆道。“你绝不敢辞职！”⁸²\n\
  \n尽管面临工作和家庭的压力，黑人家政工人仍坚持维护自己的尊严和保护自身利益。她们利用自己“忠诚服务”的记录，向白人雇主争取更多福利，例如每年回南方家乡探亲，并抓住机会在霍华德剧院或第七街的俱乐部看一场演出。她们省吃俭用，以摆脱“住家”工作——即住在雇主家中，穿着让人感觉卑微的浆硬制服，与社区和教会隔绝。尽管这类工作有经济保障，但她们渴望“非住家”工作的自主权，这种工作能提供更灵活的工作时间和独立生活的机会。⁸³\n\
  \n工人阶级移民建立了重要的社区机构，以帮助自己在新的家园生存和发展。通常通过与南方各地社区有联系的本地教会，他们成立了“便士储蓄俱乐部”，提供小额贷款和礼物帮助有需要的成员；他们建立了“家庭小组”，为新来者举办聚餐；他们还保留了南方的文化和烹饪传统。“有家人、有教会，身边有来自家乡的人，”家政工人范妮·金回忆道，“这能帮助你安定下来、走上正轨，并让你有能力帮助……其他人。”这一时期为帮助移民适应城市生活而建立的许多社区机构，包括南卡罗来纳乔治城俱乐部，一直延续到\
  \ 21 世纪。⁸⁴\n\n### *“把有色人种赶出华盛顿”：限制性契约与推动种族隔离社区*\n\n无论社会或经济阶层如何，华盛顿黑人都难以找到体面的住房。被排除在新建郊区住宅开发项目之外的黑人居民在\
  \ 1920 年代越来越多地寻求在较老、以白人为主的社区购房，通常沿着西北区的 U 街、第十一街、乔治亚大道和佛罗里达大道等贸易和交通路线。随之而来的是一个不平衡、紧张且常常充满对抗的社区转型过程，这一过程将在未来几十年内在全市范围内重复上演。\n\
  \n在 1929 年由华盛顿跨种族委员会委托的一项开创性研究中，霍华德大学社会学家威廉·亨利·琼斯分析了社区如何从“白人”转变为“黑人”。琼斯认为，社区变化的根源在于富裕白人不愿居住在种族融合的地区。“拥有相当社会和经济地位的白人——即能够通过偏见和舆论维持社区种族团结的阶层——并不喜欢生活在文化异质的社区中，”他写道。一旦黑人开始迁入以白人为主的地区，有经济能力的白人居民便利用日益改善的交通条件，搬离市中心更远的地方，前往切维蔡斯、塔科马公园或其他种族隔离的郊区。他们的离开向那些不那么富裕的白人邻居发出信号：这个社区正在“衰落”。\n\
  \n在房地产经纪人、开发商和政策制定者（他们有意维护种族隔离社区）的影响下，许多白人居民认为黑人邻居会带来犯罪和衰败，从而降低房产价值。在一项关于白人态度的调查中，琼斯发现白人离开种族变迁的社区有多种原因，包括认为黑人“过于合群”且“对社区不利”。少数人认为黑人低人一等，但几乎同样多的人担心自己可能会“逐渐喜欢上黑人”。迄今为止，离开的最常见且最有力的解释是社会压力，即“对公众舆论和其他白人态度的恐惧”。他们离开家园，主要是因为认为如果不这样做，白人邻居会看不起他们。那些留在日益黑人化的社区中的人往往是穷人、老年人和外国出生者。⁸⁵\n\
  \n然而，一些白人居民拒绝搬走。相反，他们希望通过写入房契的种族限制性契约来强制种族团结，从而遏制黑人侵入的浪潮。这些契约由法院强制执行，是私人合同，白人产权人同意限制将其房产出售、出租或转让给种族和宗教少数群体。华盛顿自\
  \ 1854 年起就存在住房种族限制，当时该市第一个郊区联合镇（位于海军工厂对面的阿纳科斯蒂亚河对岸）专门为白人居民开发。但在 1917 年最高法院的一项裁决之后，限制性契约激增，该裁决禁止州和地方政府通过分区法令强制实施种族隔离，但并未涉及私人之间的排他性协议。随着\
  \ 1920 年代华盛顿特区及其他城市黑人人口增长并涌入传统白人区域，越来越多的白人居民转向种族限制性契约，以此保护其社区的种族特征。这些契约不仅禁止黑人居民，还常常明确排除犹太人、阿拉伯人、“波斯人”及其他群体。⁸⁶\n\
  \n\n\n\n限制性契约引发了许多法律问题，关于其合宪性的测试案例在华盛顿特区出现，由一位名叫海伦·柯蒂斯的华盛顿黑人女性触发。柯蒂斯是一位著名黑人眼科医生的妻子，她有能力在城市的任何地方购买房屋。像许多其他黑人购房者一样，她看中了白人社区的房屋，因为这些房屋往往更现代化、状况更好。她雇佣了一位白人房地产经纪人——否则她很可能只会被带去看明确划定的黑人区域的房屋——并选择了位于西北区\
  \ S 街 1727 号的一栋维护良好的三层联排别墅，这里大致介于杜邦环岛附近时尚的白人区域和蓬勃发展的黑人文化圣地 U 街之间。⁸⁷\n\n柯蒂斯并非个例。多年来，黑人房主一直沿着\
  \ S 街稳步向西迁移，到 1920 年，1400 和 1500 街区几乎已经没有白人家庭了。然而，在第十六街以西，S 街仍然主要是（尽管并非完全）白人社区——而\
  \ 1700 街区一群坚定的白人房主（共三十人）试图维持这种状况。这群人包括律师、政府官员和商人，他们签署了一项协议，承诺永远不会让自己的房产“被黑人、或任何属于黑人种族或血统的人使用、占用、出售、转让、租赁、出租或赠予”。该协议于\
  \ 1921 年 8 月提交，并通过 5 美元的费用加以巩固，旨在生效二十一年。⁸⁸\n\n然而，仅仅几个月后，该契约就被打破了，因为其中一位签署人艾琳·汉德·科里根接受了海伦·柯蒂斯购买其房屋的报价。面对愤怒的白人邻居，科里根声称自己不知道柯蒂斯是黑人，并试图反悔这笔交易。柯蒂斯坚持推进销售；科里根急于出售房产，最终同意了。一位白人邻居兼契约共同签署人杰克·巴克利起诉科里根违反契约。另一位邻居兼共同签署人詹姆斯·S·伊斯比·史密斯成为该案的首席律师。\n\
  \n初审法院和华盛顿特区上诉法院支持巴克利，并维持了限制性契约的合宪性，援引该市广泛使用的种族隔离法作为先例。在当地黑人团体的联盟支持下，全国有色人种协进会的律师向美国最高法院上诉，认为限制性契约将“把有色人种赶出华盛顿”。但最高法院拒绝审理此案，在\
  \ 1926 年的“科里根诉巴克利案”中宣布，它缺乏干预的管辖权，因为该限制性契约是私人之间有效的合同。⁸⁹\n\n这一毁灭性的先例为白人房主提供了法律许可，将黑人购房者挡在社区之外。在随后的几十年里，限制性契约在华盛顿特区乃至全国范围内盛行。在华盛顿，公民协会带头组织房主为其房产签署契约。在该判决后的几个月内，代表布卢明代尔地区的北国会公民协会说服了该社区几乎所有房主签署契约。潜在的黑人购房者面临诉讼威胁，如果契约被违反，该协会将承担随之而来的法律挑战的费用。芒特普莱森特公民协会成立了一个专门负责限制性契约的委员会，并雇佣了一名全职工作人员来收集签名并监控该地区的房产销售。三年内，契约覆盖了该社区约\
  \ 90%的区域。芒特普莱森特在二战前几乎全是白人。⁹⁰\n\n然而，具有讽刺意味的是，试图维持 S 街 1700 街区种族隔离的限制性契约最终被证明是无效的。尽管柯蒂斯和她的丈夫最终放弃了\
  \ S 街的房产（他们在几个街区外买了一处房子），但其他黑人搬进了该街区的其他地方。在柯蒂斯事件引发最初骚动几个月后，霍华德大学行政人员埃米特·杰伊·斯科特购买了仅隔三扇门的一处房屋。愤怒的白人邻居迅速寻求禁令阻止他搬入，但狡猾的斯科特在夜幕掩护下偷偷将家具搬了进去，并迅速安顿下来，从而造成了无法撤销的既成事实。在柯蒂斯案在法院审理期间，斯科特留在了该街区，其他黑人居民也随之而来。白人，包括该案的始作俑者杰克·巴克利，纷纷搬离。到\
  \ 1926 年最高法院对该案作出裁决时，该街区已大部分是黑人。⁹¹\n\nS 街 1700 街区发生的事证实了许多华盛顿白人的担忧：一旦种族隔离的围墙被打破，就无法阻止黑人潮水般的涌入。他们预见到整个城市都会重演勒德罗伊特公园的遭遇——那里在一代人的时间里，从富有的白人居民的专属飞地变成了一个全是黑人的社区。\n\
  \n但华盛顿的生活现实从未像“围墙”这个比喻所暗示的那样泾渭分明。华盛顿的种族隔离是不均衡且古怪的，是一套令人困惑的非正式习俗而非正式法律。黑人可以乘坐有轨电车、在公共图书馆阅读、在格里菲斯体育场观看华盛顿参议员队的比赛，但他们不能去听音乐会、不能在看电影时坐在白人旁边、也不能在国会大厦台阶上观看\
  \ 7 月 4 日的烟花表演。黑人购物者可以在加芬克尔百货和其他市中心的百货商店购物，但不能试穿任何东西。黑人遍布整个城市，即使在所谓的“白人”或“黑人”社区，白人和黑人家庭也常常多年比邻而居，甚至住在同一个街区。就连作为华盛顿黑人标志性街道的\
  \ U 街，也包含由白人经营的咖啡馆、冰淇淋店和商店，这些场所实行种族隔离。这些“规则”从未固定，不断受到挑战和重新定义。⁹²\n\n在种族隔离的背景下，跨种族关系是可能且确实存在的，尤其是在低收入地区，白人移民与黑人邻居比邻而居。尽管许多移民很快吸收了主流文化对非裔美国人的种族主义观点，但他们的贫困和物理上的接近意味着他们与黑人的互动远比高收入白人更频繁、更平等。他们也共享一种局外人的感觉。在\
  \ 20 世纪初的种族分类背景下，犹太人、希腊人和其他东欧移民不被视为完全“白人”，并遭受种族和宗教歧视。在西北区第八街和 L 街的圣索菲亚希腊东正教堂周围发展起来的小型希腊社区中，希腊企业主雇佣黑人工人，并在“Mavriko”（黑人）餐厅为黑人顾客提供服务，这些餐厅对黑人和希腊顾客都开放。⁹³\n\
  \n\n\n\n\n## 第九章\n\n## 华盛顿是觉醒的巨人\n\n### *在蓬勃发展的城市中组织社区，1932–1945*\n\n华盛顿的黑人在政府中没有发言权，在经济上受到限制，并且遭受的隔离几乎与他所鄙视的南方城市一样严格。他可能用寻欢作乐和虚假的自给自足来蒙蔽自己，也可能自豪地指出在重重困难下取得的成就。但正如过去并非没有荣耀，现在也并非没有苦涩。\n\
  \n——斯特林·A·布朗，公共事业振兴署 1937 年《华盛顿指南》\n\n朗斯顿台地住宅区是一个公共住房项目，其建筑之卓越足以入选《国家史迹名录》。该项目位于本宁路与东北区第二十一街交汇处附近，在\
  \ 20 世纪末因毒品相关暴力而被称为“小越南”。2001 年，华盛顿特区保护联盟将朗斯顿台地住宅区列为该市十大“最濒危遗址”之一，如今居民仍在与暴力和毒品作斗争。¹\n\
  \n然而，当它在 1938 年开放时，朗斯顿台地体现了新政的乐观精神。这个以重建时期黑人英雄约翰·默瑟·朗斯顿命名的 274 套公寓综合体，是该市第一个（也是全国第二个）由联邦政府资助的公共住房项目。它是联邦与地方合作的典范：资金由联邦公共工程管理局（PWA）提供，实施则由地方住房团体联盟——华盛顿住房委员会负责。该项目面向黑人租户，雇用了黑人劳工、熟练技工和建筑工程师。首席建筑师是希利亚德·罗宾逊，一位土生土长的华盛顿黑人，毕业于\
  \ M 街高中，参加过第一次世界大战，他从霍华德大学请假来设计该项目。²\n\n罗宾逊和他的团队创造了一个现代、邻里友好的景观，拥有大片的开放空间、便利的游乐场，以及散布在\
  \ 13 英亩园区内的庆祝性雕塑。中央庭院的建筑上装饰着《黑人的进步》——由雕塑家丹尼尔·奥尔尼创作的*赤陶*浮雕，描绘了非裔美国人在从奴隶制到自由的历史旅程中的鼓舞人心的场景。这座以国际风格设计的乌托邦社区承诺提供低于市场价的带中央供暖和电力的宽敞单元，是“一个中等收入家庭可以享受现代舒适生活的地方”，《非裔美国人报》声称。政府补贴的租金为每月\
  \ 6 美元（含水电费），“私营企业甚至无法指望与之竞争”，《星报》写道。³\n\n朗斯顿台地吸引了超过 2700 名感兴趣的黑人租户的咨询，其中大多数是收入微薄的工薪阶层，他们希望摆脱日益恶化的社区。PWA\
  \ 官员筛选申请人，寻找能确保项目成功的模范公民。该综合体的名额竞争激烈。一位申请者甚至附上了第一夫人埃莉诺·罗斯福的推荐信——结果仍被拒绝。申请者们强调自己体面的品行以及过上更好生活的愿望。“我们非常渴望在一个体面的社区里安顿下来，拥有一个美好的家，在那里我们可以成功抚养孩子，结交理想的朋友，”申请者默特尔·米德尔顿写道。1938\
  \ 年开放后，朗斯顿台地赢得了观察者和居民的一致赞誉，被称为“联邦政府最具吸引力的低成本住房项目之一”。⁴\n\n\n\n\n朗斯顿台地是华盛顿在大萧条时期留下的持久遗产。与一些观察者认为华盛顿特区“对萧条免疫”的看法相反，华盛顿市民与全国其他地区一样饱受苦难。该市超过\
  \ 18%的居民依靠紧急救济，而纽约和巴尔的摩的这一比例分别为 10%和 12.5%。街头随处可见乞讨者——“甚至白宫大门外，他们也在兜售生计，”一位记者写道。联邦雇员也感到压力，因为国会在\
  \ 1932 年将公务员薪资削减了 8%以上，次年又削减了 15%。⁵\n\n大萧条对黑人社区的打击尤为严重。该市失业人口中超过 75%是黑人，全市 13.2\
  \ 万黑人居民中超过一半领取联邦救济。家政工人（其中绝大多数是黑人女性）的月薪从 40 至 50 美元降至 30 至 35 美元。华盛顿拥有全国最糟糕的黑人婴儿死亡率，每\
  \ 1000 名活产婴儿中就有超过 115 名一岁以下黑人儿童死亡。“临时营地”在全市涌现，容纳了数百名无家可归的黑人，居住条件肮脏不堪，令人想起内战时期的“违禁品”营地。即使在莱德罗伊特公园的中产阶级黑人社区，入不敷出的房主也将他们的维多利亚式住宅改造成了公寓。“我察觉到这个曾经迷人的街区弥漫着一股潮湿腐朽的气息，”《华盛顿论坛报》的一位记者哀叹道。⁶\n\
  \n随着失业者试图发出自己的声音，华盛顿成为了全国抗议的地点。1932 年 6 月初，一群衣衫褴褛但意志坚定的第一次世界大战退伍军人——既有黑人也有白人——聚集在华盛顿，要求提前发放承诺的联邦补助金（被称为“奖金”）。这支贫困的“补助金大军”迅速膨胀至近\
  \ 2 万人，并在国会大厦视野内的阿纳科斯蒂亚河滩上建立了一个庞大的跨种族帐篷营地，同时在全市设立了二十多个较小的营地。在参议院否决了奖金法案后，约 6000\
  \ 名退伍军人在华盛顿滞留了一个半月以上，生活条件日益恶化，直到赫伯特·胡佛总统于 7 月底下令驱逐他们。由道格拉斯·麦克阿瑟将军率领（并由德怀特·D·艾森豪威尔少校协助）的\
  \ 500 多名士兵使用坦克、催泪瓦斯和武装营队清除了这些营地并将其烧毁。⁷\n\n胡佛对补助金大军的粗暴对待，帮助纽约民主党州长富兰克林·罗斯福在 1932\
  \ 年入主白宫。凭借迷人的微笑和坚定不移的乐观精神，这位魅力十足的罗斯福在竞选时承诺削减联邦开支并平衡预算。然而，上任后他推出了新政——一场史无前例的和平时期联邦权力扩张，政府在美国经济中承担了更大的角色。联邦官僚机构迅速膨胀，涌现出数十个新的联邦机构。1933\
  \ 年至 1935 年间，华盛顿的联邦雇员人数从 6.3 万跃升至 9.3 万；到 1940 年，达到了 16.6 万。当其他城市地区萎缩时，华盛顿特区的人口增长了三分之一以上，到\
  \ 1940 年超过 66.3 万人——比十二个州的人口还多。这一增长主要来自该市的黑人人口，在 1930 年代增长了 40%以上。⁸\n\n首都因新人口和新能量而蓬勃发展。“新政使首都变成了一个繁荣的城镇，”记者大卫·科恩在《大西洋月刊》上写道。由工程进度管理局管理的大型公共工程项目雇佣了数千名工人，并改变了市中心的景观，涌现出一批新的联邦建筑，包括最高法院大楼、联邦贸易委员会大楼和庞大的农业部总部。⁹\n\
  \n随着城市在新政和第二次世界大战期间蓬勃发展，新一代黑人活动家及其盟友崛起，挑战吉姆·克劳制度，寻找体面住房，并为经济生存而斗争。“黑人，”全国有色人种协进会律师查尔斯·汉密尔顿·休斯顿写道，“试图占据他作为美国公民应有的位置，不带任何形容词、连字符或限定词。”他们使用了新的抗议形式，包括抵制、工会组织和静坐，并与华盛顿及全国范围内越来越多的白人建立了跨种族联盟，这些白人认为国家首都的种族不平等是美国声誉上的污点。“今天的华盛顿是争取黑人平等新运动的中心，”一位《纽约时报》记者在\
  \ 1943 年写道，“它就像一个实验室，正在尝试一些推进黑人地位的具体方法。”这种实验在当时产生了喜忧参半的结果，但 1930 年代和 1940 年代的社区行动主义和跨种族组织为战后的民权运动奠定了基础。¹⁰\n\
  \n### *“公共危险与公害”：清除小巷与推动可负担低收入住房*\n\n约翰·伊尔德自认为是黑人社区的盟友。伊尔德于 1876 年出生在巴尔的摩一艘停泊的德国船上，他是废奴主义者的骄傲后裔，并在进步时代的高潮期长大。从康奈尔大学毕业后，他以记者的身份开始了职业生涯，效仿揭黑记者雅各布·里斯。他被自己报道的住房问题所吸引，离开新闻界成为了一名住房活动家，尽管他保留了记者对冲突和争议的热情。¹¹\n\
  \n伊尔德于 1920 年搬到华盛顿，在美国商会工作。在匹兹堡短暂停留后，他于 1933 年返回，帮助成立了华盛顿住房协会，这是一个致力于开发低收入住房的组织。到那时，这位终身的进步共和党人已经相信，仅靠私人住房倡议无法满足穷人的迫切需求，他期待即将上任的民主党总统富兰克林·罗斯福将公共资源引入他毕生的事业。凭借杏仁状的蓝眼睛和顽皮的笑容，好斗但乐观的伊尔德成为了接下来二十年华盛顿住房改革的面孔。¹²\n\
  \n伊尔德代表了 1930 年代华盛顿改革的新精神，中上层改革者创建了跨种族的社会服务组织来解决公共问题。他们建立了一个地方性的“社区公益金”，负责组织慈善捐赠。到\
  \ 1931 年，它每年筹集超过 200 万美元，分配给当地组织。与伊尔德一样，社区公益金负责人埃尔伍德·斯特里特认为，任何社会服务工作都应涵盖整个城市，在接受这份工作之前，他坚持要求该组织的努力包括对黑人社区的外展服务。由霍华德大学黑人教授凯利·米勒担任副主席，社区公益金资助了各种专门在黑人社区工作的团体，包括由跨种族理事会管理的定居点。¹³\n\
  \n\n\n\n\n住房或许是这座城市最棘手的问题，它交织着种族、贫困以及城市政治上的无力。无论是新来者还是长期居民，都在这座租金高昂、空置房源稀少的城市里艰难寻找体面的住所。大片住宅开发区——从乔治城沿波托马克河开始，延伸至城市北部，穿过坦利镇、切维蔡斯、塔科马公园和布鲁克兰——基本上对黑人居民关闭。即使在黑人社区，黑人租户也要支付比白人租户更高的租金。大萧条期间收入下降，但由于需求强劲，租金依然居高不下，常常消耗掉一个家庭一半以上的收入。许多人被迫在能找的地方安身，挤进小巷住宅或与亲戚同住，给社区、学校和社会服务带来了越来越大的压力。一项对北国会大厦附近区域的调查发现，大多数房屋“屋顶漏水、地板翘曲、窗户破损、门关不上”。“很大比例的建筑物……老旧破败，年久失修，许多情况下几乎不适合人类居住。”¹⁴\n\
  \n对于约翰·伊尔德和其他住房改革者来说，小巷住宅的持续存在尤其令人恼火。在 1914 年《小巷住宅法》通过二十年后，这些顽强的小巷社区依然存在，变得越来越贫困和隔离。许多中产阶级住房改革者将物质匮乏与道德缺陷联系起来。“小巷代表了华盛顿最贫穷、最无能的区域，滋生了该市很大比例的犯罪、贫困、疾病、不道德行为和高婴儿死亡率，”黑人社会学家威廉·亨利·琼斯在\
  \ 1929 年的一项研究中写道。琼斯继续说道，小巷是“某种倒退的黑人文化的核心”，已成为“一类无法或不愿达到白人文化标准的人的栖息地”。琼斯对黑人下层阶级文化缺陷的强调——在现代人听来如此刺耳——是\
  \ 20 世纪 30 年代许多改革努力的基础。住房改革者坚信，用伊尔德的话说，“有了不同类型的住宅，人们的性格将会改变。”¹⁵\n\n琼斯的研究重新点燃了消除小巷住宅的斗争。该研究发表后不久，伊尔德呼吁联邦政府出台新的禁令，禁止小巷住宅，在接下来的几年里，这项努力得到了公民组织、城市规划者和报纸编辑的支持。新政加速了这一运动。埃莉诺·罗斯福虽然拒绝参与第一夫人巡视华盛顿贫民窟的惯例，但鼓励住房改革者推动一项新法案。主要由伊尔德本人起草的《小巷住宅法》于\
  \ 1934 年通过。¹⁶\n\n该法案承诺改变该市的低收入住房状况。它不仅旨在消除小巷住宅，还旨在为以前的小巷居民提供公共住房资金——这对联邦政府来说是一个根本性的转变，因为联邦政府（除了第一次世界大战期间为战争工人建造宿舍的临时努力外）从未涉足住房市场。该法案设立了小巷住宅管理局（ADA），这是一个联邦机构，拥有当地权力，可以判定建筑物不合格、驱逐租户并建造新单元。国会任命伊尔德领导这个新机构。尽管国会只拨给\
  \ ADA 50 万美元资金——最初的法案要求 300 万美元——但一向乐观的伊尔德自信地认为，该机构将在短短十年内实现消除华盛顿所有小巷住宅的雄心勃勃的目标。¹⁷\n\
  \n![Image](img/f0001-14.jpg)\n\n*“华盛顿的盲巷”。住房改革者试图根除小巷社区，他们认为这些社区是罪恶和不道德的温床。尽管从 19\
  \ 世纪 90 年代开始进行了数十年的改革努力，但直到 20 世纪中期，小巷社区仍然是华盛顿城市景观中一个独特的组成部分。周一晚俱乐部，《华盛顿特区有人居住的小巷名录》。*\n\
  \n清除小巷的目标得到了广泛支持，但对于贫民窟拆除后如何处理小巷居民，却没有达成共识。对于伊尔德和其他改革者来说，答案是公共住房。伊尔德指出，私营部门未能满足低收入居民的需求，他认为\
  \ ADA 应该采取一项雄心勃勃的住房建设议程。他拒绝在确保流离失所的居民获得替代住房之前拆除任何房屋，并推动国会——最终未能成功——拨出足够的资金，为所有以前的小巷居民提供公共住房。¹⁸\n\
  \n但在一个日益隔离的城市里，公共住房极具争议。例如，ADA 1937 年计划替换西北部雾谷社区一条臭名昭著的小巷，就引发了强烈反对。ADA 拆除了九十多间小巷住宅，并在第二十四街的圣玛丽法院建造了一座现代化的两层、二十四单元公寓楼。伊尔德和\
  \ ADA 最初计划让黑人居民入住新住宅，但白人开发商和居民表示反对。“黑人入住会阻碍发展，”他们抱怨道。“向有色人种租户开放新公寓将导致该地区黑人人口永久化”，他们担心这会导致房产价值下降和白人迁往其他社区。来自林肯公民协会的黑人居民则发起自己的抗议，并争取到华盛顿住房协会等全市性白人组织的支持。他们的抗议帮助说服了\
  \ ADA 允许黑人居民入住新公寓。¹⁹\n\n伊尔德对公共住房的承诺以及他重新安置流离失所居民的真诚努力，在国会遭到了尖锐批评，尤其是来自众议院和参议院哥伦比亚特区委员会的南方成员。哥伦比亚特区委员会长期以来一直是国会议员最不想要的职位之一，到\
  \ 20 世纪 30 年代，它已成为南方种族隔离主义者的避风港，他们担心国家首都出现渐进式的融合。这些民主党人来自一党制的南方，那里黑人选民被剥夺了选举权，他们是新政联盟的关键组成部分，他们利用自己的职位阻挠他们担心会破坏华盛顿种族隔离的改革。\n\
  \n众议院哥伦比亚特区拨款小组委员会主席是罗斯·柯林斯，一位密西西比州的律师，他在军事武器上挥霍金钱，却扼杀了特区改革努力的资金。在社区基金会发布了一份题为“第一城市——最差城市”的华盛顿贫民窟调查报告后，市政官员呼吁国会拨款\
  \ 320 万美元用于帮助穷人的项目。柯林斯冷静地将其削减到 90 万美元。当当时负责该市公共福利部的埃尔伍德·斯特里特要求他增加对南妮·海伦·伯罗斯全国女子培训学校贫困黑人女孩的资助时，柯林斯拒绝了。“我的选民不会容忍把那么多钱花在黑鬼身上，”他解释道。国会的反对确保了住房改革者永远没有足够的资金来实现伊尔德将流离失所居民安置在公共住房单元中的目标。²⁰\n\
  \n\n\n\n\n美国残疾人法案（ADA）也引发了私人住宅建筑商和商业团体的反对，他们指责政府对住房市场的“社会主义式”干预造成了与私人利益的不公平竞争。为了证明市场力量能更好地解决城市住房危机，华盛顿卫生改善公司（Washington\
  \ Sanitary Improvement Company）和华盛顿卫生住房公司（Washington Sanitary Housing Company）等私营企业启动了新的低收入住房项目。由于不愿承担向不受欢迎的租户出租房屋的财务风险，这些私营住房公司转而将目标锁定在低收入白人群体以及他们所谓的“更优秀阶层的有色人种租户”上。在\
  \ 1934 年至 1939 年间，这两家公司大张旗鼓地为低收入居民建造了 1034 套住房。然而，在这座城市中，成千上万的低收入居民急需住房，私营住房开发商无法满足需求，这恰恰凸显了问题的严重性。²¹\n\
  \n美国残疾人法案（ADA）在黑人社区内部也招致了批评。很多时候，那些生活受住房改革影响最深的黑人被排除在决策过程之外。黑人社区对清除小巷的看法并非铁板一块——许多中产阶级黑人领袖认为小巷令人难堪，且不利于争取种族平等，而小巷居民自己则常常捍卫他们居住的紧密社区。然而，人们普遍担心清除小巷会导致流离失所。\n\
  \n很少有华盛顿黑人相信白人住房改革者真正为他们着想。伊尔德（Ihlder）或许致力于为前小巷居民寻找体面的住所，但其他城市规划者却想将小巷改造成可用于商业开发的空间。前总统的孙子、国家首都公园与规划委员会（National\
  \ Capital Parks and Planning Commission）负责人尤利西斯·S·格兰特三世（Ulysses S. Grant III）认为小巷是“公共危险和公害”。他设想将联合车站附近的一条小巷改造成“为（附近）酒店客人服务的茶花园，以及供他们停车的车库空间”。尽管伊尔德做出了承诺，但格兰特的想法更接近现实。正如《星报》（Star）在\
  \ 1937 年底报道的那样，ADA 的大多数小巷清除项目并未为流离失所的居民提供新住房。相反，官员们通常将这些土地用于公园或车库。²²\n\n林肯公民协会（Lincoln\
  \ Civic Association）负责人爱德华·哈里斯（Edward Harris）一直是 ADA 的眼中钉，他曾帮助为黑人居民保留了圣玛丽法院（St.\
  \ Mary's Court）。哈里斯表达了对清除小巷导致流离失所的日益增长的担忧。在圣玛丽法院之争后的几年里，他不断挑战伊尔德和 ADA，要求他们兑现承诺。哈里斯坚持认为，贫民窟清除不应涉及“驱赶、隔离和剥夺黑人的家园”。他和他的盟友指责\
  \ ADA“通过拆除住宅、分散且不重新安置前租户来忽视人类居住”，并破坏了“有色人种公民的信任和信心”。²³\n\n哈里斯还担心联邦开发项目导致的流离失所，因为政府正在吞并住宅区作为其新政扩张的一部分。在哈里斯所在的雾谷（Foggy\
  \ Bottom）社区，政府计划为战争部和海军部建造新总部，这将导致三百个家庭流离失所。城市项目对低收入和少数族裔社区也产生了类似的破坏性影响。1929 年，市政专员们为了建造新的市政中心，将华盛顿特区最大的华人聚居区连根拔起，结果却因税收萎缩和国会削减联邦拨款而放弃该项目，将该区域改造成公园。尽管白人商业界反对，大约六百名华人居民搬到了西北\
  \ H 街，介于第六街和第七街之间，在那里建立了 21 世纪众所周知的唐人街（见第 14 章）。²⁴\n\n在公开会议、国会证词以及写给富兰克林·罗斯福和埃莉诺·罗斯福的信件中，哈里斯始终指出一个令人不安的事实：ADA\
  \ 从未拥有足够的资金或权力来建造规模足以应对流离失所挑战的公共住房单元。随着黑人居民——受到限制性契约的阻碍、当地白人领导层和政府官员的压力，以及贷款机构的劝阻——逐渐放弃雷诺堡（Fort\
  \ Reno）、乔治城（Georgetown）和其他如今以白人为主的地区的长期社区，这种担忧与日俱增。²⁵\n\n### *“我们将征用你的财产”：雷诺堡、乔治城与黑人社区的消失*\n\
  \n西北部上区的雷诺堡是联邦支持的地方开发如何使穷人流离失所并加剧城市住房问题的一个典型例子。雷诺堡在内战期间由联邦军队建造，吸引了“逃亡者”，他们形成了一个虽小但繁荣的战后黑人社区的核心。雷诺堡的黑人居民被包围在人口稀少、以白人为主的坦纳利镇（Tennallytown）地区，远离拥挤的小巷，享有充足的空地、种植蔬菜和养鸡的土地，以及一所热闹的学校。华盛顿精英们长期以来认为该地区过于多山且远离市中心，但\
  \ 20 世纪初的白人开发商受到切维蔡斯（Chevy Chase）、塔科马公园（Takoma Park）和其他偏远郊区成功开发的启发，觊觎坦纳利镇的山顶景观和“乡村空气”。²⁶\n\
  \n随着农田转变为独栋住宅，白人开发商和顺从的地方官员盯上了雷诺堡周围的土地，计划为白人儿童建造公园和学校以提高房产价值。唯一的障碍是雷诺堡的黑人社区。于是，在地方和联邦官员的支持下，白人开发商开始着手驱逐黑人居民。首先，他们买下了堡垒附近的土地，“目的是阻止进一步建造供有色人种居住的房屋”，开发商哈罗德·E·多伊尔（Harold\
  \ E. Doyle）多年后解释道。下一步是驱逐长期土地所有者。尽管切维蔡斯土地公司（Chevy Chase Land Company）“尝试了所有可能的方法来赶走这些有色人种”，据一位白人观察者称，黑人房主拒绝出售。随后，房地产公司和地方公民协会向联邦政府施压，要求其通过新成立的国家首都公园与规划委员会购买该地产。²⁷\n\
  \n该委员会行使了征用权，并向土地所有者支付了最低限度的补偿，同时购买了雷诺堡周围的土地，用于建造爱丽丝·迪尔初中（Alice Deal Junior High\
  \ School，1930 年开学）和伍德罗·威尔逊高中（Woodrow Wilson High School，1935 年开学）。如今，这两所学校坐落在一片占地\
  \ 45 英亩的翠绿宝地中，周围是价值百万美元的住宅。“他们只给了一点点钱，就那么一点点钱，”雷诺堡的黑人居民玛丽·丹尼尔（Mary Daniel）回忆道，“要么接受，要么我们就征用你的财产。”在驱逐过程中，开发商拆除了数十栋房屋和三座教堂，不可挽回地撕裂了雷诺堡黑人社区的社会结构。到\
  \ 1940 年，该地区几乎没有黑人家庭留下。被迫放弃他们唯一熟悉的家园，这些流离失所的家庭——其中一些已在雷诺堡生活了半个多世纪——不得不到别处寻找出租房，往往是在那些他们没有家庭纽带或邻里联系的地方。²⁸\n\
  \n\n\n\n\n在雷诺堡发生的事件并非孤例。它是更大规模迁移模式的一部分，这种模式始于 20 世纪 20 年代，并在 30 年代和 40 年代随着住房隔离的固化而愈演愈烈。类似的情况也发生在乔治城，当地开发与私人社区的“复兴”努力相结合，给低收入居民施加了巨大压力，迫使他们离开居住数十年的区域。\n\
  \n到 20 世纪初，乔治城已走向衰落。波托马克河的淤塞毁掉了港口。C&O 运河从未像其支持者承诺的那样成为经济引擎，在 1924 年一场毁灭性洪水后彻底关闭。肮脏的住宅和破败的建筑遍布该地区。从\
  \ 20 世纪 20 年代开始，以住在 P 街 2811 号的约翰·伊尔德为首的一群白人居民，成立了颇具影响力的“乔治城公民协会房主委员会”，发起了一场修复行动，旨在恢复该社区联邦风格住宅的原貌。雄心勃勃的白人居民——有时带着投机目的——翻新旧宅，成立历史学会，并将复兴列为他们的首要议程。²⁹\n\
  \n20 世纪 30 年代，乔治城成为年轻的新政支持者和联邦精英成员的热门居住地。到 40 年代，一位观察者指出，乔治城已成为“一个古雅、历史悠久、适合白人居住的理想之地”。聚集在\
  \ C&O 运河以南、波托马克河与岩溪之间的低收入居民（主要是黑人）无力翻新他们破败的房屋，也付不起迅速上涨的租金，并且被当地贷款机构拒绝贷款。随着时间的推移，他们逃往城市其他地区。到了\
  \ 21 世纪，乔治城仍然是华盛顿最白人和最富裕的地区之一。³⁰\n\n无论是公共还是私人住房开发项目，往往都会导致低收入居民流离失所，并加剧居住隔离，因为这些项目是在一个日益强化的、成文隔离制度的更大背景下建造的。到\
  \ 20 世纪 30 年代，种族限制性契约已成为全市白人社区的常态，并日益蔓延到周边的马里兰州蒙哥马利县、弗吉尼亚州费尔法克斯县和阿灵顿县郊区，这些地区长期存在的农村黑人社区在白人迁入面前逐渐萎缩。随着坦纳利镇-雷诺堡、乔治城和雾谷等社区变得更为富裕和白人化，黑人居民被限制在他们已经占主导地位的区域内，即便成千上万的南方移民仍在不断抵达。由于黑人人口的出路越来越少，黑人社区变得越来越贫困和拥挤。华盛顿呈现出一种将在\
  \ 20 世纪剩余时间里成为其标志的格局：一个日益贫困的黑人内城，被几乎全是白人的社区和郊区所环绕。³¹\n\n20 世纪 30 年代的中产阶级白人改革者，虽然真诚地致力于改善特区穷人的恶劣居住条件，但通常并未触及城市根本的种族或经济不平等问题。他们没有反对限制性契约，没有推动融合性公共住房开发，也没有努力结束政府和工会中的种族隔离。相反，他们找到了在隔离制度内运作而非挑战它的方式，常常容忍甚至鼓励许多华盛顿黑人认为不可接受的做法。\n\
  \n在 ADA，伊尔德雇佣了一名黑人住房助理查尔斯·弗拉格，但他有时会在实行种族隔离的场所安排 ADA 员工静修，干脆不让弗拉格参加。社区基金会主任埃尔伍德·斯特里特没有雇佣任何黑人雇员，并定期在隔离设施中举办活动。“如果雇佣黑人雇员，会出现太多麻烦，”一位在\
  \ 20 世纪 30 年代末担任该组织预算委员会成员的白人官员解释道。“黑鬼（指黑人）比不上白人，”他接着说，“他们迟钝且缺乏智慧。”³²\n\n由于这种态度在许多白人精英中根深蒂固，即使伊尔德、斯特里特或其他白人改革者有意挑战种族隔离，也会极其困难。他们成功筹集资金建造低收入住房、提供娱乐机会或以其他方式改善黑人穷人的生活条件，依赖于他们说服有钱人——华盛顿富人和国会特区委员会成员——的能力，让他们相信这些改革是合理的而非激进的。他们必须向财务上的主子们保证，他们的努力不会打破隔离的生活平衡。因此，ADA\
  \ 拒绝支持违背主流种族人口结构的住房项目。\n\n伊尔德相信，在一个令人沮丧且受限的政治环境中，他已经尽力而为，并对黑人社区的批评感到恼火。他认为，黑人批评者要求他和\
  \ ADA 为融合性公共住房而斗争，是要求得太多。“在哥伦比亚特区和国会，压倒性的意见强烈反对这一点，如果 ADA 采取这样的政策，它会毁掉自己。”相反，他提议“在黑人目前居住的区域为黑人建造住房”，但他的批评者“说与其这样，不如维持现状。”伊尔德的人道主义精神使他反对简单地“让这些人……一直等到白人意见能够接受黑人作为隔壁邻居。”³³\n\
  \n但令伊尔德懊恼的是，他看到越来越多的华盛顿黑人——以及日益增多的激进白人盟友——不再满足于从隔离餐桌上掉落的慈善面包屑。伊尔德承认，他们“只有一个愿望：完全的种族平等。”而且他们不打算等待白人改革者来赐予他们。³⁴\n\
  \n### *“不在不能工作的地方购物”：新黑人联盟与跨种族基层组织的挑战*\n\n约翰·奥布里·戴维斯是伍德罗·威尔逊时代华盛顿的孩子。戴维斯出生于 1912\
  \ 年，即威尔逊首次当选总统的那一年，在华盛顿雄心勃勃的黑人中产阶级社区“奋斗者街”长大，该区域位于杜邦环岛东北方向的第十六街与第十九街之间，是霍华德大学黑人教授、企业主和联邦职员的聚居地。戴维斯的父亲曾在政府印刷局工作，但他前途光明的职业生涯因威尔逊总统的种族隔离政策而受阻（见第\
  \ 8 章）。这段经历让老戴维斯愤愤不平，他在孩子们心中培养了一种愤怒感，并带他们参加全国有色人种协进会的集会，包括约翰年仅九岁时的一次反私刑游行。³⁵\n\n\
  在邓巴高中，约翰·戴维斯从全国有色人种协进会负责人内瓦尔·托马斯那里学习了历史和抗议活动，并在马萨诸塞州的威廉姆斯学院学习写作，在那里他获得了美国大学优等生荣誉学会的荣誉并以最优等成绩毕业。由于肤色极浅、眼睛颜色很淡，他曾在弗吉尼亚州被赶出一列“有色人种专用”火车，因为列车员以为他是白人。戴维斯后来获得了政治学博士学位，并在全国有色人种协进会为“布朗诉教育委员会案”的研究团队工作。戴维斯是新一代地方活动家中的一员，他们将采用新策略、寻找新盟友，在国家的首都为平等而战。³⁶\n\
  \n\n\n\n\n1933 年，受他后来所称的“青春与种族反抗的双重自信”驱使，戴维斯从大学返乡，决心改善黑人工人的经济前景。他向全国有色人种协进会（NAACP）华盛顿分会提出一个想法：对黑人社区中歧视性企业进行系统性抵制，但分会领导拒绝了他的计划，担心对抗性策略会招致白人的经济报复。1930\
  \ 年尼瓦尔·托马斯去世后，该组织变得保守且自满；内部争吵和地盘争夺导致全国办事处于 1937 年撤销了华盛顿分会的章程，这对这个在 1910 年代和 1920\
  \ 年代曾是 NAACP 最强大的地方分会而言，是一次令人难堪的训斥。尽管两年后章程得以恢复，但 NAACP 在华盛顿民权斗争中发挥重要作用，还要再等十年。³⁷\n\
  \n戴维斯并未气馁，他独自实施了这一想法。1933 年 8 月 28 日，他带领一小队纠察员在西北 U 街 1211 号的汉堡烧烤店前游行，抗议解雇三名黑人员工。这次抗议催生了新黑人联盟，该联盟试图利用黑人的购买力，为黑人工人争取更多经济机会。戴维斯招募了其他年轻的大学毕业生，以及他回忆中的“街角的小伙子们”，希望建立一个跨阶级的组织。与北方城市中其他“不在你能工作的地方购物”运动类似，该联盟通过私下谈判、公开抗议和经济抵制，迫使雇主在非体力岗位上雇用黑人员工。他们瞄准了黑人社区中迎合黑人顾客的企业，这些企业更容易受到消费者压力。³⁸\n\
  \n汉堡烧烤店的抗议立即取得了成功——两天内，被解雇的黑人员工就恢复了工作。1933 年底，该联盟又迅速取得两场重要胜利，说服《晚星报》和 A&P 连锁杂货店雇用更多黑人员工。该组织早期的成功赢得了黑人媒体和黑人牧师的赞扬与宣传，到\
  \ 1934 年初，它已拥有约一千名来自黑人社区的成员，其中包括后来成为该市首位黑人市长的沃尔特·华盛顿。其纠察线上出现了教育家玛丽·丘奇·特雷尔、罗斯福政府官员玛丽·麦克劳德·贝休恩以及其他知名黑人华盛顿居民。全国顶尖的黑人法律人才，包括\
  \ NAACP 的查尔斯·汉密尔顿·休斯顿及其门徒瑟古德·马歇尔，为联盟律师提供无偿援助。到 1938 年，该组织声称已为黑人工人争取到五千多个非体力岗位。³⁹\n\
  \n该联盟引发了白人雇主和顾客的强烈反对，他们憎恨联盟的纠察线，这些纠察线扰乱了目标商店外的人流。“如果他们想要有色人种的店员，为什么不自己开一家店？”人民药店的一名白人员工抱怨道，该药店拒绝接受联盟的要求。白人顾客有时会团结在目标商店周围。正如一位研究者所指出的，关于在西北第十四街和\
  \ U 街的人民药店举行的抗议：“自从有色人种站在店前，白人顾客反而增加了。”⁴⁰\n\n联盟的激进策略使其陷入诉讼。该组织在 1934 年和 1935 年的大部分时间里试图对抗两项针对抵制的禁令，但均未成功。然而，第三起案件上诉至最高法院，并成为该联盟最持久的遗产。此案涉及卫生杂货公司，这是一家在华盛顿拥有数十家门店的特拉华州连锁企业。1936\
  \ 年 4 月，卫生公司在西北第十一街和 U 街附近开设了一家门店，距离联盟总部仅几个街区。该公司拒绝雇用黑人店员，促使联盟派出一名孤身纠察员，举着写有“尽你的一份力！在你能够工作的地方购物！这里没有雇用黑人！”的广告牌在附近巡逻。卫生公司起诉后，联盟律师辩称，非暴力纠察和抵制是受保护的言论自由形式。最高法院以\
  \ 6 比 2 的多数票裁定联盟胜诉，认为“和平有序地传播”关于劳资纠纷的信息是合法的，即使是由未直接卷入纠纷的个人或团体进行。⁴¹\n\n尽管如今鲜为人知，但最高法院\
  \ 1938 年 3 月对“新黑人联盟诉卫生杂货公司”案的裁决对全国社会运动的进程产生了深远影响。短期内，它鼓励了“不在你能工作的地方购物”运动在全国范围内的蔓延，并为联盟在与当地企业的斗争中提供了有力武器。一年之内，西北\
  \ U 街和第七街商业走廊沿线的几乎所有企业都同意了联盟的要求。部分由于该案带来的负面宣传，卫生杂货公司更名为“西夫韦”，但在接下来的多年里，尽管联盟持续示威，其招聘做法仍然顽固地带有歧视性。⁴²\n\
  \n从长远来看，“新黑人联盟”案的裁决是所有类型抗议者的分水岭胜利。它保护了将抵制和纠察作为抗议策略的使用，为工会、民权团体以及其他试图利用消费者力量作为对抗企业杠杆的活动人士提供了最高法院的认可。\n\
  \n联盟保护黑人工人的努力遭到了黑人知识分子和劳工运动内部的意识形态反对。对于霍华德大学教授亚伯拉姆·哈里斯等一些激进的黑人思想家来说，联盟促进黑人雇用的策略有可能破坏工人之间基于阶级的跨种族联盟。他们认为，所有“为黑人争取工作”的努力只会激起白人的报复，并在工人需要跨越种族界限团结起来的时候分裂工人阶级。⁴³\n\
  \n通常与共产党或社会党有联系的激进劳工组织者也拒绝采用针对特定种族的策略，而是专注于建立工人的跨种族联盟。这些政党规模不大且颇具争议，但“共产党”和“社会党”这两个词在当时并非后来冷战时期那种会终结职业生涯的贬义词。在共和党和民主党都讨好白人至上主义者的时代，这些政党挑战种族歧视。华盛顿的许多激进活动人士与产业工会联合会（CIO）合作或在其内部工作，该联合会成立于\
  \ 1935 年，旨在挑战实行种族隔离的美国劳工联合会（AFL）。CIO 致力于组织特定行业内的所有工人，拥抱跨种族工会主义，为黑人工人创造了前所未有的集体谈判和担任领导角色的机会。尽管华盛顿没有庞大的工业基础，但\
  \ CIO 在该市活跃，试图在私营企业和联邦政府中跨越种族界限组织工人。\n\n跨种族组织极其困难，部分原因是体力劳动仍然非正式地分为“白人”和“黑人”工作。黑人工人通常被分配到最脏、最卑微、报酬最低的工作；白人雇主常常声称黑人工人根本不适合技术性工作，以此为由为就业歧视辩护。当被问及为何卡弗里茨建筑公司不雇用黑人木匠时，该公司的簿记员解释道：“要成为木匠，必须聪明，有一定程度的训练和想象力。不是每个人都能做木工活。”⁴⁴\n\
  \n\n\n\n随着大萧条日益加深，越来越多的白人工人愿意接受任何能找到的工作，常常取代了他们的黑人同行。1938 年，一万名女性（其中 90%是黑人）排队领取联邦政府提供的两千个清洁工岗位的申请表。当警察帮助排在队伍末尾的白人女性优先拿到申请表，而让那些整夜排队的黑人女性继续等待时，一场混战爆发了。白人女性可以沿着经济阶梯向下移动，去从事清洁工的工作；然而，黑人劳动者却无法反向流动。白人工人实际上垄断了薪酬更高、技术性更强的工作。到十年末，该市超过\
  \ 98%的锅炉工、电车司机、售票员、机械师和电话线路工都是白人男性，而超过 97%的速记员、电话接线员和文员都是白人女性。⁴⁵\n\n白人工人小心翼翼地守护着自己的福利，一贯反对与非裔美国人一起工作。隶属于美国劳工联合会（AFL）的地方工会几乎一致地将黑人工人排除在外，使他们难以找到工作或为改善工作条件进行谈判。种族问题也成了企业主破坏工会组织的便利手段。“雇主似乎会告诉黑鬼们，加入工会有什么用，因为一旦他们加入，白人就会把他们踢出去，”面包销售员工会的一位白人官员解释道。“而对白人，他们会说，为什么要跟那些黑鬼打交道，只要你们等一等，我们就会把他们全部赶走，换上白人。”⁴⁶\n\
  \n并非只有白人工人或企业主害怕跨种族工会。黑人工人也同样心存疑虑，担心与白人同行联手会危及自己的工作。安妮·斯坦（Annie Stein）是美国劳工联合会餐馆联盟的白人组织者，她在黑人工人中遇到了对工会的强烈抵制。他们不仅担心来自白人同事的歧视，还“担心如果拿到同样的工资，他们的工作就会被白人取代，”斯坦说。“有色人种知道，他们之所以能保住工作，唯一的原因就是他们愿意接受更低的工资。”⁴⁷\n\
  \n尽管存在这些障碍，工会组织者还是在 20 世纪 30 年代通过运用简单的经济逻辑在华盛顿特区取得了进展。正如面包销售员工会官员所说：“一个白人砌砖工一天挣\
  \ 12 美元，而一个黑鬼一天只挣 6 美元。结果就是黑鬼们压低了白人的价格，他们彼此竞争，结果两败俱伤。”他认为，白人工人将黑人同行排除在外，最终只会伤害自己。“试图压制黑鬼是没用的，因为这只会让我们其余的人也一起被压制。”⁴⁸\n\
  \n隶属于产业工会联合会（CIO）的美国联邦工人联合会（UFWA）在 1937 年发起组织联邦工人的运动时，将跨种族组织作为明确目标。与代表联邦工人的另外两个工会不同，UFWA\
  \ 积极招募黑人工人，并挑战联邦政府内部种族隔离的惯例。罗斯福总统任命了几位引人注目的黑人官员，例如玛丽·麦克劳德·贝休恩（Mary McLeod Bethune）担任国家青年管理局局长，罗伯特·C·韦弗（Robert\
  \ C. Weaver）担任内政部黑人事务顾问，但他的政府并未废除行政机构内部种族隔离的招聘做法。随着新政的实施，出现了大量新的招聘机会，但有抱负的黑人求职者往往未能受益。例如，新的公共工程管理局（Civil\
  \ Works Administration）收到了 4500 份白人求职者的申请，雇用了 2000 人（录用率 44%）；它收到了 2600 份黑人的申请，却只雇用了\
  \ 115 人（录用率 4%）。⁴⁹\n\nUFWA 的领导者是埃莉诺·纳尔逊（Eleanor Nelson），她是来自缅因州的一位美国众议员的女儿，身材瘦小，皮肤白皙。1932\
  \ 年“补偿金远征军”游行者的遭遇使她变得激进，随后她加入了共产党。在纳尔逊的领导下，该工会为所有工人的集体谈判权而斗争，并拒绝在实行种族隔离的场所举行会议或社交活动。非裔美国人担任\
  \ UFWA 的官员，代表工会出席公共活动，并管理着许多工会分支机构。该市最大的黑人工会是隶属于 UFWA 的联合自助餐厅工人地方产业工会第 471 号，由奥利弗·帕尔默（Oliver\
  \ Palmer）领导，他是一位说话温和的黑人南卡罗来纳州人，在财政部以每小时 25 美分的工资清洗餐具。UFWA 的共产主义倾向限制了其吸引力，并最终导致其在\
  \ 20 世纪 40 年代衰落，但在一段短暂时期内，该工会在为联邦工人争取集体谈判权方面取得了适度进展。⁵⁰\n\n在联邦政府之外，劳工活动家们努力改善体力劳动者的工作条件，尤其是在洗衣行业。洗衣业在华盛顿特区是一门大生意——当地有个笑话：“白领城市是洗衣工的好地方。”CIO\
  \ 成立了一个地方洗衣工人工会，帮助洗衣工人争取缩短工时、提高工资，并在闷热的工作中获得更多休息时间。⁵¹\n\n伊内兹·罗伯逊（Inez Robertson）是当地工会的兼职组织者，她\
  \ 14 岁开始在一家洗衣店工作，20 多岁时于 1937 年加入工会。她被管理层蔑称为“那些 CIO 的黑鬼之一”，她试图组织位于西北佛蒙特大道 1010 号的\
  \ Arcade 洗衣店中工资最低的工人（其中大多数是黑人），她曾在那里工作了七年。Arcade 的老板哈里·瓦伊纳（Harry Viner）支付给公司 150\
  \ 名工人每小时 20 到 25 美分的行业标准工资，但他经常在下午 4:30 就给他们打卡下班，不管他们是否真的离开工作。“如果有哪个女孩敢抱怨，就会被解雇，”罗伯逊解释道。“她们都太害怕了，什么都不敢做。”工会从\
  \ 1937 年开始在 Arcade 发起了一系列罢工，最终在 1941 年达到高潮。尽管瓦伊纳在《星报》和其他报纸上刊登了整版广告呼吁公众支持，但工人们还是赢了——他们的工资提高到每小时\
  \ 25 到 30 美分，每周工作 48 小时。⁵²\n\n洗衣工人工会、UFWA 以及其他隶属于 CIO 的工会或许没有彻底改变华盛顿的工作条件，但它们展示了即使在看似严格的种族隔离时期，跨种族组织仍然具有潜力。工会运动扩大了愿意为种族平等而奋斗的白人盟友群体，并在活动家之间建立了全国性的跨种族网络。白人工会组织者挑战了所有白人都支持种族隔离的观念，他们中的许多人——最著名的是安妮·斯坦——在华盛顿战后的民权运动中变得活跃起来。\n\
  \n\n\n\n工会与华盛顿活跃的激进民权组织结盟，特别是全国黑人大会（NNC）。该组织于 1935 年在霍华德大学成立——当时霍华德大学在其首位黑人校长莫迪凯·约翰逊的领导下正经历一场行动主义复兴——NNC\
  \ 是一个全国性组织，致力于建立由激进劳工、宗教和公民组织组成的联盟，以打击种族歧视，尤其是在工作场所。卧铺车厢搬运工兄弟会直言不讳的社会主义领袖 A. 菲利普·伦道夫担任主席。尽管\
  \ NNC 的大部分工作集中在芝加哥、纽约和其他工业城市，但其领导人认为华盛顿委员会至关重要，因为他们相信国家首都的种族关系为全美国的种族斗争定下了基调。与 UFWA\
  \ 和其他左翼组织一样，NNC 最终在冷战政治的暗礁上搁浅，但在成立后的十年里，它一直是该市最引人注目、最有效的民权组织之一。⁵³\n\nNNC 在华盛顿的首要任务是警察暴力，这个问题在黑人社区中引起了深刻共鸣。除了\
  \ 1919 年的骚乱，该区几乎没有经历过困扰其他南方社区的白人暴民暴力，但华盛顿的黑人居民却不成比例地遭受执法官员的“合法”暴力。重建时期，华盛顿的警察队伍曾招募大量黑人。然而，在\
  \ 1878 年剥夺选举权后，警察队伍几乎变成了全白人。1933 年，每 153 名华盛顿白人居民对应一名白人警察或消防员，而每 2047 名黑人居民才对应一名黑人警察或消防员。⁵⁴\n\
  \n该区警察因粗暴对待黑人居民（尤其是穷人）而臭名昭著。华盛顿黑人经常忍受辱骂性语言、无端搜查和武力，甚至在例行调查中也是如此。“黑鬼没有宪法权利，”一名警察在一次突袭中咆哮道，当时他辱骂了一名黑人妇女，将她母亲推倒在地，并在没有搜查令的情况下翻遍了她的家。“宪法是由白人制定并为白人服务的。”NNC\
  \ 的一项研究发现，在 20 世纪 20 年代末和 30 年代初，当地警察平均每年杀害四名黑人男性。黑人报刊也定期报道华盛顿特区警察对黑人女性过度使用武力的案件，经常展示受伤和被打得青肿的受害者照片。⁵⁵\n\
  \n华盛顿特区警察肆意使用暴力的效果类似于南方其他地区的私刑：它强化了种族从属制度，并阻止黑人挑战他们在社会中的“地位”。黑人居民，尤其是低收入地区的居民，开始对“约翰法律”几乎像对“吉姆·克劳”一样恐惧。尽管黑人目击者、记者和公民团体强烈反对，但施暴者很少受到官方制裁，虐待行为仍在继续。正如一位沮丧的\
  \ NNC 活动家所写：“如果你是一个有色人种妇女，凌晨五点钟坐在自己家里，一个重约三百磅的警长把警棍戳到你的肚子上，骂你是该死的黑鬼，你对此毫无办法。”⁵⁶\n\
  \nNNC 发起了一场有力且协调一致的运动，旨在结束国家首都的警察暴力。在全国秘书约翰·P·戴维斯的领导下，1936 年，当地 NNC 活动家开始调查警察，并公开警察虐待黑人居民的恶劣案例。他们与教会、工会、公民团体以及新黑人联盟等民权组织合作，动员社区成员，向政治领袖和市政官员施加基层压力。认识到该区在政治上的无力，他们还培养了国会中的支持者，并推动他们调查华盛顿特区警察局。⁵⁷\n\
  \n1938 年夏天，在警察杀害了一名患有精神疾病的第一次世界大战黑人退伍军人勒罗伊·基斯后，NNC 的努力汇聚在一起。NNC 抓住基斯死后社区的愤怒情绪，组织了一个广泛的组织联盟，从共产党到温和的跨种族委员会，共同抗议这起杀戮。在七月的一次游行中，两千名抗议者（其中约四百人是白人）计划为过去十年中每名警察暴力受害者抬棺。警察禁止抬棺，但举着标语的游行者高呼“停止合法私刑！”，而一万名群众沿街围观。“暴力危机即将来临，”林肯公理会黑人牧师罗伯特·W·布鲁克斯牧师写道。“该区守法公民还要容忍这些穿制服的刺客继续恐吓公众多久？”⁵⁸\n\
  \nNNC 收集了两万四千个签名，向罗斯福总统请愿，要求解雇警察局长、停职五名警官、为受害者家属提供养老金，并成立一个平民审查委员会。“由于不受约束且未受惩罚的警察暴力，我们的生命、家园和自由每天都变得更加不安全，”请愿书写道。这场反警察暴力运动被证明非常成功，至少在短期内如此。在\
  \ 1939 年 6 月的一次群众集会上，NNC 华盛顿委员会“庆祝了一年来城市生活风平浪静，没有警察觉得有必要通过砍倒无辜公民来自卫，”活动家约翰·洛弗尔在《危机》杂志上报道。通过继续举行游行、群众集会和媒体宣传活动来保持压力，活动家们在两年后取得了重要胜利：令人憎恨的警察局长欧内斯特·布朗下台。他的继任者爱德华·凯利被证明对黑人社区的要求更加顺从，并且在四年内将警队中的黑人警官数量增加了两倍。⁵⁹\n\
  \n与新黑人联盟的抵制运动和产联的跨种族工会组织一样，全国黑人大会反对警察暴力的运动表明，新型社区组织可以产生重要成果。但纠察和抗议无法替代政治权力。华盛顿黑人仍然难以保护自己的利益，因为他们缺乏让公职人员负责并确保他们解决黑人不满的权力。“当华盛顿居民获得选举权时，黑人第二天就会获得民权，”美国劳工部黑人官员维克多·戴利在《危机》杂志上写道。“这就是首都人民现在不投票的原因之一。”然而，争取华盛顿特区投票权的运动本身也面临着重重困难。⁶⁰\n\
  \n### *“小巷将主宰大道”：种族与华盛顿特区争取选举权的斗争*\n\n在 20 世纪最初几十年，一场新的选举权运动在要求特区投票权方面变得越来越激进，与全国范围内争取妇女选举权的运动并行。1878\
  \ 年剥夺选举权后，恢复投票权的努力曾将黑人活动家与许多仍然致力于激进重建平等目标的白人共和党人和劳工领袖团结在一起。然而，到了 20 世纪 20 年代和 30\
  \ 年代，争取投票权的斗争，就像华盛顿生活中的许多方面一样，已经沿着种族和经济界限两极分化。\n\n\n\n\n选举权运动之所以获得支持，部分原因在于联邦政府未能履行其财政义务。19\
  \ 世纪 70 年代达成的剥夺选举权协议很简单：作为放弃选举权要求的交换，华盛顿特区居民获得了联邦政府承担该市年度预算一半的保障。“对半开”计划在当地领导人中变得神圣不可侵犯。对失去联邦资助的担忧，使得此前恢复选举权的努力功亏一篑。\n\
  \n然而，节俭的国会议员很快开始重新考虑“对半开”计划，并于 1921 年彻底放弃了它。到 1937 年，联邦政府承担的该市预算比例已不足 15%，这激怒了当地领导人，并引发了一场威胁该市偿付能力的财政危机。在《华盛顿邮报》记者梅洛·普西对特区政府的七部分系列揭露中，他描述了一个“被束缚的民主”，背负着“权力分散、国会漠不关心和财政不确定性”的重担。结果，地方官员难以达到基本的公共卫生标准、提供足够的学校或保障城市安全。选举权支持者认为，如果华盛顿特区在国会中有代表，那么该市就能获得稳定的资金，并防止对特区事务的不当干预。⁶¹\n\
  \n选举权运动的主要推动者是《晚星报》的白人编辑西奥多·诺伊斯。诺伊斯是土生土长的华盛顿人，拥有哥伦比亚学院（后更名为乔治华盛顿大学）的本科和法学学位，1908\
  \ 年从其父克罗斯比·诺伊斯手中继承了《星报》的编辑职位，并花费数十年倡导特区的发展和美化。诺伊斯坚信，保护特区经济和政治利益的最佳方式是在国会中拥有一位有投票权的代表。他认为，特区居民是“有缺陷且违法的美国人”，在他们能够为自己的代表投票之前，该市只能指望国会微薄的支持。1917\
  \ 年，他协助成立了“哥伦比亚特区全国代表公民联合委员会”，该委员会在接下来的二十年里推动了选举权运动。⁶²\n\n在《星报》和其他白人报纸的正面报道下，选举权运动获得了主要白人组织的支持，包括贸易委员会、“无投票权”妇女选民联盟和公民协会联合会。1938\
  \ 年 4 月举行的一次非正式公投吸引了近十万选民，结果显示对地方选举权（88%）和全国代表权（93%）的支持率均极高。华盛顿特区的黑人居民甚至更加支持——《华盛顿邮报》的一项民调显示，95%的黑人受访者支持选举权，而白人的这一比例为\
  \ 80%。⁶³\n\n在特区居民自治（当地称为“地方自治”）问题上，种族分歧进一步扩大。华盛顿特区的黑人居民普遍支持全国代表权和地方自治，但更重视后者。黑人布卢明代尔公民协会的沃尔特·A·平奇巴克在\
  \ 1938 年作证时表示，“特区每一位公正的公民都希望拥有”全国代表权的特权，但“国会是否最好建立某种形式的地方政府，让公民能够选择直接对他们负责的官员？”⁶⁴\n\
  \n大多数白人选民也支持地方自治，但西奥多·诺伊斯、贸易委员会和其他白人精英坚决反对。他们认为，地方自治会导致黑人控制，正如他们认为在重建时期发生的那样。黑人选民会支持大幅增加开支、累积债务并征收更高的税，所有这些都会损害商业、降低房产价值，并鼓励富人离开华盛顿。该市存在“肤色问题”，十英里广场俱乐部的格罗弗·艾尔斯在\
  \ 1938 年的《邮报》上写道。“过去，政客们利用有色人种的选票，就像他们打算在国会今天授予特区任何选举权时所做的那样。”十六街高地公民协会的约翰·特纳告诉国会，“黑人主导”将毁掉这座城市，因此“全国代表权是应对特区混合人口最安全的做法。”⁶⁵\n\
  \n持续的种族担忧导致《邮报》的梅洛·普西认为选举权本质上不切实际且不可取。普西认为，由于许多白人居民选择通过邮寄方式在自己的家乡州投票，权力平衡将由黑人选民掌握。“在国家首都刺激种族政治并非令人愉快的景象。”更悲观的评估来自白人居民和社区刺头克林顿·霍华德，他是内战将军\
  \ O·O·霍华德的侄孙。在 1943 年的一次国会听证会上，霍华德警告说，如果华盛顿特区被授予选举权，该市将被“弱势群体、文盲、无产阶级……小巷将主宰大道。”⁶⁶\n\
  \n西奥多·诺伊斯承认，黑人政治权力的幽灵削弱了精英阶层为华盛顿特区赢得国会代表的努力：“我们很难让这届国会区分全国代表权和黑人在地方选举中的主导地位。”二战前，没有任何选举权法案在国会通过。该市持续的剥夺选举权削弱了其活动人士社区——无论是选举权支持者、工会组织者、种族平等倡导者还是其他人——让决策者关注他们关切的能力。生活在国家首都使他们的地方斗争与权力殿堂近在咫尺，但他们通常未能引起多少全国性的关注或同情。对于民权活动家来说，这种情况在\
  \ 1939 年初开始改变，当时围绕黑人歌剧演唱家玛丽安·安德森的一场争议将媒体聚光灯投向了国家首都的种族隔离。⁶⁷\n\n### *“民主的污点”：华盛顿特区的种族歧视引发全国关注*\n\
  \n安德森，或许是当时最杰出的黑人艺术家，受邀在华盛顿演出，作为霍华德大学赞助的年度系列音乐会的一部分。音乐会组织者希望她在宪法大厅演唱，这是一座位于西北 D\
  \ 街、紧邻白宫前椭圆广场的壮观四千座礼堂。宪法大厅由美国革命女儿会（DAR）拥有，于 1929 年开放，是该市最大的演出场所。它也是实行种族隔离的。黑人观众可以参加活动，但必须坐在“仅限有色人种”区域，而\
  \ DAR 禁止黑人表演者登台。⁶⁸\n\n安德森音乐会的策划者知道“仅限白人艺术家”的政策，但希望这位歌手的声望和成就（以及门票售罄的前景）能说服 DAR 重新考虑。管理\
  \ DAR 的女性们既不为所动，也不感兴趣；她们拒绝了请求。安德森的团队随后向该市学校董事会请求允许在白人中央高中演出，该校拥有一个两千座的礼堂。在学监弗兰克·巴卢的建议下，董事会拒绝了这一请求。\n\
  \n\n\n\n\nDAR 的决定，加上学校董事会的拒绝，引发了一场非同寻常的、跨种族的强烈反对。“禁止玛丽安·安德森……是一声响彻全国的警钟，”维克多·戴利在《危机》杂志上写道，“它就像一颗火花，点燃了整个城市。”⁶⁹\
  \ 尽管华盛顿的普通黑人长期以来一直受到警察的虐待，被挤在过度拥挤的社区和学校里，并因该市的南方习俗而蒙受羞辱，但安德森被冷落一事触动了敏感的神经，尤其是在黑人精英阶层中。这似乎再次发出警告：无论一个黑人能取得多大的成就，她或他在国家首都仍会被视为二等公民。\n\
  \n当地黑人领袖与显眼且直言不讳的白人盟友一起，抓住“安德森事件”作为契机，将全国的注意力引向该市的种族关系状况。他们成立了玛丽安·安德森公民委员会（MACC），由\
  \ NAACP 律师、前学校董事会成员查尔斯·汉密尔顿·休斯顿担任主席。在 90 个当地团体的网络支持下，MACC 协调了一场有效的基层运动，包括请愿、致当地报纸编辑的信件、致地方和联邦官员的电报，以及吸引多达\
  \ 1500 人（其中约三分之一是白人）的跨种族群众集会。公民压力迫使学校董事会重新考虑其决定，但董事会重申了其种族隔离政策，并同意只有在“这一让步不会被视为先例”的情况下才允许安德森演出。音乐会组织者和\
  \ MACC 拒绝接受这样的条件。⁷⁰\n\n基层工作与幕后争取同情国会议员和联邦政府官员支持的努力并行，其中包括内政部长哈罗德·伊克斯（他曾担任芝加哥 NAACP\
  \ 主席）和第一夫人埃莉诺·罗斯福（DAR 的名义成员）。伊克斯立即支持了这一运动。罗斯福最初不愿公开介入，担心这可能损害事业——到 1939 年，由于她一贯支持融合，她已成为白人保守派批评的避雷针。但在\
  \ 2 月下旬，她公开退出了 DAR，推动了为安德森在华盛顿寻找演出场所的努力。⁷¹\n\n随着复活节周日的临近，MACC 成员围绕一个大胆的想法团结起来：在林肯纪念堂的台阶上举办一场音乐会。伊克斯部长喜欢这个计划，并获得了罗斯福总统的批准。不到两周后，七万五千名跨种族人群冒着狂风，聆听安德森演唱了令人惊艳的《我的祖国，是你》以及几首灵歌。这一事件帮助重新定义了林肯纪念堂的意义和林肯本人的遗产，将该地点转变为黑人抗议的空间；它不仅是纪念维护联邦的人的纪念碑，也成为了伟大解放者、国家种族良知的纪念碑。⁷²\n\
  \nMACC 成员对可能性感到几乎眩晕。“华盛顿是一个被唤醒的巨人，”兴奋的约翰·洛弗尔写道。玛丽·麦克劳德·贝休恩认为这场音乐会是突破性的时刻：“通过玛丽安·安德森抗议音乐会，我们胜利地进入了美国生活的民主精神。”在华盛顿黑人活动日益活跃的十年之后，贝休恩、洛弗尔和其他当地领袖希望安德森音乐会能帮助推动制度变革，打破黑人就业、住房和教育方面的障碍。⁷³\n\
  \n一些观察家称赞安德森音乐会是国家首都长期争取种族平等斗争的转折点，但实质性、持久的长期变革需要的不仅仅是在国家广场上举办一场高调的音乐会。跨种族人群为美国理想而团结的形象很快褪色。音乐会之后，“黑人仍然无法进入剧院，使用中央高中或宪法大厅，或行使他们作为美国公民的权利，”《新黑人意见》的编辑写道。“成千上万黑人压抑的情绪在倒影池上悄然释放，然后社会政策和种族偏见的紧身衣又迅速被系紧并重新生效。”⁷⁴\
  \ 这场音乐会是一个非凡的跨种族团结时刻，是一次象征性的胜利，提振了华盛顿黑人及其盟友的精神，但几乎没有带来实质性的改变。\n\n尽管当地 MACC 努力利用媒体关注，推动在国家首都结束所有种族隔离，但随着全国的注意力迅速转向欧洲酝酿的战争，势头消散了。随着阿道夫·希特勒的德国军队横扫欧洲大陆，富兰克林·罗斯福总统呼吁美国成为“民主的兵工厂”。联邦政府和联邦资助的国防工业开始疯狂招聘，国家首都急剧扩张。甚至在美国于\
  \ 1941 年 12 月正式参战之前，华盛顿就有超过 20 万联邦工作人员，大约是第一次世界大战期间峰值数字的两倍。大都市区的人口很快飙升至超过一百万。随着这支“新的波托马克军团”出现在街头，华盛顿变成了“西方世界的战时首都，一个急切、拥挤的大都市”，詹姆斯·赖斯顿在\
  \ 1941 年 6 月的《纽约时报杂志》上写道。⁷⁵\n\n黑人新移民是涌入这座城市的人群之一，这是美国历史上最大规模内部移民的一部分。受农业困境和种族暴力的推动，以及经济机会的吸引，数十万黑人和白人在\
  \ 1940 年代离开了南方农村。他们中的大多数人最终去了芝加哥和纽约等工业城市，但许多黑人移民，特别是来自弗吉尼亚和卡罗来纳州的，前往华盛顿。该市的黑人人口在\
  \ 1940 年代激增了近 50%，达到 28 万以上。到 1950 年，黑人占总人口的 35%，是该市历史上最高的比例。⁷⁶\n\n当他们到达华盛顿时，黑人工人常常难以找到工作。市政府经常将黑人求职者拒之门外——例如，在市监狱、济贫院或国家少年培训学校的\
  \ 500 多名工人中，找不到一个黑人——而黑人工人在联邦就业方面也面临重大障碍。尽管有中立的招聘协议，一些机构负责人和联邦承包商，特别是在国防工业中，找到了歧视黑人申请者和雇员的方法。卧铺车搬运工兄弟会领袖\
  \ A. 菲利普·伦道夫和其他黑人劳工及民权组织者与罗斯福政府官员会面，抗议这种就业歧视，但无济于事。因此，“作为绝望的人民未能取得决定性结果的最后手段，”伦道夫写道，他和他的盟友发起了“向华盛顿进军运动”，计划在\
  \ 1941 年 7 月带领数万名黑人沿着宪法大道游行到林肯纪念堂。⁷⁷\n\n\n\n\n由于担心种族暴力和负面舆论，罗斯福总统匆忙签署了第 8802 号行政命令，禁止国防工业基于“种族、信仰、肤色或民族血统”的歧视。该命令还设立了公平就业实践委员会（FEPC），负责裁决工作场所歧视的申诉。伦道夫取消了游行，并宣称这是一次惊人的胜利，证明了压力政治的力量。霍华德大学法学院学生兼活动家保利·默里写道，这一事件表明，罗斯福和其他许多政客一样，“除非有组织的怨恨和压力使得他不采取行动就会成为全国性的尴尬，否则他将继续对黑人问题漠不关心。”⁷⁸\n\
  \n随着联邦保护措施的到位，黑人联邦雇员数量显著增加。到 1944 年，城市联盟报告称，华盛顿特区的黑人联邦工作人员达到 41,566 人，而战前不足 10,000\
  \ 人。大约 9%的联邦工作人员是黑人。然而，黑人工人仍然被限制在最低薪的工作岗位上——1942 年的一项调查显示，超过 60%的黑人联邦工作人员从事清洁工作，只有\
  \ 2.3%的人担任高级职位。⁷⁹\n\n尽管伦道夫威胁要召集的群众从未真正降临华盛顿，但迫在眉睫的战争将国家首都推向了令人不安的聚光灯下。华盛顿是“民主的污点”，奥尔登·史蒂文斯在\
  \ 1941 年 12 月刊登于《哈珀杂志》的一篇尖锐文章中写道。“华盛顿这个首都，是民主和美国的象征。而华盛顿这座城市，却象征着几乎所有真诚而有思想的人都知道的民主和美国的问题。”史蒂文斯面向全国读者，揭露了这座城市在应对战争工人大量涌入方面准备不足，但他最尖锐的批评留给了华盛顿的种族实践。“在这个宣称人人生而平等的国家首都，三分之一的居民被禁止进入主要商业区的剧院和餐馆，在求职中受到有效阻碍，通常要为同等条件的住所支付比另外三分之二居民高出两到三倍的租金，并且因为他们不喜欢这样而遭到仇恨和恐惧，”史蒂文斯写道。“华盛顿结合了北方和南方最糟糕的特征。”⁸⁰\n\
  \n史蒂文斯的文章发表后不久，日本战机袭击了夏威夷珍珠港的美国海军设施，美国立即加入了后来被称为第二次世界大战的战争。罗斯福总统在 1941 年的国情咨文中曾表示，这是一场捍卫和平世界所依赖的“四大自由”的战争：言论自由、信仰自由、免于匮乏的自由和免于恐惧的自由。正如一代人之前的第一次世界大战一样，这第二次世界大战将为首都的种族活动打开机会之门。\n\
  \n### *“你支持‘*希特勒*之路’还是‘*美国*之路’？”：战时首都的激进主义*\n\n朱厄尔·克劳福德·马齐克是战时黑人爱国主义的代表。她出生于佐治亚州，拥有克里克、切罗基和黑人的混合血统，1935\
  \ 年毕业于斯佩尔曼学院，随后搬到华盛顿在霍华德大学攻读研究生。她嫁给了一名霍华德医学院的学生，并在获得硕士学位后打了两份工来供丈夫完成学业。她还帮助抚养了三个侄女，她们住在西北区加利福尼亚街\
  \ 1861 号的家中，就在斯特莱弗斯街区的北边，那里是新黑人联盟的约翰·奥布里·戴维斯长大的地方。\n\n马齐克在二战期间曾短暂担任“政府女孩”，在国会图书馆做档案管理员。她是一位性格强烈的女性，将激进的政治思想与保守的个人习惯结合在一起。1943\
  \ 年，她辞去政府职务，成为一名工会组织者、社区活动家和女权主义先驱。她对精英黑人华盛顿的社交生活兴趣不大，尽管她的教育、收入和婚姻使她有权享受这些。相反，她全身心投入政治行动，经常出现在纠察线、群众集会和国会听证会上。⁸¹\n\
  \n马齐克身材苗条、容貌迷人，笑容上镜。1942 年，她被战争信息办公室（OWI）选为“一天的生活”大型照片集的主角，该照片集旨在突出美国黑人在战争中的贡献，以增强对战争的支持。她意识到这个项目的政治含义，同意被拍照，因为她希望曝光能帮助改善黑人在联邦政府中的就业前景。这些宣传照片于\
  \ 1943 年分发给全国各地的新闻机构（其中一张出现在 OWI 的小册子《黑人与战争》中），照片中衣着得体的马齐克与白人同事聊天，在图书馆书库中勤奋工作，在工会集会上分发传单，在红十字会献血活动中捐献血浆，在拥挤的电车上安静地坐在一位白人妇女旁边，向教会成员讲述黑人为战争所做的努力，并给她可爱的侄女们读书。她看起来就像是爱国、中产阶级美国黑人的典范。⁸²\n\
  \n![Image](img/f0001-15.jpg)\n\n*“国会图书馆工作人员朱厄尔·马齐克。”战争信息办公室跟随朱厄尔·马齐克拍摄了二战期间黑人爱国主义的“一天的生活”写照。图中，马齐克在华盛顿电车上与一位白人妇女并排乘车回家。国会图书馆。*\n\
  \n正如马齐克所知，她的经历并非黑人华盛顿或甚至黑人联邦工作人员的典型。另一个 OWI 摄影项目，由黑人摄影师戈登·帕克斯拍摄，对华盛顿的黑人生活进行了更为严酷的描绘。出生于堪萨斯的帕克斯在珍珠港事件后不久抵达华盛顿，开始他在农业安全管理局的奖学金。他对在新家遇到的歧视感到愤怒和幻灭，决心用他的相机“向世界展示华盛顿特区这座伟大城市的真实面貌”。⁸³\n\
  \n帕克斯将镜头对准了联邦政府的清洁工埃拉·沃森。沃森的父亲被南方私刑暴徒杀害，她从未获得高中文凭，靠微薄的工资艰难养家。如果说马齐克代表了黑人华盛顿的成就，那么沃森则象征着它的绝望和持续缺乏机会——帕克斯令人难忘的《美国哥特式，华盛顿特区》照片戏剧性地展现了这一点，照片中沃森手持拖把和扫帚，哀怨地站在一面被照亮的美国国旗前。也许不足为奇，OWI\
  \ 并没有广泛传播沃森的照片。⁸⁴\n\n马齐克和沃森截然不同的形象揭示了华盛顿在种族问题上的敏感和经常引发争议的表现，当时美国正准备并参与另一场世界大战。联邦官员和宣传人员认识到首都的种族偏见是一场公关噩梦，他们大肆宣扬马齐克和其他成功黑人展现的忠诚、繁荣和融合的生活，同时淡化沃森及其低收入同龄人所面临的贫困和偏见。当工程进度管理局的华盛顿指南第二版于\
  \ 1942 年出版时，审查人员仔细编辑了由黑人诗人、霍华德大学英语教授斯特林·布朗撰写的“华盛顿的黑人”一章。1937 年版中布朗对城市种族关系的尖锐批评以及他对当代反对种族歧视斗争的讨论都被删除了；剩下的只是一个关于黑人进步的成功故事。⁸⁵\n\
  \n\n\n\n但官员们无法遏制这场战争所蕴含的革命潜力。与第一次世界大战相比，反轴心国的斗争为种族平等主义者提供了更尖锐地对比美国自由理想与种族主义现实的机会。活动家保利·默里写道，国家的“种族问题是一个战争议题”。面对德国和日本敌人公开推行种族优越制度，活动家们主张种族平等才是美国之道。白人至上不仅在道德上是错误的，更是非美国的。联邦政府内部的活动家拥有强大的支持者，同时也得到了一代学者的支持，这些学者正在逐步瓦解种族主义的理论基础。⁸⁶\n\
  \n当黑人士兵在海外作战、黑人工人制造飞机、黑人职员在联邦战争官僚机构中工作时，全国各地的民权活动家发起了一场“双 V”运动，旨在击败国外的法西斯主义和国内的吉姆·克劳制度。“黑人，像其他美国公民一样，帮助建设了美国，热爱美国，想要保卫美国，”黑人战争人力委员会雇员露西亚·皮茨在《华盛顿邮报》上写道。“他们不仅应享有苦难、牺牲和磨难，还应享有经济机会和对美国的信念。”⁸⁷\n\
  \n尽管战争期间有压力要求淡化抗议，但朱厄尔·马齐克和其他当地活动家通过挑战首都运输公司的雇佣做法，来争取那份“应得的份额”。首都运输公司是一家私营企业，垄断了华盛顿唯一的公交和电车线路的运营权。与其他南方城市不同，华盛顿的公共交通自重建时期以来一直保持融合，当时该市的电车曾是种族冲突的爆发点。然而，首都运输公司所有高薪的司机或电车操作员都不是黑人。其所有黑人员工都在维修部门或做清洁工。即使在面临严重的战时劳动力短缺、导致\
  \ 30%至 50%的公交车闲置的情况下，该公司仍拒绝雇佣黑人司机，而是招募白人女性和政府工作人员兼职做临时司机。⁸⁸\n\n活动家们认为华盛顿的电车是一个高度可见的场所，可以在战时表达美国价值观，并如一位《邮报》写信者所言，“证明‘四大自由’不仅仅是空话”。在全国有色人种协进会和联邦国防运输办公室等广泛盟友的支持下，新成立的“公用事业黑人就业委员会”发起了一场“上班迟到？”广告宣传活动，强调首都运输公司“狭隘的种族偏见”对战争努力的影响。该委员会向公平就业实践委员会提交了近六千名华盛顿市民（包括白人和黑人）签署的请愿书，敦促\
  \ FEPC 制止首都运输公司“反社会且不爱国”的歧视。FEPC 主席承认，黑人社区将“其种族晋升到电车平台视为检验政府承诺所有美国人平等机会诚意的试金石。”⁸⁹\n\
  \n首都运输公司的管理层拒绝让步。公司官员辩称，华盛顿“一直被视为一个南方城市”，许多南方白人战时工人怀有偏见，如果雇佣黑人操作员，可能导致罢工、“身体暴力”和“流血事件”。此外，公司总裁\
  \ E·D·梅里尔声称，黑人根本不够资格当司机，部分原因是他们没有“多年的文化经验作为支撑”。⁹⁰\n\n在 1942 年 11 月的一系列听证会后，FEPC\
  \ 命令该公司停止歧视。该公司勉强雇佣了伯纳德·西蒙斯——一位大学毕业生，曾担任私人司机——作为其第一位黑人电车操作员学徒。然而，当西蒙斯于 1943 年 2\
  \ 月报到时，十六名白人工会成员拒绝培训他，并让他们的公交车闲置，直到他被命令离开现场。公司转而提供了一份清洁工的工作，他拒绝了，随后被解雇。⁹¹\n\n作为回应，马齐克和其他活动家在繁忙的十字路口设置纠察线——她的标语上写着：“黑人在突尼斯驾驶坦克，为什么不能在华盛顿开公交车和电车？”——并在五月组织了一场“首都运输公司周”的抗议活动，最终有八百人游行至富兰克林广场，那里曾是\
  \ 1866 年充满活力的解放日庆祝活动的举办地。然而，尽管有组织的抗议和 FEPC 的多次命令，运输公司仍未遵守。其电车平台一直保持纯白人状态，直到 1956\
  \ 年公司破产。面对顽固的白人抵抗，FEPC 证明了自己软弱无力。⁹²\n\n首都运输公司的斗争与霍华德大学学生试图打破华盛顿公共场所日常种族隔离习惯的努力并行。战时关于自由的言论，加上迫使年轻人在种族隔离军队中服役的征兵制度，促使学生们采取行动。“这座城市体现了美国官方战争宣传与我国境内种族实践之间的巨大鸿沟，”保利·默里回忆道，她是霍华德法学院班上仅有的两名女性之一。“在国家首都实行种族隔离是一种尤其令人愤慨的侮辱。”⁹³\n\
  \n默里是北卡罗来纳州人，拥有亨特学院学位，已经是民权抗议的老手。她在 1938 年试图让北卡罗来纳大学取消种族隔离但未成功，因此获得全国关注，并因拒绝坐在种族隔离公交车的后排而在弗吉尼亚监狱待过一段时间。她与第一夫人埃莉诺·罗斯福关系密切，十年前就与之相识并定期通信。年长几岁且经验更丰富的默里，热情而专注，成为如露丝·鲍威尔等抗议的霍华德大学本科生的领导者和导师。⁹⁴\n\
  \n鲍威尔于 1942 年从马萨诸塞州来到霍华德大学。像摄影师戈登·帕克斯和其他非南方黑人新来者一样，她对华盛顿的种族隔离感到愤怒。她许多下午独自坐在白人专用柜台前，沉默地愤怒着，徒劳地等待服务。1943\
  \ 年 1 月，她带着两名霍华德同学去西北宾夕法尼亚大道的联合雪茄店喝热巧克力。最初被拒绝服务，她们坚持坐在柜台前，直到警察到来并命令经理给她们饮料。但在这些女性抗议被收取超过正常价格两倍的费用后，警察将她们押送进了监狱。⁹⁵\n\
  \n这些女性的“坐凳”技巧（“静坐”一词尚未被创造）在校园内赢得了广泛支持。一项调查发现，超过 97%的霍华德学生认为黑人学生应该积极争取平等权利，即使在战争期间也是如此。通过全国有色人种协进会的校园分会，保利·默里和其他霍华德学生筹集资金、赞助演讲者，并游说国会通过一项华盛顿特区民权法案。他们还计划了一系列直接行动抗议，模仿莫罕达斯·甘地在印度反对英国统治的非暴力运动。“你是支持‘希特勒的方式’（种族至上）还是‘美国的方式’（平等）？”活动家分发的传单上这样写道。⁹⁶\n\
  \n\n\n\n\n与新黑人联盟一样，学生抗议者瞄准了黑人区的商店，例如位于西北第十四街和 U 街附近由希腊人经营的小宫殿商店。1943 年 4 月，学生们对小宫殿商店进行了为期四天的纠察，迫使店主改变了商店的服务政策。次年，五十六名学生花了一天时间坐在市中心第十一街和宾夕法尼亚大道的汤普森餐厅的高脚凳上。到当天结束时，管理层已经屈服，学生们得到了服务。⁹⁷\n\
  \n然而，胜利是短暂的。与首都运输公司一样，汤普森餐厅并未改变其官方种族隔离政策，在学生能够发起新一轮运动之前，紧张的霍华德大学管理人员进行了干预。就在 1944\
  \ 年 4 月学生示威前不久，密西西比州参议员西奥多·比尔博接管了参议院哥伦比亚特区委员会。比尔博是一位暴躁的种族隔离主义者，曾呼吁将黑人士兵驱逐到利比里亚，他急切地利用自己的职位阻挠任何民权倡议。霍华德大学是一所联邦特许机构，其预算严重依赖联邦资金，霍华德大学校长莫迪凯·约翰逊和董事会认为他们无法承受与比尔博及其他国会拨款者对抗的代价。他们迫使学生们取消了进一步的抗议活动。当战争结束后直接行动抗议重新开始时，霍华德大学的学生基本上没有参与。⁹⁸\n\
  \n霍华德大学的静坐抗议和首都运输公司的抗议引发了人们对暴力潜在风险的担忧，1943 年夏天，该市的种族紧张局势“接近沸点”。在当年 6 月底特律爆发了一场毁灭性的种族骚乱后，两个种族的中产阶级公民领袖成立了种族关系公民委员会，该委员会试图对种族问题进行系统的“清查”，并提出和平的政策解决方案。与南方其他类似组织一样，公民委员会主要寻求协调种族关系、缓和紧张局势，而不是挑战白人至上主义或经济不平等。⁹⁹\n\
  \n对于公民委员会和其他中产阶级改革者来说，住房问题成为该市“头号社会问题”。与以往战争期间一样，华盛顿无法跟上如此多新人口的快速涌入。新来者挤进过度拥挤的社区，推高了租金，而贫困黑人居民的住房条件却在恶化。巨大的住房需求终结了贫民窟清理计划。小巷房产比以往任何时候都更有利可图，当几乎不可能为原居民找到替代住所时，住房管理部门甚至无法证明拆除最破旧房屋的合理性。“尽管这些贫民窟猪圈大多很糟糕，”《邮报》新任编辑的慈善妻子艾格尼丝·恩斯特·迈耶写道，“但在没有地方让黑人去之前，它们不能被拆除。”¹⁰⁰\n\
  \n一位调查公共住房单元的社会工作者发现，“三个家庭住在一个四室的木结构棚屋里，院子里有厕所、室外供水、漏水的屋顶、部分房间之间的纸板隔断、不安全的楼梯，以及大部分灰泥已经脱落的墙壁。”战时的优先事项再次压倒了住房问题。本应在\
  \ 1944 年（以及此前的 1918 年）之前消除的小巷住房，在 1945 年战争结束后仍然长期存在。¹⁰¹\n\n联邦政府战时的扩张加剧了住房危机，官员们行使征用权购买住宅物业用于新的政府设施，这些设施往往位于以黑人为主的地区。华盛顿市中心数百个低收入黑人家庭不得不离开家园，为新的社会保障局、铁路退休委员会和人口普查局大楼让路。在波托马克河对岸的弗吉尼亚州，联邦当局将东阿灵顿的一千多名黑人居民连根拔起，以扩建阿灵顿国家公墓，并修建通往后来成为五角大楼的道路网络。¹⁰²\n\
  \n在自由住房市场中，被压抑的黑人需求会激励开发商通过建造更多单元来增加供应。但华盛顿的市场从来都不是自由的：限制性契约限制了黑人的流动性，贷款做法限制了黑人获得贷款的机会，白人对融合住房的抵制人为地缩小了黑人的住房选择。忙于为成千上万新来的白人战争工人建造房屋的白人开发商，干脆忽视了日益增长的黑人需求。战争期间，他们没有为黑人家庭建造任何私人开发项目。公民委员会指出，华盛顿的黑人居民“被越来越紧地挤进哥伦比亚特区内少数几个小小的‘孤岛’。”¹⁰³\n\
  \n一位黑人传教士——莱特富特·米肖长老——介入了这一缺口。作为上帝教会多彩且富有争议的领袖，米肖于 20 世纪 30 年代初来到哥伦比亚特区，在西北乔治亚大道建立了一个店面教堂，该教堂迅速发展成为一个福音派帝国，拥有一个受欢迎的广播节目、一个熙熙攘攘的“快乐新闻咖啡馆”，以及在波托马克河举行的大规模洗礼。凭借白人支持者和黑人会众的捐款，米肖在远离现有白人社区的东北本宁路建造了拥有\
  \ 596 个单元的梅菲尔大厦。梅菲尔大厦是战争期间为黑人家庭建造的最大单一开发项目，但米肖的目标是吸引黑人专业人士，而非穷人。¹⁰⁴\n\n低收入黑人居民和战争工人寄希望于公共住房来缓解住房压力。他们发现联邦和地方住房管理部门遵从白人对隔离住房的要求。联邦国防住宅公司效仿了约翰·伊尔德和地方小巷住宅管理局（该局于\
  \ 1943 年更名为“国家首都住房管理局”）的做法。尽管伊尔德声称安置黑人战争工人是首要任务，但他坚持认为当局“不应在住房项目中混合种族”，而应只寻求“为每个种族提供其已占据地点的住房。”¹⁰⁵\
  \ 战争开始时，联邦政府匆忙在市中心为战争工人建造了数十栋两层营房——仅供白人使用。\n\n然而，尽管伊尔德做出了保证，白人公民协会和私人住宅建筑商几乎一致反对黑人公共住房开发，特别是在埃莉诺·罗斯福于\
  \ 1943 年底呼吁在哥伦比亚特区取消公共住房隔离之后。¹⁰⁶ 白人公民协会联合会要求完全废除国家首都住房管理局，并与当地住宅建筑商协会合作破坏战时住房开发。尽管公共住房反对者经常用关于成本和地方控制的中性语言来包装他们的批评，但他们的反对很大程度上源于种族恐惧，正如\
  \ FCA 主席哈里·温德在 1944 年 6 月参议院小组委员会作证时所承认的那样。\n\n温德是一位犹太律师，以自己在西南部的跨种族社区工作为傲，他视自己为温和派，在白人种族隔离主义者与立即实现种族平等的倡导者之间充当调解力量。他支持公共住房，尽管他领导的组织反对它。温德告诉参议员们，种族是白人反对公共住房的“高度易燃”原因。白人居民希望保护“社区的现有模式”，如果没有铁定的保证来保护公共住房中的种族隔离，“华盛顿人民将以绝对多数反对它。”¹⁰⁷\n\
  \n\n\n\n面对白人群体对融合住房的强烈反对，战时住房倡导者并未直接攻击种族隔离本身，而是向住房管理机构施压，要求为黑人居民提供更多、更好的住房选择。一位重要的新活动家是多萝西·海特，她是位于西北区第九街和罗得岛大道的菲利斯·惠特利基督教女青年会的黑人领袖。海特出生于里士满，拥有纽约大学硕士学位，1939\
  \ 年她 27 岁时来到华盛顿，开启了她长达七十年的民权生涯。惠特利基督教女青年会在其四层总部为低收入女性提供经济适用房，但海特认识到，城市和地方官员需要采取积极措施来满足成千上万战时工人的需求。¹⁰⁸\n\
  \n当海特质问联邦住房官员为何为黑人工人建造的住房项目如此之少时，她被告知：“黑人总是自己照顾自己。”就连黑人住房官员罗伯特·泰勒也显得冷漠无情。华盛顿的黑人居民确实“自己照顾自己”——许多人向来自南方的寄宿者或亲戚敞开家门——但泰勒的冷漠激怒了这位独一无二的海特。她迅速派遣志愿者调查居民所在社区的状况，并在一次有三百多名女性参加的会议上向泰勒报告了调查结果。来自海特和其他黑人活动家的压力，帮助确保了联邦国防住宅公司为黑人战时工人建造了“旅馆”，其中包括露西·迪格斯·斯洛大厅，这是一座位于西北区第三街\
  \ 1919 号、拥有 322 张床位的宿舍楼，以已故的黑人网球冠军和霍华德大学院长命名。¹⁰⁹\n\n尽管与白人官员合作争取更好的住房条件，但许多华盛顿黑人居民担心，无论是公共还是私人的住房规划者，都怀有将黑人居民赶出理想市中心的意图。在\
  \ 20 世纪 40 年代中期的一项研究中，几乎所有接受采访的黑人居民都认为，“有一项计划正在酝酿，要将整个有色人种逐渐隔离到阿纳科斯蒂亚河对岸”。黑人活动家日内瓦·瓦伦丁担心，政府会干脆买下土地，“接管整个黑人社区”，并“在哥伦比亚特区将它们彻底清除，重建并完全改变其居住者”。对搬迁或驱逐的恐惧甚至导致一些黑人居民支持白人公民协会反对公共住房。在接下来的几十年里，随着华盛顿黑人居民努力应对战后城市更新和绅士化，这种担忧的回声将再次响起。¹¹⁰\n\
  \n尽管战时压力巨大，但地方和联邦层面白人的坚决抵抗在很大程度上在战争年代保留了国家首都的种族隔离。在反对就业歧视、隔离公共空间和住房不足的斗争中，种族平等主义者往往取得了象征性或小规模的胜利，但最终未能击败吉姆·克劳制度。战争结束时，首都运输公司仍然没有黑人司机，汤普森餐厅仍然拒绝为黑人顾客服务，黑人居民仍然无法在城市的大部分地区找到住房。尽管伴随美国战争努力的是关于自由、民主和“美国方式”的宏大言辞，但第二次世界大战却阻碍了华盛顿特区的种族进步。\n\
  \n然而，白人种族隔离主义者脚下的土地正在迅速变化。在 20 世纪 30 年代，种族平等倡导者开创了新的策略，建立了广泛的跨种族联盟，并利用了全国范围内更广泛的盟友网络。尽管他们的努力只产生了有限的短期成果，但他们为战后一场将改变华盛顿的非凡运动奠定了基础。1945\
  \ 年，当全国庆祝战争结束时，国家首都即将开始自重建时期以来从未有过的深刻种族变革时期。\n\n## 第十章\n## 种族隔离不会自行消亡\n### *吉姆·克劳的崩溃，1945–1956\
  \ 年*\n\n我们，华盛顿特区的公民，对种族隔离感到厌倦。它是错误且不可辩护的。它使我们容易受到国内外的批评。\n\n——致总统和华盛顿特区专员委员会的请愿书，1953\
  \ 年\n\n位于华盛顿东南区埃利广场的约翰·菲利普·苏萨中学，对面是华盛顿国民青年棒球学院的原始球场和特区第二大公园——杜邦堡的郁郁葱葱的山丘。这所学校以来自东南区、创作了《星条旗永不落》的著名美国海军陆战队乐队指挥命名，在\
  \ 20 世纪 50 年代初作为民权斗争的战场引起了国际关注，如今已成为国家历史地标。2008 年，一项耗资 3450 万美元的翻新工程修复了建筑褪色的砖石和玻璃外观，现代化了内部，并为几乎全是非裔美国人的学生群体增加了一个民权博物馆。¹\n\
  \n1950 年开放时，苏萨初中仅面向来自杜邦堡和本宁高地新兴中产阶级社区的白人学生。尽管 21 世纪的华盛顿人常常认为阿纳科斯蒂亚河以东的社区一直以黑人为主，但在世纪中叶，“远东南区”大约\
  \ 83%是白人。白人开发商于 1907 年规划了杜邦堡和本宁高地地区，拒绝了朗方的网格系统，转而采用蜿蜒的道路，沿着自然景观的山丘和山谷延伸。这些社区最初是排他性社区，通过种族限制性契约保护免受黑人侵入。²\n\
  \n随着 20 世纪 40 年代初城市人口激增，小巷住宅管理局在该地区迅速建造了公寓楼，白人联邦工人大量涌入。由于死胡同和尽端路阻碍了交通，该地区吸引了如此多的家庭，以至于当地学校很快不堪重负。距离苏萨仅三分之一英里的金博尔小学拥挤不堪，学生不得不实行半日制。1949\
  \ 年《邮报》报道说：“今年秋天进入六年级的孩子们从未有过一整天的学习。”为了缓解拥挤，学校官员在东南区掀起了一股战后建设热潮。苏萨初中是皇冠上的明珠，一座拥有\
  \ 38 个房间的宫殿式设施，配备了两个体育馆。³\n\n苏萨闪闪发光的校园引起了希尔克雷斯特及其他附近黑人社区黑人家庭的注意。他们不得不将孩子送到阿纳科斯蒂亚河对岸拥挤不堪、设备简陋的初中。⁴\
  \ 对白人和黑人学校系统之间日益扩大的差距感到不耐烦，黑人活动家决定直接挑战种族隔离学校，而不是与学校系统斗争以遵守“隔离但平等”的后半部分。1950 年 9\
  \ 月 6 日，当苏萨开放时，他们游行到学校前门，为 11 名衣着无可挑剔的黑人学童寻求入学资格。被拒绝后，他们起诉了华盛顿特区学校董事会主席梅尔文·夏普；11\
  \ 岁的斯波茨伍德·博林，一位丧偶的联邦总务管理局装订工的儿子，成为了该案的代表人物。*博林诉夏普案*最终上诉至美国最高法院，成为 1954 年具有里程碑意义的*布朗诉教育委员会案*的附带案件。\n\
  \n\n\n斯波茨伍德·博林（Spottswood Bolling）简单的入学请求，直击了远东南区乃至整个华盛顿特区种族隔离生活的核心。对于 20 世纪 40\
  \ 年代迁入此地的白人家庭而言，远东南区的社区提供了诸多吸引力——低密度开发、极低的犯罪率、价格适中的住房，以及市中心的美景。与华盛顿特区其他白人区域一样，二战结束时，这些社区的生活在很大程度上是种族隔离的，受到一座官方仍致力于维护种族隔离的城市法律和习俗的保护。在新黑人运动兴起三十年之后，这场运动为种族平等斗争注入了日益高涨的战斗精神，但华盛顿仍然是一座南方城市，其白人领袖捍卫种族限制性契约、维持双轨学校制度，并支持吉姆·克劳（Jim\
  \ Crow）做法。自信的白人保守派相信，他们能够抵挡战后对其隔离生活方式的任何攻击，就像他们在第一次世界大战后所做的那样。\n\n然而，看似坚不可摧的华盛顿隔离世界，实际上却异常脆弱。十年之内，这个世界的支柱便在无休止的社区抗争、强大的跨种族联盟、最高法院的关键判决，以及包括哈里·杜鲁门总统和德怀特·艾森豪威尔总统在内的联邦当局的战略支持下土崩瓦解。尽管缺乏投票权，华盛顿的黑人居民及其全国各地的白人盟友利用各种政治和法律策略，唤起公众舆论，迫使国会和法院拆除了吉姆·克劳的法律框架。官方隔离的终结恰逢——并推动了——大规模的人口结构变化，到\
  \ 1957 年，华盛顿已成为美国第一个黑人占多数的主要城市。在远东南区，这种转变是戏剧性的：1950 年至 1970 年间，该地区从 83%的白人变为超过 85%的黑人。⁵\n\
  \n从 1945 年二战结束到 1954 年最高法院对*博林诉夏普案*（*Bolling v. Sharpe*）作出判决之间的岁月，是这座城市自 19 世纪 60\
  \ 年代以来最具决定性的时期。只有内战和重建时期的狂热日子，才在华盛顿见证了如此迅速的种族变革。突然间，国家首都的隔离制度似乎崩溃了，比南方其他地区发生类似变化早了五年甚至更久。到\
  \ 20 世纪 50 年代末，华盛顿公共生活的机构——学校、酒店、餐馆、剧院、娱乐设施、政府机构、工会、专业协会——已不再实行种族隔离。\n\n对于民权支持者来说，这一转变令人叹为观止，是数十年斗争后取得的惊人成就。然而，新的华盛顿也让白人保守派感到困惑，他们如今感到疏离和无能为力，成为无法控制的力量的受害者。双方都同意\
  \ 1959 年一份关于首都种族关系的报告中的评估：“一场重大的社会革命已在华盛顿发生。”⁶\n\n### *“不可容忍”：自由世界首都的种族歧视*\n\n查尔斯·汉密尔顿·休斯顿（Charles\
  \ Hamilton Houston）对战后推翻华盛顿吉姆·克劳制度的革命负有与任何人同等的责任。他为这场斗争做好了充分准备。休斯顿出生于 1895 年，祖上是肯塔基州的奴隶，但父母是华盛顿一对雄心勃勃、受过教育的中产阶级夫妇。作为一个安静、严肃的独生子，休斯顿\
  \ 15 岁完成了 M 街高中（M Street High School）的学业，四年后以优等成绩从阿默斯特学院（Amherst）毕业。1917 年美国加入第一次世界大战时，他自愿成为军官，并在训练期间和法国目睹了赤裸裸的种族歧视。“我他妈的庆幸自己没有为国捐躯，”休斯顿苦涩地回忆道，“我下定决心，如果我能活下来，我一定要对这个国家该如何运转有发言权。”回到华盛顿后，他目睹了\
  \ 1919 年 7 月爆发的骚乱，地点离他父母位于西北区第十街和 R 街的住所不远。⁷\n\n这场骚乱，加上他在战时的经历，坚定了休斯顿利用法律对抗种族歧视的决心。他进入哈佛法学院，成为《哈佛法律评论》（*Harvard\
  \ Law Review*）的第一位黑人编辑。34 岁时，他成为霍华德大学法学院（Howard University Law School）的副院长，当时该学院只提供夜校课程，声望不高。不知疲倦、务实的休斯顿将霍华德改造为一所获得认证的机构，拥有严格的课程设置和以种族正义使命为核心的明星教师队伍。“他硬得像块\
  \ crust，”他最杰出的学生、后来的最高法院大法官瑟古德·马歇尔（Thurgood Marshall）回忆道，“他让我们清楚地知道，当我们从法学院毕业时，我们被期望走出去，用我们的生命做点什么。”⁸\n\
  \n休斯顿对不公义感到不耐烦，但性情自律。他在 20 世纪 30 年代成为全国有色人种协进会（NAACP）的特别法律顾问，并策划了该组织的战略，逐步拆除了华盛顿和整个南方地区的隔离法律框架。在他于\
  \ 1950 年 54 岁英年早逝前的二十年里，休斯顿参与了几乎所有涉及隔离的重大法律案件，包括*密苏里州诉加拿大案*（*Missouri ex rel. Gaines\
  \ v. Canada*，1938 年），在该案中，美国最高法院裁定，为白人学生设立研究生院的州也必须为黑人学生提供州内研究生教育。他还积极参与当地的种族斗争，从新黑人联盟（New\
  \ Negro Alliance）到玛丽安·安德森（Marian Anderson）音乐会，再到首都交通抗议活动。休斯顿身材魁梧，身高六英尺，古铜色皮肤，颧骨突出，神情严肃、镇定自若，赢得了顽强、思维敏锐的诉讼律师的声誉。\n\
  \n鉴于他在第一次世界大战期间及战后的经历，休斯顿知道，二战期间取得的任何成果都很容易在战后丧失。事实上，甚至在 1945 年底部队开始返回家园之前，隔离势力就开始在华盛顿重新抬头。对种族平等的抵制在市中心的企业中也能感受到，例如位于西北区第七街和\
  \ E 街的兰斯堡百货公司（Lansburgh’s department store），该店在战争期间曾在其冷饮柜台为黑人顾客提供服务，但在白人顾客投诉后，又悄悄恢复了隔离服务。⁹\n\
  \n这种抵制在当地官员的行动中显而易见，包括市娱乐委员会（Board of Recreation），该委员会于 1945 年 6 月投票决定加强而非废除其公共娱乐设施的隔离政策。\n\
  \n这种抵制体现在战后公平就业实践委员会（Fair Employment Practices Committee）的消亡中，该委员会在国会中的隔离主义者成功领导了一场反对它的运动后，于\
  \ 1946 年永久关闭。¹⁰\n\n这种抵制还在参议院哥伦比亚特区委员会主席、密西西比州参议员西奥多·比尔博（Theodore Bilbo）雷鸣般的言辞中回响。他对家乡欢呼的人群说：“我想要这个职位，就是为了让[华盛顿]保持一个隔离的城市。”当比尔博在\
  \ 1946 年连任时，《华盛顿邮报》（*Post*）哀叹道：“邦联（Confederacy）在[内战]期间从未能攻占华盛顿，如今却将其当作一个无助的棋子牢牢掌控。”¹¹\n\
  \n\n\n参议员比尔博确实是一个严重的障碍。所有用于该市的拨款都要经过他的委员会，因此市政领导避免与他发生冲突。但他公然宣扬的偏执以及关于“黑人低劣”的咆哮式抨击，并不能代表华盛顿特区种族主义通常的运作方式。华盛顿保守的白人领导层——包括任命的专员、贸易委员会的商人、城市规划者、公民协会联合会的领导人——往往固执但彬彬有礼，既不像比尔博或他在国会中主张种族隔离的同事那样激烈，也不像他们那样极端。尽管他们同样致力于维持华盛顿的种族隔离，但他们通常用促进“和谐”和避免“不必要危险摩擦”的温和言辞来包装其种族主义，而不是诉诸暴力威胁或赤裸裸的种族仇恨。¹²\n\
  \n![Image](img/f0001-16.jpg)\n\n*查尔斯·汉密尔顿·休斯顿是全国有色人种协进会（NAACP）旨在瓦解种族隔离法律结构战略的设计者。他既是社区活动家，也是坚韧不拔的诉讼律师，在\
  \ 20 世纪 30 年代和 40 年代几乎参与了华盛顿特区所有民权运动。照片由艾迪生·N·斯柯洛克拍摄，斯柯洛克工作室档案，美国国家历史博物馆档案中心，史密森尼学会。*\n\
  \n根据公民协会联合会（FCA）负责人克利福德·纽厄尔的说法，种族隔离不过是白人和黑人同样偏好的“自然状态”。他和其他信奉种族隔离的“善意白人”对少数族裔并无“敌意”。“为所有公民提供平等机会……并不必然意味着他们必须共同享有这些机会，”罗德岛大道公民协会辩称。在他们看来，隔离并不一定意味着歧视。正如\
  \ FCA 官员约翰·康诺顿对《华盛顿每日新闻》所说：“华盛顿不存在歧视。”¹³\n\n尤利西斯·S·格兰特三世是华盛顿强大但低调的种族隔离主义者的典型代表。这位著名联邦将军的孙子是西点军校毕业生，20\
  \ 世纪 20 年代来到华盛顿，并在接下来的四十年里领导了多个城市规划组织。尽管在北方和国外长大，他在处理种族关系时却持南方立场。在 1942 年至 1949\
  \ 年担任国家首都公园与规划委员会负责人期间，格兰特利用联邦资金清理市中心的贫民窟，为白人联邦工作人员建造现代化住宅区，并将低收入黑人居民迁往别处。黑人活动家指责他试图“在特区远东北区……以及阿纳科斯蒂亚后方建造一个希特勒式的隔离区”，格兰特对此强烈否认。他自称是“有色人种非常真诚的朋友”，但他的职业生涯却将种族隔离的居住模式嵌入了华盛顿的住宅地理中。¹⁴\n\
  \n即使在战争期间及战后华盛顿发生巨大变化时，这些模式也变得更加根深蒂固。与其他城市地区一样，特区正迅速成为一个不断扩张的大都市区的中心，这个区域已不仅仅是一座城市。即使战争结束、复员士兵返乡后，联邦政府，尤其是和平时期的军事官僚机构，仍随着冷战而持续扩张。华盛顿地区同步增长，但所有增长都发生在郊区。该市人口在\
  \ 1943 年达到 90 万以上的峰值，随后开始了长达六十年的稳步下降。华盛顿在该地区人口中的占比从 1940 年的 68.5%缩减至二十年后的 36.9%。¹⁵\n\
  \n郊区化加剧了该地区的种族和经济隔离，部分原因在于联邦政策。联邦住房管理局（FHA）作为新政时期旨在提高住房拥有率的机构，绘制了按抵押贷款风险等级对社区进行分类的地图。市中心大多数黑人社区以及处于种族过渡期的社区被用红笔圈出，标注为“D\
  \ 类”，即风险最高的类别。新房主，包括使用《退伍军人权利法案》资金的返乡退伍军人，通常避开此类社区，转而前往蓝线标注的“A 类”区域，其中大部分位于郊区。由于即使向一位黑人购房者出售房屋也可能危及整个社区的信用评级，许多郊区社区和房地产经纪人利用\
  \ FHA 的“红线划界”来为限制性契约辩护，禁止向少数族裔出售房屋。¹⁶\n\n表 5 华盛顿人口，1940–1960 年\n\n![Image](img/t0001-05.jpg)\n\
  \n在这个由联邦资助的郊区化空前时期，红线划界实际上将黑人房主挡在了郊区之外。1900 年，黑人占华盛顿郊区人口的 34%，但到 1960 年仅为 6%。少数居住在郊区的黑人主要生活在种族隔离的农村飞地，如马里兰州的桑迪斯普林，这些地方可追溯到\
  \ 19 世纪。与此同时，由于投资资本枯竭且相对贫困的南方移民涌入，被红线划界的社区日益恶化。该市超过 12%的黑人家庭缺乏自来水，超过 16%的家庭没有电力供应。¹⁷\n\
  \n战争期间及战后涌入华盛顿地区的南方黑人移民基本上全部定居在市区，而几乎所有白人新移民都去了郊区。特区的黑人人口在二十年间翻了一番多，从 1940 年的 187,266\
  \ 人增至 1960 年的 411,737 人，而白人人口则减少了近三分之一。与此同时，郊区人口猛增近 330%，到 1960 年达到 130 万以上。1939\
  \ 年，FHA 官员曾预测“最终特区将由黑人居住，而马里兰州和弗吉尼亚州的郊区将由白人家庭居住”。部分得益于 FHA 的政策，到 20 世纪 40 年代末，这一进程已全面展开。¹⁸\n\
  \n华盛顿不仅在人口和空间上发生变化，而且变得更加国际化且更具影响力。美国在战后崛起为世界上唯一的原子超级大国，提升了首都的国际地位，并放大了其在全球事务中的重要性。随着美苏冷战对抗的加剧，华盛顿成为“自由世界的首都”，美国价值观的展示窗口。在世界大战期间，一个专注于赢得战斗的国家可以忽视种族问题；然而在冷战期间，民权本身成为战场，因为苏联宣传者乐于将世界的注意力引向美国的种族虚伪，尤其是在其首都。“（华盛顿特区）每一起种族歧视事件都被我们的敌人急切地用于宣传，”菲尼亚斯·因德里茨在《国家》杂志上写道。¹⁹\n\
  \n休斯顿和其他民权活动家利用冷战的言论和现实，辩称华盛顿的种族主义通过削弱美国的道德权威并阻碍其在冷战中争取其他国家支持的努力，从而威胁国家安全。“美国在联合国成员国中承担了领导角色——这些成员代表了所有种族、信仰和肤色，”弗朗西斯·麦克皮克指出，他是一位白人牧师，后来共同主持了首都种族民主委员会。“对于高级政府官员以及我们的公民来说，向到访的贵宾展示我们土地的款待将变得越来越尴尬，因为这些贵宾必须目睹并常常忍受强加给我们华盛顿三分之一公民的种族限制。”²⁰\n\
  \n\n\n\n哈里·杜鲁门，这位身材矮小的第一次世界大战老兵、前服装商，于 1945 年富兰克林·罗斯福去世后继任总统，令人惊讶的是，他对这一论点持开放态度。尽管出身于实行种族隔离的密苏里州，杜鲁门逐渐将民权视为道德和战略问题。他与多位国务院高级官员一样，认识到种族主义如何阻碍美国的外交政策（以及黑人选票对民主党的重要性）。事实证明，他比前任更愿意拥抱民权。“只要任何美国人因种族、宗教、肤色或祖先的出生地而遭受歧视，我们就无法……最终实现这个国家建国时所追求的\
  \ ideals，”他在 1948 年向国会发表的一次重要民权演讲中如此宣称。²¹\n\n杜鲁门发布行政命令，终止联邦政府中的种族歧视（第 9980 号行政命令），并禁止军队中的种族隔离（第\
  \ 9981 号行政命令）。他的政府为日益壮大的两党联盟提供了关键支持，该联盟由种族自由派和外交政策现实主义者组成，他们认为国家安全利益要求结束华盛顿的种族主义。他任命了总统民权委员会，研究种族关系并建议对民权法进行适当修改。该委员会具有里程碑意义的\
  \ 1947 年报告《保障这些权利》称华盛顿是“民主失败的生动例证”。委员会得出结论，该市的种族状况“*令人无法容忍*”，并建议终止哥伦比亚特区所有成文的种族歧视。杜鲁门支持委员会的建议，尽管他没有任命那些希望实施如此激进想法的委员。²²\n\
  \n当地民权界热情拥抱《保障这些权利》报告。在见证了玛丽安·安德森公民委员会的力量和有效性后，一个日益壮大的跨种族本地活动家核心群体——包括黑人和白人律师、劳工组织者、退伍军人、学者和神职人员——成立了行动委员会，进行研究、提高意识、协调策略、筹集资金并开展抗议活动。他们采用了多种司法、政治和教育策略：详细研究以揭示歧视的程度，旨在削弱种族隔离法律基础的诉讼，旨在赢得全国观众同情的公关活动，针对本地企业的直接行动抗议，以及试图影响关键国会议员的游说努力。²³\n\
  \n各种委员会应有尽有。种族关系公民委员会负责监督全市的歧视行为；国家首都种族民主委员会试图建立一个由志同道合的公民、社会和劳工组织组成的联盟，推动民权立法；退伍军人公民委员会（旨在驱逐比尔博）承诺进行纠察，直到这位密西西比州参议员离任。²⁴\n\
  \n较为活跃的团体之一是反对娱乐场所种族隔离委员会（CASR），该委员会挑战了哥伦比亚特区娱乐委员会的种族隔离政策。在一个日益拥挤、缺乏足够游乐空间的城市，娱乐问题是一个严肃的问题。黑人儿童被禁止在空荡荡的白人游乐场上玩耍的画面激起了黑人社区的愤怒，并有助于将种族隔离的冷酷无情人性化。在大约八十个社区团体的支持下，CASR\
  \ 向娱乐委员会发送了大量信件和请愿书，宣传跨种族娱乐的积极范例，并支持委员会中唯一的黑人成员爱丽丝·亨特。\n\n亨特毕业于迈纳师范学院，担任华盛顿特区家长教师协会联合会主席，这位说话温和的女性成为委员会政策的直言不讳的批评者。她的个人热情和魅力掩盖了她结束歧视的坚定决心。但亨特和\
  \ CASR 难以赢得委员会白人成员的支持，包括主席哈里·温德。温德声称个人憎恶种族歧视，但坚称委员会必须维持种族隔离以遵守特区法律。该委员会在打击私人娱乐实体（如东北第三街的乌林竞技场）的歧视方面取得了更大成功，这些实体在经济压力下显得脆弱。²⁵\n\
  \n民权委员会将其运动与更广泛的国家主题和斗争联系起来。他们利用了全国范围内日益广泛的同情白人的专业知识、声望和财政资源，尤其是在法院中。如此强大的盟友以及不断变化的本地和全球背景，有助于解释为什么华盛顿的黑人居民在二战后的十年中取得的进步比过去七十五年还要多。卡尔文·蔡斯、南妮·海伦·伯罗斯、阿奇博尔德·格里姆凯以及早期几十年的其他本地黑人领袖，并不比\
  \ 1940 年代和 1950 年代的活动家缺乏进取心、创造力或勤奋；他们只是在更受限制的环境中运作，他们对种族正义的主张在黑人华盛顿圈子之外没有引起共鸣，也无法满足政治精英的需求。\n\
  \n然而，依赖有影响力的白人盟友、冷战言论和法院也付出了代价。意识到需要吸引广泛的全国受众，本地活动家专注于对媒体友好、能吸引广泛支持并提供可胜诉案件的问题，例如住房、青少年娱乐或公共设施，而不是诸如工会化、收入不平等或就业歧视等可能引发共产主义指控的经济问题。\n\
  \n尽管存在这些限制，战后的种族平等运动逐渐削弱了华盛顿白人保守派对其抵制生活方式变革能力的信心。白人种族隔离主义者感觉他们的城市正慢慢从他们手中溜走，他们希望通过加强覆盖华盛顿白人社区的\
  \ restrictive covenants 来巩固对住房的控制。\n\n### *“我们辛辛苦苦挣来的、深爱的家园”：住房中种族限制性契约的斗争*\n\n\
  战后初期，白人使用种族限制性契约的情况有所增加，尤其是在布卢明代尔、布鲁克兰和哥伦比亚高地等与不断扩大的黑人社区接壤的地区。由于担心黑人对住房的高需求——以及黑人买家必须支付的更高价格——会诱使白人居民出售房产，白人房主、房地产公司和贷款机构合作，以防止他们认为会破坏白人社区稳定并降低房产价值的黑人“入侵”。²⁶\n\
  \n华盛顿房地产委员会的道德准则明确规定，“白人区域的任何房产绝不应出售、出租、广告或提供给有色人种”，并禁止违反此规定的经纪人。该委员会还监管当地报纸的广告版面，确保房产列表按种族适当隔离。商业贷款机构拒绝向寻求贷款购买白人社区住房的黑人客户提供贷款。公民协会动员白人房主支持并扩大契约的使用。他们经常帮助房主设立“贫民窟基金”，以支持对违反契约者采取法律行动。白人组织为使用限制性契约辩护，国会高地公民协会写道，“因为我们觉得废除契约会损害我们辛辛苦苦挣来的、深爱的家园的价值。”²⁷\n\
  \n\n\n\n\n许多华盛顿的白人居民并不像指责外来者煽动种族紧张那样指责黑人购房——这些外来者包括共产主义者、媒体、民权煽动者、最高法院，甚至埃莉诺·罗斯福。房地产经纪人成了主要的攻击目标。“无耻的房地产经纪人——无论白人还是黑人——正在利用不幸且常常是无辜的有色人种为自己聚敛财富，并[摧毁]白人社区，”一位白人律师愤怒地说道。在\
  \ 1947 年的一次社区会议上，一位东北区的白人房主若有所思地表示，他想用“一根结实的棍子或撬棍”去敲那些试图破坏他所在社区的房地产经纪人的脑袋，但他哀叹道，“我们唯一的补救办法就是上法庭。”²⁸\n\
  \n一个激起白人房主愤怒的人是拉斐尔·乌尔乔洛，他是一名不守规矩的经纪人，因将白人房产出售给黑人而被华盛顿房地产委员会除名。乌尔乔洛是意大利移民，中央高中校友，拥有天主教大学、马里兰大学和罗马大学的学位，他是一名律师、教师、作家和语言学家，会说十种语言。作为天主教跨种族委员会的成员，乌尔乔洛“根本不相信契约限制”，并在法庭上作证说，他“更愿意卖给有色人种，因为他们找房子要困难得多”。他还承认，他喜欢卖给黑人买家，因为他们买房时多付了\
  \ 30%到 40%的钱。²⁹\n\n乌尔乔洛出售的那栋房子最终摧毁了华盛顿特区限制性契约的法律基础，并使查尔斯·汉密尔顿·休斯顿成为全国最杰出的黑人律师。1944\
  \ 年 6 月，一对黑人夫妇詹姆斯·赫德和玛丽·赫德通过乌尔乔洛购买了位于西北区布莱恩特街 116 号的一栋房子，对面是麦克米伦公园，距离霍华德大学仅几个街区。注意到整个社区都有黑人拥有的房屋，包括该街区上的几栋，赫德夫妇以为他们的到来不会有什么问题。他们错了。³⁰\n\
  \n赫德夫妇的房子是该街区仍受限制性契约约束的二十栋房屋之一，出售的消息传到了白人律师亨利·吉利根那里，他受雇于北国会山公民协会，负责“持续诉讼”。吉利根曾是学校董事会成员，住在拐角处，他花了二十年时间执行限制性契约，从未输过一场官司。他威胁赫德夫妇，如果他们不立即搬走，就会采取法律行动。当赫德夫妇无法迅速卖掉房子以满足白人邻居的要求时，吉利根代表包括莉娜·霍奇在内的几位邻居将他们——以及另一起案件中的乌尔乔洛——告上了法庭。在诉状中，原告声称，布莱恩特街上有黑人居民将“有害、有损且具有颠覆性”，破坏他们的“内心平静、舒适和财产权”，并使该地区“成为白人不宜居住的社区”。该地区似乎已经对白人居民失去了吸引力——到案件开庭时，该街区已有另外三栋房子卖给了黑人买家。³¹\n\
  \n吉利根有理由相信，他对付赫德夫妇的不败纪录将继续保持。毕竟，法院在白人房主维护种族隔离社区的斗争中一直相当友好。自美国最高法院在 1926 年的《科里根诉巴克利案》中裁定限制性契约是私人合同，不受宪法审查以来的二十年里，联邦上诉法院多次驳回了挑战。在战时一个著名的案件——1945\
  \ 年的《梅斯诉伯吉斯案》中，一名黑人政府雇员被迫离开了她位于西北区第一街 2200 号街区、离赫德夫妇家不远的房子。³²\n\n但联邦上诉法院法官亨利·埃杰顿——一位备受尊敬的堪萨斯人，由罗斯福总统任命——对《梅斯案》的裁决提出了异议。埃杰顿指出，“我们的《科里根案》判决在作出时可能就不合理”，他认为法院不仅应考虑整个城市不断变化的住房状况，还应考虑限制性契约对黑人人口的影响。³³\
  \ 埃杰顿的异议鼓励了查尔斯·汉密尔顿·休斯顿及其法律界的自由派盟友，他们认为在战后世界中，限制性契约可能容易受到宪法挑战。\n\n休斯顿担任赫德夫妇的辩护律师，与他一起的还有一位才华横溢的年轻霍华德法学院毕业生斯波茨伍德·罗宾逊三世（后来被任命为华盛顿特区巡回法院首位黑人法官）。他们是全国十多位在法庭上挑战限制性契约的民权律师中的一员。地方法院和美国上诉法院都遵循先例，判决赫德夫妇败诉，但埃杰顿法官在上诉裁决中再次发表了尖锐的异议。他有力地阐述了反对他认为不公平且站不住脚的种族限制性契约的理由，认为这些契约助长了“隔都制度”。“问题在于，法律是否应该积极支持并强制执行种族歧视。”他坚持认为，答案是否定的。³⁴\n\
  \n休斯顿、罗宾逊、乌尔乔洛以及一位名叫菲尼亚斯·因德里茨的白人政府律师（他在读到埃杰顿法官的异议后自愿提供帮助）将《赫德诉霍奇案》上诉至美国最高法院。1948\
  \ 年，最高法院审理了此案以及一起来自圣路易斯的附带诉讼《谢利诉克雷默案》。两位大法官因自身住所受限制性契约约束而回避，其中包括威利·拉特利奇大法官位于美利坚大学附近印第安巷的树木繁茂的庄园。在最高法院的辩论中，休斯顿强调了一个核心问题：“我们是否应该在美国通过一套基于私人偏见、借助政府权威和权力执行的司法强制限制制度，为种族、宗教和其他少数群体建立隔都，甚至将这些少数群体完全排除在我国的白人区域之外？”休斯顿认为，司法强制执行偏见“显然与美国参战的原因不相容”。“种族主义必须终结。”³⁵\n\
  \n1948 年 5 月，最高法院一致决定推翻下级法院在《赫德诉霍奇案》中的裁决，认为司法强制执行基于种族的限制性契约违反了 1866 年《民权法案》，限制了华盛顿黑人居民平等拥有和使用财产的权利。这些契约不再具有法律效力，赫德夫妇可以保留他们的房子。³⁶\n\
  \n种族限制并未在一夜之间消失。事实上，许多房屋，尤其是岩溪公园以西富裕社区的房屋，在此后多年仍维持着限制性契约，受到白人房主之间同辈压力的保护，并由开发商而非法院强制执行。但《赫德诉霍奇案》是一个转折点。白人房地产经纪人和业主仍然致力于维护白人社区，有时甚至使用暴力，但黑人购房者首次有了法律力量的支持。几年之内，该市大多数社区都向黑人定居开放。这一裁决鼓励了全国范围内的住房活动人士推动融合性公共住房，该政策很快被纳入\
  \ 1949 年的《住房法》。³⁷\n\n\n\n\n\n*赫德案*的判决也表明，最高法院愿意推翻其在种族案件中的先例。在*科里根案*将限制性契约固化为维护居住隔离的合法手段仅仅二十年后，最高法院便认为有必要改变立场。大法官们还会重新考虑哪些问题呢？\n\
  \n### *“失传的法律”：安妮·斯坦、玛丽·丘奇·特雷尔与华盛顿特区歧视性法律结构的瓦解*\n\n安妮·斯坦一生都在挑战权威。作为布鲁克林贫穷的乌克兰犹太移民的女儿，斯坦在\
  \ 20 世纪 30 年代初就读于亨特学院时便投身激进政治。她自豪地加入共产党，曾对一群人说：“如果为降低学费、为黑人权利、为学生工人争取更高工资、为食堂降低价格而斗争——如果这就是赤色分子，那就让我们做赤色分子吧。”这番言论引起了联邦调查局的注意，此后她余生都受到监视。斯坦身高五英尺七英寸，身材纤细，面容清瘦，五官突出，她象征着令华盛顿白人保守派不安的威胁：一个决心摧毁珍视习俗的激进煽动者。³⁸\n\
  \n斯坦于 1933 年首次来到华盛顿特区参加学生抗议活动，她亲眼目睹了这座城市的隔离模式及其脆弱性。当她与一大群跨种族学生一起要求在一家白人专属餐厅用餐时，他们没有被赶出去，因为“我们人数太多”，她指出。“我们中有人意识到，一个规模可观的群体能让吉姆·克劳餐厅颤抖。”毕业后她回到华盛顿，在公共事业振兴署短暂工作，随后离职专注于劳工组织。作为华盛顿特区妇女工会联盟主席，她帮助组织低薪洗衣女工和餐厅工人。战争期间，她领导了一场全市范围的罢工，抗议战时通货膨胀。\n\
  \n到 20 世纪 40 年代末，斯坦是两个年幼孩子的主要照顾者，与丈夫住在特伦顿台地一套拥挤的两居室公寓里。特伦顿台地位于东南区特伦顿广场，是一个以犹太人为主的社区，住满了年迈的新政支持者和自由派活动家。被众议院非美活动委员会称为“左派巢穴”的特伦顿台地吸引了成群结队的联邦调查局特工，他们监视斯坦一家及其邻居，并翻找他们的垃圾。作为当地进步党分部的秘书，她学会了淡化自己的共产党背景，但从未放弃。³⁹\n\
  \n在*赫德案*判决七个月后的 1948 年 12 月，一本煽动性的 91 页小册子《华盛顿的隔离》出版后，斯坦在当地民权斗争中发挥了超乎寻常的作用。这份报告是超过\
  \ 18 个月研究的结晶，包含了引人入胜的轶事、图片和统计数据，剖析了华盛顿的种族实践，揭示了歧视的全貌。它由首都全国隔离问题委员会制作，这是一个总部设在芝加哥的跨种族组织，由朱利叶斯·罗森瓦尔德基金资助。该委员会的成员包括一批令人印象深刻的著名自由派人士，如前第一夫人埃莉诺·罗斯福、联合汽车工人工会的沃尔特·鲁瑟、以及时任明尼阿波利斯市长休伯特·汉弗莱。委员会\
  \ 91 名成员中有 14 人来自华盛顿，包括霍华德大学校长莫迪凯·约翰逊、社会学家 E·富兰克林·弗雷泽，以及无处不在的查尔斯·汉密尔顿·休斯顿。\n\n这份报告面向全国读者，强调了华盛顿在冷战思想斗争中作为“民主象征”的作用。其毫不留情的分析展示了教育、就业、医疗和住房领域的种族歧视，主要归咎于贸易委员会、房地产公司和其他商业利益集团，委员会指责这些集团通过迎合“最不宽容的白人”从歧视中获利。报告还谴责了容忍歧视、帮助这座城市成为“白人至上之都”的哥伦比亚特区专员、住房官员及其他公共当局。报告总结道，只有联邦政府“才有能力打破枷锁，这些枷锁阻碍了华盛顿二十五万黑人享有作为美国人的平等权利。”⁴⁰\n\
  \n《华盛顿的隔离》证实了当地白人保守派长期以来的担忧：精英舆论的势头已显著转向支持民权，至少在国家级层面如此。然而，国会和地方上的种族隔离主义者继续抵制改变他们视为自然和谐的生活方式。《华盛顿的隔离》出版后，公民协会联合会发表了一份长达八页的愤怒声明，抨击该报告对华盛顿种族关系的“恶意歪曲”描述。该组织将种族对抗的根源追溯到重建时期，警告说“危险地一夜之间废除”隔离“将带来混乱，进一步激化两个种族，并为种族误解之火添柴”。它认为，与其“通过立法或行政命令”强行推行融合，华盛顿的黑人反而“必须诉诸多数族裔成员的公平和开明态度，而最终决定权掌握在他们手中。”⁴¹\n\
  \n但几十年来，种族改革者一直在向白人的“公平和开明态度”呼吁，收效甚微。仅靠道德劝说不足以摧毁吉姆·克劳——它需要直接行动，无论是在街头还是在法庭上。1948\
  \ 年底《华盛顿的隔离》的出版，紧随*赫德案*判决之后，加速了种族进步。次年，华盛顿举办了种族融合的总统就职典礼，当地白人教区学校取消了种族排斥，国家动物园和华盛顿国家机场废除了隔离政策。国家首都公园与规划委员会增加了一名黑人建筑师，并从其规划地图中删除了所有种族标识。“按照目前的进步速度，用不了多久，华盛顿可能就不再是国家的耻辱了，”一位观察者写道。⁴²\n\
  \n然而，仍有更多斗争，尤其是在对抗隔离的私营企业方面。《华盛顿的隔离》激励活动人士通过公开所谓的“失传法律”的发现来挑战私人种族歧视。在 1943-44 年的学生静坐运动期间，霍华德法学院图书馆员\
  \ A·默瑟·丹尼尔在进行背景研究时发现，1872 年一项禁止华盛顿特区企业种族歧视的法律从未被废除。该法律要求餐馆、理发店、“冰淇淋沙龙”及其他场所为“任何体面、行为端正的人提供服务，不论其种族、肤色或之前的奴役状况”。到\
  \ 19 世纪末，隔离的习俗和法律已在华盛顿全面确立，市政官员不再执行重建时期的反歧视法规。当官员们在 1901 年编写华盛顿特区法典时，他们根本没有纳入这些法律。“由于没有该法律被废除的记录，”《华盛顿的隔离》指出，“一些律师推测，它在技术上可能仍然完全有效。”⁴³\n\
  \n\n\n\n查尔斯·汉密尔顿·休斯顿加入了一个由约瑟夫·福雷尔和大卫·雷恩领导的律师团队，这两位犹太律师隶属于全国律师协会，旨在终结投机行为；黑人律师兼未来法官玛格丽特·海伍德也加入了该团队。法律研究几乎没花多少时间。福雷尔回忆说，团队只用了不到一个下午就确定，1872\
  \ 年的法律连同 1873 年的另一项法律确实仍然有效。然而，法庭挑战却耗时四年，而休斯顿未能亲眼见证其结局——他于 1950 年 6 月因心脏病去世，成为自己不懈工作精神的牺牲品。⁴⁴\n\
  \n1949 年 5 月，律师们向特区专员提交了他们的发现，并呼吁他们执行反歧视法律。专员们将法律问题推给了市法律顾问，后者拖延了数月毫无行动。为了向官员施压，安妮·斯坦因和其他当地活动家决定通过直接行动来强化反歧视法律的法律依据，以引起公众关注。他们创建了迄今为止可能最有效的民权委员会：华盛顿特区反歧视法律执行协调委员会。尽管名称冗长，但该组织在对抗顽固的种族隔离企业时表现得相当灵活，这些企业要么隔离顾客，要么让黑人顾客在后窗服务，或者以其他方式歧视黑人。⁴⁵\n\
  \n协调委员会由斯坦因和玛丽·丘奇·特雷尔领导，这两位女性来自不同的种族、宗教、风格和世代，但共同拥有终结吉姆·克劳制度的坚定决心。86 岁的特雷尔是华盛顿民权运动的贵妇人，她一直是种族平等的强烈倡导者。她欣然接受协调委员会主席的角色，愿意走上纠察线，在公职人员面前作证，或者拦住记者表达自己的看法。\n\
  \n如果说特雷尔是这场运动优雅的面孔，那么斯坦因就是其中的肾上腺素。这位精力充沛、不知疲倦的 36 岁女性是一股旋转的自然力量。她沙哑的嗓音、粗俗的语言和狂热的精力与她所崇拜的庄重、威严的特雷尔形成了鲜明对比。她将理想主义者对种族正义的承诺与指挥官对战略和后勤的掌控融为一体。斯坦因在自己的公寓里运营委员会的事务。委员会成员深情地回忆起她“通常手里拿着油印机的手柄，站在卧室里，彻夜不停地印制传单、信件或新闻稿”。正是斯坦因说服特雷尔担任该组织的领导人。在近四年的时间里，两人是这场运动的核心与灵魂。⁴⁶\n\
  \n“种族隔离不会自行逐渐消亡，”斯坦因在 1949 年 12 月给委员会成员的一份备忘录中写道。为了摧毁它，她策划了一场多方面的系统性攻击。她承认，恢复“失落的法律”可能看起来“范围有限”，但通过更尖锐地揭露当前学校、娱乐、电影等方面的不平等现象，它将“对整个种族隔离模式产生强大的影响”。在数十个当地民间组织的支持下，委员会可以同时展开多条攻击线。它向公众宣传“失落的法律”以及华盛顿特区歧视的严重程度；与当地企业谈判，鼓励它们废除种族隔离；策划并协调对不合作商店的纠察和抵制；游说市专员、国会和总统采取立法行动；并提起诉讼，以赢得司法对废除种族隔离的认可。⁴⁷\n\
  \n委员会的首轮攻势是直接挑战一家当地餐馆的种族隔离，以此创建一个测试案例。这个选择并非偶然。委员会选择了汤普森餐厅，这家餐厅五年前曾是霍华德大学静坐抗议的目标。1950\
  \ 年 1 月 27 日，特雷尔带领一个由四名“体面、行为端正”的不同种族委员会成员组成的团体前往汤普森餐厅用餐。经理拒绝为他们服务。“我问华盛顿是否在美国，美国宪法是否适用于这里，”特雷尔回忆道，经理回答说：“我们这里不投票。”这群人没有吃饭就离开了，但实现了更大的目标：制造了一个有据可查的歧视案例，违反了重建时期的法律。⁴⁸\n\
  \n这一事件引发了市官员的回应。几周内，市专员们同意反歧视法律确实仍然有效，对于一个自成立以来一直抵制种族平等的机构来说，这是一个显著的转变。既然市政府现在正式支持这些失落的法律，特雷尔又带领另一个跨种族团体回到汤普森餐厅。他们再次遭到拒绝。于是市政府提起了诉讼。\n\
  \n华盛顿餐馆协会鼓励其成员维持种族隔离政策。一位商人担心，如果为黑人顾客服务，就会“经济自杀”。“为什么？一周之内，这个地方就会被他们挤满，”他声称，“一个月内就会破产。”贸易委员会提供了法律帮助，并代表汤普森餐厅提交了一份法庭之友简报。⁴⁹\n\
  \n随着诉讼在法院系统中推进，委员会试图利用负面宣传的压力，鼓励企业自愿放弃种族隔离政策。它派出跨种族测试小组，以确定哪些白人拥有的企业会为所有顾客服务——国务院和外国大使馆尤其想知道外交官在哪里可以不受歧视地获得服务。随着名单的扩大，特雷尔和斯坦因将其作为与不情愿的经理谈判的筹码。安静的谈判通常很有效，但当管理层特别顽固时，委员会就会出动纠察队。它的第一个目标是位于第七街西北商业区中心的克雷斯吉五分一角店。1950\
  \ 年 12 月，特雷尔身穿及踝毛皮大衣和时尚围巾，拄着手杖，冒着暴风雪领导了第一次纠察。在八周的时间里，一百名志愿者分发了四万多份传单，克雷斯吉改变了政策。⁵⁰\n\
  \n克雷斯吉投降后，第七街上的其他折扣店迅速效仿。委员会希望通过针对赫克特百货公司来重复这一模式，赫克特是第七街上的一家大型商店，大约 25%的业务来自黑人顾客。1951\
  \ 年 2 月，赫克特赞助了一场支持“兄弟周”的广告活动，呼吁平等对待所有人。广告出现后，斯坦因和特雷尔立即行动，质问管理层为什么该店拒绝在地下室午餐柜台为黑人顾客服务；经理声称广告只是“一种姿态”。三个月的谈判失败，5\
  \ 月委员会呼吁抵制。支持者在午餐柜台静坐，向管理层寄送了八千张明信片，并在整个夏秋两季每天组织两小时穿着得体的纠察线。赫克特终于在 1952 年 1 月开始为所有人服务。特雷尔主持了第一次跨种族午餐会。⁵¹\n\
  \n\n\n\n\n私下谈判、负面宣传的潜在风险以及抵制的威胁，使得个别商店开放了服务，但执行“失落的法令”的法律案件却历经曲折。1950 年 7 月，市法院最初驳回了诉讼，声称当国会在\
  \ 1878 年为哥伦比亚特区设立新的专员政府形式，以及 1901 年重写特区法律法典时，这些反歧视法律已被“默示废除”。随后，市上诉法院于 1951 年 5\
  \ 月推翻了这一裁决，裁定反歧视法律确实仍然有效——但市政官员决定在所有上诉用尽之前暂缓执行。1953 年 1 月，美国上诉法院以 5 比 4 的投票结果推翻了下级法院的裁决，裁定这些法律“目前无法执行”。协调委员会转而向最高法院求助。⁵²\n\
  \n在穿越法律丛林的令人沮丧的旅程中，协调委员会每一步都受益于司法部的指导和支持。在向美国上诉法院提交的一份措辞有力的辩护状中，杜鲁门的司法部长菲利普·珀尔曼为废除国家首都的种族隔离制度提出了明确理由，他认为这是“我们民主制度中的一个严重缺陷”。该市的种族隔离不仅违反了联邦政府禁止对联邦雇员进行种族歧视的规定，还损害了国家的外交政策。⁵³\n\
  \n这种联邦政府对废除种族隔离的明确支持在共和党人德怀特·艾森豪威尔执政后得以延续，他在上诉法院裁决后不久就职。在 1953 年 2 月初向国会提交的第一份咨文中，他支持哥伦比亚特区地方自治，并宣布将“利用总统办公室存在的任何权力，结束哥伦比亚特区的种族隔离”。艾森豪威尔的司法部长赫伯特·布劳内尔鼓励民权律师，并在*汤普森*案中提交了一份支持性的辩护状。⁵⁴\n\
  \n最高法院迅速对此案作出裁决。1953 年 6 月 8 日——距上诉法院裁决不到六个月——最高法院在*哥伦比亚特区诉约翰·R·汤普森公司案*中一致裁定，反歧视法律“在哥伦比亚特区政府的所有后续变革中幸存下来……至今仍是适用于特区的法律体系的一部分”。法院以惊人的清晰度，扫清了特区企业中种族隔离的剩余法律依据。⁵⁵\n\
  \n在与她所见的种族偏见斗争了六十多年后，玛丽·丘奇·特雷尔取得了最甜蜜的胜利。这位八十九岁的老人与委员会的一些朋友会面，这群跨种族的人前往汤普森餐厅共进庆祝午餐。经理亲自为他们服务。“得知我这一群体的孩子们不会因为被剥夺了其他种族群体孩子享有的权利而认为自己低人一等，我将死而无憾，”特雷尔欣喜地说。她一年后就去世了。安妮·斯坦因在纽约市哀悼她亲爱的朋友，她在*汤普森*案判决后不久就搬到了那里。接下来的三十年里，她为融合教育而奋斗。她于\
  \ 1981 年去世。⁵⁶\n\n经过近十年协调一致的抗议，华盛顿特区平等进入的主要法律障碍大多已被清除。基于种族的限制性契约失去了法律效力；企业、餐馆和剧院现在为所有种族的顾客提供服务；当地大学和私立中学实现了学生融合；第一个融合公共住房开发项目斯坦顿住宅区在盛大的欢呼声中开放；公共娱乐区向所有人开放。“特区人民正在稳步摆脱种族隔离的旧有不公，”《晚星报》的编辑们在\
  \ 1952 年一篇赞许的社论中写道。⁵⁷\n\n但一个长期存在的障碍依然存在，一位活动家称之为“华盛顿种族隔离的堡垒”：公立学校。双轨学校系统也时日无多，但其故事值得特别关注。而这个故事始于一位黑人理发师，他竟敢挑战该市战后的政治体制，无论是白人还是黑人。⁵⁸\n\
  \n### *“这种事不会发生在白人孩子身上”：家长活动家挑战隔离且不平等的学校*\n\n加德纳·毕晓普是个健谈的人。作为理发师的儿子，他在北卡罗来纳州落基山高中辩论赛中获奖，但从未上过大学。他于\
  \ 1930 年搬到华盛顿，在当地一家理发店找到剪发的工作，但他的嘴巴却成了累赘。他无法克制地挑战白人顾客的种族主义言论，最终被解雇。随后，他开了一家面向黑人顾客的理发店——位于西北\
  \ U 街 1515 号的 B&D 理发店，一直经营到 1985 年退休。只需三十五美分，顾客就能剪个头发，并听这位粗鲁、不修边幅、直言不讳的店主唠叨一番。\n\
  \n这位体格魁梧、留着胡子的“U 街理发师”通常避开白人华盛顿，但他不是那种会默默忍受该市种族隔离习俗的人。当他的大女儿朱迪恩四岁时，他让她在家附近一个空荡荡的游乐场玩耍。一名白人特区警察停车，指着游乐场入口处的“仅限白人”标志；毕晓普回答说：“她不识字。”这句话让他被带到警察局并罚款\
  \ 10 美元，但他因反抗了这种有辱人格的制度而感到满足。⁵⁹\n\n毕晓普不喜欢白人的方式，但他也鄙视他所谓的“自命不凡的黑人”的习惯，即那些在 20 世纪\
  \ 40 年代中期主导活动家圈子的更富有、受过良好教育的黑人精英。在他看来，当地的全国有色人种协进会是一个傲慢的“社交团体”，其成员看不起贫穷和工人阶级的人，而这些人正是他的顾客、邻居和朋友。他认为，黑人穷人面临着“双重吉姆·克劳”。“我是黑人，我又穷，所以我被双重隔离。”他憎恨黑人学校官员控制黑人学校——称为“第二分部”（白人学校是“第一分部”）——并以牺牲贫穷的黑人多数为代价来保护自己人。⁶⁰\n\
  \n毕晓普的愤怒在 1947 年爆发，当时过度拥挤迫使朱迪恩（当时已是青少年）只能部分时间在布朗初中上学。他和其他工人阶级家长试图让他们的孩子转到另一所学校，但黑人管理人员拒绝转学，“除非你是个大人物，”他回忆道。“如果你没有正确的关系，你的孩子就留在那个沼泽里。”毕晓普成为布朗家长们的直言不讳的倡导者。“我比任何人都能说，而且我为自己工作，所以白人不太可能惩罚我，”他说。他们最初针对黑人学校官员的抗议很快演变成一场对特区整个隔离学校系统的广泛且最终成功的攻击。⁶¹\n\
  \n\n\n\n\n父母们的愤怒可以追溯到第一次世界大战后几十年间华盛顿特区黑人学校的恶化。尽管邓巴高中仍然是华盛顿精英黑人的骄傲，但总体而言，该市的黑人学校系统难以应对黑人人口的快速增长，尤其是当来自南方农村的受教育程度较低的移民涌入城市时。人口结构的变化引发了资金危机，部分原因是\
  \ 1864 年的一项法律要求该市根据十年一次人口普查中黑人和白人学龄儿童的数量来分配学校资金。⁶²\n\n该法律最初旨在确保黑人学校获得城市收入的公平份额。但到了\
  \ 20 世纪 30 年代，它却让黑人学校系统吃了亏，因为随着黑人学生人数的激增，白人学校正在萎缩。白人学生人数在 1935 年达到顶峰，此后随着越来越多的白人家庭搬到郊区或选择送孩子上私立学校，人数稳步下降。1935\
  \ 年至 1947 年间，白人学生人数下降了 15%，而黑人学生人数增加了超过 28%。到 1950 年，黑人学生成为华盛顿特区公立学校的大多数。由于 1864\
  \ 年的法律，黑人学校每名学生获得的资金比白人学校少，因为在两次十年人口普查之间，黑人学生人数增长而白人学生人数减少。1946 年，白人学校每名学生花费约 27%更多（160.21\
  \ 美元），而黑人学校为 126.52 美元。到 20 世纪 40 年代末，该市的第二分区学校系统陷入危机，学校过度拥挤，教师工作过度，管理人员不堪重负。⁶³\n\
  \n朱迪恩·毕晓普就读的学校就是这些问题的典型例子。布朗初中于 1932 年开放时是一座现代化设施，服务于华盛顿东北部快速发展的黑人社区。布朗初中设计容纳 783\
  \ 名学生，但到 1947 年朱迪恩·毕晓普入学时，学校已挤满 1727 名学生，超过其容量的两倍。⁶⁴\n\n为了缓解过度拥挤，学校董事会实施了错峰上课政策，学生只获得四个半小时的教学时间——远低于董事会自己设定的六小时最低标准。教师教授两个班次，班级规模高达\
  \ 58 名学生。没有实验室，只有一个供学生使用的小体育馆。仅一英里之外，白人学生在日益空旷的艾略特初中里闲逛，那里有空置的教室、未充分利用的空间，还能再容纳\
  \ 200 名学生。一位白人学校官员称其为“显著的尴尬”，因为“教室空置，而黑人孩子却不得不经过这些学校才能到达他们拥挤的学校。”⁶⁵\n\n许多黑人家长看到了一个明显的解决方案：通过将黑人学生转移到未充分利用的白人学校来短期缓解过度拥挤。然而，学校官员陷入了两难境地。他们致力于维持隔离制度，担心日益加剧的种族差距可能引发法律诉讼或联邦干预，但他们又担心将现代化、设备齐全、为白人孩子建造的学校转移给黑人只会鼓励更多白人家庭离开该系统。督学霍巴特·康宁坚持认为，黑白学校之间的任何差距都只是由环境造成的，并在学校董事会的支持下，开始向第二分区学校注入资金，试图迟来地实现设施均等化。1947\
  \ 年，学区 72%的建设资金流向了黑人学校。⁶⁶\n\n尽管学校董事会中的黑人成员经常提出抗议——根据法律，学校董事会由六名白人成员和三名黑人成员组成，全部由联邦法官任命——但董事会仍然致力于维护该市学校的种族界限。1944\
  \ 年，前全国黑人大会主席约翰·P·戴维斯向董事会请愿，要求让他五岁的儿子进入位于布鲁克兰东北部社区家附近的一所白人学校。焦虑的学校官员迅速在戴维斯家对面购买了土地，并搬迁了九个黑人家庭，为戴维斯的儿子建造了一间临时的单间“学校”，直到可以建造更大的建筑（如今玛丽·麦克劳德·贝休恩特许学校就坐落在此地）。⁶⁷\n\
  \n三年后，一名叫卡拉·加拉尔萨的墨西哥裔美国学生进入一所黑人职业学校，跟随一位曾在纽约和巴黎学习过的熟练教师学习服装设计课程。她的选择违背了关于黑人学校低人一等的传统观念，并使种族身份受到质疑。学校董事会认定加拉尔萨和其他墨西哥裔美国人是白人，因此*必须*上白人学校；她被她选择的学校开除了。她的父亲是一位拥有哥伦比亚大学博士学位的劳工领袖，谴责了这一决定，并呼吁学区领导人辞职，“为我们国家首都的教育工作者让路，他们能够以\
  \ 1947 年而非 1867 年的眼光来看待华盛顿。”⁶⁸\n\n布朗初中和其他黑人学校的情况引起了越来越多的批评，尤其是来自首都种族民主委员会的积极分子。该跨种族委员会成立于\
  \ 1946 年 5 月，旨在提高全国对华盛顿种族做法的认识。“不可否认的事实是，除非华盛顿的隔离学校被终结，否则整个种族隔离的社会模式将保持不变，”黑人报纸《匹兹堡信使报》华盛顿版的编辑们写道，他们帮助发起了该组织。《华盛顿邮报》的艾格尼丝·迈耶是该组织公共信息委员会的成员，她在\
  \ 1947 年 3 月发表了一篇关于布朗初中状况的长篇揭露文章。迈耶对布朗初中“彬彬有礼”的学生、“有教养”的教师和“沉着冷静”的校长描绘了同情的形象，同时谴责学校官员对布朗初中和其他黑人学校面临的问题漠不关心。⁶⁹\n\
  \n布朗初中的状况促使该校家长教师协会的家长于 1947 年 4 月向学校董事会请愿，要求将黑人学生转移到艾略特初中。这份以布朗初中学生玛格丽特·卡尔（家长教师协会主席的女儿）名义提交的请愿书及随后的董事会陈述，详细描述了学校过度拥挤如何剥夺了卡尔及其同学接受充分教育的机会。督学康宁承认了这些缺陷，但拒绝转移任何学生。作为回应，卡尔一家、家长教师协会及其全国有色人种协进会的律师提起了集体诉讼。⁷⁰\n\
  \n随着“卡尔诉康宁案”在法院审理过程中，不满的家长们反抗了黑人领导层。一场官司可能需要数年时间；与此同时，布朗初中的入学人数已飙升至 1800 人以上，且没有见顶的迹象。学校官员决定通过将两所陈旧、设备简陋的白人小学移交给黑人系统供布朗初中学生使用来缓解过度拥挤，这一举动遭到了黑人家长的强烈谴责。“普通家长根本不在乎孩子是否上白人学校，但他们不希望孩子必须被隔离的事实被用作借口，让他们接受白人抛弃的、低于标准、过时、二手的学校设施，”家长内莉·V·格林争辩道。这一决定促使一个草根家长团体成立，将争端从董事会会议室和法庭带到了街头。⁷¹\n\
  \n\n\n\n\n在后来成为布朗家长教育机会平等小组的第一次会议上，超过 160 位家长签署了一份请愿书，提交给学校董事会，宣布了一项大胆的公民抗命行动：除非学校董事会提供“足够的措施来缓解非全日制教学”，否则他们不会送孩子上学。加德纳·毕晓普成为了该小组言辞犀利、备受瞩目的发言人，但他绝非这场运动的唯一推动力。超过一半的请愿签署者是家庭主妇或退休女性，两位联合主席更是此前在政治活动中颇为活跃的女性：内莉·格林和国会观景公民协会领袖乔伊·P·戴维斯。她们是一个自豪的草根团体，但从一开始，其成员就涵盖了黑人社区中各个阶层的人士。⁷²\n\
  \n罢工于 1947 年 12 月 3 日开始。家长们分别在布朗小学和位于市中心的宏伟的富兰克林学校（教育委员会办公室所在地）进行纠察。他们还拜访了地方和联邦官员，亲自陈述诉求（尽管白宫警卫阻止了他们向杜鲁门总统当面请愿）。随着罢工持续到\
  \ 1948 年 1 月，来自学校官员的压力、布朗小学校长及其他黑人领袖的批评，以及罢工本身带来的困难，开始对家长们造成影响。纠察线变得稀疏，毕晓普和布朗家长小组的其他领导人转而求助于全国有色人种协进会（NAACP）多管齐下打击华盛顿特区种族隔离政策的核心人物：查尔斯·汉密尔顿·休斯顿。⁷³\n\
  \n尽管毕晓普对精英黑人领袖心存疑虑，但他与休斯顿一见如故，并在接下来的一年里成为了坚定的盟友和亲密的朋友。休斯顿承诺将提起一系列诉讼，旨在实现学校设施的平等。他的第一轮攻势是一起诉讼，指控教育委员会成员个人应对“故意拒绝实现教育平等并明知故犯地延续不平等”负责。休斯顿指出布朗小学学生所承受的负担，并简洁地论证道：“这种事不会发生在白人孩子身上。”随着诉讼的提起和策略的制定，休斯顿和布朗家长小组于\
  \ 2 月 2 日停止了罢工。次日，官员们采纳了一项修订计划，整合了五栋建筑，以确保所有布朗小学的学生都能接受全天课程。⁷⁴\n\n为期两个月的罢工标志着学校抗议进入了一个新阶段。家长们不再畏惧在必要时采取公民抗命，他们组织起来挑战学校当局，并要求在学校决策中拥有发言权。作为家长，罢工领袖们拥有无可置疑的公信力，他们帮助将学校不平等问题戏剧化地呈现出来，并迫使官员们回应他们的关切。尽管家长们未能实现其直接目标——学校官员并未将艾略特初级中学转交给黑人学生——但罢工的影响远远超出了布朗小学。\n\
  \n这场罢工促使加德纳·毕晓普、乔伊·戴维斯以及其他布朗家长小组的领导人于 1948 年 9 月成立了联合家长小组，以在全市范围内对抗学校歧视。毕晓普担任该小组主席。由于此时已有三名理发师为他工作，他得以灵活安排时间与休斯顿会面、组织纠察、与媒体交谈、收集请愿签名以及采集证词，以支持休斯顿正在进行的各项诉讼。该小组为休斯顿及其法律团队提供了强大的草根力量，并在诉讼推进过程中帮助保持了势头。⁷⁵\n\
  \n布朗小学的罢工也促使国会采取行动。来自伊利诺伊州的共和党人、支持民权的众议员埃弗雷特·德克森，作为众议院哥伦比亚特区委员会的新任主席，对罢工家长提出的问题感到不安，呼吁对该市的学校进行彻底调查。委员会聘请了哥伦比亚大学师范学院杰出的教育学名誉教授乔治·D·斯特雷耶，带领一个由\
  \ 22 名研究人员组成的团队。斯特雷耶那份长达 980 页、措辞犀利的报告毫不留情地批评了学区的“反应迟钝”的管理层、“复杂、僵化且笨拙”的财政体系，以及“不足”的设施、资金和学术项目，尤其是在黑人学校中。⁷⁶\n\
  \n斯特雷耶报告于 1949 年 2 月发布，证实了黑人家长和活动人士长期以来关于黑人学校资金严重不足、师资匮乏、校舍破旧的指控。他的批评不能被斥为受共产主义煽动的家长的牢骚或煽动性律师的伎俩。斯特雷耶报告在决策圈被广泛阅读，当黑人家长、社区活动人士和\
  \ NAACP 律师在首都针对法律上的种族隔离学校做出最后决定性的论证时，该报告成为了关键证据。⁷⁷\n\n### *“有辱人格、令人沮丧、不民主、且对整个国家有害”：华盛顿特区法律上种族隔离学校的终结*\n\
  \n斯特雷耶报告发布后，学校官员面临着越来越大的压力，需要解决严重的过度拥挤问题。这一问题在中学阶段尤为突出：黑人高中的容量超负荷超过 50%，而白人高中的容量则闲置近\
  \ 25%。位于西北区第九街和罗得岛大道拐角处一栋破旧建筑中的黑人卡多佐高中，该建筑是白人系统二十年前废弃的，容纳了超过 1700 名学生——是其容量的两倍——并且没有操场或娱乐区。课程在走廊、地下室房间甚至室外进行。⁷⁸\n\
  \n斯特雷耶报告建议完全关闭卡多佐高中，但学生该去哪里？考虑到高中生的课程和项目需求，学校官员不能像以前那样简单地将使用不足的白人小学转拨过来。相反，到 1949\
  \ 年中期，黑人家长和活动人士开始推动董事会接受一个简单但政治上冒险的解决方案，甚至连斯特雷耶都不敢建议：将中央高中划归黑人系统。\n\n自 1945 年战争结束以来，学校官员已将近十几所白人学校转拨给了黑人学生。但中央高中并非普通设施。它成立于\
  \ 1882 年，于 1916 年迁至西北区第十三街和克利夫顿街拐角处一块九英亩的土地上，学区在那里建造了一座“山巅城堡”，以匹配麦克米兰规划中那些闪闪发光的纪念碑。中央高中巍然耸立在一处陡峭的高地上，可俯瞰市中心的全景，它是一座建筑奇迹、一个社区地标，也是白人华盛顿的骄傲与喜悦。该校的\
  \ 47000 名校友中包括华盛顿一些最杰出的领袖。中央高中宛如一所小型学院，拥有橡木镶板的图书馆、多个实验室、数个体育馆、一条室内跑道，甚至还有一个军械库和步枪靶场。该学校设计容纳\
  \ 1950 名学生，但到 1948 年，其入学人数已减少到 1437 人。黑人家长和活动人士觊觎这座宽敞的建筑，以缓解过度拥挤问题，并让黑人学生能够使用一流的设施。⁷⁹\n\
  \n\n\n\n\n将中央高中划归黑人学区的想法，在 1948 年布朗家长罢工后就开始在活动人士中酝酿，而斯特雷耶报告中列出的惊人数据则推动了全市范围的“中央高中归卡多佐”运动。这场运动将布朗罢工动员起来的家长活动人士与全市更广泛的民权社群联合起来。早期一位有效的倡导者是保罗·库克，他是迈纳教师学院的教授，也是当地黑人教师工会的负责人。库克毕业于邓巴高中，拥有哥伦比亚大学教育学博士学位，他将斯特雷耶报告提炼成一份有力的论据，主张将卡多佐的学生转到另一所学校。⁸⁰\n\
  \n加德纳·毕晓普和联合家长团体支持库克，他们在 1949 年中期征集了一万份签名，向学校董事会提交了一份请愿书，要求“立即缓解”过度拥挤问题。活动人士向学校董事会成员寄送大量信件，并发动了一场高调的媒体宣传。他们刊登整版广告，并频繁致信当地报纸编辑，引用斯特雷耶报告，并宣扬得到了包括全国有色人种协进会、美国退伍军人委员会和华盛顿特区妇女选民联盟（由一位中央高中校友领导）在内的跨种族公民组织联盟的支持。“这不是一场由黑人发起或为黑人而战的斗争，”一则广告写道，“而是一场由美国人发起、为美国人而战的斗争。”⁸¹\n\
  \n将中央高中划转，在一些白人保守派看来是阻止全面融合的一种方式——一位公民协会联合会成员警告说：“如果你不给他们平等的机会，你就会发现平等的机会被强加于你。”但失去这所备受珍视的学校的前景，让大多数白人华盛顿人感到震惊。“中央高中不仅仅是一种传统，”一位愤愤不平的校友在给学校董事会主席的信中写道，“它是一股向善的活生生的力量。”愤怒的白人家长和校友在\
  \ 1949 年 9 月的公开听证会上抨击学校董事会，并花了数月时间动员反对这一想法。⁸²\n\n尽管白人校友抗议，学校董事会还是在 1950 年 3 月以 5\
  \ 比 2 的投票结果决定将中央高中划转。两名白人成员与所有三名黑人成员一起支持划转。愤怒的中央高中校友坚持要求学校不再使用刻在哥特式拱形入口上方石头上的名字。学校官员照办了，将中央高中从教育版图上抹去。这栋建筑成为卡多佐高中的所在地，至今仍矗立在山顶上俯瞰市中心（尽管入口上方刻着的“中央”字样仍然可见）。⁸³\n\
  \n或许不亚于任何法院判决或事件，中央高中的失去让保守的白人华盛顿人确信，这座城市不再属于他们。即使是中央高中强大校友的强烈反对，也未能动摇联邦任命官员的决定，这些官员正努力应对众多相互冲突的利益，其中包括一个声音响亮、日益壮大的跨种族地方和全国活动人士网络。失去中央高中帮助瓦解了白人对废除种族隔离努力的抵抗。尽管白人公民协会仍然活跃，但他们的努力变得更加尖锐，效果却更差。一种悲观情绪弥漫在保守的白人华盛顿人中，感觉战争已经失败，即使他们仍能在某处赢得一场战斗。⁸⁴\n\
  \n中央高中变成了卡多佐，但该市的学校系统仍然实行种族隔离，学校董事会也没有整合计划。它得到了联邦上诉法院的支持。1950 年 2 月，就在学校董事会决定划转中央高中的一个月前，联邦上诉法院在*卡尔诉康宁案*中给了民权力量一次令人沮丧的打击，该案是两年前布朗家长罢工前不久提起的集体诉讼。法院多数意见认为没有发现歧视黑人学生的证据，并裁定学校种族隔离既符合宪法，也得到国会的支持。⁸⁵\n\
  \n但种族平等主义者从亨利·埃杰顿法官充满激情的反驳中得到了鼓舞，这位法官在限制性契约案件中具有先见之明的异议意见，预示了最高法院在 1948 年*赫德诉霍奇案*中推翻先例的判决。埃杰顿再次以\
  \ 2 比 1 的投票结果落败，他在*卡尔诉康宁案*中又写了一篇毁灭性的异议意见。这位特立独行的法官谴责多数意见忽视了斯特雷耶报告，他大量引用该报告以表明存在“白人和黑人学校之间的巨大不平等”的明确证据。“哥伦比亚特区不是一个地方性社区，而是一个自称民主的国家的国际化首都，”埃杰顿总结道，法院不必等待国会来纠正这一明显的不公正。⁸⁶\n\
  \n*卡尔案*的判决，加上查尔斯·汉密尔顿·休斯顿两个月后去世，促使法律策略发生了重大转变。在休斯顿的指导下，联合家长团体提起了多起旨在使隔离学校资源均等的案件。在临终之际，休斯顿鼓励该团体联系他在霍华德法学院的同事詹姆斯·纳布里特。纳布里特是佐治亚州一位牧师才华横溢的儿子，以西北大学法学院班级第一名的成绩毕业，他对这些案件不感兴趣——他认为均等化策略已经走到了尽头。他提出，只有当他们直接攻击种族隔离本身时，他才愿意成为该团体的律师。毕晓普和联合家长团体同意了。他们聘请了纳布里特，并开始寻找一个测试案例。\n\
  \n他们在东南区的索萨初中找到了一个案例。在学校官员宣布将于 1950 年秋季开放索萨初中后，联合家长团体要求黑人学生享有完全的使用权。由黑人助理督学加内特·威尔金森领导的学校官员建议将旧的伯尼学校交给黑人学生，这引发了黑人家长的强烈抗议。那年九月，他们向教育委员会陈述了他们的诉求，用毕晓普的话说，他们辩称“双轨制从未产生过平等，普遍规律是黑人儿童总是承受不平等的重负。”⁸⁷\
  \ 家长们在纸板请愿书上写道，隔离教育“对这个国家整体而言是侮辱人格、令人沮丧、不民主且有害的。”⁸⁸ 当学校董事会拒绝让步时，他们代表十一岁的斯波茨伍德·博林起诉了董事会主席梅尔文·C·夏普。\n\
  \n*博林诉夏普案*与组成*布朗诉托皮卡教育委员会案*的四个相关案件一并裁决。律师詹姆斯·纳布里特和乔治·E·C·海耶斯（他曾在 1947 年作为学校董事会成员谴责过布朗家长罢工）于\
  \ 1952 年 12 月 10 日向最高法院陈述了他们的论点；大法官们一年后重新审理了此案。\n\n\n\n\n\n如同*布朗案*中的律师一样，纳布里特和海斯强调了该案审理时的国际背景，指控种族隔离学校违反了《联合国宪章》，并削弱了美国在世界上的领导地位。但*博林案*因其独特的政治地位而与众不同。纳布里特和海斯无法使用第十四修正案来主张黑人学生被剥夺了法律平等保护，因为该修正案不适用于哥伦比亚特区，只适用于各州。相反，他们利用第五修正案的正当程序条款，质疑国会在该市推行双轨制学校的权力。与*布朗案*中的律师不同，他们从未提出平等设施或黑白学校系统之间的差异问题，也没有主张隔离本身就是不平等的。相反，他们只关注学校官员是否有权以种族为由拒绝学生进入苏萨学校。“我们主张，在本案中，在国家首都的心脏地带，在民主的首都，在自由世界的首都，没有种族隔离学校系统的容身之地，”纳布里特总结道，“这个国家承受不起，宪法不允许，国会法令也未授权。”⁸⁹\n\
  \n学校董事会的律师米尔顿·D·科尔曼表达了众多华盛顿白人对失去双轨制学校系统及其整个种族隔离生活方式的沮丧。作为土生土长的华盛顿人和中央高中的校友，科尔曼强调了白人建立种族隔离学校的良好意图。“双轨制学校并非为了给这些（黑人）人打上低人一等的烙印而设立，”他辩称。相反，它源于一种“善意”——学校官员只是希望黑人孩子“在一个他们被需要的地方、在一个他们不会受到敌视的地方”接受教育。他推测，也许随着时间的推移，一旦“这两个种族能够和平共处、没有摩擦、没有敌意、没有任何事件发生这一主张被普遍接受”，学校就可以实现融合。然而，在此之前，他敦促法院将这个问题留给国会处理。科尔曼的哀怨诉求未能打动法院的任何一位大法官。⁹⁰\n\
  \n在最高法院审议*博林案*期间，学校董事会艰难地思考如何为即将到来的判决做准备。当董事会征求社区成员关于如何最好地废除学校种族隔离的意见时，国会和当地公民协会中愤怒的种族隔离主义者谴责这一行为是“僭越”。在采取观望态度后，董事会发现自己受到了新成员玛格丽特·贾斯特·布彻的攻击，她于\
  \ 1953 年 6 月加入该机构。布彻是邓巴高中的毕业生，拥有波士顿大学的博士学位，这位身材娇小、41 岁的英语教授举止得体、风度迷人、衣着时尚。但布彻对学校中的不平等现象以及学校官员的拖延行为提出了严厉批评。在每次董事会会议上、每份报纸上、每个机会中，布彻都推动行政人员在最高法院做出任何裁决之前主动采取废除种族隔离的措施。而他们则倾向于等待法院的判决。⁹¹\n\
  \n法院的判决于 1954 年 5 月 17 日下达。“我们认为，在哥伦比亚特区公立学校中实行种族隔离，是对宪法第五修正案所保障的正当法律程序的剥夺，”新任首席大法官厄尔·沃伦在*博林诉夏普案*一份\
  \ 550 字的简短意见书中写道。该市长达 92 年的种族隔离学校实验就此结束。“我认为这对这个国家来说是一件了不起的事情，”原告斯波茨伍德·博林的母亲莎拉·博林说，她的儿子当时\
  \ 15 岁。“现在我们可以在世界面前昂首挺胸了。”⁹²\n\n### *“社会调整的奇迹”：学校废除种族隔离及其后果*\n\n联邦和地方官员迅速对*博林案*的判决做出回应。艾森豪威尔总统立即告诉市专员，他希望华盛顿成为全国的榜样，八天内，学校董事会就批准了一项关于教师和学生安置的非歧视决议。随后，科宁总监提出了一项逐步废除种族隔离的计划，涉及\
  \ 1954 年秋季有限数量的学校，其余学校则等到 1955 年秋季再废除种族隔离。该计划还允许学生选择在原校完成学业。⁹³\n\n科宁的计划在玛格丽特·贾斯特·布彻和家长倡导者看来过于缓慢和复杂。布彻指责总监制造了“一个棋盘式方案，规定一定数量的黑人学生被送到一定数量的白人学校，从而将黑人学生视为闯入者，实际上只解决了学校过度拥挤的问题。”该计划不顾她的反对而通过。⁹⁴\n\
  \n那年 9 月，学校官员将约 2700 名黑人学生转到了以前全是白人的学校，而白人学校也向居住在邻近社区的黑人学生开放。该学区约有一半的学生进入了至少名义上融合的学校。（具有讽刺意味的是，斯波茨伍德·博林本人就读的是一所全是黑人的学校。）最初几周平安无事，考虑到其他南方城市在废除种族隔离时爆发的暴力和混乱，这堪称一项了不起的成就。⁹⁵\n\
  \n报纸欢呼雀跃，学校行政人员松了一口气，但 10 月初，在官员将更多黑人学生转到白人学校后，暗流涌动的紧张局势爆发了。作为抗议，来自阿纳科斯蒂亚、东部和麦金利高中以及几所初中的多达\
  \ 2900 名白人学生举行了为期三天的罢课。罢课学生与他们的父母和牧师一起举行了示威活动，包括沿着尼科尔斯大道（现马丁·路德·金大道）游行，推着婴儿车的母亲们举着标语。大约\
  \ 50 名阿纳科斯蒂亚学生的一群人在最高法院前抗议。“我们一生都被灌输黑人低人一等，当你一生都被这样教导时，改变并不容易，”一名学生解释道。在科宁总监威胁说如果学生不返回课堂就取消他们的课外活动后，抗议活动迅速平息。此后没有出现更多有组织的反对废除种族隔离的抗议活动。⁹⁶\n\
  \n到 1955 年秋季，地方和全国媒体称赞该市学校经历了“异常平稳的一年”。《晚星报》的五篇系列报道描绘了认真的学生、教师和行政人员合作努力使废除种族隔离取得成功，尽管存在“夸大”的恐惧和谣言。向种族混合学校的相对顺利过渡被视为该市已接受废除种族隔离的证据。“华盛顿人认为国家首都的融合‘进展顺利’，”《邮报》发表的一项调查声称。支持者称赞该学区，并预示着种族关系的新时代。⁹⁷\n\
  \n![Image](img/f0001-17.jpg)\n\n*在最高法院于*博林诉夏普案*（1954 年）中裁定学校种族隔离违宪后，华盛顿特区的公立学校相对迅速地废除了种族隔离。零星的抗议活动爆发，包括\
  \ 1954 年 10 月阿纳科斯蒂亚白人家庭的这次游行。经华盛顿特区公共图书馆星报收藏许可转载，©《华盛顿邮报》。*\n\n\n\n\n\n这种乐观的评估高估了华盛顿白人对废除种族隔离的接受程度。到\
  \ 1954 年，在与日益强大的反对力量进行了近十年的斗争并屡屡受挫后，白人保守派感到四面楚歌、伤痕累累，被民权运动、联邦权力、人口结构变化、不断变化的国际环境以及其他超出其控制的力量所淹没。学校融合过程中没有伴随暴力，这反映的是白人保守派的无奈、无力感以及对法治的勉强尊重，而非对种族混合学校的接纳。\n\
  \n公民协会联合会质疑学生和教师的分配方案，并提起诉讼以阻止学校董事会废除种族隔离计划的实施，但该案很快被驳回。当最高法院于 1955 年 1 月拒绝受理该联合会的上诉时，该组织基本上放弃了。“我想说我们完了，”该组织的律师承认道。沮丧的白人保守派将愤怒转化为一场成功的运动，在\
  \ 1956 年阻止了玛格丽特·贾斯特·布彻再次被任命为教育委员会成员，但他们对学校事务的影响力正在减弱。⁹⁸\n\n由于无法阻止废除种族隔离，许多白人家庭以一种安静、守法但最终具有破坏性的方式表达了对废除种族隔离的反对：将孩子带出华盛顿特区的公立学校。后来被称为“白人逃离”内城区的现象并非始于*博林案*判决，但学校废除种族隔离加速了向郊区迁移的趋势。在*博林案*后的两年内，白人公立学校学生人数下降了\
  \ 29%，从 49,106 人降至 34,758 人。许多全白人学校，包括东部高中，在五年内变成了全黑人学校。到 1965 年，华盛顿特区公立学校中只剩下 15,364\
  \ 名白人学生，仅占学生总数的 10%，而这些学生集中在岩溪公园以西相对富裕社区中绝大多数为白人的学校里。在接下来的半个世纪里，这些数字几乎没有变化。⁹⁹\n\n\
  即使是支持学校废除种族隔离的自由派白人，也常常将孩子带出公立学校。白人学校管理者（后来的学监）卡尔·汉森将其称为“白人困境”，因为白人自由派在思考如何应对他们担心的废除种族隔离学校中可能出现的纪律问题、学术标准下降以及跨种族约会等问题。大多数人得出结论：他们不希望这些发生。汉森本人承认，他也更希望自己的孩子就读于他们作为主导种族群体的学校。¹⁰⁰\n\
  \n尽管到 1956 年，当地有组织的反对学校废除种族隔离的活动已日渐式微，但南方种族隔离主义者刚刚开始一场强大的“大规模抵抗”运动，这场运动将在该地区大部分地区维持种族隔离学校长达十多年之久。这场攻势的关键在于\
  \ 1956 年 9 月由南卡罗来纳州众议员约翰·麦克米伦策划的一系列听证会，旨在让华盛顿特区的学校官员难堪，并污蔑废除种族隔离是不明智甚至危险的。麦克米伦是南卡罗来纳大学的橄榄球明星，曾大力捍卫该州东北部的烟农，在\
  \ 1954 年选举中民主党重夺众议院后，他升任众议院哥伦比亚特区委员会主席。“约翰尼·麦克”是一个公开的种族隔离主义者，在接下来的二十年里一直在华盛顿特区破坏民权。¹⁰¹\n\
  \n麦克米伦成立了一个特别众议院小组委员会，负责调查哥伦比亚特区公立学校标准、条件以及青少年犯罪问题，由佐治亚州民主党众议员詹姆斯·戴维斯领导。该小组委员会六名成员中有四人最近签署了《南方宣言》，承诺“使用一切合法手段推翻”废除种族隔离。凭借\
  \ 7.5 万美元的预算和蓄意找茬的心态，该小组委员会聘请了一名狂热的调查员，并花了九天时间盘问了五十多名学校官员、管理人员、教师和社区成员，内容涉及融合如何造成混乱、降低课程水平，以及让白人学生暴露于结核病、性病和其他健康风险之中。¹⁰²\n\
  \n这些听证会将华盛顿特区的学校融合描绘成一场彻头彻尾的灾难，并向全国发出警告。种族隔离主义者占多数的该小组委员会暗示，拯救华盛顿可能为时已晚，但通过抵抗，白人可以在其他地方防止这种融合的恐怖发生。众议员戴维斯将听证会中最耸人听闻、危言耸听的证词汇编成一本\
  \ 48 页的小册子，并在南方各地分发了五万份。这本小册子充斥着关于性欲过剩、教育程度低下的黑人“少年犯”侵害白人学生和教师的故事，强调“白人与黑人学生之间智力水平的巨大差距”，并坚称华盛顿的融合“不是其他社区可以效仿的模式”。这有助于在全国范围内激发白人对学校废除种族隔离努力的反对。¹⁰³\n\
  \n在戴维斯小组委员会听证会之前、期间和之后，废除种族隔离的支持者们团结起来，为该市融合学校的记录辩护。媒体对听证会进行了抨击——《华盛顿邮报》认为这是一场“蓄意诋毁”——当地宗教和社区领袖成立了华盛顿公立学校委员会，以动员对融合的支持。在小组委员会的严厉质询下，助理学监卡尔·汉森\
  \ defiantly 坚持认为华盛顿的学校融合是“社会调整的奇迹”；几个月后，他写了一本以此为题的小册子，赞扬融合学校中教师和学生的努力。霍华德大学教育学教授埃利斯·诺克斯发表了一项研究，驳斥了该委员会的调查结果。诺克斯写道，特区学校“正在提供比以往任何时候都更高水平的教育”。¹⁰⁴\n\
  \n即使是最坚定的废除种族隔离支持者也没有否认学校中存在严重问题。该小组委员会故意夸大了融合学校中的纪律问题，但黑人学生与白人学生相比学业成绩低下并非种族隔离主义者的凭空想象。玛格丽特·贾斯特·布彻和其他坚定的活动家认识到许多黑人学生存在严重的教育缺陷。“如果黑人孩子从种族隔离学校转到废除种族隔离学校后表现得更出色，我反而会感到惊讶——毕竟他们之前要应对劣质学校、拥挤的班级和教师短缺的问题，”布彻辩称。然而，她并没有像种族隔离主义者那样将责任归咎于融合或黑人的先天劣势。“正是种族隔离延续了黑人的教育落后，”她坚持认为。¹⁰⁵\n\
  \n\n\n\n\n学校反映了城市本身存在的严重问题。到 1957 年底，科宁总监宣布学校废除种族隔离“已完成”，但这并不意味着华盛顿特区的学校实现了融合。“废除种族隔离仅仅是人和物的流动，”科宁指出，“融合是一个更漫长的过程。其成功将取决于在社区中营造有利于教育进步的社会氛围。”然而，全面融合被证明难以实现，因为它与华盛顿面临的更大困境息息相关。“融合不仅暴露了健康与福利方面的问题，也揭示了长期半掩在种族隔离帷幕之后的教育资源直接短缺问题，”同情黑人的白人记者道格拉斯·卡特写道，他于\
  \ 1954 年底为《记者》杂志调查了华盛顿特区的学校。卡特发现，华盛顿是“全国的真正典范”，学校系统内的人们正努力推动融合，但城市领导者需要解决住房、城市发展和经济方面的严重问题，否则华盛顿可能沦为“只有最穷和最富的人继续住在市中心的地方”。¹⁰⁶\n\
  \n问题在于，华盛顿市民对这些困境无能为力。由于缺乏自治权，他们只能任由国会中的特区委员会摆布，而该委员会由主张种族隔离的南方民主党人主导，他们试图惩罚特区在民权方面的进步。“除非华盛顿人民赢得他们长期寻求的地方自治，否则（融合的）成功本身可能导致教育逐渐退化、城市状况普遍恶化，甚至因市中心贫民区进一步蔓延而在学校内形成一种持续的种族隔离，”卡特写道，“如果这一民主进程的重大进步因联邦政府的限制而受挫，阻止华盛顿市民民主地自我管理，那将是一场悲剧。”¹⁰⁷\n\
  \n二战结束后的十年间，华盛顿经历了显著的种族改革，到 1957 年，它已成为全国第一个黑人占多数的主要城市。该市的种族隔离并非逐渐自行消亡——而是由一群跨种族的活动家、家长、律师、作家、联邦雇员及其他致力于平等首都的人士共同努力所终结。这些民权倡导者抓住华盛顿不断变化的政治、经济和人口背景，推动联邦当局支持种族变革。随着学校、餐馆、剧院、交通、公共住房和娱乐区实现废除种族隔离，“首都在其社区生活的各个方面，其融合程度已与国内任何其他城市不相上下，”一位《纽约时报》记者在\
  \ 1956 年声称。¹⁰⁸\n\n但法律上的种族隔离结束并未终结华盛顿的种族不平等，也未能解决特区严重的经济和政治功能失调问题。在 20 世纪 60 年代，寻求建立一个民主、公平城市的华盛顿市民发现，他们的斗争才刚刚开始。\n\
  \n## 第十一章\n\n## 还要多久？还要多久？\n\n### *黑人多数群体中日益增长的挫败感，1956–1968*\n\n直接行动引起了人们对问题的关注，并带来了象征性的改变，但并未带来任何实质性的根本变革。政治和经济力量将带来持久的改变。\n\
  \n——朱利叶斯·霍布森，1964 年\n\n西南区是华盛顿的“继子区域”，城市评论家简·雅各布斯在 1956 年写道，这是一个“被地理排斥”且“受官方任性摆布”的地方。西南区是华盛顿四个象限中面积和人口最小的一个，没有以历史名称命名的独特街区，整个区域仅被称为“西南区”。它在\
  \ 19 世纪中期被称为“岛屿”，历史上在物理和文化上一直与城市其他部分隔绝，最初被臭名昭著的城市运河隔开，后来被一排丑陋的铁路轨道隔开，现在则被混乱的高速公路和出口匝道网络分割。这些混凝土带将西南区切成几块，使其相对难以被外人进入。尽管游客和许多华盛顿市民忽视了西南区，但其历史对于\
  \ 20 世纪 50 年代和 60 年代该市标志性的种族动荡和行动主义至关重要。¹\n\n我们在 21 世纪初看到的西南区并非通过两个世纪的城市发展有机形成。相反，它是在二战后的几十年里突然出现的。20\
  \ 世纪 40 年代末，市政官员、城市规划者及其在本地媒体和商界的盟友越来越担心“向郊区逃离”。城市居民的流失，“是当今华盛顿的核心城市问题”，《华盛顿邮报》的查默斯·罗伯茨在\
  \ 1952 年一篇题为“进步还是衰败？”的系列文章中写道。城市领导者担心内城的“枯萎病”——一个从农业借用的术语，用来描述看似自然的疾病和衰败过程——正在“感染”华盛顿市中心的老旧街区，包括西南区。²\n\
  \n在 20 世纪中期，西南区居住着两万三千名居民，其中超过 70%是黑人，约 90%是穷人。“室内浴室、厨房水槽、中央供暖和电灯是极为罕见的奢侈品，”1942\
  \ 年的一项调查指出；十年后，另一项研究发现 80%的住房单元不合格。记者和摄影师经常将破败的房屋和胶合板厕所与仅几个街区之外的宏伟国会大厦和优雅的联邦建筑并列展示。但西南区也有精心维护的砖木结构联排别墅，前后草坪修剪整齐。事实上，大华盛顿住宅建筑商协会发现，许多房屋“与乔治敦的时尚住宅一样坚固，且在许多情况下同样宽敞”。³\n\
  \n![Image](img/f0001-18.jpg)\n\n*20 世纪 50 年代初的华盛顿西南区居住着两万三千人，其中大多数是黑人和穷人。这张照片前景中的几乎所有建筑都在\
  \ 20 世纪 50 年代和 60 年代作为“城市更新”的一部分被拆除。国会图书馆。*\n\n城市规划者和城市推动者忽略了这种复杂性，将西南区作为全国“城市更新”运动的起点。这是一项联邦支持的努力，旨在利用现代规划来振兴和重建破败的住宅区。倡导者警告说，如果不采取协调行动，城市将因就业、购物者和纳税人流失到郊区而萎缩。在华盛顿，城市更新的推动力是重建土地局（RLA），该机构由国会于\
  \ 1945 年成立，旨在购买破败的城市地块，清理后以低价提供给私人承包商进行再开发。在当地百货业巨头马克·兰斯伯格的领导下，RLA 优先考虑吸引中产阶级居民和购物者返回城市的项目。该机构通过\
  \ 1949 年的《国家住房法》获得了第一笔主要资金。⁴\n\n该法案开启了美国城市联邦城市更新的时代。正如在“城市美化运动”时期一样，华盛顿成为城市更新的早期试验场，既因为其象征意义，也因为规划者可以直接与市政专员和商业利益集团合作，而无需任何民主问责。一份乐观的\
  \ 1955 年报告宣称，通过协调规划、自由使用“抗击枯萎病资金”以及严格执行法规，十年内“华盛顿可能成为全国第一个没有大型贫民窟的城市”。⁵\n\n\n\n\n\
  许多黑人社区从一开始就反对城市更新。1949 年，当规划者考虑重建马歇尔高地（Marshall Heights）——一个位于东南区的低收入、半乡村黑人社区时，他们遭到了该地区组织严密的房主们的反对。黑人报纸《匹兹堡-华盛顿信使报》（*Pittsburgh-Washington\
  \ Courier*）表达了黑人居民的沮丧和对流离失所的恐惧：“‘成千上万的黑人将失去毕生积蓄，沦为租客或慈善对象；数百家黑人企业将被摧毁；数百座黑人教堂将被毁，其会众四散；黑人专业人士将失去他们的客户’——这种说法被视为不把华盛顿打造成世界上最美丽城市的拙劣借口。”⁶\n\
  \n为了避免这种一致反对，RLA（重建土地局）于 1951 年 6 月选择了西南区一块 550 英亩的土地作为其首个重大项目，该地块几乎涵盖了整个象限。该地区大多数居民是租客，他们对抗此类项目的动力和能力都较弱。建筑师埃尔伯特·皮茨（Elbert\
  \ Peets）最初制定的计划主张通过修复旧有住房、建造低收入住房单元，并谨慎维护社区特色，确保现有居民不被迁离，从而实现渐进式重建。⁷\n\n然而，皮茨的计划并未给\
  \ RLA 官员留下深刻印象。他们委托著名建筑师团队路易斯·贾斯特曼（Louis Justement）和克洛西尔·伍德沃德·史密斯（Chloethiel Woodard\
  \ Smith）制定替代方案。这对搭档提出了一项大胆计划：将整个区域夷为平地，代之以闪亮的现代开发项目，包括豪华公寓和联排别墅、一个大型购物中心、一个配有高层商业建筑的海滨改造区，以及一条连接社区与市中心的优雅步道。该计划设想了一个全新的西南区，拥有高房地产价值、充足的开放空间和现代便利设施，以吸引更富裕的居民。同时，这也意味着几乎要迁走西南区的全部人口。⁸\n\
  \n这两项相互竞争的方案提交给了国家首都公园与规划委员会（National Capital Parks and Planning Commission），该委员会在其\
  \ 1950 年的综合规划中坚持认为，任何重建项目都应为流离失所的居民提供“价格可负担的、‘体面、安全且卫生的替代住房’”。⁹ 规划委员会提出了一项折中方案，承诺保留该地区的特色（正如皮茨所倡导的），并包含一项条款，要求至少三分之一的新建单元用于低收入住房。\n\
  \n然而在实践中，西南区的城市更新遵循了贾斯特曼-史密斯方案的“清除重建”路线。强大的支持者，包括大都会贸易委员会（Metropolitan Board of\
  \ Trade）和《华盛顿邮报》（*Washington Post*），力推全面重建，而联邦住房与家庭金融管理局（Housing and Home Finance\
  \ Agency）的官员则拒绝资助强调修复的项目。¹⁰\n\n第一批推土机于 1954 年 4 月开始清理该区域，但法律和财务问题使初期建设推迟了两年多。目标区域的两名企业主对整个过程的合宪性提出质疑，认为\
  \ RLA 征用他们的土地是非法的，因为他们的房产既非住宅也非破旧建筑；土地将被用于私人开发而非公共用途；他们没有获得公正补偿；并且根据第五修正案，他们没有得到正当程序。这起诉讼威胁到了全国各地的城市更新项目，案件很快被列入最高法院的审理日程。\n\
  \n1954 年 12 月，最高法院在“伯曼诉帕克案”（*Berman v. Parker*）中一致裁定，市政府官员确实有权征用土地。“如果治理哥伦比亚特区的人决定，国家首都应当既卫生又美丽，那么第五修正案中没有任何内容可以阻碍这一点，”大法官威廉·O·道格拉斯（William\
  \ O. Douglas）写道，他将此事视为道德上的必然要求。“住房的悲惨状况可能像露天排污管污染河流一样毁掉一个社区。”¹¹\n\n尽管言辞激昂，但“伯曼诉帕克案”中这一几乎被遗忘的裁决，对华盛顿特区及其他地区的低收入和黑人社区造成了毁灭性影响。同一个最高法院，曾在住房隔离（*赫德诉霍奇案*）、商业（*哥伦比亚特区诉汤普森案*）和学校（*博林诉夏普案*）的裁决中为华盛顿的种族平等奠定了法律基础，如今却批准了对一个贫穷、以黑人为主的社区进行全面摧毁。\n\
  \n在接下来的二十年里，耗资约 5 亿美元（按 21 世纪美元计算约为 46 亿美元），旧西南区的社区从地图上消失了。取而代之的是国会公园（Capitol Park）等现代项目，它建在臭名昭著的迪克森法院小巷（Dixon\
  \ Court alley）之上。国会公园于 1965 年竣工，拥有五栋高层住宅楼，周围环绕着倒影池、公共艺术和其他设施。其设计获得了美国建筑师学会（American\
  \ Institute of Architects）颁发的杰出功绩奖。西南区的城市更新赢得了规划者、市政官员、大都会贸易委员会和媒体的广泛赞誉，正如《华盛顿邮报》建筑评论家沃尔夫·冯·埃卡特（Wolf\
  \ Von Eckardt）所写的那样，它“将郊区的健康与城市的刺激融为一体”。¹²\n\n现代化付出了巨大的代价。在 1959 年为全国天主教慈善会议（National\
  \ Conference of Catholic Charities）撰写的“从教会视角看城市更新”一文中，城市更新倡导者罗伯特·G·豪斯神父（Father Robert\
  \ G. Howes）警告说，西南区的发展“显示出将‘美丽城市’和‘繁荣城市’置于‘人文城市’之上的倾向”。尽管早期承诺不会驱逐任何家庭，并将建造新住房以满足现有居民的需求，但城市更新摧毁了西南区\
  \ 99%的建筑，迫使 1500 家企业搬迁，并导致 23000 名居民流离失所。取而代之的是 5800 套新住房单元，供人口仅为原来一半的居民居住。¹³\n\n\
  早在 1956 年，RLA 就以成本上升和优先事项变化为由，不再提供经济适用房。最终，西南区只为低收入居民建造了一个仅有 310 套单元的住宅综合体。到 1960\
  \ 年，西南区的平均租金已是特区平均水平的两倍多。这些获奖的新开发项目吸引了更富裕、主要是白人的居民迁入，但代价是牺牲了低收入、主要是黑人的原住民。西南区的种族人口结构发生了逆转——1950\
  \ 年，该地区近 70%是黑人；而到 1970 年，近 70%是白人，而此时华盛顿特区的其他地区黑人比例却在上升。自 1907 年起就在西南区经营一家小杂货店的\
  \ 84 岁老人埃泽基亚·坎宁安（Ezekiah Cunningham）总结道：“嗯，看起来他们是在分发一堆欢乐和一堆悲伤。”¹⁴\n\n\n\n大多数居民别无选择，只能离开。“搬迁并非那么不愉快的经历，”RLA\
  \ 主任约翰·西尔斯坚称，但居民们却不这么认为。在超过 4500 个搬迁家庭中，只有 12.5%留在了西南部；46.5%去了东南部，25.1%去了东北部，15.8%去了西北部（最大、最白、最富裕的区域）。在他\
  \ 1966 年的研究《他们现在在哪里？》中，丹尼尔·瑟西采访了近一百个因西南部城市更新而被迫搬迁的家庭。尽管大多数流离失所的居民表示他们的新家条件比旧家好，但绝大多数人仍然生活在贫困中，在新社区感到社交孤立，并承受着深深的失落感。“无论旧西南部多么肮脏、破旧和不卫生，对于长期居住在那里的家庭来说，它也是*家*，”瑟西总结道。新的西南部“是在一个曾经是*社区*的地方的废墟上崛起的，那里居住着虽然贫穷但根基稳固的居民。”¹⁵\n\
  \n随着居民分散，他们涌入已经拥挤的黑人区域，往往使这些社区的条件恶化。“西南部所做的就是把贫民窟搬到这里，”西北部的一位黑人房主抱怨道。还有数千人在远东南部找到了相对廉价的公共住房，这帮助在十年内将许多社区从白人区变成了黑人区。担心贫困的西南部居民扩散会使国家首都变成“一个纪念碑和贫民的城市”，白人公民协会联合会呼吁实施“全国重新安置计划”，将他们完全从城市中移除。¹⁶\n\
  \n当紧张的房主担心搬迁的影响时，对城市更新最强烈的批评来自民权活动家。新伯特利浸信会的沃尔特·方特罗伊牧师指责道：“城市更新就是城市驱逐——将黑人从城镇的黄金地段驱逐出去。”到\
  \ 20 世纪 60 年代初，“城市更新”一词在民权社区中已成为一个贬义词，是对政策制定者和规划者如何经常忽视低收入居民需求的简略描述。¹⁷\n\n城市更新的灾难性影响，在种族隔离法律障碍倒塌后的十年里，帮助激发了华盛顿各地草根公民行动主义的时代。从\
  \ 20 世纪 50 年代末到 60 年代末，黑人和白人活动家反击了掌控华盛顿的商业利益和未经选举的官员，挑战了这个以黑人为主的城市中根深蒂固的经济不平等。他们动员公民力量，努力阻止白人逃离，开辟经济机会，建设经济适用房，结束警察暴行，并争取地方自治。这是一个社会动荡加剧、紧张局势升级和冲突爆发非凡的时期，华盛顿人开始质疑城市与国家之间的基本关系。\n\
  \n### *“当学校变成全是黑人时，这就是个问题”：白人的城市逃离*\n\n马文·卡普兰站在华盛顿种族变革的前线。他出生于费城的一个犹太家庭，祖辈都是犹太洁食屠夫，但他对文学和语言的热爱使他在二战期间加入了陆军专业培训项目。他跟随日裔美国教师学习日语，这些教师还向他讲述了拘留营以及日裔美国人遭受的其他屈辱。这段经历激发了他的政治良知，战后卡普兰回到美国，致力于实现种族平等的美国民主愿景。他于\
  \ 1952 年搬到华盛顿担任记者工作，几周内，他就在赫克特百货公司外的纠察线上汗流浃背，听从邻居安妮·斯坦的指挥。他热情和蔼，露齿而笑，目光炯炯，很快就在华盛顿的激进世俗犹太人社区中赢得了喜爱。¹⁸\n\
  \n1957 年，卡普兰、他的妻子娜奥米以及他们的三个孩子搬到了庄园公园，这是一个绿树成荫的中等收入区域，位于西北乔治亚大道以东，靠近马里兰州边界。他们很快发现，新社区是一个白人逃往郊区的“战场”，“我们开始把每一个‘待售’标志都视为前进军队插上的旗帜，”他后来写道。卡普兰和他的白人邻居认为，敌人是那些追求利润的房地产经纪人，他们希望鼓励紧张的白人房主以低价出售房屋。然后，经纪人会抬高价格卖给黑人买家。他们使用各种“街区破坏”和“恐慌性抛售”手段来煽动白人的恐惧，经常用反复的电话轰炸白人房主，并在街区散发引发恐惧的传单，警告他们趁早出售，否则为时已晚。一旦有一个黑人或家庭搬入某个区域，经纪人就会认为该区域处于“过渡期”，而该市的三家日报允许他们将此区域的房产广告为“向有色人种出售”。¹⁹\n\
  \n掠夺性的房地产经纪人成了很好的替罪羊，但白人迁往郊区的原因更为复杂。尽管他们的手段可能不光彩，但这些经纪人是在回应真实的需求。黑人购房者迫切寻求体面的住房，而他们几乎无法进入马里兰州和弗吉尼亚州的郊区。美国民权委员会观察到，郊区形成了“环绕特区的白色环”——或者像许多华盛顿黑人所说的“白色绞索”。白人迁往郊区在二战后真正开始，当时城市居民被宽敞的新房和便捷的融资前景所吸引，纷纷离开全国各地的城市。随着郊区的发展，雇主也很快跟进。即使是联邦政府，部分出于对华盛顿市中心可能遭受灾难性原子弹袭击的担忧，也开始通过将机构迁往郊区来分散其运作。²⁰\n\
  \n在 20 世纪 50 年代初关键的民权胜利之前，郊区迁移已经进行得很顺利，但住房和学校的废除种族隔离显著加速了这一过程。统计数据令人震惊。1950 年至 1960\
  \ 年间，华盛顿特区的白人人口减少了三分之一；该市从近 65%的白人转变为大约 54%的黑人。许多社区从以白人为主变成了几乎全是黑人。²¹\n\n离开种族变化社区的白人常常担心房地产价值下降、学校恶化以及地位丧失。他们认为，有黑人邻居本身就使社区变得不那么理想。“通常有一种信念，一旦第一个黑人家庭搬进一个街区，许多其他黑人家庭必然会跟随，街区将完全改变，”人口学家乔治·格里尔在\
  \ 1962 年解释道。白人居民担心“临界点”，即一个街区不可逆转地变成黑人社区的点，然后，《邮报》的约翰·马弗雷写道，“白人惊慌失措地四散奔逃，就像北极旅鼠盲目地冲入大海。”²²\n\
  \n\n\n\n即使是像卡普兰一家这样支持融合的自由派白人，也在是否离开城市的问题上挣扎不已。在 1960 年 7 月为《大西洋月刊》撰写的一篇内省文章中，马文·卡普兰阐述了他、他的妻子以及其他自由派白人对马诺帕克社区种族变迁的矛盾心理。起初，卡普兰一家欢迎该地区的第一批黑人家庭，“带着自豪和正义感，我们看着大孩子走进一所最近实现种族融合的公立小学。”黑人邻居们始终彬彬有礼，而且往往颇有成就，但随着原本白人占多数的学校很快变成\
  \ 80%以上是黑人，白人的恐惧与日俱增。谣言四起，紧张的白人居民聚得更近，渴望其他白人家庭搬进来。²³\n\n他们害怕什么？卡普兰写道，表面上，他和他的白人邻居们有一种模糊而令人不安的感觉，觉得事情会变得不同、更难掌控、更不熟悉。可能会出现“黑人骚乱”，带来“拥挤……以及我们安静街道上的脏话和暴力”。但卡普兰写道，“在中产阶级体面的外表背后”，隐藏着性。“异族通婚是脱口而出的恐惧。”²⁴\n\
  \n卡普兰一家支持融合，但他们不想成为“街区里最后一个白人家庭”。然而，他们选择留在华盛顿特区，积极组织社区活动，以防止更多的白人外迁。1958 年夏天，在试图整合马诺帕克公民协会失败后，卡普兰夫妇招募了黑人药剂师沃伦·范·胡克以及一群志同道合的跨种族朋友，成立了“邻居公司”（Neighbors,\
  \ Inc.），这是一个私人组织，致力于在西北部第十六街和乔治亚大道沿线的四个独栋住宅区——马诺帕克、布莱特伍德、谢泼德帕克和塔科马——创建稳定、融合的中产阶级社区。卡普兰后来说，这是“一种决心与绝望的行为”。²⁵\n\
  \n由于共同的中产阶级背景，“邻居公司”的早期成员试图在融合的氛围中保护他们认为该地区的中产阶级美德——安静的街道、维护良好的房屋、优质的学校、充满活力的教堂和犹太会堂。该组织得到了蒂费雷特以色列（Tifereth\
  \ Israel）的关键机构支持，这是一座位于第十六街的保守派犹太会堂，它选择留在谢泼德帕克社区，而不是跟随许多会众迁往郊区。像卡普兰一家一样，许多最活跃的白人成员是犹太人，他们因本民族受迫害的历史以及对黑人斗争的同理心而充满活力。“你不必告诉犹太人贫民窟有什么问题，”马文·卡普兰解释道。²⁶\n\
  \n“邻居公司”强调融合生活的经济和实际利益，有意识地拥抱跨种族生活作为一种积极的好处，是城市生活中充满活力的一部分，与郊区枯燥的种族隔离形成鲜明对比。1959\
  \ 年春天，该组织拥有 175 个缴纳会费的家庭，开始帮助居民研究住房法律、招募新家庭、组织跨种族社区活动，并宣传融合的好处。它制作了带有照片的小册子，展示不同种族的孩子快乐地一起玩耍；举办受欢迎的艺术和书展；主办社区茶会和街区会议；并每月出版一份通讯。成员们希望吸引联邦官员和其他专业人士来到该地区，提供乔治城风格的家居和花园游览，以展示融合社区的美景和中产阶级品味。²⁷\n\
  \n该组织还挑战那些破坏其维持融合社区努力的种族做法和政策。在其首批举措之一中，“邻居公司”要求当地报纸停止允许房地产经纪人按种族列出房产。他们收集了 2500\
  \ 个请愿签名，并帮助建立了一个由 40 多个组织组成的联盟来抗议这种做法。到 1960 年中期，受到教训的报纸改变了做法。该组织还反对联邦住房管理局的政策，这些政策拒绝向在“过渡”社区寻找住房的购房者提供联邦贷款；向房地产经纪人施压，要求他们停止“街区破坏”手段；并质疑“不准确”和“误导性”的犯罪统计数据，指责它们引发了人们对城市生活不必要的恐惧。²⁸\n\
  \n“邻居公司”吸引了大量媒体关注，并赢得了政策制定者和基金会资助者的高度赞扬。到 1965 年，这个拥有 1400 名成员的组织声称，它成功遏制了白人的“恐慌性抛售”，并“稳定”了社区，使成员能够专注于更普通的社区问题，如路灯和垃圾收集。“无论他们是否愿意，他们已经成为一个典范，”《星报》记者海恩斯·约翰逊在\
  \ 1965 年写道。然而，到那时，该组织已退缩到最北部的谢泼德帕克和塔科马社区，那里白人仍占 77%的绝对多数。南部的布莱特伍德和马诺帕克地区则失去了大部分白人居民，因为来自西南部和其他地方的低收入黑人在该地区找到了住房。²⁹\n\
  \n![Image](img/f0001-19.jpg)\n\n*两个女孩在“邻居公司”1964 年于西北华盛顿库利奇高中举办的艺术与书展上玩耍。“邻居公司”赞助了晚宴、节日和其他社区活动，以鼓励跨种族互动，并阻止白人从城市外流。经华盛顿特区公共图书馆《星报》收藏集许可转载，©《华盛顿邮报》。*\n\
  \n尽管取得了诸多成功，该组织仍面临内部分歧，尤其是在招募新居民方面。从一开始，“邻居公司”的跨种族董事会就承认，为了维持稳定的白人存在，必须将招募重点放在吸引与该组织价值观一致的白人家庭上。虽然它没有主动阻止黑人购房者，但它以搬入该地区的新白人家庭数量来衡量成功。这种侧重导致它选择了一位白人女性玛格丽·韦尔担任首任执行董事，而不是一位经验更丰富的黑人候选人；随着时间的推移，不断推动吸引白人家庭的做法越来越激怒黑人支持者。“作为‘邻居公司’里的黑人，你必须有一张非常厚的脸皮，”一位黑人成员坦言。³⁰\n\
  \n该组织面临的最大挑战是学校种族构成的不断变化，尤其是位于西北第八街和奥格尔索普街、在“邻居公司”社区最南端的保罗初中。到 1963 年，保罗初中已有 75%的黑人学生，这一比例“对大多数白人来说太高了”，组织领导人在一份内部备忘录中警告说。“现在几乎可以肯定，‘邻居公司’在居住融合方面的示范成功与否，取决于初中问题。”在幕后，他们向学校官员施压，要求在更北的白人占多数的地区新建一所初中。在公开场合，他们提供研究报告、统计数据以及保罗初中教职员工和家长的亲身证词，以反驳黑人入学率上升必然意味着学术标准下降的看法。³¹\n\
  \n\n\n\n尽管做出了努力，但“邻居”组织未能阻止白人从学校逃离。《星报》的海恩斯·约翰逊观察到，“对许多（白人）家长来说，最终的问题在于学校里黑人的比例。”到\
  \ 1960 年，布赖特伍德的罗斯福高中几乎全是黑人。到 20 世纪 60 年代中期，塔科马的库利奇高中已有 90%是黑人，而谢泼德公园和塔科马小学的黑人占多数，白人学生数量急剧下降。即使是支持种族融合学校的白人也紧张地注视着学校里不断增长的黑人人口。“当学校全是黑人时，这就是个问题，”一位有两个学龄前孩子的白人成员承认，“这是不可否认的。”³²\n\
  \n卡普兰夫妇的女儿弗雷娅是 1968 年库利奇高中为数不多的白人毕业生之一，她直率地告诉父母，不应该让她的弟弟妹妹“经历我所经历的一切”——种族欺凌、社会孤立以及对身体暴力的恐惧。经过长时间的痛苦挣扎和家庭治疗，马文和娜奥米·卡普兰决定将他们的年幼孩子从保罗初中接出来，并安排他们进入岩溪公园西侧以白人为主的艾丽斯·迪尔初中。马文·卡普兰用圣经中的语言描述这段经历，将自己比作亚伯拉罕，以及“每一个发现自己固执而盲目地准备为了信仰牺牲孩子的父亲”。尽管他并不后悔暂时“将我们的孩子交给社区学校”，但卡普兰余生都为此感到内疚。到\
  \ 20 世纪 70 年代，库利奇、保罗以及其他“邻居公司”的社区学校几乎全是黑人。³³\n\n并非所有白人都能通过简单安排孩子就读学区外学校或送他们去该地区新兴的私立学校来避免“将孩子交给当地学校”。对于蓝领白人居民，尤其是在阿纳科斯蒂亚、国会高地以及远东南部其他地区，种族隔离的结束意味着他们在城市生活的彻底终结。\n\
  \n国会高地是一个由红砖平房组成的社区，拥有起伏的丘陵和俯瞰市中心的壮丽景色，是一个与南方有着血缘和文化联系的工人阶级白人社区。即使到了 20 世纪 50 年代，国会高地仍然相对乡村化，人口密度低，有大片未开发的土地，还有一个延伸到马里兰边界的养猪场。作为华盛顿山区乡村音乐场景的所在地——吉米·迪恩和其他乡村音乐名人在当地酒吧演出——国会高地只允许白人进入。如果黑人进入该地区，附近巴里农场的一位黑人居民回忆说，“你可能会被扔啤酒瓶，然后你就知道你要挨揍了。”当富裕西北部的白人青少年留起长发、拥抱\
  \ 20 世纪 60 年代的嬉皮士造型时，国会高地的出租车司机、管道工、机械师和其他蓝领工人的儿子们则把头发向后梳成鸭尾式，穿着紧身 T 恤，肩上卷着一包香烟。³⁴\n\
  \n在远东南部，白人从公立学校逃离的过程发生得较慢。由于几乎没有其他选择，白人家庭在种族融合后很长一段时间内仍继续送孩子上当地学校。1960 年，远东南部仍有三分之二的白人，而阿纳科斯蒂亚高中——1954\
  \ 年秋季白人学生罢课的地点——直到 20 世纪 60 年代中期仍有大约 50%的白人。位于国会高地的新的巴卢高中建于 1961 年，以缓解阿纳科斯蒂亚高中的过度拥挤，直到\
  \ 20 世纪 60 年代中期仍以白人为主。1963 年，一位白人教师称其为“模范学校”，拥有“没有种族冲突、没有暴力、没有对教师不敬”的环境。³⁵\n\n种族变化在\
  \ 20 世纪 60 年代中期迅速到来，这距离学校和住房废除种族隔离开始整整十年。当地就业机会枯竭，因为附近的海军火炮工厂关闭，博林空军基地大幅裁员。许多与军事设施有联系的白人工人不再有经济理由留在远东南部，而且随着该地区开始涌入低收入黑人居民，他们感到文化上的疏离。\n\
  \n公共政策也推动了社区变化。从 20 世纪 50 年代开始，分区规划变更将远东南部高达 75%的住宅用地保留用于出租公寓住房，吸引了因西南部城市更新而流离失所的租户。该市在整个地区建造了公共住房单元，并购买了私人综合体将其改造成公共住房。到\
  \ 20 世纪 60 年代末，远东南部 85%的住房单元是多户公寓，该市四分之三的公共住房居民居住在那里。³⁶\n\n随着该地区人口激增，当地学校严重拥挤，垃圾清理、街道清扫和警察保护等基本城市服务跟不上。1970\
  \ 年华盛顿政府的一份报告指出：“由于在这个社区集中了如此多的公寓开发项目，公共服务出现了严重缺陷。”³⁷\n\n到 20 世纪 60 年代末，该地区只有不到\
  \ 5%的白人，剩下的少数白人居民心怀怨恨。“这就像小非洲，”一位从西弗吉尼亚搬到华盛顿的白人母亲抱怨道，“整个地方都泛滥成灾。”一位当地牧师同情他们的困境。“他们有一种感觉，‘我的世界怎么了？’”由于太穷、太老或太固执而无法搬到郊区，留下的白人居民感到与城市其他部分隔绝。“他们看到\
  \ 10 年前还住着白人小家庭的公寓单元，如今随着贫穷的黑人家庭带着六七个孩子搬进一居室或两居室单元而分崩离析，”卡尔·伯恩斯坦在《华盛顿邮报》中写道。他们常常怨恨河对岸的白人华盛顿人。“住在春谷（西北部一个富裕的白人社区）而不做种族主义者是件好事，”一位白人居民评论道，“但如果你必须住在这里，情况就不同了。”³⁸\n\
  \n二战后二十年的白人逃离，使华盛顿的白人社区呈现出新的种族地理和阶级取向。它不仅规模更小，而且更年长、更富裕、在地理上更集中，在政治和文化上更自由。白人工人阶级的流失意味着，在\
  \ 20 世纪末的华盛顿，种族和阶级的关联比以往任何时候都更加紧密。曾经各个阶层的白人生活在每个象限，通常居住在种族融合的地区，但到 20 世纪 60 年代末，很少有白人住在城市东部三分之二的区域。《新共和》的安德鲁·科普金德和詹姆斯·里奇韦称华盛顿的居住模式为“一种*种族隔离*”：“就像旧利奥波德维尔的比利时人一样，白人主要居住在他们自己的一个大殖民地中；在华盛顿，它被称为西北部。”³⁹\n\
  \n富裕的白人主要聚居在岩溪公园以西的社区或西南部重建的综合体中，这些地区受到高房价的保护。他们将孩子送到轻度融合的公立和私立学校，过着很大程度上按种族和阶级隔离的生活。很少有蓝领白人留在城市。他们放弃了远东南部，前往马里兰州的乔治王子县和卡尔弗特县，永远离开了华盛顿。华盛顿白人工人阶级的痕迹消失了，就像几十年前的斯旺普德尔社区一样。\n\
  \n### *“愤怒，但未充满怒火”：朱利叶斯·霍布森为优质住房、工作和学校而战*\n\n\n\n\n朱利叶斯·霍布森并不符合 20 世纪 60 年代民权领袖的形象。他是一名无神论者，而非牧师；一名统计学家，而非学生；一个穿着西装领带比牛仔裤或达西基衫更自在的人。1919\
  \ 年出生于阿拉巴马州伯明翰的霍布森，成长于一个小学校长和小企业主组成的家庭，家中珍视教育。二战期间担任炮兵观测员时，他获得了两枚铜星勋章，并在海外期间阅读了马克思、卢梭及其他欧洲思想家的著作。思想受到激荡后，他回到美国，自称“马克思主义社会主义者，但不是共产主义者”——这个标签他从未放弃。在塔斯基吉获得工程学位后，他进入霍华德大学攻读经济学研究生，但因与白人导师发生争执而被开除。霍布森后来成为联邦公务员，先是在国会图书馆担任研究员，随后在社会安全局担任统计分析员。⁴⁰\n\
  \n![图片](img/f0001-20.jpg)\n\n*直言不讳的朱利叶斯·霍布森在 20 世纪 60 年代初成为华盛顿特区最引人注目的民权领袖。作为种族平等大会及后来的社区团队协会负责人，霍布森以富有创意的对抗方式挑战白人当局。经华盛顿特区公共图书馆星报收藏许可转载，©《华盛顿邮报》。*\n\
  \n戴着标志性的软呢帽，穿着白衬衫，嘴角叼着烟斗，身材精瘦的霍布森看上去完全就是他所扮演的那位睿智的政府统计员——除了那双燃烧着怒火的眼睛。被称为“华盛顿特区最愤怒的人”，他对美国生活中根深蒂固的种族主义和经济不平等感到愤慨。“我很愤怒，但并非充满暴怒，”他告诉记者，“暴怒源于挫败感和无法解决问题。愤怒则带有方向、计划和决心。”霍布森的愤怒在\
  \ 20 世纪 50 年代初找到了方向，当时他不得不开车送儿子小朱利叶斯经过白人就读的伍德里奇小学，前往一英里外拥挤的黑人斯洛小学。他加入了家长教师协会，成为公民协会联合会的副主席，随后又参与了全国有色人种协进会，“每加入一个组织，理论上都比我之前参与的更激进，”他回忆道。⁴¹\n\
  \n霍布森的工作引起了种族平等大会（CORE）的注意，该组织于 1961 年 4 月聘请他管理其陷入困境的华盛顿特区分会。CORE 成立于 1942 年，是一个致力于通过非暴力直接行动挑战种族不平等的和平主义组织。它与另外两个新成立的全国性民权组织一道，在南方各地开展高调抗议活动：马丁·路德·金的南方基督教领袖会议（SCLC），该组织于\
  \ 1957 年在阿拉巴马州蒙哥马利成功抵制公交车运动后成立，这场运动将这位 26 岁的牧师推向了全国舞台；以及学生非暴力协调委员会（SNCC，发音为“snick”），该组织于\
  \ 1960 年在一波学生静坐抗议后成立。\n\n随着 SNCC、SCLC 和 CORE 策划和平抗议，引发白人对手的暴力反应，全国民权运动进入了对抗政治的新戏剧性阶段。霍布森帮助将这种日益增长的战斗精神带到了国家首都。他将\
  \ CORE 从仅有 15 名成员扩展到数百人，使其成为 20 世纪 60 年代初该市最引人注目、最活跃的民权组织之一。霍布森直率、粗鲁且难以预测，他将义愤填膺与严谨研究相结合，利用统计数据和表演技巧向华盛顿的种族主义做法宣战。⁴²\n\
  \n霍布森是城里新一代年轻黑人领袖中最激进的一位。另一位稳健、博学、为平等发声的是斯特林·塔克，一位瘦削而精力充沛的俄亥俄人，1956 年 32 岁时来到华盛顿特区管理华盛顿城市联盟。作为多产作家和白人媒体青睐的消息来源，塔克阐述了城市联盟富含统计数据的报告，以及种族主义对华盛顿黑人居民造成的发自内心的情感伤害。⁴³\n\
  \n代表新一代牧师的是沃尔特·方特罗伊，他是马丁·路德·金的同事和门徒，负责 SCLC 的地方分会。方特罗伊毕业于邓巴高中，这位面容圆润的年轻人进入耶鲁神学院，并于\
  \ 1959 年 26 岁时返回，成为他家乡教堂——位于西北第九街和 S 街的新伯特利浸信会的牧师。⁴⁴\n\n黑人新闻界的新声音来自 C. 萨姆纳“查克”斯通，一位\
  \ 36 岁的激进分子，于 1961 年初成为《华盛顿非裔美国人报》的编辑。斯通曾是塔斯基吉飞行员，毕业于卫斯理大学，他因尖刻谴责“懒散”的黑人中产阶级和“好斗的汤姆叔叔”而立即引发争议。⁴⁵\n\
  \n对于这些民权领袖而言，20 世纪 60 年代初的华盛顿特区带来了一系列独特的挑战。从许多方面来看，国家首都是黑人成功的典范。它拥有美国最富有、受教育程度最高的黑人社区。该市二战后的民权运动已经瓦解了南方各地仍在抗议的那种吉姆·克劳法。大多数官方白人华盛顿人谈论的是宽容而非排斥的言辞。1961\
  \ 年，约翰·肯尼迪总统任命律师约翰·B·邓肯——一位活跃的公民领袖，十年前曾深度参与“卡多佐中心”运动——成为该市首位黑人专员。政治压力甚至迫使华盛顿红皮队实现融合，该队于\
  \ 1962 年成为国家橄榄球联盟中最后一支将黑人球员纳入阵容的球队。⁴⁶\n\n这样的进步鼓励黑人领袖追求超越单纯废除种族隔离的目标。他们期望所有华盛顿黑人能够充分享受自由的果实，包括好工作、体面的住房和高质量的学校。然而，随着华盛顿特区像北方城市一样，在与根深蒂固的种族不平等相关的一系列模糊问题——失业率上升、工资停滞、社区恶化、学校拥挤——中挣扎，日益增长的期望遭遇了令人沮丧的现实。黑人的不满主要集中在两个问题上：就业和住房方面的歧视。\n\
  \n1960 年黑人家庭收入中位数是白人收入的 70%，与二十年前持平。尽管联邦政府和华盛顿特区政府都有官方的非歧视政策，但无形的障碍依然存在。城市联盟发现，在一些联邦机构中，黑人工人的收入比白人同事低\
  \ 35%。在华盛顿特区政府内部，黑人雇员占劳动力总数的一半以上，但在最高薪职位中占比不到 10%。霍布森指责私营部门更糟。“在私营企业中，实际上没有黑人的位置。”⁴⁷\n\
  \n\n\n\n黑人同样无处寻觅体面且价格合理的住房。住房歧视是黑人追求进步的瓶颈，这一问题贯穿华盛顿黑人社会的各个阶层。自 1948 年起，限制性契约在法律上已无法强制执行，但\
  \ 1960 年的人口普查数据显示，华盛顿特区的社区隔离程度比以往任何时候都更严重。黑人居民为同等住房支付的费用比白人居民高出 50%，而黑人住房的拥挤程度大约是白人住房的五倍。随着越来越多的人挤入老旧的黑人社区，公共服务跟不上需求，学校超负荷运转，生活条件日益恶化。到\
  \ 1963 年，华盛顿特区在肺结核、性病和婴儿死亡率方面居全国之首。“当白人提醒华盛顿黑人他们在过去十年取得了多大进步时，”《华盛顿邮报》的罗伯特·E·贝克写道，“黑人却指着贫民窟和黑人聚居区，作为他们还有多远路要走的证据。”⁴⁸\n\
  \n华盛顿缺乏代议制政府，这使问题雪上加霜。在涉及城市事务的 91 个公共委员会中，超过一半完全没有黑人成员，这标志着黑人在政治上的隐形。市政官员通常忽视黑人的关切，尤其是在就业和住房方面。例如，1963\
  \ 年，西北区吉拉德街一栋破旧公寓楼里一群忍无可忍的租户签署了一份请愿书，详细列举了该楼违反城市住房法规的诸多问题，包括走廊无照明、供暖炉故障以及管道设施不足。市政官员只是将请愿书转交给了房东，而房东随即驱逐了请愿者。⁴⁹\n\
  \n华盛顿的黑人居民也无法指望从联邦立法者那里获得支持。因民权进步而愤怒的南方种族隔离主义者，在掌控华盛顿事务的委员会中加强了控制。政治学家玛莎·德西克写道，由南卡罗来纳州的约翰·麦克米兰在\
  \ 20 世纪 60 年代长期领导的、由南方人主导的众议院特区委员会，只对白人居民做出回应，总体上在“特区政府中扮演着阻挠者的角色，蓄意且恶意地挫败特区的最佳利益。”⁵⁰\n\
  \n另一个障碍是负责特区预算的参议院拨款小组委员会，其主席是前三 K 党成员，擅长戏剧性演说：西弗吉尼亚州的民主党人罗伯特·伯德。麦克米兰、伯德及其南方同僚重新编制了城市预算，大幅削减福利、教育和住房项目，同时加强警力。沮丧的华盛顿居民抱怨这些种族隔离主义者如同破坏分子。“这些人坚信特区不可能成为一个融合、进步的城市，并且他们有能力让特区失败，”安德鲁·科普金德和詹姆斯·里奇韦在《新共和》杂志上写道。⁵¹\n\
  \n国会中的种族隔离主义者抓住任何对特区不利的新闻报道大做文章，包括 1962 年感恩节年度城市校际足球冠军赛中一起带有种族色彩的事件。这场在新落成的华盛顿特区体育场（后更名为罗伯特·F·肯尼迪体育场）举行的大型慈善活动，吸引了超过五万名观众，创下纪录。公立学校冠军——以黑人为主的东部高中，对阵私立学校冠军——以白人为主的圣约翰学院高中。比赛接近尾声，圣约翰以\
  \ 20 比 7 领先时，场上球员之间的一场小冲突引发了赛后斗殴，多达两千名黑人青少年和年轻人冲进球场，用拳头、瓶子和砖块袭击白人圣约翰球迷。超过五百人受伤，骚乱蔓延至邻近社区，黑人居民打开家门庇护逃跑的白人球迷。市政官员、学生领袖和媒体最初试图淡化这场骚乱的种族因素，但很少有电视观众、现场观众或观察者能忽视种族分裂。“仇恨的爆发主要来自我自己的同胞，”出席比赛的黑人记者西蒙·布克写道。⁵²\n\
  \n国会中的南方白人宣扬他们所谓的“最恶毒的种族骚乱”新闻，将责任归咎于“融合教育”，并将其与密西西比州民主党人约翰·贝尔·威廉姆斯所说的“黑人针对白人的暴力犯罪率飙升”联系起来。威廉姆斯表达了众多华盛顿白人的焦虑，他们将城市不断上升的犯罪率（确实在显著上升，如同全国其他地区一样）几乎完全归咎于黑人社区，尤其是来自南方农村、受教育程度低、收入低的黑人移民。“种族暴力恐惧笼罩首都”——1963\
  \ 年《纽约时报》的一个标题如此写道。记者拉塞尔·贝克描述了一系列黑人袭击白人的事件，称其为“华盛顿向美国游客展示的明信片般高贵外表背后，经常发生的随意暴行”的证据。⁵³\n\
  \n民权支持者试图将感恩节暴力事件和城市的犯罪问题置于更广泛的不平等背景中。一个由前艾森豪威尔助手领导的多种族公民委员会调查了这场混战，并于 1963 年 1\
  \ 月发布了一份措辞严厉的报告，将责任归咎于活动主办方、学校官员、警方以及东部高中的白人橄榄球教练等人。报告还追溯了暴力的深层根源。“感恩节发生的事件只是更大问题的一个严重症状，”报告总结道，指出城市缺乏自治、学校过度拥挤、就业和住房歧视是赛后愤怒爆发的原因。⁵⁴\n\
  \n对更多种族暴力的恐惧，给当地的民权倡议注入了新的紧迫感，包括霍布森前一年发起的种族平等大会（CORE）“择优雇佣”运动。如同三十年前新黑人联盟的“不雇佣就不买”抗议活动，CORE\
  \ 的运动采用纠察、谈判和抵制的方式，迫使企业在各个职位层级雇佣黑人员工。霍布森还编制了一份“选择性购买指南”，类似于安妮·斯坦十年前著名的废除种族隔离餐厅名单，以宣传合作企业。“我们进入的每一家机构，我们都大闹一场，让黑人获得象征性的职位，”霍布森回忆道。在领导了八十多次纠察行动后，他声称帮助了大约五千名黑人在约两百家公司获得工作。⁵⁵\n\
  \n择优雇佣运动的成功鼓励活动家们采用直接行动抗议，挑战种族主义的租赁做法，并推动一项“开放”或“公平”住房法，要求所有住房对任何种族的居民开放。CORE 调查住房歧视，帮助居民提出投诉，并开创了“入住”计划，即白人租下白人社区的公寓，然后允许黑人作为“客人”入住。1963\
  \ 年 5 月，CORE 发起了一系列抗议活动，针对开发商莫里斯·卡弗里茨，因为他只向单一种族出租其公寓楼的单元。卡弗里茨是土生土长的华盛顿人，小时候曾住在乔治敦一个种族融合的小巷里，后来娶了该市最著名的社交女主人。通过针对他，CORE\
  \ 在华盛顿官方和媒体中引起了广泛关注。两个月内，卡弗里茨便公开支持 CORE 关于全市开放住房法的呼吁。⁵⁶\n\n\n\n\n为了提高住房和就业运动的知名度，CORE\
  \ 与 NAACP 和 SCLC 联合，于 1963 年 6 月 14 日在市中心举行了一场游行。这场“争取自由的游行”发生在警犬撕咬阿拉巴马州民权抗议者的数周之后，以及白人至上主义者在密西西比州谋杀\
  \ NAACP 领袖梅德加·埃弗斯的几天之后，吸引了超过三千名和平、融合的群众，其中约四分之三是黑人。他们首先游行到哥伦比亚特区大楼，在那里，SCLC 的毕晓普·斯莫尔伍德·威廉姆斯结束了一段冗长的祈祷，问道：“黑人还要忍受多久的耻辱、侮辱、不人道、堕落……和暴行？”⁵⁷\n\
  \n“还要多久？还要多久？”的呼喊声在人群中回荡。不会太久了，专员沃尔特·托布里纳回答道，他承诺该市将在年底前颁布一项公平住房法令。随后，抗议者前往司法部，司法部长罗伯特·肯尼迪站在一个摇摇晃晃的平台上，手持扩音器。当被问及联邦政府内部持续存在的就业歧视问题时，肯尼迪变得“防御性且愤怒”，据《非裔美国人》报的查克·斯通称，但他发誓：“我们能够，也将会做得更好。”⁵⁸\n\
  \n两个月后，全国性的“向华盛顿进军争取就业与自由”运动将 25 万抗议者带到了林肯纪念堂的台阶前。尽管人们普遍担心种族暴力，但活动进行得顺利有序，这在很大程度上要归功于华盛顿协调委员会的地方活动家。该委员会由\
  \ SCLC 的沃尔特·方特罗伊和华盛顿特区 NAACP 的爱德华·A·海尔斯共同主持，成员包括朱利叶斯·霍布森、斯特林·塔克以及其他地方民权团体的负责人。他们帮助从华盛顿地区招募了\
  \ 2.5 万至 3.5 万名游行者，安排了当地住宿，并组织了数百名志愿者协助安保和人群控制。据《华盛顿邮报》二十年后披露，霍布森还向 FBI 通报了计划。⁵⁹\n\
  \n然而，这场在历史记忆中如此深刻的“向华盛顿进军”，对当地运动的影响却微乎其微。相反，它可能标志着华盛顿本已臭名昭著、四分五裂的民权领导层内部合作的顶峰。尤其是霍布森，经常疏远其他黑人领袖，其中许多人被他斥为“温顺、轻声细语、经过消毒的黑人”。他在\
  \ CORE 内部也逐渐失去支持。他对该组织将非暴力作为一种生活方式的做法感到不耐烦，而他专制的管理风格和粗暴的个性与该组织以共识为导向的文化格格不入。“你不能用《罗伯特议事规则》来搞革命，”他抱怨道。1964\
  \ 年 6 月，华盛顿特区支部的一个异见派系与 CORE 的全国领导层合作，将他驱逐出组织。⁶⁰\n\n脱离 CORE 后，没有了需要安抚的捐助者基础，霍布森得以自由地追求更激进的路线。他将策略从抗议转向建立权力。“直接行动引起了人们对问题的关注，并带来了象征性的改变，但没有带来任何真正根本性的变化，”他在\
  \ 1964 年 4 月评论道。“政治和经济力量将带来永久性的改变。”他成立了一个名为“联合社区团队”的新激进组织的地方支部，其目标是“孤立汤姆叔叔”、“拒绝白人自由派”并促进“黑人团结”。该组织拒绝白人的帮助。“我们不恨（白人），”一份内部备忘录写道，“我们只是不需要他们。”⁶¹\n\
  \n霍布森最擅长扮演社区牛虻的角色，是两族当权派领袖眼中一根独刺。他热衷于实施他所谓的“游击战术”和“心理战”——那些旨在引起人们对黑人社区恶劣生活条件关注的高调噱头。例如，在他离开\
  \ CORE 后不久，他捕捉了在贫困社区乱窜的老鼠，将它们关在笼子里放在他的旅行车顶上，然后举行“老鼠搬迁集会”，威胁说如果市政府不在黑人社区建立灭鼠计划，他就把这些小动物放到乔治城。霍布森从未兑现他的威胁——他在夜里淹死了老鼠——但这些集会促使不情愿的市政官员采取了行动。霍布森那些抢占头条的滑稽行为常常激怒方特罗伊、塔克和其他当权领袖，但他扮演了宝贵的角色。“华盛顿需要一个朱利叶斯·霍布森，”一位白人活动家认为。“有一个让社区保持紧张、使温和派得以介入的激进边缘分子是有用的。”⁶²\n\
  \n然而，尽管霍布森的抗议活动富有创意，但他最持久的遗产却源于一种更为常规的策略：对学校系统提起诉讼。霍布森认为，华盛顿特区不完善的学校使种族不平等长期存在，并且“辜负了绝大多数学生，将他们抛入经济、文化和社会的垃圾堆”。到\
  \ 20 世纪 60 年代中期，经过十年所谓的“废除种族隔离”，华盛顿特区的学校在视觉上和统计上仍然明显是隔离且不平等的。大多数学校中，某一族裔的学生比例超过\
  \ 90%，而学校系统在洛克溪公园以西、较富裕的白人社区中招生不足的学校，每名学生花费比以黑人和贫困学生为主的学校高出 34%。⁶³\n\n此外，学校官员建立了一个四层级的“分轨”制度，将能力相似的学生分到同一“轨道”，从针对能力较弱学生的“基础”轨道到针对学业天赋学生的“荣誉”轨道。霍布森是众多质疑分轨制度的批评者之一，因为在实际操作中，轨道与种族和阶级密切相关：基础轨道挤满了黑人和贫困学生，而白人中产阶级学生则集中在较高的轨道。当他的女儿琼上中学时，霍布森发现她被分到了“基础”轨道，这实际上阻止了她学习大学预科课程。霍布森勃然大怒，对学监卡尔·汉森提起了集体诉讼，指控分轨制度虽然表面上不分种族，但实际上阻止了贫困的黑人学生获得平等的教育。用霍布森辛辣的话来说，它创造了一个“程序性智力迟滞系统”。⁶⁴\n\
  \n联邦巡回法院法官 J. 斯凯利·赖特同意这一观点。作为一名因其支持民权而在家乡新奥尔良被排斥的激进法官，赖特于 1967 年 6 月裁定，学校官员主持了一个重新隔离的系统，违宪地剥夺了华盛顿特区的贫困和黑人学生“获得平等教育机会的权利”。在一份长达\
  \ 118 页的严厉判决书中，他谴责了该系统的就近入学政策，该政策助长了种族和经济上的隔离学校，这些学校“损害了所有就读儿童的心灵和精神”。赖特发现，学监汉森的分轨计划基于带有种族和文化偏见的测试，使得贫困和黑人学生被分配到较低轨道成为“自我实现的预言”，“从中……逃脱的机会微乎其微”。赖特称华盛顿特区的学校系统是“统治着无投票权首都的权力结构之冷嘲热讽的纪念碑”，并下令进行彻底改革，包括废除分轨制度以及允许白人学生就读以白人为主的学校的特殊优待。⁶⁵\n\
  \n\n\n\n\n*霍布森诉汉森案*揭露了观察者所称的“*事实上的*种族隔离”的现实，迫使学校官员在一个“废除种族隔离”的体系中应对教育差距。在学校董事会决定不上诉后，汉森总监辞职并自行提出上诉，但败诉了。汉森十年前曾与南方种族隔离主义者发生冲突，是融合的坚定支持者，但他的职业生涯最终却成为官方在种族差异问题上顽固不化的象征。“华盛顿在过去十年发生了变化，但卡尔·F·汉森没有，”苏珊·雅各比在《华盛顿邮报》中写道。正如一位社区成员所说：“在\
  \ 20 世纪 50 年代，在一个基本上还是南方小镇的城市里看似自由的政策，如今看来非常保守。”⁶⁶\n\n对朱利叶斯·霍布森来说，这是一场苦乐参半的胜利。他为这个案子耗尽了积蓄，婚姻也破裂了，但这一判决给了他明确的使命，使他集中精力。他创立了华盛顿优质教育研究所，致力于让学校系统负责执行这一判决。霍布森——一个既无政治权力也无财富的普通公务员和父亲——能够迫使如此根本性的变革，这证明了\
  \ 20 世纪 60 年代中期在华盛顿特区酝酿的非凡的草根运动。他是先驱，是挑战联邦和地方当局的激进社区活动家队伍中的第一人。激进的白人记者萨姆·史密斯写道，像霍布森一样，“新活动家们意识到，没有投票权，决策者只会被那些让他们惊讶、困惑、恼怒、拖延或干脆吓到他们的技巧和策略所影响。”而没有人比马里恩·巴里更让当权者感到害怕。⁶⁷\n\
  \n### *“我们要从敌人手中解放华盛顿”：马里恩·巴里挑战华盛顿当权派*\n\n巴里于 1936 年出生在密西西比三角洲小镇伊塔贝纳的一个佃农家庭，五岁时随母亲搬到孟菲斯。母亲再婚后，马里恩在一栋破旧的复式公寓中长大，是家中八个孩子中唯一的男孩。他专注、有动力，拥有惊人的创业精力，成为孟菲斯首批黑人鹰级童子军之一，随后在当地勒莫因学院（现勒莫因-欧文学院）表现出色。他在菲斯克大学获得化学硕士学位，距离博士学位仅差一篇论文时，他辍学加入了纳什维尔民权运动。\n\
  \n他比运动中的同龄人稍年长，政治上更老练，在 1960 年 4 月学生非暴力协调委员会成立时，他设法成为首任主席。他担任该职位仅五个月，随后便逐渐离开，而 SNCC\
  \ 成长为美国最具活力的民权组织。1964 年他回归，加入 SNCC 纽约办公室担任筹款人。巴里富有魅力、雄心勃勃且适应性强，说话带着乡村口音，塑造了一个街头精明的硬汉形象，但他也擅长在\
  \ SNCC 北方的筹款活动中与富有的白人自由派交谈。SNCC 的全国领导人指派他重振陷入困境的华盛顿分会，希望他的筹款能力能将华盛顿分会变成其南方运动的赚钱机器。⁶⁸\n\
  \n1965 年 6 月，29 岁的巴里抵达华盛顿，他身材精瘦结实，留着细胡子，戴着草帽，穿着宽松的非洲风格服装，大摇大摆的姿态让这座城市保守的民权机构感到惊讶；就连古怪的激进分子朱利叶斯·霍布森也穿西装、提公文包。巴里大胆的策略、对抗性的言辞以及对权威的公然蔑视，迅速赢得了华盛顿贫困黑人的钦佩，并引起了白人媒体的密切关注。与此同时，他也激怒、惹恼并常常吓坏了城市中上层阶级社区中的许多领袖，无论黑人还是白人。⁶⁹\n\
  \n巴里抵达华盛顿时，正值全国民权运动换挡。一波又一波的静坐、自由乘车运动和示威活动冲击了南方的政治体制，迫使不情愿的联邦政府介入支持民权抗议者。该运动通过 1964\
  \ 年的《民权法案》和 1965 年的《投票权法案》取得了最大的立法胜利，这两项法案利用联邦力量和资金保护黑人选民，并结束公共场所的种族隔离。\n\n如今，运动面临着年迈的劳工领袖\
  \ A·菲利普·伦道夫所称的“胜利的危机”。随着法律歧视框架的瓦解，运动活动家们努力寻找解决顽固种族不平等问题的办法。黑人贫民区日益增长的愤怒在 1964 年和\
  \ 1965 年夏天爆发为纽约、洛杉矶等城市的骚乱。马丁·路德·金刚刚在阿拉巴马州塞尔马取得胜利，促成了《投票权法案》，他将注意力转向北方城市。他曾将华盛顿视为大规模运动的潜在地点，并于\
  \ 1965 年 8 月访问了该市，但最终选择将芝加哥作为他的首次城市运动地点。运动内部酝酿的意识形态和代际紧张关系爆发，许多年轻的激进分子对金感到失望，对政治进程幻灭，拒绝非暴力作为策略，放弃融合作为目标，并拥抱革命的言辞。SNCC\
  \ 驱逐了其白人成员，并于 1966 年选择了斯托克利·卡迈克尔为新主席。⁷⁰\n\n24 岁的卡迈克尔已是斗争中的老将，他身材瘦长，体现并表达了运动新兴的激进主义。他出生于特立尼达，在布朗克斯长大，是一名明星学生，1960\
  \ 年进入霍华德大学，立即重振了该校沉寂的激进主义传统。他花在南方棉花田里的时间比在教室里还多，组织黑人选民，挑战种族隔离法律，并经常被投入监狱。在 1966\
  \ 年 6 月密西西比州格林伍德的一次演讲中，他捕捉到了那个时代日益增长的激进主义，他怒吼道：“我们要黑人权力！”⁷¹\n\n许多华盛顿黑人介于“民权”和“黑人权力”之间，就像半个世纪前布克·T·华盛顿和\
  \ W·E·B·杜波依斯之间存在类似分歧时一样。他们常常拥抱黑人权力的言辞，即使他们试图在体制内工作以改变自己的社区。马里恩·巴里就是这种方法的典范。他出身于\
  \ SNCC，拥有激进分子的经验、语言和着装，但他怀有长期的政治抱负，从未放弃与白人合作。\n\n当他来管理 SNCC 华盛顿办公室时，巴里立即开始制定计划，使\
  \ SNCC 成为地方政治中的参与者。他不满足于仅仅为其他 SNCC 项目筹款，而是希望利用华盛顿特区黑人多数群体的集体力量来建立经济和政治权力。他斥责华盛顿的黑人领导层“不民主且自私自利”，并提议\
  \ SNCC 开展一项华盛顿“行动项目”。作为国家首都，这座城市是“我们的关键压力点”，尽管 SNCC 有南方运动，但该组织“在华盛顿的政府人员中仍然普遍不为人知”。一场大规模的本地运动将迫使联邦官员关注。⁷²\n\
  \n\n\n\n巴里希望运用学生非暴力协调委员会（SNCC）在南方运动中磨练出的策略，但他组织华盛顿特区的方式与该组织其他活动家有着根本不同。在南方农村，SNCC\
  \ 推行的是巴里所谓的“基地-行动”策略：在发起直接行动运动之前，SNCC 的组织者投入大量时间和精力建立社区支持基础。但在一个拥有超过五十万黑人、分布在数十个街区的大型城市区域，巴里认为这种费力的方法耗时太长。他向来缺乏耐心，更倾向于一种“行动-基地”策略，即\
  \ SNCC 充当“催化剂，由我们中的少数人策划项目和行动，从而催化社区开始建立基础。”⁷³\n\n一旦基础建立起来，长期权力的关键在于选票。“没有投票权，黑人社区的问题就无法解决，”巴里认为，“除非对投票权有大规模的需求，否则这永远不会发生。”他希望通过民权运动的能量和势头来推动陷入困境的地方自治运动，而这场运动二十年来一直由华盛顿自治委员会推动。该委员会的跨种族董事会包括朱利叶斯·霍布森和其他黑人领袖，到\
  \ 1963 年，它明确将自治问题与民权联系起来。然而，这是一个庞大且基本无效的团体，由一群忙碌的人组成，他们的首要任务在其他地方。⁷⁴\n\n自治运动停滞不前，尽管特区居民在\
  \ 1961 年因第二十三条修正案的批准而取得了一项重要胜利——该修正案允许他们自 1800 年以来首次投票选举总统。该修正案最初要求特区居民在众议院获得与其人口成比例的投票代表权（1961\
  \ 年本应是三个席位），以及在选举人团中的代表权，但众议院剥夺了其国会代表权，并将特区的选举人票上限设为三张。该修正案于 1960 年 6 月由国会通过，迅速获得所需的三十八个州批准，并于\
  \ 1961 年 3 月成为法律。⁷⁵\n\n尽管修正案通过得很快，但支持者注意到一股种族反对的暗流。只有一个南方州投票批准了该修正案，而在中西部和新英格兰，《星报》的海恩斯·约翰逊观察到，州议员们“怀疑把投票权交给一个超过一半人口是有色人种的城市，是否会被浪费掉。”尽管存在这些担忧，林登·约翰逊总统成为自托马斯·杰斐逊以来第一位凭借特区实际选票赢得总统职位的总统——1964\
  \ 年，该市二十万合格选民中有 90%投了票。然而，特区选民在国会中既没有代表权，也没有自治权。⁷⁶\n\n约翰逊总统将自治视为其整体民权战略的重要组成部分，并全力支持一项\
  \ 1965 年的法案，该法案将设立一个选举产生的市议会。在国会审议该法案期间，大都会贸易委员会发起了一场全国性的扼杀行动。该委员会（三分之二的成员居住在郊区）游说国会议员，并向数十家报纸发送信件，声称“绝大多数华盛顿人——包括当地公民、专业和商业领袖的压倒性多数——反对自治立法。”与之前的许多法案一样，该法案在参议院获得通过，但在众议院夭折。《国会季刊》将法案的失败部分归因于“南方人和一些北方人（来自两党）担心黑人多数会主导市政选举，进而主导市政府”；它还指出，当地组织“几乎没有真正影响投票的能力”，而全国性的支持者也没有为这项努力“注入力量”。⁷⁷\n\
  \n《国会季刊》的严厉分析和贸易委员会的无耻游说激怒了当地的民权活动家。法案失败后，华盛顿良知联盟发出了抗议的抱怨声。该联盟是一个跨种族的联合会，由大约四十个当地宗教、公民和民权团体于\
  \ 1965 年初组成，旨在“让城市贫困人口未被满足的需求得到关注”。该联盟由 SCLC 的沃尔特·方特罗伊和华盛顿白人圣公会副主教保罗·摩尔担任主席，计划在西北区\
  \ K 街的贸易委员会办公室外设置纠察线，以动员支持自治。然而，据一位批评者称，该联盟存在“领导人太多，士兵不够”的问题，很快就被来自孟菲斯的灵活新秀所超越。⁷⁸\n\
  \n当联盟成员准备设置纠察线时，马里恩·巴里围绕一个平凡但根本的问题——公交车票价——动员了华盛顿的黑人社区。1965 年秋天，由一位名叫 O·罗伊·乔克的纽约富豪企业家领导的华盛顿特区公交公司宣布计划将公交车票价提高五分钱，达到三毛钱——是曼哈顿公交车或地铁票价的两倍。SNCC\
  \ 和其他民权团体立即通过请愿、集会和在大都会地区交通委员会作证等方式提出抗议，但无济于事。然而，乔克的顽固态度给了 SNCC 一个明确的敌人，以及一个培养巴里所谓的“可信度”的机会——即人们能够改变自己生活的感觉。SNCC\
  \ 呼吁全市范围的公交车抵制运动，以抗议“这一提议的经济掠夺”。⁷⁹\n\n抵制运动的协调人是威利·J·哈迪，一位四十三岁、务实干练的民主党活动家，负责运营当地一个反贫困组织。哈迪将组织精力集中在贯穿东北区几个黑人社区中心的本宁路公交线上。她在教堂、理发店和其他地点设立了四十五个“乘车点”，通勤者可以在那里搭上免费便车，她还安排志愿者分发了十万张传单，上面画着一个肥头大耳的乔克从饥饿的孩子手中偷面包。⁸⁰\n\
  \n抵制运动当天——1966 年 1 月 24 日——清晨寒风凛冽，但看到空荡荡的公交车沿着本宁路疾驰而过，SNCC 成员脸上露出了温暖的笑容。巴里夸口说，抵制运动达到了\
  \ 90%的效果，使特区公交公司损失了 15 万次车费；该公司取消了计划中的票价上涨。据《新共和》杂志报道，这是“一次惊人的成功”。这次抗议“让华盛顿人民对自己的力量有了一些信心，”巴里对\
  \ SNCC 的全国领导人说。而在他来到这座城市仅仅半年后，他就取得了第一次明确的组织胜利。⁸¹\n\n受抵制运动的鼓舞，巴里发起了“自由华盛顿”运动，掌握了自治问题的主导权。他打算将\
  \ SNCC 的方法——“教育和动员人民，通过抵制那些不支持投票权的商人的购买力来施加经济压力，并在必要时进行示威”——引入一个以胆怯和失败为特征的运动。他毫不掩饰地将自治与困扰华盛顿黑人的其他问题联系起来。“我们要把华盛顿从我们的敌人手中解放出来，这些人让我们无法对糟糕的学校、残暴的警察、贫民窟房东、进行午夜突袭的福利调查员、在招聘中歧视的雇主，以及我们城市中肆虐的其他种种弊病采取任何行动，”巴里在\
  \ 2 月份该组织的第一次新闻发布会上宣布。他呼吁抵制那些反对自治的商人。⁸²\n\n\n\n手持二十万张传单，上面写着“被锁链束缚 400 年……在华盛顿特区仍被锁链束缚！”，自由华盛顿特区的志愿者们请求商家采取行动支持地方自治，包括签署请愿书、向国会和总统发送电报，以及在商店橱窗中张贴六乘九英寸、橙黑相间的“自由华盛顿特区”贴纸。尽管“良知联盟”此前已就此问题发起纠察，但其成员意识到他们已被抢了风头，于是选择支持自由华盛顿特区。⁸³\n\
  \n几乎从巴里宣布这项努力的那一刻起，自由华盛顿特区就陷入了挣扎。作为原计划的一部分，运动领导人要求店主向政治行动基金捐款，这一有争议的策略被国会议员、贸易委员会甚至地方自治支持者谴责为“敲诈”。一些早期的盟友，包括全国有色人种协进会，退出了这场运动。⁸⁴\n\
  \n巴里迅速放弃了筹款要求，自由华盛顿特区继续推进抵制运动，最初（正如新一代黑人联盟在一代人之前所做的那样）将重点放在 H 街东北段和第十四街西北段的商业区，那里黑人消费者的力量最为强大。然而，这种做法引发了消费者和商家的批评，他们抱怨说这瞄准了错误的目标。当巴里试图向贸易委员会领导人经营的大型企业施压时，运动陷入了停滞。到了夏天，自由华盛顿特区基本偃旗息鼓。那年秋天，国会的地方自治法案再次失败。⁸⁵\n\
  \n尽管生命短暂且动荡，自由华盛顿特区留下了持久的遗产。它引起了媒体的广泛关注，超过七百家企业张贴了支持性贴纸，戳破了商界团结一致反对自治的神话。运动的压力吓坏了贸易委员会，并促使它在四月任命了第一位黑人董事会成员——乔治·E·C·海斯，他是十年前为“博林诉夏普案”辩护的律师之一。这项努力还帮助学生非暴力协调委员会开创了其极为成功的街区派对，这些派对将该组织介绍给社区，并激发了人们对运动的热情，尤其是在年轻人中。⁸⁶\n\
  \n也许最重要的是，自由华盛顿特区深刻影响了马里恩·巴里的职业生涯轨迹。与成功的公交车抵制运动一起，自由华盛顿特区为他树立了声誉，使他成为一个创新且大胆（尽管有争议）的领导者，愿意代表贫困的黑人社区挑战强大的利益集团。运动的失败迫使他重新思考自己的优先事项，并反思如何在他刚刚开始了解的城市中创造变革。面对批评者的围攻——国会议员和白人保守派谴责他的“不道德、非美国且不公正”的策略，既有的黑人领袖质疑他的言辞和战略，而激进活动家则谴责他使用白人志愿者——沮丧的巴里将原因归咎于黑人的恐惧和冷漠。他抱怨说，华盛顿特区的黑人“在心理上已经习惯了那些进来做事然后离开的人”，并且“不习惯为自己做事”。⁸⁷\n\
  \n巴里也承认了自己的误判。他从自由华盛顿特区学到的最大教训是，要关注那些对人们来说更具体的问题。“当一个人墙上的灰泥正在脱落，或者他没有食物，或者他的孩子挨饿时，很难跟他谈论投票权，”巴里承认道。“这是一个很难动员人们围绕的问题。”仅仅为地方自治而战是不够的。他告诉学生非暴力协调委员会的同伴们，人们需要看到生活中直接、即时的改变。“人们必须相信我们有力量，我们有权力……[并且]能够办成事。”⁸⁸\n\
  \n### *“城市贫民的新战斗性”：组织社区要求联邦资源*\n\n办成事的一种方法是在体制内工作，而体制突然对社区意见更加开放了。在 1964 年 1 月的国情咨文中，约翰逊总统发起了“向贫困宣战”，这是一系列雄心勃勃的联邦计划，从“启蒙计划”到“工作团”，旨在将数百万贫困美国人提升到中产阶级。由不知疲倦的萨金特·施莱弗领导的联邦经济机会办公室，将反贫困资金输送到当地的联合规划组织，这是一个由城市专员于\
  \ 1962 年设立的非营利机构，旨在打击青少年犯罪。当詹姆斯·G·班克斯在 1963 年接手时，联合规划组织的预算为 3.5 万美元，只有一名全职员工；两年后，其预算达到\
  \ 2100 万美元，员工 1100 人。⁸⁹\n\n新的反贫困计划不仅仅是打开了联邦资金的闸门；它们还通过要求穷人有机会“最大程度地参与”受益于他们的计划，改变了计划的实施方式。在朱利叶斯·霍布森和其他活动家的推动下，联合规划组织那位爱抽烟斗的领导人詹姆斯·班克斯积极利用其庞大的预算，雇佣社区人员代表穷人运营项目。班克斯是巴里农场本地人，毕业于邓巴高中和霍华德大学，在城市更新期间曾负责监督西南部流离失所居民的搬迁，这一经历最初使他在活动家社区中声誉受损。但他证明了自己对让当地人参与反贫困计划的创造性方式持开放态度，并在工资单上为民权活动家留出了位置，包括马里恩·巴里，后者于\
  \ 1967 年初在压力下离开了学生非暴力协调委员会。⁹⁰\n\n尽管一些活动家抱怨联合规划组织的资金通过“收买”社区成员扭曲了运动，但联合规划组织既为穷人提供了资源，也给予了他们一定程度的行政控制权，鼓励他们发展自己的权力意识。到\
  \ 1968 年，超过 1500 名低收入居民（其中许多是女性）通过联合规划组织和华盛顿特区的其他社区行动计划担任行政和咨询职务。“不再是温顺的施舍接受者，”《华盛顿邮报》的威廉·拉斯伯里在\
  \ 1967 年写道，“他们变得直言不讳、坚持己见、要求苛刻。”⁹¹\n\n也许没有哪个地方比东南定居点更能体现拉斯伯里所称的“城市贫民的新战斗性”。东南定居点由先驱黑人医生多萝西·博尔丁·费雷比于\
  \ 1929 年创立，提供各种社会服务，从儿童娱乐项目到老年人健康诊所。1965 年，随着联合规划组织注入 13.3 万美元，东南定居点成为激进组织活动的中心，当地居民成为有偿的社区组织者，他们举办会议、举行集会，并就鼠患、学校过度拥挤和娱乐设施不足等问题与城市官员对峙。⁹²\n\
  \n东南定居点的组织者帮助成立了一个名为“巴里农场天使乐队”的创意租户团体，以回应国家首都住房管理局 1966 年翻新巴里农场公共住房综合体的计划。“天使乐队”要求他们的意见在规划过程中得到考虑，并迫使住房管理局局长沃尔特·华盛顿对综合体进行巡视。他们的策略奏效了。华盛顿将翻新资金增加了四倍，并将资金拨给居民投诉重点的内部改善项目，而不是规划者优先考虑的外部维修。⁹³\n\
  \n\n\n\n埃塔·梅·霍恩是受东南社区组织者启发、挑战地方当局的当地居民之一。作为七个孩子的单亲母亲，霍恩只受过八年级教育，且身有残疾，不得不依靠福利金和补贴住房来养家糊口。在坚持不懈的组织者敲响她的门后，霍恩加入了“巴里农场天使团”，并开启了福利维权生涯，抨击城市福利官员的居高临下态度、令人反感的程序和不透明的政策。1966\
  \ 年，她协助创立了华盛顿福利联盟，该联盟后来隶属于全国福利权利组织，旨在将福利领取者的观点带入全国福利改革辩论中。凭借洪亮的嗓音、倔强的独立性格以及善于吸引眼球的策略——她曾将抗议标语牌插在蛋糕中央，扰乱福利部门办公室的庆祝活动——霍恩成为华盛顿最知名且最具争议的福利倡导者之一，也是通过反贫困行动参与政治的数百名黑人女性之一。⁹⁴\n\
  \n当埃塔·梅·霍恩和巴里农场天使团在东南部挑战城市规划者和福利官员时，西北部中城社区的居民也在国家首都规划委员会于 1966 年将该区域列为城市更新目标并更名为“肖”后团结起来。该委员会以该地区的初中命名，这所学校是为了纪念罗伯特·古尔德·肖，一位指挥联邦军首批黑人团之一的内战时期白人军官。到\
  \ 20 世纪 60 年代初，学校官员和当地居民都将这所破旧拥挤的学校称为“可耻的肖”，这反映了周边社区的衰败。\n\n沃尔特·方特罗伊在距离学校仅两个街区的新伯特利浸信会教堂的讲坛上，目睹了该地区的腐蚀。但他和其他当地活动人士担心，城市更新会夷平社区内古雅的联排别墅，迫使居民搬迁，并将该地区变成另一个“西南区”——充斥着毫无灵魂的高层公寓楼。方特罗伊协助组织了模范内城社区组织（MICCO），这是一个由约\
  \ 150 个教堂、公民团体和企业组成的联盟，旨在让肖区居民“在重建社区中拥有发言权和参与权”。因西南区的经验而受到教训，并担忧城市愤怒情绪上升，新成立的住房和城市发展部的联邦官员向\
  \ MICCO 拨款 180 万美元，帮助规划者征求当地居民的意见，并将其纳入更新计划。⁹⁵\n\n这笔巨额资金——反映了基层组织新获得的力量——为 MICCO\
  \ 提供了机会，“向全国展示一个令人鼓舞的范例，说明一个破败的贫民窟如何能够由居住在那里的人、为了他们、并与他们一起进行更新，”方特罗伊说道，他暂时离开教堂，全职投入\
  \ MICCO 的工作。该组织举办了无数社区会议和集会，以克服居民对城市更新的冷漠和怀疑。1967 年 3 月，它赞助了一场由方特罗伊的导师马丁·路德·金领衔的非凡游行，金称\
  \ MICCO 在肖区的工作是“我国有史以来对贫民窟发起的最大规模、最全面的进攻”。该组织甚至创作了一首主题曲，曲调借用《迈克尔，把船划上岸》：\n\n老西南区，它输掉了战斗，哈利路亚！\n\
  \n但我们的肖区会变好，哈利路亚！\n\n老西南区做错了一件事，哈利路亚！\n\n太久没有组织起来，哈利路亚！⁹⁶\n\n尽管 MICCO 招致了城市官员和激进活动人士的批评，但它成功保留了社区的美学特征，并防止了低收入居民的大规模流离失所。⁹⁷\n\
  \nMICCO 展示了社区活动人士如何利用联邦资源保护穷人利益，这一教训马里恩·巴里没有忘记。巴里希望利用 1967 年夏天底特律、纽瓦克和其他北方城市发生骚乱时白人官员阶层中弥漫的恐惧。紧张的联邦官员，包括劳工部长威拉德·沃茨，担心华盛顿可能成为下一个爆发点。沃茨是中西部人，以积极捍卫工人权利而闻名，他与巴里合作开展了一项新的社区计划，以解决青年失业问题。⁹⁸\n\
  \n沃茨无视此类项目的常规繁文缛节，迅速批准了 30 万美元的拨款，帮助巴里启动“骄傲公司”。该公司利用联邦资金雇佣、培训并监督年轻黑人男性——即使在媒体和官方报告中，他们也常被称为“哥们”——从事市政改善项目。那年八月，身着深绿色军装式牛仔布制服的骄傲公司员工遍布全城，清理垃圾、灭鼠、美化破败区域。最初作为临时暑期项目获得资助的骄傲公司赢得了媒体赞誉，在巴里推动全年资助后，沃茨提供了\
  \ 200 万美元的拨款。⁹⁹\n\n骄傲公司取得了一定的成功记录，但和 MICCO 一样，它也吸引了各种各样的批评者，其中一些人指责它“不过是以相当低廉的价格公然购买夏季和平”。白人保守派攻击它是“一场初级黑人权力运动”，并质疑选择有逮捕记录、喜怒无常的二十岁青年鲁弗斯·“鲶鱼”·梅菲尔德来管理这个数百万美元的项目。骄傲公司也引起了斯托克利·卡迈克尔等黑人民族主义者的质疑，他们对接受政府资金并与白人联邦官员合作持怀疑态度。然而，骄傲公司让巴里及其支持者有机会切实改善穷人的生活，并帮助他建立了社区支持基础。在内部权力斗争中驱逐梅菲尔德后，巴里完全掌控了该项目。¹⁰⁰\n\
  \n骄傲公司、MICCO、联合规划组织以及其他地方组织鼓励华盛顿的贫困居民争取自己应得的公共资源。他们不再通过抗议来迫使联邦和地方官员为他们采取行动，而是要求获得资源，让社区成员能够实施自己的计划。他们动员当地民众，向官员施压，要求兑现“最大可行参与”的承诺。通过争取充足资源并坚持控制花在自己社区的资金，这些反贫困组织帮助重塑了联邦政府与其首都之间的关系。\n\
  \n### “就当自己当选了”：新任命市议会直面警察暴力\n\n没有哪位总统像林登·约翰逊那样对华盛顿产生如此积极的影响。自哈里·杜鲁门以来的每位总统都对地方自治给予过口头支持，但约翰逊采取了实质性步骤来实现它，即使没有国会的支持。出于对城市骚乱的恐惧、要求采取地方自治行动的压力日益增大，以及巩固其民权遗产的愿望，约翰逊通过废除自\
  \ 1874 年以来统治该市的三人专员政府形式，重塑了华盛顿特区的政治格局。他的单方面行动使这座城市走上了不可逆转的自治之路。\n\n\n\n\n\n约翰逊的计划于\
  \ 1967 年 8 月生效，设立了一个由九人组成的市议会，由一位市长/专员领导。他将这项措施描述为创建“一个组织更完善、效率更高的政府”的方式，以应对日益增长的犯罪问题，但他也将其视为迈向完全自治的一步，尽管市议会所有成员均由总统任命，且国会保留对其预算和立法的否决权。国会哥伦比亚特区委员会的保守派认为这是对他们权力的攻击，而地方商会则担心重组会导致完全自治。双方都强烈反对重组，但约翰逊最终获胜。¹⁰¹\n\
  \n约翰逊对市议会的首批任命反映了华盛顿在短短六年内发生了多大变化——自活动人士欢呼首位黑人市专员提名以来。象征主义已不再足够，约翰逊也意识到了这一点。他避开了朱利叶斯·霍布森和马里恩·巴里等有争议的激进分子，但任命了市议会中的黑人多数，包括沃尔特·方特罗伊和斯特林·塔克，以及坚定的白人民权支持者，如民主党全国委员会代表波莉·沙克尔顿。最重要的是，他任命了一位黑人——沃尔特·华盛顿——担任专员，即哥伦比亚特区未经选举的市长。¹⁰²\n\
  \n华盛顿在该市根基深厚。他出生于纽约州詹姆斯敦，1934 年来到华盛顿特区就读霍华德大学，加入新黑人联盟，并与第三浸信会著名牧师的女儿本内塔·布洛克结婚。他深耕于市政住房官僚体系——他的第一份工作是担任约翰·伊尔德在“小巷居住管理局”的初级住房助理——并于\
  \ 1961 年晋升为全国首都住房管理局首位黑人负责人。他是一位精通市政复杂事务的完美官僚，同时也活跃于各种社区组织，包括城市联盟和联合规划组织。但无论在性情还是意识形态上，他都不是激进分子。和蔼可亲、谦逊低调的华盛顿，在国会和联邦机构内部对种族暴力的恐惧高涨之际，对约翰逊来说似乎是一个安全的选择。“就当自己是被选上的那样行事，”约翰逊在华盛顿于\
  \ 11 月就职时建议道。¹⁰³\n\n新市议会面临的首批考验之一，是解决警察暴力问题——这是一个长期存在的、跨越阶级界限、团结了该市难以驾驭的黑人领导层的挫败感和愤怒之源。20\
  \ 世纪 60 年代，随着华盛顿特区及其他城市地区犯罪率飙升，警察对黑人公民的虐待成为一个爆炸性的社会问题。根据联邦调查局的数据，1960 年至 1969 年间，华盛顿特区的年谋杀案数量从\
  \ 81 起跃升至 278 起，而暴力犯罪率几乎翻了两番。¹⁰⁴\n\n国家首都的犯罪激增引发了媒体的狂热报道和联邦当局的愤慨。约翰逊总统与国会合作，向大都会警察局投入资金，改善联邦与地方执法官员之间的协调，并通过立法扩大地方警察权力。一项有争议的反游荡法允许警察逮捕“不离开”的人，即使他们没有犯罪。马里恩·巴里于\
  \ 1966 年 5 月因此罪名被捕。\n\n这些新法律由一个警察部门执行，该部门在 20 世纪 60 年代中期，在一个黑人人口超过 60%的城市中，白人比例仍超过\
  \ 80%，且大部分为非本地居民。在贫民区，警察被视为“白人至上和压迫的象征”，市属机构“人际关系委员会”写道，该委员会在坚韧不拔的露丝·贝茨·哈里斯的领导下，将警察改革列为重中之重。¹⁰⁵\n\
  \n瑞典人类学家乌尔夫·汉纳兹在 1967 年和 1968 年的大部分时间里，在华盛顿特区的一个贫民区为其开创性著作《灵魂之侧》进行研究，他注意到了贫困黑人居民与警察之间紧张而充满冲突的关系。“使用令人反感的称呼——‘小子’、‘黑鬼’等等——表明许多警察并不掩饰他们的偏见，而一些过度使用武力的行为只能被理解为警察暴力，”汉纳兹观察到。随着犯罪率上升，警察更频繁地诉诸武力，但贫民区居民抱怨说，他们更关注保护财产而非帮助人民。“警察说，‘让那些黑鬼互相残杀吧，’”当地居民告诉汉纳兹。“只要不是在白人社区，他们才不管。他们只盯着商店。”¹⁰⁶\n\
  \n警察与黑人居民之间的冲突频繁爆发，包括 1966 年 8 月发生在东南区的一起事件，几乎升级为全面骚乱。市政官员通常无视公民对警察暴力的投诉。自 1948\
  \ 年警察局设立投诉审查委员会以来的近二十年里，仅有一次对一名警官的不当行为进行了训诫。意识到该部门与公众关系日益恶化，警察局长约翰·莱顿与“人际关系委员会”合作调解纠纷，并设立了一个平民委员会作为公民与警察之间的联络人。该部门改变了培训程序，并开始提拔更多黑人警官，但挫败感仍在加剧。在局长的委员会工作了一年后，朱利叶斯·霍布森愤怒地辞职，怒斥该小组主要关注改善部门形象，并“充当缓冲器，以减轻警察持续骚扰无助穷人的打击和影响”。¹⁰⁷\n\
  \n当新市议会于 1967 年 11 月就职时，立即面临国会高地东南社区的一场警察危机。据居民称，一名无赖警官经常使用种族歧视语言并虐待黑人居民。应露丝·贝茨·哈里斯的要求，新市议会调查了该警官，并举行了听证会，居民——包括反贫困活动人士和身着制服的“骄傲公司”工人——就一系列虐待行为作证。听证会引发了轩然大波，警察官员及其在国会中的盟友施加压力，迫使华盛顿市长介入并宣布市议会无权审查警察行为。这是一个令人警醒的提醒：尽管约翰逊总统言辞慷慨，但新政府实际上几乎没有权力对公民的投诉做出实质性回应。¹⁰⁸\n\
  \n\n\n\n\n市议会在遏制警察滥用职权方面的无能，只会加剧黑人社区的愤怒。1967 年底，黑人权力活动家斯托克利·卡迈克尔回到华盛顿特区，希望将这种愤怒转化为统一行动。这位前学生非暴力协调委员会（SNCC）主席刚刚结束为期五个月的世界巡演，期间他受到几内亚的艾哈迈德·塞古·杜尔、古巴的菲德尔·卡斯特罗以及其他世界领导人的英雄般款待，他计划在首都建立自己的行动基地。1968\
  \ 年 1 月，他召集了一百名领导人，成立了黑人联合阵线（BUF），这是一个旨在团结不同黑人团体、用一个声音说话的组织，争取“在特区的决策委员会中享有合理且相称的份额，并在黑人社区中合理且相称地控制经济机构”。BUF\
  \ 涵盖了黑人社区中从中间派到左派的思想范围，从像斯特林·塔克和沃尔特·方特罗伊这样的温和派，到像朱利叶斯·霍布森、威利·J·哈迪和马里恩·巴里这样的激进派。更保守的组织，包括全国有色人种协进会（NAACP）当地分会、商业团体和百人牧师委员会，拒绝参与，但该联盟迅速以种族正义的强烈倡导者身份自居。随着该市大多数黑人领袖承诺与全国最重要的黑人权力倡导者合作，华盛顿似乎已准备好迎接未来更激进的抗议活动。¹⁰⁹\n\
  \n到 1968 年初，全国民权运动的立法胜利以及多年日益增长的基层活动，催生了 SNCC 工作人员所称的“期望革命”，民权领袖、反贫困活动家和居民都拥抱了越来越雄心勃勃的议程，以建立黑人的政治和经济权力。然而，进步并未跟上期望的步伐。尽管经历了二十年的抗议、谈判、听证会和关于种族不平等的报告，华盛顿仍然是一个隔离且不平等的城市，黑人与白人之间的鸿沟似乎只会越来越大，低收入黑人社区中的挫败感也在加剧。一些联邦官员、记者和企业主希望联邦政府的存在和强大的黑人中产阶级能使华盛顿特区“免于骚乱”，而疲惫的活动家则哀叹动员该市黑人社区为种族正义而战的困难。“你可以带一个小黑女孩，给她穿上蝉翼纱，带她去市中心，往她身上倒汽油，烧死她，这都不会触动社区，”朱利叶斯·霍布森在\
  \ 1967 年抱怨道。¹¹⁰\n\n但其他在华盛顿贫困居民中生活和工作的人看到了严重暴力的可能性。“许多人确实有合理的担忧，即如果不尽快采取措施缓解状况，该地区的一个或多个绝望角落可能会直接爆炸，”沃尔特·方特罗伊在\
  \ 1966 年警告道。愤怒、挫败感和怨恨，尤其是在华盛顿黑人贫民区，针对控制这座城市的力量——国会、警察、贸易委员会——不断升级，用当时的说法就是“白人老爷”和“白人权力结构”。在题为“等待燃烧开始”的一章中，人类学家乌尔夫·汉内兹写道：“在爆发之前，反抗这些外部势力的基础早已存在。”¹¹¹\n\
  \n爆发发生在 1968 年 4 月 4 日。\n\n## 第十二章\n\n## 会有火焰，会有战斗，会有叛乱！\n\n## *巧克力城的动荡与希望，1968–1978*\n\
  \n越来越多的华盛顿人不愿接受，作为政府所在地就应该剥夺他们享受政府理应带来的果实——自由的权利。\n\n——萨姆·史密斯，1974 年\n\n第十四街和 U\
  \ 街西北角的交叉口在华盛顿黑人心中占有特殊地位。在二十世纪的大部分时间里，第十四街和 U 街是一个繁华的黑人商业区交通枢纽，那里有一排排的商店、餐馆、剧院和俱乐部，迎合黑人顾客，并邀请像杜克·埃林顿这样在附近长大的黑人艺术家表演。正是在这里，SNCC、SCLC、Pride\
  \ 等民权组织在 1960 年代设立了总部。也正是在这里，当 1968 年 4 月 4 日星期四晚上 7 点过后不久，马丁·路德·金遇刺的消息传到首都时，华盛顿黑人聚集了起来。\n\
  \n金在 1968 年初经常来华盛顿，当时他正准备发起“穷人运动”，这是一项雄心勃勃的努力，旨在将成千上万各种族贫困人口带到首都，以提高人们对美国持续贫困问题的认识。在他遇刺前的那个周日，他在华盛顿国家大教堂布道，解释这项运动。“我们不是来破坏华盛顿的，”他对四千名听众说。“我们是来要求政府解决贫困问题的。”¹\n\
  \n随着金去世这一毁灭性现实开始被接受，SNCC 的工作人员与该组织的前领导人斯托克利·卡迈克尔在位于第十四街和 W 街的 SNCC 总部会面。愤怒的卡迈克尔将金视为导师，尽管两人在许多问题上存在重大分歧，他带着大约二十名追随者冲出办公室。他们沿着第十四街向南行进，沿途停在商店前，要求商店为纪念金而关门；紧张的管理人员照做了。沃尔特·方特罗伊整晚都在向白宫通报情况，他急忙赶去在\
  \ T 街附近拦截这群人。“这不是办法，斯托克利，”方特罗伊恳求道。卡迈克尔身材高大，俯视着矮小的议员，向他保证这群人只是想关闭商店。事实上，他和 SNCC 的工作人员有时会亲自干预，阻止人群破坏财产。有一次，卡迈克尔挥舞着一把枪，告诫任何想使用暴力的人回家去。²\n\
  \n但大约在晚上 9 点 30 分，有人打碎了 U 街人民药店的大玻璃窗，那里是三十年前许多新黑人联盟抗议活动的地点。仿佛大坝决堤，释放出的积压愤怒席卷了第十四街和\
  \ U 街周边地区，并蔓延到西北第七街和东北 H 街的黑人商业区，以及远东南区的黑人社区。意识到自己无法控制人群，卡迈克尔撤离了现场。³\n\n局势迅速失控。最初在人群聚集时袖手旁观的警察，现在手忙脚乱地试图恢复秩序，而数千人——几乎全是黑人——在街道上几乎畅通无阻地游荡，砸碎窗户并抢劫。警察使用催泪瓦斯试图驱散人群，但徒劳无功（他们还向\
  \ SNCC 办公室投掷了催泪瓦斯，当时里面约有二十名成员）。火灾爆发，当消防员赶到现场时，迎接他们的是石块和瓶子。⁴\n\n混乱持续了数小时，即使方特罗伊、露丝·贝茨·哈里斯和其他黑人领袖在街上劝说人们回家。“我们寡不敌众，”一名警察后来回忆道。“肯定是几百比一，各个年龄段的孩子、女人、所有人。”市长沃尔特·华盛顿当晚乘车巡视第十四街，目瞪口呆地看着抢劫者兴高采烈地爬过破碎的商店橱窗，偷走衣服、电子产品和其他商品。“这一切有一种节日的欢乐气氛，人们在笑，在交谈，”陪同华盛顿的黑人《星报》记者保罗·德莱尼写道。只有午夜时分的一场暴雨才浇灭了人们的热情。⁵\n\
  \n\n\n\n周五清晨，华盛顿居民醒来时，发现警察已沿市中心街道列队，催泪瓦斯和烟雾在城市上空飘荡。黑人商业区那些玻璃散落的街道基本已清理干净。华盛顿市长让学校和政府办公室保持开放，并下令立即进行清扫。市长和媒体谴责了暴力行为，但许多活动人士并未试图安抚前一夜的激烈情绪。“你不能指望人们不这样反应，”主要由中产阶级组成的公民协会联合会主席爱德华·J·麦克莱恩说，“这座城市朝着这个方向已经很久了。”在早间新闻发布会上，斯托克利·卡迈克尔挑衅地呼吁黑人居民武装自己，为解放战争做准备。当天下午，他前往霍华德大学——就在暴乱者焚烧第七街商铺的山坡上方。“我们今晚会出去，”他对数百名群众说。他挥舞着一把枪，补充道：“不要抢劫——要开枪。”⁶\n\
  \n![图片](img/f0001-21.jpg)\n\n*1968 年 4 月马丁·路德·金遇刺后爆发的骚乱摧毁了华盛顿黑人区的大片区域，包括西北第七街的这一段。尽管破坏严重，许多华盛顿黑人仍将骚乱视为一种宣泄，并对骚乱后的复兴抱有希望。©\
  \ 马修·刘易斯 / 《华盛顿邮报》。*\n\n就在卡迈克尔讲话的同时，抢劫和纵火再次开始，市政官员很快意识到他们无法阻止日益加剧的暴力。暴乱者蔓延至华盛顿市中心的景象迫使约翰逊总统介入。他命令国民警卫队、第\
  \ 82 空降师和第 503 宪兵营进入城市。部队最初难以抵达骚乱区域——数千名郊区通勤者堵塞了试图逃离城市的街道——暴力持续到深夜，“大火无人看管，人行道上堆满了湿漉漉的抢劫物品，烟雾笼罩一切，”《星报》报道。到周六黎明，13,600\
  \ 名联邦军队已控制住华盛顿。这是美国历史上针对任何骚乱的最大规模部署，军队在烟雾弥漫的首都街道上巡逻的画面让全国民众感到不安。⁷\n\n暴力并非完全随机。警方和媒体的报道以及传闻证据证实，一些暴乱者常常避开黑人拥有的企业，这些企业在店面橱窗上贴着“灵魂兄弟”的标志。U\
  \ 街上的本氏辣椒碗餐厅在整个骚乱期间保持营业，成为社区活动人士的战略中心。Safeway——这家杂货连锁店因几十年前激烈对抗新黑人联盟而在黑人社区中备受憎恶——其门店“尤其受到重创”，《纽约时报》报道，而其竞争对手\
  \ Giant 则遭受了相对较小的损失。Giant 的老板约瑟夫·丹赞斯基支持马里恩·巴里与 Pride 组织的工作；随着暴力升级，他和巴里在骚乱区域建立了食品分发中心，巴里还派\
  \ Pride 工作人员保护 Giant 门店。然而，肆虐的大火吞噬了民权支持者拥有的企业，也吞噬了种族主义者经营的企业。前城市联盟主席莫蒂默·莱博维茨曾与马丁·路德·金在塞尔马一起游行，他眼睁睁看着自己四家服装店中的三家被烧毁。⁸\n\
  \n华盛顿市长禁止销售酒精、易燃液体和枪支，并实施了每晚下午 5:30 的宵禁，该宵禁持续了一周。零星的暴力迫使年度樱花节游行取消，但到周日，城市基本恢复平静。十三人死亡，多数因火灾和烟雾吸入；两人被警方击毙。西北第十四街、西北第七街和东北\
  \ H 街的黑人商业走廊沿线整个街区化为瓦砾，曾经繁荣的商铺只剩下烧焦的残骸。超过九百家企业受损或毁坏，约五千人失业，两千人无家可归。据《华盛顿邮报》报道，约两万人参与了骚乱，警方逮捕了超过七千六百人（其中\
  \ 90%是黑人男性），主要原因是违反宵禁。⁹\n\n骚乱暴露了地方政府的无力，但沃尔特·华盛顿在混乱中冷静而坚定的行动赢得了赞誉。在司法部长拉姆齐·克拉克的支持下，华盛顿多次拒绝了参议员罗伯特·伯德等人要求警方下达“格杀勿论”命令的呼吁。国家首都地区公民自由联盟——通常是警方的严厉批评者——赞扬了警方的“克制和冷静”。然而，白人企业主和社区团体谴责了克拉克，并指责警察局长约翰·莱顿对抢劫者过于软弱。“我们是牺牲品，”一位白人女商人告诉参议员伯德。¹⁰\n\
  \n华盛顿黑人居民带着愤怒、悲伤、反抗和决心交织的情绪审视着破坏。许多人同意自称“黑人权力倡导者”的露西·库森的观点，她称自己东北社区发生的抢劫是“毫无意义且不负责任的”。然而，在一项调查中，近一半的华盛顿黑人认为骚乱起到了“有益的作用”。《华盛顿信息报》的黑人出版商卡尔文·罗拉尔克称其为“消费者反抗”，针对的是那些“剥削贫民区居民”的企业。许多黑人居民开玩笑说，骚乱提供了“即时城市更新”，摧毁了掠夺性企业和破旧住房——这些本应早就被拆除。¹¹\n\
  \n还有一种兴奋感。“白人……告诉你上学受教育，然后他们给你一份微不足道的工作，还指望你觉得世界如此仁慈，”一位匿名的黑人政府雇员在《华盛顿邮报》中写道。她在骚乱中被捕，但对自己的参与几乎没有感到内疚。“这个城市的黑人在那三天里真的很开心。他们被踢了这么久，这是他们生命中的一个高潮。”¹²\n\
  \n骚乱既是灾难性的，也是宣泄性的，这是一场吸引全国注意力的危机，让城市的问题得到了广泛关注。“华盛顿现在有机会在政治、社会以及物质上进行重建，”黑人联合阵线的牧师钱宁·菲利普斯认为。也许混乱中能产生一些好处——只要当地居民自己规划重建工作并亲自动手。“如果事情以同样的方式重建，它们还会被再次烧毁，”马里恩·巴里在骚乱一周后警告说。“我们（社区）必须坚持，如果白人商人想回到我们的社区，他们必须作为合作伙伴回来。”¹³\n\
  \n骚乱发生时，这个任命产生的市议会才上任不到六个月，它举行了一系列公开听证会，近一百名当地居民作证。其报告于五月发布，强烈谴责了暴力行为，并拒绝了将所有白人排除在重建过程之外的呼吁。这份报告由白人主席约翰·赫钦格撰写——他是一家主导五金连锁店的老板，也是华盛顿显赫家族的后裔——同时也承认了社区愤怒的深层根源。“华盛顿黑人社区应在重建和恢复政策的规划和实施中发挥核心和强大的作用，”市议会强调。“贯穿始终的是，需要重建的社区对自决权的普遍要求。”¹⁴\n\
  \n\n\n\n\n1968 年 4 月骚乱后的十年，是一个喧嚣而不可预测的时期，充满了公民驱动的政治、文化与政治实验以及迅速的变化。对于这座被放克乐队 Parliament\
  \ 在 1975 年深情地称为“巧克力城”原型的城市来说，那是一段动荡却充满希望的日子。哥伦比亚特区近一个世纪以来首次获得了一定程度的地方自治权，而华盛顿各族裔居民——包括亚当斯摩根和芒特普莱森特社区日益壮大的拉丁裔群体——纷纷争取自决、社区控制和参与式民主。\n\
  \n### *“没有白人的道路穿过黑人的家园”：高速公路与对抗政治的新时代*\n\n在金遇刺当晚，萨米·阿卜杜拉·阿博特正在街头做他最擅长的事：抗议。令警方惊愕的是，他带领一支跨种族的纠察队伍在市长沃尔特·华盛顿位于勒德罗伊特公园的住所前举行了示威。阿博特是叙利亚基督教移民的孙子，声音沙哑，身材矮小，长着显眼的鼻子、黑框眼镜，秃顶周围有一圈修剪整齐的白发。他生于\
  \ 1908 年，在纽约州伊萨卡长大，曾短暂就读于康奈尔大学，后辍学去组织工人。1940 年，他与妻子露丝搬到马里兰州塔科马公园，就在特区边界外——他拒绝住在华盛顿市内，因为他想拥有投票权。二战期间，他在美国空军获得铜星勋章，随后投身战后的和平与民权运动，引起了联邦调查局和众议院非美活动委员会的注意；在被列入黑名单两年后，他开始了自由艺术家的职业生涯。¹⁵\n\
  \n阿博特习惯于挑战权威，他是一团愤怒的能量——“我是一个永远愤怒的人，”他曾这样说。像朱利叶斯·霍布森一样，他将愤怒转化为有组织的抗议。1964 年，他找到了一个将占据他接下来十年人生、并奠定他社会活动家遗产的事业：高速公路。露丝告诉他，他们的家正位于一条规划中的高速公路的路线上，这条公路将穿过华盛顿东北部和塔科马公园，连接郊区蒙哥马利县新开通的环城公路。阿博特夫妇与沿线其他九名忧心忡忡的房主一起，发起了“交通危机紧急委员会”（ECTC），并成为华盛顿最重要、最成功的抗议运动之一的领导者。\n\
  \n自 20 世纪 30 年代以来，高速公路建设一直是城市规划的支柱。1956 年《国家州际与国防高速公路法案》的通过，使高速公路成为国家安全优先事项，国会承诺承担其建设费用的\
  \ 90%。面对数十亿美元的联邦资金，华盛顿地区众多强大的利益集团联合支持高速公路：大都会贸易委员会的商人希望将郊区购物者吸引回城市，建筑公司渴望获得利润丰厚的合同，城市规划者希望实施远景项目，报纸编辑和地方推动者鼓励增长与发展，地方官员寻求扩大税基和解决“城市衰败”的方案，以及国会议员希望通过赞助和猪肉项目回报朋友。20\
  \ 世纪 50 年代，穿越华盛顿西南部的 I-395 和穿过远东南部的 I-295（阿纳科斯蒂亚高速公路）开始建设。规划者、政治家和评论员曾就各种方案的细节争论不休，但直到\
  \ 20 世纪 60 年代初，很少有人质疑一开始修建这么多高速公路的总体智慧。\n\n这种状况在首都规划委员会发布其 1959 年《交通规划》后开始改变。该规划勾勒出一个\
  \ 329 英里的高速公路网络，将纵横交错地穿过大都市区，其中包括 29 英里穿越城市本身的州际公路。规划者设想三个同心圆的多车道高速公路：环绕城市的外环（后来称为环城公路）、中间环的公园路，以及穿过市中心的内环。一系列放射状高速公路从内环向外延伸，穿过城市社区连接外环。¹⁶\n\
  \n该规划在纸面上看起来清晰连贯，但它没有考虑到高速公路将要修建的社区中可能出现的破坏和搬迁。据估计，华盛顿特区将有 5400 所房屋被毁，导致多达两万居民流离失所。规划者更多考虑交通效率而非政治因素，也未能预见到他们提议的西北高速公路会引发众怒——这条公路将穿过富裕的克利夫兰公园社区，那里居住着许多白人专业人士以及国会议员和其他联邦官员。¹⁷\n\
  \n一位愤怒的西北麦克姆街房主是彼得·斯特宾斯·克雷格，他毕业于欧柏林学院和耶鲁法学院，在市中心著名的科文顿-伯林律师事务所工作。克雷格帮助发起了“西北交通规划委员会”来组织反对该规划。凭借法律智慧、细致研究以及在国会山的广泛人脉，克雷格及其盟友在公开听证会和法庭上猛烈抨击拟议的高速公路。正如《邮报》专栏作家乔治·拉德纳所言，“现状的维护者利用电话、直呼其名和乡村俱乐部的闲聊”来阻挠西北高速公路。一年之内，同情他们的国会通过了一项为期五年的禁令，禁止在西北十二街以西和内环以北修建高速公路，从而保住了该市最富裕、白人最多的社区。¹⁸\n\
  \n主要居住着黑人和贫困人口的社区并未获得这样的保护，尽管从激进的 SNCC 到中产阶级的公民协会联合会等黑人组织都反对高速公路建设。在国会否决西北高速公路后，《非裔美国人报》的头条赫然写道：“计划摧毁家园：数千有色人种将被赶出华盛顿；白人住宅得以保全。”1963\
  \ 年，位于西北新泽西大道的圣经之路教堂的活动家主教斯莫尔伍德·威廉姆斯呼吁明尼苏达州参议员休伯特·汉弗莱保护他的教堂免遭 I-395 建设拆除，但他只成功地将道路改道至教堂建筑后方，而整个社区其余部分被夷为平地。“必须采取行动，阻止仅仅为了马里兰州和弗吉尼亚州白人驾车者的利益而毫无意义地摧毁有色人种家园的行为，”斯莫尔伍德说。¹⁹\n\
  \n在试图穿越西北部受挫后，高速公路倡导者寻求一条不那么直接但在政治上更易接受的方式，将拟议的市中心内环与环城公路连接起来。1964 年底，城市规划者提议修建一条十车道的北中央高速公路，该公路将穿过布鲁克兰和其他以黑人为主的东北部社区，以及马里兰州塔科马公园和银泉等中等收入、以白人为主的郊区。官员估计，这条高速公路将导致约\
  \ 1300 个家庭搬迁，其中一半以上在特区境内。²⁰\n\n\n\n\n\n中北高速公路促使萨米·阿博特及其盟友采取行动。阿博特和交通危机紧急委员会（ECTC）希望彻底阻止这座城市的新的高速公路建设——而早在\
  \ 1964 年，这座城市的人均高速公路里程就已位居全国之首。ECTC 坚持认为，任何解决交通危机的方案“都必须基于这样一个原则：所有社区，而非部分社区，都必须得到保护；所有社区，而非部分社区，都必须得到服务；所有人，而非部分人，都有权在捍卫自身权利时受到法律保护。”ECTC\
  \ 呼吁建设一个广泛的公共交通系统，包括一条连接贫困社区与市中心的地铁，以此取代高速公路。²¹\n\n出于经济自利、政治实用主义和道德理想主义的驱动，阿博特和\
  \ ECTC 有意建立了一个跨种族、跨阶级的联盟，能够发动一场持久、多战线的运动，以击败高速公路游说集团。在全国民权运动因种族隔离问题而分裂之际，ECTC 自成立之初就“将富人和穷人、黑人和白人团结在激进的领导之下”。²²\n\
  \n阿博特希望将西北区的白人房主纳入 ECTC 的联盟。他最早招募的人之一是彼得·克雷格，当时克雷格正领导反对在乔治城大学附近的三姐妹岛修建一座横跨波托马克河的八车道大桥。尽管两人风格迥异——阿博特是个煽动群众的鼓动者，克雷格则是个冷静的局内人——但他们都对高速公路及其对城市社区可能造成的破坏怀有强烈的厌恶。阿博特打电话给克雷格，激将道：“你关心的只是[岩溪]公园以西的那些富裕白人。”多年后回忆起这段对话，克雷格笑着说：“他让我感到内疚，而作为一个善良的贵格会教徒，我上当了。”克雷格与一个名为“联邦城市百人委员会”的当地公民组织合作，在国会山游说，在听证会上作证，最重要的是，他提起了反高速公路诉讼。²³\n\
  \n然而，阿博特在意识形态和性情上都不适合领导一场在现有政治渠道内游刃有余的体面改革运动。他和其他 ECTC 联合创始人认为，受高速公路威胁最大的人——城市中的黑人贫困群体——应该主导反高速公路运动。阿博特招募了雷金纳德·布克，一位在总务管理局工作的黑人职员，他曾在一次社区会议上听到布克的发言。布克小时候，全家在城市更新期间逃离了西南区的家园；从罗斯福高中毕业后，他积极参与各种民权抗议活动。布克常身着黑豹党风格的服饰——一件达西基衫和深色墨镜——这位高大、瘦削、二十六岁的年轻人与身材矮小、西装革履的阿博特形成了鲜明的外貌对比，但两人志趣相投，建立了持续二十多年的亲密关系。1968\
  \ 年 2 月，布克成为 ECTC 的主席，阿博特则担任宣传主任。他们邀请了“骄傲”组织的马里恩·巴里和“黑人联合阵线”的查尔斯·卡塞尔担任副主席。²⁴\n\n\
  ECTC 明确地将高速公路斗争定义为种族问题。“没有白人的道路穿过黑人的家园！”成为战斗口号，ECTC 成员在听证会上作证，给公职人员和当地报纸写信，为“高速公路斗士”编制阅读清单，制作无数海报、徽章和小册子，并鼓励居民抵制开发商、测量员和评估员。布克和阿博特深知媒体的力量可以推动事业，他们总是愿意发起有争议的纠察行动，制作引人注目的传单，发表吸引眼球的言论，或制造值得拍照的对抗。“在这该死的高速公路在特区再铺一英寸之前，”阿博特在一次集会上警告说，“就会有火焰，就会有战斗，就会有叛乱！”“雷金纳德·布克和萨米·阿博特……疯了，”《华盛顿邮报》的威廉·拉斯伯里写道，“而这正是我们避免被高速公路混凝土掩埋的最佳机会。”²⁵\n\
  \n到 1968 年，ECTC 及其反高速公路盟友已在多条战线上取得了重大胜利。他们的跨种族抗议活动规模越来越大，迫使媒体和地方官员予以关注。他们说服了新市议会的大多数成员支持一项优先发展快速公交而非高速公路的交通计划。在联邦政府内部，越来越多的约翰逊政府官员，包括美国首位交通部长艾伦·博伊德，对大规模高速公路建设的经济影响和种族含义提出了质疑；博伊德甚至聘请了反高速公路律师彼得·克雷格。而最大的胜利来自法庭。1968\
  \ 年 2 月，联邦上诉法院裁定，市官员忽视了 1893 年的一项城市法律，该法律要求所有规划中的高速公路建设必须征求公众意见，法院命令停止所有高速公路的规划和工作。推土机戛然而止。²⁶\n\
  \n![Image](img/f0001-22.jpg)\n\n*“白人的道路穿过黑人的家园。”跨种族的交通危机紧急委员会通过草根抗议、激进言辞和不懈的诉讼来对抗高速公路建设。该委员会的艺术作品常利用种族意象来凸显高速公路的社会后果。交通危机紧急委员会收藏，第\
  \ 44 箱，华盛顿特区公共图书馆华盛顿分部。*\n\n然而，公民驱动的行动主义遭遇了华盛顿特区政治无权的残酷现实。尽管约翰逊总统进行了政府重组，但该市仍受制于国会委员会及其领导下的亲高速公路人士。一个特别顽固的对手是来自肯塔基州农村的民主党众议员威廉·纳彻，他担任众议院拨款委员会特区小组委员会主席。纳彻是一个主张法律与秩序的种族隔离主义者，对将任何控制权交给这个黑人占多数的城市的地方官员持谨慎态度；他说话带着浓重的南方口音，脸皮薄，却决心要维护国会对国家首都的权威。他多次威胁要扣留所有地铁建设资金，直到该市承诺完成整个高速公路系统。²⁷\n\
  \n高速公路反对者拒绝屈服于他们眼中的敲诈。由于华盛顿特区居民普遍且强烈地反对高速公路，1968 年 12 月，市议会批准了一项修订后的交通计划，删除了有争议的中北高速公路和三姐妹大桥。然而，纳彻紧紧攥住地铁资金不放，推迟了地铁的破土动工，并使其成本增加了数百万美元。市官员面临越来越大的压力，要求他们通过一项完成高速公路系统的计划来安抚纳彻。\n\
  \n1969 年 8 月初，这个问题在市议会的一次会议上达到了喧闹的高潮。担心市议员会在亲高速公路的压力下屈服，两百多名 ECTC 成员和其他高速公路反对者挤满了会议室。萨米·阿博特站在椅子上，带领大家发出震耳欲聋的“不！不！不！”的呼喊，然后在市议会主席吉尔伯特·哈恩命令警察清场时，他跳到了一名警察身上。据《华盛顿邮报》报道，“一场拳脚相加、椅子横飞的混战爆发了。”阿博特、布克、朱利叶斯·霍布森以及其他十一名活动人士被捕。²⁸\n\
  \n\n\n\n\n市议会在紧闭的门后重新召开会议，以 6 比 2 的投票结果接受了三姐妹桥和北中央高速公路，以换取建设地铁的资金。“国会让我们看清了谁才是老大，”投反对票的议员波莉·沙克尔顿感叹道。ECTC\
  \ 成员谴责市议会“出卖了利益”：“华盛顿特区的‘政府’如今赤裸裸地暴露为一场骗局。”即便在屈辱的投票之后，国会议员纳彻仍拒绝为地铁拨款，直到所有高速公路诉讼被撤销或解决。²⁹\n\
  \n市议会的屈服反而加剧了斗争，引发了持续两年的激烈抗议和诉讼，焦点日益集中在三姐妹桥上——高速公路的支持者和反对者都认为这座桥是整个高速公路系统的关键。一旦建成，这座桥每天将把数万辆汽车从北弗吉尼亚引入华盛顿市中心，从而迫使内环线、北中央高速公路及其他项目完工。高速公路的反对者相信，如果能阻止这座桥，他们就能阻止所有其他州际公路铺设在特区。\n\
  \nECTC 与全国各地的反高速公路活动人士合作，并利用地区大学学生抗议者日益增长的力量，成立了华盛顿特区交通危机学生委员会。这个以白人为主的委员会中的学生接受了黑人权力口号和象征，并始终以种族论点反对修建这座桥。1969\
  \ 年 10 月，几十名学生“占领”了波托马克河中的三姐妹岛，导致 140 人被捕。一个月后，阿博特与马里恩·巴里和朱利叶斯·霍布森一起参加了乔治城大学的一场集会，最终约两百名抗议者涌入社区街道，点燃垃圾桶，并与警察发生冲突。³⁰\n\
  \n街头抗议与由百人委员会法律团队领导的长期法庭斗争并行。该团队成功论证国会不能推翻要求公众对三姐妹桥发表意见的市法律。从 1970 年 4 月开始的一系列联邦法院裁决反复确认了特区居民对桥梁设计和规划发表意见的权利，并命令该市再次停止施工。在新生全国环境运动以及弗吉尼亚和马里兰郊区日益活跃的地铁支持者的支持下，反高速公路运动扩大了联盟，并在国会中赢得了盟友。1971\
  \ 年 12 月，众议院终于结束了国会议员纳彻对地铁资金的封锁。到 1976 年首批地铁列车在红线运行时，三姐妹桥、北中央高速公路及其他州际项目已逐渐淡出人们的记忆。³¹\n\
  \n在 20 世纪 60 年代初，高速公路纵横交错地穿过国家首都似乎不可避免；十年后，它们已不可能；半个世纪后，它们变得难以想象。最初被视为堂吉诃德式的反高速公路运动对这座城市产生了巨大影响。21\
  \ 世纪的居民和游客所喜爱的华盛顿的许多特色——田园诗般的社区、历史建筑、适合步行的市中心——原本会被城市规划者、国会、地方官员和媒体支持者最初设想的那片庞大的高速公路网络所摧毁。\n\
  \nECTC 和反高速公路运动的遗产不仅限于那些*未建成*的东西。它还指向了*已建成*的东西：一个成功的、跨种族、跨阶级的联盟，将大都市区内的各种利益团结在一起。运动活动家——从像萨米·阿博特和雷金纳德·布克这样对抗性的局外人，到像彼得·克雷格这样精通法庭的局内人——运用各种策略智胜对手，说服怀疑者，并迫使不情愿的地方和联邦官员尊重华盛顿特区选民的意愿。“在这个国家最无政治影响力的城市里，黑人与白人、穷人与富人、学生‘疯子’与科文顿-伯林律师事务所的律师们，竟然顶住了全国最有权势的政治家，”萨姆·史密斯钦佩地写道。这是一项非凡的壮举。³²\n\
  \n### *“如果我们无法控制它，就把它踢出去”：活动人士推动社区控制警察*\n\n20 世纪 60 年代末，华盛顿特区充满了抗议的能量。与全国各地的反战、黑人权力、女权主义和环保抗议者一样，华盛顿特区的活动人士使用越来越强硬的策略来挑战地方和联邦当局。其中一个特定目标是警察局，黑人社区中的许多人认为警察局危险、腐败，并且充斥着流氓和种族主义警察。1968\
  \ 年夏季，第十四街沿线发生了一系列警察枪击黑人公民事件后，黑人联合阵线就警察行为举行了社区听证会，并由此提出了一份包含十三项要求的清单，要求对警察局实行“社区控制”。“我们一直都有（对警察的）社区控制，”露丝·贝茨·哈里斯讽刺地评论道，“问题在于那一直是白人社区的控制。”³³\n\
  \nBUF 的计划于 9 月发布，要求设立警区和全市范围的公民委员会，负责招募新警员、调查不当行为指控并在适当时解雇警员；禁止在黑人社区进行全白人警察巡逻；要求所有警察居住在特区；以及解雇局长约翰·莱顿。BUF\
  \ 将计划提交给市议会副主席沃尔特·方特罗伊，他同时也是该联盟指导委员会的成员。方特罗伊立即表示支持，市民主党中央委员会以及该市许多白人激进分子也纷纷支持。事实上，一些社区控制集会上出现了以白人为主的群体。³⁴\n\
  \n很少有执法官员认真考虑过将警察的控制权交给社区成员。随着犯罪率飙升——自 1960 年以来抢劫案数量增加了八倍多——警察队伍中的许多传统主义者及其支持者，尤其是白人居民，认为“社区控制”会削弱警察履行职责的能力。在\
  \ 1968 年总统竞选期间，共和党人理查德·尼克松将这座城市作为其“法律与秩序”信息的焦点，称华盛顿特区为“犯罪之都”。上任后，尼克松提出了一项全面的华盛顿特区犯罪法案，其中包括几项有争议的条款，例如允许警察在无警告的情况下进入嫌疑人住所的“无需敲门”规则。³⁵\n\
  \n但一些具有进步思想的地方和联邦官员认为有必要对警察局进行改革。为了改善警察与社区的关系，联邦经济机会局内一位猫头鹰般、38 岁的白人心理学家罗伯特·谢洛制定了模范警区计划。谢洛承认警察被视为“一种强制性的、敌对的力量，尤其是在黑人内城区”，因此他提议建立\
  \ 24 小时营业的临街中心，让社区居民可以方便地接触警察以及公共卫生和福利机构。谢洛的计划还设想招募青少年“巡逻队”帮助警察监控可疑活动，并要求警员参加“敏感性培训”和黑人历史课程。该提案经过深思熟虑，反映了最新的社会科学研究成果，很快获得了\
  \ OEO 的批准，后者承诺在 18 个月内提供 140 万美元。³⁶\n\n结果是一场灾难。\n\n\n\n\n自项目启动之初，《邮报》的威廉·拉斯贝里就指出，模范辖区计划（又称试点警察项目）面临两个严重问题：“首先，警方不愿将任何实质性控制权交给社区。其次，该计划给人一种试图用福利服务换取公民线人的印象。”在首次公开宣布拨款时，《星报》报道称，华盛顿市长及其他项目支持者“震惊地”听到批评者抨击该想法是“纳粹式的计划”，将建立“以社区为基础的间谍网络”。³⁷\n\
  \n居民反对的不仅是项目的具体内容，更在于项目官员中竟无一人费心去咨询他们希望改造的社区中的任何人。就连经济机会局自己的地方反贫困组织——联合规划组织——也未被纳入其中。在华盛顿人要求更多自治权之际，模范辖区计划却已完整成型，出自联邦机构一位白人官僚的头脑，而社区成员只需签字同意即可。他们拒绝了。“我们常常犯的错误是为穷人规划，而不是与穷人一起规划，”联合规划组织负责人威利·布兰顿解释道，此前该组织董事会因被要求草率批准该计划而感到受辱，遂全盘否决。³⁸\n\
  \n尽管如此，经济机会局的官员们仍一意孤行。谢洛于 1968 年 8 月开始招聘员工，华盛顿市长任命了 39 名社区代表组成一个委员会，负责举行社区听证会并选择一个辖区作为试点项目。为了代表整个城市，这个臃肿的委员会包括了马里恩·巴里和查尔斯·卡塞尔等黑人活动家，以及来自大都会贸易委员会和公民协会联合会的保守派白人代表。巴里、卡塞尔和其他活动家很快对委员会感到失望并退出。在他们缺席的情况下，委员会选择了第十三辖区作为试验点。³⁹\n\
  \n这是一个奇怪且最终注定失败的选择。第十三辖区西至岩溪公园，东至北国会街，北至尤克利德街和卡尔弗特街，南至 S 街，拥有全市第二高的犯罪率，并包含第十四街和第七街沿线大部分遭受暴乱破坏的区域。但该地区七万居民中几乎无人对模范辖区项目表示兴趣。只有\
  \ 40 人出席了关于辖区选择的公开听证会，其中大多数人完全反对该项目。⁴⁰\n\n第十三辖区的选择引发了黑人联合阵线和骄傲公司的强烈反对，这两家组织的总部均设在该地区。马里恩·巴里领导了这次攻击。正如两年前的公交车抵制运动一样，巴里将抵制模范辖区项目视为一个机会，既可以对抗可憎的敌人，又能动员社区支持激进变革。他以一贯的虚张声势威胁要提起诉讼，举行模拟“人民法庭”指控官员，并在规划会议上发表冗长演说阻挠议程——然后挑战反对者采取行动。“这件事是强加给黑人的，”他辩称，“如果我们无法控制它，就把它赶出去。”⁴¹\n\
  \n并非所有黑人居民都支持巴里。他和他的支持者常常疏远那些年长、中上阶层的黑人华盛顿人，这些人既对不断上升的犯罪率（对黑人社区影响尤为严重）感到恐惧，也对年轻活动家的强硬手段和激进主义感到不安。私下里，忧心忡忡的黑人居民担心，如果有人公开支持警察项目，“[他]的房子可能会被烧毁”。许多人转而支持城市联盟的黑人领袖斯特林·塔克，他既强调警察改革，也强调社区责任。⁴²\n\
  \n然而，在关于试点项目的辩论中，巴里仍然是最有影响力的声音。当经济机会局明确要继续推进该项目时，他策划了一场对民选公民委员会的接管。1970 年 2 月，巴里及其一批支持者赢得委员会选举后，国会中的保守派议员敦促经济机会局终止该项目。经济机会局官员立场坚定，巴里成为委员会主席。他好斗但能干的行事风格既赢得了委员会成员的尊重，也招致了警察的憎恨——一名项目培训师报告称，基层警官视他为“魔鬼化身”。⁴³\n\
  \n该委员会从未能对警察行使权力，但确实赢得了对项目预算、程序和人员的控制权。其首批行动之一就是迫使主任谢洛辞职，导致主任频繁更换，无法提供持续的领导。由于无休止的内部争吵、持续的社区反对以及官方支持的减少，该项目逐渐销声匿迹。在花费了\
  \ 270 万美元联邦资金（外加 17 万美元用于经济机会局赞助的一部相关影片）后，该项目于 1973 年初关闭。⁴⁴\n\n如果试点警察项目是在十年前甚至五年前提出的，它或许会受到欢迎。然而到了\
  \ 1968 年，华盛顿人已不愿接受一个由官方批准、专家设计、忽视社区意见的项目，无论它带来多少联邦资金。“人民不再像我们过去那样屈从于专横严苛的控制，”黑人联合阵线的查尔斯·卡塞尔解释道。白人仍然过于“家长式”，斯特林·塔克写道，“他们在变革与动荡的时代停滞不前，固守着‘我们能替他们解决问题’的信条。”⁴⁵\n\
  \n将华盛顿特区警察置于社区控制之下的尝试从全国性运动中汲取了力量，但如同反高速公路抗议一样，这主要是一场争取自治的地方性斗争，发生在一个长期被剥夺自治权的城市。这些斗争试图重新定义联邦政府与首都人民之间的关系，使国会和被选来领导华盛顿的非民选官员不能再简单地规定特区居民必须遵守的条款。联邦和地方官员仍可能试图强行将高速公路穿过社区，或将不受欢迎的项目强加给华盛顿人，但到了\
  \ 20 世纪 60 年代末，这种专横行为遭遇了日益激烈且有效的反对。公民权力有限且往往只是消极的——有组织、敢于发声的居民可以阻止一些令人反感的计划，但缺乏实施新想法的权力——他们的反对也并非总能成功。然而，在这个对抗性政治的新时代，华盛顿特区所有种族的居民都要求问责、参与和控制。简而言之，他们希望在国家的首都实现民主。\n\
  \n### *“在白人与黑人之间”：拉丁裔移民在城市中争取立足之地*\n\n\n\n卡洛斯·罗萨里奥帮助将讲西班牙语的人带入全市范围的民主呼声之中。罗萨里奥出生于波多黎各的圣胡安，曾就读于波多黎各大学，并在二战期间服役于美国陆军中一个隔离的波多黎各人部队。他接受培训成为\
  \ X 光技师，并于 1950 年移民美国，在后来成为卫生、教育和福利部的联邦机构任职。1952 年，他与妻子卡明搬到华盛顿特区，定居在芒特普莱森特的霍巴特街西北。罗萨里奥双语流利、受过教育，目光炯炯、笑容可掬，这位富有魅力的领袖将他充沛的精力投入到为分散在英语城市中的讲西班牙语群体建立社区认同感上——这座城市习惯于仅以黑白两色看待自身。⁴⁶\n\
  \n多年后，罗萨里奥回忆道，他初到华盛顿时，“这里没有西班牙语社区”。讲西班牙语的人口不到华盛顿特区居民的 1%，规模小、无组织，在政治上毫无存在感。二战后，随着拉丁美洲国家设立大使馆，以及世界银行等国际组织在西北第十六街和马萨诸塞大道沿线设立办事处，这一群体缓慢增长。专业人员和家政工人聚集在附近的芒特普莱森特和亚当斯摩根社区，这些地方几十年来一直是富裕白人华盛顿人的田园式有轨电车郊区。从\
  \ 20 世纪 50 年代末开始，人口迅速扩张，最初由古巴、危地马拉、萨尔瓦多等地的政治动荡推动，随后 1965 年《移民与国籍法》通过，允许更多拉丁美洲国家移民进入。尽管一些新移民在原籍国是专业人士，但绝大多数人在家政服务、育儿、建筑和餐饮业找到了低薪工作。⁴⁷\n\
  \n与美国西南部拉丁裔移民主要是男性农业工人不同，在华盛顿，女性推动了拉丁裔移民潮。罗莎·洛佩斯是华盛顿特区新兴移民社区的典型代表。洛佩斯出生于萨尔瓦多，20\
  \ 世纪 60 年代曾为美国国际开发署派驻圣萨尔瓦多的一个美国家庭做管家。当这家人返回华盛顿时，他们带上了洛佩斯，她最终成为美国永久居民。她定居在芒特普莱森特，她的丈夫哈维尔于\
  \ 1968 年与她团聚。在随后的几十年里，洛佩斯家族的 35 名成员陆续来到华盛顿地区。⁴⁸\n\n像洛佩斯这样的先驱女性帮助将芒特普莱森特-亚当斯摩根转变为这座城市非官方的拉丁裔聚居区，这里出现了“Se\
  \ habla Español”的招牌，以及拉丁裔餐厅、杂货店、理发店、食品店、*炸油条店*和其他商铺，点缀在第十八街和哥伦比亚路交叉口附近的商业街上。该社区被东边主要是低收入黑人居民和西边高收入白人居民夹在中间，其异质人口来自近二十个国家，无法用种族、经济或政治分类来定义。这里拥有从深色皮肤的巴拿马人到浅色皮肤的厄瓜多尔人的各种肤色，以及从工人阶级的危地马拉家政工到富裕的古巴企业家等各种收入水平。拉丁裔居民（当时被称为“拉丁人”或“讲西班牙语的人”）根本无法融入华盛顿二元对立的种族结构。“讲西班牙语的人介于白人和黑人之间，”芒特普莱森特西班牙天主教中心的玛丽亚·路易莎修女解释道。⁴⁹\n\
  \n罗萨里奥帮助创建了将城市拉丁裔居民联系在一起的共同纽带。他从社交活动开始——创办了拉丁美洲社交俱乐部举办舞会，为社区中每个代表的国家策划独立日庆祝活动，并租用乔治亚大道的殖民地剧院放映西班牙语电影。作为一名有政府工作经验的英语使用者，他将自己定位为“调解人”，一个能帮助困境中的讲西班牙语者找工作、解决住房问题以及应对城市官僚体系的熟练问题解决者。在电影放映时，“我总是宣布，任何找工作的人都可以打电话给我，我会帮助他们，”他回忆道。⁵⁰\n\
  \n20 世纪 60 年代，该市讲西班牙语的人口激增。根据人口普查局的数据，1960 年至 1970 年间，华盛顿的西班牙裔人数翻了一番多，达到 15,671\
  \ 人，尽管罗萨里奥和其他当地领导人坚持认为实际数字接近 50,000 人。这个社区始终过于多样化，以至于没有一个单一领袖能够代表拉丁裔居民的各种利益，但罗萨里奥建立了忠实的追随者，并赢得了作为少数能在更大社区中表达拉丁裔需求的英语发言人的声誉。⁵¹\n\
  \n有许多移民成功的故事——波多黎各人找到了稳定的政府工作，古巴人开办了兴旺的小企业——但拉丁裔居民在华盛顿常常挣扎求生。他们面临着与低收入黑人邻居相同的许多挑战，包括就业、住房、教育和执法方面的歧视，但还多了一层语言障碍。一个主要问题是就业不足：语言困难使许多移民无法从事与其教育和技能相匹配的工作。“一个木匠如果不知道工具的名称，或者不明白你要做什么，他就无法当木匠，”华盛顿特区拉丁美洲联盟的鲁道夫·拉莫斯说。“所以为了糊口，他只能去洗碗。”对于受过良好教育的移民来说，就业不足尤其令人恼火，他们常常因为无法获得认证或达不到职业中的语言要求，而不得不从事本领域以外的低薪工作。一旦上岗，工人们常常发现被雇主剥削，这些雇主拒绝支付合理工资，并威胁要驱逐他们。⁵²\n\
  \n毫不奇怪，很大比例的拉丁裔移民生活在贫困中。曼努埃尔·冈萨雷斯是联合规划组织中为数不多的双语员工之一，他估计芒特普莱森特拉丁裔居民的收入中位数仅为 3,000\
  \ 美元，正好处于贫困线；当地牡蛎小学约 80%的讲西班牙语的学生生活在贫困中。为了分担高昂的房租，许多移民挤在公寓楼里。房东们乐于收取租金，但常常拒绝维护这些蟑螂横行的建筑，声称租户允许太多人同住违反了租赁协议。⁵³\n\
  \n对许多拉丁裔家庭来说，教育是另一个障碍。方济各会神父何塞·索莫萨解释说，他们有时根本不送孩子上学，因为“孩子们听不懂，没有老师懂西班牙语，或者他们必须待在家里照顾弟弟妹妹。”执法则带来了另一个问题。社区难以与当地警察沟通——1967\
  \ 年，芒特普莱森特-亚当斯摩根警区的 116 名警察中只有 3 人会说一点西班牙语——因此小事件常常升级为严重冲突。⁵⁴\n\n\n\n\n“再加上在从土坯到水泥、从陶罐到铝锅、从不上锁的门到华盛顿式堡垒生活的文化适应过程中，还要解决社保卡、就业、花四五百美元买一辆可靠的二手车、驾照、车牌等问题，”理查德·克里奇菲尔德在《邮报》中写道。尽管美国一直被视为繁荣之地，古巴移民玛莎·维达纳承认：“这个国家有时很难生存。”⁵⁵\n\
  \n然而，很少有讲西班牙语的居民公开表达不满或向地方政府请愿申诉。原因主要是经济上的：许多居民从事繁重的体力劳动，工作时间长，几乎没有时间和精力参与政治。文化和经历也起了作用。许多移民逃离了政治活动可能招致致命报复的国家，因此他们害怕发声；有些人没有合法证件来到这个国家，避免做任何引起政府官员注意的事情；还有一些人只是不想抱怨一个向他们敞开大门的国家。“有些人把不提出要求视为一种美德，”一位恼怒的拉丁裔领袖说。⁵⁶\n\
  \n到 20 世纪 60 年代中期，罗萨里奥和少数几位讲英语的拉丁裔领袖——比如哥伦比亚裔的善牧联合长老会教堂的安东尼奥·韦尔蒂牧师——开始组织讲西班牙语的社区。他们采用民权活动家开创的策略和言辞，向地方和联邦当局施压，要求政府回应日益增长的拉丁裔人口的需求。罗萨里奥创建了“哥伦比亚特区讲西班牙语弱势少数群体援助与发展委员会”，并开始在英语社区内倡导拉丁裔利益。韦尔蒂在西北区欧文街的威尔逊中心组织了早上\
  \ 8 点的早餐会，到 60 年代末，这里已成为不断增长的移民群体的社交活动中心。两人与公立学校官员合作，聘请双语教师和工作人员，并提供成人英语课程。他们推动警察官员为警员开设沉浸式西班牙语培训，并游说资金用于西班牙裔社区的公共卫生、娱乐和住房项目。⁵⁷\n\
  \n尽管许多发声的领袖是男性，但参与这些努力的绝大多数人是女性——她们负责培训项目、参加语言课程，并帮助新移民适应城市。“总是母亲们、妻子们”在寻求帮助，多米尼加裔清洁工兼社区活动家卡西尔达·卢纳说。“社区就是这样开始的。”随着时间的推移，这些组织讲西班牙语者的努力帮助塑造了一种跨越种族、阶级、政治和民族界限的新的“拉丁裔”身份。⁵⁸\n\
  \n随着拉丁裔居民数量增多、组织更完善，他们有时会与黑人邻居发生冲突。尽管偶尔有人试图将非白人少数群体联合成基于阶级的联盟，但华盛顿特区的黑人和拉丁裔居民往往彼此警惕。就像之前的爱尔兰移民一样，拉丁裔移民与黑人工人竞争低收入工作，但他们的政治力量无法与黑人匹敌。许多拉丁裔居民将黑人和白人都称为“盎格鲁人”，这个词在其他地方意为“白人”或“老板”。在\
  \ 20 世纪 60 年代末的华盛顿，许多拉丁裔居民认为，“黑人是老板。”⁵⁹\n\n紧张局势在社区街道、拥挤的公寓楼以及林肯初中和其他拉丁裔学生众多的学校的走廊里爆发。“西班牙裔和黑人住在一起，但没有融合，”玛丽亚·路易莎修女担忧地说。“他们不是朋友。”卡洛斯·罗萨里奥也意识到了种族问题。“这两个群体对彼此的了解不够深入，还没有真正开始就共同的需求和利益合作，”他在\
  \ 1970 年说。⁶⁰\n\n犯罪问题使黑人和拉丁裔社区的关系更加复杂。1968 年骚乱后犯罪率飙升，许多拉丁裔居民认为自己很容易成为黑人犯罪分子的目标，他们敦促在芒特普莱森特和亚当斯摩根加强警力保护。与白人和黑人同龄人一样，许多受过良好教育的中产阶级拉丁裔居民在骚乱后搬到了郊区，推动了马里兰州兰利帕克、弗吉尼亚州阿灵顿和其他郊区社区西班牙裔人口的增长。“许多人因为（拉丁）氛围而想留在芒特普莱森特，”韦尔蒂牧师感叹道，“但他们害怕。”⁶¹\n\
  \n《星报》的菲利普·尚德勒写道，留在特区的人往往是“最需要帮助的人：最新来的、就业最不充分的、背景和经验最不足以应对日益紧张局势的人。”骚乱使市政官员的精力重新聚焦于黑人社区的需求，往往以牺牲拉丁裔的关切为代价。例如，骚乱后，一项培训警察学习西班牙语的计划被取消。“黑色成了紧迫的颜色，”一位拉丁裔领袖苦涩地指出。⁶²\n\
  \n正如卡洛斯·罗萨里奥所发现的，拉丁裔活动家组织社区的努力常常与黑人政治领袖的目标相冲突。1965 年，罗萨里奥帮助创立了 CHANGE（卡多佐高地社区发展与丰富协会），这是一个由经济机会办公室资助的反贫困非营利组织。当这个以黑人为主的组织在温和派和激进派成员之间发生内部斗争时，精明的罗萨里奥将自己定位为各方都能接受的“安全”候选人，从而成为主席。然而，许多黑人成员抱怨他过于关注拉丁裔的需求。一位董事会成员评论道：“他非常尽职，工作努力，但就是无法与不讲西班牙语的人——在这种情况下是黑人——有效沟通。”⁶³\n\
  \n作为主席，罗萨里奥与执行董事露丝·韦伯斯特发生了冲突。韦伯斯特是 14 个孩子的黑人母亲，她体现了民权运动在贫困黑人社区培养领导力的目标。韦伯斯特认为拉丁裔居民和其他少数民族应该学会“适应他们生活的社区”。她希望“种族和文化融合”，并且不相信\
  \ CHANGE 应该为拉丁裔社区制定“特殊计划”。但罗萨里奥和其他拉丁裔居民坚持认为他们的社区有特殊需求，尤其是语言培训。当韦伯斯特拒绝帮助时，他们越来越不满。⁶⁴\n\
  \n拉丁裔的政治挫折体现在对市长沃尔特·华盛顿的抱怨中。与露丝·韦伯斯特一样，市长和他的许多高级官员认为，通过全市范围的通用项目最能服务好讲西班牙语的社区，但罗萨里奥和其他领袖认为他们的选民需要有针对性的行动。当华盛顿于\
  \ 1967 年首次被任命时，罗萨里奥要求他设立一个连接市政府与拉丁裔社区的联络办公室。华盛顿同意了，但被指派担任该职位的人提供了“零服务”，罗萨里奥抱怨道，随后此人离职且无人接替。\n\
  \n\n\n\n由于缺乏选举手段来表达其社区的不满，罗萨里奥和其他讲西班牙语的居民转向了国会。他们特别寻求参议院唯一一位西班牙裔成员——新墨西哥州民主党人约瑟夫·蒙托亚的支持，他当时在哥伦比亚特区拨款小组委员会任职。蒙托亚向市议会施压，要求就拉丁裔社区的问题举行听证会。1970\
  \ 年 1 月举行的听证会让拉丁裔居民有机会倾诉长期积压的不满，包括语言障碍、剥削性的房东、与警察的纠纷以及学校系统中的困境。市议会的六名黑人成员“承认大多数投诉与黑人早先被迫面对的问题相同”，威廉·拉斯贝里在《华盛顿邮报》中写道。“这座城市忽视了其讲西班牙语的居民。”⁶⁵\n\
  \n听证会催生了西班牙社区咨询委员会，这是一个由 15 名成员组成的任命机构，负责向市政官员提出政策建议。罗萨里奥担任执行秘书，安东尼奥·韦尔蒂担任主席，拉丁裔居民现在在市政府内部有了直接的联系点。但\
  \ 1970 年人口普查结果的公布使建立拉丁裔政治权力的努力遭受了严重挫折。该普查统计出哥伦比亚特区有 15,671 名拉丁裔居民（另有 55,000 人居住在马里兰州和弗吉尼亚州的郊区）。愤怒的拉丁裔领导人谴责这些数字严重不准确，认为存在漏报，因为拉丁裔居民经常拒绝填写人口普查表格（特别是如果他们是无证移民），而且普查调查员有时会跳过或错误统计西班牙裔家庭。⁶⁶\n\
  \n由于担心人口总数过低可能给市政官员提供忽视社区的借口，罗萨里奥与玛塞拉·达维拉、卡西尔达·卢纳及其他拉丁裔领导人联手，通过举办“西班牙裔美国人节”——一个展示拉丁裔文化的年度盛会——来放大拉丁裔居民的政治声音。就像内战后华盛顿黑人举办的“解放日游行”一样，这个节日不仅旨在庆祝社区遗产和成就，还旨在提供拉丁裔社区规模和实力的可见证据。“这个节日对我们来说是一次向美国人民展示我们确实存在于此的示威，”帮助创立这一庆祝活动的秘鲁人佩德罗·卢汉说道。该节日于\
  \ 1971 年 8 月首次举办，吸引了数千名拉丁裔居民来到哥伦比亚路，引起了政界和媒体的关注。⁶⁷\n\n西班牙裔美国人节、西班牙社区咨询委员会以及 20 世纪\
  \ 70 年代初涌现的其他社区组织，并未立即缓解拉丁裔社区长期存在的担忧。一个为期一天的活动和一个预算为 4 万美元的小型市政办公室只能做这么多，而语言、文化和城市官僚体制方面的斗争在整个\
  \ 70 年代持续存在。但多年来的政治组织和社区动员使拉丁裔机构成为可能，并帮助该社区转变为一支可见的政治力量。“在过去五年里，我们取得了长足的进步，”卡洛斯·罗萨里奥在\
  \ 1973 年满意地指出。“西班牙社区不再是一个孤独的社区。”拉丁裔政治觉醒的时机十分有利，因为它恰逢该市地方自治运动的顶峰。在经历了近一个世纪的任命制政府之后，华盛顿即将赢得自治权。⁶⁸\n\
  \n### *“当你拥有选票时，就不需要子弹”：华盛顿赢得地方自治*\n\n安妮塔·福特·艾伦在一个动荡的时代毫不掩饰地守旧。她出生于 1925 年，在阿纳科斯蒂亚长大，周围是姑姑、叔叔和表亲，她回忆中的社区是“紧密团结的，由通常勤劳的家庭组成”。她的根无疑是工人阶级——她的父亲在政府印刷局上夜班，母亲在国会图书馆打扫办公室——但她有着向上流动的雄心。作为阿姆斯特朗高中的致告别词代表，她以最优等成绩从霍华德大学毕业，并在芝加哥大学获得硕士学位，然后回到华盛顿成为一名公务员。她于\
  \ 1965 年加入联邦教育局；两年后，她被任命为哥伦比亚特区学校董事会成员。艾伦肤色浅白，目光锐利，身高五英尺九英寸，经常戴着精心制作的帽子，这让她显得更高大、更威严。她以对教育政策的了解以及直率的作风而闻名，是一个对慢吞吞的学校管理者或激进的黑色分离主义者都缺乏耐心的女人。⁶⁹\n\
  \n艾伦对教育的热情促使她参加了华盛顿近一个世纪以来的首次选举——1968 年 11 月的学校董事会选举。建立由 11 名成员组成的选举制学校董事会的法案，是在约翰逊总统\
  \ 1967 年 8 月政府重组计划之后提出的。同年晚些时候，该法案以仅三票反对的结果在国会两院顺利通过，并在 1968 年 4 月骚乱后不久成为法律。这次选举吸引了\
  \ 64 名背景各异的候选人，包括联邦工作人员、社区活动家以及非传统的职位寻求者，例如美容师伊利亚·布洛克，她用塞在棕色纸袋里的零钱支付了申请费。活动家朱利叶斯·霍布森获得了最多选票；艾伦在决选中幸存，赢得了一个全市席位。⁷⁰\n\
  \n随着当地活动家和社区领袖从抗议转向选举政治，学校董事会——哥伦比亚特区唯一的民选机构——成为了政治能量的焦点。那些因联盟建设而得以压制的暗流涌动的紧张局势，爆发成了丑陋的权力和职位争夺。艾伦自称是“自由派和融合主义者”，她拒绝利用学校来培养黑人政治意识的努力，并经常与霍布森、查尔斯·卡塞尔（1969\
  \ 年当选董事会成员）以及其他推动社区控制学校的活动家发生冲突。“大多数人想要的是更好的学校，而不是控制权，”她争辩道。1969 年她成为董事会主席后，主持了许多争吵不休的会议，这些会议有时会演变成人身攻击。在一次会议上，一群黑人高中生嘲弄道：“嘿，艾伦夫人，你是黑人吗？”⁷¹\n\
  \n艾伦，如同过去时代的玛丽·丘奇·特雷尔、卡尔文·蔡斯和约翰·默瑟·兰斯顿一样，体现了一种中产阶级、通常肤色较浅、在体制内的领导形式，这种领导形式历史上在华盛顿黑人群体中发挥了不成比例的影响力。这种传统的领导方式在\
  \ 20 世纪 60 年代末日益受到攻击。当艾伦在 1971 年寻求连任时，她面对的是马里恩·巴里，他代表了一种更年轻、更激进的领导形式，吸引了低收入选民。巴里将他的社区组织技巧转向政治，为这个兼职职位开展了一场精力充沛的竞选活动，并承诺为他称之为“全国笑柄”的学校董事会带来彻底变革。尽管他对学校或教育政策几乎没有经验，巴里还是彻底击败了艾伦。⁷²\n\
  \n\n\n\n到 1971 年，城市居民有了另一个发泄政治能量的渠道：国会中的无投票权代表席位。这一职位由尼克松总统提议，作为迈向完全代表权的临时步骤，1970\
  \ 年国会通过了设立这一象征性代表席位的法案。尽管没有投票权，该职位仍吸引了相当大的关注，1971 年的竞选让两位民权重量级人物相互对决：朱利叶斯·霍布森和沃尔特·方特罗伊。两人曾多次合作，但性格迥异——一个是不苟言笑、直言不讳的无神论者，鄙视妥协；另一个是善于交际的传教士，喜欢讨价还价的交易。而且他们彼此并不欣赏。竞选期间，霍布森嘲笑方特罗伊自命不凡的做派，称他为“方特罗伊小勋爵”，并告诉选民，他们的选择是“国会里选一个男人，还是选一个男孩”。⁷³\n\
  \n霍布森与方特罗伊的竞选重新唤醒了一个将在华盛顿特区政治中回响数十年的旧理念：建州。将华盛顿特区从一个“联邦城市”转变为与其他州平起平坐的州的想法，可追溯到\
  \ 19 世纪末，当时白人劳工领袖 A·E·雷德斯通呼吁建立一个新的“哥伦比亚”州。这一想法沉寂多年，直到 1969 年，道格拉斯·摩尔牧师、记者查克·斯通及其他黑人民族主义者宣布成立华盛顿特区建州委员会，并誓言采取“一切必要手段”使华盛顿成为第\
  \ 51 个州。该委员会并未兑现其戏剧性的宣言，但激励了另类报纸《首都东区公报》（后更名为《华盛顿特区公报》）的激进编辑萨姆·史密斯，他在次年接手了这一议题。作为土生土长的华盛顿白人，史密斯曾志愿参与“自由华盛顿特区”运动，他发表了《华盛顿特区建州理由》，呼吁城市居民拥抱“不受束缚、不妥协的自决权”：即建州。⁷⁴\n\
  \n为了给第三方竞选对抗方特罗伊寻找平台，霍布森采纳了史密斯的想法，并以新成立的建州党唯一候选人身份参选。这个名称具有欺骗性——建州党成员是一群多元化的活动家，主要关注教育、住房和种族平等——但霍布森的竞选使建州成为华盛顿特区自决运动中一个严肃（尽管存在分歧）的辩论话题。霍布森要求立即建州，尽管国会对此支持甚少，他的理由是，一个清晰、不妥协的要求能将这一理念从边缘推向中心。方特罗伊担心推动建州法案会导致惨败，并长期损害自决事业。即使国会批准建州，方特罗伊认为，它也肯定会取消联邦拨款（当时约占城市预算的\
  \ 20%）——他将此情景比作给华盛顿特区居民一个“保留地……在他们杀光所有野牛之后”。他转而主张一项地方自治法案，随后通过宪法修正案，争取在国会中获得完全投票代表权。⁷⁵\n\
  \n在 1971 年的选举中，方特罗伊轻松击败了霍布森。作为无投票权代表进入国会后，他通过一种他称之为“权力政治算术”的策略为城市争取支持。黑人选民在全国范围内是少数，但方特罗伊指出，他们在大约\
  \ 150 个国会选区（主要在南方的选区）中掌握着平衡力量。如果他们团结一致，就能左右选举，迫使这些选区的代表关注他们的诉求。⁷⁶\n\n利用这一策略，方特罗伊领导了一场激烈的竞选，帮助击败了臭名昭著的南卡罗来纳州种族隔离主义者约翰·麦克米伦，此人曾反对华盛顿特区的多项民权倡议。1972\
  \ 年，方特罗伊向麦克米伦的国会选区派遣了数十名组织者，动员黑人选民（占该选区的 28%），并揭露麦克米伦的种族主义记录。麦克米伦遭遇了惨败。当被问及如何解释自己的失利时，他抱怨道：“有色人种被收买了。”⁷⁷\n\
  \n麦克米伦的下台为华盛顿特区的地方自治扫清了道路。接替他担任众议院华盛顿特区委员会主席的是来自密歇根州的黑人国会议员查尔斯·迪格斯，他长期以来一直支持华盛顿特区获得更大自治权。迪格斯推动《华盛顿特区地方自治法案》在众议院通过，尼克松总统于\
  \ 1973 年 12 月将其签署为法律——此时距国会剥夺该市自治权已过去 99 年。该法案建立了一个民选政府，设有一位市长和一个由 13 名成员组成的议会，有权征税、决定支出和通过立法。⁷⁸\n\
  \n然而，国会并未完全放弃控制权。令自决倡导者沮丧的是，议会通过的所有立法仍需接受国会审查和否决。“这是一种联合伙伴关系，”迪格斯众议员解释道，但“国会是更高级的伙伴。”该法案是立法补救措施而非宪法性措施，这意味着国会未来可以撤销它。事实上，一些国会议员将地方自治视为一项实验。正如一位有影响力的众议员对迪格斯所说：“我给它五年时间，然后我们就得废除它。”《华盛顿特区公报》的萨姆·史密斯抱怨道，有限的地方自治法案旨在“让当地人保持快乐和安宁”。⁷⁹\n\
  \n尽管存在局限性，地方自治法案仍是华盛顿特区政治中的一个重要里程碑，它既被视为民权运动的一项重大成就，也被视为行使黑人权力的激动人心的机遇，因此受到了应有的庆祝。该法案不仅建立了民选自洽的基本结构，还为社区自治创造了非凡的空间。应明尼苏达州民主党人唐·弗雷泽的要求，法案中嵌入了一项条款，设立了咨询邻里委员会（ANCs），授权居民在两千人的邻里选区中选举代表。约有\
  \ 360 名代表被选入 36 个邻里委员会，ANCs 是那个时代象征性和实质性的产物，是一种参与式民主的制度形式，将在未来多年困扰政治领袖。⁸⁰\n\n地方自治法案为华盛顿特区政治的新时代奠定了基础。由学校董事会和代表竞选产生的政治能量，如今注入了\
  \ 1974 年的议会竞选。在一场没有既定候选人名单、且初生的政党组织无力塑造选区的激烈竞争中，一支由一百名贫困官员、黑人权力活动家、联邦任命官员和牧师组成的真正大军，涌入了市长和华盛顿特区议会的\
  \ 14 个席位竞选。这是一场政治混战，唯独议会主席的竞选例外——城市联盟负责人斯特林·塔克无人挑战，是唯一一位无对手的候选人。⁸¹\n\n最终形成的议会反映了从抗议到政治的重大转变。沃尔特·华盛顿成为市长，11\
  \ 名当选的黑人议员中有 9 人是民权老将，包括马里恩·巴里和朱利叶斯·霍布森。议会的两名白人成员波莉·沙克尔顿和大卫·克拉克也拥有坚实的民权背景。在多年挑战市政官员并从外部推动变革之后，他们如今作为肩负官方职责的民选领导人站了出来。“在早期阶段，一些成员仍在抨击权力结构和体制，”主席塔克回忆道，“我不得不提醒他们，他们自己就是权力结构和体制。”⁸²\n\
  \n\n\n在赢得（有限的）地方自治权后，自决活动人士计划在 1976 年美国建国两百周年之际，发起一场争取国会全面投票代表权的运动。这似乎是一个政治上恰逢其时的时机，因为水门事件已使许多反对增加华盛顿特区自决权的保守派陷入困境，而民主党人（他们大体上支持华盛顿特区的投票权）在众议院和参议院占据绝对多数。活动人士团结一致，支持一项《华盛顿特区投票权宪法修正案》。代表福恩特罗伊于\
  \ 1975 年在国会提出该修正案，恳请同僚们“修补自由钟上的裂缝”。成立于 1971 年的全国性倡导组织“华盛顿特区自决组织”（SDDC）协调了一场密集的游说活动，通过专业说客和公民倡导者的电话、信件和拜访，向国会中的目标议员施加压力。⁸³\n\
  \n他们的努力取得了丰硕成果。两党在 1976 年的党纲中都支持该修正案，1978 年 3 月，众议院以 289 票对 127 票通过了该修正案。在参议院，福恩特罗伊和\
  \ SDDC 通过承诺不在 1978 年艰难的连任竞选中动员黑人选民反对他，赢得了南卡罗来纳州共和党参议员斯特罗姆·瑟蒙德的关键支持。这位长期反对民权的斗士在保守派共和党人中争取到了共同提案人，并发表了一次非同寻常的现场演讲，宣称“人权始于我们国家的首都”。修正案以\
  \ 67 票对 32 票通过，并提交各州批准。⁸⁴\n\n《华盛顿特区投票权修正案》的成功象征着华盛顿特区在全国地位的提升以及早期地方自治时代的希望。1975\
  \ 年，放克乐队“议会”发行了一首献给华盛顿特区的颂歌《巧克力城》，这个绰号由 20 世纪 70 年代初的“夜鹰”等当地电台主持人推广开来，并被该市的黑人居民所接受。“当你拥有选票时，就不需要子弹，”主唱乔治·克林顿轻声唱道。对许多黑人居民来说，“巧克力城”捕捉到了地方自治的自豪与希望。这座城市迎来了黑人文化和意识的繁荣，体现在\
  \ Go-Go 音乐（一种源自该市的音乐风格）、华盛顿特区黑人剧目公司（SNCC 老兵伯尼斯·约翰逊·里根等人在这里创立了无伴奏合唱团“岩石中的甜蜂蜜”），以及以黑人为主的联邦城市学院（1976\
  \ 年并入新成立的哥伦比亚特区大学）。随着选举产生的领导层反映了该市 71%的黑人人口，华盛顿重新确立了自己作为美国黑人首都的地位。\n\n对于一些白人居民来说，地方自治只会加剧日益加深的不安全感和听天由命的心态。《华盛顿人》杂志在\
  \ 1976 年 10 月一篇有争议的封面故事中捕捉到了白人的恐惧，封面图片是一支冰淇淋甜筒，一勺香草冰淇淋被四勺巧克力冰淇淋压在下面，极具挑衅性。标题问道：“白人能在华盛顿特区生存吗？”副标题写道：“‘巧克力城’心态正在特区蔓延。一种新型种族主义正在浮现。”作家约翰·桑辛采访了多位白人居民——其中许多人自称是政治自由派——发现他们感到紧张、与地方自治政府疏离，并对自己日益增长的种族偏见感到惊讶。一位\
  \ 26 岁的教师描述自己从“纯白自由派变成了现实种族主义者”，在亚当斯·摩根居住后，她害怕自己的黑人和拉丁裔邻居。像许多白人同龄人一样，她认为国会是制衡黑人多数派的唯一力量。“我知道有这种想法很糟糕，但当地方自治真正到来，我们不再有国会保护我们（白人）时，我会想完全离开特区，”她说。⁸⁵\n\
  \n### *“到处都在发生这种事——把人赶走”：20 世纪 70 年代华盛顿特区的发展与士绅化*\n\n尽管骚乱后时代充满希望，但所有种族的华盛顿居民都认识到特区面临着严重的人口和经济问题。与全国各地的城市一样，华盛顿人口正在流失。1970\
  \ 年至 1980 年间，其人口减少了超过 15%，降至 638,333 人，因为中产阶级白人家庭继续迁往郊区，越来越多的中产阶级黑人和拉丁裔居民以及为他们服务的商业也加入了这一行列。20\
  \ 世纪 60 年代末和 70 年代初的犯罪浪潮似乎已经达到顶峰，但它摧毁了市中心的大片区域。西北十四街、西北第七街和东北 H 街沿线的商业走廊上，到处是木板封窗的建筑、设防的商店和骚乱烧焦的残骸。为了寻找吸引人们返回城市并维持税基的方法，忧心忡忡的政策制定者将重点放在房地产开发上，并与开发商密切合作，开展大型项目，如新的会议中心、宾夕法尼亚大道的翻新和地铁系统。⁸⁶\n\
  \n对新建项目的重视加剧了日益严重的住房问题，因为开发商将目光投向了老化的市中心社区，寻求振兴项目。后来被称为“士绅化”的现象——这个词在 20 世纪 70 年代流行起来，用来描述一个社区的低收入居民逐渐被高收入居民取代的过程——在之前的几十年里已经重塑了华盛顿特区的几个社区。第一波士绅化发生在\
  \ 20 世纪 20 年代和 30 年代的乔治城，当时白人专业人士搬进了一个日益破败的工人阶级社区，并开始修复该地区的旧房子。到 20 世纪 50 年代，乔治城已成为该市最高档的社区之一。另一波振兴和搬迁浪潮在\
  \ 20 世纪 50 年代和 60 年代席卷了雾谷和国会山，开发商翻新了“贫民窟”房屋，并将其出售给更富有的新来者。⁸⁷\n\n但 20 世纪 70 年代的搬迁规模比过去更大、速度更快。受极低房价以及乔治城等地修复者成功的吸引，开发商、投机者和业余炒房者抢购了亚当斯·摩根、欢乐山、洛根圆环和其他老社区的房产。年轻专业人士紧随其后，部分原因是受到那个时代反文化对郊区批判所催生的“回归城市”理念的启发。“这些社区的低收入居民被迫离开，原因是租金上涨、无力支付首付以防止房屋被卖给新业主，以及对于房主来说，他们突然变得更昂贵的社区房产税增加，”《华盛顿邮报》的米尔顿·科尔曼写道。“在很大程度上，在这些曾经被忽视、人行道上散落玻璃碎片、小巷里老鼠成灾的地区开辟新生活的定居者是白人。”⁸⁸\n\
  \n表 6 华盛顿人口，1970–1990 年\n\n![Image](img/t0001-06.jpg)\n\n许多开发商专注于将旧公寓楼或大片联排别墅改造成公寓单元，大规模且令人震惊地驱逐住户。仅在\
  \ 1973 年的几个月内，业主就驱逐了亚当斯·摩根 11 栋公寓楼和国会山一整排寄宿公寓的租户。随着时间推移，公寓改造加速。1979 年的一项研究发现，该市约\
  \ 12%的公寓单元已经或正在被改造成公寓。房地产价格螺旋式上升。在亚当斯·摩根、欢乐山和国会山，房价在不到五年内翻了一番，远远超出了大多数将这些社区称为家园的黑人和拉丁裔居民的承受能力。⁸⁹\n\
  \n\n\n\n当地活动人士呼吁“邻里力量”，通过组建以社区为基础的租户权利组织（如国会山东社区组织和亚当斯·摩根组织），动员起来保护低收入租户并抵制驱逐。1973\
  \ 年成立的全市住房联盟将各社区的活动人士联系在一起。过去，被驱逐租户的倡导者在政府中几乎找不到盟友。然而，随着地方自治的到来，他们可以利用转型为政客的活动人士的力量，与房东和开发商作斗争。⁹⁰\n\
  \n其中两位活动人士是议员戴维·克拉克和议员纳丁·温特，他们将反驱逐立法列为优先事项。作为地方自治时代的首批举措之一，市议会通过了《华盛顿特区租金控制法》，该法对租金涨幅设定了上限，并赋予租户在建筑物计划改为公寓时优先购买其单元的权利。次年，市议会为寻求将公寓改建为公寓楼的开发商设定了基准。但克拉克和温特提议的对购买并迅速转售房产的“炒房者”的处罚，遭到了房地产利益集团的强烈抵制，这些利益集团与税收和财政委员会主席马里恩·巴里合作，阻止了该法案。⁹¹\n\
  \n在城市领导人就反驱逐立法进行辩论之际，亚当斯·摩根西北区西顿街 1700 号街区的租户发起了反击。1976 年 4 月，马里兰州贝塞斯达的 Centre Properties\
  \ 公司购买了该街区几栋破旧的排屋。计划翻新这些建筑并以三倍以上的价格转售，Centre 公司向二十多户家庭发出了驱逐通知。大多数租户认为自己没有资源与 Centre\
  \ 公司对抗，决定搬走，但有九个家庭选择挑战开发商。西顿街并非天堂——城市检查员在该街区的 44 栋房屋中发现了 959 项健康和安全法规违规行为——但居民们深深依恋他们的社区，并将他们破旧的公寓视为“家”。这九个反抗的家庭联系了亚当斯·摩根组织，起诉\
  \ Centre 公司以阻止驱逐，并开始筹集资金自己购买房屋。“到处都有人在这样做——把人赶出去，”居民小约瑟夫·刘易斯说。“这是不对的。”一年多来，西顿街的租户们坚守原地。面对日益高涨的公众反对浪潮，Centre\
  \ 公司同意在案件开庭前几天将房屋出售给租户。⁹²\n\n受西顿街抗议活动的鼓舞，并受到加速驱逐的威胁，租户们举行了大量喧闹且具有破坏性的抗议活动，以至于《华盛顿邮报》将\
  \ 1978 年称为“租户反抗之年”。抗议活动促使市议会通过了一系列进步措施，以保护低收入居民，并提供财政激励帮助他们购买自己的住房。尽管其中一些法律被违反，另一些在\
  \ 20 世纪 80 年代初被允许失效，但租户和租户权利活动人士仍然能够利用它们来减缓某些社区的驱逐进程。⁹³\n\n### *“我们巩固的最后机会”：1978\
  \ 年市长竞选*\n\n士绅化及其所反映的日益加剧的收入不平等成为 1978 年市长竞选的主要议题。现任市长沃尔特·华盛顿强调自己的经验和正直，并夸耀自己在城市骚乱后复兴中的作用，但许多选民对他平淡的领导风格感到失望。他面临来自市议会主席斯特林·塔克的严峻挑战，塔克赢得了沃尔特·方特罗伊强大政治网络的支持，并成为明显的领跑者。⁹⁴\n\
  \n两位建制派巨头塔克和华盛顿之间预期的冲突，被雄心勃勃且政治运气极佳的市议员马里恩·巴里打乱了。在市议会中，巴里利用其税收和财政委员会主席的职位，与商界建立了关系，并赢得了能够平衡华盛顿特区多元化选民利益的精明政治家的声誉。在城市的许多地区，尤其是选票丰富、以白人为主的第三选区，巴里仍然相对不为人知或不被信任，但令人瞩目的是，他因被枪击而受益。⁹⁵\n\
  \n事情发生在 1977 年 3 月 9 日。武装的哈纳菲穆斯林团体——伊斯兰民族的一个分支教派，其总部设在西北十六街高地的黄金海岸地区——袭击了位于西北罗德岛大道的布奈·布里特总部和西北马萨诸塞大道的伊斯兰中心，劫持了一百多名人质。第三支较小的队伍冲进了区政大楼的五楼，在斯特林·塔克的办公室附近劫持了人质，并与警方交火。当巴里议员走出电梯时，一颗反弹的霰弹枪弹丸击中了他的胸部。⁹⁶\n\
  \n尽管后来该伤口被描述为轻伤，但最初的报道称巴里被击中“靠近心脏”，这位议员胸部缠着绷带的照片在晚间新闻中闪现。坐在病房里，看着卡片和鲜花在他周围堆积，巴里——这位一贯精明的政治家——认为这次枪击将给他带来竞选市长所需的推动力。他将筹款人召到床边，指示他开设一个竞选账户。尽管胜算不大，他还是宣布参选。⁹⁷\n\
  \n巴里决定参加 1978 年市长选举，打乱了沃尔特·方特罗伊试图从早期地方自治时代选举的混乱中建立秩序的努力。方特罗伊认为塔克是更有经验、更受欢迎的候选人，指示巴里“等待轮到他”，去竞选市议会主席。相反，巴里将自己塑造成一个局外人，勇敢地与意图指定“由少数人亲手挑选”的政府的“政治老板”作斗争。⁹⁸\n\
  \n三人民主党竞选分裂了黑人选民。华盛顿吸引了年长的黑人精英、有组织的劳工和许多工人阶级选民，特别是城市雇员；塔克培养了较年轻的中产阶级黑人专业人士、联邦工作人员和企业主；巴里获得了最小份额的黑人选票，主要来自年轻专业人士和穷人。黑人牧师支持华盛顿或塔克，而民主党州委员会则在塔克和巴里之间分裂。⁹⁹\n\
  \n尽管候选人及其高级助手都是黑人，但种族仍然是选举中的一个分裂因素。“担心失去这座城市中有限的黑人控制权——一个很少公开提及的话题——是今年选举的持续背景，”《华盛顿邮报》的米尔顿·科尔曼写道。对于许多忧心忡忡的黑人居民来说，黑人政治家之间的激烈内斗、媒体对丑闻的关注，以及白人居民返回士绅化社区，都是白人政治权力复兴的迹象。他们引用了大都会贸易委员会主席罗伯特·莱诺斯的言论，他在\
  \ 4 月自信地预测，这座城市很快将实现种族平衡，并稳固地成为中上层阶级社区，穷人则从郊区通勤进来。“有一种健康的危机感，”一位活跃的黑人律师评论道。“这是我们在白人开始要求高层职位之前巩固的最后机会。”¹⁰⁰\n\
  \n\n\n\n\n在黑人社区出现分歧的情况下，白人选民在选举中掌握了平衡力量——他们转而支持巴里。这位前黑人民兵组织激进分子精心培养了一批高调的白人支持者，包括南希·“比齐”·福尔杰（宝洁公司前董事长）以及年轻有为的开发商杰弗里·科恩和康拉德·卡弗里茨。他还支持社会自由主义立场，赞成同性恋权利和大麻合法化，这激怒了黑人牧师，却吸引了白人自由派。他赢得了白人激进分子、迁入高档化社区的年轻白人专业人士、以洛根环岛和杜邦环岛为中心的政治影响力强大的白人同性恋群体，甚至第三选区一些根深蒂固的白人选民的支持。¹⁰¹\n\
  \n许多白人选民对巴里从佃农之子成长为市议员的经历着迷，视他为与过去决裂的人物，一个既能应对黑人贫困问题又能处理白人商业利益的强硬人物。他意外获得了《华盛顿邮报》的背书，该报编辑对巴里的“领导素质”印象深刻，并称赞他“真正大胆且充满活力地致力于推动事情发生”。《邮报》六篇支持巴里的社论以及该候选人在民调中的攀升，让斯特林·塔克如此不安，以至于他在民主党初选前不到一周时拼命试图劝说巴里退出。¹⁰²\n\
  \n最终票数差距小得令人揪心。巴里以不到两千票的优势在选举之夜初步宣布获胜，但经过两周的重新计票和沃尔特·方特罗伊的特别恳求，塔克才承认败选。¹⁰³\n\n白人选民和《邮报》将巴里推上了顶峰，而随着他进入大选，他不得不与“白人的候选人”这一印象作斗争——在这个以黑人为荣的城市里，这是一个有毒的标签。在初选期间，巴里的助手们煞费苦心地确保他们的候选人不要与白人支持者合影过多，他的新闻秘书曾要求报纸明确将这位候选人的新混血新娘埃菲·巴里描述为“浅肤色黑人女性”，因为她的棱角分明的面部特征在报纸照片中显得像白人。但白人选民在他胜利中的作用——以及贝蒂·安·凯恩（首位赢得全市议会席位的白人候选人）的胜利——让一些黑人观察家感到担忧。¹⁰⁴\n\
  \n![Image](img/f0001-23.jpg)\n\n*1979 年 1 月，新当选的市长马里恩·巴里在最高法院大法官瑟古德·马歇尔的主持下宣誓就职。作为佃农之子、1965\
  \ 年抵达华盛顿特区的民权活动家，巴里体现了“巧克力城”的希望与承诺。经华盛顿特区公共图书馆明星收藏集许可转载，©《华盛顿邮报》。*\n\n初选后不久，《华盛顿非裔美国人报》专栏作家莉莲·威金斯表达了私下流传的恐惧，即“无名无姓的人”有一个“总计划”，旨在削弱黑人的成果并重新确立白人对城市的控制。作为黑人中产阶级的直言不讳的代表，威金斯指出，非裔美国选民分散了选票，而白人选民则通过团结在特定候选人身后，将他们的选举影响力放大到远超其人数比例的程度。她谴责黑人政客未能防范团结一致的白人投票集团，写道：“黑人政客之间的权力争夺，反而助长了总计划。”她预测，如果巴里在\
  \ 11 月的大选中获胜，“他也会感受到总计划的刺痛”，并建议他团结黑人选票以保护自己。威金斯对“总计划”的担忧，后来简称为“计划”，将在接下来的三十年里在华盛顿特区政治中回响，每当腐败调查或白人政治收益威胁到黑人当选官员，或高档化迫使黑人居民搬迁时，这种担忧就会浮现。¹⁰⁵\n\
  \n在大选中，巴里面对共和党人阿瑟·弗莱彻——一位获得紫心勋章的黑人、前职业橄榄球运动员、尼克松总统时期的劳工部助理部长。尽管弗莱彻是一位强大的候选人，但在一个\
  \ 90%民主党选民的城市中他无法竞争，巴里赢得了全市 137 个选区中的 130 个。然而，结果预示了接下来二十年城市选举中的种族动态。许多在初选中支持巴里的白人选民在大选中转而支持弗莱彻。弗莱彻获胜的七个选区位于第三选区最富裕、白人比例最高的区域。相反，在九月份支持华盛顿的贫困非裔美国人，将绝大多数选票投给了巴里。“看来巴里不是什么‘白人的候选人’，”一位巴里竞选工作人员在查看结果时打趣道。¹⁰⁶\n\
  \n1979 年 1 月 2 日，巴里带领就职游行穿过仍留有暴乱伤痕的第十四街走廊，经过“青年自豪”办公室（该办公室模仿著名的弗吉尼亚细长香烟广告，挂起了一条横幅，上面写着：“你走了很长的路，马里恩”），前往市政大楼。主持宣誓就职仪式的是黑人民权老将、最高法院大法官瑟古德·马歇尔，他是那位毕生致力于让这一天成为可能的人——查尔斯·汉密尔顿·休斯顿的学生。¹⁰⁷\n\
  \n从 1968 年 4 月的暴乱到 1978 年马里恩·巴里赢得市长选举的这十年间，美国首都经历了一场引人注目的政治革命。1968 年初，城市居民在政治上仍然无能为力，受国会、未经选举的市政委员以及一群商业利益集团统治，自\
  \ 1870 年代被剥夺选举权以来一直如此。十年后，华盛顿人享有了一定程度的自治权，并选举了一位前民权鼓动家担任市长，同时还有一个由社区活动家组成的民选议会。在这十年间，华盛顿特区居民锻炼了在长达一个世纪的委员统治中已经萎缩的政治肌肉。这场变革动荡不安，伴随着毁灭性的暴乱、犯罪率飙升以及中产阶级逃离城市。政治常常不文明且混乱，因为华盛顿人努力在一个充满对权威（国会、警察、城市规划者、开发商等）攻击的喧嚣时代中发出自己的声音。正如一位黑人市政官员在一次特别激烈的社区会议后所说，特区经历了“充满摩擦的参与式民主”。但对于不习惯地方政治权力的城市居民——尤其是黑人华盛顿人——这是一个激动人心、充满希望的时代。¹⁰⁸\n\
  \n马里恩·巴里在 1979 年就职时体现了这些希望。这位新市长认识到，他的政府所象征的远不止他个人的成功，他肩负着特定的种族责任，要管理一个高效的政府。“有一种感觉，认为黑人什么都做不好，”他说，“我们想展示黑人是能干的。”作为第一位管理大城市的民权老将，他代表了黑人权力的潜力。“人们强烈关注巴里的市长职位和他身边的人作为榜样，”《邮报》的尼古拉斯·莱曼写道，“巴里和他最亲密的助手们说话时，仿佛全世界的目光都注视着他们。”而接下来的十年里，确实如此。¹⁰⁹\n\
  \n## 第十三章\n\n## 完美适合华盛顿\n\n### *马里恩·巴里与巧克力城的兴衰，1979–1994*\n\n许多黑人觉得，他们自己未来的一部分就寄托在马里恩·巴里作为市长的成功上。他是一个象征——最显眼的象征——代表着那些在\
  \ 60 年代成长、在 70 年代开始获得财富、地位和权力、并且不想在 80 年代失去这一切的黑人。\n\n\n\n\n—米尔顿·科尔曼，《华盛顿邮报》，1980\
  \ 年\n\n隐藏在茂密树木后的四层粗凿灰石联排别墅，位于西北尤克利德街 1345 号，很容易被忽略。尽管这栋 4335 平方英尺的建筑高大而威严，却与一排四栋几乎一模一样的邻居融为一体。该建筑在\
  \ 2010 年进行了适度翻新，这座拥有八间卧室和四个全浴室的巨大住宅看起来干净但破旧，在哥伦比亚高地过热的 21 世纪房地产市场中，是一处相对定价偏低的房产。¹\n\
  \n上一代人时，这栋建筑作为“尤克利德之家”脱颖而出，是创造性非暴力社区（CCNV）的总部。CCNV 由埃德·吉南于 1970 年创立，他是一名白人股票交易员，在多萝西·戴的天主教工人教义启发下，清算资产后前往华盛顿特区学习神职。作为一名激烈的反越战传教士，他声名鹊起，将\
  \ CCNV 视为志同道合的活动家的“新兵训练营”，引用一位成员的话来说。然而，随着十年过去，他担心该团体的反战努力忽视了身边的贫困。“在强烈的国际关注下，”吉南回忆道，“我们盲目地跨过华盛顿特区这里的尸体。”1972\
  \ 年，CCNV 将精力重新聚焦于穷人，并在肖区开设了撒该社区厨房，每天为超过四百人提供食物。²\n\n来自全国各地的忠诚活动家涌入 CCNV 的“社区”，当时位于西北\
  \ N 街，就在托马斯圆环以北。一位富有魅力但反复无常的新成员是米奇·斯奈德，他是一名布鲁克林犹太人，因欺诈入狱期间皈依了激进的反战天主教。凭借其热情的承诺和无限的精力，斯奈德迅速成为社区中的主要声音，一个愿意用激烈的言辞和大胆的抗议直接面对不公正的人。他的好斗风格与吉南发生冲突，到\
  \ 20 世纪 70 年代中期，吉南已从对抗性策略转向与穷人同住并为他们服务。为了避免内部分裂，社区于 1975 年同意开设第二个“之家”，名义上由斯奈德领导，致力于直接行动抗议。尤克利德之家由此诞生。³\n\
  \n到 20 世纪 70 年代中期，尤克利德之家周围的哥伦比亚高地社区变得危险。该地区最初是一个精英住宅区，在 1948 年最高法院宣布限制性契约不可执行后，变成了一个中产阶级黑人聚居区。该社区在\
  \ 20 世纪 60 年代开始恶化。当黑人租户搬入该地区时，白人公寓业主忽视维护，将拥有壮丽景色的华丽建筑变成了贫民窟。1968 年 4 月的骚乱在第十四街沿线留下了一连串烧毁的店面\
  \ and 毁坏的公寓楼。火灾平息后，毒贩涌入，将该街区变成了该市最大的海洛因市场之一。绝望的瘾君子 resort 到盗窃、卖淫和抢劫，迫使许多中产阶级房主离开。⁴\n\
  \n该市通过将该地区用作前科犯和精神疾病患者的倾倒场，加速了社区的恶化。尤克利德街 1345 号的房产成为从洛顿监狱过渡出来的男子的住所，华盛顿特区官员在方圆两个街区内又安置了六个集体之家和过渡教习所。到\
  \ 20 世纪 70 年代中期，许多房主将房产卖给了投机者，他们希望附近杜邦圆环和亚当斯摩根正在进行的中产阶级化能够蔓延到哥伦比亚高地。但预期的开发热潮从未到来，投资者只是用木板封住他们的房产以度过经济风暴。⁵\n\
  \n将哥伦比亚高地变成贫民窟的同样力量吸引了激进活动家和社区组织者。许多在 20 世纪 60 年代将该社区作为基地的民权和黑人权力组织在 20 世纪 70 年代仍然存在。骄傲公司在第十四街和尤克利德街的拐角处拥有一家加油站；华盛顿活跃黑人商人联盟的总部设在贝尔蒙特街的皮茨汽车旅馆；鼓与矛书店由一群学生非暴力协调委员会（SNCC）校友拥有和经营，位于费尔蒙特街\
  \ 1371 号。几个以白人为主的新左派社区也在此定居，加强和丰富了该社区的活动家传统：寄居者，一个致力于社区组织的反战基督教团体；哥伦比亚高地社区所有权项目，一群反中产阶级化倡导者；以及创造性非暴力社区。⁶\n\
  \n搬到尤克利德街对米奇·斯奈德和他的 CCNV 活动家同伴产生了巨大影响。他们周围到处是投机者持有的废弃房屋——哥伦比亚高地占据了全市大约四千套空置房屋中不成比例的数量——而辛勤工作的穷人和流浪汉却无家可归。该市不为单身无家可归成年人提供庇护所，而是将这项工作留给了一个由信仰为基础的非营利组织组成的网络，这些组织总共为男性提供两百张床位，为女性提供的床位不到二十张。CCNV\
  \ 向流离失所的社区居民开放了尤克利德之家，到 1976 年中期，斯奈德回忆说，“每晚有四十或更多人在我们的地板上睡觉。”活动家们的精力、奉献精神以及拒绝评判有需要的人的态度，使他们深受所服务的穷人的喜爱。“他们什么也不要求，”罗伯特·刘易斯观察到，他是一名间歇性住在尤克利德之家的戒酒康复者。他们“只是帮助我重新站起来。”⁷\n\
  \n决心解决危机的系统性原因，斯奈德和尤克利德之家社区敦促市长沃尔特·华盛顿不情愿的政府为该市日益增长的无家可归人口建立一个庇护系统。市政官员勉强服从，但 CCNV\
  \ 发现市营庇护所是残酷的地方，无家可归的男性有时会被保安殴打，被迫在进入场所前脱光衣服淋浴，并在黎明前被赶回街头。许多无家可归者拒绝屈服于这种屈辱，继续流落街头，睡在蒸汽格栅上或废弃的汽车里。冬天，他们中有几十人冻死。⁸\n\
  \n对华盛顿市长感到恼怒的尤克利德之家成员在马里恩·巴里 1978 年赢得市长选举中找到了希望。尽管他们没有参与选举政治，但他们与巴里建立了工作关系——斯奈德甚至在巴里\
  \ 1977 年遭枪击后去医院探望过他。上任后，巴里市长接受了 CCNV 的改革议程。“庇护所是一项基本人权，”他在 1979 年 2 月的一次演讲中宣称，并坚称他的政府将确保“为首都每一个有需要的人提供足够的庇护所。”他任命了一个市长无家可归问题咨询委员会，并责成其制定一个全面的、分散的小型庇护所和临时收容中心系统的计划，这正是\
  \ CCNV 一直为之奋斗的那种系统。对于习惯了被官员嘲笑并被排除在决策制定之外的活动家来说，这是一个令人振奋的时刻。⁹\n\n\n\n\n1979 年初，欧几里得住宅区的居民们感受到的兴奋，反映了巴里市长执政初期许多华盛顿特区居民所怀有的希望、乐观和可能性。在骚乱的废墟之上，在白人逃离造成的真空之中，面对低效且常常漠不关心的城市官僚体系，华盛顿特区的居民们试图塑造一个种族平等、经济公正的新城市。马里恩·巴里成为了他们崇高抱负的载体——他从佃农之子成长为街头抗议者，再到国家首都的最高行政长官，这一历程激励了许多华盛顿人雄心勃勃地想要将特区打造成一个模范的“巧克力城市”。\n\
  \n### *“我们要向所有人证明，黑人真的能管理好事情”：马里恩·巴里掌权*\n\n伊万霍·唐纳森难掩激动之情。学生非暴力协调委员会即将管理一座城市——而且不是普通的城市，而是国家的首都。唐纳森\
  \ 1941 年出生于哈莱姆区，是一名警察和一名家庭主妇的独子，他的父母是牙买加移民，崇拜黑人民族主义者马库斯·加维，并在儿子心中灌输了沉稳的自信心和自豪感。在密歇根州立大学就读期间，他独自前往北卡罗来纳州参加\
  \ SNCC 的成立会议，并在那里结识了马里恩·巴里。尽管身材瘦小，几乎可以说是纤弱，但唐纳森有着钢铁般的决心，自愿承担了南方一些最危险的工作。他还是一位如饥似渴的读者、一位敏锐的思想家和一位出色的策略家。20\
  \ 世纪 60 年代中期，唐纳森帮助斯托克利·卡迈克尔完善了他关于黑人权力的思想，随着运动从抗议转向政治，他辗转于各州，领导了一些标志性的竞选活动，将《投票权法案》后的第一代黑人政治家推上了权力宝座。¹⁰\n\
  \n在奔波之余，唐纳森将华盛顿特区作为自己的大本营。“我想住在一个黑人城市，”他后来回忆道，并且“同时成为全国政治和本地社区的组织者”。1965 年之后的几年里，大约有三十多名他的\
  \ SNCC 战友出于同样的原因加入了他所在的哥伦比亚特区。他们对这个新家园产生了决定性的影响，在从联邦城市学院黑人研究项目的创立，到领导通过自治宪章公投的竞选活动等各个方面都发挥了主导作用。唐纳森陶醉于与他们的相处。他与约翰·威尔逊合住一间公寓，在鼓与矛书店与查理·科布和朱迪·理查森争论黑人政治，并号召他的运动盟友帮助他们的老朋友马里恩·巴里在\
  \ 1974 年当选华盛顿特区市议会议员。¹¹\n\n唐纳森管理了巴里 1978 年那场看似不可能的市长竞选，并在结果揭晓后，再次号召他的运动同僚帮助这位年轻的当选市长。SNCC\
  \ 的老将们充实了巴里的政府，包括新闻秘书弗洛伦斯·泰特、少数族裔商业机会委员会主任考特兰·考克斯、规划与发展助理市政管理员詹姆斯·吉布森、住房部居民服务主任凯伦·斯佩尔曼，当然还有担任总助理的唐纳森。在美国其他任何地方，都没有一个黑人抗议组织如此彻底地主导一个主要城市的政府。“我们要向所有人证明，黑人真的能管理好事情，”唐纳森在\
  \ 1979 年搬进特区行政大楼办公室后不久兴奋地说道。¹²\n\n巴里市长与唐纳森一样，希望将华盛顿特区打造成黑人政治权力的展示窗口。距离克利夫兰的卡尔·斯托克斯当选美国主要城市首位非裔市长，仅仅过去了十二年。在他之后，涌现了一批令人瞩目的黑人市长，包括科尔曼·扬（底特律）、汤姆·布拉德利（洛杉矶）、梅纳德·杰克逊（亚特兰大），当然还有华盛顿特区的沃尔特·华盛顿。他们的成果喜忧参半。白人逃离、城市制造业岗位消失、持续的贫困和犯罪，使他们的许多努力受挫。巴里对这些政府的批评十分敏感。“有些白人本来就不认为（黑人领导）能行得通，现在正说着‘我早就告诉过你’，”他在竞选期间对《华盛顿邮报》表示。¹³\n\
  \n1979 年 1 月，巴里满怀决心地冲进市长办公室，要证明他们是错的。他设定了疯狂的节奏，每天工作十三个小时，早上赶在秘书之前到达特区行政大楼，晚饭后很久还在与助手们密谈。他要建立一个“开放、称职且富有同情心”的政府，一个“对媒体反应迅速……接听电话并解决市民问题”的政府。他聘用了一支多元化的、充满活力的年轻城市管理者团队，反映了城市的人口构成。尽管非裔男性占主导，巴里也首次将大量女性、拉丁裔官员和同性恋者带入了华盛顿特区政府的上层。¹⁴\n\
  \n他还让市长办公室毫不掩饰地彰显黑人特色。巴里在办公室外的墙壁上挂满了塞内加尔挂毯，随后在一场精心安排的招待会上向公众展示，并邀请了该国驻美国大使出席。1979\
  \ 年年中，他开始了对五个非洲国家的访问，最终在利比里亚举行的非洲统一组织会议上发表演讲——利比里亚是一个由一个半世纪前通过殖民运动重新安置的美国黑人建立的国家。¹⁵\n\
  \n巴里的目标不仅仅是让地方政府更高效、更具代表性。他希望政府为人民服务——特别是那些自重建时期以来就被排除在决策之外的低收入黑人居民。他提出了一项耗资数百万美元的计划，旨在“拆除木板”，修复该市估计约\
  \ 4500 栋废弃房屋。该计划的旗舰项目是贝茨街项目，这是肖社区一项长达三个街区的改造工程，此前因官僚主义的繁文缛节和资金问题而停滞不前。巴里通过向开发商提供数百万美元的无息贷款，启动了建设。到\
  \ 1979 年底，已有超过一百个中产和工薪家庭搬进了新装修的楼房，其中一些还获得了城市补贴以降低居住成本。巴里还将夏季青年就业计划的规模扩大近一倍，并启动了一项降低婴儿死亡率的计划。¹⁶\n\
  \n尽管巴里努力满足穷人的需求，但他最成功的还是利用城市合同将金钱和权力重新分配给黑人中产阶级。该市人口中约 70%是黑人，但 1978 年少数族裔拥有的企业仅占城市合同总额的\
  \ 7%。少数族裔商业机会委员会主任考特兰·考克斯打算立即将这个数字提高两倍以上，并警告那些未能将 25%的合同交给少数族裔的市政机构负责人，“应该认真评估自己在市政府中的位置”。巴里对白人承包商施加强大压力，告诉他们如果想做市政府的生意，就必须雇佣黑人工人；而考克斯则鼓励黑人企业家专门为城市合同创办企业，并与白人拥有的公司建立合资企业以扩大产能。¹⁷\n\
  \n\n\n\n\n在考克斯任内，该市很少签署不涉及少数族裔企业的合同。到 1985 年，价值近 1.6 亿美元的市政合同中，有 35%流向了少数族裔企业。这一举措催生了一批新的黑人百万富翁，一些最初从该市起步的少数族裔公司，包括黑人娱乐电视公司和皮布尔斯公司，最终成长为行业巨头。¹⁸\n\
  \n尽管取得了这些成功，巴里几乎立即遇到了系统性问题，这些问题削弱了他政府早期的承诺。其中最突出的是官僚机构——一个臃肿的、拥有四万四千名员工的队伍，效率低下得令人沮丧，成本高昂得可怕，有时还粗鲁得惊人。官僚主义的拖延破坏了他市长的标志性项目。尽管住房局曾以创纪录的速度交付了贝茨街项目的前一百套住房，但到\
  \ 1982 年夏天，其余房屋的进度落后了两年，预算超支数百万美元，这在很大程度上是由于市政工作人员在发放款项前未能检查承包商的工作。就连以强硬执法者著称的唐纳森也发现，市政工作人员要么无能，要么顽固不化，以至于“本应一天完成的项目”可能“占用你多达十天的时间”。¹⁹\n\
  \n或许最具破坏性的是官僚机构未能做好账目。该市的预算和报告结构自地方自治之前就几乎没有变化，当时市政机构与联邦对应机构的联系比与特区大楼的联系更为紧密。1976\
  \ 年，安达信会计师事务所判定该市的账目“无法审计”。新任市政审计长阿尔方斯·希尔回忆说，1979 年，每个部门仍然像“小领地”一样运作，拥有自己的会计、人事和工资人员，没有中央协调，因此无法确定该市花了多少钱以及花在了什么地方。巴里政府花了两年时间和\
  \ 600 万美元才完成了一次审计——这是该市历史上第一次审计。²⁰\n\n当政府官员终于弄清楚账目上的情况时，他们发现该市有 1.15 亿美元的赤字，超过 3\
  \ 亿美元的长期债务，以及近 7.4 亿美元的无资金准备的养老金负债。因此，巴里并没有改革官僚机构，而是在他上任的头两年里，从预算中榨取了每一分额外的钱。²¹\n\
  \n为了弥补资金缺口，巴里公布了一份紧缩的 1981 年预算，要求增税、削减市政服务、裁员和冻结工资。这些削减对穷人、老年人和无家可归者的打击最为严重。对于许多在巴里上任后才真正获得市政服务的人来说，包括米奇·斯奈德和创造性非暴力社区，这份预算尤其具有毁灭性。就在他承诺大幅改善无家可归者服务一年后，巴里解散了市长无家可归者委员会，并宣布该市将在\
  \ 72 小时内关闭两个紧急收容所以节省资金。CCNV 匆忙组建了一支公益律师团队来对抗市长的命令，并获得了要求该市保持收容所开放的判决。²²\n\n这些削减分裂了巴里的联盟。劳工领袖和青年团体谴责他提议关闭社区中心、解雇市政工作人员，却没有让商界支付“其应得的份额”。当他在特区大楼前的集会上登台时，一群由市政工作人员、住房倡导者和社区活动家组成的多元化群体对他发出了嘘声。习惯于抗议权威人物而非成为抗议对象的巴里告诉他们“见鬼去吧”。“他更关心有钱人，”一位靠固定收入生活的寡妇说，“他已经背弃了穷人和老人。”²³\n\
  \n在危机期间，唯一与市长关系更密切的群体是像罗伯特·莱诺斯这样的商人——他是大华盛顿贸易委员会的前白人主席，他赞扬巴里“做出了艰难的选择”。到 1980 年\
  \ 12 月，只有 31%的非裔美国居民认可他的执政表现。对于这位前活动家来说，这是对政治权力的现实和限制的一次残酷觉醒。²⁴\n\n### *“恩庇就是好政治”：巴里在保守派反对声中建立政治机器*\n\
  \n当四面楚歌的巴里努力维持他的联盟时，该市却陷入了日益崛起的全国性保守运动的瞄准镜中。保守派的首要目标之一是《哥伦比亚特区投票权修正案》（DCVRA），该修正案在巴里当选后的几个月内被提交各州批准。与同样正在考虑批准的《平等权利修正案》一样，DCVRA\
  \ 遭到了来自草根组织、智库和压力集团的强大联盟的强烈反对。\n\n一个特别有效的对手是美国立法交流委员会（ALEC），这是一个成立于 1973 年的保守派州议员和商业利益联盟。ALEC\
  \ 是“新右翼”组织密集网络的一部分，该网络利用一系列重叠的议题运动——包括税收、平权行动、平等权利修正案、同性恋权利和 DCVRA——来动员支持者。1978\
  \ 年，ALEC 的新任主席、亚利桑那州众议员唐娜·卡尔森将反对 DCVRA 的斗争列为其首要议程。在卡尔森的领导下，ALEC 向数十名保守派评论员提供了研究材料和谈话要点，这些评论员攻击\
  \ DCVRA 是试图为“华盛顿官僚提供特殊特权和权力”，并阴谋选举“极端自由派民主党人”，这些人将支持“联邦资助的堕胎……枪支管制……劳工法‘改革’以及工会头目推动的所有其他法案”。ALEC\
  \ 将对修正案的批评编入厚厚的蓝色简报手册，并寄给全国每一位州议员。该团体的游说努力果断地削弱了修正案早期的势头。²⁵\n\n意识到公开的种族敌意已在政治上变得不受欢迎，新右翼活动家们走钢丝，在反对修正案时淡化种族问题，同时诉诸白人对黑人权力的焦虑。帕特里克·布坎南找到了平衡点。这位好斗的华盛顿本地人在切维蔡斯长大，曾帮助制定尼克松总统将这座城市描绘成“犯罪之都”的战略。现在，他巧妙地将白人对自由派政策的愤怒编织成反对\
  \ DCVRA 的有力论据。尽管他私下承认华盛顿居民有“合理的怨愤”，但在公开场合，他将该修正案称为“平权行动计划”，并恳求美国人不要“为了……让（民权活动家）朱利安·邦德能坐上参议院席位而搁置两个世纪的宪政政府”。²⁶\n\
  \n面对协调一致的保守派反对，推动 DCVRA 通过的努力步履蹒跚。到 1980 年夏末，只有十个州批准了该修正案。九个州以较大差距否决了它。共和党自 1948\
  \ 年以来第二次通过了没有包含华盛顿特区投票权条款的党纲。（这一变化持续了——在接下来的三十二年里，该党要么对此问题保持沉默，要么反对任何扩大华盛顿特区自决权的举措。）1980\
  \ 年 11 月的联邦选举通过将带头反对 DCVRA 的保守派叛乱分子推上权力舞台，包括新当选的总统罗纳德·里根，从而决定了该修正案的命运。²⁷\n\n\n\n\
  \n1980 年的选举从根本上改变了这座城市与共和党及联邦政府的关系。自 1974 年地方自治实施以来，控制国会的自由派人士刻意避免卷入地方立法的争斗，力求在《地方自治法案》的法定框架内，给予新成立的华盛顿特区政府最大程度的自主权。而新近壮大的保守派则抛弃了这一惯例，积极干预特区事务，并将这座城市作为国家政策辩论中的标靶。“国会就是地方政府，”伊利诺伊州众议员菲利普·克兰在\
  \ 1981 年秋与共和党同僚成功推翻特区性侵立法后表示，“我们有责任审查华盛顿特区市议会所做的一切——所有事情。”²⁸\n\n接下来的五年里，国会共和党人提出了十二项否决决议——即国会否决市议会通过的法案——反对从\
  \ 1981 年将成年人自愿鸡奸非刑罪化的城市法律，到 1983 年剥夺与南非和纳米比亚白人至上主义政权有业务往来的公司城市资金的法律等一切内容。来自加利福尼亚州的黑人众议员朱利安·迪克森出生于华盛顿，并担任众议院特区拨款小组委员会主席，他感叹道：“有些议员抱有种植园主心态，认为他们必须充当领主，因为特区居民无法处理自己的事务。”²⁹\n\
  \n保守派的反对声浪日益高涨，而马里恩·巴里的政治运势却有所回升。在经历了第一年的预算危机后，巴里得益于市中心开发热潮——部分由城市地铁系统扩建所推动。在整个老城区，土地价格飙升，开发商推平了一排排破旧的排屋，代之以闪亮的办公大楼，而城市的百货公司则翻新了旧建筑——赫克特公司新建了一座设施，这是几十年来美国中心城市建造的第一家大型百货公司。巴里通过为建筑商简化审批流程、与联邦政府密切合作协调开发、以及推进在西北区\
  \ H 街第九街与第十一街之间建设会议中心的计划，加速了复兴进程。在市中心以外，显著的绅士化进程持续到 80 年代中期，不断变化的社区中飙升的房地产价格带来了财产税收入的大幅增长。³⁰\n\
  \n巴里利用这些新增收入扩大和改善城市服务，这帮助他赢得了广大黑人社区的支持。在第七选区——阿纳科斯蒂亚河以东一片狭长的区域，这里既有公共住房项目，也有被称为“银色海岸”的稳固中产阶级黑人社区——市政府改善了垃圾清运和公共交通，清理了小巷和街道，任命了许多居民进入公共委员会，并翻新了图书馆和游乐场。这种关注让长期习惯于被市政府忽视的居民感到自己是执政联盟的一部分。“马里恩给我们带来了尊重，”居民基米·格雷说，巴里任命她为公共住房咨询委员会主席。³¹\n\
  \n市长还为他们提供了工作。与他重建时期的 predecessors 类似，巴里面临着在一个缺乏工业基础的城市中为大量低技能和中低技能的非裔美国人人口寻找就业的问题。由于不再被迫削减预算，巴里放弃了精简官僚机构的努力，转而将市政府作为就业计划。他给公共部门员工加薪\
  \ 20%，并开始了持续到第二任期的大规模招聘，在已经庞大的工资单上增加了四千名员工。政府规模急剧膨胀，成为全国人均雇员最多的政府。尽管有这么多员工，城市官僚机构仍无法摆脱效率低下和无效的名声，尤其是在服务城市最贫困人群的机构中。但心怀感激的城市员工成为巴里选举联盟的中坚力量，引发了媒体对恩庇政治的指责。“恩庇政治，”巴里连任竞选经理伊万霍·唐纳森回应道，“就是好的政治。”³²\n\
  \n巴里在 1982 年的连任竞选中收获了政治回报。在民主党初选（在这个民主党占绝对优势的城市中唯一有意义的选举）中，他面对的是帕特里夏·罗伯茨·哈里斯，一位成就卓著的黑人律师，曾在卡特政府中担任卫生、教育和福利部长。巴里在竞选中回避与哈里斯正面交锋，依靠其优越的组织能力和对城市服务的最后时刻改进来抵消她的批评并巩固自己的基本盘。他还有效地利用种族问题，将哈里斯——浅肤色、优雅、资历无可挑剔——描绘成不够“黑”。“华盛顿特区的选举中一直有一位黑人候选人，”唐纳森告诉《华盛顿邮报》，“马里恩就是那位候选人。”哈里斯愤怒地谴责了这一策略，指出她曾参与\
  \ 1943 年霍华德大学的静坐抗议，并且“早在马里恩·巴里之前就参与了民权运动。”³³\n\n市长的策略成功了。巴里获得了 59%的选票，而哈里斯仅赢得了以白人为主的第三选区。巴里在每个选区都赢得了压倒性的黑人支持，甚至包括四年前曾反对他的黑人中产阶级居民。他用一个跨阶级的黑人联盟取代了\
  \ 1978 年的跨种族联盟。³⁴\n\n随着巴里巩固了对非裔选民的控制，白人选民影响选举的能力下降了。白人民主党人在党内是明显的少数派，而全国共和党的变化则削弱了地方上各种族的共和党人。自\
  \ 1974 年地方自治时代开始以来，华盛顿特区的共和党人包括一部分城市中社会保守的黑人中产阶级、第三选区的自由派白人共和党选民，以及全国知名的非裔政治任命官员——他们空降到城市竞选公职。然而，全国党内新右翼的崛起边缘化了自由派黑人共和党人。该党将未来寄托在白人选民身上，放弃了像华盛顿特区这样的黑人占多数的司法管辖区，反而将它们作为稻草人，用来向居住在其他地方的白人选民争取政治分数。³⁵\n\
  \n由于市内已无严重反对派，巴里确立了自己的政治主导地位。为了先发制人地遏制任何未来的对手，并避免重蹈第一任期预算战的覆辙，市长通过根据市议会成员的忠诚度来分配或扣留城市服务，迫使市议会屈服于政治顺从。对政府举措的反对消失了。1984\
  \ 年，巴里指示伊万霍·唐纳森竞选民主党州委员会主席，对手是资深活动家西奥迪斯·盖伊，后者曾使该党相对独立于市长。唐纳森轻松击败了他。³⁶\n\n\n\n\n\
  巴里甚至通过将大多数城市抗议组织的领导层纳入工资名单或给予他们市政合同，来收编这些组织。“我们雇佣每一个抱怨的人，”市议员约翰·威尔逊抱怨道，“这个城市没有独立的倡导团体。”对于少数他无法控制的活跃分子，巴里则进行诽谤。当米奇·斯奈德和\
  \ CCNV 非法将位于西北区第二街和 E 街的一座二战时期临时建筑改造成无家可归者收容所时，巴里派遣了亲信劳伦斯·盖奥特——另一位 SNCC 老将——去污蔑他为“吉姆·琼斯”式的“邪教领袖”，这一说法也得到了里根政府的呼应。³⁷\n\
  \n在牢牢掌控民主党、共和党被孤立于第三选区的情况下，巴里成为地方政治中最有权势的人物。“我可能并不完美，”巴里在 1986 年轻松赢得连任后得意地说，“但我对华盛顿来说完美无缺。”《华盛顿邮报》的尤金·罗宾逊称他为“巴里老板”，并半开玩笑地推测，“市长现在唯一的真正对手是美国检察官。”但事实证明，他——以及这座城市——最大的敌人比联邦政府更微小却更强大。那就是快克可卡因。³⁸\n\
  \n### *“一切都在分崩离析”：快克席卷华盛顿*\n\n当马里恩·巴里忙于构建他的政治机器时，雷富尔·埃德蒙德三世启动了一个本地可卡因帝国。埃德蒙德出生于\
  \ 1964 年，在一个庞大而充满爱意的大家庭中长大，是备受宠爱的儿子，家庭核心是他外祖母位于东北区 M 街 407 号的住所。他的父母是华盛顿坚实的黑人工人阶级成员，两人都在美国卫生与公众服务部（DHHS）工作，父亲是司机，母亲是人事专员。埃德蒙德回忆说，自己小时候被“宠坏了”。他慷慨大方、热爱运动，总是露出宽大而令人放松的笑容，因此在邓巴高中同龄人中很受欢迎——那时的邓巴高中已远不如其作为黑人公立教育皇冠明珠的鼎盛时期。同学们选他为“最受欢迎二年级生”、“最受欢迎三年级生”，并在高年级时评为“最受欢迎人物”。³⁹\n\
  \n尽管获得诸多赞誉，埃德蒙德在 1983 年从邓巴高中毕业后仍挣扎求生。他尝试过上大学，也打过零工，但发现自己被家族生意——毒品——所吸引。他的父母都涉足毒品交易以增加收入。父亲“大雷”小埃德蒙德靠做数字跑腿和小毒贩赚外快，母亲康斯坦斯“布齐”佩里则向海洛因贩子出售处方减肥药，这些贩子用减肥药来稀释他们的产品。老埃德蒙德夫妇并未向年幼的雷富尔隐瞒他们的活动。“我爸妈教会了我毒品游戏，”他回忆道，“那时我才九、十岁。”\n\
  \n1982 年，巴里政府通过创建市营彩票剥夺了大雷的数字赌博生意后，他辞去了 DHHS 的工作，开始全职从纽约进口可卡因。两年后，他让儿子参与进来。雷富尔三世从父亲那里拿到一公斤可卡因，将其拆分，然后前往“那条街”——位于东北区莫顿街和奥尔良广场\
  \ 600 街区的露天毒品市场。这是一段极其暴利且充满暴力的职业生涯的开端。⁴⁰\n\n到 20 世纪 80 年代中期雷富尔·埃德蒙德成为毒贩时，华盛顿的非法毒品交易已存在半个多世纪。这座城市吸毒者的人数，曾局限于地下酒吧和爵士俱乐部的后屋，随着\
  \ 20 世纪 60 年代海洛因交易的繁荣而激增，并蔓延到街头。到 1969 年，该市约有六千名吸毒者，尽管尼克松总统发动了“针对哥伦比亚特区危险非法毒品交易的战争”，但毒品交易在整个\
  \ 70 年代依然顽固地持续着。⁴¹\n\n20 世纪 80 年代，越来越多的特区居民转向可卡因，这是一种“富人毒品”，吸引着能负担得起每克 100 美元价格的白领工作者。作为年轻专业人士的聚集地，华盛顿地区成为可卡因的主要市场。律师和房地产开发商在乔治城的家庭派对上吸食可卡因；西北区高档棕榈餐厅的领班和女服务员向说客和社交名流兜售可卡因；甚至少数国会议员也曾涉足，直到\
  \ 1983 年一次关于国会山吸毒的调查吓得他们更加谨慎。⁴²\n\n高档毒贩和吸毒者融入了以白人为主的郊区和富裕社区的社会景观，但在市中心贫困的黑人社区，他们创建了大型、混乱的露天市场，向社区瘾君子、午休的律师以及郊区通勤者出售毒品。在华盛顿的\
  \ 16 个露天市场中，最繁忙的是西北区汉诺威广场，这是一条狭窄的单街区小巷，位于国会山以北约 1.5 英里处。它变成了一个 24 小时营业的市场，“排着长队，周末和月初队伍更长，还有一大群人和小贩……以及扒手和劫匪，”一位居民回忆道。1985\
  \ 年，这个市场成为战场，毒贩们为争夺华盛顿利润丰厚的毒品交易份额而争斗。由于需求高、供应低，华盛顿的可卡因售价通常是纽约的两倍。⁴³\n\n到 1985 年底，华盛顿的人均毒品逮捕率超过了美国所有其他城市。次年，随着可卡因沿着收入阶梯向下蔓延到贫困和工薪阶层的非裔美国人吸毒者，它取代海洛因成为特区吸毒者的首选毒品。\n\
  \n1986 年 6 月，马里兰大学篮球明星伦·拜亚斯的死亡使这座城市日益严重的毒品流行成为全国新闻。拜亚斯是家乡英雄，在紧邻城市边界的马里兰州海厄茨维尔长大。20\
  \ 世纪 70 年代，像拜亚斯这样的中产阶级黑人家庭开始重新划定“巧克力城”的边界。为了寻求好学校和广阔的郊区绿地，他们涌入马里兰州边界，在乔治王子县蜿蜒的小巷里购买世纪中叶的独栋住宅。白人县居民在他们到来前纷纷逃离，到\
  \ 1986 年，特区边界沿线的大多数社区已成为黑人占多数。尽管决心逃离城市的弊病，但搬到乔治王子县的黑人居民通常仍在城市里工作、礼拜和社交。正如一位希尔克雷斯特高地居民所说：“我们的归属在华盛顿，我们只是住在马里兰。”⁴⁴\n\
  \n拜亚斯一家也不例外。他们去东北区第十七街的朝圣者 AME 教堂做礼拜，大学期间，伦经常光顾国会山以南的第三章夜总会等华盛顿夜店。因此，当世界冠军波士顿凯尔特人队在\
  \ NBA 选秀中以第二顺位选中拜亚斯时，许多华盛顿黑人将他的好运视为自己的好运。但不到两天后，这位优雅的前锋就因可卡因过量死亡。⁴⁵\n\n![Image](img/f0001-24.jpg)\n\
  \n*居民在芒特普莱森特抗议一个露天毒品市场。露天毒品市场吸引了来自全市和郊区的毒贩和吸毒者。这些市场在 20 世纪 80 年代末的快克流行期间蓬勃发展。© 1989\
  \ Carol Guzy / 《华盛顿邮报》。*\n\n\n\n\n比厄斯的死震惊了华盛顿市民和联邦官员。此事发生在全国对可卡因成瘾日益担忧的背景下，引发了媒体的强烈关注——诸如《体育画报》等杂志将他作为封面人物，而《华盛顿邮报》在他去世后的几个月里发表了数百篇关于这位年轻前锋的文章。罗纳德·里根总统在黄金时段发表电视讲话，呼吁美国人加入一场“全国性圣战”对抗毒品，国会中的民主党人匆忙拼凑出严厉的《1986\
  \ 年反毒品滥用法案》，其中包含对多种毒品犯罪的强制性最低刑期，以及快克可卡因和粉末可卡因之间 100:1 的量刑差异。哥伦比亚特区在该法案的听证会上被重点提及，最引人注目的证词来自一名前毒贩，他坐在磨砂玻璃板后面隐藏身份，宣称：“可卡因在华盛顿无处不在。”⁴⁶\n\
  \n在国会山的压力以及民调显示特区居民将毒品视为城市最大问题的情况下，巴里在 1986 年 8 月竞选连任期间发动了自己的毒品战争。“清洁扫荡行动”针对的是城市的露天毒品市场，由助理警察局长艾萨克·富尔伍德策划，这位警官在\
  \ 1977 年人质危机中表现出色，巴里随后一路提拔他。该行动动用 100 至 200 名警员组成的队伍，对毒品市场进行饱和式打击，使用“突击小队”抓捕毒贩，以及“买断抓捕”小组对付吸毒者。回顾往事，富尔伍德对行动的规模感到惊叹：“我们周末有时真的逮捕了\
  \ 800 到 900 人。”受影响社区的居民对此表示欢呼，感谢能暂时摆脱那些喋喋不休的毒贩（“你在找货吗？”“我有货”）以及日益增长的暴力威胁。⁴⁷\n\n\
  “清洁扫荡行动”帮助巴里在当年 11 月轻松赢得连任，但它只给毒品肆虐的社区带来了短暂的缓解。在汉诺威广场，警方在街区中央设立了一个移动指挥中心，封堵了 47\
  \ 栋废弃房屋，运走了 300 吨垃圾，其中包括 41 辆被盗汽车——然而他们撤离后，毒品市场又卷土重来。由于需求依然旺盛，毒贩仍然众多，毒品交易蓬勃发展。到\
  \ 1988 年 12 月，警察局长莫里斯·特纳宣布该行动失败，尽管花费了 600 万美元并逮捕了近 3 万人。大规模逮捕造成了长期损害，制造了一代重罪犯。1985\
  \ 年至 1987 年间，警方逮捕了 18 至 29 岁年轻男性中每四人就有一人，罪名与毒品相关。由于该行动针对的是露天市场，而非高档社区中更为隐蔽的交易，几乎所有被捕者都是非裔美国人。⁴⁸\n\
  \n而“清洁扫荡行动”未能阻止“快克”的蔓延。\n\n快克是一种更廉价的可卡因形式，通过将可卡因与小苏打或氨水煮沸制成一种坚硬、岩石状的可吸食物质。它最早出现在纽约和迈阿密等主要毒品进口城市，于\
  \ 1986 年底在华盛顿特区广泛流行。快克极大地扩大了吸毒人群，吸引了穷人、青少年以及因可卡因高价而却步的偶尔使用者——一小袋“石头”最低只需 5 美元。\n\
  \n快克比粉末可卡因更容易上瘾，它能带来短暂而强烈的快感，让使用者渴望再来一次。绝望的瘾君子开始变卖一切能卖的东西来购买这些白色小石头。“我见过母亲为了快克而卖淫，甚至让女儿去拉皮条，”小托尼·刘易斯回忆道，他的父亲曾在西北区第一街和贝茨街的露天市场经营，就在巴里市长\
  \ 1979 年匆忙翻新的房子前面。为了满足扩大的交易，毒贩又开设了三十多个毒品市场，到 1987 年底，全市总数接近 60 个。两年后，这个数字翻了一倍多。⁴⁹\n\
  \n在华盛顿，没有谁比雷富尔·埃德蒙三世在传播快克方面做得更多。1984 年底，在与风化警察的一次冲突中险些入狱后，埃德蒙决定放弃街头贩卖，转而成为供应商。他利用庞大的家族和一群邻里朋友，组建了一个令人印象深刻的走私、生产和零售网络，迅速主导了这片区域。1987\
  \ 年，他直接与哥伦比亚的卡利贩毒集团建立联系，开始大量进口高品质可卡因，然后以低价作为快克出售。埃德蒙与他的前邓巴高中同学托尼·刘易斯一起，每月可能进口约 1700\
  \ 磅可卡因，约占特区市场的 20%。⁵⁰\n\n当瘾君子们听说埃德蒙的顶级产品后，他们涌向这片区域和其他能找到货的市场。在繁忙的夜晚，埃德蒙的毒贩每分钟完成\
  \ 30 笔交易。每周总收入约 200 万美元，由于缺乏通过合法生意洗钱的渠道，埃德蒙在汽车和珠宝上挥霍无度（包括一块价值 4.5 万美元的镶钻劳力士），带朋友和家人进行奢侈购物之旅，并频繁前往纽约、拉斯维加斯等地。他还塑造了慷慨仁慈的公众形象，在感恩节为街区的人们购买火鸡，支付拖欠的水电费和房租，甚至给孩子们发\
  \ 100 美元钞票。⁵¹\n\n随着快克扩张了华盛顿特区的毒品交易，利润丰厚，来自纽约和迈阿密的武装牙买加帮派在 1986 年和 1987 年试图强行介入，引发了一场血战。埃德蒙和他华盛顿的同行们前往弗吉尼亚购买自己的军火库（特区议会在\
  \ 20 世纪 70 年代中期通过了严格的枪支管制立法）。装备齐全后，他们击退了外来者，然后为了地盘、利润和尊严，将枪口转向彼此，展开了一场致命的争斗。⁵²\n\
  \n几乎完全由毒品相关杀人案的激增驱动，华盛顿特区的谋杀案数量从 20 世纪 80 年代前半期平均每年 200 起跃升至 1988 年的 372 起。1989\
  \ 年 1 月，一群如释重负的底特律记者计算数据后宣布，华盛顿特区已超越汽车城，成为美国的“谋杀之都”。警方无力阻止这场屠杀，部分原因是巴里市长削减了他们的预算，并在警察局高层安插了政治亲信。⁵³\n\
  \n巴里试图安抚惊慌的华盛顿市民，辩称大多数杀戮是毒贩之间的“定点清除”，因此特区绝大部分地区是安全的。屠杀确实几乎只局限于岩溪公园以东的贫困非裔美国人社区。1988\
  \ 年，其以西的富裕社区没有发生一起谋杀案。市长承诺以“领导力、想法、计划和行动”来解决这个问题，但暴力事件只增不减。每一起杀戮都会引发敌对团伙的报复，而警察局极低的谋杀案破案率使得毒品执法者逍遥法外。臭名昭著的韦恩·佩里一人就杀害了近\
  \ 36 人。尽管联邦当局在 1989 年逮捕了雷富尔·埃德蒙，但杀戮事件有增无减，在 1991 年达到顶峰，共 482 起。⁵⁴\n\n\n\n\n感到被市政府抛弃后，许多社区开始自行对抗毒贩和瘾君子。在二战期间由\
  \ Elder Michaux 建造的东北部庞大公寓群 Mayfair Mansions，居民邀请伊斯兰民族组织在一个露天毒品市场提供禁毒巡逻——这个市场规模巨大且危险，警察称之为“小贝鲁特”，并拒绝响应\
  \ 911 报警电话，直到他们能集结压倒性的增援。穆斯林“缉毒队”进驻社区，提供 24 小时值守，赢得了绝望居民的尊重。⁵⁵\n\n在 Shaw 区，一位名叫小勒罗伊·索普的年轻气盛的咨询邻里专员组织游行，试图关闭社区内的快克屋。与有时会袭击嫌疑毒贩的穆斯林一样，他的行为也常常越界成为私刑。“我会拿根球棒，朝他们脑袋上砸，”索普回忆道，“我当时很粗暴！”另一位\
  \ Shaw 居民则开始纵火烧毁快克屋。“一切都在分崩离析，”社区活动家杰夫·科恩赖希担忧地说，“人们……开始自行执法。”⁵⁶\n\n### *“那个该死的婊子陷害了我”：马里恩·巴里的垮台*\n\
  \n当快克肆虐这座城市时，马里恩·巴里也在与自己的毒瘾作斗争。这位市长在 1970 年代末首次尝试可卡因，并很快成瘾。到 1980 年代中期，巴里再也无法掩饰其影响。他的行为变得反复无常——长时间无故外出、工作日程减少、在公开场合口齿不清——甚至连坚定的支持者也感到担忧。\n\
  \n美国检察官和当地警方早在 1982 年就察觉到他吸毒，但调查人员难以建立可靠的案件。巴里不断智胜他们，掩盖因吸毒过量而就医的急诊记录，并利用他在警察局的关系压制调查。1984\
  \ 年，美国检察官约瑟夫·迪杰诺瓦发现证据，显示一位名叫凯伦·约翰逊的年轻区政府雇员与市长有染，期间她曾二十多次向他出售可卡因，但巴里向大陪审团撒谎，并付钱让约翰逊不与调查人员合作。⁵⁷\n\
  \n执着的迪杰诺瓦决心抓住这位难以捉摸的市长，他扩大了调查范围，不仅寻找吸毒证据，还寻找巴里政府内部的腐败证据。1984 年，巴里的前妻玛丽·特雷德韦尔承认从\
  \ Pride 公司拥有的公共住房项目中窃取了数十万美元。一年后，巴里的长期密友伊万霍·唐纳森承认从未经审计的就业服务部账户中挪用 19 万美元，而分管财政的副市长阿尔·希尔则承认将市政合同定向分配给朋友以换取回扣。⁵⁸\n\
  \n迪杰诺瓦确信市长与这些贪污行为有牵连，于 1987 年 5 月对五个市政机构、与巴里关系密切的少数族裔企业以及巴里朋友和雇员的住所进行了一系列突击搜查。他发现了大量证据，表明巴里及其高级行政人员利用合同制度确保黑人商人（其中许多与市长关系密切）获得数百万美元的市政合同，同时几乎不验证他们提供的服务是否合格。一个臭名昭著的违规者是科尼利厄斯·皮茨，他是巴里自\
  \ 1960 年代以来的盟友。皮茨向市政府收取高昂费用，将无家可归者安置在他那虫害肆虐的皮茨汽车旅馆——1986 年，国会委员会谴责该收容所为全美最昂贵的收容所。⁵⁹\n\
  \n迪杰诺瓦希望通过公开宣布突击搜查并泄露调查人员查获物品的信息，激起公众愤怒，并向巴里市长及其盟友施压，要求他们与联邦当局合作。然而，他反而引发了带有种族色彩的反弹。“迪杰诺瓦在调查白人承包商吗？”一位黑人女商人问道，她指出该市三分之二的业务是与白人承包商合作的，其中许多人也获得了优惠待遇并提供了劣质服务。他没有调查白人承包商。全国各地的许多其他美国检察官也没有。在里根总统任内，联邦调查人员对黑人民选官员以及他们努力引入政府的少数族裔承包商给予了不成比例的关注。《华盛顿邮报》的格温·伊菲尔发现，非裔美国政治家仅占所有民选官员的\
  \ 3%，却在 1980 年代中期联邦腐败调查中占 14% 的嫌疑人。全国的黑人观察人士对这些调查感到警觉，他们认为这些调查是对黑人权力的攻击，而非对腐败的打击。⁶⁰\n\
  \n巴里利用了黑人对联邦政府不成比例调查黑人民选官员的焦虑。他谴责迪杰诺瓦的突击搜查是联邦当局企图“把我赶下台”，并提起诉讼，指控美国检察官泄露调查信息，违反了大陪审团的保密规定。六个全国性黑人政治组织提交了法庭之友书状，声称对巴里的调查是联邦检察官“削弱黑人政治力量”的全国性努力的一部分。⁶¹\n\
  \n关于巴里吸毒的传闻、普遍腐败的指控以及持续的联邦调查，削弱了白人对市长的支持。他于 1978 年以跨种族联盟和自由派白人建制派（包括《华盛顿邮报》）的支持上台，但到\
  \ 1986 年，他只赢得了 25% 的白人选票，而《华盛顿邮报》的编辑们已变成激烈的批评者。随着他的毒瘾恶化，部分市政府职能彻底失灵，他们的批评变成了蔑视。威廉·雷加迪，一本受富裕白人华盛顿人欢迎的月刊商业杂志的出版商，讽刺性地描绘巴里吸食可卡因，并分发印有“对马里恩·巴里说不”的保险杠贴纸。在\
  \ 1989 年的一次城市预算听证会上，密苏里州共和党参议员约翰·丹福斯当面质问市长：“这届政府腐败得令人发指，无能得无可救药。”⁶²\n\n1988 年当选的总统乔治·H·W·布什利用该市的弱点，将其作为其政府禁毒战争的宣传道具。1989\
  \ 年 4 月，总统的“禁毒沙皇”威廉·贝内特公布了一项 8000 万美元的计划，旨在通过大幅增加对街头毒贩和瘾君子的逮捕来打击华盛顿特区的毒品交易——而就在几个月前，警察局长莫里斯·特纳还认为这种方法行不通。贝内特声称，联邦政府介入是因为“地方政府没有以应有的负责任方式行事”。与此同时，与总统关系密切的共和党策略师试图通过争取特纳以共和党人身份参加\
  \ 1990 年市长选举对抗巴里，来软化共和党的种族形象。副总统丹·奎尔主持了一场每人 500 美元的筹款晚宴，总统则邀请这位终身民主党人前往白宫，正式改变其党派归属。⁶³\n\
  \n\n\n\n总统利用该市毒品危机的手段在 9 月达到顶峰，他在黄金时段电视讲话中推出了 78 亿美元的《国家毒品控制战略》。为了强调毒品是“当今美国国内最大的威胁”，布什举起一袋快克可卡因，声称这是联邦特工“在白宫对面公园里缴获”的。这一道具暗示首都华盛顿如此混乱，以至于毒贩竟敢在总统家门口公然交易。（白宫助手在讲话前曾告知总统，毒贩实际上*并不*在拉斐特公园活动，但布什对这个想法如此着迷，以至于缉毒局官员让它变成了现实。他们挑选了来自东南区的\
  \ 18 岁小毒贩蒂莫西·杰克逊，开车带他到公园，完成交易后将其逮捕。杰克逊后来的案件以无效审判告终，因为陪审团团长说：“陪审员们认为这是一个圈套。”）⁶⁴\n\
  \n对于联邦官员来说，华盛顿毒品问题的首要责任人就是市长本人。尽管近五年来几乎不断受到调查，巴里仍未被指控任何罪行，并在黑人选民中广受欢迎。但调查人员正在逼近。1988\
  \ 年 12 月，巴里险些卷入一场针对其朋友兼毒友查尔斯·刘易斯的当地警方“买赃抓人”行动。刘易斯出身于维尔京群岛一个显赫家族，但已陷入困境，被捕后开始与警方合作。他向美国检察官杰伊·斯蒂芬斯提供了一份长长的名单，上面是与市长一起吸食过可卡因的朋友、商业伙伴和旧情人。然而，斯蒂芬斯意识到，仅凭口头证词，陪审团很可能不会判定巴里有罪。他需要市长吸毒的直接证据，并试图通过设置诱捕行动来获取，利用的是少数几个能获得日益谨慎的市长信任的人之一：黑兹尔·戴安娜·“拉希达”·摩尔。\n\
  \n尽管巴里是个好色之徒，但他对摩尔情有独钟。摩尔在东北区一个虔诚的宗教工薪家庭长大，身材高挑、性感迷人，成为顶级模特，1975 年她的面孔曾登上《本质》和《W》杂志封面。然而，她深受毒品困扰，在男友因试图走私可卡因入境被捕后，她的职业生涯一落千丈。1986\
  \ 年遇到巴里时，摩尔身无分文，与母亲同住。市长给了她一份 6 万美元的合同，让她在暑期青年就业项目中教授年轻女性“形象意识”，两人开始了为期两年、充满争吵的恋情，据摩尔说，他们至少“100\
  \ 次”将性、可卡因或快克混在一起。1989 年，她离开华盛顿前往洛杉矶与三个孩子团聚。联邦调查局在那里找到了她，她住在收容所里，因重拾宗教信仰而决心改变，却无法摆脱可卡因毒瘾。她决定通过与联邦调查人员合作来赎罪。“我为自己的决定祈祷，”摩尔说，“我想净化自己。”⁶⁵\n\
  \n计划很简单：摩尔将引诱巴里前往西北区 M 街的维斯塔国际酒店 727 房间，在那里她将给他提供购买和吸食快克的机会，而联邦监控摄像头将全程拍摄。巴里到达后，对性的兴趣大于毒品，最初拒绝了摩尔反复提出的吸食快克的建议。二十分钟后，他暗示愿意购买毒品。摩尔拿了巴里的钱，从一名卧底特工那里购买了价值\
  \ 40 美元的快克，然后交给市长。巴里将快克烟斗放到嘴边，点燃并吸入。联邦特工和当地警察冲进房间，将市长逮捕。难以置信的巴里坐在床上喃喃自语：“那个该死的婊子给我设了圈套。”⁶⁶\n\
  \n诱捕行动的消息传开后，华盛顿的黑人居民既悲伤又愤怒，他们认为巴里的倒台是对许多人与之密不可分的事业的打击。当《洛杉矶时报》采访卡多佐高中的多名学生时，所有人都对市长的虚伪表示愤慨。“他到处宣扬（反毒品信息），”17\
  \ 岁的特蕾西·帕克说，“但他自己却在吸毒。”据《华盛顿邮报》民调，36%的华盛顿黑人居民认为诱捕行动完全是市长的错。然而，稍多一点的 39%的人认为背信弃义的联邦政府和巴里各负一半责任。WOL-AM\
  \ 电台名人凯茜·休斯在诱捕行动后的几天里接听了数千个电话，她指出听众对市长的粗心大意感到震惊，因为他知道联邦官员正在针对非裔美国领导人。“即使这是个圈套，”她争辩道，“你（巴里）也知道他们想给你设套。”另有\
  \ 20%的黑人居民认为“执法官员想尽一切办法要抓住马里恩·巴里。”⁶⁷\n\n巴里这场令人难堪的公开被捕使他成为深夜喜剧演员的笑柄，但市长很快振作起来，组织了一场精彩的辩护。他通过将自己包裹在圣经式的罪恶与救赎故事中，寻求公众同情。在\
  \ 100 名城市牧师的簇拥下，他承认自己有一个未具体说明的“问题”，这让他“直面自己最深的人性弱点”。随后他住进了一家戒毒戒酒康复中心，并开始定期去教堂。在幕后，他试图与检察官达成协议，提议对一项轻罪认罪，这样他就能再次竞选公职。由于拥有视频证据和十名愿意作证曾与巴里一起吸食可卡因的证人，美国检察官斯蒂芬斯自信能够确保多项重罪指控，因此拒绝了市长的请求。⁶⁸\n\
  \n然而，巴里比斯蒂芬斯更了解该市的黑人选民。正如他在 1990 年审判前所说：“只需要一个陪审员说‘我不会给马里恩·巴里定罪。不管你们怎么说。’”他和他的律师将所有精力都放在争取那一个陪审员上，通过将政府置于审判席。“多年前，政府就决定要拿下马里恩·巴里，”辩护律师\
  \ R·肯尼思·芒迪在开庭陈述中声称，“并且会不择手段、不惜一切代价来抓他。”⁶⁹\n\n辩护方指控政府存在阴谋，因为他们知道华盛顿的黑人社区对联邦检察官针对黑人领导层进行调查的想法特别敏感。自\
  \ 1987 年以来，联邦官员已对七个州（包括马里兰州、纽约州和佛罗里达州）最有权势的黑人当选和任命官员提出指控或泄露调查信息。这些官员中的许多人前往华盛顿向司法部提出抗议，并经常出现在当地教堂、黑人广播节目和抗议集会上。许多华盛顿黑人——包括那些在政治上反对市长的人——都像全国有色人种协进会执行主任本杰明·胡克斯一样担心，司法部“过分强调骚扰黑人当选官员”。⁷⁰\n\
  \n\n\n\n\n辩方的说法得到了大约一半陪审员的认同，审议从一开始就陷入僵局。由五名中年工薪阶层黑人陪审员组成的小组完全归咎于政府。“他们就是要搞垮马里恩·巴里，”哥伦比亚特区惩教局秘书瓦莱丽·杰克逊-沃伦说。“我对此深信不疑。”经过八天令人精疲力竭的辩论，另一组由五名较年轻的非裔美国人和两名白人陪审员组成的反对派未能动摇他们的立场。最终，他们达成妥协：陪审员将判定巴里一项轻罪成立，另一项轻罪不成立，其余指控则放弃。8\
  \ 月 10 日，当他们宣布判决时，市长露出了灿烂的笑容，法院外他的支持者们爆发出“巴-里！巴-里！”的欢呼声。他躲过了一劫。⁷¹\n\n然而，巴里的政治前途依然阴云密布。他错过了民主党初选的报名截止日期，但以独立候选人身份注册，并加入了竞争激烈的全市议会席位角逐。竞选期间，由里根任命的法官托马斯·彭菲尔德·杰克逊——他双下巴、贵族气派，毫不掩饰对辩方策略的不满——判处巴里六个月监禁。对于持有毒品的轻罪而言，这是一项严厉的刑罚，其根源在于杰克逊认为巴里“向整个毒品文化提供了帮助、安慰和鼓励”。（尽管巴里的辩护者对杰克逊的逻辑嗤之以鼻，但雷富尔·埃德蒙在伊利诺伊州马里恩的联邦监狱中也提出了类似的观点。“有太多人在外面说‘毒品有害’，而他们自己却在吸毒，”他争辩道，“就像马里恩·巴里一样。”）杰克逊的判决也暴露了他对年长黑人陪审员的蔑视，他后来声称这些人“在任何情况下都不会定罪”。⁷²\n\
  \n巴里希望黑人选民对判决的不满能推动他的竞选，但选民们清醒地认识到市长患有严重的药物滥用问题，这抵消了他们的愤怒。11 月，选民们让他遭遇了唯一一次选举失败。几周后，巴里前往监狱服刑，他在特区政治中的生涯似乎就此终结。⁷³\n\
  \n### “新季节”：特区在新市长领导下挣扎\n\n莎伦·普拉特·迪克森相信她能够重振“巧克力城”的希望。她是华盛顿第三代居民，出身于城市浅肤色精英阶层，在华盛顿黑人聚居区的边缘长大，随着城市向非裔美国人购房者开放，她从勒德罗伊特公园向北迁移。1961\
  \ 年，她以优异成绩从刚刚废除种族隔离的罗斯福高中毕业，随后进入霍华德大学学习政治学。她漂亮而娇小——身高只有五英尺二英寸——迪克森曾希望成为一名演员，但她的父亲，一位杰出的法学家，说服她进入霍华德法学院。在那里，她遇到了阿林顿·迪克森并与之结婚，后者在妻子的帮助下于\
  \ 1968 年进入特区政坛，并在十年内升任华盛顿特区议会主席。\n\n聪明、自信且充满干劲——她曾表示自己打算“像任何男人一样走得远、做得多、赚得多”——迪克森并不满足于做丈夫的幕后顾问。1976\
  \ 年，她开启了自己的政治生涯，赢得了民主党全国委员会特区代表的职位。作为沃尔特·方特罗伊组织的一员，她名义上与马里恩·巴里结盟，但像许多上层黑人华盛顿人一样，她对这位粗鲁的暴发户不屑一顾。1982\
  \ 年，她管理了朋友帕特里夏·罗伯茨·哈里斯试图推翻这位弱势在任者的不幸竞选。哈里斯落败后，迪克森专注于全国舞台，于 1984 年成为民主党全国委员会财务主管。⁷⁴\n\
  \n但随着城市失控，迪克森带着自己看似不可能的市长竞选重返地方政治。她宣扬自己的局外人身份，并承诺“用铲子而不是扫帚来打扫房子”，迪克森迎合了许多居民迫切希望摆脱巴里时代的愿望。《华盛顿邮报》的有力支持帮助迪克森赢得了多数白人选民的支持，并推动她在\
  \ 1990 年民主党初选中以微弱优势获胜。随后，她在 11 月的大选中击败了共和党对手，成为首位领导美国主要城市的非裔美国女性。⁷⁵\n\n迪克森在 1991\
  \ 年 1 月的就职典礼上宣布，这是特区政治的“新季节”。一群雄心勃勃的改革者扫除了一代民选官员，包括马里恩·巴里和沃尔特·方特罗伊——后者在民主党市长初选中排名垫底。接替他担任特区在众议院无投票权代表的是埃莉诺·霍姆斯·诺顿，一位受人尊敬的律师、民权活动家和卡特政府资深人士，此前从未担任过地方公职。⁷⁶\n\
  \n迪克森利用这种乐观情绪来应对城市的经济困境。她上任时，美国正处于房地产衰退之中，这摧毁了特区最重要的私营产业。主要依赖房地产的城市税收大幅缩水。由于自 1985\
  \ 年以来国会拨款因对巴里的无声抗议而被冻结，该市出现了 3 亿美元的预算缺口。迪克森上任头两个月的大部分时间都在联系她在民主党全国委员会的人脉，并游说国会山的立法者。国会对她这位干练专业的迪克森印象深刻——与她前任形成鲜明对比——因此将年度拨款增加了\
  \ 2 亿美元，并额外拨款 1 亿美元紧急资金以弥补预算缺口。她也从议会那里得到了同样热情的接待，议会批准了超过 4 亿美元的额外借款，并授予迪克森绕过公务员制度规则以解雇表现不佳的城市雇员的权力。⁷⁷\n\
  \n她领导能力的第一次真正考验出现在 1991 年 5 月，当时骚乱在一个意想不到的地方爆发：多元化、兼收并蓄的芒特普莱森特-亚当斯摩根社区，这里被广泛视为城市的熔炉。20\
  \ 世纪 80 年代，该社区吸收了数千名逃离残酷内战的萨尔瓦多人，他们在此定居，使该市的拉丁裔人口几乎翻了一番。这些新移民大多年轻、男性且贫穷，挤在破旧拥挤的公寓里，每天出来做餐厅服务员、清洁工和建筑工人——这些工作历来由非裔美国劳工承担。该地区整整一半的拉丁裔家庭有四口或更多人口，年收入不到\
  \ 2 万美元。由于许多移民没有合法身份文件，他们无法投票，巴里政府也对他们视而不见。仿佛卡洛斯·罗萨里奥（于 1987 年去世）从未存在过。由于难以获得政府服务，且集中在经济中最脆弱的部门，他们受到\
  \ 1990 年经济衰退的严重打击。⁷⁸\n\n当失业的萨尔瓦多男性挤满社区公园等待工作或社交时，他们更早定居的黑人和白人邻居开始将他们视为异类和威胁。“醉汉经常糟蹋社区，把它当厕所，骚扰女性，折断该地区的树苗，把老人和孩子吓出公园，还互相拔刀或棍棒，”一位前社区咨询委员会委员抱怨道。警察中很少有人会说西班牙语，他们驱赶公园里闲逛的人，经常对不懂英语的人粗暴对待。以非裔美国人为主的警察与萨尔瓦多社区之间的紧张关系急剧升级。⁷⁹\n\
  \n\n\n\n丹尼尔·恩里克·戈麦斯深知这些紧张局势。戈麦斯于 1989 年从祖国萨尔瓦多来到华盛顿特区，并在乔治城万豪酒店找到了一份洗碗工的工作。下班后，他会拿上一瓶酒，在第十七街和拉蒙特街拐角处的一个小公园里与朋友们聚会。1991\
  \ 年 5 月 5 日，一个温暖的周日傍晚，戈麦斯和三个朋友喝得酩酊大醉，此时警官安吉拉·朱厄尔和格丽塞尔·德尔瓦莱以公共场合醉酒为由传唤他们。这几人拒捕，在随后的扭打中，朱厄尔开枪击中了戈麦斯的胸部，使其身受重伤。⁸⁰\n\
  \n一名黑人警察开枪打死了一名萨尔瓦多男子（有人声称他是在被铐上手铐时被枪杀的）的谣言在拉丁裔社区中迅速传播。愤怒的居民聚集在芒特普莱森特街上，数百名增援警察匆忙赶到现场。夜幕降临时，旁观者开始向防暴警察人墙投掷瓶子和石块。一群群年轻人在芒特普莱森特商业街上横冲直撞，焚烧警车、砸碎窗户并抢劫。尽管被暴力事件吓坏了，许多居民还是忍不住表示同情。“他们是在捍卫自己的权利，”芒特普莱森特居民贝亚·罗德里格斯坚持说道。“如果你住在这里，你会看到很多警察滥用职权的行为。”⁸¹\n\
  \n市长迪克森以她冷静、富有同情心的态度应对这场骚乱，赢得了公众的信任。她指示警察局长艾萨克·富尔伍德控制而非对抗骚乱者，这一举措后来被认为拯救了生命并最大限度地减少了骚乱的范围。没有人受重伤，财产损失仅限于芒特普莱森特和哥伦比亚路商业街。警方逮捕了\
  \ 230 人，并在第二天晚上控制了暴力事件。连续几天，迪克森都出现在社区中，与警方商议、与拉丁裔领袖会面，并走在芒特普莱森特街上与居民交谈。她处理骚乱的方式赢得了来自不同背景的居民以及华盛顿特区议会的赞扬。“市长迪克森在（骚乱期间）在我眼中成长了许多，”议员弗兰克·史密斯说道，他的选区包括了骚乱区域。⁸²\n\
  \n![Image](img/f0001-25.jpg)\n\n*1991 年 5 月，一名黑人警察开枪打伤了一名手无寸铁的萨尔瓦多男子，引发了芒特普莱森特持续三天的骚乱。拉丁裔领袖指责该市的黑人领导层一贯忽视拉丁裔居民的需求。里克·莱因哈德摄。*\n\
  \n拉丁裔社区活动人士则不那么印象深刻。芒特普莱森特骚乱激发了一代新的拉丁裔领导层，并点燃了一种新的自信，将注意力集中在该市由黑人领导的政府与快速增长的拉丁裔社区之间的不良关系上。拉丁裔占华盛顿特区居民的\
  \ 5%以上，但在市政工作人员中占比不到 1%，而市政官僚机构在提供西班牙语服务方面做得也很差。拉丁裔领袖要求获得公平份额的城市资源。长期社区领袖比阿特丽斯·奥特罗呼吁“公平和平等”，而年轻的活动人士则采取了更激进的语气。佩德罗·阿维莱斯是骚乱后成立的伞式组织“华盛顿特区拉丁裔民权工作组”的主席，他的警告听起来很像一代人之前的年轻黑人权力活动家：“除非这些问题得到全面解决，否则我们仍有可能再次发生类似的骚乱。”⁸³\n\
  \n骚乱后，市长迪克森承诺向拉丁裔社区开放政府，认为华盛顿特区的黑人必须拥抱一种包容性的社会正义愿景，解决所有形式的排斥和歧视，而不仅仅是针对黑人社区的歧视。她承诺重振拉丁裔事务办公室，并通过改革让西班牙裔居民在城市事务中拥有一定的权力和影响力。\n\
  \n然而，在经济衰退的背景下，迪克森的举措遭到了黑人社区内部的强烈反对。一些人完全拒绝了拉丁裔的要求。“如果（拉丁裔）不欣赏我们的国家，那就滚出去，”议员 H.R.克劳福德厉声说道。另一些人则试图保护其选民的利益。“我相信拉丁裔社区有权获得公平份额的城市合同和服务，但我不会允许这以牺牲非裔美国人社区为代价，”议员威廉·莱特富特断言。迪克森的举措停滞不前。到她任期结束时，拉丁裔仅占城市工作人员的\
  \ 1.7%，许多机构仍然没有翻译人员，而拉丁裔活动人士在资金紧张的议会考虑取消拉丁裔事务办公室时，在市政厅前举行抗议。⁸⁴\n\n迪克森未能为西班牙裔社区带来有意义的改革，这反映了她的整个政府所面临的困境。她直率的作风和局外人身份在竞选活动中曾是一种优势，但上任后却成了障碍。迪克森时而害羞时而粗暴，让那些习惯了巴里擅长的握手和交易政治的选民感到反感。她不习惯被质疑，要求媒体对她进行正面报道，并在记者提出尖锐问题时指责他们有种族主义和性别歧视。为了清除市政厅里的巴里亲信，她解雇了所有高级行政官员，抹去了多年的机构知识。取而代之的是一群不起眼的政治新手和法学院的老同学，他们中很少有人具备管理一个处于危机中的政府所需的专业知识或经验。⁸⁵\n\
  \n各个种族的选民很快对市长迪克森感到失望。她发誓要通过解雇 2000 名中层管理人员来消除“臃肿”，这一承诺被许多黑人居民解读为对他们利益的攻击。《华盛顿邮报》专栏作家考特兰·米洛伊称迪克森的计划是对“华盛顿黑人中产阶级心脏”的残酷“砍伐”，旨在“给国会山上一些不感兴趣的白人留下印象”。迪克森在发出解雇通知时犹豫不决，这激怒了那些期望她清理官僚机构的白人支持者。她最终兑现了承诺，但过程草率，而且几乎完全是通过退休和买断来实现的，而不是解雇表现不佳的员工。这场争议打击了士气，本已糟糕的城市服务进一步恶化。到她上任第一年年底，超过一半的华盛顿特区黑人居民对她的表现表示不满。⁸⁶\n\
  \n随着华盛顿经济形势恶化，市长凯利——她于 1991 年 12 月与纽约商人詹姆斯·凯利三世结婚后改了姓——的运势持续下滑。到 1992 年底，她宣布未来两年预计将出现十亿美元的赤字，并警告将提高税收、裁员以及“完全取消某些服务”。由于无法平衡预算甚至减缓赤字增长，她将责任归咎于华盛顿特区的税收和治理结构。她认为，唯一的长期解决方案是通过成为一个州来“决定我们自己的经济道路”。然而，凯利对建州的支持并不仅仅是为了转移居民对她政治问题的注意力的绝望策略。尽管华盛顿特区存在暴力、政治动荡和经济困境，但\
  \ 20 世纪 90 年代初似乎是推动建立“新哥伦比亚州”的有利时机。\n\n### *“腐败与犯罪的自由主义堡垒”：推动华盛顿特区建州*\n\n\n\n\n\
  建州运动源于朱利叶斯·霍布森 1970 年竞选无投票权代表的活动，但在这位脾气暴躁的市议员于 1977 年因癌症去世后陷入停滞。然而，当创造性非暴力社区创始人埃德·吉南以倡议形式将其列入\
  \ 1980 年选票时，这一问题意外地获得了新生。吉南未与自决运动中的任何人商议，便起草了一份建州提案，要求分四步走：就建州问题进行赞成或反对投票、选举 45\
  \ 名代表参加制宪会议、将宪法提交选民批准、最后向国会申请以第 51 州身份加入联邦。这一过程既非正统又繁琐，但吉南相信它能建立一个密集的基层活动家网络，从而取代建制派领袖，并赋予公民权力以解决华盛顿特区最紧迫的需求。⁸⁷\n\
  \n对吉南倡议的支持并不热烈。选票问题虽然以 85,487 票对 57,580 票的微弱优势获胜——但这远非当地对建州的一致支持。反对声音在第三选区最为强烈，那里支持《华盛顿特区投票权修正案》的团体（如妇女选民联盟）与担心黑人政府不受国会监督的白人居民联合起来，反对该措施。⁸⁸\n\
  \n建州运动取代了那些人脉广泛的民选官员、说客和民权活动家，他们此前主导着当地的自决运动。这些资深活动家对吉南的策略不以为然，因此当《华盛顿邮报》的汤姆·舍伍德所称的“一群自由派社区活动家、少数民选或任命官员以及零星的政治无名小卒”宣布参加\
  \ 1982 年 1 月制宪会议的 45 个代表席位时，他们袖手旁观。市长巴里甚至懒得推出一批代理人。像市议员大卫·克拉克和前学校董事会成员查尔斯·卡塞尔这样经验丰富的民选官员，在获得代表席位的政治无名小卒海洋中极为罕见。尽管社区、媒体和市政官员缺乏兴趣，代表们还是在邓巴高中聚集召开制宪会议，并在短短\
  \ 90 天内为新哥伦比亚州起草了一份宪法草案。⁸⁹\n\n该文件提出了一系列通常由立法者处理的政治和社会立场。它保障充分就业、同性恋权利和生活工资，保护公共工人的罢工权，呼吁公用事业公有化，捍卫平权行动的合法性，并扩大被指控犯罪者的权利。代表菲利普·施拉格承认，这份宪法草案既是“政府结构形式的纲要，也是一份社会改革宣言”。制宪会议主席查尔斯·卡塞尔称其为“这个国家历史上……最进步的官方州级文件”。⁹⁰\n\
  \n然而，大多数当地政治精英拒绝了这一努力。华盛顿特区共和党和贸易委员会谴责其经济条款，而《华盛顿邮报》和《华盛顿星报》声称其密集的社会条款将注定在国会面前失败。就连十年前曾概述建州理由的《进步评论》激进白人编辑萨姆·史密斯也质疑，为什么代表们不直接复制另一个州的宪法，而“把新世界秩序留到以后”。选民也有类似的疑虑，只有\
  \ 53%的人投票赞成该宪法。1983 年 9 月，市长巴里将宪法草案提交国会，华盛顿特区代表沃尔特·方特罗伊称其“在佛罗里达的七月里像雪球一样机会渺茫”。卡塞尔对方特罗伊的轻视感到恼火，但他承认建州势力在\
  \ 535 名国会议员中只能算上 3 名支持者。该草案从未进入投票表决阶段。⁹¹\n\n如果不是美国最杰出的黑人政治家杰西·杰克逊的介入，建州理念可能早已深埋于国会腹地。杰克逊是来自南卡罗来纳州的浸信会牧师，拥有强大的气场和全国性的支持者网络。他在与沃尔特·方特罗伊共同参与南方基督教领袖会议时，首次了解到华盛顿特区缺乏自决权。1978\
  \ 年，他协助方特罗伊推动《华盛顿特区投票权修正案》运动，并在 1984 年和 1988 年主导了该市的民主党总统初选。在 1988 年民主党全国代表大会上，他成功将支持建州的纲领写入政党平台，这是两大政党首次这样做。杰克逊经常在华盛顿特区游说国会或参加全国性活动，对这座城市产生了深厚感情，以至于他在莱德罗伊特公园\
  \ T 街 400 号街区购买了一栋木板封住的房子（紧邻前市长沃尔特·华盛顿）。⁹²\n\n在 1988 年总统竞选失败后，杰克逊曾考虑竞选华盛顿特区市长——马里恩·巴里曾嘲讽道：“杰西除了动嘴皮子，什么都不想管”——但他担心领导一个“被占领的城市”会使他在政治上变得脆弱，并削弱他的“全国影响力”。相反，他寻求一个民选职位，以便能自由地维持其全国民权领袖的角色。他认为自己在华盛顿特区的影子参议员职位上找到了答案，这是\
  \ 1980 年建州倡议所要求的一个模糊职位，但市议会从未安排过选举。他希望利用这一职位领导一场高调的华盛顿特区建州运动，于是施压市议会举行选举，随后在 1990\
  \ 年 3 月的竞选中占据主导地位。⁹³\n\n尽管杰克逊人气很高，但他在推动建州时发现国会中的民主党人态度冷淡，而共和党人则公开敌视。经过两年的游说，只有 31\
  \ 名参议员同意支持由马萨诸塞州民主党人爱德华·肯尼迪提出的建州法案。其中只有一人（宾夕法尼亚州的阿伦·斯佩克特）是共和党人。⁹⁴\n\n该法案面临一场由“公民反对华盛顿特区建州联盟”协调的全国性草根反对运动，该联盟是一个保守派政治行动组织的分支，该组织后来因攻击竞选财务改革法而声名鹊起。该联盟由共和党活动家弗洛伊德·布朗创立，他曾是\
  \ 1988 年总统大选中臭名昭著的威利·霍顿广告的创作者。该联盟将华盛顿特区建州与支持共产主义领袖菲德尔·卡斯特罗、阿拉伯恐怖分子以及“黑人穆斯林仇恨煽动者”联系起来。新兴的保守派媒体也助长了反对建州的声势。由统一教会的文鲜明牧师于\
  \ 1982 年创立的毫不掩饰右翼立场的《华盛顿时报》，发表了几篇来源可疑的文章，将杰克逊描绘成暴躁且自以为是的人，而保守派脱口秀主持人阿姆斯特朗·威廉姆斯则在当地\
  \ WOL 广播电台以黑人反对建州者的身份成名。⁹⁵\n\n\n\n\n与 1978 年的投票权修正案不同，自决活动家们组织松散，且影响力未能超出城市范围。独立团体“新哥伦比亚公民”举办了抗议、听证会、纪念活动及信息宣传，但未能影响国会议员。尽管有明确迹象表明建州法案不会通过，代表埃莉诺·霍姆斯·诺顿仍坚持要求投票。1993\
  \ 年 11 月 21 日，众议院以 277 票对 153 票否决了该法案。没有一位共和党人支持该法案。“哥伦比亚特区，这个腐败与犯罪的自由主义堡垒，甚至远未达到建州的要求，”得克萨斯州共和党人汤姆·迪莱指责道，“[国会]应当收回对该城市的控制权，并加以整顿。”⁹⁶\n\
  \n愤怒的杰克逊将法案的失败归咎于民主党领导层，而诺顿和“新哥伦比亚公民”则竭力为结果涂上积极色彩，辩称这次建州投票——该市历史上的首次——本身就是一场胜利。法案失败后，杰克逊退出了华盛顿特区。1995\
  \ 年 12 月，他宣布不再寻求连任影子参议员，并将返回芝加哥。他离开后，建州力量陷入混乱。这些力量本就组织松散、资金短缺，如今失去了唯一一位拥有全国知名度并能获取大量资金和支持的领军人物。⁹⁷\n\
  \n自 1978 年华盛顿特区投票权修正案通过以来的十五年间，反对特区建州已成为保守派的信条，而全国民主党人则态度暧昧。认识到这场斗争几乎无望，那些曾领导特区自决运动长达一代人之久的经验丰富的战略家和全国性人物放弃了这一事业，将战场留给了一群由业余人士、梦想家和煽动者组成的乌合之众。\n\
  \n### *“向当权者竖中指”：巴里的凯旋归来*\n\n在建州斗争如火如荼之际，马里恩·巴里重新出现在华盛顿特区的政治舞台上。这位所谓的“终身市长”从未认真考虑过离开政坛，尽管他曾被关押在宾夕法尼亚州洛雷托的一所联邦监狱。从入狱第一天起，巴里就通过电话联系老竞选团队，评估自己的机会，并策划复出。在阿纳科斯蒂亚联合圣殿浸信会的威利·威尔逊牧师和前助手桑德拉·艾伦等支持者的帮助下，巴里在\
  \ 1992 年 4 月获释时已精心策划好了重返特区政治的步骤。一支由六辆大巴和一辆豪华轿车组成的车队在监狱附近的一家汽车旅馆迎接巴里。大约三百名挥舞着海报的支持者高唱“胜利属于我们”，并在巴里宣称“我出狱后变得更好，而非更痛苦”时欢呼雀跃。三个月后，他宣布竞选第\
  \ 8 选区的市议会议席。⁹⁸\n\n第 8 选区是巴里作为政治家重生的理想之地。它夹在乔治王子县和阿纳科斯蒂亚河之间，是特区最南端的辖区，涵盖了过去被称为“远东南”的区域。居民贫困——22%的人生活在贫困线以下，而白人占多数的第\
  \ 3 选区这一比例仅为 3%——且设施匮乏，该选区近七万居民只有一家杂货店。该地区婴儿死亡率全市最高，并在全国最暴力的城市区域之一中占据了不成比例的伤亡份额。第\
  \ 8 选区超过 80%的居民是黑人，他们感到孤立、被忽视、恐惧和愤怒。⁹⁹\n\n自 1976 年以来，第 8 选区在特区议会的代表是威尔海米娜·罗拉尔克，一位好斗的律师和自治活动家，曾协助协调沃尔特·方特罗伊成功驱逐南卡罗来纳州种族隔离主义众议员约翰·麦克米伦的行动。罗拉尔克和她的丈夫卡尔文（《华盛顿信息报》出版商及联合黑人基金创始人）长期以来一直是巴里的盟友，但在\
  \ 1990 年巴里被捕后与他决裂。巴里没有忘记这一侮辱，不过他瞄准罗拉尔克主要是因为认为她在政治上软弱。¹⁰⁰\n\n巴里选择第 8 选区还因为它完美契合了他的救赎叙事和政治风格。第\
  \ 8 选区大约一半的黑人男性被监禁或正在接受刑事司法系统处理，其中大多数与毒品犯罪有关，而巴里将自己塑造成一位前瘾君子和囚犯，了解他们的挣扎。据威尔逊牧师称，巴里是“一个罕见的人，这个社区的每个人都能与他产生共鸣，因为他们都曾经历过同样的处境——进过监狱、惹过麻烦、遭受过压迫，就像他一样。”巴里满足了选区居民对认可和尊重的渴望。整个竞选期间，他脖子上挂着一条绣有“第\
  \ 8 选区，无与伦比”字样的肯特布。尽管他实际上是在反对他自己曾实施的大规模监禁和忽视政策，但他的信息引起了共鸣。该市的政治精英们纷纷过河支持罗拉尔克，但他们的努力徒劳无功。巴里以三比一的优势击败了她。¹⁰¹\n\
  \n巴里着眼于重新夺回市长职位，从未停止竞选。一旦进入特区议会，他便将精力集中在一些有时无望但在全市范围内具有政治吸引力的问题上，这些问题为他打开了新选民群体的大门。他还通过扩大选民登记行动（这对他在\
  \ 1992 年的胜利至关重要）来重塑选民结构，使其对自己有利。周复一周，一支自称“第 54 战斗队”（取自电影《光荣》中描绘的黑人内战军团）的巴里竞选工作人员流动小组，在第\
  \ 6、7、8 选区的住房项目和联排别墅中穿梭，寻找任何未登记的选民并恳求他们注册。到选举日，志愿者们已为选民名册增加了数万名新选民，将全市登记率推至 79%的历史新高。对巴里来说，也许最重要的是，这一努力抹平了富裕的西部选区相对于贫困的东部选区的巨大优势。¹⁰²\n\
  \n与此同时，华盛顿继续陷入混乱。1990 年至 1993 年间，每年谋杀案超过 440 起。由于害怕报复性杀戮，大多数居民不再与普遍被认为无能和腐败的警察队伍交谈。1993\
  \ 年，113 名警官因从为毒贩担任有偿保安到协助谋杀等各种罪名被起诉。警察部门的崩溃反映了市政府整体的恶化。¹⁰³\n\n被暴力吓坏、对政府失灵感到厌倦的人们，有能力者纷纷迁往郊区——1990\
  \ 年至 1994 年间，有 3.7 万居民（其中大多数是黑人和中产阶级或工人阶级）离开了华盛顿特区，几乎是前四年离开人数的两倍。失去了他们的税收，城市债务进一步加深。到\
  \ 1994 年底，预计赤字超过 7 亿美元。华盛顿的糟糕状况以及市长凯利对此无能为力，导致她的不支持率高达 67%，从而断送了她连任的机会。¹⁰⁴\n\n\n\
  \n\n在政治真空中，重振旗鼓的马里恩·巴里出现了，他利用大量新登记的选民推动了自己 1994 年的市长竞选。除了推动他华盛顿特区议会竞选的信仰与救赎的振奋主题外，他还加入了种族诉求：别让白人挑选你们的领袖。他猛烈抨击《华盛顿邮报》对其主要对手、黑人议员约翰·雷的支持，并利用雷在西部选区的高支持率将其描绘成白人的候选人。令全国政治评论家惊讶的是，巴里轻松赢得了民主党初选。甚至许多中产阶级黑人选民也支持这位现任市长。“我投票给巴里是为了向当权者竖中指；让他们知道，即使在中产阶级中，也存在明显的黑人愤怒，”非裔美国律师伦纳德·奈特解释道。¹⁰⁵\n\
  \n选票严格按种族和地理界线划分。在以白人为主的第三选区，对巴里的支持率几乎微乎其微——17333 张选票中仅有 586 张——而在第八选区，他以四比一的优势获胜。当记者问他有什么话要对反对他的白人选民说时，巴里厉声说道：“接受现实吧。不管你们有什么个人心结，都放下吧。”他们不会放下。初选后不久，一位居民发起了“自由第三选区”运动，收集签名试图将该地区重新划归马里兰州。他的大多数邻居选择了跨党派投票，在大选中支持共和党人卡罗尔·施瓦茨。这些白人民主党人（以及相当数量的中产阶级黑人选民）将施瓦茨的得票率推高至\
  \ 42%，这是自现代地方自治开始以来共和党人获得的最高得票率。¹⁰⁶\n\n当巴里重返市长办公室时，这座城市发现自己正任由日益敌对的国会摆布。1994 年 11\
  \ 月，美国选民将众议院交给了共和党，这是四十年来首次，许多反对华盛顿特区自决的议员被提升到国家领导职位，包括众议院议长纽特·金里奇和多数党党鞭汤姆·迪莱。为了先发制人，防止国会接管并设定任何政府重组的条件，巴里在上任后几周内宣布该特区负债\
  \ 7.22 亿美元。为避免破产，他请求联邦政府接管包括法院和监狱在内的基本城市服务，并向该市提供 2.5 亿美元援助以弥补医疗补助的超支。作为回报，他承诺削减预算并解雇市政工人。¹⁰⁷\n\
  \n巴里以反抗的措辞阐述了他的计划，认为地方自治制度从一开始就存在缺陷：“如果我们被当作一个半奴隶半自由的领土对待，我们就不应该支付自由人应付的代价。”许多黑人市民为巴里的反抗姿态欢呼。“我们经常谈论特区在共和党统治下如何像一个种植园，”东北区居民弗雷德·库珀表示。“我们欣赏巴里的一点是，他拒绝充当监工。”¹⁰⁸\n\
  \n然而，国会议员直接拒绝了这些条件，反而要求以丧失自决权换取联邦援助。就像 1874 年剥夺市民选举权时一样，通常行动迟缓的立法机构以令人瞠目的速度处理特区的财政问题。1995\
  \ 年 4 月，国会通过立法设立了一个财务控制委员会，负责监督特区预算，对特区机构行使管理权，并对地方法规拥有否决权。比尔·克林顿总统签署该法案后，议员凯文·查沃斯评论道：“对特区来说，这是悲伤的一天。”¹⁰⁹\n\
  \n记者科乔·纳姆迪回忆道，当黑人活动家于 20 世纪 70 年代末进入政府时，“我们并不想按照白人的方式经营企业或政府。我们寻求的是以更高的诚信水平来管理政府的机会。”在某些方面，他们成功了。他们改变了城市政府的本质，使其脱离联邦官僚机构，更能代表城市多元人口。他们还重新分配了财富，通过公共就业和市政合同建立了一个庞大的黑人劳动阶级和中产阶级。¹¹⁰\n\
  \n然而，许多特区居民寄予厚望的那个人最终让他们失望了。巴里市长在任时间越长，就越采用大城市政治机器特有的治理方式。他与大型开发商关系密切，利用公共项目购买政治忠诚，而他的几位助手和朋友则利用混乱的官僚体系和市政承包制度中饱私囊。其他大城市也经历过类似的贪污，但巴里的过失被一个敌对的全国性保守运动放大了，该运动在他大部分任期内主导白宫，并将这座城市作为黑人民主党腐败和功能失调的象征。\n\
  \n巴里的失败使他整个政治生涯中一直努力帮助的那些人更容易受到可卡因流行的冲击。随着暴力事件激增和城市服务恶化，最需要帮助的居民受害最深，华盛顿特区濒临破产边缘。到\
  \ 20 世纪 90 年代中期，巴里及其活动家圈子——如今已是头发花白的政治老手——艰难地维持着一个大打折扣的地方自治版本。巧克力城曾经的广阔希望和承诺已不复存在。\n\
  \n## 第十四章\n\n## 滚回家去吧，有钱的白人\n\n### 华盛顿变得更富裕、更白，1995–2010 年\n\n哦，白人！白人出现在我的街道上。我真不敢相信。\n\
  \n——桑德拉·西加斯，2009 年\n\n华盛顿特区的唐人街位于西北区 H 街 600 号街区，就像一个亚洲主题的时代广场——中国文化与消费资本主义令人头晕目眩的混合体。从第七街和\
  \ H 街的地铁站出来，游客进入一个粗糙仿造的宝塔，宝塔上装饰着巨大的视频广告牌，闪烁着从手机到汽车的各种广告。几步之遥，横跨 H 街的是友谊拱门，这是一座建于\
  \ 1986 年的镀金、60 英尺高的传统中式牌楼。每家店铺都装饰着汉字，街灯形似中国灯笼，十二生肖图案嵌入人行道。这里购物、餐饮和电影院一应俱全，已成为某种市中心的购物中心。街头艺人与黑人希伯来以色列人争抢着人行道空间，人行道上挤满了饥饿的上班族、好奇的游客和闲逛的高中生。然而，在这拥挤的人潮中，有一群人明显稀少：中国人。\n\
  \n唐人街曾是一个虽小但稳定的社区，最初位于西北区宾夕法尼亚大道南侧第三街与第四半街之间，如今那里坐落着国家美术馆东馆。19 世纪 90 年代，中国商人在该地区购买了六栋建筑，开设了餐馆和出售进口商品及古玩的商店。这些商店狭小破旧，堆满箱子，弥漫着香和茶的气味，白天大多很安静。然而，到了晚上和周日，这个街区就热闹起来，因为中国洗衣工——1900\
  \ 年华盛顿特区 400 多名华人居民中只有三四个女性和不超过 15 个儿童——聚集到这里购物和社交。¹\n\n\n\n\n华人人数不多，且与当地公使馆所代表的某个外国有所关联，因此他们受到的待遇与黑人邻居不同，与白人社区也有所区别。市政官员通常将华人社区视为一种无害的奇观，认为它为国家首都增添了异国情调和重要的劳动力。当地报纸经常评论华人居民的节俭和勤劳，同时向读者保证，华盛顿特区没有那些据称是其他更大唐人街特色的“臭名昭著的罪恶巢穴”（鸦片馆）。\n\
  \n在华盛顿特区，为数不多的华人儿童没有像南方其他地方那样进入黑人学校，而是进入了白人学校，在那里他们常常成为人们好奇着迷的对象。“一些（白人）家长愚蠢地宣称他们应该属于有色人种学校，”《华盛顿邮报》在\
  \ 1893 年首批华人学生入学时报道说，“但所有人……都被他们明亮的面孔和迷人的举止所征服。”随着这一先例的建立，亚裔学生一直就读于白人学校，直到 1954\
  \ 年学校废除种族隔离。华盛顿特区的白人通常不担心这种融合会带来负面后果，也许是因为他们相信，正如《星报》的 E.C.科恩在 1927 年所写的那样，“华人的同质性排除了他们被同化的任何可能性，无论在哪里，东方人永远都是东方人。”²\n\
  \n在城市更新中西南区被摧毁的二十年前，华人经历了他们自己痛苦的流离失所。当联邦立法者着手改造国家广场和联邦三角区时，特区专员计划在宾夕法尼亚大道 300 号街区建造一个市政中心。他们迫使唐人街的商人出售土地，拆迁工作于\
  \ 1931 年开始。“风景如画的唐人街，拥有茶馆、古色古香的商店和东方神秘气息，四十年来对西方方式和习俗无动于衷，最终向西方进步低头，”《华盛顿邮报》写道。市政府没有为商人的搬迁做出任何安排，随着推土机的开进，居民们四散而去。³\n\
  \n但华人居民组织成了一个由家族、商业和慈善协会组成的密集网络，并在安良工商会的领导下，秘密购买了西北 H 街 600 号街区的一系列店面。尽管附近的德裔犹太商人和房主试图阻止他们所谓的“华人入侵\
  \ H 街”，但仍有近十几家企业搬迁并建立了一个新的唐人街。随着带着中国“战争新娘”回国的退伍军人的加入，该社区在二战后的几年里达到了顶峰，成员人数激增至约 1500\
  \ 人，并沿着 H 街向东、向西延伸，向北一直延伸到马萨诸塞大道。这个社区成为城市生活的重要组成部分。来自各种背景的居民都会光顾该社区的六家餐馆，1950 年后，他们还会伸长脖子，在春节游行中一睹纸龙沿着\
  \ H 街蜿蜒而行的风采。⁴\n\n然而，就在这个社区刚刚站稳脚跟之际，郊区化给了唐人街近乎致命的一击。许多华盛顿特区的华人决心不再只做洗衣工，他们督促子女进入专业领域。到了\
  \ 20 世纪 50 年代，华人会计师、医生和政府工作人员跟随白人同行，搬到了马里兰州的贝塞斯达和惠顿，以及弗吉尼亚州的麦克莱恩。随着华人生活中心向郊区转移，新移民绕过了唐人街，除非他们太穷而别无选择。到\
  \ 20 世纪 60 年代中期，华盛顿特区地区的华人人口中只有不到 10%居住在唐人街。留下来的大多是老年人和单身汉，他们生活在日益破败的商店和餐馆街区中。⁵\n\
  \n唐人街的衰落引发了四次振兴该社区的重大努力，但每次华人业主和居民的参与度都在下降。20 世纪 60 年代初，一群居住在郊区的华人业主和专业人士创建了东方商业中心，这是一个房地产辛迪加，用创始成员汉密尔顿·莫伊的话说，旨在“拯救唐人街”。该商业中心将白人业主组织成“华美狮子会”，这是一个面向有兴趣投资者的独家跨文化组织。他们更关心的是建造一个以“东方主题”为特色的商业飞地，而不是维持该地区作为华人的家园。尽管早期取得了一些成功，但该计划还是失败了。预期的投资涌入从未到来，1968\
  \ 年的骚乱在唐人街北部边界留下了一片烧毁的贫民窟。“人们害怕了，不再来了，”让·李说，她的父母在 H 街经营一家杂货店。⁶\n\n接下来，联邦官员和大都会贸易委员会试图通过在\
  \ H 街北侧、第六街和第十街之间建造一个占地 25 英亩的会议中心来“振兴”该社区。一些居民（其中一些人还记得 1931 年的流离失所）认为，该项目将摧毁而非振兴他们的社区，并组织了激烈的抗议活动。尽管示威活动重振了社区自豪感，并迫使官员搁置了这些计划，但并未阻止该地区的衰落。到\
  \ 1980 年，只有 302 名华人居住在唐人街，不到大都会区华人人口的 2%。⁷\n\n20 世纪 80 年代初，市长马里恩·巴里召集了一群华裔美国业主和专业人士，成立了唐人街开发公司，再次尝试重建该社区。该公司设想了一个经济多元化的社区，以一系列新的商业和混合用途项目为核心。其计划的核心是远东贸易中心，这是一座耗资\
  \ 1.16 亿美元、十层楼高的玻璃幕墙建筑，将容纳国际企业的办公室、一家中国主题酒店、公寓以及一楼的亚洲市场。凭借 34 名华裔美国投资者持有 47%的股份，这一大型开发项目有望成为美国涉及华裔美国人的最大此类交易。⁸\n\
  \n这些计划引发了一波土地投机热潮，给华人居民和小企业主带来了越来越大的压力，但承诺的开发项目从未实现。远东贸易中心遭遇了与巴里执政期间困扰其他少数族裔承包交易相同的缺乏经验和资金不足的问题，项目最终失败。受到犯罪、高税收和高租金的困扰，华人移民继续避开该社区。“所有华人，移民，都离开了唐人街。因为没有人想待在这里，”在\
  \ H 街 803 号生活和工作的一位书法家戴铁生解释道。到 1990 年，唐人街的房产中只有不到 25%为华人所有，社区已缩减为散布在第七街和 H 街停车场和废弃建筑中的一群肮脏的餐馆和商店。有人戏称其为“中国街区”。⁹\n\
  \n阿贝·波林目睹了唐人街的衰落以及华盛顿特区市中心更大范围的废弃，他希望振兴该地区。作为子弹篮球队和首都冰球队的慈善老板，波林致力于他的家乡。他在布莱特伍德长大，就读于罗斯福高中和乔治华盛顿大学，并在华盛顿特区创办了他的建筑公司。1994\
  \ 年 12 月，他与当选市长巴里达成了一项协议，在唐人街南端建造一个室内体育场馆。¹⁰\n\n\n\n\n\n唐人街指导委员会中的华裔企业主在交易达成后才参与进来，但他们对此消息感到兴奋。他们就地铁入口的位置以及建筑和设计与波林讨价还价，但并未就经济适用房进行谈判，尽管这一开发计划可能迫使该地区剩余的\
  \ 300 名华裔居民和几家小企业搬迁。“没有华人能负担得起住在唐人街，”在第七街经营一家杂货店和中药店的威尔逊·李担忧地说，“华人会被迁走，而没有人的唐人街就不成其为唐人街。除了牌楼，什么都不会剩下。”商人们对此表示同情，但他们认为自己的选择要么是开发与搬迁，要么是持续衰落。“当然，我们希望有华人企业，”指导委员会中唯一住在唐人街的成员杜安·王说，“但如果没人来，那好吧……”¹¹\n\
  \n拥有两万个座位的 MCI 中心于 1997 年 12 月 2 日在盛大宣传中开业，并立即成为该市市中心重建计划的核心。在接下来的十年里，唐人街蓬勃发展。随着时尚的全国连锁餐厅和商店在新装修的店面中开业，土地价值和房地产税飙升。尽管被不遗余力地宣传为“唐人街”，但只有拥有自己建筑的华裔商人和幸运获得第\
  \ 8 条住房补贴的居民才能留下来——就连仅存的几家中国餐馆的厨房员工也大多是萨尔瓦多人。华盛顿的唐人街与其说是一个社区，不如说，用哥伦比亚特区 2009 年《唐人街文化发展战略》的话来说，是一个“体验国际亚裔和华裔美国艺术与文化的首选目的地”。¹²\n\
  \n新的唐人街——繁华、多元文化、时尚，但并非华裔——体现了华盛顿特区在 21 世纪初经历的剧烈经济与人口变迁，以及这些变迁的代价。在新千年的头十年，类似的过程席卷了阿纳科斯蒂亚河以西的大部分城市。在全国住房繁荣和\
  \ 9/11 后政府扩张的推动下，新的开发项目将数百万美元的资金注入自 20 世纪 50 年代以来就未有过显著投资的社区。年轻、富裕的居民涌入华盛顿，扭转了该市持续五十年的人口下滑趋势，充实了其税基，并重塑了城市景观和文化。\n\
  \n但随着城市变得更年轻、更富裕、更白，许多原有居民，尤其是黑人华盛顿人，感到与新邻居格格不入，在自己的城市里不受欢迎。由于华盛顿房价飙升，许多低收入居民无力购房，只得在郊区寻找经济适用房。那些留下来的人则利用他们日益减弱的政治力量，反击搬迁以及支持无节制开发的政策制定者。随着开发步伐加快和年轻专业人士的迁入，该市的种族紧张局势加剧。在\
  \ 20 世纪 90 年代中期濒临财政崩溃的华盛顿，到 2010 年，这个国家的首都经济上蓬勃发展，但在种族界限上仍然严重分裂。\n\n### *“一个以白人和冷酷无情的国会为主的棋子”：财政控制委员会接管*\n\
  \n安德鲁·布里默在 20 世纪 90 年代初目睹了这座城市滑向破产，他希望将其从悬崖边拉回。布里默 1926 年出生于路易斯安那州的黑人佃农家庭，是五个孩子中的老三，他从小摘棉花、喂猪，直到第二次世界大战为他提供了逃离的机会。凭借《退伍军人权利法案》，这位勤奋且上进的前陆军中士迅速读完大学，于\
  \ 1957 年获得哈佛大学经济学博士学位，并在纽约联邦储备银行和商务部崭露头角。1966 年，林登·约翰逊总统提名他进入联邦储备委员会，成为首位担任这一要职的黑人。留着短发、身着西装、戴着角质架眼镜的布里默，用《时代》杂志的话来说，成了“联邦储备委员会的杰基·罗宾逊”。¹³\n\
  \n和罗宾逊一样，布里默是一位坚定的融合主义者，他认为马里恩·巴里和其他黑人权力活动家提出的各种经济与社区控制提案是“误导性的，毫无前途”。然而，他并非像一些批评者后来声称的那样，是一个在种族问题上谄媚的“汤姆叔叔”。在这个国家最强大的金融机构的职位上，布里默每年发布关于黑人经济进步的研究报告，并大力倡导联邦支出以解决黑人失业问题。他还与黑人社区保持着深厚而富有成果的联系，担任塔斯基吉大学董事会成员，以及非裔美国人生活与历史研究协会主席。¹⁴\n\
  \n布里默对他选择的家乡产生了深厚感情并深入了解。尽管他于 1974 年离开美联储，但仍留在华盛顿特区，将他的金融咨询公司设在西北麦克阿瑟大道，并从他在西北的家中通勤前往他担任的众多学术和公司董事会职位。1981\
  \ 年至 1992 年间，市政府委托这位备受尊敬的经济学家对华盛顿的财政进行了三次独立研究，这使他透彻了解了华盛顿的经济及其与联邦政府的关系。布里默在金融界的地位、他与黑人社区的联系以及他对城市财政的理解，使他成为财政控制委员会主席的主要候选人，该委员会由国会于\
  \ 1995 年 4 月设立，以监督华盛顿的账目。¹⁵\n\n尽管许多华盛顿居民认为这是惩罚性的国会进行的敌意接管，但财政控制委员会的初步设立实际上是一次战略撤退，该市的民选领导人在其中发挥了重要作用。最初由代表埃莉诺·霍姆斯·诺顿提出，以先发制人地阻止共和党完全剥夺华盛顿自治权的提案，这一想法得到了来自佐治亚州的新任众议院议长纽特·金里奇的支持。金里奇是一位激进的党派人士，在长达十五年的争取众议院控制权的过程中，他经常攻击华盛顿特区。金里奇希望与华盛顿的黑人领导层合作，可以软化共和党的反黑人形象，并提供机会展示保守派的扶贫政策，包括学校代金券和企业区。他告诉市长巴里和代表诺顿，这个国家的首都可以成为“城市瑰宝”。¹⁶\n\
  \n由于金里奇决心将共和党展示为华盛顿恢复偿付能力努力中的开明伙伴，国会制定了一项救助法案，该法案基本保留了地方自治政府。该法案由来自北弗吉尼亚州的温和派共和党新人汤姆·戴维斯起草，并未借鉴地方自治时代之前不民主的三委员制，而是采用了纽约市、费城和克利夫兰使用的更具合作性的模式。根据戴维斯的法案，一个由总统任命的财政控制委员会¹⁷可以审查和修改所有预算、财务计划、城市租约和合同，但市长和华盛顿市议会保留了大部分行政和立法职能。该委员会将一直存在，直到华盛顿的信用评级恢复且市政府连续四年实现预算平衡。该法案惩罚性足以取悦共和党强硬派，又足够灵活以让华盛顿继续实行地方自治，因此在两院以口头表决方式轻松通过。¹⁸\n\
  \n\n\n\n在克林顿政府执政期间，诺顿为控制委员会如何行使权力定下了基调。在她的敦促下，克林顿总统任命安德鲁·布里默为委员会主席，同时任命了另外四位明确承诺支持地方自治的华盛顿特区居民，包括乔伊斯·拉德纳——马里恩·巴里在\
  \ SNCC（学生非暴力协调委员会）时期的旧友，当时她正担任霍华德大学的临时校长。布里默及其委员会成员接受了诺顿为他们设想的有限角色。¹⁹\n\n尽管城市领导人在创建和配备控制委员会人员方面发挥了关键作用，但大多数非裔美国居民并不信任这个新机构。华盛顿特区各族的居民都对不断扩大的赤字、日益衰退的公共服务和令人绝望的犯罪感到厌倦，许多人无奈地接受了城市需要国会帮助来缓解财政危机的想法。然而，在这个问题上出现了明显的种族分歧。白人居民压倒性地支持国会干预，而许多黑人华盛顿居民则对此持怀疑态度。“无论委员会成员是棕色人种、黑人还是白人，他们都会被看作是主要由白人和冷酷无情的国会所操纵的棋子，”马诺帕克区普利茅斯联合基督教堂的牧师格雷兰·埃利斯-哈格勒指出。²⁰\n\
  \n市长巴里敏锐地察觉到黑人民意，他刻意培养非裔美国居民对国会的不信任，并将自己塑造成他们的捍卫者。委员会在首次行动中建议市长削减开支，并将官僚机构规模缩减 5600\
  \ 名员工，此后市长指责委员会成员对特区居民“缺乏敏感性”。同年 12 月，他支持了 100 多名抗议的市政员工，这些员工在早高峰时段使用政府车辆封锁了委员会托马斯圆环办公室外的十字路口。“我能理解许多华盛顿特区员工对控制委员会的权力和决定感到的沮丧，”他说。在接下来的几个月里，巴里利用诺顿建立的合作框架，即使不破坏委员会的举措，也试图拖延它们。²¹\n\
  \n到 1996 年初，委员会成员已放弃与巴里和市议会合作。他们称市长“无关紧要”，并宣布将自行审查城市预算，并在不征求他意见的情况下实施削减。“我们对地方自治怀有极大的尊重，”控制委员会执行主任约翰·希尔说，“但到了某个时间点，你不能再等下去了。”²²\n\
  \n巴里最初进行了反击。当委员会要求他解雇弗农·霍金斯——一位资深官僚、巴里的忠实支持者，时任人类服务部主任——时，市长表示反对，称委员会的要求“绝对反民主、反美国、非美国……极权主义”。霍金斯确实管理不善，但巴里将此视为对自己权力的考验，拒绝让步。“控制委员会没有日常管理政府的责任，”他宣称，“我有。”直到议长金里奇告知他，不合作“会使整个地方自治问题受到质疑”，巴里才屈服。²³\n\
  \n随着委员会与城市领导人之间的权力斗争升级，巴里的个人问题再次浮现。1996 年 4 月，市长突然宣布自己正遭受“精神复发和身体疲惫”，将离开城市一段未公开的时间进行休养。尽管巴里对自己突然离开的原因含糊其辞，但记者很快听到传言：他是在一名工作人员发现他在特区行政大楼购买可卡因后做出这一宣布的。拳击推广人、巴里\
  \ 1994 年竞选的主要支持者罗克·纽曼鼓励巴里“停止走向复发的疯狂过程”并辞职。巴里做不到。那年夏天，他的个人过失仍在继续，进一步削弱了控制委员会对他能否成为城市复苏建设性力量的信心。²⁴\n\
  \n巴里退出后，委员会着手进行改革官僚机构的艰难过程。委员会成员对问题特别严重的城市机构进行了深入研究，接管了控制权，并替换了表现不佳的管理人员。尽管委员会采取了果断行动，但对国会中一些保守派批评者来说，这还不够。其中最突出的是北卡罗来纳州共和党参议员劳奇·费尔克洛思和众议员查尔斯·泰勒，他们分别担任参议院特区拨款小组委员会和众议院特区拨款小组委员会的主席。两人抨击委员会对地方自治过于敏感。“是时候停止担心踩到别人的脚趾了，”费尔克洛思坚持道。他们设想一个更强大的委员会，直接管理整个城市。²⁵\n\
  \n他们在 1997 年一项解决城市债务的法案中找到了实现其野心的工具。自 1974 年《地方自治法案》生效以来，城市领导人一直抱怨国会通过让特区承担无资金准备的养老金负债以及一个州应承担的财政义务，同时严格限制城市的征税权，从而造成了无法克服的赤字。国会领导人驳斥了这些抱怨，将城市的财政问题完全归咎于管理不善。然而，现在国会负责城市财政，它意识到自己确实造成了巨大的结构性赤字。它起草了一项立法，承担了城市\
  \ 40 亿美元的养老金义务，并将监狱、街道维护等一系列城市服务的控制权移交给联邦政府。²⁶\n\n该立法得到了两党支持，议长金里奇和众议员诺顿是其最积极的倡导者。但参议员费尔克洛思认为最初的提案不过是“对一个管理不善的城市进行数十亿美元的救助”，并要求直接由联邦控制。他得到了一个意想不到来源的支持：金融控制委员会主席安德鲁·布里默。布里默对市长未能执行其命令感到愤怒，敦促国会将特区政府置于一位城市经理的管理之下，这位经理不必“受制于”必须“时刻提防市长或市议会”。²⁷\n\
  \n众议员诺顿成功阻止了城市经理的想法，但特区最终得到的方案实质上暂停了地方自治。作为妥协的《1997 年全国首都振兴法案》提供了必要的救助，但要求控制委员会直接管理城市最大的九个机构，并任命一位首席管理官来管理政府，直接向委员会汇报。巴里被降级为一个象征性人物，直接监督的只有公园和娱乐、图书馆以及少数几个杂项委员会。市议会的处境更糟，因为该立法赋予委员会对议会通过的任何法律或达成的合同拥有否决权。在众议院负责该法案的众议员汤姆·戴维斯指出，出于对地方自治的尊重，委员会在\
  \ 1995 年至 1997 年间“不愿行使他们的权力”。“现在这是国会的命令了。”²⁸\n\n\n\n巴里谴责这项立法是“对民主的强奸”，并鼓励居民“愤怒地站起来”。一小群活动人士响应了他的号召，游行至弗吉尼亚州福尔斯彻奇市戴维斯众议员的住所，高喊“打倒戴维斯！民主万岁！”，并组成车队南下至北卡罗来纳州克林顿市，在费尔克洛思参议员的养猪场外举行了喧闹的抗议活动。其他人则将矛头指向了市长。曾是巴里支持者的桑德拉·西加斯创建了“罢免巴里市长委员会”，她辩称：“经历了所有尴尬、所有虚伪、所有腐败之后，如今民主又被从公民手中窃取……是时候抛弃巴里了。”²⁹\n\
  \n然而，大多数居民似乎对国会接管市政感到无奈。随着城市在他们周围分崩离析，他们认为失去地方自治权是他们为复苏必须付出的代价。“垃圾收集糟透了，路面坑坑洼洼，人们因为犯罪太严重而搬走，”布鲁克兰居民弗农·哈姆抱怨道，“必须有所改变。”³⁰\n\
  \n尽管言辞强硬，巴里本人也逐渐接受了新秩序。尽管民调显示他遥遥领先于可能的对手，但他还是决定不参加 1998 年的连任竞选。被国会政治上阉割、受到批评者围攻、且仍在与毒瘾作斗争的他，认为为这个徒有虚名的礼仪性职位而斗争不值得。5\
  \ 月 22 日，在一场自我标榜的演讲中，他将该市近代史上几乎所有的积极发展都归功于自己，这位连任四届的市长告诉居民：“有些领域我在政府之外能更好地服务。”尽管巴里后来在\
  \ 2004 年复出，重新夺回了第 8 选区的议会席位，但他再也没有掌握过重大权力。³¹\n\n这是华盛顿特区政治一个非凡时代的终结。三十年来，巴里似乎违背了政治引力，从一个默默无闻的街头抗议者崛起，成为该市历史上最具主导地位的民选官员。他展现出一种不可思议的能力，善于利用变幻的政治风向，从\
  \ 20 世纪 60 年代的黑人权力激进分子，巧妙转变为 70 年代的包容性联盟建设者，再到 80 年代的细条纹权力掮客，最后成为 90 年代的忏悔罪人。尽管他个人丑闻缠身，城市也举步维艰，但他仍然在其核心选民——低收入的黑人华盛顿居民中广受欢迎。“马里恩·巴里雇佣了很多人，让很多人成为中产阶级，供很多人上了大学，帮很多人付了房租，”长期盟友劳伦斯·盖约特在评价巴里的遗产时说道。³²\n\
  \n巴里是华盛顿的悲剧英雄，一位才华横溢的政治家，曾有望带领这座城市超越其历史分歧。但他的个人缺陷和管理上的漠不关心，加上城市问题的严重性，最终粉碎了那种希望感。³³\n\
  \n### *“种族问题暗流涌动”：回归地方自治的不安之路*\n\n巴里的声明颠覆了 1998 年的市长竞选。三位已宣布的候选人——黑人议员哈罗德·巴西尔和凯文·查沃斯，以及白人议员杰克·埃文斯——在一场突然变得开放的竞选中争相与选民建立联系。但所有人都被一位意外候选人的参选打了个措手不及：该市首席财务官安东尼·威廉姆斯。\n\
  \n威廉姆斯身材瘦削，头发稀疏，声音低沉单调，喜欢用晦涩的类比。这位耶鲁和哈佛毕业的前农业部首席财务官，看起来不过是个古怪的官僚，在华盛顿根基浅薄。这位浅肤色的洛杉矶本地人三年前才搬到该市，在西南区租了一套不起眼的公寓，在进入市长竞选前只在地方选举中投过一次票。《华盛顿邮报》将他描述为“一个埋头数字、戴领结的书呆子”，威廉姆斯在公共场合害羞而笨拙——与喜欢握手的巴里形成鲜明对比。他很容易被低估。³⁴\n\
  \n威廉姆斯的官僚作风掩盖了他强烈的野心和敏锐的政治头脑。他担任的财政职位是特区政府的第二权力职位，掌管全市所有资金，并有权认证市长的预算数字。他之所以被聘用，部分原因是巴里市长认为他不会利用这个职位成为政治对手，但威廉姆斯证明了自己是一个狡猾而能干的战略家。他通过公开批评市长的预算决策来彰显独立性，与泰勒众议员及其他国会议员建立了密切关系，并通过参加一百多场社区会议培养了自己的选民基础。他因努力控制特区预算而获得了全国声誉——1997\
  \ 年《治理》杂志将他评为“年度公职人员”。到 1998 年冬天，他正在认真考虑竞选市长。一场组织良好的草根运动试图推举他，就在巴里宣布退休仅十天后，威廉姆斯加入了竞选。³⁵\n\
  \n在随后的竞选中，威廉姆斯将自己塑造成一位“新黑人领袖”，更关心让城市正常运转，而非重新分配金钱和权力。“我参选是因为我相信特区政治已经从基于政治考量和意识形态的政治，转变为基于讨论真实需求和真实结果的政治，”他告诉选民。³⁶\n\
  \n1990 年代的各种危机——无情的暴力、破败的学校、无能的服务、国会接管市政府——催生了人们对良好治理的迫切渴望。这位前财政主管承诺了能力，他提出的改革在白人和中产阶级黑人选民中尤其受欢迎，他们帮助他赢得了民主党提名。然而，他难以赢得穷人和工薪阶层选民的支持，这些人仍然期望具有黑人权力时代特征的、针对种族的再分配政策。由于所有候选人都承诺提供不分种族的市政服务，这些选民选择了待在家里。投票率从\
  \ 1994 年合格选民的 52%下降到 1998 年的仅 30%。尽管非裔美国人对这位民主党旗手缺乏热情，威廉姆斯还是轻松击败了共和党人卡罗尔·施瓦茨的普选挑战。³⁷\n\
  \n威廉姆斯的崛起加速了向地方控制的过渡。1997 年，布里默与主张结束地方自治的保守派共和党人站在一起后，惊慌的诺顿代表请求克林顿总统在其三年任期届满时任命一位新的董事会主席。克林顿选择了艾丽斯·里夫林，一位白人联邦储备委员会副主席，当时担任管理和预算办公室主任。与布里默一样，里夫林对特区的财政了如指掌。她曾在\
  \ 1980 年代和 1990 年代初主持过两个审查该市账目的委员会，并在 1995 年帮助选出了最初的财务控制委员会。\n\n但与强硬的布里默不同，身材矮小、声音柔和的里夫林认为，董事会“应该越来越像董事会”，以培养地方行政人员，使城市能够“在没有董事会的情况下良好运转”——这一立场既源于巴里的退休，也源于她的性格。大选之后，里夫林和董事会宣布，他们将在\
  \ 1999 年 1 月威廉姆斯就职时，将所有特区机构的控制权交还给市长办公室。³⁸\n\n\n\n\n对于许多华盛顿特区的黑人居民来说，威廉姆斯政府与财政控制委员会几乎毫无区别。当这位新任市长和他那支由年轻、激进的副手组成的白人团队开始推行他担任首席财务官时实施的改革——削减成本、解雇表现不佳的员工、关闭或私有化效率低下的机构——许多本就持怀疑态度的贫困和工薪阶层非裔美国居民得出结论：他并不关心他们的需求。“种族问题……就潜伏在表面之下，”第八选区活动家杰芬内·劳伦斯表示。“你不能把这座城市的行政管理权交给一群年轻的白人男孩，却指望人们说一切都很好、很完美。”³⁹\n\
  \n威廉姆斯认为，向非裔美国居民展示他关心的最佳方式，是为全市所有居民提供一流的公共服务。“我很清楚……人们希望服务能以公平的方式提供，”他辩称。这种表面上种族中立的做法所固有的紧张关系，在市长\
  \ 2001 年关闭华盛顿唯一公立医院——华盛顿综合医院的行动中表现得最为明显。⁴⁰\n\n华盛顿综合医院由国会于 1806 年创立，作为一家为贫困者服务的医院，其历史充满波折。从一开始就资金不足、管理不善，它在两个世纪里留下了糟糕的护理记录。到\
  \ 20 世纪 90 年代，它已陷入危机，尽管消耗了数千万美元，却未能对华盛顿特区全国领先的糖尿病、婴儿死亡率和艾滋病毒/艾滋病发病率产生任何影响。财政控制委员会在\
  \ 1995 年建议关闭该医院，但巴里拒绝了，认为此举在政治上风险太大。⁴¹\n\n2001 年，威廉姆斯认为清算之日已经到来。他计划关闭这家医院，代之以一个由私人医疗服务提供者组成的网络，将患者转诊至大东南社区医院。一群多元化的社区活动家、神职人员和工会提出抗议，他们担心即将失去超过\
  \ 1600 个工作岗位，并怀疑市长的计划能否奏效。许多人还对这个陷入困境的机构怀有感情。几代人曾在它位于东南第十九街、俯瞰阿纳科斯蒂亚河西岸的广阔园区工作并接受治疗。尽管它服务不佳，但在这座城市里，如果更西边的私人医疗机构拒绝接收，穷人和没有保险的人知道这里会接纳他们。“它不仅仅是一家医院，”活动家谢里·布朗坚持道。“很多人对它有着情感上的依恋。”\n\
  \n尽管如此，威廉姆斯仍一意孤行，动用近 100 万美元的城市资金向选民推销他的计划。反对者采取了绝食等孤注一掷的策略来阻止他。市议会成员紧张地关注着 2002\
  \ 年的选举，并且不相信市长的计划能提供足够的医疗服务，于是一致否决了该提案。然而，财政控制委员会以压倒性的政治力量介入，挫败了民意，帮助威廉姆斯关闭了这家经营不善的医院。⁴²\n\
  \n市长计划的批评者最终得到了平反。在华盛顿综合医院关闭后的几年里，大东南医院表现极差，以至于市检查员建议吊销其执照；不久之后，它便破产了。城市东部地区的非裔美国人社区仍然面临着与私有化之前同样糟糕的医疗服务，但这次工作岗位更少，也没有了控制权——正如他们所担心的那样。⁴³\n\
  \n尽管威廉姆斯在政治上举步维艰，但华盛顿的经济前景有所改善。2001 年 9 月底，财政控制委员会在取得显著成功六年后解散。它说服国会纠正了大部分结构性赤字，恢复了投资者信心，并理清了城市的账目。该委员会于\
  \ 1995 年将华盛顿特区从破产边缘拉回，并与威廉姆斯政府密切合作，在 1998 年至 2001 年间连续四次实现预算平衡。即使在 2001 年 9 月 11\
  \ 日恐怖袭击后，该市面临旅游收入急剧下降的困境，乐观的委员会主席爱丽丝·里夫林仍宣称：“财政状况简直好得不可同日而语。”⁴⁴\n\n然而，许多华盛顿特区的黑人居民对财政控制委员会对该市的影响有着截然不同的看法。虽然他们和所有居民一样，欣赏改善后的城市服务和经济状况，但其中很大一部分进步是通过将他们及其选出的领导层边缘化而实现的。该市预算平衡的实现，部分是通过解雇数百名城市工人，其中大多数是黑人。服务改善往往发生在私有化之后，而私有化将公共服务从公共雇员（其中大多数是黑人）的控制中剥离出来。此外，该市暂时失去了地方自治权，在很大程度上是为了摆脱黑人选民选出的领导人马里恩·巴里。\n\
  \n随着财政控制委员会的解散，许多沮丧的黑人居民将愤怒转向市长威廉姆斯，几乎破坏了他 2002 年的连任竞选。拥有 140 万美元竞选资金、面对四名边缘候选人，威廉姆斯以压倒性优势进入竞选。但他的竞选活动甚至在黑人社区征集选票签名时都遇到了困难。“有些黑人不希望安东尼·威廉姆斯当市长，”克里斯托·毕晓普观察到，她的父亲曾承包征集签名的工作。“他们真的不想签名。”随着提交截止日期的临近，斯科特·毕晓普惊慌失措，用同一笔迹填满了一张又一张表格，上面写着联合国秘书长科菲·安南和演员凯尔希·格兰莫等名字。由于这一违规行为，华盛顿特区选举与道德委员会对威廉姆斯处以超过\
  \ 25 万美元的罚款，并将他的名字从 9 月初选选票中移除，迫使这位现任市长以补名候选人身份参选。⁴⁵\n\n看到市长在黑人选民中地位不稳，巴里的密友威利·威尔逊牧师以补名候选人身份加入竞选。威尔逊指责市长更关心开发商和新中产阶级居民，而不是东部选区贫困的黑人居民，他称这些居民为“无声者、绝望者、失望者、厌恶者”。尽管威廉姆斯以三比一的优势获胜，但整件事损害了市长作为高效、道德正直的技术官僚的形象。特区居民兼危机管理专家兰尼·戴维斯质疑：“我们还要让[威廉姆斯]靠‘不是马里恩·巴里’这个标签撑多久？”⁴⁶\n\
  \n威廉姆斯主持了一场艰难的转型，从 20 世纪 90 年代中期的动荡不安，过渡到 21 世纪初的经济偿付能力和部分地方自治。这位书呆子气的市长及其盟友主要专注于让经济这艘船重回正轨，将官僚能力和经济增长置于自决或公平之上。到\
  \ 2002 年，华盛顿已为一场将从根本上改变这座城市的经济繁荣做好了准备。但威廉姆斯及其盟友忽视了日益增长的不满情绪，尤其是在低收入黑人社区中，人们质疑他的亲发展议程让谁受益、让谁受损。随着市长第二任期内新一轮绅士化浪潮席卷华盛顿特区，黑人选民对威廉姆斯的愤怒愈演愈烈。\n\
  \n### *“我们正走向大麻烦”：世纪之交华盛顿特区的绅士化与流离失所*\n\n\n\n\n路易丝·托马斯对中产阶级化（gentrification）再熟悉不过了——她几乎一生都在承受其影响。1924\
  \ 年出生于北卡罗来纳州费耶特维尔，五岁时随父母搬到华盛顿。她的父亲在市政发电厂铲煤，以支付一家人租住的破旧乔治城公寓的租金。二战前不久，当时还是青少年的路易丝，其家被“小巷住宅管理局”判定为危房并遭驱逐。一个开发商买下这处房产，修缮后卖给了一个富裕的白人家庭。这类做法在十年内将托马斯原本种族混合、经济多元的社区几乎变成了清一色的富裕白人社区。⁴⁷\n\
  \n离开乔治城后，托马斯一家落脚于蓬勃发展的黑人社区哥伦比亚高地，她在那里住了六十年。尽管 1970 年代另一波中产阶级化浪潮曾威胁要迫使托马斯搬迁，但 1980\
  \ 年代因可卡因和犯罪活动吓跑了开发商，这一进程停滞了。到 1990 年代末，随着毒品流行消退，她住在西北区 W 街 1418 号一栋有 28 个单元的公寓楼里，与邻居们建立了强烈的社区归属感。托马斯身材矮小，肤色巧克力色，面容丰满和善，深受大家喜爱。一位邻居因癌症去世后，托马斯收养了这位妇女八个孩子中的两个。⁴⁸\n\
  \n尽管托马斯和邻居们为社区投入了时间、金钱和精力，但他们的房东肯尼斯·J·韦尔奇及其儿子帕特里克却没有。他们疏于对 W 街 1418 号的维护，累积了大量违反住房法规的记录。尽管居民多次投诉，但职能失调的消费者与监管事务部几乎未采取任何措施解决问题，直到\
  \ 2000 年威廉姆斯政府开始打击“问题房产”——即那些房东公然违反住房法规的出租房。令托马斯和邻居们高兴的是，市检查员来到他们的楼里调查投诉。然而，检查员并未强制房东在居民继续居住的情况下进行修缮，而是判定该楼为危房，并给居民\
  \ 24 小时撤离。市政府没有提供搬家或替代住房援助。对托马斯来说，这一幕令人愤怒地重演了半个世纪前她家被驱逐的经历。\n\nW 街的居民没有搬走，而是与其他三栋被检查员判定为危房的楼里的拉丁裔和越南裔租户联合起诉市政府，指控其种族歧视。经过数月的“问题房产”执法，威廉姆斯政府已向亚当斯摩根、哥伦比亚高地和肖区的数十名租户发出驱逐通知，却未起诉任何一位房东，这让许多租户担心市政府正与白人开发商合作，将穷人从中产阶级化的社区中赶走。事实上，市政府正在与房东谈判进行修缮，但进展缓慢，且市政官员未告知租户，从而让他们陷入困境。在审理此案的法官施压下，市政府不得不考虑租户的关切，加大了对房东的压力，最终为\
  \ W 街租户争取到一项和解协议：业主修缮该楼，以 1 美元的价格出售给居民，并承诺未来不在特区拥有出租房产。经过多年在官方忽视和房东剥削下艰难建立社区的努力，路易丝·托马斯成了房主。⁴⁹\n\
  \n托马斯的经历揭示了市长威廉姆斯雄心勃勃的全市发展战略可能带来的流离失所风险。在第二任期内，威廉姆斯与开发商和金融家密切合作，清理城市住房存量，以吸引中产阶级居民回流，从而扩大税基。由于忽视了种族和贫困如何限制居民利用改善后的城市服务和不断上涨的土地价值的能力，威廉姆斯只有在低收入居民的抗议迫使其政府关注时，才处理他们的诉求。\n\
  \n市长对发展的兴趣源于他对城市财政前景的悲观认识。尽管 1997 年获得救助且受控制委员会指导的财务重组，特区仍难以筹集足够收入。国会中的郊区议员极力维护长期存在的通勤税禁令，因此华盛顿产生的收入的\
  \ 66%在马里兰州和弗吉尼亚州被征税，而大多数联邦工作人员居住在那里。除了教堂、学校和其他在任何地方都不纳税的机构外，特区官员也无法对联邦政府、大使馆和非营利组织拥有的土地征税。因此，特区整整\
  \ 42%的土地未向市财政贡献税收。⁵⁰\n\n在 2002 年大选前，威廉姆斯政府委托进行了一项经济发展研究，以找出解决收入有限问题的方法。随后的报告得出结论，特区需要吸引新的中产阶级居民来增加税收。报告敦促市政官员“补充和扩展华盛顿的旅游及城市美化设施”，以摆脱其作为“官僚和穷人聚居地”的形象。⁵¹\n\
  \n几乎完全按照报告的建议，威廉姆斯于 2003 年 1 月宣布了一项计划，要在十年内吸引 10 万名中上层中产阶级新居民。《华盛顿邮报》和其他观察者嘲笑这个当时看似可笑且雄心勃勃的目标——华盛顿的人口已持续减少半个多世纪，在\
  \ 2000 年人口普查中降至 572,059 人的新低。但威廉姆斯继续推进。他鼓励住房部没收废弃建筑并出售给开发商；拍卖市属房产，包括旧学校和邮局；与地铁合作推动交通枢纽周边开发；敦促美国小企业管理局寻找振兴社区商业中心的方法；并恳求联邦议员将圣伊丽莎白医院、沃尔特·里德陆军医疗中心和海军造船厂等大片土地移交给城市，以便建设全新的社区——这一过程始于\
  \ 2005 年的乔治·W·布什政府。⁵²\n\n尽管不如威廉姆斯那样雄心勃勃，但之前的城市领导人曾实施过类似计划，但成效甚微。市长马里恩·巴里在 1980 年代曾建造市政办公楼以推动遭受暴乱破坏的\
  \ H 街和 U 街走廊的发展，并促成了 MCI 中心成为振兴唐人街的支柱。这些早期努力在 1990 年代末停滞不前，但威廉姆斯的计划却取得了成功，很大程度上是因为它们与几个对都会区影响尤为显著的全国性发展相吻合。⁵³\n\
  \n首先，随着可卡因流行的消退，全国城市的暴力犯罪率下降。华盛顿的变化尤为显著，谋杀案从 1991 年的 482 起高峰降至 2000 年的 242 起；到 2010\
  \ 年，这一数字降至 132 起，为 1964 年以来的最低水平。入室盗窃、持械抢劫等犯罪率也同步下降。随着城市变得更加安全，它对潜在居民和投资者的吸引力也日益增强。⁵⁴\n\
  \n\n\n\n\n犯罪率的下降伴随着华盛顿财富的激增，而这一财富增长是由 20 世纪 90 年代和 21 世纪初游说活动的扩张所推动的。9/11 恐怖袭击催生了庞大的新国土安全部，并引发了国防、情报和信息技术行业的超常增长。2000\
  \ 年至 2010 年间，用于游说、国防和联邦承包的开支翻了一番多，每年向区域经济注入数亿美元。所有这些资金吸引了大量年轻的科技工作者、游说者、办公室职员、军事官僚、律师和承包商涌入华盛顿地区。⁵⁵\n\
  \n在更早的时代，这些富裕的新来者几乎都会直接前往郊区。大多数人仍然如此。但受一种“新都市主义”的驱动——这种理念摒弃了郊区耗能的汽车文化，转而推崇紧凑、多元、适宜步行的社区——这些新工人中有相当一部分搬进了城市内的老街区。他们在国会山、洛根圆环、亚当斯摩根、哥伦比亚高地、勒德罗伊特公园和肖社区等地的停滞中产阶级化中心扩张。威廉姆斯政府强调振兴社区商业走廊，并在公共交通枢纽周边布局新开发项目，这进一步鼓励了这种迁移。⁵⁶\n\
  \n房地产市场巨额利润的承诺也吸引了新来者进入城市。随着利率处于历史低位，银行放宽信贷要求，买家和投资者涌入房地产市场，推高了房价。房地产经纪人戴维·霍金斯回忆说，潜在买家将购房视为一场竞赛，不惜一切代价“赢得”一处房产。“买家几乎不担心为房子多付钱，”他观察到，“因为他们认为以后房子会更值钱。”⁵⁷\n\
  \n市场变得如此狂热，买家如此确信房价会不断攀升，以至于有些人甚至不看房就购买了房产。2005 年，一群马萨诸塞州的投资者仅凭一张网络图片就购买了位于西北佛罗里达大道\
  \ 513 号的一栋房子。这种相对常见的做法之所以引起注意，只是因为进屋后，房主发现了前房主——一位五年前死在浴缸里的老年非裔美国男性——的木乃伊化遗骸。2002\
  \ 年至 2007 年间，华盛顿房屋的中位价平均上涨了 75%，在最受欢迎的社区涨幅往往更高。⁵⁸\n\n随着房价上涨如此之快，开发商和买家很快开始涉足朗方规划的城市之外区域。到\
  \ 2002 年，他们抢购了特立尼达社区的老旧可卡因屋，并拆除了老城门廊上的锡制遮阳篷和绿色人造草皮。长期居民震惊地看到年轻的黑人专业人士，甚至一些白人专业人士，挤进河流以东社区（如国会高地、迪恩伍德）的开放看房活动中。在拍摄一部纪录片时，阿纳科斯蒂亚社区活动家桑德拉·西加斯看到一些白人走过她的街区，便打断了采访。“哦，白人！”她惊呼道，暗自笑了起来。“白人出现在我的街道上。我真不敢相信。”⁵⁹\n\
  \n年长居民在这些发展中看到了希望和危险。一些长期居民从席卷他们社区的变革中获利。“我那个街区几乎所有的家庭都套现了，”在哥伦比亚高地长大的非裔美国开发商塔尼亚·杰克逊回忆道。“人们被开出荒谬的高价来买他们的房子。”但华盛顿特区\
  \ 60%的居民是租房者，其中大多数收入较低或固定。对他们来说，21 世纪初的中产阶级化浪潮引发了一场可负担住房危机。到 2004 年，华盛顿市中心两居室公寓的平均租金已涨至\
  \ 1187 美元。对于时薪 6.60 美元的最低工资工人来说，占其收入 30%的可负担租金每月仅为 343 美元。⁶⁰\n\n许多居民还觉得他们的新邻居并不希望他们留在身边。库尔特·埃尔曼是从马里兰州肯辛顿搬来的白人，他购买了\
  \ W 街 1418 号对面一栋价值 50 万美元的联排别墅，他当然希望路易丝·托马斯和她的低收入邻居们离开。“变化太慢了，”他抱怨道。“那些（第 8 条款和合作所有的）建筑真是碍眼。我们愿意在多大程度上妥协以维持城市中的可负担住房？”他并非个例。当《华盛顿城市报》调查一个由\
  \ 830 名主要是富裕新居民组成的哥伦比亚高地社区邮件列表时，发现了一连串针对“非法移民”、“心怀不满、不尊重、刻薄、暴力且犯罪倾向的黑人青年”以及“老乡、流浪汉、堕落者”的抱怨。⁶¹\n\
  \n经济压力和与新居民的疏离感促使许多非裔美国居民主张他们对城市的权利。一些人走上街头骚扰新来者，或涂上尖锐的涂鸦——“滚回家去，有钱的白人”一条涂鸦写道。当地活动家发起了一波合作组织行动，呼吁华盛顿特区议会加强租金管制立法。其他人则要求新居民尊重他们丰富的历史和在社区中的长期居住权。⁶²\n\
  \n例如，东肖社区的年长非裔美国居民与他们的埃塞俄比亚邻居之间就曾因如何称呼一条曾经拥有繁荣爵士俱乐部的街区而爆发紧张局势。自 1974 年苏联支持的政变推翻海尔·塞拉西皇帝以来，华盛顿地区一直是埃塞俄比亚移民的磁石。到\
  \ 21 世纪初，埃塞俄比亚和厄立特里亚商人主导了 U 街和 T 街之间的第九街店面，2005 年他们请愿议员吉姆·格雷厄姆将该街区更名为“小埃塞俄比亚”。\n\
  \n他们的诉求不过是一场简单的品牌推广活动，旨在为他们的店面集群带来生意，但许多非裔美国居民认为这是对社区历史和身份的威胁。“他们还没付出代价，”社区活动家克莱德·霍华德争辩道。“骚乱时他们在哪里？他们是后来者。他们凭什么有这个权利？”由长期黑人居民主导的地方咨询邻里委员会敦促议会拒绝埃塞俄比亚人的请求。议会照做了。⁶³\n\
  \n随着华盛顿本地人和当地活动家对笼罩城市的变革日益担忧，他们开始更激烈地挑战威廉姆斯政府对发展的不懈关注。他们的愤怒在 2004 年因市长补贴新建棒球场的计划而爆发。市长威廉姆斯是一位狂热的棒球迷，坚信体育场馆能刺激经济增长，他积极竞标蒙特利尔博览会队——一支由美国职业棒球大联盟（MLB）拥有的挣扎中的球队。到\
  \ 2004 年秋季，他与联盟达成了一项协议，要求该市承担新建一座体育场的全部 5.89 亿美元成本，该体育场计划建在阿纳科斯蒂亚河沿岸旧海军工厂旁边的工业用地上。\n\
  \n\n\n\n反对这笔交易的声音广泛存在，跨越了社会经济和种族界限。经过多年的裁员和预算削减，大多数居民无法理解为何要花费超过五亿美元建造一座棒球场，而这座球场的大部分球迷将来自郊区。代表西北部上层多元经济黑人社区的第四选区议员阿德里安·芬蒂，以及支持基础主要来自洛根圆环附近同性恋社区和第三选区共和党人的全市议员大卫·卡塔尼亚，领导了反对派。⁶⁴\n\
  \n威廉姆斯决心推进此事，他在非裔美国居民中积极为这笔交易游说，举办公开集会，并指出球队所有者已同意为低收入儿童提供免费门票、与少数族裔企业签订合同，并优先雇佣华盛顿特区居民。市长声称，这座球场将成为该市长期被忽视区域的一记“全垒打”。⁶⁵\n\
  \n许多黑人居民并不认同。第七选区居民贾哈尔·亚伯拉罕代表了许多河东居民的心声，他对市长说：“我担心你在为棒球而战，而我们却没有一家公立医院。”2004 年 11\
  \ 月，在球场谈判期间，黑人选民用三位球场反对者取代了市议会中威廉姆斯的支持者：夸梅·布朗、文森特·格雷和难以抑制的马里恩·巴里。这三人承诺将注意力集中在东部选区及穷人的需求上，这是对政府过度关注发展、吸引富裕居民回城的斥责。⁶⁶\n\
  \n威廉姆斯匆忙赶在新议会于 1 月接管之前批准了这笔交易，并向七位市议员承诺为他们的“宠物项目”提供 7000 万美元资金。“通常贿赂比这更隐蔽，”共和党女议员卡罗尔·施瓦茨打趣道。尽管被威廉姆斯和议会中的亲棒球派系智取，但议长琳达·克罗普决心回应居民对成本的担忧，她悄悄加入了一项条款，要求球场建设成本的\
  \ 50%由私人融资。议会以 7 比 6 的投票结果批准了这笔交易。2005 年 4 月，更名后的华盛顿国民队在 RFK 体育场进行了他们的首场比赛，这是他们的临时主场，而一座闪亮的国民公园球场正在东南区拔地而起。⁶⁷\n\
  \n威廉姆斯赢得球场项目后，才姗姗来迟地回应了低收入居民对搬迁的抱怨，宣布了一项名为“新社区倡议”的贫困及工薪阶层住房计划。该计划旨在通过建设混合收入社区，并利用中高收入单元的利润来补贴低收入居民，从而打破贫困集中区域。为了避免重蹈小巷改造、城市更新及其他联邦项目导致贫困社区搬迁的覆辙，市政官员与公共住房居民密切合作，共同制定该计划。目标区域的居民要求“新社区”项目必须定期听取代表租户委员会的意见，采取“先建后拆”政策（即城市在拆除旧单元前必须先建造新单元），并制定全面的社会服务计划，以在更新基础设施的同时振兴社区的“人力资本”。⁶⁸\n\
  \n“新社区倡议”的第一个指定地点是北国会街、纽约大道、K 街和西北新泽西大道围成的大片补贴住房社区，规划者称之为“西北一号”。距离国会大厦仅十个街区，西北一号将成为该倡议的展示窗口，证明该市已找到在不搬迁居民的情况下振兴贫困社区的方法。作为对该计划出人意料的支持，市长威廉姆斯启动该项目时，对位于该区域核心的破旧十层、拥有\
  \ 520 个单元的“圣殿苑”大楼的所有者动用了征用权，以防止他们将大楼改造成市场价单元。他的果断行动赢得了居民的信任。受该倡议承诺的鼓舞，并急于回应 2006\
  \ 年住房援助等候名单上五万两千人的请求，市议会推动特区住房管理局在阿纳科斯蒂亚、迪恩伍德和公园景社区增设了更多地点。⁶⁹\n\n低收入黑人居民迫使威廉姆斯回应了他们的关切，但他们仍需应对其政府助长的力量。路易丝·托马斯和她在西街\
  \ 1418 号的邻居们刚成为房主，开发商就开始游说他们出售整栋楼。这是一种令人兴奋的经历。那些从未有过两枚硬币可以摩擦的人们，现在每户被出价高达 11 万美元。2003\
  \ 年，托马斯发现自己在一场关于是否出售大楼的租户投票中落败。西街 1418 号的买家迅速将房产转手给另一位开发商，赚取了 100 万美元的利润。新业主将破旧的公寓改造成售价超过\
  \ 20 万美元的公寓房。托马斯现在又回到了租房状态，而该社区的房价已迅速超出她的支付能力。\n\n托马斯通过她的女儿黛博拉与社区保持着联系，黛博拉领导了将附近的“首都庄园公寓”改造成合作公寓的斗争，但托马斯的大多数老邻居已无力留在哥伦比亚高地。2005\
  \ 年，或许是华盛顿特区房地产繁荣最疯狂的一年，《危机》杂志的一位记者问托马斯，她对改变她所在社区的变化有何看法。“一切都是为有钱人建的，”她评论道。“所有变化发生时，我正住在乔治城，你看看现在的乔治城。我们正走向大麻烦。”⁷⁰\n\
  \n### *“共识就是缺乏领导力”：阿德里安·芬蒂与后种族时代华盛顿的希望*\n\n阿德里安·芬蒂希望将华盛顿打造成“世界级城市”。芬蒂出生于 1970 年，母亲是意大利裔美国人，父亲是非裔美国人，他在多元化的芒特普莱森特社区长大，就读于该市种族最多元化的高中伍德罗·威尔逊高中。芬蒂热爱运动且学业上进，在欧柏林学院（黑华盛顿中产阶级领袖数代人的母校）学习英语和经济学期间，他参加了田径和篮球队。从霍华德法学院获得学位后，他与妻子定居在西北部以黑人为主的上层中产阶级社区克雷斯特伍德。他担任了特区教育、图书馆和娱乐委员会的法律顾问，并投身于社区政治，成为第十六街邻里协会主席，随后又担任了当地咨询邻里委员会的委员。\n\
  \n芬蒂在一个勉强维持运转的城市中长大，他对选民服务极为执着。他深入钻研更换损坏的停车标志和清理小巷等琐事，并对僵化的城市官僚机构感到沮丧。他好胜、精力充沛且缺乏耐心，认定自己可以比第四选区的特区议会代表夏琳·德鲁·贾维斯做得更好。芬蒂强调自己的年轻（当时他还不到三十岁）和实干精神，开展了一场出色的零售式竞选活动，与选区约一半的选民进行了交谈，并在\
  \ 2000 年击败了这位任职二十年的现任议员。⁷¹\n\n\n\n\n在议会中，芬蒂始终将选民服务作为工作重心。他每天回复两百封电子邮件，持续向六个不同的社区邮件列表发布信息，并定期参加社区咨询委员会、家长教师协会和公民协会的会议。到第一个任期结束时，他所在的第四选区选民惊叹于他的工作人员——甚至常常是议员本人——能在几分钟内回应关于减速带、警察巡逻或市政垃圾桶的请求。相比之下，他的议会同僚抱怨芬蒂更擅长竞选而非治理，并对他常在会议期间与助手窃窃私语、用黑莓手机打字的行为暗自恼火。他们不满这位鲁莽的年轻同事向媒体谈论城市问题，却不愿坐下来与他们共同商讨解决方案。“他不参与政府的实际运作，”第二选区议员杰克·埃文斯抱怨道。⁷²\n\
  \n2005 年，野心勃勃的芬蒂宣布参选市长，挑战威廉姆斯预定的继任者、议会主席琳达·克罗普——一位以共识构建者闻名的资深议员。“我们太容易满足于比过去更好，”芬蒂坚称，并承诺通过“跟进、响应和注重细节”，让华盛顿成为全国高效政府的典范。他亲自向数万名选民传达这一信息。芬蒂连续竞选超过一年，走访了华盛顿特区近半数的房屋，仅凭亲自登门就赢得了许多选民的支持。“他敲我家门让我印象深刻，”伍德里奇居民胡安妮塔·格洛弗表示，“我不记得自马里恩·巴里之后还有谁这样做过。”⁷³\n\
  \n芬蒂密集的竞选活动及其在选民服务方面的声誉，帮助他赢得了所有种族和收入群体的多数支持。在民主党初选中，芬蒂赢得了全市所有选区，并在 2006 年 11 月的大选中以\
  \ 89%的得票率胜出。用民调专家罗恩·莱斯特的话说，他惊人的胜利使他成为“第一位真正超越种族、收入和人口结构的（市长）候选人”。凭借匀称的身材、光头和多元种族背景，35\
  \ 岁的芬蒂体现了时髦的世界主义，尤其吸引了 21 世纪初涌入华盛顿的受过教育的年轻移民。⁷⁴\n\n芬蒂是记者们称为“后种族”的新一代黑人当选官员中的领军人物。与纽瓦克市长科里·布克、阿拉巴马州众议员阿图尔·戴维斯以及伊利诺伊州参议员巴拉克·奥巴马一样，这一群体对曾限制其父母视野的种族压迫几乎没有亲身经历。他们受过高等教育且雄心勃勃，挑战老一辈黑人政治家，自信能让政府更好地运作，尤其是为穷人服务。他们坚定地主张种族色盲。“我当然不会（对种族）想太多，”芬蒂在\
  \ 2006 年市长竞选期间被问及此问题时回应道，“我总听到政客谈论种族，但普通人并不谈。他们只关心确保每个社区得到同样的关注。”⁷⁵\n\n芬蒂对政治中的妥协与交换也不感兴趣。他蔑视共识构建和妥协，认为强有力的领导者“提出大胆的想法并坚持到底”，并常引用玛格丽特·撒切尔的格言：“共识是领导力的缺失。”他抨击对手是腐朽政府中的阻挠者或特殊利益的工具，而自诩为民意的代表。⁷⁶\n\
  \n这位年轻市长组建的政府团队包括年轻、强势、手持黑莓手机的改革者，以及一群古怪的忠诚者和长期私人朋友——几乎全是白人。事实上，在芬蒂政府的前十大任命中，只有一位是黑人，这引发了非裔美国人社区的质疑。“在这个拥有世界上最合格黑人的城市，怎么可能找不到黑人担任职位？”第四选区居民老卡洛斯·M·奥基夫感到不解。芬蒂对此类批评不以为意，他相信自己了解民心。“我觉得我正在做我被选上任该做的事，”他表示，“当我与这座城市的人们交谈时，我得到的感受是，他们想要结果，而不是过程。”⁷⁷\n\
  \n芬蒂确实拿出了成果。利用他新创建的 Capstat（一个用于衡量每个城市项目生产率的集中数据库），芬蒂将他传奇般的选民服务项目推广至全市。经济发展副市长尼尔·阿尔伯特加速了数十亿美元的开发项目，推动了本已过热的房地产市场。艾伦·卢及其新成立的公共教育设施现代化办公室开始着手数十所学校、社区中心和游乐场的建设工作。警察局长凯茜·拉尼尔实施数据驱动警务，通过集中打击犯罪热点并在周末“全员出动”来减少犯罪。⁷⁸\n\
  \n但芬蒂认为学校将成为他的政治遗产。“如果我们不修复学校，不激励每个孩子发挥全部潜力，”他在 2006 年胜选后不久对支持者说，“我们永远成不了我们想成为的世界级城市。”上任第一天，芬蒂就呼吁立法解散学校董事会，将华盛顿特区公立学校置于市长直接控制之下。尽管许多议会成员不信任芬蒂，但该体系状况极差，他们愿意尝试新方法。那年四月，议会授予市长选择一名教育总监的权力，该总监将全面掌控教育政策、行政和合同。⁷⁹\n\
  \n当芬蒂接管城市公立学校时，该体系正处于自由落体状态。数十年的白人和随后中产阶级黑人的逃离，加上领导层更迭和过度官僚化，已使学校瘫痪。共和党十年间试图创建教育市场的努力，通过抽走传统公立学校的学生和资金，加剧了危机。1996\
  \ 年，国会中的共和党人决心以市场为基础解决城市贫困问题，通过了在特区设立特许学校的立法。到 2006 年，该市已有 51 所特许学校，服务超过 1.7 万名学生，并获得\
  \ 1.4 亿美元公共资金，这一数字仅次于遭受飓风重创的新奥尔良。2003 年，共和党强行在该市推行教育券，不顾当地民选官员的反对，设立了“特区机会奖学金计划”。此后每年，该计划为\
  \ 1600 名公立学校学生提供联邦资金，用于就读私立学校。\n\n随着华盛顿特区成为特许学校和教育券运动的全国领导者，城市学校的学生大量流失。1996 年至\
  \ 2006 年间，公立学校学生人数从 8 万降至 5.8 万，迫使该市削减项目、解雇教师并关闭学校。选民对该体系的信心降至 15%，为有记录以来的最低点。⁸⁰\n\
  \n\n\n\n芬蒂寻求一位变革型领导者，能够在短时间内从根本上重塑华盛顿特区的公立学校。他找到了志同道合的米歇尔·李——一位 37 岁的韩裔美国教育改革家，此前从未管理过学校系统。这是一个大胆而出人意料的选择。李是“为美国而教”（TFA）的知名校友，该非营利组织将精英大学的应届毕业生安排到贫困城乡学校任教两年。作为\
  \ TFA 成员，她在巴尔的摩教小学时声称（后来被证实是欺诈）让低收入学生取得了非凡的学业进步。随后她创办了“新教师项目”（TNTP），这是 TFA 衍生出的机构，为大型学校系统招募和培训教师。在\
  \ TNTP，李以无畏批评教师工会而闻名，她认为工会保护了表现不佳的教师。⁸¹\n\n李和 TFA 是一场全国性教育改革运动的先锋，这场运动联合了自由派和保守派，共同追求公共教育的问责制。该运动在\
  \ 2001 年取得了标志性的立法成就：乔治·W·布什总统与自由派参议员泰德·肯尼迪合作，通过了《不让一个孩子掉队法案》，该法案规定从三年级开始对所有学生进行年度标准化测试，并利用这些测试来衡量学校表现。显示“年度充分进步”的学校可获得更多联邦支持，而表现下滑的学校则面临更严格的审查、惩罚，若持续表现不佳则可能被关闭。⁸²\n\
  \n管理华盛顿特区问题重重的学校，让李有机会在国会立法者的后院改革整个城市学区。自信满满且不知疲倦的李胜任这项任务，但她最初婉拒了。她认为有效的学校改革*必然*会引发冲突——与家长、教师、民选官员的冲突——她怀疑市长是否愿意承受“反弹和反对”的风暴。芬蒂欣赏她激进的做法，并向她保证愿意冒“一切风险”来扭转学校局面。李接受了任命。⁸³\n\
  \n![Image](img/f0001-26.jpg)\n\n*华盛顿特区公立学校校长米歇尔·李成为学校改革的全国面孔，但也让华盛顿人两极分化。她动荡的任期加剧了城市的种族紧张关系。市长阿德里安·芬蒂站在李的右后方，给予这位争议性校长坚定不移的支持，这也导致他在\
  \ 2010 年选举中落败。© Kevin Dietsch.*\n\n李雷厉风行地进入这座城市，决心在一个几乎无人因绩效被解雇的系统中建立“问责文化”。到任后几天内，她就抨击系统中央办公室人员臃肿无能，并带着电视摄制组走进学校系统仓库，那里堆积着大量急需的物资被遗忘闲置，而学生和教师却缺乏物资。“教师们自己掏钱买这些东西，”她愤怒地说。市议会剥夺了部分工人的工会保护，李立即解雇了近一百人。⁸⁴\n\
  \n利用《不让一个孩子掉队法案》要求的标准化测试，李建立了一套评估管理人员的系统。她收集了华盛顿特区综合评估系统的分数，并与全市每位校长面谈，传达了一个简单信息：如果考试成绩不提高，你就会被解雇。到第一年年底，她解雇了\
  \ 24 名校长，其中包括她孩子就读的备受赞誉的奥伊斯特-亚当斯双语学校的校长。⁸⁵\n\n李还试图利用考试成绩来衡量教师表现。她绕过教师工会，利用已存在的模糊认证规则来实施部分系统，并希望借此解雇数百名她认为不称职的教师。她从基金会和富裕个人那里筹集了数亿美元私人资金，用于奖励那些学生在标准化测试中得分更高的教师。一些教师和校长抱怨对测试和人员解雇的过度关注，但第一年学生成绩全面提高了十个百分点，许多教师获得了奖金，李也赢得了广泛赞誉（尽管后来的调查发现，成绩提升部分归因于教师和管理人员因害怕被解雇而作弊）。⁸⁶\n\
  \n到 2008 年底，李已成为学校改革的*全国性*象征。她穿梭于“思想”会议圈，向科技亿万富翁和慈善家讲述如何拯救美国失败的学校。两位总统竞选团队都与她会面讨论教育改革。《前线》、《60\
  \ 分钟》以及 2010 年纪录片《等待超人》的摄制组记录了她的每一个举动。几乎所有报道以及李本人都在讲述同一个故事：一位由数据和决心驱动的无情改革者，将一个功能失调的城市系统整顿得井井有条。一位热情的记者称她为“华盛顿特区的勇敢的心”。⁸⁷\n\
  \n也许这一信息最清晰的传达莫过于 2008 年 12 月 8 日《时代》杂志的封面：李手持扫帚，严厉地站在空荡荡的教室里。“教师们恨她，校长们怕她，”记者阿曼达·里普利写道。李已成为“美国教育中最具革命性——也最具两极分化——的力量”。李不仅对教师表示不屑，也对反对她改革的家长和政客表示不屑，称他们为学生表现不佳找的所谓借口是“狗屁”。尽管这个故事在她的全国教育改革支持者中反响良好，但却疏远了华盛顿特区许多家长、教师、管理人员，甚至一些学生。专注于华盛顿特区青少年的反暴力组织“家长、校长和教育工作者高中联盟”负责人凯茜·赖利称这篇封面故事“不尊重且贬低人”。而这些人正是地方选举的投票者。⁸⁸\n\
  \n### *“对黑人没有特别好感”：种族问题让市长芬蒂沉没*\n\n与他的学校校长类似，阿德里安·芬蒂在 2008 年底也成了媒体宠儿。记者哈里·贾菲在《华盛顿人》杂志上写道，当他开着\
  \ Smart Car 从一个会议赶往另一个会议时，选民们把他当作“摇滚明星和运动员的结合体”。年轻的专业人士争相加入他的跑步小组，或自己组建小组，在通常臃肿的政府圈内掀起了一股健身热潮。评论家将他与巴拉克·奥巴马总统相提并论，尤其是在\
  \ 2009 年初两人共同出现在 U 街著名的本氏辣椒碗餐厅之后。但所有的赞誉掩盖了华盛顿特区非裔美国人社区对芬蒂专制风格以及他似乎无视黑人华盛顿人特殊诉求的强烈愤怒。芬蒂对此置若罔闻，坚信结果会超越种族。他错了。⁸⁹\n\
  \n\n\n\n早在 2007 年，黑人群体对芬蒂改革议程的不满就已初现端倪。作为校监，米歇尔·李在任内首批重大举措之一便是公布了一项计划，关闭 23 所生源不足、表现欠佳的学校，而这些学校全部位于低收入黑人社区。李和芬蒂将家长和民选官员视为企图破坏该计划的敌人，把关闭学校当作既成事实，并在反对者做出反应前匆忙实施。然而，李不愿承认自己忽视了选民，她与受影响社区举行了一系列会议，居民们对她进行了严厉批评。许多人表达了对社区学校的热爱，称赞辛勤工作的本地教师，并担心关闭学校会危及孩子或无法改善教育质量。但最突出的抱怨是校监没有倾听他们的意见。“没有人问过我们对这个计划的看法，”第四选区教育委员会主席谢丽塔·怀廷抱怨道，“他们只是把计划扔给我们，然后告诉我们，‘就这样了。’”⁹⁰\n\
  \n李认为，她改革所预期的成果——更好的学校、更高质量的教师和成绩更高的学生——将消除人们对实现这些成果的手段的担忧。但《华盛顿邮报》的马克·费希尔写道，她“对城市的政治现实充耳不闻”。事实上，她推行议程时几乎不顾及自身行为的种族影响。她带着全白人的行政团队，向以黑人和拉丁裔为主的群体解释关闭学校的决定。与此同时，她积极讨好中产阶级白人家长。尽管该市白人人口比例已超过\
  \ 35%，但白人家庭通常在小学阶段后搬到郊区或送孩子上私立学校，因此公立学校学生中只有 6%是白人。为了留住白人学生（既为了增加入学人数，也为了提高考试成绩），李经常亲自向富裕和正在士绅化的社区中的年轻职业家长发出邀请，给他们发邮件，并在他们的客厅里参加倾听会。就像\
  \ 50 年前的卡普兰夫妇和“邻居公司”一样，李试图通过积极招募白人家庭并迎合他们的兴趣来阻止白人外流。⁹¹\n\n许多非裔美国家长担心，李对白人家长的讨好最终会伤害他们的孩子。李瞄准的士绅化地区的学校，往往是表现相对较好的学校，就读的是那些有进取心的非裔美国家长的孩子，这些家长利用“跨区入学系统”——一项学生可以申请就读所在社区以外学校的分配计划——为子女争取更好的教育。如果李成功说服社区内的白人家长送孩子上这些学校，那么跨区入学的黑人孩子就会被赶回他们表现不佳的社区学校。⁹²\n\
  \n这个问题在富裕的格洛弗公园社区的罗斯·L·哈迪中学表现得最为激烈。在校长帕特里克·波普的领导下，哈迪中学发展出了一个备受赞誉的全市性艺术与音乐特色项目，吸引了来自全市各地的主要是中产阶级的黑人学生。该校只有\
  \ 10%的学生是白人，因为社区内很少有白人学生就读。但在 2008 年耗资 4800 万美元翻新后，有孩子在哈迪中学对口小学就读的白人家长告诉李，如果她能改善哈迪中学的吸引力，他们就会留在该体系内。李的回应是调走了波普——这位白人校长深受黑人学生和家长的欢迎，但以对社区家长态度生硬而闻名。\n\
  \n非裔美国家长愤怒抗议。在他们看来，校监是在惩罚一位深受爱戴、为他们的孩子尽心尽力的校长，以安抚那些有抛弃该体系历史的白人家长。学生们也站在校长一边。哈迪中学七年级学生克莱尔·墨菲·凯勒称李是“现实版的多洛雷斯·乌姆里奇”，这是流行《哈利·波特》系列中的一个反派角色。然而，李拒绝让步，再次故意无视其改革议程的种族影响。⁹³\n\
  \n在芬蒂的支持下，李继续推进。2009 年夏天，她聘用了 934 名新教师，其中许多是像她一样年轻的“为美国而教”式新招募人员。随后，她利用 2008 年经济衰退导致的预算短缺，为解雇\
  \ 159 名教职员工和 229 名教师（其中绝大多数是年长的非裔美国人）辩护。李声称，解雇是由于市议会最后一刻削减预算所致，但市议会曾指示她从该体系的暑期课程中削减相关资金。她无视市议会，全额资助了暑期学校，然后面对资金短缺，实施了紧急裁员——与常规裁员不同，这种裁员不需要她遵循工会谈判达成的资历规则。李否认了关于她制造危机以解雇年长黑人教师的指控，但这正是她许多改革的实际效果。到\
  \ 2011 年，黑人教师不再在华盛顿特区学校中占多数；而仅仅八年前，他们还占教师队伍的 77%。⁹⁴\n\n对许多华盛顿黑人来说，解雇教师是压垮骆驼的最后一根稻草。超过一千名家长、教师、学生和社区活动家在威尔逊大楼外举行了“尊重集会”。人们挥舞着写有“把她扫出去”和“这不是李斯坦”的标语，当华盛顿教师工会主席乔治·帕克宣布“我们正在动员，让芬蒂市长和李校监知道，我们想要尊重、参与、更大的问责制和透明度”时，人群欢呼起来。李在黑人社区的支持率暴跌。2008\
  \ 年，50%的非裔选民认为她工作出色，但两年后只有 27%的人仍持同样看法。尽管支持率不断下降，芬蒂仍然坚定地支持校监的决定。⁹⁵\n\n芬蒂与黑人社区的问题不仅限于米歇尔·李和城市学校，还延伸到了房地产开发领域。然而，与学校问题不同的是，许多非裔选民抱怨他做得不是太多太快，而是太少太慢。\n\
  \n在任期的头两年，芬蒂极大地推动了该市已经蓬勃发展的房地产业。他为开发商削减了繁文缛节，并匆忙推动数十亿美元的交易通过许可和审批流程。当 2008 年经济衰退导致其他城市建设停滞时，他推动特区花费数亿美元来维持繁荣。“你总得花钱才能赚钱，”他辩称。⁹⁶\n\
  \n该市实际上从经济衰退和住房危机中受益，因为高油价、糟糕的交通和过度建设的住房市场使郊区越来越缺乏吸引力。2008 年后，越来越多的移民选择城市而非郊区。2009\
  \ 年至 2011 年间，华盛顿特区新增了近 3 万居民，其中绝大多数是受过教育的白人专业人士。企业家们拼命利用这一人口结构，开设了令人眼花缭乱的酒吧、餐厅和健身房，迎合拥有可支配收入的年轻白领工人。开发商也紧随其后，加快了高端公寓和共管公寓的建设步伐。⁹⁷\n\
  \n\n\n芬蒂确保其中一些开发项目发生在阿纳科斯蒂亚河以东几乎全是黑人的区域。重要的新项目包括：前圣伊丽莎白校区上的国土安全部、明尼苏达大道东北段的一家巨型超市（12\
  \ 年来第七选区的首家超市），以及第八选区的一家 IHOP 餐厅，而此前该选区连一家堂食餐厅都没有。⁹⁸\n\n然而，许多非裔美国居民认为市长做得还不够。以黑人为主的社区发展落后于正在绅士化的地区，更重要的是，市场压力威胁到低收入黑人居民留在城市的能力。为新居民建造的住房大多并非新建，而是从低收入住房库存中划拨出来的。2000\
  \ 年至 2010 年间，高成本公寓数量增加了两倍，而低成本单元数量减少了一半。与此同时，价格超过 50 万美元的房屋数量翻了一番，低成本住房库存却缩减了三分之二。⁹⁹\n\
  \n随着新房主和开发商在私人市场上抢购低成本单元，许多贫困居民及其在市议会的代表敦促芬蒂政府建造更多经济适用房。然而，芬蒂并未将其列为优先事项。事实上，这位以急于求成、雷厉风行著称的市长，在向穷人提供住房选择方面却拖拖拉拉。\n\
  \n“新社区倡议”为其政府缺乏成效的努力提供了一个具有启发性的例子。新社区倡议于 2005 年创立，经过威廉姆斯政府与西北一区多个公共住房项目居民长达一年的艰难谈判才得以达成。该地区许多老年居民在\
  \ 20 世纪 50 年代联邦政府摧毁他们在西南区的家园后，最终住进了公共住房。因此，用社区活动家阿尔维塔·芒林的话说，他们担心任何现代的“城市更新”都会导致“黑人被驱逐”。然而，威廉姆斯政府说服他们，这次会有所不同。\n\
  \n芬蒂以其独裁风格违背了这种信任，并破坏了该倡议。2007 年 3 月，在收到关于坦普尔法院大楼内老鼠和臭虫泛滥的投诉后，市长召集了一次租户会议。他告诉在场的\
  \ 65 名居民，他们可以继续住在这栋楼里，或者领取第 8 条住房券离开。大多数人选择了领取住房券。芬蒂倾向于直接从居民那里收集信息，不信任那些声称代表他们的组织，他无视西北一区租户委员会的抗议，下令所有\
  \ 211 户家庭搬离该楼，以便将其拆除重建。芬蒂的行为违反了居民与威廉姆斯政府达成的“先建后拆”协议，但市长承诺，一旦新开发项目完成，所有租户都将有容身之处。“这是谎言，”坦普尔法院租户协会主席黛安娜·亨特警告说，“当他们拆掉这栋楼时，我们就回不来了。”¹⁰⁰\n\
  \n事实证明她是对的。计划中的开发项目从未获得私人资金，芬蒂政府也没有将新社区倡议列为优先事项。坦普尔法院变成了一片停车场。其前居民分散到城市最东部的选区和乔治王子县，就像半个世纪前城市更新后西南区居民四散一样。其他新社区选址也存在类似问题，经济适用房危机进一步恶化。2008\
  \ 年至 2010 年间，低收入住房券和公共住房的等待名单分别增长了 47%和 61%。¹⁰¹\n\n然而，尽管其开发政策和教育改革备受争议，芬蒂市长在 2010\
  \ 年连任竞选开始时似乎坚不可摧。考试成绩上升，犯罪率下降，城市蓬勃发展，他还筹集了高达 400 万美元的资金，吓跑了大多数潜在挑战者。民调显示，所有阶层和种族背景的居民都支持这位充满活力的年轻市长带来的城市服务诸多改善。芬蒂在白人选民中非常受欢迎，许多政治观察家认为他将轻松获胜。“他的连任几乎板上钉钉，”《华盛顿人》杂志的哈里·贾菲在\
  \ 2010 年 3 月写道。¹⁰²\n\n但芬蒂面临一个重大的政治问题。在一个非裔美国人仍占登记选民 63%的城市里，大多数黑人居民认为市长傲慢且不诚实，他们相信他更关心高收入白人居民而非他们自己。“他对白人毕恭毕敬，对黑人却爱答不理，”公民活动家劳伦斯·盖奥特抱怨道。¹⁰³\n\
  \n许多黑人居民对他故意侮辱资深黑人领袖的行为感到愤怒。2009 年，芬蒂曾试图将科拉·马斯特斯·巴里（马里恩·巴里的前妻）及其非营利组织从东南华盛顿网球与学习中心驱逐出去，而该中心正是她努力创建并运营的。巴里的两位朋友——多萝西·海特和玛雅·安吉罗——作为美国黑人中最受尊敬的女元老，请求会面讨论此事。芬蒂两次取消了与她们的会面，引发了全国知名黑人女性的强烈批评。在这起高调冷落事件后的民调显示，华盛顿特区最强大的投票群体——黑人女性中，有四分之三对芬蒂持负面印象。¹⁰⁴\n\
  \n其他人指出，芬蒂在面对严重影响黑人社区的严重问题时缺乏紧迫感，包括第八选区失业率接近 30%的失业问题，以及艾滋病/艾滋病毒感染率飙升至全国领先的 3%（且几乎完全集中在低收入黑人社区）。到\
  \ 2010 年，75%的黑人选民不认可芬蒂的执政表现。许多人同意 H 街朗斯顿酒吧烧烤店老板安东尼奥·罗伯逊的观点，他认为芬蒂“对黑人没有特别的亲近感”。¹⁰⁵\n\
  \n几位黑人活动家和工会领袖迫切希望找到一位能与市长抗衡的候选人，于是将目光投向了市议会主席文森特·格雷。格雷曾在莎伦·普拉特·凯利手下担任人类服务部主任，经常与市长发生冲突。他是华盛顿特区本地人，毕业于邓巴高中，肤色较浅，是一位比芬蒂年长近\
  \ 30 岁的平淡无奇的政客。他于 3 月（距离民主党初选仅剩五个月）加入竞选，并以“同一个城市”为竞选口号，承诺团结一个因种族和阶级而分裂的多元化城市。黑人选民对芬蒂的不满为格雷的竞选注入了动力。在非裔美国人政治团体、工会和教会的广泛联盟支持下，格雷迅速筹集了\
  \ 280 万美元，并专注于动员黑人投票。¹⁰⁶\n\n芬蒂自信了解普通选民的想法，无视民调，并拒绝了顾问们恳求他关注黑人选民的疯狂请求。他推断，如果黑人选民有问题，再挨家挨户敲门拉票就能赢得他们的支持。直到\
  \ 9 月，民调显示他几乎完全失去了黑人的支持，芬蒂才承认错误并匆忙弥补。他制作了一则广告，为自己的“傲慢”道歉——但随后在选举前的那个周日，他跳过了教堂礼拜，去参加铁人三项赛。¹⁰⁷\n\
  \n\n\n\n\n那些曾原谅马里恩·巴里多次过错的同一批黑人选民，对芬蒂那种明显不真诚的谦卑姿态却几乎毫无容忍。其中 80%的人把票投给了格雷。同样比例的的白人选民支持了现任市长。格雷轻松获胜，这表明在这个迅速绅士化的城市中，黑人选票仍然掌握着政治权力的关键。¹⁰⁸\n\
  \n最终，芬蒂试图忽视种族的做法毁掉了他的政治生涯。就像之前的金融控制委员会和威廉姆斯市长一样，芬蒂为他的黑人选民提供了他们急需的服务——许多人对此感到满意——但他往往以一种剥夺他们权力、贬低他们甚至将他们驱逐的方式行事。“芬蒂的支持者们欢呼说，他让火车准点运行，”《邮报》专栏作家考特兰·米洛伊在一篇犀利的选举后分析中写道，“而人们从车厢尾部跌落、被强行赶出城外，不过是进步的代价。”但他接着写道，当芬蒂冲向未来时，那些被抛在后面的人仍然可以投票。“于是人们走向投票站，礼貌地传递了一个信息：大多数居民实际上相信代议制民主，非常感谢。”¹⁰⁹\n\
  \n## 尾声\n\n## 明天绝不能如此\n\n## *历史、种族与民主：种族流动新时刻*\n\n过去是一座铸币厂，\n\n铸造了鲜血与悲伤。\n\n明天绝不能\n\
  \n也是如此。\n\n——兰斯顿·休斯，《历史》，1934 年\n\n最初的“诗人与侍者”餐厅位于西北区第十四街与 V 街的拐角处，距离 1968 年骚乱的中心仅一个街区。这家集餐厅、书店、休息室和剧院于一体的场所，其名字取自兰斯顿·休斯——这位曾在华盛顿沃德曼酒店当过侍者的诗人，后来享誉国际（尽管他也曾谴责华盛顿黑人上流社会的势利）。2005\
  \ 年开业后，它迅速取得了商业和文化上的成功，吸引了年轻时髦的华盛顿人，他们在 21 世纪涌入了周边的肖社区。¹\n\n从它的名字，到书店里琳琅满目的黑人研究书籍，再到装饰着一面墙壁的描绘民权运动英雄人物的巨大壁画，“诗人与侍者”有意识地拥抱社会正义使命，并推广非裔美国人的历史。然而，它的顾客主要是非黑人群体，而其所有者兼经营者并非非裔美国企业家，而是安迪·沙拉尔——一位在弗吉尼亚郊区长大的伊拉克移民。“诗人与侍者”只是\
  \ 21 世纪初华盛顿众多场所之一，尤其是在肖区，它们利用华盛顿黑人历史中的主题、意象和人物来吸引新的、富裕的、多元文化的顾客。²\n\n“诗人与侍者”体现了一个不断成长、日益绅士化的城市的精神——这座城市不仅因新的发展而充满活力，也因\
  \ 2008 年伊利诺伊州参议员巴拉克·奥巴马当选为美国首位黑人总统而振奋。超过 92%的华盛顿特区居民投票支持奥巴马——比他在其他任何地方获得的最高票数还高出\
  \ 25%——数千名特区居民前往弗吉尼亚州和宾夕法尼亚州这两个摇摆州为他敲门拉票。当新闻播音员在 11 月 4 日深夜宣布选举结果时，欣喜若狂的跨种族人群聚集在白宫外以及第十四街与\
  \ U 街的拐角处——距离“诗人与侍者”仅一箭之遥——他们拥抱、歌唱、哭泣、跳舞，直至凌晨。³\n\n次年一月，许多华盛顿人与超过一百万的游客一起，冒着零度以下的严寒见证了奥巴马的宣誓就职仪式。他们寒冷的身躯挤满了从国会山一直延伸到华盛顿纪念碑的国家广场。在这场充满历史意义的活动中，奥巴马并未回避这个国家及华盛顿特区的种族历史。他惊叹道：“一个父亲在不到\
  \ 60 年前可能还无法在当地餐馆用餐的人，如今却能站在你们面前，宣读最神圣的誓言。”⁴\n\n然而，一旦上任，奥巴马有时却让他的热情支持者感到失望。尽管许多自由派华盛顿人乐于看到美国首位黑人第一夫人米歇尔·奥巴马访问阿纳科斯蒂亚河以东公立学校的低收入学生，但他们哀叹她和丈夫选择将两个女儿送到一所昂贵的、以白人为主的私立学校。他们也越来越对奥巴马未能将华盛顿特区自治列为优先事项感到沮丧。他花了四年时间才在总统专车上挂上“无代表权不纳税”的车牌，并且在八次国情咨文中从未提及特区治理，尽管代表埃莉诺·霍姆斯·诺顿进行了强烈游说。在\
  \ 2011 年与保守派共和党人进行的一系列激烈预算谈判中，奥巴马以牺牲这座城市而闻名。“约翰，我会把华盛顿特区的堕胎问题给你，”他对众议院议长约翰·博纳说，从而默许国会保守派禁止特区地方政府使用本地征收的税收来资助低收入女性的堕胎。“让我们坦诚相待，”黑人社区活动家菲利普·潘内尔说，“在华盛顿特区自治问题上，一位共和党总统也不会更糟。”⁵\n\
  \n对许多华盛顿黑人来说，更不祥的是，奥巴马的总统任期加速了 21 世纪初已经存在的经济和人口趋势。面对自大萧条以来最严重的国家经济危机，这位年轻总统推行了旨在加强中产阶级的普遍性立法，刻意回避了旨在解决穷人和美国黑人需求的种族特定政策。随着国家经济稳定，低收入美国黑人继续挣扎，尤其是在国家首都。本已巨大的财富和就业种族差距急剧扩大。城市研究所的一项研究发现，2013\
  \ 年和 2014 年，华盛顿特区白人的财富是黑人的 81 倍，而天文数字般的房地产价值使得低收入居民越来越难以留在城市。⁶\n\n随着成千上万的白人、亚裔和拉丁裔千禧一代跟随奥巴马来到城市，而年长的、主要是非裔美国人的居民迁往郊区，这座城市失去了黑人多数。在\
  \ 1970 年达到近 53.8 万（占总人口的 71.1%）的峰值后，黑人居民数量在 2010 年降至仅略高于 30.5 万（占总人口的 50.7%）的低点。到\
  \ 2011 年，新的人口普查估计显示，黑人居民不再是人口多数，“对于一个以自己是黑人文化和政治中心而自豪的城市来说，这是一个迅速而显著的转变，”记者卡罗尔·莫雷洛和丹·基廷在《邮报》上写道。⁷\n\
  \n从讲坛到停车场，从博客到理发店，这些人口变化重新点燃了自华盛顿建城以来就标志性的种族与民主问题。对于乐观者来说，人口结构的变化暗示着一个新的、时髦的华盛顿特区——在这里，各种肤色的年轻专业人士居住在繁荣的多元文化社区中，周围遍布着像“诗人与侍者”这样时尚的场所。随着千禧一代涌入城市，他们颠覆了这座城市传统上保守的名声。2014\
  \ 年，《福布斯》杂志将华盛顿特区列为美国“最酷”的城市，称赞其“丰富的娱乐和休闲选择”以及“种族和文化多元的人口”。⁸\n\n\n\n\n\n对于政治层面而言，这些数字引发了关于控制权的问题，因为一个缩小的黑人社区很可能被迫放弃其过去半个世纪所掌握的政治权力。“我想知道明天的华盛顿特区会是什么样子，我是否还能在谈判桌上有一席之地，”黑人律师兼社区活动家查尔斯·威尔逊担忧道。这关乎“谁有权决定这个社区的未来面貌”，西北区弗农山广场附近第三街上帝教堂的黑人牧师谢丽尔·J·桑德斯牧师解释道。“我希望对此有发言权。我不想被人告知‘坐下闭嘴，让我们来为这座城市描绘愿景’。”⁹\n\
  \n对于阴谋论者而言，白人人口的上升揭示了“计划”的成功——据称这是白人商业和政治领袖策划了数十年的阴谋，旨在从黑人手中夺回对城市的控制权。“拜托，各位，我们得诚实点，”一位读者在回应《华盛顿城市报》2010\
  \ 年一篇关于华盛顿特区人口结构变化的文章时写道。“‘计划’正在奏效。白人正在把黑人赶出特区——这就是‘计划’。”送货卡车司机罗伯特·亚当斯回忆起 21 世纪中期第一个白人家庭搬进他所在的阿纳科斯蒂亚社区时的情景。“那就像一阵骚动，仿佛在说‘我告诉过你他们会回来的’。”由于阿纳科斯蒂亚的房价中位数是\
  \ 1990 年代的两到三倍，亚当斯再也负担不起自己的公寓了。尽管苦涩无奈，他和家人还是搬到了更实惠的乔治王子县。¹⁰\n\n表 7 华盛顿特区人口，1990–2015\
  \ 年\n\n![Image](img/t0001-07.jpg)\n\n对于怀旧者而言，不断变化的人口普查数字意味着“巧克力城”的终结——这个绰号因放克乐队“议会”而流传不朽，并在\
  \ 1957 年华盛顿特区成为黑人占多数的城市后被黑人居民深情拥抱。“华盛顿的改造引发了一种身份危机，”记者娜塔莉·霍普金森在 2012 年写道。数十年的黑人统治“培养了一种黑人特权、狂妄自大，是的，还有伴随领导地位而来的傲慢”。许多华盛顿黑人现在担心这座城市会失去灵魂。“唉，巧克力会融化，”霍华德大学诗人\
  \ E·埃塞尔伯特·米勒哀叹道。“我们正在看到一个社区的瓦解。这座城市将不再是黑人的了。”¹¹\n\n21 世纪初的人口革命，是首都种族与民主故事的最新篇章。四个世纪以来，种族一直是冲突与分裂的持续根源，是华盛顿特区政治、经济和社会生活的中心断层线。这个国家建国文件中的民主承诺，一再在剥夺、奴隶制、种族隔离、暴力、撤资以及我们集体无力认真对待这个国家种族罪行的浅滩上搁浅。\n\
  \n但首都的历史并非如兰斯顿·休斯所说的“鲜血与悲伤的铸币”。自这座城市诞生以来，有良知的人们一直在努力拆除至今仍困扰着我们国家的种族不平等和不信任体系。他们的故事不是关于指责和放弃，而是关于行动和韧性，关于努力确保华盛顿痛苦的种族过去“不会成为明天的现实”。我们希望这本书能激励华盛顿人接受黑人和白人废奴主义者、前奴隶和激进共和党人、民权和地方自治活动家、高速公路抗议者和合作组织者的挑战，建设一个更加公正、平等和民主的首都。\n\
  \n## 资料来源评述\n\n《巧克力城》建立在数代前辈历史学家以及与我们并肩工作的当代同事所进行的大量一手和二手研究之上。这本书既是他们的，也是我们的——它既提供了我们自己的原创一手研究，也综合了过去半个世纪中改变了华盛顿特区历史研究领域的学术阐释。事实上，这个领域经历了与城市本身一样深刻的变化。最初作为富裕业余历史学家之间的一种庆祝性家谱研究，首都的历史越来越引起学术界严肃学者的兴趣，他们拓宽了该领域的范围，加深了我们对城市中种族、阶级、权力和性别动态的理解。\n\
  \n第一个专注于华盛顿特区历史的组织是“哥伦比亚特区最古老居民协会”，成立于 1865 年，旨在在华盛顿涌入新居民的时代颂扬城市的“古老”家族。一个更具学术性的团体于\
  \ 1894 年以“哥伦比亚历史学会”的名义成立。这三十六位创始成员（男女均有）主要是在联邦政府工作并在城市扎根的科学家和学者。他们撰写并宣读论文，内容既有回忆录也有研究，这些论文被装订出版为《哥伦比亚历史学会记录》。在早期几十年里，该学会的兴趣反映了其白人、专业、富裕成员的结构。早期《记录》中讲述的大部分历史都是他们的，尽管到\
  \ 20 世纪中期，该组织超越了其精英成员的个人兴趣，开始发表关于城市机构的研究，包括种族隔离学校系统的两个分支。¹\n\n20 世纪初，其他城市组织开始收集更多样化的地方历史资料。华盛顿特区公共图书馆的“华盛顿文献部”成立于\
  \ 1905 年，收集了涵盖广泛地方兴趣的材料，反映了其作为城市中少数非种族隔离公共中心之一的角色。尽管白人历史学家大多忽视了这一点，但华盛顿黑人的社会历史在口述传统、地区教堂以及霍华德大学穆尔兰基金会（现称穆尔兰-斯平加恩研究中心）的收藏中随处可见。霍华德大学的学者们创作了\
  \ 20 世纪初关于城市种族问题的最重要著作，包括社会学家威廉·亨利·琼斯关于黑人娱乐（1927 年《华盛顿特区黑人的娱乐与消遣》）和住房（1929 年《华盛顿特区黑人的住房状况》）的开创性研究。他的同事斯特林·布朗为\
  \ 1937 年公共事业振兴署的《华盛顿指南》撰写的短文《华盛顿的黑人》至今仍是对黑人华盛顿人在城市中扮演的关键角色的有力探索。E·富兰克林·弗雷泽为他著名的《十字路口的黑人青年》（1940\
  \ 年）对华盛顿特区居民进行了大量精彩的访谈。尽管这些研究对黑人生活的洞察仍然有用，但这一时期的作品往往因过度关注黑人精英以及对黑人穷人和工人阶级的居高临下态度而受损。\n\
  \n\n\n\n如同美国史学的许多方面一样，对华盛顿特区历史的解读也因 20 世纪中叶的民权（及地方自治）斗争而发生了革命性变化。二战后几十年间进行的许多研究，都试图描述和详述种族不公正的历史，以期将其瓦解。这项意义深远的工作包括查尔斯·汉密尔顿·休斯顿、菲尼亚斯·因德里茨及其他律师的法律研究，以及社会学家\
  \ E·富兰克林·弗雷泽、经济学家罗伯特·韦弗等学者的学术研究，他们合作于 1948 年出版了轰动一时的《华盛顿的种族隔离》。这些研究首先是实用主义的历史，由寻求改革的自由派活动家和试图向焦虑的读者解释快速变化世界的记者撰写。它们可能令人心碎地优美——海恩斯·约翰逊的《山麓黄昏：黑人、国家与首都》（1963\
  \ 年）是对华盛顿黑人居民仍处于隔离状态的世界的诗意快照。它们也可能异常清醒且引人入胜——萨姆·史密斯的《被俘的首都》（1974 年）充满了对华盛顿特区居民持续无权状态的愤慨。\n\
  \n在 20 世纪 60 年代和 70 年代初，两位先驱学者的获奖研究确立了华盛顿特区历史作为合法学术子领域的地位。康斯坦斯·麦克劳克林·格林的《华盛顿》两卷本于\
  \ 1962 年出版，树立了高标准的学术水平，并明确指出华盛顿特区历史不能再仅仅由年长白人男性反复讲述的陈腐老生常谈构成。她的《秘密城市：国家首都种族关系史》（1967\
  \ 年）提供了“种族间互动”的全景视角，尽管她难以描述穷人的生活，而是侧重于“社会经济上层黑人”，因为关于他们的数据更为丰富。撇开其缺点不谈，《秘密城市》是一本经过深入研究且极具洞察力的书，为未来几十年的种族关系研究定下了基调。紧随格林之后的是莱蒂蒂亚·伍兹·布朗，她的《哥伦比亚特区自由黑人，1790–1846》（1972\
  \ 年）提供了对共和国早期和内战前城市黑人生活的细致观察。布朗细致地记录了被奴役和自由的华盛顿黑人居民为争取更多自由所做的努力。她的研究至今仍是该领域的标准。\n\
  \n布朗的工作是后来被称为“新社会史”的早期范例，这是一场全国历史学家关注地方历史和普通人生活而非国家决策者和精英的运动。这场运动恰逢华盛顿特区地方自治运动的胜利，后者也激发了对当地华盛顿特区历史的兴趣。这些发展共同激励历史学家更深入、更批判性地审视过去，并质疑关于权力和特权的假设，无论是历史人物还是历史资料中的。其结果是一代人的解读颠覆了我们对华盛顿特区历史的理解，并挖掘出在《巧克力城》中引起共鸣的新故事和主题。新方法的典范是詹姆斯·博尔切特的《华盛顿小巷生活：城市中的家庭、社区、宗教和民俗，1850–1970》（1980\
  \ 年），该书打破了进步时代改革者创造的带有种族和阶级偏见的“小巷居民”漫画形象，并试图理解小巷社区的全部复杂性和丰富性。\n\n后来的学者使用类似的方法，从“底层向上”书写新的华盛顿特区历史。凯瑟琳·门齐·莱斯科、瓦莱丽·巴布和卡罗尔·R·吉布斯合作进行了一项开创性研究《铭记黑人乔治城》（1991\
  \ 年），揭示了乔治城黑人经历的深厚根基。伊丽莎白·克拉克-刘易斯进行了数十次深入的口述历史，从女性移民家政工人的角度讲述了 20 世纪初华盛顿的故事，出版了《住进与住出：华盛顿特区的非裔美籍家政工人，1910–1940》（1994\
  \ 年）及数篇相关文章。文集《城市奥德赛：华盛顿特区的多元文化史》（1996 年）挑战华盛顿特区历史学家不要忽视该市的众多少数族裔，包括很大程度上被遗忘的白人工人阶级。文集中两篇特别重要的文章是奥利维亚·卡达瓦尔关于拉丁裔社区的开创性工作和梅根·麦卡利尔关于华盛顿特区爱尔兰人的优秀文章。这些学术研究丰富并深化了我们对这座城市过去的理解。\n\
  \n地区博物馆和大学通过创建新档案和鼓励对城市的新研究，为地方历史的涌现做出了贡献。史密森尼学会于 1967 年在馆长约翰·基纳德领导下开设了阿纳科斯蒂亚社区博物馆，并在\
  \ 20 世纪 70 年代开始收集口述历史并创建了特定社区的档案。其赞助的出版物填补了华盛顿特区历史领域的一个巨大空白，该领域几乎完全忽视了阿纳科斯蒂亚河以东的社区。乔治华盛顿大学于\
  \ 1980 年开设了华盛顿地区研究中心，哥伦比亚特区大学城市研究系于次年启动了华盛顿特区历史与公共政策项目。这三个机构都获得了国家人文基金会附属机构华盛顿特区人文理事会的资助，并利用这些资金出版了大量丰富的社区历史报告，内容涵盖从住房、教育到争取自决的斗争等方方面面。地方研究的巅峰出现在\
  \ 1988 年，编辑凯瑟琳·施奈德·史密斯的《家在华盛顿》出版，这是一本插图丰富、研究扎实的简明社区历史文集。\n\n20 世纪 80 年代末的可卡因流行以及马里恩·巴里\
  \ 1990 年因吸毒被定罪，将华盛顿特区历史的焦点从社会史和社区研究转移开，许多记者争相撰写关于市长和城市陷入功能失调的报道。乔纳森·阿格龙斯基愤怒的《马里恩·巴里：种族政治》（1991\
  \ 年）、汤姆·舍伍德和哈里·贾菲引人入胜的《梦想之城：种族权力与华盛顿特区的衰落》（1994 年）——可以说是当今流传最广的关于 20 世纪末华盛顿特区最具影响力的论述——以及乔内塔·罗斯·巴拉斯敏锐的《最后一位黑人皇帝：马里恩·巴里在新黑人领袖时代的空洞复出》（1998\
  \ 年），都提供了对巴里时代的详细而深刻的描述。然而，他们对市长的关注掩盖了该市丰富的社会运动历史，并排挤了其他政治行动者。\n\n到 20 世纪末，华盛顿特区历史与半个世纪前相比已大不相同。对当地人民和社区层面历史的重视带来了传统历史中未曾听闻的各种新声音和故事。这些细致入微的研究表明，这座城市的历史不仅由强大的领导人塑造，也由贫穷和工人阶级的男男女女塑造，他们既独立行动也集体行动。然而，有时这类研究可能脱离历史行动者所生活的更大背景。新一代受过大学训练的历史学家致力于将地方与全国结合起来，帮助读者理解联邦政府与各种地方行动者之间复杂的权力、权利和准入斗争。这些著作对于我们理解国家首都的种族与民主至关重要。\n\
  \n这种结合方法的一个不可或缺的例子是霍华德·吉列特巧妙命名的《在正义与美丽之间》（1994 年），该书探讨了种族和城市规划如何塑造了城市的发展。《巧克力城》中关于城市规划的许多讨论，包括\
  \ 19 世纪末的房地产开发和 20 世纪中叶的城市更新，都建立在吉列特的见解之上。\n\n\n\n\n尽管吉列特（Gillette）对华盛顿特区历史进行了跨越两百年的广泛概述，但二十世纪末至二十一世纪初的其他学者则贡献了针对特定时期的深入研究。本书前几章反映了肯·鲍林（Ken\
  \ Bowling）对城市建城史的细致研究，包括《创建联邦城市，1774–1800：波托马克热》（*Creating the Federal City, 1774–1800:\
  \ Potomac Fever*，1988 年）和《华盛顿特区的创建：美国首都的理念与选址》（*The Creation of Washington D.C.:\
  \ The Idea and Location of the American Capital*，1991 年）。我们对内战前华盛顿反奴隶制社区的解读，很大程度上借鉴了斯坦利·哈罗德（Stanley\
  \ Harrold）的杰出研究《颠覆者：华盛顿特区的反奴隶制社区，1828–1865》（*Subversives: Antislavery Community\
  \ in Washington, D.C., 1828–1865*，2003 年），该书详细描述了华盛顿特区跨种族反奴隶制活动家网络所面临的挑战与取得的胜利。玛丽·贝丝·科里根（Mary\
  \ Beth Corrigan）1996 年的重要博士论文《心灵与努力的社会联合》（“A Social Union of Heart and Effort”）及相关文章，揭示了自由与受奴役的黑人华盛顿人之间复杂的亲属网络和社区建设努力。威廉·G·托马斯（William\
  \ G. Thomas）近期关于内战前华盛顿自由诉讼和黑人家庭网络的研究，强调了受奴役的黑人华盛顿人在反抗奴隶制时所展现的主体性。托马斯还协助开发了一个非凡的网站“哦，你能看见吗”（`http://earlywashington.org`），该网站将数百份涉及首都奴隶制的法律文件和法庭案件数字化并进行分析。\n\
  \n内战与重建时期吸引了众多严肃学者的密切关注。我们关于该时期的章节，从凯特·马苏尔（Kate Masur）精湛的著作《为全国树立榜样：华盛顿特区的解放与平等斗争》（*An\
  \ Example for All the Land: Emancipation and the Struggle over Equality in Washington,\
  \ D.C.*，2011 年）中获益良多。马苏尔将当地黑人行动主义置于研究的核心，展示了乔治·哈顿（George Hatton）等黑人活动家如何推动对平等的广泛定义，而保守派反对者则发动了一场有效的反革命。肯尼思·J·温克尔（Kenneth\
  \ J. Winkle）的《林肯的堡垒：华盛顿特区的内战》（*Lincoln’s Citadel: The Civil War in Washington, DC*，2013\
  \ 年）以极佳的可读性描述了这段动荡时期，并将首都置于更广阔的内战背景中。温克尔还是“内战华盛顿”（`www.civilwardc.org`）网站的重要推动者，该网站为研究者提供了大量原始资料和富有洞见的解读文章。艾伦·莱索夫（Alan\
  \ Lessoff）的《国家及其城市：政治、“腐败”与进步，1861–1902》（*The Nation and Its City: Politics, “Corruption,”\
  \ and Progress, 1861–1902*，1994 年）至今仍是理解亚历山大·谢泼德（Alexander Shepherd）及其后统治华盛顿的白人商人政权的标准参考。\n\
  \n华盛顿特区漫长的吉姆·克劳时代——从 1870 年代实施专员统治到 1940 年代和 1950 年代的现代民权运动——所获得的学术关注与其重要性并不相称。一个例外是埃里克·耶林（Eric\
  \ Yellin）的《服务于国家的种族主义：伍德罗·威尔逊时代的政府工作者与肤色界限》（*Racism in the Nation’s Service: Government\
  \ Workers and the Color Line in Woodrow Wilson’s America*，2013 年）。耶林的详尽研究不仅展示了威尔逊政府如何逆转黑人几十年的进步，也揭示了该市黑人社区如何组织起来捍卫自身对城市的权利。该时期一些最优秀的研究以文章形式发表，包括米歇尔·帕西菲科（Michele\
  \ Pacifico）关于新黑人联盟的著作，或仍处于未出版状态，包括玛丽亚·安妮特·麦奎尔特（Marya Annette McQuirter）的优秀博士论文《宣称城市：华盛顿特区的非裔美国人、城市化与休闲，1902–1957》（“Claiming\
  \ the City: African Americans, Urbanization, and Leisure in Washington, D.C., 1902–1957”，2000\
  \ 年）。麦奎尔特揭示了城市种族隔离边界的流动性，并强调了黑人华盛顿人在城市街道上彰显自我的多种方式。近年来，关于该时期的新研究不断涌现，包括蒂基亚·K·汉密尔顿（Tikia\
  \ K. Hamilton）的出色博士论文《打造“模范”体系：布朗案前首都的种族、教育与政治，1930–1950》（“Making a ‘Model’ System:\
  \ Race, Education and Politics in the Nation’s Capital before *Brown*, 1930–1950”，2015\
  \ 年）、特雷瓦·林赛（Treva Lindsey）的《不再有色：重塑华盛顿特区的黑人女性身份》（*Colored No More: Reinventing Black\
  \ Womanhood in Washington, D.C.*，2017 年），以及玛丽-伊丽莎白·墨菲（Mary-Elizabeth Murphy）即将出版的《全国与地方事务：华盛顿特区的非裔美国女性政治，1920–1945》（*A\
  \ National and Local Affair: African American Women’s Politics in Washington, D.C.,\
  \ 1920–1945*）。\n\n华盛顿历史上大致从二战结束到 1990 年代初马里恩·巴里（Marion Barry）倒台的民权与黑人权力时期，值得更多学术审视。我们对这一时期的理解，因\
  \ 2004–2005 年《华盛顿历史》（*Washington History*）上发表的两篇关于废除种族隔离时代的杰出文章而得到丰富。贝尔·克莱门特（Bell\
  \ Clement）的《抵制：白人社群对博林案的不同意见》（“Pushback: The White Community’s Dissent from Bolling”）考察了白人华盛顿人如何抵制民权运动，尤其是在试图“拯救”中央高中作为白人学校的失败努力中。玛丽亚·麦奎尔特（Marya\
  \ McQuirter）的《我们的事业在前进：家长行动主义、布朗初中与战后华盛顿平等的多重含义》（“Our Cause Is Marching On: Parent\
  \ Activism, Browne Junior High School, and the Multiple Meanings of Equality in\
  \ Post-War Washington”）描述了黑人家长推动市政官员解决维持双轨学校制度所引发的各种问题的草根运动。2013 年完成的两篇博士论文考察了参与民权和地方自治斗争的人物与组织：格雷戈里·M·博查特（Gregory\
  \ M. Borchardt）的《让华盛顿特区成为民主之都：地方行动主义、“联邦国家”与华盛顿特区的民权斗争》（“Making D.C. Democracy’s\
  \ Capital: Local Activism, the ‘Federal State,’ and the Struggle for Civil Rights\
  \ in Washington, D.C.”）和劳伦·珀尔曼（Lauren Pearlman）的《民主之都：地方抗议、国家政治与华盛顿特区的民权斗争，1933–1978》（“Democracy’s\
  \ Capital: Local Protest, National Politics, and the Struggle for Civil Rights in\
  \ Washington, D.C., 1933–1978”）。其他影响我们对这一时期解读的重要著作包括安妮·M·瓦尔克（Anne M. Valk）的《激进姐妹：华盛顿特区的第二波女权主义与黑人解放》（*Radical\
  \ Sisters: Second-Wave Feminism and Black Liberation in Washington, D.C.*，2008 年），该书探讨了女性在遍布肖区和哥伦比亚高地的“新左派”活动家社区中所发挥的超大作用；以及达娜·弗洛尔（Dana\
  \ Flor）精彩的纪录片《马里恩·巴里的九条命》（*The Nine Lives of Marion Barry*，2009 年），这或许是对巴里动荡职业生涯的最佳概括。\n\
  \n自 2000 年以来，大规模的士绅化浪潮以及随后该市黑人人口不再占多数的局面，催生了当代华盛顿特区学术研究的一个独特分支，并影响了本书后续章节：士绅化研究。这一转变的关键前奏是\
  \ 1990 年代末联邦政府通过金融控制委员会对华盛顿特区政府的重组。贾希·巴鲁蒂（Jahi Baruti）的重要博士论文《哥伦比亚特区政府的控制委员会时代，1995–2001》（“The\
  \ Control Board Era in the District of Columbia Government and Politics, 1995–2001”，2003\
  \ 年）和迈克尔·方特罗伊（Michael Fauntroy）的《地方自治还是国会统治：国会与哥伦比亚特区地方治理的侵蚀》（*Home Rule or House\
  \ Rule: Congress and the Erosion of Local Governance in the District of Columbia*，2003\
  \ 年）是我们理解这一过程的关键路标。丹尼斯·盖尔（Dennis Gale）的《华盛顿特区：内城复兴与少数族裔郊区化》（*Washington DC: Inner\
  \ City Revitalization and Minority Suburbanization*，1987 年）至今仍可能是对哥伦比亚特区人口变化最广泛、最深刻的论述。德里克·海拉（Derek\
  \ Hyra）和萨比伊莎·普林斯（Sabiyha Prince）收录于文集《首都困境：华盛顿特区的增长与不平等》（*Capital Dilemma: Growth\
  \ and Inequality in Washington, D.C.*，2016 年）中的一批才华横溢的学者，在盖尔的研究基础上进一步阐释了持续影响当今城市的士绅化现象。\n\
  \n《巧克力城》旨在综合格林（Green）的《秘密城市》问世半个世纪以来关于首都种族与民主的重要研究成果，并对未被充分研究的人物、事件和时代提供新的研究与分析。随着专门研究的激增，我们感到需要一部通俗易懂的单卷本叙事史，将地方史中强有力的故事和洞见与更广泛研究的必要背景和视野融为一体。虽然主要面向普通读者，但《巧克力城》也为关于种族、民主和社会变革的学术对话做出了贡献。\n\
  \n\n\n\n我们的研究是关于华盛顿的*种族*问题——而不仅仅是研究黑人华盛顿。华盛顿的白人也有“种族”，因此我们认真审视了种族如何影响华盛顿白人（包括移民和白人工人阶级）的世界观和行为，并探讨了他们的种族身份、种族恐惧以及种族权力感如何随时间变化。我们还试图将华盛顿历史的研究领域从支撑许多城市写作的黑白二元框架中转移出来。尽管华盛顿历史上大部分时间人口以白人和黑人为主，但我们纳入了美洲原住民、拉丁裔、亚裔和埃塞俄比亚人的故事，这些故事在华盛顿种族问题的公众讨论中常常被淹没。\n\
  \n我们扩展了历史学家们的研究成果，他们指出了该市不同人口群体之间深刻且具有政治意义的阶级分化。这些种族内部的分歧对于理解群体凝聚力或分裂、跨种族合作的空间，以及统治精英与“草根”之间的激烈分歧至关重要。在种族流动或紧张时期，例如重建时期及其后，或二战后民权时代，这种分歧变得尤为重要。\n\
  \n*《巧克力城》*探讨了种族在国会拒绝给予国家首都自决权方面所起的关键作用，以及反过来，华盛顿缺乏自治如何在其整个历史中加剧了当地的种族不信任。政治民主的缺失是一把双刃剑。地方活动人士有时会利用联邦政府来实现自己的目标，而国家政治人物则利用华盛顿来推行其国家政策议程或迎合其选民的偏见。\n\
  \n我们的研究深入挖掘了华盛顿历史中鲜为人知或未被充分理解的事件，包括该市建立前的权力斗争、战前黑人居民如何利用法院维护自身利益、爱尔兰人在华盛顿种族历史中的作用、佩里·卡森及其\
  \ 19 世纪末工人阶级联盟的重要性、1930 年代反对警察暴行的运动、废除种族隔离时代白人工人阶级的衰落、阻止高速公路的跨种族运动、1970 年代至 1990\
  \ 年代的建州努力，以及马里恩·巴里的持久人气。这些故事阐明了我们更宏大的主题：种族持久的重要性与种族权力动态的变化、华盛顿不民主的政治地位对该市种族关系的削弱作用，以及作为国家首都对当地种族斗争的催化与挫伤效应。\n\
  \n21 世纪将为未来的历史学家提供丰富的素材。这座城市的历史每天都在被记录，不仅出现在《华盛顿邮报》、《城市报》和《华盛顿信息报》的版面上，还出现在无数博客和网站上，这些反映了华盛顿人对该地区历史持续的热爱。我们希望*《巧克力城》*能加深这种对城市的热爱，并激励读者就种族与民主进行深思熟虑的对话。\n\
