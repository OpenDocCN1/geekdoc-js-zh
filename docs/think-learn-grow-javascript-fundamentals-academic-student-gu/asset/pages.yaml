    `object. `


    `A ``method ``works ``on ``a ``single ``instance ``of ``an ``object. ``If ``needed,
    ``functions ``can ``be `


    `written ``to ``access ``the ``properties ``of ``multiple ``objects. ``Functions
    ``that ``are ``not ``methods ``are `


    `not ``listed ``in ``the ``object ``constructor. ``When ``used ``properly, ``custom
    ``objects ``can ``add `


