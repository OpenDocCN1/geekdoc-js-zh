  md: '`CIW ``and ``NWCET... `


    `Setting ``IT ``Skills ``Standards ``for ``the `


    `Knowledge ``Economy `


    `The ``National ``Workforce ``Center ``for ``Emerging ``Technologies `


    `(NWCET) ``is ``the ``official ``sponsor ``of ``the ``CIW ``job-role `


    `certification ``program ``and ``leader ``of ``the ``CIW ``Certification `


    `Council. ``NWCET’s ``involvement ``ensures ``the ``promotion ``of `


    `the ``CIW ``credential ``as ``a ``practical ``way ``to ``implement ``skill ``standards
    ``and ``assures ``that ``the ``CIW `


    `program ``continues ``to ``validate ``the ``skills ``required ``to ``succeed
    ``in ``the ``competitive ``technology-enabled `


    `workforce. `


    `NWCET ``developed ``the ``only ``nationally ``recognized ``and ``validated ``IT
    ``skills ``standards, ``funded ``in ``part `


    `by ``the ``National ``Science ``Foundation, ``which ``comprehensively ``describe
    ``the ``skills, ``knowledge ``and `


    `attributes ``required ``of ``professionals ``in ``the ``knowledge ``economy.
    `


    `NW/CET''s ``leadership ``role ``in ``CIW ``is ``part ``of ``its ``ongoing ``mission
    ``to `


    `lead ``education, ``business ``and ``government ``in ``developing ``skilled `


    `nelviltis. `


    `C `


    `. ``| `


    `information ``technology ``(IT) ``workers. `


