    ``industry''s `


    `recognized ``leader ``in ``providing ``educational ``and ``certification ``standards.
    `


    `IWA ``initiatives ``support ``more ``than ``100 ``official ``chapters ``with
    ``14,000 `


    `individual ``members ``in ``106 ``countries. `


    `IWA ``has ``integrated ``industry-leading ``CIW ``Internet ``skills ``training
    ``into ``its `


    `Certified ``Web ``Professional ``program ``to ``offer ``a ``single ``worldwide
    ``standard `


    `in ``Web ``certification. ``To ``be ``eligible ``for ``IWA ``Certified ``Web
