  md: '`CIW ``Certification `


    `The ``CIW ``Internet ``skills ``certification ``program, `


    `sponsored ``by ``the ``National ``Workforce ``Center ``for `


    `Emerging ``Technologies ``(NWCET), ``is ``aimed ``at `


    `professionals ``who ``design, ``develop, ``administer, `


    `secure ``and ``support ``Internet- ``or ``intranet-related `


    `services. ``It ``offers ``a ``unique ``opportunity ``to ``learn, `


    `demonstrate ``and ``prove ``competence ``on ``Web- `


    `related ``technologies. ``CIW ``certifications ``are `


    `endorsed ``by ``the ``International ``Webmasters `


    `Association ``(IWA) ``and ``the ``Association ``of ``Internet `


    `Professionals ``(AIP). `


    `Certification ``Testing ``\_ `


    `CIW ``certification ``exams ``are ``administered ``by ``Prometric, ``Inc. ``through
    ``Authorized ``Prometric ``Testing `


    `lish, `


    `NATIONAL ``WORKFORCE ``CENTER `


    `jor ``EMERGING ``TECHNOLOGIES `


    `Benefits ``of ``Certification `


    `CIW ``Internet ``skills ``certification ``offers ``industry-wide `


    `recognition ``of ``an ``individual''s ``Internet ``and ``Web `


    `knowledge ``and ``skills. ``It ``also ``provides ``tangible `


    `evidence ``of ``a ``person''s ``competency ``as ``an ``Internet `


    `professional ``and ``is ``frequently ``a ``factor ``in ``hiring ``and `


    `assignment ``decisions. ``Individuals ``holding ``CIW `


    `certification ``can ``demonstrate ``to ``potential `


    `employers ``and ``clients ``that ``they ``have ``passed `


    `rigorous ``training ``and ``examination ``requirements, `


    `setting ``them ``apart ``from ``non-certified ``competitors. `


    `The ``CIW ``logo ``identifies ``individuals ``as ``Internet `


    `professionals ``who ``have ``been ``certified ``by ``one ``of `


    `the ``most ``prestigious ``programs ``in ``the ``industry. `


    `Centers ``(APTCs) ``and ``by ``Virtual ``University ``Enterprises ``(VUE) ``testing
    ``centers ``worldwide. ``The ``exams `


    `measure ``technical ``proficiency ``and ``establish ``a ``level ``of ``core ``competency
    ``required ``to ``become ``CIW ``certified. `


    `To ``register ``for ``a ``CIW ``exam ``online, ``visit ``Prometric ``at ``www.
    ``2test.com ``or ``VUE ``at ``www.vue.com. ``For ``more `


    `information ``about ``CIW ``exams, ``visit ``www.C/Wcertified.com ``and ``select
    ``the ``Exams ``link. `


    `We ``encourage ``you ``to ``speak ``with ``the ``CIW ``training ``partner ``of
    ``your ``choice ``to ``find ``out ``more ``about ``the `


    `vendor-neutral ``CIW ``Internet ``Skills ``program. ``To ``locate ``a ``CIW ``training
    ``partner, ``visit ``www.ClWcertified.com, `


    `select ``the ``Training ``Locator ``link ``and ``select ``the ``training ``partner
    ``of ``your ``choice, ``either ``by ``location, ``partner ``or `


    `course. `


    `www.ClWcertified.com `


