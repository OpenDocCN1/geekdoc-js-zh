    `Skills ``review `


    `As ``a ``JavaScript ``programmer, ``you ``can ``create ``your ``own ``custom
    ``objects. ``You ``define, ``or `


    `create, `


    `a ``custom ``JavaScript ``object ``with ``a ``special ``function ``called ``a
    ``constructor. ``The `


