    `first ``course ``discusses ``the ``fundamentals ``of ``the ``JavaScript ``scripting
    ``language, ``whereas ``the ``second ``course `


    `focuses ``on ``the ``fundamentals ``of ``the ``Perl ``programming ``language.
    `


    `The ``JavaScript ``Fundamentals ``course ``is ``also ``part ``of ``the ``CIW
    ``Web ``Developer ``Series. ``For ``more ``information, `


    `please ``visit ``the ``www.ciwcertified.com ``Web ``site. `


    `Prerequisites `


