    ``with ``various ``ways ``of `


    `displaying ``information ``for ``your ``custom ``object. `


    `As ``you ``work ``on ``your ``project, ``experiment ``with ``creating ``individual
    ``custom ``objects ``and `


    `creating ``arrays ``of ``custom ``objects. ``With ``arrays ``of ``custom ``objects,
    ``experiment ``with ``the `


