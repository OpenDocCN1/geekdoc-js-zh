    `Course ``Description `


    `Welcome ``to ``JavaScript ``Fundamentals, ``a ``12-hour ``course ``designed ``to
    ``teach ``you ``the ``features ``of ``the `


    `JavaScript ``language. ``This ``course ``will ``empower ``you ``with ``the ``skills
    ``to ``design ``client-side, ``platform- `


    `independent ``solutions ``that ``greatly ``increase ``the ``value ``of ``your
    ``Web ``site. ``The ``first ``part ``of ``this ``course `


    `teaches ``you ``foundational ``JavaScript ``skills. ``The ``second ``part ``will
    ``build ``on ``your ``knowledge ``and ``present `


    `solutions ``for ``more ``functional ``and ``exciting ``Web ``pages. ``You ``will
    ``learn ``how ``to ``communicate ``with ``users, `


    `script ``for ``the ``JavaScript ``object ``model, ``control ``program ``flow,
    ``validate ``forms, ``animate ``images, ``target `


    `frames, ``and ``create ``cookies. ``By ``the ``end ``of ``this ``course, ``you
    ``will ``understand ``and ``use ``the ``most ``popular `


    `applications ``of ``JavaScript. `


    `Length `


    `JavaScript ``Fundamentals ``is ``a ``12-hour ``course. `


    `Series `


    `JavaScript ``Fundamentals ``is ``the ``first ``course ``in ``the ``CIW ``Web
    ``Languages ``series. ``CIW ``Web ``Languages `


