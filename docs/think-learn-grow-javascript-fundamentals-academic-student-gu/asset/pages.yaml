    ``to ``create ``a ``custom ``JavaScript `


    `object ``to ``represent ``the ``item. ``Use ``the ``steps ``outlined ``in ``this
    ``lesson ``to ``create ``and `


    `instantiate ``your ``custom ``object. `


    `You ``will ``need ``to ``devise ``a ``way ``to ``display ``the ``information
    ``for ``your ``custom ``object. ``This ``task `


    `can ``be ``accomplished ``in ``many ``ways. ``Use ``concepts ``and ``skills ``that
    ``you ``have ``learned `


    `throughout ``this ``course. ``You ``may ``want ``to ``display ``information ``in
    ``alert ``dialog ``boxes, ``or ``you `


