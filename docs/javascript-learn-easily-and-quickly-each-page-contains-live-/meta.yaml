    # 6.Regular Expressions:


    +   o Strings can be manipulated using regular expressions (regex). Regular expressions
    provide powerful pattern-matching capabilities for string manipulation.


    # 7.String Primitives vs. String Objects:


    +   o JavaScript treats strings as primitives, but there is also a String object
    that provides additional methods. The distinction is transparent due automatic
    conversion between primitive strings and String objects.


    # 8.Immutability:


    o Once a string is created, its value cannot be changed. Any operation that seems
    to modify a string creates a new string with the modified value. Understanding
    the properties and methods associated with strings in JavaScript is crucial for
