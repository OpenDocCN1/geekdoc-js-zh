    # 1. Arrow Functions:


    +   ○ Introduced in ECMAScript (E6), arrow functions provide a more concise syntax
    for writing functions, especially for short, one-line expressions. They also handle
    the scoping of this keyword differently.


    # 2.First-Class Citizens:


    +   ○ In JavaScript, functions are first-class citizens, meaning they can be assigned
    to variables, passed as arguments to other functions, and returned as values from
    other functions. This allows for functional programming paradigms.


    # 3.Closures:


    +   ○ Functions in JavaScript form closures, which means they retain access to
    variables from their containing scope even after the function has finished executing.
    This enables powerful patterns in JavaScript programming.


    # 4.Recursion:


    +   ○ Functions in JavaScript can call themselves, a concept known as recursion.
    This technique is useful for solving problems that can be broken down into smaller,
    similar sub-problems.


    # 5.Callback Functions:


    +   ○ Callback functions are passed as arguments to other functions. They are
    commonly used in asynchronous programming, event handling, and situations where
    the order of execution is important.


    # 6.Function Declarations vs. Expressions:


    +   ○ Function declarations are hoisted to the top of their containing scope,
    allowing them to be called before their declaration. Function expressions, on
    the other hand, are not hoisted in the same way.


    # 7.Function Overloading:


