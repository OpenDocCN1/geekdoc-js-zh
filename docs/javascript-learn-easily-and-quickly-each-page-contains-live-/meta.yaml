    a string and a number. The number is implicitly converted to a string, and concatenation
    occurs instead of addition.


    # 3.Explicit Type Conversion (Casting):


    +   Explicit type conversion, also known as casting, is when you intentionally
    convert a value from one to another using functions or methods provided by the
    language. This allows you to control and specify the desired type.


