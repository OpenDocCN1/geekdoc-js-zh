    up a JavaScript program. Each statement performs a specific action, and the browser
    or JavaScript engine executes them sequentially, and after another.


    # 1.Building Blocks:


    +   JavaScript programs are composed of statements, and each statement is a building
    block of the overall logic and functionality of the program. Statements can include
    variable declarations, control flow statements, function calls, and more.


    # 2.Execution Order:


    +   JavaScript statements are executed in the order in which they appear in the
    code, from top to bottom. This sequential execution is fundamental to the flow
    of the program, and it determines how tasks are carried out in a specific sequence.


    # 3.Semicolons:


    +   Statements in JavaScript are typically terminated by a semicolon (;). The
    semicolon acts as a statement terminator, signaling the end of one statement and
    the beginning of the next. While in many cases, JavaScript allows statements to
    be separated by line breaks without semicolons, it''s a good practice to include
    them for clarity and consistency.


    # 4.Statement Types:


    +   JavaScript supports various types of statements, including but not limited
    to:

    Variable Declarations: let x = 5;

    Conditional Statements: if (condition) { /* code block */ else { /* code block
    */ }

    Looping Statements: for (let i = 0; i < 5; i++) { /* code block */ }

    Function Calls: functionName();

    Return Statements: return result;

    Error Handling Statements: try { /* code block */ } catch (error) { /* handle
    error */ }


    # 1.Control Flow:


    +   Control flow in a JavaScript program is determined by conditional statements
    (e.g., if, else if else) and looping statements (e.g., for, while, do-while).
    These statements allow developers to control the order in which statements are
    executed based on conditions or repeat statements multiple times.


