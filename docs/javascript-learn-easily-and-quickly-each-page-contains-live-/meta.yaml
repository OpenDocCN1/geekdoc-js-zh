    1.In JavaScript, bitwise operations are operations that directly manipulate individual
    bits of binary representations of integers. These operations treat their operands
    as sequences of 32 bits (zeros and ones).


    2.Bitwise AND (&):

    aThe bitwise AND operation is denoted by the & operator. It compares each bit
    of the first operand to the corresponding bit of the second operand. If both bits
    are 1, the resulting bit is 1; otherwise, it is 0.


    3.Bitwise OR (|):

    aThe bitwise OR operation is denoted by the | operator. It compares each bit of
    the first operand to the corresponding bit of the second operand. If at least
    one of the bits is 1, the resulting bit is 1; otherwise, it is 0.


    4.Bitwise XOR (^):

    aThe bitwise XOR (exclusive OR) operation is denoted by the ^ operator. It compares
    each bit of the first operand to the corresponding bit of the second operand.
    If the bits are different, the resulting bit is 1; if they are the same, it is
    0.


    5.Bitwise NOT (~):

    a bitwise NOT operation is denoted by the ~ operator. It flips each bit of its
    operand. That is, 1 becomes 0, and 0 becomes 1. Note that this operation also
    changes the sign of the number.


    6.Left Shift (<<):

    aLeft shift operation is denoted by the << operator. It shifts the bits of the
    first operand to the left by a specified number of positions. Zeros are shifted
    from the right.


    1.Right Shift (>>):'
  - '[PAGE 179]


    +   The right shift operation is denoted by the >> operator. It shifts the bits
    of the first operand to the right by a specified number of positions. For positive
    numbers, zeros are shifted in from the left. For negative numbers, the behavior
    may depend on the implementation.


    # Unsigned Right Shift (>>>):


    +   The unsigned right shift operation is denoted by the >>> operator. It shifts
    the bits of the first operand to the right by a specified number of positions.
    Zeros are shifted in from the left, and the sign bit is filled with zero.


    # Use Cases:


