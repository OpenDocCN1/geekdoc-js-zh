    \ 零填充。\n\n## 用例：\n- 位运算通常用于底层编程、密码学和优化操作。\n\n## 性能考虑：\n- 在某些情况下，位运算在执行速度方面可以产生更高效的代码。然而，应该谨慎使用，因为它们可能会使代码的可读性降低并更容易出错。\n\
