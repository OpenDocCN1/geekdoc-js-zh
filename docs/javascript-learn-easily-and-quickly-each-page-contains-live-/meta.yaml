    allows for advanced string manipulation and formatting.


    Escape Sequences:


    While template literals provide a more natural way to handle multiline strings,
    escape sequences (e.g., \n, \t) are still valid and can be used if needed.


    No Implicit Line Continuation:


    Unlike regular strings created with single or double quotes, template literals
    do not have an implicit line continuation when the code spans multiple lines.
    Each line must be explicitly included within the backticks.


    Consistent Syntax:


    The syntax for template literals is consistent, making it easier to read and maintain
    code compared compared to using concatenation or complex string manipulation.


