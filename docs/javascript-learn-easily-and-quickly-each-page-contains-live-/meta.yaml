    # JS Array Methods


    JavaScript provides a variety of built-in methods that can be used to manipulate
    arrays.


    1. concat():

    - The concat() method is used to merge two or more arrays, creating a new array
    with the combined elements.


    2. filter():

    - The filter() method creates a new array containing elements that satisfy a specified
    condition. It does not modify the original array.


    3. map():

    - The map() method creates a new array by applying a function to each element
    in the original array. It transforms each element according to the provided function.


    4. find():

    - The find() method returns the first element in an array that satisfies a specified
    condition. It does not modify the original array.


    5. indexOf():

    - The indexOf() method returns the index of the first occurrence of a specified
    element in an array. If the element is not found, it returns -1.


    6. includes():

    - The includes() method checks if an array includes a specified element. It returns
    true if the element is found, and false otherwise.


    7. push():

    - The push() method adds one or more elements to the end of an array and returns
    the new length of the array.


    8. pop():

    - The pop() method removes the last element from an array and returns that element.
    It modifies the original array.


    1. shift():

    - The shift() method removes the first element from an array and returns that
    element. It modifies the original array.


    2. unshift():

    - The unshift() method adds one or more elements to the beginning of an array
    and returns the new length of the array.


    3. splice():

    - The splice() method changes the contents of an array by removing or adding new
    elements in place.


    4. slice():

    - The slice() method returns a shallow copy of a portion of an array into a new
    array. It does not modify the original array.


    5. reverse():

    - The reverse() method reverses the order of the elements in an array. It modifies
    the original array.


    6. join():

    - The join() method creates a string by concatenating all the elements of an array
    using a specified separator.


    7. sort():

    - The sort() method sorts the elements of an array in place. The default sort
    order is based on converting elements to strings and comparing sequences of UTF-16
    code units.


    8. reduce():

    - The reduce() method applies a function against an accumulator and each element
    in the array (from left to right) to reduce it to a single value.


    9. forEach():

    - The forEach() method executes a provided function once for each array element.
    It does not return an array.


    10. some():

    - The some() method tests whether at least one element in the array passes the
    test implemented by the provided function.


    11. every():

    - The every() method tests whether all elements in the array pass the test implemented
    by the provided function.


    These array methods provide a powerful set of tools for working with arrays in
    JavaScript. They enable developers to perform common operations such as filtering,
    mapping, finding elements, and modifying array contents in a consistent and efficient
    manner. Understanding these methods is essential for effective array manipulation.


    # // JavaScript Array Methods Example


    ```javascript

    // Array Declaration

    let numbers = [4, 2, 8, 5, 1];

    ```


    ```javascript

    // Array Methods

    let sortedNumbers = numbers.sort((a, b) => a - b);

    let reversedNumbers = numbers.reverse();

    let slicedNumbers = numbers.slice(1, 4);

    let indexOfNumber = numbers.indexOf(8);

    let includeNumber = numbers.includes(3);

    let mappedNumbers = numbers.map(num => num * 2);

    let filteredNumbers = numbers.filter(num => num > 3);

    let sumOfNumbers = numbers.reduce((sum, num) => sum + num, 0);

    ```


    ```javascript

    // Display Results of Array Methods

    console.log("Original Numbers Array: " + JSON.stringify(numbers));

    console.log("Sorted Numbers Array: " + JSON.stringify(sortedNumbers));

    console.log("Reversed Numbers Array: " + JSON.stringify(reversedNumbers));

    ```

