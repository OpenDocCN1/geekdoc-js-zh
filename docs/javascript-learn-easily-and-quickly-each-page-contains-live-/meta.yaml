    \  if (i == 5) {\n    break;\n  }\n}\n\n// End of JavaScript Break Statement Example\n\
    ```\n\nIn this example, the JavaScript break statement is demonstrated within\
    \ while and for loops:\n1. While Loop with Break Statement:\n   - A while loop\
    \ that counts using the loop variable count and breaks out of the loop when count\
