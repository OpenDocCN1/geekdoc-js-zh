  md: 'In JavaScript, comparisons are fundamental operations that allow you to compare
    values and make decisions based on their relationships.


    # 1.Equality Operators:


    +   The equality operators are used to compare values for equality:

    - == (loose equality): Checks if values are equal after type coercion. It may
    convert types before making the comparison.

    - === (strict equality): Checks if values are equal without type coercion. It
    requires both the value and the type to be the same.


    # 2.Inequality Operators:


    +   The inequality operators are used to check if values are not equal:

    - != (loose inequality): Checks if values are not equal after type coercion.

    - !== (strict inequality): Checks if values are not equal without type coercion.


    # 3.Relational Operators:


    +   Relational operators are used to compare the numerical values of two expressions:

    - < Less than

    - Greater than

    - <= Less than or equal to

    - >= Greater than or equal to


