    # JS Switch


    In JavaScript, the switch statement is a control flow statement that allows a
    program to evaluate an expression and execute different blocks of code based on
    the value of that expression.


    1.Expression Evaluation:


    +   - The switch statement begins with an expression (often a variable or an expression)
    inside the parentheses. The value of this expression is then evaluated.


    2.Case Blocks:


    +   - Following the switch statement, there are one or more case blocks. Each
    case block contains a specific value or a set of values that the evaluated expression
    is compared against.


    3.Matching Cases:


    +   - When the evaluated expression matches the value specified in a case block,
    the code inside case block is executed. If there is no match, the program moves
    to the next case block.


    4.break Statement:


    +   - After the code in a case block is executed, the break statement is used
    to exit the switch statement. This prevents the program from falling through to
    the next case block.


    1.default Case (Optional):


    +   - The default case is optional and is used to specify the code that should
    be executed if none of the case blocks match the evaluated expression. It is similar
    to the "else" statement in an if-else structure.


