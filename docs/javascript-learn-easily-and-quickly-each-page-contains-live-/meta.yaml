  md: '# JS If Else


    In JavaScript, the if statement and the else statement are control flow structures
    that allow you to execute different blocks of code based on a specified condition.


    +   1.if Statement:


    +   - The if statement is used to conditionally execute a block of code based
    on a specified condition. If the condition evaluates to true, the code inside
    the if block is executed. If the condition is false, the code inside the if block
    is skipped.


    +   2.else Statement:


    +   - The else statement is used in conjunction with the if statement to provide
    an alternative block of code to be executed when the if condition is false. If
    the if condition is true, the code inside the else block is skipped. If the if
    condition is false, the code inside the else block is executed.


    +   3.Exclusive Execution:


    +   - Either the code inside the block or the code inside the else block is executed,
    but not both. This provides an exclusive choice based on the truthiness or falseness
    of the condition.


    +   1.else Statement (Optional):


    +   - To handle multiple conditions, you can use the else if statement. It allows
    you to check additional conditions if the previous if or else conditions are false.
    The code inside the first matching condition block is executed.


    +   2.Nested if Statements:'
