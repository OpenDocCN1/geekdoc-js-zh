    # JS Events


    In JavaScript, events are occurrences or happenings that take place in the browser,
    as a result of user interactions or other activities. JavaScript can be used to
    listen for and respond to these events, allowing for dynamic and interactive pages.


    +   1.Event Types:

    - Events can be triggered by various actions, such as user interactions (e.g.,
    clicks, keypresses, mouse movements), changes in the document (e.g., load, unload),
    and other browser-related activities (e.g., resizing the window, submitting a
    form).


    +   2.Event Handlers:

    - An event handler is a function that gets executed in response to a specific
    event. Event handlers are registered to listen for particular events and respond
    accordingly.


    +   3.Event Listeners:'
