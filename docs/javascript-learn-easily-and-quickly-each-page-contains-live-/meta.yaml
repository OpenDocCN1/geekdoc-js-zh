    Array iteration in JavaScript refers to the process of visiting each element in
    an array and performing a specific operation on each element.


    # 1.Loop Iteration:


    +   - Traditional loop constructs like for and while can be used for array iteration.
    You can iterate over the indices of the array and access each element using the
    index.


    # 2.forEach():


    +   - The forEach() method is a built-in array method that provides a concise
    way to iterate over each element of an array. It takes a callback function as
    argument, and this function is executed for each element in the array.


    # 3.Callback Function:


    +   - The callback function passed to forEach() takes three parameters: the current
    element, the current index, and the array being iterated over. This allows you
    to perform operations on each element based on its value and position.


    # 4.Read-Only Operation:


    +   - forEach() is primarily used for read-only operations on array elements.
    It''s not intended for modifying the array itself, although the callback function
    can have side effects.


    # 5.Return Value:


    +   - The forEach() method does not return a new array; it returns undefined.
    It is used for its side effects on the elements.


    # 1.map():


    +   - The map() method is another built-in array method used for iteration. It
    creates a new array by applying a provided function to each element of the array
    and returning the results.


    # 2.Return New Array:


    +   - Unlike forEach(), map() returns a new array that contains the results of
    applying the provided function to each element of the original array.


    # 3.filter():


    +   - The filter() method is used to create a new array with elements that satisfy
    a specified condition. It also involves iteration over the elements of the array.


