    \ counts using the loop variable i and breaks out of the loop when i is equal\
    \ to 5.\n3. Displaying Results:\n   - The results of both loops with the break\
    \ statement are displayed.\n\n# JS Iterables\n\nIn JavaScript, an iterable is\
    \ an object that implements the iterable protocol, allowing it to be iterated\
    \ over using for...of loop.\n\n1. Iterable Protocol:\n   - The iterable protocol\
    \ is a set of rules an object must follow to be considered iterable. An iterable\
    \ object must have a method Symbol.iterator.\n2. Symbol.iterator:\n   - The Symbol.iterator\
    \ is a symbol that serves as a key for an object. When this method is called,\
