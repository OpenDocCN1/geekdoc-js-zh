    \ JS For 循环\n\n在 JavaScript 中，`for` 循环是一种控制流语句，允许你按照指定的次数重复执行一段代码块。\n\n- 1. 初始化：\n\
    \  - `for` 循环以一个初始化语句开始。该语句通常用于声明和初始化循环控制变量，该变量通常是一个计数器。\n- 2. 条件：\n  - 在初始化语句之后是一个条件。只要条件求结果为\
    \ `true`，循环就会继续执行。如果条件变为 `false`，循环将终止，程序将移动到循环后的下一个语句。\n- 3. 迭代表达式：\n  - 紧随条件之后是一个迭代表达式。该表达式在循环每次迭代后都会求值，通常用于更新循环控制变量。它允许你控制循环的进度。\n\
    - 4. 代码块：\n  - 在 `for` 循环内部，有一个用大括号 `{}` 包围的代码块。该代码块包含了循环每次迭代时执行的语句。\n\n- 1. 循环控制变量：\n\
    \  - 循环控制变量通常用于跟踪当前迭代。它在迭代表达式中被修改，以控制循环何时终止。\n- 2. 作用域：\n  - 循环控制变量的作用域限于 `for`\
    \ 循环，这意味着它在循环块内可访问。这有助于防止循环外意外的迭代影响。\n- 3. 初始化一次：\n  - 初始化语句仅在循环开始时执行一次。它在循环开始之前初始化循环控制变量。\n\
    - 4. 每次迭代前检查条件：\n  - 在每次迭代之前，都会检查条件。如果条件为 `true`，则执行循环块内的代码。如果为 `false`，则循环终止，程序移动到循环后的下一个语句。\n\
    - 5. 每次迭代后执行迭代表达式：\n  - 在每次迭代后，都会执行迭代表达式。这一步允许你修改循环控制变量，可能会影响后续迭代的循环行为。\n\n循环是\
    \ JavaScript 中实现迭代的一种多功能且广泛使用的结构。它为执行重复性任务提供了一种简洁且组织良好的方式，特别是当迭代次数已知或可以根据条件确定时。\n\
    \n## // JavaScript For 循环示例\n\n### // 从 1 迭代到 5\n```javascript\nconsole.log(\"\
    Counting from 1 to 5.\");\nfor (let i = 1; i <= 5; i++) {\n  console.log(i);\n\
    }\n```\n\n### // 遍历数组\n```javascript\nlet fruits = [\"Apple\", \"Banana\", \"\
    Orange\", \"Mango\"];\nconsole.log(\"Fruits:\");\nfor (let j = 0; j < fruits.length;\
    \ j++) {\n  console.log(fruits[j]);\n}\n```\n\n### // JavaScript For 循环示例结束\n\n\
    ![](img/2d2417294fccf7656ce97d9d156a3625_143_0.png)\n\n在这个示例中，演示了 JavaScript `for`\
    \ 循环：\n\n- 1. 从 1 迭代到 5：\n  - 一个使用循环变量 `i` 从 1 计数到 5 的简单循环。\n- 2. 遍历数组：\n  - 循环遍历数组（`fruits`）并打印每个元素。\n\
    - 3. 显示结果：\n  - 两个循环的结果都使用 `console.log` 显示。此示例说明了如何使用循环来遍历一个范围的值以及数组的元素。\n\n\
    ## JS For In 循环\n\n在 JavaScript 中，`for...in` 循环是一种专门用于遍历对象可枚举属性的特殊循环。\n\n- 1.\
    \ 遍历属性：\n  - `for...in` 循环的主要用途是遍历对象的可枚举属性。它对于键（key）为字符串的对象特别有用。\n- 2. 对象枚举：\n\
    \  - `for...in` 循环遍历对象自身及其继承的可枚举属性。它不包括不可枚举的属性或定义在对象原型链链上的属性。\n- 3. 语法：\n  - `for...in`\
    \ 循环的语法为 `for (variable in object) { ... }`，其中 `variable` 是在每次迭代中将被赋值属性键的变量，`object`\
    \ 是正在被迭代的对象。\n- 4. 变量赋值：\n  - 在每次迭代中，`for...in` 循环将当前属性的键分配给指定的变量。然后你可以使用该变量来访问相应的属性值。\n\
    \n- 1. 遍历对象属性：\n  - `for...in` 循环通常与对象（数组）配合使用以遍历它们的属性。但重要的是，迭代的顺序是不保证的，它在不同的\
    \ JavaScript 引擎之间可能会不同。\n- 2. 枚举顺序：\n  - 枚举顺序基于属性被添加到对象的顺序，但这并不是保证的，且在不同的 JavaScript\
    \ 引擎之间可能会有所不同。\n- 3. 属性标记：\n  - `for...in` 循环只遍历 `enumerable` 属性设置为 `true` 的属性。使用某些方法创建的属性（例如设置\
    \ `enumerable: false` 的 `Object.defineProperty()`）将不会被包含。\n- 4. 数组和类数组：\n  - 虽然\
    \ `for...in` 可以用于数组，但通常不建议这样做，因为它遍历的是键（即数组索引）而不是值。对于数组，通常推荐使用 `for...of`。\n- 5.\
    \ 避免在迭代期间修改对象：\n  - 在 `for...in` 循环内部修改正在迭代的对象可能会导致意外行为。通常情况下，建议在迭代期间避免修改对象的结构。\n\
    \n`for...in` 循环适用于需要检查或操作对象属性的场景。然而，对于遍历数组或类数组中的值，`for...of` 循环因其更直观的语法和行为而更受青睐。\n\
    \n```javascript\n// JavaScript For In 循环示例\n\n// 键值对对象\nlet person = {\n  name:\
    \ \"John\",\n  age: 30,\n  city: \"New York\"\n};\n\n// 使用 for...in 遍历对象属性\nconsole.log(\"\
    Person Details:\");\nfor (let key in person) {\n  console.log(key + \": \" + person[key]);\n\
    }\n\n// 颜色数组\nlet colors = [\"Red\", \"Green\", \"Blue\"];\n\n// 使用 for...in 遍历数组索引\n\
    console.log(\"Array Indices:\");\nfor (let index in colors) {\n  console.log(index\
    \ + \": \" + colors[index]);\n}\n\n// JavaScript For 循环示例结束\n```\n\n"
