    \ `Number`、`String` 或 `Boolean` 等函数来转换值。\n\n## JS 位运算\n\n1. 在 JavaScript 中，位运算是对直接操作整数二进制表示的单个位的操作。这些操作将操作数视为\
    \ 32 位的序列（0 和 1）。\n\n2. 位与 (&):\n   - 位与操作由 `&` 运算符表示。它比较第一个操作数的每个位与第二个操作数的对应位。如果两个位都为\
    \ 1，则结果位为 1；否则为 0。\n\n3. 位或 (|):\n   - 位或操作由 `|` 运算符表示。它比较第一个操作数的每个位与第二个操作数的对应位。如果至少有一个位是\
    \ 1，则结果位为 1；否则为 0。\n\n4. 位异或 (^):\n   - 异异或（互斥逻辑或）操作由 `^` 运算符表示。它比较第一个操作数的每个位与第二个操作数的对应位。如果两个位中只有一个\
    \ 1，则结果位为 1；否则为 0。\n\n5. 位取反 (~):\n   - 位取反操作由 `~` 运算符表示。它翻转操作数的每一个位。\n\n6. 左移\
    \ (<<):\n   - 左移操作由 `<<` 运算符表示。它将第一个操作数的位向左移动指定的位数。\n\n7. 右移 (>>):\n   - 右移操作由\
