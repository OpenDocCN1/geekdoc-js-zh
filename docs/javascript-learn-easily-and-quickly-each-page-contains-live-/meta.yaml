  - '[PAGE 159]


    1.Iterable Protocol:


    +   - The iterable protocol is a set of rules that an object must follow to be
    considered iterable. An iterable object must have a method with the key Symbol.iterator,
    which returns an iterator object.


    2.Symbol.iterator:


    +   - The Symbol.iterator is a symbol that serves as a key for a method on an
    object. When this method is called, it should return an iterator object.


    3.Iterator Object:


    +   - An iterator object is an object with a next method. The next method returns
    an object with two properties: value (the current value in the iteration) and
    done (a boolean indicating whether the iteration is complete).


    4.for...of Loop:


    +   - The for...of loop is a syntax in JavaScript specifically designed for iterating
    over iterable objects. It abstracts away the details of working with iterators,
    making the code more readable and concise.


    5.Examples of Iterables:


    +   - Common examples of iterable objects in JavaScript include arrays, strings,
    maps, sets, and certain built-in objects like NodeList and arguments.


    1.Arrays:


    +   - Arrays are perhaps the most commonly used iterable objects. They hold an
    ordered collection of values, and for the for...of loop allows you to iterate
    over each element in the array.


    2.Strings:


    +   - Strings are also iterable in JavaScript. When you iterate over a string
    using for...of, you get each character in the string one by one.


    3.Maps and Sets:'
  - '[PAGE 160]


    +   Maps and sets are iterable data structures introduced in ECMAScript 2015 (ES6).
    They allow you to store keyvalue pairs (in the case of maps) or unique values
    (in the case of sets).


    # Custom Iterables:


    +   Developers can create custom iterable objects by implementing the iterable
    protocol. This involves defining a Symbol.iterator method that returns an iterator
    object with a next method.


    # Iterating Once:


    +   Iterables are typically designed to be iterated once. Once the iterator reaches
    the end of the sequence, subsequent calls to next will return an object with done
    set to true.


    # Iterator Exhaustion:


    +   Iterables and iterators maintain internal state to keep track of the current
    position in the sequence. After reaching the end, attempting to iterate further
    will not yield additional values.


    Understanding the concept of iterables is crucial for working with modern JavaScript
    features like the for...of loop and for leveraging the benefits of iterable data
    structures. Iterables provide a unified and convenient way to work with various
    collections of data in JavaScript.


