    \n# JS Break\n\nIn JavaScript, the break statement is a control flow statement\
    \ used to terminate the execution of a loop prematurely.\n\n1. Loop Termination:\n\
    \   - The primary purpose of the break statement is to exit a loop prematurely.\
    \ When the break statement is encountered within the body of a loop, it immediately\
    \ terminates the loop, and control is transferred to the statement following the\
    \ loop.\n\n- Use in Loops:\n   - The break statement is commonly used in conjunction\
    \ with loops, such as for, while, and do...while. It allows you to exit the loop\
    \ based on a certain condition, even if the loop's normal exit condition hasn't\
    \ been met.\n\n- Switch Statement:\n   - Apart from loops, the break statement\
    \ is also used in the switch statement. When a break statement is encountered\
    \ within a switch case, it exits the switch block, preventing the execution of\
    \ subsequent cases.\n\n- Nested Loops:\n   - In nested loops, a break statement\
    \ is typically used to exit the innermost loop when a specific condition is met.\
    \ This allows you to control the flow of execution within nested loop structures.\n\
    \n- Labeling Loops:\n   - In JavaScript, you can label loops using a label identifier.\
    \ The break statement can then be used with a label to specify which loop should\
    \ be terminated when there are nested loops.\n\n- Loop Skipping:\n   - In some\
    \ cases, the break statement is used not only to exit a loop but also to skip\
    \ the remaining iterations of the loop. This is particularly useful when a specific\
    \ condition is met, and further iterations are unnecessary.\n\n- Avoiding Infinite\
    \ Loops:\n   - In certain situations, the break statement is used as a safety\
    \ mechanism to avoid infinite loops. By incorporating a conditional check, the\
    \ loop can be exited when a certain condition is met, preventing the program from\
    \ running indefinitely.\n\n4. Conditional Terminations:\n   - The decision to\
    \ use a break statement is often based on a condition that, when true, indicates\
    \ that further iterations are unnecessary or undesirable. This condition might\
    \ be determined by external factors, user input, or specific calculations within\
    \ the loop.\n\n5. Versatility:\n   - The break statement provides versatility\
