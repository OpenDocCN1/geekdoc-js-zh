    In this example, JavaScript bitwise operators are demonstrated:


    # 1.Bitwise AND (&):


    +   o The & performs a bitwise AND operation between the binary representations
    of the numbers 5 and 3.


    # 2.Bitwise OR (|):


    +   o The | performs a bitwise OR operation between the binary representations
    of the numbers 5 and 3.


    # 3.Bitwise XOR (^):


    +   o The ^ performs a bitwise XOR (exclusive OR) operation between the binary
    representations of the numbers 5 and 3.


    # 4.Bitwise NOT (~):


    +   o The ~ performs a bitwise NOT (complement) operation on the binary representation
    of the number 5.


    # 5.Left Shift (<<):


    +   o The << shifts the binary representation of the number 5 one position to
    the left.


    # 6.Right Shift (>>):


    +   o The >> shifts the binary representation of the number 5 one position to
    the right.


    # 7.Unsigned Right Shift (>>>):


    +   o The >>> shifts the binary representation of the negative number -5 one position
    to the right, filling the leftmost positions with zeros.


