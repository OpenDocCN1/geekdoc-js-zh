    # # JS Let


    In JavaScript, the let keyword is used to declare variables. It was introduced
    in ECMAScript 6 (ES6) to provide a more flexible alternative to the older var
    keyword.


    # ## 1.Variable Declaration:


    +   - The let keyword is used to declare variables in JavaScript. When a variable
    is declared with let, it can be reassigned to a new value.


    # ## 2.Block Scope:


    +   - Variables declared with let have block scope. This means that the variable
    is only accessible within the block of code where it is defined. A block is typically
    defined by a pair of curly braces {}.


    # ## 3.Redeclaration:


    +   - Unlike variables declared with var, a variable declared with let cannot
    be redeclared within the same block. Attempting to redeclare a variable using
    let in the same block would result in an error.


    # ## 4.Hoisting:'
