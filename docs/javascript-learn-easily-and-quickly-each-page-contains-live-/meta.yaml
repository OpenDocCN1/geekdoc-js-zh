    ## JS Number Methods


    JavaScript provides a variety of methods associated with the Number object, which
    can be used to perform operations on numeric values.


    1. isNaN(value):

    - The isNaN(value) method checks if a value is NaN (Not a Number). It returns
    true if the value is NaN, and false if it is a valid number or can be converted
    to one.


    2. isFinite(value):

    - The isFinite(value) method checks if a value is a finite number (not Infinity
    or -Infinity). It returns true if the value is finite and can be represented as
    a number; otherwise, it returns false.


    3. parseFloat(string):

    - The parseFloat(string) method parses a string and returns the first floating-point
    number it encounters. It is useful for extracting numeric values from strings.


    4. parseInt(string, radix):

    - The parseInt(string, radix) method parses a string and returns an integer based
    on the provided radix (base). It is commonly used to convert strings (base) numbers
    into integers.


    5. toExponential(fractionDigits):

    - The toExponential(fractionDigits) method returns a string representing the number
    in exponential notation. The optional fractionDigits parameter specifies the number
    of digits after the decimal point.


    6. toFixed(digits):

    - The toFixed(digits) method returns a string representing the number with a fixed
    number of digits after the decimal point. It rounds the number if necessary.


    7. toPrecision(precision):

    - The toPrecision(precision) method returns a string representing the number with
    the specified precision. It includes both the integer and fractional parts of
    the number.


    8. toString(radix):

    - The toString(radix) method converts a number to a string based on the specified
    radix (base). This is useful for representing numbers in different numeral systems,
    such as binary or hexadecimal.


    9. valueOf():

    - The valueOf() method returns the primitive value of a Number object. It is automatically
    called by JavaScript when a numeric conversion is needed.


    10. toFixed(), toPrecision(), and toExponential() for String Formatting:

    - These methods are used to format numeric values for display, such as in user
    interfaces, where the number of decimal places or overall precision is important.


    11. Mathematical Operations:

    - While methods of the Number object, arithmetic operations (+, -, *, /) and the
    Math object provide various mathematical functions that are commonly used with
    numeric values.


    12. Constants:

    - The Number object includes constants such as Number.MAX_VALUE (the maximum representable
    number in JavaScript), Number.MIN_VALUE (the smallest positive representative
    number), and others.


    Understanding and utilizing these Number methods is essential for manipulating
    and formatting numeric values in JavaScript. These methods provide developers
    with tools for converting, formatting, and checking the properties of numeric
    values in their applications.


    ```javascript

    // JavaScript Number Methods Example

    ```


