    ## JS Typeof


    In JavaScript, the typeof operator is a built-in operator that is used to determine
    the data type of a given expression or variable.


    1. Data Type Identification:

    - The primary purpose of the typeof operator is to identify the data type of a
    value. It returns a string indicating the type of the operand.


    2. Unary Operator:

    - typeof is a unary operator, meaning it operates on only one operand. It is followed
    by the operand whose type is to be determined.


    3. String Result:

    - The result of the typeof operator is always a string. It returns a string representation
    of the data type of the operand.


    ## 4. Possible Return Values:


    - The possible return values include:

    - "undefined": Indicates that the operand is an undefined value.

    - "boolean": Indicates that the operand is a boolean.

    - "number": Indicates that the operand is a number.

    - "string": Indicates that the operand is a string.

    - "function": Indicates that the operand is a function.

    - "object": Indicates that the operand is an object.

    - "symbol": Indicates that the operand is a symbol.

    - "bigint": Indicates that the operand is a bigint.


