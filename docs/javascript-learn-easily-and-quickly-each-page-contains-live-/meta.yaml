    # JS Functions


    1.Abstraction:


    +   - Functions allow for abstraction, enabling developers to

    encapsulate a set of instructions into a single named

    entity. This promotes code organization and modularity.


    2.Reusability:


    +   - Once a function is defined, it can be reused throughout

    the code. This reduces redundancy and promotes a more

    efficient and maintainable codebase.


    3.Parameterization:


    +   - Functions can accept parameters, which are variables that

    act as placeholders for values. These parameters make

    functions flexible, allowing them to work with different

    inputs.


    4.Return Values:


    +   - Functions can produce a result using the return

    statement. The return value can be utilized by the calling

    code, allowing functions to generate outputs and

