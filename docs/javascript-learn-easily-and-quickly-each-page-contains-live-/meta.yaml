  md: 'In JavaScript, numbers are a primitive data type used to represent numerical
    values.


    +   1.Numeric Types:


    +   - JavaScript numbers represent both integers and floatingpoint numbers (decimal
    numbers). There is no distinction between integer and floating-point types.


    +   2.Floating-Point Representation:


    +   - All numbers in JavaScript, including integers, are internally represented
    as 64-bit floating-point numbers according to the IEEE 754 standard. This allows
    for a wide range of values but may lead to precision issues in certain calculations.


    +   3.Arithmetic Operations:


    +   - JavaScript supports various arithmetic operations on numbers, including
    addition (+), subtraction (-), multiplication (*), division (/), and modulo (%).


    +   4.Math Object:


    +   - JavaScript provides a Math object with methods for performing more complex
    mathematical operations, such as trigonometric functions, exponentiation, logarithms,
    and random number generation.


    +   5.Infinity and -Infinity:


    +   - JavaScript represents positive infinity as Infinity and negative infinity
    as -Infinity. These values are used to represent mathematical concepts such as
    division by zero or values exceeding the maximum representable number.


    +   6.NaN (Not-a-Number):


    +   - The special value NaN represents an undefined or unrepresentable value in
    JavaScript. It is often the result of invalid mathematical operations, such as
    dividing by zero.


    +   1.Precision and Rounding:


    +   - Due to the floating-point representation, JavaScript numbers may not always
    be precise. Some calculations may result in rounding errors, especially when dealing
    with decimal fractions.


