    \ `if` 块中的代码。\n\n- 2. else 语句：\n  - `else` 语句与 `if` 语句配合使用，在 `if` 条件为假时提供一个备选执行的代码块。如果\
    \ `if` 条件为真，则跳过 `else` 块中的代码。如果 `if` 条件为假，则执行 `else` 块中的代码。\n\n- 3. 互斥执行：\n  -\
    \ 执行块内的代码或 `else` 块内的代码，但不同时都执行。这根据条件的真或假值提供了一个互斥的选择。\n\n- 1. else if 语句（可选）：\n\
    \  - 为了处理多个条件，你可以使用 `else if` 语句。当之前的 `if` 或 `else` 条件为假时，它允许你检查额外的条件。将执行第一个匹配的条件块中的代码。\n\
    \n- 2. 嵌套 if 语句：\n  - 你可以将 `if` 语句嵌套在一起以处理更复杂的条件。只有当外部语句的条件为真时，才会评估内部的 `if` 语句。\n\
    \n## 3. 评估顺序：\n- 条件从上到下进行评估。一旦某个条件为真，就会执行相应的代码块，后续条件将不再被评估。\n\n## 4. 真值和假值：\n\
    \  - `if` 语句内部的条件根据其是真值（truthy）还是假值（falsy）进行评估。真值评估结果为真，假值评估结果为假。\n\n## 5. 三元运算符（替代）：\n\
    - 在某些情况下，`if` 和 `else` 语句可以用三元运算符 (`?:`) 替换。它提供了一种更简洁的方式表达条件语句。理解如何使用 `if` 和 `else`\
    \ 语句对于在 JavaScript 代码中创建决策结构至关重要。这些语句允许你根据条件控制程序的流，让你能够创建动态且响应的应用程序。\n\n```javascript\n\
    // JavaScript If-Else 示例\n\n// 数字比较\nlet num1 = 10;\nlet num2 = 5;\n\n// If-Else\
    \ 语句\nif (num1 > num2) {\n  console.log(num1 + \" is greater than \" + num2);\n\
    } else {\n  console.log(num1 + \" is not greater than \" + num2);\n}\n\n// 字符串比较\n\
    let string1 = \"apple\";\nlet string2 = \"orange\";\n\n// 字符串的 If-Else 语句\nif\
    \ (string1 === string2) {\n  console.log(string1 + \" is equal to \" + string2);\n\
    } else {\n  console.log(string1 + \" is not equal to \" + string2);\n}\n\n// 布尔值比较\n\
    let booleanValue = true;\n\n// 布尔值的 If-Else 语句\nif (booleanValue) {\n  console.log(\"\
    The value is true.\");\n} else {\n  console.log(\"The value is false.\");\n}\n\
    // JavaScript 比较示例结束\n```\n\n此示例演示了各种比较运算符：\n\n- 1. 数字比较：等于 (==), 不等于 (!, !==),\
    \ 大于 (>), 小于 (<), 大于等于 (>=), 小于 (<=)。\n- 2. 字符串比较：等于 (==), 不等于 (!=), 字典序大于 (>),\
    \ 小于 (<)。\n- 3. 布尔值比较：等于 (==), 不等于 (!=)。\n- 4. 显示比较结果：数字、字符串和布尔比较的结果使用控制显示。\n\n\
    ## JS Switch\n\n在 JavaScript 中，`switch` 语句是一种控制流语句，允许根据表达式执行不同的块。\n\n- 1. 表达式评估：\n\
    \  - `switch` 语句以括号内的表达式（通常是变量）开始。然后对该表达式进行评估。\n\n- 2. case 块：\n  - 紧随 `switch`\
    \ 语句之后有一个或多个 `case` 块。每个 `case` 包含一个与评估表达式比较的值。\n\n- 3. 匹配情况：\n  - 当评估表达式匹配某个\
    \ `case` 块的值时，将执行该块内部的代码。如果没有匹配，程序将移动到下一个 case。\n\n- 4. break 语句：\n  - 在执行 `case`\
    \ 块的代码后，使用 `break` 语句退出 `switch` 语句。这防止了程序穿透到下一个 case 块。\n\n- 1. default 情况（可选）：\n\
    \  - `default` 情况是可选的，用于指定当没有任何 `case` 块匹配时执行的代码。它类似于 `if-else` 结构中的 `else` 语句。\n\
    \n- 2. 穿透行为：\n  - 与某些其他语言不同，JavaScript 的 `switch` 语句具有穿透行为。如果 `case` 块不包含 `break`\
    \ 语句，无论条件是否满足，执行都会穿透到下一个 case 块。\n\n## 相等比较：\n- `switch` 语句中的比较是严格的（使用 `===`）。这意味着只有当值和类型都匹配时，才会执行\
    \ `case` 块。\n\n## 多重情况：\n- 你可以通过逗号分隔将多个值组合在单个 `case` 块中。如果任何值匹配评估表达式，将执行该 `case`\
    \ 块中的代码。\n\n`switch` 语句在需要针对单个变量或表达式检查多个条件时特别有用。在代码执行取决于单个变量值的情况下，它提供了一个比多个 `elseif`\
    \ 语句更清晰的替代方案。\n\n```javascript\n// JavaScript Switch 语句示例\n\n// 星期\nlet day =\
    \ \"Monday\";\nlet dayType;\n\n// Switch 语句\nswitch (day) {\n  case \"Monday\"\
    :\n  case \"Tuesday\":\n  case \"Wednesday\":\n    dayType = \"Weekday\";\n  \
    \  break;\n  default:\n    dayType = \"Unknown\";\n}\nconsole.log(dayType);\n\
    ```\n\n"
