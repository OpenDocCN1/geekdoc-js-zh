    +   Use Cases:


    +   const is often used for array variables when you want to ensure that the reference
    to the array remains constant throughout the scope of the variable. It''s helpful
    for preventing accidental reassignment and promoting code stability.


    +   Immutability Patterns:


    +   If you need an immutable array (i.e., an array whose elements cannot be changed),
    you may need to use techniques like creating a new array with modified elements
    instead of modifying the existing array in place.


