    \ of each element in the iterable on each iteration, and iterable is the object\
    \ iterated.\n- 3. Array Iteration:\n  - One of the most common use cases for for...of\
    \ is iterating over the elements of an array. The loop automatically retrieves\
    \ the values, simplifying the code compared to using a traditional for loop with\
    \ array indices.\n- 4. String Iteration:\n  - Strings are also iterable objects\
