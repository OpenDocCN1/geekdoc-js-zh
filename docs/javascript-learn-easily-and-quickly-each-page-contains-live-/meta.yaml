  mdcn: "\n在 JavaScript 中，数字是一种用于表示数值的基元数据类型。\n\n### 1. 数值类型：\n- JavaScript 数字同时表示整数和浮点数（小数）。整数类型和浮点类型之间没有区分。\n\
    \n### 2. 浮点数表示：\n- JavaScript 中的所有数字（包括整数）在内部都按照 IEEE 754 标准表示为 64 位浮点数。这允许表示宽范围的值，但在某些计算中可能会导致精度问题。\n\
    \n### 3. 算术运算：\n- JavaScript 支持对数字进行各种算术运算，包括加法 (+)、减法 (-)、乘法 (*)、除法 (/) 和取模 (%)。\n\
    \n### 4. Math 对象：\n- JavaScript 提供了一个 Math 对象，包含执行更复杂数学运算的方法，例如三角函数、幂运算、对数和随机数生成。\n\
    \n### 5. 无穷大和负无穷：\n- JavaScript 将正无穷大表示为 Infinity，将负无穷表示为 -Infinity。这些值用于表示数学概念，例如除以零或超过最大可表示的数值。\n\
    \n### 6. NaN (不是数字)：\n- 特殊值 NaN 代表 JavaScript 中未定义或无法表示的值。它通常是无效数学运算的结果，例如除以零。\n\
    \n### 1. 精度与四舍五入：\n- 由于浮点数表示法，JavaScript 数字并不总是精确的。某些计算可能会导致舍入误差，特别是在处理小数分数时。\n\
    \n### 2. 整数限制：\n- JavaScript 数字具有有限的精度，能够准确表示的最大和最小整数值存在限制。可以使用 `Number.MAX_SAFE_INTEGER`\
    \ 和 `Number.MIN_SAFE_INTEGER` 常量访问这些限制。\n\n## 3. 解析数字：\n- 可以 `parseInt()` 和 `parseFloat()`\
