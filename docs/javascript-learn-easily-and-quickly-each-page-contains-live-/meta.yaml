  md: '+   ○ Event listeners are used to attach event handlers to HTML elements. They
    "listen" for a specific event to occur on an element and execute the associated
    event handler when the event occurs.


    # Default Browser Behavior:


    +   ○ Many HTML elements have default behaviors associated with certain events.
    For example, clicking a link typically navigates to the linked page. JavaScript
    can be used to prevent or modify these default behaviors.


    # Bubbling and Capturing:


    +   ○ Event propagation in the DOM involves two phases: capturing phase and bubbling
    phase. Capturing occurs from the root to the target element, and bubbling occurs
    back up to the root. Event listeners can be set to capture or bubble, depending
    on the desired behavior.


    # Event Object:


    +   ○ When an event occurs, an event object is created that contains information
    about the event, such as the type of event, the target element, and any additional
    data related to the event.


    # Asynchronous Nature:


    +   ○ Events in JavaScript are often handled asynchronously. This means that event
    handlers do not block the execution of the rest of the program, allowing the program
    to continue running while waiting for events to occur.


    # Common Events:


    +   Some types of events include:

    - Click: Triggered when a mouse click occurs.

    - Mouseover/Mouseout: Triggered when the mouse enters or leaves an element.

    - Keydown/KeyPress: Triggered when a key is pressed or released.

    - Change: Triggered when a value of a form changes.

    - Submit: Triggered when a form is submitted.

    - Load/Unload: Triggered when a document is fully loaded or unloaded.


    # Event Delegation:


    +   ○ Event delegation is a technique where a single event listener is attached
    to a common ancestor of multiple elements. This allows you to handle events for
    multiple elements with a single event listener, improving efficiency.


    # Custom Events:


    +   ○ In addition to browser events, JavaScript allows the creation of custom
    events. Custom events enable developers to fire and dispatch their own events,
    enhancing the flexibility and extensibility of event handling.


    Understanding how to work with events in JavaScript is crucial for dynamic and
    interactive web applications. Events provide a way to respond to user actions
    and create a responsive and engaging user experience.


