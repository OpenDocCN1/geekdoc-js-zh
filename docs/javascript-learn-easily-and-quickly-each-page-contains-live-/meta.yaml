    ## JS Data Types


    In JavaScript, data types define the nature of the values that variables can hold.
    JavaScript is a dynamically typed language, meaning that variable types are determined
    at runtime.


    ### 1. Primitive Data Types:


    - Number: Represents numeric values. It includes integers and floating-point numbers.

    - String: Represents sequences of characters, such as text.

    - Boolean: Represents true or false values.

    - Undefined: Represents a variable that has been declared but not assigned a value.

    - Null: Represents the absence of a value or a reference to an object.

    - Symbol: Introduced in ECMAScript 6 (ES6), symbols are unique and immutable data
    types often used as identifiers for properties.


    ### 2. Object Data Type:


    - The Object data type is a complex data type that allows you to group related
    data and functions together. Objects are instances of user-defined or built-in
    classes and consist of key-value pairs.


    ### 3. Function Data Type:


    - In JavaScript, functions are considered a distinct data type. Functions can
    be assigned to variables.


    ### 4. Array Data Type:


    - Arrays are a type of object used to store collections of values.


    ## Special Values:


    - Infinity: Represents positive infinity.

    - -Infinity: Represents negative infinity.

    - NaN (Not a Number): Represents an invalid numerical result.

    - BigInt: Introduced in ECMAScript 2020, BigInt represents arbitrary-precision
    integers.


    ## Primitive Objects:


    - Number, String, Boolean: These provide methods associated with primitive types.


    ## Typeof Operator:


    - The typeof operator is used to determine the type of an operand.


    ## Dynamic Typing:


    - JavaScript is dynamically typed, meaning that variables can change types during
    runtime.


    ## Coercion:


    - JavaScript performs conversion of one data type to another implicitly or explicitly.

