    # JS Array Const


    In JavaScript, the const keyword is used to declare constants, which are variables
    whose values cannot be reassigned after they are initially set. When const is
    used with arrays, it doesn''t make the array immutable; instead, it prevents the
    variable from being reassigned to a different array.


    +   1.Array Reference Immutability:

    - When an array is declared using const, the reference to the array cannot be
    reassigned. This means that the variable itself (holding the reference) cannot
    point to a different array.


    +   2.Array Elements Mutability:

    - However, using const does not make the individual elements of the array immutable.
    You can still modify the contents of the array, including adding, removing, or
    modifying elements.


    +   3.Preventing Reassignment:

    - If you declare an array using const, attempting to reassign the variable to
    a different array will result in an error. This is useful for preventing accidental
    reassignment and ensuring that the variable consistently refers to the same array.


