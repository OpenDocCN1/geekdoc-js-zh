    - 1. Common Array Operations:

    Arrays support various operations, such as adding elements (push() and unshift()),
    removing elements (pop() and shift()), and slicing and concatenating arrays.


    - 2. Iteration:

    Arrays can be iterated using loops (e.g., for loop) or higher-order functions
    like forEach(), map(), filter(), and reduce().


    - 3. Array Methods:

    JavaScript provides built-in methods for performing common operations, such as
    concat(), slice(), indexOf(), includes(), and more.


    - 4. Nested Arrays:

    Arrays can contain other arrays, creating nested structures. This allows for the
    creation of multidimensional arrays or more complex data structures.


    - 5. Object-Like Behavior:

    In JavaScript, arrays are objects with integer-based keys, and they inherit from
    the Array prototype. However, they also have array-specific methods and behaviors.


    - 6. Array Literals:

    Arrays can be created using array literals, which involve enclosing a list of
    values within square brackets ([]).


    - 7. Sparse Arrays:

    JavaScript allows for sparse arrays, where certain indices may not have corresponding
    elements. The length property reflects the highest index in the array.


    - 8. Destructuring Assignment:

    Array elements can be easily extracted and assigned using destructuring syntax.


    - 9. Use Cases:

    Arrays are widely used for tasks such as storing collections of data, representing
    sequences, implementing stacks and queues, and managing ordered sets of elements.


