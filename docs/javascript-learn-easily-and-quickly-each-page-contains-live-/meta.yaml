    \ 块，防止执行后续的 `case`。\n\n- 嵌套循环：\n   - 在嵌套循环中，`break` 语句通常用于在满足特定条件时退出内层循环。这允许你控制嵌套循环结构中的执行流。\n\
    \n- 标记循环：\n   - 在 JavaScript 中，你可以使用标签标识符对循环进行标记。此时 `break` 语句可以配合标签使用，以在存在嵌套循环时指定应终止哪一个循环。\n\
