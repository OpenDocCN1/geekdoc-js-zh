  md: '+   ○ BigInt literals are created by appending n or N to the end of an integer
    literal. For example, 123n represents a BigInt with the value 123.


    # 3.Usage:


    +   ○ BigInt is typically used when dealing with integers that exceed the maximum
    safe integer value (Number.MAX_SAFE_INTEGER) or when precision is crucial in mathematical
    calculations.


    # 4.Arithmetic Operations:


    +   ○ BigInt supports standard arithmetic operations, such as addition, subtraction,
    multiplication, and division. When performing operations involving BigInt and
    regular numbers, the result is always a BigInt.


    # 5.Loss of Precision:


    +   ○ Regular JavaScript numbers have a finite precision, and operations involving
    very large or small numbers may result in rounding errors. BigInt is not subject
    to this limitation, providing accurate results for integer arithmetic.


    # 1.Math Object:


    +   ○ The Math object in JavaScript does not have methods that directly support
    BigInt. Instead, mathematical operations involving BigInt are performed using
    standard arithmetic operators.


    # 2.Comparisons:


    +   ○ When comparing values, BigInt can be compared with other BigInt values or
    regular numbers. The result is based on numerical comparison without any type
    coercion.


    # 3.Type Coercion:


    +   ○ BigInt values and regular numbers are distinct types, and operations between
    them result in a BigInt. However, attempts to perform operations like addition
    or subtraction between a BigInt and a non-integer type (e.g., a string or boolean)
    will result in a TypeError.


    # 4.Limited Use Cases:'
