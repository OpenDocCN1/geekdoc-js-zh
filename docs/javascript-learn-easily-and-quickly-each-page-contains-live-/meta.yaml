- img_proc: true
  md: '+   o Variables declared with let are hoisted to the top of their block, but
    they are not initialized until the declaration statement is encountered. This
    means that, unlike var, a variable declared with let is not accessible before
    its declaration in the code.


    # Temporal Dead Zone (TDZ):


    +   o The concept of the Temporal Dead Zone (TDZ) is related to hoisting with
    let. During the TDZ, trying to access a let variable before its declaration results
    in a runtime error. This enforces a cleaner scoping behavior compared to var.


    # Global Object Property:


    +   o Unlike variables declared with var, variables declared with let do not become
    properties of the global object (window in browsers). This avoids potential conflicts
    and unintended global variable declarations.


    # For Loops and Closure:


    +   o let is commonly used in loops for loops to create a new variable for each
    iteration, preventing closure-related issues that might occur when using var.
    This behavior is often referred to as "block-scoped loop variables."


    # Conditional Statements:


    +   o Variables declared with let in an if statement or any other block-scoped
    structure are confined to that specific block. This ensures that the variable
    is isolated and does not leak into the outer scope.


    # Function Scope:


    +   o Unlike var, which has function scope, variables declared with let have block
    scope even within functions. This allows for more fine-grained control over variable
    visibility and reduces the likelihood of unintended variable leaks.'
