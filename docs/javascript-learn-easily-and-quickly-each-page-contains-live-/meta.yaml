    be separated by line breaks in many cases, using semicolons is a recommended practice
    to avoid potential issues.


    +   3. Whitespace:

    - Whitespace, including spaces and line breaks, is generally ignored by JavaScript.
    However, proper indentation and spacing are crucial for code readability. Developers
    often follow a consistent indentation style to enhance the visual structure of
    the code.


    +   4. Comments:

    - JavaScript supports both single-line comments (prefixed with //) and multi-line
    comments (enclosed between /* and */). Comments are ignored during code execution
    and are used to provide explanations or disable code temporarily.


