    # JS Const


    In JavaScript, the const keyword is used to declare constants. Constants are variables
    whose values cannot be reassigned after their initial assignment.


    +   1.Constant Declaration:

    The const keyword is used to declare constants in JavaScript. When a variable
    is declared with const, its value must be assigned at the time of declaration,
    and once assigned, the value cannot be changed.


    +   2.Immutable Values:

    Constants are designed to represent values that should not be modified during
    the execution of a program. Once a value is assigned to a const variable, any
    attempt to reassign a new value to that variable results in an error.


    +   3.Block Scope:

    Similar to variables declared with let, variables declared with const have block
    scope. This means that the constant is only accessible within the block of code
    where it is defined.


    +   4.Hoisting:

    Like variables declared with let, variables declared with const are hoisted to
    the top of their block. However, unlike var, they are not initialized until the
    declaration statement is encountered. Attempting to access a const variable before
    its declaration results in a runtime error.


