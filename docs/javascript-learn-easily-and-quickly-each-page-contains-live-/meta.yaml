    ## JS Number 方法


    JavaScript 提供了与 Number 对象相关的多种方法，可用于对数值执行操作。


    1. isNaN(value):

    -   isNaN(value) 方法检查一个值是否为 NaN（不是数字）。如果该值是 NaN，则返回 true；如果它是有效数字或可以转换为数字，则返回
    false。


    2. isFinite(value):

    -   isFinite(value) 方法检查一个值是否为有限数字（不是 Infinity 或 -Infinity）。如果该值是有限的且可以表示为数字，则返回
    true；否则返回 false。


    3. parseFloat(string):

    -   parseFloat(string) 方法解析字符串并返回它遇到的第一个浮点数。它常用于从字符串中提取数值。


    4. parseInt(string, radix):

    -   parseInt(string, radix) 方法解析字符串并根据提供的基数（radix）返回一个整数。它通常用于将字符串格式的（基）数字转换为整数。


    5. toExponential(fractionDigits):

    -   toExponential(fractionDigits) 方法返回一个用科学计数法表示数字的字符串。可选的 `fractionDigits` 参数指定小数点后的位数。


    6. toFixed(digits):

    -   toFixed(digits) 方法返回一个带有小数点后固定位数数字的字符串。必要时，它会对数字进行四舍五入。


    7. toPrecision(precision):

    -   toPrecision(precision) 方法返回一个具有指定精度的数字字符串。它包含了数字的整数和小数部分。


    8. toString(radix):

    -   toString(radix) 方法根据指定的基数（radix）将数字转换为字符串。这有助于在不同的进制系统（如二进制或十六进制）中表示数字。


    9. valueOf():

    -   valueOf() 方法返回 Number 对象的原始值。JavaScript 在需要数值转换时会自动调用该方法。


    10. 用于字符串格式化的 toFixed(), toPrecision(), 和 toExponential()：

    -   这些方法用于格式化数值以供显示，例如在用户界面中，此时小数的位数或整体精度非常重要。


    11. 算术操作:

    -   虽然有 Number 对象的方法，但算术操作（+, -, *, /）以及 Math 对象提供了常用于数值的各种数学函数。


    12. 常量:

