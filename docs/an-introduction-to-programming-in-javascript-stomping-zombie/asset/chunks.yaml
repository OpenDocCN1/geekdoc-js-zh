  trans: "\n\n我们经常做的事情有一些快捷方式。例如，如果我们想给一个变量加上一个数并将新结果保存到该变量，可以这样做：\n\n```\nundead\
    \ = undead + 12;\n```\n\n一个快捷方式是使用 `+=` 运算符，其效果与上面相同。\n\n```\nundead += 12;\n\
    ```\n\n这不仅适用于加法，也适用于所有算术运算符。\n\n```\nundead = undead - 7\n```\n\n等价于\n\n```\n\
    undead -= 7\n```\n\n```\nundead = undead * 7\n```\n\n等价于\n\n```\nundead *= 7\n\
    ```\n\n```\nundead = undead / 7\n```\n\n等价于\n\n```\nundead /= 7\n```\n\n```\n\
    undead = undead % 7\n```\n\n等价于\n\n```\nundead %= 7\n```\n\n有一种算术运算非常常见，以至于它有一个比使用\
    \ `+=` 更短的快捷方式。要将值增加 1，可以在变量后添加 `++`（使用 `--` 可以减少 1）。\n\n```\nundead += 1 等价于\
    \ undead++\n```\n\n```\nundead -= 1 等价于 undead--\n```\n\n#### 试试看：\n\nCodepen\
    \ 演示：[`codepen.io/undeadinstitute/pen/QWEZPXP`](https://codepen.io/undeadinstitute/pen/QWEZPXP)\n\
    \n文件演示：[`undead.institute/files/zombie-programming/005-zombie-math-shortcuts.html`](https://undead.institute/files/zombie-programming/005-zombie-math-shortcuts.html)\n\
    \n`++` 和 `--` 有一个小特性，偶尔会派上用场。你也可以将 `++` 或 `--` 放在变量前面。\n\n```\n++undead;\n--undead;\n\
    ```\n\n它仍然会递增或递减变量。但是，如果 `++` 或 `--` 放在变量后面，则变量会在查看变量/桶的内容*之前*递增或递减。如果 `++` 或\
    \ `--` 放在变量名前面，则变量/桶会在被查看之前递增或递减（参见下面的示例）。如果语句单独成行，那么是在之前还是之后递增或递减关系不大，这些语句是等价的。但如果它用在另一个\
    \ JavaScript 语句中，结果可能会改变。\n\n例如：\n\n```\nlet undead = 10; let zombie = 17 + undead++;\n\
    ```\n\n会将 `zombie` 设置为 28，`undead` 设置为 11；而\n\n```\nlet undead = 10; let zombie\
    \ = 17 + ++undead;\n```\n\n会将 `zombie` 设置为 27，`undead` 设置为 11。\n\n#### 试试看：\n\n\
    Codepen 演示：[`codepen.io/undeadinstitute/pen/WNxYQbw`](https://codepen.io/undeadinstitute/pen/WNxYQbw)\n\
    \n文件演示：[`undead.institute/files/zombie-programming/006-incremetal-apocalypse.html`](https://undead.institute/files/zombie-programming/006-incremetal-apocalypse.html)\n\
    \n## 逻辑混乱的僵尸\n\n由于变量几乎可以保存任何值，因此很难跟踪变量/桶应该保存什么。随着复杂性的增加，这个问题会加剧。但你可以通过使用 if-then\
    \ 语句来弄清楚变量中有什么。这些语句允许你测试一个条件（if）并根据结果执行某些操作（then）。\n\n以下是 if-then 语句的样子，其中 if\
    \ 测试 `undead` 和 `zombie` 是否相等（我们稍后会讨论你可以进行的不同测试）：\n\n```\nif( undead == zombie\
    \ ) { //停止尸群 }\n```\n\n如果 `undead` 和 `zombie` 相等，那么你放在花括号中的任何代码都会运行。（这类似于 CSS，当元素匹配选择器时，浏览器会应用花括号中的规则。）如果\
    \ `undead` 和 `zombie` 不相等，那么浏览器会跳过花括号中的任何代码。\n\n以下是我们可以使用的逻辑运算符：\n\n### 等于：\n\n\
    `undead == zombie` 和 `undead === zombie` 测试相等性。\n\n三个等号比两个等号更严格，通常你会想使用它。\n\n\
    ![](img/livingtip-jsloops.png)\n\n#### 活尸小贴士：\n\n事物怎么会或多或少相等（除了《动物农场》之外）？这是因为计算机节省内存的一种方式。我们的桶比喻在这里会有点失效，但假设我们有一个装满复杂东西的桶，比如一条面包。那里有很多信息。它很复杂，而且占用空间。\n\
    \n人类抵抗军指挥官需要查看可用的补给，但他正和抵抗军战士们在野外。我们可以创建面包的副本或 3D 模型（在这个计算机化的例子中超级简单），但这会占用和原物一样多的空间，我们可能会用完桶。我们还得把面包或模型运送到他那里，当你有相当多的桶需要运输时，这可能会变得复杂。\n\
    \n所以我们改为给面包拍张照片。通俗地说，面包和照片是等价的，因为一个是面包，另一个指向或代表同一个面包的照片。（在计算机科学中，我们类比中的照片被称为指针，因为它“指向”原物。）这就是双等号\
    \ `==` 的相等级别。三等号 `===` 则是试图判断两条面包是否相同，或者更确切地说，其中一条是否不是另一条的指针/照片。\n\n在代码中，简化的版本可能如下所示：\n\
    \n```\n7 == \"7\" //true\n7 === \"7\" //false\n```\n\n### 小于：\n\n`undead < zombie`\n\
    \n假设 `undead` 等于 10。`undead` 的值是否小于 `zombie` 的值？要使此条件返回 true，`zombie` 必须大于 10（例如\
    \ 11、12、10.1、312 等）。如果 `zombie` 为 10 或更小（例如 9、10、7、-437 等），则返回 false。\n\n### 大于：\n\
    \n`undead > zombie`\n\n`undead` 的值是否大于 `zombie` 的值？如果 `undead = 10`，则 true 值包括\
    \ 9、8、-10、0 等。false 值包括 10、11、412 等。\n\n### 小于或等于：\n\n`undead <= zombie`\n\n`undead`\
    \ 的值是否小于或等于 `zombie` 的值？如果 `undead = 10`，true 值包括 10、11、1017 等。false 值包括 9.9、-78、6\
    \ 等。（你也可以使用 `<==` 来强制使用更严格的相等形式。）\n\n### 大于或等于：\n\n`undead >= zombie`\n\n`undead`\
    \ 的值是否大于或等于 `zombie` 的值？如果 `undead = 10`，true 值包括 10、9、-7 等。false 值包括 11、10.1、371\
    \ 等。（你也可以使用 `>==` 来强制使用更严格的相等形式。）\n\n### 不等于：\n\n`undead != zombie`\n\n`undead`\
    \ 和 `zombie` 的值是两个不同的东西。如果 `undead = 10`，true 值包括 9、17、38、-239 等，而 false 值是 10。没有其他\
    \ false 值。（你也可以使用 `!==` 来强制使用更严格的不等形式。）\n\n基于 if 你还可以做一件事，但这不是必需的。它被称为 else 语句，它允许你在条件为真时（then）做一件事，在条件为假时（else）做另一件事。它看起来像这样：\n\
    \n```\nif( undead === zombie ) {\n  //停止尸群\n} else {\n  //停止传染\n}\n```\n\n因此，如果\
    \ `undead` 和 `zombie` 相等，浏览器将“停止尸群”。如果不相等（else），它将“停止传染”。\n\n#### 试试看：\n\nCodepen\
    \ 演示：[`codepen.io/undeadinstitute/pen/MWezKez`](https://codepen.io/undeadinstitute/pen/MWezKez)\n\
    \n文件演示：[`undead.institute/files/zombie-programming/007-logically-its-the-apocalypse.html`](https://undead.institute/files/zombie-programming/007-logically-its-the-apocalypse.html)\n\
    \n如果你需要测试多个条件，可以使用 else if，从而进一步细分程序的响应方式。例如，如果两个值相等，你可能想要“停止尸群”。但如果它们不相等，你可能想要在其中一个更大时“停止更大的尸群”，在其中一个更小时“停止更小的尸群”。\n\
    \n```\nif( undead === zombie ) {\n  //停止尸群\n} else if (undead > zombie) {\n  //停止更大的尸群\n\
    } else {\n  //停止更小的尸群\n}\n```\n\n你可以根据需要创建任意多个这样的 if-else-if 链。你也可以根据程序中合理的变量来细化你想要执行的操作。\n\
    \n你可以使用 AND（`&&`）和 OR（`||`）组合条件。\n\n**AND** 表示两个语句都必须为真才能执行 then 部分。AND 由两个与符号表示：\n\
    \n```\nif( undead === zombie && zombie > human ) {\n  //停止尸群\n} else {\n  //停止传染\n\
    }\n```\n\n"
- fmt: "\n`Undead` and `zombie` must be equal AND `zombie` must be greater than `human`\
    \ for the browser to “stop horde.” If neither of them is true, or if only one\
    \ or the other is true, a “stop contagion” will be done.\n\n**OR** means that\
    \ if either statement is true or if both are true, then “stop horde” will be done.\n\
    \n```\nif( undead === zombie || zombie > human ) {\n  //stop horde\n} else {\n\
    \  //stop contagion\n}\n```\n\nIf `undead` and `zombie` are equal or if `zombie`\
    \ is greater than `human` or both, “stop horde” will be done. The only way “stop\
    \ contagion” will happen is if `undead` and `zombie` are not equal *and* `human`\
    \ is greater than `zombie`.\n\n#### Try it Out:\n\nCodepen Demo: [https://codepen.io/undeadinstitute/pen/OJXaMmO](https://codepen.io/undeadinstitute/pen/OJXaMmO)\n\
    \nFile Demo: [https://undead.institute/files/zombie-programming/008-if-hes-not-human-and-not-a-zombie.html](https://undead.institute/files/zombie-programming/008-if-hes-not-human-and-not-a-zombie.html)\n\
    \n![](images/livingtip-jsloops.png)\n\n#### Night of the Living Tip:\n\nBecause\
    \ we often test for `true` and `false`, changing everything to a literal `true`\
    \ or `false` or writing a specific test would be additional work every time we’re\
    \ testing something. So, as a shortcut, most programming languages (including\
    \ JavaScript) count several values as `false` that aren’t technically `false`.\
    \ For instance, if an expression or variable evaluates to `0`, it’s counted as\
    \ `false`. If it’s any other numeric value, it will evaluate as `true`. In this\
    \ way, you might see a single value (this is a rather contrived example, but hopefully\
    \ it will make sense).\n\n```\nlet undead = 0;\nif ( undead ) {\n  //stop horde\n\
    } else {\n  //stop contagion\n}\n```\n\nIn that example, `undead` being equal\
    \ to `0` would evaluate as `false` and “stop contagion” would be done.\n\nOther\
    \ values that evaluate to `false` include `null` (meaning an empty variable/one\
    \ without a value), `undefined` (a variable that has never been set), an empty\
    \ string represented by two double or single quotation marks next to each other\
    \ `“”` or `‘’`, and `NaN` which stands for not a number. You see it when you try\
    \ to do numbery things with non-numbers, such as `“12” / 2` (remember that anything\
    \ in quotation marks is treated as a string, not a number) or on the protest signs\
    \ of a populace being barcoded by an authoritarian human settlement.\n\n**Note:**\
    \ this test works best on primitive types: numbers, strings, and so on. It may\
    \ not work on more complicated types like arrays (we’ll discuss these later).\n\
    \n#### Try it Out:\n\nCodepen Demo: [https://codepen.io/undeadinstitute/pen/ZEOmvjN](https://codepen.io/undeadinstitute/pen/ZEOmvjN)\n\
    \nFile Demo: [https://undead.institute/files/zombie-programming/009-zombie-brain-is-null.html](https://undead.institute/files/zombie-programming/009-zombie-brain-is-null.html)\n\
    \n## Getting Loopy with Zombies\n\nThe next important thing in JavaScript—and\
    \ in other programming languages—is the loop. Loops are just what they sound like,\
    \ they do some code again and again and again until they hit a stopping condition.\
    \ There are two main types of loops (with a couple variations): the `for` loop\
    \ and the `while` loop.\n\n`for` loops run whatever code you place between the\
    \ curly brackets for a set number of iterations.\n\n![](images/livingtip-jsloops.png)\n\
    \n#### Night of the Living Tip:\n\nThe letters `i`, `j`, and `k` are traditionally\
    \ used as loop counters (a variable that counts the number of iterations used.\
    \ You don’t have to use these as your counter values, but if you don’t, name your\
    \ counters clearly. For clearer code, it’s best not to use `i`, `j`, or `k` for\
    \ any other kind of variable.\n\nA traditional `for` loop in JavaScript looks\
    \ like this:\n\n```\nfor( let i = 0; i < 10; i++ ) {\n  //stop zombies 10 times\n\
    }\n```\n\n#### Try it Out:\n\nCodepen Demo: [https://codepen.io/undeadinstitute/pen/bGeQaZx](https://codepen.io/undeadinstitute/pen/bGeQaZx)\n\
    \nFile Demo: [https://undead.institute/files/zombie-programming/010-zombie-loop-de-loop.html](https://undead.institute/files/zombie-programming/010-zombie-loop-de-loop.html)\n\
    \n![](images/livingtip-jsloops.png)\n\n#### Night of the Living Tip:\n\nYou’ll\
    \ notice that the `i` counter started at zero instead of one. This is not a requirement,\
    \ but it can make things easier in the long run. The reason is that computers\
    \ start counting at 0 rather than at 1. (Like some zombies, computers don’t have\
    \ fingers to count on.) So later, when we work on arrays, their indexes start\
    \ at 0 rather than at 1, and if you start your `for` loop at 1, you’ll skip the\
    \ first array element, and the zombies will win. (If that made little sense, no\
    \ worries. We’ll get there.)\n\nThe `for` loop itself (inside the parentheses)\
    \ is three statements in one. First (`let i = 0;`), you instantiate the counter\
    \ or just set it to an initial value. Next (`i < 10`), you set the conditional\
    \ for how long to continue the loop (i.e., while `i` is less than 10, keep running\
    \ all the code between the curly brackets). Finally (`i++`), you’re setting how\
    \ fast you go from the initial value (`i = 0`) to the end condition (when `i`\
    \ is greater than or equal to 10). In most cases, that’s by an increment of 1\
    \ (`i++`), but it could be a decrement (`i--`) or you could do it by more than\
    \ 1 depending on your needs (`i += 2`, etc.).\n\nBe careful that you don’t set\
    \ up a condition that will never come about, or the loop will go on forever, and\
    \ the zombies will win. For instance, if your condition is `i < 10`, and you decrement\
    \ instead of increment, then `i` will always be less than 10, and your loop will\
    \ never exit. (I’ve done this myself more times than there are zombies in a horde,\
    \ so if you find your browser hanging or repeating something well beyond the number\
    \ of times you anticipate, it’s best to just close the browser window, fix your\
    \ code, and then reopen the page. Hopefully you’ll be free of the infinite loops\
    \ that’ll eat your brain like a zombie with an empty stomach).\n\n```\nlet horde\
    \ = 0;\nlet humans = 100;\nfor( let i = 0; i < 10; i++) {\n  horde += 10;\n  humans\
    \ -= 10;\n}\n//perform the same task using a decrementing loop\nlet horde = 0;\n\
    let humans = 100;\nfor( let j = 10; j < 1; j--) {\n  horde += 10;\n  humans -=\
    \ 10;\n}\n```\n\n#### Try it Out:\n\nCodepen Demo: [https://codepen.io/undeadinstitute/pen/JjKepGE](https://codepen.io/undeadinstitute/pen/JjKepGE)\n\
    \nFile Demo: [https://undead.institute/files/zombie-programming/011-loopy-little-zombies.html](https://undead.institute/files/zombie-programming/011-loopy-little-zombies.html)\n\
    \nThe `for` loop examples above, assume you have something numeric to compare.\
    \ What if there isn’t a set number of times to run something or a numeric comparison\
    \ just isn’t appropriate? That’s where the second kind of loop comes in, the `while`\
    \ loop.\n\nThe `while` loop tells the browser to keep looping *while* a condition\
    \ is true.\n\n```\nlet george = “zombie”, stillAZombie = true;\nwhile( stillAZombie\
    \ ) {\n  if( george == “zombie” ) {\n    tryToCure( george );\n  } else {\n  \
    \  stillAZombie = false;\n  }\n}\n```\n\nThe example above checks whether the\
    \ `stillAZombie` variable is `true`. If it is, it checks whether the `george`\
    \ variable holds a string of “zombie.” If it does, the program tries a cure on\
    \ `george`. If the `tryToCure` function succeeds, then the `george` variable will\
    \ no longer hold “zombie,” the `if` test will fail, and the `else` section will\
    \ be executed, setting `stillAZombie` to `false` and ending the loop the next\
    \ time the `while` loop checks whether `stillAZombie` is `true`.\n\nThe `while`\
    \ loop has a half-brother called the `do-while` loop. `do-while` loops are used\
    \ when you want to put the conditional at the end of the loop (i.e., you want\
    \ to run the statements in the loop at least once).\n\n```\nlet george = “zombie”,\
    \ stillAzombie = true;\ndo {\n  if( george == “zombie” ) {\n    tryToCure( george\
    \ );\n  } else {\n    stillAZombie = false;\n  }\n} while( stillAZombie );\n```\n\
    \n#### Try it Out:\n\nCodepen Demo: [https://codepen.io/undeadinstitute/pen/zYBMRoB](https://codepen.io/undeadinstitute/pen/zYBMRoB)\n\
    \nFile Demo: [https://undead.institute/files/zombie-programming/012-while-zombie-freak-out.html](https://undead.institute/files/zombie-programming/012-while-zombie-freak-out.html)\n"
