  trans: "\n\n`Undead` 和 `zombie` 必须相等，并且 `zombie` 必须大于 `human`，浏览器才会执行“停止尸群”。如果两者都不成立，或者只有其中一个成立，则会执行“停止传染”。\n\
    \n**OR** 表示如果任一语句为真，或者两者都为真，则执行“停止尸群”。\n\n```\nif( undead === zombie || zombie\
    \ > human ) {\n  //stop horde\n} else {\n  //stop contagion\n}\n```\n\n如果 `undead`\
    \ 和 `zombie` 相等，或者 `zombie` 大于 `human`，或者两者都成立，则执行“停止尸群”。只有当 `undead` 和 `zombie`\
    \ 不相等 *并且* `human` 大于 `zombie` 时，才会执行“停止传染”。\n\n#### 动手试试：\n\nCodepen 演示：[`codepen.io/undeadinstitute/pen/OJXaMmO`](https://codepen.io/undeadinstitute/pen/OJXaMmO)\n\
    \n文件演示：[`undead.institute/files/zombie-programming/008-if-hes-not-human-and-not-a-zombie.html`](https://undead.institute/files/zombie-programming/008-if-hes-not-human-and-not-a-zombie.html)\n\
    \n![](img/livingtip-jsloops.png)\n\n#### 活死人之夜小贴士：\n\n由于我们经常测试 `true` 和 `false`，每次测试时都将所有内容改为字面量\
    \ `true` 或 `false`，或者编写特定的测试，都会增加额外的工作。因此，作为一种快捷方式，大多数编程语言（包括 JavaScript）会将一些并非严格意义上的\
    \ `false` 的值视为 `false`。例如，如果某个表达式或变量求值为 `0`，则被视为 `false`。如果是其他任何数值，则会被视为 `true`。这样，你可能会看到单个值（这个例子有点牵强，但希望你能理解）。\n\
    \n```\nlet undead = 0;\nif ( undead ) {\n  //stop horde\n} else {\n  //stop contagion\n\
    }\n```\n\n在这个例子中，`undead` 等于 `0` 会被视为 `false`，因此会执行“停止传染”。\n\n其他被视为 `false` 的值包括：`null`（表示空变量/没有值的变量）、`undefined`（从未被赋值的变量）、由两个双引号或单引号相邻表示的空字符串\
    \ `“”` 或 `‘’`，以及 `NaN`（表示非数字）。当你尝试对非数字进行数字运算时，就会看到它，例如 `“12” / 2`（记住，引号内的任何内容都被视为字符串，而不是数字），或者出现在被威权人类定居点打上条形码的民众抗议标语上。\n\
    \n**注意：** 这种测试最适用于原始类型：数字、字符串等。对于更复杂的类型（如数组，我们稍后会讨论），可能不适用。\n\n#### 动手试试：\n\n\
    Codepen 演示：[`codepen.io/undeadinstitute/pen/ZEOmvjN`](https://codepen.io/undeadinstitute/pen/ZEOmvjN)\n\
    \n文件演示：[`undead.institute/files/zombie-programming/009-zombie-brain-is-null.html`](https://undead.institute/files/zombie-programming/009-zombie-brain-is-null.html)\n\
    \n## 与僵尸一起循环\n\nJavaScript 以及其他编程语言中下一个重要的内容是循环。循环正如其名，它们会一遍又一遍地执行某些代码，直到达到停止条件。主要有两种类型的循环（以及一些变体）：`for`\
    \ 循环和 `while` 循环。\n\n`for` 循环会在大括号内放置的代码上运行固定次数的迭代。\n\n![](img/livingtip-jsloops.png)\n\
    \n#### 活死人之夜小贴士：\n\n字母 `i`、`j` 和 `k` 传统上用作循环计数器（用于统计迭代次数的变量）。你不必非得使用这些作为计数器值，但如果不使用，请清晰地命名你的计数器。为了代码更清晰，最好不要将\
    \ `i`、`j` 或 `k` 用于其他类型的变量。\n\nJavaScript 中传统的 `for` 循环如下所示：\n\n```\nfor( let i\
    \ = 0; i < 10; i++ ) {\n  //stop zombies 10 times\n}\n```\n\n#### 动手试试：\n\nCodepen\
    \ 演示：[`codepen.io/undeadinstitute/pen/bGeQaZx`](https://codepen.io/undeadinstitute/pen/bGeQaZx)\n\
    \n文件演示：[`undead.institute/files/zombie-programming/010-zombie-loop-de-loop.html`](https://undead.institute/files/zombie-programming/010-zombie-loop-de-loop.html)\n\
    \n![](img/livingtip-jsloops.png)\n\n#### 活死人之夜小贴士：\n\n你会注意到 `i` 计数器从零开始而不是从一开始。这不是强制要求，但从长远来看，这会让事情更简单。原因是计算机从\
    \ 0 开始计数，而不是从 1 开始。（就像某些僵尸一样，计算机没有手指可以数数。）因此，稍后当我们处理数组时，它们的索引从 0 开始而不是从 1 开始，如果你从\
    \ 1 开始 `for` 循环，就会跳过第一个数组元素，僵尸就会获胜。（如果这听起来不太明白，别担心，我们后面会讲到。）\n\n`for` 循环本身（括号内）实际上是三个语句合为一体。首先（`let\
    \ i = 0;`），你实例化计数器或将其设置为初始值。其次（`i < 10`），你设置循环继续的条件（即，当 `i` 小于 10 时，持续运行大括号内的所有代码）。最后（`i++`），你设置从初始值（`i\
    \ = 0`）到结束条件（当 `i` 大于或等于 10 时）的步进速度。大多数情况下，步进为 1（`i++`），但也可以是递减（`i--`），或者根据需求步进大于\
    \ 1（`i += 2` 等）。\n\n注意不要设置一个永远无法达到的条件，否则循环会无限进行下去，僵尸就会获胜。例如，如果你的条件是 `i < 10`，而你使用了递减而不是递增，那么\
    \ `i` 将始终小于 10，循环永远不会退出。（我自己犯这种错误的次数比尸群中的僵尸还多，所以如果你发现浏览器卡住或重复执行远超预期的次数，最好直接关闭浏览器窗口，修复代码，然后重新打开页面。希望你能摆脱那些像饿肚子僵尸一样吞噬你大脑的无限循环。）\n\
    \n```\nlet horde = 0;\nlet humans = 100;\nfor( let i = 0; i < 10; i++) {\n  horde\
    \ += 10;\n  humans -= 10;\n}\n//perform the same task using a decrementing loop\n\
    let horde = 0;\nlet humans = 100;\nfor( let j = 10; j < 1; j--) {\n  horde +=\
    \ 10;\n  humans -= 10;\n}\n```\n\n#### 动手试试：\n\nCodepen 演示：[`codepen.io/undeadinstitute/pen/JjKepGE`](https://codepen.io/undeadinstitute/pen/JjKepGE)\n\
    \n文件演示：[`undead.institute/files/zombie-programming/011-loopy-little-zombies.html`](https://undead.institute/files/zombie-programming/011-loopy-little-zombies.html)\n\
    \n上面的 `for` 循环示例假设你有某种数值可以比较。如果没有固定的运行次数，或者数值比较不合适，该怎么办？这时就需要第二种循环——`while` 循环。\n\
    \n`while` 循环告诉浏览器在条件为真时持续循环。\n\n```\nlet george = “zombie”, stillAZombie = true;\n\
    while( stillAZombie ) {\n  if( george == “zombie” ) {\n    tryToCure( george );\n\
    \  } else {\n    stillAZombie = false;\n  }\n}\n```\n\n上面的示例检查 `stillAZombie`\
    \ 变量是否为 `true`。如果是，则检查 `george` 变量是否包含字符串“zombie”。如果是，程序尝试对 `george` 进行治疗。如果 `tryToCure`\
    \ 函数成功，那么 `george` 变量将不再包含“zombie”，`if` 测试失败，并执行 `else` 部分，将 `stillAZombie` 设置为\
    \ `false`，并在下一次 `while` 循环检查 `stillAZombie` 是否为 `true` 时结束循环。\n\n`while` 循环有一个同父异母的兄弟叫做\
    \ `do-while` 循环。当你希望将条件放在循环末尾（即希望循环中的语句至少执行一次）时，可以使用 `do-while` 循环。\n\n```\nlet\
    \ george = “zombie”, stillAzombie = true;\ndo {\n  if( george == “zombie” ) {\n\
    \    tryToCure( george );\n  } else {\n    stillAZombie = false;\n  }\n} while(\
    \ stillAZombie );\n```\n\n#### 动手试试：\n\nCodepen 演示：[`codepen.io/undeadinstitute/pen/zYBMRoB`](https://codepen.io/undeadinstitute/pen/zYBMRoB)\n\
    \n文件演示：[`undead.institute/files/zombie-programming/012-while-zombie-freak-out.html`](https://undead.institute/files/zombie-programming/012-while-zombie-freak-out.html)\n\
    \n"
- fmt: '

    The `do-while` loop above does the same thing as the `while` loop did, but the
    `if` test is ensured to run at least once.


    Be careful with this kind of loop though, because if `stillAzombie` never becomes
    `false`, then your loop will continue forever, and the zombies will winter in
    Florida while taking out loans in your name and ruining that credit score you
    worked so hard to get. You know…they’ll win.


    ## Zombie Sniper and Variable Scopes


    Before we go further, let’s talk about variable scope—that is, where you can use
    a variable. When we define a bucket using `var` or `let` or `const`, it’s like
    we’re writing its name on the side. If you have a horde of buckets with names
    on their sides, it can take a while to find the one you want, right? So JavaScript
    allows you to create groups of buckets and localize the bucket names to make things
    easier to find and make sure there aren’t any conflicts. You can think of a group
    of buckets as all the buckets (variables) defined between two curly brackets.
    Any bucket you’ve named within that group won’t be used outside that group, but
    any variable declared outside that group can also be used within the group. For
    instance:


    ```

    let zombie = 0; for( let i = 0; i < 10; i++ ) {


    let undead = i;


    zombie = i;


    }


    //print contents of both variables. document.write(zombie); //Output is 10 document.write(undead);
    //Output is undefined

    ```


    #### Try it Out:


    Codepen Demo: [https://codepen.io/undeadinstitute/pen/abZQPye](https://codepen.io/undeadinstitute/pen/abZQPye)


    File Demo: [https://undead.institute/files/zombie-programming/013-using-scope-on-zombie-breath.html](https://undead.institute/files/zombie-programming/013-using-scope-on-zombie-breath.html)


    Since the variable `zombie` was defined outside the `for` loop/curly brackets,
    it can be accessed from within the loop and changed. However, since `undead` was
    defined within the loop, it does not exist outside of that and thus will be `undefined`
    when printed outside the loop.


    ## An Array of Apocalyptic Outcomes


    There’s one more data type to discuss, though this might be better called a data
    structure: the array. You can think of an array as an orderly line of buckets,
    or a line of people with empty bowls waiting for whatever-we-got stew at your
    nearest human resistance cell. This line is a useful way to group everyone, and
    you could either go down the line and hand out stew, or you could call out names
    for them to come get stew, or you could send out a line of stew cooks the same
    size as the line of hungry people to give them stew. Whatever way you access the
    people in the line, you can because they’re all in one place and in an order you
    understand. Arrays are a line of buckets or variables. You can access all the
    variables in sequence using their indices (places in line), pull out a specific
    variable in the array (you can have string names as your indices too), or you
    can use a `map` function (we’ll get to these in the next book) to do work on all
    the variables at once.


    Arrays use bracket notation to designate which bucket you are on. By default,
    indices are numbered starting at zero. (Empty brackets designate creating an empty
    array.)


    ```

    let horde = []; horde[0] = "Bob"; horde[1] = "Fred"; horde[2] = "Leroy"; //the
    horde array then looks like ["Bob", "Fred", "Leroy"]

    ```


    You can also create that array this way:


    ```

    let horde = ["Bob", "Fred", "Leroy"];

    ```


    But you aren’t limited to a line of buckets. You can also create a line of lines
    and a line of lines of lines and a line of lines of lines of...you get it. You
    can create arrays of multiple dimensions. A two-dimensional array is like a square.
    If you’ve ever seen a majority military human resistance cell walk into battle
    or the last vestiges of our air force planes fly in a tight, square formation,
    you’ll understand what I mean. Or look at this array of buckets:


    ![](images/Image1.png)


    A two-dimensional array is accessed in a similar way as a one-dimensional array
    but with two indices (one horizontal, and one vertical).


    `let zombie = horde[6][2];`


    The code above would save the contents of seven down and three across into the
    variable `zombie`. (Don’t forget. A two-dimensional array’s first cell is at `[0][0]`.)


    There are also a few array-specific properties we can use to get information about
    the array. One of the most common is `length`, which gives us the number of items
    in the array, allowing us to write a `for` loop to search the entire array. You
    call `length` by adding a period after the array name and the word `length`.


    ```

    let horde = [ 1, 0, 0, 1, 1 ]; let results = []; for( let i = 0; i < horde.length;
    i++) {


    results[i] = tryToCure( horde[i] );


    }

    ```


    #### Try it Out:


    Codepen Demo: [https://codepen.io/undeadinstitute/pen/ExyGryj?editors=0010](https://codepen.io/undeadinstitute/pen/ExyGryj?editors=0010)


    File Demo: [https://undead.institute/files/zombie-programming/014-a-wide-array-of-zombies.html](https://undead.institute/files/zombie-programming/014-a-wide-array-of-zombies.html)


    Using the code above, you go through every bucket in the array. Bucket zero is
    the first one in the `horde` array or `horde[0]`. When you increment `i` by one,
    you can look at the second bucket or `horde[1]`, and so on, till you get through
    the entire array.


    ## Functional Apocalypse


    Sometimes you create a section of code that you want to use again and again—for
    instance, code that cures the zombie contagion or that finds the highest strength
    zombie in a horde.


    Now in your human resistance cell, you could do every task yourself and overload
    your schedule. Or you could delegate a task to Fred or Nancy, and then they could
    do that task every time and be excellent at it (rather than you having to relearn/remember
    that task every time you had to do it).


    It’s similar with code. Rather than writing that same set of code again and again
    and again, you can put it in a function. A function is a set of tasks/code that
    you can reuse. Like asking Fred or Nancy to do the task, you ask the function
    to do the task.


    ![](images/livingtip-jsloops.png)


    #### Night of the Living Tip:


    While there is some disagreement on the best way to use functions, whether you
    do almost everything in small functions or use more monolithic functions, both
    have their advantages. More functions can make it harder to follow the code and
    can make things confusing because the code won’t be as linear and will jump around
    from location to location wherever the function is defined. On the other hand,
    if something’s wrong, it’s confined to a rather small section of code. Using more
    monolithic functions can make it easier to find the function the problem is in,
    but that is often an extensive section of code.


    I’d recommend a middle approach. When you start out, have your functions do one
    thing at a time and anything you do multiple times. They’re easier to debug (figure
    out where the code went wrong/why it’s not doing what you intend), and, once you
    have some practice, you’ll get a handle on when you need a function or not, and
    what makes sense to you.


    Before we do some function code, we need to discuss how we hand information to
    Fred or Nancy and how we get information back from them.


    You don’t always need to give a function (or Fred or Nancy) any information to
    perform their task other than “Go!” But you might have a horde you want them to
    target or a weapon you want them to reload or a specific zombie you want them
    to cure, such as a formerly human spouse or child. When you pass information to
    a function or hand data to Fred or Nancy to process, that information or data
    is called a parameter, and you can have none, one, two, or however many parameters
    or inputs into a function.

