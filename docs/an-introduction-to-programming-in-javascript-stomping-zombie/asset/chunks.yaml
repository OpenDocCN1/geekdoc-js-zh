    ## 关于作者


    John 是一位兼具设计与开发技能的故事讲述者。白天他设计和构建网站与移动应用，晚上则在 StoryLab（[`storylab.us`](https://storylab.us/)）编写科幻故事，并在[`8wordstories.com`](https://8wordstories.com/)上精心计算字数。他是一颗伪装的菠萝[`pineapplecomics.com`](https://pineapplecomics.com/)，并且（如你所知）试图通过帮助你杀死僵尸[`undead.institute`](https://undead.institute/)来让学习
    Web 开发变得有趣。他很幸运地拥有一个妻子、五个孩子，以及六只猫、四条狗和一小群鱼。如果他记得穿裤子，那就是美好的一天。


    在推特上[@storykaboom](http://twitter.com/storykaboom)向他提问，赞美他对十三世纪格陵兰文学的品味，或者就细枝末节（比如十三世纪格陵兰是否有独立文学）与他争论。


