- fmt: '

    Before we name variables, you need to learn a few important syntax rules. Similar
    to CSS, JavaScript lines should end with a semicolon. Also, two forward slashes
    (`//`) in JavaScript indicate a comment or, to be more specific, tell the browser
    to ignore the two slashes and everything after them until the end of the line.
    CSS style comments also work in JavaScript—that is, the browser will ignore everything
    from your opening `/*` to your ending `*/`, no matter how many lines it is.


    `var`: `var` is the original way to set a variable and the method that is most
    backward-compatible. If you’re building something for older browsers, use `var`.
    Examples:


    ```javascript

    var zombie; //Just creating the variable/bucket

    var zombie = 45; /* creating the variable and assigning it the number 45 or creating
    the bucket and putting the number 45 into it… and then having a multi-line comment
    */

    var apocalypse = "The end of the world"; //putting a string in the bucket

    var zombieDoomed = true; // putting a Boolean in the bucket

    ```


    `let`: The next option is to use `let` instead of `var`. `let` is a newer choice
    and exists because `var` could have unexpected behavior. JavaScript’s loosey-goosey
    (zombly-wombly?) attitude toward variables—that is, how forgiving it is—can, in
    certain cases, get you into trouble. `let` solves that issue and should be your
    default way of creating variables for any recent browser work.


    ```javascript

    let zombie;

    let zombie = 45;

    let apocalypse = "The end of the world";

    let zombieDoomed = true;

    ```


    `const`: The last option is almost a contradiction in terms because the next way
    to instantiate a variable is to create a constant...Yeah, that seems zomborrific
    to me too, but hear me out. Sometimes you’ll have a value that should stay constant
    during a program, like the number of zombies cured by one cc of anti-zombie serum
    or the ratio of human resistance cells to the number of zombie nests in an area.
    But that number may change outside the bounds of the program. For example, you
    might increase the effectiveness of the anti-zombie serum (for instance, by infusing
    it with HTML, CSS, and/or JavaScript), or you might eradicate a zombie nest, making
    the ratio inaccurate. Rather than putting that value in sixty times and then looking
    for every instance of that value and replacing it, you can use the name of a constant
    throughout the program, and then, if the value of the constant changes, you only
    have to update it in one place in the code. You cannot change a constant while
    the program is running. You can only change it by editing the code.


    The keyword for a constant is `const`.


    ```javascript

    const zCuredPerSerumCC = 7;

    const cell2NestRatio = 0.8271;

    ```


    ![](images/livingtip-jsloops.png)


    #### Night of the Living Tip:


    You can define more than one variable at a time by using a comma between variable
    names. I’m using `let` below, but it works with `var` and `const` too.


    ```javascript

    let zombie, undead;

    ```


    You can also set their values while chaining them:


    ```javascript

    let horde = 700, humanityInTrouble = true;

    ```


    ## Undead Output


    There are several ways to output something in JavaScript. Outputting for user
    view is almost always the end goal, even if the results of a program do something
    else first. Outputting for user view is also helpful in figuring out what’s wrong
    in a program and how to fix it.


    ### Output to an Alert


    One of the easiest (but often most annoying) ways to output a variable is to use
    an alert statement. An alert statement is a JavaScript function that creates a
    dialog box with a message and an okay button. For instance:


    ```javascript

    alert("The zombies are here!");

    ```


    would show


    ![alert box with the text The zombies are here!](images/Image0.png)


    #### Try it Out:


    Codepen Demo: [https://codepen.io/undeadinstitute/pen/bGemwXJ](https://codepen.io/undeadinstitute/pen/bGemwXJ)


    File Demo: [https://undead.institute/files/zombie-programming/001-zombie-alert.html](https://undead.institute/files/zombie-programming/001-zombie-alert.html)


    Outputs to an alert are useful, particularly when you are starting out, as you
    learn what a variable holds at a particular point in your program. The downside
    is that you have to click “okay” on each dialogue box opened. If you create an
    alert in a loop, you may end up with quite a lot of clicking. And if you forget
    to remove a debugging alert from your code before you publish the site, your users
    will see them, be annoyed, and decide that maybe being a zombie ain''t so bad
    if humans are this monstrous.


    ### Output to the Page


    You can output content or information to the page using `document.write`.


    ```javascript

    document.write("The zombies are here!");

    ```


    This prints out content to the page, which is usually where you want to see it.
    The downsides are that it’s a little complicated to get the content where you
    want it (although it’s easy to add at, for example, the bottom of the page), and
    if you leave any debugging code in the production files, the zombies will win,
    and your users will see your confusing debugging output.


    #### Try it Out:


    Codepen Demo: [https://codepen.io/undeadinstitute/pen/ZEOqBbW](https://codepen.io/undeadinstitute/pen/ZEOqBbW)


    File Demo: [https://undead.institute/files/zombie-programming/002-zombie-write.html](https://undead.institute/files/zombie-programming/002-zombie-write.html)


    Another option is similar to `document.write`. You can also select an HTML element
    on the page and add or change the text, or you can create an element in JavaScript
    and append it to the page with the information. This is the major way that you’ll
    show content/the results of your program to your users, but when you use it for
    debugging, it has the downside of being visible to users. This is a powerful and
    useful way to show content (debugging or otherwise). We’ll look at it in the next
    book, *JavaScript Basics: Flinging Event, Element, and Object Bombs at Zombie
    Heads*.


    ### Output to the Console


    The way that’s often best to output debug content is to the console. (I say often
    the best because each method has its purpose. I use the console most often but
    will sometimes throw up an alert or write it to the page for a quick and dirty
    solution.) The console is part of each browser’s web developer tools and allows
    you to output content to a hidden command line. All you have to do is use:


    ```javascript

    console.log("The zombies are here!");

    ```


    The output will then appear in the console, and you can figure out where your
    program went wrong. While I would still recommend removing `console.log` statements
    from production code, if you forget, no one but us developer types are likely
    to see the output.


    #### Try it Out:


    Codepen Demo: [https://codepen.io/undeadinstitute/pen/LYZgber](https://codepen.io/undeadinstitute/pen/LYZgber)


    File Demo: [https://undead.institute/files/zombie-programming/003-console-zombies.html](https://undead.institute/files/zombie-programming/003-console-zombies.html)


    ## Math after the Apocalypse


    Next we’ll tackle something familiar, though it may be unpleasant for some: math.
    A lot of math can happen in programming and all the usual culprits are there:
    addition, subtraction, multiplication, and division, as well as one you may not
    be familiar with, modulus division.


    **Addition:** `undead = zombies + infected`


    **Subtraction:** `undead = zombies - cured`


    **Multiplication:** `undead = humans * infectionRate`


    **Division:** `undead = zombies / antidote`


    **Modulus Division:** is just like division except the remainder is the answer—for
    example, 13 modulus 5 is 3 because 3 is the remainder/what’s left over after 5
    is divided into 13.) Modulus uses the `%` sign.


    ```javascript

    nextHorde = zombies % hordeSize;

    ```


    #### Try it Out:


    Codepen Demo: [https://codepen.io/undeadinstitute/pen/eYzPyLm?editors=0010](https://codepen.io/undeadinstitute/pen/eYzPyLm?editors=0010)


    File Demo: [https://undead.institute/files/zombie-programming/004-mathematical-zombies.html](https://undead.institute/files/zombie-programming/004-mathematical-zombies.html)

