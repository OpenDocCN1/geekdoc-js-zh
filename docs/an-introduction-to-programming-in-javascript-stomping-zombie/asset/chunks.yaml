    你应该尽可能晚地加载 JavaScript 代码——也就是在结束的 body 标签之前。如果过早加载（例如在 head 标签中），可能会阻塞其他资源的下载。无论
    JavaScript 放在哪里，总下载时间都是一样的，但如果浏览器因为等待你的 js 文件下载或 js 代码执行而阻塞了下载或渲染，就会阻止页面其余部分的显示，导致用户看到空白屏幕的时间更长。即使页面在
    js 加载完成之前无法正常工作，用户也喜欢看到页面正在加载的迹象，浏览器尽可能渲染内容会有所帮助。空白页面，就像僵尸空洞的凝视，通常意味着出了问题，用户也会这么认为。有些
    JavaScript 需要在页面加载之前执行，或者用于决定页面的加载方式，因此 head 中也可能有 JavaScript，但如果能将其移到页面底部并且页面仍然能正常工作，那将是最理想的。


    本书涵盖了入门编程所需的大部分基本工具，并且着眼于在 JavaScript 中实现。虽然语法/编写方式会有所不同，但大多数编程语言都包含这里讨论的所有概念。下一本书《JavaScript
    基础：向僵尸头部投掷事件、元素和对象炸弹》将深入探讨 JavaScript 的具体内容及其一些独特特性。


    但在那之前，让我们先测试一下这些技能。


    ## 在数组中痛击那些僵尸


    你将处理一个由姓名和超级秘密的“数字生物学玩意儿”（NBT）组成的二维数组，并使用多个函数对该数组进行处理。起始的 HTML 文件/Codepen 将包含该数组，并为函数提供存根。


    #### 起始文件


    Codepen：[`codepen.io/undeadinstitute/pen/jOrdwrE`](https://codepen.io/undeadinstitute/pen/jOrdwrE)


    文件：[`undead.institute/files/zombie-programming/017-our-cells-numbery-biologicy-thingy-results.html`](https://undead.institute/files/zombie-programming/017-our-cells-numbery-biologicy-thingy-results.html)


    你的第一个函数 `processPerson` 应该接收受试者的姓名和方便提供的 `NBT`。（在循环中运行它可能有助于你处理所有条目。）由于本练习的任意便利性，`NBT`
    可以告诉你两件事：受试者是否会变成僵尸，以及一旦变成僵尸，解药是否对他们有效。


    从 `processPerson` 中，将 `NBT` 传递给一个名为 `willBecomeZombie` 的函数。`willBecomeZombie`
    应返回 `true` 或 `false`。如果 `NBT` 模 7 的结果大于等于 2，那么该人如果被感染就会变成僵尸，因此返回 `true`。如果结果为
    0 或 1，则返回 `false`。


    同样从 `processPerson` 中，你调用一个名为 `infectionRateCalculation` 的函数，利用那个神奇的 `NBT` 计算感染概率。将
    `NBT` 除以 19307，再将结果乘以 0.1257。这将给出该人如果被感染后感染他人的概率。返回感染概率，以便与其他信息一起打印。


    从 `processPerson` 中，调用一个名为 `curable` 的函数，该函数接收 `NBT`。如果 (`NBT` * 3 + 2) 模 17 的结果为
    0 或 7，则解药对该人有效。因此，这些值应返回 `true`。任何其他值应返回 `false`。


    一旦你计算出所有信息，调用一个函数，使用 `document.write` 将结果输出到屏幕上。你的输出应列出该人的姓名，并标注每个函数的结果。另外，请确保每个人的信息单独打印在一行。


