    Next (i < 10), you set the conditional for how long to continue the loop (i.e.,
    while i is less than 10, keep running all the code between the curly brackets).
    Finally (i++), you’re setting how fast you go from the initial value (i = 0) to
    the end condition (when i is greater than or equal to 10). In most cases, that’s
    by an increment of 1 (i++), but it could be a decrement (i--) or you could do
    it by more than 1 depending on your needs (i += 2, etc.).


    Be careful that you don’t set up a condition that will never come about, or the
    loop will go on forever, and the zombies will win. For instance, if your condition
    is i < 10, and you decrement instead of increment, then i will always be less
    than 10, and your loop will never exit. (I’ve done this myself more times than
    there are zombies in a horde, so if you find your browser hanging or repeating
    something well beyond the number of times you anticipate, it’s best to just close
    the browser window, fix your code, and then reopen the page. Hopefully you’ll
    be free of the infinite loops that’ll eat your brain like a zombie with an empty
    stomach).


    let horde = 0; let humans = 100; for( let i = 0; i < 10; i++) {


    horde += 10;


    humans -= 10;


    } //perform the same task using a decrementing loop let horde = 0; let humans
    = 100; for( let j = 10; j < 1; j--) {


