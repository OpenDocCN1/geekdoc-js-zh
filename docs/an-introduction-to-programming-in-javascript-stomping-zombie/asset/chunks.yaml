    # JavaScript 编程入门：


    用变量、循环、函数等知识痛扁僵尸


    作者：John Rhea


    由 [*亡灵学院*](https://undead.institute) 出版


    ## 你好，人类抵抗细胞


    JavaScript 与其他前端网页语言（如 HTML 和 CSS）不同。它更具程序性，使用逻辑、变量、函数、循环以及各种东西——但别担心你的脑子会像被僵尸紧追不舍一样。我们会一步步引导你，让你快速上手，即使这是你第一次接触
    JavaScript 和/或更传统的编程语言。


    本书假设你具备少量 HTML/网页知识。如果你完全没有，可以从我们的免费书籍《*痛击僵尸：面向作家、设计师和初学者的 HTML & CSS 快速入门指南*》中获取所需内容，该书可在
    [`undead.institute/death-to-boring-programming-books/`](https://undead.institute/death-to-boring-programming-books/)
    获取。


    ## 一桶又一桶的僵尸内脏


    首先要理解的一个概念是变量。变量就像你用来存放东西的桶。你可以在桶里放水、午餐、假人模特头、或者 2037 年洛杉矶僵尸道奇队人类抵抗细胞的新秀卡。你几乎可以把任何东西放进桶里。


    在 JavaScript 中，也有很多不同类型的“东西”可以放进桶里，例如：


    **数字：** 就是你想的那样。


    **字符串（字符串）：** 实际上不仅仅是字母——它们是你想当作一个整体处理的任何文本或字符。字符串需要用引号括起来（JavaScript 中单引号和双引号都可以），并且可以包含任何有效字符。字符串的例子有：


    “你好，后末日世界”


    或者，


    “别看我，Norm。僵尸把你的午餐从冰箱里拿出来吃掉了。”


    或者，


    “我知道你贴了标签。僵尸不在乎，或者它不识字。”


    或者，


    “只有一个办法能知道。它正在那边吃另外 7 份午餐。”


    或者，


    “7？”


    或者，


    “7”


    所以你也可以在字符串中包含数字字符，但它们会作为字符串而不是数字来表现——因此你不能直接对它们进行加法或乘法运算，除非先将它们转换回数字。如果某物在引号内，它就是字符串。


    **布尔值：** 值为 true 或 false，不能是其他值。这使得它非常适合用作开关，来打开或关闭某些东西。


    JavaScript 中还有几种其他类型的变量，但这些足以让我们开始。


    ## Z 型桶


    有些桶只能装一种类型的东西。例如，一个底部有洞的桶装不了水，也装不了北美最后一个还在工作的汽水机里的汽水，但它很适合装书、大石头，或者你变成僵尸的室友的个人物品。类似地，变量通常也只保存一种类型的东西。


    在某些编程语言中，把错误类型的内容放进错误的桶里会导致错误，但 JavaScript 很宽容。好的一面是，JavaScript 会处理很多事情而不抱怨。坏的一面是，如果它处理出错或处理的结果与你预期不同，你可能会得到奇怪的结果或难以追踪的编程错误。


    ![](img/livingtip-jsloops.png)


    #### 活死人之夜小贴士：


    这类错误常见的一个地方是当你试图将一个数字（`2`）和一个看起来像数字的字符串（`"2"`）相加时。在 JavaScript 中，`2 + "2"` 的结果是
    `"22"`。由于其中一个是字符串，它会将另一个也强制转换为字符串，并将它们拼接（连接）在一起。（这在需要为用户构建消息时非常有用。）因此，要小心确保你是在用数字加数字，而不是字符串。


    ## 变量桶的内容


    我们一直在谈论的这些桶被称为变量。它们之所以叫变量，是因为它们……嗯……是可变的。你可以往里面放东西，在程序运行过程中，你可以取出它并查看，或者取出它并对其进行操作，或者取出它并放入其他东西。你可以重复任意多次。


    在我们可以使用这些桶/变量来击退僵尸大军之前，我们必须给它们命名。我们可以给变量起几乎任何我们想要的名字。但是，我们只能使用字母、数字和下划线。不能使用任何其他字符，并且第一个字符不能是数字——例如，`7zombies`
    是无效的，但 `sevenzombies`、`_7zombies` 或 `zombies_numbering_7` 都可以正常工作。


    另外，变量是区分大小写的，所以变量 `zombie` 与变量 `Zombie` 不同，也与名为 `ZOMBIE` 的变量不同，更与 `zOmBiE` 不同——因此要注意你使用的大小写，并在整个代码中保持一致。


    ![](img/livingtip-jsloops.png)


    #### 活死人之夜小贴士：


    我们可以利用这一点，采用驼峰命名法。驼峰命名法使多词变量名更易于阅读和理解。在驼峰命名法中，第一个单词全部小写，然后每个后续单词的首字母大写。以下是一些例子：


    `sevenZombies` `sevenFormerHumans` `thatGuyFromAccountingWhoTurnedZombie` `dawnOfTheDeadFromSales`
    `rickTheUndeadHarbingerOfDoom`


    变量名的最后一条规则是，你不能使用任何 JavaScript 的保留字——即那些对 JavaScript 有特殊含义、构成语言功能的单词。如果 HTML 有变量，那就好比把你的桶命名为
    `<p>`。浏览器将很难理解你什么时候指的是 `p` 标签，什么时候指的是变量/桶，因为你给两者起了相同的名字。


    那么如何在 JavaScript 中声明一个变量呢？有三种方式：`var`、`let` 和 `const`。（这些就是不能用作变量/桶名的保留字的例子。）


