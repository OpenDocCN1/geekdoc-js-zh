    ## Getting Loopy with Zombies


    The next important thing in JavaScript—and in other programming languages—is the
    loop. Loops are just what they sound like, they do some code again and again and
    again until they hit a stopping condition. There are two main types of loops (with
    a couple variations): the for loop and the while loop.


    For loops run whatever code you place between the curly brackets for a set number
    of iterations.


    ![](images/livingtip-jsloops.png)


    #### Night of the Living Tip:


    The letters i, j, and k are traditionally used as loop counters (a variable that
    counts the number of iterations used. You don’t have to use these as your counter
    values, but if you don’t, name your counters clearly. For clearer code, it’s best
    not to use i, j, or k for any other kind of variable.


    A traditional for loop in JavaScript looks like this:


    for( let i = 0; i < 10; i++ ) {


    //stop zombies 10 times


    }


    #### Try it Out:


    Codepen Demo: [https://codepen.io/undeadinstitute/pen/bGeQaZx](https://codepen.io/undeadinstitute/pen/bGeQaZx)


    File Demo: [https://undead.institute/files/zombie-programming/010-zombie-loop-de-loop.html](https://undead.institute/files/zombie-programming/010-zombie-loop-de-loop.html)


    ![](images/livingtip-jsloops.png)


    #### Night of the Living Tip:


    You’ll notice that the i counter started at zero instead of one. This is not a
    requirement, but it can make things easier in the long run. The reason is that
    computers start counting at 0 rather than at 1\. (Like some zombies, computers
    don’t have fingers to count on.) So later, when we work on arrays, their indexes
    start at 0 rather than at 1, and if you start your for loop at 1, you’ll skip
