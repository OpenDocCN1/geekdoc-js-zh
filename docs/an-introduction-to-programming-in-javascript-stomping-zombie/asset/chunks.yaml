    of the bread (super easy in this computer-i-fied example), but that would take
    up as much space as the original, and we might run out of buckets. We’d also have
    to transport the bread or model out to him, which can get complicated when you
    have quite a few buckets to transport.


    So we take a picture of the bread instead. In very general terms, the loaf and
    the picture are equivalent because one is the loaf and one points to or is a picture
    of that same loaf. (In computer science, the picture from our analogy is called
    a pointer because it “points” to the original.) That’s the double equals == level
    of equality. The triple equals === is when you’re trying to see if two loaves
    of bread are the same or, rather, if one of them isn’t a pointer to/picture of
    the other.


    In code, a simplified version of that might look like


    7 == “7” //true 7 === “7” //false


    ### Less than:


    undead < zombie


    Let’s say undead is equal to 10\. Is the value of undead less than the value of
    zombie? For this to return true, zombie would have to be more than 10 (e.g., 11,
    12, 10.1, 312 etc.). It will return false if zombie is 10 or less (e.g., 9, 10,
    7, -437, etc.).


    ### Greater than:


    undead > zombie


    Is the value of undead greater than the value of zombie? If undead = 10, then
    true values include 9, 8, -10, 0, and so on. False values include 10, 11, 412,
    and so on.


