    line. CSS style comments also work in JavaScript—that is, the browser will ignore
    everything from your opening /* to your ending */, no matter how many lines it
    is.


    **Var:** var is the original way to set a variable and the method that is most
    backward-compatible. If you’re building something for older browsers, use var.
    Examples:


    var zombie; //Just creating the variable/bucket var zombie = 45; /* creating the
    variable and assigning it the number 45 or creating the bucket and putting the
    number 45 into it… and then having a multi-line comment */ var apocalypse = “The
    end of the world”; //putting a string in the bucket var zombieDoomed = true; //
    putting a Boolean in the bucket


    **Let:** The next option is to use let instead of var. Let is a newer choice and
    exists because var could have unexpected behavior. JavaScript’s loosey-goosey
    (zombly-wombly?) attitude toward variables—that is, how forgiving it is—can, in
    certain cases, get you into trouble. Let solves that issue and should be your
    default way of creating variables for any recent browser work.


    let zombie; let zombie = 45; let apocalypse = “The end of the world”; let zombieDoomed
    = true;


