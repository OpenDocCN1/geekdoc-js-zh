    任务完成后，你可能希望弗雷德或南希把某样东西交还给你，或者带回一些信息。这可能是一把重新装填好的武器，或者解药是否对你那位还没“翘辫子”的配偶或孩子起了作用（别担心，解药里注入了
    JavaScript 代码，你的配偶/孩子现在正在休息，已经完全康复了）。如果他们交给你一堆东西，除非这些东西被整理好（例如放进一个数组或类似结构），否则你很难知道每样东西是什么。函数只能返回一个值，但这个值可以是一个数组，从而让你绕过“只能返回一个值”的限制。


    函数定义（即定义函数名称及其功能的部分）以关键字 *function* 开头，然后输入你为该函数指定的区分大小写的名称。接着，在括号内以逗号分隔的形式添加任意参数。如果没有参数，只需让括号内保持空白即可。


    ```

    function tryToCure( person ) {


    let result = Math.random() * 100;


    if(result <= 10) {


    return person + " is cured!";


    } else {


    return person + " is still a zombie";


    }


    }

    ```


    调用该函数时，你可以这样写：


    `tryToCure( spouse );`


