    After the task is complete, you might want Fred or Nancy to hand something back
    to you or return with some information. That might be a now reloaded weapon or
    whether the antidote worked on your un-bucket-kicking spouse or child. (Don’t
    worry, the antidote was infused with JavaScript code, and your spouse/child is
    now resting, fully restored.) If they hand you a bunch of things, it’ll be hard
    to know what each thing is unless it’s organized (e.g. like into an array or something).
    Functions can only return one value, but that value could be an array, allowing
    you to circumvent the one-value return policy.


    A function definition (where you define the function’s name and what it does)
    begins with the word *function*, and then you enter the case-sensitive name you
    want to give that function. Next, in parentheses, add any parameters in a comma-separated
    list. If you don’t have any parameters, just leave the space between the parentheses
    blank/empty.


    ```

    function tryToCure( person ) {


    let result = Math.random() * 100;


    if(result <= 10) {


    return person + " is cured!";


    } else {


    return person + " is still a zombie";


    }


    }

    ```


    When you call the function, you could write:


    `tryToCure( spouse );`


    #### Try it Out:


    Codepen Demo: [https://codepen.io/undeadinstitute/pen/wvWNvXa](https://codepen.io/undeadinstitute/pen/wvWNvXa)


    File Demo: [https://undead.institute/files/zombie-programming/015-functionally-undead.html](https://undead.institute/files/zombie-programming/015-functionally-undead.html)


    It will be just as though you handed Nancy your spouse’s whereabouts and asked
    her to use a tranquilizer dart to bring your spouse in and administer the antidote.


    To capture the returned value, you need to save it in a variable. Returning a
    value is optional.


    `let human = tryToCure( spouse );`


    If you had no parameters to send the function, you could write this:


    ```

    function cureAllZombies() {


    //cure all zombies


    if( allCured == true ) {


    return true;


    } else {


    return false;


    }


    }

    ```


    If it didn’t return a value because Fred cured all the zombies, there would be
    no return statement in the function and no need to capture a result. It would
    be called like this:


    `cureAllZombies();`


    With two or more parameters, you separate the parameters with commas.


    ```

    function cureTwoZombies( zombie1, zombie2) {


    //cure two zombies


    }

    ```


    Assuming it didn’t need to return anything, it would be called like this:


    `cureTwoZombies( spouse, child );`


    Let’s look at an example program. For arbitrary reasons that make this example
    easier, we magically have an array filled with zombie results from the latest
    testing done at a hospital. It is held in a one-dimensional array, and the results
    are set up so that a 1 is a human and a 0 is a zombie ("because zombies are zeroes
    and humans are heroes," said the totally cool and hip author...). The hospital
    wants a JavaScript program to sort the array into humans and zombies and get a
    count of each.


    ```

    let patientList = [1, 1, 0, 1, 1, 1, 0, 0, 1, 0, 1, 0 ], i = 0; let humans = 0,
    zombies = 0; while (patientList[i] != null) {


    if( patientList[i] === 1 ) {


    humans++;


    } else {


    zombies++;


    }


    i++


    } //Output: humans 7, zombies 5

    ```


    #### Try it Out:


    Codepen Demo: [https://codepen.io/undeadinstitute/pen/KKMJwEB](https://codepen.io/undeadinstitute/pen/KKMJwEB)


    File Demo: [https://undead.institute/files/zombie-programming/016-sorting-an-array-of-zombies.html](https://undead.institute/files/zombie-programming/016-sorting-an-array-of-zombies.html)


    Now that we have some idea of how the logic and programming works, how do we add
    this stuff to the HTML page? There are several ways, but the most important is
    the HTML script tag.


    ```

    <script type=“text/javascript”>


    cureAllZombies();


    </script>

    ```


    You can also use the script tag to load a file full of JavaScript.


    `<script src=“thecure.js” type=“text/javascript”></script>`![](images/livingtip-jsloops.png)


    #### Night of the Living Tip:


    You want to load your JavaScript code as late as possible in the downloading of
    the site—that is just before the closing body tag. If you load it earlier, such
    as in the head tag, it can block the download of other assets. The total time
    spent downloading will be the same wherever the JavaScript is placed, but if it
    blocks download or rendering because the browser is waiting on your js file to
    download or your js code to execute, it can prevent the rest of the page from
    displaying, giving the user a blank screen for longer. Even if the page isn’t
    functional until the js loads, the user likes to see that things are working,
    and the browser rendering what it can will help. A blank page, like a zombie''s
    blank stare, usually means something is broken and users will assume as such.
    There will be some JavaScript that needs to be executed before the page loads
    or to determine how the page loads, so there may very well be JavaScript in the
    head, but if it''s pushed to the bottom and the page still works as intended,
    that would be ideal.


    This book covered most of the basic tools you need to get up and running with
    programming with an eye towards doing so in JavaScript. While the syntax/how you
    write it will vary, most programming languages have all the concepts discussed
    here. The next book, *JavaScript Basics: Flinging Event, Element, and Object Bombs
    at Zombie Heads* will get into specifics of and focus on JavaScript and some unique
    offerings of that language.


    But before we go there, let’s test out those skills.


    ## Punch Those Zombies in the Array


    You will take a two-dimensional array composed of names and a super-secret numbery
    biologicy thingy (NBT) and process that array using several functions. The starter
    HTML file/codepen will hold the array and have stubs for the functions.


    #### Starter File


    Codepen: [https://codepen.io/undeadinstitute/pen/jOrdwrE](https://codepen.io/undeadinstitute/pen/jOrdwrE)


    File: [https://undead.institute/files/zombie-programming/017-our-cells-numbery-biologicy-thingy-results.html](https://undead.institute/files/zombie-programming/017-our-cells-numbery-biologicy-thingy-results.html)


    Your first function, `processPerson`, should take the subject’s name and the conveniently
    provided `NBT`. (Running it in a loop would probably help you process all the
    entries.) The `NBT`, due to arbitrary convenience for this exercise, can tell
    you both whether a subject will become a zombie and whether a cure will work on
    them once they become a zombie.


    From `processPerson`, hand the `NBT` to a function called `willBecomeZombie`.
    `willBecomeZombie` should return `true` or `false`. If the `NBT` modulus 7 is
    2 or more, the person, if infected, will become a zombie, so return `true`. If
    it’s 0 or 1, return `false`.


    Also from `processPerson`, you call a function named `infectionRateCalculation`
    to calculate the likelihood of infection using that magical `NBT`. Divide the
    `NBT` by 19307 and multiply the result by 0.1257. That will give you the infection
    rate of others should the person be infected. Return the infection rate so that
    you can print it with the other info.


    From `processPerson`, call a function called `curable` that takes the `NBT`. The
    antidote will work on the person if (`NBT` * 3 + 2) modulus 17 is 0 or 7. Therefore,
    those values should return `true`. Any other value should return `false`.


    Once you have all the information calculated, call a function that outputs it
    to the screen using `document.write`. Your output should list the person’s name
    and label the results of each function. Please also ensure that each person’s
    info prints on its own line.


