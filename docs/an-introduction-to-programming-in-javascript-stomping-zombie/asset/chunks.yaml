- fmt: "\nThere are some shortcuts for things we do often. For instance, if we wanted\
    \ to add a number to a variable and save the new answer to that variable we’d\
    \ do:\n\n```\nundead = undead + 12;\n```\n\nA shortcut for this is to use the\
    \ `+=` operator that performs the same as above.\n\n```\nundead += 12;\n```\n\n\
    This isn’t just for addition. It works for all the arithmetic operators.\n\n```\n\
    undead = undead - 7\n```\n\nis equivalent to\n\n```\nundead -= 7\n```\n\n```\n\
    undead = undead * 7\n```\n\nis equivalent to\n\n```\nundead *= 7\n```\n\n```\n\
    undead = undead / 7\n```\n\nis equivalent to\n\n```\nundead /= 7\n```\n\n```\n\
    undead = undead % 7\n```\n\nis equivalent to\n\n```\nundead %= 7\n```\n\nThere’s\
    \ one arithmetic operation so common that it has a shortcut even shorter than\
    \ using `+=`. To increment a value by 1, add `++` to the variable (you can decrement\
    \ by 1 using `--`).\n\n```\nundead += 1 is equivalent to undead++\n```\n\n```\n\
    undead -= 1 is equivalent to undead--\n```\n\n#### Try it Out:\n\nCodepen Demo:\
    \ [https://codepen.io/undeadinstitute/pen/QWEZPXP](https://codepen.io/undeadinstitute/pen/QWEZPXP)\n\
    \nFile Demo: [https://undead.institute/files/zombie-programming/005-zombie-math-shortcuts.html](https://undead.institute/files/zombie-programming/005-zombie-math-shortcuts.html)\n\
    \nThere’s one little quirk with `++` and `--` that can occasionally come in handy.\
    \ You can put the `++` or `--` in front of the variable too.\n\n```\n++undead;\n\
    --undead;\n```\n\nIt still increments or decrements the variable. However, if\
    \ the `++` or `--` comes after the variable, the variable increments or decrements\
    \ *before* the contents of the variable/bucket is looked at. If the `++` or `--`\
    \ comes before the variable name, the variable/bucket will increment or decrement\
    \ before it’s looked at (see the examples below). If the statement is on its own\
    \ line, it doesn’t matter much whether it’s incremented or decremented before\
    \ or after. The statements are equivalent. But if it’s used within another JavaScript\
    \ statement, the result may change.\n\nFor instance:\n\n```\nlet undead = 10;\
    \ let zombie = 17 + undead++;\n```\n\nwould set `zombie` equal to 28 and `undead`\
    \ equal to 11; whereas\n\n```\nlet undead = 10; let zombie = 17 + ++undead;\n\
    ```\n\nwould set `zombie` equal to 27 and `undead` equal to 11.\n\n#### Try it\
    \ Out:\n\nCodepen Demo: [https://codepen.io/undeadinstitute/pen/WNxYQbw](https://codepen.io/undeadinstitute/pen/WNxYQbw)\n\
    \nFile Demo: [https://undead.institute/files/zombie-programming/006-incremetal-apocalypse.html](https://undead.institute/files/zombie-programming/006-incremetal-apocalypse.html)\n\
    \n## Logically Challenged Zombies\n\nSince variables can hold almost any value,\
    \ it can be difficult to keep track of what a variable/bucket is supposed to hold.\
    \ The problem is exacerbated by growing complexity. But you can figure out what’s\
    \ in a variable by using if-then statements. These allow you to test a condition\
    \ (if) and do something based on the results (then).\n\nHere’s how an if-then\
    \ statement looks when the if tests whether `undead` and `zombie` are equivalent\
    \ (we’ll talk about the different tests you can do in a second):\n\n```\nif( undead\
    \ == zombie ) { //stop horde }\n```\n\nIf `undead` and `zombie` are equivalent,\
    \ then whatever code you put in the curly brackets will run. (It's like CSS in\
    \ that whenever an element matches your selector, the browser will apply the rules\
    \ in the curly brackets.) If `undead` and `zombie` aren’t equivalent, then the\
    \ browser will skip any code in the curly brackets.\n\nHere are the logical operators\
    \ we have to work with:\n\n### Equal:\n\n`undead == zombie` and `undead === zombie`\
    \ test for equality.\n\nThree equals signs is stricter than two, and it’s usually\
    \ what you’ll want to use.\n\n![](images/livingtip-jsloops.png)\n\n#### Night\
    \ of the Living Tip:\n\nHow can things be more or less equal (outside of *Animal\
    \ Farm*)? This is because of one way that a computer saves memory. Our bucket\
    \ metaphor will break down a bit here, but let’s say we had a bucket full of something\
    \ complex, such as a loaf of bread. There’s a lot of information there. It’s complex,\
    \ and it takes up space.\n\nThe human resistance commander needs to see what rations\
    \ are available, but he’s in the field with the resistance fighters. We could\
    \ create a copy or 3-D model of the bread (super easy in this computer-i-fied\
    \ example), but that would take up as much space as the original, and we might\
    \ run out of buckets. We’d also have to transport the bread or model out to him,\
    \ which can get complicated when you have quite a few buckets to transport.\n\n\
    So we take a picture of the bread instead. In very general terms, the loaf and\
    \ the picture are equivalent because one is the loaf and one points to or is a\
    \ picture of that same loaf. (In computer science, the picture from our analogy\
    \ is called a pointer because it “points” to the original.) That’s the double\
    \ equals `==` level of equality. The triple equals `===` is when you’re trying\
    \ to see if two loaves of bread are the same or, rather, if one of them isn’t\
    \ a pointer to/picture of the other.\n\nIn code, a simplified version of that\
    \ might look like\n\n```\n7 == \"7\" //true\n7 === \"7\" //false\n```\n\n### Less\
    \ than:\n\n`undead < zombie`\n\nLet’s say `undead` is equal to 10. Is the value\
    \ of `undead` less than the value of `zombie`? For this to return true, `zombie`\
    \ would have to be more than 10 (e.g., 11, 12, 10.1, 312 etc.). It will return\
    \ false if `zombie` is 10 or less (e.g., 9, 10, 7, -437, etc.).\n\n### Greater\
    \ than:\n\n`undead > zombie`\n\nIs the value of `undead` greater than the value\
    \ of `zombie`? If `undead = 10`, then true values include 9, 8, -10, 0, and so\
    \ on. False values include 10, 11, 412, and so on.\n\n### Less than or equal to:\n\
    \n`undead <= zombie`\n\nIs the value of `undead` less than or equal to the value\
    \ of `zombie`? If `undead = 10`, true values include 10, 11, 1017, and so on.\
    \ False values include 9.9, -78, 6, and so on. (You can also do `<==` to enforce\
    \ the stricter form of equality.)\n\n### Greater than or equal to:\n\n`undead\
    \ >= zombie`\n\nIs the value of `undead` greater than or equal to the value of\
    \ `zombie`? If `undead = 10`, true values include 10, 9, -7, and so on. False\
    \ values include 11, 10.1, 371, and so on. (You can also do `>==` to enforce the\
    \ stricter form of equality.)\n\n### Not equal:\n\n`undead != zombie`\n\nThe values\
    \ of `undead` and `zombie` are two different things. If `undead = 10`, true values\
    \ include 9, 17, 38, -239, and so on, while the false value is 10. Nothing else\
    \ is a false value. (You can also use `!==` to enforce the stricter form of inequality.)\n\
    \nThere’s one additional thing you can do based on the if, but it’s not required.\
    \ It’s called an else statement, and it allows you to do one thing if the conditional\
    \ is true (then) and another thing if it’s false (else). It looks like this:\n\
    \n```\nif( undead === zombie ) {\n  //stop horde\n} else {\n  //stop contagion\n\
    }\n```\n\nThus, if `undead` and `zombie` are equal, then the browser will “stop\
    \ horde.” If they aren’t (else), it will “stop contagion.”\n\n#### Try it Out:\n\
    \nCodepen Demo: [https://codepen.io/undeadinstitute/pen/MWezKez](https://codepen.io/undeadinstitute/pen/MWezKez)\n\
    \nFile Demo: [https://undead.institute/files/zombie-programming/007-logically-its-the-apocalypse.html](https://undead.institute/files/zombie-programming/007-logically-its-the-apocalypse.html)\n\
    \nIf you need to test multiple conditions, you can do an else if, allowing you\
    \ to further segment how the program reacts. For instance, if two values are equal,\
    \ you may want to “stop horde.” But if they aren’t equal, you may want to “stop\
    \ a greater horde” if one is greater and “stop a lesser horde” if one is lesser.\n\
    \n```\nif( undead === zombie ) {\n  //stop horde\n} else if (undead > zombie)\
    \ {\n  //stop a greater horde\n} else {\n  //stop a lesser horde\n}\n```\n\nYou\
    \ can do as many of these if-else-if chains as you want. You can also refine the\
    \ something you want to do by whatever variables make sense for your program.\n\
    \nYou can combine conditionals using AND (`&&`) and OR (`||`).\n\n**AND** means\
    \ both statements have to be true to execute the then portion. AND is represented\
    \ by two ampersands:\n\n```\nif( undead === zombie && zombie > human ) {\n  //stop\
    \ horde\n} else {\n  //stop contagion\n}\n```\n"
  raw: 'There are some shortcuts for things we do often. For instance, if we wanted
    to add a number to a variable and save the new answer to that variable we’d do:


    undead = undead + 12;


    A shortcut for this is to use the += operator that performs the same as above.


    undead += 12;


    This isn’t just for addition. It works for all the arithmetic operators.


    undead = undead - 7


    is equivalent to


    undead -= 7


    undead = undead * 7


    is equivalent to


    undead *= 7


    undead = undead / 7


    is equivalent to


    undead /= 7


    undead = undead % 7


    is equivalent to


    undead %= 7


    There’s one arithmetic operation so common that it has a shortcut even shorter
    than using +=. To increment a value by 1, add ++ to the variable (you can decrement
    by 1 using --).


    undead += 1 is equivalent to undead++


    undead -= 1 is equivalent to undead--


    #### Try it Out:


    Codepen Demo: [https://codepen.io/undeadinstitute/pen/QWEZPXP](https://codepen.io/undeadinstitute/pen/QWEZPXP)


    File Demo: [https://undead.institute/files/zombie-programming/005-zombie-math-shortcuts.html](https://undead.institute/files/zombie-programming/005-zombie-math-shortcuts.html)


    There’s one little quirk with ++ and -- that can occasionally come in handy. You
    can put the ++ or -- in front of the variable too.


    ++undead;


    --undead;


    It still increments or decrements the variable. However, if the ++ or -- comes
    after the variable, the variable increments or decrements *before* the contents
    of the variable/bucket is looked at. If the ++ or -- comes before the variable
    name, the variable/bucket will increment or decrement before it’s looked at (see
    the examples below). If the statement is on its own line, it doesn’t matter much
    whether it’s incremented or decremented before or after. The statements are equivalent.
    But if it’s used within another JavaScript statement, the result may change.


    For instance:


    let undead = 10; let zombie = 17 + undead++;


    would set zombie equal to 28 and undead equal to 11; whereas


    let undead = 10; let zombie = 17 + ++undead;


    would set zombie equal to 27 and undead equal to 11.


    #### Try it Out:


    Codepen Demo: [https://codepen.io/undeadinstitute/pen/WNxYQbw](https://codepen.io/undeadinstitute/pen/WNxYQbw)


    File Demo: [https://undead.institute/files/zombie-programming/006-incremetal-apocalypse.html](https://undead.institute/files/zombie-programming/006-incremetal-apocalypse.html)


    ## Logically Challenged Zombies


    Since variables can hold almost any value, it can be difficult to keep track of
    what a variable/bucket is supposed to hold. The problem is exacerbated by growing
    complexity. But you can figure out what’s in a variable by using if-then statements.
    These allow you to test a condition (if) and do something based on the results
    (then).


    Here’s how an if-then statement looks when the if tests whether undead and zombie
    are equivalent (we’ll talk about the different tests you can do in a second):


    if( undead == zombie ) { //stop horde }


