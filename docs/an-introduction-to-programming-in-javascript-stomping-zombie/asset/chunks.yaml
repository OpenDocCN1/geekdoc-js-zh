    will run. (It''s like CSS in that whenever an element matches your selector, the
    browser will apply the rules in the curly brackets.) If undead and zombie aren’t
    equivalent, then the browser will skip any code in the curly brackets.


    Here are the logical operators we have to work with:


    ### Equal:


    undead == zombie and undead === zombie test for equality.


    Three equals signs is stricter than two, and it’s usually what you’ll want to
    use.


    ![](images/livingtip-jsloops.png)


    #### Night of the Living Tip:


    How can things be more or less equal (outside of *Animal Farm*)? This is because
    of one way that a computer saves memory. Our bucket metaphor will break down a
    bit here, but let’s say we had a bucket full of something complex, such as a loaf
    of bread. There’s a lot of information there. It’s complex, and it takes up space.


    The human resistance commander needs to see what rations are available, but he’s
