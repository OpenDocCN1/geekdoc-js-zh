  trans: "\n\n*   **易于学习/使用**：JavaScript 易于学习和实现。有大量的教程可以教授从基础到高级的 JavaScript。这些知识与在\
    \ React 应用中使用的知识是相同的。即使你的 JavaScript 知识来自原生 JavaScript（Vanilla JS），它仍然很有用。不过，你需要开始学习\
    \ ECMA SCRIPT 6 (`es6`) 及更高版本，才能很好地利用 React。市面上大多数 React 教程主要基于 JavaScript 而不是\
    \ TypeScript，这对于喜欢用 JavaScript 编写代码的人来说是一个巨大的优势。\n*   **速度**：使用原生 JavaScript 开发\
    \ React 应用的另一个优点是其开发和执行速度快。由于它是一种客户端语言（对于大多数 React 应用而言），它的开发非常直接简单，且没有编译时间。\n\
    *   **性能**：React JS 在设计时就考虑了高性能。框架的核心提供了虚拟 DOM 程序和服务端渲染，这使得以 JavaScript 为骨干的复杂应用程序运行速度极快。\n\
    \n# 在 React 应用中使用 TypeScript 的优势\n\nReact 是一个使用 JavaScript 的库。但 React 也使用 TypeScript，它通过\
    \ `babel` 编译为 JavaScript，以便我们的浏览器能够理解。TypeScript 和 JavaScript 的语法略有不同，但我们将看看在\
    \ React 应用中使用 TypeScript 的优势。\n\n*   **类型安全**：在声明变量或定义函数时，TypeScript 提供了类型安全检查。这有助于避免将错误的变量赋值给已定义的变量类型。这将有助于将错误和\
    \ Bug 减少到最低。\n*   **接口 (Interfaces)**：TypeScript 允许你使用接口为你的应用定义复杂的类型。这有助于检查传递的类型，从而确保减少\
    \ Bug 的数量。\n\n# 结论\n\n到目前为止，我们在这一章中学了我们大多数人在 React 中使用的不良实践。我们还学习了创建 React 应用的最佳实践，以及\
    \ JavaScript 和 TypeScript 在 React 中的优势。我们都知道 React 是有主张的（opinionated），但本章帮助我们了解了处理您应用程序的某些最佳方法。\n\
    \n在接下来的章节中，我们将学习如何编写组件以及受控组件与非受控组件的优势。我们将查看类组件、函数组件以及它们的一些生命周期方法。\n\n# 第 2 章\n\
    \n# 写组件\n\n## 简介\n\n本章将介绍如何编写组件。React 是一个基于组件的库，通过不同的可重用组件来构建应用程序。基本上，本章将概述编写组件的不同方式，包括函数组件和类组件。\n\
    \n虽然我们更多地关注基于函数的组件，因为它是 React 文档中最新的内容，但仍有应用是用类组件构建的。我们将在本章中使用 JavaScript 和 TypeScript\
    \ 来编写示例。\n\n## 结构\n\n本文将涵盖以下主题：\n\n*   命名规范\n*   函数组件\n*   类组件\n*   结构化组件的最佳方法\n\
    *   组件之间的数据共享\n*   受控组件与非受控组件\n\n## 目标\n\n在本章中，我们将学习编程中不同的命名规范。我们还将查看命名变量、方法和函数时的命名规范。我们还将查看在\
    \ React 中如何命名组件。\n\n我们将查看函数组件、类组件以及组件之间共享数据的方法。最后，我们将查看受控组件与非受控组件。\n\n## 命名规范\n\
    \n在编程中，有两种最常用的命名规范，即：\n\n*   驼峰命名法 (Camel case)\n*   帕斯命名法 (Pascal case)\n\n##\
    \ 驼峰命名法\n\n驼峰命名规范是变量、函数或方法的名称以小字母开头，或者第一部分用小字母，其他单词的首字母大写写。请看以下示例：\n\n```\nconst\
    \ userName='Anthony'\n```\n\n从前面的示例中，你可以看到变量 `username` 的第一个单词以小字母开头，第二个单词 `Name`\
    \ 的首字母大大写。这就是 React 中如果变量包含两个单词时的命名方式。如果变量名只有一个单词，它将全部为小写。请看以下示例：\n\n```javascript\n\
    const user='Anthony'\n```\n\n## 帕斯命名法\n\n帕斯命名规范是变量、函数或方法的名称以大写字母开头。请看以下示例：\n\n\
    ```javascript\nconst UserName='Anthony'\n```\n\n这种命名规范是 React 用于命名组件的方式。所有的 React\
    \ 组件必须遵循帕斯命名法。这是组件能够渲染的唯一方式。让我们来看这个组件的示例：\n\n```javascript\nimport React from\
    \ 'react';\nconst App=()=>{\n  return (\n    <p> Hello world</p>\n  )\n}\nexport\
    \ default App;\n```\n\n前面的示例向我们展示了一个 `App` 组件。你可以在第 3 行看到我们使用帕斯命名法命名了箭头函数组件。这是\
    \ React 组件命名的主要规则。这是使其能够渲染的第一规则。\n\n## 函数组件\n\n函数组件是普通的 JavaScript 函数，接收 props\
    \ 并返回一个 React 组件。该组件可以是箭头函数也可以是普通函数。它们可以像下面这样写：\n\n```javascript\nimport React\
    \ from 'react'\nconst App=()=>{\n  return (\n    <p>This is just a functional\
    \ component </p>\n  );\n};\nexport default App\n```\n\n或者\n\n```javascript\nimport\
    \ React from 'react'\nfunction App(){\n  return (\n    <p>This is just a functional\
    \ component </p>\n  );\n};\nexport default App\n```\n\n函数组件可以接收 `props`（可选）并在\
    \ React 组件体中渲染 `props` 值。让我们来看这个示例：\n\n```javascript\nimport React from 'react'\n\
    function App(props){\n  const {id}=props;\n  return (\n    <p>This is just a functional\
    \ component with {id} </p>\n  );\n};\nexport default App\n```\n\n前面的示例展示了 App\
    \ 函数组件接收了具有 `id` 属性的 `props` 对象，我们在第 4 行对其进行解构，并在第 6 行进行渲染。\n\n函数组件有一些非常常用的 `hook`\
    \ 方法。React Hooks 使得大多数开发者能够构建可的 React 应用。让我们来看以下方法：\n\n*   `useState`\n*   `useRef`\n\
    *   `useEffect`\n\n## useState\n\n`useState` 方法是一个非常常用的 React Hook，用于大多数函数组件。`useState`\
    \ 方法用于在函数组件中存储状态值（对象、字符串、布尔值等）。这些值在组件生命周期内发生变化。`useState` 接收一个初始值，在字符串的情况下可以为空。该值可以在组件生命周期内进行更新。让我们来看\
    \ `useState` 的示例。\n\n```javascript\nimport React,{useState} from \"react\";\n\
    const App=()=>{\n  const [user,setUser]=useState('');\n  return (\n    <input\
    \ type='text' onChange={(e)=>setUser (e.target.value)} />\n  )\n}\n```\n\n"
- fmt: "\nThe preceding example shows on line one that we imported the `useState`\
    \ hook from react library. We then defined the user state on line 5 and added\
    \ the `setUser`, which will update the value that is set to the user. The user\
    \ has an initial value of the empty string.\n\nIn line 9, we call the `onChange`\
    \ handler event and pass the anonymous function to it to update the state value.\n\
    \nLet us look at the same example with TypeScript.\n\n```typescript\nimport React,{useState}\
    \ from \"react\";\n\nconst App=()=>{\n  const [user,setUser]=useState<string>('');\n\
    \n  return (\n    <input type='text' onChange={(e)=>setUser (e.target.value)}\
    \ />\n  )\n}\n```\n\nThe difference between this and the previous example is that\
    \ TypeScript requires a type which is a string, and we provided it in line 5.\n\
    \n# useRef\n\nThe `useRef` method is also a very common react hook that is used\
    \ in most functional components. The `useRef` method is used to point to an element\
    \ in the `Document Object Model` (`DOM`). This can be used to create uncontrolled\
    \ elements. Let us see an example of the `useRef` in action where we want programmatically\
    \ to browse a file:\n\n```javascript\nimport React,{useRef} from \"react\";\n\n\
    const App=()=>{\n  const refInput=useRef(null);\n  const browseFile=()=>{\n  \
    \  if(refInput.current)\n    {\n      refInput.current.click()\n    }\n  }\n \
    \ return (\n    <>\n      <button onClick={browseFile}>Click to browse file</button>\n\
    \      <input type='file' ref={refInput} style={{ display: 'none' }} />\n    </>\n\
    \  )\n}\n\nexport default App;\n```\n\nIn the preceding example, you can see we\
    \ added the `useRef` hook from React on line one. We then used `useRef` to browse\
    \ for a file with the click of the button in line 16. There is another use case\
    \ of `useRef`, which we would look at. This example is to get the value from the\
    \ input file:\n\n```javascript\nimport React,{useRef} from \"react\";\n\nconst\
    \ App=()=>{\n  const refInput=useRef(null);\n\n  return (\n    <>\n      <input\
    \ type='text' ref={refInput} style={{ display: 'none' }} />\n    </>\n  )\n}\n\
    \nexport default App;\n```\n\nWe can get the value of the input file by using\
    \ the `ref` also. Here, we can use the `refInput.current.value` to get what the\
    \ user typed in on line 10.\n\n# useEffect\n\nThe `useEffect` method is also a\
    \ very common react hook that is used is most functional components. The `useEffect`\
    \ method is an asynchronous hook that lets us do asynchronous tasks on the component.\
    \ These asynchronous tasks include calling of API and setting the data to a `useState`.\
    \ The `useEffect` takes in two parameters, namely:\n\n* Fat arrow function\n*\
    \ An optional dependency arrays\n\nThe fat arrow function takes in an optional\
    \ `return` statement, which is used to clean up the component. This is necessary\
    \ to avoid component leakage. Let us see an example of the `useEffect` hook. We\
    \ would like to make an API call to `https://jsonplaceholder.typicode.com/todos`\
    \ and render the list in the react component.\n\n```javascript\nimport React,{useEffect,useState}\
    \ from 'react';\nconst App=()=>{\n  const [data,setData]=useState([]);\n  useEffect(()=>{\n\
    \    fetch('https://jsonplaceholder.typicode.com/todos')\n      .then(response=>response.json())\n\
    \      .then(data=>setData(data))\n      .catch(err=>console.log(err.message))\n\
    \  }, [])\n  return(\n    data.length>0 &&data.map(item=>{\n      return <ul key={item.id}>{item.title}</ul>\n\
    \    })\n  )\n}\nexport default App;\n```\n\nThe preceding component illustrates\
    \ how we use the `useEffect` hook for asynchronous operations. We used the `fetch`\
    \ method to call the API in line 5 and used promise chaining to get the data and\
    \ store it in our `useState` hook. We have an empty array as the second parameter\
    \ of `useEffect`. This indicates that it should run once. Should we need conditional\
    \ fetch from the API, we need to populate the dependency array with some parameters.\n\
    \n# Class component\n\nClass components are components that extend `React.Component`\
    \ subclass. This class component accepts `props` and renders them. It also starts\
    \ with `constructor`, which is then called by `super`. Let us see an example of\
    \ a class component:\n\n```javascript\nimport React from \"react\";\nimport \"\
    ./styles.css\";\n\nclass App extends React.Component{\n  constructor(props){\n\
    \    super(props);\n  }\n  render(){\n    return <p>This is a test</p>\n  }\n\
    }\nexport default App;\n```\n\nClass components have some lifecycle methods. Some\
    \ of the common lifecycle methods includes:\n\n* ComponentDidMount\n* ComponentDidUpdate\n\
    \n# ComponentDidMount\n\nThe `ComponentDidMount` method is a very important lifecycle\
    \ method in class component. This lifecycle method is called during the mounting\
    \ phase of a react component. This method helps us modify the content of the react\
    \ component before displaying data to the user. Let us see this lifecycle method\
    \ in action with an example.\n\n```javascript\nimport React from \"react\";\n\
    import \"./styles.css\";\n\nclass App extends React.Component{\n  constructor(props){\n\
    \    super(props);\n    this.state = {\n      message: \"This is a test message\"\
    \n    };\n  }\n  componentDidMount() {\n    this.setState({\n      message: \"\
    This is a new message\"\n    });\n  }\n  render(){\n    return <p>{this.state.message}</p>\n\
    \  }\n}\nexport default App;\n```\n\n# ComponentDidUpdate\n\nThe `ComponentDidUpdate`\
    \ method is a very important lifecycle method in class component. This lifecycle\
    \ method is called after the component has been updated. Let us see this lifecycle\
    \ method in action with an example:\n\n```javascript\nimport React from \"react\"\
    ;\nimport \"./styles.css\";\n\nclass App extends React.Component{\n  constructor(props){\n\
    \    super(props);\n    this.state = {\n      message: \"This is a test message\"\
    \n    };\n  }\n  componentDidUpdate(prevProps, prevState) {\n    if (prevState.message\
    \ !== this.state.message) {\n      console.log('Message state has changed.');\n\
    \    }\n  }\n  render(){\n    return <p>{this.state.message}</p>\n  }\n}\nexport\
    \ default App;\n```\n\n# Best way to structure a react component\n\nReact component\
    \ is the way to build a small to robust application. These React components need\
    \ to be structured in a good way so that they can be testable, scalable, and easy\
    \ to identify bugs. Let us look at some of the best ways to keep a good react\
    \ component structure.\n\n* **Avoid large components**: The large components are\
    \ a pain to read, understand, and debug most of the time. Yes, you can have a\
    \ large component, and the application would work just fine, but when issues arise,\
    \ how would you be able to debug? Therefore, you should break down your large\
    \ components into smaller components so it can be readable, testable, and identify\
    \ bugs easily.\n\n* **Give good naming of components and variables**: It is very\
    \ important to write variable names, method names or components names that are\
    \ reasonable. Avoid ambiguous naming.\n"
