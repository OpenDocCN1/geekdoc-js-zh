    \  }\n};\nfunction TodoTask() {\n  const [todos, dispatch] = useReducer(reducer,\
    \ initialTasks);\n  const handleComplete = (todo) => {\n    dispatch({ type: \"\
    COMPLETED\", id: todo.id });\n  };\n  return (\n    <>\n      {todos.map((todo)\
