    我非常感谢 Daniel Chukwurah、Augustina Nwahiri、Chidimma Udensi、Augusta Madubuko、Sandra
    Odiete 以及其他多到数不完的人，他们在撰写本书期间给了我巨大的支持。


    我的感谢还来自 BPB Publications 团队，感谢他们提供了足够的支持，留给我充足的时间让我完成本书章节的编写。


    # 前言


    本书涵盖了使用 `React.js` 构建应用的许多不同方面、使用 `React.js` 构建可扩展应用的重要性以及其最佳实践。本书深入探讨了我们在编写应用程序时常见的某些错误做法，并向我们展示了架构应用程序的更好方法。


    本书为 `React.js` 学习者采取了实用的方法。它也涵盖了一些真实的行业案例。它将涵盖如 `JavaScript` 等信息，`Typescript`
    基本上用于构建 `React` 应用。它还涵盖了状态管理、生命周期方法、样式以及结构化文件以提高可读性和可访问性的实用方法。


    本书分为 **9 章节**。这些章节将涵盖 `React.js` 的基础和高级内容。


    **第 1 章** 本章将介绍编写 `React` 应用的不同模式。是的，`React` 是有主见的，尽管它允许你根据自己的喜好或符合组织的需求来构建和结构化应用程序。然而，存在一些非常糟糕的习惯，当你的应用程序开始增长时，这些做法会对你的应用产生影响。


    本章将识别常见的错误做法，并建议构建可扩展 `React` 应用的实践。我们将使用 `JavaScript` 本章。


    **第 2 章** 本章将介绍如何编写组件。`React` 是基于组件的库，通过不同的复用组件来构建应用。基本上，本章将概述编写组件的不同方法，包括函数组件和类组件。


    虽然我们将更多关注函数组件，因为它是 `React` 最新的趋势，但仍有使用类构建的应用。我们将在示例中使用 `JavaScript` 和 `TypeScript`。


    **第 3 章** 在本章中，我们将学习编写整洁可维护的代码。我们还将介绍实现整洁可维护代码的模式。最后学习如何使用 `TypeScript` 构建 `react`
    应用。


    **第 4 章** 本章将介绍什么是 `React hooks`，并将介绍 `React` 中常用的 hooks。我们还将介绍如何编写自定义 hooks 及其在构建应用时的优势。我们将看到
    hooks 和自定义 hooks 如何在一个应用中结合。


    **第 5 章** 本章将介绍如何为 `React` 组件设置样式。这包括 `Scss` 和 `Less` 等预处理器。我们还将涵盖 `styled-components`
    和内联样式。此外，我们将介绍模块化 CSS。


    **第 6 章** 本章将介绍服务端渲染、何时使用它以及其优缺点。我们还将介绍一个流行的服务端框架（`Next.js`）以及它与客户端 `react` 库的区别。


    **第 7 章** 我们将介绍如何在 `React` 应用中获取数据。我们还将介绍可以用于远程获取数据到应用中的不同类型的库/API。我们还将介绍 `REST
    API` 和 `GraphQL` 的区别，以及如何缓存获取的数据并在应用中使用。我们还将介绍 `promises`、其优势以及它在我们的 react 应用中解决的问题。


