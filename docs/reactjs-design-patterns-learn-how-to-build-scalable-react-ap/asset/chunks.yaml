    # [Props drilling](#toc.xhtml_s7a)


    Props is one of the building blocks in react application. We often need this because
    we must share data between components. We might even need to pass data from the
    parent component down to a child component far below in the application tree.
    This is called **props drilling**. Do not use props for this because you will
    need to pass the parameter(s) on every component till it gets to the child component
    that needs it.


    To solve such problems, you will need to use **`ContextApi`** or **`Redux`**,
    depending on the size of your application.


