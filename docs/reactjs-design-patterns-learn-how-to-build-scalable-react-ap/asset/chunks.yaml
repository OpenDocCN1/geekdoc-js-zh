    # 关于作者


    **Anthony Onyekachukwu Okonta** 是一位软件开发人员，拥有 10 年以上的软件开发经验，熟悉 `vb.net`、`C#`、`Java`
    和 `JavaScript` 等多种编程语言。他曾工作于金融、教育和金融科技等不同行业。他于 2010 年毕业于尼日利亚 Delta State Ogume
    的 Novena 大学，获得信息技术学士学位。目前，他在 Technaura Systems GMBH 担任高级软件工程师。他喜欢踢足球、游泳和和朋友聚会。


    # 关于评审员


    **Daniel Chukwurah** 是 Afrinvest West Africa 的 Web 和移动端开发人员。在 Afrinvest，他开发的投资解决方案正在改变人们通过资金来实现财务自由的方式。他喜欢构建具有良好用户体验的可扩展
    Web 和移动应用，以满足业务目标并改变生活。在加入 Afrinvest 之前，他曾在 Sidmach Technologies Limited 担任软件工程师。Daniel
    是一位自学开发者，目前正在 Nexford 大学攻读 MBA。他也喜欢在技术活动中演讲。


    **Ravi Chaudhary** 是一位技术主管，具备全栈开发主管的知识，在处理客户沟通方面经验丰富，并参与了各种架构设计决策以及构建复杂的 Web 项目。使用
    `Node JS`（`MEAN Stack`、`Meteor`）进行 API 开发、数据库如 `Mongo DB`、`Mysql` 以及配合 `Redis`、`Socket.io`、`Kafka`、`LAMBDA`
    函数、服务器管理（`AWS`、`Digital Ocean` 以及 `Auto Scaling`、负载均衡器等技术），以及前端框架如 `ReactJS`。


    他在敏捷方法论和 Scrum 实施方面具有实战经验，并与产品和业务团队紧密合作，以扩展平台并提高效率。


