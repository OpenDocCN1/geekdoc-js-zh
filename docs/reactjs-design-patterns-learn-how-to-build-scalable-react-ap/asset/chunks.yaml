    # [Conclusion](#toc.xhtml_s85a)


    In this chapter, we looked into what React hooks are, their advantages, and their
    rules. We also looked at how to write custom hooks which are very helpful in extracting
    logic.


    In the upcoming chapter, we will look at styling and how to properly style a react
