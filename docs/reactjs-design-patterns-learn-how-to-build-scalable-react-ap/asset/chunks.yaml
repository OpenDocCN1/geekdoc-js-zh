    )\n}\nexport default App;\n```\n\n前面的示例是一个不受控组件的示例。你可以看到我们在第 8 行对 Dom 元素创建了引用。我们可以使用\
    \ `ref` 属性获取用户的值。\n\n# 结论\n\n在本章中，我们了解了应该如何命名组件和变量。我们还查看了函数组件、类组件以及它们的一些常用生命周期方法。\n\
