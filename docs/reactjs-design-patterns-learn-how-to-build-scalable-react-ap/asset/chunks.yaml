    \ 的优势\n\n# 目标 (toc.xhtml_s3a)\n\n本章的目标是查看构建 React 应用程序的不同方法，并判断优坏。它还将让我们了解 `JavaScript`\
    \ 和 `TypeScript` 在 React 应用中的优势。\n\n# 构建 React 应用程序的坏做法 (toc.xhtml_s4a)\n\nReact\
    \ 是由 Facebook 创建的一个有观点库，旨在帮助通过组件构建应用程序。是的，有观点意味着人们可以按照自己的意愿进行设计。应用程序可以以任何想要的方式结构化而仍然运行。我们将查看一些我们在使用\
    \ React 时有时会但并未意识到的坏做法。\n\n# 内联 CSS (toc.xhtml_s5a)\n\nReact 是由 Facebook 创建的一个有观点库，旨在帮助通过组件构建应用程序。是的，有观点意味着人们可以按照自己的意愿进行设计。应用程序可以以任何想要的方式结构化而仍然运行。我们将查看一些我们在使用\
    \ React 时有时会但并未意识到的坏做法。\n\n内联 CSS 仅仅是在组件内部对组件进行样式处理。这意味着在 HTML 标签中定义 CSS。让我们来看一个例子：\n\
    \n```javascript\nimport React from 'react'\nconst App = () => {\n  return <p style={{color:\
    \ 'red'}}>This is a test application</p>\n}\n```\n\n在前面的示例中，我们更改了段落的颜色。很容易实现。但如果我们想让这种红色应用到所有段落呢？让我们看看当有多个时会发生什么。参考代码：\n\
    \n```javascript\nimport React from 'react'\nconst App=() => {\n  return (\n  \
    \  <p style={{color: 'red'}}>This is a test application</p>\n    <p style={{color:\
    \ 'red'}}>\n  )\n}\n```\n\n尽管如此，由于以下原因不建议使用它：\n\n*   它无法复用。\n*   过度使用会导致代码不可读。\n\
    *   影响性能；在重新渲染时，样式对象将重新计算。\n\n# 大型组件 (toc.xhtml_s6a)\n\nReact 是一个用于使用复用组件构建大型应用的库。这些组件是应用程序的构建块。在我们的应用程序中，我们往往编写从逻辑到显示的所有内容的组件。这可能导致组件过长且不可读。当组件不可读时，调试和修复将变得不可能。\n\
    \n让我们看看另一个例子：\n\n```javascript\nimport React from \"react\";\nconst App = () =>\
    \ {\n  const userList = [\n    {\n      id: 1,\n      name: \"Anthony Okonta\"\
    ,\n      country: \"Nigeria\",\n    },\n    {\n      id: 2,\n      name: \"Sandra\
    \ Odiete\",\n      country: \"USA\",\n    },\n  ];\n\n  const userStateList =\
    \ [\n    {\n      id: 1,\n      state: \"Lagos\",\n    },\n    {\n      id: 2,\n\
    \      state: \"Alabama\",\n    },\n  ];\n```\n\n"
