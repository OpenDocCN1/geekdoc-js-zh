  raw: 'In this chapter, we have seen the different ways to achieve conditional re-rendering
    in React. We also looked into memoization and its benefits. We also looked at
    TypeScript and its benefits. We also looked at file organization and concluded
    with a separation of concerns and HOCs.


    In the upcoming chapter, we will look at testing.


    # [CHAPTER 9](#toc.xhtml_c09)


    # [Testing](#toc.xhtml_c09)


    # [Introduction](#toc.xhtml_s151a)


    This chapter will cover the testing of react components. We will be using Jest
    and Cypress for this chapter. Here, we will cover functional testing, integration
    testing, and end-to-end testing.


    # [Structure](#toc.xhtml_s152a)


    The following topics are to be covered:


    *   How to test components?


    *   Using Jest and React testing library to test applications


    *   How to do a regression Test?


    *   How to do the e2e test with Cypress?


    *   How to do an integration test with Jest?


    # [Objectives](#toc.xhtml_s153a)


    In this chapter, we will look at testing react components with Cypress, Jest,
    and React testing libraries. We will also look at mocking API with Jest and how
    to do a regression test with Jest. We will also look at the e2e test with Cypress.


    # [How to test components?](#toc.xhtml_s154a)


    Testing is very important in every Web application. Even in React, testing is
    very important, especially on its components. There are two ways to achieve this,
    which include the following:


    *   Functional test


    *   Rendering test


    # [Functional test](#toc.xhtml_s155a)


    A functional test is a test that is carried out to verify the functions work as
    they should. This test usually carries out assertiveness based on what should
    be the supposed outcome of the function being tested.


    # [Rendering test](#toc.xhtml_s156a)


    A rendering test is a test that is carried out to verify that your component renders
    correctly.


    # [Testing with Jest](#toc.xhtml_s157a)


    Jest is a very popular testing library when it comes to testing react applications.
    Jest is mostly used for running functional tests, but we can also use it for rendering
    tests. Let us see how we can use Jest to test some functions in our components.


    So, we will create a simple application to demonstrate how we can use Jest. Let
    us spin up our application. To do this, use the command as follows:


    **`npx create-react-app testing-with-jest`**


    Our application is being created:


    ![](images/Figure-9.1.jpg)


    **Figure 9.1:** Creating our react application


    Hurray, our application is ready!


    ![](images/Figure-9.2.jpg)


    **Figure 9.2:** Application installed


    Before we begin, please install the Jest package with the following command inside
    the testing-with-jest project:


    **`npm install –save—dev jest or yarn add --dev jest`**


    Now, we have installed our Jest package, and we can now start testing. There are
    different ways to organize your test files, but for this project, we will put
    them inside our **`__test__`** folder, which we will create:


    ![](images/Figure-9.3.jpg)


    **Figure 9.3:** File structure where we added tests


    After we have created this file, we can now start putting our test files into
    the folder. The test files usually end with **`.spec.js`** or **`.test.js`**.
    Whichever naming convention you want to do is completely up to you. Do not worry,
    Jest will find either of them or execute the tests inside of them. For the project,
    we will use the **`.test.js`**. So, we are going to create a simple file called
    **`Arithmetic.test.js`** and add four tests, which are added, subtracted, divided,
    and multiplied to test their assertiveness on them passing and failing the test
    criteria, which we will set for them. Let us look at the following:


