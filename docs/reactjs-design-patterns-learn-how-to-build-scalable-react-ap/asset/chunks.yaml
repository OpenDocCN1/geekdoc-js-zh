- fmt: "\nMemoizing, in simple terms, means memorizing or storing in memory. A memoized\
    \ function is usually faster because if the function is called subsequently with\
    \ the previous value(s), then instead of executing the function, we will be fetching\
    \ the result from the cache.\n\nIn React, we can achieve memorization in the following\
    \ two ways.\n\n* `useMemo`\n* `useCallBack`\n\n# useMemo\n\nReact has a built-in\
    \ hook called `useMemo` that allows you to memoize expensive functions so that\
    \ you can avoid calling them on every render. You simply pass in a function and\
    \ an array of inputs, and `useMemo` will only recompute the memoized value when\
    \ one of the inputs has changed. Let us look at `useMemo` with the following example:\n\
    \n```javascript\nimport React,{useMemo} from 'react'\nconst values = [3, 9, 6,\
    \ 4, 2, 1];\nconst MyApp=()=>{\n  const result=useMemo(()=>{\n    return values.sort().join(',')\n\
    \  },[])\n  return (\n    <p>{result}</p>\n  )\n}\nexport default MyApp;\n```\n\
    \nThe preceding code will return 1, 2, 3, 4, 6, and 9 as a result in line 9 because\
    \ the data has already been computed and will not recompute until the values array\
    \ changes in line 2.\n\n# useCallback\n\nReact has a built-in hook called `useCallBack`\
    \ that allows you to memoize expensive functions so that you can avoid calling\
    \ them on every render. You simply pass in a function and an array of inputs,\
    \ and `useCallback` will only recompute the memoized function when one of the\
    \ inputs has changed. Let us look at `useCallBack` with the following example:\n\
    \n```javascript\nimport React,{useCallback} from 'react'\nconst values = [3, 9,\
    \ 6, 4, 2, 1];\nconst MyApp=()=>{\n  const callBackResult=useCallback(()=>{\n\
    \    return values.sort().join(',')\n  },[])\n  return (\n    <p>{callBackResult()}</p>\n\
    \  )\n}\nexport default MyApp;\n```\n\nThe preceding code will return 2 as a result\
    \ in line 11 because the data has already been computed and will not recompute\
    \ until the values array changes in line 2.\n\n# State management\n\nState management\
    \ is another way of caching data and using it in your react application. The data\
    \ that is cached from an API can be stored in our state management like and used\
    \ in our application globally. Although the data is cached but on refreshing the\
    \ page, it will lose the data, and you will need to re-fetch it again. Also, you\
    \ can fetch the data and store it in React application state.\n\n# Promises\n\n\
    A promise is used to handle asynchronous calls in JavaScript. They are effective\
    \ in managing multiple asynchronous calls, which can lead to callback hell. When\
    \ an asynchronous call has been made, the promise returned is an object, and it\
    \ can be in four states which are as follows:\n\n* Fulfilled: This shows that\
    \ the asynchronous call was successful\n* Rejected: This shows that the asynchronous\
    \ call has an error\n* Pending: It neither fulfilled nor rejected\n* Settled:\
    \ It is either fulfilled or rejected.\n\n# Conclusion\n\nIn this chapter, we learnt\
    \ about data fetching in React and the different libraries we can use to fetch\
    \ data from an API or resource. We also looked at the difference between GraphQL\
    \ and Rest API. We also looked at caching data and using it in our application\
    \ and concluded by looking at promises.\n\nIn the upcoming chapter, we will look\
    \ at building scalable applications in React.\n\n# CHAPTER 8: Building Scalable\
    \ Applications\n\n# Introduction\n\nThis chapter will cover ways to build scalable\
    \ and high-performance applications in React. We will look at some best practices,\
    \ concepts, and benefits of building such applications in React.\n\n# Structure\n\
    \nThe following are topics to be covered:\n\n* Conditional rendering\n* Memoization\n\
    * Typescript\n* File organization\n* Separation of concerns\n* Higher order components\n\
    * Solid principles\n\n# Objectives\n\nIn this chapter, we will look at how we\
    \ can achieve scalable and high-performance applications in React. We will look\
    \ at how we can organize our file structure and its benefits. We will also look\
    \ at conditional rendering and ways to achieve this. We will also look at TypeScript\
    \ and the separation of concerns. Finally, we will look at HOC and solid principles.\n\
    \n# Conditional rendering\n\nIn building React application, there will always\
    \ be times when you do not want to re-render the component except for some props\
    \ or value changes, or a condition is met; this is called conditional rendering.\
    \ Let us look at ways to make conditional rendering in React:\n\n* Ternary operation\n\
    * AND logical operation\n* If else operation\n\n# Ternary operation\n\nThe ternary\
    \ operator is commonly used in JavaScript for conditional operations. It is denoted\
    \ by a single question mark `?` followed by the first condition and `:` followed\
    \ by the next condition. It basically tests if the first condition is met and,\
    \ if yes, ignores the second condition and vice versa. Let us look at the following.\
    \ It shows how we can use this ternary operator in our React component:\n\n```javascript\n\
    import React from 'react';\nconst ComponentOne=()=>{\n  return (\n    <div>\n\
    \      Component One\n    </div>\n  )\n}\nexport default ComponentOne;\n```\n\n\
    The preceding code returns a `div` with `ComponentOne` text inside it.\n\n```javascript\n\
    import React from 'react';\nconst ComponentTwo=()=>{\n  return (\n    <div>\n\
    \      Component Two\n    </div>\n  )\n}\nexport default ComponentTwo;\n```\n\n\
    ```javascript\nimport {useState} from 'react';\nimport ComponentOne from \"./ComponentOne\"\
    ;\nimport ComponentTwo from \"./ComponentTwo\";\nimport \"./styles.css\";\n\n\
    export default function App() {\n  const [isComponentVisible, setIsComponentVisible]=useState(false);\n\
    \  return (\n    <div className=\"App\">\n      {isComponentVisible?ComponentOne\
    \ : ComponentTwo}\n    </div>\n  );\n}\n```\n\nThe preceding code will display\
    \ only `Component Two` because the first condition is not met in line 11. Let\
    \ us see what this would look like in our browser:\n\n/images-8.1\n\n# Logical\
    \ operation\n\nAND logical operator is commonly used in JavaScript for conditional\
    \ operations. It is denoted by a double `&&`. It basically tests if the first\
    \ condition is met and, if yes, runs the code after. Let us look at how we can\
    \ use this `&&` operator in our React component as follows:\n\n```javascript\n\
    import React from 'react';\nconst ComponentOne=()=>{\n  return (\n    <div>\n\
    \      Component One\n    </div>\n  )\n}\nexport default ComponentOne;\n```\n\n\
    The preceding code returns a `div`. \n\n```javascript\nimport React from 'react';\n\
    const ComponentTwo=()=>{\n  return (\n    <div>\n      Component Two\n    </div>\n\
    \  )\n}\nexport default ComponentTwo;\n```\n"
