  trans: "\n前面的示例非常有道理，因为我们可以看到开发者在这里尝试做什么。他只是地声明了描述性值 `firstName` 和 `lastName`，并分别将值\
    \ `Anthony` 和 `Okonta` 赋值给它们。\n\n*   **所有函数必须只做一件事**：我们在应用程序中编写函数都是来帮助自己。这些函数可以根据我们的目标执行各种操作，但请记住，每个函数应该只做一件事。假设你需要一个函数，将所有单词转换为大写字母，然后将结果发送到\
    \ API 端点。大多数情况下，我们在同一个函数内返回大写后的结果并将参数传递给端点。让我们来看下面的示例，看看我们在讨论什么。\n\n```javascript\n\
    capitalizeWords('anthony')\n\nfunction capitalizeWords(word){\n  const convertedWord=word.toUpperCase();\n\
    \  sendConvertedWord(convertedWord)\n}\n\nasync function sendConvertedWord(convertedWord){\n\
    \  return await fetch('api.com',{\n    method:'POST',\n    headers:{\n      accept:'application/json'\n\
    \    },\n    body:(JSON.stringify({\n      word:convertedWord\n    }))\n  })\n\
    }\n```\n\n前面的代码显示了两个函数（`capitalizeWords` 和 `sendConvertedWord`），它们做了两个不同的事情。前面的\
    \ `capitalizeWords` 接收一个名为 `word` 的参数，并将单词大写化，然后在第 6 行调用 `sendConvertedWord` API\
    \ 并参数传递给它。这可以运行，但会有问题，因为该函数没有只做一件事（即将传入的单词转换为大写）。让我们来看正确的示例。\n\n```javascript\n\
    const capitalizedWord=capitalizeWords('anthony');\nif(capitalizedWord)\n{\n  sendConvertedWord(capitalizedWord)\n\
    }\n\nfunction capitalizeWords(word){\n  if(typeof word ==='string'){\n    return\
    \ word.toUpperCase();\n  }\n  else{\n    return null;\n  }\n}\n\nasync function\
    \ saveWord(convertedWord){\n  return await fetch('api.com',{\n    method:'POST',\n\
    \    headers:{\n      accept:'application/json'\n    },\n    body:(JSON.stringify({\n\
    \      word:convertedWord\n    }))\n  })\n}\n```\n\n你可以从前面的代码中看到，我们成功地让 `capitalizeWords`\
    \ 函数只做了一件事，即将单词大写并在第 1 行返回给调用者。然后我们在第 7 行将返回的参数发送给 `sendConvertedWord` 函数。\n\n\
    请注意，这是此示例中使用的占位 API。\n\n*   **保持函数短小且精确**：保持函数短小精确是实现清洁代码的方法之一。当你的函数变得非常大时，很难阅读。尝试保持它们非常短，最多\
    \ 50–60 行。\n\n*   **从 master 分支分支时提供具有描述性的分支名称**：我们的大部分代码将推送到在线仓库（GitHub、Bitbucket\
    \ 等），因为它们无疑将成为事实来源，允许我们进行**持续集成**（`CI`）和**持续交付**（`CD`）。我们会从 master 分支创建一个分支来开发新功能或修复\
