- fmt: "\nThe HTML is generated at build time and will be reused on each request.\
    \ To make a page, use Static Generation, either export the page component or export\
    \ `getStaticProps` (and `getStaticPaths` if necessary). It is great for pages\
    \ that can be pre-rendered ahead of a user's request. You can also use it with\
    \ client-side rendering to bring in additional data. We will look at ways you\
    \ can generate static which are as follows:\n\n* Static page without data\n* Static\
    \ page with data\n\n## Static page without data\n\nNext.js pre-renders these pages\
    \ without fetching data from any source or backend. Let us look at this with the\
    \ aid of an example:\n\n```javascript\nfunction Contact(){\n  return <div>Contact</div>\n\
    }\n\nexport default Contact\n```\n\nThe preceding example does not fetch any data\
    \ from the backend or any source.\n\n## Static page with data \n\nSome pages require\
    \ fetching external data for pre-rendering. There are two ways this can be done:\n\
    \n* Content depends on external data\n* Paths depend on external data\n\n### Content\
    \ depends on external data\n\nYour page might need to get data from an API from\
    \ an external source. Let us look at an example of this:\n\n```javascript\nfunction\
    \ UserList({ users }) {\n  return (\n    <ul>\n      {users.map((user) => (\n\
    \          <li>{user.firstname}</li>\n          <li>{user.lastname}</li>\n   \
    \   ))}\n    </ul>\n  )\n}\nexport default UserList\n```\n\nThe preceding example\
    \ fetches this data on pre-render. Let us look at how this `getStaticProps` work\
    \ with the following code:\n\n```javascript\nfunction UserList({ users }) {\n\
    \  return (\n    <ul>{users.map((user) => (\n        <li>{user.firstname}</li>\n\
    \        <li>{user.lastname}li))}\n    </ul>)\n  }\n}\nexport async function getStaticProps()\
    \ {\n  const res = await fetch('https://…/users')\n  const users = await res.json()\n\
    \  return {\n    props: {\n      users,\n    },\n  }\n}\nexport default UserList\n\
    ```\n\n### Paths depend on data\n\nFor example, create a `.js` file called `users/[id].js`\
    \ to show a single user detail based on its `id`. We need to export an `async`\
    \ function called `getStaticPaths` from our `users/[id].js` file. Let us look\
    \ at this with the aid of an example:\n\n```javascript\nfunction UserList({ users\
    \ }) {\n  return (\n    <ul>{users.map((user) => (\n        <li>{user.firstname}</li>\n\
    \        <li>{user.lastname}li))}\n    </ul>)\n  )\n}\nexport async function getStaticPaths()\
    \ {\n  const response = await fetch('https://…/users')\n  const users = await\
    \ response.json()\n  const paths = users.map((user) => ({\n    params: { id: user.id\
    \ },\n  }))\n  return { paths, fallback: false }\n}\nexport async function getStaticProps({\
    \ params }) {\n  const response = await fetch(`https://…/ users/${params.id}`)\n\
    \  const users = await response.json()\n  return { props: { users } }\n}\nexport\
    \ default UserList\n```\n\n### GetServerSideProps\n\nThe HTML is generated on\
    \ each request by exporting the async function called `getServerSideProps`. Let\
    \ us look at how this works with the aid of an example:\n\n```javascript\nfunction\
    \ UserList({ users }) {\n  return (\n    <ul>{users.map((user) => (\n        <li>{user.firstname}</li>\n\
    \        <li>{user.lastname}li))}\n    </ul>)\n  )\n}\nexport async function getServerSideProps()\
    \ {\n  const res = await fetch(`https://…/users`)\n  const data = await res.json()\n\
    \  return { props: { data } }\n}\nexport default UserList\n```\n\n## Next.js versus\
    \ React.js\n\nBoth Next.js and React.js are very good to use when building applications.\
    \ We are now going to compare both in the following ways:\n\n* Maintainability\n\
    * TypeScript\n* Configuration\n* Server-side rendering\n* Image optimization\n\
    \n| React App | Next.js |\n| :--- | :--- |\n| CRA is opinionated. | NextJs is\
    \ also well maintained. |\n| `npx create-react-app my-app --template` is used\
    \ to add typescript from scratch. | Start with configurations for typescript with\
    \ `tsconfig.json` |\n| Configurations like Web pack cannot be changed. | Almost\
    \ everything is configurable. |\n| CRA does not support SSR out the box. | NextJs\
    \ has different types of SSR. It supports SSR out the box. |\n| CRA does not have\
    \ much to offer in image optimization. | Next.js has a built-in image component\
    \ called `next/image`. |\n\n### Server-side rendering with Node.js and Express.js.\n\
    \nServer-side rendering with Node.js and Express.js is another way to render react\
    \ pages from the server side. The `express.js` creates a route that we can use\
    \ to request specified pages based on the route from the user. You can find more\
    \ details in the following link: [https://www.digitalocean.com/community/tutorials/react-server-side-rendering](https://www.digitalocean.com/community/tutorials/react-server-side-rendering)\n\
    \n## Conclusion\n\nWe have successfully looked at what server-side rendering is\
    \ and when to use it. We also looked at Next.js and its pros and cons with detailed\
    \ examples. We concluded by looking at some of the differences between creating\
    \ react app and Next.js.\n\nIn the upcoming chapter, we will look at data fetching.\n\
    \n# CHAPTER 7: Data Fetching\n\n### Introduction\n\nIn this chapter, we will look\
    \ at how to fetch data in our React application. We will also look at the different\
    \ types of libraries/APIs we can use to fetch data remotely into our application.\
    \ We will also look at the difference between REST API and GraphQL and how to\
    \ cache the fetched data and use it in our application. We will also look at promises,\
    \ their benefits, and what it solves in our react application.\n\n### Structure\n\
    \n* Ways to fetch data from a server in React\n* Rest API versus GraphQl\n* Caching\
    \ data from API and use in your application\n* Promises\n\n### Objectives\n\n\
    In this chapter, we will learn how to use the different JavaScript APIs/libraries\
    \ to fetch data from a server. We will look at the difference between Rest API\
    \ and GraphQL also caching data in our application with detailed examples. We\
    \ will also use promises to resolve fetched data in our application.\n\n### Fetching\
    \ data in React\n\nIn most React applications, data from an API or server is likely\
    \ needed for that application to work. We submit data from our application to\
    \ the server to receive some sort of response. There are several ways to fetch/send\
    \ this data to the API or server, and we can do this by inbuilt API or external\
    \ `npm` packages. The following are some of them, and we will look at them with\
    \ the aid of an example:\n\n* Fetch\n* Axios\n\n### Fetch\n\nThis is a commonly\
    \ used API in JavaScript and React applications. Fetch provides a generic definition\
    \ of Request and Response objects (and other things involved with network requests).\
    \ This will allow them to be used wherever they are needed in the future, whether\
    \ it is for service workers, Cache API, and other similar things that handle or\
    \ modify requests and responses or any kind of use case that might require you\
    \ to generate your responses programmatically (that is, the use of computer program\
    \ or personal programming instructions).\n"
