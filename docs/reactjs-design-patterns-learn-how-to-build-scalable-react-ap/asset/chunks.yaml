    # [Solid principles](#toc.xhtml_s149a)


    Solid principles are object design principles that were written by Robert Martin
    in 2000. Solid is an acronym for the following:


    *   **Single Responsibility Principle** (**SRP**)


    *   **Open/Closed Principle** (**OCP**)


    *   **Liskov Substitution Principle** (**LSP**)


    *   **Interface Segregation Principle** (**ISP**)


    *   **Dependency Inversion Principle** (**DIP**)


    These principles were designed for objects, but they can be used in other languages,
    such as JavaScript. Let us see how SOLID can be used in React.js:


    *   **Single Responsibility Principle (SRP)**: This principle implies that every
    component should do one thing. When designing your react application, keep this
    principle in mind because it will make your code more readable and maintainable.


    *   **Open/Closed Principle (OCP)**: This principle says that your code should
    be extendable without having to break or rewrite a module. This is important so
    that we can add features to our application without reworking it.


    *   **Liskov Substitution Principle (LSP)**: This principle states that every
    subclass should be a substitute for its base class. This simply means that if
    we have a class called Make and it extends to another class called Car, we should
    be able to extend the class Make without touching the functionality of the Car
    class. This is possible with class components or when using TypeScript in React.


    *   **Interface Segregation Principle (ISP)**: This principle states that one
    should only use interfaces that they need. In React, this can be said to be props.
    Props is very vital in every React application. These props, when passed down
    from parent to child components, one should only pass down what they need as against
    everything in the props. We can achieve this by destructuring our props before
    passing them.


    *   **Dependency Inversion Principle (DIP)**: This principle states that we should
    hide code implementation and just interact with them by abstraction.


    # [Conclusion](#toc.xhtml_s150a)'
