  trans: "\n\nSASS 和 LESS 是非常优秀的 CSS 预处理器。CSS 预处理器是一种允许你从预处理器特有的独特语法生成 CSS 的程序。SASS\
    \ 和 LESS 在 React 应用中非常好用，因为它们拥有非常丰富的功能，例如 SASS 中的 Mixins 等。\n\n# 文件/文件夹结构\n\n\
    在大多数时候，我们不确定如何设置文件夹和文件结构，才能最好地服务我们正在开发的应用程序。是的，React 是有主张的（opinionated），但我们应该记住的一点是，文件/文件夹结构非常重要，因为它为应用程序中放置/查找某些内容提供了方向感。\n\
    \n这取决于你，但在构建此类文件结构时，请务必记住将来会接手代码的其他人。\n\n# 命名规范\n\n这非常重要，因为给应用程序赋予了意义。它使得应用程序在查看逻辑之前就能易于理解。当变量、函数、方法以及文件/文件夹的命名得当时，在应用程序中追踪问题将变得非常简单，因为人们清楚每个变量或函数在做什么。我通常建议在为应用程序命名时记住这一点。\n\
    \n# 使用 useMemo 和 useCallback 进行渲染\n\n在使用 React hooks 时，`useMemo` 和 `useCallback`\
    \ 是非常有效的性能钩方法。`useMemo` 用于缓存一个计算结果并返回其值。该计算不会在每次渲染时执行。它是一个接收两个参数的钩，即箭头函数和依赖数组。依赖数组是可选的，但如果传递了参数，则只有当参数变化时函数才会再次运行，并返回结果值。`useCallback`\
    \ 也是如此，但主要的区别是 `useMemo` 返回的是记忆化的值，而 `useCallback` 返回的是记忆化的函数。让我们来看下面的示例，帮助我们理解这两个钩的作用，以及为什么它们在构建可扩展且快速的应用程序中如此重要。\n\
    \n我们从 `useMemo` 开始。让我们看看下面的代码：\n\n```javascript\nimport React,{useMemo} from \"\
    react\";\nconst App = (props) => {\n  const value=useMemo(()=>{\n    return 123;\n\
    \  },[])\n  return (\n    <section>\n      {value}\n    </section>\n  );\n};\n\
    export default App;\n```\n\n第 5 行无论组件重新渲染多少次，将始终返回值 `123`。这是因为依赖数组没有变化，所以 React\
    \ 不需要重新计算该值。\n\n让我们来看看 `useCallBack` 会做什么：\n\n```javascript\nimport React,{useCallback}\
    \ from 'react';\nconst App=()=>{\n  const [count, setCount] = useState(0)\n  const\
    \ increaseCount=useCallback(()=>{\n    setCount(count+1)\n  },[])\n  return (\n\
    \    <button onClick={increaseCount}>Set Increase</button>\n  )\n}\nexport default\
    \ App;\n```\n\n# 使用 Prettier\n\nPrettier 是一个强制代码一致性的开源工具。它让你的代码看起来整洁易读。它强制执行你设置的规则。\n\
    \n# 使用 Linter 及其规则\n\nLinter 帮助你组织代码，特别是 import 的层次结构。Linter 会提醒你一些 JavaScript\
    \ 错误。在应用程序中使用 Linter 及其规则可以让你的生活变得简单。\n\n# 使用 try…catch\n\n无论我们的应用程序有多完美，注定会有错误。错误可能来自\
    \ API，甚至来自用户输入，这些我们在测试期间没有预料到甚至没有考虑。这就是为什么始终将你的逻辑或 API 调用封装在 `try` 和 `catch` 中是非常重要的，这样就可以捕获意外的错误。\n\
    \n# 记录错误\n\n在我们捕获错误的同时，我们也需要记录它们。记录这些错误可以告诉我们在应用程序内操作的生命周期期间到底发生了什么。我们可以将此错误记录到文件中，或者创建一个服务，将这些错误推送到\
    \ API 甚至数据库。这是至关重要的，而且通常是生产环境中应用程序出现问题时的首要调用点之一。它可以救于水急。\n\n# React 错误边界 (error\
    \ boundary)\n\n在我们的应用程序中，有时 UI 会出现某些错误，页面将显示白屏；这可以通过 React 错误边界来解决。React 错误边界有助于捕获应用程序错误，并向用户显示友好的消息或屏幕。友好的错误消息或屏幕通常是一个备用组件（fallback\
    \ component）。让我们参考下面的示例：\n\n```javascript\nclass ErrorBoundary extends React.Component\
    \ {\n  constructor(props) {\n    super(props);\n    this.state = { hasError: false\
    \ };\n  }\n  static getDerivedStateFromError(error) {\n    return { hasError:\
    \ true };\n  }\n  componentDidCatch(error, errorInfo) {\n    errorService.log({\
    \ error, errorInfo });\n  }\n  render() {\n    if (this.state.hasError) {\n  \
    \    return <p>Oops, 出问题了。</p>;\n    }\n    return this.props.children;\n  }\n\
    }\n```\n\n如果 16 为真，则会返回 17。为了捕获异步错误，我们应该添加 `try` 和 `catch` 块。\n\n# 测试你的代码\n\n\
    大多数开发者不喜欢为他们的应用程序编写测试（包括我也），但随着时间的推移，我开始沉迷单元测试和集成测试。随着应用程序的增长，实现测试将变得非常重要，以避免问题。测试可以巩固代码，并确保你的函数和逻辑正在正常工作。\n\
    \n# 组件名称必须使用驼峰命名法 (Pascal case)\n\n React 组件的命名规范通常是驼峰命名法。它以大写字母开头，如果不这样做将导致组件无法渲染。从我们目前的所有示例中可以看出，我们将组件命名为\
    \ `App`。注意命名是以大写字母开头的。\n\n不要这样做\n\n```javascript\nimport React from 'react';\n\
    const app=(){\n  return (\n    <p>This is just a test</p>\n  )\n}\nexport default\
    \ app;\n```\n\n应该这样做\n\n```javascript\nimport React from 'react';\nconst App=(){\n\
    \  return (\n    <p>This is just a test</p>\n  )\n}\nexport default App;\n```\n\
    \n# 提取复用逻辑\n\n这在 React 应用中非常重要，因为它解决了不必要的重复。跨应用程序使用的逻辑可以提取到组件中，并在任何给定的时间使用。这是\
    \ **不要重复自己** (**DRY**) 技术的另一种形式。这可以为你节省大量的代码，并帮助你隔离错误，因为这只有一个真理来源，即你的复用组件/逻辑。\n\
    \n# 在 React 应用中使用 JavaScript 的优势\n\nReact 是一个使用 JavaScript 的库。我们将查看在我们的 React\
    \ 应用中使用 JavaScript 的优势。\n\n"
- fmt: "\n*   **Easy to learn/use**: JavaScript is simple to learn and implement.\
    \ There are loads of tutorials out there that teach JavaScript from elementary\
    \ to advanced. This knowledge is the same one would use in react applications.\
    \ Even if your JavaScript knowledge is from vanilla JavaScript, it would still\
    \ be useful. However, you would need to start learning some ECMA SCRIPT 6 (`es6`)\
    \ upwards to make use of react very well. Most tutorials on react out there are\
    \ mainly on JavaScript as against TypeScript, so this is a big advantage for those\
    \ who like to code in JavaScript.\n*   **Speed**: Another benefit of developing\
    \ react applications in plain JavaScript is because of its speed in development\
    \ and execution. Since it is a client-side language (for most react applications),\
    \ its development is straightforward and easy and has no compilation time.\n*\
    \   **Performance**: React JS was designed with the provision of high performance\
    \ in mind. The core of the framework offers a virtual DOM program and server-side\
    \ rendering, which makes complex apps run extremely fast that has JavaScript as\
    \ its backbone.\n\n# Benefits of using TypeScript in React application\n\nReact\
    \ is a library that uses JavaScript. But react also uses TypeScript, which transpiles\
    \ to JavaScript using `babel` so that our browser can understand it. There is\
    \ a slightly different syntax of TypeScript and JavaScript, but we would look\
    \ at the benefits of using Typescript in our react application.\n\n*   **Types\
    \ safety**: TypeScript offers type safety checks when variables are declared,\
    \ or functions are defined. This helps avoid wrong variable assignments to already\
    \ defined variable types. This will help reduce errors and bugs to their barest\
    \ minimum.\n*   **Interfaces**: Typescript allows you to define complex type definitions\
    \ for your application using Interfaces. This helps to check the types that are\
    \ passed and so ensures that the number of bugs is reduced.\n\n# Conclusion\n\n\
    What we have learnt so far in this chapter are the bad practices most of us use\
    \ in React. We also learnt the best practices on how to create your React application\
    \ and the benefits of JavaScript and TypeScript in React. We all know React is\
    \ opinionated, but this chapter has helped us to know some of the best ways to\
    \ go about your application.\n\nIn the upcoming chapter, we will look at how to\
    \ write components and the benefits of controlled vs uncontrolled components.\
    \ We will look at class components and functional components and some of their\
    \ lifecycle methods.\n\n# CHAPTER 2\n\n# Writing Components\n\n## Introduction\n\
    \nThis chapter will cover how to write components. React is a component-based\
    \ library whereby different reusable components are used to build an application.\
    \ Basically, this chapter will outline the different ways of writing components,\
    \ which include functional and class-based components.\n\nAlthough we will focus\
    \ more on functional-based components because it is the most recent in React Docs,\
    \ there are still applications built with class components. We will be using JavaScript\
    \ and TypeScript for our examples in this chapter.\n\n## Structure\n\nThe following\
    \ topics are to be covered:\n\n*   Naming conventions\n*   Functional components\n\
    *   Class components\n*   Best ways to structure components\n*   Data sharing\
    \ between components\n*   Controlled versus uncontrolled components\n\n## Objectives\n\
    \nIn this chapter, we will learn the different naming conventions in programming.\
    \ We will also look at the naming conventions when naming variables, methods,\
    \ and functions. We will also look at how we name Components in React.\n\nWe will\
    \ look at functional components and class components and ways to share data between\
    \ components. We would conclude by looking at controlled versus uncontrolled components.\n\
    \n## Naming conventions\n\nIn programming, there are two mostly used naming conventions,\
    \ namely:\n\n*   Camel case\n*   Pascal case\n\n## Camel case\n\nCamel case naming\
    \ convention is starting the name of a variable, function, or method with a small\
    \ letter or the first part with small letters, and the first letter of the other\
    \ word starts with a capital letter. Kindly look at the following example:\n\n\
    ```\nconst userName='Anthony'\n```\n\nFrom the preceding example, you can see\
    \ the variable `username` starting with small letters for the first word and the\
    \ first of the second-word `Name` starting with a capital letter. This is how\
    \ variables are named in react if they have two words in the variable. If the\
    \ variable name has just one word, it will all be small letters. Kindly see the\
    \ following example:\n\n```javascript\nconst user='Anthony'\n```\n\n## Pascal\
    \ case\n\nPascal case naming convention is giving the name of a variable, function,\
    \ or method with a capital letter. Kindly look at the following example:\n\n```javascript\n\
    const UserName='Anthony'\n```\n\nThis naming convention is what react uses to\
    \ name components. All React components must follow the pascal naming convention.\
    \ This is the only way the component will render. Let us look at an example of\
    \ the following component:\n\n```javascript\nimport React from 'react';\nconst\
    \ App=()=>{\n  return (\n    <p> Hello world</p>\n  )\n}\nexport default App;\n\
    ```\n\nThe preceding example shows us an `App` component. You can see in line\
    \ 3 that we named the arrow function component with a Pascal naming convention.\
    \ This is the main rule of react component naming. This is the first rule to making\
    \ it render.\n\n## Functional component\n\nFunctional components are plain JavaScript\
    \ functions that take in props and return a react component. This component can\
    \ be either a fat arrow function or a normal function. They can be written like\
    \ the following:\n\n```javascript\nimport React from 'react'\nconst App=()=>{\n\
    \  return (\n    <p>This is just a functional component </p>\n  );\n};\nexport\
    \ default App\n```\n\nOR\n\n```javascript\nimport React from 'react'\nfunction\
    \ App(){\n  return (\n    <p>This is just a functional component </p>\n  );\n\
    };\nexport default App\n```\n\nThe functional component can accept `props` (optional)\
    \ and render the `props` value in the react component body. Let us take a look\
    \ at an example of this:\n\n```javascript\nimport React from 'react'\nfunction\
    \ App(props){\n  const {id}=props;\n  return (\n    <p>This is just a functional\
    \ component with {id} </p>\n  );\n};\nexport default App\n```\n\nThe preceding\
    \ example shows that the App functional component receiving `props` object that\
    \ has an `id` property, which we destructured on line 4 and displayed in the render\
    \ on line 6.\n\nThe functional components have some very common `hook` methods.\
    \ React hooks have enabled most developers to build scalable react applications.\
    \ Let us look at some of the following methods:\n\n*   `useState`\n*   `useRef`\n\
    *   `useEffect`\n\n## useState\n\nThe `useState` method is a very common react\
    \ hook that is used is most functional components. The `useState` method is used\
    \ to store state values (objects, strings, Boolean, and so on) in a functional\
    \ component. These values are mutated during the lifecycle of the component. The\
    \ `useState` takes an initial value which can be empty in the case of a string.\
    \ The value can be updated during the lifecycle of that component. Let us look\
    \ at an example of the `useState`.\n\n```javascript\nimport React,{useState} from\
    \ \"react\";\nconst App=()=>{\n  const [user,setUser]=useState('');\n  return\
    \ (\n    <input type='text' onChange={(e)=>setUser (e.target.value)} />\n  )\n\
    }\n```\n"
