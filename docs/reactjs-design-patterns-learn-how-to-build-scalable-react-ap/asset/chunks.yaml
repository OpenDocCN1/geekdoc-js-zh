    # [TypeScript](#toc.xhtml_s145a)


    TypeScript is a superset of JavaScript. TypeScript helps to build scalable applications
    because it is strongly typed. TypeScript compiles to JavaScript at runtime with
    the help of Babel. We have used some TypeScript examples in this book so far,
    but we would look at the concepts and things to note when building applications
    with TypeScript. To create a react TypeScript application, we use the following
    commands:


    **`npx create-react-app myapp –-template typescript`**


    Here, **`myapp`** is the name of our application. It is forbidden to use any capital
    letter when stating the name of the app.


    TypeScript has some advantages that can make your application scalable, which
    include the following:


    *   Its strongly typed features reduce errors


    *   Data types are easily defined


    # [File organization](#toc.xhtml_s146a)


    Yes, we know React is an opinionated library that gives you the opportunity to
    design it how you like, but if you want to achieve a good application, it is best
    you follow some best practices on how to name and organize your files and folders
    for your application. We will look at some suggested ways in which you can organize
    your application folder and files.


    *   **Components**: Just as the name components is pronounced, you need to put
    all your components in this folder. This folder would contain your JSX files,
    CSS files, and types (if you are using TypeScript).


    *   **Assets**: Assets are where we have media files such as images, some CSS
    (if you like), videos, and so on.


    *   **Helpers**: The helper folder is where we put common reusable functions.
    These functions are called whenever they are needed around the application


    *   **Constants**: The constants folder is where you put things that will not
    change.


    *   **API**: A folder is where you put your calls to your API and its functions.


    *   **Hooks**: The hooks folder is where one puts custom hooks.


