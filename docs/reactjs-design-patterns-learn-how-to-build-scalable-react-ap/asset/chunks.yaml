    # About the Author


    **Anthony Onyekachukwu Okonta** is a software developer with 10+ years of experience
    in Software Development with different coding languages like `vb.net`, `C#`, `Java`,
    and `JavaScript`. He has worked in different industries, which include financial,
    education, and fintech. He graduated in 2010 from Novena university, Ogume, Delta
    state, Nigeria, where he obtained a bachelor’s in information technology. Currently,
    he works as a senior software engineer for Technaura Systems GMBH. He enjoys playing
    football, swimming and hanging out with friends.


    # About the Reviewers


    **Daniel Chukwurah** is a Web and Mobile Developer at Afrinvest West Africa. At
    Afrinvest, he develops investment solutions that are changing how people interact
    with money to achieve financial freedom. He enjoys building scalable web and mobile
    applications with a good user experience, that meets business goals and transforms
    lives. Prior to Afrinvest, he worked at Sidmach Technologies Limited as a Software
    Engineer. Daniel is a self-taught developer and currently studying for his MBA
    at Nexford University. He also enjoys speaking at tech events.


    **Ravi Chaudhary** is a Technical Lead with working knowledge as a Fullstack Developer
    lead with rich experience in handling clients communication, along with that involved
    in various Architectural design decisions and building real-time complex web projects,
    API development using `Node JS` (`MEAN Stack`, `Meteor`), Databases like `Mongo
    DB`, `Mysql` along with `Redis`, `Socket.io`, `Kafka`, `LAMBDA` functions, Server
    Management(`AWS`, `Digital Ocean` along with techniques like `Auto Scaling`, `Load
    balancers`), and front-end frameworks like `ReactJS`.


    He has hands-on experience in Agile methodologies, and scrum implementation and
    has also worked closely with Product, and Business teams to scale up the platform
    and improve efficiency.


