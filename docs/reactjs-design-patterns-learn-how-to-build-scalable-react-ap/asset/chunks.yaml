  trans: "\n\n- **保持你的文件夹结构精确且易于理解**：文件和文件夹结构对于实现良好的组件结构也非常重要。为你的项目建立（以你喜欢的方式）文件夹结构，以便于理解哪些文件应该放在特定的文件夹中。\n\
    - **将可重用逻辑移动到单独的类或函数中**：通常在编程中，始终要记住 DRY（不要重复）原则。无论你觉得应用或组件将使用哪些可重用逻辑，将其移动到函数或方法中，并在应用程序中需要的地方调用它。\n\
    - **尝试编写测试**：在编写应用程序时，测试非常重要。很多开发者讨厌写测试，但它们有自己的优势，相信我，这些优势是巨大的。这可以让你对组件是否运行符合预期有一个某种保证，并且在编写良好的情况下可以减少应用程序中的\
    \ bug 数量。\n\n# 组件之间的数据共享\n\n在 react 中，我们必须在组件之间共享数据。根据状态变化的复杂程度或应用程序的大小，有不同的实现方法。让我们来看一些实现方式：\n\
    \n* Props\n* ContextApi\n* Redux\n* useReducer\n\n# Props\n\nProps 在 React 中至关重要的。Props\
    \ 是 React 中将数据从一个组件传递到另一个组件的方式之一。Props 是从父组件传递给子组件的对象的。Props 是 properties 的缩写。\n\
    \n我们将查看一种从父组件向子组件传递 `props` 的简单方法：\n\n```javascript\nimport react from 'React';\n\
    \nconst data={\n  id:1,\n  name:'Chidimma Jane Udensi',\n  state:'Imo State',\n\
    \  Village:'Akokwa',\n}\nconst App=()=>{\n  const secondComponent=(props)=>{\n\
    \    const {id,name,state,village}=props;\n    return (\n      <>\n        <p>{id}</p>\n\
    \        <p>{name}</p>\n        <p>{state}</p>\n        <p>{village}</p>\n   \
    \   </>\n    )\n  }\n  return (\n    <secondComponent props={data}/>\n  )\n}\n\
    export default App;\n```\n\n前面的示例展示了我们如何将 props 从 `App` 组件传递到第二个组件。第二个组件需要一个 prop，我们将对象\
    \ `data` 传递给它，并在第 14 行对其进行了解构赋值。\n\n# Context API\n\nContext API 也是一种从一个组件传递数据到另一个组件的方法。context\
    \ API 和 Props 之间的主要区别在于，context API 并不是每个组件都从父级传递。context API 有两个主要方法：\n\n* Provider\n\
    * Consumer\n\n# Provider\n\n这是 `contextApi` 的核心部分之一。Provider 接收一个要传递给子组件的值。\n\n\
    # Consumer\n\n这是 `contextApi` 的核心部分之一。Consumer 允许调用组件订阅 context 的变化。\n\n# Redux\n\
    \nRedux 是一个开源 JavaScript 库，它维护全局状态以使应用程序的行为一致。redux 库由以下三个部分组成：\n\n* Store\n*\
    \ Reducer\n* Actions\n\n# Store\n\nStore 是 Redux 开源 JavaScript 库的一部分。这是存储全局状态的地方。redux\
    \ 的这部分是不可变的，简单来说就是不可更改。\n\n**注意：redux toolkit 中的 Immer 允许你编写可变代码。**\n\n# Reducer\n\
    \nreducer 是 Redux 开源 JavaScript 库的一部分。reducer 是一个纯函数，它接收两个参数（初始状态和 action）并返回一个新状态。\n\
    \n# Actions\n\nActions 是 Redux 开源 JavaScript 库的一部分。action 是一个 JavaScript 对象，告诉\
    \ reducer 用户想在 store 中做什么。actions 是用户发出的指令，用于变动（使用 immer）store 中的状态或创建 store 中状态的副本。\n\
    \n# useReducer\n\n`useReducer` 方法也是一种组件之间共享数据的方式。当你有复杂状态时，使用 `useReducer` 方法。`useReducer`\
    \ 方法有一个初始状态和一个 action，并返回当前状态和一个 `dispatch` 方法。让我们来看类似的示例：\n\n```javascript\n\
    import { useReducer } from \"react\";\nconst initialTasks = [\n  {\n    id: 1,\n\
    \    title: \"Drink Coffee\",\n    completed: false,\n  },\n  {\n    id: 2,\n\
    \    title: \"Write Code\",\n    completed: false,\n  },\n];\nconst reducer =\
    \ (state, action) => {\n  switch (action.type) {\n    case \"COMPLETED\":\n  \
    \    return state.map((todo) => {\n        if (todo.id === action.id) {\n    \
