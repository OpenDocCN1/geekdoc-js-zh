    \    </Div>\n  );\n}\n```\n\nSo, we imported our styled component from library\
    \ on line 3. So, we declared three styled components, namely `Button`, `Div`,\
    \ and `TextBox`, and gave them some properties. We then applied the three styled\
    \ components inside component. Let us see how this looks on the browser. See figure\
    \ 5.5:\n\n![](images/Figure-5.5.jpg)\n\n**Figure 5.5:** Demonstration of styled\
    \ component\n\nThis is how our application would look inside our browser. Let\
    \ us look at another use case of styled components. Now, styled components can\
    \ accept props and can be used to change the style. Let us look at this in code\
    \ and in the browser.\n\n```javascript\nimport React,{useState} from 'react';\n\
