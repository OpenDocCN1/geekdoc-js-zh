  trans: "\n\n```javascript\n8.    data=event.target.value;\n9.   }\n10.  return <input\
    \ type='text' onChange={onChange}/>\n11. };\n12.\nexport default App;\n```\n\n\
    前面的示例显示我们有一个名为 `data` 的状态值，它可以接收字符串。它被初始化为空值。因此，我们创建了一个箭头函数，当输入值改变时调用它，并更新我们初始为空字符串的\
    \ `data` 值。\n\n这违反了 React 状态不可变性的规则。为了纠正这一点，我们必须调用 `setData` 并将输入的对应值作为参数传递。请参考以下对上述示例的修正：\n\
    \n```javascript\n1. import React,{useState} from \"react\";\n2.\n\n3.\n\n4.\n\n\
    5. const App = () => {\n6   const [data,setData]=useState('');\n7   const onChange=(event)=>{\n\
    8     setData(event.target.value)\n9   }\n10  return <input type='text' onChange={onChange}/>\n\
    11. };\n12.\n13. export default App;\n```\n\n或者\n\n```javascript\n1. import React,{useState}\
    \ from \"react\";\n5. const App = () => {\n6   const [data,setData]=useState('');\n\
    7   return <input type='text'onChange={(event)=> setData(event.target.value)}/>\n\
    8. };\n9. export default App;\n```\n\n前面的示例是相同的，区别在于一个是匿名函数，而另一个不是。它们都将给你相同的结果。我们调用了\
    \ `setData` 方法并将输入字符串作为参数传递进去，从而遵循了 React 的不可变性规则。\n\n现在，我们已经了解什么是 React 状态不可变性。让我们来看看我们该如何处理数组。\n\
    \n# 不要这样做\n\n```javascript\n1. import React,{useState} from \"react\";\n2.\n\n\
    3.\n\n4.\n5. const App = () => {\n6   const [data,setData]=useState([]);\n7  \
    \ const onChange=(event)=>{\n8     data.push(event.target.value);\n9   }\n10 \
    \ return <input type='text' onChange={onChange}/>\n11. };\n12.\n13. export default\
    \ App;\n```\n\n同样，这种方法可以运行，但它有很多问题，因为它直接修改了数组。这违反了 React 的状态不可变性。因此，为了解决这个问题，我们将使用展开运算符（spread\
    \ operator）创建数组的副本，并将新数据推入其中。请如下：\n\n```javascript\n1. import React,{useState}\
    \ from \"react\";\n2.\n\n3. const App = () => {\n4   const [data,setData]=useState([1,2,3]);\n\
    5   const onChange=(event)=>{\n6     setData([…data,Number(event.target.value)])\n\
    7     console.log(data)\n8   };\n9   return <input type='text' onChange={onChange}/>\n\
    10. };\n11.\n12. export default App;\n```\n\n我们的第 `7` 行将在控制台输出之前的值以及我们在输入框中输入的任何内容。尽管我们在添加之前已将其转换为了数字。\n\
    \n# 不要直接为 HTML 标签样式\n\n很多时候，我们倾向于通过给不同的标签设置相同的字体大小、颜色等来美化我们的应用程序。我们这样做是因为这让我们的生活变得简单，特别是当我们已经知道应用程序的样式时。这既有趣又容易，因为我们只需要做一次就可以忘记它。看下面的示例：\n\
    \n```css\np{\n  color:red\n}\ndiv{\n  background-color:green\n}\n```\n\n这很好，但它隐藏着巨大的危险。它会导致你应用程序中的样式覆盖。避免此问题的最佳方法是使用类（classes）或\
    \ ID 来设置样式。\n\n# 避免不必要地使用 divs\n\n在渲染应用程序时，我们倾向于使用 `div`。当我们编写组件时，脑子里第一个出现的 HTML\
    \ 标签就是在类组件的渲染中插入一个 `div`，或者在函数组件中返回它。虽然这种方法可行，但它没有为浏览器提供关于正在发生什么的足够信息。有一个概念叫做语义化\
    \ HTML（semantic HTML），它能为浏览器提供关于我们 React 应用部分的足够信息。这种语义化 HTML 的本质是为我们的 HTML 标签赋予意义。这些标签的示例包括\
    \ `header`、`section`、`nav`。\n\n```css\np{\n  color:red\n}\ndiv{\n  background-color:green\n\
    }\n```\n\n"
- fmt: "\nSASS and LESS are very good CSS Preprocessors. A CSS preprocessor is a program\
    \ that lets you generate CSS from the preprocessor's own unique syntax. SASS and\
    \ LESS are very good with react applications because of their very rich features,\
    \ such as Mixins and so on, for SASS.\n\n# File/folder structure\n\nMost of the\
    \ time, we are unsure of how to set up our folder and file structure to best serve\
    \ the application we are developing. Yes, react is opinionated, but one thing\
    \ we should keep in mind is that file/folder structure is important because it\
    \ gives a sense of direction on where to put/find some things for your application.\n\
    \nThis is up to you but always have in mind the other person who will take over\
    \ the code when doing this file structure.\n\n# Naming conventions\n\nThis is\
    \ very important because it gives meaning to the application. It makes the application\
    \ to be easily understood even before looking at the logic. When the naming of\
    \ variables, functions, methods, and file/folder are done properly, tracing problems\
    \ in the application is simple since one is aware of what each variable or function\
    \ is doing. I usually suggest keeping this in mind when naming your application.\n\
    \n# Rendering with useMemo and useCallBack\n\nThe `useMemo` and `useCallback`\
    \ are very effective performance hooks methods when using react hooks. The `useMemo`\
    \ is used to cache a computed calculation and returns its value. This calculation\
    \ is not done every time on render. It is a hook that takes in two parameters,\
    \ namely the fat arrow function and the dependency array. The dependency array\
    \ is optional, but if a parameter is passed, it is only when the parameter changes\
    \ that the function will run again, and the resulting value is returned. This\
    \ is the same with `useCallback`, but the main difference is that `useMemo` returns\
    \ the memorized value while `useCallback` returns the memorized function. Let\
    \ us look at the following example to help us understand the work of these two\
    \ hooks and why they are so important in building scalable and fast applications.\n\
    \nWe would start with the `useMemo`. Let us look at the following code:\n\n```javascript\n\
    import React,{useMemo} from \"react\";\nconst App = (props) => {\n  const value=useMemo(()=>{\n\
    \    return 123;\n  },[])\n  return (\n    <section>\n      {value}\n    </section>\n\
    \  );\n};\nexport default App;\n```\n\nLine number 5 will always return the value\
    \ `123` no matter how many times the component re-renders. This is because the\
    \ dependency array has not changed and so react does not need to recompute the\
    \ value again.\n\nLet us look at what `useCallBack` will do:\n\n```javascript\n\
    import React,{useCallback} from 'react';\nconst App=()=>{\n  const [count, setCount]\
    \ = useState(0)\n  const increaseCount=useCallback(()=>{\n    setCount(count+1)\n\
    \  },[])\n  return (\n    <button onClick={increaseCount}>Set Increase</button>\n\
    \  )\n}\nexport default App;\n```\n\n# Use Prettier\n\nPrettier is an open source\
    \ that enforces code consistency. It makes your code look neat and readable. It\
    \ enforces the rules that have been set by you.\n\n# Use Linter and its rules\n\
    \nLinter helps you organize your code, especially your import hierarchy. Linter\
    \ reminds you of some JavaScript errors. Having Linter and its rules in your application\
    \ can make your life easy.\n\n# Use try…catch\n\nNo matter how perfect our application\
    \ is, there are bound to be errors. Errors can be from an API or even from a user\
    \ input, which we did not see coming or even thought of during testing. This is\
    \ why it is important to always wrap your logic or API calls with try and catch\
    \ so that it can catch unexpected errors.\n\n# Log errors\n\nIn as much as we\
    \ catch errors, we also need to log them. Logging these errors can tell us what\
    \ exactly happened during the lifecycle of an operation within the application.\
    \ We can log this error to a file or create a service where these errors are pushed\
    \ to an API or even to a database. This is essential and is typically one of the\
    \ first points of call when things go wrong in an application on production. It\
    \ can save the day.\n\n# React error boundary\n\nThere are times in our application\
    \ when we have some error in the UI, and the page will just show a white screen;\
    \ this can be solved by using React error boundary. React error boundary helps\
    \ to catch application errors and show a friendly message or screen to the user.\
    \ The friendly error message or screen is usually a fallback component. Let us\
    \ refer to the following example:\n\n```javascript\nclass ErrorBoundary extends\
    \ React.Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = { hasError: false };\n  }\n  static getDerivedStateFromError(error) {\n  \
    \  return { hasError: true };\n  }\n  componentDidCatch(error, errorInfo) {\n\
    \    errorService.log({ error, errorInfo });\n  }\n  render() {\n    if (this.state.hasError)\
    \ {\n      return <p>Oops, something went wrong.</p>;\n    }\n    return this.props.children;\n\
    \  }\n}\n```\n\nThis will return to 17 if 16 is true. To catch asynchronous errors,\
    \ we should add `try` and `catch` block.\n\n# Test your code\n\nMost developers\
    \ do not like writing tests for their applications (me included), but as time\
    \ went by, I started indulging in unit tests and integration tests. This is very\
    \ important as the application grows, it will become very important to implement\
    \ so as avoid issues. Tests solidify the code and give you assurance that your\
    \ function and logic are working.\n\n# Component name must be in Pascal case\n\
    \nReact component naming convention is usually in Pascal case. This starts with\
    \ a capital letter, and failing to do so will result in the component not rendering.\
    \ As you can see from all our examples so far, we named our component `App`. Notice\
    \ that the naming convention started with a capital letter.\n\nDo not do this\n\
    \n```javascript\nimport React from 'react';\nconst app=(){\n  return (\n    <p>This\
    \ is just a test</p>\n  )\n}\nexport default app;\n```\n\nRather do this\n\n```javascript\n\
    import React from 'react';\nconst App=(){\n  return (\n    <p>This is just a test</p>\n\
    \  )\n}\nexport default App;\n```\n\n# Extract reusable logic\n\nThis is very\
    \ important in react applications because it solves unnecessary repetition. The\
    \ logic that will be used across the application can be extracted to a component\
    \ and used at any given point in time. This is another form of **do not repeat\
    \ yourself** (**DRY**) technique. This will save you from many lines of code and\
    \ also make you isolate bugs because this is only one source of truth, which is\
    \ your reusable component/logic.\n\n# Benefits of using JavaScript in React application\n\
    \nReact is a library that uses JavaScript. We are going to look at the advantages/benefits\
    \ of using JavaScript in our react application.\n"
