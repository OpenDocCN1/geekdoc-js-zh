    # Acknowledgement


    There are a few people I want to thank for the continued and ongoing support they
    have given me during the writing of this book. First and foremost, I would like
    to thank my parents for continuously encouraging me to write the book — I could
    have never completed this book without their support.


    I am also grateful to Daniel Chukwurah, Augustina Nwahiri, Chidimma Udensi, Augusta
    Madubuko, Sandra Odiete, and others too numerous to mention who gave me tremendous
    support throughout the writing of this book.


    My gratitude also goes to the team at BPB Publications for being supportive enough
    to provide me with quite a long time to finish writing the chapters of this book.


    # Preface


    This book covers many different aspects of building applications with `React.js`,
    the importance of building scalable applications with `React.js`, and its best
    practices. This book has a deep dive into some of the bad practices we commonly
    do when writing our applications and shows us better ways how to architect our
    applications.


    This book takes a practical approach for `React.js` learners. It covers a few
    Real-time industry examples as well. It will cover information such as `JavaScript`,
    which `Typescript` is basically used for building `React` applications. It also
    covers state management, lifecycle methods, styling, and practical ways to structure
    your files to make them more readable and accessible.


    This book is divided into **9 chapters**. They will cover basics and advanced
    `React.js`.


    **[Chapter 1](#c01.xhtml)** This chapter will cover different patterns in writing
    `React` applications. Yes, `React` is opinionated, although it gives you the liberty
    to build and structure your applications according to your taste or that which
    fits your organization. However, there are some very bad practices that are not
    good and can have an effect on your application as your application begins to
    grow.


    This chapter will identify common bad practices out there and suggest better practices
    to help build scalable `React` applications. We will be using `JavaScript` and
    `TypeScript` for this chapter. This seems to be redundant since `TypeScript` was
    not used in any example, and `React` is built on `JavaScript`.


    **[Chapter 2](#c02.xhtml)** This chapter will cover how to write components. `React`
    is a component-based library whereby different reusable components are used to
    build an application. Basically, this chapter will outline the different ways
    of writing components which include functional and class-based components.


    Although we will focus more on functional components because it is the most recent
    in the `React` Docs, there are still applications built with class components.
    We will be using `JavaScript` and `TypeScript` for our examples in this chapter.


    **[Chapter 3](#c03.xhtml)** In this chapter, we will learn the to write clean
    and maintainable code. We would also look at the patterns used to achieve clean
    and maintainable code. We would conclude by learning how to use `TypeScript` to
    build `react` applications.


    **[Chapter 4](#c04.xhtml)** This chapter will cover what `React hooks hooks are,
    and we will look at the most common hooks used in `React`. We would also look
    at how to write custom hooks and their benefits when building applications. We
    would see how hooks and custom hooks can be combined in a single application.


    **[Chapter 5](#c05.xhtml)** This chapter will cover how to style `React` components.
    This will include pre-processors like `Scss` and `Less`. We will also cover `styled-components`
    and inline styles. Also, we would cover modular CSS.


    **[Chapter 6](#c06.xhtml)** This chapter will look at what server-side rendering
    is, when to use it, and its pros and cons. We would also look at a popular server-side
    framework (`Next.js`) and how it differs from the client-side `react` library.


    **[Chapter 7](#c07.xhtml)** we will look at how to fetch data in our `React` application.
    We would also look at the different types of libraries/APIs we can use to fetch
    data remotely into our application. We would also look at the difference between
    `REST API` and `GraphQL` and how to cache the fetched data and use it in our application.
    We would also look at `promises`, their benefits, and what it solves in our react
    application.

