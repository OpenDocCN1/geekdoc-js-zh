    # [CHAPTER 4](#toc.xhtml_c04)


    # [React Hooks](#toc.xhtml_c04)


    # [Introduction](#toc.xhtml_s72a)


    This chapter will cover what React hooks are, and we will look at the most common
    hooks used in React. We will also look at how to write custom hooks and their
    benefits when building applications. We will see how hooks and custom hooks can
    be combined in a single application.


    # [Structure](#toc.xhtml_s73a)


    The following topics are to be covered:


    *   React hooks


    *   Custom hooks


    # [Objectives](#toc.xhtml_s74a)


    In this chapter, we will learn how to write custom hooks and use inbuilt hooks
    in React. We would look at an example project to learn more about hooks.


    # [React hooks](#toc.xhtml_s75a)


    React hooks are lifecycle methods used in functional components. React hooks were
    introduced in React 16.8\. The lifecycle methods, which were in-class components,
    were collapsed into React hooks. React hooks will NOT work inside the class component.
    Some of these inbuilt React hooks include the following:


    *   useState


    *   useReducer


    *   useEffect


    *   useLayoutEffect


    *   useMemo


    *   useCallback


    *   useRef


    *   useContext


    There are some rules to follow when using React hooks. We will look at a few of
    them:


    *   Hooks can only be called from a functional component.


    *   Hooks must be called from the top level, not from within loops, conditional
    statements, and so on.


    *   You can create your own hooks, but you must follow the rules one and two.


    # [useState](#toc.xhtml_s76a)


    The **`useState`** method is one of the commonly used React hooks. This hook is
    classified under the controlled component in React. The **`useState`** method
    sets an initial value, which is updated as the user performs an operation. Let
    us use an example to explain this:


    1.  `import React,{useState} from ''react''`


    4.  `const MyApp=()=>{`


    5.  `  const [counter,setCounter]=useState(0);`


    7.  `  return (`


    8.  `    <>`


    9.  `      <p>Current count is {counter}</p>`


    10.  `      <button onClick={()=>setCounter(counter+1)}> increase counter </button>`


    11.  `      <button onClick={()=>setCounter(counter-1)}> decrease counter</button>`


    12.  `    </>`


    13.  `  )`


    15.  `};`


    18.  `export default MyApp;`


    The preceding example is a simple counter application. The application has two
    buttons that increase and decrease the counter value. We imported the **`useState`**
    hook on line one from React library. We then declared the counter state and set
    its initial value to 0 on line 5\. So on the click of either of the buttons, we
    call the **`setCounter`** and pass the current counter to it so we can increase
    or decrease the current counter value by **`1`**. The value of the counter will
    be displayed on line 9.


    # [useReducer](#toc.xhtml_s77a)


    The **`useReducer`** method is one of the commonly used React hooks. This hook
    is used when you have a complex changing state in your application. This is like
    **`useState`**, but you dispatch actions to update the state. Let us use an example
    to explain this:


    1.  `import React,{useReducer,} from ''react''`


    4.  `const MyApp=()=>{`


    5.  `  const initialState={counter:0}`


    6.  `  const appReducer=(state, action)=>{`


    7.  `    switch(action.type){`


    8.  `      case ''increase'':`


    9.  `        return {counter:state.counter ++};`


    10.  `      case ''decrease'':`


    11.  `        return {counter:state.counter --};`


    12.  `      default:`


    13.  `        return {counter:state.counter};`


    14.  `    }`


    15.  `  }`


    16.  `  const [state, dispatch] = useReducer(appReducer, initialState);`


    17.  `  return (`


    18.  `    <>`


    19.  `      <p>Current count is {state.counter}</p>`


    20.  `      <button onClick={()=>dispatch({type: ''increase''})}>increase counter
    </button>`


    21.  `      <button onClick={()=>dispatch({type:''decrease'' })}>decrease counter</button>`


    22.  `    </>`


    23.  `  )`


    24.  `};`


    27.  `export default MyApp;`


    The preceding example is also a simple counter application. The application has
    two buttons that increase and decrease the **`counter`** value. We dispatch actions
    to the reducer to update the **`counter`** state. The reducer takes in two parameters
    (**`state`** and **`action`**). There is usually an initial state which, in this
    case, is a **`counter`** object that has its value set to 0\. The preceding code
    will look like this in the browser:


    ![](images/Figure-4.1.jpg)


    **Figure 4.1:** Counter app


    Clicking on the increased counter will increase the **`counter`** value by **`+1`**.


    ![](images/Figure-4.2.jpg)


    **Figure 4.2:** Counter app


    Also, clicking on the decrease counter will reduce the **`counter`** value to
    **`-1`**.


    # [useEffect](#toc.xhtml_s78a)


    The **`useEffect`** method is one of the commonly used React hooks. This hook
    is used for asynchronous operations that have two arguments (fat arrow function
    and an optional dependency array). This dependency array is a must because, without
    it, the component will have an infinite re-render. The dependency array can take
    as many values as possible, which means that for any values that change inside
    the dependency array, the **`useEffect`** method will run again. We also have
    another fat arrow function that is used to clean up (**`componentWillUnmount`**).
    The **`useEffect`** method hook is usually used when we make API calls before
    our component mounts. Let us look at an example of the **`useEffect`** method
    hook:


    1.  `import React,{useEffect,useState} from ''react''`


    4.  `const MyApp=()=>{`


    5.  `  const [data,setData]=useState([]);`


    6.  `  useEffect(()=>{`


    7.  `    const fetchData=async()=>{`


    8.  `      return fetch(''https://jsonplaceholder.typicode.com/todos'')`


    9.  `      .then(response => response.json())`


    10.  `      .then(json => setData(json))`


    11.  `    } ;`


    12.  `    fetchData();`


    13.  `  },[])`


    14.  `  return (`


    15.  `    <ul>{`


    16.  `      data.length >0 && data.map(item=>{`


    17.  `        return <li key={item.id}>{item.title}</li>`


    18.  `      })`


    19.  `    }</ul>`


    20.  `  )`


    21.  `}`


    25.  `export default MyApp;`


    In the preceding example, we used the **`useState`** hook and the **`useEffect`**
    hook. We made a call to the **[https://jsonplaceholder.typicode.com/todos](https://jsonplaceholder.typicode.com/todos)**
    API and stored the array data in the **`useState`** method hook. We then looped
    through the array data and displayed it inside the functional component on line
    16. Let us see how this will appear on the browser:


    ![](images/Figure-4.3.jpg)


    **Figure 4.3:** useEffect rendered list shows our useEffect displayed list


    # [useLayoutEffect](#toc.xhtml_s79a)


    The **`useLayoutEffect`** method is one of the commonly used React hooks. This
    hook is used for synchronous operations that have two arguments (fat arrow function
    and an optional dependency array). This dependency array is a must because, without
    it, the component will have an infinite re-render. The dependency array can take
    as many values as possible, which means that for any values that change inside
    the dependency array, the **`useEffect`** method will run again. We also have
    another fat arrow function that is used to clean up (**`componentWillUnmount`**).
    The **`useEffect`** method hook is usually used when we make API calls before
    our component mounts. The hook usually runs after the component has been mounted.
