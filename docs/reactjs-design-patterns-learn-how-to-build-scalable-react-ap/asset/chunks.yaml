    # [Best way to structure a react component](#toc.xhtml_s45a)


    React component is the way to build a small to robust application. These React
    components need to be structured in a good way so that they can be testable, scalable,
    and easy to identify bugs. Though react is opinionated, there are better ways
    to achieve a good react component structure.


