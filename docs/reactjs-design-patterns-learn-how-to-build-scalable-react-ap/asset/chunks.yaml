  trans: "\n模拟（Mocking）在我们的 React 应用中非常重要。我们使用模拟来 `spy(view)` 我们的函数是如何被调用的，或者使用它来测试单个函数或整个模块。Jest\
    \ 中有以下三种类型的模拟函数： \n\n- `Jest.fn`（用于模拟单个函数）\n- `Jest.mock`（用于模拟整个模块）\n- `Jest.spyOn`（用于查看函数是如何被调用的）\n\
    \n欲更多信息，请访问 [`jestjs.io/docs/mock-functions`](https://jestjs.io/docs/mock-functions)。\n\
    \n# 结论\n\n在本章中，我们学习了如何测试组件以及各种测试类型。我们还查看了如何使用 Jest 测试函数并与 API 集成。我们还查看了使用 React\
    \ testing library 进行 UI 测试。我们查看了 Cypress，它可以帮助我们进行端到端测试。\n\nReact 由 facebook 团队不断更新，由于这些变化，建议始终检查\
    \ [`reactjs.org/docs/getting-started.html`](https://reactjs.org/docs/getting-started.html)\
    \ 或 [`beta.reactjs.org/`](https://beta.reactjs.org/) 以查看最新更新。\n\n# 索引\n\n### A\n\
