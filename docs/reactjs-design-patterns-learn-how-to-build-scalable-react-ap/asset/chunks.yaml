  trans: "\n\n# 结构\n\n将涵盖以下主题：\n\n* 编写整洁的代码\n* 实现整洁且可维护的代码\n* 编写可维护的代码\n* 使用 TypeScript\
    \ 构建应用程序\n\n# 目标\n\n在本章中，我们将学习编写整洁且可维护的代码。我们还将介绍用于实现整洁且可维护代码的模式。最后，我们将学习如何使用 TypeScript\
    \ 构建 React 应用程序。\n\n# 编写整洁的代码\n\n整洁的代码对于编程来说是非常必要的。需要整洁代码是因为以下原因：\n\n* 业务连续性\n\
    * 易于阅读和理解\n\n## 业务连续性\n\n业务连续性对于每个组织都至关重要。它之所以至重要，是因为当开发者离开公司或业务时，必须保持连续性，软件必须继续运行以造组织之。开发者必须编写易于维护的代码，以便无论是否有该开发者，业务都能继续运行。\n\
    \n## 易于阅读和理解\n\n代码应该是易于阅读和理解的。每个编写代码的开发者都应该考虑谁来阅读、调试、添加功能和支持该应用程序。在你离开公司后，不应该有开发者联系你询问你写了什么或理解你所做操作的逻辑。\n\
    \n# 实现整洁且可维护的代码\n\n既然我们已经检查了我们需要编写整洁代码的原因，现在应该考虑如何做到。让我们来看一些实现这种整洁代码的方法并进行简要讨论：\n\
    \n* **保持简单 (Keep it simple stupid)**：保持简单是实现整洁编码的一种方法。KISS 只是告诉你，作为开发者要保持代码简单。它只是提醒你不要应对事物进行过度工程。不要以标准的名义把事情复杂化，从而变得过于复杂。\n\
    \n* **不要重复 (Do not repeat yourself)**：这是实现整洁代码的方法之一。通常情况下，自我重复不是好的做法。想象在应用程序的多个地方重复相同的代码逻辑；这将产生多处冗余代码。与其重复，不如将可重用的逻辑/代码移动到函数或方法中，并在任何需要的地方或时候调用它。\n\
    \n* **尝试在代码中解释你自己**：无论你编写什么代码——无论是方法、函数还是变量声明，你都应该以向下一个要阅读、调试和支持它的人解释的方式来编写。这非常重要，因为你的代码应该是易于阅读和理解的，不需要大量的调试。\n\
    \n* **避免函数中过多的参数**：大多数函数/方法需要一个或多个参数。这些参数最多保留三个。如果超过 3 个，请让方法接收一个对象，然后在方法中使用该对象进行解构供使用。这使得代码变得整洁且易于阅读，因为对象是可以扩展的（更多参数可以放入其中）。\n\
    \n让我们来看一个相关的例子：\n\n```javascript\nfunction concatUser(firstname,middlename, lastname,country,mobile){\n\
    \  return firstname+'.'+middlename+'.'+lastname+'.'+country+'.'+mobile;\n}\n```\n\
    \n### 不要这样做！！！\n\n上面的代码是一个拼接用户详情的简单函数。你可以看到第 3 行接收的参数大约有五个，并在第 5 行返回拼接后的字符串。这不是良好的做法，因为参数超过了\
    \ 3 个。让我们看看以下 TypeScript 中的相同代码：\n\n```typescript\nfunction concatUser(firstname:string,\
    \ middlename:string,lastname:string,country:string,mobile:string):string{\n  return\
    \ firstname+'.'+middlename+'.'+lastname+'.'+country+'.'+mobile;\n}\n```\n\n这与第一个示例相同。唯一的区别是参数是强类型的，并且\
    \ `concatUser` 函数必须返回字符串，因为我们定义了它应该返回字符串。\n\n为了让 `concatUser` 函数看起来更整洁，我们应该让参数成为对象，然后解构对象并提取我们的参数。让我们来看下面的示例来实现这一目标：\n\
    \n```typescript\nconst obj={\n  firstname:'Anthony',\n  middlename:'Onyekachukwu',\n\
    \  lastname:'Okonta',\n  country:'Nigeria',\n  mobile:'+2348039436123'\n}\n\n\
    const user=concatUser(obj);\nconsole.log(user)\n\nfunction concatUser(userObj){\n\
    \  const {firstname,middlename,lastname,country,mobile}=userObj;\n  return firstname+','+middlename+','+lastname+','+country+','+mobile;\n\
    }\n```\n\n前面的示例展示了我们如何避免 `concatUser` 函数中的多个参数。第 20 行之前的代码将打印 `Anthony`、`Onyekachukwu`、`Okonta`、`Nigeria`、`+2348039436123`（等等，提供的示例在源代码的行号上存在逻辑不匹配，但我将保持提供的内容）。\n\
    \n```typescript\ninterface IUser{\n  firstname:string;\n  middlename:string;\n\
    \  lastname:string;\n  country:string;\n  mobile:string\n}\n\nconst obj:IUser={\n\
    \  firstname:'Anthony',\n  middlename:'Onyekachukwu',\n  lastname:'Okonta',\n\
    \  country:'Nigeria',\n  mobile:'+2348039436123'\n}\n\nconst user=concatUser(obj);\n\
    console.log(user)\n\nfunction concatUser(userObj){\n  const {firstname,middlename,lastname,country,mobile}=userObj;\n\
    \  return firstname+','+middlename+','+lastname+','+country+','+mobile;\n}\n```\n\
    \n上面的示例展示了我们如何避免 `concatUser` 函数中的多个参数。第 20 行之前的代码将打印 `Anthony`、`Onyekachukwu`、`Okonta`、`Nigeria`、`+2348039436123`（注意：原文的行号和内容略有不一致，但逻辑已保留）。这看起来更整洁、更简单。让我们看看\
    \ TypeScript 中的相同代码：\n\n（上面的代码块代表了提供文本逻辑的结构化版本）。\n\n"
- fmt: "\nThe preceding example makes a whole lot of sense because we can see what\
    \ the developer is trying to do here. He is simply declaring descriptive values\
    \ `firstName` and `lastName` and assigning the values `Anthony` and `Okonta` to\
    \ them, respectively.\n\n*   **All functions must do one thing**: We all write\
    \ functions in our applications to help us out. These functions can do a variety\
    \ of things depending on our goals, but keep in mind that each function should\
    \ only do one thing. Assume you want a function that converts all words to capital\
    \ letters and then sends the result to an API endpoint. Most of the time, we return\
    \ the capitalized result and pass the parameters to the end point within the same\
    \ function. Let us take a look at the following example to see what we are talking\
    \ about.\n\n```javascript\ncapitalizeWords('anthony')\n\nfunction capitalizeWords(word){\n\
    \  const convertedWord=word.toUpperCase();\n  sendConvertedWord(convertedWord)\n\
    }\n\nasync function sendConvertedWord(convertedWord){\n  return await fetch('api.com',{\n\
    \    method:'POST',\n    headers:{\n      accept:'application/json'\n    },\n\
    \    body:(JSON.stringify({\n      word:convertedWord\n    }))\n  })\n}\n```\n\
    \nThe preceding code shows two functions (`capitalizeWords` and `sendConvertedWord`),\
    \ which does two different things. The preceding `capitalizeWords` accepts an\
    \ argument called `word` and capitalizes the word and then calls the `sendConvertedWord`\
    \ API and passes the parameter to it on line 6. This will work but will have issues\
    \ because the function is not doing just one thing, which is to convert the passed\
    \ in word to capital letters. Let us look at the following correct one.\n\n```javascript\n\
    const capitalizedWord=capitalizeWords('anthony');\nif(capitalizedWord)\n{\n  sendConvertedWord(capitalizedWord)\n\
    }\n\nfunction capitalizeWords(word){\n  if(typeof word ==='string'){\n    return\
    \ word.toUpperCase();\n  }\n  else{\n    return null;\n  }\n}\n\nasync function\
    \ saveWord(convertedWord){\n  return await fetch('api.com',{\n    method:'POST',\n\
    \    headers:{\n      accept:'application/json'\n    },\n    body:(JSON.stringify({\n\
    \      word:convertedWord\n    }))\n  })\n}\n```\n\nYou can see from the preceding\
    \ code that we successfully made the `capitalizeWords` function do just one thing,\
    \ which is capitalize words and return them to the caller on line 1. We then send\
    \ the returned params to the `sendConvertedWord` function in line 7.\n\nPlease\
    \ note that this is a dummy API used in this example.\n\n*   **Keep functions\
    \ short and precise**: Keeping functions short and precise is one way to achieve\
    \ clean code. When your functions become so large, it becomes difficult to read.\
    \ Try to keep them very short, at most 50–60 lines.\n\n*   **Give descriptive\
    \ branch names when branching from master**: The majority of our code will be\
    \ pushed to an online repository (GitHub, Bitbucket, and so on) because it will\
    \ undoubtedly be the source of truth, allowing us to have **Continuous Integration**\
    \ (`CI`) and **Continuous Delivery** (`CD`). We would create a branch from the\
    \ master to develop a new feature or fix a bug. Assume we are asked to fix an\
    \ infinite loop bug in production. We should execute the following command:\n\n\
    ```bash\ngit checkout -b fix/infinite_loop_fixes.\n```\n\nThe preceding command\
    \ will create a branch called `fix/infinite_loop_fixes`. This will give the PR\
    \ reviewer an idea of what is going on. Or you can name it like this:\n\n```bash\n\
    git checkout -b fix/ticket_number_infinite_loop_fixes.\n```\n\nThe `ticket_number`\
    \ is the number that is.\n\n*   **Give descriptive branch names when branching\
    \ from master**: The majority of our code will be pushed to an online repository\
    \ (GitHub, Bitbucket, and so on) because it will undoubtedly be the source of\
