    \ && data.map(item=>{\n        return <li key={item.id}>{item.title}</li>\n  \
    \    })}\n    </ul>\n  )\n}\n\nexport default MyApp;\n```\n\n在前面的示例中，我们使用了 `useState`\
    \ hook 子和 `useEffect` hook 子。我们调用了 `https://jsonplaceholder.typicode.com/todos`\
    \ API，并将数组数据存储在 `useState` hook 子中。然后，我们遍历了数组数据并在第 16 行的函数组件内部显示了它们。\n\n# useMemo\n\
    \n`useMemo` 方法是常用的 React hook 子 之一。`useMemo` 方法用于 React 中的记忆化。`useMemo` 方法会对计算进行记忆化并返回其值。这个\
    \ hook 子对性能非常好，因为当依赖数组中的值没有变化时，它会缓存计算值并返回它。如果值发生了变化，则会重新运行 `useMemo` 并返回新计算的值。让我们通过一个示例来看\
    \ `useMemo` 的实际效果：\n\n```javascript\nimport React,{useMemo} from 'react'\n\nconst\
    \ MyApp=()=>{\n  const result=useMemo(()=>{\n    return 1+1;\n  },[])\n  return\
    \ (\n    <p>{result}</p>\n  )\n}\n\nexport default MyApp;\n```\n\n# useCallback\n\
    \n`useCallback` 方法是常用的 React hook 子 之一。`useCallback` 方法用于 React 中的记忆化。`useCallback`\
    \ 方法会对计算进行记忆化并返回其函数。这个 hook 子对性能非常好，因为当依赖数组中的值没有变化时，它会缓存计算值并返回它。如果值发生了变化，则会重新运行\
    \ `useCallback` 并返回新计算的函数。让我们通过一个示例来看 `useCallback` 的实际效果：\n\n```javascript\n\
    import { useState, useCallback } from \"react\";\n\nconst App = () => {\n  const\
    \ [count,setCount]=useState(0);\n  const handleCount = useCallback(() => {\n \
    \   setCount((currentValue) => currentValue + 1);\n  }, []);\n  return (\n   \
    \ <>\n      <hr />\n      <div>\n        Count: {count}\n        <button onClick={handleCount}>+</button>\n\
    \      </div>\n    </>\n  );\n};\n\nexport default App;\n```\n\n# useRef\n\n`useRef`\
    \ 方法是常用的 React hook 子 之一。`useRef` 方法主要用于以下两个重要原因：\n\n- 指向 DOM 中的一个元素。\n- 用于即使在重新渲染后也存储元素的值。\n\
    \n让我们通过一个示例来看 `useRef` 方法的作用：\n\n```javascript\nimport { useRef } from \"react\"\
    ;\n\nconst App = () => {\n  const inputRef=useRef();\n  const handleChange=()=>{\n\
    \    inputRef.current.style.backgroundColor='green';\n  }\n  return (\n    <>\n\
    \      <hr />\n      <div>\n        <input type=\"text\" ref={inputRef} onChange={handleChange}/>\n\
    \      </div>\n    </>\n  );\n};\n\nexport default App;\n```\n\n前面的示例展示了使用 `useRef`\
    \ hook 子的一种方法。在这里，我们指向一个输入元素。当触发 `onChange` 事件时，我们调用在第 6 行声明的 `handleChange` 函数，并将指向的元素背景设置为绿色。让我们看看它在浏览器中的效果：\n\
    \n![](img/Figure-4-(a))\n图 4a: 显示我们输入值之前的示例：\n\n![](img/Figure-4-(b))\n图 4b: 显示我们在框内输入值后的示例。我们将通过另一个示例进一步查看另一种场景，即如何使用\
    \ `useRef` 在重新渲染之间持久化值：\n\n```javascript\nimport { useRef } from \"react\";\n\n\
    const App = () => {\n  const inputRef=useRef();\n  const handleChange=()=>{\n\
    \    console.log(inputRef.current.value);\n  }\n  return (\n    <>\n      <hr\
    \ />\n      <div>\n        <input type=\"text\" ref={inputRef} onChange={handleChange}/>\n\
    \      </div>\n    </>\n  );\n};\n\nexport default App;\n```\n\n前面的示例将在第 7 行向控制台打印如下内容：\n\
    \n![](img/Figure-4.5)\n图 4.5: 显示我们的示例。你可以从前面的代码中看到 `inputRef` 的值如何在重新渲染之间持久化。\n\
    \n# useContext\n\n`useContext` 方法是常用的 React hook 子 之一。`useContext` 方法用于将值从父组件传递到位于组件树中远处的子组件。这个\
    \ `useContext` hook 子解决了 `props` 逐层传递（props drilling）的问题，即无论组件是否需要该值，都必须将值从一个组件传递到另一个组件。让我们通过一个示例来看这个问题。\n\
    \n```javascript\nimport { useState,useRef,useContext,createContext } from \"react\"\
    ;\n\nconst appBackgroundContext = createContext();\n\nconst ComponentTwo = ( =>\
    \ {\n  const  color = useContext(appBackgroundContext);\n  return <div style={{backgroundColor:color}}>\n\
    \    hello\n  </div>\n}\n\nconst ComponentThree = ( => {\n  const  color = useContext(appBackgroundContext);\n\
    \  return <div style={{backgroundColor:color}}>\n    hello\n  </div>\n}\n\nconst\
    \ ComponentFour = ( => {\n  const  color = useContext(appBackgroundContext);\n\
    \  return <div style={{backgroundColor:color}}>\n    hello\n  </div>\n}\n\nconst\
    \ ComponentFive = ( => {\n  const  color = useContext(appBackgroundContext);\n\
    \  return <div style={{backgroundColor:color}}>\n    hello\n  </div>\n}\n\nconst\
    \ App = () => {\n  const [defaultColor, setDefaultColor] = useState(\"red\");\n\
    \  return (\n    <>\n      <appBackgroundContext.Provider value={defaultColor}>\n\
    \        <ComponentTwo />\n        <ComponentThree />\n        <ComponentFour\
    \ />\n        <ComponentFive />\n      </appBackgroundContext.Provider>\n    </>\n\
    \  );\n};\n\nexport default App;\n```\n\n在前面的示例中，我们在向 `ComponentTwo`、`ComponentThree`、`ComponentFour`\
    \ 和 `ComponentFive` 传递参数时遇到了问题。我们将参数作为 props 传递给所有这些组件，但这实际上并不是需要的，因为这会导致 props\
    \ 逐层传递。为了解决这个问题，我们将使用 `useContext` hook 子来解决以下问题：\n\n"
- fmt: "\n```javascript\nconst ComponentFour=()=>\n  const context=useContext(appBackgroundContext)\n\
    \  return <div style={{backgroundColor:context}}>\n    hello\n  </div>\n  }\n\
    const ComponentFive=()=>\n  const context=useContext(appBackgroundContext);\n\
    \  return <div style={{color:context}}>\n    hello {context}\n  </div>\n  }\n\
    \  return (\n    <>\n      {\n        <appBackgroundContext.Provider value={defaultColor}>\n\
    \          <ComponentTwo/>\n          <ComponentThree/>\n          <ComponentFour/>\n\
    \          <ComponentFive/>\n        </appBackgroundContext.Provider>\n      }\n\
    \    </>\n  );\n};\n\nexport default App;\n```\n\n# Custom hooks\n\nCustom hooks\
    \ are basically writing your own hooks. These hooks are functions that start with\
    \ the word use. These custom hooks follow the same principle of reacting hooks\
    \ that we mentioned earlier. Let us look at an example of the same:\n\n```javascript\n\
    import {useEffect,useState} from 'react';\nconst useApi=(endpoint)=>{\n  const\
    \ [data,setData]=useState([]);\n  useEffect(()=>{\n    const ApiCall=async()=>{\n\
    \      return fetch(endpoint).then(response=> response.json()).then(result=>{\n\
    \        setData(result)\n      })\n    };\n    ApiCall();\n  },[endpoint]);\n\
    \  return {data}\n}\nexport default useApi\n```\n\nThe preceding code is a custom\
    \ hook that takes in an `endpoint` as a generic API, runs the `useEffect` asynchronous\
    \ hook, and returns the data to the calling component:\n\n```javascript\nimport\
    \ useApi from './hooks'\nconst App = () => {\n  const {data}=useApi('https://jsonplaceholder.typicode.com/todos');\n\
    \  return (\n    <ul>\n      {\n        data && data.map(item=>{\n          return\
    \ <>\n            <li>{item.id} {item.title} </li>\n          </>\n        })\n\
    \      }\n    </ul>\n  )\n};\nexport default App;\n```\n\nThe preceding code calls\
    \ the `useApi` custom hook defined in the previous code and passes the data down\
    \ to the functional component. Kindly view the result of the functional component\
    \ when returned.\n\n![](images/Figure-4.6.jpg)\n\n**Figure 4.6:** Showing our\
    \ custom useEffect hook to display our list\n\nCustom components exist in so many\
    \ ways. You can decide to use it for extraction of logic, and it can make you\
    \ not repeat yourself in a functional component but remember the rules before\
    \ using them.\n\n# Conclusion\n\nIn this chapter, we looked into what React hooks\
    \ are, their advantages, and their rules. We also looked at how to write custom\
    \ hooks which are very helpful in extracting logic. In the upcoming chapter, we\
    \ will look at styling and how to properly style a react.\n\n# CHAPTER 5 Styling\n\
    \n# Introduction\n\nThis chapter will cover how to style React components. This\
    \ will include preprocessors like Scss and Less. We will also cover styled-components\
    \ and inline styles.\n\n# Structure\n\nThe following topics are to be covered:\n\
    * Styling a component\n* Types of styling (inline styling, preprocessors (Sass\
    \ and Less), CSS, and styled-components\n* Pros and cons of different styling\n\
    * Conventions for writing styles\n\n# Objectives\n\nIn this chapter, we will look\
    \ at how to style a component and the different types of styling. We will also\
    \ look at the pros and cons of different types of styling. We will conclude by\
    \ looking at some conventions for writing styles.\n\n# Styling a component\n\n\
    Styling is very important in every Web application because styling makes it attractive\
    \ to the user and gives the user a good experience. There are different ways to\
    \ achieve this in React. We are going to look at some common ways of styling the\
    \ React component to give a great view to the user.\n\n# Types of styling\n\n\
    So, in React and generally in website or Web applications, there are different\
    \ types of styling the application. We will look at some of them:\n* Inline CSS\n\
    * External/referential CSS\n* Sass\n* Bootstrap\n* Styled components\n\n# Inline\
