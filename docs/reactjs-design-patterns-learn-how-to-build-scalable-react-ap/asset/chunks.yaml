    \  return <div style={{backgroundColor:context}}>\n    hello\n  </div>\n  }\n\
    const ComponentFive=()=>\n  const context=useContext(appBackgroundContext);\n\
    \  return <div style={{color:context}}>\n    hello {context}\n  </div>\n  }\n\
    \  return (\n    <>\n      {\n        <appBackgroundContext.Provider value={defaultColor}>\n\
    \          <ComponentTwo/>\n          <ComponentThree/>\n          <ComponentFour/>\n\
    \          <ComponentFive/>\n        </appBackgroundContext.Provider>\n      }\n\
    \    </>\n  );\n};\n\nexport default App;\n```\n\n# 自定义 hooks\n\n自定义 hooks 基本上是你编写自己的\
    \ hooks。这些钩是以 `use` 开头的函数。这些自定义 hooks 遵循我们之前提到的 React hooks 的相同原理。让我们来看一个示例：\n\
    \n```javascript\nimport {useEffect,useState} from 'react';\nconst useApi=(endpoint)=>{\n\
    \  const [data,setData]=useState([]);\n  useEffect(()=>{\n    const ApiCall=async()=>{\n\
    \      return fetch(endpoint).then(response=> response.json()).then(result=>{\n\
    \        setData(result)\n      })\n    };\n    ApiCall();\n  },[endpoint]);\n\
    \  return {data}\n}\nexport default useApi\n```\n\n前面的代码是一个自定义 hook，它接收一个 `endpoint`\
    \ 作为通用 API，运行 `useEffect` 异步钩子，并将数据返回给调用组件：\n\n```javascript\nimport useApi from\
    \ './hooks'\nconst App = () => {\n  const {data}=useApi('https://jsonplaceholder.typicode.com/todos');\n\
    \  return (\n    <ul\n      {\n        data && data.map(item=>{\n          return\
    \ <>\n            <li>{item.id} {item.title} </li>\n          </>\n        })\n\
    \      }\n    </ul>\n  )\n};\nexport default App;\n```\n\n上面的代码调用了之前代码中定义的 `useApi`\
    \ 自定义 hook，并将数据传递给函数组件。请查看函数组件返回时的结果。\n\n![](img/Figure-4.6.jpg)\n\n**图 4.6：**\
