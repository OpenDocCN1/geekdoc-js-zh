  trans: "\n\nTypeScript 是 JavaScript 的超集。由于它是强类型的，TypeScript 有助于构建可扩展的应用程序。TypeScript\
    \ 在 Babel 的帮助下在运行时编译为 JavaScript。到目前为止，我们在书中已经使用了一些 TypeScript 示例，但我们将介绍在使用 TypeScript\
    \ 构建应用程序时需要注意的概念和事项。\n\n# 结论\n\n我们已经了实现整洁且可维护代码的不同方法。在接下来的章节中，我们将介绍 React hooks\
    \ 及其优势。我们还将介绍如何使用自定义 hooks 来构建我们的应用程序。\n\n# 第 4 章\n\n# React Hooks\n\n## 引言\n\n\
    本章将介绍什么是 React hooks，并介绍 React 中常用的 hooks。我们还将介绍构建应用程序时如何编写自定义 hooks 及其优势。我们将看到如何在单个应用程序中结合\
    \ hooks 和自定义 hooks。\n\n## 结构\n\n本章将涵盖以下主题：\n\n*   React hooks\n*   自定义 hooks\n\
    \n## 目标\n\n在本章中，我们将学习如何编写自定义 hooks 以及使用 React 中的内置 hooks。我们将通过示例项目来学习更多关于 hooks\
    \ 的知识。\n\n## React hooks\n\nReact hooks 是用于函数组件的生命周期方法。React hooks 在 React 16.8\
    \ 中引入。原本存在于类组件中的生命周期方法被合并到了 React hooks 中。React hooks **不会** 在类组件内部工作。这些内置 React\
    \ hooks 包括于：\n\n*   `useState`\n*   `useReducer`\n*   `useEffect`\n*   `useLayoutEffect`\n\
    *   `useMemo`\n*   `useCallback`\n*   `useRef`\n*   `useContext`\n\n使用 React hooks\
    \ 时需要遵循一些规则。我们将介绍其中几个：\n\n*   Hooks 只能在函数组件中调用。\n*   Hooks 必须在顶层调用，不能在循环、条件语句内部。\n\
    *   你可以创建自己的 hooks，但必须遵循第一和第二规则。\n\n## useState\n\n`useState` 方法是常用的 React hooks\
    \ 之一。该 hook 在 React 中归类为受控组件。`useState` 方法设置初始值，该值会在用户执行操作时更新。让我们用一个例子来解释这一点：\n\
    \n```\nimport React,{useState} from 'react'\n\nconst MyApp=()=>{\n  const [counter,setCounter]=useState(0);\n\
    \  return (\n    <>\n      <p>Current count is {counter}</p>\n      <button onClick={()=>setCounter(counter+1)}>\
    \ increase counter </button>\n      <button onClick={()=>setCounter(counter-1)}>\
    \ decrease counter</button>\n    </>\n  )\n};\n\nexport default MyApp;\n```\n\n\
    前面的示例是一个简单的计数器应用程序。该应用程序有两个按钮分别增加和减少计数器值。我们在第一行从 React 库导入了 `useState` hook。然后我们在第第五行声明了计数器状态并将其初始值设置为\
    \ 0。因此，在点击任一按钮时，我们调用 `setCounter` 并将当前计数器传递给它，这样我们就可以将当前计数器值增加或减少 `1`。计数器的值显示在第九行。\n\
    \n## useReducer\n\n`useReducer` 方法是常用的 React hooks 之一。当应用程序中有复杂的状态变化时，可以使用该 hook。它类似于\
    \ `useState`，但通过派发动作（actions）来更新状态。让我们用一个例子来解释这一点：\n\n```\nimport React,{useReducer,}\
    \ from 'react'\n\nconst MyApp=()=>{\n  const initialState={counter:0}\n  const\
    \ appReducer=(state, action)=>{\n    switch(action.type){\n        case 'increase':\n\
    \          return {counter:state.counter ++};\n        case 'decrease':\n    \
    \      return {counter:state.counter --};\n        default:\n          return\
    \ {counter:state.counter};\n      }\n  }\n  const [state, dispatch] = useReducer(appReducer,\
    \ initialState);\n  return (\n    <>\n      <p>Current count is {counter}</p>\n\
    \      <button onClick={()=>dispatch({type:'increase'})}> increase counter </button>\n\
    \      <button onClick={()=>dispatch({type:'decrease'})}> decrease counter</button>\n\
    \    </>\n  )\n};\n```\n\n前面的示例是一个简单的计数器应用程序。该应用程序有两个按钮分别增加和减少计数器值。我们在第一行从 React\
    \ 库导入了 `useState` hook（注：此处原文可能误为 useState，实际应为 useReducer）。我们在第第五行声明了计数器状态并将其初始值设置为\
    \ 0。`useReducer` 方法使用 `appReducer` 和 `initialState` 来管理状态。\n\n## useEffect\n\n\
    `useEffect` 方法是常用的 React hooks 之一。该 hook 用于处理副作用。`useEffect` 方法可以接受两个参数：回调函数和一个依赖数组。\n\
    \n这是一个示例：\n\n```\nimport React,{useEffect,useState} from 'react'\n\nconst MyApp=()=>{\n\
    \  const [data,setData]=useState([]);\n  useEffect(()=>{\n    const fetchData=async()=>{\n\
    \      return fetch('https://jsonplaceholder.typicode.com/todos')\n        .then(response\
    \ => response.json())\n        .then(json => setData(json))\n    }\n    fetchData();\n\
    \  },[])\n  return (\n    <<ul>\n      {data.length >0 && data.map(item=>{\n \
    \       <li key={item.id}>{item.title}</li>\n      })}\n    </ul>\n  )\n}\n\n\
    export default MyApp;\n```\n\n"
- fmt: "\n```javascript\nimport React,{useLayoutEffect,useState} from 'react'\n\n\
    const MyApp=()=>{\n  const [data,setData]=useState([]);\n  useLayoutEffect(()=>{\n\
    \    const fetchData=async()=>{\n      return fetch('https://jsonplaceholder.typicode.com/todos')\n\
    \        .then(response => response.json())\n        .then(json => setData(json))\n\
    \    } ;\n    fetchData();\n  },[])\n  return (\n    <ul>\n      {data.length\
    \ >0 && data.map(item=>{\n        return <li key={item.id}>{item.title}</li>\n\
    \      })}\n    </ul>\n  )\n}\n\nexport default MyApp;\n```\n\nIn the preceding\
    \ example, we used the `useState` hook and the `useEffect` hook. We made a call\
    \ to the `https://jsonplaceholder.typicode.com/todos` API and stored the array\
    \ data in the `useState` hook. We then looped through the array data and displayed\
    \ it inside the functional component on line 16.\n\n# useMemo\n\nThe `useMemo`\
    \ method is one of the commonly used React hooks. The `useMemo` method is used\
    \ for memoization in react. The `useMemo` method memoizes a computation and returns\
    \ its value. This hook is very good for performance because it will cache the\
    \ computed value and return it if the values in the dependency array do not change.\
    \ If the values change, then the `useMemo` is run again, and the newly computed\
    \ value is returned. Let us see the `useMemo` effect in action with an example:\n\
    \n```javascript\nimport React,{useMemo} from 'react'\n\nconst MyApp=()=>{\n  const\
    \ result=useMemo(()=>{\n    return 1+1;\n  },[])\n  return (\n    <p>{result}</p>\n\
    \  )\n}\n\nexport default MyApp;\n```\n\n# useCallback\n\nThe `useCallback` method\
    \ is one of the commonly used React hooks. The `useCallback` method is used for\
    \ memoization in react. The `useCallback` method memoizes a computation and returns\
    \ its function. This hook is very good for performance because it will cache the\
    \ computed value and return it if the values in the dependency array do not change.\
    \ If the values change, then the `useCallback` is run again, and the new computed\
    \ function is returned. Let us see the `useCallback` effect in action with an\
    \ example:\n\n```javascript\nimport { useState, useCallback } from \"react\";\n\
    \nconst App = () => {\n  const [count,setCount]=useState(0);\n  const handleCount\
    \ = useCallback(() => {\n    setCount((currentValue) => currentValue + 1);\n \
    \ }, []);\n  return (\n    <>\n      <hr />\n      <div>\n        Count: {count}\n\
    \        <button onClick={handleCount}>+</button>\n      </div>\n    </>\n  );\n\
    };\n\nexport default App;\n```\n\n# useRef\n\nThe `useRef` method is one of the\
    \ commonly used React hooks. The `useRef` method is used for the following two\
    \ major reasons:\n\n- Points to an element in the DOM.\n- Used to store values\
    \ of elements even after re-rendering.\n\nLet us look at what the `useRef` method\
