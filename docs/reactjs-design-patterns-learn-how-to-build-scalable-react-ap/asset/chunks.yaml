    # [GraphQL](#toc.xhtml_s126a)


    GraphQL is a query language for APIs and a runtime for fulfilling those queries
    with your existing data. GraphQL provides a complete and understandable description
    of the data in your API, gives clients the power to ask for exactly what they
    need and nothing more, makes it easier to evolve APIs over time, and enables powerful
    developer tools.


    Send a GraphQL query to your API and get exactly what you need, nothing more and
    nothing less. GraphQL queries always return predictable results. Apps using GraphQL
    are fast and stable because they control the data they get, not the server.


    # [Rest API versus GraphQl](#toc.xhtml_s127a)


    | **GraphQL** | **Rest API** |


    | A query language for solving common problems when integrating APIs. | An architectural
    style is largely viewed as a conventional standard for designing APIs. |


    | Deployed over HTTP using a single endpoint that provides the full capabilities
    of the exposed service. | Deployed over a set of URLs where each of them exposes
    a single resource. |


    | Uses a client-driven architecture. | Uses a server-driven architecture. |


    | Allows for schema stitching and remote data fetching. | Simplifying work with
    multiple endpoints requires expensive custom middleware. |


    # [Caching data](#toc.xhtml_s128a)


    In most reach applications, it is normal that we compute data or fetch data from
    an API. However, this data cannot be computed all the time or fetched all the
    time when there is a render of the component. There are several ways to achieve
    the caching of data in React. Let us look at them with the following examples:


    *   Memoization


    *   State management


    # [Memoization](#toc.xhtml_s129a)


    Memoization is an optimization technique used primarily to speed up computer programs
    by **storing the results of expensive function calls** and returning the cached
    result when the same inputs occur again.'
