    \n**Figure 5.4:** Demonstration of bootstrap CSS\n\n# Pros\n\n* Already inbuilt\
    \ styles for your use.\n\n* Has responsive styles by default.\n\n# Cons\n\n* Overriding\
    \ a style can be difficult.\n\n# Styled components\n\nStyled components are one\
    \ of the commonly used ways of styling a react application. It involves the writing\
    \ of styles in JavaScript. We will look at this in the following example. Before\
    \ we look at this example, please first run the following command:\n\n`npm install\
    \ styled-components or yarn add styled-components`\n\nThen add the following lines\
    \ of code to your project:\n\n```javascript\nimport React,{useState} from 'react';\n\
    import styled from 'styled-components';\nconst Button=styled.button`\nbackground-color:#f4ebff;\n\
    width:50%;\nheight:100px;\nborder-radius:10px;\nborder-color:none;\nborder-width:0px;\n\
