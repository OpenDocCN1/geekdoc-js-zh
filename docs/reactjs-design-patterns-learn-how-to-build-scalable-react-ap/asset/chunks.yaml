    \n# 第 1 章 (toc.xhtml_c01)\n\n# React 反模式与最佳实践 (toc.xhtml_c01)\n\n# 引言 (toc.xhtml_s1a)\n\
    \n本章将涵盖编写 React 应用程序的不同模式。是的，React 是有主场的（opinion），尽管它允许您根据自己的喜好或组织需求来构建和结构化应用程序。然而，随着应用程序的增长，某些非常糟糕的实践会对您的应用产生影响。\n\
    \n本章将识别常见的坏做法，并建议更好的实践以帮助构建可扩展的 React 应用程序。在本章中我们将使用 `JavaScript` 和 `TypeScript`。这似乎是重复的，因为插图示例中未使用\
    \ `TypeScript`，且 React 是基于 `JavaScript` 构建的。\n\n# 结构 (toc.xhtml_s2a)\n\n本章将涵盖以下主题：\n\
