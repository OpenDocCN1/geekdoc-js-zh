    \n在第 9 行，我们调用了 `onChange` 处理事件，并将匿名函数传递给它以更新状态值。\n\n让我们来看使用 TypeScript 的相同示例。\n\
    \n```typescript\nimport React,{useState} from \"react\";\n\nconst App=()=>{\n\
    \  const [user,setUser]=useState<string>('');\n\n  return (\n    <input type='text'\
