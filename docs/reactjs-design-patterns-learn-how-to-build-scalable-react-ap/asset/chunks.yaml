    \ state has changed.');\n    }\n  }\n  render(){\n    return <p>{this.state.message}</p>\n\
    \  }\n}\nexport default App;\n```\n\n# React 组件结构的最佳实践\n\nReact 组件是构建小型到健壮应用程序的方法。这些\
    \ React 组件需要良好的结构，以便它们是可测试、可扩展且易于发现错误的。让我们来看保持良好的 react 组件结构的一些方法。\n\n* **避免大型组件**：大型组件在大多数时候难以阅读、理解和调试。是的，你可以拥有一个大型组件，应用程序运行良好，但当出现问题时，你该如何调试呢？因此，你应该将你的大型组件拆分为更小的组件，以便其具有可读性、可测试性并易于发现错误。\n\
    \n* **为组件和变量进行良好的命名**：编写合理的变量名、方法名或组件名是非常重要的。避免歧义的命名。\n\n"
- fmt: "\n- **Keep your folder structure precise and understandable**: File and folder\
    \ structure is also very important in achieving a good component structure. Give\
    \ folder structure (however you want) to your project so that it is easy to understand\
    \ what files are to be put in a particular folder.\n- **Move reusable logic into\
    \ a separate class or function**: Generally, in programming, always keep in mind\
    \ the DRY concept. Whatever reusable logic you feel the app or component will\
    \ use, move it to a function or method and call it wherever you want to use it\
    \ in the application.\n- **Try to write tests**: Tests are very important when\
    \ writing an application. Lots of developers hate writing tests, but they have\
    \ their own advantages and trust me, they are huge. This gives you some assurance\
    \ that your components are working as expected and would reduce the number of\
    \ bugs in your application when written well.\n\n# Data sharing between components\n\
    \nIn react, we must share data between components. There are different ways to\
    \ do this depending on how complex your state is changing or how big your application\
    \ is. Let us look at some ways of doing this:\n\n* Props\n* ContextApi\n* Redux\n\
    * useReducer\n\n# Props\n\nProps are essential in React. Props is one of the ways\
    \ to pass data from one component to another in React. Props are objects that\
    \ are passed from the parent component down to the children's components. Props\
    \ is a short form of properties.\n\nWe will look at a simple way of passing `props`\
    \ from the parent component to the child component:\n\n```javascript\nimport react\
    \ from 'React';\n\nconst data={\n  id:1,\n  name:'Chidimma Jane Udensi',\n  state:'Imo\
    \ State',\n  Village:'Akokwa',\n}\nconst App=()=>{\n  const secondComponent=(props)=>{\n\
    \    const {id,name,state,village}=props;\n    return (\n      <>\n        <p>{id}</p>\n\
    \        <p>{name}</p>\n        <p>{state}</p>\n        <p>{village}</p>\n   \
    \   </>\n    )\n  }\n  return (\n    <secondComponent props={data}/>\n  )\n}\n\
    export default App;\n```\n\nThe preceding example shows how we passed props from\
    \ the `App` component to the second component. The second component needs a prop,\
    \ and we passed the object `data` to it and destructured it on line 14.\n\n# Context\
    \ API\n\nContext API is also a way of passing data from one component to another.\
    \ The main difference between context API and Props is that context API is not\
    \ passed down from parent to child on every component. The context API has two\
    \ main methods:\n\n* Provider\n* Consumer\n\n# Provider\n\nThis is one of the\
    \ essential parts of `contextApi`. The Provider accepts a value that is to be\
    \ passed down to the child components.\n\n# Consumer\n\nThis is one of the essential\
    \ parts of `contextApi`. The Consumer allows the calling component to subscribe\
    \ to the context changes.\n\n# Redux\n\nRedux is an open-source JavaScript library\
    \ that keeps a global state that makes applications behave consistently. The redux\
    \ library consists of the following three parts:\n\n* Store\n* Reducer\n* Actions\n\
    \n# Store\n\nThe store is one of the parts of the Redux open-source JavaScript\
    \ library. This is the part where the global state is stored. This part of redux\
    \ is immutable, which simply means, not possible to change.\n\n**Note: Immer in\
    \ the redux toolkit enables you to write mutable code.**\n\n# Reducer\n\nThe reducer\
    \ is one of the parts of the Redux open-source JavaScript library. The reducer\
    \ is a pure function that takes in two arguments (initial state and action) and\
    \ returns a new state.\n\n# Actions\n\nThe actions are one of the parts of Redux\
    \ open-source JavaScript library. The action is a JavaScript object that tells\
    \ the reducer what the user wants to do in the store. The actions are instructions\
    \ from the user to either mutate (using immer) a state in the store or create\
    \ a copy of the state in the store.\n\n# useReducer\n\nThe `useReducer` method\
    \ is also a way to share data between components. The `useReducer` method is used\
    \ when you have complex state. The `useReducer` method has an initial state and\
    \ an action and returns the current state and a `dispatch` method. Let us look\
    \ at an example for the same:\n\n```javascript\nimport { useReducer } from \"\
    react\";\nconst initialTasks = [\n  {\n    id: 1,\n    title: \"Drink Coffee\"\
    ,\n    completed: false,\n  },\n  {\n    id: 2,\n    title: \"Write Code\",\n\
    \    completed: false,\n  },\n];\nconst reducer = (state, action) => {\n  switch\
    \ (action.type) {\n    case \"COMPLETED\":\n      return state.map((todo) => {\n\
    \        if (todo.id === action.id) {\n          return { ...todo, completed:\
    \ !todo.completed };\n        } else {\n          return todo;\n        }\n  \
    \    });\n    default:\n      return state;\n  }\n};\nfunction TodoTask() {\n\
    \  const [todos, dispatch] = useReducer(reducer, initialTasks);\n  const handleComplete\
    \ = (todo) => {\n    dispatch({ type: \"COMPLETED\", id: todo.id });\n  };\n \
    \ return (\n    <>\n      {todos.map((todo) => (\n        <div key={todo.id}>\n\
    \          <label>\n            <input\n              type=\"checkbox\"\n    \
    \          checked={todo.completed}\n              onChange={() => handleComplete(todo)}\n\
    \            />\n            {todo.title}\n          </label>\n        </div>\n\
    \      ))}\n    </>\n  );\n}\nexport default TodoTask\n```\n\n# Controlled versus\
    \ uncontrolled components\n\nControlled components are basically data that is\
    \ handled by react components, whereas uncontrolled components are data handled\
    \ by the DOM. The controlled component is basically handled by events or input\
    \ from the user. Let us look at an example of both:\n\n```javascript\nimport React,{useState}\
    \ from 'react';\nconst App=()=>{\nconst [user,setUser]=useState('');\nreturn (\n\
    \  <input type='text'onChange={(e)=> setUser(e.target.value)}\n)\n}\n// (Note:\
    \ The source text for the controlled example had a syntax error in the provided\
    \ snippet; I have cleaned the formatting while keeping the logic provided)\n```\n\
    \n```javascript\nimport React,{useRef} from 'react';\nconst App=()=>{\nconst userInputRef=useRef();\n\
    return (\n  <input type='text' ref={userInputRef} />\n)\n}\nexport default App;\n\
    ```\n\nThe preceding example is an example of uncontrolled components. You can\
    \ see that we made a reference to the Dom element on line 8. We can get the value\
    \ of the user using the `ref` attribute.\n\n# Conclusion\n\nIn this chapter, we\
    \ have been able to look at how we should name components and variables. We also\
    \ looked at functional components, class components and some of their commonly\
    \ used lifecycle methods.\n\nWe further looked at the best ways of structuring\
    \ components, and ways data is being shared between components. We ended with\
    \ controlled versus uncontrolled components with some examples.\n\nIn the upcoming\
    \ chapter, we will be looking at clean and maintainable codes and their benefits.\n"
