    \ at some common conventions in writing styles. These include the following:\n\
    \n# [BEM](#toc.xhtml_s98a)\n\n**Block Element Modifier** (**BEM**) is a common\
    \ convention when writing CSS. It is used to break down large interfaces into\
    \ independent blocks. We will look at the three blocks that make up the BEM in\
    \ the following details:\n\n# Block\n\nBlock describes a purpose. They are usually\
    \ represented by a class. It tells us what that class is doing at first glance.\
    \ Let us look at the following example:\n\n1.  `<div className=\"success\"></div>`\n\
    \nThe preceding code is a simple **`div`** with a **`className`** of success.\
    \ This **`div`** will show up on the success of an operation. The block has the\
    \ following two rules:\n\n*   Blocks can be nested in each other.\n\n*   You can\
    \ have any number of nesting levels.\n\n# Element\n\nElement also describes a\
    \ purpose. They are usually represented by a class. The element name is separated\
    \ from the block with a double underscore (**`__`**). Let us look at the following\
    \ example:\n\n`1\\.` `<div className=”form”>`\n\n`2.   <input type=’text’ className=’form__input’/>`\n\
    \n`3.   <input type=’submit’ className=’form__button’/>`\n\n`4\\.` `u</div>`\n\
    \nThe preceding code is a simple parent **`div`** with a **`className`** of form.\
    \ This **`div`** has two inputs inside of it which are text and submit. They both\
    \ have **`classNames`** preceding with **`form__button`** and **`form__input`**,\
    \ which signifies that this is an element of the block form.\n\n# Modifier\n\n\
    A modifier also describes the appearance, state, or behavior of a block or element.\
    \ They are usually separated from the block or element name by a single underscore\
    \ (**`_`**).\n\n`1\\.` `<div className=”form”>`\n\n`2.   <input type=’text’ className=’form__input_disabled’/>`\n\
    \n`3.   <input type=’submit’ className=’form__button_big’/>`\n\n`4\\.` `</div>`\n\
    \n# [Conclusion](#toc.xhtml_s99a)\n\nIn this chapter, we learned how to style\
    \ components and the benefits of styling components. We also learned the different\
    \ types of styles and their pros and cons. We also looked at a naming convention\
    \ when writing styles in react.\n\nIn the upcoming chapter, we will look at the\
    \ server-side rendering and its benefits.\n\n# [CHAPTER 6](#toc.xhtml_c06)\n\n\
    # [Server-Side Renderings](#toc.xhtml_c06)\n\n# [Introduction](#toc.xhtml_s100a)\n\
    \nIn this chapter, we will look at what server-side rendering is, when to use\
    \ it, and its pros and cons. We will also look at a popular server-side framework\
    \ (Next.js) and how it differs from the client-side react library.\n\n# [Structure](#toc.xhtml_s101a)\n\
    \nThe following topics are to be covered:\n\n*   What is server-side rendering?\n\
    \n*   When to use server-side rendering like Next.js\n\n*   Pros and cons of using\
    \ Next.js\n\n*   Pre-rendering in Next.js\n\n*   Next.js versus React.js\n\n*\
    \   Server-side rendering with Node.js and Express.js.\n\n# [Objectives](#toc.xhtml_s102a)\n\
    \nIn this chapter, we will learn how to use server-side rendering frameworks like\
    \ Next.js. We will learn the differences, pros, and cons of Next.js versus React.js.\
    \ We will look at some use cases on when to use server-side rendering like Next.js.\n\
    \n# [What is Server-Side rendering?](#toc.xhtml_s103a)\n\n**Server-side rendering**\
    \ (**SSR**) is basically rendering HTML pages to the client that are served from\
    \ the server. The client makes a request to the server based on the user event;\
    \ the server makes the page ready and returns it to the client, which then renders\
    \ the page. This request is done by the Web browser on the server-side.\n\n# [When\
    \ to use server-side rendering?](#toc.xhtml_s104a)\n\nServer-side rendering is\
    \ not used on every application. The following are some of the reasons why you\
    \ will choose SSR:\n\n*   Better user experience\n\n*   Rapid feature development\n\
    \n*   Performance\n\n# [Pros of using Next.js](#toc.xhtml_s105a)\n\nThe following\
    \ are some of the pros of using Next.js:\n\n*   **Great for SEO**: This is another\
    \ benefit of using Next.js. Search engine optimization helps you increase traffic\
    \ visits to your site, and Next.js provides this. It has the built-in functionality\
    \ to make this happen.\n\n*   **Great community support**: Next.js has a very\
    \ large community because the framework is still very much evolving and growing\
    \ popular by the day.\n\n*   **Fast refresh**: When code changes are made on the\
    \ Nex.js application, the changes reflect within seconds on the browser.\n\n*\
    \   **Speed**: Next.js is very fast because most of the pages are pre-rendered\
    \ on the server-side and served on the client side. This is a very big advantage\
    \ of using next.js.\n\n*   **Image optimization**: This is one of the main benefits\
    \ of using Next.js. This feature automatically optimizes images. It now supports\
    \ AVIF images, enabling 20% smaller images compared to WebP.\n\n*   **Typescript\
    \ support**: This is one of the main benefits of using Next.js Automatic TypeScript\
    \ configuration and compilation.\n\n*   **Zero config**\n\n*   **Great developer\
    \ experience**: One of the main benefits of using NextJS for our team is the developer\
    \ experience. With NextJS, we spend more time writing features and less time struggling\
    \ with building tools and Webpack.\n\n    We also really enjoy how NextJS structures\
    \ its projects into pages and how there is one way of doing routing.\n\n*   **Data\
    \ fetching**: Rendering content in different ways, depending on the app's use\
    \ case. This includes both pre-rendering with server-side rendering or static\
    \ site generation and updating or creating content at runtime with incremental\
    \ static regeneration.\n\n*   **Middleware**: This feature enables the use of\
    \ code over configuration, so you can run code before a request is completed.\
    \ You can change the response to requests and redirect the user from one route\
    \ to another.\n\n*   **Data security**: Next.js does not freeze the browser to\
    \ download and execute a whole lot of JavaScript code at once; it has the potential\
    \ to dramatically improve metrics such as **total blocking tim**e (**TBT**). It\
    \ measures the amount of time blocked by the scripts before the user can interact\
    \ with the Web app, and it should ideally be below 300 ms. The better your TBT,\
    \ the quicker your Web app becomes useful for your users. That, in turn, makes\
    \ it more probable to convert them into customers. Waiting for a page to interact\
    \ is a significant turn-off, which might increase your bounce rate (the number\
    \ of users that leave your page on the first URL before 30 seconds). That is another\
    \ SEO-relevant factor.\n\n*   **Performance**\n\n# [Cons of using Next.js](#toc.xhtml_s106a)\n\
    \nThe following are some of the cons of using Next.js:\n\n*   **Development and\
    \ management**: If you want to use NextJS to build an online store, yet you do\
    \ not have an in-house team of developers, you will need a dedicated person to\
    \ handle the development and management\n\n*   **Routing problems**: Since a file-based\
    \ router limits what Next.js can do in routing through nodes, you will have to\
    \ use the Node.js server if your project requires dynamic routes.\n\n*   **No\
    \ state manager**: No built-in state manager is available in the framework Next.js.\
    \ To get the most out of one, you will need another tool to do it.\n\n*   **Limited\
    \ building time**: The time it takes to build or build websites and apps is restricted.\
    \ Adding new pages to a website or app is no problem for Next.js. However, the\
    \ static creation of the entire website means that the build time can be extremely\
    \ long for apps with many pages.\n\n# [Pre-rendering in Next.js](#toc.xhtml_s107a)\n\
    \nNext.js pre-renders every page. This means that HTML for each page is generated\
    \ in advance, instead of it all being done by the client-side. There are two types\
    \ of Pre-rendering, namely:\n\n*   Static generation\n\n*   Server-side rendering\n\
    \n# [Static generation](#toc.xhtml_s108a)"
