    \       <label htmlFor=\"firstName\">FirstName:</label>\n        <input id=\"\
    firstName\" type=\"text\" placeholder=\"firstName\"/>\n        <label htmlFor=\"\
    lastName\">LastName:</label>\n        <input id=\"lastName\" type=\"text\" placeholder=\"\
    lastName\"/>\n        <label htmlFor=\"username\">Username:</label>\n        <input\
    \ id=\"username\" type=\"text\" placeholder=\"username\"/>\n        <label htmlFor=\"\
    password\">Password:</label>\n        <input id=\"password\" type=\"password\"\
    \ placeholder=\"password\"/>\n        <input type=\"submit\" value=\"Sign Up\"\
    />\n      </form>\n    </div>\n  )\n}\n```\n\n前面的代码组件是 `Register`。这个组件只负责一件事，即处理用户注册。这是我们的注册组件在渲染时的样子：\n\
    \n![](img/Figure-8.5.jpg)\n\n**图 8.5:** 我们的 Register 组件\n\n所以，为了让我们在项目中使用这些组件，我们应该将它们导入到想要使用的地方，而不是在同一个文件中编写。让我们来看看我的意思：\n\
    \n```javascript\nimport React, { useState } from \"react\";\nimport Login from\
    \ \"./Login\";\nimport SignUp from \"./SignUp\";\nimport \"./styles.css\";\nconst\
    \ App = () => {\n  const [activePath, setActivePath] = useState(\"login\");\n\
    \  const onNav=(e)=>{\n    setActivePath(e);\n  }\n  return (\n    <div>\n   \
    \   <div className=\"nav\">\n        <button onClick={()=>onNav(\"login\")}>Login</button>\n\
    \        <button onClick={()=>onNav(\"Register\")}> Register</button>\n      </div>\n\
    \      <div className=\"login\">\n        {activePath === \"login\" && <Login/>}\n\
    \        {activePath !== \"login\" && <SignUp />}\n      </div>\n    </div>\n\
    \  );\n};\nexport default App;\n```\n\n![](img/Figure-8.6.jpg)\n\n**图 8.6:** 我们的组件首次渲染时的样子\n\
    \n这是我们的应用程序渲染时的样子，当点击 Register 按钮时，将如下所示：\n\n![](img/Figure-8.7.jpg)\n\n**图 8.7:**\
    \ 点击注册按钮时的组件状态\n\n所以，让我们通过不同的路径调用我们的 API 来登录或注册用户，而不是在单个文件中调用 API。让我们通过下面的示例来看一看：\n\
    \n```javascript\nconst baseUrl = \"http://api.com\";\nconst httpJsonResponse =\
    \ (response) => {\n  if (!response.ok) {\n    return Promise.reject(response.statusText);\n\
    \  }\n  return Promise.resolve(response.json());\n};\nexport Post = (path,data)\
    \ => {\n  return fetch(`${baseUrl}/path`,JSON.stringify(data))\n    .then(httpJsonResponse)\n\
    \    .then((response) => {\n      return response;\n    });\n};\n```\n\n因此，前面的代码有一个\
    \ `Post` 方法，它将用于从应用程序的任何地方向 API 发送数据，而不是在应用程序的每个组件中调用 API。所以，我们可以将其导入到 `Login`\
    \ 或 `Register` 组件中并向它传递所需的参数。让我们来看看登录时的实际操作：\n\n```javascript\nimport {useState}\
    \ from 'react';\nimport {Post} from './api';\nimport \"./styles.css\";\nexport\
    \ default function Login() {\n  const [username, setUsername]=useState('');\n\
    \  const [password, setPassword]=useState('');\n  const onSubmit= async(event)=>{\n\
    \    event.preventDefault();\n    const data={\n      username,\n      password\n\
    \    };\n    const login= await Post(`login`,data)\n      .then(response=>response.json())\n\
    \      .then(data=>{\n        if(data){\n        }\n      })\n  }\n  return (\n\
    \    <div>\n      <form className=\"login\" onSubmit={onSubmit}>\n        <label\
    \ htmlFor=\"username\">Username:</label>\n        <input id=\"username\"onChange={(e)=>\
    \ setUsername(e.target.value)} type=\"text\" placeholder=\"username\"/>\n    \
    \    <label htmlFor=\"password\">Password:</label>\n        <input id=\"password\"\
    onChange={(e)}=> setPassword(e.target.value)} type=\"password\" placeholder=\"\
    password\"/>\n        <input type=\"submit\" value=\"Login\"/>\n      </form>\n\
    \    </div>\n  )\n}\n```\n\n前面的代码解释了表单详情的 `onSubmit` 触发了 API 的 `Post` 方法，因为我们已经从\
    \ API 文件中导出了它，并且路径和数据作为参数传递，它将返回一个 promise。\n\n# 高阶组件 (Higher order component)\n\
    \n高阶组件是一个接收组件并返回新组件的函数。让我们来看看这个 HOC 是如何工作的：\n\n```javascript\nimport React from\
    \ 'react'\nconst higherOrderComponent = Component => {\n  function HOC =()=> {\n\
    \    return <Component />\n  }\n  return HOC\n}\n```\n\n在前面的示例中，`higherOrderComponent`\
    \ 是一个接受 `Component` 作为参数的函数。我们创建了一个新组件 `HOC`，它返回 `<Component/>`。\n\n我们可以这样调用 `HOC`：\n\
    \n`const HOC = higherOrderComponent(MyComponent);`\n\n# SOLID 原则\n\nSOLID 原则是\
    \ Robert Martin 在 2000 年编写的面向设计原则。SOLID 是以下术语的缩写：\n\n-   **单一责任原则** (`SRP`)\n\
    -   **开放/封闭原则** (`OCP`)\n-   **里斯夫替换原则** (`LSP`)\n-   **接口隔离原则** (`ISP`)\n-  \
    \ **依赖倒转原则** (`DIP`)\n\n这些原则是为对象设计的，但它们也可以用于其他语言，例如 JavaScript。让我们看看如何在 React\
    \ 中使用 SOLID：\n\n- **单一责任原则 (SRP)**：该原则意味着每个组件应该只做一件事。在设计你的 React 应用时，请记住这个原则，因为它会让你的代码更具可读性和可维护性。\n\
    - **开放/封闭原则 (OCP)**：该原则规定，你的代码应该是可扩展的，而不需要破坏或重写模块。\n- **里斯夫替换原则 (LSP)**：该原则规定每个子类都应该是其基类的替代品。简单来说，如果我们有一个名为\
    \ `Make` 的类，它扩展到了另一个名为 `Car` 的类，我们应该扩展 `Make` 类而不触动 `Car` 类的功能。\n- **接口隔离原则 (ISP)**：该原则规定人们应该只使用他们需要的接口。在\
    \ React 中，这可以被说是 props。props 在每个 React 应用中都至关重要。当这些 props 从父组件传递到子组件时，应该只传递它们需要的，而不是\
    \ props 中的所有内容。我们可以通过对 props 进行解构来实现。\n- **依赖倒转原则 (DIP)**：该原则规定我们应该隐藏代码实现，并通过抽象与它们交互。\n\
    \n# 结论\n\n"
