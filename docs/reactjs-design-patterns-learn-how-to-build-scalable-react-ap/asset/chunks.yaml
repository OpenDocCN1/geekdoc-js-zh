    # [CHAPTER 5](#toc.xhtml_c05)


    # [Styling](#toc.xhtml_c05)


    # [Introduction](#toc.xhtml_s86a)


    This chapter will cover how to style React components. This will include preprocessors
    like Scss and Less. We will also cover styled-components and inline styles. Also,
    we will cover modular CSS.


    # [Structure](#toc.xhtml_s87a)


    The following topics are to be covered:


    *   Styling a component


    *   Types of styling (inline styling, preprocessors (Sass and Less), CSS, and
    styled-components


    *   Pros and cons of different styling


    *   Conventions for writing styles


    # [Objectives](#toc.xhtml_s88a)


    In this chapter, we will look at how to style a component and the different types
    of styling. We will also look at the pros and cons of the different types of styling.
    We will conclude by looking at some conventions for writing styles.


    # [Styling a component](#toc.xhtml_s89a)


    Styling is very important in every Web application because styling makes it very
    attractive to the user and gives the user a good experience. There are different
    ways to achieve this in React. We are going to look at some of the common ways
    of styling the React component to give a great view to the user.


    # [Types of styling](#toc.xhtml_s90a)


    So, in React and generally in website or Web applications, there are different
    types/ways of styling the application. We will look at some of them with detailed
    examples.


    *   Inline CSS


    *   External/referential CSS


    *   Sass


    *   Bootstrap


    *   Styled components


    *   Tailwind


    # [Inline CSS](#toc.xhtml_s91a)


    Inline CSS is one of the ways of styling websites or Web applications. It involves
    writing your styles on the HTML elements directly. We will look at this with the
    aid of the following example:


    1.  `export default function App() {`


    2.  `  return (`


    3.  `    <div>`


    4.  `      <p style={{color:''green'',fontSize:''30px''}}>Welcome</p>`


    5.  `    </div>`


    6.  `  )`


    7.  `}`


    The preceding example shows us a typical example of an inline style. We styled
    the paragraph by making the **`color`** of the text **`green`**, and the size
    grew by **`30px`**. This has some pros and cons, which we will look at subsequently.
    Let us see the following code and how it looks like in the browser:


    ![](images/Figure-5.1.jpg)


    **Figure 5.1:** Demonstration of inline CSS


    # Pros


    *   Easy to write.


    *   The browser loads and applies the styles faster.


    # Cons


    *   Styles would be duplicated.


    # [External CSS](#toc.xhtml_s92a)


    External CSS is one of the ways of styling websites or Web applications. It involves
    writing all your styles in classes and IDs inside a file and referencing it inside
    our application or component. We will look at this with the aid of the following
    example:


    1.  `.container{`


    2.  `  display:flex;`


    3.  `  justify-content:center;`


    4.  `}`


    5.  `.header{`


    6.  `  color:green;`


    7.  `  font-size:50px;`


    9.  `}`


    Here, we declared our style inside a separate file and named it **`App.css`**.
    We added a class named **`header`** and wrote **`color`** and **`font-size`**
    for it. We also declared a **`container`** class and used a flexbox for the **`display`**
    property. We want to **`center`** the content of our container. Let us look at
    how we would make use of the preceding file in the following application:


    1.  `import ''./App.css''`


    3.  `export default function App() {`


    4.  `  return (`


    5.  `    <div className="container">`


    6.  `      <p className="header">Welcome</p>`


    7.  `    </div>`


    8.  `  )`


    9.  `}`


    We imported the **`App.css`** file, which contains our CSS classes. We imported
    it from our directory on line 1 and applied it on lines 5 and 6 using the **`className`**
    parameter. Let us see how the code will look on the following browser:


    ![](images/Figure-5.2.jpg)


    **Figure 5.2:** Demonstration of external CSS


    # Pros


    *   Easy to write.


    *   Keeps component clean because styles are abstracted to a file.


    *   Styles would not be repeated and can be applied in multiple places.


    # Cons


    *   Slow to load because the file would have to be downloaded by the browser first.


    # [Sass](#toc.xhtml_s93a)


    **Sass (Synthetically Awesome Style Sheet)** is a preprocessor. CSS is one method
    for styling React applications. It has the extension **`.scss`**. It has some
    great features, such as:


    *   Mixins


    *   Inheritance


    *   Nesting


    We would look at how to use sass in our React application with the aid of an example.
    To get started using sass, please run the following command:


    **`npm install sass`**


    or


    **`yarn add sass`**


    Please make sure you have installed node.js before running the preceding command:


