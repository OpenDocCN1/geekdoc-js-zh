    # Conventions of writing styles


    We have looked at the different kinds of styles in our preceding topic, but now,
    we are going to look at some common conventions in writing styles. These include
    the following:


    ## BEM


    **Block Element Modifier** (`BEM`) is a common convention when writing CSS. It
    is used to break down large interfaces into independent blocks. We will look at
    the three blocks that make up the BEM in the following details:


    ### Block


    Block describes a purpose. They are usually represented by a class. It tells us
    what that class is doing at first glance. Let us look at the following example:


    ```html

    <div className="success"></div>

    ```


    The preceding code is a simple `div` with a `className` of success. This `div`
    will show up on the success of an operation. The block has the following two rules:


    * Blocks can be nested in each other.

    * You can have any number of nesting levels.


    ### Element


    Element also describes a purpose. They are usually represented by a class. The
    element name is separated from the block with a double underscore (`__`). Let
    us look at the following example:


    ```html

    1. <div className="form">

    2. <input type=''text'' className=''form__input''/>

    3. <input type=''submit'' className=''form__button''/>

    4. </div>

    ```


    The preceding code is a simple parent `div` with a `className` of form. This `div`
    has two inputs inside of it which are text and submit. They both have `classNames`
    preceding with `form__button` and `form__input`, which signifies that this is
    an element of the block form.


    ### Modifier


    A modifier also describes the appearance, state, or behavior of a block or element.
    They are usually separated from the block or element name by a single underscore
    (`_`).


    ```html

    1. <div className="form">

    2. <input type=''text'' className=''form__input_disabled''/>

    3. <input type=''submit'' className=''form__button_big''/>

    4. </div>

    ```


    ## Conclusion


    In this chapter, we learned how to style components and the benefits of styling
    components. We also learned the different types of styles and their pros and cons.
    We also looked at a naming convention when writing styles in react.


    In the upcoming chapter, we will look at the server-side rendering and its benefits.


    # CHAPTER 6


    ## Server-Side Renderings


    ### Introduction


    In this chapter, we will look at what server-side rendering is, when to use it,
    and its pros and cons. We will also look at a popular server-side framework (`Next.js`)
    and how it differs from the client-side react library.


    ### Structure


    The following topics are to be covered:


    * What is server-side rendering?

    * When to use server-side rendering like Next.js

    * Pros and cons of using Next.js

    * Pre-rendering in Next.js

    * Next.js versus React.js

    * Server-side rendering with Node.js and Express.js.


    ### Objectives


    In this chapter, we will learn how to use server-side rendering frameworks like
    `Next.js`. We will learn the differences, pros, and cons of `Next.js` versus `React.js`.
    We will look at some use cases on when to use server-side rendering like `Next.js`.


    ## What is Server-Side rendering?


    **Server-side rendering** (`SSR`) is basically rendering HTML pages to the client
    that are served from the server. The client makes a request to the server based
    on the user event; the server makes the page ready and returns it to the client,
    which then renders the page. This request is done by the Web browser on the server-side.


    ## When to use server-side rendering?


    Server-side rendering is not used on every application. The following are some
    of the reasons why you will choose SSR:


    * Better user experience

    * Rapid feature development

    * Performance


    ## Pros of using Next.js


    The following are some of the pros of using `Next.js`:


    * **Great for SEO**: This is another benefit of using `Next.js`. Search engine
    optimization helps you increase traffic visits to your site, and `Next.js` provides
    this. It has the built-in functionality to make this happen.

    * **Great community support**: `Next.js` has a very large community because the
    framework is still very much evolving and growing popular by the day.

    * **Fast refresh**: When code changes are made on the Nex.js application, the
    changes reflect within seconds on the browser.

    * **Speed**: `Next.js` is very fast because most of the pages are pre-rendered
    on the server-side and served on the client side. This is a very big advantage
    of using `next.js`.

    * **Image optimization**: This is one of the main benefits of using `Next.js`.
    This feature automatically optimizes images. It now supports AVIF images, enabling
    20% smaller images compared to WebP.

    * **Typescript support**: This is one of the main benefits of using Next.js

    * **Zero config**

    * **Great developer experience**: One of the main benefits of NextJS our team
    is the developer experience. With NextJS, we spend more time writing features
    and less time struggling with Webpack.

    * **Data fetching**: Rendering content in different ways, depending on the app''s
    use case. This includes both pre-rendering or static site generation.

    * **Middleware**: This enables you to run code before a request is completed.
    You can redirect the user from one route to another.

    * **Data security**: `Next.js` does not freeze the browser to download a whole
    lot of JavaScript at once; it has the potential to dramatically improve metrics
    such as total blocking time (`TBT`). It measures the amount of time blocked by
    the scripts before the user can interact, and it should ideally be below 300 ms.
    The better your `TBT`, the quicker your Web app becomes useful for your users.
    That, in turn, makes it more probable to convert them into customers. Waiting
    for a page to interact is a significant turn-off, which might increase your bounce
    rate. That is another SEO-relevant factor.


    ## Cons of using Next.js


    The following are some of the cons of using `Next.js`:


    * **Development and management**: If you want to use `NextJS` to build an online
    store, yet you do not have an in-house team of developers, you will need a dedicated
    person to handle the development.

    * **Routing problems**: Since a file-based router limits what `Next.js` can do
    in routing through nodes, you will have to use the `Node.js` server if your project
    requires dynamic routes.

    * **No state manager**: No built-in state manager is available in the framework
    `Next.js`. To get the most out of one, you will need another tool to do it.

    * **Limited building time**: The time it takes to build websites and apps is restricted.
    Adding new pages to a website or app is no problem for `Next.js`. However, the
    static creation of the entire website means that the build time can be extremely
    long for apps with many pages.


    ## Pre-rendering in Next.js


    `Next.js` pre-renders every page. This means that HTML for each page is generated
    in advance, instead of it all being done by the client-side. There are two types
    of Pre-rendering, namely:


    * Static generation

    * Server-side rendering


    ### Static generation

