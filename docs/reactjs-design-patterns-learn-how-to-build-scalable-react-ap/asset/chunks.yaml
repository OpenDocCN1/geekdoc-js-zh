  trans: "\nHTML 在构建时生成，并在每次请求时被重用。要创建一个页面，请使用静态生成（Static Generation），可以通过导出页面组件或导出\
    \ `getStaticProps`（如有必要，导出 `getStaticPaths`）。它非常适合可以在用户请求之前进行预渲染的页面。你也可以将其与客户端渲染配合使用以引入额外数据。我们将生成静态内容的方法，如下：\n\
    \n* 不带数据的静态页面\n* 带有数据的静态页面\n\n## 不带数据的静态页面\n\nNext.js 预渲染这些页面，而无需从任何源或后端获取数据。让我们通过示例来看一下：\n\
    \n```javascript\nfunction Contact(){\n  return <div>Contact</div>\n}\n\nexport\
    \ default Contact\n```\n\n上述示例没有从后端或任何源获取任何数据。\n\n## 带有数据的静态页面 \n\n某些页面需要获取外部数据以进行预渲染。这可以通过两种方式实现：\n\
    \n* 内容依赖外部数据\n* 路径依赖外部数据\n\n### 内容依赖外部数据\n\n你的页面可能需要从来自外部源的 API 获取数据。让我们来看一个这样的示例：\n\
    \n```javascript\nfunction UserList({ users }) {\n  return (\n    <ul>\n      {users.map((user)\
    \ => (\n          <li>{user.firstname}</li>\n          <li>{user.lastname}</li>\n\
    \      ))}\n    </ul>\n  )\n}\nexport default UserList\n```\n\n上述示例在预渲染时获取了这些数据。让我们通过以下代码来看\
    \ `getStaticProps` 是如何工作的：\n\n```javascript\nfunction UserList({ users }) {\n\
    \  return (\n    <ul>{users.map((user) => (\n        <li>{user.firstname}</li>\n\
    \        <li>{user.lastname}li))}\n    </ul>)\n  }\n}\nexport async function getStaticProps()\
    \ {\n  const res = await fetch('https://…/users')\n  const users = await res.json()\n\
    \  return {\n    props: {\n      users,\n    },\n  }\n}\nexport default UserList\n\
    ```\n\n### 路径依赖数据\n\n例如，创建一个名为 `users/[id].js` 的 `.js` 文件，根据其 `id` 显示单个用户详情。我们需要从\
    \ `users/[id].js` 文件中导出一个名为 `getStaticPaths` 的 `async` 函数。让我们通过示例来看一下：\n\n```javascript\n\
    function UserList({ users }) {\n  return (\n    <ul>{users.map((user) => (\n \
    \       <li>{user.firstname}</li>\n        <li>{user.lastname}li))}\n    </ul>>)\n\
    \  )\n}\nexport async function getStaticPaths() {\n  const response = await fetch('https://…/users')\n\
    \  const users = await response.json()\n  const paths = users.map((user) => ({\n\
    \    params: { id: user.id },\n  }))\n  return { paths, fallback: false }\n}\n\
    export async function getStaticProps({ params }) {\n  const response = await fetch(`https://…/\
    \ users/${params.id}`)\n  const users = await response.json()\n  return { props:\
    \ { users } }\n}\nexport default UserList\n```\n\n### GetServerSideProps\n\nHTML\
    \ 是通过导出名为 `getServerSideProps` 的 `async` 函数在每次请求时生成的。让我们通过示例来看它是如何工作的：\n\n```javascript\n\
    function UserList({ users }) {\n  return (\n    <ul>{users.map((user) => (\n \
    \       <li>{user.firstname}</li>\n        <li>{user.lastname}li))}\n    </ul>>)\n\
    \  )\n}\nexport async function getServerSideProps() {\n  const res = await fetch(`https://…/users`)\n\
    \  const data = await res.json()\n  return { props: { data } }\n}\nexport default\
    \ UserList\n```\n\n## Next.js 与 React.js\n\nNext.js 和 React.js 在构建应用程序时都是非常好的工具。现在我们将在从以下几个方面对两者进行比较：\n\
    \n* 可维护性\n* TypeScript\n* 配置\n* 服务端渲染\n* 图片优化\n\n| React App | Next.js |\n| :---\
    \ | :--- |\n| CRA 是有主张的。 | NextJs 也维护得良好。 |\n| 使用 `npx create-react-app my-app\
    \ --template` 从零开始添加 typescript。 | 从 `tsconfig.json` 开始配置 typescript。 |\n| 像 Web\
    \ pack 等配置无法更改。 | 几乎一切都是可配置的。 |\n| CRA 原生不支持 SSR。 | NextJs 有不同类型的 SSR。它原生支持 SSR。\
    \ |\n| CRA 在图片优化方面提供的有限。 | Next.js 有一个名为 `next/image` 的内置图片组件。 |\n\n### 使用 Node.js\
    \ 和 Express.js 进行服务端渲染\n\n使用 Node.js 和 Express.js 进行服务端渲染是从服务器端渲染 react 页面的另一种方式。`express.js`\
    \ 创建了一个路由，我们可以根据用户的路由使用它请求指定的页面。你可以在以下链接中找到更多详情：[`www.digitalocean.com/community/tutorials/react-server-side-rendering`](https://www.digitalocean.com/community/tutorials/react-server-side-rendering)\n\
    \n## 结论\n\n我们成功地了解什么是服务端渲染以及何时使用它。我们还通过示例查看了 Next.js 及其优缺点。我们最后通过查看创建 react app\
    \ 和 Next.js 之间的一些差异结束。\n\n在接下来的章节中，我们将介绍数据获取。\n\n# 第 7 章：数据获取\n\n### 引言\n\n在本章中，我们将介绍如何在我们的应用程序中获取数据。我们还将查看用于远程向应用程序获取数据的不同类型库/API。我们还将查看\
    \ REST API 和 GraphQL 的区别，以及如何缓存获取的数据并在应用程序中使用。我们还将查看 Promise、它们的优势以及它们在我们的 应用程序中解决的问题。\n\
    \n### 结构\n\n* 在 React 中从服务器获取数据\n* Rest API 对比 GraphQL\n* 从 API 缓存数据并在应用\n* Promise\n\
    \n### 目标\n\n在本章中，我们将学习如何使用不同的 JavaScript API/库从服务器获取数据。我们将查看 Rest API 和 GraphQL\
    \ 的区别，并结合详细示例在应用程序中缓存数据。我们还将使用 Promise 来解析获取的数据。\n\n### 在 React 中获取数据\n\n在大多数\
    \ React 应用程序中，可能需要来自 API 或服务器的数据。我们向服务器提交数据以接收某种响应。有多种方法可以获取这些数据到 API 或服务器，我们可以通过内置\
    \ API 或外部 `npm` 包来实现。以下是其中一些，我们将通过示例来看：\n\n* Fetch\n* Axios\n\n### Fetch\n\n这是\
    \ JavaScript 和 React 应用程序中常用的 API。Fetch 提供了 Request 和 Response 对象（以及与网络请求相关的其他内容）的通用定义。这允许它们用于未来需要的地方，无论是在\
    \ Service Worker、Cache API 以及其他处理或修改请求和响应的类似事物，还是任何可能需要通过编程生成响应的用例（即使用计算机程序或个人编程指令）。\n\
    \n"
- fmt: "\nThe `fetch()` method takes one mandatory argument, the path to the resource\
    \ you want to fetch. It returns a Promise that resolves the response to that request.\
    \ Let us look at this `fetch` in action with examples.\n\nWe are going to use\
    \ [https://jsonplaceholder.typicode.com](https://jsonplaceholder.typicode.com)\
    \ as our API for this example:\n\n```javascript\nimport React,{useState,useEffect}\
    \ from 'react'\nexport default function App() {\n  const [postsArr,setPostsArr]=useState([]);\n\
    \  const baseUrl='https://jsonplaceholder.typicode.com';\n  useEffect(()=>{\n\
    \    const fetchPosts=async()=>{\n      return fetch(`${baseUrl}/posts`).then(res=>res.json()).then(response=>{\n\
    \          setPostsArr(response);\n        })\n    };\n    fetchPosts();\n  },[])\n\
    \  return (\n    <div className=\"App\">\n      {\n        postsArr.map(post=>{\n\
    \          return <ul key={post.id}>\n            <li>{post.title}</li>\n    \
    \        </ul>\n        })\n      }\n    </div>\n  );\n}\n```\n\nThe preceding\
    \ code shows how to fetch all data from [https://jsonplaceholder.typicode.com/posts](https://jsonplaceholder.typicode.com/posts)\
    \ and displays it inside our React application using `fetch`. The `fetch` takes\
    \ in the URL and path to the resource and pulls the data from the server.\n\n\
    Let us look at how this data is rendered in a browser.\n\n![](images/Figure-7.1.jpg)\n\
    \n**Figure 7.1:** Shows Post list rendered in our application\n\nSo, what if we\
    \ want to fetch a single Post from our Post API? We can do this with the following\
    \ code:\n\n```javascript\nimport React,{useState,useEffect} from 'react'\nexport\
    \ default function App() {\n  const [post,setPost]=useState({});\n  const baseUrl='https://jsonplaceholder.typicode.com';\n\
    \  useEffect(()=>{\n    const fetchPosts=async()=>{\n      return fetch(`${baseUrl}/posts/1`).then(res=>res.json()).then(response=>{\n\
    \          setPost(response);\n        })\n    };\n    fetchPosts();\n  },[])\n\
    \  return (\n    <div className=\"App\">\n      <p>Title: {post.title}</p>\n \
    \     <p>Body: {post.body}</p>\n    </div>\n  );\n}\n```\n\n![](images/Figure-7.2.jpg)\n\
    \n**Figure 7.2:** Shows a single Post rendered in our application.\n\nLet us see\
    \ in the following code how we can add a new post:\n\n```javascript\nimport React,{useEffect}\
    \ from 'react'\nexport default function App() {\n  const baseUrl='https://jsonplaceholder.typicode.com';\n\
    \  useEffect(()=>{\n    const postBody=JSON.stringify({\n      title:\"This is\
    \ a test\",\n      body:\"quia et suscipit\\nsuscipit recusandae\"\n    })\n \
    \   const addPosts=async()=>{\n      return fetch(`${baseUrl}/posts`,{\n     \
    \   method:'POST',\n        body:postBody\n      }).then(response=>{\n       \
    \   console.log(response)\n        })\n    };\n    addPosts();\n  },[])\n  return\
    \ (\n    <div className=\"App\">\n    </div>\n  );\n}\n```\n\n# Axios\n\n`Axios`\
    \ is a promise-based Client for node.js and the browser. It is isomorphic (it\
    \ can run in the browser and nodejs with the same codebase). On the server-side,\
    \ it uses the native node.js HTTP module, whereas on the client (browser), it\
    \ uses `XMLHttpRequest`.\n\nLet us see how we can use `Axios` to fetch data from\
    \ [https://jsonplaceholder.typicode.com](https://jsonplaceholder.typicode.com).\n\
    \nBefore we use the `Axios`, run the following command:\n\n`npm install axios`\n\
    \nor\n\n`yarn add axios`\n\n```javascript\nimport React,{useEffect,useState} from\
    \ 'react';\nimport axios from 'axios';\nconst baseUrl='https://jsonplaceholder.typicode.com'\n\
    export default function App() {\n  const [postList,setPostList]=useState([]);\n\
    \  useEffect(()=>{\n    const getAllPosts=async()=>{\n      return axios.get(`${baseUrl}/posts`).then(response=>{\n\
    \          setPostList(response.data)\n        })\n    };\n    getAllPosts()\n\
    \  },[])\n  return (\n    <div className=\"App\">\n      {\n        postList.map(item=>{\n\
    \          return <ul><li>{item.title}</li></ul>\n        })\n      }\n    </div>\n\
    \  );\n}\n```\n\nThe preceding code shows how to fetch all data from [https://jsonplaceholder.typicode.com/posts](https://jsonplaceholder.typicode.com/posts)\
    \ and displays it inside our React application using `Axios`. The `fetch` takes\
    \ in the URL and path to the resource and pulls the data from the server.\n\n\
    Let us look at how this data is rendered in a browser.\n\n![](images/Figure-7.3.jpg)\n\
    \n**Figure 7.3:** Shows all Post rendered in our application.\n\nTo fetch a single\
    \ Post from our Post API, we can use the following code:\n\n```javascript\nimport\
    \ React, { useEffect, useState } from \"react\";\nimport axios from \"axios\"\
    ;\nconst baseUrl = \"https://jsonplaceholder.typicode.com\";\nexport default function\
    \ App() {\n  const [post, setPost] = useState({});\n  useEffect(() => {\n    const\
    \ getAllPosts = async () => {\n      return axios.get(`${baseUrl}/posts/1`).then((response)\
    \ => {\n          setPost(response.data);\n        });\n    };\n    getAllPosts();\n\
    \  }, []);\n  return (\n    <div className=\"App\">\n      <p>Title: {post.title}</p>\n\
    \      <p>Body: {post.body}</p>\n    </div>\n  );\n}\n```\n"
