    # [Naming conventions](#toc.xhtml_s19a)


    This is very important because it gives meaning to the application. It makes the
    application to be easily understood even before looking at the logic. When the
    naming of variables, functions, methods, and file/folder are done properly, tracing
    problems in the application is simple since one is aware of what each variable
    or function is doing. I usually suggest keeping this in mind when naming your
    application.


    # [Rendering with useMemo and useCallBack](#toc.xhtml_s20a)


    The **`useMemo`** and **`useCallback`** are very effective performance hooks methods
    when using react hooks. The **`useMemo`** is used to cache a computed calculation
    and returns its value. This calculation is not done every time on render. It is
    a hook that takes in two parameters, namely, the fat arrow function and the dependency
    array. The dependency array is optional, but if a parameter is passed, it is only
    when the parameter changes that the function will run again, and the resulting
    value is returned. This is the same with **`useCallBack`**, but the main difference
    is that **`useMemo`** returns the memorized value while **`useCallBack`** returns
    the memorized function. Let us look at the following example to help us understand
    the work of these two hooks and why they are so important in building scalable
    and fast applications.


    We would start with the **`useMemo`**. Let us look at the following code:


    1.  `import React,{useMemo} from "react";`


    3.  `const App = (props) => {`


    5.  `const value=useMemo(()=>{`


    6.  `return 123;`


    7.  `},[])`


    9.  `  return (`


    10.  `    <section>`


    11.  `     {value}`


    12.  `    </section>`


    13.  `  );`


    14.  `};`


    16.  `export default App;`


    Line number 5 will always return the value **`123`** no matter how many times
    the component re-renders. This is because the dependency array has not changed
    and so react does not need to recompute the value again.


    Let us look at what **`useCallBack`** will do:


    `1\.` `import React,{useCallback} from ''react'';`


    `2.`


    `3\.` `const App=()=>{`


    `4.   const [count, setCount] = useState(0)`


    `5.`


    `6.   const increaseCount=useCallback(()=>{`


    `7.     setCount(count+1)`


    `8.   },[])`


    `9.`


    `10\.` `}`


    `11.`


    `12\.` `return (`


    `13.   <button onClick={increaseCount}>Set Increase</button>`


    `14\.` `)`


    `15.`


    `16\.` `export default App;`


    # [Use Prettier](#toc.xhtml_s21a)


    Prettier is an open source that enforces code consistency. It makes your code
    look neat and readable. It enforces the rules that have been set by you.


    # [Use Linter and its rules](#toc.xhtml_s22a)


    Linter helps you organize your code, especially your import hierarchy. Linter
    reminds you of some JavaScript errors. Having Linter and its rules in your application
    can make your life easy.


    # [Use try…catch](#toc.xhtml_s23a)


    No matter how perfect our application is, there are bound to be errors. Errors
    can be from an API or even from a user input, which we did not see coming or even
    thought of during testing. This is why it is important to always wrap your logic
    or API calls with try and catch so that it can catch unexpected errors.


    # [Log errors](#toc.xhtml_s24a)


    In as much as we catch errors, we also need to log them. Logging these errors
    can tell us what exactly happened during the lifecycle of an operation within
    the application. We can log this error to a file or create a service where these
    errors are pushed to an API or even to a database. This is essential and is typically
    one of the first points of call when things go wrong in an application on production.
    It can save the day.


    # [React error boundary](#toc.xhtml_s25a)


    There are times in our application when we have some error in the UI, and the
    page will just show a white screen; this can be solved by using React error boundary.
    React error boundary helps to catch application errors and show a friendly message
    or screen to the user. The friendly error message or screen is usually a fallback
    component. Let us refer to the following example:


    1.  `class ErrorBoundary extends React.Component {`


    2.  `  constructor(props) {`


    3.  `    super(props);`


    4.  `    this.state = { hasError: false };`


    5.  `  }`


    7.  `  static getDerivedStateFromError(error) {`


    8.  `    return { hasError: true };`


    9.  `  }`


    11.  `  componentDidCatch(error, errorInfo) {`


    12.  `    errorService.log({ error, errorInfo });`


    13.  `  }`


    15.  `  render() {`


    16.  `    if (this.state.hasError) {`


    17.  `      return <p>Oops, something went wrong.</p>;`


    18.  `    }`


    19.  `    return this.props.children;`


    20.  `  }`


    This will return to Line 17 if Line 16 condition is true.


    **This will not catch asynchronous errors that occur from API calls because they
    are not inside the error boundary. To catch such asynchronous errors, we should
    add the** **`try`** **and** **`catch`** **block.**


    # [Test your code](#toc.xhtml_s26a)


    Most developers do not like writing tests for their applications (me included),
    but as time went by, I started indulging in writing unit tests and integration
    tests. This is very important because as the application grows, it will become
    very important to implement so as to avoid issues. Tests solidify the code and
    give you the assurance that your function and logic are working as expected.


    This is also important because you can implement the edge cases that come to your
    mind and test it without many hitches as against you running the application and
    passing parameters from your screen to test. This saves a lot of time and gives
    some level of assurance that your code is production ready and also reduces the
    likely bugs from the testers.


    # [Component name must be in Pascal case](#toc.xhtml_s27a)


    React component naming convention is usually in Pascal case. This starts with
    a capital letter, and failing to do so will result in the component not rendering.
    As you can see from all our examples so far, we named our component **`App`**.
    Notice that the naming convention started with a capital letter.


    # Do not do this


    1.  `import React from ''react'';`


    3.  `const app=()=>{`


    6.  `return (`


    7.  `    <p>This is just a test</p>`


    8.  `)`


    10.  `export default app;`


    # Rather do this


    1.  `import React from ''react'';`


    3.  `const App=()=>{`


    6.  `return (`


    7.  `    <p>This is just a test</p>`


    8.  `)`


    10.  `export default App;`


    # [Extract reusable logic](#toc.xhtml_s28a)


    This is very important in react applications because it solves unnecessary repetition.
    The logic that will be used across the application can be extracted to a component
    and used at any given point in time. This is another form of **do not repeat yourself**
    (**DRY**) technique. This will save you from many lines of code and also make
    you isolate bugs because this is only one source of truth, which is your reusable
    component/logic.


    # [Benefits of using JavaScript in React application](#toc.xhtml_s29a)


    React is a library that uses JavaScript. We are going to look at the advantages/benefits
    of using JavaScript in our react application.'
