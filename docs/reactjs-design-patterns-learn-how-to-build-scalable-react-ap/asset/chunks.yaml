    \ registration component:\n\n```css\n.register{\n  display:flex;\n  flex-direction:column;\n\
    \  gap:10px;\n}\n```\n\nThe preceding code is CSS for our registration component\
    \ that follows:\n\n```javascript\nimport React from 'react';\nimport \"./styles.css\"\
    ;\nexport default function Register() {\n  return (\n    <div>\n      <form className=\"\
    register\">\n        <label htmlFor=\"firstName\">FirstName:</label>\n       \
    \ <input id=\"firstName\" type=\"text\" placeholder=\"firstName\"/>\n        <label\
    \ htmlFor=\"lastName\">LastName:</label>\n        <input id=\"lastName\" type=\"\
    text\" placeholder=\"lastName\"/>\n        <label htmlFor=\"username\">Username:</label>\n\
    \        <input id=\"username\" type=\"text\" placeholder=\"username\"/>\n   \
    \     <label htmlFor=\"password\">Password:</label>\n        <input id=\"password\"\
    \ type=\"password\" placeholder=\"password\"/>\n        <input type=\"submit\"\
    \ value=\"Sign Up\"/>\n      </form>\n    </div>\n  )\n}\n```\n\nThe preceding\
    \ code component is for `Register`. This component does one thing alone, which\
    \ is handle user registration. This is how our registration component will look\
    \ as follows on rendering:\n\n![](images/Figure-8.5.jpg)\n\n**Figure 8.5:** Our\
    \ Register component\n\nSo, for us to use these components in our projects, we\
    \ should import them into the place we want to use them as against writing inside\
    \ the same file. Let us look at what I mean by this:\n\n```javascript\nimport\
    \ React, { useState } from \"react\";\nimport Login from \"./Login\";\nimport\
    \ SignUp from \"./SignUp\";\nimport \"./styles.css\";\nconst App = () => {\n \
    \ const [activePath, setActivePath] = useState(\"login\");\n  const onNav=(e)=>{\n\
    \    setActivePath(e);\n  }\n  return (\n    <div>\n      <div className=\"nav\"\
    >\n        <button onClick={()=>onNav(\"login\")}>Login</button>\n        <button\
    \ onClick={()=>onNav(\"Register\")}> Register</button>\n      </div>\n      <div\
    \ className=\"login\">\n        {activePath === \"login\" && <Login/>}\n     \
    \   {activePath !== \"login\" && <SignUp />}\n      </div>\n    </div>\n  );\n\
    };\nexport default App;\n```\n\n![](images/Figure-8.6.jpg)\n\n**Figure 8.6:**\
    \ Our component, when rendered the first time\n\nThis is how our application would\
    \ look on render and will look like as shown as follows when the Register button\
    \ is clicked:\n\n![](images/Figure-8.7.jpg)\n\n**Figure 8.7:** Component when\
    \ the register button is clicked\n\nSo let us make a call to our API to login\
    \ or register users with different paths instead of calling the API on individual\
    \ files. Let us see this with the following example:\n\n```javascript\nconst baseUrl\
    \ = \"http://api.com\";\nconst httpJsonResponse = (response) => {\n  if (!response.ok)\
    \ {\n    return Promise.reject(response.statusText);\n  }\n  return Promise.resolve(response.json());\n\
    };\nexport Post = (path,data) => {\n  return fetch(`${baseUrl}/path`,JSON.stringify(data))\n\
    \    .then(httpJsonResponse)\n    .then((response) => {\n      return response;\n\
    \    });\n};\n```\n\nSo, the preceding code has a `Post` method, which will be\
    \ used to post data from our app to our API from everywhere in the app as against\
    \ calling the API from every component in our app. So, we can import this into\
    \ our `Login` or `Register` components and pass the required parameters to it.\
    \ Let us look at this in action for login:\n\n```javascript\nimport {useState}\
    \ from 'react';\nimport {Post} from './api';\nimport \"./styles.css\";\nexport\
    \ default function Login() {\n  const [username, setUsername]=useState('');\n\
    \  const [password, setPassword]=useState('');\n  const onSubmit= async(event)=>{\n\
    \    event.preventDefault();\n    const data={\n      username,\n      password\n\
    \    };\n    const login= await Post(`login`,data)\n      .then(response=>response.json())\n\
    \      .then(data=>{\n        if(data){\n        }\n      })\n  }\n  return (\n\
    \    <div>\n      <form className=\"login\" onSubmit={onSubmit}>\n        <label\
    \ htmlFor=\"username\">Username:</label>\n        <input id=\"username\"onChange={(e)=>\
    \ setUsername(e.target.value)} type=\"text\" placeholder=\"username\"/>\n    \
    \    <label htmlFor=\"password\">Password:</label>\n        <input id=\"password\"\
    onChange={(e)=>setPassword(e.target.value)} type=\"password\" placeholder=\"password\"\
    />\n        <input type=\"submit\" value=\"Login\"/>\n      </form>\n    </div>\n\
    \  )\n}\n```\n\nThe preceding code explains that `onSubmit` of the form details,\
    \ the API `Post` method is called because we have already exported this from our\
    \ API file, and the path and the data is passed as an argument, which will return\
    \ a promise.\n\n# Higher order component\n\nA higher order component is a function\
    \ that takes in a component and returns a new component. Let us look at an example\
    \ of how this HOC works:\n\n```javascript\nimport React from 'react'\nconst higherOrderComponent\
    \ = Component => {\n  function HOC =()=> {\n    return <Component />\n  }\n  return\
    \ HOC\n}\n```\n\nIn the preceding example, `higherOrderComponent` is a function\
    \ that takes `Component` as an argument. We have created a new component `HOC`\
    \ which returns the `<Component/>`.\n\nWe can invoke the `HOC` as follows:\n\n\
    `const HOC = higherOrderComponent(MyComponent);`\n\n# Solid principles\n\nSolid\
    \ principles are object design principles that were written by Robert Martin in\
    \ 2000. Solid is an acronym for the following:\n\n- **Single Responsibility Principle**\
    \ (`SRP`)\n- **Open/Closed Principle** (`OCP`)\n- **Liskov Substitution Principle**\
    \ (`LSP`)\n- **Interface Segregation Principle** (`ISP`)\n- **Dependency Inversion\
    \ Principle** (`DIP`)\n\nThese principles were designed for objects, but they\
    \ can be used in other languages, such as JavaScript. Let us see how SOLID can\
    \ be used in React.:\n\n- **Single Responsibility Principle (SRP)**: This principle\
    \ implies that every component should do one thing. When designing your react\
    \ application, keep this principle in mind because it will make your code more\
    \ readable and maintainable.\n- **Open/Closed Principle (OCP)**: This principle\
    \ says that your code should be extendable without having to break or rewrite\
    \ a module.\n- **Liskov Substitution Principle (LSP)**: This principle states\
    \ that every subclass should be a substitute for its base class. This simply means\
    \ that if we have a class called Make and it extends to another class called Car,\
    \ we should be able to extend the class Make without touching the functionality\
    \ of the Car class.\n- **Interface Segregation Principle (ISP)**: This principle\
    \ states that one should only use interfaces that they need. In React, this can\
    \ be said to be props. Props is very vital in every React application. These props,\
    \ when passed down from parent to child components, one should only pass down\
    \ what they need as against everything in the props. We can achieve this by destructuring\
    \ our props.\n- **Dependency Inversion Principle (DIP)**: This principle states\
    \ that we should hide code implementation and just interact with them by abstraction.\n\
    \n# Conclusion\n"
