- fmt: "\nTypescript is a superset of JavaScript. TypeScript helps to build scalable\
    \ applications because it is strongly typed. TypeScript compiles to JavaScript\
    \ at runtime with the help of Babel. We have used some typescript examples in\
    \ this book so far, but we would look at the concepts and things to note when\
    \ building applications with typescript.\n\n# Conclusion\n\nWe have looked at\
    \ the different ways to achieve clean and maintainable code. In the upcoming chapter,\
    \ we will look at React hooks and their benefits. We will also look at how we\
    \ can use custom hooks to build our applications.\n\n# CHAPTER 4\n\n# React Hooks\n\
    \n## Introduction\n\nThis chapter will cover what React hooks are, and we will\
    \ look at the most common hooks used in React. We will also look at how to write\
    \ custom hooks and their benefits when building applications. We will see how\
    \ hooks and custom hooks can be combined in a single application.\n\n## Structure\n\
    \nThe following topics are to be covered:\n\n*   React hooks\n*   Custom hooks\n\
    \n## Objectives\n\nIn this chapter, we will learn how to write custom hooks and\
    \ use inbuilt hooks in React. We would look at an example project to learn more\
    \ about hooks.\n\n## React hooks\n\nReact hooks are lifecycle methods used in\
    \ functional components. React hooks were introduced in React 16.8. The lifecycle\
    \ methods, which were in-class components, were collapsed into React hooks. React\
    \ hooks will NOT work inside the class component. Some of these inbuilt React\
    \ hooks include the following:\n\n*   `useState`\n*   `useReducer`\n*   `useEffect`\n\
    *   `useLayoutEffect`\n*   `useMemo`\n*   `useCallback`\n*   `useRef`\n*   `useContext`\n\
    \nThere are some rules to follow when using React hooks. We will look at a few\
    \ of them:\n\n*   Hooks can only be called from a functional component.\n*   Hooks\
    \ must be called from the top level, not from within loops, conditional statements,\
    \ and so on.\n*   You can create your own hooks, but you must follow the rules\
    \ one and two.\n\n## useState\n\nThe `useState` method is one of the commonly\
    \ used React hooks. This hook is classified under the controlled component in\
    \ React. The `useState` method sets an initial value, which is updated as the\
    \ user performs an operation. Let us use an example to explain this:\n\n```\n\
    import React,{useState} from 'react'\n\nconst MyApp=()=>{\n  const [counter,setCounter]=useState(0);\n\
    \  return (\n    <>\n      <p>Current count is {counter}</p>\n      <button onClick={()=>setCounter(counter+1)}>\
    \ increase counter </button>\n      <button onClick={()=>setCounter(counter-1)}>\
    \ decrease counter</button>\n    </>\n  )\n};\n\nexport default MyApp;\n```\n\n\
    The preceding example is a simple counter application. The application has two\
    \ buttons that increase and decrease the counter value. We imported the `useState`\
    \ hook on line one from React library. We then declared the counter state and\
    \ set its initial value to 0 on line 5. So on the click of either of the buttons,\
    \ we call the `setCounter` and pass the current counter to it so we can increase\
    \ or decrease the current counter value by `1`. The value of the counter will\
    \ be displayed on line 9.\n\n## useReducer\n\nThe `useReducer` method is one of\
    \ the commonly used React hooks. This hook is used when you have a complex changing\
    \ state in your application. This is like `useState`, but you dispatch actions\
    \ to update the state. Let us use an example to explain this:\n\n```\nimport React,{useReducer,}\
    \ from 'react'\n\nconst MyApp=()=>{\n  const initialState={counter:0}\n  const\
    \ appReducer=(state, action)=>{\n    switch(action.type){\n        case 'increase':\n\
    \          return {counter:state.counter ++};\n        case 'decrease':\n    \
    \      return {counter:state.counter --};\n        default:\n          return\
    \ {counter:state.counter};\n      }\n  }\n  const [state, dispatch] = useReducer(appReducer,\
    \ initialState);\n  return (\n    <>\n      <p>Current count is {counter}</p>\n\
    \      <button onClick={()=>dispatch({type:'increase'})}> increase counter </button>\n\
    \      <button onClick={()=>dispatch({type:'decrease'})}> decrease counter</button>\n\
    \    </>\n  )\n};\n```\n\nThe preceding example is a simple counter application.\
    \ The application has two buttons that increase and decrease the counter value.\
    \ We imported the `useState` hook on line one from React library. We then declared\
    \ the counter state and set its initial value to 0 on line 5. The `useReducer`\
    \ method uses `appReducer` and `initialState` to manage state.\n\n## useEffect\n\
    \nThe `useEffect` method is one of the commonly used React hooks. This hook is\
    \ used for side effects. The `useEffect` method can take two arguments: a callback\
    \ function and a dependency array.\n\nHere is an example:\n\n```\nimport React,{useEffect,useState}\
    \ from 'react'\n\nconst MyApp=()=>{\n  const [data,setData]=useState([]);\n  useEffect(()=>{\n\
    \    const fetchData=async()=>{\n      return fetch('https://jsonplaceholder.typicode.com/todos')\n\
    \        .then(response => response.json())\n        .then(json => setData(json))\n\
    \    }\n    fetchData();\n  },[])\n  return (\n    <ul>\n      {data.length >0\
    \ && data.map(item=>{\n        <li key={item.id}>{item.title}</li>\n      })}\n\
    \    </ul>\n  )\n}\n\nexport default MyApp;\n```\n"
