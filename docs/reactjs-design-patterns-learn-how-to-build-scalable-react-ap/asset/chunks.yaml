    \n# 结论\n\n在本章中，我们研究了什么是 React hooks、它们的优势及其规则。我们学习了如何编写自定义 hooks，这在提取逻辑方面非常有帮助。在接下来的章节中，我们将介绍样式以及如何正确为\
    \ React 设置样式。\n\n# 第 5 章 样式\n\n# 引言\n\n本章将介绍如何为 React 组件设置样式。这包括像 Scss 和 Less\
    \ 等预处理器。我们还将介绍 styled-components 和内联样式。\n\n# 结构\n\n将涵盖以下主题：\n* 为组件设置样式\n* 样式类型（内联样式、预处理器（Sass\
    \ 和 Less）、CSS 和 styled-components）\n* 不同样式方案的优缺点\n* 编写样式的规范\n\n# 目标\n\n在本章中，我们将学习如何为组件设置样式以及不同的样式类型。我们还将查看不同类型样式的优缺点。最后通过查看一些编写样式的规范来结束。\n\
    \n# 为组件设置样式\n\n样式在每个 Web 应用程序中都非常重要，因为样式让它对用户具有吸引力，并给用户提供良好的体验。在 React 中实现这一点的方法有很多。我们将介绍一些常用的\
    \ React 组件样式方法，为用户提供极佳的视觉效果。\n\n# 样式类型\n\n因此，在 React 以及一般的网站或 Web 应用程序中，有不同的应用程序样式。我们将查看其中一些：\n\
    * 内联 CSS\n* 外部/引用 CSS\n* Sass\n* Bootstrap\n* Styled components\n\n# 内联 CSS\n\n\
    内联 CSS 是设置网站或 Web 应用程序样式的方法之一。它涉及直接在 HTML 元素上编写你的样式。我们将通过以下示例来研究：\n\n```javascript\n\
    export default function App() {\n  return (\n    <div>\n      <p style={{color:'green',fontSize:'30px'}}>欢迎</p>\n\
    \    </div>\n  )\n}\n```\n\n前面的示例向我们展示了一个内联样式的典型例子。我们通过将文本的 `color` 设置为 `green`并将大小增大\
    \ `30px` 来对段落设置样式。这有一些优缺点，我们将在后讨论。让我们看看下面的代码以及它在浏览器中的外观：\n\n![](img/Figure-5.1.jpg)\n\
    \n**图 5.1：** 内联样式演示\n\n### 优点\n* 易编写。\n* 浏览器加载和应用样式速度更快。\n\n### 缺点\n* 样式会重复。\n\
    \n# 外部 CSS\n\n外部 CSS 是设置网站或 Web 应用程序样式的方法之一。它涉及在文件中通过类和 ID 编写所有的样式，并在我们的应用程序或组件内部引用它。我们将通过以下示例来研究：\n\
    \n```css\n.container{\n  display:flex;\n  justify-content:center;\n}\n.header{\n\
    \  color:green;\n  font-size:50px;\n}\n```\n\n在这里，我们在单独的文件中声明了样式并将其命名为 `App.css`。我们添加了一个名为\
    \ `header` 的类，并为其编写了 `color` 和 `font-size`。我们还声明了一个 `container` 类，并使用 flexbox\
    \ 用于 `display` 属性。我们希望 `center` 容器的内容。让我们看看如何在后续应用程序中使用前面的文件：\n\n```javascript\n\
    import './App.css'\nexport default function App() {\n  return (\n    <div className=\"\
    container\">\n      <p className=\"header\">欢迎</p>\n    </div>\n  )\n}\n```\n\n\
    我们引入了 `App.css` 文件，它包含了我们的 CSS 类。我们在第 1 行引入它，并在第 5 行和第 6 行使用 `className` 参数应用它。让我们看看代码在浏览器中的效果：\n\
    \n![](img/Figure-5.2.jpg)\n\n**图 5.2：** 外部样式演示\n\n### 优点\n* 易编写。\n* 通过抽象到文件中保持组件整洁。\n\
    * 样式不会重复，可以在多处应用。\n\n### 缺点\n* 加载慢，因为浏览器必须先下载文件。\n\n# Sass\n\nSass（Synthetically\
    \ Awesome Style Sheet）是一种预处理器。CSS 是 React 应用程序样式的方法之一。它的扩展名为 `.scss`。它有一些强大的功能，例如：\n\
    * 混合（Mixins）\n* 继承\n* 嵌套\n\n我们将通过示例研究如何在 React 应用程序中使用 sass。要开始使用 sass，请运行以下命令：\n\
    \n`npm install sass`\n\n或\n\n`yarn add sass`\n\n"
