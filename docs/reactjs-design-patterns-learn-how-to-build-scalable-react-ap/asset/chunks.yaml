    \n    6.  `color:#fff;`\n\n    7.  `` `; ``\n\n    8.  `const App = () => {`\n\
    \n    9.  `return <Container>This is just a test</ Container>;`\n\n    10.  `};`\n\
    \n    12.  `export default App;`\n\n# [Preprocessor (SASS/LESS)](#toc.xhtml_s17a)"
