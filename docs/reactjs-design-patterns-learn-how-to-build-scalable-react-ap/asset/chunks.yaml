    ```javascript\nimport React from \"react\";\nimport \"./styles.css\";\n\nclass\
    \ App extends React.Component{\n  constructor(props){\n    super(props);\n   \
    \ this.state = {\n      message: \"This is a test message\"\n    };\n  }\n  componentDidMount()\
