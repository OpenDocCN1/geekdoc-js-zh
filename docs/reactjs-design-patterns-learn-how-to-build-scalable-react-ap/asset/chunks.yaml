    \ more.\n```\n\n我们将从 WhatsApp 改回 LinkedIn，现在没了。\n\n## 使用 Cypress 进行端到端测试\n\n对于端到端测试，`Cypress`\
    \ 在其他框架/库中领先。要使用 Cypress，请在你的 React 应用中运行以下命令：\n\n`npm install --save-dev cypress`\n\
    \n`npx cypress`\n\n完成后，在你的 `package.json` 文件的 scripts 部分添加以下代码：\n\n`\"e2e-test\"\
    : \"cypress open\"`\n\n然后在终端中运行 `npm run e2e-test` 并等待。一个新窗口将打开，显示你可以使用的预配置测试。要了解更多关于\
    \ Cypress 的信息，请访问 `https://docs.cypress.io/guides/component-testing/quickstart-react`。\n\
    \n# 使用 Jest 进行集成测试\n\n在大多数 React 应用中，我们与外部 API 集成。可以使用 `Jest` 测试 API 的行为以查看预期和意外的结果。让我们看一个简单的示例：\n\
    \n```javascript\ntest('it should be greater than length 0', async () => {\n  const\
    \ data = await fetch('https://jsonplaceholder.typicode.com/posts').then(response\
    \ => response.json()).then(data => {\n    return data\n  })\n  expect(data.length).toBeGreaterThan(0)\n\
    })\n```\n\n前面的代码只是检查我们的 posts API 是否返回了我们预期的数据，并检查长度以确保它大于 0。让我们运行 `npm test`\
    \ 并查看以下结果：\n\n```\nPASS  src/__tests__/API.js\n  ✓ it should be greater than length\
    \ 0 (258 ms)\nTest Suites: 1 passed, 1 total\nTests:       1 passed, 1 total\n\
    Snapshots:   0 total\nTime:         8.77 s\nRan all test suites matching /API/i.\n\
    ```\n\n"
