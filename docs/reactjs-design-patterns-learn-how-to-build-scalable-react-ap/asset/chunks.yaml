    \ are as follows:\n\n* `useMemo`\n* `useCallback`\n\n# useMemo\n\nIf you want\
    \ to memoize a value in React.js, use `useMemo` because it caches the computed\
    \ value and returns it when needed. Let us see how this works in React.\n\n```javascript\n\
    import {useMemo} from 'react'\nimport \"./styles.css\";\nconst numbersArr=[1,2,3,4,5,6];\n\
    export default function App() {\n  let sum=useMemo(() =>\n      return numbersArr.reduce((curr,acc)=>curr+acc,0)\n\
    \  },[])\n  return (\n    <div className=\"App\">\n      {sum}\n    </div>\n \
    \ )\n}\n```\n\nThe preceding code is a demonstration of `useMemo`. Here, we do\
    \ a summation of `numbersArr` and memorize its value in line 7. The result of\
