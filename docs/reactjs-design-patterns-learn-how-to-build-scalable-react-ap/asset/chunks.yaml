    # [React Anti-Patterns and Best Practices](#toc.xhtml_c01)


    # [Introduction](#toc.xhtml_s1a)


    This chapter will cover different patterns in writing React applications. Yes,
    react is opinionated, although it gives you the liberty to build and structure
    your applications according to your taste or which fits your organization. However,
    there are some very bad practices that are not good and can have an effect on
    your application as your application begins to grow.


    This chapter will identify common bad practices out there and suggest better practices
    to help build scalable React applications. We will be using JavaScript and TypeScript
    for this chapter. This seems to be redundant since TypeScript was not used in
    any example illustrated and React is built on JavaScript.


    # [Structure](#toc.xhtml_s2a)


    The following topics are to be covered in this chapter:


    *   What bad practices/ways in architecting a react application?


    *   Best practices in architecting react applications?


    *   Benefits of using TypeScript in React applications


    # [Objectives](#toc.xhtml_s3a)


    The objective of this chapter is to look at the different ways of building a react
    application and determine the good from the bad. It will also give us an insight
    into the benefits of JavaScript and TypeScript in react applications.


    # [Bad practices in building a React application](#toc.xhtml_s4a)


    React is an opinionated library created by Facebook to help build applications
    with components. Yes, being opinionated gives one the liberty to design it how
    he or she wishes. The application can be structured however you want and will
    still function. We will look at some of the bad practices that we sometimes engage
    in when using React but are not aware of.


    # [Inline CSS](#toc.xhtml_s5a)


    Inline styles or inline CSS is simply styling your component or page from within
    the component code. Inline CSS means defining the CSS properties using a style
    attribute with an HTML tag or adding the styles directly to the element. That
    string will contain CSS property value pairs; each property will be separated
    from the other by a semicolon.


    Let us take a look at an example that follows:


    1.  `import React from ''react''`


    3.  `const App=()=>{`


    5.  `return (`


    6.  `<p style={{color: ''red''}}>This is just a test application </p>`


    7.  `);`


    8.  `};`


    10.  `export default App`


    In the preceding example, we changed the default color of the paragraph tag from
    black to red. This is a simple example with relatively less hassle because it
    involves simply changing the paragraph color. It is easy to implement—a line of
    code and the color of the paragraph changes from black to red.


    But what if we want this red color to be applied to all paragraphs in the component?
    Let us see what happens when we have multiple paragraphs. Refer to the code that
    follows:


    1.  `import React from ''react''`


    3.  `const App=()=>{`


    6.  `return (`


    7.  `<p style={{color: ''red''}}>This is just a test application </p>`


    8.  `<p style={{color:''red''}}>This is just a test application 2 </p>`


    9.  `);`


    10.  `};`


    12.  `export default App`


    Although the previous words, it is not recommended for the following reasons that
    it should be used because of the following reasons.


    *   It cannot be reused.


    *   It makes the code unreadable when overused.


    *   It hampers the performance; on each re-rendering, the style object will be
    recomputed.


    # [Large component](#toc.xhtml_s6a)


    React is a library that is used to build large applications using reusable components.
    These components are the building blocks of the application. Often in our applications,
    we tend to write components that do everything from logic to display rendering.
    This can make the component too long and unreadable. When a component is unreadable,
    debugging and fixes become almost impossible.


