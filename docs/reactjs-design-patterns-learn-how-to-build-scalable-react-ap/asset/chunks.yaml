  trans: "\n\n```javascript\n        isComponentVisible && <ComponentOne/>\n     \
    \ }\n      {\n        !isComponentVisible && <ComponentTwo/>\n      }\n    </div>\n\
    \  );\n}\n```\n\n前面的代码将只显示 `Component Two`，因为第 11 行没有满足第一个条件。第 15 行将显示，因为第 7 行的默认值为\
    \ false。\n\n让我们看看在浏览器中看起来应该是什么样：\n\n![](img/Figure-8.2.jpg)\n\n**图 8.2：** 显示逻辑操作后的组件\n\
    \n# if else 操作\n\nif else 操作在 JavaScript 中常用于条件操作。它通过 `if…else` 语法表示。它基本上是测试第一个条件是否满足，如果是，则运行后面的代码。让我们看看如何在\
    \ React 组件中如下所示使用这个 `&&` 逻辑运算符：\n\n```javascript\nimport React from 'react';\n\
    const ComponentOne=()=>\n  return (\n    <div>\n      Component One\n    </div>\n\
    \  )\n};\nexport default ComponentOne\n```\n\n前面的代码显示了一个组件，它渲染了一个 `div`，其内部文本为\
    \ `ComponentOne`：\n\n```javascript\nimport React from 'react';\nconst ComponentTwo=()=>\n\
    \  return (\n    <div>\n      Component Two\n    </div>\n  )\n};\nexport default\
    \ ComponentTwo\n```\n\n前面的代码显示了一个组件，它渲染了一个 `div`，其内部文本为 `ComponentTwo`。\n\n```javascript\n\
    import {useState} from 'react'\nimport ComponentOne from \"./ComponentOne\";\n\
    import ComponentTwo from \"./ComponentTwo\";\nimport \"./styles.css\";\nexport\
    \ default function App() {\n  const [isComponentVisible, setIsComponentVisible]=useState(false);\n\
    \  let component;\n  if(isComponentVisible){\n    component=<ComponentOne/>\n\
    \  }\n  else{\n    component=<ComponentTwo/>\n  }\n  return (\n    <div className=\"\
    App\">\n      {component}\n    </div>\n  );\n}\n```\n\n前面的代码第 9 行测试了 `isComponentVisible`\
    \ 是否为真值，如果是，它将 `componentOne` 赋值给第 8 行声明的组件；如果不是，它将 `componentTwo` 赋值给第 8 行声明的组件值。让我们看看这在浏览器中看起来应该是什么样：\n\
    \n![](img/Figure-8.3.jpg)\n\n**图 8.3：** 条件满足后显示组件二\n\n# 记忆化 (Memoization)\n\n\
    记忆化是编程中防止操作不必要的计算的方法。它有助于让应用程序更快，因为它有助于将计算结果缓存在内存中并在并在时显示相同的结果，而不是每次都重新计算。在 React\
    \ 中，有两种主要的实现方法，如下：\n\n* `useMemo`\n* `useCallback`\n\n# useMemo\n\n如果你想在 React.js\
    \ 中对值进行记忆化，请使用 `useMemo`，因为它缓存了计算值并在需要时返回它。让我们看看它在 React 中是如何工作的。\n\n```javascript\n\
    import {useMemo} from 'react'\nimport \"./styles.css\";\nconst numbersArr=[1,2,3,4,5,6];\n\
    export default function App() {\n  let sum=useMemo(() =>\n      return numbersArr.reduce((curr,acc)=>curr+acc,0)\n\
    \  },[])\n  return (\n    <div className=\"App\">\n      {sum}\n    </div>\n \
    \ )\n}\n```\n\n前面的代码是 `useMemo` 的演示。在这里，我们对 `numbersArr` 进行求和并在第 7 行对其值进行记忆。我们的计算结果为\
    \ `21`，显示在第 13 行。\n\n# useCallback\n\n如果你想在 React.js 中对函数进行记忆化，请使用 `useCallback`，因为它缓存了计算后的函数并在需要时返回它。让我们看看它在\
    \ React 中是如何工作的。\n\n```javascript\nimport {useCallback} from 'react'\nimport \"\
    ./styles.css\";\nconst numbersArr=[1,2,3,4,5,4,5];\nexport default function App()\
    \ {\n  const callBackFunction=useCallback(()=>numbersArr.reduce((currentVal,accum)=>currentVal+accum,0),[])\n\
    \  return (\n    <div className=\"App\">\n      <h1>{callBackFunction()}</h1>\n\
    \    </div>\n  )\n}\n```\n\n前面的代码是 `useCallback` 的演示。在这里，我们对 `numbersArr` 进行求并在第\
    \ 7 行对其函数进行记忆。我们的计算结果为 `29`，显示在第 10 行。\n\n# TypeScript\n\nTypeScript 是 JavaScript\
    \ 的超集。TypeScript 有助于构建可扩展的应用程序，因为它是强类型的。TypeScript 在 Babel 的帮助下运行时编译为 JavaScript。到目前为止我们已经使用了一些\
    \ TypeScript 示例，但我们将查看使用 TypeScript 构建应用程序时的概念和注意事项。创建一个 React 应用程序，我们使用以下命令：\n\
    \n`npx create-react-app myapp --template typescript`\n\n在这里，`myapp` 是我们的应用程序名称。命名应用时禁止使用任何大写字母。TypeScript\
    \ 具有一些可以让你的应用程序可扩展的优势，包括：\n\n* 它的强类型特性减少了错误\n* 数据类型容易定义\n\n# 文件组织\n\n是的，我们知道 React\
    \ 是一个有倾向的库，它让你有机会按照喜欢的方式设计它，但如果你想获得一个良好的应用程序，最好遵循关于如何命名和组织应用程序文件和文件夹的一些最佳实践。我们将查看一些组织应用程序文件夹和文件的建议方法。\n\
    \n* `Components`：正如名称所示，你需要将所有组件放在此文件夹中。该文件夹将包含 JSX 文件、CSS 文件和类型（如果你使用 TypeScript）。\n\
    * `Assets`：资源存放媒体文件，如图片、某些 CSS（如果你喜欢）、视频等。\n* `Helpers`：辅助函数文件夹用于存放通用复用函数。这些函数在应用程序任何需要的地方调用。\n\
    * `Constants`：常量文件夹用于存放不会更改的内容。\n* `API`：文件夹用于存放对 API 的调用及其函数。\n* `Hooks`：Hooks\
    \ 文件夹用于存放自定义 Hooks。\n\n# 关注点分离 (Separation of concerns)\n\n软件中的关注点分离是通过不同的模块构建应用程序，每个模块只做一件事或处理一个关注点。这会让你的应用程序更加健壮且可扩展。假设我们的应用程序有两个组件，即\
    \ `Login`、`Register` 以及一个要调用的 API。我们希望这两个组件分离，以便它们能够独立运行并完成创建的目标，即通过调用 API 进行登录和注册用户。这有助于我们的应用程序实现松耦合：\n\
    \n```css\n.login{\n  display:flex;\n  flex-direction:column;\n  gap:20px;\n}\n\
    ```\n\n前面的代码是我们登录组件的 CSS，如下：\n\n```javascript\nimport React from 'react';\nimport\
    \ \"./styles.css\";\nexport default function Login() {\n  return (\n    <div>\n\
    \      <form className=\"login\">\n        <label htmlFor=\"username\">Username:</label>\n\
    \        <input id=\"username\" type=\"text\" placeholder=\"username\"/>\n   \
    \     <label htmlFor=\"password\">Password:</label>\n        <input id=\"password\"\
    \ type=\"password\" placeholder=\"password\"/>\n        <input type=\"submit\"\
    \ value=\"Login\"/>\n      </form>\n    </div>\n  )\n}\n```\n\n"
