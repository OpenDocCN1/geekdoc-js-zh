  trans: "\n记忆化（Memoizing），简单来说，意味着记忆或存储在内存中。被记忆化的函数通常更快，因为如果后续使用之前的值再次调用该函数，我们无需执行该函数，而是从缓存中获取结果。\n\
    \n在 React 中，我们可以通过以下两种方式实现记忆化：\n\n* `useMemo`\n* `useCallBack`\n\n# useMemo\n\n\
    React 有一个名为 `useMemo` 的内置 hook，允许你对开销较大的函数进行记忆化，从而避免在每次渲染时都调用它们。你只需要传递一个函数和一个输入数组，当其中一个输入发生时，`useMemo`\
    \ 才会重新计算记忆化的值。让我们通过以下示例来看 `useMemo`：\n\n```javascript\nimport React,{useMemo}\
    \ from 'react'\nconst values = [3, 9, 6, 4, 2, 1];\nconst MyApp=()=>{\n  const\
    \ result=useMemo(()=>{\n    return values.sort().join(',')\n  },[])\n  return\
    \ (\n    <p>{result}</p>\n  )\n}\nexport default MyApp;\n```\n\n上述代码将在第 9 行返回\
    \ 1, 2, 3, 4, 6 和 9 作为结果，因为数据已经计算过了，在第 2 行 values 数组改变之前，不会重新计算。\n\n# useCallback\n\
    \nReact 有一个名为 `useCallBack` 的内置 hook，允许你对开销较大的函数进行记忆化，从而避免在每次渲染时都调用它们。你只需要传递一个函数和一个输入数组，当其中一个输入发生时，`useCallback`\
    \ 才会重新计算记忆化的函数。让我们通过以下示例来看 `useCallBack`：\n\n```javascript\nimport React,{useCallback}\
    \ from 'react'\nconst values = [3, 9, 6, 4, 2, 1];\nconst MyApp=()=>{\n  const\
    \ callBackResult=useCallback(()=>{\n    return values.sort().join(',')\n  },[])\n\
    \  return (\n    <p>{callBackResult()}</p>\n  )\n}\nexport default MyApp;\n```\n\
    \n上述代码将在第 11 行返回 2 作为结果，因为数据已经计算过了，在第 2 行 values 数组改变之前，不会重新计算。\n\n# 状态管理（State\
    \ management）\n\n状态管理是另一种在 React 中缓存数据并使用数据的方法。从 API 缓存的数据可以存储在我们的状态管理中并在应用程序中全局使用。虽然数据被缓存了，但在刷新页面时，它将会丢失，你需要重新获取。此外，你也可以获取数据并将其存储在\
    \ React 应用状态中。\n\n# Promises\n\nPromise 用于处理 JavaScript 中的异步调用。它们在管理多个异步调用方面非常有效，异步调用会导致回调地狱。当异步调用发生时，返回的\
    \ promise 是一个对象，它可以处于以下四种状态：\n\n* Fulfilled（已完成）：表示异步调用成功\n* Rejected（已拒绝）：表示异步调用发生错误\n\
    * Pending（进行中）：既未完成也未被拒绝\n* Settled（已定案）：表示已完成或已拒绝。\n\n# 结论\n\n在本章中，我们学习了 React\
    \ 中的数据获取以及我们可以用于从 API 或资源获取数据的不同库。我们还查看了 GraphQL 和 Rest API 之间的区别。我们还查看了缓存数据并在应用程序中使用它，最后通过查看\
    \ promises 完成了总结。\n\n在接下来的章节中，我们将学习如何在 React 中构建可扩展的应用程序。\n\n# 第 8 章：构建可扩展的应用程序\n\
    \n# 引言\n\n本章将涵盖在 React 中构建可扩展和高性能应用程序的方法。我们将探讨在 React 中构建此类应用程序的一些最佳实践、概念和优势。\n\
    \n# 结构\n\n以下是将涵盖的主题：\n\n* 条件渲染\n* 记忆化\n* Typescript\n* 文件组织结构\n* 关注点分离（Separation\
    \ of concerns）\n* 高阶组件（Higher order components）\n* Solid 原则\n\n# 目标\n\n在本章中，我们将学习如何在\
    \ React 中实现可扩展和高性能的应用程序。我们将学习如何组织文件结构及其优势。我们还将查看条件渲染以及实现这种渲染的方法。此外，我们还会查看 TypeScript\
    \ 和关注点分离。最后，我们将查看 HOC 和 solid 原则。\n\n# 条件渲染（Conditional rendering）\n\n在构建 React\
    \ 应用程序时，总会有你不希望在某些 props 或值改变或满足某个条件之外重新渲染组件的情况；这被称为条件渲染。让我们看看 React 中实现条件渲染的方法：\n\
    \n* 三元运算符\n* AND 逻辑操作（与逻辑）\n* If else 操作\n\n# 三元运算符（Ternary operation）\n\n三元运算符常用于\
    \ JavaScript 条件操作。它由一个问号 `?` 表示，后跟第一个条件，然后是冒号 `:` 后跟下一个条件。它基本上是测试第一个条件是否满足，如果是，则忽略第二个条件，反之亦然。让我们来看以下内容。它展示了我们如何在\
    \ React 组件中使用此三元运算符：\n\n```javascript\nimport React from 'react';\nconst ComponentOne=()=>{\n\
    \  return (\n    <div>\n      Component One\n    </div>\n  )\n}\nexport default\
    \ ComponentOne;\n```\n\n上述代码返回一个包含 `ComponentOne` 文本的 `div`。\n\n```javascript\n\
    import React from 'react';\nconst ComponentTwo=()=>{\n  return (\n    <div>\n\
    \      Component Two\n    </div>\n  )\n}\nexport default ComponentTwo;\n```\n\n\
    ```javascript\nimport {useState} from 'react';\nimport ComponentOne from \"./ComponentOne\"\
    ;\nimport ComponentTwo from \"./ComponentTwo\";\nimport \"./styles.css\";\n\n\
    export default function App() {\n  const [isComponentVisible, setIsComponentVisible]=useState(false);\n\
    \  return (\n    <div className=\"App\">\n      {isComponentVisible?ComponentOne\
    \ : ComponentTwo}\n    </div>\n  );\n}\n```\n\n上述代码将仅显示 `Component Two`，因为第 11\
    \ 行的条件不满足。让我们看看这在浏览器中看起来是什么样：\n\n/images-8.1\n\n# 逻辑操作（Logical operation）\n\n\
    AND 逻辑运算符常用于 JavaScript 条件操作。它由双 `&&` 表示。它基本上是测试第一个条件是否满足，如果是，则执行后面的代码。让我们通过以下方式查看如何在\
    \ React 组件中使用此 `&&` 运算符：\n\n```javascript\nimport React from 'react';\nconst ComponentOne=()=>{\n\
    \  return (\n    <div>\n      Component One\n    </div>\n  )\n}\nexport default\
    \ ComponentOne;\n```\n\n上述代码返回一个 `div`。\n\n"
