    # [Next.js versus React.js](#toc.xhtml_s112a)


    Both Next.js and React.js are very good to use when building applications. We
    are now going to compare both in the following ways:


    *   Maintainability


    *   TypeScript


    *   Configuration


    *   Server-side rendering


    *   Image optimization


    # [Maintainability](#toc.xhtml_s113a)


    | **React App** | **Next.js** |


    | CRA is opinionated. | NextJs is also well maintained. |


    # [TypeScript support](#toc.xhtml_s114a)


    | **React App** | **Next.js** |


    | `npx create-react-app my-app --template` typescript is used to add typescript
    from scratch with the app. | Start with configurations for typescript with touch
    `tsconfig.json` |


    # [Configuration](#toc.xhtml_s115a)


    | **React App** | **Next.js** |


    | Configurations like Web pack config cannot be changed. | Almost everything is
    configurable. |


    # [Server-side rendering](#toc.xhtml_s116a)


    | **React App** | **Next.js** |


    | CRA does not support SSR out of the box. | NextJs has different types of SSR.
    It supports SSR out of the box. |


    # [Image optimization](#toc.xhtml_s117a)


    | **React App** | **Next.js** |


    | CRA does not have much to offer in image optimization. | Next.js has a built-in
    image component called next/image. |


    # [Server-side rendering with Node.js and Express.js.](#toc.xhtml_s118a)


    Server-side rendering with Node.js and Express.js is another way to render react
    pages from the server side. The express.js creates a route that we can use to
    request specified pages based on the route from the user. You can find more details
    in the following link:


    **[https://www.digitalocean.com/community/tutorials/react-server-side-rendering](https://www.digitalocean.com/community/tutorials/react-server-side-rendering)**


    # [Conclusion](#toc.xhtml_s119a)


    We have successfully looked at what server-side rendering is and when to use it.
    We also looked at Next.js and its pros and cons with detailed examples. We concluded
    by looking at some of the differences between creating react app and Next.js.


    In the upcoming chapter, we will look at data fetching.


    # [CHAPTER 7](#toc.xhtml_c07)


    # [Data Fetching](#toc.xhtml_c07)


    # [Introduction](#toc.xhtml_s120a)


    In this chapter, we will look at how to fetch data in our React application. We
    will also look at the different types of libraries/APIs we can use to fetch data
    remotely into our application. We will also look at the difference between REST
    API and GraphQL and how to cache the fetched data and use it in our application.
    We will also look at promises, their benefits, and what it solves in our react
    application.


    # [Structure](#toc.xhtml_s121a)


    The following topics are to be covered:


    *   Ways to fetch data from a server in React


    *   Rest API versus GraphQl


    *   Caching data from API and use in your application


    *   Promises


    # [Objectives](#toc.xhtml_s122a)


    In this chapter, we will learn how to use the different JavaScript APIs/libraries
    to fetch data from a server. We will look at the difference between Rest API and
    GraphQL also caching data in our application with detailed examples. We will also
    use promises to resolve fetched data in our application.


    # [Fetching data in React](#toc.xhtml_s123a)


    In most React applications, data from an API or server is likely needed for that
    application to work. We submit data from our application to the server to receive
    some sort of response. There are several ways to fetch/send this data to the API
    or server, and we can do this by inbuilt API or external **`npm`** packages. The
    following are some of them, and we will look at them with the aid of an example:


    *   Fetch


    *   Axios


    # [Fetch](#toc.xhtml_s124a)


    This is a commonly used API in JavaScript and React applications. Fetch provides
    a generic definition of Request and Response objects (and other things involved
    with network requests). This will allow them to be used wherever they are needed
    in the future, whether it is for service workers, Cache API, and other similar
    things that handle or modify requests and responses or any kind of use case that
    might require you to generate your responses programmatically (that is, the use
    of computer program or personal programming instructions).'
