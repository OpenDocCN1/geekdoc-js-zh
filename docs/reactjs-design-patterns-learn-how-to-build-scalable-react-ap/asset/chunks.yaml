  raw: "    The preceding example makes a whole lot of sense because we can see what\
    \ the developer is trying to do here. He is simply declaring descriptive values\
    \ **`firstName`** and **`lastName`** and assigning the values **`Anthony`** and\
    \ **`Okonta`** to them, respectively.\n\n*   **All functions must do one thing**:\
    \ We all write functions in our applications to help us out. These functions can\
    \ do a variety of things depending on our goals, but keep in mind that each function\
    \ should only do one thing. Assume you want a function that converts all words\
    \ to capital letters and then sends the result to an API endpoint. Most of the\
    \ time, we return the capitalized result and pass the parameters to the end point\
    \ within the same function. Let us take a look at the following example to see\
    \ what we are talking about.\n\n    1.  `capitalizeWords('anthony')`\n\n    3.\
    \  `function capitalizeWords(word){`\n\n    4.  `  const convertedWord=word.toUpperCase();`\n\
    \n    6.  `  sendConvertedWord(convertedWord)`\n\n    7.  `}`\n\n    9.  `async\
    \ function sendConvertedWord(convertedWord){`\n\n    10.  `  return await fetch('api.com',{`\n\
    \n    11.  `    method:'POST',`\n\n    12.  `    headers:{`\n\n    13.  `      accept:'application/json'`\n\
    \n    14.  `    },`\n\n    15.  `    body:(JSON.stringify({`\n\n    16.  `      word:convertedWord`\n\
    \n    17.  `    }))`\n\n    18.  `  })`\n\n    19.  `}`\n\n    The preceding code\
    \ shows two functions (**`capitalizeWords`** and **`sendConvertedWord`**), which\
    \ does two different things. The preceding **`capitalizeWords`** accepts an argument\
    \ called word and capitalizes the word and then calls the **`sendConvertedWord`**\
    \ API and passes the parameter to it on line 6\\. This will work but will have\
    \ issues because the function is not doing just one thing, which is to convert\
    \ the passed in word to capital letters. Let us look at the following correct\
    \ one.\n\n    1.  `const capitalizedWord=capitalizeWords('anthony');`\n\n    2.\
    \  `if(capitalizedWord)`\n\n    3.  `{`\n\n    4.  `  sendConvertedWord(capitalizedWord)`\n\
    \n    5.  `}`\n\n    7.  `function capitalizeWords(word){`\n\n    8.  `  if(typeof\
    \ word ==='string'){`\n\n    9.  `    return word.toUpperCase();`\n\n    10. \
    \ `  }`\n\n    11.  `  else{`\n\n    12.  `    return null;`\n\n    13.  `  }`\n\
    \n    15.  `}`\n\n    17.  `async function saveWord(convertedWord){`\n\n    18.\
    \  `  return await fetch('api.com',{`\n\n    19.  `    method:'POST',`\n\n   \
    \ 20.  `    headers:{`\n\n    21.  `      accept:'application/json'`\n\n    22.\
    \  `    },`\n\n    23.  `    body:(JSON.stringify({`\n\n    24.  `      word:convertedWord`\n\
    \n    25.  `    }))`\n\n    26.  `  })`\n\n    27.  `}`\n\n    You can see from\
    \ the preceding code that we successfully made the **`capitalizeWords`** function\
    \ do just one thing, which is capitalize words and return them to the caller on\
    \ line 1. We then send the returned params to the **`sendConvertedWord`** function\
    \ in line 7.\n\n    Please note that this is a dummy API used in this example.\n\
    \n*   **Keep functions short and precise**: Keeping functions short and precise\
    \ is one way to achieve clean code. When your functions become so large, it becomes\
    \ difficult to read. Try to keep them very short, at most 50–60 lines.\n\n*  \
    \ Give descriptive branch names when branching from master: The majority of our\
    \ code will be pushed to an online repository (GitHub, Bitbucket, and so on) because\
    \ it will undoubtedly be the source of truth, allowing us to have **Continuous\
    \ Integration** (**CI**) and **Continuous Delivery** (**CD**). We would create\
    \ a branch from the master to develop a new feature or fix a bug. Assume we are\
    \ asked to fix an infinite loop bug in production. We should execute the following\
    \ command:\n\n    `git checkout -b fix/infinite_loop_fixes.`\n\n    The preceding\
    \ command will create a branch called **`fix/infinite_loop_fixes`**. This will\
    \ give the PR reviewer an idea of what is going on. Or you can name it like this:\n\
    \n    `git checkout -b fix/ticket_number_infinite_loop_fixes.`\n\n    The **`ticket_number`**\
    \ is the number that the ticket of the fixes was logged.\n\n*   **Give descriptive\
    \ titles when committing your code to a repository**: When committing codes for\
    \ **Pull Requests** (**PR**), it is very important to give good titles/descriptions\
    \ as the message. This is necessary because it gives the reviewer and others a\
    \ sense of what you did inside the code. Let us look at two examples to buttress\
    \ this point. We would look at one commit that has to do with refactoring the\
    \ **`capitalizeWords`** function:\n\n    `git commit -m 'refactoring'`\n\n   \
    \ `git push`\n\n    `git commit -m 'refactoring the capitalizewords function'`\n\
    \n    `git push`\n\n    The first commit code just says refactoring. The refactoring\
    \ is vague and does not provide a detailed account of what was done inside the\
    \ code.\n\n    The second commit code refactoring the **`capitalizewords`** function\
    \ shows us a detailed message pointing to the fact that it was just the **`capitalizewords`**\
    \ function that was changed inside the code. This gives the reviewer a sense of\
    \ what happened and what he is looking out for inside the code as he reviews it.\n\
    \n*   **Write unit tests**: Most developers hate writing unit tests. It can be\
    \ annoying sometimes but it is very important to write tests for your code. Testing\
    \ your code will give you an idea of what kind of errors and scenarios to expect\
    \ and how to avoid them. However, unit tests are mostly functional tests and do\
    \ not go as far as testing the user interface. There are tools you can use to\
    \ test your React application. Examples of such tools includes React testing library,\
    \ Jest, and so on.\n\n# [Writing maintainable code](#toc.xhtml_s65a)\n\nWriting\
    \ code is important but writing maintainable code is very important to any organization\
    \ or company. As a developer, it is not just to write the code that should work\
    \ but write code that can be easily fixed from bugs, if any, maintained and supported.\
    \ We would look at a few practices which help us achieve a maintainable code base.\n\
    \n*   Design patterns\n\n*   Writing testable codes\n\n*   Checking for errors\n\
    \n*   Log errors for easy bug tracking and fixes\n\nLet us now have a brief discussion\
    \ about each of the preceding ways mentioned to achieve a maintainable code base.\n\
    \n# [Design patterns](#toc.xhtml_s66a)\n\nDesign patterns are solutions to software\
    \ design problems. Design patterns give a defined way/pattern of building applications.\
    \ Having design patterns is very important if you want to have a code base that\
    \ can easily be supported and maintained. We have so many design patterns, but\
    \ we would just list some of them here:\n\n*   Repository pattern\n\n*   Singleton\
    \ pattern\n\n*   Domain-driven design pattern\n\nThese design patterns have their\
    \ unique ways of solving software design problems. They are unique in their own\
    \ ways. This will help in making the code maintainable; there is a given pattern\
    \ everyone must follow.\n\n# [Writing testable codes](#toc.xhtml_s67a)\n\nIt is\
    \ important to understand that writing code is beyond its working; it should also\
    \ be easy to test. When writing a code, please make sure you keep in mind that\
    \ you should write codes that are testable. This is important because when the\
    \ codes are testable, it is easy to find and resolve issues.\n\n# [Checking for\
    \ errors](#toc.xhtml_s68a)\n\nIn every application you write, there are bound\
    \ to be errors in it. Errors are inevitable, and that is why you, as a developer,\
    \ need to check for them. It is important to note that wrapping your codes around\
    \ with try and catch can help check for these errors and display friendly messages\
    \ to the user and log these errors to a file or save them into a database.\n\n\
    # [Log errors for easy bug tracking and fixes](#toc.xhtml_s69a)\n\nLogging errors\
    \ is very important when building an application because it will give an idea\
    \ of what happened during the runtime of the application. These logs are then\
    \ taken and analyzed as the first point of contact in troubleshooting.\n\n# [Using\
    \ TypeScript to build applications](#toc.xhtml_s70a)"
