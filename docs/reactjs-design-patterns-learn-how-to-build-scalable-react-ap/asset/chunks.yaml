  trans: "\n在本章中，我们学习了在 React 中实现条件重新渲染的不同方法。我们还研究了记忆化（memoization）及其优势。我们查看了 TypeScript\
    \ 及其优势。我们还讨论了文件组织，并以关注点分离和高阶组件（HOCs）作为结束。\n\n在接下来的章节中，我们将学习测试。\n\n# 第 9 章：测试\n\
    \n## 引言\n本章将涵盖 React 组件的测试。在本章中，我们将使用 Jest 和 Cypress。在这里我们将我们将功能测试、集成测试和端到端测试。\n\
    \n## 结构\n将涵盖以下主题：\n* 如何测试组件？\n* 使用 Jest 和 React testing library 测试应用程序\n* 如何进行回归测试？\n\
    * 如何使用 Cypress 进行端到端（e2e）测试？\n* 如何使用 Jest 进行集成测试？\n\n## 目标\n在本章中，我们将学习使用 Cypress、Jest\
    \ 和 React 测试库测试 React 组件。我们还将学习如何使用 Jest 模拟 API 以及如何使用 Jest 进行回归测试。我们还会学习使用 Cypress\
    \ 进行端到端测试。\n\n## 如何测试组件？\n测试在每个 Web 应用程序中都非常重要。即使在 React 中，测试也非常重要，特别是在其组件上。实现这一点有两种方法，包括以下：\n\
    * 功能测试\n* 渲染测试\n\n### 功能测试\n功能测试是为了验证功能是否按预期方式运行而进行的测试。这种测试通常根据被测试函数的预期结果进行断言。\n\
    \n### 渲染测试\n渲染测试是为了验证您的组件是否正确渲染而进行的测试。\n\n## 使用 Jest 进行测试\nJest 是测试 React 应用程序时非常流行的测试库。Jest\
    \ 主要用于功能测试，但我们也可以将其用于渲染测试。让我们看看如何使用 Jest 测试组件中的某些函数。\n\n因此，我们将创建一个简单的应用程序来演示如何使用\
    \ Jest。让我们启动应用程序。请使用以下命令：\n\n```bash\nnpx create-react-app testing-with-jest\n\
    ```\n\n我们的应用程序正在创建中：\n\n![](img/Figure-9.1.jpg)\n**图 9.1:** 创建我们的 react 应用程序\n\
    \n太棒了，我们的应用程序准备好了！\n\n![](img/Figure-9.2.jpg)\n**图 9.2:** 应用程序已安装\n\n在我们开始之前，请在\
    \ `testing-with-jest` 项目中运行以下命令安装 Jest 包：\n\n```bash\nnpm install –save—dev jest\
    \ or yarn add --dev jest\n```\n\n现在，我们已经安装了 Jest 包，可以开始测试了。组织测试文件有多种方法，但对于此项目，我们将它们放在创建的\
    \ `__test__` 文件夹中：\n\n![](img/Figure-9.3.jpg)\n**图 9.3:** 添加测试的文件结构\n\n在创建此文件后，我们现在可以将测试文件放入文件夹中了。测试文件通常以\
