    # [File/folder structure](#toc.xhtml_s18a)


    Most of the time, we are unsure of how to set up our folder and file structure
    to best serve the application we are developing. Yes, react is opinionated, but
    one thing we should keep in mind is that file/folder structure is important because
    it gives a sense of direction on where to put/find some things for your application.


    This is up to you but always have in mind the other person who will take over
