  trans: "\n\n对于那些需要创建自定义序列化器的人，我们建议从 `JSONAPISerializer` 或 `JSONSerializer` 开始，然后扩展其中之一以匹配我们的需求。然而，如果有效负载（payload）与其中一个序列化器不同，请考虑你给定的下所示“posts”模型的情况：\n\
    \n```javascript\nexport default DS.Model.extend({\n  title: DS.attr('string'),\n\
    \  tag: DS.attr('string'),\n  comments: hasMany('comment', { async: false }),\n\
    \  relatedPosts: hasMany('blogs')\n});\n```\n\n此时 `store.push` 将接受如下格式的对象：\n\n\
    ```json\n{\n  data: {\n    id: \"1\",\n    type: 'post',\n    attributes: {\n\
    \      title: \"Ember is easy to Learn\",\n      tag: \"ember\",\n    },\n   \
    \ relationships: {\n      comments: {\n        data: [{ id: \"1\", type: 'comment'\
    \ },\n                { id: \"2\", type: 'comment' }],\n      },\n      relatedPosts:\
    \ {\n        data: {\n          related: \"/api/v1/blogs/1/related-posts/\"\n\
    \        }\n      }\n    }\n}\n```\n\n为了让每个序列化的记录都能转换为 Ember 数据记录，必须遵循上述格式。\n\n\
    # 第 3 章 - 应用关注点\n\n## 依赖注入\n\n该技术在 EmberJS 中用于对象类的声明、实例化以及它们之间的依赖关系。应用程序及其实例将在\
    \ Ember 的依赖注入（DI）实现中发挥作用。\n\n## 工厂注册 (Factory Registrations)\n\n工厂可以用于表示应用的一部分，例如模板、路由或自定义类。一个很好的例子是使用键名“template:index”注册的索引模板。\n\
    \n注意，工厂注册必须在应用程序内部或应用实例初始化器（application instance initializers）中完成，但前者更为常见。\n\n\
    考虑下文的示例，它展示了应用初始化如何使用键名“logger:main”注册一个“logger”工厂：\n\n```javascript\nexport function\
    \ initialize(app) {\n  var Logger = Ember.Object.extend({\n    log(n) {\n    \
    \  console.log(n);\n    }\n  });\n  app.register('logger:main', Logger);\n}\n\n\
    export default {\n  name: 'logger',\n  initialize: initialize\n};\n```\n\n## 实例化对象的注册\
    \ (Registering Instantiated Objects)\n\n默认设置是 Ember 会在查找后尝试实例化已注册的工厂。在特定类对象的注册过程中，你必须使用\
    \ `instantiate: false` 选项，以避免在查找期间被重复实例化。在下面的示例中，`logger` 是一个 JavaScript 对象，在查找时应原样返回。代码如下：\n\
    \n```javascript\nexport function initialize(app) {\n  var logger = {\n    log(n)\
    \ {\n      console.log(n);\n    }\n  };\n  app.register('logger:main', logger,\
    \ { instantiate: false });\n}\n\nexport default {\n  name: 'logger',\n  initialize:\
    \ initialize\n};\n```\n\n## 单例与非单例注册 (Singletons vs. Non-Singletons Registration)\n\
    \n在 Ember data 中，注册被视为单例。这意味着在查找后必须创建一个实例，并且同一个实例将被缓存并在随后的查找中返回。在下例示例中，`message`\
    \ 将注册为非单例：\n\n```javascript\nexport function initialize(app) {\n  var Msge = Ember.Object.extend({\n\
    \    text: ''\n  });\n  app.register('notification:message', Msge, { singleton:\
    \ false });\n}\n\nexport default {\n  name: 'notification',\n  initialize: initialize\n\
    };\n```\n\n## 工厂注入 (Factory Injections)\n\n一旦完成工厂注册，我们可以在需要时对其注入。工厂注入可以针对整个类型的工厂进行。考虑下例示例：\n\
    \n```javascript\nexport function initialize(app) {\n  var Logger = Ember.Object.extend({\n\
    \    log(n) {\n      console.log(n);\n    }\n  });\n  app.register('logger:main',\
    \ Logger);\n  app.inject('route', 'logger', 'logger:main');\n}\n\nexport default\
    \ {\n  name: 'logger',\n  initialize: initialize\n};\n```\n\n由于这种类型注入，类型为 `route`\
    \ 的工厂将使用已注入的 `logger` 进行实例化。`logger` 值将从名为 `logger:main` 的工厂中获取。考虑下例，展示了如何通过注入的\
    \ logger 访问应用。示例如下：\n\n```javascript\nexport default Ember.Route.extend({\n  activate()\
    \ {\n    // 属性 logger 被注入到所有路由中\n    this.get('logger').log('Entered your route!');\n\
    \  }\n});\n```\n\n当使用完整键时，可以像下面所示对完整键进行注入：\n`app.inject('route:index', 'logger',\
    \ 'logger:main');`\n\n## 临时注入 (Ad Hoc Injections)\n\n依赖注入通过使用 `Ember.inject` 直接在\
    \ Ember 类上声明。目前，该属性支持服务和控制器的注入。考虑下代码，它展示了如何将 `shopping-cart` 服务作为 `cart` 属性注入到组件\
    \ `cart-contents` 中。代码如下：\n\n```javascript\nexport default Ember.Component.extend({\n\
    \  cart: Ember.inject.service('shopping-cart')\n});\n```\n\n如果你需要根据 `audioType`\
    \ 播放不同的音频服务，可以参考以下代码：\n\n```javascript\nimport Ember from 'ember';\nconst {\n\
    \  Component,\n  computed,\n  getOwner\n} = Ember;\n\n// 使用方法：\n// {{play-audio\
    \ song=song}}\nexport default Component.extend({\n  audioService: computed('song.audioType',\
    \ function() {\n    let appInstance = getOwner(this);\n    let audioType = this.get('song.audioType');\n\
    \    return appInstance.lookup(`service:${audioType}`);\n  }),\n  click() {\n\
    \    let p = this.get('audioService');\n    p.play(this.get('file'));\n  }\n});\n\
    ```\n\n## 初始化器 (Initializers)\n\n初始化器允许我们在启动过程中配置应用。存在两种类型：应用实例初始化器和应用初始化器。\n\n\
    应用初始化器在启动期间执行，提供了配置依赖注入的方法。另一种初始化器在加载应用实例时配置，允许我们设置应用的初始状态并 Setup 本地实例。\n\n###\
    \ 应用初始化器 (Application Initializers)\n\n应用初始化器使用 Ember CLI 的初始化器生成器创建。下述命令展示了这一操作：\n\
    \n`ember generate initializer shopping-cart`\n\n随后我们可以自定义 `shopping-cart` 初始化器，将\
    \ `cart` 属性注入到应用中的所有路由。代码如下：\n\n```javascript\nexport function initialize(app)\
    \ {\n  app.inject('route', 'cart', 'service:shopping-cart');\n}\n\nexport default\
    \ {\n  name: 'shopping-cart',\n  initialize: initialize\n};\n```\n\n### 应用实例初始化器\
    \ (Application Instance Initializers)\n\n这些初始化器使用 `instance-initializer` 生成器创建。下述代码展示了如何实现简单的日志记录，以指示实例已启动：\n\
    \n```javascript\nexport function initialize(appInstance) {\n  let logger = appInstance.lookup('logger:main');\n\
    \  logger.log('Hello from an instance initializer!');\n}\n```\n\n"
- fmt: "\n```javascript\nlogger.log('Hi from our instance initializer!');\n\n}\n\n\
    export default {\n  name: 'logger',\n  initialize: initialize\n};\n```\n\n## Specifying\
    \ Initializer Order\n\nIf you need to control the order in which initializers\
    \ run, the `before` and `after` options can be used for this purpose. Consider\
    \ the code given below:\n\n```javascript\nexport function initialize(app) {\n\
    \  // ...add your code here ...\n};\n\nexport default {\n  name: 'configReader',\n\
    \  before: 'websocketInit',\n  initialize: initialize\n};\n```\n\nThe next code\
    \ should then be as follows:\n\n```javascript\nexport function initialize(application)\
    \ {\n  // ... add your code here...\n};\n\nexport default {\n  name: 'websocketInit',\n\
    \  after: 'configReader',\n  initialize: initialize\n};\n```\n\n## Services\n\n\
    The property `Ember.service` is an object in Ember which can be used and made\
    \ available at various parts of one’s app. The following are the areas in which\
    \ the services are used:\n\n*   `Geolocation`.\n*   `User/session` authentication.\n\
    *   `Web Sockets`.\n*   `Server-backed API calls` which cannot fit `Ember Data`.\n\
    *   `Third-party APIs`.\n*   `Server-sent events` or the notifications `Logging`.\n\
    \n## Definition of Services\n\nThe `service` generator in Ember CLI can be used\
    \ for the purpose of generating services. Consider the following command which\
    \ can be used for the purpose of creating a `shoppingCart` service:\n\n```bash\n\
    ember generate service shopping-cart\n```\n\nThe services have to extend the base\
    \ class `Ember.Service`. This is shown in the code given below:\n\n```javascript\n\
    export default Ember.Service.extend({\n});\n```\n\nLike the objects in Ember,\
    \ a service has to be initialized, and this should have methods and properties\
    \ of its own. Consider the shopping cart service shown below which best demonstrates\
    \ how this works:\n\n```javascript\nexport default Ember.Service.extend({\n  items:\
    \ null,\n  init() {\n    this._super(args);\n    this.set('items', []);\n  },\n\
    \  add(item) {\n    this.get('items').pushObject(item);\n  },\n  remove(item)\
    \ {\n    this.get('items').removeObject(item);\n  },\n  empty() {\n    this.get('items').setObjects([]);\n\
    \  }\n});\n```\n\n## Accessing Services\n\nFor a service to be accessed, one can\
    \ choose to inject it into any object which is container-resolved, such as another\
    \ service or a component by use of the function `Ember.inject.service`. There\
    \ are two ways that a function can be used. One can choose to invoke it without\
    \ arguments, or pass the registered name of your service to it.\n\nIn case no\
    \ arguments are passed, then the services have to be loaded based on the name\
    \ of its variable key. To load the shopping cart service with no arguments, do\
    \ it as shown below:\n\n```javascript\nexport default Ember.Component.extend({\n\
    \  //ant to load the service in the file /app/services/shopping-cart.js\n  shoppingCart:\
    \ Ember.inject.service()\n});\n```\n\nThe other method involves using the name\
    \ of the service as the argument. This is shown in the code given below:\n\n```javascript\n\
    export default Ember.Component.extend({\n  //want to load our service in the file\
    \ /app/services/shopping-cart.js\n  cart: Ember.inject.service('shopping-cart')\n\
    });\n```\n\nWith the above code, the shopping cart service will be injected into\
    \ our component and then be made available to the `cart` property. Properties\
    \ which have been injected are lazy loaded, meaning that instantiation of the\
    \ service will not be done until the property has not been called explicitly.\
    \ This means that the function `get` has to be used for accessing the services\
    \ of a particular component, otherwise, you will get an undefined error.\n\nAfter\
    \ loading, the service persists until the service exits.\n\nConsider the code\
    \ given below:\n\n```javascript\nexport default Ember.Component.extend({\n  cart:\
    \ Ember.inject.service('shopping-cart'),\n  actions: {\n    remove(item) {\n \
    \     this.get('cart').remove(item);\n    }\n  }\n});\n```\n\nIn the above code,\
    \ we have added the `remove` action to the component `cart-contacts`. Once it\
    \ has been injected into a component, the service will also be used in a template.\
    \ Note the cart which has been used in the code given below for getting the data\
    \ from the cart:\n\n```html\n<ul>\n  {{#each cart.items as |item|}}\n    <li>\n\
    \      {{item.name}}\n      <button {{action \"remove\" item}}>Remove</button>\n\
    \    </li>\n  {{/each}}\n</ul>\n```\n\n## The Run Loop\n\nMost of the internals\
    \ and the code we write in Ember for our apps occur in a run loop. The run loop\
    \ is used for the purpose of batching and ordering the work in a way which is\
    \ more efficient and effective. \n\nThe following code is shown below:\n\n```html\n\
    <div id=\"foo\"></div>\n<div id=\"bar\"></div>\n<div id=\"baz\"></div>\n```\n"
