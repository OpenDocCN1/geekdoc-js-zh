    This framework has a number of features which we can take advantage of so as to
    enhance our apps.


    In Ember JS, controllers are of great importance, and most people confuse them
    with components. Very soon, it is believed that the controllers will be replaced
    with components.


    Controllers are used for the purpose of controlling state, and this is determined
    by the kind of route which is currently being used. A controller is also used
    when passing information from a component to a route, as this has to pass through
    it. Dependencies need to be established between controllers.


    This is usually the case when we are in need of nesting resources. We have to
    come up with a mechanism as to how to establish a connection between the controllers.


    It is good for you to know how to create custom transformations in Ember JS. This
    is because the data types which might be available may not be sufficient for you.
    There are custom transformations in Ember JS which can assist you in this. My
    hope is that this book has helped you understand how to create apps in Ember JS.
    Enjoy!

    '
