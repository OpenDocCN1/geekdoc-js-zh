    ### 创建记录\n\n假设我们有两个模型，`myposts` 和 `comments`。它们的关系如下：\n\n```javascript\nexport\
    \ default DS.Model.extend({\n  comments: DS.hasMany('comment')\n});\n```\n\n文件\
    \ `comment.js` 如下：\n\n```javascript\nexport default DS.Model.extend({\n  post:\
    \ DS.belongsTo('post')\n});\n```\n\n### 更新现有记录\n\n有时，我们可能需要为已记录设置关系。这简单地通过使用 `belongsTo`\
    \ 关系即可完成。下方的代码所示：\n\n```javascript\nlet p = this.store.peekRecord('post', 1);\n\
    let comm = this.store.peekRecord('comment', 1);\ncomm.set('post', p);\ncomm.save();\n\
    ```\n\n或者，可以将记录推入 `hasMany` 关系以更新它。如下所示：\n\n```javascript\nlet p = this.store.peekRecord('post',\
    \ 1);\nlet comm = this.store.peekRecord('comment', 1);\np.get('comments').pushObject(comm);\n\
    p.save();\n```\n\n"
- fmt: "\n# Relationships\n\nFor a `belongsTo` relationship to be removed, we can\
    \ just set it to `null`. This will remove it from the side of `hasMany` relationship.\
    \ Consider the code given below which best demonstrates this:\n\n```javascript\n\
    let comm = this.store.peekRecord('comment', 1);\ncomm.set('post', null);\ncomm.save();\n\
    ```\n\nA record can also be removed from a `hasMany` relationship. Consider the\
    \ code given below which best shows how this can be done:\n\n```javascript\nlet\
    \ p = this.store.peekRecord('post', 1);\nlet comm = this.store.peekRecord('comment',\
    \ 1);\np.get('comments').removeObject(comm);\np.save();\n```\n\n### Relationships\
    \ as Promises\n\nWhenever you are working relationships, it is good for you to\
    \ always remember that these will return promises. Suppose that we are to work\
    \ on the asynchronous comments of a post, we should wait until our promise has\
    \ been fulfilled. Consider the code given below:\n\n```javascript\nlet p = this.store.peekRecord('post',\
    \ 1);\np.get('comments').then((comments) => {\n  // we can now work with the comments\n\
    });\n```\n\nThe same will be applied to the relationship `hasMany` as shown below:\n\
    \n```javascript\nlet comm = this.store.peekRecord('comment', 1);\ncomm.get('post').then((p)\
    \ => {\n  // the post will be available here\n});\n```\n\nHandlebars templates\
    \ are updated automatically for reflection of a resolved promise. A list of comments\
    \ can be displayed in a post as shown below:\n\n```html\n<ul>\n  {{#each p.comments\
    \ as |comm|}}\n    <li>{{comm.id}}</li>\n  {{/each}}\n</ul>\n```\n\n---\n\n# Pushing\
    \ Records into Store\n\nA store can be thought of as a cache which contains all\
    \ the records which have been loaded by the app.\n\nFor you to push records into\
    \ a store, you just have to call the `push()` method. Consider a situation in\
    \ which we are in need of preloading some data into the store once an app has\
    \ been launched for the first time. This can easily be done using `route:application`.\
    \ Consider the code given below:\n\n```javascript\nexport default DS.Model.extend({\n\
    \  title: DS.attr(),\n  artist: DS.attr(),\n  songCount: DS.attr()\n});\n```\n\
    \nConsider the next piece of code:\n\n```javascript\nexport default Ember.Route.extend({\n\
    \  model() {\n    this.store.push({\n      data: [\n        {\n          id: 1,\n\
    \          type: 'album',\n          attributes: {\n            title: 'Very Few\
    \ Moving Parts',\n            artist: 'John Joel',\n            songCount: 5\n\
    \          },\n          relationships: {}\n        }, {\n          id: 2,\n \
    \         type: 'album',\n          attributes: {\n            title: 'Our God\
    \ is Great all the time',\n            artist: 'Steve John',\n            songCount:\
    \ 3\n          },\n          relationships: {}\n        }\n      ]\n    });\n\
    \  }\n});\n```\n\nIf there is a need for the data to be normalized by the default\
    \ serializer of the model before it can be pushed to the store, one can use the\
    \ method `store.pushPayload()`. This is shown in the code given below:\n\n```javascript\n\
    export default DS.RestSerializer.extend({\n  normalize(typeHash, hash) {\n   \
    \ hash['songCount'] = hash['song_count']\n    delete hash['song_count']\n    return\
    \ this._super(typeHash, hash);\n  }\n})\n```\n\nThe next code should be as shown\
    \ below:\n\n```javascript\nexport default Ember.Route.extend({\n  model() {\n\
    \    this.store.pushPayload({\n      albums: [\n        {\n          id: 1,\n\
    \          title: 'Very Fever Moving Parts',\n          artist: 'John Joel',\n\
    \          song_count: 5\n        },\n        {\n          id: 2,\n          title:\
    \ 'Our God is Great all the time',\n          artist: 'Steve John',\n        \
    \  song_count: 2\n        }\n      ]\n    });\n  }\n});\n```\n\nThe method `push()`\
    \ is very important when it comes to working with endpoints which are complex.\
    \ Your application might have an endpoint which is tasked with the performing\
    \ of some business logic and create several records. The code given below best\
    \ demonstrates this:\n\n```javascript\nexport default Ember.Route.extend({\n \
    \ actions: {\n    confirm: function(d) {\n      $.ajax({\n        data: d,\n \
    \       method: 'POST',\n        url: 'process-payment'\n      }).then((digInventory)\
    \ => {\n        this.store.pushPayload(digInventory);\n        this.transitionTo('Thanks');\n\
    \      });\n    }\n  }\n});\n```\n\n---\n\n# Handling MetaData\n\nAlong with your\
    \ records returned from the store, some form of metadata will need to be handled.\
    \ Metadata is just a kind of data which goes along with some specific model or\
    \ a type instead of a record.\n\nPagination is a common way that metadata can\
    \ be used. Consider a blog with many posts which cannot be displayed at once.\
    \ These can be queried as shown below:\n\n```javascript\nlet res = this.store.query('post',\
    \ {\n  limit: 10,\n  offset: 0\n});\n```\n\nTo get different pages of data, the\
    \ offset can be changed. For us to get metadata, the following is expected:\n\n\
    ```json\n{\n  \"post\": {\n    \"links\": {\n      \"user\": \"/posts\"\n    },\n\
    \    \"meta\": {\n      \"total\": 100\n    }\n  }\n}\n```\n\nRegardless of the\
    \ serializer that is used, one can make use of `.get('meta')`. This can be applied\
    \ on the result of a `query()` call. Here is the example:\n\n```javascript\n//\
    \ setting up the query\nstore.query('post', {\n  limit: 10,\n  offset: 0\n}).then((res)\
    \ => {\n  let meta = res.get('meta');\n});\n```\n\nIf we have a `belongsTo` relationship,\
    \ this can be done as:\n\n```javascript\nlet p = this.store.peekRecord('post',\
    \ 1);\np.get('author').then((author) => {\n  let meta = author.get('meta');\n\
    });\n```\n\nOn a `hasMany` relationship, this can be done as:\n\n```javascript\n\
    let p = this.store.peekRecord('post', 1);\np.get('comments').then((comments) =>\
    \ {\n  let meta = comments.get('meta');\n});\n```\n\n---\n\n# Customizations of\
    \ Adapters\n\nIn Ember data, the Adapter is tasked with how the data is persisted\
    \ to a backend, such as the URL format and headers.\n\nFor an endpoint having\
    \ some consistent rules, one can define `adapter:application`. This will get a\
    \ priority over a default adapter, but it will be superseded by adapters which\
    \ are model specific. This is shown in the code given below:\n\n```javascript\n\
    export default DS.JSONAPIAdapter.extend({\n  // Application specific overrides\
    \ go here\n});\n```\n\nFor a model having some specific rules about how it communicates\
    \ with the others, a model specific adapter can be created by execution of the\
    \ command `ember generate adapter name`. A good example is that when you run the\
    \ command `ember generate adapter post`, the following file will be created:\n\
    \n```javascript\nexport default DS.JSONAPIAdapter.extend({\n  namespace: 'api/v1'\n\
    });\n```\n\nBy default, the Ember data will come with multiple built-in adapters.\
    \ If you are in need of creating your own custom adapter, use these as your starting\
    \ point.\n\n### URL Conventions\n\nThe adapter `JSONAPIAdapter` is good when it\
    \ comes to determination of the URLs which it uses to communicate depending on\
    \ the type of the model. Consider the example given below of when a post is asked\
    \ for by ID:\n\n```javascript\nstore.find('post', 1).then(function(p) {\n\n});\n\
    ```\n\n### Pluralization Customization\n\nSometimes, you may need to facilitate\
    \ the process of pluralization of model names whenever you are generating route\
    \ URLs. The Ember reflector can be used for this purpose. This is a library which\
    \ can be used for the purpose of alternating words from plural to singular form\
    \ and vice versa. For uncountable or irregular pluralizations, one can make use\
    \ of `Ember.Inflector.inflector`. This can easily be done as shown below:\n\n\
    ```javascript\n// setting up the Ember.Inflector\nimport './models/custom-inflector-rules';\n\
    ```\n\nThe next code is given below:\n\n```javascript\nimport Inflector from 'ember-inflector';\n\
    \nconst inflect = Inflector.inflector;\n\ninflect.irregular('formula', 'formulae');\n\
    \ninflect.uncountable('advice');\n\n// Meeting the expectation of Ember Inspector\
    \ of an export\nexport default {};\n```\n\n### Customizing Endpoint Path\n\nThe\
    \ property `namespace` will be used for prefixing requests having a specific URL\
    \ namespace.\n"
  raw: 'For a “belongsTo” relationship to be removed, we can just set it to null.
    This will remove it from the side of “hasMany” relationship. Consider the code
    given below which best demonstrates this:


    let comm = this.store.peekRecord(''comment'', 1);


    comm.set(''post'', null);


    comm.save();


    A record can also be removed from a “hasMany” relationship. Consider the code
    given below which best shows how this can be done:


    let p = this.store.peekRecord(''post'', 1);


    let comm = this.store.peekRecord(''comment'', 1);


    p.get(''comments'').removeObject(comm);


    p.save();


    Relationships as Promises


    Whenever you are working relationships, it is good for you to always remember
    that these will return promises. Suppose that we are to work on the asynchronous
    comments of a post, we should wait until our promise has been fulfilled. Consider
    the code given below:


    let p = this.store.peekRecord(''post'', 1);


    p.get(''comments'').then((comments) => {


     // we can now work with the comments


    });


    The same will be applied to the relationship “hasMany” as shown below:


    let comm = this.store.peekRecord(''comment'', 1);


    comm.get(''post'').then((p) => {


     // the post will be available here


    });


    Handlebars templates are updated automatically for reflection of a resolved promise.
    A list of comments can be displayed in a post as shown below:


    <ul>


     {{#each p.comments as |comm|}}


       <li>{{comm.id}}</li>


     {{/each}}


    </ul>


    Pushing Records into Store


    A store can be thought of as a cache which contains all the records which have
    been loaded by the app.


    For you to push records into a store, you just have to call the “push()” method.
    Consider a situation in which we are in need of preloading some data into the
    store once an app has been launched for the first time. This can  easily be done
    using “route:application.” Consider the code given below:


    export default DS.Model.extend({


     title: DS.attr(),


     artist: DS.attr(),


     songCount: DS.attr()


    });


    Consider the next piece of code:


    export default Ember.Route.extend({


     model() {


       this.store.push({


         data: [{


           id: 1,


           type: ''album'',


           attributes: {


             title: ''Very Few Moving Parts'',


             artist: ''John Joel'',


             songCount: 5


           },


           relationships: {}


         }, {


           id: 2,


           type: ''album'',


           attributes: {


             title: ''Our God is Great all the time'',


             artist: ''Steve John'',


             songCount: 3


           },


           relationships: {}


         }]


       });


     }


    });


    If there is a need for the data to be normalized by the default serializer of
    the model before it can be pushed to the store, one can use the method “story.pushPayLoad().”This
    is shown in the code given below:


    export default DS.RestSerializer.extend({


     normalize(typeHash, hash) {


       hash[''songCount''] = hash[''song_count'']


       delete hash[''song_count'']


       return this._super(typeHash, hash);


     }


    })


    The next code should be as shown below:


    export default Ember.Route.extend({


     model() {


       this.store.pushPayload({


         albums: [


           {


             id: 1,


             title: ''Very Fever Moving Parts'',


             artist: ''John Joel'',


             song_count: 5


           },


           {


             id: 2,


             title: ''Our God is Great all the time'',


             artist: ''Steve John'',


             song_count: 2


           }


         ]


       });


     }


    });


    The method “push()” is very important when it comes to working with endpoints
    which are complex. Your application might have  an endpoint which is tasked with
    the performing of some business logic and create several records. The code given
    below best demonstrates this:


    export default Ember.Route.extend({


     actions: {


       confirm: function(d) {


         $.ajax({


           data: d,


           method: ''POST'',


           url: ''process-payment''


         }).then((digInventory) => {


           this.store.pushPayload(digInventory);


           this.transitionTo(''Thanks'');


         });


       }


     }


    });


    Handling MetaData


    Along with your records returned from the store, some form of metadata will need
    to be handled. Metadata is just a kind of data which goes along with some specific
    model or a type instead of a record.


    Pagination is a common way that  metadata can be used. Consider a blog with many
    posts which cannot be displayed at once. These can be queried as shown below:


    let res = this.store.query(''post'', {


     limit: 10,


     offset: 0


    });


    To get different pages of the data, the offset can be changed in increments of
    10\. The problem is  knowing the number of pages of data that you are having.


    For us to get different pages of data, the offset can be set in increments of
    10\. For the case of the server, it needs to return the total number of the records
    as a metadata piece.


    Each serializer is expecting the metadata to be returned differently. Consider
    the code given below:


    {


     "post": {


       "id": 1,


       "title": "Ember is easy to learn for beginners",


       "comments": ["1", "2"],


       "links": {


         "user": "/posts/ember"


       },


       // ...


     },


     "meta": {


       "total": 100


     }


    }


    Regardless of the serializer that is used, the metadata will be extracted from
    the purpose. To read it, you can make use of “.get(''meta'').”


    This can be applied on the result of the “store.query()” call. Here is the code:


    store.query(''post'').then((res) => {


     let metad = res.get(''meta'');


    })


    If we have a belongsTo relationship, this can be done as follows:


    let p = store.peekRecord(''post'', 1);


    p.get(''author'').then((author) => {


     let metad = author.get(''meta'');


    });


    On a hasMany relationship, this can be done as follows:


    let p = store.peekRecord(''post'', 1);


    p.get(''comments'').then((comments) => {


     let metad = comments.get(''meta'');


    });


    Customizations of Adapters


    In Ember data, the Adapter is tasked with the determination of how the data is
    persisted to a backend store, such as  the URL format and headers of a RESTful
    API.


    For an endpoint having some consistent rules, one can define a “adapter:application.”This
    will get a priority over a default adapter, but it will be superseded by adapters
    which are model specific. This is shown in the code given below:


    export default DS.JSONAPIAdapter.extend({


     // Application specific overrides go here


    });


    For a model having some specific rules about how it communicates with the backend
    compared to the others, a model specific adapter can be creating by execution
    of the command “ember generate adapter adapter-name.” A good example is that when
    you run the command “ember generate adapter post,” the following file will be
    created:


    export default DS.JSONAPIAdapter.extend({


     namespace: ''api/v1''


    });


    By default, the Ember data will come with multiple built-in adapters. If you are
    in need of creating your own custom adapter, use these as your starting point.


    URL Conventions


    The adapter “JSONAPIAdapter” is good when it comes to determination of the URLS
    which it uses to communicate depending on the type of the model. Consider the
    example given below of when a post is asked for by ID:


    store.find(''post'', 1).then(function(p) {


    });


    Pluralization Customization


    Sometimes, you may need to facilitate the process of pluralization of model names
    whenever you are generating route URLs . The Ember reflector can be used for this
    purpose. This is a library which can be used for the purpose of alternating words
    from plural to singular form and vice versa. For uncountable or irregular pluralizations,
    one can make use of “Ember.Inflector.inflector.” This can easily be done as shown
    below:


    // setting up the Ember.Inflector


    import ''./models/custom-inflector-rules'';


    The next code is given below:


    import Inflector from ''ember-inflector'';


    const inflect = Inflector.inflector;


    inflect.irregular(''formula'', ''formulae'');


    inflect.uncountable(''advice'');


    // Meeting the expectation of Ember Inspector of an export


    export default {};


    Customizing Endpoint Path


    The property “namespace” will be used for prefixing requests having a specific
    URL namespace. This is shown in the code given below:'
