     namespace: ''api/1''


    });


    That is how it can be done.


    Host Customizations


    The adapter targets the current domain by default. If you are in need of specifying
    a new domain, you just have to set the property “host” on the new adapter. The
    code given below best shows how this can be done:


    export default DS.JSONAPIAdapter.extend({


     host: ''https://api.sample.com''


    });


    That is it.


    Path Customizations


    The method “pathForType” can be overridden as shown in the code given below:


    export default DS.JSONAPIAdapter.extend({


     pathForType: function(type) {


       return Ember.String.underscore(type);


     }


    });


    In the above case, we did not need to pluralize the names of the model, and we
    needed to use the underscore rather than the camelCase.


    Headers Customizations


    Some APIs need HTTP headers, and a good example is when there is a need for provision
    of an API key. Arbitrary headers can then be set as the key/value pairs on the
    header object of the JSONAPIAdapter, and the Ember data will send along each of
    our Ajax requests. Consider the code given below:


    export default DS.JSONAPIAdapter.extend({


     headers: {


       ''API_KEY'': ''secret key'',


       ''ANOTHER_HEADER'': ''A header value''


     }


    });


    One can also use “headers” as the computed property for the purpose of supporting
    dynamic headers. Consider the example given below in which the headers will be
    generated by use of computed property depending on the session service. Here is
    the code for the example:


    export default DS.JSONAPIAdapter.extend({


     session: Ember.inject.service(''session''),


     headers: Ember.computed(''session.authToken'', function() {


       return {


         ''API_KEY'': this.get(''session.authToken''),


         ''ANOTHER_HEADER'': ''A header value''


       };


     })


    });


    In some cases, the dynamic headers will need some data from the object outside
    the observer system of the Ember. The volatile function can also be used for the
    purpose of setting the property into a non-cached mode which will cause re-computation
    of the headers with each request. This is shown in the code given below:


    export default DS.JSONAPIAdapter.extend({


     headers: Ember.computed(function() {


       return {


         ''API_KEY'': Ember.get(document.cookie.match(/apiKey\=([^;]*)/), ''1''),


         ''ANOTHER_HEADER'': ''A header value''


       };


     }).volatile()


    });


    Authoring Adapters


    The property “defaultSerializer” will be used for the purpose of specifying the
    serializer which will be used by the adapter. This is only used when a “serializer:application”
    or a model specific adapter has not been specified. Specification of the “serializer:application”
    is very easy in any application. Consider the example given below demonstrating
    how this can be done:


    export default DS.JSONAPIAdapter.extend({


     defaultSerializer: ''-default''


    });


    Customizing Serializers


    In Ember data, serializers are used for formatting data which is sent to and received
    from our backend store. The default setting is that the Ember data will use the
    JSON API format for serialization of data.


    JSON API Document


    Consider the response given below for our request:


    {


     "data": {


       "type": "people",


       "id": "567",


       "attributes": {


         "first-name": "John",


         "last-name": "Joel"


       }


     }


    }


    In the above example, we have a response from a request to “/people/567.” A response
    having multiple records can have an array in the data property as shown below:


    {


     "data": [{


       "type": "people",


       "id": "567",


       "attributes": {


         "first-name": "John",


         "last-name": "Joel"


       }


     }, {


       "type": "people",


       "id": "345",


       "attributes": {


         "first-name": "Mercy",


         "last-name": "Donald"


       }


     }]


    }


    Sideloaded Data


    This is a type of data which is not part of a primary request but has some linked
    relationships which should be added in an array under the key “included.” Consider
    the code given below:


    {


     "data": {


       "type": "blogs",


       "id": "1",


       "attributes": {


         "title": "I really like and enjoy blogging!"


       },


       "links": {


         "self": "http://mysite.com/blogs/1"


       },


       "relationships": {


         "comments": {


           "data": [


             { "type": "comments", "id": "5" },


             { "type": "comments", "id": "12" }


           ]


         }


       }


     },


     "included": [{


       "type": "comments",


       "id": "5",


       "attributes": {


         "body": "First!"


       },


       "links": {


         "self": "http://mysite.com/comments/5"


       }


     }, {


       "type": "comments",


       "id": "12",


       "attributes": {


         "body": "Ember is very easy to learn"


       },


       "links": {


         "self": "http://mysite.com/comments/12"


       }


     }]


    }


    In the example given above, we have requested  “/blogs/1” and the user also gave
    us the comments which are associated with the person. The above code shows the
    response that we get.


    Customizing Serializers


    In Ember data, “JSONAPISerializer” is used by default, but a custom serializer
    can be used for the purpose of overriding this. A custom serializer can be defined
    in two main ways. One can choose to define a custom serializer for the entire
    application by definition of the “application” serializer. This is shown in the
    code given below:


    import DS from ''ember-data'';


    export default DS.JSONSerializer.extend({});


    A serializer can also be defined for a specific model. A good example is when
    you have  a “post” model, it is possible for you to also define a “post” serializer.
    This is shown in the code given below:


    import DS from ''ember-data'';


    export default DS.JSONSerializer.extend({});


    For the format of the data sent to the backend store to be changed, one can use
    the “serialize()” hook. This is shown in the code given below:


    Consider a situation in which the Ember data gives us the following JSON API response:


    {


     "data": {


       "attributes": {


         "id": "1",


         "name": "The Product",


         "amount": 200,


         "currency": "USD"


       },


       "type": "product"


     }


    }


    However, our server might be expecting to get data in this format:


    {


     "data": {


       "attributes": {


         "id": "1",


         "name": "The Product",


         "cost": {


           "amount": 200,


           "currency": "USD"


         }


       },


       "type": "product"


     }


    }


    The data can then be changed as shown below:


    import DS from ''ember-data'';


    export default DS.JSONSerializer.extend({


     serialize(snapshot, opts) {


       var json = this._super(...arguments);


       json.data.attributes.cost = {


         amount: json.data.attributes.amount,


         currency: json.data.attributes.currency


       };


       delete json.data.attributes.amount;


       delete json.data.attributes.currency;


       return json;


     },


    });


    In case the backend store is providing data in any  format other than the JSON
    API, one can use the hook “normalizeResponse().” By use of the example given above,
    the server will provide us with data which looks as follows:


    {


     "data": {


       "attributes": {


         "id": "1",


         "name": "A Product",


         "cost": {


           "amount": 200,


           "currency": "USD"


         }


       },


       "type": "product"


     }


    }


    The above should be changed to the following:


    {


     "data": {


       "attributes": {


         "id": "1",


         "name": "A Product",


         "amount": 200,


         "currency": "USD"


       },


       "type": "product"


     }


    }


    It should then be done as shown below:


    import DS from ''ember-data'';


    export default DS.JSONSerializer.extend({


     normalizeResponse(store, primModelClass, payload, id, reqType) {


       payload.data.attributes.amount = payload.data.attributes.cost.amount;


       payload.data.attributes.currency = payload.data.attributes.cost.currency;


       delete payload.data.attributes.cost;


       return this._super(...arguments);


     },


    });


