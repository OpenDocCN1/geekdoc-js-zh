    \n //ant to load the service in the file /app/services/shopping-cart.js\n\n shoppingCart:\
    \ Ember.inject.service()\n\n});\n\nThe other method involves using the name of\
    \ the service as the argument. This is shown in the code given below:\n\nexport\
    \ default Ember.Component.extend({\n\n //want to load our service in the file\
    \ /app/services/shopping-cart.js\n\n cart: Ember.inject.service('shopping-cart')\n\
    \n});\n\nWith the above code, the shopping cart service will be injected into\
    \ our component and then be made available to the cart property. Properties which\
    \ have been injected are lazy loaded, meaning that instantiation of the service\
    \ will not be done until the property has not been called explicitly. This means\
    \ that the function “get” has to be used for accessing the services of a particular\
    \ component, otherwise, you will get an undefined error.\n\nAfter loading, the\
    \ service persists until the service exits.\n\nexport default Ember.Component.extend({\n\
    \nConsider the code given below:\n\n cart: Ember.inject.service('shopping-cart'),\n\
    \n actions: {\n\n   remove(item) {\n\n     this.get('cart').remove(item);\n\n\
       }\n\n }\n\n});\n\nIn the above code, we have added the remove action to the\
    \ component “cart-contacts.” Once it has been injected into a component, the service\
    \ will also be used in a template. Note the cart which has been used in the code\
    \ given below for getting the data from the cart:\n\n<ul>\n\n {{#each cart.items\
    \ as |item|}}\n\n   <li>\n\n     {{item.name}}\n\n     <button {{action \"remove\"\
    \ item}}>Remove</button>\n\n   </li>\n\n {{/each}}\n\n</ul>\n\nThe Run Loop\n\n\
    Most of the internals and the code we write in Ember for our apps occur in a run\
    \ loop. The run loop is used for the purpose of batching and ordering the work\
    \ in a way which is more efficient and effective.  \n\nWe get a huge benefit when\
    \ we batch similar works. For web browsers to do something which is related, they\
    \ have to batch the changes made to the DOM. Consider the HTML snippet given below:\n\
    \n<div id=\"foo\"></div>\n\n<div id=\"bar\"></div>\n\n<div id=\"baz\"></div>\n\
    \nYou can then run the following code:\n\nfoo.style.height = '500px' // write\n\
    \nfoo.offsetHeight //write\n\nbar.style.height = '400px' // write\n\nbar.offsetHeight\
    \ // read\n\nbaz.style.height = '200px' // write\n\nbaz.offsetHeight // read\n\
    \nIn the above example, the sequence of the code has forced the browser to recalculate\
    \ the style and the layout after each step. However, if it was possible for us\
    \ to batch the similar jobs together, the browser would only be needed to recalculate\
    \ the style and the layout only once. This is shown in the code given below:\n\
    \nfoo.style.height = '500px' // write\n\nbar.style.height = '400px' // write\n\
    \nbaz.style.height = '200px' // write\n\nfoo.offsetHeight // read\n\nbar.offsetHeight\
    \ // read\n\nbaz.offsetHeight // read\n\nThe good thing about  this is that it\
    \ applies to many other types of work. When we batch similar works, we find it\
    \ easy for us to pipeline and further the optimization.\n\nConsider the example\
    \ given below, which has been optimized in Ember:\n\nvar MyUser = Ember.Object.extend({\n\
    \n fName: null,\n\n lName: null,\n\n fullName: Ember.computed('fName', 'lName',\
    \ function() {\n\n   return `${this.get('fName')} ${this.get('lName')}`;\n\n })\n\
    \n});\n\nThe template for displaying the attributes is as shown below:\n\n{{fName}}\n\
    \n{{fullName}}\n\nThe following code can be executed without using a run loop\
    \ as shown below:\n\nvar myuser = User.create({ fName: 'John', lastName: 'Boss'\
    \ });\n\nmyuser.set('fName', 'Joel');\n\n// {{fName}} and {{fullName}} are then\
    \ updated\n\nmyuser.set('lName', 'Donald');\n\n// {{lName}} and {{fullName}} are\
    \ updated\n\nWith the above, your browser should re-render the template twice.\n\
    \nNote that if the loop in the above code has been run, the browser will only\
    \ re-render the template once all of the attributes have been set. Consider the\
    \ code given below:\n\nvar myuser = User.create({ fName: 'John', lastName: 'Boss'\
    \ });\n\nmyuser.set('fName', 'Joel');\n\nuser.set('lName', 'Donald');\n\nuser.set('fName',\
    \ 'John ');\n\nuser.set('lastName', 'Boss');\n\nIn the above example, we have\
    \  a run loop, since the attributes of the user will end up at the same values\
    \ as before the execution, and the template will not be re-rendered.\n\nA run\
    \ loop should be begun once a callback has been fired. Consider the example given\
    \ below:\n\n$('a').click(() => {\n\n Ember.run(() => {  // beginning the loop\n\
    \n   // Code which results in the jobs being scheduled should go here\n\n });\
    \ // ending the loop, jobs are flushed and then executed\n\n});\n\nThat is the\
    \ new syntax which we currently have for functions.\n\nA non-Ember async callbacks\
    \ should be wrapped in “Ember.run.”  if you don’t do this,  Ember will approximate\
    \ and then define a beginning and an end for you. Consider the callback given\
    \ below:\n\n$('a').click(() => {\n\n console.log('Doing the things...');\n\n Ember.run.schedule('actions',\
    \ () => {\n\n   // Add more things\n\n });\n\n});\n\nThat is it for now.\n\n#\
    \ \n\nConclusion\n\nWe have come to the conclusion of this guide. Ember is one\
    \ of the available JavaScript frameworks in use today. This framework is mostly\
    \ used when we are in need of developing the client side of our web applications.\
    \ For it to structure the apps, it relies on the MVC architecture."
