  trans: "\n\n```javascript\nexport default DS.JSONAPIAdapter.extend({\n  namespace:\
    \ 'api/1'\n});\n```\n这就是实现方法。\n\n# 主机自定义 (Host Customizations)\n\n适配器默认指向当前域名。如果你需要指定新域名，只需在新适配器上设置\
    \ `host` 属性即可。下面的代码很好地展示了如何实现：\n\n```javascript\nexport default DS.JSONAPIAdapter.extend({\n\
    \  host: 'https://api.sample.com'\n});\n```\n就是这样。\n\n# 路径自定义 (Path Customizations)\n\
    \n可以像下面的代码一样覆盖 `pathForType` 方法：\n\n```javascript\nexport default DS.JSONAPIAdapter.extend({\n\
    \  pathForType: function(type) {\n    return Ember.String.underscore(type);\n\
    \  }\n});\n```\n\n在上述情况下，我们不需要对模型名称进行复数化，并且需要使用下线命名而不是驼峰命名（camelCase）。\n\n# 请求头自定义\
    \ (Headers Customizations)\n\n某些 API 需要 HTTP 请求头，一个很好的例子是需要提供 API key。可以将任意请求头作为键值对设置在\
    \ `JSONAPIAdapter` 的 `header` 对象上，Ember data 将在我们的每一个 Ajax 请求中发送它们。考虑下面的代码：\n\n\
    ```javascript\nexport default DS.JSONAPIAdapter.extend({\n  headers: {\n    'API_KEY':\
    \ 'secret key',\n    'ANOTHER_HEADER': 'A header value'\n  }\n});\n```\n\n可以使用\
    \ `headers` 作为计算属性（computed property）来支持动态请求头。考虑下面的示例，请求头将根据 session 服务通过计算属性生成。以下是该示例的代码：\n\
    \n```javascript\nexport default DS.JSONAPIAdapter.extend({\n  session: Ember.inject.service('session'),\n\
    \  headers: Ember.computed('session.authToken', function() {\n    return {\n \
    \     'API_KEY': this.get('session.authToken'),\n      'ANOTHER_HEADER': 'A header\
    \ value'\n    };\n  })\n});\n```\n\n在某些情况下，动态请求头需要来自 Ember 观察者系统之外对象的数据。`volatile`\
    \ 函数也可以用于将属性设置为非缓存模式，这将导致每次请求时都重新计算请求头。下文代码所示：\n\n```javascript\nexport default\
    \ DS.JSONAPIAdapter.extend({\n  headers: Ember.computed(function() {\n    return\
    \ {\n      'API_KEY': Ember.get(document.cookie.match(/apiKey\\=([^;]*)/), '1'),\n\
    \      'ANOTHER_HEADER': 'A header value'\n    };\n  }).volatile()\n});\n```\n\
    \n# 编写适配器 (Authoring Adapters)\n\n`defaultSerializer` 属性将用于指定适配器使用的序列化器。这仅在没有指定\
    \ `serializer:application` 或特定模型的适配器时才使用。在任何应用程序中指定 `serializer:application` 都非常简单。考虑下面的示例，了如何实现：\n\
    \n```javascript\nexport default DS.JSONAPIAdapter.extend({\n  defaultSerializer:\
    \ '-default'\n});\n```\n\n# 自定义序列化器 (Customizing Serializers)\n\n在 Ember data\
    \ 中，序列化器（serializers）用于格式化发送到和从后端存储接收的数据。默认设置是 Ember data 将使用 JSON API 格式进行数据序列化。\n\
    \n## JSON API 文档 (JSON API Document)\n\n考虑我们请求的如下响应：\n\n```json\n{\n  \"data\"\
    : {\n    \"type\": \"people\",\n    \"id\": \"567\",\n    \"attributes\": {\n\
    \      \"first-name\": \"John\",\n      \"last-name\": \"Joel\"\n    }\n  }\n\
    }\n```\n\n在上述示例中，我们对 `/people/567.` 的请求得到了响应。包含多个记录的响应可以在 `data` 属性中有一个数组，如下所示：\n\
    \n```json\n{\n  \"data\": [{\n    \"type\": \"people\",\n    \"id\": \"567\",\n\
    \    \"attributes\": {\n      \"first-name\": \"John\",\n      \"last-name\":\
    \ \"Joel\"\n    }\n  }, {\n    \"type\": \"people\",\n    \"id\": \"345\",\n \
    \   \"attributes\": {\n      \"first-name\": \"Mercy\",\n      \"last-name\":\
    \ \"Donald\"\n    }\n  }]\n}\n```\n\n## 侧载数据 (Sideloaded Data)\n\n这类数据不是主请求的一部分，但具有一些关联关系，这些关系应该被添加到\
    \ `included` 键下的数组中。考虑下面的代码：\n\n```json\n{\n  \"data\": {\n    \"type\": \"blogs\"\
    ,\n    \"id\": \"1\",\n    \"attributes\": {\n      \"title\": \"I really like\
    \ and enjoy blogging!\"\n    },\n    \"links\": {\n      \"self\": \"http://mysite.com/blogs/1\"\
    \n    },\n    \"relationships\": {\n      \"comments\": {\n        \"data\": [\n\
    \          { \"type\": \"comments\", \"id\": \"5\" },\n          { \"type\": \"\
    comments\", \"id\": \"12\" }\n        ]\n      }\n    }\n  },\n  \"included\"\
    : [{\n    \"type\": \"comments\",\n    \"id\": \"5\",\n    \"attributes\": {\n\
    \      \"body\": \"First!\"\n    },\n    \"links\": {\n      \"self\": \"http://mysite.com/comments/5\"\
    \n    }\n  }, {\n    \"type\": \"comments\",\n    \"id\": \"12\",\n    \"attributes\"\
    : {\n      \"body\": \"Ember is very easy to learn\"\n    },\n    \"links\": {\n\
    \      \"self\": \"http://mysite.com/comments/12\"\n    }\n  }]\n}\n```\n\n在上面的示例中，我们请求了\
    \ `/blogs/1`，用户也给了我们与人员相关的评论。上面的代码展示了我们得到的响应。\n\n# 自定义序列化器 (Customizing Serializers)\n\
    \n在 Ember data 中，默认使用 `Serializer`，但也可以为此目的自定义序列化器。自定义序列化器可以通过两种方式定义。人们可以选择为整个\
    \ `application` 定义一个序列化器。\n\n```javascript\nimport DS from 'ember-data';\nexport\
    \ default DS.Serializer.extend({\n  serialize(snapshot, opts) {\n    var json\
    \ = this._super(...arguments);\n    json.data.attributes.cost = {\n      amount:\
    \ json.data.attributes.amount,\n      currency: json.data.attributes.currency\n\
    \    };\n    delete json.data.attributes.amount;\n    delete json.data.attributes.currency;\n\
    \    return json;\n  },\n});\n```\n\n人们也可以为特定模型定义序列化器。\n\n```javascript\nimport\
    \ DS from 'ember-data';\nexport default DS.Serializer.extend({\n  serialize(snapshot,\
    \ opts) {\n    var json = this._super(...arguments);\n    json.data.attributes.cost\
    \ = {\n      amount: json.data.attributes.amount,\n      currency: json.data.attributes.currency\n\
    \    };\n    delete json.data.attributes.amount;\n    delete json.data.attributes.currency;\n\
    \    return json;\n  },\n});\n```\n\n数据可以如下所示更改：\n\n假设服务器向我们提供如下数据：\n\n```json\n\
    {\n  \"data\": {\n    \"attributes\": {\n      \"id\": \"1\",\n      \"name\"\
    : \"The Product\",\n      \"cost\": {\n        \"amount\": 200,\n        \"currency\"\
    : \"USD\"\n      }\n    },\n    \"type\": \"product\"\n  }\n}\n```\n\n上述内容应该更改为：\n\
    \n```json\n{\n  \"data\": {\n    \"attributes\": {\n      \"id\": \"1\",\n   \
    \   \"name\": \"The Product\",\n      \"amount\": 200,\n      \"currency\": \"\
    USD\"\n    },\n    \"type\": \"product\"\n  }\n}\n```\n\n这应该如下所示实现：\n\n```javascript\n\
    import DS from 'ember-data';\nexport default DS.JSONSerializer.extend({\n  normalizeResponse(store,\
    \ primModelClass, payload, id, reqType) {\n    payload.data.attributes.amount\
    \ = payload.data.attributes.cost.amount;\n    payload.data.attributes.currency\
    \ = payload.data.attributes.cost.currency;\n    delete payload.data.attributes.cost;\n\
    \    return this._super(...arguments);\n  },\n});\n```\n\n"
- fmt: "\nIf you are in need of tracking the unique records contained in a store,\
    \ the Ember data expects that each record should have a unique `id` property in\
    \ the payload. For each record of a specific type, the `id` should also be unique.\
    \ If the backend had used a different key rather than the `id,” one can use the\
    \ primary key property of the serializer so as to transform the `id` properly\
    \ during the process of serialization and deserialization of the data. This is\
    \ shown in the code given below:\n\n```javascript\nexport default DS.JSONSerializer.extend({\n\
    \  primaryKey: '_id'\n});\n```\n\n## Attribute Names\n\nThe convention in Ember\
    \ data is to camelize the attribute names on a particular model. Consider the\
    \ example given below:\n\n```javascript\nexport default DS.Model.extend({\n  fName:\
    \ DS.attr('string'),\n  lName:  DS.attr('string'),\n  isPersonOfTheYear: DS.attr('boolean')\n\
    });\n```\n\nThe `JSONAPISerializer` is expecting the attributes to be dasherized\
    \ in a document payload returned by the server. This is shown in the code given\
    \ below:\n\n```json\n{\n  \"data\": {\n    \"id\": \"44\",\n    \"type\": \"people\"\
    ,\n    \"attributes\": {\n      \"first-name\": \"John\",\n      \"last-name\"\
    : \"Joel\",\n      \"is-person-of-the-year\": true\n    }\n  }\n}\n```\n\nIn case\
    \ the attributes returned by the server use a very different convention, one can\
    \ use the method `keyForAttribute()` of the serializer for conversion of the attribute\
    \ name in the model to a key in the JSON payload. Consider the code given below:\n\
    \n```javascript\nexport default DS.JSONAPISerializer.extend({\n  keyForAttribute:\
    \ function(attribute) {\n    return Ember.String.underscore(attribute);\n  }\n\
    });\n```\n\nA custom serializer can be used for mapping irregular keys. The object\
    \ `attrs` can be used for the purpose of declaring a simple mapping between different\
    \ property names in the `DS`. Consider the sample code given below:\n\n```javascript\n\
    export default DS.Model.extend({\n  lName: DS.attr('string')\n});\n```\n\nWhat\
    \ we have done is that we have created a custom serializer for our model and then\
    \ overrode the property `attrs`. The next piece of code should be as follows:\n\
    \n```javascript\nexport default DS.JSONAPISerializer.extend({\n  attrs: {\n  \
    \  lName: 'lastNameOfPerson'\n  }\n});\n```\n\n## Relationships\n\nThe `ID` property\
    \ should be used for referencing to some other records. Consider a situation in\
    \ which your model has the `hasMany` relationship shown below:\n\n```javascript\n\
    export default DS.Model.extend({\n  comments: DS.hasMany('comment', { async: true\
    \ })\n});\n```\n\nThe JSON should then encode the relationship just as an array\
    \ of types and IDs. This is shown in the code given below:\n\n```json\n{\n  \"\
    data\": {\n    \"type\": \"posts\",\n    \"id\": \"1\",\n    \"relationships\"\
    : {\n      \"comments\": {\n        \"data\": [\n          { \"type\": \"comments\"\
    , \"id\": \"5\" },\n          { \"type\": \"comments\", \"id\": \"12\" }\n   \
    \     ]\n      }\n    }\n  }\n}\n```\n\nConsider a situation in which you have\
    \ a model which is as follows:\n\n```javascript\nexport default DS.Model.extend({\n\
    \  origPost: DS.belongsTo('post')\n});\n```\n\nThe relationship should then be\
    \ encoded by JSON into another record as an ID. This is shown in the code given\
    \ below:\n\n```json\n{\n  \"data\": {\n    \"type\": \"comment\",\n    \"id\"\
    : \"1\",\n    \"relationships\": {\n      \"original-post\": {\n        \"data\"\
    : { \"type\": \"post\", \"id\": \"5\" },\n      }\n    }\n  }\n}\n```\n\nIf these\
    \ naming conventions are needed, then they can be overridden by use of the method\
    \ `keyForRelationship`. Consider the code given below which best demonstrates\
    \ this:\n\n```javascript\nexport default DS.JSONAPISerializer.extend({\n  keyForRelationship:\
    \ function(key, relship) {\n    return key + 'Ids';\n  }\n});\n```\n\n## Creation\
    \ of Custom Transformations\n\nUnder certain circumstances, built-in types such\
    \ as the string, `Boolean`, and others may not be adequate for us to implement\
    \ what we need. A good example of this is when a particular server gives you a\
    \ non-standard date format.\n\nIn Ember data, we may have new JSON transforms\
    \ which have been registered to be used as attributes. The code given below best\
    \ describes this:\n\n```javascript\nexport default DS.Transform.extend({\n  serialize:\
    \ function(val) {\n    return [value.get('a'), value.get('b')];\n  },\n  deserialize:\
    \ function(val) {\n    return Ember.Object.create({ a: value[0], b: value[1] });\n\
    \  }\n});\n```\n\nThe next code should then be as follows:\n\n```javascript\n\
    export default DS.Model.extend({\n  position: DS.attr('coordinate-point')\n});\n\
    ```\n\nAfter receiving `coordinatePoint` from the API, it is expected to be an\
    \ array as shown below:\n\n```json\n{\n  \"cursor\": {\n    \"position\": [5,9]\n\
    \  }\n}\n```\n\nOnce it has been loaded on an instance of a model, it will act\
    \ as an object as shown below:\n\n```javascript\nvar c = store.findRecord('cursor',\
    \ 1);\nc.get('position.x'); // 5\nc.get('position.y'); // 9\n```\n\nOnce the position\
    \ has been modified and then saved, it will be passed through the `serialize`\
    \ function in our transform and be presented like an array in JSON. For `JSONSerializer`\
    \ to be used in an app, one has to define the `serializer:application` which is\
    \ just an extension of `JSONSerializer`. Consider the code given below which shows\
    \ this is done:\n\n```javascript\nexport default DS.JSONSerializer.extend({\n\
    \  // ...\n});\n```\n\nIn the case of some requests, the expected result should\
    \ have one record. It is expected that the response should be a JSON similar to\
    \ the one given below:\n\n```json\n{\n  \"id\": \"1\",\n  \"title\": \"Ember is\
    \ easy to Learn\",\n  \"tag\": \"rails\",\n  \"comments\": [\"1\", \"2\"]\n}\n\
    ```\n\nFor results to give 0 or more records, it is expected that the result should\
    \ be a JSON array which looks as follows:\n\n```json\n[{\n  \"id\": \"1\",\n \
    \ \"title\": \"Ember is easy to Learn\",\n  \"tag\": \"ember\",\n  \"comments\"\
    : [\"1\", \"2\"]\n}, {\n  \"id\": \"2\",\n  \"title\": \"When I was young, I aspired\
    \ to become an athlete!\",\n  \"tag\": \"w3c\",\n  \"comments\": [\"3\"]\n}]\n\
    ```\n\n## EmbeddedRecordMixin\n\nIn Ember data, we are encouraged to sideload\
    \ our relationships, but sometimes, when one is working with legacy APIs, one\
    \ may discover that they need to deal with JSON which contains relationships which\
    \ have been embedded inside other records. The `EmbeddedRecordsMixin` was created\
    \ for the purpose of solving this problem. To setup the embedded records, just\
    \ include the mixin during the process of extension of a serializer and then perform\
    \ a configuration of the embedded relationships.\n\nConsider a situation in which\
    \ the model `post` has an `author` record which looks follows:\n\n```json\n{\n\
    \  \"id\": \"1\",\n  \"title\": \"Ember is easy to Learn\",\n  \"tag\": \"ember\"\
    ,\n  \"authors\": [\n    {\n      \"id\": \"2\",\n      \"name\": \"Mark\"\n \
    \   }\n  ]\n}\n```\n\nThe relationship would then be defined as shown below:\n\
    \n```javascript\nexport default DS.JSONSerializer.extend(DS.EmbeddedRecordsMixin,\
    \ {\n  attrs: {\n    authors: {\n      serialize: 'records',\n      deserialize:\
    \ 'records'\n    }\n  }\n});\n```\n\nIn case you have defined yourself and you\
    \ need to serialize and deserialize the embedded relationship, the shorthand option\
    \ `{ embedded: 'always' }` can be used. Consider the following example which is\
    \ similar to the one given below:\n\n```javascript\nexport default DS.JSONSerializer.extend(DS.EmbeddedRecordsMixin,\
    \ {\n  attrs: {\n    authors: { embedded: 'always' }\n  }\n});\n```\n\nConsider\
    \ a situation in which you want to read an embedded record during the process\
    \ of extraction of a JSON payload, but you only need to include the id of the\
    \ relationship whenever you are serializing a record. This can easily be done\
    \ by use of the option `serialize: 'ids.'`. To opt out of serialization of the\
    \ relationship, you can use the option `serialize: false`. The code given below\
    \ demonstrates how this can be done:\n\n```javascript\nexport default DS.JSONSerializer.extend(DS.EmbeddedRecordsMixin,\
    \ {\n  attrs: {\n    author: {\n      serialize: false,\n      deserialize: 'records'\n\
    \    },\n    comments: {\n      deserialize: 'records',\n      serialize: 'ids'\n\
    \    }\n  }\n});\n```\n\n### EmbeddedRecordsMixin Defaults\n\nIf you do not need\
    \ to overwrite the property `attrs` for a particular relationship, then the following\
    \ will be the behavior of the `EmbeddedRecordsMixin`:\n\n- `BelongsTo: { serialize:\
    \ 'id', deserialize: 'id' }`\n- `HasMany: { serialize: false, deserialize: 'ids'\
    \ }`\n\n## Authoring Serializers\n"
