    Ember data expects that each record should have a unique id property in the payload.
    For each record of a specific type, the id should also be unique. If the backend
    had used a different key rather than the “id,” one can use the primary key property
    of the serializer so as to transform the id properly during the process of serialization
    and deserialization of the data. This is shown in the code given below:


    export default DS.JSONSerializer.extend({


     primaryKey: ''_id''


    });


    Attribute Names


    The convention in Ember data is to camelize the attribute names on a particular
    model. Consider the example given below:


    export default DS.Model.extend({


     fName: DS.attr(''string''),


     lName:  DS.attr(''string''),


     isPersonOfTheYear: DS.attr(''boolean'')


    });


    The “JSONAPISerializer” is expecting the attributes to be dasherized in a document
    payload returned by the server. This is shown in the code given below:


    {


     "data": {


       "id": "44",


       "type": "people",


       "attributes": {


         "first-name": "John",


         "last-name": "Joel",


         "is-person-of-the-year": true


       }


     }


    }


    In case the attributes returned by the server use a very different convention,
    one can use the method “keyForAttribute()” of the serializer for conversion of
    the attribute name in the model to a key in the JSON payload. Consider the code
    given below:


    export default DS.JSONAPISerializer.extend({


     keyForAttribute: function(attribute) {


       return Ember.String.underscore(attribute);


     }


    });


    A custom serializer can be used for mapping irregular keys. The object “attrs”
    can be used for the purpose of declaring a simple mapping between different property
    names in the DS. Consider the sample code given below:


    export default DS.Model.extend({


     lName: DS.attr(''string'')


    });


    What we have done is that we have created a custom serializer for our model and
    then overrode the property “attrs.” The next piece of code should be as follows:


    export default DS.JSONAPISerializer.extend({


     attrs: {


       lName: ''lastNameOfPerson''


     }


    });


    Relationships


    The ID property should be used for referencing to some other records. Consider
    a situation in which your model has the hasMany relationship shown below:


    export default DS.Model.extend({


     comments: DS.hasMany(''comment'', { async: true })


    });


    The JSON should then encode the relationship just as an array of types and IDs.
    This is shown in the code given below:


    {


     "data": {


       "type": "posts",


       "id": "1",


       "relationships": {


         "comments": {


           "data": [


             { "type": "comments", "id": "5" },


             { "type": "comments", "id": "12" }


           ]


         }


       }


     }


    }


    Consider a situation in which you have a model which is as follows:


    export default DS.Model.extend({


     origPost: DS.belongsTo(''post'')


    });


    The relationship should then be encoded by JSON into another record as an ID.
    This is shown in the code given below:


    {


     "data": {


       "type": "comment",


       "id": "1",


       "relationships": {


         "original-post": {


           "data": { "type": "post", "id": "5" },


         }


       }


     }


    }


    If these naming conventions are needed, then they can be overridden by use of
    the method “keyForRelationship.” Consider the code given below which best demonstrates
    this:


    export default DS.JSONAPISerializer.extend({


     keyForRelationship: function(key, relship) {


       return key + ''Ids'';


     }


    });


    Creation of Custom Transformations


    Under certain circumstances, built-in types such as the string, Boolean, and others
    may not be adequate for us to implement what we need. A good example of this is
    when a particular server gives you a non-standard date format.


    In Ember data, we may have new JSON transforms which have been registered to be
    used as attributes. The code given below best describes this:


    export default DS.Transform.extend({


     serialize: function(val) {


       return [value.get(''a''), value.get(''b'')];


     },


     deserialize: function(val) {


       return Ember.Object.create({ a: value[0], b: value[1] });


     }


    });


    The next code should then be as follows:


    export default DS.Model.extend({


     position: DS.attr(''coordinate-point'')


    });


    After receiving “coordinatePoint” from the API, it is expected to be an array
    as shown below:


    {


     cursor: {


       position: [5,9]


     }


    }


    Once it has been loaded on an instance of a model, it will act as an object as
    shown below:


    var c = store.findRecord(''cursor'', 1);


    c.get(''position.x''); //=> 5


    c.get(''position.y''); //=> 9


    Once the position has been modified and then saved, it will be passed through
    the function “serialize” in our transform and then be presented like an array
    in JSON.


    JSONSerializer


    For this to be used in an app, one has to define the “serializer:application”
    which is just an extension of JSONSerializer. Consider the code given below which
    shows how this is done:


    export default DS.JSONSerializer.extend({


     // ...


    });


    In the case of some requests, the expected result should have one record. It is
    expected that the response should be a JSON response with a format similar to
    the one given below:


    {


       "id": "1",


       "title": "Ember is easy to Learn",


       "tag": "rails",


       "comments": ["1", "2"]


    }


    For results expected to give 0 or more records, it is expected that the result
    should be a JSON array which looks as follows:


    [{


     "id": "1",


     "title": "Ember is easy to Learn",


     "tag": "ember",


     "comments": ["1", "2"]


    }, {


     "id": "2",


     "title": "When I was young, I aspired to become an athlete!",


     "tag": "w3c",


     "comments": ["3"]


    }]


    EmbeddedRecordMixin


    In Ember data, we are encouraged to sideload our relationships, but sometimes,
    when one is working with legacy APIs, one may discover that they need to deal
    with JSON which contains relationships which have been embedded inside other records.
    The “EmbeddedRecordsMixin” was created for the purpose of solving this problem.


    To setup the embedded records, just include the mixin during the process of extension
    of a serializer and then define and perform a configuration of the embedded relationships.


    Consider a situation in which the model “post” has a “author” record which looks
    as follows:


    {


       "id": "1",


       "title": "Ember is easy to Learn",


       "tag": "ember",


       "authors": [


           {


               "id": "2",


               "name": "Mark"


           }


       ]


    }


    The relationship would then be defined as shown below:


    export default DS.JSONSerializer.extend(DS.EmbeddedRecordsMixin, {


     attrs: {


       authors: {


         serialize: ''records'',


         deserialize: ''records''


       }


     }


    });


    In case you have defined yourself and you need to serialize and deserialize the
    embedded relationship, the shorthand option “{ embedded: ''always'' }” can be
    used. Consider the following example which is similar to the one given below:


    export default DS.JSONSerializer.extend(DS.EmbeddedRecordsMixin, {


     attrs: {


       authors: { embedded: ''always'' }


     }


    });


    Consider a situation in which you want to read an embedded record during the process
    of extraction of a JSON payload, but you only need to include the id of the relationship
    whenever you are serializing a record. This can easily be done by use of the option
    “serialize: ''ids.''” To opt out of serialization of the relationship, you can
    use the option “serialize: false.” The code given below demonstrates how this
    can be done:


    export default DS.JSONSerializer.extend(DS.EmbeddedRecordsMixin, {


     attrs: {


       author: {


         serialize: false,


         deserialize: ''records''


       },


       comments: {


         deserialize: ''records'',


         serialize: ''ids''


       }


     }


    });


    ### EmbeddedRecordsMixin Defaults


    If you do not need to overwrite the property “attrs” for a particular relationship,
    then the following will be the behavior of the “EmbeddedRecordsMixin”:


    BelongsTo: { serialize: ''id'', deserialize: ''id'' }


    HasMany: { serialize: false, deserialize: ''ids'' }


    Authoring Serializers'
