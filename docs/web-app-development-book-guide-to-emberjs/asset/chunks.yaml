  trans: "\n\n# 关系\n\n要移除一个 `belongsTo` 关系，我们只需要将其设置为 `null`。这将将其从 `hasMany` 关系的一侧移除。考虑下面的代码，它最直观地演示了这一点：\n\
    \n```javascript\nlet comm = this.store.peekRecord('comment', 1);\ncomm.set('post',\
    \ null);\ncomm.save();\n```\n\n记录也可以从 `hasMany` 关系中移除。考虑下面的代码，它很好地展示了如何实现：\n\n\
    ```javascript\nlet p = this.store.peekRecord('post', 1);\nlet comm = this.store.peekRecord('comment',\
    \ 1);\np.get('comments').removeObject(comm);\np.save();\n```\n\n### 作为 Promise\
    \ 的关系\n\n每当你处理关系时，最好始终记住这些关系将返回 promise（承诺）。假设我们要处理某篇文章的异步评论，我们应该等待直到 promise\
    \ 已完成（fulfilled）。考虑下面的代码：\n\n```javascript\nlet p = this.store.peekRecord('post',\
    \ 1);\np.get('comments').then((comments) => {\n  // 我们现在可以处理这些评论了\n});\n```\n\n\
    同样的规则也适用于 `hasMany` 关系，如下所示：\n\n```javascript\nlet comm = this.store.peekRecord('comment',\
    \ 1);\ncomm.get('post').then((p) => {\n  // 文章在这里将可用\n});\n```\n\nHandlebars 模板会自动更新，以反映已解析的\
    \ promise。如下所示，文章中显示评论列表：\n\n```html\n<ul>\n  {{#each p.comments as |comm|}}\n\
    \    <li>{{comm.id}}</li>\n  {{/each}}\n</ul>\n```\n\n---\n\n# 将记录推入 Store（存储器）\n\
    \nStore 可以被看作是一个缓存，包含了应用已加载的所有记录。\n\n要将记录推入 store，你只需要调用 `push()` 方法。考虑这样一种情况：在应用首次启动后，我们需要向\
    \ store 中预加载一些数据。这可以通过 `route:application` 轻松实现。考虑下面的代码：\n\n```javascript\nexport\
    \ default DS.Model.extend({\n  title: DS.attr(),\n  artist: DS.attr(),\n  songCount:\
    \ DS.attr()\n});\n```\n\n考虑接下来这段代码：\n\n```javascript\nexport default Ember.Route.extend({\n\
    \  model() {\n    this.store.push({\n      data: [\n        {\n          id: 1,\n\
    \          type: 'album',\n          attributes: {\n            title: 'Very Few\
    \ Moving Parts',\n            artist: 'John Joel',\n            songCount: 5\n\
    \          },\n          relationships: {}\n        }, {\n          id: 2,\n \
    \         type: 'album',\n          attributes: {\n            title: 'Our God\
    \ is Great all the time',\n            artist: 'Steve John',\n            songCount:\
    \ 3\n          },\n          relationships: {}\n        }\n      ]\n    });\n\
    \  }\n});\n```\n\n如果数据在推入 store 之前需要通过模型的默认序列化器（serializer）进行归一化，可以使用 `store.pushPayload()`\
    \ 方法。下面的代码对此这一点：\n\n```javascript\nexport default DS.RestSerializer.extend({\n\
    \  normalize(typeHash, hash) {\n    hash['songCount'] = hash['song_count']\n \
    \   delete hash['song_count']\n    return this._super(typeHash, hash);\n  }\n\
    })\n```\n\n接下来的代码应该如下：\n\n```javascript\nexport default Ember.Route.extend({\n\
    \  model() {\n    this.store.pushPayload({\n      albums: [\n        {\n     \
    \     id: 1,\n          title: 'Very Fever Moving Parts',\n          artist: 'John\
    \ Joel',\n          song_count: 5\n        },\n        {\n          id: 2,\n \
    \         title: 'Our God is Great all the time',\n          artist: 'Steve John',\n\
    \          song_count: 2\n        }\n      ]\n    });\n  }\n});\n```\n\n在处理复杂的端点（endpoints）时，`push()`\
    \ 方法非常重要。你的应用程序可能有一个端点负责执行某些业务逻辑并创建多条记录。下面的代码最好地演示了这一点：\n\n```javascript\nexport\
    \ default Ember.Route.extend({\n  actions: {\n    confirm: function(d) {\n   \
    \   $.ajax({\n        data: d,\n        method: 'POST',\n        url: 'process-payment'\n\
    \      }).then((digInventory) => {\n        this.store.pushPayload(digInventory);\n\
    \        this.transitionTo('Thanks');\n      });\n    }\n  }\n});\n```\n\n---\n\
    \n# 处理元数据（MetaData）\n\n除了从 store 返回的记录外，还需要处理某种形式的元数据。元数据只是伴随特定模型或类型（而非特定记录）的一种数据。\n\
    \n分页是元数据的一种常用方式。考虑一个有很多文章的博客，它们无法一次性显示。可以如下所示进行查询：\n\n```javascript\nlet res =\
    \ this.store.query('post', {\n  limit: 10,\n  offset: 0\n});\n```\n\n为了获取不同页的数据，可以更改\
    \ offset。为了让我们获取元数据，期望格式如下：\n\n```json\n{\n  \"post\": {\n    \"links\": {\n \
    \     \"user\": \"/posts\"\n    },\n    \"meta\": {\n      \"total\": 100\n  \
    \  }\n  }\n}\n```\n\n无论使用哪种序列化器，都可以使用 `.get('meta')`。这可以应用于 `query()` 调结果。示例所示：\n\
    \n```javascript\n// 设置查询\nstore.query('post', {\n  limit: 10,\n  offset: 0\n}).then((res)\
    \ => {\n  let meta = res.get('meta');\n});\n```\n\n如果我们有一个 `belongsTo` 关系，可以这样做：\n\
    \n```javascript\nlet p = this.store.peekRecord('post', 1);\np.get('author').then((author)\
    \ => {\n  let meta = author.get('meta');\n});\n```\n\n在 `hasMany` 关系上，可以这样做：\n\
    \n```javascript\nlet p = this.store.peekRecord('post', 1);\np.get('comments').then((comments)\
    \ => {\n  let meta = comments.get('meta');\n});\n```\n\n---\n\n# 适配器（Adapters）的自定义\n\
    \n在 Ember data 中，适配器（Adapter）负责数据如何持久化，例如 URL 格式和头部。\n\n对于具有一致规则的端点，可以定义 `adapter:application`。它的优先级高于默认适配器，但会被特定模型的适配器所覆盖。如下代码所示：\n\
    \n```javascript\nexport default DS.JSONAPIAdapter.extend({\n  // 应用特定的重写写在这里\n\
    });\n```\n\n对于在通信方面具有特定规则的模型，可以通过执行命令 `ember generate adapter name` 创建特定模型的适配器。一个很好的例子是当你运行\
    \ `ember generate adapter post` 时，将创建以下文件：\n\n```javascript\nexport default DS.JSONAPIAdapter.extend({\n\
    \  namespace: 'api/v1'\n});\n```\n\n默认情况下，Ember data 自带多个适配器。如果你需要创建自定义适配器，可以使用这些作为起点。\n\
    \n### URL 规范\n\n`JSONAPIAdapter` 适配器在根据模型类型确定通信使用的 URL 方面非常好。考虑下面通过 ID 请求文章的示例：\n\
    \n```javascript\nstore.find('post', 1).then(function(p) {\n\n});\n```\n\n### 复数自定义\n\
    \n有时，在生成路由 URL 时，你可能需要处理模型名称的复数化。可以使用反射器（reflector）来实现此目的。这是一个用于单复数形式之间转换的库。对于不可数或不规则的复数，可以使用\
    \ `Ember.Inflector.inflector`。如下所示 easily 实现：\n\n```javascript\n// 设置 Ember.Inflector\n\
    import './models/custom-inflector-rules';\n```\n\n接下来的代码如下：\n\n```javascript\n\
    import Inflector from 'ember-inflector';\n\nconst inflect = Inflector.inflector;\n\
    \ninflect.irregular('formula', 'formulae');\n\ninflect.uncountable('advice');\n\
    \n// 符合 Ember Inspector 导出的期望\nexport default {};\n```\n\n### 自定义端点路径\n\n`namespace`\
    \ 属性将用于为具有特定 URL 命名空间的请求添加前缀。\n\n"
- fmt: "\n```javascript\nexport default DS.JSONAPIAdapter.extend({\n  namespace: 'api/1'\n\
    });\n```\nThat is how it can be done.\n\n# Host Customizations\n\nThe adapter\
    \ targets the current domain by default. If you are in need of specifying a new\
    \ domain, you just have to set the property `host` on the new adapter. The code\
    \ given below best shows how this can be done:\n\n```javascript\nexport default\
    \ DS.JSONAPIAdapter.extend({\n  host: 'https://api.sample.com'\n});\n```\nThat\
    \ is it.\n\n# Path Customizations\n\nThe method `pathForType` can be overridden\
    \ as shown in the code given below:\n\n```javascript\nexport default DS.JSONAPIAdapter.extend({\n\
    \  pathForType: function(type) {\n    return Ember.String.underscore(type);\n\
    \  }\n});\n```\n\nIn the above case, we did not need to pluralize the names of\
    \ the model, and we needed to use the underscore rather than the `camelCase`.\n\
    \n# Headers Customizations\n\nSome APIs need HTTP headers, and a good example\
    \ is when there is a need for provision of an API key. Arbitrary headers can then\
    \ be set as the key/value pairs on the `header` object of the `JSONAPIAdapter`,\
    \ and the Ember data will send along each of our Ajax requests. Consider the code\
    \ given below:\n\n```javascript\nexport default DS.JSONAPIAdapter.extend({\n \
    \ headers: {\n    'API_KEY': 'secret key',\n    'ANOTHER_HEADER': 'A header value'\n\
    \  }\n});\n```\n\nOne can also use `headers` as the computed property for the\
    \ purpose of supporting dynamic headers. Consider the example given below in which\
    \ the headers will be generated by use of computed property depending on the session\
    \ service. Here is the code for the example:\n\n```javascript\nexport default\
    \ DS.JSONAPIAdapter.extend({\n  session: Ember.inject.service('session'),\n  headers:\
    \ Ember.computed('session.authToken', function() {\n    return {\n      'API_KEY':\
    \ this.get('session.authToken'),\n      'ANOTHER_HEADER': 'A header value'\n \
    \   };\n  })\n});\n```\n\nIn some cases, the dynamic headers will need some data\
    \ from the object outside the observer system of the Ember. The `volatile` function\
    \ can also be used for the purpose of setting the property into a non-cached mode\
    \ which will cause re-computation of the headers with each request. This is shown\
    \ in the code given below:\n\n```javascript\nexport default DS.JSONAPIAdapter.extend({\n\
    \  headers: Ember.computed(function() {\n    return {\n      'API_KEY': Ember.get(document.cookie.match(/apiKey\\\
    =([^;]*)/), '1'),\n      'ANOTHER_HEADER': 'A header value'\n    };\n  }).volatile()\n\
    });\n```\n\n# Authoring Adapters\n\nThe property `defaultSerializer` will be used\
    \ for the purpose of specifying the serializer which will be used by the adapter.\
    \ This is only used when a `serializer:application` or a model specific adapter\
    \ has not been specified. Specification of the `serializer:application` is very\
    \ easy in any application. Consider the example given below demonstrating how\
    \ this can be done:\n\n```javascript\nexport default DS.JSONAPIAdapter.extend({\n\
    \  defaultSerializer: '-default'\n});\n```\n\n# Customizing Serializers\n\nIn\
    \ Ember data, serializers are used for formatting data which is sent to and received\
    \ from our backend store. The default setting is that the Ember data will use\
    \ the JSON API format for serialization of data.\n\n## JSON API Document\n\nConsider\
    \ the response given below for our request:\n\n```json\n{\n  \"data\": {\n   \
    \ \"type\": \"people\",\n    \"id\": \"567\",\n    \"attributes\": {\n      \"\
    first-name\": \"John\",\n      \"last-name\": \"Joel\"\n    }\n  }\n}\n```\n\n\
    In the above example, we have a response from a request to `/people/567.` A response\
    \ having multiple records can have an array in the `data` property as shown below:\n\
    \n```json\n{\n  \"data\": [{\n    \"type\": \"people\",\n    \"id\": \"567\",\n\
    \    \"attributes\": {\n      \"first-name\": \"John\",\n      \"last-name\":\
    \ \"Joel\"\n    }\n  }, {\n    \"type\": \"people\",\n    \"id\": \"345\",\n \
    \   \"attributes\": {\n      \"first-name\": \"Mercy\",\n      \"last-name\":\
    \ \"Donald\"\n    }\n  }]\n}\n```\n\n## Sideloaded Data\n\nThis is a type of data\
    \ which is not part of a primary request but has some linked relationships which\
    \ should be added in an array under the key `included`. Consider the code given\
    \ below:\n\n```json\n{\n  \"data\": {\n    \"type\": \"blogs\",\n    \"id\": \"\
    1\",\n    \"attributes\": {\n      \"title\": \"I really like and enjoy blogging!\"\
    \n    },\n    \"links\": {\n      \"self\": \"http://mysite.com/blogs/1\"\n  \
    \  },\n    \"relationships\": {\n      \"comments\": {\n        \"data\": [\n\
    \          { \"type\": \"comments\", \"id\": \"5\" },\n          { \"type\": \"\
    comments\", \"id\": \"12\" }\n        ]\n      }\n    }\n  },\n  \"included\"\
    : [{\n    \"type\": \"comments\",\n    \"id\": \"5\",\n    \"attributes\": {\n\
    \      \"body\": \"First!\"\n    },\n    \"links\": {\n      \"self\": \"http://mysite.com/comments/5\"\
    \n    }\n  }, {\n    \"type\": \"comments\",\n    \"id\": \"12\",\n    \"attributes\"\
    : {\n      \"body\": \"Ember is very easy to learn\"\n    },\n    \"links\": {\n\
    \      \"self\": \"http://mysite.com/comments/12\"\n    }\n  }]\n}\n```\n\nIn\
    \ the example given above, we have requested `/blogs/1` and the user also gave\
    \ us the comments which are associated with the person. The above code shows the\
    \ response that we.\n\n# Customizing Serializers\n\nIn Ember data, `Serializer`\
    \ is used by default, but a custom serializer can be used for the purpose. A custom\
    \ serializer can be defined in two ways. One can choose to define a serializer\
    \ for the entire `application`.\n\n```javascript\nimport DS from 'ember-data';\n\
    export default DS.Serializer.extend({\n  serialize(snapshot, opts) {\n    var\
    \ json = this._super(...arguments);\n    json.data.attributes.cost = {\n     \
    \ amount: json.data.attributes.amount,\n      currency: json.data.attributes.currency\n\
    \    };\n    delete json.data.attributes.amount;\n    delete json.data.attributes.currency;\n\
    \    return json;\n  },\n});\n```\n\nOne can also define a serializer for a specific\
    \ model.\n\n```javascript\nimport DS from 'ember-data';\nexport default DS.Serializer.extend({\n\
    \  serialize(snapshot, opts) {\n    var json = this._super(...arguments);\n  \
    \  json.data.attributes.cost = {\n      amount: json.data.attributes.amount,\n\
    \      currency: json.data.attributes.currency\n    };\n    delete json.data.attributes.amount;\n\
    \    delete json.data.attributes.currency;\n    return json;\n  },\n});\n```\n\
    \nThe data can then be changed as shown below:\n\nIn case the server will provide\
    \ us with data which looks as follows:\n\n```json\n{\n  \"data\": {\n    \"attributes\"\
    : {\n      \"id\": \"1\",\n      \"name\": \"The Product\",\n      \"cost\": {\n\
    \        \"amount\": 200,\n        \"currency\": \"USD\"\n      }\n    },\n  \
    \  \"type\": \"product\"\n  }\n}\n```\n\nThe above should be changed to the following:\n\
    \n```json\n{\n  \"data\": {\n    \"attributes\": {\n      \"id\": \"1\",\n   \
    \   \"name\": \"The Product\",\n      \"amount\": 200,\n      \"currency\": \"\
    USD\"\n    },\n    \"type\": \"product\"\n  }\n}\n```\n\nIt should then be done\
    \ as shown below:\n\n```javascript\nimport DS from 'ember-data';\nexport default\
    \ DS.JSONSerializer.extend({\n  normalizeResponse(store, primModelClass, payload,\
    \ id, reqType) {\n    payload.data.attributes.amount = payload.data.attributes.cost.amount;\n\
    \    payload.data.attributes.currency = payload.data.attributes.cost.currency;\n\
    \    delete payload.data.attributes.cost;\n    return this._super(...arguments);\n\
    \  },\n});\n```\n"
