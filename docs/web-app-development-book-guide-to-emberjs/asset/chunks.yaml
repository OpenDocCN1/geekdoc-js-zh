- fmt: "\n![](images/00001.jpeg)\n\n# Web App Development Book\nGuide to Ember.js\n\
    David V.\n\nCopyright©2016 by David V\nAll Rights Reserved\n\nCopyright © 2016\
    \ by David V\nAll rights reserved. No part of this publication may be reproduced,\
    \ distributed, or transmitted in any form or by any means, including photocopying,\
    \ recording, or other electronic or mechanical methods, without the prior written\
    \ permission of the author, except in the case of brief quotations embodied in\
    \ critical reviews and certain other noncommercial uses permitted by copyright\
    \ law.\n\n## Table of Contents\n- [Introduction](#introduction)\n- [Chapter 1-\
    \ Controllers](#chapter-1-controllers)\n- [Chapter 2- Models](#chapter-2-models)\n\
    - [Chapter 3- Application Concerns](#chapter-3-application-concerns)\n- [Conclusion](#conclusion)\n\
    \n## Disclaimer\nWhile all attempts have been made to verify the information provided\
    \ in this book, the author does assume any responsibility for errors, omissions,\
    \ or contrary interpretations of the subject matter contained within. The information\
    \ provided in this book is for educational and entertainment purposes only. The\
    \ reader is responsible for his or her own actions and the author does not accept\
    \ any responsibilities for any liabilities or damages, real or perceived, resulting\
    \ from the use of this information.\n\nThe trademarks that are used are without\
    \ any consent, and the publication of the trademark is without permission or backing\
    \ by the trademark owner. All trademarks and brands within this book are for clarifying\
    \ purposes only and are the owned by the owners themselves, not affiliated with\
    \ this document.\n\n## Introduction\nThere is an increase in the demand for web\
    \ apps. Ember JS is a JavaScript which can assist in development of such apps.\
    \ The framework is easy to learn, and especially for JavaScript experts. However,\
    \ even if you are not good in JavaScript at all, you don’t have to worry, as the\
    \ explanations in this book are very easy for you to understand. With this JavaScript,\
    \ you can create web apps with very interactive user interfaces, and your users\
    \ will definitely like your apps.\n\n## Chapter 1- Controllers\nControllers are\
    \ much like components, and it is believed that these will be replaced by components\
    \ in the future.\n\nIn most of the current apps, controllers are not used much.\
    \ When they are used, they are tasked with the following responsibilities:\n\n\
    1. Used for maintaining state based on the route in use currently.\n2. When the\
    \ user actions are passing from a component to a route, they have to pass through\
    \ a controller.\n\nWe need to demonstrate this by use of a route which will help\
    \ us display a blog post.\n\nThe template will be bound to the following properties\
    \ in the template:\n\n```html\n<h1>{{model.title}}</h1>\n<h2>by {{model.author}}</h2>\n\
    <div class=\"intro\">\n  {{model.intro}}\n</div>\n<hr>\n<div class=\"body\">\n\
    \  {{model.body}}\n</div>\n```\n\nAs shown in the above example, we do not have\
    \ specific properties or actions to display.\n\nSuppose that we need to add a\
    \ feature which will allow the user to toggle between the displays of your body\
    \ sections. For us to implement this, we would modify the code to the following:\n\
    \n```html\n<h1>{{model.title}}</h1>\n<h2>by {{model.author}}</h2>\n<div class='intro'>\n\
    \  {{model.intro}}\n</div>\n<hr>\n\n{{#if isExpanded}}\n  <button {{action \"\
    toggleBody\"}}>Hide the Body</button>\n  <div class=\"body\">\n    {{model.body}}\n\
    \  </div>\n{{else}}\n  <button {{action \"toggleBody\"}}>Show the Body</button>\n\
    {{/if}}\n```\n\nIn the “actions” hook of our controller, we can define what our\
    \ action will be doing as we can do it with a component. This is shown in the\
    \ code given below:\n\n```javascript\nexport default Ember.Controller.extend({\n\
    \  actions: {\n    toggleBody() {\n      this.toggleProperty('isExpanded');\n\
    \    }\n  }\n});\n```\n\n### Management of Dependencies between Controllers\n\
    Sometimes, when we are nesting resources, we usually need to establish a connection\
    \ between two controllers. Consider the router given below:\n\n```javascript\n\
    Router.map(function() {\n  this.route('post', { path: '/p/:post_id' }, function()\
    \ {\n    this.route('comments', { path: '/comments' });\n  });\n});\n```\n\nOn\
    \ visiting the URL `/posts/1/comments`, the model `post` will be loaded into the\
    \ model of the `PostController`. However, some information related to it might\
    \ be displayed in the template for `comments`.\n\nFor us to do this, we have to\
    \ inject the `pController` into our `CommentsController`. This is shown below:\n\
    \n```javascript\nexport default Ember.Controller.extend({\n  pController: Ember.inject.controller('post')\n\
    });\n```\n\nOur comments will be in a position to access the `PController`, which\
    \ is a read-only alias which can be used for reading the model from the controller.\
    \ Consider the code given below:\n\n```javascript\nexport default Ember.Controller.extend({\n\
    \  pController: Ember.inject.controller('post'),\n  post: Ember.computed.reads('pController.model')\n\
    });\n```\n\nConsider the next one for the `.hbs` file:\n\n```html\n<h1>Comments\
    \ for the {{post.title}}</h1>\n<ul>\n  {{#each model as |comment|}}\n    <li>{{comment.text}}</li>\n\
    \  {{/each}}\n</ul>\n```\n\n## Chapter 2- Models\nOne of the ways to build web\
    \ applications is to implement user interface components which are highly coupled\
    \ to data fetching.\n\nConsider a situation in which you are creating a blog app.\
    \ If you are creating the admin part of the app, you may be forced to give the\
    \ component the responsibility of fetching and storing the data. Consider the\
    \ code given below:\n\n```html\n<h1>Comments for {{post.title}}</h1>\n<ul>\n \
    \ {{#each model as |comment|}}\n    <li>{{comment.text}}</li>\n  {{/each}}\n</ul>\n\
    ```\n\nThe list of drafts contained in the template can then be shown. The following\
    \ code demonstrates this:\n\n```html\n<ul>\n  {{#each drafts key=\"id\" as |draft|}}\n\
    \    <li>{{draft.title}}</li>\n  {{/each}}\n</ul>\n```\n\nNote that the app is\
    \ made up of a number of components. You may want to have all of the drafts on\
    \ another page. This may require copying and pasting the old code into the new\
    \ component:\n\n```javascript\nexport default Ember.Component.extend({\n  willRender()\
    \ {\n    $.getJSON('/myDrafts').then(data => {\n      this.set('drafts', data);\n\
    \    });\n  }\n});\n```\n\nThe `.hbs` file for the button should be as follows:\n\
    \n```html\n{{#link-to 'drafts' tagName=\"button\"}}\ns ({{drafts.length}})\n{{/link-to}}\n\
    ```\n\nWith the above, our app will make two requests which are separate but for\
    \ the same information.\n\nIn Ember data, the representation of a model is done\
    \ using a subclass of the model which defines the relationships, attributes, and\
    \ the behavior of the data which is presented to the user. With models, one can\
    \ define the kind of data which the server will provide to us. Consider the example\
    \ given below of a model named `human`:\n\n```javascript\nexport default DS.Model.extend({\n\
    \  fName: DS.attr('string'),\n  birthday: DS.attr('date')\n});\n```\n\nA model\
    \ can also describe the relationship between itself and the rest of the models.\
    \ Consider the example given below, which shows how this can be done:\n\n```javascript\n\
    export default DS.Model.extend({\n  lItems: DS.hasMany('line-item')\n});\n```\n\
    \nThe above code is for an order. The code for `line.js` should be as follows:\n\
    \n```javascript\nexport default DS.Model.extend({\n  order: DS.belongsTo('order')\n\
    });\n```\n\nYou have to note that the models themselves do not have data, but\
    \ they are used for definition of the attributes, relationships, and the behavior\
    \ of specific instances referred to as `records`.\n\n### Creating Records\nWhen\
    \ you need to create records, you just have to call the method `createRecord()`\
    \ on your store. Consider the code given below:\n\n```javascript\nstore.createRecord('post',\
    \ {\n  title: 'Ember is a Great Framework',\n  body: 'Lorem ipsum'\n});\n```\n\
    \nThe stored object will be available to the controllers and the routers by use\
    \ of `this.store`.\n\n### Updating Records\nYou can make changes to the Ember\
    \ JS data records by setting the attribute which you are in need of changing.\
    \ This is shown in the code given below:\n\n```javascript\nthis.store.findRecord('human',\
    \ 1).then(function(myfunction) {\n  // ...once the record has been loaded\n});\n\
    ```\n"
