  trans: "\n\n如果你需要跟踪存储（store）中包含的唯一记录，Ember data 要求每个记录在负载（payload）中应该有一个唯一的 `id`\
    \ 属性。对于特定类型的每条记录，`id` 也应该是唯一的。如果后端使用的键不是 `id`，则可以使用序列化器（serializer）的主键属性，以便在数据的序列化和反序列化过程中正确转换\
    \ `id`。下文代码所示：\n\n```javascript\nexport default DS.JSONSerializer.extend({\n \
    \ primaryKey: '_id'\n});\n```\n\n## 属性名称 (Attribute Names)\n\nEmber data 的约定是将特定模型上的属性名称驼峰命名化（camelize）。考虑下面的示例：\n\
    \n```javascript\nexport default DS.Model.extend({\n  fName: DS.attr('string'),\n\
    \  lName:  DS.attr('string'),\n  isPersonOfTheYear: DS.attr('boolean')\n});\n\
    ```\n\n`JSONAPISerializer` 期望服务器返回的文档负载中的属性是短横线命名法（dasherized）的。下文代码所示：\n\n```json\n\
    {\n  \"data\": {\n    \"id\": \"44\",\n    \"type\": \"people\",\n    \"attributes\"\
    : {\n      \"first-name\": \"John\",\n      \"last-name\": \"Joel\",\n      \"\
    is-person-of-the-year\": true\n    }\n  }\n}\n```\n\n如果服务器返回的属性使用了非常不同的约定，可以使用序列化器的\
    \ `keyForAttribute()` 方法将模型中的属性名转换为 JSON 负载中的键。考虑下面的代码：\n\n```javascript\nexport\
    \ default DS.JSONAPISerializer.extend({\n  keyForAttribute: function(attribute)\
    \ {\n    return Ember.String.underscore(attribute);\n  }\n});\n```\n\n可以使用自定义序列化器来映射不规则的键。对象\
    \ `attrs` 可用于在 `DS` 的不同属性名之间声明一个简单的映射。考虑下面的示例代码：\n\n```javascript\nexport default\
    \ DS.Model.extend({\n  lName: DS.attr('string')\n});\n```\n\n我们所做的是为我们的模型创建了一个自定义序列化器，然后覆盖了\
    \ `attrs` 属性。接下来的代码应该如下：\n\n```javascript\nexport default DS.JSONAPISerializer.extend({\n\
    \  attrs: {\n    lName: 'lastNameOfPerson'\n  }\n});\n```\n\n## 关系 (Relationships)\n\
    \n`ID` 属性应用于引用其他记录。考虑你的模型具有所示的 `hasMany` 关系：\n\n```javascript\nexport default\
    \ DS.Model.extend({\n  comments: DS.hasMany('comment', { async: true })\n});\n\
    ```\n\n此时 JSON 应该将关系编码为类型和 ID 的数组。下文代码所示：\n\n```json\n{\n  \"data\": {\n    \"\
    type\": \"posts\",\n    \"id\": \"1\",\n    \"relationships\": {\n      \"comments\"\
    : {\n        \"data\": [\n          { \"type\": \"comments\", \"id\": \"5\" },\n\
    \          { \"type\": \"comments\", \"id\": \"12\" }\n        ]\n      }\n  \
    \  }\n  }\n}\n```\n\n考虑你拥有如下所示模型的情况：\n\n```javascript\nexport default DS.Model.extend({\n\
    \  origPost: DS.belongsTo('post')\n});\n```\n\n那么该关系应该被 JSON 编码为另一个记录的 ID。下文代码所示：\n\
    \n```json\n{\n  \"data\": {\n    \"type\": \"comment\",\n    \"id\": \"1\",\n\
    \    \"relationships\": {\n      \"original-post\": {\n        \"data\": { \"\
    type\": \"post\", \"id\": \"5\" },\n      }\n    }\n  }\n}\n```\n\n如果需要这些命名约定，则可以使用\
    \ `keyForRelationship` 方法进行覆盖。下文代码最清楚地演示了这一点：\n\n```javascript\nexport default\
    \ DS.JSONAPISerializer.extend({\n  keyForRelationship: function(key, relship)\
    \ {\n    return key + 'Ids';\n  }\n});\n```\n\n## 创建自定义转换 (Creation of Custom\
    \ Transformations)\n\n在某些情况下，内置类型（如 string、`Boolean` 等）可能不足以让我们实现我们所需的内容。一个很好的例子是特定的服务器给你提供了非标准的日期格式。\n\
    \n在 Ember data 中，我们可能有新的 JSON 转换被注册用于作为属性。下文代码最好地描述了这一点：\n\n```javascript\nexport\
    \ default DS.Transform.extend({\n  serialize: function(val) {\n    return [value.get('a'),\
    \ value.get('b')];\n  },\n  deserialize: function(val) {\n    return Ember.Object.create({\
    \ a: value[0], b: value[1] });\n  }\n});\n```\n\n接下来的代码应该如下：\n\n```javascript\n\
    export default DS.Model.extend({\n  position: DS.attr('coordinate-point')\n});\n\
    ```\n\n从 API 接收到 `coordinatePoint` 后，预期是一个如下所示的数组：\n\n```json\n{\n  \"cursor\"\
    : {\n    \"position\": [5,9]\n  }\n}\n```\n\n一旦它加载到模型实例上，它将像下面所示作为一个对象：\n\n```javascript\n\
    var c = store.findRecord('cursor', 1);\n```\n\n"
- fmt: "\nFor those who need to create a custom serializer, we are encouraged to start\
    \ with a `JSONAPISerializer` or a `JSONSerializer`, and then extend one of these\
    \ so as to match our needs. However, in case the payload is different from one\
    \ of the serializers, consider a situation in which you are given the model “posts”\
    \ which is given below:\n\n```javascript\nexport default DS.Model.extend({\n \
    \ title: DS.attr('string'),\n  tag: DS.attr('string'),\n  comments: hasMany('comment',\
    \ { async: false }),\n  relatedPosts: hasMany('blogs')\n});\n```\n\nThe `store.push`\
    \ will then accept an object which is as follows:\n\n```json\n{\n  data: {\n \
    \   id: \"1\",\n    type: 'post',\n    attributes: {\n      title: \"Ember is\
    \ easy to Learn\",\n      tag: \"ember\",\n    },\n    relationships: {\n    \
    \  comments: {\n        data: [{ id: \"1\", type: 'comment' },\n             \
    \   { id: \"2\", type: 'comment' }],\n      },\n      relatedPosts: {\n      \
    \  data: {\n          related: \"/api/v1/blogs/1/related-posts/\"\n        }\n\
    \      }\n    }\n}\n```\n\nFor each serialized record to be convertible into an\
    \ Ember data record, the above format must be followed.\n\n# Chapter 3- Application\
    \ Concerns\n\n## Dependency Injection\n\nThis technique is used in EmberJS for\
    \ declaration and instantiation of a class of objects and the dependencies between\
    \ them. Applications and the instances of applications will serve a role in the\
    \ DI implementation of Ember.\n\n## Factory Registrations\n\nA factory can be\
    \ used for representation of part of an app, such as a template, a route, or a\
    \ custom class. A good example of this is the index template which is registered\
    \ with the key “template:index.”\n\nNote that factory registrations have to be\
    \ done inside an application or in application instance initializers, but the\
    \ former way is much more common.\n\nConsider the example given below, which shows\
    \ how an application initialize can register a “logger” factory using the key\
    \ “logger:main”:\n\n```javascript\nexport function initialize(app) {\n  var Logger\
    \ = Ember.Object.extend({\n    log(n) {\n      console.log(n);\n    }\n  });\n\
    \  app.register('logger:main', Logger);\n}\n\nexport default {\n  name: 'logger',\n\
    \  initialize: initialize\n};\n```\n\n## Registering Instantiated Objects\n\n\
    The default setting is that Ember attempts to instantiate a registered factory\
    \ after looking up. During the process of registration of object of a particular\
    \ class, you have to use the option `instantiate: false` so that you can avoid\
    \ it being re-instantiated during look up. In the example given below, `logger`\
    \ is an object in JavaScript which should be returned as it is during look up.\
    \ Here is the code:\n\n```javascript\nexport function initialize(app) {\n  var\
    \ logger = {\n    log(n) {\n      console.log(n);\n    }\n  };\n  app.register('logger:main',\
    \ logger, { instantiate: false });\n}\n\nexport default {\n  name: 'logger',\n\
    \  initialize: initialize\n};\n```\n\n## Singletons vs. Non-Singletons Registration\n\
    \nIn Ember data, registrations are seen as singletons. This means that an instance\
    \ has to be created after looking up, and the same instance will be cached and\
    \ returned from the following lookups. In the example given below, `message` will\
    \ be registered as non-singleton:\n\n```javascript\nexport function initialize(app)\
    \ {\n  var Msge = Ember.Object.extend({\n    text: ''\n  });\n  app.register('notification:message',\
    \ Msge, { singleton: false });\n}\n\nexport default {\n  name: 'notification',\n\
    \  initialize: initialize\n};\n```\n\n## Factory Injections\n\nOnce the registration\
    \ of the factory has been done, we can inject it when we need. Injection of factories\
    \ can be done in whole types of the factories. Consider the example given below:\n\
    \n```javascript\nexport function initialize(app) {\n  var Logger = Ember.Object.extend({\n\
    \    log(n) {\n      console.log(n);\n    }\n  });\n  app.register('logger:main',\
    \ Logger);\n  app.inject('route', 'logger', 'logger:main');\n}\n\nexport default\
    \ {\n  name: 'logger',\n  initialize: initialize\n};\n```\n\nDue to this kind\
    \ of type injection, the factories of type `route` will be instantiated with the\
    \ `logger` which has been injected. The `logger` value will be obtained from the\
    \ factory with the name `logger:main`. Consider the example given below which\
    \ shows how the app can be accessed by the injected logger. Here is the example:\n\
    \n```javascript\nexport default Ember.Route.extend({\n  activate() {\n    // The\
    \ property logger is injected into all the routes\n    this.get('logger').log('Entered\
    \ your route!');\n  }\n});\n```\n\nWhen using a full key, the injections can be\
    \ made on a full key as shown below:\n`app.inject('route:index', 'logger', 'logger:main');`\n\
    \n## Ad Hoc Injections\n\nDependency injections are declared directly on the Ember\
    \ classes by the use of `Ember.inject`. Currently, this property is in support\
    \ of injection of services and controllers. Consider the code given below which\
    \ shows how the service `shopping-cart` can be injected on the component `cart-contents`\
    \ as the `cart` property. Here is the code:\n\n```javascript\nexport default Ember.Component.extend({\n\
    \  cart: Ember.inject.service('shopping-cart')\n});\n```\n\nIf you are in need\
    \ of injecting a service with similar name as the property, just leave off the\
    \ name of the service. The code given below demonstrates this:\n\n```javascript\n\
    export default Ember.Component.extend({\n  shoppingCart: Ember.inject.service()\n\
    });\n```\n\nInstance initializers usually receive an instance of an application\
    \ as the argument, providing us with an opportunity to lookup the instance of\
    \ the registered factory. Consider the code given below:\n\n```javascript\nexport\
    \ function initialize(appInstance) {\n  let logger = appInstance.lookup('logger:main');\n\
    \  logger.log('Hello from an instance initializer!');\n}\n\nexport default {\n\
    \  name: 'logger',\n  initialize: initialize\n};\n```\n\nIt is also possible for\
    \ us to get an instance of an application from a factory set. Consider the example\
    \ given below which plays songs having different audio services depending on the\
    \ `audioType` of the song. Here is the code:\n\n```javascript\nimport Ember from\
    \ 'ember';\nconst {\n  Component,\n  computed,\n  getOwner\n} = Ember;\n\n// Usage:\n\
    // // {{play-audio song=song}}\n//\nexport default Component.extend({\n  audioService:\
    \ computed('song.audioType', function() {\n    let appInstance = getOwner(this);\n\
    \    let audioType = this.get('song.audioType');\n    return appInstance.lookup(`service:audio-${audioType}`);\n\
    \  }),\n  click() {\n    let p = this.get('audioService');\n    p.play(this.get('mysong.file'));\n\
    \  }\n});\n```\n\n## Initializers\n\nThese provide us with an opportunity to configure\
    \ the app during the boot process. There exists two types of initializers, application\
    \ instance initializers and application initializers.\n\nThe application initializers\
    \ are executed during the boot process, and they provide us with the method that\
    \ dependency injections can be configured in an app. The other type of initializers\
    \ are configured during the loading of an instance of an application. They provide\
    \ us with a way to configure the initial state of our app, and setting up of application\
    \ instances which are local to the instance of our app.\n\n### Application Initializers\n\
    \nApplication initializers are created using the initializer generator of the\
    \ Ember CLI. The command given below best describes this:\n\n`ember generate initializer\
    \ shopping-cart`\n\nWe can then customize the initializer `shopping-cart` so as\
    \ to inject the property `cart` in all the routes contained in our application.\
    \ The code given below best describes this:\n\n```javascript\nexport function\
    \ initialize(app) {\n  app.inject('route', 'cart', 'service:shopping-cart');\n\
    }\n\nexport default {\n  name: 'shopping-cart',\n  initialize: initialize\n};\n\
    ```\n\n### Application Instance Initializers\n\nThese can be created using the\
    \ generator `instance-initializer` of the Ember CLI. This is shown in the code\
    \ given below:\n\n`ember generate instance-initializer logger`\n\nConsider the\
    \ code given below which shows how some simple logging can be implemented so as\
    \ to indicate that the instance has already been booted. This is shown in the\
    \ code given below:\n\n```javascript\nexport function initialize(appInstance)\
    \ {\n  let logger = appInstance.lookup('logger:main');\n  logger.log('Hello from\
    \ an instance initializer!');\n}\n```\n"
