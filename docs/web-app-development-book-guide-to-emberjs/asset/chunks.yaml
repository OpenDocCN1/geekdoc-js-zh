    All Ember.js conveniences are always available for modification of attributes.
    This can be done as shown below:


    human.incrementProperty(''age''); // Happy birthday!


    Persisting Records


    In Ember JS, records are persisted on the basis of a per-instance. When you call
    the method “save()” on any instance of the DS.Model, a network request will be
    made.


    By default, newly created records in EmberJS will be posted to their type URL
    in Ember data. This is shown in the following code:


    var p = store.createRecord(''post'', {


     title: ''Ember is Great'',


     body: ''Lorem ipsum''


    });


    p.save(); // => POST to ''/posts''


    Records which exist on the backend will be updated by use of the HTTP PATCH verb.
    This is shown in the code given below:


    store.findRecord(''post'', 1).then(function(p) {


     p.get(''title''); // => "Ember JS is Great"


     p.set(''title'', ''New post'');


     p.save(); // => PATCH to ''/posts/1''


    });


    Consider the code given below:


    human.get(''isAdmin'');            //=> false


    human.get(''hasDirtyAttributes''); //=> false


    human.set(''isAdmin'', true);


    human.get(''hasDirtyAttributes''); //=> true


    human.changedAttributes();       //=> { isAdmin: [false, true] }


    One can tell if an outstanding record has some outstanding changes which have
    not yet been saved by checking on its property “hasDirtyAttributes.”


    At the above point, you can just save the changes by calling the “save()” method
    or just roll them back. Consider the code given below:


    human.get(''hasDirtyAttributes''); //=> true


    human.changedAttributes();       //=> { isAdmin: [false, true] }


    human.rollbackAttributes();


    human.get(''hasDirtyAttributes''); //=> false


    human.get(''isAdmin'');            //=> false


    human.changedAttributes();       //=> {}


    Handling Validation Errors


    In case your backend server returns validation errors once you try to save, the
    property “errors” of your model will havethese. The errors can be displayed as
    shown below:


    {{#each p.errors.title as |err|}}


     <div class="error">{{err.message}}</div>


    {{/each}}


    {{#each p.errors.body as |err|}}


     <div class="error">{{err.message}}</div>


    {{/each}}


    Promises


    The “save()” method will return a promise, and this will make it easy for us to
    handle scenarios of either success or failure. Consider the common pattern which
    is shown below:


    var p = store.createRecord(''post'', {


     title: ''Ember is Great'',


     body: ''Lorem ipsum''


    });


    var self = this;


    function transitionToPost(p) {


     self.transitionToRoute(''posts.show'', p);


    }


    function failure(reason) {


     // handling the error


    }


    p.save().then(transitionToPost).catch(failure);


    // => POST to ''/posts''


    // => transitioning to posts.show route


    Deleting Records


    Deletion of records can be done in the same manner as creating records. The method
    “deleteRecord()” can be called on the instance of the DS.Model. This will then
    flag the record as “isDeleted.” This should be followed by the calling of the
    method “save()” which will save the deletion of the record. Consider the code
    given below:


    store.findRecord(''post'', 1).then(function(p) {


     p.deleteRecord();


     p.get(''isDeleted''); // => true


     p.save(); // => DELETE to /posts/1


    });


    // OR


    store.findRecord(''post'', 2).then(function(post) {


     p.destroyRecord(); // => DELETE to /posts/2


    });


    Relationships


    Ember has several built-in relationships which define how the models relate to
    each other.


    One-to-One


    If you need to declare this type of relationship between two models, use the code
    given below:


    Here is the code for the file “myuser.js”:


    export default DS.Model.extend({


     profile: DS.belongsTo(''profile'')


    });


    The file “profile.js” should then be as follows:


    export default DS.Model.extend({


     user: DS.belongsTo(''myuser'')


    });


    One-to-Many relationship


    This type of relationship can be declared as follows between two models:


    Consider the code given below for the file “myposts.js”:


    export default DS.Model.extend({


     comments: DS.hasMany(''comment'')


    });


    Here should be the code for the file “ourcomments.js”:


    export default DS.Model.extend({


     post: DS.belongsTo(''p'')


    });


    Explicit Inverses


    Ember JS will do the best it can to discover the kind of relationship existing
    between components. Sometimes, you might have many different types of relationships
    for the same type.


    Consider the code given below:


    export default DS.Model.extend({


     firstPost: DS.belongsTo(''post'', { inverse: null }),


    secondPost: DS.belongsTo(''mypost''),


     redPost: DS.belongsTo(''mypost''),


     bluePost: DS.belongsTo(''mypost'')


    });


    Here is the code for the file “mypost.js”:


    export default DS.Model.extend({


     comments: DS.hasMany(''comment'', {


       inverse: ''redPost''


     })


    });


    That is how we have linked the two files together. Note that we have  many relationships.


    Reflexive Relationships


    For a reflexive relationship to be defined, you should have the inverse relationship
    already defined. If you do not have the inverse relationship, you can set it to
    “null.”


    Consider the example given below, which shows a reflexive inverse relationship:


    export default DS.Model.extend({


     children: DS.hasMany(''folder'', { inverse: ''parent'' }),


     parent: DS.belongsTo(''folder'', { inverse: ''children'' })


    });


    The example given below shows a one-to-one reflexive relationship:


    export default DS.Model.extend({


     name: DS.attr(''string''),


     bFriend: DS.belongsTo(''user'', { inverse: ''bFriend'' }),


    });             


    A reflexive relationship without an inverse can be defined as follows:


    export default DS.Model.extend({


     parent: DS.belongsTo(''folder'', { inverse: null })


    });


    Creating records


    Suppose that we have two models, namely “myposts” and “comments.” These two are
    related as follows:


    mypsosts.js:


    export default DS.Model.extend({


     comments: DS.hasMany(''comment'')


    });


    The file “comment.js” is as follows:


    export default DS.Model.extend({


     post: DS.belongsTo(''post'')


    });


    Once a user has commented on a post, a relationship has to be created between
    two records. The relationship “belongsTo” can simply be set to the comment as
    shown below:


    let p = this.store.peekRecord(''post'', 1);


    let comm = this.store.createRecord(''comment'', {


     post: p


    });


    comm.save();


    With the above code, a new comment will be created and then saved to the server.
    The post will also be updated by the Ember server so that the newly created comment
    can be included.


    For us to link two records, we can also update the “hasMany” relationship for
    the post. This is shown in the code given below:


    let p = this.store.peekRecord(''post'', 1);


    let comm = this.store.createRecord(''comment'', {


    });


    p.get(''comments'').pushObject(comm);


    comm.save();


    In our above case, the relationship “belongsTo” for the new comment will be set
    to the parent post.


    In case you have created the property “author” for your post, it will not work
    if the user of that id has not been loaded into the store. The code given below
    best describes this:


    this.store.createRecord(''post'', {


     title: ''Ember is great'',


     body: ''Lorem ipsum'',


     author: this.store.findRecord(''user'', 1)


    });


    However, the relationship can easily be set once the promise has been fulfilled:


    let p = this.store.createRecord(''post'', {


     title: ''Ember is Great'',


     body: ''Lorem ipsum''


    });


    this.store.findRecord(''user'', 1).then(function(user) {


     post.set(''author'', user);


    });


    Updating of Existing Records


    Sometimes, we might need to set relationships on records which are already in
    existence. This can simply be done by use of the “belongsTo” relationship. This
    is shown in the code given below:


    let p = this.store.peekRecord(''post'', 1);


    let comm = this.store.peekRecord(''comment'', 1);


    comm.set(''post'', p);


    comm.save();


    Alternatively, the record can be pushed into the relationship “hasMany” so as
    to update it. This is shown below:


    let p = this.store.peekRecord(''post'', 1);


    let comm = this.store.peekRecord(''comment'', 1);


    p.get(''comments'').pushObject(comm);


    p.save();


