    \ conveniences are always available for modification of attributes. This can be\
    \ done as shown below:\n\n```javascript\nhuman.incrementProperty('age'); // Happy\
    \ birthday!\n```\n\n## Persisting Records\n\nIn Ember JS, records are persisted\
    \ on the basis of a per-instance. When you call the method `save()` on any instance\
    \ of the `DS.Model`, a network request will be made.\n\nBy default, newly created\
    \ records in EmberJS will be posted to their type URL in Ember data. This is shown\
    \ in the following code:\n\n```javascript\nvar p = store.createRecord('post',\
    \ {\n  title: 'Ember is Great',\n  body: 'Lorem ipsum'\n});\n\np.save(); // =>\
    \ POST to '/posts'\n```\n\nRecords which exist on the backend will be updated\
    \ by use of the HTTP `PATCH` verb. This is shown in the code given below:\n\n\
    ```javascript\nstore.findRecord('post', 1).then(function(p) {\n  p.get('title');\
    \ // => \"Ember JS is Great\"\n  p.set('title', 'New post');\n  p.save(); // =>\
    \ PATCH to '/posts/1'\n});\n```\n\nConsider the code given below:\n\n```javascript\n\
    human.get('isAdmin');            //=> false\nhuman.get('hasDirtyAttributes');\
    \ //=> false\nhuman.set('isAdmin', true);\nhuman.get('hasDirtyAttributes'); //=>\
    \ true\nhuman.changedAttributes();      //=> { isAdmin: [false, true] }\n```\n\
    \nOne can tell if an outstanding record has some outstanding changes which have\
    \ not yet been saved by checking on its property `hasDirtyAttributes`.\n\nAt the\
    \ above point, you can just save the changes by calling the `save()` method or\
    \ just roll them back. Consider the code given below:\n\n```javascript\nhuman.get('hasDirtyAttributes');\
    \ //=> true\nhuman.changedAttributes();      //=> { isAdmin: [false, true] }\n\
    human.rollbackAttributes();\n\nhuman.get('hasDirtyAttributes'); //=> false\nhuman.get('isAdmin');\
    \            //=> false\nhuman.changedAttributes();      //=> {}\n```\n\n## Handling\
    \ Validation Errors\n\nIn case your backend server returns validation errors once\
    \ you try to save, the property `errors` of your model will have these. The errors\
    \ can be displayed as shown below:\n\n```handlebars\n{{#each p.errors.title as\
    \ |err|}}\n  <div class=\"error\">{{err.message}}</</div>\n{{/each}}\n\n{{#each\
    \ p.errors.body as |err|}}\n  <div class=\"error\">{{err.message}}</</div>\n{{/each}}\n\
    ```\n\n## Promises\n\nThe `save()` method will return a promise, and this will\
    \ make it easy for us to handle scenarios of either success or failure. Consider\
    \ the common pattern which is shown below:\n\n```javascript\nvar p = store.createRecord('post',\
    \ {\n  title: 'Ember is Great',\n  body: 'Lorem ipsum'\n});\nvar self = this;\n\
    \nfunction transitionToPost(p) {\n  self.transitionToRoute('posts.show', p);\n\
    }\n\nfunction failure(reason) {\n  // handling the error\n}\n\np.save().then(transitionToPost).catch(failure);\n\
    // => POST to '/posts'\n// => transitioning to posts.show route\n```\n\n## Deleting\
    \ Records\n\nDeletion of records can be done in the same manner as creating records.\
    \ The method `deleteRecord()` can be called on the instance of the `DS.Model`.\
    \ This will then flag the record as `isDeleted`. This should be followed by the\
    \ calling of the method `save()` which will save the deletion of the record. Consider\
    \ the code given below:\n\n```javascript\nstore.findRecord('post', 1).then(function(p)\
    \ {\n  p.deleteRecord();\n  p.get('isDeleted'); // => true\n  p.save(); // =>\
    \ DELETE to /posts/1\n});\n\n// OR\nstore.findRecord('post', 2).then(function(post)\
    \ {\n  p.destroyRecord(); // => DELETE to /posts/2\n});\n```\n\n## Relationships\n\
    \nEmber has several built-in relationships which define how the models relate\
    \ to each other.\n\n### One-to-One\n\nIf you need to declare this type of relationship\
    \ between two models, use the code given below:\n\nHere is the code for the file\
    \ `myuser.js`:\n\n```javascript\nexport default DS.Model.extend({\n  profile:\
    \ DS.belongsTo('profile')\n});\n```\n\nThe file `profile.js` should then be as\
    \ follows:\n\n```javascript\nexport default DS.Model.extend({\n  user: DS.belongsTo('myuser')\n\
    });\n```\n\n### One-to-Many relationship\n\nThis type of relationship can be declared\
    \ as follows between two models:\n\nConsider the code given below for the file\
