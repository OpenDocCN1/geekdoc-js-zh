    \ service shopping-cart\n\nThe services have to extend the base class “Ember.Service.”\
    \ This is shown in the code given below:\n\nexport default Ember.Service.extend({\n\
    \n});\n\nLike the objects in Ember, a service has to be initialized, and this\
    \ should have methods and properties of its own. Consider the shopping cart service\
    \ shown below which best demonstrates how this works:\n\nexport default Ember.Service.extend({\n\
    \n items: null,\n\n init() {\n\n   this._super(args);\n\n   this.set('items',\
    \ []);\n\n },\n\n add(item) {\n\n   this.get('items').pushObject(item);\n\n },\n\
    \n remove(item) {\n\n   this.get('items').removeObject(item);\n\n },\n\n empty()\
    \ {\n\n   this.get('items').setObjects([]);\n\n }\n\n});\n\nAccessing Services\n\
    \nFor a service to be accessed, one can choose to inject it into any object which\
    \ is container-resolved, such as another service or a component by use of the\
    \ function “Ember.inject.service.” There are two ways that a function can be used.\
