    `language="type/javascript"` 红色部分是完全可选的，因为浏览器默认认为 `<script>` 标签是 JavaScript，尽管出于验证考虑，你仍然应该包含它。上述示例的第二行和倒数第二二是
    `<!--` 和 `//->`，它们为 JavaScript 定制的 HTML 注释标签。建议你包含它们，以隐藏代码以免不支持 JavaScript 的极旧浏览器。如果不包含它们，而有人正在使用此类浏览器，浏览器会将你的所有代码作为文本“倾倒”到屏幕上，换句话，那可不好好看！此脚本唯一的“功能部分”是
    `document.write(".......")` 部分。它基本上会将引号内的任何内容写入页面。先不要太担心为什么这样做，我们稍后会详细讨论。我们用 `</script>`
    结束整个代码，这会终止你的脚本并回到 html。


    就像 html 一样，你可以在 JavaScript 代码中插入注释。JavaScript 注释与 HTML 注释不同，后者注释掉脚本中的某些行使其不被解释。JavaScript
    注释的语法为：


    `//这里注释`


    用于单行注释，或者


    ```

    /*这里注释

    */

    ```


    用于多行注释。


    例如：


    ```html

    <script language="JavaScript">

    <!<!--

    //这个脚本不起作用且毫无用处！

    /*

    嘿，别让我参与这个！

    */

    //--> </script>

    ```


    好了，我们现在准备好开始真正的编程了！


    JavaScript 与许多编程语言一样，依赖对象、函数和事件处理器来创建可运行的程序。如果你对这些术语以及如何使用它们一无所知，不要担心。等我们完成教程，你就知道了。


    ## JavaScript 和 HTML


    你可以将 JavaScript 视为 HTML 的扩展；或者说是一个插件。


    它的工作原理如下。HTML 标签创建对象；JavaScript 让你操作这些对象。例如，你使用 HTML `<BODY>` 和 `</BODY>` 标签创建一个网页或文档。如表
    1 所示，在创建文档后，你可以使用 JavaScript 与之交互。例如，你可以使用一种特殊的 JavaScript 结构 `onload` 事件处理器在文档加载到
    Web 浏览器时触发一个动作——也许播放一段简短的欢迎曲。你使用 JavaScript 交互的其他 HTML 对象示例包括窗口、文本字段、图像和嵌入的 Java
    应用。


    表 1：创建和使用对象


    ![](img/image00048.jpeg)


    要在 Web 页面中添加 JavaScript，你只需要将 JavaScript 代码嵌入到 HTML 文件中。在嵌入 JavaScript 代码的行之后，你可以通过响应事件处理器或
    HTML 链接来引用或调用该 JavaScript 代码。


    在 HTML 中嵌入代码时，你有两个选择：


    1. 你可以使用 `<script>` 和 `</script>` 标签将代码直接包含在 HTML 中。在下面的示例中，HTML 顶部定义了一个 JavaScript
    函数 `onclick()`。在 HTML 的更下方，通过事件调用了该 JavaScript 函数——特别是按钮的 onclick 事件（换句话说，当用户点击按钮时，`onclick()`
    中的 JavaScript 代码就会运行）。


    ```html

    <<html>

    <head>

    <script language="JavaScript">

    // JavaScript code

    function onclick() {

    // JavaScript code

    }

    </script>

    </head>

    <body>

    <form name="myForm">

    <input type="button" name="order" value="click order" onclick="onclick()">

    </form>

    </body>

    </html>

    ```


    2. 你可以使用 `<script>` 标签包含一个外部 JavaScript 文件。在下面的示例中，JavaScript 函数 `onclick()` 定义在
    `myfile.js` 中。当用户点击 Order 链接时，该函数被触发并调用。


    ```html

    <html>

    <head>

    <script language="JavaScript" src="myfile.js"></script>

    </head>

    <body>

    <a href="javascript:onclick();">点击此处下单</a>

    </body>

    ```


    因为 Web 页面不仅仅由 HTML 组成，JavaScript 提供的不仅仅是 HTML 对象。JavaScript 还提供了特定浏览器和平台的对象。浏览器插件（如
    Reader 和 Adobe Acrobat）、特定浏览器的名称和版本以及日期都是你可以使用 JavaScript 处理的非 HTML 对象的示例。


    组成网站的所有对象——HTML 对象、浏览器和平台相关的对象以及内置在 JavaScript 语言中的特殊对象——被称为文档对象模型 (DOM)。


    ### HTML 基础


    如果你对 html 一无所知，你应该从基础开始；可能通过在线阅读来学习。一旦你掌握了 html 基础，其余将非常简单。然而，与每个学科一样，html 基础必须仔细学习。你不能跳过任何步骤。建议一次学习
    html 基础的一个方面，只有在理解了较简单的内容后才进入高级步骤。最后一点建议——不要灰馁，因为……

