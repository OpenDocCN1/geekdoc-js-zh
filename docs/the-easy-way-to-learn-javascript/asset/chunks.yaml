    \ 简介\n\nJavaScript 是一种解释型编程语言，基于 ECMAScript 标准构建。该语言的定义非常广泛，因为它可以被定义为基于原型的、命令式的、弱类型的和动态过程语言。\n\
    \nJavaScript 主要作为一种客户端编程语言，作为 Web 浏览器的一部分实现，允许开发者以更改进的方式在网页中实现用户界面和动态功能，尽管目前也存在服务器端\
    \ JavaScript (SSJS) 的实现，但该语言的流行完全归功于客户端的实现。JavaScript 也可以用于 Web 之外，例如为 PDF 文档和桌面小组件添加交互性。\n\
    \nJavaScript 的设计语法与 C 语言相似，尽管它借鉴了 Java 编程语言的名称和约定。然而，尽管名字相似，Java 和 JavaScript\
    \ 之间并没有关系，且语法也不同。JavaScript 最初由 Netscape 的 Brendan Eich 开发，名为 Mocha，后来被更名为 LiveScript。这个名字的出现正值\
    \ Netscape 在 1995 年底在其网页浏览器 Navigator 2.0 中加入了对 JavaScript 的支持。JavaScript 这个名字被创造出来，给人一种该语言是\
    \ Java 扩展的印象，这被认为是 Netscape 的一种营销策略。\n\n随后，有用户作为 Internet 3 的实现了一种类似的客户端编程语言。微软将其称为\
    \ script 以避免与品牌相关的问题。该术似乎非常相似，以至于 \"javascript\" 和 \"script\" 经常混用，但 script 的规范并不\
    \ 100% 兼容 ECMA 标准。为了避免这些不兼容性，世界网联盟 (W3C) 设计了标准的文档对象模型 (`DOM` 或文档模型)，该模型被包含在 Internet\
    \ Explorer 6、Netscape Navigator、Opera 7 版本以及自首次发布以 Mozilla Firefox 之后的所有现代浏览器中。\n\
    \n1997 年，有一项建议将 JavaScript 提交给欧洲计算机制造商协会 ECMA 标准，尽管名字里有欧洲，但它并不是欧洲的而是国际性的，总部位于日内瓦。1997\
    \ 年 6 月，它以 ECMAScript 的命名被 ECMA 标准。JavaScript 也成为了 ISO 标准。\n\n由于标准化和互联网的极大普及，JavaScript\
    \ 已经成为地球上最常用的编程语言。注意：JavaScript 是 Oracle 公司的注册商标。它根据许可由 Netscape Communications\
    \ 创建的产品以及目前的实体（如 Mozilla）使用。\n\n## JavaScript 的用途\n\nJavaScript 存在于大多数网页中。很有可能你现在正在查看的页面包含了\
    \ JavaScript 代码。尝试一下：在网页上点击右键，然后点击“查看源代码”。你应该能在代码的某处找到它。\n\n虽然 HTML 标记语言允许开发者格式化内容，但\
    \ JavaScript 允许他们让页面变得动态。例如，HTML 允许将文本加粗、创建框和创建按钮，而 JavaScript 允许更改页面上的文本、创建弹出消息以及验证框中的文本以确保用户字段已填写。JavaScript\
    \ 让网页更具动态性，允许用户与页面进行交互、点击元素并更改页面。\n\n### JavaScript 能为你做什么\n\n让我们后退一步，数数 JavaScript\
    \ 的优点：JavaScript 非常容易实现。你只需要将代码放入 HTML 文档中并告诉浏览器它是即可。即使在计算机离线状态下，JavaScript 也能工作！JavaScript\
    \ 允许你创建高度响应的界面，改善用户体验并提供功能，而无需等待服务器响应并显示页面。JavaScript 可以在用户需要时将内容加载到文档中，而无需重新加载整个页面这通常被称为\
    \ Ajax。JavaScript 可以根据情况测试浏览器中可行的操作——这有时被称为侵入式脚本。JavaScript 可以帮助修复浏览器问题或修补浏览器支持的漏洞——例如修复某些浏览器中的布局问题。对于一种直到最近还被青睐“高级编程语言”的程序员嘲笑的语言来说，这已经很厉害了。JavaScript\
    \ 复兴的一部分在于，我们现在正在构建日益复杂的 Web 应用，而高交互性要么需要 Flash（或其他插件），要么需要脚本。这无疑是最佳选择，因为它是一个\
    \ Web 标准，在浏览器中得到原生支持（在某种程度上——某些内容在浏览器之间存在差异，这些差异将在后续文章的相应位置讨论），并且它与其他开放标准兼容。\n\
    \n### JavaScript 的常见用途\n\n在使用 JavaScript 的多年里，它的用途发生了变化。起初，JavaScript 与网站的交互主要限于与表单交互、向用户提供反馈以及检测他们做了什么。我们使用\
    \ `alert()` 通知用户某些情况（见图 1），使用 `confirm()` 询问某事是否正常，并使用 `prompt()` 或表单字段获取输入。\n\
    \n![](img/image0045.jpeg)图 1：在 JavaScript 早期，使用 `alert()` 语句告知最终用户错误是我们唯一能做的事情。既不漂亮也不微妙。\n\
    \n"
