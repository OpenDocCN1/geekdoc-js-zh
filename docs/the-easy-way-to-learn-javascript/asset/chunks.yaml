  trans: '


    # JavaScript


    JavaScript 是一种用于 Web 的极佳技术。它并不难学，而且功能非常强大。它与 HTML 和 CSS 等其他网页技术配合得很好，甚至可以与 Flash
    等插件进行交互。JavaScript 允许我们构建高度响应的用户界面，防止令人沮丧的页面刷新，甚至可以修复 CSS 的支持问题。通过使用正确的浏览器扩展（如
    Google Gears 或 Yahoo Browser Plus），你甚至可以使用 JavaScript 让在线系统在离线状态下可用，并在计算机上线后自动同步。


    ## 跨越浏览器


    JavaScript 并不局限于浏览器。与其他语言相比，JavaScript 运行速度快、内存占用小，这使得它的应用范围越来越广——从在 Illustrator
    等程序中自动化重复任务，到将其用作带有独立解析器的服务器端语言。未来是开阔的；无论你在不久后作为 Web 开发者做什么，我深信你迟早都要与 JavaScript
    打交道。

    '
