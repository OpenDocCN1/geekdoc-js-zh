    So, let a creative design culture sweep through the organization and combine the
    innovative minds from the R&D department with the outgoing dito from the marketing
    department. It is only by combining different skills and mindsets you can create
    real innovations that give you the responsibility to change the future. As you
    can''t win the advertising battle - go for a ride with the Credibility Loop!


    Let the products talk themselves. Give them a reason d''etre, personality and
    a soul! It''s probably the best way to differentiate a product offer. And out
    of a strictly financial point of view: what are the reasons not produce products
    that communicate efficient itself?


    Why not transfer money and efforts from the end (advertising) to the start (R&D)
    of a product life cycle? By doing this companies can be much more innovative and
    it will give them the possibility building communicative qualities into the products
    from the start. And by giving products and services a better meaning, the chance
    is much greater that the target group will source them voluntarily.


    A good example: When iPod was introduced year 2001 Apple spent 24.5 million dollars
    to launch the product. A huge amount of money, but still probably just a tenth
    of how much the cost would have been to reach the same global success with a less
    attractive product. Good design and word-of-mouth did most of the job.


    ### Design = Economy

    The great Swedish graphic designer Olle Eksell described it already back in 1964.
    Finally: It''s all about taking charge of the situation.


    ### A design strategy has tentacles everywhere


    We are certain that companies will build a much more credible brand with good
    design and innovation strategies instead of only wrapping the products with ads
    in the end. The advertising money is much better used for innovations that makes
    a difference and that benefit both business and society. Who doesn''t want to
    make peoples life better, more equal and happier by developing more attractive
    and sustainable products or services?


    Some may argue that everything will be copied: product or service. Of course it
    will, if it''s successful enough. When everyone has the same technology copied
    will always exist. You have to differentiate and, you needed to be smart and proactive.
    A good way is to be less technocratic and more cultural, because values of organization
    are the most difficult to blueprint. Having an integrated design within the organization
    (together with marketing, R&D, finance etc.) will come very far.


    We are all familiar with the design from today about brand: "Our brand is our
    most valuable asset". Today it''s common talk and high factor. Now design is the
    "new" brand. Successful companies with a clear design like Apple understand that
    design must be designed and decided at the highest level.


    A design strategy should have tentacles everywhere in a strategy, that''s why
    it''s necessary and unbeatable competitive advantage. It''s beyond identity and
    graphic design; its about everything that happens in your company. How does your
    customer service respond, you have fresh flowers and fruit in your office, what
    kind of music is played in the reception, is your logistics optimized, how is
    your product or service packed and how you expose it? Everything counts, nothing
    is unimportant, you have to have holistic view and manage the process - the design
    process. It''s your most important process, because design helps you to succeed
    with your communication. And with good communication you will reach out and become
    a happy and hopefully positive part of your customers'' minds.


    To summarize everlasting brand discussion: A brand and its value is the outcome
    of a design process.


    ### Our wrap


    Today we will know that we have to develop, innovate and find new ways to survive
    - either it''s business, personal or environmental concerns. At David Report we
    take our responsibility and focus on a business dilemma - why advertise when you
    can do something more powerful and actually both build your brand and sell more
    products/services by innovative R&D?


    As you read above we argue for a shift from advertising into a design focused
    R&D. According to us this is why it''s necessary and unbeatable competitive advantage.
    It''s beyond identity and graphic design; its about everything that happens in
    your company. How does your customer service respond, you have fresh flowers and
    fruit in your office, what kind of music is played in the reception, is your logistics
    optimized, how is your product or service packed and how you expose it? Everything
    counts, nothing is unimportant, you have to have holistic view and manage the
    process - the design process.

