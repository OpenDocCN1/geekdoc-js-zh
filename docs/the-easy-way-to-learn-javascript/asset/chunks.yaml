    # JavaScript


    JavaScript is a wonderful technology to use on the web. It is not that hard to
    learn and it is very versatile. It plays nicely with other web technologies such
    as HTML and CSS and can even interact with plugins such as Flash. JavaScript allows
    us to build highly responsive user interfaces, prevent frustrating page reloads
    and even fix support issues for CSS. Using the right browser add-ons (such as
    Google Gears or Yahoo Browser Plus) you can even use JavaScript to make online
    systems available offline and sync automatically once the computer goes online.


    ## Beyond Brows


    JavaScript is also not restricted to browsers. The speed and small memory footprint
    of JavaScript in comparison to other languages brings more and more uses for it
    from automating repetitive tasks in programs like Illustrator, up to using it
    as a server-side language with a standalone parser. The future is open; no matter
    what you do as a web developer in the near future, I am quite sure you will have
    to work with JavaScript sooner or later.

