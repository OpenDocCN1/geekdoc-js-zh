  trans: "\n\n如果你有一个链接，用户在手机上点击它时会拨打电话，你可能无法使用传统的活动链接选择器对其进行样式设置。请使用以下 CSS：\n\n```css\n\
    a[href^=tel] {\n  <span class=\"Apple-converted-space\"> color: #FFF;</span>\n\
    \  <span class=\"Apple-converted-space\"> textdecoration: none; }\n}\n```\n\n\
    ## 执行 JavaScript 函数的不同方式\n\n### 1 – 裸锚点 (anchor naked)\n在某些浏览器中，鼠标指针在悬停时可能不会改变。可以使用\
    \ CSS 来解决这个问题：`a {cursor:pointer; }`\n\n### 2 – 带有 href 的锚点 (anchor has href)\n\
    鼠标悬停时显示链接 #。在 IE6、IE7 上页面可能会跳转到顶部\n\n### 3 – 伪锚点 (anchor pseudo)\n在点击链接时调用函数的旧式方法。出于可用性和可访问性考虑，不建议使用伪协议\
    \ href（Pseudo-protocol hrefs）。\n\n由于可用 API 的大量涌入，现在被认为是过时的编程方式。它杂乱且冗长，人们会在状态栏看到它，但它没有任何意义。Opera\
    \ 不喜欢 `href=\"javascript:[anything]\"`\n\n### 4 – 伪空值锚点 (anchor pseudo void)\n\
    某些人认为使用 `javascript:[anything]` 是一种糟糕的实践。伪协议 href 可能会导致 IE 进入等待状态，预期页面将被替换，并自动禁用耗费资源的活动。`javascript:[anything]`\
    \ 用于书签。\n\n什么是 `javascript:void(0);`？\n\n### 5 – 返回 false 的锚点 (anchor return false)\n\
    返回 `false` 会导致 `href=\"#\"` 不被评估。比上面使用伪协议的示例更安全，避免了页面跳转。\nReturn 有时可能不可靠。\n\n\
    ### 6 – 优美的 URL/jQuery (anchor pretty url/jQuery)\n用户在悬停链接时会看到 #some-real-url。如果禁用了\
    \ JavaScript，他们会看到一些信息内容。\n\n```javascript\n$(document).on('click', 'a.mylink',\
    \ function(e) {\n  //防止页面跳转到 href\n  e.preventDefault();\n  //执行函数 foo();\n});\n\
    ```\n\n## 学习 CSS 语法和正确应用\n\n一旦你对 CSS 及其功能有了充分的理解，下一步就是理解 CSS 的语法以及将其应用于文档的几种方式方法。\n\
    \n### CSS 语法由三个元素组成。\n\n**选择器 (Selector)**：选择器是你 HTML 文档中想要设置样式的元素。例如，如果你在 HTML\
    \ 中放置了一个段落标签 `<p>`，那么你的选择器就是 \"p\" —— CSS 中的标准段落标签。如果你想对网站的整个主体应用样式，将使用 \"body\"\
    \ 作为选择器。以后，你将学习如何使用 \"class\" 和 \"id\" 标签创建自己的选择器。\n\n**属性 (Property)**：属性是那些应用于特定选择器的元素。以上面示例中的段落为例。你可以用于设置该选择器样式的属性包括\
    \ `font-family`、`fontsize`、`color` 以及其他几个。\n\n**值 (Value)**：值是应用于属性的形状、大小、尺寸等。例如，如果你想让段落显示\
    \ 20px，你就会对该属性应用 20px 的值。\n\n```css\nSelector: p {}\nSelector + Property: p {font-size:}\n\
    Selector + Value {20px;}\n```\n\n现在，让我们进入 CSS 的应用。你有三种方式可以为文档应用样式。\n\n### 内联样式\
    \ (Inline Styles)\n内联样式意味着你将特定元素的样式放置在标签内部。例如，如果你想更改段落的文字颜色，你将在段落标签内应用 \"blue;\"\
    。这种方法可以，但不推荐。如果你的网站有 100 个页面，且每个页面都使用内联样式，当需要更改时，你必须逐个更改所有页面。\n\n### 内部样式 (Internal\
    \ Styles)\n内部样式将样式包含在 HTML 文档内部。HTML 文档的开头有 `head` 标签。你的样式将放在这些标签之间以便引用。如果你有一个单页网站，可以使用这种方法。\n\
    \n### 外部样式 (External Styles)\n使用外部样式是使用 CSS 最有效的方法。你的样式存储在所有 HTML 文件连接的外部文档中。这使得全局更改变得非常简单。假设你想更改一个\
    \ 100 页网站的链接颜色。你不需要逐个更改每个页面，只需更改外部文档中的样式即可。所有页面都会更改，因为它们都链接到同一个样式。\n\n### 为什么大小写在\
    \ JavaScript 中如此重要？\n这是这种语言的本质。首先，脚本是用纯文本编写的，但它不像 HTML（HTML 不区分大小写）仅仅是标记，它是代码，因此受到浏览器内部工作机制（DOM\
    \ APIs）的严格审查。\n\n`var names, Names;`\n\n这两个变量看起来相似，但对 JS 来说它们是完全不同的。重要的是我们要识别它们，不是因为重要性，而是因为它们的本质。它就是它。\n\
    \n```javascript\nfunction Person(name, age){\n  this.name = name;\n  this.age\
    \ = age;\n}\nvar person = new Person(\"Zach\", 29);\n```\n\n我们可以忽略这段代码的构成，因为还没有还没有对象。这里的重点是显示\
    \ `person` 和 `Person` 是两个完全不同的对象。`Person` 是对象构造函数，而 `person` 是该构造类的实例。\n\n```javascript\n\
    console.log(person); // { name: 'Zach', age: 29 }\n以及，\nconsole.log(Person); //\
    \ [Function]\n```\n\n目前，我们必须检查字母大小写，否则可能会产生可能的负面后果，如语法错误、引用错误和其他异常。培养敏锐的眼光，并记住\
    \ JS 是区分大小写的。我们对此无法改变。\n\n### 理解注释\n你可以输入并跟踪关于个人和组织的评论。你可以查看关于某个个人或组织的所有评论，或者查看某人输入的评论。例如，如果你想对段落进行注释，你将在段落标签内应用\
    \ \"blue;\"。\n\n"
- fmt: "\nThese are my favorite colors: purple, turquoise, pink and yellow.\n\n##\
    \ Semicolons in Sentences\n\n![](Images/image00044.gif)\n\nDad is going bald;\
    \ his hair is getting thinner and thinner.\n\n![](Images/image00044.gif)\n\nI\
    \ really like beef, with mushroom sauce; pasta, with Alfredo sauce; and salad,\
    \ with French dressing.\n\n![](Images/image00044.gif)\n\nYou should stop eating\
    \ so much food; you will have to go on a\n\n![](Images/image00044.gif)\n\ndiet.\
    \ You need new braces; otherwise you may not be able to\n\n![](Images/image00044.gif)\n\
    \nstop in time. Star Trek was my favorite television show during the 1960s; in\
    \ fact, it is my favorite television show of all time.\n\n![](Images/image00044.gif)\n\
    \nI had a huge meal; however, I am already hungry again.\n\n![](Images/image00044.gif)\n\
    \nThe Christmas ornaments are finally packed away: small, shiny ones; big, bright\
    \ ones; and the homemade ones.\n\n![](Images/image00044.gif)\n\nShe had self-defense\
    \ training; consequently she warded off the assailant.\n\n![](Images/image00044.gif)\n\
    \nWe had students from Lima, Peru; Santiago, Chile; and Caracas, Venezuela.\n\n\
    ![](Images/image00044.gif)\n\nWe had too many fumbles; we lost the game.\n\n![](Images/image00044.gif)\n\
    \nI know you don’t like broccoli; nevertheless it is very good for you.\n\n![](Images/image00044.gif)\n\
    \nMichelle drives a Jaguar; Sony drives a Porsche.\n\n![](Images/image00044.gif)\n\
    \nI have finished the main course; now I have to make\n\n![](Images/image00044.gif)\n\
    \ndessert. Spring brings gentle rains and warmer weather; in addition to thunderstorms\
    \ and hail.\n\n![](Images/image00044.gif)\n\nShe calls it the bathroom; I call\
    \ it the loo.\n\n![](Images/image00044.gif)\n\nMom wants the chores completed;\
    \ moreover she wants them done properly.\n\n![](Images/image00044.gif)\n\nI will\
    \ be there as soon as I finish working; that is a promise I will definitely keep.\n\
    \n![](Images/image00044.gif)\n\nShe didn’t see the other car coming; now her car\
    \ has a huge dent.\n\n![](Images/image00044.gif)\n\nThere is mounting evidence\
    \ of global warming; of course some people will never believe it.\n\n## The Credibility\
    \ Loop\n\n### Now and then\n\nIn the old world we went to school to get information,\
    \ we trusted legal and other authorities and consumed advertising as entertainment.\
    \ Most people at the age 30+ remember a time when everyone arrived at the cinema\
    \ ten minutes before the movie started just to see them. Today we get information\
    \ wherever. Authorities serve them, not the people, and advertising will be the\
    \ most reliable information. Advertising is one-way communication and today the\
    \ consumer wants interaction.\n\nWe are getting more critical, well-informed and\
    \ want to search and find ourselves. It's more less a rule that we ask friends\
    \ or small subcultures references; they don't believe at. Advertising induces\
    \ for a long produced low-quality but overpaid material, and this will not possible\
    \ in the future. We will know that today's media buzz its hard to get your voice\
    \ heard, and more advertising is not the best solution to get through the noise.\n\
    \nIt's the phenomenon of advertising itself, and all (in other senses) smart businesses\
    \ men/women that are holding yesterday culture under their wings. There are lots\
    \ of examples that advertising doesn't boost sales. So why we still have a culture\
    \ of advertising landscape with expensive ads that do not generate what they should\
    \ generate?\n\n### Fear\n\nWhich fundamentals are used for setting up a media\
    \ budget? We can only speculate, but can certainly say that the psychological\
    \ impact is heavy. The hunger for safety and the fear for failure are stronger\
    \ than questioning what's done before and the outcome of it.\n\n expensive and\
    \ useless advertising campaign can't be justified due to financial or rational\
    \ arguments. But with emotional and psychological reasons this often happens.\
    \ What we are seeing is a global mass where a group of companies (advertising\
    \ agencies) with success are selling a product much overrated. How could this\
    \ happen? Has advertising turned into a very expensive insurance premium?\n\n\
    ### Perception\n\nThe perception of the recipient has changed. With Internet,\
    \ and in some parts the globalization (from a positive point of view) people today\
    \ have a unique possibility to question the power of advertising. Yesterday it\
    \ took days or months that today only takes a second. Nowadays people prefer to\
    \ get their values impact and ads from the web, from friends influential groups\
    \ or. Example: If you going to New York and want to stay at a hotel, would you\
    \ check the hotel? Not. Rather ask a friend or read the hotel reviews. Few would\
    \ trust the ads: they are subjective and only deliver the message. How trustworthy\
    \ is\n\n### GNP\n\nSome companies advertise for more than some countries GNP.\
    \ One trillion, or one billion (1000000000) dollars, was spent on advertising\
    \ 2004 world. Only in the US it was spent at least 500 billion (Proster & Gamble).\
    \ Compare this with the 1.1 trillion dollars (118000000) that was spent 2005 world\
    \ on military, or is this reasonable for something that Ries, the US marketing\
    \ strategy describes as \"...advertising's dirty secret: it serves useful purpose\"\
    ? So...\n\nWe would like to challenge the GNP facts above with a holistic and\
    \ human question; how many starving people, which amount of animal species under\
    \ threat of extinction and how much rain forest could be saved with just a fragment\
    \ of this money? An interesting and very important discussion, but in this issue\
    \ we have decided to concentrate on the business part of the situation. We have\
    \ an alternative to today's advertising landscape as we think it's more appropriate\
    \ to create trustworthy communication and brands by development of new products\
    \ and services. It's all about creativity, innovation and design. We call it The\
    \ Credibility Loop. Before the line\n\nYou need an arsenal of hygiene factors\
    \ just to be on the market nowadays. All competitors have good quality, good service,\
    \ good distribution, good personnel, good price, good communication and good whatsoever...\
    \ At Sony there is a saying that all products have the same function, performance,\
    \ and the only thing that differs the competitors is design. Why not putting effort\
    \ on design?\n\n### Faster horses\n\nUp today the marketing people have been in\
    \ charge for entering new products to the market, and (only) because people like\
    \ and want. But do they really know what people need? It's more interesting to\
    \ see what people are doing instead of listening what they say. Look at children;\
    \ they do like you, not like you tell them to. And Henry Ford would probably get\
    \ the answer \"faster horses\" instead of \"a vehicle with a motor on four wheels\"\
    \ on a question.\n"
