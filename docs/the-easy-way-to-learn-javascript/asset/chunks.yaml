  trans: "\n但由于它们几乎完全相同，最好将它们合并到一个方法中，然后通过判断是哪个单选按钮调用了它。\n\n这使得今后的维护工作变得容易得多（使用一个方法而不是四种方法）。\n\
    \n```sharp\nprivate void ChangeColors(object sender, EventArgs e)\n{\n    /*获取调用该函数的单选按钮的引用。\n\
    \    我们知道将调用此方法的控件将是一个单选按钮（Radio Button），\n    因此首先创建一个 Radio Button 类型的变量。\n\
    \    然后将我们的变量赋值为 sender 对象。\n    但我们首先需要将 sender 变量转换为 Radio 类型。*/\n    System.Windows.Forms.RadioButton\
    \ rbtn = (System.Windows.Forms.RadioButton)sender;\n\n    // 通过查找按钮名称来确定它是哪一个单选按钮。\n\
    \    if (rbtn.Name == \"rbtnGreen\") this.BackColor = myColorArray[0];//\n}\n\
    ```\n\n## JavaScript 和 Ajax\n\nJavaScript 是一种客户端脚本语言。当你打开网页时，你的浏览器会首先从服务器下载所有必要的文件以正确显示该页面。这些必要文件包括\
    \ HTML、CSS、图像、视频等，以及 JavaScript 文件。下载完成后，浏览器会在窗口中显示该页面，任何关联的脚本将从下载的脚本文件中运行。\n\n\
    在 Ajax 技术中，用户输入和其他数据通过 JavaScript 发送到网络服务器。JavaScript 创建 `XML_HTTP_REQUEST_OBJECT`\
    \ 来连接服务器、提交数据并向服务器请求响应。当响应返回时，会触发 JavaScript 事件，并执行与事件相关的函数。因此，在 Ajax 技术中，JavaScript\
    \ 仅用于在客户端和服务器之间传输数据，而主程序（即数据处理）在服务器端通过 PHP 或其他服务器端语言执行。\n\n由于 JavaScript 在客户端计算机上运行，其执行时间非常短，几乎是瞬时的。视图也可以可以在连接服务器的情况下运行\
    \ JavaScript。但在 Ajax 中，访问者必须连接到服务器。这里的执行时间要长得多，取决于网络连接速度、服务器硬件以及客户端与服务器之间传输的字节数。\n\
    \n在服务器安全方面，JavaScript 是绝对安全的，因为它不会从客户端将任何用户输入传输到服务器。但在 Ajax 中，你必须特别注意防止来自恶意用户的任何恶意数据。\n\
    \n在 JavaScript 中，你无法隐藏源代码。用户可以轻松从运行在他们计算机上的源代码视图中读取你的源代码。但在 Ajax 中，数据处理发生在服务器端，因此用户看不到程序源代码。\n\
    \n在 Ajax 中，你可以使用服务器数据库来支持你的程序。\n\n对于很长的程序，如果你使用 JavaScript 来实现，网页的大小将会变大。这会导致下载时间更长，这是一个糟糕的\
    \ SEO 特性。但在 Ajax 中，你可以运行长程序并处理数据库中的数千条数据，而你的页面大小仍能保持很小。\n\n由于并非所有浏览器都完美遵循标准，编写与浏览器无关程序并不容易。JavaScript\
    \ 仅用于数据不是首要考虑的地方，而 Ajax 则是无限的。（注：原文包含多处损坏字符/重复，已保留核心含义）。\n\n## CSS - 基础\n\n想学习\
    \ CSS 但想知道在着手之前需要了解或需要学习的内容吗？让我们先明确，CSS 可以减少你花费的时间。但你需要学习且与搜索引擎及浏览器兼容的知识是什么呢？这些都是我将回答的问题，同时解释它们的含义。\n\
    \n### 什么是 CSS\n\nCSS 代表 Cascading Style Sheets（级联样式表）。CSS 是一种控制网页外观的指令类型。支持它的浏览器有：(Firefox,\
    \ IE3 或更高版本)。你可能会说这绝对会节省时间。不仅如此，你还需要知道，虽然浏览器理解，但它们并不支持所有属性。\n\nXHTML 是可扩展标记语言。XHTML\
    \ 是带有严格规则的 HTML，它增加了一致性并是 100% 符合标准的。因此，你应该熟悉或习惯 HTML 以及 CSS 属性。\n\n### 你用 CSS\
    \ 可以做什么\n\n你可以构建布局，调整标题或正文的大小和颜色，以及对图片进行定位。这意味着只需要编写一次代码，而不需要手动在每个网页中输入相同的代码。消除了重复的格式。\n\
    \n### 如何让搜索引擎看到你的内容\n\n有人说搜索引擎在理解 CSS 方面仍然存在一些问题。但如果你想使用 CSS，是否有办法让搜索引擎看到你想让看到的内容。\n\
    \n1. 保持你的文本整洁，如果你的网页中有太多垃圾信息，爬虫将很难判断哪些是相关的，哪些不是。因此，CSS 可以让你的网页保持整洁，而无需为每个单独的代码元素编写冗余代码。以下是如何使用下面的\
    \ CSS 代码编写标题的示例。\n\n示例：`<h1>标题</h1>`（将开头和结尾的引号替换为内容）\nCSS 代码：`H1 {font-family:\
    \ Arial; size: 18px; bold;}`（去掉引号）\n\n### CSS 语法\n\n首先，CSS 可以写在任何文本编辑器中。但文本文件必须以\
    \ CSS 扩展名保存。\n\nCSS 语法由选择器和声明组成。声明是在你想更改的主体内部使用的属性。你想更改的属性是字体大小或颜色等。属性的格式如下：\n\
    \n```css\nh1 { color: red; }\n```\n\n### 内联、内部和外部\n\n内联（Inline）使用在页正文（内部）中，或者外部（External）是链接到页面。\n\
    \n`<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\">`（链接到文件）\n\n"
