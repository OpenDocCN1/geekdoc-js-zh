    Back 20 years ago when the Internet was just in its infancy, the only way to build
    a webpage was simply to use notepad, a free text editor supplied with Microsoft
    Windows. Now as the Internet has become a collage of music, special effects and
    flash, the art of writing HTML code is slowly being lost to HTML Editors like
    Microsoft FrontPage and Macromedia Dreamweaver MX. Yet, whether you like it or
    not, to be able to effectively build websites you still need to know at least
    basic HTML Code.


    Let me explain ...


    HTML or Hypertext Markup Language is in essence the language of the World Wide
    Web. Without HTML our Internet Browsers like Netscape, Internet Explorer or Firefox
    would not be able to interpret our webpages. HTML is made up of a series of tags
    that describe the inner workings and structure of how you want to present your
    webpages. Now in all seriousness you could survive building webpages without knowing
    one little bit of HTML but to be truly successful on the web this is not true.


    Search engines are now one of the main tools utilised on the web and every day
    you see Microsoft''s MSN, Yahoo and Google jostling for the number one position
    in the search engine stakes but as a web programmer being able to position yourself
    into a top ranking spot is probably one of the most important skills you will
    need to master. As being in one of the top positions for your keywords means you
    will be receiving free focused traffic to your website which is much better than
    having to pay for it via Google''s AdWords, Overture and any one of the other
    text based services.


    So why is knowing HTML going to help you in getting your website positioned into
    a top spot in the search engines ...


    The first thing you need to know is how to correctly format your header tags of
    your webpage because without properly formatted header tags, the search engines
    won''t know what your sites about and what keywords you wish to associate with
    the webpage. One of the big issues I have seen with some of the HTML editors is
    that they don''t address this issue of Header tags or in particular meta tags,
    which means if you are building a website you are already compromising the websites
    ability to be in the right position. For example of editors will provide you with
    forms that will help you set meta description and keywords but miss out important
    data as whether search engines should index all pages, language of web, character
    set and what type of document you are creating based on HTML Standard.


    ```html

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 40 Transitional//EN">

    <html>

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=windows-1252">

    <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId"
    content="FrontPage.Document">

    <title>Your Title</title>

    <meta name="description" content="Your Description">

    <meta name="keywords" content="Your Keywords">

    ```




    One thing I should not it is that just because you provide all information does
    not mean


    a) All Search Engines use this information

    b) You are guaranteed to get a top place in the search engine


    But having each of these small elements in your webpage, certainly when put together
    makes improvement in your search engine. Remember though every search engine is
    different and that the algorithms they use for website content is incredibly complex
    and well guarded secret but if you add these elements at least you will get a
    few points in the positive direction.


    There is another reason for putting this information into your website. Not having
    some of this information can also affect the ability of a visually impaired person
    to view your website. This might sound a little strange but visually impaired
    people have tools that convert screen webpages into braille messages. However,
    in some cases not including some of the information outlined above in your meta
    tags like the content language and character set can affect whether their braille
    software will read your website correctly. So if your customer base is built on
    30% market of are disabled with sight then you could be losing yourself.


    One of other reasons you should know how to write basic code is to build links
    to your webpage. You can follow to build these links to provide information for
    about what you do. For example if you owned a website that should index all Golf
    Clubs you might consider writing articles on how to get Golf Clubs found.


    When you are submitting your articles to places like Ez.com, Articles.com they
    ask you to use certain tags to help your article. For example in the body of your
    article you can only use things like bold, italics and list items but in others
    like put details you can add things like hyperlink and text. Now in the article
    submissions mentioned before, if you want to add a hyperlink you must know your
    basic code, because they do not build links for you, you have to write the HTML
    tags from scratch.


    When you are building your hyperlinks to link back to your webpage, you will want
    to make sure on things


    1. The hyperlink, that is the webpage or website you are linking to contains the
    keywords in either domain name, folder name or webpage name.

    2. Make the hypertext better known as anchor text uses your keywords as well.


    Let us look at a basic example. If I had written a really cool article on a brand
    new Golf Club that I knew was going to sell millions and had a lot of interest
    in the market then my link back to the webpage provides more information on the
    Golf Club would be built in the way shown below. Let us say the name of the Golf
    Club is called the Lion Heart X9.


    ### Learning JQuery


    Sometimes it is useful to have a piece of functionality available throughout your
    code. Maybe you want a single function you can call on a jQuery selector that
    performs a specific action on such selector. Or maybe you wrote a utility function
    in one of your projects and now you want to be able to move it to other projects.
    Writing a plugin is great. It''s easy to learn, and helps you make user-friendly
    interfaces.


