  trans: "\n\n我们非常熟悉通过 `element.style.propertyName` 方法来修改样式，也使用过 JavaScript 工具包来实现这一点，但你知道你实际上可以读取和写入新及现有样式表中的规则吗？这个\
    \ API 实际上非常简单！\n\n```javascript\nfunction addCSSRule(sheet, selector, rules, index)\
    \ { \n  if(sheet.insertRule) {\n    sheet.insertRule(selector + \"{\" + rules\
    \ + \"}\", index); \n  } else {\n    sheet.addRule(selector, rules, index);\n\
    \  } \n}\n\n// 使用它！\naddCSSRule(document.styleSheets[0], \"header\", \"float:\
    \ left\");\n```\n\n最常见的用例是创建一个新的样式表，但如果你想修改现有的样式表，尽管尝试吧。\n\n### 使用加载器加载 CSS 文件\n\
    \n懒加载图像、JSON 和脚本等资源是减少加载时间的极佳方法。我们可以使用 `curl.js` 等 JavaScript 加载器加载这些外部资源，但你知道也可以懒加载样式表并在同一个回调函数中获取通知吗？\n\
    \n```javascript\ncurl(\n  [\n    \"namespace/MyWidget\",\n    \"css!namespace/resources/MyWidget.css\"\
    \n  ],\n  function(MyWidget) {\n    // 对 MyWidget 进行某些操作\n    // CSS 引用不在签名中，是因为我们不在乎它；//\
    \ 我们只在乎它现在已经在页面中了\n  } });\n```\n\n### CSS Pointer Events 基础\n\nCSS `pointer-events`\
    \ 属性的有趣之处在于，它的作用方式几乎像 JavaScript：当值为 `none` 时会有效禁用元素，而在值不为 `none` 时允许元素正常运行。你可能会说“那又怎样？”，但\
    \ pointer-events 会阻止 JavaScript 事件触发！\n\n```css\n.disabled { pointer-events: none;\
    \ }\n```\n\n#### 用法\n\n可以通过 bower 安装该包：\n```bash\nbower install css-essentials\n\
    ```\n用法：\n```html\n<link rel=\"stylesheet\" href=\"bower_components/css-essentials/dist/css-essentialsmin.css\"\
    >\n```\n或通过 npm：\n```bash\nnpm install css-essentials\n```\n\n基础设计适用于所有现存的屏幕。因此，我们定义了以下断点：`@of-xsm:\
    \ 460px;`\n\n我们确定为了真正的调整，我们需要比通常更多的 3-4 个断点：\n`@of-sm: 606px;`\n`@of-md: 800px;`\n\
