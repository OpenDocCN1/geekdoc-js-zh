  trans: '

    20 年前，当互联网还处于婴儿阶段时，构建网页唯一的方法就是使用记事本，这是 Microsoft Windows 提供的一个免费文本编辑器。现在，随着互联网已成为音乐、特效和
    Flash 的汇汇，编写 HTML 代码的艺术正逐渐让位于 Microsoft FrontPage 和 Macromedia Dreamweaver MX
    等 HTML 编辑器。然而，无论你是否喜欢，为了能够有效地构建网站，你仍然需要了解至少基础的 HTML 代码。


    让我来解释一下……


    HTML 或超文本标记语言本质上是世界维网的语言。没有了 HTML，我们像 Netscape、Internet Explorer 或 Firefox 这样的浏览器将无法解析我们的网页。HTML
    由一系列标签组成，这些标签描述了你希望呈现网页的内部机制和结构。现在严肃地说，你可以在完全不懂一点 HTML 的情况下构建网页并生存，但要在网络上取得真正的成功，事实并非如此。


    搜索引擎现在是互联网上使用的主要工具之一，你每天都能看到微软的 MSN、Yahoo 和 Google 在搜索引擎的角逐中争夺第一位置，但作为一名 Web 程序员，能够将自己定位在排名靠前的位置可能是你需要掌握的最重要技能之一。因为在你的关键词上处于领先位置，意味着你将为你的网站获得免费的精准流量，这比通过
    Google AdWords、Overture 以及任何其他基于文本的服务付费要好得多。


    所以，为什么了解 HTML 会帮助你将网站定位在搜索引擎的顶端呢……


    你首先需要知道的是如何正确地格式化网页的标题标签（header tags），因为没有格式化正确的标题标签，搜索引擎将不知道你的网站是关于什么的，以及你希望与网页关联的关键词是什么。我在某些
    HTML 编辑器中发现的一个大问题之一是，它们没有处理标题标签或特别是元标签（meta tags）这一问题，这意味着如果你正在构建网站，你已经在损害网站处于正确位置的能力。例如，某些编辑器会为你提供表单帮助你设置元描述和关键词，但遗掉了重要数据，例如搜索引擎是否应该索引所有页面、网页语言、字符集以及你根据
    HTML 标准创建的是什么类型的文档。


    ```html

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 40 Transitional//EN">

    <html

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=windows-1252">

    <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId"
    content="FrontPage.Document">

    <title>Your Title</title>

    <meta name="description" content="Your Description">

    <meta name="keywords" content="Your Keywords">

    ```


    我不应该忽略的是，仅仅你提供了所有信息并不意味着


    a) 所有的搜索引擎都使用这些信息

    b) 你保证获得搜索引擎的顶级位置


    但在你的网页中拥有这些小元素，特别是当它们组合在一起时，确实可以提高你的搜索引擎排名。不过记住，每个搜索引擎都是不同的，它们用于网站内容的算法是极其复杂且受保护的秘密，但如果你添加了这些元素，你至少会在积极方向上获得一些加分。


    将这些信息放入你的网站还有另一个原因。缺少其中一些信息也会影响视障人士查看你网站的能力。这听起来可能有点奇怪，但视障人士拥有可以将屏幕网页转换为盲文信息的工具。然而，在某些情况下，在元标签中不包含上述的某些信息（如内容语言和字符集）可能会影响他们的盲文软件是否能正确读取你的网站。所以，如果你的客户群中有
    30%的市场是视障人士，那么你可能会因此失去客户。


    你应该了解如何编写基础代码的另一个原因是为了为你的网页构建链接。你可以按照以下步骤来构建这些链接，以提供关于你所业务的信息。例如，如果你拥有一个应该索引所有高尔夫球杆的网站，你可能考虑写关于如何让人们找到高尔夫球杆的文章。


    当你向 Ez.com、Articles.com 等地方提交文章时，他们会要求你使用某些标签来帮助你的文章。例如，在文章正文中，你只能使用**粗体**、*斜体*和列表项，但在像
    put details 这样的地方，你可以添加超链接和文本等内容。在之前提到的文章提交中，如果你想添加超链接，你必须了解基础代码，因为他们不会为你构建链接，你必须从零开始编写
    HTML 标签。


    当你构建链接回你网页的超链接时，你希望确保以下几点：


    1. 超链接（即你链接的网页或网站）的域名、文件夹名称或网页名称中包含关键词。

    2. 确保超文本（即锚文本）也使用了你的关键词。


    让我们来看一个基础示例。如果我为一款非常酷的新型高尔夫球杆写了一篇文章，我知道它将售出数百万个并在市场上引起很大兴趣，那么我链接回网页以提供更多关于该高尔夫球杆的信息将如下所示。让我们假设这款高尔夫球杆的名字叫
    Lion Heart X9。


    ### 学习 JQuery


    有时，在整个代码中提供某个功能是有用的的。你可能希望在一个 jQuery 选择器上调用一个单一函数，对该选择器执行特定操作。或者你可能在其中一个项目中写了一个工具函数，现在你想能够将其移动到其他项目中。编写插件是很棒的。它很容易学习，并帮助你创建用户友好的界面。


