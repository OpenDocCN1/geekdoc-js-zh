    ```\n\n## JavaScript and Ajax\n\nJavaScript is a client-side scripting language.\
    \ When you open a web page your web browser first downloads all the necessary\
    \ files from the server to display that page correctly. Those necessary files\
    \ are HTML, CSS, Images, Videos, etc. and the JavaScript files too. After completing\
    \ download the browser displays that page on its window and any script linked\
    \ with it will run from the downloaded script file.\n\nIn Ajax technology, user\
    \ inputs and other data are sent to the web server through JavaScript. JavaScript\
    \ creates `XML_HTTP_REQUEST_OBJECT` to connect with the server, submit data to\
    \ it, and to request a response from the server. When response comes, a JavaScript\
    \ event fires and the function associated with that event is then executed. So\
    \ in Ajax technology JavaScript is only used to transfer data between client side\
    \ and the server while the main program, i.e. data processing is executed at the\
    \ server end, in PHP or any other server-side language.\n\nAs JavaScript runs\
    \ from the client computer its execution time is very short, almost instantaneous.\
    \ View can run JavaScript without being connected to the server as well. But in\
    \ Ajax, viewers must be connected to the server. Here execution time is much longer\
    \ which depends on their Internet connection speed, server hardware and number\
    \ of bytes to be transferred between client side and server side.\n\nIn terms\
    \ of server security JavaScript is absolutely safe since it doesn't transfer any\
    \ user input from client side to the server. But in Ajax you have to take special\
    \ care to prevent any malicious data from the bad users.\n\nIn JavaScript you\
    \ can't hide your source code. Users can easily read your source code from source\
    \ view which is running on their computer. But in Ajax data processing takes place\
    \ at the server end so user can't see the program source code.\n\nIn Ajax you\
    \ can support your program with your server database.\n\nFor a long program, if\
    \ you use JavaScript to implement it, the size of your web page will be larger.\
    \ So it will take longer time to download which is a bad SEO feature. But in Ajax\
    \ you can run long program, processing several thousands of data from a database,\
    \ still your page size keeps small.\n\nSince all browsers do not follow standards\
    \ perfectly it is not easy to write a browser-independent program. JavaScript\
    \ is only used in places where data is not important consideration while of Ajax\
    \ is unlimited. (Note: original text contained several corrupted characters/repetitions,\
    \ the core meaning is preserved).\n\n## CSS - The Basics\n\nThinking about CSS\
    \ but want to learn what you need to know or need to learn before jumping into\
    \ it? Let's begin by saying CSS can reduce your time spent. But knowledge you\
    \ need to learn and is compatible with search engines and your browser? These\
    \ are some questions I'll answer, as well, explaining what is all.\n\n### What\
    \ is CSS\n\nCSS stands for Cascading Sheets. CSS is a type of instructions that\
    \ controls the look of a web page. Some browsers that support it are: (Firefox,\
    \ IE3 or later). You may saying this will definitely save time. Not just, you\
    \ also need to know although browsers understand, they do not support all.\n\n\
    XHTML is extensible Markup Language. XHTML is HTML with strict rules that adds\
    \ conformity and is 100% compliant. So you should be familiar or comfortable with\
    \ HTML, and CSS properties.\n\n### What can you do with CSS\n\nYou can build your\
    \ layout, adjusting size and color of your headings or body text, as well as positioning\
    \ your pictures. This translates into being programmed once without the choice\
    \ of inputting the same coding into each of your web pages manually. Elimination\
    \ of duplicate formatting.\n\n### How to get the Search Engines to See Your Copy\n\
    \nIt has been said that Search Engines still have some problems with understanding\
    \ CSS. But if you want to use CSS, is there a way to get the search engines to\
    \ see what you want.\n\n1. Keep your text clean, if you have too much garbage\
    \ in your web page, then the spiders will have a difficult time determining what\
    \ is relevant and what is not. Thus, CSS keeps your web page clean, without the\
    \ redundant coding needed for each individual element of code. Here is an example\
    \ of how to code a headline; with the CSS code below.\n\nExample: `<h1>Title</h1>`\
    \ (replace beginning and ending quotes with )\nCSS code: `H1 {font-family: Arial;\
    \ size: 18px; bold;}` (leave off quotes)\n\n### Syntax of CSS\n\nFirst, CSS can\
    \ be written within any text editor. But the text file must be saved with a CSS\
