    \n*内容*\ndiv（或其他元素）可以通过对其添加 `block` 属性并使用 `auto` 边距来居中。我之所以将宽度设为“低于 100%”，是因为如果是\
    \ 100%，它就不需要居中了。最好设置一个固定宽度，例如 60% 或 550px，*等等*。\n\n**5. 垂直对齐（针对单行文本）**\n你将在导航菜单中使用此技巧，我几乎可以肯定。关键是让菜单的高度和文本的行高相同。当我回过头来编辑现有网站时，经常看到这种技术。\n\
