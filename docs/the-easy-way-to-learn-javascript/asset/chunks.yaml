  trans: "\n此操作是当有人悬停在你的 `h2` 标签上时，将其颜色从黑色变为红色。使用 `:hover` 的好处之处在于，如果字体大小或权重没有变化，你不需要重新声明\
    \ `font-size` 或 `weight`。它只会改变你指定的内容。\n\n### 过渡 (Transition)\n\n对于 `hover` 效果（例如网站中的菜单或图像），你不希望颜色太快地直接跳转到最终结果。理想情况下，你希望变化逐渐过渡，这就是\
    \ `transition` 属性大显用场的地方。\n\n```css\nh2:hover{\n  color:#f00;\n  transition: all\
    \ 0.3s ease;\n}\n```\n\n这让变化在 0.3 秒内发生，而不是瞬间变成红色。这让悬停效果看起来更悦目，且不那么突兀。\n\n### 7.\
    \ 链接状态\n\n很多设计师忽略了这些样式，这确实会给访问者带来可用性问题。`:link` 伪类控制所有尚未点击过的链接。`:visited` 伪类处理所有你已经访问过的链接的样式。这可以告诉网站访问者他们已经在你的网站上浏览了哪里，哪些地方还有待探索。\n\
    \n```css\na:link { color: blue; }\na:visited { color: purple; }\n```\n\n### 8.\
    \ 轻松调整图像大小以适应\n\n有时你会遇到一种情况，图像需要适应特定的宽度，同时按比例缩放。实现此点的简单方法是使用 `max-width` 来处理。这里有一个示例：\n\
    \n```css\nimg {\n  max-width:100%;\n  height:auto;\n}\n```\n\n这意味着图像最大可以达到 100%，而高度是根据图像宽度自动计算的。在某些情况下，你可能还需要指定宽度为\
    \ 100%。\n\n### 9. 控制区块中的元素\n\n使用上面的图像示例，如果你只想针对特定区块（例如你的博客）的图像，请为博客区块使用一个类，并将其与实际选择器结合。这将允许你只选择博客区块的图像，而不是其他图像，例如你的\
    \ Logo、媒体图标或网站其他任何区块（如侧边栏）中的图像。\n\n```css\n.blog img{\n  max-width:100%;\n  height:auto;\n\
    }\n```\n\n### 10. 直接子元素 (Direct children)\n\n我希望我在刚开始使用 CSS 时就知道这一点。这本可以节省我很多时间！使用\
    \ `>` 来选择元素的直接子元素。例如，来自广告：\n\n```css\n#footer > a\n```\n\n这将选择并样式化紧邻 `footer`\
    \ 下方的所有活动链接元素。它不会选择该元素之外任何内容，也不会选择 `footer` 中的其他任何内容（如文本）。这在顶层结构中效果非常好。\n\n####\
    \ 特定子元素 (Specific Child)\n\n相信这在设置列表样式时非常有用。你只需要计算你想要样式化的项目相对于元素向下数是第几个，然后执行：\n\
    \n```css\nli:nth-child(2) {\n  font-weight:800;\n  color:blue;\n  text-style:underline;\n\
    }\n```\n\n上面的 CSS 针对第二个项目，并将其加粗、添加下划线并设为蓝色。在 `nth-child` 的数字后加上“n”，你就可以针对每 2 个项目。想象一下能够对表格布局中的每隔行设置样式。对应的\
    \ CSS 将是：`li:nth-child(2)`。\n\n### 11. 为多个类应用 CSS\n\n假设你想为所有图像、博客区块和侧边栏添加一个完全相同的边框。你不需要写三遍完全相同的\
    \ CSS。只需要将它们列出来并用逗号隔开即可。这里有一个示例：\n\n```css\n.blog img, .sidebar {\n  border:1px\
    \ solid #000;\n}\n```\n\n无论你是当了多年的网页设计师还是刚刚起步，学习构建网站都是一段充满曲折且无止境的旅程。一旦你了想要学习的语言，就必须学习并精炼你的技能。无论你学什么，CSS\
    \ 都是那些必不可少但令人敬畏的技能之一。它并不一定那么困难，特别是如果你知道一些实用且鲜为人知的 CSS 技术来完成工作。\n\n### 12. box-sizing:\
    \ border-box;\n\n这是许多网页设计师的最爱，因为它解决了内边距（padding）和布局引起的问题。基本上，当你为一个框设置特定的宽度并为其添加内边距时，内边距会增加框的大小。然而，使用\
    \ `box-sizing:border-box;` 后，这种情况就被消除了，框将保持其应有的尺寸。\n\n![](img/image00049.jpeg)\n\
    \n### 13. :before\n\n这种 CSS 是一种选择器，允许你选择一个 CSS 元素并在每个应用了特定类的元素之前插入内容。假设你有一个网站，想在每个\
    \ H2 标签之前显示特定的文本。你可以使用：\n\n```css\nh2:before {\n  content: \"Read: \";\n  <span\
    \ class=\"Apple-converted-space\">color: #F00;</span>\n}\n```\n\n这非常有用，特别是当你使用图标字体时。你可以在某些元素之前放置图标并进行全局应用。\n\
    \n### 14. :after\n\n与 `:before` 类似，你可以使用 `:after` 在特定元素上插入内容。一个实用的用法是在每个段落之后添加“阅读…”。以下是实现方法：\n\
    \n```css\np:after{\n  content: \"read…\";\n  color:#f00;\n}\n```\n\n### 15. content\n\
    \n`content` 是一个 CSS 属性，当你需要填充特定的内容时可以使用它。最常见的用法是插入图标字体。\n\n### 16. CSS 重置 (CSS\
    \ reset)\n\n不同的浏览器都有默认设置，因此你需要对它们进行重置。当你希望它们保持一致性时，这种方法是必须的。\n\n### 17. 字母大写 (Drop\
    \ caps)\n\n大家都喜欢字母大写。它让我们想起了传统的书籍，是段落开头的一种棒方法。那个大字母真的能吸引你的注意力。在 CSS 中创建大字的简单方法是使用伪元素\
    \ `:first-letter`。这里有一个示例：\n\n```css\n:first-letter{\n  display:block;\n  float:left;\n\
    \  margin:3px;\n  color:#f00;\n  font-size:300%;\n}\n```\n\n此操作是将字母设置为其他字母的 3\
    \ 倍。它在字母周围设置 3px 的间距以防止重叠，并将字母颜色设置为红色。\n\n### 18. 强制大写、小写或首大写\n\n将整个区块输入全大写是荒谬的。想象一下当网站格式更改或更新时，你需要回过去修复。相反，使用以下\
    \ CSS 样式来强制文本的特定格式。此 CSS 针对 h2 标题标签。\n\n```css\nh2 { text-transform: uppercase;\
    \ } – 全大写\nh2 { text-transform: lowercase; } – 全小写\nh2 { text-transform: capitalize;\
    \ } – 每个单词的首字母大写\n```\n\n### 19. 垂直屏幕高度 (Vertical screen height)\n\n有时你希望一个区块填充整个屏幕，无论屏幕大小如何。你可以通过\
    \ `vh`（视口高度）来控制。它前面的数字是一个百分比，所以如果你希望它填充浏览器的 100%，你应该将其设置为 100。你可能会将其设置为 85% 等值，以适应固定的导航菜单。\n\
    \n为容器创建一个类，并应用你想要的 vh 数值。你可能需要针对特定屏幕或方向（如手机竖屏模式）调整媒体查询值。\n\n```css\n.fullhight\
    \ { height: 85vh; }\n```\n\n### 20. 样式化电话链接\n\n"
- fmt: "\nIf you have a link that calls a phone number when a user taps it on their\
    \ phone, you may have trouble styling it with the traditional active link selector.\
    \ Instead, use the following CSS:\n\n```css\na[href^=tel] {\n  <span class=\"\
    Apple-converted-space\"> color: #FFF;</span>\n  <span class=\"Apple-converted-space\"\
    > textdecoration: none; }\n}\n```\n\n## Different ways to run a JavaScript function\n\
    \n### 1 – anchor naked\nMouse cursor may not change on hover in some browsers.\n\
    CSS could be used to solve this problem: `a {cursor:pointer; }`\n\n### 2 – anchor\
    \ has href\nMouse hover shows link at # Page may shift to top on IE6, IE7\n\n\
    ### 3 – anchor pseudo\nOld school way of calling the function when the link is\
    \ clicked. Pseudo-protocol hrefs are not recommended for usability and accessibility\
    \ reasons.\n\nNowadays considered back programming due to the influx of APIs available.\
    \ It’s messy, it’s long, people see it in the status bar and it means nothing.\
    \ Opera doesn’t like `href=\"javascript:[anything]\"`\n\n### 4 – anchor pseudo\
    \ void\nUsing `javascript:[anything]` is considered by some to be bad practice.\
    \ Pseudo-protocol hrefs can cause IE to enable a waiting state anticipating the\
    \ page to be replaced and automatically disable resource hungry activity. `javascript:[anything]`\
    \ is used for bookmarks.\n\nWhat is `javascript:void(0);`?\n\n### 5 – anchor return\
    \ false\nReturn false causes the `href=\"#\"` not to be evaluated. Safer method\
    \ than using Pseudo-protocols examples above as page jumps.\nReturn can be unreliable\
    \ at times.\n\n### 6 – anchor pretty url/jQuery\nThe use will see #some-real-url\
    \ when they hover the link. If JavaScript is disabled they see something informative.\n\
    \n```javascript\n$(document).on('click', 'a.mylink', function(e) {\n  //prevent\
    \ the page from going to href.\n  e.preventDefault();\n  //run the function foo();\n\
    });\n```\n\n## Learning CSS Syntax and Proper Application\n\nOnce you have a solid\
    \ understanding of CSS and what it can do, the next step is understanding the\
    \ syntax of CSS and the few ways it can be applied to your documents.\n\n### CSS\
    \ syntax comprises of three elements.\n\n**Selector**: The selector is the element\
    \ within your HTML document you want to style. For instance, if you have placed\
    \ a paragraph tag within your HTML, your selector would be \"p\" - the standard\
    \ paragraph tag in CSS. If you wanted to apply styles to the entire body of your\
    \ website, you would use \"body\" as the selector. At a later time, you'll learn\
    \ how to create your own selectors using the \"class\" and \"id\" tags.\n\n**Property**:\
    \ Properties are those elements that can be applied to a particular selector.\
    \ Let’s take the paragraph from the above example. A few properties you could\
    \ use to style that selector include `font-family`, `fontsize`, `color` and a\
    \ few others.\n\n**Value**: The value is shape, size, dimension, etc. applied\
    \ to a property. For instance, you would apply a value of 20px to the property\
    \ if you wanted your paragraph to display 20px.\n\n```css\nSelector: p {}\nSelector\
    \ + Property: p {font-size:}\nSelector + Value {20px;}\n```\n\nNow, let's get\
    \ into the application of CSS. There are three ways you can apply styles to your\
    \ document.\n\n### Inline Styles\nInline styles mean you are placing the style\
    \ for a particular element within the tag itself. For instance, if you wanted\
    \ to color the text color of a paragraph, you would apply \"blue;\" within your\
    \ paragraph tag. This method is ok, but not recommended. If you had website100\
    \ pages and each page used inline styles, when a change needed you would have\
    \ to change all pages individually.\n\n### Internal Styles\nInternal styles including\
    \ your styles within the HTML document. At the beginning of your HTML document\
    \ there are `head` tags. Your styles would be placed between these tags for reference.\
    \ You might use this method if you had single page website.\n\n### External Styles\n\
    Using external styles are the most effective way of using CSS. Your styles are\
    \ held in outside document that all HTML files connect to. This makes global changes\
    \ a breeze. Say you wanted to change the color of links on 100 page website. Instead\
    \ of changing each page individually you could change the style within external\
    \ document and there have it. All pages would be changed because they are all\
    \ linked to the same style.\n\n### Why is case so much important in JavaScript?\n\
    It’s the nature of the beast. Script is written in plain text for starters, but\
    \ it is not just markup like HTML (which is large-insensitive) it is code, and\
    \ as such, subject to much scrutiny by the browser's internal workings (DOM APIs).\n\
    \n`var names, Names;`\n\nThe two variables look alike, almost, but to JS they\
    \ are worlds apart. What is important is that we recognize it, not by importance,\
    \ but by its nature. It is what it is.\n\n```javascript\nfunction Person(name,\
    \ age){\n  this.name = name;\n  this.age = age;\n}\nvar person = new Person(\"\
    Zach\", 29);\n```\n\nWe can ignore the makeup of this code since objects may not\
    \ have been covered yet. The point here is show that `person` and `Person` are\
    \ two completely different objects. `Person` is an object constructor function,\
    \ and `person` is an instance of that constructor class.\n\n```javascript\nconsole.log(person);\
    \ // { name: 'Zach', age: 29 }\nand,\nconsole.log(Person); // [Function]\n```\n\
    \nAs it stands, we will have to check our capitalization or meet with possible\
    \ negative consequences such as syntax errors, reference errors and other exceptions.\
    \ Develop a keen eye, and keep a reminder that JS is case sensitive. Nothing we\
    \ can do to change this.\n\n### Understanding Comments\nYou can enter and track\
    \ comments about individuals and organizations. You can review all comments about\
    \ an individual or organization or all comments entered by. For instance, if you\
    \ wanted to comment a paragraph, you would apply \"blue;\" within your paragraph\
    \ tag. (Wait, the source text seems slightly garbled here, I will stick to the\
    \ core logic provided or provided: \"For instance, if you wanted to comment a\
    \ paragraph...\")\n\n\"Instead of changing each page individually you could change\
    \ the style within external document and there you have it. All pages would be\
    \ changed because they are all linked to the same style.\"\n"
