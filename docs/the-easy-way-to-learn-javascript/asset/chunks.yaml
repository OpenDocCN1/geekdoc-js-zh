    - Command Line Values\n- 20 Essential CSS Tricks Every Designer Should Know\n\
    - Different ways to run a JavaScript function\n- Learning Syntax Syntax and Proper\
    \ Application\n    - CSS syntax comprises of three elements.\n    - Inline Styles\n\
    \    - Internal Styles\n    - External Styles\n- Why is case sensitivity so much\
    \ more important in JavaScript?\n- Understanding Comments\n- The Credibility Loop\n\
    - JavaScript and Ajax\n- CSS The Basics\n    - What is CSS?\n    - What can you\
    \ do with CSS\n    - How to get the Search Engines to see your copy syntax of\
    \ CSS\n    - Placement of CSS\n    - Watch out for spam- Conclusion\n\n## Introduction\
    \ to JavaScript\n\nJavaScript is an interpreted programming language, built on\
    \ the ECMAScript standard. The language definition is really broad since it can\
    \ be defined as procedural language based on prototypes, imperative, weakly typed,\
    \ and dynamic.\n\nJavaScript is mainly used as a client-side programming language\
    \ implemented as part of a web browser to allow developers an improved way to\
    \ implement user interface and dynamic features in web pages, although there are\
    \ implementations of JavaScript on the server side (SSJS) the popularity of the\
    \ language is due to the client-side implementations alone. JavaScript can also\
    \ be found outside web applications, for example as a way to add interactivity\
    \ to PDF documents and desktop widgets.\n\nJavaScript was designed with a similar\
    \ syntax as C, although it takes names and conventions from the Java programming\
    \ language. However, despite the name Java and JavaScript are not related and\
    \ have different syntaxes. JavaScript was originally developed by Brendan Eich\
    \ of Netscape under the name Mocha, which was later renamed to LiveScript. The\
    \ name coincided coincided with Netscape added support for JavaScript in web browser\
    \ Navigator version 2.0 in late 1995. The name JavaScript was coined, giving the\
    \ impression that the language is an extension of Java and it has been characterized\
    \ as a marketing strategy for Netscape.\n\nThe following user implemented a similar\
    \ client programming language as part of Internet 3. Microsoft called it script\
    \ to avoid problems related to the brand. The term seems so similar that both\
    \ \"javascript\" and \"script\" are often used interchangeably, but the specification\
    \ of script is not 100% compatible with the ECMA specification. To avoid these\
    \ incompatibilities, the World Web Consortium (W3C) designed the standard Document\
    \ Object Model (`DOM`, or document model), which was incorporated in version 6\
    \ of Internet Explorer and Netscape Navigator, Opera version 7, Mozilla Firefox\
    \ since its first release, and all modern browsers thereafter.\n\nIn 1997 there\
    \ was a proposal to submit JavaScript to the standard of the European Computer\
    \ Manufacturers Association ECMA, which despite its name is not European but international,\
    \ based in Geneva. In June 1997, it was adopted as an ECMA standard under the\
    \ name of ECMAScript. JavaScript also became an ISO standard.\n\nBecause of its\
    \ standardization and the great adoption of the internet, JavaScript has become\
    \ the most used programming language in the planet. Note: JavaScript is a registered\
    \ trademark of Oracle Corporation. It is used under license by products created\
    \ by Netscape Communications and current entities such as Mozilla.\n\n## Uses\
    \ of JavaScript\n\nJavaScript is present in most webpages. Chances are that the\
    \ page you are looking at now contains code for JavaScript. Try this: Right-click\
    \ on a web page, then click 'View Source'. You should be able to find it somewhere\
    \ in the code.\n\nWhile HTML markup language allows developers to format content,\
    \ JavaScript allows them to make the page dynamic. For example, HTML allows for\
    \ making text bold, creating boxes, and creating buttons, JavaScript allows for\
    \ changing text on the page, creating pop-up messages, and validating text in\
    \ boxes to make user fields have been filled. JavaScript makes web pages more\
    \ dynamic allowing users to interact with pages, click on elements, and change\
    \ the pages.\n\n### What JavaScript can do for you\n\nLet’s take a step back and\
    \ count the merits of JavaScript: JavaScript is very easy to implement. All you\
    \ need is put your code in the HTML document and tell the browser it is. JavaScript\
    \ works on web computers even when they are offline! JavaScript allows you to\
    \ create highly responsive interfaces that improve the user experience and provide\
    \ functionality, without waiting for the server to react and show another page.\
    \ JavaScript can load content into the document if and when the user needs it,\
    \ without reloading the entire page — this is commonly referred to as Ajax. JavaScript\
    \ can test for what is possible in your browser accordingly — this is sometimes\
    \ intrusive scripting. JavaScript can help fix browser problems or patch holes\
    \ in browser support — for example fixing layout issues in certain browsers. That\
    \ is a lot for a language that until recently was laughed at by programmers favour\
    \ “higher programming languages”. Part of the renaissance of JavaScript is that\
    \ we are building more and more complex web applications these days, and high\
    \ interactivity either requires Flash (or other plugins) or scripting. JavaScript\
    \ is arguably the best way to go, as it is a web standard, it is supported natively\
    \ across browsers (more or less — some things differ across browsers, and these\
    \ differences are discussed in appropriate places in the articles that follow\
    \ this one), and it is compatible with other open standards.\n\n### Common uses\
    \ of JavaScript\n\nThe usage of JavaScript has changed over the years we’ve been\
    \ using it. At first, JavaScript interaction with the site was mostly limited\
    \ to interacting with forms, giving feedback to the user and detecting when they\
    \ do things. We used `alert()` to notify the user of something (see Figure 1),\
    \ `confirm()` to ask if something is OK or not and either `prompt()` or a form\
    \ field to get input.\n\n![](Images/image0045.jpeg)Figure 1: Telling the end user\
    \ about errors using an `alert()` statement was all we could do in the early days\
    \ of JavaScript. Neither pretty nor subtle.\n"
