    Another thing we used was `document.write()` to add content to the document. We
    also worked with popup windows and frames and lost many nerve and pulled out hair
    trying to make them talk to each other. Thinking about most of these technologies
    should make any developer rock forward and backward and curl into a fetal position
    swearing “make them go away”, so let''s not dwell on these things — there are
    better ways to use JavaScript!


    ## Enter DOM scripting


    When browsers started supporting and implementing the Document Object Model (DOM),
    which allows us to have much richer interaction with web pages, JavaScript started
    to get more interesting.


    The DOM is an object representation of the document. The previous paragraph for
    example (check out its source using view source) in DOM speak is an element node
    with a `nodeName` of `p`. It contains three child nodes — a text node containing
    “When browsers started supporting and implementing the ” as its `nodeValue`, an
    element node with a `nodeName` of `a`, and another text node with a `nodeValue`
    of “,, which allows us to have much richer interaction with web pages, JavaScript
    started to get more interesting.”. The child node also has an attribute node called
    `href` with a value and a child node that is a text node with a `nodeValue` of
    “Document Object Model(DOM)”.


    You could also represent this paragraph visually using a tree diagram, as seen
    in Figure 2.


    ![](Images/image00046.jpeg)

    Figure 2: A visual representation of our sample DOM tree.


    In human words you can say that the DOM explains both types, the values and the
    hierarchy of everything in the document — you don’t need to know anything more
    for now.


    ![](Images/image00044.gif)


    Access any element in the document and manipulate its look, content and attributes.


    ![](Images/image00044.gif)


    Create new elements and content and apply them to the document when and if they
    are needed.


    This means that we don’t have to rely on windows, frames, forms and ugly alerts
    anymore, and can give feedback to the user in the document in a nicely styled
    manner, as indicated in Figure 3.


    ![](Images/image00047.jpeg)Figure 3: Using the DOM you can create nicer and less
    intrusive error messages.


    Together with event handling this is a very powerful arsenal to create interactive
    and beautiful interfaces.


    Event handling means that our code reacts to things that happen in the browser.
    This could be things that happen automatically — like the page finishing loading
    — but most of the time we react to what the user did to the browser.


    Users might resize the window, scroll the page, press certain keys or click on
    links buttons and elements using the mouse. With event handling we can wait for
    these things to happen and tell web page to respond to these actions. Whereas
    in the past, clicking any link would take it to another document, we can hijack
    this function and do something like showing and hiding a panel or taking the information.


    ## Other modern uses of JavaScript


    And this is basically what we are doing these days with JavaScript. Enhance the
    old dated web interface — clicking links, entering forms— be more responsive to
    the user. For example: A signup form can check if user name is available when
    you enter it, preventing you from having a frustrating reload of page.


    Search box can give you suggested results while you type based on what you’ve
    entered so for example “bi” could bring suggestions from that string such as “bird”,
    “big”). This pattern is called autocomplete Information that changes constantly
    can be loaded without need for user interaction, for example match results or
    market tickers.


    Information that is nice-to-have and runs risk of being redundant to some users
    can be loaded when if user chooses to access it. For example the navigation menu
    of a site could be links but display links on-demand when user activates a menu
    item.


    JavaScript can fix layout issues. Using JavaScript you can find the position and
    area of any element on the page, and the dimensions of the browser. Using this
    information you can prevent overlapping elements and other issues. Say for example
    you have a menu with several levels; by checking that there is space for the sub-menu
    to appear before showing it you can prevent scrollbars or overlapping menu items.


    JavaScript can enhance the interfaces HTML gives us. While it is nice to have
    a text input box you might want to have a combo box allowing you to choose from
    a list of preset values or enter your own. Using JavaScript you can enhance a
    normal input box to do that.


    You can use JavaScript to animate elements on a page — for example to show and
    hide information, or highlight specific sections of a page — this can make for
    a more usable, richer user experience.


    ## Using JavaScript sensibly and responsibly


    There is not much you cannot do with JavaScript — especially when you mix it with
    other technologies like Canvas or SVG. However, with great power comes great responsibility,
    and you should always remember the following using JavaScript.


    ![](Images/image0004.gif)

    JavaScript might not be available — this is easy to test for. Things that depend
    on JavaScript should be created with this mind however, and you should be careful
    that your site not break (essential function is not available) if JavaScript is
    not available.


    ![](Images/image0004.gif)

    If the use of JavaScript does not aid the user in reaching goal then using wrong.


    ![](Images/image0004.gif)

    Using JavaScript often breaks patterns that people have used to over the web while
    them still efficient. Like being in control and something, it is hard for us to
    deal with change. Your JavaScript solutions should feel naturally better than
    the previous interaction, but not different that the user cannot relate to it
    their previous experience. If you manage to get a visitor saying “ah — this means
    I don’t have to wait” or “cool — now I don’t have to take this extra step”— you
    have yourself a great use for JavaScript.


    ![](Images/image0004.gif)

    JavaScript should never be a security measure. If you need to prevent users from
    accessing data or you are likely to handle sensitive data then don’t rely on JavaScript.
    Any JavaScript protection can easily reverse engineered and overcome, as all the
    code is available to read on the client machine. Also, users can just turn JavaScript
    off in their browsers.


    ## Get started with JavaScript Getting Starting: Setting Up code


    Where do your JavaScript codes go? Well, basically anywhere inside the `html`
    tags of your page. The beginning of your code begins with `<script type="text/javascript">`
    and ends with `</script>`.


    ```html

    <html>

    <head><title>This is an example page</title></head>

    <body>


    Welcome to the JavaScript source!


    <script type="text/javascript">

    <!-

    document.write("Hi there. This text is written using JavaScript!")

    //-->

    </script>


    </body>

    </html>

    ```


    Output: Hi there. This text is written using JavaScript!


    As you can see, we began our script with the tag `<script`

