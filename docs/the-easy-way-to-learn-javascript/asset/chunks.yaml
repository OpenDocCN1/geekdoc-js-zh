  trans: '

    它是网络浏览器用于显示网页内容的标记语言。它控制网页上的格式、字体、边距、布局、颜色、表格、链接以及许多其他项目。它的设计初衷并不是用于控制文档布局的这些方面。你应该做的是使用它来标记标题、段落、列表、超链接以及文档的其他结构性部分，然后添加样式表来单独指定布局，就像你在传统的桌面出版软件包中可能做的那样。


    它是一种计算机语言，尽管是一种非常局限且特殊的语言。因此，如果你想要一个可以随着时间推移轻松演化的系统，你就需要编写清晰且易懂的 HTML。它是世界上最著名的标记语言，基本上是“Web
    语言语言”，但自 1997 年 HTML 4 发布以来，它在实践中几乎没有维护。因此，今天发布在 Web 上的许多内容如果严格执行 HTML 4 规范，将无法跨浏览器渲染，而且
    HTML 4 也有很多歧义之处。它是一种语言，使得呈现信息成为可能（例如，当你查看网页时，看到的是你的浏览器对 HTML 的解释）。


    它通常以不可编辑的方式由浏览器显示——它迫使用户使用外部软件编辑原始内容。对于非编程用户来说，使用多个工具来处理文档的紧迫性可能是一项痛苦的任务。这是一门我们永远不会说的语言。它是每台计算机背后的语言或代码。


    它还设定了一种媒体愿景——特别是不依赖于华丽、资源密集型私有插件的视频。看看你的插件文件夹；你可能至少看到四个视频插件。局限是一种美德。它在不同的查看客户端之间的渲染方式并不相同——所有关于可访问性的保证都付诸东流。这专门是为视障人士设计的。这是一种非常稳定的标记格式。命令的含义是任意的。它通常作为一种基础语言，经常用于
    XML，讨论用于标记作者和日期等的元素。它被用于结构化信息——将文本标记为标题、段落、列表，并可以描述文档的某些外观。


    它是为了构建文档而设计的。关键在于：如果你按照预期用途使用每一项功能，你将拥有一个更好的 Web，而且它终于可以停止构建那些从未设计过的应用程序。它不是，因为它是一个功能性标记（具体指结构），而不是页面布局。它的确切渲染不是由发布的文档指定的，而是某种程度上留给浏览器去区分。它是最著名的标记语言。尽管库是用
    C 编写的，但各种语言使其在其他环境中可用。它是一种非交互式布局语言。它可以排版文本和图形，并提供颜色、粗体字体等。HTML 也是一种超文本标记语言。超文本是任何格式的文本，但增加了一个功能：文本的部分链接到文本的其他部分，使得很容易从文本的一个部分跳转到另一个部分。


    它的目的不仅仅是持有内容，它包含了描述自身和引用更多内容的数据。Web 上的文本不仅仅是线性的，它是超文本。它的意图不是产生艺术家梦幻的视觉效果的精确外观。相反，它的目的是允许信息以结构化的方式组织，以便从设计的宽屏专业工作站到文本模式
    VT100 终端，再到盲人的语音文本阅读器等所有设备上以易于理解的方式进行渲染。它是一段代码。仅此而已。它不是编程语言——它是一种“标记”，无论简单的代码被嵌入到原生环境中来描述文档的结构、布局和格式。这些代码由
    Web 浏览器完全地“解释”或“解析”，页面是按照意图设计的。它在 Firefox 或 Explorer 等网络浏览器中易于阅读，并且用户 Web 的默认属性被留定义，Web
    在不同的浏览器中看起来不同。它本质上是如何标记 Web 的。最新版本的超文本标记语言 HTML5 已经发布，具有新的功能和元素用于构建。


    它由放置元素周围的标签组成，这些标签会改变这些元素的属性。HTML 是一种复杂的语言，而这个免费文本编辑器可能就是创建网站的关键。它由一系列标签组成，这些标签类似于命令，告诉浏览器做什么。这些标签可以输入到任何普通的文本编辑器（如记事本或
    Simple text）中，并且当顺序正确时，就能形成一个网页。它是相对较弱的超文本实现的基础。早期的超文本系统具有类型链接、透明度和源跟踪等功能。它是主要用于设计网页的语言。我们可以在
    HTML 的帮助下进行格式设置和表单设计。它的读音是一个字母一个字母的，就像你拼写 HTML 这个词一样。它的读音不是 "hitmill"，而且它不是编程语言。它的设计初衷并不是用于控制文档布局的这些方面。你应该做的是使用它来标记标题、段落、列表、超链接以及文档的其他结构性部分，然后添加样式表来单独指定布局，就像你在传统的桌面出版软件包中可能做的那样。

