    我们使用的另一种方法是使用 `document.write()` 向文档中添加内容。我们还处理过弹出窗口和框架，在尝试让它们相互通信时耗费了大量心力并抓掉了许多头发。一想起这些大多数技术，应该让任何开发者都感到反复横跳、蜷缩成胎儿，并咒着“让它们消失吧”，所以我们就不再纠结这些事情了——有更好的方法来使用
    JavaScript！


    ## 进入 DOM 脚本


    当浏览器开始支持并实现文档对象模型（DOM）时（这允许我们与网页进行更丰富的交互），JavaScript 开始变得越来越风趣了。


    DOM 是文档的对象的表示。例如，上段文字（通过“查看页面源代码”检查其源码）在 DOM 语言中是一个 `nodeName` 为 `p` 的元素节点。它包含三个子节点：一个
    `nodeValue` 为“When browsers started supporting and implementing the ”的文本节点，一个
    `nodeName` 为 `a` 的元素节点，以及另一个 `nodeValue` 为“,, which allows us to have much richer
    interaction with web pages, JavaScript started to get more interesting.”的文本节点。该子节点还有一个名为
    `href` 的属性节点，其具有一个值以及一个 `nodeValue` 为“Document Object Model(DOM)”的文本节点子节点。


    你也可以使用树形图可视化地表示这段文字，如图 2 所示。


    ![](img/image00046.jpeg)

    图 2：示例 DOM 树的可视化表示。


    用人类的话说，可以说 DOM 解释了文档中所有内容的两种类型：值和层次结构——目前你不需要了解更多。


    ![](img/image00044.gif)


    访问文档中的任何元素并操纵它的外观、内容和属性。


    ![](img/image00044.gif)


    创建新的元素和内容，并在需要时将其应用到文档中。


    这意味着我们不再需要依赖窗口、框架、表单和丑陋的提示框，而是以精美的样式在文档中向用户提供反馈，如图 3 所示。


    ![](img/image00047.jpeg)图 3：使用 DOM 可以创建更美观且侵侵入性的错误消息。


    结合事件处理，这是一个创建交互式美观界面的强大武器库。


    事件处理意味着我们的代码对浏览器中发生的事情做出反应。这些可能是自动发生的事情——比如页面加载完成——但大多数时候，我们是对用户对器的的操作做出反应。


    用户可能会调整窗口大小、滚动页面、按下某些键，或使用鼠标点击链接、按钮和元素。通过事件处理，我们可以等待这些事情发生，并告诉网页对这些操作做出响应。过去，点击任何链接都会跳转到另一个文档，而现在我们可以劫持此功能并执行诸如显示/隐藏面板或获取信息的操作。


    ## JavaScript 的其他现代用途


    这基本上就是我们现在使用 JavaScript 做的事情。增强过时的网页界面——点击链接、填写表单——使其对用户的响应更迅速。例如：注册表单可以在你输入用户名时检查用户名是否可用，避免你经历令人沮丧的页面刷新。


    搜索框可以在你输入时根据你输入的内容提供建议结果，例如输入“bi”可能会带来该字符串的建议（如“bird”、“big”）。这种模式被称为自动补全。不断变化的信息可以在无需用户交互的情况下加载，例如匹配结果或市场行情指数。


    那些很有用但对某些用户来说可能冗余的信息，可以在用户选择访问时加载。例如，网站的导航菜单可以是链接，但只有在用户激活菜单项时才显示链接。


    JavaScript 可以修复布局问题。使用 JavaScript，你可以找到页面上任何元素的位置和区域，以及浏览器的尺寸。利用这些信息，你可以防止元素重叠和其他问题。例如假设你有一个多层级的菜单；在显示子菜单之前检查是否有足够空间让其出现，可以防止滚动条或菜单项重叠。


    JavaScript 可以增强 HTML 为我们提供的界面。虽然有一个文本输入框很好，但你可能想要一个组合框（combo box），允许你从预设列表中选择或输入自己的值。使用
    JavaScript，你可以增强普通的输入框来实现该功能。


    你可以使用 JavaScript 为页面元素制作动画——例如显示和隐藏信息，或高亮页面的特定部分——这可以带来更易用、丰富的用户体验。


    ## 明智且负责地使用 JavaScript


    没有什么是 JavaScript 做不到的——尤其是当你将其与 Canvas 或 SVG 等技术结合时。然而，能力越大责任越大，你在使用 JavaScript
    时应该始终记住以下几点。


    ![](img/image0004.gif)

    JavaScript 可能不可——这很容易测试。然而，依赖 JavaScript 的东西应该考虑到这一点进行创建，并且你应该确保你的网站在 JavaScript
    不可用时不会崩溃（核心功能不可用）。


    ![](img/image0004.gif)

    如果使用 JavaScript 没有帮助用户实现目标，那么这种用法就是错误的。


    ![](img/image0004.gif)

    使用 JavaScript 经常会打破人们在 Web 上一直使用的、且仍然高效的模式。比如控制感之类的，我们很难应对变化。你的 JavaScript 解决方案应该感觉比之前的交互自然更好，但又不至于让用户无法根据之前的经验产生共鸣。如果你成功让访客说出“啊——这意味着我不需要等了”或“酷——现在我不用额外走这一步了”，你就找到了
    JavaScript 的绝佳用途。


    ![](img/image0004.gif)

    JavaScript 永远不应该是安全措施。如果你需要防止用户访问数据，或者你可能处理敏感数据，那么不要依赖 JavaScript。任何 JavaScript
    保护都可以被轻易反向工程并破解，因为所有代码在客户端上都是可读的。此外，用户可以直接在浏览器中关闭 JavaScript。


    ## 开始学习 JavaScript 入门：设置代码


    你的 JavaScript 代码放在哪里？基本上位于页面 `html` 标签内部的任何地方。代码的开头以 `<script type="text/javascript">`
    开始，以 `</script>` 结束。


    ```html

    <html>

    <head><title>这是一个示例页面</title></head>

    <body>


    欢迎来到 JavaScript 源码！


    <script type="text/javascript">

    <!-

    document.write("Hi there. This text is written using JavaScript!")

    //-->

    </script>


    </body>

    </html>

    ```


    输出：Hi there. This text is written using JavaScript!


    如你所见，我们用 `<script` 标签开始了脚本。


