    \ top, right, bottom 和 left 配合像素值来控制元素的位置。\n```\nposition: absolute;\ntop:20px;\n\
    right:20px\n```\n上面的 CSS 设置了元素距离顶部和右侧 20px。\n\n**2. 选择器**\n`*` 选择器允许你选择所有元素。例如，如果你对\
