  Volkswagen, Vezel, Ford\n\n### 死循环\n当你创建一个循环且它没有终点时，它被称为死循环。循环会一直持续，直到计算机或浏览器崩溃崩溃。死循环可能是意外发生的，也可能是由于明显的疏忽。死循环是很糟糕的，它们会降低网页速度，导致访客离开。如果你不在代码中插入一个在完成预期迭代后停止循环的条件，就会创建一个死循环。\n\
  \n### JavaScript while 循环\n只要特定条件成立，JavaScript 循环就会执行代码。现在你已经学习了 for 循环，我将继续解释 while\
  \ 循环是如何工作的。while 循环在某些条件成立时进行迭代。我将创建一个在条件成立时运行 while 循环的示例。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>学习 JavaScript While Loops</p>\n<p id=\"demo7\"></p>\n\
  <script>\nvar msg = \"\";\nvar YY = 0;\nwhile (YY < 10) {\nmsg += \"<br>The next\
  \ digit is \" + YY;\nYY++;\n}\ndocument.getElementById(\"demo7\").innerHTML = msg;\n\
  </script>\n</body>\n</html>\n```\n\n学习 JavaScript While Loops\n下一个数字是 0\n下一个数字是\
  \ 1\n下一个数字是 2\n下一个数字是 3\n下一个数字是 4\n\n\n\n下一个数字是 5\n\n## do/while 循环\n\n`do/while`\
  \ 循环被认为是 `while` 循环的一种变体。它在测试条件之前会执行一次代码。之后，只要特定条件为真，循环就会重复。`do/while` 与其他循环的一个区别点是，即使你将条件设置为假，它也会执行一次代码。这是因为浏览器在测试条件之前就已经执行了代码。\n\
  \n```html\n<!DOCTYPE html>\n<html><body><p>This is JavaScript Do/While Loop</p>\n\
  <p id=\"demo8\"></p>\n<script>\nvar msg = \"\"\nvar YY = 0;\ndo {\nmsg += \"<br>The\
  \ next digit is \" + YY;\nYY++;\n}while (YY < 5);\ndocument.getElementById(\"demo8\"\
  ).innerHTML = msg;\n</script></body>\n</html>\n```\n\n### 这是 JavaScript Do/While\
  \ Loop\n下一个数字是 0\n下一个数字是 1\n下一个数字是 2\n下一个数字是 3\n下一个数字是 4\n\n如果你分析并运行 `for` 循环和 `while`\
  \ 循环之间的对比，你会发现这两个循环几乎是相同的。`while` 循环与 `for` 循环非常相似。然而，唯一的区别是这里第一和第三条语句被省略了。我将使用相同的示例并测试\
  \ `for` 循环和 `while` 循环，看看它们之间有多大差异。在第一部分，我将使用 `for` 循环。\n\n```html\n<!DOCTYPE html>\n\
  <html><body><p id=\"demo9\"></p>\n<script>\nvar carsforsale = [\"Vezel\", \"Fortuner\"\
  , \"Land Cruiser\", \"Jimmy\"];\nvar YY = 0;\nvar msg = \"\";\nfor (;carsforsale[YY];)\
  \ {\nmsg += carsforsale[YY] + \"<br>\" ;\nYY++;\n}\ndocument.getElementById(\"demo9\"\
  ).innerHTML = msg;\n</script></body>\n</html>\n```\nVezel\nFortuner\nLand Cruiser\n\
  Jimmy\n\n接下来，我将使用 `while` 循环来收集汽车名称，并在浏览器中整齐地显示它们。\n\n```html\n<!DOCTYPE html>\n\
  <html><body><p id=\"demo9\"></p>\n<script>\nvar carsforsale = [\"Vezel\", \"Fortuner\"\
  , \"Land Cruiser\", \"Jimmy\"];\nvar YY = 0;\nvar msg = \"\";\nwhile (carsforsale[YY])\
  \ {\nmsg += carsforsale[YY] + \"<br>\";\nYY++;\n}\ndocument.getElementById(\"demo9\"\
  ).innerHTML = msg;\n</script></body>\n</html>\n```\nVezel\nFortuner\nLand Cruiser\n\
  Jimmy\n\n# JavaScript Break 和 Continue 语句\n\n`break` 和 `continue` 语句本质上与 `for` 和\
  \ `while` 循环相关。`break` 语句允许你跳出循环，而 `continue` 语句则允许跳过循环内部某次特定的迭代。后者语句不会中断循环，程序会继续执行。我在之前的章节讨论\
  \ `switch` 语句时已经解释过 `break` 语句。但在那里的用途不同，因为它是应用于 `switch` 语句的。现在我将在循环中使用 `break`\
  \ 语句。\n\n```html\n<!DOCTYPE html>\n<html><body><p>Learning JavaScript Loops</p>\n\
  <p>I will integrate a `break` statement to the for loop.</p>\n<p id=\"demo9\"></p>\n\
  <script>\nvar msg = \"\";\nvar YY;\nfor (YY = 0; YY < 10; YY++) {\nif (YY === 5)\
  \ { break; }\nmsg += \"The next digit is \" + YY + \"<br>\";\n}\ndocument.getElementById(\"\
  demo9\").innerHTML = msg;\n</script></body>\n</html>\n```\n\n# 学习 JavaScript 循环\n\
  我将为 `for` 循环集成一个 `break` 语句。\n下一个数字是 0\n下一个数字是 1\n下一个数字是 2\n下一个数字是 3\n\n\n\n下一个数字是\
  \ 4。循环必须完成 10 个数字的迭代，但由于我在位置 5 处添加了 `break` 语句，循环跳出了迭代，程序停止了。`continue` 语句不能说是 `break`\
  \ 语句的反反面，因为它和 `break` 语句一样，它也会中断循环，但随后会继续程序的剩余迭代。我将使用相同的示例来详细说明你如何从 `continue` 语句中受益。\n\
  \n# 学习 JavaScript 循环\n\n我将为 `for` 循环集成一个 `break` 语句。\n\n```javascript\nvar msg =\
  \ \"\";\nvar YY;\nfor (YY = 0; YY < 10; YY++) {\n  if (YY === 5) {\n    continue;\n\
  \  }\n  msg += \"The next digit is \" + YY +\"<br>\";\n}\ndocument.getElementById(\"\
  demo9\").innerHTML = msg;\n```\n\n下一个数字是 0\n下一个数字是 1\n下一个数字是 2\n下一个数字是 3\n下一个数字是\
  \ 4\n下一个数字是 6\n下一个数字是 7\n下一个数字是 8\n下一个数字是 9\n\n循环在点 5 处中断然后继续。你可以看到结果中唯一的缺失数字是 5。`continue`\
  \ 语句适用于跳过循环的一次迭代。`break` 语句只有一个目的：让你跳出 `switch` 或循环。你可以使用 `break` 语句来跳出代码块。\n\n\
  # 第七章：JavaScript 函数\n\n到目前，我们已经创建了在浏览器加载网页时立即运行的脚本。使用代码还有另一种方法。你可以将代码封装在函数内部并在网络浏览器中运行它。除非你进行函数调用，否则你不会在浏览器中看到任何操作效果。一个函数短语包含\
  \ `function` 关键字、函数名和花括号。\n\n你必须在 `function` 关键字后面包含一个空格。之后，你需要编写你选择给函数起的名字。这些与变量命名的习惯非常相似。然而，函数命名的唯一区别在于，你可以向函数名中添加数字、字母、`$`\
  \ 或下划线。之后，你需要添加一组圆括号来包含任何参数（参数）。之后，你需要放入花括号来编写代码。你不需要将函数写在多行上。如果你觉得方便，可以写在一行。但是，在开始时最好写在多行，这样你就能清楚地知道它是如何写的。此外，如果代码运行得不好，你可以轻松地纠正任何错误。\n\
  \n创建 JavaScript 函数是为了执行特殊任务。当你进行函数调用时，可以执行它。\n\n在这个示例中，我将调用一个函数来执行计算并返回结果：\n\n```javascript\n\
  function FunctionZZ(x1, x2) {\n  return x1 * x2;\n}\ndocument.getElementById(\"\
  demo890\").innerHTML = FunctionZZ(345, 1222);\n```\n\n421590。\n\n你可以看到有一个 `function`\
  \ 关键字，后面跟着函数名。我在代码中包含了圆括号。你可以在括号中包含一个或多个参数。你需要在函数中包含的代码放在花括号内。至于函数参数，你需要在创建函数并在现在想要调用它时传递它们。在函数内部，这些参数的行为非常像局部变量。函数的工作方式与其他编程语言中的\
  \ `Subroutine`（子程序）和 `Procedure`（过程）是一致的。\n\n## 的调用\n\n你封装在函数内部的代码只有在调用函数时才会执行。调用过程也称为进行函数调用。它可能发生在访问者点击网页上的按钮时，或者你可以从\
  \ JavaScript 代码中调用它。你也可以将函数设置为自调用的。\n\n函数末尾有一个 `return`。当你到达它时，函数将停止执行。函数更多时候是计算返回值，然后该值将返回给执行函数调用的人。\n\
  \n```javascript\nvar Y = FunctionZZ(55, 2345)\ndocument.getElementById(\"demo890\"\
  ).innerHTML = Y;\nfunction FunctionZZ(x1, x2) {\n  return x1 * x2;\n}\n```\n\n128975。\n\
  \n在接下来的示例中，你将看到我在创建一次代码后多次复用它。你可以根据需要填充任意数量的参数并产生不同的结果。这在开发网页时节省了时间和精力。这也让编码过程变得快速高效。请看以下示例。\n\
  \n```javascript\nfunction toCels(f) {\n  return (15/90) * (f);\n}\ndocument.getElementById(\"\
  demo789\").innerHTML = toCels(80);\n```\n\n6.666666666666667（从华氏度到摄氏度）。\n\n## ()\
  \ 运算符\n\n单词 `toCels` 指函数对象，而 `toCels()` 指函数的结果。当你不带括号访问函数时，它返回的是函数对象而不是结果。\n\n```javascript\n\
  function toCels(f) {\n  return (15/90) * (f);\n}\ndocument.getElementById(\"demo89\"\
  ).innerHTML = toCels;\n```\n\n```javascript\nfunction toCels(f) {\n  return (15/90)\
  \ * (f);\n}\ndocument.getElementById(\"demo89\").innerHTML = toCels();\n```\n\n\
  \ 作为变量函数\n\n你可以像使用变量一样在不同的赋值和计算中使用函数。与其使用变量来存储函数的返回值，你可以直接以变量的形式使用它。\n\n```javascript\n\
  function toCels(tempheit) {\n  return (15/90) * (tempheit);\n}\ndocument.getElementById(\"\
  demo234\").innerHTML = \"Presently, the temperature is about \" + toCels(90) + \"\
  \ Celsius\";\n```\n\n8.33333333333334 局部变量\n\n在 JavaScript 函数内部声明的变量是局部的。你只能在函数内部访问局部变量。\n\
  \n```javascript\nfunction FunctionOP() {\n  var carsale = \"BMW\";\n}\ndocument.getElementById(\"\
  demo15\").innerHTML = typeof FunctionOP();\ndocument.getElementById(\"demo25\").innerHTML\
  \ = typeof carsale;\n```\n\nundefined。BMW。\n\n局部变量可以在函数中识别。具有相同名的变量可以在多个函数中使用。当函数开始时，创建局部变量。当函数完成时，局部变量被删除。当你创建一个函数时，你可以保存代码并加载到浏览器中。如果你看到没有发生，是因为花括号之间的代码没有显示。有多种方法可以进行函数调用。你可以使用\
  \ `onload` 函数将函数加载到浏览器窗口以成功执行。\n\n## JavaScript 表达式\n\n你可以通过表达式定义 JavaScript 函数。你可以将函数的表达式存储在变量中。\n\
  \n```javascript\nvar Y = function (x, y) {\n  return x * y;\n};\ndocument.getElementById(\"\
  demo12\").innerHTML = Y;\n```\n\n3026。\n\n表达式存储在变量后，你可以在函数中使用该变量。在接下来的示例中，我将为变量分配值。\n\
  \n```javascript\nvar Y = function (x, y) {\n  return x * y;\n};\ndocument.getElementById(\"\
  demo12\").innerHTML = Y(34, 89);\n```\n\n如果你分析上面的示例，你会发现函数缺少名称。我特意保持它是匿名的。存储在变量中的函数不需要命名。你始终可以通过变量名来调用它们。至于末尾添加分号，是为了结束执行语句。\n\
  \n## constructor()\n\nJavaScript 函数通常通过 `function` 关键字定义。这些函数是通过 `constructor()`\
  \ 创建和定义的。\n\n```javascript\nvar FunctionLK = new Function(\"x\", \"y\", \"return\
  \ x * y\");\ndocument.getElementById(\"demo555\").innerHTML = FunctionLK(345, 2);\n\
  ```\n\n690。如果我们考虑 `constructor()` 的实际应用，我们会发现不需要使用 `constructor`。\n\n```javascript\n\
  var FunctionLK = function(x, y) {\n  return x * y;\n};\ndocument.getElementById(\"\
  demo555\").innerHTML = FunctionLK(345, 2);\n```\n\n690。\n\n## 自调用\n\n函数的表达式可以被制为自调用。即使你不调用，自调用表达式也可以被调用。如果你在函数后加上圆括号，函数的表达式将执行。你必须在函数周围加上括号以表示它是函数的表达式。\n\
  \n```javascript\n(function () {\n  document.getElementById(\"demo689\").innerHTML\
  \ = \"This is calling by myself\";\n})();\n```\n\n这是自调用。上述示例中的函数是匿名自调用函数。我没有给它命名。你可以按照下面的方式将函数作为值：\n\
  \n```javascript\nfunction FunctionH(x, y) {\n  return x * y;\n}\nvar Y = FunctionH(2,\
  \ 2);\ndocument.getElementById(\"demo12\").innerHTML = Y;\n```\n\n4. Y = FunctionH(2,\
  \ 2) 或 Y = 4。在上述情况下，数字 Y 变成了值 4。你可以在表达式中使用函数。\n\n```javascript\nfunction Function123(x,\
  \ y) {\n  return x * y;\n}\nvar Y = Function123(5, 2) * 8;\ndocument.getElementById(\"\
  demo678\").innerHTML = Y;\n```\n\n80。\n\n## 函数或对象\n\n如果你使用之前章节中学到的 `typeof` 运算符来了解函数的类型，你会发现\
  \ JavaScript 函数最好以对象的形式描述。就像对象一样，JavaScript 函数有方法和属性。在接下来的示例中，我将尝试将一些属性应用于函数并观察它的行为。`length`\
  \ 属性用于返回函数接收到的参数。\n\n## Getters setters\n\n通过类，你可以在浏览器中调整 getters 和 setters。如果你需要对返回值进行特殊处理，getters\
  \ 和 setters 对属性是有用的。你可以使用 `get` 和 `set` 关键字将它们添加到类中。\n\n```javascript\nclass LuxCars\
  \ {\n  constructor(cname, caryear, cmake, carmodel, ccolor) {\n    this.cname =\
  \ cname;\n    this.cyear = caryear;\n    this.cmake = cmake;\n    this.cmodel =\
  \ carmodel;\n    this.ccolor = ccolor;\n  }\n  get namec() {\n    return this.cname;\n\
  \  }\n  set namec(Y) {\n    this.cname = Y;\n  }\n}\nlet Car2 = new LuxCars(\"Tesla\"\
  );\ndocument.getElementById(\"demo778\").innerHTML = Car2.namec;\n```\n\n## 删除\n\
  \n正如属性的添加很简单，删除也是容易的。使用 `delete` 关键字，JavaScript 会删除对象中的属性。当你删除了它后，你将无法使用该属性。这与其他编程语言不同。该运算符仅适用于对象，对变量没有影响。在函数中可以识别同名的属性。\n\
  \n```javascript\nvar man1 = {\n  Namef: \"Christiano\",\n  Namel: \"Ronaldo\",\n\
  \  profession: \"soccer star\",\n  economicalstatus: \"rich\"\n};\ndelete man1.nationality;\n\
  document.getElementById(\"demo90\").innerHTML = man1.Namef + \" is the biggest \"\
  \ + man1.profession + \" across the world. He is from \" + man1.nationality + \"\
  .\";\n```\n\nundefined。你可以看到 JavaScript 删除了属性之前在程序中使用。调用函数的方法有很多。\n\n## 日期\n\n学习\
  \ 日期功能是有有趣的。当你创建一个新网站时，需要将日期功能集成到你的网页中以便访问者可以看到。默认情况下，JavaScript 的日期输出是根据时区显示的。显示是一个完整的字符串。你可以创建不同的对象来包含日期。日期可以是年、月、小时、秒和毫秒。你可以根据需要添加更多信息。你可以使用\
  \ `new Date()` 方法创建一个新对象来显示当前的日期时间和。\n\n```javascript\nvar Y = new Date();\ndocument.getElementById(\"\
  demo678\").innerHTML = Y;\n```\n\n## JavaScript 类\n\nJavaScript 也被称为基于原型的语言。这种语言中的每个对象保留了一个名为\
  \ `[[Prototype]]` 的隐藏内部属性。你可以使用它来扩展对象的方法和属性。你可以使用 `class` 关键字创建类。\n\n```javascript\n\
  class LuxCars {\n  constructor(cname, caryear, cmake, carmodel, ccolor) {\n    this.cname\
  \ = cname;\n    this.cyear = caryear;\n    this.cmake = cmake;\n    this.cmodel\
  \ = carmodel;\n    this.ccolor = ccolor;\n  }\n  carAge() {\n    let cdate = new\
  \ Date();\n    return cdate.getFullYear() - this.cyear;\n  }\n}\nlet Car1 = new\
  \ LuxCars(\"Ford\", 2017, \"USA\", \"Mustang\", \"Blue\");\ndocument.getElementById(\"\
  demo777\").innerHTML = Car1.cname + \" \" + Car1.cyear + \" \" + Car1.cmake + \"\
  \ \" + Car1.cmodel + \" \" + Car1.ccolor;\nlet Car2 = new LuxCars(\"BMW\", 2010,\
  \ \"Germany\", \"K45\", \"Silver\");\ndocument.getElementById(\"demo778\").innerHTML\
  \ = Car2.cname + \" \" + Car2.cyear + \" \" + Car2.cmake + \" \" + Car2.cmodel +\
  \ \" \" + Car2.ccolor;\nlet Car3 = new LuxCars(\"Mercedes\", 2021, \"Germany\",\
  \ \"S-Class\", \"Black\");\ndocument.getElementById(\"demo779\").innerHTML = Car3.cname\
  \ + \" \" + Car3.cyear + \" \" + Car3.cmake + \" \" + Car3.cmodel + \" \" + Car3.ccolor;\n\
  ```\n\n## 类方法\n\n编写和执行类方法的步骤与编写和创建对象相同。向类中添加新方法时，你必须使用 `class` 关键字和 `constructor()`\
  \ 方法。你可以添加的方法总数没有限制。你可以随心添加任何数量。让我们添加一个新方法来声明汽车的年龄。JavaScript 使用当前日期作为参考计算汽车的年龄。例如，如果一辆汽车是在\
  \ 2020 年生产的，程序将显示年龄为 1 岁，因为今年是 2021 年。\n\n（此处代码块在原文中未提供完整，根据描述推断）\n\n"
