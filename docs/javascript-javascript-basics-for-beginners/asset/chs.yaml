  \  <p>JavaScript 减法。</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n    var a\
  \ = 55;\n    var b = 40;\n    var c = a - b;\n    document.getElementById(\"variable-demo\"\
  ).innerHTML = c;\n  </script>\n</body>\n</html>\n```\nJavaScript 算术\nJavaScript\
  \ 减法。\n15\n\n## 字符串拼接 (String Concatenation)\n\n就像你学习了如何相加数字一样，JavaScript 允许你拼接字符串。我将在下面的示例中使用\
