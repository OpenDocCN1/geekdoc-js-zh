  \ `Array.findIndex()`\n小于 500 的数字索引 =0\n\n# 第六章：JavaScript 循环\n\n`for`循环包含一个语句和三个表达式。有一个初始化部分在`for`循环第一次执行之前运行。此表达式用于创建计数器。你在这里创建的变量会立即作用于循环。一旦循环执行并到达逻辑终，这些变量就会被销毁。\n\
  \n`for`循环的另一个部分是条件。`for`循环在每次新迭代执行之前检查此表达式。如果你省略这部分，表达式将被求值为真，并执行循环中的语句。如果求值为假，循环停止工作。\n\
  \n循环的另一个部分是最终表达式。此表达式在每次迭代后运行。它用于增加计数器。然而，你也可以用它来减少计数器。循环的语句部分是在循环内部必须重复的代码。你可以根据需要从`for`循环中省略这些表达式。\n\
  \nJavaScript 中的`for`循环用于计数数字或语句的迭代。它们还可以重复代码中的语句。只有在循环中插入了 `break`语句后才能退出循环。我将在后续章节中更多探索`break`语句。\n\
  \n循环是特殊的，因为它们节省了多次编写代码的烦恼。它重复代码直到满足某些条件。\n\n\n\n如果你非常在意索引的顺序，你应该放弃在数组循环中使用 `for...in`\
  \ 的念头。该顺序独立于实现方式。你无法按照预期的顺序来访问数组的值。当你认为顺序特殊时，使用 `for of` 循环、`for` 循环和 `Array.forEach()`\
  \ 对你来说很重要且更好。\n\n### forEach() 循环\n该方法为数组的每个元素调用一次函数，也称为回调函数。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>学习 JavaScript Array.forEach() 循环</p>\n<p>此程序将为数组的每个元素调用一次函数。</p>\n\
  <p id=\"demo5\"></p>\n<script>\nvar msg = \"\";\nvar nums = [55545, 454, 1239, 78816,\
  \ 45625];\nnums.forEach(FunctionYZ);\ndocument.getElementById(\"demo5\").innerHTML\
  \ = msg;\nfunction FunctionYZ(fvalue, findex, farray) {\nmsg = msg + fvalue + \"\
  <br>\";\n}\n</script>\n</body>\n</html>\n```\n\n学习 JavaScript Array.forEach() 循环\n\
  此程序将为数组的每个元素调用一次函数。\n55545, 454, 1239, 78816, 45625\n\n上述代码中的函数通常接受三个参数。第一个参数是项目的值。第二个参数是项目的索引，第三个参数是数组本身。由于示例中只使用了值参数，你可以按照以下模式重写。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript Array.forEach() 循环</p>\n\
