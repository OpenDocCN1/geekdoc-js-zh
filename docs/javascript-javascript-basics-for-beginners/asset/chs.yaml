  array-demo\"></p>\n<script>\nvar veggies = [\"Tomato \", \"Potato \", \"Cauliflower\
  \ \", \"Cabbage \"];\nvar freshggies = veggies.slice(1);\nvar freshggies1 = veggies.slice(2);\n\
  document.getElementById(\"array-demo\").innerHTML = veggies + \"<br><br>\" + freshggies\
  \ + \"<br><br>\" + freshggies1;\n</script>\n</body>\n</html>\n```\nJavaScript Array\
  \ concat()\nconcat() method follows the merging pattern:\nTomato, Potato, Cauliflower,\
  \ Cabbage\n\n等等，提供的文本很乱。让我清理一下：\n\n`slice()` 方法保持现有数组完好无。它不会从数组源删除任何新元素。如果你省略了结束参数，结果将包含整个被留下的数组。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array concat()</p>\n<p>The\
  \ concat() method follows the merging pattern:</p>\n<p id=\"array-demo\"></p>\n\
  <script>\nvar veggies = [\"Tomato \", \"Potato \", \"Cauliflower \", \"Cabbage \"\
  ];\nvar freshggies = veggies.slice(1, 3);\ndocument.getElementById(\"array-demo\"\
  ).innerHTML = veggies + \"<br><br>\" + freshggies;\n</script>\n</body>\n</html>\n\
  ```\nconcat() method follows the merging pattern:\nTomato, Potato, Cauliflower,\
  \ Cabbage\n\n## 排序\n你可以使用 `sort()` 方法按字母顺序对数组进行排序。当你在零售店或金融公司处理大量数组项时，这很有帮助。\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This JavaScript Array Sort method</p>\n\
  <p>This method will sort out an array in alphabetical order.</p>\n<button onclick=\"\
  FunctionAlpha()\">Click Me</button>\n<p id=\"demo10\"></p>\n<script>\nvar veggies\
  \ = [\"Garlic \", \"Spinach \", \"Radish \", \"Potato \"];\ndocument.getElementById(\"\
  demo\").innerHTML = veggies;\nfunction FunctionAlpha(){ veggies.sort();document.getElementById(\"\
  demo10\").innerHTML = veggies;}\n</script>\n</body>\n</html>\n```\nsort method will\
  \ sort out an array in alphabetical order.\nGarlic, Peas, Potato, Radish\n\n## 数字排序\n\
  `sort()` 函数默认按字符串形式对值排序。当你有单词要排序时，它们工作良好。然而，如果你有数字要排序，将会出现问题。由于 20 大于 100，当你尝试应用\
  \ `sorted()` 方法时可能会得到错误的结果。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript\
  \ Array Sort</p>\n<p>By clicking the button, you can sort the array in ascending\
  \ order.</p>\n<button onclick=\"FunctionT()\">Click Me</button>\n<p id=\"demo10\"\
  ></p>\n<script>\nvar nums = [4000, 1000, 15, 555, 253, 102];\ndocument.getElementById(\"\
  demo10\").innerHTML = nums;\nfunction FunctionT(){ nums.sort(function(x, y){return\
  \ x - y});document.getElementById(\"demo10\").innerHTML = nums; }\n</script>\n</body>\n\
  </html>\n```\nsort you can sort the array in ascending order.\n15, 102, 253, 555,\
  \ 1000, 4000\n\n现在我将使用相同的 `sort()` 方法反转顺序。让我们看看点击按钮后可以得到什么类型的结果。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>JavaScript Array Sort</p>\n<p>By clicking the button,\
  \ you can sort the array in ascending order.</p>\n<button onclick=\"FunctionT()\"\
  >Click Me</button>\n<p id=\"demo10\"></p>\n<script>\nvar nums = [4000, 1000, 15,\
  \ 555, 253, 102];\nfunction FunctionT(){ nums.sort(function(x, y){return y - x});document.getElementById(\"\
  demo10\").innerHTML = nums; }\n</script>\n</body>\n</html>\n```\n4000, 555, 253,\
  \ 102, 100, 15\n\n## 比较函数\n你可以使用 `compare` 函数来获得想要的结果，即使你处理的是数字。该函数的作用是定义排序的特定替代方案。根据你使用的参数，`compare`\
  \ 函数必须返回零、负或正值。如果你看到负结果，你将看到 `x` 排在 `y` 之前。正结果如此。零表示值的排序顺序没有变化。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>JavaScript Array Sort</p>\n<p>You can use the click\
  \ buttons to sort out the arrays either in alphabetical order or in numerical order.</p>\n\
  <button onclick=\"FunctionP()\">Click Me to Sort Alphabetically</button>\n<button\
  \ onclick=\"FunctionQ()\">Click Me to Sort Numerically</button>\n<p id=\"demo1\"\
  ></p>\n<script>\nvar nums = [4045, 1002, 1567, 5234, 251, 100];\ndocument.getElementById(\"\
  demo1\").innerHTML = nums;\nfunction FunctionP(){ nums.sort();document.getElementById(\"\
  demo1\").innerHTML = nums; }\nfunction FunctionQ(){ nums.sort(function(x, y){return\
  \ x - y});document.getElementById(\"demo1\").innerHTML = nums; }\n</script>\n</body>\n\
  </html>\n```\nYou can use the click buttons to sort out the arrays either in alphabetical\
  \ order or in numerical order.\nClick Me to Sort Alphabetically\nClick Me to Sort\
  \ Numerically\n4045, 1002, 1567, 5234, 251, 100\n\n上面的结果是你在浏览器中运行代码时显示的原始结果。这是当你点击字母排序按钮时发生的情况。\n\
  4045, 1002, 1567, 5234, 251, 100\n\n你可以使用点击按钮按字母顺序或数字顺序对数组排序。\nClick Me to Sort\
  \ Alphabetically\nClick Me to Sort Numerically\n100, 1002, 1567, 251, 4045, 5234\n\
  \n## 随机排序\n你可以使用 `random` 方法来随机排序数组。查看示例以学习如何添加代码并获取想要的结果。通过使用 `random` 方法，你每次点击按钮都会得到不同的结果。你可以多次点击按钮。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array Sort</p>\n<p>By\
  \ clicking the button, you can sort the array in ascending order.</p>\n<button onclick=\"\
  FunctionT()\">Click Me</button>\n<p id=\"demo10\"></p>\n<script>\nvar veggies =\
  \ [\"Tomato\", \"Potato\", \"Cauliflower\", \"Cabbage\"];\nfunction FunctionT(){\
  \ veggies.sort(function(x, y){return 0.5 - Math.random()});document.getElementById(\"\
  demo10\").innerHTML = veggies; }\n</script>\n</body>\n</html>\n```\n15, 253, 555,\
  \ 1000\n\n## 费尔-舍斯特方法\n`random` 方法的问题是它倾向于某些数字而不是其他的。另一种更正确且有用的方法。它通常被称为 `Fisher-Yates`\
  \ 洗牌。该方法在早期数据科学中引入。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array\
  \ Sort</p>\n<h3>This is Fisher-Yates Method</h3>\n<p>When you click the button repeatedly,\
  \ you will sort the array in random order.</p>\n<button onclick=\"FunctionXX()\"\
  >Click Me</button>\n<p id=\"demo12\"></p>\n<script>\nvar nums = [404, 10023, 123,\
  \ 589, 2511, 102];\nfunction FunctionXX(){\nvar a, b, c;\nfor (a = nums.length -1;\
  \ a > 0; a--) {\nb = Math.floor(Math.random() * (a + 1));\nc = nums[a];\nnums[a]\
  \ = nums[b];\nnums[b] = c;\n}\ndocument.getElementById(\"demo12\").innerHTML = nums;\
  \ }\n</script>\n</body>\n</html>\n```\n404, 102, 123, 589, 2511, 10023\n\n\n\n\n\
  2234\n12349\n16899\n\n\n\n900025 我为函数分配了三个参数；第一个参数处理项的值，第二个参数处理项的索引，第三个参数处理整个数组。在上述示例中，我只部署了\
  \ `Evalue` 参数。这意味着，如果你不需要另外两个参数，可以将它们从函数中切切掉以简化代码。然而，如果你认为你以后会需要另外两个参数，可以保留它们并在稍后的单独函数调用中使用它们。`Array.forEach()`\
  \ 方法最大的优点是，它适用于除 Internet Explorer 8 或更早版本以外的所有网络浏览器。\n\n## map() 方法\n\n程序员使用 `map()`\
  \ 方法通过对所有数组元素执行单独的函数来创建一个新数组。它不会对没有值的元素执行该函数，也不会改变数组的原始形式。接下来的示例将使用加法运算符为数组中的每个数字加上\
  \ 1000，并以此创建一个新数组。\n\n```html\n<!DOCTYPE html>\n<html><body><p>这是 JavaScript Array.map()</p><p>我将通过对所有数组元素应用该函数来创建一个新数组。</p><p\
  \ id=\"demo90\"></p><script>var nums1 = [12345, 7674, 3449, 12316, 9900025];var\
  \ nums2 = nums1.map(FunctionM);document.getElementById(\"demo90\").innerHTML = nums2;function\
  \ FunctionM(Mvalue, Mindex, Marray) {return Mvalue + 1000;}</script></body></html>\n\
  ```\n\n这是 JavaScript `Array.map()`\n我将通过对所有数组元素应用该函数来创建一个新数组。\n13345,8674,4449,13316,9901025\
  \ 我将移除加法运算符并添加乘法运算符以产生结果并创建一个新数组。\n\n```html\n<!DOCTYPE html>\n<html><body><p>这是\
  \ JavaScript Array.map()</p><p>我将通过对所有数组元素应用该函数来创建一个新数组。</p><p id=\"demo90\"></p><script>var\
  \ nums1 = [12345, 7674, 3449, 12316, 9900025];var nums2 = nums1.map(FunctionM);document.getElementById(\"\
