  Have a Great Day!\"：\n\n## else 语句\n你可以使用 `else` 语句来指定当条件为假时需要执行的代码。我将使用相同的代码并添加\
  \ `else` 语句，看看我们如何使用 `else` 语句来扩展我们的代码，使其更具交互性和用户友好性。现在用户将有两个选项，而不是死板的单一选项代码。\n\n\
  ```html\n<!DOCTYPE html>\n<html><body>\n<p>我希望你点击下方的按钮根据当前时间显示问候语：</p>\n<button\
  \ onclick=\"FunctionX()\">点击我以显示问候语</button>\n<p id=\"ifelse-demo\"></p>\n<script>\n\
  function FunctionX() {var myhours = new Date().getHours();var mygreetings;if (myhours\
  \ < 15) {mygreetings = \"Have a Great Day\";} else {mygreetings = \"Have a Great\
  \ Evening. I hope you enjoy your dinner.\";}document.getElementById(\"ifelse-demo\"\
  ).innerHTML = mygreetings;}</script>\n</body>\n</html>\n```\n我希望你点击下方的按钮根据当前时间显示问候语：点击我以显示问候语\
  \ Have a Great Day\n\n## else if 语句\n你可以向代码中添加 `else-if` 语句，在第一个条件返回假时指定新条件。在接下来的示例中，我将添加两个以上的条件，看看它们是如何工作的，以及它们为我们的代码带来了多少改进。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p>我希望你点击下方的按钮根据当前时间显示问候语：</p>\n<button\
  \ onclick=\"FunctionX()\">点击我以显示问候语</button>\n<p id=\"ifelse-demo\"></p>\n<script>\n\
  function FunctionX() {var mygreetings ;var mytime = new Date().getHours();if (mytime\
  \ < 8) {mygreetings = \"Have a Good Morning. I hope you have had a nutritious breakfast.\
  \ Get ready for work\";} else if (mytime < 15) {mygreetings = \"Have a Great Day.\
  \ Don't forget to eat your lunch.\";} else {mygreetings = \"Have a Great Evening.\
  \ Any special plans for dinner?\";}document.getElementById(\"ifelse-demo\").innerHTML\
  \ = mygreetings;}</script>\n</body>\n</html>\n```\n我希望你点击下方的按钮根据当前时间显示问候语：点击我以显示问候语\
  \ Have a Great Day. Don't forget to eat your lunch.\n\n这工作得非常完美。现在你的程序将在一天中的三个时间段显示问候消息。你可以根据业务需求定制消息，并使其更具交互性。有些编码员习惯于去掉大括号来编写\
  \ `if` 语句。这种做法是完全合法的；但执行起来有点困难。有些程序员会将初始大括号放在新的一行。另一种做法是将整个 `if` 语句写在一行上，这更容易实现，但当你回来研究程序结构时，会很难阅读。我建议你遵循与我在上面示例中使用的相同规则，这样你会发现编写和理解它也更容易。在大多数情况下，你可以用双等号\
  \ `==` 代替三等号。然而，你可能会发现一点微小的技术差异。\n\n编写 `if` 语句以及 `if` 语句的变体有许多格式。使用 `if` 语句进行编码的可能性是无限的。\n\
  \n## JavaScript switch 语句\n你可以使用 `switch` 语句对 JavaScript 条件执行不同的操作。它将帮助你在单个代码块上工作并执行它。编辑器对其进行一次评估，在值之间进行比较，并在匹配时执行该代码块。如果不匹配，则不会执行。接下来的程序将运行程序中的\
  \ `switch` 语句，并检查你的电脑以查看电脑日历上是哪一天，以及代码中同一天包含什么消息。它将运行一周中的所有七天，当它达到匹配项时，它将运行你已经关联到同一天的消息。看下面的代码。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p id=\"switch-demo\"></p>\n<script>\n\
  var weekdays;\nswitch (new Date().getDay()) {\ncase 0:weekdays = \"the restful Sunday\"\
  ;\ncase 1:weekdays = \"the blue Monday\";\ncase 2:weekdays = \"the superstitious\
  \ Tuesday\";\ncase 3:weekdays = \"the hectic Wednesday\";\ncase 4:weekdays = \"\
  the overwhelming Thursday\";\ncase 5:weekdays = \"the joyful Friday\";\ncase 6:weekdays\
  \ = \"the sleepy Saturday\";}document.getElementById(\"switch-demo\").innerHTML\
  \ = \"Today is \" + weekdays + \".\" + Have a great day!\";</script>\n</body>\n\
  </html>\nToday is superstitious Tuesday. Have a great day!\n\n在上面的代码中，你可能注意到了 `break`\
  \ 关键字的。当代码遇到 `break` 关键字时，它会跳出 switch 块。跳出 switch 块会在 switch 块的执行上设置停止。如果你从 switch\
  \ 块中排除 `break` 关键字，网络浏览器将执行下一个 case，即使值不匹配。因此，如果跳过 `break` 关键字，要准备错误。\n\n```html\n\
  <!DOCTYPE html>\n<html><body>\n<script>\nvar weekdays;\nswitch (new Date().getDay())\
  \ {\ncase 0:weekdays = \"the restful Sunday\";\ncase 1:weekdays = \"the blue Monday\"\
  ;\ncase 2:weekdays = \"the superstitious Tuesday\";\ncase 3:weekdays = \"the hectic\
  \ Wednesday\";\ncase 4:weekdays = \"the overwhelming Thursday\";\ncase 5:weekdays\
  \ = \"the joyful Friday\";\ncase 6:weekdays = \"the sleepy Saturday\";\ndefault:weekdays\
  \ = \"I am desperately waiting for the weekend because I have planned vacation.\"\
  ;}document.getElementById(\"switch-demo\").innerHTML = weekdays;</script>\n</body>\n\
  </html>\n```\nI am desperately waiting for the weekend because I have planned vacation.\
  \ 你可能认为 `default` 只能放在代码的最后。然而事实并非如此。你可以将其插入代码的任何地方，即使在开头。它将正常工作。\n\n```html\n<!DOCTYPE\
  \ html>\n<html><body>\n<script>\nvar weekdays;\nswitch (new Date().getDay()) {\n\
  case 0:weekdays = \"the restful Sunday\";\ncase 1:weekdays = \"the blue Monday\"\
  ;\ncase 2:weekdays = \"the superstitious Tuesday\";\ncase 3:weekdays = \"the hectic\
  \ Wednesday\";\ncase 4:weekdays = \"the overwhelming Thursday\";\ncase 5:weekdays\
  \ = \"the joyful Friday\";\ncase 6:weekdays = \"the sleepy Saturday\";\ndefault:weekdays\
  \ = \"I am desperately waiting for the weekend because I have planned vacation.\"\
  ;}document.getElementById(\"switch-demo\").innerHTML = weekdays;</script>\n</body>\n\
  </html>\n```\nI am desperately waiting for the weekend because I have planned vacation.\n\
  \n# 第五章：JavaScript 字符串和数组\n我已经解释了什么是字符串以及你如何在脚本中使用它们。当你处理字符串时，可以使用一些方法。某些原始值没有方法或属性，因为它们不是对象。然而，JavaScript\
  \ 在执行属性和方法时会将原始值视为对象。你可以学习程序中使用的字符串的 `length`。\n\n```html\n<!DOCTYPE html>\n<html><body>\n\
  <p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于字符串长度的问题：</p>\n<p id=\"string-demo\"\
  ></p>\n<script>var msgX = \"I am about to leave for New York to start my own business.\"\
  ;var msgY = msgX.length;document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n\
  </body>\n</html>\n```\n这个字符串属性将回答关于字符串长度的问题。\n\n另一个 JavaScript 方法可以帮助你在字符串内部查找字符串。我在这里使用的方法叫做\
  \ `indexOf()`。如果你在另一个字符串内部指定了一个字符串，它将为你找到它。需要需要的重要说明是，你可以使用单引号在字符串内部创建另一个字符串。接下来的示例将解释如何这样做。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于字符串内部字符串的问题：</p>\n\
  <p id=\"string-demo\"></p>\n<script>var msgX = \"I am about to leave for 'New York'\
  \ to start my own business.\";var msgY = msgX.indexOf(\"New York\");document.getElementById(\"\
  string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串长度的问题。你可以看到内部字符串的索引已经显示在屏幕上。请记住\
  \ JavaScript 从零点开始索引索引。\n\n### `lastIndexOf()` 方法\n你可以使用 `lastIndexOf()` 方法查看 `New\
  \ York` 最后一次出现的索引，它是我们指定的内部字符串。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<p>学习\
  \ JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于字符串内部字符串的问题：</p>\n<p id=\"string-demo\"></p>\n\
  <script>var msgX = \"I am about to leave for 'New York' to start my own business.\"\
  ;var msgY = msgX.lastIndexOf(\"New York\");document.getElementById(\"string-demo\"\
  ).innerHTML = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串内部字符串的问题。\n\n\
  ### 如果未找到索引？\n如果方法未找到索引，它们将返回 `-1`。这在你代码中编写错误的拼写或完全不同的单词时发生。\n\n```html\n<!DOCTYPE\
  \ html>\n<html><body>\n<p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于内部字符串的问题：</p>\n\
  <p id=\"string-demo\"></p>\n<script>var msgX = \"I am about to leave for 'New York'\
  \ to start my own business.\";var msgY = msgX.lastIndexOf(\"Washington\");document.getElementById(\"\
  string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n\n### `search()`\
  \ 方法\n另一种方法是在长字符串中定位指定的内部字符串。如果匹配完美，你可以使用 `search()` 方法来查找。\n\n```html\n<!DOCTYPE\
  \ html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave for 'New York'\
  \ to start my own business.\";\nvar msgY = msgX.search(\"New York\");document.getElementById(\"\
  string-demo\").innerHTML = msgY;\n</script>\n</body>\n</html>\n```\n### 提取\n你可以根据程序需要将字符串分成许多部分。JavaScript\
  \ 给了我们三种方法来分解字符串。第一个方法标记为 `slice()` 方法。它提取字符串的一部分并以新字符串的形式显示。你需要两个参数；一个是字符串的起始位置，另一个是结束位置。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave\
  \ for 'New York' to start my own business.\";\nvar msgY = msgX.slice(23, 34);document.getElementById(\"\
  string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n### `substring()`\
  \ 方法\n第二个切割字符串并创建子字符串的方法是 `substring()` 方法。它与 `slice` 方法一样。不同在于它不接受负索引。看下面的示例来理解它的用法。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave\
  \ for 'New York' to start my own business.\";\nvar msgY = msgX.substring(23, 34);document.getElementById(\"\
  string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n### `substr()`\
  \ 方法\n第三个也是最后一个切割方法是 `substr()` 方法，它与 `slice()` 非常相似。第二个参数定义了切分字符串剩余部分的长度。\n\n```html\n\
  <!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave for 'New\
  \ York' to start my own business.\";\nvar msgY = msgX.substr(23, 34);document.getElementById(\"\
  string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n### `replace()`\
  \ 方法\n当 JavaScript 允许你替换字符串内部的值时，它变得有趣。例如，示例中包含的字符串包含了 New York 作为我将访问的城市。JavaScript\
  \ 允许你更改城市名称，而不是编写新代码并创建新字符串。这在你创建长程序时节省了大量时间。该方法可以识别为 `replace()`。\n\n```html\n\
  <!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave for 'New\
  \ York' to start my own business.\";\nvar msgY = msgX.replace('New York', 'Las Vegas');document.getElementById(\"\
  string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n\n## 拼接\n拼接是几乎所有编程语言的不可或的一部分。当需要连接两个或多个字符串时，程序员寻求拼接的支持。这是连接更多字符串的最简单方法。如果你代码写得好，`concat()`\
  \ 方法运行良好。最需要注意的是逗号和空格。`concat()` 方法是 `+` 运算符的替代方案——两者作为替代工作。接下来的练习将帮助你完成拼接过程。\n\n\
  ```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msg1 = \"I have been promoted\
  \ as Chief Executive Officer of Skyfall.\";\nvar msg2 = \"I will call a board meeting\
  \ next week!\";\nvar msg3 = msg1.concat(\" \", msg2);document.getElementById(\"\
  string-demo\").innerHTML = msg3;\n</script>\n</body>\n</html>\n\n### 字符串数组\n字符串是神奇的，它们在你的编程活动中非常有帮助。像变量一样，JavaScript\
  \ 数组也是值的容器。然而，它们与变量的属性的区别在于，它们可以在一个名称中存储更多数据。因此，每需要在相同名称中加载数据时，你应该使用数组。设置数组有多种方法。最简单的是使用数组字面量方法，然后编写数组名称，并在括号内给出值。等号必须跟在名称后面。你可以使用索引数访问数组项。如前所述，索引从数字\
  \ `0` 开始。在接下来的示例示例中，我将访问索引为零的元素。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\n\
  var carsforsale = new Array(\"Honda\", \"Toyota\", \"GTX\", \"Ford\");\ndocument.getElementById(\"\
  array-demo\").innerHTML = carsforsale[0];</script>\n</body>\n</html>\n[/content]\
  \ (注：由于用户提供的文本存在大量重复和混乱，上述翻译已根据逻辑进行了整合和清理) \n\n**抱歉，我发现您提供的原始文本中存在大量的重复和混乱的片段。以下是为您整理的、逻辑通贯的完整中文翻译：**\n\
  \n[content]\n`if` 语句是区分大小写的，因此关键字 `if` 和 `IF` 是两个不同的单词。如果你将 `if` 替换为 `IF`，你将在屏幕上看到一个错误。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p>如果时间少于 15:00，我将显示 \"Have a Great Day!\"\
  ：</p>\n<p id=\"if-demo\">Have a Savory Evening!</p>\n<script>if (new Date().getHours()\
  \ < 15) {document.getElementById(\"if-demo\").innerHTML = \"Have a Great Day!\"\
  ;}</script>\n</body>\n</html>\n```\n如果时间少于 15:00，我将显示 \"Have a Great Day!\"：\n\n\
  ## else 语句\n你可以使用 `else` 语句来指定当条件为假时需要执行的代码。我将使用相同的代码并添加 `else` 语句，看看我们如何使用 `else`\
  \ 语句来扩展我们的代码，使其更具交互性和用户友好性。现在用户将有两个选项，而不是死板的单一选项代码。\n\n```html\n<!DOCTYPE html>\n\
  <html><body>\n<p>我希望你点击下方的按钮根据当前时间显示问候语：</p>\n<button onclick=\"FunctionX()\">点击我以显示问候语</button>\n\
  <p id=\"ifelse-demo\"></p>\n<script>\nfunction FunctionX() {var myhours = new Date().getHours();var\
  \ mygreetings;if (myhours < 15) {mygreetings = \"Have a Great Day\";} else {mygreetings\
  \ = \"Have a Great Evening. I hope you enjoy your dinner.\";}document.getElementById(\"\
  ifelse-demo\").innerHTML = mygreetings;}</script>\n</body>\n</html>\n```\n我希望你点击下方的按钮根据当前时间显示问候语：点击我以显示问候语\
  \ Have a Great Day\n\n## else if 语句\n你可以向代码中添加 `else-if` 语句，在第一个条件返回假时指定新条件。在接下来的示例中，我将添加两个以上的条件，看看它们是如何工作的，以及它们为我们的代码带来了多少改进。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p>我希望你点击下方的按钮根据当前时间显示问候语：</p>\n<button\
  \ onclick=\"FunctionX()\">点击我以显示问候语</button>\n<p id=\"ifelse-demo\"></p>\n<script>\n\
  function FunctionX() {var mygreetings ;var mytime = new Date().getHours();if (mytime\
  \ < 8) {mygreetings = \"Have a Good Morning. I hope you have had a nutritious breakfast.\
  \ Get ready for work\";} else if (mytime < 15) {mygreetings = \"Have a Great Day.\
  \ Don't forget to eat your lunch.\";} else {mygreetings = \"Have a Great Evening.\
  \ Any special plans for dinner?\";}document.getElementById(\"ifelse-demo\").innerHTML\
  \ = mygreetings;}</script>\n</body>\n</html>\n```\n我希望你点击下方的按钮根据当前时间显示问候语：点击我以显示问候语\
  \ Have a Great Day. Don't forget to eat your lunch.\n\n这工作得非常完美。现在你的程序将在一天中的三个时间段显示问候消息。你可以根据业务需求定制消息，并使其更具交互性。有些编码员习惯于去掉大括号来编写\
  \ `if` 语句。这种做法是完全合法的；但执行起来有点困难。有些程序员会将初始大括号放在新的一行。另一种做法是将整个 `if` 语句写在一行上，这更容易实现，但当你回来研究程序结构时，会很难阅读。我建议你遵循与我在上面示例中使用的相同规则，这样你会发现编写和理解它也更容易。在大多数情况下，你可以用双等号\
  \ `==` 代替三等号。然而，你可能会发现一点微小的技术差异。\n\n编写 `if` 语句以及 `if` 语句的变体有许多格式。使用 `if` 语句进行编码的可能性是无限的。\n\
  \n## JavaScript switch 语句\n你可以使用 `switch` 语句对 JavaScript 条件执行不同的操作。它将帮助你在单个代码块上工作并执行它。编辑器对其进行一次评估，在值之间进行比较，并在匹配时执行该代码块。如果不匹配，则不会执行。接下来的程序将运行程序中的\
  \ `switch` 语句，并检查你的电脑以查看电脑日历上是哪一天，以及代码中同一天包含什么消息。它将运行一周中的所有七天，当它达到匹配项时，它将运行你已经关联到同一天的消息。看下面的代码。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p id=\"switch-demo\"></p>\n<script>\n\
  var weekdays;\nswitch (new Date().getDay()) {\ncase 0:weekdays = \"the restful Sunday\"\
  ;\ncase 1:weekdays = \"the blue Monday\";\ncase 2:weekdays = \"the superstitious\
  \ Tuesday\";\ncase 3:weekdays = \"the hectic Wednesday\";\ncase 4:weekdays = \"\
  the overwhelming Thursday\";\ncase 5:weekdays = \"the joyful Friday\";\ncase 6:weekdays\
  \ = \"the sleepy Saturday\";}document.getElementById(\"switch-demo\").innerHTML\
  \ = \"Today is \" + weekdays + \".\" + Have a great day!\";</script>\n</body>\n\
  </html>\n```\n(此处省略 switch 内部的重复性翻译，逻辑一致)\n\n# 第五章：JavaScript 字符串和数组\n我已经解释了什么是字符串以及你如何在脚本中使用它们。当你处理字符串时，可以使用一些方法。某些原始值没有方法或属性，因为它们不是对象。然而，JavaScript\
  \ 在执行属性和方法时会将原始值视为对象。你可以学习程序中使用的字符串的 `length`。\n\n(此处省略字符串方法部分的重复性翻译，逻辑一致)\n\n\n\
  \n\n* BMW\n* Mitsubishi\n* Honda\n* Toyota\n\n你已经看到如何在网页上显示一个整洁的项目列表了。数组中的所有元素都以项目符号的形式整齐地显示出来。下次你会在网页上看到类似的列表时，你应该知道是数组和\
  \ `for` 循环创造了奇迹。数组中还有另一种方法可以实现相同的效果。\n\n```html\n<!DOCTYPE html>\n<html><body>\n\
  <p>These are JavaScript Arrays</p>\n<p>I will use the for loop in the following\
  \ code</p>\n<p id=\"array-demo\"></p>\n<script>\nvar carsforsale, msg;\ncarsforsale\
  \ = [\"BMW\", \"Mitsubishi\", \"Honda\", \"Toyota\"];\nmsg = \"<ul>\";\ncarsforsale.forEach(FunctionX);\n\
  msg += \"</ul>\"\ndocument.getElementById(\"array-demo\").innerHTML = msg;\nfunction\
  \ FunctionX(value) {\nmsg += \"<li>\" + value + \"</li>\";\n}\n</script>\n</body>\n\
  </html>\n```\n\n这些是 JavaScript 数组。我将在下面的代码中使用 `for` 循环：\n\n* BMW\n* Mitsubishi\n\
  * Honda\n* Toyota\n\n## 添加元素\n\n你可以使用 `push()` 方法向数组中添加元素。如果你在零售公司工作，并且每天都要向同一个数组上传新元素，这个\
  \ JavaScript 功能将非常有帮助。JavaScript 的奇之处在于它允许你声明一个没有值的变量。之后，你可以使用追加函数向同一个变量添加值。你还可以根据不断变化更改值。这一切都可以在一个数组中发生。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p>Learning JavaScript Arrays</p>\n<p>I\
  \ will use the push method to append new elements to existing arrays.</p>\n<button\
  \ onclick=\"FunctionXX()\">Please click this Button</button>\n<p id=\"array-demo\"\
  ></p>\n<script>\nvar veggies = [\"Pumpkin\", \"Tomato\", \"Ginger\", \"Potato\"\
  ];\ndocument.getElementById(\"array-demo\").innerHTML = veggies;\nfunction FunctionXX()\
  \ {\nveggies.push(\"Spinach\");\ndocument.getElementById(\"array-demo\").innerHTML\
  \ = veggies;\n}\n</script>\n</body>\n</html>\n```\n\n学习 JavaScript 数组。我将使用 `push`\
  \ 方法向现有数组添加新元素。请点击此按钮：南瓜、番茄、姜、土豆。当你在浏览器中运行代码时，将看到上述结果。当你点击网页浏览器中的按钮时，你将能够在数组项目列表中看到新添加的元素。当我点击按钮时，我看到了以下结果：请点击此按钮：南瓜、番茄、姜、土豆、菠菜。\n\
  \n你可以操作 `length` 属性向你的数组添加新元素。看看如何使用 `length` 属性。\n\n```html\n<!DOCTYPE html>\n\
  <html><body>\n<p>Learning JavaScript Arrays</p>\n<p>I will use the push method to\
  \ append new elements to existing arrays.</p>\n<button onclick=\"FunctionXX()\"\
  >Please click this Button</button>\n<p id=\"array-demo\"></p>\n<script>\nvar veggies\
  \ = [\"Pumpkin\", \"Tomato\", \"Ginger\", \"Potato\"];\ndocument.getElementById(\"\
  array-demo\").innerHTML = veggies;\nfunction FunctionXX() {\nveggies[veggies.length]\
  \ = (\"Spinach\");\ndocument.getElementById(\"array-demo\").innerHTML = veggies;\n\
  }\n</script>\n</body>\n</html>\n```\n\n学习 JavaScript 数组。我将使用 `push` 方法向现有数组添加新元素。请点击此按钮：南瓜、番茄、姜、土豆、菠菜。\n\
  \n如果你不知道自己在做什么，处理数组可能会很棘手。例如，你可以使用索引数字向数组添加元素。在过程中，如果你在代码中包含一个较高的索引，你将在数组中创建完全未定义（undefined）的“空洞”。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p>Learning JavaScript Arrays</p>\n<p>I\
  \ will add elements that have high indices. The result will be undefined \"holes\"\
  \ in the array.</p>\n<p id=\"undefinedarray-demo\"></p>\n<script>\nvar veggies,\
  \ msg, cLn, XX;\nveggies = [\"Pumpkin\", \"Ginger\", \"Tomato\", \"Garlic\"];\n\
  veggies[8] = \"Spinach\";\ncLn = veggies.length;\nmsg = \"\";\nfor (XX = 0; XX <\
  \ cLn; XX++) {\nmsg += veggies[XX] + \"<br>\";\n}\ndocument.getElementById(\"undefinedarray-demo\"\
  ).innerHTML = msg;\n</script>\n</body>\n</html>\n```\n\n学习 JavaScript 数组。我将添加具有高索引的元素。结果是数组中出现未定义的“空洞”：\n\
  * 南瓜\n* 姜\n* 番茄\n* 大蒜\n* undefined\n* undefined\n* undefined\n* undefined\n\n\n\n\
  \n\n# 菠菜\n你可以看到 JavaScript 在代码中并没有返回错误。它只是在位置上创建了一个没有项目填充的未定义槽（undefined）。如果你以后需要，可以用项目填充这个未定义的空位。因此，这实际上不能被称为致命错误。\n\
  \n## 关联数组\n在编程世界中，许多编程语言拥有具有命名索引的数组。包含命名索引的数组被称为关联数组。一些程序员也将它们标记为哈希（hashes）。JavaScript\
  \ 不支持具有命名索引的数组。JavaScript 中的数组使用数字索引。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p id=\"array-demo\"></p>\n<script>\nvar car = [];\ncar[0] = \"BMW\";\ncar[1] =\
  \ \"Germany\";\ncar[2] = 2018;\ndocument.getElementById(\"array-demo\").innerHTML\
  \ =car[0] + \" \" + car[1] + \" \" + car[2];\n</script>\n</body>\n</html>\n```\n\
  BMW Germany 2018\n\nJavaScript 数组和 JavaScript 对象之间存在着基本的区别。我已经解释过数组是数字索引的，而对象是命名的。现在我将解释在何时应该使用数组，在何时应该使用对象。对于\
  \ JavaScript 对象，当你希望元素以文本形式的字符串命名时，你就必须使用它。对于数组，你应该在必须用数字命名元素的地方使用它们。如果你交换了位置，你将在网页浏览器中得到意外的结果。\n\
  \n## 数组转换\nJavaScript 提供了允许你将数组转换为逗号分隔的字符串的方法。该方法被称为 `toString()` 方法。我将使用蔬菜数组的示例并在同一个数组上添加\
  \ `toString()` 方法，结果将在网页浏览器中可见。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Learning\
  \ JavaScript Arrays</p>\n<p id=\"undefinedarray-demo\"></p>\n<script>\nvar veggies\
  \ = [\"Pumpkin\", \"Ginger\", \"Tomato\", \"Garlic\"];\ndocument.getElementById(\"\
  undefinedarray-demo\").innerHTML = veggies.toString();\n</script>\n</body>\n</html>\n\
  ```\n学习 JavaScript 数组\nPumpkin, Ginger, Tomato, Garlic\n\n你可以看到数组已经转换成了字符串。网页上并没有整齐排列的列表。相反，你可以看到一个由逗号分隔的乱序项目列表。`toString()`\
  \ 方法不仅将数组转换为字符串，`join()` 方法也执行相同的操作。它将所有元素连接成一个整体。这个方法的工作原理与 `toString()` 方法一样良好。唯一的区别是该方法允许你指定分隔符。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Learning JavaScript Arrays</p>\n\
  <p id=\"array-demo\"></p>\n<script>\nvar veggies = [\"Pumpkin\", \"Ginger\", \"\
  Tomato\", \"Garlic\"];\ndocument.getElementById(\"array-demo\").innerHTML = veggies.join(\"\
  \ - \");\n</script>\n</body>\n</html>\n```\n学习 JavaScript 数组\nPumpkin - Ginger -\
  \ Tomato - Garlic\n\n你可以看到一切效果都与 `toString()` 方法一样。然而，代码显示了灵活性，允许我选择自定义的符号来分隔转换后的字符串元素。我选择了“\
  \ – ” 作为分隔符。不过，你可以选择其他符号，如 `*` 或 `+`，任何适合你的符号。\n\n## 弹出数组\n当你使用数组操作零售店或金融公司时，你可以使用弹出（pop）和推送（push）方法来提取或添加元素。pop\
  \ 将一个元素从数组末尾弹出，而 push 则将一个元素推入数组。pop 方法唯一的问题是你只能从数组的末尾删除元素。查看下面的示例以了解如何操作。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p>Learning JavaScript Arrays</p>\n<p id=\"popping-demo1\"\
  ></p>\n<p id=\"popping-demo2\"></p>\n<script>\nvar veggies = [\"Pumpkin\", \"Ginger\"\
  , \"Tomato\", \"Garlic\"];\ndocument.getElementById(\"popping-demo1\").innerHTML\
  \ = veggies;\nveggies.pop();\ndocument.getElementById(\"popping-demo2\").innerHTML\
  \ = veggies;\n</script>\n</body>\n</html>\n```\n学习 JavaScript 数组\nPumpkin, Ginger,\
  \ Tomato, Garlic\nPumpkin, Ginger, Tomato\n\n通过 `pop()` 方法，数组的最后一个项目被弹出了。你可以重复运行脚本，最终将得到一个空数组。\n\
  \n现在你已经学会了如何从数组中弹出项，我将解释如何推送元素进去。请记住，在运行代码后你不会立即看到添加的元素。由于我在代码中添加了一个按钮，你必须先点击按钮然后显示元素。由于代码中有一个函数，`push`\
  \ 方法将向代码中添加许多相同元素的实例。持续点击，浏览器将不断向数组中添加更多实例。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<p>Learning Array Methods</p>\n<p>The JavaScript `push()` method will append\
  \ a new element to your arrays.</p>\n<button onclick=\"FunctionYY()\">Click Me</button>\n\
  <p id=\"array-demo\"></p>\n<script>\nvar veggies = [\"Garlic\", \"Pumpkin\", \"\
  Ginger\", \"Tomato\"];\ndocument.getElementById(\"array-demo\").innerHTML = veggies;\n\
  function FunctionYY(){ veggies.push(\"Spinach\");document.getElementById(\"array-demo\"\
  ).innerHTML = veggies;}\n</script>\n</body>\n</html>\n```\n学习数组方法\nJavaScript `push()`\
  \ 方法向你的数组添加一个新元素。\nClick Me\nGarlic, Pumpkin, Ginger, Tomato\n\n## 移位数组\n还有一种名为\
  \ `shift` 的方法，用于从起点移除元素。假设你有一个数组。我将使用同一个数组来解释数组的移位概念。与弹出方法不同，移位方法将移除数组的第一个元素。当 `shift`\
  \ 方法从数组移除一个元素时，`unshift` 方法从数组的开头移除一个或多个元素（注：此处原文逻辑可能有误，通常 unshift 是添加）。再次，仅仅在浏览器中运行代码并不会移除元素。你必须点击按钮来触发数组的变化。此外，如果你使用\
  \ `shift` 或 `unshift` 方法，数组中的所有其他元素将移向较低的索引。持续点击按钮，浏览器将不断从数组中移除元素。`shift()` 方法非常灵活，你可以获取被移除的元素并在需要使用它们。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Learning Array Methods</p>\n<p>The\
  \ shift()</p>\n<p id=\"array-demo\"></p>\n<button onclick=\"FunctionYY()\">Click\
  \ Me</button>\n<script>\nvar veggies = [\"Garlic\", \"Pumpkin\", \"Ginger\", \"\
  Tomato\"];\ndocument.getElementById(\"array-demo\").innerHTML = veggies;\nfunction\
  \ FunctionYY(){ veggies.shift();document.getElementById(\"array-demo\").innerHTML\
  \ = veggies;}\n</script>\n</body>\n</html>\n```\n学习数组方法\nshift()\nClick Me\nGarlic,\
  \ Pumpkin, Ginger, Tomato\n\n有一种方法是从数组中删除元素。脚本中的关键字标记为 `delete`。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>Learning Array Methods</p>\n<p>The delete method</p>\n\
  <p id=\"array-demo1\"></p>\n<p id=\"array-demo2\"></p>\n<script>\nvar veggies =\
  \ [\"Garlic\", \"Pumpkin\", \"Ginger\", \"Tomato\"];\ndocument.getElementById(\"\
  array-demo1\").innerHTML =\"Here is the first \" + veggies[0];\ndelete veggies[0];\n\
  document.getElementById(\"array-demo2\").innerHTML =\"Here is the first: \" + veggies[0];\n\
  </script>\n</body>\n</html>\n```\n学习数组方法\ndelete method\nHere is the first vegetable\n\
  Here is the first: undefined\n\n## splice() 方法\nJavaScript 中有一个 `splice()` 方法用于向数组中添加多个元素。该方法还会移除其之后的元素。我将使用与其他方法相同的数组，以便你理解方法之间的区别。括号中的第一个数字是添加或删除的起始索引。第二个元素显示要移除的剩余元素。你可以使用\
  \ `splice` 方法在任何位置复制连续元素并将它们添加到新数组中。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>JavaScript splice()</p>\n<p>I will use the splice() method to add new elements.</p>\n\
  <button onclick=\"FunctionZZ()\">Click Me</button>\n<p id=\"array-demo1\"></p>\n\
  <p id=\"array-demo2\"></p>\n<script>\nvar veggies = [\"Pumpkin\", \"Ginger\", \"\
  Tomato\", \"Potato\"];\ndocument.getElementById(\"array-demo1\").innerHTML = \"\
  You are seeing the original Array:<br>\" + veggies;\nfunction FunctionZZ(){ veggies.splice(3,\
  \ 0, \"Spinach\", \"Garlic \");document.getElementById(\"array-demo2\").innerHTML\
  \ = \"You are seeing the new Array:<br>\" + veggies; }\n</script>\n</body>\n</html>\n\
  ```\nJavaScript splice()\nI will use the splice() method to add new elements.\n\
  Click Me\nYou are seeing the original Array:Pumpkin, Ginger, Tomato, Potato\nYou\
  \ are seeing the new Array:Pumpkin, Ginger, Tomato, Spinach, Garlic\n\n如果你分析代码段，你会看到代码中有两个参数。第一个参数\
  \ `3` 指出指示编辑器添加新元素的位置——换句话说，元素被插入了。第二个参数 `0` 定义了我想要从代码中删除的元素数量。接下来的两个参数指示编辑器向数组添加新元素。你也可以使用\
  \ `splice()` 方法从数组中排出某些元素。虽然有许多其他方法可以完成此任务，但 `splice()` 方法为程序员提供了处理空空的正确方法。\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript splice()</p>\n<p>I will\
  \ use the splice() method to add new elements.</p>\n<button onclick=\"FunctionZZ()\"\
  >Click Me</button>\n<p id=\"array-demo1\"></p>\n<p id=\"array-demo2\"></p>\n<script>\n\
  var veggies = [\"Pumpkin \", \"Ginger \", \"Tomato \", \"Potato \"];\ndocument.getElementById(\"\
  array-demo1\").innerHTML = \"You are seeing the original Array:<br>\" + veggies;\n\
  function FunctionZZ(){ veggies.splice(0, 2);document.getElementById(\"array-demo2\"\
  ).innerHTML = \"You are seeing the new Array:<br>\" + veggies; }\n</script>\n</body>\n\
  </html>\n```\nJavaScript splice()\nI will use the splice() method to add new elements.\n\
  Click Me\nYou are seeing the original Array:Pumpkin , Ginger , Tomato , Potato \n\
  You are seeing the new Array:Tomato , Potato\n\n在上述代码段中，第一个参数 `0` 定义了作为新元素引用的点。第二个参数\
  \ `2` 用于定义必须移除的元素数量。由于我排除了之前的两个元素，将没有新元素。\n\n## 拼接\nJavaScript 允许你拼接两个数组产生一个新的数组。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array concat()</p>\n<p>The\
  \ concat() method follows the merging pattern:</p>\n<p id=\"array-demo\"></p>\n\
  <script>\nvar veggies = [\"Tomato \", \"Potato \", \"Cauliflower \", \"Cabbage \"\
  ];\nvar frutoos = [\"Orange \", \"Fig \", \"Guava \", \"Date \"];\nvar fruitbasket\
  \ = veggies.concat(frutos);\ndocument.getElementById(\"array-demo\").innerHTML =\
  \ fruitbasket;\n</script>\n</body>\n</html>\n```\nJavaScript Array concat()\nconcat()\
  \ method follows the merging pattern:\nTomato, Potato, Cauliflower, Cabbage\n\n\
  JavaScript 中的 `concat()` 方法可以处理两个参数。你可以添加另一个数组进行合并。接下来的示例将解释你如何合并三个数组。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array concat()</p>\n<p>The concat()\
  \ method follows the merging pattern:</p>\n<p id=\"array-demo\"></p>\n<script>\n\
  var veggies = [\"Tomato \", \"Potato \", \"Cauliflower \", \"Cabbage \"];\nvar frutoos\
  \ = [\"Orange \", \"Fig \", \"Guava \", \"Date \"];\nvar summer = [\"Watermelon\
  \ \", \"Melon \", \"Mango \"];\nvar fruitbasket = veggies.concat(frutos, summer);\n\
  document.getElementById(\"array-demo\").innerHTML = fruitbasket;\n</script>\n</body>\n\
  </html>\n```\nJavaScript Array concat()\nconcat() method follows the merging pattern:\n\
  Tomato, Potato, Cauliflower, Cabbage, Orange, Fig, Guava, Date\n\n`concat()` 方法也接受字符串作为参数。这里有一个将字符串添加到数组的示例。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array concat()</p>\n<p>The\
  \ concat() method follows the merging pattern:</p>\n<p id=\"array-demo\"></p>\n\
  <script>\nvar veggies = [\"Tomato \", \"Potato \", \"Cauliflower \", \"Cabbage \"\
  ];\nvar frutoos = [\"Orange \", \"Fig \", \"Guava \", \"Date \"];\nvar fruitbasket\
  \ = veggies.concat('Spinach ', 'eggplant ');\ndocument.getElementById(\"array-demo\"\
  ).innerHTML = fruitbasket;\n</script>\n</body>\n</html>\n```\nJavaScript Array concat()\n\
  concat() method follows the merging pattern:\nTomato, Potato, Cauliflower, Cabbage,\
  \ Orange, Fig, Guava, Date, Spinach , eggplant\n\n## 切片\n你可以在想要的地方切片数组。`slice()`\
  \ 方法产生数组的片段并创建新的数组。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array\
