  \  <p>这是 JavaScript 未声明的类型。</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n  \
  \  var a = \"Charles Dickens\" + \" wrote \" + \" melodramatic novels!\";\n    document.getElementById(\"\
  variable-demo\").innerHTML = a;\n  </script>\n</body>\n</html>\n```\nJavaScript\
  \ 字符串拼接\n这是 JavaScript 未声明的类型（此处原文可能有误）\nCharles Dickens wrote melodramatic novels!\n\
  \n# let 关键字 (Let Keyword)\n\n在 JavaScript 中，`let` 关键字用于变量声明。`var` 关键字也可以用于变量声明；但关键区别在于它们的作用域。`var`\
  \ 关键字基于函数作用域，而 `let` 关键字基于块作用域。学习使用 `let` 关键字涉及到 `var` 关键字与它之间的区别。\n\n## 全局作用域 (Global\
  \ Scope)\n\n在函数外部声明的变量。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>JavaScript\
  \ let 关键字</p>\n  <p>你可以从任何脚本或函数访问全局变量。</p>\n  <p id=\"let-demo\"></p>\n  <script>\n\
  \    var cars = \"BMW\";\n    function Function1() {\n      document.getElementById(\"\
  let-demo\").innerHTML = \"I plan to buy \" + cars + \" for my commute.\";\n    }\n\
  \  </script>\n</body>\n</html>\n```\nJavaScript let 关键字\n你可以从任何脚本或函数访问全局变量。\nI plan\
  \ to buy a daily.\n\n你可以从 JavaScript 程序内部的任何点访问全局变量。在函数限制的变量。全局作用域。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n  <p>这些是 JavaScript 作用域</p>\n  <p>我在 Function2()\
  \ 外部定义并声明了一个变量。</p>\n  <p id=\"let-demo1\"></p>\n  <p id=\"let-demo2\"></p>\n  <script>\n\
  \    function Function2() {\n      var cars = \"BMW\";\n      document.getElementById(\"\
  let-demo1\").innerHTML = typeof cars + \" \" + cars;\n    }\n    document.getElementById(\"\
  let-demo2\").innerHTML = typeof cars;\n  </script>\n</body>\n</html>\n```\n这些是 JavaScript\
  \ 作用域\n在 Function2() 外部定义并声明了一个变量。\n\n## 块作用域 (Block Scope)\n\n使用 `var` 关键字声明的变量具有块作用域。只有在大括号内声明的变量可以从外部访问。块作用域是在\
  \ ES2015 中引入 JavaScript 的。使用 `var` 关键字的变量没有块作用域，而使用 `let` 关键字的变量具有块作用域。`var` 关键字在某些情况下给程序员带来问题。特别是当你尝试包含\
  \ `var` 关键字重新声明变量时，你会看到编辑器中出现问题。如果你在块中重新声明变量，你会在同一个块之外重新声明它。从长期来看这会导致额外的问题。\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>这段代码片段将使用 var 关键字声明你的变量</p>\n  <p\
  \ id=\"let-demo\"></p>\n  <script>\n    var xyz = 10000; // 你可以看到 xyz 的值为 10000\n\
  \    { var xyz = 1; // 现在重新声明的 xyz 变量值为 1\n    document.getElementById(\"let-demo\"\
  ).innerHTML = xyz;\n  </script>\n</body>\n</html>\n```\n这段代码片段将使用 var 关键字声明你的变量\n\
  所以，你可以看到我们遇到了一个大问题。使用 `var` 关键字，重新声明可能很棘手。这就是 `let` 关键字派上用场。它解决了重复声明的问题。如果你使用 `let`\
  \ 关键字声明变量，那么当你重新声明同一个变量时就不会有任何问题。在下面的代码中，我将解释 `let` 关键字如何解决重复声明的问题。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n  <p>我现在将使用 let 关键字重新声明一个变量</p>\n  <p id=\"let-demo\"\
  ></p>\n  <script>\n    var xyz = 1000; // xyz 变量的值为 1000\n    { let xyz = 1; //\
  \ 现在 xyz 的值设置为 1\n    // let 关键字会让变量 xyz 保留之前声明的值\n    document.getElementById(\"\
  let-demo\").innerHTML = xyz;\n  </script>\n</body>\n</html>\n```\n我现在将使用 let 关键字重新声明一个变量\n\
  1000\n由于 `let` 关键字引入得较晚，Internet Explorer 11 之前的版本不支持它。目前，Chrome 49、Firefox 44、Opera\
  \ 36、Edge 12 和 Safari 11 支持 `let` 关键字的使用。`var` 和 `let` 关键字在用于 JavaScript 循环时行为不同。查看以下两个示例以理解这两个关键字之间的区别。\n\
  \n### 示例 1\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>JavaScript let 关键字</p>\n\
  \  <p id=\"let-demo\"></p>\n  <script>\n    var xyz = 4;\n    for (var xyz = 0;\
  \ xyz < 9; xyz++) {}\n    document.getElementById(\"let-demo\").innerHTML = xyz;\n\
  \  </script>\n</body>\n</html>\n```\nJavaScript let 关键字\n9\n\n### 示例 2：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n  <p>JavaScript let 关键字</p>\n  <p id=\"let-demo\"\
  ></p>\n  <script>\n    let xyz = 4;\n    for (let xyz = 0; xyz < 9; xyz++) {}\n\
  \    document.getElementById(\"let-demo\").innerHTML = xyz;\n  </script>\n</body>\n\
  </html>\n```\nJavaScript let 关键字\n4\n在第一个示例中，当我使用 `var` 关键字时，循环内部声明的变量重新声明了循环外部的\
  \ `xyz` 变量。然而，当我在示例 2 中使用 `let` 关键字时，循环内部声明的变量并没有重新声明外部的那个。\n\n\n\n\n- `var` 关键字主要用于旧版本的\
  \ JavaScript，而 `let` 关键字被认为是声明变量的最新方法。你可能会说 `letlet` 关键字始于 ES6，它也被称为 ES2015。\n-\
  \ `var` 关键字基本上是函数作用域的，而 `let` 关键字是块级作用域的。\n\n\n\n如果我们讨论这两个关键词中推荐哪一个，我们可以说在编写程序时，`let`\
  \ 关键字是最佳的考虑选项。然而，某些浏览器不支持 `let` 关键字。因此，你可能会觉得需要使用 `var` 关键字。\n\n# 第三章：JavaScript\
  \ 常量\n\nJavaScript 中的 `const` 关键字是在 `ES2015` 中引入的。使用 `const` 关键字定义的变量与使用 `let` 关键字定义的变量一样工作。唯一的区别在于你不能对它们进行重新赋值。一旦你初始化了一个常量，之后就无法更改它的值。这就是常量不同于\
  \ `var` 关键字之处。如果你必须声明一个常量，你需要先对其进行初始化。\n\n你应该仔细考虑一下在程序中是否真的需要使用常量。只有当你确定不会更改变量的值时，才应该使用它。常量的名称可以是一个法的标识符。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>你正在学习 JavaScript 常量</p>\n<p>记住，你不能改变原始值。</p>\n\
  <p id=\"const-demo\"></p>\n<script>\ntry {\n  const xyz = 89.141592653589793;\n\
  \  xyz = 54.14;\n} catch (err) {\n  document.getElementById(\"const-demo\").innerHTML\
  \ = err;\n}\n</script>\n</body>\n</html>\n```\n\n你正在学习 JavaScript 常量\n记住，你不能改变原始值。\n\
  TypeError: Assignment to constant variable.\n\n## 块作用域\n\n当使用块作用域时，使用 `const` 关键字声明变量与使用\
  \ `let` 关键字声明非常相似。接下来的示例将解释它如何倾向于 `let` 关键字并疏远 `var` 关键字。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<p>在这个示例中，我将通过使用 const 关键字声明一个变量</p>\n<p id=\"const-demo\"\
  ></p>\n<script>\nvar xyz = 15; // xyz 的值为 15\n{\n  const xyz = 1; // xyz 的值为 1\n\
  }\n// xyz 的值为 15\ndocument.getElementById(\"const-demo\").innerHTML = xyz;\n</script>\n\
  </body>\n</html>\n```\n\n在这个示例中，我将通过使用 const 关键字声明一个变量\n15\n\n与使用 `var` 关键字声明的变量不同，常量在声明时必须赋值。你不能让值部分为空。“constant”（常量）这个词有点让人困惑，如果不是完全误导的话。`const`\
  \ 关键字并不定义的是常量值。实际上，它定义的是你在等式中使用的值的常量引用。这就是为什么你不能改变常量的原始值。但是，你可以更改属性。\n\n### 原始值\n\
  \n如果你给常量赋了一个原始值，那么以后你将无法更改该值。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>这些都是\
  \ JavaScript 常量</p>\n<p>让我们尝试是否可以改变原始值。</p>\n<p id=\"const-demo\"></p>\n<script>\n\
  try {\n  const xyz = 5556.175757557757793;\n  xyz = 3555.19090;\n} catch (err) {\n\
  \  document.getElementById(\"const-demo\").innerHTML = err;\n}\n</script>\n</body>\n\
  </html>\n```\n\n这些都是 JavaScript 常量\n让我们尝试是否可以改变原始值。\nTypeError: Assignment to constant\
  \ variable.\n\n虽然你不能改变 JavaScript 常量中的原始值，但你可以更改对象的属性。在接下来的示例中，我将使用 `const` 关键字创建一个对象，然后对该对象的属性引入一些更改，看看我是否可以更改它们。查看示例以了解如何操作的。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript 常量</p>\n<p>在声明对象后你可以更改对象的属性：</p>\n\
  <p id=\"const-demo\"></p>\n<script>\n// 我将创建一个对象：\nconst mycar = {name:\"Honda\"\
  , model:\"Vezel\", make:\"Japan\", color:\"Grey\"};\n// 让我们更改属性：\nmycar.model =\
  \ \"Civic\";\n// 你也可以添加一个新属性：\nmycar.transmission = \"Automatic\";\n// 是时候显示你的属性了：\n\
  document.getElementById(\"const-demo\").innerHTML = \"I have a \" + mycar.name +\
  \ \".\" + \" It is of \" + mycar.color + \" color and its model label is \" + mycar.model\
  \ + \". \" + \"This car has \" + mycar.transmission + \".\";\n</script>\n</body>\n\
  </html>\n```\n\nJavaScript 常量\n在声明对象后你可以更改对象的属性：\n我有一辆本田。它是灰色的，它的型号标签是 Civic。这辆车是自动的。\n\
  \n你看到我将型号从 Vezel 改为了 Civic。我还添加了新属性来描述汽车的变速模式。这方便了程序员，因为他们可以创建一个对象，然后根据不断需要添加或更改属性。然而，你不能在程序中将不同的对象重新赋值给同一个常量。如果你这样做，就会报错。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 常量</p>\n<p>禁止：不能将不同的对象重新赋值给同一个常量：</p>\n\
  <p id=\"const-demo\"></p>\n<script>\ntry {\n  const mycar = {name:\"Honda\", model:\"\
  Vezel\", make:\"Japan\", color:\"black\"};\n  mycar = {name:\"BMW\", model:\"Z1\"\
  , make:\"German\", color:\"red\"};\n} catch (err) {\n  document.getElementById(\"\
  demo\").innerHTML = err;\n}\n</script>\n</body>\n</html>\n```\n\n学习 JavaScript 常量\n\
  禁止：不能将不同的对象重新赋值给同一个常量：\n\n### 常量数组\n\n你可以使用 `const` 关键字创建数组，也可以更改它们。\n\n# 第四章：提示与条件判断\n\
  \n提示框（prompt）用于请求用户提供信息并给出响应。代码向用户提出一些问题并在相应的字段中提供答案。你可以更改响应。无论你是保持默认响应原样还是更改它，你的响应都会赋值给变量。\n\
  \n## JavaScript if 语句\n\n在本节中，我将解释如何处理不同类型的条件。假设你有一个提示框询问美国总统目前住在哪里。这里是用户看到的行：“你住在哪里？”如果用户回答正确，你可以显示一个警告框来祝贺他。如果他输入了其他内容，程序将不返回任何结果。\n\
  \n\n\n\n- `if` 关键字用于指定当条件为真时编辑器必须执行的代码。\n- `else` 关键字用于指定当相同条件为假时编辑器必须执行的代码。\n-\
  \ `else-if` 关键字用于在第一个条件为假时，放置一个新条件进行测试。\n\n\n\n`if` 语句是区分大小写的，因此关键字 `if` 和 `IF`\
  \ 是两个不同的单词。如果你将 `if` 替换为 `IF`，你将在屏幕上看到一个错误。\n\n```html\n<!DOCTYPE html>\n<html><body>\n\
  <p>如果时间少于 15:00，我将显示 \"Have a Great Day!\"：</p>\n<p id=\"if-demo\">Have a Savory\
  \ Evening!</p>\n<script>if (new Date().getHours() < 15) {document.getElementById(\"\
  if-demo\").innerHTML = \"Have a Great Day!\";}</script>\n</body>\n</html>\n```\n\
  如果时间少于 15:00，我将显示 \"Have a Great Day!\"：Have Have a Great Day!\n\n## else 语句\n你可以使用\
  \ `else` 语句来指定当条件为假时需要执行的代码。我将使用相同的代码并添加 `else` 语句，看看我们如何使用 `else` 语句来扩展我们的代码，使其更具交互性和用户友好性。现在用户将有两个选项，而不是死板的单一选项代码。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p>我希望你点击下方的按钮根据当前时间显示问候语：</p>\n<button\
  \ onclick=\"FunctionX()\">点击我以显示问候语</button>\n<p id=\"ifelse-demo\"></p>\n<script>\n\
  function FunctionX() {var myhours = new Date().getHours();var mygreetings;if (myhours\
  \ < 15) {mygreetings = \"Have a Great Day\";} else {mygreetings = \"Have a Great\
  \ Evening. I hope you enjoy your dinner.\";}document.getElementById(\"ifelse-demo\"\
  ).innerHTML = mygreetings;}</script>\n</body>\n</html>\n```\n我希望你点击下方的按钮根据当前时间显示问候语：点击我以显示问候语\
  \ Have a Great Day\n\n你可以看到 `else` 语句完美地整合到了现有代码中。我冒昧地在代码中添加了一个交互式按钮，以便用户可以确切地知道需要做什么。当用户点击按钮时，他将收到一条问候他的消息。该消息将根据程序在你本地读取的时间进行结构化。这就是你如何在你的页面上构建一个交互式网页应用并吸引访问者的方法。此外，你的访问者也会喜欢他们被欢迎的方式。\n\
  \n## else if 语句\n你可以向代码中添加 `else-if` 语句，在第一个条件返回假时指定新条件。在接下来的示例中，我将添加两个以上的条件，看看它们是如何工作的，以及它们为我们的代码带来了多少改进。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p>我希望你点击下方的按钮根据当前时间显示问候语：</p>\n<button\
  \ onclick=\"FunctionX()\">点击我以显示问候语</button>\n<p id=\"ifelse-demo\"></p>\n<script>\n\
  function FunctionX() {var mygreetings ;var mytime = new Date().getHours();if (mytime\
  \ < 8) {mygreetings = \"Have a Good Morning. I hope you have had a nutritious breakfast.\
  \ Get ready for work\";} else if (mytime < 15) {mygreetings = \"Have a Great Day.\
  \ Don't forget to eat your lunch.\";} else {mygreetings = \"Have a Great Evening.\
  \ Any special plans for dinner?\";}document.getElementById(\"ifelse-demo\").innerHTML\
  \ = mygreetings;}</script>\n</body>\n</html>\n```\n我希望你点击下方的按钮根据当前时间显示问候语：点击我以显示问候语\
  \ Have a Great Day. Don't forget to eat your lunch.\n\n这工作得非常完美。现在你的程序将在一天中的三个时间段显示问候消息。你可以根据业务需求定制消息，并使其更具交互性。有些编码员习惯于去掉大括号来编写\
  \ `if` 语句。这种做法是完全合法的；但执行起来有点困难。有些程序员会将初始大括号放在新的一行。另一种做法是将整个 `if` 语句写在一行上，这更容易实现，但当你回来研究程序结构时，会很难阅读。我建议你遵循与我在上面示例中使用的相同规则，这样你会发现编写和理解它也更容易。在大多数情况下，你可以用双等号\
  \ `==` 代替三等号。然而，你可能会发现一点微小的技术差异。\n\n编写 `if` 语句以及 `if` 语句的变体有许多格式。使用 `if` 语句进行编码的可能性是无限的。\n\
  \n## JavaScript switch 语句\n你可以使用 `switch` 语句对 JavaScript 条件执行不同的操作。它将帮助你在单个代码块上工作并执行它。编辑器对其进行一次评估，在值之间进行比较，并在匹配时执行该代码块。如果不匹配，则不会执行。接下来的程序将运行程序中的\
  \ `switch` 语句，并检查你的电脑以查看电脑日历上是哪一天，以及代码中同一天包含什么消息。它将运行一周中的所有七天，当它达到匹配项时，它将运行你已经关联到同一天的消息。看下面的代码。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p id=\"switch-demo\"></p>\n<script>\n\
  var weekdays;\nswitch (new Date().getDay()) {\ncase 0:weekdays = \"the restful Sunday\"\
  ;\ncase 1:weekdays = \"the blue Monday\";\ncase 2:weekdays = \"the superstitious\
  \ Tuesday\";\ncase 3:weekdays = \"the hectic Wednesday\";\ncase 4:weekdays = \"\
  the overwhelming Thursday\";\ncase 5:weekdays = \"the joyful Friday\";\ncase 6:weekdays\
  \ = \"the sleepy Saturday\";}document.getElementById(\"switch-demo\").innerHTML\
  \ = \"Today is \" + weekdays + \".\" + Have a great day!\";</script>\n</body>\n\
  </html>\n```\nToday is superstitious Tuesday. Have a great day!\n\n在上面的代码中，你可能注意到了\
  \ `break` 关键字的。当代码遇到 `break` 关键字时，它会跳出 switch 块。跳出 switch 块会在 switch 块的执行上设置停止。如果你从\
  \ switch 块中排除 `break` 关键字，网络浏览器将执行下一个 case，即使值不匹配。因此，如果跳过 `break` 关键字，要准备错误。你可以将\
  \ `break` 关键字加到 switch 语句中。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\n\
  var weekdays;\nswitch (new Date().getDay()) {\ncase 0:weekdays = \"the restful Sunday\"\
  ;\ncase 1:weekdays = \"the blue Monday\";\ncase 2:weekdays = \"the superstitious\
  \ Tuesday\";\ncase 3:weekdays = \"the hectic Wednesday\";\ncase 4:weekdays = \"\
  the overwhelming Thursday\";\ncase 5:weekdays = \"the joyful Friday\";\ncase 6:weekdays\
  \ = \"the sleepy Saturday\";\ndefault:weekdays = \"I am desperately waiting for\
  \ the weekend because I have planned vacation.\";}document.getElementById(\"switch-demo\"\
  ).innerHTML = weekdays;</script>\n</body>\n</html>\n```\nI am desperately waiting\
  \ for the weekend because I have planned vacation. 你可能认为 `default` 只能放在代码的最后。然而事实并非如此。你可以将其插入代码的任何地方，即使在开头。它将正常工作。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar weekdays;\nswitch (new Date().getDay())\
  \ {\ncase 0:weekdays = \"the restful Sunday\";\ncase 1:weekdays = \"the blue Monday\"\
  ;\ncase 2:weekdays = \"the superstitious Tuesday\";\ncase 3:weekdays = \"the hectic\
  \ Wednesday\";\ncase 4:weekdays = \"the overwhelming Thursday\";\ncase 5:weekdays\
  \ = \"the joyful Friday\";\ncase 6:weekdays = \"the sleepy Saturday\";\ndefault:weekdays\
  \ = \"I am desperately waiting for the weekend because I have planned vacation.\"\
  ;}document.getElementById(\"switch-demo\").innerHTML = weekdays;</script>\n</body>\n\
  </html>\n```\nI am desperately waiting for the weekend because I have planned vacation.\n\
  \n# 第五章：JavaScript 字符串和数组\n我已经解释了什么是字符串以及你如何在脚本中使用它们。当你处理字符串时，可以使用一些方法。某些原始值没有方法或属性，因为它们不是对象。然而，JavaScript\
  \ 在执行属性和方法时会将原始值视为对象。你可以学习程序中使用的字符串的 `length`。\n\n```html\n<!DOCTYPE html>\n<html><body>\n\
  <p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于字符串长度的问题：</p>\n<p id=\"string-demo\"\
  ></p>\n<script>var msgX = \"I am about to leave for New York to start my own business.\"\
  ;var msgY = msgX.length;document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n\
  </body>\n</html>\n```\n这个字符串属性将回答关于字符串长度的问题。\n\n另一个 JavaScript 方法可以帮助你在字符串内部查找字符串。我在这里使用的方法叫做\
  \ `indexOf()`。如果你在另一个字符串内部指定了一个字符串，它将为你找到它。需要需要的重要说明是，你可以使用单引号在字符串内部创建另一个字符串。接下来的示例将解释如何这样做。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于字符串内部字符串的问题：</p>\n\
  <p id=\"string-demo\"></p>\n<script>var msgX = \"I am about to leave for 'New York'\
  \ to start my own business.\";var msgY = msgX.indexOf(\"New York\");document.getElementById(\"\
  string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串长度的问题。你可以看到内部字符串的索引已经显示在屏幕上。请记住\
  \ JavaScript 从零点开始索引索引。\n\n### `lastIndexOf()` 方法\n你可以使用 `lastIndexOf()` 方法查看 `New\
  \ York` 最后一次出现的索引，它是我们指定的内部字符串。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<p>学习\
  \ JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于字符串内部字符串的问题：</p>\n<p id=\"string-demo\"></p>\n\
  <script>var msgX = \"I am about to leave for 'New York' to start my own business.\"\
  ;var msgY = msgX.lastIndexOf(\"New York\");document.getElementById(\"string-demo\"\
  ).innerHTML = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串内部字符串的问题。\n\n\
  ### 如果未找到索引？\n如果方法未找到索引，它们将返回 `-1`。这在你代码中编写错误的拼写或完全不同的单词时发生。\n\n```html\n<!DOCTYPE\
  \ html>\n<html><body>\n<p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于内部字符串的问题：</p>\n\
  <p id=\"string-demo\"></p>\n<script>var msgX = \"I am about to leave for 'New York'\
  \ to start my own business.\";var msgY = msgX.lastIndexOf(\"Washington\");document.getElementById(\"\
  string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串内部字符串的问题。\n\
  \n### `search()` 方法\n另一种方法是在长字符串中定位指定的内部字符串。如果匹配完美，你可以使用 `search()` 方法来查找。\n\n```html\n\
  <!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave for 'New\
  \ York' to start my own business.\";\nvar msgY = msgX.search(\"New York\");document.getElementById(\"\
  string-demo\").innerHTML = msgY;\n</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串内部字符串的问题。\n\
  \n### 提取\n你可以根据程序需要将字符串分成许多部分。JavaScript 给了我们三种方法来分解字符串。第一个方法标记为 `slice()` 方法。它提取字符串的一部分并以新字符串的形式显示。你需要两个参数；一个是字符串的起始位置，另一个是结束位置。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave\
  \ for 'New York' to start my own business.\";\nvar msgY = msgX.slice(23, 34);document.getElementById(\"\
  string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串的问题。请记住\
  \ JavaScript 从 `0` 点开始计数。如果一个参数是负数，你必须从字符串的结尾开始计数。它将反向切分字符串。你可以尝试它并获得结果。我现在跳过它，测试忘记结束位置会发生什么。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave\
  \ for 'New York' to start my own business.\";\nvar msgY = msgX.slice(23);document.getElementById(\"\
  string-demo\").innerHTML = msgY;</\n</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串的问题。你可以看到它显示了文本的结尾。如果起始点是负数且结束点缺失，你将看到结果从结尾到切分点。\n\
  \n### `substring()` 方法\n第二个切割字符串并创建子字符串的方法是 `substring()` 方法。它与 `slice` 方法一样。不同在于它不接受负索引。看下面的示例来理解它的用法。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave\
  \ for 'New York' to start my own business.\";\nvar msgY = msgX.substring(23, 34);document.getElementById(\"\
  string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串的问题。\n\
  \n第三个也是最后一个切割方法是 `substr()` 方法，它与 `slice()` 非常相似。第二个参数定义了切分字符串剩余部分的长度。\n\n```html\n\
  <!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave for 'New\
  \ York' to start my own business.\";\nvar msgY = msgX.substr(23, 34);document.getElementById(\"\
  string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串的问题。\n\
  \n### `replace()` 方法\n当 JavaScript 允许你替换字符串内部的值时，它变得有趣。例如，示例中包含的字符串包含了 New York\
  \ 作为我将访问的城市。JavaScript 允许你更改城市名称，而不是编写新代码并创建新字符串。这在你创建长程序时节省了大量时间。该方法可以识别为 `replace()`。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave\
  \ for 'New York' to start my own business.\";\nvar msgY = msgX.replace('New York',\
  \ 'Las Vegas');document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n\
  </body>\n</html>\n```\n我准备要去 'Las Vegas' 开始我的业务了。默认情况下，如果你写 `NEW YORK` 而不是 `New\
  \ York`，JavaScript `replace()` 将不起作用。它是区分大小写的，并且它识别不同的大小写。因此，如果发现方法不起作用，最好检查单词的大小写。此外，`replace()`\
  \ 方法只替换第一个匹配。如果字符串中有多个 New York，它将只替换第一个匹配并留下其余单词。如果你想忽略大小写，必须使用像 `/i` 这样的正则表达式让浏览器识别匹配项。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave\
  \ for 'New York' to start my own business.\";\nvar msgY = msgX.replace(/NEW YORK/i,\
  \ 'Las Vegas');document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n\
  </body>\n</html>\n```\n我准备要去 'Las Vegas' 开始我的业务了。如果你写 `NEW YORK` 而不是 `New York`，你可以看到\
  \ `replace()` 不起工作。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX\
  \ = \"I am about to leave for 'New York' to start my own business.\";\nvar msgY\
  \ = msgX.replace('NEW YORK', 'Las Vegas');document.getElementById(\"string-demo\"\
  ).innerHTML = msgY;</script>\n</body>\n</html>\n```\n我准备要去 'Las Vegas' 开始我的业务了。\n\
  \n## 拼接\n拼接是几乎所有编程语言的不可或的一部分。当需要连接两个或多个字符串时，程序员寻求拼接的支持。这是连接更多字符串的最简单方法。如果你代码写得好，`concat()`\
  \ 方法运行良好。最需要注意的是逗号和空格。`concat()` 方法是 `+` 运算符的替代方案——两者作为替代工作。接下来的练习将帮助你完成拼接过程。\n\n\
  ```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msg1 = \"I have been promoted\
  \ as Chief Executive Officer of Skyfall.\";\nvar msg2 = \"I will call a board meeting\
  \ next week!\";\nvar msg3 = msg1.concat(\" \", msg2);document.getElementById(\"\
  string-demo\").innerHTML = msg3;\n</>\n```\n我已经晋升为 Skyfall 的首席执行官。下周将召开董事会议！\n\n\
  ### 字符串数组\n字符串是神奇的，它们在你的编程活动中非常有帮助。像变量一样，JavaScript 数组也是值的容器。然而，它们与变量属性的区别在于，它们可以在一个名称中存储更多数据。因此，每需要在相同名称中加载数据时，你应该使用数组。设置数组有多种方法。最简单的是使用数组字面量方法，然后编写数组名称并在括号内给出值。等号必须跟在名称后面。你可以使用索引数访问数组项。如前所述，索引从数字\
  \ `0` 开始。在接下来的示例中，我将访问索引为零的元素。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\n\
  var carsforsale = new Array(\"Honda\", \"Toyota\", \"GTX\", \"Ford\");\ndocument.getElementById(\"\
  array-demo\").innerHTML = carsforsale[0];</script>\n</body>\n</html>\n```\nHonda,\
  \ Toyota, Ford.\n\n索引数是有用的，因为它们有助于更改数组元素的值。只需提及索引数就可以替换数组的所有元素。\n\n```html\n<!DOCTYPE\
  \ html>\n<html><body>\n<script>\nvar carsforsale = new Array(\"Honda\", \"Toyota\"\
  , \"GTX\", \"Ford\");\ncarsforsale[0] = \"BMW\";carsforsale[1] = \"Mitsubishi\"\
  ;document.getElementById(\"string-demo\").innerHTML = carsforsale;</script>\n</body>\n\
  </html>\n```\nHonda, Toyota, GTX, Ford.\n\n这与上一个示例的结果相同。另一种创建数组的方法。这被称为 JavaScript\
  \ 关键字 `new`。我将在下面的示例中使用 `new` 关键字来创建一个数组。\n\n```html\n<!DOCTYPE html>\n<html><body>\n\
  <script>\nvar carsforsale = new Array(\"Honda\", \"Toyota\", \"GTX\", \"Ford\");\n\
  document.getElementById(\"array-demo\").innerHTML = carsforsale;</script>\n</body>\n\
  </html>\n```\nHonda, Toyota, GTX, Ford.\n\n我准备要去 'Las Vegas' 开始我的业务了。如果有多个单词需要替换，你需要再次使用正则表达式。这次正则表达式被标记为\
  \ `/g`，让浏览器识别匹配项。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX\
  \ = \"The NBA team will visit Las Vegas.\";\nvar msgY = msgX.replace(/Las Vegas/g,\
  \ 'Los Angeles');document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n\
  </body>\n</html>\n```\nNBA 队将访问洛杉矶。\n\n### 字符串数组\n标题可能看起来有些困惑。没有所谓的字符串数组。然而，有一种新方法可以将字符串转换为数组。\n\
  \n```html\n<!DOCTYPE html>\n<html><body>\n<p>请点击“这里”以产生第一个数组元素：</p>\n<button onclick=\"\
  FunctionX()\">点击此按钮</button>\n<p id=\"string-demo\"></p>\n<script>\nfunction FunctionX()\
  \ {var msg1 = \"Texas, Las Vegas, Los Angeles.\";var msg2 = msg1.split(\",\");document.getElementById(\"\
  string-demo\").innerHTML = msg2[0];}</script>\n</body>\n</html>\n```\nTexas\n[/content]\
