  \n### for/of 循环\nJavaScript 中还有另一种类型的 for 循环，称为 `for/of` 语句。该语句遍历可以迭代的特定对象的值。该语句允许你创建通过\
  \ `Maps`、`Arrays`、`NodeLists` 和 `Strings` 等各种数据结构进行循环。\n\n当迭代开始时，下一个属性的值会自动赋值给变量。JavaScript\
  \ 中的变量使用 `var`、`const` 和 `let` 关键字声明。我们已经在之前的章节中涵盖了所有主题。目前 Safari 7、Chrome 38、Opera\
  \ 25、Edge 12 和 Firefox 51 是唯一支持 `for/of` 语句的浏览器。Internet Explorer 不支持它。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p>这些是 JavaScript For/Of 循环</p>\n<p>for/of 语句将创建一个遍历你可以迭代的对象的所有值的循环。</p>\n\
  <p id=\"demo6\"></p>\n<script>\nlet carsforsale = [\"Volkswagen\", \"Vezel\", \"\
  Ford\", \"Fortuner\", \"Sportage\"];\nlet msg = \"\";\nfor (let YY of carsforsale)\
  \ {\nmsg += YY + \"<br>\";\n}\ndocument.getElementById(\"demo6\").innerHTML = msg;\n\
  </script>\n</body>\n</html>\n```\n\n这些是 JavaScript For/Of 循环\nfor/of 语句将创建一个遍历你可以迭代的对象的所有值的循环。\n\
  Volkswagen, Vezel, Ford, Fortuner, Sportage\n\n在下一个示例中，我将使用字符串代替数组来获得相同的结果。\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>这些是 JavaScript For/Of 循环</p>\n<p>for/of\
