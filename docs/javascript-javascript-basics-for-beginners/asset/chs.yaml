  \n## 介绍\n本书包含了如何使用 JavaScript 编写代码的经过的步骤和策略。JavaScript 是一种脚本语言。你会在许多 HTML 标签中看到嵌入脚本。JavaScript\
  \ 不能独立工作，因此当你想要运行它时，它在网络浏览器中运行良好。你可以打开代码编辑器，复制代码并粘贴到 HTML 中，只需加载页面到浏览器即可直接看到结果。无论你是在制作网站，还是一个渴望成为\
  \ Web 开发者的学生，或者是计划为自己的业务建立网站，本书都是最好的学习方法。一旦你完成了前几章，你将做好心理准备，继续学习复杂的话题。\n\n## 第一章：JavaScript\
  \ 简介\nJavaScript 是一种解释型语言。该语言的定义比单词本身更宽泛。你可以将其定义为一种弱类型、基于原型、动态且命令式的过程化语言。JavaScript\
  \ 是作为网络浏览器部分的客户端编程语言的形式开发和实现的，被认为可以帮助开发者在网页上实现动态功能和创建用户界面。你可能在服务器端也能发现 JavaScript\
  \ 的实现。然而，JavaScript 语言的流行很大程度上取决于它在客户端的应用。\n\n### JavaScript 的开发者\nJavaScript 最初的设计模式与\
  \ C 语言相似，但它也有过一些名称。Brendan Eich 最初开发 JavaScript 时使用的名为 `Mocha`。后来名字被改为 `LiveScript`。随后，它再次被改为\
  \ `JavaScript`。这让一些人困惑，并给人一种新语言（即 JavaScript）是 Java 的分支的印象。\n\n### JavaScript 的用途\n\
  JavaScript 工作在世界上大多数网页的客户端。当你打开一个网页，如果它与你上次打开时有所不同，那么这些变化可能是使用 JavaScript 完成的。让我告诉你一些趣事：在屏幕上打开一个网页。在网页上点击右键，然后点击“查看源代码”。会在页面代码中看到\
  \ JavaScript 这个词。不要将 HTML 和 JavaScript 混淆，因为你可能会在页面代码中发现两者。\n\nHTML 是一种标记语言，允许开发者格式化内容并创建动态网页。你可以将文本变为加粗、创建框并根据你的选择在页面添加按钮。然而，JavaScript\
  \ 允许你修改文本、添加弹出框并验证通过 HTML 输入的文本。HTML 和 JavaScript 并行运行。JavaScript 的进步让页面变得动态且具有交互性。它允许用户点击某些元素并打开新页面。你应该学习\
  \ JavaScript，因为它非常容易实现。你只需要将代码放在 HTML 文档中让浏览器运行它。JavaScript 在许多计算机和操作系统上运行，即使是在离线状态。通过\
  \ JavaScript 的帮助，你可以创建响应式界面并提供极其动态的功能。JavaScript 允许用户在需要时加载内容，而无需将网页重新加载。这种过程被称为脚本。JavaScript\
  \ 将修复网页上出现的任何问题。当我们将与其他编程语言进行比较时，我们会发现它可以做很多。JavaScript 是高度受欢迎的，因为它允许你构建复杂的应用程序。你也可以使用\
  \ Flash 来构建复杂的应用程序，但它是 Web 的标准。\n\n### <script> 标签\n我们来谈谈书中最重要的标签符号。所有的 JavaScript\
  \ 代码都封装在 `<script>` 标签内。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript\
  \ rests</p>\n<p id=\"demo12\"></p>\n<script>\ndocument.getElementById(\"demo12\"\
  ).innerHTML = \"This is your JavaScript\";\n</script>\n</body>\n</html>\n```\n上面的代码显示了如何通过\
  \ `id=\"demo12\"` 将元素改为 \"This is your JavaScript\"。\n\n### Body 中的 JavaScript \n\
  这是你的第一个 JavaScript。旧版本的 JavaScript 写法不同。它的格式为 `<script type=\"text/javascript\"\
  >`。JavaScript 中有函数可以执行代码块。当某些事件发生时你可以调用函数。事件可以定义为点击。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<script>\nfunction FunctionUN() {\ndocument.getElementById(\"demo34\"\
  ).innerHTML = \"I have changed the Paragraph.\";\n}\n</script>\n</head>\n<body>\n\
  <p>This is a Paragraph.</p>\n<p id=\"demo34\"></p>\n<button onclick=\"FunctionUN()\"\
  >Click Me</button>\n</body>\n</html>\n```\n上面的代码显示了在点击按钮时调用 `FunctionUN()`。\n\n\
  ### Head 中的 JavaScript\n在网络浏览器中点击按钮将触发函数的调用。你也可以将脚本放在 HTML 页面的 `<body>` 中。以下代码将交付相同的结果。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\nfunction FunctionZ() {\ndocument.getElementById(\"\
  demo1\").innerHTML = \"I have changed the Paragraph.\";\n}\n</script>\n</head>\n\
  <body>\n<p>This is a Paragraph.</p>\n<p id=\"demo1\"></p>\n<button onclick=\"FunctionZ()\"\
  >Click Me</button>\n</body>\n</html>\n```\n上面的代码显示了在点击按钮时调用 `FunctionZ()`。\n\n###\
  \ 显示\n有不同的方法在网络浏览器中显示 JavaScript。书中使用的第一个方法是 `document.getElementById(id)` 方法。在短语中，`id`\
  \ 指定义 HTML 文档的元素。`innerHTML` 词定义了 HTML 内容。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<p>This is going to be my First Page</p>\n<p id=\"demo1234\"></p>\n<script>\n\
  document.getElementById(\"demo1234\").innerHTML = 4567 + 36;\n</script>\n</body>\n\
  </html>\n```\n上面的代码显示了如何使用 `document.getElementById(\"demo1234\").innerHTML` 显示\
  \ `4567 + 36`。你可以使用的第二个方法是 `document.write()` 方法。这也是一个简单的方法。然而，除了为了示例显示它是如何工作，我在书中没有使用这种方法创建任何脚本：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is going to be my First Page</p>\n\
  <p id=\"demo1234\"></p>\n<script>\ndocument.write(4567 + 36);\n</script>\n</body>\n\
  </html>\n```\n上面的代码显示了如何使用 `document.write(4567 + 36)`。如果你在加载 HTML 页面后使用这种方法，你将丢失所有数据，因为它们会被删除。因此，如果你犯了这个错误，应该注意后果。此外，你也可以这种方法创建一个按钮并测试\
  \ HTML 页面。看以下示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is going to\
  \ be my First Page</p>\n<p>This will be a Paragraph</p>\n<button onclick=\"document.write(335\
  \ + 6)\">Click me</button>\n</body>\n</html>\n```\n上面的代码显示了如何使用 `document.write(335\
  \ + 6)` 配合按钮。另一个方法是 `window.alert` 方法。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <p>This is going to be my First Page</p>\n<p id=\"demo1234\"></p>\n<script>\nwindow.alert(4567\
  \ + 36);\n</script>\n</body>\n</html>\n```\n上面的代码显示了如何使用 `window.alert(4567 + 36)`。每当你运行代码，你都会在屏幕顶部看到计算结果。`window`\
  \ 关键字的使用是可选的。JavaScript 中的 `window` 对象是全局的，你可以省略它并得到相同的结果。以下代码将交付相同的结果：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<p>This is going to be my First Page</p>\n<p id=\"\
  demo1234\"></p>\n<script>\nalert(4567 + 36);\n</script>\n</body>\n</html>\n```\n\
  另一个方法是 `console.log()` 方法。该方法用于调试代码并显示数据。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<p>This is going to be my First Page</p>\n<p id=\"demo1234\"></p>\n<script>\n\
  console.log(4567 + 36);\n</script>\n</body>\n</html>\n```\n\n### 值\n在计算机世界中，你只会看到一种数据。你可以通过读取数据、修改数据并创建新数据。所有这些数据以序列的形式存储。作为结果，它们表示为位。那么，值是什么？想象一下位。典型的计算机包含大约\
  \ 300 亿位。工作内存也被称为易失存储。非易失存储（属于硬盘）等于这些。JavaScript 的表示每个字符串元素使用 16 位。Unicode 定义了比这更多的字符。某些字符如\
  \ emoji 占用两个字符位置。\n\n### 数字\n数字的值是数值。在 JavaScript 中，你如下编写它：\n\n```javascript\nvar\
  \ x = 10;\n```\n上面的代码显示了如何声明数字变量。\n\n### 算术\n关键点是数字用于算术。它们被用于执行加法和乘法等操作。`+` 是加法的符号，而\
  \ `*` 是乘法的符号。这两个符号统称为运算符。当你编程时，在两个数字之间放置运算符，其顺序根据先例决定。例如，在正常情况下，乘法优先。\n\n```javascript\n\
  (500 + 100) * 500\n```\n上面的代码显示了操作顺序。\n\n### 字符串\n在深入 JavaScript 编程之前，你必须学习的另一个概念是字符串。JavaScript\
  \ 字符串表示文本。你可以通过在引号内包含文本来编写它们。看以下示例：\n\n```javascript\n'I am looking at the sun.'\n\
  \"I am going to take flight to Mars.\"\n`The weather is balmy, as April has started.`\n\
  ```\n你使用了单引号、双引号和反引号。将每个引号放在字符串的开头或结尾，以便代码编辑器将文本识别为字符串。你可以字面上在引号内放入任何内容，JavaScript\
  \ 将其转换为字符串。然而，少数语言字符很难转换。字符串中几乎不可能包含的是换行。当按下键盘上的回车键时会出现换行。当你使用反引号时，不需要转义就可以这样做。如果你想向字符串包含特殊字符，可以使用反斜杠\
  \ (\\)。反斜杠表示前面的字符带有特殊含义。这个过程被称为字符转义。如果反斜杠在引号之前，它不会结束字符串，而是包含在字符串中。如果你在反斜杠后面插入 `n`\
  \ 字符，它将被解释为换行。如果你在反斜杠后放 `t` 字符，它指的是制表符字符。看以下字符串的示例：\n\n```javascript\n\"I will reach\
  \ the moon\\n And I travel onwards to Mars.\"\n```\n你在网页上看到的将像下面：\nI will reach\
  \ the moon\nAnd I travel onwards to Mars\n\n你可能会遇到一种情况，在字符串内部需要一个反斜杠，仅仅作为一个反斜杠而不是任何特殊代码。如果两个反斜杠相邻，它们将确实合并。结果字符串值中只会下一个。你必须以位序列的形式对字符串建模，以便它们存在于计算机上。JavaScript\
  \ 的执行方式取决于 Unicode 标准。这些标准倾向于为每个字符分配一个特定的数字。\n\n\n\n\n\n*   我的职业是编码。\n*   我的所在地是美国德克萨斯州。\n\
  \n如果你阅读了这些内容，你已经在大脑中加入了这些信息：我是一个程序员，我住在美国德克萨斯州。在上述文本中，`coding` 和 `Texas, USA` 词短语的作用与\
  \ JavaScript 中的变量相同。`My Profession` 和 `My State` 等术语指的是特定的值。它们与 `Coding` 和 `Texas,\
  \ USA` 的关系，就像 JavaScript 中值与变量的关系一样。\n\n你可以通过编写 `var`（variable 的缩写）来创建一个变量。后面跟着你需要赋值给变量的名称。当你创建一个变量时，它会赋予一个特定的值。变量的名字可以是你喜欢的任何名称。听起来是什么样由你决定。变量的值可能会改变。变量的情况可能会改变。\n\
  \nJavaScript 变量可以简单地定义为以数据形式存储值的容器。在下面的示例中，我将使用三个变量：`a`、`b` 和 `c`，并为它们填充不同的值。\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>These are JavaScript Variables</p>\n\
  <p>In the following example, a, b, and c are JavaScript variables.</p>\n<p id=\"\
  variable-demo\"></p>\n<script>\nvar a = 50;\nvar b = 16;\nvar c = a + b;\ndocument.getElementById(\"\
  variable-demo\").innerHTML =\"The value of c is: \" + c;\n</script>\n</body>\n</html>\n\
  ```\n\n这些是 JavaScript 变量。在下面的示例中，`a`、`b` 和 `c` 是 JavaScript 变量。`c` 的值是：66\n\n由于这是第一个示例，你需要很好理解它。首先，该行区分了\
  \ JavaScript 的后端代码和前端。你可以说它区分了你在代码编辑器中编写的内容和你在网页上看到的内容。`h1` 和 `p` 标题在书中的显示可能与在网页上显示时不同。这是因为我正在使用的文字处理器对\
  \ `h1` 和 `p` 有特定的设置。如果你将代码复制并粘贴到编辑器并在网页上运行它，它们将正常工作。此外，这就是我在本书的其余部分将编写嵌入 HTML 结构中的代码的方式，因为当你在创建网站时也是这样写的。你需要通过\
  \ HTML 嵌入来编写 JavaScript 脚本，以便让浏览器读取。在上述的示例中，你可以看到每个变量都有对应的变量来持有。\n\n与其创建一个单个字母变量，现在我将创建具有完整单词名称的变量。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>You are studying JavaScript Variables</p>\n\
  <p>In the following example, the variables will have full-word names.</p>\n<p id=\"\
  variable-demo\"></p>\n<script>\nvar milkprice = 150;\nvar oilprice = 160;\nvar totalprice\
  \ = milkprice + oilprice;\ndocument.getElementById(\"variable-demo\").innerHTML\
  \ =\"The value of totalprice is: \" + totalprice;\n</script>\n</body>\n</html>\n\
  ```\n\n你正在学习 JavaScript 变量。在下面的示例中，变量将具有完整的单词名称。`totalprice` 的值是：310\n\n### JavaScript\
  \ 标识符\n\nJavaScript 变量需要赋予唯一的名称，以便于识别识别。这些唯一名称被称为标识符。标识符可以是像 `a`、`b`、`c` 这样的短名称，也可以是像\
  \ `totalprice`、`milkprice` 和 `oilprice` 这样的长描述性名称。JavaScript 变量有一些命名规则。你可以使用这些规则来减少错误概率。\n\
  \n*   变量中不能包含数字、字母、美元符号和下划线（注：原文此处可能有误，通常应为“可以包含”）。\n*   变量可以以 `$` 符号开头。\n*   变量是区分大小写，这使得\
  \ ‘a’ 和 ‘A’ 变量是不同的。\n*   变量必须以字母开头。\n*   你不能使用 JavaScript 关键字作为变量。\n\n\n\n\n如果你在\
  \ JavaScript 中看到类似 `= ` 的等号，你不应该将其误认为是代数中使用的等号。它有不同的用途。变量存储的信息可能在你创建的程序之后被使用。脚本很长，因此变量可以轻松定位有用值。变量便于在同一段代码中重复使用某个值。与其记住这个值，不如创建一个变量并用该值填入。\n\
  \n# 数据类型\n\nJavaScript 变量可以持有不同类型的信息，如数字和文本。编程中的文本值被称为文本字符串（text strings）。JavaScript\
  \ 可以持有不同类型的数据。正如我已经解释过的，字符串必须写在单引号或双引号中，任你选择哪种都可以。写数字时不加引号。如果你对数字使用引号，浏览器将将其解释为字符串。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>你正在学习 JavaScript 变量</p>\n  <p>我正在定义\
  \ JavaScript 数据类型。</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n    var num\
  \ = 5555555.889;\n    var novelist = \"Charles Dickens\";\n    var introduction\
  \ = 'Charles Dickens wrote melodramatic novels!';\n    document.getElementById(\"\
  variable-demo\").innerHTML = num + \"<br>\" + novelist + \"<br>\" + introduction;\n\
  \  </script>\n</body>\n</html>\n```\n你正在学习 JavaScript 变量\n我正在定义 JavaScript 数据类型。\n\
  5555555.889\nCharles Dickens\nCharles Dickens wrote melodramatic novels!\n\n# 变量声明\n\
  \n变量声明的过程实际上是变量创建的过程。你可能已经注意到上面的示例，我在每个变量之前都使用了 `var` 关键字。没有 `var` 关键字，你就无法创建变量。一旦你声明了一个变量，该变量将没有值。你必须像我在示例中做的那样给它分配一个值。在这里使用了等号\
  \ `=`。你将该符号置在变量名和值之间。\n\n## 未定义变量 (Undefined)\n\n在不同的程序中，你经常可以声明不带值的变量。这个值可以是你可以计算出的，也可以是你稍后提供的，例如用户输入。你声明的一个不带值的变量带有一个“undefined”（未定义）值。我将使用我已经创建的一个示例，并去掉变量的值。让我们使用最后一个示例，以便你更好地理解。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>你正在学习 JavaScript 变量</p>\n  <p>我正在定义\
  \ JavaScript 的未定义变量。</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n    var num;\n\
  \    var novelist;\n    var introduction;\n    document.getElementById(\"variable-demo\"\
  ).innerHTML =;\n  </script>\n</body>\n</html>\n```\n你正在学习 JavaScript 变量\n我正在定义 JavaScript\
  \ 的未定义变量。\n\n## 重复 (Re-Declaration)\n\n你可能定义并声明了一个变量，但稍后改变了主意，并通过我刚刚解释的过程使其变为未定义。那么，这会让它变成未定义吗？答案是“不会”。在声明后将其变为未定义不会让变量丢失值。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>你正在学习 JavaScript 变量</p>\n  <p>这是\
  \ JavaScript 未声明的变量。</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n    var num\
  \ = 5555.444;\n    var novelist = \"Charles Lamb\";\n    var introduction = \"Charles\
  \ Lamb wrote beautiful humor.\";\n    var num;\n    var novelist;\n    var introduction;\n\
  \    document.getElementById(\"variable-demo\").innerHTML = num + \"<br>\" + novelist\
  \ + \"<br>\" + introduction;\n  </script>\n</body>\n</html>\n```\n你正在学习 JavaScript\
  \ 变量\n这是 JavaScript 未声明的变量。\n5555.444\nCharles Lamb\nCharles Lamb wrote beautiful\
  \ humor.\n\n# 算术 (Arithmetic)\n\nJavaScript 与其他编程语言一样，允许你进行数学计算。你可以相加数字产生结果，然后将结果传递给变量存储。在代码中，你可以使用\
  \ `=` 和 `+` 等运算符。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>JavaScript 算术</p>\n\
  \  <p>这是 JavaScript 未声明的算术。</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n  \
  \  var a = 15 + 3452 + 13 + 8 + 1;\n    document.getElementById(\"variable-demo\"\
  ).innerHTML = a;\n  </script>\n</body>\n</html>\n```\nJavaScript 算术\n这是 JavaScript\
  \ 未声明的算术。\n3489\n\n## 减法 (Subtraction)\n\n要讨论的下一个算术运算符是减法。该运算符的符号与代数使用的相同。你可以在程序中填充任意数字，并在之间放入\
