- fmt: "\nThe next digit is 4. The loop had to complete the iteration through 10 digits,\
    \ but as I added a `break` statement at position 5, the loop broke out of iterations,\
    \ and the program stopped. The `continue` statement cannot be said to be the opposite\
    \ of the `break` statement because, like the `break` statement, it also breaks\
    \ the loop but then continues with the rest of the iterations of the program.\
    \ I will use the same example to elaborate upon how you can benefit from the `continue`\
    \ statement.\n\n# Learning JavaScript Loops\n\nI will integrate a `break` statement\
    \ to the `for` loop.\n\n```javascript\nvar msg = \"\";\nvar YY;\nfor (YY = 0;\
    \ YY < 10; YY++) {\n  if (YY === 5) {\n    continue;\n  }\n  msg += \"The next\
    \ digit is \" + YY + \"<br>\";\n}\ndocument.getElementById(\"demo9\").innerHTML\
    \ = msg;\n```\n\nThe next digit is 0\nThe next digit is 1\nThe next digit is 2\n\
    The next digit is 3\nThe next digit is 4\nThe next digit is 6\nThe next digit\
    \ is 7\nThe next digit is 8\nThe next digit is 9\n\nThe loop broke at point 5\
    \ and then continued. You can see that the only number that is missing in the\
    \ results is number 5. The `continue` statement is suitable for skipping one iteration\
    \ of a loop. The `break` statement has only one purpose: to give you a jump out\
    \ of a `switch` or a loop. You can use the `break` statement to make a jump out\
    \ of a code block.\n\n# Chapter Seven: JavaScript Functions\n\nUntil now, we have\
    \ created scripts that run the minute the web page loads up in a browser. There\
    \ is another way to use the code. You can pack up the code inside a function and\
    \ run it in the web browser. Unless you make a function call, you will not see\
    \ anything in action on the browser. A function phrase contains the `function`\
    \ keyword, the name of the function, and curly braces.\n\nYou have to include\
    \ a space after the `function` keyword. After that, you need to write the name\
    \ that you choose to give to your function. These are quite similar to the variable-name\
    \ tradition. However, the only difference in the naming of functions is that you\
    \ can add a number, a letter, `$` or underscores to the name of a function. After\
    \ this, you need to add a set of round brackets or parentheses to include any\
    \ arguments. After that, you need to put in the curly brackets to write the code.\
    \ You don’t have to write your function on multiple lines. You can write it on\
    \ a single line if you are comfortable with that. However, it is better to write\
    \ it on multiple lines at the start so that you get a clear idea of how it is\
    \ written. In addition, you can correct any mistake easily if the code does not\
    \ work well.\n\nA JavaScript function is created to perform a special task. You\
    \ can execute it when you make a function call.\n\nIn this example, I will make\
    \ a function call to perform a calculation and gives back the result:\n\n```javascript\n\
    function FunctionZZ(x1, x2) {\n  return x1 * x2;\n}\ndocument.getElementById(\"\
    demo890\").innerHTML = FunctionZZ(345, 1222);\n```\n\n421590.\n\nYou can see that\
    \ there is a `function` keyword that is followed by the name of the function.\
    \ I have included the parentheses in the code. You may include one or more parameters\
    \ in the parentheses. The code that you need to include in the function is put\
    \ inside the curly brackets. As for the function arguments, you have to pass them\
    \ when you have created a function, and now you want to invoke it. Inside of it,\
    \ the arguments tend to behave very much like local variables. A function works\
    \ the same way as a `Subroutine`, and a `Procedure` do in other programming languages.\n\
    \n## The Invocation of Function\n\nThe code that you pack up inside a function\
    \ will only execute if and when you invoke the function. The process of invoking\
    \ is also called making a function call. It may happen when a visitor hits a button\
    \ on a web page, or you can invoke it from the JavaScript code. You may also set\
    \ the function on self-invoked.\n\nThere is a `return` at the end of a function.\
    \ When you reach it, the function will cease to execute. Functions more often\
    \ compute the return value, and the value is then returned to the one who made\
    \ the function call.\n\n```javascript\nvar Y = FunctionZZ(55, 2345)\ndocument.getElementById(\"\
    demo890\").innerHTML = Y;\nfunction FunctionZZ(x1, x2) {\n  return x1 * x2;\n\
    }\n```\n\n128975.\n\nIn the following example, you will see how I will reuse the\
    \ code many times after creating it once. You can fill it up with as many arguments\
    \ as you like and produce different results. This saves time and effort when you\
    \ are developing a web page. This also makes the process of coding faster and\
    \ efficient. See the following example.\n\n```javascript\nfunction toCels(f) {\n\
    \  return (15/90) * (f);\n}\ndocument.getElementById(\"demo789\").innerHTML =\
    \ toCels(80);\n```\n\n6.666666666666667 (from Fahrenheit to Celsius).\n\n## The\
    \ () Operator\n\nThe word `toCels` refers to the object of the function while\
    \ `toCels()` refers to the result of the function. When you access a function\
    \ without the parentheses, it will return the object of the function instead of\
    \ the result.\n\n```javascript\nfunction toCels(f) {\n  return (15/90) * (f);\n\
    }\ndocument.getElementById(\"demo89\").innerHTML = toCels;\n```\n\n```javascript\n\
    function toCels(f) {\n  return (15/90) * (f);\n}\ndocument.getElementById(\"demo89\"\
    ).innerHTML = toCels();\n```\n\n## Functions as Variables\n\nYou can use functions\
    \ in the same way as use variables in different assignments, and calculations.\
    \ Instead of using variables for storing the return value of functions, you can\
    \ use it directly in the form of the variable.\n\n```javascript\nfunction toCels(tempheit)\
    \ {\n  return (15/9) * (tempheit);\n}\ndocument.getElementById(\"demo234\").innerHTML\
    \ = \"Presently, the average temperature is about \" + toCels(90) + \" Celsius\"\
    ;\n```\n\n8.333333333333334\n\n## Local Variables\n\nThe variables that you declare\
    \ inside a JavaScript function become local to a function. You can only access\
    \ local variables from inside of a function.\n\n```javascript\nfunction FunctionOP()\
    \ {\n  var carsale = \"BMW\";\n}\ndocument.getElementById(\"demo15\").innerHTML\
    \ = typeof FunctionOP();\ndocument.getElementById(\"demo25\").innerHTML = typeof\
    \ carsale;\n```\n\nundefined. BMW.\n\nLocal variables can be recognized in the\
    \ functions. The variables that have the same name may be used in multiple functions.\
    \ When a function starts, you can create local variables. When the function completes,\
    \ local variables are deleted. When you have created a function, you can save\
    \ the code and load it up in the browser. If you see nothing happening, you did\
    \ it right because the code that exists between the curly braces does not get\
    \ a display. There are more than one ways to make a function call. You can use\
    \ the `onload` function to load the function to the browser window. You may add\
    \ the code `onload` to the start of the function for successful execution.\n\n\
    ## JavaScript Expressions\n\nYou can define a JavaScript function with the help\
    \ of an expression. You can store the expression of the function inside a variable.\n\
    \n```javascript\nvar Y = function (x, y) {\n  return x * y;\n};\ndocument.getElementById(\"\
    demo12\").innerHTML = Y;\n```\n\n3026.\n\nAfter the expression has been stored\
    \ in a variable, you can use the variable in the function. In the following example,\
    \ I will allot values to a variable.\n\n```javascript\nvar Y = function (x, y)\
    \ {\n  return x * y;\n};\ndocument.getElementById(\"demo12\").innerHTML = Y(34,\
    \ 89);\n```\n\nIf you analyze the above examples, you will notice that the function\
    \ lacks a name. I deliberately kept it anonymous. The functions that are stored\
    \ inside the variables are in no need of naming. You can always invoke them by\
    \ using the name of the variable. As for the addition of a semicolon to the end,\
    \ it is needed to end an executable statement.\n\n## The constructor()\n\nJavaScript\
    \ functions are usually defined with the help of the `function` keyword. These\
    \ functions are created and defined with a `constructor()`.\n\n```javascript\n\
    var FunctionLK = new Function(\"x\", \"y\", \"return x * y\");\ndocument.getElementById(\"\
    demo555\").innerHTML = FunctionLK(345, 2);\n```\n\n690. If we consider the practical\
    \ applications of the `constructor()`, we will realize that we don’t have to use\
    \ the `constructor`.\n\n```javascript\nvar FunctionLK = function(x, y) {\n  return\
    \ x * y;\n};\ndocument.getElementById(\"demo555\").innerHTML = FunctionLK(345,\
    \ 2);\n```\n\n690.\n\n## Self-Invoking\n\nThe expressions of functions may be\
    \ made self-invoking. A self-invoking expression may be invoked even if you do\
    \ not make a call. The expressions of functions will execute if you put parentheses\
    \ after the function. It is not possible that self-invoke a declaration of a function.\
    \ You must add parentheses around a function for the sake of indication that it\
    \ is the expression of a function.\n\n```javascript\n(function () {\n  document.getElementById(\"\
    demo689\").innerHTML = \"This is calling by myself\";\n})();\n```\n\nThis is calling\
    \ by myself. The function in the above-mentioned example is an anonymous self-invoking\
    \ function. I did not give it a name. You can use functions as values in the following\
    \ manner.\n\n```javascript\nfunction FunctionH(x, y) {\n  return x * y;\n}\nvar\
    \ Y = FunctionH(2, 2);\ndocument.getElementById(\"demo12\").innerHTML = Y;\n```\n\
    \n4. Y = FunctionH(2, 2) or Y = 4. In the above cases, Y is a number becomes the\
    \ value of 4. You can use functions in expressions.\n\n```javascript\nfunction\
    \ Function123(x, y) {\n  return x * y;\n}\nvar Y = Function123(5, 2) * 8;\ndocument.getElementById(\"\
    demo678\").innerHTML = Y;\n```\n\n80.\n\n## Functions or Objects\n\nIf you use\
    \ the `typeof` operator we learned about in the previous chapters to know the\
    \ type of functions, you will realize that JavaScript functions are best described\
    \ in the form of objects. Just like objects, functions in JavaScript have methods\
    \ and properties. In the following examples, I will try to apply some properties\
    \ to functions and see how it behaves. The `length` property is used to return\
    \ arguments that the function has received.\n\n## Getters Setters\n\nWith classes,\
    \ you can adjust getters and setters in the browser. Getters and setters are useful\
    \ for the properties if you need to do something special with the returning values.\
    \ You can use the `get` and `set` keywords to add them to your classes.\n\n```javascript\n\
    class LuxCars {\n  constructor(carname, caryear, carmake, carmodel, carcolor)\
    \ {\n    this.cname = carname;\n    this.cyear = caryear;\n    this.cmake = carmake;\n\
    \    this.carmodel = carmodel;\n    this.ccolor = carcolor;\n  }\n  get namec()\
    \ {\n    return this.cname;\n  }\n  set namec(Y) {\n    this.cname = Y;\n  }\n\
    }\nlet Car2 = new LuxCars(\"Tesla\");\ndocument.getElementById(\"demo778\").innerHTML\
    \ = Car2.namec;\n```\n\n## The Deletion\n\nJust as the addition of properties\
    \ is simple and fun, the deletion is also easy and fun to do. The keyword used\
    \ is `delete`. By using the keyword, JavaScript deletes a property from the object.\
    \ You should be careful when you are using the `delete` keyword. It deletes the\
    \ value as well as the property in one go and you cannot use the property after\
    \ you have deleted it. This is unlike other programming languages. This operator\
    \ is only applicable on objects and will have no effect on functions and variables.\
    \ This operator is ineffective on the predefined object properties of JavaScript,\
    \ and your web application may crash if you do that. This is not good for the\
    \ reputation of your website and business.\n\n```javascript\nvar man1 = {\n  Namef:\
    \ \"Christiano\",\n  Namel: \"Ronaldo\",\n  profession: \"soccer star\",\n  economicalstatus:\
    \ \"rich\"\n};\ndelete man1.nationality;\ndocument.getElementById(\"demo90\").innerHTML\
    \ = man1.Namef + \" is the biggest \" + man1.profession + \" across the world.\
    \ He is from \" + man1.nationality + \".\";\n```\n\nundefined. You can see that\
    \ JavaScript deleted the property even before I could use it in the program. The\
    \ word `undefined` shows that the value of the property is no more.\n\n## Dates\n\
    \nThe JavaScript date feature is interesting to learn. When you are creating a\
    \ new website, you need the date feature to integrate into your web page so that\
    \ your visitors can see. It is also helpful in regulating the shipping time and\
    \ other details. By default, the output of the date feature in JavaScript is displayed\
    \ as per the browser's time zone. The display is in the form of a complete text\
    \ string. You can create different objects to include in the display of the date.\
    \ The objects may be year, month, hours, seconds, and milliseconds. You can add\
    \ more information as your need. You can use the `new Date()` method to create\
    \ a new data object to display the browser's current date and time.\n\n```javascript\n\
    var Y = new Date();\ndocument.getElementById(\"demo678\").innerHTML = Y;\n```\n\
    \n## JavaScript Classes\n\nJavaScript is also known as a prototype-based language.\
    \ Every object in this language keeps a hidden and internal property known as\
    \ `[[Prototype]]`. You can use it to extend the methods and properties of the\
    \ objects. You can use the `class` keyword for the creation of a class.\n\n```javascript\n\
    class LuxCars {\n  constructor(cname, cyear, cmake, cmodel, ccolor) {\n    this.cname\
    \ = cname;\n    this.cyear = cyear;\n    this.cmake = cmake;\n    this.cmodel\
    \ = cmodel;\n    this.ccolor = ccolor;\n  }\n  carAge() {\n    let cdate = new\
    \ Date();\n    return cdate.getFullYear() - this.cyear;\n  }\n}\nlet Car1 = new\
    \ LuxCars(\"Ford\", 2017, \"USA\", \"Mustang\", \"Blue\");\ndocument.getElementById(\"\
    demo777\").innerHTML = Car1.cname + \" \" + Car1.cyear + \" \" + Car1.cmake +\
    \ \" \" + Car1.cmodel + \" \" + Car1.ccolor;\nlet Car2 = new LuxCars(\"BMW\",\
    \ 2010, \"Germany\", \"K45\", \"Silver\");\ndocument.getElementById(\"demo778\"\
    ).innerHTML = Car2.cname + \" \" + Car2.cyear + \" \" + Car2.cmake + \" \" + Car2.cmodel\
    \ + \" \" + Car2.ccolor;\nlet Car3 = new LuxCars(\"Mercedes\", 2021, \"Germany\"\
    , \"S-Class\", \"Black\");\ndocument.getElementById(\"demo779\").innerHTML = Car3.cname\
    \ + \" \" + Car3.cyear + \" \" + Car3.cmake + \" \" + Car3.cmodel + \" \" + Car3.ccolor;\n\
    ```\n\n## Class Methods\n\nThe procedure to write and execute class methods is\
    \ the same as writing and creating an object. You have to use the `class` keyword\
    \ and the `constructor()` method when you are adding a new method to the class.\
    \ The total number of methods that you can add does not have an cap. You can add\
    \ any number at will. Let us add a new method to declare the age of the car. JavaScript\
    \ calculates the age of the car using the current date as a reference. For example,\
    \ if a car is produced in 2020, the program will display the age as 1 year old\
    \ because the current year is 2021.\n\n```javascript\nclass LuxCars {\n  constructor(cname,\
    \ cyear, cmake, cmodel, ccolor) {\n    this.cname = cname;\n    this.cyear = cyear;\n\
    \    this.cmake = cmake;\n    this.cmodel = cmodel;\n    this.ccolor = ccolor;\n\
    \  }\n  carAge() {\n    let cdate = new Date();\n    return cdate.getFullYear()\
    \ - this.cyear;\n  }\n}\nlet Car1 = new LuxCars(\"Ford\", 2017, \"USA\", \"Mustang\"\
    , \"Blue\");\nlet Car2 = new LuxCars(\"BMW\", 2010, \"Germany\", \"K45\", \"Silver\"\
    );\nlet Car3 = new LuxCars(\"Mercedes\", 2021, \"Germany\", \"S-Class\", \"Black\"\
    );\n```\n\n## Passing Parameters\n\nYou can send off parameters to your JavaScript\
    \ classes. I will pass the age and year parameters to JavaScript class.\n\n```javascript\n\
    class LuxCars {\n  constructor(cname, cyear, cmake, cmodel, ccolor) {\n    this.cname\
    \ = cname;\n    this.cyear = cyear;\n    // (rest of constructor omitted for brevity\
    \ in logic flow)\n  }\n}\n```\n\n## Class Inheritance\n\nIf you want to create\
    \ a class inheritance, you have to add the `extends` keyword to the class. The\
    \ `extends` keyword transfers all the methods to the inherited class.\n\n```javascript\n\
    class LuxCars {\n  constructor(cname, cyear, cmake, cmodel, ccolor) {\n    this.cname\
    \ = cname;\n    this.cyear = cyear;\n    this.cmake = cmake;\n    this.cmodel\
    \ = cmodel;\n    this.ccolor = ccolor;\n  }\n  present() {\n    return 'We have\
    \ a ' + this.cname + ' for sale';\n  }\n}\nclass Ecar extends LuxCars {\n  constructor(battery,\
    \ model) {\n    super(battery);\n    this.cmodel = model;\n  }\n  show() {\n \
    \   return this.present() + '. It is a ' + this.cmodel + ' model.';\n  }\n}\n\
    let Car2 = new Ecar(\"Tesla\", 2010);document.getElementById(\"demo778\").innerHTML\
    \ = Car2.show();\n```\n\nThe `super()` method in the above code refers to the\
    \ parent class. When you call this method in the `constructor` method, you get\
    \ access to the parent class's properties and methods. The sole purpose of inheritance\
    \ is that it keeps you from writing the same code repeatedly. You can write a\
    \ class once and use its methods and properties by creating child classes. Whenever\
    \ you create a new class, there is no need to write from the start. It saves time\
    \ and space.\n\n## Conclusion\n\nNow that you have reached the end of the book,\
    \ the next step is to practice more and be a master of JavaScript. I hope you\
    \ have not only read all the theory and code, but you have also used the code\
    \ to load web pages and display information. I deliberately enclosed all the code\
    \ in HTML tags so that you may feel it easy to use it and practice the same. The\
    \ best method is to note down the code during revisions and practice them whenever\
    \ you have time. Memorizing the code and using it in a browser is the only way\
    \ you can master this.\n"
