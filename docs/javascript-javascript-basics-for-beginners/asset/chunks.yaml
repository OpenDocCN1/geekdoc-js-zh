    ## The else if Statement

    You can add the `else-if` statement to the code to specify the new condition if
    the first condition returns false. In the following example, I will add more than
    two conditions to see how they work and how much improvement they bring to our
    code.


    ```html

    <!DOCTYPE html>

    <html><body>

    <p>I would like you to click the button given below to display a greeting as per
    the current time:</p>

    <button onclick="FunctionX()">Please hit me to display the greetings</button>

    <p id="ifelse-demo"></p>

    <script>

    function FunctionX() {var mygreetings ;var mytime = new Date().getHours();if (mytime
    < 8) {mygreetings = "Have a Good Morning. I hope you have had a nutritious breakfast.
    Get ready for work";} else if (mytime < 15) {mygreetings = "Have a Great Day.
    Don''t forget to eat your lunch.";} else {mygreetings = "Have a Great Evening.
    Any special plans for dinner?";}document.getElementById("ifelse-demo").innerHTML
    = mygreetings;}</script>

    </body>

    </html>

    ```

    I would like you to click the button given below to display a greeting as per
    the current time: Please hit me to display the greetings Have a Great Day. Don''t
    forget to eat your lunch.


    This worked perfectly. Now your program will display greetings messages all three
    times of the day. You can customize the message and make it more interactive as
    per the needs of your business. Some coders are in the habit of writing the `if`
    statements by removing the curly brackets. The practice is completely legal; however,
    it is a bit hard to do. Some programmers put the initial curly bracket on a new
    line. Another practice is to write the entire `if` statement on a single line,
    which is easier to do but difficult to read when you come back to study the structure
