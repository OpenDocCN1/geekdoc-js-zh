    \ 方法给你数组中通过测试的第一个项的值。\n\n```html\n<!DOCTYPE html>\n<html><body><p>这是 JavaScript\
    \ Array.find()</p><p id=\"demo00\"></p><script>var nums = [444, 55544, 2333, 56666,\
    \ 22, 876];var a = nums.find(FunctionZ);document.getElementById(\"demo00\").innerHTML\
    \ = \"The number that is bigger than 500 = \" + a;function FunctionZ(valueF) {return\
    \ valueF > 500;}</script></body></html>\n```\n\n这是 JavaScript `Array.find()`\n\
    大于 500 的数字 =\n\n## findIndex() 方法\n\n`findIndex()` 方法将返回数组中第一个通过测试的元素的索引。由于我们处理的数组是由数字组成的，我将设置一个条件，让数组测试每个数字以检查是否小于\
    \ 500。\n\n```html\n<!DOCTYPE html>\n<html><body><p>这是 JavaScript Array.findIndex()</p><p\
    \ id=\"demo55\"></p><script>var nums = [444, 55544, 2333, 56, 22, 876];var a =\
    \ nums.findIndex(FunctionZ);document.getElementById(\"demo55\").innerHTML = \"\
    The index of the number that is lower than 500 = \" + a;function FunctionZ(valueF)\
    \ {return valueF < 500;}</script></body></html>\n```\n\n这是 JavaScript `Array.findIndex()`\n\
    小于 500 的数字索引 =0\n\n## 第六章：JavaScript 循环\n\n`for`循环包含一个语句和三个表达式。有一个初始化部分在`for`循环第一次执行之前运行。此表达式用于创建计数器。你在这里创建的变量会立即作用于循环。一旦循环执行并到达逻辑终，这些变量就会被销毁。\n\
    \n`for`循环的另一个部分是条件。`for`循环在每次新迭代执行之前检查此表达式。如果你省略这部分，表达式将被求值为真，并执行循环中的语句。如果求值为假，循环停止工作。\n\
    \n循环的另一个部分是最终表达式。此表达式在每次迭代后运行。它用于增加计数器。然而，你也可以用它来减少计数器。循环的语句部分是在循环内部必须重复的代码。你可以根据需要从`for`循环中省略这些表达式。\n\
    \nJavaScript 中的`for`循环用于计数数字或语句的迭代。它们还可以重复代码中的语句。只有在循环中插入了 `break`语句后才能退出循环。我将在后续章节中更多探索`break`语句。\n\
    \n循环是特殊的，因为它们节省了多次编写代码的烦恼。它重复代码直到满足某些条件。\n"
