  trans: "\n900025 我为函数分配了三个参数；第一个参数处理项的值，第二个参数处理项的索引，第三个参数处理整个数组。在上述示例中，我只部署了 `Evalue`\
    \ 参数。这意味着，如果你不需要另外两个参数，可以将它们从函数中切切掉以简化代码。然而，如果你认为你以后会需要另外两个参数，可以保留它们并在稍后的单独函数调用中使用它们。`Array.forEach()`\
    \ 方法最大的优点是，它适用于除 Internet Explorer 8 或更早版本以外的所有网络浏览器。\n\n## map() 方法\n\n程序员使用\
    \ `map()` 方法通过对所有数组元素执行单独的函数来创建一个新数组。它不会对没有值的元素执行该函数，也不会改变数组的原始形式。接下来的示例将使用加法运算符为数组中的每个数字加上\
    \ 1000，并以此创建一个新数组。\n\n```html\n<!DOCTYPE html>\n<html><body><p>这是 JavaScript Array.map()</p><p>我将通过对所有数组元素应用该函数来创建一个新数组。</p><p\
    \ id=\"demo90\"></p><script>var nums1 = [12345, 7674, 3449, 12316, 9900025];var\
    \ nums2 = nums1.map(FunctionM);document.getElementById(\"demo90\").innerHTML =\
    \ nums2;function FunctionM(Mvalue, Mindex, Marray) {return Mvalue + 1000;}</script></body></html>\n\
    ```\n\n这是 JavaScript `Array.map()`\n我将通过对所有数组元素应用该函数来创建一个新数组。\n13345,8674,4449,13316,9901025\
    \ 我将移除加法运算符并添加乘法运算符以产生结果并创建一个新数组。\n\n```html\n<!DOCTYPE html>\n<html><body><p>这是\
    \ JavaScript Array.map()</p><p>我将通过对所有数组元素应用该函数来创建一个新数组。</p><p id=\"demo90\"></p><script>var\
    \ nums1 = [12345, 7674, 3449, 12316, 9900025];var nums2 = nums1.map(FunctionM);document.getElementById(\"\
    demo90\").innerHTML = nums2;function FunctionM(Mvalue, Mindex, Marray) {return\
    \ Mvalue * 1000;}</script></body></html>\n```\n\n这是 JavaScript `Array.map()`\n\
    我将通过对所有数组元素应用该函数来创建一个新数组。\n12345000,7674000,3449000,12316000,9900025000 请注意，我在代码中包含的函数接受三个参数；第一个参数是值，第二个参数是索引，第三个参数是整个数组。如果你只需要处理一个参数，可以省略其余参数。省略不会影响程序。它将产生相同的结果。与前面的方法一样，`Array.map()`\
    \ 在 internet explorer 8 或其早期版本以外的所有网络浏览器中都能运行良好。\n\n## filter() 方法\n\n`filter()`\
    \ 方法倾向于创建一个包含成功通过测试的数组元素的新数组。我将过滤器条设置为 20，这意味着所有大于 20 的数字都将被该方法过滤掉。用户只会看到大于 20\
    \ 的数字。其余元素将被隐藏。\n\n```html\n<!DOCTYPE html>\n<html><body><p>这是 JavaScript Array.filter()</p><p>接下来的程序将通过过滤所有可能通过测试的数组元素来创建一个新数组。</p><p\
    \ id=\"demo789\"></p><script>var nums = [45890, 17, 3459, 18, 2, 6, 23416, 87625];var\
    \ over20 = nums.filter(FunctionZ);document.getElementById(\"demo789\").innerHTML\
    \ = over20;function FunctionZ(valueF, indexF, arrayF) {return valueF > 20;}</script></body></html>\n\
    ```\n\n这是 JavaScript `Array.filter()`\n接下来的程序将通过过滤所有可能通过测试的数组元素来创建一个新数组。\n45890,3459,23416,87625\n\
    \n## reduce() 方法\n\n`reduce()` 方法对所有数组元素进行函数调用并产生一个值。该方法在数组内部从左到右操作。它保持原始数组的完整性。\n\
    \n```html\n<!DOCTYPE html>\n<html><body><p>这是 JavaScript Array.reduce()</p><p>接下来的程序将通过还原所有可能通过测试的数组元素来创建一个新数组。</p><p\
    \ id=\"demo789\"></p><script>var nums = [45890, 17, 3459, 18, 2, 6, 23416, 87625];var\
    \ over20 = nums.reduce(FunctionZ);document.getElementById(\"demo789\").innerHTML\
    \ = over20;function FunctionZ(Total, valueF) {return Total + valueF;}</script></body></html>\n\
    ```\n\n这是 JavaScript `Array.reduce()`\n接下来的程序将通过还原所有可能通过测试的数组元素来创建一个新数组。\n160433\
    \ `reduce()` 方法最神奇的地方在于它接受一个额外的值，与其他方法不同。\n\n```html\n<!DOCTYPE html>\n<html><body><p>这是\
