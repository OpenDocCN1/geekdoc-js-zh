  trans: "\n如果我们讨论这两个关键词中推荐哪一个，我们可以说在编写程序时，`let` 关键字是最佳的考虑选项。然而，某些浏览器不支持 `let` 关键字。因此，你可能会觉得需要使用\
    \ `var` 关键字。\n\n# 第三章：JavaScript 常量\n\nJavaScript 中的 `const` 关键字是在 `ES2015` 中引入的。使用\
    \ `const` 关键字定义的变量与使用 `let` 关键字定义的变量一样工作。唯一的区别在于你不能对它们进行重新赋值。一旦你初始化了一个常量，之后就无法更改它的值。这就是常量不同于\
    \ `var` 关键字之处。如果你必须声明一个常量，你需要先对其进行初始化。\n\n你应该仔细考虑一下在程序中是否真的需要使用常量。只有当你确定不会更改变量的值时，才应该使用它。常量的名称可以是一个法的标识符。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>你正在学习 JavaScript 常量</p>\n<p>记住，你不能改变原始值。</p>\n\
    <p id=\"const-demo\"></p>\n<script>\ntry {\n  const xyz = 89.141592653589793;\n\
    \  xyz = 54.14;\n} catch (err) {\n  document.getElementById(\"const-demo\").innerHTML\
    \ = err;\n}\n</script>\n</body>\n</html>\n```\n\n你正在学习 JavaScript 常量\n记住，你不能改变原始值。\n\
    TypeError: Assignment to constant variable.\n\n## 块作用域\n\n当使用块作用域时，使用 `const`\
    \ 关键字声明变量与使用 `let` 关键字声明非常相似。接下来的示例将解释它如何倾向于 `let` 关键字并疏远 `var` 关键字。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<p>在这个示例中，我将通过使用 const 关键字声明一个变量</p>\n<p id=\"\
    const-demo\"></p>\n<script>\nvar xyz = 15; // xyz 的值为 15\n{\n  const xyz = 1;\
    \ // xyz 的值为 1\n}\n// xyz 的值为 15\ndocument.getElementById(\"const-demo\").innerHTML\
    \ = xyz;\n</script>\n</body>\n</html>\n```\n\n在这个示例中，我将通过使用 const 关键字声明一个变量\n\
    15\n\n与使用 `var` 关键字声明的变量不同，常量在声明时必须赋值。你不能让值部分为空。“constant”（常量）这个词有点让人困惑，如果不是完全误导的话。`const`\
    \ 关键字并不定义的是常量值。实际上，它定义的是你在等式中使用的值的常量引用。这就是为什么你不能改变常量的原始值。但是，你可以更改属性。\n\n### 原始值\n\
    \n如果你给常量赋了一个原始值，那么以后你将无法更改该值。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>这些都是\
    \ JavaScript 常量</p>\n<p>让我们尝试是否可以改变原始值。</p>\n<p id=\"const-demo\"></p>\n<script>\n\
    try {\n  const xyz = 5556.175757557757793;\n  xyz = 3555.19090;\n} catch (err)\
    \ {\n  document.getElementById(\"const-demo\").innerHTML = err;\n}\n</script>\n\
    </body>\n</html>\n```\n\n这些都是 JavaScript 常量\n让我们尝试是否可以改变原始值。\nTypeError: Assignment\
    \ to constant variable.\n\n虽然你不能改变 JavaScript 常量中的原始值，但你可以更改对象的属性。在接下来的示例中，我将使用\
    \ `const` 关键字创建一个对象，然后对该对象的属性引入一些更改，看看我是否可以更改它们。查看示例以了解如何操作的。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<p>JavaScript 常量</p>\n<p>在声明对象后你可以更改对象的属性：</p>\n<p id=\"\
    const-demo\"></p>\n<script>\n// 我将创建一个对象：\nconst mycar = {name:\"Honda\", model:\"\
    Vezel\", make:\"Japan\", color:\"Grey\"};\n// 让我们更改属性：\nmycar.model = \"Civic\"\
    ;\n// 你也可以添加一个新属性：\nmycar.transmission = \"Automatic\";\n// 是时候显示你的属性了：\ndocument.getElementById(\"\
    const-demo\").innerHTML = \"I have a \" + mycar.name + \".\" + \" It is of \"\
    \ + mycar.color + \" color and its model label is \" + mycar.model + \". \" +\
    \ \"This car has \" + mycar.transmission + \".\";\n</script>\n</body>\n</html>\n\
    ```\n\nJavaScript 常量\n在声明对象后你可以更改对象的属性：\n我有一辆本田。它是灰色的，它的型号标签是 Civic。这辆车是自动的。\n\
    \n你看到我将型号从 Vezel 改为了 Civic。我还添加了新属性来描述汽车的变速模式。这方便了程序员，因为他们可以创建一个对象，然后根据不断需要添加或更改属性。然而，你不能在程序中将不同的对象重新赋值给同一个常量。如果你这样做，就会报错。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>学习 JavaScript 常量</p>\n<p>禁止：不能将不同的对象重新赋值给同一个常量：</p>\n\
    <p id=\"const-demo\"></p>\n<script>\ntry {\n  const mycar = {name:\"Honda\", model:\"\
    Vezel\", make:\"Japan\", color:\"black\"};\n  mycar = {name:\"BMW\", model:\"\
    Z1\", make:\"German\", color:\"red\"};\n} catch (err) {\n  document.getElementById(\"\
    demo\").innerHTML = err;\n}\n</script>\n</body>\n</html>\n```\n\n学习 JavaScript\
    \ 常量\n禁止：不能将不同的对象重新赋值给同一个常量：\n\n### 常量数组\n\n你可以使用 `const` 关键字创建数组，也可以更改它们。\n\n\
    # 第四章：提示与条件判断\n\n提示框（prompt）用于请求用户提供信息并给出响应。代码向用户提出一些问题并在相应的字段中提供答案。你可以更改响应。无论你是保持默认响应原样还是更改它，你的响应都会赋值给变量。\n\
    \n## JavaScript if 语句\n\n在本节中，我将解释如何处理不同类型的条件。假设你有一个提示框询问美国总统目前住在哪里。这里是用户看到的行：“你住在哪里？”如果用户回答正确，你可以显示一个警告框来祝贺他。如果他输入了其他内容，程序将不返回任何结果。\n"
- fmt: '

    - The `if` keyword is used to specify a code, the editor must execute in case
    a condition stands true.

    - The `else` keyword is used to specify a code that the editor must execute if
    the same condition stands false.

    - The `else-if` keyword is used to put a new condition to test if the first condition
    ended up being false.

    '
