    # The do/while Loop


    The `do/while` loop is considered a variant of the `while` loop. It will execute
    the code once before testing the condition. After that, the loop will be repeated
    as long as the specific condition is true. One thing that distinguishes the `do/while`
    from other loops is that it executes the code once, even if you have set the condition
    to false. This happens because the browser executes the code even before testing
    the condition.


    ```html

    <!DOCTYPE html>

    <html><body><p>This is JavaScript Do/While Loop</p>

    <p id="demo8"></p>

    <script>

    var msg = ""

    var YY = 0;

    do {

    msg += "<br>The next digit is " + YY;

    YY++;

    }while (YY < 5);

    document.getElementById("demo8").innerHTML = msg;

    </script></body>

    </html>

    ```


