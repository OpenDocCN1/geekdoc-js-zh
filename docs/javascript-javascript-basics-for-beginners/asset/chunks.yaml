  trans: '


    - `if` 关键字用于指定当条件为真时编辑器必须执行的代码。

    - `else` 关键字用于指定当相同条件为假时编辑器必须执行的代码。

    - `else-if` 关键字用于在第一个条件为假时，放置一个新条件进行测试。

    '
- fmt: '

    The `if` statement is case sensitive, so the keywords `if` and `IF` are two different
    words. If you replace `if` with `IF`, you will see an error on your screen.


    ```html

    <!DOCTYPE html>

    <html><body>

    <p>I will display "Have a Great Day!" if the time is less than 15:00:</p>

    <p id="if-demo">Have a Savory Evening!</p>

    <script>if (new Date().getHours() < 15) {document.getElementById("if-demo").innerHTML
    = "Have a Great Day!";}</script>

    </body>

    </html>

    ```

    I will display "Have a Great Day!" if the time is less than 15:00: Have a Great
    Day!


    ## The else Statement

    You can use the `else` statement for the specification of code that needs to be
    executed if your condition pops up as false. I will use the same code and add
    the `else` statement to the code to see how we can use the `else` statement to
    extend our code and make it more interactive and user-friendly. Now the user will
    have two options instead of the rigid one option code.


    ```html

    <!DOCTYPE html>

    <html><body>

