    way to go because it is a web standard.When it comes to the uses of JavaScript,
    the uses keep on changing. At first, JavaScript''s interaction with a website
    was constricted to forming interaction and giving users feedback. However, it
    evolved with time, and now the uses are much more than how it started.The use
    cases of JavaScript are changing with the change of times. Users need to change
    the tried, tested, and boring web interface of clicking on links, filling out
    information on a web page, and sending off a bunch of forms. They look at making
    the same processes more modern and user-friendly. JavaScript has enabled users
    to create a sign-up form that has the capacity to check if a username is already
    taken or is available. This prevents users from enduring page reload that can
    somewhat be highly frustrating. A search box shows you the more relevant and suggested
    results when you type something. It shows something that is based on your entries.
    The pattern is known as autocomplete - without JavaScript, that would not have
    been possible.The information that needs to change after set times without any
    input from the user is possible with the help of JavaScript. JavaScript may attempt
    to fix layout issues. By using JavaScript, you may find the exact area and position
    of any element on your web page. You can calculate the dimensions of the window
    of your browser. By collecting and using this information, you may help prevent
    the overlap of elements and other related issues. Let us suppose you have a menu
    for different levels. You can prevent the overlap of the menu items and scroll-bars
    by checking out the space for the sub-menu. Perhaps the best way by which JavaScript
    can help you is to enhance the interface that HTML gives you.Code is labeled as
    the text that forms programs. In many chapters of the books, you will find a lot
    of code. Reading and writing code, I must say, is an integral part of the process
    to learn and write programs.Metaprogramming is considered a powerful technique
    that can enable you to write a set of programs. The advent of ES6 has further
    eased off the utilization of metaprogramming in the world of JavaScript programming.
    You can use proxies and other similar features. The proxies of ES6 tend to facilitate
    the redefinition of different operations in objects.The <script> TagLet us talk
    about the symbol that is the most used tag in the book. All the JavaScript code
    is enclosed inside the <script> tags.<!DOCTYPE html><html><body><p>JavaScript
    rests in the Body</p><p id="demo12"></p><script>document.getElementById("demo12").innerHTML
    = "This is your First JavaScript";</script></body></html>JavaScript Rests in the
    BodyThis is your First JavaScriptThe older type of JavaScript was written differently.
    It had the following format such as <script type = “text/javascript”>.There are
    functions in JavaScript that you can use to execute blocks of code. You may call
    a function when some kind of event occurs. An event can be defined as a click
    button. You can place any kind of script in an HTML document. You can place the
    scripts either in the <head> or in the <body> or in both of them. The example
    of using a script in the head is as under:<!DOCTYPE html><html><head><script>function
    FunctionUN() {document.getElementById("demo34").innerHTML = "I have changed the
    Paragraph.";}</script></head><body><p>You have seen the JavaScript in the Head</p><p
    id="demo">This is a Paragraph.</p><button type="button" onclick="FunctionUN()">Click
    Me</button></body></html>You have seen the JavaScript in the HeadThis is a Paragraph.Click
    MeWhen you click the button on the web browser, you will trigger an invocation
    of the function. You also can put the script inside the <body> of the HTML page.
    You will invoke this function when you click the button.<!DOCTYPE html><html><body><p>This
    is A Web Page</p><p id="demo1">This is a Paragraph</p><button type="button" onclick="FunctionZ()">Click
    Me</button><script>function FunctionZ() {document.getElementById("demo1").innerHTML
    = "I have changed the Paragraph.";}</script></body></html>This is A Web PageI
    have changed the Paragraph.Click MeDisplayThere are different methods to display
    JavaScript in web browsers. Programmers use different techniques for display purposes.
    The first method that I have used in the book is the document.getElementById(id)
    method. In the phrase, id refers to the element that defines the HTML document.
    The word innerHTML defines the content of HTML.<!DOCTYPE html><html><body><p>This
    is going to be my First Web Page</p><p>This will be the First Paragraph.</p><p
    id="demo1234"></p><script>document.getElementById("demo1234").innerHTML = 4567
    + 36;</script></body></html>This is going to be my First Web PageThis will be
    the First Paragraph.4603The second method that you can use is the document.write()
    method. This also is a simple one. However, I have not created any script in the
    book by using this method except for this example to show you how it works:<!DOCTYPE
    html><html><body><p>This is going to be my First Web Page</p><p>This will be the
    First Paragraph.</p><p id="demo1234"></p><script>document.write (4567 + 36);</script></body></html>This
    is going to be my First Web PageThis will be the First Paragraph.4603If you use
    this method after loading the HTML page, you will lose all data because it will
    be deleted. Therefore, you should beware of the consequences if you make this
    mistake. Also, you can create a button with this method and test the HTML page.
    See the following example.<!DOCTYPE html><html><body><p>This is going to be my
    First Web Page</p><p>This will be the First Paragraph.</p><button type="button"
    onclick="document.write(335 + 6)">Click me</button></body></html>This is going
    to be my First Web PageThis will be the First Paragraph.Click meAnother method
    is the window alert method.<!DOCTYPE html><html><body><p>This is going to be my
    First Web Page</p><p>This will be the First Paragraph.</p><p id="demo1234"></p><script>window.alert
    (4567 + 36);</script></body></html>This is going to be my First Web PageThis will
    be the First Paragraph.The above-mentioned text will be seen on the browser. Each
    time you run the code, you will see the result of the mathematical calculation
    on an alert window on the top of the screen. The use of the window keyword is
    optional. As the window object in JavaScript is global, you may drop its use and
    still get the same result. The following code will deliver the same result.<!DOCTYPE
    html><html><body><p>This is going to be my First Web Page</p><p>This will be the
    First Paragraph.</p><p id="demo1234"></p><script>alert (4567 + 36);</script></body></html>Another
    method is the console.log() method. This method is used for debugging the code
    and then displaying the data.<!DOCTYPE html><html><body><p>This is going to be
    my First Web Page</p><p>This will be the First Paragraph.</p><p id="demo1234"></p><script>console.log
    (4567 + 36);</script></body></html>ValuesIn the world of computers, you will only
    see one thing that is data. You can read through the data, modify the data, and
    create new data. All this data is stored in the form of sequences that are fundamentally
    alike. Bits are two-valued things that are usually described as ones and zeros.
    If you rip open a computer, you will see that data takes multiple forms like low
    and high charge, weak or strong signal, or dull and shiny spots on a CD. A piece
    of discrete information may be reduced to a sequence of ones and zeros. As a result,
    they are represented as bits. You can express any number in the form of bits.
    The process is the same as that of the decimal number. However, instead of writing
    many digits, you only have two to produce the result.So, what are values? Just
    imagine an ocean of bits. A typical modern computer contains about 30 billion
    bits in the working memory. The working memory is also known as volatile data
    storage. The non-volatile storage that belongs to the hard disk or stands equivalent
    to that has a couple of orders of magnitude. If you want to continue working with
    these quantities of bits without mixing up and confusing things, you must separate
    them into tiny chunks known as values. It must be kept in mind that values are
    created with bits, yet these values play multiple roles.There is a type for each
    value that determines the role the value has to play. Some values are labeled
    as numbers, some as pieces of text, and some are known as functions. There is
    standard practice to create a value - you must invoke its name first. The practice
    is not only standard but also convenient. There is no need to collect the right
    building material for the values or right away pay for them. Call for one, and
    you will have one. This doesn’t mean that the values will be created out of thin
    air. Each value needs some place to store itself. So, if you are looking forward
    to creating a lot of them, you must think about the storage procedure. However,
    this is not a problem if you are looking forward to not creating them simultaneously.
    When you are not using a value, it will be discarded by the computer system.NumbersValues
    of the number are numeric values. In a JavaScript code, you will write it as follows:13You
    will use that inside a program, and it is going to bring bit patterns for the
    number in the memory of your computer. JavaScript will use a fixed number of bits,
    64 bits, for storing value for a single number. There are unlimited patterns that
    you may create with 64 bits. This means that the amount of different numbers that
    the system may represent is restricted. With the N decimal digits, you have the
    opportunity to represent the 10N numbers.The memory of the computer used to be
    a lot smaller, and people had to use certain groups of 8 and 16 bits in order
    to represent the numbers. It had been easy to overflow some small numbers to end
    up along with a number that could not fit inside some bits. Times have changed.
    Even the computers that fit into our pockets have immense space to save whatever
    you need.These bits store negative numbers, and one bit of them alludes to the
    sign of a single number. A bigger issue that you may witness is that non-whole
    numbers ought to be represented as well. In order to do this, you need to use
    some bits for storing the decimal point’s position.ArithmeticThe main point is
    that number is used in arithmetic. They are used in programming to perform arithmetic
    operations like addition and multiplications. The simple operations of multiplication
    and addition need at least two numbers to produce a third number. The + is the
    symbol for addition, while the * is the symbol for multiplication. Both symbols
    are known as operators. When you are programming, and you place an operator between
    two numbers, you start an arithmetic operation. You can use parenthesis to shuffle
    the order in which operators perform. For example, in normal circumstances, multiplications
    come first. But if you put an addition in parentheses, you change the order. Now
    the editor will run addition first.(500 + 100) * 500When operators appear without
    parenthesis, their application order is determined based on precedents.StringsAnother
    idea that you must learn by heart before delving into the ocean of JavaScript
    programming is the concept of strings. JavaScript strings represent text. You
    can write them by enclosing any piece of text that you want to convert into a
    string inside quotes. See the following examples.‘I am looking at the sinking
    sun.’“I am going to take a flight to Mars.”`The weather is balmy, as April has
    started.`You can use single quotes, double quotes, and backticks, as I have displayed
    in the above-mentioned examples. Putt each quote at the start or at the end of
    the strings so that the code editor recognizes the text as strings. You can literally
    put anything inside the quotes, and JavaScript will turn it into a string. However,
    a few characters of language are difficult to turn. You might have thought about
    how you will put quotes inside quotes. The first near-to-impossible thing to enclose
    inside strings is including a new line. Newlines appear when you press enter on
    the keyboard. You can do that without escaping when you use backticks.If you want
    to include unique characters to a string,  you can use a backslash (\). A backslash
    indicates that the character that precedes that is packed up with a special meaning.
    The process is known as escaping the character. If backlash precedes a quote,
    it will not end the string, but it will be included in the string. If you insert
    an ‘n’ character following the backslash, it will be interpreted in the form of
    a newline. If you put a ‘t’ after the backslash, it alludes to a tab character.
    See the example of the following string.“I will reach the moon\n And I will travel
    onwards to Mars.”What you will see on the web page will look like the following:I
    will reach the moonAnd I will travel onwards to Mars.You may come across a situation
    where you need a backslash inside a string just to be a backslash and not any
    special code. If two backslashes tend to follow each other, they will definitely
    collapse. Just one will be left in the value of the resulting string.You have
    to model strings in the form of a series of bits so that they can exist on the
    computer. The way JavaScript executes it depends on Unicode standards. These standards
    tend to assign a specific number to each character that you need, including the
    characters from Arabic, Greek, Armenian, and Japanese. If you have a number for
    each character, your string will be described by a specific sequence of numbers.
    That is how JavaScript executes the code. Still, you may face some kind of complication.
    The representation of JavaScript uses 16 bits per element of the string. Unicode
    defines much more characters than this. Some characters like emoji consume two
    character positions.One peculiar aspect of JavaScript strings is that you cannot
    divide them, subtract them, and multiply them. However, there is one operator
    that you can use on strings. You can use the + operator on JavaScript strings
    to concatenate them or, in simple words, combine them into a single whole. See
    the following example:“I” + “am” + “going” + “to” + “Mars” + “.”Strings values
    have several associated functions that you can use to perform different operations.
    The strings that you write with single or double quotes behave in the same manner.
    The only difference in both kinds of strings is the use of escape characters in
    strings. When you write something in ${}, the result will come as computed, then
    converted into a string, and then included at the same position.JavaScript ArraysJavaScript
    arrays can be identified with the help of square brackets. The items of arrays
    are filled up inside of square brackets and are separated by commas. See how we
    can declare arrays.<!DOCTYPE html><html><body><p>Learn JavaScript Arrays</p><p>The
    indices of JavaScript Arrays are zero-based. It means the first item in an array
    is [0].</p><p id="array-demo"></p><script>var carsArray = ["Volkswagen","Honda","Toyota",
    "Suzuki"];document.getElementById("array-demo").innerHTML = carsArray[0];</script></body></html>Learn
    JavaScript ArraysThe indices of JavaScript Arrays are zero-based. It means the
    first item in an array is [0].VolkswagenChapter Two: JavaScript VariablesLet us
    start with an example.'
