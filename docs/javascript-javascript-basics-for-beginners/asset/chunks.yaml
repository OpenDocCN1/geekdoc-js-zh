    \n这是 JavaScript `Array.indexOf()`\n接下来的程序将显示数组的索引。\n数组中 622 的位置是：5\n\n## lastIndexOf()\
    \ 方法\n\n`lastIndexOf()` 方法从数组末尾开始搜索值，然后返回该值的位置。如果项出现多次，它将显示最后一次的位置。\n\n```html\n\
