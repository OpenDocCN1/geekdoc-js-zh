    the button, you can sort the array in ascending order.</p><button onclick="FunctionT()">Click
    Me</button><p id="demo10"></p><script>var nums = [4000, 1000, 15, 555, 253, 102];document.getElementById("demo10").innerHTML
    = nums;function FunctionT() {nums.sort(function(x, y){return y - x});document.getElementById("demo10").innerHTML
    = nums;}</script></body></html>Learning JavaScript Array SortBy clicking the button,
    you can sort the array in ascending order.Click Me4000,1000,555,253,102,15If you
    get different results, try to click the button and see the results.Compare FunctionYou
    can use the compare function to get the desired results even when you are dealing
    with numbers. The purpose of this function is to define a specific alternative
    to the sort order. This compare function must return a zero, negative, or positive
    value based on what arguments you use. When you feed the sort() function with
    a couple of values, it dispatches the values to the compare function. After that,
    it sorts these values as per the returned values that are either negative, positive,
    or zero. If you see negative results, you will have x sorted out from y. If you
    see positive results, you will see y sorted before x. The figure zero suggests
    no change in the sorting order of the values.This function compares values in
    an array. When it compares 20 and 100, it will call the compare function, which
    will calculate the difference. If the result is negative, it will declare 20 as
    lower in value than 100\. You can use the code snippet to make experiments with
    alphabetic and numeric sorting.<!DOCTYPE html><html><body><p>Learning JavaScript
    Array Sort</p><p>You can use the click buttons to sort out the arrays either in
    alphabetical order or in numerical order.</p><button onclick="FunctionP()">Click
    Me to Sort Alphabetically</button><button onclick="FunctionQ()">Click Me to Sort
    Numerically</button><p id="demo1"></p><script>var nums = [4045, 1002, 1567, 5234,
    251, 100];document.getElementById("demo1").innerHTML = nums;function FunctionP()
    {nums.sort();document.getElementById("demo1").innerHTML = nums;}function FunctionQ()
    {nums.sort(function(x, y){return x - y});document.getElementById("demo1").innerHTML
    = nums;}</script></body></html>Learning JavaScript Array SortYou can use the click
    buttons to sort out the arrays either in alphabetical order or in numerical order.Click
    Me to Sort Alphabetically Click Me to Sort Numerically4045,1002,1567,5234,251,100The
    above result is the original one that is displayed when you run the code in the
    browser. Here is what happens when you click the button for alphabetic sorting.Learning
    JavaScript Array SortYou can use the click buttons to sort out the arrays either
    in alphabetical order or in numerical order.Click Me to Sort Alphabetically Click
    Me to Sort Numerically100,1002,1567,251,4045,5234See the results when you do numeric
    sorting.Learning JavaScript Array SortYou can use the click buttons to sort out
    the arrays either in alphabetical order or in numerical order.Click Me to Sort
    Alphabetically Click Me to Sort Numerically100,251,1002,1567,4045,5234Random SortingYou
    can use the random method to sort out arrays randomly. See the example to learn
    how to add the method to the code and get the desired results. By using the random
    method, you will have random sorting of the numbers. I cannot show all the sorted
    results here because I get a different result in the browser each time I click
    the button. You can use the code and see different results by clicking the button
    multiple times. See the following example.<!DOCTYPE html><html><body><p>Learning
    JavaScript Array Sort</p><p>By clicking the button, you can sort the array in
    ascending order.</p><button onclick="FunctionT()">Click Me</button><p id="demo10"></p><script>var
    nums = [4000, 1000, 15, 555, 253, 102];document.getElementById("demo10").innerHTML
    = nums;function FunctionT() {nums.sort(function(x, y){return 0.5 - Math.random()});document.getElementById("demo10").innerHTML
    = nums;}</script></body></html>Learning JavaScript Array SortBy clicking the button,
    you can sort the array in ascending order.Click Me15,253,1000,555,102,4000The
    problem with the random method is that it favors some numbers over others. There
    is another method that is more correct and useful than this one. It is commonly
    known as the Fisher-Yates shuffle. The method was introduced in data science in
    the early days of data science.<!DOCTYPE html><html><body><p>JavaScript Array
    Sort Goes On</p><h3>This is Fisher-Yates Method</h3><p>When you click the button
    repeatedly, you will sort the array in random order.</p><button onclick="FunctionXX()">Click
    Me</button><p id="demo12"></p><script>var nums = [404, 10023, 123, 589, 2511,
    102];document.getElementById("demo12").innerHTML = nums;function FunctionXX()
    {var a, b, c ;for (a = nums.length -1; a > 0; a--) {b = Math.floor(Math.random()
    * a)c = nums[a]nums[a] = nums[b]nums[b] = c}document.getElementById("demo12").innerHTML
    = nums;}</script></body></html>JavaScript Array Sort Goes OnThis is Fisher-Yates
    MethodWhen you click the button repeatedly, you will sort the array in random
    order.Click Me404,10023,123,589,2511,102Array ValuesJavaScript does not have any
    built-in functions to find out the highest or the lowest value in arrays. However,
    when you have stored one array, you may use the index for getting the highest
    and the lowest values.<!DOCTYPE html><html><body><p>JavaScript Array Sorting Method</p><p>You
    are seeing the lowest number which is <span id="demo4"></span>.</p><script>var
    nums = [4099999, 124100, 12, 5444, 2544444, 102343];nums.sort(function(x, y){return
    x-y});document.getElementById("demo4").innerHTML = nums[0];</script></body></html>JavaScript
    Array Sorting MethodYou are seeing the lowest number which is 12.The same code
    can be used to fish out the highest number. I will reverse the pattern and hunt
    down the highest number in the list. Here is the pattern.<!DOCTYPE html><html><body><p>JavaScript
    Array Sorting Method</p><p>You are seeing the lowest number which is <span id="demo4"></span>.</p><script>var
    nums = [4099999, 124100, 12, 5444, 2544444, 102343];nums.sort(function(x, y){return
    y - x});document.getElementById("demo4").innerHTML = nums[0];</script></body></html>JavaScript
    Array Sorting MethodYou are seeing the lowest number which is 4099999.This method
    to find out the highest and the lowest values in an array is the dumbest method.
    It also is inefficient as well. If you want to be more precise and accurate, you
    can use the Math.max() method and reach the most accurate number without sifting
    through an entire array and returning the answer afterward.<!DOCTYPE html><html><body><p>JavaScript
    Array Sorting through Max method</p><p>Here is the highest number in the array:
    <span id="demo7"></span>.</p><script>var nums = [4087787878, 1002333333333, 112,
    5, 2544, 11220];document.getElementById("demo7").innerHTML = ArrayMaxPoint(nums);function
    ArrayMaxPoint(arr) {return Math.max.apply(null, arr);}</script></body></html>JavaScript
    Array Sorting through Max MethodHere is the highest number in the array: 1002333333333.Now
    I will use the same method to find out the lowest value in the array. See the
    following example.<!DOCTYPE html><html><body><p>JavaScript Array Sorting through
    Max method</p><p>Here is the highest number in the array: <span id="demo7"></span>.</p><script>var
    nums = [4087787878, 1002333333333, 112, 5, 2544, 11220];document.getElementById("demo7").innerHTML
    = ArrayMaxPoint(nums);function ArrayMaxPoint(arr) {return Math.min.apply(null,
    arr);}</script></body></html>JavaScript Array Sorting through Max MethodHere is
    the highest number in the array: 5.Here is another solution that is considered
    the fastest way to detect the highest numbers in an array. In this method, a function
    enters a loop and iterates through the array to compare every single value of
    the array with the top value that it detects at the first stage. When it has looped
    through all the values, it produces the result.<!DOCTYPE html><html><body><p>JavaScript
    Array Sorting for highest value</p><p>Here is the highest number in the array:
    <span id="demo7"></span>.</p><script>var nums = [4077879878, 10023, 147777777777,
    53, 25, 1023];document.getElementById("demo7").innerHTML = ArrayMaxPoint(nums);function
    ArrayMaxPoint(arr) {var length = arr.length;var maximum = -Infinity;while (length--)
    {if (arr[length] > maximum) {maximum = arr[length];}}return maximum;}</script></body></html>JavaScript
    Array Sorting for Highest ValueHere is the highest number in the array: 147777777777.Similarly,
    you can create a function that will loop through the entire array to detect first
    the lowest value and then compare it with the rest of the values of the array.
    Finally, it will produce the result in the browser. See how the minimum function
    works and loops through the array.<!DOCTYPE html><html><body><p>JavaScript Array
    Sorting for highest value</p><p>Here is the highest number in the array: <span
    id="demo7"></span>.</p><script>var nums = [4077879878, 10023, 147777777777, 53,
    25, 1023];document.getElementById("demo7").innerHTML = ArrayMinPoint(nums);function
    ArrayMinPoint(arr) {var length = arr.length;var minimum = Infinity;while (length--)
    {if (arr[length] < minimum) {minimum = arr[length];}}return minimum;}</script></body></html>JavaScript
    Array Sorting for Highest ValueHere is the highest number in the array: 25.Object
    Array SortingIf you have an array with objects, you can sort them with the following
    method.<!DOCTYPE html><html><body><p>JavaScript Array Sorting Objects</p><p>Please
    click the buttons to sort out the objects of the car.</p><button onclick="FunctionO()">Please
    Click Me to Sort</button><p id="demo2"></p><script>var carsObjects = [{type:"Honda",
    year:2020, Make:"Japan", Model:"Vezel"},{type:"Toyota", year:2010, Make:"Japan",
    Model:"Fortuner"},{type:"Toyota", year:2018, Make:"Japan", Model:"Vitz"}];ToDisplayCars();function
    FunctionO() {carsObjects.sort(function(x, y){return x.year - y.year});ToDisplayCars();}function
    ToDisplayCars() {document.getElementById("demo2").innerHTML =carsObjects[0].type
    + " " + carsObjects[0].year + " " + carsObjects[0].Make + " " + carsObjects[0].Model
    + "<br>" +carsObjects[1].type + " " + carsObjects[1].year + " " + carsObjects[0].Make
    + " " + carsObjects[0].Model + "<br>" +carsObjects[2].type + " " + carsObjects[2].year
    + " " + carsObjects[0].Make + " " + carsObjects[0].Model;}</script></body></html>JavaScript
    Array Sorting ObjectsPlease click the buttons to sort out the objects of the car.Please
    Click Me to SortToyota 2010 Japan FortunerToyota 2018 Japan FortunerHonda 2020
    Japan FortunerI have already sorted it by clicking the sorting button. You may
    see a different order when you run the code first in the browser. The order will
    only change when hit the sorting button.JavaScript IterationThere is more in JavaScript
    arrays that you can learn and apply when you are creating web pages. The forEach()
    method helps you make a function call for all the elements of the array.<!DOCTYPE
    html><html><body><p>This is JavaScript Array.forEach()</p><p>This method makes
    a function call at least once for all individual array elements.</p><p id="demo44"></p><script>var
    msg = "";var nums = [4588888, 2234, 12349, 16899, 900025];nums.forEach(FunctionE);document.getElementById("demo44").innerHTML
    = msg;function FunctionE(Evalue, Eindex, Earray) {msg = msg + Evalue + "<br>";}</script></body></html>This
    is JavaScript Array.forEach()This method makes a function call at least once for
    all individual array elements.4588888'
