    # JavaScript Break and Continue Statements


    The `break` and `continue` statements are inherently related to `for` and `while`
    loops. The `break` statement allows you to jump out of the loop and the `continue`
    statement to make a jump over one specific iteration inside the loop. The later
    statement does not break the loop. The program continues to move on. I have already
    explained the `break` statement when I discussed the `switch` statement in the
    previous chapters. However, there its use was different as it was applied to the
    `switch` statements. Now I will use the `break` statement in the loops.


    ```html

    <!DOCTYPE html>

    <html><body><p>Learning JavaScript Loops</p>

    <p>I will integrate a `break` statement to the for loop.</p>

    <p id="demo9"></p>

    <script>

    var msg = "";

    var YY;

    for (YY = 0; YY < 10; YY++) {

    if (YY === 5) { break; }

    msg += "The next digit is " + YY + "<br>";

    }

    document.getElementById("demo9").innerHTML = msg;

    </script></body>

    </html>

    ```


