    ### 死循环

    当你创建一个循环且它没有终点时，它被称为死循环。循环会一直持续，直到计算机或浏览器崩溃崩溃。死循环可能是意外发生的，也可能是由于明显的疏忽。死循环是很糟糕的，它们会降低网页速度，导致访客离开。如果你不在代码中插入一个在完成预期迭代后停止循环的条件，就会创建一个死循环。


    ### JavaScript while 循环

    只要特定条件成立，JavaScript 循环就会执行代码。现在你已经学习了 for 循环，我将继续解释 while 循环是如何工作的。while 循环在某些条件成立时进行迭代。我将创建一个在条件成立时运行
    while 循环的示例。


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>学习 JavaScript While Loops</p>

    <p id="demo7"></p>

    <script>

    var msg = "";

    var YY = 0;

    while (YY < 10) {

    msg += "<br>The next digit is " + YY;

    YY++;

    }

    document.getElementById("demo7").innerHTML = msg;

    </script>

    </body>

    </html>

    ```


