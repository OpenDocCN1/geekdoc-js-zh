    这些是 JavaScript 变量。在下面的示例中，`a`、`b` 和 `c` 是 JavaScript 变量。`c` 的值是：66


    由于这是第一个示例，你需要很好理解它。首先，该行区分了 JavaScript 的后端代码和前端。你可以说它区分了你在代码编辑器中编写的内容和你在网页上看到的内容。`h1`
    和 `p` 标题在书中的显示可能与在网页上显示时不同。这是因为我正在使用的文字处理器对 `h1` 和 `p` 有特定的设置。如果你将代码复制并粘贴到编辑器并在网页上运行它，它们将正常工作。此外，这就是我在本书的其余部分将编写嵌入
    HTML 结构中的代码的方式，因为当你在创建网站时也是这样写的。你需要通过 HTML 嵌入来编写 JavaScript 脚本，以便让浏览器读取。在上述的示例中，你可以看到每个变量都有对应的变量来持有。


    与其创建一个单个字母变量，现在我将创建具有完整单词名称的变量。


