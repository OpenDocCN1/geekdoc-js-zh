    如果你非常在意索引的顺序，你应该放弃在数组循环中使用 `for...in` 的念头。该顺序独立于实现方式。你无法按照预期的顺序来访问数组的值。当你认为顺序特殊时，使用
    `for of` 循环、`for` 循环和 `Array.forEach()` 对你来说很重要且更好。


    ### forEach() 循环

    该方法为数组的每个元素调用一次函数，也称为回调函数。


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>学习 JavaScript Array.forEach() 循环</p>

    <p>此程序将为数组的每个元素调用一次函数。</p>

    <p id="demo5"></p>

    <script>

    var msg = "";

    var nums = [55545, 454, 1239, 78816, 45625];

    nums.forEach(FunctionYZ);

    document.getElementById("demo5").innerHTML = msg;

    function FunctionYZ(fvalue, findex, farray) {

    msg = msg + fvalue + "<br>";

    }

    </script>

    </body>

    </html>

    ```


    学习 JavaScript Array.forEach() 循环

    此程序将为数组的每个元素调用一次函数。

    55545, 454, 1239, 78816, 45625


    上述代码中的函数通常接受三个参数。第一个参数是项目的值。第二个参数是项目的索引，第三个参数是数组本身。由于示例中只使用了值参数，你可以按照以下模式重写。


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>学习 JavaScript Array.forEach() 循环</p>

    <p>此程序将为数组的每个元素调用一次函数。</p>

    <p id="demo5"></p>

    <script>

    var msg = "";

    var nums = [55545, 454, 1239, 78816, 45625];

    nums.forEach(FunctionYZ);

    document.getElementById("demo5").innerHTML = msg;

    function FunctionYZ(fvalue) {

    msg = msg + fvalue + "<br>";

    }

    </script>

    </body>

    </html>

    ```


    学习 JavaScript Array.forEach() 循环

    此程序将为数组的每个元素调用一次函数。

    55545, 454, 1239, 78816, 45625

    我排除了 `fvalue` 之外的所有其他参数，仍然得到了相同的结果。


    ### for/of 循环

    JavaScript 中还有另一种类型的 for 循环，称为 `for/of` 语句。该语句遍历可以迭代的特定对象的值。该语句允许你创建通过 `Maps`、`Arrays`、`NodeLists`
    和 `Strings` 等各种数据结构进行循环。


    当迭代开始时，下一个属性的值会自动赋值给变量。JavaScript 中的变量使用 `var`、`const` 和 `let` 关键字声明。我们已经在之前的章节中涵盖了所有主题。目前
    Safari 7、Chrome 38、Opera 25、Edge 12 和 Firefox 51 是唯一支持 `for/of` 语句的浏览器。Internet
    Explorer 不支持它。


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>这些是 JavaScript For/Of 循环</p>

    <p>for/of 语句将创建一个遍历你可以迭代的对象的所有值的循环。</p>

    <p id="demo6"></p>

    <script>

    let carsforsale = ["Volkswagen", "Vezel", "Ford", "Fortuner", "Sportage"];

    let msg = "";

    for (let YY of carsforsale) {

    msg += YY + "<br>";

    }

    document.getElementById("demo6").innerHTML = msg;

    </script>

    </body>

    </html>

    ```


    这些是 JavaScript For/Of 循环

