    You should drop the idea of using `for in` over the array loops if you are keen
    on the order of the index. The order is independent of implementation. You cannot
    access values of the array in the order that you expect. It is important and better
    for you to use a `for of` loop, `for loop`, and the `Array.forEach()` whenever
    you think the order is special.


    ### The forEach() Loop

    This method calls a function, also known as the callback function, one time for
    each element of the array.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>Learning JavaScript Array.forEach() loops</p>

    <p>This program will call a function one time for each element of the array.</p>

    <p id="demo5"></p>

    <script>

    var msg = "";

    var nums = [55545, 454, 1239, 78816, 45625];

    nums.forEach(FunctionYZ);

    document.getElementById("demo5").innerHTML = msg;

    function FunctionYZ(fvalue, findex, farray) {

    msg = msg + fvalue + "<br>";

    }

    </script>

    </body>

    </html>

    ```


    Learning JavaScript Array.forEach() loops

    This program will call a function one time for each element of the array.

    55545, 454, 1239, 78816, 45625


    The function in the above-mentioned code usually takes in three arguments. The
    first argument is the value of the item. The second argument is the index of the
    item, and the third argument is the array itself. As the example uses only the
    value parameter, you can rewrite it in the following pattern.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>Learning JavaScript Array.forEach() loops</p>

    <p>This program will call a function one time for each element of the array.</p>

    <p id="demo5"></p>

    <script>

    var msg = "";

    var nums = [55545, 454, 1239, 78816, 45625];

    nums.forEach(FunctionYZ);

    document.getElementById("demo5").innerHTML = msg;

    function FunctionYZ(fvalue) {

    msg = msg + fvalue + "<br>";

    }

    </script>

    </body>

    </html>

    ```


    Learning JavaScript Array.forEach() loops

    This program will call a function one time for each element of the array.

    55545, 454, 1239, 78816, 45625

    I have excluded all the other parameters except `fvalue` and still got the same
    result.


    ### The for/of Loop

    There is another type of for loops in JavaScript, known as the `for/of` statement.
    This statement loops through the values of a particular object that can be iterated.
    This statement allows you to create a loop through all kinds of data structures
    like `Maps`, `Arrays`, `NodeLists`, and `Strings`.


    When an iteration starts, the value of the next property is automatically assigned
    to a variable. Variables in JavaScript are declared with `var`, `const` and `let`
    keywords. We have already covered all the topics in the past chapters. Safari
    7, Chrome 38, Opera 25, Edge 12, and Firefox 51 are the only browsers that presently
    support the `for/of` statements. Internet Explorer does not support it.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>These are JavaScript For/Of Loop</p>

    <p>The for/of statement will create a loop through all the values of objects that
    you can iterate through.</p>

    <p id="demo6"></p>

    <script>

    let carsforsale = ["Volkswagen", "Vezel", "Ford", "Fortuner", "Sportage"];

    let msg = "";

    for (let YY of carsforsale) {

    msg += YY + "<br>";

    }

    document.getElementById("demo6").innerHTML = msg;

    </script>

    </body>

    </html>

    ```


    These are JavaScript For/Of Loop

    The `for/of` statement will create a loop through all the values of objects that
    you can iterate through.

    Volkswagen, Vezel, Ford, Fortuner, Sportage


    In the next example, I will use a string instead of an array to get the same result.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>These are JavaScript For/Of Loop</p>

    <p>The for/of statement will create a loop through all the values of objects that
    you can iterate through.</p>

    <p id="demo6"></p>

    <script>

    let carsforsale = "Volkswagen, Vezel, Ford";

    let msg = "";

    for (let YY of carsforsale) {

    msg += YY + "<br>";

    }

    document.getElementById("demo6").innerHTML = msg;

    </script>

    </body>

    </html>

    ```


    These are JavaScript For/Of Loop

    The `for/of` statement will create a loop through all the values of objects that
    you can iterate through.

    Volkswagen, Vezel, Ford


    ### Eternal Loops

    When you create a loop, and it doesn’t have an ending point, it is called an eternal
    loop. A loop keeps on going until the computer or browser crashes in a condition.
    Eternal loops may happen by accident or by blatant carelessness. Eternal loops
    are bad, and they have the tendency to slow down the web page, driving away the
    visitors. You may create an eternal loop if you fail to insert a condition in
    the code that makes the loop to stop after completing the intended iterations.


    ### JavaScript while Loops

    JavaScript loops execute codes as long as specific conditions stay true. Now that
    you have learned about the for loops, I will go on to explain how the while loops
    work. The while loops iterate as long as certain conditions stay true. I will
    create an example in which the while loop runs as long as the condition stands
    true.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>Learning JavaScript While Loops</p>

    <p id="demo7"></p>

    <script>

    var msg = "";

    var YY = 0;

    while (YY < 10) {

    msg += "<br>The next digit is " + YY;

    YY++;

    }

    document.getElementById("demo7").innerHTML = msg;

    </script>

    </body>

    </html>

    ```


    Learning JavaScript While Loops

    The next digit is 0

    The next digit is 1

    The next digit is 2

    The next digit is 3

    The next digit is 4

