    demo00\"></p><script>var veggies = [\"Garlic\", \"Tomatoes\", \"Potatoes\", \"\
    Tomatoes\", \"Pumpkin\"];var a = veggies.lastIndexOf(\"Tomatoes\");document.getElementById(\"\
    demo00\").innerHTML = \"Tomatoes are found at position \" + (a);</script></body></html>\n\
