    ## JavaScript Switch Statement

    You can use the `switch` statement to perform different actions on JavaScript
    conditions. It will help you work on a single code block and execute it as well.
    The editor evaluates it once, runs a comparison among values, and in case of a
    match, it executes the block. In case of a mismatch, there will be no execution.
    The following program will run the `switch` statement through the program and
    comb your computer to see what day is on your computer calendar and what message
    the same day contains in the code. It will run the code through all seven days
    of the week, and when it reaches a match, it will run the message that you have
    already connected to the same day. See the following code.


    ```html

    <!DOCTYPE html>

    <html><body>

    <p id="switch-demo"></p>

    <script>

    var weekdays;

    switch (new Date().getDay()) {

    case 0:weekdays = "the restful Sunday";break;

    case 1:weekdays = "the blue blue Monday" ;break;

    case 2:weekdays = "the superstitious Tuesday";break;

    case 3:weekdays = "the hectic Wednesday";break;

    case 4:weekdays = "the overwhelming Thursday";break;

    case 5:weekdays = "the joyful Friday";break;

    case  6:weekdays = "the sleepy Saturday";}document.getElementById("switch-demo").innerHTML
    = "Today is " + weekdays + "." + Have a great productive day!";</script>

    </body>

    </html>

    ```

    Today is the superstitious Tuesday. Have a great productive day!


    In the above code, you might have noticed the addition of `break` keyword. When
    the code reaches the `break` keyword, it jumps out of the specific switch block.
    Jumping out of the switch block puts a stopper on the execution of the switch
    block. You do not necessarily insert the `break` keyword in the last case of the
    switch block. it will end anyway. If you exclude the `break` keyword from the
    switch block, the web browser will execute the immediate next case if there is
    a mismatch in the values. So, be ready for an error if you skip the `break` keyword.
    There is another keyword that you may add to the switch statement. It runs the
    code even if there is a mismatch.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var weekdays;

    switch (new Date().getDay()) {

    case 0:weekdays = "the restful Sunday";break;

    case 1:weekdays = "the blue blue Monday";break;

    case 3:weekdays = "the hectic Wednesday";break;

    case 4:weekdays = "the overwhelming Thursday";break;

    case 5:weekdays = "the joyful Friday";break;

    case 6:weekdays = "the sleepy Saturday";break;

    default:weekdays = "I am desperately waiting for the weekend because I have planned
    vacation.";}document.getElementById("switch-demo").innerHTML = weekdays;</script>

    </body>

    </html>

    ```

    I am desperately waiting for the weekend because I have planned vacation. You
    might be thinking that the `default` case can only be put in the last of the code.
    However, this is not true. You can insert it anywhere in the code, even at the
    start of the code. It will work well.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var weekdays;

    switch (new Date().getDay()) {

    default:weekdays = "I am desperately waiting for the weekend because I have planned
    vacation.";break;

    case 0:weekdays = "the restful Sunday";break;

    case 1:weekdays = "the blue blue Monday";break;

    case 3:weekdays = "the hectic Wednesday";break;

    case 4:weekdays = "the overwhelming Thursday";break;

    case 5:weekdays = "the joyful Friday";break;

    case 6:weekdays = "the sleepy Saturday";}}document.getElementById("switch-demo").innerHTML
    = weekdays;</script>

    </body>

    </html>

    ```

    I am desperately waiting for the weekend because I have planned vacation.


    ## Chapter Five: JavaScript Strings and Arrays

    I have already explained what strings are and how you can use them in your scripts.
    There are some methods that you can use when you are working with strings. Some
    primitive values cannot have methods or properties because they are not objects.
    However, JavaScript allows primitive values to have properties and methods because
    it treats primitive values like objects when executing properties and methods.
    You can learn the `length` of a string you are using in a program.


    ```html

    <!DOCTYPE html>

    <html><body>

    <p>Learning Properties of JavaScript Strings</p>

    <p>This String property will answer the question about the length of your string:</p>

    <p id="string-demo"></p>

    <script>var msgX = "I am about to leave for New York to start my own business.";var
    msgY = msgX.length;document.getElementById("string-demo").innerHTML = msgY;</script>

    </body>

    </html>

    ```

    This String property will answer the question about the length of your string.


    Another JavaScript method helps you hunt down a string within a string. The method
    I will use here is called `indexOf()`. If you have specified a string inside another
    string, you will have it found for you. An important note to remember is that
    you can create another string inside a string using single quotes. The following
    example will explain the procedure to do that.


    ```html

    <!DOCTYPE html>

    <html><body>

    <p>Learning Properties of JavaScript Strings</p>

    <p>This String property will answer the question about the inner string of your
    string:</p>

    <p id="string-demo"></p>

    <script>var msgX = "I am about to leave for ''New York'' to start my own business.";var
    msgY = msgX.indexOf("New York");document.getElementById("string-demo").innerHTML
    = msgY;</script>

    </body>

    </html>

    ```

    This String property will answer the question about the length of your string.
    You can see the index of the inner string has been displayed on the screen. Please
    remember that JavaScript counts the index number from point zero.


    ### The `lastIndexOf()` Method

    You can use the `lastIndexOf()` method to see the index of final occurring of
    `New York`, which is our specified inner string.


    ```html

    <!DOCTYPE html>

    <html><body>

    <p>Learning Properties of JavaScript Strings</p>

    <p>This String property will answer the question about the inner string of your
    string:</p>

    <p id="string-demo"></p>

    <script>var msgX = "I am about to leave for ''New York'' to start my own business.";var
    msgY = msgX.lastIndexOf("New York");document.getElementById("string-demo").innerHTML
    = msgY;</script>

    </body>

    </html>

    ```

    This String property will answer the question about the inner string of your string.


    ### What If the Index Is Not Found?

    If the methods fail to find the index, they will return `-1`. This may happen
    if you write the wrong spelling or a completely different word in the code.


    ```html

    <!DOCTYPE html>

    <html><body>

    <p>Learning Properties of JavaScript Strings</p>

    <p>This String property will answer the question about the inner string of your
    string:</p>

    <p id="string-demo"></p>

    <script>var msgX = "I am about to leave for ''New York'' to start my own business.";var
    msgY = msgX.lastIndexOf("Washington");document.getElementById("string-demo").innerHTML
    = msgY;</script>

    </body>

    </html>

    ```

    This String property will answer the question about the inner string of your string.


    ### The `search()` Method

    There is another method to locate the specified inner string in a long string.
    You can use the `search()` method for hunting it down if the match is perfect.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var msgX = "I am about to leave for ''New York'' to start my own business.";

    var msgY = msgX.search("New York");document.getElementById("string-demo").innerHTML
    = msgY;

    </script>

    </body>

    </html>

    ```

    This String property will answer the question about the inner string of your string.


    ### Parts Extraction

    You can break up a string into many parts as the needs of your program. JavaScript
    gives us three methods to break up a string. The first method is labeled as `slice()`
    method. It extracts one part of your string and displays the same in the form
    of a new string. You need to execute two parameters; one is the starting position
    of the string, and the other is the ending position.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var msgX = "I am about to leave for ''New York'' to start my own business.";

    var msgY = msgX.slice(23, 34);document.getElementById("string-demo").innerHTML
    = msgY;</script>

    </body>

    </html>

    ```

    This String property will answer the question about the inner string of your string.
    Please keep in mind that JavaScript counts the index from the `0` point. If one
    parameter turns out to be negative, you have to count it from the string''s ending
    point. It will slice the string backward. You can try it out and get the result.
    I will skip it for now and test what happens if you forget to insert the ending
    point.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var msgX = "I am about to leave for ''New York'' to start my own business.";

    var msgY = msgX.slice(23);document.getElementById("string-demo").innerHTML = msgY;</script>

    </body>

    </html>

    ```

    This String property will answer the question about the inner string of your string.
    You can see that it has displayed the rest of the text to the end. If the starting
    point is negative and the ending point is missing, you will see the results being
    counted from the end to the slicing point.


    The second method to cut the string and make a substring is the `substring()`
    method. This is as simple as the `slice` method is. Where it differs is its unacceptance
    of negative indices. See the following example to understand its use.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var msgX = "I am about to leave for ''New York'' to start my own business.";

    var msgY = msgX.substring(23, 34);document.getElementById("string-demo").innerHTML
    = msgY;</script>

    </body>

    </html>

    ```

    This String property will answer the question about the inner string of your string.


    The third and last slicing method is the `substr()` method, which is quite similar
    to `slice()`. The second parameter defines the length of the rest of the sliced
    string.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var msgX = "I am about to leave for ''New York'' to start my own business.";

    var msgY = msgX.substr(23, 34);document.getElementById("string-demo").innerHTML
    = msgY;</script>

    </body>

    </html>

    ```

    This String property will answer the question about the inner string of your string.


    ### The `replace()` Method

    JavaScript gets interesting when it allows you to replace values inside of a string.
    For example, the string I have included in my examples contains New York as the
    city that I will be visiting. JavaScript allows you to change the name of the
    city instead of writing a new code and creating a new string. This saves a lot
    of your time when you are creating lengthy programs. The method can be identified
    as `replace()`.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var msgX = "I am about to leave for ''New York'' to start my own business.";

    var msgY = msgX.replace(''New York'', ''Las Vegas'');document.getElementById("string-demo").innerHTML
    = msgY;</script>

    </body>

    </html>

    ```

    I am about to leave for ''Las Vegas'' to start my own business. By default, JavaScript
    `replace()` will not work if you write `NEW YORK` instead of `New York`. It is
    case sensitive, and it identifies a different case as a different word. Therefore,
    if you find out the method is not working, better check out the case of the words.
    Also, `replace()` method only replaces the first match. If there is more than
    one New York in the string, it will only replace the first match and leave out
    the rest of the words. If you want to use capital case despite the warning, you
    have to use a regular expression such as `/i` with the word to enable the browser
    to recognize the match. The regular expression will make the word insensitive.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var msgX = "I am about to leave for ''New York'' to start my own business.";

    var msgY = msgX.replace(/NEW YORK/i, ''Las Vegas'');document.getElementById("string-demo").innerHTML
    = msgY;</script>

    </body>

    </html>

    ```

    I am about to leave for ''Las Vegas'' to start my own business. Let us see what
    the code will look like if you miss out the regular expression and still use the
    capital case in the code.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var msgX = "I am about to leave for ''New York'' to start my own business.";

    var msgY = msgX.replace(''NEW YORK'', ''Las Vegas'');document.getElementById("string-demo").innerHTML
    = msgY;</script>

    </body>

    </html>

    ```

    I am about to leave for ''Las Vegas'' to start my own business. You can see that
    the code does not work anymore. I have already explained that if you have to replace
    more than one word, you cannot do that by the replace method. It just does not
    work. However, there is a solution to the problem. If you have more than one words
    that must be replaced with another word, you need to use regular expression again.
    This time the regular expression is labeled as `/g`.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var msgX = "The Coach of the NBA team will visit Las Vegas.";

    var msgY = msgX.replace(/Las Vegas/g, ''Los Angeles'');document.getElementById("string-demo").innerHTML
    = msgY;</script>

    </body>

    </html>

    ```

    I am about to leave for ''Las Vegas'' to start my own business.


    ### The Concatenation

    Concatenation is an integral part of almost all programming languages. Whenever
    there is a need to pair up two or more strings, programmers seek support from
    concatenation. It is the easiest method to join two more strings. The `concat()`
    method works smoothly if you have written the lines of code well. The most important
    things to care about are the placement of commas and whitespaces. The `concat()`
    method is used in place of the `+` operator. There is no difference in the function—the
    two work as alternatives only. The following exercise will help you sail through
    the process of concatenation.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var msg1 = "I have been promoted as Chief Executive Officer of Skyfall.";

    var msg2 = "I will call a board meeting next week!";

    var msg3 = msg1.concat(" ", msg2);document.getElementById("string-demo").innerHTML
    = msg3;</script>

    </body>

    </html>

    ```

    I have been promoted as Chief Executive Officer of Skyfall. I will call a board
    meeting next week!


    ### String Arrays

    Strings are amazing, and they can help you in your programming ventures a great
    deal. Like variables, JavaScript Arrays, too, are containers of values. However,
    they deviate from the properties of variables in the sense that they can hold
    more data than a variable in one name. So whenever you need to load up data in
    the same name, you should use arrays. There is more than one way to set up an
    array. The easiest of them is to use the array literal method, then write the
    name of the arrays, and give values inside square brackets. The equal sign must
    follow the name.


    You can access the items of the arrays by using the index number. As already mentioned,
    the index for the array starts at number `0`. In the following example, I will
    access the element that has the zero index.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var carsforsale = new Array("Honda", "Toyota", "GTX", "Ford");

    document.getElementById("array-demo").innerHTML = carsforsale[0];</script>

    </body>

    </html>

    ```

    Honda, Toyota, GTX, Ford.


    Index numbers are helpful in the sense that they can aid in changing the values
    of the elements of the array. You can replace almost all elements of the array
    just by mentioning the index numbers.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var carsforsale = new Array("Honda", "Toyota", "GTX", "Ford");

    carsforsale[0] = "BMW";carsforsale[1] = "Mitsubishi";document.getElementById("string-demo").innerHTML
    = carsforsale;</script>

    </body>

    </html>

    ```

    Honda, Toyota, GTX, Ford.


    It has the same result as the previous example. There is another method to create
    an array. This is called the JavaScript keyword `new`. I will create an array
    by using the keyword `new` in the example given below.


    ```html

    <!DOCTYPE html>

    <html><body>

    <script>

    var carsforsale = new Array("Honda", "Toyota", "GTX", "Ford");

    document.getElementById("array-demo").innerHTML = carsforsale;</script>

    </body>

    </html>

    ```

    Honda, Toyota, GTX, Ford.


    Let us analyze this new format and understand what is different in this. The first
    difference is the addition of the keyword `new` to the start of the array and
    right after the equal sign, followed by the keyword `Array` immediately next to
    the keyword New. Another prominent difference is the removal of square brackets
    and the addition of parentheses, but both methods work the same way. The second
    method is more complicated and extended. For the sake of simplicity, speed, and
    readability, you should opt for the first method that also is known as the array
    literal method.


