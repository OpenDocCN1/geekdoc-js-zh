    is JavaScript FunctionMy global function will return the product of different
    arguments. If you invoke FunctionXXX, you are actually invoking window.FunctionXXX.
    Both are the same. (x , y):1068The practice of invoking is common but it is not
    considered good. Methods, global variables, and functions may land you in naming
    conflicts and bugs in a global object.In JavaScript, if you see the this keyword,
    you should understand that it is an object that is the owner of the current code.
    When you use it in a function, the value of this is the object which owns the
    function. This is not actually a variable but a keyword. You cannot change its
    value.Global ObjectsWhen the owner object is lacking in function invocation, the
    value of this turns into a global object. Inside of a web browser, the window
    of the browser acts as a global object.<!DOCTYPE html><html><body><p>In HTML programming
    language, the value of <b>this</b> is the window object.</p><p id="demo777"></p><script>var
    Y = FunctionDD();function FunctionDD() {return this;}document.getElementById("demo777").innerHTML
    = Y;</script></body></html>In HTML programming language, the value of this  is
    the window object.[object Window]Function as MethodIn the world of JavaScript,
    you can define certain functions in the form of object methods.<!DOCTYPE html><html><body><p>Working
    on JavaScript Functions</p><p>thisObject.Namef() will return Mac Millan:</p><p
    id="demo234"></p><script>var thisObject = {Namef:"Mac",Namel: "Millan",completeName:
    function() {return this.Namef + " " + this.Namel;}}document.getElementById("demo234").innerHTML
    = thisObject.completeName();</script></body></html>Working on JavaScript FunctionsthisObject.Namef()
    will return Mac Millan:Mac MillanThe completeName is a function that belong to
    an object named as thisObject. This object owns the function. In the example,
    the value of this is thisObject. You can check it out.<!DOCTYPE html><html><body><p>Working
    on JavaScript Functions</p><p>thisObject.Namef() will return Mac Millan:</p><p
    id="demo234"></p><script>var thisObject = {Namef:"Mac",Namel: "Millan",completeName:
    function() {return this;}}document.getElementById("demo234").innerHTML = thisObject.completeName();</script></body></html>Working
    on JavaScript FunctionsthisObject.Namef() will return Mac Millan:[object Object]Function
    Constructor()You can invoke a function by using a function constructor().<!DOCTYPE
    html><html><body><p>Function constructor:</p><p id="demo234"></p><script>function
    FunctionT(argument1, argument2) {this.Namef = argument1;this.Namel  = argument2;}var
    Y = new FunctionT("Mac","Millan")document.getElementById("demo234").innerHTML
    = Y.Namef;</script></body></html>Function constructor:MacReusing MethodsWith the
    help of the call() method, you may use a method to apply to different types of
    objects. In JavaScript, all functions are methods of objects. If a function is
    not, it belongs to a global object.<!DOCTYPE html><html><body><p>Working on JavaScript
    Functions</p><p>thisObject.Namef() will return Mac Millan:</p><p id="demo234"></p><script>var
    thisObject = {Namef:"Mac",Namel: "Millan",completeName: function() {return this.Namef
    + " " + this.Namel;}}Y = thisObject.completeName();document.getElementById("demo234").innerHTML
    = thisObject.completeName(); Y</script></body></html>Working on JavaScript FunctionsthisObject.Namef()
    will return Mac Millan:Mac MillanThe call() MethodThe call() method in JavaScript
    is like a predefined method that you can use to invoke a method. You can use a
    method that another object owns.<!DOCTYPE html><html><body><p>The following example
    will call the fullName method of a person by using it on another person:</p><p
    id="demo90"></p><script>var man = {completeName: function() {return this.Namef
    + " " + this.Namel;}}var man1 = {Namef:"Christiano",Namel: "Ronaldo"}var man2
    = {Namef:"Lionel",Namel: "Messi"}var Y = man.completeName.call(man1);document.getElementById("demo90").innerHTML
    = Y;</script></body></html>The following example will call the fullName method
    of a person by using it on another person:Christiano RonaldoNow I will call the
    completeName method and use it on man2.<!DOCTYPE html><html><body><p>The following
    example will call the fullName method of a person by using it on another person:</p><p
    id="demo90"></p><script>var man = {completeName: function() {return this.Namef
    + " " + this.Namel;}}var man1 = {Namef:"Christiano",Namel: "Ronaldo"}var man2
    = {Namef:"Lionel",Namel: "Messi"}var Y = man.completeName.call(man2);document.getElementById("demo90").innerHTML
    = Y;</script></body></html>The following example will call the fullName method
    of a person by using it on another person:Lionel MessiAdding ArgumentsThe call()
    method is flexible enough to include many arguments to the function to make it
    more interactive and useful. Now that we have a function that has two men. We
    can add more arguments to the functions to share more details about the two men
    so that we can display the details on a web page. Suppose you are building a website
    for soccer stars. You have to add data about the players to the database so that
    your visitors may see and read it, and stay longer on your website. Function’s
    call() method can help you a great deal in this venture. I will create an example
    and add arguments to the same to see how many arguments we can add and how we
    can add them.<!DOCTYPE html><html><body><p>The following example will call the
    fullName method of a person by using it on another person:</p><p id="demo90"></p><script>var
    man = {completeName: function(profession, economicalstatus) {return this.Namef
    + " " + this.Namel + " , " + profession + " , " + economicalstatus;}}var man1
    = {Namef:"Christiano",Namel: "Ronaldo"}var man2 = {Namef:"Lionel",Namel: "Messi"}var
    Y = man.completeName.call(man2, "soccer star", "extremely rich");document.getElementById("demo90").innerHTML
    = Y;</script></body></html>The following example will call the fullName method
    of a person by using it on another person:Lionel Messi , soccer star , extremely
    richYou apply the same arguments to the another person.<!DOCTYPE html><html><body><p>The
    following example will call the fullName method of a person by using it on another
    person:</p><p id="demo90"></p><script>var man = {completeName: function(profession,
    economicalstatus) {return this.Namef + " " + this.Namel + " , " + profession +
    " , " + economicalstatus;}}var man1 = {Namef:"Christiano",Namel: "Ronaldo"}var
    man2 = {Namef:"Lionel",Namel: "Messi"}var man3 = {Namef:"Bill",Namel: "Gates"}var
    man4 = {Namef:"Elon",Namel: "Musk"}var Y = man.completeName.call(man4, "Businessperson",
    "World''s Richest Person");document.getElementById("demo90").innerHTML = Y;</script></body></html>The
    following example will call the fullName method of a person by using it on another
    person:Elon Musk , Businessperson , World''s Richest PersonChapter Eight: JavaScript
    ObjectsThe objects in JavaScript have curly braces around them. You have to write
    the properties of objects in the form of name:value pairs. You may separate them
    with commas. Objects are treated as emperors in the world of JavaScript. If you
    have a thorough concept of objects, you can understand JavaScript well.<!DOCTYPE
    html><html><body><p>Learning JavaScript Objects</p><p id="objects-demo"></p><script>var
    car = {Name : "BMW",Make  : "Germany",model     : 2020,Color  : "silver"};document.getElementById("objects-demo").innerHTML
    =car.Name + " is made in " + car.Make + "." + " The model no is " + car.model
    + " and the color is " + car.Color + ".";</script></body></html>Learning JavaScript
    ObjectsBMW is made in Germany. The model no is 2020, and the color is silver.The
    object that I created in the above-mentioned example has multiple properties.
    I have given it a name, the model no, the color, and the make. This is how you
    can add more properties in line with the demands of the object you create.Almost
    everything in JavaScript can be objects. Booleans may be objects if you define
    them with a new keyword. Similarly, numbers may be objects when you define them
    with the same new keyword. Strings may also be objects when paired up with the
    new keyword. Math and dates are objects as well. Arrays and regular expressions
    are objects. Functions also are objects. Except for primitives, everything in
    JavaScript is an object.Objects may be filled up with variables. An object in
    JavaScript is a collection of values that are named. These named values are known
    as properties. You saw their applications in the chapter on functions. You can
    perform certain actions named as methods on different objects. These properties
    may be primitive, like objects and functions. An object method contains the definition
    of a function, and you can create and define an object in JavaScript. You can
    use a number of methods to do that. You can achieve this purpose to create an
    object, namely literal. The keyword new is used for the creation. Object literal
    is considered the easiest way to create an object in JavaScript. By using the
    object literal, you can do that using one statement only.<!DOCTYPE html><html><body><p>JavaScript
    Objects</p><p id="demo90"></p><script>var man1 = { Namef:"Christiano", Namel:
    "Ronaldo", profession: "soccer star", economicalstatus: "rich"};document.getElementById("demo90").innerHTML
    =man1.Namef + " is the biggest " + man1.profession + " across the world. He is
    a " + man1.economicalstatus + " person.";</script></body></html>JavaScript ObjectsChristiano
    is the biggest soccer star across the world. He is a rich person.The lines and
    spacing are of no importance when it comes to creating objects in JavaScript.
    You can use more than one line to create the object and the result will be the
    same. See the same example of object creation in another form.<!DOCTYPE html><html><body><p>JavaScript
    Objects</p><p id="demo90"></p><script>var man1 = {Namef:"Christiano",Namel: "Ronaldo",profession:
    "soccer star",economicalstatus: "rich"};document.getElementById("demo90").innerHTML
    =man1.Namef + "is the biggest " + man1.profession + " aross the world. He is a
    " + man1.economicalstatus + " person.";</script></body></html>I will write the
    results here because they are going to be the same. This method is neat and efficient
    in writing a clean code. If you get used to writing clean code like this, you
    will find it easy to read it once you get back to the editor to read or change
    the code.The new KeywordThe new keyword in the world of JavaScript is the most
    important. It has many properties, and you can use it in multiple ways. See its
    use in the same example and feel the difference, not in the result but only in
    the code.<!DOCTYPE html><html><body><p>JavaScript Objects</p><p id="demo90"></p><script>var
    man1 = new Object();man1.Namef="Christiano";man1.Namel = "Ronaldo";man1.profession
    = "soccer star";man1.economicalstatus = "rich";document.getElementById("demo90").innerHTML
    =man1.Namef + " is the biggest " + man1.profession + " across the world. He is
    a " + man1.economicalstatus + " person.";</script></body></html>JavaScript ObjectsChristiano
    is the biggest soccer star across the world. He is a rich person.You can see that
    the only difference is that I had to add more words and symbols and delete some
    old ones as well. I removed the curly braces, added the equal sign instead of
    a colon. I had to remove the commas and add semicolons in its place. Whatever
    the changes you observe, I recommend that you use the literal method for the sake
    of ease of use. The new keyword only makes the code more complicated without having
    any effect on the results.You can mute JavaScript objects at will. You must address
    an object by a reference and not by a value. If you have built an object by a
    person''s attributes, you cannot create a copy by simple methods.Object PropertiesJavaScript
    Properties are the most important parts of objects. Each object has a value named
    as a property. Each object is built on a set of unordered properties. You can
    change them, add more to them or delete them. However, some of them are read-only.When
    you have created an object, you can build a loop through the same to iterate through
    all the items of the object. See the following example for reference.<!DOCTYPE
    html><html><body><p>JavaScript Object Properties</p><p id="demo555"></p><script>var
    msg = "";var man1 = {namef:"Lionel", namel:"Messi", agem:33};var Y;for (Y in man1)
    {msg += man1[Y] + " ";}document.getElementById("demo555").innerHTML = msg;</script></body></html>JavaScript
    Object PropertiesLionel Messi 33Adding new property to an existing object is never
    difficult. You can add a new property by simply giving it a value. I will use
    the same object that I have already created. I will add a new property to show
    the nationality of the person that is created as an object. See the following
    example.<!DOCTYPE html><html><body><p>JavaScript Objects</p><p id="demo90"></p><script>var
    man1 = {Namef:"Christiano",Namel: "Ronaldo",profession: "soccer star",economicalstatus:
    "rich"};man1.nationality = "Portuguese"document.getElementById("demo90").innerHTML
    =man1.Namef + " is the biggest " + man1.profession + " across the world. He is
    from " + man1.nationality + ".";</script></body></html>JavaScript ObjectsChristiano
    is the biggest soccer star across the world. He is from Portuguese.The DeletionJust
    as the addition of properties is simple and fun, the deletion is also easy and
    fun to do. The keyword used is ‘delete.’ By using the keyword, JavaScript deletes
    a property from the object. You should be careful when you are using the delete
    keyword. It deletes the value as well as the property in one go and you cannot
    use the property after you have deleted it. This is unlike other programming languages.
    This operator is only applicable on objects and will have no effect on functions
    and variables. This operator is ineffective on the predefined object properties
    of JavaScript, and your web application may crash if you do that. This is not
    good for the reputation of your website and business.<!DOCTYPE html><html><body><p>JavaScript
    Objects</p><p id="demo90"></p><script>var man1 = {Namef:"Christiano",Namel: "Ronaldo",profession:
    "soccer star",economicalstatus: "rich"};delete man1.nationalitydocument.getElementById("demo90").innerHTML
    =man1.Namef + " is the biggest " + man1.profession + " across the world. He is
    from " + man1.nationality + ".";</script></body></html>JavaScript ObjectsChristiano
    is the biggest soccer star across the world. He is from undefined.You can see
    that JavaScript deleted the property even before I could use it in the program.
    The word undefined shows that the value of the property is no more.DatesThe javaScript
    date feature is interesting to learn. When you are creating a new website, you
    need the date feature to integrate into your web page so that your visitors can
    see. It is also helpful in regulating the shipping time and other details. By
    default, the output of the date feature in JavaScript is displayed as per the
    browser''s time zone. The display is in the form of a complete text string. You
    can create different objects to include in the display of the date. The objects
    may be year, month, hours, seconds, and milliseconds. You can add more information
    as your need. You can use the new Date() method to create a new data object to
    display the browser''s current date and time.<!DOCTYPE html><html><body><p>Learning
    JavaScript new Dates()</p><p>The new Date() method will create for you a new date
    object that has the current date and time:</p><p id="demo678"></p><script>var
    Y = new Date();document.getElementById("demo678").innerHTML = Y;</script></body></html>JavaScript
    ClassesJavaScript is also known as a prototype-based language. Every object in
    this language keeps a hidden and internal property known as [[Prototype]]. You
    can use it to extend the methods and properties of the objects you create in the
    language. You can use the keyword class for the creation of a class. Another important
    method to add to your class is the constructor() method. Just as we added properties
    to objects, we can add properties to classes. A class itself is not an object
    but a template to create objects and work with them on web browsers.<!DOCTYPE
    html><html><body><p>This is the JavaScript Class</p><p>I will show you how to
    create and use the JavaScript Class on your website.</p><p id="demo777"></p><p
    id="demo778"></p><p id="demo779"></p><script>class LuxCars {constructor(cname,
    cyear, cmake, cmodel, ccolor) {this.cname = cname;this.cyear = cyear;this.cmake
    = cmake;this.cmodel = cmodel;this.ccolor = ccolor;}}Car1 = new LuxCars("Ford",
    2020, "USA", "Mustang", "Blue");document.getElementById("demo777").innerHTML =Car1.cname
    + " " + Car1.cyear + " " + Car1.cmake + " " + Car1.cmodel + " " + Car1.ccolor;Car2
    = new LuxCars("BMW", 2010, "Germany", "K45", "Silver");document.getElementById("demo778").innerHTML
    =Car2.cname + " " + Car2.cyear + " " + Car2.cmake + " " + Car2.cmodel + " " +
    Car2.ccolor;Car3 = new LuxCars("Mercedes", 2021, "Germany", "S-Class", "Black");document.getElementById("demo779").innerHTML
    =Car3.cname + " " + Car3.cyear + " " + Car3.cmake + " " + Car3.cmodel + " " +
    Car3.ccolor;</script></body></html>This is the JavaScript ClassI will show you
    how to create and use the JavaScript Class on your website.Ford 2020 USA Mustang
    BlueBMW 2010 Germany K45 SilverMercedes 2021 Germany S-Class BlackI have created
    three different objects by using the same LuxCars class. Classes offer the easiest
    methods to create and deploy objects to work. This program can be helpful to you
    if you are running a car showroom and you need a website to reach out to customers.
    One single class allows you to create unlimited objects of different cars. Once
    you create the class, all you need is to fill it up with the properties and display
    them on your website. When a new object comes into being, the constructor method
    is called upon and run automatically. This method is special. You must write the
    clear spelling ‘constructor.’ When you create a new object in a class, the method
    executes automatically, saving your time. This method starts the properties of
    objects.Class MethodsThe procedure to write and execute class methods is the same
    as writing and creating an object. You have to use the class keyword and the constructor()
    method when you are adding a new method to the class. The total number of methods
    that you can add does not have an upper cap. You can add any number at will. Let
    us add a new method to declare the age of the car. JavaScript calculates the age
    of the car by using the current date as a reference. For example, if a car is
    produced in 2020, the program will display the age as 1 year old because the current
    year is 2021.<!DOCTYPE html><html><body><p>This is the JavaScript Class</p><p>I
    will show you how to create and use the JavaScript Class on your website.</p><p
    id="demo777"></p><p id="demo778"></p><p id="demo779"></p><script>class LuxCars
    {constructor(cname, cyear, cmake, cmodel, ccolor) {this.cname = cname ;this.cyear
    = cyear;this.cmake = cmake;this.cmodel = cmodel;this.ccolor = ccolor;}carAge()
    {let cdate = new Date();return cdate.getFullYear() - this.cyear;}}let Car1 = new
    LuxCars("Ford", 2017, "USA", "Mustang", "Blue");document.getElementById("demo777").innerHTML
    =Car1.cname + " " + Car1.cyear + " " + Car1.cmake + " " + Car1.cmodel + " " +
    Car1.ccolor + " : " + "This car is " + Car1.carAge() + " years old.";let Car2
    = new LuxCars("BMW", 2010, "Germany", "K45", "Silver");document.getElementById("demo778").innerHTML
    =Car2.cname + " " + Car2.cyear + " " + Car2.cmake + " " + Car2.cmodel + " " +
    Car2.ccolor  + " : " + "This car is " + Car2.carAge() + " years old.";let Car3
    = new LuxCars("Mercedes", 2021, "Germany", "S-Class", "Black");document.getElementById("demo779").innerHTML
    =Car3.cname + " " + Car3.cyear + " " + Car3.cmake + " " + Car3.cmodel + " " +
    Car3.ccolor  + " : " + "This car is " + Car3.carAge() + " years old.";</script></body></html>This
    is the JavaScript ClassI will show you how to create and use the JavaScript Class
    on your website.Ford 2017 USA Mustang Blue : This car is 4 years old.BMW 2010
    Germany K45 Silver : This car is 11 years old.Mercedes 2021 Germany S-Class Black
    : This car is 0 years old.Passing ParametersYou can send off parameters to your
    JavaScript classes. I will pass the age and year parameters to JavaScript class.
    See the following example.<!DOCTYPE html><html><body><p>This is the JavaScript
    Class</p><p>I will show you how to create and use the JavaScript Class on your
    website.</p><p id="demo777"></p><p id="demo778"></p><script>class LuxCars {constructor(cname,
    cyear, cmake, cmodel, ccolor) {this.cname = cname ;this.cyear = cyear;this.cmake
    = cmake;this.cmodel = cmodel;this.ccolor = ccolor;}carAge(Y) {return Y - this.cyear;}}let
    cdate = new Date();let cyear = cdate.getFullYear();let Car1 = new LuxCars("Ford",
    2017, "USA", "Mustang", "Blue");document.getElementById("demo777").innerHTML =Car1.cname
    + " " + Car1.cyear + " " + Car1.cmake + " " + Car1.cmodel + " " + Car1.ccolor
    + " : " + "This car is " + Car1.carAge(cyear) + " years old.";let Car2 = new LuxCars("BMW",
    2010, "Germany", "K45", "Silver");document.getElementById("demo778").innerHTML
    =Car2.cname + " " + Car2.cyear + " " + Car2.cmake + " " + Car2.cmodel + " " +
    Car2.ccolor  + " : " + "This car is " + Car2.carAge(cyear) + " years old.";</script></body></html>This
    is the JavaScript ClassI will show you how to create and use the JavaScript Class
    on your website.Ford 2017 USA Mustang Blue : This car is 4 years old.BMW 2010
    Germany K45 Silver : This car is 11 years old.Class InheritanceIf you want to
    create a class inheritance, you have to add the extends keyword to the class.
    The extends keyword transfers all the methods to the inherited class.<!DOCTYPE
    html><html><body><p>This is the JavaScript Class</p><p>I will show you how to
    create and use the JavaScript Class on your website.</p><p id="demo777"></p><p
    id="demo778"></p><script>class LuxCars {constructor(cname, cyear, cmake, cmodel,
    ccolor) {this.cname = cname;this.cyear = cyear;this.cmake = cmake ;this.cmodel
    = cmodel;this.ccolor = ccolor;}present() {return ''We have a '' + this.cname +
    '' for sale'';}}class Ecar extends LuxCars {constructor(battery, model) {super(battery);this.cmodel
    = model;}show() {return this.present() + ''. It is a '' + this.cmodel + '' model.'';}}let
    Car2 = new Ecar("Tesla", 2010);document.getElementById("demo778").innerHTML =
    Car2.show()</script></body></html>This is the JavaScript ClassI will show you
    how to create and use the JavaScript Class on your website.We have a Tesla for
    sale. It is a 2010 model.The super() method in the above code refers to the parent
    class. When you call this method in the constructor method, you get access to
    the parent class''s properties and methods. The sole purpose of inheritance is
    that it keeps you from writing the same code repeatedly. You can write a class
    once and use its methods and properties by creating child classes. Whenever you
    create a new class, there is no need to write from the start. It saves time and
    space.Getters SettersWith classes, you can adjust getters and setters in the browser.
    Getters and setters are useful for the properties if you need to do something
    special with the returning values. You can use the get and set keywords to add
    them to your classes.<!DOCTYPE html><html><body><p>This is the JavaScript Class</p><p>I
    will show you how to create and use the JavaScript Class on your website.</p><p
    id="demo777"></p><p id="demo778"></p><script>class LuxCars {constructor(carname,
    caryear, carmake, carmodel, carcolor) {this.cname = carname ;this.cyear = caryear;this.cmake
    = carmake;this.cmodel = carmodel;this.ccolor = carcolor;}get namec() {return this.cname;}set
    namec(Y) {this.cname = Y;}}let Car2 = new LuxCars("Tesla");document.getElementById("demo778").innerHTML
    = Car2.namec;</script></body></html>This is the JavaScript ClassI will show you
    how to create and use the JavaScript Class on your website.TeslaConclusionNow
    that you have reached the end of the book, the next step is to practice more and
    be a master of JavaScript. I hope you have not only read all the theory and code,
    but you have also used the code to load web pages and display information. I deliberately
    enclosed all the code in HTML tags so that you may feel it easy to use it and
    practice the same.The best method is to note down the code during revisions and
    practice them whenever you have time. Practice is the only way you can master
    this scripted language. Memorizing the code and then using it in a web browser
    are the best ways to learn JavaScript.ReferencesBrand, A. W. (2013). PHP, MySQL,
    JavaScript & HTML 5 .  [https://khmerbamboo.files.wordpress.com/2014/09/php-mysql-javascript-html5-all-in-one-for-dummies.pdf](https://khmerbamboo.files.wordpress.com/2014/09/php-mysql-javascript-html5-all-in-one-for-dummies.pdf)Haverbeke,
    M. (2018). Eloquent JavaScript . PDF Drive  [https://www.pdfdrive.com/eloquent-javascript-a-modern-introduction-to-programming-d158409266.html](https://www.pdfdrive.com/eloquent-javascript-a-modern-introduction-to-programming-d158409266.html)Https://www.digitalocean.com/community/tutorials/understanding-classes-in-javascript.
    (2020, February 12). The advantages and disadvantages of JavaScript . freeCodeCamp.org. [https://www.freecodecamp.org/news/the-advantages-and-disadvantages-of-javascript/](https://www.freecodecamp.org/news/the-advantages-and-disadvantages-of-javascript/)JavaScript
    class inheritance . (n.d.). W3Schools Online Web Tutorials. [https://www.w3schools.com/js/js_class_inheritance.asp](https://www.w3schools.com/js/js_class_inheritance.asp)JavaScript
    output . (n.d.). W3Schools Online Web Tutorials. [https://www.w3schools.com/js/js_output.asp](https://www.w3schools.com/js/js_output.asp)Patrick, J.
    (n.d.). JAVASCRIPT A Beginner’s Guide to Learning the Basics of JavaScript Programming
    . PDF Drive - Search and download PDF files for free. [https://www.pdfdrive.com/javascript-a-beginners-guide-to-learning-the-basics-of-javascript-programming-d186477670.html](https://www.pdfdrive.com/javascript-a-beginners-guide-to-learning-the-basics-of-javascript-programming-d186477670.html)'
