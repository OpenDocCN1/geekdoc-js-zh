    ### JavaScript 标识符


    JavaScript 变量需要赋予唯一的名称，以便于识别识别。这些唯一名称被称为标识符。标识符可以是像 `a`、`b`、`c` 这样的短名称，也可以是像 `totalprice`、`milkprice`
    和 `oilprice` 这样的长描述性名称。JavaScript 变量有一些命名规则。你可以使用这些规则来减少错误概率。


    *   变量中不能包含数字、字母、美元符号和下划线（注：原文此处可能有误，通常应为“可以包含”）。

    *   变量可以以 `$` 符号开头。

    *   变量是区分大小写，这使得 ‘a’ 和 ‘A’ 变量是不同的。

    *   变量必须以字母开头。

    *   你不能使用 JavaScript 关键字作为变量。


