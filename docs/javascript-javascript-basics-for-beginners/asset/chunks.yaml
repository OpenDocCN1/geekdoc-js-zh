    你可以通过编写 `var`（variable 的缩写）来创建一个变量。后面跟着你需要赋值给变量的名称。当你创建一个变量时，它会赋予一个特定的值。变量的名字可以是你喜欢的任何名称。听起来是什么样由你决定。变量的值可能会改变。变量的情况可能会改变。


    JavaScript 变量可以简单地定义为以数据形式存储值的容器。在下面的示例中，我将使用三个变量：`a`、`b` 和 `c`，并为它们填充不同的值。


