    out of the switch block puts a stopper on the execution of the switch block. You
    do not necessarily insert the break keyword in the last case of the switch block.
    Include it or not; it will end anyway. If you exclude the break keyword from the
    switch block, the web browser will execute the immediate next case even if there
    is a mismatch in the values. So, be ready for an error if you skip the break keyword.There
    is another keyword that you may add to the switch statement. It runs the code
    even if there is a mismatch.<!DOCTYPE html><html><body><p id="switch-demo"></p><script>var
    weekdays;switch (new Date().getDay()) {case 0:weekdays = "it is the restful Sunday";break;case
    1:weekdays = "it is the blue blue Monday";break;case 3:weekdays = "it is the hectic
    Wednesday";break;case 4:weekdays = "it is the overwhelming Thursday";break;case
    5:weekdays = "it is the joyful Friday" ;break;case  6:weekdays = "it is the sleepy
    Saturday";break;default:weekdays = "I am desperately waiting for the weekend because
    I have planned a vacation.";}document.getElementById("switch-demo").innerHTML
    = weekdays</script></body></html>I am desperately waiting for the weekend because
    I have planned a vacation.You might be thinking that the default case can only
    be put in the last of the code. However, this is not true. You can insert it anywhere
    in the code, even at the start of the code. It will work well.<!DOCTYPE html><html><body><p
    id="switch-demo"></p><script>var weekdays;switch (new Date().getDay()) {default
    :weekdays = "I am desperately waiting for the weekend because I have planned a
    vacation.";break;case 0:weekdays = "it is the restful Sunday";break;case 1:weekdays
    = "it is the blue blue Monday";break;case 3:weekdays = "it is the hectic Wednesday";break;case
    4:weekdays = "it is the overwhelming Thursday";break;case 5:weekdays = "it is
    the joyful Friday";break;case 6:weekdays = "it is the sleepy Saturday";}document.getElementById("switch-demo").innerHTML
    = weekdays</script></body></html>I am desperately waiting for the weekend because
    I have planned a vacation.Chapter Five: JavaScript Strings and ArraysI have already
    explained what strings are and how you can use them in your scripts. There are
    some methods that you can use when you are working with strings. Some primitive
    values cannot have methods or properties because they are not objects. However,
    JavaScript allows primitive values to have properties and methods because it treats
    primitive values like objects when executing properties and methods. You can learn
    the length of a string you are using in a program.<!DOCTYPE html><html><body><p>Learning
    Properties of JavaScript Strings</p><p>This String property will answer the question
    about the length of your string:</p><p id="string-demo"></p><script>var msgX =
    "I am about to leave for New York to start my own business.";var msgY = msgX.length;document.getElementById("string-demo").innerHTML
    = msgY;</script></body></html>Learning Properties of JavaScript StringsThis String
    property will answer the question about the length of your string:58Another JavaScript
    method helps you hunt down a string within a string. The method I will use here
    is called indexOf(). If you have specified a string inside another string, you
    will have it found out for you. An important note to remember is that you can
    create another string inside a string by using single quotes. The following example
    will explain the procedure to do that.<!DOCTYPE html><html><body><p>Learning Properties
    of JavaScript Strings</p><p>This String property will answer the question about
    the inner string of your string:</p><p id="string-demo"></p><script>var msgX =
    "I am about to leave for ''New York'' to start my own business.";var msgY = msgX.indexOf("New
    York");document.getElementById("string-demo").innerHTML = msgY;</script></body></html>This
    String property will answer the question about the length of your string:25You
    can see the index of the inner string has been displayed on the screen. Please
    remember that JavaScript counts the index number from point zero.The lastIndexOf()
    MethodYou can use the lastIndexOf() method to see the index of final occurring
    of New York, which is our specified inner string.<!DOCTYPE html><html><body><p>Learning
    Properties of JavaScript Strings</p><p>This String property will answer the question
    about the inner string of your string:</p><p id="string-demo"></p><script>var
    msgX = "I am about to leave for ''New York'' to start my own business.";var msgY
    = msgX.lastIndexOf("New York");document.getElementById("string-demo").innerHTML
    = msgY;</script></body></html>This String property will answer the question about
    the inner string of your string:25What If the Index Is Not Found?If the methods
    fail to find the index, they will return -1\. This may happen if you write the
    wrong spelling or a completely different word in the code.<!DOCTYPE html><html><body><p>Learning
    Properties of JavaScript Strings</p><p>This String property will answer the question
    about the inner string of your string:</p><p id="string-demo"></p><script>var
    msgX = "I am about to leave for ''New York'' to start my own business.";var msgY
    = msgX.lastIndexOf("Washington");document.getElementById("string-demo").innerHTML
    = msgY;</script></body></html>This String property will answer the question about
    the inner string of your string:-1The search() MethodThere is another method to
    locate the specified inner string in a long string. You can use the search() method
    for hunting it down if the match is perfect.<!DOCTYPE html><html><body><p>Learning
    Properties of JavaScript Strings</p><p>This String property will answer the question
    about the inner string of your string:</p><p id="string-demo"></p><script>var
    msgX = "I am about to leave for ''New York'' to start my own business.";var msgY
    = msgX.search("New York");document.getElementById("string-demo").innerHTML = msgY;</script></body></html>This
    String property will answer the question about the inner string of your string:25If
    you notice the results of the two methods, namely search() and indexOf(), you
    will realize they are the same. They accept the same arguments and then respond
    with the same values. However, technically, the two methods are different a great
    deal. The search() method cannot take in a second starting position argument,
    while the indexOf() method cannot take in powerful search values.Parts ExtractionYou
    can break up a string into many parts as per the needs of your program. JavaScript
    gives us three methods to break up a string. The first method is labeled as the
    slice() method. It extracts one part of your string and displays the same in the
    form of a new string. You need to execute two parameters; one is the starting
    position of the string, and the other is the ending position of the string. See
    how you can do that.<!DOCTYPE html><html><body><p>Learning Properties of JavaScript
    Strings</p><p>This String property will answer the question about the inner string
    of your string:</p><p id="string-demo"></p><script>var msgX = "I am about to leave
    for ''New York'' to start my own business.";var msgY = msgX.slice(23, 34);document.getElementById("string-demo").innerHTML
    = msgY;</script></body></html>This String property will answer the question about
    the inner string of your string:''New York''Please keep in mind that JavaScript
    counts the index from the 0 point. If one parameter turns out to be negative,
    you have to count it from the string''s ending point. It will slice the string
    backward. You can try it out and get the result. I will skip it for now and test
    what happens if you forget to insert the ending point.<!DOCTYPE html><html><body><p>Learning
    Properties of JavaScript Strings</p><p>This String property will answer the question
    about the inner string of your string:</p><p id="string-demo"></p><script>var
    msgX = "I am about to leave for ''New York'' to start my own business.";var msgY
    = msgX.slice(23);document.getElementById("string-demo").innerHTML = msgY;</script></body></html>This
    String property will answer the question about the inner string of your string:''New
    York'' to start my own business.You can see that it has displayed the rest of
    the text to the end. If the starting point is negative and the ending point is
    missing, you will see the results being counted from the end to the slicing point.The
    second method to cut the string and make a substring is the substring() method.
    This is as simple as the slice method is. Where it differs is its unacceptance
    of negative indices. See the following example to understand its use.<!DOCTYPE
    html><html><body><p>Learning Properties of JavaScript Strings</p><p>This String
    property will answer the question about the inner string of your string:</p><p
    id="string-demo"></p><script>var msgX = "I am about to leave for ''New York''
    to start my own business.";var msgY = msgX.substring(23, 34);document.getElementById("string-demo").innerHTML
    = msgY;</script></body></html>This String property will answer the question about
    the inner string of your string:''New York''The third and last slicing method
    is the substr() method, which is quite similar to slice(). The second parameter
    defines the length of the rest of the sliced string.<!DOCTYPE html><html><body><p>Learning
    Properties of JavaScript Strings</p><p>This String property will answer the question
    about the inner string of your string:</p><p id="string-demo"></p><script>var
    msgX = "I am about to leave for ''New York'' to start my own business.";var msgY
    = msgX.substr(23, 34);document.getElementById("string-demo").innerHTML = msgY;</script></body></html>This
    String property will answer the question about the inner string of your string:''New
    York'' to start my own businessJavaScript gets interesting when it allows you
    to replace values inside of a string. For example, the string I have included
    in my examples contains New York as the city that I will be visiting. JavaScript
    allows you to change the name of the city instead of writing a new code and creating
    a new string. This saves a lot of your time when you are creating lengthy programs.
    The method can be identified as replace().<!DOCTYPE html><html><body><p>Learning
    Properties of JavaScript Strings</p><p id="string-demo"></p><script>var msgX =
    "I am about to leave for ''New York'' to start my own business.";var msgY = msgX.replace(''New
    York'', ''Las Vegas'');document.getElementById("string-demo").innerHTML = msgY;</script></body></html>Learning
    Properties of JavaScript StringsI am about to leave for ''Las Vegas'' to start
    my own business.By default, JavaScript replace() will not work if you write NEW
    YORK instead of New York. It is case sensitive, and it identifies a different
    case as a different word. Therefore, if you find out that the method is not working,
    better check out the case of the words. Also, the replace() method only replaces
    the first match. If there is more than one New York in the string, it will only
    replace the first match and leave out the rest of the words intact. If you want
    to use capital case despite the warning, you have to use a regular expression
    such as /i with the word to enable the browser to recognize the match. The regular
    expression will make the word insensitive. See how you should write it in the
    editor.<!DOCTYPE html><html><body><p>Learning Properties of JavaScript Strings</p><p
    id="string-demo"></p><script>var msgX = "I am about to leave for ''New York''
    to start my own business.";var msgY = msgX.replace(/NEW YORK/i, ''Las Vegas'');document.getElementById("string-demo").innerHTML
    = msgY;</script></body></html>Learning Properties of JavaScript StringsI am about
    to leave for ''Las Vegas'' to start my own business.Let us see what the code will
    look like if you miss out on the regular expression and still use the capital
    case in the code.<!DOCTYPE html><html><body><p>Learning Properties of JavaScript
    Strings</p><p id="string-demo"></p><script>var msgX = "I am about to leave for
    ''New York'' to start my own business.";var msgY = msgX.replace(''NEW YORK'',
    ''Las Vegas'');document.getElementById("string-demo").innerHTML = msgY;</script></body></html>Learning
    Properties of JavaScript StringsI am about to leave for ''New York'' to start
    my own business.You can see that the code does not work anymore.Go GlobalI have
    already explained that if you have to replace more than one word, you cannot do
    that by the replace method. It just does not work. However, there is a solution
    to the problem. If you have more than one words that must be replaced with another
    word, you need to use a regular expression again. This time the regular expression
    is labeled as /g. The method of including the expression is the same as that of
    /i. However, I will write a new string and include the expression so that you
    can understand it well.<!DOCTYPE html><html><body><p>Learning Properties of JavaScript
    Strings</p><p id="string-demo"></p><script>var msgX = "The Coach of the NBA team
    will visit Las Vegas. Las Vegas has a huge fan base for NBA stars.";var msgY =
    msgX.replace(/Las Vegas/g, ''Los Angeles'');document.getElementById("string-demo").innerHTML
    = msgY;</script></body></html>Learning Properties of JavaScript StringsThe Coach
    of the NBA team will visit Los Angeles. Los Angeles has a huge fan base for NBA
    stars.There are some additional methods to tune up strings as well. You can convert
    a string into upper and lower cases by simple methods.<!DOCTYPE html><html><body><p>I
    am converting strings into upper and lower cases:</p><button onclick="FunctionX()">You
    need to Hit me</button><p id="string-demo">JavaScript makes your webpages interactive
    and user-friendly!</p><script>function FunctionX() {var msg = document.getElementById("string-demo").innerHTML;document.getElementById("string-demo").innerHTML
    = msg.toUpperCase();}</script></body></html>I am converting strings into upper
    and lower cases:You need to Hit meJavaScript makes your webpages interactive and
    user-friendly!The above result is displayed when you run the code. Now I will
    click the button I have just created. You will see the results in the upper case.
    I will only display the results.I am converting strings into upper and lower cases:You
    need to Hit meJAVASCRIPT MAKES YOUR WEBPAGES INTERACTIVE AND USER-FRIENDLY!You
    can use the other method toLowerCase() to convert the text into lower case. Just
    replace toUpperCase() with toLowerCase().The ConcatenationConcatenation is an
    integral part of almost all programming languages. Whenever there is a need to
    pair up two or more strings, programmers seek support from concatenation. It is
    the easiest method to join two more strings. The concat() method works smoothly
    if you have written the lines of code well. The most important things to care
    about are the placement of commas and whitespaces. The concat() method is used
    in place of the plus operator. There is no difference in the function—the two
    work as alternatives only. The following exercise will help you sail through the
    process of concatenation.<!DOCTYPE html><html><body><p>Learnig JavaScript Strings</p><p
    id="string-demo"></p><script>var msg1 = "I have been promoted as Chief Executive
    Officer of Skyfall.";var msg2 = "I will call a board meeting next week.!";var
    msg3 = msg1.concat(" ", msg2);document.getElementById("string-demo").innerHTML
    = msg3;</script></body></html>Learning JavaScript StringsI have been promoted
    as Chief Executive Officer of Skyfall. I will call a board meeting next week.!Almost
    all string methods have a habit of creating a new string, keeping the original
    string intact. They make a copy first and introduce the changes you suggest to
    the editor. Programmers say that strings can only be replaced. They cannot change.Each
    day there have been efforts by programmers to introduce some new things to programming
    languages. The ECMAScript 2017 introduced more methods to JavaScript strings.
    The methods padStart and padEnd are now being used at the start and end of JavaScript
    strings.String ArraysThe heading may appear a bit confusing. There is no such
    thing as string arrays. However, there is a new method that turns a string into
    an array.<!DOCTYPE html><html><body><p>Please click "Click me" to produce the
    first array element.</p><button onclick="FunctionX()">Click This Button</button><p
    id="string-demo"></p><script>function FunctionX() {var msg1 = "Texas, Las Vegas,
    Los Angeles.";var msg2 = msg1.split(",") ;document.getElementById("string-demo").innerHTML
    = msg2[0];}</script></body></html>Please click "Click me" to produce the first
    array element.Click This ButtonTexasStrings are amazing, and they can help you
    in your programming ventures a great deal if you learn well the methods and properties.
    JavaScript programming is the easiest and the most flawless of all programming
    languages if you have a great eye for nuances.JavaScript ArraysJust like variables,
    JavaScript Arrays, too, are containers of values. However, they deviate from the
    properties of variables in the sense that they can hold more data than a variable
    in one name. So, whenever you need to load up more data in the same name, you
    should use arrays. There is more than one way to set up an array. The easiest
    of them is to use the var keyword, then write the name of the arrays, and give
    values. An array holds individual values in one variable. You have to separate
    them by comma and put them all inside square brackets. The equal sign must follow
    the name of the variable.When you have to access all the array values, you should
    use the index number just as you did in the strings. The number between the square
    brackets indicates the index. The number must correspond to the position of values
    in an array. The most important thing to remember is that the position of the
    index starts at 0.When you have created an array, you are good to go and run it
    in the web browser. You should be able to see the requisite value on the screen
    of your browser. You can edit the index number and insert something else to display
    a different value. Save the edited number and refresh the browser to change the
    results. If your array has three items and you put in the number 3 for the index,
    you will see that the browser will display the word ‘undefined’ on the computer
    screen. This happened because you had only three items in the array. When you
    typed 3 for the index, you attempted to display the fourth item which was not
    there. Rather than displaying errors, JavaScript adds a new position in the array,
    which is not yet defined. JavaScript adds the new position to the end of the array.
    It remains undefined until you fill it up with a reasonable value. You can use
    the new undefined position to store data as per your needs.<!DOCTYPE html><html><body><p>Learning
    JavaScript Arrays</p><p id="array-demo"></p><script>var carsforsale = ["Honda",
    "Toyota", "GTX", "Ford"];document.getElementById("array-demo").innerHTML = carsforsale;</script></body></html>Learning
    JavaScript ArraysHonda,Toyota,GTX,FordYou can see in the above-mentioned example
    that an array in JavaScript is a special kind of variable that holds multiple
    values at the same time. If you have a list of cars that you otherwise might have
    stored in multiple variables, you can use an array instead to pack it up with
    all the values and insert them in a web page. If you stored them in independent
    variables, you would have created four variables with different names. Now that’s
    4 cars, so you might think it is not a big deal to create four independent variables
    for these values. However, if you have 4000 values, it will be a problem to create
    independent variables for all of them. In this situation, the array comes to help.
    Similarly, if you have a hundred values and you must use them in a loop, independent
    variables will not help a great deal. Arrays are easier to work with because you
    can easily loop through them.Spaces or line breaks are not of much importance
    in JavaScript arrays. You can write them in different formats. See the following
    example, which has the same content as above but a different format.<!DOCTYPE
    html><html><body><p>Learning JavaScript Arrays</p><p id="array-demo"></p><script>var
    carsforsale = ["Honda","Toyota","GTX","Ford"];document.getElementById("array-demo").innerHTML
    = carsforsale;</script></body></html>Learning JavaScript ArraysHonda,Toyota,GTX,FordIt
    has the same result as the previous example. There is another method to create
    an array. This is called the JavaScript keyword ‘new.’ I will create an array
    by using the keyword new in the example given below.<!DOCTYPE html><html><body><p>Learning
    JavaScript Arrays</p><p id="array-demo"></p><script>var carsforsale = new Array("Honda",
    "Toyota", "GTX", "Ford");document.getElementById("array-demo").innerHTML = carsforsale;</script></body></html>Learning
    JavaScript ArraysHonda,Toyota,GTX,FordLet us analyze this new format and understand
    what is different in this. The first difference is the addition of the keyword
    new to the start of the array and right after the equal sign, followed by the
    keyword Array immediately next to the keyword New. Another prominent difference
    is the removal of square brackets and the addition of parentheses, but both methods
    work the same way. The second method is more complicated and extended. For the
    sake of simplicity, speed, and readability, you should opt for the first method
    that also is known as the array literal method.Index NumbersYou can access the
    items of the arrays by using the index number. As already mentioned, the index
    for the array starts at number 0\. In the following example, I will access the
    element that has the zero index.<!DOCTYPE html><html><body><p>Learning JavaScript
    Arrays</p><p id="array-demo"></p><script>var carsforsale = new Array("Honda",
    "Toyota", "GTX", "Ford");document.getElementById("array-demo").innerHTML = carsforsale[0];</script></body></html>Learning
    JavaScript ArraysHondaIndex numbers are helpful in the sense that they can aid
    in changing the values of the elements of the array. You can replace almost all
    elements of the array just by mentioning the index numbers.<!DOCTYPE html><html><body><p>Learning
    JavaScript Arrays</p><p id="array-demo"></p><script>var carsforsale = new Array("Honda",
    "Toyota", "GTX", "Ford");carsforsale[0] = "BMW"carsforsale[1] = "Mitsubishi"document.getElementById("array-demo").innerHTML
    = carsforsale;</script></body></html>Learning JavaScript ArraysBMW,Mitsubishi,GTX,FordArrays
    are considered special objects. If you use the typeof operator to check the type
    of arrays, you will get the word ‘object’ in return. But we must stick to the
    word arrays to describe JavaScript arrays. The reason is that JavaScript arrays
    use numbers for accessing elements and objects use names of the items to give
    you access to the same items.You can assign any value to an array. Whatever you
    can assign to a variable, you can assign to an array. You can mix up different
    types in the same arrays. Programmers more often prefer to give plural names to
    arrays like cities, countries, numbers, etc. The reason is that each array is
    a list of more than one item. Just like ordinary variables, you may declare one
    array only once.JavaScript variables may be dubbed as objects, while JavaScript
    arrays are dubbed as special objects because an array may contain different kinds
    of variables. You can fill up an array with objects, functions, and even arrays.
    Just like strings, the real strength of arrays is because of their rich properties
    and built-in methods.Array PropertiesThe first property to discuss is the length
    property. It returns the full length of an array, which contains all the elements
    of the array.<!DOCTYPE html><html><body><p>Learning JavaScript Arrays</p><p id="array-demo"></p><script>var
    carsforsale = new Array("Honda", "Toyota", "GTX", "Ford");document.getElementById("array-demo").innerHTML
    = carsforsale.length;</script></body></html>Learning JavaScript Arrays4You can
    build a loop through the items of an array to display all of them or use all of
    them in a program. One of the most common methods for creating a loop is the for
    loop.<!DOCTYPE html><html><body><p>These are JavaScript Arrays</p><p>I will use
    the for loop in the following code</p><p id="array-demo"></p><script>var carsforsale,
    msg, cLn, y;carsforsale = ["BMW", "Mitsubishi", "Honda", "Toyota"];cLn = carsforsale.length;msg
    = "<ul>";for (y = 0; y < cLn; y++) {msg += "<li>" + carsforsale[y] + "</li>";}msg
    += "</ul>";document.getElementById("array-demo").innerHTML = msg;</script></body></html>These
    are JavaScript ArraysI will use the for loop in the following code'
  toc: []
  trans: "\n`if` 语句是区分大小写的，因此关键字 `if` 和 `IF` 是两个不同的单词。如果你将 `if` 替换为 `IF`，你将在屏幕上看到一个错误。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<p>如果时间少于 15:00，我将显示 \"Have a Great\
    \ Day!\"：</p>\n<p id=\"if-demo\">Have a Savory Evening!</p>\n<script>if (new Date().getHours()\
    \ < 15) {document.getElementById(\"if-demo\").innerHTML = \"Have a Great Day!\"\
    ;}</script>\n</body>\n</html>\n```\n如果时间少于 15:00，我将显示 \"Have a Great Day!\"：Have\
    \ Have a Great Day!\n\n## else 语句\n你可以使用 `else` 语句来指定当条件为假时需要执行的代码。我将使用相同的代码并添加\
    \ `else` 语句，看看我们如何使用 `else` 语句来扩展我们的代码，使其更具交互性和用户友好性。现在用户将有两个选项，而不是死板的单一选项代码。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<p>我希望你点击下方的按钮根据当前时间显示问候语：</p>\n<button\
    \ onclick=\"FunctionX()\">点击我以显示问候语</button>\n<p id=\"ifelse-demo\"></p>\n<script>\n\
    function FunctionX() {var myhours = new Date().getHours();var mygreetings;if (myhours\
    \ < 15) {mygreetings = \"Have a Great Day\";} else {mygreetings = \"Have a Great\
    \ Evening. I hope you enjoy your dinner.\";}document.getElementById(\"ifelse-demo\"\
    ).innerHTML = mygreetings;}</script>\n</body>\n</html>\n```\n我希望你点击下方的按钮根据当前时间显示问候语：点击我以显示问候语\
    \ Have a Great Day\n\n你可以看到 `else` 语句完美地整合到了现有代码中。我冒昧地在代码中添加了一个交互式按钮，以便用户可以确切地知道需要做什么。当用户点击按钮时，他将收到一条问候他的消息。该消息将根据程序在你本地读取的时间进行结构化。这就是你如何在你的页面上构建一个交互式网页应用并吸引访问者的方法。此外，你的访问者也会喜欢他们被欢迎的方式。\n\
    \n## else if 语句\n你可以向代码中添加 `else-if` 语句，在第一个条件返回假时指定新条件。在接下来的示例中，我将添加两个以上的条件，看看它们是如何工作的，以及它们为我们的代码带来了多少改进。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<p>我希望你点击下方的按钮根据当前时间显示问候语：</p>\n<button\
    \ onclick=\"FunctionX()\">点击我以显示问候语</button>\n<p id=\"ifelse-demo\"></p>\n<script>\n\
    function FunctionX() {var mygreetings ;var mytime = new Date().getHours();if (mytime\
    \ < 8) {mygreetings = \"Have a Good Morning. I hope you have had a nutritious\
    \ breakfast. Get ready for work\";} else if (mytime < 15) {mygreetings = \"Have\
    \ a Great Day. Don't forget to eat your lunch.\";} else {mygreetings = \"Have\
    \ a Great Evening. Any special plans for dinner?\";}document.getElementById(\"\
    ifelse-demo\").innerHTML = mygreetings;}</script>\n</body>\n</html>\n```\n我希望你点击下方的按钮根据当前时间显示问候语：点击我以显示问候语\
    \ Have a Great Day. Don't forget to eat your lunch.\n\n这工作得非常完美。现在你的程序将在一天中的三个时间段显示问候消息。你可以根据业务需求定制消息，并使其更具交互性。有些编码员习惯于去掉大括号来编写\
    \ `if` 语句。这种做法是完全合法的；但执行起来有点困难。有些程序员会将初始大括号放在新的一行。另一种做法是将整个 `if` 语句写在一行上，这更容易实现，但当你回来研究程序结构时，会很难阅读。我建议你遵循与我在上面示例中使用的相同规则，这样你会发现编写和理解它也更容易。在大多数情况下，你可以用双等号\
    \ `==` 代替三等号。然而，你可能会发现一点微小的技术差异。\n\n编写 `if` 语句以及 `if` 语句的变体有许多格式。使用 `if` 语句进行编码的可能性是无限的。\n\
    \n## JavaScript switch 语句\n你可以使用 `switch` 语句对 JavaScript 条件执行不同的操作。它将帮助你在单个代码块上工作并执行它。编辑器对其进行一次评估，在值之间进行比较，并在匹配时执行该代码块。如果不匹配，则不会执行。接下来的程序将运行程序中的\
    \ `switch` 语句，并检查你的电脑以查看电脑日历上是哪一天，以及代码中同一天包含什么消息。它将运行一周中的所有七天，当它达到匹配项时，它将运行你已经关联到同一天的消息。看下面的代码。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<p id=\"switch-demo\"></p>\n<script>\n\
    var weekdays;\nswitch (new Date().getDay()) {\ncase 0:weekdays = \"the restful\
    \ Sunday\";\ncase 1:weekdays = \"the blue Monday\";\ncase 2:weekdays = \"the superstitious\
    \ Tuesday\";\ncase 3:weekdays = \"the hectic Wednesday\";\ncase 4:weekdays = \"\
    the overwhelming Thursday\";\ncase 5:weekdays = \"the joyful Friday\";\ncase 6:weekdays\
    \ = \"the sleepy Saturday\";}document.getElementById(\"switch-demo\").innerHTML\
    \ = \"Today is \" + weekdays + \".\" + Have a great day!\";</script>\n</body>\n\
    </html>\n```\nToday is superstitious Tuesday. Have a great day!\n\n在上面的代码中，你可能注意到了\
    \ `break` 关键字的。当代码遇到 `break` 关键字时，它会跳出 switch 块。跳出 switch 块会在 switch 块的执行上设置停止。如果你从\
    \ switch 块中排除 `break` 关键字，网络浏览器将执行下一个 case，即使值不匹配。因此，如果跳过 `break` 关键字，要准备错误。你可以将\
    \ `break` 关键字加到 switch 语句中。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\n\
    var weekdays;\nswitch (new Date().getDay()) {\ncase 0:weekdays = \"the restful\
    \ Sunday\";\ncase 1:weekdays = \"the blue Monday\";\ncase 2:weekdays = \"the superstitious\
    \ Tuesday\";\ncase 3:weekdays = \"the hectic Wednesday\";\ncase 4:weekdays = \"\
    the overwhelming Thursday\";\ncase 5:weekdays = \"the joyful Friday\";\ncase 6:weekdays\
    \ = \"the sleepy Saturday\";\ndefault:weekdays = \"I am desperately waiting for\
    \ the weekend because I have planned vacation.\";}document.getElementById(\"switch-demo\"\
    ).innerHTML = weekdays;</script>\n</body>\n</html>\n```\nI am desperately waiting\
    \ for the weekend because I have planned vacation. 你可能认为 `default` 只能放在代码的最后。然而事实并非如此。你可以将其插入代码的任何地方，即使在开头。它将正常工作。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar weekdays;\nswitch (new\
    \ Date().getDay()) {\ncase 0:weekdays = \"the restful Sunday\";\ncase 1:weekdays\
    \ = \"the blue Monday\";\ncase 2:weekdays = \"the superstitious Tuesday\";\ncase\
    \ 3:weekdays = \"the hectic Wednesday\";\ncase 4:weekdays = \"the overwhelming\
    \ Thursday\";\ncase 5:weekdays = \"the joyful Friday\";\ncase 6:weekdays = \"\
    the sleepy Saturday\";\ndefault:weekdays = \"I am desperately waiting for the\
    \ weekend because I have planned vacation.\";}document.getElementById(\"switch-demo\"\
    ).innerHTML = weekdays;</script>\n</body>\n</html>\n```\nI am desperately waiting\
    \ for the weekend because I have planned vacation.\n\n## 第五章：JavaScript 字符串和数组\n\
    我已经解释了什么是字符串以及你如何在脚本中使用它们。当你处理字符串时，可以使用一些方法。某些原始值没有方法或属性，因为它们不是对象。然而，JavaScript\
    \ 在执行属性和方法时会将原始值视为对象。你可以学习程序中使用的字符串的 `length`。\n\n```html\n<!DOCTYPE html>\n<html><body>\n\
    <p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于字符串长度的问题：</p>\n<p id=\"string-demo\"\
    ></p>\n<script>var msgX = \"I am about to leave for New York to start my own business.\"\
    ;var msgY = msgX.length;document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n\
    </body>\n</html>\n```\n这个字符串属性将回答关于字符串长度的问题。\n\n另一个 JavaScript 方法可以帮助你在字符串内部查找字符串。我在这里使用的方法叫做\
    \ `indexOf()`。如果你在另一个字符串内部指定了一个字符串，它将为你找到它。需要需要的重要说明是，你可以使用单引号在字符串内部创建另一个字符串。接下来的示例将解释如何这样做。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于字符串内部字符串的问题：</p>\n\
    <p id=\"string-demo\"></p>\n<script>var msgX = \"I am about to leave for 'New\
    \ York' to start my own business.\";var msgY = msgX.indexOf(\"New York\");document.getElementById(\"\
    string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串长度的问题。你可以看到内部字符串的索引已经显示在屏幕上。请记住\
    \ JavaScript 从零点开始索引索引。\n\n### `lastIndexOf()` 方法\n你可以使用 `lastIndexOf()` 方法查看\
    \ `New York` 最后一次出现的索引，它是我们指定的内部字符串。\n\n```html\n<!DOCTYPE html>\n<html><body>\n\
    <p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于字符串内部字符串的问题：</p>\n<p id=\"string-demo\"\
    ></p>\n<script>var msgX = \"I am about to leave for 'New York' to start my own\
    \ business.\";var msgY = msgX.lastIndexOf(\"New York\");document.getElementById(\"\
    string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串内部字符串的问题。\n\
    \n### 如果未找到索引？\n如果方法未找到索引，它们将返回 `-1`。这在你代码中编写错误的拼写或完全不同的单词时发生。\n\n```html\n<!DOCTYPE\
    \ html>\n<html><body>\n<p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于内部字符串的问题：</p>\n\
    <p id=\"string-demo\"></p>\n<script>var msgX = \"I am about to leave for 'New\
    \ York' to start my own business.\";var msgY = msgX.lastIndexOf(\"Washington\"\
    );document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n</body>\n\
    </html>\n```\n这个字符串属性将回答关于字符串内部字符串的问题。\n\n### `search()` 方法\n另一种方法是在长字符串中定位指定的内部字符串。如果匹配完美，你可以使用\
    \ `search()` 方法来查找。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX\
    \ = \"I am about to leave for 'New York' to start my own business.\";\nvar msgY\
    \ = msgX.search(\"New York\");document.getElementById(\"string-demo\").innerHTML\
    \ = msgY;\n</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串内部字符串的问题。\n\n### 提取\n\
    你可以根据程序需要将字符串分成许多部分。JavaScript 给了我们三种方法来分解字符串。第一个方法标记为 `slice()` 方法。它提取字符串的一部分并以新字符串的形式显示。你需要两个参数；一个是字符串的起始位置，另一个是结束位置。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to\
    \ leave for 'New York' to start my own business.\";\nvar msgY = msgX.slice(23,\
    \ 34);document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n</body>\n\
    </html>\n```\n这个字符串属性将回答关于字符串的问题。请记住 JavaScript 从 `0` 点开始计数。如果一个参数是负数，你必须从字符串的结尾开始计数。它将反向切分字符串。你可以尝试它并获得结果。我现在跳过它，测试忘记结束位置会发生什么。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to\
    \ leave for 'New York' to start my own business.\";\nvar msgY = msgX.slice(23);document.getElementById(\"\
    string-demo\").innerHTML = msgY;</\n</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串的问题。你可以看到它显示了文本的结尾。如果起始点是负数且结束点缺失，你将看到结果从结尾到切分点。\n\
    \n### `substring()` 方法\n第二个切割字符串并创建子字符串的方法是 `substring()` 方法。它与 `slice` 方法一样。不同在于它不接受负索引。看下面的示例来理解它的用法。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to\
    \ leave for 'New York' to start my own business.\";\nvar msgY = msgX.substring(23,\
    \ 34);document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n</body>\n\
    </html>\n```\n这个字符串属性将回答关于字符串的问题。\n\n第三个也是最后一个切割方法是 `substr()` 方法，它与 `slice()`\
    \ 非常相似。第二个参数定义了切分字符串剩余部分的长度。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\n\
    var msgX = \"I am about to leave for 'New York' to start my own business.\";\n\
    var msgY = msgX.substr(23, 34);document.getElementById(\"string-demo\").innerHTML\
    \ = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串的问题。\n\n### `replace()`\
    \ 方法\n当 JavaScript 允许你替换字符串内部的值时，它变得有趣。例如，示例中包含的字符串包含了 New York 作为我将访问的城市。JavaScript\
    \ 允许你更改城市名称，而不是编写新代码并创建新字符串。这在你创建长程序时节省了大量时间。该方法可以识别为 `replace()`。\n\n```html\n\
    <!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave for\
    \ 'New York' to start my own business.\";\nvar msgY = msgX.replace('New York',\
    \ 'Las Vegas');document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n\
    </body>\n</html>\n```\n我准备要去 'Las Vegas' 开始我的业务了。默认情况下，如果你写 `NEW YORK` 而不是 `New\
    \ York`，JavaScript `replace()` 将不起作用。它是区分大小写的，并且它识别不同的大小写。因此，如果发现方法不起作用，最好检查单词的大小写。此外，`replace()`\
    \ 方法只替换第一个匹配。如果字符串中有多个 New York，它将只替换第一个匹配并留下其余单词。如果你想忽略大小写，必须使用像 `/i` 这样的正则表达式让浏览器识别匹配项。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to\
    \ leave for 'New York' to start my own business.\";\nvar msgY = msgX.replace(/NEW\
    \ YORK/i, 'Las Vegas');document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n\
    </body>\n</html>\n```\n我准备要去 'Las Vegas' 开始我的业务了。如果你写 `NEW YORK` 而不是 `New York`，你可以看到\
    \ `replace()` 不起工作。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX\
    \ = \"I am about to leave for 'New York' to start my own business.\";\nvar msgY\
    \ = msgX.replace('NEW YORK', 'Las Vegas');document.getElementById(\"string-demo\"\
    ).innerHTML = msgY;</script>\n</body>\n</html>\n```\n我准备要去 'Las Vegas' 开始我的业务了。\n\
    \n### 拼接\n拼接是几乎所有编程语言的不可或的一部分。当需要连接两个或多个字符串时，程序员寻求拼接的支持。这是连接更多字符串的最简单方法。如果你代码写得好，`concat()`\
    \ 方法运行良好。最需要注意的是逗号和空格。`concat()` 方法是 `+` 运算符的替代方案——两者作为替代工作。接下来的练习将帮助你完成拼接过程。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msg1 = \"I have been promoted\
    \ as Chief Executive Officer of Skyfall.\";\nvar msg2 = \"I will call a board\
    \ meeting next week!\";\nvar msg3 = msg1.concat(\" \", msg2);document.getElementById(\"\
    string-demo\").innerHTML = msg3;\n</>\n```\n我已经晋升为 Skyfall 的首席执行官。下周将召开董事会议！\n\
    \n### 字符串数组\n字符串是神奇的，它们在你的编程活动中非常有帮助。像变量一样，JavaScript 数组也是值的容器。然而，它们与变量属性的区别在于，它们可以在一个名称中存储更多数据。因此，每需要在相同名称中加载数据时，你应该使用数组。设置数组有多种方法。最简单的是使用数组字面量方法，然后编写数组名称并在括号内给出值。等号必须跟在名称后面。你可以使用索引数访问数组项。如前所述，索引从数字\
    \ `0` 开始。在接下来的示例中，我将访问索引为零的元素。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\n\
    var carsforsale = new Array(\"Honda\", \"Toyota\", \"GTX\", \"Ford\");\ndocument.getElementById(\"\
    array-demo\").innerHTML = carsforsale[0];</script>\n</body>\n</html>\n```\nHonda,\
    \ Toyota, Ford.\n\n索引数是有用的，因为它们有助于更改数组元素的值。只需提及索引数就可以替换数组的所有元素。\n\n```html\n<!DOCTYPE\
    \ html>\n<html><body>\n<script>\nvar carsforsale = new Array(\"Honda\", \"Toyota\"\
    , \"GTX\", \"Ford\");\ncarsforsale[0] = \"BMW\";carsforsale[1] = \"Mitsubishi\"\
    ;document.getElementById(\"string-demo\").innerHTML = carsforsale;</script>\n\
    </body>\n</html>\n```\nHonda, Toyota, GTX, Ford.\n\n这与上一个示例的结果相同。另一种创建数组的方法。这被称为\
    \ JavaScript 关键字 `new`。我将在下面的示例中使用 `new` 关键字来创建一个数组。\n\n```html\n<!DOCTYPE html>\n\
    <html><body>\n<script>\nvar carsforsale = new Array(\"Honda\", \"Toyota\", \"\
    GTX\", \"Ford\");\ndocument.getElementById(\"array-demo\").innerHTML = carsforsale;</script>\n\
    </body>\n</html>\n```\nHonda, Toyota, GTX, Ford.\n\n我准备要去 'Las Vegas' 开始我的业务了。如果有多个单词需要替换，你需要再次使用正则表达式。这次正则表达式被标记为\
    \ `/g`，让浏览器识别匹配项。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX\
    \ = \"The NBA team will visit Las Vegas.\";\nvar msgY = msgX.replace(/Las Vegas/g,\
    \ 'Los Angeles');document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n\
    </body>\n</html>\n```\nNBA 队将访问洛杉矶。\n\n### 字符串数组\n标题可能看起来有些困惑。没有所谓的字符串数组。然而，有一种新方法可以将字符串转换为数组。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<p>请点击“这里”以产生第一个数组元素：</p>\n<button onclick=\"\
    FunctionX()\">点击此按钮</button>\n<p id=\"string-demo\"></p>\n<script>\nfunction FunctionX()\
    \ {var msg1 = \"Texas, Las Vegas, Los Angeles.\";var msg2 = msg1.split(\",\");document.getElementById(\"\
    string-demo\").innerHTML = msg2[0];}</script>\n</body>\n</html>\n```\nTexas\n\
