- fmt: "\nIf we talk about what is recommended of the two keywords, we may say that\
    \ the `let` keyword is the best option to consider when you are writing a program.\
    \ However, some browsers do not support the `let` keyword. Therefore, you may\
    \ feel the need to use the `var` keyword.\n\n# Chapter Three: JavaScript Constants\n\
    \nThe `const` keyword in JavaScript was introduced in `ES2015`. The variables\
    \ that are defined with the `const` keyword work as well as those that are defined\
    \ with the `let` keyword. The only difference is that you cannot reassign them.\
    \ Once you initialize a constant, you cannot change its value afterward. This\
    \ is what makes constant different from the `var` keyword. If you have to declare\
    \ a constant, you need to initialize it first.\n\nYou should think over for a\
    \ while whether you have to use a constant or not in a program. You should only\
    \ use it when you are sure that you will not have to change the value of the variable.\
    \ The name of a constant can be a legal identifier.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<p>You are learning JavaScript constants</p>\n<p>Keep in mind\
    \ that you cannot change primitive values.</p>\n<p id=\"const-demo\"></p>\n<script>\n\
    try {\n  const xyz = 89.141592653589793;\n  xyz = 54.14;\n} catch (err) {\n  document.getElementById(\"\
    const-demo\").innerHTML = err;\n}\n</script>\n</body>\n</html>\n```\n\nYou are\
    \ learning JavaScript constants\nKeep in mind that you cannot change primitive\
    \ values.\nTypeError: Assignment to constant variable.\n\n## Block Scope\n\nThe\
    \ declaration of variables by using the `const` keyword is similar to the declaration\
    \ by using the `let` keyword when you are using Block Scope. The following example\
    \ will explain how it inclines toward the `let` keyword and distances itself from\
    \ the `var` keyword.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>In this example,\
    \ I will be declaring a Variable by Using the const keyword</p>\n<p id=\"const-demo\"\
    ></p>\n<script>\nvar xyz = 15; // The value of xyz is 15\n{\n  const xyz = 1;\
    \ // The value of xyz is 1\n}\n// The value of xyz is 15\ndocument.getElementById(\"\
    const-demo\").innerHTML = xyz;\n</script>\n</body>\n</html>\n```\n\nIn this example,\
    \ I will be declaring a Variable by Using the const keyword\n15\n\nUnlike a variable\
    \ declared with the `var` keyword, constants must be assigned a value upon declaration.\
    \ You cannot the value section empty. The word constant is a bit confusing, if\
    \ not entirely misleading. The keyword `const` does not define constant values.\
    \ In reality, it defines constant references to the values you use in the equation.\
    \ That is why you cannot change the primitive values of constants. However, you\
    \ can change properties.\n\n### Primitive Values\n\nIf you give a constant a primitive\
    \ value, you will not be able to change the values later on.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<p>These are JavaScript constants</p>\n<p>Let try if\
    \ we can change primitive value.</p>\n<p id=\"const-demo\"></p>\n<script>\ntry\
    \ {\n  const xyz = 5556.175757557757793;\n  xyz = 3555.19090;\n} catch (err) {\n\
    \  document.getElementById(\"const-demo\").innerHTML = err;\n}\n</script>\n</body>\n\
    </html>\n```\n\nThese are JavaScript constants\nLet try if we can change primitive\
    \ value.\nTypeError: Assignment to constant variable.\n\nWhile you cannot change\
    \ the primitive values in JavaScript constants, you can change objects' properties.\
    \ In the following example, I will create an object with the keyword `const`,\
    \ and then I will introduce some changes to the properties of that object to see\
    \ if I can change them. See the example to get an idea of how it is done.\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript constants</p>\n<p>You\
    \ can change the properties of objects after Declaring them:</p>\n<p id=\"const-demo\"\
    ></p>\n<script>\n// I am going to create an object:\nconst mycar = {name:\"Honda\"\
    , model:\"Vezel\", make:\"Japan\", color:\"Grey\"};\n// Let us Change the property:\n\
    mycar.model = \"Civic\";\n// You also can add a new property:\nmycar.transmission\
    \ = \"Automatic\";\n// It is time to display your properties:\ndocument.getElementById(\"\
    const-demo\").innerHTML = \"I have a \" + mycar.name + \".\" + \" It is of \"\
    \ + mycar.color + \" color and its model label is \" + mycar.model + \". \" +\
    \ \"This car has \" + mycar.transmission + \".\";\n</script>\n</body>\n</html>\n\
    ```\n\nJavaScript Constants\nYou can change the properties of objects after Declaring\
    \ them:\nI have a Honda. It is of Grey color, and its model label is Civic. This\
    \ car has Automatic.\n\nYou saw that I changed the model from Vezel to Civic.\
    \ I also added new properties to describe the mode of transmission of the car.\
    \ This facilitates programmers as they can create an object and then add or change\
    \ properties as they deem fit as per changing needs. However, you cannot reassign\
    \ a different object to the same constant in a program. If you do that, you will\
    \ see an error.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Learning JavaScript\
    \ constants</p>\n<p>Prohibited: You cannot reassign a different object to the\
    \ same constant:</p>\n<p id=\"const-demo\"></p>\n<script>\ntry {\n  const mycar\
    \ = {name:\"Honda\", model:\"Vezel\", make:\"Japan\", color:\"black\"};\n  mycar\
    \ = {name:\"BMW\", model:\"Z1\", make:\"German\", color:\"red\"};\n} catch (err)\
    \ {\n  document.getElementById(\"demo\").innerHTML = err;\n}\n</script>\n</body>\n\
    </html>\n```\n\nLearning JavaScript constants\nProhibited: You cannot reassign\
    \ a different object to the same constant:\n\n### Constant Arrays\n\nYou can create\
    \ arrays with the `const` keyword, and you can change them as well.\n\n# Chapter\
    \ Four: Prompts and Conditionals\n\nA prompt box is used to ask a user to provide\
    \ information and give a response field for the answer. The code asks a user some\
    \ questions and then offers answers in the respective field for a response. You\
    \ can change the response. Whether you leave the default response as-is or change\
    \ it to something else, your response will be assigned to a variable.\n\nA prompt\
    \ code is akin to an alert code. However, there are two differences. For a prompt\
    \ code, you need to follow a method to receive a response from the user, which\
    \ means that you need to start the code by the declaration of a variable. After\
    \ that, you have to use an equal sign. In the prompt, you must specify a second\
    \ string, which is the default response that pops up in the field when you see\
    \ the display of the prompt. If a user leaves it as-is and instead clicks OK,\
    \ your default response will shift to a variable. However, you have the option\
    \ to declare a default response or not. You have the option to assigning the strings\
    \ to a specific variable, and then you need to specify variables rather than strings\
    \ within the parentheses.\n\nSome programmers use the line `window.prompt` instead\
    \ of simply writing `prompt`. This practice is formal and is considered the right\
    \ way to write it. However, as everyone is short on time, most coders prefer to\
    \ write prompt instead.\n\n## JavaScript if Statement\n\nIn this section, I will\
    \ explain how you have deal with different types of conditions. Let us suppose\
    \ you have a prompt that asks users the American president presently lives. Here\
    \ is the line that users see: “Where do you live?”If a user answers correctly,\
    \ you may display an alert that will congratulate him. If he enters something\
    \ else, the program returns nothing.\n"
