    ## Introduction

    This book contains proven steps and strategies on how to code in JavaScript. JavaScript
    is a scripted language. You will see a lot of script embedded in HTML tags. JavaScript
    cannot work alone so that when you want to run it, it works well in web browsers.
    You can open up a code editor, copy the code, and paste it in HTML to simply load
    up the page to the browser to see the results directly. Whether you are making
    websites or are a student who aspires to become a web developer, or are planning
    to build a website for your own business, this book is the best method to learn.
    Once you have gone through the first couple of chapters, you will be in the right
    mindset to move on and learn complex topics.


    ## Chapter One: An Introduction to JavaScript

    JavaScript is an interpreted language. Definition of the language is broader than
    the word. You can define it as a procedural language that is weakly typed, based
    on prototypes, and is dynamic and imperative. JavaScript is developed and implemented
    in the form of a client-side programming language part of the web browser and
    is seen as something that can facilitate developers for dynamic features and creation
    of user interface on the web pages. You may find some implementation of JavaScript
    on the server-side as well. However, the popularity of the JavaScript language
    is largely based on its applications on the client-side.


    ### The Developer of JavaScript

    JavaScript was initially designed in the same mold as the C language was designed,
    but it also takes some names. Brendan Eich developed JavaScript initially with
    the name `Mocha`. The name was changed later to `LiveScript`. Late on, it was
    changed again to `JavaScript`. This confused some people and gave the impression
    that the new language, namely JavaScript, was an offshoot of Java.


    ### The Use Cases of JavaScript

    JavaScript is at work at the client-side of most webpages around the world. When
    you open a webpage, and it had changed from when you previously opened it, well,
    those changes could have been made using JavaScript. Let me tell you something
    interesting. Open a web page on your screen. Right-click on the web page and then
    click on View Source. You will see the word JavaScript inside the code of the
    page. Do not confuse HTML with JavaScript because you may find the two in the
    code of the page.


    HTML is a markup language that allows developers to format the content and create
    a dynamic web page. You can turn the text into bold, create the boxes and tables
    of your choice, and add buttons to the page. However, JavaScript lets you alter
    the text, add pop-up messages, and validate the text you have entered through
    HTML coding. HTML and JavaScript walk side by side. Where JavaScript moves ahead
    of HTML is the way it makes the page dynamic and interactive. It will allow your
    users to click on certain elements and open new pages from the existing page.
    You should learn JavaScript because it is very easy to implement. All you need
    is to put the code in an HTML document and then instruct the browser to run it.
    JavaScript works on many computers and operating systems, even when the systems
    are offline. With JavaScript''s help, you can create responsive interfaces that
    refine user experience and offers extremely dynamic functionality. JavaScript
    allows users to load up content in the form of a document whenever the user needs
    it, and that too without putting the web page into a reload. We call the process
    Ajax. JavaScript allows you to run a test for existing possibilities in the browser
    and then react accordingly. The process is known as scripting. JavaScript will
    fix any problems that emerge on your web pages. It will cover up the holes that
    exist in the browser support. When we compare all that JavaScript can do for us
    with other programming languages for the web, we realize that it can do so much
    more. JavaScript is highly demanded and loved because it allows you to build complex
    applications without any hassle. You can build complex applications with Flash
    as well, but JavaScript is the best way to go because it is a web standard.


    ### The <script> Tag

    Let us talk about the symbol that is the most used tag in the book. All the JavaScript
    code is enclosed inside `<script>` tags.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>JavaScript rests</p>

    <p id="demo12"></p>

    <script>

    document.getElementById("demo12").innerHTML = "This is your First JavaScript";

    </script>

    </body>

    </html>

    ```

    The code above shows how you can change the element with `id="demo12"` to "This
    is your First JavaScript".


    ### JavaScript Rests in the Body

    This is your First JavaScript. The older type of JavaScript was written differently.
    It had the following format as `<script type="text/javascript">`. There are functions
    in JavaScript that you can use to execute blocks of code. You may call a function
    when some kind of event occurs. An event can be defined as a click.


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <script>

    function FunctionUN() {

    document.getElementById("demo34").innerHTML = "I have changed the Paragraph.";

    }

    </script>

    </head>

    <body>

    <p>This is a Paragraph.</p>

    <p id="demo34"></p>

    <button onclick="FunctionUN()">Click Me</button>

    </body>

    </html>

    ```

    The code above shows how to call `FunctionUN()` when the button is clicked.


    ### JavaScript seen in the Head

    This is a Paragraph. When you click the button on the web browser, you will trigger
    an invocation of the function. You also can put the script inside the `<body>`
    of the HTML page. The following code will deliver the same result.


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <script>

    function FunctionZ() {

    document.getElementById("demo1").innerHTML = "I have changed the Paragraph.";

    }

    </script>

    </head>

    <body>

    <p>This is a Paragraph.</p>

    <p id="demo1"></p>

    <button onclick="FunctionZ()">Click Me</button>

    </body>

    </html>

    ```

    The code above shows how to call `FunctionZ()` when the button is clicked.


    ### Display

    There are different methods to display JavaScript in web browsers. The first method
    that I used in the book is `document.getElementById(id)` method. In the phrase,
    `id` refers to the element that defines the HTML document. The word `innerHTML`
    defines the content of HTML.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>This is going to be my First Page</p>

    <p id="demo1234"></p>

    <script>

    document.getElementById("demo1234").innerHTML = 4567 + 36;

    </script>

    </body>

    </html>

    ```

    The code above shows how to use `document.getElementById("demo1234").innerHTML`
    to display `4567 + 36`. The second method that you can use is `document.write()`
    method. This is also a simple one. However, I have not created any script in the
    book by using this method except for this example to show how it works:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>This is going to be my First Page</p>

    <p id="demo1234"></p>

    <script>

    document.write(4567 + 36);

    </script>

    </body>

    </html>

    ```

    The code above shows how to use `document.write(4567 + 36)`. If you use this method
    after loading the HTML page, you will lose all data because it will be deleted.
    Therefore, you should beware of the consequences if you make this mistake. Also,
    you can create a button with this method and test the HTML page. See the following
    example:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>This is going to be my First Page</p>

    <p>This will be a Paragraph</p>

    <button onclick="document.write(335 + 6)">Click me</button>

    </body>

    </html>

    ```

    The code above shows how to use `document.write(335 + 6)` with a button. Another
    method is the `window.alert` method.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>This is going to be my First Page</p>

    <p id="demo1234"></p>

    <script>

    window.alert(4567 + 36);

    </script>

    </body>

    </html>

    ```

    The code above shows how to use `window.alert(4567 + 36)`. The above-mentioned
    text will be seen on the browser. Each time you run the code, you will see the
    result of the mathematical calculation on an alert window on the top of the screen.
    The use of the `window` keyword is optional. As the `window` object in JavaScript
    is global, you may drop its use and still get the same result. The following code
    will deliver the same result:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>This is going to be my First Page</p>

    <p id="demo1234"></p>

    <script>

    alert(4567 + 36);

    </script>

    </body>

    </html>

    ```

    Another method is the `console.log()` method. This method is used for debugging
    the code and then displaying the data.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>This is going to be my First Page</p>

    <p id="demo1234"></p>

    <script>

    console.log(4567 + 36);

    </script>

    </body>

    </html>

    ```


    ### Values

    In the world of computers, you will only see one thing that is data. You can read
    through the data, modify the data, and create new data. All this data is stored
    in the form of sequences that are fundamentally alike. Bits are two-valued things
    that are usually described as ones and zeros. If you rip open a computer, you
    will see that data takes multiple forms like low and high charge, weak or strong
    signal, or dull and shiny spots on a CD. A piece of discrete information may be
    reduced to a sequence of ones and zeros. As a result, they are represented as
    bits. You can express any number in the form of bits. However, instead of writing
    many digits, you only have two to produce the result. So, what are values? Just
    imagine an ocean of bits. A typical computer contains about 30 billion bits. The
    working memory is also known as volatile storage. The non-volatile storage that
    belongs to the hard disk stands equivalent to that. The representation of JavaScript
    uses 16 bits per element of the string. Unicode defines much more characters than
    this. Some characters like emoji consume two character positions.


    ### Numbers

    Values of the number are numeric values. In JavaScript, you will write it as follows:


    ```javascript

    var x = 10;

    ```

    The code above shows how to declare a numeric variable.


    ### Arithmetic

    The main point is that number is used in arithmetic. They are used to perform
    operations like addition and multiplications. The `+` is the symbol for addition,
    while `*` is the symbol for multiplication. Both symbols are known as operators.
    When you are programming, and you place an operator between two numbers, the order
    is determined based on precedents. For example, in normal circumstances, multiplications
    come first.


    ```javascript

    (500 + 100) * 500

    ```

    The code above shows the order of operations.


    ### Strings

    Another idea that you must learn before delving into JavaScript programming is
    the concept of strings. JavaScript strings represent text. You can write them
    by enclosing any piece of text inside quotes. See the following examples:


    ```javascript

    ''I am looking at the sun.''

    "I am going to take flight to Mars."

    `The weather is balmy, as April has started.`

    ```

    You use single quotes, double quotes, and backticks, as I have displayed in the
    above examples. Put each quote at the start or the end of the strings so that
    the code editor recognizes the text as strings. You can literally put anything
    inside the quotes, and JavaScript will turn it into a string. However, few characters
    of language are difficult to turn. The near-to-impossible thing to enclose inside
    strings is including a new line. Newlines appear when you press enter on the keyboard.
    You can do that without escaping when you use backticks. If you want to include
    unique characters to a string, you can use a backslash (\). A backslash indicates
    that the character that precedes is packed with a special meaning. The process
    is known as escaping the character. If backslash precedes a quote, it will not
    end the string, but will be included in the string. If you insert an `n` character
    following the backslash, it will be interpreted in the form of a newline. If you
    put a `t` character after the backslash, it alludes to a tab character. See the
    example of the following string:


    ```javascript

    "I will reach the moon\n And I travel onwards to Mars."

    ```

    What you will see on the web page will look like the following:

    I will reach the moon

    And I travel onwards to Mars


    You may come across a situation where you need a backslash inside a string just
    to be backslash and not any special code. If two backslashes tend to follow each
    other, they will definitely collapse. Just one will be left in the value of the
    resulting string. You have to model strings in the form of a series of bits so
    that they can exist on the computer. The way JavaScript executes it depends on
    Unicode standards. These standards tend to assign a specific number to each character
    you need, including the characters from Arabic, Greek, Armenian, and Japanese.
    If you have a number for each character, your string will be described by a specific
    sequence of numbers. That is how JavaScript executes the code. Still, you may
    face some kind of complication.


    The only difference in both kinds of strings is the use of escape characters in
    strings. When you write something in `${}`, the result will come as computed,
    then converted into a string, and then included at the same position.


    ### JavaScript Arrays

    JavaScript arrays can be identified with the help of square brackets. The items
    of arrays are filled up inside of square brackets and are separated by commas.
    See how we can declare arrays.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>Learn JavaScript Arrays</p>

    <p>The indices of JavaScript Arrays are zero-based. It means the first item in
    an array is [0].</p>

    <p id="array-demo"></p>

    <script>

    var carsArray = ["Volkswagen","Honda","Toyota", "Suzuki"];

    document.getElementById("array-demo").innerHTML = carsArray[0];

    </script>

    </body>

    </html>

    ```

    Learn JavaScript ArraysThe indices of JavaScript Arrays are zero-based. It means
    the first item in an array is [0].VolkswagenChapter Two: JavaScript VariablesLet
    us start with an example.

