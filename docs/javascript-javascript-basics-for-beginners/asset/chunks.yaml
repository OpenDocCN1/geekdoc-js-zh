    ## The splice() Method

    There is a `splice()` method in JavaScript to add or multiple elements in the
    array. The method also removes elements that are placed after it. I will use the
    same array that I used for the other methods so you can understand the difference
    among methods. The first digit in parentheses is the starting index for the addition
    or deletion. The second element shows the remaining elements to remove. You can
    use `splice` method for copying consecutive elements at any position you want
    and then adding them to a new array.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>JavaScript splice()</p>

    <p>I will use the splice() method to add new elements.</p>

    <button onclick="FunctionZZ()">Click Me</button>

    <p id="array-demo1"></p>

    <p id="array-demo2"></p>

    <script>

    var veggies = ["Pumpkin", "Ginger", "Tomato", "Potato"];

    document.getElementById("array-demo1").innerHTML = "You are seeing the original
    Array:<br>" + veggies;

    function FunctionZZ() {

    veggies.splice(3, 0, "Spinach", "Garlic ");

    document.getElementById("array-demo2").innerHTML = "You are seeing the new Array:<br>"
    + veggies;

    }

    </script>

    </body>

    </html>

    ```

