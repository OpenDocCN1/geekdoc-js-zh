- fmt: "\nIf you see an equal sign like ‘=`’ in JavaScript, you should not mistake\
    \ it as the one that is used in algebra. It has a different purpose. The information\
    \ that variables store may be used later on in a program you create. Scripts are\
    \ long, so variables make it easy to locate useful values. Variables facilitate\
    \ repeat use of a value in the same code. Instead of remembering the value, you\
    \ create a variable and fill it in with the value.\n\n# Datatypes\n\nJavaScript\
    \ variables may hold different types of information like digits and texts. Text\
    \ values in programming are named text strings. JavaScript may hold different\
    \ types of data. As I have already explained, strings must be written in single\
    \ and double quotes, whichever suits you. You write numbers without quotes. If\
    \ you use quotes for numbers, the browser will interpret it as a string.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <p>You are studying JavaScript Variables</p>\n\
    \  <p>I am defining JavaScript datatypes.</p>\n  <p id=\"variable-demo\"></p>\n\
    \  <script>\n    var num = 5555555.889;\n    var novelist = \"Charles Dickens\"\
    ;\n    var introduction = 'Charles Dickens wrote melodramatic novels!';\n    document.getElementById(\"\
    variable-demo\").innerHTML = num + \"<br>\" + novelist + \"<br>\" + introduction;\n\
    \  </script>\n</body>\n</html>\n```\nYou are studying JavaScript Variables\nI\
    \ am defining JavaScript datatypes.\n5555555.889\nCharles Dickens\nCharles Dickens\
    \ wrote melodramatic novels!\n\n# Declaration of Variables\n\nThe process of declaration\
    \ of a variable is, in fact, the process of creation of a variable. You might\
    \ have noticed in the above examples that I used the keyword `var` before each\
    \ variable. Without the `var` keyword, you cannot create a variable. Once you\
    \ have declared a variable, the variable will have no value. You have to assign\
    \ one to it just like I did in the examples. Here the equal sign `=` is used.\
    \ You thrust the sign in between the name of the variable and the value.\n\n##\
    \ The Undefined Variables\n\nIn different programs, you can often declare variables\
    \ without a value. The value may be something that you can calculate or something\
    \ that you can provide to it later on, like the user's input. A variable that\
    \ you declare without a value carries an ‘undefined’ value. I will use one of\
    \ the examples that I have already created and strip off the variables' value.\
    \ Let us use the latest example so that you can understand better.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <p>You are studying JavaScript Variables</p>\n\
    \  <p>I am defining JavaScript's undefined variables.</p>\n  <p id=\"variable-demo\"\
    ></p>\n  <script>\n    var num;\n    var novelist;\n    var introduction;\n  \
    \  document.getElementById(\"variable-demo\").innerHTML =;\n  </script>\n</body>\n\
    </html>\n```\nYou are studying JavaScript Variables\nI am defining JavaScript's\
    \ undefined variables.\n\n## Re-Declaration\n\nIt is possible that you have defined\
    \ and declared a variable but later on change your mind and make it undefined\
    \ by the process I just explained. So, will it make it undefined? The answer is\
    \ ‘N0.’ Making it undefined after declaration will not make the variable lose\
    \ its value.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>You are learning\
    \ JavaScript Variables</p>\n  <p>This is JavaScript's undeclared variables.</p>\n\
    \  <p id=\"variable-demo\"></p>\n  <script>\n    var num = 5555.444;\n    var\
    \ novelist = \"Charles Lamb\";\n    var introduction = \"Charles Lamb wrote beautiful\
    \ humor.\";\n    var num;\n    var novelist;\n    var introduction;\n    document.getElementById(\"\
    variable-demo\").innerHTML = num + \"<br>\" + novelist + \"<br>\" + introduction;\n\
    \  </script>\n</body>\n</html>\n```\nYou are learning JavaScript Variables\nThis\
    \ is JavaScript's undeclared variables.\n5555.444\nCharles Lamb\nCharles Lamb\
    \ wrote beautiful humor.\n\n# Arithmetic\n\nJavaScript, like other programming\
    \ languages, allows you to do mathematical calculations. You can add numbers,\
    \ produce results, and then forward the results to a variable for storage. In\
    \ the code, you can use the operators like `=` and `+`.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <p>JavaScript Arithmetic</p>\n  <p>This is JavaScript's\
    \ undeclared arithmetic.</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n   \
    \ var a = 15 + 3452 + 13 + 8 + 1;\n    document.getElementById(\"variable-demo\"\
    ).innerHTML = a;\n  </script>\n</body>\n</html>\n```\nJavaScript Arithmetic\n\
    This is JavaScript's undeclared arithmetic.\n3489\n\n## Subtraction\n\nThe next\
    \ arithmetic operator to be discussed is subtraction. The sign of the operator\
    \ is the same as is used in algebra. You can fill up the program with the numbers\
    \ of your choice and put the – sign in between to start the subtraction process.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>JavaScript Arithmetic</p>\n \
    \ <p>JavaScript subtraction.</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n\
    \    var a = 55;\n    var b = 40;\n    var c = a - b;\n    document.getElementById(\"\
    variable-demo\").innerHTML = c;\n  </script>\n</body>\n</html>\n```\nJavaScript\
    \ Arithmetic\nJavaScript subtraction.\n15\n\n## JavaScript String Concatenation\n\
    \nJust like you learned to add numbers, JavaScript allows you to concatenate strings.\
    \ I will use the `+` operator to join strings in the following example.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <p>JavaScript String Concatenation</p>\n  <p>JavaScript\
    \ datatypes.</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n    var a = \"Charles\
    \ Dickens\" + \"\" + \" wrote\" + \"\" + \" melodramatic novels!\";\n    document.getElementById(\"\
    variable-demo\").innerHTML = a + \"<br>\" + novelist + \"<br>\" + introduction;\n\
    \  </script>\n</body>\n</html>\n```\nJavaScript String Concatenation\nJavaScript\
    \ datatypes.\nCharles Dickens wrote melodramatic novels!\n\n# JavaScript Let Keyword\n\
    \nIn JavaScript, the `let` keyword aims at the declaration of variables. The `var`\
    \ keyword may also be used for the declaration of variables; however, the key\
    \ difference is in the scope of the two. The `var` keyword is based on function\
    \ scope, while the `let` keyword is based on block scope. Learning how to use\
    \ the `let` keyword is connected to the difference between the `var` keyword and\
    \ the `let` keyword.\n\n## Global Scope\n\nThe variables that you declare out\
    \ of functions.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>JavaScript Let\
    \ Keyword</p>\n  <p>You can access a GLOBAL variable working from any script or\
    \ any function.</p>\n  <p id=\"let-demo\"></p>\n  <script>\n    var cars = \"\
    BMW\";\n    function Function1() {\n      document.getElementById(\"let-demo\"\
    ).innerHTML = \"I plan to buy a \" + cars + \" for my commute.\";\n    }\n  </script>\n\
    </body>\n</html>\n```\nJavaScript Let Keyword\nYou can access a GLOBAL variable\
    \ working from any script or any function.\nI plan to buy a BMW for my daily.\n\
    \nYou may access global variables from any point inside of a JavaScript program.\
    \ The variables you will declare in the limits of functions. Global Scope.\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>These are JavaScript Scopes</p>\n\
    \  <p>I will define and declare a variable outside of `Function2()`.</p>\n  <p\
    \ id=\"let-demo1\"></p>\n  <p id=\"let-demo2\"></p>\n  <script>\n    function\
    \ Function2() {\n      var cars = \"BMW\";\n      document.getElementById(\"let-demo1\"\
    ).innerHTML = typeof cars + \" \" + cars;\n    }\n    document.getElementById(\"\
    let-demo2\").innerHTML = typeof cars;\n  </script>\n</body>\n</html>\n```\nThese\
    \ are JavaScript Scopes\nI will define and declare a variable outside of `Function2()`.\n\
    \n## Block Scope\n\nThe variables that you declare using the `var` keyword are\
    \ of Block Scope. Only the variables that you declare within the curly braces\
    \ may be accessed from out of the block. Block Scope was introduced in JavaScript\
    \ in ES2015. Before this period, it had no scope. While the variables with the\
    \ `var` keyword do not have Block Scope, the variables that you declare using\
    \ the `let` keyword can have Block Scope. The `var` keyword, in some cases, creates\
    \ problems for programmers. Especially when you attempt to redeclare a variable\
    \ by including the `var` keyword, you will see a bunch of problems popping up\
    \ in the editor. If you redeclare a variable within a block, you will also redeclare\
    \ it out of the same block. This will cause additional problems in the long run.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>This code snippet will declare\
    \ your variable with the `var` keyword</p>\n  <p id=\"let-demo\"></p>\n  <script>\n\
    \    var xyz = 10000; // You can see the value of xyz is 10000\n    { var xyz\
    \ = 1; // Now the redeclared value of xyz variable is 1\n    document.getElementById(\"\
    let-demo\").innerHTML = xyz;\n  </script>\n</body>\n</html>\n```\nThis code snippet\
    \ will declare your variable with the `var` keyword\nSo, you can see that we ran\
    \ into a big problem. With the `var` keyword, redeclaration can be a hassle to\
    \ grapple with. This is where the `let` keyword comes into play. It solves the\
    \ problem of redeclaration. If you have used the `let` keyword to declare a variable,\
    \ you will not have any problem when you redeclare the same variable. In the following\
    \ code, I will explain how the `let` keyword solves the problem of redeclaration.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>I will use the `let` keyword\
    \ now to redeclare a variable</p>\n  <p id=\"let-demo\"></p>\n  <script>\n   \
    \ var xyz = 1000; // The value of xyz variable is 1000\n    { let xyz = 1; //\
    \ Now the value of xyz is set at 1\n    // The let keyword will let the variable\
    \ xyz retain the previously declared value\n    document.getElementById(\"let-demo\"\
    ).innerHTML = xyz;\n  </script>\n</body>\n</html>\n```\nI will use the `let` keyword\
    \ now to redeclare a variable\n1000\nAs the `let` keyword was introduced later,\
    \ Internet Explorer 11 and the previous versions do not support it. Presently,\
    \ Chrome 49, Firefox 44, Opera 36, Edge 12, and Safari 11 support the use of the\
    \ `let` keyword. Both `var` and `let` keywords have different behaviors when it\
    \ comes to the use of JavaScript loops. See the following two examples to understand\
    \ the difference between the two keywords.\n\n### Example 1\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <p>The JavaScript let Keyword</p>\n  <p id=\"let-demo\"\
    ></p>\n  <script>\n    var xyz = 4;\n    for (var xyz = 0; xyz < 9; xyz++) {}\n\
    \    document.getElementById(\"let-demo\").innerHTML = xyz;\n  </script>\n</body>\n\
    </html>\n```\nThe JavaScript let Keyword\n9\n\n### Example 2:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <p>The JavaScript let Keyword</p>\n  <p id=\"let-demo\"\
    ></p>\n  <script>\n    let xyz = 4;\n    for (let xyz = 0; xyz < 9; xyz++) {}\n\
    \    document.getElementById(\"let-demo\").innerHTML = xyz;\n  </script>\n</body>\n\
    </html>\n```\nThe JavaScript let Keyword\n4\nIn the first example, when I used\
    \ the `var` keyword, the variable declared within the loop redeclares the `xyz`\
    \ variable from outside the loop. However, when I used the `let` keyword in example\
    \ 2, the variable declared inside the loop did not redeclare the one outside of\
    \ the loop. When you use `let` to declare `xyz` variable inside the `for` loop,\
    \ you will only see the `xyz` variable in the loop and never out of that. Both\
    \ `let` keyword and `var` keyword aim at declaring variables. However, before\
    \ you use them in creating JavaScript programs, you should understand the key\
    \ differences between the two.\n"
