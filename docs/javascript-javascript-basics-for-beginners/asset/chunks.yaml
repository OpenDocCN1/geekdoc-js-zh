    - JavaScript 的开发者\n- JavaScript 的用途\n- <script> 标签\n- 显示\n- 值\n- 数字\n- 算术\n- 字符串\n\
    - JavaScript 数组\n- 第二章：JavaScript 变量\n- JavaScript 标识符\n- 数据类型\n- 变量声明\n- 未定义变量\n\
    - 重复声明\n- 算术\n- JavaScript 字符串拼接\n- JavaScript Let 关键字\n- 第三章：JavaScript 常量\n\
    - 块级作用域\n- 原始值\n- JavaScript 常量\n- 第四章：提示与条件判断\n- JavaScript if 语句\n- else 语句\n\
    - else if 语句\n- JavaScript Switch 语句\n- 第五章：JavaScript 字符串与数组\n- lastIndexOf()\
    \ 方法\n- 如果未找到索引怎么办\n- search() 方法\n- JavaScript 数组\n- JavaScript Array concat()\n\
    - 数组排序\n- 反向排序\n- 数字排序\n- 比较函数\n- 随机排序\n- 数组值\n- 对象数组排序\n- JavaScript 迭代\n- 第六章：JavaScript\
    \ 循环\n- for/in 循环\n- forEach() 循环\n- for/of 循环\n- 死循环\n- JavaScript while 循环\n\
    - do/while 循环\n- JavaScript Break 和 Continue 语句\n- 第七章：JavaScript 函数\n- 函数的调用\n\
    - () 运算符\n- 变量函数\n- 本地变量\n- JavaScript 表达式\n- constructor()\n- 自执行\n- 函数或对象\n\
    - toString() 方法\n- 箭头函数\n- 参数与参数\n- 调用\n- 全局对象\n- 复用方法\n- 第八章：JavaScript 对象\n\
    - new 关键字\n- 对象属性\n- 删除\n- 日期\n- JavaScript 类\n- 传递参数\n- 类继承\n- 结论\n- 参考文献\n\n\
    © Copyright 2021 版权所有。未经作者直接书面许可，不得复制、复制或传输本书的内容。在任何情况下，出版社对因本文处信息直接或间接导致的任何赔偿、损害或资金损失不承担任何法律责任或指责。\n\
    \n**法律声明：** 本书受版权保护。本书仅供个人使用。未经作者同意，您不能修改、分发、销售、使用、引用或转述本书的任何部分或内容。\n\n**免责声明：**\
    \ 请注意，本文档包含的信息仅供教育和娱乐目的。我们已尽力提供准确、最新、可靠的完整信息。不提供任何形式的明示或暗示保证。读者承认作者并未提供法律、财务或医疗专业建议。本书内容源自多种来源。通过阅读本文，读者同意在任何情况下，作者对因使用本文信息而导致的任何直接或间接损失均不负责。\n\
    \n## 介绍\n本书包含了如何使用 JavaScript 编写代码的经过的步骤和策略。JavaScript 是一种脚本语言。你会在许多 HTML 标签中看到嵌入脚本。JavaScript\
    \ 不能独立工作，因此当你想要运行它时，它在网络浏览器中运行良好。你可以打开代码编辑器，复制代码并粘贴到 HTML 中，只需加载页面到浏览器即可直接看到结果。无论你是在制作网站，还是一个渴望成为\
    \ Web 开发者的学生，或者是计划为自己的业务建立网站，本书都是最好的学习方法。一旦你完成了前几章，你将做好心理准备，继续学习复杂的话题。\n\n## 第一章：JavaScript\
    \ 简介\nJavaScript 是一种解释型语言。该语言的定义比单词本身更宽泛。你可以将其定义为一种弱类型、基于原型、动态且命令式的过程化语言。JavaScript\
    \ 是作为网络浏览器部分的客户端编程语言的形式开发和实现的，被认为可以帮助开发者在网页上实现动态功能和创建用户界面。你可能在服务器端也能发现 JavaScript\
    \ 的实现。然而，JavaScript 语言的流行很大程度上取决于它在客户端的应用。\n\n### JavaScript 的开发者\nJavaScript\
    \ 最初的设计模式与 C 语言相似，但它也有过一些名称。Brendan Eich 最初开发 JavaScript 时使用的名为 `Mocha`。后来名字被改为\
    \ `LiveScript`。随后，它再次被改为 `JavaScript`。这让一些人困惑，并给人一种新语言（即 JavaScript）是 Java 的分支的印象。\n\
    \n### JavaScript 的用途\nJavaScript 工作在世界上大多数网页的客户端。当你打开一个网页，如果它与你上次打开时有所不同，那么这些变化可能是使用\
    \ JavaScript 完成的。让我告诉你一些趣事：在屏幕上打开一个网页。在网页上点击右键，然后点击“查看源代码”。会在页面代码中看到 JavaScript\
    \ 这个词。不要将 HTML 和 JavaScript 混淆，因为你可能会在页面代码中发现两者。\n\nHTML 是一种标记语言，允许开发者格式化内容并创建动态网页。你可以将文本变为加粗、创建框并根据你的选择在页面添加按钮。然而，JavaScript\
    \ 允许你修改文本、添加弹出框并验证通过 HTML 输入的文本。HTML 和 JavaScript 并行运行。JavaScript 的进步让页面变得动态且具有交互性。它允许用户点击某些元素并打开新页面。你应该学习\
    \ JavaScript，因为它非常容易实现。你只需要将代码放在 HTML 文档中让浏览器运行它。JavaScript 在许多计算机和操作系统上运行，即使是在离线状态。通过\
    \ JavaScript 的帮助，你可以创建响应式界面并提供极其动态的功能。JavaScript 允许用户在需要时加载内容，而无需将网页重新加载。这种过程被称为脚本。JavaScript\
    \ 将修复网页上出现的任何问题。当我们将与其他编程语言进行比较时，我们会发现它可以做很多。JavaScript 是高度受欢迎的，因为它允许你构建复杂的应用程序。你也可以使用\
    \ Flash 来构建复杂的应用程序，但它是 Web 的标准。\n\n### <script> 标签\n我们来谈谈书中最重要的标签符号。所有的 JavaScript\
    \ 代码都封装在 `<script>` 标签内。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript\
    \ rests</p>\n<p id=\"demo12\"></p>\n<script>\ndocument.getElementById(\"demo12\"\
    ).innerHTML = \"This is your JavaScript\";\n</script>\n</body>\n</html>\n```\n\
    上面的代码显示了如何通过 `id=\"demo12\"` 将元素改为 \"This is your JavaScript\"。\n\n### Body 中的\
    \ JavaScript \n这是你的第一个 JavaScript。旧版本的 JavaScript 写法不同。它的格式为 `<script type=\"\
    text/javascript\">`。JavaScript 中有函数可以执行代码块。当某些事件发生时你可以调用函数。事件可以定义为点击。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<script>\nfunction FunctionUN() {\ndocument.getElementById(\"\
    demo34\").innerHTML = \"I have changed the Paragraph.\";\n}\n</script>\n</head>\n\
    <body>\n<p>This is a Paragraph.</p>\n<p id=\"demo34\"></p>\n<button onclick=\"\
    FunctionUN()\">Click Me</button>\n</body>\n</html>\n```\n上面的代码显示了在点击按钮时调用 `FunctionUN()`。\n\
    \n### Head 中的 JavaScript\n在网络浏览器中点击按钮将触发函数的调用。你也可以将脚本放在 HTML 页面的 `<body>` 中。以下代码将交付相同的结果。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\nfunction FunctionZ() {\n\
    document.getElementById(\"demo1\").innerHTML = \"I have changed the Paragraph.\"\
    ;\n}\n</script>\n</head>\n<body>\n<p>This is a Paragraph.</p>\n<p id=\"demo1\"\
    ></p>\n<button onclick=\"FunctionZ()\">Click Me</button>\n</body>\n</html>\n```\n\
    上面的代码显示了在点击按钮时调用 `FunctionZ()`。\n\n### 显示\n有不同的方法在网络浏览器中显示 JavaScript。书中使用的第一个方法是\
    \ `document.getElementById(id)` 方法。在短语中，`id` 指定义 HTML 文档的元素。`innerHTML` 词定义了 HTML\
    \ 内容。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is going to be my First\
    \ Page</p>\n<p id=\"demo1234\"></p>\n<script>\ndocument.getElementById(\"demo1234\"\
    ).innerHTML = 4567 + 36;\n</script>\n</body>\n</html>\n```\n上面的代码显示了如何使用 `document.getElementById(\"\
    demo1234\").innerHTML` 显示 `4567 + 36`。你可以使用的第二个方法是 `document.write()` 方法。这也是一个简单的方法。然而，除了为了示例显示它是如何工作，我在书中没有使用这种方法创建任何脚本：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is going to be my First Page</p>\n\
    <p id=\"demo1234\"></p>\n<script>\ndocument.write(4567 + 36);\n</script>\n</body>\n\
    </html>\n```\n上面的代码显示了如何使用 `document.write(4567 + 36)`。如果你在加载 HTML 页面后使用这种方法，你将丢失所有数据，因为它们会被删除。因此，如果你犯了这个错误，应该注意后果。此外，你也可以这种方法创建一个按钮并测试\
    \ HTML 页面。看以下示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is going\
    \ to be my First Page</p>\n<p>This will be a Paragraph</p>\n<button onclick=\"\
    document.write(335 + 6)\">Click me</button>\n</body>\n</html>\n```\n上面的代码显示了如何使用\
    \ `document.write(335 + 6)` 配合按钮。另一个方法是 `window.alert` 方法。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<p>This is going to be my First Page</p>\n<p id=\"demo1234\"\
    ></p>\n<script>\nwindow.alert(4567 + 36);\n</script>\n</body>\n</html>\n```\n\
    上面的代码显示了如何使用 `window.alert(4567 + 36)`。每当你运行代码，你都会在屏幕顶部看到计算结果。`window` 关键字的使用是可选的。JavaScript\
    \ 中的 `window` 对象是全局的，你可以省略它并得到相同的结果。以下代码将交付相同的结果：\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<p>This is going to be my First Page</p>\n<p id=\"demo1234\"></p>\n\
    <script>\nalert(4567 + 36);\n</script>\n</body>\n</html>\n```\n另一个方法是 `console.log()`\
    \ 方法。该方法用于调试代码并显示数据。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This is going\
    \ to be my First Page</p>\n<p id=\"demo1234\"></p>\n<script>\nconsole.log(4567\
    \ + 36);\n</script>\n</body>\n</html>\n```\n\n### 值\n在计算机世界中，你只会看到一种数据。你可以通过读取数据、修改数据并创建新数据。所有这些数据以序列的形式存储。作为结果，它们表示为位。那么，值是什么？想象一下位。典型的计算机包含大约\
    \ 300 亿位。工作内存也被称为易失存储。非易失存储（属于硬盘）等于这些。JavaScript 的表示每个字符串元素使用 16 位。Unicode 定义了比这更多的字符。某些字符如\
    \ emoji 占用两个字符位置。\n\n### 数字\n数字的值是数值。在 JavaScript 中，你如下编写它：\n\n```javascript\n\
    var x = 10;\n```\n上面的代码显示了如何声明数字变量。\n\n### 算术\n关键点是数字用于算术。它们被用于执行加法和乘法等操作。`+`\
    \ 是加法的符号，而 `*` 是乘法的符号。这两个符号统称为运算符。当你编程时，在两个数字之间放置运算符，其顺序根据先例决定。例如，在正常情况下，乘法优先。\n\
    \n```javascript\n(500 + 100) * 500\n```\n上面的代码显示了操作顺序。\n\n### 字符串\n在深入 JavaScript\
    \ 编程之前，你必须学习的另一个概念是字符串。JavaScript 字符串表示文本。你可以通过在引号内包含文本来编写它们。看以下示例：\n\n```javascript\n\
    'I am looking at the sun.'\n\"I am going to take flight to Mars.\"\n`The weather\
    \ is balmy, as April has started.`\n```\n你使用了单引号、双引号和反引号。将每个引号放在字符串的开头或结尾，以便代码编辑器将文本识别为字符串。你可以字面上在引号内放入任何内容，JavaScript\
    \ 将其转换为字符串。然而，少数语言字符很难转换。字符串中几乎不可能包含的是换行。当按下键盘上的回车键时会出现换行。当你使用反引号时，不需要转义就可以这样做。如果你想向字符串包含特殊字符，可以使用反斜杠\
    \ (\\)。反斜杠表示前面的字符带有特殊含义。这个过程被称为字符转义。如果反斜杠在引号之前，它不会结束字符串，而是包含在字符串中。如果你在反斜杠后面插入\
    \ `n` 字符，它将被解释为换行。如果你在反斜杠后放 `t` 字符，它指的是制表符字符。看以下字符串的示例：\n\n```javascript\n\"I\
    \ will reach the moon\\n And I travel onwards to Mars.\"\n```\n你在网页上看到的将像下面：\n\
    I will reach the moon\nAnd I travel onwards to Mars\n\n你可能会遇到一种情况，在字符串内部需要一个反斜杠，仅仅作为一个反斜杠而不是任何特殊代码。如果两个反斜杠相邻，它们将确实合并。结果字符串值中只会下一个。你必须以位序列的形式对字符串建模，以便它们存在于计算机上。JavaScript\
    \ 的执行方式取决于 Unicode 标准。这些标准倾向于为每个字符分配一个特定的数字。\n\n"
