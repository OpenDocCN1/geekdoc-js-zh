    ## Fisher-Yates Method

    The problem with the `random` method is that it favors some numbers over others.
    There is another method that is more correct and useful than this one. It is commonly
    known as `Fisher-Yates` shuffle. The method was introduced in data science in
    the early days.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>JavaScript Array Sort</p>

    <h3>This is Fisher-Yates Method</h3>

    <p>When you click the button repeatedly, you will sort the array in random order.</p>

    <button onclick="FunctionXX()">Click Me</button>

    <p id="demo12"></p>

    <script>

    var nums = [404, 10023, 123, 589, 2511, 102];

    function FunctionXX() {

    var a, b, c;

    for (a = nums.length -1; a > 0; a--) {

    b = Math.floor(Math.random() * a)

    c = nums[a];

    nums[a] = nums[b];

    nums[b] = c;

    }

    document.getElementById("demo12").innerHTML = nums;

    }

    </script>

    </body>

    </html>

    ```

    When you click the button repeatedly, you will sort the array in random order.

    404, 102, 123, 589, 2511, 102


