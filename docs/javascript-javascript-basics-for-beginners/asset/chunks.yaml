    ## Shifting Arrays

    There is another method known as the `shift` method for removing elements from
    the arrays'' starting point. Let us suppose you have got an array. I will use
    the same veggies array to explain the concept of shifting in arrays. Contrary
    to the popping method, the shifting method will remove the first element from
    the array. While the `shift` method removes one element from the array, the `unshift`
    method removes one or more from the beginning of the array. With the removal of
    elements, there is a change in the index. All the other elements in the array
    will be shifted to lower indices after you use `shift` or `unshift` method. Once
    again, merely running the code in the browser will not remove the element from
    the start. You will have to hit the click button to trigger the change in the
    array. Also, if you keep clicking the button, and the browser will keep removing
    the elements from the array. This is how it will go end. The `shift()` method
    is highly flexible in the sense that you can get the removed elements inside a
    variable. You can then use them at your will and need.


